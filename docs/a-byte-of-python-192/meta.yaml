    which you can use in your own programs.


    To install and use these libraries, you can use Philip J. Eby''s Excellent Easytool
    (http://peak.telecommunity.com/DevCenter/EasyInstall#using-easy-install).


    # # Graphical Software


    Suppose you want to create your own graphical programs using Python. This can
    be done using a GUI (Graphical User Interface) library with your Python bindings.
    Bindings allow what you to write programs in Python and use the libraries which
    are themselves written in C or C++ or other languages.


    There are lots of choices for GUI using Python:


    # # PyQt


    This is the Python binding for the Qt toolkit which is the foundation upon which
    the KDE is built. Qt is extremely easy to use and very powerful especially due
    to the Qt Designer and the amazing Qt documentation. PyQt is free but you need
    to buy it if you want to create proprietary closed source software (GPL''ed).
    Starting with Qt 4.5 you can use to create non-GPL software as well. To get started,
    read the PyQt tutorial (http://zetcode.com/tutorials/pyqt4/) or the PyQt book
    (http://www.qtrac.com/pythonbook.html).


    # # PyGTK


    This is the Python bindings for GTK+ which is the foundation upon which GNOME
    is built. GTK+ has many quirks in usage but once you get become comfortable, you
    can create GUI apps fact. The Glade interface designer is indispensable. The documentation
    is yet to improve. GTK+ works well on Linux but its port to Windows is incomplete.
    You can create free as well as proprietary software using GTK+. To get started,
    read the PyGTK tutorial (http://www.pygtk.org/tutorial.html).


    # # wxPython


    This is the Python bindings for the wxWidgets toolkit. wxPython has a learning
    curve associated with it. However, it is very portable and runs on Linux, Windows
    and even embedded platforms. There are many IDEs available for wxPython which
    include GUI designers as well such as SPE (Stani''s Python Editor) (http://spe.pycs.net/)
    and'
  - '[PAGE 109]


    # Python:what Next


    the wxGlade (http://wxglade.sourceforge.net/) GUI builder. You can create as well
    as proprietary software using wxPython. To get started, read the wxPython tutorial
    (http://zetcode.com/wxpython/).


    # Tkinter


    This is one of the oldest GUI toolkits in existence. If you have used IDLE, you
    have a Tkinter program at work. It doesn''t have one of the best look & feel because
    it has an old-school look to it. Tkinter is portable and works on both Linux/Unix
    as Windows. Importantly, Tkinter is part of the standard Python distribution.
    To get started, read the Tkinter tutorial (http://www.python.com/library/tkinter/introduction/).


    For more choices, the GuiProgramming wiki page at the official python website
    (http://www.python.org/cgi-bin/''''''moin/GuiProgramming).


    # Summary of GUI Tools


    Unfortunately, there is no standard GUI tool for Python. I suggest that you choose
    one of the above tools depending on your situation. The first factor is whether
    you are willing to pay of use of the GUI tools. The second factor is whether you
    want the program to run only on Windows or Mac on Linux or all of them. The third
    factor, if Linux is a chosen platform, whether you are a KDE or GNOME user on
    Linux.


    For a more detailed and comprehensive analysis, see Page 26 of The Python Papers,
    Volume 3, Issue 1 (http://archive.pythonpapers.org/ThePythonPapersVolume3Issue1.pdf).


    # Various Implementations


    There are usually two ways a programming language - the language and the software.
    A language is how you write something. The software is what actually runs your
    programs.


    We have using the CPython software to run our programs. It is referred to as IPython
    because it is written in the C language and is the Classical Python interpreter.


    There are also other software that can run your Python programs:


    # Jython (http://www.jython.org)


    A Python implementation that runs on the Java platform. This means you can use
    Java libraries and classes from Python language and vice-versa.


    # IronPython (http:// / www. codplex.com/ Wiki/ View. aspx?ProjectName=IronPython)


    A Python implementation that runs on the .NET framework. This means you can use
    .NET libraries and classes from Python language and vice-versa.


    # PyPy (http://codespeak.net/pypy/dist/pypy/doc/home.html)


    A Python implementation written in Python! This is a research project to make
    it fast and easy to improve the interpreter since interpreter is written in a
    dynamic language (as opposed to static languages such as C, Java or C# in the
    three implementations)


    # Stackless Python (http://www.stackless.com)


    A Python implementation that is specialized for thread-based performance.'
  - '[PAGE 110]


    # Python en:What Next


    There are also others such as CLPython (http://common-lisp.net/project/clpython/)
    - a Python implementation written in Common Lisp and IronMonkey (http://wiki.mozilla.org/Tamarin:IronMonkey)
    which is a part of IronPython to work on a JavaScript interpreter which could
    mean you can use Python (instead of JavaScript) to write your web-browser("Ajax")
    programs.


    Each of these implementations have their specialized areas where they are useful.


    # Summary


    We have now come to the end of this book, but they say, this is the beginning
    of the end! You are now an avid Python user and you have no doubt ready to solve
    many problems using Python. You can start automating your computer to do all kinds
    of previously unimaginable things or write your own games and much much more.
    So, get started!


    Previous Next


    Source: http://www.swaroopch.com/mediawiki/index.php?oldid=1845

    Contributors: Swaroop, 2 anonymous edits


    # Python en:Appendix FLOSS


    # Free/Libre Open Source Software (FLOSS)


    FLOSS (http://en.wikipedia.org/wiki/FLOSS) is based on the concept of a community,
    which itself is based on the concept of sharing, and particularly the sharing
    of knowledge. FLOSS are free for use, modification and redistribution.


    If you have already read this book, then you are already familiar with FLOSS since
    you have been using Python all along and Python is an open source software!


    Here are some examples of FLOSS to give an idea of the kind of things that community
    sharing and building create:


    +   - Linux. This is a Linux operating system that the whole world is slowly embracing!
    It was started by Linux Torvalds as a now. It is giving competition to Microsoft
    Windows. [ Linux Kernel (http://www.kernel.org )]

    - Ubuntu. This is a community-driven distribution, sponsored by Canonical and
    it is the most popular Linux distribution today. It allows you to install a plethora
    of FLOSS available and all in an easy-to-use and easy-to-install manager. Best
    of all, you can just reboot your computer and run Linux off the CD! This allows
    you to try out the new OS before installing it on your computer. [ Ubuntu Linux
    (http://ubuntu.com )]

    - OpenOffice. This is an excellent office suite with writer, spreadsheet and drawing
    components many other things. It can open and edit MS Word and MS PowerPoint files
    with ease. It runs on almost all platforms. [ OpenOffice (http://www.openoffice.org
    )]

    - Mozilla Firefox. This is the next generation web browser which has gained great
    competition to Internet Explorer. It is blatantly fast and has gained critical
    acclaim for its sensible and impressive features. The extensions allow any kind
    of plugins to be used.'
