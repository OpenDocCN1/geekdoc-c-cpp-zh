    \ ShortInputException(len(text), 3)\n    # Other work can continue as usual here\n\
    except EOFError:\n    print('Why did you do that an EOF on me?')\nexcept ShortInputException\
    \ as ex:\n    print('The input was {0} long, expected at least {1}')\\'\n    \
    \    .format(ex.length, ex.atleast))\nelse:\n    print('No exception was raised.')\n\
    ```\n\nOutput:\n\n```\npython raising.py\nEnterter something -> a\n```"
  - "[PAGE 95]\n\n# ShortInputException: The input was 1 long, expected at least 3\n\
    \n```\n$ python raising.py\nEnter something --> abc\nNo exception was raised.\n\
    ```\n\nHow It Works:\n\nHere, we are creating our own exception type. This new\
    \ exception type is called ShortInputException. This has two fields - length which\
    \ is the length of the given input, and atleast which is the minimum length that\
    \ the program was expecting.\n\nIn the except clause, we mention the class of\
    \ error which will be stored as the variable name to hold the corresponding error/exception\
    \ object. This is analogous to parameters and arguments in a function call. With\
    \ this particular except clause, we use the length and atleast fields of the exception\
    \ object to print an appropriate message to the user.\n\n# Try ..Finally\n\nSuppose\
    \ you are reading a file in your program. How do you ensure that the file object\
    \ is closed properly whether or not an exception was raised? This can be done\
    \ using the finally block. Note that you can use an except clause along with a\
    \ finally block for the same try block. You will have to embed one within another\
    \ if you want to use both.\n\n```\n#/usr/bin/python\n# Filename: finally.py\n\
    ```\n\n```\nimport time\n\ntry:\n    f = open('poem.txt')\n    while True: # our\
    \ usual file-reading idiom\n        line = f.readline()\n        if len(line)\
    \ == 0:\n            break\n        print(line, end='')\n        time.sleep(2)\
    \ # To make sure it runs a while\nexcept KeyboardInterrupt:\n    print('!! You\
    \ cancelled the reading from the file.')\nfinally:\n    f.close()\n    print('(Cleaning\
    \ up: Closed the file')\n```\n\nOutput:\n\n```\n$ python finally.py\nProgramming\
    \ is fun\nWhen the work is done\nIf you wanna make your work also fun:\n!! You\
    \ cancelled the reading from the file.\n```"
  - "[PAGE 96]\n\n# Python en:Exceptions\n\n(Cleaning up: Closed the file)\n\nHow\
    \ It Works:\n\nThe usual file-reading stuff, but we have arbitrarily introduced\
    \ sleeping for 2 seconds after printing each line using the time.sleep function\
    \ so that the program runs slowly (Python is very fast by nature). When the program\
    \ is still running, press ctrl-c to interrupt/cancel the program.\n\nObserve that\
    \ the KeyboardInterrupt exception is thrown and the program quits. However, before\
    \ the program exits, the finally clause is executed and the file object is always\
    \ closed.\n\n# The with statement\n\nAcquiring a resource in the try block and\
    \ subsequently releasing the resource in the finally block is a common pattern.\
    \ Hence, there is also a statement that enables this to be done in a clean manner:\n\
    \n```\n#!/usr/bin/python\n# Filename: \"poem.txt\"\n\nwith open(\"poem.txt\")\
    \ as f:\n    for line in f:\n        print(line, end='')\n```\n\nHow It Works:\n\
    \nThe output should be the same as the previous example. The difference here is\
    \ that we are using the open function with the statement - we leave the closing\
    \ of the file to be done automatically by open.\n\nWhat happens behind the scenes\
    \ is there is a protocol used by the with statement. It fetches the object returned\
    \ by the open statement, let's call it \"thefile\" in this case.\n\nIt always\
    \ calls thefile. _enter_ function before starting the block of code under it and\
    \ always calls thefile.\n\nSo the code that we have written in a finally block\
    \ is to take care of automatically by the _exit_ method. This is what helps us\
    \ to avoid having to use explicit.finally statements repeatedly.\n\nMore discussion\
    \ on this topic is beyond scope of this, so please refer PEP 343 (http://www.python.org/dev/peps/pep-0343/)\
    \ for comprehensive explanation.\n\n# Summary\n\nWe have discussed the usage of\
    \ the try..except and try..finally statements. We have seen how to create our\
    \ own exception types and how to raise exceptions as well.\n\nNext, we will explore\
    \ the Python Standard Library.\n\nPrevious Next\n\nSource: http://www.swaroopch.com/mediawikiwiki/index.php?oldid=1470\n\
    \nContributors: Swaroop, 2 anonymous edits"
- md: "\n## Python Standard Library\n\n### Introduction\n\nThe Python Standard Library\
    \ contains a huge number of useful modules and is part of every standard Python\
    \ installation. It is important to become familiar with the Python Standard Library\
    \ since many problems can be solved quickly if you are familiar with the range\
    \ of things that this library can do.\n\nWe will explore some of the commonly\
    \ used modules in this library. You can find complete details for all of the modules\
    \ in the Python Standard Library in the 'Library Reference' section (http://docs.python.org/dev/3.0/library/)\
    \ of the documentation that comes with your Python installation.\n\nLet us explore\
    \ a few useful modules.\n\n### Note\n\nIf you find the topics in this chapter\
    \ too advanced, you may skip this chapter. However, I highly recommend coming\
    \ back to this chapter when you are more comfortable with programming using Python.\n\
    \n## sys module\n\nThe sys module contains system-specific functionality. We have\
    \ already seen that the sys.argv list contains the command-line arguments.\n\n\
    Suppose we want to check the version of the Python command being used so that,\
    \ we say, we want to ensure that we are using at least version 3. The sys module\
    \ gives us such functionality.\n\n```python\n>>> import sys\n>>> sys.version_info\n\
    (3, 0, 0, 'beta', 2)\n>>> sys.version_info[0] >= 3\nTrue\n```\n\nHow It Works:\n\
    \nThe sys module has a version_info tuple that gives us the version information.\
    \ The first entry is the major version. We can check this to, for example, ensure\
    \ the program runs only under Python 3.0:\n\n```python\n#!/usr/bin/python\n# Filename:\
    \ versioncheck.py\nimport sys, warnings\nif sys.version_info[0] < 3:\n    warnings.warn('Need\
    \ Python 3.0 for this program to run',\n    RuntimeWarning)\nelse:\n    print('Proceed\
    \ as normal')\n```\n\nOutput:\n\n```bash\n$ python2.5 versioncheck.py\nversioncheck.py:\
    \ RuntimeWarning: Need Python 3.0 for this program\nto run\nRuntimeWarning\n\n\
    $ python3 versioncheck.py\nProceed as normal\n```\n\nHow It Works:\nWe use another\
    \ module from the standard library called warnings that is used to display warnings\
    \ to the end-user. If the Python version number is not at least 3, we display\
    \ a corresponding warning.\n\n## logging module\n\nWhat if you wanted to have\
    \ some debugging messages or important messages to be stored somewhere so that\
    \ you can check whether your program has been running as you expect it? How do\
    \ you \"store somewhere\" these messages? This can be achieved using the logging\
    \ module.\n\n```python\n#!/usr/bin/python\n# Filename: use_logging.py\nimport\
    \ os, platform, logging\n\nif platform.platform().startswith('Windows'):\n   \
    \ logging_file = os.path.join(os.getenv('HOME'), 'test.log')\nelse:\n    logging_file\
    \ = os.path.join(os.getenv('HOME'), 'test.log')\n```\n\n```python\nlogging.basicConfig(\n\
    \    level=logging.DEBUG,\n    format='%(asctime)s : %(levelname)s : %(message)s',\n\
    \    filename = logging_file,\n    filemode='w')\n```\n\n```python\nlogging.debug(\"\
    Start of the program\")\nlogging.info(\"Doing something\")\nlogging.warning(\"\
    Dying now\")\n```\n\nOutput:\n\n```bash\n$ python use_logging.py\nLogging to C:\\\
    Users\\swaroop\\test.log\n```\n\nIf we check the contents of test.log, it will\
    \ look something like this:\n\n```\n2008-09-03 13:18:16,233 : DEBUG : Start of\
    \ the program\n2008-09-03 13:18:16,233 : INFO : Doing something\n2008-09-03 13:18:16,233\
    \ : WARNING : Dying now\n```\n\nHow It Works:\n\nWe use modules from the standard\
    \ library - the os module for interacting with the operating system, the platform\
    \ module for information about the operating system and the logging module to\
    \ log information.\n\nFirst, we check operating system we are using by checking\
    \ the string returned by platform.platform() (for more information, see import\
    \ platform; help(platform)). If it is Windows, we figure out the home directory,\
    \ the home folder and the filename where we need to store the information. Putting\
    \ these three parts together, we get the full location of the file. For other\
    \ platforms, we need to know just the home folder of the user and we get the full\
    \ location of the file.\n\nWe use the os.path.join() function to put these three\
    \ parts together. The reason to use this special function rather than adding strings\
    \ is because this function will ensure the location matches the format expected\
    \ by the operating system. We configure the logging module to write all the messages\
    \ meant for debugging or even critical messages. Once the program has run, we\
    \ can check this file and see what happened displayed to the user.\n\n## urllib\
    \ and json modules\n\nHow much would it be if we could write our program to get\
    \ search results from the web? This can be achieved using a few modules. First\
    \ is the urllib module that we can use to fetch any webpage from the internet.\
    \ We will make use of Yahoo to get search results and likely give us the results\
    \ in JSON format which is easy for us to parse the built-in json module in the\
    \ standard library.\n\nTODO\n\nThis program doesn't work yet which seems to be\
    \ a bug in Python 3.0.\n\n```python\n#!/usr/bin/python\n# Filename: yahoo_search.py\n\
    \nimport sys\nif sys.version_info[0] != 3:\n    sys.exit('This program needs Python\
    \ 3.0')\n\nimport json\nimport urllib.parse, urllib.request\n\nclass YahooSearchError(Exception):\n\
    \    pass\n\n# Taken from http://developer.yahoo.com/python-json.html\ndef search(query,\
    \ results=20, start=1, **kwargs):\n    update({\n        'appid': YAHOO_APP_ID,\n\
    \        'query': query,\n        'results': results,\n        'start': start,\n\
    \        'output': 'json'\n    })\n    url = SEARCH_BASE + '?' + urllib.parse.urlencode(kwargs)\n\
    \    result = json.load(urllib.request.urlopen(url))\n    if 'Error' in result:\n\
    \        raise YahooSearchError(result['Error'])\n    return result\n\nquery =\
    \ input('What do you want to search for? ')\nfor result in search(query):\n  \
    \  print(\"{0} : {1}\".format(result['Title'], result['Url']))\n```\n\nOutput:\n\
    \nThe search results from a particular website by giving the text we are searching\
    \ for. We have to specify many options which we combine using key1=value1&key2=value2\
    \ format which is handled by the urllib.parse.urlencode().\n\nFor example, open\
    \ this link in your web browser (http://search.yahooapis.com/WebSearch/V1/searchQuery?query=byte+of+python&appid=YOUR_APP_ID&results=20&start=1&output=json).\
    \ You need to get your own APP ID and you will see 20 results, starting from the\
    \ first result, for the words \"byte of json\", and we are asking for the output\
    \ in JSON format.\n\nWe make a connection to this URL using urllib.request.urlopen()\
    \ function and pass that file handle to json.load() which will read the content\
    \ and simultaneously convert it to a Python object. We then loop through these\
    \ results and display it to the end-user.\n\n### Module of the Week Series\n\n\
    There is much more to be explored in the standard library such as debugging (http://docs.python.org/dev/library/pdb.html),\
    \ handling command line options (http://docs.python.org/dev/3.0/getopt.html),\
    \ regular expressions (http://www.divepython.org/regular_expressions/index.html)\
    \ and so on.\n\nThe best way to explore the standard library is to read Doug Hellmann's\
    \ excellent Module of the Week (http://www.doughellmann.com/projects/PyMOTW/)\
    \ series.\n\n### Summary\n\nWe have explored some of the functionality of many\
    \ modules in the Python Standard Library. It is highly recommended to browse through\
    \ the Python Standard Library documentation (http://docs.python.org/dev/3.0/library/)\
    \ to get an idea of all the modules that are available.\n\nNext, we will cover\
    \ various aspects of Python that will make our tour of Python complete.\n\n##\
    \ More\n\n### Introduction\n\nSo far we have covered majority of the various aspects\
    \ of Python that you will use. In this chapter, we will cover more aspects that\
    \ will make our knowledge of Python more well-rounded.\n\n### Passing tuples around\n\
    \nEver wished you could return two different values from a function? You can.\
    \ All you have to use a tuple.\n\n```python\n>>> get_error_details():\n    return\
    \ (2, 'second error details')\n...\n>>> errnum, errstr = get_error_details()\n\
    >>> errnum\n2\n>>> errstr\n'second error details'\n```\n\nNotice the usage of\
    \ it, b = <some expression> interprets the result of the expression as a tuple\
    \ with two values.\n\nIf you want to interpret the results as (a, <everything\
    \ else>), then you just need to star it just like you would in in function parameters:\n"
  mdcn: "\n\n## Python 标准库\n\n### 简介\n\nPython 标准库包含了大量的有用模块，并且是每个标准 Python 安装程序的一部分。熟悉\
    \ Python 标准库是非常重要的，因为如果你对该库可以实现的功能了如指掌，就可以快速解决很多问题。\n\n我们将探索该库中一些常用的模块。你可以在 Python\
    \ 安装程序中附带的文档的“库引用”部分（http://docs.python.org/dev/3.0/library/）中找到 Python 标准库中所有模块的完整详细信息。\n\
    \n让我们来探索几个实用的模块。\n\n### 注意事项\n\n如果你觉得这一章的主题太高级，可以跳过这一章。不过，我强烈建议在你对使用 Python 编程感到更加熟练时再回到这一章。\n\
    \n## sys 模块\n\nsys 模块包含了与系统特定的功能。我们已经看到 `sys.argv` 列表包含了命令行参数。\n\n假设我们想检查正在使用的\
    \ Python 命令版本，例如，我们想确保我们至少在使用版本 3。`sys` 模块为我们提供了这种功能。\n\n```python\n>>> import\
    \ sys\n>>> sys.version_info\n(3, 0, 0, 'beta', 2)\n>>> sys.version_info[0] >=\
    \ 3\nTrue\n```\n\n工作原理：\n\n`sys` 模块有一个 `version_info` 元组，它为我们提供版本信息。第一个元素是主版本号。我们可以检查它，例如，确保程序只运行在\
    \ Python 3.0 下：\n\n```python\n#!/usr/bin/python\n# Filename: versioncheck.py\n\
    import sys, warnings\nif sys.version_info[0] < 3:\n    warnings.warn('Need Python\
    \ 3.0 for this program to run',\n    RuntimeWarning)\nelse:\n    print('Proceed\
    \ as normal')\n```\n\n输出：\n\n```bash\n$ python2.5 versioncheck.py\nversioncheck.py:\
    \ RuntimeWarning: Need Python 3.0 for this program\nto run\nRuntimeWarning\n\n\
    $ python3 versioncheck.py\nProceed as normal\n```\n\n工作原理：\n我们使用了标准库中的另一个名为 `warnings`\
    \ 的模块，它用于向用户显示警告。如果 Python 版本号至少为 3，我们就会显示相应的警告。\n\n## logging 模块\n\n如果你想把一些调试信息或重要信息存储在某个地方，以便检查程序是否按照你的预期运行该怎么办？你如何将这些信息“存储在某个地方”？可以使用\
    \ `logging` 模块来实现。\n\n```python\n#!/usr/bin/python\n# Filename: use_logging.py\n\
    import os, platform, logging\n\nif platform.platform().startswith('Windows'):\n\
    \    logging_file = os.path.join(os.getenv('HOME'), 'test.log')\nelse:\n    logging_file\
    \ = os.path.join(os.getenv('HOME'), 'test.log')\n```\n\n```python\nlogging.basicConfig(\n\
    \    level=logging.DEBUG,\n    format='%(asctime)s : %(levelname)s : %(message)s',\n\
    \    filename = logging_file,\n    filemode='w')\n```\n\n```python\nlogging.debug(\"\
    Start of the program\")\nlogging.info(\"Doing something\")\nlogging.warning(\"\
    Dying now\")\n```\n\n输出：\n\n```bash\n$ python use_logging.py\nLogging to C:\\\
    Users\\swaroop\\test.log\n```\n\n如果我们检查 `test.log` 的内容，它看起来像这样：\n\n```\n2008-09-03\
    \ 13:18:16,233 : DEBUG : Start of the program\n2008-09-03 13:18:16,233 : INFO\
    \ : Doing something\n2008-09-03 13:18:16,233 : WARNING : Dying now\n```\n\n工作原理：\n\
    \n我们使用了标准库中的模块 - 用于与操作系统交互的 `os` 模块，用于操作系统信息的 `platform` 模块，以及用于记录信息的 `logging`\
    \ 模块。\n\n首先，我们通过检查 `platform.platform()` 返回的字符串来检查我们正在使用的操作系统（更多信息，请参见 `import\
    \ platform; help(platform)`）。如果是 Windows，我们就确定主目录、主文件夹以及我们需要存储信息的文件名。通过将这三部分结合在一起，我们就得到了文件的完整位置。对于其他平台，我们只需要知道用户的主目录即可得到文件的完整位置。\n\
    \n我们使用 `os.path.join()` 函数将这三部分结合在一起。使用这个特殊函数而不是拼接字符串的原因是，该函数将确保路径符合操作系统预期的格式。我们配置\
    \ `logging` 模块来写入所有用于调试的甚至是关键的消息。一旦程序运行，我们就可以检查此文件并查看显示给用户的内容。\n\n## urllib 和\
    \ json 模块\n\n如果我们能编写程序从网络上获取搜索结果，那有多方便？这可以通过几个模块来实现。首先是 `urllib` 模块，我们可以用它从互联网上获取任何网页。我们将利用\
    \ Yahoo 获取搜索结果，它可能以 JSON 格式给我们提供结果，方便我们使用标准库中内置的 `json` 模块进行解析。\n\nTODO\n\n此程序目前无法工作，似乎是\
    \ Python 3.0 的一个 bug。\n\n```python\n#!/usr/bin/python\n# Filename: yahoo_search.py\n\
    \nimport sys\nif sys.version_info[0] != 3:\n```\n\n"
