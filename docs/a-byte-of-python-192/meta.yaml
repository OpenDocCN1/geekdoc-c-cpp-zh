  md: "# The Solution\n\nAs the design of our program is now reasonably stable, we\
    \ can write the code which is an implementation of our solution.\n\n```\n#!/usr/bin/python\n\
    # Filename: backup_ver1.py\n\nimport os\nimport time\n```\n\n+   # 1. The files\
    \ and directories to be backed up are specified in a list.\nsource = ['C:\\\\\
    My Documents', 'C:\\\\Code']\n# Notice we had to use double quotes inside the\
    \ string to check for names with spaces in it.\n# 2. The backup must be stored\
    \ in a main backup directory\ntarget_dir = 'E:\\Backup' # Remember to change this\
    \ to what you will be using\n# 3. The files are backed up into a zip file.\n#\
    \ 4. The name of the zip archive is the current date and time\ntarget = target_dir\
    \ + os.sep + time.strftime('%Y%m%d%H%M%S') + '.zip'\n# 5. We use the zip command\
    \ to put the files in a zip archive\nzip_command = \"zip -qr {0} {1}\".format(target,\
    \ ' '.join(source))\nif os.system(zip_command) == 0:\n    print('Successful backup\
    \ to', target)\nelse:\n    print('Backup FAILED')\n\nOutput:\n$ python backup_ver1.py\n\
    Successful backup to E:\\Backup\\20080702185040.zip\n\nNow, we are in the testing\
    \ phase where we test that our program works properly. If it doesn't behave as\
    \ expected, we have to debug our program remove the bugs (errors) from the program.\n\
    If the above program does not work for you, print a (zip_command) just before\
    \ the os.system call and run the program. Copy/paste the printed zip command to\
    \ the shell prompt and see if it runs properly. If this command fails, check the\
    \ zip command manual on what could be wrong. If this command succeeds, check the\
    \ Python program if it exactly matches the program written above.\n\nHow It Works:\n\
    You will notice how we have converted our design into code in a step-by-step manner."
