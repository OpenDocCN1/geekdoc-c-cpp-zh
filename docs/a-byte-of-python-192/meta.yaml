  md: '# Python en:Object Oriented Programming


    # Introduction


    In all the programs we wrote till now, we designed our program around functions
    i.e. blocks of statements which manipulate data. This is called the procedure-oriented
    way of programming. There is another way of organizing your program which is to
    combine data and functionality and wrap it inside something called an object.
    This is called the object oriented programming paradigm. Most of the time writing
    large programs or having a problem that is better suited to this method, you can
    use object oriented programming techniques.


    Classes and objects are the two main aspects of object oriented programming. A
    class creates a new type where objects are instances of the class. An analogy
    is that you can have variables of type int which translates to saying that store
    integers are variables are instances (objects) of the int class.


    Note for Static Language Programmers


    That even integers are treated as objects (of the int class). C++ and Java (before
    version 1.5) where integers are primitive native types. see help(int) for more
    details on the class.


    C# and Java 1.5 programs will find this similar to the boxing and unboxing concept.


    Objects can store data using ordinary variables that belong to the object. Variables
    that belong to an object or class are referred to as fields. Objects also have
    functionality using functions that belong to class. Such functions are called
    methods of the class. This terminology is important because it helps us differentiate
    between functions and variables which are independent and those which belong to
    a class or object. Collectively, the fields and methods can be referred to as
    the attributes of that class.


    Fields are of two types - they can belong to each instance/object of the class
    or they can belong to the class itself. They are called instance variables and
    class variables respectively.


    A class is created using the class keyword. The fields and methods of the class
    are listed in an indented block.


    # The self


    Class methods have only one specific difference from ordinary functions - they
    must have an extra first name that has be added to the beginning of the parameter
    list, but you do not give a value for this parameter when you call the method,
    Python will provide it. This particular variable refers to the object itself,
    and by convention, it is given the name self.


    Although, you can use any name for this parameter, it is strongly recommended
    that you use the name self - any other name is definitely frowned upon. There
    are many advantages to using a standard name - any reader of your program will
    immediately recognize it even specialized IDEs (Integrated Development Environments)
    can help you use self.'
