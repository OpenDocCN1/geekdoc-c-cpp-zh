    programmer. Read the complete interview (http://www.artima.com/inv/aboutme.html)
    for more details.


    - Peter Novartis (thanks to Guido Rossum for pointing that out). He says that
    Python has always been an integral part of Google. You can actually verify this
    statement by looking at the Google Jobs (http://www.google.com/jobs/index.html)
    page which lists Python knowledge as a requirement for software engineers.


    ## About Python 3.0


    Python 3.0 is the new version of the language. It is sometimes referred to as
    Python 3000 or Py3.


    The main reason for a major new version of Python is to remove all the small problems
    and nitpicks that have accumulated over the years and to make the language even
    more clean.


    If you already have a list of Python 2.x code, then there is a utility to assist
    you to convert 2.x to 3.x source (http://docs.python.org/dev/3.0/library/2to3.html).


    More details are:


    - Guido Rossum''s introduction (http://www.artima.com/weblogs/viewpost.jsp/thread=208549)

    - What''s New in Python 2.6 (http://docs.python.org/dev/whatsnew/2.6.html) (features
    significantly different from previous Python 2.x versions and most likely will
    be included in Python 3.0)

    - What''s New in Python 3.0 (http://docs.python.org/dev/3.0/whatsnew/3.0)

    - Python 2.6 and 3.0 Release Schedule (http://www.python.org/dev/peps/pep-0361/)

    - Python 3000 (the official authoritative list of proposed changes) (http://www.python.org/dev/peps/pep-3000/)

    - Miscellaneous Python 3.0 Plans (http://www.python.org/dev/peps/pep-3100/)

    - Python News (detailed list of changes) (http://www.python.org/download/releases/3.NEWS.txt)


    ## Previous Next


