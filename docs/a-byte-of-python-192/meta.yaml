    # Tuple


    Tuples are used to hold together multiple objects. Think of them as similar to
    lists, but without the extensive functionality that the list class gives you.
    One major feature of tuples is that they are **immutable** like strings i.e. you
    cannot modify tuples.


    Tuples are defined by specifying items separated by commas within an optional
    pair of parentheses.


    Tuples are usually used in cases where a statement or a user-defined function
    can safely assume that the control of values i.e. the tuple values used will not
    change.


    Example:


    ```

    #!/usr/bin/python

    # Filename: using_tuple.py


    zoo = (''python'', ''elephant'', ''penguin'') # remember the parentheses

    optional

    print(''Number of animals in the new zoo'', len(zoo))


    new zoo = (''monkey'', ''camel'', zoo)

    print(''Number of animals in new zoo are'', len(new zoo))

    print(''Animals brought from old zoo are'', new_zoo[2])

    print(''Last animal brought from old zoo is'', new_zoo[2][2])

    print(''Number of animals in the new zoo is'',

