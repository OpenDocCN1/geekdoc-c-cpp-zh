    \        print('Hello, my name is ', self.name)\n```\n\np = Person('Swaroop')\n\
    p.sayHi()\n\n输出：\n\n```\n$ python class_init.py\nHello, my name is Swaroop\n```\n\
    \n### 工作原理：\n\n在这里，我们定义的 `__init__` 方法接收一个参数 `name`（连同通常的 `self`）。在这里，我们只是创建了一个也叫\
    \ `name` 的新字段。注意，尽管它们被称为 \"name\"，但它们是两个不同的变量。点符号符号允许我们区分它们。\n\n最重要的是，注意我们并没有显式地调用\
    \ `__init__` 方法，而是在创建类的新实例时，将括号中的参数传递给类。这就是该方法的特殊意义。\n\n现在，我们可以在方法中使用 `self.name`\
    \ 字段，这在 `sayHi` 中已经得到了演示。\n\n## 类变量和对象变量\n\n我们已经讨论了部分和对象（即方法）的功能，现在让我们学习数据部分。数据部分（即字段）无非是绑定到类和对象命名空间的变量。这意味着这些名称在这些类和对象的上下文中是合法的。这就是为什么它们被称为命名空间。\n\
    \n字段有两种类型 - 类变量和对象变量，根据它们是由类还是对象拥有的进行分类。类变量是共享的 - 它们可以被该类的所有实例访问。类变量只有一个副本，当其中一个对象对变量进行更改时，该更改对所有其他实例都是可见的。\n\
    \n对象变量是由类的每个单独对象/实例拥有的。在这种情况下，每个对象都有该字段的独立副本，即它们不是共享的，并且与不同实例中具有相同名称的字段没有任何关系。一个示例将使这变得易于理解：\n\
    \n```python\n#!/usr/bin/python\n# Filename: objvar.py\n\nclass Robot:\n    \"\"\
    \"代表一个机器人，有一个名字。\"\"\"\n    # 类变量，统计机器人数量\n    population = 0\n\n    def __init__(self,\
