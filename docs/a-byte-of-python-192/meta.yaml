- md: "\n## Object Methods\n\nWe have already discussed that classes/objects can have\
    \ methods just like functions except that we have an extra self variable. We will\
    \ now see an example.\n\n```python\n#!/usr/bin/python\n# Filename: method.py\n\
    \nclass Person:\n    def sayHi(self):\n        print('Hello, how are you?')\n\
    ```\n\np = Person()\np.sayHi()\n\n# This short example can also be written as\
    \ Person().sayHi()\n\nOutput:\n\n```\n$ python method.py\nHello, how are you?\n\
    ```\n\n### How It Works:\n\nHere we see the self in action. Notice that the sayHi\
    \ method takes no parameters but still has the self in the function definition.\n\
    \n## The __init__ method\n\nThere are many method names which have special significance\
    \ in Python classes. We will see the significance of the __init__ method now.\n\
    \nThe __init__ method is run as soon as an object of a class is instantiated.\
    \ The method is useful to do any initialization you want to do with your object.\
    \ Notice the double underscores both at the beginning and at the end of the name.\n\
    \nExample:\n\n```python\n#!/usr/bin/python\n# Filename: class_init.py\n\nclass\
    \ Person:\n    def __init__(self, name):\n        self.name = name\n    def sayHi(self):\n\
    \        print('Hello, my name is ', self.name)\n```\n\np = Person('Swaroop')\n\
    p.sayHi()\n\n# This short example can also be written as Person('Swaroop').sayHi()\n\
    \nOutput:\n\n```\n$ python class_init.py\nHello, my name is Swaroop\n```\n\n###\
    \ How It Works:\n\nHere, we define the __init__ method as taking a parameter name\
    \ (along with the usual self). Here, we just create a new field also called name.\
    \ Notice these are two different variables even though they are called 'name'.\
    \ The dotted notation allows us to differentiate between them.\n\nMost importantly,\
    \ notice that we do not explicitly call the __init__ method but pass the arguments\
    \ in the parentheses to the class when creating a new instance of the class. This\
    \ is the special significance of this method.\n\nNow, we are able to use the self.name\
    \ field in our methods which is demonstrated in the sayHi.\n\n## Class And Object\
    \ Variables\n\nWe have already discussed the functionality of parts and objects\
    \ (i.e. methods), now let us learn about the data part. The data part, i.e. fields,\
    \ are nothing but variables that are bound to the namespaces of the classes and\
    \ objects. This means these names are valid within the context of these classes\
    \ and objects. That's why they are called name spaces.\n\nThere are two types\
    \ of fields - class variables and object variables which are classified depending\
    \ on whether the class or the object owns them. Class variables are shared - they\
    \ can be accessed by all instances of that class. There is only one copy of the\
    \ class variable and when one object makes a change to a variable, that change\
    \ will be seen by all the other instances.\n\nObject variables are owned by each\
    \ individual object/instance of the class. In this case, each object has its own\
    \ copy of the field i.e. they are not shared and are not related in any way to\
    \ the field by the same name in a different instance. An example will make this\
    \ easy to understand:\n\n```python\n#!/usr/bin/python\n# Filename: objvar.py\n\
    \nclass Robot:\n    \"\"\"Represents a robot, with a name.\"\"\"\n    # A class\
    \ variable, counting the number of robots\n    population = 0\n\n    def __init__(self,\
    \ name):\n        \"\"\"Initializes the data.\"\"\"\n        self.name = name\n\
    \        print('Initializing {}'.'.format(self.name))\n\n        # When this person\
    \ is created, the robot\n        # adds to the population\n        Robot.population\
    \ += 1\n\n    def __del__(self):\n        '''I am dying.'''\n        print('{0}\
    \ is being destroyed!'.format(self.name))\n\nRobot.population = 1\n\nif Robot.population\
    \ == 0:\n    print('{0} was the last one.'.format(self.name))\nelse:\n    print('There\
    \ are still {0:d} robots working.'.format(Robot.population))\n\ndef sayHI(self):\n\
    \    '''Greeting by the robot.'''\n    # They can do that.\n    print('Greetings,\
    \ my masters call me {0}.'.format(self.name))\n\ndef howMany():\n    '''Prints\
    \ the current population.'''\n    print('We have {0:d} robots.'.format(Robot.population))\n\
    \nhowMany = staticmethod(howMany)\n\ndroid1 = Robot('R2-D2')\ndroid1.sayHI()\n\
    Robot.howMany()\n\ndroid2 = Robot('C-3PO')\ndroid2.sayHI()\nRobot.howMany()\n\n\
    print(\"Robots can do some work here\")\nprint(\"Robots have finished their work.\
    \ Let's destroy them.\")\ndel droid1\ndel2\n\nRobot.howMany()\n\nOutput:\n\n```\n\
    (Initializing R2-D2)\nGreetings, my masters call me R2-D2.\nWe have 1 robots.\n\
    (Initializing C-3PO)\nGreetings, my masters call me C-3PO.\nWe have 2 robots.\n\
    ```\n\n### How It Works:\n\nThis is a long example but helps demonstrate the nature\
    \ of class and object variables. Here, population belongs to the Robot and hence\
    \ a class variable. The name belongs to the object (it is assigned self) and hence\
    \ an object variable.\n\nThus, we refer to the population class variable as Robot.population\
    \ and not as self.population. We refer to the object variable using self.name\
    \ in the methods of that object. Remember this difference between class and object\
    \ variables. Also note that an object with the same name as a class will have\
    \ the class variable!\n\nWe can define it as either a classmethod or a staticmethod:\n\
    \n```python\n@staticmethod\ndef howMany():\n    '''Prints the current population.'''\n\
    \    print('We have {0} robots.'.format(Robot.population))\n```\n\nDecorators\
    \ can be a shortcut to making an explicit statement, as we have seen in this example.\
    \ Observe that the __init__ method is used to initialize the Robot instance with\
    \ a name. In this method, we increase the population count by 1 because more robot\
    \ being added. Also observe that the values of self.name is specific to each object\
    \ which indicates the nature of object variables. Remember, you must refer to\
    \ the variables and methods of the same object using self only. This is called\
    \ attribute reference.\n\nIn this program, we also see the use of docstrings for\
    \ classes as well as methods. We can access the docstring at runtime using Robot.__doc__\
    \ and the method docstring as sayHi.__doc__. Just like the __init__ method, there\
    \ is another special method __del__ which is called when an object is going to\
    \ die i.e. it is no longer used and being returned to the computer system for\
    \ reusing that piece of memory. In this method, we simply decrease the Robot.population\
    \ count by 1.\n\n## Python: Object Oriented Programming\n\nThe __del__ method\
    \ is run when the object is no longer in use and there is no guarantee when that\
    \ method will be run. If you want to explicitly set it in action, we have to use\
    \ the del statement as we have done here.\n\n## Note for C++/Java/C# Programmers\n\
    \nAll classes (including the data members) are public and all the methods are\
    \ virtual in Python. One exception: If you use data members with names using the\
    \ double underscore prefix as __private__, Python uses name mangling to effectively\
    \ make it a private variable.\n\nThe convention followed is that any variable\
    \ to be used only within the class or object begins with an underscore and all\
    \ other names are public and can be used by other classes/objects. Remember that\
    \ this is only a convention and is not enforced by Python (except for the double\
    \ underscore).\n\n## Inheritance\n\nOne of the benefits of object oriented programming\
    \ is reuse of code and one of the ways this is achieved through the inheritance\
    \ mechanism. Inheritance can be best imagined as implementing a type and subtype\
    \ relationship between classes.\n\nSuppose you want to write a program that keeps\
    \ track of the teachers and students in a college. They have common characteristics\
    \ such as name, age and address. They also have specific characteristics such\
    \ as salary, courses and leaves for teachers, marks and fees for students.\n\n\
    You can create two independent classes for each type and process them by adding\
    \ a new common characteristic would mean adding to both of these independent classes.\
    \ This quickly becomes unwieldy.\n\nA better way would be to create a common class\
    \ SchoolMember and have the teacher and student classes inherit from this class\
    \ i.e. they will become subtypes of this type (class) and then we can add specific\
    \ characteristics to these subtypes.\n\nThere are many advantages to this approach.\
    \ If we add/change any functionality in SchoolMember, this is automatically reflected\
    \ in the subtypes. For example, you can add a new ID card for both teachers and\
