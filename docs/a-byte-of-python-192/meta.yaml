    # Sequences


    Lists, tuples and strings are examples of sequences, but what are sequences and
    what is so special about them?


    The major features are that they have membership tests (i.e. the in and not in
    expressions) and indexing operations. The indexing operation allows us to fetch
    a particular item in the sequence directly.


    The three types of sequences mentioned above - lists, tuples and strings, also
    have a slicing operation which allows us to retrieve a slice of the sequence i.e.
    a part of the sequence.


    Example:


    ```

    !#/usr/bin/python

    # Filename: seq.py


    list = [''apple'', ''mango'', ''carrot'', ''banana'']

    name = ''swaroop''


    # Indexing or Subscription operation

    print(''Item 0 is'', shoplist[0])

    print(''Item 1 is'', shoplist[1])

    print(''Item 2 is'', shoplist[2])

    print(''Item 3 is'', shoplist[3])

    print(''Item -1 is'', shoplist[-1])

    print(''Item -2 is'', shoplist[-2])

    print(''Character 0 is'', name[0])

    ```


    ```

    # Slicing on a list

    print(''Item 1 to 3 is'', shoplist[1:3])

    print(''Item 2 to end is'', shoplist[2:] )

    print(''Item 1 to -1 is'', shoplist[1:-1])

    print(''Item 1 start to end is'', shoplist[:])

    ```


