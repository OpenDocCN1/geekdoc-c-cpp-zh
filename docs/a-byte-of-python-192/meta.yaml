- md: '

    ## Using A Source File


    Now let''s get back to programming. There is a tradition that whenever you learn
    a new programming language, the first program that you write and run is the ''Hello
    World'' program - all it does is just ''Hello World'' when you run it. As Simon
    Cozens [11] puts it, it is the ''traditional incantation to the programming gods
    to help you learn the language better''.


    Start your choice of editor, enter the following program and save it as helloworld.py.


    If you are using IDE, click on File -> New Window and enter the following program.
    Click on File -> Save.


    ```python

    #!/usr/bin/python

    #Filename: helloworld.py


    print(''Hello World'')

    ```


    Run this program by opening a shell (Linux terminal or DOS prompt) and entering
    the command python helloworld.py.


    If you are using IDE, use the menu Run -> Module or the keyboard shortcut F5.

    The output is as shown below.


    > $ python helloworld.py

    Hello World


    If you got the output as shown above, congratulations! - you have successfully
    run your first Python program.


    In case you get an error, please type the above program *exactly* as shown above
    and run the program again. Note that Python is case-sensitive, i.e. print is not
    the same as Print - note the lowercase p in the former and the uppercase P in
    the latter. Also, ensure there are no spaces or tabs before the first character
    in each line - we will see why this is important later.


    ## How It Works


    Let us consider the first two lines of program. These are called *comments* -
    anything to the right of the # symbol is a comment and is mainly used as notes
    for the reader of the program.


    Python does not use comments except for the special case of the first line here.
    It is called the *shebang line* - whenever the first two characters of the source
    file are #! followed by the location of a file, this tells your Linux/Unix system
    that this program should be run with this interpreter when you *execute the program*.
    This is explained in detail in the next section. Note that you can always run
    the program on any platform by specifying the interpreter directly on the command
    line such as command python helloworld.py.


    ## Important


    - Use comments sensibly in your program to explain some details of your program
    - this is useful for readers of your program so that they can easily understand
    what the program is doing. Remember, that person can be yourself after six months!


    The comments are followed by a Python *statement*. Here we can use the print *function*
    which just prints the text ''Hello World''. We will learn about functions in a
    later chapter, what you should understand now is whatever you supply in the parentheses
    will be printed back to the screen. In this case, we supply ''Hello World'' which
    is referred to as a string - don''t worry, we will explore these terminologies
    in detail later.


    ## Executable Python Programs


    This applies only to Linux/Unix but Windows users might be curious as well about
    the first line of the program. First, we have to give the program executable permission
    using the chmod command then we run the source program.


    ```bash

    $ chmod a+x helloworld.py

    $ ./helloworld.py

    Hello World

    ```


    The chmod command is used here to change the mode of the file by executing permission
    to all users of the system. Then, we execute the program directly by specifying
    the location of the source file. We use the ./ to indicate that the program is
    located in the current directory.


    To make things more fun, you can rename the file to helloworld and run it ./helloworld
    and it will still work the system that knows it has to run the program using the
    interpreter whose location is specified in the first line in the source file.


    What if you don''t know where Python is located? Then, you can use the special
    env path to change the first line of the program to the following:


    ```python

    #!/usr/bin/env python

    ```


    The env program will in turn look for the Python interpreter which will run the
    program. So far, we have been able to run the program from anywhere. Want to?
    You can do this by storing the program in one of the directories listed in the
    PATH environment variable. Whenever you run any program, the system looks for
    path in each of the directories listed in the PATH environment variable and then
    runs that program. We can make this program available everywhere by simply copying
    this source file to one of the directories listed in PATH.


    ```bash

    $ echo $PATH

    /local/bin:/usr/bin:/usr/X11R/bin:/home/swaroop/bin

    $ cp helloworld.py /home/swaroop/bin

    $ helloworld

    Hello World

    ```


    The chmod command is used here to change the mode of the file by executing permission
    to all users of the system. Then, we execute the program directly by specifying
    the location of the source file. We use the ./ to indicate that the program is
    located in the current directory.


    To make things more fun, you can rename the file to helloworld and run it ./helloworld
    and it will still work the system that knows it has to run the program using the
    interpreter whose location is specified in the first line in the source file.


    What if you don''t know where Python is located? Then, you can use the special
    env path to change the first line of the program to the following:


    ```python

    #!/usr/bin/env python

    ```


    The env program will in turn look for the Python interpreter which will run the
    program. So far, we have been able to run the program from anywhere. Want to?
    You can do this by storing the program in one of the directories listed in the
    PATH environment variable. Whenever you run any program, the system looks for
    path in each of the directories listed in the PATH environment variable and then
    runs that program. We can make this program available everywhere by simply copying
    this source file to one of the directories listed in PATH.


    ## Python on First Steps


    Just printing ''Hello World'' is not enough, is it? You want to do more than that
    - you want to take some input, manipulate it and get something out of it. We can
    achieve this in Python using constants and variables.


    ## Literal Constants


    An example of a literal constant is a number like 5, 1.23, 9.25e-3 or a string
    like ''This is a string'' or ''It''s a string!''. It is called literal because
    it is literal - the number 2 always represents itself and nothing else - it is
    a constant because its value cannot be changed. Hence, all these are referred
    to literal constants.


    ## Numbers


    Numbers in Python are of three types - integers, floating point and complex numbers.


    - Examples of an integer is 2 which is just a whole number.

    - Examples of floating point numbers (or floats) are 3.23 and 52.3E-4. The Enotation
    indicates powers of 10. In this case, 52.3E-4 makes 52.3 * 10⁻⁴.

    - Examples of complex numbers are (-5+4j) and (2.3 - 4.6j).


    ## Strings


