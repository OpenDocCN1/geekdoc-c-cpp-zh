    The fourth version is a satisfactorily working script for most users, but there
    is always room for improvement. For example, you can include a verbosity level
    for the program where you can specify a -v option to make your program more talkative.


    Another possible enhancement would be to allow extra files and directories to
    be passed to the script at the command line. We can get these names from the sys.argv
    list and we can add them to our source list using the extend method provided by
    the list class.


    The most important refinement would be to not use the os.system way of creating
    archives and instead using the zipfile or tarfile built-in module to create these
    archives. They are part of the standard library and available already for you
    to use without external dependencies on the zip program to be available on your
    computer.


