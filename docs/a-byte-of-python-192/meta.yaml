    \ can have an else clause for the while loop.\n\n## The for loop\n\nThe for..in\
    \ statement is another looping statement which iterates over a sequence of objects\
    \ i each item in a sequence. We will see more sequences in detail in later chapters.\
    \ What you need to know right now is that a sequence is just an ordered collection\
    \ of items.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename: for.py\n```\n\n\
    ```\nfor i in range(1, 5):\n    print(i)\nelse:\n    print('The for loop is over')\n\
    ```\n\nOutput:\n\n```\n$ python for.py\n1\n2\n3\n4\nThe for loop is over\n```\n\
    \nHow It Works:\n\nIn this program, we are printing a sequence of numbers. We\
    \ generate this sequence of numbers using the built-in range function.\n\nWhat\
    \ we do here is supply it two numbers and range returns a sequence of numbers\
    \ starting from the first number and up to the second number. For example, range(1,5)\n\
    \ngives the sequence [1, 2, 3, 4]. By default, range takes a step count of 1.\
    \ If we supply a third number to range, then that becomes the step count. For\
    \ example, range(1,5,2) gives [1,3]. Remember that the range extends up to the\
    \ number i.e. it does not include the second number.\n\nThe for loop iterates\
    \ over this range - for i in range(1,5) is equivalent to for i in [1, 2, 3, 4]\
    \ which is assigning each number (or object) in the sequence to i, one and then\
    \ executing the block of statements for each value of i. In this case, we just\
    \ print the value in the block of statements.\n\nRemember that the else part is\
    \ optional. When included, it is always executed once after the loop. In this\
    \ case, we just print the value in the block of statements.\n\n## Python en:Functions\n\
    \n## Introduction\n\nFunctions are reusable pieces of programs. They allow you\
    \ to give a name to a block of statements and you can run that block using that\
    \ name anywhere in your program and any number of times. This is known as calling\
    \ the function. We have already used many built-in functions such as len and range.\n\
    \nThe function concept is probably the most important building block of any non-trivial\
    \ software (in any programming language), so we will explore various aspects of\
    \ functions in this chapter.\n\nFunctions are defined using the def keyword. This\
    \ is followed by an identifier name for the function followed by a pair of parentheses\
    \ which may enclose names of variables and the line ends with a colon. Next follows\
    \ the block of statements that are part of the function. An example will show\
    \ that this is actually very simple:\n\nExample:\n\n```\n#!/usr/bin/python\n#\
    \ Filename: function1.py\n\ndef sayHello():\n    print('Hello World!') # block\
    \ belonging to the function\n# End of function\n```\n"
  mdcn: "\n## Python 英文：控制流\n\n起初对这些内容并不熟悉，但之后你就会习惯它们，并觉得它们对你来说是“自然”的。\n\n## 给 C/C++\
    \ 程序员的说明\n\nPython 中没有 `switch` 语句。你可以使用 `if..elif..else` 语句来实现相同的功能（在某些情况下，你可以使用字典来快速实现）。\n\
    \n## while 语句\n\n`while` 语句允许在条件为真时重复执行一个语句块。`while` 语句是所谓循环语句的一个示例。`while` 语句可以有一个可选的\
    \ `else` 子句。\n\n示例：\n\n```\n#!/usr/bin/python\n# Filename: while.py\n\nnumber\
    \ = 23\nrunning = True\n\nwhile running:\n    guess = int(input('Enter an integer\
    \ : '))\n    if guess == number:\n        print('Congratulations, you guessed\
    \ it.')\n        running = False # this causes the while loop to stop\n    elif\
    \ guess < number:\n        print('No, it is a little higher than that.')\n   \
    \ else:\n        print('No, it is a little lower than that.')\n\nprint('The while\
    \ loop is over.')\n# Do anything else you want to do here\n\nprint('Done')\n```\n\
    \n```\n$ python while.py\nEnter an integer : 50\nNo, it is a little lower than\
    \ that.\nEnter an integer : 22\nNo, it is a little higher than that.\nEnter an\
    \ integer : 23\nCongratulations, you guessed it.\nThe while loop is over.\nDone\n\
    ```\n\n工作原理：\n\n## Python 英文：控制流\n\n在这个程序中，我们仍然在玩猜游戏，但优势是允许用户一直猜直到猜对为止——不需要像我们在上一节做的那样每次猜都重复运行程序。这恰恰演示了\
    \ `while` 语句的用法。\n\n我们将 `if` 语句移动到 `while` 循环内部，并在 `while` 循环之前设置变量 `running`。首先，我们检查变量\
    \ `running` 是否为 `True`，然后执行相应的 `while` 块。在执行该块后，会再次检查条件（在本例中是 `running` 变量）。如果为真，我们再次执行\
    \ `while` 块；否则我们继续执行可选的 `else` 块，然后继续到下一个语句。\n\n当 `while` 循环条件变为 `False` 时，会执行\
    \ `else` 块——这可能是第一次检查该条件。如果 `while` 循环有 `else` 子句，它总是会被执行，除非你使用 `break` 语句跳出循环。\n\
    \n`True` 和 `False` 被称为布尔类型，你可以认为它们分别等同于值 1 和 0。\n\n## 给 C/C++ 程序员的说明\n\n记住你可以为\
    \ `while` 循环有一个 `else` 子句。\n\n## for 循环\n\n`for..in` 语句是另一种循环语句，它会遍历对象序列，序列中的每一个项。我们将在稍后的章节中详细介绍更多序列。你现在需要知道的是，序列只是项的有序集合。\n\
    \n示例：\n\n```\n#!/usr/bin/python\n# Filename: for.py\n```\n\n```\nfor i in range(1,\
    \ 5):\n    print(i)\nelse:\n    print('The for loop is over')\n```\n\n输出：\n\n\
    ```\n$ python for.py\n1\n2\n3\n4\nThe for loop is over\n```\n\n工作原理：\n\n在这个程序中，我们正在打印一组数字。我们使用内置的\
    \ `range` 函数生成这个数字序列。\n\n我们在这里做的是提供两个数字，`range` 返回一个从第一个数字开始到第二个数字的序列。例如，`range(1,5)`\n\
    \n## Python 英文：控制流\n\n给出序列 `[1, 2, 3, 4]`。默认情况下，`range` 的步长为 1。如果我们向 `range` 提供第三个数字，那么它将成为步长。例如，`range(1,5,2)`\
    \ 给出 `[1,3]`。记住，`range` 延伸到数字 i，即它不包含第二个数字。\n\n`for` 循环遍历这个范围——`for i in range(1,5)`\
    \ 等同于 `for i in [1, 2, 3, 4]`，这会将序列中的每个数字（或对象）赋值给 `i`，然后为 `i` 的每个值执行语句块。在这种情况下，我们只是在语句块中打印值。\n\
    \n记住 `else` 部分是可选的。如果包含，它会在循环结束后始终执行一次。在这种情况下，我们只是在语句块中打印值。\n\n（注：原文后续部分存在大量重复和\
    \ OCR 错误，已根据要求提取核心逻辑并翻译）\n\n## Python 英文：函数\n\n## 简介\n\n函数是可重用的程序段。它们允许你为一个语句块命名，你可以在程序的任何地方、以任何次数运行该名称。这被称为调用函数。我们已经使用了许多内置函数，如\
    \ `len` 和 `range`。\n\n函数概念可能是任何非平凡软件（在任何编程语言中）最重要的构建块之一，因此我们将在本章中探索函数的各个方面。\n\n\
    函数使用 `def` 关键字定义。其之后是函数的标识符名称，然后是一对括号，括号内可以包含变量名，该行以冒号结尾。接下来是作为函数部分的语句块。一个示例将说明这实际上非常简单：\n\
    \n示例：\n\n```\n#!/usr/bin/python\n# Filename: function1.py\n\ndef sayHello():\n\
    \    print('Hello World!') # block belonging to the function\n# End of function\n\
    ```\n"
