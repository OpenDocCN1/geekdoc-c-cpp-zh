    \ module from the standard library called warnings that is used to display warnings\
    \ to the end-user. If the Python version number is not at least 3, we display\
    \ a corresponding warning.\n\n# logging module\n\nWhat if you wanted to have some\
    \ debugging messages or important messages to be stored somewhere so that you\
    \ can check whether your program has been running as you expect it? How do you\
    \ \"store somewhere\" these messages? This can be achieved using the logging module.\n\
    \n```\n#!/usr/bin/python\n# Filename: use_logging.py\nimport os, platform, logging\n\
    \nif platform.platform().startswith('Windows'):\n    logging_file = os.path.join(os.getenv('HOMEDR'),\
    \ 'test.log')\nelse:\n    logging_file = os.path.join(os.getenv('HOME'), 'test.log')\n\
    ```\n\n```\nlogging.basicConfig(\n    level=logging.DEBUG,\n    format='%(asctime)s\
    \ : %(levelname)s : %(message)s',\n    filename = logging_file,\n    filemode='w')\n\
    ```\n\n```\nlogging.debug(\"Start of the program\")\nlogging.info(\"Doing something\"\
    )\nlogging.warning(\"Dying now\")\n```\n\nOutput:\n\n```\n$ python use_logging.py\n\
    Logging to C:\\Users\\swaroop\\test.log\n```\n\nIf we check the contents of test.log,\
    \ it will look something like this:\n\n```\n2008-09-03 13:18:16,233 : DEBUG :\
    \ Start of the program\n2008-09-03 13:18:16,233 : INFO : Doing something\n2008-09-03\
