    (Initializing R2-D2)\nGreetings, my masters call me R2-D2.\nWe have 1 robots.\n\
    (Initializing C-3PO)\nGreetings, my masters call me C-3PO.\nWe have 2 robots.\n\
    ```\n\n### 工作原理：\n\n这是一个很长的示例，但有助于演示类和对象变量的本质。在这里，`population` 属于 `Robot`，因此是一个类变量。`name`\
    \ 属于对象（被赋值给 `self`），因此是一个对象变量。\n\n因此，我们将类变量 `population` 引用为 `Robot.population`\
    \ 而不是 `self.population`。我们在对象的方法中使用 `self.name` 引用对象变量。记住类变量和对象变量之间的区别。\n\n"
