    - The rest of the identifier may consist of letters (uppercase ASCII or lowercase
    ASCII character), underscores (''_'') or digits (0-9).

    - Identifier names are case-sensitive. For example, myfile and Myname are not
    the same. Note the n in the former and the uppercase N in the letter.

