  - "[PAGE 54]\n\n# # Python en:Modules\n\n# ## Introduction\n\nYou have seen how\
    \ you can reuse code in your program by defining functions once. What if you wanted\
    \ to reuse a number of functions in other programs that you write? As you might\
    \ have guessed, the answer is modules.\n\nThere are various methods of writing\
    \ modules, but the simplest way is to create a file with a .py extension that\
    \ contains functions and variables.\n\nAnother method is to write the modules\
    \ in the native language in which the Python interpreter was written. For example,\
    \ you can write modules in the C programming language (http://docs.python.org/ending/)\
    \ and when compiled, they can be used from your Python code using the standard\
    \ Python interpreter.\n\nA module can be imported by another program to make use\
    \ of its functionality. This is how we can use the Python standard library as\
    \ well. First, we will see how to use the standard library modules.\n\nExample:\n\
    \n```\n#!/usr/bin/python\n# Filename: using_sys.py\n\nimport sys\n```\n\n```\n\
    print('The command line arguments:')\nfor i in sys.argv:\n    print(i)\n```\n\n\
    ```\nprint('\\\\n\\nThe PYTHONPATH is', sys.path, '\\\\n')\n```\n\nOutput:\n\n\
    ```\n$ python using_sys.py we are arguments\nThe command line arguments are:\n\
    using_sys.py\nwe\nare\narguments\n\nPYTHONPATH is ['', 'C:\\\\Windows\\\\system32\\\
    \\python30.zip',\n'C:\\\\Python30\\\\DLLs', 'C:\\\\Python30\\\\lib',\n'C:\\\\\
    Python30\\\\lib\\\\plat-win', 'C:\\\\Python30',\n'C:\\\\Python30\\\\lib\\\\site-packages']\n\
    ```\n\nHow It Works:\n\nFirst, we import the sys module using the import statement.\
    \ Basically, this translates to telling Python that we want to use this module.\
    \ The sys module contains functionality related to the Python interpreter and\
    \ its environment i.e. the system."
- md: "\n## Python: Modules\n\nWhen Python executes the import sys statement, it looks\
    \ for the sys module. In this case, it is one of the built-in modules, and hence\
    \ Python knows where to find it.\n\nIf it was not a compiled module i.e a module\
    \ written in Python, then the Python interpreter will search for it in the directories\
    \ listed in its `sys.path` variable. If the module is found, then the statements\
    \ in the body of that module are run and then the module is made available for\
    \ you to use. Note that the initialization is done only the first time that we\
    \ import a module.\n\nThe `argv` variable in the sys module is accessed using\
    \ the dotted notation i.e. `sys.argv`. It clearly indicates that this name does\
    \ not clash with any argv variable used in your program. Another advantage of\
    \ this approach is that the name does not clash.\n\nThe `sys.argv` variable is\
    \ a list of strings which are explained in detail in a later chapter. Specifically,\
    \ the `sys.argv` contains the command line arguments i.e the arguments passed\
    \ to your program using the command line.\n\nIf you are using an IDE to write\
    \ and run these programs, look for a way to specify command line arguments to\
    \ the menu.\n\nHere, when we execute `python sys.py`, we run the module `sys.py`\
    \ with the python command and the other things that follow are arguments passed\
    \ to the program. Python stores the command line arguments in the `sys.argv` variable\
    \ for us to use.\n\nRemember, the name of the script running is the first argument\
    \ in the `sys.argv` list. So, 'using.py' as `sys.argv[0]`, 'we' as `sys.argv[1]`,\
    \ 'are' as `sys.argv[2]` and 'arguments' as `sys.argv[3]`. Notice that Python\
    \ starts counting from 0 and not 1.\n\nThe `sys.path` contains the list of directory\
    \ names where modules are imported. Observe that the first string in `sys.path`\
    \ is empty; this empty string indicates that the current directory is also part\
    \ of the path which is the same as the `PYTHONPATH` environment variable. This\
    \ means that you can directly import modules located in the current directory.\
    \ Otherwise, you will have to place your module in one of the directories listed\
    \ in sys.path.\n\nNote that the current directory is the directory from which\
    \ the program is launched. Run `import os; print(os.getcwd())` to find out the\
    \ current directory of your program.\n\n## Byte-compiled .py files\n\nImporting\
    \ a module is a relatively costly affair, so Python does some tricks to make it\
    \ faster. One way is to create byte-compiled files with the extension .pyc which\
    \ is an intermediate form that Python transforms into program code (remember the\
    \ introduction section on how Python works?). This .pyc file is useful when you\
    \ import the module the next time from a different program - it will be much faster\
    \ since a portion of the processing required in importing a module is already\
    \ done. Also, these byte-compiled files are platform-independent.\n\n## Note\n\
    \n.py files are usually created in the same directory as the corresponding .py\
    \ files. If Python does not have permission to write files in that directory,\
    \ then the .pyc files will not be created.\n\n## The from ... import ... statement\n\
    \nIf you want to directly import the `argv` variable into your program (to avoid\
    \ typing `sys.` every time for it), then you can use `from sys import argv`. If\
    \ you want to import all the names used in the sys module, then you can use the\
    \ `from sys import *` statement. This works for any module.\n\nIn general, you\
    \ should avoid using this statement and use the import statement instead of your\
    \ program; your program will avoid name clashes and will be more readable.\n\n\
    ## A module's __name__\n\nEvery module has a name and statements in a module can\
    \ find the name of the run module. This is handy in the particular situation of\
    \ figuring out if the module is being run standalone or imported. As mentioned\
    \ previously, when a module is imported for the first time, the code in that module\
    \ is executed. We can use this concept to alter the behavior of the module if\
    \ the program was run by itself and not when it was imported from another module.\
    \ This can be achieved using the `__name__` attribute of the module.\n\nExample:\n\
    \n```python\n#!/usr/bin/python\n# Filename: using_name.py\n\nif __name__ == '__main__':\n\
    \    print('This program is being run by itself')\nelse:\n    print('I am being\
    \ imported from another module')\n```\n\nOutput:\n\n```\n$ python using_name.py\n\
    This program is being run by itself\n\n$ python\n>>> import using_name\nI am being\
    \ imported from another module\n>>>\n```\n\nHow It Works:\n\nEvery Python module\
    \ has its `__name__` defined and if this is '__main__', it implies that the module\
    \ is being run standalone by the user and we can take appropriate actions.\n\n\
    ## Making Your Own Modules\n\nCreating your own modules is easy, you've been doing\
    \ it all along! This is because every Python program is also a module. You just\
    \ have to make sure it has a .py extension. The following example should make\
    \ clear.\n\nExample:\n\n```python\n#!/usr/bin/python\n# Filename: mymodule.py\n\
    \ndef sayhi():\n    print('Hi, this is mymodule speaking.')\n\n__version__ = '0.1'\n\
    ```\n\nThe above was a sample module. As you can see, there is nothing particularly\
    \ special compared to our usual Python program. We will next see how to use this\
    \ module in our other Python programs.\n\nRemember that the module should be placed\
    \ in the same directory as the program that you import it in, or the module should\
    \ be in one of the directories listed in sys.path.\n\n```python\n#!/usr/bin/python\n\
    # Filename: mymodule_demo.py\n\nimport mymodule\n\nmymodule.sayhi()\nprint('Version',\
    \ mymodule.__version__)\n```\n\nOutput:\n\n```\n$ python mymodule_demo.py\nHi,\
    \ this is mymodule speaking.\nVersion 0.1\n```\n\nHow It Works:\n\nNotice that\
    \ we use the dotted notation to access members of the module. Here is the import\
    \ syntax:\n\n```python\n#!/usr/bin/python\n# Filename: mymodule_demo.py\n\nfrom\
    \ mymodule import sayhi, __version__\n\nsayhi()\nprint('Version', __version__)\n\
    ```\n\nThe output of `mymodule_demo.py` is the same as the output of `mymodule.py`.\
    \ Notice that if there was already a `__version__` name declared in the module,\
    \ it would be a clash. This is also likely because it is common practice for each\
    \ module to declare its version number. Hence, it is always recommended to prefer\
    \ the import statement even though it might make your program a little longer.\
    \ You could also use:\n\n```python\nfrom mymodule import *\n```\n\nThis will import\
    \ all public names such as `sayhi` but not import `__version__` because it starts\
    \ with double underscores.\n\n## Zen of Python\n\nOne of Python's guiding principles\
    \ is that 'Explicit is better than Implicit'. Run `import this` to learn more\
    \ and see this discussion (http://stackoverflow.com/questions/228181/zen-python)\
    \ which lists examples each of the principles.\n\n## The dir function\n\nYou can\
    \ use the built-in dir to list the identifiers that an object defines. For example,\
    \ for a module, the identifiers include the functions, classes and variables defined\
    \ in that module.\n\nWhen you supply a module name to the `dir()` function, it\
    \ returns the list of names defined in that module. When no argument is applied\
    \ to it, it returns the list of names defined in the current module.\n\nExample:\n\
    \n```\n$ python\n>>> import sys # get list of attributes, in this case, for the\
    \ sys module\n\n>>> dir(sys)\n['__dispatchhook_', '__doc__', '__exception__',\
    \ '__name__', '__package__', '__s__', '__stdout__', '__clear_type_cache', '__current_frames',\
    \ '__getframe', '__api_version', '__argv', '__builtin_names__', '__byteorder',\
    \ '__call_tracking', '__callstats', '__copyright', '__displayhook', '__dllhandle',\
    \ '__dont_write_bytecode', '__exc_info', '__exception', '__exec_prefix', '__executable',\
    \ '__exit__', '__flags', '__float_info', '__getcheckinterval', '__getdefaultencoding',\
    \ '__getprofile', '__recursionlimit', '__getrefcount', '__getsizeof', '__gettrace',\
    \ '__getwindowsversion', '__hexversion__', '__intern__', '__maxsize', '__maxunicode',\
    \ '__meta_path', '__modules__', '__path__', '__path_hooks__', '__path_importer_cache__']\n\
    ```"
  mdcn: "\n\n## Python: 模块\n\n当 Python 执行 `import sys` 语句时，它会寻找 `sys` 模块。在这种情况下，它是内置模块之一，因此\
    \ Python 知道去哪里找到它。\n\n如果它不是一个已编译的模块（即一个用 Python 编写的模块），那么 Python 解释器将在其 `sys.path`\
    \ 变量中列出的目录中搜索它。如果找到了该模块，则会运行该模块体中的语句，然后该模块将供你使用。请注意，初始化只会在第一次导入模块时完成。\n\n`sys`\
    \ 模块中的 `argv` 变量通过点符号表示法进行访问，即 `sys.argv`。这清楚地表明该名称不会与你程序中使用的任何 `argv` 变量发生冲突。这种方法的另一个优势是名称不会发生冲突。\n\
    \n`sys.argv` 变量是一个字符串列表，将在稍后的章节中进行详细介绍。具体来说，`sys.argv` 包含了命令行参数，即通过命令行传递给程序的参数。\n\
    \n如果你正在使用 IDE 编写和运行这些程序，请寻找一种可以在菜单中指定命令行参数的方法。\n\n在这里，当我们执行 `python sys.py` 时，我们使用\
    \ `python` 命令运行模块 `sys.py`，后续的其他内容是传递给程序的参数。Python 将命令行参数存储在 `sys.argv` 变量供我们使用。\n\
    \n记住，运行的脚本名称是 `sys.argv` 列表中的第一个参数。因此，'using.py' 是 `sys.argv[0]`，'we' 是 `sys.argv[1]`，'are'\
    \ 是 `sys.argv[2]`，'arguments' 是 `sys.argv[3]`。注意 Python 从 0 开始计数，而不是从 1。\n\n`sys.path`\
    \ 包含了导入模块的目录名称列表。注意 `sys.path` 中的第一个字符串是空的；这个空字符串表示当前目录也是路径的一部分，这与 `PYTHONPATH`\
    \ 环境变量相同。这意味着你可以直接导入位于当前目录的模块。否则，你必须将模块放置在 `sys.path` 中列出的目录之一。\n\n请注意，当前目录是启动程序时的目录。运行\
    \ `import os; print(os.getcwd())` 来查找程序的当前目录。\n\n## 字节编译的 .py 文件\n\n导入模块是一项相对开销较大的事务，因此\
    \ Python 了一些技巧来使其运行更快。一种方法是创建扩展名为 `.pyc` 的字节编译文件，这是 Python 转换成程序代码的中间形式（记得关于 Python\
    \ 如何工作的介绍部分吗？）。当你下次从另一个程序导入该模块时，这个 `.pyc` 文件非常有用——因为它会快得多，因为导入模块所需的部分处理已经完成。此外，这些字节编译文件是与平台无关的。\n\
    \n## 注意\n\n`.py` 文件通常创建在与 `.py` 文件相同的目录下。如果 Python 没有权限在该目录中写入文件，则不会创建 `.pyc`\
    \ 文件。\n\n## from ... import ... 语句\n\n如果你想直接将 `argv` 变量导入到你的程序中（为了避免每次输入 `sys.`），你可以使用\
    \ `from sys import argv`。如果你想导入 `sys` 模块中使用的所有名称，可以使用 `from sys import *` 语句。这适用于任何模块。\n\
    \n通常情况下，你应该避免使用此语句，而是在你的程序中使用 `import` 语句代替；这样你的程序将避免名称冲突并更具可读性。\n\n## 模块的 __name__\n\
    \n每个模块都有一个名称，模块中的语句可以找到运行模块的名称。在确定模块是被独立运行还是被导入的特殊情况下，这非常有用。如之前所述，当模块被首次导入时，该模块中的代码会被执行。我们可以利用这一概念，在程序由它自己运行而非从另一个模块导入导入时，来更改模块的行为。这可以通过模块的\
    \ `__name__` 属性来实现。\n\n示例：\n\n```python\n#!/usr/bin/python\n# Filename: using_name.py\n\
    \nif __name__ == '__main__':\n    print('This program is being run by itself')\n\
    else:\n    print('I am being imported from another module')\n```\n\n输出：\n\n```\n\
    $ python using_name.py\nThis program is being run by itself\n\n$ python\n>>> import\
    \ using_name\nI am being imported from another module\n>>>\n```\n\n工作原理：\n\n每个\
    \ Python 模块都有其定义的 `__name__`，如果该值为 `'__main__'`，则意味着该模块正由用户独立运行，我们可以采取相应的行动。\n\
    \n## 创建你自己的模块\n\n创建你自己的模块非常简单，你一直都在做！这是因为每个 Python 程序也是一个模块。你只需要确保它有 `.py` 扩展名。接下来的示例应该得很清楚。\n\
    \n示例：\n\n```python\n#!/usr/bin/python\n# Filename: mymodule.py\n\ndef sayhi():\n\
    \    print('Hi, this is mymodule speaking.')\n\n__version__ = '0.1'\n```\n\n上述是一个示例模块。如你所示，与我们通常的\
    \ Python 程序相比，没有特别特别的。接下来我们将看到如何在其他 Python 程序中使用此模块。\n\n记住，模块应该放置在导入它的程序的相同目录中，或者该模块应该位于\
    \ `sys.path` 中列出的目录之一。\n\n```python\n#!/usr/bin/python\n# Filename: mymodule_demo.py\n\
    \nimport mymodule\n\nmymodule.sayhi()\nprint('Version', mymodule.__version__)\n\
    ```\n\n输出：\n\n```\n$ python mymodule_demo.py\nHi, this is mymodule speaking.\n\
    Version 0.1\n```\n\n工作原理：\n\n注意我们使用点符号表示法访问模块的成员。这里是导入语法：\n\n```python\n#!/usr/bin/python\n\
    # Filename: mymodule_demo.py\n\nfrom mymodule import sayhi, __version__\n\nsayhi()\n\
    print('Version', __version__)\n```\n\n注意 `mymodule_demo.py` 的输出与 `mymodule` 的输出相同。注意如果模块中已经声明了\
