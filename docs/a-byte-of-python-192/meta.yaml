  md: "# Python en:Standard Library\n\n# How It Works:\n\nWe use modules from the\
    \ standard library - the os module for interacting with the operating system,\
    \ the platform module for information about the operating system and the logging\
    \ module to log information.\nFirst, we check operating system we are using by\
    \ checking the string returned by platform.platform() (for more information, see\
    \ import platform; help(platform)). If it is Windows, we figure out the home directory,\
    \ the home folder and the filename where we need to store the information. Putting\
    \ these three parts together, we get the full location of the file. For other\
    \ platforms, we need to know just the home folder of the user and we get the full\
    \ location of the file.\nWe use the os.path.join() function to put these three\
    \ parts of the location together. The reason to use a special function rather\
    \ than adding the strings is because this function will ensure the full location\
    \ matches the format expected by the operating system.\nWe configure the logging\
    \ module to write all the messages in a particular format to the file we have\
    \ specified.\nFinally, we can put messages that are either meant for debugging,\
    \ warning or even critical messages. Once the program has run, we can check this\
    \ file and we will know what happened in the program, though no information was\
    \ displayed to the user running the program.\n\n# urllib and json modules\n\n\
