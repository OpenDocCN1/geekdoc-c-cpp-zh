  md: '# Python:Introduction


    system-dependent features.

    You can use Python on Linux, Windows, FreeBSD, Macintosh, Solaris, OS/2, Amiga,

    AROS/400, FreeBSD, OS/390, z/OS, Palm OS, QNX, VMS, Psion, Acorn RISC OS,

    VxWorks, PlayStation, Sharp Zaur, Windows CE and PocketPC!


    # Interpreted


    This requires a bit of explanation.

    A program written in a compiled language like C or C++ is converted from the source

    language i.e. C or C++ into a language that is spoken by your computer (binary
    code

    i.e. 0s and 1s) using a compiler with various flags and options. When you run
    the

    program, the linker/software copies the program from the hard disk to memory and

    starts running.


    Python, on the other hand, does not need compilation to binary. You just run

    program directly from the source code. Internally, Python converts the source

    into an intermediate form bytecodes and then translates this into the native

    language of your computer and runs it. All this, actually, makes using Python

    much easier so you don''t have to worry about compiling the program, making sure

    that the proper libraries are linked and loaded, etc, etc. This also makes your
    Python

    programs much more portable, since you can just copy your Python program

    another computer and it works!


    # Object Oriented


    Python sports procedure-oriented programming as well as object-oriented

    programming. In procedure-oriented languages, the program is built around

    procedures or functions which are not reusable pieces of programs. In

    object-oriented languages, the program is built around objects which combine data

    and functionality. Python has a very powerful simplistic way of doing OOP,

    specially when compared to big languages like C++ or Java.


    # Extensible


    If you need a critical piece of code to run very fast or want to have some piece
    of

    alorithm not to be open, you can code that part of your program in C or C++ and

    tuse it inside your Python program.


    # Embeddable


    You can embed Python within your C/C++ programs to give ''scripting'' capabilities

    of your program''s users.


    # Exclusive Libraries


    The Standard Library is huge indeed. It can help you do various things

    involving regular expressions, documentation generation, unit testing, threading,

    databases, web browsers, CGI, FTP, email, XML, XML-RPC, HTML, WAV files,

    crypto, GUI (graph user interfaces), Tk, and other system-dependent stuff.

    Remember, all this is available wherever Python is installed. This is called the

    ''Batteries Included'' philosophy of Python.


    Besides, the standard library, there are other high-quality libraries such as

    wxPython (http://www.wxpython.org ) , Twisted (http://www.twistedmatrix.com/

    products/twisted), Python Imaging Library (http://www.python.com/products/

    pil/index.htm) and many more.'
