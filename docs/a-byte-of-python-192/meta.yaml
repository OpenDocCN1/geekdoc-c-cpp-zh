    \ more readable, we can use parentheses. For example, 2 + (3 * 4) is definitely\
    \ easier to understand than 2 + 3 * 4 which requires knowledge of the operator\
    \ precedence. As everything else, the parentheses should be used reasonably (do\
    \ not invert) and it should be redundant (as in 2 + (3) * 4).\n\nThere is an additional\
    \ advantage to using parentheses - it helps us to change the order of evaluation.\
    \ For example, if you want addition to be evaluated before multiplication in an\
    \ expression, then you can write something like (2 + 3) * 4.\n\n# Associativity\n\
    \nOperators are usually associated from left to right i.e. operators with the\
    \ same precedence are evaluated in a left to right manner. For example, 2 + 3\
    \ + 4 is evaluated as (2 + 3) + 4. Some operators like assignment operators have\
    \ right to left associativity. a = b = c is treated as a = (b = c).\n\n# Expressions\n\
