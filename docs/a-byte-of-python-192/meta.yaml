  md: "# Packages\n\nBy now, you must have started observing the hierarchy of organizing\
    \ your programs. Functions and global variables usually go inside modules. If\
    \ you wanted to organize modules? That's where packages come into the picture.\n\
    \nPackages are just folders of modules with a special __init__.py file that indicates\
    \ to Python that this folder is a package because it contains Python modules.\n\
    \nLet's say you want to create a package 'world' with subpackages 'asia', 'africa',\
    \ etc. and these subpackages in turn contain modules like 'india', 'madagascar',\
    \ etc.\n\nThis is how you would structure the folders:\n\n```\n<some folder present\
    \ in the sys.path>\n  - world/\n    - __init__.py\n    - asia/\n      - __init__.py\n\
    \    - india/\n      - __init__.py\n      foo.py\n  - africa/\n    - __init__.py\n\
    \    - madagascar/\n      - __init__.py\n      bar.py\n```\n\nPackages are just\
    \ a convenience to hierarchically organize modules. You will see many instances\
    \ of this in the standard library.\n\n# Summary\n\nJust like functions are reusable\
    \ parts of programs, modules are reusable programs. Packages are another hierarchy\
    \ to organize modules. The standard library that comes with Python is an example\
    \ of such a set of packages and modules.\n\nWe have seen how to use these modules\
    \ and create our own modules.\n\nNext, we will learn about some interesting concepts\
    \ called data structures.\n\nPrevious Next"
