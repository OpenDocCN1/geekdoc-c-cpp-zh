  - '[PAGE 55]


    # Python:Modules


    When Python executes the import sys statement, it looks for the sys module. In
    this case, it is one of the built-in modules, and hence Python knows where to
    find it.


    If it was not a compiled module i.e a module written in Python, then the Python
    interpreter will search for it in the directories listed in its sys.path variable.
    If the module is found, then the statements in the body of that module are run
    and then the module is made available for you to use. Note that the initialization
    is done only the first time that we import a module.


    The argv variable in the sys module is accessed using the dotted notation i.e.
    sys.argv. It clearly indicates that this name does not clash with any argv variable
    used in your program. Another advantage of this approach is that the name does
    not clash


    The sys.argv variable is a list of strings (lists) are explained in detail in
    a later chapter. Specifically, the sys.argv contains the command of line arguments
    i.e the arguments passed to your program using the command.


    If you are using an IDE to write and run these programs, look for a way to specify
    command line arguments to the menu.


    Here, when we execute python sys.py we are arguments, we run the module using.py
    with the python command and the other things that follow are arguments passed
    to the program. Python stores the command line arguments in the sys.argv variable
    for us to use.


    Remember, the name of the script running is the first argument in the sys.argv
    list. So, ''using.py'' as sys.argv[0], ''we'' as sys.argv[1], ''are'' as sys.argv[2]
    and ''arguments'' as sys.argv[3]. Notice that Python starts counting from 0 and
    not 1.


    The sys.path contains the list of directory names where modules are imported.
    Observe that the first string in sys.path is empty this empty string indicates
    that the current directory is also part of the.path which is the same as the PYTHONPATH
    environment variable. This means that you can directly import modules located
    in the current directory. Otherwise, you will have to place your module in one
    of the directories listed in sys.path.


    Note that the current directory is the directory from which the program is launched.
    Run os; print (os.getcwd()) to find out the current directory of your program.


    # Byte-compiled .py files


    Importing a is a relatively costly affair, so Python does some tricks to make
    it faster. One way is to create byte-compiled files with the extension .pyc which
    is an intermediate form that Python transforms into program (remember the introduction
    section on how Python works?). This .py file is useful when you import the module
    the next time from a different program - it will be much faster since a portion
    of the processing required in importing a module is already done. Also, these
    byte-compiled files are platform-independent.


    # Note


    .py files are usually created in the same directory as the corresponding .py files.
    If Python does not have permission to write files in that directory, then the

    .pyc files will not be created.'
