    Java，但我尝试尽可能地用 Python 来完成。特别是用 Python 进行文本分析和转换非常简单。我不熟悉 GUI 工具包，我的大部分编程是使用如 Struts
    等 Java 框架。目前我正尝试利用 Python 的功能性特性。（注：此处已删除重复内容以保持清晰）。


