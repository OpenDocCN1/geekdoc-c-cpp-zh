    \ is just an ordered collection of items.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: for.py\n```\n\n```\nfor i in range(1, 5):\n    print(i)\nelse:\n \
    \   print('The for loop is over')\n```\n\nOutput:\n\n```\n$ python for.py\n1\n\
