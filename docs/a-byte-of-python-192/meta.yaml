    ## Python 英文：安装


    如果你已经安装了 Python 2.x，则不需要删除它即可安装 Python 3.0。你可以同时安装这两个版本。


    ### 对于 Linux 和 BSD 系统


    如果你正在使用 Linux 发行版，如 Ubuntu、Fedora、OpenSUSE 或（在此输入你的选择），或者像 FreeBSD这样的 BSD 系统，那么你的系统中可能已经安装了
    Python。


    要测试你的 Linux 机器是否安装了 Python，请打开 shell 程序（如 konsole 或 gnome-terminal）并输入如下所示的命令
    `python -V`。


    ```

    $ python -V

    Python 3.0bi

    ```


    注意


    $ 是 shell 的提示符。它将根据你操作系统的设置而不同，因此我将仅用 $ 符号表示提示符。


    如果你看到类似上面显示的版本信息，说明你已经安装了 Python。


    但是，如果你收到类似这样的消息：


    ```

    $ python -V

    bash: Python: command not found

    ```


    那么你还没有安装 Python。这极少见，但是有可能的。


    注意


    如果你已经安装了 Python 2.x，请尝试 `python3 -V`。在这种情况下，你有两种方法在系统上安装 Python。


    -   你可以从源代码编译 Python（http://www.python.org/download/lele/3.0/）并安装。编译说明在网站上提供。

    -   [此选项将在 Python 3.0 正式发布后可用] 使用操作系统自带的包软件安装二进制包，例如 Ubuntu/Debian 和其他基于 Debian
    的 Linux 中的 apt-get，Fedora Linux 中的 yum，FreeBSD 中的 pkg_add 等。注意你需要互联网连接来使用此方法。

    或者，你可以从其他地方下载二进制文件复制到你的 PC 并安装。


    ## Python：安装


    ### 对于 Windows 用户


    访问 http://www.python.org/download/releases/3.0/ 并从该网站下载最新版本，截至本文撰写时这是一个 beta 1
    版本（http://www.python.org/ftp/python/3.0/python-3.0b1.msi）。这只有 12.8 MB，与其他语言或软件相比非常紧凑。安装过程就像任何
    Windows 软件一样。


    ### 注意事项


    当你获得取消勾选任何“可选”组件的选项时，不要取消勾选！这些组件某些对你可能有用，特别是 IDLE。


    一个有趣的事实是大多数 Python 下载用户是 Windows 用户。当然，这并不是全貌，因为所有 Linux 用户在他们的系统中默认都已安装了 Python。


    ### DOS 提示符


    如果你想在 Windows 命令行（即 DOS 提示符）中使用 Python，则你需要相应地设置 PATH 变量。


    对于 Windows 2000, XP, 2003，点击控制面板 -> 系统 -> 高级 -> 环境变量。点击“系统变量”部分中名为 PATH 的变量，选择编辑并在现有内容的末尾添加
    `;C:\Python30`。当然，请使用相应的目录名称。

    对于旧版本的 Windows，在 `C:\AUTOEXEC.BAT` 文件中添加以下行：`''PATH=%PATH%;C:\Python30''`（不带引号）并重启系统。对于
    Windows NT，使用 AUTOEXEC.NT 文件。


    ### 对于 Mac OS 用户


    Mac OS X 用户会发现系统中已经安装了 Python。打开 Terminal.app 并运行 `python -V`，遵循上述 Linux 部分的建议。


    ### 总结


    对于 Linux 系统，你可能已经安装了 Python。否则，你可以使用发行版自带的包管理软件。对于 Windows 系统，安装 Python 只需要下载安装程序并双击运行。从现在起，我们将你已经安装了
    Python。


    接下来，我们将编写第一个 Python 程序。


