    # Python en:Operators and Expressions


    # Introduction


    Most statements (logical lines) that you will contain **expressions**. A simple
    example of an expression is 2 + 3. An expression can be broken down into operators
    and operands. **Operators** are functionality that can do something and can be
    represented by symbols such as + or by special keys. Operators require some data
    to operate on and such data is called *operands*. In this case, 2 and 3 are the
    operands.


    # Operators


    We will briefly take a look at the operators and their usage:

    Note that you can evaluate the expressions given in the examples using the interpreter
    interactively. For example, to test the expression 2 + 3, use the interactive
    Python prompt:


    ```

    >>> 2 + 3

    5

    >>> 3 * 5

    15

    >>>

    ```


