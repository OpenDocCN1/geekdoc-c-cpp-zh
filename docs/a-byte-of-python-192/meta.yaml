    ## 问题解答


    - [Python 官方与禁忌](http://docs.python.org/dev/howto/doanddont.html)

    - [Python 官方 FAQ](http://www.python.org/doc/faq/general/)

    - Norvig 的常见问题列表](http://norvig.com/python-iaq.html)

