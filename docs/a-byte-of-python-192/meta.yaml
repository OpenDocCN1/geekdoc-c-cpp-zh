    If you are using a Linux distribution such as Ubuntu, Fedora, OpenSUSE or (put
    your

    choice here), or a BSD system such as FreeBSD, then it is most likely you already
    have

    Python installed on your system.


    To test if you have Python installed on your Linux box, open a shell program (like

    konsole or gnome-terminal) and enter the command python -V as shown below.


    ```

    $ python -V

    Python 3.0bi

    ```


    Note


    $ is the prompt of the shell. It will be different for you depending on the settings
    of

    your OS, hence I will indicate the prompt by just the $ symbol.


    If you see some version information like the one shown above, then you have Python

    installed already.


    However, if you get a message like this one:


    ```

    $ python -V

    bash: Python: command not found

    ```


    Then you don''t have Python installed. This is highly unlikely but possible.


    Note


    If you have Python 2.x already installed, then try python3 -V.

    In this case, you have two ways of installing Python on your system.


    +   * You can compile Python from the source code (http://www.python.org/download/

    lele/3.0/) and install it. The compilation instructions are provided at the website.

    * [This option will be available after the final release of Python 3.0] Install
    the binary

    packages using the package management software that comes with your OS, such as

    apt-get in Ubuntu/Debian and other Debian-based Linux, yum in Fedora Linux, pkg_add

    FreeBSD, etc. Note that you will need an internet connection to use this method.

    Alternatively, you can download the binaries from somewhere else and copy to your

    PC and install it.'
