  md: "# Python on:Control Flow\n\ngives the sequence [1, 2, 3, 4]. By default, range\
    \ takes a step count of 1. If we supply a third number to range, then that becomes\
    \ the step count. For example, range(1,5,2) gives [1,3]. Remember that the range\
    \ extends up to the number i.e. it does not include the second number.\n\nThe\
    \ for loop iterates over this range - for i in range(1,5) is equivalent to for\
    \ i in [1, 2, 3, 4] which is assigning each number (or object) in the sequence\
    \ to i, one and then executing the block of statements for each value of i. In\
    \ this case, we just print the value in the block of statements.\n\nRemember that\
    \ the else part is optional. When included, it is always executed once after the\
    \ loop is over unless a break statement is encountered.\n\nRemember that the for..\
    \ loop works for any sequence. Here, we have a list of numbers generated by the\
    \ built-in range function, but in general we can use any kind of sequence or any\
    \ kind of objects! We will explore this in detail later chapters.\n\nNote for\
    \ C/C++/Java/C# Programmers\n\nThe Python for loop is radically different from\
