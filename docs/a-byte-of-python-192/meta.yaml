    \ b['x']))\n\n# List Comprehension\n\nList comprehensions are used to derive a\
    \ new list from an existing list. Suppose you have a list of numbers and you want\
    \ to get a corresponding list with all the numbers multiplied by 2 only when the\
    \ number itself is greater than 2. List comprehensions are ideal for such situations.\n\
    \n```\n#!/usr/bin/python\n# Filename: list_comprehension.py\n\none = [2, 3, 4]\n\
    listtwo = [2*i for i in listone if i > 2]\nprint(listtwo)\n```\n\nOutput:"
