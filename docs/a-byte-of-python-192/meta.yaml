  md: "# Python in:More\n\n```\n$ python list_comprehension.py\n[6, 8]\n```\n\nHow\
    \ It Works:\n\nHere, we derive a new list by specifying the manipulation to be\
    \ done (2*i) when some condition is satisfied (if > 2). Note that the original\
    \ list remains unmodified.\n\nThe advantage of using list comprehensions is that\
    \ it reduces the amount of boilerplate code when we use loops to process each\
    \ element of a list and store it in a new list.\n\n# Receiving Tuples and Lists\
    \ in Functions\n\nThere is a special way of receiving parameters to a function\
    \ as a tuple or a dictionary with the * or ** prefix respectively. This is useful\
    \ when taking variable number of arguments in the function.\n\n```\n>>> powersum(power,\
    \ args):\n    '''Return the sum of each argument raised to specified power.'''\n\
    \    total = 0\n    for i in args:\n        total += pow(i, power)\n    ...\n\
    \    return total\n```\n\n```\n>>> powersum(2, 3, 4)\n25\n```\n\n```\n>>> powersum(2,\
    \ 10)\n1024\n```\n\nBecause we have a * prefix on the args all extra arguments\
    \ passed to the function are stored in args as a tuple. If a ** prefix had been\
    \ used instead the extra parameters would be considered to key/value pairs of\
    \ a dictionary.\n\n# exec and eval\n\nThe exec function is used to execute Python\
    \ statements which are stored in a string or file, as opposed to be written in\
    \ the program itself. For example, we can generate a string containing Python\
    \ code at runtime and execute these statements using the exec statement:\n\n```\n\
    >>> exec('print(\"Hello World\"))\nHello World\n```\n\nSimilarly, the eval function\
    \ is used to evaluate valid Python expressions which are stored in a string. A\
    \ simple example is shown below.\n\n```\n>>> eval('2*3')\n6\n```"
