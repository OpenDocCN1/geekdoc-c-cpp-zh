    # # Python en:Data Structures


    # Introduction


    Data structures are basically just that - they are structures which can hold some
    data together. In other words, they are used to store a collection of related
    data.

    Are four built-in data structures in Python - list, tuple, dictionary and set.
    We will see how to use each of them and how they make life easier for us.


    # List


    A list is a data structure that holds ordered collection of items i.e. you can
    store a sequence of items in a list. This is easy to imagine if you are thinking
    of a shopping list where you have a list of items to buy, except that you probably
    have each item on a separate line in your shopping list whereas Python puts commas
    between them.

    The list of items should be enclosed in square brackets that Python understands
    that you are specifying a list. Once you have created a list, you can add, remove
    or search for items in the list. Since we can add and remove items, we say that
    a list is a mutable data type i.e. this type can be altered.


    # Quick Introduction To Objects And Classes


    Although I''ve been generally delaying the discussion of objects and classes till
    now, a little explanation is needed right so that you can understand classes better.
    We will explore this topic in detail later in its chapter.

    A list is an example of usage of objects and classes. When we use a variable i
    and assign a value to it, say integer 5 to it, you can think of it as creating
    an object (i.e. instance) i of class (i.type) int. In fact, you can help(int)
    to understand this better.


    A class can also have methods i.e. functions defined for use with respect to that
    class only. You can use these pieces of functionality only when you have an object
    of that class. For example, Python provides an append method for the list class
    which you to add an item to the end of the list. For example,mylist.append(''an
    item'') will add that string to the list myList. Note the use of dotted notation
    for accessing methods of the objects.

    A class can also have fields which are nothing variables defined for use with
    respect to that class. You can use these variables/names when you have an object
    of that class. Fields are also accessed by the dotted notation, for example, mylist.field.


    Example:


    ```

    #!/usr/bin/python

    # Filename: using_list.py


    # This is my shopping list

    shoplist = [''apple'', ''mango'', ''carrot'', ''banana'']


    print(''I have'', len(shopplist), ''items to purchase.'')


    print(''These items are:'', end= '' )

    ```'
