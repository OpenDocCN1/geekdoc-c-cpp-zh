    \ you can use a dictionary to do it quickly)\n\n## The while Statement\n\nThe\
    \ while statement allows you to repeatedly execute a block of statements as long\
    \ as a\ncondition is true. A while statement is an example of what is called a\
    \ looping statement.\nwhile statement can have an optional else clause.\n\nExample:\n\
    \n```\n#!/usr/bin/python\n# Filename: while.py\n\nnumber = 23\nrunning = True\n\
    \nwhile running:\n    guess = int(input('Enter an integer : '))\n    if guess\
