  md: '# Python on en:First Steps


    you should understand now is whatever you supply in the parentheses will be printed
    back to the screen. In this case, we supply ''Hello World'' which is referred
    to as a string - don''t worry, we will explore these terminologies in detail later.


    # Executable Python Programs


    This applies only to Linux/Unix but Windows users might be curious as well about
    the first line of the program. First, we have to give the program executable permission
    using the chmod command then we run the source program.


    ```

    $ chmod a+x helloworld.py

    $ ./helloworld.py

    Hello World

    ```


    The chmod command is used here to change the mode of the file by executing permission
    to all users of the system. Then, we execute the program directly by specifying
    the location of the source file. We use the ./ to indicate that the program is
    located in the current directory.


    To make things more fun, you can rename the file to helloworld and run it ./helloworld
    and it will still work the system that knows it has to run the program using the
    interpreter whose location is specified in the first line in the source file.


    What if you don''t know where Python is located? Then, you can use the special
    env path to change the first line of the program to the following:


    ```

    #!/usr/bin/env python

    ```


    The env program will in turn look for the Python interpreter which will run the
    program. So far, we have been able to run the program from anywhere. Want to?
    You can do this by storing the program in one of the directories listed in the
    PATH environment variable. Whenever you run any program, the system looks for
    path in each of the directories listed in the PATH environment variable and then
    runs that program. We can make this program available everywhere by simply copying
    this source file to one of the directories listed in PATH.


    ```

    $ echo $PATH

    /local/bin:/usr/bin:/usr/X11R/bin:/home/swaroop/bin

    $ cp helloworld.py /home/swaroop/bin

    $ helloworld

    Hello World

    ```


    We can display the PATH variable using the echo command and prefixing the variable
    name by $ to indicate to the shell that we need the value of this variable. We
    see that /home/swaroop/bin is one of the directories in the PATH where swaroop
    is the username I am using on your system. Alternatively, you can add a directory
    of your choice to the PATH variable - this can be done by running PATH=$PATH:/home/swaroop/mydir
    ''/home/swaroop/mydir'' is the directory I want to add to the PATH variable.


    This method is very useful if you want write useful scripts that you want to run
    the program anytime, anywhere. It is like creating your own commands just like
    cd or any'
