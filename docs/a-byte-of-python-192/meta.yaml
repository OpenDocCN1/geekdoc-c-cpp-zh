    After studying science I started working as a software engineer. I am currently
    working in the field of medical imaging for a major german company. All C++ is
    the main language (I have to) use for my daily work, I am constantly looking for
    new things to learn. Last I fell in love with Python, which is a wonderful language,
    for its possibilities and its beauty. I read somewhere on the net about a guy
    who said that he likes python, because the code looks so beautiful. In my opinion
