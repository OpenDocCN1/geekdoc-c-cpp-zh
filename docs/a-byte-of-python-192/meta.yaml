    \ c before for an even a is defined before c in the function definition.\n\n##\
    \ VarArgs parameters\n\nTODO\n\nShould I write about this in a later chapter since\
    \ we haven't talked about lists and dictionaries yet?\n\nSometimes you might want\
    \ to define a function that can take any number of parameters, this can be achieved\
    \ by using the stars:\n\n```python\n#!/usr/bin/python\n# Filename: total.py\n\
    ```\n\n```python\ndef total(initial=-5, *numbers, **keywords):\n    count = initial\n\
    \    for number in numbers:\n        count += number\n    for key in keywords:\n\
    \        count += keywords[key]\n    return count\n```\n\n```python\nprint(total(10,\
    \ 1, 2, 3, vegetables=50, fruits=100))\n```\n\nOutput:\n\n```\n$ python total.py\n\
    166\n```\n\nHow It Works:\n\n## Python en:Functions\n\nWhen we declare a starred\
    \ parameter such as *param, then all positional arguments from that point till\
    \ the end are collected as a list called 'param'.\nSimilarly, when we declare\
    \ a double-starred parameter such as **param, then all the keyword arguments from\
    \ that point till the end are collected as a dictionary called 'param'.\nWe will\
    \ explore lists and dictionaries in a later chapter.\n\n## Keyword-only Parameters\n\
    \nIf we want to specify keyword parameters to be available as keyword-only and\
    \ not as positional arguments, they can be declared after a starred parameter:\n\
    \n```python\n#!/usr/bin/python\n# Filename: keyword_initial-5.py\n\ndef total(initial=5,\
    \ *numbers, vegetables):\n    count = initial\n    for number in numbers:\n  \
    \      count += number\n    count += vegetables\n    return count\n\nprint(total(10,\
    \ 1, 2, 3, vegetables=50))\nprint(total(10, 1, 2, 3))\n# Raises error because\
    \ we have not supplied a default argument value\n# for 'vegetables'\n```\n\nOutput:\n\
    \n```\n$ python keyword_only.py\n66\nTraceback (most recent call last):\nFile\
    \ \"test.py\", line 12, in <module>\nprint(total(10, 1, 2, 3))\nTypeError: total()\
    \ needs keyword-only argument vegetables\n```\n\nHow It Works:\n\nDeclaring parameters\
    \ after a starred parameter results in keyword-only arguments. If these arguments\
    \ are not supplied a default value, then calls to the function will raise an error\
    \ if the keyword argument is not supplied, as seen above.\n\nIf you want to have\
    \ keyword-only arguments but have no need for a starred parameter, simply use\
    \ an empty star without using any name such as def total(initial=5, *, vegetables).\n\
    \n## The return Statement\n\nThe return statement is used to return from a function\
