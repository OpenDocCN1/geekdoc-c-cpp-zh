  md: "# Using The global Statement\n\nIf you assign a value to a name defined at\
    \ the top level of the program (i.e. not inside any kind of scope such as functions\
    \ or classes), then you have to tell Python that the name is not local, but it\
    \ is global. We do this using the global statement. It is impossible to assign\
    \ a value to a variable defined outside a function without the global statement.\n\
    \nYou can use the values of such variables defined outside the function (assuming\
    \ there is no variable with the same name within the function). However, this\
    \ is not encouraged and should be avoided since it is unclear to the reader of\
    \ to where that variable's definition is. Using the global statement makes it\
    \ amply clear that the variable is defined in an outermost block.\n\nExample:\n\
    \n```\n#!/usr/bin/python\n# Filename: func_global.py\n\nx = 50\n\ndef func():\n\
    \    global x\n\n    print('x is', x)\n    x = 2\n    print('Changed global x\
    \ to', x)\n\nfunc()\nprint('Value of x is', x)\n```\n\nOutput:\n\n```\n$ python\
    \ func_global.py\nx is 50\nChanged global x to 2\nValue of x is 2\n```\n\nHow\
    \ It Works:\n\nThe global statement is used to declare that x is a global variable\
    \ - hence, when we assign a value to x inside the function, this change is reflected\
    \ when we use the value of x in the main block.\n\nYou can specify more than one\
    \ global variable using the same global statement. For example, global x, y, z."
