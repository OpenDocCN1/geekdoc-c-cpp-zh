    another object, that''s all.


    # Dictionary


    A dictionary is an address-book where you can find the address or contact details
    of a person by knowing his/her name we. associate keys (name) with values (details).
    Note that the key must be unique like you cannot find out the correct information
    if you have two people with the exact same name.


    Note that you can use only immutable objects (like strings) for the keys of a
    dictionary but you can use either immutable or mutable objects for the values
    of the dictionary. This basically translates to say that you can use simple objects
    for keys.


    Pairs of keys and values are specified in a dictionary using the notation d =
    {key1: value1, key2 : value2}. Notice that the key-value pairs are separated by
    a colon and the pairs are separated themselves by commas and all this is enclosed
    in a pair of curly braces.


    Remember that key-value pairs in a dictionary are not ordered in any manner. If
    you want a particular order, you will have to sort them before using it.


    The dictionaries that you will be using instances/objects of the dict class.


