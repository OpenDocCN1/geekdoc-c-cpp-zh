  md: '# Python on:Problem Solving


    We use the os and time modules by first importing them. Then, we specify the files
    and directories to be backed up in the source list. The target directory is where
    all the backup files and this is specified in the target_dir variable. The name
    of the zip archive that we are creating is the current date and time we find out
    using the time.strftime() function. We will also have the zip extension which
    will be stored in the target_dir directory.


    Notice the use of os.sep variable - this gives the directory separator according
    to your operating system i.e. will be ''/'' in Linux, Unix and will be ''\\''
    in Windows and '':'' in Mac OS. Using os.sep instead of these characters directly
    will make our program portable and work across these systems.


    The time.strftime() takes a specification such as the one we have used in the
    above program. The %Y symbol will be replaced by the year without the century.
    The %m symbol will be replaced by the month as a decimal number between 01 and
    12 and so on. The complete list of specifications can be found in the Python Reference
    Manual (https://docs.python.org/dev/3.0/library/time.html#time.strftime).


    We create the zip target file using the addition operator which concatenates the
    strings i.e. it joins the two strings and returns a new one. Then, we create a
    string zip which contains the command that we are going to execute. You can check
    if this command works by running it on the shell (Linux terminal or DOS prompt).


    The zip command that we use has some options and parameters. The -q option is
    used to indicate that the zip command should work quietly. The -r option specifies
    that the zip command should work recursively for directories i.e. it should include
    all subdirectories and files. The two options are combined and specified in a
    shortcut as -qr. The options are followed by the name of the archive to create
    followed by the list of directories to backup. We convert the source list into
    a string using the join method of strings which we have already seen now.


    Then, we run the command using the os.system function which runs the command as
    if it was run from the system i.e. in the shell - it returns 0 if the command
    was successfully, else it returns an error number.


    Depending on the outcome of the command, we print the appropriate message that
    the backup has failed or succeeded.


    That''s it, we have created a script to take a backup of our important files!


    # Note to Windows Users


    Instead of doubleslash escape sequence you can also use raw strings. For example,
    use ''C:\Documents'' or r''C:\Documents''. However, do not use ''C:\Documents''
    since you are using an unknown escape sequence \D.


    Now that we have a working script, we can use it whenever we want to take a backup
    of the files. Linux/Unix users are able to use the executable method as discussed
    earlier so that they can run the backup script anytime. This is called the operation
    phase or the deployment phase of the software.


    The above program works properly, but (usually) first programs do not work as
    you expect. For example, there might be problems if you have not designed the
    program properly or if you have made a mistake in typing the code, etc. Appropriately,
    you will have to go back to the design phase or you will have to debug your program.'
