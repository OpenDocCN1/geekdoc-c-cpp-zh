  md: 'Python on:Problem Solving


    # Second Version


    The first version of our script works. However, we can make some refinements to
    it so that it can work better on a daily basis. This is called the maintenance
    phase of the software.\ One of the refinements I felt was useful is a better file-naming
    mechanism - using the time as the name of the file with the current date as a
    directory within the main backup directory. First advantage is that your backups
    are stored in a hierarchical manner and therefore it is easier to manage. Second
    advantage is that the length of the filenames are much shorter. Third advantage
    is that separate directories will help you to easily check if you have taken a
    backup for each day since the directory would be created only if you have taken
    a backup for that day.


    ```

    #!/usr/bin/python

    # Filename: backup_ver2.py

    \import os

    import time


    # 1. The files and directories to be backed up are specified in a list.

    source = [''C:\My Documents'', ''C:\Code'']

    # Notice we had to use double quotes inside the string for names with\spaces in
    it.


    # 2. The backup must be stored in a main backup directory

    target_dir = ''E:\Backup'' # Remember to change this to what you will be

    using


    # 3. The files are backed up into a zip file.

    # 4. The current date is the name of the subdirectory in the main

    directory

    today = target_dir + os.sep + time.strftime(''%Y%m%d'')

    # The current time is the name of the zip archive

    now = time.strftime(''%Y%H%M%S'')


    # Create the subdirectory if it isn''t already there

    if not os.path.exists(today):

    os.makedirs(today) # make directory

    print(''Successfully created directory'', today)


    # The name of the zip file

    target = today + os.sep + now + ''.zip''


    # 5. We use the zip command to put the files in a zip archive

    zip_command = "zip -qr {0} {1}".format(target, '' ''.join(source))


    # Run the backup

    if os.system(zip_command) == 0:

    print(''Successful backup to'', target)

    ```'
