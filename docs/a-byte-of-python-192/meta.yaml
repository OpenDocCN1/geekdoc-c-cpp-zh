    \nYou can also have an else clause associated with a try.. block. The else clause\
    \ is executed if no exception occurs.\n\nIn the next example, we will also see\
    \ how to get the exception object so that we can retrieve additional information.\n\
    \n# Raising Exceptions\n\nYou can raise exceptions using the raise statement by\
    \ providing the name of the error/exception and the exception object that is to\
    \ be *thrown*.\n\nThe error or exception that you can arise be class which directly\
    \ or indirectly be a derived class of the Exception class.\n\n```\n#!usr/bin/python\n\
    # Filename: raising.py\n\nclass ShortInputException(Exception):\n    '''\"user-defined\
    \ exception class.\"''\n    def __init__(self, length, atleast):\n        self.length\
    \ = length\n        self.atleast = atleast\n```\n\n```\ntry:\n    text = input('Enter\
    \ something -> ')\n    if len(text) < 3:\n        raise ShortInputException(len(text),\
    \ 3)\n    # Other work can continue as usual here\nexcept EOFError:\n    print('Why\
    \ did you do that an EOF on me?')\nexcept ShortInputException as ex:\n    print('The\
    \ input was {0} long, expected at least {1}')\\'\n        .format(ex.length, ex.atleast))\n\
    else:\n    print('No exception was raised.')\n```\n\nOutput:\n\n```\npython raising.py\n\
    Enterter something -> a\n```"
