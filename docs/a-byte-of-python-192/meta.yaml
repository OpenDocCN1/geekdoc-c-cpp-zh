    - [StackOverflow 上带有 标签的问题](http://beta.stackoverflow.com/questions/tagged/python)


    ## 技巧与技巧


    - [Python 技巧与技巧](http://www.siafoo.net/article/52)

    - [使用 Python 的高级软件园艺](http://ivory.idyll.org/articles/advanced-sw/)

    - [Charming Python](http://gnosis.cx/publish/tech_index_cp.html) 是 David Mert
    编写的一系列优秀的 Python 相关文章。


    ## 书籍、论文、教程、视频


    读完这本书后的下一个选择是阅读 Mark Pilgrim 出色的 [Dive Into Python](http://www.diveintopython.org)
    书籍，你也可以在线阅读。《Dive Into Python》一书详细探讨了正则表达式、XML 处理、Web 服务、单元测试等主题。


    其他资源还有：


    - ShowMeDev 的 Python 视频 (http://showmedo.com/videos/python)

    - GoogleTechTalks 关于 Python 的视频 (http://youtube.com/resultsSearch_query=googletealks+python)

    - Awaretek 的 Python 教程综合列表 (http://www.awaretek.com/tutorials/html)

    - The Effbot 的 Python 区域 (http://effbot.org/zone/)

    - 每封 Python-URL 邮件末尾的链接 (http://groups.google.com/group/comp.lang.python.announce/t/37de9ef036293d)

    - Python 论文 (http://pythonpapers.org)


    ## 讨论


    如果你被 Python 问题困住了，且不知道该问谁，那么 comp.lang.python 讨论组 (http://groups.google.com/group/comp.lang.python/topics)
    是提问的最佳地方。


    请确保你已经做了功，并尝试过自己解决问题。


    ## 新闻


    如果你想了解 Python 世界的最新动态，请关注 [官方 Python Planet](http://planet.python.org) 和/或 [非官方
    Python Planet](http://www.planetpython.org)。


    ## 安装库


    Python 包索引索引 (http://pypi.python.org/pypi) 上有海量的开源库，你可以在自己的程序中使用它们。


    要安装和使用这些库，你可以使用 Philip J. Eby 的 [Excellent Easytool](http://peak.telecommunity.com/DevCenter/EasyInstall#using-easy-install)。


    ## 图形化软件


    假设你想用 Python 创建自己的图形化程序。可以使用带有 Python 绑定的 GUI（图形用户界面）库来实现。绑定（Bindings）允许你用 Python
    编写程序，并使用用 C 或 C++ 或其他语言编写的库。


    使用 Python 开发 GUI 有选择：


    ### PyQt


    这是 Qt 工具包的 Python 绑定，KDE 基于此构建。Qt 非常易用且功能强大，特别是得于 Qt Designer 和精彩的 Qt 文档。PyQt
    是免费的，但如果你想创建专有的闭源软件（GPL ），则需要购买。从 Qt 4.5 开始，你也可以用它创建非 GPL 软件。入门入门，请阅读 PyQt 教程
    (http://zetcode.com/tutorials/pyqt4/) 或 PyQt 书籍 (http://www.qtrac.com/pythonbook.html)。


    ### PyGTK


    这是 GTK+ 的 Python 绑定，GNOME 基于此构建。GTK+ 在用法上有许多怪癖，但一旦你变得熟悉，就可以快速创建 GUI 应用。Glade 界面设计器是必不可少的。文档有待改进。GTK+
    在 Linux 上运行良好，但其 Windows 移植并不完整。你可以使用 GTK+ 创建免费和专有软件。入门，请阅读 PyGTK 教程 (http://www.pygtk.org/tutorial.html)。


    ### wxPython


    这是 wxWidgets 工具包的 Python 绑定。wxPython 有相应的学习曲线。然而，它非常有移植性，可以在 Linux、Windows 甚至嵌入式平台上运行。wxPython
    有很多可用 IDE，包括 GUI 设计器如 SPE (Stani''s Python Editor) (http://spe.pycs.net/) 和 wxGlade
    (http://wxglade.sourceforge.net/) GUI 构建器。你可以使用 wxPython 创建专有软件。入门，请阅读 wxPython
    教程 (http://zetcode.com/wxpython/)。


    ### Tkinter


    这是最老的 GUI 工具包之一。如果你用过 IDLE，那么你工作时就在用 Tkinter 程序。它的外观不是最好的，因为看起来很老派。Tkinter 是可移植的，可以在
    Linux/Unix 和 Windows 上运行。重要的是，Tkinter 是 Python 标准发行的一部分。入门，请阅读 Tkinter 教程 (http://www.python.com/library/tkinter/introduction/)。


    更多选择请访问官方 python 网站上的 GuiProgramming wiki 页面 (http://www.python.org/cgi-bin/moin/GuiProgramming)。


    ## GUI 工具总结


    遗憾的是，Python 没有标准的 GUI 工具。我建议你根据自己的情况选择上述工具之一。第一个因素是你是否愿意付费或使用 GUI 工具。第二个因素是你是希望程序只运行在
    Windows 或 Mac、Linux 还是所有平台。第三个因素（如果选择了 Linux 平台）是你是 Linux 的 KDE 用户还是 GNOME 用户。


    欲了解详细全面的分析，请参见《Python Papers》第 3 卷第 1 期第 26 页 (http://archive.pythonpapers.org/ThePythonPapersVolume3Issue1.pdf)。


