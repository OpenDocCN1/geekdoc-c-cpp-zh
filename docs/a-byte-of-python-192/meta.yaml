    # # Python en:Translations


    There are many translations of the book available in different human languages,
    thanks to many tireless volunteers!


    If you want to help these translations, please see the list of volunteers and
    languages below\and decide if you want to start a new translation or help in existing
    translation projects.

    If you plan to start a new translation, please read the Translation Howto.


    # ## Chinese


    Juan Sean (orion-underscore-val-at-163-dot-com) has volunteered to translate the
    book to Chinese.


    > > what I am a postgraduate at Wireless Telecommunication Graduate School, Beijing
    University of Technology, China PR. My current research interest is on the synchronization,
    channel estimation and multi-user detection of multicarier CDMA system. Python
    is major programming language for daily simulation and research job, with the
    help of Python Numeric, actually. Python just half a year before, but as you can
    see, it''s really easy-understanding, easy-to and productive. just what is ensured
    in Swaroop''s book. It''s my favorite programming language now. ''A Byte of Python''
    is my tutorial to learn Python. It''s not too long, but efficiently covers almost
    all important things in Python. It''s A Byte of Python would be strongly recommendable
    for newbies as their first Python tutorial. Just dedicate my translation to the
    potential millions of Python users in China.


    # ## Chinese Traditional


    Fred Lin (gasolin-at-gmail-dot-com) has volunteered to translate the book to Chinese
    Traditional.


    It is available at http://code.google.com/p/zhpy/wiki/ByteOfZhpy (http://code.google.com/p/zhpy/wiki/ByteOfZhpy).


    An exciting feature of this translation is that it contains the executable python
    sources side by side with the original python sources.


    Fred Lin - I''m working as a network framework engineer at Delta Network, I''m
    also a contributor of TurboGears framework. As a Python evangelist, I need some
    material to promote python language. ''A Byte of Python'' hit the sweet point
    for both novices and experienced programmers. ''A Byte of Python'' elaborates
    the python essentials with affordable size. The translation are originally based
    on simplified chinese version, and soon a lot of rewrite were made to fit the
    current wiki version and the quality of reading. The recent chinese traditional
    version also featured with executable python sources, which are achieved by my
    new ''zhpy'' (python in chinese) project (launch from Aug 07), zhpy(pronounce
    (Z.H., or zippy) build a layer over python to translate or interact with python
    in chinese(Traditional or Simplified). This project is mainly aimed for education.'
