    \ a number of functions in other programs that you write? As you might have guessed,\
    \ the answer is modules.\n\nThere are various methods of writing modules, but\
    \ the simplest way is to create a file with a .py extension that contains functions\
    \ and variables.\n\nAnother method is to write the modules in the native language\
    \ in which the Python interpreter was written. For example, you can write modules\
    \ in the C programming language (http://docs.python.org/ending/) and when compiled,\
    \ they can be used from your Python code using the standard Python interpreter.\n\
    \nA module can be imported by another program to make use of its functionality.\
    \ This is how we can use the Python standard library as well. First, we will see\
    \ how to use the standard library modules.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: using_sys.py\n\nimport sys\n```\n\n```\nprint('The command line arguments:')\n\
    for i in sys.argv:\n    print(i)\n```\n\n```\nprint('\\\\n\\nThe PYTHONPATH is',\
    \ sys.path, '\\\\n')\n```\n\nOutput:\n\n```\n$ python using_sys.py we are arguments\n\
