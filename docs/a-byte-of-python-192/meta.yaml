    \ndef howMany():\n    '''打印当前数量.'''\n    print('We have {0:d} robots.'.format(Robot.population))\n\
    \nhowMany = staticmethod(howMany)\n\ndroid1 = Robot('R2-D2')\ndroid1.sayHI()\n\
    Robot.howMany()\n\ndroid2 = Robot('C-3PO')\ndroid2.sayHI()\nRobot.howMany()\n\n\
    print(\"Robots can do some work here\")\nprint(\"Robots have finished their work.\
