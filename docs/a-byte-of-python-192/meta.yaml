  md: '# Python en:Appendix About


    # Colophon


    Almost all of the software that I have used in the creation of this book are free
    and open source software.


    # Birth of the Book


    In the first draft of this book, I had used Red Hat 9.0 Linux as the foundation
    of my setup and in the sixth draft, I used Fedora Core 3 Linux as the basis of
    my setup.


    Initially, I was using KWord to write the book (as explained in the History Lesson
    in the preface).


    # Teenage Years


    Later, I switched to DocBook XML using Kate but I found it too tedious. So, I
    switched to OpenOffice which was just excellent with the level of control it provided
    for formatting as well as the PDF generation, but it produced very sloppy HTML
    from the document.


    Finally, I discovered XEMacs and I rewrote the book from scratch in DocBook XML
    (again) after I decided that this format was the long term solution.


    In the sixth draft, I decided to use Quanta+ to do all the editing. The standard
    XSL stylesheets that came with Fedora Core 3 Linux were being used. The standard
    default fonts are used as well. However, I had written a CSS document to give
    color and style to the HTML pages. I had also written a crude lexical analyzer,
    in Python of course, which automatically provides syntax highlighting to all the
    program listings.


    # Now


    For this seventh draft, I''m using MediaWiki (http://www.mediawiki.org) as as
    the basis of my setup (http://www.swaroopch.com/notes/). Now I edit everything
    online and the readers can directly read/edit/discuss within the wiki website.


    I still use Vim for editing tasks to the ViewSourceWith extension for Firefox
    (https://addons.mozilla.org/en-US/firefox/addon/394) that integrates with Vim.'
  merge: -1
