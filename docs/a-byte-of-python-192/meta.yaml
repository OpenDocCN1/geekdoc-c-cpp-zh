    Notice that var = var operation expression becomes var operation= expression.


    # Evaluation Order


    If you had an expression as 2 + 3 * 4, is the addition done first or the multiplication?
    Our high school maths tells us that the multiplication should be done first. This
    means that the multiplication operator has higher precedence than the addition
    operator.


    The following table gives the precedence table for Python, from the lowest precedence
    (least binding) to the highest precedence (most binding). This means that in a
    given expression, Python will evaluate the operators and expressions lower in
    the table before the ones higher in the table.


    The following table, taken from the Python reference manual (http://docs.python.org/dev/3/reference.html#evaluation-order),
    is provided for the sake of completeness. It is far better to use parentheses
    to group operators and operands appropriately in order to explicitly specify the
    precedence. This makes the program readable. See the Order of Evaluation for details.


    | Operator | Description |

    | --- | --- |

    | lambda | Lambda Expression |

    | or | Boolean OR |

    | and | Boolean AND |

    | not x | Boolean NOT |

    | in, not in | Membership tests |

    | is, not | Identity tests |

    | <, <=, >, >=, !=, == | Comparisons |

    | | Bitwise OR |

    | ^ | Bitwise XOR |

    | & | Bitwise AND |

    | <<, >> | Shifts |

    | +, - | Addition and subtraction |

    | *, /, % | Multiplication, Division, Floor Division and Remainder |

    | +x, -x | Positive, Negative |'
