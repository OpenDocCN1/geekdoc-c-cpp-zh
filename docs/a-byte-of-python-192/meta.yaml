- md: "\n# A Byte of Python\n\nv1.92 (for Python 3.0)\n\n## Python\n\nChoose your\
    \ Python version:\n\nIf you want to learn the current Python 2.x, read here [1]\
    \ or download the PDF [2]\n\nIf you want to learn the new Python 3.0, read here\
    \ or download the PDF [3]\n\nYou can also buy a printed hardcopy. [4]\n\n## Introduction\n\
    \n'A Byte of Python' is a book on programming using the Python language. It serves\
    \ as a tutorial or guide to the Python language for a beginner audience. If you\
    \ all know about computers is how to save text files, then this book is for you.\n\
    \nThis book is updated for the new Python 3.0. If you are looking for a tutorial\
    \ on the current Python 2.x version, please download the previous revision of\
    \ the book [5]. On the same name, if you're wondering whether to learn Python\
    \ 2.x or 3.x, then read this article by James Bennett [6].\n\n## Who Reads 'A\
    \ Byte of Python'?\n\nHere are what people are saying about the book:\n\n## Feedback\
    \ From Readers\n\n- This is the best tutorial I've ever seen! Thank you for your\
    \ effort.\n- Walt Michalik (wmich50-at-theramp-dot-net)\n- You've made the best\
    \ tutorial I found on the Net. Great work. Thanks!\n- Joshua Robin (joshrob-at-poccta-dot-onel-ot-pl)\n\
    - Hi, I'm from Dominican Republic. My name is Pavel, I recently read your book\
    \ 'A Byte of Python' and I consider it excellent!! :). I learnt much from all\
    \ the examples. Your book is of great help for newbies like...\n- Pavel Simo (pavel-dot-simo-at-gmail-dot-com)\n\
    - I recently finished Reading of Python, and I thought I really ought to thank\
    \ you. It was so sad to read the final pages as I now have to go back to dull,\
    \ tedious oily or etc. manuals for learning about Python. I really appreciate\
    \ your book\n- Samuel Young (sy-one-three-seven-at-gmail-dot-com)\n- Dear Swaroop,\
    \ I am taking a class from an instructor that has no interest in teaching. We\
    \ are using Learning Python, second edition, by O'Reilly. It is not a text for\
    \ beginner without any programming knowledge, and an instructor that should be\
    \ working in another field. Thank you very much for your book, without it I would\
    \ be clueless about Python and programming. Thanks a million, you are able to\
    \ 'break the message down' to a level that understands and not everyone can.\n\
    - Joseph Duarte (jduarte1-at-cfl-dot-rr-dot-com)\n- i love your book! It is the\
    \ greatest Python tutorial ever, and a very useful reference. Brilliant, a true\
    \ masterpiece! Keep up the good work!\n- Chris-André Sommerseth\n\n## Python 3\n\
    \nI'm just e-mailing you to thank you for writing Byte of Python online. I had\
    \ been attempting Python for a few months prior to stumbling across your book,\
    \ although I made limited success with PyGame, I never completed the program.\n\
    \nThanks to your simplification of the categories, Python actually seems a reachable\
    \ goal. It seems like I have finally learned the foundations and I can continue\
    \ into my real goal, game development.\n\nOnce again, thanks VERY for placing\
    \ such a structured and helpful guide to basic programming on the web. It moved\
    \ me into and out of OOP with an understanding where two books had failed.\n\n\
    - Matt Gallivan (m-underscore-gallivan-12-at-hotmail-dot-com)\n\nI would like\
    \ to thank you for your book 'A byte of python' which myself find the best way\
    \ to learn python. I am a 15 year old living in egypt my name is Ahmed. My second\
    \ programming language I learn visual 6 at school but didn't enjoy it, however\
    \ i really enjoyed learning python. I made the addressbook program and i was successful,\
    \ if i will try to start me source that would be helpful). If you could tell me\
    \ where to find a tutorial as good as for you that would help me a lot. Thanks.\n\
    \n- Ahmed Mohammed (sedo-underscore-91-at-hotmail-dot-com)\n\nA wonderful resource\
    \ for beginners to learn more about Python is the 110-page PDF tutorial A Byte\
    \ of Python by Swaroop C H. It is well-written, easy to follow, and may be the\
    \ best introduction to Python programming Scribus\n\n- Drew Ames in an article\
    \ on Scripting Scribus [17] published on Linux.com\n\nYesterday I got through\
    \ most of Byte of Python on my Nokia N800 and it's the easiest and most concise\
    \ introduction to Python I have encountered. Highly recommended as a starting\
    \ point for learning Python.\n\n- Jasonport for his weblog [8]\n\n## Academic\
    \ Courses\n\nThis book is being used as instructional material in various institutions:\n\
    \n1. 'Principles of Programming Languages' course at Vrije Universiteit, Amsterdam\
    \ [9]\n2. 'Basic Concepts of Computing' course at University California Davis\
    \ [10]\n3. 'Programming With Python' course at Harvard University [11]\n4. 'Introduction\
    \ to Programming' course at University Leeds [12]\n5. 'Introduction to Application\
    \ Programming' course at Boston University [13]\n6. 'Information Technology Skills'\
    \ course at University Oklahoma [14]\n7. 'Processing' course at Michigan State\
    \ University [15]\n8. 'Multi Agent Web Systems' course at University Edinburgh\
    \ [16]\n\n## Even NASA\n\nThe book is used by NASA! It is used in their Jet Propulsion\
    \ Laboratory with Deep Space Network project.\n\n## Official Recommendation\n\n\
    The book has been listed on the official website, next to the official documentation.\n\
    \n## License\n\n1. This book is licensed under the Creative Commons Attribution-Share\
    \ Alike 3.0 license. This means:\n    - You are free to copy, distribute and transmit\
    \ this book\n    - You are free to adapt this book\n    - Under the conditions:\n\
    \    - Attribution must attribute the work in the manner specified by the author\
    \ (but not in any way that suggests they endorse your use of this book).\n   \
    \ - If you alter, transform, or build upon this work, you may distribute the resulting\
    \ work only under the same or similar license.\n    - For any reuse or distribution,\
    \ you must make clear to others the terms.\n2. Attribution must be shown by linking\
    \ back to swaroop.com/notes/ and clearly indicating that the original text can\
    \ be fetched from this location.\n3. All the code/scripts provided in this book\
    \ is licensed under three-clause BSD License unless otherwise noted.\n4. Volunteer\
    \ contributions to original book must be under this same license and the copyright\
    \ must be assigned to the main author of this book.\n\n## Read Now\n\nYou can\
    \ read the book online at Table of Contents.\n\n## Buy the Book\n\nA printed hardcopy\
    \ of the book can be purchased for your offline reading pleasure, and to support\
    \ the continued development and improvement of this book.\n\n## Download\n\n-\
    \ PDF (631KB)\n- Mediawiki dump (276KB) (for advanced users only)\n\nIf you wish\
    \ to support the continued development of this book, please consider making a\
    \ donation [24] or by a hardcopy [25].\n\n## Translations\n\nIf you are interested\
    \ in reading or contributing translations of this book to other human languages,\
    \ please see Translations.\n\n## References\n\n[1] http://www.ibiblio.org/swaroopch/byteofpython/read/\n\
    [2] http://www.ibiblio.org/swaroopch/byteofpython/files/120/byteofpython_120.pdf\n\
    [3] http://www.swaroopch.com/files/byteofpython/byte_of_python_v191.pdf\n[4] http://www.swaroopch.com/buybook\n\
    [5] http://www.ibiblio.org/swaroopch/files/120/\n[6] http://www.b-list.org/web/2008/dec/05/python-3000/\n\
    [7] http://www.linux.com/feature/262522\n[8] http://paxmodept.com/telesto/blog.html?id=627\n\
    [9] http://www.few.vu.nl/~nilisvis/PPL/207/index.html\n[10] http://cs.ucdavis.edu/courses/exp_course_desc/10.html\n\
    [11] http://www.people.fas.harvard.edu/~preshman/python_winter.html\n[12] http://www.comp.edu/accom/1900/\n\
    [13] http://cs.bu.edu/courses/cs108/materials.html\n[14] http://https.astr.ou.edu/byteofpython/\n\
    [15] http://www.msu.edu/~aston/class/825/index.html\n[16] http://homepages.inf.ac.uk/ewan/maswas/\n\
    [17] http://dsnra.jpl.nasa.gov/software/Python/byte-of-python/output/byteofpython_html/\n\
