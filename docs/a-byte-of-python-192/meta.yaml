    \ done in the previous section. This aptly demonstrates the use of the while statement.\n\
    \nWe move the if and statements to inside the while loop and set the variable\
    \ running before the while loop. First, we check if the variable running is True\
    \ and then proceed to execute the corresponding while-block. After this block\
    \ is executed, the condition is again checked in this case is the running variable.\
    \ If it is true, we execute the while-block again, else we continue to execute\
    \ the optional else-block and then continue to the next statement.\n\nThe else\
    \ block is executed when the while loop condition becomes False - this may be\
    \ the first time that the condition is checked. If there is an else clause for\
    \ a while loop, it is always unless you break out of the loop with a break statement.\n\
    \nThe True and False are called Boolean types and you can consider them to be\
    \ equivalent to the value 1 and 0 respectively.\n\n## Note for C/C++ Programmers\n\
