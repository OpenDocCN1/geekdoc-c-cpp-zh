    >>> shoplist[::]

    [''apple'', ''mango'', ''carrot'', ''banana'']

    >>> shoplist[:2]

    [''apple'', ''mango'']

    >>> shoplist[:3]

    [''apple'', ''mango'', ''carrot'']

    >>> shoplist[:-1]

    [''apple'', ''mango'', ''carrot'']

    ```


    Notice that when the step is 2, we get the items with position 0, 2, ... When
    the step size is 3, we get the items with position 0, 3, etc.


    Try various combinations of slice specifications using the Python interpreter
    interactively i.e. the prompt so that you can see the results immediately. The
    great thing is you can access tuples, lists and strings all in the same way!


    # Set


    Sets are unordered collections of simple objects. These are used when the existence
    of an object in a collection is more important than the order or how many times
    it occurs.


    Using sets, you can test for membership, whether it is a subset of set, and find
    the intersection between two sets, and so on.


    ```

    >>> bri = set([''brazil'', ''russia'', ''india''])

    >>> ''india'' in bri

    True

    >>> ''usa'' in bri

    False

    >>> bric = bri.copy()

    >>> bric.add(''china'')

    >>> bric.issuperset(bri)

    True

    >>> bri.remove(''russia'')

    >>> bri & bric # bri.intersection(bric)

    {''brazil'', ''india''}

    ```


    How It Works:


    The example is pretty much self-explanatory because it involves basic set theory
    mathematics taught in school.'
