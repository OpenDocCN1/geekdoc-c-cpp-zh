    \ >, >=, !=, == | 比较 |\n| | 按位或 |\n| ^ | 按位异或 |\n| & | 按位与 |\n| <<, >> | 移位 |\n\
    | +, - | 加法和减法 |\n| *, /, % | 乘法、除法、地板除和取模 |\n| +x, -x | 正数、负数 |\n| ~x | 按位非 |\n\
    | ** | 幂 |\n| x.attribute | 属性引用 |\n| x[index] | 索引访问 |\n| x[index1:index] | 切片\
    \ |\n| f(arguments ...) | 函数调用 |\n| (expressions, ...) | 绑定或元组显示 |\n| [expressions,\
    \ ...] | 列表显示 |\n| {key:datum, ...} | 字典显示 |\n\n我们尚未遇到的运算符将在后面的章节中解释。具有相同优先级的运算符列在上表的同一行。例如，`+`\
    \ 和 `-` 优先级相同。\n\n## 求值顺序\n\n为了使表达式更具可读性，我们可以使用括号。例如，`2 + (3 * 4)` 显然比 `2 + 3\
    \ * 4` 更容易理解，后者需要运算符优先级的知识。像其他所有东西一样，括号应该合理使用（不要反过来），并且它应该是冗余的（如 `2 + (3) * 4`）。\n\
    \n使用括号还有一个额外的优势——它可以帮助我们改变求值顺序。例如，如果你想在表达式中先计算加法再计算乘法，可以写成类似 `(2 + 3) * 4` 的代码。\n\
    \n## 结合性\n\n运算符通常从左到右结合，即具有相同优先级的运算符按照从左到右的方式评估。例如，`2 + 3 + 4` 被评估为 `(2 + 3) +\
    \ 4`。某些运算符（如赋值运算符）具有从右到左的结合性。`a = b = c` 被视为 `a = (b = c)`。\n\n## 表达式\n\n示例：\n\
