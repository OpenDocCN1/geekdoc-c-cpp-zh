    \ 'C:\\\\Python30\\\\lib',\n'C:\\\\Python30\\\\lib\\\\plat-win', 'C:\\\\Python30',\n\
    'C:\\\\Python30\\\\lib\\\\site-packages']\n```\n\nHow It Works:\n\nFirst, we import\
    \ the sys module using the import statement. Basically, this translates to telling\
    \ Python that we want to use this module. The sys module contains functionality\
    \ related to the Python interpreter and its environment i.e. the system."
