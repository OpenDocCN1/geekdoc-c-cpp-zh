  md: '# Python:Introduction


    Python is indeed an exciting and powerful language. It has the right combination
    of performance and features that make writing programs in Python both fun and
    easy.


    # Why not Perl?


    If you didn''t know already, Perl is another extremely popular open source interpreted
    programming language.


    If you have ever writing a large program in Perl, you would have answered this
    question yourself! In other words, Perl programs are easy when they are small
    and it excels at small hacks and scripts to ''get done''. However, they quickly
    become unwieldy once you start writing bigger programs and I am speaking this
    of my experience writing large programs at Yahoo!


    Compared to Perl, Python programs are decidedly simpler, easier to write and hence
    more understandable. I admire Perl and I use it on a daily basis for various things
    whenever I write a program, I am always thinking in terms of Python because it
    becomes so natural for me. Perl has undergone so many hacks and changes, that
    it feels like it is one big (but one of hell) hack. Sadly, the upcoming Perl 6
    does not seem to be making any improvements regarding this.


    The only and very significant advantage that I feel Perl, is its huge CPAN (http://cpan.perl.org)
    library - The Comprehensive Perl Archive Network. As the name suggests, this is
    a humongous collection of Perl programs and it is simply mind-boggling by its
    sheer size and depth - you can do so much with a computer using these modules.
    One of the reasons that Perl has more libraries than Python is that it is growing.
    However this seems to be changing with the growing Python Package Index (http://pypi.python.org/pypi).


    # Why not Ruby?


    If you didn''t know already, Ruby is another popular open source interpreted programming
