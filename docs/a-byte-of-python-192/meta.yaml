    \n下表取自 Python 参考手册（http://docs.python.org/dev/3/reference.html#evaluation-order），为了完整性而提供。更好的做法是使用括号对运算符和操作数进行分组以显式指定优先级。这使程序更具可读性。详情“求值顺序”。\n\
    \n| 运算符 | 说明 |\n| --- | --- |\n| lambda | Lambda 表达式 |\n| or | 布尔或 |\n| and |\
