    # Python en:Exceptions


    # Introduction


    Exceptions occur when certain exceptional situations occur in your program. For
    example, what if you are going to read a file and the file does not exist? Or
    if you accidentally deleted it when the program was running? Such situations are
    handled using exceptions.


    Similarly, if your program had some invalid statements? This is handled by Python
    which raises its hands and tells you there is an error.


    # Errors


    Consider a simple print function. What if we missed print as Print? Note the capitalization.
    In this case, Python raises a syntax error.


    ```

    >>> Print(''Hello World'')

    Traceback (most recent call last):

    File "<pshell#0>", line 1, in <module>

    Print(''Hello World'')

    NameError: name ''Print'' is not defined

    >>> print(''Hello World'')

    Hello World

    ```'
