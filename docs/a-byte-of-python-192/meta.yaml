    \nPrevious | Next\n\nSource: http://www.swaroop.com/mediawiki/index.php?oldid=22359\n\
    Contributors: Horstjens, Swaroop, 6 anonymous edits\n\n## Python: Input Output\n\
    \n### Introduction\n\nThere will be situations where your program has to interact\
    \ with the user. For example, we would want to take input from the user and then\
    \ print some results back. We can achieve this using the `input()` and `print()`\
    \ functions respectively.\n\nFor output, we can also use the various methods of\
    \ the str (string) class. For example, we can use the `rjust` method to get a\
    \ string which is right justified to a specified width. See `help(str)` for more\
    \ details.\n\nAnother common type of input/output is dealing with files. The ability\
    \ to create, read and write files is essential to many programs and we will explore\
    \ this.\n\n### Input from user\n\n```python\n#!/usr/bin/python\n\ndef reverse(text):\n\
    \    return text[::-1]\n\ndef is_palindrome(text):\n    something = input(\"Enter\
    \ text: \")\n    if something == reverse(something):\n        print(\"Yes, it\
    \ is\")\n    else:\n        print(\"No, it is not\")\n```\n\nOutput:\n```\n$ python\
    \ user_input.py\nEnter text: madam\nYes, it is\nEnter text: hello\nNo, it is not\n\
    Enter text: racecar\nYes, it is\nEnter text: python\nNo, it is not\n```\n\n##\
    \ How It Works\n\nFirst, open a file by using the built-in `open` function and\
    \ specifying the name of the file and the mode in which we want to open it. The\
    \ mode can be read mode ('r'), write mode ('w') or append mode ('a'). We can also\
    \ be dealing with text file ('t') or a binary file ('b'). There are actually many\
    \ modes available and `help(open)` will give you more details about. By default,\
    \ `open()` considers the file to be a 'text' file and opens it in 'read' mode.\n\
    \nIn our example, we open the first file in write mode and then use the write\
    \ method of the file object to write to the file. We then close the file.\n\n\
    Next, we open the same file in read mode. We don't need to specify a mode because\
    \ 'read text file' is the default. We read in each line of the file using the\
    \ `readline` method in a loop. This method returns a complete line including the\
    \ newline character at the end of the line. When an empty string is returned,\
    \ it means that we have reached the end of the file and 'break' out of the loop.\n\
    \nBy default, the `print()` function prints the text as well as an automatic newline\
    \ to the screen. We are suppressing the newline by `end=''` because the line that\
    \ is read from the file already has a newline character. Then, we finally close\
    \ the file.\n\n### Files\n\n```python\n#!/usr/bin/python\n# Filename: files.py\n\
    \npoem = '''\nProgramming is fun\nWhen the work is done'''\n\nf = open('poem.txt',\
    \ 'w')\nf.write(poem)\nf.close()\n\nf = open('poem.txt')\nwhile True:\n    line\
    \ = f.readline()\n    if len(line) == 0:\n        break\n    print(line, end='')\n\
    f.close()\n```\n\nOutput:\n```\n$ python files.py\nProgramming is fun\n```\n\n\
    ## Pickle\n\nPython provides a standard module called pickle which you can store\
