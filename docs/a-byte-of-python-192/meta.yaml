    \ 'mango', 'carrot']\n\n# Write to the file\nf = open(shoplistfile, 'wb')\npickle.dump(shoplist,\
    \ f) # dump the object to a file\nf.close()\ndel shoplist # destroy the shoplist\
    \ variable\n\n# Read back from the storage\nf = open(shoplistfile, 'rb')\nshoplist\
    \ = pickle.load(f) # load the object from a file\nf.close()\nprint(shoplist)\n\
    ```\n"
