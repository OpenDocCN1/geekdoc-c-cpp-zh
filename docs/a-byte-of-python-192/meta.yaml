    there is very little good documentation in german available. When I came across
    your book the spontaneous idea of a german translation crossed my mind. Luckily,
    Lutz had the same idea and we now divide the work. I am looking forward to a good
    cooperation!


    # Norwegian (bokmål)


    Eirik Vågar (or Vages) is a high student at Sandvika videregagende skole (http://no.wikipedia.org/wiki/Sandvika_videregagÅnde_skole)
    in Norway, a blogger (http://forbedre.blogspot.com/) and is currently translating
    the book to Norwegian (bokmål). The translation is in progress and you can check
    the table of contents for more details.


    > Eirik Vågar: I have always wanted to program, but because I speak a small language,
    the learning process was much harder. Most tutorials and books are written in
    very technical English, most high school graduates will not have the vocabulary
    to understand what the tutorial is. When I discovered this book, all my problems
    were solved. "A Byte of Python" used simple non-technical language to explain
