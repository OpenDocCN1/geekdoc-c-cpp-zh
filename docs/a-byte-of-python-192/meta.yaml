    ## 导言


    ### 导言


    Python 是少数可以自称既**简单**又**强大**的语言之一。你会发现，专注于解决问题而不是你正在编写的语言的语法和结构是多么容易，这会让你感到非常惊喜。


    Python 的官方介绍是：


    - 一种编程语言。它具有高效的高级数据结构和一种简单但有效的面向对象编程方法。Python 优雅的语法和动态类型，加上它的解释型特性，使其成为许多平台领域脚本编写和快速应用程序开发的理想语言。


    我将在下一节中详细讨论这些大部分特征。


    ## 备注


    > Python 语言的创始人 Guido van Rossum 以 BBC 节目《蒙提派的飞行马戏团》为该语言命名。他并不特别喜欢那些通过缠绕身体并压碎动物来进食的蛇。


    ## Python 的特性


    ### 简单


    Python 是一种简单且极简主义的语言。阅读一个良好的 Python 程序感觉几乎就像在读英语，尽管是非常严格的英语！Python 的这种伪代码是其最大的优势之一。它允许你专注于问题的解决方案而不是语言本身。


    ### 易于学习


    正如你所看到的，Python 极其容易上手。正如前面提到的，Python 拥有异常简单的语法。


    ### 免费且开源


    Python 是 FLOSS（自由/许可和开源软件）的一个例子。简单来说，你可以自由地分发该软件的副本、阅读其源代码、对其进行修改，并在新程序中使用部分代码。FLOSS
    基于共享知识的社区概念。这是 Python 如此好的原因之一——它由一个只想使用更好 Python 的社区创建并不断改进。


    ### 高级语言


    当你用 Python 编写程序时，你永远不需要担心低级细节，例如程序使用的内存等。


    ### 可移植性


    由于其开源性质，Python 已被移植到（即修改以使其运行于）许多平台。如果你足够仔细地避免任何依赖于系统的特性，你的所有 Python 程序都可以这些平台上平台上运行，而无需任何更改。


    你可以在 Linux、Windows、FreeBSD、Macintosh、Solaris、OS/2、Amiga、AROS/400、FreeBSD、OS/390、z/OS、Palm
    OS、QNX、VMS、Psion、Acorn RISC OS、VxWorks、PlayStation、Sharp Zaur、Windows CE 和 PocketPC
    上使用 Python！


    ### 解释型


    这需要一点解释。

    用 C 或 C++ 等编译型语言编写的程序，使用带有各种标志和选项的编译器，从源语言（即 C 或 C++）转换为你的计算机所理解的语言（二进制代码，即 0
    和 1）。当你运行程序时，链接器/软件将程序从硬盘复制到内存中并开始运行。


    相反，Python 不需要编译为二进制文件。你只需从源代码直接运行程序。在内部，Python 将源代码转换为中间形式字节码，然后将其翻译成你计算机的本地语言并运行。实际上，这一切使得使用
    Python 变得容易得多，你不需要担心编译程序、确保链接并加载了正确的库等等。这也使得你的 Python 程序更具可移植性，因为你只需要将 Python
    程序复制到另一台计算机上它就能运行！


    ### 面向对象


    Python 既支持过程面向也支持面向对象编程。在过程面向语言中，程序是围绕过程或函数构建的，这些过程不是可重用的程序段。在面向对象语言中，程序是围绕结合数据和功能的对象构建的。Python
    拥有一种非常强大且简单的 OOP 实现方式，特别是与 C++ 或 Java 这样的大语言相比。


    ### 可扩展性


    如果你需要一段关键代码运行得非常快，或者希望某些算法不公开，你可以用 C 或 C++ 编写程序的这部分，并在 Python 程序中使用它。


    ### 可嵌入性


    你可以将 Python 嵌入到你的 C/C++ 程序中，为你的程序的用户提供“脚本”能力。


    ### 丰富的库


    你可以在你的 C/C++ 程序中嵌入 Python 以为程序用户提供脚本功能。标准库确实非常强大。它可以帮你处理正则表达式、文档生成、单元测试、线程、数据库、网络浏览器、FTP、XML、XMLRPC、HTML、WAV
    文件、加密、GUI 等。这被称为 Python 的“自带电池”哲学。


    除了标准库，还有其他高质量的库，如 wxPython (http://www.wxpython.org/)、Twisted (http://www.twistedmatrix.com/)、Python
    Imaging Library (http://www.python.com/pil/index.htm) 以及更多。


    Python 确实是一种令人兴奋且强大的语言。


    ## 为什么不是 Perl？


    如果你不知道，Perl 是另一种非常流行的开源解释型语言。


    如果你曾经用 Perl 编写过大型程序，你自己就有答案了！换句话说，Perl 在处理小型脚本很容易，但当你开始编写大型程序时就会变得难以维护。


    与 Perl 相比，Python 程序明显更简单、更容易编写。我喜欢 Perl，但我编写程序时总是用 Python 的思维方式。Perl 经历了如此多的修改，感觉它就像一个巨大的
    hack。遗憾的是，即将推出的 Perl 6 似乎在这方面没有任何改进。


    我觉得 Perl 的唯一非常重要的优势是它巨大的 CPAN (http://cpan.perl.org/) 库——综合 存档网络。正如名称所示，这是一个巨大的
    Perl 程序集合，其规模和深度令人叹为观止——使用这些模块可以用计算机做很多事情。Perl 库比 Python 多的原因之一是它一直在增长。但这随着 Python
    Index (http://pypi.python.org/pypi) 的增长正在发生变化。


    ## 为什么不是 Ruby？


    如果你不知道，Ruby 是另一种流行的开源解释型语言。


    如果你已经喜欢并使用 Ruby，那么我绝对建议你继续使用。


    对于其他没有使用过并试图判断是学习 Python 还是 Ruby 的人，从学习难易程度来看，我会推荐 Ruby。我个人发现掌握 Ruby 语言很难，但对于理解
    Ruby 的人来说，他们都赞美这种语言的美。。我不我不幸运。


    ## 程序员评价


    你可能会发现阅读顶级黑客对 Python 的看法很有：


    - Eric S. Raymond 是《教堂与集市》的作者，也是“开源”一词的发明者。他说 Python 已经成为他最喜欢的编程语言 (http://www.linux.com/article.php?sid=382)。这篇文章是我首次接触
    Python 的灵感来源。

    - Bruce Eckel 是著名的《Thinking in Java》和《Thinking in C++》书籍的作者。他说没有任何语言比 Python 让他的工作效率更高。他说
    Python 也许是唯一专注于让事情变得简单的语言。


    '
