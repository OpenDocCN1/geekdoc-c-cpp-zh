    # Single Quotes


    You can specify strings using single quotes as ''Quote me on this''. All white
    space i.e. spaces and tabs are preserved as is.


    # Double Quotes


    Strings in double quotes work exactly the same way as strings in single quotes.
    An example is "What''s your name?"


    # Triple Quotes


    You can specify multi-line strings using triple quotes - ("""" or """). You can
    use single quotes and double quotes freely within the triple quotes. An example
    is:


    ```

    """This is a multi-line string. This is the first line.

    This is the second line.

    "What''s your name?"" I asked.

    He said "Bond, James Bond."

    """

    ```


    # Escape Sequences


    Suppose, you want to have a string which contains a single quote (''''), how will
    you specify this string? For example, the string is ''What''s your name?. You
    cannot specify ''What''s your name?'' because Python will be confused as to the
    string starts and ends. So, you will have to specify that this single quote does
    not indicate the end of the string. This can be done with the help of what is
    called an escape sequence. You specify the single quote as \ - notice the backslash.
    Now, you can specify the string as ''What''s your name?''


    Another way of specifying this specific string would be "What''s your name?" i.e
    using double quotes. Similarly, you have to use an escape sequence for using a
    double quote itself in a double quoted string. Also, you have to indicate the
    backslash itself using the escape sequence \\


    If you wanted to specify a two-line string? One way is to use a triple-quoted
    string as shown previously or you can use an escape sequence for the newline -
    \n to indicate the start of a new line. An example is This is the first line\nThis
    is the second line. Another useful escape sequence to know is the tab - \t. There
    are many more escape sequences but I have mentioned the most useful ones here.


    One thing to note is that in, a single backslash at the end of the line indicates
    that the string is continued in the next line, but no newline is added. For example:


    ```

    "This is the first sentence.\\nThis is the second sentence."

    ```


    equivalent to "This is the first sentence. This is the second sentence.".


    # Python Basics


    # Raw Strings


    If you need to specify some strings where no special processing such as escape
    sequences are handled, then what you need is to specify a raw string by prefixing
    it r or R to the string. An example is r"NewLines are indicated by \"


    # Strings Are Immutable


    This means that once you have created a string, you cannot change it. Although
    this might seem like a bad thing, it isn''t really. We will see why this is not
    a limitation in the various programs that we will see later.


    # String Literal Concatenation


    If you place two string literals side by side, they are automatically concatenated
    by Python. For example, "What\''s ''your name?'' is automatically converted to
    "What''s your name?"


    # Note for C/C++ Programmers


    There is no separate char data type in Python. There is no real need for it and
    I am sure you won''t miss it.


    # Note for Perl/PHP Programmers


    Remember that single-quoted strings and double-quoted strings are the same - they
    do not differ in any way.


    # Note for Regular Expressions Users


    Always use raw strings when dealing with regular expressions. Otherwise, a lot
    of backhacking may be required. For example, backreferences can be referred to
    as \\''1\'' or r\''1''.


    # The format Method


    Sometimes we want to construct strings from other information. This is where format()
    method is useful.


    ```

    #!usr/bin/python

    # Filename: str_format.py


    age = 25

    name = ''Swaroop''


    print(''{0} is {1} years old''.format(name, age))

    print(''Why is {0} playing with that python?''.format(name))

    ```


    ```

    $ python str_format.py

    Swaroop is 25 years old

    Why is Swaroop playing with that python

    ```


    How It Works:


    A string can use certain specifications and subsequently, the format method can
    be called to substitute those specifications with corresponding arguments to the
    format method.


    # Python Basics


    Observe the first usage where {} and this corresponds to the variable name which
    is the first argument to the format method. Similarly, the second specification
    is {1} corresponding to age which is the second argument to the format method.


    Notice that we could achieved the same using string concatenation + '' '' is ''
    + str(age) + '' years old'' but not how much uglier and error-prone this is. The
    conversion to string would be done automatically by the format method instead
    of the explicit conversion you need. Third, when using the format method, we can
    change the message without having to deal with the variables used and vice-versa.


    What Python does in the format method is that it substitutes each argument value
    into the place of the specification. There can be more detailed specifications
    such as:


    ```

    >>> ''{0.3}''.format(1/3) # decimal (. ) precision of 3 for float

    ''0.333''

    >>> ''{0:_11}''.format(''hello'') # fill with underscores (_) with the text centered
    ('''') to 11 width

    ''__hello____''

    >>> ''{name} wrote {book}''.format(name=''Swaroop'', book=''A Byte of Python'')

    # keyword-based

    Swaroop wrote A Byte of Python

    ```


    Details of this formatting are explained in the Python Enhancement Proposal No.
    3101 (http://www.python.org/peps/3101/).


    # Strings


    Using literal constants can soon become boring. We need some information. Variables
    are exactly what name implies. Variables are just parts of your memory where we
    give them names.


    # Identifier Name


    Variables are examples of identifiers. Identifiers are names given to something.
    There are some rules you follow:


    - The first character of the identifier must be a letter (uppercase or lowercase
    ASCII character) or underscore (''_'').

    - The rest of the identifier may consist of letters (uppercase or lowercase ASCII
    character), underscores (''_'') or digits (0-9).

    - Identifier names are case-sensitive. For example, myfile and Myname are not
    the same.

    - Examples of valid identifier are i, _my_name, name_23. Examples of invalid identifier
    are 2things, this is spaced out, my-name


    # Data Types


    Variables can hold values of different types called types. The basic types are
    numbers and strings, which we have already discussed. In later chapters, we will
    see how to create our own types using classes.


    # Objects


    Remember, Python refers to anything used in a program as an object. This is meant
    in the generic sense. Instead of saying ''the something'', we say ''the object''.


    Note for Object Oriented Programming users


    Python is strongly object-oriented in the sense that everything is an object including
    numbers, strings and functions.


    # Variables


    We will now show how to use variables along with literal constants. Save the following
    example and run the program.


    # How to write Python programs


    - Henceforth, the standard procedure to save and run a Python program is as follows:

    1. Open your favorite editor.

    2. Enter the program code in the example.

    3. Save it as a file with the filename mentioned in the comment. I follow the
    convention of having all Python programs saved with the extension .py.

    4. Run the interpreter with the command program.py or use IDLE to run the programs.


    # Example: Using Variables And Literal Constants


    ```

    # Filename : var.py

    ni = 5

    print(i)

    i = i + 1

    print(i)


    s = ''''''This is a multi-line string.

    This is the second line.\''''''

    print(s)

    ```


    ```

    Output:

    $ python var.py

    5

    6

    This is a multi-line string.

    This is the second line.

    ```


    How It Works:


    Here''s how this program works. First, we assign the literal constant value 5
    to the variable i using the assignment operator (=). This line is called a statement
    because it states that

