    \ than that')\n    # You must have guess > number to reach here\n```\n\n```\n\
    print('Done')\n# This last statement is always executed, after the if statement\
    \ is\nexecuted\n```\n\nOutput:\n\n```\n$ python if.py\nEnter an integer : 50\n\
    No, it is a little lower than that\nDone\n```\n\n```\n$ python if.py\nEnter an\
    \ integer : 22\n```"
