    \ the value of 25 due to the position of the argument. Then, the variable c gets\
    \ the value of 24 due to naming i.e. keyword arguments. The variable b gets the\
    \ default of 5.\n\nIn the third usage func(c=50, a=100), we use keyword arguments\
    \ completely to specify the values. Notice, that we are specifying value for parameter\
    \ c before for an even a is defined before c in the function definition.\n\n#\
    \ VarArgs parameters\n\nTODO\n\nShould I write about this in a later chapter since\
    \ we haven't talked about lists and dictionaries yet?\n\nSometimes you might want\
    \ to define a function that can take any number of parameters, this can be achieved\
    \ by using the stars:\n\n```\n#!/usr/bin/python\n# Filename: total.py\n```\n\n\
    ```\ndef total(initial=-5, *numbers, **keywords):\n    count = initial\n    for\
    \ number in numbers:\n        count += number\n    for key in keywords:\n    \
    \    count += keywords[key]\n    return count\n```\n\n```\nprint(total(10, 1,\
    \ 2, 3, vegetables=50, fruits=100))\n```\n\nOutput:\n\n```\n$ python total.py\n\
    166\n```\n\nHow It Works:"
  - "[PAGE 50]\n\n# Python en:Functions\n\nWhen we declare a starred parameter such\
    \ as *param, then all positional arguments from that point till the end are collected\
    \ as a list called 'param'.\nSimilarly, when we declare a double-starred parameter\
    \ such as **param, then all the keyword arguments from that point till the end\
    \ are collected as a dictionary called 'param'.\nWe will explore lists and dictionaries\
    \ in a later chapter.\n\n# Keyword-only Parameters\n\nIf we want to specify keyword\
    \ parameters to be available as keyword-only and not as positional arguments,\
    \ they can be declared after a starred parameter:\n\n```\n#!/usr/bin/python\n\
    # Filename: keyword_initial-5.py\n\ndef total(initial=5, *numbers, vegetables):\n\
    \    count = initial\n    for number in numbers:\n        count += number\n  \
    \  count += vegetables\n    return count\n\nprint(total(10, 1, 2, 3, vegetables=50))\n\
    print(total(10, 1, 2, 3))\n# Raises error because we have not supplied a default\
    \ argument value\nfor 'vegetables'\n```\n\nOutput:\n\n```\n$ python keyword_only.py\n\
    66\nTraceback (most recent call last):\nFile \"test.py\", line 12, in <module>\n\
    print(total(10, 1, 2, 3))\nTypeError: total() needs keyword-only argument vegetables\n\
    ```\n\nHow It Works:\n\nDeclaring parameters after a starred parameter results\
    \ in keyword-only arguments. If these arguments are not supplied a default value,\
    \ then calls to the function will raise an error if the keyword argument is not\
    \ supplied, as seen above.\n\nIf you want to have keyword-only arguments but have\
    \ no need for a starred parameter, simply use an empty star without using any\
    \ name such as def total(initial=5, *, vegetables)."
  - "[PAGE 51]\n\n# The return Statement\n\nThe return statement is used to return\
    \ from a function i.e. break out of the function. We can optionally return a value\
    \ from the function as well.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename:\
    \ func_return.py\n\ndef maximum(x, y):\n    if x > y:\n        return x\n    else:\n\
    \        return y\n```\n\nOutput:\n\n```\n$ python func_return.py\n3\n```\n\n\
    How Works:\nThe maximum function returns the maximum of the parameters, in this\
    \ case the numbers supplied to the function. It uses a simple if..else statement\
    \ to find the greater value and then returns that value.\n\nNote that a return\
    \ statement without a value is equivalent to return None. None is a special type\
    \ in Python that represents nothingness. For example, it is used to indicate that\
    \ a variable has no value if it has a value of None.\n\nEvery function implicitly\
    \ contains a return None statement at the end unless you have written your return\
    \ statement. You can see this by running print(someFunction()) where the someFunction\
    \ does not use the return statement such as:\n\n```\ndef someFunction():\n   \
    \ pass\n```\n\nThe pass statement is used in Python to indicate an empty block\
    \ of statements.\n\nNote\n\nThere is a built-in function called max that already\
    \ implements the 'find maximum' functionality, so use this built-in function whenever\
    \ possible."
  - "[PAGE 52]\n\n# DocStrings\n\nPython has a nifty feature called documentation\
    \ strings, usually referred to by its shorter name docstrings. DocStrings are\
    \ an important tool that you should make use of since it helps to document the\
    \ program better and makes it easier to understand. Amazingly, we can get the\
    \ docstring back from, say a function, when the program is actually running!\n\
    Example:\n\n```\n#!/usr/bin/python\n# Filename: func_doc.py\n\ndef printMax(x,\
    \ y):\n    \"\"\"Prints the maximum of two numbers.\"\"\"\n    x = int(x) # convert\
    \ to integers, if possible\n    y = int(y)\n\n    if x > y:\n        print(x,\
    \ 'is maximum')\n    else:\n        print(y, 'is maximum')\n\nprintMax(3, 5)\n\
    print(printMax.__doc__)\n```\n\nOutput:\n\n```\n$ python func_doc.py\n5 is maximum\n\
    Prints the maximum of two numbers.\n```\n\n> The two values must be integers.\n\
    \nHow It Works:\nA string on the first logical line of a function is the docstring\
    \ for that function. Note that DocStrings also apply to modules and classes which\
    \ we will learn about in the respective chapters.\n\nThe convention followed for\
    \ a docstring is a multi-line string where the first line starts with a capital\
    \ letter and ends with a dot. Then the second line is blank followed by any detailed\
    \ explanation starting from the third line. You are strongly advised to follow\
    \ this convention for all your docstrings and all non-trivial functions.\n\nWe\
    \ can access the docstring of the printMax function using the __doc__ (notice\
    \ the double underscores) attribute (name belonging to of function). Just remember\
    \ that Python treats everything as an object and this includes functions. We'll\
    \ learn more about objects in chapter on classes.\n\nIf you have used help() in\
    \ Python, then you have already seen the usage of docstrings! What it does is\
    \ fetch the __doc__ attribute of function and displays it in a neat manner for\
    \ you. You can try it out on the function above - just include help(printMax)\
    \ in"
  - '[PAGE 53]


