    $ using_tuple.py

    Number of animals in the new zoo is 3

    Number of cages in the new zoo is 3

    All animals in new zoo are (''monkey'', ''camel'', (''python'',

    ''elephant'', ''penguin''))

    Animals brought from old zoo are (''python'', ''elephant'', ''penguin'')

