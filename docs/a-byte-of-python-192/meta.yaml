    # Pickle


    Python provides a standard module called pickle which you can store any Python
    object in a file and get it back later. This is called storing the object persistently.


    Example:


    ```

    #!/usr/bin/python

    # Filename: pickling.py


    import pickle


    # name of the file where we will store the object

    shoplistfile = ''shoplist.data''

    # the list of things to buy

    shoplist = [''apple'', ''mango'', ''carrot'']


    # Write to the file

    f = open(shoplistfile, ''wb'')

    pickle.dump(shoplist, f) # dump the object to a file

    f.close()

    nde shoplist # destroy the shoplist variable


    # Read back from the storage

    ```'
