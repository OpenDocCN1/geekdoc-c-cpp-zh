    say('World', 5)\n\nOutput:\n\n```\n$ python func_default.py\nHello\nHelloWorldHelloWorld\n\
    ```\n\nHow It Works:\n\nThe function named say is used to print a string as many\
    \ times as specified. If we don't supply a value, then by default, the string\
    \ is printed just once. We achieve this by specifying a default argument value\
    \ of 1 to the parameter times.\n\nIn the first usage of say, we supply only the\
    \ string and it prints the string once. In the second usage of say, we supply\
    \ both the string and an argument 5 that we want to say the string message 5 times.\n\
    \n# Important\n\nOnly parameters that are at the end of the parameter list can\
    \ be given default argument values i.e. you cannot have a parameter with a default\
    \ argument value before a parameter without a default argument value in the order\
    \ of parameters declared in the function parameter list.\n\nThis is because the\
    \ values are assigned to the parameters by position. For example, def func(a,\
    \ b=5) is valid, but def func(a=5, b) is not valid.\n\n# Keyword Arguments\n\n\
    If you have functions with many parameters and you want to specify only some of\
    \ them, then you can give values for such parameters by naming them - this is\
    \ called keyword arguments - we use the name (keyword) instead of the position\
    \ (which we have been using all along) to specify the arguments to the function.\n\
    \nThere are two advantages - one, using the function is easier since we do not\
    \ need to worry about the order of the arguments. Two, can give values to only\
    \ those parameters we want, provided that the other parameters have default argument\
    \ values.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename: func_key.py\n```\n\
    \n```\ndef func(a, b=5, c=10):\n    print('a is', a, 'and b is', b, 'and c is',\
