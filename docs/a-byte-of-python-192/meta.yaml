  md: '# Python:Appendix FLOSS


    +   Its companion product Thunderbird is an excellent email client that makes
    reading email snap. Mozilla Firefox (http://www.mozilla.org/products/firefox),
    Mozilla Thunderbird (http://www.mozilla.org/products/thunderbird)


    +   Mono. This is an open source implementation of the Microsoft .NET platform.
