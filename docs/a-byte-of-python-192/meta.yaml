    \ Forms\n\nA lambda statement is used to create new function objects and then\
    \ return them at runtime.\n\n```\n#!/usr/bin/python\n# Filename: lambda.py\n\n\
    def make_repeater(n):\n    return lambda s: s * n\n\ntice = make_repeater(2)\n\
    \nprint(twice('word'))\nprint(twice(5))\n```\n\nOutput:\n\n```\n$ lambda.py\n\
    wordword\n10\n```\n\nHow It Works:\nHere, we use a function make_repeater to create\
    \ new function objects at runtime and return it. A lambda statement is used to\
    \ create the function object. Essentially, the lambda takes a parameter followed\
    \ by a single expression only which becomes the body of the function and the value\
    \ of this expression is returned by the new function. Note that even in a print\
    \ statement cannot be used inside a lambda form, only expressions.\n\nTODO\n\n\
