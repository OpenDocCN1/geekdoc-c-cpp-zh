    +   MySQL is an extremely popular source database server. It is most famous for
    its blazing speed. It is M in the famous LAMP stack which runs most of the websites
    on the internet. MySQL (http://www.mysql.com)


    +   VLC Player. This is a video player that can play anything from DivX to MP3
    to Ogg to VCDs and DVDs to who says open source isn''t fun?; [ VLC media player
    (http://www.videolan.org/vlc)


    +   GeekBox is a Linux distribution designed to play movies as soon as you up
