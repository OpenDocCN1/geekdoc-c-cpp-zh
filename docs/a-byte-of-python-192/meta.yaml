    # # Python 英文：翻译


    感谢许多无私的志愿者，这本书有多种不同语言的翻译版本。


    如果你想帮助这些翻译，请查看下方的志愿者和语言列表，并决定你想开始一个新的翻译还是帮助现有的翻译项目。

    如果你计划开始新的翻译，请阅读《翻译指南》。


    # ## 中文


    Juan Sean (orion-underscore-val-at-163-dot-com) 自愿将这本书翻译成中文。


    > 我是中华人民共和国北京理工大学无线电研究生学院的研究生。我目前的研究方向是多载波 系统的同步、信道估计和多用户检测。在 Python Numeric 的帮助下，Python
    是日常仿真和研究工作中主要的编程语言。实际上 Python 才学了半年，但正如你所看到的，它真的非常易理解、上手且高效。这正如 Swaroop 在书中所保证的那样。它现在是我最喜欢的编程语言。《Python
    教程》是我学习 Python 的教程。它并不很长，但高效地涵盖了 Python 中几乎所有重要内容。《Python 教程》强烈推荐作为新者的第一个 Python
    教程。将我的翻译献给中国数百万潜在的 Python 用户。


    # ## 繁体中文


    Fred Lin (gasolin-at-gmail-dot-com) 自愿将这本书翻译成繁体中文。


