    Name:\"Swaroop\" Age:\"25\" Marks: \"75\"\n```\n\n## How It Works\n\nTo inheritance,\
    \ we specify the base class names in a tuple following the class name in the class\
    \ definition. Next, we observe that the `__init__` method of the base class is\
