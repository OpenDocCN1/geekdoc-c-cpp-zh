  md: "# The return Statement\n\nThe return statement is used to return from a function\
    \ i.e. break out of the function. We can optionally return a value from the function\
    \ as well.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename: func_return.py\n\
    \ndef maximum(x, y):\n    if x > y:\n        return x\n    else:\n        return\
    \ y\n```\n\nOutput:\n\n```\n$ python func_return.py\n3\n```\n\nHow Works:\nThe\
    \ maximum function returns the maximum of the parameters, in this case the numbers\
    \ supplied to the function. It uses a simple if..else statement to find the greater\
    \ value and then returns that value.\n\nNote that a return statement without a\
    \ value is equivalent to return None. None is a special type in Python that represents\
    \ nothingness. For example, it is used to indicate that a variable has no value\
    \ if it has a value of None.\n\nEvery function implicitly contains a return None\
    \ statement at the end unless you have written your return statement. You can\
    \ see this by running print(someFunction()) where the someFunction does not use\
    \ the return statement such as:\n\n```\ndef someFunction():\n    pass\n```\n\n\
    The pass statement is used in Python to indicate an empty block of statements.\n\
    \nNote\n\nThere is a built-in function called max that already implements the\
    \ 'find maximum' functionality, so use this built-in function whenever possible."
