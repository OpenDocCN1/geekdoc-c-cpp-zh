    >>> a, b = b, a\n>>> a, b\n(8, 5)\n```\n\n## 特殊方法 (Special Methods)\n\n存在某些方法，例如\
    \ `__init__` 和 `__del__` 方法，它们在类中具有特殊意义。特殊方法用于模拟内置类型的行为。例如，如果你想在你的类上使用 `x[key]`\
    \ 索引操作（就像你对列表和元组使用的那样），你只需要实现 `__getitem__` 方法，工作就完成了。如果你仔细想想，这就是 Python 对 `list`\
