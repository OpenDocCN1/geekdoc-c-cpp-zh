    \ the subtypes do not affect other subtypes. Another advantage is that you can\
    \ refer to a teacher or student object as a SchoolMember object which could be\
    \ useful in such situations as counting the number of school members. This is\
    \ called polymorphism, where a subtype can be substituted in any situation where\
    \ a parent type is expected i.e. the object can be treated as an instance of the\
    \ parent class.\n\nAlso observe that we reuse the code of the class and do not\
    \ need to repeat it in the different classes as we would have had to in case we\
    \ had used independent classes.\n\nWe will see this example as a program.\n\n\
    ```python\n#!/usr/bin/python\n# Filename: inherit.py\n```\n"
