  md: '![](img/23fb3582e93ebc95909e1de029c3d388_444_0.png)


    **Figure 6** Eliminating Parallel Vectors


    You can now eliminate the parallel vectors and replace them with a single vector:


    ```

    ```cpp

    vector<Item> items;

    ```

    ```


    Each slot in the resulting vector corresponds to a slice in the set of parallel
    vectors (see Figure 6).


    # ## 9.8 Separate Compilation


    The code of complex programs is distributed over multiple files.


    When you write and compile small programs, you can place all your code into a
    single source file. When your programs get larger or you work in a team, that
    situation changes. You will want to split your code into separate source files.
    There are two reasons why this split becomes necessary. First, it takes time to
    compile a file, and it seems silly to wait for the compiler to keep translating
    code that doesn’t change. If your code is distributed over several source files,
    then only those files that you change need to be recompiled. The second reason
    becomes apparent when you work with other programmers in a team. It would be very
    difficult for multiple programmers to edit a single source file simultaneously.
    Therefore, the program code is broken up so that each programmer is solely responsible
    for a separate set of files.


    If your program is composed of multiple files, some of these files will define
    data types or functions that are needed in other files. There must be a path of
    communication between the files. In C++, that communication happens through the
    inclusion of header files.


    A header file contains


    +   - Definitions of classes.

    +   - Definitions of constants.

    +   - Declarations of nonmember functions.


    Header files contain the definitions of classes and declarations of nonmember
    functions.'
