- pgno: 223
  md: "# SELF CHECK\n\n+   1. Consider the function call pow(3, 2). What are the arguments\
    \ and return value?\n+   2. What is the return value of the function call pow(pow(2,\
    \ 2), 2)?\n+   3. The ceil function in the C++ standard library takes a single\
    \ argument x and returns the smallest integer ≥ x. What is the return value of\
    \ ceil(2.3)?\n+   4. It is possible to determine the answer to Self Check 3 without\
    \ knowing how the ceil function is implemented. Use an engineering term to describe\
    \ this aspect of the ceil function.\n\n**Practice It** Now you can try these exercises\
    \ at the end of the chapter: R5.1, P5.1.\n\n# ## 5.2 Implementing Functions\n\n\
    In this section, you will learn how to implement a function from a given specification.\
    \ We will use a very simple example: a function to compute the volume of a cube\
    \ with a given side length.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_223_0.png)\n\
    \nThe cube_volume function uses a given side length to compute the volume of a\
    \ cube.\n\nWhen writing this function, you need to\n\n+   - Pick a name for the\
    \ function (`cube_volume`).\n+   - Declare a variable for each argument (`double\
    \ side_length`). These variables are called parameter variables.\n+   - Specify\
    \ the type of the return value (`double`).\n\nWhen defining a function, you provide\
    \ a name for the function, a variable for each argument, and a type for the result.\n\
    \nPut all this information together to form the first line of the function's definition:\n\
    \n```\n    double cube_volume(double side_length)\n```\n\nNext, specify the body\
    \ of the function: the statements that are executed when the function is called.\n\
    \nThe volume of a cube of side length `s` is `s × s × s`. However, for greater\
    \ clarity, our parameter variable has been called `side_length`, not `s`, so we\
    \ need to compute `side_length * side_length * side_length`.\n\nWe will store\
    \ this value in a variable called `volume`:\n\n```\n    double volume = side_length\
    \ * side_length * side_length;\n```\n\nIn order to return the result of the function,\
    \ use the return statement:\n\n```\n    return volume;\n```\n\nThe body of a function\
    \ is enclosed in braces. Here is the complete function:\n\n```\n    double cube_volume(double\
    \ side_length)\n    {\n        double volume = side_length * side_length * side_length;\n\
    \        return volume;\n    }\n```"
