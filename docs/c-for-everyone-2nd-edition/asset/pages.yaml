- pgno: 117
  md: "# 3.3 Multiple Alternatives\n\nMultiple alternatives are required for decisions\
    \ that have more than two cases.\n\nIn Section 3.1, you saw how to program a two-way\
    \ branch with an if statement. In many situations, there are more than two cases.\
    \ In this section, you will see how to implement a decision with multiple alternatives.\
    \ For example, consider a program that displays the effect of an earthquake, as\
    \ measured by the Richter scale (see Table 3).\n\nThe 1989 Loma Prieta earthquake\
    \ that damaged the Bay Bridge in San Francisco and destroyed many buildings measured\
    \ 7.1 on the Richter scale.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_117_0.png)\n\
    \n**Table 3 Richter Scale**\n\n| Value | Effect |\n| --- | --- |\n| 8 | Most structures\
    \ fall |\n| 7 | Many buildings destroyed |\n| 6 | Many buildings considerably\
    \ damaged, some collapse |\n| 4.5 | Damage to poorly constructed buildings |\n\
    \nThe Richter scale is a measurement of the strength of an earthquake. Every step\
    \ in the scale, for example from 6.0 to 7.0, signifies a tenfold increase in the\
    \ strength of the quake.\n\nIn this case, there are five branches: one each for\
    \ the four descriptions of damage, and one for no destruction. Figure 3 shows\
    \ the flowchart for this multiple-branch statement.\n\nYou use multiple if statements\
    \ to implement multiple alternatives, like this:\n\n```\n    if (richter >= 8.0)\n\
    \    {\n       cout << \"Most structures fall\";\n    }\n    else if (richter\
    \ >= 7.0)\n    {\n       cout << \"Many buildings destroyed\";\n    }\n    else\
    \ if (richter >= 6.0)\n    {\n       cout << \"Many buildings considerably damaged,\
    \ some collapse\";\n    }\n    else if (richter >= 4.5)\n    {\n       cout <<\
    \ \"Damage to poorly constructed buildings\";\n    }\n    else\n    {\n      \
    \ cout << \"No destruction of buildings\";\n    }\n```\n\nAs soon as one of the\
    \ four tests succeeds, the effect is displayed, and no further tests are attempted.\
    \ If none of the four cases applies, the final else clause applies, and a default\
    \ message is printed. (See the ch03/richter.cpp file for the full program.)"
  merge: -1
  img_proc: true
