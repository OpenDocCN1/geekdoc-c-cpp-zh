  md: "```\nRepeat the following steps while the balance is less than ¥20,000\nAdd\
    \ 1 to the year value.\nCompute the interest as balance × 0.05 (i.e., 5 percent\
    \ interest)\nAdd the interest to the balance.\n```\n\n| year | interest | balance\
    \ |\n|---:|---:|---:|\n| 0 |  | 10000 |\n| 1 | 500.00 | 10500.00 |\n| … | … |\
    \ … |\n| 14 | 942.82 | 19799.32 |\n| 15 | 989.96 | 20789.28 |\n\n```\nReport the\
    \ final year value as the answer.\n```\n\nPseudocode is an informal description\
    \ of a sequence of steps for solving a problem.\n\nOf course, these steps are\
    \ not yet in a language that a computer can understand, but you will soon learn\
    \ how to formulate them in C++. This informal description is called **pseudocode**.\n\
    \nThere are no strict requirements for pseudocode because it is read by human\
    \ readers, not a computer program. Here are the kinds of pseudocode statements\
    \ that we will use in this book:\n\n+   - Use statements such as the following\
    \ to describe how a value is set or changed:\n+   \n+     `total cost = purchase\
    \ price + operating cost`\n+   \n+     or\n+   \n+     `Multiply the balance value\
    \ by 1.05.`\n+   \n+     or\n+   \n+     `Remove the first and last character\
    \ from the word.`\n+   - You can describe decisions and repetitions as follows:\n\
    +   \n+     `If total cost 1 < total cost 2`\n+   \n+     `While the balance is\
    \ less than ¥20,000`\n+   \n+     `For each picture in the sequence`\n+   \n+\
    \     Use indentation to indicate which statements should be selected or repeated:\n\
    +   \n+     `For each car`\n+   \n+     `    operating cost = 10 × annual fuel\
    \ cost`\n+   \n+     `    total cost = purchase price + operating cost`\n+   \n\
    +     Here, the indentation indicates that both statements should be executed\
    \ for each car.\n+   - Indicate results with statements such as:\n+   \n+    \
    \ `Choose car 1.`\n+   \n+     `Report the final year value as the answer.`\n\n\
    The exact wording is not important. What is important is that pseudocode describes\
    \ a sequence of steps that is\n\n+   - Unambiguous\n+   - Executable\n+   - Terminating"
