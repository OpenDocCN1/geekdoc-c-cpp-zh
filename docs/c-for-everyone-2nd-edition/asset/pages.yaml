  md: "# Programming Tip 5.1\n\n![](img/23fb3582e93ebc95909e1de029c3d388_226_0.png)\n\
    \n# Function Comments\n\nWhenever you write a function, you should *comment* its\
    \ behavior. Comments are for human readers, not compilers, and there is no universal\
    \ standard for the layout of a function comment. In this book, we will use the\
    \ following layout:\n\n```\n/**\n   Computes the volume of a cube.\n   @param\
    \ side_length the side length of the cube\n   @return the volume\n*/\ndouble cube_volume(double\
    \ side_length)\n{\n   double volume = side_length * side_length * side_length;\n\
    \   return volume;\n}\n```\n\nFunction comments explain the purpose of the function,\
    \ the meaning of the parameter variables and return value, as well as any special\
    \ requirements.\n\nThis particular documentation style is borrowed from the Java\
    \ programming language. It is widely supported by C++ tools as well, for example\
    \ by the Doxygen tool (www.doxygen.org).\n\nThe first line of the comment describes\
    \ the purpose of the function. Each @param clause describes a parameter variable\
    \ and the @return clause describes the return value.\n\nNote that the function\
    \ comment does not document the implementation (how the function does what it\
    \ does) but rather the design (what the function does, its inputs, and its results).\
    \ The comment allows other programmers to use the function as a \"black box\"\
    .\n\n# 5.3 Parameter Passing\n\nParameter variables hold the argument values supplied\
    \ in the function call.\n\nIn this section, we examine the mechanism of passing\
    \ arguments into functions. When a function is called, its *parameter variables*\
    \ are created. (Another commonly used term for a parameter variable is *formal\
    \ parameter*.) In the function call, an expression is supplied for each parameter\
    \ variable, called the *argument*. (Another commonly used term for this expression\
    \ is *actual parameter*.) Each parameter variable is initialized with the value\
    \ of the corresponding argument.\n\nConsider the function call illustrated in\
    \ Figure 3:\n\n```\ndouble result1 = cube_volume(2);\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_226_1.png)\n\
    \nA recipe for a fruit pie may say to use any kind of fruit. Here, \"fruit\" is\
    \ an example of a parameter variable. Apples and cherries are examples of arguments."
