  md: "# # 8.2 Reading Text Input\n\nIn the following sections, you will learn how\
    \ to process text with complex contents such as that which often occurs in real-life\
    \ situations.\n\n# ## 8.2.1 Reading Words\n\nWhen reading a string with the >>\
    \ operator, the white space between words is consumed.\n\nYou already know how\
    \ to read the next word from a stream, using the >> operator.\n\n```\n```cpp\n\
    string word;\nin_file >> word;\n```\n```\n\nHere is precisely what happens when\
    \ that operation is executed. First, any input characters that are white space\
    \ are removed from the stream, but they are not added to the word. White space\
    \ includes spaces, tab characters, and the newline characters that separate lines.\
    \ The first character that is not white space becomes the first character in the\
    \ string word. More characters are added until either another white space character\
    \ occurs, or the end of the file has been reached. The white space after the word\
    \ is not removed from the stream.\n\n# ## 8.2.2 Reading Characters\n\nYou can\
    \ get individual characters from a stream and unget the last one.\n\nInstead of\
    \ reading an entire word, you can read one character at a time by calling the\
    \ get function:\n\n```\n```cpp\nchar ch;\nin_file.get(ch);\n```\n```\n\nThe get\
    \ function returns the “not failed” condition. The following loop processes all\
    \ characters in a file:\n\n```\n```cpp\nwhile (in_file.get(ch))\n{\n   Process\
    \ the character ch.\n}\n```\n```\n\nThe get function reads white space characters.\
    \ This is useful if you need to process characters such as spaces, tabs, or newlines.\
    \ On the other hand, if you are not interested in white space, use the >> operator\
    \ instead.\n\n```\n```cpp\nin_file >> ch;  // ch is set to the next non-white\
    \ space character\n```\n```\n\nIf you read a character and you regretted it, you\
    \ can *unget* it, so that the next input operation can read it again. However,\
    \ you can unget only the last character. This is called *one-character lookahead*.\
    \ You get a chance to look at the next character in the input stream, and you\
    \ can make a decision whether you want to consume it or put it back.\n\nA typical\
    \ situation for lookahead is to look for numbers:\n\n```\n```cpp\nchar ch;\nin_file.get(ch);\n\
    if (!isdigit(ch))\n{\n   in_file.unget();  // Put the digit back so that it is\
    \ part of the number\n   int n;\n   data >> n;  // Read integer starting with\
    \ ch\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 386
  md: "> If you read a character from a stream and you don't like what you get, you\
    \ can unget it.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_386_0.png)\n\nThe\
    \ `isdigit` function is one of several useful functions that categorize characters—see\
    \ Table 1. All return true or false as to whether the argument passes the test.\
    \ You must include the `<cctype>` header to use these functions.\n\n# 8.2.3 Reading\
    \ Lines\n\nYou can read a line of input with the `getline` function and then process\
    \ it further.\n\nWhen each line of a file is a data record, it is often best to\
    \ read entire lines with the `getline` function:\n\n```\n```cpp\nstring line;\n\
    getline(in_file, line);\n```\n```\n\nThe next input line (without the newline\
    \ character) is placed into the string `line`. The `getline` function returns\
    \ the “not failed” condition. You can use the following loop to process each line\
    \ in a file:\n\n```\n```cpp\nwhile (getline(in_file, line))\n{\n    Process line.\n\
    }\n```\n```\n\nNote that `getline` is not a member function, but an ordinary function\
    \ that is not called with the dot notation.\n\n**Table 1  Character Functions\
    \ in `<cctype>`**\n\n| Function | Accepted Characters |\n|---|---|\n| `isdigit`\
    \ | 0 ... 9 |\n| `isalpha` | a ... z, A ... Z |\n| `islower` | a ... z |\n| `isupper`\
    \ | A ... Z |\n| `isalnum` | a ... z, A ... Z, 0 ... 9 |\n| `isspace` | White\
    \ space (space, tab, newline, and the rarely used carriage return, form feed,\
    \ and vertical tab) |"
  merge: -1
