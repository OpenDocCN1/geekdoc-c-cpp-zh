- pgno: 71
  md: '```

    int s3;

    cin >> s1 >> s2 >> s3;

    double average = (s1 + s2 + s3) / 3; // Error

    cout << "Your average score is " << average << endl;

    ```


    What could be wrong with that? Of course, the average of s1, s2, and s3 is


    \(\frac{s1+s2+s3}{3}\)


    Here, however, the / does not mean division in the mathematical sense. It denotes
    integer division because both s1 + s2 + s3 and 3 are integers. For example, if
    the scores add up to 14, the average is computed to be 4, the result of the integer
    division of 14 by 3. That integer 4 is then moved into the floating-point variable
    average. The remedy is to make the numerator or denominator into a floating-point
    number:


    ```

    double total = s1 + s2 + s3;

    double average = total / 3;

    ```


    or


    ```

    double average = (s1 + s2 + s3) / 3.0;

    ```


    # Unbalanced Parentheses


    Consider the expression


    `(-(b * b - 4 * a * c) / (2 * a)`


    What is wrong with it? Count the parentheses. There are three ( and two ). The
    parentheses are *unbalanced*. This kind of typing error is very common with complicated
    expressions. Now consider this expression.


    `-(b * b - (4 * a * c))) / (2 * a`


    This expression has three ( and three ), but it still is not correct. In the middle
    of the expression,


    `-(b * b - (4 * a * c))) / (2 * a`


    there are only two ( but three ), which is an error. In the middle of an expression,
    the count of ( must be greater than or equal to the count of ), and at the end
    of the expression the two counts must be the same.


    Here is a simple trick to make the counting easier without using pencil and paper.
    It is difficult for the brain to keep two counts simultaneously. Keep only one
    count when scanning the expression. Start with 1 at the first opening parenthesis,
    add 1 whenever you see an opening parenthesis, and subtract one whenever you see
    a closing parenthesis. Say the numbers aloud as you scan the expression. If the
    count ever drops below zero, or is not zero at the end, the parentheses are unbalanced.
    For example, when scanning the previous expression, you would mutter


    `-(b * b - (4 * a * c))) / (2 * a`

    ` 1       2             1 0 -1`


    and you would find the error.


