    \n# *Random Fact 3.2* Artificial Intelligence\n\nWhen one uses a sophisticated\
    \ computer program to solve a tax preparation package, one is bound to attribute\
    \ some intelligence to the computer. The computer asks sensible questions and\
    \ makes computations that we find a mental challenge. After all, if doing one's\
    \ taxes were easy, we wouldn't need a computer to do it for us.\n\nAs programmers,\
    \ however, we know that all this apparent intelligence is an illusion. Human programmers\
    \ have carefully “coached” the software in all possible scenarios, and it simply\
    \ replays the actions and decisions that were programmed into it.\n\nWould it\
    \ be possible to write computer programs that are genuinely intelligent in some\
    \ sense? From the earliest days of computing, there was a sense that the human\
    \ brain might be nothing but an immense computer, and that it might well be feasible\
    \ to program computers to imitate some processes of human thought. Seri-\n\nous\
    \ research into artificial intelligence began in the mid-1950s, and the first\
    \ twenty years brought some impressive successes. Programs that play chess—surely\
    \ an activity that appears to require remarkable intellectual powers—have become\
    \ so good that they now routinely beat all but the best human players. As far\
    \ back as 1975, an expert-system program called Mycin gained fame for being better\
    \ in diagnosing meningitis in patients than the average physician.\n\nHowever,\
    \ there were serious setbacks as well. From 1982 to 1992, the Japanese government\
    \ embarked on a massive research project, funded over 40 billion Japanese yen.\
    \ It was known as the Fifth-Generation Project. Its goal was to develop new hardware\
    \ and software to greatly improve the performance of expert system software. At\
    \ its outset, the project created fear in other countries that the Japanese computer\
    \ industry was about to become the undisputed leader in the\n\nfield. However,\
    \ the end results were disappointing and did little to bring artificial intelligence\
    \ applications to market.\n\nFrom the very outset, one of the stated goals of\
    \ the AI community was to produce software that could translate text from one\
    \ language to another, for example from English to Russian. That undertaking proved\
    \ to be enormously complicated. Human language appears to be much more subtle\
    \ and interwoven with the human experience than had originally been thought. Even\
    \ the grammar-checking tools that come with word-processing programs today are\
    \ more of a gimmick than a useful tool, and analyzing grammar is just the first\
    \ step in translating sentences.\n\nThe CYC (from encyclopedia) project, started\
    \ by Douglas Lenat in 1984, tries to codify the implicit assumptions that underlie\
    \ human speech and writing. The team members started out analyzing news articles\
    \ and asked themselves what unmentioned facts"
