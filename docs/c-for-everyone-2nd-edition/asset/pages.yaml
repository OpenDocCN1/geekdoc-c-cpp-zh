  md: "Make a constant\n\n```\nconst int DAYS_PER_YEAR = 365;\n```\n\nso that you\
    \ can easily produce a Martian version without trying to find all the 365's, 364's,\
    \ 366's, 367's, and so on in your code.\n\n# Classes\n\nLay out the items of a\
    \ class as follows:\n\n```\nclass ClassName\n{\npublic:\n    constructors\n  \
    \  mutators\n    accessors\nprivate:\n    data\n};\n```\n\nAll data fields of\
    \ classes must be private.\n\n# Control Flow\n\n# The for Statement\n\nUse for\
    \ loops only when a variable runs from somewhere to somewhere else with some constant\
    \ increment/decrement.\n\n```\nfor (i = 0; i < a.size(); i++)\n{\n    cout <<\
    \ a[i] << endl;\n}\n```\n\nDo not use the for loop for weird constructs such as\n\
    \n```\nfor (xnew = a / 2; count < ITERATIONS; cout << xnew) // Don't\n{\n    xold\
    \ = xnew;\n    xnew = xold + a / xold;\n    count++;\n}\n```\n\nMake such a loop\
    \ into a while loop, so the sequence of instructions is much clearer.\n\n```\n\
    xnew = a / 2;\nwhile (count < ITERATIONS) // OK\n{\n    xold = xnew;\n    xnew\
    \ = xold + a / xold;\n    count++;\n    cout << xnew;\n}\n```"
