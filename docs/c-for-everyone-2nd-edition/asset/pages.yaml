  md: "In our example, the purpose is to manipulate copy counters. Therefore, our\
    \ data are integers and the pointers have type `int*`. We know that we will have\
    \ exactly 100 pointers, one for each user. Therefore, we can choose an array\n\
    \n```\n    int* users[100];\n```\n\n# ### Step 3: Initialize the pointers with\
    \ variable addresses or heap memory.\n\nWill you allocate variables and then take\
    \ their addresses with the `&` operator? That is fine if you have a fixed amount\
    \ of data that you want to reach through the pointers. Otherwise, use the `new`\
    \ operator to allocate memory dynamically. Be sure to deallocate the memory when\
    \ you are done, using the `delete` or `delete[]` operator.\n\nIn our example,\
    \ there is no need for dynamic allocation, so we will just take addresses of variables.\n\
    \n```\n    int master_account;\n    int project_accounts[10];\n    for (int i\
    \ = 0; i < 100; i++)\n    {\n        users[i] = &master_account;\n    }\n    //\
    \ Here we reassign several users to project accounts.\n    // The following code\
    \ is a simulation of the actions that would\n    // occur in an administration\
    \ interface, which we do not implement.\n    users[2] = project_accounts + 1;\n\
    \    users[3] = project_accounts + 2;\n    users[99] = project_accounts + 2;\n\
    ```\n\n# ### Step 4: Use the `*` or `[]` operator to access your data.\n\nWhen\
    \ you access a single variable through a pointer, use the `*` operator to read\
    \ or write the variable. For example,\n\n```\n    *account_pointer = *account_pointer\
    \ + 20;\n```\n\nWhen you have a pointer to an array, use the `[]` notation. Simply\
    \ think of the pointer as the array:\n\n```\n    account_array[1] = account_array[1]\
    \ + 20;\n```\n\nIf you have an array or vector of pointers, then you need brackets\
    \ to get at an individual pointer. Then supply another `*` or `[]` to get at the\
    \ value. You saw an example in the Galton board simulator where a count was accessed\
    \ as\n\n```\n    counts[i][j]\n```\n\nImplement your algorithm, keeping these\
    \ access rules in mind.\n\nIn our example, we read the user ID and number of copies.\
    \ Then we increment the copy account:\n\n```\n    cin >> id >> copies;\n    *users[id]\
    \ = *users[id] + copies;\n```\n\nExercise P7.12 asks you to complete this simulation.\n\
