  md: "# ### Random Fact 7.1 Embedded Systems\n\n![](img/23fb3582e93ebc95909e1de029c3d388_363_0.png)\n\
    \nAn embedded system is a computer system that controls a device. The device contains\
    \ a processor and other hardware and is controlled by a computer program. Unlike\
    \ a personal computer, which has been designed to be flexible and run many different\
    \ computer programs, the hardware and software of an embedded system are tailored\
    \ to a specific device. Computer controlled devices are becoming increasingly\
    \ common, ranging from washing machines to medical equipment, cell phones, automobile\
    \ engines, and spacecraft.\n\nSeveral challenges are specific to programming embedded\
    \ systems. Most importantly, a much higher standard of quality control applies.\
    \ Vendors are often unconcerned about bugs in personal computer software, because\
    \ they can always make you install a patch or upgrade to the next version. But\
    \ in an embedded system, that is not an option. Few consumers would feel comfortable\
    \ upgrading the software in their washing machines or automobile engines. If you\
    \ ever handed in a programming assignment that you believed to be correct, only\
    \ to have the instructor or grader find bugs in it, then you know how hard it\
    \ is to write software that can reliably do its task for many years without a\
    \ chance of changing it. Quality standards are especially important in devices\
    \ whose failure would destroy property or endanger human life. Many personal computer\
    \ purchasers buy computers that are fast and have a lot of storage, because the\
    \ investment is paid back over time when many programs are run on the same equipment.\
    \ But the hardware for an embedded device is not shared—it is dedicated to one\
    \ device. A separate processor, memory, and so on, are built for every copy of\
    \ the device. If it is possible to shave a few pennies off the manufacturing cost\
    \ of every unit, the savings can add up quickly for devices that are produced\
    \ in large volumes. Thus, the programmer of an embedded-system has a much larger\
    \ economic incentive to conserve resources than the desktop software programmer.\
    \ Unfortunately, trying to conserve resources usually makes it harder to write\
    \ programs that work correctly.\n\nC and C++ are commonly used languages for developing\
    \ embedded systems.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_363_1.png)\n\n\
    *The Controller of an Embedded System*\n\n# # 7.7 Structures and Pointers (Optional)\n\
    \n# ## 7.7.1 Structures\n\nIn C++, you use a **structure** to aggregate items\
    \ of arbitrary types into a single value. For example, a street address is composed\
    \ of a house number and a street name. A structure named `StreetAddress` can be\
    \ defined to combine these two values into a single entity. In C++, we define\
    \ a structure with the `struct` reserved word:\n\nA **structure** combines member\
    \ values into a single value.\n\n```\n```cpp\nstruct StreetAddress\n{\n   int\
    \ house_number;\n   string street_name;\n};\n```\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_363_2.png)\n\
    \nThis definition yields a new type, `StreetAddress`, that you can use for declaring\
    \ variables:\n\nYou use the *dot notation* to access members of a structure.\n\
    \n```\n```cpp\nStreetAddress white_house;\n```\n```\n\nThe variable `white_house`\
    \ has two named parts, called *members*, `house_number` and `street_name`. You\
    \ use the “dot notation” to access each member, like this:\n\n```\n```cpp\nwhite_house.house_number\
    \ = 1600;\nwhite_house.street_name = \"Pennsylvania Avenue\";\n```\n```"
