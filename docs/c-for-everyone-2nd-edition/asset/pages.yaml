  md: '![](img/23fb3582e93ebc95909e1de029c3d388_88_0.png)


    # ### Random Fact 2.2 International Alphabets and Unicode


    The English alphabet is pretty simple: upper- and lowercase a to z. Other European
    languages have accent marks and special characters. For example, German has three
    so-called umlaut characters, ä, ö, ü, and a double-s character ß. These are not
    optional frills; you couldn''t write a page of German text without using these
    characters a few times. German keyboards have keys for these characters.


    ![](img/23fb3582e93ebc95909e1de029c3d388_88_1.png)


    *The German Keyboard Layout*


    This poses a problem for computer users and designers. The American standard character
    encoding (called ASCII, for American Standard Code for Information Interchange)
    specifies 128 codes: 52 upper- and lowercase characters, 10 digits, 32 typographical
    symbols, and 34 control characters (such as space, newline, and 32 others for
    controlling printers and other devices). The umlaut and double-s are not among
    them. Some German data processing systems replace seldom-used ASCII characters
    with German letters: [\]{|}~ are replaced with ÄÖÜäöüß. While most people can
    live without these characters, C++ programmers definitely cannot. Other encoding
    schemes take advantage of the fact that one byte can encode 256 different characters,
    of which only 128 are standardized by ASCII. Unfortunately, there are multiple
    incompatible standards for such encodings, resulting in a certain amount of aggravation
    among European computer users.


    Many countries don''t use the Roman script at all. Russian, Greek, Hebrew, Arabic,
    and Thai letters, to name just a few, have completely different shapes. To complicate
    matters, Hebrew and Arabic are typed from right to left. Each of these alphabets
    has between 30 and 100 letters, and the countries using them have established
    encoding standards for them.


    ![](img/23fb3582e93ebc95909e1de029c3d388_88_2.png)


    *Hebrew, Arabic, and English*


    The situation is much more dramatic in languages that use the Chinese script:
    the Chinese dialects, Japanese, and Korean. The Chinese script is not alphabetic
    but ideographic. A character represents an idea or thing. Most words are made
    up of one, two, or three of these ideographic characters. (Over 50,000 ideograms
    are known, of which about 20,000 are in active use.) Therefore, two bytes are
    needed to encode them. China, Taiwan, Japan, and Korea have incompatible encoding
    standards for them. (Japanese and Korean writing uses a mixture of native syllabic
    and Chinese ideographic characters.)


    The inconsistencies among character encodings have been a major nuisance for international
    electronic communication and for software manufacturers vying for a global market.
    Starting in 1988, a consortium of hardware and software manufacturers developed
    a uniform 21-bit encoding scheme called Unicode that is capable of encoding text
    in essentially all written languages of the world. About 100,000 characters have
    been given codes, including more than 70,000 Chinese, Japanese, and Korean ideographs.
    There are even plans to add codes for extinct languages, such as Egyptian hieroglyphs.


    ![](img/23fb3582e93ebc95909e1de029c3d388_88_3.png)


    *The Chinese Script*'
