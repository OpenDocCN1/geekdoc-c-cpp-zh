  md: "# # Source Files\n\nEach program is a collection of one or more files or modules.\
    \ The executable program is obtained by compiling and linking these files. Organize\
    \ the material in each file as follows:\n\n+   - Header comments\n+   - #include\
    \ statements\n+   - Constants\n+   - Classes\n+   - Functions\n\nIt is common\
    \ to start each file with a comment block. Here is a typical format:\n\n```\n\
    ```\n/*\n  @file invoice.cpp\n  @author Jenny Koo\n  @date 2012-01-24\n  @version\
    \ 3.14\n*/\n```\n```\n\nYou may also want to include a copyright notice, such\
    \ as\n\n```\n```\n/* Copyright 2012 Jenny Koo */\n```\n```\n\nA valid copyright\
    \ notice consists of\n\n+   - the copyright symbol © or the word “Copyright” or\
    \ the abbreviation “Copr.”\n+   - the year of first publication of the work\n\
    +   - the name of the owner of the copyright\n\n(Note: To save space, this header\
    \ comment has been omitted from the programs in this book as well as the programs\
    \ on disk so that the actual line numbers match those that are printed in the\
    \ book.)\n\nNext, list all included header files.\n\n```\n```\n#include <iostream>\n\
    #include \"question.h\"\n```\n```\n\nDo not embed absolute path names, such as\n\
    \n```\n```\n#include \"c:\\me\\my_homework\\widgets.h\" // Don't !!!\n```\n```\n\
    \nAfter the header files, list constants that are needed throughout the program\
    \ file.\n\n```\n```\nconst int GRID_SIZE = 20;\nconst double CLOCK_RADIUS = 5;\n\
    ```\n```\n\nThen supply the definitions of all classes.\n\n```\n```\nclass Product\n\
    {\n  ...\n};\n```\n```\n\nOrder the class definitions so that a class is defined\
    \ before it is used in another class.\n\nFinally, list all functions, including\
    \ member functions of classes and nonmember functions. Order the nonmember functions\
    \ so that a function is defined before it is called. As a consequence, the main\
    \ function will be the last function in your file."
