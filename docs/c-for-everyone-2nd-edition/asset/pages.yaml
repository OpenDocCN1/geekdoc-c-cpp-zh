  md: '# Syntax 6.1 — Defining an Array


    ![](img/23fb3582e93ebc95909e1de029c3d388_278_0.png)


    Here we define an array that can hold ten values:


    ```

    double values[10];

    ```


    This is the definition of a variable values whose type is “array of double”. That
    is, values stores a sequence of floating-point numbers. The [10] indicates the
    size of the array. (See Figure 1.) The array size must be a constant that is known
    at compile time.


    When you define an array, you can specify the initial values. For example,


    ```

    double values[] = { 32, 54, 67.5, 29, 34.5, 80, 115, 44.5, 100, 65 };

    ```


    When you supply initial values, you don’t need to specify the array size. The
    compiler determines the size by counting the values.


    > Use an array to collect a sequence of values of the same type.


    **Table 1 — Defining Arrays**


    | Declaration | Description |

    |---|---|

    | `int numbers[10];` | An array of ten integers. |

    | `const int SIZE = 10;`<br>`int numbers[SIZE];` | It is a good idea to use a
    named constant for the size. |

    | `int size = 10;`<br>`int numbers[size];` | **Caution:** In standard C++, the
    size must be a constant. This array definition will not work with all compilers.
    |

    | `int squares[5] = { 0, 1, 4, 9, 16 };` | An array of five integers, with initial
    values. |

    | `int squares[] = { 0, 1, 4, 9, 16 };` | You can omit the array size if you supply
    initial values. The size is set to the number of initial values. |

    | `int squares[5] = { 0, 1, 4 };` | If you supply fewer initial values than the
    size, the remaining values are set to 0. This array contains 0, 1, 4, 0, 0. |

    | `string names[3];` | An array of three strings. |'
