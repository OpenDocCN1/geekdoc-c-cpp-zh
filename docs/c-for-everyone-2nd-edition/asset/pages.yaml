  md: '# 9.9 Pointers to Objects


    The following sections discuss how to work with pointers to objects. As you will
    see in the next chapter, pointers to objects are important when you work with
    multiple objects from related classes.


    # 9.9.1 Dynamically Allocating Objects


    Use the new operator to obtain an object that is located on the heap.


    It is common to allocate objects on the heap. As discussed in Section 7.4, you
    use the new operator to obtain memory from the heap. For example, the call


    ```

    new CashRegister

    ```


    returns a pointer to a CashRegister object. You can also supply construction arguments:


    ```

    new BankAccount(1000)

    ```


    You usually want to store the pointer that the new operator returns:


    ```

    CashRegister* register_pointer = new CashRegister;

    BankAccount* account_pointer = new BankAccount(1000);

    ```


    Note that each of these definitions allocates two entities: a pointer variable
    and an object on the heap—see Figure 8.


    When you no longer need a heap object, be sure to delete it:


    ```

    delete account_pointer;

    ```


    The new operator returns a pointer to the allocated object.


    When a heap object is no longer needed, use the delete operator to reclaim its
    memory.


    # 9.9.2 The -> Operator


    Because register_pointer is a pointer to a CashRegister object, the value *register_pointer
    denotes the CashRegister object itself. To invoke a member function on that object,
    you might call


    ```

    (*register_pointer).add_item(1.95);

    ```


    ![](img/23fb3582e93ebc95909e1de029c3d388_449_0.png)


    **Figure 8** Pointers and the Objects to Which They Point'
