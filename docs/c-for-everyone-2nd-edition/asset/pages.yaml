  md: '# Syntax 2.1 Variable Definition


    ![](img/23fb3582e93ebc95909e1de029c3d388_58_0.png)


    > When defining a variable, you usually specify an initial value.


    > When defining a variable, you also specify the type of its values.


    When defining a variable, you usually want to **initialize** it. That is, you
    specify the value that should be stored in the variable. Consider again this variable
    definition:


    ```

    int cans_per_pack = 6;

    ```


    The variable `cans_per_pack` is initialized with the value 6.


    Like a parking space that is restricted to a certain type of vehicle (such as
    a compact car, motorcycle, or electric vehicle), a variable in C++ stores data
    of a specific **type**. C++ supports quite a few data types: numbers, text strings,
    files, dates, and many others. You must specify the type whenever you define a
    variable (see Syntax 2.1).


    The `cans_per_pack` variable is an integer, a whole number without a fractional
    part. In C++, this type is called `int`. (See the next section for more information
    about number types in C++.)


    Note that the type comes before the variable name:


    ```

    int cans_per_pack = 6;

    ```


    Table 1 shows variations of variable definitions.


    ![](img/23fb3582e93ebc95909e1de029c3d388_58_1.png)


    Each parking space is suitable for a particular type of vehicle, just as each
