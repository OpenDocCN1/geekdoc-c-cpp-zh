- pgno: 483
  md: "# 10.4.1 The Slicing Problem\n\nIn this section, we will discuss a problem\
    \ that commonly arises when you work with a collection of objects that belong\
    \ to different classes in a class hierarchy.\n\nIf you look into the main function\
    \ of quiz2/test.cpp, you will find that there was some repetitive code to display\
    \ each question and check the responses. It would be nicer if all questions were\
    \ collected in an array and one could use a loop to present them to the user:\n\
    \n```\nconst int QUIZZES = 2;\nQuestion quiz[QUIZZES];\nquiz[0].set_text(\"Who\
    \ was the inventor of C++?\");\nquiz[0].set_answer(\"Bjarne Stroustrup\");\nChoiceQuestion\
    \ cq;\ncq.set_text(\"In which country was the inventor of C++ born?\");\ncq.add_choice(\"\
    Australia\", false);\n...\nquiz[1] = cq;\n\nfor (int i = 0; i < QUIZZES; i++)\n\
    {\n    quiz[i].display();\n    cout << \"Your answer: \";\n    getline(cin, response);\n\
    \    cout << quiz[i].check_answer(response) << endl;\n}\n```\n\nThe array quiz\
    \ holds objects of type `Question`. The compiler realizes that a `ChoiceQuestion`\
    \ is a special case of a `Question`. Thus it permits the assignment from a choice\
    \ question to a question:\n\n```\nquiz[1] = cq;\n```\n\nHowever, a `ChoiceQuestion`\
    \ object has three data members, whereas a `Question` object has just two. There\
    \ is no room to store the derived-class data. That data simply gets *sliced away*\
    \ when you assign a derived-class object to a base-class variable (see Figure\
    \ 5).\n\nIf you run the resulting program, the options are not displayed:\n\n\
    ```\nWho was the inventor of C++?\nYour answer: Bjarne Stroustrup\ntrue\nIn which\
    \ country was the inventor of C++ born?\nYour answer:\n```\n\nThis problem is\
    \ very typical of code that needs to manipulate objects from a mixture of classes\
    \ in an inheritance hierarchy. Derived-class objects are usually bigger than base-class\
    \ objects, and objects of different derived classes have different sizes. An array\
    \ of objects cannot deal with this variation in sizes.\n\nWhen converting a derived-class\
    \ object to a base class, the derived-class data is sliced away.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_483_0.png)\n\
    \n**Figure 5**  Slicing Away Derived-Class Data"
