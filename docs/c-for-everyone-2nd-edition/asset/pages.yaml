    \ option)`\n+   - `int get_input() const`\n\nWhat about displaying the menu? There\
    \ is no sense in displaying the menu without also asking the user for input. However,\
    \ get_input may need to display the menu more than once if the user provides a\
    \ bad input. Thus, display is a good candidate for a private member function.\n\
    \nTo complete the public interface, you need to specify the constructors. Ask\
    \ yourself what information you need in order to construct an object of your class.\
    \ Sometimes you will want two constructors: one that sets all data members to\
    \ a default and one that sets them to user-supplied values.\n\nIn the case of\
    \ the menu example, we can get by with a single constructor that creates an empty\
    \ menu.\n\nHere is the public interface:\n\n```\n```cpp\nclass Menu\n{\npublic:\n\
    \   Menu();\n   void add_option(string option);\n   int get_input() const;\nprivate:\n\
    \   ...\n};\n```\n```\n\n# **Step 3** Document the public interface.\n\nSupply\
    \ a documentation comment for the class, then comment each member function.\n\n\
    ```\n```cpp\n/**\n   A menu that is displayed on a console.\n*/\nclass Menu\n\
    {\npublic:\n   /**\n      Constructs a menu with no options.\n   */\n   Menu();\n\
    \n   /**\n      Adds an option to the end of this menu.\n      @param option the\
    \ option to add\n   */\n   void add_option(string option);\n\n   /**\n      Displays\
    \ the menu, with options numbered starting with 1,\n      and prompts the user\
    \ for input. Repeats until a valid input\n      is supplied.\n      @return the\
    \ number that the user supplied\n   */\n   int get_input() const;\n};\n```\n```"
