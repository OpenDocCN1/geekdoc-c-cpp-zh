    # **Engineering P3.33**


    ![](img/23fb3582e93ebc95909e1de029c3d388_152_0.png)


    Crop damage due to frost is one of the many risks confronting farmers. The figure
    below shows a simple alarm circuit designed to warn of frost. The alarm circuit
    uses a device called a thermistor to sound a buzzer when the temperature drops
    below freezing. Thermistors are semiconductor devices that exhibit a temperature
    dependent resistance described by the equation


    \[R=R_0e^{\beta\left(\frac{1}{T}-\frac{1}{T_0}\right)}\]


    where \(R\) is the resistance, in Ω, at the temperature \(T\), in °K, and \(R_0\)
    is the resistance, in Ω, at the reference \(T_0\), in °K. β is a constant that
    depends on the material used to make the thermistor.


    ![](img/23fb3582e93ebc95909e1de029c3d388_152_1.png)


    The circuit is designed so that the alarm will sound when


    \[\frac{R_2}{R+R_2}<\frac{R_4}{R_3+R_4}\]


    The thermistor used in the alarm circuit has \(R_0=33{,}192\ \Omega\) at \(T_0=40^\circ\text{C}\),
    and \(\beta=3{,}310\ ^\circ\text{K}\). (Recall that β has units of °K. Recall
    that temperature in °K is obtained by adding 273° to the temperature in °C.) The
    resistors \(R_2\), \(R_3\), and \(R_4\) have a resistance of 156.3 kΩ = 156,300
    Ω.


    Write a C++ program that prompts the user for a temperature in °F and prints a
    message indicating whether or not the alarm will sound at that temperature.


