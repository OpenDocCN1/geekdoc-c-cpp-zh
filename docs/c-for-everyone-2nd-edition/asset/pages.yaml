- pgno: 338
  md: '| Expression | Value | Comment |

    |---|---|---|

    | Assume the following declarations: `int m = 10;` // Assumed to be at address
    20300<br>`int n = 20;` // Assumed to be at address 20304<br>`int* p = &m;` | |
    |

    | `p` | 20300 | The address of m. |

    | `*p` | 10 | The value stored at that address. |

    | `&n` | 20304 | The address of n. |

    | `p = &n;` | | Set p to the address of n. |

    | `*p` | 20 | The value stored at the changed address. |

    | `m = *p;` | | Stores 20 into m. |

    | `m = p;` | Error | m is an int value; p is an int* pointer. The types are not
    compatible. |

    | `&10` | Error | You can only take the address of a variable. |

    | `&p` | The address of p, perhaps 20308 | This is the location of a pointer variable,
    not the location of an integer. |

    | `double x = 0;`<br>`p = &x;` | Error | p has type int*, &x has type double*.
    These types are incompatible. |


    # 7.1.3 Initializing Pointers


    With pointers, it is particularly important that you pay attention to proper initialization.


    When you initialize a pointer, be sure that the pointer and the memory address
    have the same type. For example, the following initialization would be an error:


    ```

    int balance = 1000;

    double* account_pointer = &balance; // Error!

    ```


    The address &balance is a pointer to an int value, that is, an expression of type
    int*. It is never legal to initialize a double* pointer with an int*.


    If you define a pointer variable without providing an initial variable, the pointer
    contains a random address. Using that random address is an error. In practice,
    your program will likely crash or mysteriously misbehave if you use an uninitialized
    pointer:


    It is an error to use an uninitialized pointer.


    ```

    double* account_pointer;

    // Forgot to initialize

    *account_pointer = 1000;

    // NO! account_pointer contains an unpredictable value

    ```'
