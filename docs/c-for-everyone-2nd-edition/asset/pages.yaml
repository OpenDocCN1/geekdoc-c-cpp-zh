- pgno: 505
  md: 'Two simple resonant circuits are shown in the figure below. The circuit in
    (a) is called a *parallel resonant circuit*. The circuit in (b) is called a *series
    resonant circuit*. Both resonant circuits consist of a resistor having resistance
    \(R\), a capacitor having capacitance \(C\), and an inductor having inductance
    \(L\).


    ![](img/23fb3582e93ebc95909e1de029c3d388_505_0.png)


    These circuits are designed by determining values of \(R\), \(C\), and \(L\) that
    cause the resonant frequency response to be described by specified values of \(\omega_0\),
    \(B\), and \(k\). The design equations for the parallel resonant circuit are:


    \[R = k, \qquad C = \frac{1}{BR}, \qquad L = \frac{1}{\omega_0^2 C}\]


    Similarly, the design equations for the series resonant circuit are:


    \[R = \frac{1}{k}, \qquad L = \frac{R}{B}, \qquad C = \frac{1}{\omega_0^2 L}\]


    Write a C++ program that represents ResonantCircuit as a base class and represents
    the SeriesResonantCircuit and ParallelResonantCircuit as derived classes. Give
    the base class three private data members representing the parameters \(\omega_0\),
    \(B\), and \(k\) of the resonant frequency response. The base class should provide
    public member functions to get and set each of these members. The base class should
    also provide a display function that prints a description of the resonant frequency
    response.


    Each derived class should provide a function that designs the corresponding resonant
    circuit. The derived classes should also override the display function of the
    base class to print descriptions of both the frequency response (the values of
    \(\omega_0\), \(B\), and \(k\)) and the circuit (the values of \(R\), \(C\), and
    \(L\)).


    All classes should provide appropriate constructors.


    Write a main function for the C++ program that demonstrates that the derived classes
    all work properly.'
