- pgno: 231
  md: "Here is an alternate organization of the cube.cpp file:\n\n```\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\n// Declaration of cube_volume\ndouble\
    \ cube_volume(double side_length);\n\nint main()\n{\n    double result1 = cube_volume(2);\
    \  // Use of cube_volume\n    double result2 = cube_volume(10);\n    cout << \"\
    A cube with side length 2 has volume \" << result1 << endl;\n    cout << \"A cube\
    \ with side length 10 has volume \" << result2 << endl;\n    return 0;\n}\n\n\
    // Definition of cube_volume\ndouble cube_volume(double side_length)\n{\n    return\
    \ side_length * side_length * side_length;\n}\n```\n```\n\nIf you prefer this\
    \ approach, go ahead and use it in your programs. You just need to be aware of\
    \ one drawback. Whenever you change the name of a function or one of the parameter\
    \ types, you need to fix it in both places: in the declaration and in the definition.\n\
    \n# ### HOW TO 5.1 — Implementing a Function\n\n![](img/23fb3582e93ebc95909e1de029c3d388_231_0.png)\n\
    \nA function is a computation that can be used multiple times with different parameters,\
    \ either in the same program or in different programs. Whenever a computation\
    \ is needed more than once, turn it into a function.\n\nTo illustrate this process,\
    \ suppose that you are helping archaeologists who research Egyptian pyramids.\
    \ You have taken on the task of writing a function that determines the volume\
    \ of a pyramid, given its height and base length.\n\n+   - **Step 1** Describe\
    \ what the function should do.\n+     Provide a simple English description, such\
    \ as “Compute the volume of a pyramid whose base is a square.”\n\n+   - **Step\
    \ 2** Determine the function’s “inputs”.\n+     Make a list of *all* the parameters\
    \ that can vary. It is common for beginners to implement functions that are overly\
    \ specific. For example, you may know that the great pyramid of Giza, the largest\
    \ of the Egyptian pyramids, has a height of 146 meters and a base length of 230\
    \ meters. You should *not* use these numbers in your calculation, even if the\
    \ original problem only asked about the great pyramid. It is just as easy—and\
    \ far more useful—to write a function that computes the volume of *any* pyramid.\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_231_1.png)"
