- pgno: 510
  md: '# Functions


    Supply a comment of the following form for every function.


    ```

    /*\n * Explanation.\n * @param parameter variable1  explanation\n * @param parameter
    variable2  explanation\n * ...\n * @return explanation\n */

    ```


    The introductory explanation is required for all functions except `main`. It should
    start with an uppercase letter and end with a period. Some documentation tools
    extract the first sentence of the explanation into a summary table. Thus, if you
    provide an explanation that consists of multiple sentences, formulate the explanation
    such that the first sentence is a concise explanation of the function’s purpose.


    Omit the `@param` comment if the function has no parameter variables. Omit the
    `@return` comment for void functions. Here is a typical example:


    ```

    /*\n * Converts calendar date into Julian day. This algorithm is from Press\n
    * et al., Numerical Recipes in C, 2nd ed., Cambridge University Press, 1992.\n
    * @param year  the year of the date to be converted\n * @param month  the month
    of the date to be converted\n * @param day  the day of the date to be converted\n
    * @return the Julian day number that begins at noon of the given\n * calendar
    date\n */\nlong dat2jul(int year, int month, int day)\n{\n    ...\n}

    ```


    Parameter variable names must be explicit, especially if they are integers or
    Boolean.


    ```

    Employee remove(int d, double s); // Huh?\nEmployee remove(int department, double
    severance_pay); // OK

    ```


    Of course, for very generic functions, short names may be very appropriate.


    Do not write void functions that return exactly one answer through a reference.
    Instead, make the result into a return value.


    ```

    void find(vector<Employee> c, bool& found); // Don’t!\nbool find(vector<Employee>
    c); // OK

    ```


    Of course, if the function computes more than one value, some or all results can
    be returned through reference parameters.


    Functions must have at most 30 lines of code. (Comments, blank lines, and lines
    containing only braces are not included in this count.) Functions that consist
    of one long if/else/else statement sequence may be longer, provided each branch
    is 10 lines or less. This rule forces you to break up complex computations into
    separate functions.'
  merge: -1
  img_proc: true
