- pgno: 450
  md: "The parentheses are necessary because in C++ the dot operator takes precedence\
    \ over the `*` operator. The expression without the parentheses would be a compile-time\
    \ error:\n\n```\n```cpp\n*register_pointer.add_item(1.95); // Error—you can't\
    \ apply . to a pointer\n```\n```\n\nBecause the dot operator has higher precedence\
    \ than `*`, the period would be applied to a pointer, not an object.\n\n> Use\
    \ the `->` operator to invoke a member function through a pointer.\n\nBecause\
    \ calling a member function through a pointer is very common, there is an operator\
    \ to abbreviate the “follow pointer and call member function” operation. That\
    \ operator is written `->` and usually pronounced as “arrow”. Here is how you\
    \ use the “arrow” operator:\n\n```\n```cpp\nregister_pointer->add_item(1.95);\n\
    ```\n```\n\nThis calls the `CashRegister` member function, setting the implicit\
    \ parameter to `*register_pointer` and the explicit parameter to `1.95`.\n\n#\
    \ 9.9.3 The this Pointer\n\n> In a member function, `this` pointer points to the\
    \ implicit parameter.\n\nEach member function has a special parameter variable,\
    \ called `this`, which is a pointer to the implicit parameter. For example, consider\
    \ the `CashRegister::add_item` function. If you call\n\n```\n```cpp\nregister1.add_item(1.95)\n\
    ```\n```\n\nthen the `this` pointer has type `CashRegister*` and points to the\
    \ `register1` object.\n\nYou can use the `this` pointer inside the definition\
    \ of a member function. For example, you can implement the `add_item` function\
    \ as\n\n```\n```cpp\nvoid CashRegister::add_item(double price)\n{\n    this->item_count++;\n\
    \    this->total_price = this->total_price + price;\n}\n```\n```\n\nHere, the\
    \ expression `this->item_count` refers to the `item_count` data member of the\
    \ implicit parameter (which is `register1.item_count` in our example). Some programmers\
    \ like to use the `this` pointer in this fashion to make it clear that `item_count`\
    \ is a data member and not a variable.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_450_0.png)\n\
    \n+   39. Write a statement that dynamically allocates a string object and saves\
    \ the address in a pointer variable `str_pointer`.\n+   40. Write a statement\
    \ that deallocates the object that was allocated in Self Check 39.\n+   41. Write\
    \ a statement that dynamically allocates a string object with contents \"Hello\"\
    \ and saves the address in a pointer variable `str_pointer`.\n+   42. Write a\
    \ statement that invokes the `length` member function on the object that was allocated\
    \ in Self Check 41 and prints the result.\n+   43. What is the type of `this`\
    \ when the `string::length` member function is called?\n\n# Practice It\n\nNow\
    \ you can try these exercises at the end of the chapter: R9.30, P9.21, P9.22."
