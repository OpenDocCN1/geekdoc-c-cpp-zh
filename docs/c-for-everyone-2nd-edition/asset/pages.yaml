  md: '**Table 6 Boolean Operators**


    | Expression | Value | Comment |

    |---|---|---|

    | 0 < 200 && 200 < 100 | false | Only the first condition is true. Note that the
    < operator has a higher precedence than the && operator. |

    | 0 < 200 \|\| 200 < 100 | true | The first condition is true. |

    | 0 < 200 \|\| 100 < 200 | true | The \|\| is not a test for “either-or”. If both
    conditions are true, the result is true. |

    | ⛔ 0 < 200 < 100 | true | **Error:** The expression 0 < 200 is true, which is
    converted to 1. The expression 1 < 100 is true. You never want to write such an
