- pgno: 513
  md: "# Nonlinear Control Flow\n\nDon't use the switch statement. Use if/else instead.\n\
    \nDo not use the break, continue, or goto statement. Use a bool variable to control\
    \ the execution flow.\n\n# Lexical Issues\n\n# Naming Conventions\n\nThe following\
    \ rules specify when to use upper- and lowercase letters in identifier names.\n\
    \n+   1. All variable and function names and all data fields of classes are in\
    \ lowercase, sometimes with an underscore in the middle. For example, `first_player`.\n\
    +   2. All constants are in uppercase, with an occasional underscore. For example,\
    \ `CLOCK_RADIUS`.\n+   3. All class names start with uppercase and are followed\
    \ by lowercase letters, with an occasional uppercase letter in the middle. For\
    \ example, `BankTeller`.\n\nNames must be reasonably long and descriptive. Use\
    \ `first_player` instead of `fp`. No dropping fvwls. Local variables that are\
    \ fairly routine can be short (`ch`, `i`) as long as they are really just boring\
    \ holders for an input character, a loop counter, and so on. Also, do not use\
    \ `ctr`, `c`, `cnt`, `cnt2`, `c2` for five counter variables in your function.\
    \ Surely each of these variables has a specific purpose and can be named to remind\
    \ the reader of it (for example, `ccurrent`, `cnext`, `cprevious`, `cnew`, `cresult`).\n\
    \n# Indentation and White Space\n\nUse tab stops every three columns. Save your\
    \ file so that it contains no tabs at all. That means you will need to change\
    \ the tab stop setting in your editor! In the editor, make sure to select “3 spaces\
    \ per tab stop” and “save all tabs as spaces”. Every programming editor has these\
    \ settings. If yours doesn’t, don’t use tabs at all but type the correct number\
    \ of spaces to achieve indentation.\n\nUse blank lines freely to separate logically\
    \ distinct parts of a function.\n\nUse a blank space around every binary operator:\n\
    \n```\n```\nx1 = (-b - sqrt(b * b - 4 * a * c)) / (2 * a); // Good\nx1=(-b-sqrt(b*b-4*a*c))/(2*a);\
    \ // Bad\n```\n```\n\nLeave a blank space after (and not before) each comma, semicolon,\
    \ and reserved word, but not after a function name.\n\n```\n```\nif (x == 0) ...\n\
    f(a, b[i]);\n```\n```\n\nEvery line must fit in 80 columns. If you must break\
    \ a statement, add an indentation level for the continuation:\n\n```\n```\na[n]\
    \ = ....................................................;\n    + ....................;\n\
    ```\n```"
