- pgno: 68
  md: 'The % operator computes the remainder of an integer division.


    If you are interested in the remainder only, use the % operator:


    ```

    7 % 4

    ```


    is 3, the remainder of the integer division of 7 by 4. The % symbol has no analog
    in algebra. It was chosen because it looks similar to /, and the remainder operation
    is related to division. The operator is called *modulus*. (Some people call it
    *modulo* or *mod*.) It has no relationship with the percent operation that you
    find on some calculators.


    Here is a typical use for the integer / and % operations. Suppose you have an
    amount of pennies in a piggybank:


    ```

    int pennies = 1729;

    ```


    You want to determine the value in dollars and cents. You obtain the dollars through
    an integer division by 100.


    ```

    int dollars = pennies / 100;  // Sets dollars to 17

    ```


    The integer division discards the remainder. To obtain the remainder, use the
    % operator:


    ```

    int cents = pennies % 100;  // Sets cents to 29

    ```


    Another common use of the % operator is to check whether a number is even or odd.
    If a number n is even, then n % 2 is zero.


    ![](img/23fb3582e93ebc95909e1de029c3d388_68_0.png)


    # 2.2.4 Converting Floating-Point Numbers to Integers


    Assigning a floating-point variable to an integer drops the fractional part.


    When a floating-point value is assigned to an integer variable, the fractional
    part is discarded:


    ```

    double price = 2.55;

    int dollars = price;  // Sets dollars to 2

    ```


    Discarding the fractional part is not always what you want. Often, you want to
    round to the nearest integer. To round a positive floating-point value to the
    nearest integer, add 0.5 and then convert to an integer:


    ```

    int dollars = price + 0.5;  // Rounds to the nearest integer

    ```


    In our example, adding 0.5 turns all values above 2.5 into values above 3. In
    particular, 2.55 is turned into 3.05, which is then truncated to 3. (For a negative
    floating-point value, you subtract 0.5.)


    Because truncation is a potential cause for errors, your compiler may issue a
    warning that assigning a floating-point value to an integer variable is unsafe.
    See Special Topic 2.3 on page 46 on how to avoid this warning.


    # 2.2.5 Powers and Roots


    In C++, there are no symbols for powers and roots. To compute them, you must call
    *functions*. To take the square root of a number, you use the sqrt function. For
    example, √x is written as sqrt(x). To compute xⁿ, you write pow(x, n).'
