  md: "It is not legal to define two variables with the same name in the same scope.\
    \ For example, the following is *not* legal:\n\n```\nint main()\n{\n    double\
    \ volume = cube_volume(2);\n    double volume = cube_volume(10);\n    // ERROR:\
    \ cannot define another volume variable in this scope\n    ...\n}\n```\n\nHowever,\
    \ you can define another variable with the same name in a **nested block**. Here,\
    \ we define two variables called amount.\n\n```\ndouble withdraw(double balance,\
    \ double amount)\n{\n    if (...)\n    {\n        double amount = 10; // Another\
    \ variable named amount\n        ...\n    }\n    ...\n}\n```\n\nA variable in\
    \ a nested block shadows a variable with the same name in an outer block.\n\n\
    The scope of the parameter variable amount is the entire function, except inside\
    \ the nested block. Inside the nested block, amount refers to the variable that\
    \ was defined in that block. We say that the inner variable shadows the variable\
    \ that is defined in the outer block. You should avoid this potentially confusing\
    \ situation in the functions that you write, simply by renaming one of the variables.\n\
    \nVariables that are defined inside functions are called **local variables**.\
    \ C++ also supports **global variables**: variables that are defined outside functions.\
    \ A global variable is visible to all functions that are defined after it. For\
    \ example, the `<iostream>` header defines global variables `cin` and `cout`.\n\
    \nHere is an example of a global variable:\n\nA local variable is defined inside\
    \ a function. A global variable is defined outside a function.\n\n```\nint balance\
    \ = 10000; // A global variable\n\nvoid withdraw(double amount)\n{\n    if (balance\
    \ >= amount)\n    {\n        balance = balance - amount;\n    }\n}\n\nint main()\n\
    {\n    withdraw(1000);\n    cout << balance << endl;\n    return 0;\n}\n```\n\n\
    The scope of the variable balance extends over both the withdraw and the main\
    \ functions.\n\nGenerally, global variables are not a good idea. When multiple\
    \ functions update global variables, the result can be difficult to predict. Particularly\
    \ in larger programs that are developed by multiple programmers, it is very important\
    \ that the effect of each function be clear and easy to understand. You should\
    \ avoid global variables in your programs.\n\nAvoid global variables in your programs."
