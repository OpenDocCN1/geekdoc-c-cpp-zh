  md: "# 2.3.2 Formatted Output\n\nWhen you print the result of a computation, you\
    \ often want some control over its appearance. For example, when you print an\
    \ amount in dollars and cents, you usually want it to be rounded to two significant\
    \ digits. That is, you want the output to look like\n\n```\nPrice per ounce: 0.04\n\
    ```\n\ninstead of\n\n```\nPrice per ounce: 0.0409722\n```\n\nThe following command\
    \ instructs cout to use two digits after the decimal point for all floating-point\
    \ numbers:\n\n```\ncout << fixed << setprecision(2);\n```\n\nThis command does\
    \ not produce any output; it just manipulates cout so that it will change the\
    \ output format. The values fixed and setprecision are called *manipulators*.\
    \ We will discuss manipulators in detail in Chapter 8. For now, just remember\
    \ to include the statement given above whenever you want currency values displayed\
    \ neatly.\n\nTo use manipulators, you must include the `<iomanip>` header in your\
    \ program:\n\n```\n#include <iomanip>\n```\n\nYou can combine the manipulators\
    \ and the values to be displayed into a single statement.\n\n```\ncout << fixed\
    \ << setprecision(2)\n     << \"Price per ounce: \"\n     << price_per_ounce <<\
    \ endl;\n```\n\nThere is another manipulator that is sometimes handy. When you\
    \ display several rows of data, you usually want the columns to line up.\n\nYou\
    \ use the setw manipulator to set the width of the next output field. The width\
    \ is the total number of characters used for showing the value, including digits,\
    \ the decimal point, and spaces. Controlling the width is important when you want\
    \ columns of numbers to line up.\n\nFor example, if you want a number to be printed\
    \ in a column that is eight characters wide, you use\n\n```\ncout << setw(8) <<\
    \ price_per_ounce;\n```\n\nYou use manipulators to specify how values should be\
    \ formatted.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_76_0.png)\n\nYou use\
    \ manipulators to line up your output in neat columns."
