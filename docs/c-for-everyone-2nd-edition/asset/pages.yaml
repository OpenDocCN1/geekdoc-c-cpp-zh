  md: "The hour and minute displays in a digital clock are an example of nested loops.\
    \ The hours loop 12 times, and for each hour, the minutes loop 60 times.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_193_0.png)\n\
    \nThere are 10 rows in the outer loop. For each x, the program prints four columns\
    \ in the inner loop. Thus, a total of 10 × 4 = 40 values are printed. Following\
    \ is the complete program. Note that we also use loops to print the table header.\
    \ However, those loops are not nested.\n\n# ch04/powtable.cpp\n\n```\n```cpp\n\
    #include <iostream>\n#include <iomanip>\n#include <cmath>\n\nusing namespace std;\n\
    \nint main()\n{\n    const int NMAX = 4;\n    const double XMAX = 10;\n\n    //\
    \ Print table header\n\n    for (int n = 1; n <= NMAX; n++)\n    {\n        cout\
    \ << setw(10) << n;\n    }\n    cout << endl;\n    for (int n = 1; n <= NMAX;\
    \ n++)\n    {\n        cout << setw(10) << \"x\";\n    }\n    cout << endl <<\
    \ endl;\n\n    // Print table body\n\n    for (double x = 1; x <= XMAX; x++)\n\
    \    {\n        // Print table row\n\n        for (int n = 1; n <= NMAX; n++)\n\
    \        {\n            cout << setw(10) << pow(x, n);\n        }\n        cout\
    \ << endl;\n    }\n\n    return 0;\n}\n```"
