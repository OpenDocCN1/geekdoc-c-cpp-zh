  md: '![](img/23fb3582e93ebc95909e1de029c3d388_469_0.png)


    Objects from related classes usually share common behavior. For example, shovels,
    rakes, and clippers all perform gardening tasks. In this chapter, you will learn
    how the notion of inheritance expresses the relationship between specialized and
    general classes. By using inheritance, you will be able to share code between
    classes and provide services that can be used by multiple classes.


    # # 10.1 Inheritance Hierarchies


    In object-oriented design, inheritance is a relationship between a more general
    class (called the base class) and a more specialized class (called the derived
    class). The derived class inherits data and behavior from the base class. For
    example, consider the relationships between different kinds of vehicles depicted
    in Figure 1.


    A derived class inherits data and behavior from a base class.


    Cars share the common traits of all vehicles, such as the ability to transport
    people from one place to another. We say that the class `Car` inherits from the
    class `Vehicle`. In this relationship, the `Vehicle` class is the base class and
    the `Car` class is the derived class.


    You can always use a derived-class object in place of a base-class object.


    Informally, the inheritance relationship is called the *is-a* relationship. Contrast
    this relationship with the *has-a* relationship that we discussed in Section 9.7.
    Every *car* is a *vehicle*. Every `vehicle` has an `engine`.


    The inheritance relationship is very powerful because it allows us to reuse algorithms
    with objects of different classes. Suppose we have an algorithm that manipulates
    a `Vehicle` object. Because a car is a special kind of vehicle, we can supply
    a `Car` object to such an algorithm, and it will work correctly. This is an example
    of the **substitution principle** that states that you can always use a derived-class
    object when a base-class object is expected.


    ![](img/23fb3582e93ebc95909e1de029c3d388_469_1.png)


    **Figure 1** An Inheritance Hierarchy of Vehicle Classes'
  merge: -1
  img_proc: true
- pgno: 470
  md: '![](img/23fb3582e93ebc95909e1de029c3d388_470_0.png)


    **Figure 2** The Inheritance Hierarchy of Stream Classes


    The inheritance relationship can give rise to hierarchies where classes get ever
    more specialized, as shown in Figure 1. The C++ stream classes, shown in Figure
    2, are another example of such a hierarchy. Figure 2 uses the UML notation for
    inheritance where the base and derived class are joined with an arrow that points
    to the base class.


    As you can see, an `ifstream` (an input stream that reads from a file) is a special
    case of an `istream` (an input stream that reads data from any source). If you
    have an `ifstream`, it can be the argument for a function that expects an `istream`.


    ```

    void process_input(istream& in)  // Can call with an ifstream object

    ```


    Why provide a function that processes `istream` objects instead of `ifstream`
    objects? That function is more useful because it can handle any kind of input
    stream (such as an `istringstream`, which is convenient for testing). This again
    is the substitution principle at work.


    In this chapter, we will consider a simple hierarchy of classes. Most likely,
    you have taken computer-graded quizzes. A quiz consists of questions, and there
    are different kinds of questions:


    +   - Fill-in-the-blank

    +   - Choice (single or multiple)

    +   - Numeric (where an approximate answer is ok; e.g., 1.33 when the actual answer
    is 4/3)

    +   - Free response


    ![](img/23fb3582e93ebc95909e1de029c3d388_470_1.png)


    We will develop a simple but flexible quiz-taking program to illustrate inheritance.


    Figure 3 shows an inheritance hierarchy for these question types.'
