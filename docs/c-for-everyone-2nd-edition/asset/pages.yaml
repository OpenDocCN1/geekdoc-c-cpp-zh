  md: "# ## 5.4 Return Values\n\n> > The return statement terminates a function call\
    \ and yields the function result.\n\nYou use the `return` statement to specify\
    \ the result of a function. When the `return` statement is processed, the function\
    \ exits *immediately*. This behavior is convenient for handling exceptional cases\
    \ at the beginning:\n\n```\n```cpp\ndouble cube_volume(double side_length)\n{\n\
    \    if (side_length < 0) { return 0; }\n    double volume = side_length * side_length\
    \ * side_length;\n    return volume;\n}\n```\n```\n\nIf the function is called\
    \ with a negative value for `side_length`, then the function returns 0 and the\
    \ remainder of the function is not executed. (See Figure 4.)\n\nIn the preceding\
    \ example, each `return` statement returned a constant or a variable. Actually,\
    \ the `return` statement can return the value of any expression. Instead of saving\
    \ the return value in a variable and returning the variable, it is often possible\
    \ to eliminate the variable and return a more complex expression:\n\n```\n```cpp\n\
    double cube_volume(double side_length)\n{\n    return side_length * side_length\
    \ * side_length;\n}\n```\n```\n\nIt is important that every branch of a function\
    \ return a value. Consider the following incorrect function:\n\n```\n```cpp\n\
    double cube_volume(double side_length)\n{\n    if (side_length >= 0)\n    {\n\
    \        return side_length * side_length * side_length;\n    } // Error\n}\n\
    ```\n```\n\nSuppose you call `cube_volume` with a negative value for the side\
    \ length. Of course, you aren't supposed to call that, but it might happen as\
    \ the result of a coding error. Because if the condition is not true, the `return`\
    \ statement is not executed. However, the function must return *something*. Depending\
    \ on the circumstances, the compiler might\n\n![](img/23fb3582e93ebc95909e1de029c3d388_229_0.png)\n\
    \n**Figure 4** A return Statement Exits a Function Immediately"
