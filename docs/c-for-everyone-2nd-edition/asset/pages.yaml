- pgno: 10
  md: "> > Memorable photos reinforce analogies and help students remember the concepts.\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_10_0.png)\n\n> > Problem Solving sections\
    \ teach techniques for generating ideas and evaluating proposed solutions, often\
    \ using pencil and paper or other artifacts. These sections emphasize that most\
    \ of the planning and problem solving that makes students successful happens away\
    \ from the computer.\n\n# ### 6.5 Problem Solving: Discovering Algorithms by Manipulating\
    \ Physical Objects 277\n\nNow how does that help us with our problem, switching\
    \ the first and the second half of the array?\n\nLet’s put the first six coins\
    \ into place by swapping the fifth and sixth coins. However, as C++ programmers,\
    \ we will not use the swap; the coins in positions 2 and 4.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_10_1.png)\n\
    \n> > **How To** guides give step-by-step guidance for common programming tasks,\
    \ emphasizing planning and testing. They answer the beginner’s question, “Now\
    \ what do I do?” and integrate key concepts into a problem-solving sequence.\n\
    \n# ### HOW TO 1.1 Describing an Algorithm with Pseudocode\n\nBefore you can create\
    \ a program in C++, you need to develop an algorithm—a method for arriving at\
    \ a solution. You may be able to think of the algorithm in pseudocode, which is\
    \ a language made up of English words rather than a computer programming language.\
    \ The algorithm in the following example is used to compute the cost of a purchase.\
    \ You can then translate the pseudocode into C++.\n\n+   **Step 1** Determine\
    \ the inputs and outputs.\n+   \n+   In our sample problem, we have three inputs:\n\
    +   \n+   - purchase price and 1st discount, the price and fuel efficiency of\
    \ the first car;\n+   - purchase price and 2nd discount, the price and fuel efficiency\
    \ of the second car.\n\n> > **Worked Examples** apply the steps in the How To\
    \ to a different example, showing how they can be used to plan, implement, and\
    \ test a solution to another programming problem.\n\n# ### WORKED EXAMPLE 1.1\
    \ Writing an Algorithm for Tiling a Floor\n\nThe Wardlaw family wants to develop\
    \ an algorithm for laying tile in an alternating pattern of colors.\n\n**Table\
    \ 3 Variable Names in C++**\n\n| Variable Name | Comment |\n|---|---|\n| can_wheel\
    \ | Variable names can consist of letters, numbers, and the underscore character.\
    \ |\n| x | In mathematics, x is a one-character variable name such as x or y.\
    \ This is legal, but it is not a good idea to use one-character variable names\
    \ because it is harder to understand. (See Programming Tip 2.1 on page 38.) |\n\
    | Can_wheel | Caution: Variable names are case-sensitive. |\n| 2x | Error: Variable\
    \ names cannot start with a number. |\n| can wheel | Error: Variable names cannot\
    \ contain spaces. |\n| double | Error: You cannot use a reserved word as a variable\
    \ name. |\n| if/else | Error: You cannot use symbols such as / or +. |\n\n> >\
    \ **Example tables** support beginners with multiple, concrete examples. These\
    \ tables point out common errors and present another quick reference to the section’s\
    \ topic."
  merge: -1
