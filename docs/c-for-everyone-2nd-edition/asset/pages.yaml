  md: "```\n```cpp\ncout << i + 1 << \": \" << choices[i] << endl;\n}\n}\n```\n```\n\
    \n+   13. Look again at the implementation of the `add_choice` function that calls\
    \ the `set_answer` function of the base class. Why don’t you need to call `Question::set_answer`?\n\
    +   \n+   14. In the Manager class of Self Check 9, override the `get_name` function\
    \ so that managers have a `*` before their name (such as *Lin, Sally).\n+   \n\
    +   15. In the Manager class of Self Check 9, override the `get_salary` function\
    \ so that it returns the sum of the salary and the bonus.\n\n**Practice It** \
    \ Now you can try these exercises at the end of the chapter: R10.12, P10.1.\n\n\
    ![](img/23fb3582e93ebc95909e1de029c3d388_482_0.png)\n\n# Forgetting the Base-Class\
    \ Name\n\nA common error in extending the functionality of a base-class function\
    \ is to forget the base-class name. For example, to compute the salary of a manager,\
    \ get the salary of the underlying `Employee` object and add a bonus:\n\n```\n\
    ```cpp\ndouble Manager::get_salary() const\n{\n    double base_salary = get_salary();\n\
    \        // Error—should be Employee::get_salary()\n    return base_salary + bonus;\n\
    }\n```\n```\n\nHere `get_salary()` refers to the `get_salary` function applied\
    \ to the implicit parameter of the member function. The implicit parameter is\
    \ of type Manager, and there is a `Manager::get_salary` function, so that function\
    \ is called. Of course, that is a recursive call to the function that we are writing.\
    \ Instead, you must specify which `get_salary` function you want to call. In this\
    \ case, you need to call `Employee::get_salary` explicitly.\n\nWhenever you call\
    \ a base-class function from a derived-class function with the same name, be sure\
    \ to give the full name of the function, including the base-class name.\n\n# 10.4\
    \ Virtual Functions and Polymorphism\n\nIn the preceding sections you saw one\
    \ important use of inheritance: to form a more specialized class from a base class.\
    \ In the following sections you will see an even more powerful application of\
    \ inheritance: to work with objects whose type and behavior can vary at run time.\
    \ This variation of behavior is achieved with virtual functions. When you invoke\
    \ a virtual function on an object, the C++ run-time system determines which actual\
    \ member function to call, depending on the class to which the object belongs.\n\
    \nIn the following sections, you will see why you need to use pointers to access\
    \ objects whose class can vary at run-time, and how a virtual function selects\
    \ the member function that is appropriate for a given object."
