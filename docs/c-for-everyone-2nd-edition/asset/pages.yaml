  md: '# GLOSSARY


    **Accessor function**  A function that accesses an object but does not change
    it.


    **Address**  A value that specifies the location of a variable in memory.


    **Aggregation relationship**  The “has-a” relationship between classes.


    **Algorithm**  An unambiguous, executable, and terminating specification to solve
    a problem.


    **ANSI/ISO C++ Standard**  The standard for the C++ language that was developed
    by the American National Standards Institute and the International Standards Organization.


    **Argument**  A parameter value in a function call, or one of the values combined
    by an operator.


    **Array**  A collection of values of the same type, each of which can be accessed
    by an integer index.


    **Arrow operator**  The -> operator. p->m is the same as (*p).m.


    **ASCII code**  The American Standard Code for Information Interchange, which
    associates code values between 0 and 127 to letters, digits, punctuation marks,
    and control characters.


    **Assignment**  Placing a new value into a variable.


    **Base class**  A class from which another class is derived.


    **Binary file**  A file in which values are stored in their binary representation
    and cannot be read as text.


    **Binary search**  A fast algorithm for finding a value in a sorted array. It
    narrows the search down to half of the array in every step.


    **Bit**  Binary digit; the smallest unit of information, having two possible values,
    0 and 1. A data element consisting of n bits has 2ⁿ possible values.


    **Black Box**  A device with a given specification but unknown implementation.


    **Block**  A group of statements bracketed by {}.


    **Boolean operator**  See **Logical operator**.


    **Boolean type**  A type with two values, true and false.


    **Boundary test case**  A test case involving values that are at the outer boundary
    of the set of legal values. For example, if a function is expected to work for
    all nonnegative integers, then 0 is a boundary test case.


    **Bounds error**  Trying to access an array element that is outside the legal
    range.'
  merge: -1
  img_proc: true
