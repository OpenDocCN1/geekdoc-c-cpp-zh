  md: "We need to fix our plan of attack:\n\n+   Find the minimum value.  \n+   Find\
    \ its position.  \n+   Remove that position from the array.  \n+   Calculate the\
    \ sum.\n\nWill it work? Let’s continue with our example.\n\nWe found a minimum\
    \ value of 4. Linear search tells us that the value 4 occurs at position 5.\n\n\
    | [0] | [1] | [2] | [3] | [4] | [5] | [6] |\n|---|---|---|---|---|---|---|\n|\
    \ 8 | 7 | 8.5 | 9.5 | 7 | **4** | 10 |\n\nWe remove it:\n\n| [0] | [1] | [2] |\
    \ [3] | [4] | [5] |\n|---|---|---|---|---|---|\n| 8 | 7 | 8.5 | 9.5 | 7 | 10 |\n\
    \nFinally, we compute the sum: 8 + 7 + 8.5 + 9.5 + 7 + 10 = 50.\n\nThis walkthrough\
    \ demonstrates that our strategy works.\n\nCan we do better? It seems a bit inefficient\
    \ to find the minimum and then make another pass through the array to obtain its\
    \ position.\n\nWe can adapt the algorithm for finding the minimum to yield the\
    \ position of the minimum. Here is the original algorithm:\n\n```\ndouble smallest\
    \ = values[0];\nfor (int i = 1; i < size of values; i++)\n{\n    if (values[i]\
    \ < smallest)\n    {\n        smallest = values[i];\n    }\n}\n```\n\nWhen we\
    \ find the smallest value, we also want to update the position:\n\n```\nif (values[i]\
    \ < smallest)\n{\n    smallest = values[i];\n    smallest_position = i;\n}\n```\n\
    \nIn fact, then there is no reason to keep track of the smallest value any longer.\
    \ It is simply values[smallest_position]. With this insight, we can adapt the\
    \ algorithm as follows:\n\n```\nint smallest_position = 0;\nfor (int i = 1; i\
    \ < size of values; i++)\n{\n    if (values[i] < values[smallest_position])\n\
    \    {\n        smallest_position = i;\n    }\n}\n```\n\nWith this adaptation,\
    \ our problem is solved with the following strategy:\n\n+   Find the position\
    \ of the minimum.  \n+   Remove it from the array.  \n+   Calculate the sum.\n\
    \nIn How To 6.1 on page 271, we develop a C++ program from this strategy.\n\n\
    You should be familiar with the implementation of fundamental algorithms so that\
    \ you can adapt them."
