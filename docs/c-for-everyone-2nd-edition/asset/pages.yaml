  md: "A bounds error, which occurs if you supply an invalid array index, can corrupt\
    \ data or cause your program to terminate.\n\nThe most common bounds error is\
    \ the following:\n\n```\n    double values[10];\n    cout << values[10];\n```\n\
    \nThere is no `values[10]` in an array with ten elements—the legal index values\
    \ range from 0 to 9.\n\nTo visit all elements of an array, use a variable for\
    \ the index. Suppose `values` has ten elements and the integer variable `i` takes\
    \ values 0, 1, 2, and so on, up to 9. Then the expression `values[i]` yields each\
    \ element in turn. For example, this loop displays all elements.\n\n```\n    for\
    \ (int i = 0; i < 10; i++)\n    {\n       cout << values[i] << endl;\n    }\n\
    ```\n\nNote that in the loop condition the index is *less than* 10 because there\
    \ is no element corresponding to `values[10]`.\n\n# ## 6.1.3 Partially Filled\
    \ Arrays\n\n![](img/23fb3582e93ebc95909e1de029c3d388_280_0.png)\n\n*With a partially\
    \ filled array, you need to remember how many elements are filled.*\n\nAn array\
    \ cannot change size at run time. This is a problem when you don't know in advance\
    \ how many elements you need. In that situation, you must come up with a good\
    \ guess on the maximum number of elements that you need to store. We call this\
    \ quantity the *capacity*. For example, we may decide that we sometimes want to\
    \ store more than ten values, but never more than 100:\n\n```\n    const int CAPACITY\
    \ = 100;\n    double values[CAPACITY];\n```\n\nIn a typical program run, only\
    \ part of the array will be occupied by actual elements. We call such an array\
    \ a *partially filled array*. You must keep a companion variable that counts how\
    \ many elements are actually used. In Figure 3 we call the companion variable\
    \ `current_size`.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_280_1.png)\n\n**Figure\
    \ 3**\n*A Partially Filled Array*\n\nWith a partially filled array, keep a companion\
    \ variable for the current size.\n\nThe following loop collects values and fills\
    \ up the `values` array.\n\n```\n    int current_size = 0;\n    double input;\n\
    \    while (cin >> input)\n    {\n       if (current_size < CAPACITY)\n      \
    \ {\n          values[current_size] = input;\n          current_size++;\n    \
    \   }\n    }\n```"
