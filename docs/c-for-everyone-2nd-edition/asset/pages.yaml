  md: "**Practice It** Now you can try these exercises at the end of the chapter:\
    \ R4.10, P4.6, P4.7.\n\n# ### Special Topic 4.1\n\n# ## Clearing the Failure State\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_180_0.png)\n\nWhen an input operation\
    \ has failed, all further input operations also fail. If you want to read two\
    \ number sequences and use a letter as a sentinel, you need to clear the failure\
    \ state after reading the first sentinel. Call the `clear` function:\n\n```\n\
    ~~~cpp\ncout << \"Enter values, Q to quit.\\n\";\nwhile (cin >> values)\n{\n \
    \  Process input.\n}\ncin.clear();\n~~~\n```\n\nSuppose the user has entered 30\
    \ 10 5 Q. The input of Q has caused the failure. Because only successfully processed\
    \ characters are removed from the input, the Q character is still present. Read\
    \ it into a dummy variable:\n\n```\n~~~cpp\nstring sentinel;\ncin >> sentinel;\n\
    ~~~\n```\n\nNow you can go on and read more inputs.\n\n# ### Special Topic 4.2\n\
    \n# ## The Loop-and-a-Half Problem and the break Statement\n\n![](img/23fb3582e93ebc95909e1de029c3d388_180_1.png)\n\
    \nSome programmers dislike loops that are controlled by a Boolean variable, such\
    \ as:\n\n```\n~~~cpp\nbool more = true;\nwhile (more)\n{\n   cin >> value;\n \
    \  if (cin.fail())\n   {\n      more = false;\n   }\n   else\n   {\n      Process\
    \ value.\n   }\n}\n~~~\n```\n\nThe actual test for loop termination is in the\
    \ middle of the loop, not at the top. This is called a **loop and a half** because\
    \ one must go halfway into the loop before knowing whether one needs to terminate.\n\
    \nAs an alternative, you can use the `break` reserved word.\n\n```\n~~~cpp\nwhile\
    \ (true)\n{\n   cin >> value;\n   if (cin.fail()) { break; }\n   Process value.\n\
    }\n~~~\n```\n\nThe `break` statement breaks out of the enclosing loop, independent\
    \ of the loop condition.\n\nIn the loop-and-a-half case, `break` statements can\
    \ be beneficial. But it is difficult to lay down clear rules as to when they are\
    \ safe and when they should be avoided. We do not use the `break` statement in\
    \ this book."
