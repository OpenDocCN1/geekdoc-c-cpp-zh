  md: "# Common Error 3.3\n\n# Exact Comparison of Floating-Point Numbers\n\nFloating-point\
    \ numbers have only a limited precision, and calculations can introduce roundoff\
    \ errors. You must take these inevitable roundoffs into account when comparing\
    \ floating-point numbers. For example, the following code multiplies the square\
    \ root of 2 by itself. Ideally, we expect to get the answer 2:\n\n```\n```cpp\n\
    double r = sqrt(2.0);\nif (r * r == 2)\n{\n    cout << \"sqrt(2) squared is 2\"\
    \ << endl;\n}\nelse\n{\n    cout << \"sqrt(2) squared is not 2 but \"\n      \
    \   << setprecision(18) << r * r << endl;\n}\n```\n```\n\nThis program displays\n\
    \n```\n```text\nsqrt(2) squared is not 2 but 2.0000000000000004\n```\n```\n\n\
    It does not make sense in most circumstances to compare floating-point numbers\
    \ exactly. Instead, we should test whether they are close enough. That is, the\
    \ magnitude of their difference should be less than some threshold. Mathematically,\
    \ we would write that x and y are close enough if\n\n$$|x - y| < \\varepsilon$$\n\
    \nfor a very small number, $\\varepsilon$. $\\varepsilon$ is the Greek letter\
    \ epsilon, a letter used to denote a very small quantity. It is common to set\
    \ $\\varepsilon$ to $10^{-14}$ when comparing double numbers:\n\n```\n```cpp\n\
    const double EPSILON = 1E-14;\ndouble r = sqrt(2.0);\nif (fabs(r * r - 2) < EPSILON)\n\
    {\n    cout << \"sqrt(2) squared is approximately 2\";\n}\n```\n```\n\nInclude\
    \ the <cmath> header to use the fabs function.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_113_0.png)\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_113_1.png)\n\n*Take limited precision\
    \ into account when comparing floating-point numbers.*\n\n# Special Topic 3.2\n\
    \n# Lexicographic Ordering of Strings\n\nIf you compare strings using < or >,\
    \ they are compared in “lexicographic” order. This ordering is very similar to\
    \ the way in which words are sorted in a dictionary.\n\nFor example, consider\
    \ this code fragment.\n\n```\n```cpp\nstring name = \"Tom\";\nif (name < \"Dick\"\
    ) ...\n```\n```\n\nThe condition is not fulfilled, because in the dictionary Dick\
    \ comes before Tom. There are a few differences between the ordering in a dictionary\
    \ and in C++. In C++:\n\n+   - All uppercase letters come before the lowercase\
    \ letters. For example, \"Z\" comes before \"a\".\n\n![](img/23fb3582e93ebc95909e1de029c3d388_113_2.png)\n\
    \n*To see which of two terms comes first in the dictionary, consider the first\
    \ letter in which they differ.*\n\n![](img/23fb3582e93ebc95909e1de029c3d388_113_3.png)"
  merge: -1
