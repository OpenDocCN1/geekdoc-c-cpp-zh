    \n# ## Prefer Return Values to Reference Parameters\n\nSome programmers use reference\
    \ parameters as a mechanism for setting the result of a function. For example,\n\
    \n```\n```cpp\nvoid cube_volume(double side_length, double& volume)\n{\n    volume\
    \ = side_length * side_length * side_length;\n}\n```\n```\n\nHowever, this function\
    \ is less convenient than our previous `cube_volume` function. It cannot be used\
    \ in expressions such as `cout << cube_volume(2)`.\n\nUse a reference parameter\
    \ only when a function needs to update a variable.\n\nSpecial Topic 5.2\n\n![](img/23fb3582e93ebc95909e1de029c3d388_252_1.png)\n\
    \n# ## Constant References\n\nIt is not very efficient to have a value parameter\
    \ that is a large object (such as a string value). Copying the object into a parameter\
    \ variable is less efficient than using a reference parameter. With a reference\
    \ parameter, only the location of the variable, not its value, needs to be transmitted\
    \ to the function.\n\nYou can instruct the compiler to give you the efficiency\
    \ of a reference parameter and the meaning of a value parameter, by using a **constant\
    \ reference** as shown below. The function\n\n```\n```cpp\nvoid shout(const string&\
    \ str)\n{\n    cout << str << \"!!!\" << endl;\n}\n```\n```\n\nworks exactly the\
    \ same as the function\n\n```\n```cpp\nvoid shout(string str)\n{\n    cout <<\
    \ str << \"!!!\" << endl;\n}\n```\n```\n\nThere is just one difference: Calls\
    \ to the first function execute a bit faster."
