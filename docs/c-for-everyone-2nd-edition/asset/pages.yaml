- pgno: 532
  md: '**Syntax error** An instruction that does not follow the programming language
    rules and is rejected by the compiler.


    **Tab character** The ''\t'' character, which advances the next character on the
    line to the next one of a set of fixed screen positions known as tab stops.


    **Test coverage** The instructions of a program that are executed when a set of
    test cases are run.


    **Text file** A file in which values are stored in their text representation.


    **Trace message** A message that is printed during a program run for debugging
    purposes.


    **Type** A named set of values and the operations that can be carried out with
    them.


    **Unary operator** An operator with one argument.


    **Unicode** A standard code that assigns values consisting of two bytes to characters
    used in scripts around the world.


    **Uninitialized variable** A variable that has not been set to a particular value.
    It is filled with whatever “random” bytes happen to be present in the memory location
    that the variable occupies.


    **Unit test** A test of a function by itself, isolated from the remainder of the
    program.


    **Value parameter** A function parameter whose value is copied into a parameter
    variable of a function. If a variable is passed as a value parameter, changes
    made to the parameter variable inside the function do not affect the original
    variable outside the program.


    **Variable** A storage location that can hold different values.


    **Vector** The standard C++ template for a dynamically-growing array.


    **Virtual function** A function that can be redefined in a derived class. The
    actual function called depends on the type of the object on which it is invoked
    at run time.


    **void** A reserved word indicating no type or an unknown type.


    **Walkthrough** Simulating a program or a part of a program by hand to test for
    correct behavior.


    **White space** A sequence consisting of space, tab, and/or newline characters.'
  merge: -1
  img_proc: true
