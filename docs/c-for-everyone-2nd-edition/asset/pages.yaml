  md: "**Figure 2**\nExecution of a\nfor Loop\n\n| 1 Initialize counter | for (counter\
    \ = 1; counter <= 10; counter++)<br>cout << counter << endl; |\n|---|---|\n| 2\
    \ Check condition | for (counter = 1; counter <= 10; counter++)<br>cout << counter\
    \ << endl; |\n| 3 Execute body | for (counter = 1; counter <= 10; counter++)<br>cout\
    \ << counter << endl; |\n| 4 Update counter | for (counter = 1; counter <= 10;\
    \ counter++)<br>cout << counter << endl; |\n| 5 Check condition again | for (counter\
    \ = 1; counter <= 10; counter++)<br>cout << counter << endl; |\n\nProgressive\
    \ figures trace code segments to help students visualize the program flow. Color\
    \ is used consistently to make variables and other elements easily recognizable.\n\
    \n```\n1 Function call\ndouble result1 = cube_volume(2);\nresult1 = 8\nsize_1\
    \ = 2\n\n2 Initializing function parameter variable\ndouble result2 = cube_volume(10);\n\
    result2 = 1000\nsize_2 = 10\n\n3 About to execute function body\ndouble volume\
    \ = side_length * side_length * side_length;\nside_length = 10\n\n4 Function return\n\
    return volume;\nresult2 = 1000\n\n**Figure 3** Parameter Passing\n```\n\n• The\
    \ parameter variable size, length of the cube, whose function is created. ①\n\
    • The parameter variable is initialized with the value of the argument that was\
    \ passed in the call to cube. ②\n• The parameter variable is copied, i.e., value,\
    \ length. ③\n• The parameter variable is ... value, length, size, length + size,\
    \ length... are stored in the variable 'cube'. ④\n• The return value is stored\
    \ in the variable 'result' in the function calling the cube_value function. ⑤\n\
    \nSelf-check exercises at the end of each section are designed to make students\
    \ think through the new material—and can spark discussion in lecture.\n\n**Checkpoint**\n\
    \n13. Write the for loop of the testabc.cpp program as a while loop.\n14. How\
    \ many numbers does this loop print?\nfor (int n = 10; n >= 0; n--)\n{\n cout\
    \ << n << endl;\n}\n15. Write a for loop that prints all even numbers between\
    \ 10 and 20 (inclusive).\n16. Write a for loop that computes the sum of the integers\
    \ from 1 to 10.\n\nPractice it Now you can try these exercises at the end of the\
    \ chapter: R4.2, R4.7, P4.12.\n\nOptional engineering exercises engage students\
    \ with applications from technical fields.\n\n```\nch05/cube.cpp\n1 #include <iostream>\n\
    2 using namespace std;\n3\n4 /**\n5 Computes the volume of a cube.\n6 @param side_length\
    \ the side length of the cube\n7 @return the volume\n8 */\n9 double cube_volume(double\
    \ side_length)\n10 {\n11 double volume = side_length * side_length * side_length;\n\
    12 return volume;\n13 }\n14\n15 int main()\n16 {\n17 double result1 = cube_volume(2);\n\
    18 double result2 = cube_volume(10);\n19 cout << \"A cube with side length 2 has\
    \ volume \" << result1 << endl;\n20 cout << \"A cube with side length 10 has volume\
    \ \" << result2 << endl;\n21 return 0;\n22 }\n\nProgram Run\nA cube with side\
    \ length 2 has volume 8\nA cube with side length 10 has volume 1000\n```\n\nProgram\
    \ listings are carefully designed for easy reading, going well beyond simple color\
    \ coding. Functions are set off by a subtle outline.\n\n**Engineering** P7.20\
    \ Write a program that simulates the control software for a \"people mover\" system,\
    \ a set of driverless trains that move in two concentric circular tracks. A set\
    \ of switches allows trains to switch tracks.\nIn your program, the outer and\
    \ inner tracks should each be divided into ten segments. Each track segment can\
    \ contain a train that moves either clockwise or counterclockwise. A train moves\
    \ to an adjacent segment in its track or, if that segment is occupied, to the\
    \ adjacent segment in the other track.\nDefine a Segment structure. Each segment\
    \ has a pointer to the next and previous segments in its track, a pointer to the\
    \ next and previous segments in the other track,\n\n![](img/23fb3582e93ebc95909e1de029c3d388_11_0.png)"
