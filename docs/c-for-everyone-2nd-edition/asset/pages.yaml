  md: "You have just seen the simplest and most common case for designing header and\
    \ source files. There are a few additional technical details that you should know.\n\
    \n+   - A header file should include all headers that are necessary for defining\
    \ the class. For example, if a class uses the string class, include the `<string>`\
    \ header as well. Anytime you include a header from the standard library, also\
    \ include the directive `using namespace std;`\n\n`using namespace std;`\n\n#\
    \ item.h\n\n```\n```cpp\n#include <string>\nusing namespace std;\n\nclass Item\n\
    {\n    ...\nprivate:\n    string description\n};\n```\n```\n\n+   - Place shared\
    \ constants into a header file. For example,\n\n# volumes.h\n\n```\n```cpp\nconst\
    \ double CAN_VOLUME = 0.355;\n```\n```\n\n+   - To share a nonmember function,\
    \ place the function declaration into a header file and the definition of the\
    \ function into the corresponding source file.\n\n# cube.h\n\n```\n```cpp\ndouble\
    \ cube_volume(double side_length);\n```\n```\n\n# cube.cpp\n\n```\n```cpp\n#include\
    \ \"cube.h\"\n\ndouble cube_volume(double side_length)\n{\n    double volume =\
