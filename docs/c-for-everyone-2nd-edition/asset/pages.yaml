  md: "# 10.4.3 **Virtual Functions**\n\nWhen you collect objects of different classes\
    \ in a class hierarchy, and then invoke a member function, you want the appropriate\
    \ member function to be applied. For example, when you call the display member\
    \ function on a `Question*` pointer that happens to point to a `ChoiceQuestion`,\
    \ you want the choices to be displayed.\n\nFor reasons of efficiency, this is\
    \ not the default in C++. By default, a call\n\n```\nquiz[i]->display();\n```\n\
    \nalways calls `Question::display` because the type of `quiz[i]` is `Question*`.\n\
    \nHowever, in this case you really want to determine the actual type of the object\
    \ to which `quiz[i]` points, which can be either a `Question` or a `ChoiceQuestion`\
    \ object, and then call the appropriate function. In C++, you must alert the compiler\
    \ that the function call needs to be preceded by the appropriate function selection,\
    \ which can be a different one for every iteration in the loop. You use the `virtual`\
    \ reserved word for this purpose:\n\n```\nclass Question\n{\npublic:\n    Question();\n\
    \    void set_text(string question_text);\n    void set_answer(string correct_response);\n\
    \    virtual bool check_answer(string response) const;\n    virtual void display()\
    \ const;\nprivate:\n    ...\n};\n```\n\nThe virtual reserved word must be used\
    \ in the *base class*. All functions with the same name and parameter variable\
    \ types in derived classes are then automatically virtual. However, it is considered\
    \ good taste to supply the virtual reserved word for the derived-class functions\
    \ as well.\n\n```\nclass ChoiceQuestion : public Question\n{\npublic:\n    ChoiceQuestion();\n\
    \    void add_choice(string choice, bool correct);\n    virtual void display()\
    \ const;\nprivate:\n    ...\n};\n```\n\nYou do not supply the reserved word virtual\
    \ in the function definition:\n\n```\nvoid Question::display() const // No virtual\
    \ reserved word\n{\n    cout << text << endl;\n}\n```\n\n> When a virtual function\
    \ is called, the version belonging to the actual type of the implicit parameter\
    \ is invoked.\n\nWhenever a virtual function is called, the compiler determines\
    \ the type of the implicit parameter in the particular call at run time. The appropriate\
    \ function for that object is then called. For example, when the display function\
    \ is declared virtual, the call\n\n```\nquiz[i]->display();\n```\n\nalways calls\
    \ the function belonging to the actual type of the object to which `display[i]`\
    \ points—either `Question::display` or `ChoiceQuestion::display`."
  merge: -1
  img_proc: true
