  md: '# HOW TO 2.1


    # ## Carrying out Computations


    Many programming problems require that you carry out arithmetic computations.
    This How To shows you how to turn a problem statement into pseudocode and, ultimately,
    a C++ program.


    For example, suppose you are asked to write a program that simulates a vending
    machine. A customer selects an item for purchase and inserts a bill into the vending
    machine. The vending machine dispenses the purchased item and gives change. We
    will assume that all item prices are multiples of 25 cents, and the machine gives
    all change in dollar coins and quarters. Your task is to compute how many coins
    of each type to return.


    # Step 1


    Understand the problem: What are the inputs? What are the desired outputs?


    In this problem, there are two inputs:


    +   - The denomination of the bill that the customer inserts

    +   - The price of the purchased item


    There are two desired outputs:


    +   - The number of dollar coins that the machine returns

    +   - The number of quarters that the machine returns


    # Step 2


    Work out examples by hand.


    Let’s assume that a customer purchased an item that cost $2.25 and inserted a
    $5 bill. The customer is due $2.75, or two dollar coins and three quarters.


    That is easy for you to see, but how can a C++ program come to the same conclusion?
    The computation is simpler if you work in pennies, not dollars. The amount due
    that the customer is 275 pennies. Dividing by 100 yields 2, the number of dollars.
    Dividing the remainder (75) by 25 yields 3, the number of quarters.


    # Step 3


    Write pseudocode for computing the answers.


    In the previous step, you worked out a specific instance of the problem. You now
    need to come up with a method that works in general.


    Given an arbitrary item price and payment, how can you compute the coins due?
    First, compute the amount due in pennies:


    ```

    amount due = 100 x bill value - item price in pennies

    ```


    To get the dollars, divide by 100 and discard the remainder:


    ```

    dollar coins = amount due / 100 (without remainder)

    ```


    ![](img/23fb3582e93ebc95909e1de029c3d388_81_0.png)


    A vending machine takes bills and gives change in coins.'
