- pgno: 189
  md: '# # HOW TO 4.1 Writing a Loop


    This How To walks you through the process of implementing a loop statement. We
    will illustrate the steps with the following example problem:


    Read twelve temperature values (one for each month), and display the number of
    the month with the highest temperature. For example, according to http://worldclimate.com,
    the average maximum temperatures for Death Valley are (in order by month):


    18.2  22.6  26.4  31.1  36.6  42.2

    45.7  44.5  40.2  33.1  24.2  17.6


    In this case, the month with the highest temperature (45.7 degrees Celsius) is
    July, and the program should display 7.


    ![](img/23fb3582e93ebc95909e1de029c3d388_189_0.png)


    **Step 1**  Decide what work must be done *inside* the loop.


    Every loop needs to do some kind of repetitive work, such as


    +   - Reading another item.

    +   - Updating a value (such as a bank balance or total).

    +   - Incrementing a counter.


    If you can''t figure out what needs to go inside the loop, start by writing down
    the steps that you would take if you solved the problem by hand. For example,
    with the temperature reading problem, you might write


    ```

    ```

    Read first value.

    Read second value.

    If second value is higher than the first, set highest temperature to that value,
    highest month to 2.

    Read next value.

    If value is higher than the first and second, set highest temperature to that
    value, highest month to 3.

    Read next value.

    If value is higher than the highest temperature seen so far, set highest temperature
    to that value, highest month to 4.

    ...

    ```

    ```


    Now look at these steps and reduce them to a set of *uniform* actions that can
    be placed into the loop body. The first action is easy:


    ```

    ```

    Read next value.

    ```

    ```


    The next action is trickier. In our description, we used tests "higher than the
    first", "higher than the first and second", "higher than the highest temperature
    seen so far". We need to settle on one test that works for all iterations. The
    last formulation is the most general.


    Similarly, we must find a general way of setting the highest month. We need a
    variable that stores the current month, running from 1 to 12. Then we can formulate
    the second loop action:


    ```

    ```

    If value is higher than the highest temperature, set highest temperature to that
    value, highest month to current month.

    ```

    ```'
