  md: '# Syntax 6.3 — Defining a Vector


    ![](img/23fb3582e93ebc95909e1de029c3d388_312_0.png)


    # 6.7.1 Defining Vectors


    When you define a vector, you specify the type of the elements in angle brackets,
    like this:


    ```

    vector<double> values;

    ```


    You can optionally specify the initial size. For example, here is a definition
    of a vector whose initial size is 10:


    ```

    vector<double> values(10);

    ```


    If you define a vector without an initial size, it has size 0. While there would
    be no point in defining an array of size zero, it is often useful to have vectors
    with *initial* size zero, and then grow them as needed.


    In order to use vectors in your program, you need to include the `<vector>` header.


    **Table 2. Defining Vectors**


    | Code | Description |

    |---|---|

    | `vector<int> numbers(10);` | A vector of ten integers. |

    | `vector<string> names(3);` | A vector of three strings. |

    | `vector<double> values;` | A vector of size 0. |

    | `vector<double> values();` | **Error:** Does not define a vector. |

    | `vector<int> numbers;`<br>`for (int i = 1; i <= 10; i++)`<br>`{`<br>`    numbers.push_back(i);`<br>`}`
    | A vector of ten integers, filled with 1, 2, 3, ..., 10. |

    | `vector<int> numbers(10);`<br>`for (int i = 0; i < numbers.size(); i++)`<br>`{`<br>`    numbers[i]
    = i + 1;`<br>`}` | Another way of defining a vector of ten integers and filling
    it with 1, 2, 3, ..., 10. |'
