- pgno: 178
  md: "The following program reads inputs until the user enters the sentinel, and\
    \ then computes and prints the average.\n\n# ch04/sentinel.cpp\n\n```\n~~~cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n   double sum =\
    \ 0;\n   int count = 0;\n   double salary = 0;\n   cout << \"Enter salaries, -1\
    \ to finish: \";\n   while (salary != -1)\n   {\n      cin >> salary;\n      if\
    \ (salary != -1)\n      {\n         sum = sum + salary;\n         count++;\n \
    \     }\n   }\n   if (count > 0)\n   {\n      double average = sum / count;\n\
    \      cout << \"Average salary: \" << average << endl;\n   }\n   else\n   {\n\
    \      cout << \"No data\" << endl;\n   }\n   return 0;\n}\n~~~\n```\n\n# Program\
    \ Run\n\n```\n~~~\nEnter salaries, -1 to finish: 10 10 40 -1\nAverage salary:\
    \ 20\n~~~\n```\n\nNumeric sentinels only work if there is some restriction on\
    \ the input. In many cases, though, there isn’t. Suppose you want to compute the\
    \ average of a data set that may contain 0 or negative values. Then you cannot\
    \ use 0 or –1 to indicate the end of the input.\n\nIn such a situation, you can\
    \ read input data until input fails. As you have seen in Section 3.8, the condition\n\
    \n```\n~~~\ncin.fail()\n~~~\n```\n\nis true if the preceding input has failed.\
    \ For example, suppose that the input was read with these statements:\n\n```\n\
    ~~~\ndouble value;\ncin >> value;\n~~~\n```\n\nIf the user enters a value that\
    \ is not a number (such as Q), then the input fails."
