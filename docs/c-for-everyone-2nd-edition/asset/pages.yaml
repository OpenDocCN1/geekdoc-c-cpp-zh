  md: "# HOW TO 10.1\n\n# Developing an Inheritance Hierarchy\n\n![](img/23fb3582e93ebc95909e1de029c3d388_491_0.png)\n\
    \nWhen you work with a set of classes, some of which are more general and others\
    \ more specialized, you want to organize them into an inheritance hierarchy. This\
    \ enables you to process objects of different classes in a uniform way.\n\nAs\
    \ an example, we will consider a bank that offers its customers the following\
    \ account types:\n\n+   - A savings account that earns interest. The interest\
    \ compounds monthly and is computed on the minimum monthly balance.\n+   - A checking\
    \ account that has no interest, gives you three free withdrawals per month, and\
    \ charges a $1 transaction fee for each additional withdrawal.\n\nThe program\
    \ will manage a set of accounts of both types, and it should be structured so\
    \ that other account types can be added without changing the main processing loop.\
    \ Supply a menu\n\nD)eposit  W)ithdraw  M)onth end  Q)uit\n\nFor deposits and\
    \ withdrawals, query the account number and amount. Print the balance of the account\
    \ after each transaction.\n\nIn the “Month end” command, accumulate interest or\
    \ clear the transaction counter, depending on the type of the bank account. Then\
    \ print the balance of all accounts.\n\n# Step 1\n\nList the classes that are\
    \ part of the hierarchy.\n\nIn our case, the problem description yields two classes:\
    \ SavingsAccount and CheckingAccount. To express the commonality between them,\
    \ we will introduce a class BankAccount.\n\n# Step 2\n\nOrganize the classes into\
    \ an inheritance hierarchy.\n\nDraw a UML diagram that shows base and derived\
