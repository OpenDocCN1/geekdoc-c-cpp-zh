  md: "# ### Programming Tip 3.4\n\n# ## Avoid Duplication in Branches\n\n![](img/23fb3582e93ebc95909e1de029c3d388_109_0.png)\n\
    \nLook to see whether you *duplicate code* in each branch. If so, move it out\
    \ of the if statement. Here is an example of such duplication:\n\n```\n```cpp\n\
    if (Floor > 13)\n{\n   actual_floor = floor - 1;\n   cout << \"Actual floor: \"\
    \ << actual_floor << endl;\n}\nelse\n{\n   actual_floor = floor;\n   cout << \"\
    Actual floor: \" << actual_floor << endl;\n}\n```\n```\n\nThe output statement\
    \ is exactly the same in both branches. This is not an error—the program will\
    \ run correctly. However, you can simplify the program by moving the duplicated\
    \ statement, like this:\n\n```\n```cpp\nif (Floor > 13)\n{\n   actual_floor =\
    \ floor - 1;\n}\nelse\n{\n   actual_floor = floor;\n}\ncout << \"Actual floor:\
    \ \" << actual_floor << endl;\n```\n```\n\nRemoving duplication is particularly\
    \ important when programs are maintained for a long time. When there are two sets\
    \ of statements with the same effect, it can easily happen that a programmer modifies\
    \ one set but not the other.\n\n# # 3.2 Comparing Numbers and Strings\n\nRelational\
    \ operators (< > <= >= == !=) are used to compare numbers and strings.\n\nEvery\
    \ if statement contains a condition. In many cases, the condition involves comparing\
    \ two values. For example, in the previous examples we tested floor > 13. The\
    \ comparison > is called a relational operator. C++ has six relational operators\
    \ (see Table 1).\n\nAs you can see, only two C++ relational operators (< and >)\
    \ look as you would expect from the mathematical notation. Computer keyboards\
    \ do not have keys for ≤, ≥, or ≠, but the <=, >=, and != operators are easy to\
    \ remember because they look similar. The == operator is initially confusing to\
    \ most newcomers to C++. In C++, = already has a meaning, namely assignment.\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_109_1.png)\n\nIn C++, you use a relational\
    \ operator to check whether one value is greater than another."
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Table 1. Relational Operators


    | C++ | Math Notation | Description |

    |---|---|---|

    | `>` | `>` | Greater than |

    | `>=` | `≥` | Greater than or equal |

    | `<` | `<` | Less than |

    | `<=` | `≤` | Less than or equal |

    | `==` | `=` | Equal |

    | `!=` | `≠` | Not equal |


    The `==` operator denotes equality testing:


    ```

    floor = 13; // Assign 13 to floor

    if (floor == 13)  // Test whether floor equals 13

    ```


    You must remember to use `==` inside tests and to use `=` outside tests. (See
    Common Error 3.2 on page 85 for more information.)


    You can compare strings as well:


    ```

    if (input == "Quit") ...

    ```


    Use `!=` to check whether two strings are different. In C++, letter case matters.
    For example, "Quit" and "quit" are not the same string.


    # Syntax 3.2 — Comparisons


    ![](img/23fb3582e93ebc95909e1de029c3d388_110_0.png)'
