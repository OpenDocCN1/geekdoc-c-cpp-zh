    \ | 11576.25 | 13310.00 |\n| 4 | 12155.06 | 14641.00 |\n| 5 | 12762.82 | 16105.10\
    \ |\n\nThis row clarifies that 1 means the end of the first year.\n\n31. The total\
    \ is zero.\n\n```\n32. double total = 0;\ndouble input;\nwhile (cin >> input)\n\
