  md: "other cars when it comes to driving and refueling. They just have a better\
    \ fuel efficiency. A single Car class with a data member\n\n```\ndouble miles_per_gallon;\n\
    ```\n\nis entirely sufficient.\n\nHowever, if you write a program that shows how\
    \ to repair different kinds of vehicles, then it makes sense to have a separate\
    \ class HybridCar. When it comes to repairs, hybrid cars behave differently from\
    \ other cars.\n\n# Special Topic 10.1\n\n![](img/23fb3582e93ebc95909e1de029c3d388_478_0.png)\n\
    \n# Calling the Base-Class Constructor\n\nConsider the process of constructing\
    \ a derived-class object. A derived-class constructor can only initialize the\
    \ data members of the derived class. But the base-class data members also need\
    \ to be initialized. Unless you specify otherwise, the base-class data members\
    \ are initialized with the default constructor of the base class.\n\n> Unless\
    \ specified otherwise, the base-class data members are initialized with the default\
    \ constructor.\n\nIn order to specify another constructor, you use an initializer\
    \ list, as described in Special Topic 9.1. Specify the name of the base class\
    \ and the construction arguments in the initializer list. For example, suppose\
    \ the Question base class had a constructor for setting the question text. Here\
    \ is how a derived-class constructor could call that base-class constructor:\n\
    \n```\nChoiceQuestion::ChoiceQuestion(string question_text)\n    : Question(question_text)\n\
    {\n}\n```\n\nThe derived-class constructor calls the base-class constructor before\
    \ executing the code inside the { }.\n\n> The constructor of a derived class can\
    \ supply arguments to a base-class constructor.\n\nIn our example program, we\
    \ used the default constructor of the base class. However, if a base class has\
    \ no default constructor, you must use the initializer list syntax.\n\n# Syntax\
    \ 10.2 — Constructor with Base-Class Initializer\n\n![](img/23fb3582e93ebc95909e1de029c3d388_478_1.png)\n\
    \n# 10.3 Overriding Member Functions\n\nThe derived class inherits the member\
    \ functions from the base class. If you are not satisfied with the behavior of\
    \ the inherited member function, you can override it by specifying a new implementation\
    \ in the derived class."
