    /**\n * Converts a string to a floating-point number, e.g. \"3.14\" -> 3.14.\n\
    \ * @param s a string representing a floating-point number\n * @return the equivalent\
    \ floating-point number\n */\ndouble string_to_double(string s)\n{\n    istringstream\
    \ stream;\n    stream.str(s);\n    double x = 0;\n```\n```"
