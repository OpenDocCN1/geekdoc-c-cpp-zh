    \ use the `>>` operator to send strings and numbers to a stream. To write a single\
    \ character to a stream, use\n\n```\n```cpp\nout_file.put(ch);\n```\n```\n\nTo\
    \ control how the output is formatted, you use stream *manipulators*. A manipulator\
    \ is a value that affects the behavior of the stream. It is sent to a stream using\
    \ the `<<` operator. The `setw` manipulator, which you have already used, is a\
    \ typical example. The statement\n\n```\n```cpp\nout_file << setw(10);\n```\n\
    ```\n\ndoes not cause any immediate output, but when the next item is written,\
    \ it is padded with sufficient spaces so that the output spans ten characters.\
    \ (If a value does not fit into the given width, it is not truncated.)\n\n> >\
    \ Use the `setw` manipulator to set the width of the next output.\n\nOccasionally,\
    \ you need to pad numbers with leading zeroes, for example to print hours and\
    \ minutes as 09:01. This is achieved with the `setfill` manipulator:\n\n```\n\
    ```cpp\nout_file << setfill('0') << setw(2) << hours\n         << \":\" << setw(2)\
    \ << minutes << setfill(' ');\n```\n```\n\nNow, a zero is used to pad the field.\
    \ Afterward, the space is restored as the fill character.\n\nBy default, the fill\
    \ characters appear before the item:\n\n```\n```cpp\nout_file << setw(10) << 123\
    \ << endl << setw(10) << 4567;\n```\n```\n\nproduces\n\n```\n```text\n       123\n\
    \      4567\n```\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_388_0.png)\n\
    \n*A manipulator is like a control button on a sound mixer. It doesn't produce\
    \ an output, but it affects how the output looks.*"
