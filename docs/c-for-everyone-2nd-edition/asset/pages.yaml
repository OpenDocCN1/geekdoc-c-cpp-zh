  md: "When gathering data that can be distributed over several lines, then it makes\
    \ more sense to read words. Keep in mind that you lose all white space when you\
    \ read words.\n\nReading characters is mostly useful for tasks that require access\
    \ to individual characters. Examples include analyzing character frequencies,\
    \ changing tabs to spaces, or encryption.\n\n+   **Step 5** — With line-oriented\
    \ input, extract the required data.\n\nIt is simple to read a line of input with\
    \ the `getline` function. Then you need to get the data out of that line. You\
    \ can extract substrings, as described in Section 8.2. Alternatively, you can\
    \ turn the line into an `istringstream` and extract its components with the `>>`\
    \ operator. The latter approach is easier when the number of items on each line\
    \ is constant. In our example, that is not the case—country names can consist\
    \ of more than one string. Therefore, we choose to extract substrings from each\
    \ input line.\n\nIf you need any of the substrings as numbers, you must convert\
    \ them (see Section 8.4).\n\n+   **Step 6** — Place repeatedly occurring tasks\
    \ into functions.\n\nProcessing input files usually has repetitive tasks, such\
    \ as skipping over white space or extracting numbers from strings. It really pays\
    \ off to develop a set of functions to handle these tedious operations.\n\nIn\
    \ our example, we have a common task that calls for a helper function: extracting\
    \ the country name and the value that follows. This task can be implemented in\
    \ a helper function\n\n```\nvoid read_line(string line, string& country, double&\
    \ value)\n```\n\nWe also need a helper function `string_to_double` to convert\
    \ the population and area values to floating-point numbers. This function is similar\
    \ to `string_to_int` that was developed in Section 8.4.\n\n+   **Step 7** — If\
    \ required, use manipulators to format the output.\n\nIf you are asked to format\
    \ your output, use manipulators, as described in Section 8.3. Usually, you want\
    \ to switch to fixed format for the output and set the precision. Then use `setw`\
    \ before every value, and use `left` for aligning strings and `right` for aligning\
    \ numbers.\n\n```\nout << setw(40) << left << country << setw(15) << right <<\
    \ density << endl;\n```\n\nHere is the complete program:\n\n# ch08/popdensity.cpp\n\
    \n```\n```cpp\n#include <cctype>\n#include <fstream>\n#include <iostream>\n#include\
