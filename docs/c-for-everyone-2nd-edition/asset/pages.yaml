  md: '# Special Topic 2.4


    ![](img/23fb3582e93ebc95909e1de029c3d388_74_0.png)


    # Combining Assignment and Arithmetic


    In C++, you can combine arithmetic and assignment. For example, the instruction


    ```cpp

    total += cans * CAN_VOLUME;

    ```

    is a shortcut for


    ```cpp

    total = total + cans * CAN_VOLUME;

    ```

    Similarly,


    ```cpp

    total *= 2;

    ```

    is another way of writing


    ```cpp

    total = total * 2;

    ```

    Many programmers find this a convenient shortcut. If you like it, go ahead and
    use it in your own code. For simplicity, we won’t use it in this book, though.


    # Random Fact 2.1 — The Pentium Floating-Point Bug


    In 1994, Intel Corporation released what was then its most powerful processor,
    the Pentium. Unlike generations of its processors, it had a very fast floating-point
    unit. Intel’s goal was to compete aggressively with the makers of higher-end processors
    for engineering workstations. The Pentium was a huge success immediately.


    In the summer of 1994, Dr. Thomas Nicely of Lynchburg College, Virginia, ran an
    extensive set of computations to analyze the sums of reciprocals of certain sequences
    of prime numbers. The results were not always what his theory predicted, even
    after he took into account the inevitable roundoff errors. Then Dr. Nicely noted
    that the same program did produce the correct results when running on the slower
    486 processor that preceded the Pentium in Intel’s lineup. This should not have
    happened. The optimal round-off behavior of floating-point calculations were standardized
    by the Institute for Electrical and Electronic Engineers (IEEE) and Intel claimed
    to adhere to the IEEE standard in both the 486 and the Pentium processors. Upon
    further checking, Dr. Nicely discovered that there was a very small set of numbers
    for which the product of two numbers was computed differently on the two processors.
    For example,


    4,195,835 − ((4,195,835/3,145,727) × 3,145,727)


    is mathematically equal to 0, and it did compute as 0 on a 486 processor. On his
    Pentium processor the result was 256.


    As it turned out, Intel had independently discovered the bug in its testing and
    had started to produce chips that fixed it. The bug was caused by an error in
    a table that was used to speed up the processor’s floating-point multiplication
    algorithm. Intel determined that the problem was exceedingly rare. They claimed
    that under normal use, a typical consumer would only notice the problem once every
    27,000 years. Unfortunately for Intel, Dr. Nicely had not been a normal user.


    Now Intel had a real problem on its hands. It figured that the cost of replacing
    all Pentium processors that it had sold so far would cost a great deal of money.
    Intel already had more orders for the chip than it could produce, and it would
    be particularly galling to have to give out the scarce chips as free replacements
    instead of selling them. Intel’s management decided to punt and initially offered
    to replace the processors only for those customers who could prove that their
    work required absolute precision in mathematical calculations. Naturally, that
    did not go over well with the hundreds of thousands of customers who had paid
    retail prices of $700 and more for a Pentium chip and did not want to live with
    the nagging feeling that perhaps, one day, their income tax program would produce
    a faulty return. Ultimately, Intel caved in to public demand and replaced all
    defective chips, at a cost of about 475 million dollars.


    ![](img/23fb3582e93ebc95909e1de029c3d388_74_1.png)


    > This graph shows a set of numbers for which the original Pentium processor obtained
    the wrong quotient.'
