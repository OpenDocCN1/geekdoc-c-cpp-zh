    \ sorted\n    Locate the first marble that is preceded by a marble of a different\
    \ color, and switch them.\n```\n\nWhy is this not an algorithm?\n\n**Practice\
    \ It** Now you can try these exercises at the end of the chapter: R1.13, R1.14.\n\
    \n# ## HOW TO 1.1: Describing an Algorithm with Pseudocode\n\n![](img/23fb3582e93ebc95909e1de029c3d388_47_0.png)\n\
    \nBefore you are ready to write a program in C++, you need to develop an algorithm—a\
    \ method for arriving at a solution for a particular problem. Describe the algorithm\
    \ in pseudocode: a sequence of precise steps formulated in English.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_47_1.png)\n\
    \nFor example, consider this problem: You have the choice of buying two cars.\
    \ One is more fuel efficient than the other, but also more expensive. You know\
    \ the price and fuel efficiency (in miles per gallon, mpg) of both cars. You plan\
    \ to keep the car for ten years. Assume a price of $4 per gallon of gas and usage\
    \ of 15,000 miles per year. You will pay cash for the car and not worry about\
    \ financing costs. Which car is the better deal?\n\n**Step 1** Determine the inputs\
    \ and outputs.\n\nIn our sample problem, we have these inputs:\n\n+   - purchase\
    \ price1 and fuel efficiency1, the price and fuel efficiency (in mpg) of the first\
    \ car\n+   - purchase price2 and fuel efficiency2, the price and fuel efficiency\
    \ of the second car\n\nWe simply want to know which car is the better buy. That\
    \ is the desired output.\n\n**Step 2** Break down the problem into smaller tasks.\n\
    \nFor each car, we need to know the total cost of driving it. Let’s do this computation\
    \ separately for each car. Once we have the total cost for each car, we can decide\
    \ which car is the better deal.\n\nThe total cost for each car is purchase price\
    \ + operating cost.\n\nWe assume a constant usage and gas price for ten years,\
    \ so the operating cost depends on the cost of driving the car for one year.\n\
    \nThe operating cost is 10 x annual fuel cost.\n\nThe annual fuel cost is price\
    \ per gallon x annual fuel consumed.\n\nThe annual fuel consumed is annual miles\
    \ driven / fuel efficiency. For example, if you drive the car for 15,000 miles\
    \ and the fuel efficiency is 15 miles/gallon, the car consumes 1,000 gallons."
  merge: -1
  img_proc: true
