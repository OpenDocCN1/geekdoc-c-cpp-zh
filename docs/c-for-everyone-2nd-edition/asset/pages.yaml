- pgno: 257
  md: '# Step 2


    Combine solutions with simpler inputs into a solution of the original problem.


    In your mind, consider the solutions for the simpler inputs that you have discovered
    in Step 1. Don’t worry how those solutions are obtained. Simply have faith that
    the solutions are already available. Just say to yourself: These are simpler inputs,
    so someone else will solve the problem for me.


    In the case of the digit sum task, ask yourself how you can obtain `digit_sum(1729)`
    if you know `digit_sum(172)`. You simply add the last digit, 9, and you are done.
    How do you get the last digit? As the remainder n % 10. The value `digit_sum(n)`
    can therefore be obtained as


    `digit_sum(n / 10) + n % 10`


    Don’t worry how `digit_sum(n / 10)` is computed. The input is smaller, and therefore
    it just works.


    > When designing a recursive solution, do not worry about multiple nested calls.
    Simply focus on reducing a problem to a slightly simpler one.


    # Step 3


    Find solutions to the simplest inputs.


    A recursive computation keeps simplifying its inputs. To make sure that the recursion
    comes to a stop, you must deal with the simplest inputs separately. Come up with
    special solutions for them. That is usually very easy.


    Look at the simplest inputs for the `digit_sum` test:


    +   - A number with a single digit

    +   - 0


    ![](img/23fb3582e93ebc95909e1de029c3d388_257_0.png)


    # Random Fact 5.1  The Explosive Growth of Personal Computers


    ration, was working on a chip for a manufacturer of electronic calculators. He
    realized that it would be a better idea to develop a general-purpose chip that
    could be programmed to interface with the keys and display of a calculator, rather
    than to do yet another custom design. Thus, the microprocessor was born. At the
    time, its primary application was as a controller for calculators, washing machines,
    and the like. It took years for the computer industry to notice that a genuine
    central processing unit was now available as a single chip.


    Hobbyists were the first to catch on. In 1974 the first computer kit, the Altair
    8800, was available from MITS Electronics for about $350. The kit consisted of
    the microprocessor, a circuit board, a very small amount of memory, toggle switches,
    and a row of display lights. Purchasers had to solder and assemble it, then program
    it in machine language through the toggle switches. It was not a big hit.


    The first big hit was the Apple II. It was a real computer with a keyboard, a
    monitor, and a floppy disk drive. When it was first released, users had a $3,000
    machine that could play Space Invaders, run a primitive bookkeeping program, or
    let users program it in BASIC. The original Apple II did not even support lowercase
    letters, making it worthless for word processing. The breakthrough came in 1979
    with a new spreadsheet program, VisiCalc. In a spreadsheet, you enter financial
    data and their relationships into a grid of rows and columns (see the figure at
    right). Then you modify some of the data and watch in real time how the others
    change. For example, you can see how changing the mix of widgets in a manufacturing
    plant might affect estimated costs and profits. Middle managers in companies,
    who understood computers and were fed up with having to wait for hours or days
    to get their data runs back from the computing center, snapped up VisiCalc and
    the computer that was needed to run it. For them, the computer was a spreadsheet
    machine.


    The next big hit was the IBM Personal Computer, ever after known as the PC. It
    was the first widely available personal computer that used Intel’s 16-bit processor,
    the 8086, whose successors are still being used in personal computers today. The
    success of the PC was based not on any engineering breakthroughs but on the fact
    that it was easy to clone. IBM published the computer’s specifications in order
    to encourage third parties to develop plug-in cards. Perhaps IBM did not foresee
    that functionally equivalent versions of their computer could be recreated by
    others, but a variety of PC clone vendors emerged, and ultimately IBM stopped
    selling personal computers.


    IBM never produced an operating system for its PCs—that is, the software that
    organizes the interaction between the user and the computer, starts application
    programs, and manages disk storage and other resources. Instead, IBM offered customers
    the option of three separate operating systems. Most customers couldn’t care less
    about the operating system.'
