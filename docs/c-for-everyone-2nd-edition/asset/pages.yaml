  md: "# Programming Tip 3.3\n\n![](img/23fb3582e93ebc95909e1de029c3d388_108_0.png)\n\
    \n# Tabs\n\nBlock-structured code has the property that nested statements are\
    \ indented by one or more levels:\n\n```\n    int main()\n    {\n       int floor;\n\
    \       ...\n       if (floor > 13)\n       {\n          floor--;\n       }\n\
    \       ...\n       return 0;\n    }\n```\n\n0 1 2 Indentation level\n\nHow do\
    \ you move the cursor from the leftmost column to the appropriate indentation\
    \ level? A perfectly reasonable strategy is to hit the space bar a sufficient\
    \ number of times. However, many programmers use the Tab key instead. A tab moves\
    \ the cursor to the next indentation level.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_108_1.png)\n\
    \nYou use the Tab key to move the cursor to the next indentation level.\n\nWhile\
    \ the Tab key is nice, some editors use tab characters for alignment, which is\
    \ not so nice. Tab characters can lead to problems when you send your file to\
    \ another person or a printer. There is no universal agreement on the width of\
    \ a tab character, and some software will ignore tabs altogether. It is therefore\
    \ best to save your files with spaces instead of tabs. Most editors have a setting\
    \ to automatically convert all tabs to spaces. Look at the documentation of your\
    \ development environment to find out how to activate this useful setting.\n\n\
    # Special Topic 3.1\n\n![](img/23fb3582e93ebc95909e1de029c3d388_108_2.png)\n\n\
    # The Selection Operator\n\nC++ has a selection operator of the form\n\n```\n\
    `condition ? value1 : value2`\n```\n\nThe value of that expression is either value1\
    \ if the test passes or value2 if it fails. For example, we can compute the actual\
    \ floor number as\n\n```\n`actual_floor = floor > 13 ? floor - 1 : floor;`\n```\n\
    \nwhich is equivalent to\n\n```\n    if (floor > 13)\n    {\n       actual_floor\
    \ = floor - 1;\n    }\n    else\n    {\n       actual_floor = floor;\n    }\n\
    ```\n\nYou can use the selection operator anywhere that a value is expected, for\
    \ example:\n\n```\n`cout << \"Actual floor: \" << (floor > 13 ? floor - 1 : floor);`\n\
    ```\n\nWe don't use the selection operator in this book, but it is a convenient\
    \ construct that you will find in many C++ programs."
