  md: "Figure 3 gives a schematic overview of the architecture of a personal computer.\
    \ Program instructions and data (such as text, numbers, audio, or video) are stored\
    \ on the hard disk, on an optical disk such as a DVD, or elsewhere on the network.\
    \ When a program is started, it is brought into memory, where the CPU can read\
    \ it. The CPU reads the program one instruction at a time. As directed by these\
    \ instructions, the CPU reads data, modifies it, and stores it. Some program instructions\
    \ will cause the CPU to place dots on the display screen or printer to vibrate\
    \ the speaker. As these actions happen many times over and at great speed, the\
    \ human user perceives images and sound. Some program instructions read user input\
    \ from the keyboard or mouse. The program analyzes the nature of these inputs\
    \ and then executes the next appropriate instruction.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_32_0.png)\n\
    \n# SELF CHECK\n\n+   4. Where is a program stored when it is not currently running?\
    \  \n+   5. Which part of the computer carries out arithmetic operations, such\
    \ as addition and multiplication?\n\n**Practice It** Now you can try these exercises\
    \ at the end of the chapter: R1.2, R1.3.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_32_1.png)\n\
    \n# *Random Fact 1.1* The ENIAC and the Dawn of Computing\n\nThe ENIAC (electronic\
    \ numerical integrator and computer) was the first usable electronic computer.\
    \ It was designed by J. Presper Eckert and John Mauchly at the University of Pennsylvania\
    \ and was completed in 1946—two years before transistors were invented. The computer\
    \ was housed in a large room and consisted of many cabinets containing about 18,000\
    \ vacuum tubes (see Figure 2). Vacuum tubes burned out at the rate of several\
    \ tubes per day. An attendant with a shopping cart full of tubes constantly made\
    \ the rounds and replaced defective ones. The computer was programmed by connecting\
    \ wires on panels. Each wiring configuration would set up the computer for a particular\
    \ problem. To have the computer work on a different problem, the wires had to\
    \ be replugged.\n\nWork on the ENIAC was supported by the U.S. Army, which was\
    \ interested in computations of ballistic tables that would give the trajectory\
    \ of a projectile, depending on the wind resistance, initial velocity, and atmospheric\
    \ conditions. To compute the trajectories,\n\none must find the numerical solutions\
    \ of certain differential equations; hence the name “numerical integrator”. Before\
    \ machines like the ENIAC were developed, humans did this kind\n\nof work, and\
    \ until the 1950s the word “computer” referred to these people. The ENIAC was\
    \ later used for peaceful purposes, such as the tabulation of U.S. Census data.\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_32_2.png)\n\n**Figure 4** The ENIAC"
