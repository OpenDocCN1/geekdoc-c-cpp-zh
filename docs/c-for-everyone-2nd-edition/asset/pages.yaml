  md: "# ### 6.2.3 Sum and Average Value\n\nYou have already encountered this algorithm\
    \ in Section 4.7.1. Here is the code for computing the sum of all elements in\
    \ an array:\n\n```\ndouble total = 0;\nfor (int i = 0; i < size of values; i++)\n\
    {\n    total = total + values[i];\n}\n```\n\nTo obtain the average, divide by\
    \ the number of elements:\n\n```\ndouble average = total / size of values;\n```\n\
    \nBe sure to check that the size is not zero.\n\n# ### 6.2.4 Maximum and Minimum\n\
    \nUse the algorithm from Section 4.7.4 that keeps a variable for the largest element\
    \ that you have encountered so far. Here is the implementation for arrays:\n\n\
    ```\ndouble largest = values[0];\nfor (int i = 1; i < size of values; i++)\n{\n\
    \    if (values[i] > largest)\n    {\n        largest = values[i];\n    }\n}\n\
    ```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_284_0.png)\n\nNote that the loop\
    \ starts at 1 because we initialize largest with values[0].\nTo compute the smallest\
    \ value, reverse the comparison.\nThese algorithms require that the array contain\
    \ at least one element.\n\n# ### 6.2.5 Element Separators\n\n> > When separating\
