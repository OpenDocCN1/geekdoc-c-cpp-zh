    # ### Programming Tip 4.4


    # ## Flowcharts for Loops


    ![](img/23fb3582e93ebc95909e1de029c3d388_176_2.png)


    In Section 3.5, you learned how to use flowcharts to visualize the flow of control
    in a program. There are two types of loops that you can include in a flowchart;
    they correspond to a `while` loop and a `do` loop in C++. They differ in the placement
    of the condition—either before or after the loop body.


    ![](img/23fb3582e93ebc95909e1de029c3d388_176_3.png)


    As described in Section 3.5, you want to avoid “spaghetti code” in your flowcharts.
    For loops, that means that you never want to have an arrow that points inside
    a loop body.'
