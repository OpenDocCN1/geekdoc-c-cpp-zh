- pgno: 528
  md: '**delete operator** The operator that recycles memory to the heap.


    **Derived class** A class that modifies a base class by adding data members, adding
    member functions, or redefining member functions.


    **Directory** A structure on a disk that can hold files or other directories;
    also called a folder.


    **Dot notation** The notation *object.function(parameters)* used to invoke a member
    function on an object.


    **Element** A storage location in an array.


    **Encapsulation** The hiding of implementation details.


    **Escape character** A character in text that is not taken literally but has a
    special meaning when combined with the character or characters that follow it.
    The \\ character is an escape character in C++ strings.


    **Exception** A condition that prevents a program from continuing normally.


    **Executable file** The file that contains a program’s machine instructions.


    **Explicit parameter** A parameter of a member function other than the object
    on which the function is invoked.


    **Expression** A syntactical construct that is made up of constants, variables,
    and/or function calls, and the operators combining them.


    **Extension** The last part of a file name, which specifies the file type. For
    example, the extension .cpp denotes a C++ file.


    **Failed stream state** The state of a stream after an invalid operation has been
    attempted, such as reading a number when the next stream position yielded a non-digit,
    or reading after the end of file was reached.


    **File** A sequence of bytes that is stored on disk.


    **File pointer** The position within a file of the next byte to be read or written.
    It can be moved so as to access any byte in the file.


    **Floating-point number** A number with a fractional part.


    **Folder** Directory.


    **Function** A sequence of statements that can be invoked multiple times, with
    different values for its parameter variables.


    **Global variable** A variable whose scope is not restricted to a single function.


    **Header file** A file that informs the compiler of features that are available
    in another module or library.


    **Heap** A reservoir of storage from which memory can be allocated when a program
    runs.'
  merge: -1
  img_proc: true
- pgno: 529
  md: '**IDE (Integrated Development Environment)** A programming environment that
    includes an editor, compiler, and debugger.


    **Implicit parameter** The object on which a member function is called. For example,
    in the call x.f(y), the object x is the implicit parameter of f.


    **#include directive** An instruction to the preprocessor to include a header
    file.


    **Index** The position of an element in an array.


    **Inheritance** The “is-a” relationship between a general base class and a specialized
    derived class.


    **Initialization** Setting a variable to a well-defined value when it is created.


    **Integer** A number without a fractional part.


    **Integer division** Taking the quotient of two integers and discarding the remainder.
    In C++, the / symbol denotes integer division if both arguments are integers.
    For example, 11 / 4 is 2, not 2.75.


    **Interface** The set of functions that can be applied to objects of a given type.


    **Lexicographic ordering** Ordering strings in the same order as in a dictionary,
    by skipping all matching characters and comparing the first nonmatching characters
    of both strings. For example, “orbit” comes before “orchid” in the lexicographic
    ordering. Note that in C++, unlike a dictionary, the ordering is case-sensitive:
    Z comes before a.


    **Library** A set of precompiled functions that can be included in programs.


    **Linker** The program that combines object and library files into an executable
    file.


    **Local variable** A variable whose scope is a single block.


    **Logic error** An error in a syntactically correct program that causes it to
    act differently from its specification.


    **Logical operator** An operator that can be applied to Boolean values. C++ has
    three logical operators: &&, ||, and !.


    **Loop** A sequence of instructions that is executed repeatedly.


    **Loop and a half** A loop whose termination decision is neither at the beginning
    nor at the end.


    **Machine code** Instructions that can be executed directly by the CPU.


    **Magic number** A number that appears in a program without explanation.


    **main function** The function that is called first when a program executes.


    **Member function** A function that is defined by a class and operates on objects
    of that class.


    **Memory** The circuitry that stores code and data in a computer.'
  merge: -1
  img_proc: true
