- pgno: 508
  md: '# # APPENDIX A


    # # C++ LANGUAGE CODING GUIDELINES


    # ## Introduction


    This coding style guide is a simplified version of one that has been used with
    good success both in industrial practice and for college courses. It lays down
    rules that you must follow for your programming assignments.


    A style guide is a set of mandatory requirements for layout and formatting. Uniform
    style makes it easier for you to read code from your instructor and classmates.
    You will really appreciate the consistency if you do a team project. It is also
    easier for your instructor and your grader to grasp the essence of your programs
    quickly.


    A style guide makes you a more productive programmer because it *reduces gratuitous
    choice*. If you don''t have to make choices about trivial matters, you can spend
    your energy on the solution of real problems.


    In these guidelines a number of constructs are plainly outlawed. That doesn''t
    mean that programmers using them are evil or incompetent. It does mean that the
    constructs are of marginal utility and can be expressed just as well or even better
    with other language constructs.


    If you have already programmed in C or C++, you may be initially uncomfortable
    about giving up some fond habits. However, it is a sign of professionalism to
    set aside personal preferences in minor matters and to compromise for the benefit
    of your group.


    These guidelines are necessarily somewhat long and dull. They also mention features
    that you may not yet have seen in class. Here are the most important highlights:


    +   - Tabs are set every three spaces.

    +   - Variable and function names are lowercase.

    +   - Constant names are uppercase. Class names start with an uppercase letter.

    +   - There are spaces after reserved words and between binary operators.

    +   - Braces must line up.

    +   - No magic numbers may be used.

    +   - Every function must have a comment.

    +   - At most 30 lines of code may be used per function.

    +   - No goto, continue, or break is allowed.

    +   - At most two global variables may be used per file.


    *A note to the instructor: Of course, many programmers and organizations have
    strong feelings about coding style. If this style guide is incompatible with your
    own preferences or with local custom, please feel free to modify it. For that
    purpose, this coding style guide is available in electronic form on the companion
    web site for this book.*'
  merge: -1
