  md: "+   19. What is displayed as the result of the following statements?\n\n```\n\
    ```cpp\nChoiceQuestion* p = new ChoiceQuestion();\np->set_text(\"What is the answer?\"\
    );\np->add_choice(\"42\", true);\np->add_choice(\"Something else\", false);\n\
    Question q = *p;\nq.display();\n```\n```\n\n+   20. Suppose check_answer was not\
    \ declared virtual in question.h. How would the behavior of test.cpp change?\n\
    \n**Practice It** Now you can try these exercises at the end of the chapter: R10.14,\
    \ R10.15, P10.11, P10.12.\n\n# Programming Tip 10.2\n\n# Don't Use Type Tags\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_489_0.png)\n\nSome programmers build\
    \ inheritance hierarchies in which each object has a tag that indicates its type,\
    \ commonly a string. They then query that string:\n\n```\n```cpp\nif (q->get_type()\
    \ == \"Question\")\n{\n   // Do something\n}\nelse if (q->get_type() == \"ChoiceQuestion\"\
    )\n{\n   // Do something else\n}\n```\n```\n\nThis is a poor strategy. If a new\
    \ class is added, then all these queries need to be revised. In contrast, consider\
    \ the addition of a class *NumericQuestion* to our quiz program. *Nothing* needs\
    \ to change in that program because it uses virtual functions, not type tags.\
    \ Whenever you find yourself adding a type tag to a hierarchy of classes, reconsider\
    \ and use virtual functions instead.\n\n# Common Error 10.4\n\n# Slicing an Object\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_489_1.png)\n\nIn C++ it is legal to\
    \ copy a derived-class object into a base-class variable. However, any derived-class\
    \ information is lost in the process. For example, when a Manager object is assigned\
    \ to a variable of type Employee, the result is only the employee portion of the\
    \ manager data:\n\n```\n```cpp\nManager m;\n\nEmployee e = m; // Holds only the\
