  md: '# 2.3 Input and Output


    # 2.3.1 Input


    In this section, you will see how to place user input into a variable. Consider
    for example the `volume1.cpp` program on page 36. Rather than assuming that the
    price for the two-liter bottle and the six-pack of cans are identical, we can
    ask the program user for the prices.


    When a program asks for user input, it should first print a message that tells
    the user which input is expected. Such a message is called a prompt.


    ```

    ```cpp

    cout << "Please enter the number of bottles: "; // Display prompt

    ```

    ```


    Do not add an endl after the prompt. You want the input to appear after the colon,
    not on the following line.


    Next, the program issues a command to read the input. The cin object reads input
    from the console window. You use the >> operator (sometimes called the extraction
    operator) to place an input value into a variable, like this:


    ```

    ```cpp

    int bottles;

    cin >> bottles;

    ```

    ```


    When the program executes the input statement, it waits for the user to provide
    input. The user also needs to hit the Enter key so that the program accepts the
    input. After the user supplies the input, the number is placed into the bottles
    variable, and the program continues.


    Note that in this code segment, there was no need to initialize the bottles variable
    because it is being filled by the very next statement. As a rule of thumb, you
    should initialize a variable when you declare it unless it is filled in an input
    statement that follows immediately.


    You can read more than one value in a single input statement:


    ```

    ```cpp

    cout << "Please enter the number of bottles and cans: ";

    cin >> bottles >> cans;

    ```

    ```


    The user can supply both inputs on the same line:


    ```

    Please enter the number of bottles and cans: 2 6

    ```


    Alternatively, the user can press the Enter key after each input:


    ```

    Please enter the number of bottles and cans: 2

    6

    ```


    > Use the >> operator to read a value and place it in a variable.


    # Syntax 2.3 Input Statement


