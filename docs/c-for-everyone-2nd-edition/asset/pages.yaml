    **R1.14** In order to estimate the cost of painting a house, a painter needs to
    know the surface area of the exterior. Develop an algorithm for computing that
    value. Your inputs are the width, length, and height of the house, the number
    of windows and doors, and their dimensions. (Assume the windows and doors have
