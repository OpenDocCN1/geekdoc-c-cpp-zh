    \ interest is deposited into the account. We must call the deposit member function\
    \ since we have no direct access to the balance data member. The minimum balance\
    \ is reset for the next month:\n\n```\n```cpp\nvoid SavingsAccount::month_end()\n\
    {\n    double interest = min_balance * interest_rate / 100;\n    deposit(interest);\n\
    \    min_balance = get_balance();\n}\n```\n```\n\nThe withdraw function of the\
    \ CheckingAccount class needs to check the withdrawal count. If there have been\
    \ too many withdrawals, a charge is applied. Again, note how the function invokes\
    \ the base-class function, using the BankAccount:: syntax:\n\n```\n```cpp\nvoid\
    \ CheckingAccount::withdraw(double amount)\n{\n    const int FREE_WITHDRAWALS\
    \ = 3;\n    const int WITHDRAWAL_FEE = 1;\n\n    BankAccount::withdraw(amount);\n\
    \    ++withdrawals;\n    if (withdrawals > FREE_WITHDRAWALS)\n    {\n        BankAccount::withdraw(WITHDRAWAL_FEE);\n\
    \    }\n}\n```\n```\n\nEnd of month processing for a checking account simply resets\
    \ the withdrawal count:\n\n```\n```cpp\nvoid CheckingAccount::month_end()\n{\n\
    \    withdrawals = 0;\n}\n```\n```\n\n# **Step 8** Allocate objects on the heap\
    \ and process them.\n\nFor polymorphism (that is, variation of behavior) to work\
    \ in C++, you need to call virtual functions through pointers. The easiest strategy\
