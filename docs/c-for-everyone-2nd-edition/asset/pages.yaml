  md: "# ### Special Topic 3.3\n\n# # The switch Statement\n\nA sequence of if statements\
    \ that compares a *single integer value* against several *constant alternatives*\
    \ can be implemented as a switch statement. For example,\n\n![](img/23fb3582e93ebc95909e1de029c3d388_120_0.png)\n\
    \n```\n    int digit;\n\n    switch (digit)\n    {\n       case 1: digit_name\
    \ = \"one\"; break;\n       case 2: digit_name = \"two\"; break;\n       case\
    \ 3: digit_name = \"three\"; break;\n       case 4: digit_name = \"four\"; break;\n\
    \       case 5: digit_name = \"five\"; break;\n       case 6: digit_name = \"\
    six\"; break;\n       case 7: digit_name = \"seven\"; break;\n       case 8: digit_name\
    \ = \"eight\"; break;\n       case 9: digit_name = \"nine\"; break;\n       default:\
    \ digit_name = \"\"; break;\n    }\n```\n\nThis is a shortcut for\n\n```\n   \
    \ int digit;\n    if (digit == 1) { digit_name = \"one\"; }\n    else if (digit\
    \ == 2) { digit_name = \"two\"; }\n    else if (digit == 3) { digit_name = \"\
    three\"; }\n    else if (digit == 4) { digit_name = \"four\"; }\n    else if (digit\
    \ == 5) { digit_name = \"five\"; }\n    else if (digit == 6) { digit_name = \"\
    six\"; }\n    else if (digit == 7) { digit_name = \"seven\"; }\n    else if (digit\
    \ == 8) { digit_name = \"eight\"; }\n    else if (digit == 9) { digit_name = \"\
    nine\"; }\n    else { digit_name = \"\"; }\n```\n\nWell, it isn't much of a shortcut,\
    \ but it has one advantage—it is obvious that all branches test the same value,\
    \ namely digit.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_120_1.png)\n\n*The\
    \ switch statement lets you choose from a fixed set of alternatives.*\n\nIt is\
    \ possible to have multiple case clauses for a branch, such as\n\n```\n    case\
    \ 1: case 3: case 5: case 7: case 9:\n        odd = true; break;\n```\n\nThe default\
    \ branch is chosen if none of the case clauses match.\n\nEvery branch of the switch\
    \ must be terminated by a break instruction. If the break is missing, execution\
    \ *falls through* to the next branch, and so on, until finally a break or the\
    \ end of the switch is reached. In practice, this fall-through behavior is rather\
    \ useful, but it is a common cause of error. If you accidentally forget the break\
    \ statement, your program compiles but executes unwanted code. Many programmers\
    \ consider the switch statement somewhat dangerous and prefer the if statement.\n\
    \nWe leave it to you to use the switch statement for your own code or not. At\
    \ any rate, you need to have a reading knowledge of switch in case you find it\
    \ in other programmers' code."
  merge: -1
  img_proc: true
