  md: "# Syntax 1.1 C++ Program\n\n![](img/23fb3582e93ebc95909e1de029c3d388_39_0.png)\n\
    \nEvery C++ program contains a function called main.\n\nThe next line,\n\nusing\
    \ namespace std;\n\ntells the compiler to use the “standard namespace.” Namespaces\
    \ are a mechanism for avoiding naming conflicts in large programs. You need not\
    \ be concerned about namespaces. For the programs that you will be writing in\
    \ this book, you will always use the standard namespace. Simply add using namespace\
    \ std; at the top of every program that you write, just below the #include directives.\n\
    \nThe construction\n\n```\nint main()\n{\n    ...\n    return 0;\n}\n```\n\ndefines\
    \ a function called main that “returns” an “integer” (that is, a whole number\
    \ without a fractional part, called int in C++) with value 0. This value indicates\
    \ that the program finished successfully. A function is a collection of programming\
    \ instructions that carry out a particular task. Every C++ program must have a\
    \ main function. Most C++ programs contain other functions besides main, but it\
    \ will take us until Chapter 5 to discuss functions and return values.\n\nFor\
    \ now, it is a good idea to consider all these parts as the plumbing that is necessary\
    \ to write a simple program. Simply place the code that you want to execute inside\
    \ the braces of the main function. (The basic structure of a C++ program is shown\
    \ in Syntax 1.1.)\n\nTo display values on the screen, you use an entity called\
    \ cout and the << operator (sometimes called the insertion operator). For example,\
    \ the statement\n\n```\ncout << 39 + 3;\n```\n\ndisplays the number 42.\n\nUse\
    \ cout and the << operator to display values on the screen."
