- pgno: 230
  md: "flag this as an error, or the function might return a random value. Protect\
    \ against this problem by returning *some* safe value:\n\n```\n    double cube_volume(double\
    \ side_length)\n    {\n        if (side_length >= 0)\n        {\n            return\
    \ side_length * side_length * side_length;\n        }\n        return 0;\n   \
    \ }\n```\n\nThe last statement of every function ought to be a return statement.\
    \ This ensures that *some* value gets returned when the function reaches the end.\n\
    \n# **Common Error 5.1**\n\n# **Missing Return Value**\n\n![](img/23fb3582e93ebc95909e1de029c3d388_230_0.png)\n\
    \nA function always needs to return something. If the code of the function contains\
    \ several branches, make sure that each one of them returns a value:\n\n```\n\
    \    int sign(double x)\n    {\n        if (x < 0) { return -1; }\n        if\
    \ (x > 0) { return 1; }\n        // Error: missing return value if x equals 0\n\
    \    }\n```\n\nThis function computes the sign of a number: -1 for negative numbers\
    \ and +1 for positive numbers. If the argument is zero, however, no value is returned.\
    \ Most compilers will issue a warning in this situation, but if you ignore the\
    \ warning and the function is ever called with an argument of 0, a *random quantity*\
    \ will be returned.\n\n# **Special Topic 5.1**\n\n# **Function Declarations**\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_230_1.png)\n\nIt is a compile-time\
    \ error to call a function that the compiler does not know, just as it is an error\
    \ to use an undefined variable. You can avoid this error if you define all functions\
    \ before they are first used. First define lower-level helper functions, then\
    \ the mid-level workhorse functions, and finally `main` in your program.\n\nSome\
    \ programmers prefer to list the `main` function first in their programs. If you\
    \ share that preference, you need to learn how to declare the other functions\
    \ at the top of the program. A declaration of a function lists the return type,\
    \ function name, and parameter variables, but it contains no body:\n\n```\n  \
    \  double cube_volume(double side_length);\n```\n\nThis is an advertisement that\
    \ promises that the function is implemented elsewhere. It is easy to distinguish\
    \ declarations from definitions: Declarations end in a semicolon, whereas definitions\
    \ are followed by a { . . . } block. Declarations are also called *prototypes*.\n\
    \nIn a function prototype, the names of the parameters are optional. You could\
    \ also write\n\n```\n    double cube_volume(double);\n```\n\nHowever, it is a\
    \ good idea to include parameter names in order to document the purpose of each\
    \ parameter.\n\nThe declarations of common functions such as `pow` are contained\
    \ in header files. If you have a look inside `<cmath>`, you will find the declaration\
    \ of `pow` and the other math functions."
