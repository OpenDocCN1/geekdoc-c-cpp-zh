  md: '# Common Error 2.5


    # Forgetting Header Files


    Every program that carries out input or output needs the `<iostream>` header.
    If you use mathematical functions such as `sqrt`, you need to include `<cmath>`.
    If you forget to include the appropriate header file, the compiler will not know
    symbols such as `abs` or `sqrt`. If the compiler complains about an undefined
    function or symbol, check your header files.


    Sometimes you may not know which header file to include. Suppose you want to compute
    the absolute value of an integer using the `abs` function. As it happens, this
    version of `abs` is not defined in the `<cmath>` header but in `<cstdlib>`. How
    can you find the correct header file? You need to locate the documentation of
    the `abs` function, preferably using the online help of your development environment
    or a reference site on the Internet such as http://www.cplusplus.com (see Figure
    3). The documentation includes a short description of the function and the name
    of the header file that you must include.


    ![](img/23fb3582e93ebc95909e1de029c3d388_72_0.png)


    **Figure 3**  Online Documentation


    # Common Error 2.6


    # Roundoff Errors


    Roundoff errors are a fact of life when calculating with floating-point numbers.
    You probably have encountered that phenomenon yourself with manual calculations.
    If you calculate 1/3 to two decimal places, you get 0.33. Multiplying again by
    3, you obtain 0.99, not 1.00.


    In the processor hardware, numbers are represented in the binary number system,
    not in decimal. You still get roundoff errors when binary digits are lost. They
    just may crop up at different places than you might expect. Here is an example.


    ```

    ```cpp

    #include <iostream>


    using namespace std;

    ```

    ```'
