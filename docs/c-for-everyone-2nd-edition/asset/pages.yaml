  md: "This command prints the value `price_per_ounce` in a field of width 8, for\
    \ example\n\n```\n    0.04\n```\n\n(where each ■ represents a space).\nThere is\
    \ a notable difference between the `setprecision` and `setw` manipulators. Once\
    \ you set the precision, that value is used for all floating-point numbers. But\
    \ the width affects only the *next* value. Subsequent values are formatted without\
    \ added spaces.\n\nOur next example program will prompt for the price of a six-pack\
    \ and the volume of each can, then print out the price per ounce. The program\
    \ puts to work what you just learned about reading input and formatting output.\n\
    \n# ch02/volume2.cpp\n\n```\n```cpp\n#include <iostream>\n#include <iomanip>\n\
    \nusing namespace std;\n\nint main()\n{\n    // Read price per pack\n\n    cout\
    \ << \"Please enter the price for a six-pack: \";\n    double pack_price;\n  \
    \  cin >> pack_price;\n\n    // Read can volume\n\n    cout << \"Please enter\
    \ the volume for each can (in ounces): \";\n    double can_volume;\n    cin >>\
    \ can_volume;\n\n    // Compute pack volume\n\n    const double CANS_PER_PACK\
    \ = 6;\n    double pack_volume = can_volume * CANS_PER_PACK;\n\n    // Compute\
    \ and print price per ounce\n\n    double price_per_ounce = pack_price / pack_volume;\n\
    \n    cout << fixed << setprecision(2);\n    cout << \"Price per ounce: \" <<\
    \ price_per_ounce << endl;\n\n    return 0;\n}\n```\n```\n\n# Program Run\n\n\
    ```\nPlease enter the price for a six-pack: 2.95\nPlease enter the volume for\
    \ each can (in ounces): 12\nPrice per ounce: 0.04\n```"
