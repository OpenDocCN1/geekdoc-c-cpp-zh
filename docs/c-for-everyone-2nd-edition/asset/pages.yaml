  md: "We still don't have a match because 15 ≠ 17, and we cannot divide the subsequence\
    \ further. If we wanted to insert 15 into the sequence, we would need to insert\
    \ it just before values[5].\n\nThis search process is called a binary search,\
    \ because we cut the size of the search in half in each step. That cutting in\
    \ half works only because we know that the sequence of values is sorted. Here\
    \ is an implementation in C++:\n\n```\n```cpp\nbool found = false;\nint low =\
    \ 0;\nint high = size - 1;\nint pos = 0;\nwhile (low <= high && !found)\n{\n \
    \   pos = (low + high) / 2; // Midpoint of the subsequence\n    if (values[pos]\
    \ == searched_value) { found = true; }\n    else if (values[pos] < searched_value)\
    \ { low = pos + 1; } // Look in second half\n    else { high = pos - 1; } // Look\
    \ in first half\n}\nif (found) { cout << \"Found at position \" << pos; }\nelse\
    \ { cout << \"Not found. Insert before position \" << pos; }\n```\n```\n\n# 6.3\
    \ Arrays and Functions\n\n> > When passing an array to a function, also pass the\
    \ size of the array.\n\nIn this section, we will explore how to write functions\
    \ that process arrays.\n\nA function that processes the values in an array needs\
    \ to know the number of valid elements in the array. For example, here is a sum\
    \ function that computes the sum of all elements in the array:\n\n```\n```cpp\n\
    double sum(double values[], int size)\n{\n    double total = 0;\n    for (int\
    \ i = 0; i < size; i++)\n    {\n        total = total + values[i];\n    }\n  \
    \  return total;\n}\n```\n```\n\nNote the special syntax for array parameter variables.\
    \ When writing an array parameter variable, you place an empty [] behind the parameter\
    \ name. Do not specify the size of the array inside the brackets.\n\nWhen you\
    \ call the function, supply both the name of the array and the size. For example,\n\
    \n```\n```cpp\ndouble NUMBER_OF_SCORES = 10;\ndouble scores[NUMBER_OF_SCORES]\n\
    \    = { 32, 54, 67.5, 29, 34.5, 80, 115, 44.5, 100, 65 };\ndouble total_score\
    \ = sum(scores, NUMBER_OF_SCORES);\n```\n```\n\nYou can also pass a smaller size\
    \ to the function:\n\n```\n```cpp\ndouble partial_score = sum(scores, 5);\n```\n\
    ```\n\nThis call computes the sum of the first five elements of the scores array.\
    \ Remember, the function has no way of knowing how many elements the array has.\
    \ It simply relies on the size that the caller provides."
