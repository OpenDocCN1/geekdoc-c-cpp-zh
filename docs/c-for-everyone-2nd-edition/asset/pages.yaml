- pgno: 66
  md: 'In addition to the int type, C++ has integer types short, long, and long long.
    For each integer type, there is an unsigned equivalent. For example, the short
    type typically has a range from −32,768 to 32,767, whereas unsigned short has
    a range from 0 to 65,535. These strange-looking limits are the result of the use
    of binary numbers in computers. A short value uses 16 binary digits, which can
    encode 2¹⁶ = 65,536 values. Keep in mind that the ranges for integer types are
    not standardized, and they differ among compilers. Table 4 contains typical values.


    # Special Topic 2.2


    ![](img/23fb3582e93ebc95909e1de029c3d388_66_0.png)


    # Numeric Ranges and Precisions


    Because numbers are represented in the computer with a limited number of digits,
    they cannot represent arbitrary integer or floating-point numbers.


    The int type has a limited range: On most platforms, it can represent numbers
    up to a little more than two billion. For many applications, this is not a problem,
    but you cannot use an int to represent the world population.


    If a computation yields a value that is outside the int range, the result overflows.
    No error is displayed. Instead, the result is truncated to fit into an int, yielding
    a useless value. For example,


    ```

    int one_billion = 1000000000;

    cout << 3 * one_billion << endl;

    ```


    displays −1294967296.


    In situations such as this, you can switch to double values. However, read Common
    Error 2.6 on page 45 for more information about a related issue: roundoff errors.


    # Programming Tip 2.2


    ![](img/23fb3582e93ebc95909e1de029c3d388_66_1.png)


    # Do Not Use Magic Numbers


    A magic number is a numeric constant that appears in your code without explanation.
    For example,


    ```

    total_volume = bottles * 2;

    ```


    Why 2? Are bottles twice as voluminous as cans? No, the reason is that every bottle
    contains 2 liters. Use a named constant to make the code self-documenting:


    ```

    const double BOTTLE_VOLUME = 2;

    total_volume = bottles * BOTTLE_VOLUME;

    ```


    There is another reason for using named constants. Suppose circumstances change,
    and the bottle volume is now 1.5 liters. If you used a named constant, you make
    a single change, and you are done. Otherwise, you have to look at every value
    of 2 in your program and ponder whether it means a bottle volume, or something
    else. In a program that is more than a few pages long, that is incredibly tedious
    and error-prone.


    Even the most reasonable cosmic constant is going to change one day. You think
    there are seven days per week? Your customers on Mars are going to be pretty unhappy
    about your silly prejudice. Make a constant.


    ```

    const int DAYS_PER_WEEK = 7;

    ```


    ![](img/23fb3582e93ebc95909e1de029c3d388_66_2.png)'
