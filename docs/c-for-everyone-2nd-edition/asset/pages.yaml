- pgno: 425
  md: "# 9.4.1 Implementing Member Functions\n\nHere is the implementation of the\
    \ add_item function of the CashRegister class.\n\n```\nvoid CashRegister::add_item(double\
    \ price)\n{\n    item_count++;\n    total_price = total_price + price;\n}\n```\n\
    \nThe CashRegister:: prefix makes it clear that we are defining the add_item function\
    \ of the CashRegister class. In C++ it is perfectly legal to have add_item functions\
    \ in other classes as well, and it is important to specify exactly which add_item\
    \ function we are defining. (See Syntax 9.2 on page 400.) You use the ClassName::add_item\
    \ syntax only when defining the function, not when calling it. When you call the\
    \ add_item member function, the call has the form object.add_item(...).\n\nUse\
    \ the ClassName:: prefix when defining member functions.\n\nWhen defining an accessor\
    \ member function, supply the reserved word const following the closing parenthesis\
    \ of the parameter list. Here is the get_count member function:\n\n```\nint CashRegister::get_count()\
    \ const\n{\n    return item_count;\n}\n```\n\nYou will find the other member functions\
    \ with the example program at the end of this section.\n\n# 9.4.2 Implicit and\
    \ Explicit Parameters\n\nWhenever you refer to a data member, such as item_count\
    \ or total_price, in a member function, it denotes the data member of the object\
    \ on which the member function was invoked. For example, consider the call\n\n\
    ```\nregister1.add_item(1.95);\n```\n\nThe first statement in the CashRegister::add_item\
    \ function is\n\n```\nitem_count++;\n```\n\nWhich item_count is incremented? In\
    \ this call, it is the item_count of the register1 object. (See Figure 3.)\n\n\
    ![](img/23fb3582e93ebc95909e1de029c3d388_425_0.png)\n\nWhen an item is added,\
    \ it affects the data members of the cash register object on which the function\
    \ is invoked."
