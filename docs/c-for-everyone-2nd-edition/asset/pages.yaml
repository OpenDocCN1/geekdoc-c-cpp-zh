    \nA very common task is to implement a class whose objects can carry out a set\
    \ of specified actions. This How To walks you through the necessary steps.\n\n\
    As an example, consider a class Menu. An object of this class can display a menu\
    \ such as\n\n+   1) Open new account\n+   2) Log into existing account\n+   3)\
    \ Help\n+   4) Quit\n\n![](img/23fb3582e93ebc95909e1de029c3d388_436_2.png)\n\n\
    Then the menu waits for the user to supply a value. If the user does not supply\
    \ a valid value, the menu is redisplayed, and the user can try again.\n\n# ##\
    \ Step 1  Get an informal list of the responsibilities of your objects.\n\nBe\
    \ careful that you restrict yourself to features that are actually required in\
    \ the problem. With real-world items, such as cash registers or bank accounts,\
    \ there are potentially dozens of features that might be worth implementing. However,\
    \ your job is not to faithfully model the real world. You need to determine only\
    \ those responsibilities that you need for solving your specific problem.\n\n\
    In the case of the menu, you need to\n\n+   - **Display the menu.**\n+   - **Get\
    \ user input.**\n\nNow look for hidden responsibilities that aren’t part of the\
    \ problem description. How do objects get created? Which mundane activities need\
    \ to happen, such as clearing the cash register at the beginning of each sale?\n\
    \nIn the menu example, consider how a menu is produced. The programmer creates\
    \ an empty menu object and then adds options “Open new account”, “Help”, and so\
    \ on. There is a hidden responsibility:\n\n+   - **Add an option.**\n\n# ## Step\
    \ 2  Specify the public interface.\n\nTurn the list in Step 1 into a set of member\
    \ functions, with specific types for the parameter variables and the return values.\
    \ Be sure to mark accessors as const. Many programmers find"
