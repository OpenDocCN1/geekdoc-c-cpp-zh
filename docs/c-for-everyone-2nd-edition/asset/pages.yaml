  md: "If you omit the length, you get all characters from the given position to the\
    \ end of the string. For example, `greeting.substr(7)` is the string `\"world!\"\
    ` (including the exclamation mark).\n\nHere is a simple program that puts these\
    \ concepts to work. The program asks for your name and that of your significant\
    \ other. It then prints out your initials. The operation `first.substr(0, 1)`\
    \ makes a string consisting of one character, taken from the start of `first`.\
    \ The program does the same for the second. Then it concatenates the resulting\
    \ one-character strings with the string literal `\"&\"` to get a string of length\
    \ 3, the initials string. (See Figure 4.)\n\n![](img/23fb3582e93ebc95909e1de029c3d388_86_0.png)\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_86_1.png)\n\n**Figure 4** Building\
    \ the initials String\n\n*Initials are formed from the first letter of each name.*\n\
    \n# ch02/initials.cpp\n\n```\n```cpp\n#include <iostream>\n#include <string>\n\
    \nusing namespace std;\n\nint main()\n{\n   cout << \"Enter your first name: \"\
    ;\n   string first;\n   cin >> first;\n   cout << \"Enter your significant other's\
    \ first name: \";\n   string second;\n   cin >> second;\n   string initials =\
    \ first.substr(0, 1)\n       + \"&\" + second.substr(0, 1);\n   cout << initials\
    \ << endl;\n\n   return 0;\n}\n```\n```\n\n# Program Run\n\n```\n```text\nEnter\
