    # ## Random Fact 10.1 The Limits of Computation


    ![](img/23fb3582e93ebc95909e1de029c3d388_496_2.png)


    Have you ever wondered how your instructor or grader makes sure your programming
    homework is correct? In all likelihood, they look at your solution and perhaps
    run it with some test inputs. But usually they have a correct solution available.
    That suggests that there might be an easier way. Perhaps they could feed your
    program and their correct program into a "program comparator," a computer program
    that analyzes both programs and determines whether they both compute the same
    results. Of course, your solution and the program that is known to be correct
    need not be identical—what matters is that they produce the same output when given
    the same input.


    How could such a program comparator work? Well, the C++ compiler knows how to
    read a program and make sense of the classes, functions, and statements. So it
    seems plausible that someone could, with some effort, write a program that reads
    two C++ programs, analyzes what they do, and determines whether they solve the
    same task. Of course, such a program would be very attractive to instructors,
    because it could automate the grading process. Thus, even though no such program
    exists today, it might be tempting to try to develop one and sell it to universities
    around the world.


    However, before you start raising venture capital for such an effort, you should
    know that theoretical computer scientists have proven that it is impossible to
    develop such a program, no matter how hard you try.


    There are quite a few of these unsolvable problems. The first one, called the
    halting problem, was dis-


    covered by the British researcher Alan Turing in 1936. Because his research occurred
    before the first actual computer was constructed, Turing had to devise a theoretical
    device, the Turing machine, to explain how computers could work. The Turing machine
    consists of a long magnetic tape, a read/write head, and a program that has numbered
    instructions of the form: "If the current symbol under the head is x, then replace
    it with y, move the head one unit left or right, and continue with instruction
    n" (see figure on the next page). Interestingly enough, with just these instructions,
    you can program just as much as with C++, even though it is incredibly tedious
    to do so. Theoretical computer scientists like Turing machines because they can
    be described using nothing more than the laws of mathematics.


    ![](img/23fb3582e93ebc95909e1de029c3d388_496_3.png)


    Alan Turing


    Expressed in terms of C++, the halting problem states: "It is impossible to write
    a program with two inputs, namely the source code of an arbitrary C++ program
    P and a string I, that decides whether the program P,"


    when executed with the input I, will halt without getting into an infinite loop."
    Of course, for some kinds of programs and inputs, it is possible to decide whether
    the programs halt with the given input. The halting problem asserts that it is
    impossible to come up with a single decision-making algorithm that works with
    all programs and inputs. Note that you can''t simply run the program P on the
    input I to settle this question. If the program runs for 1,000 days, you don''t
    know that the program is in an infinite loop. Maybe you just have to wait another
    day for it to stop.


    Such a "halt checker," if it could be written, might also be useful for grading
    homework. An instructor could use it to screen student submissions to see if they
    get into an infinite loop with a particular input, and then not check them any
    further. However, as Turing demonstrated, such a program cannot be written. His
    argument is ingenious and quite simple.


    Suppose a "halt checker" program existed. Let''s call it H. From H, we will develop
    another program, the "killer" program K. K does the following computation. Its
    input is a string containing the source code for a program R. It then applies
    the halting checker on the input program R and the input string R. That is, it
    checks whether the program R halts if its input is its own source code. It sounds
    bizarre to feed a program to itself, but it isn''t impossible. For example, the
    C++ compiler is written in C++, and you can use it to compile itself. Or, as a
    simpler example, you can use a word count program to count the words in its own
    source code. (continued)'
