    \ can be passed to this function.\n+   4. Consider the function do_something(Car&\
    \ c). List all vehicle classes from Figure 1 whose objects cannot be passed to\
    \ this function.\n+   5. Should a class Quiz inherit from the class Question?\
    \ Why or why not?\n\n**Practice It** Now you can try these exercises at the end\
    \ of the chapter: R10.1, R10.2, R10.5.\n\n# ## 10.2 Implementing Derived Classes\n\
    \nIn C++, you form a derived class from a base class by specifying what makes\
    \ the derived class different. You define the member functions that are new to\
    \ the derived class. The derived class inherits all member functions from the\
    \ base class, but you can change the implementation if the inherited behavior\
    \ is not appropriate.\n\nThe derived class automatically inherits all data members\
    \ from the base class. You only define the added data members.\n\nHere is the\
    \ syntax for the definition of a derived class:\n\n```\n~~~cpp\nclass ChoiceQuestion\
    \ : public Question\n{\npublic:\n   New and changed member functions\nprivate:\n\
    \   Additional data members\n};\n~~~\n```"
