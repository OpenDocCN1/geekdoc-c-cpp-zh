    \ the next sale, either by emptying the array of prices or by setting the total\
    \ and count to zero.\n\nWe have now discovered two different ways of representing\
    \ the data that the object needs. Either of them will work, and we have to make\
    \ a choice. We will choose the simpler one: variables for the total price and\
    \ the item count. (Other options are explored in Exercises P9.3 and P9.4.)\n\n\
    > > Every object has its own set of data members.\n\nThe data members are defined\
    \ in the private section of the class definition:\n\n```\n~~~cpp\nclass CashRegister\n\
    {\npublic:\n   // See Section 9.2\nprivate:\n   int item_count;\n   double total_price;\n\
    };\n~~~\n```\n\nEvery CashRegister object has a separate copy of these data members\
    \ (see Figure 2).\n\nBecause the data members are defined to be private, only\
    \ the member functions of the class can access them. Programmers using the CashRegister\
    \ class cannot access the data members directly:\n\n```\n~~~cpp\nint main()\n\
    {\n   ...\n   cout << register1.item_count; // Error—use get_count() instead\n\
    \   ...\n}\n~~~\n```\n\n> > Private data members can only be accessed by member\
    \ functions of the same class.\n\nAll data access must occur through the public\
    \ interface. Thus, the data members of an object are effectively hidden from the\
    \ programmer using the class. While it is theoretically possible in C++ to leave\
    \ data members unencapsulated (by placing them into the public section), this\
    \ is very uncommon in practice. We will always make all data members private in\
    \ this book.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_423_0.png)\n\nFigure\
    \ 2\nData Members of CashRegister Objects"
