    You never want to write such an expression; see Common Error 3.5 on page 107.
    |

    | 0 < x && x < 100 \|\| x == -1 | (0 < x && x < 100) \|\| x == -1 | The && operator
    has a higher precedence than the \|\| operator. |

    | !(0 < 200) | false | 0 < 200 is true, therefore its negation is false. |

    | frozen == true | frozen | There is no need to compare a Boolean variable with
