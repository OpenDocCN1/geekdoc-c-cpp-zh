  md: '![](img/23fb3582e93ebc95909e1de029c3d388_417_0.png)


    This chapter introduces you to object-oriented programming, an important technique
    for writing complex programs. In an object-oriented program, you don''t simply
    manipulate numbers and strings, but you work with objects that are meaningful
    for your application. Objects with the same behavior (such as the windmills to
    the left) are grouped into classes. A programmer provides the desired behavior
    by specifying and implementing functions for these classes. In this chapter, you
    will learn how to discover, specify, and implement your own classes, and how to
    use them in your programs.


    # # 9.1 Object-Oriented Programming


    You have learned how to structure your programs by decomposing tasks into functions.
    This is an excellent practice, but experience shows that it does not go far enough.
    As programs get larger, it becomes increasingly difficult to maintain a large
    collection of functions.


    To overcome this problem, computer scientists invented object-oriented programming,
    a programming style in which tasks are solved by collaborating objects. Each object
    has its own set of data, together with a set of functions that can act upon the
    data. (These functions are called member functions).


    You have already experienced the object-oriented programming style when you used
    string objects or streams such as cin and cout. For example, you use the length
    and substr member functions to work with string objects. The >> and << operators
    that you use with streams are also implemented as member functions—see Special
    Topic 9.2 on page 406.


    > > A class describes a set of objects with the same behavior.


    In C++, a programmer doesn''t implement a single object. Instead, the programmer
    provides a class. A class describes a set of objects with the same behavior. For
    example, the string class describes the behavior of all strings. The class specifies
    how a string stores its characters, which member functions can be used with strings,
    and how the member functions are implemented.


    ![](img/23fb3582e93ebc95909e1de029c3d388_417_1.png)


    A class describes a set of objects with the same behavior. For example, a Car
    class describes all passenger vehicles that have a certain capacity and shape.'
