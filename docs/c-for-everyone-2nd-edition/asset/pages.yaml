  md: "# 6.6.3 Computing Row and Column Totals\n\nA common task is to compute row\
    \ or column totals. In our example, the row totals give us the total number of\
    \ medals won by a particular country.\nFinding the right index values is a bit\
    \ tricky, and it is a good idea to make a quick sketch. To compute the total of\
    \ row i, we need to visit the following elements:\n\n![](img/23fb3582e93ebc95909e1de029c3d388_307_0.png)\n\
    \nAs you can see, we need to compute the sum of counts[i][j], where j ranges from\
    \ 0 to MEDALS - 1. The following loop computes the total:\n\n```\n```java\nint\
    \ total = 0;\nfor (int j = 0; j < MEDALS; j++)\n{\n    total = total + counts[i][j];\n\
    }\n```\n```\n\nComputing column totals is similar. Form the sum of counts[i][j],\
    \ where i ranges from 0 to COUNTRIES - 1.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_307_1.png)\n\
    \n```\n```java\nint total = 0;\nfor (int i = 0; i < COUNTRIES; i++)\n{\n    total\
    \ = total + counts[i][j];\n}\n```\n```"
