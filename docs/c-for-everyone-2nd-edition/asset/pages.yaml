    \n# Avoid Global Variables\n\nThere are a few cases where global variables are\
    \ required (such as cin and cout), but they are quite rare. Programs with global\
    \ variables are difficult to maintain and extend because you can no longer view\
    \ each function as a “black box” that simply receives arguments and returns a\
    \ result. When functions modify global variables, it becomes more difficult to\
    \ understand the effect of function calls. As programs get larger, this difficulty\
    \ mounts quickly. Instead of using global variables, use function parameters to\
    \ transfer information from one part of a program to another.\n\n# 5.9 Reference\
    \ Parameters\n\nIf you want to write a function that changes the value of an argument,\
    \ you must use a **reference parameter** in order to allow the change. We first\
    \ explain why a different parameter type is necessary, then we show you the syntax\
    \ for reference parameters.\n\nConsider a function that simulates withdrawing\
    \ a given amount of money from a bank account, provided that sufficient funds\
    \ are available. If the amount of money is insufficient, a $10 penalty is deducted\
    \ instead. The function would be used as follows:\n\n```\n    double harrys_account\
    \ = 1000;\n    withdraw(harrys_account, 100); // Now harrys_account is 900\n \
    \   withdraw(harrys_account, 1000); // Insufficient funds. Now harrys_account\
    \ is 890\n```"
