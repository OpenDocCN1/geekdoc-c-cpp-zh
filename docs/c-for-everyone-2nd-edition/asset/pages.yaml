    \n# **Draw flowcharts for visualizing the control flow of a program.**\n\n+  \
    \ - Flow charts are made up of elements for tasks, input/outputs, and decisions.\n\
    +   - Each branch of a decision can contain tasks and further decisions.\n+  \
    \ - Never point an arrow inside another branch.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_141_1.png)\n\
    \n# **Design test cases for your programs.**\n\n+   - Each branch of your program\
    \ should be covered by a test case.\n+   - It is a good idea to design test cases\
    \ before implementing a program.\n\n# **Use the Boolean data type to store and\
    \ combine conditions that can be true or false.**\n\n+   - The Boolean type `bool`\
    \ has two values, false and true.\n+   - C++ has two Boolean operators that combine\
    \ conditions: `&&` (and) and `||` (or).\n+   - To invert a condition, use the\
    \ `!` (not) operator.\n+   - The `&&` and `||` operators are computed using *short-circuit\
    \ evaluation*: As soon as the truth value is determined, no further conditions\
