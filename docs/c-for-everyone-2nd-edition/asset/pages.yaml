  md: "# Step 3\n\nGive pseudocode for the work (if any) that needs to be done when\
    \ the condition is not true.\n\nWhat do you want to do in the case that the condition\
    \ of Step 1 is not fulfilled? Sometimes, you want to do nothing at all. In that\
    \ case, use an if statement without an else branch.\n\nIn our example, the condition\
    \ tested whether the price was less than $128. If that condition is not true,\
    \ the price is at least $128, so the higher discount of 16 percent applies to\
    \ the sale:\n\n```\ndiscounted price = 0.84 x original price\n```\n\n# Step 4\
    \ Double-check relational operators.\n\nFirst, be sure that the test goes in the\
    \ right direction. It is a common error to confuse > and <. Next, consider whether\
    \ you should use the < operator or its close cousin, the <= operator.\n\nWhat\
    \ should happen if the original price is exactly $128? Reading the problem carefully,\
    \ we find that the lower discount applies if the original price is less than $128,\
    \ and the higher discount applies when it is at least $128. A price of $128 should\
    \ therefore not fulfill our condition, and we must use <, not <=.\n\n# Step 5\
    \ Remove duplication.\n\nCheck which actions are common to both branches, and\
    \ move them outside. (See Programming Tip 3.4 on page 82.)\n\nIn our example,\
    \ we have two statements of the form\n\n```\ndiscounted price = ____ x original\
    \ price\n```\n\nThey only differ in the discount rate. It is best to just set\
    \ the rate in the branches, and to do the computation afterwards:\n\n```\nIf original\
    \ price < 128\n    discount rate = 0.92\nElse\n    discount rate = 0.84\ndiscounted\
    \ price = discount rate x original price\n```\n\n# Step 6 Test both branches.\n\
    \nFormulate two test cases, one that fulfills the condition of the if statement,\
    \ and one that does not. Ask yourself what should happen in each case. Then follow\
    \ the pseudocode and act each of them out.\n\nIn our example, let us consider\
    \ two scenarios for the original price: $100 and $200. We expect that the first\
    \ price is discounted by $8, the second by $32.\n\nWhen the original price is\
    \ 100, then the condition 100 < 128 is true, and we get\n\n```\ndiscount rate\
    \ = 0.92\ndiscounted price = 0.92 x 100 = 92\n```\n\nWhen the original price is\
    \ 200, then the condition 200 < 128 is false, and\n\n```\ndiscount rate = 0.84\n\
    discounted price = 0.84 x 200 = 168\n```\n\nIn both cases, we get the expected\
    \ answer.\n\n# Step 7 Assemble the if statement in C++.\n\nType the skeleton\n\
    \n```\nif ()\n{\n}\nelse\n{\n}\n```"
  merge: -1
