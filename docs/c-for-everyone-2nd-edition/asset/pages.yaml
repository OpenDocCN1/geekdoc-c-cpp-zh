  md: "# HOW TO 8.1\n\n# Processing Text Files\n\n![](img/23fb3582e93ebc95909e1de029c3d388_396_0.png)\n\
    \nProcessing text files that contain real data can be surprisingly challenging.\
    \ This How To gives you step-by-step guidance.\n\nAs an example, we will consider\
    \ this task:\nRead two country data files, worldpop.txt and worldarea.txt (supplied\
    \ with the book’s companion code). Both files contain the same countries in the\
    \ same order. Write a file worldpop_density.txt that contains country names and\
    \ population densities (people per square km), with the country names aligned\
    \ left and the numbers aligned right:\n\n```\nAfghanistan                    \
    \     50.56\nAkrotiri                            127.64\nAlbania             \
    \                125.91\nAlgeria                              14.18\nAmerican\
    \ Samoa                     288.92\n. . .\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_396_1.png)\n\
    \n*Singapore is one of the most densely populated countries in the world.*\n\n\
    # Step 1\n\nUnderstand the processing task.\n\nAs always, you need to have a clear\
    \ understanding of the task before designing a solution. Can you carry out the\
    \ task by hand (perhaps with smaller input files)? If not, get more information\
    \ about the problem.\n\nThe following pseudocode describes our processing task:\n\
    \n```\nWhile there are more lines to be read\n    Read a line from each file.\n\
    \    Extract the country name.\n    population = number following the country\
    \ name in the first line\n    area = number following the country name in the\
    \ second line\n    If area != 0\n        density = population / area\n    Print\
    \ country name and density.\n```\n\n# Step 2\n\nDetermine which files you need\
    \ to read and write.\n\nThis should be clear from the problem. In our example,\
    \ there are two input files, the population data and the area data, and one output\
    \ file.\n\n# Step 3\n\nChoose a method for obtaining the file names.\n\nThere\
    \ are three options:\n\n+   - Hard-coding the file names (such as \"worldpop.txt\"\
    )\n+   - Asking the user:\n+   - Using command-line arguments for the file names\n\
    \n```\ncout << \"Enter filename: \";\ncin >> filename;\nin_file.open(filename.c_str());\n\
    ```\n\nIn our example, we use hard-coded file names for simplicity.\n\n# Step\
    \ 4\n\nChoose between line, word, and character-based input.\n\nAs a rule of thumb,\
    \ read lines if the input data is grouped by lines. That is the case with tabular\
    \ data, as in our example, or when you need to report line numbers."
