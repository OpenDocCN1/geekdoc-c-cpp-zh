  md: "_To find the height of the tallest bus rider, remember the largest value so\
    \ far, and update it whenever you see a taller one._\n\n![](img/23fb3582e93ebc95909e1de029c3d388_187_0.png)\n\
    \nTo compute the smallest value, simply reverse the comparison:\n\n```\n```cpp\n\
    double smallest;\ncin >> smallest;\ndouble input;\nwhile (cin >> input)\n{\n \
    \   if (input < smallest)\n    {\n        smallest = input;\n    }\n}\n```\n```\n\
    \n# 4.7.5 Comparing Adjacent Values\n\nWhen processing a sequence of values in\
    \ a loop, you sometimes need to compare a value with the value that just preceded\
    \ it. For example, suppose you want to check whether a sequence of inputs contains\
    \ adjacent duplicates such as 1 7 2 9 9 4 9. Now you face a challenge. Consider\
    \ the typical loop for reading a value:\n\n```\n```cpp\ndouble input;\nwhile (cin\
    \ >> input)\n{\n    // Now input contains the current input\n    ...\n}\n```\n\
    ```\n\nTo compare adjacent inputs, store the preceding input in a variable.\n\n\
    How can you compare the current input with the preceding one? At any time, input\
    \ contains the current input, overwriting the previous one. The answer is to store\
    \ the previous input, like this:\n\n```\n```cpp\ndouble input;\ndouble previous;\n\
    while (cin >> input)\n{\n    if (input == previous) { cout << \"Duplicate input\"\
    \ << endl; }\n    previous = input;\n}\n```\n```"
