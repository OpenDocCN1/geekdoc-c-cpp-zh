    \ Sorting Algorithm\n\n![](img/23fb3582e93ebc95909e1de029c3d388_290_1.png)\n\n\
    A *sorting algorithm* rearranges the elements of a sequence so that they are stored\
    \ in sorted order. Here is a simple sorting algorithm, called **selection sort**.\
    \ Consider sorting the following array values:\n\n![](img/23fb3582e93ebc95909e1de029c3d388_290_2.png)\n\
    \nAn obvious first step is to find the smallest element. In this case the smallest\
    \ element is 5, stored in values[3]. You should move the 5 to the beginning of\
    \ the array. Of course, there is already an element stored in values[0], namely\
    \ 11. Therefore you cannot simply move values[3] into values[0] without moving\
    \ the 11 somewhere else. You don’t know where the 11 should end up, but you know\
    \ for certain that it should not be in values[0]. Simply get it out of the way\
    \ by swapping it with values[3]:\n\n![](img/23fb3582e93ebc95909e1de029c3d388_290_3.png)\n\
    \nNow the first element is in the correct place. In the foregoing figure, the\
    \ darker color indicates the portion of the array that is already sorted.\n\n\
    Next take the minimum of the remaining entries values[1] . . . values[4]. That\
    \ minimum value, 9, is already in the correct place. You don’t need to do anything\
    \ in this case, simply extend the sorted area by one to the right:\n\n![](img/23fb3582e93ebc95909e1de029c3d388_290_4.png)\n\
    \nRepeat the process. The minimum value of the unsorted region is 11, which needs\
