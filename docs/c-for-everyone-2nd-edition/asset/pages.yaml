  md: '# ## 2.2 Arithmetic


    In the following sections, you will learn how to carry out arithmetic and mathematical
    calculations in C++.


    # ### 2.2.1 Arithmetic Operators


    ![](img/23fb3582e93ebc95909e1de029c3d388_67_0.png)


    C++ supports the same four basic arithmetic operations as a calculator—addition,
    subtraction, multiplication, and division—but it uses different symbols for multiplication
    and division.


    You must write `a * b` to denote multiplication. Unlike in mathematics, you cannot
    write `a · b`, `a . b` or `a × b`. Similarly, division is always indicated with
    a `/`, never a `÷` or a fraction bar.


    For example, `\frac{a+b}{2}` becomes `(a + b) / 2`.


    Parentheses are used just as in algebra: to indicate in which order the subexpressions
    should be computed. For example, in the expression `(a + b) / 2`, the sum `a +
    b` is computed first, and then the sum is divided by 2. In contrast, in the expression


    ```text

    a + b / 2

    ```


    only `b` is divided by 2, and then the sum of `a` and `b / 2` is formed. Just
    as in regular algebraic notation, multiplication and division have a *higher precedence*
    than addition and subtraction. For example, in the expression `a + b / 2`, the
    `/` is carried out first, even though the `+` operation occurs further to the
    left. If both arguments of an arithmetic operation are integers, the result is
    an integer. If one or both arguments are floating-point numbers, the result is
    a floating-point number. For example, `4 * 0.5` is `2.0`.


    > > Use `*` for multiplication and `/` for division.


    # ### 2.2.2 Increment and Decrement


    Changing a variable by adding or subtracting 1 is so common that there is a special
    shorthand for it, namely


    ```

    ```cpp

    counter++;

    counter--;

    ```

    ```


    The `++` increment operator gave the C++ programming language its name. C++ is
    the incremental improvement of the C language.


    > > The `++` operator adds 1 to a variable; the `--` operator subtracts 1.


    # ### 2.2.3 Integer Division and Remainder


    > > If both arguments of `/` are integers, the remainder is discarded.


    Division works as you would expect, as long as at least one of the numbers involved
    is a floating-point number. That is, `7.0 / 4.0`, `7 / 4.0`, and `7.0 / 4` all
    yield 1.75. However, if both numbers are integers, then the result of the division
    is always an integer, with the remainder discarded. That is,


    ```text

    7 / 4

    ```


    evaluates to 1 because 7 divided by 4 is 1 with a remainder of 3 (which is discarded).
    This can be a source of subtle programming errors—see Common Error 2.3 on page
    43.'
