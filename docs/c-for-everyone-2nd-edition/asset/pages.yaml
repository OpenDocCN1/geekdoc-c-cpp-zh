  md: "# 6.2 Common Array Algorithms\n\nIn the following sections, we discuss some\
    \ of the most common algorithms for processing sequences of values. We present\
    \ the algorithms so that you can use them with fully and partially filled arrays\
    \ as well as vectors (which we will introduce in Section 6.7). When we use the\
    \ expression *size* of values, you should replace it with a constant or variable\
    \ that yields the number of elements in the array (or the expression `values.size()`\
    \ if values is a vector).\n\n# 6.2.1 Filling\n\nThis loop fills an array with\
    \ zeroes:\n\n```\nfor (int i = 0; i < size of values; i++)\n{\n    values[i] =\
    \ 0;\n}\n```\n\nNext, let us fill an array squares with the numbers 0, 1, 4, 9,\
    \ 16, and so on. Note that the element with index 0 contains 0², the element with\
    \ index 1 contains 1², and so on.\n\n```\nfor (int i = 0; i < size of squares;\
    \ i++)\n{\n    squares[i] = i * i;\n}\n```\n\n# 6.2.2 Copying\n\n> To copy an\
    \ array, use a loop to copy its elements to a new array.\n\nConsider two arrays:\n\
    \n```\nint squares[5] = { 0, 1, 4, 9, 16 };\nint lucky_numbers[5];\n```\n\nNow\
    \ suppose you want to copy all values from the first array to the second. The\
    \ following assignment is an error:\n\n```\nlucky_numbers = squares; // Error\n\
    ```\n\nIn C++, you cannot assign one array to another. Instead, you must use a\
    \ loop to copy all elements:\n\n```\nfor (int i = 0; i < 5; i++)\n{\n    lucky_numbers[i]\
    \ = squares[i];\n}\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_283_0.png)\n\
    \n**Figure 5** Copying Elements to Copy an Array"
