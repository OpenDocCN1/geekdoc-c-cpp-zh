  md: 'There is one issue that you need to be aware of when drawing flowcharts. Unconstrained
    branching and merging can lead to “spaghetti code,” a messy network of possible
    pathways through a program.


    ![](img/23fb3582e93ebc95909e1de029c3d388_127_0.png)


    *Spaghetti code has so many pathways that it becomes impossible to understand.*


    > > Never point an arrow inside another branch.


    There is a simple rule for avoiding spaghetti code: Never point an arrow inside
    another branch.


    To understand the rule, consider this example: Shipping costs are $5 inside the
    United States, except that to Hawaii and Alaska they are $10. International shipping
    costs are also $10. You might start out with a flowchart like the following:


    ![](img/23fb3582e93ebc95909e1de029c3d388_127_1.png)


    Now you may be tempted to reuse the “shipping cost = $10” task:


    ![](img/23fb3582e93ebc95909e1de029c3d388_127_2.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Don’t do that! The red arrow points inside a different branch. Instead, add
    another task that sets the shipping cost to $10, like this:


    ![](img/23fb3582e93ebc95909e1de029c3d388_128_0.png)


    Not only do you avoid spaghetti code, but it is also a better design. In the future
    it may well happen that the cost for international shipments is different from
    that to Alaska and Hawaii.


    Flowcharts can be very useful for getting an intuitive understanding of the flow
    of an algorithm. However, they get large rather quickly when you add more details.
    At that point, it makes sense to switch from flowcharts to pseudocode.


