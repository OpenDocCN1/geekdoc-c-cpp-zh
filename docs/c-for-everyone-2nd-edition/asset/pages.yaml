  md: '# Programming Tip 3.6


    ![](img/23fb3582e93ebc95909e1de029c3d388_124_0.png)


    # Hand-Tracing


    A very useful technique for understanding whether a program works correctly is
    called *hand-tracing*. You simulate the program’s activity on a sheet of paper.
    You can use this method with pseudocode or C++ code.


    Get an index card, a cocktail napkin, or whatever sheet of paper is within reach.
    Make a column for each variable. Have the program code ready. Use a marker, such
    as a paper clip, to mark the current statement. In your mind, execute statements
    one at a time. Every time the value of a variable changes, cross out the old value
    and write the new value below the old one.


    For example, let’s trace the tax program with the data from the program run on
    page 95. In lines 13 and 14, tax1 and tax2 are initialized to 0.


