  md: "```\n```cpp\npublic:\n    Item(string item_description, double item_price);\n\
    \    // No other constructors\n};\n...\n```\n```\n\nThis Order class has a data\
    \ member of type Item:\n\n```\n```cpp\nclass Order\n{\npublic:\n    Order(string\
    \ customer_name, string item_description, double item_price);\n...\nprivate:\n\
    \    Item article;\n    string customer;\n};\n```\n```\n\nThe Order constructor\
    \ must call the Item constructor. That is achieved with an *initializer list*.\
    \ The initializer list is placed before the opening brace of the constructor.\
    \ The list starts with a colon and contains names of data members with their construction\
    \ arguments.\n\n```\n```cpp\nOrder(string customer_name, string item_description,\
    \ double item_price)\n    : article(item_description, item_price)\n{\n    customer\
    \ = customer_name;\n}\n```\n```\n\nInitializers are separated by commas. The Order\
    \ constructor can also be written like this:\n\n```\n```cpp\nOrder(string customer_name,\
    \ string item_description, double item_price)\n    : article(item_description,\
    \ item_price), customer(customer_name)\n{\n}\n```\n```\n\n# Special Topic 9.2\n\
    \n# Overloading\n\n![](img/23fb3582e93ebc95909e1de029c3d388_433_0.png)\n\nWhen\
    \ the same function name is used for more than one function, then the name is\
    \ overloaded. In C++ you can overload function names provided the types of the\
    \ parameter variables are different. For example, you can define two functions,\
    \ both called print:\n\n```\n```cpp\nvoid print(CashRegister r)\nvoid print(Item\
    \ i)\n```\n```\n\nWhen the print function is called,\n\n```\n```cpp\nprint(x);\n\
    ```\n```\n\nthe compiler looks at the type of x. If x is a CashRegister object,\
    \ the first function is called. If x is an Item object, the second function is\
    \ called. If x is neither, the compiler generates an error.\n\nIt is always possible\
    \ to avoid overloading by giving each function a unique name, such as print_register\
    \ or print_item. However, we have no choice with constructors. C++ demands that\
    \ the name of a constructor equal the name of the class. If a class has more than\
    \ one constructor, then that name must be overloaded.\n\nIn addition to name overloading,\
    \ C++ also supports **operator overloading**. It is possible to give new meanings\
    \ to the familiar C++ operators such as +, =, and <<. This is an advanced technique\
    \ that we do not discuss in this book."
