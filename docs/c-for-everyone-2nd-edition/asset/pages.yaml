- pgno: 12
  md: '**Common Errors** describe the kinds of errors that students often make, with
    an explanation of why the errors occur, and what to do about them.


    # Common Error 2.1 — Using Undefined Variables


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_0.png)


    The example explains the problem of using a variable before it has been defined.


    **Programming Tips** explain good programming practices, and encourage students
    to be more productive with tips and techniques such as hand-tracing.


    # Programming Tip 3.6 — Hand-Tracing


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_1.png)


    The example describes hand-tracing as a technique for understanding whether a
    program works correctly.


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_2.png)


    **Special Topics** present optional topics and provide additional explanation
    of others.


    # Special Topic 6.2 — A Sorting Algorithm


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_3.png)


    The example describes a sorting algorithm that arranges elements of a sequence
    in sorted order.


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_4.png)


    **Random Facts** provide historical and social information on computing—for interest
    and to fulfill the “historical and social context” requirements of the ACM/IEEE
    curriculum guidelines.


    # Random Fact 4.1 — The First Bug


    ![](img/23fb3582e93ebc95909e1de029c3d388_12_5.png)


    Article about the first bug, its discovery, and the history of the term.'
