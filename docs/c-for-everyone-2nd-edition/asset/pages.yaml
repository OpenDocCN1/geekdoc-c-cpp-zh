    \n```\n    void display_all(const CashRegister registers[])\n    {\n        for\
    \ (int i = 0; i < NREGISTERS; i++) { registers[i].display(); }\n    }\n```\n\n\
    That programmer is conscientious and declares the registers parameter variable\
    \ as const. But then the call registers[i].display() will not compile. Because\
    \ CashRegister::display is not tagged as const, the compiler suspects that the\
    \ call registers[i].display() may modify registers[i]. But the function promised\
    \ not to modify the registers array.\n\nIf you write a program with other team\
    \ members who are conscientious about const, it is very important that you do\
    \ your part as well. You should therefore get into the habit of using const with\
    \ all accessor member functions.\n\n# # 9.5 Constructors\n\n> > A constructor\
    \ is called automatically whenever an object is created.\n\nA constructor is a\
    \ member function that initializes the data members of an object. The constructor\
    \ is automatically called whenever an object is created. By supplying a constructor,\
    \ you can ensure that all data members are properly set before any member functions\
    \ act on an object.\n\nTo understand the importance of constructors, consider\
    \ the following statements:\n\n```\n    CashRegister register1;\n    register1.add_item(1.95);\n\
    \    int count = register1.get_count(); // May not be 1\n```\n\nHere, the programmer\
    \ forgot to call clear before adding items. Therefore, the data members of the\
    \ register1 object were initialized with random values. Constructors guarantee\
    \ that an object is always fully initialized when it is defined.\n\n> > The name\
    \ of a constructor is the same as the class name.\n\nThe name of a constructor\
    \ is identical to the name of its class. You declare constructors in the class\
    \ definition, for example:\n\n```\n    class CashRegister\n    {\n        public:\n\
    \            CashRegister(); // A constructor\n    ...\n    };\n```\n\nConstructors\
    \ never return values, but you do not use the void reserved word when declaring\
    \ them.\n\nHere is the definition of that constructor:\n\n```\n    CashRegister::CashRegister()\n\
    \    {\n        item_count = 0;\n        total_price = 0;\n    }\n```\n\nIn the\
    \ constructor definition, the first CashRegister (before the ::) indicates that\
    \ we are about to define a member function of the CashRegister class. The second\
    \ CashRegister is the name of that member function."
