  md: "# 4.5 Processing Input\n\nA sentinel value denotes the end of a data set, but\
    \ it is not part of the data.\n\nIn this section, you will learn how to read and\
    \ process a sequence of input values.\n\nWhenever you read a sequence of inputs,\
    \ you need to have some method of indicating the end of the sequence. Sometimes\
    \ you are lucky and no input value can be zero. Then you can prompt the user to\
    \ keep entering numbers, or 0 to finish the sequence. If zero is allowed but negative\
    \ numbers are not, you can use -1 to indicate termination. A value that serves\
    \ as a signal for termination is called a **sentinel**.\n\nLet’s put this technique\
    \ to work in a program that computes the average of a set of salary values. In\
    \ our sample program, we will use -1 as a sentinel. An employee would surely not\
    \ work for a negative salary, but there may be volunteers who work for free.\n\
    \nInside the loop, we read an input. If the input is not -1, we process it. In\
    \ order to compute the average, we need the total sum of all salaries, and the\
    \ number of inputs.\n\n```\nwhile (...)\n{\n    cin >> salary;\n    if (salary\
    \ != -1)\n    {\n        sum = sum + salary;\n        count++;\n    }\n}\n```\n\
    \nWe stay in the loop while the sentinel value is not detected.\n\n```\nwhile\
    \ (salary != -1)\n{\n    ...\n}\n```\n\nThere is just one problem: When the loop\
    \ is entered for the first time, no data value has been read. Be sure to initialize\
    \ salary with some value other than the sentinel:\n\n```\ndouble salary = 0; //\
    \ Any value other than -1 will do\n```\n\nAlternatively, use a do loop\n\n```\n\
    do\n{\n    ...\n}\nwhile (salary != -1)\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_177_0.png)\n\
    \n> In the military, a sentinel guards a border or passage. In computer science,\
    \ a sentinel value denotes the end of an input sequence or the border between\
    \ input sequences."
