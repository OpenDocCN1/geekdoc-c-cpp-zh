  md: "![](img/23fb3582e93ebc95909e1de029c3d388_348_0.png)\n\nThe string is declared\
    \ as `const` because you are not supposed to modify a literal string. (See Special\
    \ Topic 7.3 on page 320 for more information on constant pointers.)\n\nA C string\
    \ is terminated by a special character, called a *null terminator*, denoted `'\\\
    0'`. For example, the C string \"Harry\" contains six characters, namely 'H',\
    \ 'a', 'r', 'r', 'y' and `'\\0'` (See Figure 6.)\n\nThe terminator is a character\
    \ that is encoded as the number zero—this is different from the character `'0'`,\
    \ the character denoting the zero digit. (Under the ASCII encoding scheme, the\
    \ character denoting the zero digit is encoded as the number 48.)\n\nFunctions\
    \ that operate on C strings rely on this terminator. Here is a typical example,\
    \ the `strlen` function declared in the `<cstring>` header that computes the length\
    \ of a character array. The function counts the number of characters until it\
    \ reaches the terminator.\n\n```\n```cpp\nint strlen(const char s[])\n{\n    int\
    \ i = 0;\n    while (s[i] != '\\0') { i++; } // Count characters before the null\
    \ terminator\n    return i;\n}\n```\n```\n\nThe call `strlen(\"Harry\")` returns\
    \ 5.\n\n# 7.3.3 Character Arrays\n\nA literal string such as \"Harry\" is a constant.\
    \ You are not allowed to modify its characters. If you want to modify the characters\
    \ in a string, define a character array instead. For example:\n\n```\n```cpp\n\
    char char_array[] = \"Harry\"; // An array of 6 characters\n```\n```\n\nTable\
    \ 3 Character Literals\n\n| Literal | Description |\n| --- | --- |\n| `'y'` |\
    \ The character y |\n| `'0'` | The character for the digit 0. In the ASCII code,\
    \ `'0'` has the value 48. |\n| `' '` | The space character |\n| `'\\n'` | The\
    \ newline character |\n| `'\\t'` | The tab character |\n| `'\\0'` | The null terminator\
    \ of a string |\n| `\"y\"` | Error: Not a char value |"
