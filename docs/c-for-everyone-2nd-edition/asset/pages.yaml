  md: "We discussed the algorithm for `min_position` in the preceding section:\n\n\
    ```\n```cpp\n/**\n   Gets the position of the minimum value from an array.\n \
    \  @param values a partially filled array\n   @param size the number of elements\
    \ in values\n   @return the position of the smallest element in values\n*/\nint\
    \ min_position(double values[], int size)\n{\n   int smallest_position = 0;\n\
    \   for (int i = 1; i < size; i++)\n   {\n      if (values[i] < values[smallest_position])\n\
    \      {\n         smallest_position = i;\n      }\n   }\n   return smallest_position;\n\
    }\n```\n```\n\nThe remaining helper functions use the algorithms from Section\
    \ 6.2. You will find the implementations in the book's companion code.\n\n# Step\
    \ 4 Consider boundary conditions for the functions that you are implementing\n\
    \nMost functions that operate on arrays are a bit intricate, and you have to be\
    \ careful that you handle both normal and exceptional situations. What happens\
    \ with an empty array? An array that contains a single element? When no match\
    \ is found? When there are multiple matches? Consider these boundary conditions\
    \ and make sure that your functions work correctly.\n\nHere is one example of\
    \ such a consideration. How do we know that the `min_position` function will be\
    \ called with an array of size at least 1? (Recall that you must have at least\
    \ one element in order to find the minimum.) That function is called from the\
    \ `final_score` function. However, the `final_score` function could conceivably\
    \ be called with an empty array. We need to either include a test or add a restriction\
    \ to the function comment. We will opt for the latter and change the comment for\
    \ the `values` parameter variable of the `min_position` function to\n\n```\n```cpp\n\
    @param values a partially filled array of size >= 1\n```\n```\n\nConsider another\
    \ potential problem. What if there are multiple matches? That means that a student\
    \ had more than one test with a low score. The `final_score` function removes\
    \ only one of the occurrences of that low score, and that is the desired behavior.\n\
