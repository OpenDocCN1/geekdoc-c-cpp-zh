- pgno: 136
  md: "That is, of course, the same as\n\n```\nstate != \"AK\" && state != \"HI\"\n\
    ```\n\nNow apply the law to our shipping charge computation:\n\n```\n!(country\
    \ == \"USA\"\n    && state != \"AK\"\n    && state != \"HI\")\n```\n\nis equivalent\
    \ to\n\n```\n!(country == \"USA\")\n    || !(state == \"AK\")\n    || !(state\
    \ != \"HI\")\n```\n\nThat yields the simpler test\n\n```\ncountry != \"USA\"\n\
    \    || state == \"AK\"\n    || state == \"HI\"\n```\n\nTo simplify conditions\
    \ with negations of *and* or *or* expressions, it is usually a good idea to apply\
    \ De Morgan’s Law to move the negations to the innermost level.\n\n# 3.8 Application:\
    \ Input Validation\n\n![](img/23fb3582e93ebc95909e1de029c3d388_136_0.png)\n\n\
    *Like a quality control worker, you want to make sure that user input is correct\
    \ before processing it.*\n\nAn important application for the if statement is *input\
    \ validation*. Whenever your program accepts user input, you need to make sure\
    \ that the user-supplied values are valid before you use them in your computations.\n\
    \nConsider our elevator program. Assume that the elevator panel has buttons labeled\
    \ 1 through 20 (but not 13). The following are illegal inputs:\n\n+   - The number\
    \ 13\n+   - Zero or a negative number\n+   - A number larger than 20\n+   - An\
    \ input that is not a sequence of digits, such as five\n\nIn each of these cases,\
    \ we will want to give an error message and exit the program.\n\nIt is simple\
    \ to guard against an input of 13:\n\n```\nif (floor == 13)\n{\n    cout << \"\
    Error: There is no thirteenth floor.\" << endl;\n    return 1;\n}\n```\n\nThe\
    \ statement\n\n    return 1;\n\nimmediately exits the main function and therefore\
    \ terminates the program. It is a convention to return with the value 0 if the\
    \ program completed normally, and with a non-zero value when an error was encountered."
