  md: "# Special Topic 3.4\n\n![](img/23fb3582e93ebc95909e1de029c3d388_135_0.png)\n\
    \n# Short-Circuit Evaluation of Boolean Operators\n\nWhen the `&&` and `||` operators\
    \ are computed, evaluation stops as soon as the truth value is determined. When\
    \ an `&&` is evaluated and the first condition is false, the second condition\
    \ is not evaluated, because it does not matter what the outcome of the second\
    \ test is.\n\nFor example, consider the expression\n\n```\nquantity > 0 && price\
    \ / quantity < 10\n```\n\nSuppose the value of quantity is zero. Then the test\
    \ `quantity > 0` fails, and the second test is not attempted. That is just as\
    \ well, because it is illegal to divide by zero.\n\nSimilarly, when the first\
    \ condition of an `||` expression is true, then the remainder is not evaluated\
    \ since the result must be true.\n\nThis process is called *short-circuit evaluation*.\n\
    \n> *In a short circuit, electricity travels along the path of least resistance.\
    \ Similarly, short-circuit evaluation takes the fastest path for computing the\
    \ result of a Boolean expression.*\n\n![](img/23fb3582e93ebc95909e1de029c3d388_135_1.png)\n\
    \n> The `&&` and `||` operators are computed using *short-circuit evaluation*:\
    \ As soon as the truth value is determined, no further conditions are evaluated.\n\
    \n# Special Topic 3.5\n\n![](img/23fb3582e93ebc95909e1de029c3d388_135_2.png)\n\
    \n# De Morgan’s Law\n\nHumans generally have a hard time comprehending logical\
    \ conditions with `not` operators applied to `and/or` expressions. De Morgan’s\
    \ Law, named after the logician Augustus De Morgan (1806–1871), can be used to\
    \ simplify these Boolean expressions.\n\nSuppose we want to charge a higher shipping\
    \ rate if we don’t ship within the continental United States.\n\n```\nif (!(country\
    \ == \"USA\"\n    && state != \"AK\"\n    && state != \"HI\"))\n    shipping_charge\
    \ = 20.00;\n```\n\nThis test is a little bit complicated, and you have to think\
    \ carefully through the logic. When it is *not* true that the country is USA *and*\
    \ the state is not Alaska and the state is not Hawaii, then charge $20.00. Huh?\
    \ It is not true that some people won’t be confused by this code.\n\nThe computer\
    \ doesn’t care, but it takes human programmers to write and maintain the code.\
    \ Therefore, it is useful to know how to simplify such a condition.\n\nDe Morgan’s\
    \ Law has two forms: one for the negation of an *and* expression and one for the\
    \ negation of an *or* expression:\n\n```\n!(A && B)    is the same as    !A ||\
    \ !B\n!(A || B)    is the same as    !A && !B\n```\n\n> De Morgan’s law tells\
    \ you how to negate `&&` and `||` conditions.\n\nPay particular attention to the\
    \ fact that the *and* and *or* operators are *reversed* by moving the `not` inward.\
    \ For example, the negation of “the state is Alaska or it is Hawaii”,\n\n```\n\
    !(state == \"AK\" || state == \"HI\")\n```\n\nis “the state is not Alaska and\
    \ it is not Hawaii”:\n\n```\n!(state == \"AK\") && !(state == \"HI\")\n```"
