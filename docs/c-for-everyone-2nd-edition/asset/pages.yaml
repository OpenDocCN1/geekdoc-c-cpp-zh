- pgno: 114
  md: '+   - The space character comes before all printable characters.

    +   - Numbers come before letters.

    +   - For the ordering of punctuation marks, see Appendix D.


    When comparing two strings, you compare the first letters of each word, then the
    second letters, and so on, until one of the strings ends or you find the first
    letter pair that doesn’t match.


    If one of the strings ends, the longer string is considered the “larger” one.
    For example, compare "car" with "cart". The first three letters match, and we
    reach the end of the first string. Therefore "car" comes before "cart" in lexicographic
    ordering.


    When you reach a mismatch, the string containing the “larger” character is considered
    “larger”. For example, let’s compare "cat" with "cart". The first two letters
    match. Since t comes after r, the string "cat" comes after "cart" in the lexicographic
    ordering.


    ![](img/23fb3582e93ebc95909e1de029c3d388_114_0.png)


    # HOW TO 3.1 — Implementing an if Statement


    ![](img/23fb3582e93ebc95909e1de029c3d388_114_1.png)


    This How To walks you through the process of implementing an if statement. We
    will illustrate the steps with the following example problem:


    The university bookstore has a Kilobyte Day sale every October 24, giving an 8
    percent discount on all computer accessory purchases if the price is less than
    $128, and a 16 percent discount if the price is at least $128. Write a program
    that asks the cashier for the original price and then prints the discounted price.


    # Step 1


    Decide upon the branching condition.


    In our sample problem, the obvious choice for the condition is:


    ```

    original price < 128?

    ```


    That is just fine, and we will use that condition in our solution.


    But you could equally well come up with a correct solution if you choose the opposite
    condition: Is the original price at least (≥) $128? You might choose this condition
    if you put yourself into the position of a shopper who wants to know when the
    bigger discount applies.


    ![](img/23fb3582e93ebc95909e1de029c3d388_114_2.png)


    Sales discounts are often higher for expensive products. Use the if statement
    to implement such a decision.


    # Step 2


    Give pseudocode for the work that needs to be done when the condition is true.


    In this step, you list the action or actions that are taken in the “positive”
    branch. The details depend on your problem. You may want to print a message, compute
    values, or even exit the program.


    In our example, we need to apply an 8 percent discount:


    ```

    discounted price = 0.92 x original price

    ```'
