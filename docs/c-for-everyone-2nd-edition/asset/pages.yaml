  md: "```\n    for (counter = 1; counter <= 10; counter++)\n    {\n        cout <<\
    \ counter << endl;\n    }\n```\n\nSome people call this loop *count-controlled*.\
    \ In contrast, the `while` loop of the preceding section can be called an *event-controlled*\
    \ loop because it executes until an event occurs (for example, when the balance\
    \ reaches the target). Another commonly-used term for a count-controlled loop\
    \ is *definite*. You know from the outset that the loop body will be executed\
    \ a definite number of times—ten times in our example. In contrast, you do not\
    \ know how many iterations it takes to accumulate a target balance. Such a loop\
    \ is called *indefinite*.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_170_0.png)\n\
    \nYou can visualize the *for loop* as an orderly sequence of steps.\n\nThe `for`\
    \ loop neatly groups the initialization, condition, and update expressions together.\
    \ However, it is important to realize that these expressions are *not executed\
    \ together* (see Figure 3).\n\n+   - The initialization is executed once, before\
    \ the loop is entered. ①\n+   - The condition is checked before each iteration.\
    \ ② ⑤\n+   - The update is executed after each iteration. ④\n\n**Figure 3**\n\
    Execution of a for Loop\n\n| Step | Description | counter | Code |\n|---|---|---|---|\n\
    | ① | Initialize counter | 1 | `for (counter = 1; counter <= 10; counter++)`<br>`{`<br>`\
    \    cout << counter << endl;`<br>`}` |\n| ② | Check condition | 1 | `for (counter\
    \ = 1; counter <= 10; counter++)`<br>`{`<br>`    cout << counter << endl;`<br>`}`\
    \ |\n| ③ | Execute loop body | 1 | `for (counter = 1; counter <= 10; counter++)`<br>`{`<br>`\
    \    cout << counter << endl;`<br>`}` |\n| ④ | Update counter | 2 | `for (counter\
    \ = 1; counter <= 10; counter++)`<br>`{`<br>`    cout << counter << endl;`<br>`}`\
    \ |\n| ⑤ | Check condition again | 2 | `for (counter = 1; counter <= 10; counter++)`<br>`{`<br>`\
    \    cout << counter << endl;`<br>`}` |"
