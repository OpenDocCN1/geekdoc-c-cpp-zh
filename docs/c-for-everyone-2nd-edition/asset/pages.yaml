  md: "```\n```\nbalance = balance * (1 + RATE / 100);\n}\n```\n```\n\nHere the programmer\
    \ forgot to add a `year++` command in the loop. As a result, the year always stays\
    \ at 1, and the loop never comes to an end.\n\nAnother common reason for an infinite\
    \ loop is accidentally incrementing a counter that should be decremented (or vice\
    \ versa). Consider this example:\n\n```\n```\nyear = 20;\nwhile (year > 0)\n{\n\
    \    balance = balance * (1 + RATE / 100);\n    year++;\n}\n```\n```\n\nThe year\
    \ variable should really have been decremented, not incremented. This is a common\
    \ error because incrementing counters is so much more common than decrementing\
    \ that your fingers may type the ++ on autopilot. As a consequence, year is always\
    \ larger than 0, and the loop never ends. (Actually, year may eventually exceed\
    \ the largest representable positive integer and *wrap around* to a negative number.\
    \ Then the loop ends—of course, with a completely wrong result.)\n\n![](img/23fb3582e93ebc95909e1de029c3d388_164_0.png)\n\
    \n*Like this hamster who can't stop running in the treadmill, an infinite loop\
    \ never ends.*\n\n# ### Common Error 4.2\n\n# ### Don’t Think “Are We There Yet?”\n\
    \n![](img/23fb3582e93ebc95909e1de029c3d388_164_1.png)\n\nWhen doing something\
    \ repetitive, most of us want to know when we are done. For example, you may think,\
    \ “I want to get at least $20,000,” and set the loop condition to\n\n```\n```\n\
    balance >= TARGET\n```\n```\n\nBut the while loop thinks the opposite: How long\
    \ am I allowed to keep going? The correct loop condition is\n\n```\n```\nwhile\
    \ (balance < TARGET)\n```\n```\n\nIn other words: “Keep at it while the balance\
    \ is less than the target.”\n\n![](img/23fb3582e93ebc95909e1de029c3d388_164_2.png)\n\
    \n*When writing a loop condition, don’t ask, “Are we there yet?” The condition\
    \ determines how long the loop will keep going.*\n\n# ### Common Error 4.3\n\n\
    # ### Off-by-One Errors\n\n![](img/23fb3582e93ebc95909e1de029c3d388_164_3.png)\n\
    \nConsider our computation of the number of years that are required to double\
    \ an investment:\n\n```\n```\nint year = 0;\nwhile (balance < TARGET)\n{\n   \
    \ year++;\n    double interest = balance * RATE / 100;\n    balance = balance\
    \ + interest;\n}\ncout << \"The investment doubled after \" << year << \" years.\"\
    \ << endl;\n```\n```"
