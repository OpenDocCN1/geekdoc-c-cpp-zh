  img_proc: true
- pgno: 313
  md: "Use the size member function to obtain the current size of a vector.\n\nYou\
    \ access the vector elements as `values[i]`, just as you do with arrays.\n\nThe\
    \ size member function returns the current size of a vector. In a loop that visits\
    \ all vector elements, use the size member function like this:\n\n```\nfor (int\
    \ i = 0; i < values.size(); i++)\n{\n    cout << values[i] << endl;\n}\n```\n\n\
    # 6.7.2 Growing and Shrinking Vectors\n\nUse the `push_back` member function to\
    \ add more elements to a vector. Use `pop_back` to reduce the size.\n\nIf you\
    \ need additional elements, you use the push_back function to add an element to\
    \ the end of the vector, thereby increasing its size by 1. The push_back function\
    \ is a member function that you must call with the dot notation, like this:\n\n\
    ```\nvalues.push_back(37.5);\n```\n\nAfter this call, the vector values in Figure\
    \ 14 has size 3, and values[2] contains the value 37.5.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_313_0.png)\n\
    \n**Figure 14**  Adding an Element with push_back\n\nIt is very common to start\
    \ with an empty vector and use the push_back function to fill it. For example,\n\
    \n```\nvector<double> values;  // Initially empty\nvalues.push_back(32);  // Now\
    \ values has size 1 and element 32\nvalues.push_back(54);  // Now values has size\
    \ 2 and elements 32, 54\nvalues.push_back(37.5); // Now values has size 3 and\
    \ elements 32, 54, 37.5\n```\n\nAnother common use for the push_back member function\
    \ is to fill a vector with input values.\n\n```\nvector<double> values;  // Initially\
    \ empty\n\ndouble input;\nwhile (cin >> input)\n{\n    values.push_back(input);\n\
    }\n```\n\nNote how this input loop is *much* simpler than the one in Section 6.2.10.\n\
    \nAnother member function, pop_back, removes the last element of a vector, shrinking\
    \ its size by one (see Figure 15):\n\n```\nvalues.pop_back();\n```"
