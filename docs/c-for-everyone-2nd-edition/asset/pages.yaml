  md: '# ## *Random Fact 8.1 Encryption Algorithms*


    The exercises at the end of this chapter give a few algorithms to encrypt text.
    Don’t actually use any of those methods to send secret messages to your lover.
    Any skilled cryptographer can *break* these schemes in a very short time—that
    is, reconstruct the original text without knowing the secret keyword.


    In 1978 Ron Rivest, Adi Shamir, and Leonard Adleman introduced an encryption method
    that is much more powerful. The method is called RSA encryption, after the last
    names of its inventors. The exact scheme is too complicated to present here, but
    it is not actually difficult to follow. You can find the details in http://theory.lcs.mit.edu/~rivest/rsapaper.pdf.


    RSA is a remarkable encryption method. There are two keys: a public key and a
    private key. (See the figure.) You can print the public key on your business card
    (or in your e-mail signature block) and give it to anyone. Then anyone can send
    you messages that only you can decrypt. Even though everyone else knows the public
    key, and even if they intercept all the messages coming to you, they cannot break
    the scheme and actually read the messages. In 1994, hundreds of researchers, collaborating
    over the Internet, cracked an RSA message encrypted with a 129-digit key. Messages
    encrypted with a key of 230 digits or more are expected to be secure.


    The inventors of the algorithm obtained a patent for it. A patent is a deal that
    society makes with an inventor. For a period of 20 years, the inventor has an
    exclusive right for its commercialization, may collect royalties from others wishing
    to manufacture the invention, and may even stop competitors from using it altogether.
    In return, the inventor must publish the invention, so that others may learn from
    it, and must relinquish all claim to it after the monopoly period ends. The presumption
    is that in the absence of patent law, inventors would be


    reluctant to go through the trouble of inventing, or they would try to cloak their
    techniques to prevent others from copying their devices.


    There has been some controversy about the RSA patent. Had there not been patent
    protection, would the inventors have published the method anyway, thereby giving
    the benefit to society without the cost of the 20-year monopoly? In this case,
    the answer is probably yes. The inventors were academic researchers, who live
    on salaries rather than sales receipts and are usually rewarded for their discoveries
    by a boost in their reputation and careers. Would their followers have been as
    active in discovering (and patenting) improvements? There is no way of knowing,
    of course. Is an algorithm even patentable, or is it a mathematical fact that
    belongs to nobody? The patent office did take the latter attitude for a long time.
    The RSA inventors and many others described their inventions in terms of imaginary
    electronic devices, rather than algorithms, to circumvent that restriction. Nowadays,


    the patent office will award software patents.


    There is another interesting aspect to the RSA story. A programmer, Phil Zimmermann,
    developed a program called PGP (for Pretty Good Privacy) that is based on RSA.
    Anyone can use the program to encrypt messages, and decryption is not feasible
    even with the most powerful computers. You can get a copy of a free PGP implementation
    from the GNU project (http://www.gnu.org). The existence of strong encryption
    methods bothers the United States government to no end. Criminals and foreign
    agents can send communications that the police and intelligence agencies cannot
    decipher. The government considered charging Zimmermann with breaching a law that
    forbids the unauthorized export of munitions, arguing that he should have known
    that his program would appear on the Internet. There have been serious proposals
    to make it illegal for private citizens to use these encryption methods, or to
    keep the keys secret from law enforcement.


    ![](img/23fb3582e93ebc95909e1de029c3d388_395_0.png)


    *Public-Key Encryption*'
