  md: "![](img/23fb3582e93ebc95909e1de029c3d388_351_0.png)\n\nThis array can hold\
    \ strings with a length of at most 39, because one character is required for the\
    \ null terminator.\n\nNow copy the first name, using strncpy:\n\n```\n```c\nstrncpy(name,\
    \ first, NAME_SIZE - 1);\n```\n```\n\nYou must be careful not to overrun the target\
    \ array. It is unlikely that a first name is longer than 39 characters, but a\
    \ hacker could supply a longer input in order to overwrite memory.\n\nNow, if\
    \ there is still room, add a space and the last name, again being careful not\
    \ to overrun the array boundaries.\n\n```\n```c\nint length = strlen(name);\n\
    if (length < NAME_SIZE - 1)\n{\n    strcat(name, \" \");\n    int n = NAME_SIZE\
    \ - 2 - length; // Leave room for space, null terminator\n    if (n > 0)\n   \
    \ {\n        strncat(name, last, n);\n    }\n}\n```\n```\n\nAs you can see, the\
    \ C string code is over three times as long as the code using C++ strings, and\
    \ it is not as capable—if the target array is not long enough to hold the result,\
    \ it is truncated.\n\n**Table 4  C String Functions**\n\nIn this table, s and\
    \ t are character arrays; n is an integer.\n\n| Function | Description |\n|---|---|\n\
    | strlen(s) | Returns the length of s. |\n| strcpy(t, s) | Copies the characters\
    \ from s into t. |\n| strncpy(t, s, n) | Copies at most n characters from s into\
    \ t. |\n| strcat(t, s) | Appends the characters from s after the end of the characters\
    \ in t. |\n| strncat(t, s, n) | Appends at most n characters from s after the\
    \ end of the characters in t. |\n| strcmp(s, t) | Returns 0 if s and t have the\
    \ same contents, a negative integer if s comes before t in lexicographic order,\
    \ a positive integer otherwise. |"
