- pgno: 314
  md: "![](img/23fb3582e93ebc95909e1de029c3d388_314_0.png)\n\n**Figure 15** Removing\
    \ an Element with `pop_back`\n\n# ### 6.7.3 Vectors and Functions\n\n> Vectors\
    \ can occur as function arguments and return values.\n\nYou can use vectors as\
    \ function arguments in exactly the same way as any other values. For example,\
    \ the following function computes the sum of a vector of floating-point numbers:\n\
    \n```\n```cpp\ndouble sum(vector<double> values)\n{\n    double total = 0;\n \
    \   for (int i = 0; i < values.size(); i++)\n    {\n        total = total + values[i];\n\
    \    }\n    return total;\n}\n```\n```\n\n> Use a reference parameter to modify\
    \ the contents of a vector.\n\nThis function visits the vector elements, but it\
    \ does not modify them. If your function modifies the elements, use a reference\
    \ parameter. The following function multiplies all values of a vector with a given\
    \ factor.\n\n```\n```cpp\nvoid multiply(vector<double>& values, double factor)\
    \ // Note the &\n{\n    for (int i = 0; i < values.size(); i++)\n    {\n     \
    \   values[i] = values[i] * factor;\n    }\n}\n```\n```\n\nSome programmers use\
    \ a constant reference (see Special Topic 5.2) for vector parameters that are\
    \ not modified, for example:\n\n```\n```cpp\ndouble sum(const vector<double>&\
    \ values) // const & added for efficiency\n```\n```\n\n> A function can return\
    \ a vector.\n\nA function can return a vector. Again, vectors are no different\
    \ from any other values in this regard. Simply build up the result in the function\
    \ and return it. In this example, the squares function returns a vector of squares\
    \ from 0² up to (n − 1)²:\n\n```\n```cpp\nvector<int> squares(int n)\n{\n    vector<int>\
    \ result;\n    for (int i = 0; i < n; i++)\n    {\n        result.push_back(i\
    \ * i);\n    }\n    return result;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 315
  md: "As you can see, it is easy to use vectors with functions—there are no special\
    \ rules to keep in mind.\n\n# 6.7.4 Vector Algorithms\n\nMost of the algorithms\
    \ in Section 6.2 apply without change to vectors—simply replace size of values\
    \ with values.size(). In this section, we discuss which of the algorithms are\
    \ different for vectors.\n\n# Copying\n\nAs discussed in Section 6.2.2, you need\
    \ an explicit loop to make a copy of an array. It is much easier to make a copy\
    \ of a vector. You simply assign it to another vector. Consider this example:\n\
    \n```\n```cpp\nvector<int> squares;\nfor (int i = 0; i < 5; i++) { squares.push_back(i\
    \ * i); }\nvector<int> lucky_numbers; // Initially empty\nlucky_numbers = squares;\
    \ // Now lucky_numbers contains the same elements as squares\n```\n```\n\n# Finding\
    \ Matches\n\nSection 6.2.6 shows you how to find the first match, but sometimes\
    \ you want to have all matches. This is tedious with arrays, but simple using\
    \ a vector that collects the matches. Here we collect all elements that are greater\
    \ than 100:\n\n```\n```cpp\nvector<double> matches;\nfor (int i = 0; i < values.size();\
    \ i++)\n{\n    if (values[i] > 100)\n    {\n        matches.push_back(values[i]);\n\
    \    }\n}\n```\n```\n\n# Removing an Element\n\nWhen you remove an element from\
    \ a vector, you want to adjust the size of the vector by calling the pop_back\
    \ member function. Here is the code for removing an element at [pos] when the\
    \ order doesn't matter.\n\n```\n```cpp\nint last_pos = values.size() - 1;\nvalues[pos]\
    \ = values[last_pos]; // Replace element at pos with last element\nvalues.pop_back();\
    \ // Delete last element\n```\n```\n\nWhen removing an element from an ordered\
    \ vector, first move the elements, then reduce the size:\n\n```\n```cpp\nfor (int\
    \ i = pos + 1; i < values.size(); i++)\n{\n    values[i - 1] = values[i];\n}\n\
    values.pop_back();\n```\n```\n\n# Inserting an Element\n\nInserting an element\
    \ at the end of a vector requires no special code. Simply use the push_back member\
    \ function."
  merge: -1
  img_proc: true
- pgno: 316
  md: "When you insert an element in the middle, you still want to call `push_back`\
    \ so that the size of the vector is increased. Use the following code:\n\n```\n\
    int last_pos = values.size() - 1;\nvalues.push_back(values[last_pos]);\nfor (int\
    \ i = last_pos; i > pos; i--)\n{\n    values[i] = values[i - 1];\n}\nvalues[pos]\
    \ = new_element;\n```\n\n# Self Check\n\n![](img/23fb3582e93ebc95909e1de029c3d388_316_0.png)\n\
    \n+   35. Define a vector of integers that contains the first five prime numbers\
    \ (2, 3, 5, 7, and 11). Use `push_back` to add the elements.\n+   36. Answer Self\
    \ Check 35 without using `push_back`.\n+   37. What is the contents of the vector\
    \ names after the following statements?\n+   \n+       ```cpp\n+       vector<string>\
    \ names;\n+       names.push_back(\"Ann\");\n+       names.push_back(\"Bob\");\n\
    +       names.pop_back();\n+       names.push_back(\"Cai\");\n+       ```\n+ \
    \  38. Suppose you want to store a set of temperature measurements that is taken\
    \ every five minutes. Should you use a vector or an array?\n+   39. Suppose you\
    \ want to store the names of the weekdays. Should you use a vector or an array\
    \ of seven strings?\n+   40. Write the header for a function that appends two\
    \ vectors, yielding a third vector. Do not implement the function.\n+   41. Consider\
    \ this partially completed function that appends the elements of one vector to\
    \ another.\n+   \n+       ```cpp\n+       void append(vector<double>__ target,\
    \ vector<double>__ source)\n+       {\n+           for (int i = 0; i < source.size();\
    \ i++)\n+           {\n+               target.push_back(source[i]);\n+       \
    \    }\n+       }\n+       ```\n+   \n+       Specify whether the parameters should\
    \ be value or reference parameters.\n\n# Practice It\n\nNow you can try these\
    \ exercises at the end of the chapter: R6.11, R6.25, P6.26, P6.27.\n\n# Programming\
    \ Tip 6.2\n\n![](img/23fb3582e93ebc95909e1de029c3d388_316_1.png)\n\n# Prefer Vectors\
    \ over Arrays\n\nFor most programming tasks, vectors are easier to use than arrays.\
    \ Vectors can grow and shrink. Even if a vector always stays the same size, it\
    \ is convenient that a vector remembers its size. For a beginner, the sole advantage\
    \ of an array is the initialization syntax. Advanced programmers sometimes prefer\
    \ arrays because they are a bit more efficient. Moreover, you need to know how\
    \ to use arrays if you work with older programs."
