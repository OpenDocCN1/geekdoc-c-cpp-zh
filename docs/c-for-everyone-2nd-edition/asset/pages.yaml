  md: "![](img/23fb3582e93ebc95909e1de029c3d388_443_0.png)\n\n# SELF CHECK\n\n+  \
    \ 29. What is the rule of thumb for finding classes?\n+   30. You are to write\
    \ a program that plays chess. Might `ChessBoard` be an appropriate class? How\
    \ about `MovePiece`?\n+   31. In an e-mail system, messages are stored in a mailbox.\
    \ Draw a UML diagram that shows the appropriate aggregation relationship.\n+ \
    \  32. You are implementing a system to manage a library, keeping track of which\
    \ books are checked out by whom. Should the `Book` class aggregate `Patron` or\
    \ the other way around?\n+   33. In a library management system, what would be\
    \ the relationship between classes `Patron` and `Author`?\n\n**Practice It** Now\
    \ you can try these exercises at the end of the chapter: R9.23, R9.24, R9.26.\n\
    \n# Programming Tip 9.3\n\n![](img/23fb3582e93ebc95909e1de029c3d388_443_1.png)\n\
    \n# Make Parallel Vectors into Vectors of Objects\n\nSometimes, you find yourself\
    \ using vectors of the same length, each of which stores a part of what conceptually\
    \ should be an object. In that situation, it is a good idea to reorganize your\
    \ program and use a single vector whose elements are objects.\n\nFor example,\
    \ suppose an invoice contains a series of item descriptions and prices. One solution\
    \ is to keep two vectors:\n\n```\n```cpp\nvector<string> descriptions;\nvector<double>\
    \ prices;\n```\n```\n\nEach of the vectors will have the same length, and the\
    \ *ith slice*, consisting of `descriptions[i]` and `prices[i]`, contains data\
    \ that needs to be processed together. These vectors are called **parallel vectors**\
    \ (see Figure 5).\n\nParallel vectors become a headache in larger programs. The\
    \ programmer must ensure that the vectors always have the same length and that\
    \ each slice is filled with values that actually belong together. Moreover, any\
    \ function that operates on a slice must get all of the vectors as arguments,\
    \ which is tedious to program.\n\nThe remedy is simple. Look at the slice and\
    \ find the *concept* that it represents. Then make the concept into a class. In\
    \ this example, each slice contains the description and price of an *item*; turn\
    \ this into a class.\n\n> > Avoid parallel vectors by changing them into vectors\
    \ of objects.\n\n```\n```cpp\nclass Item\n{\npublic:\n\nprivate:\n   string description;\n\
    \   double price;\n};\n```\n```\n\n![](img/23fb3582e93ebc95909e1de029c3d388_443_2.png)\n\
    \n**Figure 5** Parallel Vectors"
