    # ## 4.7 Common Loop Algorithms\n\nIn the following sections, we discuss some\
    \ of the most common algorithms that are implemented as loops. You can use them\
    \ as starting points for your loop designs.\n\n# ### 4.7.1 Sum and Average Value\n\
    \nComputing the sum of a number of inputs is a very common task. Keep a *running\
    \ total*: a variable to which you add each input value. Of course, the total should\
    \ be initialized with 0.\n\n```\n~~~cpp\ndouble total = 0;\ndouble input;\nwhile\
    \ (cin >> input)\n{\n    total = total + input;\n}\n~~~\n```"
