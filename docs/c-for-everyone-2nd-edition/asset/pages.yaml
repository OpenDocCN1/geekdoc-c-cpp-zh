    # Practice It


    Now you can try these exercises at the end of the chapter: R2.1, R2.2, P2.1.


    # Common Error 2.1


    # Using Undefined Variables


    ![](img/23fb3582e93ebc95909e1de029c3d388_64_0.png)


    You must define a variable before you use it for the first time. For example,
    the following sequence of statements would not be legal:


    ```

    ```cpp

    double can_volume = 12 * liter_per_ounce;

    double liter_per_ounce = 0.0296;

    ```

    ```


    In your program, the statements are compiled in order. When the compiler reaches
    the first statement, it does not know that `liter_per_ounce` will be defined in
    the next line, and it reports an error.


    # Common Error 2.2


    # Using Uninitialized Variables


    ![](img/23fb3582e93ebc95909e1de029c3d388_64_1.png)


    If you define a variable but leave it uninitialized, then your program can act
    unpredictably. To understand why, consider what happens when you define a variable.
    Just enough space is set aside in memory to hold values of the type you specify.
    For example, with the definition


    ```

    ```cpp

    int bottles;

    ```

    ```


    a block of memory big enough to hold integers is reserved. There is already *some*
    value in that memory. After all, you don’t get freshly minted transistors—just
    an area of memory that has previously been used, filled with flatsam left over
    from prior computations. (In this regard, a variable differs from a parking space.
    A parking space can be empty, containing no vehicle. But a variable always holds
    some value.)


    If you use the variable without initializing it, then that prior value will be
    used, yielding unpredictable results. For example, consider the program segment


    ```

    ```cpp

    int bottles; // Forgot to initialize

    int bottle_volume = bottles * 2; // Result is unpredictable

    ```

    ```


    There is no way of knowing what value will be computed. If you are unlucky, a
    plausible value will happen to appear when you run the program at home, and an
    entirely different result will occur when the program is graded.'
