  md: "*A constructor is like a set of assembly instructions for an object.*\n\n![](img/23fb3582e93ebc95909e1de029c3d388_431_0.png)\n\
    \n> A default constructor has no arguments.\n\nThe constructor that you just saw\
    \ has no arguments. Such a constructor is called a **default constructor**. It\
    \ is used whenever you define an object and do not specify any parameters for\
    \ the construction. For example, if you define\n\n```\nCashRegister register1;\n\
    ```\n\nthen the default constructor is called. It sets `register1.item_count`\
    \ and `register1.total_price` to zero.\n\n> A class can have multiple constructors.\n\
    \nMany classes have more than one constructor. This allows you to define objects\
    \ in different ways. Consider for example a BankAccount class that has two constructors:\n\
    \n```\nclass BankAccount\n{\npublic:\n  BankAccount(); // Sets balance to 0\n\
    \  BankAccount(double initial_balance); // Sets balance to initial_balance\n \
    \ // Member functions omitted\nprivate:\n  double balance;\n};\n```\n\n> The compiler\
    \ picks the constructor that matches the construction arguments.\n\nBoth constructors\
    \ have the same name as the class, BankAccount. But the default constructor has\
    \ no parameter variables, whereas the second constructor has a double parameter\
    \ variable. (This is an example of **overloading**—see Special Topic 9.2.)\n\n\
    When you construct an object, the compiler chooses the constructor that matches\
    \ the arguments that you supply. For example,\n\n```\nBankAccount joes_account;\n\
    \  // Uses default constructor\nBankAccount lisas_account(499.95);\n  // Uses\
    \ BankAccount(double) constructor\n```\n\n> Be sure to initialize all number and\
    \ pointer data members in a constructor.\n\nWhen implementing a constructor, you\
    \ need to pay particular attention to all data members that are numbers or pointers.\
    \ These types are not classes and therefore have no constructors. If you have\
    \ a data member that is an object of a class (such as a string object), then that\
    \ class has a constructor, and the object will be initialized. For example, all\
    \ string objects are automatically initialized to the empty string.\n\nConsider\
    \ this class:\n\n```\nclass Item\n{\n```"
