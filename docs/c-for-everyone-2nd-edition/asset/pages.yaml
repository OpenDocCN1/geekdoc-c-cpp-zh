  md: "Note the set of directives that bracket the header file:\n\n```\n```\n#ifndef\
    \ CASHREGISTER_H\n#define CASHREGISTER_H\n\n#endif\n```\n```\n\nSuppose a file\
    \ includes two header files: cashregister.h, and another header file that itself\
    \ includes cashregister.h. The effect of the directives is to skip the file when\
    \ it is encountered the second time. If we did not have that check, the compiler\
    \ would complain when it saw the definition for the CashRegister class twice.\
    \ (Sadly, it doesn't check whether the definitions are identical.)\n\nThe source\
    \ file for the CashRegister class simply contains the definitions of the member\
    \ functions (including constructors).\n\nNote that the source file cashregister.cpp\
    \ includes its own header file cashregister.h. The compiler needs to know how\
    \ the CashRegister class is defined in order to compile the member functions.\n\
    \n# **ch09/cashregister.cpp**\n\n```\n```cpp\n#include \"cashregister.h\"\n\n\
    CashRegister::CashRegister()\n{\n   clear();\n}\n\nvoid CashRegister::clear()\n\
    {\n   item_count = 0;\n   total_price = 0;\n}\n\nvoid CashRegister::add_item(double\
    \ price)\n{\n   item_count++;\n   total_price = total_price + price;\n}\n\ndouble\
    \ CashRegister::get_total() const\n{\n   return total_price;\n}\n\nint CashRegister::get_count()\
    \ const\n{\n   return item_count;\n}\n```\n```\n\nNote that the function comments\
    \ are in the header file, because comments are a part of the interface, not the\
    \ implementation.\n\nThe cashregister.cpp file does not contain a *main* function.\
    \ There are many potential programs that might make use of the CashRegister class.\
    \ Each of these programs will need to supply its own *main* function, as well\
    \ as other functions and classes."
