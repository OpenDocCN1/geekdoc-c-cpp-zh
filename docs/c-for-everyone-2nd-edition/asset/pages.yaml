    modifies the variable `harrys_account`, and the call


    `withdraw(sallys_account, 150);`


    modifies the variable `sallys_account`.


    The argument for a reference parameter must always be a *variable*. It would be
    an error to supply a number:


    `withdraw(1000, 500); // Error: argument for reference parameter must be a variable`


    The reason is clear—the function modifies the reference parameter, but it is impossible
    to change the value of a number. For the same reason, you cannot supply an expression:


    `withdraw(harrys_account + 150, 500);`


    `// Error: argument for reference parameter must be a variable`


    Modifying a reference parameter updates the variable that was supplied in the
