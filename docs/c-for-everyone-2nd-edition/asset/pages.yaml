  md: '# ### 3.4 Nested Branches


    When a decision statement is contained inside the branch of another decision statement,
    the statements are *nested*.


    It is often necessary to include an if statement inside another. Such an arrangement
    is called a *nested* set of statements. Here is a typical example.


    In the United States, different tax rates are used depending on the taxpayer''s
    marital status. There are different tax schedules for single and for married taxpayers.
    Married taxpayers add their income together and pay taxes on the total. Table
    4 gives the tax rate computations, using a simplification of the schedules in
    effect for the 2008 tax year. A different tax rate applies to each “bracket”.
    In this schedule, the income at the first bracket is taxed at 10 percent, and
    the income at the second bracket is taxed at 25 percent. The income limits for
    each bracket depend on the marital status.


    Nested decisions are required for problems that have two levels of decision making.


    Now compute the taxes due, given a filing status and an income figure. The key
    point is that there are two *levels* of decision making. First, you must branch
    on the marital status. Then, for each filing status, you must have another branch
    on income level.


    **Table 4 Federal Tax Rate Schedule**


    | If your status is Single and if the taxable income is | the tax is | of the
    amount over |

    |---|---|---|

    | at most $32,000 | 10% | $0 |

    | over $32,000 | $3,200 + 25% | $32,000 |

    | If your status is Married and if the taxable income is | the tax is | of the
    amount over |

    | at most $64,000 | 10% | $0 |

    | over $64,000 | $6,400 + 25% | $64,000 |


    The two-level decision process is reflected in two levels of if statements in
    the program at the end of this section. (See Figure 4 for a flowchart.)


    ![](img/23fb3582e93ebc95909e1de029c3d388_121_0.png)


    *Computing income taxes requires multiple levels of decisions.*'
