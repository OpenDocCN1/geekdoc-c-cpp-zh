  md: '# ### WORKED EXAMPLE 8.1 Looking for Duplicates


    This Worked Example processes a file to locate lines that contain repeated words.


    # # 8.6 Random Access and Binary Files


    In the following sections, you will learn how to read and write data at arbitrary
    positions in a file, and how to edit image files.


    # ## 8.6.1 Random Access


    > > You can access any position in a random access file by moving the file pointer
    prior to a read or write operation.


    So far, you’ve read from a file an item at a time and written to a file an item
    at a time, without skipping forward or backward. That access pattern is called
    sequential access. In many applications, we would like to access specific items
    in a file without first having to read all preceding items. This access pattern
    is called random access (see Figure 3). There is nothing “random” about random
    access—the term means that you can read and modify any item stored at any location
    in the file.


    Only file streams support random access; the cin and cout streams, which are attached
    to the keyboard and the terminal, do not. Each file stream has two special positions:
    the get position and the put position (see Figure 4). These positions determine
    where the next character is read or written.


    The following function calls move the get and put positions to a given value,
    counted from the beginning of the stream.


    ```

    ```

    strm.seekg(position);

    strm.seekp(position);

    ```

    ```


    To determine the current values of the get and put positions (counted from the
    beginning of the file), use


    ```

    ```

    position = strm.tellg();

    position = strm.tellp();

    ```

    ```


    # ## 8.6.2 Binary Files


    Many files, in particular those containing images and sounds, do not store information
    as text but as binary numbers. The numbers are represented as sequences of


    ![](img/23fb3582e93ebc95909e1de029c3d388_399_0.png)


    ![](img/23fb3582e93ebc95909e1de029c3d388_399_1.png)'
