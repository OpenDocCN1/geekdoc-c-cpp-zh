    \ the decimal point.\n\n**Practice It** Now you can try these exercises at the\
    \ end of the chapter: R8.9, P8.10, P8.13.\n\n# # 8.5 Command Line Arguments\n\n\
    Depending on the operating system and C++ development environment used, there\
    \ are different methods of starting a program—for example, by selecting “Run”\
    \ in the compilation environment, by clicking on an icon, or by typing the name\
    \ of the program at a prompt in a command shell window. The latter method is called\
    \ “invoking the program from the command line.” When you use this method, you\
    \ must type the name of the program, of course, but you can also type in additional\
    \ information that the program can use. These additional strings are called command\
    \ line arguments. For example, if you start a program with the command line\n\n\
    ```\n```\nprog -v input.dat\n```\n```\n\nthen the program receives two command\
    \ line arguments: the strings “-v” and “input.dat”. It is entirely up to the program\
    \ what to do with these strings. It is customary to interpret strings starting\
    \ with a hyphen (-) as options and other strings as file names.\n\n> > Programs\
    \ that start from the command line can receive the name of the program and the\
    \ command line arguments in the main function.\n\nTo receive command line arguments,\
    \ you need to define the `main` function in a different way. You define two parameter\
    \ variables: an integer and an array of string literals of type `char*`.\n\n```\n\
    ```cpp\nint main(int argc, char* argv[])\n{\n   . . .\n}\n```\n```\n\nHere `argc`\
    \ is the count of arguments, and `argv` contains the values of the arguments.\
    \ In our example, `argc` is 3, and `argv` contains the three strings\n\n```\n\
    ```\nargv[0]:   \"prog\"\nargv[1]:   \"-v\"\nargv[2]:   \"input.dat\"\n```\n```\n\
    \nNote that `argv[0]` is always the name of the program and that `argc` is always\
    \ at least 1."
