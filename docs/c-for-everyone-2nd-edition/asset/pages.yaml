    \ = purchase price + operating cost\n~~~\n```\n\nafter you have computed operating\
    \ cost. Here is the algorithm for deciding which car to buy:\n\n```\n~~~text\n\
    For each car, compute the total cost as follows:\n    annual fuel consumed = annual\
    \ miles driven / fuel efficiency\n    annual fuel cost = price per gallon x annual\
    \ fuel consumed\n    operating cost = 10 x annual fuel cost\n    total cost =\
    \ purchase price + operating cost\nIf total cost1 < total cost2\n    Choose car\
    \ 1.\nElse\n    Choose car 2.\n~~~\n```\n\n# ### Step 4\n\nTest your pseudocode\
    \ by working a problem. We will use these sample values:\n\n+   - Car 1: $25,000,\
    \ 50 miles/gallon\n+   - Car 2: $20,000, 30 miles/gallon\n\nHere is the calculation\
    \ for the cost of the first car:\n\n```\n~~~text\nannual fuel consumed = annual\
    \ miles driven / fuel efficiency = 15000 / 50 = 300\nannual fuel cost = price\
    \ per gallon x annual fuel consumed = 4 x 300 = 1200\noperating cost = 10 x annual\
    \ fuel cost = 10 x 1200 = 12000\ntotal cost = purchase price + operating cost\
    \ = 25000 + 12000 = 37000\n~~~\n```\n\nSimilarly, the total cost for the second\
    \ car is $40,000. Therefore, the output of the algorithm is to choose car 1.\n\
