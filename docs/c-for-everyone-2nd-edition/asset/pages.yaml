  md: "# Local Variables\n\nDo not define all local variables at the beginning of\
    \ a block. Define each variable just before it is used for the first time.\n\n\
    Every variable must be either explicitly initialized when defined or set in the\
    \ immediately following statement (for example, through a >> instruction).\n\n\
    ```\n```cpp\nint pennies = 0;\n```\n```\n\nor\n\n```\n```cpp\nint pennies;\ncin\
    \ >> pennies;\n```\n```\n\nMove variables to the innermost block in which they\
    \ are needed:\n\n```\n```cpp\nwhile (...)\n{\n    double xnew = (xold + a / xold)\
    \ / 2;\n    ...\n}\n```\n```\n\nDo not define two variables in one statement:\n\
    \n```\n```cpp\nint dimes = 0, nickels = 0; // Don’t\n```\n```\n\nWhen defining\
    \ a pointer variable, place the * with the type, not the variable:\n\n```\n```cpp\n\
    Link* p; // OK\n```\n```\n\nnot\n\n```\n```cpp\nLink *p; // Don’t\n```\n```\n\n\
    # Constants\n\nIn C++, do not use #define to define constants:\n\n```\n```cpp\n\
    #define CLOCK_RADIUS 5 // Don't\n```\n```\n\nUse const instead:\n\n```\n```cpp\n\
    const double CLOCK_RADIUS = 5;  // The radius of the clock face\n```\n```\n\n\
    You may not use magic numbers in your code. (A magic number is an integer constant\
    \ embedded in code without a constant definition.) Any number except 0, 1, or\
    \ 2 is considered magic:\n\n```\n```cpp\nif (p.get_x() < 10)  // Don't\n```\n\
    ```\n\nUse a const variable instead:\n\n```\n```cpp\nconst double WINDOW_XMAX\
    \ = 10;\nif (p.get_x() < WINDOW_XMAX)  // OK\n```\n```\n\nEven the most reasonable\
    \ cosmic constant is going to change one day. You think there are 365 days per\
    \ year? Your customers on Mars are going to be pretty unhappy about your silly\
    \ prejudice."
  merge: -1
