  md: "After you delete a memory block, you can no longer use it. The storage space\
    \ may already be used elsewhere.\n\n```\n```cpp\ndelete[] account_array;\naccount_array[0]\
    \ = 1000; // NO! You no longer own the memory of account_array\n```\n```\n\nHeap\
    \ arrays have one significant advantage over array variables. If you declare an\
    \ array variable, you must specify a fixed array size when you compile the program.\
    \ But when you allocate an array on the heap, you can choose the size at run time.\n\
    \nMoreover, if you later need more elements, you are not stuck. You can allocate\
    \ a bigger heap array, copy the elements from the smaller array into the bigger\
    \ array, and delete the smaller array (see Figure 7):\n\n```\n```cpp\ndouble*\
    \ bigger_array = new double[2 * n];\nfor (int i = 0; i < n; i++)\n{\n    bigger_array[i]\
    \ = account_array[i];\n}\ndelete[] account_array;\naccount_array = bigger_array;\n\
    n = 2 * n;\n```\n```\n\nThis is exactly what a vector does behind the scenes.\n\
    \nHeap allocation is a powerful feature, but you must be very careful to follow\
    \ all rules precisely:\n\n+   * Every call to new must be matched by exactly one\
    \ call to delete.\n+   * Use delete[] to delete arrays.\n+   * Don't access a\
    \ memory block after it has been deleted.\n\nIf you don't follow these rules,\
    \ your program can crash or run unpredictably. Table 5 shows common errors.\n\n\
    ![](img/23fb3582e93ebc95909e1de029c3d388_353_0.png)\n\nBe sure to recycle any\
    \ heap memory that your program no longer needs.\n\n![](img/23fb3582e93ebc95909e1de029c3d388_353_1.png)\n\
    \nFigure 7 Growing a Dynamic Array"
