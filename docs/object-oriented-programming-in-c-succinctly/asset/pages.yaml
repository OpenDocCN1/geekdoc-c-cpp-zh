  md: "The problem here is that if we choose one API, we can't easily replace it with\
    \ the other.\nSqlServerApi works with DataTables while Oracle works with objects,\
    \ the methods have different names, and so on. In the real world you'll find both\
    \ interfaces use different classes, have many different methods (that the other\
    \ doesn't have), and more. So let's create an interface that can tie these two\
    \ incompatible API's together. The problem is what we'll do with the DataTables.\
    \ Our interface can work with DataTables and we should make that we work for Oracle,\
    \ or we work with objects and convert it to DataTables for SQL Server. A third\
    \ option is to create a custom object which can be converted to that plain object\
    \ and a DataTables. For simplicity we will work with object.\n\n# Code List 51:\
    \ IdBApiAdapter\n\n```\npublic interface IdBApiAdapter\n{\n    object GetData();\n\
    \    void SendData(object data);\n}\n```\n\nNow we can implement this for both\
