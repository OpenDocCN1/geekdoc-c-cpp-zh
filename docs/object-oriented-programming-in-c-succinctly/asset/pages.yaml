  md: '# More Patterns


    The patterns discussed so far are "classic" patterns that were systematically
    described in the book Design Patterns: Elements of Reusable Object-Oriented Software.
    However, there are many more Design Patterns. Many of these are discussed in the
    book Patterns of Enterprise Application Architecture by Martin Fowler³ (in Java).
    The patterns discussed in Fowler''s book cover different areas of your code, such
    as patterns specific for your domain logic, communication with your data source,
    concurrency and web session. I will discuss a few of these patterns that are widely
    known and used.


    Martin Fowler uses a lot of UML sequence diagrams. Like UML class diagrams, sequence
    diagrams are outside the scope of the book, but I will add them for reference
    and visual explanation.


    # Lazy Load


    ![](img/a03594f8f44c9d45de3912512db3a264_66_0.png)


    Figure 16: Sequence Diagram of the Lazy Load Pattern


    The Lazy Load Pattern is about not getting data until you actually use it. It
    comes in four flavors: lazy initialization, virtual proxy, value holder, and ghost.
    We''ll look at lazy initialization only, as it''s the most common and discussing
    all of them takes up too much space. I also want to discuss this one because it
    has become more and more relevant and widely used. Functional languages, such
    as Haskell, have a default lazy loading strategy for everything. Such practices
    are becoming more common in .NET as well.


    > ³ Martin Fowler - Patterns of Enterprise Application Architecture'
