  md: "# # Chapter 3 SOLID\n\nWe've seen the building blocks that make up an object-oriented\
    \ language, but how can we write our classes so that they make sense? When to\
    \ inherit, what to put inside a class, how many interfaces do we need? These are\
    \ questions that can be answered in part by the so-called SOLID principles. SOLID\
    \ is an acronym and each letter stands for a principle.\n\n+   * Single Responsibility\
    \ Principle (SRP)\n* Open Closed Principle (OCP)\n* Liskov Substitution Principle\
    \ (LSP)\n* Interface Segregation Principle (ISP)\n* Dependency Inversion Principle\
    \ (DIP)\n\nIn this chapter we're going to look at all of them. These principles\
    \ can help you write modular code that is easy to maintain and expand. The principles\
    \ are described by Robert C. Martin in his 2006 book Agile Principles, Patterns,\
    \ and Practices in C#.\n\n# # Single Responsibility Principle, (SRP)\n\nThe Single\
    \ Responsibility Principle, or SRP, states that a class should be responsible\
    \ for a single functionality. A functionality can be considered a reason to change.\
    \ For example, a class that logs errors to a database can change because the database\
    \ communication should change, or because the format of the log output needs to\
    \ change. So more generally, a class should have only one reason to change. That's\
    \ a little tricky; after all, each line of code could be changed at one time or\
    \ another. And indeed, I have met programmers who believe a class should contain\
    \ only a single method. That's really what SRP is about!\n\nLet's look at a concrete\
    \ example. Say you're building a database module. Now you've got a class that\
    \ can establish a connection to the database, get send data, and finally close\
    \ the connection. If we defined an interface it could follows:\n\n> Code Listing\
    \ 23: A Possible Violation of SRP\n\n```\npublic interface Database {\n    void\
    \ Connect(string connectionString);\n    void Close();\n    object GetData();\n\
    \    void SendData(object data);\n}\n```\n\n¹ R.C. Martin, M. Martin - Agile Principles,\
    \ Patterns and Practices in C#"
  merge: -1
  pgno: 25
- img_proc: true
  md: "So this could really be the interface to your class, right? Unfortunately,\
    \ this class is doing two things. The class deals with opening and closing connections\
    \ and with data communication. Here comes the tricky part, the question you ask\
    \ yourself is: will the application change in a way that either connections or\
    \ data communications will, but not both? This is important, because when the\
    \ time comes and you realize you need to change one of the functionalities, the\
    \ functionality that doesn't need to change will be in the way. The more functionality\
    \ that is in the way, the more chances you have of having those parts of the application.\n\
    \nWhen applying SRP, your classes will be a smaller and more maintainable, but\
    \ you'll have more classes to deal with. Would you rather change, a class with\
    \ 200 lines of code that does multiple things, or a class with 100 lines of code\
    \ that does only one?\n\nAs you see, there is no wrong or right in SRP. It's a\
    \ bit of a gut feeling. If you feel a class is to bloated, then identifying different\
    \ responsibilities gives each their own class.\n\n# Open Closed Principle (OCP)\n\
    \nWithout a doubt, one of the hardest to grasp and get right is the Open Closed\
    \ Principle, or OCP: \"Open Closed\" means that a class should be open for extension,\
    \ but closed for modification. That means consumers of your class should be able\
    \ to customize its usage, without actually changing its code. And unless your\
    \ coworkers are working in the same solution consumers of your class, even they\
    \ probably can't change the source of your class.\n\nLet's say you have that database\
    \ we talked about. In a sense it's already extensible, since everyone can inherit\
    \ from it and add methods and properties. Doing so will almost certainly result\
    \ in breaking SRP though, since the core functionality of the class is already\
    \ defined in the base class and we can't change that. You could make every method\
    \ in the base class virtual, and yet we've seen that that's not really good practice\
    \ as consumers now break your class. For example, if they override Connect and\
    \ just leave it, no connection will be made and each subsequent method call to\
    \ your class will fail. Besides, even if the method is overridden the base class\
    \ will not be sitting there just doing, which doesn't feel right.\n\nI propose\
    \ a different solution, one of many. Let's break up the previously proposed interface\
    \ into two separate interfaces. You'll probably need some more methods now, but\
    \ let's stick to simplicity for now.\n\nCode 24: SRP for OCP\n\n```\npublic interface\
    \ IConnectionManager {\n    void Connect(string connectionString);\n    void Close();\n\
    }\n\npublic interface IDataManager {\n    object GetData(IConnectionManager connManager);\n\
    }\n```"
  merge: -1
  pgno: 26
- img_proc: true
  md: "```\nvoid SendData(IConnectionManager connManager, object data);\n}\n```\n\n\
    Now suppose I'd like to change the way I connect to the database. I can implement\
    \ my own IConnectionManager and pass it to my IDataManager. Without touching the\
    \ original code, I am now able to extend the functionality of the classes without\
    \ actually breaking the existing class! Likewise, if I'd like to change the way\
    \ I'm getting or sending data I can simply implement my own IDataManager and use\
    \ it with the already existing implementation of IConnectionManager.\n\nIt gets\
    \ better, every class that depends on IConnectionManager and/or IDataManager is\
    \ now extendable in that it can use any database you can ever imagine! Well, theoretically.\n\
    \nLater we'll look at Design Patterns, which can help you in designing classes\
    \ that conform to OCP.\n\n# Liskov Substitution Principle (LSP)\n\nThe Liskov\
    \ Substitution Principle, LSP for short, is about inheritance. It states that\
    \ subclasses and base classes must be substitutable. That means that any method\
    \ of any base type must not know if it's using a base class or any subclass. Here's\
    \ an example of what you wouldn't do (although I've written code just like this\
    \ in the past):\n\n> Code Listing 25: Violation of LSP\n\n```\nbool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    if (connMgr is SQLConnectionManager)\n    {\n        // Do\
    \ something...\n    }\n    else if (connMgr is OracleConnectionManager)\n    {\n\
    \        // Do something else...\n    }\n    else\n    {\n        // ...\n   \
    \ }\n}\n```\n\nTestConnection is a function that receives an object of type IConnectionManager,\
    \ which could be any connection manager. In this case, the method checks for the\
    \ type of connMgr and acts accordingly. That means for every new implementation\
    \ of IConnectionManager, you need to change this method. Furthermore, you've just\
    \ violated OCP as this function is now unable to test new connection types. There's\
    \ plenty of ways to fix this, like using a Strategy Pattern, but we'll get to\
    \ that in a later chapter. In the above method it should always be good enough\
    \ to invoke the Connect() or Close() method, no matter what IConnectionManager\
    \ you get."
