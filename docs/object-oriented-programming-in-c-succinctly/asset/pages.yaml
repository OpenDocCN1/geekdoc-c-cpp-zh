  md: "![](img/a03594f8f44c9d45de3912512db3a264_79_0.png)\n\nIn this design the **Program**\
    \ depends upon **SqlServerApiAdapter** and the **SqlServerApiAdapter** depends\
    \ upon **SqlServerApi**. Now if **SqlServerApi** changes we only need to change\
    \ **SqlServerApiAdapter**. Of course, if the change in **SqlServerApi** causes\
    \ another (breaking) change in **SqlServerApiAdapter** we need to change **Program**\
    \ too.\n\nAs you see, the Low Coupling principle can be used to compare different\
    \ design solutions and we should, in most situations, pick the design which has\
    \ the lowest coupling between classes. Because Information Expert guides you in\
    \ finding the class that has all the necessary information for a certain responsibility,\
    \ it helps lead to a design with the least coupling.\n\n# # High Cohesion\n\n\
    Cohesion is the degree to which elements of a class belong together. The High\
    \ Cohesion Principle states that a class' cohesion should be high. In other words,\
    \ the methods and properties of a class should belong together. Let's look at\
    \ another example. Suppose we have a **Person** class with some properties and\
    \ methods:\n\nCode Listing 96: A Person Class\n\n```\npublic class Person {\n\
    \    public string FirstName { get; set; }\n}\n```"
