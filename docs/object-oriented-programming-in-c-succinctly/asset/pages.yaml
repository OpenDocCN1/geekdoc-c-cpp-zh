  md: "# Aspect-Oriented Programming\n\nOOP is great for many things. One it isn't\
    \ very good at handling so-called cross-cutting concerns. A cross-cutting concern\
    \ is a general responsibility that is used throughout the application. Think of\
    \ logging, for example, which you might want to implement in just about any method\
    \ in every layer and project. The result is that all your methods start with something\
    \ like Log.Log(currentName, parameters). Another example is something like the\
    \ INotifyPropertyChanged and INotifyPropertyChanged interfaces in .NET. They can\
    \ be implemented on a class, which would then raise the PropertyChanging and PropertyChanged\
    \ events whenever a property changes. The implementation is rather tedious\n\n\
    Code List 108: INotifyPropertyChanged and INotifyPropertyChanged\n\n```\npublic\
    \ class SomeClass : INotifyPropertyChanged, INotifyPropertyChanged\n{\n    public\
    \ event PropertyChangedEventHandler PropertyChanged;\n    public event PropertyChangingEventHandler\
    \ PropertyChanging;\n\n    private int someProperty;\n    public int SomeProperty\n\
    \    {\n        get { return someProperty; }\n        set\n        {\n       \
    \     if (value != someProperty)\n            {\n                RaisePropertyChanging(\"\
    SomeProperty\");\n                someProperty = value;\n                RaisePropertyChanged(\"\
    SomeProperty\");\n            }\n        }\n    }\n\n    private void RaisePropertyChanging(string\
    \ propertyName)\n    {\n        if (PropertyChanging != null)\n        {\n   \
    \         PropertyChanging(this, new PropertyChangingEventArgs(propertyName));\n\
    \        }\n    }\n\n    private void RaisePropertyChanged(string propertyName)\n\
    \    {\n        if (PropertyChanged != null)\n        {\n            PropertyChanged(this,\
    \ new PropertyChangedEventArgs(propertyName));\n        }\n    }\n}\n```"
