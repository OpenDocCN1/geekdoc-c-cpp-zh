    \ the part that is not easily changed. Opinions on this vary, let's consider a\
    \ database. Many people point at the database, call it the heart of any system,\
    \ and tell you it's pretty hard to change later on in the development process.\
    \ We know, however, that we abstract away behind a Data Mapper and a Repository\
