  md: "# Template Method\n\n![](img/a03594f8f44c9d45de3912512db3a264_63_0.png)\n\n\
    Figure 15: Class Diagram of the Template Method\n\nThe Template Method Pattern\
    \ is really very simple. In fact, it' not much more than simple inheriting and\
    \ method overriding. It's the inheritance variant of the Strategy Pattern (Inheritance\
    \ vs. Delegation).\n\nLet's say we have a general pattern of connecting to a database,\
    \ constructing a query, executing the query, retrieving the results, and finally\
    \ closing the connection. We can quite literally write down this example without\
    \ worrying about the details.\n\nCode Listing 74: Template Method\n\n```\npublic\
    \ abstract class BaseDataRetriever {\n    public DataTable RetrieveData() {\n\
    \        Connect();\n        string query = GetQuery();\n        DataTable result\
    \ = ExecQuery(query);\n        Close();\n        return result;\n    }\n\n   \
    \ protected abstract void Connect();\n    protected abstract string GetQuery();\n\
    \    protected abstract DataTable ExecQuery(string query);\n    protected abstract\
    \ void Close();\n}\n```\n\nLet's say we need to retrieve the Product table from\
    \ a SQL Server database. We can inherit the BaseDataRetriever and fill in the\
    \ blanks."
