  md: "```\npublic class DataManager : ConnectionManager\n{\n    public virtual object\
    \ GetData()\n    {\n        // ...\n    }\n    public virtual void SendData(object\
    \ data)\n    {\n        // ...\n    }\n}\npublic class DatabaseManager : DataManager\n\
    {\n    // Needs ConnectionManager...\n}\n```\n\nSo our DatabaseManager is inheriting\
    \ ConnectionManager, through DataManager, to make use of, of course, its base\
    \ implementation, but also to make of multipurpose functions as TestConnection\
    \ defined earlier. Can we be sure that all data managers need connection managers\
    \ though? We could even use composition to, the DatabaseManager needs it, but\
    \ what about our?\n\nCode Listing 29: FileDataManager\n\n```\npublic class FileDataManager\
    \ : DataManager\n{\n    // Doesn't need Connection...\n```\n\nNow our FileDataManager\
    \ has a fat interface. It depends on classes it doesn't need Notice that this\
    \ would not have happened if we created two Interfaces and implemented those instead.\
    \ We could use re-use the ConnectionManager in other Data(base)Managers. The downside\
    \ to this is FileDataManager now depends upon ConnectionManager, even though it\
    \ doesn't need it. Any change to ConnectionManager may break FileDataManager though!\
    \ Such couplings between classes should be avoided\n\n# Dependency Inversion Principle\
    \ (DIP)\n\nThe Dependency Inversion Principle, DIP for short, states that you\
    \ should depend on abstractions instead of concrete types. This one principle\
    \ you're going to see a lot which is pretty hard to put into practice (correctly).\
    \ Let's consider our TestConnection method again. We could create one for SqlDatabaseManager,\
    \ as in the following example:\n\nCode Listing 30: A Violation of DIP\n\n```\n\
    class Program\n{\n    ///...\n```"
