  md: "# Code Listing 21: Explicitly Implemented Interface\n\n```\npublic interface\
    \ ISomeInterface\n{\n    void MethodA();\n    void MethodB();\n}\npublic class\
    \ SomeClass : ISomeInterface\n{\n    public void MethodA() {\n        // Even\
    \ SomeClass cannot invoke MethodB without a cast.\n        ISomeInterface me =\
    \ (ISomeInterface)this;\n        me.MethodB();\n    }\n    // Explicitly implemented\
    \ interface member.\n    // Not visible in SomeClass.\n    void ISomeInterface.MethodB()\
    \ {\n        throw new NotImplementedException();\n    }\n}\n```\n\nUsers of SomeClass\
    \ cannot invoke MethodB either.\n\n```\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        SomeClass o = new SomeClass();\n        o.MethodA();\n\
    \        o.M\n    }\n}\n```\n\n| | |\n|---|---|\n| Equals | |\n| GetHashCode |\
    \ |\n| GetType | |\n| MethodA | void SomeClass.MethodA() |\n| ToString | |\n\n\
    Figure 1: MethodB is not accessible.\n\nUnless they use it, or cast it to, ISomeInterface.\n\
    \n# Code Listing 22: Invoking an Explicitly Implemented Member\n\n```\nISomeInterface\
    \ obj = new SomeClass();\nobj.MethodA();\nobj.MethodB();\n```"
