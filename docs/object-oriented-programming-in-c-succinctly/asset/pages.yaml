  md: '# Acyclic Dependencies Principle (ADP)


    The Acyclic Dependency Principle is reality an issue in C# and Visual Studio.
    According to this principle, packages cannot depend upon packages that depend
    upon them, creating a cycle in your dependencies. Making such dependencies is
    not possible in Visual Studio, though. If you attempt to compile .NET code that
    violates the ADP, you''ll get an error with a message that complains you are creating
    a circular reference. Let''s dig into it a little deeper anyway. Suppose you have
    four packages: Data, Business, UIComponents, and UI. UI depends upon Business
    and UIComponents, and Business depends upon Data.


    ![](img/a03594f8f44c9d45de3912512db3a264_86_0.png)


    Figure 23: Dependencies without Cycles


    If Business changes we know UI depends on it, so we should check whether UI still
    works. We know that UIComponents and Data remain unaltered though. Likewise, if
    Data changes we know we should check Business and UI, but not UIComponents.


    Now suppose Data depends upon UI.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '![](img/a03594f8f44c9d45de3912512db3a264_87_0.png)


    We have now created a cycle. If Business changes now we should check if UI still
    works, but because Data now depends upon UI we should also check Data. If UIComponents
    changes, you have to revalidate every package. This is tiresome for four packages,
    but in a real world application with tens of packages it is pretty much undoable.
    In any case, it''s very poor design and prohibited by Visual Studio.


    # Stable Dependencies Principle (SDP)


    Some packages are written once and regularly updated, while other packages change
    frequently. Think of the user interface: every new feature to an application needs
    a change in the user interface to support that feature. Your Data Mapper, hopefully,
    changes a lot less often. If a package rarely changes, it is said to be stable.
    According to the Stable Dependencies Principle, stable packages should not depend
    upon unstable packages. That makes sense because every time a dependency is updated,
    we should validate a package. That means if a dependency changes often, we should
    validate often. By that logic a package is only as stable as the least stable
    package it depends upon, so stable packages should not depend upon less stable
    packages.


    # Stable Abstractions Principle (SAP)


    For packages to be stable it is necessary that these packages have a certain level
    of abstraction. Without abstraction these packages could not be easily changed
    or extended rendering them unchangeable or unstable. We have already seen how
    we can create extendable software by using interfaces, inheritance, and SOLID
    principles.'
