  md: "```\nreturn true;\n}\n```\n\nUsing Unity, we can register either SqlConnectionManager\
    \ or OracleConnectionManager with IConnectionManager:\n\n# Code Listing 34: Registering\
    \ a Type with Unity\n\n```\nclass Program\n{\n    static void Main(string[]) args\n\
    {\n        // Create a new DI Container...\n        IUnityContainer container\
    \ = new UnityContainer();\n        //And Register a type!\n        container.RegisterType<IConnectionManager,\
    \ SqlConnectionManager>();\n    }\nn\n```\n\nAnd elsewhere we can now request\
    \ an IConnectionManager and call TestConnection:\n\n# Code Listing 35: Resolving\
    \ a Type with Unity\n\n```\nIConnectionManager connMgr = container.Resolve<IConnectionManager>();\n\
    bool success = TestConnection(connMgr);\n// Do something with the result...\n\
    ```\n\nYou should see \"Connected to SQL Server\" and \"Closed SQL connection...\"\
    \ in your console window. Now change the call to RegisterType so it registers\
    \ as OracleConnectionManager. The TestConnection will now print Oracle instead\
    \ of SQL Server. Imagine: by changing this line of code you could change an entire\
    \ application to use Oracle instead of SQL Server!\n\nNow suppose you have some\
    \ dynamic user interface and the controls that are shown on screen depend on some\
    \ settings and/or configuration. Let's see how HTML form defined in the database,\
    \ and we wish to generate the HTML server side. I'm letting you to figure one\
    \ out yourself, but I'm pretty sure you'll get it.\n\n# Code Listing 36: HTML\
