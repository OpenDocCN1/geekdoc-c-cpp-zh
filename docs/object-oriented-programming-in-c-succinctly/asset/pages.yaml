  md: '# Layers and Tiers


    You will often hear the terms layered or tiered software design. A layer is a
    level of abstraction A tier is a physical separation between software responsibilities.
    A client-server solution, for example, is a 2-tier architecture. If you decide
    to throw in an extra server for some business logic, you have created a 3-tier
    architecture. N-tier architecture is relatively easy in object-oriented programming
    because modules can be reused on different tiers. When you practice the principles
    laid out in this book your layered architecture will come along naturally. A well-known
    layered structure is that of the OSI model, a model for describing the different
    layers of the Internet. Simply put, your browser has no idea how to send bits
    and bytes over a line, nor does your link know about any browser. Yet, through
    abstraction, both work together to present websites and applications. The same
    principle goes for software. Your application has no knowledge of a database,
    yet through some IDataMapper interface, it is able to communicate with a data
    storage.


    Such a layer can easily be replaced without affecting the rest of the system.
    When you look at the Internet, you can easily switch from a dial-up connection
    to ADSL to cable to wireless. No need to replace your browser or your computer.
    Likewise, TCP/IP, the protocol used to send and receive data on the Internet,
    can be switched for UDP. In your application, you can switch your databases, rebuild
    your user interface, without touching the rest of the system (given that you''ve
    successfully separated concerns in different layers).


    A common layered or tiered architecture may look as follows:


    | Application | | |

    |---|---|---|

    | Presentation | HTML, CSS, JavaScript | WinForms, WPF |

    | Business | Business Logic | |

    | | | Domain Models |

    | Data Access | Database | Web Service |


    > Figure 25: Common Layers or Tiers'
