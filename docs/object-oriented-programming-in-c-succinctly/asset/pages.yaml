  md: "# Chapter 2 Interfaces\n\nIn the previous chapter, we saw that the class Employee\
    \ inherits from Person. Do you see any potential issues with this approach? What\
    \ if a person is an employee, but also a stamp collector? Obviously, a person\
    \ can also be a stamp collector but not an employee (lots of people are “between\
    \ jobs”). If we all had inheritance we might write the following code:\n\n> Code\
    \ Listing 15: An inheritance chain\n\n```\npublic class Person {\n  // ...\n}\n\
    public class Employee : Person {\n  // ...\n}\npublic class StampCollector : Person\
    \ {\n  // ...\n}\npublic class EmployeeStampCollector : Employee {\n  // ...\n\
    }\n```\n\nI don't know about you, but it just doesn't feel right to me. The problem\
    \ we have is that the only thing EmployeeStampCollector and the StampCollector\
    \ have in common is the Person base class, but they're still stamp collectors!\
    \ Writing a method that takes a stamp collector as input is not impossible! This\
    \ problem could be solved using multiple inheritance, but C# doesn't have (and\
    \ many developers say it is better that way).\n\nSo do we solve this problem?\
    \ We use a Interface. An Interface is something like an abstract class with abstract\
    \ methods. It really doesn't do more than defining a type. The good part though,\
    \ is we can inherit, or ‘implement’, multiple interfaces in a single class!\n\n\
    Let's look at an example of a random interface:\n\n> Code Listing 16: An interface\n\
    \n```\npublic interface ISomeInterface {\n  string SomeProperty { get; set; }\n\
    \  string SomeMethod();\n  void SomethingElse();\n}\n```"
  merge: -1
  pgno: 19
- img_proc: true
  md: "Notice that none of the fields have an access modifier. If a class implements\
    \ an interface everything on that interface is publicly accessible. This is what\
    \ the actual implementation would look like:\n\n# Code Listing 17: Interface implementation\n\
    \n```\npublic class SomeClass : ISomeInterface\n{\n    public string SomeProperty\
    \ { get; set; }\n\n    public string SomeMethod() {\n        // ...\n    }\n\n\
    \    public void SomethingElse() {\n        // ...\n    }\n}\n```\n\nHere SomeClass\
    \ has the types object, SomeClass, and ISomeInterface. The \"I\" prefix on ISomeInterface,\
    \ or any interface, is common practice in C#, but not necessary.\n\nWhen using\
    \ inheritance and interface implementation on a single class, you first specify\
    \ the base class and then a comma-separated list of interfaces. How would this\
    \ look for our Person, Employee and StampCollector example?\n\n# Code Listing\
    \ 18: Interfaces\n\n```\npublic interface IEmployee\n{\n    // ...\n}\n\npublic\
    \ interface IStampCollector\n{\n    // ...\n}\n\npublic class Person\n{\n    //\
    \ ...\n}\n\npublic class Employee : Person, IEmployee\n{\n    // ...\n}\n\npublic\
    \ class StampCollector : Person, IStampCollector\n{\n    // ...\n}\n\npublic class\
    \ EmployeeStampCollector : Employee, IStampCollector\n```"
  merge: -1
  pgno: 20
- img_proc: true
  md: "```\n{\n  // ...\n}\n```\n\nNow both StampCollector and EmployeeStampCollector\
    \ are of type Person and type IStampCollector. EmployeeStampCollector is also\
    \ of type Employee (and IEmployee) because it inherits from Employee, which implements\
    \ IEmployee.\n\nBecause a class can implement multiple interfaces it is possible\
    \ to have an interface inherit from multiple interfaces. A class must then implement\
    \ all interfaces that are inherited by it. For obvious reasons, an interface can't\
    \ inherit a class.\n\nCode Listing 19: Interface inheritance\n\n```\npublic interface\
    \ IPerson {\npublic interface IEmployee : IPerson {\n}\\public interface IStampCollector\
    \ : IPerson {\n}\\public interface IEmployeeStampCollector : IEmployee, IStampCollector\
    \ {\n}\n```\n\nNow that's a very theoretical example, but let's consider a real\
    \ world example. Let's say an application needs to log some information. We may\
    \ want to log to a database in a production environment, but we'd also like to\
    \ log to the console for debugging purposes. Additionally, if the database isn't\
    \ available, we'd like to log to the Windows Event log.\n\nCode Listing 20: Loggers\n\
    \n```\nclass Program {\nstatic void Main(string[] args) {\nList<ILogger> loggers\
    \ = new List<ILogger>();\nloggers.Add(new ConsoleLogger());\nloggers.Add(new WindowsLogger());\n\
    loggers.Add(new DatabaseLogger());\nforeach (ILogger logger in loggers) {\nlogger.LogError(\"\
    Some error occurred.\");\nlogger.LogInfo(\"All's well!\");\n}\nConsole.ReadKey();\n\
    }\npublic interface ILogger {\nvoid LogError(string error);\nvoid LogInfo(string\
    \ info);\n}\npublic class ConsoleLogger : ILogger {\n}\n```"
