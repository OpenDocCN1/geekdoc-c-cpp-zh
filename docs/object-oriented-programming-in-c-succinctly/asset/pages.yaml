  md: "# Code Listing 84: The Model\n\n```\npublic class PersonModel {\n    public\
    \ string FirstName { get; set; }\n    public string LastName { get; set; }\n}\n\
    ```\n\nNext, I'm going to change the HomeController so it will pass a PersonModel\
    \ to the View.\n\n# Code Listing 85: The Controller\n\n```\npublic class HomeController\
    \ : Controller {\n    public ActionResult Index() {\n        PersonModel model\
    \ = new PersonModel();\n        model.FirstName = \"Bill\";\n        model.LastName\
    \ = \"Gates\";\n        return View(model);\n    }\n}\n```\n\nAnd finally I'm\
    \ going to change the Home/Index View (which isn't exactly valid HTML, but it'll)\
    \ so it will show the data in the Model.\n\n# Code Listing 86: The View\n\n```\n\
    @using MyMvcApp.Models\n@model PersonModel\n```\n\n<p>The person that was passed\
    \ in the PersonModel is: @Model.FirstName @Model.LastName</p>\n\nAnd that will\
    \ show the following web page:\n\n![](img/a03594f8f44c9d45de3912512db3a264_70_0.png)\n\
    \nThe person that was passed in the PersonModel is: Bill Gates\n\n# Figure 19:\
    \ The Resulting View\n\nIf you change the name in the Controller to something\
    \ else it will be reflected in the View. You don't have to change the Model or\
    \ the View. To recap, a user requests a View from the Controller. The Controller\
    \ (optionally) creates a Model, passes it to the View, and returns the View. The\
    \ View displays the data on the screen.\n\nTwo Design Patterns related to MVC\
    \ are Model View ViewModel (MVVM) and Model View Presenter (MVP)."
