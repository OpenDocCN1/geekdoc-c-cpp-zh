  md: '# Behavioral Patterns


    Behavioral Patterns are about changing runtime behaviors of algorithms and classes.
    If Creational Patterns are about the creation of objects, and Structural Patterns
    about how the objects work together, Behavioral Patterns are about changing the
    implementation of those objects. With the three kinds of Patterns, you can build
    highly scalable and maintainable software that is nearly organized into small
    pieces of code.


    # Observer


    ![](img/a03594f8f44c9d45de3912512db3a264_54_0.png)


    Figure 13: Class Diagram of the Observer Pattern


    With the Observer Pattern it is possible for a class, a so-called observable,
    to notify other classes, of changes. .NET events are implemented using this pattern.


    A few notes regarding the Observer Pattern in .NET. First of all, because .NET
    already has events, it shouldn''t be necessary to implement this pattern yourself.
    Let''s assume for a moment that you still want to. You''re probably going to start
    out with two interfaces: IObservable and IObserver. Then you find out .NET already
    has interfaces (in a generic variant). Do not use them. I''ve seen the .NET interfaces
    being used in the Observer Pattern, but those interfaces are meant to be used
    primarily with Reactive Extensions (Rx). I can''t explain Rx here, but the interfaces
    make little sense for the "traditional" Observer Pattern I''m going to discuss
    this here.


    So let''s start out by defining the IObservable and IObserver interfaces.



    ```

    Code Listing 62: Observer Pattern Interfaces

    {


