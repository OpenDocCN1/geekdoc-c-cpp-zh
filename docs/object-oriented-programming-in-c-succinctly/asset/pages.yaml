  md: "# Singleton\n\n```\nSingleton\nstatic Instance()\nSingletonOperation()\nGetSingletonData()\n\
    static uniqueInstance\nsingletonData\nreturn uniqueInstance();\n```\n\nFigure\
    \ 9: Class Diagram of the Singleton Pattern\n\nThe Singleton Pattern is pretty\
    \ fun. It's also, but often implemented incorrectly. It's loved, and it's hated.\
    \ So, why do I want to include it here? The Singleton limits the amount of created\
    \ objects of a specific type to exactly one, which is pretty neat and can be necessary\
    \ (examples of Singletons are your print spooler, the file system, etc.). Also\
    \ since it's often used incorrectly, I'd like to educate a little and clear up\
    \ when to use this. Last, since it's so often incorrectly implemented, we're going\
    \ to do it correctly now, once and for all.\n\nAt the base of the Singleton is\
    \ a private constructor. You read that right. When the constructor of a class\
    \ is private no other class can create instances of this. That may come in handy,\
    \ as the class now create instances of itself and keep track of those instances.\
    \ That's a bit counter-intuitive, but with a static field completely possible.\n\
    \nCode Listing 47: The Start of a Singleton\n\n```\npublic class SomeSingleton\n\
    {\n    private static SomeSingleton instance;\n\n    private SomeSingleton()\n\
    \    }\n}\n```\n\nAt this point no other class can create or reach an instance\
    \ of this class. We'll need another static method (or property) to get access\
    \ to the instance of this class. We'll also need to create that instance.\n\n\
    Code Listing 48: The Complete Singleton\n\n```\npublic class SomeSingleton\n{\n\
    \    private static SomeSingleton instance;\n\n    private SomeSingleton()\n \
    \   }\n\n    public static SomeSingleton Instance\n    get\n    {\n        if\
    \ (instance == null)\n```"
  merge: -1
