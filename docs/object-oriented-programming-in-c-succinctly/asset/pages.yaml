  md: "A subtle violation of LSP is when subclasses behave differently than their\
    \ base classes. The classic example is that of a Square class that inherits from\
    \ a Rectangle class. A square is a rectangle (with equal width and height), so\
    \ this inheritance looks plausible. Unfortunately, in some scenarios a square\
    \ may behave differently than a rectangle and may break users of the Rectangle\
    \ class and get a Square instead.\n\n> Code Listing 26: Breaks with Square\n\n\
    ```\nvoid TestSquareMeters(Rectangle rect)\n{\n    rect.Height = 2;\n    rect.Width\
    \ = 3;\n    Assert(rect.Height * rect.Width == 6);\n}\n```\n\n# Interface Segregation\
    \ Principle (ISP)\n\nThe Interface Segregation Principle, or ISP, is kind of like\
    \ the Single Responsibility Principle for Interfaces. Strictly speaking, we're\
    \ not talking about the abstract-like Interfaces, but your class' public methods.\
    \ In C# practice, we're doing ISP mostly through Interfaces. Let me clear up.\
    \ Let's consider our database example for a second. We had the following interface:\n\
    \n> Code Listing 27: An IDatabase Interface\n\n```\npublic interface IDatabase\n\
    {\n    void Connect(string connectionString);\n    void Close();\n    object GetData();\n\
    \    void SendData(object data);\n}\n```\n\nAs I mentioned in the bit about SRP,\
    \ this may or may not be SRP-proof, depending on your requirements. Let's say\
    \ it is okay for our example, but let's take another approach, that of inheritance.\
    \ Specifically, I'm going to create a base class for connection management and\
    \ inherit that for data management.\n\n> Code Listing 28: DatabaseManager Using\
    \ Inheritance\n\n```\npublic class ConnectionManager\n{\n    public void Connect(string\
    \ connectionString)\n    {\n        // ...\n    }\n    public void Close()\n \
    \   {\n        // ...\n    }\n}\n```"
