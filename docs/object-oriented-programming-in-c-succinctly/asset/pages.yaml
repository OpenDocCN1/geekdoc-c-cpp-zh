- img_proc: true
  md: 'Is this going too far? Has the programmer lost himself in a sea of abstraction?
    You might be tempted to think so, but actually this is pretty smart. Imagine you
    have to run some tests on a class that gives different results dependent on the
    current time (or date). That''s not uncommon at all; maybe it''s a financial application
    that needs to get the exchange rate at a given date. So try testing if the codebase
    has DateTime.Now directly in the methods. With the INowResolver you can inject
    your now and test for yesterday, now, and tomorrow.


    Personally, I''ve never seen abstraction go too far. I have missed lots of abstractions
    though. Sure, having many unnecessary abstractions is hard to read, but missing
    abstractions is hard to maintain. So the only advice I can give here is to keep
    thinking, come up with different designs, compare them using the tools I''ve laid
    out in this book, and use your best judgement. Luckily, some of the harder decisions
    are already made for you by the framework or technology you choose for your next
    project.'
