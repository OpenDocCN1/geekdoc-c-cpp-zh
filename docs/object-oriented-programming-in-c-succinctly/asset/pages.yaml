  md: "The .NET Framework makes use of the Strategy Pattern as well, such as when\
    \ calling List<T>.Sort(). You can pass in an optional IComparer<T>. Let's check\
    \ out as it's another good example. We're going to sort people by their first\
    \ and last names.\n\n# Code Listing 72: Class Person and IComparer\n\n```\npublic\
    \ class Person\n{\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n}\n\npublic class FirstNameSorter : IComparer<Person>\n\
    {\n    public int Compare(Person x, Person y)\n    {\n        return x.FirstName.CompareTo(y.FirstName);\n\
    \    }\n}\n\npublic class LastNameSorter : IComparer<Person>\n{\n    public int\
    \ Compare(Person x, Person y)\n    {\n        return x.LastName.CompareTo(y.LastName);\n\
    \    }\n}\n```\n\nWe now create a list, put some people in it, and sort them by\
