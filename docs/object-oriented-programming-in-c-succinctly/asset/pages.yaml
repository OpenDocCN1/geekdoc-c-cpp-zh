  md: '# The Takeaway


    GRASP is really useful when designing classes. Unlike anything else we''ve seen
    so far, they aren''t of a very technical nature, and they don''t describe classes
    or methods. They describe how to get an efficient design for your software. This
    chapter has shown that there is not one design for an application. In fact, when
    we only had a Car and an Engine we already had two design choices (and even more
    less obvious ones). Keeping GRASP in mind, we can get to some design that''s at
