  md: "For the next example I'm going to use Unity, a DI library developed by Microsoft\
    \ and now maintained by other people. You can get it using the NuGet Package Manager\
    \ in Visual Studio. Just go to Tools > NuGet Package Manager > Manage NuGet Packages\
    \ for Solution and search for \"Unity\". Install it in your (saved) project and\
    \ you're good to go.\n\nA \"Container\", which Unity provides, is a sort of repository\
    \ where abstract types are mapped to concrete types. Any code can ask that repository\
    \ for an instance of an abstract type and the repository will return whatever\
    \ concrete type you've mapped to. Your entire code base, save for the part(s)\
    \ where you map your types, can now depend upon abstractions. Sounds pretty neat,\
    \ so let's have a look at some code;\n\nI've slightly modified the ConnectionManager\
    \ example from earlier:\n\nCode List 32: IConnectionManager\n\n```\npublic interface\
    \ IConnectionManager\n{\n    void Close();\n    void Connect();\n}\n\npublic class\
    \ SqlConnectionManager : IConnectionManager\n{\n    public void Close() {\n  \
    \      Console.WriteLine(\"Closed SQL server connection...\");\n    }\n\n    public\
    \ void Connect() {\n        Console.WriteLine(\"Connected to SQL Server!\");\n\
    \    }\n}\n\npublic class OracleConnectionManager : IConnectionManager\n{\n  \
    \  public void Close() {\n        Console.WriteLine(\"Closed Oracle connection...\"\
    );\n    }\n\n    public void Connect() {\n        Console.WriteLine(\"Connected\
    \ to Oracle!\");\n    }\nn\n```\n\nHere's the definition of TestConnection:\n\n\
    Code List 33: Definition for TestConnection\n\n```\nstatic bool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    connMgr.Connect();\n    connMgr.Close();\n\n```"
