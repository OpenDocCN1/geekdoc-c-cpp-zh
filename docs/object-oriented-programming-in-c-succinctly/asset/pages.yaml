  md: '# Packages


    By creating classes and methods, we can reuse our code throughout our application.
    Many times we want to reuse code between applications. One example is a tool,
    may be an XML or JSON parser, or a data mapper, that you''ve written and that
    you want to use in other applications as well. We''ve seen that copy/pasting,
    even between applications, is not practical. You can reuse these components by
    creating packages (Dynamic Link Libraries or DLL''s) that can be used by other
    applications. When you use .NET you are actually using packages Microsoft created.
    Just like class design there are some best practices when releasing and using
    packages. In his book Agile Principles, Patterns, and Practices in C#, Robert
    C. Martin discusses these practices^5I will quickly summarize them here.


    # Reuse/Release Equivalence Principle (REP)


    The Reuse/Release Equivalence Principle states that only what is released can
    be reused. A release is something that is maintained by another author or entity.
    The release is a product and you are the customer. Releases get updates, which
    may or not be of interest to you, and you may choose to update or stick to the
    old version for a while. Clearly, copied code does not fit this description (as
    we''ve seen DRY). Applications often consist of hundreds of classes and interfaces,
    releasing single classes is tedious and overwhelming. A package is a good candidate
    for release so that everything can be reused.


    # Common Reuse Principle (CRP)


    The Common Reuse Principle is kind of the High Cohesion Principle for packages.
    Classes that are packaged together belong together. If you reuse one class in
    a package you need to update, validate your software, and redistribute your software.
    For this reason classes in a package should have a high cohesion (I''m talking
    about cohesion between classes, not per class). You will be very happy if you
    need an update and have to do all that work, but you don''t actually need the
    update. Of course this happens a lot in practice, since the alternative is having
    many packages, which is not great.


    It might be nice to mention that some script libraries, like jQuery (a JavaScript
    library), allow you to download only the code that''s necessary for your use.
    You can then tick the components you want and leave the rest. Of course, such
    practice is not possible for compiled packages because you compile everything
    or nothing.


    # Common Closure Principle (CCP)


    The Common Closure Principle states that classes that change together should be
    packaged together. That is because if you change a class, or responsibility, you
    don''t want to update more than one package. You don''t want to have unrelated
    functionality in one package (CRP) and you don''t want a single functionality
    in more than one package (CCP).


    > ^5 R.C. Martin, M. Martin - Agile Principles, Patterns and Practices in C#'
  merge: -1
  pgno: 85
