  md: "```\nCreateDatabase(\"MyDB\");\nSqlServerApiAdapter adapter = new SqlServerApiAdapter();\n\
    object data = adapter.GetData();\n// ...\n\nstatic void CreatedDatabase(string\
    \ name)\n{\n    SqlServerApi api = new SqlServerApi();\n    api.CreateDatabase(name);\n\
    }\n```\n\nI think you can see the problem. We've gone through all the trouble\
    \ of creating an Adapter for the SqlServerApi and now we're going to use it directly\
    \ in our application. It makes no sense, as SqlServerApiAdapter is the much more\
    \ obvious choice. It already uses SqlServer here anyway! And that's exactly the\
    \ point of Information Expert. The SqlServerApiAdapter has all the information\
    \ that's necessary to create a new database, so it is a good candidate for getting\
    \ this new functionality. The alternative, Program, knows nothing about SqlServer\
    \ here, so the choice is easily made.\n\nThe example is kind of obvious, but it\
    \ demonstrates what Information Expert is all about. I'll tell you a little secret\
    \ too: I've seen software that had CreateDatabase in Program (well, not exactly\
    \ that, but a likewise situation). When a code grows large, it is not always obvious\
    \ where new functionality goes.\n\n# Low Coupling\n\nThe Low Coupling principle\
    \ helps in keeping the impact of changes to a minimum. Coupling between classes\
    \ is when a class depend upon another. Needless to say that a lot of classes depend\
    \ on a certain class it becomes difficult to change that class. The Information\
    \ Expert Principle actually helps towards this end. Let's check the previous example\
    \ with the SqlServerApi. Putting the CreateDatabase method in Program was bad\
    \ design because Program didn't know about SqlServerApi and shouldn't need to\
    \ know about it. It created unnecessary coupling between SqlServerApi and Program."
