- img_proc: true
  md: "```\npublic class Employee : Person\n{\n    public decimal Salary { get; set;\
    \ }\n    public sealed override string GetFullName()\n    {\n        return LastName\
    \ + \", \" + FirstName;\n    }\n}\n```\n\nNo subclass of Employee can override\
    \ GetFullName.\n\nWhy would you use sealed on your classes or methods? First,\
    \ there is a small performance gain because the .NET runtime doesn't have to take\
    \ over overridden methods into account. The gain is negligible, so that's not\
    \ really a good reason. A better reason is perhaps a class implements some security\
    \ checks that really shouldn't be extended in any way.\n\n> Note: Some languages,\
    \ like C++, know multiple inheritance. That means a subclass can inherit from\
    \ more than one base class. In C# this is not possible; each subclass can inherit\
    \ from, at most, one base class.\n\n# Inheritance vs. Composition\n\nWhile inheritance\
    \ is very important in OOP, it can be a real pain, especially when you get huge\
    \ inheritance trees with branches to all sides. There is an alternative to inheritance:\
    \ composition. Inheritance implies an \"is-a\" relationship between classes. An\
    \ Employee is a Person. Using composition, we can define a \"has-a\" relationship.\n\
    Let's take a car. A car is built up from many components, like an engine. When\
    \ we model a car we inherit Car from Engine? That would be problematic, because\
    \ a car also has doors, chairs and a backseat.\n\nCode Listing 10: No Go\n\n```\n\
    public class Engine\n{\n    // ...\n}\npublic class Car : Engine\n{\n    // ...\n\
    }\n```\n\nHow would this look when using composition?\n\nCode Listing 11: Composition\n\
    \n```\npublic class Engine\n{\n    // ...\n}\n```"
