  md: "# Chapter 1 The Three Pillars of OOP\n\nObject-oriented programming has three\
    \ characteristics that define the paradigm, the so-called \"three pillars of OOP.\"\
    \ In this chapter, we'll look at each one of them in detail. They all play an\
    \ important role in the design of your applications. That's not to say that your\
    \ systems will have a great design by simply applying these concepts. In fact,\
    \ there is no single correct way of applying these concepts, and applying them\
    \ can be difficult.\n\n# Inheritance\n\nInheritance is an important part of any\
    \ object-oriented language. Classes can inherit from each other, which means the\
    \ inheriting class gets all of the behavior of the inherited class, also known\
    \ as the base class. Let's look at the Person example I used earlier.\n\nCode\
    \ Listing 3: Inheritance Example\n\n```\npublic class Person\n{\n    public string\
    \ FirstName { get; set; }\n    public string LastName { get; set; }\n    public\
    \ string GetFullName()\n{\n        return FirstName + \" \" + LastName;\n    }\n\
    }\npublic class Employee : Person\n{\n    public decimal Salary { get; set; }\n\
    }\n```\n\nThe trick is in the Employee : Person part. That part basically says\
    \ \"Employee inherits from Person.\" And remember everything inherits from Object.\
    \ In this case Employee inherits from Person and Person (because it's not explicitly\
    \ inheriting anything) from Object. Now let's look at how we use Employee.\n\n\
    Code Listing 4: Subclass usage\n\n```\nEmployee employee = new Employee();\nemployee.FirstName\
    \ = \"Sander\";\nemployee.LastName = \"Rossel\";\nstring fullName = employee.GetFullName();\n\
    employee.Salary = 1000000; // I wish :-)\n```\n\nThat's pretty awesome! We got\
    \ everything from Person just by inheriting from it! In this case we can call\
    \ Person a base class or superclass and Employee a subclass. Another common way\
    \ of saying it is that Employee extends Person."
  merge: -1
  pgno: 11
- img_proc: true
  md: "There's a lot more though! Let's say we'd like to write some common behavior\
    \ in some base class, but we'd like subclasses to be able to extend or override\
    \ that behavior. Let's say we'd like subclasses to change the behavior of GetFullName\
    \ in the previous example. We can do this using the virtual keyword in the base\
    \ class and override in the subclass.\n\n# Code Listing 5: Method overriding\n\
    \n```\npublic class Person\n{\n    public string FirstName { get; set; }\n   \
    \ public string LastName { get; set; }\n    public virtual string GetFullName()\n\
    \    {\n        return FirstName + \" \" + LastName;\n    }\n}\nublic class Employee\
    \ : Person\n{\n    public decimal Salary { get; set; }\n    public override string\
    \ GetFullName()\n    {\n        string originalvalue = base.GetFullName();\n \
    \       return LastName + \" \" + FirstName;\n    }\n}\n```\n\nAs you can see\
    \ we can override, or re-define, GetFullName because it was marked virtual in\
    \ the base class. We can then call the original method using the base keyword\
    \ (which points to the implementation of the base class) and work with that, or\
    \ we can return something completely different. Calling the original method is\
    \ optional, but keep in mind that some classes may break if you don't.\n\nNow\
    \ here's an interesting thing: the type is Employee, but it also has the type\
    \ Person. That means in any code where we need a Person we can actually use an\
    \ Employee. When we do this we can, of course, access Employee specific members,\
    \ such as Salary. So here's a little question: what will the following code print?\n\
    \n# Code Listing 6: What will the code print?\n\n```\nperson = new Employee();\n\
    person.FirstName = \"Sander\";\nperson.LastName = \"Rossel\";\nstring fullName\
    \ = person.GetFullName();\nConsole.WriteLine(fullName);\n// Press any key to quit.\n\
    Console.ReadKey();\n```\n\nIf you answered \"Rossel\", Sander (rather than Sander\
    \ Rossel) you were right!\n\nWhat else can we do? We can force a subclass to inherit\
    \ certain members. When we do this we must mark a method, and with that entire\
    \ class, as abstract. An abstract class can't be instantiated and must be inherited\
    \ (with abstract members overridden)."
  merge: -1
