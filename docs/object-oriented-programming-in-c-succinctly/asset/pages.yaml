  md: '# Inversion of Control (IoC)


    Often mentioned together with DI is Inversion of Control, or IoC. You may even
    see the terms being used interchangeably. The basic principle of IoC is that "higher"
    code depends upon abstractions. We have already seen this in action in TestConnection.
    Here''s another fun fact: DI is actually a form of IoC (not necessarily the other
    way around though)!


    # The Takeaway


    Generally speaking, the SOLID Principles can lead to good, maintainable, extensible,
    and testable software design at the expense of additional complexity. However,
    they do not come naturally to a lot of developers. Let''s be honest, it''s hard
    to think ahead, so if you need a SqlConnectionManager now, why bother with some
    IConnectionManager that may need to be modified anyway? It''s a lot easier to
    simply create a SqlConnectionManager and use it throughout your code. However,
    you cannot predict the future and, even though you think you''ll have to switch
    to something other than SQL Server now, the future may prove otherwise. When you''ll
    have to switch to something else, you will wish you had practiced the Dependency
    Inversion Principle. Likewise, when your API that has always been internal suddenly
    has to go public, you will wish you had practiced the Open Closed Principle. And
    that stuff does happen. I''ve heard "that will never happen" a few times too many,
    so really, think ahead and practice SOLID!'
