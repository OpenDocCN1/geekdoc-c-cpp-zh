  md: "```\npublic void LogError(string error)\n{\n    Console.WriteLine(\"Error:\
    \ \" + error);\n}\n\npublic void LogInfo(string info)\n{\n    Console.WriteLine(\"\
    Info: \" + info);\n}\n\npublic class WindowsEventLogger : ILogger\n{\n    public\
    \ void LogError(string error)\n    {\n        Console.WriteLine(\"Logging error\
    \ to Windows Event log: \" + error);\n    }\n\n    public void LogInfo(string\
    \ info)\n    {\n        Console.WriteLine(\"Logging info to Windows Event log:\
    \ \" + info);\n    }\n}\n\npublic class DatabaseLogger : ILogger\n{\n    public\
    \ void LogError(string error)\n    {\n        Console.WriteLine(\"Logging error\
    \ to database: \" + error);\n    }\n\n    public void LogInfo(string info)\n \
    \   {\n        Console.WriteLine(\"Logging info to database: \" + info);\n   \
    \ }\n}\n```\n\nThat's pretty nifty! And as you can, add or remove loggers as we\
    \ please.\n\nBy the way, having an interface and a base class (which implements\
    \ the interface) is perfectly fine. Maybe you have an ILogger, a DbLogger (which\
    \ implements ILogger and defines some common behavior for logging to a database)\
    \ and then have a SqlServerLogger, an OracleLogger, a MySQLLogger, etc. (which\
    \ all inherit from DbLogger).\n\n# Explicitly Implementing Interfaces\n\nI've\
    \ mentioned that when you implement an interface, all members of that interface\
    \ are public by default. Their logical behavior, after all, an interface is a\
    \ sort of contract that promises other code that will have some members and properties\
    \ defined (because it's of a certain type). It is, however, possible to hide interface\
    \ members. To do that, you can explicitly implement an interface. When you explicitly\
    \ implement an interface member, the only way to invoke that member is by using\
    \ the class as a type of the interface."
