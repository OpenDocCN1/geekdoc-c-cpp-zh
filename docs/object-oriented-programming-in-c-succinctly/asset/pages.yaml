    \ programming. They haven't been implemented for nothing and they solve real problems.\
    \ It's crucial that you know these features by heart and practice them in your\
    \ daily code. Think about encapsulation every time you create a class or method.\
    \ Use inheritance when necessary, but don't forget it brings extra complexity\
    \ to the table as well. Be very wary of polymorphism, know which code will run\
    \ when you inherit classes and override methods. Even if you don't practice it\
    \ you'll come across code that does. Throughout this book we'll see these be used\
    \ extensively."
