  md: "# Decorator\n\n![](img/a03594f8f44c9d45de3912512db3a264_51_0.png)\n\nFigure\
    \ 12: Class Diagram of the Decorator Pattern\n\nThe Decorator Pattern can be used\
    \ to add functionality to an object dynamically. It's especially useful when one\
    \ object can have multiple functionalities that aren't always used at the same\
    \ time, like different representations of the same data. In that respect it offers\
    \ a flexible alternative to inheritance.\n\nLet's have some text message and we\
    \ want to print and/or email and/or fax (yes, people still do do that) and/or\
    \ send it to an external system. Additionally, the message must always be saved\
    \ to the database. First we will need our Message class that contains the message\
    \ we want to process and we can implement the default process (after all, we always\
    \ need to send the message to the database).\n\nCode Listing 58: The Message Class\n\
    \n```\npublic interface IMessage {\n    string Msg { get; set; }\n    void Process();\n\
    }\n\npublic class Message : IMessage {\n    public string Msg { get; set; }\n\
    \    public void Process() {\n        Console.WriteLine(String.Format(\"Saved\
    \ {0} to database.\", Msg));\n    }\n}\n```"
