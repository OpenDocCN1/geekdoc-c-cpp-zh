    \ to matter switching to our Data Mapper, and possibly Repository. Or its a lot\
    \ of work, and everything will have to be tested thoroughly, but we shouldn't\
    \ have to change our front-end, for example.\n\nSo what is hard to change, Suppose\
    \ half-way into the project you decide to change the interface of your Data Mapper\
    \ or your Repository. That could be pretty problematic. Or you decide to throw\
    \ in an MVC and/or MVVM architecture. That will need a good rewriting of many\
    \ components.\n\n# Don't Repeat Yourself (DRY)\n\nOne important principle we have\
    \ not yet discussed the DRY Principle, or Don't Repeat Yourself. Why do we go\
    \ through all the trouble of putting everything behind abstractions, thinking\
    \ about architecture, and reuse anyway? DRY is the answer. Prevent writing the\
    \ same code twice. The next example will illustrate why.\n\nSuppose you have a\
    \ Person class which has save logic. We broke low coupling and high cohesion,\
    \ but we can save our Person.\n\n```\nCode Listing 101: Person with Save Logic\n\
    public class Person {\n  // ...\n  public void Save() {\n    // Daase logic for\
    \ Person here.\n  }\n}\n```"
