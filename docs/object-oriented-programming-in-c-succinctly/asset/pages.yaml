  md: "# # Chapter 5 General Responsibility Assignment Software Patterns or Principles\
    \ (GRASP)\n\nOne set of patterns that you aren't going to see a lot are the GRASP\
    \ patterns, General Responsibility Assignment Software Patterns or Principles\
    \ (I'm pretty sure the abbreviation came first). They are not quite patterns like\
    \ Design Patterns, they are more like advice that should help you solve some programming\
    \ problems. I'm not sure why GRASP is not as popular as SOLID or Design Patterns,\
    \ as the principles are no less important and every developer should know them.\
    \ Craig Larman discusses them in his book Applying UML and Patterns - An Introduction\
    \ to Object-Oriented Analysis and Design and Iterative Development⁴ There are\
    \ a total of nine GRASP principles, and some of them overlap with what was already\
    \ discussed. In this chapter I'll discuss the GRASP Patterns that have no overlap\
    \ with what we previously discussed. The ones that overlap are Controller (like\
    \ we've seen in MVC), Polymorphism (one of the three pillars of OOP), Induction\
    \ (another word for Dependency Inversion), and Protected Variations (another form\
    \ of Dependency Inversion) and Encapsulation.\n\n# ## Creator\n\nOne of the first\
    \ problems you will encounter with any OO application is that you need to create\
    \ an instance of some object, but you're not sure what object is to create it.\
    \ In some cases this is obvious, as when working with certain Design Patterns\
    \ such as Factory Method or Singleton. Other times it's not obvious. At the start\
    \ of this book, we saw a small example with a Car and an Engine class (Inheritance\
    \ vs. Composition).\n\n**Code Listing 91: Car and Engine\n\n```\npublic class\
    \ Engine {\n    // ...\n}\n\npublic class Car {\n    private Engine engine = new\
    \ Engine();\n    // ...\n}\n```\n\n> ⁴ Craig Larman - Applying UML and Patterns:\
    \ An Introduction to Object-Oriented Analysis and Design and Iterative Development"
  merge: -1
  pgno: 74
- img_proc: true
  md: "A Car has an Engine, so it should obviously create an Engine, right? Well,\
    \ maybe. There are a few pointers for whether one class creates another. If some\
    \ class or aggregates another class, closely uses another, or has the initializing\
    \ data for another class (see also Information Expert in the next section), it\
    \ might be a good idea to have that class create another class. A Car does contain\
    \ an Engine, but it does not aggregate it. A Car uses an Engine. also has the\
    \ initializing data for an Engine? Who knows? It depends on your design. In this\
    \ case I would go for another solution, which is to compose the Car with an Engine\
    \ class through the constructor (or through some means).\n\n# Code Listing 92:\
    \ Different Engines\n\n```\npublic abstract class Engine {\npublic class GasolineEngine\
    \ : Engine {\npublic class DieselEngine : Engine { }\n\npublic class Car\n{\n\
    \    private Engine engine;\n    public Car(Engine engine) {\n        this.engine\
    \ = engine;\n    }\n    // ...n}\n```\n\nAnd now that another class creates an\
    \ Engine, you can give your Car any Engine you want.\n\n# Code Listing 93: Compose\
    \ by your Car\n\n```\nCar diesel = new Car(new DieselEngine());\nCar gas = new\
    \ Car(new GasolineEngine());\n```\n\nOf course, that still doesn't solve the entire\
    \ problem, because who creates the Car, and does that same class or yet create\
    \ the Engine?\n\nIt is important to note that these objects are objects and not\
    \ domain objects. The domain, or real world objects, are probably created on some\
    \ assembly line. Chances in your code, that's probably not going to create the\
    \ Car or Engine. One thing you know for sure, a Car has never created an Engine\
    \ in the real world.\n\n# Information Expert\n\nInformation Expert is a principle\
    \ that you are already applying. Information Expert addresses the problem of which\
    \ object handles responsibility. Often have you wondered what the right class\
    \ was for a method? The answer lies with Information Expert and is deceptively\
    \ simple. A responsibility should be assigned to the class that has all the information\
    \ necessary to fulfill that responsibility.\n\nLet's take a look at an example.\
    \ Earlier we created an Adapter for a SqlServerApi class. Here's a small reminder:"
