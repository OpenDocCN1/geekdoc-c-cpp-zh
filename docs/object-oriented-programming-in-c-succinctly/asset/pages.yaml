  md: "# Code Listing 7: An Abstract Class\n\n```\npublic abstract class Person {\n\
    \    public string FirstName { get; set; }\n    public string LastName { get;\
    \ set; }\n    public abstract string GetFullName();\n}\n\npublic class Employee\
    \ : Person {\n    public decimal Salary { get; set; }\n    public override string\
    \ GetFullName() {\n        return LastName + \" \" + FirstName;\n    }\n}\n```\n\
    \nOf course we can't make a call to base.GetFullName() anymore, as it has no implementation.\
    \ While overriding GetFullName was optional before, it is mandatory now. Other\
    \ than that the usage of Employee stays exactly the same.\n\nOn the other end\
    \ of the spectrum, we can explicitly state that a class or method may not be inherited\
    \ or overridden. We can do this using the sealed keyword.\n\n# Code Listing 8:\
    \ A Sealed Class\n\n```\npublic sealed class Person {\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n    public string GetFullName()\
    \ {\n        return FirstName + \" \" + LastName;\n    }\n}\n```\n\nNow that Person\
    \ is sealed no one can inherit from it. It means we can't create an Employee class\
    \ and use Person as a base class.\n\nMethods can be sealed in subclasses. After\
    \ all, if you don't want people to override your method, simply don't mark it\
    \ virtual. However, if you have a virtual method and a subclass wants to prevent\
    \ further overriding it's possible to mark it as sealed.\n\n# Code Listing 9:\
    \ A sealed method\n\n```\npublic class Person {\n    public string FirstName {\
    \ get; set; }\n    public string LastName { get; set; }\n    public virtual string\
    \ GetFullName() {\n        return FirstName + \" \" + LastName;\n    }\n}\n```"
  merge: -1
