  md: "# Architectural styles and patterns\n\nAll these patterns, layers, and tiers\
    \ can be combined to create greater architectural styles and patterns that are\
    \ not mutually exclusive. Picking what's right for you and your project is extremely\
    \ difficult and probably a matter of what you know and what you prefer. Sure,\
    \ some patterns make more sense for specific applications or technologies, but\
    \ overall you have some choices.\n\nConsider an ASP.NET MVC application. The pattern\
    \ already implies we're using MVC. The MVC framework uses REST (Representational\
    \ State Transfer), meaning, in simplified terms, that your server sits waiting\
    \ for a request, handles the request, sends a response, and continues waiting).\
    \ Perhaps you're already using AngularJS or KnockoutJS in the front-end, where\
    \ MVVM. probably already three-layer (HTML, CSS, AngularJS/KnockoutJS) on the\
    \ client, a web server, and a database server). You can opt to create some additional\
    \ services for business logic that you can use for other platforms as well. Additionally,\
    \ the front-end might make use of an event-driven design.\n\nAs you see, you probably\
    \ use a lot of patterns and already didn't know it. Discussing these patterns\
    \ individually requires another books, so I won't do that. Having these tough\
    \ architectural decisions made for you by the framework or technology you're using\
    \ may be how you like it, or you may want to create something on your own. There\
    \ are pros and cons to approach.\n\n# The Takeaway\n\nObject-oriented design should\
    \ have no secrets for you now. You might be wondering how far you should go in\
    \ abstraction and reuse. After all, just because you can doesn't mean you should.\
    \ It's really hard to say where you should draw the line as it's highly subjective.\
    \ I once\n\n> Code Listing 104: NowResolver\n\n```\npublic interface INowResolver\
    \ {\n    DateTime GetNow();\n}\npublic class NowResolver : INowResolver {\n  \
    \  public DateTime GetNow() {\n        return DateTime.Now;\n    }\n}\n```"
  merge: -1
