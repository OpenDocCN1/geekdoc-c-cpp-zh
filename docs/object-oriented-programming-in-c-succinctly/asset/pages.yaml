    Figure 14: Class Diagram of the Strategy Pattern\n\nThe Strategy Pattern allows\
    \ you to encapsulate a family of algorithms and use them interchangeably. You\
    \ can think of many applications for the Strategy Pattern, for example a video\
    \ game where units on a battlefield behave the same in many aspects, such as moving\
    \ and rendering, but differ by attack strategy. One unit might be offensive while\
    \ another is defensive. The offensive or defensive algorithm can be injected into\
    \ each unit.\n\nAnother example is the sorting of a list. Depending on the size\
    \ of the list you might want to use another sorting algorithm, but you don't want\
    \ to hard code each algorithm into the list class.\n\nSo let's make a little game.\
    \ It's a Simple Console application and we'll be pressing any button which will\
    \ move our units and may result in an enemy encounter (keep pressing buttons or\
    \ escape to quit). Each unit reacts differently to an enemy encounter. So first\
    \ we define a generic Unit class.\n\nCode Listing 68: The Strategy Pattern\n\n\
    ```\npublic interface IUnitBehavior\n{\n  void ReactToOpponent();\n}\n\npublic\
    \ class Unit\n{\n  private string name;\n  private IUnitBehavior behavior;\n\n\
    \  public Unit(string name, IUnitBehavior behavior)\n}\n```"
