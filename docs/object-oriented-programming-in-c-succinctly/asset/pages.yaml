- img_proc: true
  md: "```\n{\n  instance = new SomeSingleton();\n}\nreturn instance;\n\n```\n\nAnd\
    \ now the Singleton is complete. Indeed, this is the implementation we'll often\
    \ find in code bases (you'll also often find Singletons with public constructors\
    \ a.k.a. not Singletons at all).\n\nSo what is wrong with this Singleton? Nothing,\
    \ if your application is completely single-threaded. When you're going multi-threaded,\
    \ this implementation can still result in multiple instances. This happens when\
    \ two threads try to get the instance at the same time. Both threads will see\
    \ that instance is null neither thread has actually created the new instance,\
    \ so we'll need to lock this code for multiple threads. And as a small optimization,\
    \ we won't lock after the instance is created. Here is the full thread-safe Singleton:\n\
    \n# Code Listing 49: The Thread-Safe Singleton\n\n```\npublic class SomeSingleton\
    \ {\n    private static SomeSingleton instance;\n    private static object syncRoot\
    \ = new object();\n\n    private SomeSingleton() {\n    }\n\n    get {\n     \
    \   if (instance == null) {\n            lock(syncRoot) {\n                if\
    \ (instance == null) {\n                    instance = new SomeSingleton();\n\
    \                }\n            }\n            return instance;\n        }\n \
    \   }\n\n    public void SomeMethod() {\n        // Just an instance method like\
    \ any other.\n    }\n}\n```"
