  md: "# Inheritance vs. Interface\n\nOne discussion you will find frequently online,\
    \ or might get engaged in at work, is that of inheritance vs. using an interface.\
    \ Remember that you can only inherit from one class. That means if you use inheritance,\
    \ like Person -> Employee, your Employee is stuck with the Person base class.\
    \ Alternatively, you could define an IPerson and implement it separately in Person\
    \ and Employee. One guideline you'll see is that inheritance defines an \"is-a\"\
    \ relationship (an Employee is a Person) while interface defines a \"can do\"\
    \ or \"has-a\" relationship (a Person has a stamp collection). As you see, it's\
    \ not entirely proof, as a stamp collector is also a Person, but still inheritance\
    \ can lead us into trouble.\n\nI like to use when I have some functionality that\
    \ is shared across multiple, if not all, subtypes of that class, like with the\
    \ Dblogger example.\n\nAnd remember, composition may also be a viable option!\n\
    \n# The Takeaway\n\nAn interface is a means to create additional types without\
    \ the need for multiple inheritance. They are extremely useful, I've talked to\
    \ people say every class needs a matching interface. It's an important feature\
    \ that Visual Studio has the option to create an interface based on a class. When\
    \ your cursor is in a class, you can find it under Edit -> Refactor -> Extract\
    \ Interface in the top menu.\n\n```\npublic class SomeClass {\n    public void\
    \ MethodA()\n    { }\n    public void MethodB()\n    { }\n    private void Something()\n\
    \    {}\n}\n```\n\n![](img/a03594f8f44c9d45de3912512db3a264_24_0.png)\n\nLearn\
    \ to use them well, as we'll use them a lot throughout this book."
  merge: -1
