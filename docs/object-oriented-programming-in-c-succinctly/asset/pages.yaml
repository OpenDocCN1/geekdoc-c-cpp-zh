- img_proc: true
  md: "```\n```java\npublic class Car {\n    private Engine engine = new Engine();\n\
    \    // ...\n}\n```\n```\n\nCar can now use the Engine, but it is not an Engine!\n\
    \nWe could've used this approach with Person and Employee as well, but how would\
    \ we set FirstName and LastName? We could make Person public, but we are now breaking\
    \ a principle called encapsulation (as discussed in the next chapter). We could\
    \ mimic Person by defining a FirstName and LastName property, but we now have\
    \ to change the public interface of Employee every time the public interface of\
    \ Person changes. Additionally, Employee will not be of type Person anymore, so\
    \ the type of Employee changes and it will not be interchangeable with Person\
    \ anymore.\n\nA solution will be presented in Chapter 2: Interfaces.\n\n# Encapsulation\n\
    \nEncapsulation is the process of hiding the internal workings of our classes.\
    \ That means we specify a public specification, used by consumers of our class,\
    \ while the actual work is hidden away. The advantage is that a class can change\
    \ how it works without needing to change its consumers.\n\nIn C# we have four\
    \ access modifiers which enable five ways of controlling code visibility:\n\n\
    +   * private—only visible to the containing class.\n* protected—only visible\
    \ to the containing class and inheritors.\n* internal—only visible to classes\
    \ in the same assembly.\n* protected internal—only visible to the same assembly\
    \ or in derived classes, even in other assemblies.\n* public—visible to everyone.\n\
    \nLet's say we're building some class that runs queries on a database. Obviously\
    \ we need some method of RunQuery's visible to every consumer of our class. The\
    \ method for accessing the database could be different for every database, so\
    \ perhaps we're leaving open for inheritors. Additionally, we use some helper\
    \ class that's only visible to our project. Last, we need to store some private\
    \ state, which may not be altered from outside our class as it could leave it\
    \ in an invalid state."
  merge: -1
  pgno: 15
- img_proc: true
  md: "# Code Listing 12: Access Modifiers\n\n```\npublic class QueryRunner {\n  \
    \  private IDbConnection connection;\n\n    public void RunQuery(string query)\
    \ {\n        Helper helper = new Helper();\n        if (helper.Validate(query))\
    \ {\n            OpenConnection();\n            // Run the query...\n        \
    \    CloseConnection();\n        }\n    }\n\n    protected void OpenConnection()\
    \ {\n        // ...\n    }\n\n    protected void CloseConnection() {\n       \
    \ // ...\n    }\n}\n\ninternal class Helper {\n    internal bool Validate(string\
    \ query) {\n        // ...\n        return true;\n    }\n}\n```\n\nIf we were\
    \ to compile this into an assembly and access it from another project we'd only\
    \ be able to see the QueryRunner class. If we created an instance of the QueryRunner\
    \ we could only call the RunQuery method. We could also access OpenConnection\
    \ and CloseConnection. The Helper class and the connection field will be hidden\
    \ from us though.\n\nI should mention that classes can contain nested private\
    \ classes, classes that are only visible to the containing class. Private classes\
    \ can access private members of their containing classes. Likewise, an object\
    \ can access private members of other objects of the same type.\n\n# Code Listing\
    \ 13: A private nested class\n\n```\npublic class SomeClass {\n    private string\
    \ someField;\n}\n```"
  merge: -1
  pgno: 16
- img_proc: true
  md: "```\npublic void SomeMethod(SomeClass otherInstance)\n{\n    otherInstance.someField\
    \ = \"Some value\";\n}\n\nprivate class InnerClass\n{\n    public void SomeMethod(SomeClass\
    \ param)\n    {\n        param.someField = \"Some value\";\n    }\n}\n```\n\n\
    When omitting an access modifier, a default is assigned (internal for classes\
    \ and private for everything). I'm a big fan of explicitly adding access modifiers\
    \ though.\n\nA last remark, before moving on, is that subclasses cannot have an\
    \ accessibility greater than their base class. If some class has the internal\
    \ access modifier an inheriting class cannot be made public (but it could be private).\n\
    \n# Polymorphism\n\nWe see inheritance and that we can alter the behavior of a\
    \ type through inheritance. Our Person class had a GetFullName method which was\
    \ altered in Employee. We also see that whenever, at run-time, an object of type\
    \ Person is expected we can throw in any subclass of Person, like Employee. This\
    \ is called polymorphism.\n\nIn the following example the PrintFullName method\
    \ takes an object of Person, but it prints \"Sander\" because the parameter that's\
    \ passed into the method is actually of a subtype,, which overrides the functionality\
    \ of GetFullName.\n\n> Code Listing 14: Polymorphism\n\n```\nclass Program{\n\
    \    static void Main(string[] args)\n    {\n        Person p = new Employee();\n\
    \        p.FirstName = \"Sander\";\n        p.LastName = \"Rossel\";\n       \
    \ PrintFullName(p);\n        // Press any key to quit.\n        Console.ReadKey();\n\
    \    }\n\n    public static void PrintFullName(Person p)\n    {\n        Console.WriteLine(p.GetFullName());\n\
    \    }\n}\n```"
