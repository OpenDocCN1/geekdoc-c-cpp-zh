  md: "In the following code listing we'll see an example of a Person class. It doesn't\
    \ do anything, it just sits there.\n\n# Code Listing 1: A Class\n\n```\npublic\
    \ class Person {\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n    public string GetFullName() {\n        return FirstName\
    \ + \" \" + LastName;\n    }\n}\n```\n\nNow the usage of this class can see how\
    \ as follows:\n\n# Code Listing 2: Object Instantiation and Usage\n\n```\nPerson\
    \ personObject = new Person();\npersonObject.FirstName = \"Sander\";\npersonObject.LastName\
    \ = \"Rossel\";\nstring fullName = personObject.getFullName();\n```\n\nIn the\
    \ previous code listing, we can see how one or more types is instantiated from\
    \ a class by calling its constructor (using the new keyword).\n\nLet's go a bit\
    \ further. Each object has one or more types. A type is defined by the class that\
    \ was used to instantiate an object. For example, personObject has the type Person.\
    \ One type objects in C# share the type Object (or, including its namespace, System.Object).\
    \ This is possible because C# supports Inheritance, but we'll get into that later.\
    \ We have a couple of ways to check the type of an object, for example, we can\
    \ use GetType, typeof or the is operator. For now, let's move on.\n\nLast I'd\
    \ like to mention packages. A package is a common name for a set of code that\
    \ is compiled together. In Microsoft land a package is often called a DLL. In\
    \ .NET a DLL is often known as an Assembly. In Visual Studio each project is compiled\
    \ into a DLL or an exe (executable) file."
