    \nsw.Restart();\nlazy.Value.PrintUse();\nsw.Stop();\nConsole.WriteLine(String.Format(\n\
    \  \"Using the Lazy<Something>.Value cost: {0} ms\",\n  sw.ElapsedMilliseconds));\n\
