    \ in breaking SRP though, since the core functionality of the class is already\
    \ defined in the base class and we can't change that. You could make every method\
    \ in the base class virtual, and yet we've seen that that's not really good practice\
    \ as consumers now break your class. For example, if they override Connect and\
    \ just leave it, no connection will be made and each subsequent method call to\
    \ your class will fail. Besides, even if the method is overridden the base class\
    \ will not be sitting there just doing, which doesn't feel right.\n\nI propose\
    \ a different solution, one of many. Let's break up the previously proposed interface\
    \ into two separate interfaces. You'll probably need some more methods now, but\
    \ let's stick to simplicity for now.\n\nCode 24: SRP for OCP\n\n```\npublic interface\
    \ IConnectionManager {\n    void Connect(string connectionString);\n    void Close();\n\
    }\n\npublic interface IDataManager {\n    object GetData(IConnectionManager connManager);\n\
    }\n```"
  - "[PAGE 27]\n\n```\nvoid SendData(IConnectionManager connManager, object data);\n\
    }\n```\n\nNow suppose I'd like to change the way I connect to the database. I\
    \ can implement my own IConnectionManager and pass it to my IDataManager. Without\
    \ touching the original code, I am now able to extend the functionality of the\
    \ classes without actually breaking the existing class! Likewise, if I'd like\
    \ to change the way I'm getting or sending data I can simply implement my own\
    \ IDataManager and use it with the already existing implementation of IConnectionManager.\n\
    \nIt gets better, every class that depends on IConnectionManager and/or IDataManager\
    \ is now extendable in that it can use any database you can ever imagine! Well,\
    \ theoretically.\n\nLater we'll look at Design Patterns, which can help you in\
    \ designing classes that conform to OCP.\n\n# Liskov Substitution Principle (LSP)\n\
    \nThe Liskov Substitution Principle, LSP for short, is about inheritance. It states\
    \ that subclasses and base classes must be substitutable. That means that any\
    \ method of any base type must not know if it's using a base class or any subclass.\
    \ Here's an example of what you wouldn't do (although I've written code just like\
    \ this in the past):\n\n> Code Listing 25: Violation of LSP\n\n```\nbool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    if (connMgr is SQLConnectionManager)\n    {\n        // Do\
    \ something...\n    }\n    else if (connMgr is OracleConnectionManager)\n    {\n\
    \        // Do something else...\n    }\n    else\n    {\n        // ...\n   \
    \ }\n}\n```\n\nTestConnection is a function that receives an object of type IConnectionManager,\
    \ which could be any connection manager. In this case, the method checks for the\
    \ type of connMgr and acts accordingly. That means for every new implementation\
    \ of IConnectionManager, you need to change this method. Furthermore, you've just\
    \ violated OCP as this function is now unable to test new connection types. There's\
    \ plenty of ways to fix this, like using a Strategy Pattern, but we'll get to\
    \ that in a later chapter. In the above method it should always be good enough\
    \ to invoke the Connect() or Close() method, no matter what IConnectionManager\
    \ you get."
- md: "\nA subtle violation of LSP is when subclasses behave differently than their\
    \ base classes. The classic example is that of a Square class that inherits from\
    \ a Rectangle class. A square is a rectangle (with equal width and height), so\
    \ this inheritance looks plausible. Unfortunately, in some scenarios a square\
    \ may behave differently than a rectangle and may break users of the Rectangle\
    \ class and get a Square instead.\n\n> Code Listing 26: Breaks with Square\n\n\
    ```csharp\nvoid TestSquareMeters(Rectangle rect)\n{\n    rect.Height = 2;\n  \
    \  rect.Width = 3;\n    Assert(rect.Height * rect.Width == 6);\n}\n```\n\n## Interface\
    \ Segregation Principle (ISP)\n\nThe Interface Segregation Principle, or ISP,\
    \ is kind of like the Single Responsibility Principle for Interfaces. Strictly\
    \ speaking, we're not talking about the abstractlike Interfaces, but your class\
    \ public methods. In C# practice, we're doing ISP mostly through Interfaces. Let\
    \ me clear up. Let's consider our database example for a second. We had the following\
    \ interface:\n\n> Code Listing 27: An IDatabase Interface\n\n```csharp\npublic\
    \ interface IDatabase\n{\n    void Connect(string connectionString);\n    void\
    \ Close();\n    object GetData();\n    void SendData(object data);\n}\n```\n\n\
    As I mentioned in the bit about SRP, this may or may not be SRP-proof, depending\
    \ on your requirements. Let's say it is okay for our example, but let's take another\
    \ approach, that of inheritance. Specifically, I'm going to create a base class\
    \ for connection management and inherit that for data management.\n\n> Code Listing\
    \ 28: DatabaseManager Using Inheritance\n\n```csharp\npublic class ConnectionManager\n\
    {\n    public void Connect(string connectionString)\n    {\n        // ...\n \
    \   }\n    public void Close()\n    {\n        // ...\n    }\n}\n```\n\n```csharp\n\
    public class DataManager : ConnectionManager\n{\n    public virtual object GetData()\n\
    \    {\n        // ...\n    }\n    public virtual void SendData(object data)\n\
    \    {\n        // ...\n    }\n}\npublic class DatabaseManager : DataManager\n\
    {\n    // Needs ConnectionManager...\n}\n```\n\nSo our DatabaseManager is inheriting\
    \ ConnectionManager, through DataManager, to make use of, of course, its base\
    \ implementation, but also to make of multipurpose functions as TestConnection\
    \ defined earlier. Can we be sure that all data managers need connection managers\
    \ though? We could even use composition to, the DatabaseManager needs it, but\
    \ what about our?\n\n> Code Listing 29: FileDataManager\n\n```csharp\npublic class\
    \ FileDataManager : DataManager\n{\n    // Doesn't need Connection...\n```\n\n\
    Now our FileDataManager has a fat interface. It depends on classes it doesn't\
    \ need. Notice that this would not have happened if we created two Interfaces\
    \ and implemented those instead. We could re-use the ConnectionManager in other\
    \ Data(base)Managers. The downside to this is FileDataManager now depends upon\
    \ ConnectionManager, even though it doesn't need it. Any change to ConnectionManager\
    \ may break FileDataManager though! Such couplings between classes should be avoided\n\
    \n## Dependency Inversion Principle (DIP)\n\nThe Dependency Inversion Principle,\
    \ DIP for short, states that you should depend on abstractions instead of concrete\
    \ types. This one principle you're going to see a lot which is pretty hard to\
    \ put into practice (correctly). Let's consider our TestConnection method again.\
    \ We could create one for SqlDatabaseManager, as in the following example:\n\n\
    > Code Listing 30: A Violation of DIP\n\n```csharp\nclass Program\n{\n    ///...\n\
    ```\n\n```csharp\nbool TestConnection(SqlConnection connMgr)\n{\n    // ...\n\
    }\n\npublic interface IConnectionManager\n{\n    void Close();\n    void Connect(string\
    \ connectionString);\n}\n\npublic class SqlConnectionManager : IConnectionManager\n\
    {\n    // ...\n}\n```\n\nIt should be obvious that TestConnection can only be\
    \ used for SqlConnectionManager. We have created two problems. First, TestConnection,\
    \ and Program with it, now depend on SqlConnectionManager. Second, we'll have\
    \ to write a TestConnection for each ConnectionManager we're going to go. We're\
    \ saying that SqlConnectionManager is a concrete type of the abstract type IConnectionManager.\
    \ So let's fix that so that we're relying on abstract types compliant to DIP.\n\
    \n> Code Listing 31: Fixed for DIP\n\n```csharp\nbool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    // ...\n}\n```\n\nYou may think that's a pretty lame solution,\
    \ and you may even see this will break your existing code because TestConnection\
    \ relies on methods that aren't part of the IConnection Interface. If that's the\
    \ case, you should ask yourself three things: Is TestConnection implemented correctly,\
    \ and does it really test connections? Is SqlConnectionManager really an IConnectionManager?\
    \ Finally, is IConnectionManager defined correctly?\n\nNow why is this principle\
    \ so important? It has everything to do with expanding and changing existing systems.\
    \ If you depend on abstractions, it's easier to switch implementations. In theory\
    \ you could switch your database (or at least the connection manager) and TestConnection\
    \ would still behave as expected. We've seen earlier, depend on ILogger and you\
    \ can switch from file logging to database logging without problems!\n\n## Dependency\
    \ Injection (DI)\n\nAs I're going to see DI is a part. Perhaps you've heard of\
    \ Dependency Injection (DI) before? There's plenty of \"DI Frameworks\" that help\
    \ you put DI into practice. The previous example was as simple as changing our\
    \ method signature to using an Interface instead of a concrete Type. But any method\
    \ still gets a concrete type at runtime, so where does that come from? We'll have\
    \ to break this \"dependency\" and that's where DI comes in.\n\nFor the next example\
    \ I'm going to use Unity, a library developed by Microsoft and now maintained\
    \ by others. Let's have a look at some code; I've slightly modified the ConnectionManager\
    \ example from earlier:\n\n> Code Listing 32: IConnectionManager\n\n```csharp\n\
    public interface IConnectionManager\n{\n    void Close();\n    void Connect(string\
    \ connectionString);\n}\n\npublic class SqlConnectionManager : IConnectionManager\n\
    {\n    public void Close() {\n        Console.WriteLine(\"Closed SQL connection...\"\
    );\n    }\n\n    public void Connect() {\n        Console.WriteLine(\"Connected\
    \ to SQL Server!\");\n    }\n}\npublic class OracleConnectionManager : IConnectionManager\n\
    {\n    public void Close() {\n        Console.WriteLine(\"Closed Oracle connection...\"\
    );\n    }\n\n    public void Connect() {\n        Console.WriteLine(\"Connected\
    \ to Oracle!\");\n    }\n}\n```\n\nHere's the definition of TestConnection:\n\n\
    > Code Listing 33: Definition for TestConnection\n\n```csharp\nstatic bool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    connMgr.Connect();\n    connMgr.Close();\n    return true;\n\
    }\n```\n\nUsing Unity, we can register either SqlConnectionManager or OracleConnectionManager\
    \ with IConnectionManager:\n\n> Code Listing 34: Registering a Type with Unity\n\
    \n```csharp\nclass Program\n{\n    static void Main(string[]) args\n    {\n  \
    \      // Create a new DI Container...\n        IUnityContainer container = new\
    \ UnityContainer();\n        //And Register a type!\n        container.RegisterType<IConnectionManager,\
    \ SqlConnectionManager>();\n    }\n}\n```\n\nAnd elsewhere we can now request\
    \ an IConnectionManager and call TestConnection:\n\n> Code Listing 35: Resolving\
    \ a Type with Unity\n\n```csharp\nIConnectionManager connMgr = container.Resolve<IConnectionManager>();\n\
    bool success = TestConnection(connMgr);\n// Do something with the result...\n\
    ```\n\nYou should see \"Connected to SQL Server\" and \"Closed SQL connection...\"\
    \ in your console window. Now change the call to RegisterType so it registers\
    \ as OracleConnectionManager. The TestConnection will now print Oracle instead\
    \ of SQL Server. Imagine: by changing this line of code you could change an entire\
    \ application to use Oracle instead of SQL Server!\n\nNow suppose you have some\
    \ dynamic user interface and the controls that are shown on screen depend on some\
    \ settings and/or configuration. Let's see how HTML form defined in the database,\
    \ and we wish to generate the HTML server side. I'm letting you to figure one\
    \ out yourself, but I'm pretty sure you'll get it.\n\n> Code Listing 36: HTML\
    \ Generator\n\n```csharp\nclass Program\n{\n    static void Main(string[]) args\n\
    \    {\n        IUnityContainer container = new UnityContainer();\n        container.RegisterType<HtmlCreator\n\
    ```\n"
  mdcn: "\nLSP（里氏替换原则）的一种微妙违背是子类的行为与其基类不同。经典的例子是正方形类继承自矩形类。正方形是一个矩形（宽和高相等），所以这种继承看起来是合理的。不幸的是，在某些情况下，正方形的行为可能与矩形不同，这会导致使用\
    \ Rectangle 类的用户崩溃，而他们得到的却是一个 Square。\n\n> 代码列表 26：使用正方形导致的破坏\n\n```csharp\nvoid\
    \ TestSquareMeters(Rectangle rect)\n{\n    rect.Height = 2;\n    rect.Width =\
    \ 3;\n    Assert(rect.Height * rect.Width == 6);\n}\n```\n\n## 接口隔离原则 (ISP)\n\n\
    接口隔离原则，或 ISP，有点类似于接口的单一职责原则。严格来说，我们讨论的不是抽象接口，而是你的类的公共方法。在 C# 实践中，我们主要通过接口来实现 ISP。让我解释一下。让我们重新考虑一下之前的数据库示例。我们有以下接口：\n\
    \n> 代码列表 27：一个 IDatabase 接口\n\n```csharp\npublic interface IDatabase\n{\n    void\
    \ Connect(string connectionString);\n    void Close();\n    object GetData();\n\
    \    void SendData(object data);\n}\n```\n\n正如我在 SRP 部分提到的，这可能符合或不符合 SRP，取决于你的需求。假设这在我们的示例中是可以接受的，但让我们采取另一种方法，即继承。具体来说，我将为连接管理创建一个基类，并继承该基类进行数据管理。\n\
    \n> 代码列表 28：使用继承的 DatabaseManager\n\n```csharp\npublic class ConnectionManager\n\
    {\n    public void Connect(string connectionString)\n    {\n        // ...\n \
    \   }\n    public void Close()\n    {\n        // ...\n    }\n}\n```\n\n```csharp\n\
    public class DataManager : ConnectionManager\n{\n    public virtual object GetData()\n\
    \    {\n        // ...\n    }\n    public virtual void SendData(object data)\n\
    \    {\n        // ...\n    }\n}\npublic class DatabaseManager : DataManager\n\
    {\n    // 需要 ConnectionManager...\n}\n```\n\n所以我们的 DatabaseManager 通过 DataManager\
    \ 继承了 ConnectionManager，当然是为了利用它的基类实现，也是为了利用之前定义的 TestConnection 等多功能函数。但我们能确定所有数据管理器都需要连接管理器吗？我们甚至可以使用组合来，DatabaseManager\
    \ 需要它，但我们的呢？\n\n> 代码列表 29：FileDataManager\n\n```csharp\npublic class FileDataManager\
    \ : DataManager\n{\n    // 不需要连接...\n```\n\n现在，我们的 FileDataManager 拥有一个“胖接口”。它依赖于它不需要的类。注意，如果我们创建两个接口并实现它们，这种情况就不会发生。我们可以在其他的\
    \ Data(base)Managers 中重用 ConnectionManager。这样做的缺点是 FileDataManager 现在依赖于 ConnectionManager，即使它不需要。但是，对\
    \ ConnectionManager 的任何更改都可能破坏 FileDataManager！应该避免类与类之间的耦合\n\n## 依赖倒置原则 (DIP)\n\
    \n依赖倒置原则，简称 DIP，规定你应该依赖于抽象而不是具体类型。这个原则你将会看到很多，但在实践中（正确地）执行非常困难。让我们再次考虑 TestConnection\
    \ 方法。我们可以为 SqlDatabaseManager 创建一个，如下例所示：\n\n> 代码列表 30：违反 DIP 的示例\n\n```csharp\n\
    class Program\n{\n    ///...\n```\n\n```csharp\nbool TestConnection(SqlConnection\
    \ connMgr)\n{\n    // ...\n}\n\npublic interface IConnectionManager\n{\n    void\
    \ Close();\n    void Connect(string connectionString);\n}\n\npublic class SqlConnectionManager\
    \ : IConnectionManager\n{\n    // ...\n}\n```\n\n显而易见，TestConnection 只能用于 SqlConnectionManager。我们创建了两个问题。首先，TestConnection\
    \ 连同它的 Program 现在依赖于 SqlConnectionManager。其次，我们必须为使用的每一个 ConnectionManager 编写一个\
    \ TestConnection。我们说 SqlConnectionManager 是抽象类型 IConnectionManager 的具体类型。所以让我们修复它，以便我们依赖于符合\
    \ DIP 的抽象类型。\n\n> 代码列表 31：针对 DIP 的修复\n\n```csharp\nbool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    // ...\n}\n```\n\n你可能认为这是一个很糟糕的解决方案，你甚至会发现这会破坏你现有的代码，因为 TestConnection\
    \ 依赖的方法并不属于 IConnection 接口。如果是这样，你应该问自己三个问题：TestConnection 的实现是否正确？它真的在测试连接吗？SqlConnectionManager\
    \ 真的是 IConnectionManager 吗？最后，IConnectionManager 的定义正确吗？\n\n现在为什么这个原则如此重要？它与扩展和更改现有系统密切相关。如果你依赖于抽象，切换实现就会变得更容易。理论上，你可以切换数据库（或至少切换连接管理器），而\
    \ TestConnection 仍然会按预期运行。正如我们之前看到的，依赖 ILogger，你就可以毫无问题地从文件日志切换到数据库日志！\n\n## 依赖注入\
    \ (DI)\n\n正如我将要看到的，DI 是一个部分。也许你以前听过依赖注入 (DI) 吗？有很多“DI 框架”可以帮助你将 DI 诸实践。上一个示例仅仅是更改我们的方法签名，使用接口而不是具体类型。但任何方法在运行时仍然会获得具体类型，那么它从哪里来呢？我们必须打破这种“依赖”，这就是\
    \ DI 介入的地方。\n\n在下一个示例中，我将使用 Unity，这是一个由微软开发并由他人维护的库。让我们看一下代码，我修改了之前的 ConnectionManager\
    \ 示例：\n\n> 代码列表 32：IConnectionManager\n\n```csharp\npublic interface IConnectionManager\n\
    {\n    void Close();\n    void Connect(string connectionString);\n}\n\npublic\
    \ class SqlConnectionManager : IConnectionManager\n{\n    public void Close()\
    \ {\n        Console.WriteLine(\"Closed SQL connection...\");\n    }\n\n    public\
    \ void Connect() {\n        Console.WriteLine(\"Connected to SQL Server!\");\n\
    \    }\n}\npublic class OracleConnectionManager : IConnectionManager\n{\n    public\
    \ void Close() {\n        Console.WriteLine(\"Closed Oracle connection...\");\n\
    \    }\n\n    public void Connect() {\n        Console.WriteLine(\"Connected to\
    \ Oracle!\");\n    }\n}\n```\n\n这是 TestConnection 的定义：\n\n> 代码列表 33：TestConnection\
    \ 的定义\n\n```csharp\nstatic bool TestConnection(IConnectionManager connMgr)\n{\n\
    \    connMgr.Connect();\n    connMgr.Close();\n    return true;\n}\n```\n\n使用\
    \ Unity，我们可以为 IConnectionManager 注册 SqlConnectionManager 或 OracleConnectionManager：\n\
    \n> 代码列表 34：使用 Unity 注册类型\n\n```csharp\nclass Program\n{\n    static void Main(string[])\
    \ args\n    {\n        // 创建一个新的 DI 容器...\n        IUnityContainer container =\
    \ new UnityContainer();\n        //并注册类型！\n        container.RegisterType<IConnectionManager,\
    \ SqlConnectionManager>();\n    }\n}\n```\n\n在其他地方现在我们可以请求一个 IConnectionManager\
    \ 并调用 TestConnection：\n\n> 代码列表 35：使用 Unity 解析类型\n\n```csharp\nIConnectionManager\
    \ connMgr = container.Resolve<IConnectionManager>();\nbool success = TestConnection(connMgr);\n\
    // 对结果进行某些操作...\n```\n\n你应该在控制窗口中看到 \"Connected to SQL Server\" 和 \"Closed SQL\
    \ connection...\"。现在更改 RegisterType 的调用，使其注册 OracleConnectionManager。TestConnection\
    \ 现在将打印 Oracle 而不是 SQL Server。想象一下：通过更改这一行代码，你可以将整个应用程序改为 Oracle 而不是 SQL Server！\n\
    \n现在假设你有一些动态用户界面，屏幕上显示的控件取决于某些设置和/配置。让我们看看在数据库中定义的 HTML 表单，我们希望在服务器端生成 HTML。我让你自己思考，但我相信你能搞定。\n\
    \n> 代码列表 36：HTML 生成器\n\n```csharp\nclass Program\n{\n    static void Main(string[])\
    \ args\n    {\n        IUnityContainer container = new UnityContainer();\n   \
    \     container.RegisterType<HtmlCreator\n```\n"
