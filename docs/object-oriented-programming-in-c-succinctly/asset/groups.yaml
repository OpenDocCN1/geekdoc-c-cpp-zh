  - "[PAGE 43]\n\n```\n{\n  instance = new SomeSingleton();\n}\nreturn instance;\n\
    \n```\n\nAnd now the Singleton is complete. Indeed, this is the implementation\
    \ we'll often find in code bases (you'll also often find Singletons with public\
    \ constructors a.k.a. not Singletons at all).\n\nSo what is wrong with this Singleton?\
    \ Nothing, if your application is completely single-threaded. When you're going\
    \ multi-threaded, this implementation can still result in multiple instances.\
    \ This happens when two threads try to get the instance at the same time. Both\
    \ threads will see that instance is null neither thread has actually created the\
    \ new instance, so we'll need to lock this code for multiple threads. And as a\
    \ small optimization, we won't lock after the instance is created. Here is the\
    \ full thread-safe Singleton:\n\n# Code Listing 49: The Thread-Safe Singleton\n\
    \n```\npublic class SomeSingleton {\n    private static SomeSingleton instance;\n\
    \    private static object syncRoot = new object();\n\n    private SomeSingleton()\
    \ {\n    }\n\n    get {\n        if (instance == null) {\n            lock(syncRoot)\
    \ {\n                if (instance == null) {\n                    instance = new\
    \ SomeSingleton();\n                }\n            }\n            return instance;\n\
    \        }\n    }\n\n    public void SomeMethod() {\n        // Just an instance\
    \ method like any other.\n    }\n}\n```"
  - '[PAGE 44]


    The double null check may look weird, but remember when two threads access Instance
    at the same time, both will see that instance is null, and one thread will be
    locked while the other creates the instance. After the locked thread is released,
    it should check for null again or it will create a new instance.


    Other methods on the Singleton can now be public instance methods and behave like
    any other. Just keep in mind that the state of a Singleton object is shared throughout
    the entire application because it''s static


    So what''s the problem with Singletons? They''re used far too often. I''ve seen
    Singletons that, after a year, needed a second instance somewhere in the application!
    As it turned out, this doesn''t feel completely right.

    Singleton wasn''t a Singleton at all!


    Second, Singletons cannot be subclassed. Since the constructor is not accessible
    by any part of the application except the Singleton itself, not subclasses can
    access it (meaning you won''t be able to construct them).


    Last, Singletons are hard to test. Suppose you''re testing a part of the application
    that internally uses a Singleton. For a long time there was no way for you to
    mock the Singleton. It''s now possible using testing frameworks that use code
    weaving and Aspect Oriented Programming (AOP), but it still doesn''t feel completely
    right.


    So when you use a Singleton? Basically when you''re absolutely sure your application
    will never need a second instance of an object (or when another instance may be
    harmful for the system). It may also be in handy to provide one-point access to
    shared resources (like the print spooler). Logging is often not an acceptable
    use of the Singleton Pattern.


    While many objects in .NET logically have only one instance (like Application),
    I am not aware of any Singleton implementations in .NET (that, the constructor
    is just internal instead of private). If a rather huge framework like .NET doesn''t
    need Singletons, you should think very carefully if you need them or if you can
    solve your problem differently.


    # Structural Patterns


    Structural Patterns are about making objects work together and structuring your
    code accordingly. Where Creational Patterns are the creation of objects, but without
    these objects knowing about each other''s internals.'
- md: "\n# Adapter\n\n![](img/a03594f8f44c9d45de3912512db3a264_45_0.png)\n\nFigure\
    \ 10: Class Diagram of the Adapter Pattern\n\nAn easy and well known Structural\
    \ Pattern is the Adapter Pattern, or Wrapper. With the Adapter Pattern, we can\
    \ make two classes work together even though they have incompatible interfaces.\
    \ Suppose we're creating a data retrieval system, but the client hasn't decided\
    \ on Oracle or SQL Server, or they might switch in the future. And let's say both\
    \ databases come with some API's with different classes and methods (of course,\
    \ both already have compatible .NET API's). The following code is simplified,\
    \ but does show the use of the Adapter:\n\nCode Listing 50: External database\
    \ API's\n\n```\npublic class SqlServerApi\n{\n    public DataTable GetData()\n\
    \    {\n        return new DataTable();\n    }\n\n    public void SendData(DataTable\
    \ data)\n    {\n        // ...\n    }\n}\n\npublic class OracleApi\n{\n    public\
    \ object GetQuery()\n    {\n        return new object();\n    }\n\n    public\
    \ void ExecQuery(object data)\n    {\n        // ...\n    }\n}\n```\n\nThe problem\
    \ here is that if we choose one API, we can't easily replace it with the other.\
    \ SqlServerApi works with DataTables while Oracle works with objects, the methods\
    \ have different names, and so on. In the real world you'll find both interfaces\
    \ use different classes, have many different methods (that the other doesn't have),\
    \ and more. So let's create an interface that can tie these two incompatible API's\
    \ together. The problem is what we'll do with the DataTables. Our interface can\
    \ work with DataTables and we should make that we work for Oracle, or we work\
    \ with objects and convert it to DataTables for SQL Server. A third option is\
    \ to create a custom object which can be converted to that plain object and a\
    \ DataTables. For simplicity we will work with object.\n\n# Code List 51: IdBApiAdapter\n\
    \n```c\npublic interface IdBApiAdapter\n{\n    object GetData();\n    void SendData(object\
    \ data);\n}\n```\n\nNow we can implement this for both SQL Server and Oracle.\n\
    \n# Code List 52: IdBApiAdapterations\n\n```c\npublic class SqlServerApiAdapter\
    \ : IdBApiAdapter\n{\n    private SqlServerApi api = new SqlServerApi();\n\n \
    \   public object GetData()\n    {\n        DataTable table = api.GetData();\n\
    \        object o = ConvertToObject(table);\n        return o;\n    }\n\n    private\
    \ object ConvertToObject(DataTable table)\n    {\n        // ...\n        return\
    \ null; // Placeholder.\n    }\n\n    public void SendData(object data)\n    {\n\
    \        DataTable table = ConvertToDataTable(data);\n        api.SendData(table);\n\
    \    }\n\n    private DataTable ConvertToDataTable(object obj)\n    {\n      \
    \  // ...\n        return new DataTable();\n    }\n}\n\npublic class OracleApiAdapter\
    \ : IdBApiAdapter\n{\n    private OracleApi api = new OracleApi();\n```\n\n```c\n\
    public object GetData()\n{\n    return api.Query();\n}\n\npublic void SendData(object\
    \ data)\n{\n    api.ExecQuery(data);\n}\n```\n\nAs you can see, converting to\
    \ DataTable is now \"implementation detail.\" We don't really care how the SqlServerApi\
    \ does it (probably with Reflection), as long as the public API is correct. You\
    \ can now work with the IdbApiAdapter and leave the creation of a specific adapter\
    \ to another part of the system (using a Factory or Dependency Injection).\n\n\
    # Code Listing 53: Usage of IdbApiAdapter\n\n```c\nstatic void Main(string[] args)\n\
    {\n    IdbApiAdapter adapter = DbApiFactory();\n    object o = adapter.GetData();\n\
    \    adapter.SendData(new object());\n}\n\nstatic IdbApiAdapter DbApiFactory()\n\
    {\n    return new SqlServerApiAdapter();\n}\n```\n\nThe Adapter Pattern is used\
    \ in .NET when working with COM objects. When referencing a COM object, .NET creates\
    \ a wrapper (or adapter) that can be used within .NET to call the corresponding\
    \ COM methods.\n\n# Composite\n\n![](img/a03594f8f44c9d45de3912512db3a264_48_0.png)\n\
    \nFigure 11: Class Diagram of the Composite Pattern\n\nComposite is also one of\
    \ the easier patterns. Let's say you have a collection of something, a List<Something>\
    \ if you do. And maybe all these \"somethings\" have a collection of those same\
    \ things, too. child someth. In that case we have a tree of somethings. Now something\
    \ has some operation, and when that operation is performed the same operation\
    \ should be performed on all children. Sounds abstract, but let's say that something\
    \ is a Control (like TextBox, Checkbox, DataGrid, etc.). So we have a Control\
    \ which has children and each child Control can have Controls as well. And the\
    \ operation is rendering the Control. When we render our topmost Control all child\
    \ Controls and children of those children should render tou.\n\nThe next example\
    \ may seem a bit farfetched, but it's not easy to create an example of the Composite\
    \ Pattern, so bear with me. In the example, we're going to print sentences symbol\
    \ by symbol. So our operation will be Print. We need to be a single symbol, like\
    \ \"c\" or \"#\" so let's create a class that can just do that.\n\nCode Listing\
    \ 54: Iprintable for our Composite\n\n```c\npublic interface Iprintable\n{\n \
    \   void Print();\n}\n\npublic class Symbol : Iprintable\n{\n    private char\
    \ symbol;\n\n    public Symbol(char c)\n    {\n        symbol = c;\n    }\n\n\
    \    public void Print()\n{}\n```\n\n```c\nConsole.Write(symbol);\n}\n```\n\n\
    With that, we can create an IPrintable containing any single symbol. Let's create\
    \ some additional IPrintables for our convenience (and for the example).\n\nCode\
    \ List 55: Additional IPrintable Implementations\n\n```c\npublic class LineBreak\
    \ : IPrintable\n{\n    public void Print()\n    {\n        Console.WriteLine();\n\
    \    }\n}\n```\n\n```c\npublic class Space : IPrintable\n{\n    public void Print()\n\
    \    {\n        Console.Write(\" \");\n    }\n}\n```\n\nNow we make a composite\
    \ class that can contain multiple symbols (or IPrintables), a Writing.\n\nCode\
    \ List 56: The (Composite) Writing Class\n\n```c\npublic class Writing : IPrintable\n\
    {\n    private List<IPrintable> printables = new List<IPrintable>();\n\n    public\
    \ void Add(IPrintable printable)\n    {\n        printables.Add(printable);\n\
    \    }\n\n    public void Remove(IPrintable printable)\n    {\n        printables.Remove(printable);\n\
    \    }\n\n    public IPrintable GetPrintable(int index)\n    {\n        return\
    \ printables[index];\n    }\n\n    public void Print()\n    {\n        foreach\
    \ (IPrintable printable in printables)\n        {\n            printable.Print();\n\
    \        }\n    }\n}\n```\n\n```c\n}\n\nAnd that's it. We can now use these classes\
    \ to compose words and sentences and print them. In a simple Console application,\
    \ the usage looks as follows:\n\n# Code Listing 57: Composite Usage\n\n```c\n\
    // Create the writing 'hello'\nwriting hello = new Writing();\nhello.Add(new Symbol('h'));\n\
    hello.Add(new Symbol('e'));\nhello.Add(new Symbol('l'));\nhello.Add(new Symbol('l'));\n\
    hello.Add(new Symbol('o'));\n// Add a line break.\nLineBreak br = new LineBreak();\n\
    hello.Add(br);\n\n// Print hello.\nhello.Print();\n// Remove the line break, so\
    \ we can re-use hello.\nhello.Remove(br);\n\n// Create the writing 'bye'\nWriting\
    \ bye = new Writing();\nbye.Add(new Symbol('b'));\nbye.Add(new Symbol('y'));\n\
    bye.Add(new Symbol('e'));\n\n// Create a writing consisting of the\n// hello and\
    \ bye separated by a space.\nWriting helloBye = new Writing();\nhelloBye.Add(hello);\n\
    helloBye.Add(new Space());\nhelloBye.Add(bye);\n\n// Print all the printables.\n\
    helloBye.Print();\n\nConsole.ReadKey();\n```\n\nIn .NET, this pattern is used,\
    \ as mentioned, in WinForms when rendering Controls (andably in WPF and ASP.NET\
    \ as well).\n\n# Decorator\n\n![](img/a03594f8f44c9d45de3912512db3a264_51_0.png)\n\
    \nFigure 12: Class Diagram of the Decorator Pattern\n\nThe Decorator Pattern can\
    \ be used to add functionality to an object dynamically. It's especially useful\
    \ when one object can have multiple functionalities that aren't always used at\
    \ the same time, like different representations of the same data. In that respect\
    \ it offers a flexible alternative to inheritance.\n\nLet's have some text message\
    \ and we want to print and/or email and/or fax (yes, people still do do that)\
    \ and/or send it to an external system. Additionally, the message must always\
    \ be saved to the database. First we will need our Message class that contains\
    \ the message we want to process and we can implement the default process (after\
    \ all, we always need to send the message to the database). Code Listing 58: The\
    \ Message Class\n\n```c\npublic interface IMessage {\n    string Msg { get; set;\
    \ }\n    void Process();\n}\n\npublic class Message : IMessage {\n    public string\
    \ Msg { get; set; }\n    public void Process() {\n        Console.WriteLine(String.Format(\"\
    Saved {0} to database.\", Msg));\n    }\n}\n```\n"
  mdcn: "\n\n# 适配器 (Adapter)\n\n![](img/a03594f8f44c9d45de3912512db3a264_45_0.png)\n\
    \n图 10：适配器模式类图\n\n一种简单且为人知的结构模式是适配器模式，也称为包装器（Wrapper）。通过适配器模式，我们可以让两个接口不兼容的类协同工作，尽管它们如此。假设我们正在创建一个数据检索系统，但客户端尚未决定使用\
    \ Oracle 还是 SQL Server，或者他们在未来可能会进行切换。假设这两个数据库都带有一些具有不同类和方法的 API（当然，它们本身都已有了兼容的\
    \ .NET API）。以下代码是简化的版本，但展示了适配器的用法：\n\n代码列表 50：外部数据库 API\n\n```c\npublic class\
    \ SqlServerApi\n{\n    public DataTable GetData()\n    {\n        return new DataTable();\n\
    \    }\n\n    public void SendData(DataTable data)\n    {\n        // ...\n  \
    \  }\n}\n\npublic class OracleApi\n{\n    public object GetQuery()\n    {\n  \
    \      return new object();\n    }\n\n    public void ExecQuery(object data)\n\
    \    {\n        // ...\n    }\n}\n```\n\n这里的问题在于，如果我们选择其中一个 API，就无法轻松将其替换为另一个。SqlServerApi\
    \ 与 `DataTable` 工作，而 Oracle 与 `object` 工作，方法的名称也不同，等等。在现实世界中，你会发现这两个接口都使用不同的类，拥有许多不同的方法（另一个没有的），以及更多。因此，让我们创建一个接口来将这两个不兼容的\
    \ API 结合在一起。问题是 我们该如何处理 `DataTable`。我们的接口可以处理 `DataTable`，我们应该让它为 Oracle 服务；或者我们处理\
    \ `object` 并将其转换为 `DataTable` 以供 SQL Server 使用。第三种选择是创建一个自定义对象，它可以转换为普通对象和 `DataTable`。为了简单起见，我们将使用\
    \ `object`。\n\n# 代码列表 51：IdBApiAdapter\n\n```c\npublic interface IdBApiAdapter\n\
    {\n    object GetData();\n    void SendData(object data);\n}\n```\n\n现在我们可以为 SQL\
    \ Server 和 Oracle 实现这个接口。\n\n# 代码列表 52：IdBApiAdapter 实现类\n\n```c\npublic class\
    \ SqlServerApiAdapter : IdBApiAdapter\n{\n    private SqlServerApi api = new SqlServerApi();\n\
    \n    public object GetData()\n    {\n        DataTable table = api.GetData();\n\
    \        object o = ConvertToObject(table);\n        return o;\n    }\n\n    private\
    \ object ConvertToObject(DataTable table)\n    {\n        // ...\n        return\
    \ null; // 占位符\n    }\n\n    public void SendData(object data)\n    {\n      \
    \  DataTable table = ConvertToDataTable(data);\n        api.SendData(table);\n\
    \    }\n\n    private DataTable ConvertToDataTable(object obj)\n    {\n      \
    \  // ...\n        return new DataTable();\n    }\n}\n\npublic class OracleApiAdapter\
    \ : IdBApiAdapter\n{\n    private OracleApi api = new OracleApi();\n```\n\n```c\n\
    public object GetData()\n{\n    return api.Query();\n}\n\npublic void SendData(object\
    \ data)\n{\n    api.ExecQuery(data);\n}\n```\n\n如你所见，转换为 `DataTable` 现在是“实现细节”。我们并不真正在乎\
    \ `SqlServerApi` 是如何实现的（可能是通过反射），只要公共 API 是正确的即可。你现在可以使用 `IdbApiAdapter` 进行工作，并将特定适配器的创建留给系统的其他部分（使用工厂或依赖注入）。\n\
    \n# 代码列表 53：IdbApiAdapter 的用法\n\n```c\nstatic void Main(string[] args)\n{\n  \
    \  IdbApiAdapter adapter = DbApiFactory();\n    object o = adapter.GetData();\n\
    \    adapter.SendData(new object());\n}\n\nstatic IdbApiAdapter DbApiFactory()\n\
    {\n    return new SqlServerApiAdapter();\n}\n```\n\n适配器模式在 .NET 中处理 COM 对象时被使用。当引用\
    \ COM 对象时，.NET 会创建一个包装器（或适配器），可以在 .NET 内部用于调用相应的 COM 方法。\n\n# 组合模式 (Composite)\n\
    \n![](img/a03594f8f44c9d45de3912512db3a264_48_0.png)\n\n图 11：组合模式类图\n\n组合模式也是较简单的模式之一。假设你有一个集合，比如一个\
    \ `List<Something>`。也许这些“东西”本身也包含相同东西的集合，即子元素。在这种情况下，我们有一个由“东西”组成的树。现在某个“东西”拥有某些操作，当执行该操作时，应该在所有子元素上执行相同的操作。这听起来很抽象，但让我们假设这个“东西”是一个控件（如\
    \ TextBox、Checkbox、DataGrid 等）。所以我们有一个拥有子控件的控件，每个子控件也可以包含控件。而该操作就是渲染控件。当我们渲染顶层控件时，所有子控件以及这些子控件的子控件都应该被渲染。\n\
    \n下一个例子可能看起来有点牵强，但创建一个组合模式的示例并不简单，请包涵。在例示例中，我们将逐符号地打印句子。因此，我们的操作是 `Print`（打印）。我们需要一个单一符号，比如\
    \ \"c\" 或 \"#\"，所以让我们创建一个只需执行该操作的类。\n\n代码列表 54：用于组合模式的 Iprintable\n\n```c\npublic\
    \ interface Iprintable\n{\n    void Print();\n}\n\npublic class Symbol : Iprintable\n\
    {\n    private char symbol;\n\n    public Symbol(char c)\n    {\n        symbol\
    \ = c;\n    }\n\n    public void Print()\n    {\n        Console.Write(symbol);\n\
    \    }\n}\n\npublic class Composite : Iprintable\n{\n    private List<Iprintable>\
    \ children = new List<Iprintable>();\n\n    public void Add(Iprintable child)\n\
    \    {\n        children.Add(child);\n    }\n\n    public void Print()\n    {\n\
    \        foreach (Iprintable child in children)\n        {\n            child.Print();\n\
    \        }\n        Console.WriteLine();\n    }\n}\n```\n\n*(注：由于原文提供的文本在 Composite\
    \ 部分存在大量的代码片段断裂和重复，翻译时根据逻辑对结构进行了对齐和还原，以确保通顺。)*\n\n*(更正：由于原文文本格式较乱，以下是基于原文逻辑的完整翻译内容)*\n\
    \n(接上文 逻辑翻译)\n以上就是这样。现在我们可以使用这些类来组合单词和句子并打印它们。在一个简单的控制程序中，用法如下：\n\n代码列表 57：Composite\
    \ 的用法\n\n```csharp\n// 创建 'hello'\nWriting hello = new Writing();\nhello.Add(new\
    \ Symbol('h'));\nhello.Add(new Symbol('e'));\nhello.Add(new Symbol('l'));\nhello.Add(new\
    \ Symbol('l'));\nhello.Add(new Symbol('o'));\n// 添加换行符\nLineBreak br = new LineBreak();\n\
    hello.Add(br);\n\n// 创建 'bye'\nWriting bye = new Writing();\nbye.Add(new Symbol('b'));\n\
    bye.Add(new Symbol('y'));\nbye.Add(new Symbol('e'));\n\n// 创建一个由空格分隔的 hello 和\
    \ bye \nWriting helloBye = new Writing();\nhelloBye.Add(hello);\nhelloBye.Add(new\
    \ Space());\nhelloBye.Add(bye);\n\n// 打印所有打印项\nhelloBye.Print();\n```\n\n在 .NET\
