    \n与 MVC 相关的两种设计模式是模型视图-视图模型 (MVVM) 和模型视图-演示器 (MVP)。\n\nMVP 是一种用于用户界面的模式。演示器（Presenter）位于模型和视图之间，并对数据进行格式化以便视图可以使用。\n\
    \n在 MVVM 中，ViewModel 是用于显示的视图的抽象。由于对视图的抽象，双向绑定变得可能（模型中的更新直接显示在视图中，视图中的更新也直接推送到模型中）。MVVM\
    \ 是为微软的 Windows Presentation Foundation (WPF) 创建的，但现在也可以在许多如 KnockoutJS 和 AngularJS\
    \ 等 JavaScript 框架中找到。MVC、MVP 和 MVVM 合称为 MV* 模式。请注意，它们并不是互斥的。\n\n# 存储库 (Repository)\n\
