- md: "\n```sharp\npublic void SomeMethod(SomeClass otherInstance)\n{\n    otherInstance.someField\
    \ = \"Some value\";\n}\n\nprivate class InnerClass\n{\n    public void SomeMethod(SomeClass\
    \ param)\n    {\n        param.someField = \"Some value\";\n    }\n}\n```\n\n\
    When omitting an access modifier, a default is assigned (internal for classes\
    \ and private for everything). I'm a big fan of explicitly adding access modifiers\
    \ though.\n\nA last remark, before moving on, is that subclasses cannot have an\
    \ accessibility greater than their base class. If some class has the internal\
    \ access modifier an inheriting class cannot be made public (but it could be private).\n\
    \n# Polymorphism\n\nWe see inheritance and that we can alter the behavior of a\
    \ type through inheritance. Our Person class had a GetFullName method which was\
    \ altered in Employee. We also see that whenever, at run-time, an object of type\
    \ Person is expected we can throw in any subclass of Person, like Employee. This\
    \ is called polymorphism.\n\nIn the following example the PrintFullName method\
    \ takes an object of Person, but it prints \"Sander\" because the parameter that's\
    \ passed into the method is actually of a subtype, which overrides the functionality\
    \ of GetFullName.\n\n> Code Listing 14: Polymorphism\n\n```sharp\nclass Program{\n\
    \    static void Main(string[] args)\n    {\n        Person p = new Employee();\n\
    \        p.FirstName = \"Sander\";\n        p.LastName = \"Rossel\";\n       \
    \ PrintFullName(p);\n        // Press any key to quit.\n        Console.ReadKey();\n\
    \    }\n\n    public static void PrintFullName(Person p)\n    {\n        Console.WriteLine(p.GetFullName());\n\
    \    }\n}\n```\n\n```sharp\npublic class Person\n{\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n    public virtual\
    \ string GetFullName()\n    {\n        return FirstName + \" \" + LastName;\n\
    \    }\n}\npublic class Employee : Person\n{\n    public decimal Salary { get;\
    \ set; }\n    public sealed override string GetFullName()\n    {\n        return\
    \ LastName + \", \" + FirstName;\n    }\n}\n```\n\nWe're going to see a lot more\
    \ of this in the next chapter.\n\n# The Takeaway\n\nThe Three Pillars of OOP are\
    \ the foundation of object-oriented programming. They haven't been implemented\
    \ for nothing and they solve real problems. It's crucial that you know these features\
    \ by heart and practice them in your daily code. Think about encapsulation every\
    \ time you create a class or method. Use inheritance when necessary, but don't\
    \ forget it brings extra complexity to the table as well. Be very wary of polymorphism,\
    \ know which code will run when you inherit classes and override methods. Even\
    \ if you don't practice it you'll come across code that does. Throughout this\
    \ book we'll see these be used extensively.\n\n# Chapter 2 Interfaces\n\nIn the\
    \ previous chapter, we saw that the class Employee inherits from Person. Do you\
    \ see any potential issues with this approach? What if a person is an employee,\
    \ but also a stamp collector? Obviously, a person can also be a stamp collector\
    \ but not an employee (lots of people are “between jobs”). If we all had inheritance\
    \ we might write the following code:\n\n> Code Listing 15: An inheritance chain\n\
    \n```sharp\npublic class Person {\n  // ...\n}\npublic class Employee : Person\
    \ {\n  // ...\n}\npublic class StampCollector : Person {\n  // ...\n}\npublic\
    \ class EmployeeStampCollector : Employee {\n  // ...\n}\n```\n\nI don't know\
    \ about you, but it just doesn't feel right to me. The problem we have is that\
    \ the only thing EmployeeStampCollector and the StampCollector have in common\
    \ is the Person base class, but they're still stamp collectors! Writing a method\
    \ that takes a stamp collector as input is not impossible! This problem could\
    \ be solved using multiple inheritance, but C# doesn't have (and many developers\
    \ say it is better that way).\n\nSo do we solve this problem? We use a Interface.\
    \ An Interface is something like an abstract class with abstract methods. It really\
    \ doesn't do more than defining a type. The good part though, is we can inherit,\
    \ or ‘implement’, multiple interfaces in a single class!\n\nLet's look at an example\
    \ of a random interface:\n\n> Code Listing 16: An interface\n\n```sharp\npublic\
    \ interface ISomeInterface {\n  string SomeProperty { get; set; }\n  string SomeMethod();\n\
    \  void SomethingElse();\n}\n```\n\nNotice that none of the fields have an access\
    \ modifier. If a class implements an interface everything on that interface is\
    \ publicly accessible. This is what the actual implementation would look like:\n\
    \n# Code Listing 17: Interface implementation\n\n```sharp\npublic class SomeClass\
    \ : ISomeInterface\n{\n    public string SomeProperty { get; set; }\n\n    public\
    \ string SomeMethod() {\n        // ...\n    }\n\n    public void SomethingElse()\
    \ {\n        // ...\n    }\n}\n```\n\nHere SomeClass has the types object, SomeClass,\
    \ and ISomeInterface. The \"I\" prefix on ISomeInterface, or any interface, is\
    \ common practice in C#, but not necessary.\n\nWhen using inheritance and interface\
    \ implementation on a single class, you first specify the base class and then\
    \ a comma-separated list of interfaces. How would this look for our Person, Employee\
    \ and StampCollector example?\n\n# Code Listing 18: Interfaces\n\n```sharp\npublic\
    \ interface IEmployee\n{\n    // ...\n}\n\npublic interface IStampCollector\n\
    {\n    // ...\n}\n\npublic class Person\n{\n    // ...\n}\n\npublic class Employee\
    \ : Person, IEmployee\n{\n    // ...\n}\n\npublic class StampCollector : Person,\
    \ IStampCollector\n{\n    // ...\n}\n\npublic class EmployeeStampCollector : Employee,\
    \ IStampCollector\n{\n  // ...\n}\n```\n\nNow both StampCollector and EmployeeStampCollector\
    \ are of type Person and type IStampCollector. EmployeeStampCollector is also\
    \ of type Employee (and IEmployee) because it inherits from Employee, which implements\
    \ IEmployee.\n\nBecause a class can implement multiple interfaces it is possible\
    \ to have an interface inherit from multiple interfaces. A class must then implement\
    \ all interfaces that are inherited by it. For obvious reasons, an interface can't\
    \ inherit a class.\n\nCode Listing 19: Interface inheritance\n\n```sharp\npublic\
    \ interface IPerson { }\npublic interface IEmployee : IPerson {\n}\npublic interface\
    \ IStampCollector : IPerson {\n}\npublic interface IEmployeeStampCollector : IEmployee,\
    \ IStampCollector {\n}\n```\n\nNow that's a very theoretical example, but let's\
    \ consider a real world example. Let's say an application needs to log some information.\
    \ We may want to log to a database in a production environment, but we'd like\
    \ to log to the console for debugging purposes. Additionally, if the database\
    \ isn't available, we'd like to log to the Event log.\n\nCode Listing 20: Loggers\n\
    \n```sharp\nclass Program {\n    static void Main(string[] args) {\n        List<ILogger>\
    \ loggers = new List<ILogger>();\n        loggers.Add(new ConsoleLogger());\n\
    \        loggers.Add(new WindowsEventLogger());\n        loggers.Add(new DatabaseLogger());\n\
    \        foreach (ILogger logger in loggers) {\n            logger.LogError(\"\
    Some error occurred.\");\n            logger.LogInfo(\"All's well!\");\n     \
    \   }\n        Console.ReadKey();\n    }\n}\npublic interface ILogger {\n    void\
    \ LogError(string error);\n    void LogInfo(string info);\n}\npublic class ConsoleLogger\
    \ : ILogger {\n    public void LogError(string error) {\n        Console.WriteLine(\"\
    Error: \" + error);\n    }\n    public void LogInfo(string info) {\n        Console.WriteLine(\"\
    Info: \" + info);\n    }\n}\npublic class WindowsEventLogger : ILogger\n{\n  \
    \  public void LogError(string error)\n    {\n        Console.WriteLine(\"Logging\
    \ error to Windows Event log: \" + error);\n    }\n\n    public void LogInfo(string\
    \ info)\n    {\n        Console.WriteLine(\"Logging info to Windows Event log:\
    \ \" + info);\n    }\n}\n\npublic class DatabaseLogger : ILogger\n{\n    public\
    \ void LogError(string error)\n    {\n        Console.WriteLine(\"Logging error\
    \ to database: \" + error);\n    }\n\n    public void LogInfo(string info)\n \
    \   {\n        Console.WriteLine(\"Logging info to database: \" + info);\n   \
    \ }\n}\n```\n\nThat's pretty nifty! And as you can, add or remove loggers as we\
    \ please.\n\nBy the way, having an interface and a base class (which implements\
    \ the interface) is perfectly fine. Maybe you have an ILogger, a DbLogger (which\
    \ implements ILogger and defines some common behavior for logging to a database)\
    \ and then have a SqlServerLogger, an OracleLogger, a MySQLLogger, etc. (which\
    \ all inherit from DbLogger).\n\n# Explicitly Implementing Interfaces\n\nI've\
    \ mentioned that when you implement an interface, all members of that interface\
    \ are public by default. Their logical behavior, after all, an interface is a\
    \ sort of contract that promises other code that will have some members and properties\
    \ defined (because it's of a certain type). It is, however, possible to hide interface\
    \ members. To do that, you can explicitly implement an interface. When you explicitly\
    \ implement an interface member, the only way to invoke that member is by using\
