    \ are Model View ViewModel (MVVM) and Model View Presenter (MVP)."
  - '[PAGE 71]


    MVP is a pattern for the user interface. The Presenter sits between the Model
    and the View formats data so the View can use it.


    In MVVM, the ViewModel is an abstraction of the View that uses for display. Because
    of abstraction of the View, two-way binding is made possible (updates in the Model
    are directly presented in the View and updates in the View are directly pushed
    to the Model). MVVM was created for Microsoft''s Windows Presentation Foundation
    (WPF), but can now also be found in many JavaScript frameworks like KnockoutJS
    and AngularJS. Together MVC, MVP, and MVVM are referred to as the MV* Patterns.
    Note that they are not mutually exclusive.


    # Repository


    ![](img/a03594f8f44c9d45de3912512db3a264_71_0.png)


    Figure 20: Sequence Diagram of the Repository Pattern


    The Repository Pattern is a difficult pattern to, luckily, you don''t have to
    implement yourself. It makes use of other patterns, the Data Mapper and the Query
    Object. A Data Mapper is a piece of code that maps database records to C# domain
    objects. The database and the domain objects are unaware of each other. A Query
    Object is a C# object that behaves like a database WHERE clause and can be passed
    to the Data Mapper ("criteria" in the diagram). The Repository, finally, is a
    collection-like interface that can retrieve domain objects and sits between your
    domain and data mapping layers. Once going, the benefit to it is separation of
    concerns. Your domain objects dont know about your database and can be reused
    for other purposes. Your database layer can be swapped (for example, going from
    Oracle to SQL Server) and you''ll only have to change your Data Mapper. Your Data
    Mapper, Query Object, and Repository can also be reused in other projects.'
  - "[PAGE 72]\n\nAs much as I'd like building a Data Mapper, Query Object, Repository,\
    \ we're not going to do that. That costs a lot of time and can be a book on its\
    \ Own. Instead, I'm going to create a simple Console application, save it, an\
    \ ADO.NET Entity model to project, and connect to database I have a Person table.\
    \ The Entity Framework will generate the Person class for me (I'm not taking the\
    \ first approach)\n\n# Code Listing 87: Generated Person Class\n\n```\npublic\
    \ partial class Person\n{\n    public int Id { get; set; }\n    public string\
    \ FirstName { get; set; }\n    public string LastName { get; set; }\n    public\
    \ Nullable<DateTime> DateBirth { get; set; }\n}\n```\n\nIt will also create the\
    \ Repository, which inherits from DbContext, and gives access to my Person objects\
    \ like they were in memory C objects.\n\n# Code Listing 88: Generated DbContext\n\
    \n```\npublic partial class ApplicationEntities : DbContext\n{\n    public ApplicationEntities()\n\
    \    {\n        base(\"ApplicationEntities\")\n    }\n    protected override void\
    \ OnModelCreating(DbBuilder modelBuilder)\n    {\n        throw new UnintentionalCodeFirstException();\n\
    \    }\n    public virtual DbSet<Person> People { get; set; }\n}\n```\n\nAnd here\
    \ comes the beauty. The usage of the Repository Pattern (when done right) is just\
    \ really easy.\n\n# Code Listing 89: Usage of the Repository\n\n```\nusing (ApplicationEntities\
    \ context = new ApplicationEntities())\n{\n    // Construct a query.\n    context.People\
    \ is the Repository.\n    // The Query Object (an Expression) is constructed .Where(lambda).\n\
    \    // The Data Mapper is not visible, but is used by the Entity Framework internally.\n\
    \    IQueryable<Person> query = context.People.Where(p => p.FirstName.Contains(\"\
    Sand\"));\n    // ToList() will actually call the database.\n    List<Person>\
    \ people = query.ToList();\n}\n```\n\nPersonally I feel the whole lambda creates\
    \ Expression (Query Object) philosophy, but it observes the pattern bit. Other\
    \ APIs I've used have a more explicit Query Object."
  - '[PAGE 73]


    # Code List 90: Explicit Query Object


    ```

    List<Person> people = SomeApi.People.Select(Query.Contains("FirstName", "Sand"));

    ```


    It still beats writing SQL!


    A word of caution when using a Repository: everything may look like C#, but the
    dark truth is that it isn''t. Ultimately, some query will be sent to your database,
    and if you''re not careful it''s not going to be pretty. The Entity Framework
    (and other ORM''s) are capable of joining, aggregating, what you have. Some SQL
    code will be generated and if you don''t know what you''re doing it will be ugly
    and slow. Sometimes it''s just a lot quicker to write some SQL and do with it!


    # The Takeaway


    There are many patterns. Some patterns can be generally applied in any (object-oriented)
    language, while others are language specific. Some patterns are even specific
    to a certain programming paradigm. For example, JavaScript, which has no modifiers,
    has Design Patterns, like Module, to be able to hide internal objects. When you''re
    building a multi-threaded application, you might want to use patterns specifically
    designed to simplify multi-threaded code. To discuss all these patterns, you''d
    need many books that aren''t exactly succinct. Design Patterns, like most things
    in life, have fans and opponents. While it''s true that Design Patterns do not
    guarantee beautiful software, and may even lead to overly complex software, it''s
    also important that you know the tools and methods that are available to you.
    Design Patterns are in no way the holy grail of programming, but, when applied
    correctly, can help you in creating robust and maintainable software.


    The .NET Framework uses many of other Design Patterns that aren''t discussed here,
    for example; the Iterator Pattern, with IEnumerable and Enumerator, making it
    possible to loop through collections, the Builder Pattern, for constructing complex
    objects, for example the ConnectionStringBuilder; the Visitor Pattern in the ExpressionVisitor
    (when working with Expressions/the Entity Framework); the Proxy Pattern when working
    with Windows Communication Foundation (WCF); and the Unit of Work Pattern to gracefully
    handle database transactions in the Entity Framework.'
  - "[PAGE 74]\n\n# # Chapter 5 General Responsibility Assignment Software Patterns\
    \ or Principles (GRASP)\n\nOne set of patterns that you aren't going to see a\
    \ lot are the GRASP patterns, General Responsibility Assignment Software Patterns\
    \ or Principles (I'm pretty sure the abbreviation came first). They are not quite\
    \ patterns like Design Patterns, they are more like advice that should help you\
    \ solve some programming problems. I'm not sure why GRASP is not as popular as\
    \ SOLID or Design Patterns, as the principles are no less important and every\
    \ developer should know them. Craig Larman discusses them in his book Applying\
    \ UML and Patterns - An Introduction to Object-Oriented Analysis and Design and\
    \ Iterative Development⁴ There are a total of nine GRASP principles, and some\
    \ of them overlap with what was already discussed. In this chapter I'll discuss\
    \ the GRASP Patterns that have no overlap with what we previously discussed. The\
    \ ones that overlap are Controller (like we've seen in MVC), Polymorphism (one\
    \ of the three pillars of OOP), Induction (another word for Dependency Inversion),\
    \ and Protected Variations (another form of Dependency Inversion) and Encapsulation.\n\
    \n# ## Creator\n\nOne of the first problems you will encounter with any OO application\
    \ is that you need to create an instance of some object, but you're not sure what\
    \ object is to create it. In some cases this is obvious, as when working with\
    \ certain Design Patterns such as Factory Method or Singleton. Other times it's\
    \ not obvious. At the start of this book, we saw a small example with a Car and\
    \ an Engine class (Inheritance vs. Composition).\n\n**Code Listing 91: Car and\
    \ Engine\n\n```\npublic class Engine {\n    // ...\n}\n\npublic class Car {\n\
    \    private Engine engine = new Engine();\n    // ...\n}\n```\n\n> ⁴ Craig Larman\
    \ - Applying UML and Patterns: An Introduction to Object-Oriented Analysis and\
    \ Design and Iterative Development"
- md: "\nA Car has an Engine, so it should obviously create an Engine, right? Well,\
    \ maybe. There are a few pointers for whether one class creates another. If some\
    \ class or aggregates another class, closely uses another, or has the initializing\
    \ data for another class (see also Information Expert in the next section), it\
    \ might be a good idea to have that class create another class. A Car does contain\
    \ an Engine, but it does not aggregate it. A Car uses an Engine. It also has the\
    \ initializing data for an Engine? Who knows? It depends on your design. In this\
    \ case I would go for another solution, which is to compose the Car with an Engine\
    \ class through the constructor (or through some means).\n\n## Code Listing 92:\
    \ Different Engines\n\n```\npublic abstract class Engine { }\npublic class GasolineEngine\
    \ : Engine { }\npublic class DieselEngine : Engine { }\n\npublic class Car\n{\n\
    \    private Engine engine;\n    public Car(Engine engine) {\n        this.engine\
    \ = engine;\n    }\n    // ...\n}\n```\n\nAnd now that another class creates an\
    \ Engine, you can give your Car any Engine you want.\n\n## Code Listing 93: Compose\
    \ by your Car\n\n```\nCar diesel = new Car(new DieselEngine());\nCar gas = new\
    \ Car(new GasolineEngine());\n```\n\nOf course, that still doesn't solve the entire\
    \ problem, because who creates the Car, and does that same class or yet create\
    \ the Engine?\n\nIt is important to note that these objects are objects and not\
    \ domain objects. The domain, or real world objects, are probably created on some\
    \ assembly line. Chances in your code, that's probably not going to create the\
    \ Car or Engine. One thing you know for sure, a Car has never created an Engine\
    \ in the real world.\n\n## Information Expert\n\nInformation Expert is a principle\
    \ that you are already applying. Information Expert addresses the problem of which\
    \ object handles responsibility. Often have you wondered what the right class\
    \ was for a method? The answer lies with Information Expert and is deceptively\
    \ simple. A responsibility should be assigned to the class that has all the information\
    \ necessary to fulfill that responsibility.\n\nLet's take a look at an example.\
    \ Earlier we created an Adapter for a SqlServerApi class. Here's a small reminder:\n\
    \n```java\npublic class SqlServerApiAdapter : IDBApiAdapter\n{\n    private SqlServerApi\
    \ api = new SqlServerApi();\n\n    public object GetData()\n    {\n        DataTable\
    \ table = api.GetData();\n        object o = ConvertToObject(table);\n       \
    \ return o;\n    }\n\n    private object ConvertToObject(DataTable table)\n  \
    \  {\n        // ...\n        return null; // Placeholder.\n    }\n\n    public\
    \ void SendData(object data)\n    {\n        DataTable table = ConvertToDataTable(data);\n\
    \        api.SendData(table);\n    }\n\n    private DataTable ConvertToDataTable(object\
    \ obj)\n    {\n        // ...\n        return new DataTable();\n    }\n}\n\npublic\
    \ class OracleApiAdapter : IDBApiAdapter\n{\n    private OracleApi api = new OracleApi();\n\
    \n    public object GetData()\n    {\n        return api.GetQuery();\n    }\n\n\
    \    public void SendData(object data)\n    {\n        api.ExecQuery(data);\n\
    \    }\n}\n```\n\n## Code Listing 94: The SqlServerApiAdapter\n\nNow as it turns\
    \ out we want to be able to create new databases. That is new functionality as\
    \ it is not supported by GetData or SendData. Now could we put this new CreateDatabase\
    \ method? Maybe in our Program class?\n\n## Code Listing 95: SqlServerApi in Program\n\
    \n```csharp\nclass Program\n{\n    static void Main(string[] args)\n    {\n  \
    \      CreateDatabase(\"MyDB\");\n        SqlServerApiAdapter adapter = new SqlServerApiAdapter();\n\
    \        object data = adapter.GetData();\n        // ...\n    }\n\n    static\
    \ void CreatedDatabase(string name)\n    {\n        SqlServerApi api = new SqlServerApi();\n\
    \        api.CreateDatabase(name);\n    }\n}\n```\n\nI think you can see the problem.\
    \ We've gone through all the trouble of creating an Adapter for the SqlServerApi\
    \ and now we're going to use it directly in our application. It makes no sense,\
    \ as SqlServerApiAdapter is the much more obvious choice. It already uses SqlServer\
    \ here anyway! And that's exactly the point of Information Expert. The SqlServerApiAdapter\
    \ has all the information that's necessary to create a new database, so it is\
    \ a good candidate for getting this new functionality. The alternative, Program,\
    \ knows nothing about SqlServer here, so the choice is easily made.\n\nThe example\
    \ is kind of obvious, but it demonstrates what Information Expert is all about.\
    \ I'll tell you a little secret too: I've seen software that had CreateDatabase\
    \ in Program (well, not exactly that, but a likewise situation). When a code grows\
    \ large, it is not always obvious where new functionality goes.\n\n## Low Coupling\n\
    \nThe Low Coupling principle helps in keeping the impact of changes to a minimum.\
    \ Coupling between classes is when a class depend upon another. Needless to say\
    \ that a lot of classes depend on a certain class it becomes difficult to change\
    \ that class. The Information Expert Principle actually helps towards this end.\
    \ Let's check the previous example with the SqlServerApi. Putting the CreateDatabase\
    \ method in Program was bad design because Program didn't know about SqlServerApi\
    \ and shouldn't need to know about it. It created unnecessary coupling between\
    \ SqlServerApi and Program.\n\n![](img/a03594f8f44c9d45de3912512db3a264_78_0.png)\n\
    \nFigure 21: Sequence Diagram of High Coupling\n\nAs you can see in the diagram,\
    \ there is a direct line between **Program** and **SqlServerApi**. In this design\
    \ **Program** depends upon **SqlServerApi**. If **SqlServerApi** changes, we only\
    \ need to change **Program**.\n\n## High Cohesion\n\nCohesion is the degree to\
    \ which elements of a class belong together. The High Cohesion Principle states\
    \ that a class' cohesion should be high. In other words, the methods and properties\
    \ of a class should belong together. Let's look at another example. Suppose we\
    \ have a **Person** class with some properties and methods:\n\n## Code Listing\
    \ 96: A Person Class\n\n```csharp\npublic class Person {\n    public string FirstName\
    \ { get; set; }\n}\n```\n\n```csharp\npublic string LastName { get; set; }\npublic\
    \ DateTime DateOfBirth { get; set; }\n\npublic string GetFullName()\n{\n    return\
    \ String.Format(\"{0} {1}\", FirstName, LastName);\n}\n\npublic int GetAge()\n\
    {\n    int age = DateTime.Today.Year - DateOfBirth.Year;\n    // Month and Day\
    \ correction.\n    if (DateOfBirth.AddYears(age) > DateTime.Today)\n    {\n  \
    \      age -= 1;\n    }\n    return age;\n}\n```\n\nCohesion is high because all\
    \ properties and methods describe a person. Let's add a method.\n\n## Code Listing\
    \ 97: Person with SalesOrders\n\n```csharp\npublic class Person\n{\n    // ...\n\
    \    public List<SalesOrder> GetSalesOrders()\n    {\n        // ...\n    }\n\
    }\n```\n\nThe cohesion of Person just went down. It's not completely wrong, but\
    \ you should ask yourself if a Person really needs to know about a SalesOrder.\
    \ It's not unthinkable that you want to use the Person in a context where you\
    \ don't also want to depend on the SalesOrder class. Maybe we could delegate the\
    \ retrieval of SalesOrders for a Person to some other class.\n\n## Code Listing\
    \ 98: A SalesOrderRepository\n\n```csharp\npublic class SalesOrderRepository\n\
    {\n    public List<SalesOrder> GetPersonsSalesOrders(Person person)\n    {\n \
    \       // ...\n    }\n}\n```\n\n## Code Listing 99: Usage of the SalesOrderRepository\n\
    \n```csharp\nPerson sander = new Person\n{}\n```\n"
  mdcn: "\n\n汽车有一个引擎，所以它理而应该应该创建一个引擎，对吧？嗯，也许吧。关于一个类是否应该创建另一个类，有几点提示。如果某个类聚合了另一个类、紧密使用另一个类，或者拥有另一个类的初始化数据（另见下一节的**信息专家**），那么让该类来创建另一个类可能是一个好主意。汽车确实包含一个引擎，但它并没有聚合它。汽车使用引擎。它还拥有引擎的初始化数据吗？谁知道呢？这取决于你的设计。在这种情况下，我会选择另一种解决方案，即通过构造函数（或某些手段）通过引擎类来组合汽车类。\n\
    \n## 代码列表 92: 不同的引擎\n\n```\npublic abstract class Engine { }\npublic class GasolineEngine\
    \ : Engine { }\npublic class DieselEngine : Engine { }\n\npublic class Car\n{\n\
    \    private Engine engine;\n    public Car(Engine engine) {\n        this.engine\
    \ = engine;\n    }\n    // ...\n}\n```\n\n现在由另一个类来创建引擎，你可以给你的汽车提供任何你想要的引擎。\n\n\
    ## 代码列表 93: 通过你的汽车进行组合\n\n```\nCar diesel = new Car(new DieselEngine());\nCar\
    \ gas = new Car(new GasolineEngine());\n```\n\n当然，这还没有解决整个问题，因为谁来创建汽车？是同一个类还是另一个类来创建引擎？\n\
    \n需要注意的是，这些是对象，而不是领域对象。领域（或者说现实世界对象）可能是在某些装配线上创建的。在你的代码中，可能不会创建汽车或引擎。你唯一确定的一点是，在现实世界中汽车从未创建过引擎。\n\
    \n## 信息专家\n\n信息专家（Information Expert）是你已经在应用的一个原则。信息专家解决了由哪个对象来处理某项责任的问题。你是否经常想过某个方法应该属于哪个类？答案就在信息专家中，而且简单得具有欺骗性。一个责任应该被分配给拥有履行该责任所需的全部信息的类。\n\
    \n让我们来看一个例子。早些我们为 `SqlServerApi` 类创建了一个适配器（Adapter）。这里有一个简短的回顾：\n\n```java\npublic\
    \ class SqlServerApiAdapter : IDBApiAdapter\n{\n    private SqlServerApi api =\
    \ new SqlServerApi();\n\n    public object GetData()\n    {\n        DataTable\
    \ table = api.GetData();\n        object o = ConvertToObject(table);\n       \
    \ return o;\n    }\n\n    private object ConvertToObject(DataTable table)\n  \
    \  {\n        // ...\n        return null; // 位符\n    }\n\n    public void SendData(object\
    \ data)\n    {\n        DataTable table = ConvertToDataTable(data);\n        api.SendData(table);\n\
    \    }\n\n    private DataTable ConvertToDataTable(object obj)\n    {\n      \
    \  // ...\n        return new DataTable();\n    }\n}\n\npublic class OracleApiAdapter\
    \ : IDBApiAdapter\n{\n    private OracleApi api = new OracleApi();\n\n    public\
    \ object GetData()\n    {\n        return api.GetQuery();\n    }\n\n    public\
    \ void SendData(object data)\n    {\n        api.ExecQuery(data);\n    }\n}\n\
    ```\n\n## 代码列表 94: SqlServerApiAdapter\n\n现在事实证明，我们想要能够创建新的数据库。这是一项新功能，因为 `GetData`\
    \ 或 `SendData` 并不支持它。现在我们可以把这个新的 `CreateDatabase` 方法放在哪里？也许放在我们的 `Program` 类中？\n\
    \n## 代码列表 95: Program 中的 SqlServerApi\n\n```csharp\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        CreateDatabase(\"MyDB\");\n       \
    \ SqlServerApiAdapter adapter = new SqlServerApiAdapter();\n        object data\
    \ = adapter.GetData();\n        // ...\n    }\n\n    static void CreatedDatabase(string\
    \ name)\n    {\n        SqlServerApi api = new SqlServerApi();\n        api.CreateDatabase(name);\n\
    \    }\n}\n```\n\n我想你可以看出这个问题。我们费了很大劲为 `SqlServerApi` 创建了一个适配器，现在我们却要直接在应用程序中使用它。这没有意义，因为\
    \ `SqlServerApiAdapter` 显然是更明确的选择。反正它在这里已经使用了 `SqlServerApi`！这正是信息专家的核心观点。`SqlServerApiAdapter`\
    \ 拥有创建新数据库所需的信息，因此它是获取这一新功能的良好人选。而替代方案 `Program` 对这里的 `SqlServerApi` 一无所知，所以选择很容易做出。\n\
    \n这个例子虽然显而易见，但它展示了信息专家的核心本质。我也告诉你一个小秘密：我见过有些软件在 `Program` 中有 `CreateDatabase`（嗯，不完全是那样，但情况类似）。当代码规模变得很大时，新功能应该放在哪里并不总是那么明显。\n\
    \n## 低耦合\n\n低耦合（Low Coupling）原则有助于将更改的影响降到最低。类之间的耦合是指一个类依赖于另一个类。不用说，当许多类都依赖于某个类时，该类变得很难修改。信息专家原则实际上有助于这一目标。让我们检查之前的\
    \ `SqlServerApi` 例子。将 `CreateDatabase` 方法放在 `Program` 中是糟糕的设计，因为 `Program` 不知道\
    \ `SqlServerApi`，而且不应该需要知道。它在 `SqlServerApi` 和 `Program` 之间创建了不必要的耦合。\n\n![](img/a03594f8f44c9d45de3912512db3a264_78_0.png)\n\
    \n图 21：高耦合序列图\n\n如图所示，**Program** 和 **SqlServerApi** 之间存在一条直接连线。在这种设计中，**Program**\
    \ 依赖于 **SqlServerApi**。如果 **SqlServerApi** 发生，我们只需要修改 **Program**。\n\n## 高内聚\n\
    \n内聚（Cohesion）是类中的元素在一起的程度。高内聚原则（High Cohesion）规定类的内聚性应该是高的。换句话说，类的方法和属性应该在一起。让我们看另一个例子。假设我们有一个具有某些属性和方法的\
    \ **Person** 类：\n\n## 代码列表 96：Person 类\n\n```csharp\npublic class Person {\n \
    \   public string FirstName { get; set; }\n}\n```\n\n```csharp\npublic string\
    \ LastName { get; set; }\npublic DateTime DateOfBirth { get; set; }\n\npublic\
    \ string GetFullName()\n{\n    return String.Format(\"{0} {1}\", FirstName, LastName);\n\
    }\n\npublic int GetAge()\n{\n    int age = DateTime.Today.Year - DateOfBirth.Year;\n\
    \    // 月日修正\n    if (DateOfBirth.AddYears(age) > DateTime.Today)\n    {\n   \
    \     age -= 1;\n    }\n    return age;\n}\n```\n\n内聚性很高，因为所有的属性和方法都在描述一个人。让我们添加一个方法。\n\
    \n## 代码列表 97：带有 SalesOrders 的 Person\n\n```csharp\npublic class Person\n{\n  \
    \  // ...\n    public List<SalesOrder> GetSalesOrders()\n    {\n        // ...\n\
    \    }\n}\n```\n\nPerson 的内聚性刚刚下降了。这并不完全错误，但你应该问自己，`Person` 是否真的需要知道 `SalesOrder`。不能想象你可能在某个语境下使用\
    \ `Person` 但又不想依赖 `SalesOrder` 类。也许我们可以将为 `Person` 获取 `SalesOrders`的任务委托给另一个类。\n\
    \n## 代码列表 98：SalesOrderRepository\n\n```csharp\npublic class SalesOrderRepository\n\
    {\n    public List<SalesOrder> GetPersonsSalesOrders(Person person)\n    {\n \
    \       // ...\n    }\n}\n```\n\n## 代码列表 99：SalesOrderRepository 的使用\n\n```csharp\n\
    Person sander = new Person\n{}\n```\n\n"
