    ```\n\n## 单例 (Singleton)\n\n```\nSingleton\nstatic Instance()\nSingletonOperation()\n\
    GetSingletonData()\nstatic uniqueInstance\nsingletonData\nreturn uniqueInstance();\n\
    ```\n\n图 9：单例模式类图\n\n单例模式非常有趣。它很有用，但经常被实现错误。它备受喜爱，也备受厌恶。那么，为什么我想在这里包含它呢？单例将特定类型的创建数量限制为恰好一个，这非常酷，而且可能是必要的（单例的例子如你的打印机程序、文件系统等）。此外，由于它经常被错误使用，我想进行一些教育，并澄清何时该使用它。最后，由于它经常被错误实现，我们现在要正确地实现它，一次到位。\n\
    \n单例的基础是一个私有构造函数。你没读错。当一个类的构造函数是私有的时，其他类无法创建该类的实例。这可能会派上用场，因为该类现在创建自己的实例并跟踪这些实例。这有点违反直觉，但通过静态字段（static\
    \ field）是完全可能的。\n\n代码列表 47：单例的开始\n\n```cs\npublic class SomeSingleton\n{\n   \
    \ private static SomeSingleton instance;\n\n    private SomeSingleton()\n    }\n\
    }\n```\n\n此时，没有其他类可以创建或访问此类的实例。我们需要另一个静态方法（或属性）来访问此类的实例。\n\n代码列表 48：单例的完整实现\n\n\
    ```cs\npublic class SomeSingleton\n{\n    private static SomeSingleton instance;\n\
    \n    private SomeSingleton()\n    }\n\n    public static SomeSingleton Instance\n\
    \    {\n        get\n        {\n            if (instance == null)\n          \
    \  {\n                instance = new SomeSingleton();\n            }\n       \
    \     return instance;\n        }\n    }\n}\n```\n\n现在单例是完整的了。但如果应用程序是多线程的，这种实现可能会导致多个实例。当两个线程同时访问实例时，两个线程都会发现实例为空，，其中一个线程会被锁定，而另一个线程会创建实例。这里是线程安全的实现：\n\
    \n## 代码列表 49：线程安全的单例\n\n```cs\npublic class SomeSingleton\n{\n    private static\
    \ SomeSingleton instance;\n    private static object syncRoot = new object();\n\
    \n    private SomeSingleton() {\n    }\n\n    public static SomeSingleton Instance\
    \ {\n        get {\n            if (instance == null) {\n                lock(syncRoot)\
    \ {\n                    if (instance == null) {\n                        instance\
    \ = new SomeSingleton();\n                    }\n                }\n         \
    \   }\n            return instance;\n        }\n    }\n\n    public void SomeMethod()\
    \ {\n        // 像其他方法一样的实例方法。\n    }\n}\n```\n\n双重检查检查（double null check）看起来很奇怪，但请记住当两个线程同时访问实例时，两个线程都会发现实例为空，其中一个线程会被锁定，而另一个线程会创建实例。在锁线程释放后，它应该再次检查是否为空，否则会创建一个新实例。这将防止多个实例。\n\
    \n单例的其他方法现在可以是公共实例方法，并像其他方法一样工作。只需记住单例的状态在整个应用程序中共享，因为它是静态的。\n\n那么单例有什么问题呢？它们被用得太频繁了。我见过有些单例在一年后在某些地方需要第二个实例！事实证明，这并不完全对。\n\
    \n其次，单例无法被子类。由于构造函数对于单例本身以外的任何部分都是不可访问，因此子类无法访问它（这意味着你无法构造它们）。\n\n最后，单例很难测试。假设你正在测试内部使用单例的应用程序部分。在很一段时间内，你没有方法模拟单例。现在通过使用代码织入（code\
    \ weaving）和面向切面编程（AOP）的测试框架是可能的，但它仍然并不完全对。\n\n所以，什么时候使用单例？基本上是你绝对确定你的应用程序永远不需要对象的第二个实例（当另一个实例可能对系统有害时）。它可能也派上用场，提供共享资源的单点访问（如打印机程序）。日志记录通常不是单例模式可以接受用法。\n\
    \n虽然 .NET 中的许多对象在逻辑上只有一个实例（如 Application），但我不知道 .NET 中有任何单例实现（即，构造函数仅仅是内部的而不是私有的）。如果一个像\
    \ .NET 这样庞大的框架都不单例，那么你应该仔细考虑你是否真的需要它们，或者是否可以通过其他方式解决问题。\n\n# 结构性模式 (Structural\
    \ Patterns)\n\n结构性模式关于对象如何协同工作并相应地组织你的代码。而创建模式是关于对象的创建，但这些对象不需要了解对方的内部细节。\n\n"
