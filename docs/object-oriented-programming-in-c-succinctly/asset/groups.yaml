    \ : Person\n{\n    public decimal Salary { get; set; }\n    public override string\
    \ GetFullName()\n    {\n        string originalvalue = base.GetFullName();\n \
    \       return LastName + \" \" + FirstName;\n    }\n}\n```\n\n如你所见，我们可以重写或重新定义\
    \ `GetFullName`，因为它在基类中被标记为 `virtual`。然后我们可以使用 `base` 关键字（它指向基类的实现）来调用原始方法并进行处理，或者返回一个完全不同的结果。调用原始方法是可选的，但请记住，如果不这样做，某些类可能会崩溃。\n\
    \n现在这里有一个有趣点：该类型是 `Employee`，但它也具有 `Person` 类型。这意味着在任何需要 `Person` 的代码中，我们实际上都可以使用\
    \ `Employee`。当我们这样做时，当然可以访问 `Employee` 特有的成员，例如 `Salary`。因此，这里有一个小问题：以下代码将打印什么？\n\
    \n## 代码列表 6：代码将打印什么？\n\n```csharp\nperson = new Employee();\nperson.FirstName\
    \ = \"Sander\";\nperson.LastName = \"Rossel\";\nstring fullName = person.GetFullName();\n\
    Console.WriteLine(fullName);\n// 按任意键退出。\nConsole.ReadKey();\n```\n\n如果你回答的答案是\
    \ \"Rossel\", Sander（而不是 Sander Rossel），那么你是正确的！\n\n我们还能做些什么呢？我们可以强制子类继承某些成员。当我们这样做时，必须将该方法以及整个类标记为\
    \ `abstract`（抽象的）。抽象类不能实例化，必须被继承（并重写其中的抽象成员）。\n\n## 代码列表 7：抽象类\n\n```csharp\n\
    public abstract class Person {\n    public string FirstName { get; set; }\n  \
    \  public string LastName { get; set; }\n    public abstract string GetFullName();\n\
    }\n\npublic class Employee : Person {\n    public decimal Salary { get; set; }\n\
    \    public override string GetFullName() {\n        return LastName + \" \" +\
    \ FirstName;\n    }\n}\n```\n\n当然，我们不能再调用 `base.GetFullName()` 了，因为它没有实现。虽然以前重写\
    \ `GetFullName` 是可选的，但现在是强制性的。除此之外，对 `Employee` 的用法保持完全不变。\n\n在光谱的另一端，我们可以显式声明一个类或方法不能被继承或重写。我们可以使用\
    \ `sealed`（密封）关键字来实现这一点。\n\n## 代码列表 8：密封类\n\n```csharp\npublic sealed class Person\
    \ {\n    public string FirstName { get; set; }\n    public string LastName { get;\
    \ set; }\n    public string GetFullName() {\n        return FirstName + \" \"\
    \ + LastName;\n    }\n}\n```\n\n既然 `Person` 是密封的，没有人可以继承它。这意味着我们不能创建一个 `Employee`\
    \ 类并使用 `Person` 作为基类。\n\n方法可以在子类中被密封。毕竟，如果你不想让别人重写你的方法，只需不要将其标记为 `virtual` 即可。然而，如果你有一个虚拟方法，并且子类想要防止进一步重写它，可以将其标记为\
    \ `sealed`。\n\n## 代码列表 9：密封方法\n\n```csharp\npublic class Person {\n    public\
    \ string FirstName { get; set; }\n    public string LastName { get; set; }\n \
    \   public virtual string GetFullName() {\n        return FirstName + \" \" +\
    \ LastName;\n    }\n}\n```\n\n```csharp\npublic class Employee : Person\n{\n \
    \   public decimal Salary { get; set; }\n    public sealed override string GetFullName()\n\
    \    {\n        return LastName + \", \" + FirstName;\n    }\n}\n```\n\n`Employee`\
    \ 的任何子类都不能重写 `GetFullName`。\n\n为什么要你的类或方法上使用 `sealed`？首先，这会有微小的性能提升，因为 .NET 运行时不需要考虑被重写的方法。这种提升微乎其微，所以这真的不是一个很好的理由。更好的理由可能是某个类实现了一些确实不应该以任何方式扩展的安全检查。\n\
    \n> 注意：某些语言（如 C++）支持多重继承。这意味着子类可以继承多个基类。在 C# 中这是是不可能的；每个子类最多只能继承一个基类。\n\n## 继承\
    \ vs 组合\n\n虽然继承在面向对象编程（OOP）中非常重要，但它可能会非常痛苦，尤其是当你获得一个向四面分支的巨大继承树时。继承有一个替代方案：组合。继承意味着类与类之间存在“是一个”（is-a）的关系。一个\
    \ `Employee` 是一个 `Person`。通过组合，我们可以定义一种“拥有一个”（has-a）的关系。\n\n以汽车为例。汽车由许多组件组成，例如引擎。当我们对汽车进行建模时，是让\
    \ `Car` 继承 `Engine` 吗？这会有问题，因为汽车还有门、椅子和后座。\n\n## 代码列表 10：错误\n\n```csharp\npublic\
    \ class Engine\n{\n    // ...\n}\npublic class Car : Engine\n{\n    // ...\n}\n\
    ```\n\n使用组合时看起来是什么样的？\n\n## 代码列表 11：组合\n\n```csharp\npublic class Engine\n{\n\
    \    // ...\n}\n```\n\n```csharp\npublic class Car {\n    private Engine engine\
    \ = new Engine();\n    // ...\n}\n```\n\n## 封装\n\n封装是隐藏类内部工作机制的过程。这意味着指定一个公共接口，而实际工作被隐藏起来。优点是类可以更改其工作方式而不需要更改调用者。在\
    \ C# 中，我们有访问修饰符来实现：\n\n- private：仅对类可见。\n- protected：对类及其子类可见。\n- internal：仅对同一程序集可见。\n\
    - protected internal：对同一程序集或派生类可见。\n- public：对所有人可见。\n\n假设我们正在构建一个在数据库上运行查询的类。显然我们需要对类调用者可见的方法。访问数据库的方法对于每个数据库可能不同，因此我们可能将其留给继承者。最后，我们需要存储私有状态，这些状态不能从类外部更改，否则可能会导致其处于无效状态。\n\
    \n## 代码列表 12：访问修饰符\n\n```csharp\npublic class QueryRunner {\n    private IDbConnection\
    \ connection;\n\n    public void RunQuery(string query) {\n        Helper helper\
    \ = new Helper();\n        if (helper.Validate(query)) {\n            OpenConnection();\n\
    \            // 运行查询...\n            CloseConnection();\n        }\n    }\n\n\
    \    protected void OpenConnection() {\n        // ...\n    }\n\n    protected\
    \ void CloseConnection() {\n        // ...\n    }\n}\n\ninternal class Helper\
    \ {\n    internal bool Validate(string query) {\n        // ...\n        return\
    \ true;\n    }\n}\n```\n"
