    # # Introduction to OOP


    Object-oriented programming, or OOP for short, has been around since the 60''s
    and is now the de facto standard programming paradigm. The programming language
    Simula first adopted OOP concepts in the 60''s. Later, these concepts were taken
    further by the first OOP language, Smalltalk. OOP started to really pick steam
    in the 90''s with languages such as Java. C# and .NET principles that are discussed


    OOP is a powerful concept that solves many problems in software development. OOP
    is not the holy grail of programming, but as we will see through this book, it
    can help in writing code that is easy to read, easy to maintain, easy to update,
    and easy to expand.


    The concepts in this book are not unique to C#. Other object-oriented languages,
    such as Java, C++ and Python, share principles discussed throughout this book.


    The included code samples were all tested in the free Community Edition of Visual
    Studio 2015 and were created in .NET 4 (though most will also run in earlier versions
    of .NET).


    Throughout this book I''m assuming basic knowledge of C#. If you know how to write
    a class and declare a variable, you''re pretty much good to go.


    # ## Why OOP?


    OOP is all about architecting your software. Let''s compare software to a house.
    Would you want a bunch of builders to start building your house without predefined
    rules and agreements? I bet! Your house would be a mess. Still, that''s what often
    happens in software and, as expected, a lot of software turns out a mess! Returning
    to our house metaphor, let''s say your lamps were built into the ceiling. Whenever
    a lamp broke you''d need a new ceiling! Luckily, that''s not the case. Yet in
    software, when a small detail needs to change, we often find ourselves rewriting
    huge pieces of code. And in many cases functionality that had nothing to do with
    the change breaks away. By abstracting away certain functionality we can just
    worry about the detail and we''re sure other parts of the system won''t break.
    On top of that we can reuse code if that functionality needs to change we''re
    sure it''s changed everywhere where we use it. How that''s done become clear throughout
    the book.


    # ## Terminology


    Before we dive into OOP it''s important that we get some terminology straight.


    Often, we see the class and object used interchangeably. Let''s get out of the
    way, they are two different things. A class is a blueprint for an object. It contains
    the methods and properties that will eventually define the behavior of an object.
    An object is the actual instance of a class, created at runtime using the new
    keyword.'
  - "[PAGE 10]\n\nIn the following code listing we'll see an example of a Person class.\
    \ It doesn't do anything, it just sits there.\n\n# Code Listing 1: A Class\n\n\
    ```\npublic class Person {\n    public string FirstName { get; set; }\n    public\
