    \ data communications will, but not both? This is important, because when the\
    \ time comes and you realize you need to change one of the functionalities, the\
    \ functionality that doesn't need to change will be in the way. The more functionality\
    \ that is in the way, the more chances you have of having those parts of the application.\n\
    \nWhen applying SRP, your classes will be a smaller and more maintainable, but\
