  - "[PAGE 51]\n\n# Decorator\n\n![](img/a03594f8f44c9d45de3912512db3a264_51_0.png)\n\
    \nFigure 12: Class Diagram of the Decorator Pattern\n\nThe Decorator Pattern can\
    \ be used to add functionality to an object dynamically. It's especially useful\
    \ when one object can have multiple functionalities that aren't always used at\
    \ the same time, like different representations of the same data. In that respect\
    \ it offers a flexible alternative to inheritance.\n\nLet's have some text message\
    \ and we want to print and/or email and/or fax (yes, people still do do that)\
    \ and/or send it to an external system. Additionally, the message must always\
    \ be saved to the database. First we will need our Message class that contains\
    \ the message we want to process and we can implement the default process (after\
    \ all, we always need to send the message to the database).\n\nCode Listing 58:\
    \ The Message Class\n\n```\npublic interface IMessage {\n    string Msg { get;\
    \ set; }\n    void Process();\n}\n\npublic class Message : IMessage {\n    public\
    \ string Msg { get; set; }\n    public void Process() {\n        Console.WriteLine(String.Format(\"\
    Saved {0} to database.\", Msg));\n    }\n}\n```"
- md: "\nWe can now create a base decorator. Notice that we always need another IMessage\
    \ passed to the constructor (or we'll get a NullReference, you may want to add\
    \ a check there). The Msg property is simply delegated to the root IMessage.\n\
    \n## Code Listing 59: A Base Decorator\n\n```\npublic abstract class BaseMessageDecorator\
    \ : IMessage {\n    private IMessage innerMessage;\n\n    public BaseMessageDecorator(IMessage\
    \ decorator) {\n        innerMessage = decorator;\n    }\n\n    public virtual\
    \ void Process() {\n        innerMessage.Process();\n    }\n\n    public string\
    \ Msg {\n        get {\n            return innerMessage.Msg;\n        }\n    \
    \    set {\n            innerMessage.Msg = value;\n        }\n    }\n}\n```\n\n\
    Now that we have our base decorator, we can create some sub decorators.\n\n##\
    \ Code Listing 60: Sub Decorators\n\n```\npublic class EmailDecorator : BaseMessageDecorator\
    \ {\n    public EmailDecorator(IMessage decorator)\n        : base(decorator)\n\
    \    }\n\n    public override void Process() {\n        base.Process();\n    \
    \    Console.WriteLine(String.Format(\"Sent '{0}' as email.\", Msg));\n    }\n\
    }\n\npublic class FaxDecorator : BaseMessageDecorator {\n    public FaxDecorator(IMessage\
    \ decorator)\n        : base(decorator)\n    }\n```\n\n```cs\npublic override\
    \ void Process()\n{\n    base.Process();\n    Console.WriteLine(String.Format(\"\
    Sent '{0}' as fax.\", Msg));\n}\n\npublic class ExternalSystemDecorator : BaseMessageDecorator\n\
    {\n    public ExternalSystemDecorator(IMessage decorator)\n    : base(decorator)\n\
    \    }\n\n    public override void Process()\n    {\n        base.Process();\n\
    \        Console.WriteLine(String.Format(\"Sent '{0}' to external system.\", Msg));\n\
    \    }\n}\n```\n\nWe can now process our message in many different ways; we can\
    \ just save it to the database, we can save it and email or send it to an external\
    \ system; we can save, email and fax; save, email, and send it to the external\
    \ system; save, for, and send it to the external system. The beauty is that we\
    \ can easily add new functionality without breaking the already existing functionality.\n\
    \nIn a simple Console application, the usage could be as follows:\n\n## Code List\
    \ 61: Usage of the Decorators\n\n```\nIMessage msg = new Message();\nmsg.Msg =\
    \ \"Hello\";\n\nIMessage decorator = new EmailDecorator(\nnew FaxDecorator(\n\
    \    new ExternalSystemDecorator(msg));\ndecorator.Process();\n\nConsole.WriteLine(\n\
    decorator = new EmailDecorator(msg);\ndecorator.Msg = \"Bye\";\ndecorator.Process());\n\
    \nConsole.ReadKey();\n```\n\nIn .NET we find the Decorator Pattern when using\
    \ streams. Many streams, like MemoryStream, BufferedStream, and FileStream offer\
    \ the same functionality provided by the Stream base class, but they work differently\
    \ internally. So the different streams decorate the Stream class. In the usage\
    \ of these classes we can often find a Strategy Pattern (explained later).\n\n\
    ## Behavioral Patterns\n\nBehavioral Patterns are about changing runtime behaviors\
    \ of algorithms and classes. If Creational Patterns are about the creation of\
    \ objects, and Structural Patterns about how the objects work together, Behavioral\
    \ Patterns are about changing the implementation of those objects. With the three\
    \ kinds of Patterns, you can build highly scalable and maintainable software that\
    \ is nearly organized into small pieces of code.\n\n## Observer\n\n![](img/a03594f8f44c9d45de3912512db3a264_54_0.png)\n\
    \nFigure 13: Class Diagram of the Observer Pattern\n\nWith the Observer Pattern\
    \ it is possible for a class, a so-called observable, to notify other classes,\
    \ of changes. .NET events are implemented using this pattern.\n\nA few notes regarding\
    \ the Observer Pattern in .NET. First of all, because .NET already has events,\
    \ it shouldn't be necessary to implement this pattern yourself. Let's assume for\
    \ a moment that you still want to. You're probably going to start out with two\
    \ interfaces: IObservable and IObserver. Then you find out .NET already has interfaces\
    \ (in a generic variant). Do not use them. I've seen the .NET interfaces being\
    \ used in the Observer Pattern, but those interfaces are meant to be used primarily\
    \ with Reactive Extensions (Rx). I can't explain Rx here, but the interfaces make\
    \ little sense for the \"traditional\" Observer Pattern I'm going to discuss this\
    \ here.\n\nSo let's start out by defining the IObservable and IObserver interfaces.\n\
    \n## Code Listing 62: Observer Pattern Interfaces\n\n```cs\nvoid Attach(IOObserver\
    \ observer);\nvoid Detach(IOObserver observer);\nvoid Notify();\n\npublic interface\
    \ IOObserver {\n  void Update(IObservable observer);\n}\n```\n\nNow let's implement\
    \ the IOObservable. We're going to create a product stock, and every time the\
    \ stock changes we're going to notify observers (also called listeners). The code\
    \ is a bit lengthy, mostly due to the properties at the bottom. Notice that these\
    \ properties have nothing to the Observer Pattern, they're simply necessary to\
    \ identify the stock.\n\n## Code Listing 63: IOObservable Implementation\n\n```cs\n\
    public class Stock : IOObservable {\n  private List<IOObserver> observers = new\
    \ List<IOObserver>();\n  private string productName;\n  private int noOfItemsInStock;\n\
    \n  public Stock(string name) {\n    productName = name;\n  }\n\n  public void\
    \ Attach(IOObserver observer) {\n    observers.Add(observer);\n  }\n\n  public\
    \ void Detach(IOObserver observer) {\n    observers.Remove(observer);\n  }\n\n\
    \  public void Notify() {\n    foreach (IOObserver observer in observers) {\n\
    \      observer.Update(this);\n    }\n  }\n\n  public string ProductName {\n \
    \   get {\n      return productName;\n    }\n  }\n\n  public int noOfItemsInStock\
    \ {\n    get {\n      return noOfItemsInStock;\n    }\n    set {\n      noOfItemsInStock\
    \ = value;\n    }\n  }\n}\n```\n\n## Code Listing 64: Observers\n\n```cs\npublic\
    \ class Seller : IOObserver {\n  public void Update(IObservable observer) {\n\
    \    Console.WriteLine(\"Seller was notified about the change.\");\n  }\n}\n\n\
    public class Buyer : IOObserver {\n  public void Update(IObservable observer)\
    \ {\n    Console.WriteLine(\"Buyer was notified about the change.\");\n  }\n}\n\
    ```\n\n## Code Listing 65: Usage of the Observer\n\n```cs\nStock stock = new Stock(\"\
    Cheese\");\nstock.NoOfItemsInStock = 10;\nSeller seller = new Seller();\nstock.Attach(seller);\n\
    Buyer buyer = new Buyer();\nstock.Attach(buyer);\nstock.NoOfItemsInStock = 5;\n\
    Console.ReadKey();\n```\n\n## Code Listing 66: A Specific IObservable\n\n```cs\n\
    public interface IObservable\n{\n  void Attach(IOObserver observer);\n  void Detach(IOObserver\
    \ observer);\n  void Notify();\n  string ProductName { get; }\n  int NoOfItemsInStock\
    \ { get; set; }\n}\n\npublic class Seller : IObservable {\n  public void Update(IObservable\
    \ observer) {\n    Console.WriteLine(String.Format(\"Seller was notified about\
    \ the stock change {0} to {1} items.\",\n      observable.ProductName, observable.NoOfItemsInStock));\n\
    \  }\n}\n```\n\n## Code Listing 67: Generic IObservable\n\n```cs\npublic interface\
    \ INotifier<T>\n{\n  void Attach(IListener<T> observer);\n  void Detach(IListener<T>\
    \ observer);\n  void Notify();\n}\npublic interface IListener<T>\n{\n  void Update(T\
    \ observer);\n}\n```\n"
  mdcn: "\n[content]\n我们现在可以创建一个基础装饰器。注意，我们总是需要向构造函数传递另一个 `IMessage`（否则将得到空引用异常，你可能想在那里添加一个检查）。`Msg`\
    \ 属性只是简单地委托给了根 `IMessage`。\n\n## 代码列表 59: 基础装饰器\n\n```cs\npublic abstract class\
    \ BaseMessageDecorator : IMessage {\n    private IMessage innerMessage;\n\n  \
    \  public BaseMessageDecorator(IMessage decorator) {\n        innerMessage = decorator;\n\
    \    }\n\n    public virtual void Process() {\n        innerMessage.Process();\n\
    \    }\n\n    public string Msg {\n        get {\n            return innerMessage.Msg;\n\
    \        }\n        set {\n            innerMessage.Msg = value;\n        }\n\
    \    }\n}\n```\n\n现在我们已经有了基础装饰器，可以创建一些子装饰器了。\n\n## 代码列表 60: 子装饰器\n\n```cs\npublic\
    \ class EmailDecorator : BaseMessageDecorator {\n    public EmailDecorator(IMessage\
    \ decorator)\n        : base(decorator)\n    }\n\n    public override void Process()\
    \ {\n        base.Process();\n        Console.WriteLine(String.Format(\"Sent '{0}'\
    \ as email.\", Msg));\n    }\n}\n\npublic class FaxDecorator : BaseMessageDecorator\
    \ {\n    public FaxDecorator(IMessage decorator)\n        : base(decorator)\n\
    \    }\n```\n\n```cs\npublic override void Process()\n{\n    base.Process();\n\
    \    Console.WriteLine(String.Format(\"Sent '{0}' as fax.\", Msg));\n}\n\npublic\
    \ class ExternalSystemDecorator : BaseMessageDecorator\n{\n    public ExternalSystemDecorator(IMessage\
    \ decorator)\n    : base(decorator)\n    }\n\n    public override void Process()\n\
    \    {\n        base.Process();\n        Console.WriteLine(String.Format(\"Sent\
    \ '{0}' to external system.\", Msg));\n    }\n}\n```\n\n现在我们现在以许多不同的方式处理消息；我们可以只将其保存到数据库；可以将其保存并发送电子邮件，或者发送到外部系统；可以保存、邮件并传真；保存、邮件并发送到外部系统；保存、传真并发送到外部系统。其妙之处在于，我们可以轻松地添加新功能，而不会破坏已有的功能。\n\
    \n在一个简单的控制台应用程序中，用法如下：\n\n## 代码列表 61: 装饰器的用法\n\n```\nIMessage msg = new Message();\n\
    msg.Msg = \"Hello\";\n\nIMessage decorator = new EmailDecorator(\nnew FaxDecorator(\n\
    \    new ExternalSystemDecorator(msg));\ndecorator.Process();\n\nConsole.WriteLine(\n\
    decorator = new EmailDecorator(msg);\ndecorator.Msg = \"Bye\";\ndecorator.Process());\n\
    \nConsole.ReadKey();\n```\n\n在 .NET 中，我们在使用流（streams）时会发现装饰器模式。许多流，如 `MemoryStream`、`BufferedStream`\
    \ 和 `FileStream` 都提供了与 `Stream` 基类相同的功能，但它们内部的工作方式有所不同。因此，不同的流装饰了 `Stream` 类。在这些类的用法中，我们经常可以发现策略模式（后文解释）。\n\
    \n## 行为模式\n\n行为模式关于改变算法和类在运行时的行为。如果说创建模式是关于对象的创建，结构模式是关于对象如何协同工作，那么行为模式就是关于改变这些对象的实现。通过这三种模式，你可以构建出高度可扩展且可维护的软件，这些软件几乎被组织成了小的代码块。\n\
    \n## 观察者\n\n![](img/a03594f8f44c9d45de3912512db3a264_54_0.png)\n\n图 13：观察者模式的类图\n\
    \n通过观察者模式，一个类（所谓的可观察对象）可以通知其他类变化。.NET 事件就是使用这种模式实现的。\n\n关于 .NET 中观察者模式的几点。首先，由于\
    \ .NET 已经有了事件，可能没有必要自己实现这种模式。让我们假设你仍然想这样做。你可能会从两个接口开始：`IObservable` 和 `IObserver`。然后你会发现\
    \ .NET 已经有了接口（泛型变）。不要使用它们。我曾在观察者模式中使用过 .NET 接口，但那些接口主要用于响应式扩展 (Rx)。我在这里无法解释 Rx，但这些接口对我在这里要讨论的“传统”观察者模式来说意义不大。\n\
    \n所以，让我们从定义 `IObservable` 和 `IObserver` 接口开始。\n\n## 代码列表 62: 观察者模式接口\n\n```cs\n\
    void Attach(IOObserver observer);\nvoid Detach(IOObserver observer);\nvoid Notify();\n\
    \npublic interface IOObserver {\n  void Update(IObservable observer);\n}\n```\n\
    \n现在让我们来实现 `IObservable`。我们将创建一个产品库存，每当库存变化时，我们都会通知观察者（也称为监听器）。代码有点长，主要是由于底部的属性。注意，这些属性与观察者模式无关，它们仅仅是识别库存所的。\n\
    \n## 代码列表 63: IOObservable 实现\n\n```cs\npublic class Stock : IOObservable {\n\
    \  private List<IOObserver> observers = new List<IOObserver>();\n  private string\
    \ productName;\n  private int noOfItemsInStock;\n\n  public Stock(string name)\
    \ {\n    productName = name;\n  }\n\n  public void Attach(IOObserver observer)\
