  mdcn: "\n\n```sharp\npublic void SomeMethod(SomeClass otherInstance)\n{\n    otherInstance.someField\
    \ = \"Some value\";\n}\n\nprivate class InnerClass\n{\n    public void SomeMethod(SomeClass\
    \ param)\n    {\n        param.someField = \"Some value\";\n    }\n}\n```\n\n\
    当省略访问修饰符时，会分配一个默认值（类为 internal，其他所有为 private）。不过，我非常喜欢显式地添加访问修饰符。\n\n在继续之前，最后一点说明是：子类的访问权限不能高于其基类。如果某个类具有\
    \ internal 访问修饰符，那么继承它的类就不能是 public（但可以是 private）。\n\n# 多态\n\n我们看到了继承，以及通过继承来改变类型的行为。我们的\
    \ `Person` 类有一个 `GetFullName` 方法，该方法在 `Employee` 中被修改了。我们发现，每当运行时需要 `Person` 类型的对象时，我们可以传入任何\
    \ `Person` 的子类，比如 `Employee`。这被称为多态。\n\n在下面的示例中，`PrintFullName` 方法接收一个 `Person`\
    \ 对象，但它打印的是 \"Sander\"，因为传递给方法的参数实际上是一个子类型，它重写了 `GetFullName` 的功能。\n\n> 代码列表 14:\
    \ 多态\n\n```sharp\nclass Program{\n    static void Main(string[] args)\n    {\n\
    \        Person p = new Employee();\n        p.FirstName = \"Sander\";\n     \
    \   p.LastName = \"Rossel\";\n        PrintFullName(p);\n        // 按任意键退出。\n\
    \        Console.ReadKey();\n    }\n\n    public static void PrintFullName(Person\
    \ p)\n    {\n        Console.WriteLine(p.GetFullName());\n    }\n}\n```\n\n```sharp\n\
    public class Person\n{\n    public string FirstName { get; set; }\n    public\
    \ string LastName { get; set; }\n    public virtual string GetFullName()\n   \
    \ {\n        return FirstName + \" \" + LastName;\n    }\n}\npublic class Employee\
    \ : Person\n{\n    public decimal Salary { get; set; }\n    public sealed override\
    \ string GetFullName()\n    {\n        return LastName + \", \" + FirstName;\n\
    \    }\n}\n```\n\n我们将在下一章中看到更多这类内容。\n\n# 核心要点\n\n面向对象编程（OOP）的三大支柱是面向对象编程的基础。它们的实现并非无缘无故，而是解决了现实问题。对你来说，记住这些并在日常代码中练习它们至关重要。每当你创建一个类或方法时，都要考虑封装。必要时使用继承，但不要忘记它也会带来额外的复杂性。要非常警惕多态，清楚在继承类和重写方法时哪些代码会运行。即使你不练习它，你也会遇到编写了这些特性的代码。在整本书中，我们将看到这些特性被广泛使用。\n\
    \n# 第 2 章 接口\n\n在上一章中，我们看到 `Employee` 类继承自 `Person` 类。你认为这种方法有任何潜在问题吗？如果一个人既是员工，又是一个邮票收藏家呢？显然，一个人可以是邮票收藏家，但不是员工（很多人正处于“空窗期间”）。如果我们都使用继承，可能会写出如下代码：\n\
    \n> 代码列表 15: 继承链\n\n```sharp\npublic class Person {\n  // ...\n}\npublic class\
    \ Employee : Person {\n  // ...\n}\npublic class StampCollector : Person {\n \
    \ // ...\n}\npublic class EmployeeStampCollector : Employee {\n  // ...\n}\n```\n\
    \n我不知道你怎么想，但对我来说这感觉不对。我们面临的问题是，`EmployeeStampCollector` 和 `StampCollector` 唯一的共同点是\
    \ `Person` 基类，但它们仍然是邮票收藏家！编写接受邮票收藏家作为输入的方法并不是可能的！这个问题可以通过多重继承来解决，但 C# 并不支持多重继承（而且许多开发者认为这样更好）。\n\
    \n那么我们如何解决这个问题呢？我们使用接口（Interface）。接口类似于一个带有抽象方法的抽象类。它实际上除了定义一个类型之外，并没有做更多事情。但好处是，我们可以在一个类中继承或“实现”多个接口！\n\
    \n让我们来看一个随机接口的示例：\n\n> 代码列表 16: 接口\n\n```sharp\npublic interface ISomeInterface\
    \ {\n  string SomeProperty { get; set; }\n  string SomeMethod();\n  void SomethingElse();\n\
    }\n```\n\n注意，没有任何字段带有访问修饰符。如果一个类实现了一个接口，那么该接口上的所有内容都是公开可见的。实际的实现看起来是这样的：\n\n#\
    \ 代码列表 17: 接口实现\n\n```sharp\npublic class SomeClass : ISomeInterface\n{\n    public\
    \ string SomeProperty { get; set; }\n\n    public string SomeMethod() {\n    \
    \    // ...\n    }\n\n    public void SomethingElse() {\n        // ...\n    }\n\
    }\n```\n\n在这里 `SomeClass` 拥有类型 `object`、`SomeClass` 和 `ISomeInterface`。`ISomeInterface`\
    \ 或任何接口上的 \"I\" 前缀是 C# 中的常见做法，并非必须。\n\n在单个类上使用继承和接口实现时，首先指定基类，然后是用逗号分隔的接口列表。对于我们的\
    \ `Person`、`Employee` 和 `StampCollector` 示例，它看起来会什么样？\n\n# 代码列表 18: 接口\n\n```sharp\n\
    public interface IEmployee\n{\n    // ...\n}\n\npublic interface IStampCollector\n\
    {\n    // ...\n}\n\npublic class Person\n{\n    // ...\n}\n\npublic class Employee\
    \ : Person, IEmployee\n{\n    // ...\n}\n\npublic class StampCollector : Person,\
    \ IStampCollector\n{\n    // ...\n}\n\npublic class EmployeeStampCollector : Employee,\
    \ IStampCollector\n{\n  // ...\n}\n```\n\n现在 `StampCollector` 和 `EmployeeStampCollector`\
    \ 都是 `Person` 类型和 `IStampCollector` 类型。`EmployeeStampCollector` 也是 `Employee`\
    \ 类型（以及 `IEmployee`），因为它继承自 `Employee`，而 `Employee` 实现了 `IEmployee`。\n\n由于类可以实现多个接口，因此接口继承多个接口也是可能的。类必须实现它继承的所有接口。出于明显的原因，接口不能继承类。\n\
    \n代码列表 19: 接口继承\n\n```sharp\npublic interface IPerson { }\npublic interface IEmployee\
    \ : IPerson {\n}\npublic interface IStampCollector : IPerson {\n}\npublic interface\
    \ IEmployeeStampCollector : IEmployee, IStampCollector {\n}\n```\n\n这虽然是一个非常理论化的例子，但让我们考虑一个现实世界中的例子。假设一个应用程序需要记录某些信息。我们可能希望在生产环境中记录到数据库，但在调试期间，我们希望记录到控制台。此外，如果数据库不可用，我们希望记录到事件日志（Event\
    \ log）。\n\n代码列表 20: 日志记录\n\n```sharp\nclass Program {\n    static void Main(string[]\
    \ args) {\n        List<ILogger> loggers = new List<ILogger>();\n        loggers.Add(new\
    \ ConsoleLogger());\n        loggers.Add(new WindowsEventLogger());\n        loggers.Add(new\
    \ DatabaseLogger());\n        foreach (ILogger logger in loggers) {\n        \
    \    logger.LogError(\"发生了一些错误.\");\n            logger.LogInfo(\"一切良好!\");\n\
    \        }\n        Console.ReadKey();\n    }\n}\npublic interface ILogger {\n\
    \    void LogError(string error);\n    void LogInfo(string info);\n}\npublic class\
    \ ConsoleLogger : ILogger {\n    public void LogError(string error) {\n      \
    \  Console.WriteLine(\"错误: \" + error);\n    }\n    public void LogInfo(string\
    \ info) {\n        Console.WriteLine(\"信息: \" + info);\n    }\n}\npublic class\
    \ WindowsEventLogger : ILogger\n{\n    public void LogError(string error)\n  \
    \  {\n        Console.WriteLine(\"正在记录到事件日志: \" + error);\n    }\n\n    public\
    \ void LogInfo(string info)\n    {\n        Console.WriteLine(\"正在记录到事件日志: \"\
    \ + info);\n    }\n}\n\npublic class DatabaseLogger : ILogger\n{\n    public void\
    \ LogError(string error)\n    {\n        Console.WriteLine(\"正在记录到数据库: \" + error);\n\
    \    }\n\n    public void LogInfo(string info)\n    {\n        Console.WriteLine(\"\
    正在记录到数据库: \" + info);\n    }\n}\n```\n\n这非常酷！而且我们可以根据意愿添加或删除日志记录器。\n\n顺便说一下，拥有接口和一个基类（实现该接口）是完全没问题的。也许你有一个\
    \ `ILogger`，一个 `DbLogger`（实现 `ILogger` 并定义记录到数据库的通用行为），然后有 `SqlServerLogger`、`OracleLogger`、`MySQLLogger`\
    \ 等（它们都继承自 `DbLogger`）。\n\n# 显式实现接口\n\n我提到过，当你实现接口时，该接口上的所有成员默认都是公开的。从逻辑上讲，接口是一种契约，向其他代码承诺将定义某些成员和属性（因为它是特定类型）。然而，隐藏接口成员是可能的。要做到这一点，你可以显式实现接口。当你显式实现接口成员时，调用该成员的唯一方法是将类作为接口的类型。\n\
    \n"
