    \ in the View and updates in the View are directly pushed to the Model). MVVM\
    \ was created for Microsoft's Windows Presentation Foundation (WPF), but can now\
    \ also be found in many JavaScript frameworks like KnockoutJS and AngularJS. Together\
    \ MVC, MVP, and MVVM are referred to as the MV* Patterns. Note that they are not\
