    \ with Person anymore.\n\nA solution will be presented in Chapter 2: Interfaces.\n\
    \n# Encapsulation\n\nEncapsulation is the process of hiding the internal workings\
    \ of our classes. That means we specify a public specification, used by consumers\
    \ of our class, while the actual work is hidden away. The advantage is that a\
    \ class can change how it works without needing to change its consumers.\n\nIn\
    \ C# we have four access modifiers which enable five ways of controlling code\
    \ visibility:\n\n+   * private—only visible to the containing class.\n* protected—only\
    \ visible to the containing class and inheritors.\n* internal—only visible to\
    \ classes in the same assembly.\n* protected internal—only visible to the same\
    \ assembly or in derived classes, even in other assemblies.\n* public—visible\
    \ to everyone.\n\nLet's say we're building some class that runs queries on a database.\
    \ Obviously we need some method of RunQuery's visible to every consumer of our\
    \ class. The method for accessing the database could be different for every database,\
    \ so perhaps we're leaving open for inheritors. Additionally, we use some helper\
    \ class that's only visible to our project. Last, we need to store some private\
    \ state, which may not be altered from outside our class as it could leave it\
    \ in an invalid state."
