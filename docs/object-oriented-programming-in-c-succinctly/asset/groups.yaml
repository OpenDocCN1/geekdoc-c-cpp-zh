    \ item);\n        }\n    }\n}\n```\n\n## More Patterns\n\nThe patterns discussed\
    \ so far are \"classic\" patterns that were systematically described in the book\
    \ Design Patterns: Elements of Reusable Object-Oriented Software. However, there\
    \ are many more Design Patterns. Many of these are discussed in the book Patterns\
    \ of Enterprise Application Architecture by Martin Fowler³ (in Java). The patterns\
    \ discussed in Fowler's book cover different areas of your code, such as patterns\
    \ specific for your domain logic, communication with your data source, concurrency\
    \ and web session. I will discuss a few of these patterns that are widely known\
    \ and used.\n\nMartin Fowler uses a lot of UML sequence diagrams. Like UML class\
    \ diagrams, sequence diagrams are outside the scope of the book, but I will add\
    \ them for reference and visual explanation.\n\n## Lazy Load\n\n![](img/a03594f8f44c9d45de3912512db3a264_66_0.png)\n\
    \nFigure 16: Sequence Diagram of the Lazy Load Pattern\n\nThe Lazy Load Pattern\
    \ is about not getting data until you actually use it. It comes in four flavors:\
    \ lazy initialization, virtual proxy, value holder, and ghost. We'll look at lazy\
    \ initialization only, as it's the most common and discussing all of them takes\
    \ up too much space. I also want to discuss this one because it has become more\
    \ and more relevant and widely used. Functional languages, such as Haskell, have\
    \ a default lazy loading strategy for everything. Such practices are becoming\
    \ more common in .NET as well.\n\n> ³ Martin Fowler - Patterns of Enterprise Application\
    \ Architecture\n\nWe have actually already seen the Lazy Loading Pattern when\
    \ we implemented Singleton Pattern. The Singleton instance was not created until\
    \ the object was actually used. Let's take a look at the (simple) implementation\
    \ again.\n\n## Code Listing 80: Lazy Initialization\n\n```cs\npublic class SomeSingleton{\n\
    \    private static SomeSingleton instance;\n\n    private SomeSingleton()\n \
    \   {\n    }\n    public static SomeSingleton Instance {\n        get {\n    \
    \        if (instance == null) {\n                instance = new SomeSingleton();\n\
    \            }\n            return instance;\n        }\n    }\n}\n```\n\nIf SomeSingleton.Instance\
    \ is not referenced anywhere in your code, then SomeSingleton will never be initialized.\
    \ This is what's called lazy initialization. It's especially useful when an object\
    \ takes a long time to load and you don't want to execute the code unless you\
    \ really need to.\n\nThe .NET Framework has a Lazy<T> class for lazy loading any\
    \ class. Let's say we have a class that takes five seconds to initialize.\n\n\
    ## Code Listing 81: A heavy initialization\n\n```cs\npublic class Something{\n\
    \    public Something(){\n        // Fake some heavy computation.\n        Thread.Sleep(5000);\n\
    \    }\n\n    public void Print(){\n        Console.WriteLine(\"Something is used.\"\
    );\n    }\n}\n```\n\nBy using a Lazy<T> wrapper we won't actually need to create\
    \ the instance until we use it.\n\n## Code List 82: Usage of Lazy<T>\n\n```cs\n\
    Stopwatch sw = new Stopwatch();\nsw.Start();\nLazy<Something> lazy = new Lazy<Something>();\n\
    sw.Stop();\nConsole.WriteLine(String.Format(\n  \"Initializing the Lazy<Something>\
    \ cost: {0} ms\",\n  sw.ElapsedMilliseconds));\n\nsw.Restart();\nlazy.Value.PrintUse();\n\
    sw.Stop();\nConsole.WriteLine(String.Format(\n  \"Using the Lazy<Something>.Value\
    \ cost: {0} ms\",\n  sw.ElapsedMilliseconds));\nConsole.ReadKey();\n```\n\nThe\
    \ result should not be surprising.\n\n![](img/a03594f8f44c9d45de3912512db3a264_68_0.png)\n\
    \nFigure 17: Result of the Lazy<T>\n\nWe can use complex initialization, too,\
    \ using a lambda method.\n\n## Code List 83: Complex Initialization\n\n```cs\n\
    //\nLazy<Something> lazy = new Lazy<Something>(() =>\n\npublic class Something\n\
    {\n    //\n}\n```\n\n## Model View Controller\n\n![](img/a03594f8f44c9d45de3912512db3a264_69_0.png)\n\
