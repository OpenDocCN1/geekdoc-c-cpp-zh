    \nFigure 20: Sequence Diagram of the Repository Pattern\n\nThe Repository Pattern\
    \ is a difficult pattern to, luckily, you don't have to implement it yourself.\
    \ It makes use of other patterns, the Data Mapper and the Query Object. A Data\
    \ Mapper is a piece of code that maps database records to C# domain objects. The\
    \ database and the domain objects are unaware of each other. A Query Object is\
    \ a C# object that behaves like a database WHERE clause and can be passed to the\
    \ Data Mapper (\"criteria\" in the diagram). The Repository, finally, is a collection-like\
    \ interface that can retrieve domain objects and sits between your domain and\
    \ data mapping layers. Once going, the benefit to it is separation of concerns.\
    \ Your domain objects don't know about your database and can be reused for other\
    \ purposes. Your database layer can be swapped (for example, going from Oracle\
    \ to SQL Server) and you'll only have to change your Data Mapper. Your Data Mapper,\
    \ Query Object, and Repository can also be reused in other projects.\n\nAs much\
