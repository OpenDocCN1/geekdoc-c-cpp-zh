    \  // ...\n}\n```\n\nI don't know about you, but it just doesn't feel right to\
    \ me. The problem we have is that the only thing EmployeeStampCollector and the\
    \ StampCollector have in common is the Person base class, but they're still stamp\
    \ collectors! Writing a method that takes a stamp collector as input is not impossible!\
    \ This problem could be solved using multiple inheritance, but C# doesn't have\
    \ (and many developers say it is better that way).\n\nSo do we solve this problem?\
    \ We use a Interface. An Interface is something like an abstract class with abstract\
    \ methods. It really doesn't do more than defining a type. The good part though,\
    \ is we can inherit, or ‘implement’, multiple interfaces in a single class!\n\n\
    Let's look at an example of a random interface:\n\n> Code Listing 16: An interface\n\
    \n```\npublic interface ISomeInterface {\n  string SomeProperty { get; set; }\n\
    \  string SomeMethod();\n  void SomethingElse();\n}\n```"
