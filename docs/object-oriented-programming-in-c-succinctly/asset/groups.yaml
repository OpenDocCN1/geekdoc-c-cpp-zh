    \n## The Takeaway\n\nGRASP is really useful when designing classes. Unlike anything\
    \ else we've seen so far, they aren't of a very technical nature, and they don't\
    \ describe classes or methods. They describe how to get an efficient design for\
    \ your software. This chapter has shown that there is not one design for an application.\
    \ In fact, when we only had a Car and an Engine we already had two design choices\
    \ (and even more less obvious ones). Keeping GRASP in mind, we can get to some\
    \ design that's at least better than many of the alternatives (there is no such\
    \ thing as a \"best design\"). The fun thing about GRASP is that a lot of it is\
    \ already common sense to most developers (like a Person shouldn't save itself),\
    \ but with GRASP you have some formal rules that describe why it makes such common\
    \ sense.\n\n## Chapter 6 Architecture\n\nSo far you've seen a lot of code on small\
    \ scale. We've seen how to design a single class, how to have multiple classes\
    \ communicate with each other, and how to abstract certain components (like a\
    \ database). Chances are you need to write more than a few classes though. When\
    \ looking at the high level structures of a software system, we speak about the\
    \ architecture of that. In this chapter I'm going to discuss technical challenges\
    \ and methods that you may encounter when building an application.\n\nI want to\
    \ emphasize that I will not discuss those as well. I will not discuss the job\
    \ of a software architect, who is talking to the stakeholders, deciding on development\
    \ processes (Agile or Waterfall), documentation, budget, and other factors that\
    \ you will have to deal with when building an actual application.\n\nThe architecture\
    \ of a system is the part that is not easily changed. Opinions on this vary; let's\
    \ consider a database. Many people point at the database, call it the heart of\
    \ any system, and tell you it's pretty hard to change later on in the development\
    \ process. We know, however, that we abstract away behind a Data Mapper and a\
    \ Repository (on which the software depends upon abstractions) changing databases\
    \ is \"simple to matter switching to our Data Mapper, and possibly Repository.\
    \ Or it's a lot of work, and everything will have to be tested thoroughly, but\
    \ we shouldn't have to change our front-end, for example.\n\nSo what is hard to\
    \ change? Suppose half-way into the project you decide to change the interface\
    \ of your Data Mapper or your Repository. That could be pretty problematic. Or\
    \ you decide to throw in an MVC and/or MVVM architecture. That will need a good\
    \ rewriting of many components.\n\n## Don't Repeat Yourself (DRY)\n\nOne important\
    \ principle we have not yet discussed is the DRY Principle, or Don't Repeat Yourself.\
    \ Why do we go through all the trouble of putting everything behind abstractions,\
    \ thinking about architecture, and reuse anyway? DRY is the answer. Prevent writing\
    \ the same code twice. The next example will illustrate why.\n\nSuppose you have\
