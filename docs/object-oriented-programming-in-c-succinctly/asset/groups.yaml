    \n```\n//\nLazy<Something> lazy = new Lazy<Something>(() => new Something(new\
    \ object()));\n//\n\npublic class Something\n{\n  public Something(object someParam)\n\
    {\n    // ...\n  }\n```\n\nThe .NET Framework uses lazy loading extensively with\
    \ the Entity Framework, an Object Relation Mapper (ORM). The Entity Framework\
    \ maps database tables to classes within .NET and can update your database using\
    \ these classes. Now imagine you have a SalesOrder table; each SalesOrder has\
    \ SalesOrderLines, which is another table. You have classes in C# with the same\
    \ name and Attributes. Your C class has a property, SalesOrderLines, which is\
    \ in fact a collection of SalesOrders. When loading your SalesOrders, your SalesOrderLines\
    \ will be empty until you actually request the SalesOrderLines of a SalesOrder.\
    \ This is not necessarily faster if you need ALL SalesOrderLines, but if you need\
    \ some of them, it can be pretty fast and convenient. See the sequence diagram\
    \ at the beginning of this section for a visualization."
  - '[PAGE 69]


    # Model View Controller


    ![](img/a03594f8f44c9d45de3912512db3a264_69_0.png)


    Figure 18: Class Diagram of the MVC Pattern


    The Design Patterns book also mention the Model View Controller pattern, MVC for
    short, used in Smalltalk-80, but only to say this pattern makes use of the Observer,
    Composition, and Strategy Design Patterns. There is more to the MVC pattern though.
    Each use of three components: the Model, the View, and the Controller [insert
    Enrico Morricone soundtrack here]. The Model contains some information on the
    domain, such as a product, a customer, or a sales order. The Model is strictly
    non-UI. The UI information is in the View object. If this is a web page, the view
    might contain HTML. Or it contains some UI widgets that are displayed on-screen.
    The third component, the Controller, glues these together. It handles requests
    from the View, retrieves and manipulates data that is put in a Model, which is
    returned to the View, which can use the Model for display on-screen.


    The entire MVC is about separation of concerns (SoC). Indeed, using MVC becomes
    easy to swap one part of the system in favor of something else. In web development
    you could swap the Views or have multiple Views representing the same data.


    The Model View Controller pattern is so prevalent that Microsoft created an entire
    framework around it and named it the pattern, ASP.NET MVC. The best way to check
    this out is to simply start your lot of files and folders (an often heard comment
    about ASP.NET MVC), but the classes we''ll be interested in are Controllers, Models
    and Views folders. The HomeController, for example, has three methods, Index,
    About, and Contact. All of them return a View without a Model. The AccountController
    has some methods that return a View and pass in a Model, but they''re a bit complex
    to discuss here (this isn''t a book about ASP.NET MVC after). If you look at the
    Model, for example the classes in AccountViewModels, you will see that these are
    just classes with some properties and attributes. The Models are initialized in
    the ViewController and used in the Account Views (which is composed of many chtml
    files). For simpler Views check out the Home Views, About.cshtml, Contact.cshtml
    and Index.cshtml.


    As a simple example, I''m going to create a new ASP.NET MVC project, rename it
    to "MyMvcApp", change the authentication type to "No Authentication" and create
    a very simple, static website. First, throw away all Views, except Home/Index.cshtml.
    Now I want to show some data in my View, I''m going to create a Model, the PersonModel.'
