    \n在这种情况下，我们知道用参数 1 和 2 调用该函数，结果将是 3。但是，这非常重要——在面向对象（OO）的语言中，我们永远无法百分之百确定。\n\n\
    > 代码列表 107：带有副作用的 Add\n\n```cs\npublic class Math\n{\n    private int something;\n\
    \    public int Add(int a, int b)\n    {\n        something += 1;\n        return\
    \ a + b;\n    }\n}\n```\n\n没有任何能阻止我们编写一个改变 `Math` 类内部状态的 `Add` 函数。类内部状态的改变被称为**副作用**（side\
    \ effect）。\n\n函数式编程禁止此类副作用。这使得给定输入参数时预测函数的输出成为可能。尽管这很困难；尝试写一个没有状态或副作用的应用程序吧。\n\
    \n# 面向切编程 (Aspect-Oriented Programming)\n\n面向对象编程（OOP）在很多方面都很优秀。但它并不擅长处理所谓的**跨切关注点**（cross-cutting\
    \ concerns）。跨切关注点是贯穿应用程序的通用职责。以日志为例，你可能需要在每个层、每个项目的任何方法中实现它。结果是，你所有的方法都以类似于 `Log.Log(currentName,\
    \ parameters)` 的内容开头。另一个例子是 .NET 中的 `INotifyPropertyChanged` 接口。它们可以在类上实现，每每当属性发生变化时，就会触发\
    \ `PropertyChanging` 和 `PropertyChanged` 事件。这种实现非常繁琐。\n\n代码列表 108：INotifyPropertyChanged\n\
    \n```cs\npublic class SomeClass : INotifyPropertyChanged, INotifyPropertyChanged\n\
    {\n    public event PropertyChangedEventHandler PropertyChanged;\n    public event\
    \ PropertyChangingEventHandler PropertyChanging;\n\n    private int someProperty;\n\
    \    public int SomeProperty\n    {\n        get { return someProperty; }\n  \
    \      set\n        {\n            if (value != someProperty)\n            {\n\
    \                RaisePropertyChanging(\"SomeProperty\");\n                someProperty\
    \ = value;\n                RaisePropertyChanged(\"SomeProperty\");\n        \
    \    }\n        }\n    }\n\n    private void RaisePropertyChanging(string propertyName)\n\
    \    {\n        if (PropertyChanging != null)\n        {\n            PropertyChanging(this,\
    \ new PropertyChangingEventArgs(propertyName));\n        }\n    }\n\n    private\
    \ void RaisePropertyChanged(string propertyName)\n    {\n        if (PropertyChanged\
    \ != null)\n        {\n            PropertyChanged(this, new PropertyChangedEventArgs(propertyName));\n\
    \        }\n    }\n}\n```\n\n这些是大量的样板代码！一个只需要一行代码的类现在有了超过三十行！\n\n面向切面编程（AOP）旨在通过动态修改现有代码来解决这个问题。代理模式（Proxy\
    \ Pattern）或装饰器模式（Decorator Pattern）通常被用于此。最著名的 AOP 框架之一可能是 PostSharp⁶。另一个是 Castle\
    \ Project 的 DynamicProxy⁷。\n\n⁶ https://www.postsharp.net/\n⁷ http://www.castleproject.org/projects/dynamicproxy/\n\
    \n# 结论\n\n面向对象编程是一种极佳的编程范式，它使你能够编写可读、可扩展且易于维护的大型企业级应用程序。你所拥有的工具（如继承、封装、接口和设计模式）非常多。尽管如此，许多项目完全失败，从未问世。当工具被应用不当或根本不使用时，你最终仍然会得到一堆不可维护的“意大利条代码”。因此，学习和实践不同的模式和设计非常重要，这样在时机到来时，你可以做出明智的决定决定何时使用什么。\n\
    \n"
