    \nFigure 14: Class Diagram of the Strategy Pattern\n\nThe Strategy Pattern allows\
    \ you to encapsulate a family of algorithms and use them interchangeably. You\
    \ can think of many applications for the Strategy Pattern, for example, a video\
    \ game where units on a battlefield behave the same in many aspects, such as moving\
    \ and rendering, but differ by attack strategy. One unit might be offensive while\
    \ another is defensive. The offensive or defensive algorithm can be injected into\
    \ each unit.\n\nAnother example is the sorting of a list. Depending on the size\
    \ of the list you might want to use another sorting algorithm, but you don't want\
    \ to hard code each algorithm into the list class.\n\nSo let's make a little game.\
    \ It's a Simple Console application and we'll be pressing any button which will\
    \ move our units and may result in an enemy encounter (keep pressing buttons or\
    \ escape to quit). Each unit reacts differently to an enemy encounter. So first\
    \ we define a generic Unit class.\n\nCode Listing 68: The Strategy Pattern\n\n\
    ```csharp\npublic interface IUnitBehavior\n{\n  void ReactToOpponent();\n}\n\n\
    public class Unit\n{\n  private string name;\n  private IUnitBehavior behavior;\n\
    \n  public Unit(string name, IUnitBehavior behavior)\n  {\n    this.behavior =\
    \ behavior;\n    this.name = name;\n  }\n\n  public void Render()\n  {\n    Console.WriteLine(\"\
    \\\\o/\");\n    Console.WriteLine(\"@ 0\");\n    Console.WriteLine(\"/ \\\\\"\
    );\n  }\n\n  public void Move()\n  {\n    Console.WriteLine(String.Format(\"{0}\
    \ moves...\", name));\n  }\n\n  public void ReactToOpponent()\n  {\n    behavior.ReactToOpponent();\n\
    \  }\n}\n```\n\nSo as you can see the Render and Move methods are the same for\
    \ each Unit, however, ReactToOpponent is injected through the constructor. The\
    \ UnitBehavior interface defines the ultimate strategy to use. Let's define some\
    \ strategies.\n\n> Code Listing 69: Some Strategies\n\n```csharp\npublic class\
    \ WarriorBehavior : UnitBehavior\n{\n    public void ReactToOpponent()\n    {\n\
    \        Console.WriteLine(\"\\\\\\\\ATTACK!\\\\\\\\\");\n    }\n}\n\npublic class\
    \ DefenderBehavior : UnitBehavior\n{\n    public void ReactToOpponent()\n    {\n\
    \        Console.WriteLine(\"\\\\\\\\Hold the line!\\\\\\\\\");\n    }\n}\n```\n\
    \nAnd let's get the Unit and UnitBehavior together.\n\n> Code Listing 70: The\
    \ Final Battle\n\n```csharp\nUnit warrior = new Unit(\"Warrior\", new WarriorBehavior());\n\
    Unit defender = new Unit(\"Defender\", new DefenderBehavior());\n\nList<Unit>\
    \ units = new List<Unit>();\nunits.Add(warrior);\nunits.Add(defender);\n\nforeach\
    \ (Unit unit in units)\n{\n    unit.Render();\n    Console.WriteLine();\n}\nConsole.WriteLine(\"\
    Your troops are on an important mission!\");\nConsole.WriteLine(\"Press Escape\
    \ to quit or any other key to continue.\");\nRandom rnd = new Random();\nwhile\
    \ (Console.ReadKey().Key != ConsoleKey.Escape)\n{\n    foreach (Unit unit in units)\n\
    \    {\n        unit.Move();\n    }\n    Console.WriteLine();\n    // Returns\
    \ 0, 1, or 2.\n    if (rnd.Next(3) == 0)\n    {\n        Console.WriteLine(\"\
    The enemy attacks!\");\n        foreach (Unit unit in units)\n        {\n    \
    \        unit.ReactToOpponent();\n        }\n    }\n    else\n    {\n        Console.WriteLine(\"\
    Nothing happened...\");\n    }\n    Console.WriteLine();\n}\n```\n\nThat's quite\
    \ a bit of code, but it's really the first two lines that matter. We're defining\
    \ two Units, but with another UnitBehavior. When an enemy attacks (chance 1 in\
    \ 3) you'll see each Unit behaves according to its strategy. It also becomes easy\
    \ to add another strategy.\n\n> Code Listing 71: Adding a New Strategy\n\n```csharp\n\
    // ...\nUnit priest = new Unit(\"Priest\", new PriestBehavior());\n// ...\nunits.Add(priest);\n\
    // ...\npublic class PriestBehavior : IUnitBehavior\n{\n    public void ReactToOpponent()\n\
    \    {\n        Console.WriteLine(\"Heal our troops!\");\n    }\n}\n```\n\nThe\
    \ .NET Framework makes use of the Strategy Pattern as well, such as when calling\
    \ List<T>.Sort(). You can pass in an optional IComparer<T>. Let's check out as\
    \ it's another good example. We're going to sort people by their first and last\
    \ names.\n\n# Code Listing 72: Class Person and IComparer\n\n```csharp\npublic\
    \ class Person\n{\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n}\n\npublic class FirstNameSorter : IComparer<Person>\n\
    {\n    public int Compare(Person x, Person y)\n    {\n        return x.FirstName.CompareTo(y.FirstName);\n\
    \    }\n}\n\npublic class LastNameSorter : IComparer<Person>\n{\n    public int\
    \ Compare(Person x, Person y)\n    {\n        return x.LastName.CompareTo(y.LastName);\n\
    \    }\n}\n```\n\nWe now create a list, put people in it, and sort them by first\
    \ or last name.\n\n# Template Method\n\n![](img/a03594f8f44c9d45de3912512db3a264_63_0.png)\n\
    \nFigure 15: Class Diagram of the Template Method\n\nThe Template Method Pattern\
    \ is really very simple. In fact, its not more than simple inheriting and method\
    \ overriding. Let's say we have a general pattern of connecting to a database,\
    \ constructing a query, executing the query, retrieving the results, and finally\
    \ closing the connection. We can quite literally write this example without worrying\
    \ about the details.\n\nCode Listing 74: Template Method\n\n```csharp\npublic\
    \ abstract class BaseDatariever\n{\n    public DataTable RetrieveData()\n    {\n\
    \        Connect();\n        string query = GetQuery();\n        DataTable result\
    \ = ExecQuery(query);\n        Close();\n        return result;\n    }\n\n   \
    \ protected abstract void Connect();\n    protected abstract string GetQuery();\n\
    \    protected abstract DataTable ExecQuery(string query);\n    protected abstract\
    \ void Close();\n}\n```\n\nLet's say we need to retrieve the Product table from\
    \ a SQL Server database. We can inherit the BaseDatariever and fill in the blanks.\n\
    \n# Code Listing 75: Inheritance of the Template Class\n\n```csharp\npublic class\
    \ ProductRetriever : BaseDatariever\n{\n    private string connString;\n    private\
    \ SqlConnection connection;\n\n    public ProductRetriever(string connString)\n\
    \    {\n        this.connString = connString;\n    }\n\n    protected override\
    \ void Connect()\n    {\n        connection = new SqlConnection(connString);\n\
    \    }\n\n    protected override string GetQuery()\n    {\n        return \"SELECT\
    \ ID, Name, Price FROM Product\";\n    }\n\n    protected override DataTable ExecQuery(string\
    \ query)\n    {\n        using (SqlDataAdapter adapter = new SqlDataAdapter(query,\
    \ connection))\n        {\n            DataTable result = new DataTable();\n \
    \           return result;\n        }\n    }\n\n    protected override void Close()\n\
    \    {\n        connection.Dispose();\n        connection = null;\n    }\n}\n\
    ```\n\nLikewise, we can implement it for ODBC, Oracle, or what have you. It would\
    \ make sense to add another level of depth, so we can implement this for SQL Server,\
    \ but not make it query specific. Just rename ProductRetriever to SqlDataRetriever,\
    \ make it abstract, and remove the GetQuery method. Now the ProductRetriever would\
    \ look as follows:\n\n# Code Listing 76: ProductRetriever\n\n```csharp\npublic\
    \ class ProductRetriever : SqlDataRetriever\n{\n    public ProductDataRetriever(string\
    \ connString)\n    {\n        : base(connString);\n    }\n\n    protected override\
    \ string GetQuery()\n    {\n    }\n}\n```\n"
