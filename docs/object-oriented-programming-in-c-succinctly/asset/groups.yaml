    \ find both interfaces use different classes, have many different methods (that\
    \ the other doesn't have), and more. So let's create an interface that can tie\
    \ these two incompatible API's together. The problem is what we'll do with the\
    \ DataTables. Our interface can work with DataTables and we should make that we\
