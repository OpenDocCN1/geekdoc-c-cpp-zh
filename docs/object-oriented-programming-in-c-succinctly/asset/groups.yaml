  - '[PAGE 90]


    Is this going too far? Has the programmer lost himself in a sea of abstraction?
    You might be tempted to think so, but actually this is pretty smart. Imagine you
    have to run some tests on a class that gives different results dependent on the
    current time (or date). That''s not uncommon at all; maybe it''s a financial application
    that needs to get the exchange rate at a given date. So try testing if the codebase
    has DateTime.Now directly in the methods. With the INowResolver you can inject
    your now and test for yesterday, now, and tomorrow.


    Personally, I''ve never seen abstraction go too far. I have missed lots of abstractions
    though. Sure, having many unnecessary abstractions is hard to read, but missing
    abstractions is hard to maintain. So the only advice I can give here is to keep
    thinking, come up with different designs, compare them using the tools I''ve laid
    out in this book, and use your best judgement. Luckily, some of the harder decisions
    are already made for you by the framework or technology you choose for your next
    project.'
  - "[PAGE 91]\n\n# # Chapter 7 Other Paradigms\n\nBy now I hope you've realized that\
    \ Object-Oriented design is pretty awesome. It's not the only way to write software\
    \ out there though. In fact, C# is a multi-paradigm language. Knowing which paradigms\
    \ helps to identify the strengths and weaknesses of OOP.\n\n# ## Procedural Programming\n\
    \nProcedural Programming has been around for a long time. The name comes from\
    \ procedures or subroutines, also known as methods. Procedural languages, like\
    \ OO languages, have methods (procedures), variables, data structures, and even\
    \ some sort of modularity. Procedural languages have no notion of classes, though.\
    \ If two methods need access to the same variable that variable must be declared\
    \ on a global level. In larger applications this becomes problematic as it's very\
    \ easy to accidentally manipulate a variable and mess up your entire application.\
    \ Well known procedural languages are C, Pascal, FORTRAN, and BASIC.\n\n# ## Functional\
    \ Programming\n\nThough Functional Programming has been around since the 50's,\
    \ it has recently seen an uptick in popularity. The first functional language,\
    \ in 1958, was LISP. In Functional Languages, closely related to mathematical\
    \ functions, have a central role, as like in mathematics a function can only work\
    \ with the input it has been given. This makes it possible to reason about functional\
    \ programs because you know functions will not alter any program state. Since\
    \ functions are so important, it is easy to compose new functions from existing\
    \ functions, to return functions from functions, and to pass inputs to other functions.\
    \ We say that functions are first class citizens. Functional languages often have\
    \ a sophisticated type system which makes it unnecessary to declare variable types,\
    \ yet type safety is guaranteed.\n\nC# has some functional constructs. For example\
    \ LINQ and lambda's have been borrowed from functional languages. Other popular\
    \ functional languages are F#, ML, Erlang, and Haskell.\n\n# ## Stateless programming\n\
    \nOne difference between Functional and OO Programming is the notion of state.\
    \ Every OO language has state inside a class that determine the state of a class.\
    \ Having state does more for a language than you might think. For example, consider\
    \ the Incrementer class:\n\n> Code List 105: The Incrementer Class\n\n```\npublic\
    \ class Incrementer {\n    private int counter = 0;\n}\n```"
- md: "\n```cs\npublic void Increment()\n{\n    counter += 1;\n}\n\npublic int GetIncrement()\n\
    {\n    return counter;\n}\n```\n\nThe state of any Increment instance is determined\
    \ by the value of counter. When we call the Increment function we do not know\
    \ the state of our instance unless we know the state before we call Increment.\
    \ This makes it very hard to reason about programs. When we call GetIncrement,\
    \ we don't know what it will return because we don't know the state of the object.\n\
    \nLet's check out an example. Suppose we have a class Math with a function Add.\n\
    \n> Code Listing 106: A Math Class\n\n```cs\npublic class Math\n{\n    public\
    \ int Add(int a, int b)\n    {\n        return a + b;\n    }\n}\n```\n\nIn this\
    \ case, we know that if we call the function with parameters 1 and 2 the result\
    \ will be 3. However, and this is very important, in an OO language we can never\
    \ be sure.\n\n> Code Listing 107: Add with Side Effects\n\n```cs\npublic class\
    \ Math\n{\n    private int something;\n    public int Add(int a, int b)\n    {\n\
    \        something += 1;\n        return a + b;\n    }\n}\n```\n\nNothing stops\
    \ us from writing an Add function that changes the internal state of our Math\
    \ class. The change of a class's internal state is called a side effect.\n\nFunctional\
    \ Programming forbids such side effects. This makes it possible to predict the\
    \ outcome of a function given the input parameters. It's difficult though; try\
    \ writing an application without state or side effects.\n\n# Aspect-Oriented Programming\n\
    \nOOP is great for many things. One it isn't very good at handling so-called cross-cutting\
    \ concerns. A cross-cutting concern is a general responsibility that is used throughout\
    \ the application. Think of logging, for example, which you might want to implement\
    \ in just about any method in every layer and project. The result is that all\
    \ your methods start with something like Log.Log(currentName, parameters). Another\
    \ example is something like the INotifyPropertyChanged and INotifyPropertyChanged\
    \ interfaces in .NET. They can be implemented on a class, which would then raise\
    \ the PropertyChanging and PropertyChanged events whenever a property changes.\
    \ The implementation is rather tedious.\n\nCode List 108: INotifyPropertyChanged\
    \ and INotifyPropertyChanged\n\n```cs\npublic class SomeClass : INotifyPropertyChanged,\
    \ INotifyPropertyChanged\n{\n    public event PropertyChangedEventHandler PropertyChanged;\n\
    \    public event PropertyChangingEventHandler PropertyChanging;\n\n    private\
    \ int someProperty;\n    public int SomeProperty\n    {\n        get { return\
    \ someProperty; }\n        set\n        {\n            if (value != someProperty)\n\
    \            {\n                RaisePropertyChanging(\"SomeProperty\");\n   \
    \             someProperty = value;\n                RaisePropertyChanged(\"SomeProperty\"\
    );\n            }\n        }\n    }\n\n    private void RaisePropertyChanging(string\
    \ propertyName)\n    {\n        if (PropertyChanging != null)\n        {\n   \
    \         PropertyChanging(this, new PropertyChangingEventArgs(propertyName));\n\
    \        }\n    }\n\n    private void RaisePropertyChanged(string propertyName)\n\
    \    {\n        if (PropertyChanged != null)\n        {\n            PropertyChanged(this,\
    \ new PropertyChangedEventArgs(propertyName));\n        }\n    }\n}\n```\n\nThat's\
    \ a lot of boilerplate code! A class that would need one line of code now has\
    \ over thirty!\n\nAspect-Oriented Programming aims to fix this issue by altering\
    \ existing code dynamically. The Proxy or Decorator Patterns are often used to\
    \ accomplish this. One of the most known AOP frameworks is probably PostSharp⁶.\
    \ Another is DynamicProxy by Castle Project⁷.\n\n⁶ https://www.postsharp.net/\n\
    ⁷ http://www.castleproject.org/projects/dynamicproxy/\n\n# Conclusion\n\nObject-oriented\
    \ programming is an awesome programming paradigm which enables you to write huge\
    \ enterprise applications that are readable, extendable, and maintainable. The\
    \ tools available to you, such as Inheritance, Encapsulation, Interfaces, and\
    \ Design Patterns, are quite numerous. Still, many projects fail completely, never\
    \ seeing the light of day. When the tools are applied incorrectly, or not at all,\
    \ you will still end up with a bunch of unmaintainable spaghetti code. For this\
    \ reason it is important that you study and practice different patterns and designs\
    \ so you can make an informed decision on what to use when that time comes.\n"
