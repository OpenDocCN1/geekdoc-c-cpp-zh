- md: "\n# The Story behind the Succinctly Series of Books\n\nDaniel Jebaraj, Vice\
    \ President\nSyncfusion, Inc.\n\nStaying on the cutting edge\nAs many of you may\
    \ know, Syncfusion is a provider of software components for the Microsoft platform.\
    \ This puts us in the exciting but challenging position of always being on the\
    \ cutting edge.\n\nWhenever platforms or tools are shipping out of Microsoft,\
    \ which seems to be about every other week these days, we have to educate ourselves,\
    \ quickly.\n\n# Information is plentiful but harder to digest\n\nIn reality, this\
    \ translates into a lot of book orders, blog searches, and Twitter scans.\n\n\
    While more information is becoming available on the Internet and more and more\
    \ books are being published, even on topics that are relatively new, one aspect\
    \ that continues to inhibit us is the inability to find concise technology overviews.\n\
    \nWe are usually faced with two options: read several 500+ page books or scour\
    \ the web for relevant blog posts and other articles. Just as everyone else who\
    \ has a job to do and customers serve, we find this quite frustrating.\n\n# The\
    \ Succinctly series\n\nThis frustration translated into a deep desire to produce\
    \ a series of concise technical books that would be targeted at developers working\
    \ on the Microsoft platform.\n\nWe freely believe, given the background knowledge\
    \ such developers have, that most topics can be translated into books that are\
    \ between 50 and 100 pages.\n\nThis is exactly what we resolved to accomplish\
    \ with the Succinctly series. Isn't everything wonderful out of a deep desire\
    \ to change things for the better?\n\n# The best authors, the best content\n\n\
    Each author was carefully chosen from a pool of talented experts who shared our\
    \ vision. The book you now hold in your hands, and the others available in this\
    \ series, are a result of the authors' tireless work. You will find original content\
    \ that is guaranteed to get you up and running in about the time it takes to drink\
    \ a few cups of coffee.\n\n# Free forever\n\nSyncfusion will be working to produce\
    \ books on several topics. The books will always be free. Any updates we publish\
    \ will also be free.\n\n# Free? What is the catch?\n\nThere is no catch here.\
    \ Syncfusion has a vested interest in this effort.\n\n# Let us know what you think\n\
    \nIf you have any topics of interest, thoughts, or feedback, please feel free\
    \ to send them to us at succinctly-series@syncfusion.com.\n\nWe sincerely hope\
    \ you enjoy reading this book and that it helps you better understand the topic\
    \ of study. Thank you for reading.\n\nPlease follow us on Twitter and \"Like\"\
    \ us on Facebook to help us spread the word about the Succinctly series!\n\n![](img/a03594f8f44c9d45de3912512db3a264_7_0.png)\n\
    \n![](img/a03594f8f44c9d45de3912512db3a264_7_1.png)\n\n# About the Author\n\n\
    Sander Rossel is a professional developer with over five years of working experience\
    \ in .NET (VB and C#, WinForms, MVC, Entity Framework), JavaScript, and SQL Server.\n\
    \nHe has an interest in various technologies including, but not limited to, functional\
    \ programming, NoSQL, and software design.\n\nHe seeks to educate others on his\
    \ blog, Sander's Bits – Writing the code you need, and on his CodeProject profile.\n\
    \nIn his spare time he likes to play games, watch a movie, and listen to music.\
    \ He currently lives with his cat, Nika, in the Netherlands.\n\n# Introduction\
    \ to OOP\n\nObject-oriented programming, or OOP for short, has been around since\
    \ the 60's and is now the de facto standard programming paradigm. The programming\
    \ language Simula first adopted OOP concepts in the 60's. Later, these concepts\
    \ were taken further by the first OOP language, Smalltalk. OOP started to really\
    \ pick steam in the 90's with languages such as Java. C# and .NET principles that\
    \ are discussed\n\nOOP is a powerful concept that solves many problems in software\
    \ development. OOP is not the holy grail of programming, but as we will see through\
    \ this book, it can help in writing code that is easy to read, easy to maintain,\
    \ easy to update, and easy to expand.\n\nThe concepts in this book are not unique\
    \ to C#. Other object-oriented languages, such as Java, C++ and Python, share\
    \ principles discussed throughout this book.\n\nThe included code samples were\
    \ all tested in the free Community Edition of Visual Studio 2015 and were created\
    \ in .NET 4 (though most will also run in earlier versions of .NET).\n\nThroughout\
    \ this book I'm assuming basic knowledge of C#. If you know how to write a class\
    \ and declare a variable, you're pretty much good to go.\n\n## Why OOP?\n\nOOP\
    \ is all about architecting your software. Let's compare software to a house.\
    \ Would you want a bunch of builders to start building your house without predefined\
    \ rules and agreements? I bet! Your house would be a mess. Still, that's what\
    \ often happens in software and, as expected, a lot of software turns out a mess!\
    \ Returning to our house metaphor, let's say your lamps were built into the ceiling.\
    \ Whenever a lamp broke you'd need a new ceiling! Luckily, that's not the case.\
    \ Yet in software, when a small detail needs to change, we often find ourselves\
    \ rewriting huge pieces of code. And in many cases functionality that had nothing\
    \ to do with the change breaks away. By abstracting away certain functionality\
    \ we can just worry about the detail and we're sure other parts of the system\
    \ won't break. On top of that we can reuse it.\n\n## Terminology\n\nBefore we\
    \ dive into OOP it's important to get some terminology straight. A class is a\
    \ blueprint for an object. An object is an instance of a class. In C#, we use\
    \ the `new` keyword to create an object.\n\nIn the following code, we see an example\
    \ of a class:\n\n```csharp\npublic class Person\n{\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n    public string GetFullName()\n\
    \    {\n        return FirstName + \" \" + LastName;\n    }\n}\n```\n\nNow let's\
    \ look at how we use it:\n\n```csharp\nPerson personObject = new Person();\npersonObject.FirstName\
    \ = \"Sander\";\npersonObject.LastName = \"Rossel\";\nstring fullName = personObject.GetFullName();\n\
    ```\n\nIn C#, we have a couple of ways to check the type of an object, for example\
    \ we can use `GetType()` or the `is` operator. And remember everything inherits\
    \ from Object.\n\n# Chapter 1 The Three Pillars of OOP\n\nObject-oriented programming\
    \ has three characteristics that define the paradigm. In this chapter, we'll look\
    \ at each one in detail.\n\n## Inheritance\n\nInheritance is an important part\
    \ of any object-oriented language. Classes can inherit from each other, which\
    \ means the inheriting class gets all of the behavior of the inherited class,\
    \ also known as the base class. Let's look at the Person example I used earlier.\n\
    \nCode Listing 3: Inheritance Example\n\n```csharp\npublic class Person\n{\n \
    \   public string FirstName { get; set; }\n    public string LastName { get; set;\
    \ }\n    public string GetFullName()\n    {\n        return FirstName + \" \"\
    \ + LastName;\n    }\n}\npublic class Employee : Person\n{\n    public decimal\
    \ Salary { get; set; }\n}\n```\n\nThe trick is in the Employee : Person part.\
    \ That part basically says \"Employee inherits from Person.\" And remember everything\
    \ inherits from Object. In this case Employee inherits from Person and Person\
    \ (because it's not explicitly inheriting anything) from Object. Now let's look\
    \ at how we use Employee.\n\nCode Listing 4: Subclass usage\n\n```csharp\nEmployee\
    \ employee = new Employee();\nemployee.FirstName = \"Sander\";\nemployee.LastName\
    \ = \"Rossel\";\nstring fullName = employee.GetFullName();\nemployee.Salary =\
    \ 1000000; // I wish :-)\n```\n\nThat's pretty awesome! We got everything from\
    \ Person just by inheriting from it! In this case we can call Person a base class\
    \ or superclass and Employee a subclass. Another common way of saying it is that\
    \ Employee extends Person.\n"
  mdcn: "\n\n# Succinctly 系列书籍背后的故事\n\nDaniel Jebaraj，副总裁\nSyncfusion, Inc.\n\n###\
    \ 站在最前沿\n正如你们许多人所知，Syncfusion 是 Microsoft 平台软件组件的提供商。这使我们处于既兴奋又充满挑战的地位：始终处于最前沿。\n\
    \n每当 Microsoft 发布新的平台或工具时（如今似乎每隔几周就有一次），我们都必须快速地自我教育。\n\n# 信息丰富但难以消化\n\n现实中，这意味着大量的书籍订单、博客搜索和\
    \ Twitter 扫描。\n\n虽然互联网上的信息越来越多，书籍出版不断，但一个持续阻碍我们的方面是无法找到简洁的技术概述。\n\n我们通常面临两种选择：阅读几本每页超过\
    \ 500 页的书，或者在整个网络上搜索相关的博客文章和其他文章。和所有有工作要做、有客户要服务的人一样，我们觉得这非常沮丧。\n\n# Succinctly\
    \ 系列\n\n这种挫败感转变为一种强烈的渴望，希望编写一系列简洁的技术书籍，目标读者是在 Microsoft 平台上工作的开发者。\n\n我们坚信，鉴于这些开发者所拥有的背景知识，大多数主题都可以转化成\
    \ 50 到 100 页之间的书籍。\n\n这正是我们决定通过 Succinctly 系列要实现的。源于想要让事物变得更好的深切愿望，难道不是一切都是美好的吗？\n\
    \n# 最好的作者，最好的内容\n\n每位作者都是从与我们共同愿景的才华专家池中经过精心挑选的。你现在手中的这本书以及该系列中的其他书籍，都是作者们不懈工作的成果。你将发现原创内容，这些内容保证让你在喝几杯咖啡的时间内上手。\n\
    \n# 永久免费\n\nSyncfusion 将致力于编写多个主题的书籍。这些书籍将永远是免费的。我们发布的任何更新也将是免费的。\n\n# 免费？有什么猫腻？\n\
    \n这里没有猫腻。Syncfusion 在工作中有共同利益。\n\n# 让我们知道你的想法\n\n如果你有任何感兴趣主题、想法或反馈，请随时通过 succinctly-series@syncfusion.com\
    \ 与我们联系。\n\n我们诚地希望你喜欢这本书，希望它能帮助你更好地理解学习的主题。感谢阅读。\n\n请在 Twitter 上关注我们，并在 Facebook\
    \ 上“点赞”我们，帮助我们传播 Succinctly 系列！\n\n![](img/a03594f8f44c9d45de3912512db3a264_7_0.png)\n\
    \n![](img/a03594f8f44c9d45de3912512db3a264_7_1.png)\n\n# 关于作者\n\nSander Rossel\
    \ 是一位专业开发者，在 .NET (VB 和 C#, WinForms, MVC, Entity Framework)、JavaScript 和 SQL\
    \ Server 方面拥有超过五年的工作经验。\n\n他对各种技术都感兴趣，包括但不限于函数式编程、NoSQL 和软件设计。\n\n他致力于通过他的博客 Sander's\
    \ Bits – Writing the code you need 以及他的 CodeProject 个人页来教育他人。\n\n在空余时间，他喜欢玩游戏、看电影和听音乐。他目前与他的猫\
    \ Nika 一一起住在荷兰。\n\n# OOP 导论\n\n面向对象编程，简称为 OOP，自 60 年代以来一直存在，现在是事实上的标准编程范式。Simula\
    \ 语言在 60 年代首次引入了 OOP 概念。后来，这些概念被第一个 OOP 语言 Smalltalk 进一步发展。OOP 在 90 年代随着 Java\
    \ 等语言的出现开始真正兴起。书中讨论的 C# 和 .NET 原则。\n\nOOP 是一个强大的概念，解决了软件开发中的许多问题。OOP 并不是编程的圣杯，但正如我们将在本书中所看到的，它可以帮助编写易于阅读、易于维护、易于更新和易于扩展的代码。\n\
    \n书中概念并非 C# 特有。其他面向对象的语言（如 Java、C++ 和 Python）也共享了书中讨论的原则。\n\n书中包含的代码示例均已在 Visual\
    \ Studio 2015 免费社区版中经过测试，并使用 .NET 4 创建（尽管大多数代码也可以在较早版本的 .NET 中运行）。\n\n在整书中，我假设你具备\
    \ C# 的基础知识。如果你知道如何编写类和声明变量，基本上就可以上路了。\n\n## 为什么用 OOP？\n\nOOP 关乎软件的架构设计。让我们把软件比作一房子。你会让一群建筑工在没有预定义规则和协议的情况下开始建造你的房子吗？我敢打赌！你的房子会变得一团糟。尽管如此，这在软件开发中经常发生，而且正如预期的那样，很多软件最后都变得一团糟！回到我们的房子比喻，假设你的灯是安装在天花板里的。每当灯坏了，你就需要换整个天花板！幸运的是，情况并非如此。但在软件中，当一个小细节需要更改时，我们经常发现自己正在重写大段代码。在很多情况下，与更改无关的功能也会崩溃。通过抽象某些功能，我们只需要关注细节，并可以确定系统的其他部分不会损坏。此外，我们还可以复用它。\n\
    \n## 术语\n\n在深入研究 OOP 之前，明确一些术语是非常重要的。类（Class）是对象的蓝图。对象（Object）是类的实例。在 C# 中，我们使用\
    \ `new` 关键字来创建对象。\n\n在下面的代码中，我们看到了类的示例：\n\n```csharp\npublic class Person\n{\n\
    \    public string FirstName { get; set; }\n    public string LastName { get;\
    \ set; }\n    public string GetFullName()\n    {\n        return FirstName + \"\
    \ \" + LastName;\n    }\n}\n```\n\n现在让我们看看如何使用它：\n\n```csharp\nPerson personObject\
    \ = new Person();\npersonObject.FirstName = \"Sander\";\npersonObject.LastName\
    \ = \"Rossel\";\nstring fullName = personObject.GetFullName();\n```\n\n在 C# 中，我们有几种方法检查对象的类型，例如我们可以使用\
    \ `GetType()` 或 `is` 运算符。记住，一切都继承自 Object。\n\n# 第 1 章 OOP 的三大支柱\n\n面向对象编程有定义该范式的三个特征。在本章中，我们将详细查看每一个特征。\n\
    \n## 继承\n\n继承（Inheritance）是任何面向对象语言的重要部分。类之间可以相互继承，这意味着继承类获得了被继承类的所有行为，被继承类也称为基类（base\
    \ class）。让我们看看之前使用的 Person 示例。\n\n代码 Listing 3：继承示例\n\n```csharp\npublic class\
    \ Person\n{\n    public string FirstName { get; set; }\n    public string LastName\
    \ { get; set; }\n    public string GetFullName()\n    {\n        return FirstName\
    \ + \" \" + LastName;\n    }\n}\npublic class Employee : Person\n{\n    public\
    \ decimal Salary { get; set; }\n}\n```\n\n诀窍在于 `Employee : Person` 这部分。那部分基本上的意思是“Employee\
    \ 继承自 Person”。记住，一切都继承自 Object。在这种情况下，Employee 继承自 Person，而 Person（因为它没有显式继承任何内容）继承自\
    \ Object。现在让我们看看如何使用 Employee。\n\n代码 Listing 4：子类用法\n\n```csharp\nEmployee employee\
    \ = new Employee();\nemployee.FirstName = \"Sander\";\nemployee.LastName = \"\
    Rossel\";\nstring fullName = employee.GetFullName();\nemployee.Salary = 1000000;\
    \ // 我也希望如此 :-)\n```\n\n这太棒了！通过继承，我们就获得了 Person 的所有内容！在这种情况下，我们可以将 Person 称为基类或超类（super\
    \ class），将 Employee 称为子类（subclass）。另一种常见的说法是 Employee 扩展（extends）了 Person。\n\n"
