    # 无环依赖原则 (ADP)


    无环依赖原则在 C# 和 Visual Studio 中确实是一个存在的问题。根据该原则，包不能依赖于依赖于自身的包，这会在你的依赖关系中创建一个循环。然而，在
    Visual Studio 中是不允许这种依赖的。如果你尝试编译违反 ADP 的 .NET 代码，你将得到一个错误，信息会抱怨你正在创建循环引用。无论如何，让我们深入探讨一下。假设你有四个包：Data、Business、UIComponents
    和 UI。UI 依赖于 Business 和 UIComponents，而 Business 依赖于 Data。


    ![](img/a03594f8f44c9d45de3912512db3a264_86_0.png)


    图 23：无循环依赖


    如果 Business 发生变化，我们知道 UI 依赖于它，所以我们应该检查 UI 是否仍然正常。但我们知道 UIComponents 和 Data 保持不变。同样，如果
    Data 发生变化，我们知道应该检查 Business 和 UI，但不需要检查 UIComponents。


    现在假设 Data 依赖于 UI。


    ![](img/a03594f8f44c9d45de3912512db3a264_87_0.png)


    我们现在创建了一个循环。如果现在 Business 发生变化，我们应该检查 UI 是否仍然正常，但因为 Data 现在依赖于 UI，我们也应该检查 Data。如果
    UIComponents 变化，你必须重新验证每一个包。对于四个包来说这很累人，但在拥有几十个包的现实应用中，这几乎是无法实现的。无论如何，这是一个非常糟糕的设计，并且被
    Visual Studio 禁止。


    # 稳定依赖原则 (SDP)


    有些包编写一次并定期更新，而另一些包频繁变化。考虑用户界面：应用程序的每个新功能都需要用户界面的更改来支持该功能。希望你的 Data Mapper 更改频率要少得多。如果一个包很少变化，就说它是稳定的。根据稳定依赖原则，稳定的包不应该依赖于不稳定的包。这是合理的，因为每次依赖项更新时，我们都应该验证该包。这意味着如果依赖项频繁变化，我们就必须频繁验证。根据这个逻辑，包的稳定性取决于它所依赖的最不稳定的包，因此稳定的包不应该依赖于不稳定的包。


    # 稳定抽象原则 (SAP)


    为了让包保持稳定，这些包必须具有某种程度的抽象。没有抽象，这些包就无法被更改或扩展，导致它们变得不可更改或不稳定。我们已经看到如何通过接口、继承和 SOLID
    原则来创建可扩展的软件。


    # 层与级 (Layers and Tiers)


    你经常会听到分层（layered）或分级（tiered）软件设计的术语。层是一个抽象级别；级是职责之间的物理隔离。例如，客户端-服务器解决方案是一个 2 层架构。如果你决定为某些业务逻辑增加一个额外的服务器，你就创建了一个
    3 层架构。在面向对象编程中，N 层架构相对容易，因为模块可以在不同的层之间复用。当你实践书中列出的原则时，你的分层架构将自然而然。一个著名的分层结构是 OSI
    模型，这是一个描述互联网不同层级的模型。简单来说，你的浏览器不知道如何在线路上传输位和字节，你的链路层也不知道任何浏览器。然而，通过抽象，两者共同工作呈现网站和应用程序。同样的原理适用于软件。你的应用程序对数据库一无所知，但通过某些
    `IDataMapper` 接口，它能够与数据存储通信。


    这样的层可以很容易被替换而不影响系统的其他部分。当你观察互联网时，你可以轻松从拨号连接切换到 ADSL、有线或无线连接。不需要更换你的浏览器或电脑。同样，用于在互联网上发送接收数据的
    TCP/IP 协议可以切换为 UDP。在你的应用程序中，你可以切换数据库、重建用户界面，而不触碰系统的其他部分（前提是你成功地在不同的层中分离了关注点）。


    常见的分层或分级架构如下：


    | Application | | |

    |---|---|---|

    | Presentation | HTML, CSS, JavaScript | WinForms, WPF |

    | Business | Business Logic | |

    | | | Domain Models |

    | Data Access | Database | Web Service |


    > 图 25：常见的层或级


