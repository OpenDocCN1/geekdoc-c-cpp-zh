    \ (Data Mapper) 和查询对象 (Query Object)。数据映射器是将数据库记录映射到 C# 领域对象的代码。数据库和领域对象彼此无法感知。查询对象是一个行为类似于数据库\
    \ WHERE 子句的 C# 对象，可以传递给数据映射器（图中的 \"criteria\"）。最后，存储库是一个类集合的接口，它可以检索领域对象，并置于你的领域层和数据映射层之间。一旦运行起来，它的好处处是实现了关注点分离。你的领域对象不知道数据库，并且可以重用于其他目的。你的数据库层可以更换（例如，从\
