    List<Person> people = SomeApi.People.Select(Query.Contains(\"FirstName\", \"Sand\"\
    ));\n```\n\n这总比直接写 SQL 好！\n\n在使用存储库时有一个警告：所有的代码看起来都是 C#，但黑暗的真相并非如此。最终，某些查询将被发送到你的数据库，如果你不小心，它变得很难看且运行缓慢。Entity\
