    In general there are three kinds of Design Patterns: Creational, Structural, and
    Behavioral. Not do they solve recurring problems, a formalized solution to a problem
    that we don''t re-invent the wheel that we can communicate more clearly about
    our code. Any programmer will (hopefully) recognize your use of pattern X and
    then know how to change your code.


    In this chapter, I''m going to discuss a few (of many) Design Patterns. I''ll
    include a Unified Modeling Language (UML) class diagram of each pattern. UML is
    outside the scope of this book, so I can''t explain how the diagrams should be
    interpreted. I''ve added them for reference and they''re the "official" UML, so
    the class and method names don''t match those in the examples. You can use them
    for visual explanation, but if you don''t get them dont worry, it''s all explained
    in the text.


    The patterns I''m discussing are mentioned by the Design Patterns book as good
    starting patterns. They''re pretty easy to get into and you''ll probably see them
    a lot as.


    # Creational Patterns


    Creational Patterns deal with, as the name implies, the creation of objects. With
    Creational Patterns we can abstract away the process of object instantiation.
    As we''ve seen before, we can use composition rather than inheritance. Creating
    a set of objects that work together as a group can be beneficial, but than hard-coding
    which concrete types to use we can abstract this process like we''ve seen with
    DI. In the next section we''re going to look at a few Creational Patterns. It''s
    not a full list, but it shows the power they can bring.


    > 2 Gamma, Helm, Johnson, Vlissides - Design Patterns: Elements of Reusable Object-Oriented
