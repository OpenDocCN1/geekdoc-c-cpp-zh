    \ Mapper），可能 true一个存储库（Repository）。\n\n## 总结 (The Takeaway)\n\n在设计类时，GRASP 真的非常有用。与我们目前看到的其他东西不同，它们并不具有很的技术性质，也没有描述类或方法。它们描述的是如何为你的软件获得高效的设计。这一章表明，应用程序并不是只有单一的设计。事实上，当我们仅仅有一个汽车和一台引擎时，我们已经有了两种设计选择（甚至有更多不那么显性的选择）。记住\
    \ GRASP，我们可以得到某种至少比许多备选方案更好的设计（设计中并不存在所谓的“最佳设计”）。GRASP 有趣的地方在于，它的很多内容对大多数开发者来说已经是常识了（例如\
    \ `Person` 不应该保存自己），但通过 GRASP，你拥有了一些形式化的规则，来解释为什么这些是常识的。\n\n## 第 6 章 架构 (Architecture)\n\
    \n到目前为止，你看到了很多小规模的代码。我们已经看到了如何设计单个类、如何让多个类相互通信，以及如何抽象某些组件（如数据库）。尽管如此，你可能需要编写不仅仅几个类。在观察软件系统的高层结构时，我们谈论它的架构。在本章中，我将讨论你在构建应用程序时可能会遇到的技术挑战和方法。\n\
    \n我想强调的是，我不会讨论那些内容。我不会讨论软件架构师的工作，即与利益相关者交谈、决定开发流程（敏捷或瀑布模型）、文档、预算以及你在构建实际应用程序时必须处理的其他因素。\n\
    \n系统的架构是那些不容易改变的部分。对此的意见不一；让我们考虑数据库。许多人指向数据库，称其为任何系统的心脏，并告诉你它在开发过程后期很难更改。然而，我们知道，由于我们通过数据映射器（Data\
    \ Mapper）和存储库（Repository）之后进行抽象（软件依赖于这些抽象），更改数据库是“简单的”——只涉及切换到我们的数据映射器，可能还有存储库。或者工作量很大，所有内容都必须经过测试，但我们不应该更改前端，例如。\n\
    \n那么什么是难以改变的？假设在项目进行一半时你决定更改数据映射器或存储库的接口。这可能会非常有问题。或者你决定引入 MVC 和/或 MVVM 架构。这将需要对许多组件进行大量的重写。\n\
    \n## 不要重复自己 (DRY)\n\n我们还未讨论过的一个重要原则是 DRY 原则，即“不要重复自己”（Don't Repeat Yourself）。我们为什么要费劲地将一切放在抽象之后，思考架构，并进行复用？DRY\
    \ 就是答案。防止重复编写相同的代码。接下来的例子将说明原因。\n\n假设你有一个带有 `save` 逻辑的 `Person` 类。我们破坏了低耦合和高内聚，但我们可以保存我们的\
    \ `Person`。\n\n### 代码列表 101：带有保存逻辑的 Person\n```cs\npublic class Person {\n  //\
    \ ...\n  public void Save() {\n    // 这里是 Person 的数据库逻辑。\n  }\n}\n```\n\n现在我们需要一个\
    \ `SalesOrder`。因为我们没有一个可以保存领域对象的单一类，我们需要再次编写保存功能，但这次是针对我们的 `SalesOrder`。没问题，我们只需复制/粘贴即可。\n\
    \n### 代码列表 102：带有保存逻辑的 Person\n```cs\npublic class Person\n{\n  // ...\n  public\
    \ void Save()\n  {\n    // 这里是 Person 的数据库逻辑。\n  }\n}\n```\n\n### 代码列表 103：固定的\
    \ SalesOrder\n```cs\npublic class SalesOrder\n{\n  // ...\n  public void Save()\n\
    \  {\n    // 这里是 SalesOrder 的数据库逻辑。\n  }\n}\n```\n\n## 包 (Packages)\n\n通过创建类和方法，我们可以在应用程序中复用代码。很多时候我们要在应用程序之间复用代码。一个例子是工具，可能是\
    \ XML 解析器或数据映射器，是你编写的。你创建包（动态链接库 DLL）可以供其他应用程序使用。当你使用 .NET 时，你实际上在使用微软创建的包。就像类设计一样，在发布时有一些最佳实践。在《Agile\
    \ Principles, Practices in C#》一书中，Robert C. Martin 讨论了这些实践^5 我在这里快速总结一下它们。\n\n\
    ## 重用/发布原则 (REP)\n\n重用/发布原则规定，只有发布过的才能复用。发布是由另一个作者或实体维护的。发布是一个产品，而你是客户。发布会有更新，这些更新可能对你感兴趣，你可以选择更新或保留旧版本。显然，复制的代码不符合这一描述（正如我们所看到的）。应用程序通常由数百个类和接口组成，发布单个类是单调且令人疲惫的。包是发布的良好候选，这样所有内容都可以被复用。\n\
    \n## 共复用原则 (CRP)\n\n共复用原则是包的高内聚原则。打包在一起的类应该属于在一起。如果你复用了包中的一个类，你就需要更新、验证并重新发布你的软件。由于这个原因，包中的类应该具有高内聚（我谈论的是类之间的内聚，而不是类内部）。当你需要更新并必须做所有工作时，你会非常高兴，但你实际上并不需要那个更新。这种情况在实践中经常发生，因为替代方案是有许多包，这并不好。\n\
    \n## 共闭合原则 (CCP)\n\n共闭合原则规定，一起更改的类应该打包在一起。这是因为如果你更改了一个类或一个职责，你不希望更新超过一个包。你不希望在一个包中包含不相关的功能（CRP），也不希望一个单一的功能出现在多个包中（CCP）。\n\
    \n> ^5 R.C. Martin, M. Martin - Agile Principles, Patterns and Practices in C#\n\
    \n"
