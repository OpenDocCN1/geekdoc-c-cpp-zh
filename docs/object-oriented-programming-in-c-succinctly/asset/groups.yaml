    \ View displays the data on the screen.\n\nTwo Design Patterns related to MVC\
    \ are Model View ViewModel (MVVM) and Model View Presenter (MVP).\n\nMVP is a\
    \ pattern for the user interface. The Presenter sits between the Model and the\
    \ View and formats data so the View can use it.\n\nIn MVVM, the ViewModel is an\
    \ abstraction of the View that uses for display. Because of abstraction of the\
