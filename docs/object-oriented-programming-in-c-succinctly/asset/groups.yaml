    SingletonOperation()\nGetSingletonData()\nstatic uniqueInstance\nsingletonData\n\
    return uniqueInstance();\n```\n\nFigure 9: Class Diagram of the Singleton Pattern\n\
    \nThe Singleton Pattern is pretty fun. It's also, but often implemented incorrectly.\
    \ It's loved, and it's hated. So, why do I want to include it here? The Singleton\
    \ limits the amount of created objects of a specific type to exactly one, which\
    \ is pretty neat and can be necessary (examples of Singletons are your print spooler,\
    \ the file system, etc.). Also since it's often used incorrectly, I'd like to\
    \ educate a little and clear up when to use this. Last, since it's so often incorrectly\
    \ implemented, we're going to do it correctly now, once and for all.\n\nAt the\
    \ base of the Singleton is a private constructor. You read that right. When the\
    \ constructor of a class is private no other class can create instances of this.\
    \ That may come in handy, as the class now create instances of itself and keep\
    \ track of those instances. That's a bit counter-intuitive, but with a static\
    \ field completely possible.\n\nCode Listing 47: The Start of a Singleton\n\n\
    ```cs\npublic class SomeSingleton\n{\n    private static SomeSingleton instance;\n\
    \n    private SomeSingleton()\n    }\n}\n```\n\nAt this point no other class can\
    \ create or reach an instance of this class. We'll need another static method\
    \ (or property) to get access to the instance of this class. We'll also need to\
    \ create that instance.\n\nCode Listing 48: The Complete Singleton\n\n```cs\n\
    public class SomeSingleton\n{\n    private static SomeSingleton instance;\n\n\
    \    private SomeSingleton()\n    }\n\n    public static SomeSingleton Instance\n\
    \    get\n    {\n        if (instance == null)\n        {\n          instance\
    \ = new SomeSingleton();\n        }\n        return instance;\n    }\n}\n```\n\
    \nAnd now the Singleton is complete. Indeed, this is the implementation we'll\
    \ often find in code bases (you'll also often find Singletons with public constructors\
    \ a.k.a. not Singletons at all).\n\nSo what is wrong with this Singleton? Nothing,\
    \ if your application is completely single-threaded. When you're going multi-threaded,\
    \ this implementation can still result in multiple instances. This happens when\
    \ two threads try to get the instance at the same time. Both threads will see\
    \ that instance is null neither thread has actually created the new instance,\
    \ so we'll need to lock this. Here is the full thread-safe:\n\n## Code Listing\
    \ 49: The Thread-Safe Singleton\n\n```cs\npublic class SomeSingleton {\n    private\
    \ static SomeSingleton instance;\n    private static object syncRoot = new object();\n\
    \n    private SomeSingleton() {\n    }\n\n    get {\n        if (instance == null)\
    \ {\n            lock(syncRoot) {\n                if (instance == null) {\n \
    \                   instance = new SomeSingleton();\n                }\n     \
    \       }\n        }\n        return instance;\n    }\n\n    public void SomeMethod()\
    \ {\n        // Just an instance method like any other.\n    }\n}\n```\n\nThe\
    \ double null check may look weird, but remember when two threads access Instance\
    \ at the same time, both will see that instance is null and one thread will be\
    \ locked while the other creates the instance. After the locked thread is released,\
    \ it should check for null again or it will create a new instance. This will prevent\
    \ multiple instances.\n\nOther methods on the Singleton can now be public instance\
    \ methods and behave like any other. Just keep in mind that the state of a Singleton\
    \ object is shared throughout the entire application because it's static\n\nSo\
    \ what's the problem with Singletons? They're used far too often. I've seen Singletons\
    \ that, after a year, needed a second instance somewhere in the application! As\
    \ it turned out, this doesn't feel completely right.\n\nSecond, Singletons cannot\
    \ be subclassed. Since the constructor is not accessible by any part of the application\
    \ except the Singleton itself, not subclasses can access it (meaning you won't\
    \ be able to construct them).\n\nLast, Singletons are hard to test. Suppose you're\
    \ testing a part of the application that internally uses a Singleton. For a long\
    \ time there was no way for you to mock the Singleton. It's now possible using\
    \ testing frameworks that use code weaving and Aspect Oriented Programming (AOP),\
    \ but it still doesn't feel completely right.\n\nSo when you use a Singleton?\
    \ Basically when you're absolutely sure your application will never need a second\
    \ instance of an object (or when another instance may be harmful for the system).\
    \ It may also be in handy to provide one-point access to shared resources (like\
    \ the print spooler). Logging is often not an acceptable use of the Singleton\
    \ Pattern.\n\nWhile many objects in .NET logically have only one instance (like\
    \ Application), I am not aware of any Singleton implementations in .NET (that,\
    \ the constructor is just internal instead of private). If a rather huge framework\
    \ like .NET doesn't need Singletons, you should think very carefully if you need\
    \ them or if you can solve your problem differently.\n\n# Structural Patterns\n\
    \nStructural Patterns are about making objects work together and structuring your\
    \ code accordingly. Where Creational Patterns are the creation of objects, but\
    \ without these objects knowing about each other's internals.\n"
