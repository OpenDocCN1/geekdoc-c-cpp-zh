    \ but we can save our Person.\n\n### Code Listing 101: Person with Save Logic\n\
    ```cs\npublic class Person {\n  // ...\n  public void Save() {\n    // Database\
    \ logic for Person here.\n  }\n}\n```\n\nAnd now we need a SalesOrder. Because\
    \ we don't have a single class that can save domain objects, we'll need to write\
    \ the save functionality again, but this time for our SalesOrder. No problem,\
    \ we'll just copy/paste it.\n\n### Code Listing 102: Person with Save Logic\n\
    ```cs\npublic class Person\n{\n  // ...\n  public void Save()\n  {\n    // Database\
    \ logic for Person here.\n  }\n}\n```\n\n### Code Listing 103: Fixed SalesOrder\n\
    ```cs\npublic class SalesOrder\n{\n  // ...\n  public void Save()\n  {\n    //\
    \ Database logic for SalesOrder here.\n  }\n}\n```\n\n## Packages\n\nBy creating\
    \ classes and methods, we can reuse code throughout our application. Many times\
    \ we want to reuse code between applications. One example is a tool, may be an\
    \ XML parser, or a data mapper, that you've written. You create packages (Dynamic\
    \ Link Libraries or DLLs) that can be used by other applications. When you use\
    \ .NET you are actually using packages created Microsoft. Just like class design\
    \ there are some best practices when releasing and using. In his book Agile Principles,\
    \ and Practices in C#, Robert C. Martin discusses these practices^5I will quickly\
    \ summarize them here.\n\n## Reuse/Release Principle (REP)\n\nThe Reuse/Release\
    \ Principle states that only what is released can be reused. A release is something\
    \ that is maintained by another author or entity. The release is a product and\
    \ you are the customer. Releases get updates, which may or not be of interest\
    \ to you, and you may choose to update or stick to the old version for a while.\
    \ Clearly, copied code does not fit this description (as we've seen DRY). Applications\
    \ often consist of hundreds of classes and interfaces, releasing single classes\
    \ is tedious and overwhelming. A package is a good candidate for release so that\
    \ everything can be reused.\n\n## Common Reuse Principle (CRP)\n\nThe Common Reuse\
    \ Principle is kind of the High Cohesion Principle for packages. Classes that\
    \ are packaged together belong together. If you reuse one class in a package you\
    \ need to update, validate your software, and redistribute your software. For\
    \ this reason classes in a package should have a high cohesion (I'm talking about\
    \ cohesion between classes, not per class). You will be very happy if you need\
    \ an update and have to do all that work, but you don't actually need the update.\
    \ Of course this happens a lot in practice, since the alternative is having many\
    \ packages, which is not great.\n\n## Common Closure Principle (CCP)\n\nThe Common\
    \ Closure Principle states that classes that change together should be packaged\
    \ together. That is because if you change a class, or responsibility, you don't\
    \ want to update more than one package. You don't want to have unrelated functionality\
    \ in one package (CRP) and you don't want a single functionality in more than\
    \ one package (CCP).\n\n> ^5 R.C. Martin, M. Martin - Agile Principles, Patterns\
    \ and Practices in C#\n"
