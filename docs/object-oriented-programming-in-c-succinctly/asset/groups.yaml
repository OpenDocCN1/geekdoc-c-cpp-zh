    ;\npersonObject.LastName = \"Rossel\";\nstring fullName = personObject.getFullName();\n\
    ```\n\nIn the previous code listing, we can see how one or more types is instantiated\
    \ from a class by calling its constructor (using the new keyword).\n\nLet's go\
    \ a bit further. Each object has one or more types. A type is defined by the class\
    \ that was used to instantiate an object. For example, personObject has the type\
    \ Person. One type objects in C# share the type Object (or, including its namespace,\
    \ System.Object). This is possible because C# supports Inheritance, but we'll\
