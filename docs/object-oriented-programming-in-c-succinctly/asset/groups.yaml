    \ 的值决定。当我们调用 `Increment` 函数时，除非我们知道调用 `Increment` 之前的状态，否则我们不知道实例的状态。这使得程序的推理变得非常困难。当我们调用\
    \ `GetIncrement` 时，我们不知道它会返回什么，因为我们不知道对象的状态。\n\n让我们来看一个例子。假设我们有一个包含 `Add` 函数的\
    \ `Math` 类。\n\n> 代码列表 106：Math 类（Math Class）\n\n```cs\npublic class Math\n{\n\
