  - "[PAGE 24]\n\n# Inheritance vs. Interface\n\nOne discussion you will find frequently\
    \ online, or might get engaged in at work, is that of inheritance vs. using an\
    \ interface. Remember that you can only inherit from one class. That means if\
    \ you use inheritance, like Person -> Employee, your Employee is stuck with the\
    \ Person base class. Alternatively, you could define an IPerson and implement\
    \ it separately in Person and Employee. One guideline you'll see is that inheritance\
    \ defines an \"is-a\" relationship (an Employee is a Person) while interface defines\
    \ a \"can do\" or \"has-a\" relationship (a Person has a stamp collection). As\
    \ you see, it's not entirely proof, as a stamp collector is also a Person, but\
    \ still inheritance can lead us into trouble.\n\nI like to use when I have some\
    \ functionality that is shared across multiple, if not all, subtypes of that class,\
    \ like with the Dblogger example.\n\nAnd remember, composition may also be a viable\
    \ option!\n\n# The Takeaway\n\nAn interface is a means to create additional types\
    \ without the need for multiple inheritance. They are extremely useful, I've talked\
    \ to people say every class needs a matching interface. It's an important feature\
    \ that Visual Studio has the option to create an interface based on a class. When\
    \ your cursor is in a class, you can find it under Edit -> Refactor -> Extract\
    \ Interface in the top menu.\n\n```\npublic class SomeClass {\n    public void\
    \ MethodA()\n    { }\n    public void MethodB()\n    { }\n    private void Something()\n\
    \    {}\n}\n```\n\n![](img/a03594f8f44c9d45de3912512db3a264_24_0.png)\n\nLearn\
    \ to use them well, as we'll use them a lot throughout this book."
  - "[PAGE 25]\n\n# # Chapter 3 SOLID\n\nWe've seen the building blocks that make\
    \ up an object-oriented language, but how can we write our classes so that they\
    \ make sense? When to inherit, what to put inside a class, how many interfaces\
    \ do we need? These are questions that can be answered in part by the so-called\
    \ SOLID principles. SOLID is an acronym and each letter stands for a principle.\n\
    \n+   * Single Responsibility Principle (SRP)\n* Open Closed Principle (OCP)\n\
    * Liskov Substitution Principle (LSP)\n* Interface Segregation Principle (ISP)\n\
    * Dependency Inversion Principle (DIP)\n\nIn this chapter we're going to look\
    \ at all of them. These principles can help you write modular code that is easy\
    \ to maintain and expand. The principles are described by Robert C. Martin in\
    \ his 2006 book Agile Principles, Patterns, and Practices in C#.\n\n# # Single\
    \ Responsibility Principle, (SRP)\n\nThe Single Responsibility Principle, or SRP,\
    \ states that a class should be responsible for a single functionality. A functionality\
    \ can be considered a reason to change. For example, a class that logs errors\
    \ to a database can change because the database communication should change, or\
    \ because the format of the log output needs to change. So more generally, a class\
    \ should have only one reason to change. That's a little tricky; after all, each\
    \ line of code could be changed at one time or another. And indeed, I have met\
    \ programmers who believe a class should contain only a single method. That's\
    \ really what SRP is about!\n\nLet's look at a concrete example. Say you're building\
    \ a database module. Now you've got a class that can establish a connection to\
    \ the database, get send data, and finally close the connection. If we defined\
    \ an interface it could follows:\n\n> Code Listing 23: A Possible Violation of\
    \ SRP\n\n```\npublic interface Database {\n    void Connect(string connectionString);\n\
    \    void Close();\n    object GetData();\n    void SendData(object data);\n}\n\
    ```\n\n¹ R.C. Martin, M. Martin - Agile Principles, Patterns and Practices in\
    \ C#"
  - "[PAGE 26]\n\nSo this could really be the interface to your class, right? Unfortunately,\
