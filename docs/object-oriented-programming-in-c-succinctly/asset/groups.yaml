    \n另一个例子是列表的排序。根据列表的大小，你可能想要使用另一种排序算法，但你不想将每种算法硬编码在列表类中。\n\n所以，让我们来做一个小游戏。它是一个简单的控制台应用程序，我们将按下任何按钮来移动我们的单位，并可能导致遇到敌人（继续按键或按\
    \ Esc 键退出）。每个单位对遇到敌人的反应不同。因此，我们首先定义一个通用的 Unit 类。\n\n代码列表 68：策略模式\n\n```csharp\n\
