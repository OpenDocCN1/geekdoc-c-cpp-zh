    \ Web 会话。我将讨论其中一些广为人知且使用的模式。\n\nMartin Fowler 使用大量的 UML 序图。和 UML 类图一样，序图超出了本书的范围，但我会将它们添加进来供参考和视觉化解释。\n\
    \n## 懒加载\n\n![](img/a03594f8f44c9d45de3912512db3a264_66_0.png)\n\n图 16：懒加载模式的序图\n\
    \n懒加载模式的核心在你实际使用数据之前不获取数据。它有四种形式：懒初始化、虚拟代理、值持有者和幽灵。我们将只查看懒初始化，因为它是常见的，而且讨论所有形式会占用太多空间。我也想讨论这种，因为它变得越来越相关且被广泛使用。像\
    \ Haskell 等函数式语言对所有内容都有默认的懒加载策略。这种做法在 .NET 中也变得越来越常见。\n\n> ³ Martin Fowler - Patterns\
    \ of Enterprise Application Architecture\n\n我们在实现单例模式时实际上已经见过过懒加载模式了。单例实例在对象被实际使用之前才被创建。让我们再次看看这个（简单的）实现。\n\
    \n代码列表 80: 懒初始化\n\n```cs\npublic class SomeSingleton{\n    private static SomeSingleton\
    \ instance;\n\n    private SomeSingleton()\n    {\n    }\n    public static SomeSingleton\
    \ Instance {\n        get {\n            if (instance == null) {\n           \
    \     instance = new SomeSingleton();\n            }\n            return instance;\n\
    \        }\n    }\n}\n```\n\n如果你的代码中没有任何地方引用 `SomeSingleton.Instance`，那么 `SomeSingleton`\
    \ 将永远不会被初始化。这就是所谓的懒初始化。当一个对象的加载需要长时间，而你不想在真正需要时才执行代码时，这特别有用。\n\n.NET Framework\
    \ 有一个 `Lazy<T>` 类用于任何类的懒加载。假设我们有一个初始化需要五秒钟的类。\n\n代码列表 81: 沉重的初始化\n\n```cs\npublic\
    \ class Something{\n    public Something(){\n        // 模拟一些沉重计算。\n        Thread.Sleep(5000);\n\
    \    }\n\n    public void Print(){\n        Console.WriteLine(\"Something is used.\"\
    );\n    }\n}\n```\n\n通过使用 `Lazy<T>` 包装器，我们在使用它之前实际上并不需要创建实例。\n\n代码列表 82: Lazy<T>\
