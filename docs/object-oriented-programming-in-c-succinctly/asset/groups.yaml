    \ on.\n\nLast I'd like to mention packages. A package is a common name for a set\
    \ of code that is compiled together. In Microsoft land a package is often called\
    \ a DLL. In .NET a DLL is often known as an Assembly. In Visual Studio each project\
    \ is compiled into a DLL or an exe (executable) file."
  - "[PAGE 11]\n\n# Chapter 1 The Three Pillars of OOP\n\nObject-oriented programming\
    \ has three characteristics that define the paradigm, the so-called \"three pillars\
    \ of OOP.\" In this chapter, we'll look at each one of them in detail. They all\
    \ play an important role in the design of your applications. That's not to say\
    \ that your systems will have a great design by simply applying these concepts.\
    \ In fact, there is no single correct way of applying these concepts, and applying\
    \ them can be difficult.\n\n# Inheritance\n\nInheritance is an important part\
    \ of any object-oriented language. Classes can inherit from each other, which\
    \ means the inheriting class gets all of the behavior of the inherited class,\
    \ also known as the base class. Let's look at the Person example I used earlier.\n\
    \nCode Listing 3: Inheritance Example\n\n```\npublic class Person\n{\n    public\
    \ string FirstName { get; set; }\n    public string LastName { get; set; }\n \
    \   public string GetFullName()\n{\n        return FirstName + \" \" + LastName;\n\
    \    }\n}\npublic class Employee : Person\n{\n    public decimal Salary { get;\
    \ set; }\n}\n```\n\nThe trick is in the Employee : Person part. That part basically\
    \ says \"Employee inherits from Person.\" And remember everything inherits from\
    \ Object. In this case Employee inherits from Person and Person (because it's\
    \ not explicitly inheriting anything) from Object. Now let's look at how we use\
    \ Employee.\n\nCode Listing 4: Subclass usage\n\n```\nEmployee employee = new\
    \ Employee();\nemployee.FirstName = \"Sander\";\nemployee.LastName = \"Rossel\"\
    ;\nstring fullName = employee.GetFullName();\nemployee.Salary = 1000000; // I\
    \ wish :-)\n```\n\nThat's pretty awesome! We got everything from Person just by\
    \ inheriting from it! In this case we can call Person a base class or superclass\
    \ and Employee a subclass. Another common way of saying it is that Employee extends\
    \ Person."
- md: "\nThere's a lot more though! Let's say we'd like to write some common behavior\
    \ in some base class, but we'd like subclasses to be able to extend or override\
    \ that behavior. Let's say we'd like subclasses to change the behavior of GetFullName\
    \ in the previous example. We can do this using the virtual keyword in the base\
    \ class and override in the subclass.\n\n## Code Listing 5: Method overriding\n\
    \n```sharp\npublic class Person\n{\n    public string FirstName { get; set; }\n\
    \    public string LastName { get; set; }\n    public virtual string GetFullName()\n\
    \    {\n        return FirstName + \" \" + LastName;\n    }\n}\npublic class Employee\
    \ : Person\n{\n    public decimal Salary { get; set; }\n    public override string\
    \ GetFullName()\n    {\n        string originalvalue = base.GetFullName();\n \
    \       return LastName + \" \" + FirstName;\n    }\n}\n```\n\nAs you can see\
    \ we can override, or re-define, GetFullName because it was marked virtual in\
    \ the base class. We can then call the original method using the base keyword\
    \ (which points to the implementation of the base class) and work with that, or\
    \ we can return something completely different. Calling the original method is\
    \ optional, but keep in mind that some classes may break if you don't.\n\nNow\
    \ here's an interesting thing: the type is Employee, but it also has the type\
    \ Person. That means in any code where we need a Person we can actually use an\
    \ Employee. When we do this we can, of course, access Employee specific members,\
    \ such as Salary. So here's a little question: what will the following code print?\n\
    \n## Code Listing 6: What will the code print?\n\n```csharp\nperson = new Employee();\n\
    person.FirstName = \"Sander\";\nperson.LastName = \"Rossel\";\nstring fullName\
    \ = person.GetFullName();\nConsole.WriteLine(fullName);\n// Press any key to quit.\n\
    Console.ReadKey();\n```\n\nIf you answered \"Rossel\", Sander (rather than Sander\
    \ Rossel) you were right!\n\nWhat else can we do? We can force a subclass to inherit\
    \ certain members. When we do this we must mark a method, and with that entire\
    \ class, as abstract. An abstract class can't be instantiated and must be inherited\
    \ (with abstract members overridden).\n\n## Code Listing 7: An Abstract Class\n\
    \n```csharp\npublic abstract class Person {\n    public string FirstName { get;\
    \ set; }\n    public string LastName { get; set; }\n    public abstract string\
    \ GetFullName();\n}\n\npublic class Employee : Person {\n    public decimal Salary\
    \ { get; set; }\n    public override string GetFullName() {\n        return LastName\
    \ + \" \" + FirstName;\n    }\n}\n```\n\nOf course we can't make a call to base.GetFullName()\
    \ anymore, as it has no implementation. While overriding GetFullName was optional\
    \ before, it is mandatory now. Other than that the usage of Employee stays exactly\
    \ the same.\n\nOn the other end of the spectrum, we can explicitly state that\
    \ a class or method may not be inherited or overridden. We can do this using the\
    \ sealed keyword.\n\n## Code Listing 8: A Sealed Class\n\n```csharp\npublic sealed\
    \ class Person {\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n    public string GetFullName() {\n        return FirstName\
    \ + \" \" + LastName;\n    }\n}\n```\n\nNow that Person is sealed no one can inherit\
    \ from it. It means we can't create an Employee class and use Person as a base\
    \ class.\n\nMethods can be sealed in subclasses. After all, if you don't want\
    \ people to override your method, simply don't mark it virtual. However, if you\
    \ have a virtual method and a subclass wants to prevent further overriding it's\
    \ possible to mark it as sealed.\n\n## Code Listing 9: A sealed method\n\n```csharp\n\
    public class Person {\n    public string FirstName { get; set; }\n    public string\
    \ LastName { get; set; }\n    public virtual string GetFullName() {\n        return\
    \ FirstName + \" \" + LastName;\n    }\n}\n```\n\n```csharp\npublic class Employee\
    \ : Person\n{\n    public decimal Salary { get; set; }\n    public sealed override\
    \ string GetFullName()\n    {\n        return LastName + \", \" + FirstName;\n\
    \    }\n}\n```\n\nNo subclass of Employee can override GetFullName.\n\nWhy would\
    \ you use sealed on your classes or methods? First, there is a small performance\
    \ gain because the .NET runtime doesn't have to take over overridden methods into\
    \ account. The gain is negligible, so that's not really a good reason. A better\
    \ reason is perhaps a class implements some security checks that really shouldn't\
    \ be extended in any way.\n\n> Note: Some languages, like C++, know multiple inheritance.\
    \ That means a subclass can inherit from more than one base class. In C# this\
    \ is not possible; each subclass can inherit from, at most, one base class.\n\n\
    ## Inheritance vs. Composition\n\nWhile inheritance is very important in OOP,\
    \ it can be a real pain, especially when you get huge inheritance trees with branches\
    \ to all sides. There is an alternative to inheritance: composition. Inheritance\
    \ implies an \"is-a\" relationship between classes. An Employee is a Person. Using\
    \ composition, we can define a \"has-a\" relationship.\n\nLet's take a car. A\
    \ car is built up from many components, like an engine. When we model a car we\
    \ inherit Car from Engine? That would be problematic, because a car also has doors,\
    \ chairs and a backseat.\n\n## Code Listing 10: No Go\n\n```csharp\npublic class\
    \ Engine\n{\n    // ...\n}\npublic class Car : Engine\n{\n    // ...\n}\n```\n\
    \nHow would this look when using?\n\n## Code Listing 11: Composition\n\n```csharp\n\
    public class Engine\n{\n    // ...\n}\n```\n\n```csharp\npublic class Car {\n\
    \    private Engine engine = new Engine();\n    // ...\n}\n```\n\n## Encapsulation\n\
    \nEncapsulation is the process of hiding the internal workings of our classes.\
    \ That means we specify a public interface, while the actual work is hidden away.\
    \ The advantage is that a class can change how it works without needing to change\
    \ its consumers. In C# we have access modifiers which enable:\n\n- private: only\
    \ visible to the containing class.\n- protected: only visible to the containing\
    \ class and inheritors.\n- internal: only visible to the same assembly.\n- protected\
    \ internal: only visible to the same assembly or derived classes.\n- public: visible\
    \ to everyone.\n\nLet's say we're building some class that runs queries on a database.\
    \ Obviously we need some method visible to consumers of our class. The method\
    \ for accessing the database could be different for every database, so perhaps\
    \ we're leaving open for inheritors. Last, we need to store some private state,\
    \ which may not be altered from outside our class as it could leave it in an invalid\
    \ state.\n\n## Code Listing 12: Access Modifiers\n\n```csharp\npublic class QueryRunner\
    \ {\n    private IDbConnection connection;\n\n    public void RunQuery(string\
    \ query) {\n        Helper helper = new Helper();\n        if (helper.Validate(query))\
    \ {\n            OpenConnection();\n            // Run the query...\n        \
    \    CloseConnection();\n        }\n    }\n\n    protected void OpenConnection()\
    \ {\n        // ...\n    }\n\n    protected void CloseConnection() {\n       \
    \ // ...\n    }\n}\n\ninternal class Helper {\n    internal bool Validate(string\
    \ query) {\n        // ...\n        return true;\n    }\n}\n```\n"
  mdcn: "\n不过还有很多内容！假设我们想在某个基类中编写一些通用行为，但希望子类能够扩展或重写这些行为。假设我们希望子类更改上一个示例中 `GetFullName`\
    \ 的行为。我们可以在基类中使用 `virtual` 关键字，并在子类中使用 `override` 关键字来实现这一点。\n\n## 代码列表 5：方法重写\n\
