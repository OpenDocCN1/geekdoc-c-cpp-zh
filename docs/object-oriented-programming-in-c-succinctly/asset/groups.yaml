    \nFigure 10: Class Diagram of the Adapter Pattern\n\nAn easy and well known Structural\
    \ Pattern is the Adapter Pattern, or Wrapper. With the Adapter Pattern, we can\
    \ make two classes work together even though they have incompatible interfaces.\
    \ Suppose we're creating a data retrieval system, but the client hasn't decided\
    \ on Oracle or SQL Server, or they might switch in the future. And let's say both\
    \ databases come with some API's with different classes and methods (of course,\
    \ both already have compatible .NET API's). The following code is simplified,\
    \ but does show the use of the Adapter:\n\nCode Listing 50: External database\
    \ API's\n\n```\npublic class SqlServerApi\n{\n    public DataTable GetData()\n\
    \    {\n        return new DataTable();\n    }\n\n    public void SendData(DataTable\
    \ data)\n    {\n        // ...\n    }\n}\n\npublic class OracleApi\n{\n    public\
    \ object GetQuery()\n    {\n        return new object();\n    }\n\n    public\
    \ void ExecQuery(object data)\n    {\n        // ...\n    }\n}\n```"
  - "[PAGE 46]\n\nThe problem here is that if we choose one API, we can't easily replace\
    \ it with the other.\nSqlServerApi works with DataTables while Oracle works with\
