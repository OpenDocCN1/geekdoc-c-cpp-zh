    \ ORMs) are capable of joining, aggregating, what you have. Some SQL code will\
    \ be generated and if you don't know what you're doing it will be ugly and slow.\
    \ Sometimes it's just a lot quicker to write some SQL and do with it!\n\n# The\
    \ Takeaway\n\nThere are many patterns. Some patterns can be generally applied\
    \ in any (object-oriented) language, while others are language specific. Some\
    \ patterns are even specific to a certain programming paradigm. For example, JavaScript,\
    \ which has no modifiers, has Design Patterns like Module, to be able to hide\
    \ internal objects. When you're building a multi-threaded application, you might\
    \ want to use patterns specifically designed for multi-threaded code. While it's\
    \ true that Design Patterns do not guarantee beautiful software, and may even\
    \ lead to overly complex software, it's also important that you know the tools\
