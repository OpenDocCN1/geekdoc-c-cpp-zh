- md: "\n# Code Listing 21: Explicitly Implemented Interface\n\n```cs\npublic interface\
    \ ISomeInterface\n{\n    void MethodA();\n    void MethodB();\n}\npublic class\
    \ SomeClass : ISomeInterface\n{\n    public void MethodA() {\n        // Even\
    \ SomeClass cannot invoke MethodB without a cast.\n        ISomeInterface me =\
    \ (ISomeInterface)this;\n        me.MethodB();\n    }\n    // Explicitly implemented\
    \ interface member.\n    // Not visible in SomeClass.\n    void ISomeInterface.MethodB()\
    \ {\n        throw new NotImplementedException();\n    }\n}\n```\n\nUsers of SomeClass\
    \ cannot invoke MethodB either.\n\n```cs\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        SomeClass o = new SomeClass();\n        o.MethodA();\n\
    \        o.M\n    }\n}\n```\n\n| | |\n|---|---|\n| Equals | |\n| GetHashCode |\
    \ |\n| GetType | |\n| MethodA | void SomeClass.MethodA() |\n| ToString | |\n\n\
    Figure 1: MethodB is not accessible.\n\nUnless they use it, or cast it to, ISomeInterface.\n\
    \n# Code Listing 22: Invoking an Explicitly Implemented Member\n\n```cs\nISomeInterface\
    \ obj = new SomeClass();\nobj.MethodA();\nobj.MethodB();\n```\n\n# Inheritance\
    \ vs. Interface\n\nOne discussion you will find frequently online, or might get\
    \ engaged in at work, is that of inheritance vs. using an interface. Remember\
    \ that you can only inherit from one class. That means if you use inheritance,\
    \ like Person -> Employee, your Employee is stuck with the Person base class.\
    \ Alternatively, you could define an IPerson and implement it separately in Person\
    \ and Employee. One guideline you'll see is that inheritance defines an \"is-a\"\
    \ relationship (an Employee is a Person) while interface defines a \"can do\"\
    \ or \"has-a\" relationship (a Person has a stamp collection). As you see, it's\
    \ not entirely proof, as a stamp collector is also a Person, but still inheritance\
    \ can lead us into trouble.\n\nI like to use when I have some functionality that\
    \ is shared across multiple, if not all, subtypes of that class, like with the\
    \ Dblogger example.\n\nAnd remember, composition may also be a viable option!\n\
    \n# The Takeaway\n\nAn interface is a means to create additional types without\
    \ the need for multiple inheritance. They are extremely useful, I've talked to\
    \ people say every class needs a matching interface. It's an important feature\
    \ that Visual Studio has the option to create an interface based on a class. When\
    \ your cursor is in a class, you can find it under Edit -> Refactor -> Extract\
    \ Interface in the top menu.\n\n```cs\npublic class SomeClass {\n    public void\
    \ MethodA()\n    { }\n    public void MethodB()\n    { }\n    private void Something()\n\
    \    {}\n}\n```\n\n![](img/a03594f8f44c9d45de3912512db3a264_24_0.png)\n\nLearn\
    \ to use them well, as we'll use them a lot throughout this book.\n\n# Chapter\
    \ 3 SOLID\n\nWe've seen the building blocks that make up an object-oriented language,\
    \ but how can we write our classes so that they make sense? When to inherit, what\
    \ to put inside a class, how many interfaces do we need? These are questions that\
    \ can be answered in part by the so-called SOLID principles. SOLID is an acronym\
    \ and each letter stands for a principle.\n\n- Single Responsibility Principle\
    \ (SRP)\n- Open Closed Principle (OCP)\n- Liskov Substitution Principle (LSP)\n\
    - Interface Segregation Principle (ISP)\n- Dependency Inversion Principle (DIP)\n\
    \nIn this chapter we're going to look at all of them. These principles can help\
    \ you write modular code that is easy to maintain and expand. The principles are\
    \ described by Robert C. Martin in his book Agile Principles, Patterns, and C#.\n\
    \n# Single Responsibility Principle (SRP)\n\nThe Single Responsibility Principle,\
    \ or SRP, states that a class should be responsible for a single functionality.\
    \ A functionality can change to change. For example, a class that logs to a database\
    \ can change because the database communication or because the format needs to\
    \ change. So generally, a class should have only one reason to change. That's\
    \ a bit tricky; after all, each line of code could change at one time or another.\
    \ And I have met programmers who believe a class should contain only a single\
    \ method. That is really what SRP is about!\n\nLet's look at a concrete example.\
    \ Say you're building a database. Now you've got a class that can establish a\
    \ connection, get data, and finally close the connection. If we defined an interface\
    \ it follows:\n\n# Code Listing 23: A Violation of SRP\n\n```cs\npublic interface\
    \ Database {\n    void Connect(string connectionString);\n    void Close();\n\
    \    object GetData();\n    void SendData(object data);\n}\n```\n\nSo this could\
    \ really be the interface to your class? Unfortunately, this class is doing two\
    \ things. The class deals with opening connections and data communication. Here\
    \ comes the tricky part, the question you ask yourself is: will the application\
    \ change in a way that affects connections or data or both? This is important\
    \ because when the time comes and you need to change one of the functionalities,\
    \ the functionality that doesn't need to change will be. When applying SRP, your\
    \ classes will be smaller and more maintainable, but you'll have more classes\
    \ to deal with. Would you rather change a class with 200 lines of code that does\
    \ multiple things, or a class with 100 lines of code that does only one? As you\
    \ see, there is no wrong in SRP. If you feel a class is bloated, then identifying\
    \ different responsibilities gives each their own class.\n\n# Open Closed Principle\
    \ (OCP)\n\nWithout a doubt, one of the hardest to grasp and get right is the Open\
    \ Closed Principle, or OCP: \"Open Closed\" means that a class should be open\
    \ for extension, but closed for modification. That means consumers of your class\
    \ should be able to customize its usage without actually changing its code.\n\n\
    Let's say you have that database we talked about. In a sense it's already extensible\
    \ since everyone can inherit from it and add methods and properties. Doing so\
    \ will almost certainly result in breaking SRP though since the core functionality\
    \ of the class is already defined in the base class and we can't change that.\
    \ You could make every method in the base class virtual, and yet we've seen that's\
    \ not really practice as consumers break your class. For example, if they override\
    \ Connect and just leave it, no connection will be made and each subsequent method\
    \ call to your class will fail. Besides, even if the method is overridden the\
    \ base class will be sitting there just doing, which doesn't feel right.\n\nI\
    \ propose a different solution, one of many. Let's break up the previously proposed\
    \ interface into two separate interfaces. You'll probably need some more methods\
    \ now, but let's stick to simplicity for now.\n\n# Code Listing 24: SRP for OCP\n\
    \n```cs\npublic interface IConnectionManager {\n    void Connect(string connectionString);\n\
    \    void Close();\n}\n\npublic interface IDataManager {\n    object GetData(IConnectionManager\
    \ connManager);\n    void SendData(IConnectionManager connManager, object data);\n\
    }\n```\n\nNow suppose I'd like to change the way I connect to the database. I\
    \ can implement my own IConnectionManager and pass it to my IDataManager. Without\
    \ touching the original code, I am now able to extend the functionality of the\
    \ classes without actually breaking the existing class! Likewise, if I'd like\
    \ to change the way I'm getting or sending data I can simply implement my own\
    \ IDataManager and use it with the already existing implementation of IConnectionManager.\n\
    \nIt gets better, every class that depends on IConnectionManager and/or IDataManager\
    \ is now extendable in that it can use any database you can ever imagine! Well,\
    \ theoretically.\n\nLater we'll look at Design Patterns, which can help you in\
    \ designing classes that conform to OCP.\n\n# Liskov Substitution Principle (LSP)\n\
    \nThe Liskov Substitution Principle, LSP for short, is about inheritance. It states\
    \ that subclasses and base classes must be substitutable. That means that any\
    \ method of any base type must not know if it's using a base class or any subclass.\
    \ Here's an example of what you wouldn't do (although I've written code just like\
    \ this in the past):\n\n# Code Listing 25: Violation of LSP\n\n```cs\nbool TestConnection(IConnectionManager\
    \ connMgr)\n{\n    if (connMgr is SQLConnectionManager)\n    {\n        // Do\
    \ something...\n    }\n    else if (connMgr is OracleConnectionManager)\n    {\n\
    \        // Do something else...\n    }\n    else\n    {\n        // ...\n   \
    \ }\n}\n```\n\nTestConnection is a function that receives an object of type IConnectionManager,\
    \ which could be any connection manager. In this case, the method checks for the\
    \ type of connMgr and acts accordingly. That means for every new implementation\
    \ of IConnectionManager, you need to change this method. Furthermore, you've just\
    \ violated OCP as this function is now unable to test new connection types. There's\
    \ plenty of ways to fix this, like using a Strategy Pattern, but we'll get to\
    \ that in a later chapter. In the above method it should always be good enough\
    \ to invoke the Connect() or Close() method, no matter what IConnectionManager\
    \ you get.\n"
