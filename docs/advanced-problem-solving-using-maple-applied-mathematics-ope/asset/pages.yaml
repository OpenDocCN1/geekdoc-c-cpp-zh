  md: '+   - if \(f''''(x_c) < 0\) (concave down), \(f\) has a local maximum at \(x_c\).

    +   - if \(f''''(x_c) = 0\), \(f\) has a possible inflection point (change of
    concavity) at \(x_c\).


    **Theorem. Extended Derivative Test.**

    Let \(f''(x_c) = f''''(x_c) = 0\) for some \(x_c \in (a,b)\). Then


    +   - if the first non-zero derivative is even-order (i.e., 4th, 6th, 8th, etc.)
    and

    +     - is positive at \(x_c\), then \(f\) has a local minimum at \(x_c\),

    +     - is negative at \(x_c\), then \(f\) has a local maximum at \(x_c\),

    +   - if the first non-zero derivative is odd-order (i.e., 3rd, 5th, 7th, etc.),
    then \(f\) does not have an extrema at \(x_c\).


    **Theorem. First Derivative Test.**

    Let \(f''(x_c) = 0\) for some \(x_c \in (a,b)\). Then


    +   - if \(f''(x) > 0\) (increasing) below \(x_c\) and \(f''(x) < 0\) (decreasing)
    above \(x_c\), then \(f\) has a local maximum at \(x_c\),

    +   - if \(f''(x) < 0\) (decreasing) below \(x_c\) and \(f''(x) > 0\) (increasing)
    above \(x_c\), then \(f\) has a local minimum at \(x_c\),

    +   - if \(f''(x)\) does not change sign around \(x_c\), then \(f(x_c)\) is neither
    a local maximum nor a local minimum.


    **Theorem. Nondifferentiable Point Test.**

    Suppose \(f''(x_c)\) does not exist. In this case, test points near \(x_c\): evaluate
    \(f\) at ‘nearby’ \(x_1\) and \(x_2\) where \(x_1 < x_c < x_2\). See Table 3.1.


    TABLE 3.1: Testing a Nondifferentiable Point


    | Relation | Classification |

    |---|---|

    | \(f(x_1) \leq f(x_c)\) and \(f(x_c) \leq f(x_2)\) | then \(x_c\) is not a local
    extrema |

    | \(f(x_1) \geq f(x_c)\) and \(f(x_c) \leq f(x_2)\) | then \(x_c\) is a local
    minimum |

    | \(f(x_1) \leq f(x_c)\) and \(f(x_c) \geq f(x_2)\) | then \(x_c\) is a local
    maximum |

    | \(f(x_1) \geq f(x_c)\) and \(f(x_c) \geq f(x_2)\) | then \(x_c\) is not a local
    extrema |


    **Theorem. Interval Endpoints Test.**

    Suppose that \(f\) is differentiable on \((a,b)\) and has right and left derivatives
    at \(x=a\) and \(b\), respectively. Then, for \(x=a\),


    +   - if \(f''(a) > 0\), \(f(a)\) is a local minimum.

    +   - if \(f''(a) < 0\), \(f(a)\) is a local maximum.'
