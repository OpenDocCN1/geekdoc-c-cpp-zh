  md: "5. Dr. E. N. Throat has been taking X-rays of the trachea contracting during\
    \ coughing. He has found that the trachea appears to contract by 33% (1/3) of\
    \ its normal size. He has asked the Department of Mathematics to confirm or deny\
    \ his claim. You perform some initial research and find that under reasonable\
    \ assumptions about the elasticity of the tracheal wall and about how air near\
    \ the wall is slowed by friction, the average flow of velocity $v$ can be modeled\
    \ by the equation\n\n$$v=c(r_0-r)^2 \\text{ cm/sec}\\quad \\text{for } \\frac{1}{2}r_0\\\
    le r\\le r_0$$\n\nwhere $c$ is a positive constant (let $c=1$) and $r_0$ is the\
    \ resting radius of the trachea in centimeters.\n\n+   (a) Find the value of $r$\
    \ that maximizes $v$.\n+   \n+   (b) Does your result support or deny Dr. Throat’s\
    \ claim.\n\n# 3.2  Numerical Search Techniques with Maple\n\n# Single-Variable\
    \ Techniques\n\nWhen calculus methods aren’t feasible, we turn to numerical approximation\
    \ techniques. The basic approach of most numerical methods in optimization is\
    \ to produce a sequence of improved approximations to the optimal solution according\
    \ to a specific scheme. We will examine both elimination methods (Golden section,\
    \ and Fibonacci) and interpolation methods (Newton’s).\n\nIn numerical methods\
    \ of optimization, a procedure is used in obtaining values of the objective function\
    \ at various combinations of the decision variables, and conclusions are then\
    \ drawn regarding the optimal solution. The elimination methods can be used to\
    \ find an optimal solution for even discontinuous functions. An important relationship\
    \ (assumption) must be made to use these elimination methods. The function must\
    \ be *unimodal*. A unimodal function—*uni-modal* from “one mode”—is one that has\
    \ only one maximum (peak) or one minimum (valley), but not both. State this mathematically\
    \ as\n\n**Definition. Unimodal Function.**\nA function is *unimodal* on the interval\
    \ $[a,b]$ iff\n\n+   1. $f$ has a maximum (minimum) $x^*$ in $[a,b]$, and\n+ \
    \  \n+   2. is strictly increasing (decreasing) on $[a,x^*]$, i.e., $x<x^*\\Rightarrow\
    \ f(x)<f(x^*)$, and\n+   \n+   3. is strictly decreasing (increasing) on $[x^*,b]$,\
    \ i.e., $x>x^*\\Rightarrow f(x)<f(x^*)$."
