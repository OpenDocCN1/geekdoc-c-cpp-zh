    # Interpolation with Derivatives: Newton’s Method


    # Finding the Critical Points (Roots of the Derivative of a Function)


    Newton’s Method can be adapted to solve nonlinear optimization problems. For a
    twice differentiable function of one variable, the adaptation is straightforward.
    Newton’s Method is applied to the derivative, rather than the original function
    we wish to optimize—the function’s critical points occur at roots of the derivative.
    Replace $f$ with $f''$ in the iterating formula for Newton’s Method:


    $$N(x)=x-\frac{f(x)}{f''(x)} \quad\Rightarrow\quad M(x)=x-\frac{f''(x)}{f''''(x)}$$


    Given a specified convergence $\varepsilon>0$, the iterations of Newton’s Method
    can be terminated when $|x_{k+1}-x_k|\leq\varepsilon$ or when $|f''(x_k)|<\varepsilon$.


    In order to use the modified Newton’s Method to find critical points, the function’s
    first and second derivatives must exist throughout the neighborhood of interest.
    Also note that whenever the second derivative at $x_k$ is zero, the'
