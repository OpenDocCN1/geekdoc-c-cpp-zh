  md: 'Define the variables


    t_i = value of a single unit of output of DMU_i

    w_j = cost or weights for one unit of inputs to DMU_i

    X = matrix of input data

    Y = matrix of output data

    DMU_i = objective function for DMU_i''s linear program

    Eff_i = relative efficiency of DMU_i, with a vector of weights


    all for i = 1, 2, and 3.


    Assume that


    +   - No DMU can have an efficiency of more than 100%.

    +   - If any efficiency is less than 100%, then that DMU is inefficient.

    +   - The costs are scaled so that the costs of the inputs equals 1 for each linear
    program. For example, use 5w1 + 14w2 = 1 in the LP for DMU1.

    +   - All values and weights must be strictly positive. (We may have to use a
    constant such as 0.0001 in lieu of 0 in inequalities to help numeric routines
    converge.)


    To calculate the efficiency of DMU1, use the linear program


    Maximize DMU1 = 9t1 + 4t2 + 16t3

    subject to

    -9t1 - 4t2 - 16t3 + 5w1 + 14w2 ≥ 0,

    -5t1 - 7t2 - 10t3 + 8w1 + 15w2 ≥ 0,

    -4t1 - 9t2 - 13t3 + 7w1 + 12w2 ≥ 0,

    5w1 + 14w2 = 1,

    t_i, w_j ≥ 0   for all i, j.


    To calculate the efficiency of DMU2, use the linear program


    Maximize DMU2 = 5t1 + 7t2 + 10t3

    subject to

    -9t1 - 4t2 - 16t3 + 5w1 + 14w2 ≥ 0,

    -5t1 - 7t2 - 10t3 + 8w1 + 15w2 ≥ 0,

    -4t1 - 9t2 - 13t3 + 7w1 + 12w2 ≥ 0,

    8w1 + 15w2 = 1,

    t_i, w_j ≥ 0   for all i, j.'
