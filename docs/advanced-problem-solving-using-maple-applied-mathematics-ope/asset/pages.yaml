    FIGURE 6.2: Philippines: Literacy v. Significant Acts of Violence, 2008


    Within all the data, Figure 6.2 represents one of the “best” resulting overall
    models—noting that R² is only 0.14 which represents a really poor linear fit or
    a very weak linear relationship. We will return to this scenario again later in
    the chapter, but suffice it to say, linear regression is not useful to explain,
    predict, or answer the questions the Philippine government had posed.


    # 6.3  Linear, Nonlinear, and Multiple Regression


    Many applications are not linear. For example, a pendulum is modeled by the differential
    equation θ'''' + ω² sin(θ) = 0; this equation can be “linearized” by replacing
    sin(θ) with θ, a good linear approximation for small values of θ. Two widely used
    rules of thumb for relating correlation to the likelihood of a linear relationship
    come from Devore [D2012] for math, science, and engineering data, shown in Table
    6.1, and a more liberal interpretation from Johnson [J2012] for non-math, non-science,
    and non-engineering data, given in Table 6.2.'
