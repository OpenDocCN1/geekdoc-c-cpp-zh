  md: '![](img/0f04050177d82aebd17d3383d7334896_54_0.png)


    FIGURE 2.3: Tower of Hanoi Flow Diagram


    There is a formula for the number of moves required to move $n$ disks from the
    first peg to the third peg. We will consider methods of solving this recursion
    relation to find this formula. The first method is iteration. Later we will learn
    a better method by explicitly solving the D/Ds.


    Let’s build Table 2.1 by iterating the recursion relation


    $$a(n+1)=2a(n)+1$$

    $$a(1)=1.$$


    TABLE 2.1: Tower of Hanoi Recursion


    | Number of Disks | Recursion Relationship | Number of Moves |

    |---|---|---:|

    | 1 | $a(1)=1$ | 1 |

    | 2 | $a(2)=2a(1)+1=2(1)+1$ | 3 |

    | 3 | $a(3)=2a(2)+1=2(3)+1$ | 7 |

    | 4 | $a(4)=2a(3)+1=2(7)+1$ | 15 |

    | 5 | $a(5)=2a(4)+1=2(15)+1$ | 31 |

    | 6 | $a(6)=2a(5)+1=2(31)+1$ | 63 |

    | 7 | $a(7)=2a(6)+1=2(63)+1$ | 127 |

    | ⋮ | ⋮ | ⋮ |

    | $n$ | $a(n)=2a(n-1)+1$ | $2a(n-1)+1$ |


    Using iteration, we repeatedly calculate the recursion relation, each time for
    the next value of $n$. To find out how many minutes it would take to move sixty-four
    disks, we would have to iterate the given recursion relation 64 times. We’ll use
    Maple to help us with the computations for tabulating Table 2.2.'
  merge: -1
  img_proc: true
