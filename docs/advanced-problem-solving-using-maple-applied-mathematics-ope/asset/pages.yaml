- pgno: 281
  md: "Estimates of the $b_i$ are the final values from the numerical search method\
    \ (if it converged) used to maximize the log-likelihood function $\\ln L$ of (6.4).\
    \ The values of $se(b_i)$, the standard error estimate for $b_i$, are the square\
    \ roots of the main diagonal of the variance-covariance matrix $VC = -H(X'B^{-1}B)^{-1}B^{-1}$.\
    \ The values of $t_i^* = b_i/se(b_i)$ and the $p$-value, the probability $P(T\
    \ > |t_i^*|)$. In the summary table of Poisson regression analysis below, let\
    \ $m$ be the number of variables in the model, and let $k$ be the number of data\
    \ elements of $y$, the dependent variable. A summary appears in Table 6.10.\n\n\
    **TABLE 6.10: Poisson Regression Variables Summary**\n\n|  | Degrees of Freedom\
    \ ($df$) | Deviance | Mean Deviance ($MDev$) | Ratio |\n|---|---:|---|---|---|\n\
    | Regression | $m$ | $D_{reg}=D_t-D_{res}$ | $MDev(reg)=D_{reg}/m$ | $|MDev(reg)|$\
    \ |\n| Residual | $k-1-m$ | $D_{res}=$ result from the full model with $m$ predictors\
    \ | $MDev(res)=D_{res}/(k-1-m)$ |  |\n| Total | $k-1$ | $D_t=$ result from reduced\
    \ model $y=e^{b_0}$ | $MDev(t)=D_{reg}/(k-1)$ |  |\n\nNote that a prerequisite\
    \ for using Poisson regression is that the dependent variable $Y$ must be discrete\
    \ counts with large numbers being a rare event. We have chosen two data sets that\
    \ have published solutions to be our basic examples. First, an outline of the\
    \ procedure:\n\n+   **Step 0.** Enter the data for $X$ and $Y$.\n+   \n+   **Step\
    \ 1.** For $Y$:\n+   \n+   (a) generate a histogram, and  \n+   (b) perform a\
    \ chi-squared goodness-of-fit test for a Poisson distribution.¹\n+   \n+   If\
    \ $Y$ follows a Poisson distribution, then continue. If $Y$ is “count data,” use\
    \ Poisson regression regardless of the chi-squared test.\n+   \n+   **Step 2.**\
    \ Compute the value of $b_0$ in the constant model $y=\\exp(b_0)$ that minimizes\
    \ (6.5); i.e., minimize two times the deviations."
  merge: -1
  img_proc: true
