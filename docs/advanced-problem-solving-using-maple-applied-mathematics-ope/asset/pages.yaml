- pgno: 259
  md: "# A ridiculous value!\n\nCare must be taken with the selection of the initial\
    \ values for the unknown parameters (see, e.g., Fox [Fox2012]). Maple yields good\
    \ models when the calculations are based upon good input parameters. How can we\
    \ get reasonable approximations to a0 and a1? Let’s use a standard technique:\
    \ transform the model to make it linear. Apply logs to our model.\n\ny = a0 e^{a1\
    \ x}\nln(y) = ln(a0 e^{a1 x})\n= ln(a0) + a1 x\n\nRelabel ln(y) = Y and ln(a0)\
    \ = A0 to obtain\nY = A0 + a1 x\n\nNow use Maple to fit the transformed model.\n\
    \n```\n> LinearFit(A0 + a1·x, t, ln~(y), x);\n4.03715886613379 - 0.0379741808112946·x\n\
    ```\n\nGood estimates to use for the parameters are\n a0 = e^{A0} = 56.667 and\
    \ a1 = -0.03797.\n\n```\n> NonlinearFit(a0·exp(a1·x), t, y, x,\ninitialvalues\
    \ = [a0 = 56.667, a1 = -0.03797]);\nNEDF := unapply(evalf(%,5), x);\nNEDF(100);\n\
    NEDF := x ↦ 58.607 e^{-0.039586 x}\n1.118797159\n```\n\nThis prediction is much\
    \ closer to what we expect. A common technique used to test the result is to recompute\
    \ the model with different, but close, initial values. Try it!\n\nNote how close\
    \ the nonlinear-fitted parameter values are to the estimates. The difference comes\
    \ from where least squares is applied in the computation: to the logs of data\
    \ points, rather than to the points. Write the general least squares formulas\
    \ for the model and the transformed model to see the difference. Also, compare\
    \ the model from Maple’s ExponentialFit to the one we have found.\n\nFor a nonlinear\
    \ model, linear correlation and R² have no meaning. Computing the sum of squared\
    \ error gives SSE = 45.495. This value is substantially smaller than SSE = 451.1945\
    \ obtained by the linear model. The nonlinear model appears reasonable. Now check\
    \ the nonlinear model’s residual plot for patterns.\n\n```\n> EDResidualPts :=\
    \ [seq([ti, yi - NEDF(ti)], i = 1..15)]:\n```"
