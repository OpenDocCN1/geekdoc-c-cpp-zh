- pgno: 252
  md: 'and do not mention linearity. Definitions like the one from the help menu of
    a popular spreadsheet


    **CORREL:** Returns the correlation coefficient of the Array1 and Array2 cell
    ranges. Use the correlation coefficient to determine the relationship between
    two properties. For example, you can examine the relationship between a location’s
    average temperature and the use of air conditioners.


    help fuel misconceptions.


    It is no wonder decision makers have misinterpretations, thinking that correlation
    completely measures the relationship between variables. The most common misunderstandings
    that decision makers have expressed include:


    +   - Correlation implies causation.

    +   - Correlation measures everything.

    +   - When the correlation value is large and it looks linear (visually), then
    the relation must be linear.

    +   - Model diagnostics are not needed when the correlation value is large.

    +   - The regression package that was taught in class is what must be used.


    The next section begins with examples that illustrate some of the misconceptions
    surrounding correlation and shows possible corrections that we use in our mathematical
    modeling courses. One diagnostic test that we now cover is the “common-sense test”—does
    the model answer the question and does it provide *realistic results*?


    # 6.2  Modeling, Correlation, and Regression


    Return to the Philippines scenario introduced at the beginning of the chapter.
    The researcher actually began with linear regression. For example, in 2008, an
    analysis of the literacy index per region versus the number of significant acts
    of violence (by terrorists or insurgents) produced the linear model


    $$f(x)=-1.5463x+146.54$$


    with correlation coefficient −0.3742 or $R^2=0.14$ ($R^2$ is the square of the
    correlation coefficient). The model is plotted in *Figure 6.2*.'
