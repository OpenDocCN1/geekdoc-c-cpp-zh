  md: "Therefore, the necessary conditions are\n\n$\\partial L/\\partial x \\Rightarrow\
    \ 2(x-14)+2\\lambda_1(x-11)+2\\lambda_2x=0$  \n$\\partial L/\\partial y \\Rightarrow\
    \ 2(y-11)+2\\lambda_1(y-13)+2\\lambda_2y=0$  \n$\\partial L/\\partial \\lambda_1\
    \ \\Rightarrow (x-11)^2+(y-13)^2+\\mu_1^2-49=0$  \n$\\partial L/\\partial \\lambda_2\
    \ \\Rightarrow x+y+\\mu_2^2-19=0$  \n$\\partial L/\\partial \\mu_1 \\Rightarrow\
    \ 2\\lambda_1\\mu_1=0$  \n$\\partial L/\\partial \\mu_2 \\Rightarrow 2\\lambda_2\\\
    mu_2=0$\n\nDefine the functions in Maple, then investigate the cases for $\\lambda_i$\
    \ and $\\mu_i$ being zero or nonzero. We’ll use decimals for the constants to\
    \ force floating-point arithmetic to simplify the calculations. Remember to load\
    \ the *Student[MultivariateCalculus]* package to make the *Gradient* function\
    \ available.\n\n```\ng := (x, y) → (x − 14)^2 + (y − 11)^2:\ng₁ := (x, y) → (x\
    \ − 11)^2 + (y − 13)^2:\ng₂ := (x, y) → x + y:\nL := (x, y, λ₁, λ₂, μ₁, μ₂) →\
    \ f(x, y) + λ₁ · (g₁(x, y) + μ₁² − 49.0) + λ₂ · (g₂(x, y) + μ₂² − 19.0):\ngrad\
    \ := Gradient(L(x, y, λ₁, λ₂, μ₁, μ₂), [x, y, λ₁, λ₂, μ₁, μ₂]):\nNecessaryConditions\
    \ := [seq(G = 0, G in grad)]:\n```\n\nIn each of the cases, we will solve for\
    \ variables $\\mu_i$ rather than $\\mu_i$ to reduce complexity. We’ll also use\
    \ *RealDomain:-solve* to avoid complex solutions. Defining the list of variables\
    \ as *vars* reduces typing and simplifies the command structure making it more\
    \ readable.\n\n```\nvars := [x, y, λ₁, λ₂, μ₁², μ₂²]:\n```\n\nCASE 1.  λ₁ = 0\
    \ and λ₂ = 0. Then μ₁² ≠ 0 and μ₂² ≠ 0.\n\n```\nCase1 := λ₁ = 0, λ₂ = 0:\nsubs(Case1,\
    \ NecessaryConditions):\ns1 := RealDomain:-solve(%, vars):\nMatrix(subs(Case1,\
    \ s1));\n[2x − 28 = 0, 2y − 22 = 0, (x − 11)^2 + (y − 13)^2 + μ₁² − 49.0 = 0,\n\
    x + y + μ₂² − 19.0 = 0, μ₁ = 0, μ₂ = 0]\n[x = 14, y = 11, 0 = 0, 0 = 0, μ₁² =\
    \ 36, μ₂² = −6.]\n```\n\nThis case is infeasible since $\\mu_2^2=-6$ which indicates\
    \ that Condition 2, $g_2(x,y)\\leq 19$, is violated. It would have been easy to\
    \ solve this necessary conditions system by hand. The first two necessary conditions\
    \ give $x=14$ and $y=11$ directly, then substituting the values for $x$ and $y$\
    \ in the two constraints easily gives $\\mu_1^2=36$ and $\\mu_2^2=-6$. Using Maple,\
    \ however, provided a template for solving all four cases."
