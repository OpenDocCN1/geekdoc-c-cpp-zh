  md: '# TABLE 7.1: Classical Two-Player Games in Game Theory


    | Game | Strategies per Player | Number of Pure Strategy Nash Equilibria | Sequential
    | Perfect Information | Zero Sum |

    |---|---|---|---|---|---|

    | Battle of the Sexes | 2 | 2 | No | No | No |

    | Blotto Games | variable | variable | No | No | Yes |

    | Chicken | 2 | 2 | No | No | No |

    | Matching Pennies | 2 | 0 | No | No | Yes |

    | Nash Bargaining Game | infinite | infinite | No | No | No |

    | Prisoner''s Dilemma | 2 | 1 | No | No | No |

    | Rock, Paper, Scissors | 3 | 0 | No | No | Yes |

    | Stag Hunt | 2 | 2 | No | No | No |

    | Trust Game | infinite | 1 | Yes | Yes | No |


    We will present only the *movement diagram* for finding pure strategy solutions,
    and the linear programming formulation for all solutions of a zero-sum game. There
    are other methods, also short-cut methods, available to solve many of total-conflict
    games. For more information on short-cut methods, see [Straffin1993] and the other
    suggested readings (pg. 336).


    For partial conflict games, we will present


    +   - the movement diagram for determining pure strategy solutions, if they exist,

    +   - linear programming formulations for two-person two-strategy games for equalizing
    strategies,

    +   - nonlinear programming methods for more than two strategies for each player,
    and

    +   - linear programming methods to find security levels, as all players seek
    to maximize their preferred outcome.


    We use the concept that every partial conflict game has a *Nash''s equalizing
    mixed-strategy solution* even if the game has a pure strategy solution'
