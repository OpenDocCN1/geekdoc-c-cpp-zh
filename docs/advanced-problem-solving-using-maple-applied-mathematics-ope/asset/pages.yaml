- pgno: 15
  md: '# # 1


    *Introduction to Problem Solving and Maple*


    # Objectives:


    +   1. Understand the nature of problem solving.

    +   2. Understand the use of Maple commands.

    +   3. Understand the Maple Applications Center and its uses.


    # ## 1.1  Problem Solving


    What do we mean by *problem solving*? We interpret this as having a real problem
    whose understanding and solution requires quantitative analysis and one or more
    solution techniques using mathematics. To put into context, we say we need a well-defined
    problem. After we have a well-defined problem, we must brainstorm variables and
    assumptions that might impact the problem. We build or select a known model and
    choose a solution technique or combinations of techniques to obtain an answer.
    We solve and perform sensitivity analysis. We interpret all results, implement,
    and if necessary, refine the entire process.


    In many ways, this process is very similar to the mathematical modeling processes
    described in other texts: Albright [A2011], Giordano et al. [GFH2013], and Meerschaert
    [M2007] to name a few. Readers may want to examine these texts for a more detailed
    approach. As a co-author of the Giordano text, my approach is most similar to
    the approach we describe in that text.


    There are four- and five-step processes for problem solving. We present and describe
    a simple five-step method.'
  merge: -1
  img_proc: true
