  img_proc: true
- pgno: 25
  md: "# Correcting Erroneous Entries\n\nIn the above illustration, Maple displayed\
    \ the snook fish data immediately after its input. This is done to help the user\
    \ verify that all elements have been entered correctly. Reentry of each command\
    \ is typically the best method for correcting an erroneous entry with many errors.\n\
    \n# Transformation and Functions\n\nAs described, the symbol := is used to assign\
    \ the value on the right-hand side of the statement to the name on the left-hand\
    \ side of the statement. An example, x:=3; assigns the value 3 to x, to unassign\
    \ x, use the command x:=‘x’. Functions can be defined using the mapping arrow\
    \ symbol →. The function can be evaluated numerically or symbolically, we provide\
    \ a short example.\n\n```\n> f := x -> x^2 - 3*x + 4.5;\n    f := x -> x^2 - 3x\
    \ + 4.5\n> f(5);\n    14.5\n> f(x - 2);\n    (x - 2)^2 - 3x + 10.5\n```\n\nA problem\
    \ solution may suggest transforming a variable. Perhaps we want to transform both\
    \ x and y by taking natural logarithms (ln) of each. In the two-dimensional case,\
    \ the model suggests a functional relationship between a dependent and an independent\
    \ variable. Given values of an independent variable, a function can transform\
    \ the given data to yield predicted values for the dependent variable. Transforming\
    \ data requires the understanding of algebraic operations and functions that are\
    \ used in Maple. Table 1.1 presents the regular arithmetic operations that Maple\
    \ recognizes.\n\n# TABLE 1.1: Maple Arithmetic Functions\n\n| Symbol | Operation\
    \ |\n|---|---|\n| + | Addition |\n| − | Subtraction |\n| * | Multiplication |\n\
    | / | Division |\n| ^ | Exponentiation |\n\nMany other functions are also recognized\
    \ by Maple. Table 1.2 has an abbreviated listing."
  merge: -1
  img_proc: true
