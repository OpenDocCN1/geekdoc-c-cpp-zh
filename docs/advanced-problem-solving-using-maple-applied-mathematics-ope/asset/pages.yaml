    \ Constraint $g$ is Increased by Constant $\\alpha$\n\nLet’s now turn to the calculations.\n\
    \n# Lagrange Multipliers Computations with Maple\n\nThe set of equations in (4.2),\
    \ pg. 163, gives a system of $n+m$ equations in the $n+m$ unknowns $\\{x_i,\\\
    lambda_j\\}$. Generally speaking, this system presents a very difficult problem\
    \ to solve without a computer except for simple problems. Also, since the Lagrange\
    \ Multipliers are necessary conditions only, not sufficient, we may find solutions\
    \ $(x_i,\\lambda_i)$ that are not optimal for our specific NLP. We need to be\
    \ able to classify the points found in the solution. Commonly used methods for\
    \ determining optimality include\n\n+   a. the definiteness of the Hessian matrix\n\
    +   \n+   b. the definiteness of the bordered Hessian via $\\det(BdH)$\n\nWe’ll\
    \ illustrate these, when feasible, in the following examples with Maple.\n\n#\
    \ Example 4.19. Lagrange Multipliers with Maple.\n\nMaximize $z=-2x^2-2y^2+xy+8x+3y$\n\
    subject to\n$3x+y=6$\n\nFirst, define the $f$ and $g$, and then display a plot.\n\
