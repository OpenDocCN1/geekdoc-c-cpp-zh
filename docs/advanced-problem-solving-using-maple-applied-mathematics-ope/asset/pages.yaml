- pgno: 211
  md: "# MODEL FORMULATION. Let\n\n$x$ = ounces of Perfume #1 produced  \n$y$ = ounces\
    \ of Perfume #2 produced  \n$z$ = ounces of main chemical purchased\n\nThen\n\n\
    Maximize $P(x,y,z)=x\\cdot(30-0.01x)+y\\cdot(50-0.02y)-(3x+5y+10z)$  \nsubject\
    \ to  \n$x+y\\le z$  \n$z\\le 1925$\n\nSolution. Set up the model, define the\
    \ Lagrangian function $L$, and use the techniques from the previous examples.\n\
    \n```\nP := (x,y,z) -> x·(30 − 0.01x) + y·(50 − 0.02y) − (3x + 5y + 10z):\ng1\
    \ := (x,y,z) -> x + y − z:\ng2 := (x,y,z) -> z:\nL := (x,y,z,λ1,λ2,μ1,μ2) -> P(x,y,z)\
