    \ of plaza merchants that relocate downtown. The same is true for the number of\
    \ plaza merchants: the number is equal to the number that remain in the plaza\
    \ plus the number of downtown merchants that move to the plaza. Mathematically,\
    \ we write the model as the system\n\n\\[\n\\begin{aligned}\nd(n+1) &= 0.60d(n)+0.30p(n)\\\
