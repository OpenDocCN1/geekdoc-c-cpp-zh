- pgno: 78
  md: "We are interested in what happens to $a(k)$ as $k$ gets larger and larger without\
    \ bound. (In other words, when we iterate many times.) It may happen that for\
    \ large values of $k$, $a(k)$ is close to or even equal to some number $L$. If\
    \ increasing $k$ (doing more iterations) causes $a(k)$ to get even closer to $L$\
    \ until for very large values of $k$, $a(k)$ is essentially equal to $L$, then\
    \ $L$ is the limit of $a(k)$. If $a(k)$ has a limit, then we also say $a(k)$ converges\
    \ to $L$ or simply $a(k)$ converges. It is important to understand that if $a(k)$\
    \ converges to $L$, then further increases in $k$ will never cause $a(k)$ to move\
    \ “too far” away from $L$. Also remember that we are looking at large values of\
    \ $k$. How large is large depends upon the DDS. Compare how large $k$ must be\
    \ for the two sequences DDS$_1$: $a(k)=e^{-k}$ and DDS$_2$: $b(k)=1/(\\ln(k)+1)$.\n\
    \nIf increasing $k$ causes $a(k)$ to continue to increase or to oscillate, and\
    \ $a(k)$ does not begin to converge to a number $L$, we say $a(k)$ is diverging\
    \ and the limit does not exist.\n\n# **Example 2.9. Convergent Difference Equations.**\n\
    \nConsider\n\n+   1. the difference equation $a(n+1)=0.9a(n)+2$ with $a(0)=1$.\
    \ Iterating with an accuracy of 6 decimal places produces the following:\n+  \
    \ \n+      $$a(1)=2.9$$\n+   \n+      $$a(150)=19.999997$$\n+      $$a(151)=19.999998$$\n\
    +      $$\\vdots$$\n+      $$a(156)=19.999999$$\n+      $$\\vdots$$\n+      $$a(166)=20.000000$$\n\
    +   \n+      and for all $k>166$, $a(k)=20$. Thus, for this difference equation,\
    \ the limit of $a(k)$ is 20.\n\n+   2. the difference equation $b(n+1)=-0.1b(n)+11$\
    \ with $b(0)=1$. Iterating with an accuracy of 6 decimal places, we see the following:\n\
    +   \n+      $$b(4)=9.999100$$\n+      $$b(5)=10.000090$$\n+      $$b(6)=9.999991$$\n\
    +      $$b(7)=10.000001$$\n+      $$b(8)=9.999999$$\n+      $$b(9)=10.000000$$"
  merge: -1
  img_proc: true
- pgno: 79
  md: "and for all \\(k>9\\), \\(b(k)=10\\). Thus, for this difference equation, the\
    \ limit of \\(b(k)\\) is 10.\n\nEven though \\(b(4)\\) is less than 10 and \\\
    (b(5)\\) is greater than 10, \\(b(5)\\) is closer to 10 than \\(b(4)\\) is. Increasing\
    \ \\(k\\) caused \\(a(k)\\) to get closer to 10. Thus, the limit as \\(k\\to\\\
    infty\\) of \\(b(k)\\) is 10. Graph it!\n\nIf \\(a(k)\\) does not converge to\
    \ \\(L\\), then the sequence diverges. There are several ways in which a sequence\
    \ may diverge. If \\(a(k)\\) gets infinitely large as \\(k\\) gets infinitely\
    \ large, then \\(a(k)\\) diverges. If \\(a(k)\\) gets infinitely large in the\
    \ negative direction as \\(k\\) gets infinitely large, then \\(a(k)\\) also diverges.\
    \ If \\(a(k)\\) oscillates between large positive and large negative values, always\
    \ getting further from 0 as \\(k\\) gets infinitely large, then \\(a(k)\\) diverges.\
    \ If \\(a(k)\\) oscillates in a pattern between two or more fixed values as \\\
    (k\\) gets infinitely large, \\(a(k)\\) diverges. If \\(a(k)\\) shows absolutely\
    \ no pattern of behavior as \\(k\\) gets infinitely large, then \\(a(k)\\) diverges.\
    \ Given a random sequence \\(a(k)\\), it will likely diverge.\n\n# **Example 2.10.\
    \ Divergent Difference Equations.**\n\nConsider\n\n+   1. the difference equation\
    \ \\(a(n+1)=4a(n)+2\\) with \\(a(0)=1\\). Iteration of this difference equation\
    \ produces\n+   \n+   \\[\n+   \\begin{aligned}\n+   a(10)&=1747626\\\\\n+   a(11)&=6990506\\\
    \\\n+   a(12)&=27962026\\\\\n+   a(13)&=111848106\n+   \\end{aligned}\n+   \\\
    ]\n+   \n+   Further increase in \\(k\\) causes increase in \\(a(k)\\). Thus,\
    \ \\(a(k)\\) diverges.\n\n+   2. the difference equation \\(a(n+1)=-4a(n)+2\\\
    ) with \\(a(0)=1\\). In this case, iteration produces\n+   \n+   \\[\n+   \\begin{aligned}\n\
    +   a(10)&=629146\\\\\n+   a(11)&=-2516582\\\\\n+   a(12)&=1006630\\\\\n+   a(13)&=-40265318\n\
    +   \\end{aligned}\n+   \\]\n+   \n+   As \\(k\\) gets larger and larger, \\(a(k)\\\
    ) gets further from 0, always oscillating between positive and negative values.\
    \ Thus, \\(a(k)\\) diverges.\n\nWe close this section with a very useful theorem.\n\
    \n# **Theorem. Limits are Stable Equilibria.**\n\nIf a dynamical system has a\
    \ limit, then that limit is a stable equilibrium value; i.e., is an attracting\
    \ fixed point."
  merge: -1
