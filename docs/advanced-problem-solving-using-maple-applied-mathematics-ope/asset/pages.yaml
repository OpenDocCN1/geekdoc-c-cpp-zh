  md: '# ### 7.4 Examples of Partial Conflict Games


    We present examples of partial conflict games with their solutions.


    # **Example 7.9. Cuban Missile Crisis—A Classic Game of Chicken⁷.**


    “We’re eyeball to eyeball, and I think the other fellow just blinked,” were the
    eerie words of Secretary of State Dean Rusk at the height of the Cuban Missile
    Crisis in October, 1962. Secretary Rusk was referring to signals by the Soviet
    Union that it desired to defuse the most dangerous nuclear confrontation ever
    to occur between the superpowers, which many analysts have interpreted as a classic
    instance of a nuclear “Game of Chicken.”


    We will highlight the scenario from 1962. The Cuban Missile Crisis was precipitated
    in October 1962, by the Soviet’s attempt to install medium- and intermediate-range
    nuclear-armed ballistic missiles in Cuba that were capable of hitting a large
    portion of the United States. The range of the missiles from Cuba allowed for
    major political, population, and economic centers to become targets. The goal
    of the United States was immediate removal of the Soviet missiles. U.S. policy
    makers seriously considered two strategies to achieve this end: naval blockade
    or airstrikes.


    President Kennedy, in his speech to the nation, explained the situation as well
    as the goals for the United States. He set several initial steps. First, to halt
    the offensive build-up, a strict quarantine on all offensive military equipment
    under shipment to Cuba was being initiated. He went on to say that any launch
    of missiles from Cuba at anyone would be considered an act of war by the Soviet
    Union against the United States resulting in a full retaliatory nuclear strike
    against the Soviet Union. He called upon Soviet Premier Krushchev to end this
    threat to the world, and restore world peace.


    We will use the Cuban Missile Crisis to illustrate parts of the theory—not just
    an abstract mathematical model, but one that mirrors the real-life choices, and
    underlying thinking of flesh-and-blood decision makers. Indeed, Theodore Sorensen,
    special counsel to President Kennedy, used the language of “moves” to describe
    the deliberations of EXCOM, the Executive Committee of key advisors to President
    Kennedy during the Cuban Missile Crisis. Sorensen said,


    > > We discussed what the Soviet reaction would be to any possible move by the
    United States, what our reaction with them would have to be to the Soviet action,
    and so on, trying to follow each of those roads to their ultimate conclusion.


    **Problem:** Build a mathematical model that allows for consideration of alternative
    decisions by the two opponents.'
  merge: -1
  img_proc: true
