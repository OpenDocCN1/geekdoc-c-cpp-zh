  md: 'Let’s preview a graphical solution to an example.


    $$\begin{aligned}

    \text{Maximize } & z=-2x^2-2y^2+xy+8x+3y \\

    \text{subject to } & 3x+y=6

    \end{aligned}$$


    Generate a contour plot of $z=f(x)$ with Maple, and overlay the single constraint
    onto the contour plot. See **Figure 4.15**. What information can we obtain from
    this graphical representation? First, we note that the unconstrained optimum does
    not lie on the constraint. We estimate the unconstrained maximum as $(x^*,y^*)=(2.3,1.3)$.
    The optimal constrained solution lies at the point where the constraint is tangent
    to a contour of $z=f(x)$. This point is approximately $(1.8,1.0)$ on the graph.
    We see clearly that the constraint does not pass through the unconstrained maximum,
    and thus, it can be modified/adjusted (if feasible) until the line passes through
    the unconstrained solution. At that point, we would no longer add (or subtract)
    any more constrained resources (see **Figure 4.16**). Valuable insights about
    the problem come from plotting the information, when possible.


