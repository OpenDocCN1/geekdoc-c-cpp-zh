- pgno: 160
  md: 'In many problems (*most real problems*), it is quite difficult to find the
    stationary or critical points, and then use them to determine the nature of the
    stationary point. In this section, we’ll discuss numerical techniques to maximize
    or minimize a multivariable function.


    # Gradient Search Methods


    We want to solve the *unconstrained nonlinear programming problem* (NLP) given
    in Equation 4.1 above. Calculus tells us that if a function $f$ is concave, then
    the optimal solution—if there is one—will occur at a stationary point $x^*$; i.e.,
    at a point $x^*$ where


    $$\frac{\partial f}{\partial x_1}(x^*)=\frac{\partial f}{\partial x_2}(x^*)=\cdots=\frac{\partial
    f}{\partial x_n}(x^*)=0$$


    Finding the stationary points in many problems is quite difficult. The methods
    of *Steepest Ascent* (maximization) and *Steepest Descent* (minimization) offer
    an alternative by finding an approximation to a stationary point. We’ll focus
    on the gradient method, the Steepest Ascent.


    Examine the function shown in Figure 4.9.


    ![](img/0f04050177d82aebd17d3383d7334896_160_0.png)


    Figure 4.9: A Surface Defined by a Function


    We want to find the maximum point on the surface. If we started at the bottom
    of the hill, we might proceed by finding the gradient vector, since the gradient
    is the vector that points “up the hill” in the direction of maximum'
