- pgno: 357
  md: '+   2. DEA is good at estimating relative efficiency of a DMU, but it does
    not directly measure absolute efficiency. In other words, DEA can show how well
    a DMU is doing compared to its peers, but not compared to a theoretical maximum.


    +   3. Since DEA is a nonparametric technique, statistical hypothesis tests are
    difficult—they are the focus of ongoing research.


    +   4. Since a standard formulation of DEA with multiple inputs and outputs creates
    a separate linear program for each DMU, large problems can be computationally
    extremely intensive.


    +   5. Linear programming does not ensure all weights are considered. We find
    that the values for weights are only for those that optimally determine an efficiency
    rating. If having all criteria (all inputs and outputs) weighted is essential
    to the decision maker, then DEA is not appropriate.


    # Sensitivity Analysis


    Sensitivity analysis is always an important element in every modeling project.
    According to Nerali ([Nerali1998]), an increase in any output cannot worsen an
    efficiency rating, nor can a decrease in inputs alone worsen an already achieved
    efficiency rating. As a result, in our examples we only decrease outputs and increase
    inputs. We will briefly illustrate sensitivity analysis, as applicable, in the
    examples.


    # Example 8.1. Manufacturing Units.


    A manufacturing process involves three DMUs each having two inputs and three outputs.
    Management wishes to assess the efficiency of each DMU in order to target resources
    to improve performance. The data appears in Table 8.2.


    # TABLE 8.2: Manufacturing DMU Data


    | DMU | Input 1 | Input 2 | Output 1 | Output 2 | Output 3 |

    | --- | --- | --- | --- | --- | --- |

    | I | 5 | 14 | 9 | 4 | 16 |

    | II | 8 | 15 | 5 | 7 | 10 |

    | III | 7 | 12 | 4 | 9 | 13 |


    Since no units are given and the values have similar scales, the data doesn’t
    have to be normalized.'
