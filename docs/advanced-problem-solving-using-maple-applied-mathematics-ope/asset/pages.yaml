    |  | Status Quo (SQ) | Increase Salary (IN) |

    | Strike (S) | (1, 3) | (3, 2) |

    | No Strike (NS) | (2, 4) | (4, 1) |


    # TABLE 7.51: Writer’s Guild and Management’s Movement Diagram


    | Writer’s Guild (*Rose*) | Management (*Colin*) |  |

    |---|---|---|

    |  | Status Quo (SQ) | Increase Salary (IN) |

    | Strike (S) | (1, 3) ⇐ (3, 2) |  |

    | No Strike (NS) | (2, 4) ⇐ (4, 1) |  |


    Movement arrows point toward (2, 4).


    The movement arrows point towards (2, 4) as the pure Nash equilibrium. We also
    note that this result is not satisfying to the Writer’s Guild, and that they would
    like to have a better outcome. Both (3, 2) and (4, 1) within the payoff matrix
    provide better outcomes to the Writers.


    The Writers can employ several options to try to secure a better outcome. They
    can first try Strategic Moves, and if that fails to produce a better outcome,
    then they can move to Nash Arbitration. Both of these methods employ communications
    in the game. In strategic moves, we examine the game to see if the outcome is
    changed by “moving first,” threatening our opponent, or making promises to our
    opponent, or whether a combination of threats and promises changes the outcome.


    Examine the strategic moves. If the writers move first, their best result is again
    (2, 4). If management moves first, the best result is (2, 4). First moves keep
    us at the Nash equilibrium. The writers consider a threat: they tell management
    that if they choose SQ, they will strike putting us at (1, 3). This result is
    indeed a threat, as it is worse for both the writers and management. However,
    the options for management under IN are both worse than (1, 3), so'
