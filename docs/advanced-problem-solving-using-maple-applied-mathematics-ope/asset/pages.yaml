  md: '# ## 1.1 线性空间


    定义 1.1.1  设 V 是一个非空集合，F 是一个数域。如果在 V 上定义了一个代数运算，称为加法，即对于 V 中任意两个元素 α, β，在 V 中有唯一的一个元素
    γ 与之对应，称为 α 与 β 的和，记为 γ = α + β；在 F 与 V 的元素间还定义了一个运算，称为数量乘法，即对于 F 中任意数 k 与 V 中任意元素
    α，在 V 中有唯一的一个元素 δ 与之对应，称为 k 与 α 的数量乘积，记为 δ = kα。如果加法和数量乘法满足下列八条运算规则，那么称 V 为数域
    F 上的线性空间。


    +   1. 加法交换律：α + β = β + α；

    +   2. 加法结合律：(α + β) + γ = α + (β + γ)；

    +   3. 零元素：在 V 中存在一个元素 0，使对任意 α ∈ V，有 α + 0 = α；

    +   4. 负元素：对于 V 中任意元素 α，存在 β ∈ V，使 α + β = 0；

    +   5. 1α = α；

    +   6. 数乘结合律：k(lα) = (kl)α；

    +   7. 数乘对加法的分配律：k(α + β) = kα + kβ；

    +   8. 数乘对数的分配律：(k + l)α = kα + lα。


    其中 α, β, γ 是 V 中任意元素，k, l 是 F 中任意数。


    例 1.1.1  数域 F 上的 n 维向量全体按通常的向量加法和数量乘法构成 F 上的一个线性空间，记为 Fⁿ。


    例 1.1.2  数域 F 上的 m × n 矩阵全体按矩阵的加法和数量乘法构成 F 上的一个线性空间，记为 F^{m×n}。


    例 1.1.3  区间 [a, b] 上全体连续实函数按通常的函数加法和数乘函数构成实数域 R 上的一个线性空间，记为 C[a, b]。


    例 1.1.4  数域 F 上一元多项式环 F[x] 按通常的多项式加法和数与多项式的乘法构成 F 上的一个线性空间。


    例 1.1.5  数域 F 上所有 n 次多项式（包括零多项式）按通常的多项式加法和数与多项式的乘法构成 F 上的一个线性空间，记为 F[x]_n。


    例 1.1.6  齐次线性方程组 Ax = 0 的全部解向量按通常的向量加法和数量乘法构成一个线性空间，称为解空间。'
  merge: -1
  img_proc: true
