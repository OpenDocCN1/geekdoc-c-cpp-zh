- pgno: 17
  md: 'provides insights and the ability to check out possibilities. In this book
    our technology of choice is the computer algebra system, Maple™.


    # 1.2　Introduction to Maple


    Maple is a symbolic computation system or computer algebra system (CAS) that manipulates
    information in a symbolic or algebraic manner. You can use these symbolic capabilities
    to obtain exact, analytical solutions to many mathematical problems. Maple also
    provides numerical estimates to whatever precision is desired when exact solutions
    do not exist.


    Maple 2019 and higher is different from previous versions of Maple. With Maple
    2019 you can create profession quality documents, presentations, and custom computational
    tools. You can access the Maple computational engine through a variety of interfaces:
    standard worksheet, classical worksheet, command line version, graphing calculator
    (Windows only), or Maple applications. Although you type in the commands in a
    very similar manner as in previous versions of Maple, the statement appears in
    a “pretty print” format on the screen; that is, the statement appears more like
    typeset mathematics.


    # Standard Worksheet


    This is a full-featured graphical user interface offering features that help to
    create documents that show all assumptions, the calculations, and any margin of
    error in your results. You can even hide the computations to focus on problem
    setup and final results.


    # Classic Worksheet


    The basic worksheet environment works best for older computers with limited memory.


    # Command-Line Version


    Command-line interface, without graphical user interface features, is used for
    solving very large, complex problems or batch processing.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Maplesoft™ Graphing Calculator


    The graphical interface to the Maple computational engine allows you to perform
    simple computations and create customizable, zoomable graphs. The Graphing Calculator
    is only available in the Windows version.


    # Maple Applications


    The graphical user interface containing windows, textbox regions, and other visual
    features gives you point-and-click access to the power of Maple. It allows you
    to perform calculations and plot functions without using the worksheet or command-line
    interfaces.


    Maple’s extensive mathematical functionality is most easily accessed through all
    these interfaces. Previous older versions relied on its advanced worksheet-based
    graphical interface. A worksheet is a flexible document for exploring mathematical
    ideas or mathematical alternatives and even creating technical reports.


    Experimental mathematical modeling, a natural stepping stone to statistical analysis,
    has an obvious coupling with computers, which can quickly solve equations, and
    plot and display data to assist in model test and evaluation. The software computer
    algebra system, Maple, is a powerful tool to assist in this process. When dealing
    with real-world problems, data requirements can be immense. When evaluating immigration
    trends, for example, and the political, social, and economic effects of these
    trends, thousands of data points are used; in some cases, millions of data points.
    Such problems cannot be analyzed by hand, effectively or efficiently. The manipulation
    required to plot, curve fit, and statistically analyze with goodness-of-fit techniques,
    cannot feasibly be done without the assistance of a computer software system.


    The Maple system is easy to learn and can be applied in many mathematical applications.
    While these demonstrate its versatility, Maple is also an extremely powerful software
    package. Maple provides over 5000 built-in definitions and mathematical functions,
    covering every mathematical interest: calculus, differential equations, linear
    algebra, statistics, and group theory to mention only a few. The statistical package
    reduces many standard time-consuming statistical questions into one-step solutions,
    including mean, median, percentile, kurtosis, moments, variance, standard deviation,
    and so forth. There are many references for Maple, and a short list would include:


    +   - Maple Quick Reference

    +   - Maple Flight Manual

    +   - Maple Language Reference Manual

    +   - Maple Library Reference Manual'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - Maple “What’s New” Release Notes

    +   - Maple “Getting Started” tutorials and worksheets


    This chapter presents a quick review of some basic Maple commands. It is not intended
    to be a self-contained tutorial for Maple, but will however provide a quick review
    of the basics prior to more sophisticated commands in the modeling chapters. There
    are many good references for those new to Maple. Additionally, there is a collection
    of self-contained tutorials accessed by clicking the “Getting Started” button
    on Maple’s opening screen. See Figure 1.1.


    # 1.3  The Structure of Maple


    Maple is an example of a computer algebra system (CAS). It is composed of thousands
    of commands, to execute operations in algebra, calculus, differential equations,
    discrete mathematics, geometry, linear algebra, numerical analysis, linear programming,
    statistics, and graphing. It has been logically designed to minimize storage allocation,
    while remaining user friendly. Maple allows a user to solve and evaluate complicated
    equations and calculations, analytically or numerically, such as optimization
    problems, least square solutions to equations, and solving equations that involve
    special functions.


    ![](img/0f04050177d82aebd17d3383d7334896_19_0.png)


    FIGURE 1.1: Maple 2020 Opening Screen


    The “New to Maple?” section in the opening screen will lead to videos, tutorials,
    and links to more information as seen in Figure 1.2.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/0f04050177d82aebd17d3383d7334896_20_0.png)


    FIGURE 1.2: “New to Maple” Section of Maple 2019 Expanded


    # Commands


    To begin using Maple from the opening screen, we suggest clicking on the “New
    Worksheet” button shown in Figure 1.1. Enter commands at Maple’s *command prompt:*
    >. See Figure 1.3. A Worksheet shows command prompts, while a *Document* does
    not.


    ![](img/0f04050177d82aebd17d3383d7334896_20_1.png)


    FIGURE 1.3: Maple’s Command Prompt


    # Notation and Conventions


    Throughout this book, different types of fonts and styles are used to distinguish
    between Maple commands, Maple output, and other information. Maple commands are
    copied directly from Maple 2019 and the output will immediately follow the Maple
    commands. In the first example below, the variable *a* has been assigned an expression
    as its value. Notice that the symbol := is used'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'to indicate this assignment. In the second line of the example, the value of
    a, the expression, is differentiated with respect to x.


    Type the command in either the Worksheet or the Document mode as

    \[

    a := 2*x^3 \rightarrow -\frac{5}{6}x.

    \]

    (The → indicates pressing the “right arrow” cursor key to exit superscript mode.)
    You will type the statement this way, but the screen version appears as follows:


    ```

    a := 2·x³ − 5·x/6


    diff(a,x)


    6x² − 5/6

    ```


    The screen version shows Maple’s mathematical interpretation of what you have
    typed.


    # 1.4  General Introduction to Maple


    Maple has many types of windows: the worksheet or document window, help window,
    2-D plot window, 3-D plot window, and the animation window. Many “Maple Assistants”
    use a “maple” window. In this book, the worksheet and help windows are used most
    often. We provide a brief explanation of each.


    The worksheet is where all interaction between Maple and the user occurs. Within
    a worksheet, commands (input) and text (remarks for clarification) are entered
    by the user, and results, numerical or symbolic (output and graphics) are produced
    by Maple. The user may manipulate these interactions to create a flowing document
    that can be saved by clicking File, then clicking SaveAs followed by naming the
    document. The name of the document can be any word or group of letters and/or
    numbers, which has a length of less than nine characters. Once a document has
    initially been saved, it can be retrieved by clicking File, clicking Open, and
    entering the document name. Then it can be re-saved after modification by clicking
    File, followed by clicking Save. We will use Worksheet mode rather than Document
    mode since Worksheets show a command prompt, but Documents do not.


    The input and text regions of the worksheet can be modified to change a document,
    but the graphic and output regions cannot be modified once Maple inserts them
    into a document. A command must be edited and re-executed to alter its associated
    output. The input region is identified by the > prompt which precedes all command
    entries into Maple. (Note: Maple only recognizes the Maple generated > prompt.
    If the symbol > itself is typed by the user, Maple does not respond to it as an
    input prompt, but as the “greater than”'
  merge: -1
  img_proc: true
