  md: "# Projects\n\n**Project 1.** Write a program using the technology of your choice\
    \ to implement:\n\n+   (a) SAW,  \n+   (b) AHP, and  \n+   (c) TOPSIS.\n\n**Project\
    \ 2.** Enhance your program to perform sensitivity analysis.\n\n**Project 3.**\
    \ Perform and discuss a comparative analysis using the Kite network and each MADM\
    \ method.\n\n# 8.6  Methods of Choosing Weights\n\nLast, we consider several standard\
    \ methods for choosing the weights for SAW, AHP, and TOPSIS.\n\n# Rank Order Centroid\
    \ Method\n\nThe *rank order centroid* (ROC) method is a simple way of giving weights\
    \ to a number of items ranked according to their importance. In general, decision\
    \ makers can rank items much more easily and quickly than assigning weights. This\
    \ method takes those ranks as inputs, and converts them to weights for each of\
    \ *m* items based on the following schema.\n\n+   1. List the *m* items in rank-order\
    \ from most important to least important.  \n+   2. Assign the *i*th item in the\
    \ list the weight $w_i$ where\n\n$$w_i = \\frac{1}{m}\\sum_{k=i}^{m}\\frac{1}{k}$$\n\
    \nE.g., for four items:\n\n```\nm := 4 :\nweights := [ seq ( w_i := 1/m · sum\
    \ (1/k, k := i..m), i := 1..m ) ];\nadd(weights);\nweights := [ w₁ = 25/48, w₂\
    \ = 13/48, w₃ = 7/48, w₄ = 1/16 ]\nw₁ + w₂ + w₃ + w₄ = 1\n```"
  merge: -1
  img_proc: true
