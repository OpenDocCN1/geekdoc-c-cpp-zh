  md: 'production of certain resources actually *consumes* resources as well. In other
    words, it takes stuff to make stuff. How much is consumed by production can be
    expressed by using an *input-output matrix*.


    ![](img/0f04050177d82aebd17d3383d7334896_240_0.png)


    The matrix $T$ indicates that the production of 1 unit of manufacturing uses up
    0.1 units of manufacturing, 0.2 units of electronics, and 0.1 units of agriculture.
    The production of 1 unit of electronics uses up 0.2 units of manufacturing, 0.1
    units of electronics, and 0.1 units of agriculture. Finally, the production of
    1 unit of agriculture uses up 0.3 units of manufacturing, 0.3 units of electronics,
    and 0.1 units of agriculture. So, not only must we account for what the people
    want, but we must also make up for what is used up in the process of producing
    what the people want. The amount consumed by production is called *internal demand*,
    it is given by the product $Tx$. Hence, what we produce needs to satisfy both
    internal demand and external demand. That is,


    $$x = Tx + d$$


    Using the matrix $T$ above, determine the production vector $x$, also called the
    *total demand*, and the internal demand $Tx$ for our three-sector economy.


    **Project 2.** Wassily Leontief (1906–1999), the Russian-born, Nobel Prize winning
    American economist who, aside from developing highly sophisticated economic theories,
    also enjoyed trout fishing, ballet and fine wines. In this project, we will look
    at a very simple special case of his work called a *closed exchange model*.


    Long, long ago, far, far away in the land of Eigenbazistan, in a small country
    town called Matrixville, there lived a Farmer, a Tailor, a Carpenter, a Coal Miner
    and Slacker Bob. The Farmer produced food; the Tailor, clothes; the Carpenter,
    housing; the Coal Miner supplied energy; and Slacker Bob made High Quality 100-Proof
    Moonshine, half of which he drank himself. Let’s make the following assumptions:


    +   - Everyone buys from and sells to the central pool (i.e., there is no outside
    supply or demand).

    +   - Everything produced is consumed.


    This type of economy is called a *closed exchange model*. [Table 5.3](#) specifies
    what fraction of each of the goods is consumed by each person in our town.'
