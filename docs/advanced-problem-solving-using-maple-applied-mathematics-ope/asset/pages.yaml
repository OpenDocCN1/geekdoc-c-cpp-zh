  md: "# Example 7.12. Course of Actions Decision Process for Partial Conflict Games.\n\
    \nReturn to the zero-sum game of Example 7.8 of Section 7.3. In many real world\
    \ analyses, a player winning is not necessarily another player losing. Both might\
    \ win or both might lose based upon the mission and courses of action played.\
    \ Again, assume Player I has four strategies and Player II has six strategies\
    \ that they can play. We use an AHP approach (see Fox [Fox2014]) to obtain cardinal\
    \ values of the payoff to each player. Although this example is based on combat\
    \ courses of action, this methodology can be used when competing players both\
    \ have courses of action that they could employ. As in Example 7.11, we use AHP\
    \ to convert the ordinal rankings of the combined COAs in order to obtain cardinal\
    \ values.\n\nThe game’s payoff matrices become\n\n```\nwith(Optimization):\n\n\
    A := Matrix([[6, 5.75, 5.5, 0.75, 3.75, 0.5],\n             [4, 4.25, 2.75, 1.75,\
    \ 2, 0.25],\n             [3.25, 3, 1.5, 1.25, 1, 3.5],\n             [5.25, 5,\
    \ 4.75, 2.5, 2.25, 4.5]]):\n\nB := Matrix([[0.167, 0.333, 0.5, 0.6336, 3.667,\
    \ 3.833],\n             [1.5, 1.333, 2.333, 0.8554, 2.833, 4],\n             [2.1667,\
    \ 2, 3.1667, 0.3574, 3.5, 1.833],\n             [0.667, 0.833, 1.5, 2.95, 2.667,\
    \ 1.1667]]):\n\nX := Vector[row](4, symbol = x):\nY := Vector(6, symbol = y):\n\
    Constraints := {seq((A . Y)_i <= p, i = 1..4),\n                seq((X . B)_i\
    \ <= q, i = 1..4),\n                add(x_i, i = 1..4) = 1, add(y_i, i = 1..6)\
    \ = 1}\nObjective := expand(X . A . Y + X . B . Y - p - q):\n```\n\nThe solutions,\
    \ depending on the starting conditions for P and Q, are found using Maple’s QPSolve\
    \ since Objective is quadratic or NLPSolve since it is nonlinear. As before, use\
    \ fnormal to eliminate numerical artifacts.\n\n```\ntheProgram := (Objective,\
    \ Constraints, assume = nonnegative,\n              maximize):\n\nfnormal(QPSolve(theProgram),\
    \ 3);\n[3.08, [p = 2.86, q = .634, x_1 = 1., x_2 = 0., x_3 = 0., x_4 = 0., y_1\
    \ = 0., y_2 = 0.,\n        y_3 = 0., y_4 = 0., y_5 = 0.727, y_6 = 0.273]]\n\n\
    fnormal(NLPSolve(theProgram, initialpoint = {p = 3, q = 6}), 3);\n[0., [p = 2.50,\
    \ q = 5.95, x_1 = 0., x_2 = 0., x_3 = 0., x_4 = 1., y_1 = 0., y_2 = 0.,\n    \
    \  y_3 = 0., y_4 = 1., y_5 = 0., y_6 = 0.]]\n```"
