  md: 'PSMv2 package. Load the package via `with(PSMv2)`. The syntax of the `ModifiedNewtonMethod`
    function is


    ModifiedNewtonMethod(f, (x₀, y₀), ε, N)


    where *f* is the function, (x₀, y₀) is the starting vector, ε is the tolerance,
    and *N* is the maximum number of iterations allowed. The output of `ModifiedNewtonMethod`
    is a `DataFrame` containing the generated points, function values, Hessians, and
    the definiteness of the Hessian.


    # Example 4.16. Modified Newton’s Method Example, I.


    Maximize *f*(x) = 2x₁x₂ + 2x₂ − x₁² − 2x₂² to within ε = 0.01 starting at x₀ =
    ⟨0, 0⟩.


    Limit the number of iterations to *N* = 20.


    ```

    `> f := x → 2x₁x₂ + 2x₂ − x₁² − 2x₂²:`

    ```


    ```

    `> MNf := ModifiedNewtonMethod(f, ⟨0, 0⟩, 0.01, 20);`

    ```


    | SAf | k | xₖ | F(xₖ) | Hessian | definiteness |

    |---:|---:|---|---:|---|---|

    |  | 1 | [0, 0]ᵀ | 0. | [−2, 2; 2, 4] | negative_definite |

    |  | 2 | [1, 1]ᵀ | 0. | [−2, 2; 2, 4] | negative_definite |

    |  | 3 | [1, 1]ᵀ | 0. | [−2, 2; 2, 4] | negative_definite |


