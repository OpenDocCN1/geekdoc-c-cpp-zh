  md: 'ROC is simple and easy to follow, but it gives weights which are highly dispersed.
    As an example, consider weighting the factors in the example below.


    # Example 8.10. Agency Project.


    Suppose an agency has selected four main criteria and put them in rank order as


    +   1. Shortening Schedule,  2. Project Cost,  3. Agency Control,  4. Competition


    Using ROC to rank the four criteria based on their importance and influence as
    listed gives the ranks calculated above:


    $w_1 = 0.52, w_2 = 0.27, w_3 = 0.15,\text{ and } w_4 = 0.06.$


    These weights almost eliminate the effect of the fourth factor, encouraging competition.
    This ranking could prove to be an issue.


    # Ratio Method


    The Ratio Method is another simple way of calculating weights for a selection
    of critical factors. The decision maker first rank-orders all items according
    to their importance. Next, each item is given an initial weight based on its rank
    beginning with the lowest ranked item given an initial weight of 10. The decision
    maker moves up the ranking giving each successive item a weight that is a multiple
    of 10 and is an amount greater than the previous indicating the item''s relative
    importance. Last, the raw weights are normalized by dividing each by the sum of
    all. Each increase in weight is based on the differences between the items’ importance
    and is a subjective judgment of the decision maker. Ranking the items in the first
    step helps to assign more accurate weights.


    Rating the factors from Example 8.10 using the ratio method with initial weights
    assigned by the Project Manager gives


    |  | Criterion | 1 | 2 | 3 | 4 |

    |---|---|---:|---:|---:|---:|

    |  | Raw Weight | 50 | 40 | 20 | 10 |

    |  | Normalized Weight | 0.417 | 0.333 | 0.167 | 0.083 |


    While just as easy as ROC, the ratio method also suffers from dispersed weightings.


    # Pairwise Comparison


    We’ve used pairwise comparison in several examples of SAW, AHP, and TOPSIS. The
    main task of pairwise comparison is to rank each item’s relative importance to
    other items individually, building a pairwise comparison matrix. We have used
    Saaty’s ranking system of 1 (equally important) to 9 (extremely more important)
    to assess relative importance. (See Table 8.10, p. 362.) The reverse relation
    uses reciprocals. For instance, if A is 3 times more important'
