    money the outcome would raise, and finally how well the DMN''s leaders could maintain
    control of the network.


    After conducting an AHP analysis, we obtained a new payoff matrix in Table 7.53
    with cardinal utility values.


    # TABLE 7.53: Dark Money Network Revised


    | Payoff Tableau | DMN |  |

    |---|---|---|

    |  | C | D |

    | State A | (0.168, 0.089) | (0.366, 0.099) |

    | State B | (0.140, 0.462) | (0.323, 0.348) |


    With the cardinal scaling, it is now possible to conduct a proper analysis that
    might include mixed strategies or arbitrated results such as finding prudential
    strategies, Nash''s Equalizing Strategies, and Nash Arbitration. Using a series
    of game theory solvers developed by Feix¹¹ we obtain the following results.


    +   - Nash Equilibrium: A pure strategy Nash equilibrium was found at (A,D) of
    (0.366,0.099) using strategies of Non-Kinetic and Decentralize.


    +   - Mixed Nash Equalizing Strategies: The State plays Non-Kinetic 91.9% of the
    time and Kinetic 8.1% of the time; DMN always plays Maintain Organization.


    +   - Prudential Strategies: The Security Levels are (0.168,0.099) when the State
    plays C and the DMN plays A.


    Since there is no equalizing strategy for the DMN, should the State attempt to
    equalize the DMN. The result is as follows. This is a significant departure from
    our original analysis prior to including the AHP pairwise comparisons. The recommendations
    for the state were to use a kinetic strategy 50% of the time and a non-kinetic
    strategy 50% of the time. However, it is obvious that with proper scaling the
    recommendation should have been to execute a non-kinetic strategy the vast majority,
    92%, of the time, and only occasionally, 8%, conduct kinetic targeting of network
    nodes. This greatly reinforces the recommendation to execute a non-kinetic strategy
    to defeat the DMN.


    Finally, if the State and the DMN could enter into arbitration, the result would
    be at BD, which was the same prediction as before the proper scaling.'
