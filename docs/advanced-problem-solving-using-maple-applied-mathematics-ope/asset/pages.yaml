- pgno: 31
  md: "this description information is also printed. Even library procedures, whose\
    \ body is generally elided when printing, have their description (if any) printed.\
    \ The descriptionSequence is also used when information about the procedure is\
    \ printed by the Describe command.\n\n+   - The optional uses usesSequence; clause\
    \ is equivalent to wrapping the statementSequence with a use statement. In other\
    \ words, `proc ... uses LinearAlgebra; ... end proc` is equivalent to: `proc ...\
    \ use LinearAlgebra in ... end use; end proc`\n+   - The statementSequence consists\
    \ of one or more Maple language statements, separated by semicolons (;), implementing\
    \ the algorithm of the procedure.\n+   - A procedure assigned to a name, f, is\
    \ invoked by using f(argumentSeq). See Argument Processing for an explanation\
    \ of argument passing.\n+   - The value of a procedure invocation is the value\
    \ of the last statement executed, or the value specified in a return statement.\n\
    +   - In both 1-D and 2-D math notation, statements entered between proc and end\
    \ proc must be terminated with a colon (:) or semicolon (;).\n\n# Implicit Local\
    \ Variables\n\n+   - For any variable used within a procedure without being explicitly\
    \ mentioned in a local localSequence; or global globalSequence; the following\
    \ rules are used to determine whether it is local or global:\n+   \n+     *The\
    \ variable is searched for amongst the locals and globals (explicit or implicit)\
    \ in surrounding procedures, starting with the innermost. If the name is encountered\
    \ as a parameter, local variable, or global variable of such a surrounding procedure,\
    \ that is what it refers to. Otherwise, any variable to which an assignment is\
    \ made, or which appears as the controlling variable in a ‘for’ loop, is automatically\
    \ made local. Any remaining variables are considered to be global.*\n+   \n+ \
    \  - **Note.** Any name beginning with __Env is considered to be an environment\
    \ variable, and is not subject to the rules above.\n\n# The Operands of a Procedure\n\
    \n+   - A Maple procedure is a valid expression like any other (e.g., integers,\
    \ sums, inequalities, lists, etc.). As such, it has sub-parts that can be extracted\
    \ using the op function. A procedure has eight such operands:\n+   \n+     `op\
    \ 1` is the parameterSequence,\n+   \n+     `op 2` is the localSequence,\n+  \
    \ \n+     `op 3` is the optionSequence,"
  merge: -1
  img_proc: true
- pgno: 32
  md: "op 4 is the remember table,  \nop 5 is the descriptionSequence,  \nop 6 is\
    \ the globalSequence,  \nop 7 is the lexical table (see note below), and  \nop\
    \ 8 is the returnType (if present).\n\n+   - Any of these operands will be NULL\
    \ if the corresponding sub-part of the procedure is not present.\n+   \n+   -\
    \ **Note:** The lexical table is an internal structure used to record the correspondence\
    \ between undeclared variables and locals, globals, or parameters of surrounding\
    \ procedures. It does not correspond to any part of the procedure as written.\n\
    \n# Evaluation Rules\n\n+   - Procedures have special evaluation rules (like tables)\
    \ so that if the name `f` has been assigned a procedure, then:\n+     - `f` evaluates\
    \ to just the name `f`,\n+     - `eval(f)` yields the actual procedure, and\n\
    +     - `op(eval(f))` yields the sequence of eight operands mentioned above (any\
    \ or all of which may be NULL).\n+   \n+   - Within a procedure, during the execution\
    \ of its `statementSequence`, local variables have *single level evaluation*.\
    \ This means that using a variable in an expression will yield the current value\
    \ of that variable, rather than first evaluating that value. This is in contrast\
    \ to how variables are evaluated outside of a procedure, but is similar to how\
    \ variables work in other programming languages.\n\n# Notes\n\n+   - Remember\
    \ tables (option remember) should not be used for procedures that are intended\
    \ to accept mutable objects (e.g., rtables or tables) as input, because Maple\
    \ does not detect that such an object has changed when retrieving values from\
    \ remember tables.\n\n# Examples\n\n```\n〉 lc := proc( s, u, t, v )\n       description\
    \ \"form a linear combination of the arguments\";\n       s · u + t · v;\n   \
    \  end proc;\n   lc := proc(s,u,t,v)\n       description \"form a linear combination\
    \ of the arguments\";\n       s * u + t * v\n     end proc\n```"
  merge: -1
  img_proc: true
