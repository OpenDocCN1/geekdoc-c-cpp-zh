  md: "```\n```maple\n> seq([n, 2^n - 1], n = 1..64, 7);  # Note the step size of\
    \ 7\n[1, 1], [8, 255], [15, 32767], [22, 4194303], [29, 536870911], [36, 68719476735],\n\
    [43, 8796093022207], [50, 1125899906842623], [57, 144115188075855871],\n[64, 18446744073709551615]\n\
    ```\n```\n\nWhen a dynamical system does not have a closed-form analytical solution,\
    \ the **rsolve** command chooses its input, so we cannot use a formula in the\
    \ (seq) command to generate values. We’ll need to use **proc** to create a program\
    \ to iterate the discrete dynamical system. Call the program *Tower* and use inputs\
    \ *n0*, *t0*, and *n* where *n0* is the first non negative integer in our domain,\
    \ *t0* is our first arrange value (that is, *(n0, t0)* is the initial condition),\
    \ and *n* is the nonnegative integer value from our domain that we need. We use\
    \ ‘option remember’ so the program stores and can recall the previously iterated\
    \ values. Without remembering values, a simple recursion can take huge numbers\
    \ of calculations to compute a value. For example, the Fibonacci numbers given\
    \ by F(n) = F(n − 1) + F(n − 2) take on the order of 2ⁿ calculations to compute\
    \ F(n) when previous values aren’t remembered.\n\n```\n```maple\n> Tower := proc(n0,t0,n)\n\
    \      option remember;\n      local T;\n      if n > n0 then\n         T := 2\
    \ · Tower(n0,t0,n − 1) + 1;\n      else\n         T := t0;\n      end if;\n  \
    \    return T;\n   end proc:\n```\n```\n\nNow we can use **seq** with the procedure\
    \ *Tower* to generate values. (*Tower* is in the book’s *PSMv2* Maple package.)\
    \ Also, since there is a formula, we don’t have to iterate through all *n* up\
    \ to the number we want.\n\n```\n```maple\n> seq([n, Tower(1,1,n)], n = 1..64,\
    \ 7);  # Note the step size of 7\n[1, 1], [8, 255], [15, 32767], [22, 4194303],\
    \ [29, 536870911], [36, 68719476735],\n[43, 8796093022207], [50, 1125899906842623],\
    \ [57, 144115188075855871],\n[64, 18446744073709551615]\n```\n```\n\nAre the values\
    \ the same as with the formula?\n\nLet’s plot the recursion."
