- pgno: 196
  md: "![](img/0f04050177d82aebd17d3383d7334896_196_0.png)\n\nFIGURE 4.18: Complementary\
    \ Slackness Geometrically\n\n# Computational KTC with Maple\n\nFirst, we’ll step\
    \ through a solution using Maple for the computations.\n\n# Example 4.23. Two\
    \ Variable-Two Constraint Linear Problem.\n\n```\n$$\\begin{aligned}\n\\text{Maximize\
    \ } z &= 3x+2y\\\\\n\\text{subject to}\\quad &2x+y\\le 100\\\\\n&x+y\\le 80\n\\\
    end{aligned}$$\n```\n\nDefine the generalized Lagrangian (4.5) for this problem.\n\
    \n```\n$$L(x,\\lambda,\\mu)=(3x+2y)+\\lambda_1(2x+y+\\mu_1^2-100)+\\lambda_2(x+y+\\\
    mu_2^2-80)$$\n```\n\nThe six Necessary Conditions are:\n\n+   1. \\(\\partial\
    \ L/\\partial x=0\\Rightarrow 3+2\\lambda_1+\\lambda_2=0\\)  (4.7a)  \n+   2.\
    \ \\(\\partial L/\\partial y=0\\Rightarrow 2+\\lambda_1+\\lambda_2=0\\)  (4.7b)\
    \  \n+   3. \\(\\partial L/\\partial \\lambda_1=0\\Rightarrow 2x+y+\\mu_1^2-100=0\\\
    )  (4.7c)  \n+   4. \\(\\partial L/\\partial \\lambda_2=0\\Rightarrow x+y+\\mu_2^2-80=0\\\
    )  (4.7d)  \n+   5. \\(\\partial L/\\partial \\mu_1=0\\Rightarrow 2\\mu_1\\lambda_1=0\\\
    )  (4.7e)  \n+   6. \\(\\partial L/\\partial \\mu_2=0\\Rightarrow 2\\mu_2\\lambda_2=0\\\
    )  (4.7f)\n\nRecognize that, since there are two constraints, there are four (\\\
    (2^2\\)) cases required to solve for the optimal solution. These 4 cases stem\
    \ from necessary conditions \\(2\\mu_1\\lambda_1=0\\) and \\(2\\mu_2\\lambda_2=0\\\
    ), the complementary slackness conditions. The cases are collected in Table 4.7."
