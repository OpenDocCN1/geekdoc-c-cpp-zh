    For our last example in this section, we turn to an interesting and quite useful
    application of multivariate optimization: finding the least squares regression
    line fitting a data set. We’ll begin by theoretically finding the regression line
    using what we’ve developed for optimization. Then we’ll step through the computations
    in Maple to find the least squares regression line for a small data set.


    # Example 4.12. Finding the Least Squares Regression Line.


    In using least squares regression to fit a line $y=a+bx$ to a set of $n$ data
    points $\{(x_i,y_i)\}$, we minimize the sum of squared errors


    $$SSE=\sum_{i=1}^{n}\left(y_i-(a+bx_i)\right)^2.$$


    the variables are $a$ and $b$.


    Begin by finding the system of equations that will determine the critical points.
    First,


    $$\frac{\partial f}{\partial a}=\sum_{i=1}^{n}2\left(y_i-(a+bx_i)\right)(-1)$$


    $$\frac{\partial f}{\partial b}=\sum_{i=1}^{n}2\left(y_i-(a+bx_i)\right)(-x_i)$$'
  merge: -1
  img_proc: true
- pgno: 156
  md: "Then \\(\\{\\partial f/\\partial a=0,\\partial f/\\partial b=0\\}\\) holds\
    \ when the **Normal Equations for Least Squares** hold\n\n\\[na+b\\sum_{i=1}^{n}x_i=\\\
    sum_{i=1}^{n}y_i\\]\n\\[a\\sum_{i=1}^{n}x_i+b\\sum_{i=1}^{n}x_i^2=\\sum_{i=1}^{n}x_i\
    \ y_i\\]\n\nRemember, the summations are all constants once given a data set.\n\
    The Hessian is\n\n\\[H=\\begin{bmatrix}2n & 2\\sum_{i=1}^{n}x_i\\\\ 2\\sum_{i=1}^{n}x_i\
    \ & 2\\sum_{i=1}^{n}x_i^2\\end{bmatrix}\\]\n\nSo the 1st order LPMs are \\(2n\\\
    ) and \\(2\\sum_{i=1}^{n}x_i^2\\) which are both greater than 0. The 2nd order\
    \ LPM is\n\n\\[|H|=4n\\sum_{i=1}^{n}x_i^2-\\left[\\sum_{i=1}^{n}x_i\\right]^2\\\
    ]\n\nwhich can also be shown to be greater than zero. Therefore, \\(H\\) is positive\
    \ definite, and the critical point \\((a,b)\\) must be a minimum.\n\nLet’s look\
    \ at this optimization computation in Maple with a very small data set:\n\n| X\
    \ | 1 | 2 | 3 |\n|---|---:|---:|---:|\n| Y | 2 | 4.8 | 7 |\n\nOnce more, we go\
    \ right to Maple.\n\n```\nX,Y := [1,2,3],[2,4.8,7]:\nn := 3:\nsse := sum((Y_i-(a+b·X_i))^2,\
    \ i=1..n):\nSSE := unapply(sse,[a,b]):\n      sse := (-a-b+2)^2+(-a-2b+4.8)^2+(-a-3b+7)^2\n\
    \nda := D_1(SSE):\ndb := D_2(SSE):\n      da := (a,b) ↦ -27.6+6a+12b\n      db\
    \ := (a,b) ↦ -65.2+12a+28b\n\nsolve([da(a,b)=0, db(a,b)=0],[a,b]);\nCP := %1;\n\
    \      [a = -0.4000000000, b = 2.5000000000]\nCP := [a = -0.4000000000, b = 2.5000000000]\n\
    ```"
