- pgno: 368
  md: "```\nSAW(CarData, equalWeights):\n  (CarModel, fnormal(%, 3));\n\n        \
    \      Prius  Fusion  Volt  Camry  Sonata  Leaf\n              0.877  0.955  \
    \ 0.816 0.919  0.913   0.847\n              0.918  1.0     0.854 0.962  0.955\
    \   0.887\n```\n\nOur rank ordering with equal weights is Fusion, Camry, Sonata,\
    \ Prius, Volt, and Leaf.\n\nLet’s add cost to the ranking. In order to match “larger\
    \ is better,” invert cost by cᵢ → 1/cᵢ, then append this criterion to the data.\n\
    \n```\nPriceR := Price~(-1);   # the '~' applies the power to each element\n\n\
    (CarModel, fnormal(SAW([PriceR] ⟨Car⟩, {1:7/8}), 3));\n\n              Prius \
    \ Fusion  Volt  Camry  Sonata  Leaf\n              0.882  0.947   0.794 0.931\
    \  0.915   0.827\n              0.932  1.0     0.838 0.983  0.966   0.874\n```\n\
    \nAdding cost to the criteria considered changed the ranking to Fusion, Camry,\
    \ Sonata, Prius, Leaf, and Volt. Only Leaf and Volt changed places. Should cost\
    \ weigh more than other criteria?\n\nA weighting vector can be created from pairwise\
    \ preference assessments. This technique was introduced by Saaty in 1980 when\
    \ he developed the analytic hierarchy process that we’ll study in Section 8.4.\
    \ Decide which item of the pair is more important and by how much using the scale\
    \ of Table 8.8.\n\n**TABLE 8.8: Saaty’s Nine-Point Scale**\n\n| Importance level\
    \ | Definition |\n|---:|---|\n| 1 | Equal importance |\n| 2 | *Intermediate* |\n\
    | 3 | Moderate importance |\n| 4 | *Intermediate* |\n| 5 | Strong importance |\n\
    | 6 | *Intermediate* |\n| 7 | Very Strong importance |\n| 8 | *Intermediate* |\n\
    | 9 | Extreme importance |"
