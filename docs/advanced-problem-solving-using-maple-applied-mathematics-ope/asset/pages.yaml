  md: '# Assumption: We assume the two opponents are rational players.


    # Model Choice: Game Theory.


    The goal of the United States was the immediate removal of the Soviet missiles;
    U.S. policy makers seriously considered two strategies to achieve this end:


    +   1. A naval blockade (B), or "quarantine" as it was euphemistically called,
    to prevent shipment of more missiles, possibly followed by stronger action to
    induce the Soviet Union to withdraw the missiles already installed.


    +   2. A ''surgical'' air strike (A) to destroy the missiles already installed,
    insofar as possible, perhaps followed by an invasion of the island.


    The alternatives open to Soviet policy makers were:


    +   1. Withdrawal (W) of their missiles.


    +   2. Maintenance (M) of their missiles.


    We set (x, y) as (payoffs to the United States, payoffs to the Soviet Union) where
    4 is the best result, 3 is next best, 2 is next worst, and 1 is the worst. Table
    7.48 shows the payoffs.


    # TABLE 7.48: Cuban Missile Crisis Payoffs


    | | Soviet Union | |

    | | Withdraw Missiles (W) | Maintain Missiles (M) |

    | United States | Blockade (B) | (3, 3) | (2, 4) |

    | | Air Strike (A) | (4, 2) | (1, 1) |


    We show the movement diagram in Table 7.49 where we have equilibria at (4, 2)
    and (2, 4). The Nash equilibria are boxed. Note both equilibria, (4, 2) and (2,
    4) are found by our arrow diagram.


    As in Chicken, as both players attempt to get to their equilibrium, the outcome
    of the games end up at (1, 1). This is disastrous for both countries and their
    leaders. The best solution is the (3, 3) compromise position. However, (3, 3)
    not stable. This choice will eventually put us back at (1, 1). In this situation,
    one way to avoid the "chicken dilemma" is to try strategic moves.


    Both sides did not choose their strategies simultaneously or independently. Soviets
    responded to our blockade after it was imposed. The U.S. held out the chance of
    an air strike as a viable choice even after the blockade. If the U.S.S.R. would
    agree to remove the weapons from Cuba, the U.S. would agree'
