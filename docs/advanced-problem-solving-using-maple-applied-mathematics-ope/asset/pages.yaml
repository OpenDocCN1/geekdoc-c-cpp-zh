  md: "Now define the best, the ideal positive alternative, as\n\n$$A_b=\\{(\\min\\\
    {t_{ij}\\mid i=1..m;\\ j\\in J_-\\},\\ \\max\\{t_{ij}\\mid i=1..m;\\ j\\in J_+\\\
    })\\\\ \\equiv \\{t_{bj}\\mid j=1..n\\}\\},$$\n\nand the worst, the ideal negative\
    \ alternative, as\n\n$$A_w=\\{(\\max\\{t_{ij}\\mid i=1..m;\\ j\\in J_-\\},\\ \\\
    min\\{t_{ij}\\mid i=1..m;\\ j\\in J_+\\})\\\\ \\equiv \\{t_{wj}\\mid j=1..n\\\
    }\\},$$\n\n**STEP 5.** Calculate the Euclidean distances between each alternative\
    \ and the ideal positive alternative\n\n$$d_{ib}=\\sqrt{\\sum_{j=1}^{n}(t_{ij}-t_{bj})^2},\\\
    quad \\text{for } i=1..m,$$\n\nthen the ideal negative alternative\n\n$$d_{iw}=\\\
    sqrt{\\sum_{j=1}^{n}(t_{ij}-t_{wj})^2},\\quad \\text{for } i=1..m.$$\n\n**STEP\
    \ 6.** Calculate each alternative’s similarity to the worst condition\n\n$$s_{iw}=\\\
    frac{d_{iw}}{d_{iw}+d_{ib}}\\quad \\text{for } i=1..m.$$\n\nNote that $0\\le s_{iw}\\\
    le 1$ for each $i$, and that\n\n$s_{iw}=1$ iff alternative $i$ equals the ideal\
    \ positive alternative, $d_{ib}=0$; and  \n$s_{iw}=0$ iff alternative $i$ equals\
    \ the ideal negative alternative, $d_{iw}=0$.\n\n**STEP 7.** Rank the alternatives\
    \ by their $s_{iw}$ values.\n\n# Normalization\n\nWojciech Salabun¹⁰ presents\
    \ four methods of normalization: 3 methods of linear normalization and the vector\
    \ method we used in Step 2. Each method has variants for “profit” (larger is better)\
    \ and “cost” (smaller is better). Vector normalization, which uses nonlinear distances\
    \ between single dimension scores and ratios, should produce smoother trade-offs\
    \ [HwangYon1981].\n\n¹⁰W. Salabun, “Normalization of attribute values in TOPSIS\
    \ method,” Chapter 4 in Behzadian et al, *Nowe Trendy w Nauce Inżynieryjnych*,\
    \ CREATIVETIME, 2012."
