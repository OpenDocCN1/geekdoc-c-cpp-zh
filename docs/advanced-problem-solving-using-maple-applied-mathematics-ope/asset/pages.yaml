  md: 'Let’s use `rsolve` to find a general formula, and then generate a table of
    values for the DDS.


    ```

    rsolve({a(n + 1) = 0.5 · a(n) + 64, a(0) = A}, a(n));

    a := unapply(%, [A, n]);

    A (1/2)^n − 128 (1/2)^n + 128


    inits := [0, 50, 100, 150, 200]:

    gen := (i, j) → evalf₄(a(initsᵢ, j));

    DrugContTable := Matrix(10, 5, gen);

    ```


    | 64.0 | 89.0 | 114.0 | 139.0 | 164.0 |

    |---:|---:|---:|---:|---:|

    | 96.0 | 108.5 | 121.0 | 133.5 | 146.0 |

    | 112.0 | 118.2 | 124.5 | 130.8 | 137.0 |

    | 120.0 | 123.1 | 126.2 | 129.4 | 132.5 |

    | 124.0 | 125.6 | 127.1 | 128.7 | 130.2 |

    | 126.0 | 126.8 | 127.6 | 128.3 | 129.1 |

    | 127.0 | 127.4 | 127.8 | 128.2 | 128.6 |

    | 127.5 | 127.7 | 127.9 | 128.1 | 128.3 |

    | 127.8 | 127.8 | 127.9 | 128.0 | 128.1 |

    | 127.9 | 127.9 | 128.0 | 128.0 | 128.1 |


    Notice that all the sequences are converging to 128, the attracting fixed point.
    (To see more than 10 rows, first execute `interface(rtablesize=100)`.)


    # Example 2.8. An Artificial Model with an Unstable Equilibrium


    Consider a financial model where $100 is deposited each month in an account that
    pays 12% APR compounded monthly. The DDS is


    $B(n + 1) = \left(1 + \frac{0.12}{12}\right)B(n) + 100, \quad B(0) = 100.$


    Let’s first determine a formula for $B(n)$


    ```

    rsolve({B(n + 1) = (1 + 0.12/12) · B(n) + 100, B(0) = 100}, B(n));

    B := unapply(%, n);

    B := n ↦ 10100 · (101/100)^n − 10000

    ```


    The algebraic technique easily gives us the equilibrium value.


    ```

    ev := solve(ev = 1.01 · ev + 100, ev);

    ev := −10000.

    ```


    The $ev$ value is −10000. If the DDS ever achieves an input of −10000, then the
    system stays at −10000 forever. Since $100 is deposited each month and there are
    no withdrawals, the account must stay positive—we can’t reach the equilibrium
    value! We say this equilibrium value is unstable or a repelling fixed point.'
