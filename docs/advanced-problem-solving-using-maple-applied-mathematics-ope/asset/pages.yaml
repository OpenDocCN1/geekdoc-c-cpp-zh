- pgno: 9
  md: '# Preface


    From Volume I: *Advanced Problem Solving with Maple™: A First Course*


    The study of problem solving is essential for anyone who desires to use applied
    mathematics to solve real-world problems. We present problem-solving topics using
    the computer algebra system Maple™ for solving mathematical equations, creating
    models and simulations, as well as obtaining plots that help us perform our analyses.
    We present cogent applications of applied mathematics, demonstrate an effective
    use of a computational tool to assist in doing the mathematics, provide discussions
    of the results obtained using Maple, and stimulate thought and analysis of additional
    applications. This book serves as either an introductory course or capstone course,
    depending on the chapters covered, to start to prepare students to apply the mathematical
    modeling process by formulating, building, solving, analyzing, and criticizing
    mathematical models. It is intended for a first course at the sophomore or junior
    level for applied mathematics or operations research majors that introduces these
    students to mathematical topics that they will revisit within their major. This
    text can also be used for a beginning graduate-level course or as a capstone experience
    for mathematics majors as well as mathematics education majors, as modeling has
    a much bigger role in secondary education with the newest National Council of
    Teachers of Mathematics (NCTM) standards. We also introduce many additional mathematics
    topics that students may study more in depth later in their majors.


    Although calculus (either engineering or business) is the prerequisite material,
    many sections and chapters, especially in Volume II, require multivariable calculus.
    In addition, the use of linear algebra is required in some chapters. For students
    without the necessary background, these chapters can be omitted for a specific
    course. We realize that there are more chapters in this text than could ever be
    covered within one semester. The increased number of topics and chapters provides
    flexibility for designing a course appropriate to the background of your students.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Goals and Orientation


    This course bridges the study of mathematics topics and the applications of mathematics
    to various fields of mathematics, science, and engineering. This text affords
    the student an early opportunity to see how assumptions drive the models, as well
    as an opportunity to put the mathematical modeling process together. The student
    investigates real-world problems from a variety of disciplines such as mathematics,
    operations research, engineering, computer science, business, management, biology,
    physics, and chemistry. This book provides introductory material to the entire
    modeling process. Students will find themselves applying the process and enhancing
    their problem-solving capabilities, becoming competent, confident problem solvers
    for the twenty-first century. Students are introduced to the following facets
    of problem solving:


    +   - **Creative Problem Solving.** Students learn the problem-solving process
    by identifying the problem to be solved, making assumptions and collecting data,
    proposing a model (or building a model), testing their assumptions, refining the
    model as necessary, fitting the model to the data if appropriate, and analyzing
    the mathematical structure of the model to appraise the sensitivity of the results
    when the assumptions are not strictly met.

    +   - **Problem Analysis.** Given a model, students will learn to work backward
    to uncover the assumptions, assess how well those assumptions fit the scenario,
    and estimate the sensitivity of the results when the assumptions are not strictly
    met.

    +   - **Problem Research.** The students investigate a specific area to gain understanding
    of behavior and to learn how to apply or extend what has already been created
    or developed to new scenarios.


    # Course Content


    We introduce problem solving early, Volume I, *Advanced Problem Solving with Maple™.
    A First Course*, is a typical applied mathematics or introduction to operations
    research course with topics including QDES, mathematical programming, data fitting
    with regression, probabilistic problem solving, and simulation. This text, Volume
    II, contains discrete dynamical systems, both constrained and unconstrained optimization,
    linear systems, advanced regression, game theory, and multi-attribute decision
    making.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Organization of Text


    Volume I covers introductory topics. Chapter 1 of Volume I is repeated in Volume
    II, introducing Maple and its basic command structure as well as the problem-solving
    process. Because the book uses Maple as the tool in mathematical modeling, the
    chapter provides the foundation or cornerstone of using technology in the modeling
    process. In Volume I, Chapter 2 introduces ordinary differential equations, and
    Chapter 3 covers systems of ordinary differential equations. Chapter 4 covers
    linear, integer, and mixed integer programming as well as the Simplex method.
    Chapter 5 covers model fitting, concentrating on regression methods to fit data.
    Chapter 6 covers statistical and probabilistic problem solving; Chapter 7 extends
    these ideas into Monte Carlo simulations. Scenarios are developed within the scope
    of the problem-solving process. Student thought and exploration are required.


    Volume II covers more advanced topics. Chapter 1, the introduction to problem
    solving and to Maple, is repeated. Chapter 2 covers discrete dynamical systems,
    and is complementary to Chapters 2 and 3 of Volume I. Chapters 3 and 4 cover optimization,
    both constrained and unconstrained, in single-variable and multivariable topics.
    Chapter 5 deals with solving problems from engineering, economics, and chemistry
    with linear systems. Chapter 6 continues with regression but introduces more advanced
    topics such as non-linear regression, logistic regression, and Poisson regression.
    Chapter 7 covers game theory and relies heavily on linear and non-linear programming
    methods. Chapter 8 completes Volume II by discussing multi-attribute or multi-criteria
    decision making with methods such as Data Envelopment Analysis (DEA), Simple Additive
    Weighting (SAW), Analytic Hierarchy Process (AHP), and Technique of Order Preference
    by Similarity to the Ideal Solution (TOPSIS), and finishes with investigating
    methods of choosing weightings.


    # Student Projects


    Student projects form the backbone of this course. In each project, students apply
    the mathematical modeling process and the mathematical tools they have learned.
    Each chapter and many sections have collections of student projects. We have seen
    significant student growth over the course of a semester in project reports from
    their first project to the final submission. Student projects take time to apply
    the modeling process, so we typically do not assign more than one project to a
    student. Most of these projects are designed to be group projects with two or
    three students working together, although they can'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'be done as individual projects with strong students. COMAP’s Mathematical Contest
    in Modeling¹ provides a rich source of further significant projects.


    # Technology


    Technology is fundamental to serious mathematical modeling. We chose the computer
    algebra system Maple as our platform for this text; any technology could be used—from
    graphing and symbolic calculators to spreadsheets.


    # Emphasis on Numerical Approximations


    Numerical solutions techniques are used for solving dynamical systems, for explicative
    modeling with some numerical analysis approaches, and in optimization search procedures.
    These are the methods most easily employed in iterative and recursive formulas.
    Early on, the student is exposed to numerical techniques. We present numerical
    procedures as iterative and algorithmic.


    # Focus on Algorithms


    All algorithms are provided with step-by-step formats to aid students in learning
    to do mathematical modeling with these methods and Maple. Examples follow the
    summary to illustrate an algorithm’s use and application. Throughout, we emphasize
    the process and interpretation, not the rote use of formulas.


    # Problem Solving and Applications


    Each chapter includes examples of models, real-world applications, and problems
    and projects. Problems are modeled, formulated, and solved within the scenario
    of the application. These models and applications play an important role in student
    growth in working in today’s complex world.


    ¹ See https://www.comap.com/undergraduate/contests/matrix/index.html'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Exercises


    Exercises are provided at the end of each section and chapter so the student can
    practice the solution techniques and work with the mathematical concepts discussed.
    Review problems are given at the end of each chapter, some of which combine elements
    from several chapter sections. Projects are also provided at the end of each chapter
    to enhance student understanding of the concepts and their application to real-world
    problems.


    # Computer Usage


    Maple is the computer algebra system used for this text. Tutorial labs are widely
    available for learning Maple’s syntax and command structure. Our emphasis is on
    providing the student with the ability to use Maple to assist with mathematical
    modeling. We illustrate graphing in both two and three dimensions. We provide
    Maple packages *PSM* and *PSM𝜇2* containing programs, functions, and data to use
    with each volume. The packages are freely available from the Maple Cloud (https://maple.cloud).


    # Acknowledgments


