  md: 'Maple’s help database also includes a mathematical encyclopedia. Try entering


    ```

    > ? Definition, integral

    ```


    # Data Entry


    Commonly, a set of data will describe a process. Entering the data is the first
    step to analyzing the data. Maple provides a convenient method for manually entering
    data via a list. A list is a group of data to which Maple’s many operations are
    applied. Suppose a group of five college students’ weights are known to be 185,
    202, 225, 195, and 145. We demonstrate the command required to enter the data
    into Maple.


    ```

    > weights := [185, 202, 225, 195, 145];


    weights := [185, 202, 225, 195, 145]

    ```


    The use of brackets in the command indicates a list. The brackets will maintain
    the initial ordering of the data and allows for duplicate values, and may be manipulated
    by the methods described later in this book. Commas are required between the list
    elements. Any alphanumeric element may be included in a list; integers, rational
    numbers, decimals, strings, variable names, and expressions are all allowed. If
    any data should be missing, a place holder can be entered in its place, such as
    the letter x. If there was a sixth student in the group with an unknown weight,
    a symbol could be used to represent the sixth student’s weight.


    ```

    > weights := [185, 202, 225, 195, 145, x];


    weights := [185, 202, 225, 195, 145, x]

    ```


    # Data Entry and Verification


    The Maple lines below illustrate entering, verifying, and naming data pertaining
    to the length and weight of bass caught during a fishing derby. In subsequent
    chapters, several models for predicting the weight of a snook fish as a function
    of length of the fish is suggested. We enter the data in rows. The data is printed
    to verify correct entry.


    ```

    > length_inches := [12, 14, 12.5, 16, 21.5];


    length_inches := [12, 14, 12.5, 16, 21.5]


    > weight_oz := [15, 21, 10, 33, 41];


    weight_oz := [15, 21, 10, 33, 41]

    ```'
