  md: 'Or, just the kicker''s prospective, see Table 7.11.


    # TABLE 7.11: Kicker''s Penalty Kick Payoffs


    | | Goalie | |

    | | Dive Left | Dive Right |

    | Kicker | Kick Left | -1 | 1 |

    | | Kick Right | 1 | -1 |


    There is no pure strategy. We find a mixed strategy solution to the zero-sum game
    using either linear programming or the method of oddments. The mixed strategy
    results are that the kicker randomly kicks 50% left and 50% right, while the goalie
    randomly dives 50% left and 50% right. The value of the game to each player is
    0.


    Let''s refine the game using real data. A study was done in the Italian Football
    League in 2002 by Ignacio Palacios-Huerta. As he observed, the kicker can aim
    the ball to the left or to the right of the goalie, and the goalie can dive either
    left or right as well. The ball is kicked with enough speed that the decisions
    of the kicker and goalie are effectively made simultaneously. Based on these decisions,
    the kicker is likely to score or not score. The structure of the game is remarkably
    similar to our simplified game. If the goalie dives in the direction that the
    ball is kicked, then he has a good chance of stopping the goal; if he dives in
    the wrong direction, then the kicker is likely to score a goal.


    After analyzing approximately 1400 penalty kicks, Palacios-Huerta determined the
    empirical probabilities of scoring for each of four outcomes: the kicker kicks
    left or right, and the goalie dives left or right. His results led to the payoff
    matrix in Table 7.12.


    # TABLE 7.12: Penalty Kick Probabilities of Scoring


    | | Goalie | |

    | | Dive Left | Dive Right |

    | Kicker | Kick Left | (0.58, −0.58) | (0.95, −0.95) |

    | | Kick Right | (0.93, −0.93) | (0.70, −0.70) |'
