    # Example 6.2. Multiple Linear Regression.


    Fit a parabolic model f(x) = a0 + a1x + a2x² to the Hospital Stay vs. Recovery
    Index Data of Table 6.3.


    This model, although a parabola, is linear in the “variables” a0, a1, and a2.


    Let’s find the fit with Maple.


    ```

    > with(Statistics):

    > Fit(a0 + a1·x + a2·x², t, y, x):

    > QF := unapply(evalf(%), x);

    QF := x -> 55.82 − 1.710x + 0.01481x²

    ```


    Use the formula R S = 1 − S S E / S S T to compute R², the coefficient of determination
    for the quadratic fit.


    ```

    > SSE := sum((y_i − QF(t_i))², i = 1..15);

    > μ := Mean(y):

    > SST := sum((y_i − μ)², i = 1..15);

    SSE := 72.34557123

    SST := 3943.333333

    > RSq := 1 − SSE/SST;

    RSq := 0.9816537013

    ```


    These diagnostics look quite good. The sum of the squares of the errors is much
    smaller. The coefficient of determination R² is larger, and the correlation has
    increased to 0.99.


    Let’s plot the new residuals to see if there is still a curved pattern.


    ```

    > QRResidualPts := [seq([t_i, y_i − QF(t_i)], i = 1..15)]:

    ```'
