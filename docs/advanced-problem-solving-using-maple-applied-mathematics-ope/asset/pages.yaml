  md: "# Fibonacci Search\n\nA Fibonacci search uses the ratio of Fibonacci numbers\
    \ to generate a sequence of test points based on the expression\n\n$$F_n = F_{n-1}\
    \ + F_{n-2} \\quad \\Longrightarrow \\quad 1 = \\frac{F_{n-1}}{F_n} + \\frac{F_{n-2}}{F_n}.$$\n\
    \nSince $\\lim_{n\\to\\infty} F_{n-1}/F_n$ equals the golden ratio, A Fibonacci\
    \ search is a Golden Section search “in the limit.” However, a Fibonacci search\
    \ converges faster than a Golden Section search.\n\nIn order to use the Fibonacci\
    \ search procedure, we must ensure that the key assumptions hold:\n\n+   1. The\
    \ function must be unimodal over a specified interval,\n+   \n+   2. The function\
    \ must have an optimal solution over a known interval of uncertainty, and\n+ \
    \  \n+   3. We will accept an interval solution since the exact optimal value\
    \ cannot be found by bracketing, only approximated.\n\nThese are the same assumptions\
    \ as required for a Golden Section search—the two searches are closely related\
    \ bracketing methods.\n\nAs before, only an interval solution—the final interval\
    \ of uncertainty—can be found using this or any bracketing technique. The length\
    \ of the final interval or tolerance value is controllable by the user, and can\
    \ be made arbitrarily small restricted only by the precision of the computations\
    \ and the computing time available. The final interval is guaranteed to be less\
    \ than this tolerance value within a specific number of iterations.\n\nReplace\
    \ the golden ratio $r$ in the test point generating formulas of the Golden Section\
    \ search with the ratio of Fibonacci numbers to obtain\n\n$$x_1 = a + \\frac{F_{n-2}}{F_n}\\\
    ,(b-a)$$\n\n$$x_2 = a + \\frac{F_{n-1}}{F_n}\\,(b-a)$$\n\nThese are the Fibonacci\
    \ search test point generators. The test points must lie inside the original interval\
    \ $[a,b]$ since $a < x_1 < x_2 < b$, and will determine the new search interval\
    \ in the same fashion as a Golden Section search.\n\nIf $f(x_1) < f(x_2)$, then\
    \ the new interval is $[x_1,b]$.\n\nIf $f(x_1) > f(x_2)$, then the new interval\
    \ is $[a,x_2]$.\n\nEquality means calculation precision is exceeded or a calculation\
    \ error has occurred.\n\nThe iterations continue until the final interval length\
    \ is less than our imposed tolerance. Our final interval must contain the optimum\
    \ solution. The"
