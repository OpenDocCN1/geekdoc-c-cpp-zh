- pgno: 69
  md: 'We will study equilibrium values in many of the applications of discrete dynamical
    systems. In general, a linear nonhomogeneous discrete dynamical system, where
    the nonhomogeneous part is a constant, will have an equilibrium value. Can you
    find any exceptions? A linear homogeneous discrete dynamical system will always
    have an equilibrium value of zero. Why?


    # 2.5  A Graphical Approach to Equilibrium Values


    We can examine a graph of the DDs’s iterations using Maple. If the values reach
    a specific value and remain constant, the graph levels, then that value is an
    equilibrium value (change has stopped).


    Dynamical systems often represent real-world behavior that we are trying to understand.
    We model reality to be able to predict future behavior and gain deeper insights
    into the behavior and how to influence or alter that behavior. Thus, we have great
    interest in the predictions of the model. Understanding how the model changes
    in the future is our goal.


    # Models of the Form: $a(n+1)=r\cdot a(n)+b$ with Constant $r$ and $b$


    Consider a savings account with 12% APR interest compounded monthly where we deposit
    $1000 per month. Repeating our earlier analysis, but adding the monthly deposit.
    (Remember to start with a fresh Maple worksheet, then load the plots package.)


    ```

    DDS := a(n+1) = \left(1 + \frac{0.12}{12}\right)\cdot a(n) + 1000;

    ```


    ```

    rsolve({DDS, a(0) = 0}, a(n));


    a := unapply(%, n);


    a \mapsto 101000\left(\frac{101}{100}\right)^n - 100000

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: '```

    pts := {seq([k, a(k)], {k = 0..24})}\npointplot(pts, title = “Savings Account
    with Monthly Deposit”);

    ```


    ![](img/0f04050177d82aebd17d3383d7334896_70_0.png)


    The DDS $a(n+1)=1.01a(n)+1000$, with $r=1.01>1$, grows without bound. The graph
    suggests that there is no equilibrium value—a value where the graph levels at
    a constant value. Analytically, we have $ev=1.01ev+1000 \Longrightarrow ev=-10000$.
    There is an equilibrium value $ev=-10000$, but that value will never be reached
    in our savings account problem. Without withdrawals, the savings account can never
    be $100,000$ in the hole!


    What happens if $r$ is less than 0?


    Proceed as before, but with a negative $r$. The new DDS is


    $$a(n+1)=-1.01a(n)+1000$$


    with $a(0)=0$. Analytically solve for the equilibrium value.


    $$ev=-1.01ev+1000$$\n$$ev=497.5124378$$


    The definition of equilibrium value implies that if we start at $a(0)=497.5124378$,
    we stay there forever. From the plot of the DDS in Figure 2.7, we note the oscillations
    between positive and negative numbers, each growing without bound as the oscillations
    fan out. Although there is an equilibrium value, the solution to our example does
    not tend toward this fixed point.'
