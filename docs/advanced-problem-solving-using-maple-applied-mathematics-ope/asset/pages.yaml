  md: 'appropriately. Given the right conditions, this numerical method is more efficient
    and converges faster to an approximate optimal solution: **quadratic convergence**
    versus the **linear convergence** of steepest ascent.


    Newton’s Method for multivariable optimization searches is based on the single-variable
    root-finding algorithm. Modify the procedure to look for roots of the first derivative
    rather than roots of the original function:


    $$x_{n+1}=x_n+\frac{f(x_n)}{f''(x_n)}\ \Longrightarrow\ x_{n+1}=x_n+\frac{f''(x_n)}{f''''(x_n)}$$


    and iterate until $|x_{n+1}-x_n|<\epsilon$ for our chosen tolerance $\epsilon>0$.


    Extend the Modified Newton’s Method to several variables by using gradients and
    the Hessian, the matrix of second partial derivatives.


    $$x_{n+1}=x_n+\left(f''''(x_n)\right)^{-1}f''(x_n)\ \Longrightarrow\ x_{n+1}=x_n+\left(H(x_n)\right)^{-1}\nabla
    f(x_n)$$


    now iterating until $\|x_{n+1}-x_n\|<\epsilon$ for our chosen tolerance $\epsilon>0$.
    Applying a little bit of linear algebra gives us the method as an algorithm.


    ```

    **Modified Newton’s Method Algorithm**


    Find the unconstrained maximum of the function $f:\mathbb{R}^n\to\mathbb{R}$.


    **INPUTS:**


    - Function: $f$

    - Starting point: $x_0$

    - Tolerance and Maximum Iterations: $\epsilon, N$


    **OUTPUTS:** Maximal point $x^*$ and maximum value $f(x^*)$


    **Step 1.** Initialize: Set $x=x_0$


    **Step 2.** Calculate the gradient $\mathbf{g}=\nabla f(x)$ and $H=$ Hessian$(x)$


    **Step 3.** Compute $d=|H|$ and create new matrices


    $$H_1=\text{substitute }\mathbf{g}\text{ for column 1 of }H$$

    $$H_2=\text{substitute }\mathbf{g}\text{ for column 2 of }H$$


    **Step 4.** Compute: $\Delta x_1=|H_1|/d$ and $\Delta x_2=|H_2|/d$.


    **Step 5.** Find the new point $x_{new}=\langle x_1+\Delta x_1,x_2+\Delta x_2\rangle$


    **Step 6.** If $\|\langle\Delta x_1,\Delta x_2\rangle\|<\epsilon$, then STOP and
    return estimates $x^*=x_{new}$ and $f(x_{new})$.


    Otherwise, set $x=x_{new}$ and return to Step 2.

    ```


    Again, remember that $\|y\|=\|\langle y_1,y_2\rangle\|=\sqrt{y_1^2+y_2^2}$. Let’s
    repeat our examples for the steepest ascent method using Newton’s method. We’ll
    use the function $ModifiedNewtonMethod$ which is in the book’s'
