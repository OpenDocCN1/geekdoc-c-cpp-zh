- pgno: 47
  md: '# 2


    # Discrete Dynamical Models


    **Objectives:**


    +   1. Define and build a discrete dynamical system for a real problem.

    +   2. Iterate a solution.

    +   3. Graph a solution.

    +   4. Understand equilibrium values and stability.

    +   5. Solve both linear and nonlinear systems of discrete dynamical systems.

    +   6. Solve systems of discrete dynamical systems.


    # 2.1  Introduction


    Consider a disease that is spreading throughout the Unites States such as a new
    influenza or flu. The U.S. Centers for Disease Control and Prevention (CDC) is
    interested in knowing and experimenting with a model for this new disease prior
    to it actually becoming a “real” epidemic.¹ Let us consider the population being
    divided into three categories: susceptible (able to catch this new flu), infected
    (currently has the flu and is contagious), and removed (already had the flu and
    will not get it again, or has died from the flu). We make the following assumptions
    for our model:


    +   - No one enters or leaves the community.

    +   - There is no contact outside the community.

    +   - Each person is either susceptible $S$, infected $I$, or removed $R$.

    +   - Initially, every person is either an $S$ or an $I$.

    +   - Once someone gets the flu this year, they cannot get it again (‘developed
    immunity’).


    > ¹ The CDC website “FluView” monitors the current situation in the U.S.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - The average length of the disease is 2 weeks over which the person is
    deemed infected and can spread the disease.

    +   - The time step for the model will be one week.


    Can we build a model to determine useful information to the CDC? We will revisit
    this model later in the chapter.


    # 2.2  Modeling with Dynamical Systems²


    Buying a new car is a major purchase. Once you have looked at the makes and models
    to determine what type of car you like, it’s time to consider the “costs” and
    finance packages available. Payments are made typically at the end of each month.
    The amount owed is predetermined depending on the total price of the car, fees
    and charges, and the interest rate of a loan. This process can be modeled as a
    dynamical system.


    Another name for a discrete dynamical system (DDS) is a “difference equation.”
    We will use DDS extensively in this chapter. Let’s begin with basic definitions:


    A sequence is a function whose domain is the set of all nonnegative integers and
    whose range is a subset of the real numbers. A dynamical system is a relationship
    among the terms in a sequence; a DDS describes the evolution of an item over time.
    A numerical solution is a table of values satisfying the dynamical system.


    Let’s start with a brief review of the concepts of ‘relation’ and ‘function’ since
    these are foundational in the definition above. A relation is a set of ordered
    pairs, often written as (input, output). As an ordered pair, a relation can indicate
    how one variable depends on another. The domain of a relation is the set of all
    first coordinates of the ordered pairs, the range is the set of all second coordinates
    of the ordered pairs. A function is a special type of relation. A function is
    a relation for which each element in the domain has exactly one related element
    in the range. The domain of a function is the set of all of the independent variables
    (allowed inputs) and the range is the set of all possible dependent values (outputs).


    The concepts of function, domain, and range can be seen clearly in a dynamical
    system model. Let’s define a recurrence relation, a relation where the next term
    depends on the previous values, as an equation of the form


    ```

    $$a(n+1)=f(a(n),a(n-1),\ldots,a(0),n)\qquad\text{or}\qquad a_{n+1}=f(a_n,a_{n-1},\ldots,a_0,n).$$

    ```


    Using subscripts for arguments makes the notation much more compact and easy to
    read.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Recurrence relations, also called recursive formulas, occur in many branches
    of applied mathematics. A **discrete dynamical system** (DDS or *difference equation*)
    is a sequence defined by a recurrence relation. A DDS is a “changing system,”
    where the change of the system at each discrete iteration depends on its previous
    states. Suppose we have a function $y=f(x)$. A *first-order* discrete dynamical
    system is given by the sequence of numbers $a(n)$ for $n=0,1,\ldots$ such that
    each number after the first is related to the previous number by


    $$a(n+1)=f(a(n)).$$


    (Many books and articles refer to the relationship $a(n+1)-a(n)=g(a(n))$ as a
    *first-order difference equation*.)


    The *order* of a dynamical system is the difference between the largest and the
    smallest arguments (or variable of the function) appearing in the formula. For
    example, $A(n+2)=0.5A(n+1)+2A(n)$ is a second order DDS because $n+2$, the largest
    argument, minus $n$, the smallest, gives $(n+2)-n=2$.


    # **Example 2.1. A Simple First-Order Discrete Dynamical System.**


    Define the dynamical system $A$ to be the amount of antibiotic in a patient’s
    blood stream after $n$ time periods. The domain is the nonnegative integers representing
    the time periods from 0, 1, 2, $\ldots$, $n$ that will be the inputs to the function.
    Since the domain is discrete, we have a DDS. The range is the set of values of
    $A(n)$ determined for each value of the domain. Thus, $A(n)$ also represents the
    dependent variable. For each input value of the domain from 0, 1, 2, $\ldots$,
    $n$, the result is one and only one amount $A(n)$, thus $A$ is a function.


    There are three components to a dynamical system:


    +   - a formula for the sequence representing $A(n)$,

    +   - the time period $n$ is well defined, and

    +   - at least one starting value $(n_0,A(n_0))$. (The number of required starting
    values corresponds to the order of the DDS.)


    The starting value set is called the **initial condition(s)**. In the example
    above, if we start with no antibiotic in our system then $A(0)=0$ mg is our initial
    condition. However, if we started after we took an initial 200 mg tablet, then
    $A(0)=200$ mg would be our initial condition. An example of a discrete dynamical
    system with its initial condition would be:


    $$A(n+1)=0.5A(n)$$

    $$A(0)=200$$


    We are mainly concerned with one of several aspects of a DDS: Does the DDS have
    a stable equilibrium? What is the value of the system after period $n$ for a specified
    $n$. What is the long-term behavior for the DDS?


    Next, let’s look at Maple commands that can assist us with investigating a DDS.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Maple Commands for Discrete Dynamical Systems


    We will use familiar commands and libraries from Maple such as *plots*, and we
    will add new commands to our Maple tool box.


    ```

    **rsolve** – *recurrence equation solver*


    Calling Sequence


    `rsolve(eqns, f, n)`


    `rsolve(eqns, f(n), ‘genfunc’(z))`


    `rsolve(eqns, f(n), ‘ztransform’(z))`


    `rsolve(eqns, f(n), ‘series’)`


    Parameters


    eqns – single equation or a set of equations


    fcn – function name or set of function names


    z – name, the generating function variable

    ```


    ```

    **seq** – *create a sequence*


    Calling Sequence


    `seq(f, m..n)`


    `seq(f, i = m..n)`


    `seq(f, i = m..n, step)`


    `seq(f, i = x)`


    Parameters


    f – any expression


    i – name


    m, n – numerical values


    x – expression


    step – (optional) numerical value

    ```


    Look at Maple’s help pages for *rsolve* and *seq* for detailed information and
    to see many examples.


    Several of the models that we will solve have closed-form solutions; we can use
    *rsolve* to obtain a formula, then we can use *seq* to obtain numerical values
    of the solution.


    Many dynamical systems do not have closed-form analytical solutions, so we cannot
    use *rsolve* and *seq* to obtain solutions. When this occurs, we will write a
    small program using **proc** to obtain the numerical solutions through iteration.
    To graph the solution of the dynamical systems, we will use plot commands to see
    sequential data pairs (k, A(k)). We will illustrate map use in our examples in
    the next section.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 2.3 Linear Systems


    We are interested in modeling discrete change. Modeling with discrete dynamical
    systems employs a method to explain certain discrete behaviors or make long-term
    predictions. A powerful paradigm that we use to model with discrete dynamical
    systems is:


    future value = present value + change


    The dynamical systems that we will study with this paradigm will differ markedly
    in appearance and composition, but we will be able to solve a large class of these
    "seemingly" different dynamical systems with similar methods. In this chapter,
    we will use iteration and graphical methods to answer questions about discrete
    dynamical systems.


    We will use flow diagrams to help us see how the dependent variable changes. Flow
    diagrams help to see the paradigm and to put the problem into mathematical terms.
    Let''s consider financing a new Ford Mustang. The total cost is $25,000. We can
    put down $2,000, so we need to finance $23,000. The dealership offers us 2% APR
    financing over 72 months. Consider the flow diagram for financing the car below
    in Figure 2.1 that depicts this situation.


    ![](img/0f04050177d82aebd17d3383d7334896_51_0.png)


    FIGURE 2.1: Car Financing Flow Diagram


    We''ll use the flow diagram to help build the discrete dynamical model. Let A(n)
    = the amount owed after n months. Notice that the arrow pointing into the Amount
    Owed is the interest which increases the unpaid balance. The arrow pointing out
    of the oval is the monthly payment which decreases the debt.


    A(n + 1) = amount owed next month (future)

    A(n) = amount currently owed (present)

    i = monthly interest rate

    P = monthly payment


    then our paradigm future = present + change gives


    A(n + 1) = A(n) + (i · A(n) − P)


    We will model dynamical systems that have constant coefficients. For example,
    a third-order discrete dynamical system with constant coefficients'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'that is homogeneous may be written in the form


    $$a(n+3)=b_2a(n+2)+b_1a(n+1)+b_0a(n)$$


    where $b_0$, $b_1$, and $b_2$ are arbitrary constants. If we added a term not
    involving $a(n)$ to the right side, this DDS would be nonhomogeneous.


    The “Tower of Hanoi” puzzle, that we will illustrate shortly, involves moving
    a tower of disks from one pole to another. The number of discrete moves $H(n)$
    that it takes to move $n$ disks depends on the number of discrete moves it took
    to move $n-1$ disks. For the drug dosage model of Example 2.1, the model shows
    the amount of drug in the bloodstream after $n$ hours depends on the amount of
    drug in the bloodstream after $n-1$ hours. For financial matters, such as our
    Mustang purchase, the amount we still owe after $n$ months depends upon the amount
    we owed after $n-1$ months. We will also find this process based on transitioning
    states useful when we discuss *Markov chains* as an example of a discrete dynamical
    system.


    Recall that a *first-order* DDS is a system where the next iteration $a(n)$, the
    state of the system after $n$ iterations, is related only to the previous iteration
    $a(n-1)$ by the relation


    $$a(n)=f\bigl(a(n-1)\bigr);$$


    i.e., $a(n)$ is a function of only $a(n-1)$ for $n=2,3,\ldots$. For example, $a(n)=2a(n-1)$
    is a first-order DDS. If the function $f$ involves a function of $a(n)$, just
    a constant multiple of $a(n)$, a constant coefficient, we will say that the discrete
    dynamical system is *linear*. If the function $f$ involves powers (like $a(n)^2$),
    or a functional relationship (like $a(n)/a(n-1)$ or $\sin(a(n-1))$), we will say
    that the discrete dynamical system is *nonlinear*.


    # **Example 2.2. Iteration with the Tower of Hanoi.**


    The Tower of Hanoi puzzle was invented in 1883 by the French mathematician Édouard
    Lucas (1842-1891) under the pseudonym “Professor N. Claus (of Siam)” from the
    Mandarin of the College of Li-Sou-Stian.”³ The puzzle consists of a board with
    three upright pegs and disks (now usually 6 to 10) with successively smaller outside
    diameters. The disks begin on the first peg with the largest disk on the bottom,
    topped by the next largest disk, and so on up to the smallest disk on top forming
    a tower or pyramid as we see in Figure 2.2.


    The object of the game is to transfer the disks, one at a time, using the smallest
    possible number of moves, to the third peg to form an identical pyramid. During
    each transfer step, a larger disk may not be placed on top of a smaller disk—this
    is why a second and third pegs are needed. Lucas’ original game rules were the
    following.


    > ³The puzzle is also called the “Tower of Brahma” or the “Tower of Lucas.” There
    are several intriguing legends about the game. See Paul Stockmeyer’s webpage http://www.cs.wm.edu/~pkstot/tob.html
    for the original game box and instructions.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "![](img/0f04050177d82aebd17d3383d7334896_53_0.png)\n\nFigure 2.2: Tower of\
    \ Hanoi Puzzle¹\n\nThe game consists of moving this, by threading the disks on\
    \ another peg, and by moving only one disk at a time, obeying the following rules:\n\
    \n+   I. After each move, the disks will all be stacked on one, two, or three\
    \ pegs, in decreasing order from the base to the top.\n+   \n+   II. The top disk\
    \ may be lifted from one of the three stacks of disks, and placed on a peg that\
    \ is empty.\n+   \n+   III. The top disk may be lifted from one of the three stacks\
    \ and placed on top of another stack, provided that the top disk on that stack\
    \ is larger.\n\nLucas’ original La Tour d’Hanoi game had eight disks. The puzzle\
    \ was a model to illustrate moving the legendary “Sacred Tower of Brahma,” which\
    \ actually had “sixty-four levels in fine gold, trimmed with diamonds.” This tower\
    \ was attended by monks of the Temple of Bernares who moved one disk a minute\
    \ according to the long-established ritual that no larger disk could be placed\
    \ on a smaller disk. The monks believed, so Lucas’s story went, that as soon as\
    \ all sixty-four disks were transferred, the earth would collapse in a cloud of\
    \ dust.\n\nThis legend is somewhat alarming, so let’s use induction to find a\
    \ formula for the number of moves required to transfer n disks from the first\
    \ peg to the third peg. Suppose that we have n + 1 disks. Then we can move n smaller\
    \ disks from the first peg to the second peg in a(n) moves, the number of moves\
    \ for n disks. Then we move the largest disk from the first peg to the third peg.\
    \ Finally we move the n smaller disks from the second peg to the third peg in\
    \ a(n) moves. Therefore, a(n+1) = a(n)+1+a(n) = 2a(n)+1. So the recursion relation\
    \ that gives the number of moves required is a(n + 1) = 2a(n) + 1; the initial\
    \ value is a(1) = 1, meaning that we start with the case where there is only one\
    \ disk to move. Figure 2.3 shows a plausible flow diagram for the Tower of Hanoi."
