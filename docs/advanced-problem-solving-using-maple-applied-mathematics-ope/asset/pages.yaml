  md: "# TABLE 4.2: Summary of Hessian Definiteness\n\n| Determinants: $H_k = k$ order\
    \ leading principal minors | Results | Conclusions About the Stationary Point\
    \ |\n|---|---|---|\n| All $H_k > 0$ | Positive Definite, $f$ is convex | minimum\
    \ |\n| All $H_k \\geq 0$ | Positive Semi-Definite, $f$ is convex | local minimum\
    \ |\n| $\\operatorname{sgn}(H_k)=\\operatorname{sgn}((-1)^k)$ | Negative Definite,\
    \ $f$ is concave | maximum |\n| $\\operatorname{sgn}(H_k)=\\operatorname{sgn}((-1)^k)$\
    \ or some, not all, $H_k=0$ | Negative Semi-Definite, $f$ is concave | local maximum\
    \ |\n| $H_k$ not all 0, but none of the above | Indefinite, $f$ is neither | saddle\
    \ point |\n| $H_k=0$ for all $k$ | Indefinite | *inconclusive* |\n\n# **Example\
    \ 4.7.** Using the Summary Table.\n\n+   1. Suppose the Hessian of the function\
    \ $f(x_1,x_2)$ is given by\n+   \n+   $$H(x_1,x_2):=\\begin{bmatrix}-2 & -1\\\\\
