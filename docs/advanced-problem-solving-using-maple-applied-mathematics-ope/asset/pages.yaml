- pgno: 276
  md: "Maple’s *NonlinearFit* could not optimize the regression. Let’s try our *NonlinearRegression*.\n\
    \n```\nwith(PSMv2):\n\nNonlinearRegression(CivilianCasualtyPercent, WinLose, model,\n\
    [a = −1.9, b = 0.05]);\nIn Fit\nIn NonlinearFit (algebraic form)\nLSSolve: calling\
    \ nonlinear LS solver\nLSSolve: using method=modifiednewton\nLSSolve: number of\
    \ problem variables 2\nLSSolve: number of residuals 25\nattemptsolution: conditions\
    \ for a minimum are not all satisfied, but\na better point could not be found\n\
    \n                 Coefficient   Standard Error   T-Statistic   P-value\n    \
    \             a   1.9305       2.6384          0.73170      0.47174\n        \
    \         b  −0.044361     1.8723         −0.023693     0.98130\n\n          \
    \               e^1.9305 x −0.044361\n                 Model: m(x) = ----------------\n\
    \                                1 + e^1.9305 x −0.044361\n```\n\nThis logistic\
    \ model result appears much better at first look. However, the coefficients’ P-values\
    \ tell us to have no confidence in the model. *Graph the model with the data!*\n\
    \n*Analysis Interpretation:* The conclusion from our analysis is that the civilian\
    \ casualty percentages are not significantly correlated with whether the conflict\
    \ leads to a win or a loss for Side A. Therefore, from this initial study, we\
    \ can loosely conclude that dehumanization does not have a significant effect\
    \ on the outcome of a state’s ability to win or lose a conflict. Further investigation\
    \ will be necessary.\n\n# One-Predictor Poisson Regression\n\nAccording to Devore\
    \ [2012], the *simple linear regression model* is defined by:\n\nThere exists\
    \ parameters β₀, β₁, and σ², such that for any fixed input value of x, the dependent\
    \ variable is a random variable related to x through the *model equation* Y =\
    \ β₀ + β₁x + ε. The quantity ε in the model equation is the “error”—a random variable\
    \ assumed to be normally distributed with mean 0 and variance σ².\n\nWe expand\
    \ this definition to when the response variable y is assumed to have a normal\
    \ distribution with mean μᵧ and variance σ². We found that the mean could be modeled\
    \ as a function of our multiple predictor variables, x₁, x₂, …, xₙ, using the\
    \ linear function Y = β₀ + β₁x₁ + β₂x₂ + ··· + βₖxₖ."
  merge: -1
  img_proc: true
- pgno: 277
  md: "+   The key assumptions for least squares are\n+   \n+   - the relationship\
    \ between dependent and independent variables is linear,\n+   - errors are independent\
    \ and normally distributed, and\n+   - homoscedasticity[^10] of the errors.\n\n\
    If any assumption is not satisfied, the model’s adequacy is questioned. In first\
    \ courses, patterns seen or not seen in residual plots are used to gain information\
    \ about a model’s adequacy. (See [A19978], [D2012]).\n\n# Normality Assumption\
    \ Lost\n\nIn logistic and Poisson regression, the response variable’s probability\
    \ lies between 0 and 1. According to Neter [NKNW1996], this constraint loses both\
    \ the normality and the constant variance assumptions listed above. Without these\
    \ assumptions, the F and t tests cannot be used for analyzing the regression model.\
    \ When this happens, transform the model and the data with a logistic transformation\
    \ of the probability p, called logit p, to map the interval [0, 1] to (−∞, +∞),\
    \ eliminating the 0–1 constraint:\n\n$$\\ln\\left(\\frac{p}{1-p}\\right)=\\beta_0+\\\
    beta_1x_1+\\beta_2x_2+\\cdots+\\beta_nx_n$$\n\nThe βs can now be interpreted as\
    \ increasing or decreasing the “log odds” of an event, and exp(β) (the “odds multiplier”)\
    \ can be used as the odds ratio for a unit increase or decrease in the associated\
    \ explanatory variable.\n\nWhen the response variable is in the form of a count,\
    \ we face a yet different constraint. Counts are all positive integers corresponding\
    \ to rare events. Thus, a Poisson distribution (rather than a normal distribution)\
    \ is more appropriate since the Poisson has a mean greater than 0, and the counts\
    \ are all positive integers. Recall that the Poisson distribution gives the probability\
    \ of y events, occurring in time period t as\n\n$$P(y;\\mu)=\\frac{\\exp(-\\mu\
    \ t)\\cdot(\\mu t)^y}{y!}.$$\n\nThen the logarithm of the response variable is\
    \ linked to a linear function of explanatory variables.\n\n$$\\ln(Y)=\\beta_0+\\\
    beta_1x_1+\\beta_2x_2+\\cdots+\\beta_nx_n$$\n\nThus\n\n$$Y=(e^{\\beta_0})(e^{\\\
    beta_1x_1})(e^{\\beta_2x_2})\\cdots(e^{\\beta_nx_n}).$$\n\nIn other words, a Poisson\
    \ regression model expresses the “log outcome rate” as a linear function of the\
    \ predictors, sometimes called “exposure variables.”"
  merge: -1
  img_proc: true
