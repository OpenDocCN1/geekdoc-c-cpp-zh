  md: '![](img/0f04050177d82aebd17d3383d7334896_251_0.png)


    **FIGURE 6.1:** Patterns in the Residual Plot


    A *statistical definition* in the context of linear regression is given in terms
    of *Pearson’s product-moment correlation coefficient*, often reduced to *correlation
    coefficient*, or even just *correlation,*


    correlation is a measure of the strength of the linear relationship between two
    variables.⁴


    *Linear relationship* is a key term in the definition. Some definitions for correlation
    merely state it is a measure of the relationship between two variables,'
