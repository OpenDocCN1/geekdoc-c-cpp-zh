  md: 'We can also use this method to determine the mortgage payment. The DDs is now


    $$B(n+1)=1.00541667B(n)-P,\qquad B(0)=73395$$


    with solution


    $$B(n)=1.00541667^n c+ev.$$


    Build a system of two equations and two unknowns.


    $$73395=c+d \qquad\qquad\qquad\qquad\text{(from }B(0)=73395\text{)}$$


    $$0=1.00541667^{180}c+d \qquad\qquad\text{(from }B(180)=0\text{)}$$


    Solve the system.


    ```

    $\begin{aligned}

    &>\ solve\ \{\{73395=c+d,\ 0=1.00541667^{180}c+d\},\ \{c,d\}\};\\

    &\qquad\qquad\{c=-44638.66498,\ d=118033.6650\}

    \end{aligned}$

    ```


    Thus


    $$B(n)=-44638.66498\cdot1.00541667^n+118033.6650.$$


    (Note: there is a little round-off error creeping into the calculations.)


    To find the payment $P$, we know that


    $$ev=1.00541667ev-P.$$


    Substitute $ev=118033.6650$ and solve to find


    $$P=639.3494.$$


    This value agrees with our original payment other than some round-off error. Round-off
    in financial calculations can be very serious<sup>6</sup>—always be careful!


    # Equilibrium Values and the Limit


    Studying the behavior of equilibrium values relies fundamentally on the concept
    of *limit*. Elementary calculus is based on limit and includes a careful study
    of the concept. Advanced calculus or real analysis presents a precise, carefully
    crafted definition, but using that would overcomplicate our investigation of equilibrium
    values. The informal definition of *limit of a sequence*


    $$\lim_{k\to\infty}a(k)=L\ \text{if and only if for }n\text{ large enough }a(n)\text{
    must be close to }L.$$


    will serve our needs and keep us focused on the behavior of the discrete dynamical
    system in question.


    <sup>6</sup>See Whiteside’s *Computer capers: Tales of electronic thievery, embezzlement,
    and fraud*, Crowell, New York, c1978.


    <sup>7</sup>A more formal definition that specifies large enough and close to
    precisely is: $\lim_{n\to\infty}a(k)=L$ iff given any tolerance $\varepsilon>0$,
    there is a positive integer $N$ such that whenever $n>N$, then $|a(n)-L|<\varepsilon$.
    See, e.g., Baudry *Intro. to Real Analysis* [Baudry2009].'
