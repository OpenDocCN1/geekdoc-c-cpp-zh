  md: '![](img/0f04050177d82aebd17d3383d7334896_72_0.png)


    FIGURE 2.8: Drug Concentration DDS with Four Different Initial Values


    Regardless of the starting value, each graph shows the future terms of $a(n)$
    approach 32. Thus, 32 is the equilibrium value. We could have easily solved for
    the equilibrium value algebraically as well.


    $$a(n+1)=0.5a(n)+16 \quad\longrightarrow\quad ev=0.5ev+16 \quad\longrightarrow\quad
    ev=32$$


    In general, finding the equilibrium value for this type of DDS requires solving
    the equation $ev=r\cdot ev+b$ for $ev$. We find


    $$a=\frac{b}{1-r},\quad\text{when }r\ne1.$'
