  md: "# Projects\n\n**Project 7.1.** Corporation XYZ consists of Companies Rose and\
    \ Colin. Company Rose can make Products $R_1$ and $R_2$. Company Colin can make\
    \ Products $C_1$ and $C_2$. These products are not in strict competition with\
    \ one another, but there is an interactive effect depending on which products\
    \ are on the market at the same time as reflected in Table 7.62 below. The table\
    \ reflects profits in millions of dollars per year. For example, if products $R_2$\
    \ and $C_1$ are produced and marketed simultaneously, Rose’s profits are 4 million\
    \ and Colin’s 5 million annually. Rose can make any mix of $R_1$ and $R_2$, and\
    \ Colin can make any mix of $C_1$ and $C_2$. Assume the information below is known\
    \ to each company.\n\nNOTE: The CEO is *not satisfied* with just summing the total\
    \ profits. He might want the *Nash Arbitration Point* to award each company proportionately\
    \ based on their strategic positions, if other options fail to produce the results\
    \ he desires. Further, he does not believe a dollar to Rose has the same importance\
    \ to the corporation as a dollar to Colin.\n\n**TABLE 7.62: Corporate Payoff Matrix**\n\
    \n| Payoff Tableau | Company Colin |  |\n|---|---|---|\n|  | $C_1$ | $C_2$ |\n\
    | **Company Rose** $R_1$ | (3, 7) | (8, 5) |\n| $R_2$ | (4, 5) | (5, 6) |\n\n\
    +   a. Suppose the companies have perfect knowledge and implement market strategies\
    \ independently without communicating with one another. What are the likely outcomes?\
    \ Justify your choice.\n+   \n+   b. Suppose each company has the opportunity\
    \ to exercise a strategic move. Try *first moves* for each player; determine if\
    \ a first move improves the results of the game.\n+   \n+   c. In the event things\
