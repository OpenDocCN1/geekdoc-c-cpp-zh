  md: '# RECOMMENDED STEPS FOR REGRESSION ANALYSIS:


    +   STEP 1. Insure you understand the problem and what answers or predictions
    are required.

    +   STEP 2. Get the data that is available. Identify the dependent and independent
    variables.

    +   STEP 3. Plot the dependent versus each independent variable, and note any
    apparent trends.

    +   STEP 4. If the dependent variable is binary {0,1}, then use binary logistic
    regression. If the dependent variables are counts that follow a Poisson distribution,
    then use Poisson regression. Otherwise, try linear, multiple, or nonlinear regression
    as indicated by the situation being studied – science trumps curve fitting.

    +   STEP 5. Insure your model produces results that are acceptable. Always use
    the common-sense test.


    # References and Further Reading


    [AA1979] A. Affi and S. Azen, Statistical Analysis, 2nd Ed., Academic Press, London,
    UK, 1979, pg. 143-144.


