- pgno: 313
  md: "# Background of Game Theory\n\nUsing this security level, (10, 22.86), as our\
    \ status quo point, we can formulate the Nash arbitration scheme. We restate more\
    \ formally the four axioms stated above that are met using the Nash arbitration\
    \ scheme.\n\n**Axiom 1: _Rationality._** The solution must be in the negotiation\
    \ set.\n\n**Axiom 2: _Linear Invariance._** If either Player 1’s or Player 2’s\
    \ utility functions are transformed by a positive linear function, the solution\
    \ point should be transformed by the same function.\n\n**Axiom 3: _Symmetry._**\
    \ If the polygon happens to be symmetric about the line of slope +1 through the\
    \ status quo point, then the solution should be on this line. No player is favored,\
    \ no player is discriminated against.\n\n**Axiom 4: _Independence of Irrelevant\
    \ Alternatives._** Suppose $N$ is the solution point for a polygon $P$ with status\
    \ quo point $SQP$. Suppose $Q$ is another polygon which contains both $SQP$ and\
    \ $N$, and is totally contained in $P$. Then $N$ should also be the solution point\
    \ to $Q$ with status quo point $SQP$, i.e., the solution point is not changed\
    \ by non-solution points being eliminated from consideration.\n\n**Theorem. Nash’s\
    \ Arbitration Theorem** (Nash, ² 1950).\nThere is one and only arbitration scheme\
    \ which satisfies the four axioms rationality, linear invariance, symmetry, and\
    \ independence of irrelevant alternatives. The arbitration scheme is: If the status\
    \ quo $(SQP)$ point is $(x_0,y_0)$, then the arbitrated solution point $N$ is\
    \ the point $(x,y)$ in the polygon with $x \\geq x_0, y \\geq y_0$ which maximizes\
    \ the product $Z=(x-x_0)(y-y_0)$.\n\nWe apply Nash’s theorem in a nonlinear optimization\
    \ framework (_Kuhn-Tucker conditions_). The formulation for our example is\n\n\
    ```\nMaximize  Z = (x − 10)(y − 22.86)\nsubject to\n    3x + y = 100\n    x ≥\
    \ 10\n    y ≥ 22.86\n    x, y ≥ 0\n```\n\nMaple finds the solution easily using\
    \ _QPSolve_. In this example, for the status quo point $(10, 22.86)$, _QPSolve_\
    \ gives our Nash arbitration point as $(17.86, 46.43)$."
