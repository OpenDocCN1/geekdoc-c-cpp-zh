- pgno: 81
  md: "This produces a simple, first-order DDS similar to those seen earlier. It might\
    \ appear reasonable at first examination, but the long-term behavior of growth\
    \ without bound is disturbing. Why would growth without bound of a yeast culture\
    \ in a jar (or confined space) be alarming?\n\nThere are certain factors that\
    \ affect population growth. These factors include resources: food, oxygen, space,\
    \ etc. The available resources can support some maximum population. As this number\
    \ is approached, the change, or growth rate, should decrease and the population\
    \ should never exceed its resource supported amount. If the population does exceed\
    \ the maximum supported amount, the growth should become negative.\n\n# **Example\
    \ 2.11. Growth of a Cancer Culture.**\n\n*Problem.*\n\nTo determine whether our\
    \ treatments are successful, we need to predict the growth of cancer cells in\
    \ a controlled environment as a function of the resources available and the current\
    \ cell ‘population.’\n\n*Assumptions and Variables.*\n\nWe assume that the population\
    \ size is best described by the weight of the biomass of the culture. Define $y(n)$\
    \ as the population size of the cell culture after period $n$. There exists a\
    \ maximum carrying capacity $M$ that is sustainable by the resources available.\
    \ The culture is growing under the conditions established.\n\n*Model.*\n\n$n$:\
    \ the time period measured in hours  \n$y(n)$: the population size after period\
    \ $n$  \n$M$: the carrying capacity of our system\n\n$$y(n+1)=y(n)+k\\,y(n)\\\
    left(M-y(n)\\right)$$\n\nwhere $k$ is the constant of proportionality (a function\
    \ of *growth rate*).\n\nUsing the data collected in our experiment, we first plot\
    \ $y(n)$ versus $n$ and find a stable $y$ of approximately 670. Next, we plot\
    \ $y(n+1)-y(n)$ versus $y(n)(670-y(n))$ to find the slope, which gives $k$, is\
    \ approximately 0.00090. With $k=0.00090$ and carrying capacity in biomass is\
    \ 670. Our special model is then\n\n$$y(n+1)=y(n)+0.0009\\,y(n)(670-y(n))$$\n\n\
    Again, this is nonlinear because of the $y^2(n)$ term (after expanding the right\
    \ side of the model). There is no closed-form analytical solution for this model.\
    \ The numerical solution iterated in Maple from an initial condition of *biomass*\
    \ = 30.0 follows."
  merge: -1
  img_proc: true
- pgno: 82
  md: "```\n> k, M, init := 0.0009, 670, 30.0 :\n```\n\n```\n> biomass := proc(n ::\
    \ integer)\n    option remember;\n    piecewise(n > 0,\n        biomass(n - 1)\
    \ + k * biomass(n - 1) * (M - biomass(n - 1)),\n        init);\n    end proc :\n\
    ```\n\nWe use option remember in the procedure to 'remember' (store) values of\
    \ biomass as they are computed in order to dramatically reduce the number of calculations\
    \ needed. Try it without the option!\n\n```\n> pts := [seq([n, biomass(n)], n\
    \ = 0..30)] :\n```\n\n```\n> pointplot(pts, view = [0..30, 0..700], title = \"\
    Biomass\");\n```\n\n![](img/0f04050177d82aebd17d3383d7334896_82_0.png)\n\nThe\
    \ model shows stability in that the population (biomass) of the cell culture quickly\
    \ approaches 670 as n gets large. Thus, the population is eventually stable at\
    \ approximately 670 units. We would then proceed with treatments, collect new\
    \ data, and evaluate the new trend of the biomass to determine whether the treatment\
    \ is successful or not.\n\n# Example 2.12. Spread of a Contagious Disease.\n\n\
    There are 1000 students in a college dormitory. Several students have returned\
    \ from a Spring Break trip where they were exposed to mumps, a highly contagious\
    \ disease. The Health Center wants to build a model to determine how fast the\
    \ disease will spread in order to determine effective vaccination and quarantine\
    \ procedures."
