  md: '# Examples of Partial Conflict Games


    # TABLE 7.49: Cuban Missile Crisis Movement Diagram


    |  | **Soviet Union** |  |

    |---|---|---|

    |  | Withdraw Missiles (W) | Maintain Missiles (M) |

    | **Rose** | **Blockade (B)**<br>(3, 3) ⟹ (2, 4) |  |

    |  | **Air Strike (A)**<br>(4, 2) ⟸ (1, 1) |  |


    to (a) remove the quarantine and (b) agree not to invade Cuba. If the Soviets
    maintained their missiles, the U.S. preferred the airstrike to the blockade. Attorney
    General Robert Kennedy said, “if they do not remove the missiles, then we will.”
    The U.S. used a combination of promises and threats. The Soviets knew our credibility
    in both areas was high (strong resolve). Therefore, they withdrew the missiles,
    and the crisis ended. Khrushchev and Kennedy were wise.


    Needless to say, the strategy choices, probable outcomes, and associated payoffs
    shown in Table 7.48 provide only a skeletal picture of the crisis as it developed
    over a period of thirteen days. Both sides considered more than two alternatives
    listed, as well as several variations on each. The Soviets, for example, demanded
    withdrawal of American missiles from Turkey as a quid pro quo for withdrawal of
    their own missiles from Cuba, a demand publicly ignored by the United States.


    Nevertheless, most observers of this crisis believe that the two superpowers were
    on a collision course, which is actually the title of one book⁸ describing this
    nuclear confrontation. Analysts also agree that neither side was eager to take
    any irreversible step, such as one of the drivers in Chicken might do by defiantly
    ripping off the steering wheel in full view of the other driver, thereby foreclosing
    the option of swerving.


    Although in one sense the United States “won” by getting the Soviets to withdraw
    their missiles, Premier Nikita Khrushchev of the Soviet Union at the same time
    extracted from President Kennedy a promise not to invade Cuba, which seems to
    indicate that the eventual outcome was a compromise of sorts. But this is not
    game theory’s prediction for Chicken because the strategies associated with compromise
    do not constitute a Nash equilibrium.


    To see this, assume play is at the compromise position (3, 3), that is, the U.S.
    blockades Cuba, and the U.S.S.R. withdraws its missiles. This strategy


