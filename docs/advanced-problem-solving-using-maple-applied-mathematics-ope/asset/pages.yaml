  md: "So $g$’s Hessian is\n\n![](img/0f04050177d82aebd17d3383d7334896_139_0.png)\n\
    \nThe Hessian will play the role of the second derivative in the Second Derivative\
    \ Test as we extend from single-variable to multivariable functions. We will use\
    \ determinants to analyze the Hessian. Recall, the determinant of a $2\\times2$\
    \ matrix $A$ is\n\n![](img/0f04050177d82aebd17d3383d7334896_139_1.png)\n\nCalculating\
    \ determinants of larger matrices is defined recursively using expansion by minors.\
    \ We can use leading principal minors to analyze the Hessian.\n\n# **Definition\
    \ 4.1. Leading Principal Minor.**\n\nThe *leading principal minor* of a square\
    \ matrix $A$ is the determinant of the $i\\times i$ submatrix obtained by deleting\
    \ $n-i$ rows of $A$ and deleting the same $n-i$ columns of $A$ where $i=0,1,2,\\\
    ldots,n-1$.\n\n# **Example 4.3. The Leading Principal Minors of a Hessian Matrix.**\n\
    \nGiven the $3\\times3$ Hessian matrix\n\n![](img/0f04050177d82aebd17d3383d7334896_139_2.png)\n\
    \ndetermine all leading principal minors.\n\n+   1. There are three 1st order\
    \ leading principal minors, $(i=1$: eliminate $3-1=2$ rows and the same columns).\n\
    +   \n+      a. Eliminate rows 1 and 2 and columns 1 and 2: $M=[3]$. Then\n+ \
    \  \n+      $$|3|=3$$\n+   \n+      b. Eliminate rows 1 and 3 and columns 1 and\
    \ 3: $M=[1]$. Then\n+   \n+      $$|1|=1$$\n+   \n+      c. Eliminate rows 2 and\
    \ 3 and columns 2 and 3: $M=[1]$. Then\n+   \n+      $$|2|=2$$\n+   \n+      The\
    \ 1st order leading principal minors are the entries of the main diagonal.\n\n\
    +   2. There are three 2nd order leading principal minors, $(i=2$: eliminate $3-2=1$\
    \ row and the same column).\n\n> For a full discussion of determinants, see, e.g.,\
    \ Gilbert Strang’s *Introduction to Linear Algebra*."
