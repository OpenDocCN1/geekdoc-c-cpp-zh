    # The Partial Conflict Game


    Partial conflict games are games in which one player wins, but the other player
    does not have to lose. Both players could win something or both could lose something.
    Solution methods for partial conflict games include looking for dominance, analyzing
    movement diagrams, and finding equalizing strategies. Here we present an extension
    from the total conflict game to the partial conflict game as an application of
    linear programming; see [Fox2010] and [Fox2014]. Because of the nature of partial
    conflict games where both players are trying to maximize their outcomes, we can
    model all players’ strategies as their own maximizing linear programs. We treat
    each player as a separate linear programming maximization problem.


    Again, use the payoff matrix of Table 7.2. Now assume that Mᵢⱼ + Nᵢⱼ is not always
    equal to zero or the same constant for all i and j. In non-cooperative partial-conflict
    games, we first look for a pure-strategy solution using a movement diagram.


    The Row Player, Rose, maximizes payoffs, so she would prefer the highest payoff
    in each column. Vertical arrows are in columns with Rose’s values. Similarly,
    The Column Player, Colin, maximizes his payoffs, so he would prefer the highest
    payoff in each row. Draw an arrow to the highest payoff in that row. Horizontal
    arrows are in rows with Colin’s values. If all arrows point to a cell from every
    direction, then that cell will be a pure Nash equilibrium.


    If all the arrows do not point at a value or values, i.e., there is no pure Nash
    equilibrium, then we must use equalizing strategies to find the weights (probabilities)
    for each player. For a game with two players having two strategies each, proceed
    as follows:


    **Rose’s game:** Rose maximizing and Colin “equalizing” is a total-conflict game
    that yields Colin’s equalizing strategy.


    **Colin’s game:** Colin maximizing and Rose “equalizing” is a total-conflict game
    that yields Rose’s equalizing strategy.


    Note: If either side plays its equalizing strategy, the other side cannot unilaterally
    improve its own situation—the other player is stymied.


    This analysis translates into two maximizing linear programming formulations shown
    in (7.4) and (7.5) below. The LP formulation in (7.4) provides the Nash equalizing
    solution for Colin with strategies played by Rose, while the LP formulation in
    (7.5) provides the Nash equalizing solution for Rose with'
