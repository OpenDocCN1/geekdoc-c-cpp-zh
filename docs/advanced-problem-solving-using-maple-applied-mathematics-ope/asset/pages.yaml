- pgno: 27
  md: "# Column Operations\n\nIn this section, the operations that can be performed\
    \ directly on worksheet columns are present. The operations require the `LinearAlgebra`\
    \ package to be loaded prior to use. The following demonstrates these commands\
    \ with six examples using two columns of data; `c1 := [1, 2, 3, 4]` and `c2 :=\
    \ [5, 6, 7, 8]`.\n\n```\n```maple\n> with(LinearAlgebra):\n> c1 := <1|2|3|4>;\n\
    \                         c1 := [1, 2, 3, 4]\n> c2 := <5|6|7|8>;\n           \
    \              c2 := [5, 6, 7, 8]\n```\n```\n\nSumming the vectors c1 and c2\n\
    \n```\n```maple\n> VectorAdd(c1,c2);\n                         [6, 8, 10, 12]\n\
    > c1 + c2;\n                         [6, 8, 10, 12]\n```\n```\n\nTo add a constant\
    \ to the entries of c1, use `+~`\n\n```\n```maple\n> 10 +~ c1;\n             \
    \            [11, 12, 13, 14]\n```\n```\n\nTo multiply c2 by constant, use either\n\
    \n```\n```maple\n> VectorScalarMultiply(c2, 0.5);\n                         [2.50000000000000000\
    \  3.0  3.50000000000000000  4.0]\n> 0.5 · c2;\n                         [2.5\
    \  3.0  3.5  4.0]\n```\n```\n\nTo apply a function to the elements of a vector\
    \ use map or `~`.\n\n```\n```maple\n> map(ln,c1);\n       evalf(%);\n        \
    \                 [0   ln(2)   ln(3)   2 ln(2)]\n                         [0.0\
    \  0.6931471806  1.098612289  1.386294361]\n> ln~(c2);\n                     \
    \    [ln(5)  ln(6)  ln(7)  3 ln(2)]\n> map(x → x^2,c2);\n                    \
    \     [25  36  49  64]\n```\n```"
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Arrays and Matrices


    Arrays and matrices are structured devices used to store and manipulate data.
    An array is a specialization of a table; a matrix is a two-dimensional array.
    Both *array* and *matrix* are part of the linear algebra package, and require
    the `with(LinearAlgebra):` command prior to use. **Table 1.4** presents a few
    examples of the use of the *Array* and *Matrix* commands.


    **TABLE 1.4: Array and Matrix Commands**


    | Command | Output |

    |---|---|

    | `with(LinearAlgebra):` | (load the `LinearAlgebra` package) |

    | `a := Array([1, 2, 2, 3, 4]);` | `a := [ 1 2 2 3 4 ]` |

    | `b := Array([[1, 2], [3, 5]]);` | `b := [[1, 2], [3, 5]]` |

    | `c := Vector[row]([9, 3, 1, 8, 3]);` | `c := [ 9 3 1 8 3 ]` |

    | `d := Matrix([[7, 3], [2, 3]]);` | `d := [[7, 3], [2, 3]]` |


    # Saving and Printing a Worksheet


    To start Maple from Windows or MacOS, launch Maple by double-clicking on the Maple
    icon. Once Maple has been started, it will automatically open an empty worksheet,
    with a flashing cursor to the right of a character prompt >. To save the worksheet,
    click on File and then click on *Save As* and then specify a name for the worksheet.
    Once the worksheet has been named and saved, click on File and then click on Save
    to re-save the worksheet. To open a previously saved worksheet, click on File
    and then click on Open, then specify the name of the worksheet.


    After re-opening a document, the document will contain the commands and display
    the results, but not have any values defined. After a command is executed, the
    result is stored in memory. If the document is closed and then reopened, Maple
    recovers the commands, but does not recall the results.


    After the completion of a document, involving commands and results, the document
    can be printed by choosing File ▸ Print (which calls up the standard printing
    dialog).


    To quit Maple, choose File ▸ Exit (Windows) or Maple 2019 ▸ Quit (Macintosh);
    that is, choose Exit from the File menu (Windows) or Quit from the Maple 2019
    menu (Macintosh). Saving your work is prompted when quitting.'
  merge: -1
  img_proc: true
