- pgno: 375
  md: 'every pair is subjectively or objectively compared. Subjective assessments
    use Saaty’s nine-point scale that we introduced with SAW. (See Table 8.8.)


    The AHP process can be described as a method to decompose a problem into sub-problems.
    In most cases, the decision maker has a choice among many alternatives. Each alternative
    has a set of attributes or characteristics. AHP calls criteria, that can be measured,
    either subjectively or objectively. The attribute elements of the hierarchical
    process can relate to any aspect of the decision problem, either tangible or intangible,
    carefully measured or roughly estimated, well- or poorly understood—essentially
    anything that applies to the decision at hand.


    To perform an AHP, we need a goal or an objective and a set of alternatives, each
    with criteria (attributes) to compare. Once the hierarchy is built, the decision
    makers systematically pairwise-evaluate the various elements (comparing them to
    one another two at a time), with respect to their impact on an element above them
    in the hierarchy. The decision makers can use concrete data about the elements
    or subjective judgments concerning the elements’ relative meaning and importance
    for making the comparisons. Since subjective judgments are imperfect, sensitivity
    analysis will be very important.


    The process converts subjective evaluations to numerical values that can be processed
    and compared over the entire range of the problem. A priority or numerical weight
    is derived for each element of the hierarchy, allowing diverse and often incommensurable
    elements to be rationally and consistently compared to one another. The final
    step of the process calculates a numerical priority score for each decision alternative.
    These scores represent the alternatives’ relative ability to achieve the decision’s
    goal; they allow a straightforward consideration of the various courses of action.


    AHP can be used by individuals for simple decisions or by teams working on large,
    complex problems. The method has unique advantages when important elements of
    the decision are difficult to quantify or compare, or where communication among
    team members is impeded by their different specializations, lexicons, or perspectives.


    # Methodology of the Analytic Hierarchy Process


    The procedure for AHP can be summarized as:


    +   STEP 1. Build the hierarchy for the decision following Figure 8.2.

    +   Goal: Select the best alternative

    +   Criteria: List c1, c2, c3, . . . , cm

    +   Alternatives: List a1, a2, a3, . . . , an


    +   STEP 2. Judgments and Comparison.

    +   Build comparison matrices using a 9-point scale of pairwise comparisons shown
    in Table 8.10 for the criteria (attributes) and the alternatives relative to each
    criterion. A problem with m criteria and n alternatives will require n + 1'
