- pgno: 34
  md: "We add an example procedure for using Newton’s Method to find the roots of\
    \ a differentiable function. First, recall the iterating formula for Newton’s\
    \ root-finding algorithm:\n\n$$x_{new}=x_{old}-\\frac{f(x_{old})}{f'(x_{old})}$$\n\
    \nWe iterate the formula, finding new values of $x_{new}$, until the absolute\
    \ difference $|x_{new}-x_{old}|<tol$ tolerance or $|f(x_{new})|<tol$ tolerance.\n\
    \n# **The Maple procedure:** Newton’s Method for Finding Roots of a polynomial.\n\
    \n*Assumptions:*\n\n+   1. The function must be differentiable.\n+   \n+   2.\
    \ You have a fair guess at a starting point $x_0$ for the method. We suggest plotting\
    \ the function and estimating a value near the desired root.\n\n*Algorithm:*\n\
    \n+   1. Pick a tolerance, $tol$ ($tol$ is small), and a maximum number of iterations,\
    \ $MaxN$, allowed.\n+   \n+   2. Pick an initial value $xold$.\n+   \n+   3. Iterate\
    \ $xnew:=xold-f(xold)/f'(xold)$.\n+   \n+   4. Stop when either $|xnew-xold|<tol$\
    \ or $|f(xnew)|$ approximately equals $0$.\n\n*Maple Procedure:*\n\n```\nNewton\
    \ := proc(f, x0, tol, MaxN)\n    local df, xold, xnew, i;\n    df := D(f);\n \
    \   xold := x0;\n    print(xold);\n    for i from 1 to MaxN do\n        xnew :=\
    \ xold - \\\\frac{f(xold)}{f'(xold)};\n        if |f(xnew)| < tol or |xnew-xold|\
    \ < tol then\n            return(xnew);\n        end if;\n        xold := xnew;\n\
    \        print(xold);\n    end do;\n    return(cat(MaxN, \" iterate \"), xold);\n\
    end proc :\n```"
  merge: -1
  img_proc: true
