    \ being in Chicago, or the Yankees and Mets both being in New York City. Analysts\
    \ have estimated the market shares. We place both sets of payoffs in a single\
    \ game matrix. Listing the row player’s payoff, the American League’s payoff,\
    \ as first in the ordered pair, we have the payoff matrix shown in Table 7.3.\
    \ The payoff matrix represents a constant-sum total-conflict game. Arrows are\
    \ added to the table to create the movement diagram.\n\n**TABLE 7.3: New Baseball\
    \ Franchise Payoff Matrix and Movement Diagram**\n\n|  | National League Franchise\
    \ |  |\n|---|---|---|\n|  | Densely Populated | Less Densely Populated |\n| **American\
    \ League Franchise — Densely Populated** | (65, 35) | (70, 30) |\n| **American\
    \ League Franchise — Less Densely Populated** | (55, 45) | (60, 40) |\n\nArrows\
    \ point leftward from the right column to the left column and upward from the\
    \ bottom row to the top row.\n\nThe payoff (65, 35) only has arrows pointing in\
    \ for the densely populated areas choice for franchise strategies for both players,\
    \ no arrows exits that outcome. The movement diagram indicates that neither player\
    \ can unilaterally improve their solution giving a Nash equilibrium ([Strafﬁn1993]).\n\
    \n# Linear Programming in Total Conflict Games\n\nVon Neumann’s minimax theorem\
    \ ([vNeumann1928]) states that for every two-person, zero-sum game with finitely\
    \ many strategies, there exists an outcome value V and a set of strategies for\
    \ each player, such that\n\n+   (a) Given Player 2’s strategy, the best payoff\
    \ possible for Player 1 is V, and\n+   \n+   (b) Given Player 1’s strategy, the\
    \ best payoff possible for Player 2 is −V.\n\nEquivalently, Player 1’s strategy\
    \ guarantees him a payoff of V regardless of Player 2’s strategy, and similarly\
    \ Player 2 can guarantee a payoff of −V regardless of Player 1’s strategy. The\
    \ name minimax arises from each player minimizing the maximum payoff possible\
    \ for the other; since the game is zero-sum, the Player also minimizes his own\
    \ maximum loss; i.e., maximize his minimum payoff.\n\nEvery total conflict game\
    \ may be formulated as a linear programming problem ([Dantzig1951] and [Dorfman1951]).\
    \ Consider a total-conflict two-person"
