  md: '# Finding the Maximum of a Function over an Interval with a Golden Section
    Search


    Suppose we know that $f$ is unimodal on an interval $I$. Break $I$ into two subintervals
    $I_1$ and $I_2$, then $f$’s maximum must be in one or the other. Check a test
    point in each interval—the higher test point indicates which interval contains
    the maximum since $f$ is unimodal and has exactly one optimum value. We can reduce
    the number of times we have to evaluate the function by having the intervals overlap
    and using the endpoints as test points. We can further reduce the number of function
    evaluations by cleverly choosing the test points so that the next iteration reuses
    one of the current test points. These ideas lead to the Golden Section search
    developed by Prof. Jack Kiefer in his 1953 master’s thesis.


    A Golden Section search for a maximum is iterative, requiring evaluations of $f(x)$
    at test points $x_1$ and $x_2$, where


    $$x_1=a+r(b-a)\qquad\text{and}\qquad x_2=b-r(b-a).$$


    The test points will lie inside the original interval $I_0=[a,b]$ and are used
    to determine a new, smaller search interval $I_1$. Choosing $r$ carefully lets
    us reuse the function’s evaluations in the next iteration: either $x_1$ or $x_2$
    will be the new interval endpoint, and the other test point will be a test point
    in the new, reduced interval. For a Golden Section Search, $r$ is chosen to be
    the golden ratio $0.618$. If $f(x_1)>f(x_2)$, the new interval is $[x_2,b]$, and
    if $f(x_1)<f(x_2)$, the new interval is $[a,x_1]$. Continue to iterate in this
    manner until the final interval length is less than the chosen tolerance. The
    final interval $I_N$ contains or brackets the optimum solution. The length of
    the final interval $I_N$ determines the accuracy of the approximate optimum solution.
    The maximum number of iterations $N$ required to achieve this desired tolerance
    or final interval length is


    $$N=\left\lceil\frac{1}{\ln(0.618)}\cdot\ln\left(\frac{\text{tolerance}}{b-a}\right)\right\rceil.$$


    When we are required to provide a point solution, instead of a small interval
    containing the solution, evaluate the function at the end points and the midpoint
    of the final interval. Select the value of $x$ that yields the largest $f(x)$.
    How can the procedure be changed to search for a minimum point? Figure 3.5 shows
    the progression of subintervals selected by a Golden Section search.


    > J. Kiefer, “Sequential minimax search for a maximum,” Proc Am Math Soc, 4 (3),
    1953, 502–506.'
  merge: -1
  img_proc: true
