  md: '# Example 4.14. Steepest Ascent Example, II.


    Maximize \(g(x) = 55x_1 - 4x_1^2 + 135x_2 - 15x_2^2 - 100\) using the Steepest
    Ascent method starting at the point \(\{1,1\}\) to within a tolerance of \(\epsilon
    = 0.01\).


    Figure 4.11 provides a visual reference for the maximum.


    ![](img/0f04050177d82aebd17d3383d7334896_165_0.png)


    FIGURE 4.11: Surface Plot of \(g\) Showing Contours


    The gradient is \(\nabla g(x) = \langle 55 - 8x_1, 135 - 30x_2\rangle\).


    # Iteration 1.


    We begin with \(x_0 = \{1,1\}\). Then \(\nabla g(x_0) = \langle 47,105\rangle\).
    From \(\{1,1\}\), we move in the direction of \(\langle 47,105\rangle\). How far
    do we go along the line \(L(t) = \{1,1\} + t\langle 37,105\rangle\)? We need to
    maximize the function


    \[g(L(t)) = g(x_0 + t\cdot\nabla g(x_0))\]

    \[= -4(1+47t)^2 - 15(1+105t)^2 + 90 + 16760t\]

    \[= -17421t^2 + 13234t + 71.\]


    This function can also be maximized by simple single-variable calculus:


    \[\frac{d}{dt}g(L(t)) = 0 \quad\Longrightarrow\quad t^* = 0.03798\]


    The new point \(x_1\) is found by evaluating \(L(t^*) = x_0 + t^*\cdot\nabla g(x_0)\).


    \[x_1 = \{1,1\} + t^*\cdot\langle 37,105\rangle = \langle 2.785, 4.988\rangle\]


    Since \(|x_1-x_0| > 0.01\), iterate again.'
