    # Example 7.7. Operation Overlord.


    *Operation Overlord*, the codename for World War II’s Battle of Normandy, can
    be viewed in the context of game theory. In 1944, the Allies were planning an
    operation for the liberation of Europe; the Germans were planning their defense
    against it. There were two known possibilities for an initial amphibious landing:
    the beaches at Normandy, and those at Calais. Any landing would succeed against
    a weak defense, so the Germans did not want a weak defense at the potential landing
    site. Calais was more difficult for a landing, but closer to the Allies targets
    for success.


    Suppose the probabilities of an Allied success are as in *Table 7.16*.


    |  | **German Defense** |

    |---|---|

    |  | Normandy | Calais |

    | **Allied Landing**<br>Normandy | 75% | 100% |

    | Calais | 100% | 20% |'
