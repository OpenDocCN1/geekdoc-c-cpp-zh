  md: "# **Example 4.25. Geometric Constrained Nonlinear Optimization Problem.**\n\
    \nMaximize \\(z=(x-14)^2+(y-11)^2\\)  \nsubject to  \n\\[(x-11)^2+(y-13)^2\\le\
    \ 49\\]  \n\\[x+y\\le 19\\]\n\nUse Maple to generate contour plots overlaid with\
    \ the constraints to obtain the geometrical interpretation shown in the worksheet\
    \ below. The optimal solution, as visually shown, is the point where the level\
    \ curve of the *objective function is tangent to the constraint* \\(x+y=19\\)\
    \ in the direction of increase for the contours of \\(f\\). The solution satisfies\
    \ the other constraint \\((x-11)^2+(y-13)^2\\le 49\\), but there is slack in this\
    \ constraint. The solution corresponds to the case where Constraint 2 is binding\
    \ and Constraint 1 is nonbinding. The constraints being nonbinding and binding,\
    \ respectively, are shown computationally by\n\n\\[(\\lambda_1=0,\\mu_1^2\\ne\
    \ 0)\\text{ and }(\\lambda_2\\ne 0,\\mu_2=0).\\]\n\nFinish by estimating the solution\
    \ in the plot below.\n\n```\n```maple\nwith(plots):\nf := (x,y) -> (x-14)^2 +\
    \ (y-11)^2:\ng1 := (x,y) -> (x-11)^2 + (y-13)^2:\ng2 := (x,y) -> x + y:\nrng :=\
    \ (x = 2..21, y = 2..21):\nfillplots := (filledregions = true, coloring = [wheat,\
    \ white]):\nfcp := contourplot(f(x,y), rng, contours = 40, color = grey):\nfcp19\
    \ := contourplot(f(x,y), rng, contours = [19], color = black):\ng1cp := contourplot(g1(x,y),\
    \ rng, contours = [49], color = red,\n    thickness = 2, fillplots):\ng2cp :=\
    \ contourplot(g2(x,y), rng, contours = [19], thickness = 2):\n```\n```"
