    *Remarks:*


    **Case I.** ∂L/∂z = 0 becomes −10 = 0; this case is infeasible.


    **Case II.** μ₁² is negative violating Constraint 1.


    **Case III.** λᵢ ≤ 0 and μᵢ ≥ 0: **Candidate Solution.**


    **Case IV.** λᵢs have different signs so not an optimal point.


    We have a concave profit function P, linear constraints, and λᵢ (λ₁ = −10) is
    negative for all binding constraints. Thus, we have met the sufficient conditions
    for the point (850,875) to be the optimal solution. The optimal manufacturing
    strategy is to purchase z = 1725 ounces of the chemical and produce x = 850 ounces
    of Perfume #1 and y = 875 ounces of Perfume #2 yielding a profit of P = $22,537.50.


    Consider the significance of the shadow price for λ₁. How do we interpret the
    shadow price in terms of this scenario? If we could obtain an extra ounce (Δ =
    1) of the main chemical at no cost, it would improve the profit to about $22,537.50
    + $10. What would be the largest cost for an extra ounce of the main chemical
    that would still yield a higher profit?


    # Example 4.29. Minimum Variance of Expected Investment Returns.


    A new company has $5,000 to invest to generate funds for a planned project; the
    company needs to earn about 12% interest. A stock expert has suggested three mutual
    funds, A, B, and C, in which the company could invest. Based upon previous year’s
    returns, these funds appear relatively stable. The expected return, variance on
    the return, and covariance between funds are shown in Table 4.10 below.'
