    0.1814128944


    For expressions, we assign $y$ using the same assignment operator :=.


    ```

    > y := x^2 + 21.6 · x − 1

    ```


    $y := x^2 + 21.6x − 1$


    To evaluate this type of expression for specific values of $x$, we use the *subs*
    command (substitution) or the *eval* command (evaluate). For example, we want
    to substitute $3$ for $x$.


    ```

    > subs(x = 3, y);

    ```


    72.8


    ```

    > eval(y, x = 3);

    ```


    72.8


    To use functional notation, such as $f(3)$, we must start with a different form
    of assignment. To create a function assignment $f$ we use the *arrow* operator
    as follows. (Type ‘−’, then ‘>’ for the arrow operator; the image changes to ‘→’.)


    ```

    > f := x → x^2 + 21.6 · x − 1;

    ```


    $f := x \mapsto x^2 + 21.6x − 1$


    ```

    > f(3);

    ```


    72.8


    We can even substitute variables such as $(x+h)$ for $x$;


    ```

    > f(x+h);

    ```


    $(x+h)^2 + 21.6x + 21.6h − 1$


    The two forms, expressions (objects) and functions (operations), are very important
    in both programming and plotting as we shall see later. Creating a function from
