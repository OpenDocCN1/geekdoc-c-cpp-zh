- pgno: 219
  md: '# 5


    # Problem Solving with Linear Systems of

    Equations Using Linear Algebra Techniques


    # Objectives:


    +   1. Set up a system of equations to solve a problem.

    +   2. Recognize unique solutions, no solution and infinite solutions as results.


    # 5.1 Introduction


    In the mid-1800s, a large number of ironwork bridges were constructed as railways
    crossed the continents. One of the popular designs for trusses, rigid triangular
    support structures, was the Warren truss with vertical supports.¹ The center span
    of the 1926 Bridge of the Gods (Figure 5.1) over the Columbia River is a nice
    example.


    ![](img/0f04050177d82aebd17d3383d7334896_219_0.png)


    FIGURE 5.1: Bridge of the Gods Warren Truss with Vertical Supports


    > ¹ See Frank Griggs’ “The Warren Truss,” *Structure*, July, 2015, for a brief
    history of the Warren truss; available at https://www.structuremag.org/?p=8715.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Warren trusses supported carrying heavy loads. The civil engineering technique
    “Method of Joints” is used to analyze the forces acting on the truss. Individual
    parts of the truss are connected with rivets, rotatable pin joints, or welds that
    permit forces to be transferred from one member of the truss to another.


    Figure 5.2 shows a truss that is fixed at the lower left endpoint $p_1$, and can
    move horizontally at the lower right endpoint $p_4$. The truss has pin-joints
    at $p_1$, $p_2$, $p_3$, and $p_4$. A load of 10 kilonewtons (kN) is placed at
    joint $p_3$; the forces on the members of the truss have magnitude $f_1$, $f_2$,
    $f_3$, $f_4$, and $f_5$ as indicated in the figure. The stationary support member
    has both a horizontal force $F_1$ and a vertical force $F_2$ (see Figure 5.3);
    the horizontally movable support member has only a vertical force $F_3$.


    ![](img/0f04050177d82aebd17d3383d7334896_220_0.png)


    If the truss is in static equilibrium, the forces at each joint must sum to the
    zero vector. If there were net nonzero forces, the joint would move—the truss
    would not be in static equilibrium. Therefore, the corresponding components of
    the vector must also be zero; i.e., the sum of the horizontal components of the
    forces at each joint must be zero and the sum of the vertical components must
    be zero.


    > ²Variants of this problem appear in many textbooks; see, e.g., Burden and Faires
    [BurdenFaires2005], Fox [Fox2011Maple].'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/0f04050177d82aebd17d3383d7334896_221_0.png)


    FIGURE 5.3: Force Vector Components


    A system of linear equations will model the forces. We will build this model and
    solve its linear system later in the chapter.


    # 5.2 Introduction to Systems of Equations


    In this chapter, we illustrate the use of systems of equations to solve real-world
    applications from the sciences, engineering, and economics. Previously, we have
    seen examples of linear systems in solving discrete dynamical systems and in model
    fitting with least squares. Maple’s *LinearAlgebra* package has a number of functions
    and programs that will be very useful for solving these problems.


    There are exactly three possibilities for a system of linear equations: the system
    has a unique solution, an infinite number of solutions, or no solution. Consider
    the following two-dimensional system of linear equations:


    $$\begin{aligned}a_1x+b_1y&=c_1\\a_2x+b_2y&=c_2\end{aligned}$$


    The augmented matrix for this system is


    $$A=\left[\begin{array}{cc|c}a_1&b_1&c_1\\a_2&b_2&c_2\end{array}\right]$$


    Row reduce the augmented matrix to find one of the three possible results.


    **Unique Solution.** Row reduction of $A$ gives


    $$\left[\begin{array}{cc|c}1&0&d\\0&1&e\end{array}\right]$$


    which yields the unique solution $(x,y)=(d,e)$.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '**Infinitely Many Solutions.** Row reduction of $A$ gives one of three possibilities.
    First,


    $$\begin{bmatrix}1 & b_1/a_1 & c_1/a_1\\0 & 0 & 0\end{bmatrix}$$


    which yields solutions $(x,y)=(a_1t,c_1-b_1t)$ with arbitrary $t$. Second, if
    $a_1=0$ and $b_1\ne0$, then row reduction gives


    $$\begin{bmatrix}0 & 1 & d\\0 & 0 & 0\end{bmatrix}$$


    and the solution is $(t,d)$ for arbitrary $t$. Third, if $a_1\ne0$ and $b_1=0$,
    then row reduction gives


    $$\begin{bmatrix}1 & 0 & d\\0 & 0 & 0\end{bmatrix}$$


    and the solution is $(d,t)$ for arbitrary $t$.


    **No Solution.** Row reduction gives


    $$\begin{bmatrix}1 & h & d\\0 & 0 & e\end{bmatrix}$$


    with $e\ne0$. Then there is no solution as $0x+0y=e\ne0$ is impossible.


    These alternatives are represented visually in **Figure 6.4**.


    ![](img/0f04050177d82aebd17d3383d7334896_222_0.png)


    (a) No Solution                (b) Unique Solution                (c) Infinite
    Solutions


    **FIGURE 5.4:** The Three Alternatives for Solutions of a Linear System


    > Describe the possibilities for three linear equations in three dimensions; that
    is, for the intersection of three planes in 3D.


    We will rely on the matrix forms in recognizing our solutions in this chapter.


