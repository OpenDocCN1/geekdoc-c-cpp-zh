  md: 'Solving for $ev$ gives the equilibrium value for the DDS as $ev=-1$.


    Now, let’s consider the DDS $a(n+1)=a(n)+1$. Using our observation, we write


    $$ev=ev+1.$$


    This equation has no solution, so the DDS $a(n+1)=2a(n)+1$ does not have any equilibrium
    values.


    # **Example 2.6. Finding Equilibrium Values.**


    Consider the following four DDSs. Find their equilibrium value(s), if any exist.


    +   1. $a(n+1)=0.3a(n)-10$

    +   2. $a(n+1)=1.3a(n)+20$

    +   3. $a(n+1)=0.5a(n)$

    +   4. $a(n+1)=-0.1a(n)+11$


    *Solutions.*


    +   1. $ev=0.3ev-10 \Longrightarrow ev=-10/0.7\approx -14.286$

    +   2. $ev=1.3ev+20 \Longrightarrow ev=-20/0.3\approx -66.667$

    +   3. $ev=0.5ev \Longrightarrow ev=0$

    +   4. $ev=-0.1ev+11 \Longrightarrow ev=11$


    Above, we observed that DDSs that have equilibrium values may never attain their
    equilibrium value, given some specific initial condition $a(0)$. In DDS 3 from
    Example 2.6 above, choose any initial value $A$ not equal to $0$, the $ev$. Then,
    by iteration, $a(k)=-2^kA\ne0$ for any $k$. This DDS can never achieve its equilibrium
    when starting from a nonzero value even though $\lim_{n\to\infty}a(n)=0$, the
    equilibrium value.


    We found the equilibrium value was $-1$ for the DDS from the Tower of Hanoi puzzle.
    Suppose that we begin iterating the Tower’s DDS with an initial value $a(0)=0$.
    Then


    $$\begin{aligned}

    a(1)&=2a(0)+1=3,\\

    a(2)&=2a(1)+1=7,\\

    a(3)&=2a(2)+1=15,\\

    a(4)&=2a(3)+1=31,

    \end{aligned}$$


    etc. The values continue to get larger and will never reach the value of $-1$.
    Since $a(n)$ represents the number of moves of the Tower of Hanoi, the value of
    $-1$ makes no real sense in the context of the number of disks to move.'
