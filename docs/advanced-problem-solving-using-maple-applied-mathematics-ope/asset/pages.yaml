- pgno: 127
  md: 'size of the final interval determines the accuracy of the approximate optimum
    solution and vice versa. The number of iterations required to achieve this accepted
    interval length is the smallest Fibonacci number that satisfies the inequality


    b − a / tolerance < F_k.


    When we require a point solution, instead of an interval solution, the method
    of selecting a point is to evaluate the function, f(x) at the end points and midpoint
    of the final interval. For maximization problems, select the end-point or midpoint
    that yields the largest f(x) value.


    The Fibonacci search algorithm follows.


    # Fibonacci Search Algorithm


    Find the maximum of the unimodal function f on the interval [a, b].


    +   INPUTS:

    +   Function: f

    +   Endpoints: a, b

    +   Tolerance: t

    +   OUTPUTS:

    +   Optimal point x* and maximum value f(x*)


    Step 1. Initialize: Set a₀ = a, b₀ = b, counter k = 1


    Step 2. Calculate the number of iterations n such that Fₙ is the first Fibonacci
    number where (b − a)/t < Fₙ


    Step 3. Calculate the test points


    x₁ = a + Fₙ₋₂ / Fₙ · (b − a)

    x₂ = a + Fₙ₋₁ / Fₙ · (b − a)


    Step 4. Compute f(x₁) and f(x₂)


    +   Step 5. If f(x₁) < f(x₂), then the new interval is [x₁, b]

    +   Set x₁ = x₂

    +   Compute the new x₂ (for the new interval)

    +   If f(x₁) > f(x₂), then the new interval is [a, x₂]

    +   Set x₂ = x₁

    +   Compute the new x₁ (for the new interval)


    Step 6. If n = 2 or bₙ − aₙ < t, then STOP

    Return estimates x* = midpoint(Iₙ) and f(x*).

    Otherwise, set n = n − 1 and return to Step 4.'
  merge: -1
