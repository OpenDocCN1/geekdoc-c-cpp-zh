    time. They can use this information to decide whether or not to refinance their
    house at a lower interest rate of 3.25% APR for the next 15 years or 3.5% APR
    for 20 years.


    The change in the amount owed each period increases by the amount of the interest
    and decreases by the amount of the payment.


    # General Problem.


    Build and use a model that relates the time to the amount owed on a mortgage for
    a home.


    # Assumptions.


    +   - Initial interest was 4% APR.\n- The monthly interest rate is 4%/12 = 0.33%.'
