    # Example 4.22. Oil Transfer Company Storage Facilities.


    The management of a small oil transfer company desires a minimum cost policy taking
    into account the restrictions on available tank storage space. A formula has been
    derived from historical data records that describes system costs.


    $$f(x)=\sum_{n=1}^{N}\frac{a_n b_n}{x_n}+\frac{h_n x_n}{2}$$


    where


    +   - $a_n$ is the fixed costs for the nth item,

    +   - $b_n$ is the withdrawal rate per unit time for the nth item,

    +   - $h_n$ is the holding cost per unit time for the nth item.


    The tank space constraint is given by:


    $$g(x)=\sum_{n=1}^{N}t_nx_n=T$$


    where $t_n$ is the space required for the nth item (in 1,000s bbl) and $T$ is
    the available tank space (in 1,000s bbl). The parameter values shown in Table
    4.6 are based on the company''s data collected over several years.'
