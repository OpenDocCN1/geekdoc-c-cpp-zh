    begin{matrix}2&0\\\\0&1\\end{matrix}\\right|=2$\n\n3. There is only one 3rd order\
    \ leading principal minor, the determinant of $H$ itself.³ (Eliminate no rows\
    \ or columns.) Then\n\n$|H|=-60$\n\nNotice that the leading principal minors of\
    \ a matrix are just the determinants of all the submatrices formed along the main\
    \ diagonal.\n\nHow do we use all these determinants, the leading principal minors,\
    \ of the Hessian matrix to determine the convexity of the multivariate function?\
    \ The following theorem answers our question.\n\n# Theorem. Convexity and the\
    \ Hessian Matrix.\n\nSuppose $f(x_1,x_2,\\ldots,x_n)$ has continuous second partial\
    \ derivatives at all points of its domain $D$. Let $H$ be $f$’s Hessian matrix.\
    \ Then\n\n+   a. if all the leading principal minors of $H$ are nonnegative, then\
    \ $f$ is convex;\n+   \n+   b. if all the leading principal minors of $H$ match\
    \ the sign of $(-1)^k$ where $k$ is the minor’s order (positive for even order,\
    \ negative for odd), then $f$ is concave;\n+   \n+   c. otherwise, $f$ is neither\
    \ convex, nor concave.\n\n# Example 4.4. Determining Convexity.\n\nDetermine the\
    \ convexity of the function $f(x_1,x_2)=x_1^2+3x_2^2$ using its Hessian matrix.\n\
