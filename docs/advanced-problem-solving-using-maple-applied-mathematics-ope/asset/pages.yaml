    # Communications and Cooperation in Partial Conflict Games


    Allowing for communication may change the game''s solution. A player may consider
    combinations of moves, threats, and promises to attempt to obtain better outcomes.
    The strategy of moves is explored in several sources listed in References and
    Further Reading (pg. 336).


    # Nash Arbitration Method


    When we have not achieved a solution by other methods that is acceptable to the
    players, then a game may move to arbitration. The Nash Arbitration Theorem (Nash,
    1950) states that


    There is a unique arbitration solution which satisfies the axioms


    +   **Rationality:** The solution point is feasible.

    +   **Linear Invariance:** Changing scale does not change the solution.

    +   **Symmetry:** The solution does not discriminate against any player.

    +   **Independence of Irrelevant Alternative:** Eliminating solutions that would
    not be chosen does not change the solution.


    # Prudential Strategy (Security Levels)


    The security levels are the payoffs to the players in a partial conflict game
    where each player attempts to maximize their own payoff. We can solve for these
    payoffs using a separate linear program for each security level.'
