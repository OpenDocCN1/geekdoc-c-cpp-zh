    # 2.8 Case Studies: Predator–Prey Model, SIR Model, and Military Models


    # A Predator-Prey Model: Foxes and Rabbits


    In the study of the dynamics of a single population, we typically take into consideration
    such factors as the “natural” growth rate and the “carrying capacity” of the environment.
    Mathematical ecology often studies populations that interact, thereby affecting
    each other’s growth rates. In this Case Study, we investigate a very special case
    of interaction, in which there are exactly two species: a predator which eats
    a prey. Such pairs exist throughout nature:


    +   - lions and gazelles,

    +   - birds and insects,'
  merge: -1
  img_proc: true
- pgno: 95
  md: "+   - pandas and bamboo;\n+   - Venus Flytraps and insects.\n\nLet $x(n)$ be\
    \ the size of the prey population and $y(n)$ be the size of the predator population\
    \ at time period $n$.\n\nTo keep our model simple, we will make some assumptions\
    \ that would be unrealistic in most predator-prey situations. Specifically, we\
    \ will assume that:\n\n+   1. the predator species is totally dependent on a single\
    \ prey species as its only food supply, (e.g., koalas and eucalyptus trees)\n\
    +   \n+   2. the prey species has an unlimited food supply, and\n+   \n+   3.\
    \ there are no other threats to the prey, just the specific predator.\n\nWe will\
    \ use the Lotka-Volterra model.¹² If there were no predators, the second assumption\
    \ would imply that the prey species grows exponentially without bound, then $x(n+1)=a\\\
    ,x(n)$.\n\nBut there are predators, which must account for a negative component\
    \ in the prey growth rate. The crucial additional assumptions about predator-prey\
    \ interactions for developing the model are:\n\n+   1. The rate at which predators\
    \ encounter prey is jointly proportional to the sizes of the two populations.\n\
    +   \n+   2. A fixed proportion of encounters between predator and prey lead to\
    \ the death of the prey.\n\nThese assumptions lead to the conclusion that the\
    \ negative component of the prey growth rate is proportional to the product $xy$\
    \ of the population sizes. Putting these factors together yields\n\n$$x(n+1)=x(n)+a\\\
    ,x(n)-b\\,x(n)\\cdot y(n)$$\n\nNow we consider the predator population. If there\
    \ were no food supply, the predators would die out at a rate proportional to their\
    \ size; i.e., we would find $y(n+1)=-c\\,y(n)$.\n\nWe assume that the “natural\
    \ growth rate” is a composite of birth and death rates, both presumably proportional\
    \ to the current population size. In the absence of food, there is no energy supply\
    \ to support the birth rate. But there is a food supply: the prey. And what’s\
    \ bad for foxes is good for rabbits. That is, the energy to support growth of\
    \ the predator population is proportional to deaths of prey, so\n\n$$y(n+1)=y(n)-c\\\
    ,y(n)+p\\,x(n)\\cdot y(n)$$"
  merge: -1
  img_proc: true
- pgno: 96
  md: "Put all the above together to have the discrete version of the Lotka-Volterra\
    \ Predator-Prey Model\n\nx(n + 1) = (1 + a) x(n) − b x(n) y(n)\ny(n + 1) = (1\
    \ − c) y(n) + p x(n) y(n)      for n = 0, 1, 2, …, (2.1)\n\nwith (x(0), y(0))\
    \ = (x0, y0) and where a, b, c, and p are positive constants.\n\nThe continuous\
    \ Lotka-Volterra model, analogous to (2.1), consists of the system of linked differential\
    \ equations\n\nx′(t) = +α x(t) − β x(t) y(t)      for t ≥ 0,\ny′(t) = −γ y(t)\
    \ + ρ x(t) y(t)\n\nthat cannot be separated from each other and that cannot be\
    \ solved in closed form. Nevertheless, the continuous model, just like the discrete,\
    \ can be solved numerically and graphed in order to obtain insights about the\
    \ system being studied.\n\nLet’s model an isolated population of foxes and hares\
    \ on a small island with a discrete Lotka-Volterra system. Data collected in the\
    \ field has yielded the estimates\n\n{a, b, c, p} = {0.039, 0.0003, 0.12, 0.0001}\n\
    \nfor the parameters of (2.1). Use Maple to investigate the model’s behavior.\n\
    \nIn order to simplify the Maple code, we will use global variables, variables\
    \ defined outside any program but available inside any program. Remember to load\
    \ plots and to use option remember to drastically reduce the amount of computation\
    \ needed.\n\n```\n> PredPrey := proc(n :: integer)\n    local u, v, rn, fn;\n\
    \    global r0, f0, a, b, c, p;\n    option remember;\n    if n < 1 then\n   \
    \     u := [r0, f0];  # Initial {rabbits, foxes}\n    else\n        v := PredPrey(n\
    \ − 1);\n        rn := v[1];   # current rabbits\n        fn := v[2];   # current\
    \ foxes\n        u := [(1 + a)·rn − b·rn·fn, (1 − c)·fn + p·rn·fn];\n    end if;\n\
    \    return(u);\n    end proc;\n> r0, f0 := 900, 110;\n> a, b, c, p := 0.039,\
    \ 0.0003, 0.12, 0.0001 :\n```"
  merge: -1
  img_proc: true
