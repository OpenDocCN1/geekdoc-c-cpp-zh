  md: "# 6\n\n*Review of Regression Models and Advanced Regression Models*\n\n+  \
    \ **Objectives:**\n+   \n+   (1) Understand the concepts of correlation and linearity.\n\
    +   \n+   (2) Build and interpret nonlinear regression models.\n+   \n+   (3)\
    \ Build and interpret logistic regression models.\n+   \n+   (4) Build and interpret\
    \ Poisson regression models.\n+   \n+   (5) Understand when to use each type of\
    \ regression model.\n+   \n+   (6) Understand the use of technology in regression.\n\
    \nThe Philippine National Statistics Coordination Board (NSCB) has collected data\
    \ on acts of violence committed by terrorists and insurgents over the past decade.\
    \ Over the same period, the NSCB has collected data on the population such as\
    \ education levels (literacy), employment, government satisfaction, ethnicity,\
    \ and so forth. The government is looking to see which areas it can target for\
    \ improvements that might reduce the number of violent acts committed. What should\
    \ the administration do to improve the situation?\n\nIn this chapter, we will\
    \ discuss several regression techniques as background information and keys to\
    \ finding adequate models. We do not try to comprehensively cover regression,\
    \ but we will use real examples to illustrate the techniques used to gain insights,\
    \ predict, explain, and answer scenario-related questions such as the Philippines\
    \ question above.\n\nThe forms we will study are simple linear regression, multiple\
    \ regression, exponential and sine nonlinear regression, binary logistic regression,\
    \ and Poisson regression.\n\n> 1 This chapter is adapted from Fox and Hammond,\
    \ “Advanced Regression Models: Least Squares, Nonlinear, Poisson and Binary Logistics\
    \ Regression Using R” in Márquez and Lev, *Data Science and Digital Business*,\
    \ Springer, 2019."
