- pgno: 177
  md: "Problems such as this can be modeled using constrained optimization. We begin\
    \ our discussion with optimization with equality constraints, then we move to\
    \ optimization with inequality constraints in the next section.\n\nLagrange multipliers⁶\
    \ can be used to solve nonlinear optimization problems (NLPs) in which all the\
    \ constraints are equations. Consider the NLP given by\n\nMaximize (Minimize)\
    \ z = f(x)\nsubject to\n    g₁(x) = b₁\n    g₂(x) = b₂\n    ⋮\n    gₘ(x) = bₘ\n\
    (4.2)\n\nwhere m ≤ n.\n\nWe can build an equality constrained model for our phone\
    \ problem: maximize the number of phones made using all available production hours.\n\
    \nMaximize E = 250 a¹/⁴ b¹/²\nsubject to\n    5a + 8b = 175000\n\n# Lagrange Multipliers:\
    \ Introduction and Basic Theory\n\nIn order to solve NLPs in the form of (4.2),\
    \ we associate a Lagrange multiplier λᵢ with the iᵗʰ constraint, and form the\
    \ Lagrangian function\n\nL(x, λ) = f(x) + Σᵢ₌₁ᵐ λᵢ (gᵢ(x) − bᵢ)   (4.3)\n\nThe\
    \ computational procedure for Lagrange multipliers requires that all the partials\
    \ of the Lagrange function (4.3) must equal zero at x* form the necessary conditions\
    \ that x* is a solution to the NLP problem; i.e., these conditions are required\
    \ for x = ⟨x₁, x₂, ..., xₙ⟩ to be a solution to (4.2). We have\n\n# Proposition.\
    \ Lagrange Multiplier Necessary Conditions.\n\nFor x* to be a solution of the\
    \ Lagrange function, all partials must satisfy\n∂L/∂xᵢ = 0   for i = 1,2,...,n\
    \ (variables)\n∂L/∂λⱼ = 0   for j = 1,2,...,m (constraints)\nat x*."
  merge: -1
  img_proc: true
- pgno: 178
  md: "The points x we will consider as candidates for optimal are\n\n# **Definition.\
    \ Regular Point.**\n\nx is a *regular point* iff the set `{∇gᵢ(x) : i = 1...m}`\
    \ is linearly independent.\n\nThe main theorem for Lagrange’s technique is\n\n\
    # **Theorem. Lagrange Multipliers.**\n\nLet x be a point satisfying the *Lagrange\
    \ multiplier necessary conditions*. Then\n\n+   a. If *f* is concave and each\
    \ *gᵢ* is linear, then x is an optimal solution of the maximization problem (4.2).\n\
    +   \n+   b. If *f* is convex and each *gᵢ* is linear, then x is an optimal solution\
    \ of the minimization problem (4.2).\n\nPreviously, we used the Hessian matrix\
    \ to determine if a function was convex, concave, or neither. Also note that the\
    \ theorem limits constraints to linear functions.\n\nWhat if the constraints are\
    \ nonlinear? We can use the *bordered Hessian* in the sufficient conditions. For\
    \ a bivariate Lagrangean function with one constraint\n\n$$L(\\{x_1,x_2\\},\\\
    lambda)=f(\\{x_1,x_2\\})+\\lambda(g(\\{x_1,x_2\\})-b),$$\n\ndefine the bordered\
    \ Hessian matrix as\n\n$$BdH=\\begin{bmatrix}0 & g_1 & g_2\\\\ g_1 & f_{11}-\\\
    lambda g_{11} & f_{12}-\\lambda g_{12}\\\\ g_2 & f_{21}-\\lambda g_{21} & f_{22}-\\\
    lambda g_{22}\\end{bmatrix}$$\n\nThe determinant of this bordered Hessian matrix\
    \ is\n\n$$|BdH|=g_1g_2\\cdot(f_{21}-\\lambda g_{21})+g_2g_1\\cdot(f_{12}-\\lambda\
    \ g_{12})-g_2^2\\cdot(f_{11}-\\lambda g_{11})-g_1^2\\cdot(f_{22}-\\lambda g_{22})$$\n\
    \nThe necessary condition for a *maximum* in the bivariate case with one constraint\
    \ is that the determinant of its bordered Hessian is positive when evaluated at\
    \ the critical point.\n\nThe necessary condition for a *minimum* in the bivariate\
    \ case with one constraint is the determinant of its bordered Hessian is negative\
    \ when evaluated at the critical point.\n\nIf x is a regular point and gᵢ(x) =\
    \ 0 (all constraints are satisfied at x),\n\n$$M_x=\\{y\\mid \\nabla g_i(x)\\\
    cdot y=0\\}$$\n\ndefines a plane tangent to the feasible region at x. (The ‘·’\
    \ is the usual dot product.)\n\n# **Lemma.**\n\nIf x is regular, gᵢ(x) = 0, and\
    \ ∇gᵢ(x) · y = 0, then ∇f(x) · y = 0."
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Note that the Lagrange Multiplier conditions are exactly the same for a minimization
    problem as for a maximization problem. This is the reason that these conditions
    alone are not sufficient conditions. Thus, a given solution can either be a maximum
    or a minimum. In order to determine whether the point found is a maximum, minimum,
    or saddle point we will use the Hessian.


    The value of the Lagrange multiplier itself has an important modeling interpretation.
    The multiplier λ is the “shadow price” for scarce resources. Thus, λᵢ is the shadow
    price of the ith constraint. If the right-hand side of the constraint is increased
    by a small amount, say Δ, then the optimal solution will change by λᵢ · Δ. We
    will illustrate shadow prices both graphically and computationally.


    # Graphical Interpretation of Lagrange Multipliers


    We can best understand the method of Lagrange multipliers by studying its geometric
    interpretation. This geometric interpretation involves the gradients of both the
    function and the constraints. Initially, consider only one constraint, g(x) =
    b, then the Lagrangian equation simplifies to


    $$\nabla f = \lambda \nabla g.$$


    The solution is the point **x** where the gradient vector ∇g(x) is perpendicular
    to contours on the surface. The gradient vector ∇f always points in the direction
    *f* increases fastest. At either a maximum or a minimum, this direction must be
    perpendicular to contour lines on *f*’s surface *S*. Thus, since both ∇f and ∇g
    point along the same perpendicular line, then ∇f = λ∇g. Further, *g*’s curve must
    be tangent to *f*’s contours at optimal points. See Figure 4.14. The geometrical
    arguments are similar for the case of multiple constraints.


    ![](img/0f04050177d82aebd17d3383d7334896_179_0.png)


    (a) Contours and Constraint　　　　　　　　　(b) Surface and Constraint


    FIGURE 4.14: Lagrange Multipliers Geometrically: One Equality Constraint'
  merge: -1
  img_proc: true
