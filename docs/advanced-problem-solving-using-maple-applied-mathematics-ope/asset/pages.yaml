  md: '# **Example 3.4. Oil Pumping Station Location.**


    Rigs-R-Us has an oil-drilling rig 9.5 miles offshore. The drilling rig will be
    connected to a pumping station via an underwater pipe which then connects to a
    refinery by a land-based pipe. The refinery is 15.7 miles down the shoreline from
    the drilling rig. See Figure 3.2. Underwater pipeline costs $32,575 per mile


    ![](img/0f04050177d82aebd17d3383d7334896_116_0.png)


    to install, land-based pipeline costs $14,442 per mile. Determine a location for
    the pumping station that minimizes the total cost of the pipeline.


    *Problem.*


    Find a relationship between the location of the pumping station and cost of the
    installation of the pipe, then minimize the cost.


    *Assumptions.*


    First, we assume no cost saving for the pipe if we purchase in larger lot sizes.
    We further assume the costs of preparing the terrain to lay the pipe, both offshore
    and on land, are captured in given cost per mile figures.


    *Variables.*


    $x$ = the location of the Pumping station along the horizontal distance from $x
    = 0$ to $x = 15.7$ miles


    $TC$ = total cost of the pipe for both underwater and on-land piping


    *Model Construction.*


    Use the Pythagorean Theorem for the underwater distance of the pipe; that is,
    the hypotenuse of the right triangle with height 9.5 miles and base $x$ miles
    along the shoreline. The length of the hypotenuse is $\sqrt{9.5^2 + x^2}$. The
    length of the pipe on shore is $15.7 - x$. Therefore total cost is


    ```

    $$TC = 32575\cdot\sqrt{9.5^2+x^2}+14442\cdot(15.7-x).$$

    ```


    We turn to Maple for a Second Derivative Test to determine the minimum cost Pumping
    Station location.'
