  md: "next point $x_{k+1}$ cannot be computed. (*Explain why?*) This method finds\
    \ only approximates the value of critical points; it does not know what it is\
    \ finding a maximum or a minimum of the original function. Use the sign of the\
    \ second derivative to determine whether the critical value is a maximum, minimum,\
    \ or neither (a likely inflection point).\n\n# **Example 3.9. A Simple Application.**\n\
    \nMaximize the polynomial $p(x)=5x-x^2$ over the interval $[0,7]$.\n\nThis simple\
    \ problem is easy to solve using elementary calculus.\n\n+   1. Differentiate:\
    \ $p'=5-2x$.\n+   \n+   2. The only critical point, the root of $p'$, is $x^*=5/2$.\n\
    +   \n+   3. Differentiate again: $p''=-2<0$.\n+   \n+   4. The Second Derivative\
    \ Test indicates that $p$ has a maximum of $25/4$ at $x^*=5/2$.\n\nLet's use Maple\
    \ to implement the modified Newton’s method for finding the maximum of $p$.\n\n\
    ```\n```text\n> p := x → 5x − x² :\n  dp := D(p) :\n  ddp := D(dp) :\n\n> Newton\
    \ := x → x − dp(x)/ddp(x) :\n```\n```\n\nStart with $x_0=1.0$.\n\n```\n```text\n\
    > x₀ := 1.0 :\n  x₁ := Newton(x₀);\n  x₂ := Newton(x₁);\n\n                  \
    \       x[0] := 1.0\n                         x[1] := 2.500000000\n          \
    \               x[2] := 2.500000000\n```\n```\n\nStarting at any other value also\
    \ yields $x^*=2.5$. Since this simple quadratic function has a linear derivative,\
    \ the linear approximation of the derivative will be exact regardless of the starting\
    \ point, and the answer will appear at the second iteration. See **Figure 3.6**.\
    \ Algebraically simplifying the method’s iterating function for $p$ confirms this:\
    \ $Newton(x)=2.5$."
