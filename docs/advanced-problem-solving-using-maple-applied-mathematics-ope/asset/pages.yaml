  md: 'The Allies successfully landing at Calais would earn 100 points, successfully
    landing at Normandy would earn 80 points, and failure at either landing would
    earn 0 points. What decisions should be made?


    We compute the expected values, placing them in the payoff matrix of Table 7.17.


    **TABLE 7.17: Payoff Matrix for Allied Landing**


    | Allied Landing | Normandy | Calais |

    |---|---:|---:|

    | Normandy | 0.75 · 80 = 60 | 1 · 80 = 80 |

    | Calais | 1 · 100 = 100 | 0.2 · 100 = 20 |


    There are no pure strategy solutions in this example. We use mixed strategies,
    and determine the game’s outcome.


    The Allies would employ a mixed strategy of 80% Normandy and 20% Calais to achieve
    an outcome of 68 points. At the same time, the Germans should employ a strategy
    of 60% Normandy and 40% Calais for their defenses to keep the Allies at 68 points.


    Implementation of the landing was certainly not two-pronged. So what do the mixed
    strategies imply in strategic thinking? Most likely a strong feint at Calais and
    lots of information leaks about Calais, while the real landing at Normandy was
