- pgno: 361
  md: 'Examining the shadow prices from the dual linear program for DMU₂ shows λ₅
    = 0.26, λ₄ = 0.66, and λ₃ = 0. The average output vector for DMU₂ can be written
    as


    $$0.26\begin{bmatrix}9\\4\\16\end{bmatrix}+0.66\begin{bmatrix}4\\9\\13\end{bmatrix}=\begin{bmatrix}5\\7\\12.785\end{bmatrix},$$


    and its average input vector is


    $$0.26\begin{bmatrix}5\\14\end{bmatrix}+0.66\begin{bmatrix}7\\12\end{bmatrix}=\begin{bmatrix}5.94\\11.6\end{bmatrix}.$$


    Output 3 in Table 8.2 is 10 units. Thus, the inefficiency is in Output 3, where
    12.785 units are required. We find that they are short 2.785 units (= 12.785 −
    10). This calculation helps focus on treating the inefficiency found for Output
    3.


    # SENSITIVITY ANALYSIS.


    In linear programming, sensitivity analysis is sometimes referred to as “what
    if” analysis. Assume that without management providing some additional training,
    DMU₂’s Output 3 value dips from 10 to 9 units, while Input 2 increases from 15
    to 16. We find that these changes in the technological coefficients are easily
    handled when re-solving the LPs. Since DMU₂ is affected, we might only modify
    and solve the LP for DMU₂. With these changes, DMU₂’s efficiency is now only 74%
    of DMU₁ or DMU₃.


    # Example 8.2. Ranking Five Departments in a College.


    Five science departments in the College of Arts & Sciences are scheduled for review.
    The dean has provided the data in Table 8.3 and asked for relative efficiency
    ratings.


    | Department | Inputs |  | Outputs |  |  |

