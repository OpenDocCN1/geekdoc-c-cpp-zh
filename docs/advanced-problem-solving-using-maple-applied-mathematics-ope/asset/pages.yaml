  md: "![](img/0f04050177d82aebd17d3383d7334896_123_0.png)\n\nFIGURE 3.5: Golden Section\
    \ Search Interval Progression\n\nThe Golden Section search is written in algorithmic\
    \ form below.\n\n+   **Golden Section Search Algorithm**\n+   \n+   Find the maximum\
    \ of the unimodal function $f$ on the interval $[a,b]$.\n+   \n+   **Inputs:**\n\
    +   - Function: $f$\n+   - Endpoints: $a, b$\n+   - Tolerance: $t$\n+   \n+  \
    \ **Outputs:** Optimal point $x^*$ and maximum value $f(x^*)$\n+   \n+   **Step\
    \ 1.** Initialize: Set $r = 0.618$, $a_0 = a$, $b_0 = b$, counter $k = 1$, limit\
    \ $N = \\lceil \\ln(t/(b-a))/\\ln(0.618)\\rceil$.\n+   \n+   **Step 2.** Calculate\
    \ the test points $x_1 = a_{k-1} + r(b_{k-1}-a_{k-1})$ and $x_2 = b_{k-1} - r(b_{k-1}-a_{k-1})$.\n\
    +   \n+   **Step 3.** Compute $f(x_1)$ and $f(x_2)$.\n+   \n+   **Step 4.** If\
    \ $f(x_1) \\geq f(x_2)$, then $I_k = [x_2,b]$; that is $a = x_2$.\n+   If $f(x_1)\
