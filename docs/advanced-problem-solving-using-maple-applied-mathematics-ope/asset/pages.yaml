- pgno: 299
  md: '# Introduction


    **Perfect Information:** A game has *perfect information* if either in a sequential
    game, every player knows the strategies chosen by the players who preceded them,
    or in a simultaneous game each player knows the other players’ strategies and
    outcomes in advance.


    **Constant Sum** or **Zero-Sum:** A game is a *constant sum game* if the sums
    of the payoffs are the same for every set of strategies, and a *zero-sum game*
    if the payoff sum is always zero. In these games, one player gains if and only
    if another player loses; otherwise, we have a *variable sum game*.


    **Extensive Form:** The game is presented in a tree diagram.


    **Normative Form:** The game is presented as a payoff matrix. In this chapter
    we only present the normative form and its associated solution methodologies.


    **Outcomes:** An *outcome* is a set of payoffs resulting from the actions or strategies
    taken by all players.


    **Total Conflict Game:** A game between players where the sums of the outcomes
    for all strategy pairs are either the same constant or zero.


    **Partial Conflict Game:** A game whose outcome sums are variable.


    The study of game theory has provided many classical and standard games that provide
    insights into play, tactics, and strategy. **Table 7.1** provides a short summary
    of several classical games; a full list is at:


    http://en.wikipedia.org/wiki/List_of_games_in_game_theory


    We will primarily be concerned with two-person games. The irreconcilable, conflicting
    interests between two players in a game surprisingly resemble both parlor games
    and military encounters between enemy states. Giordano et al. [GFH2014] explain
    two-person games in the context of mathematical modeling. Players make moves and
    counter-moves, until the *rules of engagement* declare the game is ended. The
    rules of engagement determine what each player can or must do at each stage—the
    available and/or required moves given the circumstances of the game at the current
    stage—as the game unfolds. For example, in the game Rock, Paper, Scissors, both
    players simultaneously make one move, with rock beating scissors beating paper
    beating rock. While this game consists of only one selection of a move (decision
    choice), games like Chess or Go can require hundreds of moves to end.


    Outcomes or payoffs in a game are determined by the strategies players choose
    and play. These outcomes may come from calculated values or expected values, ordinal
    rankings, cardinal values developed from a lottery system (See [vNM1944], [Straffin1993]),
    or cardinal values derived from pairwise comparisons (See [Fox2014]). Here we
    will assume we have cardinal outcomes (interval or ratio data) or payoffs for
    our games, since this will allow us to do mathematical calculations.'
  merge: -1
  img_proc: true
