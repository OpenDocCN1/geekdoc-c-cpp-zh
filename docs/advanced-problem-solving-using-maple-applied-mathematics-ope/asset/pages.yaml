  md: "We found approximations to the two roots as $x = 3.2679449192$ and $x = 6.732050808$.\n\
    \nWe will often create **procs** in both volumes of this text to solve problems\
    \ using specialized techniques.\n\n# A Quick Review of Key Commands\n\n# Assignments\
    \ and Basic Mathematics\n\nFor example, let’s compute $(1.2^{4.1} + 4.3(9.8))/34$.\n\
    \n```\n```maple\n> (1.2^4.1 + 4.3 · 9.8)/34;\n                         1.301522146\n\
    ```\n```\n\nAll Maple statements are entered after the `>` prompt. Again note\
    \ that Maple commands end with a semicolon; in the document interface, semicolons\
    \ are optional. Maple output, printed in blue, is centered in the page.\n\nTo\
    \ assign a label or name to a number or an expression, we use `:=`. For example,\
    \ let’s use two Maple statements to assign $a$ the value 11.5 and $b$ the value\
    \ 9.\n\n```\n```maple\n> a := 11.5;\n                         a := 11.5\n\n> b\
    \ := 9;\n                         b := 9\n```\n```\n\nWe can enter multiple commands\
    \ on the same line or in the same input cell. If we separated the two commands\
    \ with a colon instead of a semicolon, only the second command would be displayed\
    \ in the output even though both commands were executed. A colon suppresses output.\n\
    \n```\n```maple\n> a := 11.5 : b := 9;\n                         b := 9\n```\n\
    ```\n\nOnce the assignments have been made we can perform arithmetic operations.\
    \ For example, let’s compute $a^2+b^3$, $a^2\\cdot b^3$, and $\\sqrt{a^2+b^3}$.\n\
    \n```\n```maple\n> a^2 + b^3;\n  a^2 · b^3;\n  sqrt(a^2 + b^3);\n            \
    \             861.25\n                         96410.25\n                    \
    \     29.34706118\n```\n```\n\nA very useful command is **evalf**. This command\
    \ produces the decimal equivalent of a given expression. Its mnemonic is *evaluate\
    \ as floating point (decimal)*."
