    # Procedures


    The proc command is very useful. The following comes directly from the Maple Help
    page in Maple 2019 and explains and provides an example for a procedure.


    # Procedures


    | Calling Sequence | Evaluation Rules |

    |---|---|

    | Parameters | Notes |

    | Description | Examples |

    | Implicit Local Variables | Details |

    | The Operands of a Procedure | |


    ```

    Calling Sequence

    proc (parameterSequence) :: returnType; local localSequence;

    global globalSequence; option optionSequence; description

    descriptionSequence; uses usesSequence; statementSequence

    end proc;

    ```


    # Parameters


    parameterSequence - formal parameter declarations

    returnType - (optional) assertion on the type of the returned value

    localSequence - (optional) names of local variables

    globalSequence - (optional) names of global variables used in the procedure

    optionSequence - (optional) names of procedure options

    descriptionSequence - (optional) sequence of strings describing the procedure

    usesSequence - (optional) names of modules or packages the procedure uses

    statementSequence - statements comprising the body of the procedure'
