- pgno: 213
  md: '# TABLE 4.10: Mutual Fund Investment Data


    |  | A | B | C |

    |---|---:|---:|---:|

    | Expected Value | 0.14 | 0.11 | 0.10 |

    | Variance | 0.2 | 0.08 | 0.18 |


    |  | AB | AC | BC |

    |---|---:|---:|---:|

    | Covariance | 0.05 | 0.02 | 0.03 |


    We use laws of expected value, variance, and covariance in our model.


    **MODEL FORMULATION.** Let $x_j$ be the number of dollars invested in fund $j$
    for $j = 1, 2, 3$, representing Funds $A$, $B$, and $C$. Our objective is to minimize
    the variance of the investment, so


    $$V = \operatorname{var}(x_1A + x_2B + x_3C)$$

    $$= x_1^2\operatorname{var}(A) + x_2^2\operatorname{var}(B) + x_3^2\operatorname{var}(C)
    + 2x_1x_2\operatorname{cov}(AB) + 2x_1x_3\operatorname{cov}(AC)$$

    $$\qquad + 2x_2x_3\operatorname{cov}(BC)$$

    $$= 0.20x_1^2 + 0.08x_2^2 + 0.18x_3^2 + 0.10x_1x_2 + 0.04x_1x_3 + 0.06x_2x_3$$


    Our constraints are: $g_1$, the expected return is at least 12%, and $g_2$, the
    sum of the investments is no more than $\$5000$. We have the NLP


    Minimize $V = 0.20x_1^2 + 0.08x_2^2 + 0.18x_3^2 + 0.10x_1x_2 + 0.04x_1x_3 + 0.06x_2x_3$


    subject to


    $$0.14x_1 + 0.11x_2 + 0.10x_3 \geq 0.12 \cdot 5000 = 600$$

    $$x_1 + x_2 + x_3 \leq 5000$$


    **SOLUTION.** Set up the Lagrangian function $L$.


    $$L(x, \lambda, \mu) = f(x) + \lambda_1(g_1(x) - \mu_1^2 - 600) + \lambda_2(g_2(x)
    + \mu_2^2 - 5000)$$


    * (Why is $\mu_1^2$ subtracted rather than added?) *


    Define the functions for the model and calculate the necessary conditions.


    ```

    with(Student[MultivariateCalculus]):


    V := x -> 0.20x₁² + 0.08x₂² + 0.18x₃² + 0.10x₁x₂ + 0.04x₁x₃ + 0.06x₂x₃:

    g₁ := x -> 0.14x₁ + 0.11x₂ + 0.10x₃:

    g₂ := x -> x₁ + x₂ + x₃:


    grad := Gradient(L(x, λ, μ), [x₁, x₂, x₃, λ₁, λ₂]):

    ```'
