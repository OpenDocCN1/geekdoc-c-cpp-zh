  md: "+   (a) $n = 3$.  \n+   (b) $n = 4$.  \n+   (c) $n = 5$.  \n+   (d) $n > 5$.\n\
    \n# 5.3  Models with Unique Solutions Using Systems of Linear Equations\n\nLet’s\
    \ use the method of joints to analyze the Warren truss from the Introduction.\n\
    \n**Example 5.3. Analysis of a Truss by the Method of Joints.** A segment of a\
    \ Warren truss with vertical supports that is fixed at the lower left endpoint\
    \ $p_1$, and can move horizontally at the lower right endpoint $p_4$ is displayed\
    \ in Figure 5.5. The pin-joints of the truss are at $p_1$, $p_2$, $p_3$, and $p_4$.\
    \ A load of 10 kilonewtons (kN) is placed at joint $p_3$; the forces on the truss\
    \ with magnitudes $f_1$, $f_2$, $f_3$, $f_4$, and $f_5$ are indicated in the figure.\
    \ The stationary support member has a horizontal force $F_1$ and a vertical force\
    \ $F_2$; the horizontally movable support member has only a vertical force $F_3$.\n\
    \n![](img/0f04050177d82aebd17d3383d7334896_226_0.png)\n\nFigure 5.5: A Warren\
    \ Truss with Vertical Supports Segment\n\nSince the truss is in static equilibrium,\
    \ Newton’s Law for equilibrium of forces implies that the sum of the force vectors\
    \ at each joint must be the zero vector. Therefore, the sum of the horizontal\
    \ components of the forces and the sum of the vertical components must each be\
    \ zero."
