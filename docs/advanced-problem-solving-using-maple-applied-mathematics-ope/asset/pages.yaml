    \ | 36028797018963967 |\n| 60 | 1152921504606846975 |\n| 64 | 18446744073709551615\
    \ |\n\nThe table above shows that 18446744073709551615 ≈ 1.84467 × 10^19 minutes\
    \ are needed. Let’s convert to units that are equivalent. There are 1440 minutes\
    \ in a day and 525,600 minutes in a year. At one move per minute, a(64) is equivalent\
    \ to 3.5135 × 10^13 years. Imagine how long that amount of time really is. (The\
    \ estimated age of the universe is 1.37 × 10^10 years.)\n\nThe power of discrete\
    \ dynamical systems is that they can always be solved by iteration. Between the\
    \ table of iteration values and a graph of those values, we are able to analyze\
    \ difficult modeling problems.\n\nIn Maple, to obtain the iteration values, we\
    \ can either write a procedure with proc or, when the recurrence has a closed-form\
    \ solution, use the rsolve and seq commands. We illustrate both below to obtain\
    \ the values seen in Tables 2.1 and 2.2. First, rsolve and seq.\n\n```\nrsolve({H(n\
    \ + 1) = 2 · H(n) + 1, H(1) = 1}, H(n));\n                         -1 + 2^n\n\
    ```\n\nWe have a closed-form analytical solution H(n) = 2^n − 1. If there had\
    \ not been a formula, rsolve would just have echoed the input. Using rsolve is\
