    # Example 2.3. A Drug Dosage Problem.


    A doctor prescribes an oral dose of 100 mg of a certain drug every hour for a
    patient. Assume that the drug is immediately absorbed into the bloodstream once
    taken. Also, assume that every hour the patient’s body eliminates 25% of the drug
    that is in the bloodstream. Suppose that the patient’s bloodstream had 0 mg of
    the drug prior to taking the first pill. How much of the drug will be in the patient’s
    bloodstream after 72 hours?


    *General Problem Statement.*

    Determine the relationship between the amount of drug in the bloodstream and time.


    *Assumptions.*


    +   - The problem can be modeled by a discrete dynamical system.

    +   - The patient is of normal size and health.

    +   - There are no other drugs being taken that will affect the prescribed drug.

    +   - There are no internal or external factors that will affect the drug absorption
    or elimination rates.

    +   - The patient always takes the prescribed dosage at the correct time.


    *Variables.*

    Define \(a(n)\) = amount of drug that is in the bloodstream after a period of
    \(n = 0, 1, 2, \ldots\) hours.'
