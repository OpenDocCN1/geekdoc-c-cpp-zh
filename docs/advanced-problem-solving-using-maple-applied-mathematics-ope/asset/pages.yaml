    | Chemistry | 15 |  | 8,190 | 4,049 | 23 |

    | Comp. Sci. | 10 |  | 2,857 | 1,255 | 31 |

    | Math. | 33 |  | 22,277 | 6,102 | 31 |

    | Physics | 12 |  | 6,830 | 2,910 | 19 |


    ²Adapted from [Bauldry2009a].'
