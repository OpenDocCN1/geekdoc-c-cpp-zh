- pgno: 233
  md: 'data points via cubic polynomials to form a piecewise curve. These curves are
    called “cubic splines,” cubic for the third degree and spline after the flexible
    draftsman’s ruler originally used to draw the curves. The data points are called
    “knots.” Pierre Bézier, a French design engineer at Renault, introduced using
    splines for designing auto bodies in the 1960s. Splines are ubiquitous today,
    appearing in numerous applications. TrueType, developed by Apple in the 1990s,
    uses two-dimensional quadratic splines to form the characters on your phone or
    computer screen, and PostScript, developed by Adobe in the 1980s, uses two-dimensional
    cubic splines for printed characters.


    # Example 5.6. Natural Cubic Splines as a System of Equations.


    Fit a natural cubic spline⁷ to the data


    | $x$ | 7 | 14 | 21 | 28 | 35 | 42 |

    |---|---:|---:|---:|---:|---:|---:|

    | $y$ | 125 | 275 | 800 | 1200 | 1700 | 1650 |


    We will need 5 third order equations.


    for $x \in [7,14]$: $S_1(x)=a_{1,3}x^3+a_{1,2}x^2+a_{1,1}x+a_{1,0}$


    for $x \in [14,21]$: $S_2(x)=a_{2,3}x^3+a_{2,2}x^2+a_{2,1}x+a_{2,0}$


    for $x \in [21,28]$: $S_3(x)=a_{3,3}x^3+a_{3,2}x^2+a_{3,1}x+a_{3,0}$


    for $x \in [28,35]$: $S_4(x)=a_{4,3}x^3+a_{4,2}x^2+a_{4,1}x+a_{4,0}$


    for $x \in [35,42]$: $S_5(x)=a_{5,3}x^3+a_{5,2}x^2+a_{5,1}x+a_{5,0}$


    There are 20 unknowns: $a_{i,j}$, so we need 20 equations to uniquely solve for
    these unknowns. The $(x,y)$ data pairs give 10 equations, $S_1(7)=125$, $S_1(14)=275$,
    $S_2(14)=275$, $S_2(21)=800$, and so forth. We need 10 more equations.


    To make the spline smooth, we require the curve to have both first and second
    derivatives equal, i.e., match slope and concavity, at the knots (data points).
    So, for $i=1..4$, make


    $S_i''(x_{i+1})=S_{i+1}''(x_{i+1})$ and $S_i''''(x_{i+1})=S_{i+1}''''(x_{i+1})$.


    These requirements give us 8 more equations. For the last two equations, use the
    condition for “natural” splines:


    $S_1''(x_1)=0$ and $S_5''(x_6)=0$


    We have the requisite 20 equations. Let’s use Maple to build the equations, the
    augmented coefficient matrix, and find the spline.


    > ⁷Natural cubic splines mimic the original engineer’s flexible ruler by requiring
    that the second derivative of the spline at the two end data points be 0. “Clamped”
    cubic splines use specified values for the first derivative at the two end data
    points.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "First, we load the needed packages and enter the data.\n\n```\nwith(LinearAlgebra):\n\
    with(plots):\nN := 6:\nX := [(7k) $ k = 1..6]:\nY := [125, 275, 800, 1200, 1700,\
    \ 1650]:\nPts := zip((x, y) → [x, y, X, Y]):\n    Pts := [[7,125], [14,275], [21,800],\
    \ [28,1200], [35,1700], [42,1650]]:\n```\n\nWe define the individual cubic functions\
    \ using an “indexed proname” to make the code more general.\n\n```\nS := proc(x)\n\
    \    local i;\n    i := op(x);\n    return(a[i,3] · x^3 + a[i,2] · x^2 + a[i,1]\
    \ · x + a[i,0];\nend proc:\n```\n\nNow define the natural cubic spline function\
    \ for our 6 point data set.\n\n```\nSpline := proc(x)\n    piecewise(x ≤ X₂, S₁(x),\
    \ x ≤ X₃, S₂(x), x ≤ X₄, S₃(x),\n              x ≤ X₅, S₄(x), S₅(x));\nend proc:\n\
    ```\n\nIn order to avoid some convoluted statements, we’ll define the cubic segment’s\
    \ derivative functions directly.\n\n```\ndS := proc(x)\n    local i;\n    i :=\
    \ op(proname);\n    return(3 · a[i,3] · x^2 + 2a[i,2] · x + a[i,1]);\nend proc:\n\
    \nd2S := proc(x) local i;\n    i := op(proname);\n    return(6 · a[i,3] · x +\
    \ 2a[i,2]);\nend proc:\n```\n\nLet’s calculate the 3 sets of equations that make\
    \ up the system of 20 linear equations.\n\n```\nKnotEqs := seq('Sᵢ(Xᵢ) = Yᵢ, Sᵢ(Xᵢ₊₁)\
    \ = Yᵢ₊₁', i = 1..N − 1):\nSmoothEqs := seq('dSᵢ(Xᵢ₊₁) = dSᵢ₊₁(Xᵢ₊₁)', i = 1..N\
    \ − 2),\n            seq('d2Sᵢ(Xᵢ₊₁) = d2Sᵢ₊₁(Xᵢ₊₁)', i = 1..N − 2):\nNaturalEqs\
    \ := d2S₁(X₁) = 0, d2S₅(X₆) = 0:\n```\n\nDisplaying the sets as vectors makes\
    \ them much easier to read."
  merge: -1
