- pgno: 301
  md: '([CH2000]). We conclude by briefly discussing the *Nash arbitration scheme*
    and its nonlinear formulation.


    Concepts and solution methodologies of *N*-person games, such as three-person
    total- and partial-conflict games, will be left to future studies.


    # 7.2  Background of Game Theory


    Game theory is the study of strategic decision making; that is, “the study of
    mathematical models of conflict and cooperation between intelligent rational decision-makers”
    ([Myerson1991]). Game theory has applications in many areas of business, military,
    government, networks, and industry. For more information on applications of game
    theory in these areas, see [CS2001], [Cantwell2003], [EK2010], and [Aginger1999].
    Additionally, [MF2009] discusses game theory in warlord politics which blends
    military and diplomatic decisions.


    The study of game theory began with total conflict games, also known as zero-sum
    games, such that one person’s gain exactly equals the net losses of the other
    player(s). Game theory continues to grow with application to a wide range of applied
    problems. A “Google Scholar” search returns over 3 million items.


    The Nash equilibrium for a two-player, zero-sum game can be found by solving a
    linear programming problem and its dual solution ([Dantzig1951] and [Dantzig2002],
    [Dorfman1951]). In their work, Dantzig and Dorrtman, respectively, assume that
    every element of the payoff matrix containing outcomes or payoffs to the row player
    Mᵢⱼ is positive. More current approaches (e.g., [Fox2008] and [Fox2010]) show
    the payoff matrix entries can be positive or negative.


    # 7.2.1  Two-Person Total Conflict Games


    We begin with characteristics of the two-person total conflict game following
    [Straffin1993]:


    There are two participants: the first, Rose, is the *row player*, and the other,
    Colin, is the *column player*.


    Rose must choose from among her 1 to *m* strategies, and Colin must choose from
    among his 1 to *n* strategies.


    If Rose chooses the *i*th strategy and Colin the *j*th strategy, then Rose receives
    a payoff of aᵢⱼ and Colin loses the amount aᵢⱼ. In Table 7.2, this is shown as
    a payoff pair where Rose receives a payoff of Mᵢⱼ and Colin receives a payoff
    of Nᵢⱼ.


    *Games are simultaneous and repetitive.*'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'There are two types of possible solutions. A *pure strategy solution* is where
    each player achieves their best outcomes by always choosing the same strategy
    in repeated games. A *mixed strategy solution* is where players play a random
    selection of their strategies in order to obtain the best outcomes in simultaneous
    repeated games.


    Although we do not address them in this chapter, in sequential games, the players
    look ahead and reason back.


    Table 7.2 shows a generic payoff matrix for simultaneous games.


    **TABLE 7.2: General Payoff Matrix of a Two-Person Total Conflict Game**


    | Rose’s Strategies / Colin’s Strategies | *Column 1* | *Column 2* | ⋯ | *Column
    n* |

    |---|---|---|---|---|

    | *Row 1* | (M₁,₁, N₁,₁) | (M₁,₂, N₁,₂) | ⋯ | (M₁,ₙ, N₁,ₙ) |

    | *Row 2* | (M₂,₁, N₂,₁) | (M₂,₂, N₂,₂) | ⋯ | (M₂,ₙ, N₂,ₙ) |

    | ⋮ | ⋮ | ⋮ | ⋱ | ⋮ |

    | *Row m* | (Mₘ,₁, Nₘ,₁) | (Mₘ,₂, Nₘ,₂) | ⋯ | (Mₘ,ₙ, Nₘ,ₙ) |


    A game is a *total conflict game* if and only if the sum of the pairs Mᵢ,ⱼ + Nᵢ,ⱼ
    always equals either 0 or the same constant c for all strategies i and j. If the
    sum equals zero, then we list only the row payoff Mᵢ,ⱼ.


    For example, if a player wins x when the other player loses x, then the sum Mᵢ,ⱼ
    + Nᵢ,ⱼ = x − x = 0. In a business marketing strategy, if one player gets x% of
    the market, then the other player gets y% = 100 − x% based upon 100% of the market.
    We list only x% as the outcome because when the row player receives x%, the column
    player loses x%.


    # Movement Diagrams


    A *movement diagram* draws arrows in each row (vertical arrow) and column (horizontal
    arrow) from the smaller payoff to the larger payoff. If there exists one or more
    payoffs where all arrows point towards it, then those payoffs constitute *pure
    strategy Nash equilibria*.


    # Example 7.1. Baseball Franchises.


    Several minor league baseball teams want to enter the market in a new area. The
    teams can choose to locate in a more densely populated area, or less densely populated
    town surrounded by other towns. Assume that both the National and American Leagues
    are interested in the new franchise. Suppose the National League will locate a
    franchise in either a densely populated area or a less densely populated area.
    The American League is making the same decision—they will locate either in a densely
    populated area or a less dense'
  merge: -1
  img_proc: true
