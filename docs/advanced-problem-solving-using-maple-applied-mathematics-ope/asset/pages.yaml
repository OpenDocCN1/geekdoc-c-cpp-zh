- pgno: 360
  md: '```

    > Inputs. W := ~1 : # ''~'' = 1'' applies ''= 1'' to each element.

    > DMUcons := convert(%, list) :

    >   [ 5 w1 + 14 w2 = 1 ]

    >   [ 8 w1 + 15 w2 = 1 ]

    >   [ 7 w1 + 12 w2 = 1 ]

    ```


    Now solve the three linear programs.


    ```

    > NumDMU := 3 :

    > for i to NumDMU do

    >   Constraints_i := MainConstraints union {DMUcons_i} :

    >   LPSolve(DMUObj, Constraints_i, assume = nonnegative,

    >     maximize) :

    >   Eff_i := fnormal(%, 4) :

    > end do :

    > Matrix(convert(Eff, list));

    ```


    ```

    [ 1.0    [t1 = 0.0, t2 = 0.0, t3 = 0.06250, w1 = 0.0, w2 = 0.07143] ]

    [ 0.7733 [t1 = 0.08000, t2 = 0.05333, t3 = 0.0, w1 = 0.0, w2 = 0.06667] ]

    [ 1.0    [t1 = 0.0, t2 = 0.0, t3 = 0.07065, w1 = 0.0, w2 = 0.08333] ]

    ```


    The linear program solutions show the relative efficiencies of DMU1 and DMU3 are
    100%, while DMU2''s is 77.3%.


    INTERPRETATION. DMU2 is operating at 77.3% of the efficiency of DMU1 and DMU3.
    Management could concentrate on improvements for DMU2 by taking best practices
    from DMU1 or DMU3.


    To compute the shadow prices for the linear programs, paying special attention
    to those of DMU2, solve the dual LPs. Maple''s dual command in the simplex package
    does not handle equality constraints, so replace all equalities with two inequalities
    ≤ and ≥.


    ```

    > for i to NumDMU do

    >   DualConstraints_i := MainConstraints union

    >   {1 ≤ lhs(DMUcons_i), 1 ≥ lhs(DMUcons_i)} :

    >   DualLP_i := simplex<-dual(DMUObj, DualConstraints_i, λ) :

    >   LPSolve(DualLP_i, assume = nonnegative) :

    >   DualEff_i := fnormal(%, 4) :

    > end do :

    > Matrix(convert(DualEff, list));

    ```


    ```

    [ 1.0    [λ1 = 0.0, λ2 = 1.0, λ3 = 0.0, λ4 = 0.0, λ5 = 1.0] ]

    [ 0.7733 [λ1 = 0.0, λ2 = 0.7733, λ3 = 0.0, λ4 = 0.6615, λ5 = 0.2615] ]

    [ 1.0    [λ1 = 0.0, λ2 = 1.0, λ3 = 0.0, λ4 = 1.0, λ5 = 0.0] ]

    ```'
