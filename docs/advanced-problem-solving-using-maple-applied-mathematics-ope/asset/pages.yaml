    # 2.4  Equilibrium Values and Long-Term Behavior


    # Equilibrium Values


    Recall our original paradigm


    > *Future = Present + Change.*


    When the DDS stops changing, *change* equals zero, and so *future* equals *present*,
    and remains there. A value for which *change* equals 0, if any exist,'
