    \ / (1 + e^(0.0545353x−1.1997)));\n\nplot(TDDamage, min(TD) − 1..max(TD), thickness\
    \ = 2);\n```\n\n![](img/0f04050177d82aebd17d3383d7334896_273_0.png)\n\nOnce again,\
    \ the analyst must decide over what intervals of x we call the y probability a\
    \ 1 or a 0 using the logistic S-curve shown above.\n\nDehumanization is not a\
    \ new phenomenon in human conflict. Societies have dehumanized their adversaries\
    \ since the beginnings of civilization in order to allow them to seize, coerce,\
    \ maim, or ultimately to kill while avoiding the pain of conscience for committing\
    \ these extreme, violent actions. By taking away the human traits of these opponents,\
    \ adversaries are made to be objects deserving of wrath and meriting the violence\
    \ as justice.⁷ Dehumanization still occurs today in both developed and underdeveloped\
    \ societies. The next example analyzes the impact that dehumanization has in its\
    \ various forms on the outcome of a state’s ability to win a conflict.\n\n# Example\
    \ 6.8. Conflict and Dehumanization.\n\nTo examine dehumanization as a quantitative\
    \ statistic, we combine a data set of 25 conflicts from Erik Melander, Magnus\
    \ Öberg, and Jonathan Hall’s"
