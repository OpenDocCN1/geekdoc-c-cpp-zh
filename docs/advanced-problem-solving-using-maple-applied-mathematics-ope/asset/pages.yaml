    # 4.4  Constrained Optimization: The Method of Lagrange Multipliers


    # Equality Constraints: Method of Lagrange Multipliers


    A company manufactures new phones that are projected to take the market by storm.
    The two main input components of the new phone are the circuit board and the LCD
    Touchscreen that make the phone faster, smarter, and easier to use. The number
    of phones to be produced $E$ is estimated to equal $E = 250a^{1/4}b^{1/2}$ where
    $a$ and $b$ are the number of circuit board production hours and the number of
    LCD Touchscreen production hours available, respectively. Such a formula is known
    to economists as a Cobb-Douglas function. Our laborers are paid by the type of
    work they do: the circuit board labor cost is $5$ an hour and the LCD Touchscreen
    labor cost is $8 an hour. What is the maximum number of phones that can be made
    if the company has $175,000 allocated for these components in the short run?'
