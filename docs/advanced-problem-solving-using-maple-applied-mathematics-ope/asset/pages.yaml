  md: 'Model.


    Define the following:


    $$B(n)=\text{ the number of bass in the lake after period }n$$

    $$T(n)=\text{ the number of lake trout in the lake after period }n$$

    $$B(n)\cdot T(n)=\text{ interaction of the two species}$$


    Then


    $$B(n+1)=1.20B(n)-0.0010\,B(n)\cdot T(n)$$

    $$T(n+1)=1.30T(n)-0.0020\,B(n)\cdot T(n)$$


    The equilibrium values can be found by substituting $B(n)=x$ and $T(n)=y$, then
    solving for $x$ and $y$. We have


    $$x=1.2x-0.001xy$$

    $$y=1.3y-0.002xy$$


    We rewrite these equations as


    $$0.2x-0.001xy=0 \qquad\Longrightarrow\qquad x(0.2-0.001y)=0$$

    $$0.3y-0.002xy=0 \qquad\Longrightarrow\qquad y(0.3-0.002x)=0$$


    The solution is $(x=0\text{ or }y=200)$ and $(y=0\text{ or }x=150)$ which gives
    the equilibrium values as $(0,0)$ and $(150,200)$.


    Our next task is to investigate the long-term behavior of the system and the stability
    of the equilibrium points.


    Hugh initially considered stocking 151 bass and 199 trout in his lake. The solution
    is left to the student as an exercise. (Don’t forget to use option <em>remember</em>
    in your programs for bass and trout.) From Hugh’s initial conditions, bass will
    grow without bound and trout will die out ($T(29)=0$). This is certainly not what
    Hugh had in mind.


    # Example 2.15. Fast Food Tendencies.


    The Student Union of a university that has 14,000 students plans to have fast
    food chains available serving burgers, tacos, and pizza. The chains commissioned
