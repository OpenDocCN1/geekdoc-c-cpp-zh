- pgno: 242
  md: 'chemist Antoine-Laurent de Lavoisier¹⁰ (1743–1794) introduced the law of *conservation
    of matter* during the latter half of the eighteenth century. The conservation
    law states that matter can neither be created nor destroyed. de Lavoisier’s principles
    of naming chemical substances are still used today.


    John Dalton¹¹ (1766–1844), developer of the first useful atomic theory of matter
    in the early 1800s, was the first to associate the ancient idea of atoms with
    stoichiometry. Dalton concluded, while studying meteorology, that evaporated water
    exists in air as an independent gas. Solid bodies cannot occupy the same space
    at the same time, but obviously water and air could. If the water and air were
    composed of discrete particles, evaporation might be viewed as mixing their separate
    particles. He performed a series of experiments on mixtures of gases to determine
    what effect properties of the individual gases had on the properties of the mixture
    as a whole. While trying to explain the results of those experiments, Dalton hypothesized
    that the sizes of the particles making up different gases must be different. Dalton
    wrote


    > it became an object to determine the relative sizes and weights, together with
    the relative numbers of atoms entering into such combinations... Thus a train
    of investigation was laid for determining the number and weight of all chemical
    elementary particles which enter into any sort of combination one with another.¹²


    According to Dalton’s *Atomic Theory of Matter* of 1803, all substances are composed
    of atoms. During a chemical reaction atoms may be combined, separated, or rearranged,
    but not created or destroyed. The postulates include:


    +   1. All matter is composed of atoms, indivisible and indestructible objects,
    which are the ultimate chemical particles.

    +   2. All atoms of a given element are identical, both in mass and in properties.
    Atoms of different elements have different masses and different properties.

    +   3. Compounds are formed by combination of two or more different kinds of atoms.
    Atoms combine in the ratio of small whole numbers.

    +   4. Atoms are the units of chemical change. A chemical reaction involves only
    the combination, separation, or rearrangement of atoms.


    Let’s examine the meaning of chemical equations and compare them to mathematical
    equations to gain some insights. A chemical equation identifies the starting and
    finishing chemicals as reactants and products: reactants → products.


    ¹⁰ See https://www.britannica.com/biography/Antoine-Lavoisier.

    ¹¹ See https://www.britannica.com/biography/John-Dalton.

    ¹² The quote is from Dalton’s notes for a lecture to the Royal Institution in
    London in 1810.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Chemical Equations vs. Mathematical Equations


    We usually think of an equation like $x+2x=3x$ as purely mathematical, even if
    $x$ represents a physical quantity like distance or mass. A chemical equation
    may look like a mathematical equation, but it describes experimental observations:
    the quantities and kinds of reactants and products for a particular chemical reaction.
    Reactants appear on the left side of a chemical equation; products on the right.
    For example, see Table 5.4. The products, which are the result of combining the
    reactants, are known from experimental observations – they are not derived mathematically.


    TABLE 5.4: Chemical Equation vs. Mathematical Equation


    | Chemical Equation | Mathematical Equation |

    |---|---|

    | Combustion of Propane<br>$\mathrm{C_3H_8 + 5O_2 \rightarrow 3CO_2 + 4H_2O}$
    | Linear Equation<br>$x=2x+3$ |

    | Left: reactants; right: products<br>Balanced when it reflects conservation of
    matter | No standard left/right order<br>Solved when all values that give a true
    statement are found |


    In fact, combining the same reactants at different concentrations or temperatures
    can often produce different products from the same reactants. First-year chemistry
    students cannot predict these effects, and are generally not asked to predict
    them. On the other hand, a chemical equation is similar to a mathematical equation
    in that there are certain restrictions on what may appear on the left and right
    sides. These mathematical rules represent the effects of conservation of matter
    on the reaction—conservation of matter says that no atoms are destroyed or created
    during a chemical reaction.


    # How a Chemist Approaches Balancing an Equation


    Many chemical equations, in the view of the chemists, can be balanced by inspection,
    that is, by the process of “trial and error.” The objectives of a chemist are:


    +   - Recognize a balanced equation.

    +   - Recognize an unbalanced equation.

    +   - Balance by inspecting chemical equations with given reactants and products.

    +   - Write the unbalanced equation when given compound names for reactants and
    products.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'According to chemistry textbooks, the step-wise procedure to balance equations
    is:


    +   STEP 1. Determine what reaction is occurring: know the reactants, the products,
    and the physical states.


    +   STEP 2. Write the unbalanced equation that summarizes the reaction described
    in Step 1.


    +   STEP 3. Balance the equation by inspection, starting with the most complicated
    molecules. Do not change the identities of any reactant or product.


    Thus, balancing the equation is done by inspection, a “trial and error” process
    that some students catch on to quickly, but others struggle with in frustration.


    # Balancing Equations with Systems of Equations


    Balancing chemical equations can be an application of solving a system of linear
    equations. Placing variables as the multipliers for each compound and making equations
    for each type of atom in the reaction results in a system of linear equations.
    This system is usually under-determined, there are more variables than equations.
    An under-determined system has infinitely many solutions. Our goal is to provide
    a procedure to find an integer solution from among the infinitely many solutions.
    This method is best grasped through an example which also lays the foundation
    for balancing more complicated oxidation-reduction equations.


    # Example 5.7. A Sulfur Dioxide Reaction.


    Balance the chemical equation


    $$\mathrm{S_6 + O_2 \longrightarrow SO_2}$$


    +   STEP 1. Introduce multipliers for each compound. There are three compounds,
    so we identify three multipliers: $\{x_1, x_2, x_3\}$. The reaction equation becomes


    $$x_1\mathrm{S_6} + x_2\mathrm{O_2} \longrightarrow x_3\mathrm{SO_2}$$


    +   STEP 2. Identify all elements: S (sulfur) and O (oxygen). Set up an equation
    for each element involving the amounts (multipliers) for that chemical on the
    reactant side equaling the amount on the product side.


    $$\begin{aligned}\mathrm{S:}\quad 6x_1 &= x_3\\[2pt]\mathrm{O:}\quad 2x_2 &= 2x_3\end{aligned}$$


    +   STEP 3. Create a homogeneous system; that is, put all variables on the left
    side of the equation and zero on the right.


    $$\begin{aligned}\mathrm{S:}\quad 6x_1 - x_3 &= 0\\[2pt]\mathrm{O:}\quad 2x_2
    - 2x_3 &= 0\end{aligned}$$'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'STEP 4. Write the system in matrix notation $A\mathbf{x}=\mathbf{b}$ where
    $A$ is the coefficient matrix and $\mathbf{b}$ is the column vector of zeros.
    Then form the augmented matrix for the system.


    $$[A\mid \mathbf{b}]=\begin{bmatrix}6&0&-1&\mid&0\\0&2&-2&\mid&0\end{bmatrix}$$


    STEP 5. Apply Gaussian elimination (row reduction) to the augmented matrix $[A\mid
    \mathbf{b}]$ to obtain $[H\mid \mathbf{c}]$, where $H$ is in reduced row echelon
    form.


    $$[H\mid \mathbf{c}]=\begin{bmatrix}1&0&-1/6&\mid&0\\0&1&-1&\mid&0\end{bmatrix}$$


    Read the system’s solution: $x_1-x_3/6=0$ and $x_2-x_3=0$.


    Balancing the chemical equation means finding the *smallest whole numbers* $x_1$,
    $x_2$, and $x_3$ solving the system. Since there are more equations than unknowns,
    there is an infinite number of solutions. Note that $x_3$ is part of every equation,
    so $x_3$ can equal anything. The fraction $1/6$ is a coefficient of $x_3$ in one
    of the equations, so choose $x_3$ to be the smallest whole number that eliminates
    the fraction; i.e., choose $x_3=6$. Then $x_1=1$ and $x_2=6$.


    The balanced reaction equation is


    $$\mathrm{S}_6+6\,\mathrm{O}_2\longrightarrow 6\,\mathrm{SO}_2.$$


    We are presented with the following more complicated unbalanced equation that
    would be difficult to solve by inspection.


    # Example 5.8. Ethylenediamine Mixed with Dinitrogen Tetroxide.


    Balance the reaction


    $$\mathrm{C}_2\mathrm{H}_8\mathrm{N}_2+\mathrm{N}_2\mathrm{O}_4\longrightarrow
    \mathrm{N}_2+\mathrm{CO}_2+\mathrm{H}_2\mathrm{O}$$


    STEP 1. Introduce five multipliers $x_1$ through $x_5$, one for each of the 5
    terms.


    $$x_1\,\mathrm{C}_2\mathrm{H}_8\mathrm{N}_2+x_2\,\mathrm{N}_2\mathrm{O}_4\longrightarrow
    x_3\,\mathrm{N}_2+x_4\,\mathrm{CO}_2+x_5\,\mathrm{H}_2\mathrm{O}$$


    STEP 2. List the equation for each element.


    $$\begin{aligned}

    \mathrm{C}:&\quad 2x_1=x_4\\

    \mathrm{H}:&\quad 8x_1=2x_5\\

    \mathrm{N}:&\quad 2x_1+2x_2=2x_3\\

    \mathrm{O}:&\quad 4x_2=2x_4+x_5

    \end{aligned}$$


    STEP 3. Write the augmented matrix for the homogeneous system.


    $$[A\mid \mathbf{b}]=\begin{bmatrix}2&0&0&-1&0&\mid&0\\8&0&0&0&-2&\mid&0\\2&2&-2&0&0&\mid&0\\0&4&0&-2&-1&\mid&0\end{bmatrix}$$'
