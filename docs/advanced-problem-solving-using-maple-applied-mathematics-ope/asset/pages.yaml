  md: 'For the plot, we''ll embed the contour plot into a 3D plot to make a better
    visual representation of $f$. To embed the plot, use the `transform` command from
    the `plots` package.


    ```

    T := transform((x, y) → [x, y, -500]);

    ```


    Then T will take a point $(x,y)$ on a 2D contour plot and embed it in a 3D plot
    on the plane $z=-500$.


    ```

    rng := (x = -10..10, y = -10..10):

    Surface := plot3d(f(x, y), rng, style = patchcontour, contours = 15):

    Contours := contourplot(f(x, y), rng, contours = 15):

    ```


    Now, put the graphs together.


    ```

    display(Surface, T(Contours));

    ```


    ![](img/0f04050177d82aebd17d3383d7334896_182_0.png)


    Rotate the 3D figure and inspect it from many different perspectives. Being able
    to rotate a 3D image is an incredibly useful feature.


    Back to the computations.

    The Lagrangian function is $L(x,y,\lambda)=f(x,y)+\lambda(g(x,y)-b)$.


    ```

    L := (x, y, λ) → f(x, y) + λ(3x + y − 6);

    ```


    Calculate the system of necessary conditions.


    ```

    NecessCond := {diff(L(x, y, λ), x) = 0, diff(L(x, y, λ), y) = 0,

    diff(L(x, y, λ), λ) = 0};

    NecessCond = {−4x + y + 8 + 3λ = 0, x − 4y + 3 + λ = 0, 3x + y − 6 = 0}

    ```


    Solve the system $NecessCond$ to find potential optimal points.'
