- pgno: 231
  md: 'We studied the method of least squares in Chapter 5 of Volume 1. We used multivariable
    calculus to minimize the sum of squares of the errors leading to least squares
    in Chapter 4, Volume 2. Now, we will consider least squares curve fitting as solving
    a system of linear equations.


    The sum of squares of the errors from fitting a parabola $f(x)=ax^2+bx+c$ is given
    by


    $$S=\sum_{i=1}^{n}\left(y_i-(ax_i^2+bx_i+c)\right)^2.$$


    To minimize $S$, first set the first partial derivatives equal to 0 and then solve
    the resulting system. After a little algebra, we have the normal equations


    $$\begin{aligned}

    \frac{\partial S}{\partial a}=0&=\sum y_ix_i^2-a\sum x_i^4-b\sum x_i^3-c\sum x_i^2\\

    \frac{\partial S}{\partial b}=0&=\sum y_ix_i-a\sum x_i^3-b\sum x_i^2-c\sum x_i\\

    \frac{\partial S}{\partial c}=0&=\sum y_i-a\sum x_i^2-b\sum x_i-c\sum 1

    \end{aligned}$$


    Rewrite these equations as a system of linear equations.


    $$\begin{aligned}

    a\sum x_i^4+b\sum x_i^3+c\sum x_i^2&=\sum y_ix_i^2\\

    a\sum x_i^3+b\sum x_i^2+c\sum x_i&=\sum y_ix_i\\

    a\sum x_i^2+b\sum x_i+c\sum 1&=\sum y_i

    \end{aligned}\tag{5.1}$$


    *Observe the pattern in the equations; what would the system be for a cubic fit?*


    # **Example 5.5. A Least Squares Model as a System of Equations.**


    Fit a quadratic model $f(x)=ax^2+bx+c$ to the following data:


    | $x$ | 0 | 1 | 2 | 3 | 4 |

    |---|---:|---:|---:|---:|---:|

    | $y$ | 62 | 50 | 39 | 18 | 2 |


    Substitute the following into (5.1).


    $$\sum 1=5,\quad \sum x_i=10,\quad \sum x_i^2=30,\quad \sum x_i^3=96,$$

    $$\sum y_i=171,\quad \sum y_ix_i=190,\quad \sum y_ix_i^2=400$$


    We have the linear system


    $$\begin{aligned}

    354a+96b+30c&=400\\

    96a+30b+10c&=190\\

    30a+10b+5c&=171

    \end{aligned}$$'
  merge: -1
