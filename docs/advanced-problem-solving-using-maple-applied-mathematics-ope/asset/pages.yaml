- pgno: 99
  md: "# A Discrete SIR Model of an Epidemic\n\nA new flu variant is spreading throughout\
    \ the United States. The Centers for Disease Control and Prevention (CDC) is interested\
    \ in knowing and experimenting with a model for this new disease prior to it actually\
    \ becoming a real epidemic. For our model, the population is divided into three\
    \ categories: susceptible, infected, and removed. We make the following assumptions.\n\
    \n+   - The community is closed; no one enters or leaves and there is no outside\
    \ contact.\n+   - Each person is either susceptible to the new flu, infected and\
    \ can spread the flu, or already has had the flu and now has immunity (includes\
    \ those who have died from the disease).\n+   - Initially, every person is either\
    \ susceptible or infected; there is no initial immunity.\n+   - Once someone contracts\
    \ this flu and recovers, they have immunity and cannot be reinfected.\n+   - The\
    \ average course of the disease is 2 weeks; during this time, the person is infected\
    \ and contagious.\n\nThe time period for our model will be one week. Define the\
    \ variables\n\n$n$ = the current week  \n$S(n)$ = the number that are susceptible\
    \ at week $n$  \n$I(n)$ = the number that are infected and contagious at week\
    \ $n$  \n$R(n)$ = the number that have recovered (or died) and are immune at week\
    \ $n$\n\nBegin by examining $R(n)$. The length of time someone has the flu is\
    \ 2 weeks. Thus, half the infected people will be removed each week. So\n\n$$R(n+1)=R(n)+0.5I(n).$$\n\
    \nThe value 0.5 is called the *removal rate* per week. This value represents the\
    \ proportion of the infected persons who are ‘removed’ from infection each week.\
    \ If real data were available, we would analyze the data to estimate the removal\
    \ rate parameter.\n\nNow examine $I(n)$. The number infected will both increase\
    \ by new infections and decrease by removed over time. As the disease lasts for\
    \ 2 weeks, half"
  merge: -1
  img_proc: true
- pgno: 100
  md: "the number infected are removed each week, 0.5 I(n). The increase is proportional\
    \ to the number of susceptibles that come into contact with an infected person\
    \ and subsequently catch the disease, a S(n) · I(n). The parameter a, the likelihood\
    \ that contact leads to infection, the transmission coefficient. We realize this\
    \ is a probabilistic coefficient. We will assume that this rate is a constant\
    \ that can be estimated from initial conditions.\n\nFor illustration, assume the\
    \ population is 1,000 students in dorms. The Health Center reported that 3 students\
    \ were infected initially. The next week, 5 students came to the Health Center\
    \ with flu-like symptoms. We have I(0) = 3 and S(0) = 997 and 5 new infections.\
    \ Then\n\n$$5 = aS(0)I(0) = a997 \\cdot 3 \\quad\\Longrightarrow\\quad a = 0.00167$$\n\
    \nThe normal course of the disease is 2 weeks, so on average, we expect 0.5 I(n)\
    \ to recover each week leaving 0.5 I(n) remaining infected. We now have\n\n$$I(n+1)=0.5I(n)+0.00167S(n)I(n)$$\n\
    \nLast, examine S(n). The number of susceptibles is decreased only by the number\
    \ that become infected. We use the same transmission coefficient as before to\
    \ obtain the model\n\n$$S(n+1)=S(n)-aS(n)I(n)$$\n\nOur coupled SIR model is\n\n\
    $$\\begin{aligned}\nS(n+1)&=S(n)-0.00167S(n)I(n)\\\\\nI(n+1)&=0.5I(n)+0.00167S(n)I(n)\\\
    \\\nR(n+1)&=R(n)+0.5I(n)\n\\end{aligned}\\tag{2.2}$$\n\nwith $(S(0), I(0), R(0))\
    \ = (997, 3, 0)$.\n\nThe Discrete SIR Model (2.2) can be solved iteratively and\
    \ viewed graphically. Do this with Maple to observe the behavior to gain insights.\
    \ (Use lowercase letters for the variables since in Maple I is predefined as I\
    \ = √−1.)\n\n```\nDSIR := proc(n :: integer)\n    local u, v, s, i, r;\n    global\
    \ s0, i0, r0;\n    option remember;\n    if n < 1 then\n        u := [s0, i0,\
    \ r0];    # Initial [susceptible, infected, removed]\n    else\n        v := DSIR(n\
    \ − 1);\n        s := v[1];    # current susceptible\n        i := v[2];    #\
    \ current infected\n        r := v[3];    # current infected\n        u := [s\
    \ − 0.00167 · s · i, 0.5 · i + 0.00167 · s · i, r + 0.5 · i];\n    end if;\n \
    \   return(u);\nend proc:\n```"
  merge: -1
  img_proc: true
