    Interpret the shadow prices we found, λ = 0 and μ = −3/2. If we only had the funds
    to increase one of the two constraint resources, which one should we choose? Since
    the shadow price of the first constraint is 0, we expect no improvement in the
    objective function’s value; we would not spend extra funds to increase the first
    resource. Since the shadow price of the second constraint is −1.5, we expect to
    change the objective function’s value by −1.5Δ (Improving the objective since
    we are minimizing!) if we increase that resource by Δ; we would spend extra funds
    to increase the second resource as long as the cost of increasing resource 2 was
    less than 1.5Δ. Why does the cost need to be less than 1.5Δ?


    # Applications using Lagrange Multipliers


    Many applied constrained optimization problems can be solved with Lagrange multipliers.
    We’ll start by revisiting the opening problem of this section (from page 162).


    # Example 4.21. The Cobb-Douglas Function.


    A company manufactures new phones that are projected to take the market by storm.
    The two main input components of the new phone are the circuit board and the LCD
    Touchscreen that make the phone faster, smarter, and easier to use. The number
    of phones to be produced P is estimated to equal P = 250 a^{1/4}b^{1/2} where
    a and b are the number of circuit board production hours and the number of LCD
    Touchscreen production hours available, respectively. This type of formula is
    known to economists as a Cobb-Douglas production'
