  md: '![](img/0f04050177d82aebd17d3383d7334896_136_0.png)


    FIGURE 4.1: Grid of the Five Departments


    The central computer will be positioned at coordinates $(m,n)$ where $m$ and $n$
    are both integers in the grid representing office space. Determine the coordinates
    $(m,n)$ that minimize the total amount of cable needed. Report the total number
    of feet of cable needed for this placement along with the coordinates $(m,n)$.


    To model and solve problems like this, we need **multivariable optimization**.
    In this chapter, our goal is to introduce both constrained and unconstrained nonlinear
    optimization. For a more thorough coverage, we suggest studying complete texts
    on the subject such as Ruszczynski’s *Nonlinear Optimization* (Princeton Univ.
    Press, 2006).


    # Basic Theory


    We begin with how to find an optimal solution, if one exists, for the unconstrained
    nonlinear optimization problem


    Maximize (or minimize) $f(x_1,x_2,\ldots,x_n)$ over $\mathbb{R}^n$


    We assume that all the first and second partial derivatives of $f$ exist and are
    continuous at all points in $f$’s domain. Let the partial derivative of $f$ with
    respect to $x_i$ be


    $$\frac{\partial f(x_1,x_2,\ldots,x_n)}{\partial x_i}.$$'
