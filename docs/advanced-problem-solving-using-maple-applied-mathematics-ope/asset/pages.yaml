  md: 'than B, then B must be 1/3 as important as A. Using reciprocals makes the pairwise
    comparison matrix a positive reciprocal matrix which must have a dominant eigenvalue
    with an associated eigenvector. That eigenvector, when normalized, gives a normalized
    set of weights. The eigenvalue helps determine the consistency of the decision
    maker’s ratings. Further analysis of methods and applications of consistency measurement
    appears in [Tennessee2006].


    Suppose we have the following pairwise comparison matrix from Example 8.10 with
    the criteria listed in rank order.


    ```

    > PCM := [ [ 1 5 5/2 8 ] [ 1/5 1 1/2 1 ] [ 2/5 2 1 2 ] [ 1/8 1 1/2 1 ] ] ;

    > AnalyzeComparisonMat(PCM);

    ```


    [[ 0.5927 0.1046 0.2092 0.09356 ] , 0.01037]


    Note: The eigenvector can be quickly approximated by taking row-sums of PCM and
    dividing by the sum of all elements. This quick technique gives the criteria weights
    of [0.60, 0.10, 0.20, 0.10] for PCM—very close to the eigenvector weights. Note
    that quite often different factors will have the same, or very close, weights.


    # The Entropy Method


    In 1947, Shannon and Weaver¹¹ developed the entropy method for weighting criteria.
    Entropy, in the context of weightings, is the probabilistic measure of uncertainty
    in the information. A broad distribution represents more uncertainty in specific
    values than a sharply peaked distribution. To see this concept, compare the graphs
    of two normal distributions with mean 0, one having a small standard deviation
    and the other a large. The entropy method computations can be decomposed into
    simple steps. Begin with a matrix Mₘ×ₙ ranking the alternatives.


    STEP 1. Calculate R = [rᵢⱼ] which is M normalized by dividing each column by its
    column-sum.


    STEP 2. Compute the degree of divergence vector e = [eⱼ] for j = 1..m with eⱼ
    = -1/ln(n) · Σᵢ₌₁ⁿ rᵢⱼ ln(rᵢⱼ).


    > ¹¹See C. Shannon and W. Weaver, “The Mathematical Theory of Communication,”
    Univ. Illinois Press, 1949.'
