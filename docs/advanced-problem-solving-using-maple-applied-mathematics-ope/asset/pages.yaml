- pgno: 254
  md: '**TABLE 6.1: Linearity Likelihood for Math, Science, and Engineering Data;
    Devore**


    | Correlation ρ | Relationship |

    |---|---|

    | 0.8 < |ρ| ≤ 1.0 | Strong linear relationship |

    | 0.5 < |ρ| ≤ 0.8 | Moderate linear relationship |

    | 0.0 ≤ |ρ| ≤ 0.5 | Weak linear relationship |


    **TABLE 6.2: Linearity Likelihood for Non-Math, Non-Science, and Non-Engineering
    Data; Johnson**


    | Correlation ρ | Relationship |

    |---|---|

    | 0.5 < |ρ| ≤ 1.0 | Strong linear relationship |

    | 0.3 < |ρ| ≤ 0.5 | Moderate linear relationship |

    | 0.1 ≤ |ρ| ≤ 0.3 | Weak linear relationship |

    | 0.0 ≤ |ρ| ≤ 0.1 | No linear relationship |


    In our modeling efforts, we emphasize the interpretation of ρ ≈ 0. A very small
    correlation coefficient can be interpreted as indicating either no linear relationship
    or the existence of a nonlinear relationship. Many neophyte analysts fail to pick
    up on the importance of potential nonlinear relationships in their interpretation.


    Let’s look at an example where we attempt to fit a linear model to data that may
    not be linear.


