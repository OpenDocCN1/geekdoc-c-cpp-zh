    act like a try-catch statement. Consider using fetch() to retrieve some data and
    wanting to catch any errors that occur:


    1 const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4
        console . log ( response . status ); 5 }). catch ( reason => { 6     console
    . error ( reason . message ); 7 });


    This example will output the response status from the fetch() call if it succeeds
    and will output the error message if the call fails. You can take this a step
    further and handle status codes outside of the 200-299 range as errors by checking
    the response.ok property (discussed in Chapter 1) and throwing an error if it
    is false , as in this example:


    1 const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4
        if ( response . ok ) { 5         console . log ( response . status ); 6  
      } else { 7         throw new Error ( `Unexpected status code: ${ response .
    status } ${ r \ 8 esponse . statusText }` ); 9     } 10 }). catch ( reason =>
    { 11     console . error ( reason . message ); 12 });


    The chained catch() call in this example creates a rejection handler that catches
    both errors returned by fetch() and also any errors thrown in the fulfillment
    handler. So instead of needing two different handles for catching the two different
    types of errors, you can use one to handle all of the errors that may occur in
    the chain.


    Always have a rejection handler at the end of a promise chain to ensure that you
    can properly handle any errors that may occur.


    Using finally() in Promise Chains


    The finally() method behaves differently than either then() or catch() in that
    it copies the state and value of the previous promise into its returned promise.
    That means if the original promise is fulfilled with a value, then finally() returns
    a promise that is fulfilled with the same value. For example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . finally (() => { 4  
      console . log ( “Finally called.” ); 5 }). then ( value => { 6     console .
    log ( value );         // 42 7 });


    Here, the settlement handler can’t receive the fulfilled value from promise ,
    so that value is copied to a new promise that is returned from the method call.
    The new promise is fulfilled with the value 42 (copied from promise ) so the fulfillment
    handler receives 42 as an argument. Keep in mind that even though the returned
    promise and promise have the same value, they are not the same object, as you
    can see in this example:


    1 const promise1 = Promise . resolve ( 42 ); 2 3 const promise2 = promise1 . finally
    (() => { 4     console . log ( “Finally called.” ); 5 }); 6 7 promise2 . then
    ( value => { 8     console . log ( value );         // 42 9 }); 10 11 console
    . log ( promise1 === promise2 ); // false


    In this code, the returned value from promise1.finally() is stored in promise2
    , at which point you can determine that it is not the same object as promise1
    . The call to finally() always copies the state and value from the original promise.
    That also means that when finally() is called on a rejected promise, it in turn
    returns a rejected promise, as in this example:


    1 const promise = Promise . reject ( 43 ); 2 3 promise . finally (() => { 4  
      console . log ( “Finally called.” ); 5 }). catch ( reason => { 6     console
    . error ( reason );       // 43 7 });


    The promise promise in this example is rejected with a reason of 43 . Once again,
    the settlement handler cannot access this information as it is not passed in as
    an argument, so instead it returns a new promise that is rejected for the same
    reason. You can then use catch() to retrieve the reason.


    The one exception to how finally() works is when an error is thrown inside of
    the settlement handler or a rejected promise is returned. In this one case, the
    returned promise from finally() does not maintain the state and value from the
    original promise, and instead is rejected with the thrown error as the reason.
    Here’s an example:


    1 const promise1 = Promise . reject ( 43 ); 2 3 promise1 . finally (() => { 4
        throw 44 ; 5 }). catch ( reason => { 6     console . error ( reason );    
      // 44 7 }); 8 9 const promise2 = Promise . reject ( 43 ); 10 11 promise2 . finally
    (() => { 12     return Promise . reject ( 44 ); 13 }). catch ( reason => { 14
        console . error ( reason );       // 44 15 });


    Because the settlement handlers throw 44 or return Promise.reject(44) in this
    example, the returned promise is rejected with the value of 44 and that is output
    to the console instead of 43 . The state and value of the original promise are
    lost as a consequence of the error being thrown in the settlement handler.


    In Chapter 1, you saw how a settlement handler can be used to toggle the loading
    state of an application based on a call to fetch() . Rewriting that example using
    promise chains, and mixing in some error handling from earlier in this chapter,
    here’s a complete example:


    1 const appElement = document . getElementById ( “app” ); 2 const promise = fetch
    ( “books.json” ); 3 4 appElement . classList . add ( “loading” ); 5 6 promise
    . then ( response => { 7     if ( response . ok ) { 8         console . log (
    response . status ); 9     } else { 10         throw new Error ( `Unexpected status
    code: ${ response . status } ${ r \ 11 esponse . statusText }` ); 12     } 13
    }). finally (() => { 14     appElement . classList . remove ( “loading” ); 15
    }). catch ( reason => { 16     console . error ( reason . message ); 17 });


    Unlike a try-catch statement, you don’t want finally() to be the last part of
    the chain just in case it throws an error. So then() is called first, to handle
    the response from fetch() , then finally() is added to the chain to trigger the
    UI change, and last catch() adds the error handler for the entire chain. This
    is where settlement handlers passing along the state of the previous promise is
    helpful: if the fulfillment handler ends up throwing an error, the settlement
    handler will pass that rejection state along so the rejection handler can access
    it.


    Returning Values in Promise Chains


    Another important aspect of promise chains is the ability to pass data from one
    promise to the next. You’ve already seen that a value passed to the resolve()
    handler inside an executor is passed to the fulfillment handler for that promise.
    You can continue passing data along a chain by specifying a return value from
    the fulfillment handler. For example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . then ( value => { 4
        console . log ( value );         // 42 5     return value + 1 ; 6 }). then
    ( value => { 7     console . log ( value );         // 43 8 });


    The fulfillment handler for promise returns value + 1 when executed. Since value
    is 42 (from the executor), the fulfillment handler returns 43 . That value is
    then passed to the fulfillment handler of the second promise, which outputs it
    to the console.'
