    \ way to know if fulfilled or rejected\n    console .log ( “Settled” );\n});\n\
    \n// is similar to:\nconst callback = () => {\n    console .log ( “Settled” );\n\
    };\npromise .then ( null , callback );\n```\n\nAs long as you don’t access the\
    \ argument passed to `callback`, the behavior between these two examples is the\
    \ same. However, as `catch()` , using `finally()` makes your intention clearer.\n\
    \nSettlement handlers are useful when you want to know that an operation has completed\
