    Both approaches allow you to implement unhandled rejection reporting for your
    application by listening for both events and tracking the promises they provide
    in a separate location. You can then periodically check the list of promises to
    report them into your logging or reporting system.


    ## Final Thoughts


    When promises were added into the JavaScript language in 2015, they were a source
    of controversy and the topic of many thinkpieces opining whether this was the
    right way to address the asynchronous future of JavaScript. After several years,
    the dust has settled and promises have won many over, especially with the introduction
    of async functions in 2017. All new asynchronous JavaScript APIs are built to
    make use of promises, so understanding how to work with promises is an important
    part of any JavaScript-focused job.


    I hope you’ve enjoyed this exploration of JavaScript promises.


