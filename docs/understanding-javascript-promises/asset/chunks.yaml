  trans: "\n尽管此示例中的第一个承诺（`promise1`）被拒绝了，但 `Promise.any()` 的调用仍然成功，因为第二个承诺（`promise2`）已完成。第三个承诺（`promise3`）的结果被丢弃了。\n\
    \n如果传递给 `Promise.any()` 的所有承诺都被拒绝了，那么返回的承诺将会被 `AggregateError` 拒绝。`AggregateError`\
    \ 是一种表示存储在 `errors` 属性中的多个错误的错误。例如：\n\n```javascript\nlet promise1 = Promise.reject(43);\n\
    let promise2 = new Promise((resolve, reject) => {\n    reject(44);\n});\n\nlet\
    \ promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n    \
    \    reject(45);\n    }, 100);\n});\n\nlet promise4 = Promise.any([promise1, promise2,\
    \ promise3]);\n\npromise4.catch(reason => {\n    // 运行时相关的错误消息\n    console.log(reason.message);\n\
    \n    // 输出拒绝值\n    console.log(reason.errors[0]);  // 43\n    console.log(reason.errors[1]);\
    \  // 44\n    console.log(reason.errors[2]);  // 45\n});\n```\n\n在这里，`Promise.any()`\
    \ 接收到的承诺均未完成，因此返回的承诺被 `AggregateError` 拒绝。你可以检查 `errors` 属性（这是一个数组），以获取每个承诺的拒绝值。\n\
    \n### 何时使用 Promise.any()\n\n当你希望承诺中的任何一个完成，且不在乎有多少个承诺被拒绝（除非它们全部被拒绝）时，使用 `Promise.any()`\
    \ 方法最佳。以下是你可能想要使用 `Promise.any()` 的场景。\n\n#### 执行对冲请求 (Hedged Requests)\n\n正如《The\
    \ Tail at Scale² 定义，对冲请求（hedged request）是指客户端向多个服务器发送请求，并接受第一个响应的服务器的结果。这对于需要尽可能低延迟、且有服务器资源用于管理额外负载和响应去重的情况非常有帮助。这是一个示例：\n\
    \n```javascript\nconst HOSTS = [\n    \"api1.example.com\",\n    \"api2.example.com\"\
    \n];\n\nfunction hedgedFetch(endpoint) {\n    return Promise.any(\n        HOSTS.map(hostname\
    \ => fetch(`https://${hostname}${endpoint}`))\n    );\n}\n\nhedgedFetch(\"/transactions\"\
    )\n    .then(transactions => console.log(transactions))\n    .catch(reason =>\
    \ console.error(reason.message));\n```\n\n此示例维护了一个在每个对冲请求中应调用的主机数组。`hedgedFetch()`\
    \ 函数根据这些主机名创建一个 `fetch()` 请求数组，并将该数组传递给 `Promise.any()`。对于 `hedgedFetch()` 的消费者来说，看起来只发送了一个请求，尽管后台有多个请求在进行。这允许消费者只使用一个完成处理器和一个拒绝处理器来处理结果。如果任何一个请求失败了，消费者将永远感知不到；只有当所有请求都失败时，才会调用拒绝处理器。\n\
    \n#### 在 Service Worker 中使用快速响应\n\n使用 service workers 的 页面通常可以选择从哪里加载数据：网络或从缓存。在某些情况下，网络请求实际上可能比从缓存加载更快，因此你可能想使用\
    \ `Promise.any()` 来选择更快的响应。以下是在 service worker 内部演示这种模式的代码：\n\n```javascript\n\
    self.addEventListener(\"fetch\", event => {\n    // 获取缓存响应\n    const cachedResponse\
    \ = caches.match(event.request);\n\n    // 获取新响应\n    const fetchedResponse =\
    \ fetch(event.request.url);\n\n    // 使用最佳选项响应\n    event.respondWith(\n     \
    \   Promise.any([\n            fetchedResponse.catch(() => cachedResponse),\n\
    \            cachedResponse,\n        ])\n        .then(response => response ??\
    \ fetchedResponse)\n        .catch(() => {})\n    );\n});\n```\n\n`fetch` 事件监听器允许你监听网络请求并拦截响应。这个\
    \ service worker 示例使用 `fetch` 事件监听器来同时从缓存（使用 `caches.match()`）和网络（使用 `fetch()`）读取内容。`caches.match()`\
    \ 的调用返回一个承诺。`event.respondWith()` 方法接收一个承诺。`Promise.any()` 方法返回一个在第一个承诺完成时就处于就状态的承诺。\n\
    \n### Promise.race() 方法\n\n`Promise.race()` 方法对多个承诺提供了略有不同的处理。它也接受承诺的可迭代器并返回一个承诺，但只要任何一个承诺就绪它就会就绪。它不像\
    \ `Promise.all()` 那样等待所有承诺解析，也不像 `Promise.any()` 那样仅在第一个完成时进行短路，`Promise.race()`\
    \ 返回第一个就绪承诺的结果。例如：\n\n```javascript\nlet promise1 = Promise.resolve(42);\nlet\
    \ promise2 = new Promise((resolve, reject) => {\n    reject(43);\n});\nlet promise3\
    \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
    \    }, 100);\n});\n\nlet promise4 = Promise.race([promise1, promise2, promise3]);\n\
    \npromise4.then(value => console.log(value));\n```\n\n段代码中，第一个承诺（`promise1`）被创建一个已完成的承诺，而其他的在调度任务。`promise4`\
    \ 的完成处理器随后带有值 42 被调用并忽略了其他的。传递给 `Promise.race()` 的承诺确实在竞争看哪个先就绪。如果第一个就绪的承诺是完成的，则返回的承诺也是完成的；如果第一个就绪的承诺是被拒绝的，则返回的承诺是被拒绝的。这是一个包含拒绝的示例：\n\
    \n```javascript\nlet promise1 = new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => {\n        resolve(42);\n    }, 100);\n});\nlet promise2 = new Promise((resolve,\
    \ reject) => {\n    reject(43);\n});\nlet promise3 = new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n        resolve(44);\n    }, 50);\n});\n\nlet\
    \ promise4 = Promise.race([promise1, promise2, promise3]);\n\npromise4.catch(reason\
    \ => console.log(reason));\n```\n"
- fmt: "\nThe `Promise.race()` method is best used in situations where you want to\
    \ be able to short-circuit the completion of a number of different promises. Unlike\
    \ `Promise.any()`, where you specifically want one of the promises to succeed\
    \ and only care if all promises fail, with `Promise.race()` you want to know even\
    \ if one promise fails as long as it fails before any other promise fulfills.\
    \ Here are some situations where you may want to use `Promise.race()`.\n\n###\
    \ Establishing a Timeout for an Operation\n\nWhile the `fetch()` function has\
    \ a lot of helpful functionality, one thing it doesn’t do is manage a timeout\
    \ for a given request; a request will happily hang until the request completes\
    \ one way or another. You can easily create a wrapper method to add a timeout\
    \ to any request by using `Promise.race()`:\n\n```javascript\nfunction timeout(milliseconds)\
    \ {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n   \
    \   reject(new Error(\"Request timed out.\"));\n    }, milliseconds);\n  });\n\
    }\n\nfunction fetchWithTimeout(...args) {\n  return Promise.race([\n    fetch(...args),\n\
    \    timeout(5000)\n  ]);\n}\n\nconst API_URL = \"https://jsonplaceholder.typicode.com/users\"\
    ;\n\nfetchWithTimeout(API_URL)\n  .then(response => response.json())\n  .then(users\
    \ => console.log(users))\n  .catch(reason => console.error(reason.message));\n\
    ```\n\nThe `timeout()` function is similar to the `delay()` function created earlier\
    \ in this chapter except that it calls `reject()` after a delay rather than `resolve()`.\
    \ In this case, the delay represents an error condition as you want to be informed\
    \ when a request has taken longer than expected (5000 milliseconds in this example).\
    \ The `fetchWithTimeout()` function then calls `fetch()` along with `timeout()`\
    \ in an array that is passed to `Promise.race()`. If the call to `fetch()` takes\
    \ longer than the timeout, the returned promise is rejected so you can handle\
    \ the failure appropriately.\n\nKeep in mind that even though `fetchWithTimeout()`\
    \ will reject if a request takes longer than the specified timeout, the request\
    \ will not be cancelled. It will continue waiting for a response behind-the-scenes\
    \ even though the response will be ignored.\n\n### Summary\n\nFor times when you\
    \ want to monitor and respond to multiple promises at the same time, JavaScript\
    \ provides several methods. Each method behaves slightly differently, but all\
    \ allow you to run promises in parallel and respond to them as a group:\n\n- `Promise.all()`\
    \ - the returned promise is fulfilled when all of the promises are fulfilled,\
    \ and the returned promise is rejected when any promise is rejected.\n- `Promise.allSettled()`\
    \ - the returned promise is always fulfilled with an array of results from the\
    \ promise, and the returned promise is never rejected.\n- `Promise.any()` - the\
    \ returned promise is fulfilled when the first promise is fulfilled, and the returned\
    \ promise is rejected when all of the promises are rejected.\n- `Promise.race()`\
    \ - the returned promise is fulfilled when the first promise to settle is fulfilled,\
    \ and the returned promise is rejected when the first promise to settle is rejected.\n\
    \nEach of these methods is appropriate for different use cases, and it’s up to\
    \ you to decide which is appropriate in any situation.\n\n### 4. Async Functions\
    \ and Await Expressions\n\nJavaScript promises were designed as a low-level utility\
    \ that could be used by higher-level features. Async functions are such higher-level\
    \ features that make programming with promises more similar to synchronous code.\
    \ Before getting into the details of async functions, it helps to understand how\
    \ they are defined.\n\n#### Defining Async Functions\n\nAsync functions can be\
    \ used anywhere functions can. In most cases, you need to add the `async` keyword\
    \ before function or method. Here are some examples:\n\n```javascript\n// async\
    \ function\nasync function doSomething() {\n  // body\n}\n\n// async arrow function\n\
    const doSomething = async () => {\n  // body\n};\n\n// async arrow function\n\
    const doSomething = async () => {\n  // body\n};\n\n// async object\nconst object\
    \ = {\n  async doSomething() {\n    // body\n  }\n};\n\n// async class\nclass\
    \ MyClass {\n  async doSomething() {\n    // body\n  }\n}\n```\n\n#### What Makes\
    \ Async Functions Different\n\nAsync functions are different from synchronous\
    \ functions in four ways:\n\n1. The return value is always a promise\n2. Thrown\
    \ errors are promise rejections\n3. The `await` expression can be used\n4. for-of\
    \ loop\n\n##### The Return Value Is Always a Promise\n\nYou can use the `return`\
    \ operator in async functions the same as synchronous functions. The difference\
    \ is that async functions always return a promise regardless of the type you specify.\
    \ If you return a number, for example, it is wrapped in a promise:\n\n```javascript\n\
    async function getOfLife() {\n  return 42;\n}\n\nconst result = getOfLife();\n\
    console.log(result instanceof Promise); // true\nconsole.log(typeof result ===\
    \ \"number\"); // false\nresult.then(value => {\n  console.log(value); // 42\n\
    });\n```\n\nIn this code, the `getOfLife()` async function returns the number\
    \ `42`, but the return value is actually a fulfilled promise. You can then attach\
    \ a fulfillment handler to retrieve the value. Effectively, async functions call\
    \ `Promise.resolve()` behind-the-scenes to ensure a promise is always returned.\n\
    \nIf you pass a promise to `return` inside an async function, then that promise\
    \ is not passed through directly. Instead, the promise state and value are copied\
    \ to a new promise and returned. Here’s an example:\n\n```javascript\nconst promise\
    \ = Promise.resolve(42);\n\nasync function getOfLife() {\n  return promise;\n\
    }\n\nconst result = getOfLife();\nconsole.log(result === promise); // false\n\
    result.then(value => {\n  console.log(value); // 42\n});\n```\n\nHere, `result`\
    \ is not the same promise object as `promise`, but it does have all of the same\
    \ internal state and so still resolves to `42`.\n\nIf you don’t specify a return\
    \ value for an async function, then the return value is a promise that resolves\
    \ to `undefined`. For example:\n\n```javascript\nasync function doSomething()\
    \ {\n  // no return value\n}\n\nconst result = doSomething();\nconsole.log(result\
    \ instanceof Promise); // true\nresult.then(value => {\n  console.log(value);\
    \ // undefined\n});\n```\n\nThe bottom line is no matter what you do inside an\
    \ async function, it will always return a promise. That is also the case when\
    \ an error is thrown.\n\n##### Thrown Errors Are Promise Rejections\n\nWhen an\
    \ error is thrown in an async function, a rejected promise is returned instead\
    \ of throwing the error outside the function. That means you cannot catch errors\
    \ from async functions using `try-catch`. For example, the following will not\
    \ trap the error:\n"
  raw: 'The Promise.race() method is best used in situations where you want to be
    able to short-circuit the completion of a number of different promises. Unlike
    Promise.any() , where you specifically want one of the promises to succeed and
    only care if all promises fail, with Promise.race() you want to know even if one
    promise fails as long as it fails before any other promise fulfills. Here are
    some situations where you may want to use Promise.race() .


    Establishing a Timeout for an Operation


    While the fetch() function has a lot of helpful functionality, one thing it doesn’t
    do is manage a timeout for a given request; a request will happily hang until
    the request completes one way or another. You can easily create a wrapper method
    to add a timeout to any request by using Promise.race() :


    1 function timeout ( milliseconds ) { 2     return new Promise (( resolve , reject
    ) => { 3         setTimeout (() => { 4             reject ( new Error ( “Request
    timed out.” )); 5         }, milliseconds ); 6     }); 7 } 8 9 function fetchWithTimeout
    (… args ) { 10     return Promise . race ([ 11         fetch (… args ), 12    
        timeout ( 5000 ) 13     ]); 14 } 15 16 const API_URL = “https://jsonplaceholder.typicode.com/users”
    ; 17 18 fetchWithTimeout ( API_URL ) 19     . then ( response => response . json
    ()) 20     . then ( users => console . log ( users )) 21     . catch ( reason
    => console . error ( reason . message ));


    The timeout() function is similar to the delay() function created earlier in this
    chapter except that it calls reject() after a delay rather than resolve() . In
    this case, the delay represents an error condition as you want to be informed
    when a request has taken longer than expected (5000 milliseconds in this example).
    The fetchWithTimeout() function then calls fetch() along with timeout() in an
    array that is passed to Promise.race() . If the call to fetch() takes longer than
    the timeout, the returned promise is rejected so you can handle the failure appropriately.


    Keep in mind that even though fetchWithTimeout() will reject if a request takes
    longer than the specified timeout, the request will not be cancelled. It will
    continue waiting for a response behind-the-scenes even though the response will
    be ignored.


    Summary


    For times when you want to monitor and respond to multiple promises at the same
    time, JavaScript provides several methods. Each method behaves slightly differently,
    but all allow you to run promises in parallel and respond to them as a group:


    Promise.all() - the returned promise is fulfilled when all of the promises are
    fulfilled, and the returned promise is rejected when any promise is rejected.


    Promise.allSettled() - the returned promise is always fulfilled with an array
    of results from the promise, and the returned promise is never rejected.


    Promise.any() - the returned promise is fulfilled when the first promise is fulfilled,
    and the returned promise is rejected when all of the promises are rejected.


    Promise.race() - the returned promise is fulfilled when the first promise to settle
    is fulfilled, and the returned promise is rejected when the first promise to settle
    is rejected.


    Each of these methods is appropriate for different use cases, and it’s up to you
    to decide which is appropriate in any situation.


    4.  Async Functions and Await Expressions


    JavaScript promises were designed to be a low-level utility that could be used
    behind-the-scenes by higher-level language features. Async functions are just
    such a higher-level language feature that makes programming with promises more
    similar to programming without promises. Instead of worry about tracking promises
    and their various handlers, async functions abstract away the promises. The end
    result is code that follows a familiar top-down sequence.


    Before getting into the details of how async functions work, it helps to understand
    how they are defined.


    I use the term “async functions” to describe functions as well as methods that
    appear on objects or classes. Whenever the term is used, you can assume what I’m
    saying also applies to asynchronous methods unless otherwise indicated.


    Defining Async Functions


    Async functions can be used anywhere synchronous functions can be used. In most
    cases, all you need to do is add the async keyword before any function or method
    definition to make it asynchronous. Here are some examples:


    1 // async function declaration 2 async function doSomething () { 3     // body
    4 } 5 6 // async arrow function 7 const doSomethingToo = async () => { 8     //
    body 9 }; 10 11 // async arrow function 12 const doSomethingElse = async a =>
    { 13     // body 14 }; 15 16 // async object method 17 const object = { 18    
    async doSomething () { 19         // body 20     } 21 }; 22 23 // async class
    method 24 class MyClass { 25     async doSomething () { 26         // body 27
        } 28 }


    The async keyword indicates that the following function or method should be made
    asynchronous. It’s important for the JavaScript engine to know ahead of time if
    a function is asynchronous because it behaves differently than a synchronous function.


    What Makes Async Functions Different


    Async functions are different from synchronous functions in four ways:


    The return value is always a promise


    Thrown errors are promise rejections


    The await expression can be used


    The for-await-of loop can be used


    These four aspects of async functions make them quite different from synchronous
    functions, so it’s worth going through each point in more detail.


    The Return Value Is Always a Promise


    You can use the return operator in async functions the same as synchronous functions.
    The difference is that async functions always return a promise regardless of the
    type of value you specify with return . If you return a number, for example, that
    number is wrapped in a promise:


    1 async function getMeaningOfLife () { 2     return 42 ; 3 } 4 5 const result
    = getMeaningOfLife (); 6 console . log ( result instanceof Promise );     // true
    7 console . log ( typeof result === “number” );     // false 8 9 result . then
    ( value => { 10     console . log ( value );                     // 42 11 });


    In this code, the getMeaningOfLife() async function returns the number 42 , but
    the return value is actually a fulfilled promise. You can then attach a fulfillment
    handler to retrieve the value. Effectively, async functions call Promise.resolve()
    behind-the-scenes to ensure a promise is always returned.


    If you pass a promise to return inside of an async function, then that promise
    is not passed through directly. Instead, the promise state and value are copied
    to a new promise and returned. Here’s an example:


    1 const promise = Promise . resolve ( 42 ); 2 3 async function getMeaningOfLife
    () { 4     return promise ; 5 } 6 7 const result = getMeaningOfLife (); 8 console
    . log ( result === promise );     // false 9 result . then ( value => { 10    
    console . log ( value );             // 42 11 });


    Here, result is not the same promise object as promise , but it does have all
    of the same internal state and so still resolves to 42 .


    If you don’t specify a return value for an async function, then the return value
    is a promise that resolves to undefined . For example:


    1 async function doSomething () { 2     // no return value 3 } 4 5 const result
    = doSomething (); 6 console . log ( result instanceof Promise ); // true 7 result
    . then ( value => { 8     console . log ( value );                 // undefined
    9 });


    The bottom line is no matter what you do inside an async function, it will always
    return a promise. That is also the case when an error is thrown.


    Thrown Errors Are Promise Rejections


    When an error is thrown in an async function, a rejected promise is returned instead
    of throwing the error outside the function. That means you cannot catch errors
    from async functions using try-catch . For example, the following will not trap
    the error:'
