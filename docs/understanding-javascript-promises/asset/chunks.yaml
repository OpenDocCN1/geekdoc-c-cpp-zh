    add it to the map 4 process . on ( “unhandledRejection” , ( reason , promise )
    => { 5     possiblyUnhandledRejections . set ( promise , reason ); 6 }); 7 8 process
    . on ( “rejectionHandled” , promise => { 9     possiblyUnhandledRejections . delete
    ( promise ); 10 }); 11 12 setInterval (() => { 13 14     possiblyUnhandledRejections
    . forEach (( reason , promise ) => { 15 16         console . error ( “Unhandled
    rejection” ); 17         console . error ( promise ); 18         console . error
    ( reason . message ? reason . message : reason ); 19 20         // do something
    to handle these rejections 21     }); 22 23     possiblyUnhandledRejections .
    clear (); 24 25 }, 60000 );


