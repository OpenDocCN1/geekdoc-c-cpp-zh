- fmt: "\n# Using the for-await-of Loop\n\nAnother special syntax enabled inside async\
    \ functions is the `for-await-of` loop, which allows you to retrieve values from\
    \ an iterable or an async iterable. An iterable is an object with a `Symbol.iterator`\
    \ method that returns an iterator; an async iterable is an object with a `Symbol.asyncIterator`\
    \ method that returns an iterator whose values are always promises. The `for-await-of`\
    \ loop calls `Promise.resolve()` on each value returned from an iterable and then\
    \ waits for each promise to resolve before continuing to the next iteration of\
    \ the loop.\n\nThe most often used iterables in JavaScript are arrays, and so\
    \ you can use an array of promises with a `for-await-of` loop to process promises\
    \ in sequence, as in this example:\n\n```javascript\nconst promise1 = Promise.resolve(1);\n\
    const promise2 = Promise.resolve(2);\nconst promise3 = Promise.resolve(3);\n\n\
    for await (const value of [promise1, promise2, promise3]) {\n    console.log(value);\n\
    }\n```\n\nThis example processes `promise1`, `promise2`, and `promise3` in that\
    \ order. Even though these are settled promises, the `for-await-of` loop works\
    \ on unsettled promises as well. And because the `for-await-of` loop always calls\
    \ `Promise.resolve()` on any value retrieved from an iterable, you can use it\
    \ directly on arrays, like this:\n\n```javascript\nfor await (const value of [1,\
    \ 2, 3]) {\n    console.log(value);\n}\n```\n\nEven though there are no promises\
    \ in the array in this example, the `for-await-of` loop will still work.\n\nThe\
    \ most often used async iterables in Node.js are `ReadStream` objects. A `ReadStream`\
    \ object is used to periodically read data from a source where all of the data\
    \ may not be available. For network requests, reading large files, or event streams,\
    \ `ReadStream` objects are a convenient way to work with such data. Here’s an\
    \ example:\n\n```javascript\nimport fs from \"node:fs\";\n\nasync function readCompleteTextStream(readable)\
    \ {\n    readable.setEncoding(\"utf8\");\n\n    let data = \"\";\n    for await\
    \ (const chunk of readable) {\n        data += chunk;\n    }\n\n    return data;\n\
    }\n\nconst stream = fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n\
    \    .then(text => console.log(text));\n```\n\nThe `readCompleteTextStream()`\
    \ function accepts a `ReadStream` object called `readable` as a parameter. The\
    \ first step to reading a text file is to set the encoding to `\"utf8\"` using\
    \ the `setEncoding()` method. Then, a `for-await-of` loop iterates over the data\
    \ read from `readable`. If the file is short, then there may only be one chunk\
    \ of data; if the file is long, then there will likely be multiple chunks of data.\
    \ Using the `for-await-of` loop allows you to not worry about the number of chunks\
    \ being returned.\n\nSimilar to the `await` expression, a `for-await-of` loop\
    \ throws an error if any of the promises returned from the async iterable are\
    \ rejected. You can catch that error with a `try-catch` statement inside of the\
    \ async function, such as:\n\n```javascript\nimport fs from \"node:fs\";\n\nasync\
    \ function readCompleteTextStream(readable) {\n    readable.setEncoding(\"utf8\"\
    );\n\n    try {\n        let data = \"\";\n        for await (const chunk of readable)\
    \ {\n            data += chunk;\n        }\n        return data;\n    } catch\
    \ (error) {\n        console.error(error.message);\n    }\n}\n\nconst stream =\
    \ fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n    .then(text\
    \ => console.log(text));\n```\n\nIn this example, the first rejected promise in\
    \ the `for-await-of` loop causes an error to be thrown. The `try-catch` statement\
    \ can then catch the error and log it to the console. Without the `try-catch`\
    \ statement, a rejected promise in the `for-await-of` loop will be caught and\
    \ returned as a rejected promise from the `readCompleteTextStream()` function.\n\
    \n# Top-Level Await Expressions\n\nYou can also use `await` at the top level of\
    \ a JavaScript module outside of an async function. Essentially, a JavaScript\
    \ module acts as an async function wrapped around the entire module by default.\
    \ This allows you to call promise-based functions directly, such as using the\
    \ `import()` function:\n\n```javascript\n// static import\nimport something from\
    \ \"./file.js\";\n\n// dynamic import\nconst filename = \"./another-file.js\"\
    ;\nconst somethingElse = await import(filename);\n```\n\nUsing top-level await,\
    \ you can load modules dynamically alongside the statically loaded modules. (Dynamically\
    \ loaded modules allow you to construct the specifier, which is not possible with\
    \ static import.)\n\n# Summary\n\n- Async functions allow you to use promises\
    \ without manually assigning handlers. You can turn any function into an async\
    \ function by adding the `async` keyword.\n- The return value of an async function\
    \ is always a promise. If you return a promise from the async function, then it\
    \ is duplicated and returned to the call site; if you return non-promise value,\
    \ then the value is resolved to a promise.\n- Errors thrown inside an async function\
    \ are caught and returned as a rejected promise. Due to this behavior, you cannot\
    \ catch errors originating in an async function using try-catch; instead, you\
    \ need to assign a rejection handler to the returned promise.\n- Async functions\
    \ enable two special types of syntax: the `await` expression and `for-await-of`\
    \ loop. The `await` expression is used to automatically assign fulfillment and\
    \ rejection handlers to a promise such that the fulfillment value becomes the\
    \ return value of the `await` expression and a rejection causes an error to be\
    \ thrown. Similarly, the `for-await-of` loop operates on an async iterable and\
    \ allows the use of promises instead of a loop. The `for-await-of` loop waits\
    \ for each promise returned from the async iterable to fulfill before going on\
    \ to the next promise. If a promise from the async iterable is rejected, then\
    \ an error is thrown.\n- You can use top-level await expressions outside of async\
    \ functions in only in JavaScript modules.\n\n# Unhandled Rejection Tracking\n\
    \nIn the first generation of promises, a rejected promise without a rejection\
    \ handler would silently fail. Many considered this the biggest flaw in the specification\
    \ as it was the only part of the JavaScript language that didn’t make errors apparent.\
    \ Later, JavaScript runtimes instituted console warnings to at least notify developers\
    \ when unhandled rejections occurred, and some decided to throw errors. Eventually,\
    \ unhandled rejection tracking was added into the JavaScript specification.\n\n\
    ## Detecting Unhandled Rejections\n\nDetermining whether a promise rejection was\
    \ handled isn’t straightforward due to the nature of promises. For instance, consider\
    \ this example:\n\n```javascript\nlet rejected = Promise.reject(42);\n\n// at\
    \ this point, rejected is unhandled\nsetTimeout(() => {\n    rejected.catch(value\
    \ => {\n        // now rejected has been handled\n        console.log(value);\n\
    \    });\n}, 5000);\n```\n"
