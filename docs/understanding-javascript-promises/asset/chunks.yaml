  trans: "\n\n在讨论 `Promise.all()` 时，你已经看到过一个处理多个相互依赖且必须全部成功的文件操作示例。在某些情况下，分别处理多个文件意味着如果其中一个操作失败了，你不需要停止整个操作；你可以继续完成成功的操作，然后记录失败的操作以便稍后重试。以下是一个\
    \ Node.js 的示例：\n\n```javascript\nimport { readFile, writeFile } from \"node:fs/promises\"\
    ;\n\n// 或者对文件进行任何操作\nfunction transformText(text) {\n    return text.split(\"\"\
    ).reverse().join(\"\");\n}\n\nfunction transformFiles(filenames) {\n    return\
    \ Promise.allSettled(\n        filenames.map(filename =>\n            readFile(filename,\
    \ \"utf8\")\n                .then(text => transformText(text))\n            \
    \    .then(newText => writeFile(filename, newText))\n                .catch(reason\
    \ => {\n                    reason.filename = filename;\n                    return\
    \ Promise.reject(reason);\n                })\n        )\n    );\n}\n\ntransformFiles([\"\
    file1.txt\", \"file2.txt\"]).then(results => {\n    // 获取失败的结果\n    const failedResults\
    \ = results.filter(\n        result => result.status === \"rejected\"\n    );\n\
    \n    if (failedResults.length) {\n        console.error(\"以下文件未能成功转换:\");\n \
    \       console.error(\"\");\n        failedResults.forEach(failedResult => {\n\
    \            console.error(failedResult.reason.filename);\n            console.error(failedResult.reason.message);\n\
    \            console.error(\"\");\n        });\n    } else {\n        console.log(\"\
    所有文件已成功转换.\");\n    }\n});\n```\n\n这个示例读取了一系列文件，反转文件中文本的顺序，然后将文本写回原始文件（当然，你可以将\
    \ `transformText()` 替换为任何你的操作）。`transformFiles()` 函数接收一个 `filenames` 数组，读取文件内容，转换文本并将转换后的文本写回文件。Promise\
    \ 链代表了过程中的每一步，而拒绝处理程序为任何拒绝原因添加了 `filename` 属性，以便在事后更容易解释结果。\n\n当所有文件的操作完成后，会对结果进行过滤，以找到任何转换未成功的文件，并将这些结果输出到控制台。在生产系统中，你可能会将失败的结果输入监控系统或队列，以尝试重新转换。\n\
    \n### 调用多个独立的 Web 服务 API\n\n`Promise.all()` 部分的另一个示例是调用多个 Web 服务 API，而你希望所有请求都成功。如果你不需要所有请求都成功，那么可以使用\
    \ `Promise.allSettled()`。回到之前的示例，如果即使在缺少部分数据的情况下也可以显示用户个人资料页面，那么请使用 `Promise.allSettled()`\
    \ 代替 `Promise.all()`，以避免向用户显示错误。例如：\n\n```javascript\nconst API_BASE = \"https://jsonplaceholder.typicode.com\"\
    ;\n\nfunction fetchUserData(userId) {\n    const urls = [\n        `${API_BASE}/users/${userId}/posts`,\n\
    \        `${API_BASE}/users/${userId}/albums`,\n        `${API_BASE}/users/${userId}/extras`\n\
    \    ];\n    return Promise.allSettled(urls.map(url => fetch(url)))\n        .then(results\
    \ => results.map(result => result.value));\n}\n\nfetchUserData().then(responses\
    \ => {\n    return Promise.all(\n        responses.map(response => {\n       \
    \     if (response?.ok) {\n                return response.json();\n         \
    \   }\n        })\n    );\n}).then(([posts, albums, extras]) => {\n    // 根据需要处理你的数据\n\
    \    if (posts) {\n        console.log(\"Posts\");\n        console.log(posts);\n\
    \    }\n    if (albums) {\n        console.log(\"Albums\");\n        console.log(albums);\n\
    \    }\n    if (extras) {\n        console.log(\"Extras\");\n        console.log(extras);\n\
    \    }\n}).catch(reason => console.error(reason.message));\n```\n\n在这个版本的示例中，`fetchUserData()`\
    \ 函数使用 `Promise.allSettled()` 代替 `Promise.all()`，以确保拒绝可以被忽略。此示例还调用了第三方端点 `/users/{userId}/extras`，该端点并不存在，演示目的将返回\
    \ 404。一旦所有请求完成，成功处理程序会将每个结果映射到其 `value` 属性，这确保了任何拒绝的 Promise 都映射为 `undefined`，而已实现的\
    \ Promise 则映射到 `fetch()` 返回的响应对象。\n\n由于 `response` 可能是 `undefined`，你需要在检查 `ok`\
    \ 属性之前检查 `response` 是否为真。然后会读取每个有效响应的 JSON 体，并由最后一个成功处理程序读取这些数据。无法保证每个请求的数据都会存在（在此示例中\
    \ `extras` 将是 `undefined`），因此你需要在处理每个值之前检查该值是否存在。\n\n### 等待动画完成\n\n在网页中，元素可以以多种不同的方式同时进行动画处理。例如，你可以让元素从页面底部向上移动，同时动画化宽度和高度，以使元素进入视野。在这些情况下，在对元素或页面进行下一次修改之前，等待所有动画完成是有帮助的。在名为《构建\
    \ toast 组件》（Building a toast component）一篇文章中，Adam Argyle 解释了跟踪 DOM 元素动画何时完成的基本方法。我在这里重写了代码以便理解：\n\
    \n```javascript\nfunction waitForAnimations(element) {\n    return Promise.allSettled(\n\
    \        element.getAnimations().map(animation => animation.finished)\n    );\n\
    }\n\nconst toasterElement = document.getElementById(\"toaster\");\nwaitForAnimations(toasterElement).then(()\
    \ => console.log(\"Toaster 完成。\"));\n```\n\n在这种情况下，你并不真正关心过程中是否有任何动画失败，你也不关心接收动画的任何成功值，因此\
    \ `Promise.allSettled()` 比 `Promise.all()` 更合适。`getAnimations()` 方法返回一个动画对象数组，每个对象都有一个\
    \ `finished` 属性，该属性包含一个在动画完成后解析的 Promise。通过将这些 Promise 传递给 `Promise.allSettled()`，会在所有动画完成后通知。由于\
    \ `Promise.allSettled()` 永远不会返回拒绝的 Promise，你可以附加一个成功处理程序而不必担心任何未捕获的拒绝错误。\n\n###\
    \ Promise.any() 方法\n\n`Promise.any()` 方法也接受 Promise 迭代器，并在传入的 Promise 中任何一个被实现时返回一个已实现的\
    \ Promise。一旦其中任何一个 Promise 被实现，操作就会短路。（这与 `Promise.all()` 相反，后者在一个 Promise 被拒绝时操作就会短路）。这里是一个示例：\n\
    \n```javascript\nlet promise1 = Promise.reject(43);\n\nlet promise2 = Promise.resolve(42);\n\
    \nlet promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n\
    \        resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.any([promise1,\
    \ promise2, promise3]);\n\npromise4.then(value => console.log(value));\n```\n\n"
- fmt: "\nEven though the first promise (`promise1`) in this example is rejected,\
    \ the call to `Promise.any()` succeeds because the second promise (`promise2`)\
    \ is fulfilled. The result of the third promise (`promise3`) is discarded.\n\n\
    If all of the promises passed to `Promise.any()` are rejected, then the returned\
    \ promise is rejected with an `AggregateError`. An `AggregateError` is an error\
    \ that represents multiple errors stored in an `errors` property. For example:\n\
    \n```javascript\nlet promise1 = Promise.reject(43);\nlet promise2 = new Promise((resolve,\
    \ reject) => {\n    reject(44);\n});\n\nlet promise3 = new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n        reject(45);\n    }, 100);\n});\n\nlet\
    \ promise4 = Promise.any([promise1, promise2, promise3]);\n\npromise4.catch(reason\
    \ => {\n    // Runtime dependent error message\n    console.log(reason.message);\n\
    \n    // output rejection values\n    console.log(reason.errors[0]);  // 43\n\
    \    console.log(reason.errors[1]);  // 44\n    console.log(reason.errors[2]);\
    \  // 45\n});\n```\n\nHere, `Promise.any()` receives promises that are not fulfilled,\
    \ and so the returned promise is rejected with an `AggregateError`. You can inspect\
    \ the `errors` property, which is an array, to retrieve the rejection values from\
    \ each promise.\n\n### When to Use Promise.any()\n\nThe `Promise.any()` method\
    \ is best used in situations where you want any one of the promises to fulfill\
    \ and you don’t care how many others reject unless they all reject. Here are some\
    \ situations where you might want to use `Promise.any()`.\n\n#### Executing Hedged\
    \ Requests\n\nAs defined in The Tail at Scale², a hedged request is one where\
    \ the client makes requests to multiple servers and accepts the response from\
    \ the first that replies. This is helpful in situations where the client needs\
    \ the lowest latency possible, and there are server resources devoted to managing\
    \ the extra load and deduplicating responses. Here’s an example:\n\n```javascript\n\
    const HOSTS = [\n    \"api1.example.com\",\n    \"api2.example.com\"\n];\n\nfunction\
    \ hedgedFetch(endpoint) {\n    return Promise.any(\n        HOSTS.map(hostname\
    \ => fetch(`https://${hostname}${endpoint}`))\n    );\n}\n\nhedgedFetch(\"/transactions\"\
    )\n    .then(transactions => console.log(transactions))\n    .catch(reason =>\
    \ console.error(reason.message));\n```\n\nThis example keeps an array of hosts\
    \ that should be called for each hedged request. The `hedgedFetch()` function\
    \ creates an array of `fetch()` requests based on those hostnames and passes that\
    \ array to `Promise.any()`. To the consumer of `hedgedFetch()`, it looks as if\
    \ just one request is made even though multiple are happening behind the scenes.\
    \ This allows the consumer to use just one fulfillment handler and one rejection\
    \ handler to handle the result. If any one of the requests fails, the consumer\
    \ is never aware; the rejection handler is only called if all requests fail-fail.\n\
    \n#### Using the Fastest Response in a Service Worker\n\nWeb pages that use service\
    \ workers often have their choice of where to load data from: the network or from\
    \ the cache. In some cases, a network request might actually be faster than loading\
    \ from cache, and so you may want to use `Promise.any()` to choose the faster\
    \ of the responses. Here’s some code that illustrates this pattern inside of a\
    \ service worker:\n\n```javascript\nself.addEventListener(\"fetch\", event =>\
    \ {\n    // get cached response\n    const cachedResponse = caches.match(event.request);\n\
    \n    // fetch new response\n    const fetchedResponse = fetch(event.request.url);\n\
    \n    // respond with the best option\n    event.respondWith(\n        Promise.any([\n\
    \            fetchedResponse.catch(() => cachedResponse),\n            cachedResponse,\n\
    \        ])\n        .then(response => response ?? fetchedResponse)\n        .catch(()\
    \ => {})\n    );\n});\n```\n\nThe `fetch` event listener allows you to listen\
    \ for network requests and intercept the responses. This service worker example\
    \ uses a `fetch` event listener to read both from the cache (using `caches.match()`)\
    \ and from the network (using `fetch()`). The call to `caches.match()` returns\
    \ a promise. The `event.respondWith()` method takes a promise. The `Promise.any()`\
    \ method returns a promise that settles as soon as the first promise fulfills.\n\
    \n### The Promise.race() Method\n\nThe `Promise.race()` method provides a slightly\
    \ different take on multiple promises. It also accepts an iterable of promises\
    \ and returns a promise, but settles as soon as any promise settles. Instead of\
    \ waiting for all promises to be resolved like `Promise.all()` or short-circuiting\
    \ only for the first fulfillment like `Promise.any()`, `Promise.race()` returns\
    \ the result of the first settle. For example:\n\n```javascript\nlet promise1\
    \ = Promise.resolve(42);\nlet promise2 = new Promise((resolve, reject) => {\n\
    \    reject(43);\n});\nlet promise3 = new Promise((resolve, reject) => {\n   \
    \ setTimeout(() => {\n        resolve(44);\n    }, 100);\n});\n\nlet promise4\
    \ = Promise.race([promise1, promise2, promise3]);\n\npromise4.then(value => console.log(value));\n\
    ```\n\nIn this code, the first promise (`promise1`) is created as a fulfilled\
    \ promise while the others schedule jobs. The fulfillment handler for `promise4`\
    \ is then called with the value of 42 and ignores the other. The promises passed\
    \ to `Promise.race()` are truly in a race to see which is settled. If the first\
    \ promise to settle is fulfilled, then the returned promise is fulfilled; if the\
    \ first promise to settle is rejected, then the returned promise is rejected.\
    \ Here’s an example with a rejection:\n\n```javascript\nlet promise1 = new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n        resolve(42);\n    }, 100);\n});\n\
    let promise2 = new Promise((resolve, reject) => {\n    reject(43);\n});\nlet promise3\
    \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
    \    }, 50);\n});\n\nlet promise4 = Promise.race([promise1, promise2, promise3]);\n\
    \npromise4.catch(reason => console.log(reason));\n```\n"
