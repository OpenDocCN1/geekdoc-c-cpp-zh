    \ property, as in this example:\n\n```javascript\nconst promise = fetch ( “books.json”\
    \ );\npromise .then ( response => {\n    if ( response .ok ) {\n        console\
    \ .log ( “Request succeeded.” );\n    } else {\n        console .error ( “Request\
    \ failed.” );\n    }\n});\n```\n\n## Assigning Rejection Handlers with catch()\n\
    \nPromises also have a `catch()` method that behaves the same as `then()` when\
    \ only a rejection handler is passed. For example, the following `catch()` and\
    \ `then()` calls are functionally equivalent:\n\n```javascript\nconst promise\
    \ = fetch ( “books.json” );\npromise .catch ( reason => {\n    // rejection\n\
    \    console .error ( reason . message );\n});\n\n// is the same as:\npromise\
    \ .then ( null , reason => {\n    // rejection\n    console .error ( reason .\
    \ message );\n});\n```\n\nThe intent behind `then()` and `catch()` is for you\
    \ to use them in combination to clearly indicate how a result is handled. This\
