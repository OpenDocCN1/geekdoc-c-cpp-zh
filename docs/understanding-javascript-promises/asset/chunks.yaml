    \ promise。然后你可以使用 `catch()` 获取该原因。\n\n`finally()` 工作机制的唯一例外是当在判定处理器内部抛出错误或者被拒绝的\
    \ promise 再次被拒绝。在这种情况下，返回的 promise 不维护原始 promise 的状态和值，而是被抛出的错误所拒绝。这里有一个示例：\n\n\
