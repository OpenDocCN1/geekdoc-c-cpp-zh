    called. Note that, unlike in the browser, the reason for the rejection isn’t passed
    into the rejectionHandled event handler.


    By default, Node.js throws an error when an unhandled promise rejection occurs
    unless there is an event handler for unhandledRejection . You can change how Node.js
    handles uncaught promise rejections by using the –unhandled-rejection command-line
    option.


    –unhandled-rejection=throw (default) means that the unhandledRejection event is
    emitted. If there is no event handler specified for unhandledRejection , then
    the rejection reason is thrown as an error that can be caught by using an uncaughtException
    event handler. If no uncaughtException handler is specified, then the Node.js
    process exits with process.exitCode set to 1.


    –unhandled-rejection=strict means that the unhandledRejection event is not emitted.
    Instead, the rejection reason is thrown as that can be caught using an uncaughtException
    event handler. Any unhandledRejection handlers are not executed.


    –unhandled-rejection=warn means that the unhandledRejection event is emitted and
    a warning will always be output to the console regardless if any unhandledRejection
    handlers are defined. There is no change to the process exit code.


