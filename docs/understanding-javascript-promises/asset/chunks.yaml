    ( 43 ); 3 4 promise1 . then ( value => { 5     console . log ( value );     //
    42 6     return promise2 ; 7 }). then ( value => { 8     console . log ( value
    );     // never called 9 });


    In this example, the second fulfillment handler is never called because promise2
    is rejected. You could, however, attach a rejection handler instead:


    1 const promise1 = Promise . resolve ( 42 ); 2 const promise2 = Promise . reject
    ( 43 ); 3 4 promise1 . then ( value => { 5     console . log ( value );     //
    42 6     return promise2 ; 7 }). catch ( value => { 8     console . error ( value
    );   // 43 9 });


    Here, the rejection handler is called as a result of promise2 being rejected.
    The rejected value 43 from promise2 is passed into that rejection handler.


    Returning a promise from a fulfillment handler is helpful when an operation requires
    more than one promise to execute to completion. For example, fetch() requires
    a second promise to read the body of a response. To read a JSON body, you’ll need
    to use response.json() , which returns another promise. Here’s how it looks without
    using promise chaining:


