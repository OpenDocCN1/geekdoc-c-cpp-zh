- fmt: "\nYou could do the same thing with the rejection handler. When a rejection\
    \ handler is called, it may return a value. If it does, that value is used to\
    \ fulfill the next promise in the chain, like this:\n\n```javascript\nconst promise\
    \ = Promise . reject ( 42 );\npromise . catch ( value => {\n    // rejection handler\n\
    \    console . error ( value );      // 42\n    return value + 1 ;\n}). then (\
    \ value => {\n    // fulfillment handler\n    console . log ( value );       \
    \ // 43\n});\n```\n\nHere, a rejected promise is created with a value of `42`.\
    \ That value is passed into the rejection handler for the promise, where `value\
    \ + 1` is returned. Even though this return value is coming from a rejection handler,\
    \ it is still used in the fulfillment handler of the next promise in the chain.\
    \ The failure of one promise can allow recovery of the entire chain if necessary.\n\
    \nUsing `finally()`, however, results in a different behavior. Any value returned\
    \ from a settlement handler is ignored so that you can access the original promise’s\
    \ value. Here’s an example:\n\n```javascript\nconst promise = Promise . resolve\
    \ ( 42 );\npromise . finally (() => {\n    // settlement handler\n    return 43\
    \ ;                   // ignored!\n}). then ( value => {\n    // fulfillment handler\n\
    \    console . log ( value );        // 42\n});\n```\n\nThe value passed to the\
    \ fulfillment handler is `42` and not `43`. The return statement in the settlement\
    \ handler is ignored so that the original value can be retrieved using `then()`.\
    \ This is one of the consequences of `finally()` returning a promise whose state\
    \ and value are copied from the original.\n\n# Returning Promises in Promise Chains\n\
    \nReturning primitive values from promise handlers allows passing of data between\
    \ promises, but what if you return an object? If the object is a promise, then\
    \ there’s an extra step that’s taken to determine how to proceed. Consider the\
    \ following example:\n\n```javascript\nconst promise1 = Promise . resolve ( 42\
    \ );\nconst promise2 = Promise . resolve ( 43 );\n\npromise1 . then ( value =>\
    \ {\n    console . log ( value );    // 42\n    return promise2 ;\n}). then (\
    \ value => {\n    console . log ( value );    // 43\n});\n```\n\nIn this code,\
    \ `promise1` resolves to `42`. The fulfillment handler for `promise1` returns\
    \ `promise2`, a promise already in the resolved state. The second fulfillment\
    \ handler is called because `promise2` has been fulfilled. If `promise2` were\
    \ rejected, a rejection handler (if present) would be called instead of the second\
    \ fulfillment handler.\n\nThe important thing to recognize about this pattern\
    \ is that the second fulfillment handler is not added to `promise2`, but rather\
    \ to a third promise, making the previous example equivalent to this:\n\n```javascript\n\
    const promise1 = Promise . resolve ( 42 );\nconst promise2 = Promise . resolve\
    \ ( 43 );\n\nconst promise3 = promise1 . then ( value => {\n    console . log\
    \ ( value );    // 42\n    return promise2 ;\n});\n\npromise3 . then ( value =>\
    \ {\n    console . log ( value );    // 43\n});\n```\n\nHere, it’s clear that\
    \ the second fulfillment handler is attached to `promise3` rather than `promise2`.\
    \ This is a subtle but important distinction, as the second fulfillment handler\
    \ will not be called if `promise2` is rejected. For instance:\n\n```javascript\n\
    const promise1 = Promise . resolve ( 42 );\nconst promise2 = Promise . reject\
    \ ( 43 );\n\npromise1 . then ( value => {\n    console . log ( value );    //\
    \ 42\n    return promise2 ;\n}). then ( value => {\n    console . log ( value\
    \ );    // never called\n});\n```\n\nIn this example, the second fulfillment handler\
    \ is never called because `promise2` is rejected. You could, however, attach a\
    \ rejection handler instead:\n\n```javascript\nconst promise1 = Promise . resolve\
    \ ( 42 );\nconst promise2 = Promise . reject ( 43 );\n\npromise1 . then ( value\
    \ => {\n    console . log ( value );    // 42\n    return promise2 ;\n}). catch\
    \ ( value => {\n    console . error ( value );  // 43\n});\n```\n\nHere, the rejection\
    \ handler is called as a result of `promise2` being rejected. The rejected value\
    \ `43` from `promise2` is passed into that rejection handler.\n\nReturning a promise\
    \ from a fulfillment handler is helpful when an operation requires more than one\
    \ promise to execute to completion. For example, `fetch()` requires a second promise\
    \ to read the body of a response. To read a JSON body, you’ll need to use `response.json()`,\
    \ which returns another promise. Here’s how it looks without using promise chaining:\n\
    \n```javascript\nconst promise1 = fetch ( “books.json” );\n\npromise1 . then (\
    \ response => {\n    promise2 = response . json ();\n    promise2 . then ( payload\
    \ => {\n        console . log ( payload );\n    }). catch ( reason => {\n    \
    \    console . error ( reason . message );\n    });\n\n}). catch ( reason => {\n\
    \    console . error ( reason . message );\n});\n```\n\nThis code requires two\
    \ different rejection handlers to catch the potential errors at two different\
    \ steps of the process. Returning the second promise from the first fulfillment\
    \ handler simplifies the code:\n\n```javascript\nconst promise = fetch ( “books.json”\
    \ );\n\npromise . then ( response => {\n    return response . json ();\n}). then\
    \ ( payload => {\n    console . log ( payload );\n}). catch ( reason => {\n  \
    \  console . error ( reason . message );\n});\n```\n\nHere, the first fulfillment\
    \ handler is called when a response is received and returns a promise to read\
    \ the body. You need only one rejection handler at the end of the promise to catch\
    \ errors that occur along the way.\n\nReturning a promise from a settlement handler\
    \ using `finally()` also exhibits some different behavior than `then()` or `catch()`.\
    \ First, if you return a fulfilled promise from a settlement handler, then that\
    \ promise is ignored in favor of the value from the original, as in this example:\n\
    \n```javascript\nconst promise = Promise . resolve ( 42 );\npromise . finally\
    \ (() => {\n    return Promise . resolve ( 44 );\n}). then ( value => {\n    console\
    \ . log ( value );\n```\n\nIn this example, the settlement handler returns a promise\
    \ fulfilled with `44`, but the returned promise is fulfilled with the original\
    \ value, which is `42`.\n\nHowever, if you return a rejected promise from a settlement\
    \ handler, then the returned promise adopts that reason and the returned promise\
    \ is rejected, like this:\n\n```javascript\nconst promise = Promise . resolve\
    \ ( 42 );\npromise . finally (() => {\n    return Promise . reject ( 43 );\n}).\
    \ catch ( reason => {\n    console . error ( reason );\n});\n```\n\nThis holds\
    \ true even if the original promise is rejected, as in this example:\n\n```javascript\n\
    const promise = Promise . reject ( 43 );\npromise . finally (() => {\n    return\
    \ Promise . reject ( 45 );\n}). catch ( reason => {\n    console . log ( reason\
    \ );\n});\n```\n\nReturning a rejected promise from a settlement handler is functionally\
    \ equivalent to throwing an error: the returned promise is rejected with the specified\
    \ reason.\n\nReturning promises from fulfillment or rejection handlers doesn’t\
    \ change when the promise executors are executed. The first defined promise will\
    \ run its executor first; then the second promise executor will run, and so on.\
    \ Returning promises simply allows you to define additional responses to the promise\
    \ results. You defer the execution of fulfillment handlers by creating a new promise\
    \ within a fulfillment handler. For example:\n\n```javascript\nconst p1 = Promise\
    \ . resolve ( 42 );\np1 . then ( value => {\n    console . log ( value );    //\
    \ 42\n    // create a new promise\n    const p2 = new Promise (( resolve , reject\
    \ ) => {\n        setTimeout (() => {\n            resolve ( 43 );\n        },\
    \ 500 );\n    });\n    return p2 ;\n}). then ( value => {\n    console . log (\
    \ value );    // 43\n});\n```\n"
