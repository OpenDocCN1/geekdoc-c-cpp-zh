    Even though this section focuses on unhandled rejection tracking in web browsers,
    Deno has decided to implement the HTML specification’s unhandled rejection tracking
    as part of its web platform compatibility. Everything discussed in this section,
    therefore, also applies to Deno even when not explicitly mentioned.


    At the time of this writing, Deno has implemented unhandledrejection and rejectionhandled
    events for workers but not for the main thread. This issue is actively being worked
    on and should be resolved soon.


    Reporting Unhandled Rejections in Web Browsers


    While the unhandledrejection and rejectionhandled events are helpful in identifying
    potential problems, they are not useful for tracking problems in production without
    some addition functionality. You don’t necessarily want to log every unhandled
    rejection because a rejection handler may be added later, so it makes sense to
    specify a timeframe within which you expect all promise rejections to be handled.
    For instance, you might want to log every rejection that hasn’t been handled within
    a minute. To do so, you need to track promises that triggered unhandledrejection
    but did not trigger rejectionhandled . Here’s one approach to doing that:


    1 const possiblyUnhandledRejections = new Map (); 2 3 // when a rejection is unhandled,
    add it to the map 4 globalThis . onunhandledrejection = event => { 5     possiblyUnhandledRejections
    . set ( event . promise , event . reason ); 6 }; 7 8 // when a rejection is handled,
    remove it from the map 9 globalThis . onrejectionhandled = event => { 10     possiblyUnhandledRejections
    . delete ( event . promise ); 11 }; 12 13 setInterval (() => { 14 15     possiblyUnhandledRejections
    . forEach (( reason , promise ) => { 16         17         console . error ( “Unhandled
    rejection” ); 18         console . error ( promise ); 19         console . error
    ( reason . message ? reason . message : reason ); 20 21         // do something
    to handle these rejections 22     }); 23 24     possiblyUnhandledRejections .
    clear (); 25 26 }, 60000 );


    This is a simple unhandled rejection tracker. It uses a map to store promises
    and their rejection reasons. Each promise is a key, and the promise’s reason is
    the associated value. Each time unhandledrejection is emitted, the promise and
    its rejection reason are added to the map. Each time rejectionhandled is emitted,
    the handled promise is removed from the map. As a result, possiblyUnhandledRejections
    grows and shrinks as events are emitted. The setInterval() call periodically checks
    the list of possible unhandled rejections and outputs the information to the console
    (in reality, you’ll probably want to do something else to log or otherwise handle
    the rejection). A map is used in this example instead of a weak map because you
    need to inspect the map periodically to see which promises are present, and that’s
    not possible with a weak map.


    Preventing Console Warnings in Web Browsers'
