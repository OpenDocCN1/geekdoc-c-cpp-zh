    5 try { 6     throwError (); 7     console . log ( “Didn’t catch error” ); 8 }
    catch ( ex ) { 9     // never called 10     console . log ( “Caught error” );
    11 }


    In this example, the try-catch statement doesn’t catch the error thrown by throwError()
    because a rejected promise is returned. To catch the error, you need to provide
    a rejection handler, like this:


    1 async function throwError () { 2     throw new Error ( “Oh no!” ); 3 } 4 5 throwError
    (). catch ( reason => { 6     console . log ( “Caught error:” , reason . message
    ); 7 });


    Here, the rejection handler is assigned using catch() , and the error results
    in a message being output to the console.


    The JavaScript engine goes through a lot of trouble to ensure that async functions
    always return promises so you have a consistent way to work with the return value.
    That brings us to the third way that async functions are different from synchronous
    functions: the await expression.


    Using Await Expressions


    The await expression is designed to make working with promises simple. Instead
    of manually assigning fulfillment and rejection handlers, any promise used in
    an await expression behaves more like code in a synchronous function: the expression
    returns the fulfilled value of a promise when it succeeds and throws the rejection
    value when the promise fails. That allows you to easily assign the result of an
    await expression to a variable and catch any rejections using a try-catch statement.
    Here’s an example using the fetch() API (available in web browsers and Deno) without
    await :


    1 function retrieveJsonData ( url ) { 2     return fetch ( url ) 3         . then
    ( response => { 4             if ( response . ok ) { 5                 return
    response . json (); 6             } else { 7                 throw new Error (
    `Unexpected status code: ${ response . sta \ 8 tus } ${ response . statusText
    }` ); 9             } 10         }) 11         . catch ( reason => console . error
    ( reason . message )); 12 }


    The retrieveJsonData() function returns a promise that resolves to the JSON data
    in the response from the call to fetch() . There is also a rejection handler to
    print out any error messages. Here’s how you can rewrite this function as an async
    function that uses await :


    1 async function retrieveJsonData ( url ) { 2     3     try { 4         const
    response = await fetch ( url ); 5         if ( response . ok ) { 6            
    return await response . json (); 7         } else { 8             throw new Error
    ( `Unexpected status code: ${ response . status } \ 9 ${ response . statusText
    }` ); 10         } 11     } catch ( error ) { 12         console . error ( error
    . message ); 13     }     14 }


    In this rewritten version of retrieveJsonData() , the call to await fetch(url)
    handles defining fulfillment and rejection handlers for the returned promise.
    The variable response is assigned the fulfillment value of that promise (if successful),
    and rejection throws an error that is caught by the try-catch statement. The function
    still returns a promise that resolves to the JSON data, but it does so by returning
    the fulfillment value of response.json() (another promise). If a rejection is
    triggered in response.json() , then that is also thrown as an error and caught
    in the try-catch statement.


    You may be wondering why not return response.json() directly without await if
    it is a promise. For example:


    1 async function retrieveJsonData ( url ) { 2     3     try { 4         const
    response = await fetch ( url ); 5         if ( response . ok ) { 6            
    return response . json (); 7         } else { 8             throw new Error (
    `Unexpected status code: ${ response . status } \ 9 ${ response . statusText }`
    ); 10         } 11     } catch ( error ) { 12         console . error ( error
    . message ); 13     }     14 }


    This will work the same as the preceding example when response.json() succeeds;
    when response.json() fails, however, that rejection will not be thrown as an error
    and therefore will not be caught with the try-catch in this function. It’s the
    await expression that causes rejections to be thrown as errors, so if you omit
    await , the promise rejection will only be caught by a rejection handler. In this
    example, the rejection handler would have to be added by the code calling this
    function, like this:


    1 async function retrieveJsonData ( url ) { 2     3     try { 4         const
    response = await fetch ( url ); 5         if ( response . ok ) { 6            
    return response . json (); 7         } else { 8             throw new Error (
    `Unexpected status code: ${ response . status } \ 9 ${ response . statusText }`
    ); 10         } 11     } catch ( error ) { 12         console . error ( error
    . message ); 13     }     14 } 15 16 retrieveJsonData ( “https://api.example.com/users”
    ) 17     . then ( data => doSomething ( data )) 18     . catch ( reason => console
    . error ( reason . message ));


    There are valid use cases for both scenarios, some where you want to catch the
    error inside of the async function and some where you want the error to flow outside
    the function.


    Using Await Expressions with Non-Promises


    You can also use await with non-promise values because the value is always passed
    through Promise.resolve() . That means promises are passed through directly, non-promise
    thenables are resolved to promises, and other values are wrapped in promises.
    For example:


    1 async function getMeaningOfLife () { 2     return await 42 ; 3 }; 4 5 getMeaningOfLife
    (). then ( value => console . log ( value ));


    The getMeaningOfLife() function in this code returns a promise that is fulfilled
    with the value 42 . You can achieve the same functionality without an async function
    by rewriting the previous example as follows:


    1 function getMeaningOfLife () { 2     return Promise . resolve ( 42 ); 3 }; 4
    5 getMeaningOfLife (). then ( value => console . log ( value ));


    The ability of await to handle non-promise values means that you aren’t penalized
    if you guess incorrectly about the value being used.


    Using Await Expressions with Multiple Promises


    Even though await expressions operate on a single promise, you can take advantage
    of the built-in promise methods to effectively operate on multiple promises. For
    example, if you’d like to wait for every promise in an array to be fulfilled,
    you can use the Promise.all() method with an await :


    1 async function doSomething () { 2     3     try { 4         return await Promise
    . all ([ 5             promise1 , 6             promise2 , 7             promise3
    8         ]); 9     } catch ( error ) { 10         console . error ( error . message
    ); 11     }     12 }


    In this code, await is used on the result of Promise.all() to cause the function
    to wait until either all of the promises have been fulfilled or one of them is
    rejected (in which case an error is thrown). The three promises are free to be
    fulfilled in parallel while the function waits. Here’s an example of reading multiple
    files in Node.js:


    1 import { readFile } from “node:fs/promises” ; 2 3 async function readFiles (
    filenames ) { 4     const fileContents = await Promise . all ( 5         filenames
    . map ( filename => readFile ( filename , “utf8” )) 6     ); 7 8     return fileContents
    . map ( 9         fileContent => JSON . parse ( fileContent ) 10     ); 11 } 12
    13 readFiles ([ 14     “file1.json” , 15     “file2.json” 16 ]). then ( data =>
    { 17 18     // process as necessary 19     console . log ( data ); 20 21 }). catch
    ( reason => { 22     console . error ( reason . message ); 23 });


    The readFiles() async function uses await with Promise.all() to wait for all of
    the files to be read. The file contents can then be parsed as JSON to return the
    data in the most appropriate format for processing.


    Of course, you can also use await with Promise.allSettled() , Promise.any() ,
    Promise.race() , or any other function that returns a promise.'
