    Node.js Unhandled Rejection Tracking


    Node.js tracks unhandled promise rejections in a similar, but not the same, way
    as browsers. There are two events in Node.js, but these are emitted on the process
    object and have different capitalization than the browser events:


    unhandledRejection : Emitted when a promise is rejected and no rejection handler
    is called within one turn of the event loop.


    rejectionHandled : Emitted when a promise is rejected and a rejection handler
    is called after one turn of the event loop.


