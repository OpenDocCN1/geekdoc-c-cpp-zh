    1 const promise = new Promise (( resolve , reject ) => { 2     throw new Error
    ( “Uh oh!” ); 3 }); 4 5 promise . catch ( reason => { 6     console . log ( reason
    . message );     // “Uh oh!” 7     throw new Error ( “Oops!” ); 8 }). catch (
    reason => { 9     console . error ( reason . message );   // “Oops!” 10 });


    Here, the executor throws an error that triggers the promise ’s rejection handler.
