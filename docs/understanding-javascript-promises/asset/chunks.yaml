  trans: "\n\n默认情况下，浏览器和 Deno 会将未捕获的拒绝（uncaught rejections）输出到控制台，这种行为不会因为你监听了 `uncaughtrejection`\
    \ 事件而改变。你可以在 `onuncaughtrejection` 事件处理程序中调用 `event.preventDefault()` 来阻止控制台警告，如下例所示：\n\
    \n```javascript\nglobalThis . onununhandledrejection = event => {\n    // 防止控制台警告\n\
    \    event . preventDefault ();\n};\n```\n\n此示例阻止了控制台警告，但不会影响与 `rejectionhandled`\
    \ 事件之间的关系。如果触发 `unhandledrejection` 的 promise 之后被赋值了拒绝处理程序，则 `rejectionhandled`\
    \ 事件仍会被触发。\n\n# 在 Web 浏览器中处理未处理的拒绝\n\n`unhandledrejection` 和 `rejectionhandled`\
    \ 事件之间关系的另一个特殊之处在于，你可以在 `onunhandledrejection` 事件处理程序内部添加拒绝处理程序，从而阻止 `rejectionhandled`\
    \ 事件的触发，如下所示：\n\n```javascript\nglobalThis . onununhandledrejection = ({ promise\
    \ , reason }) => {\n    promise . catch (() => {}); // 处理拒绝\n};\n\n// 这将永远不会被调用\n\
    globalThis . onrejectionhandled = ({ promise }) => {\n    console . log ( promise\
    \ );\n};\n```\n\n在这种情况下，`rejectionhandled` 事件不会被触发，因为在该事件触发之前已经添加了拒绝处理程序。浏览器假设你知道该\
    \ promise 现在已处理处理，因此没有理由触发 `rejectionhandled` 事件。\n\n即使在 `onunhandledrejection`\
    \ 内部处理了拒绝，控制台仍然会输出警告，除非你也在 `onunhandledrejection` 内部调用了 `event.preventDefault()`。\n\
    \n# Node.js 未处理拒绝追踪\n\nNode.js 追踪未处理的 promise 拒绝的方式与浏览器相似，但并不完全相同。Node.js 中有两个事件，但它们是在\
    \ `process` 对象上发射的，且字母大小写规则与浏览器事件不同：\n\n- `unhandledRejection`: 当 promise 被拒绝且在事件循环的一个轮次内没有调用拒绝处理程序时，触发此事件。\n\
    - `rejectionHandled`: 当 promise 被拒绝且在一个事件循环循环之后调用了拒绝处理程序时，触发此事件。\n\n此外，与浏览器事件不同，这些事件不接收事件对象。`unhandledRejection`\
    \ 事件处理程序将拒绝原因和被拒绝的 `promise` 作为参数传递。以下代码显示了 `unhandledRejection` 的用法：\n\n```javascript\n\
    const rejected = Promise . reject ( new Error ( “Oops!” ));\nprocess . on ( “unhandledRejection”\
    \ , ( reason , promise ) => {\n    console . log ( reason .message ); // “Oops!”\n\
    \    console . log ( rejected === promise ); // true\n});\n```\n\n此示例创建了一个带有错误对象的被拒绝的\
    \ promise，并监听 `unhandledRejection` 事件。事件处理程序接收错误对象作为第一个参数，并将 `promise` 作为第二个参数。\n\
    \n`rejectionHandled` 事件处理程序只有一个参数，即被拒绝的 `promise`。例如：\n\n```javascript\nconst\
    \ rejected = Promise . reject ( new Error ( “Oops!” ));\n\nsetTimeout (() => {\n\
    \    // “rejectionhandled” 在此处触发\n    rejected . catch (\n        reason => console\
    \ . error ( reason . message ) // “Oops!”\n    );\n}, 500);\n\nprocess . on (\
    \ “rejectionHandled” , promise => {\n    console . log ( rejected === promise\
    \ ); // true\n});\n```\n\n在这里，当拒绝处理程序最终被调用时，会发射 `rejectionHandled` 事件。注意，与浏览器不同，拒绝的原因没有传递给\
    \ `rejectionHandled` 事件处理程序。\n\n默认情况下，当发生未处理的 promise 拒绝时，除非存在 `unhandledRejection`\
    \ 事件处理器，否则 Node.js 会抛出一个错误。你可以通过 `--unhandled-rejection` 命令行选项更改 Node.js 处理未捕获\
    \ promise 拒绝的方式。\n\n- `--unhandled-rejection=throw`（默认）意味着发射 `unhandledRejection`\
    \ 事件。如果没有指定 `unhandledRejection` 事件处理器，则拒绝原因将作为错误抛出，可以通过 `uncaughtException` 事件处理器进行捕获。如果没有指定\
    \ `uncaughtException` 处理器，Node.js 进程将退出并将 `process.exitCode` 设置为 1。\n- `--unhandled-rejection=strict`\
    \ 意味着不发射 `unhandledRejection` 事件。相反，拒绝原因将被抛出，可以通过 `uncaughtException` 事件处理器进行捕获。任何\
    \ `unhandledRejection` 处理器都不会执行。\n- `--unhandled-rejection=warn` 意味着发射 `unhandledRejection`\
    \ 事件，并且无论是否定义了任何 `unhandledRejection` 处理器，控制台始终会输出警告。进程退出代码不会改变。\n- `--unhandled-rejection=warn-with-error-code`\
    \ 的作用与 `--unhandled-rejection=warn` 相同，不同之处在于如果没有指定其他退出代码，进程退出时会将 `process.exitCode`\
    \ 设置为 1。\n- `--unhandled-rejection=none` 完全忽略任何未处理的 promise 拒绝。没有控制台输出，进程继续执行\
    \ JavaScript。\n\n对于生产部署，建议使用 `--unhandled-rejection=strict`，因为 promise 拒绝可能会以某种方式让应用程序处于不稳定状态。\n\
    \n# 在 Node.js 中报告未处理的拒绝\n\n为了正确追踪未处理的拒绝，请使用 `unhandledRejection` 和 `rejectionHandled`\
    \ 事件来维护未处理拒绝的列表。以下是 Node.js 版本的拒绝追踪器：\n\n```javascript\nconst possiblyUnhandledRejections\
    \ = new Map ();\n\n// 当拒绝未处理时，将其加入 map\nprocess . on ( “unhandledRejection” ,\
    \ ( reason , promise ) => {\n    possiblyUnhandledRejections . set ( promise ,\
    \ reason );\n});\n\n// 当拒绝被处理时，将其从 map 中删除\nprocess . on ( “rejectionHandled”\
    \ , promise => {\n    possiblyUnhandledRejections . delete ( promise );\n});\n\
    \nsetInterval (() => {\n    possiblyUnhandledRejections .forEach (( reason , promise\
    \ ) => {\n        console . error ( “Unhandled rejection” );\n        console\
    \ . error ( promise );\n        console . error ( reason . message ? reason .\
    \ message : reason );\n        // 处理这些拒绝\n    });\n    possiblyUnhandledRejections\
    \ .clear ();\n}, 60000);\n```\n\n此拒绝追踪器的算法与浏览器中相同，只是使用了 Node.js 特有的功能。除此之外，`possiblyUnhandledRejections`\
    \ 随着事件的调用增加和减少，并使用 `setInterval()` 定期检查未处理的拒绝并将信息输出到控制台。\n\n# 总结\n\n所有 JavaScript\
    \ 运行时都以某种方式追踪未处理的拒绝。浏览器和 Deno 实现了 HTML 规范中的算法，而 Node.js 实现了了自己的解决方案。两种解决方案都依赖于两个事件：一个在检测到未处理的拒绝时发射，另一个在之前未处理的拒绝被添加了拒绝处理程序时发射。\n\
    \n`unhandledrejection` 事件在浏览器和 Deno 中在 `globalThis` 对象上每当检测到未处理拒绝都会发射。`unhandledrejection`\
    \ 事件处理器接收一个包含事件类型、被拒绝的 `promise` 以及 拒绝原因的事件对象。`rejectionhandled` 事件在之前未处理的拒绝被添加了拒绝处理程序时发射。\n\
    \nNode.js 也使用两个事件，但它们发生在 `process` 对象上，且名称略有不同：`unhandledRejection` 和 `rejectionHandled`。`unhandledRejection`\
    \ 事件处理器接收拒绝原因和 `promise` 作为参数；`rejectionHandled` 事件处理器只接收 `promise`。\n\n"
