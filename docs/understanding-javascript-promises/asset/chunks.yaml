  trans: "\n在这个示例中，在 `p1` 的成功处理器内部创建了一个新的 promise。这意味着在 `p2` 成功完成之前，第二个成功处理器不会执行。`p2`\
    \ 的执行器通过 `setTimeout()` 延迟了 500 毫秒，但在更实际场景中，你可能会发起网络请求或文件系统请求。当你希望在启动新的异步操作之前等待上一个\
    \ promise 状态稳定时，这种模式非常有用。\n\n## 总结\n\n多个 promise 可以以各种方式链在一起，以便在它们之间传递信息。对 `then()`、`catch()`\
    \ 和 `finally()` 的每次调用都会创建并返回一个新的 promise，该 promise 在前一个 promise 稳定后变为解析（resolved）。如果\
    \ promise 处理器返回一个值，那么该值将成为 `then()` 和 `catch()` 创建的新 promise 的值（`finally()` 会忽略此值）；如果\
    \ promise 处理器抛出错误，则错误会被捕获，且返回的新 promise 将以该错误为原因被拒绝（rejected）。\n\n当链中的一个 promise\
    \ 被拒绝时，从其他链式处理器创建的 promise 也会被拒绝，直到到达链的末尾。基于这一点，建议在每个 promise 链末尾附加一个拒绝处理器，以确保错误被正确处理。未能捕获\
    \ promise 拒绝将导致控制台输出消息、抛出错误或两者兼有（取决于运行时环境）。\n\n你可以从处理器返回 promise，在这种情况下，从 `then()`\
    \ 和 `catch()` 调用返回的 promise 的稳定状态将与处理器返回的 promise 的稳定状态和值相（`finally()` 返回的解析 promise\
    \ 会被忽略，而拒绝的 promise 会被遵循）。你可以利用这一点，延迟某些操作直到某个 promise 成功完成，然后启动并返回第二个 promise，以继续使用同一个\
    \ promise 链。\n\n本章探讨了如何将多个 promise 链在一起，使它们的作用更像一个 promise。在下一章中，你将学习如何处理并行运行的多个\
    \ promise。\n\n## 3. 使用多个 promise\n\n到目前为止，书中的每个示例都处理一次对一个 promise 的响应。然而，有时你可能希望监控多个\
    \ promise 的进度，以决定下一步操作。JavaScript 提供了几种方法来监控多个 promise 并以略有不同的方式对其响应。本章讨论的所有方法都允许多个\
    \ promise 并行执行，然后作为一个整体进行响应，而不是逐个处理。\n\n### Promise.all() 方法\n\n`Promise.all()`\
    \ 方法接受单个参数，该是一个要监控的 promise 可迭代对象（例如数组），并返回一个 promise，只有当迭代对象中的每个 promise 都解析时，该\
    \ promise 才会解析。当迭代对象中的每个 promise 都成功完成时，返回的 promise 变为成功，如示例所示：\n\n```javascript\n\
    let promise1 = Promise.resolve(42);\nlet promise2 = new Promise((resolve, reject)\
    \ => {\n    resolve(43);\n});\nlet promise3 = new Promise((resolve, reject) =>\
    \ {\n    setTimeout(() => {\n        resolve(44);\n    }, 100);\n});\n\nlet promise4\
    \ = Promise.all([promise1, promise2, promise3]);\n\npromise4.then(value => {\n\
    \    console.log(Array.isArray(value));   // true\n    console.log(value[0]);\
    \             // 42\n    console.log(value[1]);             // 43\n    console.log(value[2]);\
    \             // 44\n});\n```\n\n这里的每个 promise 都用数字解析。对 `Promise.all()` 的调用创建了\
    \ `promise4`，它最终在 `promise1`、`promise2` 和 `promise3` 都成功完成后变为成功完成。传递给 `promise4`\
    \ 成功处理器的结果是一个包含每个解析值的数组：`42`、`43` 和 `44`。这些值按照 promise 传递给 `Promise.all()` 的顺序存储，因此你可以将\
    \ 结果与解析它们的 promise 相匹配。\n\n如果传递给 `Promise.all()` 的任何 promise 被拒绝，返回的 promise 将立即被拒绝，无需等待其他\
    \ promise 完成：\n\n```javascript\nlet promise1 = Promise.resolve(42);\nlet promise2\
    \ = Promise.reject(43);\nlet promise3 = new Promise((resolve, reject) => {\n \
    \   setTimeout(() => {\n        resolve(44);\n    }, 100);\n});\n\nlet promise4\
    \ = Promise.all([promise1, promise2, promise3]);\n\npromise4.catch(reason => {\n\
    \    console.log(Array.isArray(reason)); // false\n    console.log(reason);  \
    \               // 43\n});\n```\n\n在这个示例中，第二个 promise (`promise2`) 被以值 `43` 拒绝。`promise4`\
    \ 的拒绝处理器被立即调用，而无需等待第一个 promise。\n\n### 何时使用 Promise.all()\n\n在任何你需要等待多个 promise\
    \ 且任何一个失败都应导致整个操作失败的情况下，你都会想要使用 `Promise.all()`。\n\n### 共同处理多个文件\n\n当使用 Node.js\
    \ 或 Deno 等服务端运行时时，你可能需要读取多个文件来处理数据。在这种情况下，最有效的方法是并行读取文件并等待它们全部完成。这是一个在 Node.js\
    \ 中运行的示例：\n\n```javascript\nimport { readFile } from \"node:fs/promises\";\n\n\
    function readFiles(filenames) {\n    return Promise.all(\n        filenames.map(filename\
    \ => readFile(filename, \"utf8\"))\n    );\n}\n\nreadFiles([\"file1.json\", \"\
    file2.json\"])\n    .then(fileContents => {\n        // 解析 JSON 数据\n        const\
    \ data = fileContents.map(\n            fileContent => JSON.parse(fileContent)\n\
    \        );\n        // 根据需要处理\n        console.log(data);\n    })\n    .catch(reason\
    \ => {\n        console.error(reason.message);\n    });\n```\n\n### 调用多个相关的 Web\
    \ 服务 API\n\n`Promise.all()` 的另一个常见用例是调用多个 Web 服务 API。这在 REST API 中特别常见，因为与实体关联的每个类型数据可能有其自己的端点。例如，考虑一个应用程序，每个用户都有博客文章和专辑，你可能需要在用户个人资料上收集所有这些信息。代码可能如下所示：\n\
