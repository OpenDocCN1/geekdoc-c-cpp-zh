    两种方法都允许你通过监听这两个事件并在单独的位置跟踪它们提供的 promise，从而为你的应用程序实现未处理的拒绝（unhandled rejection）报告。然后，你可以定期检查
    promise 列表，并将它们报告到你的日志或报告系统中。


    ## 结语


    当 promise 在 2015 年被引入 JavaScript 语言时，它们曾是争议的来源，也是许多深度文章的主题，人们在探讨这是否是解决 JavaScript
    异步未来的正确方式。几年之后，尘埃已经落定，promise 赢得了许多人的认可，特别是随着 2017 年 async 函数的引入。所有新的异步 异步 API
    都是为了利用 promise 而构建的，因此理解如何使用 promise 是任何与 JavaScript 相关工作的重要组成部分。


    我希望你喜欢这次对 JavaScript promise 的探索。


