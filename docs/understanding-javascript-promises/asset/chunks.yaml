  trans: "\n\n`Promise.resolve()` 方法接受单个参数并返回一个处于已完成（fulfilled）状态的 promise。这意味着如果你已经知道了\
    \ promise 的值，就不需要提供执行器（executor）。例如：\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n这段代码创建了一个已完成的\
    \ promise，因此完成处理程序接收到的 `42` 作为 `value`。与本章中的其他示例一样，完成处理程序会在当前脚本任务完成后作为微任务（microtask）执行。如果给此\
    \ promise 添加了拒绝处理程序（rejection handler），该处理器将永远不会被调用，因为 promise 永远不会处于拒绝（rejected）状态。\n\
    \n如果你向 `Promise.resolve()` 传递 promise，函数将返回你传递的同一个 promise。例如：\n\n```javascript\n\
    const promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(promise1);\n\
    console.log(promise1 === promise2); // true\n```\n\n### 使用 `Promise.reject()`\n\
    \n你也可以通过 `Promise.reject()` 方法创建被拒绝的 promise。它的工作原理类似于 `Promise.resolve()`，但创建的\
    \ promise 处于拒绝状态，如下：\n\n```javascript\nconst promise = Promise.reject(42);\npromise.catch(reason\
    \ => {\n    console.log(reason); // 42\n});\n```\n\n向此 promise 添加的任何额外拒绝处理程序都会被调用，但完成处理程序不会，因为\
    \ promise 永远不会处于已完成状态。\n\n如果你向 `Promise.resolve()` 或 `Promise.reject()` 方法中的任意一个传递\
    \ promise，该 promise 将不修改地返回。\n\n#### 非 Promise 的 Thenables\n\n`Promise.resolve()`\
    \ 和 `Promise.reject()` 也接受非 promise 的 thenables（具有 then 方法的对象）作为参数。当传递一个非 promise\
    \ 的 thenable 时，这些方法会创建一个在 `then()` 函数之后调用的新 promise。\n\n当一个对象拥有一个 `then()` 方法且该方法接受\
    \ `resolve` 和 `reject` 参数时，就会产生一个非 promise 的 thenable：\n\n```javascript\nconst\
    \ thenable = {\n    then(resolve, reject) {\n        resolve(42);\n    }\n};\n\
    ```\n\n示例中的 thenable 对象除了 `then()` 方法外，没有其他与 promise 相关的特征。你可以调用 `Promise.resolve()`\
    \ 将 thenable 转换为已完成的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve,\
    \ reject) {\n        resolve(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
    promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n在此示例中，`Promise.resolve()`\
    \ 调用了 `thenable.then()`，以便确定 promise 的状态。由于在 `then()` 方法内部调用了 `resolve(42)`，所以\
    \ `thenable` 的 promise 状态是已完成的。创建一个名为 `promise` 的新已完成 promise，其值为从 `thenable`\
    \ 传递的（即 `42`），并且 `promise` 的完成处理程序接收到的 `42` 作为值。\n\n相同的过程也可以用于 `Promise.resolve()`\
    \ 从 thenable 创建被拒绝的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve,\
    \ reject) {\n        reject(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
    promise.catch(value => {\n    console.log(value); // 42\n});\n```\n\n此示例与上一个相似，但\
    \ `thenable` 是被拒绝的。当 `thenable.then()` 执行时，会创建一个处于拒绝状态的新 promise，其值为 `42`。该值随后被传递给\
    \ `promise` 的拒绝处理程序。\n\n`Promise.resolve()` 和 `Promise.reject()` 正是这样工作的，允许你轻松地处理非\
    \ promise 的 thenables。在 2015 年 promise 引入之前，许多库都使用 thenables，因此将 thenables 转换为正式\
    \ promise 对于与现有库的向后兼容至关重要。当你不确定一个对象是否为 promise 时，将对象传递给 `Promise.resolve()` 或\
    \ `Promise.reject()`（取决于你的预期结果）是查明的最佳方法，因为 promise 会被原样传递通过。\n\n### 总结\n\nPromise\
    \ 是一个值的占位符，该值可能会作为某些异步操作的结果在以后提供。与其赋值事件处理器或向函数传递回调函数，不如你可以使用 promise 来表示操作的结果。\n\
    \nPromise 有三种状态：等待（pending）、已完成（fulfilled）和拒绝（rejected）。promise 从等待（未稳定）状态开始，并在成功执行时变为已完成，或在失败时变为拒绝（完成和拒绝都是稳定状态）。在何种情况下，都可以添加处理程序来指示\
    \ promise 何时稳定。`then()` 方法允许你分配一个完成处理器和一个拒绝处理程序；`catch()` 方法允许你只分配一个拒绝处理程序；`finally()`\
    \ 方法允许你分配一个无论结果如何都会被调用的稳定处理器。所有 promise 处理程序都作为微任务运行，因此它们在当前脚本任务完成之前不会执行。\n\n\
    你可以使用 `Promise` 构造函数创建新的未稳定 promise，该构造函数接受执行器函数作为其唯一参数。执行器被传递 `resolve()` 和 `reject()`\
    \ 函数，你使用这些函数来指示 promise 的成功或失败。执行器在 promise 创建时立即运行，这与作为微任务运行的处理器不同。在执行器中抛出的任何错误都会被自动捕获并传递给\
    \ `reject()`。\n\n可以使用 `Promise.resolve()` 创建已完成的 promise，使用 `Promise.reject()`\
    \ 创建被拒绝的 promise。每种方法都会将其参数包装在 promise 中（如果它不是 promise 和非 promise-thenable），或者透传现有\
    \ promise。这些方法在你不确定值是否为 promise 但希望它像 promise 一样运行时非常有帮助。\n\n虽然创建单个 promise 是处理\
    \ JavaScript 操作的一种实用且有效的方法，但 promise 在链式运行时允许有趣的组合模式。在下一章中，你将学习 promise 处理程序如何创建\
    \ promise 链以及为什么这非常有价值。\n\n### 2. Promise 链\n\n到目前，promise 似乎只是对组合回调和 `setTimeout()`\
    \ 函数的改进，但 promise 远比看到的复杂。具体来说，有许多方法可以链式 promise 以实现更复杂的行为。\n\n对 `then()`、`catch()`\
    \ 或 `finally()` 的每次调用实际上创建并返回另一个 promise。第二个 promise 只有在第一个 promise 完成或拒绝后才会变为稳定。考虑这个示例：\n\
    \n```javascript\nconst promise = Promise.resolve(42);\npromise.then(value => {\n\
    \    console.log(value);\n}).then(() => {\n    console.log(\"Finished\");\n});\n\
    ```\n\n代码输出为：\n\n```\n42\nFinished\n```\n\n`promise.then()` 调用返回第二个 promise，并在上面调用\
    \ `then()`。第二个 `then()` 完成处理器只有在第一个 promise 解析后才会被调用。如果对此示例取消链，它看起来像这样：\n\n```javascript\n\
    const promise1 = Promise.resolve(42);\nconst promise2 = promise1.then(value =>\
    \ {\n    console.log(value);\n});\npromise2.then(() => {\n    console.log(\"Finished\"\
    );\n});\n```\n\n在代码取消链的版本中，`promise1.then()` 的结果存储在 `promise2` 中，然后调用 `promise2.then()`\
    \ 来添加最后的完成处理器。`promise2.then()` 的调用也返回一个 promise。这个示例只是没有使用那个 promise。\n\n####\
    \ 捕获错误\n\nPromise 链允许你捕获在前一个 promise 的完成或拒绝处理器中可能发生的错误。例如：\n\n```javascript\n\
    const promise = Promise.resolve(42);\npromise.then(value => {\n    throw new Error(\"\
    Oops!\");\n}).catch(reason => {\n    console.error(reason.message); // \"Oops!\"\
    \n});\n```\n"
- fmt: "\nIn this code, the fulfillment handler for promise throws an error. The chained\
    \ call to the `catch()` method, which is on a second promise, is able to receive\
    \ that error through its rejection handler. The same is true if a rejection handler\
    \ throws an error:\n\n```javascript\nconst promise = new Promise (( resolve ,\
    \ reject ) => { \n    throw new Error ( “Uh oh!” ); \n}); \npromise . catch (\
    \ reason => { \n    console . log ( reason . message );     // “Uh oh!”\n    throw\
    \ new Error ( “Oops!” ); \n}). catch ( reason => { \n    console . error ( reason\
    \ . message );  // “Oops!” \n});\n```\n\nHere, the executor throws an error that\
    \ triggers the promise ’s rejection handler. That handler then throws another\
    \ error that is caught by the second promise’s rejection handler. The chained\
    \ promise calls are aware of errors in other promises in the chain.\n\nYou can\
    \ use this ability to catch errors through a promise chain to effectively act\
    \ like a try-catch statement. Consider using `fetch()` to retrieve some data and\
    \ wanting to catch any errors that occur:\n\n```javascript\nconst promise = fetch\
    \ ( “books.json” ); \npromise . then ( response => { \n    console . log ( response\
    \ . status ); \n}). catch ( reason => { \n    console . error ( reason . message\
    \ ); \n});\n```\n\nThis example will output the response status from the `fetch()`\
    \ call if it succeeds and will output the error message if the call fails. You\
    \ can take this a step further and handle status codes outside of the 200-299\
    \ range as errors by checking the `response.ok` property (discussed in Chapter\
    \ 1) and throwing an error if it is false , as in this example:\n\n```javascript\n\
    const promise = fetch ( “books.json” ); \npromise . then ( response => { \n  \
    \  if ( response . ok ) { \n        console . log ( response . status ); \n  \
    \  } else { \n        throw new Error ( `Unexpected status code: ${ response .\
    \ status } ${ response . statusText }` ); \n    } \n}). catch ( reason => { \n\
    \    console . error ( reason . message ); \n});\n```\n\nThe chained `catch()`\
    \ call in this example creates a rejection handler that catches both errors returned\
    \ by `fetch()` and also any errors thrown in the fulfillment handler. So instead\
    \ of needing two different handles for catching the two different types of errors,\
    \ you can use one to handle all of the errors that may occur in the chain.\n\n\
    Always have a rejection handler at the end of a promise chain to ensure that you\
    \ can properly handle any errors that may occur.\n\n### Using finally() in Promise\
    \ Chains\n\nThe `finally()` method behaves differently than either `then()` or\
    \ `catch()` in that it copies the state and value of the previous promise into\
    \ its returned promise. That means if the original promise is fulfilled with a\
    \ value, then `finally()` returns a promise that is fulfilled with the same value.\
    \ For example:\n\n```javascript\nconst promise = Promise . resolve ( 42 ); \n\
    promise . finally (() => { \n    console . log ( “Finally called.” ); \n}). then\
    \ ( value => { \n    console . log ( value );         // 42\n});\n```\n\nHere,\
    \ the settlement handler can’t receive the fulfilled value from `promise`, so\
    \ that value is copied to a new promise that is returned from the method call.\
    \ The new promise is fulfilled with the value 42 (copied from `promise`) so the\
    \ fulfillment handler receives 42 as an argument. Keep in mind that even though\
    \ the returned promise and `promise` have the same value, they are not the same\
    \ object, as you can see in this example:\n\n```javascript\nconst promise1 = Promise\
    \ . resolve ( 42 ); \nconst promise2 = promise1 . finally (() => { \n    console\
    \ . log ( “Finally called.” ); \n}); \npromise2 . then ( value => { \n    console\
    \ . log ( value );         // 42\n}); \nconsole . log ( promise1 === promise2\
    \ ); // false\n```\n\nIn this code, the returned value from `promise1.finally()`\
    \ is stored in `promise2`, at which point you can determine that it is not the\
    \ same object as `promise1`. The call to `finally()` always copies the state and\
    \ value from the original promise. That also means that when `finally()` is called\
    \ on a rejected promise, it in turn returns a rejected promise, as in this example:\n\
    \n```javascript\nconst promise = Promise . reject ( 43 ); \npromise . finally\
    \ (() => { \n    console . log ( “Finally called.” ); \n}). catch ( reason =>\
    \ { \n    console . error ( reason );      // 43\n});\n```\n\nThe `promise` in\
    \ this example is rejected with a reason of 43. Once again, the settlement handler\
    \ cannot access this information as it is not passed in as an argument, so instead\
    \ it returns a new promise that is rejected for the same reason. You can then\
    \ use `catch()` to retrieve the reason.\n\nThe one exception to how `finally()`\
    \ works is when an error is thrown inside of the settlement handler or a rejected\
    \ promise is rejected. In this case, the returned promise does not maintain the\
    \ state and value of the original promise, instead it is rejected with the thrown\
    \ error. Here’s an example:\n\n```javascript\nconst promise1 = Promise . reject\
    \ ( 43 ); \npromise1 . finally (() => { \n    throw 44 ; \n}). catch ( reason\
    \ => { \n    console . error ( reason ); \n}); \n\nconst promise2 = Promise .\
    \ reject ( 43 ); \npromise2 . finally (() => { \n    throw 44 ; \n}). catch (\
    \ reason => { \n    console . error ( reason ); \n});\n```\n\nBecause the `promise1`\
    \ in the first example is rejected with 43, the `catch()` handler receives 43.\
    \ In the second example, `promise2` is rejected with 44, and the `catch()` handler\
    \ receives 44.\n\nIn Chapter 1, you saw how a settlement handler can be used to\
    \ toggle the loading state of an application. Rewriting that example using promise\
    \ chains, and mixing in some error handling from earlier, here’s a complete example:\n\
    \n```javascript\nconst appElement = document . getById ( “app” ); \nconst promise\
    \ = fetch ( “books.json” ); \nappElement . classList . add ( “loading” ); \npromise\
    \ . then ( response => { \n    if ( response . ok ) { \n        console . log\
    \ ( response . status ); \n    } else { \n        throw new Error ( `Unexpected\
    \ status code: ${ response . status } ${ response . statusText }` ); \n    } \n\
    }). finally (() => { \n    appElement . classList . remove ( “loading” ); \n}).\
    \ catch ( reason => { \n    console . error ( reason . message ); \n});\n```\n\
    \nUnlike a try-catch statement, you don’t want `finally()` to be the last part\
    \ of the chain in case it throws an error. So `then()` is called first, to handle\
    \ the response from `fetch()`, then `finally()` is added to the chain to trigger\
    \ the UI change, and last `catch()` adds the error handler for the entire chain.\
    \ This is where settlement handlers passing along the state of the previous promise\
    \ is helpful: if the fulfillment handler ends up throwing an error, the rejection\
    \ handler accesses it.\n\n### Returning Values in Promise Chains\n\nAnother important\
    \ aspect of promise chains is the ability to pass data from one promise to the\
    \ next. You’ve already seen that a value passed to the `resolve()` handler inside\
    \ an executor is passed to the fulfillment handler for that promise. You can continue\
    \ passing data along a chain by specifying a return value from the fulfillment\
    \ handler. For example:\n\n```javascript\nconst promise = Promise . resolve (\
    \ 42 ); \npromise . then ( value => { \n    console . log ( value );         //\
    \ 42\n    return value + 1 ; \n}). then ( value => { \n    console . log ( value\
    \ );         // 43\n});\n```\n\nThe fulfillment handler for `promise` returns\
    \ `value + 1` when executed. Since `value` is 42 (from the executor), the fulfillment\
    \ handler returns 43.\n"
