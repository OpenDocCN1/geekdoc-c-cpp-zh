  trans: "\n\n`fetch()` 函数是 JavaScript 运行时中一种常用的工具函数，用于发送网络请求。`fetch()` 的调用并不会立即完成网络请求；该将在稍后发生。相反，该函数会返回一个\
    \ promise 对象（在本示例中存储在 `promise` 变量中，但你可以随心命名），代表该异步操作，以便你将来对其进行处理。你具体何时能够处理该结果完全取决于\
    \ promise 的生命周期的进展。\n\n## Promise 的生命周期\n\n每个 promise 都经历一个短暂的生命周期，从 `pending`（等待中）状态开始，表示\
    \ promise 尚未完成。`pending` 的 promise 被视为未决（unsettled）。一旦 `fetch()` 函数返回 promise，该\
    \ promise 就处于 `pending` 状态。一旦 promise 完成，它就会被视为已决（settled），并进入两种可能状态之一（见图 1-1）：\n\
    \n- **Fulfilled**（已完成）：promise 成功完成。\n- **Rejected**（已拒绝）：promise 因为错误或其他原因未能成功完成。\n\
    \n![](img/file1.png)\n\n图 1-1：Promise 状态\n\n内部属性 `[[PromiseState]]` 被设置为 `\"pending\"\
    `、`fulfilled\"` 或 `\"rejected\"` 以反映 promise 的状态。该属性不会在 promise 对象上暴露，因此你无法通过程序确定\
    \ promise 处于何种状态。但你可以通过 `then()` 方法在 promise 状态改变时采取特定操作。\n\n## 使用 then() 赋值处理器\n\
    \n所有 promise 都有 `then()` 方法，并接收两个参数。第一个参数是在 promise 已完成时调用的函数，称为“完成处理程序”（fulfillment\
    \ handler）。与异步操作相关的任何额外数据都会传递给此函数。第二个参数是在 promise 被拒绝时调用的函数，称为“拒绝处理程序”（rejection\
    \ handler）。与完成处理器类似，拒绝处理程序也会接收与拒绝相关的任何额外数据。\n\n任何以这种方式实现 `then()` 方法的对象被称为 `thenable`。所有的\
    \ promise 都是 thenable，但并非所有的 thenable 都是 promise。\n\n`then()` 的两个参数都是可选的，因此你可以监听完成和拒绝的任何组合。例如，考虑这组\
    \ `then()` 调用：\n\n```javascript\nconst promise = fetch ( “books.json” );\n// 添加一个完成处理器和一个拒绝处理器\n\
    promise .then ( response => {\n    // fulfillment\n    console .log ( response\
    \ . status );\n}, reason => {\n    // rejection\n    console .error ( reason .\
    \ message );\n});\n\n// 添加另一个完成处理器\npromise .then ( response => {\n    // fulfillment\n\
    \    console .log ( response . statusText );\n});\n\n// 添加另一个拒绝处理器\npromise .then\
    \ ( null , reason => {\n    // rejection\n    console .error ( reason . message\
    \ );\n});\n```\n\n所有三个 `then()` 调用都作用于同一个 promise。第一次调用同时分配了完成处理器和拒绝处理器。第二次只分配了完成处理器；错误不会被报告。第三次仅分配了拒绝处理器，且不报告成功。\n\
    \n`fetch()` 函数的一个特点是，只要它接收到 HTTP 状态码（即使是 404 或 500），返回的 promise 就会完成。只有当网络请求由于某些原因失败时，promise\
    \ 才会被拒绝。如果你想确保状态处于 200-299 范围内，可以像示例所示检查 `response.ok` 属性：\n\n```javascript\n\
    const promise = fetch ( “books.json” );\npromise .then ( response => {\n    if\
    \ ( response .ok ) {\n        console .log ( “Request succeeded.” );\n    } else\
    \ {\n        console .error ( “Request failed.” );\n    }\n});\n```\n\n## 使用 catch()\
    \ 赋值拒绝处理器\n\nPromise 也有一个 `catch()` 方法，当只传递拒绝处理器时，它的行为与 `then()` 相同。例如，以下 `catch()`\
    \ 和 `then()` 调用在功能上是等价：\n\n```javascript\nconst promise = fetch ( “books.json”\
    \ );\npromise .catch ( reason => {\n    // rejection\n    console .error ( reason\
    \ . message );\n});\n\n// 等同于：\npromise .then ( null , reason => {\n    // rejection\n\
    \    console .error ( reason . message );\n});\n```\n\n`then()` 和 `catch()` 的意图让你结合使用它们，清楚地指示结果是如何被处理的。这种系统比事件和回调更好，因为它让成功或失败完全清晰。（事件在发生错误时往往不会触发，而在回调中你必须始终记得检查错误参数。）只需知道，如果你没有为被拒绝的\
    \ promise 附加拒绝处理器，JavaScript 运行时将向控制台输出消息，或者抛出错误，或者两者兼有（取决于运行时）。\n\n## 使用 finally()\
    \ 赋值结算处理器\n\n除了 `then()` 和 `catch()`，还有 `finally()`。传递给 `finally()` 的回调（称为“结算处理程序”，settlement\
    \ handler）无论成功失败都会调用。与 `then()` 和 `catch()` 的回调不同，`finally()` 回调不接收任何参数，因为不清楚它是否有参数。由于结算处理器在完成和拒绝时都会调用，它与\
    \ `then()` 相似（但并不相同；将在第 2 部分进一步讨论）。这是一个示例：\n\n```javascript\nconst promise = fetch\
    \ ( “books.json” );\npromise .finally (() => {\n    // 无法知道是完成还是拒绝\n    console\
    \ .log ( “Settled” );\n});\n\n// 类似于：\nconst callback = () => {\n    console .log\
    \ ( “Settled” );\n};\npromise .then ( null , callback );\n```\n\n只要你不访问传递给 `callback`\
    \ 的参数，这两个示例之间的行为是相同的。但是，作为 `catch()`，使用 `finally()` 会让意图更清晰。\n\n当你想要知道某个操作已完成而不在乎结果时，结算处理器非常有用。例如，你可能希望在\
    \ `fetch()` 请求活动期间在页面上显示加载指示，并在请求完成后将其隐藏。请求是否成功并不重要。你的 Web 应用程序中可能会有如下代码：\n\n\
    ```javascript\nconst appElement = document .getElementById ( “app” );\nconst promise\
    \ = fetch ( “books.json” );\n\nappElement .classList .add ( “loading” );\n\npromise\
    \ .then (() => {\n    // 处理成功\n});\n\npromise .catch (() => {\n    // 处理失败\n});\n\
    \npromise .finally (() => {\n    appElement .classList .remove ( “loading” );\n\
    });\n```\n\n在这里，`appElement` 代表封装整个应用的 HTML 元素。使用 `fetch()` 启动网络请求，并将 CSS 类“loading”\
    \ 添加到 HTML 元素中（允许你根据需要更改样式）。当网络请求完成后，`promise` 结算，结算处理器从 HTML 元素移除“loading”类以重置应用状态。\n\
    \n通过 `finally()` 添加的结算处理器不会防止拒绝向控制台输出错误或抛出错误。你仍然必须添加拒绝处理器，以防止在这种情况下抛出错误。\n\n##\
    \ 为已结算的 Promise 赋值处理器\n\n即使在 promise 已经结算后添加完成、拒绝或结算处理器，它们仍然会被执行。这允许你在任何时候添加新的完成和拒绝处理器，并保证它们会被调用。例如：\n\
    \n"
- fmt: "\n```javascript\nconst promise = fetch ( “books.json” );\n// original fulfillment\
    \ handler\npromise .then ( response => {\n    console .log ( response .status\
    \ );\n    // now add another\n    promise .then ( response => {\n        console\
    \ .log ( response .statusText );\n    });\n});\n```\n\nIn this code, the fulfillment\
    \ handler adds another fulfillment handler to the same promise. The promise is\
    \ already fulfilled at this point, so the new fulfillment handler is added to\
    \ the microtask queue and called when ready. Rejection and settlement handlers\
    \ work the same way.\n\n### Handlers and Microtasks\n\nJavaScript executed in\
    \ the regular flow of a program is executed as a `task`, which is to say that\
    \ the JavaScript runtime has created a new execution context and executes the\
    \ code completely, exiting when finished. As an example, an `onclick` handler\
    \ for a button in a web page is executed as a `task`. When the button is clicked,\
    \ a new task is created and the `onclick` handler is executed. Once complete,\
    \ the JavaScript runtime waits for the next interaction to execute more code.\
    \ Promise handlers, however, are executed in a different way.\n\nAll promise handlers,\
    \ whether fulfillment, rejection, or settlement, are executed as `microtasks`\
    \ inside of the JavaScript engine. `microtasks` are queued and then executed immediately\
    \ after the currently running task has completed, before the JavaScript runtime\
    \ becomes idle. Calling `then()`, `catch()`, or `finally()` tells a promise to\
    \ queue the specified `microtasks` once the promise is settled.\n\nThis is different\
    \ than creating timers using `setTimeout()` or `setInterval()`, both of which\
    \ create new tasks to be executed at a later point in time. Queued promise handlers\
    \ will always execute before timers that are queued in the same task. You can\
    \ test this for yourself by using the global `queueMicrotask()` function, which\
    \ is used to create `microtasks` outside of promises:\n\n```javascript\nsetTimeout\
    \ (() => {\n    console .log ( “timer” );\n    queueMicrotask (() => {\n     \
    \   console .log ( “microtask in timer” );\n    });\n}, 0 );\n\nqueueMicrotask\
    \ (() => {\n    console .log ( “microtask” );\n});\n```\n\nIn this code, a timer\
    \ is created with a delay of 0 milliseconds, and inside of that timer a new `microtask`\
    \ is created. Also, a `microtask` is created outside of the timer. When this code\
    \ executes, you will see the following output to the console:\n\n```\nmicrotask\n\
    timer\nmicrotask in timer\n```\n\nEven though the timer is set for a delay of\
    \ 0 milliseconds, the `microtask` executes first, followed by the timer, followed\
    \ by the `microtask` inside of the timer.\n\nThe most important thing to remember\
    \ about `microtasks`, including all promise handlers, is that they are executed\
    \ as soon as possible once a task is complete. This minimizes the amount of time\
    \ between a promise settling and the reaction to the settling, making promises\
    \ suitable for situations where runtime performance is important.\n\n### Creating\
    \ New (Unsettled) Promises\n\nNew promises are created using the `Promise` constructor.\
    \ This constructor accepts a single argument: a function called the `executor`,\
    \ which contains the code to initialize the promise. The `executor` is passed\
    \ two functions named `resolve()` and `reject()` as arguments. You call the `resolve()`\
    \ function when the `executor` has finished successfully to signal that the promise\
    \ is resolved or the `reject()` function to indicate that the operation has failed.\n\
    \nHere’s an example using the old `XMLHttpRequest` browser API:\n\n```javascript\n\
    // Browser example\nfunction requestURL ( url ) {\n    return new Promise (( resolve\
    \ , reject ) => {\n        const xhr = new XMLHttpRequest ();\n        // assign\
    \ event handlers\n        xhr .addEventListener ( “load” , () => {\n         \
    \   resolve ({\n                status : xhr .status ,\n                text :\
    \ xhr . responseText\n            });\n        });\n        xhr . addEventListener\
    \ ( “error” , error => {\n            reject ( error );\n        });\n       \
    \ // send the request\n        xhr .open ( “get” , url );\n        xhr . send\
    \ ();\n    });\n}\n\nconst promise = requestURL ( “books.json” );\n\n// listen\
    \ for both fulfillment and rejection\npromise .then ( response => {\n    // fulfillment\n\
    \    console .log ( response .status );\n    console .log ( response .text );\n\
    }, reason => {\n    // rejection\n    console .error ( reason .message );\n});\n\
    ```\n\nIn this example, the `XMLHttpRequest` call is wrapped in a promise. The\
    \ `load` event indicates when a request has completed successfully, and so the\
    \ promise `executor` calls `resolve()` in the event handler. Similarly, the `error`\
    \ event indicates when the request couldn’t be completed and so `reject()` is\
    \ called in that event handler. You can follow this same process (using `resolve()`\
    \ and `reject()` in event handlers) for converting event-based functionality into\
    \ promise-based functionality.\n\nOne important aspect of `executors` is that\
    \ they run immediately upon creation of the promise. In the previous example,\
    \ the `xhr` object is created, event handlers assigned, and the call initiated\
    \ before the promise is returned from `requestURL()`. When either `resolve()`\
