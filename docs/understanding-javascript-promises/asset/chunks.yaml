    4 promise . then ( response => { 5     console . log ( response . status ); 6
    7     // now add another 8     promise . then ( response => { 9         console
    . log ( response . statusText ); 10     }); 11 });


    In this code, the fulfillment handler adds another fulfillment handler to the
    same promise. The promise is already fulfilled at this point, so the new fulfillment
    handler is added to the microtask queue and called when ready. Rejection and settlement
    handlers work the same way.


    Handlers and Microtasks


    JavaScript executed in the regular flow of a program is executed as a task , which
    is to say that the JavaScript runtime has created a new execution context and
    executes the code completely, exiting when finished. As an example, an onclick
    handler for a button in a web page is executed as a task. When the button is clicked,
    a new task is created and the onclick handler is executed. Once complete, the
    JavaScript runtime waits for the next interaction to execute more code. Promise
    handlers, however, are executed in a different way.


    All promise handlers, whether fulfillment, rejection, or settlement, are executed
    as microtasks inside of the JavaScript engine. Microtasks are queued and then
    executed immediately after the currently running task has completed, before the
    JavaScript runtime becomes idle. Calling then() , catch() , or finally() tells
    a promise to queue the specified microtasks once the promise is settled.


    This is different than creating timers using setTimeout() or setInterval() , both
    of which create new tasks to be executed at a later point in time. Queued promise
    handlers will always execute before timers that are queued in the same task. You
    can test this for yourself by using the global queueMicrotask() function, which
    is used to create microtasks outside of promises:


    1 setTimeout (() => { 2     console . log ( “timer” ); 3 4     queueMicrotask
    (() => { 5         console . log ( “microtask in timer” ); 6     }); 7 8 }, 0
    ); 9 10 queueMicrotask (() => { 11     console . log ( “microtask” ); 12 });


    In this code, a timer is created with a delay of 0 milliseconds, and inside of
    that timer a new microtask is created. Also, a microtask is created outside of
    the timer. When this code executes, you will see the following output to the console:


    1 microtask 2 timer 3 microtask in timer


    Even though the timer is set for a delay of 0 milliseconds, the microtask executes
    first, followed by the timer, followed by the microtask inside of the timer.


    The most important thing to remember about microtasks, including all promise handlers,
    is that they are executed as soon as possible once a task is complete. This minimizes
    the amount of time between a promise settling and the reaction to the settling,
    making promises suitable for situations where runtime performance is important.


    Creating New (Unsettled) Promises


    New promises are created using the Promise constructor. This constructor accepts
    a single argument: a function called the executor , which contains the code to
    initialize the promise. The executor is passed two functions named resolve() and
    reject() as arguments. You call the resolve() function when the executor has finished
    successfully to signal that the promise is resolved or the reject() function to
    indicate that the operation has failed.


    Here’s an example using the old XMLHttpRequest browser API:


    1 // Browser example 2 3 function requestURL ( url ) { 4     return new Promise
    (( resolve , reject ) => { 5 6         const xhr = new XMLHttpRequest (); 7 8
            // assign event handlers 9         xhr . addEventListener ( “load” , ()
    => { 10             resolve ({ 11                 status : xhr . status , 12  
                  text : xhr . responseText 13             }); 14         }); 15 16
            xhr . addEventListener ( “error” , error => { 17             reject (
    error ); 18         }); 19 20         // send the request 21         xhr . open
    ( “get” , url ); 22         xhr . send (); 23     }); 24 } 25 26 const promise
    = requestURL ( “books.json” ); 27 28 // listen for both fulfillment and rejection
    29 promise . then ( response => { 30     // fulfillment 31     console . log (
    response . status ); 32     console . log ( response . text ); 33 }, reason =>
    { 34     // rejection 35     console . error ( reason . message ); 36 });


    In this example, the XMLHttpRequest call is wrapped in a promise. The load event
    indicates when a request has completed successfully, and so the promise executor
    calls resolve() in the event handler. Similarly, the error event indicates when
    the request couldn’t be completed and so reject() is called in that event handler.
    You can follow this same process (using resolve() and reject() in event handlers)
    for converting event-based functionality into promise-based functionality.


    One important aspect of executors is that they run immediately upon creation of
    the promise. In the previous example, the xhr object is created, event handlers
    assigned, and the call initiated before the promise is returned from requestURL()
    . When either resolve() or reject() is called inside the executor, then the promise’s
    state and value are immediately set, but all promise handlers (being microtasks)
    will not execute until the current script job completes. For example, consider
    what happens if you call resolve() immediately inside an executor, as in this
    code:


    1 const promise = new Promise (( resolve , reject ) => { 2     console . log (
    “Executor” ); 3     resolve ( 42 ); 4 }); 5 6 promise . then ( result => { 7  
      console . log ( result ); 8 }); 9 10 console . log ( “Hi!” );


    Here, the promise is resolved immediately without any delay, and then a fulfillment
    handler is added using then() to output the result. Even though the promise is
    already resolved when the fulfillment handler is added, the output will be as
    follows:


    1 Executor 2 Hi ! 3 42


    The executor is run first, outputting “Executor” to the console. Next, the fulfillment
    handler is assigned but is not executed immediately. Instead, a new microtask
    is created to run after the current script job. That means console.log(“Hi!”)
    executes before the fulfillment handler, which outputs 42 after the rest of the
    script has completed.


    A promise can only be resolved once, so if you call resolve() more than once inside
    of an executor, every call after the first is ignored.


    Executor Errors


    If an error is thrown inside an executor, then the promise’s rejection handler
    is called. For example:


    1 const promise = new Promise (( resolve , reject ) => { 2     throw new Error
    ( “Uh oh!” ); 3 }); 4 5 promise . catch ( reason => { 6     console . log ( reason
    . message );     // “Uh oh!” 7 });


    In this code, the executor intentionally throws an error. There is an implicit
    try-catch inside every executor so that the error is caught and then passed to
    the rejection handler. The previous example is equivalent to:


    1 const promise = new Promise (( resolve , reject ) => { 2     try { 3        
    throw new Error ( “Uh oh!” ); 4     } catch ( ex ) { 5         reject ( ex );
    6     } 7 }); 8 9 promise . catch ( reason => { 10     console . log ( reason
    . message );     // “Uh oh!” 11 });


    The executor handles catching any thrown errors to simplify this common use case,
    and just like other rejections, the JavaScript engine throws an error and stops
    execution if no rejection handler is assigned.


    Creating Settled Promises


    The Promise constructor is the best way to create unsettled promises due to the
    dynamic nature of what the promise executor does. But if you want a promise to
    represent a previously computed value, then it doesn’t make sense to create an
    executor that simply passes a value to the resolve() or reject() function. Instead,
    there are two methods that create settled promises given a specific value.


    Using Promise.resolve()'
