    \nNicholas C. Zakas\n\n© 2020 - 2022 Nicholas C. Zakas\n\nEPUB 版本 ISBN: 978-1-6781-2066-5\n\
    \n## 目录\n\n- 介绍\n- 关于本书\n- 感谢\n- 关于作者\n- 免责声明\n- 1. Promise 基础\n    - Promise\
    \ 的生命周期\n    - 创建新的（未定型）Promise\n    - 创建已定型 Promise\n    - 总结\n- 2. Promise 链式调用\n\
    \    - 捕获错误\n    - 在 Promise 链中使用 `finally()`\n    - 在 Promise 链中返回结果\n    - 在\
    \ Promise 链中返回 Promise\n    - 总结\n- 3. 多个 Promise Promise\n    - `Promise.all()`\
    \ 方法\n    - `Promise.allSettled()` 方法\n    - `Promise.any()` 方法\n    - `Promise.race()`\
    \ 方法\n    - 总结\n- 4. 异步函数与 await 表达式\n    - 定义异步函数\n    - 异步函数的不同之处\n    - 总结\n\
    - 5. 未处理拒绝拒绝的跟踪\n    - 检测未处理的拒绝\n    - Web 浏览器未处理拒绝的跟踪\n    - Node.js 未处理拒绝的跟踪\n\
    \    - 总结\n- 结语\n- 下载额外资源\n- 支持作者\n- 帮助与支持\n- 关注作者\n- 笔记\n\n## 介绍\n\nJavaScript\
    \ 最强大的方面之一是能够轻松处理异步编程。作为一种为 Web 创建的语言，JavaScript 从一开始就需要响应点击和按键等用户交互，因此产生了如 `onclick`\
    \ 等事件处理器。事件处理器允许开发者指定一个函数在未来的某个时刻执行，以响应事件。\n\nNode.js 通过在使用事件的同时使用回调函数进一步普及了 JavaScript\
    \ 中的异步编程。随着越来越多的程序开始使用异步编程，事件和回调已不足以支持开发者想要的所有操作。Promise 就是解决这个问题的方案。\n\nPromise\
    \ 是异步编程的另一种选择，它们的工作方式类似于其他语言中的 futures（未来）和 deferreds（延迟）。Promise 指定一段稍后执行的代码（就像事件和回调一样），并显式地指示代码执行是否成功或失败。你可以根据成功或失败将\
    \ Promise 链在一起，使得你的代码更容易于理解和调试。\n\n## 关于本书\n\n本书的目标是解释 JavaScript Promise 的工作原理，同时提供何时使用它们的实际示例。今后所有新的异步\
    \ JavaScript API 都将基于 Promise 构建，因此 Promise 是理解整个 JavaScript 的核心概念。我希望这本书能为你提供在项目成功成功使用\
    \ Promise 所需的信息。\n\n### 浏览器、Node.js 和 Deno 兼容性\n\n你可能会使用多种 JavaScript 运行时，例如 Web\
    \ 浏览器、Node.js 和 Deno。本书并不尝试解决这些 JavaScript 运行时之间的差异，除非这些差异大到足以令人困惑。通常情况下，本书关注\
    \ `ECMA-262` 中描述的 Promise，只有当 JavaScript 运行时之间存在实质性差异时，才会讨论它们的区别。因此，你的 JavaScript\
    \ 运行时可能不符合书中描述的基于标准的行为。\n\n### 本书的读者群体\n\n本书旨在为已经熟悉 JavaScript 的读者提供指南。特别是，本书针对在\
    \ Web 浏览器、Node.js 或 Deno 中工作，并想要学习 Promise 如何工作的中中高级 JavaScript 开发者。\n\n本书不适合从未写过\
    \ JavaScript 的初学者。你将对该语言有良好的基础理解才能使用本书。\n\n### 概述\n\n本书的五个章节每一章都涵盖了 JavaScript\
    \ Promise 的不同方面。许多章节涉及 Promise API，每个章节都在前一章节的基础上构建，允许你逐步建立知识。所有章节都包含代码示例，帮助你学习新的语法和概念。\n\
    \n- **第 1 章：Promise 基础** 介绍了 Promise 的概念、工作原理以及创建和使用它们的不同方法。\n- **第 2 章：Promise\
    \ 链式调用** 讨论了将多个 Promise 链在一起的各种方法，使组合异步操作更容易。\n- **第 3 章：多个 Promise** 解释了旨在监控和响应并行执行多个\
    \ Promise 的内置 JavaScript 方法。\n- **第 4 章：异步函数与 await 表达式** 介绍了异步函数和 await 表达式的概念，并解释了它们如何关联\
    \ Promise 以及如何使用 Promise。\n- **第 5 章：未处理拒绝跟踪** 解释了如何正确跟踪在没有拒绝处理器的情况下 Promise 被拒绝的情况。\n\
    \n## 使用的规范\n\n本书使用了以下排版规范：\n\n- *斜体* 新术语\n- 等宽字体表示代码或文件名\n- 所有的 JavaScript 代码示例均以模块（也称为\
    \ ECMAScript 模块或 ESM）的形式编写\n\n此外，较长的代码示例包含在等宽代码块中，例如：\n\n```javascript\nfunction\
    \ doSomething () {\n    // empty\n}\n```\n\n在代码块中，`console.log()` 语句右侧的注释表示执行代码时你在浏览器或\
    \ Node.js 控制台中看到的输出。例如：\n\n```javascript\nconsole.log(\"Hi\"); // \"Hi\"\n```\n\
    \n如果代码块中的某行代码抛出错误，也会在代码右侧指示：\n\n```javascript\ndoSomething(); // error!\n```\n\
    \n## 帮助与支持\n\n如果你阅读本书时有问题，请向我的邮件列表发送消息：`books@humanwhocodes.com`。请务必在邮件主题中注明书名。\n\
    \n## 感谢\n\n感谢父亲 Speros Zakas 对本书进行校对，感谢 Rob Friesel 的技术编辑。你们都让这本书变得好得多。\n\n感谢所有评审早期版本并提供反馈的人：Mike\
    \ Sherov、David Hund、Murat Corlu 和 Chris Ferdandi。\n\n## 关于作者\n\nNicholas C. Zakas\
    \ 是一名独立的软件工程师、顾问和教练。他是 ESLint 开源项目的创建者，并在 ESLint 技术指导委员会任。Nicholas 与公司和个人合作改进软件工程流程，并帮助技术领导成长和成功。他还编写或贡献了十多本关于\
    \ JavaScript 和 Web 开发的书。你可以在 `https://humanwhocodes.com` 和 Twitter @slick 上找到\
    \ Nicholas。\n\n## 免责声明\n\n虽然出版商和作者尽力确保书中包含的信息和指令准确，但他们不对错误或遗漏承担责任，包括限于对使用或依赖本书所造成的损害的责任。使用书中的信息和指令自自。如果书中包含或描述的任何代码示例或其他技术受开源许可或其他知识产权限制，你有责任确保你的使用符合此类许可和或权利。\n\
    \n## 1. Promise 基础\n\n虽然 Promise 通常与异步操作相关联，但它们仅仅是值的占位符。值可能已知，或者更常见的是，值可能是异步操作的结果。与订阅事件或向函数传递回调不同，函数可以返回一个\
    \ Promise，如下：\n\n```javascript\n// fetch() 承诺在未来的某个时刻完成\nconst promise = fetch(\"\
    books.json\");\n```\n\n"
- fmt: "\nThe `fetch()` function is a common utility function in JavaScript runtimes\
    \ that makes network requests. The call to `fetch()` doesn’t actually complete\
    \ a network request immediately; that will happen later. Instead, the function\
    \ returns a promise object (stored in the `promise` variable in this example,\
    \ but you can name it whatever you want) representing the asynchronous operation\
    \ so you can work with it in the future. Exactly when you’ll be able to work with\
    \ that result depends entirely on how the promise’s lifecycle plays out.\n\n##\
    \ The Promise Lifecycle\n\nEach promise goes through a short lifecycle starting\
    \ in the `pending` state, which indicates that promise hasn’t completed yet. A\
    \ `pending` promise is considered unsettled .. The promise in the previous example\
    \ is in the `pending` state as soon as the `fetch()` function returns it. Once\
    \ the promise completes, the promise is considered settled and enters one of two\
    \ possible states (see Figure 1-1):\n\n- **Fulfilled**: The promise has completed\
    \ successfully.\n- **Rejected**: The promise didn’t complete successfully due\
    \ to either an error or some other cause.\n\n![](media/file1.png)\n\nFigure 1-1:\
    \ Promise states\n\nAn internal `[[PromiseState]]` property is set to `\"pending\"\
    `, `\"fulfilled\"`, or `\"rejected\"` to reflect the promise’s state. This property\
    \ isn’t exposed on promise objects, so you can’t determine which state the promise\
    \ is in programmatically. But you can take a specific action when a promise changes\
    \ state by using the `then()` method.\n\n## Assigning Handlers with then()\n\n\
    The `then()` method is present on all promises and takes two arguments. The first\
    \ argument is a function to call when the promise is fulfilled, called the `fulfillment\
    \ handler`. Any additional data related to the asynchronous operation is passed\
    \ to this function. The second argument is a function to call when the promise\
    \ is rejected, called the `rejection handler`. Similar to the fulfillment handler,\
    \ the rejection handler is passed any additional data related to the rejection.\n\
    \nAny object that implements the `then()` method in this way is called a `thenable`.\
    \ All promises are thenables, but not all thenables are promises.\n\nBoth arguments\
    \ to `then()` are optional, so you can listen for any combination of fulfillment\
    \ and rejection. For example, consider this set of `then()` calls:\n\n```javascript\n\
    const promise = fetch ( “books.json” );\n// add a fulfillment and rejection handler\n\
    promise .then ( response => {\n    // fulfillment\n    console .log ( response\
    \ . status );\n}, reason => {\n    // rejection\n    console .error ( reason .\
    \ message );\n});\n\n// add another fulfillment handler\npromise .then ( response\
    \ => {\n    // fulfillment\n    console .log ( response . statusText );\n});\n\
    \n// add another rejection handler\npromise .then ( null , reason => {\n    //\
    \ rejection\n    console .error ( reason . message );\n});\n```\n\nAll three `then()`\
    \ calls operate on the same promise. The first call assigns both a fulfillment\
