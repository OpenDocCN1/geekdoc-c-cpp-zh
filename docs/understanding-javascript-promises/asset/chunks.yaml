    \ 的成功处理函数。你可以通过在成功处理函数中指定返回值继续在链中传递数据。例如：\n\n```javascript\nconst promise = Promise\
    \ . resolve ( 42 ); \npromise . then ( value => { \n    console . log ( value\
    \ );         // 42\n    return value + 1 ; \n}). then ( value => { \n    console\
