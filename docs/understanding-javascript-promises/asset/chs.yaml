- "# JavaScript Promises 入门指南\n\n\n\n\n\n\n\n\n## 目录\n\n- 介绍\n- 关于本书\n- 感谢\n- 关于作者\n\
  - 免责声明\n- 1. Promise 基础\n    - Promise 的生命周期\n    - 创建新的（未定型）Promise\n    - 创建已定型\
  \ Promise\n    - 总结\n- 2. Promise 链式调用\n    - 捕获错误\n    - 在 Promise 链中使用 `finally()`\n\
  \    - 在 Promise 链中返回结果\n    - 在 Promise 链中返回 Promise\n    - 总结\n- 3. 多个 Promise\
  \ Promise\n    - `Promise.all()` 方法\n    - `Promise.allSettled()` 方法\n    - `Promise.any()`\
  \ 方法\n    - `Promise.race()` 方法\n    - 总结\n- 4. 异步函数与 await 表达式\n    - 定义异步函数\n\
  \    - 异步函数的不同之处\n    - 总结\n- 5. 未处理拒绝拒绝的跟踪\n    - 检测未处理的拒绝\n    - Web 浏览器未处理拒绝的跟踪\n\
  \    - Node.js 未处理拒绝的跟踪\n    - 总结\n- 结语\n- 下载额外资源\n- 支持作者\n- 帮助与支持\n- 关注作者\n- 笔记\n\
  \n## 介绍\n\nJavaScript 最强大的方面之一是能够轻松处理异步编程。作为一种为 Web 创建的语言，JavaScript 从一开始就需要响应点击和按键等用户交互，因此产生了如\
  \ `onclick` 等事件处理器。事件处理器允许开发者指定一个函数在未来的某个时刻执行，以响应事件。\n\nNode.js 通过在使用事件的同时使用回调函数进一步普及了\
  \ JavaScript 中的异步编程。随着越来越多的程序开始使用异步编程，事件和回调已不足以支持开发者想要的所有操作。Promise 就是解决这个问题的方案。\n\
  \nPromise 是异步编程的另一种选择，它们的工作方式类似于其他语言中的 futures（未来）和 deferreds（延迟）。Promise 指定一段稍后执行的代码（就像事件和回调一样），并显式地指示代码执行是否成功或失败。你可以根据成功或失败将\
  \ Promise 链在一起，使得你的代码更容易于理解和调试。\n\n## 关于本书\n\n本书的目标是解释 JavaScript Promise 的工作原理，同时提供何时使用它们的实际示例。今后所有新的异步\
  \ JavaScript API 都将基于 Promise 构建，因此 Promise 是理解整个 JavaScript 的核心概念。我希望这本书能为你提供在项目成功成功使用\
  \ Promise 所需的信息。\n\n### 浏览器、Node.js 和 Deno 兼容性\n\n你可能会使用多种 JavaScript 运行时，例如 Web\
  \ 浏览器、Node.js 和 Deno。本书并不尝试解决这些 JavaScript 运行时之间的差异，除非这些差异大到足以令人困惑。通常情况下，本书关注 `ECMA-262`\
  \ 中描述的 Promise，只有当 JavaScript 运行时之间存在实质性差异时，才会讨论它们的区别。因此，你的 JavaScript 运行时可能不符合书中描述的基于标准的行为。\n\
  \n### 本书的读者群体\n\n本书旨在为已经熟悉 JavaScript 的读者提供指南。特别是，本书针对在 Web 浏览器、Node.js 或 Deno 中工作，并想要学习\
  \ Promise 如何工作的中中高级 JavaScript 开发者。\n\n本书不适合从未写过 JavaScript 的初学者。你将对该语言有良好的基础理解才能使用本书。\n\
  \n### 概述\n\n本书的五个章节每一章都涵盖了 JavaScript Promise 的不同方面。许多章节涉及 Promise API，每个章节都在前一章节的基础上构建，允许你逐步建立知识。所有章节都包含代码示例，帮助你学习新的语法和概念。\n\
  \n- **第 1 章：Promise 基础** 介绍了 Promise 的概念、工作原理以及创建和使用它们的不同方法。\n- **第 2 章：Promise\
  \ 链式调用** 讨论了将多个 Promise 链在一起的各种方法，使组合异步操作更容易。\n- **第 3 章：多个 Promise** 解释了旨在监控和响应并行执行多个\
  \ Promise 的内置 JavaScript 方法。\n- **第 4 章：异步函数与 await 表达式** 介绍了异步函数和 await 表达式的概念，并解释了它们如何关联\
  \ Promise 以及如何使用 Promise。\n- **第 5 章：未处理拒绝跟踪** 解释了如何正确跟踪在没有拒绝处理器的情况下 Promise 被拒绝的情况。\n\
  \n## 使用的规范\n\n本书使用了以下排版规范：\n\n- *斜体* 新术语\n- 等宽字体表示代码或文件名\n- 所有的 JavaScript 代码示例均以模块（也称为\
  \ ECMAScript 模块或 ESM）的形式编写\n\n此外，较长的代码示例包含在等宽代码块中，例如：\n\n```javascript\nfunction\
  \ doSomething () {\n    // empty\n}\n```\n\n在代码块中，`console.log()` 语句右侧的注释表示执行代码时你在浏览器或\
  \ Node.js 控制台中看到的输出。例如：\n\n```javascript\nconsole.log(\"Hi\"); // \"Hi\"\n```\n\n\
  如果代码块中的某行代码抛出错误，也会在代码右侧指示：\n\n```javascript\ndoSomething(); // error!\n```\n\n##\
