  \n# 约定\n\n你会注意到书中到处都有特殊的框，用来引导和支持你。以下是它们的样式：\n\n你会在书中发现两组侧边栏。“挑战”侧边栏（Challenge sidebars）在你想进一步推进项目时提供了可以接受的额外任务，也许通过更改或添加新功能。“深入代码”侧边栏（Digging\
  \ into the Code sidebars）会以更详细的方式解释程序中的某些概念或特性，让你对 Python 编程语言有更好的理解。这些侧边栏意味着你可以先专注于让程序运行，等程序运行起来后，再详细阅读关于它们如何工作以及你如何进一步扩展它们的方法。\n\
  \n当你使用代码遵循我们的步骤或指令时，你应该完全按照我们在指令中描述的那样输入代码。Python 是一门语言，行首的空格数量（缩进）对程序的含义至关重要，因此请格外注意确保在每行的左侧留出足够的空格。我们为代码列表框涂了颜色，以便你更容易看到每行需要多少个空格。\n\
  \n```\nprint(\"Welcome to Adventures in Minecraft by Martin O'Hanlon and David Whale\"\
  )\n```\n\n\n\n\nPython 编程语言带有一个名为 `IDLE` 的代码编辑器，你将用它在这些冒险中创建、编辑和运行编写的程序。\n\n当计算机程序员学习一种新的编程语言或处理某事的方法时，他们总是从编写一个“hello\
  \ world”程序开始。这是一个非常简单的程序，会在屏幕上显示“hello world”，以确保所有内容都已安装并正常运行。\n\n在第一次冒险中，你将配置电脑，允许编写一个程序，在\
  \ Minecraft 聊天框中显示“Hello Minecraft World”文本（参见图 1-1）。\n\n![image](img/9781119439585-fg0101.png)\n\
  \n图 1-1 Hello Minecraft World\n\n要完成书中 Minecraft 编程，你需要以下三种类型的电脑之一：运行 Microsoft\
  \ Windows 的 PC；运行 macOS X 的 Apple Mac；或者运行带有 Pixel 的 Raspbian 的 Raspberry Pi。你配置电脑的方法取决于你拥有哪种电脑，但一旦配置好，你在所有电脑上以完全相同的方式进行\
  \ Minecraft 程序。为了方便你配置电脑，你可以从 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 下载启动套件。这些启动套件经过了测试，以确保书中所有的冒险都能正常运行。\n\n你会发现你的启动套件中包含一个 `README` 文件，你应该查看一下。它描述了套件包含的内容以及它是如何创建的；你可以使用这些信息从零开始配置自己的电脑，尽管不建议这样做。通过遵循书中的说明，你将获得更多收获。\n\
  \n请确保你遵循适用于你类型电脑的说明，即“配置你的 Raspberry Pi 以进行 Minecraft 程序”或“配置你的 PC 或 Apple Mac 以进行\
  \ Minecraft ”。\n\n# 配置 Raspberry Pi 进行 Minecraft 编程\n\n如果你正在使用 Raspberry Pi，它已经安装了\
  \ Minecraft；你只需要下载 Raspberry Pi 启动套件即可。完成《Minecraft 冒险之旅》所需的所有内容都在一个名为 `MyAdventures`\
  \ 的文件夹中。你也将把 Minecraft 程序保存在此文件夹中。\n\nRaspberry Pi 的图形用户界面（GUI）被称为 Pixel，在整个《Minecraft\
  \ 冒险之旅》中使用。该 GUI 安装在 Raspbian 上，但取决于你如何配置 Raspberry Pi，它在启动时可能不会加载 GUI。相反，你可能会从登录和命令提示符开始。\n\
  \n如果你的 Raspberry Pi 配置为从命令提示符启动，你需要在登录，并在命令提示符出现后输入 `startx` 然后按回车来加载 GUI。\n\n##\
  \ 下载启动套件\n\n一旦你的 Raspberry Pi 启动并进入了 GUI，你可以按照以下步骤下载 Raspberry Pi 启动套件：\n\n1.  打开终端，点击菜单（左上角的\
  \ Raspberry Pi 图标）  杂项 终端。\n\n2.  输入以下命令并将目录更改到桌面（参见图 1-2）并按回车：\n\n    ```bash\n\
  \    cd ~\n    cd Desktop\n    ```\n\n3.  输入以下命令并按回车下载启动套件：\n\n    ```bash\n   \
  \ git clone https://github.com/AdventuresInMinecraft/AdventuresInMinecraft-Pi\n\
  \    ```\n\n![image](img/9781119439585-fg0102.png)\n\n图 1-2 下载 Raspberry Pi 启动套件。\n\
  \n访问 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)，因为未来可能会更新并提供帮助。\n\
  \n## 在你的 Raspberry Pi 上启动 Minecraft\n\n下载启动套件后，你可以在开始创建第一个程序之前运行游戏并尝试。\n\n要启动 Minecraft，请遵循以下步骤：\n\
  \n1.  选择菜单  游戏  Minecraft Pi。\n2.  通过选择开始游戏  新建来开启新世界。\n3.  好了！现在你可以开始玩 Minecraft\
  \ 了。\n\n![image](img/9781119439585-fg0103.png)\n\n图 1-3 启动 Minecraft 并创建一个新世界。\n\
  \n主菜单有两个选项：开始游戏（用于构建新世界或进入现有 Minecraft 世界）以及加入游戏（加入另一个玩家的世界）（参见图 1-3）。\n\n一旦你的 Raspberry\
  \ Pi 配置好并运行了 Minecraft，你可以跳过下一节。\n\n# 配置你的 PC 或 Apple Mac 进行 Minecraft 编程\n\n无论你使用的是\
