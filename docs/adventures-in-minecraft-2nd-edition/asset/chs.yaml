- "# Minecraft 冒险之旅（第2版）\n\n\n\n![](img/cover.jpg)\n\n# 前言\n\n我是一名老师，我的主要兴趣是学生的学习情况和参与度。当我使用\
  \ Minecraft 来教授编程时（我的主要使用场景是 Raspberry Jam 活动和课堂，用于帮助学生学习 `Python` 编程），我的学生参与度比我使用其他技术时要高得多。当教学计划转向理论或其他编程任务时，学生们经常会说：“老师，我们什么时候能再次用\
  \ Minecraft 编程呀？”简单来说，Minecraft 植根于孩子们的大脑中，而编程技术也扎得更深。\n\nMinecraft 拥有一种我以前从未见过的、吸引学生参与的能力。Minecraft\
  \ 的简单性对所有孩子都具有通用的吸引力，就像积木一样。当孩子们在 Minecraft 的引导下——在教室、图书馆或创客空间环境中——接触新技能时，这种吸引力依然存在。由于学生保持投入并对学习新技能产生兴趣，在教室里使用\
  \ Minecraft 对教师和学生来说都是非常有回报的。\n\n我相信 Minecraft 作为有效教学工具的原因之一是因为它提供了即时的视觉反馈，无论是房屋的形式、3D\
  \ 乌龟形状、整个城镇，还是国际空间站追踪器。毕竟，Minecraft 是一个沙盒，这意味着你用它 实现的任何事情都没有限制——即使在树莓派上的精简版也是如此。\n\
  \n学生在 Minecraft 中创作的作品是极佳的参考材料——这有助于标记概念性学习，并成为他们极好的复习辅助。例如，我经常提到二维数组，通过提醒学生其中一节课，当时我们创建了\
  \ 32 x 32 的随机区块墙。\n\n在我位于英国诺西威克斯郡的学校里，我们有 10 本《Minecraft 冒险》（Adventures in Minecraft），我们用它来帮助学生在接触简单的工作表类型活动后，独立完成项目。例如，我们可能会完成一项任务，如在玩家行走时掉落彩虹，然后学生就可以独立地使用这本书来建造房屋或制作小游戏。这本书的妙之处在于，书中的冒险可以分段阅读，也可以通读全程。你可以对它们进行重新组合并向不同的方向发展。我发现，我自己创建的大多数资源都源于\
  \ David 或 Martin 的初始想法或代码。这本书激发了各个年龄段的人参与计算机编程。从本质上说，它提供了一个老师、父母以及最重要的孩子们可以在其中构建的平台。\n\
  \n它认为学习仅局限于教室是天真的。像 CodeClub、Coderdojo 和 Raspberry Jams 等活动是全球范围内使用 Minecraft 进行编程的活跃社区。在家中的家庭或独立学习的学生也在学习编程。这本书在每种场景下都具有意义。\n\
  \n我曾听过 Martin 描述这本书为“潜移默化的学习”。我认为这就是核心所在；你用代码编写酷的东西，并在过程中学习如何迭代、使用文件处理、使用条件语句以及更多。学生和孩子们在学习编程的同时，享受乐趣，并不断受到挑战，致力于解决问题。\n\
  \n在本书的新版本中，Martin 和 David 增加了 BBC micro:bit 冒险，这引入了更多的物理计算。在过去的几年里，BBC micro:bit\
  \ 帮助让全球儿童接触到了计算科学。通过增加 BBC micro:bit 章节，Martin 和 David 再次帮助降低了孩子、老师和父母让想象飞行的障碍。\n\
  \n祝你们在 Minecraft 的冒险中好运！\n\n–Chris Penn，IT/CS 老师，英国沃西克斯克斯郡 Nicholas Chamberlaine\
  \ 学校\n\n其他读者对《Minecraft 冒险》有极高的评价：\n\n“绝对的救救星！我每天都用它，David 和 Martin 是了不起的资源！”\n\n\
  –Bob，教育工作者，美国\n\n“我们在 8 年级的计算机科学课程中使用了书中的章节，并在 Hull Raspberry Jam 经常使用它。”\n\n–Jon，教育工作者及\
  \ Raspberry Jam 组织者，英国赫尔\n\n“这是一本超级棒的书，充满了介绍 `Python` 原理和 3D CAD 的精彩方法。”\n\n–Frank，英国\
  \ Raspberry Jam 组织者，英国伦敦\n\n“在我参加的每一个活动中我都会向父母推荐这本书，甚至在中国。这是我编程之旅的起点！”\n\n–Gemma，参与性艺术家，英国曼彻斯特\n\
  \n“它对 Leeds Raspberry Jam 的个人和双人挑战非常有帮助，包括家庭活动。它为更多项目提供了启发性的灵感。”\n\n–Claire，教育工作者及\
  \ Raspberry Jam 组织者，英国利兹\n\n“无价之宝。黑池 Raspberry Jam 的孩子们非常喜欢它！”\n\n–Les，教育培训师及 Raspberry\
  \ Jam 组织者，英国布拉克普尔\n\n# 引言\n\n你是一个冒险者吗？你喜欢尝试新事物和学习新技能吗？你是 Minecraft 的忠实粉丝吗？你不想通过学习编写与你的游戏交互的计算机程序（mods），并用你的创意和魔法让你的朋友们惊叹吗？如果答案是肯定的“是的！”，那么这本书适合你。\n\
  \n# 什么是 Minecraft？\n\nMinecraft 是一个沙盒独立游戏，在其中你建造结构、收集物品、开采矿石并战斗怪物以生存。它在你看来是一个由不同类型的区块组成的\
  \ 3D 虚拟世界，每个区块在 3D 虚拟世界的网格布局中都有自己的位置。图 1 显示了 Minecraft 世界的一个示例。\n\n![image](img/9781119439585-fgunin01.png)\n\
  \n图 1 Minecraft 世界\n\n## 虚拟世界\n\n在沙盒游戏中，你是一个虚拟世界中的玩家（就像一个装满了沙子的沙盘）。你不是按照预设顺序提供关卡，而是在虚拟世界中漫游，并对你想实现的目标以及如何实现它们做出自己的选择。因为从一开始就开始做出自己的选择，沙盒游戏具有无限可能。你编写自己的故事并穿于\
  \ 3D 世界，通过偶然发现和实验来学习新的技能和功能。\n\nMinecraft 是如何产生的？\n\n\n\n\n\n独立游戏是“独立视频游戏”，由个人或小团队创建。它们通常在没有游戏发行商任何资金或支持的情况下开发。由于其独立性，独立游戏通常比其他更主流的游戏更具创新性。根据维基百科，Minecraft\
  \ 是由瑞典计算机程序员马库斯·佩森（Markus Persson）创建的，他的游戏网 ID 为“Notch”。他在 2009 年首次展示了 Minecraft\
  \ 的早期版本，该游戏于 2011 年首次正式发布。Notch 创立了一家名为 `Mojang AB` 的瑞典公司，该公司继续在许多计算机平台上开发 Minecraft\
  \ 游戏，包括 PC、Mac、树莓派、Linux、iOS、Android、Xbox 360、Playstation 还有 Wii。\n\n你可以在一部名为 `Minecraft:\
  \ The Story of Mojang` 的纪录片中了解更多关于 Minecraft 迷人的故事（[`http://en.wikipedia.org/wiki/Minecraft:_The_Story_of_Mojang`](http://en.wikipedia.org/wiki/Minecraft:_The_Story_of_Mojang)）。\n\
  \n# 什么是 Minecraft 编程？\n\n这是一本关于计算机编程的书——它将 Minecraft 作为教你计算机编程的方法。如果你正在寻找关于如何建造结构和进行战斗的实用技巧，市场上还有其他一些很棒的书列在附录\
  \ A 中，它们将对你有所帮助。\n\n通过编程 Minecraft，你可以让你的游戏体验变得更加有趣、富有创意且个性化。当你玩普通游戏时，你遵循游戏设计者设定的\
  \ Minecraft 游戏基本规则。通过编写与 Minecraft 游戏世界交互的程序，你可以自动完成复杂且重复的任务——例如自动建造巨大的房屋街道和大型结构。你可以让游戏及其内部的物体以新的方式运行，你还可以发明甚至游戏原始创作者都没有想过的新事物。但最重要的是，你将学习一种通用技能——如何使用\
  \ `Python` 编程语言进行编程。然后你就可以将此技能应用于 Minecraft 之外的所有其他事情。图 2 显示了一条由简短 `Python` 程序自动建造的巨大房屋街道。\n\
  \n![image](img/9781119439585-fgunin02.png)\n\nFIGURE 2 一条由 20 行 Python 程序建造的巨大房屋街道\n\
  \n在一个关于为什么所有孩子都应该学习编程的视频（[`www.youtube.com/watch?v=nKIu9yen5nc`](http://www.youtube.com/watch?v=nKIu9yen5nc)），Will.i.am\
  \ 被引用说的话：“伟大的程序员是今天的摇滚星”。你在跟随这本书中的冒险时学到的新技能将让你的 Minecraft 体验更加个性化、更有创意、更有野心。你编程的新魔术会让你的朋友和游戏玩家感到惊叹，并激励他们询问你使用了什么魔法来实现如此惊人的成就。答案，当然，是计算机编程的魔法。\n\
  \n# 谁应该读这本书？\n\n《Minecraft 冒险》适合任何喜欢玩 Minecraft 并想要学习编程以及以此实现更多可能的年轻人。《冒险》系列书籍针对\
  \ 11-15 岁的读者，但后期一些更具挑战性的冒险可能也适合年长较大的读者。早期的章节也针对年仅至 8 岁的读者进行了测试。\n\n你可能已经是一个游戏专家了，但发现自己因为建造新结构所需的时间而感到沮丧。或者你可能想找到方法通过向世界添加一些额外的智能和自动化来扩展游戏。无论你的原因是什么，这本书都将成为你\
  \ Minecraft 编程之旅的指南；正如每位冒险者所知的，你的指南书是你背包中最重要的物品。你的旅程将带你从简单的开始（例如在 Minecraft 聊天框中发送消息），到学习使用\
  \ `Python` 编程语言为 Minecraft 编程的基础知识，再到发现如何使用你新的计算机编程技能在 Minecraft 内部编写你自己的令人兴奋的游戏。在冒险结束时，你将学会成为一名\
  \ Minecraft 编程先驱所需的技能！\n\n# 你将学到什么\n\n你将学习 Minecraft 游戏的许多方面，以及如何通过 `Python` 编程语言与\
  \ Minecraft 特性交互。你将发现如何使用坐标在 3D 世界中对方块进行定位、如何感知玩家的位置、如何在 Minecraft 世界中创建和删除方块，以及如何感知方块被玩家击中。\n\
  \n你将学习如何在 `Python` 编程语言中编写程序，从简单的 `Hello Minecraft World` 程序，到创建并与巨大的 3D 物体交互，得益于你新的\
  \ `Python` 编程技能，你可以在这些物体上盖上自己的个性。如果你使用 PC 或 Mac，你还将学习如何设置和运行你自己的本地 Minecraft 服务器。\n\
  \n通过 `Python` 辅助代码的免费 `MinecraftStuff` 模块，你将能够增强利用区块、线条、多边形和文本创建 2D 和 3D 物体的能力。\n\
  \n你的冒险将不仅限于 Minecraft 的虚拟世界！我们将向你介绍将 Minecraft 连接到其他设备的方法，例如 `BBC micro:bit`，这让你的\
  \ Minecraft 世界能够感知并控制现实世界中的物体。因此，我们为你提供了一个宝贵的秘密：突破虚拟世界的边界！\n\n# 我们假设已知\n\n由于这是一本关于\
  \ Minecraft 编程的书，我们专注于学习编程，我们对你这位读者假设一些情况：\n\n1. 你有一台计算机（运行 Raspbian 的树莓派、运行 Windows\
  \ 的 PC 或运行 macOS 的 Apple Mac），它符合 Minecraft 的最低要求并已设置好可以运行。\n2. 你对如何使用计算机基础了解，例如使用键盘和鼠标、使用菜单系统启动程序以及使用`文件`、`新建`和`保存`等应用程序菜单。\n\
  3. 你有互联网连接，并知道如何使用浏览器下载文件。\n4. 如果你使用 PC 或 Mac，你已经拥有 Minecraft 用户 ID 并安装了可以运行的 Minecraft。\n\
  5. 你知道如何玩 Minecraft 游戏，例如如何启动、如何移动、如何在背包中选择物品以及如何在世界中创建和删除方块。\n\n由于这是一本关于 Minecraft\
  \ 编程的书，我们不假设你有任何先编程知识。随着冒险的进行，我们将引导你完成所需的步骤。\n\n# 项目所需的物品\n\n我们编写的这本书适用于三种常见的计算机：运行\
  \ Raspbian 的树莓派、运行 Windows 的 PC 以及运行 macOS 的 Apple Mac。Minecraft 也支持其他平台，例如运行各种\
  \ Linux 发行版的 PC，但我们没有在书中涵盖这些平台的设置。\n\n为了让各个部分的设置更简单，我们准备了三个启动套件，对应每个支持的计算机平台。你可以下载适用于你计算机的启动套件，并在第一个冒险中，我们将提供如何下载和安装这些并让一切正常运行的逐步说明。这些启动套件包含了除\
  \ Minecraft 本身所需的一切。\n\n\n\n\n\n在冒险 8 和冒险 9 中，我们将向你展示如何将 Minecraft 虚拟世界连接到现实世界。为此你需要购买一个\
  \ BBC micro:bit，这是一种小型手持式编程计算机，具有多种输入输出功能，可以与你的 Minecraft 游戏配合使用。我们在附录 A 中提供了购买\
  \ BBC micro:bit 的链接。\n\n在这段旅程中，你最重要的东西是你对 Minecraft 拥有的兴奋和热情，以及对自己的想法充满好奇心并愿意进行实验，不断突破你现有知识的边界！\n\
  \n# 给家长和老师的说明\n\n我们将本书分成了多个独立自成的冒险，你可以将它们视为独立的独立项目，每个项目都侧重于 Minecraft 编程的一个特定功能。`Python`\
  \ 语言在每个冒险中逐渐、渐进地引入；早期的冒险主要面向初学者，后期的冒险则更具挑战性，并引入更多 `Python` 内容，对读者的要求也更高。\n\n每个冒险都呈现了一个实践项目，并附有分步骤说明（读者可以在完成后进行勾选），这些说明以描述性的风格呈现，非常就像注释良好的程序列表。详细的解释出现在“深入代码”（`Digging\
  \ into the Code`）侧边栏中，学生可以以后再阅读，这意味着他们不会在输入和尝试程序的过程中被分散注意力。\n\n每个冒险可能需要超过一个节课的时间才能完成，但它们都被分成了若干章节，并在逻辑点设有小标题，这些小标题可以作为单节课的目标，或者作为一个跨越多个课时的活动。\n\
  \n`Python` 语言使用程序左侧的缩进表示代码结构，并且它是一种区分大小写的语言。对于非常年幼的读者，来自成人的额外指导有时很有用，以确保他们仔细地使用大小写和缩进，从而避免在程序中引入错误的可能性。所有程序都可以从伙伴网站下载，因此如果你在缩进上遇到问题，可以检查我们的程序版本，看看可能哪里出错了。\n\
  \n## 第二版的修改\n\n此第二版延续了第一版同样非常成功的风格和内容，并进行了一些细小的改进、错误修复以及替换了一个冒险：\n\n*   可下载的启动包已略微简化。PC、Mac\
  \ 和树莓派上的所有坐标现在都统一报告给 `Python` 程序为绝对坐标——即 Minecraft 内部的真实坐标（而不是像以前那样相对于生成点）。这使得在\
  \ Minecraft 中定位物体相关的数学计算对孩子们来说更容易理解了，尽管代价是它有时会报告一些很大的数字。现在屏幕上报告的坐标与你编写的 `Python`\
  \ 程序所报告的坐标相匹配。\n\n*   为了保持本书的时代性并与学校常用的内容保持一致，所有程序现在都是用最新版本的 `Python 3` 编写的，我们在冒险\
  \ 1 中建议读者下载该版本。你可能在我们程序中发现的区别是使用的是 `input()` 而不是 `raw_input()`（`Python 3` 在这方面与\
  \ `Python 2` 略有不同）。\n\n*   上一版本的冒险 5 已被替换为一个全新的冒险，读者在其中使用 BBC micro:bit 作为可编程的 Minecraft\
  \ 游戏控制器。新的冒险被移动到了书靠后的位置（到冒险 8），以便增加一些使用 BBC micro:bit 的 Minecraft 大型项目。BBC micro:bit\
  \ 在全球范围内可以通过许多零售商购买，包括直接现售的零售店。它提供了一个非常廉价的物理计算世界入口，可以与 Minecraft 一起使用；它本身也是一台完全可编程的计算机，我们希望你探索它作为独立计算平台所提供的许多功能。\n\
  \n*   Martin 的免费 `MinecraftStuff` 模块已经更新以简化了一些功能，这减少了在冒险 6、7 和 9 中输入程序所需的打字量，并包含一个新的功能的可能：Minecraft\
  \ 乌龟（Turtle）！这是 Minecraft 中一个完全可控制的区块，可以在三维空间移动，并让读者能够快速地绘制复杂的形状。它与教学大纲非常契合，课程经常使用可编程乌龟来引入编程概念。\n\
  \n## 本书的结构\n\n书的每一章都是一个独立的冒险，在你编写和测试项目时教你新的技能和概念。书的组织方式使得每个冒险都是一个独立项目，但你可能会发现按顺序完成它们会更容易，因为我们在整本书中逐渐加深你对编程概念的理解。\n\
  \n在做任何事情之前，先完成冒险 1 是至关重要的。因为它向你展示了如何下载和安装所有内容，以及如何确保其正常工作。在这个冒险中介绍了一些你在其他冒险中需要的基础步骤，但在早期的冒险中会提供提醒。\n\
  \n前三个冒险是为几乎或没有编程知识的初学者编写的，我们在它们时解释了所有的术语和概念。在冒险 2、3 和 4 中，你涵盖了任何优秀游戏的关键部分。这些包括“感知”Minecraft\
  \ 世界发生的事情、使用简单的数学进行“计算”，以及让你的程序“行为”不同，例如在聊天中显示消息或自动在世界中创建区块。在整书中，你将使用这三个“感知”、“计算”和“行为”概念来构建更大、更有趣的\
  \ Minecraft 程序！\n\n冒险 5 和 6 通过引入分阶段开发和测试稍大的程序，在你在早期冒险中学到的知识基础上进行了扩展。冒险 5 探讨了如何从数据文件中引入大量数据，以便使用\
  \ 3D “复制机”保存并复制大型结构。\n\n冒险 6 和 7 引入了免费的 `MinecraftStuff` 模块，它使得使用区块构建线条、圆形和其他 2D\
  \ 形状，以及一些奇特的 3D 球体和金字塔成为可能。这些可以作为手工很难构建的巨大结构的开头。冒险 7 展示了如何为移动物体添加个性，赋予它们自己的智能。通过这些技术，你可以编写出一些令你的朋友惊讶的有趣的“游戏中的游戏”。\n\
  \n\n\n\n\n冒险 8 引入了物理计算这一令人兴奋的话题，如果你想进行这项可选的冒险，将需要购买一个 BBC micro:bit（销售商链接请参见附录 A）。通过将\
  \ BBC micro:bit 连接到电脑，你可以使用 micro:bit 上的一系列输入输出设备来控制并与你的 Minecraft 游戏交互；BBC micro:bit\
  \ 将成为一个 Minecraft 的可编程游戏控制器。\n\n冒险 9 结合了之前冒险中所有的编程概念和技能，创建一个终极的大型项目——一个带有评分机制、且你必须避开或携带移动对象的酷游戏。在这次冒险中，你还可以再次尝试使用\
  \ BBC micro:bit，允许你通过按下现实世界中的按钮在游戏中进行操作。\n\n附录 A 提供了一系列资源，你可以利用这些资源来扩展和增强你的冒险，学习更多\
  \ Python 编程，并根据你在整本书中学到的知识创建出更酷的 Minecraft 程序。\n\n在附录 B 中，我们包含了一份关于书中使用的所有编程特性的全面参考指南，以及针对\
  \ Minecraft 的特定编程语句的引用，以及一个你可以构建的区块类型表格。你会发现，这是一个无价的参考分章节，对你所有的自己的项目和发明都非常有帮助！\n\
  \n术语表为整书中介绍的所有术语和专业词汇提供了方便的快速参考，并且是每个冒险中所有定义的集合。\n\n# 伴侣网站\n\n在整本书中，你会发现《Minecraft\
  \ 冒险》伴侣网站的引用，地址为 [`www.wiley.com/go/adventuresinminecraft2e`](http://www.wiley.com/go/adventuresinminecraft2e)。在该网站上，你将找到开始\
  \ Minecraft 编程所需的启动套件，以及我们整理的一系列视频教程，在你遇到困难时提供帮助。你可以在网站上找到一些较大项目的代码文件。\n\n附录 B 包含一个实用的参考。在完成这些\
  \ Minecraft 冒险时，请将其放在手边。你也可以将其用于未来你开启的任何编程项目。\n\n# 其他帮助来源\n\n计算机是复杂的设备，操作系统和软件一直在变化。我们尽力保护你和你的冒险免受未来变化的影响，在冒险\
  \ 1 中提供了一个可下载的启动套件，它应该提供你大部分所需。然而，如果你遇到问题或需要特定的帮助，这里是一些有用的地方：\n\n*   注册用户 ID 并下载安装\
  \ Minecraft：[`http://minecraft.net`](http://minecraft.net/)\n*   玩 Minecraft 游戏：[`http://minecraft.gamepedia.com/Minecraft_Wiki`](http://minecraft.gamepedia.com/Minecraft_Wiki/)\n\
  *   树莓派：[`www.raspberrypi.org`](http://www.raspberrypi.org/)\n*   微软 Windows：[`http://support.microsoft.com`](http://support.microsoft.com/)\n\
