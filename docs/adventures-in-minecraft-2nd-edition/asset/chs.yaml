  \ + 20, pos.y, pos.z)\npoints.add(pos.x + 10, pos.y + 20, pos.z)\n```\n\n7. 使用 `MinecraftDrawing.drawFace`\
  \ 函数创建三角形多边形：\n\n```python\nmcdrawing.drawFace(points, True, block.WOOL.id, 6)\n\
  ```\n\n8. 保存文件并运行程序以创建三角形多边形。\n\n# 金字塔\n\n找一张金字塔的照片并仔细观察它。你注意到了什么？它的侧面是什么形状？所有的侧面有什么共同点？它有多少条边？\n\
  \n正如你可能知道的，金字塔的每个面（底除外）总是三角形。埃及的金字塔有四个面（如果算上底部则为五面），但它们可以是从三面以上的任意数量。你是否也注意到任何金字塔的底座都能完美地嵌入一个圆！请查看图\
