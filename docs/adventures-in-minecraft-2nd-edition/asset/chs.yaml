  \n![image](img/9781119439585-fg0903.png)\n\nFIGURE 9-3 创建游戏竞技场\n\n\n\n你的下一个任务是建造一条横跨竞技场宽度的河流——换句话说，一条宽到玩家无法跳过去的河流！幸运的是，那里有一座桥。不幸运的是，这道桥会沿着河前后移动，因此玩家需要仔细掌握时机跳上桥，并从另一侧跳下来（参见图\
  \ 9-7）。\n\n![image](img/9781119439585-fg0907.png)\n\nFIGURE 9-7 玩家必须过河。\n\n如果玩家掉入河流，他将被送回竞技场的起点。你将在第\
  \ 3 部分编写代码将玩家移回起点；现在，本节将关于建造河流和移动的桥梁。\n\n首先，你首先通过清理部分竞技场地板并在底部放置一层水块来创建河流本身。你使用\
  \ `MinecraftShape` 创建桥梁，并使用类似于你之前让墙上下移动的方法让它左右移动。\n\n按照以下步骤更新 `theRiver()` 函数以创建河流障碍物：\n\
  \n1. 在你之前编写的代码中查找以下代码找到 `theRiver()` 函数：\n\n   ```python\n   def theRiver(arenaPos,\
  \ riverZPos):\n       pass\n   ```\n\n   删除函数下方缩进的 `pass` 语句。\n\n2. 在 `def theRiver(arenaPos,\
  \ riverZPos):` 行下方缩进，创建与 Minecraft 的连接：\n\n   ```python\n   mc = minecraft.Minecraft.create()\n\
  \   ```\n\n3. 创建两个常量，分别是河流的宽度（`RIVERWIDTH`）和桥的宽度（`BRIDGEWIDTH`）：\n\n   ```python\n\
  \   RIVERWIDTH = 4\n   BRIDGEWIDTH = 2\n   ```\n\n4. 现在使用传入的参数 `arenaPos` 和 `riverZPos`（竞技场沿河流\
  \ z 轴位置）在竞技场位置创建河流：\n\n   ```python\n   mc.setBlocks(arenaPos.x,\n   arenaPos.y\
  \ - 2,\n   arenaPos.z + riverZPos,\n   arenaPos.x + ARENAX,\n   arenaPos.y,\n  \
  \ arenaPos.z + riverZPos + RIVERWIDTH - 1,\n   block.AIR.id)\n\n   mc.setBlocks(arenaPos.x,\n\
  \   arenaPos.y - 2,\n   arenaPos.z + riverZPos,\n   arenaPos.x + ARENAX,\n   arenaPos.y\
  \ - 2,\n   arenaPos.z + riverZPos + RIVERWIDTH - 1,\n   block.WATER.id)\n   ```\n\
  \n   你通过使用 `setBlocks()` 在竞技场地板创建一个 `AIR` 区域并在底部创建一层 `WATER` 来创建河流。\n\n5. 创建放置桥梁的位置。你希望把它放在河流中间，这样玩家就不能直接走到上面，而必须从岸边跳到桥上：\n\
  \n   ```python\n   bridgePos = minecraft.Vec3(arenaPos.x,\n   arenaPos.y,\n   arenaPos.z\
  \ + riverZPos + 1)\n   ```\n\n6. 通过传入你在步骤 2 和 5 中创建的变量 `mc` 和 `bridgePos` 来创建桥的形状：\n\
  \n   ```python\n   bridgeShape = minecraftstuff.MinecraftShape(mc, bridgePos)\n\
  \   ```\n\n7. 创建将作为桥的形状。你使用类似于制作墙时使用的 `setBlocks` 方法来实现，结合桥的宽 (x) 和河流宽度 (z)：\n\n\
  \   ```python\n   bridgeShape.setBlocks(\n   0, 0, 0,\n   BRIDGEWIDTH - 1, 0, RIVERWIDTH\
  \ - 3,\n   block.WOOD_PLANKS.id)\n   ```\n\n   在创建桥时，从 `RIVERWIDTH` 中减去 3 以在岸边和桥之间留出一个方块的间隙，这意味着玩家必须跳上桥并跳下桥（参见图\
  \ 9-8）。\n\n8. 为了让桥一次一个块地横跨竞技场，你需要计算桥从一侧到另一侧需要经过的步数；这是竞技场的宽度减去桥的宽度：\n\n   ```python\n\
  \   steps = ARENAX - BRIDGEWIDTH + 1\n   ```\n\n9. 使用两个 `for` 循环（一个向左，一个向右）并使用 `MinecraftShape.moveBy()`\
  \ 函数让桥每一步向侧移动一个方块，在步骤之间添加很小的延迟：\n\n   ```python\n   while not gameOver:\n      \
  \ for left in range(0, steps):\n           bridgeShape.moveBy(1,0,0)\n         \
  \  time.sleep(1)\n       for right in range(0, steps):\n           bridgeShape.moveBy(-1,0,0)\n\
  \           time.sleep(1)\n   ```\n\n10. 你的河流函数现在完成了。它需要在主程序中从线程中调用，因此在底部添加以下代码：\n\
  \n    ```python\n    RIVERZ = 4\n    river_t = threading.Thread(target=theRiver,\
  \ args=(arenaPos, RIVERZ))\n    river_t.start()\n    ```\n\n11. 现在运行程序！你应该能看到带有来移动桥的竞技场。\n\
  \n![image](img/9781119439585-fg0907.png)\n\n## 创建空洞\n\n玩家必须过河。如果玩家掉入河流，他将被送回竞技场的起点。你将在第\
  \ 3 部分编写代码将玩家移回起点；现在，本节将关于建造河流和移动的桥梁。\n\n（此处省略原文中重复的段落，按要求不重复输出原文）\n\n\n\n你在创建洞之后添加了一个延迟，这样洞就会在那里留两秒钟。\n\
  \n8. 使用与之前打开洞时相同的循环来关闭这些洞，但这次将方块设回 `GRASS`（草地）：\n\n```python\nfor hole in holes:\n\
  \    mc.setBlocks(hole.x, hole.y, hole.z,\n    hole.x, hole.y - 2, hole.z,\n   \
  \ block.GRASS.id)\n    time.sleep(2)\n```\n\n程序现在返回到 `while` 循环顶部并创建一组新的洞。\n\n9.\
  \ 你的 `holes` 函数现在已完成。在程序底部添加以下代码：\n\n```python\nHOLESZ = 15\nholes_t = threading.Thread(\n\
  \    target = theHoles,\n    args = (arenaPos, HOLESZ))\nholes_t.start()\n```\n\n\
  `HOLESZ` 常量是竞技场下方的 z 轴位置，在该处将创建洞穴障碍。\n\n10. 运行程序。和之前一样，你应该能看到创建了墙壁和河流障碍的竞技场，但现在你应该还能看到洞在竞技场末端的随机位置不断开启和关闭。\n\
  \n![image](img/9781119439585-fg0910.png)\n\n图 9-10 创建洞的位置和宽度。\n\n尝试一下竞技场。看看你是否可以在障碍物之间和障碍物中前后移动，而不会掉落或卡住。\n\
  \n# 第 3 部分：游戏玩法\n\n你这段大冒险的下一部分是为你的程序添加游戏玩法。你的目标是将竞技场从一个障碍障碍赛变成一个游戏，让玩家想要反复玩下去并进入下一关卡。\n\
  \n为了实现这一点，游戏需要具有刺激性和挑战性，并且应该应该包含风险、奖励和目标。挑战在于让玩家在限定的时间内收集竞技场周围随机放置的所有钻石，同时还要尝试穿过障碍。玩家在收集钻石和到达关卡结束时将获得积分。玩家完成关卡越快，获得的分数越多。目标是完成所有关卡并获得尽可能多的分数。你的你的游戏将会有三个等级，你将通过增加钻石数量和缩短时间限制，让每一关都比上一关困难。\n\
  \n## 开始游戏\n\n在这一节中，你将设置游戏并创建常量，建立每个关卡中钻石的数量和可用时间。\n\n程序有两个主循环：\n\n* `game` 循环：该循环一直持续，直到游戏结束（`while\
  \ not gameOver`）。这是设置和启动每个关卡的地方。积分在每个关卡结束时计算。\n* `level` 循环：该循环一直持续到关卡结束——即当关卡完成或游戏结束时（`while\
  \ not gameOver and not levelComplete`）。此循环还会在玩家掉入河流或洞中时将其送回起点，在玩家撞击钻石时清除钻石，并检查时间是否已尽。\n\
  \n首先，按照以下步骤在程序底部添加必要的代码，构建游戏结构并创建两个主循环：\n\n1. 创建三个常量，分别代表游戏中的关卡数量、将创建的钻石数量以及玩家完成每个关卡给予的时间（秒）：\n\
  \n```python\nLEVELS = 3\nDIAMONDS = [3,5,9]\nTIMEOUTS = [30,25,20]\n```\n\n`DIAMONDS`\
  \ 和 `TIMEOUTS` 常量是 Python 列表。它们都有三个项目，对应每个关卡的值；例如，在第一关中，玩家必须收集三颗钻石，并有 30 秒的时间完成并到达另一侧。\n\
  \n2. 创建两个变量来存储玩家得分和他们当前所处的关卡：\n\n```python\nlevel = 0\npoints = 0\n```\n\n3. 创建\
  \ `game` 循环。在它上方放置一个注释以提醒你它的位置，因为本冒险中的后续指令会提到在 `game` 循环下缩进代码：\n\n```python\n#game\
  \ loop\nwhile not gameOver:\n```\n\n变量 `gameOver` 在程序开始时被设为 `False`；当玩家耗尽时间或完成游戏时，它会被设置为\
  \ `True`。这个变量也用于障碍物函数中，当它被设置为 `True` 时，会导致所有障碍物停止运行。\n\n4. 在 `game` 循环的缩进处，更改玩家的位置，使其位于竞技场的起点并准备开始：\n\
  \n```python\nmc.player.setPos(arenaPos.x + 1,\narenaPos.y + 1,\narenaPos.z + 1)\n\
  ```\n\n5. 通过获取当前时间并放入变量来启动关卡计时：\n\n```python\nstart = time.time()\n```\n\n6. 将关卡完成标记设为\
  \ `False` 并创建关卡循环。就像你之前处理 `game` 循环一样，在这里创建一个注释来提醒你 `level` 循环的位置，因为后续指令会提到缩进代码：\n\
  \n```python\nlevelComplete = False\n#level loop\nwhile not gameOver and not levelComplete:\n\
  ```\n\n7. 在 `level` 循环的缩进处放置一个短小的延迟。如果没有它，程序将耗尽所有时间：\n\n```python\ntime.sleep(0.1)\n\
  ```\n\n8. 运行程序。你看到的唯一变化是玩家被放在竞技场。\n\n## 收集钻石\n\n游戏的主要目标是收集钻石。在创建钻石之后，你可以使用 `pollBlockHits`\
  \ 函数（你在冒险 4 中学习过）来监控撞击事件，并在玩家撞击钻石时将其变为 `AIR`。\n\n按照以下步骤更新 `createDiamonds()` 函数并在\
  \ `game` 循环中调用它：\n\n1. 查找你之前写的 `createDiamonds()` 函数：\n\n```python\ndef createDiamonds(arenaPos,\
  \ number):\n    pass\n```\n\n删除函数缩进下的 `pass` 语句。\n\n2. 在 `def createDiamonds(arenaPos,\
  \ number):` 行下方缩进，创建与 Minecraft 的连接：\n\n```python\nmc = Minecraft.create()\n```\n\
  \n3. 通过在竞技场中寻找随机的 x 和 z 位置并将方块设置为 `DIAMOND_BLOCK` 来创建所需的钻石数量：\n\n```python\nfor\
  \ diamond in range(number):\n    x = random.randint(arenaPos.x, arenaPos.x + ARENAX)\n\
  \    z = random.randint(arenaPos.z, arenaPos.z + ARENAZ)\n    mc.setBlock(x, arenaPos.y\
  \ + 1, z, block.DIAMOND_BLOCK.id)\n```\n\n4. 现在需要在 `game` 循环开始开始处调用 `createDiamonds()`\
  \ 函数；每当新关卡开始时，都会创建一组新的钻石。在 `game` 循环的缩进处，直接在 `while` 循环下方添加以下内容：\n\n```python\n\
  createDiamonds(arenaPos, DIAMONDS[level])\ndiamondsLeft = DIAMONDS[level]\n```\n\
  \n变量 `diamondsLeft` 也被创建了；它存储了玩家剩余需要收集的钻石。\n\n5. 运行程序。由于第一关，你应该看到随机位置生成了三颗钻石。\n\n\
  在 `level` 循环下方添加以下代码，以便玩家撞击 `DIAMOND_BLOCK` 时将其变为 `AIR`：\n\n1. 在 `level` 循环的缩进处，调用\
  \ `pollBlockHits` 函数以获取任何方块撞击事件：\n\n\n\n\n\n# 关卡循环\n\n```\nwhile not gameOver and\
  \ not levelComplete:\n    hits = mc.events.pollBlockHits()\n```\n\n2. 遍历方块击事件并获取被击中的方块类型：\n\
  \n```python\nfor hit in hits:\n    blockHitType = mc.getBlock(hit.pos.x,\n    hit.pos.y,\n\
  \    hit.pos.z)\n```\n\n3. 检查击中的方块类型是否为 `DIAMOND_BLOCK`。如果是，将其变为 `AIR` 并从 `diamondsLeft`\
  \ 变量中减 1：\n\n```python\nif blockHitType == block.DIAMOND_BLOCK.id:\n    mc.setBlock(hit.pos.x,\
  \ hit.pos.y, hit.pos.z,\n    block.AIR.id)\n    diamondsLeft = diamondsLeft - 1\n\
  ```\n\n`diamondsLeft` 变量用于在玩家到达竞技场终点时检查所有钻石是否已被收集。\n\n4. 运行程序；当你击中 `DIAMOND` 方块时，它们应该会变为\
  \ `AIR` 并消失。\n\n## 时间不足\n\n如果给玩家留了无限的时间，游戏将变得非常简单（而且无聊）。通过引入时间限制，你让游戏具有了挑战性；通过让玩家在时间耗尽前收集所有钻石并到达另一侧，你给了他一个目标。\n\
  \n如果时间耗尽，游戏结束。你的下一个任务是在关卡循环中添加代码，检查时间是否已耗尽，如果耗尽，则将 `gameOver` 标记设置为 `True`：\n\n\
  1. 在 `level` 循环下缩进处，告诉程序计算此关卡的剩余秒数：\n\n```python\n#level loop\nwhile not gameOver\
  \ and not levelComplete:\n    secondsLeft = TIMEOUTS[level] - (time.time() - start)\n\
  ```\n\n2. 如果剩余秒数小于 0，将 `gameOver` 标记设置为 `True` 并向聊天框发送消息：\n\n```python\nif secondsLeft\
  \ < 0:\n    gameOver = True\n    mc.postToChat(\"Out of time…\")\n```\n\n3. 运行程序。30\
  \ 秒后（因为这是第 1 关），程序应该结束，并出现“Out of time…”字消息（请参见 图 9-12）。\n\n![image](img/9781119439585-fg0912.png)\n\
  \n图 9-12 在时间耗尽时让他们知道。\n\n## 追踪玩家\n\n当玩家收集了所有钻石并到达竞技场终点时，他就完成了关卡。如果他掉进河流或洞中，他将返回竞技场起点。为了实现这些功能，你的程序需要知道玩家的位置。\n\
  \n在检查玩家位置后，如果他收集了所有钻石，程序可以将 `levelComplete` 标记设置为 `True`，或者将其位置置回竞技场起点。\n\n你的下一个任务是在\
  \ `level` 循环中添加代码来追踪玩家，并将其送回起点或完成关卡：\n\n1. 在 `level` 循环下缩进处，获取玩家的位置：\n\n```python\n\
  #level loop\nwhile not gameOver and not levelComplete:\n    pos = mc.player.getTilePos()\n\
  ```\n\n2. 检查玩家的高度 `y` 是否低于竞技场的高度。如果是，则他一定掉进了河流或洞中，因此将他送回起点：\n\n```python\nif pos.y\
  \ < arenaPos.y:\n    mc.player.setPos(arenaPos.x + 1,\n    arenaPos.y + 1,\n   \
  \ arenaPos.z + 1)\n```\n\n3. 检查玩家是否已到达竞技场终点并收集了所有钻石。你通过检查玩家的 z 轴位置是否等于竞技场的终点来实现这一点，如果是，将\
  \ `levelComplete` 标记设置为 `True`：\n\n```python\nif pos.z == arenaPos.z + ARENAZ and\
  \ diamondsLeft == 0:\n    levelComplete = True\n```\n\n当 `levelComplete` 标记设置为 `True`\
  \ 时，`level` 循环结束，钻石会重新生成，游戏重新开始。\n\n4. 运行程序。当所有钻石被收集且玩家到达竞技场终点时，游戏应该重置；如果玩家掉进河流或洞中，他应该被返回竞技场起点。\n\
  \n## 设置关卡为完成并计算积分\n\n当玩家完成关卡时，程序需要计算他得了多少分并将游戏进行到下一关。如果玩家完成了关卡，他就能得分。每收集一颗钻石得 1\
  \ 分，乘以时钟剩余秒数。\n\n要做到这一点，你需要包含以下代码。新代码需要在 `game` 循环下缩进，但必须放在...之后：\n\n1. 在 `game`\
  \ 循环下缩进处，但在 `level` 循环之后，检查关卡是否已完成：\n\n```python\ngame loop\nwhile ...:\n    #level\
  \ loop\n    while not gameOver and not levelComplete:\n        # ...\n    if levelComplete:\n\
  \        # ...\n```\n\n2. 如果关卡完成，计算积分并将其添加到 `points` 中：\n\n```python\npoints = points\
  \ + diamondsLeft * secondsLeft\n```\n\n3. 给 `level` 加 1 将游戏设置为下一关：\n\n```python\n\
  level = level + 1\n```\n\n4. 如果这是最后一关，将 `gameOver` 标记设置为 `True` 并向聊天框发送消息：\n\n```python\n\
  if level == LEVELS:\n    gameOver = True\n    mc.postToChat(\"Congratulations -\
  \ All levels complete\")\n```\n\n\n\n\n\n```python\nmicrobit.display.scroll(\"A\
  \ to start\")\nwhile not microbit.button_a.was_pressed():\n    time.sleep(0.1)\n\
  #game loop\nwhile not gameOver:\n```\n\n你还让 micro:bit 屏幕上显示了一条滚动消息，提示玩家按下“A to start”（A\
  \ 开始）。\n\n3. 运行程序并测试新的启动按钮。\n\n## 倒计时钟\n\n当时间用时，屏幕将显示一个简单的时钟，从 5 倒数到 0，然后游戏结束，这为玩家提供了一个视觉指示，告诉他们需要加快了。\n\
  \n要实现这一点，你需要修改 Crafty Crossing 程序，在游戏剩余的秒数少于 6 秒时，使用 `microbit.display.show` 函数来更新显示：\n\
  \n1. 在游戏循环中计算出 `secondsLeft` 变量后，添加一个 `if` 语句来检查 `secondsLeft` 是否小于 6：\n\n`secondsLeft\
  \ = TIMEOUTS[level] - (time.time() - start)`\n\n```python\nif int(secondsLeft) <\
  \ 6:\n```\n\n2. 在 `if` 语句下的缩进部分，添加代码在 BBC micro:bit 的屏幕上显示时钟图像：\n\n```python\nmicrobit.display.show(\n\
  microbit.Image.ALL_CLOCKS[int(secondsLeft)])\n```\n\n`ALL_CLOCKS` 与 Adventure 8\
  \ 中使用的不同，因为它是一个包含 12 张图像的列表，每个图像对应表盘上的小时位置。\n\n3. 运行程序。当时间用尽时，你会看到 BBC micro:bit\
  \ 上有一个正在倒计时的时钟。\n\n## 收集钻石\n\n你在这次冒险中的最后一个任务是更新显示以显示剩余待收集钻石的数量。\n\n要实现这一点，你需要修改\
  \ Crafty Crossing 程序，在剩余时间超过 5 秒时更新显示：\n\n1. 在显示倒计时钟的 `if` 语句中添加一个 `else`。同时添加在屏幕上显示\
  \ `diamondsLeft` 的代码：\n\n```python\nif int(secondsLeft) < 6:\n    microbit.display.show(\n\
  \    microbit.Image.ALL_CLOCKS[int(secondsLeft)])\nelse:\n    microbit.display.show(diamondsLeft)\n\
  ```\n\n2. 运行程序。钻石的数量应该会被显示出来，并在玩家每次击中一个时都会减少，直到达到 0，或者时间开始耗尽出现倒计时钟。\n\n| 快速参考表 |\
