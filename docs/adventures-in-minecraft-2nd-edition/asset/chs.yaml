  \ 运行它。\n\n## 使用 postToChat 修改你的位置\n\n在继续进行更多 Minecraft 程序操作之前，你可以改进玩家位置的输出，使其更容易理解。每次显示位置时都有三行独立的输出会占用大量空间；如果能将玩家位置的三个部分放在同一行，就像这样，就很好：\n\
  \n`x=10 y=2 z=20`\n\n\n\n\n是时候将你的游戏循环付诸实践并开发一个简单的应用程序了。“欢迎归家”（Welcome Home）游戏使用传感（追踪玩家的位置）来在玩家于\
  \ Minecraft 世界中移动时跟随其走动。你还将学习了如何使用 Python 中的 `if` 语句进行更复杂的传感。你将构建一个魔法门垫，当你站在门垫上时，Minecraft\
  \ 聊天框会弹出“欢迎归家”的消息。\n\n## 使用 if 语句制作魔法门垫\n\n为了判断你的玩家是否站在门垫上，你将使用 `if` 语句将玩家的位置与门垫的位置进行比较。当两者相匹配时，说明你的玩家已经到家了。\n\
  \n首先，看一看 `if` 语句是如何工作的；在 Python Shell 中亲自尝试一下将帮助你理解它：\n\n1. 点击 Python Shell。确保你恰好点击\
  \ `>>>` 提示符的右侧，以确保你输入的内容进入了正确的位置。\n\n2. 在 Python Shell 中输入以下行代码。当你按下回车键时，Python\
  \ 就会运行它。它还不会显示任何内容，因为这所做的只是将数字 20 存储在名为 `a` 的变量中：\n\n   ```\n   a = 20\n   ```\n\
  \n3. 在 Python Shell 中输入以下内容，检查变量 `a` 是否包含正确的值：\n\n   ```python\n   print(a)\n  \
  \ ```\n\n   数字 20 应该显示在屏幕上。\n\n4. 尝试使用 `if` 语句来检查变量 `a` 中存储的值是否大于 10。注意，你必须在 `if`\
  \ 语句末尾加上冒号。当你在第一行结束按回车时，Python 会自动为你下一行进行缩进：\n\n   ```python\n   if a>10:\n    \
  \   print(\"big\")\n   ```\n\n5. 现在再次按回车键，告诉 Python Shell 你已完成 `if` 语句的输入。你应该能在\
  \ Python Shell 上看到“big”这个词。要查看外观，请参图 2-3。\n\n![image](img/9781119439585-fg0203.png)\n\
  \nFIGURE 2-3 在 Python Shell 中交互式使用 `if` 语句\n\n## 检查玩家是否位于特定位置\n\n为了让程序能够判断玩家是否站在魔法门垫上，它必须检查坐标至少两个部分。如果你检查门垫的\
  \ x 和 z 坐标与玩家的位置相同，这可以作为检测玩家站在门垫上的合理方法。你可以通过在 `if` 语句内部使用关键字 `and` 来同时检查一个条件和另一个条件。y\
  \ 坐标在这里不重要，而且由于你在程序中没有检查 y 坐标，当玩家悬浮在门垫上方时，你仍然能看到欢迎归家的消息。\n\n先在 Python Shell 中交互式尝试一下以确保它工作正常：\n\
  \n1. 在 Python Shell >>> 提示符处，输入以下内容设置变量：\n\n   ```python\n   a = 8\n   ```\n\n2.\
  \ 输入一个同样使用了 `and` 的 `if` 语句。该语句检查变量 `a` 是否在两个数字之间。当你第一次输入它时，会在 Python Shell 上看到“between”一词，因为\
  \ 8 大于 5 且小于 10。记得再次按回车键以完成 `if` 的缩进区域：\n\n   ```python\n   if a>5 and a<10:\n \
  \      print(\"between\")\n   ```\n\n3. 现在将 `a` 改为小于 5，看看会发生什么（参阅图 2-4）：\n\n   ```python\n\
  \   a = 3\n   if a>5 and a<10:\n       print(\"between\")\n   ```\n\n![image](img/9781119439585-fg0204.png)\n\
  \nFIGURE 2-4 你使用带有 `and` 的 `if` 语句来检查两个或多个条件。\n\n## 构建魔法门垫\n\n在编写游戏之前，你首先需要在 Minecraft\
  \ 世界中构建一些东西，这样你的程序就有东西可以交互了。你真正只需要一个门垫。但首先，打开 Minecraft 并加载你已经在使用的世界。\n\n1. 要在地板上放置门垫，请从物品栏中选择一个物品并右键点击放置在你身体正前的地板上。羊毛可能是门垫的好选择。\n\
  \n2. 要找到你的门垫在 Minecraft 世界中的坐标，再次运行你的 `whereAmI.py` 程序，然后站在门垫上。在某处记录下 x、y 和 z 坐标，因为你在编写新程序时需要它们，以便在\
  \ Minecraft 世界中定位门垫。\n\n## 编写“欢迎归家”游戏\n\n在理解了 `if` 语句之后，你可以按照以下步骤编写“欢迎归家”游戏：\n\n\
  1. 从编辑器选择新建（New File）创建一个新文件。\n2. 从编辑器选择另存为（Save As）保存你的程序，命名为 `welcomeHome.py`。\n\
  3. 导入所需的模块：\n\n   ```python\n   import mcpi.minecraft as mc\n   import time\n  \
  \ ```\n\n4. 连接到 Minecraft：\n\n   ```python\n   mc = mc.create()\n   ```\n\n5. 放入主循环，使其运行不会太快：\n\
  \n   ```python\n   while True:\n       pos = mc.player.getPos()\n   ```\n\n6. 添加\
  \ `if` 语句来检查玩家是否站在门垫上。为了让其工作，门垫的 x 和 z 坐标必须匹配。使用你记录的 x 和 z 坐标：\n\n   ```python\n\
  \   if pos.x == 10 and pos.z == 12:\n       mc.postToChat(\"welcome home\")\n  \
  \ ```\n\n7. 通过选择运行（Run），你可以查看程序是否工作。当你站在门垫上，程序应该显示“welcome home”。\n\n![image](img/9781119439585-fg0205.png)\n\
  \nFIGURE 2-5 站在门垫上会显示“欢迎归家”的消息。\n\n\n\n\n为了用你的程序对场地进行地理围栏（geo-fence），你需要对场地角落的坐标有准确的记录，这样你就可以将这些数字输入到\
  \ Python 程序中。\n\n实现这一点最简单的方法是运行之前的 `whereAmI.py` 程序，然后让你的玩家运行到场地的每个角落，获取每个角落的 x、y\
  \ 和 z 坐标。在纸上画出你正在构建的内容的草图，并将坐标写在草图上。编写程序时你需要这些坐标。记住，当玩家向南移动时，z 坐标会变大，向北移动时会变小，正如你在图\
  \ 2-1 中所看到的那样。\n\n在图 2-9 中，你可以看到我在写这本书时构建的场地坐标。我写下了四个角落的坐标，因为我需要它们来计算 x 方向和 z 方向上的最小值和最大值。注意最小坐标位于我场地的左上角，但如果你构建场地时玩家面向的方向相反，那么你的场地情况可能会不同。\n\
  \n![image](img/9781119439585-fg0209.png)\n\nFIGURE 2-9 现在你已经有了场地角落的坐标，就可以进行地理围栏了。\n\
  \n你的地理围栏程序需要四个数字。首先，你需要知道最小和最大的 x 坐标，所以根据你的图表算出它们。在上一个例子中，最小 x 是 10，最大的 x 是 20。我将最小\
  \ x 坐标称为 `X1`，最大的 x 坐标称为 `X2`。\n\n接下来你需要算出最小和最大的 z 坐标。在示例中，最小 z 是 10，最大的 z 是 20。我将最小\
  \ z 坐标称为 `Z1`，最大的 z 坐标称为 `Z2`：\n\n```\nX1 = 10\nZ1 = 10\nX2 = 20\nZ2 = 20\n```\n\
  \n以相同的方式为你的最大和最小坐标编号，因为你会在下一步——编写程序时需要用到它们。\n\n## 编写地理围栏程序\n\n最后一步是编写程序，使地理围栏生效，并在玩家站在场地内时收取租金。这个程序在结构上与\
  \ `whereAmI.py` 程序相似。\n\n你将在这个新游戏中使用**常量**（constants），以便以后移动你的场地。这样，当你移动场地时，就不必在程序中到处寻找需要更改的坐标值了。\n\
  \n编写该程序，请遵循以下步骤：\n\n1. 首先，通过菜单选择文件（File）新建文件（New File），在 IDLE 中打开一个新窗口。\n2. 从菜单选择文件（File）中的另存为（Save\
  \ As），并将文件命名为 `rent.py`。\n3. 导入此程序所需的模块：\n   ```\n   import mcpi.minecraft as minecraft\n\
  \   import time\n   ```\n4. 连接到 Minecraft 游戏：\n   ```\n   mc = minecraft.Minecraft.create()\n\
  \   ```\n5. 为地理围栏的四个坐标定义一些常量。确保你使用的是之前算出的坐标。我使用了我在程序中的坐标，但你的可能不同：\n   ```\n   X1\
  \ = 10\n   Z1 = 10\n   X2 = 20\n   Z2 = 20\n   ```\n6. 创建一个变量来记录玩家被收了多少总租金。当游戏开始时，你还没有收取任何租金，所以创建一个名为\
  \ `rent` 的新变量并将其设置为零：\n   ```\n   rent = 0\n   ```\n7. 使用 `while` 语句创建主游戏循环。你的程序每秒循环一次，所以使用\
  \ `sleep` 语句让它每次循环延迟 1 秒。每次循环时延迟短时间会让程序运行变慢一点，同时也为你提供了一个方便的方法来计时玩家在场地内停留的时间。稍后，你将在每次游戏循环时给\
  \ `rent` 变量加 1，由于你已经在循环顶部添加了一秒的延迟，这意味着租金每秒将增加 1。确保此时此的缩进正确：\n   ```\n   while True:\n\
  \       time.sleep(1)\n   ```\n8. 要检查玩家是否在地理围栏区域内，你需要知道他们的位置。就像在你之前的程序中一样，使用 `player.getTilePos()`\
  \ 来：\n   ```\n   pos = mc.player.getTilePos()\n   ```\n9. 你现在到了程序最重要的部分。在这里，你引导程序使用之前算出的四个坐标来判断玩家是否站在场地内，如果是，则向他收取租金并通过向聊天框发送消息来通知他。要这样做，请输入：\n\
  \   ```\n   if pos.x>X1 and pos.x<X2 and pos.z>Z1 and pos.z<Z2:\n       rent = rent+1\n\
  \       mc.postToChat(\"You owe rent:\"+str(rent))\n   \n\n再次保存程序，并通过菜单选择运行（Run）模块（Run\
  \ Module）来执行。\n\n尝试让玩家进出场地会很有趣。当他在场地内时，聊天框每秒会出现一条消息，说明被收了多少租金。当他离开场地时，将不会收取租金。你的程序还会记得被收了多少租金，所以当你再次回到场地时，它不会忘记你已经欠了多少钱。\n\
  \n# 移动玩家\n\n有一种方法可以让你的游戏更具挑战性和趣味性，涉及到 Minecraft API 的另一个功能，你会在游戏创作中发现它有用——将玩家移动到\
  \ Minecraft 世界的不同位置！要这样做，你需要修改现有的 `rent.py` 程序，如果玩家在场地内停留超过三秒，他就会被弹出场外。\n\n\n\n\n\
  ```python\ninField = inField+1\nelse: # not inside the field\ninField = 0\n```\n\
  \n5. 在程序末尾添加一些额外的代码，如果玩家在区域内停留超过三秒，就将其弹射到空中并移出区域。重力会让他掉到地上，他必须再次跑回区域内。这段代码直接放在程序的末尾。`if`\
  \ 必须缩进一层，因为它是 `while True` 循环的一部分，而属于 `if` 的语句必须相对于程序左侧缩进两层。输入以下内容：\n\n```python\n\
  if inField>3:\n    mc.postToChat(\"Too slow!\")\n    mc.player.setPos(HOME_X, pos.y\
  \ + HOME_Y, HOME_Z)\n```\n\n6. 保存你的程序，并使用编辑器菜单中的“运行（Run）⇒ 运行模块（Run Module）”来运行它。\n\
