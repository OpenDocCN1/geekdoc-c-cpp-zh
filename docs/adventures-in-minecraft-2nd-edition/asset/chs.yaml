  \ Windows 的 PC；运行 macOS X 的 Apple Mac；或者运行带有 Pixel 的 Raspbian 的 Raspberry Pi。你配置电脑的方法取决于你拥有哪种电脑，但一旦配置好，你在所有电脑上以完全相同的方式进行\
  \ Minecraft 程序。为了方便你配置电脑，你可以从 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 下载启动套件。这些启动套件经过了测试，以确保书中所有的冒险都能正常运行。\n\n你会发现你的启动套件中包含一个 `README` 文件，你应该查看一下。它描述了套件包含的内容以及它是如何创建的；你可以使用这些信息从零开始配置自己的电脑，尽管不建议这样做。通过遵循书中的说明，你将获得更多收获。\n\
  \n请确保你遵循适用于你类型电脑的说明，即“配置你的 Raspberry Pi 以进行 Minecraft 程序”或“配置你的 PC 或 Apple Mac 以进行\
  \ Minecraft ”。\n\n\n\n1. 打开 PC 上的网络浏览器（例如 Internet Explorer 或 Chrome）。访问 [`www.python.org/downloads/release/python-361/`](https://www.python.org/downloads/release/python-361/)\
  \ 下载并安装 Python 3.6.1。\n2. 向下滚动页面，在文件列表中点击“Windows x86 Executable Installer”链接以下载\
  \ Python 安装程序。\n3. 当 `python-3.6.1.exe` 文件下载完成后，通过点击“打开 ⇒ 运行”菜单选项，或者打开下载文件夹并双击该文件来运行它。\n\
  4. 可能会弹出一个安全警告框（询问“你是否要运行此文件？”）。点击“运行”（Run）。\n5. 点击“立即安装”（Install Now）开始安装。\n6.\
  \ 用户账户控制（User Account Control）可能会请求许可运行设置程序。如果是，点击“是”（Yes）。\n7. 等待设置程序完成安装并点击“关闭”（Close）。\n\
  \n## 在你的 Apple Mac 上安装入门包和 Python\n\n如果你正在使用 Apple Mac，设置电脑的下一步将涉及两个步骤：\n\n1. 下载\
  \ Apple Mac 的入门包并将其解压到桌面。\n2. 下载 Python 编程语言并将其安装在你的 Apple Mac 上。\n\n## 下载和解压入门包\n\
  \n按照以下步骤下载 Apple Mac 入门包并将内容复制到桌面（将它们放在桌面上方便你在需要时随时找到它们）：\n\n1. 打开你 Apple Mac 上的网络浏览器（例如\
  \ Safari 或 Chrome），访问 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 并下载适用于你 Apple Mac 的入门包。\n2. 当入门包 zip 文件下载完成后，进入你的下载文件夹。\n3. 压缩包中仅包含名为 `AdventuresInMinecraft-Mac`\
  \ 的文件夹。点击该文件夹，按住鼠标键并将其拖到桌面即可将其复制到桌面（参见 图 1-5）。\n\n![image](img/9781119439585-fg0105.png)\n\
  \n图 1-5 将 `AdventuresInMinecraft-Mac` 文件夹复制到 Mac 桌面。\n\n## 下载和安装 Python\n\n由于你将使用\
  \ Python 进行编码，必须按照以下步骤安装 Python 编程语言和代码编辑器 IDLE：\n\n1. 打开你 Apple Mac 上的网络浏览器。访问\
  \ [`www.python.org/downloads/release/python-361/`](https://www.python.org/downloads/release/python-361/)\
  \ 下载并安装 Python 3.6.1。\n2. 向下滚动页面，在文件列表中点击“macOS X 64-bit/32-bit Installer”链接下载 Python\
  \ 安装程序。\n3. 当 `python-3.6.1-macosx10.6.pkg` 文件下载完成后，点击它或在 Finder 中打开下载文件夹并双击它打开文件。\n\
  4. “介绍”屏幕显示关于 Python 安装程序的信息。点击“下一步”（Continue）。\n5. “许可”（Read Me）屏幕显示关于 Python 的重要信息。点击“下一步”（Continue）。\n\
  6. “许可协议”屏幕显示软件许可协议。点击“下一步”（Continue），然后点击“同意”（Agree）。\n7. “安装类型”屏幕显示将使用多少磁盘空间；点击“安装”（Install）。如果你愿意，还有机会更改安装位置。\n\
