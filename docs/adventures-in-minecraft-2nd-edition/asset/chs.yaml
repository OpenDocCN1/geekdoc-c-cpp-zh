  计算机程序通常并不智能——它们重复地执行你给它们的指令。如果你不更改程序的任何输入，它在每次运行时都将执行完全相同的操作。你一直以来制作的 Minecraft\
  \ 程序非常具有交互性，因为它们会根据游戏世界中发生的情况来改变行为，而这正是程序的输入。\n\n## 使用数据文件可以做的趣事\n\n另一种让计算机程序在每次运行时执行不同任务的有趣方法是将输入数据存储在文本文件中，并让计算机在启动时读取该文件。然后你可以创建任意数量的文本文件，甚至设置一个菜单，根据你想要对程序的操作来选择打开哪个文件。这被称为“数据驱动程序”，因为定义程序行为的主要是外部文本文件中的数据。\n\
  \n如果你想想，你已经在计算机上使用的许多程序都使用了数据文件。你用来输入作业的文字处理器会将作业存储在数据文件中；当你用数码相机拍照时，照片存储在数据文件中。\n\
