  \ 是 Minecraft 中的电。你可以用简单的电路构建复杂的设备。\n\n*   [`www.spigotmc.org/wiki/spigot-development`](https://www.spigotmc.org/wiki/spigot-development)—提升你的\
  \ Minecraft 水平，学习 `Java` 并创建自己的服务器。\n\n## 项目与教程\n\n自己想主意很有趣，但有时你需要一些灵感来开始。这里列出的网站有很多示例项目，其中许多是由爱好者和开发者贡献的。\n\
  \n*   [`https://minecraft.gameedia.com/Tutorials/Advanced_redstone_circuits`](https://minecraft.gameedia.com/Tutorials/Advanced_redstone_circuits)—这个教程展示了如何使用\
  \ `redstone` 组合许多小型 `redstone` 电路来制作非常棒的结构，并一步步教你如何用 `redstone` 构建出一台计算机。\n\n* \
  \  [`https://learn.adafruit.com/search?q=minecraft`](https://learn.adafruit.com/search?q=minecraft)—Adafruit\
  \ 有一系列由 Adafruit 和社区其他人编写的优秀教程。该网站包含 Minecraft 项目区域，看起来他们仍在不断增加。\n\n*   [`www.stuffaboutcode.com/2013/04/raspberry-pi-cannon.html`](http://www.stuffaboutcode.com/2013/04/raspberry-pi-cannon.html)—Martin\
  \ 的第一个 Minecraft 项目之一是创建一个大炮。这不是一个普通的 TNT 大炮；你可以对其进行旋转、倾斜和发射。\n\n*   [`http://hackaday.com/2013/01/30/controlling-minecraft-with-a-raspberry-pi`](http://hackaday.com/2013/01/30/controlling-minecraft-with-a-raspberry-pi)—这是另一种从\
  \ Minecraft 控制真实硬件的方法，使用服务器插件与 `Raspberry Pi` 通信，让 Minecraft 内部的杠杆和标牌控制并监控现实世界的电子设备。\n\
  \n\n\n\n\n*   `www.gemmamaylatham.co.uk/portfolio-item/patterncraft/` — Gemma May\
  \ Latham 是一位著名的参与式艺术家/创作者，她正不致力于让更多孩子学习编程。她非常成功的 PatternCraft 项目是因为购买了这本书的第一版后，在\
  \ Twitter 上一次偶然聚会而产生的。\n*   `http://warksjammy.blogspot.co.uk/?view=snapshot` —\
  \ 这是一个来自英国沃里克郡郡一位计算机老师的精彩博客，包含了丰富的 Minecraft、树莓派、BBC micro:bit 和物理计算资源。特别关注他的 Minecraft\
  \ HackPacks 系列，其中包含了一系列关于在教室中使用 Minecraft 的精美教学资源汇编。\n\n# 视频\n\nMinecraft 和许多现代游戏一样，非常视觉化，获取想法和灵感的最佳方法之一就是观察别人在做什么。这些视频很多来自博主和爱好者，他们仅凭视频就声名大噪，而且许多人每周甚至每天都会发布视频。\n\
  \n*   `www.youtube.com/user/sethbling` — Seth Bling 拥有一个庞大且非常活跃的 YouTube 频道，有很多\
  \ Minecraft 项目和创意。一定要看看他的 TNT 奥运会！\n*   `www.youtube.com/user/stampylonghead` —\
  \ Stampy 每天在他的 YouTube 频道上至少发布一个新的 Minecraft 视频，在建造酷结构方面非常有趣。\n*   `www.youtube.com/user/scarabcoder`\
  \ — Nicholas Harris 有一个很棒的 YouTube 频道，有很多有趣的项目。他还在亚马逊上写了一本关于如何编写 Minecraft 程序的电子书。\n\
  *   `www.youtube.com/user/SimplySarc` — 看看 SimplySarc，特别是他描述得非常详细的**原版相机**（`www.youtube.com/watch?v=NyMHCabq_rs`），它使用命令块制作了一个完全不需要任何模组就能拍照的相机！\n\
  *   `www.youtube.com/watch?v=7t4bH7Z-Yt4` — 我们自己的 Martin O’Hanlon 展示了一个 Python 程序，该程序可以将你击中的任何方块变成几秒后爆炸的炸弹。\n\
  *   `www.youtube.com/user/ThatMumboJumbo` — MumboJumbo 有一个关于使用红石、活塞和杠杆建造的定期 YouTube\
  \ 系列。看看他用活塞制作的 Minecraft 电梯版本：`www.youtube.com/watch?v=jQulvbivtYI`。\n*   `www.youtube.com/user/HiFolksImAdam`\
  \ — Adam 使用命令块创建了一些有趣的视觉幻象，并建造了一个 TARDIS（时光机）（`www.youtube.com/watch?v=3QpqUCaz8fk`），它的内部空间真的比外面大得多！\n\
  *   `www.youtube.com/user/AsdjkeAndBro` — Asdjke 和 Bro 在 Minecraft 中制作了许多小游戏。我们个人最喜欢的之一是战舰游戏：`www.youtube.com/watch?v=6AbPlT-cAm8`。\n\
  \n# 书籍\n\n在进行你的 Minecraft 冒险时，身边有一本纸质书仍然感觉很好——用个性化的便利签签、铅笔笔迹或折叠的页角将其撑开。我们都从这些其他作者那里学到了很多，并认为你会发现许多额外的项目和想法，这些内容将补充你从这本书中获得的学习收获和乐趣。\n\
