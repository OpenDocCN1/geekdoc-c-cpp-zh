  \n你现在将创建一个程序，通过使用 `drawFace()` 和 `findPointOnCircle()` 函数，创建任何尺寸、任何高度、任意边数的金字塔：\n\
  \n1. 打开 IDLE 并创建一个新文件。将文件保存为 `MinecraftPyramids.py` 并存放在 `MyAdventures` 文件夹中。\n\
  2. 输入以下代码导入 `minecraft`、`block`、`minecraftstuff` 和 `math` 模块：\n\n```python\nimport\
  \ mcpi.minecraft as minecraft\nimport mcpi.block as block\nimport mcpi.minecraftstuff\
  \ as minecraftstuff\nimport math\n```\n\n3. 创建 `findPointOnCircle()` 函数，它将用于计算构成金字塔的每个三角形放置的位置：\n\
  \n```python\ndef findPointOnCircle(cx, cy, radius, angle):\n    x = cx + math.sin(math.radians(angle))\
  \ * radius\n    y = cy + math.cos(math.radians(angle)) * radius\n    x = int(round(x,\
  \ 0))\n    y = int(round(y, 0))\n    return(x, y)\n```\n\n4. 连接到 Minecraft 并创建 `MinecraftDrawing`\
  \ 对象：\n\n```python\nmc = minecraft.Minecraft.create()\nmcdrawing = minecraftstuff.MinecraftDrawing(mc)\n\
  ```\n\n5. 为你的金字塔设置变量。金字塔的中心是玩家的位置。这些变量的值会改变金字塔的大小（或半径）、高度和边数。\n\n```python\nmiddle\
  \ = mc.player.getTilePos()\nRADIUS = 20\nHEIGHT = 10\nSIDES = 4\n```\n\n6. 遍历金字塔的每个面；此点之后的所有代码都在\
  \ `for` 循环下缩进：\n\n```python\nfor side in range(0, SIDES):\n```\n\n7. 对于金字塔的每个面，计算三角形侧边的角度，然后使用\
  \ `findPointOnCircle()` 寻找 x, y, z 坐标。角度通过将 360 度除以总边数，再乘以正在绘制的边来计算，如图 6-10 所示。在\
  \ `for` 循环下缩进输入代码：\n\n```python\npoint1Angle = int(round((360 / SIDES) * side))\n\
  point1X, point1Z = findPointOnCircle(middle.x, middle.y, RADIUS, point1Angle)\n\
  point2Angle = int(round((360 / SIDES) * (side + 1)))\npoint2X, point2Z = findPointOnCircle(middle.x,\
  \ middle.y, RADIUS, point2Angle)\n```\n\n8. 创建三角形的点并使用 `drawFace()` 创建金字塔：\n\n```python\n\
  points = minecraftstuff.Points()\npoints.add(point1X, middle.y, point1Z)\npoints.add(point2X,\
  \ middle.y, point2Z)\npoints.add(middle.x, middle.y + HEIGHT, middle.z)\nmcdrawing.drawFace(points,\
  \ True, block.SANDSTONE.id)\n```\n\n9. 保存文件并运行程序。玩家上方出现了一个金字塔——陷阱！\n\n![image](img/9781119439585-fg0610.png)\n\
  \nFIGURE 6-10 四边形程序可以创建任意尺寸和任意边数的金字塔。尝试更改程序中的变量并重新运行。图 6-11 显示了一些令人惊讶的示例。\n\n![image](img/9781119439585-fg0611.png)\n\
  \n你可以从 *Adventures in Minecraft* 网站 `www.wiley.com/go/adventuresminecraft2` 下载金字塔的完整代码。\n\
  \n# 2D 和 3D 形状的进一步探索\n\n使用 `drawFace()` 函数可以创建任何面体（就像你创建的金字塔一样），何不再制作一些呢？\n\n你可以在以下网站找到许多多面体示例和主意：\n\
  * Maths is Fun (`www.mathisfun.com/geometry/polyhedron.html`)\n* Kids Math Games\
  \ (`www.kidsmathonline.com/facts/3dpolyhedronshapes.html`)\n\n## 快速参考表\n\n| 命令 |\
  \ 说明 |\n| :--- | :--- |\n| `mcdrawing.drawLine(0, 0, 0, 10, 10, 10, block.DIRT.id)`\
  \ | 在两点之间画一条线 |\n| `mcdrawing.drawCircle(0, 0, 0, radius, block.DIRT.id)` | 画一个圆\
  \ |\n| `mcdrawing.drawSphere(0, 0, 0, radius, block.DIRT.id)` | 画一个球体 |\n| `tri\
  \ = minecraftstuff.Points(); filled = True; tri.add(0,0,0); tri.add(10,0,0); tri.add(5,10,0);\
  \ mcdrawing.drawFace(tri, filled, block.DIRT.id)` | 画一个多边形 |\n\n\n\n\nMinecraft\
  \ 可能是一个孤独的世界。但你的玩家不必是孤单的——你可以创建一个方块，跟随在他周围移动，与他聊天并成为他的朋友（参见图 7-1）。\n\n![image](img/9781119439585-fg0701.png)\n\
  \n图 7-1 创建一个方块朋友，在玩家的 Minecraft 冒险中陪伴他。\n\n要编写一个方块朋友，你需要像她一样思考！如果她在你的玩家附近，她会很高兴，所以她想要跟随他在周围转，并尝试坐在他身边。只要你的玩家靠近她，她就会保持开心；如果玩家离开，她会跟在后面。如果玩家走得太远，方块朋友会感到难过，她会停止跟随他，直到他回来并给她一个拥抱（通过站在她旁边）。\n\
  \n方块朋友程序有两个两个不同的部分：\n\n*   **方块用来决定下一步该做什么的规则：** 程序的这部分让方块朋友决定是向你的玩家（目标）移动还是留在原地。\n\
  *   **让方块向目标移动的代码：** 一旦方块朋友到达目标，她会再次使用规则来确定下一步该做什么。\n\n当方块朋友向目标移动时，她应该在陆地“上方”旅行，而不是悬浮在空中或在地下挖掘！你通过使用\
  \ `mc.getHeight(x,z)` 函数并向其传递水平位置 `(x,z)` 来实现。它返回从天空向下第一个不是 `AIR` 的方块的垂直位置（`y`）。\n\
  \n从为方块朋友创建一个新程序开始：\n\n1.  打开 IDLE，选择 `File`  `New File` 创建新程序，并将文件保存为 `BlockFriend.py`\
  \ 位于 `MyAdventures` 文件夹中。\n2.  导入 `minecraft`、`block`、`minecraftstuff`、`math` 和\
  \ `time` 模块：\n    ```\n    import mcpi.minecraft as minecraft\n    import mcpi.block\
  \ as block\n    import mcpi.minecraftstuff as minecraftstuff\n    import math\n\
  \    import time\n    ```\n3.  你需要做的第一件事是创建一个计算两点之间距离的函数。稍你使用这个函数来计算方块朋友距离玩家有多远：\n\
  \    ```python\n    def distanceBetweenPoints(point1, point2):\n        xd = point2.x\
  \ - point1.x\n        yd = point2.y - point1.y\n        zd = point2.z - point1.z\n\
  \        return math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n    ```\n4.  现在你需要决定玩家需要多远方块朋友才会停止跟随。创建一个常量来存储你认为“太远”的距离。我选择了\
  \ 15，这意味着当方块朋友和玩家相隔 15 个方块时，方块朋友停止跟随玩家：\n    ```\n    TOO_FAR_AWAY = 15\n    ```\n\
  5.  创建 `Minecraft` 和 `MinecraftDrawing` 对象：\n    ```python\n    mc = minecraft.Minecraft.create()\n\
  \    mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n    ```\n6.  创建一个变量来存储方块的心绪。对于这次冒险，方块要么快乐的，要么伤心。将其设置为\
  \ `\"happy\"`：\n    ```python\n    blockMood = \"happy\"\n    ```\n7.  通过获取玩家的位置，创建一个距离玩家几个方块的方块朋友，在\
  \ x 位置上加 5，并使用 `getHeight()` 函数找到 y 位置，这样方块就坐在陆地上：\n    ```python\n    friend =\
  \ mc.player.getTilePos()\n    friend.x = friend.x + 5\n    friend.y = mc.getHeight(friend.x,\
  \ friend.z)\n    mc.setBlock(friend.x, friend.y, friend.z, block.DIAMOND_BLOCK.id)\n\
  \    mc.postToChat(\"<block> Hello friend\")\n    ```\n8.  为方块朋友创建一个目标。这是她将向移动的位置。初始，将目标设置为方块朋友当前的位置，这样方块朋友在程序启动时就不会尝试移动到任何地方：\n\
  \    ```python\n    target = friend.clone()\n    ```\n9.  启动一个无限循环，这样程序将永远运行。（注意，此点之后的所有代码都缩进在该循环下。）\n\
  \    ```python\n    while True:\n    ```\n10. 获取玩家的位置并使用 `distanceBetweenPoints()`\
  \ 函数计算玩家与方块朋友之间的距离：\n    ```python\n    pos = mc.player.getTilePos()\n    distance\
  \ = distanceBetweenPoints(pos, friend)\n    ```\n11. 应用你想让方块朋友使用的规则来确定下一步该做什么。如果是“快乐”的，告诉它比较朋友与“太远”常量之间的距离。如果距离小于“太远”常量，将目标设置为玩家的位置。\n\
  \    ```python\n    if blockMood == \"happy\":\n        if distance < TOO_FAR_AWAY:\n\
  \            target = pos\n        else:\n            target = friend.clone()\n\
  \            mc.postToChat(\"<block> You are far away I need a hug!\")\n    ```\n\
  \n\n\n\n你可以从《我的世界冒险》（*Adventures in Minecraft*）伙伴网站下载方块朋友程序的完整代码，网址 [`www.wiley.com/go/adventuresinminecraft2e`](http://www.wiley.com/go/adventuresinminecraft2e)。\n\
  \n[/content]\n\n# 使用随机数让你的方块朋友更有趣\n\n你刚刚创建的方块朋友程序的问题在于，它是`可预测的`；她总是会做同样的事情。在运行程序几次后，你就能确切地知道她将在什么时候做什么，所以事情很快就会变得无聊。要真正给你的方块朋友装上“大脑”，你需要赋予她一种不可预测的气质。\n\
  \n通过使用随机数，你可以模拟不可预测性——换句话说，让某些事物看起来像是在以不可预测的方式运行。你通过让程序根据`概率`来选择执行的操作来实现这一点；例如，你可以告诉它每\
  \ 100 次执行一次特定的动作。通过添加更多基于不同几率的规则，你可以让程序变得更难以预测。在将方块朋友程序改为使用随机数之前，让我们探索创建随机数和概率检查的代码。你可能还记得在冒险\
  \ 3 中介绍过随机数。\n\nPython 的 `random` 模块包含 `random.randint(startNumber, endNumber)`\
  \ 函数，它用于生成两个特定数字（`startNumber`，`endNumber`）之间的随机数。\n\n以下代码每次运行时都会打印一个 1 到 10 之间的随机数。如果你想查看结果，应该创建一个新的\
  \ Python 程序：\n\n```\nimport random\nrandomNo = random.randint(1,10)\nprint(randomNo)\n\
  ```\n\n通过添加一个 `if` 语句来检查随机数是否为 10，你创建了一个概率检查，它大约会在每 10 次中为真 1 次：\n\n```python\n\
  import random\nif random.randint(1,10) == 10:\n    print(\"这在 10 次中大约发生 1 次\")\n\
  else:\n    print(\"这在 10 次中大约发生 9 次\")\n```\n\n如果你运行这个程序 100 次，你预期的会看到大约 10 次打印“这在\
  \ 10 次中大约发生 1 次”（参见图 7-3），但你可能只看到 9 次或 11 次，甚至可能完全没有。它是不可预测的！\n\n![image](img/9781119439585-fg0703.png)\n\
  \n图 7-3 创建随机数赋予你的方块朋友一种不可预测的气质\n\n如果你在方块朋友程序中使用随机数和概率检查，可以让它变得不那么容易。你甚至可以让方块朋友“拉黑”你的玩家！\n\
  \n为方块朋友程序添加一些新规则，使得如果方块朋友感到“难过”，那么有 1 分之 100 的概率她会决定等够了，并且如果玩家回来给她一个拥抱，她将不再跟随玩家：\n\
  \n1. 打开 IDLE，从 `MyAdventures` 文件夹中打开 `BlockFriend.py` 程序。\n2. 点击 File ⇒ Save As\
  \ 将文件保存为 `BlockFriendRandom.py`。\n3. 在程序顶部的 `import` 语句中添加 `random` 模块（**粗体**代码）：\n\
  \n   ```python\n   import mcpi.minecraft as minecraft\n   import mcpi.block as block\n\
  \   import mcpi.minecraftstuff as minecraftstuff\n   import math\n   import time\n\
  \   import random\n   ```\n4. 添加一个 100 分之一的随机数测试，当方块处于 `\"sad\"` 状态时，将心情改为 `\"hadenough\"\
  `：\n\n   ```python\n   elif blockMood == \"sad\":\n       if distance <= 1:\n  \
  \         blockMood = \"happy\"\n           mc.postToChat(\"<block> 噢，谢谢。我们走吧.\"\
  )\n       if random.randint(1,100) == 100:\n           blockMood = \"hadenough\"\
  \n           mc.postToChat(\"<block> 够了。我受够了。\")\n   ```\n5. 运行程序。\n\n当你的玩家离方块朋友太远时，如果你等待足够久（直到\
  \ 100 分之一 1 的概率出现），方块朋友就会决定她受够了并“拉黑”玩家！一旦这种情况发生，方块朋友会说：“够了。我受够了。”，并且永远坐在那里。\n\n\
  # 更大的形状\n\n在方块朋友程序中，你让一个方块移动并跟随玩家。但如果你想让很多方块移动起来呢？或者一个由移动方块组成的形状，比如汽车或外星飞船？\n\n\
