  你可以使用 `MinecraftDrawing` 中的 `drawFace()` 函数创建多边形（面）。该函数期望一个点列表（x, y, z），按顺序连接时会创建一个完整的多边形。在\
  \ `filled` 参数中传递 `True` 或 `False` 决定该面是否被填充，最后一个参数是该面应由方块类型（参见图 6-8）：\n\n\n\n\n\n\
  `drawFace(points, filled, blockType, blockData)`\n\n![image](img/9781119439585-fg0608.png)\n\
  \nFIGURE 6-8 `drawFace()` 用于从三个点创建一个三角形\n\n创建一个新程序来实验 `drawFace()` 函数，并创建图 6-8 所示的三角形：\n\
  \n1. 打开 IDLE 并创建一个新文件。将文件保存为 `Polygon.py` 并存放在 `MyAdventures` 文件夹中。\n2. 输入以下代码导入\
