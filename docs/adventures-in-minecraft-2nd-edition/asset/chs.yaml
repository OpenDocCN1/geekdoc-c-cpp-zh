  \n```python\nlineidx = lineidx + 1\n```\n\n11. 一个嵌套的 `for` 循环，读取文件的下一行并在遇到逗号时对其进行分割。注意这里的缩进；`for`\
  \ 必须缩进两层（一层针对函数，一层针对 `for y` 循环），而 `for x` 循环内部的代码需要缩进三层。\n\n```python\nfor x in\
