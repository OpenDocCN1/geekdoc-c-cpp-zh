  \ 3D 世界中去。你可以环绕它们行走、进入内部、放大它们——如果你喜欢，甚至可以让它们爆炸！通过使用最初用于在 2D 屏幕上显示 3D 对象的创意，你可以在\
  \ Minecraft 中编写 3D 对象，化平凡为神奇。\n\n在这场冒险中，你将发现如何使用 `minecraftstuff` 模块来创建 2D 线和形状，结合一点数学知识，你就可以编写一个巨大的时钟，大到你可以站在它正在旋转的指针上（参阅图\
