  \ 循环就会继续：\n\n    ```python\n    while mode != \"missionaccomplished\":\n    ```\n\
  9.  在循环每次运行时获取玩家的位置：\n\n    ```python\n    playerPos = mc.player.getPos()\n    ```\n\
  10. 如果外星飞船的位置不等于目标位置，通过将以下代码输入到程序末尾并相对于 `while` 循环进行缩进，让外星飞船移动到目标位置：\n\n\n\n\n\n\
