  \n# 在你的 Windows PC 或 Apple Mac 上启动 Minecraft\n\n你现在已经在你的 Windows PC 或 Apple Mac\
  \ 上安装了所有需要的软件。但你还没有完全准备好；首先，你需要按照以下步骤启动服务器并将 Minecraft 连接到服务器上：\n\n1. 双击你放在桌面上的\
  \ `AdventuresInMinecraft` 文件夹。\n2. 双击运行 `StartServer` 程序。服务器命令窗口将打开。\n3. 按任意键启动\
  \ Minecraft 服务器。当服务器加载时，你会在屏幕上看到消息，这些消息会持续向你更新服务器的进度。\n4. 当服务器加载完成后，你会看到一条“完成”（Done）消息（参见\
