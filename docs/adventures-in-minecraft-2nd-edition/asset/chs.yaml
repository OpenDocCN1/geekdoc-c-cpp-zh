  \ `x` 和 `z` 上加 1 可以确保迷宫不会建在玩家头上。如果你愿意，可以改变 `y` 坐标在空中构建迷宫：\n```python\npos = mc.player.getTilePos()\n\
  ORIGIN_X = pos.x+1\nORIGIN_Y = pos.y\nORIGIN_Z = pos.z+1\n```\n\n7. `z` 坐标在每行数据结束时变化，因此将其初始化为迷宫的起点。它在程序稍后的位置会变化：\n\
  ```python\nz = ORIGIN_Z\n```\n\n8. 循环文件的每一行。请参见“深入代码”以了解 `readlines()` 函数的作用。`for`\
  \ 循环实际上是在逐行遍历文件中的每一行。每次循环，`line` 变量都持有从文件中读取的下一行：\n```python\nfor line in f.readlines():\n\
  ```\n\n9. 在每个有逗号的地方将行分割成部分。请参见“深入代码”以了解 `split()` 函数的作用。记住，所有属于 `for` 循环体内的行都必须缩进一层：\n\
  ```python\ndata = line.split(\",\")\n```\n\n10. 仔细观察这一步：你现在有了另一个 `for` 循环。这被称为嵌套循环，因为一个循环在另一个循环内部。你的程序在迷宫每一新行开始时重置\
  \ `x` 坐标，因此这必须在绘制整行的 `for` 循环之外完成：\n```python\nx = ORIGIN_X\nfor cell in data:\n\
  ```\n\n\n\n\n11. 从行中读取的每个数字实际上都是作为文本片段（字符串）读取的，因此为了让此程序运行，你必须给数字加上引号（\"\"）。这个 `if`/`else`\
  \ 语句根据刚从 CSV 文件读取的数字来选择是构建一个间隙还是一个墙。`0` 构建一个间隙，其他任何数字都会构建一个墙。请确保这里的缩进正确：`if` 语句缩进了两次，因为它是\
  \ `for cell in data` 循环的一部分，而该循环又是 `for line in f.readlines()` 循环的一部分。这里的变量 `b`\
  \ 很有用，因为它让程序变得更小、更简单。（试着在不使用 `b` 变量的情况下重写这部分，看看我是什么意思！）\n\n```python\nif cell ==\
  \ \"0\":\n    b = GAP\nelse:\n    b = WALL\n\nmc.setBlock(x, ORIGIN_Y, z, b)\nmc.setBlock(x,\
  \ ORIGIN_Y+1, z, b)\nmc.setBlock(x, ORIGIN_Y-1, z, FLOOR)\n```\n\n12. 在 `for cell`\
  \ 循环结束处更新 `x` 坐标。这必须缩进，以便与之前的 `mc.setBlock()` 对齐，因为它仍然是 `for cell in data` 循环体的一部分。\n\
  \n```python\nx = x + 1\n```\n\n13. 在处理每行数据的循环结束处更新 `z` 坐标（这只需要缩进一层，因为它是 `for line\
  \ in f.readlines()` 循环的一部分）。\n\n```python\nz = z + 1\n```\n\n保存你的程序并双重检查所有的缩进是否正确。如果缩进错误，程序将无法正常运行，你将得到一些形状非常奇怪的迷宫！\n\
  \n运行你的程序，一个奇妙（而且相当难解）的迷将在你面前建立。在迷宫中行走，看看你是否可以在不拆除任何墙或不飞行的情况下解决它。图 5-2 显示了迷宫从地面层看的样子。\n\
  \n![image](img/9781119439585-fg0502.png)\n\nFIGURE 5-2 Minecraft 内部迷宫的地面视图\n\n如果你卡住了，你可以稍微“作弊”，飞到空中以获得迷宫的\
  \ 3D 鸟瞰视图，如图 图 5-3 所示。\n\n![image](img/9781119439585-fg0503.png)\n\nFIGURE 5-3 Minecraft\
  \ 内部迷宫的鸟瞰视图\n\n# 构建 3D 打印机\n\n迷宫非常有趣，但既然你已经掌握了基础知识，现在你可以用数据文件做更多的事情！为什么要停留在单层上仅使用两种方块类型进行构建呢？你现在将把你的迷宫程序作为你自己的\
  \ 3D 打印机和 3D 扫描仪的基础，它可以复制树、房屋——事实上，任何你在 Minecraft 中可以构建的东西——并只需点击按钮即可在 Minecraft\
  \ 世界中到处“打印”它们！这实际上是一个方块构建器，但我喜欢称之为 3D 打印机，因为有时你可以看到方块一行一行地构建，就像电脑打印机一行一行打印到纸上，或者打印机一层一层构建结构一样。\n\
  \n你现在编写程序的能力越来越强了，你编写的每个新程序都比上一个大。就像在之前的冒险中，你用函数构建了程序一样，你也将分步骤构建这个程序。\n\n## 手工制作一个小型测试对象进行\
  \ 3D 打印\n\n在你的迷宫程序中，数据存储在 CSV 文件中，文件中的每行代表 Minecraft 世界内部的一行方块。该行中的每一列（用逗号分隔）对应该行方块中的一个方块。这是一个\
  \ 2D 结构，因为它为矩形区域的每个 `x` 和 `z` 坐标存储了一个方块。你在这里构建的迷宫实际上只是 2D 迷宫，因为它们只有一层。它们只是通过 3D\
  \ 方块构建在 3D Minecraft 世界中。\n\n要构建 3D 形状，你还需要在 `y` 维度上进行构建。如果你将 3D 对象仅视为多层或切片，那么你的\
  \ 3D 程序与你的迷宫程序没有太大区别。对于一个大小为 5x5x5 方块的立方体，你只需要存储五层信息。\n\n这其中有一个问题。在处理整个文件之前，你的 Python\
  \ 程序不知道预期会有多少行。它可以假设一个特定的大小，但如果能设计一种可以适用于任何大小对象的灵活 CSV 文件格式将是最好的。\n\n为了解决这个问题，你现在将创建一个如所示的示例\
  \ 图 5-4 来测试你的打印能力。\n\n1.  创建一个新文件，如示例所示 `File` -> `New File`，并命名为 `object1.csv`。\n\
  2.  输入第一行，对象的尺寸。它是 5x5x5。\n3.  第一个数字是 `sizex`（宽度），第二个数字是 `sizey`（高度），第三个数字是 `sizez`（深度）。你需要使用\
  \ `int()` 将这些字符串转换为数字。\n4.  文件中的后续行代表一层方块。该行中的每一列对应一个方块。\n5.  使用 `0` 表示间隙，使用 `1`\
  \ 表示方块。\n6.  确保格式如下：\n\n```csv\n5,5,5\n1,1,1\n...\n```\n\n保存该文件，但不要运行它——它不是 Python\
  \ 程序，而是将被程序使用的数据文件。\n\n既然你已经写好了测试数据，现在是时候编写在 Minecraft 内部构建洞穴的 3D 打印程序了。这个程序与你的迷宫程序非常相似，但它有三个嵌套循环：为\
  \ x、y、z 每个维度各一个循环。\n\n1.  创建一个新文件 `File` -> `New File`，并使用菜单中的 `File` -> `Save As`\
  \ 将其保存为 `printD.py`。\n2.  导入必要的模块：\n\n    ```python\n    import mcpi.minecraft as\
  \ minecraft\n    import mcpi.block as block\n    ```\n\n3.  连接到 Minecraft 游戏：\n\n\
  \    ```python\n    mc = minecraft.create()\n    ```\n\n4.  创建一个常量作为数据文件的文件名。如果你以后想读取不同的不同的文件，可以轻松更改它：\n\
  \n    ```python\n    FILENAME = \"object1.csv\"\n    ```\n\n5.  定义一个 `print3D()`\
  \ 函数。你会在最后的项目中重用这个函数，所以请确保命名正确：\n\n    ```python\n    def print3D(filename, originx,\
  \ originy, originz):\n    ```\n\n6.  就像你编写迷宫构建器时一样，以读取模式打开文件并将所有行读取到 Python 列表中：\n\
  \n    ```python\n    f = open(filename, \"r\")\n    lines = f.readlines()\n    ```\n\
  \n7.  列表中的第一个项索引为 `0`。这是文件中包含元数据的第一行。使用 `split()` 函数将此行拆分成部分。然后将这三个数字存储在变量 `sizex`、`sizey`\
  \ 和 `sizez` 中。你在这里必须使用 `int()` 函数，因为从文件中读取的内容是字符串，但稍后你需要它们是数字以便进行计算。\n\n\n\n\n\n\
  ```python\ncoords = lines[0].split(\",\")\nsizex = int(coords[0])\nsizey = int(coords[1])\n\
  sizez = int(coords[2])\n```\n\n8. 设置一个 `lineidx` 变量来记录你正在处理的 `lines[]` 列表中的行索引。由于你的程序会扫描\
  \ `lines` 列表并读取 3D 对象不同层的数据，因此你不能将其用作循环控制变量：\n\n```python\nlineidx = 1\n```\n\n\
  9. 第一个 `for` 循环扫描从文件中读取的每一层垂直数据。文件的前几行对应在最低 y 层构建的层。你可以在这里添加一个 `postToChat`，这样在\
  \ Minecraft 内部就能看到打印的进度：\n\n```python\nfor y in range(sizey):\n    mc.postToChat(str(y))\n\
  ```\n\n10. 通过给 `lineidx` 变量加 1 来跳过文件中每层之间的空行。记住，这些空行只存在于文件中以便人类阅读，但你的程序必须跳过它们。\n\
  \n```python\nlineidx = lineidx + 1\n```\n\n11. 一个嵌套的 `for` 循环，读取文件的下一行并在遇到逗号时对其进行分割。注意这里的缩进；`for`\
  \ 必须缩进两层（一层针对函数，一层针对 `for y` 循环），而 `for x` 循环内部的代码需要缩进三层。\n\n```python\nfor x in\
  \ range(sizex):\n    line = lines[lineidx]\n    lineidx = lineidx + 1\n    data\
  \ = line.split(\",\")\n```\n\n12. 现在启动第三个 `for` 循环，扫描刚刚读取的行中的每个区块并在 Minecraft 内部构建它们。`for\
  \ z` 循环缩进三层，循环体缩进四层，因此务必特别注意缩进；否则你将得到形状非常奇怪的对象！\n\n```python\nfor z in range(sizez):\n\
  \    blockid = int(data[z])\n    mc.setBlock(originx+x, originy+y, originz+z,\n\
  \                blockid)\n```\n\n13. 最后，输入主程序的代码，这些代码完全没有任何缩进。这些行读取玩家位置，然后要求 `print3D()`\
  \ 函数在你站的位置的侧面打印你的 3D 对象：\n\n```python\npos = mc.player.getTilePos()\nprint3D(FILENAME,\
  \ pos.x+1, pos.y, pos.z+1)\n```\n\n保存程序并运行它，看看会发生什么！在 Minecraft 中移动到不同位置并运行程序。每当你运行程序，玩家附近都会生成一个空心的石头岩洞！图\
