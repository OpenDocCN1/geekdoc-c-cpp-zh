  \ Minecraft。一艘飞船从玩家正上方的天空降临，此时玩家正处于危险之中——这些外星人`并不`友善，它们在完成任务之前不会放弃。\n\n在下一个程序中，你将使用\
  \ `MinecraftShape` 和你在“方块朋友”程序中使用的编程技术来创建一个外星飞船（参见图 7-5），它悬停在世界表面上方追逐你的玩家，试图移动到他的上方。当它成功时，会用光束将他传送到飞船上。\n\
  \n![image](img/9781119439585-fg0705.png)\n\nFIGURE 7-5 创建外星飞船为你的 Minecraft 游戏增色！\n\
  \n你使用 `MinecraftShape` 创建外星飞船，就像在木马程序一样，形状中的每个块都有自己的相对位置和方块类型。图 7-6 显示了形状方块从侧面和俯视图的位置。\n\
  \n![image](img/9781119439585-fg0706.png)\n\nFIGURE 7-6 外星飞船方块位置\n\n与“方块朋友”程序一样，外星入侵的代码分为两部分。第一部分是决定飞船下一步动作的规则；第二部分是让外星飞船向玩家移动的代码。\n\
  \n当外星飞船追逐玩家时，它会通过在聊天框发送消息（例如“你无法逃避一辈子”）来嘲讽他。这些信息是从挑衅列表中随机选取的（参见图 7-7）。\n\n![image](img/9781119439585-fg0707.png)\n\
  \nFIGURE 7-7 外星飞船正在追逐。\n\n决定外星飞船下一步执行什么的规则基于三种模式之一：\n\n*   **着陆 (Landing)：** 当程序启动时，这是飞船的初始模式，因为飞船是从玩家正上方的天空降临的。\n\
  *   **攻击 (Attack)：** 飞船一着陆就开始攻击，不断追逐玩家直到它直接位于玩家正上方，从那里它将用“光束”将玩家传送到内部。\n*   **任务完成\
  \ (Mission accomplished)：** 该模式在玩家被传送到飞船内部且外星人准备好将其送回地面后设置。此时程序结束，玩家被传回。\n\n一旦外星飞船捕获了玩家，程序将建造一个阴暗的房间来关押他，并将其位置更改为房间内部（参见图\
  \ 7-8）。然后外星人会向玩家发送消息，最后通过将位置改回原状并清理房间，将他传回。\n\n![image](img/9781119439585-fg0708.png)\n\
  \nFIGURE 7-8 外星飞船内部\n\n使用以下步骤创建外星入侵程序：\n\n1.  打开 IDLE，点击 New ⇒ New File 并将文件保存为\
