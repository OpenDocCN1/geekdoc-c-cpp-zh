  \n互联网上有许多“实时”数据。我在研究此内容时发现的数据源是丁汉市的停车场数据：`http://data.nottinghamwise.org.uk/parking.xml`。这些数据每五分钟更新一次，跟踪进出停车场的情况。我写了一个\
