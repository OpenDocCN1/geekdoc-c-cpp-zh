  \ 1 构建，使用选项 7 拆除即可。\n\n## 从复制房间扫描\n\n你以前写过程序的这部分，即在你的 `scan3D.py` 程序中，所以你可以通过一些小修改后使用它。\n\
  \n\n\n\n\n# 扫描房间\n\n1. 将 `scan3D()` 函数替换为以下代码。这段代码与 `scan3D.py` 程序几乎相同，但添加了**粗体所示的行**，以便在\
