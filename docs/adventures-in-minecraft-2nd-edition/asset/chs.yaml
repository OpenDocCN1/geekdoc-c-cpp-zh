  \ Minecraft 启动器中创建一个配置来运行 1.12 版本的游戏。使用此版本的游戏而不是最新版本，1.12。这意味着你需要在 Minecraft 启动器中创建一个配置来运行\
  \ 1.12 版本的游戏。使用此版本的游戏而不是最新版本，1.12。这意味着你需要在 Minecraft 启动器中创建一个配置来运行 1.12 版本的游戏。使用此版本的游戏而不是最新版本，1.12。这意味着你需要在\
  \ Minecraft 启动器中创建一个配置来运行 1.12 版本的游戏。（*注：原文此处存在逻辑重复，翻译已按原文保留*）\n\n要配置 Minecraft，遵循以下步骤：\n\
  \n1. 如图 1-7 所示选择 `AdventuresInMinecraft`。\n2. 点击“开始游戏”（Play）启动。\n3. 从菜单中点击“多人游戏”（Multiplayer）。\n\
  4. 从“多人游戏”菜单中点击“直接连接”（Direct Connect）。\n5. 在“服务器地址”中输入 `localhost` 并点击“加入服务器”。\n\
  \n图 1-7\n![image](img/9781119439585-fg0107.png)\n\n## Minecraft 服务器\n\n当你结束今天的冒险时，需要断开\
  \ Minecraft 服务器。通过按 Escape 键返回菜单并点击“断开连接”（Disconnect）来实现。\n\n你还应该通过在服务器命令窗口中输入 `stop`\
  \ 并按回车来安全地关闭服务器。在屏幕上，你会看到一系列更新，告诉你关闭过程中发生的情况。\n\n# 创建程序\n\n恭喜！你已经设置好了电脑，并且 Minecraft\
  \ 已经在上面运行。你可能觉得设置过程有点无聊，但现在已经完成了。现在是时候有趣的事情了——创建你的第一个程序“Hello Minecraft World”。\n\
  \n首先，你需要通过以下操作启动 Python 并打开 IDLE：\n\n- 在树莓派上：选择菜单 ⇒ Python 3 (IDLE)。\n- 在 PC 上：点击开始按钮并选择\
  \ Python 3.6 ⇒ IDLE。\n- 在 Mac 上：点击 Finder 栏上的 Go，选择应用程序 ⇒ Python 3.6。双击 IDLE。\n\n\
  Python Shell 窗口打开。\n\n一旦 Python Shell 加载，你就可以在 IDLE 中创建一个新程序。你在这里创建的程序将不会执行任何复杂操作。正如程序员总是从编写“hello\
  \ world”程序开始一样，你现在将创建一个 Hello Minecraft World 程序来检查电脑上的所有内容都已正确安装。方法如下：\n\n1. 通过\
  \ IDLE 菜单选择“文件”（File）⇒“新建文件”（New File）创建一个新文件。\n2. 通过 IDLE 编辑器菜单选择“文件”（File）⇒“保存”（Save）将文件保存到\
  \ `MyAdventures` 文件夹中。\n\n\n\n\n*   在 Raspberry Pi 上：在目录下拉列表中选择 `/home/pi`，在文件夹浏览器中双击\
  \ `Desktop`、`AdventuresInMinecraft-Pi` 和 `MyAdventures`。\n*   在 PC 上：点击左侧导航窗上的 `Desktop`，在文件夹资源管理器中双击\
  \ `AdventuresInMinecraft-PC` 和 `MyAdventures`。\n*   在 Mac 上：打开文件夹浏览器（使用 Save 旁边的向下箭头），选择\
  \ `Desktop`、`AdventuresInMinecraft-Mac`，然后选择 `MyAdventures`。\n\n4. 给你的新文件起一个名字。输入文件名\
  \ `HelloMinecraftWorld.py` 并点击 Save。文件末尾添加的 `.py` 告诉电脑该文件是一个 Python 程序。\n\n5. 现在是开始编程了！在\
  \ IDLE 编辑器窗口中输入以下代码以启动 Hello Minecraft World 程序。确保字母大小写正确，因为 Python 是 `case-sensitive`\
  \ 的：\n\n```\nimport mcpi.minecraft as minecraft\nmc = minecraft.Minecraft.create()\n\
  mc.postToChat(\"Hello Minecraft World\")\n```\n\n6. 通过 IDLE 编辑器菜单选择 File  Save 保存你的程序。\n\
