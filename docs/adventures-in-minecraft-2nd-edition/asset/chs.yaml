  \ 3D 对象。当多边形组合在一起创建 3D 对象时，它们被称为 `faces`（面）。你可以通过这种方式创建一些很不起的结构。看看图 6-7，它展示了由许多多边形组成的曼哈顿岛天线（实现方法参见\
