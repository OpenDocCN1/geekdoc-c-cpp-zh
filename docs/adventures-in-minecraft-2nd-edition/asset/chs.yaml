  # 使用 for 循环\n\n使用单个方块构建允许你构建喜欢的任何东西，但这有点像在计算机屏幕上手工绘制复杂的图片，一个点一个点地画。你需要一种可以重复方块的方法，这样你就可以在不增加程序规模的情况下构建更大的结构。\n\
  \n幸运的是，和任何编程语言一样，Python 有一种名为“循环”的功能。你已经在冒险 2 中通过 `while True:` 游戏循环遇到过循环。循环只是在\
  \ Python 这样的编程语言中多次重复某事的方法。你在这里使用的循环被称为 `for` 循环，有时被称为计数循环，因为它会计数固定次数。\n\n## 使用\
  \ for 循环构建多个方块\n\n要理解 `for` 循环是如何工作的，请按照以下步骤使用 Python Shell 尝试运行一下：\n\n1.  点击 Python\
  \ Shell 窗口，就在最后一个 `>>>` 提示符的右侧。\n2.  输入以下内容并按下键盘上的回车键：\n    ```\n    for a in range(10):\n\
  \    ```\n    Python 还没有执行任何操作，因为它在等待属于循环的程序语句（这些通常被称为循环体）。\n3.  Python Shell 会自动为你下一行缩进一个级别，这样\
  \ Python 就知道你的 `print()` 语句属于 `for` 循环。现在输入这个 `print()` 语句：\n    ```\n    print(a)\n\
  \    ```\n4.  按两次回车键。第一次按下标记了 `print()` 语句的结束；第二次按下告诉 Python Shell 你已经完成了循环。\n\n\
  你现在应该能在 Python Shell 屏幕上看到打印出的 0 到 9 的数字。\n\n## 使用 for 循环构建一座巨塔\n\n你想在 Minecraft\
  \ 世界中用方块建造一座巨大的塔吗？既然你已经了解了 `for` 循环，你就可以做到。只需按照以下步骤操作：\n\n1.  从菜单中选择文件 ⇒ 新建文件开始编写新程序。从菜单中选择文件 ⇒ 另存为，并将其命名为\
  \ `tower.py`。\n2.  像往一样，导入你需要的模块：\n    ```\n    import mcpi.minecraft as minecraft\n\
  \    import mcpi.block as block\n    ```\n3.  连接到 Minecraft 游戏：\n    ```\n    mc\
  \ = minecraft.Minecraft.create()\n    ```\n4.  如果你在玩家所在的地方建造塔，会更容易找到，所以你的首要任务是通过输入识别玩家的位置：\n\
  \    ```\n    pos = mc.player.getTilePos()\n    ```\n5.  你的塔将有 50 个方块高，所以用一个计数 50\
  \ 次的 `for` 循环开始构建。不要忘记行尾的冒号（`:`）：\n    ```\n    for a in range(50):\n    ```\n6.\
  \  下一行被缩进，因为它属于 `for` 循环的体。*(注：此处原文存在大量重复的占位文本，翻译已按要求处理逻辑)*\n\n\n\n你刚刚创建的这个程序奇妙之处在于，它允许你随时走到\
  \ Minecraft 的任何位置，并清理一个 50x50x50 的区域；只需从菜单中选择“运行 ⇒ 运行模块”并运行程序，附近的树木、山脉和一切都会在你眼前奇迹般地消失！\n\
  \n在 Minecraft 世界中移动并重新运行你的程序，就可以在玩家前方清理出大量空间。\n\n## 从键盘读取输入\n\n你对 `clearSpace.py`\
  \ 程序可以做的另一项有用操作是让它能够轻松地更改清理区域的大小。这样，如果你只想建造一个小型结构，就可以清理一个较小的空间；但如果你知道自己要建造许多大型结构，就可以先清理出一块巨大的空间。\n\
  \n为了实现这一点，你将使用一种名为 `input()` 的新 Python 语句来先从键盘读取一个数字。然后，你可以前往 Minecraft 世界的任何部分，运行程序，并只需输入一个代表你想清理的区域大小的数字；你的程序就会为你清理掉所有空间。这意味着每当你想在\
  \ Minecraft 世界中清理不同大小的区域时，都不需要反复修改程序。\n\n现在你已经理解了 `input()` 的作用，是时候把它加入程序了。要做到这一点，你只需要对\
  \ `clearSpace.py` 程序进行两处微小的修改。按照以下步骤操作：\n\n1. 使用 `input()` 要求用户输入一个代表清理空间大小的数字，并将该数字存储在一个名为\
  \ `size` 的变量中。就像在 冒险 2 中你使用 `str()` 将内容转换为字符串一样，在这里你使用 `int()` 将 `input()` 返回的字符串转换为可以进行计算的数字。尝试不带\
  \ `int()` 运行这一行看看会发生什么！只输入加粗标记的新行：\n\n   ```\n   pos = mc.player.getTilePos()\n\
  \   size = int(input(\"size of area to clear?\"))\n   ```\n\n2. 修改 `setBlocks()`\
  \ 那一行，使其不再使用数字 50，而是使用你的新变量 `size`：\n\n   ```\n   mc.setBlocks(pos.x, pos.y, pos.z,\n\
  \   pos.x + size, pos.y + size, pos.z + size,\n   block.AIR.id)\n   ```\n\n3. 保存程序，并通过菜单中选择“运行\
  \ ⇒ 运行模块”来运行。\n\n现在移动到 Minecraft 世界中有很多树木或山脉的地方。在提示时向 Python Shell 窗口输入一个数字——也许选择\
  \ 100 之类的数字——然后按下键盘上的 Enter 键。玩家附近所有的树木和山脉应该奇迹般地消失，正如图 3-4 所示，你将拥有良好的空间来建造其他结构！\n\
  \n![image](img/9781119439585-fg0304.png)\n\nFIGURE 3-4 运行 `clearSpace.py` 后，你获得了一个巨大的空旷区域来建造更精彩的结构！\n\
  \n保留这个小工具程序，因为当你以后需要在 Minecraft 世界中清理一点空间时，它会很有用。\n\n## 建造房屋\n\n在生存模式下玩 Minecraft\
  \ 时，你需要做的事情之一就是为玩家建造一个避难所，保护他免受 Minecraft 夜晚潜伏的危险。如果你能按一下按钮就盖房子呢？幸运的是，在为 Minecraft\
  \ 编程时，你可以将复杂的任务变为仅仅是——按一下按钮。\n\n在 `clearSpace.py` 程序中，你学习了如何仅用一条编程语句将大量方块设置为相同的方块类型。现在你将学习如何使用相同的技术来快速建造房屋。\n\
  \n建造房屋的一种方法可能是使用不同的 `setBlocks()` 分别建造每面墙。为此，你需要使用四个独立的 `setBlocks()`，并进行大量的数学计算来算出每面墙每个角落的所有坐标。幸运的是，有一种更快的方法建造空心矩形结构：你只需要建造一个巨大的立方体空间，然后再次使用\
  \ `setBlocks()` 并配合稍不同的坐标，用 `AIR` 方块类型掏空内部。\n\n在继续之前，你需要花一些时间确保理解了与你要建造的房屋设计相关的数学知识，因为你需要正确的坐标来编写程序。图\
  \ 3-5 显示了房屋设计的草图，并标记了你建造时所需的所有重要坐标。当你建造复杂物体时，在纸上画草图并先算出所有重要坐标是非常重要的。这是一个非常特殊的房子，因为你的\
  \ Python 程序会自动计算门口和窗户的大小和位置。稍后你就会明白为什么这很重要了。\n\n![image](img/9781119439585-fg0305.png)\n\
  \nFIGURE 3-5 纸上的房屋设计，带有所有重要的坐标\n\n既然你已经有了房屋的设计，尝试按照以下步骤建造它：\n\n1. 从菜单选择 File ⇒ New\
  \ File 开始一个新程序。\n\n2. 从菜单选择 File ⇒ Save As 保存程序，并命名为 `buildHouse.py`。\n\n3. 导入所需的模块：\n\
  \n   ```python\n   import mcpi.minecraft as minecraft\n   import mcpi.block as block\n\
  \   ```\n\n4. 连接到 Minecraft 游戏：\n\n   ```python\n   mc = minecraft.create()\n  \
  \ ```\n\n5. 使用常量表示房屋的大小。在代码中使用常量代替数字 `20` 可以让你更容易更改房屋的大小：\n\n   ```python\n   SIZE\
  \ = 20\n   ```\n\n6. 获取玩家的位置以便在附近建造房屋：\n\n   ```python\n   pos = mc.getTilePos()\n\
  \   ```\n\n7. 将玩家的 x、y、z 坐标存储在新变量中。这使得接下来的几个语句更容易编写，并且房屋将建造在玩家上方：\n\n   ```python\n\
  \   x = pos.x+2\n   y = pos.y\n   z = pos.z\n   ```\n\n8. 计算名为 `midx` 和 `midy` 的变量，它们是房屋正面的中心点。这让你以后更容易算出窗户和门口的坐标以便当你更改房屋大小时，窗户和门口会改变位置并完美匹配。\n\
  \n   ```python\n   midx = x + SIZE/2\n   midy = y + SIZE/2\n   ```\n\n9. 以 3D 区域建造房屋的外壳。你可以选择任何方块类型，但这里用用岩是一个不错的开始，让它像一座老房子：\n\
  \n   ```python\n   mc.setBlocks(x, y, z,\n   x + SIZE, y + SIZE, z + SIZE,\n   block.COBBLESTONE.id)\n\
  \   ```\n\n10. 现在用空气掏空房屋内部。注意你如何使用设计中的简单数学计算来算出房屋内部空气的坐标，这些是相对于房屋岩石外角的相对坐标：\n\n\
  \    ```python\n    mc.setBlocks(x + 1, y, z + 1,\n    x + SIZE - 1, y + SIZE -\
  \ 1, z + SIZE - 1,\n    block.AIR.id)\n    ```\n\n11. 再次使用 `AIR` 方块类型为门口挖出一个空间。在这里不会使用普通的\
  \ Minecraft 门，因为这是一座大房子。相反，你创建一个高三块、宽两块的大门。你的门需要位于房屋正面的中间，所以 `midx` 给了你那个中间的 x 坐标：\n\
  \n    ```python\n    mc.setBlocks(midx - 1, y, z,\n    midx + 1, y + 3, z,\n   \
  \ block.AIR.id)\n    ```\n\n\n\n12. 使用 `GLASS` 类型的区块刻出两个窗户。由于这是一座大房子，你将窗户建在距离房屋边缘\
  \ 3 个方块以及距离房屋正面点 3 个方块的地方。如果你更改了 `SIZE` 常量并重新运行程序，程序中的所有计算会自动调整所有物体的位置，门口和窗户将处于正确的位置，这样看起来仍然像是一座房子。\n\
  \n```\nmc.setBlocks(x + 3, y + SIZE - 3, z, midx - 3, midy + 3, z, block.GLASS.id)\n\
  mc.setBlocks(midx + 3, y + SIZE - 3, z, x + SIZE - 3, midy + 3, z, block.GLASS.id)\n\
  ```\n\n13. 添加一个木制屋顶：\n\n```\nmc.setBlocks(x, y + SIZE - 1, z, x + SIZE, y + SIZE,\
  \ z + SIZE, block.WOOD.id)\n```\n\n14. 现在，添加一块羊毛地毯：\n\n```\nmc.setBlocks(x + 1,\
  \ y - 1, z + 1, x + SIZE - 2, y - 1, z + SIZE - 2, block.WOOL.id, 14)\n```\n\n你会发现\
  \ `setBlocks()` 的末尾多了一个数字。这个数字设置地毯的颜色；在这种情况下，它是数字 14，代表红色。这在接下来的深入研究代码侧边栏中会有解释。\n\
  \n保存你的程序，然后移动到 Minecraft 世界中一个有空间的地方，通过从菜单选择 Run（运行）⇒ Run Module（运行模块）来运行你的程序。你应该能看到你的房子在眼前奇迹般地物质化！走进去探索一下。抬头看看屋顶，透过窗户向外看，惊讶于你从零开始建造这栋房子有多快！（参见图\
  \ 3-6）。\n\n![image](img/9781119439585-fg0306.png)\n\n图 3-6 这座房子是由 Python 程序自动建造的。\n\
  \n不要忘记 `buildHouse.py` 总是相对于你玩家的位置来建造房子。在 Minecraft 世界中移动并再次运行 `buildHouse.py` 来建造另一栋房子。你可以在整个\
  \ Minecraft 世界中到处建造房子——这有多酷吗？\n\n# 建造多栋房子\n\n建造一栋房子很有趣，但为什么要停于此呢？回想你在这次冒险之前的 `tower.py`\
  \ 程序，很容易编写一个 `for` 循环来重复固定次数的程序语句。因此，可能通过多次循环你的盖房子程序来建造一整条街的房子，甚至是一整座城镇。\n\n在在此之前，你将稍微改进你的盖房子程序，以确保它不会变得过于巨大且难以管理。\n\
  \n## 使用 Python 函数\n\n你以后可能想做的事情是建造一个拥有许多不同设计房子的整个城镇。整个城镇的程序可能会变得很大很复杂，但幸运的是 Python\
  \ 编程语言中有一个功能可以帮助你将复杂性封装成小的可重用程序代码块。它被称为**函数**。\n\n在将你正在使用的 `buildHouse.py` 程序改为使用函数建造房子之前，尝试在\
  \ Python Shell 中尝试一些函数，以确保你理解这个概念：\n\n1. 点击 Python Shell 窗口将其置于顶。\n2. 在 Shell 窗口中输入以下内容，定义一个名为\
  \ `myname` 的新函数：\n\n```\ndef myname():\n```\n\n`def` 表示“定义一个新函数，这里是它的名字”。就像早的 `while`、`if`\
  \ 和 `for` 语句一样，你必须在行尾加一个冒号（`:`），这样 Python 知道预期你提供其他程序语句作为该函数的体。\n3. Python Shell\
  \ 会自动为你缩进下一行，这样 Python 就知道它们是函数的一部分。输入几行 `print` 语句，打印你的名字和关于你的信息。当你输入每行时发现什么都没有发生，不要感到惊讶；这是正确的。耐心等待，一切很快就会明朗的！\n\
  \n```\nprint(\"my name is David\")\nprint(\"I am a computer programmer\")\nprint(\"\
  I love Minecraft programming\")\n```\n\n4. 按两次键盘上的 Enter 键，Python Shell 会识别到你已经完成了缩进语句的输入。\n\
  5. 通过输入它的名称并带有括号来要求 Python Shell 运行此函数：\n\n```\nmyname()\n```\n\n6. 尝试多输入几次 `myname()`\
  \ 看看发生了什么。\n\n起初，你向 Python Shell 输入指令但什么都没有发生，这可能有点奇怪。通常当你在 Python Shell 中输入时，事情一输入就会发生，为什么不起作用？这次你做了一些不同的事情：你“定义”了一个名为\
  \ `myname` 的函数并让 Python 记住那些语句。现在，每当你输入 `myname()`，它就会运行那些存储的语句。（注意：文本包含为了保留上下文而保留的重复指令）。\n\
  \n\n\n\n保存你的程序，然后移动到 Minecraft 世界中空间足够的地方，并运行程序。如图 3-7 所示，你应该能看到一条一眼望不到的、由五栋房屋组成的街道！控制玩家进入每栋房子，确保它们都已正确建造。\n\
  \n![image](img/9781119439585-fg0307.png)\n\n图 3-7 用 Python 程序自动建造的由五栋相同房屋组成的街道\n\
  \n# 添加随机地毯\n\n到此时，你的 Minecraft 世界中应该已经有了大量的房子，而且看起来非常棒。仅仅通过几行 Python 代码，你已经建造了一些大型工程结构！\n\
  \n然而，你可能觉得有一一整条完全相同的房屋开始显得有些单调了。你该如何让这些房屋略有不同，从而为你的街道增添趣味呢？\n\n其中一种方法是编写几个不同的 `house()`\
  \ 函数，例如 `cottage()`、`townHouse()` 甚至 `maisonette()`，并修改你的程序在不同地方使用这些不同的函数，为你的街道设计增加一些多样性。\n\
  \n另一种让你的结构更有趣的方法是稍微改变它们的部分（例如地毯），让它们在每次运行程序时都不同。这样一来，即使是你——这个程序员，在探索完所有的房子之前，也不会完全知道自己到底创造了什么！\n\
  \n### 生成随机数\n\n计算机是非常精确的机器。在日常生活的许多方面，我们都依赖计算机的可预测性，让它在每次程序运行时都执行相同的操作。当你向银行账户存入\
  \ £10 时，你希望确保每次都能准确地将 £10 进入存储余额的计算机内存部分，且万无一失。因此，对于这样一个精确的系统来说，随机性的概念似乎非常反常。\n\n\
  然而，随机性真正重要的一个领域是游戏设计。如果游戏每次执行的操作都完全相同，它们将变得太容易玩——毫无趣味或挑战性性。你玩的几乎每一款电脑游戏都包含某种随机性，让每次的情况都略有不同，从而保持你的兴趣。\n\
  \n幸运对于你的 Python 编程来说，Python 语言有一个内置模块可以为你生成`随机数`，所以你不需要自己编写代码；只需使用这个内置的随机数生成器即可。\n\
  \n为了确保你了解这些随机数是什么样的，请在 Python Shell 中尝试一下：\n\n1. 点击 Python Shell 窗口使其置于顶层。\n2. 导入\
  \ `random` 模块以便使用内置的随机函数，输入：\n   ```\n   import random\n   ```\n3. 让程序生成一个 1 到 100\
  \ 之间的随机数并打印到屏幕上：\n   ```\n   print(random.randint(1,100))\n   ```\n   你应该看到屏幕上出现一个\
  \ 1 到 100 之间的数字。再次输入 `print` 语句。这次你得到了什么数字？\n4. 现在使用 `for` 循环打印许多随机数。确保对第二行进行缩进，这样\
  \ Python 才会知道 `print` 语句是 `for` 循环的一部分：\n   ```\n   for n in range(50):\n      \
  \ print(random.randint(1,100))\n   ```\n`randint()` 函数括号内的两个数字告诉它你想要它生成的数字范围；`1`\
  \ 是你预期它生成的最小数字，`100` 是最大的数字。\n\n## 铺设地毯\n\n在之前的冒险中，你在 `setBlocks()` 函数中使用了一个额外的数字，通过\
  \ `WOOL` 的额外数据将羊毛地毯的颜色设为红色。`WOOL` 允许的额外数据数字范围是 0 到 15 ——换句话说，有 16 种颜色可以选择。现在按照以下步骤修改你的房屋建造程序，生成一个随机数，并将其作为房屋内地毯\
  \ `WOOL` 的颜色：\n\n1. 通过菜单中的文件 ⇒ 另存为 保存你的 `buildStreet.py`，并命名为 `buildStreet2.py`。\n\
  2. 在程序顶部添加此导入语句以获取随机数生成器的访问：\n   ```\n   import random\n   ```\n3. 修改你的 `house()`\
  \ 函数，使其每次被调用时都生成一个随机的地毯颜色。由于 `WOOL` 可以具有 0 到 15 之间的额外数据值，这就是你需要生成的随机数范围。将随机数存储在变量\
  \ `c` 中，这样铺设地毯的行就不会变得太长且难以阅读，并确保这两行都正确地缩进，因为它们都是 `house()` 函数的一部分：\n   ```\n   c\
  \ = random.randint(0, 15)\n   mc.setBlocks(x+1, y+1, z+1, x+SIZE-1, y+1, z+SIZE-1,\
  \ block.WOOL.id, c)\n   ```\n4. 保存你的程序。\n\n现在，你需要在 Minecraft 世界中找一个有足够空间建造更多的房子！\n\
  \n\n\n\n\n*   列出其他你可能对你的街道进行随机化的项目。也许你可以通过走在你自己的街道上做些研究，看看房子之间有何不同。定义更多的房屋函数，每种类型一个，并尝试构建具有许多不同风格房屋的更复杂的街道。\n\
  *   和朋友们聚在一起，将你所有不同的房屋建筑程序合并成一个大程序。用它在你的世界里建立一个由不同风格房屋组成的整个社区。当你走在新镇里闲逛时，惊叹于房屋设计的丰富多样性吧！\n\
  \n![image](img/9781119439585-3-badges-unlocked.png)\n\n成就解锁：Minecraft 中卓越建筑的设计师和惊人巨型结构的建造者！\n\
  \n![image](img/9781119439585-ch04.png)\n\n让 Minecraft 游戏变得更有趣的一种方法是让它根据玩家周围发生的情况来改变行为。当你在游戏世界中移动时，你面临的选择取决于你已经做过了什么，这使得游戏每次玩起来都略有不同。Minecraft\
  \ API 允许你通过查找你正站在哪个方块上以及检测何时用剑击中方块来与方块进行交互。\n\n在这场冒险中，你首先将通过编写一个魔法桥程序来学习与方块交互的基础知识。这座桥很特别，因为当你走在水面上或进入空中时，一座桥会魔法般地出现在你面前确保你的安全。很快，你的\
  \ Minecraft 世界将布满桥。你的魔法桥建造器版本 2 将使用 Python 列表来记住你在哪里建造了桥，并在你再次落在安全地面时，让它在你的眼前表演消失术！\n\
  \n最后，你将学习如何感知方块是否被击中，然后使用你的魔法桥构建一个令人兴奋的寻藏游戏，寻找并收集随机出现在空中的宝藏，并配备制导信标和计分系统。\n\n在这场冒险中，你的工作就像一个真正的软件工程师，一个函数一个函数构建一个大型程序，最后在最后将它们缝合在一起，成为一个令人兴奋的大程序。系好安全带，仔细注意指令。这将是一段通往天空的精彩之旅！\n\
  \n# 找出你正站在哪里\n\n你已经在 冒险 2 中学习过，通过读取 `getTilePos()` 的坐标可以追踪玩家的位置。这些坐标代表了 Minecraft\
  \ 世界中你的玩家 Steve 此时所在位置的 x、y 和 z 坐标。你使用这些坐标来感知 Steve 是否站在一个魔法地垫上，或者使用地理围栏（geo-fencing）判断他是否站在田野里。\n\
  \n然而，除非你的程序维护了 Minecraft 世界中每个方块精确位置的详细地图，否则随着程序变得越来越复杂，仅通过位置进行感知将不够灵活。你始终可以维护自己的详细地图——但既然\
  \ Minecraft 已经在计算机内存中存储了这些信息以便在屏幕上显示 3D 世界，为什么要费那个劲呢？\n\n幸运的是，Minecraft API 还包含一个\
  \ `getBlock()` 函数。该函数让你完全访问 Minecraft 的内存世界地图，通过坐标，你可以用它获取每一个方块的信息——不仅是 Steve 所在的方块，而是\
  \ Minecraft 世界中每个位置的每一个方块。\n\n你还在 冒险 3 中看到，通过方块类型可以更改 Minecraft 世界中的任何方块。幸运的是，`setBlock()`\
  \ 和 `getBlock()` 是成对工作的，所以如果你用 `setBlock()` 使用一个方块 ID，紧接着使用 `getBlock()`，你就会得到相同的方块\
  \ ID。\n\n很快你将在 Minecraft 中构建另一个令人兴奋的游戏，但你的程序将会很大。构建大型程序的最佳方法是先构建小程序，一旦确定它们可以工作，再将它们全部组合在一起。让我们从一个简单的程序开始让这个想法变为现实，它会告诉你玩家是否正站在安全的地方。\n\
  \n## 找出你的脚是否踩在地上\n\n启动 Minecraft 和 IDLE，如果你在 PC 或 Mac 上操作，也请启动服务器。到目前为止你应该已经练习过启动这些内容了，但如果你需要任何提醒，请参考\
  \ 冒险 1。你现在将构建一个程序，提供关于玩家精确位置的重要信息。在建造通往空的魔法桥之前，你需要先找出他的脚是否踩在地上。\n\n1.  通过选择文件 ⇒ 新建文件（File\
