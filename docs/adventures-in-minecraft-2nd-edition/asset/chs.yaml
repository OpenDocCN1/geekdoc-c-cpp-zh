  \n图 6-4 `drawSphere()` 在 (x,y,z) 中心周围创建一个球体\n\n\n\n\n\n在看到了如何在 Minecraft 中创建圆圈和直线之后，也许你就能知道如何创建图\
  \ 6-1 中的时钟了。表盘就是一个大圆，而每根指针都是一条线。现在到了最困难的部分——确定将线放在哪里以及如何让它们移动起来。\n\n在冒险的这一部分，你将使用\
  \ `trigonometry`（三角函数）通过将指针的角度转换为表盘上的 `x` 和 `y` 坐标来确定指针指向的位置（参见图 6-5）。你将首先用方块绘制指针，然后通过绘制\
  \ `AIR` 将其移除，最后在新位置再次绘制它们，从而让指针看起来像在移动。\n\n![image](img/9781119439585-fg0605.png)\n\
  \nFIGURE 6-5 在表盘上确定指针的位置\n\n要创建你的时钟，请遵循以下步骤：\n\n1.  打开 IDLE 并创建一个新文件，为 Minecraft\
  \ 时钟创建一个新程序。将文件保存为 `MinecraftClock.py` 并放在 `MyAdventures` 文件夹中。\n\n2.  输入以下代码导入\
  \ `minecraft`、`block`、`minecraftstuff`、`time`、`datetime` 和 `math` 模块：\n\n    ```python\n\
  \    import mcpi.minecraft as minecraft\n    import mcpi.block as block\n    import\
  \ mcpi.minecraftstuff as minecraftstuff\n    import time\n    import datetime\n\
  \    import math\n    ```\n\n3.  创建一个函数 `findPointOnCircle()`。当你向此函数传递圆心和指针的角度时，该函数将返回指针的位置，如图\
  \ 6-5 所示。\n\n    ```python\n    def findPointOnCircle(cx, cy, radius, angle):\n\
  \        x = cx + math.sin(math.radians(angle)) * radius\n        y = cy + math.cos(math.radians(angle))\
  \ * radius\n        x = int(round(x, 0))\n        y = int(round(y, 0))\n       \
  \ return(x, y)\n    ```\n\n4.  连接到 `Minecraft` 并创建 `MinecraftDrawing` 对象：\n\n  \
  \  ```python\n    mc = minecraft.Minecraft.create()\n    mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n\
  \    ```\n\n5.  通过输入代码获取玩家的当前位置：\n\n    ```python\n    pos = mc.player.getTilePos()\n\
  \    ```\n\n6.  现在你将为时钟中心（玩家位置上方 25 个方块处）、表盘半径以及时针长度创建变量：\n\n    ```python\n   \
  \ clockMiddle = pos\n    clockMiddle.y = clockMiddle.y + 25\n    CLOCK_RADIUS =\
  \ 20\n    HOUR_HAND_LENGTH = 10\n    MIN_HAND_LENGTH = 18\n    SEC_HAND_LENGTH =\
  \ 20\n    ```\n\n7.  使用 `drawCircle()` 绘制表盘：\n\n    ```python\n    mcdrawing.drawCircle(\n\
  \        clockMiddle.x, clockMiddle.y, clockMiddle.z,\n        CLOCK_RADIUS, block.DIAMOND_BLOCK.id)\n\
  \    ```\n\n8.  程序还没有完成，但你现在应该运行它，检查一切是否正常工作，以及玩家上方是否出现了一个大圆（表盘）。\n\n接下来，为你的程序添加时钟指针的代码：\n\
  \n1.  启动一个无限循环。此点之后的所有代码将位于该循环内部。\n\n    ```python\n    while True:\n    ```\n\n\
  2.  使用 `datetime.datetime.now()` 函数询问电脑现在的时间。然后你将时间拆分为小时、分钟和秒。因为你的时钟是 12 小时制而非 24\
  \ 小时制，如果时间在中午之后，你需要从小时中减去 12（例如，如果时间是 14:00，则显示为 2 点）。通过输入以下代码来实现：\n\n    ```python\n\
  \    timeNow = datetime.datetime.now()\n    hours = timeNow.hour\n    if hours >=\
  \ 12:\n        hours = timeNow.hour - 12\n    minutes = timeNow.minute\n    seconds\
  \ = timeNow.second\n    ```\n\n3.  绘制时针。它的角度是 360 度除以 12 小时乘以当前小时。使用 `findPointOnCircle()`\
  \ 找到指针末端的 `x` 和 `y` 位置，并输入以下代码使用 `drawLine()` 绘制指针：\n\n    ```python\n    hourHandAngle\
  \ = (360 / 12) * hours\n    hourHandX, hourHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y, HOUR_HAND_LENGTH)\n    mcdrawing.drawLine(\n        clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z,\n        hourHandX, hourHandY, block.DIR)\n    ```\n\
  \n4.  通过输入代码绘制分针，它位于时针后一个方块的位置（`z-1`）：\n\n    ```python\n    minHandAngle = (360\
  \ / 60) * minutes\n    minHandX, minHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y, MIN_HAND_LENGTH)\n    mcdrawing.drawLine(\n        clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z-1,\n        minHandX, minHandY, block.WOOD_PLANKS)\n\
  \    ```\n\n5.  添加秒针，它位于时针前一个方块的位置（`z+1`）：\n\n    ```python\n    secHandAngle =\
  \ (360 / 60) * seconds\n    secHandX, secHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y, SEC_HAND_LENGTH)\n    mcdrawing.drawLine(\n        clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z+1,\n        secHandX, secHandY, block.STONE)\n  \
  \  ```\n\n6.  等待一秒：\n\n    ```python\n    time.sleep(1)\n    ```\n\n7.  程序再次还没有完成，但你应该运行它来检查指针是否出现。观察它们移动的情况。你可能已经注意到时钟的指针在移动时被清除了。下一步是使用\
  \ `AIR` 再次绘制来清除指针：\n\n    1.  清除时针：\n\n        ```python\n        mcdrawing.drawLine(\n\
  \            clockMiddle.x, clockMiddle.y, clockMiddle.z,\n            hourHandX,\
  \ hourHandY, block.AIR)\n        ```\n\n    2.  清除分针：\n\n        ```python\n   \
  \     mcdrawing.drawLine(\n            clockMiddle.x, clockMiddle.y, clockMiddle.z-1,\n\
  \            minHandX, minHandY, block.AIR)\n        ```\n\n    3.  清除秒针：\n\n  \
  \      ```python\n        mcdrawing.drawLine(\n            clockMiddle.x, clockMiddle.y,\
  \ clockMiddle.z+1,\n            secHandX, secHandY, block.AIR)\n        ```\n\n\
  \    4.  运行程序查看你的成果：玩家上方有一个巨大的时钟。确保玩家位于时钟正确的一侧，否则时间将倒着走！\n\n你可以从配套网站 [www.wiley.com/go/adventures2](http://www.wiley.com/go/adventures2)\
  \ 下载 Minecraft 时钟的完整代码，但我强烈建议你在阅读步骤时自己输入代码。那样你会学到更多！\n\n# 绘制多边形\n\n多边形是任何由直连边组成的二维形状。它可以有任意数量的边，从三边（三角形）开始。如图\
  \ 6-6 所示，你可以在 Minecraft 中创建许多有趣的多边形。\n\n![image](img/9781119439585-fg0606.png)\n\
