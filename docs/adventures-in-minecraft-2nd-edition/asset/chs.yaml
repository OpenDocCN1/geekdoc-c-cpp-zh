  \n\n\n\n\n# 程序框架\n\n要做的第一件事是编写程序的框架，使其所有部分有机地结合在一起。你从一些占位函数开始，这些函数在调用时只会打印自己的名称，然后利用你在其他程序中现有的函数逐步填充它们的细节。你可能记得，这与你在\
  \ Adventure 4 中构建寻宝游戏的方法相同。\n\n1. 通过`File ⇒ New File`（文件 ⇒ 新文件）创建一个新文件并保存为 `duplicator.py`。\n\
  \n2. 导入必要的模块：\n\n```python\nimport mcpi.minecraft as minecraft\nimport mcpi.block\
  \ as block\nimport glob\nimport time\nimport random\n```\n\n3. 连接到 Minecraft 游戏：\n\
  \n```python\nmc = minecraft.Minecraft.create()\n```\n\n4. 为你的复制机器设置一些常量。不要设置得太大，否则复制机会扫描和打印物体将花费太长时间。还要为你的复制房间设置一个初始默认位置：\n\
  \n```python\nSIZEX = 10\nSIZEY = 10\nSIZEZ = 10\nroomx = 1\nroomy = 1\nroomz = 1\n\
  ```\n\n5. 为该程序需要的所有功能定义一些占位函数。你很快就会填充这些函数的细节：\n\n```python\ndef buildRoom(x, y,\
  \ z):\n    print(\"buildRoom\")\n\ndef demolishRoom():\n    print(\"demolishRoom\"\
  )\n\ndef cleanRoom():\n    print(\"cleanRoom\")\n\ndef listFiles():\n    print(\"\
  listFiles\")\n\ndef scan3D(filename, originx, originy, originz):\n    print(\"scan3D\"\
  )\n\ndef print3D(filename, originx, originy, originz):\n    print(\"print3D\")\n\
  ```\n\n6. 占位菜单函数很特殊，因为它在函数结束时返回一个值。目前，你可以生成一个随机选项并`return` 它，这样就可以测试程序的早期版本，但很快你就会在这里编写一个正式的菜单。你编写占位菜单是为了先测试程序的结构，很快你就会将其替换为正式菜单：\n\
  \n```python\ndef menu():\n    print(\"menu\")\n    time.sleep(1)\n    return random.randint(1,7)\n\
  ```\n\n7. 编写主游戏循环，显示菜单并使用该功能所需的函数。关于 `anotherGo` 变量如何使用的更多信息，请参见“深入代码”（Digging into\
  \ the Code）。\n\n```python\nanotherGo = True\nwhile anotherGo:\n    choice = menu()\n\
  \    if choice == 1:\n        pos = mc.player.getTilePos()\n        buildRoom(pos.x,\
  \ pos.y, pos.z)\n    elif choice == 2:\n        listFiles()\n    elif choice ==\
  \ 3:\n        filename = input(\"filename?\")\n        scan3D(filename, roomx+1,\
  \ roomy+1, roomz+1)\n    elif choice == 4:\n        filename = input(\"filename?\"\
  )\n        print3D(filename, roomx+1, roomy+1, roomz+1)\n    elif choice == 5:\n\
  \        scan3D(\"scantemp\", roomx+1, roomy+1, roomz+1)\n        pos = mc.player.getTilePos()\n\
  \        print3D(\"scantemp\", pos.x+1, pos.y, pos.z+1)\n    elif choice == 6:\n\
  \        cleanRoom()\n    elif choice == 7:\n        demolishRoom()\n    elif choice\
  \ == 8:\n        anotherGo = False\n```\n\n保存你的测试程序并运行它。发生了什么？图 5-7 显示了我在我的电脑上运行此程序时发生的情况。你可以看到程序正在告诉它在做什么——它正在菜单中随机选择一个项目，然后使用处理该菜单选项的函数。由于目前你程序中的每个函数只打印其名称，这就是你看到的全部内容。你在屏幕上看到的单词序列与图\
  \ 5-7 中的不同，因为 `menu()` 函数每次被使用时都会选择一个随机选项。\n\n![image](img/9781119439585-fg0507.png)\n\
  \n图 5-7 运行你的测试程序的结果\n\n## 显示菜单\n\n如果你的程序有很多选项供选择，那么菜单系统是一个非常有用的功能。这个菜单系统会打印所有可用选项，然后循环运行，等待你在正确的范围内输入一个数字。如果你输入的数字超出范围，它只会再次打印菜单。修改\
  \ `menu` 函数并替换为以下内容：\n\n```python\ndef menu():\n    print(\"DUPLICATOR MENU\")\n\
  \    while True:\n        print(\"1 BUILD duplicator room\")\n        print(\"2\
  \ LIST files\")\n        print(\"3 SCAN from file\")\n        print(\"4 LOAD from\
  \ file\")\n        print(\"5 PRINT duplicator room\")\n        print(\"6 CLEAN duplicator\
  \ room\")\n        print(\"7 DEMOLISH duplicator room\")\n        print(\"8 QUIT\"\
