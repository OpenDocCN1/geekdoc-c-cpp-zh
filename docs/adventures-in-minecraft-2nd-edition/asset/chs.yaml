  \n成就解锁：被你自己的人工智能绑架了！\n\n![image](img/9781119439585-ch08.png)\n\n当你在 Minecraft 世界中玩时，即使使用了编程接口，它仍然是一个虚拟世界。你与游戏交互的唯一方式是通过键盘和鼠标来引导工程师设计的控制。\n\
  \n但另一种与 Minecraft 交互的方法——打破沙盒游戏带来的限制，并将其与物理世界连接。在这里，你会很快发现虚拟与现实之间的界限变得模糊，你的游戏体验将变得更有创意且刺激。\n\
  \n在这次冒险中，你将发现如何将 Minecraft 连接到名为 BBC micro:bit 的小型可编程计算机。首先，你将通过感知 BBC micro:bit\
  \ 的按键按下来测试一切运行正常，然后你创建一个程序，当你回到家里时，在 BBC micro:bit 显示屏上显示房屋图标。你将使用显示屏作为倒计时，并使用真实的香蕉作为输入设备来触发爆炸倒计时（这样你就再也不会为\
  \ Minecraft 中的建筑冒险清理空间时遇到任何困难了）。最后，你建立了一个滚球游戏，通过倾斜 BBC micro:bit 在虚拟游戏桌上收集物体并避开洞穴。你的朋友会奇你的新魔术感到惊讶，并要求你也为他们制作基于\
  \ BBC micro:bit 的控制器！\n\n# 本次冒险所需的物品\n\n以下是构建本次冒险中描述的项目所需的所有列表：\n\n* 一个 BBC micro:bit\n\
  * 用于 BBC micro:bit 的 USB 线\n* 两个或更多鳄鱼夹线\n* 一个香蕉（可选；橙子也可以！）\n* 我们来自伙伴网站的入门包，或 ‘bitio’\
  \ 包的副本\n\n如果你手头没有额外的香蕉，不要担心——只需触摸 BBC micro:bit 引脚即可让这次冒险中的项目运行（但使用香蕉会有趣得多！）\n\n\
  # 什么是 BBC micro:bit？\n\nBBC micro:bit 是一台小型可编程计算机，由 BBC 和 29 多个行业合作伙伴设计。\n\n## 输入与输出\n\
  \n任何计算机系统都有一系列输入输出，与板载处理器配合使用。图 8-1 显示了 BBC:bit 的布局。\n\n![image](img/9781119439585-fg0801.png)\n\
  \n以下是内置于你的 BBC micro:bit 你将在冒险中使用的输入输出：\n\n* **按钮 A 和 B**：正面的这两个按钮允许你通过按下来触发动作。通过正确的代码，你还可以测量按下按钮的时间。\n\
  * **显示器**：显示器是一个 5x5 `发光二极管 (LED)` 矩阵。LED 是在电流流过时发亮（在本例中为红色）的组件。BBC micro:bit 上的\
  \ LED 可以单独编程以创建图标、动画甚至滚动文本。这些 LED 的亮度也可以单独更改为 10 个亮度级别之一。\n* **引脚 0、1 和 2**：这些金属环可以连接鳄鱼夹线，并允许连接外部电路。你也可以用手指触摸引脚，BBC\
  \ micro:bit 会感知到你触摸了它们。引脚可用于多种输入输出目的。\n* **3V 和 GND**：这两个金属环可用于为你构建的外部电路提供少量电源。`GND`（地）也用作触控电路的返回路径。\n\
  * **电池接口**：BBC micro:bit 背面的白色电池接口允许你使用电池组（例如装两节 AAA 电池的）为其供电。\n* **USB 接口**：USB\
  \ 接口主要用于将新的程序代码传输到 BBC micro:bit（覆盖存储在上面的任何之前的程序代码）。你还可以使用 USB 接口为 BBC micro:bit\
