  \n图 6-1 一个巨大的 Minecraft 时钟\n\n# minecraftstuff 模块\n\n`minecraftstuff` 是 Minecraft\
  \ API 的一个扩展模块，它是为《Minecraft 冒险》（Adventures in Minecraft）编写的，包含了绘制形状和控制 3D 对象所需的所有代码。它有一组名为\
  \ `MinecraftDrawing` 的函数，允许你创建线条、圆形、球体和其他形状。由于这些复杂的代码位于独立的 `module` 中，这使得你创建代码变得更简单，也更容易理解。模块是将程序拆分成更小块的方法。当程序变得过大时，它们更难以阅读、更难理解，追踪问题也需要更长时间。\n\
  \n`minecraftstuff` 模块包含在你在冒险 1 中安装的“Minecraft 冒险”启动器件中，你可以像导入 `minecraft` 和 `block`\
  \ 模块一样将它导入到 Minecraft 程序中。\n\n# 创建线条、圆形和球体\n\n当你将许多微小而简单的东西组合在一起时，你可以创建任何你想要的巨大且复杂的物体。在这场冒险中，你将使用大量的线条、圆形、球体和其他形状来产生一个巨大的\
  \ Minecraft 结构。在冒险的这部分，你将创建一个新程序，导入所需的模块并设置 `minecraft` 和 `minecraftdrawing` 模块。随后，你将使用模块中的函数来绘制线条、圆形和球体。\n\
