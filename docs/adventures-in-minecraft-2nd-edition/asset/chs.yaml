  \ 上显示玩家位置。\n\n尝试将玩家移动到新位置并再次运行程序。检查 Python Shell 上显示的坐标：这些坐标现在应该已经改变以反映玩家的新位置。如果你想确认\
  \ Minecraft 世界中某个位置的坐标，随时可以使用这个程序。\n\n## 整理你的位置显示\n\n在继续进行更多 Minecraft 程序操作之前，你可以改进玩家位置的输出，使其更容易理解。每次显示位置时都有三行独立的输出会占用大量空间；如果能将玩家位置的三个部分放在同一行，就像这样，就很好：\n\
  \n`x=10 y=2 z=20`\n\n要实现这一点，请遵循以下步骤：\n\n1.  修改你的 `whereAmI.py` 程序，删除三个 `print()`\
  \ 语句并将它们替换为这一单行：\n\n```python\nprint(\"x=\"+str(pos.x) +\" y=\"+str(pos.y) +\" z=\"\
