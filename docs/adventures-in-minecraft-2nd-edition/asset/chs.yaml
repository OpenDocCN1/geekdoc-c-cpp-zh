  \n图 5-7 运行你的测试程序的结果\n\n## 拆除复制房间\n\n当你多次运行复制程序后，可能会有很多旧的复制房间。只有你最近创建的才是有效的房间，随着时间的推移，你的世界会填满房间！为了解决这个问题，你正在为程序添加一个拆除复制房间的功能，这样你的\
  \ Minecraft 世界就不会被这些房间占据了！\n\n拆除复制房间就像使用 Adventure 3 中的 `clearSpace.py` 程序一样。你只需要知道房间的外部坐标。因为房间比\
