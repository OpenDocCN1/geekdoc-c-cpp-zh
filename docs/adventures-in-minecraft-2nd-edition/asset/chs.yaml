  \ distanceBetweenPoints(point1, point2):\n        xd = point2.x - point1.x\n   \
  \     yd = point2.y - point1.y\n        zd = point2.z - point1.z\n        return\
  \ math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n    ```\n4.  为程序创建常量。`HOVER_HEIGHT` 是外星飞船悬停在玩家上方的块数；`ALIEN_TAUNTS`\
