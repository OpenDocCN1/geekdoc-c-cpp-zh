  \n# 使用 Python 列表作为魔法内存\n\n在目前为止你编写的所有程序中，你使用了某种形式的变量来存储随程序运行而改变的信息。每个变量都有一个名称和一个值，如果你想让程序记住多一件事，你就使用更多的变量。\n\
  \n然而，这些变量的大小是固定的，每个只能存储一个东西（例如，一个数字或一段文本）。在你作为 Minecraft 程序员将编写的许多程序中，你需要存储不确定数量的项目。你并不总是知道想在程序中存储多少个项目。\n\
  \n幸运的是，像任何现代编程语言一样，Python 有一种名为**列表（list）**的特性，它可以随着程序的运行而存储不同数量的数据。\n\n## 实验列表\n\
  \n理解列表的最佳方法是在 Python Shell 中对它们进行实验。\n\n1. 点击 Python Shell 窗口将其置于顶。点击最后一个 `>>>`\
  \ 提示符右侧的鼠标，那是你开始输入交互式命令的地方。不要忘记你必须通过选择 Python Shell 菜单中的 Shell（Shell） 重启 Shell（Restart\
  \ Shell），或按下 CTRL 然后 C 来停止正在运行的现有程序。如果你之前的程序仍在运行，接下来的部分将无法工作！\n\n2. 创建一个新的空列表，并显示列表的内容：\n\
  \n```python\na = [] # 一个空列表\nprint(a)\n```\n\n3. 向列表添加一个新项，并再次打印：\n\n```python\n\
  a.append(\"hello\")\nprint(a)\n```\n\n4. 向列表添加第二个项，并再次打印：\n\n```python\na.append(\"\
  minecraft\")\nprint(a)\n```\n\n5. 检查列表的长度：\n\n```python\nprint(len(a))\n```\n\n\
  6. 查看列表中特定位置的项。这些位置被称为**索引（indexes）**：\n\n```python\nprint(a[0]) # [0] 是第一个项的索引\n\
  print(a[1]) # [1] 是第二个项的索引\n```\n\n7. 从列表末尾移除一个单词，显示该单词和剩余的列表：\n\n```python\nword\
  \ = a.pop()\nprint(word)\nprint(a)\n```\n\n8. 检查列表的长度，并检查列表的长度：\n\n```python\nprint(len(a))\n\
  ```\n\n9. 从列表末尾移除一个单词，显示该单词和剩余的列表：\n\n```python\nword = a.pop()\nprint(word)\nprint(a)\n\
