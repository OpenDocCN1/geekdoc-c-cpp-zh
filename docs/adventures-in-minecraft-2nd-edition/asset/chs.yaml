  # 追踪玩家的进阶冒险\n\n在这次冒险中，你学习并实践了游戏循环的基础知识，利用感知和地理围栏创建了一个有趣的游戏。当你制作游戏时，让你的朋友家人来玩并并他们他们喜欢或不喜欢的地方是一个好主意。这是获取反馈帮助你改进游戏的好方法。\n\
  \n*   “欢迎回家”游戏有一个问题：如果玩家站在门垫上，它会反复说“欢迎回家”并填满聊天框。你能想到一种修改此程序的方法，让它在你进入房子时只说一次“欢迎回家”吗？\n\
