  \ Minecraft 方块进行构建时，唯一需要记住的是，你需要使用简单的数学来计算你想创建的每个方块的坐标。\n\n你现在将扩展你的 `build.py` 程序，在玩家面前再创建五个方块，每个你想创建的方块使用一个\
  \ `setBlock()`。你准备编写的程序将创建一个看起来像骰子点点的结构。要实现这一点，请按照以下步骤操作：\n\n1.  从编辑器菜单中选择文件 ⇒ 另存为，并将程序保存为\
