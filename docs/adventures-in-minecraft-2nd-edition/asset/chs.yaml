  \ 显示玩家的位置\n\n理解坐标工作的最好方法是编写一个小实验程序，这就是你现在要做的。这个程序将显示玩家的 3D 坐标，你可以看到坐标随着玩家移动而变化。\n\
  \n1.  从 Python Shell，通过选择 `File ⇒ New File` 创建一个新程序。会打开一个新的无标题窗口，那里就是你输入新程序的地方。\n\
