  \ 可以利用它感知各种形式的运动，包括抖动和倾斜。它与手机内部使用的设备相同，用于感应屏幕的朝上方向。在后接的冒险中，你将使用加速度计来感知倾斜，从而让你 Minecraft\
  \ 世界中的球移动。\n\n## 将你的 BBC micro:bit 作为游戏控制器\n\n在这次冒险中，你将一个程序加载到 BBC micro:bit 上，这样你就可以将其作为\
