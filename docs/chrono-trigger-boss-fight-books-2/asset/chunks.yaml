    sandmermannish “mohavors” and crustaceanlike “hexapods.” Sure, these things are
    living creatures, but they’re also monsters. So we judge our activities to be
    good—as corrections to history for the sake of humankind.


    Other alterations to the timeline are even more self-interested. We willfully
    alter history to change the personality of the acquisitive 1000 AD mayor of Porre,
    so that we can take the Sun Stone from a more generous version of him. Just like
    the original mayor, we only want the Sun Stone for our own material benefit. Or
    is it because of the off chance that those materials we fashion from the Sun Stone
    will give us an extra edge against Lavos? Greater good, fine. We also have a unique
    chance to save Lucca’s mom from paralysis, a mulligan that no one else on the
    globe gets. Is the act of de-disabling Lara part of this nebulous greater good,
    or is it a selfish life hack?


    Regardless of what our actions in the timestream are, not only do we willfully
    violate every single directive of time travel that sci-fi history has urged us
    to respect, but we do it with the justification that we are heroes. We have appointed
    ourselves masters of time, and wielding our Gate Key like a five-pointed scepter,
    we decree who gets saved and who doesn’t.


    Of course, if we believe, as the game suggests, that some greater Entity—the spirit
    of the world itself?—created the disruptions in time so that someone would take
    advantage of them, then why shouldn’t it be Crono and company who seize the opportunity?
    Why shouldn’t Lucca travel through that mysterious red gate and save her mother
    from harm? It could easily have been a party of treasure hunter Toma, Elaine the
    merchant’s daughter, Tata the wannabe knight, and mystic prodigy Schala who were
    brought together by circumstances beyond their control to serve the Entity’s purposes.
    Were these other worthies cheated by the Entity, then, by not receiving the chance
    to be heroes? Or is it pure dumb luck that Crono and company end up saving the
    world?


