  trans: "\n\n![](img/CTCover.jpg)\n\n# 穿越时空 (Chrono Trigger)\n\n**Michael P. Williams**\n\
    \n**Boss Fight Books**\n**加州，洛杉矶**\n\nbossfightbooks.com\n\nCopyright © 2014 Michael\
    \ P. Williams\n保留所有权利。\n\nISBN 13: 978-1-940535-01-2\n第一次印刷：2014\n第二次印刷：2016\n\
    系列编辑：Gabe Durham\n书籍设计：Ken Baumann\n页面设计：Adam Robinson\n\n## 目录 \n\n- 序言\n- 关于文本的说明\n\
    - 向往过去的未来\n- 坚强而沉默的类型\n- 像在 1999 年那样狂欢\n- 直男？白人？男性？\n- 钢铁与纯逻辑\n- 拉沃斯之日\n- Neuga,\
    \ Ziena, Zieber, Zom\n- 书中的生活\n- 时间终点\n- 命运时刻\n- 注释\n- 致谢\n\n# 序言\n\n我会把这写得很短，这样你们就能继续阅读并享受你们来到这里的目的！你们将读到的这部作品既是一部自传，也是一位爱好者对游戏早期的颂歌，更是一个关于“少年遇见卡带”的成长故事。\n\
    \n这段叙述对我来说意义非凡，不是因为我其中参与了很多，而是因为作者与我在 90 年代年代为 Squaresoft 工作期间恰好本地化的一款游戏有着如此深的联系。我很幸运，曾有一段时间能与\
    \ Square 睿智且富有创造力的团队“并肩作战”。像 Michael P. Williams 一样，我怀念地回顾那些 16 位时代的艺术品，并很高幸能在让这些作品在日本之外地区流行尽一份力。\n\
    \n翻译的艺术可以被描述为一种通灵的练习，静坐数小时，试图在简洁性、机智和对原作游戏的忠实之间取得平衡。截止日期也一直存在——那是永远在翻译者脑海中挥之不去的大象。\n\
    \n《穿越时空》的翻译是一项艰巨工程，因为玩家有许多选择，而且不同角色之间的组合设计有不同的互动方式。在记住这些互动的同时，还要考虑语调、笑话和不断发展的剧情，这非常困难，我在过程中确实犯了一些有趣的错误。\n\
    \n但在翻译时，我知道这部作品非常特别，它的故事和画面代表了游戏的一次演变。由于游戏持续的本地化需求，我不得不不断推迟回美国的计划，但我知道这些努力是值得的。Square\
    \ 开发团队在《穿越时空》中投入了如此多的心血，尽力为他们美丽的游戏公正呈现是我能做的最后的事了。\n\n卡带的内存占用非常大，以至于它是超级任天堂（Super\
    \ NES）上发布的最昂贵的游戏之一。80 美元的零售价对游戏玩家来说是一项巨大的投资，我想，但显然——正如 Williams 以及过去十九年来无数《穿越时空》粉丝所描述的那样——这种体验值回了票价。那么……开始进入故事吧！\n\
    \nTed Woolsey\n2014 年，冬季\n\n# 关于文本的说明\n\n通常情况下，本卷以 Ted Woolsey 于 1995 年为超级任天堂翻译的《穿越时空》第一版英文版为基础。这段文本也被用于随后的版本，例如\
    \ 2001 年的北美 PlayStation 港口版（作为《最终幻想编年》合集发布）。为了对比，我偶尔引用了原始的日版 Super Famicom 文本，以及后来的英文版，包括\
    \ Tom Slattery 为 2008 年 Nintendo DS 准备的重译。后期到各种游戏平台的移植版（包括 Wii 虚拟控制台或 iOS）使用了这些翻译版本之一，有时为了适应新的控制器接口而进行了微调。判断你拥有的是哪一个英文翻译版的快速方法是参考克洛诺（Crono）母亲所说的第一句话。Woolsey\
    \ 版本以“Crono… Crono! Good morning, Crono!”开始。而 Slattery 版本以“Crono… Crono! Crono,\
    \ are you still sleeping?”开始。\n\n# 向往过去的未来\n\n沙漏计测量着新买的大屏幕电视机屏幕上的秒数。音乐渐强。一场冒险即将开始。\n\
    \n我的姐姐和母亲在楼下开始看《我们的生活》（Days of Our Lives）的夏日午后剧。而我，决定放弃萨勒姆的人们，去追求另一种传奇。不，今天不会充满惊喜的脑瘤、恶魔附身和肉体永无止境的欲望。今天不是小打小闹的日子。今天是史诗的一天。\n\
    \n摆钟测量着我卧室楼上老式兔耳朵电视屏幕上的秒数。音乐激昂。我按下开始键。\n\n•\n\n我开始《穿越时空》的方式，和我开始几乎每一个我最终爱上的角色扮演游戏的方式一样——通过阅读它的介绍。北美玩家必须忍受数月煎熬的等待，舔食《Nintendo\
    \ Power》或《Game Informer》提供的任何简短介绍，直到那个期待已久的周二，1995 年 8 月 22 日。\n\n当我终于在 1995 年晚拿到《穿越时空》时，距离我上一次接触\
    \ Square 的游戏（即那部极具歌剧感的《最终幻想 III》，实际上是伪装的 `FF6`）已经过去了一年。别误会我，我吞噬了《地球之旅》（EarthBound），它在同一个夏天的\
    \ 6 月 5 日抵达美国。事实上，那是我十三岁的生日礼物。我沉浸在它破碎的美国式风格中。我为它古怪的幽默大声笑出来。我抓着、闻着指南书中附带的那些味道难闻的卡片。\n\
    \n但对我来说，Square 是 RPG 界无可争议的王者。Square 打开了世界的枢纽——戏剧、幻想、电影、游戏。Square 召唤了图腾的力量——剑、水晶、飞船、陆陆奇！这些象形文字成了我内心幻想故事的语言，成了我在梦中对自己讲述的传奇。\n\
    \n我读过的所有关于《穿越时空》的资料都将其推崇为我所有 RPG 愿望的巅峰。《圣圣传说》（Secret of Mana）广阔的世界设计、《最终幻想》纯粹的情感叙事、以及《勇士物》（Dragon\
    \ Warrior）那无法抗拒的艺术设计（其实只是重新包装的 `Dragon Quest`）。《穿越时空》承诺成为我所喜爱的 RPG 一元素的精髓。\n\n\
    我不记得我是用自己的钱买的《穿越时空》，还是我妈妈在圣诞节跑去买给我的。可能是后者。但当我终于打开那个盒子的封条，将卡带插入我的 `SNES` 并拨开那个紫色电源开关时，我知道《穿越时空》绝对是产过的最美丽的游戏之一。拿着我的官方攻略指南，几周内我都是一个热切的“穿越者”，只有在去上厕所或拿零食时才会停下来。或者为了终于搞清楚妈妈在楼下到底对我喊的是什么鬼。\n\
    \n•\n\n“早安，克洛诺！”\n\n来自平淡无名母亲的快乐而庸的问候。少年克洛诺与他无名的母亲过着相对平静、如果说是无聊的生活。但他醒来的这一天，我们见到他的这一，是他期待已久的特别一天。事实上，他兴奋得连衣服都没换就睡了。今天是千年游乐场的第一天。克洛诺口袋里有钱，他准备好大干一场了。\n\
    \n"
