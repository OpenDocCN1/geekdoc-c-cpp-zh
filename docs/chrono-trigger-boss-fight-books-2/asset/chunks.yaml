    I’ve always had a soft spot for antiheroes. Their constant struggle to navigate
    between the already ill-defined categories of good and evil. Their refusal to
    assert allegiance to anyone but themselves. Their humanness. Magus is, however,
    less of an antihero than he is an antivillain.


    Magus first appears as an enemy, looking like he might eventually become the final
    boss. As his backstory slowly unfolds, his alignment becomes murkier. Wielding
    the power of shadow, he is elementally opposed to our protagonist. A more accurate
    translation of `Crono`’s element ten is “heaven”—not “light” or “lightning”—and
    `Magus`’s element shadow is `mei`, a darkness associated with Pluto and Hades—the
    gloom beyond death. He is an archetypical shadow and bizarro version of `Crono`.
    Each has a single mother and a faithful cat, and neither is a great conversationalist.
    `Magus` eventually becomes a reluctant ally, a villain who puts his villainy on
    the backburner to take care of a greater foe. The enemy of my enemy, and all that.


    Magus was formerly `Janus`, the child of the power-mad `Queen Zeal` in 12,000
    BC. Friends with no one but his cat `Alfador` and his sister `Schala`, `Magus`
    harbors a darkness that grows with his developing powers. Dropping references
    to “black winds” and hinting at the imminent death of a party member—namely `Crono`—`Janus`
    is a spooky little dude. Like the Roman deity his English name evokes, `Janus`
    has one face he shows the world, and another turned towards the shadows.


    Time-orphaned by the awakening of `Lavos` in 12,000 BC, `Janus` is hurled forward
    to the Middle Ages, only to be discovered by the trickster miniboss `Ozzie` and
    presumably raised to cultivate his latent magic. By the time our party meets him
    for the first time in battle, `Magus` has become the leader of organized monsterkind,
    along with his generals `Flea`, `Slash`, and former foster parent/teacher `Ozzie`.


    Despite observing the changes that `Lavos`’s all-consuming power wrought upon
    `Queen Zeal`, young Prince `Janus` grows up to become a mirror version of his
    mother. Bent on acquiring immeasurable power, `Magus` surrounds himself with powerful
    but ultimately subservient archminions and builds his own kingdom. In a plot point
    that parallels the three gurus rebelling against the malevolent `Queen Zeal`,
    it is `Magus` the overlord who eventually turns his back on his three warmonger
    cronies. But he does not reject the shadow completely—it is his elemental alignment
    and the source of his power.


    `Magus` is the only PC who has a motive for destroying `Lavos` that transcends
    altruism. As noble as the intentions of the other party members are, not one of
    them has any direct interest in defeating `Lavos`. By the time `Lavos` emerges
    in 1999 AD, all of our human characters will have died, having lived their lives
    without experiencing the effects of the apocalypse. `Ayla` is something of an
    exception, since she and her people will deal with the ice age caused by `Lavos`’s
    destructive arrival on earth. But this is unpreventable. The party will never
    get the chance to defeat `Lavos` before it arrives on earth. As for `Robo`, he
    might not even exist if the end of the world is prevented. By agreeing to help
    topple `Lavos`, he resigns himself to potential martyrdom.


    `Magus`, however, wants revenge. He wants to take down `Lavos` for stealing his
    sister—for stealing his childhood. Even after defeating `Lavos`, `Magus` is still
    tormented by the memory of `Schala`, lost in time. In the DS version of `Chrono
    Trigger`, which adds a new optional boss and an ending to tie the game more directly
    with sequel `Chrono Cross`, `Magus`—at least some version of `Magus` from one
    timeline or another—finally discovers `Schala`. She has become half-captive, half-absorbee
    of `Lavos`, who it seems was not destroyed, but rather banished somewhere beyond
    time. Even if we beat this boss, we still end up defeated. `Schala` warns `Magus`
    that his power will not be enough to defeat this new, upgraded `Lavos`. Demonstrating
    uncharacteristic awareness of his faults, `Magus` wipes his own memories and ends
    up in an unfamiliar place, remembering nothing but a compulsion to find something
    important to him.


    To me, a player of the original Super Nintendo version, this new ending is a big
    screw you. Having our party lose to a boss that we already kind of defeated, and
    that characters in the sequel are able to defeat, makes it feel like our team—the
    team that saves the world!—isn’t good enough. Furthermore, `Chrono Trigger` does
    not need retconning into an unstable `Chronoverse` just to answer for the poor
    choices of its sequel. Worse, this new ending forces `Magus`—again, some version
    of him, because `Chrono Cross` did all that dimension-hopping business—to choose
    cowardice over arrogance. `Magus` is an uncompromisingly egotistical loner, and
    no matter how strongly his affections toward `Schala` transcend fraternal love—it’s
    a little weird, right?—sacrificing his memories, especially those of his beloved
    sister, is just not in his character. I much prefer to see him set forth in silence
    on his quest to save `Schala`, vanishing into time.


    All of `Crono`’s allies have their own roles to play in our journey, and any of
    them are fit to stand up to `Lavos` in the final battle. The catch, of course,
    is that we can only choose three.


    RPGs that feature large, customizable parties generally force us to leave a few
    characters out of the fray of battle. There are good reasons for this from a game
    design standpoint—maintaining a delicate balance of powers in battle, or fitting
    the constraints of the screen display. Rarely do games offer explanations for
    limitations.

    '
