    记住，这个 `Marle/Leene` 章节是我们初次体验《时空之术》中时间是如何运作的，而且它已经像是一团乱子了。因此，游戏的其余部分并非完全从于那种该死的、纠缠的因果律逻辑，这反而对我们有利。


    首先，忽略悖论让我们从一开始就能够改变时间线，增加了冒险的风险，同时又不会让《时空之术》陷入复杂性的泥潭。它还设定了一些有趣的谜题，其中一些甚至公然违背了“祖父悖论”。例如中世纪和现代的那些封印箱子。我们不应该在
    `600 AD` 打开那些箱子，因为这样我们将失去在 `1000 AD` 获得其中物品强化版的机会。但如果我们我们在现代解锁了这些相同的箱子，就可以回到回
    `600 AD` 拿走里面的东西，实际上实现了买一得二。即使我们同时在 `600 AD` 的北欧遗迹中拿了 `Nova Armor`，并在 `1000 AD`
    拿了它的强化版 `Moon Armor`，宇宙也不会发生坍塌。我们可以稍微作弊一下系统，而不会产生任何时间上的影响。


    分析《时空之术》中利用的时间旅行来龙——更多时候是高峰和低潮——是一项充满挫败感、头疼和过度解释的练习。简而言之，这是宅客快乐的极致。


    对于这些逻辑不一致之处，简单的答案是——《时空之术》是一个委员会设计的游戏。虽然主制作人之间共同充满了热情，但他们也贡献了自己的个人意见，而这些意见并不一定与其同事的匹配。然而，他们的员工被迫让这一切都运行起来，即使它与其他内容不兼容。例如，游戏监监堀井悠（Yūji
    Horii）勾勒了一个基础剧情：“一个角色会回到过去，采取一些行动，从而改变角色的现在或未来状况。”与此同时，制作人坂口广信（Hironobu Sakaguchi）设计的如
    `Gato` 等怪物和角色一直在争取加入。甚至鸟山闲明（Akira Toriyama）的设计稿也需要融入游戏。例如，那张著名的 `Crono` 在雪中与 `Frog`
    和 `Marle` 并肩战斗的鸟山画像，直到《时空之术》制作后期才被实现，当时程序员在故事中为 `Death Peak`（死亡峰）找到了位置。更糟糕的是，这张图完全错了。`Marle`
    使用的是水魔法，而不是火魔法。而且这张图还是封面——玩家看到的第一个东西！鸟山承认他本该画一把冰剑，但对他对他来说太难了，所以他用火焰代替。编写了整个“狂热王国”（Kingdom
    of Zeal）剧本的故事策划佐藤正人（Masato Katō）后来回忆道，开发《时空之术》“并不完全一帆风顺，很多部分最后都被改变了”。尽管 `Katō`
    做了所有添加和编辑，但他并没有被列为荣誉梦幻团队成员。


    对于那些寻找游戏内时间旅行解决方案的人，`Chrono Compendium` 的人们汇编了许多关于《时空之术》时间机制为何如此以及为何不行的绝佳理论，甚至在他们针对《时空之术》和《时空交叉》的非官方续作（一个同人游戏《Crimson
    Echoes》）中引入了他们的一些扩展机制。其中一个引人入胜的理论是他们所谓的“时间旅行者免疫”。


    * 虽然我们可以方便地忽略时间旅行悖论，但我们无法忽视我们在时间中的行动似乎在影响他人的同时不影响自己。好吧，除了关于 `Marle` 那整件事。总之，除了那个本该解释《时空之术》中时间旅行如何运作的整个
    `Marle` 事件之外，《时空之术》的时间旅行实际上可能通过赋予穿越时者对时间旅行影响的免疫力来实现。除了那一次。


    涉及免疫的最心碎的例子是 `Lucca` 在 `590 AD` 防止 `Lara` 受伤的机会。假设 `Lucca` 确实救了她的母亲，`Lara` 的一生将一直行动自如，可能忘记了自己曾多么接近瘫痪。但
    `Lucca` 永远会记得她如此深刻地改变了自己的过去。那么 `Lucca` 是否拥有了既被残疾版本也被健全版本的 `Lara` 养大的独特经历？还是她只记得那个独自坐在楼上窗边的偏瘫母亲？无论哪种，这对于
    `Lucca` 来说都是一个艰难的处地。如果她同时记得两段童年，她可能会因为冲突但同样真实的记忆而经历创伤甚至疯狂。另一方面，如果她没有获得 `Lara`
    作为健全母亲的记忆，那么她不仅被夺走了她本以为正在拯救的童年，她的记忆现在也与爱人的记忆不兼容。她唯一能与 `Lara` 和 `Taban` 分享的真实记忆，是在
    `Lara` 可能发生事故之前发生的事件。我们的 `PCs`——以及其他任何旅行过时间的人——不仅是在大时间线上来跳跃，现在还遵循着自己的个人时间线。


    随着我们的队伍在时间中穿梭，他们的身体并没有简单地停止老化。回到过去不会将他们分解回原始分子，前往未来也不会将他们变成终有一天会变成的尘埃。我们的队伍在完成冒险的过程中积极老去，尽管这可能只花了一周左右。我们在“千年博览会”（Millennial
    Fair）第一天的下午离开了很短的一段时间。当我们回来时（可能是几小时后），`Crono` 被逮捕了，如果我们选择一直服刑直到 `Lucca` 来救他，他被关押了三天。在他越狱后，他和小队在时间线中此处穿梭。我们在
    `65,000,000 BC` 度过至少一个醉酒——呃，是被汤撑大的？的晚上，在把 `Masamune` 交给 `Frog` 后，在他的洞穴里又过了一个晚上。之后，在与
    `Magus` 经过激烈的战斗后，我们再次在史前时代醒来。在 `Crono` 死后，我们在 `12,000 BC` 的“最后的村庄”醒来。最后，当我们完成拯救
    `Fiona` 森林的支线时，我们在森林里度过了命运的夜晚，在那里 `Lucca` 获得了重新来的机会。我们在千年博览会的最后一个晚上结束了游戏。这给了我们至少六到八天的时间来完成冒险。该死，我们跑得真够快！


    现在，让我们这变得更复杂一些。


    我们穿过的门——以及最终嵌入在 `Epoch` 中的计时器——并不是固定在不变量的时间点上，而是固定在一个特定的活跃时间线上。例如，当我们第一次通过大门从
    `600 AD` 回到 `1000 AD` 时，我们并没有回到离开的精确时刻。已经过去了足够的时间，让皇家卫兵察觉到 `Marle` 发生了异样，`Crono`
    几乎立即被捕。当我们下次使用那扇大门从 `600 AD` 去往 `1000 AD` 时，那场闹剧审判的事件并没有被忘记。我们在每个时代采取的所有行动都会持续生效。没有这种流动性，将根本没有冒险可——只有一系列不断崩塌的计划，一个无止尽且无法玩的游戏版《土拨日》。


    '
- fmt: '

    So what does all this mean? It means that while our party members can change the
    world(s) around them for the better, the residents of those eras who reap the
    benefits will never realize it. And the ultimate irony of `Chrono Trigger`’s time-based
    altruism? We are powerless to change our own pasts. And even if we could, would
    we—like all of those time-muggles—forget that we had ever made those changes?
    We would forever be dissatisfied with our lots in life, never knowing how much
    our stations had improved.


    ***


    [14] Death Peak—and probably the `Crono Clone` sidequest—had not yet been created
    at the time of the “Perfect Interview,” later included in `Kurono Torigā Kōryaku
    Daitokushū`.


    [15] “トリガーも難航してね、終盤トップがすげかえられちゃったんだよね。”


    # The Fated Hour


    You can’t take it with you. A maxim of transience and impermanence, of both pro-
    and anti-materialism at once. While funerary cultures across the globe still bury
    their dead with their treasured possessions, I remain unconvinced of the transferability
    of worldly goods into the afterlife—if there even is one.


    At first glance, the afterlife of `Chrono Trigger` the game seems to have been
    rich. A few reincarnations for various game platforms have promised new added
    value to players while carrying over the best of their past lives. `Chrono Trigger`
    the franchise has given birth to new stories, for better or worse. For some players,
    official sequel `Chrono Cross` was a worthy continuation of the `Chrono` name,
    but to me it felt more like a clumsy tie-in that invalidated everything triumphant
    about `Chrono Trigger`. And there is still worse. The serial manga `Jikū Bōken
    Nuumamonjā`—perhaps localizable as `Space-Time Adventure Nu and Kilwala`—features
    the tiresome antics of two of the most familiar monsters in `Chrono Trigger`.
    This comic was later adapted into an abysmal featurette known in some circles
    as the “Chrono Trigger anime,” despite not featuring in any significant way the
    cast we’ve grown to love. I am tempted to blame `Nuumamonjā` for the death of
    the `Chrono Trigger` series, but it’s more likely that lightning struck the Dream
    Team only once.


    Fans seem to have treated the legacy of `Chrono Trigger` with more respect than
    its copyright-holders have. The sheer volume of unofficial art, fiction, music,
    comics, wikis, games, and criticism (like this book) attests to the influence
    that this game has had on the people who have played it. For the time being, `Chrono
    Trigger` has achieved a kind of temporary immortality through its fandom.


    The karmic fate of `Crono` and company, luckily, is less complex than the game
    they star in. Each time we complete a full turn of the adventure, we have a chance
    to start over again. Not just from scratch, but rather with a “New Game +.”


    `Crono` still wakes up the same old way. “Good morning, Crono!” Our always unflappable
    mom is unfazed by all the items we seem to have acquired overnight. Her suddenly
    ultra-buff, filthy-rich, weapon-hoarding, women’s-clothing-collecting son is the
    same as he was yesterday. Does she even see?


    Our first New Game + slightly lifts the veil between worlds for `Crono` and those
    who join his party. A gate has appeared on `Lucca’s telepod`, one that leads straight
    to `Lavos`. But `Lucca` displays no awareness of the anomaly, and neither does
    `Marle` until she joins `Crono` officially. There is a world behind this world,
    surely something unknown and exciting. If `Crono` and `Marle` travel through this
    new gate and can vanquish `Lavos` as a duo, then they’ll reach what must be the
    closest thing `Chrono Trigger` has to a heaven. And yes, they can take all their
    items with them.


    • The in-game headquarters of the Dream Team is a repurposed `End of Time`, now
    populated by `Chrono Trigger` staff in the guise of mostly familiar sprites. Some
    of these creator demigods joke around with us, revealing their roles in our adventure,
    while others stump us with non-sequiturs. Still others are relieved that the game
    is over. “I’ve lost 22 pounds because of this game,” laments field programmer
    `Kazumi Kobayashi` in the form of a fallen soldier, “You’d better be enjoying
    it!” Others complain about their graying hair, or just feeling so fucking tired.
    There’s something amiss about the afterlife, and it feels hollow. This end-of-game
    `End of Time` is just an antechamber, however. Once we talk to all of its restless
    spirits, the tabernacle of creation is unlocked for us. We’re about to meet our
    makers.


    There they are, the three members of the Dream Team, here as an expanded pentad.
    The two newcomers are producer `Kazuhiko Aoki`—dressed in a partial tanuki suit
    emblazoned with a Chinese character, and co-composer `Nobuo Uematsu` as semicorporeal
    `Norstein Bekkler`. But it is the three major creators of `Chrono Trigger` who
    should draw our attention. Here are the men who, traveling once upon a time to
    the United States to study the newest computer graphics, began enthusiastic discussions
    to make a game together. Drinking and chatting, these three gurus—`Hironobu Sakaguchi`,
    `Yūji Horii`, and `Akira Toriyama`—laid the broad foundations for what would,
    with the help of many minions, become `Chrono Trigger`. Flash forward several
    years from those first game, how do they appear here? As towering gods? As superbosses?
    They are just men.


    Surely, though, this trinity has something to say. “Boy, it used to be that I’d
    get thinner after each game,” whines `Sakaguchi`, “Now I’m gaining weight instead.”
    This is not the type of reassurance we want to hear from God. Hiding his face
    with a surgical mask, `Toriyama` gives a generic shoutout. `Horii`, a nonsense
    riddle fit for modern day Lewis Carroll:


    One of these things is not like the others… A Stapler, Mothra, and the Olympics.


    SO… which one is it?


    I have formulated my own tentative answer to `Horii’s` riddle, but does his Zen
    koan hint at greater meaning behind the universe, or does it instead reveal the
    nonsensicality of existence? We have met our creators, and they are all too human.
    Luckily, we don’t have to hang around this dull purgatory for eternity. Once we’ve
    spoken to all five Dream Team members, we are hastily told that we’ve been accepted
    as a member of the Team as well. After a speedrun of the credits—“since you blew
    through the game so fast”—we are rocketed back to the limbo of the title screen.
    Where, if we want, we can start all over again.


    • `Chrono Trigger` is a static game. Once we discover all the secrets, experience
    all the endings, there’s little else to do before it becomes repetitive. Those
    of us who began with the `SNES` version might upgrade to the `DS` version, and
    complete all the new quests this parallel universe offers. But how many times
    can we play `Chrono Trigger` before we move on? There are more games than this,
    and countless more adventures that lie outside of chunky gray cartridges.


    All of us look back on our lives with a mixture of regret, satisfaction, and nostalgia
    for our achievements and our failures. Would we reset our lives with a chance
    to end up at that title screen of birth? And if we could find it, how do we decide
    between the possibilities of a fresh start at level 1, or the baggage of a New
    Game +?

    '
