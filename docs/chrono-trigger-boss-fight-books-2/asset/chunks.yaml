  raw: 'It’s clear that people are invested in Crono’s life, like his mother and his
    bestie Lucca. People around town seem to recognize him. Sometimes. How could they
    not? He’s the redheaded pineapple-haired sword-swinging kid from around the corner.
    It’s hard to envision a world where someone like that is forgettable, especially
    when a vast majority of the people who inhabit Chrono Trigger are just so damn
    interchangeable.


    Despite his standout sense of style, Crono isn’t much of a character. We know
    that Crono engages in conversations with people, but we don’t get to hear—well,
    read—exactly what he says to them. We the players are supposed to be the presence
    behind Crono, with a press of the A button serving as our conversation starter.
    Besides occasional chances to advance the dialogue with binary choices, all we
    can do is tell Crono where to move and how to fight.


    In fact, when we are given the chance to “speak” as Crono, the choices aren’t
    even presented in quotation marks. We’re not really indicating what Crono says
    verbatim, but rather, what he intends to say. These choices don’t even advance
    the narrative profoundly. We can repeat an “incorrect” response over and over
    until we finally choose the game-sanctioned answer, or we can pick among two options
    that only affect the immediate response with no far-reaching repercussions. Rather
    than making us identify with Crono as a character, our speech choices often remind
    us how little of what we say actually matters. So do we give a damn about Crono?


    As it turns out, we do.


    •


    I grew up in a nuclear family that slowly and steadily fissioned. By the time
    I was really aware of myself and my surroundings, my father was already working
    long weeks away from home, returning on occasional weekends. These weekends became
    less frequent until they were almost nonexistent, as he traveled farther from
    home for better opportunities for our family. Boston. Jacksonville. Guadalajara.
    Malabo. Shenzhen.


    My mother was a married single parent, and acted as the sole caretaker for me,
    my older sister, and later on, that cat I just had to have. I was as blissfully
    unaware of her struggles as I was selfishly indulgent in video games.


    As a thirteen-year-old playing Chrono Trigger, I saw myself in Crono. I wanted
    to be this boy with the encouraging mom and happy little cat who vanished from
    the small world he inhabited. I fantasized—as most children must and many adults
    still do—of a catalyst for adventure, of a portal to a new life opening up. Of
    the universe waking me up into a fateful day.


    Pouring myself into Crono was an exercise in projection, of making myself fit.
    Game designer and lecturer Petri Lankoski has described this type of interaction
    with our player characters (PCs) as empathic engagement. When we begin to see
    our characters as a reflection of ourselves, we empathize with them. As we control
    Crono’s movements, we are almost literally walking in his shoes. Before games
    became more complex, dynamic, and story-driven, however, it was not empathy but
    rather goal-related engagement through which we became those little sprites on
    the screen.


    Goal-related engagement describes how closely our gameplay objectives align with
    our PC—in this case, Crono. Our mission and Crono’s are ostensibly the same—defeat
    the bad thing and save the good thing. It’s a simple goal, one that underpins
    many game narratives spanning every genre. What does Mario in Super Mario Bros.
    want? To defeat the villain and save the princess. What does Link in The Legend
    of Zelda want? Ditto. And while “saving the princess” may seem a very specific,
    old-fashioned, and gender-biased goal, if we replace “princess” with other words,
    bigger words—“town,” “world,” “universe!”—we’ll find that many games follow the
    same narrative path from start to finish, regardless of the intricacies of their
    plots.


    The completion of these big goals often coincides with the end of the game. Once
    Mario defeats Bowser and saves Peach—Princess Toadstool, if I’m being textually
    faithful to my North American experience—the game is over. Once Link topples Ganon
    and saves Zelda, we’re done. There is no post-game for our PCs.


    Chrono Trigger complicates this dynamic by offering us the illusion of a post-game—multiple
    variants on the main ending along with several special ones. Obtaining any of
    these new endings, however, is not aligned with Crono’s goal. He sets out to defeat
    an ancient evil—not see what happens after, or see how a web of choices complicates
    this outcome. We players, then, have goals beyond those outlined for our PC. We
    want the achievement of unlocking those endings. We want bragging rights.


    But Crono doesn’t want these. Or does he? At the Millennial Fair, Marle comments
    on Crono’s predilection for carnival games: “You’re awfully competitive, aren’t
    you, Crono?” Of course, Marle has just met this stoic boy, but still she seems
    to know more about him than we do. So is Crono a brash, headstrong punk? A timid,
    polite youth? That’s for us to choose. We are the hero behind Crono, and how we
    project ourselves onto him makes each player’s journey through Chrono Trigger
    unique.


    •


    The Hero’s Journey is an analytical framework that is both useful and biased.
    The Journey is based on a pattern of narrative milestones first identified by
    mythologist Joseph Campbell, who in turn was heavily influenced by the work of
    psychologist Carl Jung. Jung’s most well-known archetypes are familiar concepts
    to many storytellers and their audiences: shadow, animus, anima. The very names
    bespeak unfathomable depths of symbolism. Using Jungian concepts to catalogue
    and analyze world mythologies, Campbell articulated the monomyth—or “hero-journey”—a
    seventeen-step fundamental structure, which he summarized succinctly:


    A hero ventures forth from the world of common day into a region of supernatural
    wonder: fabulous forces are there encountered and a decisive victory is won: the
    hero comes back from this mysterious adventure with the power to bestow boons
    on his fellow man.


    Several of Campbell’s mythic checkpoints have almost alchemical names. The Belly
    of the Whale. The Master of Two Worlds. This “hero-journey” has been further distilled
    by several writers, often as an abbreviated series of steps with the spruced-up
    title The Hero’s Journey. Some of these new reconfigurations have similarly arcane
    steps. The Dark Night of the Soul. The Theft of the Elixir. Whether or not Campbell’s
    model accurately applies to all mythologies is debatable, and the adapted Hero’s
    Journey may prove problematic as well. So take as many grains of salt as needed—take
    the whole shaker, if you must!—as I attempt to put typical RPG hero Crono in the
    sandals of a mythological figure and walk him through my own version of The Hero’s
    Journey.


    The Journey begins with a Call to Adventure. Crono witnesses Marle disappear through
    an unexpected warp in the fabric of reality and he is compelled to save her. With
    Lucca’s ability to reproduce the anomaly as a form of Aid from the Supernatural,
    Crono follows Marle through the rift, a Threshold of Danger leading to an unknown
    world—the past. Here he meets strong enemies and new helpers, with Lucca joining
    his team permanently and Frog becoming an ally to the party. Crono literally begins
    his walk on The Road of Trials, eventually getting arrested, tried, and sentenced
    to death. Rescued from the depths of prison by Lucca, Crono and company continue
    to face challenges, but as their obstacles increase in difficulty, their helpers
    increase in number.


    Eventually the hero must face The Ultimate Ordeal. In videogamespeak, this usually
    translates to The Final Boss. In Chrono Trigger, the final boss is Lavos, an alien
    parasite that will bring the doom of mankind. Squaring off against Lavos deep
    in the Ocean Palace in 12,000 BC, this should be our moment of triumph, when we
    save the world and return home wiser and stronger.


    But it’s not.'
