    to me it felt more like a clumsy tie-in that invalidated everything triumphant
    about Chrono Trigger. And there is still worse. The serial manga Jikū Bōken Nuumamonjā—perhaps
    localizable as Space-Time Adventure Nu and Kilwala—features the tiresome antics
    of two of the most familiar monsters in Chrono Trigger. This comic was later adapted
    into an abysmal featurette known in some circles as the “Chrono Trigger anime,”
    despite not featuring in any significant way the cast we’ve grown to love. I am
    tempted to blame Nuumamonjā for the death of the Chrono series, but it’s more
    likely that lightning struck the Dream Team only once.


    Fans seem to have treated the legacy of Chrono Trigger with more respect than
    its copyright-holders have. The sheer volume of unofficial art, fiction, music,
    comics, wikis, games, and criticism (like this book) attests to the influence
    that this game has had on the people who have played it. For the time being, Chrono
    Trigger has achieved a kind of temporary immortality through its fandom.


    The karmic fate of Crono and company, luckily, is less complex than the game they
    star in. Each time we complete a full turn of the adventure, we have a chance
    to start over again. Not just from scratch, but rather with a “New Game +.”


    Crono still wakes up the same old way. “Good morning, Crono!” Our always unflappable
    mom is unfazed by all the items we seem to have acquired overnight. Her suddenly
    ultra-buff, filthy-rich, weapon-hoarding, women’s-clothing-collecting son is the
    same as he was yesterday. Does she even see?


    Our first New Game + slightly lifts the veil between worlds for Crono and those
    who join his party. A gate has appeared on Lucca’s telepod, one that leads straight
    to Lavos. But Lucca displays no awareness of the anomaly, and neither does Marle
    until she joins Crono officially. There is a world behind this world, surely something
    unknown and exciting. If Crono and Marle travel through this new gate and can
    vanquish Lavos as a duo, then they’ll reach what must be the closest thing Chrono
    Trigger has to a heaven. And yes, they can take all their items with them.


    •


    The in-game headquarters of the Dream Team is a repurposed End of Time, now populated
    by Chrono Trigger staff in the guise of mostly familiar sprites. Some of these
    creator demigods joke around with us, revealing their roles in our adventure,
    while others stump us with non-sequiturs. Still others are relieved that the game
    is over. “I’ve lost 22 pounds because of this game,” laments field programmer
    Kazumi Kobayashi in the form of a fallen soldier, “You’d better be enjoying it!”
    Others complain about their graying hair, or just feeling so fucking tired. There’s
    something amiss about the afterlife, and it feels hollow. This end-of-game End
    of Time is just an antechamber, however. Once we talk to all of its restless spirits,
    the tabernacle of creation is unlocked for us. We’re about to meet our makers.


    There they are, the three members of the Dream Team, here as an expanded pentad.
    The two newcomers are producer Kazuhiko Aoki—dressed in a partial tanuki suit
    emblazoned with a Chinese character,[16](#ChronoTriggerMoyer-13.xhtml_footnote-016)
    and co-composer Nobuo Uematsu as semicorporeal Norstein Bekkler. But it is the
    three major creators of Chrono Trigger who should draw our attention. Here are
    the men who, traveling once upon a time to the United States to study the newest
    computer graphics, began enthusiastic discussions to make a game together. Drinking
    and chatting, these three gurus—Hironobu Sakaguchi, Yūji Horii, and Akira Toriyama—laid
    the broad foundations for what would, with the help of many minions, become Chrono
    Trigger. Flash forward several years from those first fateful sips of booze, and
    how do these men appear here, in this holiest of holies? As towering gods? As
    badass superbosses?


    They are just men. Dumpy, un-kawaii caricatures of their real-world appearances.
    Surely, though, this disappointing trinity has something meaningful to say.


    “Boy, it used to be that I’d get thinner after each game,” whines Sakaguchi, “Now
    I’m gaining weight instead. Ack! I must be getting old.” This is not the type
    of reassurance we want to hear from God. Hiding his face with a surgical mask,
    Toriyama gives a generic shoutout to his children. Horii, a nonsense riddle fit
    for a modern day Lewis Carroll:


    One of these things is not like the others…


    A Stapler, Mothra, and the Olympics.


    SO… which one is it?


    I have formulated my own tentative answer to Horii’s riddle,[17](#ChronoTriggerMoyer-13.xhtml_footnote-015)
    but does his Zen koan hint at greater meaning behind the universe, or does it
    instead reveal the nonsensicality of existence?


    We have met our creators, and they are all too human. Luckily, we don’t have to
    hang around this dull purgatory for eternity. Once we’ve spoken to all five Dream
    Team members, we are hastily told that we’ve been accepted as a member of the
    Team as well. After a speedrun of the credits—“since you blew through the game
    so fast”—we are rocketed back to the limbo of the title screen. Where, if we want,
    we can start all over again.


    •


    Chrono Trigger is a static game. Once we discover all the secrets, experience
    all the endings, there’s little else to do before it becomes repetitive. Those
    of us who began with the SNES version might upgrade to the DS version, and complete
    all the new quests this parallel universe offers. But how many times can we play
    Chrono Trigger before we move on? There are more games than this, and countless
    more adventures that lie outside of chunky gray cartridges.


    All of us look back on our lives with a mixture of regret, satisfaction, and nostalgia
    for our achievements and our failures. Would we reset our lives with a chance
    to end up at that title screen of birth? And if we could find it, how do we decide
    between the possibilities of a fresh start at level 1, or the baggage of a New
    Game +?'
