    But, is Lavos actually evil? Most of the villains in the Square pantheon are insatiable
    megalomaniacs, and many of them harbor a sociopathic hatred of life itself. Chrono
    Trigger’s answer to Final Fantasy IV’s Zemus, or to FF6’s Kefka, is Queen Zeal.
    She, like these other fiends, channels her lust for power and disdain for weakness
    into a final form. Shedding their humanoid appearances, these villains achieve
    monstrous apotheoses, becoming beautiful, surrealistic abominations. But Queen
    Zeal is not our final foe. We don’t even have to fight her. It is Lavos who beckons.


    After we break into the outer shell of Lavos, we follow throbbing biorhythms to
    what seems like its core. There, a grotesquely large biomechanoid crowds the screen.
    Our party comes to understand that Lavos “has slept underground, controlling evolution
    on this world for his own purpose,” and that eventually Lavos’s spawn “must migrate
    to other planets… to repeat the cycle.”


    Unlike the cast of Chrono Trigger, I have real difficulty imagining Lavos as male.
    Lavos is too big, too inhuman, too godlike to be anthropomorphized as a “him.”
    Regardless of the party’s gendering of their enemy, if their collective hypothesis
    is indeed true, then humankind actually owes its existence to Lavos. Even ignoring
    the convenient fact that Lavos’s appearance saved humanity from extinction at
    the hands of the reptites, if Lavos did shape all of life for its own gain, we
    cannot remove it from the equation. There’s a reason we can’t stop Lavos from
    ever appearing on our planet. We would not exist without it.


    Battling through Lavos’s second transformation, we finally see its final form,
    a triptych boss comprising an oversized biped flanked by two floating pods. Lavos’s
    evolution occurs in reverse in comparison with the regular Square baddies, shrinking
    from monster-sized to near-humanoid in a twisted apanthroposis. Humans were Lavos’s
    pet project, and it has refashioned itself in their image.


    Is Lavos a selfish conqueror of the world, or a planetary farmer simply following
    its instincts? How sentient is Lavos, and if it can speak to us, why won’t it?
    Do apiarists palaver with their bees, or do they just mind the hives and collect
    the honey? It’s painful to imagine our species as insects, as fodder for something
    bigger, more powerful. Something that could plummet from above and ruin us in
    the blink of an eye.


    •


    1974 AD. Nippon Hōsō Kyōkai, Japan’s public broadcasting corporation, held a campaign
    soliciting artwork from Japanese citizens to memorialize the atomic bombings from
    nearly 30 years prior. Of the 975 pieces collected and exhibited in Hiroshima
    in August of that year, 101 were chosen for publication.


    Unforgettable Fire is as beautiful as it is terrifying. If the postscript to the
    book is to be believed, none of the contributing artists were professionals. Indeed,
    many of the drawings are rough, primitivist, dominated by grays and reds. Dismembered,
    disfigured, and destitute characters float through limbo-like landscapes. For
    all of these artists, the memory of Little Boy’s leveling of Hiroshima is vivid,
    whether they were well into their 80s or as young as their 30s.


    The work of one then-36-year-old artist captured my attention immediately. Tsutomu
    Ojiri remembers having seen the A-bomb falling from the sky. A five panel time-lapse
    begins with one large red circle and a smaller red circle underneath. Going right
    to left—Japanese style—the top ball seems to shrink as the lower one grows larger
    and larger, extending from a crude red lightning bolt. The fireball gradually
    dwarfs the sun until it is monstrous and starlike itself, too big to fit in the
    final panel. I couldn’t help but imagine Tsutomu as young boy, seeing that horrible
    Lavosian red fireball barreling towards him.


    Other images in this catalog are less vivid but equally evocative. Yūji Ichida—age
    64 at time of drawing—depicts a despairing woman, fully clothed, holding a small
    naked form in her hands. Behind her, a dead animal. And behind that, ruin. Piles
    of debris, trees stripped of all leaves and standing haunted in a hazy waste.
    If this is the aftermath of apocalypse, then we are lucky not to travel through
    the broken world of 1999 AD after Lavos arises volcanic from his slumber.


    •


    I last saw Fukushima City in the summer of 2009, three years after I had moved
    back from Japan to the U.S. On the surface, nothing much had changed in my absence.
    But my old haunts felt more like ghost towns. Quieter. Emptier. I knew almost
    nobody, and nobody knew me. Whatever magic there had been had largely dissipated.
    I felt out of place. Out of time.


    Two years later, when the combined forces of nature and man—magic and tech?—collided
    to form a triple disaster on March 11, I was frantic. I texted, sent hasty emails.
    All of them the same: “Daijōbu?” Are you OK? Friends in the Tokyo area and the
    Tōhoku Region alike responded. Yes, we’re OK, but…


    There’s always a but. Japanese is a language of ambiguities, a language of un-finishing
    each other’s sentences. But these buts continued into grim new clauses. But my
    friend’s grandmother was swept away by the tsunami. But our home is wrecked and
    we are sheltering at the elementary school. But we are afraid to go outside because
    of the radiation.


    Several months later, an ex-boyfriend living in Tokyo—but a Fukushiman by birth—told
    me about what was going on in the city where I once lived a comfortable expatriate
    life. His family’s dogs couldn’t go out for walks because of the radiation. Worse,
    the local children weren’t allowed out to play. Even worse, fewer local children
    remained in Fukushima—many families had fled the city in panic.


    I remembered long bicycle rides along the Abukuma River, treks up Hanamiyama to
    see the view of Mount Shinobu protruding nipple-like from the center of the city.
    I remembered my students—middle-schoolers in their sailor uniforms, elementary-schoolers
    shouldering carapacean randoseru bookbags. I remembered the wizened, overtanned
    granny on the first floor of my apartment building, half-crooning at me in her
    gutteral Fukushima dialect to make weather smalltalk. Adzē nā? Yes, ma’am, it
    is hot. Goddamn, is it hot.


    I wanted to cry and found that I couldn’t. If there is an appropriate soundtrack
    to this desperate, empty feeling, we have all heard it as Lavos spirals down to
    our eventual peril—“At the Bottom of Night.” There not even sadness can survive.
    It is just a vast, starry emptiness.


    •'
