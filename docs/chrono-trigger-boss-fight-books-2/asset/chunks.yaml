  raw: 'Meanwhile, inflation simply does not exist in the timeline of Chrono Trigger.
    The price of tonic remains 10G from 65,000,000 BC all the way to 2300 AD. And
    neither of these eras understands what “G” means as a currency. In prehistory,
    most meaningful trade is accomplished through bartering objects like feathers
    and flower petals, and you’ll even get a few freebies like the healing “sweet
    water.” Our party can nevertheless purchase basic items like tonics for gold,
    or as the cavefolk call it, “shiny stone.” Far in the future, tonics are still
    available. The merchants dubiously accept gold as cash—“You call this money?”—but
    one wonders what type of economy the post-apocalypse can support. While the merchants
    may have been the lowest social class in pre-modern Japan—ranking fourth below
    samurai, farmers, and craftsmen—they are the most visible evidence of economic
    activity throughout the ages.


    Other professions of course support our narrative and gameplay. Innkeepers provide
    spaces to heal our party, and the greater hospitality industry employs many other
    barkeeps and servers to run the pubs, where some of the juiciest, quest-advancingest
    gossip circulates. The growing transportation industry between Truce and Porre
    hints at a new kind of industry. Careers in the military are a popular choice
    in the latter half of the first millennium AD—there are at least 39 knights and
    soldiers in 600 AD, when Guardia faced Magus’s forces, and 22 active military
    personnel in Guardia even in the peaceful 1000 AD. And while many of these occupations,
    especially the military, tend to attract men, there are still career paths for
    women. Even in the clergy.


    •


    For a country with such a conspicuously large building for worship, there is little
    religion in Guardia. Once we’ve defeated the four false nuns in the cathedral
    in 600 AD, there are few visible people actively engaged in religious life, and
    most of them are women of the cloth. So why this massive Christian-like cathedral,
    which surely cost enough G to make even the gougiest merchant retire from sales?


    The answer lies in that non-canonical ending where Frog and Queen Leene tie the
    knot in 600 AD. As the credits roll, the duo advances up the aisle. A man dressed
    in Zealish garb waits behind the altar to officiate the ceremony. While the back
    end of the cathedral may be a secret refuge for Guardia royalty, or perhaps the
    quarters of the priests and nuns, the chapel at the front is purely for ceremony.
    It is likely that the funeral of Guardia XXI was held here, since in this alternate
    ending Leene is free to marry again. Unless polywog polygamy is totally cool in
    medieval Guardia.


    Back in our world, and many miles west from the center of Fukushima City, lies
    St. Anna’s Garden, a picturesque tourism spot that features the Michinoku microbrewery,
    an ice cream shop, and ample opportunities for antiquing. At the entrance to this
    little shopping village where I spent several totally heterosexual man-dates is
    a single-aisled chapel adorned with stained glass windows. Unlike the vaguely
    Christian image of the winged figure in Chrono Trigger’s cathedral, St. Anna’s
    Church displays a triptych of Jesus crucified, resurrected, and returned to his
    disciples. Most who visit St. Anna’s Church, however, do not pray to Anna, mother
    of the Virgin Mary, or to Christ himself. With roughly only 1% of Japanese professing
    Christianity, St. Anna’s Church doesn’t even offer regular church services. But
    it does perform weddings galore.


    Historically, the most popular form of wedding in Japan was Shintō, which as the
    state religion of Japan naturally monopolized the marriage industry. Even up to
    the 1980s, Shintō-style weddings accounted for more than 90% of all ceremonies.
    I had the chance to attend a Shintō wedding in 2005, and it was almost unintelligible
    to me. Then again, it was conducted in archaic Japanese, and I was drunk on ritual
    sake.


    This wedding was an anomaly for two major reasons. First, the groom was a white
    foreigner and the bride a Japanese resident of Fukushima, neither of whom could
    understand the ceremonial language much either. Second, by 2005 the Christian-style
    wedding had long been the choice for marrying couples, though like all imports
    it would be given some uniquely Japanese flavors. As social anthropologist Michael
    Fisch notes, the officiants of Christian-style weddings in Japan don’t even need
    to be ordained ministers. They can simply be hired actors—especially white males—who
    look and dress the part. Fisch, a self-described Jew and dual Israeli-American
    citizen, even worked as a hired priest to study the phenomenon of Christian-style
    weddings.


    So in this alternate ending sometime after our party first visits 600 AD, a priest
    or perhaps an actor bedecked in a traditional costume—close to thirteen millennia
    out of fashion by this point—celebrates the marriage of Frog and Leene in a church
    vaguely dedicated to some sort of angelic being. The only known visitor to cathedral
    is the 600 AD Chancellor, who is of course Yakra in disguise. Perhaps the association
    of organized religion with monsters was prevalent enough for citizens to abandon
    the cathedral. By 1000 AD the building has vanished from the map, having been
    swallowed by the Guardia Forest.


    Our journey into the cathedral in 600 AD finds us face to face with an idol of
    Magus, whom the monsters worship as a god on earth. Four hundred years later in
    Medina village, this statue has survived, and adherents still sing songs to their
    fiendlord. After our party defeats Magus in 600 AD and he is hurled backward through
    time to his home era, the leadership of monsterdom has been usurped by his henchchief
    Ozzie. The Medinans no longer offer praise to the statue of Magus, but rather
    to the graven image of Ozzie himself. After we trounce Ozzie in 600 AD for the
    final time, this second statue vanishes, leaving nothing but an unadorned agora.
    By removing these false gods one after the other, we complete the process of civilizing
    the savage monsters by dismantling their entire belief system. Way to go, light-skinned
    Guardia imperialists!


    The elimination of organized religion, however, is not the full subtext of our
    sidequests. In the ideal, all-quests-cleared timeline of Chrono Trigger, religion—or
    at least the idea of religion—still has its place. When the party completes the
    quest to make Fiona’s Forest grow, the former site of conservationist Fiona’s
    home in 600 AD has been replaced with a shrine. Inside, nuns offer prayers to
    the once again broken-down body of Robo, whom we instruct to help reforest the
    land for several centuries before the party zips casually to the present in their
    time machine to find him completely lifeless. After rescuing and repairing Robo
    for the third time, the shrine is left without its relic. Upon our return, we
    can see that the primary object of veneration has become a seed, a symbol which
    holds significance for people of many eras. Whether Fiona’s Shrine is a religious
    place or a sparse museum is up for debate. The nun who shamelessly hawks her wares
    inside the shrine suggests that like St. Anna, fertile Fiona has become a patron
    saint of thinly-disguised commerce.


    •


    Y2K came and went without global destruction in its wake. The stone juggernaut
    of the Mayan calendar completed its full turn in 2012, and we were not crushed
    under the wheel of the new b’ak’tun. We survived. The Earth survived. And it hasn’t
    stopped moving.


    This world moves fast, but we do not feel the motions of our planet, rotating
    on its axis, wobbling its way around the Sun. We observe them only through the
    passing of day into night, from season begetting new season. The world moves slow,
    and we do not experience the subtle drifts of continents, the creation of new
    land masses from the old. We guess these changes only through fossil records and
    jigsaw cartography.'
