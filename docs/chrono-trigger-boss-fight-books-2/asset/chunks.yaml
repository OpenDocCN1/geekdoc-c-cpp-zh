    Christopher Steiner 提出的本地化“边界地带”出现在 2001 年的著作《事物的帝国：价值体系与物质文化》中“通过仪式：论边界地带艺术的边缘身份”一章。Ted（Thomas
    Edward）Woolsey 于 1991 年在华盛顿大学完成的硕士论文名为《现代主义的轰动：作家与 1923 年关东大地震》。我曾于 2013 年底通过电子邮件分别对
    Woolsey 和 Tom Slattery 进行了采访。


    ## 书中生活


    以下是我能够参考的《时空之子》（Chrono Trigger）攻略（包括日语版和英文版）的时间顺序列表：


    - `Kurono Torigā Kōryaku Daitokushū (Shūeisha, 1995 年 4 月 15 日) [V-Jump 特刊]`

    - `Chrono Trigger: Super Famicom (Shūeisha, 1995 年 4 月 25 日)`

    - `Chrono Trigger: The Perfect (Shūeisha, 1995 年 6 月)`

    - `Chrono Trigger Instruction Booklet (Squaresoft, 1995 年 8 月) [随卡带发行]`

    - `Chrono Trigger: Player’s Guide (Nintendo of America, 1995 年 10 月)`

    - `Chrono Trigger: The Complete (Shūeisha, 1999 年)`

    - `Final Fantasy Chronicles Official Strategy Guide: Chrono Trigger and Final
    Fantasy IV (BradyGames, 2001 年)`

    - `Chrono Trigger: Perfect Bible (Shūeisha, 2008 年)`

    - `Chrono Trigger: Ultimania (Square Enix, 2009 年)`


    ## 终点


    井堀悠（Yūji Horii）在接受 `Play Online` 采访中透露了他在《时空之子》中时间旅行的基本设定，该采访目前存档于 Internet Archive（http://bit.ly/1g2nomC）。加藤正（Masato
    Katō）在 1999 年 11 月接受《时空之子》作曲家光田康（Yasunori Mitsuda）的采访中回顾了开发中的困难。日语版可以在光田的主页 `Our
    Millennial Fair`（http://bit.ly/1bPYyUs）上找到；英文版存档于 Internet Archive（http://bit.ly/1Xogfmt）。


    ## 宿命时刻


    由泽泽浩（Hiroshi Izawa）和菊池明（Akihiro Kikuchi）收集的 nu/kilwala 漫画于 1998 年由集英社出版为《Jikū
    Bōken Nuumamonjā》。动画版正式发布于 1996 年由集英社出版的《VHS V Janpu V Fesu ‘96 Bideo》合辑带中。你可以在
    YouTube 上找到非官方拷贝。


