    The localizations of games produced in Japan have been a mixed bag. Misspellings
    and solecisms abound in early Nintendo games, like the `Ghosts ’n Goblins` farewell
    message “Congraturation this story is happy end,” or `Pro Wrestling`’s “A winner
    is you!” A mixture of disdain and ironic appreciation often accompanies these
    sloppy translations. Others have become beloved exemplars of “Engrish.” Meme historians
    among us will recall the viral line “All your base are belong to us,” even if
    few of them played its source game, `Zero Wing`. Fans of the Squareverse, meanwhile,
    have a great affection for what is the most memorable insult of the first North
    American incarnation of `Final Fantasy IV`—“You spoony bard!”


    All of these quirky translations have one thing in common—they were produced by
    Japanese speakers who knew English, but not quite well enough. Accurate, organic
    translations require native speakers of the target language to be present and
    engaged in the process. But sometimes translation alone doesn’t suffice. Allusions
    to events, characters, imagery, and other artifacts specific to Japanese culture
    may not make sense across national borders, no matter how crisply they have been
    rendered into English.


    If these borders are obstacles to clarity, then the process of localizing Japanese
    games—of masking “cultural odors” with Anglophone-friendly scents—takes place
    in what art historian and anthropologist Christopher Steiner deems a “border zone,”
    a place in which “mediators wrestle with and negotiate the meaning and value that
    goods will assume when they ‘land.’” `Chrono Trigger` has had the uncommon experience
    of being pushed through such border zones twice—first for its initial release
    onto the `SNES`, and a second time for its `Nintendo DS` port. And anyone who’s
    entered (or re-entered) America’s borders knows that crossing through customs
    can be a harrowing experience.


    • Scholar of Japanese literature Ted Woolsey had just completed his master’s thesis
    on Japanese disasters in modern literature when he was hired to work for Square.
    Woolsey’s first project was to work on the localization of what was to become
    `Final Fantasy Legend III`—the first Square title to feature an actual native
    English speaker at the helm of the translation—and his job was to make the English
    version as un-spoony as possible. Woolsey served as a translator for other seminal
    Square titles like `Secret of Mana`, `Final Fantasy III` (i.e., `FF6`), and of
    course, `Chrono Trigger`.


    Woolsey’s liberal use of familiar Western allusions at the expense of the Japanese
    source text has evoked both praise and derision from generations of Square fans.
    The term “Woolseyism” has even been coined, perhaps disparagingly, to describe
    translations that drastically divert from the Japanese original. Certainly the
    `Chrono Trigger` I played is keenly different from the one released in Japan.


    Throughout their first decade and a half in North America, Nintendo was a fierce
    bowdlerizer of video games, both local and imported from Japan. References to
    “adult” themes in Japanese games—sex, nudity, violence, or alcohol—were expunged
    and often replaced with less objectionable material. So, no matter how fiercely
    devoted Square fans are to textual fidelity, Woolsey can surely be forgiven for
    keeping the Naga-ette Bromide ambiguously unsexual, or for turning a drinking
    contest into a soda-chugging game.


    Beyond retooling scripts to fit Nintendo’s standards, Woolsey added much of his
    own characteristic flair. For instance, he changed the names of Magus’s three
    generals, `Binegā`, `Soisō`, and `Mayonē` to `Ozzie`, `Slash`, and `Flea` respectively.
    The astute reader might recognize those original names as Japanized versions of
    “vinegar,” “soy sauce,” and “mayonnaise,” and indeed names as food puns are a
    staple of Akira Toriyama characters. In English, however, the Toriyama connection
    loses its impact, as does the phonetic resonance of having each of the names end
    in a long vowel. Similarly, it loses the pun of `Flea/Mayonē` ending his sentences
    with the compound particle `yonē`, which expresses both certainty and a desire
    to be validated—and an idiosyncrasy which makes `Flea` sound a bit “girlier.”
    Woolsey replaced these linguistically nuanced condiments with references to rock
    musicians: vocalist `Ozzy Osbourne`, guitarist `Slash` of `Guns N’ Roses`, and
    bassist `Flea` of `Red Hot Chili Peppers`. Elsewhere in the village of `Dorino`
    in 600 AD, Woolsey’s joke gets a punch line when a villager calls Magus’s generals
    “tone-deaf evil fiends.” And, whether intentional or not, `Ozzie’s` memorable
    exclamation “Ozzie’s in a pickle!” plays on his Japanese name, while “Ozzie’s
    in a jam!” deliciously puns on both.


    Other Woolsey inventions are the frequent religious references. He renamed the
    lackluster `Majinki` (“Demon Machine”) to the more familiar `Mammon Machine`,
    suggesting the biblical scale of the greed that drives Queen Zeal to madness.
    As for Queen Zeal’s three cronies, the 1960s Batman henchmanesque names of `Bosshu`,
    `Gasshu`, and `Hasshu` were redubbed as `Melchior`, `Gaspar`, and `Belthasar`,
    the names traditionally given to the Christian Wise Men, or `Magi`, who visited
    the newly-born Jesus. `Magi`, of course, is a plural of “magus.”


    Some of Woolsey’s translations seem purely fanciful. Magus’s spell to summon `Lavos`
    was translated from the nonsensical “Da zuma rafua rō raira” to the equally gibberish
    “Neuga, ziena, zieber, zom.” But this too is purposeful, as it creates a rhyming
    couplet with the line, “Now the chosen time has come.” Even this gobbledygook
    got localized to conform with English literatures’s love for incantatory rhyme.


    Perhaps Woolsey’s biggest move was giving Frog the archaic knightspeak that defined
    his character for English audiences. In Japanese, Frog is actually the least proper
    of the party, ending his sentences with rough masculine particles like `ze` and
    `zo`, sounding more like a cartoonish thug. Rendering this roughness into English
    might have necessitated the use of swear words, and you can guess how Nintendo
    of America would have felt about that.


    Woolsey has been interviewed several times over the years on a broad range of
    topics, from his days at Square to his short run at Big Rain, to his current work
    at Microsoft. I reached out to him with some questions of my own, and I was delighted
    to know that nearly decades later Woolsey still remembers `Chrono Trigger`.


    • Michael P. Williams: You’ve noted in several interviews the technical challenges,
    time limitations—you only had 30 days each to complete `Secret of Mana` and `Final
    Fantasy III`—and censorship imposed on you in translating for North American customers.
    What difficulties did localizing `Chrono Trigger` present?


    Ted Woolsey: I was asked to do what I had to in order to improve the screen text
    after it had been given a rough translation by the staff. Essentially, I had to
    rewrite the game, and retranslate huge chunks. I spent several weeks in Tokyo,
    and later in Seattle, doing just that. It might have been that Square management
    at the time underestimated the complexity of translating `Chrono Trigger`, or
    games in general. They certainly fixed things in later years, hiring great, talented
    professionals to do the work and giving them some freedom and the right resources.
    But my work on `Chrono Trigger` was during the early days of `SNES` carts, and
    you had to hold so much of the story, voice, and tone in your head, imagining
    how characters would be interacting. It was hard trying to come up with resourceful
    solutions to some of the characters. I wish I had had more time to really think
    through some of my decisions. But in translating, sometimes you have to pick your
    North Star, and just run with it, especially when time is of the essence.

    '
