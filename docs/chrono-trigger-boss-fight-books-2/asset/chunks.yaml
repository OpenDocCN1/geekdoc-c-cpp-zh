    Crono and his friends succeed in their mission to prevent the Day of Lavos, there
    will be no dark future for humanity at all. The game spares us the messy paradoxes
    that often accompany time travel and shows Doan surviving the timeline shift created
    by the removal of Lavos from the future. Summoned to the castle one last time,
    Crono is greeted by the united representatives of the Guardia family tree, from
    Ayla’s husband Kino who planted that first seed, branching all the way forward
    to Doan, who—in whatever timeline’s future he is from—has discovered the will
    to continue living.


    •


    A counterpoint to Eliot: Even if I knew the world would end tomorrow, I would
    continue to plant my apple trees.


    The internet attributes this apocryphal quotation and several variants of it to
    both the sainted Protestant reformer Martin Luther and the celebrated civil rights
    leader named in his honor. The debate over whether or not this quote is “real,”
    though, has no bearing on its message of determination, courage, and hope.


    I was never much of a believer in hope. Hope is an all too convenient word. Hope
    gets peddled to desperate people as the slick fiction that somehow life will provide
    for them. It has to! Right?


    But hope isn’t blind. Hope is optimism—a cautious optimism. Hope is the strength
    to struggle for a better life, even from the pits of abject despair. Hope is the
    collective will of our heroes to face the fearsome unknown and the frightening
    very known. Without effort, hope is meaningless.


    It is either the height of insult or the most empathetic of encouragements to
    tell the people of Fukushima to continue to plant their apple trees. Fears of
    radioactive produce have devastated the farms of this agricultural region. Apples,
    once a major celebrated produce of the Fukushima prefecture, no longer sell. But
    farmers must continue to plant their trees, because the only other choice is despair.


    And there is actual hope. A few short years after the disaster, farms have begun
    to reclaim recently decontaminated land. The people and their government are not
    yet giving up, but progress will take hard work, many years, and a lot of seeds.


    A seed is a future that might happen. No matter how carefully it may be tended
    and nurtured, it may never sprout. No matter how neglected or poorly sown, it
    may still take purchase and grow. The future in our world is not something we
    apprehend. We are forever glimpsing ahead to a moment that might never happen.
    We are the people of Chrono Trigger’s 2300 AD. All we can do is plant our seeds,
    work to nourish and encourage them, and hope they will someday grow into something
    beautiful, useful, alive.


    # Neuga, Ziena, Zieber, Zom


    North America does not experience the same continental catastrophology as the
    small island nation of Japan, completely contained in the Pacific Ocean’s Ring
    of Fire. Indeed, natural disasters, which have been used as critical punctuation
    points in the run-on sentence of Japanese history, do not seem to preoccupy our
    transnational consciousness. In an instance of all-too-neat parallelism, the Tōhoku
    quake occurred on the eleventh day of March 2011\. It wasn’t long before media
    opportunists capitalized on the vocabulary of the September 11, 2001 attacks in
    the United States and dubbed the day “3/11,” placing the tragedy on the same level
    as America’s own go-to national crisis, 9/11\. The succinct use of our own vocabulary
    conveys the import of the Great East Japan Earthquake far better than a lengthy
    explanation or even a “Simple English” Wikipedia page. By a simple substitution
    of terms, we can eliminate the foreignness, the over-thereness. We create an emotional
    response that makes sense to us, the locals.


    •'
