    # 队伍发现自己在 `Lavos` 面前准备得极其糟糕，并惨惨地失败了。或者他们并没有失败，你解锁了一个惊喜结局——但只有在你作弊的情况下。这对于那些召唤了全能
    `Game Genie` 的聪明 `Aladdins` 并没有无意，但在这一点，你本应该失败的。


    这一失败的时刻恰逢 `Crono` 背离了我们玩家做出的选择。在没有任何手柄操作输入的情况下，`Crono` 独自向前面对 `Lavos`。愤怒的 `Lavos`
    用一道古老的光束击中了 `Crono`。`Crono` 的身体通电了。随着屏幕逐渐变白，一个黑暗、闪烁的小点从他的身体中升起。那是——那是他的灵魂吗？


    他的身体开始解体，像素剥落，直到只剩下这个微小的悬浮光点。它脉动着挑战性的蓝光，但随后它也消失了。


    `Crono` 死了。


    ## 等等，什么？


    我们英雄的旅程随着英雄的死亡结束得非常突然。就在游戏的中途中。而且我们甚至不需要他回来。这是一个巨大的意外，字面上来说是一个游戏规则的改变者。


    由于我们不再被要求在战斗小队中保留 `Crono`，我们可以学习以前无法获得的三连技（triple techs）——这是结合了角色个人技能的强大三人技能。这一事件还开启了通往结局本身的道路。我们可以让
    `Crono` 悬浮在虚空中，在没有他的情况下战斗 `Lavos`，而且不需要弄清楚游戏的标题到底是什么意思。


    作为一个全面的玩家，我最终想要体验一下没有 `Crono` 的结局，但第一次尝试时，我只想让自己免于毁灭。


    从实际角度来看，`Crono` 是游戏中的支柱，他参加了每一场战斗并获得了所有那些辛苦获得的经验值。顺便说一下，不在活跃队伍中的角色会获得战斗中获得的 `EXP`
    的 75%，但这些点如何应用于升级受到限制。简而言之，战斗次数最多的角色是最强的。此外，没有 `Crono`，游戏三分之二的三连技将无法使用。他不仅是我们剧情的核心，更是战斗系统本身。


    此外，我需要看到他完成圆满。我需要他体内的“我”获得成功。那么，当没有英雄可以继续旅行时，`Chrono Trigger` 的英雄旅程会发生什么？


    嗯，一段新的旅程在第一段程之中开始了。玩家现在引导一个集体英雄——没有 `Crono` 的队伍——通过一段微型旅程来拯救原始英雄。没有 `Crono` 的团队接受了拯救他们前领导的“冒险召唤”（Call
    to Adventure），并在导师 `Gaspar` 和 `Belthasar` 处获得指导，学习如何尝试这种几乎不可能的复活。


    有趣的是，如果故事策划师 `Masato Katō` 得偿所愿，这一成就可能是完全不可能。`Katō` 原计划让 `Crono` 永久死亡。队伍将从“千年游览会”（Millennial
    Fair）前晚临时借一个 `Crono` 的版本，但随后将其送回去面对不可避免的死亡——也许这就是为什么在冒险开始时他已经穿好了全套？这个想法被拒绝了，取而代之的是一个更好的结局，一个需要新支线的结局。


    拯救 `Crono` 是一个有趣的任务，充满了讽刺、标题的重复以及——呃，好吧——一个小游戏。除非我们在“千年游览会”上花了大量时间胡闹、踢机器人以及在跑步比赛中进行未成年赌博，否则我们可能错过了在
    `Norstein Bekkler` 的“恐怖帐篷”（Tent of Horrors）中赢得非猫类物品的机会，如 `Poyozo Dolls`（`Chrono
    Trigger` 对 `Furbies` 的回答）或者一个等比例、功能完好的 `Crono` 复制。最后一个奖励对 Bekkler 先生的本质引起了一些严肃的问题，但他提供
    `Crono Clone`（Crono 克隆）的能力对于我们的队伍与领袖重聚至关重要。我们需要为 RPG 历史上最重要的调换之一准备一个替身。


    但这个玩偶是有代价的。这不仅仅是我们可以通过围攻一个唱歌机器人，或者通过狂灌“苏打水”直到吐来轻松获得的银币点。不，我们必须为之而战。在一个非常强调时机的节奏匹配游戏中，玩家必须与
    `Crono Clone` 竞争，模仿他的动作——举起左臂、右手、大笑、表示惊讶。我们必须准确地模仿对手，因为如果我们按错按钮就会输掉。随着小游戏的进行，速度变得越来越快。当我疯狂地镜像克隆的动作时，我发现自己在对他的面部表情做出反应，在他大笑时微笑，每当他表现出惊讶时睁大眼睛。


    技术高明的玩家第一次就能通过这个小游戏。然后是像我这样失败的人。在我最近的一次重玩中，我把手柄扔向屏幕，大骂对手是个该死的臭妈娘，然后重置游戏并再次尝试。如果我们已经在游戏早些时候由
    `Crono` 领首的队伍获得了 `Crono Clone`，我们就会获得一种模仿作为我们替身的 PC（玩家角色）之模仿模仿的有趣体验。哇，元元素（meta）太强了。


    除了克隆，我们的队伍还需要同名的 `Chrono Trigger`，`Gaspar` 是这样描述它的的：“它是纯粹的潜力。通过释放特定的事件链，它可以对时间产生强大的影响。”
    `Belthasar` 为 `Trigger` 恢复生命的能力增加了一个额外的限制条件——死掉的人“对时空连续体必须重要”。


    带着克隆和 `Chrono Trigger`，我们的队伍必须爬上 `Death Peak`（死亡巅峰），这是一个之前无法进入且危险的地方，那里有几个小头目。然而，这些敌人并不是队伍的终极考验——激活
    `Chrono Trigger` 才是。如果 `Crono` 没有像我们认为的那样对宇宙重要，它可能会失败。如果发现 `Trigger` 在拉动时没有启动，将是一个巨大的失望。`Crono`
    必须是重要的，对吧？


    取决于队伍中有谁，我们可以目证各种对宇宙的情感诉求，让 `Crono` 回来。他们的请求必须生效，因为我们被带到了那个时空片段，`Crono` 悬在 `Lavos`
    阴险的光中。通过与 `Crono Clone` 交换身体，我们的英雄将 `Crono` 带回人世。


    复活的 `Crono` 可以随队伍继续他最初的英雄旅程。我们认为的对抗 `Lavos` 的最终战斗其实只是 `Crono` 英雄旅程中的另一个复合步骤——一次“下入深渊”之后，紧接着的是“从死而复生”。`Crono`
    和他的队伍可以解决支线并获得强大的武器，直到他们准备好面对 `Lavos` 真正的终极考验。如果他们成功了，就可以通过“危险门槛”（Threshold of
    Danger）回到他们的平凡世界。


    •


    由于“旅程”一直是故事和剧本创作中经常使用的工具，它与经典的亚里士多德戏剧三幕式结构联系在一起：铺垫、一个充满角色发展和动作不断增加的故事弧，以及一个包含高潮和解决的终幕。我们与
    `Lavos` 的战斗应该是高潮的最佳标记——那是我们本应该赢得的战斗。但我们没有赢，留下的是一个死的 `Crono` 和一个破碎的队伍。故事本身也崩溃了。显然，亚里士多德没有预料到这一点。


    '
- fmt: "\nGame Design Forum founder Patrick Holleman, approaching `Chrono Trigger`\
    \ from a gameplay perspective, divides the story into two acts punctuated by `Crono`’s\
    \ demise and its direct aftermath—the linear “Tragedy of the Entity,” and the\
    \ open-worlded “Comedy of the Sages.” The first act is an adventure game that\
    \ creates the illusion of choice and the ability to affect events through time.\
    \ The second half, a game of puzzles and nonlinear sidequests, makes this power\
    \ to change history a reality. Holleman’s bipartite structure echoes the first\
    \ English strategy guide, `Chrono Trigger Player’s Guide`, which offers the reader\
    \ a “Chart of Steps” and a “Chart of Events,” with `Crono`’s death as the fulcrum.\n\
    \n`RPG` players usually expect an important character to die, perhaps even a party\
    \ member whom we directly control. These tragedies equip the party with fresh\
    \ resolution and sometimes new skills and items to pass through the next obstacle.\
    \ But to rob the party of its leader in such an abrupt way—and to allow you to\
    \ accept this fact without any required response—is a ballsy move, and one that\
    \ defies traditional story structures.\n\nMost games couldn’t suddenly axe their\
    \ main characters and expect players to stick with them. `Chrono Trigger`, however,\
    \ manages to get away with this. The sheer novelty of having the main party member\
    \ die, of course, isn’t enough to keep the player involved. It is the power of\
    \ the characters who surround, support, and ultimately save `Crono` that allows\
    \ the adventure to continue. And in a game where the hero has a hard time speaking\
    \ up, we’re lucky we have friends who have something to say.\n\n# Party Like It’s\
    \ 1999 AD\n\nLet me throw something out there—I’m terrible at making friends.\n\
    \nIt’s not that I don’t have friends, or that I’m a bad friend to the ones I do\
    \ have. I just tend to limit my main party to a few select people I trust to accompany\
    \ me through life’s important journeys. The many acquaintances who pop in and\
    \ out of my life are valuable `NPCs`—people who provide me with rich information,\
    \ surprise bonuses, and quest prompts. But they are not usually the people I call\
    \ upon when I am in need.\n\nYou can choose your friends, but you can’t choose\
    \ your family. A well-known adage that emphasizes the primacy of kinship—of bloodlines\
    \ and marriage—over friendship. In `Chrono Trigger`, though, we don’t even get\
    \ a choice in our friends.\n\nBesides our taciturn avatar `Crono`, there are five\
    \ major heroes who join our party no matter what we do—and no, I haven’t forgotten\
    \ him. Sit tight. Like it or not, these five become our extended family for the\
    \ course of the game, bound by a common interest in saving the world. And if we\
    \ accept that friendship is something we choose, then the main cast of characters\
    \ of `Chrono Trigger` are not exactly friends. But neither are they family—most\
    \ of them have their own family drama to deal with. Rather, they are something\
    \ that is neither and both of these things. \n\nThey are our fellowship, our party—the\
    \ people who will literally follow us to the end of time.\n\n•\n\nThe five characters\
    \ who answer the call of heroism are an odd and interesting lot. Each has a particular\
    \ type of weapon that only he or she can equip, and each has an innate affinity\
    \ for one of four elements: lightning, water, fire, and shadow—non-alignment itself\
    \ is an unofficial fifth element. These weapons and affinities do not simply add\
    \ variety and strategic challenges to the game, but also complement our party\
    \ members’ characterizations.\n\nThe first person to join our crew is `Marle`,\
    \ a crossbow-wielding girl and a bit of a gigglepuss. This bubbly adventure-seeker\
    \ spares no time in sizing up `Crono` as a potential boyfriend, making him escort\
    \ her through the `Millennial Fair`. It might be easy to label `Marle`—secretly\
    \ `Princess Nadia` of `Guardia` in disguise—as a “tomboy,” as a gossipy matron\
    \ at the fair does. But this oversimplifies `Marle` into a troubling stereotype,\
    \ and she’s already burdened with the “royal disguised as pauper” trope. `Marle`\
    \ does indeed become a romantic interest for commoner `Crono`, though it might\
    \ be more accurate to say he becomes one for her.\n\n`Marle`’s elemental affinity\
    \ is water. Water nurtures, and is a basic physical need for humans. `Marle`’s\
    \ healing techniques prove crucial in early battles. Water is also a symbol of\
    \ sorrow, of tears. Many tender moments in `Chrono Trigger` involve `Marle`—if\
    \ we bring her to `Death Peak` to rescue `Crono` from time-stasis, we are shown\
    \ a truly emotional scene of `Marle`’s deep affection for him.\n\n`Crono`’s other\
    \ major emotional interest is `Lucca`, a sort of big sister type. Rather than\
    \ creating a love triangle between `Crono`, `Marle`, and `Lucca`, `Chrono Trigger`\
    \ not only has `Lucca` accept `Marle` unconditionally, but also shows her complimenting\
    \ `Crono` for having landed a “cutie.”\n\n`Lucca` is a gifted inventor (or, inventress,\
    \ as the `DS` version genders it), so her alignment with the element fire—the\
    \ spark of passion and creativity—is an appropriate choice. While her inventions\
    \ have a reputation around town for being kooky, she is clearly a genius. `Lucca`\
    \ is also an expert marksman (or, markswoman, as nobody ever genders it), and\
    \ her long-range firearms mirror `Marle`’s crossbows.\n\n`Crono`’s journey really\
    \ begins with the malfunctioning of `Lucca`’s teleportation device, but this only\
    \ occurs after the introduction of `Marle`’s mystic pendant. This clash of science\
    \ and magic prefigures the powerful `Antipode` double techs that these two characters\
    \ will eventually activate by fusing their water and fire affinities. We should\
    \ note that the net elemental effect of these `Antipode` spells creates shadow,\
    \ the opposite of `Crono`’s element. The original North American release obscures\
    \ this fact—first localized as “lightning,” `Crono`’s element is “light” in the\
    \ `DS` translation. The accidental collaboration between `Crono`’s two shadow-animas\
    \ literally unlocks the gate to adventure.\n\nMore specifically, a gate to the\
    \ Middle Ages, where we meet the aptly-monered `Frog`. A chivalrous batrachrope\
    \ and sword-wielding knight, `Frog` speaks in a “Ye Olde English” dialogue that\
    \ is as charming as it is suspect. No one else in `600 AD` talks like `Frog`.\
    \ Not even `Glenn`, the boy `Frog` used to be. We can therefore forgive `Frog`\
    \ for having no idea how to use Middle English properly—it’s likely an affectation\
    \ intended to support his yearnings for heroism.\n\nBecause everything about our\
