    * * *


    [16](#ChronoTriggerMoyer-13.xhtml_footnote-016-backlink) The character 中, pronounceable
    as naka or chū, chiefly bearing the meaning of “middle” or “center.” I have not
    deduced the meaning of Aoki’s sprite.


    [17](#ChronoTriggerMoyer-13.xhtml_footnote-015-backlink) “Mothra, because she’s
    boring!” The riddle is the same in Japanese, and my nonsense answer relies on
    a Japanese linguistics pun. Both “stapler” (hochikissu, ホッチキス) and “Olympics”
    (Orinpikku, オリンピック) contain the consonant-doubling “ッ,” which can be described
    as a tsumaru oto (つまる音), or “a stopping-up sound.” “Mothra” (Mosura, モスラ) does
    not contain ッ, so it does not stop up (tsumaranai). More punnily, tsumaranai means
    “uninteresting.”


    # NOTES


    The Strong, Silent Type


    Petri Lankoski’s remarks on game engagement can be found in his article “Player
    Character Engagement in Computer Games” (Games and Culture 6:4, July 2011). Joseph
    Campbell’s monomyth appears in his book The Hero with a Thousand Faces. Information
    about the “unhappy ending” originally planned for Chrono Trigger comes from an
    interview with story planner Masato Katō in the Japanese Chrono Trigger: Ultimania.
    The English translation by Cal Hampton is hosted here at the fansite Chrono Compendium:
    [http://bit.ly/1bsOCGa](http://bit.ly/1bsOCGa). The first printing of this book
    mistakenly attributed the plan for Crono to die to game supervisor Yūji Horii
    and not story planner Masato Katō. Patrick Holleman’s notes on Chrono Trigger’s
    design are in his 2012 book Reverse Design: Chrono Trigger, available for purchase
    at [thegamedesignforum.com](http://www.thegamedesignforum.com).


    Straight? White? Male?


    Tanner Higgin explores Tolkien’s and Lewis’s European mythbuilding in “Blackless
    Fantasy: The Disappearance of Race in Massively Multiplayer Online Role-Playing
    Games” (Games and Culture 4:1\. January 2009). Iwabuchi Kōichi talks about mukokuseki
    in his 2002 book Recentering Globalization: Popular Culture and Japanese Transnationalism.
    Tetsu Misaki writes about Mr. Popo and Dragon Ball Z in his Japanese-language
    book Doragon Bōru no Mangagaku, published by Sairyūsha in 2011\. Miki Tanikawa’s
    discusses the “science girl” stereotype in a June 16, 2013 New York Times article
    “Japan’s ‘Science Women’ Seek an Identity” ([http://nyti.ms/1gAefSP](http://nyti.ms/1gAefSP)).
    Evan Lauteria’s remarks on sexual normativity and silent protagonists appear in
    his paper “Sexuality and Sexual Orientation in Console and Computer Games,” originally
    presented at the game studies conference “Videogames and the Alien/Other” in 2006\.
    James Valentine talks about okama in “Pots and Pans: Identification of Queer Japanese
    in Terms of Discrimination” in the 1997 compilation Queerly Phrased: Language,
    Gender and Sexuality.


    Steel and Pure Logic


    Eric Yosomono’s description of arrests in Japanese can be found on his blog Gaijinass
    in a January 2, 2011 post titled “7 Brutal Realities Regarding Arrest in Japan”
    ([http://bit.ly/1czEoOR](http://bit.ly/1czEoOR)). Michael Fisch describes Christian
    style weddings in Japan in “The Rise of the Chapel Wedding in Japan: Simulation
    and Performance” (Japanese Journal of Religious Studies 28:1-2, 2001).


    The Day of Lavos


    The NHK’s Unforgettable Fire: Pictures Drawn by Atomic Bomb Survivors was published
    by Wildwood House in 1981\. It is the English translation of a Japanese book called
    Gōka o Mita : Shimin no Te de Genbaku no E, published in 1975.


    Neuga, Ziena, Zieber, Zom'
