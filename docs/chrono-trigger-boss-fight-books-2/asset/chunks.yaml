  trans: '

    Tom Slattery 为 Square 公司的工作主要包括对《最终幻想》系列游戏的全新英文翻译，其中 `FF6`（该作此前已被 Woolsey 翻译过一次）以及
    `FF4` 的 3D 重制。Slattery 显然意识到粉丝对游戏中某些肉骚（spoony）台词的渴望，因此保留了那句著名的台词，甚至在游戏中“开发者办公室”的元数据登场中对此开过玩笑。Slattery
    重新翻译游戏的方法是尽可能保留前几个版本建立的传承，同时消除无意间的错误，并补偿早期版本带来的技术问题。例如，Woolsey 受到字符空间的限制，因此在音译紧凑的日语片假名中可以轻松容纳的名字和物品，在英语中需要缩写。而这种限制并不适用于
    Slattery，他能够使用如“Athenian water”（雅典水）等长术语来代替缩短的“revive”（复活）。Slattery 也免了《时空之旅》北美首发版时所遭受的严苛审查。


    Slattery 慷慨地回答了我关于他在《时空之旅》工作中一些问题，让我们了解了 Square 及其本地化自 SNES 时代以来发生了变化。


    ### Michael P. Williams：重新翻译你从小长大的游戏，特别是 Woolsey 翻译的游戏，是什么样的体验？


    **Tom Slattery**: 一方面，有机会为新一代更新如此许多定义了我童年的游戏，这简直是梦想成真。另一方面，知道粉丝会对每一个词都与原版进行对比——会有人因为任何一句改变的台词而感到不悦，另一些人会因为任何一句没改的而感到不悦——这让任务变得相当艰巨。我尽力在保留怀旧感为新玩家提供最佳体验之间取得平衡，但当然，也有人觉得重新翻译在某个方向上走得太远。


    不过，在 Woolsey 几年前翻译的同一个文件中进行阅读和工作确实非常有趣。看到他当年必须处理的问题——而且在没有像我这样拥有 `Google`、`Wikipedia`
    以及分析游戏每个细微细节的专业粉丝网站的情况下——这确实让你对他在如此短时间内完成的成就产生新的赞赏。文件中存在完全错乱的对话，有在没有预警的情况下重复使用的消息，完全没有出现的消息，而且完全没有任何注释来为翻译人员提供这些情况的线索。


    ### MPW：Woolsey 的翻译决策曾受到批评，但最终这些翻译成为了北美游戏的标准文本，偏离这些文本可能会破坏怀旧感。在《时空之旅》中，你想要保留哪些“Woolsey
    式”（Woolseyisms）？你又想让元素更接近日语原意？


    **TS**: 我做的其他许多移植版和重制版都接受了全新的翻译，但对于《时空之旅》，更倾向于一次更新和润色。谈论我想改变的内容可能比谈论我想保留的内容容易得多。


    我的主要目标是消除原版字符限制造成的损害，并消除削弱了游戏设定和人物刻画的不一致之处。我扩展了那些为了适应 `SNES` 版本人工长度限制而明显被压缩或更改的敌人、物品和技能名称，但我保留了几乎所有的角色名字。在对话方面，我根据现有文本进行工作，主要尝试收紧
    Ted 所做的内容。例如，我很喜欢艾拉（Ayla）和朋友们的原始人口语，但那种风格跳跃很大。有时他们使用冠词和复数，有时又不使用。有时主语和谓语一致，有时又不一致。我喜欢青蛙（Frog）听起来不像现代人，但如果他是他那个时代唯一一个使用时代错误语言风格的角色，就太不合逻辑了，而且他的语法并不一致，甚至并不总是是正确的。


    就像《最终幻想 VI》一样，我试图保留最具有怀旧感的台词——除非这些台词与设定不符（例如引用了美国货币），并在我可能的地方注入新的幽默感。不过，至少从我的角度来看，《时空之旅》并没有像《最终幻想
    VI》那样有那么多令人难忘的金句。即使我是两款游戏的粉丝，在处理它们时，我也做了大量研究，以查看其他玩家留恋本地化的哪些方面。虽然《最终幻想 VI》是一部非常容易被引用的游戏，但似乎对于大多数人来说，《时空之旅》的魅力更多来自整体故事和角色互动，而不是单句台词。因此如此，我对对话的修改相当大胆。如果我觉得某处是一种改进，我通常会采纳。


    ### MPW：你曾在游戏中加入过任何“Slattery 式”（Slatteryisms）的内容吗？


    **TS**: 确实到处都有。例如，我把史前时代的“soup”（汤）变成了“skull-smash”（碎头）（因为“第二天，头感觉像被碎了！”），并将一个孩子不理解表示“慷慨”或“慈善”的日语词汇的台词，变成了她误解了“magnanimous”（大度）一词，认为人们在说她爸爸胖。


    当然，我也引入了一些无意的 Slattery 式。


    首先，正如许多人注意到的那样，我通过一个女性化代词将 `Azala` 设为女性。`Azala` 是艾拉的宿敌，这个名字听起来完全是女性化的，而且像素画看起来像穿着一件飘逸的粉色长袍。我的大脑从一开始就毫无置疑地认为这个角色是蜥蜴人女王，以至于我从未想过她——或者我的意思是，它——可能不是女性。没有人质疑我的假设，直到游戏母带（master
    up）完成后我才注意到游戏中没有对任何蜥蜴人的性别进行直接引用。它们可能被设计为无性别，或者考虑到它们不是人类，性别可能并没有被视为一个重要的细节，但日语版总是避免特指性别。我实际上只是查了一下，看看日本玩家是否将该角色解释为男性或女性，发现日语的
    `Wikipedia` 文章目前指出该角色“被认为是女性，因为英文 DS 版将 `Azala` 称为‘she’”。所以我想我也成功地搞混了日本。


    其次，我在新结局中将应该是“时间之外的黑暗”（Darkness Beyond Time）的区域翻译成了“时间的蚀刻”（Time’s Eclipse）。没有人提到这个术语是《时空穿越者》（Chrono
    Cross）的引用，因此在没有《时空穿越者》术语表参考且我不熟悉该名称日语名称的情况下——我玩的是英文版——我没有猜它不是像其他地方一样是一个新设计的地点名称。不过，这个引用丢失了确实遗憾，因为那个序列本是为了把两款游戏联系在一起的。


    ### MPW：在为北美任天堂客户重新翻译原版没有的新对话（如新结局和新支线任务）时，你是如何处理的？


    **TS**: 老实说，翻译新文本是项目中最简单的部分。这是唯一一个我不需要处理遗留问题；只需匹配游戏中其他部分的风格和人物设定即可。当然，增加的内容也是最后进入游戏的内容，内容一直到质量保证的最后一天都在变化，所以在这方面确实存在翻译挑战。


    ### MPW：在为北美任天堂客户重新翻译时，你是否面临过其他技术挑战、时间限制或审查问题？


