  trans: '

    《时空之子》（Chrono Trigger）中的怪物展示了更加多元的种族关系观。


    我们的队伍穿越公元 1000 年梅迪纳村（Medina Village）的大门，意外发现了居住在那里的两个小鬼——一个是青蓝色的“蓝小鬼”，另一个是深芥末黄色的“泥小鬼”。两者之间的关系并不明确，但泥小鬼责备了闯入者：“你们认为自己是谁？随天随地进出我们的储物室。”他们显然是室友，可能是一对伴侣。在送走我们的人类队伍之前，他们还提供了一些食物。在这间小小的旅馆里，甚至没有出现物种间的紧张关系！


    事实上，《时空之子》中的许多怪物在功能上似乎是“后种族”的，而与它们共存并偶尔被其屠杀的人类，则是无助的“非种族化”。人类中存在任何变异种族的唯一证据，是公元前
    6500 万年前，锈色头发和黄色头发的伊奥坎族（Iokan）与紫色头发的拉鲁班族（Larubans）的融合——他们所有人肤色都是相同的。当这些部落最终在艾拉（Ayla）的带领下统一时，他们通婚创造了一个单一种族，其主要特征是不可预测的发色。


    这种对人类多样性的缺乏对于 1995 年的我来说并不奇怪。这仅仅是与我所喜爱的游戏相关的审美风格。我清楚，游戏——即使是角色扮演游戏——也可以并且确实通过代表多种肤色来增加精灵的多样性。例如，《地球洋界》（EarthBound）就有一些肤色较深的
    NPC。一个被频繁使用的精灵“莫霍克男人”总是让我想起 T 先生（Mr. T）。Square 公司又花了几年时间，通过另一部“最终”幻想游戏，才揭晓了巴雷·华莱士（Barret
    Wallace），那是他们对那位深受爱的、从保镖变成演员再变成受怜悯疯子的角色的回答。


    但《地球洋界》是现实世界。或者至少是我们世界一个经过虚构化和严重扭曲的仿真品。Square 的幻想类 RPG 是拥有宏伟王国、神秘水晶、毛茸茸可爱莫古（moogles）和陆鸟农场的遥远星球。当村民坐下享用辣陆鸟翅膀大餐时，唯一重要的种族紧张是物种间的紧张。最近怪物的攻击一直在增加，不是吗？晚上出门已经不再安全了，对吧？无数陈词滥调的
    NPC 台词暗示危险的“异类”潜伏在镇子边缘，准备出手。


    《时空之子》拥抱了广泛的主题——史前人与恐龙的乱斗、未来主义机器人枪战、世纪初的田园诗意。但这部经典 Square RPG 遗产赖的基础的主题是剑与魔法，这种流派无处不在，甚至可以谨慎地与“幻想”等同。我们越在
    Square 的 RPG 目录中向后回溯，未来主义和技术的元素就消失越多。第一部《最终幻想》的世界几乎没有科幻元素。除了一两个奇怪的机器人外，这个世界由典型的幻想生物组成——精灵、矮人、美人鱼。而在序场演职员之前的第一个任务——一种序曲性的冒险——竟然是去救一个该死的公主！这还能有多典型呢？


    早期魔法中世纪风格 Square RPG 的根源——让我们以 1987 年发布的《最终幻想》为例——延伸到一年多年前由 Enix 的《龙之物》（Dragon
    Quest）耕种的日本土地；《龙之物》本身深受《巫术》（Wizardry）和《魔法》（Ultima）等电脑 RPG 的启发，这两者都于 1981 年在北美发布。这些游戏反过来追溯到更早的将纸笔角色扮演电子化的尝试。也许其中最老祖级的是《地下城与龙》（Dungeons
    & Dragons）——即使对非玩家来说也是家喻户晓。D&D 借用了已经确立的微缩战争游戏的机制，并加入了来自各种神话和推测小说的奇幻元素。尽管 D&D 的开发者盖瑞·盖格（Gary
    Gygax）声称他的游戏与 J.R.R·托尔金以《指环王》为核心的传奇体系之间的相似性是表面的——是的，《地下城与龙》里确实有霍比特（呃，“半身人”）——但他确实注意到，他刻意借用这些元素是为了接触更广泛的受众，当时的观众绝对对霍比特着了迷。


    那又怎样？嗯，我们现在可以将《时空之子》定位为直接挪用《指环王》标志性元素的游戏的后代——一个远远的孙侄？而托尔金和他的酒友、纳尼亚传奇的创造者 C.S·刘易斯并不仅仅是为了娱乐而写小说。事实上，文化理论家和数字媒体专家坦纳·希金斯（Tanner
    Higgin）认为，他们正在创造新的欧洲神话，用幻想世界作为西欧的替代品，并用人类这一元种族取代白人。那么，在托尔金的中地球，非人类种族和邪恶阵营的人类，就是占据欧洲圈之外土地的危险的、非白人的“异类。《指环王》的流行电影改编以及当代的幻想
    IP（如《哈利·波特》和《游戏之王》）依赖欧洲中心主义作为文化基石，这绝非巧合。


    《时空之子》中的人类是“白人”吗？对于 1995 年的我来说，他们看起来有点那样。我很容易看到克罗诺（Crono）浅桃色的脸，并把自己的形象投射在他身上。克罗诺社区中缺乏其他明显的肤色，暗示这些人都是同一个种族。但对于比我早几个月体验《时空之子》的日本玩家来说，这些浅肤色角色完全可以是亚洲人。无论他们拥有多么不可能的发色。


    奇特的身体特征——例如露嘉（Lucca）的紫色头发——暗示游戏中的人类与玩家的人类并不完全相同。但他们的整体设计意味着这些人类应该是代表我们的。这种对角色设计的异域化实现了一种通常被称为“无国籍性”（mukokuseki）的审美。“无国籍性”是“国籍”（kokuseki）的缺失，你们中可能有人记得，这是日本人口普查对“民族”的回答。“国籍”与“民族”的混淆使得无国籍性成为一个难以处理的术语——这是公民权的缺失、民族身份的缺失，还是两者兼有？


    岩部光（Kōichi Iwabuchi）是一位将该术语引入英语语界的媒体与文化研究教授，他指出，“无国籍性”试图消除国际产品中日本的“文化味道”。但任何熟悉日本漫画、动画和视频游戏的人都能透过绿色的头发和紫红色的眉毛闻那股日本味。在《时空之子》（Kurono
    Torigāryaku）包含的一段采访中，《龙珠》系列著名的设计师鸟山明（Akira Toriyama）明确表示，他打算为《时空之子》的不同时代创造一个“无国籍性”的角色阵容。山岩《龙珠
    Z》中的角色之一——漆黑且厚唇的包波（Mr. Popo）——在北美动画首秀反响后，后来被涂成了蓝色。亚文化评论家崎哲（Tetsu Misaki）写道，甚至有些日本抗议团体认为这个角色具有冒犯性。

