  trans: '

    对于《时空穿越》（Chrono）系列决定将露卡（Lucca）推向单妈妈这一角色，我有些意见。从一个角度来看，这似乎是将露卡从职业科学家的身份中抽离，并将她重塑为传统的全职妈妈角色，而她的母亲拉拉（Lara）恰好胜任这一点。但另一方面，露卡在阻止拉拉部分瘫痪方面可能成功也失败，她从这段独特的时旅行经历中学了自己母亲的价值。让露卡在母性和科学事业之间做选择是不公平的，那么露卡接受成为大家的母亲这一角色意味着什么呢？《时空穿越》的哪个版本都没有为这个困境提供解决方案，但我们可以希望
    Robo Jr. 和 Kid 的并存能为露卡提供一个结合科学与家庭愿望的独特机会。


    我们的最后一位女性英雄是艾拉（Ayla），天哪，她简直把性感指数调高到了极致！鸟山雄的官方画作显示艾拉丰满的胸部填满了她稀少的皮草装。与游戏中另一位金发美女玛莉（Marle）不同，艾拉展示的遠不僅僅於深邃的乳沟——她完全外露了腹部。


    虽然艾拉无疑是游戏中最性感的角色，但她也带有一些明显的非女性化倾向，比如嗜酒如命和毫无顾忌地打嗝。在第一个北美译版中，所有这些饮酒行为都被审查为“吃汤”。然而，遗憾的是，游戏中的一个强制事件是克诺（Crono）在一场史前派对上赢过——呃，是“吃过”了艾拉。艾拉体面地输了，并对克诺的能力表示尊重——或许，也是尊重我们能快速连续按动那个该死的
    A 键的能力。尽管如此，我禁不住觉得这既是一个毫无趣味的小游戏，也是对艾拉强悍形象的破坏。


    艾拉的形象由阿扎拉（Azala）来平衡，她是蜥蜴人（Reptites）的领袖——一种恐龙人类，早期人类的对手。虽然在超级任天堂（SNES）版本中没有性别设定，但
    Nintendo DS 的翻译巧妙地暗示了阿扎拉是女性。这两位强大女性为了星球命运而产生的冲突，是对以往以男性为主的双角关系的一种令人欢迎的改变。像阿扎拉这样强大的女性支持角色——无论是英雄还是反派——都有助于《时空穿越》中女性形象的多样化。


    赞亚尔女王（Queen Zeal）被虚荣和权欲冲昏了，这与妈妈（Mother Brain）形成了鲜明对比，后者的冷酷逻辑决定了机器人文明的兴起。然而，据我们所知，妈妈只创造了一个女性机器人——Robo
    的女性伴侣 Atropos XR。妈妈的技术统治与赞亚尔女王的王室形成了有趣的平行关系，后者除了她的女儿莎拉（Schala）外，同样全是男性。比起这两个致命女，莎拉的威胁性小得多，但可能同样强大，软弱的莎拉证明了克诺被杀死后拯救我们的队伍免遭拉沃斯（Lavos）起到了关键作用。如果我们相信《时空之门》（Chrono
    Cross）所推销的，莎拉最终将与拉沃斯融合，成为梦境吞噬者，时空宇宙中最强大的反派。


    遗憾的是，这些重要 NPC 的存在掩盖了推动剧情发展的男性角色数量之多。每有一个阿扎拉，就真的有两个奥兹（Ozzy）。男性主导了景观，最终主导了星球上有机体的政治结构。他们也占游戏中
    NPC 的绝大多数。


    在玩《时空穿越》DS 版时，我数了 425 个人类角色。其中只有 154 人（35%）是女性，而多达 266 人（61%）是男性——对于那些一起数的人来说，缺失的五个人来自史前和公元
    2300 年的孩子，他们的性别没有明确指示。观察游戏过程中各个主要时代的这些数字，史前是性别最平衡的社会，每 1 个女性对应 1.6 个男性。即使我们假设那些毛人洞小孩都是女性，男性仍然多于女性。事实证明，分布最均匀的是公元
    1000 年，假设我们算入了官方结局中发生的月光游行（Moonlight Parade）。游行中简直挤满了女性——从赛场走几步路进入下方的广场，就能看到女舞者凭空出现并旋转庆祝。小女孩们举起手臂和脸庞随歌唱。在派对的
    33 个新 NPC 中，32 个是女性。不仅发生月光游行的官方结局是令人满意的，它们还为我们在《时空穿越》中能找到的性别平等提供了最有希望的展望。


    我特意将怪物排除在上述计数之外。确定游戏中怪物的性别是一项困难的任务，尽管我们必须假设许多怪物是女性。公元 1000 年美迪纳村（Medina Village）怪物种群的持续存在取决于这一事实。除非大多数怪物是无性繁殖的，那将完全无趣。


    噢，有人提到“怪物性爱”吗？少数被明确指定为女性的怪物之一是“蛇人”（naga-ette），她拥有蛇的下半身和丰满的胸部。如果队伍探索公元 600 年大教堂的深处，我们发现了“秘密蛇人溴片（the
    secret Naga-ette Bromide）”。当我第一次玩这个游戏时，模糊地知道 `bromide` 是一个药学术语，所以我认为这一定是某种超级秘药。并不是。在日语中，`buromaido`
    指的是名人的印刷照片，命名源于 20 世纪初摄影使用的溴化银乳剂。女性溴片通常看起来有点像性感女，就像杂志折页上的海报女孩。当队伍发现这件珍贵物品时，一群坏人冲进房间并攻击。为什么？因为我们偷了他们的色情材料。稍后，我们可以把这张性照卖给一个肮脏的老头来换取强化。


    《时空穿越》中的女性绝不仅仅是投射性幻想的载体，对女性身体最恶劣的商品化只发生在怪物色情中。虽然游戏通常满足于维持传统的性别关联，但它至少为女性提供了成为强大、有利角色的场景，而不仅仅是任务目标。


    III


    早晨七点，我正站在冰凉的车站等候，手里拿着一个甜甜圈肉卷饼和一罐自动贩卖机的甜热咖啡。去物园中学（Moniwa Junior High）只有一班早车，那是福岛县所有学校中最偏远的，它在
    7:15 发车。物园中学是一所只有 11 名学生的学校。算上我，员工人数多于学生人数。整个二年级只差一个男孩。在物园，每个人都知道你的私事。而那些他们不知道的事情，他们想打听时并不害羞。


    “Maiker-sensei, kekkon shiteimasu ka?（迈克老师，你结婚了吗？）”孩子们喜欢这样问。“Kanojo imasu ka?（你有女朋友吗？）”我用各种回避的方式来回答。

    '
- fmt: '

    One rainy autumn Saturday, my then-boyfriend and I and drive up the slick mountain
    roads to Moniwa. We have heard about their onsen and we have a hankering to bathe
    with strangers. The woman who waits with towels and locker keys at the reception
    area greets us both politely in Japanese, then speaks to me in hushed, fluent
    English. She’s the mother of one of my students, and Filipina. She has been encouraging
    her daughter to speak English more at school, but the daughter is afraid of being
    singled out. Of not being Japanese enough.


    We sit in the communal lounge, relaxed from the heat of the springs, rehydrating
    and waiting for the rain to let up. The student’s mother shuffles over with a
    plate of pear slices and a pot of green tea. “For you and your friend,” she says
    in English with a knowing smile, and then she retreats into the staff kitchen,
    back to the fog of heavy steam and thick Fukushima dialect.


    ## Gender Perspective in RPGs


    Becoming the male heroes of adventure games and RPGs was never a huge shift in
    gender perspective for me. But I never felt the romances written for these protagonists.
    They always seemed artificial. Great RPGs—and I consider many of Square’s North
    American offerings during my youth to be great—not only engage us with entertaining
    gameplay but also captivate us emotionally. I felt a lot for these bright little
    collocations of pixels—their sadnesses, their triumphs, their struggles to overcome
    despair. But I couldn’t sympathize with their drives for romantic love. Of course,
    I wasn’t seeing anything in the game that looked like what I wanted. Not directly
    at least.


    Achieving romantic love is rarely a goal in the type of games I’ve enjoyed. The
    first `Dragon Quest` features a save-the-damsel plotline, but like `Mario’s Peach`
    and `Link’s Zelda`, this princess is a mere MacGuffin—all three of them can be
    replaced with a mystic thingamabob or an ancient widget and the storylines would
    remain the same. Princesses are personified objects to be found and refurbished
    into lovers. Later games complicate romances by having them occur within the roster
    of PCs. But even female party members are not spared damselhood. Both `Final Fantasy
    IV`’s `Rosa` and `EarthBound`’s `Paula` need their male love interests—protagonists
    `Cecil` and `Ness`—to save them from captivity. And in `Chrono Trigger`, `Crono`
    must save his eventual bride and princess-in-disguise `Marle` from the prison
    of a dark dimension. And to do so, he first has to rescue her ancestor `Queen
    Leene` from her male captors.


    Beyond continuing to treat women as earnable key items or kidnappable quest objectives,
    these narratives—no matter how subtly they integrate into the storyline—also privilege
    the idea of heterosexual love as what romance is. Now, there is absolutely nothing
    wrong with having a straight love story. But, it’s often the only story—nonheterosexuality
    just isn’t an option. As researcher Evan Lauteria notes, silent stand-ins like
    `Crono` who present the players with a feeling of control, also force an embedded
    sexuality onto the player. No matter what we envision for our blank avatar `Crono`,
    he’ss destined to be romantically linked to `Marle`. After the party’s first catastrophic
    encounter with `Magus`, `Crono` is knocked out and has a dream—or vision?—of a
    spouselike `Marle` rousing him from sleep, much as `Crono`’s mother does as the
    start of the game. Not only is `Crono` implied to be straight, then, but he’s
    a little bit Oedipal too.


    ## Heterosexuality and Character Dynamics


    Unsurprisingly for a mass-market product of late 20th century Japan, `Chrono Trigger`
    demonstrates a clear bias toward heterosexuality. We can certainly categorize
    `Crono` and `Marle` as a straight couple. Meanwhile, `Robo`’s got his pink doppel-lover
    `Atropos XR`, and `Ayla` her willing sextoy `Kino`. But finding the places where
    sexuality isn’t revealed is far more intriguing than cataloguing the game’s sanctioned
    couples.


    `Lucca` could be asexual—possibly even robosexual—though there is an alternate
    ending where we see `Marle` and `Lucca` ranking some of the `NPCs` as hot or not.
    `Lucca` goes so far as to call the knight `Cyrus` “a hunk” as her sprite flutters.
    `Marle`, preferring the scruffy charms of drunken treasure-hunter `Toma`, nevertheless
    speculates that he might have several girlfriends. In the `DS` version of this
    ending, `Lucca` rejoinders by wondering if he has boyfriends. They both giggle.
    Whatever `Lucca`’s sexuality, she might be open to possibilities.


    `Frog`, meanwhile, is even more of a puzzle. Unlike any of the other six party
    members, he has no known family members. His closest friend is hunky `Cyrus`,
    who protected him as a youth and for whom he squired faithfully. After `Cyrus`’s
    death at the hands of `Magus`, `Frog` is haunted by his memory and seized by a
    desire to avenge him. After the girthy `Masamune`—broken when `Cyrus` fell—is
    long and firm again, `Frog` gets the thrust he needs to continue living. Later,
    the final exchange between `Frog` and `Cyrus`’s ghost in the Northern Ruins is
    one of the gooiest, most melodramatic scenes in the game, but an interesting reward
    for having completed the tedious fetchquest and the sword-fighting foreplay with
    `Cyrus`’s ghost that precedes it. As `Cyrus`’s spirit fades into the beyond, `Frog`
    stammers, “Cyrus, wait! I … I…!” Neither of the North American versions nor the
    original Japanese offer a predicate to this delicate subject. Once again, however,
    an alternate ending adds a straight-up complication to the idea that `Frog` might
    be gay. In one ending, he is shown not only to have married `Queen Leene`, but
    also to have become the ancestor of `Marle` in the process.


    But just as `Marle` and `Lucca`’s male beauty pageant ending is difficult to resolve
    with `Chrono` canon—I know some of you will find a way!—we can also probably reject
    the implication that `Marle` might have werefrog DNA. And if it is a possible
    alternate timeline? Maybe `Frog` marries `Leene` out of his exaggerated sense
    of honor to `Cyrus`. Or maybe he’s amphibisexual.


    ## Ambiguous Identities


    The architect of `Glenn` and `Cyrus`’s parting, `Magus`, is similarly offbeat.
    `Magus`’s attachment to his sister `Schala` is somewhere between the incestuous
    and the dutifully familial. It’s difficult to envision a character as arrogant
    and power-hungry as `Magus` truly harboring romantic affection. The almost impossible
    task of finding `Schala` again is an adequate way to occupy this megalomaniac.
    If anything turns `Magus` on, it’s power.


    And he’s not the only one aroused by power. Although a minor character and a boss
    as annoying as his bloodsucking namesake, `Magus`’s general `Flea` is the most
    overt representation of alternate sexual identity in `Chrono Trigger`. Although
    `Flea` looks female, he identifies as male. Nevertheless, `Flea` is keenly aware
    of his ambiguous sexuality and his queer anthem is potent—“Male or female, what
    difference does it make? Power is beautiful, and I’ve got the power.”


    As a boss, `Flea` flits about the battle screen dramatically under his billowing
    cape, stopping sometimes to laugh exaggeratedly, to strike a pose, or to emit
    a little pink anime heart. Besides voguing, `Flea` uses hands-off status-affecting
    attacks—one blows a kiss. Much as his alternate take on gender roles baffles the
    party, `F` can literally confuse our characters during battle, causing them to
    attack each other. Just as with a few of `Ayla`’s techs, heart symbols are embedded
    in some of `Flea`’s attack names. And if `Ayla` uses her Charm ability on `Flea`
    later on in the game, she can steal the `Flea Vest`, an item more accurately translated
    in the `DS` version as the “Flea Bustier.” Yup, he’s wearing a bra. And if you
    find this item in `Chrono Cross`, only male characters can equip it.

    '
