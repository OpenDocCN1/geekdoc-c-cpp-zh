    我喜欢翻阅光滑纸质平装书时书页滑过指尖的震触感，也喜欢未装书衣的布面硬装书那种带有纹理的触感。甚至是那种旧图书馆书籍的味道——酸化的纸张与腐烂的胶水交织在一起，散成一阵刺鼻的智慧芬芳。从早年在曾祖父旧打印店那潮湿的地下室里搜寻散落的鸟类学图谱，到如今在杂乱无章的二手商店货架间翻找，我花费了大量时间在寻找书籍。收集一系列丛书，将它们并排放置，看着一个知识体系的成长——一个爱书者很容易痴迷其中。


    ### 对策略指南的痴迷


    在我多年的阅读生涯中收集并整理的众多丛书中，影响最深远、最迷人的莫过于 `Nintendo Player’s Guide` 系列。我读攻略策略就像读中篇小说一样，并成为了那些我从未玩过的游戏的专家。像
    `NES Game Atlas` 这样的汇编产生了像 `Mario Mania` 这样的全集，并为单个游戏的大型一次性策略指南铺平了道路。`Chrono Trigger
    Player’s Guide` 以 `鸟山旷明` 的官方漫画画风和和荒木太郎` 的古朴 3D 地图令我着迷。同这些官方盒装说明书一起，这些玩家指南不仅是我游戏时的伴侣，更是我想象力的燃料。在我追溯到幼儿园时期的收藏图画和文字档案中，有一张手画的
    `Chrono Trigger 中的尤斯 (Janus)`，日期为 `1998 年`。在完成游戏多年后，我仍反复查看指南以获取更多信息。这些书是经卷。就像任何虔诚的信徒一样，我很难忽视策略指南挥之不去的告诫。


    “策略指南”（strategy guide）这个词是一个方便的误称，尤其在角色扮演游戏中。RPG 策略指南通常包含角色档案、流程说明、地图、法术书、物品清单以及——我喜欢的！——怪物图鉴。这些元素安排得不当，很容易让一本伴读物变成一本剧透书。当然，心心切的读者可能会因为窥探得太早而毁了自己的了自己的体验。


    ### 童子军玩家


    我呢，是一个童子军玩家。我总是对面前的挑战做好准备。当我在广阔的地下城探索中需要方向时，我会随手带一本开好的指南。我不想错过任何东西。我想收集每一个物品，无论是独特的遗迹还是平凡的药剂。我就是无法忍受盲目。无法忍受不完整的表现。我的游戏侦察胸带上有一枚特殊的“肆意作弊”荣誉勋章。虽然我是一个在学校里从不作弊的优生，但我使用像
    `Game Genie` 这样的作弊卡带时并毫无愧疚。只有在“公平”地完成游戏之后，或者在惨遭失败之后，我才会召唤这个强大的“神灵”。就像在学校里一样，我想要通过努力工作获得完成感，即使这意味着要写几个小时的作业——或者为了升级和金币而刷几个小时的怪。带有讽刺的是，我后悔没有在现实生活中投入同等精力来提高自己的身体素质和经济状况。


    ### 作弊的代价


    大多数 `Chrono Trigger` 玩家可以轻易获取的 `Game Genie` 代码，与其说是视觉上的新奇，倒不如说是游戏内的兴奋剂。因此，与其通过破解游戏将
    `加托 (Gato)` 的像素替换为 `赛博约翰尼 (racebot Johnny)`，或者打开未使用的地图进行探索，你完全从满属性和学会所有技能开始游戏，从而消除了刷怪的必要。或者，你可以激活“一击杀”代码，无论谁先出手，都能瞬间赢得每一场战斗。应用“穿墙”代码，你现在成了一个不受空间限制的无敌半神。最后这种代码是打破平衡的绝佳方法——进行一次跨洋漫步并进入一个游戏很后期才预留的区域，你会发现自己在游戏进度中被向前推进，无法完成现在进一步冒险所需的目标。恭喜你，作弊者。你搞砸了。


    我在最近的几次 `Chrono Trigger` 游戏中游戏中惨痛地学到了这些教训。当我成年后第二次闯关游戏时，我有特定的目标。我为自己设定的最艰巨目标之一，是那个枯燥、抓狂且最终并不完美的任务：统计游戏中每一个人类角色。我需要捷径，而我有手段采取捷径。


    ### 竞技场的伦理


    我们人类经常表现得好像处在一个公平的竞技场上，每个人都有获得职业、浪漫、经济和身体成功的相同机会——这种假设既令人安慰又是虚假的。无论 `玛露 (Marle)`
    持有什么武器，或者等级升有多高，她在体能上永远比不上 `克隆 (Crono)`。无论 `克隆` 如何苦练或恳求魔法大师 `斯佩基奥 (Spekkio)`，他永远无法学会
    `玛露` 天生所赋的治愈法术。那么，为什么不给我们的角色最好的，并将他们的等级和属性升到最高，直到游戏将他们显示为“★★”呢？加速游戏让我们的 1 级小卒变成星光闪闪的超级英雄符合伦理吗？


    为了让事情更复杂化，我认为 `Chrono Trigger` 的前提——通过黑改时间线来实现愿望——本身就是作弊。


    •


    ### 时间政权


    无论是什么种利他主义支持我们对历史捣乱，我们都傲慢地承担了时间政权的责任和特权，其权威源于三个已经与日常 NPC 失去联系的老迈导师的祝福。诚然，我们的许多目标可以说是为了大局，即使它们造成了附带损害。我们击败
    `拉沃 (Lavos)` 的目标拯救了人类和大部分有机生命，尽管代价是以 `拉沃` 的后代以及可能的 `2300 年` 大部分潜在的无机——即机器人生命为代价。我们实现
    `菲奥娜 (Fiona)` 南方大陆森林梦想的追求，忽视了沙漠中脆弱的生态系统，那里生存着像沙人般的 `莫哈沃 (mohavors)` 和甲壳类的 `六足兽
    (hexapods)`。没错，这些是生命生物，但它们也是怪物。因此，我们判定自己的活动是好的——为了人类的利益而进行的修正。

    '
