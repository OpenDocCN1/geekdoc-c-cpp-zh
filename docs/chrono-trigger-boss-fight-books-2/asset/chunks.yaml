  trans: '

    这一切意味着什么？这意味着，虽然我们的伙伴可以改变周围的世界使其变得更好，但那些从中受益的时代居民永远不会意识到这一点。而 `Chrono Trigger`
    这种基于时间的利他主义的终极讽刺在于：我们无力改变自己的过去。即使我们可以做到，我们是否会像所有那些时空旅行者一样，忘记自己曾做过那些改变呢？我们将对自己的生活现状感到永远不满，永远不知道自己的地位已经提高了多少。


    ***


    [14] 死亡之峰（Death Peak）——以及可能的 `Crono Clone`支线任务——在“完美采访”期间尚未创建，后来被收录在《Kurono Torigā
    Kōryaku Daitokushū》中。


    [15] “トリガーも難航してね、終盤トップがすげかえられちゃったんだよね。”


    # 命运的时刻


    你带不走这一切。这是一句关于瞬息无常的格言，同时也体现了亲物质主义与反物质主义。尽管全球各地的葬礼文化仍会将珍宝物品随死者埋葬，但我仍然相信世俗财富可以转移到死后——如果真存在来世的话。


    从表面上看，`Chrono Trigger` 游戏的死后世界似乎非常丰富。针对各种游戏平台的几次再版承诺为玩家带来新的价值，同时继承了过去生活的精华。`Chrono
    Trigger` 系列已经诞生了新的故事，无论好坏如之。对于一些玩家来说，官方续作 `Chrono Cross` 是 `Chrono` 之名值得的延续，但对我来说，它更像是一个拙劣的联动作品，否定了
    `Chrono Trigger` 中所有的辉煌。还有更糟糕的。连载漫画《Jikū Bōken Nuumamonjā》——或许可以译为《时空冒险努姆与基拉瓦》——描写了
    `Chrono Trigger` 中两个最熟悉的怪物那令人厌烦的作剧。这部漫画后来被改编成一部在某些圈子里被称为“Chrono Trigger 动画”的极其糟糕的短片，尽管它并没有以任何重要方式出现我们所喜爱的角色阵容。我曾想怪是
    `Nuumamonjā` 导致了 `Chrono Trigger` 系列的终结，但更有可能是雷电只在梦想团队击中了一次。


    粉丝们似乎比 `Chrono Trigger` 的版权持有者对其遗产付更加尊重。非官方艺术、小说、音乐、漫画、维基、游戏和评论（如本书）的庞大数量证明了这款游戏对玩过它的人产生的影响。目前，`Chrono
    Trigger` 通过其粉丝获得了一种暂时的永恒。


    幸运的是，`Crono` 和伙伴们的因果命运比他们主演的游戏要简单得多。每当我们完成一轮完整的冒险，都有机会重新开始。不是从零开始，而是以“新游戏+”的方式重新开始。


    `Crono` 还是以老样子醒来。“早安，Crono！”我们那位从不慌乱的妈妈对我们一夜之间获得的所有物品无动于衷。她那个突然变得超强、富得流油、囤积武器、收集女装的儿子，和昨天一模一样。她真的看到了吗？


    我们的第一个新游戏+稍微为 `Crono` 和加入他队伍的人们在世界之间揭开了一层面纱。`Lucca` 的传送门上出现了一个大门，直接通往 `Lavos`。但
    `Lucca` 对这一异常毫无察觉，`Marle` 在她正式加入 `Crono` 之前也是如此。在这个世界的背后还有另一个世界，一定有些未知且令人兴奋的东西。如果
    `Crono` 和 `Marle` 穿越这个新大门并作为双人击败 `Lavos`，那么他们将到达 `Chrono Trigger` 最接近天堂的地方。是的，他们可以带上所有的物品。


    • 梦想团队的游戏总部是一个重新利用的“时终点（End of Time）”，现在由 `Chrono Trigger` 的工作人员组成，他们伪装成大多熟悉的像素形象。这些创造者半神中的一些与我们开玩笑，揭示了我们在冒险中的角色，而另一些人则用不相干的话题难倒我们。还有一些人对游戏的结束感到解脱。“因为这个游戏，我瘦了
    22 磅，”现场程序员 `Kazumi Kobayashi` 以阵亡士兵的形式哀道，“你们最好在享受它！”其他人则抱怨他们的头发白了，或者只是觉得太他妈的累。死后世界有些不对劲，感觉很空虚。然而，这个游戏结束后的“时终点”只是一个前厅。一旦我们与这里所有不安的灵魂交谈，创造的圣殿就会为我们开启。我们将见到我们的造物主了。


    他们就在那里，梦想团队的三名成员，在这里以扩展后的五人组出现。两位新成员是制作人 `青木寿彦 (Kazuhiko Aoki)`——穿着一件印有汉字的部分的狸子装，以及共同作曲
    `植松光 (Nobuo Uematsu)`——作为半实体的 `Norstein Bekkler`。但引起我们关注的是 `Chrono Trigger` 的三位主要创造者。正是这些人曾前往美国学习最新的电脑图形，开始热烈地讨论要一起制作一款游戏。在喝酒聊天中，这三位大师——`坂井广信
    (Hironobu Sakaguchi)`、`堀井雄 (Yūji Horii)` 和 `鸟山明 (Akira Toriyama)`——为这款在许多部下帮助下成为
    `Chrono Trigger` 的游戏奠定了广泛的基础。回到第一款游戏几年后，他们出现在这里时是什么样子的？作为高大的神灵？作为超级 BOSS？他们只是普通人。


    不过，这三位一体确实有些感慨。“伙计，以前每做完一个游戏我都会瘦，”`坂井` 抱怨道，“现在我反而变重了。”这不是我们想从神那里听到的安慰。`鸟山` 用外科口罩遮住脸，给出了通用的问候。`堀井`
    则留下了一个像现代刘易斯·卡罗尔式的无意义谜语：


    这些东西中有一个是不一样的……订书机、蛾拉和奥运会。


    那么……是哪一个？


    我为 `堀井` 的谜题制定了自己的初步答案，但他的禅公宗是暗示了宇宙背后更深层的意义，还是揭示了存在的无意义？我们见到了我们的造物主，他们都太有人情了。幸运的是，我们不需要在这个乏味的炼狱中永远停留。一旦我们和所有五位梦想团队成员说完话，就被匆匆告知也被接受为团队的一员。在快速看完演职表后——“因为你玩得太快了”——我们被送回标题界面的混沌状态。在那里，如果我们愿意，可以重新开始一切。


    • `Chrono Trigger` 是一个静态的游戏。一旦我们发现了所有的秘密，体验了所有的结局，在变得重复之前就没什么其他事可做了。我们这些从 `SNES`
    版本开始的人可能会升级到 `DS` 版本，并完成这个平行宇宙提供的所有新任务。但在我们离开之前，我们还能玩多少次 `Chrono Trigger` 呢？比这更多的游戏，在厚实的灰色卡带之外，还有无数的冒险。


    我们所有人都带着遗憾、满足以及对自己的成就和失败的怀旧之情，回首自己的生活。如果我们有机会重置生活，回到那个出生的标题界面，我们会这样做吗？如果我们能找到它，我们如何在在
    1 级重新开始和带着“新游戏+”的包袱之间做出决定呢？

