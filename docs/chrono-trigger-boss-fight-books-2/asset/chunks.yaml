    # 哥斯拉与原子遗产


    电影《Gojira》于 1954 年在日本上映，此时是美国在广岛和长崎投下两枚原子弹的九年后。“瘦小男孩”和“胖广子”这两头粗鲁的美国式怪兽，是世界上见过最糟糕的武器，也是原子时代最丑陋的预兆。`Gojira`——或者用我们更熟知的名字，`Godzilla`——最初是日本核愤怒的化身，是一个因其领导层罪行而遭受残酷惩罚的民族。`Godzilla`既是侵略者也是受害者，他在东京横冲直撞，直到被一种比异变它的武器还要致命的武器击败。电影在对创造出更可怕怪物的持久恐惧中结束。


    # 拉沃斯的本质


    Lavos 同样是一只背满刺的火焰生物，它无差别地破坏一切。但与`Godzilla`不同，它并不是人类干预的受害者。当`Queen Zeal` 试图为了自己的私利而利用它的能力时，`Lavos`
    已经是一个拥有巨大力量的生物，因为它已经整整花了 `64,988,000` 年时间从星球中吸收能量。


    但是，Lavos 真的是邪恶的吗？Square 世界中的大多数反派都是贪得无厌的权力狂，他们中的许多人对生命本身怀有反社会态的仇恨。《时空旅》对《最终幻想
    IV》中`Zemus`或《FF6》中`Kefka`的回答是`Queen Zeal`。她和其他恶魔一样，将对权力的欲望和对弱弱的蔑视转化为最终形态。这些反派抛弃了人类形象，实现了怪物式的升华，变成了美丽而超现实的畸形物。但
    `Queen Zeal` 并不是我们的最终敌人。我们甚至不需要和她战斗。召唤我们的是`Lavos`。


    在我们破开`Lavos` 的外壳后，我们顺着脉动的生物节奏走向了似乎是其核心的地方。在那里，一个巨大的生物机械体占据了屏幕。我们的队伍意识到，`Lavos`
    “在地下睡眠，为了自己的目的控制着这个世界的进化”，而且最终`Lavos`的后代“必须迁移到其他行星……重复这一循环”。


    与《时空旅》的角色阵容不同，我很难想象`Lavos` 是男性的。`Lavos` 太大、太不人性化、太像神了，不可能被拟人化为“他”。无论队伍如何对敌人进行性别定性，如果他们的集体假设真的是真的，那么人类的生存实际上归功于`Lavos`。即使忽略`Lavos`
    的出现拯救了人类免于被蜥鱼人灭绝之手这一便利的事实，如果`Lavos` 确实为了自己的利益塑造了所有生命，我们也无法将其从方程式中移除。我们无法阻止 `Lavos`
    永远出现在我们的星球上是有原因的。没有它，我们不存在。


    在经历过`Lavos` 的第二次变形后，我们终于看到了它的最终形态，这是一个三联画式的 Boss Boss，由一个巨大的双足生物和两侧的两个漂浮胶囊组成。`Lavos`
    的进化与普通的 Square 反派相反，它在一种扭曲的去人类化过程中，从怪兽尺寸缩小到近乎人类形态。人类是`Lavos` 的宠物计划，它按照他们的形象重塑了自己。


    `Lavos` 是一个自私的世界征服者，还是一个仅仅遵循本能的星球农夫？`Lavos` 有多大的感知？如果它能和我们说话，它为什么不说？养蜂人会和他们的蜜聊天吗，还是他们只管蜂箱并收集蜂蜜？想象我们的物种像昆虫一样成为某种更大、更强大的事物的饲料，是痛苦的。某种可能从上方坠落并在眨眼之间摧毁我们的东西。


    •


    # 不忘之火：原子弹的艺术记忆


    公元 1974 年。日本 NHK（Nippon Hōsō Kyōkai）发起了一活动，征集日本公民的艺术作品，以纪念近 30 年前的原子弹爆炸。在当年 8
    月于广岛收集并展出的 `975` 件作品中，有 `101` 件被选中。


    《不忘之火》既美丽又恐怖。如果书的后记是真的，那么所有参与的艺术家都不是专业人士。事实上，许多画作都是粗糙的、原始主义的，以灰色和红色为主。肢体破碎、面目毁损和贫困的人角漂浮在如
    limbo 般的景观中。对于所有这些艺术家来说，无论他们是年 80 多岁还是只有 30 岁，`瘦小男孩`夷平广岛的记忆都是如此生动。


    一位当时 36 岁的艺术家的作品立即吸引了我的注意。织司务（Tsutomu Ojiri）记得见过原子弹从天而降。一个五连画格的延时摄影始于一个大红圈和一个下方较小的红圈。从右向左——日式风格——上面的圆球似乎在缩小，而下方的圆球变得越来越大，从一个粗糙的红色闪电延伸出来。火球逐渐让太阳显得渺小，直到它本身也变得巨大且像星星一样，大到无法放入最后一个格子中。我不禁想象小时的织司作为一个少年，看着那个可怕的、“拉沃斯式”红色火球向他冲来。


    该目录中的其他图像没有那么生动，但同样发人深。一田裕二（Yūji Ichida，作画时 `64` 岁）描绘了一个绝望的女人，衣着整齐，手里抱着一个赤裸的小形体。在她身后，是一只死动物。在它身后，是废墟。碎片堆如山，树木光叶落尽，伫立在雾蒙蒙的荒野中。如果这是末日后的景象，那么我们幸好没有在`Lavos`
    从它的睡眠中火山般苏醒后，穿越`公元 1999 年` 那破碎的世界。


    •


    # 福岛与模糊的语言


    我最后一次看到`福岛市`是在 `2009` 年夏天，那是我从日本回到美国三年后。表面上，在我不在期间没有发生太大变化。但我熟悉的去处感觉更像鬼镇。更安静。更空旷。我几乎不认识任何人，也没有人认识我。曾经存在的魔力大部分已消失。我觉得格格不入。格不合时。


    两年后，当自然与人类的力量——魔法与科技？在 `3 月 11 日` 碰撞并形成三重灾难时，我慌了失措。我发短信，发匆忙的邮件。内容都一样：“Daijōbu?”你好吗？东京地区和东北地区的朋友都回复了。是的，我们很好，但是……


    总有一个“但是”。日语是一种模棱两角的语言，一种不完成对方句子的语言。但这些“但是”继续变成了阴森的新从句。但我朋友的奶奶被海啸冲走了。但是我们的家被毁了，我们正在小学避难。但是由于辐射，我们不敢出门门。


    几个月后，一个住在东京的前男友——但他出生于福岛——告诉我我曾生活过舒适外籍生活的那个城市发生了什么。他家里的狗因为辐射不能出去散步。糟糕的是，当地的孩子不被允许出去玩。更糟糕的是，留在福岛的孩子更少了——许多家庭恐慌地逃离了城市。


    我记得沿着`磐梯川`长骑自行车，记得登上`花山`观看从市中心像乳头一样突出的出的山。我记得我的学生们——穿着水手服的中学生，背着硬壳书包的小学生。我记得公寓楼一层那个枯瘦、皮肤黝黑的老奶奶，用她粗鲁的福岛方言对我半声吟唱着聊天气。Adzē
    nā?是的，奶奶，真热。该死的，真热啊。


    我想哭却发现哭不出来。如果说这种绝望、空虚的感觉有一种合适的配乐，那么我们都在`Lavos`螺旋向我们最终的危险——“深夜之底”时听过它。那里连悲伤都无法生存。只有一片广阔、星星的空虚。


    '
- fmt: '

    2300 AD. The Day of Lavos has come and gone, and the instigator of this apocalypse
    has long departed. Back to space, perhaps, to inhabit another world elsewhere
    in the universe. Guru Belthasar’s comments on the subject are ambiguous, and there
    is no sign of Lavos itself on the planet. Its spawn, however, remain on `Death
    Peak` where `Lavos` birthed them, destined to someday repeat the lifecycle of
    their progenitor. Mutants dominate broken urban landscapes. Robots patrol facilities
    long abandoned by mankind, programming and reprogramming themselves to KILL ALL
    HUMANS. These last human targets hole up in the temporarily safe but shattered
    dome cities. Lacking food, they hold onto life with the assistance of the `Enertron`,
    the rejuvenation device that does everything but sate the omnipresent gnawing
    hunger. The sweet water of prehistory has long dried up.


    Crono, Lucca, and Marle arrive as three bright sprites in a world of dim earth-toned
    people. Trekking across a ruined laboratory, the party arrives at the `Arris Dome`.
    Doan, the community elder, is amazed at the gumption of these young strangers.
    As we later find out, he may well have just met his own distant grandparents.


    Defeating a guardian robot in the corridors beneath the `Dome`, the party discovers
    a cache of spoiled food in a refrigeration unit long since failed. A corpse crumpled
    against the wall—the last person to attempt a trip below before our heroes arrive—is
    holding on to something small in his stiff hands—a single seed. In a nearby chest,
    a note—a clue!—probably written by this unlucky person, leads Crono and company
    to “the secret of this dome,” an information center.


    Computer-illiterate Marle fiddles with this complex technological wonder. Rather
    than accidentally summoning another guardian boss, Marle accesses a video recording
    of the `Day of Lavos`. Brief and occasionally staticky, the video feed shows an
    eruption of molten rock into the world of 1999 AD, shortly followed by `Lavos`
    itself. A plume of fiery quills shoots off from its body in all directions. Red
    destruction rains down from the sky. The video fizzles out. Lucca is nonplussed.
    Marle is stricken. Crono is characteristically silent.


    “This…” Marle sputters, “…this can’t be the way the world ends…”


    •


    ### This is the way the world ends


    Not with a bang but a whimper.


    The oft-quoted final lines of T.S. Eliot’s “The Hollow Men” are echoed in Marle’s
    outraged and desperate words. But Marle is both correct and incorrect.


    If we fight `Lavos` and lose, we are “treated” to a special ending, and a horrific
    one at that. In that same information center in the `Arris Dome` in 1999 AD, three
    technical operators witness `Lavos`’s ascension firsthand. All over the flattened
    world map red alerts flare. Then, a view of the earth—first a brilliant blue and
    green, then a foreboding, angry dark red. Then, gray. Superimposed over this holocaustic
    sight: “But… the future refused to change.”


    But this is not the way the world ends. Not exactly. `Lavos`’s explosive rise
    has destroyed much of the world and seems to have decimated the population. (To
    be fair, the world of `Chrono Trigger` seems dangerously underpopulated in every
    era.) Humanity still survives, albeit in meager and threatening conditions. If
    these humans are doomed to die—and I think we can safely interpret Marle’s idea
    of “the end of the world” to mean the extinction of mankind—then it will definitely
    occur with a whimper. The whimper of the last human to be exterminated by `Mother
    Brain`’s robot hunters. The last woman to be left for dead by a marauding mutant.
    The last man to fall over dead from sickness and hopelessness.


    But, does “the world” continue? Whether or not Crono is able to defeat `Lavos`,
    the players of `Chrono Trigger` have no assurance of what will happen in 2301
    AD or beyond. But of course Crono can defeat `Lavos`. Because we do.


    •


    Returning safely from the enemy-infested tunnels beneath `Arris Dome`, Crono and
    party present the seeds—yes, they have apparently multiplied on the trip back
    to the surface—to Doan and his group. Although skeptical, Doan tells the party
    that his people will plant the seeds. They might just save their future.


    Will these seeds thrive in the poisoned world of 2300 AD? Maybe not. But when
    Crono and his friends succeed in their mission to prevent the `Day of Lavos`,
    there will be no dark future for humanity at all. The game spares us the messy
    paradoxes that often accompany time travel and shows Doan surviving the timeline
    shift created by the removal of `Lavos` from the future. Summoned to the castle
    one last time, Crono is greeted by the united representatives of the `Guardia`
    family tree, from Ayla’s husband `Kino` who planted that first seed, branching
    all the way forward to Doan, who—in whatever timeline’s future he is from—has
    discovered the will to continue living.


    •


    ### A counterpoint to Eliot


    Even if I knew the world would end tomorrow, I would continue to plant my apple
    trees.


    The internet attributes this apocryphal quotation and several variants of it to
    both the sainted Protestant reformer `Martin Luther` and the celebrated civil
    rights leader named in his honor. The debate over whether or not this quote is
    “real,” though, has no bearing on its message of determination, courage, and hope.


    I was never much of a believer in hope. Hope is an all too convenient word. Hope
    gets peddled to desperate people as the slick fiction that somehow life will provide
    for them. It has to! Right?


    But hope isn’t blind. Hope is optimism—a cautious optimism. Hope is the strength
    to struggle for a better life, even from the pits of abject despair. Without effort,
    hope is meaningless.


    # Neuga, Ziena, Zieber, Zom


    North America does not experience the same continental catastrophology as the
    small island nation of Japan, completely contained in the Pacific Ocean’s Ring
    of Fire. Indeed, natural disasters, which have been used as critical punctuation
    points in the run-on sentence of Japanese history, do not seem to occupy our transnational
    consciousness. In an instance of all-too-neat parallelism, the `Tōhoku` quake
    occurred on the eleventh day of March 2011. It wasn’t long before media opportunists
    capitalized on the vocabulary of the September 11, 2001 attacks in the United
    States and dubbed the day `3/11`, placing the tragedy on the same level as America’s
    own go-to national crisis, `9/11`.

    '
