    BradyGames 的《时空之子》（Chrono Trigger）策略指南坚持在每次提到飞拉（Flea）并使用男性化代词时，都加上一个半心不经意的感叹疑问号：“用你最强的魔法[击]他(!!?)，他就这样离开了(!?)
    了。”而在日语版方面，指南 `Chrono Trigger: the Complete` 警告读者：“不要被外表所骗了。他其实是个男人！”8 较新的日语指南
    `Chrono Trigger: Ultimania` 则将飞拉描述为“乍看之下是一个美丽的人类女性，但实际上是一个备人尊敬的魔族男性。”9 在游戏的日语版中，飞拉使用了第一人称代词
    `atai`，这是一种口语化的女性代词，与蛙（Frog）粗鲁的男性化代词 `ore` 形成鲜明对比——顺便说一下，在日语中，“我”的表达方式至少有十几种，取决于个人的性别、年龄、场合或喜好。`atai`
    也并不是日常代词。它是代词 `atashi` 的变体，我经常听到同性恋男性在表演性场合经常使用这个词。虽然飞拉可能是一个扮演女性角色的男人，但他并不是跨性别身份甚至变装表演的真实写照。


    飞拉或许被描述为 `okama`（奇葩）要贴切得多，但这个词本身也充满了争议。`okama` 并不总是对同性恋男性的贬义，但也称不上好听。然而，它足够中性足以出现在策略指南
    `Chrono Trigger: The Perfect` 中——到底是谁给这些东西命名的呢？它告诉玩家，飞拉会“用 `okama` 语言责骂你”。10 嗯，这可挺直接的。`okama`
    的含义可以从“同性恋”的粗俗同义词，到指一个穿着女装并表现出典型女性化举止的男人。通常这两个概念会被混淆，正如社会学家詹姆斯·瓦伦丁（James Valentine）所说：“在媒体描绘中，`okama`
    看起来像伪装者，试图变成女性但明显失败了。”事实上，这种惨败的失败可能解释了为什么这些 `okama` 角色经常出现在日本电视的喜剧节目中。而另一方面，飞拉在“伪装”成女性方面却做得极其成功。


    虽然飞拉很大程度上是一个无关紧要的角色，但他的攻击策略反映了关于非传统性别定定的某些现实真相。有些人对他们视而不见，而另一些人则感到困惑和愤怒。对我们福祉最大的威胁并非来自像飞拉这样的人，而是来自我们对他们的反应。


    • 《时空之子》的幻想世界是一个异国，拥有不同的人口统计和文化规范。正如我将美国式的预期延伸到我在日本的停留是不公平的，用我们衡量自己的标准来评判一个虚构领域也是不理智的。或者期望那个世界看起来和我们的一样。事实上，正是虚构世界与我们自身世界之间的差异，才让我们想要进入它们。


    同时，幻想领域既是我们世界的衍生品，也是其伪装版——至少是那个世界的某些角落。到目前为止，我们只观察了这个平行现实的居民。但更大的机构环绕着《时空之子》的阵容和角色，有些如此微妙地融入游戏之中，以至于我们可能在毫无察觉的情况下遇到它们。


    ***


    2 “いろんな時代に行くわけですから、ちょっと無国籍な感じのキャラクターにした方がいいかな…”


    3 “主人公、日本刀なんか持って東洋的な感じがしますね。普通のRPGとは違う。”


    4 默剧演员 Gogo` 的性别尚未公开。


    5 卡（Lucca）传送门的启动仪式上，一位路人是这么说的。


    6 我统计了所有“独特”的人类 NPC（例如，没有重复计算公元前 12000 年最后村庄的幸存者，我们此前已经遇到过他们）、所有的闪回角色，并且没有任何非官方结局的角色。那三个时空错位的导师被算作他们家乡年代的公民。


    7 比如“凝视 ♡ / 飞拉的 ♡♡魔法”。


    8 “姿にだまされてはいけない。実は男なんだ！”


    9 “見た目は美しい人間の女性だが、れっきとした魔族の男。”


    10 “オカマ言葉で激しくなじる。”


    # 钢铁与纯逻辑


    昨日的明天尚未到来。


    20 世纪 50 年代对圆顶城市、胶囊餐和助手机器人“robits”的科幻梦想已化为失败的生物圈实验、Clif Bars 能量棒和 Roomba 扫地机器人。那些像
    Epcot 一样的单轨铁路和跑步机人行道呢？仅仅是往返巨型耗油飞机的次要交通工具。我们被承诺的未来究竟在何方？


    《时空之子》的未来是一片荒凉的工业景观，充满了破碎的城市和无法的废墟。人类在恐惧中蜷缩，而怪物肆无忌惮地游荡。生命被扭曲、萎缩和饥饿化。这就是奥威尔、阿特伍德、哈克斯莱和扎米亚廷曾警告过我们的那种未来。但他们的未来，无论多么反乌托邦，依然充满了人。人们只是像一如既往那样表现——压迫、统治、撒谎、控制、自欺欺人。


    《时空之子》的公元 2300 年是一个人类变得无关紧要的未来。世界已经向前，人类被遗落在尘埃中。幸存者在变异怪物和杀机器人巡逻的恐惧中生活。这难道完全是拉波斯（Lavos）的责任吗？它从星球核心释放并用地狱之火灼烧全球。还是说人类在自己的灭亡中也扮演了角色？


    我们对公元 1999 年的信息了解甚少，除了拉波斯出现的简短视觉记录外。那个时代甚至没有一张完整的世界地图——只是一个从未实现的未来剪影。超级公路和圆顶社区取代了
    999 年前（“现在”）的城镇和城堡。但公元 1000 年的郁郁葱葱已不再那样翠绿。沙漠环绕着克罗家乡所在的停战穹，向东，导师梅奇（Melchior）的小屋早已被沙子吞噬。


    构建未来的世界是有代价的，人类向星球借了一笔巨额贷款。但公元 1999 年是星球即将破产的一年。拉波斯数百万年后再次出现是一个方便但最终过于简单的答案，回答了一个我们必须问的问题：


    公元 2000 年究竟会变成什么？


    • 公元 1999 年。我们的世界。新千年的计划正在加速。狂欢分子们安排了豪华的年夜庆祝活动，预订宴会厅、供应商和演员。他们将在奢华中迎接新年，压过社交对手的庆典派对。末日准备者为元旦储备物资，收集净水、罐头食品和发电机燃料。他们将在舒适中度过新年，并将那些准备不足和愚蠢的人拒在门外。千年（Y2K）要来了。


    千年危机是一个被广泛恐慌的计算机漏洞，据称会对现代文明产生灾难性影响，而仅仅是因为懒的程序员在记录年份时使用的是两位数而不是四位数。所以，当公元 1999
    年（存储为缩短的“99”）进入 2000 年（“00”）时，计算机会认为它回到了 1900 年。正如我们从科幻小说中学到的，逻辑错误是导致机器壮性故障的主要原因之一——仅次于激光炮和难以理解的人类情感。而正是这些情感混乱、带着激光炮且逻辑崩溃的机器，在公元
    2000 年 1 月 1 日午夜零分时向人类发射了所有的弹药。


    '
- fmt: '

    We begin our tale in `Chrono Trigger` in `Guardia`, `1000 AD`—the present. This
    present is rustic. Nostalgic. Technology is not unknown, but its applications
    are largely the stuff of turn-of-the-twentieth-century world’s fairs. Ride the
    intercity ferry that runs on steam, only 10G a trip! See the marvelous battling-singing
    automaton! Knock him down and win a prize! Technology may be mischievous, but
    it’s not yet dangerous—unless a spring-loaded boxing-glove in the solar plexus
    knocks your `HP` to zero. The anxieties of `999 AD` have been forgotten with the
    celebratory Millennial Fair, commemorating 1000 years of unbroken monarchy. Despite
    a significant amount of armed personnel, `Guardia` lacks any noticeable military-industrial
    complex to support its boots on the ground. In fact, besides the `Truce-Porre`
    ferry, the only revolutionary technological advances are those contributed by
    our resident science geek `Lucca`.


    Well, most of them. The modern Chancellor of `Guardia`—probably the insectoid
    monster boss `Yakra XIII` in disguise—has the powerful `Dragon Tank` under his
    control. The three-part boss isn’t too tough a customer. Unlike other bosses,
    it doesn’t taunt the party with in-battle dialogue. It attacks, counterattacks,
    and heals, all according to its programming. “Machines aren’t capable of evil,”
    `Lucca` sighs as she fixes the broken-down `Robo`, “Humans make them that way.”
    If we believe `Lucca`, we have a big ontological problem with `Robo` being a willing
    helper of our party. Is `Lucca` reprogramming `Robo`, or merely resetting him
    to factory defaults? An inquiry into `Robo`’s autonomy prompts a larger question
    about `2300 AD`’s inhabitants.


    In the depths of the machine-automated `Geno Dome`, the supercomputer `Mother
    Brain` calculates the end of humanity and the rise of the machines. “Don’t you
    understand?” she questions the party over the `Dome`’s speakers. “This planet
    would be peaceful if there were no humans around.” Humans are an unwanted variable
    in her equation of existence, but a necessary factor in her genesis. Long before
    `Mother Brain` was an antagonistic presence to humans, was she the artificial
    intelligence that kept this `Dome` running? We know nothing about the history
    of the `Geno Dome`, and whether it was founded by humans or the monsters in `Medina`,
    who beseech their legendary god-king: “Oh, great `Magus`, why didn’t you simply
    exterminate the human race 400 years ago?”


    In all likelihood, it was not monsters but humans who created the technology that
    would outgrow them, threaten them, and eventually seek to eliminate them completely.
    In a world without `Asimov’s Laws of Robotics`, `Mother Brain` operates only on
    the flawed subroutines established by her programmers. Although her goals are
    antithetical to our party’s, `Mother Brain` is also a success story. She has built
    the closest thing the future has to a government. “We robots will create a new
    order,” she prophesies over the loudspeakers. “A nation of steel, and pure logic.
    A true paradise!”


    `1000 AD` is the closest any era in `Chrono Trigger` comes to paradisiacal. Monsters
    pose little menace to humankind—indeed, some even live in human towns. There are
    no interspecies wars, no genocidal dictators. People seem content in the `Kingdom
    of Guardia`.


    The `Guardia` castle is a dominating structure, the largest architectural element
    in the world. The town of `Truce` where we begin the story is surely under the
    authority of `Guardia` and recognizes it as sovereign. `Porre` to the south and
    `Choras` directly west of `Porre` also recognize the monarchy. The map design
    also aesthetically links the commonwealth with blue roofs. The independent city-state
    of `Medina` where most civilized monsters dwell is firmly a red state.


    The Guardian government seems to unite most of the globe, and probably has since
    at at least `600 AD` when maroon roofing was all the rage. In both eras, the government
    operates as a federal monarchy. Each town is governed by a mayor, who tends to
    live in the largest house. Whether these positions are hereditary or electoral
    is not clear, but it appears that mayoral privileges tend to stay within the family.
    When our party seeks the stolen `Sun Stone` in an endgame sidequest, the trick
    to taking it from the covetous mayor of `Porre` in `1000 AD` is to bribe an ancestor
    of his living in the mayor’s house in `600 AD` with a gift—hey, I wouldn’t turn
    down free jerky either. Returning back to `1000 AD`, we find the Porre mayor a
    changed man, now beloved by his family, having been inculcated with a generations-long
    valuing of charity. Meanwhile, in the monster-run `Medina`, `Ozzie VIII` relies
    on his ancestor’s fame to rule the town according to his whims. If the position
    of mayor is not inherited, then the voters of `Chrono Trigger` love a good dynasty.


    As one might expect from a game that employs time travel as a major plot device,
    dynasticism plays a large role in our story. Several other characters are conveniently
    roman-numeraled descendants of major players. `Toma XIII` and `Yakra XIII` continue
    their forebears’ legacies of treasurehunting and chancellor-impersonating, respectively.
    `Banta` the blacksmith in `600 AD` who yearns for an intelligent daughter is most
    likely the ancestor of the anagrammatic `Taban`, father of `Lucca`. Woodworking
    and alcoholism run in the family of the `Choras` carpenter. And of course, the
    bloodline of `Guardia` runs all the way from `65,000,000 BC` to `2300 AD`, from
    prehistoricouple `Ayla` and `Kino` to an old man in `2300 AD`. Of this unbroken
    line, however, we have clear record of only two actual monarchs—`Kings Guardia
    XXI` and `XXXIII`.


    As expected, both the 21st and 33rd rulers are male—and it seems their wives have
    married into the family. `Leene`, for whom `Marle` is mistaken, is not a direct
    member of the `Guardia` line. “The Queen married into the family 10 years ago,”
    gossips a young woman in `Guardia` palace in `600 AD`. And even though `Leene`
    has a seat in the throne room, a villager in `600 AD` tells us, “It’s the year
    600, and the 21st King of Guardia reigns.” As we learn from the example of `Queen
    Zeal`, in the world of `Chrono Trigger`, the monarchs seem to inherit the name
    of their kingdoms as their personal names upon enthronement. We can therefore
    guess that `Aliza`, mother of `Marle`, is also an intermarrier. But lacking any
    other rulers for comparison, it is unclear how rulership is passed through successive
    generations. We are then left to wonder who will inherit the throne after `Guardia
    XXXIII` dies or abdicates. `Marle`, who is really `Princess Nadia`, is a likely
    successor. At least until she marries `Crono`, which is not only the fairy-tale
    subtext of their romantic subplot, but also the ending suggested by the final
    FMV.


    So, who is the next leader of `Guardia`? Will it be `Queen Guardia XXXIV`, or
    perhaps `King Crono the Silent`? Neither `Chrono Trigger` nor its sequels provide
    the answer to this question of monarchical legacy. Although gender roles tend
    to skew patriarchal, the crown should rightfully fall to `Marle`.


    ### Trial of Chrono


    `Crono`’s trial is one of the most theatrical scenes in early Square history.
    The Dream Team, the three major producers of `Chrono Trigger`, wanted to craft
    a scenario that would echo the famous opera sequence from `Final Fantasy VI`,
    and `Crono`’s trial is indeed cinematic. Panning down into forced perspective
    of the courtroom, we are treated with a new piece of playful but tense theme music.
    The stained glass backdrop of the room depicts Justice not as a blind woman, but
    rather as an old man holding a balance adorned with flowers. And why shouldn’t
    justice be old and male? The jury who will decide `Crono`’s guilt or innocence
    in `Marle`’s kidnapping are all identical elderly men.

    '
