  raw: 'The party finds itself woefully underprepared for Lavos and is defeated miserably.
    Or maybe they’re not, and you unlock a surprise ending—but only if you cheat.
    No offense to the crafty Aladdins who have summoned that all-powerful Game Genie,
    but you’re supposed to lose at this point.


    This moment of failure coincides with Crono defying our player-made choices. Without
    any input from our controller, Crono steps forward to face Lavos alone. Lavos,
    enraged, blasts Crono with a beam of eldritch light. Crono’s body electrifies.
    As the screen fades to white, a dark, shimmering speck rises from his body. Is
    that—is that his soul?


    His body begins to disintegrate, the pixels sloughing off until nothing is left
    but this tiny hovering speck. It pulsates defiant blue, but then it too fades.


    Crono is dead.


    •


    Wait, what?


    Our Hero’s Journey ends quite abruptly with the death of the hero. In the middle
    of the game. And we don’t even need him to come back. This a huge upset, and literally
    a game-changer.


    Since we are no longer required to have Crono in our battle squad, we can learn
    previously unavailable triple techs—powerful three-person abilities that combine
    our characters’ individual skills. The event also opens up the road to the endgame
    itself. We can leave Crono suspended in nothingness and battle Lavos without him,
    and without figuring out what the title of the game even means.


    The comprehensive player in me eventually wanted to experience the ending without
    Crono, but the first time around I just had to save myself from destruction.


    From a practical standpoint, Crono is the powerhouse of the game, having participated
    in every battle and having gained all those hard-fought experience points. Characters
    not in our active party, by the way, are awarded 75% of the EXP earned in battle,
    but there are restrictions on how these points are applied to their leveling up.
    In short, the characters who battle the most are the strongest. Moreover, without
    Crono, two thirds of the game’s triple techs are inaccessible. He is not only
    the linchpin of our plot, but the battle system itself.


    Besides, I needed to see him come full circle. I needed the me-in-him to succeed.
    So what happens to Chrono Trigger’s Hero’s Journey when there’s no hero to journey
    anymore?


    Well, a new Journey starts, within the first. The player now guides a collective
    hero—the party without Crono—through a mini Journey to save the original hero.
    The Crono-less team accepts a Call to Adventure to save their erstwhile leader,
    getting mentorship from the gurus Gaspar and Belthasar on how to attempt this
    near-impossible resurrection.


    Interestingly enough, this feat might have been totally impossible, had story
    planner Masato Katō gotten his way. Katō had originally planned for Crono to die
    permanently. The party would have temporarily borrowed a version of Crono from
    the night before the Millennial Fair, but later returned him to face his inevitable
    death—perhaps that’s why he was already fully dressed at the start of our adventure?
    The idea was rejected in favor of a happier ending, one necessitating a new sidequest.


    Saving Crono is an interesting mission, full of parody, titular repetition, and—ugh,
    fine—a mini-game. Unless we spent a lot of time dicking around at the Millennial
    Fair, kicking robot butt and underage-gambling on foot races, we may have missed
    the chance at Norstein Bekkler’s Tent of Horrors to win non-feline items like
    Poyozo Dolls—Chrono Trigger’s answer to Furbies—or a life-size, functioning doppelgänger
    of Crono. This last prize raises some serious questions about the nature of Mr.
    Bekkler, but his ability to furnish the Crono Clone is crucial to reuniting our
    party with its leader. We’re going to need a body double for one of the most important
    switcheroos in RPG history.


    But there is a price for this doll. And it isn’t just silver points we can easily
    earn by ganging up on a singing robot, or by chugging “soda” until we puke. No,
    we have to play for it. In a timing-heavy match game, players have to compete
    against the Crono Clone, mimicking his actions—raise the left arm, the right arm,
    laugh, be surprised. We must accurately imitate the opponent, because if we press
    the wrong button we lose. As the mini-game progresses, it gets faster and faster.
    As I frantically mirrored the clone’s actions, I found myself reacting to his
    facial cues, smiling when he laughed, widening my eyes each time he acted surprised.


    The skillful player will get this mini-game on the first try. Then there are failures
    like me. In my most recent replay, I threw the controller at the screen and called
    the opponent a goddamn fuckwhore before I reset the game and tried again. If we
    had already earned the Crono Clone earlier in the game with Crono at the head
    of the party, we would have had the interesting experience of imitating the imitation
    of the PC who is our stand-in. Wow, meta.


    Along with the clone, our party also needs the eponymous Chrono Trigger, which
    Gaspar describes thusly: “It is pure potential. By unleashing a specific course
    of events, it can have a powerful effect on time.” Belthasar adds an additional
    qualification to the Trigger’s ability to restore life—the person who died “must
    be important to the space-time continuum.”


    With both the clone and the Chrono Trigger in tow, our party must climb Death
    Peak, a previously inaccessible and dangerous location complete with several minibosses.
    These enemies, though, are not the party’s ultimate ordeal—activating the Chrono
    Trigger is. There is a chance it could fail if Crono isn’t as important to the
    universe as our party believes. It would be a huge disappointment to find that
    the Trigger doesn’t fire when pulled. Crono has to be important, right?


    Depending on who is in our party, we can witness a variety of emotional pleas
    to the universe to bring Crono back. Their supplications must work, because we
    are brought to that slice of space-time where Crono hangs in the clutches of Lavos’s
    sinister light. Exchanging his body with the Crono Clone, our heroes pull Crono
    back into the world of the living.


    Crono, resurrected, can continue his original Hero’s Journey along with the party.
    What we thought was the final battle against Lavos was really just another compound
    step along Crono’s Hero’s Journey—a Descent into the Abyss followed by a Resurrection
    from the Dead. Crono and his party can resolve sidequests and obtain powerful
    weapons until they are prepared for the real Ultimate Ordeal of Lavos. If they
    succeed, they can return heroic through the Threshold of Danger to their ordinary
    world.


    •


    As the Journey has been an oft-used tool in storytelling and screenwriting, it
    has been linked with the classical Aristotelian three-act structure of drama:
    a setup, a story arc filled with character development and increasing action,
    and a final act of climax and resolution. Our battle with Lavos should be the
    best marker for the climax—it’s the battle we’re supposed to win. But we don’t,
    and we are left with a dead Crono and a broken party. And the story itself breaks
    apart. It can become a swift retaliation against Lavos for murdering Crono, or
    it can be a meandering journey of ignoring our dead friend while clearing unconnected
    sidequests. Obviously Aristotle didn’t see this one coming.'
