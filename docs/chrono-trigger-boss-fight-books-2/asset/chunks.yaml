  raw: 'Many of our contemporaries crave strategy guides for their lives. I see commuters
    on the subway reading well-highlighted Christian devotionals. And when their pages
    are completely soaked through with yellow, new books will replace them. On the
    secular side, The Seven Habits of Highly Effective People has been superseded
    by The 8th Habit: From Effectiveness to Greatness. And souls of every race, creed,
    color, occupation, and age group can rest assured that if they don’t have the
    book version of a bowl of chicken soup, one will be out of the kitchen soon enough
    to soothe them.


    We can find help for our problems in books, but we cannot become slaves to their
    words. We need to live our lives, not imagine how they could be if only we had
    the The Power of Positive Thinking, or some hidden ancient Secret to making our
    dreams come true. We need to do something.


    We only have so many years to live, and there just isn’t enough time.


    # The End of Time


    Even though I’ve been writing about a game whose raison d’être is time travel,
    it’s taken me a long time to get around to discussing it.


    Chrono Trigger was certainly not the first video game to employ time travel. It
    wasn’t even the first Square RPG to do so by far. The first Final Fantasy features
    a red-haired fighter and friends eventually unsealing a magical “time gate” to
    defeat a nefarious villain lurking in the past, and Final Fantasy Legend III explores
    the power of time-machine-powered travel to prevent disaster in past, present,
    and future eras. Chrono Trigger ups the ante by using time travel to flirt with
    genres as disparate as prehistoric fiction, medieval fantasy, and post-apocalyptic
    sci-fi. Chrono Trigger’s immediate Square predecessor, Live A Live, presages such
    genre-bending by featuring not only a caveman hero and a futuristic robot, but
    also other representatives of genre fiction: a knight, a ninja, and a cowboy.
    The game even has a villain called Maō, which some of you might recognize as the
    Japanese name for Magus.


    Chrono Trigger combines the successes of both Final Fantasy Legend III and Live
    A Live, making time travel both integral to the story and historically comprehensive.
    Time travel seems so deeply enmeshed in the plot that it’s difficult to imagine
    the game without it. Blasphemous as it may sound, however, I believe that Chrono
    Trigger doesn’t actually need time travel to be a successful game.


    •


    Hey.


    I’m glad you picked this book back up after hurtling it across the room. Or maybe
    you just restarted your tablet after an indignant shutdown. What the fuck is this
    guy saying, that Chrono Trigger doesn’t need time travel? The word “chrono” is
    in the title! Bear with me as I rephrase just slightly the plot summary I provided
    many chapters ago.


    Crono, a teenage boy from a small town, his techno-savvy gal pal Lucca, and princess-in-disguise
    Marle end up opening a hole in the universe—a gate. Discovering the link between
    their own world and others, the trio travels through different worlds assembling
    a party of allies: the knight-errant-turned-frog, Frog; stalwart robot Robo; rough-and-tumble
    cavewoman Ayla; and finally Magus, a dark sorcerer with mysterious allegiances.
    Learning that their worlds—that all life itself!—will be destroyed by Lavos, a
    sinister force from beyond, the septet travel onward, gathering clues and materials,
    meeting supporters, and battling foes to prepare themselves for that final, decisive
    battle for the future.


    There’s no need for time travel to make this story happen. But, what about the
    disappearance of Queen Leene erasing Marle out of existence, for instance? Surely
    that plot point couldn’t work here! I think it could. Let’s imagine a multiverse
    a little like that of The Legend of Zelda: A Link to the Past. In this Zelda title—and
    many of its successors—two parallel worlds coexist. The Light World and the Dark
    World bear many similarities to each other in structure, and many locations have
    corresponding alternate versions in each universe. As Link, we warp between the
    worlds, solving puzzles that exploit the dichotomous nature of reality. Would
    it be preposterous to suggest that characters across universes could be affected
    by events in a world parallel—or even quasi-perpendicular—to their own? Of course
    that game just wouldn’t be Chrono Trigger.


    •


    Time travel in Chrono Trigger is a messy affair. Lucca introduces us to its mechanics
    in 600 AD, shortly after Marle winks out of existence to “somewhere cold, dark…
    and lonely.”


    Delighted with her unintentional impersonation of Queen Leene, Marle gladly enjoys
    the comforts of a royal lifestyle where she is no longer treated as a ward of
    the king, but a queen in her own right. Let’s ignore the creepy realization that
    at some point King Guardia XXI might try to have sex with his teenaged distant
    descendant. Meanwhile, the search for the real Leene is called off, since Marle
    is a dead ringer for her. Leene—along with the 600 AD Chancellor—never gets rescued,
    and is killed by Yakra and his minions. Maybe they ritually sacrifice her to the
    idol of Magus deep within the cathedral. Maybe they do much worse to her. She’s
    a lot prettier than a naga-ette, after all. But to save Marle from this variation
    of the Grandfather Paradox, we must preserve Leene’s place in the timestream.
    Sounds easy, right?


    Not really.


    If we do not rescue Leene, then Marle ceases to exist. If Marle had never been
    born, Crono would not have met her at the Millennial Fair, and Lucca’s teleporter
    wouldn’t have malfunctioned and created a time gate. But perhaps in this alternate
    timeline, there is no Guardia anymore. In 600 AD, the Mystics led by general Ozzie
    take advantage of the confusion following Leene’s death, and push through the
    lines of defense at Zenan Bridge. Without Crono and company to battle them, Ozzie’s
    undead minions easily conquer the Knight Captain and his unmagical troops. The
    monster army storms Guardia. Banta and his young wife are slain—there will be
    no Taban, and thus no Lucca. There will be no Millennial Fair to celebrate a thousand
    unbroken years of monarchy, and no teleporter sideshow. No Crono to travel back
    in time. And of course, no Marle to have given him reason to in the first place.


    But, wait.


    Leene only dies because Marle’s appearance causes the palace to call off the search.
    So in order for Leene to die, Marle must exist. But when Leene dies, her descendant
    Marle can’t exist. If you’ll allow the admixture, we’re trapped in a sort of Schrödinger’s
    catch-22 here, where both Marle and Leene must be both alive and dead to make
    this scenario work.


    The events of this first exposition of time rules reveal another curious fact.
    Namely, Marle vanishes from the timeline before Leene is even killed. We have
    to save the living Queen Leene to recall the sort of dead Marle from the darkness
    beyond time. We do not recover a dead Leene and revive her, which, by the way,
    is a technology humans have always had. At 200G a pop, resurrection sells for
    fairly cheap. Since the royal family could easily spare this pittance, we must
    assume the morbid premise that Leene’s body will never be found if she is killed.


    The introduction to Secret of Mana tells us that “time flows like a river.” Damming
    a river downstream won’t cause water upstream to vanish. The current will weaken,
    the water will ebb, and the river will dry up. So, does time struggle upstream
    to keep up with changes closer to its source? This temporal quirk sounds like
    it might help explain the apparent subparadox of having Leene alive while Marle
    has vanished, but in fact it proves the opposite. If Marle had continued to play
    queen in 600 AD, Leene would have been killed, her remains left in an unmarked
    grave. Marle would have acted the part of Leene for a while longer, as time caught
    up with itself before finally disintegrating Marle from the timeline.'
