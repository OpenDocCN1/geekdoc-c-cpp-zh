- fmt: '

    Tom Slattery’s work for Square largely comprised new English translations of Final
    Fantasy games, including `FF6`—already translated once by Woolsey—and a 3D remake
    of `FF4`. Clearly aware of the fans’ desire for something spoony in that game,
    Slattery retained that famous line, and even joked about it in his meta appearance
    in the in-game `Developer’s Office`. Slattery’s approach to retranslating games
    has been one filled with a desire to preserve the legacy established by previous
    editions, while eliminating unintentional mistakes and compensating for the technological
    problems posed by earlier versions. Woolsey, for example, was limited by character
    space, and thus names and items that would have fit comfortably in phonetically
    compact Japanese katakana needed truncation in English. This same limitation did
    not apply to Slattery, who was able to use lengthy terms like “Athenian water”
    over the shortened “revive.” Slattery was also free of the draconian censorship
    under which the first North American release of `Chrono Trigger` chafed.


    Slattery graciously answered some questions I had about his work on `Chrono Trigger`,
    shining some light on how Square and its localizations have changed since the
    SNES days.


    ### Michael P. Williams: What was it like to retranslate games you grew up with,
    specifically Woolsey-translated games?


    **Tom Slattery**: On the one hand, having the opportunity to update so many of
    these games that defined my childhood for a new generation was a dream come true.
    On the other hand, knowing that fans would compare each and every word to the
    original—that there would be some people upset by any line that changed, and others
    upset by any that didn’t—made it quite a daunting task. I did my best to strike
    a balance between preserving nostalgia and providing the best experience possible
    for new players, but there are of course people who felt the retranslations went
    too far in one direction or the other.


    It was definitely interesting reading and working in the same files Woolsey had
    translated years before, though. Seeing what he had to deal with—and without the
    benefit of `Google`, `Wikipedia`, and dedicated fan sites that analyze every minute
    detail of the games like I had—certainly gives you a renewed appreciation for
    what he was able to accomplish in such a short time. There are conversations that
    are completely scrambled in the files, messages that get reused without warning,
    messages that don’t show up at all, and of course no comments whatsoever to provide
    a translator with clues to any of those things.


    ### MPW: Woolsey has been criticized for his translation decisions, but ultimately
    these translations became the standard text of the games in North America, and
    deviations from them might ruin the nostalgia factor. Which “Woolseyisms” did
    you want to retain for `Chrono Trigger`, and what elements did you want to bring
    closer to the Japanese original?


    **TS**: Many of the other ports and remakes I worked on received fully new translations,
    but with `Chrono Trigger` it was more along the lines of an update and polishing
    pass. It’s probably easier to talk about the things I wanted to change than the
    ones I wanted to preserve.


    My main goals were to undo the damage done by the character limits of the original
    version and to eliminate the inconsistencies that weakened the game’s settings
    and characterizations. I expanded the enemy, item, and ability names that had
    clearly been compressed or altered to fit within the artificial length restrictions
    of the `SNES` release, but I retained virtually all of the character names. With
    dialogue, I worked from the existing text and mostly tried to tighten up what
    Ted had done. I loved the caveman speak of Ayla and friends, for example, but
    it drifted around quite a bit. Sometimes they used articles and plurals, and sometimes
    they didn’t. Sometimes their subjects and verbs agreed, and other times they didn’t.
    I loved that Frog didn’t sound like the characters from present day, but it made
    no sense that he was the only character in his time period with an anachronistic
    style of speech, and the grammar wasn’t consistent or even always used correctly.


    As with `Final Fantasy VI`, I tried to preserve the most nostalgic lines—except
    where they did things inappropriate to the setting, like referencing U.S. currency—and
    inject new humor where I could. At least from my perspective, though, `Chrono
    Trigger` didn’t really have as many memorable one-liners as `Final Fantasy VI`.
    Even being a fan of both games, I did a lot of digging when working on them to
    see which aspects of the localization other players were attached to, and while
    `Final Fantasy VI` was a very quotable game, it seemed that for most people `Chrono
    Trigger`’s charm came more from the overall story and character interactions than
    from individual lines. Because of that, I was fairly liberal with changes to dialogue.
    If I thought something was an improvement, I generally went with it.


    ### MPW: Did you add any “Slatteryisms” to the game?


    **TS**: Here and there, for sure. I turned the “soup” in prehistory into “skull-smash”
    (because “next day, skull feel like smash!”), for example, and turned a line where
    a child doesn’t understand a Japanese phrase meaning “generous” or “charitable”
    into one where she misunderstands the word “magnanimous,” thinking that people
    are calling her father chubby.


    Of course, I introduced a couple of unintentional Slatteryisms as well.


    Firstly, as many have noticed, I made `Azala` female with a single instance of
    a feminine pronoun. `Azala` was Ayla’s nemesis, the name sounded completely feminine,
    and the sprite looked like it was wearing a flowing pink robe. My brain had so
    unquestioningly taken the character to be the reptite queen from the start that
    it had never even occurred to me she—I mean, it—might not be female. No one called
    out my assumption, and it wasn’t until after the game had mastered up that I noticed
    there was no direct reference to the gender of any reptite in the game. They may
    have been intended to be genderless, or gender may simply not have been seen as
    an important detail considering they’re not human, but the Japanese version always
    avoids specifying. I actually just did a bit of searching to see whether Japanese
    players had interpreted the character as male or female, and saw that the Japanese
    `Wikipedia` article currently states the character is “believed to be female because
    the English DS version refers to `Azala` as ‘she.’” So I guess I’ve successfully
    confused Japan too.


    Secondly, I translated the area that should have been the Darkness Beyond Time
    as “Time’s Eclipse” in the new ending. No one had mentioned that the term was
    a `Chrono Cross` reference, so without a `Chrono Cross` glossary for reference
    and being unfamiliar with the Japanese version of the name—I’d played `Chrono
    Cross` in English—I had no reason to guess it wasn’t a newly coined location name
    like all the others. Kind of a bummer that the reference was lost, though, since
    that sequence was meant to tie the two games together.


    ### MPW: How did you approach translating new dialogue that was not in the original,
    like the new ending and the new sidequests?


    **TS**: Translating the new text was honestly the easiest part of the project.
    It was the only place where I didn’t have legacy to contend with; it was just
    a matter of matching the style and characterizations from the rest of the game.
    Of course, the added portions were also the last things to make it into the game,
    and content was changing up until the final day of quality assurance, so there
    were certainly translation challenges in that regard.


    ### MPW: Did you face other technical challenges, time limitations, or censorship
    issues in retranslating for North American Nintendo customers?

    '
