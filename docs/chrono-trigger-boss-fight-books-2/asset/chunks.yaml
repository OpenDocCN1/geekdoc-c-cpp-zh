    Well designed role-playing games are replete with missions to be ignored or embraced.
    Before his date with destiny and a mysterious girl at the fair—conveniently located
    right by his home—`Crono` can see the world around him. He can explore the nearby
    forest and tussle with low-level monsters. He can actually leave his country,
    traveling from his hometown of `Truce` to `Porre`, a town on the southern continent,
    to go carousing in a café. There is no sense of story urging him onward, no clear
    path to the next objective.


    Even when this foray into tourism is done, there’s ample time to play. The fair
    itself is loaded with mini-games. The most casual of players could dedicate hours
    to grinding with Gato, the karaoke fightbot, earning cash to spend at the creepy
    sideshow tent, where a wager of 80 coins can get `Crono’s` probably already struggling
    little family another cat. And then cat food. Then more cat food. Which makes
    more cats, of course. In fact, you could doom `Crono’s` mother to be a pet hoarder
    by proxy long before you ever discover that `Chrono Trigger` involves time travel.
    Before you finally step through that time gate and leave `Crono’s` mom alone with
    the seven cats you just had to have.


    After completing `Chrono Trigger` in 1995, I wanted to keep adventuring through
    new worlds like it. But `Chrono Trigger` ended up becoming `Square’s` last hurrah
    of high fantasy in North America in the 16-bit era. `Secret of Evermore`, released
    a few months after `Chrono Trigger`, was not the kind of turn-based RPG I was
    waiting for. It even failed as a follow-up to 1993’s action RPG `Secret of Mana`,
    to which it was a spiritual sequel. And March 1996’s `Super Mario RPG`, while
    cute and innovative, was far from the fantasy that I craved. `Square’s` Super
    Nintendo golden age was at its end.


    `Final Fantasy VII` changed everything. Gone were the fat clunky cartridges I
    had to spank and blow in to make cooperate. `FF7` spanned three PlayStation discs.
    `Square` had taken a leap into the future, and so had the series. The industrial
    revolution in `Final Fantasy VI` had given rise to a science fiction adventure
    in `FF7`. Sure, there were magic and chocobos, but now they competed with gun-arms
    and helicopters. The familiar little character sprites were here too, but their
    bodies bulged with excess polygons.


    As I trudged through the uncanny valley of `Final Fantasy VIII`—released in my
    final year of high school—I felt the effects of `Square’s` spell on me starting
    to dissipate. Maybe it was a fluke. Maybe `Square` just dropped the ball with
    this hyper-realistic, over-pretty game. By the time I got to `Final Fantasy IX`,
    released during my first semester of college, the magic was gone. I felt ready
    to move on. In college I had little time for RPGs. Those hours of cola-fueled
    role-playing had been replaced by occasional spurts of `Super Smash Bros.` while
    binge drinking with friends. Perhaps I had outgrown `Square`—I was an adult after
    all, and video games are children’s toys, right?


    After graduating college, I found myself teaching English halfway across the world
    in that mecca of video games, Japan. I ended up in a budget, backwater Tokyo—`Fukushima
    City`. `Fukushima` was years away from rising to prominence in the news, and before
    I took the job there, the only information I’d had on `Fukushima` was some tourism
    websites, a `Wikipedia` entry, and a rough estimate of its proximity to Tokyo.
    I had imagined the stereotypically frenetic metropolitan Japan that Westerners
    tend to think of—streets ablaze in neon, with garish cartoon mascots adorning
    every other building. `Fukushima` was decidedly not that.


    Still, I grew comfortable there, made friends, fell in love a few times, and somehow
    managed to work far less than my fellow alumni stuck eternally in the past. Well,
    twelve hours behind me, at least. Post-college life was supposed to be my first
    taste of “the real world,” but Japan was far from “real” for me. It was an extended
    vacation, a chance to satisfy my 21-year-old wanderlust. For many of my foreign
    colleagues, Japan was even more of a fantasy realm—they jumped into anime, manga,
    cosplay. They gamed.


    I had a lot of free time, and as the weather grew colder, I found myself indoors
    more often than not. I read every English book that my small group of friends
    collectively owned, watched every VHS tape of `The X-Files` that had been inexplicably
    left in my apartment by a previous tenant. I was getting bored. I noticed, though,
    that the `Game Boy Advance` I had brought to Japan was gathering dust in the closet.
    Maybe I’d buy a Japanese game and use it to improve my language skills. I could
    make this children’s toy educational. Adult.


    I picked up something familiar but altogether alien—the Japanese `Game Boy Advance`
    cartridge of `Mother 1+2` (perhaps better known to us North Americans as `EarthBound
    Zero+EarthBound`). As I walked through the now Japanese streets of `Onett`, it
    all came to me in a flash—this is what I had been missing! `Square` and I had
    gone our separate ways. They had transformed RPG characters from little collectible
    figurines into complex intractable mannequins. I wanted more of what used to be.
    But new.


    And now, back in the United States, playing through `Chrono Trigger` again, I
    was afraid. Afraid that playing the game some eighteen years later would ruin
    the magic. I approached with caution, reaching my hand down gingerly into that
    abyss of murky memory, wondering if the old abracadabra still had any kick. I
    can assure you, reader, that there’s still plenty of rabbit left in that old hat.


    If you’re reading this book, then you probably still know the magic. Maybe your
    memories, like mine had, are enveloped by the mists of nostalgia and getting older.
    There are far more skilled summarists than me, so rather than reproduce the herculean
    labors already completed by gate compilers, let’s take a moment to go over the
    basics.


    `Crono`, a teenage boy from a small town, his techno-savvy gal `Lucca`, and princess-in-disguise
    `Marle` end up opening a hole in space-time—a gate. Discovering the link between
    their own era and others, the trio travels through different times assembling
    a party of allies: the knight-errant-turned-frog, `Frog`; stalwart robot `Robo`;
    rough-and-t cavewoman `Ayla`; and finally `Magus`, a dark sorcerer with mysterious
    allegiances. Learning that their planet—that life itself!—will be destroyed by
    `Lavos`, a sinister force from beyond, the septet travels onward, gathering clues
    and materials, meeting supporters, and defeating foes to prepare themselves for
    that final, decisive battle for the future.


    The vessel we operate through the majority of `Chrono Trigger` is a spiky redheaded
    teenager.

    '
  raw: 'Well designed role-playing games are replete with missions to be ignored or
    embraced. Before his date with destiny and a mysterious girl at the fair—conveniently
    located right by his home—Crono can see the world around him. He can explore the
    nearby forest and tussle with low-level monsters. He can actually leave his country,
    traveling from his hometown of Truce to Porre, a town on the southern continent,
    to go carousing in a café. There is no sense of story urging him onward, no clear
    path to the next objective.


    Even when this foray into tourism is done, there’s ample time to play. The fair
    itself is loaded with mini-games. The most casual of players could dedicate hours
    to grinding with Gato, the karaoke fightbot, earning cash to spend at the creepy
    sideshow tent, where a wager of 80 coins can get Crono’s probably already struggling
    little family another cat. And then cat food. Then more cat food. Which makes
    more cats, of course. In fact, you could doom Crono’s mother to be a pet hoarder
    by proxy long before you ever discover that Chrono Trigger involves time travel.
    Before you finally step through that time gate and leave Crono’s mom alone with
    the seven cats you just had to have.


    •


