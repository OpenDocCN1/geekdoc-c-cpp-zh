- fmt: '

    To consider the human character designs from `Chrono Trigger`, then, involves
    a complex interplay between the fantasy genre’s reliance on Euro- and Anglocentric
    characters as “default humans” and the realities of the game’s art design and
    developmental influences. But a jaunt through Guardia’s Millennial Fair still
    invites the question—Why is everyone light-skinned?


    ## II. Daily Life and the Smoking Room


    Watari Junior High is a short bike ride from my more-than-accommodating apartment,
    though even with a bellyful of heated onigiri from the nearby convenience store,
    I’m dragging ass. Arriving at school undercaffeinated, I find both refillable
    `Zōjirushi` urns in the teacher’s room spurting out the last dregs of hot water,
    making my daily instant coffee sludge more of a thick paste.


    I lug the two big urns over to the kitchenette, where the comically oversized
    kettle has just begun to whistle. The very capable head of the English program—a
    nervous, tittering, but generally affable man—sidles up to me, informing me with
    some embarrassment that I don’t need to do this. He calls over to a younger female
    teacher, who enthusiastically takes the kettle from me and refills the urns. I
    thankpologize to her—I’ve been confusing thank you and I’m sorry now that I speak
    Japanese for more than half of the day—and I offer to make some tea for her with
    the freshly boiled water. The English teacher praises my “largesse”—he’s got an
    impressive, if sometimes stilted, vocabulary—but reminds me that these domestic
    matters are usually handled by the female staff.


    I usually bring my coffee into a small room accessible from the far corner of
    the teacher’s office, a hidden oasis of soft couches and carcinogens. This is
    the `kitsuenshitsu`—the smoking room—and it is totally acceptable in a country
    where cigarettes are sold in prominent public vending machines. Women rarely venture
    in here. I practice my Japanese with the male teachers through a cloud of burnt
    tobacco slurry and do some serious backroom cultural exchanges. Topics I would
    never dream to discuss with my junior high students—drugs, sex customs, average
    American penis size—are free of taboo in this smoky boy’s club.


    Once in a while, the artsy-cool music teacher surprises the usual chimneystacks
    and saunters in with her ultralong slim menthols. The men all bow, apologize,
    and offer her her seats. It is a comically polite game of musical chairs and misdirected
    chivalry. I find myself wanting to follow their lead—to be culturally appropriate.
    At the same time, I feel a conflicting desire to raise high the flag of American
    egalitarianism and treat this woman the same way I’d treat any of the male staff.
    I half-stand and give her a polite nod-bow as she fills a newly vacated seat.


    ## Gender Dynamics in the Cast


    The main cast of `Chrono Trigger` is not exactly a boy’s club. Three of the seven
    `PCs` are male. This is a definite improvement over `Final Fantasy VI`, whose
    ensemble cast of fourteen `PCs` featured only three discernable females.[4](#6.xhtml_footnote-007)
    Most early Square RPGs are similarly skewed. And no matter the gender ratios,
    in all games that have clear protagonists they are always males. The three female
    heroes of `Chrono Trigger`, though, are a strong bunch—Ayla is in fact cartoonishly
    strong, a barefisted fighter in a world of weapons—but that doesn’t leave them
    free of gender stereotypes.


    ### Marle: The Princess


    Marle is a princess who doesn’t need saving—well, except for that one time when
    she does. Her debut in the game is also quickly accompanied by the introduction
    of a love story that both heteronormalizes `Crono` and makes Marle seem like an
    emotional mess, since we never get to experience the silent `Crono` returning
    her affections. This one-sidedness only intensifies as the game progresses. Touching
    moments—Marle thanking `Crono` after being rescued from oblivion in `600 AD`,
    or that tear-jerking scene on Death Peak—are made weirdly unbalanced by `Crono`’s
    insistent unresponsiveness. Marle’s genuine emotion starts looking like hysterics.


    She also falls victim to Square’s tendency to make curative “white mage” characters
    female. While Marle is not a white mage per se—if anything, she is a “water mage”—she
    performs the function of healer well, having the best defensive and support magic
    in the game, including the most powerful resurrection spell, `Life 2`. Although
    Marle’s offensive spells are on par with other characters’, her preferred physical
    attack method is not a melee weapon. Her crossbow works as a bludgeon when she
    is close to an enemy, but she tends to fire from a distance. Either way, her physical
    attacks are among the weakest in the game.


    These stock genderings notwithstanding, Marle is the game’s most headstrong character.
    She is the only one who willingly rebels against society’s high expectations for
    her, and decides to forge her own path. In doing so, she stands up to the highest
    authority in the land, the patriarchal monarchy led by her father `King Guardia
    XXXIII`. “All I asked was for you to behave like a princess,” he reprimands her
    at `Crono’s trial`, completely oblivious to her feelings for the accused hero.
    If being a princess means suppressing her true self, Marle wants no part of it.


    ### Lucca: The Catalyst


    Lucca, Marle’s co-anima to `Crono`, is another ranged weapon user, and her gun
    is even weaker than Marle’s crossbow. Lucca is also a frequent `dea ex machina`
    early in the game. Unlike Marle, who propels the early plot onward passively—first
    by disappearing into time, then by vanishing from it completely—Lucca catalyzes
    events. It is her `telepod` that begins the adventure into the past, and her `Gate
    Key` that allows `Crono` and `Marle` to return safely to `1000 AD`. Later, she
    will save `Crono` again when he breaks out of prison. Without Lucca we can’t repair
    and recruit `Robo`, whom we need to open up the End of Time. All of these accomplishments
    are due to Lucca’s keen scientific mind.


    The field of science, however, has traditionally been dominated by men, especially
    at the highest levels. In Japan in particular, women in science have been viewed
    as unattractive. Unwomanly. Lucca does indeed match a stereotype described by
    journalist Miki Tanikawa—the science girl “whose hair is disheveled and who does
    not care about beauty.” With her frumpy, baggy clothing, asymmetric cap, and Coke
    bottle glasses that “she could probably see the back side of the moon with,”[5](#6.xhtml_footnote-006)
    Lucca is far from the windswept beauty Marle is. Her only in-game romance is her
    machine-worship of automaton Robo. Later, as the final FMV shows, Lucca has built
    her own miniature version of `Robo` after the original has returned to the future
    to reunite with `Atropos XR`. The construction of `Robo Jr.` demonstrates Lucca’s
    quick scientific progress—the observant player will remember that Lucca had first
    concluded that “two-legged, walking humanoid robots are virtually impossible to
    create.” It seems karaoke addict Gato was a failure on many levels.


    ## Epilogue


    The FMV continues to unfold this epilogue for Lucca. As the surrogate Robo—more
    a child than a Weird Science-style lover—totters behind her on a stroll through
    the woods, Lucca spies a shimmering object. It is a pendant, Schala’s pendant
    in fact—perhaps also Marle’s? Whatever the custodial history of this key item,
    Lucca now finds it attached to a baby. If we have the wherewithal to play through
    `Chrono Cross`—I didn’t—we will learn that not only does this baby become `Kid`,
    a major player in the sequel, but will also be Lucca’s first surrogate child and
    the impetus for her to create an orphanage.

    '
