  trans: '


    我们在《时空之子》（Chrono Trigger）的`1000 AD`——现在的加迪亚——开启了故事。这个时代非常质朴，充满怀旧感。科技并非未知，但其应用很大程度上是二十世纪初世界博览会的产物。乘坐蒸汽驱动的城际渡轮，每程仅需
    10G 卢比！看看那奇妙的战斗歌唱机器人！击倒它就能赢得奖品！技术可能是顽皮的，但尚未变得危险——除非太阳穴处一个弹出的弹簧拳套让你的 `HP` 归零。`999
    AD` 的焦虑已随着庆祝千年的博览会被遗忘，这场博览会是为了纪念 1000 年未中断的君主制。尽管有大量的武装人员，`加迪亚` 缺乏任何明显的军工复合体来支持其地面部队。事实上，除了`休战-波雷`Truce-Porre）渡轮外，唯一的革命性技术进展来自于我们当地的科学宅`露卡`(Lucca）。


    好吧，大部分都是。加迪亚的现代总宰——很可能是伪装的虫类怪物首领`雅库拉十三世`(Yakra XIII)——控制着强大的`龙坦克`(Dragon Tank)。这个分三部分的
    BOSS 并不是太难对的对象。与其他 BOSS 不同，它不会通过战斗对话对小队进行挑衅。它攻击、反击和治疗，完全按照它的程序设定进行。“机器不会作恶，”`露卡`在修理损坏的`机器人`(Robo)
    时叹息道，“是人类把它们变成那样的。”如果我们相信`露卡`，那么关于`机器人`作为小队自愿帮助者就存在一个巨大的本体论问题。是`露卡`在重新编写`机器人`，还是仅仅将他重置为出厂设置？对`机器人`自主性的探究引发了关于`2300
    AD` 居民的更大问题。


    在机器自动化的基因圆顶（Geno Dome）深处，超级计算机`母脑`(Mother Brain) 正在计算人类的终结和机器的崛起。“你不明白吗？”她通过圆顶的扬声器向小队质疑，“如果周围没有人类，这个星球将会和平。”人类是她存在方程中一个不受欢迎的变量，却是她诞生过程中的必要因素。在`母脑`成为人类的敌对力量之前，她是否就是维持这个基因圆顶运行的人工智能？我们对基因圆顶的历史一无所知，也不知道它是由人类建立的，还是由梅迪纳（Medina）的怪物建立的——那些怪物向他们的传奇神王恳求：“噢，伟大的`法皇`(Magus)，你为什么不在
    400 年前直接消灭人类呢？”


    极有可能，创造出将超越他们、威胁他们并最终寻求彻底消除他们的技术的不是怪物，而是人类。在一个没有`阿西莫夫机器人定律`的世界里，`母脑`仅根据其程序员建立的缺陷子程序运行。尽管她的目标与我们小队背道而驰，但`母脑`也是一个成功案例。她建立了未来最接近政府的东西。“我们机器人将创造一个新秩序，”她在扬声器中预言道，“一个钢铁的国家，一个纯粹逻辑的国家。一个真正的天堂！”


    `1000 AD` 是《时空之子》中任何时代中最接近天堂的时期。怪物对人类的威胁很小——事实上，有些甚至住在人类城镇里。这里没有种族战争，没有种族灭绝独裁者。人们在`加迪亚王国`似乎很满足。


    加迪亚城堡是一座统治性的建筑，是世界上最大的建筑元素。我们故事开始的休战镇（Truce）无疑位于加迪亚的管辖下，并承认其主权。南边的波雷（Porre）和波雷正西方的科罗拉斯（Choras）也承认该君主制。地图设计在美学上也将联邦体与蓝色屋顶联系在一起。绝大多数文明怪物居住的独立城国家梅迪纳（Medina）则是一个坚定的红色国家。


    守护政府似乎统一了全球大部分地区，可能至少从`600 AD` 棕色屋顶盛行起就是如此了。在这两个时代，政府都以联邦君主制运作。每个城镇由一个镇长管理，他们通常住在最大的房子里。这些职位是世袭还是选举产生的尚不清楚，但镇长特权倾向于留在家族内部。当我们的小队在终局支线任务中寻找被偷的`太阳石`(Sun
    Stone）时，从`1000 AD` 贪婪的波雷镇长手中夺回它的诀窍是用礼物贿赂他住在`600 AD` 镇长房子里的祖先——嘿，我也不会拒绝免费的肉干的。回到`1000
    AD`，我们发现波雷镇长变成了一个人，他现在深受家人喜爱，并被灌输了世代的慈善价值观。与此同时，在怪物统治的梅迪纳，`奥兹八世`(Ozzie VIII) 依靠其祖先的名声根据自己的喜好治理城镇。如果镇长职位不是继承的，那么《时空之子》的选民们很喜欢王朝。


    正如对一个将时间旅行作为主要剧情手段的游戏所预期的那样，王朝主义在我们的故事中占了很大比例。其他几个角色方便地是主要人物的罗马数字编号后代。`托马十三世`(Toma
    XIII)和`雅库拉十三世`(Yakra XIII) 分别延续了祖先寻找宝藏和冒充总宰的遗产。`600 AD` 渴望聪明女儿的铁匠班塔`(Banta)最有可能是字母异位词`塔班`(Taban)的祖先，后者是`露卡`的父亲。木工活和酗酒在科罗拉斯木匠家族中流传。当然，加迪亚的血脉从`公元前
    65,000,000 年`一直到`2300 AD`，从史前时代的`艾拉`(Ayla)和`基诺`(Kino)到`2300 AD`的一个老头。然而，在这条未中断的血脉中，我们只有两个真正君主的清晰记录——`加迪亚二十一世`(Kings
    Guardia XXI)和`三十三世`。


    正如预期的那样，第 21 位和第 33 位统治者都是男性——而且他们的妻子似乎嫁入了家族。`玛尔`(Marle)误认的`莉琳`(Leene)并不是加迪亚血脉的直接成员。“皇后
    10 年前嫁入家族的，”`600 AD` 加迪亚宫的一位年轻女性八卦道。“尽管`莉琳`在王座厅有一席之地，`600 AD` 的一个村民告诉我们：“现在是 600
    年，加迪亚第 21 位国王正在执政。”正如我们从`赞尔女王`(Queen Zeal)的例子中学到的，在《时空之子》的世界里，君主们在登基时似乎会将王国的名字作为自己的名字。因此，我们可以推测`玛尔`的母亲`爱莉莎`(Aliza)也是联姻者。但缺乏其他统治者进行比较，尚不清楚权力是如何代代相的。我们不禁好奇，在加迪亚三十三世去世或退位后谁将继承王位。真正的`纳迪亚公主`(Princess
    Nadia)`玛尔`是一个可能的继承者。至少在她嫁给`克罗`(Crono)之前是不仅是他们浪漫支线的童话背景，也是最后一个 FMV 暗示的结局。


    所以，加迪亚的下一个领导人是谁？是`加迪亚三十四世女王`，还是`沉默的克罗国王`(King Crono the Silent)？《时空之子》本身及其续作都没有提供这个关于君主遗产问题的答案。尽管性别角色倾向于父权，但皇冠理所应当归属于`玛尔`。


    ### 克罗的审判


    `克罗`(Crono)的审判是 Square 早期最具戏剧性的场景之一。《梦之队》（Dream Team，《时空之子》的三位主要制作人）想要创造出一个与《最终幻想
    6》著名歌剧片段呼应的场景，而`克罗`的审判确实非常有电影感。镜头俯拍法庭的强制透视，我们听到了一段新的、俏皮但紧张的主题曲。房间的彩色玻璃背景将正义描绘成一个盲目的女性，而是一个拿着装饰着花天平的老人。为什么正义不能是年老又是男性的呢？决定`玛尔`绑架案中`克罗`是否有罪的陪审团成员都是完全相同的的老人。


