  trans: '


    在一个下雨的秋日周六，我和当时的男友开车在湿滑的山路上通往物份华（Moniwa）。我们听说过那里的温泉，并且非常渴望与陌生人一起沐浴。前台接待区，一位拿着毛巾和储物柜钥匙的女性用日语礼貌地向我们两人打招呼，然后用用低沉而流利的英语与我交谈。她是我其中一个学生的妈妈，一位菲律宾人。她一直鼓励自己的女儿在学校多说英语，但女儿担心被特意对待，担心自己变得不够“日本人”了。


    我们坐在公共休息室里，从温泉的暖热中放松下来，补充着水分，等待雨停歇。那个学生的妈妈端着一盘梨片和一壶绿茶走了过来。“给你和你朋友准备的，”她用英语说道，带着一丝会心的微笑，随后便回到了员工厨房，消失在浓浓的蒸汽雾气和厚重的福岛方言中。


    ## RPG 中的性别视角


    成为冒险游戏和 RPG 中的男主角，对我来说，在性别视角上从未是一个什么巨大的转变。但我从未对为这些主角编写的爱情故事产生过共鸣。它们总是显得很刻意。伟大的
    RPG——我认为我青少年时期 Square 推出的许多北美作品都是伟大的——不仅用娱乐性的游戏性吸引我们，更在情感上俘获我们。我对这些明亮的小像素组合倾注了许多情感——他们的悲伤、胜利，以及他们克服绝望的挣扎。但我无法对他们对爱情的追求产生同情。当然，我在游戏中并没有看到任何看起来像我想要的东西。至少从直接意义上说如此。


    在我所喜欢的这类游戏中，获得爱情很少是一个目标。第一部《龙之战士》包含一个拯救拯救公主的情节，但就像《马里奥的碧姬公主》和《林克的塞尔达》一样，这位公主仅仅是一个“麦格芬”（MacGuffin，道具）——这三个人都可以被某种神秘的小物件或古老的装置取代，而剧情依然保持不变。公主们是被拟人化的物体，等待被发现并修复成恋人。后来的游戏通过让爱情发生在角色队伍内部来使情节变得复杂。但即使是女性队友也未能逃脱“落难少女”的宿命。《最终幻想
    IV》中的 `Rosa` 和《地球 bound》（EarthBound）中的 `Paula` 都需要他们的男性恋人——主角 `Cecil` 和 `Ness`
    来将她们从囚禁中救出来。在《时空之缘》中，`Crono` 必须将他的妻子兼伪装公主 `Marle` 从黑暗维度的监狱中救出来。为了做到，他首先必须从男性俘虏手中救她的祖先
    `Leene 女王`。


    除了继续将女性视为可获得的道具或可绑架的任务目标外，这些叙事——无论它们如何微妙地融入剧情——也赋予了“异性恋即浪漫之本质”的观念。现在，拥有一个异性故事完全没有问题。但它往往是唯一的故事——非异性恋根本不是一个选项。正如研究员
    Evan Lauteria 所出的，像 `Crono` 这样让玩家产生控制感的沉默替身，也向玩家强加了一种了一种嵌入的性倾向。无论我们为自己的空白化身 `Crono`
    构想了什么，他注定要与 `Marle` 产生浪漫联系。在队伍与 `Magus` 首次遭遇灾难性冲突后，`Crono` 被击晕并做了一个梦——或者说是幻象？梦见一个妻子般的
    `Marle` 将他唤醒，就像 `Crono` 的母亲在游戏开始时做的那样。因此，不仅暗示了 `Crono` 是异性恋，他甚至还有点俄德洛结式的色彩。


    ## 异性恋与角色动态


    意乎不用，作为 20 世纪后期日本的大众市场产品，《时空之缘》表现出对异性恋的明显偏见。我们完全可以将 `Crono` 和 `Marle` 分类为一对异性恋。与此同时，`Robo`
    有他的粉色双胞恋人 `Atropos XR`，而 `Ayla` 有她心情愿的性玩具 `Kino`。但寻找那些性向未被揭露的地方，比列举游戏中官方认可的情侣关系要有趣得多。


    `Lucca` 可能是无性恋的——甚至是机器人性恋的——尽管有一个支线，我们看到 `Marle` 和 `Lucca` 对一些 `NPCs` 的帅气程度打分。`Lucca`
    甚至在她的像素形象闪动时，称骑士 `Cyrus` 为“大帅汉”。`Marle` 尽管偏爱醉酒寻宝猎人 `Toma` 的粗犷魅力，但仍推测他可能有几个女朋友。在这一结局的
    `DS` 版本中，`Lucca` 反驳道他是否有男朋友。她们都咯咯笑了起来。无论 `Lucca` 的性向如何，她可能对可能性持开放态度。


    与此同时，`Frog` 甚至是一个谜团。与其他六个队伍成员不同，他没有已知的家庭成员。他最亲的朋友是魁结的 `Cyrus`，后者在他年轻时保护过他，他也忠诚地为其侍剑。在
    `Cyrus` 死于 `Magus` 手中后，`Frog` 被他的记忆所困扰，被复仇的欲望所占据。当粗壮的 `Masamune`（在 `Cyrus` 落时断裂）再次变得长而坚后，`Frog`
    获得了继续活下去所需的动力。后来在北方遗迹中，`Frog` 与 `Cyrus` 灵魂之间的最后的对话是游戏中最感性、最戏剧化的场景之一，但对于完成了枯燥的跑腿任务以及此前与
    `Cyrus` 灵魂进行的剑斗前戏来说，这是一个非常有趣的奖励。随着 `Cyrus` 的灵魂消失在彼岸，`Frog` 结结巴巴地说：“Cyrus，等一下！我……我……！”无论是北美版还是原版日语版，都没有为这个细腻的主题提供谓语。然而，另一个结局再次为
    `Frog` 可能是同性恋这一想法增加了一个直接的复杂性。但正如 `Marle` 和 `Lucca` 的选美结局很难在 `Chrono` 的正文中解决一样——我知道你们中有人会找到办法的！——我们可能也可以拒绝关于
    `Marle` 可能拥有青蛙 DNA 的暗示。如果这是一个可能的替代时间线呢？也许 `Frog` 是出于 `Cyrus` 巨大的荣誉感而嫁给了 `Leene`。或者，他是两栖性恋的。


    ## 模糊的身份


    `Glenn` 和 `Cyrus` 分离的策划者 `Magus` 同样格格不入。`Magus` 对妹妹 `Schala` 的感情介于乱伦和尽责的家庭情感之间。很难想象一个像
    `Magus` 这样傲慢且权力权力的角色真的怀有浪漫情感。再次找到 `Schala` 这项几乎不可能的任务是占据这个权力妄狂者的足够方式。如果说什么能让 `Magus`
    兴奋，那是权力。


    而且他不是唯一被权力引起的人。虽然是一个小角色且像他的吸血鬼名字一样讨厌的 Boss，`Magus` 的通用 `Flea` 是《时空之缘》中对替代性身份最显露的代表。尽管
    `Flea` 看起来像女性，但他认同为男性。尽管如此，`Flea` 敏锐地意识到自己模糊的性向，他的酷儿歌非常有力量：“男或女，有什么区别？权力是美的，而我有权力。”


    作为一个 Boss，`Flea` 在他飘逸斗篷下戏剧性地在战斗屏幕穿梭，有时停下来夸张地笑、摆姿势，或发出一个小粉色动漫爱心。除了走模特秀，`Flea` 还使用非接触的状态影响攻击——其中一个抛吻。正如他对性别角色的替代解读让队伍感到困惑一样，`F`
    在战斗中真的可以混淆我们的角色，导致他们互相攻击。就像 `Ayla` 的几个技能一样，心形符号被嵌入了 `Flea` 的某些攻击名称中。如果 `Ayla`
    在游戏后期使用魅惑技能对 `Flea`，她可以偷到 `Flea Vest`，这个物品在 `DS` 版本中更准确地翻译为“Flea 胸衣”。是的，他穿着文胸。如果你在《Chrono
    Cross》中发现这个物品，只有男性角色可以装备它。


