    The manual packaged along with `Chrono Trigger` takes us only so far, leaving
    us right in the aftermath of having defeating `Yakra`, the game’s first true boss.
    The guide ends with an advertisement for `Chrono Trigger Player’s Guide` at a
    reasonable retail price of `$14.95`. Just call `1-800-255-3700` to pre-order!
    Today, that 800 number still leads to `Nintendo`, though I’m certain the `Chrono
    Trigger Player’s Guide` went out of print years ago.


    This Player’s Guide was released by `Nintendo` in October 1995, a few months after
    the game’s North American debut. Billed on the cover as “the complete guide to
    the past, present and future—straight from the pros at Nintendo,” the large-format
    guide in fact leaves much unsaid. Unlike the colorful early strategy guides from
    Japan, `Chrono Trigger Player’s Guide` is a mostly no-nonsense document. There
    are no illustrated bestiaries, no bonus comics, no interviews, and no mail-in
    prize giveaways. And a later unofficial guide from `BradyGames` published to coincide
    with the `PlayStation` port feels more like a technical report than a companion
    for playtime.


    The release of the `DS` version in North America, even with its fresh translation
    and new features, did not seem to necessitate a new guide. Was this one sign of
    the growing irrelevance of the print strategy guide in an ever-growing digital
    world of capable walkthroughs, FAQs, and YouTube speedruns? While `BradyGames`
    and competitor `Prima Games` are still printing titles, these books look increasingly
    more “deluxe”—manufactured collector’s items that are closer to souvenirs than
    actual gameplay aids. Perhaps this is the way of bookkind in general. No longer
    the primary means of the storage and transmission of culture, books may become
    objets d’art, physical novelties prized more as museum pieces than as carriers
    of information. I myself have resorted to using digital substitutes for some of
    the titles explored in this chapter.


    Yes, I can only scroll through the scanned pages of my first direct bibliographic
    link to `Chrono Trigger` to reacquaint myself with the kind of in-depth light
    reading my 1990s self found so fascinating. I notice something on the back cover
    of that manual—well, the last page of the PDF scan. “Square Soft Customer Service/Game
    Counseling.” Automated service 24 hours a day, and live operators available Monday
    through Friday, 9 to 5.


    I never once dialed `206-861-0303`. Here in the `215` area code way on the other
    coast, that was a long-distance call, one I couldn’t hide on the family’s itemized
    phone bill. Today, I brave the chance that this number will lead me to an angry
    resident, sick of getting pranked by nostalgic Squareheads. The phone rings.


    Boo ba beep!


    This number—much like the `Game Counseling Department`, I imagine—is no longer
    in service.


    ## Early Inspiration


    Long before I was pencilling off-model manga characters from `Chrono Trigger`,
    I was still drawing video game stuff. My `Gray’s Anatomy` was a collection of
    `Nintendo` game manuals—`Mega Man`, `The Legend of Zelda`, `Super Mario Bros.
    2`. These booklets were an endless source of inspiration and reference for my
    doodling, and for my obsessive-compulsive desire to list, to categorize, and to
    catalog. No wonder I ended up working in a library.


    The most fascinating and numerous of the inhabitants of these slim booklets were
    the monsters and the villains. Over the years I’ve collected bestiaries of all
    types—humorous and rhyming abecedarians by new cryptozoologists like `Edward Lear`
    and `Dr. Seuss`, and monstrous compendia straight from the `Wizards of the Coast`,
    those littoral literati responsible for keeping dungeons full of dragons since
    1997. All of these sources say the same thing—Monsters are all around you, so
    here is what you need to know.


    ## The Nature of Combat


    `Chrono Trigger`’s monsters often skew on the side of cutesy. Many of them would
    look just fine palling around with any of the totally-not-Pokémon alternate-Toriyamaverse
    Dragon Quest Monsters. Unlike the lovable baddies of the `Dragon Quest` series
    or the high-fantasy foes of the `Final Fantasy` games, `Chrono Trigger`’s monsters
    don’t spontaneously manifest from the ether for a random encounter. We can often
    see them ahead, assuming we look closely enough. Sometimes they get the drop on
    us, having waited in ambush. Or they may amble around aimlessly until we pass
    into their field of vision. Some monsters make an almost choreographed entrance
    to the fight, twirling in and issuing battle cries. The integrated map and battle
    screen interface of `Chrono Trigger` emphasizes a chilling truth of life—Danger
    is right in front of you, and sometimes you can’t avoid it.


    When we fight, though, we are paralyzed. While our enemies mill about the battle
    screen, we are stuck in place. Unlike spiritual predecessor `Secret of Mana`,
    `Chrono Trigger` does not let us move around the battlefield. We can only stand
    and fight, or run away in fear.


    So we grind. Because if we skip too many fights, sooner or later we’re going to
    get caught off guard and killed. We learn new techs and magic, discovering latent
    talents every couple of levels. But this one-sided approach ignores the practical
    advice of that patron of military strategists, Sun Tzu: Know thy enemy. We have
    neither a quick-reference `Pokédex` nor the convenient `Peep` or `Libra` spells
    of the `Final Fantasy` universes to give us on-demand stats and weaknesses for
    our foes. If we don’t have a strategy guide, the best we’ve got is the in-game
    `Sight Scope`, which lets us view non-boss enemy hit points. But this item is
    only equippable at the expense of another stat-boosting or resistance-granting
    accessory. Because it’s impossible to wear a ring, bracelet, amulet, and a pair
    of sunglasses at the same time.


    `Chrono Trigger` mostly forces us to go into battle as a team. Since we fight
    side by side, the best options involve working together. Double and triple techs
    are often more efficient than making our party whale on individual attacks. And
    cooperate we should, because our enemies are doing the same! The winged `apes`
    of `65,000,000 BC` pick up the mushroom-like `shists` and hurl them at the party.
    Deep in the `Ocean Palace` in `12,000 BC`, cyclopean `scouts` and their blue and
    red cousins will team up to deliver a powerful shadow attack. Since enemies also
    use rudimentary double and triple techs against the party, we’ve got to fight
    fire with fire. Well, probably water.


    No matter how prepared we are, no matter how beefed up our party is, we can still
    have our heads handed to us. Some enemies have attacks that are debilitating at
    any level. The `Iron Orb` attack favored by `Zealish` pretender `Dalton` and his
    golem cronies will halve a party member’s hit points in one shot. And when encountering
    `nu` in the wild, we have to watch out for a headbutt that reduces a character’s
    HP to `1`. Even if we are able to defeat our opponents, they may have a final
    counterattack waiting to twist our potentially Pyrrhic victory into a bitter loss.
    The fact that enemies have attacks altogether indifferent to our hard-earned experience
    reveals a hard lesson—No matter how high your station in life, you can always
    be brought low.


    To thirteen-year-old me, playing `Chrono Trigger` without a strategy guide would
    have been equal parts thrilling and terrifying. But I made my first adult replay
    of the game a closed book affair. Mainly because I don’t have a copy of `Chrono
    Trigger Player’s Guide` anymore, except as a PDF. So what if I didn’t find that
    `Magic Tab` on `Mt. Woe`? So what if I forgot to literally charm the pants off
    Ozziezie and obtain his rare slacks? Learning to let go of perfection, to embrace
    uncertainty and spontaneity, has been a difficult point of personal growth for
    me. My transformation from a boy who plays by the book to a man who makes his
    own rules is far from complete.

