    I’m on the fence about the Chrono series’s decision to push Lucca into the role
    of single mother. From one angle, it seems to be an easy way to dissociate Lucca
    from career scientist and recast her in the traditional gender role of stay-at-home
    mom, one which her own mother Lara fills well. Then again, Lucca, who can either
    succeed or fail in preventing Lara’s partial paralysis, learns from this unique
    time-travel episode the value of her own mother. It would be unfair to make Lucca
    choose between motherhood and science, so what does it mean that Lucca accepts
    the role of everyone’s mother? No version of Chrono Trigger provides a resolution
    to this conundrum, but we can hope that the coexistence of Robo Jr. and Kid provides
    a unique opportunity for Lucca to combine her scientific and familial desires.


    The last of our female heroes is Ayla, and boy, does she turn the sex dial up
    to fuck! Toriyama’s official artwork shows Ayla’s ample breasts filling up her
    skimpy furs. Unlike the game’s other blonde bombshell, Marle, Ayla shows a lot
    more than just the hint of cleavage—she goes full exposed midriff.


    While Ayla is undoubtedly the game’s sexiest character, she is also colored with
    some decidedly unfeminine tendencies, like hard drinking and unabashed belching.
    In the first North American translation, all of this boozing is censored to “eating
    soup.” It is unfortunate, however, that a required event in the game is for Crono
    to outdrink—er, outeat—Ayla at a prehistoric party. Ayla loses with dignity and
    respect for Crono’s capacity—and perhaps, for our ability to press that goddamn
    A button in rapid succession. Still, I can’t help but feel that this is both a
    joyless mini-game and an undermining of Ayla’s fierceness.


    Ayla is counterbalanced by Azala, the leader of the reptites—a kind of dino sapiens
    and rival to early mankind. Although ungendered in the Super Nintendo version,
    the Nintendo DS translation artfully suggests that Azala is female. The clash
    of these two powerful women for the fate of the planet is a welcome change from
    predominantly male dyads. Strong female support characters like Azala—hero and
    villain alike—help diversify images of femininity in Chrono Trigger.


    Queen Zeal, driven mad by vanity and lust for power, is a stark contrast to Mother
    Brain, whose cold logic dictates the rise of a civilization of robots. As far
    as we can tell, though, Mother Brain only creates one femmebot—Robo’s female companion
    Atropos XR. Mother Brain’s technogynocracy is an interesting parallel to Queen
    Zeal’s royal court, which is similarly all-male except for her daughter Schala.
    Far less threatening than these two femme fatales but perhaps just as powerful,
    meek Schala proves instrumental in saving our party from Lavos after Crono is
    killed. And if we buy what Chrono Cross is peddling, Schala will eventually fuse
    with Lavos, becoming the Dream Devourer, the most powerful villain in the Chronoverse.


    Unfortunately, the presence of these significant NPCs belies the sheer number
    of male characters who keep the plot moving forward. For every Azala, there are
    literally two Ozzies. Men dominate the landscape, and eventually the political
    structures of organic lifeforms on the planet. They also represent an overwhelming
    percentage of the NPCs in the game.


    Playing through the DS version of Chrono Trigger, I counted 425 human characters.
    Of these, only 154 (35%) are female, while a whopping 266 (61%) are male—and for
    those of you counting along, the missing five are children from prehistory and
    from 2300 AD, whose gender is not clearly indicated. Examining these numbers across
    the major eras during gameplay, prehistory is the most gender-balanced society,
    with 1.6 men for every woman. Even if we assume the woolly cavekids are all female,
    men still outnumber women. It will turn out to be 1000 AD that ends up the most
    evenly distributed, assuming we factor in the Moonlight Parade that occurs during
    the canonical endings. The parade is literally bursting with women—taking a few
    steps off the racecourse into the lower square will show female dancers popping
    out of thin air to twirl in celebration. Little girls raise their arms and faces
    in song. Of the 33 new NPCs at the parade, 32 are female. Not only are the endings
    where the Moonlight Parade occurs canonically satisfying, they also provide the
    most hopeful outlook for gender equality we’re going to find in Chrono Trigger.


    I chose specifically to exclude monsters from the count above. Determining the
    gender of monsters in the game is a difficult task, though we must assume many
    monsters are female. The continued existence of the monster population in Medina
    Village in 1000 AD hinges on this crucial fact. Unless most monsters reproduce
    asexually, which would be no fun at all.


    Oh, did someone say “monster sex”? One of the few monsters clearly designated
    as female is the “naga-ette,” which has the lower body of a snake and the bustline
    of a well-endowed woman. If the party explores the depths of cathedral in 600
    AD, we discover “the secret Naga-ette Bromide.” When I first played this game,
    I was vaguely aware of `bromide` as a pharmacological term, so I figured this
    had to be some kind of super-secret potion. Nope. In Japanese, a `buromaido` refers
    to a printed photograph of a celebrity, named so for the silver bromide emulsions
    used in photography in the early twentieth century. Female bromides could often
    look a bit cheesecakey, like pin-up girls in magazine foldouts. When the party
    stumbles on this precious item, a crew of baddies burst into the room and attack.
    Why? Because we stole their spank material. Later on, we can trade this sexy photograph
    to a dirty old man for a power-up.


    Females in Chrono Trigger are certainly more than just objects onto which sexual
    fantasies are projected, and the most egregious commodification of the female
    body only occurs within monster porn. While the game is often content to uphold
    traditional gender associations, it at least provides scenarios for women to be
    strong, capable characters, and not just quest objectives.


    III


    It’s seven in the morning and I’m waiting in the chill of the station with a Mister
    Donut churro and a can of sweet hot coffee from the vending machine. There’s only
    one morning bus to Moniwa Junior High, the furthest flung of all the schools in
    Fukushima, and it leaves at 7:15 Moniwa Junior High is a school of eleven students.
    Counting me, the staff outnumbers the student body. The entire second grade class
    is just one shy boy. Everyone knows your business in Moniwa. And the things they
    don’t know, they aren’t exactly shy about finding out.


    “Maiker-sensei, kekkon shiteimasu ka?” the kids enjoy asking. “Kanojo imasu ka?”
    Are you married? Do you have a girlfriend? I answer with any number of deflections.
    Coming out in the workplace in Japan is not an idea I relish. I don’t have the
    linguistic finesse to differentiate myself from the high-profile gay stereotypes
    on primetime TV, like Razor Ramon HG (“Hard Gay”), the heterosexual wrestler-comedian
    who dresses in skimpy leather and terrorizes unsuspecting senior citizens with
    eager thrusts of his pelvis. So I follow the advice of guys I’ve been dating,
    and keep my sex life and work life separated. “I’m far too handsome to be married
    yet!” I answer the children with faux-cocky American swagger.

