  trans: '

    我们对《Chrono Trigger》剧情主要发生地行星的观察，带给了与通常认知截然相反的信息。我们几乎看不到白天黑夜交替的景象。然而，我们的时空旅行却展示了一个板块构造异常活跃、地理位置剧烈变化的世界。`65,000,000
    BC` 年那个类盘古大陆的星球与 `2300 AD` 年的群岛相比完全无法辨认。即使在 `600` 年到 `1000 AD` 之间，三个中心岛屿也已重组为一片巨大的陆地。这个世界以令人惊恐且不合逻辑的速度经历了其与其比例的全球性变化。


    是什么导致了这些巨大的地理变迁？如果我们相信名字后面附加的大罗马数字是真实的，那么如此剧烈的变化在短短十二个个人代内就能发生。这是一个处于动荡的世界，而不仅仅是因为时间旅行者的影响。岩石圈的持续移动必然伴随着无数地震和断裂，让人们不禁思考“大地震”（The
    Big One）何时会降临，以及它会带来怎样的毁灭。


    他们将在 `1999 AD` 得到答案。


    # 拉沃斯之日


    `2011 AD 3 月 11 日`。日本历史上以来最强的地震发生在 `Sendai`（仙台）市离岸，造成了广泛的破坏和火灾。地震引发了巨大的海啸，摧毁了
    `Honshū`（本州）东北部海岸，并蔓延整个太平洋，远远远的 `Chile`（智利）。高达 20 英尺的海浪冲击着日本海岸，冲刷了整个城镇，淹没并卷走了数千名居民。海啸突破了距离
    `Sendai` 海岸约 `60 miles` 的 `Fukushima Daiichi Nuclear Power Plant`（福岛第一核电站）的堤坝，导致熔毁，设施
    `50 miles` 内的环境受到辐射。强风将放射性物质带向了更内陆的地方。由于死亡和失踪人数估计高达 `20,000` 人，且截至本文撰写时放射性物质仍在持续渗入太平洋，“东日本大地震”成为日本历史上最惨的灾难之一。


    与此同时，在这场国家危机发生前整整十六年，日本各地的游戏玩家开始同时开启穿越之旅，以阻止另一场灾难毁灭人类并将世界重塑为荒地。《Chrono Trigger》于
    `1995 年 3 月 11 日` 在日本发售，此时距离 `Aum Shinrikyō`（真理教）在东京地铁系统投毒 `sarin gas`（沙气——一种强神经毒剂）仅九天，导致十三人死亡，无数人中毒。


    `Shōkō Asahara`（浅原彰晃）是真理教的创始人和领袖，他把自己塑造为一个新的耶稣。`Asahara` 大量借鉴《圣经》，预测以美国为伪的邪恶势力将引发第三次世界大战。这场战争将以全球核末日终结。唯有被选者才能幸存。


    虽然袭击的确切原因从未完全公开，但我可以想象 `Asahara` 像 `Magus`（魔斯）一样，操纵着他无法控制的破坏力量。在成为 `Shōkō Asahara`
    之前，他是 `Chizuo Matsumoto`（松本直），一个工人阶级家庭的穷小子。他的一只眼睛完全盲，另一只也只有部分视力，这九个孩子中的第七个他可能完全理解了被踩踏的感觉。就像
    `Janus`（尤利斯）——`Magus` 在被穿越时之前那个脆弱的男孩一样——`Chizuo` 长成了一个预言者，并预言了世界的末日。随着他教派的壮大，其怪异的宣传进一步进入公众视野。警告信号本就在那里，但没有被理会。


    在发生前几天伴随着几次震动后，“东日本大地震”并非没有预兆。但它终究还是出乎意料。而在另一个世界、另一个现实中，“拉沃斯之日”带着惊天动地的愤怒爆发，为全人类开启了一场清醒的噩梦。


    •


    `65,000,000 BC`。`Crono`、`Ayla` 和他们的第三个伙伴在堡垒中击败了 `Azala`。这些蜥蜴人看起来比 `Azala` 嘲嘲热讽所称的“猿类”更有可能继承地球。只有通过
    `Crono` 团队的偶然出现，这些穴穴人才能击败技术上更优的蜥蜴人敌人。


    好吧，如果不是巧合，那就是同步性。因为正是在这个不可思议且均匀整除的年份，`Lavos` 将在星球上完成它那不受欢迎且灾难性的出现。


    当 `Azala` 从她那恐怖坐骑的残影中爬行时——化石记录中并没有 `Black Tyrano`——紧张的战斗主题曲 `Boss Battle 1` 归于寂静。随后，哀伤的
    `At the Bottom of the Night` 衬托出 `Ayla` 对她这位优秀对手 `Azala` 的尊重与同情。但这首感抒情的歌曲并没有作为
    `Azala` 理应忏悔的戏剧性背景，而是变成了 `Lavos` 坠落的诡异配音乐。透过一道冰冷遥远的光流，这颗“红星”穿过太空，变得越发棘手越发危险，沿着抛物线向地球而去，与此同时一段合成交响乐将世界交给了即将降临的毁灭。


    随着它的接近，`Ayla` 将这颗不洁的陨石命名为“Lavos”——在她显然是后置形容词语法的语言中，`la` 意味着“火”，`vos` 意味着“大”。这不是为了北美本地化而创造的细节。在日版中名为
    `Ravosu`，这个名字在我成年后通关游戏时暗示了它是致敬 `Ravukurafuto`（日本恐怖小说作家 `H.P. Lovecraft` 的日式译名）。


    •


    当鲁导师 `Melchior` 在 `12,000 BC` 从 `Mountain of Woe` 被释放后，他告诉小队：“Lavos 沉睡在地下，吸收着这颗星球的能量。”这句话让我想起了克夫鲁那句著名的名言：“在它拉莱耶的家中，死去的克苏鲁在梦中等待。”


    `Lavos` 就像克夫鲁传说中许多更强大的生物一样，是一个来自已知宇宙之外的古生物。它的力量巨大，目的阴险且具有可怕的逻辑性——为了自己的利益而彻底毁灭世界。`Lavos`
    被 `Queen Zeal`（赞尔女王）赋予了神一般的地位，而她像许多不幸的克夫鲁角色一样，被其纯粹的力量逼入疯狂。


    然而，`Lavos` 并不是克夫鲁作品中那种不可思议、无定形的恐怖。这只撞击 `Chrono Trigger` 世界的巨大太空豪是致命的实体且具有极强的韧性。它生存了下来并引发了多次全球性灾难，其中之一导致了冰河时代。赞尔王国的兴衰几乎对其不为色，它被魔法傲慢地挣脱了引力束缚，像拉普塔岛（Laputa）一样悬浮在平民世界上方，最终又耻辱地撞回地球。它隐藏在行星核心深处，偶尔会被像
    `Queen Zeal` 和她那时空错位的儿子那样误入的召唤者骚扰，`Lavos` 静静等待着。


    当 `Lavos` 到来时，它并没有疯子或狂热分的预告。赞尔预言者——伪装成 `Magus` 的 `Janus`——对 `1999 AD` 的人们没有任何严厉的警告。或许被认为只存在于创造神话中，`Lavos`
    以一场不可否认的真实火焰和恐怖冲破地球而出。对于《Chrono Trigger》中的普通人来说，出现的是一个 `kaijū`（怪兽），一个巨大的怪物。一只没有任何亲和品质的刺猬状哥斯拉。


    •


    在成为一个保护日本免受自己机械版本侵害的巨大原始宝可梦，或者与笨笨的侄子 `Godzooky` 合作在小屏幕 Hanna-Barbera 动画中破解谜之前，`Godzilla`（哥斯拉）曾是一个可怕的怪物，是原子实验失败后的受苦产物。


    '
- fmt: '

    # Gojira and the Atomic Legacy


    The film `Gojira` was released in Japan in 1954, nine years after the United States
    dropped two atomic bombs on Hiroshima and Nagasaki. `Little Boy` and `Fat Man`,
    two blunt American-style kaijū, were the worst weapons the world had seen and
    the ugliest harbingers of the atomic age. `Gojira`—or as we better know him, `Godzilla`—began
    as an embodiment of Japanese nuclear rage, of a people punished brutally for the
    sins of its leadership. Both aggressor and victim, `Godzilla` rampages through
    Tokyo until he is defeated by a weapon even deadlier than the one that mutated
    him. The film ends with the lingering fear of creating an even worse monster.


    # The Nature of Lavos


    Lavos too is a spiny-backed creature of flame that destroys indiscriminately.
    But unlike `Godzilla`, it is not a victim of human interference. When `Queen Zeal`
    attempts to harness its abilities for her selfish gain, `Lavos` is already a being
    of immense power, having had precisely `64,988,000` years to leech energy from
    the planet.


    But, is Lavos actually evil? Most of the villains in the Square pantheon are insatiable
    megalomaniacs, and many of them harbor a sociopathic hatred of life itself. `Chrono
    Trigger`’s answer to `Final Fantasy IV`’s `Zemus`, or to `FF6`’s `Kefka`, is `Queen
    Zeal`. She, like these other fiends, channels her lust for power and disdain for
    weakness into a final form. Shedding their humanoid appearances, these villains
    achieve monstrous apotheoses, becoming beautiful, surrealistic abominations. But
    `Queen Zeal` is not our final foe. We don’t even have to fight her. It is `Lavos`
    who beckons.


    After we break into the outer shell of `Lavos`, we follow throbbing biorhythms
    to what seems like its core. There, a grotesquely large biomechanoid crowds the
    screen. Our party comes to understand that `Lavos` “has slept underground, controlling
    evolution on this world for his own purpose,” and that eventually `Lavos`’s spawn
    “must migrate to other planets… to repeat the cycle.”


    Unlike the cast of `Chrono Trigger`, I have real difficulty imagining `Lavos`
    as male. `Lavos` is too big, too inhuman, too godlike to be anthropomorphized
    as a “him.” Regardless of the party’s gendering of their enemy, if their collective
    hypothesis is indeed true, then humankind actually owes its existence to `Lavos`.
    Even ignoring the convenient fact that `Lavos`’s appearance saved humanity from
    extinction at the hands of the reptites, if `Lavos` did shape all of life for
    its own gain, we cannot remove it from the equation. There’s a reason we can’t
    stop `Lavos` from ever appearing on our planet. We would not exist without it.


    Battling through `Lavos`’s second transformation, we finally see its final form,
    a triptych boss comprising an oversized biped flanked by two floating pods. `Lavos`’s
    evolution occurs in reverse in comparison with the regular Square baddies, shrinking
    from monster-sized to near-humanoid in a twisted apanthroposis. Humans were `Lavos`’s
    pet project, and it has refashioned itself in their image.


    Is `Lavos` a selfish conqueror of the world, or a planetary farmer simply following
    its instincts? How sentient is `Lavos`, and if it can speak to us, why won’t it?
    Do apiarists palaver with their bees, or do they just mind the hives and collect
    the honey? It’s painful to imagine our species as insects, as fodder for something
    bigger, more powerful. Something that could plummet from above and ruin us in
    the blink of an eye.


    •


    # Unforgettable Fire: Artistic Memory of the Bomb


    1974 AD. Nippon Hōsō Kyōkai, Japan’s public broadcasting corporation, held a campaign
    soliciting artwork from Japanese citizens to memorialize the atomic bombings from
    nearly 30 years prior. Of the `975` pieces collected and exhibited in Hiroshima
    in August of that year, `101` were chosen for publication.


    `Unforgettable Fire` is as beautiful as it is terrifying. If the postscript to
    the book is to be believed, none of the contributing artists were professionals.
    Indeed, many of the drawings are rough, primitivist, dominated by grays and reds.
    Dismembered, disfigured, and destitute characters float through limbo-like landscapes.
    For all of these artists, the memory of `Little Boy`’s leveling of Hiroshima is
    vivid, whether they were well into their 80s or as young as their 30s.


    The work of one then-36-year-old artist captured my attention immediately. `Tsutomu
    Ojiri` remembers having seen the A-bomb falling from the sky. A five panel time-lapse
    begins with one large red circle and a smaller red circle underneath. Going right
    to left—Japanese style—the top ball seems to shrink as the lower one grows larger
    and larger, extending from a crude red lightning bolt. The fireball gradually
    dwarfs the sun until it is monstrous and starlike itself, too big to fit in the
    final panel. I couldn’t help but imagine `Tsutomu` as young boy, seeing that horrible
    `Lavosian` red fireball barreling towards him.


    Other images in this catalog are less vivid but equally evocative. `Yūji Ichida`—age
    `64` at time of drawing—depicts a despairing woman, fully clothed, holding a small
    naked form in her hands. Behind her, a dead animal. And behind that, ruin. Piles
    of debris, trees stripped of all leaves and standing haunted in a hazy waste.
    If this is the aftermath of apocalypse, then we are lucky not to travel through
    the broken world of `1999 AD` after `Lavos` arises volcanic from his slumber.


    •


    # Fukushima and the Language of Ambiguity


    I last saw `Fukushima City` in the summer of `2009`, three years after I had moved
    back from Japan to the U.S. On the surface, nothing much had changed in my absence.
    But my old haunts felt more like ghost towns. Quieter. Emptier. I knew almost
    nobody, and nobody knew me. Whatever magic there had been largely dissipated.
    I felt out of place. Out of time.


    Two years later, when the combined forces of nature and man—magic and tech?—collided
    to form a triple disaster on `March11`, I was frantic. I texted, sent hasty emails.
    All of them the same: “Daijōbu?” Are you OK? Friends in the Tokyo area and the
    Tōoku Region alike responded. Yes, we’re OK, but…


    There’s always a but. Japanese is a language of ambiguities, a language of un-finishing
    each other’s sentences. But these buts continued into grim new clauses. But my
    friend’s grandmother was swept away by the tsunami. But our home is wrecked and
    we are sheltering at the elementary school. But we are afraid to go outside because
    of the radiation.


    Several months later, an ex-boyfriend living in Tokyo—but a Fukushiman by birth—told
    me about what was going on in the city where I once lived a comfortable expatriate
    life. His family’s dogs couldn’t go out for walks because of the radiation. Worse,
    the local children weren’t allowed out to play. Even worse, fewer local children
    remained in Fukushima—many families had fled the city in panic.


    I remembered long bicycle rides along the `Abukuma River`, treks up `Hanamiyama`
    to see the view of `Mount Shinobu` protruding nipple-like from the center of the
    city. I remembered my students—middle-schoolers in their sailor uniforms, elementary-schoolers
    shouldering carapacean randoseru bookbags. I remembered the wizened, overtanned
    granny on the first floor of my apartment building, half-crooning at me in her
    gutteral Fukushima dialect to make weather smalltalk. Adzē nā? Yes, ma’am, it
    is hot. Goddamn, is it hot.


    I wanted to cry and found that I couldn’t. If there is an appropriate soundtrack
    to this desperate, empty feeling, we have all heard it as `Lavos` spirals down
    to our eventual peril—“At the Bottom of Night.” There not even sadness can survive.
    It is just a vast, starry emptiness.

    '
