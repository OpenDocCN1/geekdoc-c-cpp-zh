    Continuing and mercifully ending the sequence of way-too-obvious names, is Robo.
    Hint: He’s a robot. Transported to the dark future of 2300 AD, our party discovers
    him in disrepair. In a scene that reminded me of the eerie 1985 film Return to
    Oz, Lucca repairs the machine-man, who greets her with polite surprise. If I had
    had the foresight or character space to rename Lucca to “Dorothy,” then Robo would
    have made a fine “Tik-Tok.”


    We will much later learn that Robo has a tragic background, but he first functions
    as an object of Lucca’s desires. Much like how Marle fixates on ensnaring Crono,
    and how Frog yearns to become Cyrus—realized heteronormatively as a desire to
    protect Queen Leene—Lucca needs someone upon whom to inscribe her passions. She
    establishes a direct physical connection with Robo as his resurrector (or, resurrectrix,
    if you really want to), and soon as his regular maintenance person.


    Robo reveals his serial number to be R-66Y, but we will discover that his true
    name is Prometheus. In an ironic twist on the Greek myth, the fire-affinitied
    Lucca brings the spark of life to Robo. Robo is implied to be male, despite a
    lack of reproductive organs. He certainly doesn’t balk at others referring to
    him with the masculine pronoun. Since romance also applies to robots in Chrono
    Trigger, Robo has his own probably-female love interest, Atropos XR. In Greek
    mythology—you really should have studied up before playing!—Atropos was one of
    the Three Fates, goddesses who controlled human destiny by spinning, measuring,
    and cutting the threads of life allotted to each mortal. Atropos had the honor
    of being the final snipper, and Chrono Trigger’s Atropos XR is similarly an agent
    of human demise, despite her cute pink paint job and adorable little ribbon.


    Some of the humor in Robo’s dialogue comes from his confessed inability to grasp
    human emotions fully—a fact which is blatantly false. Like many other beloved
    androids in popular culture, Robo does know what love is. If we bother with the
    endgame sidequests, Robo must eventually battle and destroy a reprogrammed Atropos
    XR, leaving him alone in the world except for Lucca. Once we defeat Lavos and
    correct the timeline, however, we will see Atropos XR and Robo together as a happy
    couple.


    In that very same sidequest, we learn that before his breakdown, Robo had been
    sent by the supercomputer Mother Brain to study humans and their weaknesses. Square
    has used the “party member as traitor” trope effectively in other titles, but
    in Chrono Trigger this nugget of information comes far too late in the game to
    be of any real import. Rather than give Robo any additional depth, the unspooled
    plot thread of his potential treachery only reminds us that Robo’s storyline could
    have used a bit more polish.


    Last in the regular roster is cavewoman Ayla, a blast from the past in all senses
    of the phrase. Like Robo, Ayla has no elemental alignment. A prehistoric party
    girl, she revels in the physical. She eats, drinks, sleeps, and fights hard. She
    probably does other things hard, but this is best left to the players’ imaginations.


    Upon first meeting her, the party is exasperated at her inability to understand
    the concept of time travel. Here, the golden-haired Ayla might be dangerously
    close to the “dumb blonde” stereotype. Except that she’s the most put-together
    of anyone in our party. She has a steady partner, she’s the chief of her tribe,
    and eventually she’ll be the leader of all early humans. Noble in battle even
    to her enemies, Ayla always chooses courage over fear. She is also incredibly
    pragmatic: “Ayla fight while alive! Win and live. Lose and die. Rule of life.
    No change rule.” Powerful Ayla and her submissive boyfriend Kino will establish
    the bloodlines that eventually become the royal lineage of Guardia. Though this
    fact only becomes apparent in the ending, Marle will have battled alongside her
    distant grandmother for a good portion of the story.


    We can finish the game with only these five characters—or six, if we really do
    care about that chatterbox Crono. The observant player, however, will notice an
    open slot in the menu’s party window. Room enough for a seventh character.


    •


    As far as hidden characters go, Magus is hiding in plain sight. As in, directly
    in your field of vision.


    The instruction manual included with the initial Super Nintendo release in North
    America makes no mention of Magus as a potential PC. Similarly, the early spoiler-light
    Japanese guide, Kurono Torigā Kōryaku Daitokushū—or, the Chrono Trigger Strategy
    Big Special, if you want to get a good feel for how awkwardly Japanese directly
    translates to English—does not include Magus in the introductory lineup of characters.
    In fact, the guide emphasizes the role of Magus as an antagonist. But, much like
    many a feline from Norstein Bekkler’s Tent of Horrors, the cat must have gotten
    out of the bag pretty quickly. Later strategy guides in Japanese and English do
    not attempt to surprise the player with Magus, but rather openly advertise him
    as a regular party member.


    After the fall of the Kingdom of Zeal in 12,000 BC, the careful shopper will notice
    a curiously unequippable scythe now available for purchase in the Last Village.
    Unlike finding the reclusive sasquatch Umaro and gender-ambiguous tatterdemalion
    Gogo in Final Fantasy VI, tracking down the character who can wield this weapon
    is not a difficult task. In fact, confronting Magus is a required story event.
    But there’s a twist.


    We can choose to fight Magus and finally give him the ass-whooping he deserves.
    If said ass does indeed get whooped, the curse he laid upon the young squire Glenn
    will be broken, returning him to his handsome, emerald-haired human form. But
    this is not a reward we get until the very, very end: The human Glenn is not playable
    in Chrono Trigger.


    For players like me who consider hidden characters essential, we have the option
    to swallow our pride, buckle our ass-whooping belts, and make peace with Magus.
    Frog will quite maturely note that killing Magus will not bring back his long-dead
    friend Cyrus. At this point, we might wonder why we can’t just go back to the
    past with our awesome time machine to rescue and recruit Cyrus. Moving on.


    Refusing to fight Magus will unlock him as a character. In a game with a somewhat
    limited selection of PCs, there is little reason not to recruit Magus. And whether
    we kill Magus or have him join us, the ending FMV in later editions suggests that
    Glenn will indeed be restored to his human form. Unless it is absolutely necessary
    to see Frog change his sprite briefly at the end of the game, getting Magus is
    the winning choice. All the strategy guides are pretty much telling us to get
    him, right?


    Magus is, after all, one of the most compelling characters in the game.


    •'
