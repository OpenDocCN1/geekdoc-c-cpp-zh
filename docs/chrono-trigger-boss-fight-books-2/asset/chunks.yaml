  trans: '

    我们的许多同代人渴望获得生活的策略指南。我看到地铁上的通勤者们读着排版精美的基督教灵修读。当他们的书页被黄色的墨迹完全浸透时，新书就会取代它们。在世俗方面，《高效能人士的七个习惯》已被《第八个习惯：从优秀到卓越》所取代。而每个种族、信仰、肤色、职业和年龄段的灵魂都可以放心，如果他们没有拥有一本名为“心灵鸡汤”，很快就会有一碗鸡汤从厨房出炉来慰藉他们。


    我们可以在书中找到解决问题的帮助，但我们不能成为这些文字的奴隶。我们需要经营自己的生活，而不是去幻想如果我们拥有了《积极思考的力量》，或者某些让梦想成真的隐藏古老
    `Secret`，生活会变成什么样。我们需要做些什么。我们的一生是有限的，时间根本不够。


    # 时间的终结


    尽管我一直在写一个存在意义就是时空旅行的游戏，但我花了很长时间才抽出时间讨论它。


    `Chrono Trigger` 无疑不是第一款采用时空旅行元素的视频游戏。可以说，它甚至不是 Square（史克威尔）第一部这样做的 RPG。第一部《最终幻想》（Final
    Fantasy）讲述了一个红发战士和他的朋友最终解封了一个魔法“时间之门”，以击败潜伏在过去的邪恶反派；而《最终幻想传说 III》则探索了利用时间机器驱动旅行来防止过去、现在和未来时代灾难的力量。`Chrono
    Trigger` 则通过时空旅行跨越了史前小说、中世纪幻想和后末日科幻等迥然不同的体类型，提升了格调。`Chrono Trigger` 的直接 Square
    前作《Live A Live》就预示了这种跨越类型的融合，它不仅描写了一个穴穴人英雄和一个未来机器人，还包含了其他类型小说的代表人物：骑士、忍者和牛仔。游戏甚至还有一个名为
    `Maō` 的反派，你们中的某些人可能认出那是 `Magus` 的日语名称。


    `Chrono Trigger` 结合了《最终幻想传说 III》和《Live A Live》的成功之处，使得时空旅行既是故事不可的一部分，又具有历史的全面性。时空旅行似乎如此深植于剧情，以至于很难想象没有它的游戏。然而，尽管听起来有些狂妄，但我认为
    `Chrono Trigger` 并不真的需要时空旅行也能成为一款成功的游戏。


    嘿。


    我很高兴你在把这本书扔到房间另一头后又捡了回来。或者你只是在愤怒地关机后重启了平板电脑。这哥们儿在说什么鬼，说 `Chrono Trigger` 不需要时空旅行？标题里可就有“chrono”这个词！请听我解释，我将稍微重述一下我在几个章节前提供的剧情梗概。


    `Crono` 是一个来自小镇的少年，他精通科技的女孩伙伴 `Lucca` 以及伪装的公主 `Marle` 最终在宇宙中打开了一个洞——一个大门。在发现自己的世界与其他世界之间的联系后，三人穿梭于不同的世界，集结了一支盟友队伍：变成骑士的青蛙
    `Frog`；坚毅的机器人 `Robo`；粗犷的穴穴人女孩 `Ayla`；最后是立场神秘的黑黑魔法师 `Magus`。在得知他们的世界——即所有生命本身——将被来自外星邪恶力量
    `Lavos` 毁灭后，这七个人继续前行，收集线索和材料，结识支持者并战斗敌人，为那场决定未来的最终决决战做准备。


    这个故事的发生并不需要时空旅行。但是，例如 `Leene 女王` 的消失导致 `Marle` 从世界上被抹除该怎么办呢？这个剧情点在这里行不通吧！我觉得也许可以。让我们想象一个类似于《塞尔达传说：时空之剑》那样的多重宇宙。在这部《塞尔达》作品以及它的许多续作中，两个平行世界共存。“光明世界”（Light
    World）和“黑暗世界”（Dark World）在结构上有很多相似之处，且许多地点在每个宇宙中都有对应的备用版本。作为 `Link`，我们在世界之间穿梭，解决利用现实二元对性的谜题。如果认为跨宇宙的角色会受到与其世界平行（甚至近乎垂直）的世界事件的影响，这会荒谬吗？当然，那部游戏就不会是
    `Chrono Trigger` 了。


    `Chrono Trigger` 中的时空旅行是一件混乱的事务。`Lucca` 在 `600 AD` 向我们介绍了它的机制，那就在 `Marle` 消失在“某个寒冷、黑暗……且孤独的地方”后不久。


    `Marle` 对自己无意中冒充 `Leene 女王` 感到非常高兴，乐意享受王室生活的舒适，在那里她不再被视为国王的监护人，而是她自己的女王。让我们忽略那个毛骨悚然的现实：在某个时刻，`Guardia
    国王` 可能会试图与其青少年远后代发生关系。与此同时，寻找真实 `Leene` 的行动被取消了，因为 `Marle` 和她一模一样。`Leene`——连同
    `600 AD 总宰`——从未被营救，被 `Yakra` 和他的爪爪杀死。也许他们将她祭给了大教堂深处 `Magus` 的神像。也许他们对她做了更过分的事。毕竟，她比小蛇人要漂亮得多。但为了把
    `Marle` 从这种变种的“祖父悖论”中救出来，我们必须保留 `Leene` 在时间流中的位置。听起来很容易，对吧？


    并没如此。


    如果我们不救 `Leene`，那么 `Marle` 就不再存在。如果 `Marle` 从未出生，`Crono` 就不会在“千年年华”上遇到她，`Lucca`
    的传送器也不会发生故障并创造时间之门。但也许在这个交错的时间线上，并没有 `Guardia` 了。在 `600 AD`，由 `Ozzie` 领导的 `Mystics`
    利用 `Leene` 死亡后的混乱，突破了 `Zenan 桥` 的防线。由于没有 `Crono` 和伙伴与他们战斗，`Ozzie` 的不死爪爪轻易征服了 `Guardia`。`Banta`
    和他的年轻妻子被杀害——不会有 `Taban`，也没有 `Lucca`。没有了庆祝千年王制的“千年年华”，也没有了最初给予这一切理由的 `Marle`。


    但是，等等。`Leene` 之死是因为 `Marle` 的出现导致宫廷取消了搜寻。所以为了让 `Leene` 死亡，`Marle` 必须存在。但当 `Leene`
    死亡时，`Marle` 又不存在。如果你允许这种混杂的话，我们在这里陷入了某种“薛尔谔的二难困境”，为了让这个场景成立，`Marle` 和 `Leene`
    必须既是死的又是死的。


    《魔法圣石》（Secret of Mana）的事件揭示了另一个事实。下游筑坝不会导致上游的水消失。水流会变弱，水会退去，河流会干涸。那么，时间会向上挣扎以跟上靠近源头的变化吗？这种时间特性似乎有助于解释
    `Leene` 活着而 `Marle` 却消失的表象悖论，但事实上它证明了相反的。如果 `Marle` 在 `600 AD` 继续扮演女王，`Leene`
    将被杀死，她的遗体被留在无标记的坟中。`Marle` 会再扮演一段时间 `Leene` 的角色，直到时间追上自己，最终从时间线中瓦解 `Marle`。

    '
- fmt: '

    Remember that this `Marle/Leene` episode is our first taste of how time should
    operate in `Chrono Trigger`, and it’s already a bit of a trainwreck. So it actually
    works in our favor that the rest of the game is not slavish to the infernal, niggling
    logic of causality.


    For starters, ignoring paradoxes allows us to make changes to the timeline in
    the first place, raising the stakes for adventure without bogging Chrono Trigger
    down with with complexities. It also sets up interesting puzzles, some of which
    flagrantly defy the Grandfather Paradox. Like those sealed chests in the Middle
    Ages and in the present. We shouldn’t open those boxes in `600 AD`, because we’ll
    forfeit the chance in `1000 AD` to get powered-up versions of the items they contain.
    But if we unlock those same chests in the present, we can travel back to `600
    AD`, snag the contents, and effectively get two for the price of one. The universe
    does not implode if we grab both the `Nova Armor` in the Northern Ruins in `600
    AD` and its powered-up version, the `Moon Armor`, in `1000 AD`. We can cheat the
    system a bit without any temporal repercussions.


    Analyzing the ins and outs—more often than not, the highs and lows—of the time
    travel utilized in `Chrono Trigger`, is an exercise riddled with frustration,
    headaches, and overexplanations. In short, it is the height of nerdish joy.


    The easiest answer to these logical inconsistencies is a simple one—`Chrono Trigger`
    is a game designed by committee. While the lead producers shared mutual enthusiasm,
    they also contributed their own individual inputs that did not necessarily match
    up to their colleagues’. Their staff, however, was forced to make everything work,
    even if it wasn’t compatible with other content. Game supervisor `Yūji Horii`,
    for example, sketched out a basic plot in which “a character would travel to the
    past, make some actions, and that would change the current or future situation
    of the character.” Meanwhile producer `Hironobu Sakaguchi` designed monsters and
    characters like `Gato` struggling for inclusion. Even `Akira Toriyama`’s concept
    art needed to be worked into the game. That iconic Toriyama image of `Crono` battling
    in the snow with `Frog` and `Marle` at his side, for example, wasn’t even implemented
    until late in `Chrono Trigger`’s production, when programmers found a place in
    the story for `Death Peak`. Worse, this image is simply wrong. `Marle` uses water
    magic, not fire. And this image was the box art—the very first thing players saw!
    `iyama` admitted that he was supposed to have drawn an ice sword, but it was too
    difficult for him so he substituted flame instead. Story planner `Masato Katō`,
    who wrote the entire `Kingdom of Zeal` scenario, recalled later that developing
    `Chrono Trigger` “wasn’t exactly ‘smooth sailing,’ and a lot of the parts ended
    up being changed in the end.” Despite all of `Katō`’s additions and editing, he
    was not included as an honorary Dream Teamer.


    For those looking for in-game solutions to time travel problems, the folks at
    `Chrono Compendium` have compiled many excellent theories on the whys and why-nots
    of time mechanics in `Chrono Trigger`, and even introduced some of their expanded
    mechanics in their unofficial interquel to `Chrono Trigger` and `Chrono Cross`,
    a fangame called `Crimson Echoes`. One such intriguing theory is something they
    call `Time Traveler’s Immunity`.


    * While we can conveniently ignore time travel paradoxes, we can’t ignore how
    our actions in time seem to affect others without affecting us. Well, except for
    that whole `Marle` thing. Anyway, except for that whole `Marle` thing which is
    supposed to explain how time travel in `Chrono Trigger` works, time travel in
    `Chrono Trigger` might actually work by bestowing immunity to the effects of time
    travel upon those who travel through time. Except for `Marle` that one time.


    The most heartbreaking example involving immunity is `Lucca`’s chance to prevent
    `Lara` from injury in `590 AD`. Assuming `Lucca` does rescue her mother, `Lara`
    will have lived her life perfectly ambulatory, probably forgetting how close to
    paralysis she had come. But `Lucca` will always remember that she had changed
    her past so profoundly. Does `Lucca` then have the unique experience of having
    been raised by both disabled and enabled versions of `Lara`? Or does she only
    remember the paraplegic mother who sat alone by the window upstairs? Either way,
    this is a difficult position for `Lucca`. If she remembers both childhoods at
    once, she may experience trauma or even madness from her conflicting but equally
    real memories. On the other hand, if she doesn’t acquire memories of `Lara` as
    an able-bodied mother, then not only is she cheated out of the very childhood
    she thought she was saving, but her memories are now incompatible with those of
    her loved ones. The only authentic memories she can share with `Lara` and `Taban`
    are those events that occurred before `Lara`’s potential accident. Our `PCs`—and
    by extension, anyone else who has time-traveled—are not just skipping around on
    the greater timeline, but now also following their own personal timelines.


    As our party travels backward and forward through time, their bodies do not simply
    stop aging. Traveling back in time does not obliterate them into their formative
    molecules, and traveling to the future does not turn them into the dust they’ll
    one day become. Our party actively ages as they complete their adventure, though
    this probably only takes a week or so. We are gone for a brief period one afternoon,
    the first day of the `Millennial Fair`. When we return, probably some hours later,
    `Crono` is arrested, and if we choose to serve our sentence until `Lucca` arrives
    to save him, he is jailed for three days. After he breaks out, he and the party
    travel here and there through the timeline. We spend at least one drunken—er,
    soup-bloated?—night in `65,000,000 BC`, and another in `Frog`’s burrow after giving
    him the `Masamune`. Later, after a rough battle with `Magus`, we awaken once again
    in prehistory. After `Crono` dies, we awaken in the `Last Village` of `12,000
    BC`. Finally, when we complete the sidequest to save `Fiona`’s forest, we spend
    one fateful night in the woods, where `Lucca` gets her chance for a do-over. We
    end the game on the last night of the `Millennial Fair`. This gives us a bare
    minimum of six to eight days to complete our adventure. Damn, we can really hoof
    it!


    Now, let’s complicate this further.


    The gates we travel through—and eventually the chronometer embedded in the `Epoch`—become
    fixed not to unchanging points in time, but rather to a specific active timeline.
    When we first return through the gate from `600 AD` back to `1000 AD`, for example,
    we don’t return at the exact point we had left. Enough time has passed to alert
    the royal guards that something odd had happened to `Marle`, and `Crono` is arrested
    almost immediately. And the next time we use that gate from `600 AD` to `1000
    AD`, the events of that farce of a trial have not been forgotten. All of the actions
    we take in each era remain constantly in effect. Without this fluidity, there
    would be no adventure at all—just a series of constantly unraveling plans, an
    endless and unplayable video game version of Groundhog Day.

