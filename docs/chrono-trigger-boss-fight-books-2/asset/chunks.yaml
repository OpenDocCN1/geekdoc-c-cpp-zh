    \n# Foreword\n\nI’m going to make this short so you can move along and enjoy what\
    \ you came here for! The work you will be reading is at once an autobiography,\
    \ an enthusiast’s ode to the early years of gaming, and a coming of age story\
    \ of boy-meets-cartridge.\n\nThis narrative is remarkable to me, not because I\
    \ figure much into it, but because of how deeply connected the author is with\
    \ a game I happened to localize while I worked for Squaresoft in the 90s. I was\
    \ lucky to have been able to “hook my wagon” to the smart and creative teams at\
    \ Square for a time. Like Michael P. Williams, I look back fondly on those 16-bit\
    \ works of art, and am glad to have played a small role in making them available\
    \ outside of Japan.\n\nThe art of translation can be characterized as an exercise\
    \ in channeling, sitting inactive for hours, trying to balance concision, resourcefulness,\
    \ and faithfulness to the original game. There is always the deadline, as well—that\
    \ ever-present elephant in the translator’s brainpan.\n\nChrono Trigger was a\
    \ whopper to translate due to the options available to the player, and how different\
    \ combinations of characters were designed to interact in different ways. Keeping\
    \ these interactions in mind along with tone, jokes, and ongoing plot lines was\
    \ tough, and certainly I made a number of interesting errors along the way.\n\n\
    But I knew while translating that this title was something quite special, that\
    \ the story and graphics represented an evolution in gaming. I kept having to\
    \ push back my return to the States due to the game’s ongoing localization requirements,\
    \ but knew the effort would be worth it. The development team at Square had put\
    \ so much heart and soul into Chrono Trigger, it was the least I could to try\
    \ to do their beautiful game justice.\n\nThe cartridge’s memory footprint was\
    \ so big that it was one of the most expensive games ever to ship on the Super\
    \ NES. A retail price of 80 dollars was a serious investment for gamers, I suppose,\
    \ but clearly—as seen in the accounts of Williams and countless other Chrono Trigger\
    \ fans in the last nineteen years—the experience was worth the price of admission.\
    \ And so... on with the story!\n\nTed Woolsey\nWinter, 2014\n\n# A Note on the\
    \ Text\n\nIn general, this volume uses as its basis the first English edition\
    \ of Chrono Trigger translated by Ted Woolsey for the Super Nintendo in 1995.\
    \ This same text has been used for later editions, such as the North American\
    \ PlayStation port (released in a bundle as Final Fantasy Chronicles) in 2001.\
    \ For comparison, I have included occasional references to the original Japanese\
    \ Super Famicom text and to later English editions, including the retranslation\
    \ prepared by Tom Slattery for the Nintendo DS in 2008. Later ports to various\
    \ gaming platforms, including the Wii Virtual Console or iOS, have used either\
    \ of these translations, sometimes with minor alterations to account for new controller\
    \ interfaces. A quick way to determine which of these English translations you\
    \ have is to refer to the opening line spoken by Crono’s mother. The Woolsey version\
    \ begins with “Crono… Crono! Good morning, Crono!” The Slattery version starts\
    \ with “Crono… Crono! Crono, are you still sleeping?” \n\n# Forward to the Past\n\
    \nAn hourglass measures the seconds on the screen of a newly purchased big-screen\
    \ television. The music crescendos. An adventure is about to begin.\n\nMy sister\
    \ and mother are downstairs just beginning a hot summer afternoon’s episode of\
    \ Days of Our Lives. Me, I’ve decided to forsake the people of Salem for a different\
    \ kind of saga. No, today will not be full of surprise brain tumors, satanic possessions,\
    \ and the insatiable desires of the flesh. Today is not a day for small-time drama.\
    \ Today is an epic day.\n\nA pendulum measures the seconds on the screen of an\
    \ old rabbit-eared TV upstairs in my bedroom. The music swells. I press start.\n\
    \n•\n\nI began Chrono Trigger the same way I began almost every role-playing game\
    \ I eventually fell in love with—by reading about it. North American players had\
    \ to endure agonizing months of anticipation, lapping up whatever blurbs Nintendo\
    \ Power or Game Informer dished out until that long-awaited Tuesday, August 22,\
    \ 1995.\n\nBy the time I finally got my hands on Chrono Trigger in late 1995,\
    \ it had already been a year since my last Square fix with the operatic Final\
    \ Fantasy III (really a disguised `FF6`). Don’t get me wrong, I devoured EarthBound,\
    \ which had arrived stateside on June 5th that same summer. It was my thirteenth\
    \ birthday present, in fact. I reveled in its fractured Americana. I laughed out\
    \ loud at its zany humor. I scratched and sniffed the vile-smelling cards that\
    \ came in the guidebook.\n\nBut to me, Square was the undisputed king of RPGs.\
    \ Square opened the nexus of worlds—drama, fantasy, cinema, game. Square summoned\
    \ the power of totems—sword, crystal, airship, chocobo! These hieroglyphs became\
    \ the language of my inner fantasy stories, the legends of me I told myself in\
    \ dreams.\n\nEverything I had read about Chrono Trigger hyped it up to be the\
    \ pinnacle of all my RPG desires. The sprawling world design of Secret of Mana,\
    \ the raw emotional storytelling of Final Fantasy, the inescapably appealing art\
    \ design of Dragon Warrior (really just the repackaged `Dragon Quest`). Chrono\
    \ Trigger promised to be the epitome of everything I loved about RPGs.\n\nI can’t\
    \ remember if I bought Chrono Trigger with my own money or if my mom went out\
    \ and bought me the game for Christmas. Probably the latter. But when I finally\
    \ broke the seal on that box, popped the cart into my `SNES`, and slid that purple\
    \ power switch on, I knew that Chrono Trigger had to be among the most beautiful\
    \ games that had ever been produced. Armed with my official strategy guide, I\
    \ was an eager Chrono-naut for weeks, pausing only to use the bathroom or to grab\
    \ a snack. Or to finally figure out just what the hell my mom had been yelling\
    \ to me from downstairs.\n\n•\n\n“Good morning, Crono!”\n\nA cheerful, banal greeting\
    \ from a bland, nameless mom. Teenager Crono lives a life of relative peace, if\
    \ not boredom, with his anonymous mother. But the day into which he awakens, the\
    \ day we meet him, is the special day he’s been waiting for. In fact, he’s so\
    \ excited that he slept in his clothes! Today is the first day of the Millennial\
    \ Fair. Crono’s got money in his pocket and he’s ready to make things happen.\n"
