    afraid. Afraid that playing the game some eighteen years later would ruin the
    magic. I approached with caution, reaching my hand down gingerly into that abyss
    of murky memory, wondering if the old abracadabra still had any kick. I can assure
    you, reader, that there’s still plenty of rabbit left in that old hat.


    •


    If you’re reading this book, then you probably still know the magic words. Maybe
    your memories of the game, like mine had been, are enveloped by the twin mists
    of nostalgia and getting older—an expanse of known landmarks hazily illuminated
    within dark, forgotten patches. There are far more skilled summarists than me,
    so rather than reproduce the herculean labors already completed by Chrono wiki
    compilers, let’s take a moment to go over the basics.


    Crono, a teenage boy from a small town, his techno-savvy gal pal Lucca, and princess-in-disguise
    Marle end up opening a hole in space-time—a gate. Discovering the link between
    their own era and others, the trio travels through different times assembling
    a party of allies: the knight-errant-turned-frog, Frog; stalwart robot Robo; rough-and-tumble
    cavewoman Ayla; and finally Magus, a dark sorcerer with mysterious allegiances.
    Learning that their planet—that all life itself!—will be destroyed by Lavos, a
    sinister force from beyond, the septet travel onward, gathering clues and materials,
    meeting supporters, and defeating foes to prepare themselves for that final, decisive
    battle for the future.


    The plot is deceptively simple. Condensed even further, it might read as a personal
    ad in some questfinder’s forum: Unlikely hero to save world from cataclysm. Seeks
    motley assortment of companions. Sidequests guaranteed.


    Underneath the surface and the stock RPG trappings of Chrono Trigger are gates
    into other places and ideas. Many of these gates lead into our world and its curious
    intersections of cultural understanding. Others lead into different realms of
    fantasy. Still others are traps, rabbit holes that one can tumble down indefinitely
    until the real world seems like a wonderland.


    I hope this book becomes a key item for you—a Gate Key—that unlocks new ideas
    and views into the rich worlds within and behind the world of Chrono Trigger.
    An epic adventure awaits.


    Just press start when you’re ready.


    # The Strong, Silent Type


    The vessel we operate through the majority of Chrono Trigger is a spiky redheaded
    teenager. It’ll be a long way until we ride a vehicle, and even longer before
    we pilot an actual time machine. So, just who is this dude into whom our start
    button transports us?


    Apparently, not much of anybody.'
