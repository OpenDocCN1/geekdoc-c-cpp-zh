    \ by several writers, often as an abbreviated series of steps with the spruced-up\
    \ title Hero’s Journey. Some of these new reconfigurations have similarly arcane\
    \ steps. The Dark Night of the Soul. The Theft of the Elixir. Whether or not Campbell’s\
    \ model accurately applies to all mythologies is debatable, and the adapted Hero’s\
    \ Journey may prove problematic as well. So take as many grains of salt as needed—take\
    \ the whole shaker, if you must!—as I attempt to put typical RPG hero Crono in\
    \ the sandals of a mythological figure and walk him through my own version of\
