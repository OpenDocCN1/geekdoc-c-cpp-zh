    BradyGames’s strategy guide for Chrono Trigger insists on appending a half-assed
    interrobang each and every time the masculine pronoun is used in reference to
    Flea: “[H]it him(!!?) with your best magic and away he(!?) goes.” On the Japanese
    side, the guide `Chrono Trigger: the Complete` warns the reader: “You must not
    be fooled by appearances. It’s actually a man!”[8](#ChronoTriggerMoyer-6.xhtml_footnote-003)
    The more recent Japanese guide `Chrono Trigger: Ultimania` describes Flea as “on
    first sight a beautiful female human, but is a respected Mystic man.”[9](#ChronoTriggerMoyer-6.xhtml_footnote-002)
    In the Japanese version of the game, Flea uses the personal pronoun `atai`, a
    colloquial feminine pronoun that strongly contrasts with Frog’s rough masculine
    pronoun `ore`—in Japanese, by the way, there are at least a dozen ways to say
    “I,” depending on one’s gender, age, situation, or preference. `atai` is not an
    everyday pronoun either. It is a variant of the pronoun `atashi`, a term I often
    heard used performatively by gay men. While Flea may be a man playing at womanhood,
    he is not exactly an authentic representation of transgender identity or even
    of drag performance.


    Flea might be much better described as an `okama`, but even this term is fraught.
    `okama` is not always a derogatory word for gay men, but it’s not flattering either.
    It’s innocuous enough, however, to appear in strategy guide `Chrono Trigger: the
    Perfect`—who names these things, anyway?—which tells the player that Flea will
    “berate you using `okama` language.”[10](#ChronoTriggerMoyer-6.xhtml_footnote-001)
    Well, that’s pretty direct. `okama` can mean anything from a careless synonym
    for “gay,” to a man in women’s clothing exhibiting stereotypically effeminate
    mannerisms. Often these two concepts are conflated, and as sociologist James Valentine
    puts it, “[i]n media portrayals `okama` look like fakes, trying to be women but
    noticeably failing.” Indeed, that spectacular failure might explain why these
    `okama` characters are often featured on comedy shows on Japanese television.
    Flea, on the other hand, succeeds extremely well at “passing” for female.


    While Flea is largely an inconsequential character, his attack strategy reflects
    some real-world truths about nontraditional genderings. Some people turn a blind
    eye to them, while others become confused and enraged. The biggest threat to our
    well-being doesn’t come from people like Flea, but rather from our reactions to
    them.


    • The fantasy world of `Chrono Trigger` is a foreign country, with different demography
    and cultural norms. Just as it’s unfair for me to extend my American expectations
    to my stay in Japan, it’s also unwise to judge a fictional realm by the same standards
    as we’d judge our own. Or to expect that world to look like ours. In fact, it
    is the very difference between fictional worlds and our own that make us want
    to enter them.


    At the same time, fantasy realms are both derivatives and disguised versions of
    our own world—at least, pockets of that world. So far we’ve only taken a look
    at the inhabitants of this alternate reality. But larger institutions surround
    the cast and characters of `Chrono Trigger`, some so subtly integrated into gameplay
    that we may encounter them without even noticing.


    ***


    [2](#ChronoTriggerMoyer-6.xhtml_footnote-009-backlink) “いろんな時代に行くわけですから、ちょっと無国籍な感じのキャラクターにした方がいいかな…”


    [3](#ChronoTriggerMoyer-6.xhtml_footnote-008-backlink) “主人公、日本刀なんか持って東洋的な感じがしますね。普通のRPGとは違う。”


    [4](#ChronoTriggerMoyer-6.xhtml_footnote-007-backlink) The mime `Gogo`’s gender
    is unrevealed.


    [5](#ChronoTriggerMoyer-6.xhtml_footnote-006-backlink) So says a fairgoer at the
    unveiling of `Lucca`’s telepod.


    [6](#ChronoTriggerMoyer-6.xhtml_footnote-005-backlink) I counted all “unique”
    human NPCs (not double-counting, for example, the survivors in the Last Village
    in 12,000 BC, who we would have encountered already), all flashback characters,
    and none of the non-canonical ending characters. The three time-displaced gurus
    were counted as citizens of their home era.


    [7](#ChronoTriggerMoyer-6.xhtml_footnote-004-backlink) Like “The Stare ♡ / Flea’s
    ♡♡Magic.”


    [8](#ChronoTriggerMoyer-6.xhtml_footnote-003-backlink) “姿にだまされてはいけない。実は男なんだ！”


    [9](#ChronoTriggerMoyer-6.xhtml_footnote-002-backlink) “見た目は美しい人間の女性だが、れっきとした魔族の男。”


    [10](#ChronoTriggerMoyer-6.xhtml_footnote-001-backlink) “オカマ言葉で激しくなじる。”


    # Steel and Pure Logic


    The world of tomorrow of yesterday has not yet come.


    The 1950s sci-fi dream of domed cities, meals in a pill, and helper “robits” has
    fizzled into failed Biosphere experiments, Clif Bars, and Roombas. And the Epcot-esque
    monorails and treadmill sidewalks? Merely secondary transports to and from gigantic
    fuel-guzzling airplanes. Just where is the future we were promised?


    The future of `Chrono Trigger` is a bleak industrial landscape of shattered cities
    and lawless ruins. Humans huddle in fear while monsters roam unchecked. Life has
    been distorted, stunted, and starved. This is the kind of future we were warned
    about by the Orwells and Atwoods, the Huxleys and Zamyatins. But their futures,
    no matter how dystopian, were still full of people. People simply behaving as
    people always have—oppressing, dominating, lying, controlling, self-deceiving.


    `Chrono Trigger`’s 2300 AD is a future where people have become irrelevant. The
    world has moved on, and humans have been left in its dust. Those who survive live
    in terror of mutated monstrosities and killbot patrols. Is this completely the
    fault of `Lavos`, breaking free from the core of the planet and scorching the
    globe with hellfire? Or did humans play a part in their own demise?


    We have very little information on 1999 AD, except for a brief visual record of
    `Lavos`’s emergence. There isn’t even a complete world map for this era—just the
    cutout of a future that never came to be. Superhighways and domed communities
    have replaced the towns and castles of 999 years ago, the “present.” But the lush
    greenery of 1000 AD has become less verdant. Deserts surround the Truce Dome where
    Crono’s hometown once was, and to the east, the guru `Melchior`’s hut has long
    been swallowed up by the sands.


    Building the world of tomorrow has its costs, and humanity has taken out a huge
    loan from the planet. But 1999 AD is the year the planet is about to go bankrupt.
    The reappearance of `Lavos` after scores of millions of years is a convenient,
    but ultimately simplistic answer to a question we must ask:


    Just what was the year 2000 AD shaping up to be?


    • 1999 AD. Our world. Plans for the new millennium are ramping up. Party animals
    arrange for lavish New Year’s Eve celebrations, reserving halls, caterers, and
    performers. They will ring in the new year in opulence, one-u their social rivals’
    celebratory shindigs. Doomsday preppers stockpile for New Year’s Day, collecting
    clean water, canned food, and fuel for their generators. They will survive the
    new year in comfort, and shut out the ill-prepared and foolish. Y2K is coming.


    The Y2K bug was a widely fearmongered computer glitch supposed to have calamitous
    effects on modern civilization, and all because lazy programmers had been recording
    years in two digits instead of four. So when the year 1999 (stored as the abbreviated
    “99”) rolled into 2000 (“00”), computers would think it was 1900 all over again.
    As we have all learned from science fiction, logic errors are a leading cause
    of spectacular machine failure—trailing just behind laser cannons and perplexing
    human emotions. And it was these emotionally confused, laser-toting logic-broken
    machines that would fire all of their ammunition into humanity when the clock
    struck midnight on January 1, 2000.


