    We don’t have that difficult decision. We don’t get a chance to restart the journeys
    we began. But it’s never too late for us to start leveling up, even if it means
    more grinding than we want out of life. But time is not on our side—no, it’s not.
    We can’t travel back to key moments and correct the errors of history, the mistakes
    of our pasts. We can’t see what the future will hold and plan against it. The
    fate of our world is always dependent on now, and even this ever-present now will
    someday run out of time.


    •


    There is beautiful melancholy to endings.


    In the game’s most optimistic conclusions, the party gathers one last time at
    the end of the Moonlight Parade, standing before the time rift that brought them
    all together. It will soon send them their separate ways. The celebratory music
    of the parade slowly dies out. Then, a twinkly but somber music box tune fades
    in—“Epilogue, To My Dear Friends.” Marle is our emcee here, saying goodbye to
    each party member as Crono hangs back in silence. I start to wonder if I’d missed
    something big here—the story of Marle growing up from impetuous girl to capable
    young woman. But there’s no time to ruminate on this. Friends are leaving.


    Ayla and Kino race home, more than eager to get to work on making the baby who
    will eventually become Marle’s ancestor. Princess Marle kisses her Frog goodbye,
    giving him one last invitation to straightness—much to his shocked embarrassment.
    Magus follows next with silent resolve to find his sister, the only person who
    gives him meaning. Finally, Lucca bids farewell to Robo, who stumbles with oily
    tears in his eyes through the gate that will separate him from the only family
    he has left. Toward a future that may erase him completely. One by one, our friends
    from past and future alike are gone.


    “Do you remember that talk we had?” Lucca asks Crono and Marle.


    “You mean about whether our lives flash by before we die?” Marle responds.


    Neither have time to find a satisfactory answer, because another adventure is
    already beginning. Maybe Crono’s mom follows those cats we forced her to care
    for through the gate, so of course we’re going to rescue her on an emergency time
    machine ride! Racing through the eras, we see our friends—Robo too!—making new
    beginnings for themselves. Or maybe it’s that Marle gets swept up into the sky
    on an unexpected balloon ride! Failing to pull her back to the ground, Crono ends
    up holding onto her, the lovers floating high above the fireworks. The wistful
    sadness of it’s all over becomes the giddy joy of it’s all happening so fast.


    I want these to overlap. I want to be forever putting things to rest while starting
    things anew. I want my life to flash by while I’m still living it. I wonder, though,
    if any of us have the strength to feel like this all the time. If we don’t need
    times of silent reflection after the tale has ended.


    •


    The history of Chrono Trigger is not a simple summation of the game’s plot and
    design, or how well it sold. There are stories behind every person who contributed
    to the development of this game and its release, behind every player who experienced
    it, behind every exasperated mother who waited in line to buy her son the game
    he absolutely had to have. I can’t tell you most of these stories—but I can tell
    you my own. There is so much out there and I wanted to tell you all of it. I’ve
    tried to make this book a Gate Key, but in doing so I have become a gatekeeper,
    opening some doors to you and obscuring others behind false walls. I do not apologize
    for this.


    I’ll always treasure Chrono Trigger as an integral part of my gaming inventory,
    a key item that kept me questing and opened up new roads to adventure. But like
    many key items, there are only so many times I can use it before it becomes a
    fond, undiscardable souvenir.


    Like a certain amphibian in a place far away from us, we have the difficult job
    of putting our ghosts to rest while still keeping their spirits alive within us.
    We constantly look forward, while celebrating the never-ending finality of things.
    And when the end comes—our real end, no matter what kind of ending it is!—we face
    it with courage.


    ***


    [16] The character `中`, pronounceable as `naka` or `chū`, chiefly bearing the
    meaning of “middle” or “center.” I have not deduced the meaning of Aoki’s sprite.


    [17] “Mothra, because she’s boring!” The riddle is the same in Japanese, and my
    nonsense answer relies on a Japanese linguistics pun. Both “stapler” (`hochikissu`,
    ホッチキス) and “Olympics” (`Orinpikku`, オリンピック) contain the consonant-doubling `ッ`,
    which can be described as a `tsumaru oto`(つまる音), or “a stopping-up sound.” “Mothra”
    (`Mosura`, モスラ) does not contain `ッ`, so it does not stop up (`tsumaranai`). More
    punnily, `tsumaranai` means “uninteresting.”


    # NOTES


    ## The Strong, Silent Type


    Petri Lankoski’s remarks on game engagement can be found in his article “Player
    Character Engagement in Computer Games”(Games and Culture 6:4, July 2011). Joseph
    Campbell’s monomyth appears in his book *The Hero with a Thousand Faces*. Information
    about the “unhappy ending” originally planned for `Chrono Trigger` comes from
    an interview with story planner `Masato Kato`. The English translation by `Cal
    Hampton` is hosted here at the `Chrono Compendium`. The first printing of this
    book mistakenly attributed the plan for `Crono` to game supervisor `Yuji Horii`
    and not story planner `Masato Kato`. `Patrick Holleman`’s notes on `Chrono Trigger`
    are in his 2012 book `Reverse Design: Chrono Trigger`, available for purchase
    at `gamedesignforum.com`.


    ## Straight? White? Male?


    Tanner Hig explores `Tolkien’s` and `Lewis’s` European mythbuilding in “Blackless
    Fantasy: The Disappearance of Race in Massively Online Role-Playing Games”(Games
    and Culture 4:1 January 2009). `Iwabuchi Koichi` talks about `mukokuseki` in his
    2002 book *Recentering Globalization: Popular Culture and Japanese Transnationalism*.
    `Tetsu Misaki` writes about `Mr. Popo` and `Dragon Ball Z` in his Japanese-language
    book `Doragon Bōru no Mangaku`, published by `Sairyūsha` in 2011. `Miki Tanikawa`
    discusses the “science girl” stereotype in a June 16,2013 York Times article “Japan’s
    ‘Science Women’ Seek an Identity”. `Evan Lauteria’s` remarks on sexual normativity
    and silent protagonists appear in his paper “Sexuality and Sexual Orientation
    in Console and Computer Games,” originally presented at the game studies conference
    “Videogames and the Alien/Other” in 2006. `James Valentine` talks about `okama`
    in “Pots and Pans: Identification of Queer Japanese in Terms of Discrimination”
    in the 1997 compilation *Queerly Phrased: Language, Gender and Sexuality*.


    ## Steel and Pure Logic


    `Eric Yosomono’s` description of arrests in Japanese can be found on his blog
    `Gaijinass` in a January 2,2011 post titled “7 Brutal Realities Regarding Arrest
    in Japan”. `Michael Fisch` describes Christian style weddings in Japan in “The
    Rise of the Chapel Wedding in Japan: Simulation and Performance”(Japanese Journal
    of Religious Studies 28:1-2,2001).


    ## The Day of Lavos


    The NH’s Unforgettable Fire: Pictures Drawn by Atomic Bomb Survivors was published
    by `Wildwood House` in 1981. It is the English translation of a Japanese book
    called `Gōka o Mita : Shimin no Te de Genbaku no E`, published in 1975.

