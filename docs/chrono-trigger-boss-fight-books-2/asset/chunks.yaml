  raw: 'Our view into the planet upon which the action of Chrono Trigger largely takes
    place gives us the exact opposite of the information that we are used to. We see
    little in the way of days becoming nights. Our trips through time, however, show
    a world heavily active with plate tectonics and shifting geography. The Pangaea-like
    globe of 65,000,000 BC is unrecognizable from the archipelago of 2300 AD. Even
    between 600 and 1000 AD, the three central islands have reconfigured into one
    large landmass. This world has seen its fair share of global changes at frightening,
    illogical speeds.


    What has led to these huge geographical shifts? If we believe the majority of
    roman numerals appended to names, such drastic changes can occur over only twelve
    human generations. This is a world in flux, and not just from the effects of time
    travelers. The constant shifts of the lithosphere must accompany any number of
    earthquakes and ruptures, leaving people to wonder when The Big One is coming,
    and what destruction it might bring.


    They will get their answer in 1999 AD.


    # The Day of Lavos


    March 11, 2011 AD. The strongest earthquake ever to hit Japan struck just off
    the coast of the city of Sendai, causing widespread damage and fires. The quake
    triggered a massive tsunami that desolated the northeast coastline of Honshū as
    it spread throughout the Pacific Ocean to places as far away as Chile. Pounding
    the shores of Japan at heights of up to twenty feet, this surge of water washed
    away entire towns, drowning and sweeping away thousands of residents. The tidal
    wave breached the walls of the Fukushima Daiichi Nuclear Power Plant roughly 60
    miles down the coast from Sendai, causing a meltdown that directly irradiated
    the environment within 50 miles of the facility. Strong winds carried fallout
    even further inland. With the toll of dead and missing estimated to be as high
    as 20,000, and with radioactive material still actively seeping into the Pacific
    Ocean as of this writing, the Great East Japan Earthquake stands as one of worst
    disasters in Japanese history.


    Meanwhile, exactly sixteen years before this national crisis, gamers across Japan
    were beginning their simultaneous journeys through time to stop another disaster
    from annihilating humankind and reshaping the world into a wasteland. Chrono Trigger
    made its shelf debut on March 11, 1995 in Japan, just nine days before the Aum
    Shinrikyō cult released sarin gas—a powerful nerve agent—on the Tokyo subway system,
    killing thirteen and sickening countless others.


    Shōkō Asahara, Aum’s founder and leader, had styled himself as a new Jesus Christ.
    Borrowing heavily from the Bible, Asahara predicted that the forces of evil—in
    the guise of the United States—would initiate World War III. This war would end
    in nothing less than global nuclear armageddon. Only the chosen would survive.


    While the exact reasons for the attacks have never fully come to light, I can
    imagine Asahara, Magus-like, tampering with forces of destruction beyond his control.
    Before he was Shōkō Asahara he was Chizuo Matsumoto, a poor boy in a working class
    family. Completely blind in one eye and only partially sighted in the other, this
    seventh of nine children may have understood exactly what it feels like to be
    stepped on. And just like Janus—the vulnerable boy Magus had been before being
    displaced in time—Chizuo grew up to be a prophet, and he prophesied the end of
    the world. As his cult grew, its bizarre propaganda drifted further into public
    view. The warning signs were there, and they were not heeded.


    With a few foreshocks rumbling days before it happened, the Great East Japan Earthquake
    did not come without forewarning either. But it was unexpected nonetheless. And
    in another world, in another reality, the Day of Lavos erupts with earth-shattering
    fury, ushering in a waking nightmare for all humankind.


    •


    65,000,000 BC. Crono, Ayla and their third companion defeat Azala in her fortress.
    The reptites seemed far more likely to inherit the earth than what Azala derisively
    calls “the apes.” Only through the coincidental arrival of Crono’s crew are these
    cavepeople able to defeat their technologically superior reptilian foes.


    Well, if not coincidence then synchronicity. Because it is in just this unlikely
    evenly-divisible year that Lavos is about to make its unwelcome and cataclysmic
    appearance on the planet.


    As Azala crawls forward from the afterimage of her fearsome steed—there will be
    no Black Tyrano in the fossil record—the tense theme “Boss Battle 1” fades to
    silence. Then, the plaintive “At the Bottom of the Night” underscores Ayla’s respect
    and sympathy for her worthy rival Azala. But rather than function as a melodramatic
    backdrop for what should surely be Azala’s repentance, this sentimental tune becomes
    the eerie soundtrack to Lavos’s crash-landing. Through a stream of cold distant
    lights the “red star” hurtles through space, growing thornier and ever more menacing,
    following a parabola towards the earth as a synthesized symphony resigns the world
    to impending doom.


    As it approaches, Ayla christens the unholy meteoroid “Lavos”—in her apparently
    postpositive-adjectival language, la means “fire,” and vos “big.” This is not
    a detail created for North American localization. Present in the Japanese version
    as Ravosu, the name had in my adult walkthrough of the game suggested a nod to
    Ravukurafuto, the Japanese rendering of horror author H.P. Lovecraft.


    •


    After the guru Melchior is freed from the Mountain of Woe in 12,000 BC, he tells
    the party that “Lavos sleeps deep underground, while consuming the energy of this
    planet.” This phrase reminded me of the well-known Lovecraft line, “In his house
    at R’lyeh, dead Cthulhu waits dreaming.”


    Lavos is, like many of the more powerful denizens of Lovecraftian lore, an ancient
    being from beyond the known universe. Its powers are immense, its purpose sinister
    and fearsomely logical—the utter ruin of the world for its own gain. Lavos is
    given a godlike status by Queen Zeal, who, like many unfortunate Lovecraft characters,
    is driven mad by its sheer power.


    Lavos, however, is not an inconceivable, amorphous horror like many of Lovecraft’s
    creations. The gargantuan space hedgehog that slams into the world of Chrono Trigger
    is deadly physical and highly resilient. It survives and causes several global
    catastrophes, one of which leads to an ice age. It is barely perturbed by the
    rise and fall of the Kingdom of Zeal, arrogantly torn free of the bounds of gravity
    by magic to hover Laputa-like over a world of muggles, only to crash humiliated
    into the earth again. Hidden deep in the core of the planet, disturbed only occasionally
    by the insistence of misguided summoners like Queen Zeal and her temporally displaced
    son, Lavos bides its time.


    When Lavos arrives, it is not heralded by madmen or fanatics. The Prophet of Zeal—Janus-turned-Magus
    in disguise—has no dire warnings for the people of 1999 AD. Thought to exist only
    in creation myths perhaps, Lavos bursts out of the planet in a shower of undeniably
    real fire and terror. To the everyday people of Chrono Trigger, what emerges is
    a kaijū, a giant monster. An erinaceous Godzilla with none of the endearing qualities.


    •


    Before he was a massive proto-pokémon protecting Japan against mecha versions
    of himself, or teaming up with his bumbling nephew Godzooky to solve mysteries
    in small-screen Hanna-Barbera animation, Godzilla was a fearsome monster, a tortured
    product of atomic experimentation gone wrong.'
