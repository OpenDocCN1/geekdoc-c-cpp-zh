    •


    All of Crono’s allies have their own roles to play in our journey, and any of
    them are fit to stand up to Lavos in the final battle. The catch, of course, is
    that we can only choose three.


    RPGs that feature large, customizable parties generally force us to leave a few
    characters out of the fray of battle. There are good reasons for this from a game
    design standpoint—maintaining a delicate balance of powers in battle, or fitting
    the constraints of the screen display. Rarely do games offer explanations for
    limitations on party size. Why, for example, should only four characters in Final
    Fantasy VI go questing while the other ten laze around an airship? It seems ludicrous
    that such an assemblage of heroes wouldn’t all just go out and kick monster ass
    in a squad thirteen strong. Do we really need more than one hero on guard duty
    lest our ride gets jacked?


    Chrono Trigger gives us plausible, if flimsy, excuses each time. When Marle is
    rescued in 600 AD from the world of neither death nor life that the demise of
    her ancestor paradoxed her into, we are left with a quartet of Marle, Crono, Lucca,
    and Frog. But then Frog sets off on his own, too ashamed of his failure to protect
    the Queen. There goes that party of four.


    Later (of course it’s “later”), in 2300 AD, Crono, Marle, and Lucca recruit the
    newly repaired Robo. Here game-design-as-story rears its head again. Someone needs
    to remain in the Proto Dome while the others go turn on the power elsewhere. Because
    that one crucial door will remain sealed unless someone manually opens it. Of
    course. With the temperamental door opened, the four stumble upon a gate. It leads
    to what appears to be an oversized broom closet, but is actually the End of Time,
    the nexus of infinity.


    Why do we wind up at the End of Time? Because when more than three people travel
    through gates simultaneously, time goes all wonky or something. Of course it does.
    So, why don’t people just travel through gates one at a time? It certainly works
    at the end of the game when Lucca’s gate to everywhere sends everyone back to
    their respective homes. Whatever.


    Then, even later (actually “much earlier”) in 65,000,000 BC, there are only enough
    dactyls to carry three party members to the Tyrano Lair to defeat the enemies
    of early humanity. Despite the fact that later, these same three dactyls support
    four people—Crono, Ayla, her beau Kino, and our third party member.


    And when we finally get our time machine, the Epoch, why, of course it’s a three-seater!
    Assuming that we save Crono from a fate presumably worse than death—perhaps the
    same nullness that Marle had been grandfathered into—and that we recruit Magus,
    we eventually have more allies hanging out at the End of Time than we do in the
    active party. And all of them are itching to accompany us!'
