  raw: 'Game Design Forum founder Patrick Holleman, approaching Chrono Trigger from
    a gameplay pers-pective, divides the story into two acts punctuated by Crono’s
    demise and its direct aftermath—the linear “Tragedy of the Entity,” and the open-worlded
    “Comedy of the Sages.” The first act is an adventure game that creates the illusion
    of choice and the ability to affect events through time. The second half, a game
    of puzzles and nonlinear sidequests, makes this power to change history a reality.
    Holleman’s bipartite structure echoes the first English strategy guide, Chrono
    Trigger Player’s Guide, which offers the reader a “Chart of Steps” and a “Chart
    of Events,” with Crono’s death as the fulcrum.


    RPG players usually expect an important character to die, perhaps even a party
    member whom we directly control. These tragedies equip the party with fresh resolution
    and sometimes new skills and items to pass through the next obstacle. But to rob
    the party of its leader in such an abrupt way—and to allow you to accept this
    fact without any required response—is a ballsy move, and one that defies traditional
    story structures.


    Most games couldn’t suddenly axe their main characters and expect players to stick
    with them. Chrono Trigger, however, manages to get away with this. The sheer novelty
    of having the main party member die, of course, isn’t enough to keep the player
    involved. It is the power of the characters who surround, support, and ultimately
    save Crono that allows the adventure to continue. And in a game where the hero
    has a hard time speaking up, we’re lucky we have friends who have something to
    say.


    # Party Like It’s 1999 AD


    Let me throw something out there—I’m terrible at making friends.


    It’s not that I don’t have friends, or that I’m a bad friend to the ones I do
    have. I just tend to limit my main party to a few select people I trust to accompany
    me through life’s important journeys. The many acquaintances who pop in and out
    of my life are valuable NPCs—people who provide me with rich information, surprise
    bonuses, and quest prompts. But they are not usually the people I call upon when
    I am in need.


    You can choose your friends, but you can’t choose your family. A well-known adage
    that emphasizes the primacy of kinship—of bloodlines and marriage—over friendship.
    In Chrono Trigger, though, we don’t even get a choice in our friends.


    Besides our taciturn avatar Crono, there are five major heroes who join our party
    no matter what we do—and no, I haven’t forgotten him. Sit tight. Like it or not,
    these five become our extended family for the course of the game, bound by a common
    interest in saving the world. And if we accept that friendship is something we
    choose, then the main cast of characters of Chrono Trigger are not exactly friends.
    But neither are they family—most of them have their own family drama to deal with.
    Rather, they are something that is neither and both of these things.


    They are our fellowship, our party—the people who will literally follow us to
    the end of time.


    •


    The five characters who answer the call of heroism are an odd and interesting
    lot. Each has a particular type of weapon that only he or she can equip, and each
    has an innate affinity for one of four elements: lightning, water, fire, and shadow—non-alignment
    itself is an unofficial fifth element. These weapons and affinities do not simply
    add variety and strategic challenges to the game, but also complement our party
    members’ characterizations.


    The first person to join our crew is Marle, a crossbow-wielding girl and a bit
    of a gigglepuss. This bubbly adventure-seeker spares no time in sizing up Crono
    as a potential boyfriend, making him escort her through the Millennial Fair. It
    might be easy to label Marle—secretly Princess Nadia of Guardia in disguise—as
    a “tomboy,” as a gossipy matron at the fair does. But this oversimplifies Marle
    into a troubling stereotype, and she’s already burdened with the “royal disguised
    as pauper” trope. Marle does indeed become a romantic interest for commoner Crono,
    though it might be more accurate to say he becomes one for her.


    Marle’s elemental affinity is water. Water nurtures, and is a basic physical need
    for humans. Marle’s healing techniques prove crucial in early battles. Water is
    also a symbol of sorrow, of tears. Many tender moments in Chrono Trigger involve
    Marle—if we bring her to Death Peak to rescue Crono from time-stasis, we are shown
    a truly emotional scene of Marle’s deep affection for him.


    Crono’s other major emotional interest is Lucca, a sort of big sister type. Rather
    than creating a love triangle between Crono, Marle, and Lucca, Chrono Trigger
    not only has Lucca accept Marle unconditionally, but also shows her complimenting
    Crono for having landed a “cutie.”


    Lucca is a gifted inventor (or, inventress, as the DS version genders it), so
    her alignment with the element fire—the spark of passion and creativity—is an
    appropriate choice. While her inventions have a reputation around town for being
    kooky, she is clearly a genius. Lucca is also an expert marksman (or, markswoman,
    as nobody ever genders it), and her long-range firearms mirror Marle’s crossbows.


    Crono’s journey really begins with the malfunctioning of Lucca’s teleportation
    device, but this only occurs after the introduction of Marle’s mystic pendant.
    This clash of science and magic prefigures the powerful Antipode double techs
    that these two characters will eventually activate by fusing their water and fire
    affinities. We should note that the net elemental effect of these Antipode spells
    creates shadow, the opposite of Crono’s element. The original North American release
    obscures this fact—first localized as “lightning,” Crono’s element is “light”
    in the DS translation. The accidental collaboration between Crono’s two shadow-animas
    literally unlocks the gate to adventure.


    More specifically, a gate to the Middle Ages, where we meet the aptly-monikered
    Frog. A chivalrous batrachanthrope and sword-wielding knight, Frog speaks in a
    “Ye Olde Englishy” dialogue that is as charming as it is grammatically suspect.
    No one else in 600 AD talks like Frog. Not even Glenn, the boy Frog used to be.
    We can therefore forgive Frog for having no idea how to use Middle English pronouns
    properly—it’s likely an affectation intended to support his yearnings for heroism.


    Because everything about our slimy green swordsfrog simply oozes hero.


    As squire Glenn, Frog and the legendary knight Cyrus—sworn protector of the royal
    family, King Guardia XXI and Queen Leene—track down and reclaim the stolen Hero
    Medal, an emblem of courage. Later, the two knight-sleuths face the villain Magus
    in the Denadoro Mountains. Even with the legendary sword Masamune by his side,
    Cyrus is slain by Magus. The Masamune is broken, and the ensorcelled Glenn plummets
    to the ground thoroughly transfrogrified by Magus’s magic. Glenn, now Frog, manages
    to recover the lower half of the Masamune along with the Hero Medal, seeking to
    fill Cyrus’s big shoes with his webbed feet.


    Frog’s most noteworthy weapon is that very same broadsword, which will eventually
    receive a massive upgrade. But in order to encourage Frog to find his inner hero,
    we need to make the Masamune whole again. After recovering the upper blade of
    this sword-that-was-broken, the party commissions guru Melchior to reforge the
    weapon. At the Magic Cave, Crono does not hand Frog the intact Masamune—he drives
    it into the ground. Here Aragorn’s broken sword Narsil becomes King Arthur’s Excalibur,
    as Frog reenacts the drawing of the sword from the stone. And why shouldn’t there
    be an Excalibur? The upper echelon of Guardia’s royal army is, after all, the
    “Knights of the Square Table.”'
