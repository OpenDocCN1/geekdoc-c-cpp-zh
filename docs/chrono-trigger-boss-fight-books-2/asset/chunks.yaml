    我们并没有那种艰难的抉择。我们没有机会重启开始的旅程。但对我们来说，提升自己永远为时不晚，尽管这意味着意味着比我们渴望的生活更多的磨练。然而时间并不站在我们这一边——不，不是。我们无法回到关键时刻去纠正历史的错误，或是过去的失误。我们无法预见未来将如何并为此制定计划。我们世界的命运始终取决于现在，而即便这个无处不在的现在终有一天也会耗尽。


    •


    终结有一种美丽的忧郁。


    在游戏最乐观的结局中，伙伴们在月光游行的结束处最后一次集合，站在将他们聚在一起的时空裂缝前。它很快会将他们送往各自的去。游行的庆祝音乐渐渐平息。接着，一段清脆但忧伤的音乐盒旋律响起——《终章，致我亲爱的朋友们》。玛
    le 在这里是我们的主持人，向每个伙伴成员告别，而克罗诺则静静地留在最后。我开始在想，自己是否在这里错过了什么大戏——玛 le 从一个冲动女孩成长为干练年轻女性的故事。但没有时间沉思这些了。朋友们正在离开。


    艾拉和基诺飞奔回家，急于投入工作为那个最终将成为玛 le 祖先的婴儿做准备。玛 le 公主吻了她的她的青蛙，给了他最后一次走向“正直”的邀请——这令他感到震惊又害羞。魔古斯紧随其后，带着沉默的决心去寻找他的姐姐，那是唯一赋予他意义的人。最后，露卡向罗伯告别，罗伯眼中带着油油的泪水，蹒跚着穿过那扇将他与仅存家人隔离开门，走向一个可能完全抹除他的未来。一个一个，我们来自过去和未来的朋友都离开了了。


    “你们还记得我们那次谈话吗？”露卡问克罗诺和玛 le。


    “你是说我们的生命在死前是否会转瞬即逝？”玛 le 回答道。


    他们都没有时间找到满意的答案，因为另一场冒险已经开始。也许是克罗诺的妈妈追随着那些我们强迫她照顾的猫穿过了那道门，所以我们当然要乘坐紧急时光机去营救她！穿梭在各个时代，我们看到了朋友们——还有罗伯！——为自己开启新的起点。又也许是玛
    le 在一次意想不到的热球之旅中被带到了天空！没能把她拉回地面，克罗诺最终紧紧抱着她，这对恋人浮在烟花上方。那种“一切结束”的惆怅哀变成了“一切发生得如此迅速”的狂喜。


    我希望这些时刻能够重叠。我希望在开启新事物的同时，永远让旧事物过去。我希望我的生命在活着时转瞬即逝。然而，我想知道，我们是否是否有力量一直保持这种感觉。我们是否在故事结束后，还需要沉默反思的时刻。


    •


    《时空之子》的历史并非游戏剧情和设计的简单总结，亦非取决于销量。在每一位为这款游戏的开发和发布做出贡献的人背后都有故事，在每一个体验过它的玩家背后都有故事，在每一位为了给儿子排队买那个他绝对要的游戏而焦虑的母亲背后都有故事。我无法告诉你们大部分这些故事——但我可以告诉你们我自己的。那里有太多故事了，我想把它们告诉你们。我试图让这本书成为一把“传送门钥匙”（Gate
    Key），但在此过程中，我变成了一个守门人，为你们开启了一些门，却用假墙遮掩了其他一些门。我对此并不抱歉。


    我将永远珍惜《时空之子》，它是我游戏清单中不可或缺的一部分，一件让我不断执行任务并开启冒险新之路的关键道具。但像许多关键道具一样，在它变成一份珍贵且无法丢弃的纪念品之前，我使用的次数是有限的。


    就像远处的某种两栖动物，我们肩负着艰巨的任务：在让幽灵安息的同时，让它们的精神在我们心中延续。我们不断向前看，同时庆祝事物永无止境的终结。而当终点来临——我们真正的终点，无论那是什么样的结局！——我们以勇气面对。


    ***


    [16] 字符 `中`，读音 `naka` 或 `chū`，主要带有“中间”或“中心”的意思。我没有推断出青（Aoki）精灵的含义。


    [17] “毛斯拉拉，因为她很聊！”这个谜题在日语中是一样的，我的胡乱答案依赖于一个日语语言学的双关语。“订书机”（`hochikissu`, ホッチキス）和“奥林匹克”（`Orinpikku`,
    オリンピック）都包含双音 `ッ`，它可以被描述为 `tsumaru oto`（つまる音），即“阻塞的声音”。“毛斯拉”（`Mosura`, モスラ）不包含
    `ッ`，所以它不阻塞（`tsumaranai`）。更有双关的是，`tsumaranai` 的意思是“无趣”。


    # NOTES


    ## 沉默而强大的类型


    Petri Lankoski 关于游戏参与感的看法可以在他的文章《电脑游戏中的玩家角色参与度》（Games and Culture 6:4, 2011 年
    7 月）。约瑟夫·坎贝尔的单一神话出现在他的著作《千面英雄》中。关于《时空之子》最初计划的“悲剧结局”的信息来自对故事策划师加藤正（Masato Kato）的采访。由
    `Cal Hampton` 翻译的英文版托管在 `Chrono Compendium` 上。此书的第一版误地将`克罗诺`的计划归于游戏总监堀井悠（Yuji
    Horii），而不是故事策划师加藤正。`Patrick Holleman` 对《时空之子》的笔记见在他 2012 年的书籍《逆向设计：时空之子》中，可在 gamedesignforum.com
    购买。


    ## 直的？白人的？男性的？


    Tanner Hig 在《无种族幻想：大型在线角色扮演游戏中种族的消失》（Games and Culture 4:1, 2009 年 1 月）中探讨了托尔金（Tolkien）和刘易斯（Lewis）的欧洲神话构建。岩内光一（Iwabuchi
    Koichi）在他 2002 年的书籍《重新中心全球化：流行文化与日本跨国主义》中讨论了“无国性”（mukokuseki）。三崎哲（Tetsu Misaki）在他
    2011 年由彩流社（Sairyūsha）出版的日语书籍《龙珠漫画》（Doragon Bōru no Mangaku）中讨论了波波人和《龙珠 Z》。川谷美希（Miki
    Tanikawa）在 2013 年 6 月 16 日的纽约时报文章《日本的“科学女性”寻求身份》中讨论了“科学女孩”的刻板印象。Evan Lauteria
    对性规范性和沉默主角的见解出现在他的论文《主机机与电脑游戏中的性欲与性取向》中，该论文最初于 2006 年的游戏研究会议“视频游戏与异类/他者”。James
    Valentine 在 1997 年的合集《言辞奇特：语言、性别与性取向》中讨论了“欧卡玛”（okama）。


    ## 钢铁与纯粹逻辑


    Eric Yosomono 对日语中逮捕过程的描述可以在他的博客 `Gaijinass` 2011 年 1 月 2 日的一篇题为“关于日本逮捕的 7 个残酷现实”的文章中找到。Michael
    Fisch 在《日本礼拜堂婚礼的兴：模拟与表演》（Japanese Journal of Religious Studies 28:1-2, 2001）中描述了日本的基督教风格婚礼。


    ## 洛沃斯之日


    NHK（日本放送）的《难忘的火光：原子弹幸存者绘制的作品》由 Wildwood House 于 1981 年出版。它是 1975 年出版的日语书籍《Gōka
    o Mita : Shimin no Te de Genbaku no E》的英文译本。

