    Christopher Steiner’s “border zone” of localization appears in the chapter “Rights
    of Passage: On the Liminal Identity of Art in the Border Zone” in the 2001 book
    `The Empire of Things: Regimes of Value and Material Culture`. Ted (Thomas Edward)
    Woolsey’s 1991 master’s thesis at the University of Washington is called `The
    Rumbling of Modernism: Writers and the Great Kantô Earthquake of 1923`. I interviewed
    both Woolsey and Tom Slattery via email in late 2013.


    ## Life by the Book


    Here’s a chronological list of the `Chrono Trigger` strategy guides (both Japanese
    and English) that I was able to consult:


    - `Kurono Torigā Kōryaku Daitokushū (Shūeisha, April 15, 1995) [V-Jump special
    issue]`

    - `Chrono Trigger: Super Famicom (Shūeisha, April 25, 1995)`

    - `Chrono Trigger: The Perfect (Shūeisha, June 1995)`

    - `Chrono Trigger Instruction Booklet (Squaresoft, August 1995) [issued with cartridge]`

    - `Chrono Trigger: Player’s Guide (Nintendo of America, October 1995)`

    - `Chrono Trigger: The Complete (Shūeisha, 1999)`

    - `Final Fantasy Chronicles Official Strategy Guide: Chrono Trigger and Final
    Fantasy IV (BradyGames, 2001)`

    - `Chrono Trigger: Perfect Bible (Shūeisha, 2008)`

    - `Chrono Trigger: Ultimania (Square Enix, 2009)`


    ## The End of Time


    Yūji Horii revealed his basic premise of time travel in `Chrono Trigger` in an
    interview with `Play Online`, currently archived at the Internet Archive (`http://bit.ly/1g2nomC`).
    Masato Katō reminisced on development difficulties in a November 1999 interview
    with `Chrono Trigger` composer Yasunori Mitsuda. The Japanese version can be found
    on Mitsuda’s homepage `Our Millennial Fair` (`http://bit.ly/1bPYyUs`); the English
    version is archived at the Internet Archive (`http://bit.ly/1Xogfmt`).


    ## The Fated Hour


    The collected nu/kilwala comics by Hiroshi Izawa and Akihiro Kikuchi were published
    as `Jikū Bōken Nuumamonjā` in 1998 by Shūeisha. The anime version was officially
    released in a compilation `VHS V Janpu V Fesu ‘96 Bideo`, also published by Shūeisha
    in 1996. Unofficial copies may be found on YouTube.


    # Acknowledgments


    First and foremost, many thanks to my family, and especially to my mom, Bet. Not
    just for always standing up for me, but also for standing in lines to buy me video
    games. To my husband Jayden Yamakaze, for becoming my permanent Player Two, and
    for always staying in co-op mode even when I throw down the controller in anger.
    To my friends who have supported me—particular shoutouts are owed to Brennan O’Rear,
    who introduced me to the evolving doctrine of cautious optimism, and to Aunim
    Hossain, a party member from a previous adventure who shared his love of RPGs
    with me. Deep gratitude to and admiration for both Ted Woolsey and Tom Slattery,
    for bringing `Chrono Trigger` to generations of North Americans and for their
    direct contributions to this book. To Gabe Durham for his constant editorial help
    and for taking a chance on me, and to Ken Baumann, for his encouragement and delightfully
    irreverent book design. To Maxwell McGee for his industry connections, and to
    Patrick Holleman for his game design expertise and enthusiastic input. To early
    readers James Davis, James Jacobo-Mandryk, Danielle McCormick, Ryan Plummer, and
    Wade Thiel, for their fact-checking and eagle-eyed copy editing. To Adam Robinson,
    for his pristine page design and last minute fixes, and to Christopher Moyer,
    for making this second printing look better than ever. There is not enough space
    to gives thanks to all those who deserve it, but if you’re reading these words
    then you are among them.


    # Special Thanks


    For making our first season of books possible, Boss Fight Books would like to
    thank Andrew Thivyanathan, Carolyn Kazemi, Cathy Durham, Ken Durham, Maxwell Neely-Cohen,
    Jack Brounstein, Andres Chirino, Adam J. Tarantino, Ronald Irwin, Rachel Mei,
    Raoul Fesquet, Gaelan D’costa, Nicolas-Loic Fortin, Tore Simonsen, Anthony McDonald,
    Ricky Steelman, Daniel Joseph Lisi, Ann Loyd, Warren G. Hanes, Ethan Storeng,
    Tristan Powell, and Joe Murray.


    # ALSO FROM BOSS FIGHT BOOKS


    1. `EarthBound` by Ken Baumann

    2. `Chrono Trigger` by Michael P. Williams

    3. `ZZT` by Anna Anthropy

    4. `Galaga` by Michael Kimball

    5. `Jagged Alliance 2` by Darius Kazemi

    6. `Super Mario Bros. 2` by Jon Irwin

    7. `Bible Adventures` by Gabe Durham

    8. `Baldur’s Gate II` by Matt Bell

    9. `Metal Gear Solid` by Ashly & Anthony Burch

    10. `Shadow of the Colossus` by Nick Suttner

    11. `Spelunky` by Derek Yu

    12. `World of Warcraft` by Daniel Lisi


    ★ Continue? The Boss Fight Books Anthology

