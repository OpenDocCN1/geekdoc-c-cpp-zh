  trans: '


    随 `Chrono Trigger` 附带的手书只带我们走了很一段路，让我们停在了击败了游戏第一个真正的 Boss `Yakra` 之后。这份指南以一份《Chrono
    Trigger 玩家指南》的广告结束，其零售价为优惠的 `$14.95`。只需拨打 `1-800-255-3700` 即可预订！今天，那个 800 电话仍然拨向
    `Nintendo`，但我确信《Chrono Trigger 玩家指南》在多年前就绝版了。


    本玩家指南由 `Nintendo` 于 1995 年 10 月发布，在游戏于北美首发几个月后。封面上誉为“关于过去、现在和未来的完整指南——直接来自天堂专业人士之手”，这本大格式指南实际上留下了许多未尽之处。与日本色彩斑纷的早期策略指南不同，《Chrono
    Trigger 玩家指南》基本上是一份非常务实的文档。它没有带插图的怪物生物图录，没有赠送漫画，没有采访，也没有邮寄抽奖活动。随后由 `BradyGames`
    出版的、为了配合 `PlayStation` 版本发布的非官方指南，感觉更像是一份技术报告，而非游戏伴侣。


    `DS` 版本在北美的发布，尽管有崭新的翻译和新功能，似乎并没有需要一份新的指南。这是否意味着在一个日益增长、拥有强大的攻略、常见问题解答和 YouTube
    速通的数字世界里，纸质策略指南正变得愈发无关紧要？尽管 `BradyGames` 和竞争对手 `Prima Games` 仍在出版书籍，但这些书看起来越来越“豪华”——像是制造的收藏品，与其说是实际的游戏辅助工具，不如说是纪念品。也许这就是书籍的大的大趋势。书籍不再是文化存储和传输的主要手段，它们可能会成为艺术品，作为博物馆藏品的价值超过了其作为信息载体的物理新奇性。我自己也不得不使用数字替代品来研究本章探讨的某些作品。


    是的，我只能翻阅我第一个指向 `Chrono Trigger` 的直接书目链接的扫描页面，以重新熟悉那种我 1990 年代的自我也认为如此迷人的深度休闲读物。我注意到那份手册的封面上有些东西——嗯，是
    PDF 扫描文件的最后一页。“Square Soft 客户服务/游戏咨询。”24 小时自动服务，周一至周五 9 点到 5 点提供人工服务。


    我从未拨打过 `206-861-0303`。在这里位于另一个海岸的 `215` 区号，那是一个长途电话，我无法在家庭电话明细账单上隐藏它。今天，我冒着风险，希望这个号码会带给我一个厌倦了被怀旧的
    Square 粉丝恶作剧的愤怒居民。电话响了。


    嘟吧哔！


    这个号码——我想和 `游戏咨询部门`一样——已经不再使用。


    ## 早期灵感


    在我用铅笔勾勒 `Chrono Trigger` 中不按比例的漫画角色之前，我还在画视频游戏的东西。我的《人体解剖学》是一系列 `Nintendo` 游戏手册——《洛克人人》、《塞尔达传说》、《超级马里欧兄弟
    2》。这些小册是我随手涂鸦灵感和参考的无源泉，也满足了我列清单、分类和编目录的强迫症欲望。难怪我最后在图书馆工作。


    这些纤薄小册子里最迷人且数量最多的住户是怪物和反派。多年来，我收集了各种类型的生物图录——像 `Edward Lear` 和 `Dr.Seuss` 这样的新神秘生物学家编写的幽默且押韵的字母表，还有直接来自
    `Wizards of the Coast` 的怪物汇编，这些自 1997 年以来一直让地下城充满龙的沿海文学家。所有这些来源都说了同一件事——怪物无处不在，以下是你需要知道。


    ## 战斗的本质


    `Chrono Trigger` 的怪物通常偏向可爱风。其中许多看起来看起来完全可以和任何完全不是宝可梦的鸟山风格的《勇者斗恶》怪物一起玩。与《勇者斗恶》系列中可爱的反派或《最终幻想》游戏中的高幻想敌人不同，《Chrono
    Trigger` 的怪物不会凭空从以太中产生随机相遇。只要我们观察得足够仔细，通常可以在前面看到它们。有时它们会埋伏击，让我们措手不及。或者它们可能会漫无目的地在周围游，直到我们进入它们的视野。有些怪物进入战斗的动作几乎是经过排练的，旋转着进入并发出战斗号。`Chrono
    Trigger` 集成的地图和战斗屏幕界面强调了生活的冷酷真相——危险就在你面前，有时你无法逃避。


    然而，当我们战斗时，我们是瘫痪的。当敌人在战斗屏幕上移动时，我们被困在原地。与精神前身《魔界圣传说》不同，Chrono Trigger` 不允许我们在战场上移动。我们只能站着战斗，或者在恐惧中逃跑。


    所以我们刷级（grind）。因为如果我们跳过太多的战斗，早晚会被措手不及并击死。我们学习新的技巧和魔法，每隔几级就会发现新的潜能。但这种单方面的方法忽略了那位军事战略家圣者孙子的实用建议：知己知彼。我们既没有快速查询的
    `宝梦图`，也没有《最终幻想》宇宙中方便的 `Peep` 或 `Libra` 法术来即时获取敌人的属性和弱点。如果我们没有这些，我们最好的只有 `Sight
    Scope`（视野），可以让我们看到敌人的生命值。但这个装备是以牺牲另一个属性加成配件为代价的。因为它很大程度上强迫我们以团队形式战斗。


    `Chrono Trigger` 大多强迫我们作为一个团队进入战斗。由于我们并肩作战，最好的选择涉及协作。双击和三连击通常比让队伍进行个人攻击更有效。而且我们应该合作，因为敌人也在这样做！65,000,000
    BC 的带翅膀的猴子捡起蘑菇状的 `shists` 并投向小队。在 12,000 BC 的海洋宫深处，独眼巨人 `scouts` 和它们的红蓝亲戚会联手发动强大的影子攻击。由于敌人也对我们使用基础的双击和三连击，我们必须以火攻火。嗯，可能是水。


    无论我们准备得有多充分，无论我们的队伍有多强大，我们仍然可能被砍首。有些怪物的攻击在任何级别都是致命的。被尼亚尔伪装者 `Dalton` 及其他的魔像信徒青睐的
    `Iron Orb`（铁球）攻击一次就能减半队伍成员的生命值。当野外遇到 `nu` 时，我们必须警惕能将角色生命值降至 `1` 的撞击。即使我们能够击败对手，他们可能还有一个最后的反击，等待着将我们潜在的惨胜利变成痛苦的失败。敌人的攻击对我们辛苦获得的经验完全不在意，这揭示了一个残酷的教训——无论你生活中的地位多高，都可能跌入谷底。


    对于十三岁的我来说，在没有策略指南的情况下玩 `Chrono Trigger` 既兴奋又令恐惧。但我成年后的第一次重玩这个游戏变成了一场闭书之的事。主要是因为我不再有《Chrono
    Trigger 玩家指南》的实体了，除了 PDF。如果我没有在 `Mt. Woe` 上找到那个 `Magic Tab` 又怎样？如果我忘记了字面上的诱惑 Ozziezie
    并没有获得他的稀有裤子又怎样？学会放弃完美，拥不确定性和自发性，对我来说是一个困难的成长过程。我从一个按规矩办事的男孩到一个制定自己规则的男人的转变远未完成。


    '
- fmt: '

    Many of our contemporaries crave strategy guides for their lives. I see commuters
    on the subway reading well-highlighted Christian devotionals. And when their pages
    are completely soaked through with yellow, new books will replace them. On the
    secular side, `The Seven Habits of Highly Effective People` has been superseded
    by `The 8th Habit: From Effectiveness to Greatness`. And souls of every race,
    creed, color, occupation, and age group can rest assured that if they don’t have
    the book version of a bowl of chicken soup, one will be out of the kitchen soon
    enough to soothe them.


    We can find help for our problems in books, but we cannot become slaves to their
    words. We need to live our lives, not imagine how they could be if only we had
    the `The Power of Positive Thinking`, or some hidden ancient `Secret` to making
    our dreams come true. We need to do something. We only have so many years to live,
    and there just isn’t enough time.


    # The End of Time


    Even though I’ve been writing about a game whose raison d’être is time travel,
    it’s taken me a long time to get around to discussing it.


    `Chrono Trigger` was certainly not the first video game to employ time travel.
    It wasn’t even the first Square RPG to do so by far. The first `Final Fantasy`
    features a red-haired fighter and friends eventually unsealing a magical “time
    gate” to defeat a nefarious villain lurking in the past, and `Final Fantasy Legend
    III` explores the power of time-machine-powered travel to prevent disaster in
    past, present, and future eras. `Chrono Trigger` ups the ante by using time travel
    to flirt with genres as disparate as prehistoric fiction, medieval fantasy, and
    post-apocalyptic sci-fi. `Chrono Trigger`’s immediate Square predecessor, `Live
    A Live`, presages such genre-bending by featuring not only a caveman hero and
    a futuristic robot, but also other representatives of genre fiction: a knight,
    a ninja, and a cowboy. The game even has a villain called `Maō`, which some of
    you might recognize as the Japanese name for `Magus`.


    `Chrono Trigger` combines the successes of both `Final Fantasy Legend III` and
    `Live A Live`, making time travel both integral to the story and historically
    comprehensive. Time travel seems so deeply enmeshed in the plot that it’s difficult
    to imagine the game without it. Blasphemous as it may sound, however, I believe
    that `Chrono Trigger` doesn’t actually need time travel to be a successful game.


    Hey.


    I’m glad you picked this book back up after hurtling it across the room. Or maybe
    you just restarted your tablet after an indignant shutdown. What the fuck is this
    guy saying, that `Chrono Trigger` doesn’t need time travel? The word “chrono”
    is in the title! Bear with me as I rephrase just slightly the plot summary I provided
    many chapters ago.


    `Crono`, a teenage boy from a small town, his techno-savvy gal pal `Lucca`, and
    princess-in-disguise `Marle` end up opening a hole in the universe—a gate. Discovering
    the link between their own world and others, the trio travels through different
    worlds assembling a party of allies: the knight-errant-turned-frog, `Frog`; stalwart
    robot `Robo`; rough-and-tumble cavewoman `Ayla`; and finally `Magus`, a dark sorcerer
    with mysterious allegiances. Learning that their worlds—that all life itself!—will
    be destroyed by `Lavos`, a sinister force from beyond, the septet travel onward,
    gathering clues and materials, meeting supporters, and battling foes to prepare
    themselves for that final, decisive battle for the future.


    There’s no need for time travel to make this story happen. But, what about the
    disappearance of `Queen Leene` erasing `Marle` out of existence, for instance?
    Surely that plot point couldn’t work here! I think it could. Let’s imagine a multiverse
    a little like that of `The Legend of Zelda: A Link to the Past`. In this `Zelda`
    title—and many of its successors—two parallel worlds coexist. The `Light World`
    and the `Dark World` bear many similarities to each other in structure, and many
    locations have corresponding alternate versions in each universe. As `Link`, we
    warp between the worlds, solving puzzles that exploit the dichotomous nature of
    reality. Would it be preposterous to suggest that characters across universes
    could be affected by events in a world parallel—or even quasi-perpendicular—to
    their own? Of course that game just wouldn’t be `Chrono Trigger`.


    Time travel in `Chrono Trigger` is a messy affair. `Lucca` introduces us to its
    mechanics in `600 AD`, shortly after `Marle` winks out of existence to “somewhere
    cold, dark… and lonely.”


    Delighted with her unintentional impersonation of `Queen Leene`, `Marle` gladly
    enjoys the comforts of a royal lifestyle where she is no longer treated as a ward
    of the king, but a queen in her own right. Let’s ignore the creepy realization
    that at some point `King Guardia XXI` might try to have sex with his teenaged
    distant descendant. Meanwhile, the search for the real `Leene` is called off,
    since `Marle` is a dead ringer for her. `Leene`—along with the `600 AD Chancellor`—never
    gets rescued, and is killed by `Yakra` and his minions. Maybe they ritually sacrifice
    her to the idol of `Magus` deep within the cathedral. Maybe they do much worse
    to her. She’s a lot prettier than a naga-ette, after all. But to save `Marle`
    from this variation of the `Grandfather Paradox`, we must preserve `Leene`’s place
    in the timestream. Sounds easy, right?


    Not really.


    If we do not rescue `Leene`, then `Marle` ceases to exist. If `Marle` had never
    been born, `Crono` would not have met her at the `Millennial Fair`, and `Lucca`’s
    teleporter wouldn’t have malfunctioned and created a time gate. But perhaps in
    this alternate timeline, there is no `Guardia`. In `600 AD`, the `Mystics` led
    by `Ozzie` take advantage of the confusion following `Leene`’s death, and push
    through the lines of defense at `Zenan Bridge`. Without `Crono` and company to
    battle them, `Ozzie`’s undead minions easily conquer `Guardia`. `Banta` and his
    young wife are slain—there will be no `Taban`, and no `Lucca`. No `Millennial
    Fair` to celebrate a thousand years of monarchy, and no `Marle` to have given
    him reason to in the first place.


    But, wait. `Leene` only dies because `Marle`’s appearance causes the palace to
    call off the search. So in order for `Leene` to die, `Marle` must exist. But when
    `Leene` dies, `Marle` can’t exist. If you’ll allow the admixture, we’re trapped
    in a sort of `Schrödinger’s catch-22` here, where both `Marle` and `Leene` must
    be both alive and dead to make this scenario work.


    The events of `Secret of Mana` reveal another fact. Damming a river downstream
    won’t cause water upstream to vanish. The current will weaken, the water will
    ebb, and the river will dry up. So, does time struggle upstream to keep up with
    changes closer to its source? This temporal quirk sounds like it might help explain
    the apparent subparox of having `Leene` alive while `Marle` has vanished, but
    in fact it proves the opposite. If `Marle` had continued to play queen in `600
    AD`, `Leene` would have been killed, her remains left in an unmarked grave. `Marle`
    would have acted the part of `Leene` for a while longer, as time caught up with
    itself before finally disintegrating `Marle` from the timeline.

