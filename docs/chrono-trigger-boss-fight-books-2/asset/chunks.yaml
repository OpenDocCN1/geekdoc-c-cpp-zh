  trans: '


    与此同时，通胀在《时空之子》（Chrono Trigger）的时间线中根本并不存在。药水的价格从 `65,000,000 BC` 一到 `2300 AD`
    一直保持在 `10G`。而且这两个时代的人都不理解“G”作为货币的含义。在史前时代，大多数有意义的贸易是通过羽毛和花瓣等物品的物物实现的，你甚至能获得一些免费赠品，比如具有治愈作用“甜水”。尽管如此，我们的小队仍然可以用黄金购买药水等基础物品，或者像洞穴人所说的那样，“闪光的石头”。在遥远的未来，药水依然可以买到。商人们怀疑地接受了黄金作为现金——“你管这叫钱？”——但不禁让人疑惑，末日世界能维持什么样的经济模式。虽然商人可能是前现代日本社会地位最低的阶层——排在武士、农民和工匠之后——但他们是古今以来经济活动最直观的证据。


    ### 职业与叙事

    当然，其他职业也支持我们的叙事和游戏性。客栈为我们的小队提供疗伤空间，而更大的酒店服务业雇佣了许多其他酒保和侍者来经营酒吧，那里流传着最精彩、最能推进任务的八卦。在休止之地（Truce）和波尔雷（Porre）之间日益增长的运输业暗示着一种新产业。军事职业是公元一千年后半叶的流行选择——在
    `600 AD`，当加迪亚（Guardia）面对魔王（Magus）的军队时，至少有 39 名骑士和士兵；即使在和平的 `1000 AD`，加迪亚也有 22
    名现役军人员。尽管这些职业中（尤其是军事职业）倾向于吸引男性，但女性仍有职业道路。即使在神职人员中也是。


    ### 卫迪亚大教堂

    对于一个拥有如此显眼的巨大崇拜建筑的国家来说，加迪亚几乎没有宗教信仰。当我们击败了 `600 AD` 教堂里的四位假修女后，很少看到可见的人在积极参与宗教生活，而且他们大多数是女修女。那么，为什么要建造这样一座巨大的类基督教大教堂呢？它花费的
    `G` 足以让最贪婪的商人也引金退休了？


    答案在于那个非官方的结局，在那里，青蛙（Frog）和莉妮王后（Queen Leene）在 `600 AD` 结了婚。随着演职员名单，这对人物沿着过道向前。一个穿着泽亚尔（Zealish）服饰的男人在祭坛后等待主持仪式。虽然教堂的后部可能是加迪亚皇室的秘密避难所，或者是神父和修女的住所，但前方的礼拜堂纯粹用于仪式。加迪亚第二十一世（Guardia
    XXI）的葬礼可能在这里举行过，因为在这个备选结局中，莉妮可以自由再婚。除非中世纪加迪亚的幼体多妻制是完全可以接受的。


    ### 现实平行：圣安花园

    回到我们的世界，在福岛市（Fukushima City）中心向西几英里处坐着圣安花园（St. Anna’s Garden），这是一个风景如画的旅游胜地，拥有道贯微酿酒厂（Michinoku
    microbrewery）、一家冰淇淋店和丰富的古董淘宝机会。在我度过几次完全异性恋式的“男人间约会”的这个小购物村的入口，有一座装饰着彩色玻璃窗的单廊道小教堂。与《时空之子》教堂中那个带翅膀形象的模糊的基督教形象不同，圣安教堂（St.
    Anna’s Church）展示了一幅耶稣被钉十字、复活并回到门徒面前的三联画。然而，访问圣安教堂的大多数并不向圣母玛利亚的母亲安 娜祈祷，也不向基督本人祈祷。日本大约只有
    1% 的人信仰基督教，圣安教堂甚至不提供定期的宗教服务。但它确实举办大量的婚礼。


    ### 日本的婚礼

    从历史上看，日本最流行的婚礼形式是神道（Shintō），作为日本的国教，它自然地垄断了婚姻市场。直到 20 世纪 80 代，神道式婚礼占了所有仪式的 90%
    以上。我有机会在 2005 年参加了一场神道婚礼，对我来说几乎无法理解。话虽如此，它是用古日语举行的，而且我当时被仪式酒灌醉了。


    这场婚礼由于两个主要原因而是一个异常。首先，新郎是一个白人外国人，新娘是住在福岛的日本居民，他们两人都不太听懂仪式语言。其次，到 2005 年，基督教式婚礼早已成为新婚夫妇的选择，尽管像所有进口产品一样，它会被赋予一些独特的日本特色。正如社会人类学家迈克尔·菲希尔（Michael
    Fisch）指出的，日本基督教式婚礼的主持者甚至不需要受过会的牧师。他们只需要雇佣演员——特别是白人男性——让他们外表和打扮符合身份。菲希尔作为一个自述的犹太人和以色列-美国双重公民，甚至担任过雇佣牧师来研究基督教式婚礼的现象。


    ### 备选结局

    所以，在我们的小队第一次访问 `600 AD` 之后的某个备选结局中，一位神父或也许是一个穿着传统服装的演员——到那时这种服装已经过时了一万三千年——在一座模糊供奉某种天使生物的教堂里举行了青蛙和莉妮的婚礼。大教堂唯一的已知访客是
    `600 AD` 的宰，他当然是伪装的雅卡拉（Yakra）。也许是组织宗教与怪物的联系已经足够普遍，让公民们放弃了教堂。到 `1000 AD`，这座建筑已从地图上消失，被加迪亚森林（Guardia
    Forest）吞噬。


    我们在 `600 AD` 进入大教堂的旅程发现，我们面对的是一个魔王的偶像，怪物们将他奉为神。四百年后的美迪纳村（Medina village），这座雕像依然存在，信徒们仍为其吟歌唱。当我们的小队在
    `600 AD` 击败魔王并将他抛回自己的家乡时代后，怪物世界的领导权被他的大头目奥兹（Ozzie）夺取。美迪纳人不再崇拜魔王的雕像，而是崇拜奥兹的塑像。当我们最后一次在
    `600 AD` 击败奥兹后，第二尊雕像也消失了，只留下一个装饰过的广场。通过一个接一个地移除这些假神，我们完成了野蛮化的进程。干得好，浅肤帝国主义者们！


    ### 结论

    然而，消除组织宗教并不是我们支线任务的全部内涵。在《时空之子》完成所有任务的理想时间线上，宗教——或者说宗教的概念——仍然有一席之地。当小队完成了让菲娜森林（Fiona’s
    Forest）成长的任务后，`600 AD` 环保主义者菲娜的旧址被一座神庙所取代。在里面，修女们为再次坏掉的机器人（Robo）身体祈祷，我们指示它帮助重新造林。


    这个世界运行很快，但我们感觉不到行星的运动，绕着轴心旋转，绕着太阳晃动。我们只通过昼夜的交替、季节的轮回来观察它们。世界移动非常缓慢，我们无法经历大陆的微妙漂移，从旧土地中产生新的陆地。我们只通过化石记录和拼图地图来推测这些变化。


