  trans: '

    这场审判是对时间旅行中最神圣的原则之一的简短提醒——你在过去所做的一切都会影响你的未来。只是现在，我们没有机会重温千年博览会的事件并选择成为一个模范的观众了。我们是否不小心吃掉了那份被无人看管的便餐？判罪吧。我们是否没有帮助那个小女孩找到她的猫？判罪。虽然偷窃食物可能被视为根深蒂固的恶行，但缺乏善心纯粹是不公平的。博览会上没有其他人帮助这个女孩找到她该死的猫，但突然就要归罪于克洛（Crono）？这场审判是一场骗局。凭借对任何实际不当行为的微弱证据以及对作剧的渴望，控方宰官试图暗杀克洛的名誉，以希望最终能彻底毁掉他本人。


    我们并不孤单。由于克洛没有多少话语，律师皮埃尔（Pierre）将代表我们发言。皮埃尔的形象在许多城镇中作为商人出现的正是同一个。他可能有点像骗子——“嘿……看起来他们上当了，”他在审判中推了推克洛——但他站在我们这一边，而且我们免费请到了他。随着证人相继出来为支持或反对克洛作证，我们可以选择对宰官挑探且带有陷阱的问题给出二选一的回答。“到底是谁开始这一切的乱象？”他质问着克洛。我们可以从两个同样致命的回答中选择其一。“我做的”似乎是认罪，而“是玛露（Marle）做的”似乎是对皇室的冒犯。宰官在指控中夹杂着“恐怖分子”等带有引导色彩的词汇，确实很懂得煽动群众。


    当控辩双方都陈述完毕后，陪审员们摇摇晃晃地走进法庭中心。他们的判决不需要意见一致，但粗心的玩家很容易获得七张有罪票。随着票数的统计，陪审员们向右移动代表无罪，向左移动代表有罪。抱歉，左撇子们。观众对这些投票的反应是模糊的——超级天堂卡带很少产生真实的人声——但每一声“有罪”似乎都引起了口哨和欢呼，而每一声“无罪”则引起了一阵抱怨的嘘声。这群人想要血。


    而他们真的可能得逞，因为如果克洛被判定有罪，法官将在经过三天的禁闭后判处他死刑。即使陪审员一致判定克洛无罪，他仍然不是无辜。法官还是会判处克洛禁闭三天，仅仅是因为他带着玛露跑了。而且如果法官做出了有利于我们的判决，宰官将无视法律安排克洛处刑。“文件可能只是在系统里延迟了！”他对典员坚持道。


    在我去日本之前，收到的最严重的警告之一就是不要被捕。我本打算这样做。但有时我觉得自己正危险地接近那些可能是罪犯的人。传闻说，我常去的一家当地朋克酒吧的所有者因持有大麻被捕，导致他们突然关门。在日本，大麻和海因一样属于犯罪。我认识一些人，无论是当地人还是外籍，偶尔会抽抽烟。我被被带走审问吓坏了胆，所以避之不及。


    就像在卫固（Guardia）一样，在日本，举证责任在于你而不是国家。博主埃里克·约索莫诺（Eric Yosomono）描绘了在日本被捕的惨惨景象——残酷的审讯、一个在各个层面都旨在定罪的系统、令人沮丧且贬低人格的监狱环境。我们可以在克洛逃狱期间详细探索卫固的监狱，发现可怕的酷刑器具，甚至发现一个被遗留在断头台等待执行的囚犯。这个年轻人弗里茨（Fritz）后来解释说他在没有审判的情况下被捕了。但他一定做错了什么。“毕竟，”约索莫诺在描述自己的经历时写道，“除非有罪，否则怎么可能被捕，对吧？”


    当克洛被带进塔监禁时，国王限制了玛露。“即使是皇室也必须遵守规则，”他提醒心烦意乱的女儿，既怪她导致了这场悲剧的发生，也试图从整件事中抽身。


    他的话将会反噬他。当队伍在公元 600 年找回神话中巨大的彩虹壳（Rainbow Shell）时，他们将宝物留在卫固城堡以确保安全。画面回到现在，这个壳——或者说，它的消失——突然变成了“世纪审判”的核心证据。虽然游戏在这一点的文本变得有些草率，但我们得知卫固国王
    XXX 世本人不仅被指控偷了这件无价的家宝，还将其当押换了钱。我们的破案小组正在调查。在从城堡宝库中找到彩虹壳存在的证据后，队伍冲破彩色玻璃窗进入法庭，为国王平反，并揭开了虚假宰官的真面目——雅拉十三世（Yakra
    XIII），他为了报祖先之死制造了混乱。


    揭露雅拉十三世的欺诈应该让我们消除之前对守护者法律系统及其宰官机构定罪弗里茨、克洛以及最后的国王本人等无辜者的任何误解。系统本身没问题，对吧？只是腐败导致了如此致命的失灵。但在一个讽刺的结局中，这一切作剧的始作者雅拉十三世没有受到审判——他被队伍当场处决。无论是断头台还是武刀，在钢铁冰冷的逻辑面前，没什么可论的。


    •


    或者说是金币。


    和大多数传统 RPG 一样，黄金在《时空轨迹》中是一种极其实用的商品——它在所有文化和时代都有价值，无论它是否被立即认可为货币。连怪物也承认携带现金的用处。像一群武装精良的霸凌者一样打败它们并夺走黄金，显然是那里收益最高的职业。


    仅次于此赚钱生意是商业贸易，它存在于所有时代。当然，商人必须从某处获取货物。人们需要酿药水、建造避难所、锻造铁剑和缝制皮甲。更不用说那些物品了！如果经验丰富的战士克洛和玛露无法装备火器，那么我们确实不能指望大多数平民使用它们。而且有多少机器人需要新的战斗肢？供需关系对经济似乎毫无意义，因为很少有人武装了武器，而商店里储备了无限数量的武器。更困惑的是，随着队伍的旅行，物品变得越来越奢华、昂贵。虽然这完全符合合理的游戏机制，但也将“技术进步”的概念抛到了窗外。

    '
- fmt: '

    Meanwhile, inflation simply does not exist in the timeline of `Chrono Trigger`.
    The price of tonic remains `10G` from `65,000,000 BC` all the way to `2300 AD`.
    And neither of these eras understands what “G`” means as a currency. In prehistory,
    most meaningful trade is accomplished through bartering objects like feathers
    and flower petals, and you’ll even get a few freebies like the healing “sweet
    water.” Our party can nevertheless purchase basic items like tonics for gold,
    or as the cavefolk call it, “shiny stone.” Far in the future, tonics are still
    available. The merchants dubiously accept gold as cash—“You call this money?”—but
    one wonders what type of economy the post-apocalypse can support. While the merchants
    may have been the lowest social class in pre-modern Japan—ranking fourth below
    samurai, farmers, and craftsmen—they are the most visible evidence of economic
    activity throughout the ages.


    ### Professions and Narrative

    Other professions of course support our narrative and gameplay. Innkeepers provide
    spaces to heal our party, and the greater hospitality industry employs many other
    barkeeps and servers to run the pubs, where some of the juiciest, quest-advancingest
    gossip circulates. The growing transportation industry between `Truce` and `Porre`
    hints at a new kind of industry. Careers in the military are a popular choice
    in the latter half of the first millennium AD—there are at least 39 knights and
    soldiers in `600 AD`, when `Guardia` faced `Magus`’s forces, and 22 active military
    personnel in `Guardia` even in the peaceful `1000 AD`. And while many of these
    occupations, especially the military, tend to attract men, there are still career
    paths for women. Even in the clergy.


    ### The Cathedral of Guardia

    For a country with such a conspicuously large building for worship, there is little
    religion in `Guardia`. Once we’ve defeated the four false nuns in the cathedral
    in `600 AD`, there are few visible people actively engaged in religious life,
    and most of them are women of the cloth. So why this massive Christian-like cathedral,
    which surely cost enough `G` to make even the gougiest merchant retire from sales?


    The answer lies in that non-canonical ending where `Frog` and `Queen Leene` tie
    the knot in `600 AD`. As the credits roll, the duo advances up the aisle. A man
    dressed in `Zealish` garb waits behind the altar to officiate the ceremony. While
    the back end of the cathedral may be a secret refuge for `Guardia` royalty, or
    perhaps the quarters of the priests and nuns, the chapel at the front is purely
    for ceremony. It is likely that the funeral of `Guardia XXI` was held here, since
    in this alternate ending `Leene` is free to marry again. Unless polywog polygamy
    is totally cool in medieval `Guardia`.


    ### Real World Parallel: St. Anna’s Garden

    Back in our world, and many miles west from the center of `Fukushima City`, lies
    `St. Anna’s Garden`, a picturesque tourism spot that features the `Michinoku microbrewery`,
    an ice cream shop, and ample opportunities for antiquing. At the entrance to this
    little shopping village where I spent several totally heterosexual man-dates is
    a single-aisled chapel adorned with stained glass windows. Unlike the vaguely
    Christian image of the winged figure in `Chrono Trigger`’s cathedral, `St. Anna’s
    Church` displays a triptych of `Jesus` crucified, resurrected, and returned to
    his disciples. Most who visit `St. Anna’s Church`, however, do not pray to `Anna`,
    mother of the `Virgin Mary`, or to `Christ` himself. With roughly only 1% of Japanese
    professing Christianity, `St. Anna’s Church` doesn’t even offer regular church
    services. But it does perform weddings galore.


    ### Weddings in Japan

    Historically, the most popular form of wedding in Japan was `Shintō`, which as
    the state religion of Japan naturally monopolized the marriage industry. Even
    up to the 1980s, `Shintō`-style weddings accounted for more than 90% of all ceremonies.
    I had the chance to attend a `Shintō` wedding in `2005`, and it was almost unintelligible
    to me. Then again, it was conducted in archaic Japanese, and I was drunk on ritual
    sake.


    This wedding was an anomaly for two major reasons. First, the groom was a white
    foreigner and the bride a Japanese resident of `Fukushima`, neither of whom could
    understand the ceremonial language much either. Second, by `2005` the Christian-style
    wedding had long been the choice for marrying couples, though like all imports
    it would be given some uniquely Japanese flavors. As social anthropologist `Michael
    Fisch` notes, the officiants of Christian-style weddings in Japan don’t even need
    to be ordained ministers. They can simply be hired actors—especially white males—who
    look and dress the part. `Fisch`, a self-described Jew and dual Israeli-American
    citizen, even worked as a hired priest to study the phenomenon of Christian-style
    weddings.


    ### The Alternate Ending

    So in this alternate ending sometime after our party first visits `600 AD`, a
    priest or perhaps an actor bedecked in a traditional costume—close to thirteen
    millennia out of fashion by this point—celebrates the marriage of `Frog` and `Leene`
    in a church vaguely dedicated to some sort of angelic being. The only known visitor
    to cathedral is the `600 AD Chancellor`, who is of course `Yakra` in disguise.
    Perhaps the association of organized religion with monsters was prevalent enough
    for citizens to abandon the cathedral. By `1000 AD` the building has vanished
    from the map, having been swallowed by the `Guardia Forest`.


    Our journey into the cathedral in `600 AD` finds us face to face with an idol
    of `Magus`, whom the monsters worship as a god on earth. Four hundred years later
    in `Medina` village, this statue has survived, and adherents still sing songs
    to their fiendlord. After our party defeats `Magus` in `600 AD` and he is hurled
    backward through time to his home era, the leadership of monsterdom has been usurped
    by his henchchief `Ozzie`. The Medinans no longer offer praise to the statue of
    `Magus`, but rather to the graven image of `Ozzie`. After we trounce `Ozzie` in
    `600 AD` for the final time, this second statue vanishes, leaving nothing but
    anorned agora. By removing these false gods one after the other, we complete the
    process of civilizing the savage. Way to go, light-skinned imperialists!


    ### Conclusion

    The elimination of organized religion, however, is not the full subtext of our
    sidequests. In the ideal, all-quests-cleared timeline of `Chrono Trigger`, religion—or
    at least the idea of religion—still has its place. When the party completes the
    quest to make `Fiona’s Forest` grow, the former site of conservationist `Fiona`’s
    home in `600 AD` has been replaced with a shrine. Inside, nuns offer prayers to
    the once again broken-down body of `Robo`, whom we instruct to help reforest the
    land.


    This world moves fast, but we do not feel the motions of our planet, rotating
    on its axis, wobbling its way around the Sun. We observe them only through the
    passing of day into night, from season begetting new season. The world moves slow,
    and we do not experience the subtle drifts of continents, the creation of new
    land masses from the old. We guess these changes only through fossil records and
    jigsaw cartography.

