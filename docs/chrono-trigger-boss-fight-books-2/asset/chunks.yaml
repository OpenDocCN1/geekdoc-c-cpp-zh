    在后续版本中，伴随该场景的全动态视频（FMV）展示了阴沉天空下草丛在风中奔腾。这种意象与我对“青蛙之主题”的体验完美契合。战鼓声催促向前前进，甜美而孤独的木管乐器暗示着胜利与悲剧。英雄站在风暴将至的茂盛高地上，整装待发，斗篷在狂风中飘扬，长剑出鞘而出！这是征征之路的音乐。


    尽管他的半水生形态是其魅力的一半，但我们最终可以选择将 `Frog` 从诅咒中解救——这是一个我们将暂时推迟的艰难选择。作为一种两栖动物，`Frog` 的自然属性是水。这也是一种实用的游戏设计选择。`Frog`
    的舌舔技能 `Slurp` 虽然初次体验可能很恶心，但在 `Marle` 从时间线中消失后，它迅速取代了她至关的水属性治疗术。既是强力输出又是照顾者，`Frog`
    是我最常用的角色之一。


    ### Robo

    延续并仁慈地结束了这一系列过于显而易见的名字，是 `Robo`。提示：他是一个机器人。被传送到 `2300 AD` 的黑暗未来，我们的小队发现了破旧不堪的他。在一个让我想起
    1985 年诡异电影《回到奥兹》的场景中，`Lucca` 修好了这个机械人，他带着礼貌的惊讶迎接了她。如果我当时的预见或角色空间允许 `Lucca` 改名为“多萝西娅”，那么
    `Robo` 就会是一个非常完美的“提克托克”。


    我们很后才会得知 `Robo` 有着悲剧性的背景，但他最初是作为 `Lucca` 欲望的对象。正如 `Marle` 痴迷于诱捕 `Crono`，以及 `Frog`
    渴望成为 `Cyrus`（在异性恋的视角下体现为保护 `Queen Leene` 的愿望）一样，`Lucca` 需要一个可以寄托她激情的人。她作为 `Robo`
    的复活者（如果你真的想用的话，那就是复活女神）与 `Robo` 建立了直接的物理连接，并很快成为了他的定期维护人员。


    `Robo` 揭了他的序列号为 `R-66Y`，但我们将发现他的真名 `Prometheus`。在希腊神话的一个讽刺性转折中，火属性的 `Lucca` 为
    `Robo` 带来了生命的火花。尽管缺乏生殖器官，`Robo` 被暗示为男性。他显然并不排斥别人用阳性代词称呼他。由于《Chrono Trigger》中的浪漫也适用于机器人，`Robo`
    也有他自己可能是女性的恋爱对象 `Atropos XR`。在希腊神话中——你真的应该在玩之前做做功课！——`Atropos` 是“三女神”之一，她们通过纺线、测量和剪断分配给每个凡人的生命线来控制人类的命运。`Atropos`
    有幸成为最后的剪刀者，而 `Chrono Trigger` 中的 `Atropos XR` 尽管有着可爱的粉色涂装和精致的小丝带，同样是人类终结的执行者。


    `Robo` 对话中的一些幽默源于他承认无法完全理解人类情感——这一事实显然是假的。像流行文化中许多其他受爱的机器人一样，`Robo` 知道什么是爱。如果我们费心完成终局支线任务，`Robo`
    必须战斗并摧毁被重新编程的 `Atropos XR`，让他在世界上只剩下 `Lucca`Alone。然而，当我们击败 `Lavos` 并纠正时间线后，我们将看到
    `Atropos XR` 和 `Robo` 成为幸福的一对。


    在同一个支线任务中，我们得知在崩溃之前，`Robo`曾被超级计算机 `Mother Brain` 送去研究人类及其弱点。`Square` 在其他作品中有效地运用了“队伍成员是背叛者”这一桥段，但在《Chrono
    Trigger》中，这条信息出现得太晚了，没有任何实际意义。与其说给了 `Robo` 任何额外的深度，揭开的潜在背叛剧情反而提醒了我们，`Robo` 的故事线本可以再打磨一下。


    ### Ayla

    常规名单中的最后一个是穴穴女 `Ayla`，从任何意义上说都是“过去的产物”。和 `Robo` 一样，`Ayla` 没有属性倾向。作为一个史前派对女孩，她沉迷于肉体。她吃、喝、睡、拼命战斗。她可能在其他事情上也很拼命，但这最好留给玩家的想象力。


    第一次见到她时，小队对她无法理解时间旅行的概念感到无奈。在这里，金头发的 `Ayla` 可能会危险地接近“笨金发女”的刻板印象。尽管她是我们队伍中最有理智的人。她有一个稳定的伴侣，她是她部落的首领，最终她将成为所有早期人类的领袖。在战斗中即使对敌人也高尚，`Ayla`
    总是选择勇气而非恐惧。她也极其务实：“Ayla 活着就战斗！赢则活。败则死。生存法则。不改规则。”强大的 `Ayla` 和她顺从的男朋友 `Kino` 将建立最终成为
    `Guardia` 王室血脉的血统。尽管这一事实在结尾才变得明显，但 `Marle` 在故事的大部分时间里和她的祖母并肩战斗。


    我们可以只用这五个角色完成游戏——或者用六个，如果我们真的在乎那个话多的 `Crono` 的话。然而，敏锐的玩家会注意到菜单队伍窗口中有一个空位。足以容纳第七个角色。


    ### Magus

    作为隐藏角色来说，`Magus` 简直是近在天尺。我的意思是，就在你的视野范围内。


    北美最初版超级机紫色版附带的说明书中没有提到 `Magus` 是一个潜在的可玩角色。同样，早期的轻剧级日语指南《Kurono Torigā Kōryaku
    Daitokushū》——如果你想感受一下日语直译成英语有多别扭的话，那就是《Chrono Trigger Strategy Big Special》——也没有将
    `Magus` 包含在初始阵容中。'
