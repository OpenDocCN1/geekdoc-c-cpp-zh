    ## TS: 我想到的只有几个技术挑战。之一是 PlayStation 版本中重用的动画过场包含了无法修改的嵌入文本叠加，这意味着在 DS 版本中，它们所引用的任何台词或术语——例如名为
    `Masamune`（正宗）的剑——都无法更改。另一点是，重用的消息和替换变量阻碍了我让 `Robo` 听起来更像机器人的尝试。他的性格刻画在英语中没有日语版中那么明显，我曾尝试使用
    `ALL CAPS`（全大写）来让它更接近原意，因为原版在动词结尾处使用片假名，以明确他说话时听起来像个机器人。但事实证明这是是不可能的，一方面是因为他与其他角色共享一些共同台词，另一方面是因为没有办法对插入对话的变量字符串（如队伍成员的名字）强制大写。不过，这也许是最好的。**我猜如果那样的话可能会有点过头，而且我最终也会放弃这个想法。**


    时间绝对是最大的限制因素。`Chrono Trigger DS` 是我在 `Square Enix` 工作过的游戏中进度最紧凑的之一。在正常项目中，我预计每天要翻译大约
    `2000` 到 `2500` 个日文字符；但对于 `Chrono Trigger`，我需要处理大约 `5000` 到 `6000` 字。这意味着我必须集中在我认为最能从关注的领域，并放弃其他一些事情。没有时间去研究富有创意的历史语言模式或对对话进行反复修改；我必须利用工具箱中已有的工具来工作。


    审查完全不是问题。我从未被要求为了分级或其他任何原因而更改翻译的任何方面。我运用了一些译者的常识——软化了一些更显露骨的暗示性台词以及对酒精的直接引用，希望这些处理能避开孩子的视线——但这更多是一个文化适配的问题，而不是审查问题。日本和美国对于儿童何种行为合不合适的文化观点存在巨大差异。


    ## MPW: 你们的翻译/编辑支持团队是怎样的？


    TS: 英语部分基本上是一个单人作战。我有一个编辑，但在该项目中他实际上只负责文字校对——检查错别字之类的工作。不过，确实有一些出色的本地化协调员在幕后提供帮助。他们用不同的队伍组合玩了游戏的几乎每一个环节，并进行了录制，以便我检查语境并确保翻译后的台词流顺。考虑到时间紧迫，如果没有他们，我简直就像在盲目飞行。游戏的非线性本质，加上自由的队伍组建以及只有在特定角色出现时才会发生的序列，会让检查所有内容变得不可能的。


    ## MPW: 你认为原版 SNES 版本的目标受众与 DS 版本不同吗？


    TS: 绝对不同。但原版的粉丝（到那时已经很老了）是 DS 版本目标受众的一大群体，这从怀旧风格的“早安，Crono！”营销活动中可以得到证明。说到这里，我真希望有人早点告诉我那个活动会举行。如果我早知道游戏的网站会是
    `goodmorningcrono.com` 的话，我就不会改那句台词了！


    ## MPW: 你认为原始翻译中有哪些细节让你觉得过时了？


    TS: 字符限制绝对是本地化中最过时的方面。诸如“汤”和“狂喝汽水大赛”之类的内容中的显性审查是另一个。除此之外，对我来说感到过时的主要问题是说话模式和性格刻画普遍缺乏一致性。它远超当时的大多数其他
    SNES 游戏，考虑到原版本地化的时间限制，这令人印象深刻，但那之后标准已经提高了。


    ## MPW: 如果你是《时空之子》的首位译者而不是 Woolsey，你会做什么不同的尝试？


    TS: 我会做的最大不同点是在日文名称不起作用时创造原创名称，而不是引入对现实世界流行文化、历史和基督教神话的引用。我可能会把 `Masamune` 这把剑保留为原版日语中的
    `Grandleon`（大格里昂）。如果时间允许，我可能还会尝试寻找一种独特的说话风格，将 `12,000 BC` 与 `600 AD` 区分开。总而言之，我并没有太多可以做的不同。


    *


    然而，无论 Woolsey 还是 Slattery 做出了什么选择，都有粉丝对这些选择表示不同。粉丝网站 `Chrono Compendium` 托管了《时空之子重译项目》，该项目由用户
    `KWhazit` 于 `2007` 年 3 月完成。这个新翻译坚定忠实于原版日语，比 Slattery 的翻译发布早了一年半，因此不包含 DS 版本中发布的新对话。


    这里付出的努力是惊人的，其结果也引人入胜。浏览 Woolsey、原版日语和新直译的对比台词，可以看到原内容为了空间被删减了多少，以及 Woolsey 重塑文本做了多少。但也存在某些文本，无论对日语多么忠实，听起来都像洋式英语（Engrish）。根据
    `KWhazit` 的说法，Truce 市长屋里一位热心的女性问道：“我应该给你讲解一下你在战斗中受的伤害吗？”Woolsey 只是让她问道：“想了解战斗中的伤害吗？”12


    截至 2011 年，玩家可以在 Apple 的 iOS 和 Android 系统上以日语、英语、法语、意大利语、德语、西班牙语、中文或韩语体验《Chrono
    Trigger》。有了这些“官方”翻译，我们对《时空之子》有了更多多元的视角，取决于我们玩的是哪个版本的游戏，几件事可以同时成立。再加上半续作 `Radical
    Dreamers` 的扩展剧情以及官方大众市场续作 `Chrono Cross`，需要连接起来的线索比任何一个玩家能处理的都要多。


    幸运的是，《时空之子》的成功培养了几代粉丝，他们致力于探索和重新探索游戏，并热情地讨论理论。但更务实地说，许多这些《时空之子》专家为《时空之子》的核心元素提供了帮助——精通玩法。


    2013 年重玩《时空之子》对我来说很容易。网上有大量的文本 FAQ 和 YouTube 游戏视频，所以当我忘记如何击败魔像或在哪里找到 `Black Rock`（黑岩）时，很快就能得到帮助。但在
    1995 年，在没有可靠互联网连接和 Google 时代之前，当我陷入困境时，资源非常匮乏。通常我唯一的顾问是游戏附带的短小且有时不准确的说明书。但对于《时空之子》和少数其他游戏，我有一件秘密武器——一系列攻略指南。


    '
