    I love the tactile thrill of pages thrumming my thumb as I flip through a slick
    paperback, the textured tickle of an unjacketed clothbound hardcover. Even that
    smell of old library books, the acidified paper and mouldering paste intermingling
    into a bouquet of pungent wisdom. From my early days hunting through the mildewy
    basement of my great-grandfather’s old print shop for loose ornithology plates,
    to present-day rummages through disorganized thrift store shelves, I have spent
    a lot of time looking for books. Collecting volumes of a series, placing them
    side by side, seeing a body of knowledge grow—a book-lover can easily become obsessed.


    ### The Obsession with Strategy Guides


    Of the many series of books I’ve collected and organized over my literate years,
    some of the most impactful and fascinating have been the `Nintendo Player’s Guide`
    series. I read walkthroughs like they were novellas and I became an expert on
    games I’d never even play. Digests like the `NES Game Atlas` begat omnibuses like
    `Mario Mania`, paving the way to expansive one-shot strategy guides for individual
    games. `Chrono Trigger Player’s Guide` entranced me with the official manga artwork
    of `Akira Toriyama` and the quaint 3D maps of `Gentarō Araki`. Along with the
    official in-box manuals, these player’s guides became not only companions to my
    gameplay, but also fuel for my imagination. Somewhere in my archive of collected
    drawings and writings dating back to my kindergarten days is a hand-drawn picture
    of `Chrono Trigger’s Janus`, dated `1998\.`. Years after finishing games, I would
    keep coming back to their guides for more. These books were scriptures. And like
    any serious acolyte, I had trouble ignoring the insistent dicta of strategy guides.


    The term “strategy guide” is a convenient misnomer, especially in the case of
    role-playing games. RPG strategy guides usually contain a mix of character dossiers,
    walkthroughs, cartographies, spellbooks, item manifests, and—my favorite!—bestiaries.
    Poor placement of these elements can easily turn a companion volume into a book
    of spoilers. Of course, overeager readers can spoil their own experience by peeking
    too far ahead.


    ### The Boy Scout Gamer


    Me, I was a boy scout gamer. I was always prepared for the challenges ahead. I
    kept an open guide handy when I needed directions in an expansive dungeon crawl.
    I didn’t want to miss anything. I wanted to collect every single item, whether
    unique relic or mundane tonic. I just couldn’t abide the idea of flying blind.
    Of an incomplete performance. My game scout sash had a special merit badge for
    rampant cheating. Although I was a straight-A student who never cheated in school,
    I felt no compunction about using cheat cartridges like the `Game Genie`. I rarely
    called upon this powerful djinn until after I had completed the game “fairly,”
    or had failed miserably to do so. Just like in school, I wanted the sense of completion
    that came from hard work, even if it meant hours of homework—grinding for hours
    for level-ups and gold. With some irony, I regret not having devoted the same
    level of effort to improving my own physical fitness and economic situation in
    real life.


    ### The Cost of Cheating


    Most of the `Game Genie` codes readily available for players of `Chrono Trigger`
    were less visual novelties than they were in-game steroids. So, rather than hacking
    the game to replace `Gato’s` sprite with `racebot Johnny’s`, or to open up unused
    maps for exploration, you could begin the game with maximum stats and all techs
    learned, obviating the need for grinding. Or, you could activate the “one-hit
    kill” code, and win every battle instantly no matter who strikes first. Apply
    the “walk through walls” code, and now you are an invincible demigod unfettered
    by the limits of space. This last code is a great way to break the game—take a
    transoceanic stroll and enter an area earmarked for much later in the game, and
    you find yourself hurtled forward in the game’s progress, unable to complete objectives
    now required for further adventuring. Congratulations, cheater. You fucked up.


    I learned these lessons the hard way in my most recent playthroughs of `Chrono
    Trigger`. The second time I ventured through the game as an adult, I had specific
    objectives in mind. One of the most arduous goals I had set for myself was the
    tedious, maddening, and ultimately imperfect quest to count every single human
    character in the game. I needed shortcuts, and I had the means to take them.


    ### Ethics of the Playing Field


    We humans often operate as if we’re on a level playing field where everyone has
    the same opportunities for professional, romantic, economic, and physical success—an
    assumption that’s as comforting as it is false. No matter what weapons `Marle`
    holds or how high she levels up, she will never be as physically strong as `Crono`.
    And no matter how hard he trains or begs magic master `Spekkio`, `Crono` can never
    learn the healing spells that `Marle’s` natural talents. So why not give our characters
    the best we can, and max up their levels and stats so high that the game displays
    them as “★★”? Is it unethical to speed up the game to make our level 1 nobodies
    into star-studded superheroes?


    Just to complicate things, I suggest that the very premise of `Chrono Trigger`—hacking
    the timestream to achieve our desires—is cheating.


    •


    ### The Chronarchy


    No matter what altruism supports our monkeying with history, we arrogantly assume
    the duties and privileges of a chronarchy, deriving our authority from the blessings
    of three doddering gurus who have lost touch with everyday NPCs. Granted, many
    of our objectives are arguably for the greater good, even if they cause collateral
    damage. Our goal to defeat `Lavos` saves humankind and much of organic life, though
    it is at the expense of `Lavos’s` children and perhaps much of the potential inorganic—that
    is, robotic—life in `2300 AD`. Our quest to achieve `Fiona’s` green dream of a
    forested south continent ignores the delicate ecosystem of the desert that supports
    sandermannish `mohavors` and crustaceanlike `hexapods`. Sure, these things are
    living creatures, but they’re also monsters. So we judge our activities to be
    good—as corrections to the sake of humankind.

