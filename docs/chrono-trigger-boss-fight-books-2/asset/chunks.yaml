  raw: 'Remember that this Marle/Leene episode is our first taste of how time should
    operate in Chrono Trigger, and it’s already a bit of a trainwreck. So it actually
    works in our favor that the rest of the game is not slavish to the infernal, niggling
    logic of causality.


    For starters, ignoring paradoxes allows us to make changes to the timeline in
    the first place, raising the stakes for adventure without bogging Chrono Trigger
    down with complexities. It also sets up interesting puzzles, some of which flagrantly
    defy the Grandfather Paradox. Like those sealed chests in the Middle Ages and
    in the present. We shouldn’t open those boxes in 600 AD, because we’ll forfeit
    the chance in 1000 AD to get powered-up versions of the items they contain. But
    if we unlock those same chests in the present, we can travel back to 600 AD, snag
    the contents, and effectively get two for the price of one. The universe does
    not implode if we grab both the Nova Armor in the Northern Ruins in 600 AD and
    its powered-up version, the Moon Armor, in 1000 AD. We can cheat the system a
    bit without any temporal repercussions.


    Analyzing the ins and outs—more often than not, the highs and lows—of the time
    travel utilized in Chrono Trigger, is an exercise riddled with frustration, headaches,
    and overexplanations. In short, it is the height of nerdish joy.


    The easiest answer to these logical inconsistencies is a simple one—Chrono Trigger
    is a game designed by committee. While the lead producers shared mutual enthusiasm,
    they also contributed their own individual inputs that did not necessarily match
    up to their colleagues’. Their staff, however, was forced to make everything work,
    even if it wasn’t compatible with other content. Game supervisor Yūji Horii, for
    example, sketched out a basic plot in which “a character would travel to the past,
    make some actions, and that would change the current or future situation of the
    character.” Meanwhile producer Hironobu Sakaguchi designed monsters and characters
    like Gato struggling for inclusion. Even Akira Toriyama’s concept art needed to
    be worked into the game. That iconic Toriyama image of Crono battling in the snow
    with Frog and Marle at his side, for example, wasn’t even implemented until late
    in Chrono Trigger’s production, when programmers found a place in the story for
    Death Peak.[14](#ChronoTriggerMoyer-12.xhtml_footnote-014) Worse, this image is
    simply wrong. Marle uses water magic, not fire. And this image was the box art—the
    very first thing players saw! Toriyama admitted that he was supposed to have drawn
    an ice sword, but it was too difficult for him so he substituted flame instead.
    Story planner Masato Katō, who wrote the entire Kingdom of Zeal scenario, recalled
    later that developing Chrono Trigger “wasn’t exactly ‘smooth sailing,’ and a lot
    of the parts ended up being changed in the end.”[15](#ChronoTriggerMoyer-12.xhtml_footnote-013)
    Despite all of Katō’s additions and editing, he was not included as an honorary
    Dream Teamer.


    For those looking for in-game solutions to time travel problems, the folks at
    Chrono Compendium have compiled many excellent theories on the whys and why-nots
    of time mechanics in Chrono Trigger, and even introduced some of their expanded
    mechanics in their unofficial interquel to Chrono Trigger and Chrono Cross, a
    fangame called Crimson Echoes. One such intriguing theory is something they call
    Time Traveler’s Immunity.


    •


    While we can conveniently ignore time travel paradoxes, we can’t ignore how our
    actions in time seem to affect others without affecting us. Well, except for that
    whole Marle thing. Anyway, except for that whole Marle thing which is supposed
    to explain how time travel in Chrono Trigger works, time travel in Chrono Trigger
    might actually work by bestowing immunity to the effects of time travel upon those
    who travel through time. Except for Marle that one time.


    The most heartbreaking example involving immunity is Lucca’s chance to prevent
    Lara from injury in 590 AD. Assuming Lucca does rescue her mother, Lara will have
    lived her life perfectly ambulatory, probably forgetting how close to paralysis
    she had come. But Lucca will always remember that she had changed her past so
    profoundly. Does Lucca then have the unique experience of having been raised by
    both disabled and enabled versions of Lara? Or does she only remember the paraplegic
    mother who sat alone by the window upstairs? Either way, this is a difficult position
    for Lucca. If she remembers both childhoods at once, she may experience trauma
    or even madness from her conflicting but equally real memories. On the other hand,
    if she doesn’t acquire memories of Lara as an able-bodied mother, then not only
    is she cheated out of the very childhood she thought she was saving, but her memories
    are now incompatible with those of her loved ones. The only authentic memories
    she can share with Lara and Taban are those events that occurred before Lara’s
    potential accident. Our PCs—and by extension, anyone else who has time-traveled—are
    not just skipping around on the greater timeline, but now also following their
    own personal timelines.


    As our party travels backward and forward through time, their bodies do not simply
    stop aging. Traveling back in time does not obliterate them into their formative
    molecules, and traveling to the future does not turn them into the dust they’ll
    one day become. Our party actively ages as they complete their adventure, though
    this probably only takes a week or so. We are gone for a brief period one afternoon,
    the first day of the Millennial Fair. When we return, probably some hours later,
    Crono is arrested, and if we choose to serve our sentence until Lucca arrives
    to save him, he is jailed for three days. After he breaks out, he and the party
    travel here and there through the timeline. We spend at least one drunken—er,
    soup-bloated?—night in 65,000,000 BC, and another in Frog’s burrow after giving
    him the repaired Masamune. Later, after a rough battle with Magus, we wake up
    once again in prehistory. After Crono dies, we awaken in the Last Village of 12,000
    BC. Finally, when we complete the sidequest to save Fiona’s forest, we spend one
    fateful night in the woods, where Lucca gets her chance for a do-over. We end
    the game on the last night of the Millennial Fair for the Moonlight Parade. This
    gives us a bare minimum of six to eight days to complete our adventure. Damn,
    we can really hoof it! I did ignore those frequent visits to the inn—a player
    who likes clean sheets might return his party home months older than when they
    started. And if we task Robo with reforesting the land, he will have aged an extra
    400 years.


    Now, let’s complicate this further.


    The gates we travel through—and eventually the chronometer embedded in the Epoch—become
    fixed not to unchanging points in time, but rather to a specific active timeline.
    When we first return through the gate from 600 AD back to 1000 AD, for example,
    we don’t return at the exact point we had left. Enough time has passed to alert
    the royal guards that something odd had happened to Marle, and Crono is arrested
    almost immediately. And the next time we use that gate from 600 AD to 1000 AD,
    the events of that farce of a trial have not been forgotten. All of the actions
    we take in each era remain constantly in effect. Without this fluidity, there
    would be no adventure at all—just a series of constantly unraveling plans, an
    endless and unplayable video game version of Groundhog Day.'
