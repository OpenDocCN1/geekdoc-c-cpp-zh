- fmt: '

    ## TS: Only a couple of technical challenges come to mind. One was that the recycled
    anime cutscenes from the PlayStation version contained baked-in text overlays
    that couldn’t be altered, meaning that any of the lines or terms they referenced—like
    the name of the sword `Masamune`—couldn’t be changed in the DS release. Another
    was that recycled messages and substitution variables thwarted my attempt at making
    `Robo` sound more robotic. His characterization comes across less distinct in
    English than it does in Japanese, and I had explored using `ALL CAPS` as a way
    to bring it a little closer to the original, which uses katakana script on the
    verb endings to make it clear he sounds like a robot when he talks. That proved
    impossible, though, both because he shared some common lines with other characters
    and because there was no way to force capitalization on the variable strings that
    were inserted into dialogue, such as the names of party members. That was probably
    for the best, though. I IMAGINE IT WOULD HAVE BEEN A BIT OVER THE TOP AND I WOULD
    HAVE ABANDONED THE IDEA ANYWAY.


    Time was definitely the biggest limiting factor. `Chrono Trigger DS` had the tightest
    schedule of any game I worked on at `Square Enix`. On a normal project, I’d be
    expected to translate somewhere around `2000` to `2500` Japanese characters per
    day; for `Chrono Trigger`, I needed to get through more like `5000` to `6000`.
    That meant I had to focus on the areas I felt would benefit the most from the
    attention, and let some other things go. There was no time for researching creative
    historical speech patterns or iterating on dialogue; I had to work with the tools
    already in my toolbox.


    Censorship wasn’t an issue at all. I was never asked to change any aspect of the
    translation for ratings or any other reason. I used some common sense as a translator—softening
    some of the more overtly suggestive lines and outright references to alcohol in
    a way that would hopefully go over the heads of children—but that was more of
    a culturalization issue than one of censorship. Japanese and American cultural
    views on what is appropriate and inappropriate for children vary fairly drastically.


    ## MPW: What was your translation/editorial support team like?


    TS: It was basically a one-man operation for English. I had an editor, but really
    only serving in a copyediting capacity on this project—catching typos and whatnot.
    There were, however, some fantastic localization coordinators working behind the
    scenes to help. They played through virtually every sequence of the game with
    different party combinations and recorded them so I’d be able to check context
    and make sure the lines flowed correctly as translated. Given the tight schedule,
    I would have been flying blind without that. The nonlinear nature of the game,
    combined with free party formation and sequences that only occur when certain
    characters are present, would have made it impossible to check everything.


    ## MPW: Do you think the target audience of the original SNES release differed
    from that of the DS version?


    TS: Absolutely. But fans of the original version—much older by that time—were
    a major segment of the target audience for the DS version, as evidenced by the
    nostalgic “Good morning, Crono!” marketing campaign. Speaking of which, I wish
    someone had told me that campaign was going to happen. I wouldn’t have changed
    the line in question if I’d known the game’s website was going to be `goodmorningcrono.com`!


    ## MPW: Were there any details from the original translation that felt out of
    date?


    TS: The character limits were far and away the most outdated aspect of the localization.
    The overt censorship in things like “soup” and the “soda-guzzling contest” was
    another. Otherwise, the main thing that felt dated to me was the general lack
    of consistency in speech patterns and characterizations. It was miles beyond most
    other SNES games, and impressive given the time constraints of the original localization,
    but the bar has been raised since then.


    ## MPW: If you had been the first translator of Chrono Trigger instead of Woolsey,
    what would you have done differently?


    TS: The biggest thing I would have done differently would have been coining original
    names where the Japanese ones didn’t work rather than introducing real-world references
    to pop culture, history, and Christian myth. I probably would have kept the sword
    `Masamune` named `Grandleon` as it was in the original Japanese. I might have
    tried to find a distinctive style of speech to distinguish `12,000 BC` from `600
    AD` as well, time permitting. All in all, though, there isn’t that much I would
    have done differently.


    *


    No matter what choices either Woolsey or Slattery made, however, there are fans
    who disagree with those choices. The fansite `Chrono Compendium` hosts the `Chrono
    Trigger Retranslation Project`, completed in March `2007` by user `KWhazit`. This
    new translation, staunchly faithful to the original Japanese, predates the release
    of Slattery’s translation by more than a year and a half, and consequently does
    not include the new dialogue issued with the DS version.


    The effort expended here is phenomenal, and its results are fascinating. Browsing
    the comparative lines of Woolsey, the original Japanese, and the new direct translation
    shows how much of the original had to be trimmed for space, and how much Woolsey
    reshaped the text. But there are also instances of text that sound like Engrish,
    no matter how faithful they are to the Japanese. “Shall I lecture about the damage
    you take during combat?” asks a helpful woman in the Mayor’s house in Truce, according
    to `KWhazit`. Woolsey simply has her ask, “Want to learn about damage in battle?”[12](#ChronoTriggerMoyer-10.xhtml_footnote-011)


    As of 2011, players can experience `Chrono Trigger` on Apple’s iOS and Android
    systems, in Japanese, English,[13](#ChronoTriggerMoyer-10.xhtml_footnote-010)
    French, Italian, German, Spanish, Chinese, or Korean. With this multiplicity of
    “official” translations, we are given even more of a multicanical perspective
    on `Chrono Trigger` where several things can be true at the same time, depending
    on which version of the game we’ve played. Add in the expanded storylines of semisequel
    `Radical Dreamers` and official mass-market sequel `Chrono Cross`, and there are
    more threads to tie together than any one player can handle.


    Luckily, the success of Chrono Trigger has spawned multiple generations of fans
    who have endeavored to explore and re-explore the games and discuss their theories
    with passion. But more practically, many of these Chrono experts provide help
    with a core element of `Chrono Trigger`—mastering the gameplay.


    Replaying `Chrono Trigger` in 2013 was easy for me. Numerous text FAQs and YouTube
    playthroughs of the game exist, so I wasn’t long without help when I had forgotten
    how to defeat a golem or where to find the `Black Rock`. But back in 1995, before
    I had reliable internet access and before the age of Google, there were precious
    few resources when I was stuck at an impasse. Often my only advisors were the
    teasingly small and occasionally inaccurate instruction manuals packaged with
    games. But for `Chrono Trigger` and a select few other titles, I had a secret
    weapon—a library of strategy guides.


    * * *


    [11](#ChronoTriggerMoyer-10.xhtml_footnote-012-backlink) Slattery’s joke reads:
    “Everybody says Daddy’s magnanimous, but he says he’s just big-boned.”


    [12](#ChronoTriggerMoyer-10.xhtml_footnote-011-backlink) “戦闘中に受けるダメージについてレクチャーしましょうか？”


    [13](#ChronoTriggerMoyer-10.xhtml_footnote-010-backlink) The Slattery translation,
    with slightly modified instructional dialogue to account for a touchscreen, rather
    than a controller.

