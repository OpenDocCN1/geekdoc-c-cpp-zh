    The trial serves as a brief reminder of one of the most hallowed tenets of time
    travel—what you do in the past affects your future. Except now we don’t have the
    luxury of reliving the events of the Millennial Fair and choosing to become the
    model fairgoer. Did we accidentally eat that packed lunch sitting unattended?
    Strike against us. Did we not help that little girl find her cat? Strike. While
    food theft might be considered indicative of deep-seated evil, a lack of samaritanism
    is just plain unfair. No one else at the fair helped this girl find her goddamn
    cat, but suddenly Crono is to blame? This trial is a sham. With paltry evidence
    of any real wrongdoing and a desire for mischief, the prosecuting Chancellor attempts
    to assassinate Crono’s character in the hopes of eventually assassinating the
    rest of him.


    We’re not alone in this. Since Crono doesn’t have much of a voice, Pierre the
    lawyer will speak for us. Pierre’s sprite is the same one that appears as a merchant
    in many towns. He might be a bit of a shyster—“Whew… Looks like they’re buying
    it,” he nudges Crono mid-trial—but he’s on our side and we get him pro bono. As
    witnesses come forward to testify for or against Crono, we have the option of
    giving binary answers to the Chancellor’s probing and tricky questions. “Who actually
    started this whole mess?” he grills Crono. We can choose one of two equally damning
    replies. “I did” seems to be an admission of guilt, while “Marle did” seems to
    be an affront to the royal family. Peppering his accusations with loaded words
    like “terrorist,” the Chancellor sure knows how to rouse the rabble.


    When both prosecution and defense rest, the jury members hobble into the center
    of the courtroom. Their verdict need not be unanimous, but the careless player
    can easily get seven votes for guilty. As the votes are tallied, the jurors move
    to the right for innocent, and to left for guilty. Sorry, southpaws. The spectators’
    reactions to these votes are ambiguous—Super Nintendo cartridges rarely produced
    faithful human vocalizations—but each “guilty” seems to elicit a whistling, cheering
    sound, and each “not guilty” a grumbling boo. This crowd is out for blood.


    And blood they just might get, because if Crono is found guilty, the judge will
    sentence him to death after a three-day period of solitary confinement. Even if
    the jury finds Crono unanimously not guilty, he’s still not innocent. The judge
    will sentence Crono to three days of solitary anyway, simply for having run off
    with Marle. And if the judge rules in our favor, the Chancellor will ignore the
    law and schedule Crono for execution. “The paperwork’s probably just been held
    up in the system!” he insists to the warden.


    One of the gravest warnings I had received before I went to Japan was don’t get
    arrested. I intended not to. But I felt at times dangerously close to people who
    might be criminals. Rumors circulated that proprietors of a local punk bar I frequented
    were arrested for marijuana possession when their business abruptly shut down.
    Weed is as criminalized as heroin in Japan. And I knew of some people, both native
    Japanese and expats, who enjoyed a smoke now and then. I was scared shitless of
    being hauled in for questioning, so I steered clear.


    Just as in Guardia, in Japan the burden of proof is on you, not the state. Blogger
    Eric Yosomono paints a terrible picture of being arrested in Japan—of brutal interrogations,
    of a system designed at all levels to convict you, of depressing and demeaning
    prison conditions. We can explore the Guardia jail at length during Crono’s breakout,
    finding awful instruments of torture and even a prisoner left waiting in a guillotine.
    This young man, Fritz, later explains that he was arrested without trial. But
    surely he must have done something wrong. “After all,” Yosomono writes of his
    experience, “how could anyone ever get arrested unless they were guilty, right?”


    As Crono is taken away to the tower for imprisonment, the King restrains Marle.
    “Even royalty must obey rules,” he reminds his distraught daughter, both blaming
    her for the events that led to this ugly episode as well as washing his hands
    of the entire affair.


    His words will come back to haunt him. When the party recovers the mythical and
    gargantuan Rainbow Shell in 600 AD, they leave the treasure at Guardia Castle
    for safekeeping. Flashing forward to the present, the shell—rather, its disappearance—has
    suddenly become the central piece of evidence in “the trial of the century.” While
    the text at this point in the game gets a little slapdash, we learn that King
    Guardia XXXIII himself has been accused of not only stealing the priceless heirloom,
    but also pawning it for cash. Our mystery-solving party is on the case. After
    retrieving evidence of the shell’s existence in the castle’s treasury, the party
    bursts into the courtroom through the stained glass window to exonerate the king
    and to unmask the false Chancellor as Yakra XIII, who has created havoc to avenge
    his ancestor’s death.


    Exposing Yakra XIII’s fraud should allow us to clear any misconceptions we had
    held about the Guardian legal system and its chancery for convicting innocents
    like Fritz, Crono, and finally the king himself. The system was fine, right? It
    was just corruption that caused it to malfunction so lethally. But in an ironic
    conclusion, the instigator of all of this mischief, Yakra XIII, gets no trial—he
    is executed on the spot by the party. Whether guillotine or katana, there is little
    argument against the cold logic of steel.


    •


    Or gold, for that matter.


    As in most traditional RPGs, gold is an enormously useful commodity in Chrono
    Trigger—one that has value across all cultures and eras, whether or not it is
    immediately recognized as money. Even monsters recognize the utility of carrying
    cash. Beating them up and taking their gold like a bunch of well-armed bullies
    is apparently the highest earning occupation out there.


    Second only to this as a money-making enterprise is the mercantile industry, present
    in all time periods. Of course, merchants must acquire their goods from somewhere.
    People need to brew tonics, construct shelters, forge iron swords, and sew leather
    cuirasses. Not to mention those specialty items! If seasoned warriors Crono and
    Marle can’t equip firearms, then we certainly can’t expect most common folk to
    wield them. And how many robots out there need new battle-limbs? Supply and demand
    must mean nothing to the economy, since few people seem to be armed with weapons
    while the shops stock infinite numbers of them. More confusingly, items grow ever
    more luxurious and expensive as our party journeys onward. While this falls firmly
    in step with sound game mechanics, it also throws the concept of technological
    progress out the window.

