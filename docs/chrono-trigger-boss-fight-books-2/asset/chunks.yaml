  trans: "\n显而易见人们对 Crono 的生活投入了感情，比如他的母亲和闺蜜 Lu 卡。镇上的人似乎都认识他。偶尔如此。这怎么可能不认识呢？他是转角处那个红头发、菠萝头、挥剑的小子。很难想象一个这样的人会被遗忘的世界，尤其是当《时空之子》中绝大多数角色都是如此地平庸可替时。\n\
    \n尽管格调出众，但 Crono 并没有一个非常鲜明的性格。我们知道 Crono 会与人交谈，但我们并没有听到——好吧，准确是读到——他到底对他们说了什么。我们这些玩家理上应该是\
    \ Crono 背后的存在，按下 `A` 键作为我们对话的开启。除了偶尔有机会通过二选一来推进对话，我们能做的只是告诉 Crono 往哪里移动以及如何战斗。\
    \ \n\n事实上，当我们获得机会以 Crono 的身份“说话”时，那些选项甚至没有被放在引号里。我们并不是在真正指示 Crono 原封逐字的话，而是他想表达的意思。这些选择甚至没有深刻地推进叙事。我们可以反复重复一个“错误”的回答，直到我们最终选择了游戏认可的答案，或者在两个仅影响即时反应而没有深远影响的选项中做出选择。与其说让我们认同\
    \ Crono 这个角色，不如说我们的对话选择往往提醒了我们，我们说的话其实没那么重要。那么，我们真的在乎 Crono 吗？\n\n事实证明，我们在乎。\n\
    \n我成长在一个原子家庭里，而这个家庭缓慢而稳定地发生了裂变。当我真正意识到自己和周围环境时，我的父亲已经在家外工作很长时间了，偶尔在周末回来。这些周末变得越来越少，直到几乎消失，因为他为了我们家寻找更好的机会而越走越远。波士顿。杰克斯斯维尔。瓜达拉哈拉。马拉波。深圳。\n\
    \n我的母亲是一个已婚单亲妈妈，我是我、我姐姐以及后来那只我非要不可的猫的唯一照顾者。我在沉溺于视频游戏自私地放纵自己，就像对她的挣扎那样幸福地无所知。作为一个玩着\
    \ `Chrono Trigger` 的十三岁少年，我在 Crono 身上看到了自己。我想成为这个男孩，拥有一个鼓励自己的母亲和快乐的小猫，而他们从他所处的小世界中消失了。我幻想——正如大多数孩子必须这样做而许多成年人仍在这样做那样——一个冒险的催化剂，一扇通往新生活的门户开启。幻想宇宙将我唤醒，进入宿命的一天。\n\
    \n将自己投入到 Crono 身上是一种投射练习，让自己契合。游戏设计师兼讲师 Petri Lankoski 将这种与我们玩家角色（PC）的互动描述为“共情投入”。当我们开始把角色视为自我的反映时，我们就会对他们产生共情。当我们控制\
    \ Crono 的移动时，我们几乎是在字面意义上走进了他的鞋。然而，在游戏变得更加复杂、动态和由故事驱动之前，让我们成为屏幕上那些小像素的并非共情，而是“目标相关投入”（goal-related\
    \ engagement）。\n\n目标相关投入描述了我们的游戏目标与角色（在此例中是 Crono）对齐得有多密。我们的任务和 Crono 的任务表面上是一致的——击败邪恶，拯救美好。这是一个简单的目标，是支撑许多跨越所有类型的游戏叙事的基石。《超级马里欧》中的马里欧想要什么？击败反派并拯救公主。《塞尔达传说》中的\
    \ Link 想要什么？同上。虽然“拯救公主”似乎是一个非常具体、老旧且带有性别偏见的目标，但如果我们把“公主”替换为其他词，更大的词——“城市”、“世界”、“宇宙！”——我们会发现许多游戏从开始到结束都遵循同样的叙事路径，无论其情节多么复杂。\n\
    \n这些宏大目标的完成往往与游戏的结束相重合。一旦马里欧击败了库鲍塞尔并拯救了碧姬——如果我要对我的北美经历在文字上保持忠实的话，那是桃子公主——游戏就结束了。一旦\
    \ Link 推倒了加侬并拯救了塞尔达，我们的任务完成了。我们的角色没有“游戏后阶段”。\n\n《时空之子》通过为我们提供后游戏的幻象复杂化了这种动态——主结局的多种变体以及几个特殊结局。然而，获得任何这些新结局并不符合\
    \ Crono 的目标。他出发是为了击败一个古老的邪恶——而不是为了看之后发生了什么，或者看选择之网如何复杂化这一结果。那么，我们这些玩家就有了超越角色设定之外的目标。我们想要解锁那些结局的成就感。我们想要炫耀的资本。\n\
    \n但 Crono 想要这些吗？还是他想要？在千年博览会上，Marle  Crono 对游乐游戏的偏好道：“你好好胜，不是吗，Crono？”当然，Marle\
    \ 刚认识这个沉默的男孩，但她似乎仍然比我们更了解他。那么 Crono 是一个鲁莽、固执的小混？还是一个胆怯、礼貌的青年？这由我们选择。我们是 Crono\
    \ 身后的英雄，我们如何将自己投射在他身上，使得每位玩家穿越《时空之子》的旅程都是独特的。\n\n“英雄之旅”（Hero’s Journey）是一个既有用又带有偏见的分析框架。这段“之旅”基于神话学家约瑟夫·坎贝尔首次识别的一种叙事里程碑模式，而坎贝尔反过来深受心理学家卡尔·荣格著作的影响。荣格最著名的原型对于许多故事讲述及其观众来说是熟悉的概念：阴影（shadow）、阳刚（animus）、阿尼（anima）。这些名字本身就预示着不可喻的象征深度。通过使用荣格的概念来分类和分析世界神话，坎贝尔阐述了“单神话”（monomyth）——或“英雄之旅”——一个十七步的基本结构，他简洁地将其总结为：\n\
    \n英雄从平凡的世界出发，进入一个超自然的奇迹区域：在那里遇到了神圣的力量并赢得了决定性的胜利：英雄从这次神秘的冒险中回来，带着赋予同类恩赐的力量。\n\n\
    坎贝尔的几个神话检查点几乎拥有炼金术般的名称。鲸腹（The Belly of the Whale）。双界之主（Master of Two Worlds）。这段“英雄之旅”被几位作家进一步提炼，通常作为一系列简化的步骤，并冠以华丽的标题“英雄之旅”。其中一些新的重构同样具有神秘的步骤。灵魂暗夜（Dark\
    \ Night of the Soul）。灵药的夺取（The Theft of the Elixir）。坎贝尔的模型是否准确适用于所有神话尚存争议，改编后的英雄之旅也可能存在问题。所以，请根据需要加多少盐——如果你觉得需要，加一整瓶吧！——当我尝试将典型的\
    \ RPG 英雄 Crono 放在神话人物的鞋子里，带他走过我版本的英雄之旅。之旅始于“冒险召唤”（Call to Adventure）。Crono 目睹了\
    \ Marle 通过现实结构中一个意想不到的扭曲而消失，他被迫去救她。由于 Lu 卡能够复制异常作为一种“超自然帮助”，Crono 跟随 Marle 穿过裂缝，那是一个通往未知世界——过去的“危险门槛”。在这里他遇到了强大的敌人和新的助手，Lu\
    \ 卡 永久地加入了他的团队，Frog 成为了队伍的盟友。Crono 字面上面上开始了他在“考验之路”（Road of Trials）上的行走，最终被捕、审判并判死。被\
    \ Lu 卡 从监狱深处营救后，Crono 和同伴们继续面对挑战，但随着障碍难度的增加，他们的助手数量也在增加。\n\n最终，英雄必须面对“终极考验”（The\
    \ Ultimate Ordeal）。在游戏语言中，这通常翻译为“最终 BOSS”。在《时空之子》中，最终 BOSS 是拉沃斯，一种会带来人类灭绝的外星寄生虫。在公元前\
    \ 12000 年的海之宫与拉沃斯决战，这应该是我们的胜利时刻，我们拯救了世界，并更有智慧、更强大地回到。\n\n但事实并非如此。\n"
