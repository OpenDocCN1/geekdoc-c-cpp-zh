- fmt: '

    It’s a real shame that we can’t send out the entire team to take down enemies
    with screen-clearing, seizure-inducing, panelemental septuple techs. Such ultra-powerful
    moves, though, would probably considerably change the dynamics of play to which
    we have grown accustomed.


    When we play games like `Chrono Trigger` we either tacitly accept their rules—incoherent
    as they may seem—or we don’t play at all.


    Let me throw something else out there—I don’t understand the rules of friendship.
    Or if there are even rules when it comes to friends. We learn some fundamental
    preschool guidelines that happen to work pretty damn well. Be nice. Share your
    toys.


    As we become older, we find that these aren’t as easy to implement as public television
    mascots would have us believe. So we supplement them. Let your guard down. But
    never, Keep your guard down, right? Forgive and forget. Or isn’t it sometimes,
    Forgive but don’t forget?


    And as we get even more mature and more chemically complex, lines between family
    and friends, friendship and romance, love and sex get drawn, erased, redrawn.
    And the rules expand and grow nuanced. Sections of the rules beget subsections.
    And from these, clauses and subclauses. And then the subclauses are quoted as
    independent, Bartlett-sized quotables. And they clash with other independent truths
    and fortune cookie aphorisms.


    Even with the myriad factors that determine how personalities clash and complement,
    we have a host of largely immutable qualities that regulate behaviors among individuals
    and groups. Things like our gender, our sex, our sexuality, our race, our ethnicity,
    our culture, our language. The rise-above-it-all spirit wants us to believe that
    these things just don’t matter. Except they kind of really do. We are at once
    encouraged to embrace commonalities while simultaneously celebrating differences.


    This seems remarkably easy to do in `Chrono Trigger`. Although party members come
    from different time periods, they are united not only by their desire to defeat
    `Lavos`, but also a static world language and enduring town-based culture. By
    recruiting robots, frogmen, and scantily-clad cavepeople, our party seems to be
    a real grab bag of differences. But both on the surface and beneath it, the people
    of `Chrono Trigger` have a lot more in common than we might realize.


    ***


    [1](#ChronoTriggerMoyer-5.xhtml_footnote-000-backlink) Compare the characters
    for ten (天) and mei (冥).


    # Straight? White? Male?


    ## I


    Kiritsu!


    The voice of a stern gym teacher in his freshly-laundered tracksuit thunders across
    the gymnasium-now-auditorium, followed by the sound of quick shuffling and shoes
    squeaking on the hardwood as some 400 students rise from sitting cross-legged.
    The aging principal plods up on the stage and beams from behind the lectern.


    Rei!


    The 400 bow in unison, torsos lunging forward in smooth practiced arcs. That strict
    gym coach could measure these kids with a protractor and hit 45° on each of their
    backs. The principal greets the children with a booming Good morning! Well, closer
    to Gude moaning goo. Some of the students giggle. A few smartasses enthusiastically
    return the English greeting. Most stand perplexed.


    Chakuseki!


    The students get back into mock lotus position on the floor and wait. Today is
    an unusual day for the students of Shinobu Junior High. Many of them have been
    eying the bearded white guy standing off to the right of the stage, some curiously
    and some askance.


    The principal talks about some goals for the year, peppering uncharacteristic
    Anglicisms into his schoolmarmish Japanese. His first order of business is to
    explain who the hell this whiteboy is and what he’s doing there. “…Maikeru Wiriamusu-sensei!”


    That’s my cue. My stomach is full of butterflies and instant coffee sludge. I
    bounce up the stairs, skipping a step to the amazement of a few students. What
    will these white people do next? The principal shakes my hand, firmly and demonstratively.
    These kids have just seen an alien land in their gym.


    I face the crowd. The staff and faculty flank the entire student body of seventh,
    eighth, and ninth graders. They are a sea of off-black uniforms, straight black
    hair, and quizzical brown eyes set in various shades of suntanned faces. They
    are staring right at me. I take a deep breath and open my mouth.


    Being a temporary citizen of Fukushima City was my first true taste of feeling
    like a minority.


    Although Caucasians make up the largest minority of the city of Philadelphia,
    white privilege has given me the luxury of being completely unaffected by this.
    Growing up in a mostly white pocket of Southwest Philadelphia, many ethnic concerns
    were intraracial. My family still felt the immediate legacy of their immigrant
    forebears and their competition with other immigrant groups. I often shadowed
    my father on his many trips to the meeting hall of an Irish-Catholic men’s benevolent
    association—really, a fraternity clubhouse with its own bar. There in the converted
    printer’s shop my great-grandfather used to run, I inhaled the musty scent of
    what I believed were ancient Celtic artifacts. I heard the lilting brogues of
    mysterious Irish nationals, some of whom I later learned were Irish Republican
    Army sympathizers and probably even abettors. I choked down ham and cabbage with
    terrorists, and I was none the wiser.


    I was educated at Catholic schools from grades one through twelve. Families who
    could afford the tuition sent their kids there for semi-affordable private education,
    regardless of which gods they rooted for. Education and plurality were intertwining,
    inseparable experiences for me. Regardless of our ethnocultural backgrounds, we
    were united in restrictive, unbreathable clothing—tight navy ties on mock Oxford
    shirts, and over these mocksfords, itchy midnight-blue sweaters.


    So four years after taking off my Catholic uniform for the last time, I stood
    before the student body of Shinobu, stumbling over my mirror-rehearsed self-introduction
    in Japanese, codeshifting clumsily from the familiar tone to the honorific, wondering
    why this scene felt both uncannily similar to my school days and yet so profoundly
    different. And all the while the silent horde of ethnosimilar students in their
    neat uniforms stood with their brass-plated nametags glinting in the sunlight.
    Just where the hell was I?


    The ethnic pie chart of Japan is only half-baked. The Japanese census does not,
    like the United States’ questionnaire, ask for ethnic self-identification, but
    rather legal nationality—`kokuseki`. Therefore, a misinterpretation of the statistic
    that Japan consists of 98.5% “Japanese” and 1.5% “other” suggests that Japan is
    a good deal more racially homogenous than it actually is. Walking through the
    streets of Fukushima, however, one might wonder where that other 1.5% is hiding.


    The scarcely populated world of `Chrono Trigger` is inhabited by one global monorace,
    spanning all the way from prehistory to the dismal future of 2300 AD. NPCs are
    differentiated largely by clothing design and occasionally with palette swaps—Crono’s
    mother, for instance, is one variation of a female villager type from both the
    Middle Ages and the present day. It’s refreshing to see a culture with a far less
    fickle sense of fashion. Regardless of what they wear, or the outlandish color
    of their hair, every unambiguously human being in `Chrono Trigger` has fair skin.
    Even the official character art of the game shows only subtle variations in skin
    tone.

