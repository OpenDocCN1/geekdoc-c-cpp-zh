- fmt: '

    Monsters in Chrono Trigger demonstrate a much more pluralistic view of racial
    relations.


    Transported through a gate in Medina Village, 1000 AD, our party surprises the
    two imps who reside there—one a cerulean “blue imp,” the other a dark mustard
    “mud imp.” The relationship between these two is not clear, but the mud imp scolds
    the interlopers: “Who do you think you are? Coming and going out of our closet
    at all hours.” They are clearly housemates, possibly a couple. They offer our
    human party some food before sending them on their way. There aren’t even interspecies
    tensions at this little bed and breakfast!


    Indeed, many monsters in Chrono Trigger seem to be functionally post-racial, while
    the humans that they coexist with, and are occasionally massacred by, are helplessly
    non-racial. The only evidence of any variant ethnicity in humanity is the mingling
    of the rust- and yellow-haired Iokan tribe with the purple-haired Larubans in
    65,000,000 BC—all of whom are the same skin color. When these tribes eventually
    unite under Ayla, they intermarry, creating a single race whose major feature
    is unpredictable shades of hair.


    This lack of human diversity did not strike the me of 1995 as odd. It was simply
    an aesthetic tied to the games I loved to play. I was certainly aware that games—even
    RPGs—could and did represent a multitude of skin colors to increase sprite variation.
    EarthBound, for instance, has some dark-skinned NPCs. One well-used sprite, “Mohawk
    Man,” always reminded me of Mr. T. It would take Square a few more years and yet
    another “final” fantasy game to unveil Barret Wallace, their own answer to the
    beloved bouncer-turned-actor-turned-fool-pitier.


    But EarthBound was the real world. Or at least, a fictionalized and heavily distorted
    simulacrum of our own. Square’s fantasy RPGs were faraway planets of majestic
    kingdoms, mystic crystals, fluffycute moogles, and chocobo farms. And when villagers
    sat down for a feast of spicy chocobo wings, the only racial tensions that would
    have mattered were species tensions. Monster attacks had been increasing lately,
    hadn’t they? It wasn’t safe to go out at night anymore, was it? Any number of
    hackneyed NPC quotes hint at dangerous others lurking on the edges of town, ready
    to strike.


    Chrono Trigger embraces a wide range of motifs—prehistoric man-dino clobberfests,
    futuristic robot-spanking gunfights, turn-of-the-century idyllics. But the theme
    upon which the classic Square RPG legacy was built is sword and sorcery, a genre
    so pervasive it can be cautiously synonymous with fantasy. The further back we
    travel through Square’s catalog of RPGs, the more elements of futurism and technology
    disappear. The world of the first Final Fantasy is almost free of sci-fi elements.
    Besides the odd robot or two, the world is made of typical fantasy denizens—elves,
    dwarves, mermaids. And the very first mission that precedes the introductory credits—a
    sort of prelude adventure—is to save a goddamn princess! How much more typical
    can you get?


    The roots of early magic-medieval Square RPGs—let’s say Final Fantasy, released
    in 1987—stretch into Japanese ground tilled a year and a half earlier by Enix’s
    Dragon Quest, itself inspired by computer RPGs like Wizardry and Ultima, both
    released in 1981 on North American soil. These games in turn trace their origins
    to earlier attempts to make pen-and-paper role-playing games electronic. Perhaps
    the grandaddiest of these was Dungeons & Dragons—a household name even to non-gamers.
    D&D drew on mechanics from already established miniature wargames and added fantastic
    elements from a wide variety of mythologies and speculative fiction. And although
    D&D developer Gary Gygax claimed the similarities of his game to J.R.R. Tolkien’s
    Lord of the Rings-centric legendarium to be superficial—yes, there are hobbits
    (er, “halflings”) in Dungeons & Dragons—he did note that he borrowed those elements
    deliberately to reach a wider audience, one that was at the time absolutely mad
    for hobbits.


    So what? Well, we can now position Chrono Trigger as a descendant—a distant great-grandnephew?—of
    a game that directly appropriated iconic elements from Lord of the Rings. And
    Tolkien and his drinking buddy C.S. Lewis, the creator of Narnia, weren’t just
    writing novels for entertainment. In fact, cultural theorist and digital media
    specialist Tanner Higgin contends that they were creating new European mythologies,
    using fantasy worlds as surrogates for Western Europe, with the metarace human
    substituting for whites. Nonhuman races and evil-aligned humans in Tolkien’s Middle-Earth,
    then, were the dangerous, nonwhite others who occupied lands outside of the Eurosphere.
    It’s no mere coincidence that popular cinematic adaptations of Lord of the Rings—and
    contemporary fantasy franchises like Harry Potter and Game of Thrones—rely on
    Eurocentrism as their cultural touchstone.


    Are the humans of Chrono Trigger “white”? They kind of looked that way to the
    1995 version of me. It was easy for me to see Crono’s light peachy face and project
    my own onto him. The lack of other distinct skin tones in Crono’s community suggested
    that these people were all of the same race. But to players in Japan who experienced
    Chrono Trigger months before I could, these light-skinned characters could have
    easily been Asian. Regardless of impossible hair colors.


    Far-out physical features—Lucca’s lavender hair, for instance—hint that game humans
    are not quite the same as player humans. But their overall design implies that
    these humans are supposed to be us. Such exoticizations of character design achieve
    an aesthetic commonly called mukokuseki, or “nationalitlessness.” Mukokuseki is
    the absence of kokuseki, which some of you may remember is the Japanese census’s
    answer to “ethnicity.” The conflation of “nationality” with “ethnicity” makes
    mukokuseki a difficult term to tackle—is this an absence of citizenship, or ethnic
    identity, or both?


    Kōichi Iwabuchi, a professor of media and cultural studies who introduced the
    term to English discourse, notes that mukokuseki is an attempt to remove the “cultural
    odor” of Japan from international products. But anyone familiar with Japanese
    manga, anime, and video games can see past the green coiffures and fuschia eyebrows
    and smell the Japaneseness. In an interview included in Kurono Torigāryaku, art
    designer Akira Toriyama of Dragon Ball series fame specifically states that he
    intended to create a mukokuseki cast of characters for the various eras of Chrono
    Trigger. One of Toriyama’s Dragon Ball Z characters—the jet-black, big-lipped
    Mr. Popo—would later be recolored blue after his poorly-received North American
    anime debut. Subculture critic Tetsu Misaki writes that even some Japanese protest
    groups judged this character as offensive.


    While mukokuseki might be an attempt to make Japanese goods more desirable in
    the international marketplace, Toriyama’s design choice for Mr. Popo demonstrates
    that these efforts can fail miserably when characters veer too close to real-world
    stereotypes. Toriyama himself might have simply been trying to add variety to
    an already large cast of mukokuseki characters, and the resemblance of Mr. Popo
    to a blackface caricature could be chalked up to unfortunate coincidence. Nevertheless,
    Toriyama is not ignorant of how real-world sensibilities influence design. In
    that same interview, Toriyama reveals that he wanted a protagonist with a katana—something
    to lend him an “Oriental feel” not present in previous RPGs.

