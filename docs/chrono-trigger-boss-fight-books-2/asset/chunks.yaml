    日本制作的游戏本地化程度可谓参差不齐。早期的天堂谷游戏中充满了拼写错误和语法问题，例如 `Ghosts ’n Goblins` 的告别信息“Congraturation
    this story is happy end”，或者 `Pro Wrestling` 中的“A winner is you!”。这些粗糙的翻译往往伴随着一种蔑视与讽刺性的赞赏。另一些则成为了“伦敦英语”（Engrish）深受喜爱的典范。我们中的迷因历史学家会记得那句风靡全球的句子“All
    your base are belong to us”，尽管很少有人真的玩过它的源游戏 `Zero Wing`。与此同时，史克宇宙（Squareverse）的粉丝对北美首版《最终幻想
    IV》中最令人难忘的辱骂——“You spoony bard!”（愚蠢的诗人！）深有感情。


    所有这些奇特的翻译都有一个共同点——它们是由懂英语的日本人制作的，但英语水平还不够。准确、自然的翻译需要目标语言的母语者参与并投入其中。但有时仅仅靠翻译是不够的。对日本文化特有的事件、人物、图像和其他产物的引用，无论用英语翻译得多么精炼，跨越国界后可能无法理解。


    如果说这些边界是清晰度的障碍，那么日本游戏的本地化过程——即用符合英语读者口味的味道掩盖“文化气味”——就发生在艺术史学家兼人类学家克里斯托弗·斯坦纳（Christopher
    Steiner）所谓的“边界地带”，在这个地方，“调解者斗争并协商着商品在‘落地’时将承担的意义和价值”。《时空之缘》曾有过两次通过这种边界地带的罕见经历——第一次是在
    `SNES` 上最初发布，第二次则是其 `Nintendo DS` 移植版。任何进入（或重新进入）美国边界的人都知道，通过海关可能是一段痛苦的经历。


    • 日本文学学者泰德·沃尔西（Ted Woolsey）在刚完成关于现代文学中日本灾难的硕士论文时，受雇于 Square 工作。Woolsey 的第一个项目是参与后来成为《最终幻想传说
    III》的本地化——这是 Square 首次由一位真正的英语母语人士主导翻译的作品——而他的工作是让英文版本尽可能不那么“愚蠢”（un-spoony）。Woolsey
    还担任过其他史碑级 Square 作品的翻译，如《魔圣传说》（`Secret of Mana`）、《最终幻想 III》（即 `FF6`），当然还有《时空之缘》。


    Woolsey 不惜牺牲日文原文为代价，大量使用熟悉的西方典故，这引起了数几代 Square 粉丝的赞誉与嘲讽。“沃尔西主义”（Woolseyism）这个词甚至被创造出来（或许还带有贬义色彩），用来描述那些严重偏离日文原作的翻译。无疑，我玩过的《时空之缘》与在日本发布的版本大然不同。


    在进入北美的前十五年里，任天堂曾是视频游戏的严厉“删减者”，无论是本土的还是从日本进口的。日本游戏中对“成人”主题的引用——性、裸体、暴力或酒精——会被剔除，并通常替换为不那么敏感的内容。因此，无论
    Square 粉丝对文本忠实度有多狂热，Woolsey 保留纳加族特布罗米德（Naga-ette Bromide）那种模糊的性暗示，或者将比酒比赛变成斗汽水比赛，都是可以原谅的。


    除了为了适应天堂的标准而调整脚本外，Woolsey 还加入了许多他自己的特色风格。例如，他将魔王的三位将军的名字 `Binegā`、`Soisō` 和 `Mayonē`
    分别改成了 `Ozzie`、`Slash` 和 `Flea`。敏锐的读者可能会发现这些原始名字是“醋”（vinegar）、“酱油”（soy sauce）和“蛋黄酱”（mayonnaise）的日语化版本，而事实上，将食物作为双关语是鸟山广明角色的常态。但在英语中，鸟山式的关联失去了了冲击力，那种每个名字都以长元音结尾的韵律感也消失了。同样，它也失去了
    `Flea/Mayonē` 用复合助词 `yonē` 结尾句子的双关——这种结尾既表达了确定，又表达了被认可的渴望——这是一个让 `Flea` 听起来有点“娘娘”的特质。Woolsey
    将这些语言细微的调味料替换为对摇滚音乐人的引用：歌手 `Ozzy Osbourne`、火花石乐队的吉他手 `Slash` 以及红辣椒辣椒的贝斯手 `Flea`。在公元
    600 年的 `Dorino` 村的另一个地方，Woolsey 的笑话有了一个包袱：一个村民称魔王的将军们为“音痴的恶魔”。而且，无论是否是故意的，`Ozzie`
    那句难忘的感叹“Ozzie’s in a pickle!”玩了他的日语名字的梗，而“Ozzie’s in a jam!”则巧妙地兼顾了这两者的双关。


    Woolsey 的其他发明还有频繁的宗教引用。他将平平无奇的 `Majinki`（魔机械）更名为更熟悉的 `Mammon Machine`（魔蒙钱机器），暗示了驱动莉尔女王疯狂的贪婪具有圣经级的规模。至于莉尔女王的三个亲信，那些具有
    1960 年代蝙蝠反派风格的名字 `Bosshu`、`Gasshu` 和 `Hasshu` 被重新译为 `Melchior`、`Gaspar` 和 `Belthasar`，这些是传统上赋予拜访新生耶稣的基督教贤士（即
    `Magi`）的名字。当然，`Magi` 是“magus”（士）的复数形式。


    Woolsey 的某些翻译似乎纯属天马色彩。魔王召唤 `Lavos` 的咒语从毫无意义的“Da zuma rafua rō raira”被翻译成了同样胡言乱语的“Neuga,
    ziena, zieber, zom”。但这也有意为之，因为它与“Now the chosen time has come”这一句构成了一个押韵句。即使是这些胡话也经过了本地化，以符合英语文学对咒语韵律的喜爱。


    也许 Woolsey 最大的动作是赋予了青蛙（Frog）定义其英语观众形象的古代骑士腔。在日文中，青蛙实际上是团队中最不文雅的一个，句子结尾使用 `ze`
    和 `zo` 等粗鲁的男性语气词，听起来更像个动画里的暴徒。将这种粗鲁感翻译成英语可能需要使用脏话，你可以想象美国天堂对此会有何感想。


    多年来，Woolsey 接受了多次涵盖广泛话题的采访，从他在 Square 的日子到在 Big Rain 的短暂生涯，再到他目前在微软的工作。我带着自己的问题联系了他，并很高兴地得知，几十年后的
    Woolsey 仍然记得《时空之缘》。


    • Michael P. Williams：你在多次采访中提到了技术挑战、时间限制——你每部只有 30 天来完成《魔圣传说》和《最终幻想 III》——以及为北美客户翻译时被施加的审查。本地化《时空之缘》给你带来了了哪些困难？


    泰德·沃尔西：我被要求在员工给出粗略翻译后，尽我所能改进屏幕文本。基本上，我必须重写整个游戏，并重新翻译大量的章节。我在东京待了几周，后来在西雅图做了这些工作。也许是当时的
    Square 管理层低估了翻译《时空之缘》或此类游戏的复杂性。他们确实在几年后改进了这一点，聘佣了优秀才华的专业人士来工作，并给予他们自由和资源。但我对《时空之缘》的工作是在
    `SNES` 卡带的早期，你必须在大脑中记住大部分故事、配音和语气，想象角色之间将如何互动。要为某些角色想出巧妙的解决方案非常困难。我希望我有更多时间来仔细思考我的某些决定。但在翻译时，有时你必须选择你的北极星，并坚持坚持下去，尤其是当时间紧迫时。

    '
- fmt: '

    ## MPW: You added some flair to details, like Frog’s Middle English grammar, and
    you injected some humor into the game, such as redubbing the Knights of Guardia
    the “Knights of the Square Table.” Were there any instances where you resisted
    the urge to add more wordplay or humor?


    TW: Looking back I probably could have pulled back on some of the language play.
    When I was doing that I sort of just channeled the original text, letting my brain
    play with the concepts—I can’t say I was always happy with what came out in English,
    and certainly I pulled back a ton of shaping as the game cartridge didn’t have
    the capacity for text overages. We had to cut to the bone.


    With `Frog`, I just realized that while he had an interesting tone in Japanese,
    it seemed slightly too close to the other characters conversationally. I felt
    like he was a heroic type, and I tried to amp that up a bit.


    ## MPW: What was your translation support team like?


    TW: We had several people working on the `memory map`, and how to rework the `ROM`
    to accommodate English, and other languages like French and German. Other folks
    worked on graphics changes for localization. The folks who took a stab at translating
    `Chrono Trigger` were doing their first game—that can be tough, and I didn’t mind
    jumping in to shape the final vision.


    ## MPW: You’ve said that localizing names can be an exercise in re-exoticizing.
    Taking names like `Final Fantasy VI`’s “Tina” and making them more otherworldly,
    like “Terra.”


    TW: Yes, `Square` liked purely Western names because they would stand out in the
    text as exotic. I felt that using the same names in English, in some cases, lost
    the punch and exoticization of the original.


    ## MPW: What level of communication did you have with Tom Slattery, who revised
    your translation for the DS? How do you feel about the game being given a revision
    of your own script, versus a retranslation of the original Japanese?


    TW: None. I met `Tom Slattery` after the fact, and feel he did a great job as
    torchbearer! In some perverse way I’m glad the game includes pieces of my original
    work. I spent hundreds of hours working on it, and I loved chasing solutions to
    tough grammatical puzzles in the original text. That is the fun of translating—being
    resourceful, and doing your best to come up with concepts that help audiences
    pull as much out of the game as possible.


    ## MPW: What were your working conditions like at Square? Were you integrated
    into the regular staff offices or were you treated like a guest or consultant?


    TW: I was usually given an office space somewhere around where the “remake” staff
    was situated, so basically, just a cubicle like everyone else. For the most part,
    this was fine, though there were some occasions where I felt like I was sort of
    camping in a space where some folks didn’t want me. I used standard issue computers
    with full access to required files via their file sharing system. I could come
    and go as I wished, but usually I was on a crazy deadline, so I was often working
    at the office ten hours or more a day.


    ## MPW: Was Chrono Trigger an obvious choice for North American release, or did
    you lobby for this game?


    TW: `Chrono Trigger` was a beautiful game, but certainly there were issues. The
    biggest one was the price of the `ROM`. `Chrono Trigger` would be the most expensive
    `SNES` game ever when it shipped, and I recall there being quite a bit of discussion
    around what that would do to sales. In the end, the company decided that the opportunity
    was sufficiently worthwhile, and proceeded with the game, but certainly business
    strategy played a large role in what games came to the US.


    ## MPW: Were there games you vetoed for localization in favor of others, or games
    you backed but never made it to the States?


    TW: I never really vetoed any of the `Square`-developed games, including `Front
    Mission`. Unfortunately, the business strategists felt that certain games would
    not be successful outside of Japan, or that they would be too costly to localize.
    I backed most of the products being produced in Japan, but ultimately `Square`
    management decided which titles they wanted to invest in localizing.


    ## MPW: Did you have any influence on other games that were in development at
    Square while you were employed by them?


    TW: I often saw games in early development, but I thought more about script design
    and story than other game elements. I often gave feedback when I was playing the
    Japanese version for things that would make the story more compelling or familiar.
    `Final Fantasy Mystic Quest` was ostensibly created just for non-Japanese audiences
    to train up more people on role-playing games—sort of an RPG on training wheels.
    That game needed tons of changes. Puzzles were too difficult, and the story was
    too awkward and too rooted in Japanese cultural themes. I spent quite a bit of
    time helping to shape that game. But even then I knew it was the wrong product
    to ship after `Final Fantasy II` (`FF4`) on the `SNES`. It just served as a letdown
    for customers who loved `Final Fantasy II`. I had translated around 75% of `Final
    Fantasy V` while `Mystic Quest` was in development, but I was told to shelve it
    until the market for RPGs was bigger. I really liked `FF5`, so that was super
    disappointing.


    ## MPW: What influences did you draw upon in translating Chrono Trigger?


    TW: I tried to draw on lots of styles of literature, comics and animated movies
    as the scenarios lent themselves to various treatments. There were some scatological
    or other humorous references in the Japanese version that I simply had to expunge
    or change. I think a lot of the translation was just following the original text
    and letting it flow through the filter, as it were. I had to radically cut down
    on the amount of text after the first couple of edits, so at some point, I just
    tossed the original aside and worked on shortening the version I had. Probably
    not the right thing to do, but at that point I was under the gun, and deleting
    extra words in a sentence mattered.


    At some points I tried to inject some humor—in retrospect not universally appreciated!—when
    I felt the tale was dragging a bit. Also there were various writers for the Japanese
    version, each with a slightly different editorial voice, so I tried to play with
    some of that for ideas.


    ## MPW: You used more than a few religious references absent in the original Japanese
    but very prominent in the North American translation. As a result, many players
    of the North American version have read more allegory into the game than the original
    story aimed for, but which are now permanent fixtures in the game’s legacy here.


    TW: Interesting that you point that out. I didn’t really have the idea to turn
    the story into a biblically-laced horrorfest, but some of those terms and concepts
    contain charged, intense pearls of emotions that were helpful to amp up certain
    themes in the game. There certainly was an “end of days” component to the game’s
    ending(s), and eons rather than centuries being considered in the game’s timeline,
    so some of the imagery and concepts from Western religious traditions seemed to
    work. I wish it had been more purposeful, but again when you’re channeling that
    much text, and characters are saying different things when they are selected for
    individual story arcs, a lot of what came out in the English was just what bubbled
    up almost unconsciously in my head while supporting and driving the story.


    •


    Woolsey’s translation of `Chrono Trigger` remained intact when it was ported to
    the `PlayStation` in the `Final Fantasy Chronicles` collection, but just over
    thirteen years later, when it was chosen to be re-ported to the `Nintendo DS`,
    the translation was given a bit of an overhaul.

    '
