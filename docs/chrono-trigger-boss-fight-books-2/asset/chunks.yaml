  trans: '


    考虑到《时空之缘》（Chrono Trigger）中的人类角色设计，涉及到了一种复杂的相互作用：一方面是幻想类型依赖于以欧洲和英语为中心的角色作为“默认人类”，另一方面是游戏美术设计和开发影响的现实情况。但在加迪亚（Guardia）的千年年览会上漫步一圈，依然引发了疑问——为什么大家都是白皮肤？


    ## II. 日常生活与烟室


    渡中学离我那间非常舒适的公寓只有一段车程，尽管胃子里填满了从附近便利店买的热饭团，但我还是感到精疲力竭。到达学校时咖啡不足，我发现教师办公室里两个可加水的“象印”（Zōjirushi）热水壶正滴出最后一点热水，这让我的每日速溶咖啡变得更像浓稠的糊状。


    我费力把两个大水壶搬到厨房，那里大得有些滑稽的水壶刚刚开始鸣响。英语教学项目的负责人——一个紧张、咯咯直笑但总算平易近人的男人——溜到我身边，有些尴尬地告诉我我不需要这样做。他叫来一位年轻的女老师，后者热情地从我手中接过水壶并重新加水。我向她道歉——自从我每天有超过一半的时间在说日语后，我就总是把“谢谢”和“对不起”搞混——我并提议用刚烧的水为她泡杯茶。英语老师赞美我的“慷慨”他的词汇量非常丰富，尽管有时显得生硬——但他提醒我，这些家务事通常由女性工作人员处理。


    我通常把咖啡带到教师办公室远角的一间小房间，那里是一个充满了软沙发和致癌物的隐世绿洲。这正是 `kitsuenshitsu`——烟室——在一个公共售卖机显眼位置卖烟的国家，这是完全可以接受的。女性很少进这里。我在焦油烟雾中与男老师们练习日语，进行一些严肃的内部文化交流。我做梦都不会和初中学生讨论的话题——药物、性习俗、美国人平均的尺寸——在这个烟雾缭绕的男俱乐部里没有任何禁忌。


    偶尔，那位文艺酷范的音乐老师会像往常的烟囱一样，抽着她的超长细薄荷烟走进来。男人们都鞠躬、道歉，并为她让座。这是一场滑稽的礼貌“抢椅子”游戏，充满了错位的骑士精神。我发现自己想要随从他们——表现得符合文化规范。与此同时，我又感到一种冲突的欲望，想要举起美国平等主义的旗帜，像对待任何其他男工作人员一样对待这个女人。当她坐进新空出的座位时，我半站起身，礼貌地点头示意。


    ## 角色阵容中的性别动态


    《时空之缘》的主要角色并不完全是一个男俱乐部。七个玩家角色（PCs）中有三个是男性。这比《最终幻想 6》（Final Fantasy VI）有了明显的改进，后者的
    14 个玩家角色组成的阵容中只有三位可见的女性。4 大多数早期 Square RPG 游戏也有类似的偏斜。无论性别比例如何，在所有有明确主角的游戏中，主角总是男性。然而，《时空之缘》的三位女英雄是一群坚强的人——艾拉（Ayla）实际上强得离谱，在武器横的世界里是一个赤拳斗士——但这并没有让她们脱离性别刻板印象。


    ### 玛露（Marle）：公主


    玛露是一个不需要被拯救的公主——好吧，除了那一次她需要。她在游戏中的登场很快伴随着一段爱情故事的引入，这既让克罗诺（Crono）显得异性恋化，又让玛露看起来像个情感混乱的人，因为我们从未体验过沉默的克罗诺回馈她的。这种单方面性随着游戏的进行而加剧。那些感人的时刻——例如玛露在`公元
    600 年`从遗忘中获救后感谢克罗诺，或者在死神峰（Death Peak）的那个催人泪的场景——都因为克罗诺固执地不回应而变得诡异地平衡。玛露真诚的情感开始看起来像歇斯底里。


    她也成了 Square 倾向于将治疗类“白魔法师”角色设定为女性。虽然玛露并非严格意义上的白魔法师——与其说她是一个“水魔法师”——但她很好地履行了治疗者的功能，拥有游戏中最好的防御和辅助法术，包括最强大的复活法术
    `Life 2`。尽管玛露的攻击法术与其他角色平相当，但她偏好的物理攻击方式不是近战武器。当靠近敌人时，她的弩箭可以当钝器用，但她倾向于远程射击。无论如何，她的物理攻击都是游戏中最弱的之一。


    尽管有这些定型的性别设定，玛露是游戏中最性格倔强的角色。她是唯一一个愿意反抗社会对她高期望的人，并决定开辟自己的道路。通过这样做，她反抗了国家的最高权威——由她父亲加迪亚三世国王（King
    Guardia XXXIII）领导的父权制君主制。“我要求的只是表现得像个公主，”他在克罗诺受审判期间责备她，完全没有考虑到她对被控英雄的情感。如果当公主意味着压抑自我，玛露绝不参与。


    ### 露卡（Lucca）：催化剂


    露卡是玛露和克罗诺的灵魂伴侣，是另一个远程武器使用者，她的枪甚至比玛露的弩箭还要弱。露卡在游戏早期也经常充当`机械天神`（dea ex machina）。与玛露那种被动推动早期剧情发展的人（首先是消失，然后是完全消失）不同，露卡是事件的催化剂。开启穿越过去冒险的是她的传送舱（telepod），而让克罗诺和玛露安全回到`公元
    1000 年`的是她的钥匙（Gate Key）。随后，当克罗诺逃离监狱时，她再次拯救了他。没有露卡，我们无法修复和招募机器人（Robo），我们需要他开启时间尽头（End
    of Time）。这一切都归于露卡敏锐的科学大脑。


    然而，科学领域传统上由男性主导，尤其在高层。特别在日本，科学界的女性被认为缺乏吸引力。不女性化。露卡确实符合记者川美纪（Miki Tanikawa）描述的刻板印象——一个“头发凌乱、不在乎美的科学女孩”。由于她穿着松垮的衣服、不对称的帽子以及“可能可以用它看到月球背面”的可乐瓶眼镜，[5](#6.xhtml_footnote-006），露卡远不是玛露那种风风飘飘的美。她在游戏中的唯一浪漫是对机器人机器人的崇拜。随后，正如最后的
    CG 所示，在原始机器人回到未来与阿特洛波斯（Atropos XR）重聚后，露卡制造了自己的微型机器人版本。`机器人 Junior`（Robo Jr.）的建造展示了露卡的快速科学进步——敏锐的玩家会记得露卡最初得出结论“双腿行走的人机器人几乎是不可能的”。看来卡拉
    OK 爱好者加托（Gato）在很多方面都是失败的。


    ## 尾声


    CG 继续展开露卡的这段尾声。当代养机器人——与其说是孩子不如说是《奇异科学》式的恋人——在森林中散步时蹒跚地跟在她身后，露卡发现了一个发光的物体。那是一个吊坠，实际上是莎拉（Schala）的吊坠——也许也是玛露的？无论这个关键道具的持有历史如何，露卡现在发现它系在一个婴儿身上。如果我们有精力去玩《时空交叉点》（Chrono
    Cross）——我没有玩——我们将得知这个婴儿不仅成为了续作中的主要角色基德（Kid），而且是露卡的第一个代养孩子，也是她建立孤儿院的动力。


