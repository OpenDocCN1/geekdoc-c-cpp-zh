  trans: '

    设计良好的角色扮演游戏充满了可以被忽略或接受的任务。在与命运以及一个集市上的神秘女孩进行那场约会（那个集市恰好就在他家旁）之前，`Crono` 能够看到他周围的世界。他可以探索附近的森林并与低级怪物搏斗。他甚至可以离开自己的国家，从他的家乡
    `Truce` 旅行到位于南方大陆的城镇 `Porre`，在一家咖啡馆里狂欢。没有任何故事情在促使他前进，也没有通往下一个目标的清晰路径。


    即使在这次观光之旅结束后，也有充足的时间可以玩。集市本身就充满了小游戏。即使是最随性的玩家，也可以花几个小时与卡拉 OK 战斗机器人 Gato 一起升级，赚取现金并在那个诡异的侧影帐篷里消费——在那里，下注
    80 枚硬币的赌注就能让 `Crono` 那可能已经陷入苦战的小家庭再养一只猫。然后是猫粮。然后是更多的猫粮。这自然意味着更多的猫。事实上，在你最终发现 `Chrono
    Trigger` 涉及到时间旅行之前，你就可能通过代人的方式，早早地注定了 `Crono` 的母亲将成为宠物收集狂魔。在你终于跨过那个时间大门，让 `Crono`
    的妈妈独自面对你非要不可的七只猫之前。


    在 1995 年完成 `Chrono Trigger` 后，我想要继续这样在新的世界中冒险。但 `Chrono Trigger` 最终变成了 `Square`
    在北美 16 位时代高幻风格的最后绝响。在 `Chrono Trigger` 几个月后发布的 `Secret of Evermore` 并不是我期待的那种回合制
    RPG。它甚至作为 1993 年动作 RPG `Secret of Mana` 的续作（后者是前者的精神续作）时也失败了。而 1996 年 3 月的 `Super
    Mario RPG` 虽然可爱且具有创新性，但远非我渴望的幻想世界。`Square` 的任天堂黄金时代已经终结。


    `Final Fantasy VII` 改变了一切。那些我必须拍打并吹气才能让它们工作的肥大笨重的卡带消失了。`FF7` 跨越了三张 PlayStation
    光盘。`Square` 已经向未来迈出了一步，该系列也是如此。`Final Fantasy VI` 中的工业革命引发了 `FF7` 中的科幻冒险。诚然，那里有魔法和莫古鸟，但现在它们与枪械手臂和直升机竞争。那些熟悉的像素角色精灵也在这里，但它们的身体由于过多的多边形而变得膨胀。


    当我走在 `Final Fantasy VIII` 的“恐怖谷”中（该游戏在我高中的最后一年发布）时，我感到 `Square` 的魔咒对我产生开始消散。也许这只是个偶然。也许
    `Square` 在这个超写实、过度华丽的游戏上掉了链子。当我玩到在大学第一学期发布的 `Final Fantasy IX` 时，魔法已经消失了。我觉得准备好继续离开了。在大学里，我没什么时间玩
    RPG 了。那些由可乐驱动的角色扮演时光，已经被和朋友们狂饮畅欢时偶尔发作的 `Super Smash Bros.` 所取代。也许我已经超越了 `Square`——毕竟我是一个成年人了，而视频游戏是孩子的玩具，对吧？


    大学毕业后，我发现自己来到了地球另一端那个视频游戏的圣地——日本教英语。我最终落在一个廉价、偏僻的东京城市——`福 ushima`。`福 ushima` 在新闻中声名鹊起还有几年路，而在我在那里工作之前，我对
    `福 ushima` 的唯一信息是一些旅游网站、一个 `Wikipedia` 词条，以及它距离东京的粗略估计。我曾想象过西方人往往认为的那种疯狂的大都市日本：霓虹灯通明的街道，鲜艳的卡通吉祥装饰着每隔一栋建筑。`福
    ushima` 显然不是那样。


    尽管如此，我在那里变得习惯，结了朋友，爱过几次次，并以某种方式设法比那些永远困在过去的同校毕业生工作少得多。嗯，至少在他们身后落后了十二小时。大学毕业后的生活本该是我第一次品尝“现实世界”，但日本对我来说远非“现实”。它是一次延长的假期，一个满足我那
    21 岁流浪欲望的机会。对于我的许多外国同事来说，日本更像是一个幻想王国——他们投入到动漫、漫画、角色扮演中。他们玩游戏。


    我有大量的空闲，随着天气变冷，我发现自己待在室内的时间往往多于室外。我读了我那小群朋友共同拥有的每一本英文书，看了前任租客莫名留在我公寓里的每一盘《X 档案》录像带。我开始感到无聊。不过，我注意到我带到日本的
    `Game Boy Advance` 正在衣柜里吃灰。也许我可以买个日本游戏，用它来提高我的语言能力。我可以让这个孩子的玩具具有教育意义。变得成人化。


    我拿起了一个熟悉但完全陌生的东西——`Mother 1+2` 日本版 `Game Boy Advance` 卡带（我们北美人可能更熟悉的 `EarthBound
    Zero+EarthBound`）。当我走在现在已变成日本风情的 `Onett` 街道上时，一切都在眼前闪现——这就是我一直缺失的！`Square` 和我分道扬扬了。他们将
    RPG 角色从小型的收藏模型变成了复杂的、不可捉的人体模型。我想要过去那种感觉，但又是新的。


    现在，回到美国，再次重玩 `Chrono Trigger`，我感到害怕。害怕在十八年后再次玩这款游戏会破坏那种魔法。我谨慎地对待，小心翼翼地把手伸进那个浑浊记忆的深渊，好奇古老的咒语是否依然灵验。我可以向读者保证，那只旧帽子里还有很多兔子（意惊喜）。


    如果你正在读这本书，那么你可能还记得那种魔法。也许你的记忆像我的一样，被怀旧和衰老的迷雾所笼罩。比我擅长总结的人多得多，所以与其重复那些关卡编译者们已经完成的艰巨工程，不如让我们花点时间回顾一下基础知识。


    `Crono`，一个来自小镇的少年，他精通科技的女孩 `Lucca` 以及伪装的公主 `Marle`，最终打开了一个时空洞——一个大门。在发现自己的时代与其他时代联系后，这三人穿梭于不同的时间，组建了一支盟友队伍：变成青蛙的骑士
    `Frog`；坚毅的机器人 `Robo`；粗犷的洞穴女 `Ayla`；最后是拥有神秘忠诚的暗黑法师 `Magus`。得知他们的星球——也就是生命本身！将会被来自外界的邪恶力量
    `Lavos` 摧毁，这七个人继续前进，收集线索和材料，结识支持者并击败敌人，为那场为了未来的、决定性的最终战斗做好准备。


    我们在 `Chrono Trigger` 大部分时间里的操作载体是一个红头发的少年。

    '
- fmt: "\nIt’s clear that people are invested in Crono’s life, like his mother and\
    \ his bestie Lucca. People around town seem to recognize him. Sometimes. How could\
    \ they not? He’s the redheaded pineapple-haired sword-swinging kid from around\
    \ the corner. It’s hard to envision a world where someone like that is forgettable,\
    \ especially when a vast majority of the people who inhabit Chrono Trigger are\
    \ just so damn interchangeable.\n\nDespite his standout sense of style, Crono\
    \ isn’t much of a character. We know that Crono engages in conversations with\
    \ people, but we don’t get to hear—well, read—exactly what he says to them. We\
    \ the players are supposed to be the presence behind Crono, with a press of the\
    \ `A` button serving as our conversation starter. Besides occasional chances to\
    \ advance the dialogue with binary choices, all we can do is tell Crono where\
    \ to move and how to fight. \n\nIn fact, when we are given the chance to “speak”\
    \ as Crono, the choices aren’t even presented in quotation marks. We’re not really\
    \ indicating what Crono says verbatim, but rather, what he intends to say. These\
    \ choices don’t even advance the narrative profoundly. We can repeat an “incorrect”\
    \ response over and over until we finally choose the game-sanctioned answer, or\
    \ we can pick among two options that only affect the immediate response with no\
    \ far-reaching repercussions. Rather than making us identify with Crono as a character,\
    \ our speech choices often remind us how little of what we say actually matters.\
    \ So do we give a damn about Crono?\n\nAs it turns out, we do.\n\nI grew up in\
    \ a nuclear family that slowly and steadily fissioned. By the time I was really\
    \ aware of myself and my surroundings, my father was already working long weeks\
    \ away from home, returning on occasional weekends. These weekends became less\
    \ frequent until they were almost nonexistent, as he traveled farther from home\
    \ for better opportunities for our family. Boston. Jacksonville. Guadalajara.\
    \ Malabo. Shenzhen.\n\nMy mother was a married single parent, and acted as the\
    \ sole caretaker for me, my older sister, and later on, that cat I just had to\
    \ have. I was as blissfully unaware of her struggles as I was selfishly indulgent\
    \ in video games. As a thirteen-year-old playing `Chrono Trigger`, I saw myself\
    \ in Crono. I wanted to be this boy with the encouraging mom and happy little\
    \ cat who vanished from the small world he inhabited. I fantasized—as most children\
    \ must and many adults still do—of a catalyst for adventure, of a portal to a\
    \ new life opening up. Of the universe waking me up into a fateful day.\n\nPouring\
    \ myself into Crono was an exercise in projection, of making myself fit. Game\
    \ designer and lecturer Petri Lankoski has described this type of interaction\
    \ with our player characters (PCs) as empathic engagement. When we begin to see\
    \ our characters as a reflection of ourselves, we empathize with them. As we control\
    \ Crono’s movements, we are almost literally walking in his shoes. Before games\
    \ became more complex, dynamic, and story-driven, however, it was not empathy\
    \ but rather goal-related engagement through which we became those little sprites\
    \ on the screen.\n\nGoal-related engagement describes how closely our gameplay\
    \ objectives align with our PC—in this case, Crono. Our mission and Crono’s are\
    \ ostensibly the same—defeat the bad thing and save the good thing. It’s a simple\
    \ goal, one that underpins many game narratives spanning every genre. What does\
    \ Mario in `Super Mario Bros.` want? To defeat the villain and save the princess.\
    \ What does Link in `The Legend of Zelda` want? Ditto. And while “saving the princess”\
    \ may seem a very specific, old-fashioned, and gender-biased goal, if we replace\
    \ “princess” with other words, bigger words—“town,” “world,” “universe!”—we’ll\
    \ find that many games follow the same narrative path from start to finish, regardless\
    \ of the intricacies of their plots.\n\nThe completion of these big goals often\
    \ coincides with the end of the game. Once Mario defeats Bowser and saves Peach—Princess\
    \ Toadstool, if I’m being textually faithful to my North American experience—the\
    \ game is over. Once Link topples Ganon and saves Zelda, we’re done. There is\
    \ no post-game for our PCs.\n\n`Chrono Trigger` complicates this dynamic by offering\
    \ us the illusion of a post-game—multiple variants on the main ending along with\
    \ several special ones. Obtaining any of these new endings, however, is not aligned\
    \ with Crono’s goal. He sets out to defeat an ancient evil—not see what happens\
