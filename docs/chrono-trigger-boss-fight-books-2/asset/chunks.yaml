    Game Design Forum 创始人 Patrick Holleman 从游戏性的角度审视《时空旅》，将故事分为两个部分，以 `Crono` 的死亡及其直接后续影响为分界点：线性的“实体悲剧”和开放世界的“贤者喜剧”。第一部分是一个冒险游戏，营造了选择的幻觉，以及通过时间影响事件的能力。后半部分则是一个充满谜题和非线性支线任务的游戏，让这种改变历史的力量成为了现实。Holleman
    的二元结构呼应了第一本英文策略指南《Chrono Trigger Player’s Guide》，该书为读者提供了一份“步骤表”和“事件表”，并以 `Crono`
    的死亡为支点。


    `RPG` 玩家通常预期某个重要角色会死去，甚至可能是我们直接控制的某个队伍成员。这些悲剧赋予了队伍新的斗志，有时还有新的技能和道具来帮助他们度过下一个障碍。但以如此突然的方式剥夺队伍的领袖——并让你们在没有任何要求回应的情况下接受这一事实——是一个大胆的举动，违背了传统的叙事结构。


    大多数游戏无法突然砍掉主角并指望玩家留下来。然而，《时空旅》却成功做到了这一点。当然，主角成员死亡的这种新奇感本身不足以留住玩家。正是那些环绕着、支持并最终拯救了
    `Crono` 的角色的力量，让冒险得以继续。在一个英雄很难发声的游戏中，我们很幸运拥有朋友是有话可说的。


    # 像在公元 1999 年一样狂欢吧


    让我来坦诚一个观点吧——我不擅长交朋友。


    并不是说我没有朋友，也不是说我对现有的朋友不好。我只是倾向于将我的核心队伍限制在几个我信任的特定人物身上，让他们陪我走过人生中重要的旅程。许多在我生活中进进出出的熟人是很有价值的
    `NPCs`——他们是为我提供丰富信息、惊喜奖励和任务提示的人。但当我需要时，他们通常不是我会召唤的人。


    你可以选择你的朋友，但不能选择你的家人。这是一句广为人知的格言，强调了亲情（血缘和婚姻）高于友谊的地位。但在《时空旅》中，我们甚至对朋友没有选择。


    除了我们沉默的化身 `Crono` 之外，无论我们做什么，都有五位主要英雄加入我们的队伍——不，我没有忘记他。坐稳了。无论你喜不喜欢，这五个人在游戏过程中都成了我们的扩展家庭，被拯救世界的共同目标所联系在一起。如果我们接受友谊是一种主动选择，那么《时空旅》的主角角色们并不恰恰是朋友。但他们也不是家人——他们中的大多数人都有自己的家庭琐事要处理。相反，他们是既不属于两者又同时属于两者。


    他们是我们的同伴，我们的队伍——那些字面上将会跟随我们直到时间尽头的人。


    •


    这五位响应英雄主义召唤的角色是一群古怪而有趣的群体。每个人都有一种只有他或她才能装备的特殊武器，并且对四种元素之一具有天生的亲和力：雷、水、火和影——而“无属性性”本身就是非官方的第五种元素。这些武器和属性不仅为游戏增加了多样性和策略性挑战，还补充了我们队伍成员的性格设定。


    第一个加入我们团队的人是 `Marle`，一个手持弩箭的女孩，有点爱笑。这个活泼的冒险追求者不浪费时间就评估 `Crono` 是否是一个潜在的男朋友，让他护送她穿过“千年华市”。我们可以像集市上那个八卦的妇人那样，轻易将
    `Marle`（伪装的 `Guardia` `纳迪亚公主`）标记为“女汉”，但这把 `Marle` 过度简化为一个令人困扰的刻板印象，而且她已经背负了“伪装成平民的皇”这种套路。`Marle`
    确实成为了平民 `Crono` 的恋爱对象，尽管更准确的说法可能是他成为了她的对象。


    `Marle` 的元素亲和力是水。水滋养万，是人类的基本生理需求。`Marle` 的治疗技巧在早期战斗中证明是至关重要的。水也是哀伤和泪水的象征。《时空旅》中许多温馨的时刻都涉及到
    `Marle`——如果我们带她去“死亡之巅”将完 Crono` 从时间停滞中拯救出来，我们会看到展现 `Marle` 对他深厚情感的情感场景。


    `Crono` 的另一个主要情感对象是 `Lucca`，一种大姐姐类型。《时空旅》并没有在 `Crono`、`Marle` 和 `Lucca` 之间制造三角恋，不仅让
    `Lucca` 无条件地接受了 `Marle`，还夸奖 `Crono` 到了一个“美女”。


    `Lucca` 是一个才华横溢的发明家（或者根据 `DS` 版本称为发明女），所以她与火元素——激情与创造力的火花——结合是一个恰当的选择。虽然她的发明在镇上以古怪闻名，但她显然是一个天才。`Lucca`
    还是一个专家射击手（尽管没有人对这个词标注性别），她的远程火器镜像了 `Marle` 的弩箭。


    `Crono` 的旅程真正始于 `Lucca` 传送设备的故障，但这在引入 `Marle` 的神秘吊坠之后才发生。这种科学与魔法的碰撞预示了这两个角色最终通过融合水和火亲和力而激活的强大
    `Antipode` 双技。我们应该注意，这些 `Antipode` 魔法的净元素效果产生了影，这与 `Crono` 的元素相反。最初的北美版本掩盖了这一事实——在
    `DS` 翻译中，`Crono` 的元素从最初本地化的“闪电”变成了“光”。`Crono` 的两个影子灵魂之间的意外协作，字面上开启了冒险的大门。


    具体来说，是一扇通往中世纪的大门，在那里我们遇到了名副其实的 `Frog`。一位充满骑士精神的蛙类人和持剑骑士，`Frog` 使用“古英语”对话，既迷人又令人怀疑。在
    `公元 600 年` 没有人说话得像 `Frog` 一样。即使是曾经身为 `Frog` 的 `Glenn` 也不是。因此，我们可以原谅 `Frog` 不知道如何正确中世纪英语——这可能是为了支持他对英雄主义的渴望而做的伪装。


    因为我们这只滑溜溜的绿色家伙的一切都散发着英雄气息。


    作为侍从 `Glenn`，`Frog` 和传奇骑士 `Cyrus`——王室成员 `Guardia` 二世国王和 `Leene` 皇皇的誓约守护者——追踪并夺回了勇气的象征“英雄勋章”。后来，这两位骑士侦探在“德纳多罗山脉”面对反派
    `Magus`。即使身边有传说中的“村雨”，`Cyrus` 仍被 `Magus` 杀害。“村雨”断裂了，被下咒的 `Glenn` 在 `Magus` 魔法的作用下彻底变形坠落在地上。变成
    `Frog` 的 `Glenn` 成功找回了“村雨”的下半部分以及“英雄勋章”，试图用他的蹼脚填补 `Cyrus` 留下的空缺。


    `Frog` 最值得注意的武器就是那把阔剑，它最终将获得巨大的升级。但为了鼓励 `Frog` 发现内在的英雄，我们需要让“村雨”重新完整。在找回了这把断剑的上半剑刃后，队伍委托了导师
    `Melchior` 重造了这件武器。在“魔法洞穴”，`Crono` 并没有把完好的“村雨”交给 `Frog`——而是将其刺入地面。在这里 `Aragorn`
    的断剑 `Narsil` 变成了亚瑟王的 `Excalibur`，正如同 `Frog` 重演了拔剑石的故事。而为什么不能有一把 `Excalibur` 呢？`Guardia`
    皇室军队的高层，终究就是“圆桌骑士”。


