  - 50. 编写程序（WAP），使用一个函数找到字符串在另一个字符串中最后出现。
- - '###'
  - 51. 编写程序（WAP），使用一个函数比较两个字符串，如果字符串相等返回0，如果不相等返回 -1。
- - '###'
  - 52. 编写程序（WAP），使用两个函数 `code()` 和 `decode()`，它们接受一个字符串作为参数。`code()` 函数应该修改字符串，将其除空终止以外的所有字符加1。`decode()`
    函数负责将编码后的字符串恢复为原始。该程序从命令行接受字符串，打印编码后的字符串，然后解码后的字符串。如果命令行没有指定字符串，提示用户输入。
- - '###'
  - 53. 编写程序（WAP），使用一个接受两个字符串作为参数的函数并比较它们，找到两个之间。
- - '###'
  - 54. 编写程序（WAP），使用一个函数分析一行，通过检查每个字符来确定它属于几个类别中的一个。特别是，我们想要统计元音、辅音、数字、空白字符和其他字符的数量。
- - '###'
  - 55. 编写程序（WAP），使用一个函数读取字符数组中的字符，并将字符序写入另一个数组中。假设文本包含80字符。
- - '###'
  - 56. 编写程序（WAP），使用一个函数对位置 `lb` 和 `ub` 之间的元素进行排序（`lb` 是下界，`ub` 是上限）。
- - '###'
