  \             return (i);\n            j=0;\n        }\n        i++;\n    }\n  \
  \  return (-1);\n}\n```\n\n\n\n\n\n```c\n/*output*/\n\nprintf(\"%d\",sum);\n}\n\n\
  int det_mat(int mat[ ][MAXCOL], int r, int c)\n{\n    int i,j,k,sign,sum,a;\n  \
  \  int mat2[MAXROW][MAXCOL]={0};\n    sign = 1;\n    sum = 0;\n    if(c == 1)\n\
  \        return(mat[0][0]);\n    for(i=0 ; i<c; i++,sign *= -1)\n    {\n       \
  \ for(j=1; j<r; j++)\n        {\n            for(k=0;  k<c; k++)\n            {\n\
  \                if(k == i)\n                    continue;\n                if(k>i)\n\
  \                    mat2[j-1][k-1]=mat[j][k];\n                else\n         \
  \           mat2[j-1][k]=mat[j][k];\n            }\n        }\n        sum = sum\
  \ + mat[0][i] * sign * det_mat(mat2,r-1,c-1);\n    }\n    return (sum);\n}\n```\n\
  \n### 填空题\n\n- `return` 语句只返回 `________`。\n- `________` 可以通过包含适当的表达式并将控制权转移到程序的某部分来被赋值。\n\
