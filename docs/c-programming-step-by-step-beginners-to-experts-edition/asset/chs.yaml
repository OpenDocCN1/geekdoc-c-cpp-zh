  ```c\nmain(){\n    char s[7] = \"Strings\";\n    printf(\"%s\",s);\n}\n```\n**输出：**\
  \ `不可预测.`\n在这里，`s[]` 被声明为 7 字符数组，但向其中存储了一个 8 字符的字符串。这将导致超出数组预留的第 7 个字节的字节被 `\"\\\
