  \ Anonymous International 担任线下 IT 经理。\n\n## 作者自述：\n\n你可能注意到这里漏了些东西：没有令人注目的资历。我没有在某著名大学担任过四分之一世纪的教授；不是硅谷巨头的高管。在某些方面，我只是技术的学生，就像你一样。\n\
