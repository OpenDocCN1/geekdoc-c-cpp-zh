  \n\n\n\n\n# 第 10 章：（你的大脑与结构体与联合体）\n（枚举、位域字段、类型定义）\n\n## 引言\n数组是存储相同数据类型对象的首选方法。除了数组，还有三种派生数据类型可以存储信息：结构体、联合体、位域字段、typedef\
  \ 和枚举。与数组不同，这些类型可以存储相同或不同类型的数据。\n\n## 结构体 (Structure)\n结构体可以定义为一种派生数据类型，它可以在单个单元中表示多种不同类型的数据。结构中的每个单独数据项被称为成员（member）。\n\
  \n结构体是将不同类型的数据打包，以更有意义的方式组织数据的方法。结构体定义创建了一个格式，用于声明结构体变量。\n\n结构体定义通过使用关键字 `struct`\
  \ 指定。后面紧跟着大括号，其中包含成员及其数据类型。\n\n例如：\n```c\nstruct student /*结构体定义*/\n{\n    int roll;\
  \       /*成员*/\n    char name [10 ];\n    float per;\n}s1,s2; /*student 类型的对象或变量*/\n\
  ```\n\n结构体的成员不是变量，因此不会为它们分配内存。只有在声明对象（例如 `s1` 和 `s2`）时，它们才会在内存中获得空间。\n\n### 脑操训练\n\
  关键字 `struct` 声明了一个名为 `student` 的结构体，它包含三个不同的细节，即 `roll`、`name` 和 marks。这些字段被称为结构的成员或元素。该结构体命名为\
  \ `student`，该名称称为结构标签（structure tag）。\n\n### 变量/对象声明\n```c\nstruct student s1,s2;\n\
  ```\n结构体变量可以与定义一起声明如下：\n```c\nstruct student\n{\n    int roll;\n    char name[50];\n\
  \    float marks;\n}s1,s2;\n```\n\n### 关于结构体的注意点\n1. 结构体定义以分号结束。\n2. 虽然整个定义被视为一条语句，但每个成员都在定义内部的单独语句中根据其名称和类型进行声明的（也称为模板）。\n\
  3. 标签名甚至可以在之后的 `main` 函数中与结构体定义一起声明。\n4. 内存分配给变量，而不是结构体的成员。\n5. 在数组中，我们可以使用下标操作符\
  \ `[]` 访问单个元素。结构体使用不同的方案。它使用点或周期运算符（`.`）。要引用上述结构体 `s1.marks` 中的 `marks`，变量名放在点之前，成员名放在点之后。\n\
  \n### 脑操训练\n结构体的元素始终存储在连续的内存中。\n```c\nstruct student\n{\n    int roll;\n    char\
  \ grade;\n    int marks;\n};\n\nmain()\n{\n    struct student s1={2, 'A', 89};\n\
  \    printf(\"Address of roll=%u\",&s1.roll);\n    printf(\"Address of grade=%u\"\
  ,&s1.name);\n    printf(\"Address of marks=%u\",&s1.marks);\n}\n```\n此处程序的输出为：\n\
  Address of roll=65518\nAddress of grade=65520\nAddress of marks=65521\n| S1.roll\
  \ | s1.grade | s1.marks |\n| 2 | A | 89 |\n| 65518 | 65520 | 65521 |\n\n### 使用数组的结构体\n\
  ```c\nstruct student\n{\n    int roll;\n    char name[50];\n    int marks;\n};\n\
  \nmain()\n{\n    struct student s1;\n    printf(\"Enter the data for student:\"\
  );\n    scanf(\"%d %s %d\",&s1.roll,s1.name,&s1.marks);\n    printf(\"Rollnumber=%d,\\\
  nname=%s\\nmarks=%d\",s1.roll, s1.name,s1.marks);\n}\n```\n在上面的结构体定义中，使用数组来存储学生的姓名。虽然\
  \ `scanf` 始终在变量名前前包含 `&`，但字符串没有 `&` 算符。\n\n### 结构体数组\n```c\nstruct student\n{\n\
  \    int roll;\n    char name[0];\n    int marks;\n}s[10];\n```\n上述定义使用一个对象数组来存储\
  \ 10 个学生的数据。\n\n### 初始化\n```c\nstruct student s1={1,\"aj\",7.5};\nstruct student\
  \ s2[3]={{1,\"aj\",7.5}, {2,\"vij\",7.5},{1,\"ak\",7.5}};\n```\n脑操训练-如果我们初始化了结构体的某些成员，其他成员将自动初始化为零。\n\
  \n### 结构体中的结构体（嵌套结构）\n结构体中的结构体被称为结构嵌套。当一个结构体对象是另一个结构的成员时。\n```c\nstruct date\n{\n\
  \    int d;\n    int m;\n    int y;\n};\n\nstruct employee\n{\n    int id;\n   \
  \ struct date dob;\n    struct date doj;\n}e1;\n\nmain()\n{\n    printf(\"Enter\
  \ id of a employee\");\n    scanf(\"%d\",e1.id;\n    printf(\"Enter date of birth\"\
  );\n    scanf(\"%d%d%d\",&e1.dob.d, &e1.dob.m,&e1.dob.y);\n}\n```\n脑操训练-在上面的示例中，我们也可以在\
  \ `employee` 结构体的定义内部定义 `date` 结构。\n\n### 结构体与指针\n```c\nstruct student s1,*p;\n\
  p = &s1;\ns1.roll = 5;\n(*p).roll = 7;\nor\np->roll = 7;\nprintf(\"%d\",s1.roll);\
  \ /* 这将打印 7 */\n```\n脑操训练-\n当我们通过对象访问结构体成员时，使用点运算符（`.`）。\n当我们通过指针访问结构体成员时，使用箭头运算符（`->`）。\n\
  ```c\nstruct box\n{\n    int feet;\n    int inches;\n};\n\nvoid swap(struct box\
  \ *, struct box *)\nmain()\n{\n    struct box b1,b2;\n    clrscr();\n    /*输入第一个对象*/\n\
  \    printf(\"Enter height in feet & inches of box 1\");\n    scanf(\"%d%d\",&b1.feet,&b1.inches);\n\
  \    /*输入第二个对象*/\n    printf(\"Enter height in feet & inches of box 2\");\n    scanf(\"\
  %d%d\",&b2.feet,&b2.inches);\n    swap(&b1,&b2);\n    printf(\"After swap height\
  \ of 1ST box- %d feet %d inches\\n\",b1.feet, b1.inches);\n    printf(\"After swap\
  \ height of 2ND box- %d feet %d inches\\n\",b2.feet, b2.inches);\n    getch();\n\
  }\n\nvoid swap(struct box *p1, struct box *p2)\n{\n    int t;\n    /*交换英尺*/\n  \
  \  t = p1->feet;\n    p1->feet = p2->feet;\n    p2->feet = t;\n    /*交换英寸*/\n  \
  \  t = p1->inches;\n    p1->inches = p2->inches;\n    p2->inches = t;\n}\n```\n\n\
  ## 联合体 (Union) -\n\n\n\n\n\n## 联合体 (Union)\n\n`union` 也是派生数据类型。它们被用于将若干变量组合。但区别在于，联合体的所有成员共享相同的内存位置，因此联合体同一时刻只有一个成员可以存储有效值。联合体是一种用于在不同时间存储不同类型数据的变量。\n\
  \n联合体与结构体（structure）非常相似。联合体中定义的不同变量被称为联合体的成员。它们不需要是同一种数据类型。如果一个成员包含一个值，而另一个成员被赋值一个值，那么第一个值会被第二个值覆盖。编译器分配足够的内存来容纳联合体最大的成员。由于内存空间是共享的，这是一种内存内存。\n\
  \n## 语法\n\n```c\nunion <union 类型名称>\n{\n    <类型> <变量名> ;\n    ...\n} [<联合体变量>] ;\n\
  ```\n\n#### 示例\n\n```c\nunion data\n{\n    char c;                   /*成员声明*/\n\
  \    int i;\n    long l;\n    float f;\n} d1,d2;\n```\n\n**脑筋急：** 在上面的示例中，`d1` 和\
  \ `d2` 各获得 4 字节，因为联合体中最大的成员是 4 字节。如果有多个最大字节的成员，则只考虑其中一个。\n\n**脑筋急转：** 在上面的声明中，`union`\
  \ 是一个关键字。\n\n**脑筋急转：** 点运算符（dot operator）用于访问联合体的成员。例如，访问上述联合体的成员：\n\n```c\nd.c\
  \ = 'a';\nd.i = 10;\nd.l = 65534;\nd.f = 72.456;\n```\n\n如果你在这个联合体的 `f` 成员中存储了某些内容，然后访问\
  \ `i` 成员，那么 `i` 的值是不可预测的。\n\n### 结构体与联合体的区别\n\n| | 结构体 (Structure) | 联合体 (Union)\
  \ |\n| :--- | :--- | :--- |\n| 1. | 关键字是 `struct`。 | 关键字是 `union`。 |\n| 2. | 结构对象的内存等于所有成员内存之和。\
  \ | 联合体对象的内存等于联合体最大成员的内存。 |\n| 3. | 所有成员可以同时被使用。 | 仅有一个成员可以存储有效值。 |\n\n## 枚举数据类型\
  \ (Enumerated Data Type)\n\n枚举数据类型是一种带有用户指定常量值的数据类型。其语法与结构体或联合体相似：它用于定义常量。关键字是 `enum`。后面紧跟枚举符类型。这是一个允许该数据类型的值的名称列表。值被包含在大括号中，并用逗号分隔。\n\
  \n#### 示例\n\n1. `enum bool{FALSE ,TRUE};` /*false 和 true 是值为 0 和 1 的常量。这种编号是自动完成的*/\n\
  \   `enum bool b1,b2;` /*enum bool 的对象*/\n   `b1 = FALSE;`\n   `b1 = TRUE;`\n\n\
  2. `enum dow{SUN,MON,TUE=5,WED,THU,FRI,SAT};` /*自动编号为 SUN=0,MON=1,TUE=5,WED=6 等此类类推*/\n\
  \n3. `enum color{blue, red, yellow}; enum color c1,c2;`\n   `c1 = red;`\n   `c2\
  \ = green;`\n\n4. `enum color{blue, red, yellow} c1,c2;`\n   `c1 = red;`\n   `c2\
  \ = green;`\n\n5. `enum color {blue=10, green=15, red=25, yellow=30};` 如果我们不想要默认值\
  \ 0,1,2…那么我们可以赋值。声明枚举类型不分配存储空间，但描述了类型。在大括号中给出值。这样 `enum`，描述用户指定的数据类型。\n\n**脑筋急转：**\
  \ 我们可以在联合体中为 `enum` 使用别名。\n**脑筋急转：** 在联合体中提供别名。\n\n### 位域 (Bit Fields)\n\n位域用于在程序中存储\
  \ 0 或 1 的变量，只需要一个位来存储它。同样，如果变量范围 0 到 3，则需要两个位。如果范围 0 到 7，则需要四个位。但如果存储整数则会使用 2 字节，因此浪费了大量内存，而位域处理位。假设我们要存储关于俱乐部成员的以下数据。每个成员可以：\n\
  1. 男性或女性。\n2. 已婚或未婚或寡妇。\n3. 任何爱好（足球等）。\n4. 任何一种计划（年度计划、每月计划等）。\n\n如果我们用 `gender`\
  \ 代替存储 0 或 1，这将节省一些字节。以相同的方式，其他值可以转换为数字。这样我们需要 10 个位，因此可以将所有信息封装在 2 字节中。\n\n因此声明如下：\n\
  \n```c\nstruct employee\n{\n    int gender:1;\n    int mar_status:2;\n    int hobbies:3;\n\
  \    int scheme:4;\n};\n```\n\n声明中的冒号告诉编译器我们正在讨论位域，后面的数字告诉分配给变量的位数。\n\n## typedef\n\
  \nC 语言提供了 `typedef` 结构，允许程序员为内置或用户定义的数据类型提供别名（相同名称）。`typedef` 就像给数据类型起绰号。程序更容易追踪和理解。`typedef`\
  \ 的通用用法是：\n\n`typedef 旧类型 新类型;`\n\n例如：\n`typedef int age;`\n这里 `age` 变成了 `int` 的别名。所以我们可以用\
  \ `age` 代替 `int`：\n`age a1,a2;` 或 `int a1,a2;`\n现在 `age` 可以用于定义 `int` 变量 `a1` 和\
  \ `a2`。\n\n**脑筋急转：** 在 `typedef` 的语法中。首先是关键字 `typedef`，然后是数据类型，最后是用户提供的名称。`typedef`\
  \ 仅用于创建类型的别名。在 `typedef` 中，不能定义变量，也不会分配存储空间。\n例如，写成是错误的：`typedef int age a1,a2;`\
  \ /*无效*/\n\n### 使用结构的 typedef\n\n```c\ntypedef struct student\n{\n    int roll;\n\
  \    char name[50];\n    int marks;\n} st;\n\nmain()\n{\n    st s1,s2;\n    s1.roll\
  \ = 1;\n    s2.roll = 2;\n}\n```\n\n`typedef` 名称可以与结构体的标签名（tagname）相同。\n\n\n\n\n\
  \n5. 指向结构体的指针可以声明为 ____________________________。\n6. 结构体提高了程序的 ________________________________。\n\
  7. 结构体用于 ______________________________________________________________。\n8. 结构体的大小是\
  \ ______________________________________________________。\n9. 一组互不相关的异构对象集合被称为 _。\n\
  10. 联合体（union）的所有成员共享同一个 ______。\n11. 联合体的大小是 _________________________________\
  \ 。\n12. `typedef` 用于创建 ___________________________。\n13. `typedef` 的语法是 _________________________________。\n\
  \n\n\n### 答案\n\n1. structure\n2. `struct`\n3. objects\n4. `.` (点号) 或 `->` (箭头运算符)\n\
  5. `struct tag_name *ptr_to_pointer`\n6. 可读性\n7. 系统编程\n8. 所有数据成员和子成员的大小之和。\n9. union\n\
  10. 内存空间\n11. 成员中所需的最大内存空间。\n12. 新数据类型名称\n13. `typedef <name> <new name>`\n\n##\
