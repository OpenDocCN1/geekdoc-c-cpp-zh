  \n# 章节：∞ 第 20 部分 – 第二部分 ∞\n(操作系统开发)\n\n## 操作系统开发绪论-\n1. 强大的 API 函数。\n2. 函数共享。\n\
  3. 应用程序的外观与感受。\n4. 硬件无关编程。\n5. 事件驱动编程模型。\n6. Dos 模型。\n\n### 1. 强大的 API 函数\nWindows\
  \ 内部提供了可以被其他用户定义函数或库调用的函数。这些 Windows 函数被称为 `API`，即应用程序接口。这里有数百个非常丰富的函数可用。\n\n它们不仅帮助应用程序执行简单任务（如创建窗口、画线、执行文件输入/输出），还能处理复杂的任务（如连接端口、与网络进行接接口、修改位图、播放\
  \ mp3 文件等）。Windows 编程的关键在于使用这些 `API` 函数，并有效地利用它们来轻松地创建功能丰富的应用程序。\n\n### 2. 函数共享。\n\
  在运行 Windows 程序期间，会调用多个 `API` 函数。想象一下，如果每个函数都成为每个程序 `.Exe` 文件的一部分，将会浪费多少磁盘空间。为了避免这种情况，`API`\
  \ 函数被定义在具有特殊扩展名 `.DLL` 的特殊文件中，`.DLL` 代表“动态链接库”。\n\n这些是二进制文件。`.dll` 文件中提供的函数可以在执行或安装期间进行链接。当多个程序在\
  \ Windows 下运行时，所有这些函数都可以共享相互调用。\n\n这些函数之间的链接是动态完成的（在执行期间）；这些函数不会成为可执行文件的一部分。因此，`Exe`\
  \ 文件的尺寸不会失控。你也可以创建自己的 `DLLs`，因为这样做基于两个原因：\n\n(a) 在不同的可执行文件之间共享通用代码。\n(b) 将应用程序拆分为称为段（segments）的组件。\n\
  \n提供轻松升级应用程序组件的方法。\n\n### 3. 外观与感受一致性\n这意味着每个程序都提供了一个一致且半线性的用户界面。因此，用户不需要花费大量时间来掌握新程序。每个程序占用一个窗口——计算机屏幕上的一个矩形区域；窗口通过其个人的标题栏进行标识。\n\
  \n大多数程序的功能通过程序的菜单启动。如果信息很多，则使用滚动条、对话框输入某些用户信息。一旦你学会了如何使用一个窗口程序，就可以轻松地理解另一个。键盘和鼠标的交互。\n\
  \n### 4. 硬件无关编程\n正如我告诉你的，窗口 程序可以轻松调用 Windows `API` 函数，因此应用程序可以轻松与操作系统通信，那么 Windows\
  \ 是如何轻松与硬件通信的呢？\n\n假设我们有一个程序，其中包含一个菜单项，选中后应在窗口中显示字符串“welcome to ever research labs\
  \ India”。该菜单项可以通过键盘或鼠标选择。在执行此程序时，它将执行初始化，然后等待用户输入。\n\n在用户输入任何按键或点击鼠标选择菜单项后，这种按键或鼠标点击正如你熟悉的\
  \ Visual Basic 编程那样，被称为“事件”（event）。该事件的发生由键盘或鼠标驱动程序感知。现在，设备驱动程序会将此通知 Windows。\n\n\
  Windows 随后会通知应用程序该特定事件的发生。这种通知被称为“消息”（message）；因此操作系统与应用程序进行了通信。\n\n当应用程序接收到消息时，它通过调用\
  \ Windows `API` 函数与操作系统回传，在该 `API` 函数中显示字符串“welcome to EVC research labs India”，该\
  \ `API` 函数反过来与驱动屏幕的显卡驱动程序通信以显示该字符串。因此，操作系统和应用程序之间存在双向通信。\n\n### 5. 事件驱动编程模型\n当用户与\
  \ Windows 程序交互时，会发生很多事件。对于每个事件，都会向程序发送一条消息，程序对其做出反应。由于无法预测用户与程序界面元素交互的顺序，因此事件发生的顺序变得不可预测。结果是，程序中调用函数的顺序是由事件的发生决定的。因此，这种模型被称为“事件驱动模型”。\n\
  \n\n\n\n另外一点非常重要，微处理器可以访问的内存容量取决于`cpu`寄存器的大小。这意味着我们可以在不同时间在`cpu`寄存器中存储 $2^{32}$\
  \ 个唯一地址；因此我们可以使用 `32-bit` 寄存器访问 `4 GB` 内存位置。在我们的程序中，`32 bit` 地址必须存储在指针中，不要忘记 `32-bit`\
  \ 环境下的每个指针都是一个 `4 byte` 的实体。\n\n## 2. 整数的大小：\n\n我想告诉你们，在 `16 bit` 环境下，整数的大小为 `2\
  \ bytes`；另一方面，在 `32 bit` 环境下，`interger`的大小为 `4 bytes`。`32 bit` 之后，整数的范围变为 `-2147483648`\
  \ 到 `+2147483647`。借此你认为 `int` 和 `long int` 之间没有区别，但如果我们想存储一个人的年龄呢？我们知道年龄很难超过 100\
  \ 岁，在这种情况下，使用 `short int` 是最好的。\n\n## 3. 大量使用 typedef：\n\n如果我编写以下声明——\n\n```c\n\
  HANDLE h;\nWAPRAM w;\nLPARAM I;\n```\n\n这些是数据类型吗？\n\n不，它们是 `typedef’s`，好吗。\n\n为什么\
  \ windows 下的 c 程序大量使用 `typedef`？\n\n它有两个原因！！\n\n### (A)\n一个典型的窗口程序需要执行几项复杂任务，例如：打印文档、发送邮件、执行\
  \ i/o、管理多个线程、数据处理任务等，所有这些任务都需要整数。但如果我们使用普通的 `interger` 数据类型来表示持有不同实体的普通变量，我们很快就会忘记这些整数值实际上代表的是什么，这通过使用\
  \ `typedef’s` 来解决，好吗！！\n\n### (B)\n在窗口程序编程中，许多地方我们需要收集并处理不同但相互相关的数据。这可以使用结构体（structure）来实现。\n\
  \n#### 注意：\n\n- 为窗口程序编程使用 `32 bit` 编译器，如 `visual c++`。\n- 使用头文件 `windows.h`。\n\n\
  我们在 windows 下的第一个“c” 编程。\n\n150. 借助 `32 bit` 示例：`ms visual c++` 编译器编写打印 hello! 的程序。\n\
  \n```c\n#include<windows.h>\n\nInt_stdcall WinMain(HINSTANCE hlnstance, HINSTANCE\
  \ hprevlnstance, LPSTR pszCmdline, int nCMDShow)\n{\n    MessageBox(0,”Hello!”,”Title”,0);\n\
  \    Return(0);\n}\n```\n\n#### 大脑强化训练笔记：\n\n1. 为 `32 bit` 操作系统开发始终使用 `32 bit` 编译器，如\
  \ `microsoft visual c++`；或者为 `64 bit` 操作系统开发使用 `64 bit` 编译器，好吗！！\n\n2. 我想告诉你们，每个\
  \ `dos` 程序的执行都从 `main()` 函数开始；另一方面，正如你们看到的，每个窗口程序都从 `WinMain()` 函数开始执行。\n\n3. `WinMain()`\
  \ 之前使用了 `_stdcall`-它显示了 `WinMain()` 函数使用的调用约定，调用约定规定了两个点：\n   (a) 在调用函数时参数推入栈的顺序（从左到右或从右到左）！\n\
  \   (b) 调用者函数或被调用函数在调用结束时从栈中移除参数。有很多调用约定可用，如 `_cdecl` 和 `_stdcall`，这两种调用约定都从右到左传递参数。所有\
  \ `API` 函数都使用 `_stdcall`，如果没有提到，编译器假设使用 `_cdecl` 约定，好吗！！\n\n4. `HINSTANCE` 和 `LPSTR`\
  \ 仅仅是 `typedef’s`。第一个是 `unsigned int`，第二个是指向 `char` 的指针。这些 `typedefs` 定义在‘windows.h’\
  \ 中。在编写任何“c”程序时，这个头文件始终包含这些 `typedef’s`。\n\n5. `HINSTANCE`、`LPSTR`、`hlnstance`、`pszCmdline`\
  \ 和 `nCMDShow` 用于 `WinMain` 函数。\n\n`WinMain` 解析：\n\n- `HINSTANCE`: 这是一个 `unsigned\
  \ int`。\n- `LPSTR`: 这是一个指向 `char` 的指针。\n- `hlnstance`: 这是应用程序实例的句柄。\n- `hprevlnstance`:\
  \ 这是上一个实例的句柄。\n- `pszCmdline`: 这是指向命令行参数的指针。\n- `nCMDShow`: 这是一个指示窗口应如何显示的整数。\n\n\
  - `MessageBox()`：此函数用于显示消息框。\n- `Return(0)`：向系统返回 0，表示成功。\n\n---\n\n# 第 21 章 - 第二部分（编程指南）\n\
  \n## 引言\n\n本章解释了如何编写运行良好的结构化程序。以下是对结构化特性的一些快速回顾：\n\n1. 许多定义良好的函数！\n2. 使用循环结构（即 `while`\
  \ 和 `for`）代替 `goto`。\n3. 使用具有单一用途和有意义名称的变量。\n4. 使用数据类型来表示复杂数据。\n5. 使用 ADT（抽象数据类型）或\
  \ OOP（面向对象编程）范式。\n\n## 如何开始\n\n编程时常见的错误类型有：\n\n1. 在不思考的情况下编程。\n2. 以杂乱的方式编写代码。\n\n\
  ### 1.1 思考编程\n\n当一个真正的程序员（或编程团队）被给一个问题时，他们不会立即坐在终端前开始输入代码。他们首先通过思考寻找可能的解决方案来设计程序。\n\
  \n### 自顶向下设计\n\n自顶向下设计将程序划分为若干个子任务。每个子任务都是必须解决的小较问题。通过使用算法来解决问题。程序中的函数（和数据）实现了算法。在编写实际代码之前，取一个非常小的问题，并手动推演所选算法是如何解决它的。\n\
  \n\n\n\n1. 它检查算法以查看它是否真的对给定的问题有效。（如果它不起作用，你可以立即寻找另一种算法。请注意，如果你立即开始编码，可能在输入了大量代码后才会发现该算法不可行！）\n\
  2. 确保你理解了算法实际上是如何运作的！（如果你无法通过手算推演算法，你就无法编写出程序来实现它！）\n3. 它为你提供了算法简短、简单运行的详细过程，这些过程在稍后调试代码时可以使用。\n\
  \n只有当你确信自己理解整个程序的结构后，才应该开始编写代码。\n\n## 1.2 结构化编程\n\n当程序被结构化时，它被划分为可以单独测试的子单元。这在调试时是一个巨大的优势！子单元中的代码可以与程序的其余部分分开调试。我发现在编写每个子单元时对其进行调试非常有用的。如果等到整个程序写完才进行调试，调试工作将变得困难得多。\n\
  \n必须搜索整个程序以查找 bug。如果对子单元进行单独调试，需要搜索 bug 的源代码就会小得多！将程序的子单元存储在[单独源文件](http://www.drpaulcarter.com/cs/module.php)中可以更容易地进行单独调试。\n\
  \nADT（抽象数据类型）和 OOP（面向对象编程）范式也将程序分为子单元。通常使用这些方法，子单元比普通的结构化代码更加独立。这有两个主要优势：\n\n1.\
  \ 子单元更容易单独调试。\n2. 子单元可以在其他程序中重用。（因此，新程序可以使用早期程序中已经调试过的子单元！）\n\n子单元通常通过编写一个很小的驱动程序来单独调试。驱动程序为子单元应该解决的子任务设置数据，调用子单元执行其子任务，然后显示结果以便进行检查。\n\
  \n当然，以下所有的调试方法都可以用于调试子单元，就像它们可以用于调试整个程序一样。再次强调，子单元的优势在于它们只是程序的一部分，因此比同时调试整个程序要容易！\n\
  \n## 2. 编译程序\n\n输入程序（或程序的某个[子单元](http://www.drpaulcarter.com/cs/debug.php#structured)）后的第一步是编译程序。编译过程将你编写的源代码文件转换为机器语言，并存储在对象文件中。这被称为编译。\n\
  \n在大多数系统中，对象文件会自动与系统库链接。这些库包含了语言库部分函数的代码。（例如，C 库包含了 `printf()` 函数的代码。）\n\n## 2.1\
  \ 编译器错误\n\n每种语言都有语法规则。这些规则决定了语言中哪些语句是合法的，哪些是不合法的。编译器程序旨在强制这些规则。当规则被违反时，编译器会打印错误信息且不会创建对象文件。\n\
  \n大多数编译器在遇到错误后会继续扫描源文件并报告发现的其他错误。然而，一旦发现错误，编译器可能会被后续完全合法的语句误导，并将它们报告为错误。这引出了编译器错误的第一条规则：\n\
  \n### 编译器错误的第一规则\n\n列出的第一个编译器错误总是真实的错误；但后续错误可能不是真实的错误。\n\n当移除第一个错误时，后续错误可能会消失。因此，如果后续错误信息令人困惑，请忽略它们。修复你确定是错误的错误并重新编译。当移除其他真实错误后，那些困惑的错误可能会神奇地消失。\n\
  \n如果你有许多错误，第一个错误可能会滚出屏幕。解决这个问题的一种方法是使用[重定向](http://www.drpaulcarter.com/cs/unix-intro.php#Redirect)\
  \ 将错误保存到文件中。一个问题是错误被写到 `stderr` 而不是 `>` 重定向运算符使用的 `stdout`。\n\n使用 `2>` 运算符将输出重定向到\
  \ `stderr`。\n\n这里有一个示例：\n\n```bash\n$cc x.c 2>errors\n                         \
  \      $more errors\n```\n\n编译器只是由其他人类创建的程序。它显示的错误信息往往是令人困惑的（或者干脆是错误的！）。不要假设错误信息所指的行号总是是真实错误实际所在的行。\n\
  \n编译器从上到下顺序扫描源文件。有时，在实际错误所在下方很多行之后，编译器才检测到错误。由于编译器往往太愚笨了，无法意识到这一点，只会引用源文件中它意识到某处不对的那几行。真实错误在代码更靠前的地方。这引出了编译器错误的第二条规则：\n\
  \n### 编译器错误的第二规则\n\n编译器错误可能由编译器所引用的行之上的任何源代码行引起；但它不可能由该行下方的行引起。\n\n在 C（以及 C++）中，不要忘记\
  \ `#include` 预处理语句会将头文件的代码插入源文件中。头文件中的错误可能会导致编译器引用主源文件中的某行的错误。\n\n大多数系统允许将预处理后的代码（C\
  \ 编译器实际编译的代码）存储在文件中。这让你能够确切看到正在编译的内容。该文件还会显示每个 C 宏是如何展开的。这对于发现通常非常难以找到的错误原因非常有帮助。\n\
  \n寻找困惑的编译器错误原因的一种有效技术是删除（或注释掉）之前的代码部分，直到错误消失。当错误消失时，最后被移除的部分一定导致了错误。\n\n编译器还可以显示\
  \ `warnings`（警告）。警告不是语法错误；但它可能是程序中的逻辑错误。它标记了程序中一条合法但可疑的语句。\n\n除非你理解为什么生成该警告，否则你应该将警告视为错误。通常可以为编译器设置不同的警告级别。将此级别设置得尽可能高对你有利，这样可以让编译器给出尽可能多的警告。请非常仔细地查看这些警告！\n\
  \n### 大脑洗脑训练\n\n记住，仅仅因为程序在没有错误或警告的情况下通过编译，并不意味着程序是正确的！它仅意味着程序的每一行在语法上都是正确的。也就是说，编译器理解了每个语句要做的操作。程序可能仍然有很多逻辑错误！一篇英文论文在语法上可能是正确的（即名词、动词等位于正确的位置），但内容可能是胡言乱语。\n\
  \n## 2.2 链接错误\n\n链接器是一个将对象文件（包含来自单个源文件的编译后的机器码）和库（对象文件集合的文件）链接在一起以创建可执行程序的程序。\n\n\
  链接器将对象文件中使用的函数和全局变量与其他文件中的定义匹配。链接器使用函数或全局变量的名称（通常使用终端符号）来执行匹配。\n\n最常见的链接错误是未解析的符号或名称。当使用了函数或全局变量但链接器找不到匹配项时，就会发生这种错误。例如，在\
  \ IBM AIX 系统上，错误信息如下：\n\n```\n0706-317 ERROR: Unresolved or undefined symbols detected:\n\
  \n错误中的符号（后跟引用）已转储到加载映射。\n```\n\n使用 `-bloadmap:<filename>` 选项可以创建一个加载映射。\n\n\n\n\n\
  \n此信息意味着程序中引用了一个名为 `fun`（忽略点）的函数（或全局变量），但从未定义过。这些错误通常有两种常见原因：\n\n### 1. 函数名称拼写错误-\n\
  \n在上面的示例中，有一个名为 `func` 的函数。这**不是**编译器错误。一个源文件中的代码可以使用另一个文件中定义的函数。编译器假设任何在引用文件中被引用但未在该文件中定义的函数，将在其他文件中被定义并链接。\n\
  \n只有在链接阶段，这种假设才能被检查。（注意，C++ 编译器通常会对此生成编译器错误，因为 C++ 要求对**所有**被引用的函数都进行原型声明！）\n\n\
  ### 2. 未链接正确的库或对象文件\n\n链接器必须知道形成可执行程序需要哪些库和对象文件。标准 C 库会自动链接的。UNIX 系统（如 AIX 系统）**不会**自动链接标准\
  \ C 数学库！要在 AIX 系统上链接数学库，请在编译命令中使用 `-lm` 标记。例如，要编译一个使用 `sqrt` 的 C 程序，输入：`cc prog.c\
  \ –lm`。\n\n请记住，`#include` 语句仅将文本插入到源文件中。认为它也会链接相应的库是一个常见的`误区`！链接器`从不`看到这条语句！\n\n\
  还有一些与链接器相关的 bug。当一个函数或全局变量存在两个定义时，会出现一个难以发现的 bug。链接器将选择它找到的第一个定义并忽略另一个。某些链接器在发生这种情况时会显示警告信息（AIX\
  \ 链接器不会！）\n\n另一个与链接相关的 bug 发生在调用函数时使用了错误的参数。链接器在匹配时只查看函数名称。它不进行任何参数检查。这里有一个例子：\n\
  \n文件：`x.c`\n```c\nint f( int x, int y)\n{\n    return x + y;\n}\n```\n\n文件：`y.c`\n\
  ```c\nint main()\n{\n    int s = f(3);\n    return 0;\n}\n```\n\n这类类型的 bug 可以通过使用原型声明来防止。例如，如果在\
  \ `y.c` 中添加原型声明：`int f( int, int);`，编译器将捕捉到此错误。实际上，最好的主意是将原型放在头文件中，并在 `x.c` 和 `y.c`\
  \ 中包含它。为什么要使用头文件呢？\n\n为了让所有文件都使用的原型只有一个实例。如果在每个源文件中手动输入一个独立的实例，就无法保证每个实例都是相同的。\n\
  \n如果只有一个实例，它就不可能自身不一致！为什么要把它们包含在 `x.c`（定义函数的文件）中？以便编译器可以检查原型声明，并确保它与函数的定义一致。（补充说明：C++\
  \ 使用了一种名为 `name mangling`（名称修饰）的技术来捕捉此类错误。）\n\n### 3. 运行时错误-\n\n运行时错误发生在程序运行时，通常会导致程序中止。在\
  \ UNIX/Linux 系统上，中止的程序会创建一个 `coredump`（核心转储）。\n\ncoredump 是一个名为 `core` 的二进制文件，包含了有关程序状态的信息。如\
  \ `gdb` 这样的调试器可以告诉你程序在中止时正在做什么。有几种类型的错误：\n\n#### 非法内存访问\n\n这可能是最常见的错误类型。在 UNIX/Linux\
  \ 下，程序将`coredump`。然而，如果定义了 `NDEBUG`，`assert` 则不会执行。\n\n#### 除以零\n\n在许多操作系统中，程序将`coredump`。然而，如果定义了\
  \ `NDEBUG`，`assert`则不会执行。\n\n#### 段错误-\n\n### 4. 调试工具-\n\n许多调试方法是将输出结果与预期行为进行比较。调试工具允许你详细检查。\n\
  \n#### 4.1 assert 宏\n\n`assert` 宏是在程序中加入测试的一种快速且简单的方法。要使用它，你必须在文件顶部包含 `assert.h`。其格式为：\n\
  \n```\nassert(boolean or int expression);\n```\n\n如果表达式求为真，`assert` 什么都不做。然而，如果它求为假，`assert`\
  \ 会打印错误信息并中止程序。一个例子，考虑：\n\n```c\nassert(x != 0);\n```\n\n如果 `x` 为零，将显示以下内容：`Assertion\
  \ failed: x != 0, file err.c, line 6`。\n\n`assert` 宏对于程序进行健全性检查非常有用。这些是程序在正常工作时应该始终为真的条件。它不应该用于用户检查（例如，请求的文件不存在时）。如果定义了\
  \ `NDEBUG`，`assert` 绝对不起作用。要启用它，只需删除定义 `NDEBUG` 的行即可。\n\n#### 4.2 打印语句\n\n这种方法涉及在程序中大量插入调试打印语句。打印语句应该显示程序正在执行哪些代码以及变量具有什么值。\n\
  \n#### 4.3 调试器\n\n之前那种添加打印语句的方法有两个缺点：\n1. 当添加新的打印语句时，必须重新编译程序。\n2. 输出信息是固定的，无法在程序运行时进行更改。\n\
  \n源码级调试器提供了一种更简单的方法来跟踪程序的执行。它们允许：\n1. 在程序运行时查看任何变量的值。\n2. 当程序到达任何所需的语句时暂停执行。（程序中的此位置称为`断点`）。\n\
  3. 逐语句地单步执行程序。\n\n我`强烈`建议你学习使用你所在系统上的调试器。调试器可以在调试程序时节省大量时间！\n\n#### 4.4 Lint\n\n\
  `lint` 程序用于检查 C 程序中的常见 bug。它扫描你的源代码并打印出可能的问题。请注意，`lint` `非常`挑剔！例如，这一行：\n\n```c\n\
  printf(\"Hello, World \");\n```\n\n会产生一条警告信息，因为 `printf` 返回一个整数值但没有存储。有几种方法可以让 `lint`\
  \ 满意这条语句，其中一种是：\n\n```c\n(void) printf(\"Hello, World \");\n```\n\n#### 4.5 走查 -\n\
  \n`walk through`（走查）是一个手动检查程序逻辑的过程。程序员和另一个人坐（最好是另一个程序员，但其他人也可以），并过一遍程序。\n\n\n\n\n\
  \n- 示例案例。通常是程序员本身在解释程序应该如何工作以及仔细检查其代码的过程中发现了错误（bug）。\n\n然而，程序员很容易“知道”程序本该在做什么，但却对程序实际在做什么视而不见。\n\
  \n学生们在与其他学生一起使用这种方法时需要非常小心。同一个班的两个学生不应该一起走一遍程序的流程。\n\n## 5. 通用技巧\n\n这里有一些调试程序的通用通用技巧。\n\
  \n### 5.1 寻找错误\n\n在删除错误之前，必须先发现它们！\n\n- 激进地测试程序！\n- 从可以容易手头检查的小问题开始。（你应该已经从[规划阶段](http://www.drpaulcarter.com/cs/debug.php#thinking)\
  \ 解决了其中一个问题了！）\n- 至少测试程序的每个功能一次！但测试一次真的够吗？如果可能，请以不同的方式测试功能。\n- 不要忘记测试一些细微的问题。\n\
  - 不要对输入数据做出无效假设。\n\n### 5.2 确定错误原因\n\n错误只能由程序中已经执行的代码引起。确保你不要浪费时间去搜索尚未运行的代码。可以使用调试器或打印语句来确定哪些代码已经执行，哪些尚未执行。\n\
  \n不要通过盲目地修改代码直到它看起来运行正常来修复错误。你需要弄清楚为什么一条语句有效而另一条无效。你应该为每一行代码提供一个充分的理由。“没有这一行就不行”并不是一个好的理由！\n\
  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n## 章节：∞ 22 部分 – 第二部分 ∞\n(常见 C 语言错误)\n\
  \n## 引言\n\n### 错误 (Bug)\n\n软件错误是计算机程序或系统中的错误、缺陷、故障或失效，导致其产生错误或意外的结果，或以非预图的方式运行。大多数错误源于人在程序源代码或设计中犯的失误和错误，或者源于此类程序使用的框架和操作系统，少数错误是由编译器产生错误代码引起的。\n\
  \n包含大量错误和/或严重干扰其功能的错误的程序被称为“多错误的（buggy）”。详细说明程序错误的报告通常被称为错误报告、缺陷报告、故障报告、问题报告、麻烦报告、变更请求等。\n\
  \n### 错误是如何进入软件的\n\n在软件开发项目中，“失误”或“故障”可以在开发期间任何阶段引入。错误是编程任务中人为因素性质导致的结果。它们源于软件团队在规范、设计、编码、数据录入和文档编写过程中产生的疏忽或相互误解。\n\
  \n例如，\n\n在创建一个相对简单的程序来将单词列表按字母顺序排序时，人的设计可能没有考虑当单词包含连字符时会发生什么。也许，当将抽象设计转换为所选编程语言时，\n\
  \n## 预防\n\n软件行业在寻找防止程序员在编写软件时无意引入错误的方法方面了大量努力。这些包括：\n\n### 编程风格\n\n程序代码中的拼写错误通常会被编译器捕获，但当程序员犯逻辑错误时，错误就会出现。编程风格和防御性编程的各种创新旨在降低这些错误的概率，或使其更容易发现。\n\
  \n在某些编程语言中，所谓的拼写错误（特别是符号或逻辑/数学运算符）实际上代表了逻辑错误，因为这些错误的构造被编译器接受时，其含义与程序员的意图不同。\n\n\
  ### 编程技术\n\n错误经常会在运行程序的内部数据中产生不一致性。可以编写程序在运行时检查其内部数据的一致性。如果遇到不一致性，程序可以立即停止，以便定位并修复错误。或者，程序可以简单地通知用户，尝试修正不一致性并继续运行。\n\
  \n### 开发方法论\n\n有几种方案用于管理程序员活动，以便产生更少的错误。其中许多属于软件工程范畴（该领域也处理软件设计问题）。例如，使用形式程序规范来阐述程序的精确行为，从而消除设计错误。\n\
  \n遗憾的是，由于组合爆炸和不确定性问题，对于极短程序以外的所有程序，形式化规范是不切实际或可能的[需要引用]]。\n\n在现代社会，流行的方法包括自动化单元测试和自动化验收测试（有时会达到测试驱动开发的极端），以及敏捷软件开发（通常与自动化测试结合，在某些情况下强制要求自动化测试）。\n\
  \n所有这些方法都旨在并在错误和不规范的需求引入后立即捕获它们，这应该使修复变得更容易、更廉价，并在它们进入生产环境之前至少捕获一部分。\n\n### 编程语言支持\n\
  \n编程语言通常包含有助于防止错误的特性，例如静态类型系统、限制的命名空间和模块化编程等。例如，当程序员编写（伪代码）`REAL_VALUE = \"THREE\
  \ AND A BIT\"` 时，尽管这在语法上可能是正确的，但代码未能通过类型检查。取决于语言和实现，这可能由编译器捕获或在运行时捕获。\n\n此外，许多最近发明的语言排除了容易导致错误的特性，代价是让代码比应有的慢；其通用原则是，由于摩尔定律，计算机变得越来越快而软件工程师变得越来越慢；编写更简单、更慢的代码比编写“聪明”、晦涩的代码要好得多，尤其是考虑到维护成本是巨大的。例如，`Java`\
  \ 编程语言不支持指针算术；`Pascal` 等某些语言的实现以及脚本语言会对数组进行运行时检查，至少在调试版本中。\n\n### 代码分析\n\n代码分析工具通过检查编译器能力之外程序文本来发现潜在问题，帮助开发者。尽管对于给定规范寻找所有编程错误是不可解决的（参见停机问题），但这些工具利用了人类程序员在编写软件时倾向于犯同类错误的事实。\n\
  \n### 监测\n\n监控运行软件性能的工具（无论是为了寻找瓶颈等问题，还是为了确保运行正确）可以显式地嵌入代码中（可能简单如 `PRINT \"I AM HERE\"\
  `），也可以作为工具提供。发现某段代码占据了大部分时间通常令人惊讶，而这种对假设的消除可能会导致代码被重写。\n\n### 调试\n\n调试是一个寻找并减少错误（或缺陷）数量的系统化过程，从而使计算机程序的行为符合预期。寻找并修复错误（或“调试”）一直一直是计算机编程的重要组成部分。\n\
  \n早期计算先驱 Maurice Wilkes 在 20 世纪 40 年代后期描述了他的感悟：他意识到自己后余生的大部分时间将花在寻找自己程序中的错误上。\n\n\
  \n\n\n通常，程序员在寻找和修复 bug 上花费的时间精力比编写新代码多。软件测试人员是专业人士，他们的首要任务是寻找 bug，或者编写代码来支持测试。在某些项目中，用于测试的资源可能比开发程序的资源还要。\n\
  \n通常，调试最困难的部分是在源代码中找到 bug。一旦找到它，修复它通常相对容易。存在一些被称为调试器（debuggers）的程序，它们通过逐行执行代码、观察变量值以及其他观察程序行为的功能来帮助程序员定位\
  \ bug。\n\n在没有调试器的情况下，可以添加代码将消息或值写入控制台（例如在 C 语言中使用 `printf`）或写入窗口或日志文件，以追踪程序的执行情况或显示变量值。\n\
  \n然而，即使有调试器的帮助，定位 bug 也是一种艺术。程序中某部分的 bug 导致完全不同部分发生故障的情况并不见，这使得追踪它变得特别困难（例如，图形渲染例程中的错误导致文件\
  \ I/O 例程失败），且发生在系统中看似不相关的部分。\n\n## 引言\n\n本章列出了作者反复看到的常见 C 语言错误，同时也给出了这些错误的解决方案。\n\
  \n# 2. 初学者错误\n\n这些是初学 C 学生经常犯的错误。然而，专业人士有时也会犯这些错误！\n\n## 2.1 忘记在 `switch` 语句中放入\
  \ `break`\n\n记住，当遇到 `case` 时，C 不跳出 `switch` 语句。例如：\n\n```c\nint x = 2;\n\nswitch(x)\
  \ {\ncase 2:\n  printf(\"Two\\n\");\ncase 3:\n  printf(\"Three\\n\");\n}\n```\n\n\
  输出：\n```\nTwo\nThree\n```\n\n加上 `break` 来跳出 `switch`：\n\n```c\nint x = 2;\n\nswitch(x)\
  \ {\ncase 2:\n  printf(\"Two\\n\");\n  break;\ncase 3:\n  printf(\"Three\\n\");\n\
  \  break;  /* 没有必要，但如果以后添加额外的 case，这样更好 */\n}\n```\n\n## 2.2 使用 `=` 代替 `==`\n\n\
  C 的 `=` 运算符专门用于赋值，并返回被赋值的值。`==` 运算符专门用于比较，并返回一个整数值（0 为 `false`，非 0 为 `true`）。由于这些返回值，当人们实际上是想用\
  \ `==` 却使用了 `=` 时，C 编译器通常不会标记错误。\n\n例如：\n\n```c\nint x = 5;\nif ( x = 6 )\n  printf(\"\
  x equals 6\\n\");\n```\n\n这段代码输出了 `x equals 6`！为什么？`if` 内部的赋值将 `x` 设置为 6，并向 `if`\
  \ 返回值 6。由于 6 不是 0，因此这被解释为 `true`。\n\n让编译器发现这类错误的一种方法是将任何常量（或任何右值表达式）放在左侧。这样，如果使用了\
  \ `=`，它就会变成一个错误：\n\n```c\nif ( 6 = x)\n```\n\n## 2.3 `scanf()` 错误\n\n常见的 `scanf()`\
  \ 错误有两种类型：\n\n### 2.3.1 忘记在参数上加上取地址符 (`&`)\n\n`scanf()` 必须拥有用于存储输入的变量地址。这意味着通常需要使用取符运算符\
  \ `&` 来计算地址。\n\n这里有一个示例：\n\n```c\nint x;\nchar * st = malloc(31);\nscanf(\"%d\"\
  , &x);                   /* 需要 & 来将地址传递给 scanf() */\nscanf(\"%30s\", st);      \
  \           /* 这里不需要 &，st 本身就指向变量！ */\n```\n\n如上面最后一行所示，有时不加取地址符是正确的！\n\n### 2.3.2\
  \ 对操作数使用了错误的格式\n\nC 编译器不会检查 `scanf()` 调用中的参数是否使用了正确的格式。最常见的错误是为 double 使用 `%f` 格式（必须使用\
  \ `%lf` 格式），以及在字符和字符串之间混淆了 `%c` 和 `%s`。\n\n## 2.4 数组的大小\n\nC 语言数组始终从索引 0 开始。这意味着一个定义如下的\
  \ 10 个整数的数组：\n\n```c\nint a[10];\n```\n\n其有效索引是从 0 到 9，而不是 10！学生在数组中越界是非常常见的现象。这可能导致程序出现不可预知的行为。\n\
  \n## 2.5 整数除法\n\n与 Pascal 不同，C 使用 `/` 运算符同时用于实数除法和整数除法。理解 C 如何确定其执行方式非常重要。如果两个操作数都是整数类型，则使用整数除法，否则使用实数除法。例如：\n\
  \n```c\ndouble half = 1/2;\n```\n\n这段代码将 `half` 设置为 0 而不是 0.5！为什么？因为 1 和 2 是整数常量。要修复这个问题，将其中至少一个改为实数常量。\n\
  \n```c\ndouble half = 1.0/2;\n```\n\n如果两个操作数都是整数变量且需要实数除法，请将其中一个变量强制转换为 `double`（或\
  \ `float`）。\n\n```c\nint x = 5, y = 2;\ndouble d = ((double) x)/y;\n```\n\n## 2.6\
  \ 循环错误\n\n在 C 语言中，循环会重复循环后的下一个语句。代码：\n\n```c\nint x = 5;\nwhile( x > 0 );\n```\n\
  \n是一个无限循环。为什么？（分号导致循环体为空）。\n\n## 2.7 缺少原型\n\n使用原型（prototype）可以让编译器检查函数调用的参数列表。如果没有原型，编译器假设函数返回\
  \ `int`。对于你调用的函数，必须在源文件顶部放置原型，或者创建一个头文件并包含它。\n\n## 2.8 指针未初始化\n\n每当你使用指针时，都应该回答这个问题：它指向哪里？如果你无法回答这个问题，它可能没有指向任何变量。这种类型的错误在\
  \ UNIX/Linux 上通常会导致 `Segmentation fault/coredump` 错误，在 Windows 上会导致通用保护错误。（在旧的 DOS\
  \ 下（糟糕！），什么都会发生！）\n\n这里是这种错误的示例：\n\n```c\n#include <string.h>\nint main()\n{\n \
  \ char * st;      /* 定义指向 char 或 char 数组的指针 */\n  strcpy(st, \"abc\"); /* st 指向哪里??\
  \ */\n  return 0;\n}\n```\n\n如何正确 way？要么使用数组要么动态分配数组。\n\n```c\n#include <string.h>\n\
  int main()\n{\n  char st[20];    /* 定义一个 char 数组 */\n  strcpy(st, \"abc\"); /* st\
  \ 指向字符数组 */\n  return 0;\n}\n```\n\n或者\n\n```c\n#include <string.h>\n#include <stdlib.h>\n\
  int main()\n{\n  char *st = malloc(20);   /* st 指向分配的数组 */\n  strcpy(st, \"abc\"\
  );      /* st 指向字符数组 */\n  free(st);               /* 完成后忘记释放！ */\n  return 0;\n\
  }\n```\n\n实际上，对于这段代码的功能，第一种方案要好得多。为什么？动态分配只有在需要时才使用。它比定义一个普通数组慢且容易出错。\n\n# 3. 字符串错误\n\
  \n## 3.1 混淆字符常量和字符串常量\n\nC 将字符常量和字符串常量视为完全不同的东西。字符常量用单引号括，字符串常量用双引号括。字符串常量作为指向实际字符串的指针。考虑以下代码：\n\
  \n```c\nchar ch = 'A';   /* 正确 */\n```\n\n\n\n\n```c\nchar ch = \"A\";    /* error\
  \ */\n```\n\n第二行将字符变量 `ch` 赋值给字符串常量的地址。这应该产生一个编译器错误。如果将字符串指针赋值给字符常量，也会发生同样的情况：\n\
  \n```c\nconst char * st = \"A\";    /* correct */\n\nconst char * st = 'A';    /*\
  \ error */\n```\n\n## 3.2 使用 == 比较字符串\n\n### 3.3\n\n永远不要使用 `==` 运算符来比较字符串的值！字符串是\
  \ `char` 数组。`char` 数组的名称就像指向字符串的指针（就像 C 语言其他类型的数组一样）。那又呢？考虑以下代码：\n\n```c\nchar st1[]\
  \ = \"abc\";\nchar st2[] = \"abc\";\nif ( st1 == st2 )\n    printf(\"Yes\");\nelse\n\
  \    printf(\"No\");\n```\n\n这段代码输出 `No`。为什么？因为 `==` 运算符比较的是 `st1` 和 `st2` 的**指针值**，而不是它们所指向的数据。比较字符串值的正确方法是使用\
  \ `strcmp()` 库函数。（确保包含 `string.h`）如果将上面的 `if` 语句替换为如下：\n\n```c\nif ( strcmp(st1,st2)\
  \ == 0 )\n  printf(\"Yes\");\nelse\n  printf(\"No\");\n```\n\n代码将输出 `Yes`。出于类似的原因，也不要对字符串使用其他关系运算符（`<`、`>`\
  \ 等）。在这里也请使用 `strcmp()`。\n\n### 3.3 未以空字符终止的字符串\n\nC 语言假设字符串是一个带有终止性空字符的字符数组。这个空字符的\
  \ ASCII 值为 0，可以简单表示为 `0` 或 `'\\0'`。\n\n该值用于标记字符串中有效数据的结束。如果缺少了这个值，许多 C 字符串函数将继续处理超出有效数据末尾的数据，并且通常会越过字符数组本身的结尾，直到在内存中恰好找到一个零字节！\n\
  \n大多数创建字符串的 C 库字符串函数总是正确地对它们进行空字符终止。有些则不会（例如 `strncpy()`）。请务必仔细阅读它们的描述。\n\n### 3.4\
  \ 未为空终止符留出空间\n\nC 字符串在字符串的有效数据末尾必须有一个空终止符。一个常见的错误是没有为为这个额外的字符留出空间。例如，下面定义的字符串：\n\
  \n```c\nchar str[30];\n```\n\n它的空间只能容纳 29 个（而不是 30 个）实际的数据字符，因为空字符**必须**出现在最后一个数据字符之后。\n\
  \n这在动态分配中也可能是一个问题。以下是分配精确大小以存放另一个字符串拷贝的正确方法：\n\n```c\nchar * copy_str = malloc(strlen(orig_str)\
  \ + 1);\nstrcpy(copy_str, orig_str);\n```\n\n常见的错误是忘记在 `strlen()` 的返回值上加 1。`strlen()`\
  \ 函数返回数据字符的计数，不包括空终止符。\n\n这类错误可能很难检测。它可能不会引起任何问题，或者只在极端情况下产生问题。在动态分配的情况下，它可能会破坏\
  \ `heap`（程序用于动态分配的内存区域），并导致下一次堆操作（`malloc()`、`free()` 等）失败。\n\n## 4. 输入/输出错误\n\n\
  ### 4.1 错误地使用 fgetc() 等\n\n`fgetc()`、`getc()` 和 `getchar()` 函数都返回一个 `integer` 值。\n\
  \n例如，`fgetc()` 的原型是：\n\n```c\nint fgetc( FILE * );\n```\n\n有时这个整数确实是一个简单的字符，但有一个重要的情况，返回的值不是字符！这个值是什么？`EOF`。学生中一个常见的误解是文件末尾有一个特殊字符。文件末尾并没有特殊字符。`EOF`\
  \ 是函数返回的整数错误代码。以下使用 `fgetc()` 的错误方法：\n\n```c\nint count_line_size( FILE * fp )\n\
  {\n  char ch;\n  int cnt = 0;\n  while(ch = fgetc(fp)) != EOF && ch != '\\n')\n\
  \    cnt++;\n  return cnt;\n}\n```\n\n这里哪里错了？问题发生在 `while` 循环的条件中。为了说明，这里是重写的循环，展示了\
  \ C 在后台会做了什么：\n\n```c\nwhile((int) ( ch = (char) fgetc(fp) ) != EOF && ch != '\\\
  n')\n  cnt++;\n```\n\n`fgetc(fp)` 的返回值被强制转换为 `char` 以将结果存入 `ch`。然后 `ch` 的值必须强制转换回\
  \ `int` 以与 `EOF` 比较。那又呢？将一个 `int` 值转换为 `char` 再转换回 `int` 可能无法原始的 `int` 值。这意味着在上面的示例中，如果\
  \ `fgetc()` 返回 `EOF` 值，强制转换可能会改变该值，导致与 `EOF` 的比较为假。\n\n解决方案是什么？将 `ch` 变量变为 `int`，如下：\n\
  \n```c\nint count_line_size( FILE * fp )\n{\n  int ch;\n  int cnt = 0;\n  while(ch\
  \ = fgetc(fp)) != EOF && ch != '\\n')\n    cnt++;\n  return cnt;\n}\n```\n\n现在唯一的隐藏强制转换在第二次比较中。\n\
  \n```c\nwhile(ch = fgetc(fp)) != EOF && ch != ((int) '\\n') )\n  cnt++;\n```\n\n\
  这种强制转换没有任何有害处！所以，这一切的教训是：始终使用 `int` 变量来存储 `fgetc()`、`getc()` 和 `getchar()` 的结果。\n\
  \n### 4.2 错误地使用 feof()\n\n对于 C 语言中 `feof()` 函数的工作原理存在广泛的误解。许多程序员使用它就像 Pascal 的 `eof()`\
  \ 函数。然而，C 的函数工作方式不同！\n\n区别在哪里？Pascal 的函数在**下一次**读取将因为文件末尾而失败时返回真。C 的函数在**上一次**函数执行失败时返回真。这里有一个误用\
  \ `feof()` 的示例：\n\n```c\n#include <stdio.h>\nint main()\n{\n  FILE * fp = fopen(\"\
  test.txt\", \"r\");\n  char line[100];\n  while( ! feof(fp) ) {\n    fgets(line,\
  \ sizeof(line), fp);\n    fputs(line, stdout);\n  }\n  fclose(fp);\n  return 0;\n\
  }\n```\n\n这个程序会两次打印输入的最后一行。为什么？在读取并输出最后后，`feof()` 仍然返回 0（假），循环继续。下次 `fgets()` 失败，导致持有最后一行的\
  \ `line` 变量没有改变并再次输出。在此之后，`feof()` 返回真（因为 `fgets()` 失败了），循环结束。\n\n应该如何修复？方法如下：\n\
  \n```c\n#include <stdio.h>\nint main()\n{\n  FILE * fp = fopen(\"test.txt\", \"\
  r\");\n  char line[100];\n  while( 1 )\n  {\n    fgets(line, sizeof(line), fp);\n\
  \    if ( feof(fp) )  /* 在 fgets 之后检查 EOF */\n      break;\n    fputs(line, stdout);\n\
  \  }\n  fclose(fp);\n  return 0;\n}\n```\n\n然而，这不是最好的方法。实际上没有理由使用 `feof()`。C 输入函数返回的值可以检查\
  \ EOF。例如，`fgets` 在遇到 EOF 时返回 `NULL` 指针。\n\n这里是程序的更好版本：\n\n```c\n#include <stdio.h>\n\
  int main()\n{\n  FILE * fp = fopen(\"test.txt\", \"r\");\n  char line[100];\n  while(\
  \ fgets(line, sizeof(line), fp) != NULL )\n    fputs(line, stdout);\n  fclose(fp);\n\
  \  return 0;\n}\n```\n\n作者还没有见过任何学生正确使用过 `feof()` 函数！顺便提，这个讨论也适用于 C++ 和 Java。`istream`\
  \ 的 `eof()` 方法工作方式与 C 的 `feof()`一样。\n\n### 4.3 留在输入缓冲区中的字符\n\nC 输入（和输出）函数带有缓冲。缓冲将数据存储在内存中，仅在需要时从（或向）I/O\
  \ 设备读取（或写入）数据。分块读取和写入数据比一次一个字节（或字符）高效得多。通常缓冲对编程没有影响。\n\n\n\n\n缓冲区可见的一个地方是使用 `scanf()`\
  \ 进行输入时。键盘通常是行缓冲的（line buffered）。这意味着每行输入都存储在一个缓冲区中。当程序在处理下一行输入之前，没有处理完行中的所有数据时，就会出现问题。例如，考虑以下代码：\n\
  \n```c\nint x;\nchar st[31];\nprintf(\"Enter an integer: \");\nscanf(\"%d\", &x);\n\
  printf(\"Enter a line of text: \");\nfgets(st, 31, stdin);\n```\n\n`fgets()` 将不会读取你输入入的那行文本。相反，它可能只是读取了一个空行。事实上，程序甚至不会为\
  \ `fgets()` 调用等待输入。为什么呢？`scanf()` 调用读取了表示所读整数数字所需的字符，但它将 `'\\n'` 留在了输入缓冲区中。随后 `fgets()`\
  \ 开始从输入缓冲区读取数据。它发现了一个 `'\\n'` 并停止，而不需要任何额外的键盘输入。\n\n解决方案是什么？一种简单的方法是在 `scanf()`\
  \ 调用后，读取并丢弃输入缓冲区中的所有字符，直到遇到 `'\\n'` 为止。由于这可能在很多地方使用，因此将其封装成函数是有意义的。这是一个实现此功能的函数：\n\
  \n```c\n/* function dump_line\n*  此函数读取并丢弃文件当前输入行上的任何剩余字符。\n*  参数:\n*     fp - 指向要读取字符的\
  \ FILE 的指针\n*  前置条件:\n*     fp 指向一个打开的文件\n*  后置条件:\n*     fp 所引的文件定位在下一行的末尾\n* \
  \    或者文件的末尾。\n*/\nvoid dump_line( FILE * fp )\n{\n  int ch;\n  while( (ch = fgetc(fp))\
  \ != EOF && ch != '\\n' )\n    /* 空函数体 */;\n}\n```\n\n下面是使用上述函数修复后的代码：\n\n```c\n\
  int x;\nchar st[31];\nprintf(\"Enter an integer: \");\nscanf(\"%d\", &x);\ndump_line(stdin);\n\
  printf(\"Enter a line of text: \");\nfgets(st, 31, stdin);\n```\n\n一种错误的解决方案是使用以下代码：\n\
  \n```c\nfflush(stdin);\n```\n\n这可以通过编译，但其行为由 ANSI C 标准未定义。`fflush()` 函数仅用于对输出打开的流，而不是输入流。这种方法在某些\
  \ C 编译器上似乎有效，但完全不可移植！因此，不应该使用它。\n\n### 4.4 使用 `gets()` 函数\n\n不要使用这个函数！它不知道传递给它的字符串中可以安全地存储多少字符。因此，如果读取的字符过多，内存将被损坏。\n\
  \n互联网上许多被利用的安全漏洞利用了这一事实！请用 `fgets()` 函数（从 `stdin` 读取）。但记住，与 `gets()` 不同，`fgets()`\
  \ 不丢弃输入中的终止符 `\\n`。\n\n`scanf()` 函数也可以被危险地使用。`%s` 格式可能会覆盖目标字符串。然而，通过指定宽度可以安全地使用它。例如，格式\
  \ `%20s` 不读取超过 20 个字符。\n\n![L:\\Untitled.jpg](img/image00875.jpeg)\n\n![STAR-LOGO-2013](img/image00824.jpeg)\n\
