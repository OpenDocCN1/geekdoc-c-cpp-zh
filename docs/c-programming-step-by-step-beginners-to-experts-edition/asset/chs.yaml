  \    pos--;/*索引从 0 开始*/\n    for(i=n-1;i>=pos;i--)\n        a[i+1]=a[i];/*移动*/\n\
  \    a[pos]=item;/*插入*/\n    /* 略省略输出部分 */\n}\n```\n\n**3. 编写一个程序读取整数数组。分别显示下标为偶数和奇数的元素。**\n\
  \n```c\nint even,odd,i,n,a[50];\nprintf(\"输入元素的个数: \");\nscanf(\"%d\",&n);/*输入数组*/\n\
