  \n### 第 1 \n大多数“c”编译器在编译器实用程序中提供了一个特殊的选项菜单；通过使用这个工具，我们可以轻松完成这项任务。我想 Turbo c/c++\
  \ 编译器提供了一个名为 `tlib.exe` 的工具，即 Turbo Librarian。让我们使用这个工具向“c”库添加函数。\n\n### 第 2 \n\
  在这里我我将我的阶乘函数添加到“c”库中：\n\n(a) 在某个文件（可能是 `fact.c`）中编写 `factorial()` 函数的定义：\n\n```c\n\
  int factorial(int num)\n{\n    int i,f=1;\n    for(i=1;i<=num;i++)\n        f=f*i;\n\
  \    return(f);\n}\n```\n\n(b) 使用 Alt+f9 编译此 `fact.c` 文件，现在会自动创建一个名为 `fact.obj`\
  \ 的新文件，其中包含机器语言编译后的代码。\n\n(c) 执行以下命令将函数添加到库 `maths.lib`：`c:\\>tlib maths.lib+c:\\\
  fact.obj`。在这里，`maths.lib` 是库文件名，`+` 是开关，`c:\\fact.obj` 是我们要添加到 `maths.lib` 中的文件路径。\n\
  \n(d) 在头文件（例如 `fact.h`）中声明 `factorial()` 函数的原型。在调用函数时应该包含此文件，不要忘记它。\n\n(e) 例如，看这里我们如何在任何程序中使用或调用我们添加的函数：\n\
  \n```c\n#include \"c:\\fact.h\"\n#include<stdio.h>\n#include<conio.h>\nvoid main()\n\
  {\n    int f;\n    f=factorial(5);\n    printf(\"%d\",f);\n    getch();\n}\n```\n\
  \n### 在 c 库中删除自定义函数\n步骤 - 只在中间使用减号：\n(c) 执行以下命令将函数从库 `maths.lib` 删除：`c:\\>tlib maths.lib-c:\\\
  fact.obj`。\n\n#### 创建自己的 C 库\n假设你想创建一个库，其中包含三个或多个自定义函数，例如：\n1. `factorial()`\n2.\
