  \ j*j;\n}\n```\n**输出：** `5 2` 这里的函数是按值调，因此形式参数的任何更改都不会影响实际参数。所以 `main()` 中的 `i`\
  \ 和 `j` 保持不变。\n\n6. ```c\nmain() {\n    int x = 5, y = 2;\n    hello(&x,&y);\n \
