  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 ∞ 9 章\n**(指针之大脑)**\n\n## 引言\n指针是一个特殊的变量，用于存储其他变量的地址。指针可以用于存储单个变量、数组、结构体、联合体甚至指针的地址。\n\
  \n## 指针 - 为什么？\n使用指针允许我们：\n- 实现引用传递（即编写可以修改参数的函数）。\n- 高效地处理数组。\n- 高效处理结构体（记录）。\n\
  - 创建链表、树、图等。\n- 将数据存放在堆上。\n- 创建函数表来处理窗口事件、信号等。\n- 你已经在 `scanf()` 中使用指针了。\n- 使用指针时必须小心，因为没有安全特性。\n\
  \n由于 C 语言语言是一种非常底层的语言，没有指针很难做任何事情。我们已经看到，无法写出一个能够修改其任何参数的函数。\n\n## 大脑清洗训练\n指针还可以编写链表等数据结构。标准库以及\
  \ Windows、Windows 95 和 Windows NT 编程环境广泛使用了函数指针。\n\n## 指针的问题\n一个问题是指针的声誉不好。它们被认为难以使用且难以理解。\n\
  \n## 指针的概念\n每个变量都存储在内存中，每个内存位置都有一个数字地址。变量的声明如下：\n\n```c\nint a = 5;\n```\n\n在这里，`a`\
  \ 是变量名，变量的值是 `5`，而变量的地址是 `100`（假设）。\n\n![](img/image00858.jpeg)\n\n![](img/image00859.jpeg)\n\
  \n### 大脑清洗表格\n| 声明指针 |\n| :--- |\n| 1. 指针通过使用星号 `*` 声明 |\n| 2. 声明一个整数：`int I;` |\n\
  | 3. 声明一个指向整数的指针：`int *p;` |\n| 4. 关于 `*` 的位置 `int* p;` 存在争议 |\n\n第一步是知道如何声明指针。这是通过使用\
  \ C 语言的乘法字符 `*` 完成的（显然它并不执行乘法）。`*` 放置在关键字 `int` 和变量名之间的某个位置。它创建的不是整数，而是一个指向整数的指针。\n\
  \n### 大脑清洗表格\n上面的和下面的表格都将帮助你指练掌握指针的概念。\n\n| 类型 | 声明 | 注释 |\n| :--- | :--- | :---\
  \ |\n| `int` | `*pi;` | /* pi 是一个指向 int 的指针 */ |\n| `long int` | `*p;` | /* p 是一个指向\
  \ long int 的指针 */ |\n| `Float*` | `pf;` | /* pf 是一个指向 float 的指针 */ |\n| `char` |\
  \ `c, d, *pc;` | /* c 和 d 是 char，pc 是指向 char 的指针 */ |\n| `double*` | `pd, e, f;`\
  \ | /* pd 是指向 double 的指针，e 和 f 是 double */ |\n| `char*` | `start;` | /* start 是一个指向\
  \ char 的指针 */ |\n| `char*` | `end;` | /* end 是一个指向 char 的指针 */ |\n\n变量的声明告诉编译器：\n\
  1. 在内存中保留空间存储整数值。\n2. 将名称 `a` 与此内存位置关联。\n3. 在此位置存储值 `5`。\n\n## 指针和间接运算符\n与指针使用的两个基本运算符是：\n\
  1. 地址运算符 `&`\n2. 间接运算符 `*`\n\n```c\nmain()\n{\n    int a = 5;\n    int *p; /*指针声明*/\n\
  \    p= &a; /*将变量 a 的地址拷贝给指针 p*/\n    *p = 10; /*通过间接或使用指针改变变量 a 的值*/\n    printf(\"\
  %d\", a);\n    printf(\"%d\",*p);\n    printf(\"%d\",(&a));\n}\n```\n上述程序中的所有 `printf`\
  \ 都将输出 0。因为变量 `p` 不是像其他整数那样的普通变量，而是存储其他变量（在此情况下为 `a`）地址的变量。由于 `p` 是一个变量，编译器必须为该变量提供内存。任何类型的指针在内存中占用两个字节。\n\
  \n### 内存和指针\n```c\nint *p1;\nfloat *p2;\nchar *p3;\n```\n假设为 `int`, `float`, `char`\
  \ 声明了三个指针。所有指针在内存中都占用 2 字节。这是因为所有内存地址都是从 0 到 6553 的整数值。因此可以说，无论指针类型如何，存储的地址都是整数，且只需要两个字节。\n\
  \n```c\nmain() {\n    int a = 5,*p1;\n    float b=2.5,*p2;\n    char c,*p3;\n  \
  \  p1= &a;\n    p2 = &b;\n    p3=&c;\n    printf(\"%d\",sizeof(p1));\n    printf(\"\
  %d\",sizeof(p2));\n    printf(\"%d\",sizeof(p3));\n} output: 2 2 2\n```\n\n### 指针和地址\n\
  ```c\nmain()\n{\n    int a = 5;\n    int *p;\n    p= &a;\n    *p = 10;\n    printf(\"\
  %d\", p); /*以整数格式打印指针 p 的地址*/\n    printf(\"%u\",p); /*以无符号整数格式打印指针 p 的地址*/\n  \
  \  printf(\"%x\", p); /*以十六进制格式打印指针 p 的地址*/\n    printf(\"%x\",p); /*以十六进制格式打印指针\
  \ p 的地址*/\n} output: -6, ff4\n```\n让我们评估输出。第一个答案是负数，因为指针的范围是 0 到 65536。第二个答案是 `ff4`，因为地址是以十六进制格式打印的。\n\
  \n\n\n\n\n```c\nprintf(\"%d\",*p); /*对指针解引用*/\n}\n```\n\noutput: 20, 20, 10\n\n\
  4. 如果 `p1` 和 `p2` 都是指向同一个数组的指针，那么 `p2-p1` 给出了 `p1` 和 `p2` 之间的元素个数。\n```c\n*p3 =\
  \ *p2 - *p1;\n```\n\n5. 两个指针也可以进行比较，例如 --\n- `p1>p2`\n- `p1 == p2`\n- `p1 != p2`\n\
  \n这些比较仅在使用字符串或数组时有用。\n\n6. 两个指针不能相乘、相除或相加。\n\n### 大脑清洗训练 (Mind Wash Drill)\n\n空指针是一个特殊的指针值，已知它不指向任何地方。这意味着任何其他有效指针（指向任何其他变量、数组单元或任何内容的指针）永远不会与空指针相等。\n\
  \n使用空指针的另一种方法是使用任何标准头文件，包括 `<stdio.h>`、`<stdlib.h>` 和 `<string.h>`。要将指针初始化为空指针，你可能使用如下代码：\n\
  \n```c\n#include <stdio.h>\nint *p = NULL;\n```\n\n在检查指针指向的值之前，为了测试它是否为空指针，你可以使用如下代码：\n\
  \n```c\nif(p != NULL)\n    printf(\"%d\\n\", *p);\n```\n\n也可以使用常量 `0` 来引用空指针，你会看到一些代码通过简单的操作来设置空指针：\n\
  \n```c\nint *p = 0;\n```\n\n此外，由于 C 语言中“真”的定义是不等于 `0` 的值，你将看到使用简写代码测试非空指针的代码：\n\n\
  ```c\nif(p)\n    printf(\"%d\\n\", *p);\n```\n\n这与我们之前的示例含义相同；`if(p)` 等于 `if(p !=\
  \ 0)` 也等于 `if(p != NULL)`。\n\n### 指向指针的指针 (Pointers to pointers)\n\n指针存储变量的地址，同样的指针的地址也可以存储在另一个指针中。\n\
  \n```c\nmain()\n{\n    int a=5;\n    int *p1;           /*指向整数的指针*/\n    int **p2;\
  \          /*指向指针指针的指针*/\n    int ***p3;         /*指向指向指针指向整数的指针*/\n\n    p1= &a;\n\
  \    p2= &p1;\n    p3 =&p2;\n\n    printf(\"%d\",a);     /*输出 = 5*/\n    printf(\"\
  %d\",*p1);    /*输出 = 5*/\n    printf(\"%d\",**p2);   /*输出 = 5*/\n    printf(\"%d\"\
  ,***p3);  /*输出 = 5*/\n    printf(\"%u\",*p2);    /*p1 的地址将是*/\n}\n```\n\n### 指针与数组\
  \ (Pointers and Array)\n\n当声明一个数组时，编译器会分配一个基地址和足够的存储空间以在连续的位置包含所有元素。基地址是数组第一个元素（索引为\
  \ `0`）的位置。假设我们如下声明数组 `a`：\n\n```c\nstatic int a[5]={10,20,30,40,50};\n```\n\n假设数组\
  \ `a` 的基地址为 `100` 且整数需要两个字节。\n\n| [0] | [1] | [2] | [3] | [4] |\n|---|---|---|---|---|\n\
  | 10 | 20 | 30 | 40 | 50 |\n| 100 | 102 | 104 | 106 | 108 |\n\n名称 `a` 被定义为指向第一个元素\
  \ `a[0]` 的常量指针，因此 `a` 的值是 `100`，即 `a[0]` 存储的位置。也就是说 `a` 等于 `&a[0]` 等于 `100`。\n\n\
  如果我们将指针 `p` 声明为整数指针，那么我们可以让指针 `p` 指向数组 `a`：\n\n```c\np= a;\n// 或者\np = &a[0];\n\
  ```\n\n现在我们可以使用 `p++` 从一个元素移动到另一个元素来访问此数组 `a` 的每一个值。`p` 和 `a` 之间的关系所示：\n\n- `p`\
  \ 等于 `&a[0]` (100)\n- `p+1` 等于 `&a[1]` (102)\n- `p+2` 等于 `&a[2]` (104)\n- `p+3`\
  \ 等于 `&a[3]` (106)\n- `p+4` 等于 `&a[4]` (108)\n\n在处理数组时，我们可以使用数组索引或指针来访问数组元素。因此，我们可以如下方式指向数组的第三个元素：`a[2]`\
  \ 或 `*(p+2)`（记住数组索引从 0 开始）。\n\n### 指针与函数 (Pointers and Functions)\n\n如前所述，将数组作为参数传递的函数使用了引用传递机制。编写一个程序\
  \ (WAP) 来交换两个数字。\n\n#### 使用值传递\n```c\nvoid swap(int ,int);\nmain(){\n    int a,b;\n\
  \    printf(\"输入两个数字\");\n    scanf(\"%d %d\");\n```\n\n#### 使用引用传递\n```c\nvoid\
  \ swap(int *,int);\nmain(){\n    int a,b;\n    printf(\"输入两个数字\");\n    scanf(\"\
  %d %d\");\n}\n```\n\n### 常见错误 (Common Errors)\n- 函数原型已声明。\n- 数组作为参数。\n- 数组的大小必须是常量，否则会导致不足。\n\
  \n### 内存分配 (Memory Allocation)\n\n1. **静态分配**：编译时分配内存。\n2. **动态分配**：执行时分配内存。\n\n\
  ### 大脑清洗训练 (Mind Wash Drill)\n\n编译时分配的内存被称为静态内存。这些问题可以通过使用指针来解决。程序执行时分配的内存被称为动态内存。因此，动态内存可以描述为运行时分配内存的过程。C\
  \ 语言本身没有这种功能，但可以使用头文件 `stdlib.h`。\n\n| 函数 | 功能 |\n|---|---|\n| `malloc()` | 分配请求的字节并返回起始地址。\
  \ |\n| `calloc()` | 分配请求的字节，将其初始化为零并返回起始地址。它分配非连续内存。 |\n| `realloc()` | 通过增加或减少字节数重新分配大小并返回起始地址。\
  \ |\n| `free()` | 释放之前分配的空间。 |\n\n#### 分配块内存 (Allocating a block of memory)\n\n\
  可以使用 `malloc` 函数分配一块内存。`malloc` 函数保留指定大小的内存并返回一个 `void` 类型指针。这意味着我们可以将块的基地址赋值任何类型的指针。`malloc`\
  \ 的通用语法为：\n\n```c\nP= (cast type*) malloc(byte size);\n```\n\n现在来看例如：\n\n```c\n\
  P=(int*)malloc (10 * sizeof(int));\n```\n\n这里 `malloc` 函数返回一个整数类型指针 `p`，该内存区域能够容纳\
  \ 10 个整数。同样，语句：\n\n```c\nP=(char*)malloc(10*sizeof(char));\n```\n\n或者\n\n```c\n\
  P=(char*)malloc(10);\n```\n\n为字符类型指针 `p` 分配了 10 字节的空间。这可以如下所示：\n\n| | | | | | |\
  \ | | | | |\n|---|---|---|---|---|---|---|---|---|---|---|\n存储 10 个字符的空间 |\n\n第一个字节的地址\
  \ |\n\n`malloc` 可用于为复杂数据类型（如结构体）分配空间：\n\n```c\nstr_p= (struct store *)malloc(sizeof(struct\
  \ store));\n```\n\n其中 `str_p` 是 `struct store` 类型的指针。\n\n\n\n\n\n`malloc` 用于分配连续字节的内存。如果内存空间不足以满足请求，分配可能会失败。如果失败，它将返回一个\
  \ `NULL`。\n\n## 分配多个块 (calloc)\n\n`calloc` 也是一种内存分配函数，通常用于为数组和结构分配内存。`malloc` 用于分配单个存储空间块，而\
  \ `calloc` 分配多个存储块，每个块的大小相同，并将它们初始化为零。`calloc` 的通用语法为：\n\n```c\nP= (cast type*)\
  \ calloc(n, array size);\n```\n\n现在让我们来看一个例子：\n\n```c\nP=(int*)calloc (10 , sizeof(int));\n\
  ```\n\n上述语句为 10 个数据块分配了连续空间，每个块的大小为 2 字节（因为 `int` 需要两个字节）。\n\n所有字节都被初始化为零，并且指针获得了所分配内存块的起始地址。这里这里\
  \ `malloc` 一样，如果无法满足内存请求，则返回 `NULL`。\n\n## 修改块的大小\n\n我们很可能在之后发现，之前分配的内存不再足够，需要额外的空间，或者分配的内存比需要的要大得多。\n\
  \n在这两种情况下，必须修改块的大小，这可以通过函数 `realloc`（重新分配内存）来实现。`realloc` 的通用语法为：\n\n```c\nP= relloc(P,\
  \ new size);\n```\n\n### 脑力训练\n\n新尺寸可以比之前的大，也可以比小。现在让我们来看一个例子，假设使用 `malloc` 分配了存储\
  \ 10 个整数的块：\n\n```c\nP=(int*)malloc (10 * sizeof(int));\n```\n\n现在要修改大小以便再存储 5 个数字，语句应为：\n\
  \n```c\nP= relloc(P, 15);\n```\n\n该函数为指针 `P` 分配了一个大小为 15 的新内存空间，并返回指向新块第一个字节的指针。\n\
  \n### 脑力训练\n\n还要记住，新的内存块可能也可能与旧块在相同的位置开始。\n\n在这种情况下，它会在其他地方创建一个新的内存空间，将所有旧数据复制到那里，并将块地址返回指针。\n\
  \n## 释放已使用的空间\n\n如果变量是在编译时声明的，它们将根据其存储类被销毁，但如果使用了动态分配，则有责任在不再使用时释放空间。\n\n在存储空间有限的情况下，这也是必要的。如果该空间的数据不再需要，可以使用函数\
  \ `free` 释放内存空间：\n\n```c\nfree(p);\n```\n\n## 1. 编写一个程序从字符串中提取子字符串。\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\n#include<string.h>\n\nmain()\n{\n    char str[20], news[20];\n\
  \    char *s, *t;\n    int pos, n, i;\n    printf(\"Enter the string:\");\n    scanf(\"\
  %s\",str);\n    printf(\"Enter 要提取的位置和字符数:\");\n    scanf(\"%d%d\",&pos,&n);\n \
  \   s=str;\n    t=news;\n    if(n ==0)\n        n=strlen(str);\n    s=s+pos-1;\n\
  \    for(i=0;i<n;i++)\n    {\n        *t=*s;\n        s++;\n        t++;\n    }\n\
  \    *t='\\0';\n    printf(\"The substring is: %s\\n\",news);\n    getch();\n}\n\
  ```\n\n## 2. 编写一个程序对 4x4 矩阵的所有元素进行排序。\n\n```c\nint mat[4][4], *arr, i, j, t;\nprintf(\"\
  Enter the elements of 4x4 matrix:\");\n/*输入矩阵*/\nfor(i=0; i<4; i++)\n{\n    for(j=0;\
  \ j<4; j++)\n    {\n        printf(\"Enter element %d %d\",i+1,j+1);\n        scanf(\"\
  %d\",&mat[i][j]);\n    }\n}\n/*排序矩阵元素*/\narr = mat; /*矩阵数组的基地址*/\n/*使用指针打印输入的矩阵*/\n\
  printf(\"\\nThe matrix formed is…n\");\nfor(i=0; i<5; i++)/*循环次数*/\nfor(j=i+1; j<6;\
  \ j++)\n{\n    if(*(arr +i)>(arr+j))\n    {\n        t = *(arr+i);\n        *(arr+i)=\
  \ *(arr+j);\n        *(arr+j)=t;\n    }\n}\n/*打印排序后的矩阵*/\nprintf(\"\\n sorted matrix\
  \ is:\\n\");\nfor(i=0; i<4; i++)\n{\n    for(j=0; j<4; j++)\n        printf(\"%d\"\
  ,mat[i][j]);\n    printf(\"\\n\");\n}\nprintf(\"\\n\\n any key to exit…\");\ngetch();\n\
  ```\n\n## 3. 编写一个程序输入任何字符串并删除其中存在的多余空格。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  #include<string.h>\nmain()\n{\n    static char s1[50];\n    char s2[50];\n    char\
  \ *s, *t;\n    int i, l;\n    printf(\"Enter a string\");\n    gets(s1);\n    s=s1;\n\
  \    t=s2;\n    l=strlen(s);\n    for(i=0;i<=l-1;i++)\n    {\n        if(*s == '\
  \ ')/*检查空格*/\n        {\n            if(*(s+1)!=' ')\n            {\n          \
  \      *t=*s;\n                t++;\n            }\n            s++;\n        }\n\
  \        else\n        {\n            *t=*s;\n            t++;\n            s++;\n\
  \        }\n    }\n    *t='\\0';\n    printf(\"Original Statement:%s\\n\",s1);\n\
  \    printf(\"Modified Statement:%s\",s2);\n    getch();\n}\n```\n\n## 4. 编写一个程序使用指针连接两个字符串。不要使用\
  \ strcat 函数。\n\n```c\nmain()\n{\n    char s1[20],s2[20],*p1,*p2;\n    /*输入第一个字符串*/\n\
  \    printf(\"1st string\");\n    gets(s1);\n    /*输入第二个字符串*/\n    printf(\"2nd\
  \ string\");\n    gets(s2);\n    /*将字符串赋值给两个指针*/\n    p1 = s1;\n    p2 = s2;\n \
  \   /*将指针 1 移动到第一个字符串的末尾*/\n    while(*p1 != '\\0')\n        p1++;\n    /*将第二个字符串添加到第一个字符串的末尾*/\n\
  \    while(*p2 != '\\0')\n        *p1++ = *p2++;\n    /*在字符串末尾添加 NULL*/\n    *p1\
  \ = '\\0';\n    /*输出连接后的字符串*/\n    puts(s1);\n    getch();\n}\n```\n\n## 5. 编写一个程序从键盘接收整数月份和年份，并按以下格式打印日历。\n\
  \n```c\nstatic char *months[]=={\n    \"January\",\n    \"February\",\n    \"March\"\
  ,\n    \"April\",\n    \"May\",\n    \"June\",\n    \"July\",\n    \"August\",\n\
  \    \"September\",\n    \"October\",\n    \"November\",\n    \"December\"\n};\n\
  \nmain()\n{\n    static int days[12]={31,28,31,30,31,30,31,31,30,31,30,31};\n}\n\
