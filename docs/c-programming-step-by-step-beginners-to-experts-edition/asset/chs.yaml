  \    getch();\n}\n\n/*检查输入日期的函数*/\nint check_date(struct date *dt)\n{\n    printf(\"\
  \\nEnter date(dd)\");\n    scanf(\"%d\",&dt->day);\n    printf(\"\\nEnter month(mm)\"\
  );\n    scanf(\"%d\",&dt->month);\n    printf(\"\\nEnter date(yyyy)\");\n    scanf(\"\
