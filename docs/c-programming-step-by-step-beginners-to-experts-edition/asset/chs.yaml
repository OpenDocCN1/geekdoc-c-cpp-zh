  0`\n\n（注：此处已根据要求去除了重复段落）\n\n### 字符串输入\n常用的输入函数是 `scanf`。该函数也可以通过格式说明符 `%s` 来输入字符串。例如\
  \ `scanf(\"%s\",name);`\n\n在输入字符串时不需要 `&`（取地址运算符）。`scanf` 函数的问题是它会在遇到空白字符时结束输入（空白字符包括空格、制表符、回车、分页符、换行）。因此，如果输入以下行——\n\
  Shivam Kumar\n\n单词 \"Shivam\" 后面的空格会结束字符串。\n\n很多我们需要读取整行文本，使用 `scanf` 是不行的。这可以通过\
  \ `getchar()` 函数来实现。该函数每次读取一个字符并存储在数组中。因此我们需要循环使用该函数，直到用户输入空字符或换行。\n\n另一个可以用于输入字符串的函数是\
  \ `gets()`。用法如下：\n```c\nchar name[10];\ngets(name);\n```\n该函数还可以一次性读取空格，从而获取一行输入。\n\
  \n### 字符串输出\n常用的输出函数 `printf()` 也可以用于字符串，使用格式说明符 `%s` 在屏幕上显示字符串。\n```c\nprintf(\"\
  %s\",name);\n```\n\n注意：也可以使用 `puts()` 函数。\n```c\nputs(name);\n```\n\n字符串的精度也可以指定为\
  \ `%10.3`。表示将前三个字符打印在 10 列的字段宽度内。字符串前会打印 7 个空格。但如果规格是 (`%-10.4)`，则字符串将左对齐，所有的 7\
  \ 个空格将向右打印。\n\n1. 记住，如果字段宽度小于字符串长度，则打印长度长度的字符串。`printf(\"%3.4s\",name);` 将打印 4 个字符而不是\
  \ 3 个。\n\n\n\n\n\n```c\nprintf(\"%s\",name);\nprintf(\"%6s\",name);\nprintf(\"%12.6s\"\
  ,name);\nprintf(\"%-12.6s\",name);\nprintf(\"%.2s\",name);\n```\n\n# 一些求解程序\n\n\
  ## 1. 编写程序对给定列表中的名称进行升序排序。\n\n```c\n#include<string.h>\n\nmain()\n{\n    char names[10][20],\
