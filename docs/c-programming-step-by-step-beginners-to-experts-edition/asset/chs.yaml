  \n\n\n\nC 语言有三种循环，`while` 是最简单的一种。它接收一个条件（在括号内，就像 `if` 语句一样）并对其进行求值。如果条件结果为真（如之前所示，非零），则执行循环体。条件会再次被求值，如果仍然为真，则再次执行循环体。此过程一直持续，直到条件最终为假。然后执行流将跳转到循环之后的第一条语句。\n\
  \n# While 循环\n\n`while` 循环由一个条件和一个必须在循环中运行的单个命令或命令块组成。正如我们之前提到的，命令块是一系列包含在一对大括号包围的命令。\n\
  \n在 `while` 循环中，会对条件进行求值，如果结果为真，则执行循环语句。在执行语句和递增或递减之后，会再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程持续持续，直到条件最终变为假，循环的控制权转移到下一条语句。\n\
  \n再次，如果循环体内需要多条语句，则必须使用大括号。\n\n它是所有循环中最简单的。该循环的使用方式如下：\n\n```\ninitialize;\nwhile(condition)\n\
  {\n    statement;\n    increment or decrement;\n}\n```\n\n`while` 循环是一种入口控制循环。会对条件进行求值，如果结果为真，则执行循环语句。在执行语句和递增或递减之后，会再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程持续持续，直到条件最终变为假，循环的控制权转移到下一条语句。\n\
  \n## 语法\n\n```\ninitialization;\nwhile(condition)\n{\n    statement;\n    incrementation\
  \ or decrementation;\n}\n```\n\n## 自由语法\n\n```\nwhile( condition )\ncommand;\n\n\
  while( condition )\n{\n    block of commands\n}\n```\n\n循环条件是一个布尔表达式。布尔表达式是一个逻辑语句，非正确或错误。如果逻辑语句有效，其值为\
  \ 1；如果无效，其值为 0。例如，布尔语句 `(3>4)` 是无效的，因此其值为 0。而语句 `(10==10)` 是有效的逻辑语句，因此其值为 1。\n\n\
  ## 分号警告！\n\n避免在 `while` 后面之后加分号。我们已经看到，如果在 `if` 语句后放置分号可能会产生问题。循环也存在类似的问题，尽管情况更严重。对于\
  \ `if` 来说，空操作可能只执行一次；而对于循环，它可能会被执行无限次。\n\n#### 示例\n\n```c\n#include<stdio.h>\n\n\
  main()\n{\n    int i=0;\n    while( i<100 )\n    {\n        printf(\"\\ni=%d\",i);\n\
  \        i=i+1;\n    }\n    system(\"pause\");\n}\n```\n\n在上面的示例中，`i=i+1` 意味着：给\
  \ `i` 加 1 然后将其赋值给 `i`，或者简单地增加它的值。正如我们之前看到的，C 编程语言中有一个特殊的运算符可以完成相同的操作。我们可以用表达式 `i++`\
  \ 代替 `i=i+1`。\n\n# 类型转换\n\n有时你可能需要转换值或变量的类型，以便将其赋值给另一个类型的变量。这种类型转换在不同情况下可能非常有用，例如，当你想要转换变量的类型以与具有不同类型参数的函数兼容时。\n\
  \nC 语言为了此目的实现了一些规则。在某些情况下会发生自动类型转换。`Char` 会自动转换为 `int`。`signed int` 将自动转换为 `int`。\n\
  \n如果表达式中存在两种不同的类型，两者都将转换为更好的类型。在赋值语句中，计算的最终结果将转换为持有该结果的变量的类型（例如赋值语句 `count=i+1;`\
  \ 中的变量 `count`）。\n\n例如，如果你将两个来自 `int` 和 `float` 类型的值相加并赋值给一个 `double` 类型变量，结果将是\
  \ `double`。\n\n# 在示例中使用循环\n\n编写一个程序——接收一个人的分数并计算它们的总和以及平均分，并打印出来。\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\n\nmain()\n{\n    int count=0;\n    float sum=0, avg=0, num;\n\
  \    printf(\"Enter score: \");\n    scanf(\"%f\",&num);\n    while(num>=0)\n  \
  \  {\n        sum=sum+num;\n        count++;\n        printf(\"Enter score: \");\n\
  \        scanf(\"%f\",&num);\n    }\n    avg=sum/count;\n    printf(\"\\nAverage=%f\"\
  ,avg);\n    printf(\"\\nSum=%f\",sum);\n    system(\"pause\");\n}\n```\n\n（注：提供的文本包含多个重复且碎片化的代码片段；这些已经过清理以确保清晰性，同时保留了核心逻辑。）\n\
  \n\n\n\n初始化部分仅在“for 循环”开始时执行一次。我们可以在这里初始化循环变量。\n\n测试条件是循环中最重要的部分。如果该条件有效（真），循环将继续运行。如果条件失效（假），则循环将终止。\n\
  \n“每次执行（Run every time）”部分会在每个循环周期中执行。我们使用这部分来达到终止循环的最终条件。\n\n例如，我们可以增加或减少循环变量的值，使得在指定次数的循环后，循环条件失效，从而终止“for\
  \ 循环”。\n\n在这一步中，我们用 for 循环重写了示例 3-1。只需注意我们不再需要用 `I=I+1` 来增加循环变量。它现在包含在“for 循环”的条件短句中了（`i++`）。\n\
  \n### 示例 –\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nmain()\n{\nint i=0;\n\
  for(i=0;i<100;i++ )\nprintf(\"\\ni=%d\",i);\nsystem(\"pause\");\n}\n```\n\n- 学习笔记-\
  \ `stdio.h` – 标准输入输出。\n- 学习笔记- `conio.h` – 控制台输入输出。\n- 学习笔记- 基本上你只需要记住必须分隔该结构三个部分的两个分号字符。\n\
  \n### 示例 –\n\n编写一个程序，获取工作日的温度，并计算该周的平均温度。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  \nmain()\n{\nint count=0;\nfloat num=0,sum=0,avg=0;\nfor(count=0;count<7;count ++)\n\
  {\nprintf(\"Enter temperature : \");\nscanf(\"%f\",&num);\nsum=sum+num;\n}\navg=sum/7;\n\
  printf(\"\\nAverage=%f\\n\",avg);\nsystem(\"pause\");\n}\n```\n\n### 示例 -\n\n下面的示例将打印一个乘法表（从\
  \ `1*1` 到 `9*9`）。运行程序并查看结果。\n\n```c\n#include<stdio.h>\n\nmain()\n{\nint i,j;\n\
  for(i=1;i<10;i++)\n{\nfor(j=1;j<10;j++)\nprintf(\"%3d\",i*j);\nprintf(\"\\n\");\n\
  }\nsystem(\"pause\");\n}\n```\n\n### For 与 while 的比较\n\n该结构：\n`For (初始化部分; 循环循环条件;\
  \ 更新部分)`\n`循环体`\n\n它等同于：\n`初始化部分;`\n`While (循环循环条件)`\n`{`\n`循环体;`\n`更新部分;`\n`}`\n\
  \n在这里，初始化首先执行，然后评估条件；如果条件为真，则首先执行语句，然后进行变量的递增或递减，再次测试条件，该过程一直持续直到循环条件变为假。\n\n初始化是通过某些赋值运算符完成的。如果需要初始化多个变量，则用逗号分隔赋值。在写完所有赋值后，使用分号将它们与条件隔开。如果有多个条件，则用逻辑与\
  \ (`&&`) 或逻辑或 (`||`) 隔开。在给出所有条件后，在给出递增或递减操作之前使用一个分号。\n\n如果循环体中有多个语句，则强制要求使用括号。\n\
  \nfor 循环的一个独特之处是，如果不需要，可以省略 for 循环的一个或多个部分。然而，分隔循环不同部分的分号是必要的。\n\n也可以使用空语句设置延迟循环：`for(i=100;i>0;i--);`。在这个循环中没有语句，因此首先将变量\
  \ `i` 初始化为 `100`，测试条件，然后进行递减，再次测试条件，`i` 再次减小，并重复直到条件变为假。\n\nfor 循环的另一个特性是嵌套，即将一个循环作为另一个循环的语句。在\
  \ ANSI C 中，允许嵌套深度最高 15 层，但某些编译器允许更多。\n\n字体 跳跳转语句（新主题）\n\n循环执行一组语句，直到条件变为假。循环重复的次数是预先决定的，并设置了一个条件。但有时需要跳过循环的某些部分或在特定条件为真时终止循环，这时跳转语句派上了用场：\n\
  \nC 支持四个跳转语句：\ni. `break`。\nii. `continue`。\niii. `goto`。\niv. `return`。\n\n####\
  \ break\n`break` 语句用于循环内部，直接跳出循环。我们已经在 `switch` 语句中使用过 `break`。它用于跳过循环的后续执行，并将程序的控制权转移到循环后的语句。\n\
  \n#### continue\n有时当特定条件为真时，需要跳过语句的执行。`continue` 不终止循环，而是直接跳转到下一次迭代。在 for 循环中， `continue`\
  \ 将控制权带到下一次递增或递减，但在 `while` 或 `do while` 循环中，`continue` 会导致循环控制直接跳转到条件。\n\n####\
  \ goto\n它也用于从程序的范围内跳转到另一个部分，或退出深度嵌套的循环。但使用 `goto` 不是良好的做法，因为它会让逻辑复杂化并使长程序不可读。\n\n\
  #### return\n用于函数返回某些值，并从调用的函数定义跳转到调用函数的定义。\n\n#### exit()\n它不是跳转语句。它用于退出程序。\n\n\
  学习笔记 - `break`、`goto`、`return` 都是关键字。\n\n#### break 语句\n让我们详细讨论这些\n\n#### break\
  \ 语句\n`break` 语句用于循环内部，直接跳出循环。我们在 `switch` 语句中使用过 `break`。它用于跳过循环的任何后续执行，并将程序的控制权转移到循环之后的语句。\n\
  \n#### continue\n有时当特定条件为真时，需要跳过语句的执行。`continue` 不终止循环，而是直接跳转到下一次迭代。在 for 循环中， `continue`\
  \ 将控制权带到下一次递增或递减，但在 `while` 或 `do while` 循环中， `continue` 会导致循环控制直接跳转到条件。\n\n####\
  \ goto\n它也用于从程序的某个部分跳转到另一个部分，或退出深度嵌套的循环。但使用 `goto` 不是良好的做法，因为它会让逻辑复杂化并使长程序不可读。\n\
  \n#### return\n用于函数返回某些值，并从调用的函数定义跳转到调用函数的定义。\n\n#### exit()\n它不是跳转语句。它用于退出程序。学习笔记\
  \ - `break`、`goto`、`return` 都是关键字。\n\n#### break、switch 与循环\n这与 `switch` 语句中使用的\
  \ `break` 完全相同。如果 `break` 放置于循环中的 `switch` 中，`break` 强制退出 `switch` 而不是循环。\n\n####\
  \ continue\n学习笔记 – `continue` 语句可以用于循环中。与 `break` 命令一样，`continue` 改变程序的流。但它并不终止循环。它只是跳过当前迭代并返回循环的起点。\n\
  \n示例 -\n```c\n#include<stdio.h>\nmain()\n{\nwhile((ch=getchar())!='n')\n{\nif(ch=='.')\n\
  continue;\nputchar(ch);\n}\nsystem(\"pause\");\n}\n```\n在上面的示例中，程序接受所有输入但排除了 `.`\
  \ 字符。文本会在输入时回显，但主输出会在按下回车键（等于插入 `\\n` 字符）后打印。正如我们之前提到的，这个 `getchar()` 函数是一个缓冲输入函数。\n\
  \n与 `break` 强制立即退出最近的循环不同，`continue` 关键字会导致循环进入下一次迭代。\n\n在 `while` 和 `do while`\
  \ 循环的情况下，它直接跳转到条件并重新评估它。在 `for` 循环的情况下，它跳转到循环的更新部分，执行该部分，然后重新评估条件。\n\n#### continue\
  \ 是真正的 goto\n适用于 `break` 的语句同样适用于 `continue`。它只是 `goto` 的另一种形式，应该谨慎使用。过度使用 `continue`\
  \ 会导致面条逻辑而非代码。事实上，上面的循环可以很容易地写成：\n\n```c\nfor(j = 1; j <= 10; j++)\nif(j % 3 !=\
  \ 0)\nprintf(\"j = %i\\n\", j);\n```\n\n\n\n虽然 `break` 对 `switch` 语句有影响，但 `continue`\
  \ 则没有这种影响。因此，在循环内部 `switch` 语句中放置 `continue` 将影响循环本身。\n\n### 练习笔记\n- `if (then)\
  \ else` - 注意分号。\n- `switch` 可以测试整数值。\n- `while`, `do while`， `for` - 再次注意分号。\n\n\
