  \ 1，条件为真，打印 `i` 的值即 1，然后调用 `main` 函数；我们知道 `i` 被声明为 `static`，所以它的值不会被初始化，这次它变为 2，以此类推直到\
  \ `i` 变为 5，被打印并反复调用 `main` 函数；当 `i` 变为 6 时，条件为假并跳转到 `else` 块，由于 `exit( )` 程序程序停止。\n\
  \n4. ```c\nmain() {\n    int i = 40,c;\n    c = check(i);\n    printf(\"\\n%d\"\
