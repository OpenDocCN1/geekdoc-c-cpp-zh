  \n“什么是真实？你如何定义真实？如果你说的是你可以感觉到的、能闻到的、能尝到的和看到的，那么真实仅仅是由于……解释的电信号……”\n\n\n## 前言：\n\n\
  ### 核心 C 编程技能——变得简单！\n\n跟随畅销编程书籍 Harry. H. Chaudhary 的学习，在短时间内掌握 C 编程的所有基础和高级特性。本书从基础开始；我承诺本书将让你成为\
  \ C 编程的 100%专家级冠军。\n\n任何人都可以通过本书以专家水平学习 C 编程。工程类学生和职新开发者也可以使用本书。在软件开发章节，我解释了一个现场软件项目。\n\
  \n\n\n\n本书涵盖了 BCA、MCA、B.TECH、M.TECH、BS (CS)、MS (CS)、BSC-IT (CS)、MSC-IT (CS) 以及计算机科学专业人士和黑客的核心大纲。书中包含了\
  \ 1000 多个实时 C 程序代码示例、500 多个实验室练习、200 多个洗脑主题代码书，以及 20 多个实时软件开发项目。你所需的一切！不是吗？\n\n\
  这本书是一本非常严肃的 C 语言书籍：C 语言的完备介绍。你将学习从基础到高级主题的所有内容。如果你读过这本书，你就知道该期待什么——一种为了你大脑工作方式而设计的视觉效果丰富的格式。如果你没读过，那你就将有一场大宴了。你会发现为什么人们说它与你读过的任何其他\
  \ C 语言都不同。\n\n学习一门新语言并非易事。你可能会认为问题出在大脑上。它似乎有自己的主意，并不总是想接受你被迫学习的那些枯燥技术内容。\n\n事实是，你的大脑渴望新奇感。它在不断地寻找、扫描，等待着异常事件发生。毕竟，它是为了帮助你生存而设计的。它将所有常规、平凡、无味的内容过滤到背景中，这样就不会干扰你大脑的真正工作——记录重要的事情。你的大脑如何知道什么是重要的？\n\
  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 ∞ 1 章 ∞\n## (C 语言简介)\n\n### 导言\n\
  \n### 关于语言层次你需要了解的知识\n\n编程语言有不同的层次，取决于它们与人类语言的相似程度。使用常用单词且对大多数人易于阅读和学习的编程语言被称为高级语言。与之相反的是低级语言，它们并不容易阅读或学习。\n\
  \n高级语言包括流行的 `BASIC` 编程语言，以及其他已不再流行的语言。`BASIC` 读起来几乎就像英语，它所有的命令和指令都是英语单词——至少是缺少了几个元音或严重违背拼写规则的英语单词。\n\
  \n低级语言中的最低级是机器语言。那种语言是微处理器本身真实的原始咕声和呻吟。机器语言由微处理器理解并执行的数字和代码组成。\n\n因此，没有人真的会用机器语言编写程序；相反，他们使用汇编语言，它比低级机器语言高一级，因为那些咕声和呻吟是被拼写出来的，而不是以原始数字的形式输入的。\n\
  \n既然有了高级语言，为什么还要使用低级语言呢？速度！用低级语言编写的程序以计算机运行的最快速度运行，通常比其高级语言对应快得多。此外，程序体积更小。\n\n\
  用 `Visual Basic` 编写的程序可能只有 34K，但用汇编语言编写的相同程序可能只有 896 字节。另一方面，开发汇编语言程序的时间比用更高级语言编写相同程序要长得多。这是一种权衡。\n\
  \n`C` 编程语言被认为是一种中级语言。它既有低级的咕声和尖叫部分，也有许多高级部分，读起来像迈克尔·克莱顿小说中的中的任何句子，但具有更多的角色刻画。\n\n\
  在 `C` 中，你既获得了高级编程语言的优点和它们提供的开发速度，同时也获得了低级语言的紧凑程序尺寸和运行速度。这就是为什么 `C` 如此酷炫。\n\n**注意：**\
  \ 不，我不是在开玩笑。`C` 是在 20 世纪 70-72 年初于 `AT&T Bell Labs` 开发的。当时，贝尔实验室有一门名为 `B` 的编程语言——B\
  \ 代表 Bell。他们创建的下一个语言是 `C` —— 比 `B` 高一级。\n\n*   `C` 是 `B` 编程语言和名为 `BCPL`（基础组合编程语言）的语言的后代。但你必须知道，`B`\
  \ 语言是在剑桥大学开发的。`C` 语言也许是最流行的编程语言。它在 1972 年由 `Dennis Ritchie` 在美国 `贝尔实验室` 实现。`C` 也被用于开发\
  \ `UNIX` 操作系统。\n\n### C 的历史\n\n`C` 语言通常被大多数编译器支持。\n\n对于本课程，你可以使用以下编译器或环境：\n\n* \
  \  `UNIX` 和 `Linux` 上的 `GCC` 和 `cc`。\n*   `DOS` 上的 `Borland C` 或 `Turbo C`。\n* \
  \  `Bloodshed Dev-Cpp` 集成开发环境 (IDE) 给你了一个完整的紧凑环境。它带有 `MinGW` 和 `GCC`。\n\n### C 开发周期\n\
  \n以下是你创建 C 程序的七个步骤：\n\n1. 为程序构主意。\n2. 使用编辑器编写源代码。\n3. 使用 C 编译器编译源代码并链接程序。\n4. 为错误痛苦地哭泣（可选）。\n\
  5. 运行并测试程序。\n6. 为 Bug 抓头发（可选）。\n7. 重头（必选）。\n\n不需要记忆这个列表。它就像洗发水瓶上的说明，尽管你编程时不需要光身湿着。最后，就像洗头一样，你会开始不经思考地遵循这些步骤。\n\
  \n第一步是最困难的。其余步骤水到渠成。\n\n第三步包含两个步骤：编译和链接。但在本书中，它们通常一起完成。\n\n### 从文本文件到程序\n\n当你创建一个程序时，你就成为了一个程序员。你的朋友或亲戚可能会称你为“计算机天才”或“大师”，但请相信我，“程序员”是一个好得多的称号。\n\
  \n作为一个程序员，你的工作不是“编程”。不，编写程序的行为是编码。所以当你坐下写那个程序时，你是在编码。习惯这个词！它非常流行。\n\n\n\n程序员的工作就是编写代码！编写什么代码？你使用哪种类型的代码？密码？摩尔斯电码？邮政编码？\n\
  \n计算机程序的目的是让计算机执行某些操作。\n\n编程的目标是“让它实现”。`C` 语言只是与个人电脑（PC）通信的工具。\n\n作为程序员，你的工作是将计算机用户的意图翻译成计算机能理解的内容，然后给用户他们想要的东西。如果你不能给他们想要的东西，至少要让它足够接近，这样他们就不会不断抱怨，或者更糟糕的是——要求退款。\n\
  \n你所选择的实现这一目标的工具是 `C` 编程语言。这就是你用来与个人电脑通信的代码。接下来的章节将描述这一过程是如何运作的。毕竟，你也可以直接拿起鼠标说：“你好，计算机！”\n\
  \n*   编程是电视网络高管做的事。计算机程序员是写代码（Code）的。\n*   你使用编程语言与计算机通信，准确地告诉它该做什么。\n\n## 源代码 -\
  \ (文本文件)\n\n由于计算机无法听懂语言，而且，嗯，猛打计算机——无论这在情感上让你多么发泄——对电脑来说帮助不大，你最好的沟通方式就是给计算机写字条，即磁盘上的一个文件。\n\
  \n要创建一个个人电脑信函，你需要使用一个名为文本编辑器的程序。这个程序是文字处理器的原始版本，去掉了所有花哨的格式和打印控制。文本编辑器让你输入文本——仅此而已。\n\
  \n使用你的文本编辑器，你创建一个所谓的源代码文件。这个唯一的特殊之处在于它包含了告诉计算机该做什么的指令。\n\n尽管如果能写像“发一个好笑的声音”这样的指令会很好，但事实是，你必须用计算机能理解的语言编写指令。在这种情况下，指令是用\
  \ `C` 语言编写的。\n\n*   源代码文件是磁盘上的文本文件。该文件包含了用 `C` 编程语言编写的计算机指令。\n*   你使用文本编辑器创建源代码文件。关于文本编辑器的更多信息，请参见附录\
  \ A。\n\n### 创建 GoodbyeHarry.C 源代码文件：\n\n使用你的文本编辑器创建以下源代码。仔细按照写的内容输入每一行；下方看到的所有内容都是重要且必要的。不要遗漏任何内容——\n\
  \n```c\n#include <stdio.h>\n\nint main()\n{\nprintf“Goodbye Harry, cruel world!\\\
  \\n”);\nreturn(0);\n}\n```\n\n当你检查你输入的内容时，注意其中有多少对你来说是。你识别了一些单词（`include`、`main`、“GoodbyeHarry,\
  \ cruel world!” 和 `return`），有些单词对你来说很奇怪（`stdio.h`、`printf` 和那个 `\\n` 之类的）。\n\n写完指令后，将它们保存到磁盘的文件。将文件命名为\
  \ `GOODBYEHARRY.C`。使用文本编辑器中的命令保存此文件，然后返回命令行提示符将你的指令编译成程序。\n\n### 你需要记住的 -\n\n* \
  \  在 Windows 记事本中，你必须确保文件以 `.C` 结尾而不是 `.TXT`。找一本关于 Windows 的书，查看如何显示文件名扩展名的说明，这有助于将带有\
  \ `.C` 扩展名的文本文件保存到磁盘上。\n*   注意文本大部分是小写的。它必须如此；编程语言不仅对大小写敏感——它们对大小写非常挑剔。当英语语法或标点符号规则变得混乱时不要担心；`C`\
  \ 是一种计算机语言，而不是英语。\n*   还要注意程序如何使用各种括号：角括号 `<` 和 `>`；大括号 `{` 和 `}`；以及普通的圆括号 `(` 和\
  \ `)`。\n\n## 保存它！编译并链接它！运行它！\n\n在 `C` 中构建任何程序都需要四个步骤：保存、编译、链接和运行。大多数 `C` 语言包会自动执行链接步骤。\n\
  \n尽管无论是手动完成还是自动，它仍然在其中。**保存！** 保存意味着保存你的源代码。你在文本编辑器中创建该源代码，并将其保存为带有 `C`（单字母 `C`）扩展名的文本文件。\n\
  \n**编译并链接！** 编译是将文本文件中的指令转换为计算机微处理器可以理解的指令的过程。链接步骤是指令最终转换为程序文件的地方。（再次，你的编译器可能会自动执行这一步。）\n\
  \n**运行！** 最后，你运行你创建的程序。是的，它是一个合法的程序，就像你硬盘上的任何其他程序一样。你已经在本章中完成了所有这些步骤，最终创建了 `GOODBYEHARRY`\
  \ 程序。这就是 `C` 程序的构建方式。\n\n在这个阶段，最困难的部分是知道在源文件中放什么，随着你对这本书的深入，这会变得越来越容易。（但到那时，让你的程序正确运行且无错误是最困难的部分！）\n\
  \n你会在书中经常找到保存、编译和运行的指令。这是因为这些步骤在多大程度上是机械的。更重要的是理解语言是如何运作的。这就是你将在下一章开始发现的事实。\n\n\
  ## C 语言历史 -\n\n正如我之前提到的，`C` 是由系统程序员 Dennis Ritchie 在 1970-72 年间在位于美国新西州的美国电报与电信公司\
  \ (AT & T) 贝尔实验室开发的。它最初是为在 UNIX 操作系统下进行编程而编写。\n\n`C` 是从 `BCPL`（基础组合编程语言）开发的，`BCPL`\
  \ 经过改进并重命名为 `B`。`B` 是 60 世纪在剑桥大学开发的。\n\n`C` 实际上是一种符号指令，一组在计算机上执行操作的命令。`C` 语言通常被称为中间语言，因为通过\
  \ `C` 可以编写高级和低级程序。\n\n`C` 之前的语言有 `FORTRAN`（公式翻译）、`COBOL`（通用面向业务语言）、`BASIC`（初学者通用符号指令代码）和\
  \ Pascal。`C` 之后的语言有 `C++`、`Java`、`C#` 等。`C` 允许与计算机内部工作进行紧密交互。\n\n\n\n\n一个典型的编译器由几个主要组件组成。第一个组件是扫描器（scanner），也称为词法分析器。`Scanner`\
  \ 读取程序并将其转换为标记（tokens）字符串。\n\n第二个组件是 `parser`（解析器）。它将标记字符串转换为解析树（或抽象语法树），该树捕捉了程序的语法结构。下一个组件是语义例程，用于解释语法结构的语义。其之后是代码优化和最终的代码生成。\n\
  \n# 什么是汇编器？\n\n汇编器是将汇编语言翻译成机器码的软件或工具。因此，汇编器是一种编译器，其源代码是用汇编语言编写的。\n\n汇编语言是一种人类可读的语言，但它通常与相应的机器码有一一一的关系。因此，汇编器被认为执行的是同构（一比一映射）翻译。高级的汇编器提供了支持程序开发和调试过程的额外功能。例如，被称为\
  \ `macro assemblers` 的汇编器类型提供了宏功能。\n\n## 汇编器和编译器有什么区别？\n\n编译器是一个读取一种语言编写的程序并将其转换为另一种语言的计算机程序，而汇编器可以被视为一种特殊的编译器，它只将汇编语言翻译成机器码。编译器通常直接从高级语言产生机器可执行代码。\n\
  \n但汇编器产生的是对象代码，这些代码可能需要使用 `linker` 链接程序进行链接才能在机器上运行。因为汇编语言与机器码有一比一映射，因此在性能非常重要的场合，可以使用汇编器生成运行极其高效的代码（例如图形引擎、硬件资源相对于个人电脑有限的嵌入式系统，如微波炉、洗衣机等）。\n\
  \n## ：\n\n| | 汇编器 | 编译器 |\n| :--- | :--- | :--- |\n| 1. | 它将 `PRN`、`ADD` 和 `SUB`\
  \ 等助记码转换为机器语言。 | 它将高级语言转换为汇编语言。 |\n| 2. | 使用汇编器执行的程序运行更快，因为它直接将源代码转换为机器语言。 | 执行程序需要时间，因为它首先将源代码转换为另一种编译器的语言，然后使用汇编器转换为机器语言。\
  \ |\n\n# 编译器和解释器之间的区别\n\n解释器类似于逐句翻译，而编译器类似于对整篇文章进行翻译。\n\n| | 编译器 | 解释器 |\n| :---\
  \ | :--- | :--- |\n| 1. | 编译器在执行之前一次性将整个高级语言程序翻译成机器语言程序。这优化了翻译程序中使用机器语言指令。因此，通常编译程序的运行速度比解释执行程序快。原始的高级程序称为源程序。编译器翻译后生成的机器语言程序称为目标程序。\
  \ | 解释器在执行程序时，逐条指令地将高级语言编写的程序翻译成机器语言。也就是说，它读取程序中的第一条指令并将其转换为等效的机器语言指令。然后 CPU 执行这些机器指令。之后，解释器读取并翻译下一条指令，依此类推。\
  \ |\n| 2. | 编译器将整个程序作为输入 | 解释器将单条指令作为输入。 |\n| 3. | 对象代码永久保存供以后使用。 | 不保存对象代码供以后使用。\
  \ |\n| 4. | 非耗时的翻译方法。 | 耗时的翻译方法。 |\n| 5. | 它在计算机中需要较大的空间。 | 解释器容易编写，不需要较大的内存空间。\
  \ |\n| 6. | 编译器的速度非常快。 | 速度非常慢。 |\n| 7. | 编译后源程序的任何更改都需要重新编译整个代码。 | 翻译过程中源程序的任何更改都不需要重新翻译整个代码。\
  \ |\n| 8. | 生成中间对象代码。 | 不生成中间对象代码。 |\n| 9. | 条件语句执行更快。 | 条件语句执行较慢。 |\n| 10. | 内存需求：更多（因为生成了对象代码）\
  \ | 内存需求较少。 |\n| 11. | 程序不需要每次编译。 | 每次都将高级程序转换为低级程序。 |\n| 12. | 在检查整个程序后显示错误。 |\
  \ 每解释每条指令时都会显示错误（如果有）。 |\n| 13. | 示例：C 编译器。 | 示例：BASIC。 |\n\n## 解释：编译器 VS 解释器\n\n\
  只需理解编译器和解释器的概念——\n\n1. 我们将完整的程序作为输入给编译器。我们的程序是人类可读格式。\n2. 人类可读格式经过许多[编译器的阶段和过程](http://www.c4learn.com/c-programming/what-is-compiler/)，最终转换为机器可读格式。\n\
  3. 然而，解释器一次接受单行代码作为输入并执行该行。一旦发现错误，它将终止代码的执行。\n4. [解释器的情况](http://www.c4learn.com/c-programming/what-is-interpreter/)内存需求较少，因为解释器情况下不会创建对象代码。\n\
  \n学习笔记 – 大多数学生真的不知道编译器和解释器之间的区别。学习一种新语言并不是容易的。你可能会认为问题出在脑子里。这就是为什么我尝试用许多形式解释差异。\n\
  \n编译器和解释器都实现相同的目的——将高级语言（如 C、Java）指令转换为计算机硬件可以理解的二进制形式。\n\n它们是用于执行高级程序和代码以完成各种任务的软件。特定的编译器/解释器为不同的高级语言设计。\n\
  \n然而，编译器和解释器都有相同的目标，但在完成任务的方式上（即将高级语言转换为机器语言）有所不同。仔细查看下方：\n\n### 编译器\n\n[编译器](http://www.engineersgarage.com/articles/what-is-compiler-tutorial)是将高级语言翻译成机器语言的代码段。当用户用\
  \ Java 等高级语言编写代码并希望执行它时，会在执行之前使用为 Java 设计的编译器。编译器首先扫描整个程序，然后将其转换为机器码，由计算机处理器执行并完成相应的任务。\n\
  \n![编译器工作](img/image00825.jpeg)\n\n图中显示了编译过程的基本概述，这里用高级语言编写的程序称为源程序，转换后的称为目标程序。\n\
  \n### 解释器\n\n解释器与编译器没有太大区别。它们也将高级语言转换为机器可读的二进制等物。每当解释器获取要执行的高级语言代码时，它会在转换为机器码之前将其转换为中间代码。代码的每个部分都被解释并按顺序单独执行，如果在代码某部分发现错误，它将停止解释代码而不翻译下一组代码。\n\
  \n![解释器工作](img/image00826.jpeg)\n\nC 语言的优点 -\n\n\n\n\n\n1. C 是一种通用编程语言。你可以生成游戏、商业软件、实用程序、数学模型、文字处理器、电子表格和其他软件。\n\
  2. C 是一种结构化编程语言。它使用结构语句（如 `while`、`for` 循环）来代替会导致程序出现漏洞（错误）的 `goto` 语句。\n3. 系统独立性\
  \ - C 不需要操作系统的任何服务，它可以独立运行。C 可以运行在任何操作系统上。\n4. 高效性 - C 编译器通常能够将源代码转换为高效的机器指令。C 语言的数据和控制机制与大多数小型计算机和微型计算机匹配。\n\
  5. 系统编程 - C 用于系统编程，即编写操作系统。UNIX 操作系统也是用 C 语言重写的。\n\n## 语法与语义的区别\n\n| 语义 (Semantics)\
  \ | 语法 (Syntax) |\n| :--- | :--- |\n| 它是程序的逻辑或规划。语义可以用以下任何方式编写：<br>1. 流程图。<br>2.\
  \ 算法。<br>3. 伪代码。 | 它是使用特定编程语言编写程序的方法。语法随语言而变化。 |\n\n## 流程图 (FLOWCHART)\n\n它是程序逻辑符号化的表示。逻辑中使用一些预定义的符号。流程图显示了程序逻辑的实际流。\n\
  \n流程图无非解决问题涉及的各种步骤的图表示。流程图指示了过程流的方向、相关的操作和计算、决策点以及作为解决方案部分的信息。一旦开发并经过适当检查，流程图为编写程序提供了极佳的指导。\n\
  \n![](img/image00827.jpeg)\n\n## 算法 (ALGORITHMS)\n\n一旦问题正确定义，就必须开发一个详细的、有限的、逐步的程序来解决它。这个程序被称为算法。算法可以用普通语言编写，也可以使用介于普通语言和编程语言之间的正式过程。\n\
  \n### 两个数相加的算法 –\n\n1. 读取 `A`, `B`。\n2. 设置 `SUM := A+B`。\n3. 输出 `SUM`。\n4. 退出。\n\
  \n## 伪代码 (PSEUDOCODE)\n\n有时，将算法翻译成流程图和源代码之间的中间形式是有用的。伪代码是源代码的英语近似，它遵循语言的规则、风格和格式，但忽略了大多数标点符号。\n\
  \n```\nmain()\n{\n    integer a,b,sum;\n    read in a and b;\n    add a & b and\
  \ set it to sum;\n    write sum;\n}\n```\n\n## C 程序的结构（源代码）\n\n让我们通过一个示例来讨论 C 程序的结构：\n\
  \n```c\n/*sum of two numbers*/\n#include<stdio.h>                   /* For printf()\
  \ & scanf() */\n#include<conio.h>                   /* For clrscr() & getch() */\n\
  main()                                  /* Starting point of the program execution*/\n\
  {\n    int a,b,sum;                        /* Variable Declarations */\n    clrscr();\
  \                            /* Clear Screen */\n    printf(\"enter two numbers\"\
  );         /* Request for Input */\n    scanf(\"%d %d\",&a,&b);             /* Input\
  \ from user */\n    sum=a+b;                            /* Adding two numbers */\n\
  \    printf(\"sum=%d\",sum);               /* Output */\n    getch();          \
  \                  /* To hold output */\n}                                   /*\
  \ End of main */\n```\n\n## C 程序解释\n\n### 头文件故事 (STORY OF HEADER FILES)\n\n头文件包含函数和变量的定义，可以使用预处理器\
  \ `#include` 整合到任何 C 程序中。每个编译器都提供标准头文件，涵盖了字符串处理、数学、数据转换、打印和读取变量等范围。\n\n要使用任何标准函数，都应该包含相应的头文件。这在\
  \ C 源文件的开头完成。例如，要在程序中使用 `printf()` 函数，行行\n`#include <stdio.h>`\n应该位于源文件的开头，因为 `printf()`\
  \ 的定义位于 `stdio.h` 文件中。所有头文件都有 `.h` 扩展名，通常位于 `/include` 子目录下。\n\n`#include <stdio.h>`\n\
  `#include \"mydecls.h\"`\n\n使用角括号 `<>` 告诉编译器在编译器的包含目录中搜索指定的文件。在文件名周围使用双引号 `\"\"\
  ` 则告诉编译器在当前目录下搜索指定的文件。\n\n## 键盘输入 (KEYBOARD INPUT)\n\nC 语言中有一个函数允许程序员从键盘接受输入。下面的程序说明了该函数的使用：\n\
  \n```c\n#include <stdio.h>\nmain()                               /* program which\
  \ introduces keyboard input */\n{\n    int number;\n    printf(\"Type in a number\
  \ \\n\");\n    scanf(\"%d\", &number);\n    printf(\"The number you typed was %d\\\
  n\", number);\n}\n```\n\n定义了一个名为 `number` 的整数。然后使用语句\n`printf(\"Type in a number\
  \ \\n:\");` 打印输入数字的提示。\n\n接受响应的 `scanf` 例程有两个参数。第一个 `\"%d\"` 指定了预期的数据类型（即 `char`、`int`\
  \ 或 `float`）。\n\n第二个参数 `&number` 指定了将输入的响应置于变量中。在这种情况下，`&` 表示“……的地址”。\n\n## #include\n\
  \n注释放置在 `/*` 和 `*/` 序列之间，可以跨越任意行。\n\n## Main\n\n`main` 函数是最重要的。它定义了程序开始执行的点。如果你不写\
  \ `main` 函数，你的程序将无法运行（它将没有起点）。事实上，它甚至无法通过编译。\n\n## 大括号 (Braces)\n\nC 使用大括号字符 `{`\
  \ 表示“开始”，使用 `}` 表示“结束”。它们更容易输入，而且过段时间后阅读起来容易得多。\n\n## Printf ()\n\n`printf` 函数是产生输出的标准方式。该函数定义在标准库中，因此它始终在那里且始终以相同的方式工作。此示例显示\
  \ `printf` 和 `scanf` 共享相同的格式指定符。\n\n当遇到 `\"%i\"` 时，它们都处理整数。`scanf` 因为是一个读取函数，所以从键盘读取整数。`printf`\
  \ 因为是一个写入函数，所以将整数写入屏幕。\n\n## Scanf()\n\n`scanf` 函数是 `printf` 的相反函数。当 `printf` 在屏幕上产生输出时，`scanf`\
  \ 从键盘读取。序列 `\"%i\"` 指示 `scanf` 从键盘读取一个整数。由于使用了 `\"%i %i\"`，将读取两个整数。输入的第一个值放入变量 `a`\
  \ 中，第二个放入 `b` 中。\n\n\n\n\n\n在 `\"%i %i\"` 中，两个 `\"%i\"` 之间的空格是重要的：它指示 `scanf` 键盘上输入的两个数字可能由空格分隔。如果使用\
  \ `\"%i,%i\"`，则用户将被强制在两个数字之间输入一个逗号。\n\n### 换行 (Newline)\n字符 `\\` 后跟 `n` 的双序列是 C\
  \ 处理换行的方式。当打印时，它会使光标移动到下一行的开头。\n\n### 返回 (Return)\n`Return` 将值（在此处为 0）传回给操作系统。操作系统如何处理此信息取决于它。例如，MS-DOS\
  \ 将其存储在 `ERRORLEVEL` 变量中。UNIX 的 Bourne 和 Korn Shell 将存储在一个临时变量 `$?` 中，该变量可以在 shell\
  \ 脚本中使用。“传统”认为 0 表示成功。\n\n值 1、2、3 等表示失败。所有操作系统都支持高达 255 的值。某些系统支持高达 65535 的值，尽管如果你对代码的可移植性有重要要求，也应该只使用\
  \ 0 到 255 之间的值。\n\n### 取地址符 (Ampersand)\n`&` 在 `scanf` 中非常重要。它允许修改所涉及的变量，这也被称为地址符（Ampersand）。因此在--\n\
  \n```c\nscanf(\"%i\", &j)\n```\n\n`&` 允许变量 `j` 发生改变。如果没有这个神秘的字符，C 会阻止 `scanf` 修改\
  \ `j`，它将保留其之前拥有的随机值（除非你记得初始化它）。由于 `printf` 不需要更改它所打印的任何变量的值，因此它不需要任何 `&` 符号。因此，如果\
  \ `j` 包含 15，执行语句后：\n\n```c\nprintf(\"%i\", j);\n```\n\n我们就会信心地预期变量中的是 15，因为 `printf`\
  \ 无法改变它的值。\n\n# C 的格式 \n\n* 语句以分号 `;` 结束。\n* 编译器忽略缩进。\n* C 是区分大小写的语言 - 所有关键字和标准都是。\n\
  * 库函数为小写。\n* 字符串放置在双引号中。\n* 换行通过 `\\n` 处理。\n* 程序能够标记成功或错误，那些忘记这么做的只能随机选择一种（结果）！\n\
  \n## 分号 (Semicolons)\n分号在 C 中非常重要。它们构成语句终止符，告诉编译器一个语句何时结束，下一个语句何时开始。如果你没有在每个语句后放置分号，你将得到编译错误。\n\
  \n## 自由格式 (Free Format)\nC 是一种自由格式语言。这就是在处处必须使用分号的优点。将一个语句跨越两行没有问题——你只需要不在语句中间放置分号即可（反正你也不会在那里放置）。\n\
  \n示例程序中经过仔细放置的空格和制表符会被编译器忽略。缩进是完全可选的，但应该使用它来提高程序的可读性。\n\n## 区分大小写 (Case Sensitivity)\n\
  C 是一种区分大小写的语言。虽然 `int` 可以编译，但 “Int”、“INT” 或任何其他变体都不行。所有 40 多个 C 关键字都是小写的。标准库中的数百个函数都是小写的。\n\
  \n## 随机行为 (Random Behavior)\n既然说了 `main` 要向操作系统返回一个整数，忘记这样做（无论是通过只写 `return` 或完全省略返回）将导致向操作系统返回一个随机整数。\n\
  \n这个随机值可能是 0（成功），在这种情况下你的程序可能会随机成功。更有可能的是非零值，它会随机指示失败。\n\n练习笔记 - WAP 意味着“编写程序”（Write\
  \ a Program），关于主题的编程示例请参阅本书的最后章节。\n\n![](img/image00828.jpeg)\n\n### 上述 C 程序的重要特征：\n\
  \n1. C 程序的指令用小写输入，但变量和用户定义的项可以用大写。\n2. 该程序的第一行是注释。每个注释都以斜杠和星号 (`/*`) 开头，以星号和斜杠 (`*/`)\
  \ 结束。注释帮助程序员解释程序的逻辑。它提高了了程序的可读性。\n   这些注释可以放置在程序的任何位置。编译器不读取这些注释。不允许嵌套注释。注释是对程序中语句的解释，以提高程序的可读性。\n\
  3. 注释不是必须的；但在程序开始时写一条注释，说明程序的目的、作者和编写日期，是一个良好的习惯。\n   可以在程序的任何地方编写任意数量的注释，例如，可以在\
  \ --- 语句之前、之后或语句内部编写注释。注释可以跨多行编写，这种被称为多行注释。\n4. 程序的第二行和第三行被称为头文件 (`stdio.h` 和 `conio.h`），它们包含了编译之前必须包含程序的信息。`#`\
  \ 是预处理器指令或编译器指令。该语句指示编译器在编译程序之前包含头文件。我们也可以写 `<stdio.h>`。\n5. 每一个 C 程序由一个或多个称为函数的模块组成。其中一个函数是\
  \ `main()`。程序的执行从 `main` 函数开始，它可能会调用其他函数。整个程序写在花括号括起来的这个 `main` 函数中。使用多个 `main()`\
  \ 是非法的。\n6. 变量的声明在程序的左括号后立即进行。我们不能在程序的中间声明变量。\n7. 注意，`main` 函数中的每个语句都以分号 (`;`) 结束。\n\
  8. 接下来是 `printf()` 语句：`printf(\"Enter numbers\");` `printf` 是一个输出命令，要求用户输入数字。此消息被称为“提示消息”，并打印在屏幕上。\n\
  9. 通过下一个语句 `scanf(\"%d %d\",&a,&b);` 从计算机获取值，`scanf` 是根据指定的格式符从用户处获取值并存储在指定的变量中。`&`\
  \ 被称为地址运算符。\n10. 接下来是赋值语句：`sum=a+b;` 将变量 `a` 和 `b` 的值相加赋值给变量 `sum`。\n11. 最后一个 `printf()`\
  \ 用于在屏幕上显示计算出的和。\n12. 最后 `getch()` 函数用于显示输出屏幕。\n13. `main()` 内部的所有语句都领先于 `main()`。这显示所有语句都在\
  \ `main()` 函数内部。\n\n![](img/image829.jpeg)\n\n### 单选题：\n\n1. C 是：a. 高级语言 b. 低级语言\
  \ c. 中级语言 d. 汇编语言\n2. 程序的逻辑被称为：a. 语法 b. 语义 c. 流程图 d. 调试\n3. C 语言由以下哪位人士开发：a. Ken\
  \ Thompson b. Dennis Ritchie c. Patrick Naughton d. Ed Frank\n4. 流程图用于决定：a. 寻找解决方案所涉及的步骤顺序\
  \ b. 制作算法的辅助 c. 准备决策表 d. 调试程序\n5. C 程序通过帮助 的帮助转换为机器语言：a. 编辑器 b. 编译器 c. 操作系统 d. 以上都不是\n\
  6. C 可以用于：a. 仅 MS-DOS 操作系统 b. 仅 Linux 操作系统 c. 仅 Windows 操作系统 d. 以上都是\n\n| 答案：1(c)\
  \ 2(b) 3(b) 4(a) 5(b) 6(d) |\n\n\n\n\n\n![very-small-rose](img/image00819.jpeg)\
