  \ 小的元素是 %d\",k, a[k-1]);\n```\n\n### 以下程序的输出结果是什么？\n\n1.\n```c\nint num[26],temp;\n\
  num[0] = 100;\nnum[25] = 200;\ntemp = num[25];\nnum[25] = num[0];\nnum[0] = temp;\n\
  printf(\"\\n%d %d\",num[0],num[25]);\n```\n**输出：** 200 100\n在声明后的前两个语句中，第一个和最后一个元素分别被赋值为\
  \ `100` 和 `200`，在接下来的三个语句中交换了它们的位置。因此 `num[0] = 200` 且 `num[25] = 100`。\n\n2.\n\
  ```c\nint array[26],i;\nfor (i = 0; i<=25;i++){\n    array[i] = 'A' + i;\n    printf(\"\
  \\n%d %c\",array[i], array[i]);\n}\n```\n**输出：**\n65 A\n66 B\n...\n90 Z\n在上面的程序中，第一次数组\
  \ `i` 的值为 65，因为 `i = 0` 且 `'A'` 给出 65，所以 `array[0] = 65`，通过 `printf()` 以整数和字符格式打印出来。每当\
  \ `i` 增加 1 时，数组会在连续的位置上包含 66, 67, 68，并通过 `printf()` 以整数和字符格式打印。\n\n3.\n```c\nint\
  \ sub[50],i;\nfor( i = 0; i <= 48; i++);\n{\n    sub[i] = i;\n    printf(\"\\n%d\"\
  ,sub[i]);\n}\n```\n**输出：** 49\n由于 `;`（空语句）的存在，循环会执行到 48 为止，大括号内的代码块只执行一次。此时 `i`\
  \ 的值为 49，执行 `sub[49] = 49` 并打印 49。\n\n4.\n```c\nint b[] = {10,20,30,40,50};\nint\
  \ i;\nfor(i = 0; i<5; i++)\n*(b+i)\n```\n**输出：** 10 20 30 40 50\n在上面的程序中，`i` 从 0\
  \ 到 4 变化，`*(b+i)` 对应 `b[i]`，因此依次打印出数组中的每个元素。\n\n5.\n```c\nstatic int a[5];\nint\
  \ i;\nfor( i = 0; i<5; i++)\n```\n**输出：** 0 0 0 0 0\n因为 `a` 是静态数组，初始化为 0。在上述语句中\
  \ `i` 为 0 时，数组元素赋值为 0。\n\n6.\n```c\nmain( ){\n    int a[] = {2,6,4,8,10};\n    int\
  \ i;\n    change( a, 5);\n    for(i = 0;i<5;i++)\n        printf(\"%d \",a[i]);\n\
  }\nchange(int *b, int n)\n{\n    int i;\n    for(i = 0;i<n;i++)\n        *(b+i)\
  \ = *(b+i)+5;\n}\n```\n**输出：** 7 11 9 13 15\n这里指针 `b` 接收 `a` 的基地址，5 被传递给 `n`。在 `change()`\
  \ 中，每次 `b[i]` 被替换为 `b[i]+5`。首先 `b[0] = b[0]+5` (2+5→7)，随后后四个元素也发生了变化，最后在 `main()`\
  \ 中打印出 7 11 9 13 15。\n\n7.\n```c\nint a[ 5] = {5,1,15,20,25};\nint i,j,k = 1,m;\n\
  i = ++a[1];\nj = a[1]++;\nm = a[i++];\nprintf(\"\\n%d %d %d\",i,j,m);\n```\n**输出：**\
  \ 3 2 15\n在第三条语句 `i = ++a[1]` 中，我们知道数组索引从 0 开始，所以 `a[1] = 1`。在上述语句使用了前置增，`a[1]`\
  \ 的值先增为 2 然后赋值，所以 `i` 将为 2，即 `a[1] = 2` 且 `i = 2`。再次在下一条语句 `j = a[1]++` 中，使用了后置增，首先将\
  \ `a[1]` 的值赋值给 `j`，所以 `j` 为 2，然后 `a[1]` 增为 3。现在在后续语句 `m = a[i++]` 中，因为 `i = 2`，所以\
  \ `a[i]`（即 `a[2]`）被赋值给 `m`，其值为 15，赋值 `m=15` 然后 `i` 递增变为 3。因此最终 `i = 3`, `j = 2`,\
  \ `m = 15`。 |\n\n![](img/image00847.jpeg)\n\n指出以下程序段中的错误（如有）：\n\n\n\n\n\n## 数组示例与分析\n\
