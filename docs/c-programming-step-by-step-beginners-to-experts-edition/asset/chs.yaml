  \ a) `scanf( )`\n   b) `gets( )`\n   c) `getche( )`\n   d) `getchar( )`\n   **输出：**\
  \ `getche( )`\n\n3. 如果通过键盘输入一个整数，你会使用哪个函数？\n   a) `scanf( )`\n   b) `gets( )`\n\
  \   c) `getch( )`\n   d) `getche( )`\n   **输出：** `scanf( )`\n\n4. 如果通过键盘接收一个字符串，哪个函数工作速度更快？\n\
  \   a) `scanf( )`\n   b) `gets( )`\n   **输出：** `gets( )`\n\n5. `getchar( )`、`fgetchar(\
  \ )`、`getch( )` 和 `getche( )` 之间的区别是什么？\n   **输出：** 所有都从键盘接收字符。它们之间存在细差异：\n   -\
  \ `getchar( )`：从键盘接收字符，但在字符后必须按回车键。\n   - `fgetchar( )`：与 `getchar( )` 相同。`getchar(\
  \ )` 是宏而 `fgetchar( )` 是函数。\n   - `getch( )`：从键盘接收字符且不在屏幕上回显（显示）。\n   - `getche(\
  \ )`：从键盘接收字符并回显到屏幕上。\n\n6. `printf( )` 的格式字符串可以包含：\n   a) 字符、格式规范和转义序列\n   b) 字符、整数和浮点数\n\
  \   c) 字符串、整数和转义序列\n   d) 引号、百分号和反斜杠字符\n   **输出：** a) 字符、格式规范和转义序列\n\n![11](img/image00863.jpeg)\
  \ ![11](img/image00863.jpeg) ![11](img/image00863.jpeg) ![11](img/image00863.jpeg)\n\
  \n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 12 章：通过 C 进行文件处理\n\n## 引言\n到目前，我们一直使用\
  \ `scanf` 和 `printf` 函数来读写数据。这些是面向控制台的输入输出函数，始终使用键盘和屏幕作为目标。在数据量较小时没有问题。但在现实问题中涉及大量数据，在这种情况下，面向控制台的输入输出操作有两个主要问题：\n\
  \nA. 处理大量数据非常耗时。\nB. 程序一关闭或计算机关机，所有数据都会丢失。\n\n为了解决这些问题，我们使用文件处理。文件可以将数据存储在硬盘上，这样数据就可以被永久保存，即使计算机关闭也不会被删除。\n\
  \n文件可以定义为磁盘上的一个位置，存储一组相关数据。对文件可以执行若干操作：\n* 命名文件。\n* 打开文件。\n* 从文件中读取数据。\n* 向文件中写入数据。\n\
  * 关闭文件。\n\n### 文件函数表\n\n| 函数名 | 操作 |\n| :--- | :--- |\n| `fopen()` | 创建新文件或打开一个现有文件供使用。\
  \ |\n| `fclose()` | 关闭文件。 |\n| `fgetc()` | 从文件中读取一个字符。 |\n| `fputc()` | 向文件中写入一个字符。\
  \ |\n| `fprintf()` | 向文件中写入数据。 |\n| `fscanf()` | 从文件中读取数据。 |\n| `fgetw()` | 读取一个整数。\
  \ |\n| `fputw()` | 写入一个整数。 |\n| `fseek()` | 将位置设置到文件中指定的点。 |\n| `ftell()` | 给文件中当前的位置（即从开始计算的字节数）。\
  \ |\n| `rewind()` | 将位置设置到文件的开头。 |\n| `fwrite()` | 向文件写入数据。 |\n| `fread()` | 从文件中读取数据。\
  \ |\n| `feof()` | 测试是否到达文件末尾。 |\n| `fflush()` | 刷新流。 |\n| `Remove()` | 删除指定的文件。\
  \ |\n| `Rename()` | 修改文件的名称或路径。 |\n| `ferror()` | 测试文件中是否发生了错误。 |\n\n## 打开文件\n在我们从硬盘上的文件读取或向其写入信息之前，必须打开文件。\n\
  \n使用打开文件的函数 `fopen( )` 并指定一个模式，该模式告诉编译器我们要写、读或修改文件。此 `fopen()` 函数执行三个任务：\n* 在磁盘上搜索文件。\n\
  * 然后它将文件从磁盘加载到名为 `buffer`（缓冲区）的内存区域。\n* 它设置一个字符指针，该指针指向缓冲区中的第一个字符。\n\n### 缓冲区的必要\n\
  缓冲区是计算机内存中的临时区域，文件在此处留存一段时间以便快速访问以读写字符。如果每次都去硬盘读取一个字符打印在屏幕上，然后再次去硬盘访问下一个字符，效率将非常低。\n\
  \n这时缓冲区派上用场了，每当我们打开文件时，文件的内容就会进入这个临时区域，然后从缓冲区而不是磁盘逐字符读取；同样地，一次一次将字符写入磁盘将浪费时间，因此使用缓冲区写入字符，然后将它们传输到磁盘。`fopen()`\
  \ 收集文件名、文件大小和打开模式等信息，然后将该文件的地址返回给文件指针。可以解释为：\n\n```c\nFILE *fp;\nfp=fopen(\"file_name\"\
  ,\"mode\");\n```\n`FILE` 是在头文件 `std.h` 中定义的常量，因此必须使用 `#include<stdio.h>`。\n\n##\
  \ 读取文件\n函数 `fgetc( )` 用于读取已从硬盘（部分或全部）带入缓冲区的文件内容。`fgetc( )` 使用如下：\n```c\nfgetc(fp);\n\
  ```\n`fgetc( )` 读取指针当前位置的字符赋值给变量 `ch`。在文件末尾使用一个特殊字符来结束无限循环。`EOF` 也定义在 std.h 中。`fgetc()`\
  \ 可以替换为 `getc()`。该字符的 ASCII 值为 26。\n\n有时在使用 `\"r\"` 模式打开文件时会遇到问题，如果磁盘上不存在该文件。同样，打开\
  \ `\"w\"` 模式的文件也可能由于许多原因失败，如磁盘空间不足或磁盘损坏。如果文件没有打开，`fopen()` 函数返回 `NULL`。（在 std.h\
  \ 中定义并用 `# define NULL 0` 使用）。\n\n### 文件打开模式：\n* `\"r\"`：仅读现有文件。\n* `\"w\"`：仅写新文件。\n\
  * `\"a\"`：在现有文件追加。\n* `\"r+\"`：同时读写现有文件。\n* `\"w+\"`：同时读写新文件。\n* `\"a+\"`：同时读写追加现有文件。\n\
  \n## 向文件写入字符\n函数 `fputc( )` 用于将屏幕上的字符打印到文件中。要在文件中打印字符串，使用函数 `fputs( )`。\n* `fputc(ch,fp)`;这里\
  \ `ch` 是字符名，`fp` 是文件指针。\n* `fputs(s,fp)`;这里 `s` 是字符串名，`fp` 是文件指针。\n\n让我们尝试一个简单的程序：\n\
  ```c\n#include<stdio.h>\nmain()\n{\n    FILE *fp; /*声明文件指针*/\n    fp = fopen(\"\
  sample.dat\",\"r\"); /*以读模式打开文件 sample.dat*/\n    if(fp==NULL)\n    {\n        printf(\"\
  file cannot be opened\");\n    }\n    else\n    {\n        ………\n        fclose(fp);\n\
  \    }\n}\n```\n\n## 关闭文件\n当我们完成对文件的读取后，需要关闭它。这是通过 `fclose( )` 实现的。用法如下：`fclose(fp);`。\n\
  \n\n\n\n\n要关闭文件，我们不需要文件名。`fclose()` 函数执行了三个主要任务：\n\n*   缓冲区中的字符将被写入磁盘上的文件中。\n* \
  \  在文件末尾，将写入一个 ASCII 值为 26 的字符。\n*   缓冲区将从文件中移除。（注：原文为 \"eliminated from the file\"\
  ，这可能指的是缓冲区被清空/刷新）。\n\n### 1. 字符计数程序\n编写一个程序，用于统计文件中字符、空格、制表符和换行符的数量。\n\n```c\n#include<stdio.h>\n\
  \nmain()\n{\n    FILE *fp;\n    char ch;\n    int lines=0,tab=0,space=0, characters=0;\n\
  \    fp=fopen(\"text.c\",\"r\");\n    while(1)           /* infinite loop*/\n  \
  \  {\n        ch = fgetc(fp);\n        if(ch == EOF)\n            break;\n     \
  \   characters++;\n        if(ch == 32)\n            space++;\n        if(ch ==\
  \ '\\n')\n            lines++;\n        if(ch == '\\t')\n            tab++;\n  \
  \  }\n    fclose(fp);\n    printf(\"number of lines = %d\\ntabs = %d\\ncharacters\
  \ = %d\\nspaces = %d\",lines,characters,space);\n    getch();\n}\n```\n\n### 2.\
  \ 字符串输入程序\n编写一个程序，从键盘接收一些字符串并将其打印到文件中。\n\n```c\n#include<stdio.h>\n\nmain()\n{\n\
  \    FILE *fp;\n    char s[50];\n    fp=fopen(\"text.c\",\"w\");           /*opening\
  \ file*/\n    if(fp == NULL)                   /*to check opening errors*/\n   \
  \ {\n        puts(\"file opening error\");\n        exit();\n    }\n    printf(\"\
  Enter some text\");\n    while(strlen(gets(s))>0)\n    {\n        fputs(s,fp);\n\
  \        fputs(\"\\n\",fp);\n    }\n    fclose(fp);\n}\n```\n\n### 3. 读取程序\n编写一个程序，从文件中所有字符串并将其打印到屏幕上。\n\
  \n```c\n#include<stdio.h>\n\nmain()\n{\n    FILE *fp;\n    char s[50];\n    fp=fopen(\"\
  text.c\",\"r\");           /*opening file*/\n    if(fp == NULL)                \
  \   /*to opening errors*/\n    {\n        puts(\"file opening error\");\n      \
  \  exit();\n    }\n    while(fgets(s,49,fp)!= NULL)\n        printf(\"%s\",s);\n\
  \    fclose(fp);\n    getch();\n}\n```\n\n## 多选择题\n\n1. **如果文件被正确关闭，`fclose` 返回什么值：**\n\
  \   a. 零\n   b. 一\n   c. -1\n   d. 无\n\n2. **用于查看是否发生错误的函数是：**\n   a. `ferror`\n\
  \   b. `iota`\n   c. `fseek`\n   d. 无\n\n3. **哪种模式以读写模式打开文件？**\n   a. `r`\n   b.\
  \ `i`\n   c. `w`\n   d. 无\n\n4. **在以下代码中：`FILE *fp = fopen(\"text.c\",\"r\");`，`fp`\
  \ 是什么**\n   a. 第一个字符\n   b. 指向字符的结构\n   c. 文件名\n   d. 无\n\n5. **给定：`FILE *fp = fopen(\"\
  text.dat\",\"a\");`，错误在哪里？**\n   a. 以上均是\n   b. `FILE_fp`\n   c. `FILE *fp`\n  \
  \ d. 无\n\n6. **关闭文件时我们使用：**\n   a. `exit(fp)`\n   b. `fclose(fp)`\n   c. `break`\n\
  \   d. `fclose(fp)`\n\n7. **使用哪种条件测试文件末尾？**\n   a. `eof`\n   b. `ferror`\n   c.\
  \ `feof`\n   d. 无\n\n8. **哪个函数接受文件指针并将位置重置到文件开头？**\n   a. `fseek`\n   b. `rewind`\n\
  \   c. `ftell`\n   d. 以上全部\n\n**答案：** 1(a), 2(a), 3(d), 4(b), 5(c), 6(b), 7(c),\
  \ 8(b)\n\n\n\n\n\n### 1. 文件打开示例\n```c\n#include \"stdio.h\"\nmain() {\n    FILE\
  \ *fp;\n    openfile(\"Myfile.txt\", &fp);\n    if(fp == NULL)\n        printf(\"\
  Unable to open file…\");\n}\nopenfile(char *fn, FILE **f) {\n    *f = fopen(fn,\
  \ \"r\");\n}\n```\n**输出：** 无错误。在上面的打开文件程序中，使用了函数 `openfile()` 并传递了两个参数：第一个是文件名，第二个是文件指针。因为文件名是一个字符串，所以类型为\
  \ `char` 的指针将接收它，而文件指针 `f` 被声明为 `FILE` 类型。`FILE` 是一个预定义的结构体，由于 `f` 接收的是一个指针地址，因此它被声明为双指针。\n\
  \n### 2. NULL 的大小写敏感\n```c\n#include \"stdio.h\"\n#include \"stdlib.h\"\nmain()\
  \ {\n    FILE *fp;\n    char c;\n    fp = fopen(\"Try.c\", \"r\");\n    if(fp ==\
  \ null) {\n        puts(\"Cannot open file\");\n        exit();\n    }\n    while((c\
  \ = getc(fp)) != EOF);\n    putch(c);\n    fclose(fp);\n}\n```\n**输出：** 错误。`null`\
  \ 必须大写，它在 `stdio.h` 中定义为 `#define NULL 0`。\n\n### 3. 缺少头文件\n```c\nmain() {\n   \
  \ char fname[] = \"c:\\\\students.dat\";\n    FILE *fp;\n    fp = fopen(fname, \"\
  r\");\n    if (fp == NULL)\n        printf(\"\\nUnable to open file…);\n}\n```\n\
  **输出：** 错误，但请记住包含 `\"stdio.h\"`。\n\n### 4. 错误的 fputs 使用法\n```c\nmain() {\n    FILE\
  \ *fp;\n    char str[80];\n    fp = fopen(\"Try.c\", \"r\");\n    while(fgets(str,\
  \ 80, fp) != EOF)\n        fputs(str);\n    fclose(fp);\n}\n```\n**输出：** 错误，因为 `fputs()`\
  \ 需要两个参数，且应该写成 `fputs(str, fp)`；并且因为我们在循环中使用字符串，所以 `EOF` 的位置应该是 `NULL`。\n\n### 5.\
  \ 类型不匹配\n```c\nunsigned char ch;\nFILE *fp;\nfp = fopen(\"matrix\", \"r\");\nwhile((ch\
  \ = getc(fp)) != EOF)\n    printf(\"%c\", ch);\nfclose(fp);\n```\n**输出：** `EOF`\
  \ 在文件 `\"stdio.h\"` 中被定义为 `#define EOF -1`，而 `unsigned char` 的范围是从 0 到 255，因此当从文件中读取\
  \ `EOF` 时，它无法被 `ch` 容纳。解决方案是将 `ch` 声明为 `int`。\n\n### 6. 语法错误\n```c\nunsigned char\
  \ ch;\nFILE *fp;\nfp = fopen(\"matrix\", \"r\");\nif(!fp) {\n    printf(\"file error\"\
  );\n    exit();\n}\nfclose(fp);\n```\n**输出：** 无错误。\n\n### 7. 引号与符号错误\n```c\n#include\
  \ \"stdio.h\"\nmain() {\n    unsigned char ch;\n    FILE *fp;\n    fp = fopen(\"\
  trial\", 'r');\n    while((ch = getc(fp)) != EOF)\n        printf(\"%c\", ch);\n\
  \    fclose(*fp);\n}\n```\n**输出：** 错误。调用 `fopen` 时参数 `_mode` 类型不匹配，因为模式必须包含在双引号中。存在未定义的符号\
  \ `ch`。调用 `fclose` 时参数 `_stream` 类型不匹配，`fp` 处不需要使用 `*` 号。\n\n### 8. EOF vs NULL\n\
  ```c\nmain() {\n    FILE *fp;\n    char name[25];\n    int age;\n    fp = fopen(\"\
  yours\", \"r\");\n    while(fscanf(fp, \"%s %d\", name, &age) != NULL)\n       \
  \ printf(\"%s %d\\n\", name, age);\n    fclose(fp);\n}\n```\n**输出：** 错误。应该使用 `EOF`\
  \ 而不是 `NULL`，因为 `fscanf` 将从文件中读取记录，当它到达最后一条记录时，会遇到 `EOF`。\n\n### 9. fwrite 和 fclose\
  \ 使用法\n```c\nmain() {\n    FILE *fp;\n    char names[20];\n    int i;\n    fp =\
  \ fopen(\"student.dat\", \"wb\");\n    for(i = 0; i < 0; i++) {\n        puts(\"\
  \\enter name\");\n        gets(name);\n        fwrite(name, sizeof(name), 1, fp);\n\
  \    }\n    close(fp);\n}\n```\n**输出：** 错误。`sizeof` 应该是一个单词，且应该使用 `fclose` 来关闭文件。\n\
  \n### 10. fseek 偏移量\n```c\nFILE *fp;\nfp = fopen(\"matrix\", \"r\");\nfseek(fp,\
  \ 20, SEEK_SET);\nfclose(fp);\n```\n**输出：** 应使用 `20L` 而不是 20，因为 `fseek()` 需要一个 `long`\
  \ 类型的值。\n\n### 11. fgets 逻辑\n```c\nFILE *fp;\nchar s[80];\nfp = fopen(\"matrix\"\
  , \"r\");\nwhile(!feof(fp)) {\n    fgets(s, 80, fp);\n    puts(s);\n}\nfclose(fp);\n\
  ```\n**输出：** 文件 `\"matrix\"` 的最后会被读取两次。为了避免这种情况，请使用 `while(fgets(s, 80, fp) != NULL)`。\n\
  \n---\n\n# 第 13 章：杂题\n\n## 宏引论\n我们已经知道 `#define` 语句可以定义符号常量，因此常量提供了一种简写形式。`define`\
  \ 语句也可以定义宏，即它们可以替换表达式、完整的语句或一组语句。\n\n使用宏寻找两个数最大值的程序：\n\n```c\n#define max(a,b) a>b?a:b\n\
  /*宏声明*/\nmain() {\n    int a, b, ans;\n    printf(\"Enter two numbers\");\n    scanf(\"\
  %d %d\", &a, &b);\n    ans = max(a, b);\n    printf(\"max = %d\", ans);\n    getch();\n\
  }\n```\n该程序包含一个宏 `max`，它代表表达式 `a>b?a:b`。当程序编译时，表达式 `a>b?a:b` 会替换标识符 `max`。\n\n宏定义通常放置在文件的开头，第一个函数定义之前。宏的作用域是全局的。\n\
  \n可以通过在最后一行之外的每行末放置反斜杠来定义多行宏。这种特性允许单个宏表示为一个复合语句。\n\n\n\n\n我们经常在程序中使用一些常量。这些常量在程序中可能会出现多次。例如`pi`\
  \ 的值应该始终为 `3.14`。因此，它可以如下所示的方式在程序中使用：\n\n```c\n#define PI 3.14\n```\n\n这被称为预处理器指令或编译器指令。\n\
  \n正如我们所知的，`PI` 是一个常量，因此它的值在整个程序中必须保持不变。符号常量也称为常量标识符。以下规则适用于 `#define` 语句：\n\n- \
  \  为了区分变量和符号常量，符号常量使用大写字母。\n-   `#` 和单词 `define` 之间不留空格。\n-   `define` 单词和符号常量之间需要留一个空格。\n\
  -   符号名称不带数据类型声明。\n-   `#define` 语句不需要分号结尾。\n-   `#define` 语句可以出现在程序的任何地方，但在使用它们之前。但通常它们在\
  \ `main()` 之前使用。\n\n## 预处理器指令\n\n预处理器，顾名思义，是在源代码传递给编译器之前对其进行处理的程序。\n\n### C 预处理器\n\
  \n预处理器是特殊语句的集合，在编译过程开始时执行。这些被称为指令。\n\n一些预处理器包括：\n\n1.  `#include.`：这用于包含头文件。\n2.\
  \  `#define`：该语句用于定义符号常量和宏：即等同于表达式的单个标识符。\n\n例如：\n\n```c\n#include<stdio.h>\n#define\
  \ area length*width\n\nmain()\n{\n    int length, width;\n    printf(\"enter length\
  \ and width\");\n    scanf(\"%d %d\", &length, &width);\n    printf(\"\\n area is\
  \ %d\",area);\n}\n```\n\n3.  `#if`、`#elif`、`#else` 和 `#endif`允许根据一个或多个真假条件的值对源程序进行条件编译。它们也与\
  \ `defined` 运算符结合使用。\n\n例如：\n\n```c\n#if defined(FOREGROUND)\n    #define BACKGROUND\
  \ 0\n#else\n    #define FOREGROUND 0\n    #define BACKGROUND 7\n#endif\n```\n\n\
  4.  `#elif`：`#elif` 类似于控制语句中的 `else - if` 子句。\n5.  `#else`\n6.  `#endif`\n7.  `#ifdef`：`#ifdef`\
  \ 等于 `#if defined()`。\n8.  `#ifndef`：`#ifndef` 等于 `#if !defined`。即“如果未定义”。\n9. \
  \ `#undef`：`#undef` 指令用于“取消定义”符号常量或宏标识符；即，它会抵消`#define` 指令的效果。\n\n例如：\n\n```c\n\
  #define FOREGROUND 7\n#define BACKGROUND 0\nmain()\n{\n//...\n#undef FOREGROUND\n\
  #undef BACKGROUND\n}\n```\n\n**Mind Drill Note** - `#if`、`#ifdef`、`#ifndef` 必须以\
  \ `#endif` 结尾。\n\n## 运算符\n\n预处理器还包括两个特殊运算符：`defined` 和 `##`。\n\n### 字符串化运算符 (#)\n\
  \n它允许将宏定义中的形式参数转换为字符串。如果宏定义中的形式参数前面有此运算符，则相应的实际参数将自动包含在双引号中。\n\n### 标记粘贴运算符 (##)\n\
  \n它导致宏定义中的各个项目连接起来，从而形成单个项目。\n\n例如：\n\n```c\n#define display(i) printf(\" x\" #i\
  \ \"= %f\\n\",x##i)\n```\n\n假设此宏通过写入 `display(3);` 来访问。\n结果将是：`printf(\"x3= %f\\\
  n\", x3);`。\n因此表达式 `x##i` 变成了变量 `x3`，因为 `3` 是参数 `i` 的当前值。\n\n## 多选题\n\n1. **什么是预处理器指令？**\n\
  1.  编译器发送给程序员的消息。\n2.  编译器发送给链接器的消息。\n3.  程序员发送给预处理器的消息。\n4.  程序员发送给微处理器的消息\n**答案:\
  \ 3. 程序员发送给预处理器的消息**\n\n2. **以下哪些是格式正确的 #define 语句-**\n1.  `#define INCH PER FEET\
  \ 12`\n2.  `#define SQR(X) (X*X);`\n3.  `#define SQR(X) (X*X)`\n**答案: 3 #define\
  \ SQR(X) (X*X)**\n\n3. **以下哪个不是预处理器指令？**\n1.  `#if`\n2.  `#elseif`\n3.  `#undef`\n\
  4.  `#pragma`\n**答案: 2.#elseif**\n\n4. **头文件是：**\n1.  一个包含标准库函数的文件。\n2.  一个包含定义和宏的文件。\n\
  3.  一个包含用户定义函数的文件。\n4.  一个存在于当前目录下的文件。\n**答案: 2. 一个包含定义和宏的文件。**\n\n5. **所有的宏替换都在何时完成-**\n\
  1.  在程序编译之前\n2.  在编译之后\n3.  在执行期间\n4.  以上均非\n**答案: 1. 在程序编译之前**\n\n6. **以下程序的输出是什么：**\n\
  ```c\n#define sqr(x) (x*x)\nmain(){\n    int a,b=3;\n    a=sqr(b+2);\n    printf(\"\
  %d\",a);\n}\n```\n由于 `sqr(x) (x*x)`，`a=sqr(b+2)` 变为 `a=(b+2)*(b+2)`，即 `a=5*5=25`。\n\
  输出应为：25。\n（注：原文示例中输出似乎有误，此处按逻辑翻译）\n**纠正逻辑：** 输出为 25。\n\n7. **如果 `sqr(x) (x*x)`，那么如何定义\
  \ `sqr` 宏以输出 `a=5`？**\n```c\n#define sqr(x) ((x*x))\n```\n（使用括号可以确保运算符优先级正确）\n\n\
  8. **以下程序的输出是什么：**\n```c\n#define sqr(x) (x*x)\nmain(){\n    int a,b=3;\n    a=sqr(b22\n\
  \n    (\"%d\",\",a\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n9\n9..输出是：**\n```c\n#define MESS\nmain(){\n    printf(\"%MESS);\n}\n```\n**输出：2**\n\
  \n10. **如何定义上面的宏以输出 `x=2 y=3`？**\n```c\n#define PRINT \nmain(){\n    #ifdef NOTE\n\
  \        /*unterminated comment*/\n        a=10;\n    #else\n        a=20;\n   \
  \ #endif\n    printf(\"%d\",a);\n}\n```\n**输出：20. 即使 `#ifdef` 在这种情况下是未定义的。**\n\n\
  11. **以下 typedef 有效吗？**\n**答案：否，因为 typedef 在预处理器处理完成后才工作。**\n\n12.\n```c\n#define\
  \ max(a,b) (a>b?a:b)\nmain(){\n    int x;\n    x=max(3+2,2+7);\n    printf(\"%d\"\
  ,x);\n}\n```\n**输出：9**\n\n13. **为以下程序编写一个 PRINT 宏，使其输出 `x=4 y=4 z=5`：**\n```c\n\
  main(){\n    int x=4, y=4, z=5;\n    int a=1, b=2, c=3;\n    PRINT(x,y,z);\n}\n\
  ```\n**输出：**\n```c\n#define PRINT(var1,var2,var3) printf(\"\\n\" #var1=%d\" #var2=%d\"\
  \ #var3=%d\", var1, var2, var3)\n```\n\n14. **定义 DEBUG 宏，使以下程序输出 `DEBUG: x=4 DEBUG:\
  \ y=3.140000 DEBUG: ch=A`：**\n```c\nmain(){\n    int x=4;\n    float a=3.14;\n \
