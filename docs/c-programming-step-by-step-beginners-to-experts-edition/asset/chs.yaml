  \ ![11](img/image00830.jpeg)\n\n# 理论题\n\n1. 解释 `c` 的历史发展\n    - 1. `c` 是什么时候开发的？\n\
  \    - 2. 谁开发了 `c`？\n    - 3. `c` 在哪里开发的？\n    - 4. `C` 是高级语言、中级还是低级语言？\n    - 5.\
  \ 它可以在哪些操作系统上运行？\n2. 一个 `C` 程序的主要组件有哪些？`main` 这个名字有什么特殊意义？\n3. 什么是注释？注释可以放置在哪里？\n\
  4. `C` 程序要求必须小小写吗？`C` 程序中任何地方可以使用大写吗？请解释。\n5. 使用什么符号结束一个 `C` 语句？所有语句都是这样结束的吗？\n\
