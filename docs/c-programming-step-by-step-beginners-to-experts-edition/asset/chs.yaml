  \        printf(\"%d\\t\",a[i]);\n    else\n        printf(\"%d\\t\",a[i]);\n}\n\
  ```\n\n**4. 编写一个程序读取浮点数组并反转该数组。**\n\n```c\nfloat a[10];\nint n,i;\nprintf(\"输入元素的个数:\
  \ \");\nscanf(\"%d\",&n);/*输入*/\nfor(i=0;i<n;i++)\n{\n    printf(\"输入数字 %d\",i);\n\
  \    scanf(\"%f\",&a[i]);\n}\nfor(i=n-1;i>=0;i--)\n    printf(\"%.2f, \",a[i]);\n\
  ```\n\n**5. 给定了一些重复数字，写一个程序按递增顺序打印它们及其频率。**\n\n```c\n#define SIZE 100\nmain()\n\
  {\n    int a[SIZE],b[SIZE],freq[SIZE],i,j,k,n,found,t;\n    printf(\"输入多少个数字\");\n\
  \    scanf(\"%d\",&n);/*输入数组*/\n    for(i=0;i<n;i++)\n    {\n        printf(\"输入元素\
  \ %d \",i+1);\n        scanf(\"%d\",&a[i]);\n    }\n    for(i=0,k=0;i<n;i++)\n \
  \   {\n        found = 0;\n        for(j=0;j<k;j++)\n        {\n            if(a[i]\
  \ == b[j])\n```\n\n\n\n\n```c\nfreq[j]++;\nfound = 1;\nbreak;\n}\n}\n}\nif(found\
  \ == 0)\n{\n    b[k] = a[i];\n    freq[k++] = 1;\n}\n}\nfor(i=0;i<k-1;i++)\n   \
  \ for(j=i+1;j<k;j++)\n        if(freq[i] < freq[j])\n        {\n            t =\
  \ b[i];\n            b[i] = b[j];\n            b[j] = t;\n            t = freq[i];\n\
  \            freq[i] = freq[j];\n            freq[j] = t;\n        }\nfor(i=0;i<k;i++)\n\
  \    printf(\"%d\\t%d\\n\",b[i],freq[i]);\n```\n\n### 6. 编写程序将两个数组 `a` 和 `b` 合并到第三个数组\
  \ `c`。\n\n```c\n#define SIZE 20\nmain()\n{\n    int n1,n2,i,j,k,a[SIZE],b[SIZE],c[SIZE];\n\
  \    /*在第一个数组输入*/\n    printf(\"输入第一个数组的元素个数: \");\n    scanf(\"%d\",&n1);\n   \
  \ for(i=0;i<n1;i++)\n    {\n        printf(\"输入第 %d 个元素: \",i+1);\n        scanf(\"\
  %d\",&a[i]);\n    }\n    /*在第二个数组输入*/\n    printf(\"\\nEnter 第二个数组的元素个数: \");\n\
  \    scanf(\"%d\",&n2);\n    for(i=0;i<n2;i++)\n    {\n        printf(\"输入第 %d 个元素:\
  \ \",i+1);\n        scanf(\"%d\",&b[i]);\n    }\n    /*合并*/\n    for(i=0,j=0,k=0;i<n1&&j<n2;k++)\n\
  \    {\n        if(a[i]<b[j])\n            c[k]=a[i++];\n        else\n        \
  \    c[k]=b[j++];\n    }\n    /*第一个列表剩余部分*/\n    while(i<n1)\n        c[k]=a[i++];\n\
  \    /*第二个列表剩余部分*/\n    while(j<n2)\n        c[k]=b[j++];\n    /*输出*/\n    for(i=0;i<(n1+n2);i++)\n\
  \        printf(\"%d\\n\",c[i]);\n}\n```\n\n### 7. 编写程序从给定的数字列表中第 kth 小的数：\n\n```c\n\
  int a[20], i, j, n,t,k;\nprintf(\"输入列表中的元素个数: \");\nscanf(\"%d\",&n);\n/*在数组中输入*/\n\
