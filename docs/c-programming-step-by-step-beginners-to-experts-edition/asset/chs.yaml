  \ *j;\n}\n```\n**输出：** `25 4` 在上述程序中，函数是通过引用调用的，`x` 的地址和 `y` 的值被传递给 `i` 和 `j`，通过解引用\
  \ `[*i = *i *i]` 变为 `[x = x*x]` 得到 `25`，接下来的语句得到 `4`。因为这里函数是通过引用调用的，它会修改实际参数，然后通过\
  \ `printf()` 打印出 `x=25` 和 `y=4`。\n\n7. ```c\nmain() {\n    int i = 5, j = 3;\n \
