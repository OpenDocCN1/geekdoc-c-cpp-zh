  \ `m1` 的成员相同。在 `printf()` 中更改成员对输出没有影响。一个对象可以赋值给另一个，但不能用于其他操作。\n\n3\n```c\nmain(){\n\
  \    union a {\n        int i;\n        char ch[2];\n    };\n    union a z=512;\n\
  \    printf(\"%d %d”,z.ch[0],z.ch[1]);\n}\n```\n输出：0 2 512 的二进制表示为(00000010 00000000)\
  \ \n\n4.\n```c\nmain() {\n    struct emp {\n        char name[20];\n        int\
  \ age;\n        float sal;\n    };\n    struct emp e={Matrix”};\n    printf(\"%d\
  \ %f ”,e.age,e.sal);\n}\n```\n输出：1. 0.000000 2. 垃圾值 3. 以上均不是。解决方案：0.000000 当自动结构体被部分初始化时，结构体的剩余元素将初始化为\
  \ 0。\n\n5\n```c\nstruct emp {\n    char name[20];\n    int age;\n}\nfun (int aa){\n\
  \    int bb;\n    bb=aa;\n    return(bb);\n}\nmain(){\n    int a;\n    a=fun(20);\n\
  \    printf(\"\\n%d”,a);\n}\n```\n解释：结构体末尾缺少分号，编译器认为 `fun()` 将返回 `struct emp` 类型的内容，但实际上它尝试返回一个\
  \ `int`。这导致了类型不匹配，产生错误。\n\n6\n```c\nstruct emp {\n    char name[20];\n    int age;\n\
  };\nmain(){\n    struct emp e= {matrix”, 30};\n    f(e);\n}\nf (struct emp){\n \
  \   printf(\"%s %d”,ee.name,ee.age);\n}\n```\n解释：发生了错误，可以通过在声明 `f()` 之前声明结构体来修正。\n\
  \n- 结构体、联合体和枚举有什么相似之处？\n答案：它们都定义了新类型。\n\n- 下述声明有效吗：\n```c\ntypedef struct s {\n\
  \    int a;\n    float b;\n}s;\n```\n答案：有效\n\n- 结构体包含指向自身的指针吗？\n答案：可以，这种结构被称为自引用结构。\n\
  \n- 指出以下代码中的任何错误\n```c\ntypedef struct {\n    int data;\n    NODEPTR link;\n}*NODEPTR;\n\
  ```\n答案：`typedef` 定义了类型的新名称，但在这种情况下错误在于 `typedef` 在定义之前无法使用。在给代码片段中，声明 link 字段时\
  \ `typedef` 尚未定义。\n\n- 如何消除上述问题？\n答案：修复此问题，必须为结构体命名（struct node）。然后如下所示将 link 字段声明为简单的\
  \ `struct node *`：\n```c\ntypedef struct node {\n    int data;\n    NODEPTR link;\n\
  }*NODEPTR;\n```\n另一种消除方法是将 `typedef` 声明与结构体定义分离如下所示：\n```c\nstruct node {\n    int\
  \ data;\n    NODEPTR link;\n};\ntypedef struct node *NODEPTR;\n```\n另一种消除方法是在结构体声明之前加上\
  \ `typedef`，在这种情况下，你应该如下所示使用 `NODEPTR` `typedef` 声明 link 字段：\n```c\ntypedef struct\
  \ node *NODEPTR;\nstruct node {\n    int data;\n    NODEPTR link;\n};\n```\n在这种情况下，即使\
  \ `struct node` 尚未完全定义，也可以声明涉及 `struct node` 的新 `typedef` 名称；这是被允许的。\n\n- `void\
  \ modify(struct emp*)`\n```c\nstruct emp {\n    char name[20];\n    int age;\n};\n\
  main() {\n    struct emp e= {“Sanjay”, 35}\n    modify(&e);\n    printf(\"%s %d”,\
  \ e.name, e.age);\n}\nvoid modify(struct emp *p) {\n    strupr(p->name);\n    p->age=p->age+2;\n\
  }\n```\n\n\n\n\n回答：`struct emp` 在定义结构体之前就已经在 `modify()` 函数的声明中被提及。要解决这个问题，只需在结构体声明之前之后声明函数，或者直接在原型之前添加\
  \ `struct emp` 语句。\n\n### 问题- 以下代码可以运行吗：\n\n```c\n#include<alloc.h>\n\nstruct emp\n\
  {\n    int len;\n    char name[1];\n};\n\nmain()\n{\n    char newname[]= \"Rahul\"\
  ;\n    struct emp *p= (struct emp *) malloc(sizeof(struct emp) – 1 + strlen(newname)\
  \ + 1);\n    p->len=strlen(newname);\n    strcpy(p->name, newname);\n    printf(\"\
  %d %s\",p->len, p->name);\n}\n```\n\n回答：是的，该程序为结构分配了空间并调整了大小，使得 `name` 字段能够容请求的名称（而不仅仅是结构声明所暗示的那一个字符）。\n\
  \n### 问题- 有没有更好的方法来编写上面的程序？\n\n回答：实现该问题的最佳方法是使用字符指针而不是数组，如下所示：\n\n```c\n#include<alloc.h>\n\
  \nstruct emp\n{\n    int len;\n    char *name;\n};\n\nmain()\n{\n    char newname[]=\
  \ \"Rahul\";\n    struct emp *p= (struct emp *) malloc(sizeof(struct emp));\n  \
  \  p->len=strlen(newname);\n    p->name= malloc(p->len)+1;\n    strcpy(p->name,\
  \ newname);\n    printf(\"%d %s\",p->len, p->name);\n}\n```\n\n显然，将长度和字符串存储在同一块内存中的这种“便利性”已经消失了，而且释放该结构体的实例需要调用两次\
  \ `free()` 函数。\n\n### 问题- 你将如何释放上面问题中分配的内存？\n\n回答：`free(p->name);` `free(p);`\n\n\
  ### 问题- 下一个程序的输出是什么？\n\n```c\nmain()\n{\n    struct emp\n    {\n        char *n;\n\
  \        int age;\n    };\n    struct emp e1= {\"David\", 23};\n    struct emp e2=e1;\n\
  \    strcpy(e2,n);\n    printf(\"%s\",e1.n);\n}\n```\n\n回答：当结构体被赋值、传递或返回时，拷贝是整体性完成的。这意味着任何指针字段的副本将指向与原始值相同的位置。换句话说，所指向的内容不会被复制。因此，通过\
  \ `e2.n` 修改名称会自动改变 `e1.n`。\n\n### 问题- 指出以下代码中的任何错误（如果有的话）：\n\n```c\nmain()\n{\n\
  \    struct emp\n    {\n        char n[20];\n        int age;\n    };\n    struct\
  \ emp e1= {\"David\", 23};\n    struct emp e2=e1;\n    if(e1 == e2)\n        printf(\"\
  The structures are equal\");\n}\n```\n\n回答：结构体不能使用内置的 `==` 和 `!=` 运算符进行比较。这是因为编译器没有一种单一且通用的方法来实现结构体比较。逐字节的比较会包含结构体中未使用的填充位中的位（这种填充被用于保持后续字段的对齐正确）。逐字段的比较对于大型结构体可能需要大量不可接受的重复代码。此外，无法期望任何编译器生成的比较在所有情况下都能恰当地比较指针字段；例如，对于\
  \ `char *` 字段，通常使用 `strcmp()` 而不是 `==` 来比较更为恰当。\n\n### 问题- 你如何检查两个结构体变量的内容是否相同？\n\
  \n```c\nstruct emp\n{\n    char n[20];\n    int age;\n};\n\nmain()\n{\n    struct\
  \ emp e1= {\"David\", 23};\n    struct emp e2;\n    scanf(\"%s %d\",e2.n, &e2.age);\n\
  \    if(cmp(e1, e2) == 0)\n        printf(\"The structures are equal\");\n    else\n\
  \        printf(\"Structures are unequal\");\n}\n\ncmp(struct emp x, struct emp\
  \ y)\n{\n    if(strcmp(x.n, y.n) == 0)\n        if(x.age == y.age)\n           \
  \ return(0);\n    return(1);\n}\n```\n\n简而言之，如果你需要比较两个结构体，你必须编写自己的函数来执行逐字段的比较。\n\
  \n### 问题- 编译器是如何实现结构体的传递和返回的？\n\n回答：当结构体作为参数传递给函数时，通常会将整个结构体推入栈中。为了避免这种开销，许多程序员倾向于传递结构体的指针而不是实际结构体。结构体通常从函数所在的一个由编译器提供的额外“隐藏”参数指向的位置返回。\n\
  \n### 问题- 我如何从/向数据文件读写写结构体？\n\n回答：要写入结构体，我们可以像下面使用 `fwrite()`：`fwrite(&e, sizeof(e),1,fp);`，其中\
  \ `e` 是一个结构体变量。相应的 `fread()` 调用可以从文件中读回结构体。调用 `fwrite()` 时，它从地址 `&e` 写入 `sizeof(e)`\
  \ 字节。然而，使用 `fwrite()` 写入内存镜像的数据文件将不具有移植性，特别是当它们包含浮点字段或指针时。这是因为结构体的内存布局取决于机器和编译器。不同的编译器可能使用不同数量的填充，因此，使用\
  \ `fwrite()` 写入的数据文件并不一定能在其他机器上读取。\n\n### 问题- 如果使用 `fwrite()` 将以下结构体写入文件，`fread()`\
  \ 能成功读回它吗？\n\n```c\nstruct emp\n{\n    char *n;\n    int age;\n};\nstruct emp e\
  \ = {\"Sujay\", 15};\nFILE *fp;\nfwrite(&e, sizeof(e), 1,fp);\n```\n\n回答：不能，因为结构体包含字符指针，在使用\
  \ `fwrite()` 将结构体写入磁盘时，只有指针 `n` 中存储的值会被写入（而不是它所指向的字符串）。当读回该结构体时，读回的是地址，但内存中不太可能存在所需的字符串。\n\
  \n### 问题- 以下程序总是输出结构体的大小为 7 字节吗？\n\n```c\nstruct ex\n{\n    char ch;\n    int i;\n\
  \    long int a;\n};\n```\n\n回答：不是，编译器可能会通过填充结构体中的第一个 `char` 另一个字节来留下洞，以确保随其后的整数存储在偶数位置。此外，在整数之后可能有两个额外的字节，以确保长整型存储在\
  \ 4 的倍数的地址上。这样做是因为许多机器在值对齐时处理内存中的值效率更高。某些机器根本无法执行未对齐的访问。你的编译器可能提供一种扩展来控制结构体的打包（即是否进行填充），可能是使用\
  \ `#pragma`，但没有标准的方法。如果你担心浪费空间，可以通过从大到小排列结构体的成员来减少填充的影响。你有时可以通过使用位域来获得对大小和对齐的更多控制，，尽管它们也有自己的缺点。\n\
  \n问题-\n\n```c\nmain()\n{\n    struct a;\n}\n```\n\n\n\n\n```c\n{\n    category:5;\n\
  \    scheme: 4;\n};\nprintf(\"size = %d\", sizeof(struct a));\n}\n```\n答案: size=\
  \ 2\n\n由于我们在结构体中使用了位域（bit fields），且总位数超过了 8 位（准确来说是 9 位），因此结构体的大小被报告为 2 个字节。\n\n\
  ## 实验练习 – (WAP- 编写程序)\n\n1. 编写一个程序，存储 10 个员工的信息，并根据用户输入的员工编号显示相应员工的信息。\n2. 编写一个程序，使用结构体接收并打印学生的成绩。\n\
  3. 编写一个程序，该程序使用一个函数接收两个日期（日、月、年）结构体对象作为参数，并返回日期较晚的结构体。\n4. 编写一个程序，使用名为 `point(x,\
  \ y 坐标)` 的结构体来建模点。定义三个点，并让用户输入两个点的值。然后将第三个点设置为另外两个点之和，并显示新点的值。与程序的交互可能如下：输入 p1 的坐标：2\
  \ 3，输入 p2 的坐标：6 8，p1+p2 的坐标为：8 11。\n5. 编写一个程序，给指定的日期增加指定的天数。尽可能地使用结构体。\n6. 为一个包含\
  \ 20 条选民记录的数组进行必要的声明，每个记录由四个数据值组成，即：编号、姓名、地址、年龄。使用上述声明编写一个程序段，打印所有年龄超过 60 岁的选民的编号和姓名。（假设使用合适的数据类型。）\n\
  \n## 章节：(C 语言中的控制台输入和输出)\n\n## 引言\n\n### getchar 函数（单字符输入）\n\n`getchar()` 用于向计算机输入单个字符。`getchar`\
  \ 函数是标准 C 输入输出库的一部分。它从标准输入设备（通常是键盘）返回一个单字符。该函数不需要任何参数。\n\n**语法：**\n```c\ncharacter\
  \ variable = getchar();\n```\n\n### putchar 函数（单字符输出）\n\n此函数用于将单个字符传输到标准输出设备（通常是显示器）。它也是标准\
  \ C I/O 库的一部分。传输的字符通常表示为字符类型的变量。它必须作为参数传递给函数，括在括号中，跟在单词 `putchar` 之后。\n\n**语法：**\n\
  ```c\nputchar(character variable);\n```\n\n### scanf 函数（输入数据）\n\n此函数可用于输入数值、单字符和字符串的任意组合。`scanf()`\
  \ 从标准输入设备读取数据并将其在计算机内存中。该函数返回成功输入的数据项数。\n\n**语法：**\n```c\ncnt=scanf(\"control string\"\
  , arg1,arg2,arg3……argn);\n```\n其中 `cnt` 的值将成功输入的数量，`Control string` 是用于格式控制的字符串，而\
  \ `arg1,arg2…..` 是代表各个输入项的参数。参数以变量或数组的形式书写，其类型必须与控制字符串中的对应组匹配。每个变量名之前必须紧跟地址取符 (`&`)。\n\
  \n### printf 函数（写输出）\n\n此函数可用于输出数值、单字符和字符串的任意组合。它的目的是显示数据。`printf()` 将数据从计算机内存移动到标准输出设备。\n\
  \n**语法：**\n```c\nprintf(\"control string\",arg1,arg2………argn);\n```\n这里 `control\
  \ string` 指的是一个包含格式信息的字符串，`arg1,arg2` 是代表各个输出项的参数。控制字符串可以包含影响输出外观的标志（flag）。标志必须紧放在百分号\
  \ (`%`) 之后。\n\n一些常用的标志：\n- `-`: 数据左对齐。\n- `0`: 在数据前用零填充。\n- `+`: 强制显示正负号。\n- `#`:\
  \ 使用替代表示法。\n- `宽度`: 指定最小宽度。\n- `.精度`: 指定精度。\n\n# 格式说明符\n\n1. 宽度说明符：`printf()` 指定输出项占用的多少列。例如，`printf(\"\
  %10d\", a);` 告诉程序使用 10 列。\n2. 负号：数据左对齐。例如 `printf(\"%-10d\", a);` 会在右侧留留空格。\n3.\
  \ 默认：`printf(\"%10d\", a);` 默认情况下输出是右对齐的。\n\n常用的格式说明符：\n- `d`: 有十进制整数。\n- `f`: 浮点数。\n\
  - `e`: 科学计数法。\n- `g`: 自动在 `f` 和 `e` 之间选择。\n- `s`: 字符串。\n- `c`: 字符。\n- `o`: 八进制整数。\n\
  - `x`: 十六进制整数。\n- `u`: 无符号整数。\n- `p`: 指针地址。\n\n#### 示例\n\n这是一个简单的程序，定义了标志在整数和浮点数、十进制、八进制、十六进制数字中的用法。\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\nmain()\n{\n    int i = 23;\n    float\
  \ x = 12.0, y = -3.3;\n    int p = 1234, q = 0177;\n\n    printf(\"%6d %7.0f %10.1e\\\
  n\", i, y);\n    printf(\"%-6d %-7.0f %-10.1e\\n\", i, y);\n    printf(\"%8u %8o\
  \ %8x\\n\", p, q);\n    printf(\"%-8u %-8o %-8x\\n\", p, q);\n}\n```\n输出：\n    \
  \ 23      12 -1.2E+01\n    23      -3      -3.3E+00\n   1234 0000177 00004d2\n1234\
  \ 000177 4d2\n\n\n\n\n\n### 1. 大小写转换\n```c\nmain() {\n    char ch;\n    ch = getchar();\n\
  \    if(islower(ch))\n        putchar(toupper(ch));\n    else\n        putchar(tolower(ch));\n\
  }\n```\n**输出：** 它会将小写字母转换为大写，将大写字母转换为小写。这意味着如果你输入‘a’，输出将是‘A’；如果你输入‘A’，输出将是‘a’。\n\
  \n### 2. 格式说明符\n```c\nmain() {\n    int i = 2;\n    float f = 2.5367;\n    char\
  \ str[] = \"Life is like that\";\n    printf(\"\\n%4d\\n3.3f\\n%4s\", i, f, str);\n\
  }\n```\n**输出：**\n- `2` (2 前有 3 个空格，因为这里 `i` 以 4 列的宽度打印)\n- `2.537` (数字前有 2 个空格，且数字将保留\
  \ 3 位小数)\n- `Life is like that` (因为 `str` 包含超过 4 个字符，所以它会忽略最大长度并打印整个 str)\n\n###\
  \ 3. 整数格式化\n```c\nmain() {\n    int a = 250;\n    printf(\"%1d\", a);\n}\n```\n\
  **输出：** `250`\n\n### 4. 浮点数格式化\n```c\nmain() {\n    float a = 3.15529;\n    printf(\"\
  %6.2f\", a);\n    printf(\"%6.3f\", a);\n    printf(\"%5.4f\", a);\n    printf(\"\
  %2.1f\", a);\n    printf(\"%0.0f\", a);\n}\n```\n**输出：**\n- `  3.16`\n- `  3.155`\n\
  - ` 3.1553`\n- `  3.2`\n- `3`\n\n### 5. 输入缓冲区问题\n指出以下程序中的错误：\n```c\nchar ch;\nint\
  \ i;\nscanf(\"%c\", &i);\nscanf(\"%d\", &ch);\nprintf(\"%c %d\", ch, i);\n```\n\
  **输出：** 你不会获得为第二个 `scanf()` 语句输入字符的机会。解决这个问题的方法是在第二个 `scanf()` 之前加上以下语句：\n```c\n\
  fflush(stdin);\n```\n这将把上一个 `scanf()` 留下的回车键从输入流（即键盘）中冲刷。\n\n### 6. 转义序列\n```c\n\
  main() {\n    printf(\"More often than \\b\\b not \\r the person who wins is the\
  \ one who thinks he can!\");\n}\n```\n**输出：**\n```\nthe person who wins is the one\
  \ who thinks he can!\n```\n因为 `printf` 从左到右打印消息，当遇到 `\\b` 时，光标会移动一个字符；当遇到 `\\r`\
  \ 时，光标会移动到当前行的开头，接下来的消息将覆盖之前的消息。\n\n### 7. 遍历字符串\n```c\nchar p[] = \"The sixth sheikh’s\
  \ ship is sick\";\nmain() {\n    int i = 0;\n    while(p[i] != '\\0') {\n      \
  \  putch(p[i]);\n        i++;\n    }\n}\n```\n**输出：** `The sixth sheikh’s ship is\
  \ sick`\n因为循环从 0 开始执行直到遇到空字符（`\\0`），所以字符串的每个字符都从头开始打印。\n\n### 8. 问题\n以下程序的输出是什么：\n\
  ```c\nprintf(\"%%%%\");\n```\n**输出：** `%%`\n\n以下代码可以运行吗？可以，那么输出是什么：\n```c\nint n=5;\n\
  printf(\"n=%d\", n);\n```\n**输出：** `n=5`。`*` 表示将使用参数列表中的 `int` 值作为宽度。在参数列表中，宽度位于要打印的值之前。在此种情况下，格式说明符变成了\
  \ `%5d`。\n\n我们可以在 `scanf()` 格式字符串中指定变量宽度吗？\n**输出：** 不可以。`scanf()` 格式中 `%` 符号后的 `*`\
  \ 用于抑制赋值。也就是说，扫描了输入字段但没有进行存储。\n\n`fgets()` 和 `gets()` 哪个函数是安全的？\n**输出：** `fgets()`。与\
  \ `gets()` 不同，它无法告知字符串存储的缓冲区大小，因此始终存在溢出的可能性。\n\n### 错误分析\n指出以下代码段中的错误（如果有的话）：\n\n\
  **1.**\n```c\nmain() {\n    int i;\n    char a[] = \"Hello\";\n    while(a != '\\\
  0') {\n        printf(\"%c\",*a);\n        a++;\n    }\n}\n```\n**输出：** 错误。“需要左值（Lvalue\
  \ required）”，因为数组不能自增。\n\n**2.**\n```c\nmain() {\n    double dual;\n    scanf(\"\
  %f\", &dual);\n    printf(\"\\nDouble = %lf\", dual);\n}\n```\n**输出：** 无错误，但输出将是\
  \ -0.000000。因为 `double` 占用 8 字节，而 `float` 占用 4 字节。\n\n**3.**\n```c\nmain() {\n \
  \   int evel;\n    scanf(\"%d\", &n);\n    printf(\"\\nger = %d\", evel);\n}\n```\n\
  **输出：** 错误。未定义符号 `n`。\n\n**4.**\n```c\nmain() {\n    char *mess[5];\n    for(i =\
  \ 0; i<5; i++) {\n        scanf(\"%s\", mess[i]);\n    }\n}\n```\n**输出：** 错误。未定义符号\
  \ `i`。此外，我们说的是指针数组，它不应该接收字符串，它可以接收任何字符串的地址。\n\n**5.**\n```c\nmain() {\n    int dd,mm,yy;\n\
  \    printf(\"\\n Enter day,moth and year\\n\");\n    scanf(\"%d %c %d %c%d\", &dd,\
  \ &mm, &yy);\n    printf(\"The date is:%d-%d-%d\", dd, mm, yy);\n}\n```\n**输出：**\
  \ 无错误。\n\n**6.**\n```c\nmain() {\n    char buffer[50];\n    int no = 97;\n    double\
  \ val = 2.34174;\n    char name[10] = \"Shweta\";\n    sprintf(buffer,\"%d %lf %s\"\
  , &no, &val, name);\n    printf(\"\\n%d %lf %s\", no, val, name);\n    sscanf(buffer,\
  \ \"%4d %2.2lf %s\", &no, &val, name);\n    printf(\"\\n%s\", buffer);\n    printf(\"\
  \\n%d %lf %s\", no, val, name);\n}\n```\n**输出：** 无错误。因为 `sprintf()` 将变量打印到指定的字符串（例如上述示例中的\
  \ `buffer`）中，而不是打印到屏幕上。同样，`sscanf()` 从字符串中读取字符并根据指定的格式转换并存储到变量中。因此在上面的程序中，首先所有变量的值都被复制到\
  \ `buffer` 数组中，当我们打印 buffer 时，就会得到复制的值。然后通过 `sscanf()` 从 buffer 字符串中读取的所有值存储在变量中，当变量被打印时，就会显示出上述值。\n\
  \n\n\n\n\n# 练习与问题\n\n1. 若要在字符数组 `str[100]` 中接收字符串“We have got the guts, you get\
  \ the glory!!”，你会使用以下哪个函数？\n   a) `scanf(\"%s”,str)`\n   b) `gets(str)`\n   c) `getche(str)`\n\
