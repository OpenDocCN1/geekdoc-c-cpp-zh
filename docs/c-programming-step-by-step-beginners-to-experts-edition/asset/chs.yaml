  \    strcpy(m.mess1,”you can win”);\n    strcpy(m.mess2,”If you believe”);\n   \
  \ /*假设该结构体位于地址 205*/\n    printf(\"\\n%u %u %u”.&m,m.mess1,m.mess2);\n}\n```\n输出：打印结构体变量的地址。\n\
  \n2)\n```c\nstruct gos {\n    int n;\n    char mess1[50];\n    char mess2[50];\n\
  }m1={2, “If you are driven by success,”make that it is quality drive” };\nmain()\
