  \    *i =*i *i;\n    j = j*j;\n}\n```\n**输出：** `25 3` 这里传递调用函数的两个参数第一个是 `i` 的地址，第二个是\
  \ `j` 的值，所以当我们解引用 `i` 时会修改实际参数，但对 `j` 的操作不会影响实际参数，因此 `j` 的值保持不变，而 `i` 发生了变化。\n\n\
  \n\n\n\n### 1. 多重返回值\n```c\nmain() {\n    int a = 3, b = 4, c, k;\n    c = summult(i,j);\n\
  \    d = summult(i,j);\n    printf(\"\\n%d  %d\",c,d);\n}\nsummult(int x, int y)\
  \ {\n    int a1, b1;\n    a1 = x+y;\n    b1 = x*y;\n    return(a1,b1);\n}\n```\n\
  **输出：** 错误。函数不能返回多个值。\n\n### 2. 隐式返回类型\n```c\nmain() {\n    int x;\n    x = massage();\n\
  }\nmessage() {\n    printf(\"\\n your computer can be effected by Viruses:\");\n\
  \    return;\n}\n```\n**输出：** 错误。因为函数定义中没有指定返回类型，所以默认返回类型为 `int`，此处函数定义中存在 `return`\
  \ 语句，它将返回一个随机整数。但如果函数定义中使用了 `void` 类型，则会遇到错误。\n\n### 3. 缺少参数数据类型\n```c\nmain() {\n\
  \    float a = 18.5;\n    char ch = ‘C’;\n    display(a,ch);\n}\ndisplay(a,ch) {\n\
  \    printf(\"\\n%f %c\",a,ch);\n}\n```\n**输出：** 错误。形式参数没有任何数据类型。\n\n### 4. 变量作用域\n\
  ```c\nmain() {\n    int a = 35,b;\n    b = check(a);\n    printf(\"\\n %d\",b);\n\
  }\ncheck(m) {\n    int m;\n    if( m>40)\n        return(1);\n    else\n       \
  \ return(0);\n}\n```\n**输出：** 错误。变量 `m` 必须在大括号之前声明。形式参数可以通过以下两种方式声明：\n(a) `Check(int\
  \ m) {}`\n(b) `check() int m; {}`\n\n### 5. 在定义前调用函数\n```c\nmain(){\n    display();\n\
  }\nvoid display(){\n    printf(\"Matrix\");\n}\n```\n**输出：** 重复定义错误，因为 `display()`\
  \ 在定义之前就被调用了。在这种情况下，编译器假设函数 `display()` 被声明为 `int display ()`；即未声明的函数被假设返回一个 `int`\
  \ 并接受任意数量的参数。当我们定义该函数时，编译器发现它返回的是 `void`，因此编译器报告了这一差异。\n\n### 6. Goto 和 Void 函数\n\
  ```c\nmain() {\n    int a=1;\n    while(a<=5) {\n        printf(\"%d\",a);\n   \
  \     if(a>2)\n            goto abc;\n    }\nfun() {\n    abc:\n    printf(\" Harry\"\
  );\n}\nmain(){\n    int a=10;\n    void f();a=f();printf(\"%d\",a);\nvoid f(){\n\
  \    printf(\"Hello\");\n}\n```\n**输出：** `goto` 不能跳转到不同的函数。该函数被声明为 `void`，但程序试图在变量\
  \ `a` 中收集 `f()` 返回的数值。\n\n### 7. 连续的函数定义\n```c\nmain() {\n    message();\n    message();\n\
  }\nmessae() {\n    printf(\"Whole world is waiting for you:\");\n}\n```\n**输出：**\
  \ 错误。函数定义之后不能紧紧跟另一个函数定义。\n\n### 8. 嵌套函数\n```c\nmain() {\n    matrix() {\n      \
  \  printf(\"Welcome in the world of computer:\");\n    }\n}\n```\n**输出：** 错误。一个函数不能定义在另一个函数的体内。\n\
  \n### 9. 变量声明的位置\n```c\nmain() {\n    computer();\n}\nvoid computer() {\n    printf(\"\
  Beginning with C:\");\n}\nmain() {\n    int i =35, a =35, k;\n    k = demo(i, a);\n\
  \    printf(\"\\n %d\",k);\n}\ndemo(int j, int b) {\n    int c;\n    c = j + b;\n\
  \    return (c);\n}\n```\n**输出：** 错误。声明 `int c` 应该在 `demo()` 函数体内部。\n\n### 10. 指针参数\n\
  ```c\nmain() {\n    int p = 23,f = 24;\n    out(&p, &f);\n    printf(\"\\n%d %d\"\
  ,p,f);\n}\nout (int q, int g) {\n    q = q + q;\n    g = g + g;\n}\n```\n**输出：**\
  \ 错误。函数定义中的变量 `q` 和 `g` 应该声明为整数指针。\n\n### 11. 指针算术\n```c\nmain() {\n    int i =\
  \ 35, *z;\n    z = fun(&i);\n    printf(\"\\n%d\",z);\n}\nfun(int *m) {\n    return(m\
  \ + 2);\n}\n```\n**输出：** 不可。在上述程序中，`i` 的地址被传递给 `m`，因此 `m` 包含 `i` 的地址，`m+2` 等于 `07`，因此此函数向\
  \ `main()` 返回 `07`，这会被存储在 `z` 中，并通过 `printf()` 打印出来。这里编译器假设我们可以这样做。\n\n### 12. 静态变量\n\
  ```c\nmain(){\n    int a,b;\n    a=sumdig(23);\n    b=sumdig(23);\n    printf(\"\
  %d %d\",a,b);\n}\nsumdig(int n){\n    static int s=0;\n    int d;\n    if(n!=0)\
  \ {\n        d=n%10;\n        n=(n-d)/10;\n        s=s+d;\n        sumdig(n);\n\
  \    }else\n    return (s);\n}\n```\n**输出：** 6 12\n\n### 13. 重复变量\n```c\nf(int a,\
  \ int b) {\n    int a;\n    a=20;\n    return a;\n}\n```\n**输出：** 错误变量 `a` 重复。\n\
  \n### 14. 三元运算符\n```c\nmain() {\n    int b=10;\n    b=f(20);\n    printf(\"%d\"\
  ,b);\n}\nf(int a) {\n    a>20?return(10):return(20);\n}\n```\n**输出：** `return` 语句不能像所示那样作为条件运算符使用。相反，可以使用：`return(a>20?10:20);`。\n\
  \n### 对错判断\n判断以下陈述的对错：\n\n1. C 中常用的变量在程序的所有函数中都可用。\n2. 要将控制权返回给调用函数，必须使用 `return`。相同的变量名可以在不同的函数中使用。\n\
  3. 每个被调用的函数都包含 `return` 语句。\n4. 函数可以包含多个 `return` 语句。\n5. 函数中的每个 `return` 语句可以返回不同的值。\n\
  6. 如果你不向函数传递任何参数且函数不返回任何值，该函数仍然有用。\n7. 相同的名称可以在不同的函数中使用冲突。\n8. 一个函数可以被任何其他函数调用多次。\n\
  9. 函数必须返回某个值。\n10. 函数可以有多个声明，但只有一个定义。\n11. 函数不能定义在另一个函数内部。\n12. 下述函数有效吗：\n```c\n\
  main() {\n    f1(int a, int b);\n    return(f2(20));\n}\nf2 (int a) {\n    return(a*a);\n\
  }\n```\n\n\n\n\n13. 在函数中不应出现两个 `return` 语句。\n14. 在函数中不应连续出现两个 `return` 语句。\n15.\
  \ 在 C 语言中，除了 `main()` 之外的所有函数都可以递归调用。\n16. 通常递归的运行速度比循环慢。\n17. 过多的递归调用可能会导致栈溢出（stack\
  \ overflow）。\n\n### 答案：\n| 1. False | 2. False | 3. True | 4. False | 5. True |\
  \ 6. True | 7. True | 8. False | 9. False | 10. True | 11. True | 12. True | 13.\
  \ False | 14. True | 15. False | 16. True | 17. True |\n\n### 回答以下问题：\n\n1. 当我们提到函数的原型时，我们是在定义函数还是声明函数？\n\
  **输出：** `declaring`（声明）\n\n2. 以下代码中存在错误，请添加一条语句将其移除。\n\n```c\nmain()\n{\n    int\
  \ a;\n    a=f(10,3,14);\n    printf(\"%d\",a);\n}\n\nf(int aa, float bb)\n{\n  \
  \  return((float)aa+bb);\n}\n```\n**输出：**\n缺少函数 `f` 的声明，请在 `main()` 上添加以下内容：\n```c\n\
  float f(int,float);\n```\n\n3. 定义函数的两种常用表示法是：\n\n```c\nint f( int a, float b)\n\
  {\n    /*某些代码*/\n}\n\nint f(a,b)\nint a;\nfloat b;\n{\n    /*某些代码*/\n}\n```\n**输出：**\n\
