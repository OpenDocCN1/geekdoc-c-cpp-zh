  ```\n**输出：**\n```c\n#define DEBUG(var,fmt) printf(\"DEBUG\" #var \"=\"#fmt \"\\\
  n\",var)\n```\n\n15.\n```c\n#define str(x) #x\n#define Xstr(x) str(x)\n#define oper\
  \ multiply\nmain(){\n    char *opername=Xstr(oper);\n    printf(\"%s\",opername);\n\
  }\n```\n**输出：multiply**\n\n16. **以下两个 #include 指令之间的区别是：**\n1. `#include<conio.h>`\n\
  2. `#include\"conio.h\"`\n**答案：`#include \"conio.h\"`：该命令会在当前目录中查找 conio.h 文件，然后在搜索路径中指定的指定的目录列表中查找。**\n\
  \n\n\n\n# `#include<conio.h>`: 此命令仅会在指定的目录列表中查找 `conio.h` 文件。\n\n2. 指出在预处理阶段 `swap`\
  \ 宏会被展开为什么什么。代码能通过编译吗？\n\n```c\n#define swap (a, b, c) (c t; t=a; a=b; b=t)\n\n\
  main()\n{\n    int x=10,y=20;\n    swap (x, y, int);\n    printf(“%d %d”,x,y);\n\
  }\n```\n\n答案：`(int t;t=a,a=b,b=t;);` 这段代码无法工作，因为 `t` 的声明不能发生在括号内。\n\n3. 你将如何修改上述问题中的\
  \ `swap` 宏使其能够交换两个整数？\n\n答案：`#define swap(a,b,c) { int t; t=a; a=b; b=t; }`\n\n\
  4. 下面程序中的哪一行会报告错误？\n\n```c\n1. #define area( r ) (3.14*r *r);\n2. main()\n3. {\n\
  4. float r=1.0, c;\n5. c=area(r);\n6. printf(“%f”,c);\n7. if(area(r) == 6.28)\n\
  8. printf(“Matrix”);\n9. }\n```\n\n答案：第 7 行，但真正的罪祸首是第 1 行中的分号。展开后第 7 行变为 `if((3.14*1.0*1.0);\
  \ == 6.28)`。因此产生错误。\n\n5. 在以下声明中，变量 `b` 的类型是什么？\n\n`#define floatptr float*`\n`floatptr\
  \ a,b;`\n\n答案：`float` 而不是指向 float 的指针，因为展开后声明变为：`float *a,b;`\n\n6. 头文件必须以 `.h`\
  \ 结尾吗？\n\n答案：不是，但传统上它们被赋予 `.h` 扩展名，以标识区别于 `.c` 程序文件。\n\n7. 头文件通常包含什么？\n\n答案：预处理器指令（如\
  \ `#define`）、结构（`structure`）、联合体（`union`）和枚举（`enum`）声明、`typedef` 声明、全局变量和外部函数声明。不应在头文件中编写实际代码（即函数体）或全局变量定义。应该使用\
  \ `#include` 指令来引入头文件，而不是其他 `.c` 文件。\n\n8. 头文件如何确保自己不被包含多次？\n\n答案：所有声明必须以如下所示的方式编写。假设头文件名为\
  \ `FUNCS.H`。\n\n```c\n#ifndef FUNCS_H\n#define FUNCS_H\n#endif\n```\n\n现在如果我们像下面所示两次包含此文件，它只会被包含一次。\n\
  \n9. 包含时，会在哪里搜索头文件？\n\n答案：如果使用 `< >` 包含头文件，文件将在预定义的包含路径中搜索（该路径也可以更改）。如果使用 `\" \"\
  ` 语法并在预定义路径外包含，文件也会在当前目录（通常是调用编译器的目录）中搜索。\n\n判断对或错：\n\na. 如果要包含的文件不存在，预处理器会弹出错误信息。\n\
  b. 预处理器可以捕获简单的错误，如缺失声明、嵌套注释或括号不匹配。\nc. 如果头文件被包含两次，会导致错误吗。\nd. 下面程序会无限次打印消息吗？\n```c\n\
  #define INFINITELOOP while (1)\nmain()\n{\n    INFINITELOOP\n    printf(\"\\nMatrix”);\n\
  }\n```\ne. 下面程序能编译吗？\n```c\nmain()\n{\n    printf(“Matrix”);\n}\n```\n\n答案：a. 正，b.\
  \ 错，c. 错，d. 正，e. 正\n\n## 存储类 (Storage Class)\n\n## 简介\n存储类决定变量的内存位置。内存位置可以是：\n1.\
  \ 主内存 (RAM)。\n2. CPU 寄存器。\n\n它决定变量的默认值（零值或垃圾值）。它还决定变量的作用域和寿命。作用域表示变量声明生效的区域，换句话就是该特定变量的地方。\n\
  \n四种作用域是：全局、函数和原型。\n\n有 4 种存储类：\n1. 自动存储类 (`auto`)\n2. 静态存储类 (`static`)\n3. 外部存储类\
  \ (`extern`)\n4. 寄存器存储类 (`register`)\n\n### 自动存储类\n在函数内部声明的变量默认具有自动存储类。它由垃圾值初始化。声明方式为\
  \ `int a` 或 `auto int a;`。\n\n```c\nvoid prn();\nmain()\n{\n    int a=5;\n    printf(“%d\
  \ \", a);\n    prn();\n    prn();\n}\n```\n\n### 静态存储类\n当程序需要变量在函数调用之间持久时，应使用静态类。定义在函数内的静态变量会保留其值。\n\
  \n```c\nvoid prn();\nmain()\n{\n    int a=5;\n    printf(“%d \", a);\n    prn();\n\
  \    prn();\n}\n\nvoid prn()\n{\n    static int a=10;\n    a++;\n    printf(“%d\
  \ \", a);\n}\n```\n输出：5 11 12。在上面的示例中，只会创建一个 `a` 的副本，每次调用 `prn()` 时都会使用这个副本。\n\n\
  ### 外部存储类\n在所有函数之外声明的变量具有外部存储类。外部存储类应仅用于程序中所有函数都使用的变量，现在不需要在所有函数中传递变量。但也不建议将所有变量存储为外部，因为它们将在整个程序生命周期内保持活跃，从而浪费大量内存。例如：\n\
  \nFile1.c\n```c\n#include ”File2.c”\nint a; /*变量定义 */\nmain(){\n    a= 5;\n    func();\n\
  \    printf(“%d”,a);\n}\n```\nFile2.c\n```c\nextern int a; /*变量声明*/\nvoid func(){\n\
  \    a=10;\n}\n```\n输出：10。变量 `a` 在 `File1.c` 中获取内存。因为它在函数之外定义，所以被视为外部变量，其作用域是全局的。\n\
  \n\n\n\n\n只有 14 个 CPU 寄存器可用，由于微处理器正在使用它们，我们能使用的寄存器甚至更少。但计算机访问 CPU 寄存器的速度非常快，因此程序的执行速度也非常快。所以，它们最适合用于需要多次使用的循环计数器。然而，如果寄存器空闲，则将使用自动存储类（auto\
  \ storage class）并继续执行。CPU 寄存器的长度为 2 字节，因此它们的最大范围等于 `int` 的范围。`float` 值不能存储在寄存器中。即使我们写下\
  \ `register float x`，`x` 也会被假定为 `auto`。该类的变量声明方式如下：\n\n```c\nregister int d;\n```\n\
  \n### 总结\n\n| 存储类 | 内存 | 默认值 | 作用域 | 生命周期 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 自动 (Auto) | 主内存 (RAM) | 随机值 | 局部 | 局部 |\n| 静态 (Static) | 主内存 (RAM) | 0 |\
  \ 局部 | 全局 |\n| 外部 (Extern) | 主内存 (RAM) | 0 | 全局 | 全局 |\n| 寄存器 (Register) | CPU 寄存器\
  \ | 随机值 | 局部 | 局部 |\n\n### 以下代码的输出是什么：\n\n1.\n```c\nint f(int);\nint g(int);\nmain()\
  \ {\n    int x, y, s = 2;\n    s *= 3;\n    y = f(s);\n    x = g(s);\n    printf(\"\
  \\n%d %d %d\", s, y, x);\n}\nint t = 8;\nint f(int a) {\n    a += -5;\n    t -=\
  \ 4;\n    return(a+t);\n}\nint g(int a) {\n    a = 1;\n    t += a;\n    return(a+t);\n\
  }\n```\n**输出：** 6 5 6\n第一个 `s` 将为 6 并传递给 `f()`，被 `a` 接收，处理后 `a` 将变为 1，`t` 将变为 4。因为\
  \ `t` 是全局变量，所以在整个程序中都可用。当 `g()` 被调用时，`a` 再次接收 6 并被 1 覆盖，所以 `a=1`，`t = t+a` 得 `t\
  \ = 5`，该函数返回 `a+t`，因此 `x` 将为 6，最后 `s = 6`，`x = 6`，`y = 5`，通过 `printf()` 输出。\n\n\
  2.\n```c\nmain() {\n    static int c = 5;\n    printf(\"\\n c = %d\", c--);\n  \
  \  if (c != 0)\n        main();\n}\n```\n**输出：** 5 4 3 2 1\n因为 `c = 5` 首先被打印，然后减\
  \ 1，接着调用 `main()`，但由于这里 `c` 被定义为 `static`，所以控制不会进入初始化，此条件将成立五次，每次 `c` 都被打印并递减，所以\
  \ `c` 将为 5 4 3 2 1。\n\n3.\n```c\nmain() {\n    int i, j;\n    for(i = 1; i<5; i++)\
  \ {\n        j = g(i);\n        printf(\"\\n%d\", j);\n    }\n}\nint g(int x) {\n\
  \    static int v = 1;\n    int b = 3;\n    v += x;\n    return(v+x+b);\n}\n```\n\
  **输出：** 6 9 13 18\n\n4.\n```c\nmain() {\n    static int a[20];\n    int i = 0;\n\
  \    a[i] = i++;\n    printf(\"%d %d\", a[0], a[1]);\n}\n```\n**输出：** 0 0\n\n5.\n\
  ```c\nfloat x = 4.5;\nmain() {\n    float y, f(float);\n    x *= 2.0;\n    y = f(x);\n\
  \    printf(\"\\n%f\", x, y);\n}\nfloat f(float a) {\n    a += 1.3;\n    x -= 4.5;\n\
  \    return(a+x);\n}\n```\n**输出：** 4.500000 4.800000\n\n6.\n```c\nint x = 10;\n\
  main() {\n    int x = 20;\n    {\n        int x = 30;\n        printf(\"%d \", x);\n\
  \    }\n    printf(\"\\n %d\", x);\n}\n```\n**输出：** 30 20\n因为当控制执行内层的 `printf` 时，会打印\
  \ 30，因为局部变量具有优先级；当控制离开此块时，作用域结束，此时 `x =20` 并被打印。\n\n7.\n```c\nmain() {\n    extern\
  \ int i;\n    i = 20;\n    printf(\"%d\", sizeof(i));\n}\n```\n**输出：** 错误 extern\
  \ int i 是一个声明而非定义\n\n8.\n```c\nmain() {\n    extern int a;\n    printf(\"%d\", a);\n\
  }\nint a = 20;\n```\n**输出：** 20\n\n### 判断对错：\n\n1. `extern` 存储类变量对于在其定义之前的函数不可用，除非该变量在这些函数中显式声明。\n\
  2. \n3. \n4. \n5. \n6. \n7. \n8. \n9. 10.\n\n\n\n\n\n# 算法 10：验证给定的数字是否为质数。\n\n1.\
  \ 读取 `N`。\n2. 设置 `I:=2` 且 `PRIME =1`。\n3. 当 `I<=N/2` 时，重复步骤 4。\n4. 如果 `(N % I=0)`\n\
  \   设置 `PRIME:=0` 并退出循环结构。\n   否则：\n   设置 `I:= I+ 1`。\n   [If 结构结束]\n   [While 循环结束]\n\
  5. 如果 `PRIME=1`，则：\n   打印该数是质数。\n   否则\n   打印该数不是质数。\n6. 退出。\n\n# 算法 11：数组中的线性搜索\n\
