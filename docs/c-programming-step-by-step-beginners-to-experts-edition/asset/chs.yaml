  \ n 个字符设置为给定字符 |\n\n\n\n\n\n## 引言\n假设我们要计算一个整数的阶乘。众所周知，一个数的阶乘是 1 到该数之间所有整数的乘积。4\
  \ 的阶乘可以表示为 `4! = 4 * 3!` 其中 `!` 代表阶乘。因此，一个数的阶乘可以用自身的形式表示。由此，这可以通过递归来实现。\n\n例如：\n\
  \n```c\nint fact (int);                 /*函数定义 */\n\nmain()\n{\n    int n,ans;\n\
  \    printf(\"Enter a number: \");\n    scanf(\"%d\",&n);\n    ans = fact(n);  \
  \             /*函数调用 */\n    printf(\"factorial = %d\",ans);\n    getch();\n}\n\n\
  int fact(int n)\n{\n    if(n == 0)                   /*终止条件*/\n    return (1);\n\
  \    return (n*fact(n-1));        /*递归语句*/\n}\n```\n\n# 程序评估\n现在让我们评估这个程序：\n\n假设当程序控制权从\
  \ `main()` 函数传递到 `fact` 函数时，`n` 的值为 3。由于 `n` 不等于 0，所以条件为假，执行递归语句。\n\n`3*fact(2)`\n\
  \n现在 `fact(2)` 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，执行递归语句。\n\n`2*fact(1)`\n\n再次 `fact(1)`\
  \ 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，执行递归语句。\n\n`1 * fact(0)`\n\n现在条件为真，所以调用函数（`fact(0)`）的答案将是\
  \ 1，依此类推。因此，执行的序列将是：\n\n`fact(3)=3 * fact(2)`\n`fact(2)=2 * fact(1)`\n`fact(1)=1\
  \ * fact(0)`\n\n# 栈与递归\n当我们使用递归程序时，使用一个栈来组织数据。栈是一种后进先出（LIFO）数据结构。这意味着栈中最后存储的项（`push`\
  \ 操作）将是第一个弹出的项（`pop` 操作）。\n\n在上面的程序中，当调用 `fact(2)` 时，值 3 将存储在栈中。同样，当调用 `fact(1)`\
  \ 时，值 2 将存储在栈中 3 之上。\n\n现在当 `fact(0)` 返回 1 时，它将与栈中的第一个值（即 1）相乘。结果将与栈中的第二个等待值（即 2）相乘，依此类推。\n\
  \n当一个函数在定义中调用另一个函数时，这被称为链式调用。递归是一种特殊的链式调用，其中函数调用自己。\n\n例如：\n\n```c\nmain()\n{\n\
  \    printf(\"Harry\\n\");\n    main();\n}\n```\n执行时程序将输出：\n```\nHarry\nHarry\n\
  ```\n\n任何递归函数的执行都可以无限持续，直到应用终止条件来使执行结束。使用递归函数的目的是解决那些解决方案可以表示为对子集应用相同解决方案的问题。\n\n\
  # 缺点\n但递归函数也有其缺点：\n1. 这些函数更耗费时间，因此程序的执行速度较慢。\n2. 由于需要形成栈来保存等待值，占据了更多的内存空间。\n\n#\
