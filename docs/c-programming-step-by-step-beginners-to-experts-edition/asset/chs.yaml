  ![](img/image00853.jpeg)\n![STAR-LOGO-2013](img/image00824.jpeg)\n\n# 第 8 章\n##\
  \ (函数中的大脑)\n\n## 引言\n函数是一个接收输入并产生输出的小型程序。函数允许将一个大型程序分解为若干较小的、自包含的组件，每个组件都有明确的用途。它避免了重复编写代码。将逻辑拆分为独立的函数可以使整个编写和调试过程变得更容易。\n\
  \n另一方面，也可以说函数是一个用于执行某些任务的自包含语句块。函数一旦被分配了某项工作，就可以为了该任务被多次调用。每个 C 程序都会使用一些函数，常用的函数有\
  \ `printf`、`scanf`、`main` 等。\n\n函数可以是库函数也可以是用户自定义函数。库函数是随编译器一起提供并存在磁盘上的函数。用户自定义函数是程序员为了方便程序的调试和跟踪而自己编写的函数。\n\
  \n### 练习笔记\n`printf()`、`scanf()`、`exit()`、`pow()` 是库函数。每个库函数都有一个头文件。C 语言中共有 15 个头文件。`main()`\
  \ 是一个用户自定义函数。\n\n每个程序必须有一个 `main` 函数。这个 `main` 函数用于标记执行的开始。仅使用 `main` 程序来编写任何程序是可能的，但这会导致很多问题。程序会变得过于巨大且复杂，因此难以跟踪、调试和测试。\n\
  \n但如果将同一个程序分解成独立编码的小模块，然后将其组合成一个单元，这些问题就可以很容易地解决。这些模块被称为函数。因此，函数可以定义为接收某些输入并产生输出的小型程序。\n\
  \n**练习笔记**：我不打算再反复输入头文件了，所以在编写程序时，请不要忘记用头文件开始你的程序。\n\n### 计算两个数之和的函数：\n```c\nint\
  \ sum(int, int); /* 函数原型或声明*/\n\nmain()\n{\n    int a,b,ans;\n    printf(“输入两个数字:\
  \ “);\n    scanf(“%d %d”,&a,&b);\n    ans= sum(a,b);           /* 函数调用*/\n    printf(“和为\
  \ %d”, ans);\n    getch();\n}\n\nint sum( int x, int y) /* 函数定义或过程*/\n{\n    int\
  \ z;\n    z = x + y;\n    return(z);\n}\n```\n\n现在让我们来看看这个程序的一些特性：\n1. 第一条语句是函数的声明，它告诉编译器函数的名称以及传递的参数的数据类型。\n\
  2. 声明也称为原型（prototype）。\n3. 如果输出类型是整数值，则不需要对函数进行声明。在某些 C 编译器中，并不是所有函数都要求声明。\n4. 函数调用是使用函数的方法。函数声明一次，定义一次，但在同一个程序中使用可以使用多次。\n\
  5. 当编译器遇到函数调用时，程序的控制权将转移到函数定义，然后逐行执行，并在最后返回一个值。\n6. `main` 程序结束处是函数的定义，它也可以称为过程（process）。\n\
  7. 函数定义不以分号结束。\n8. 函数可以返回任何值，也可以不返回。因此，`return` 语句并不是必须的。当遇到 `return` 语句时，控制权会立即传回调用函数。\n\
  9. 虽然可以向函数传递任意数量的参数，但调用语句在调用时只返回一个值。`return` 语句可以用：`return;` 或 `return(value);`，在没有任何值的情况下，它的作用类似于函数定义的大括号结束。\n\
  10. 一个函数可以有多个 `return` 语句。可以这样使用：\n```c\nif (a!=0)\n    return(a);\nelse\n    return(1);\n\
  ```\n11. 所有函数默认返回 `int`。但如果函数必须返回特定类型的数据，可以在函数名配合类型说明符，如 `long int fact(n)`。\n12.\
  \ 如果函数 `main()` 调用函数 `sum()`，那么 `main()` 是调用函数，`sum()` 是被调用函数。**无参数无返回值**：某些函数不从调用函数接收任何值。因此，函数原型将是\
  \ `prn()`，即不传递任何参数。这也可以实现为 `prn(void)`。同样，调用函数也不会从函数获取任何值。这可以通过在函数名前使用关键字 `void`\
  \ 来实现。为了说明这一点，让我们考虑以下程序：\n```c\nvoid prn(); /*声明也可以写为 void prn(void)*/\nmain\n{\n\
  \    prn();\n    prn();\n    prn();\n}\n\nvoid prn()\n{\n    printf(“你好”);\n}\n\
  ```\n\n## 参数传递机制\n\n### i) 值传递 (Call by value)\n当参数按值传递时，实际参数的副本将从调用函数传递到调用函数定义中的形式参数中。现在，在被函数定义中对形式参数进行的任何更改都不会反映在调用函数的实际参数中。例如在上面的计算两个数之和的函数中，调用语句写为：`ans\
  \ = sum(a,b);`。在这里，变量 `a,b` 的值从 `main` 函数传递给调用函数。定义中的变量 `x,y` 分别接收 `a,b` 的值。在这里，`a,b`\
  \ 是实际参数，而 `x,y` 是形式参数。由于实际参数和形式参数的作用域不同，因此在形式参数上做的任何更改都不会显示在实际参数中。\n\n示例：\n```c\n\
  void swap(int, int);\nmain()\n{\n    int a,b;\n    printf(“输入两个数字”);\n    scanf(“%d%d”,&a,&b);\n\
  \    swap(a,b); /*在此调用语句中 a,b 是实际参数*/\n    printf(“%d\\t%d”a,b);\n}\nvoid swap(int\
  \ x,int y) /*在此函数定义中 x & y 是形式参数 */\n{\n    int t;\n    t=x; y=t;\n}\n```\n**练习笔记**：在上面的示例中：`x,y`\
  \ 的更改不会反映在 `a,b` 中。\n\n### ii) 引用传递 (Call by reference)\n当参数按引用传递时，实际参数的地址将从调用函数传递到调用函数定义的形式参数中。现在，函数定义中形式参数的任何更改都会反映在调用函数的实际参数中。有时无法传递变量的值，例如在使用数组时，无法通过值传递传递数组的值。因此，使用了另一种函数调用机制引用传递，传递变量的地址。在这里，定义将通过访问特定地址工作。这种方法通常用于数组和指针。\n\
  \n示例：\n```c\nmain()\n{\n    int a,b;\n    printf(“输入两个数字”);\n    scanf(“%d%d”,&a,&b);\n\
  \    swap(&a, &b); /*在此调用语句中 a,b 的地址被传递*/\n    printf(“%d\\t%d”a,b);\n}\n```\n\n\
  \n\n\n\n```c\nvoid swap(int *p1, int *p2) /*在此函数定义中，p1 & p2 是接收 a, b 地址的指针*/\n{\n\
  \    int t;\n    t=*p1; *p1=*p2; *p2=t;\n}\n```\n\n### 练习笔记\n在上面的示例中：对 `p1`、`p2`\
  \ 的修改将自动反映在 `a`、`b` 中。\n\n### 练习笔记\n数组也是通过引用传递的。当我们传递数组名时，在函数定义中仅传递基地址。\n\n## 函数的类型\n\
  \n#### 1. 库函数\n之前在库中定义的函数称为库函数。\n\n例如：\n```c\n#include<math.h>\nmain()\n{\n    int\
