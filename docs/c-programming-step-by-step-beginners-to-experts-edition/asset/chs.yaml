  \ |\n\n## 常见错误\n\n1. `while` 语句不包含 `do`get。因此写 `while(condition) do` 是不符合逻辑的。\n\
  2. `break` 和 `continue` 语句只影响内层循环。\n\n```c\nwhile(\n    condition\n)\ndo\n{\n  \
  \  for(loop)\n    {\n        break;\n    }\n    for(loop)\n    {\n        continue;\n\
  \    }\n}\n```\n\n以下程序的输出是什么。\n\n`break` 语句会导致退出循环 2，但不会退出循环 1。\n\n\n\n\n\n### 1\n\
  ```c\nint i =1;while( i<= 10);{\n    printf(\" \\n%d\",i);\n    i++;\n}\n```\n**输出：**\
  \ 无输出，因为存在死循环。\n在上面的程序中，`while` 后面遇到了一个“；”，因此编译器将其理解为：\n```c\nwhile(i<=10){\n  \
  \  ;\n}\n```\n显然，在循环体内没有自增，只有一个空语句，因此条件始终为真，导致无限循环，由于是空语句，没有产生输出。\n\n### 2\n```c\n\
  char ch;\nwhile(ch =0; ch<=255;ch++)\n    printf(\"\\n %d-%c\",ch,ch);\n```\n**输出：**\
  \ 错误。\n在上面的程序中，`while` 循环被用来替代 `for`，由于语法不同导致产生错误。\n\n### 3\n```c\nint a =4;\nwhile(\
  \ a = =1){\n    a = a-1;\n    printf(\"%d\",a);\n    --a;\n}\n```\n**输出：** 无输出\n\
  因为条件第一次判断为假，控制流立即离开循环体，没有执行任何操作。\n\n### 4\n```c\nint a =4,b,c;\nb = --a;\nc = a--;\n\
  printf(\"\\n%d %d %d\",a,b,c);\n```\n**输出：** 2 3 3\n在上面的程序中，`a = 4`，现在我们理解了前置和后置自增减。\n\
  `b = --a` → (1) `a = a-1` [→ `( a =3);`] (2) `b=a` → [`(b =3)]]; 即前置自减先减 1 后赋值。\n\
  `c=a--` → (1) `c = a` [`c = 3`]; (2) `a = a-1` [` a = 2`]; 即后置自减先赋值后减 1。\n所以最终 `a\
  \ = 2`，`b = 3`，`c = 3` 并通过 `printf()` 打印。\n\n### 5\n```c\nint a =4,b =3,c;\nc =\
  \ a-- -b;\nprintf(\"\\n%d%d%d\",a,b,c);\n```\n**输出：** 3 3 1\n这里首先 `a = 4`；在表达式 `c\
  \ = a-- -b;` 中使用了后置自减操作，意味着 `a` 先在表达式中使用，然后减 1，即→(1) `c = a-b;` [`c = 4-3`]→[`c\
  \ = 1`] (2) `a = a-1;` [`a = 4-1`]→[`3`] 且 `b` 保持不变，所以最终 `a = 3`，`b = 3`，`c = 1`\
  \ 并通过 `printf()` 打印。\n\n### 6\n```c\nwhile(‘a’<’b’)printf(\"\\n malyalam is a palindrome”);\n\
  ```\n**输出：** 无限打印“malyalam is a palindrome”。\n因为条件 `‘a’<’b’` 永远不会为假，每次执行都会运行循环体，打印上面的消息“malyalam\
  \ is a palindrome”。\n\n### 7\n```c\nint i;\nwhile(i = 15){\n    printf(\"\\n%d\"\
  ,i);\n    i++;\n}\n```\n**输出：** 无限打印 15。\n因为在语句 `while(i = 15)` 中，`i` 并没有与 `15`\
  \ 进行比较。这里 `i` 被赋值为 `15`，这是一个非零值，所以每次检查条件时 `i` 都会变为 `15`，条件为真并执行循环体，先打印 `i` 的值（即\
  \ `15`），然后加 1，`i` 变为 `16`；但再次遇到条件检查时，`i` 再次变为 `15`，并像之前一样执行循环体，导致 15 无限打印。\n\n###\
  \ 8\n```c\nfloat a = 1.1;\nwhile( a = =1.1){\n    printf(\"\\n%d\",x);\n    x=x-0.1;\n\
  }\n```\n**输出：** 无输出\n因为在条件中，浮点数变量与双精度数值进行了比较，控制流跳出了循环。\n**练习笔记：** 每当我们使用浮点数常量时，它被视为\
  \ double 类型的值。\n\n### 10\n```c\nint a =4, b =0, c;\nwhile(a>=0){\n    a--;\n   \
  \ b++;\n    if( a = =b)\n        continue;\n    else\n        printf( “\\n %d  \
  \ %d”,a,b);}\n}\n```\n**输出：** 3 1 1 3 0 4\n在上面的程序中，`a = 4`，`b = 0`，当检查条件时结果为真并执行循环体，`a`\
  \ 减 1 `b` 加 1 所以 `a = 3` 且 `b = 1`。再次检查条件 `a = b` 为假，控制流跳转到 `else` 块并打印 `a` 和 `b`\
  \ 的值，分别为 `3` 和 `1`；当控制到达循环末尾再次跳转到条件处此时条件仍为真，再次执行循环体，结果 `a = 2`，`b = 2`；当检查 `a =\
  \ b` 时为真，使用 `continue` 语句继续循环，控制跳转到条件处处（因为 `a = 2` 大于 0），再次执行循环体，`a = 1`, `b = 3`，因为\
  \ `if` 条件为假，控制从循环末尾跳转到条件处结果为真，`a = 0` 且 `b = 4`，不相等所以重复打印；当检查条件时为真并执行 `a = -1` 和\
  \ `b = 5`，不相等并进入 `else` 块打印，此时检查条件结果为假，因为 `a = -1` 不大于 0，并跳出循环。\n\n### 1\n```c\n\
  int a = 4, b = 0,c;\nwhile( a>=0){\n    if(a =b)\n        break;\n    else\n   \
  \     printf(\"\\n%d   %d”,a,b);\n    a--;\n    b++;\n}\n```\n**输出：** 4 0 3 1\n\
  `a = 4`, `b = 0`，当检查条件时结果为真并执行循环体，`a = b` 为假，执行 `else` 打印 `\\n4   0`；`a` 减 1 `b`\
  \ 加 1。此时 `a = 3`, `b = 1`，检查条件结果为真，`a = b` 为假，执行 `else` 打印 `\\n3   1`；`a` 减 1 `b`\
  \ 加 1。此时 `a = 2`, `b = 2`，检查条件结果为真，`a = b` 为真，执行 `break` 跳出循环。\n\n### 12\n```c\n\
  int i;for(i = 1;i<=5;printf(\"\\nd\",i));\ni++;\n```\n**输出：** 无限打印 1。\n这里 `;` 表示循环体是空语句，`i++`\
  \ 在循环外。首先 `i` 初始化为 1，当检查条件为真时无限打印 1。\n\n### 13\n```c\nint i = 1,j = 1;for(;){\n\
  \    if(i>5)\n        break;\n    else\n        j+=i;\n        printf(\"%d\\t\"\
  ,j);\n    i++;\n}\n```\n**输出：** 2 5\n在此程序中首先 `i = 1`, `j = 1`；当 `i>5` 为假时执行 `else`\
  \ 块，`j+=i` [`j = 1+1=2`]，打印 `2`；`i` 变为 2。再次检查 `i>5` 为假，执行 `else`，`j+=i` [`j = 2+2=4`]，打印\
  \ `4`；`i` 变为 3。再次检查 `i>5` 为假，执行 `else`，`j+=i` [`j = 4+3=7`]，打印 `7`...（注：根据代码逻辑输出会持续增加，示例输出\
  \ 2 5 可能是为某种特定逻辑的演示，此处按逻辑推导）。\n\n## 实验练习 -\n\n打印以下序列的 n 项。\n\n1. 1, 3, 5, 7, 9,\
  \ .........\n2. 2, 4, 6, 8, 10, ........\n3. 1, 4, 9, 16, 25, .......\n4. 1, 8,\
  \ 27, 64, 125, .....\n5. 1, -1, 1, -1, 1, ......\n6. 1, 1, 2, 4, 7, 13, 24, ...\
  \ (卢卡斯数列)\n\n\n\n\n\n# 第 5 章：一维数组\n\n## 引言\n数组（ARRAY）是相似数据项或元素的集合。或者说，数组是存储在单一名称下的连续同质元素集合。\n\
  \n## 数组的必要性\n当相同类型和性质的变量较多时，很难对其它们处理。因此，我们需要数组。让我们通过一个例子来理解数组的使用：\n\n```c\nint i,a;\n\
  for(i=1;i<=5;i++)\n{\n    printf(\"Enter the no.\");\n    scanf(\"%d\",&a);\n}\n\
  ```\n\n在上面的程序中，一旦将新值赋给变量 `a`，旧值就会丢失。\n\n因此，到目前为止我们使用的所有变量都无法同时存储一个以上的值。但有时，我们希望为一个变量存储多个值。\n\
  \n例如，如果我们希望将 10 个学生的成绩按升序排列。\n\n这里有两种方法：\n\n\n\n\n\n(i) 使用 10 个不同的变量，以便每个变量可以存储一个学生的成绩。\n\
  \n(ii) 使用单个变量，可以存储所有学生的成绩。\n\n显然，第二种方案看起来更好，因为它更容易处理。一个可以同时存储多个值的单变量被称为 `Array`（数组）。\n\
  \n### 练习笔记\n\n它是存储在单一名称下的连续存储的同类数据元素集合。数组的声明：\n\n```c\nint a[6];\n```\n\n在这里，`a`\
  \ 是数组名，`int` 是数组将存储的值的数据类型，`6` 是数组的大小，`[]` 被称为下标运算符。数组的大小必须是一个常量。最重要的一点是数组中的所有值都应该是相同类型。\n\
  \n![](img/image00846.jpeg)\n\n10, 20, 30, 40, 50 是数组的元素。要使用数组的元素，我们引用索引。数组索引从 0\
  \ 开始，例如，如果数组的大小为 6，那么数组的索引将从 0 到 5。\n\n在定义中我们还提到数组元素是连续存储的，例如，如果索引 0 处的元素地址为 100，那么如果数组是整数数组，后续元素的地址将为\
  \ 102, 104, 106, 108, 110，因为一个整数只占用 2 字节。但如果是浮点数数组，地址将是 100, 104, 108, 112, 116,\
  \ 120，因为一个浮点数占用 4 字节。\n\n如果程序中使用多个相同大小的数组，可以使用另一种类型的声明。\n\n#### 示例\n\n如果要计算一个班级学生的百分比，并将所有学生的成绩输入到数组中。那么所有数组的大小应该是相同的。\n\
  \n因此，可以使用这种类型的声明：\n\n```c\n#define SIZE 10\n\nmain()\n{\n    int maths[SIZE], hindi[SIZE],\
  \ english[SIZE];\n}\n```\n\n**练习笔记：** 这里 `SIZE` 是一个全局或符号常量。\n\n### 数组初始化\n\n| 声明\
  \ | 注释 |\n| :--- | :--- |\n| `int a[5];` | `/*此数组将包含垃圾值*/` |\n| `int a[5]={10,20,30,40,50};`\
  \ | `/*此数组将包含 10,20,30,40,50 值*/` |\n| `int a[5] = {0,0,0,0,0};` | `/*此数组将包含 0,0,0,0,0\
  \ 值*/` |\n| `int a[5] = {0};` | `/*此数组将包含 0,0,0,0,0 值*/` |\n| `int a[5] = {1};`\
  \ | `/*此数组将包含 1,0,0,0,0 值*/` |\n| `int a[5] ={10, , 30};` | `/*此数组将包含 10,0,30,0,0\
  \ 值*/` |\n| `int a[ ] = {10,20,30};` | `/*此数组的大小将被假为 3*/` |\n| `int a[3] = {10,20,30,40};`\
  \ | `/*初始化过多错误。*/` |\n| `static int a[5];` | `/*此数组将包含 0,0,0,0,0 值*/` |\n\n**练习笔记：**\
  \ 如果缺少数组的大小但给出了值，那么形成的数组的大小将等于初始化的数量。\n\n**练习笔记：** 如果初始化的数量超过数组的大小，则会给出“初始化过多”的错误。\n\
  \n### 数组的局限性\n\n1. 形成的数组将是同质的。也就是说，在整数数组中只能存储整数值，而在浮点数组中只能存储浮点值，字符数组只能有字符。因此，没有任何数组可以包含两种数据类型的值。\n\
  2. 在声明数组时，必须传递数组的大小，且大小必须是常量。这会导致内存的短缺或浪费。\n3. 在数组中插入或删除元素将需要移动。\n4. 数组不检查边界：在 C\
  \ 语言中，没有检查输入到数组中的值是否超过了数组的大小。使用超过数组大小的下标输入的数据将简单地放在数组之外，可能会放在其他数据或程序本身之上。\n\n这至少会导致不可预知的结果，并且没有错误信息来警告程序员超出了数组大小。因此，下面的程序可能会产生非预期的结果：\n\
  \n```c\nint a[10],i;\nfor(i=0;i<=20;i++)\n    a[i]=i;\n```\n\n### 部分已解程序\n\n**1.\
  \ 写一个程序打印 n 个数字的平均数。**\n\n```c\nint a[5],n,i,sum=0;\nfloat avg;\nprintf(\"输入数组中元素的个数:\
