    # Algorithm


    Now we have a bigger picture of how this sorting technique works, so we can derive
    simple steps by which we can achieve insertion sort.


    +   Step 1 – If it is the first element, it is already sorted. return 1; **Step
    2** – Pick next element **Step 3** – Compare with all elements in the sorted sub-list
    **Step 4** – Shift all the elements in the sorted sub-list that is greater than
    the value to be sorted **Step 5** – Insert the value **Step 6** – Repeat until
    list is sorted


    # Pseudocode


    ```

    procedure insertionSort( A : array of items )

    int holePosition

    int valueToInsert


    for i = 1 to length(A) inclusive do:


    /* select value to be inserted */ valueToInsert = A[i]

    holePosition = i


    /*locate hole position for the element to be inserted */

    while holePosition > 0 and A[holePosition-1] > valueToInsert do: A[holePosition]
    = A[holePosition-1]

    holePosition = holePosition -1


    end while


    /* insert the number at hole position */ A[holePosition] = valueToInsert


    end for

    end procedure

    ```


