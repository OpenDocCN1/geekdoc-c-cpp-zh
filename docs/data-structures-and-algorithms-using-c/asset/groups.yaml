    \ result – Breadth First Search: S A B C D\n\n## Tree Data Structure\n\n## 30.\
    \ Tree Data Structures & Algorithms\n\nTree represents the nodes connected by\
    \ edges. We will discuss binary tree or binary search tree specifically.\n\nBinary\
    \ Tree is a special data structure used for data storage purposes. A binary tree\
    \ has a special condition that each node can have a maximum of two children. A\
    \ binary tree has the benefits of both an ordered array and a linked list as search\
    \ is as quick as in a sorted array and insertion or deletion operation as fast\
    \ as in linked list.\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_209_0.png)\n\n\
    ## Important Terms\n\n**Path** – Path refers to the sequence of nodes along the\
    \ edges of a tree.\n\n**Root** – The node at the top of the tree is called root.\
    \ There is only one root per tree and one path from the root node to any node.\n\
    \n**Parent** – Any node except the root node has one edge upward to a node called\
    \ parent.\n\n**Child** – The node below a given node connected by its edge downward\
    \ is called its child node.\n\n**Leaf** – The node which does not have any child\
    \ node is called the leaf node.\n\n**Subtree** – Subtree represents the descendants\
    \ of a node.\n\n**Visiting** – Visiting refers to checking the value of a node\
    \ when control is on the node.\n\n**Traversing** – Traversing means passing through\
    \ nodes in a specific order.\n\n**Levels** – Level of a node represents the generation\
    \ of a node. If the root node is at level 0, then its next child node is at level\
    \ 1, its grandchild is at level 2, and so on.\n\n**Keys** – Key represents a value\
    \ of a node based on which a search operation is to be carried out for a node.\n\
    \n## Binary Search Tree Representation\n\nBinary Search tree exhibits a special\
    \ behavior. A node’s left child must have a value less than its parent’s value\
    \ and the node’s right child must have a value greater than its parent value.\n\
    \n![](img/30fc9e3f8ee01facfae8d1c9621936b3_211_0.png)\n\nWe’re going to implement\
    \ tree using node object and connecting them through references.\n\n## TreeNode\n\
    \nThe code to write a tree node would be similar to what is given below. It has\
    \ a data part and references to its left and right child nodes.\n\n```c\nstruct\
    \ node {\nint data;\nstruct node *leftChild;\nstruct node *rightChild;\n};\n```\n\
    \nIn a tree, all nodes share common construct.\n\n## BST Basic Operations\n\n\
    The basic operations that can be performed on a binary search tree data structure,\
    \ are the following –\n\n- **Insert** – Inserts an element in a tree/create a\
    \ tree.\n- **Search** – Searches an element in a tree.\n- **Pre-order Traversal**\
    \ – Traverses a tree in a pre-order manner.\n- **In-order Traversal** – Traverses\
    \ a tree in an in-order manner.\n- **Post-order Traversal** – Traverses a tree\
    \ in a post-order manner.\n\nWe shall learn creating (inserting into) a tree structure\
    \ and searching a data item in a tree in this chapter. We shall learn about tree\
    \ traversing methods in the coming chapter.\n\n## Insert Operation\n\nThe very\
    \ first insertion creates the tree. Afterwards, whenever an element is to be inserted,\
    \ first locate its proper location. Start searching from the root node, then if\
    \ the data is less than the key value, search for the empty location in the left\
    \ subtree and insert the data. Otherwise, search for the empty location in the\
    \ right subtree and insert the data.\n\n### Algorithm\n\n```\nIf root is NULL\n\
    then create root node\nreturn\nIf root exists then\ncompare the data with node.data\n\
    while until insertion position is located\nIf data is greater than node.data goto\
    \ right subtree\nelse\ngoto left subtree\nendwhile insert data end If\n```\n\n\
    ### Implementation\n\nThe implementation of insert function should look like this\
    \ –\n\n```c\nvoid insert(int data) {\nstruct node *tempNode = (struct node*) malloc(sizeof(struct\
    \ node)); struct node *current;\nstruct node *parent;\ntempNode->data = data;\n\
    tempNode->leftChild = NULL; tempNode->rightChild = NULL;\n//if tree is empty,\
    \ create root node if(root == NULL) {\nroot = tempNode;\n} else {\ncurrent = root;\n\
    parent = NULL;\nwhile(1) {\nparent = current;\n//go to left of the tree\nif(data\
    \ < parent->data) {\ncurrent = current->leftChild;\n//insert to the left\nif(current\
    \ == NULL) {\nparent->leftChild = tempNode;\nreturn;\n}\n}\n//go to right of the\
    \ tree\nelse {\ncurrent = current->rightChild;\n//insert to the right\nif(current\
    \ == NULL) {\nparent->rightChild = tempNode;\nreturn;\n}\n}\n}\n}\n}\n```\n\n\
    ## Search Operation\n\nWhenever an element is to be searched, start searching\
    \ from the root node, then if the data is less than the key value, search for\
    \ the element in the left subtree. Otherwise, search for the element in the right\
    \ subtree. Follow the same algorithm for each node.\n\n### Algorithm\n\n```\n\
    If root.data is equal to search.data return root else while data not found If\
    \ data is greater than node.data goto right subtree else goto left subtree If\
    \ data found return node endwhile return data not found end if\n```\n\nThe implementation\
    \ of this algorithm should look like this.\n\n```c\nstruct node* search(int data)\
    \ {\nstruct node *current = root;\nprintf(\"Visiting elements: \");\nwhile(current->data\
    \ != data) {\nif(current != NULL)\nprintf(\"%d \",current->data);\n//go to left\
    \ tree\nif(current->data > data) {\ncurrent = current->leftChild;\n}\n//else go\
    \ to right tree\nelse {\ncurrent = current->rightChild;\n}\n//not found\nif(current\
    \ == NULL) {\nreturn NULL;\n}\n}\nreturn current;\n}\n```\n\nTo know about the\
    \ implementation of binary search tree data structure, please click here.\n\n"
