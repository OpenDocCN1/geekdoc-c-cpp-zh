    The notation $\theta(n)$ is the formal way to express both the lower bound and
    the upper bound of an algorithm''s running time. It is represented as follows
    –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_36_0.png)


    $\theta(f(n)) = \{ g(n) \text{ if and only if } g(n) = O(f(n)) \text{ and } g(n)
    = \Omega(f(n)) \text{ for all } n > n0. \}$


    ## Common Asymptotic Notations


    Following is a list of some common asymptotic notations:


    - constant – O(1)

    - logarithmic – O(log n)

    - linear – O(n)

    - n log n – O(n log n)

    - quadratic – O(n²)

    - cubic – O(n³)

    - polynomial – n^O(1)

    - exponential – 2^O(n)


    ## 5. Greedy Algorithms


    An algorithm is designed to achieve optimum solution for a given problem. In greedy
    algorithm approach, decisions are made from the given solution domain. As being
    greedy, the closest solution that seems to provide an optimum solution is chosen.


    Greedy algorithms try to find a localized optimum solution, which may eventually
    lead to globally optimized solutions. However, generally greedy algorithms do
    not provide globally optimized solutions.


    ### Counting Coins


    This problem is to count to a desired value by choosing the least possible coins
    and the greedy approach forces the algorithm to pick the largest possible coin.
    If we are provided coins of € 1, 2, 5 and 10 and we are asked to count € 18 then
    the greedy procedure will be –


    - 1 – Select one € 10 coin, the remaining count is 8

    - 2 – Then select one € 5 coin, the remaining count is 3

    - 3 – Then select one € 2 coin, the remaining count is 1

    - 4 – And finally, the selection of one € 1 coins solves the problem


    Though, it seems to be working fine, for this count we need to pick only 4 coins.
    But if we slightly change the problem then the same approach may not be able to
    produce the same optimum result.


    For the currency system, where we have coins of 1, 7, 10 value, counting coins
    for value 18 will be absolutely optimum but for count like 15, it may use more
    coins than necessary.


    For example, the greedy approach will use 10 + 1 + 1 + 1 + 1 + 1, total 6 coins.
    Whereas the same problem could be solved by using only 3 coins (7 + 7 + 1)


    Hence, we may conclude that the greedy approach picks an immediate optimized solution
    and may fail where global optimization is a major concern.


    ### Examples


    Most networking algorithms use the greedy approach. Here is a list of few of them
    –


    - Travelling Salesman Problem

    - Prim''s Minimal Spanning Tree Algorithm

    - Kruskal''s Minimal Spanning Tree Algorithm

    - Dijkstra''s Minimal Spanning Tree Algorithm

    - Graph - Map Coloring

    - Graph - Vertex Cover

    - Knapsack Problem

    - Job Scheduling Problem


    There are lots of similar problems that uses the greedy approach to find an optimum
    solution.


    ## 6. Divide & Conquer


    In divide and conquer approach, the problem in hand, is divided into smaller sub-problems
    and then each problem is solved independently. When we keep on dividing the subproblems
    into even smaller sub-problems, we may eventually reach a stage where no more
    division is possible. Those “atomic” smallest possible sub-problem (fractions)
    are solved. The solution of all sub-problems is finally merged in order to obtain
    the solution of an original problem.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_40_0.png)


    Broadly, we can understand divide-and-conquer approach in a three-step process.


    ### Divide/Break


    This step involves breaking the problem into smaller sub-problems. Sub-problems
    should represent a part of the original problem. This step generally takes a recursive
    approach to divide the problem until no sub-problem is further divisible. At this
    stage, sub-problems become atomic in nature but still represent some part of the
    actual problem.


    ### Conquer/Solve


    This step receives a lot of smaller sub-problems to be solved. Generally, at this
    level, the problems are considered ‘solved’ on their own.


    ### Merge/Combine


    When the smaller sub-problems are solved, this stage recursively combines them
    until they formulate a solution of the original problem. This algorithmic approach
    works recursively and conquer & merge steps works so close that they appear as
    one.


    ### Examples


    The following computer algorithms are based on divide-and-conquer programming
    approach – Merge Sort Quick Sort Binary Search Strassen''s Matrix Multiplication
    Closest Pair (points) There are various ways available to solve any computer problem,
    but the mentioned are a good example of divide and conquer approach.


    ## 7. Dynamic Programming


    Dynamic programming approach is similar to divide and conquer in breaking down
    the problem into smaller and yet smaller possible sub-problems. But unlike, divide
    and conquer, these sub-problems are not solved independently. Rather, results
    of these smaller sub-problems are remembered and used for similar or overlapping
    sub-problems.


    Dynamic programming is used where we have problems, which can be divided into
    similar sub-problems, so that their results can be re-used. Mostly, these algorithms
    are used for optimization. Before solving the in-hand sub-problem, dynamic algorithm
    will try to examine the results of the previously solved sub-problems. The solutions
    of sub-problems are combined in order to achieve the best solution.


    So we can say –


    - The problem should be able to be divided into smaller overlapping sub-problem.

    - An optimum solution can be achieved by using an optimum solution of smaller
    subproblems.

    - Dynamic algorithms use memorization.


    ### Comparison


    In contrast to greedy algorithms, where local optimization is addressed, dynamic
    algorithms are motivated for an overall optimization of the problem.


    In contrast to divide and conquer algorithms, where solutions are combined to
    achieve an overall solution, dynamic algorithms use the output of a smaller sub-problem
    and then try to optimize a bigger sub-problem. Dynamic algorithms use memorization
    to remember the output of already solved sub-problems.


    ### Example


    The following computer problems can be solved using dynamic programming approach
    –


    - Fibonacci number series

    - Knapsack problem

    - Tower of Hanoi

    - All pair shortest path by Floyd-Warshall

    - Shortest path by Dijkstra

    - Project scheduling


    Dynamic programming can be used in both top-down and bottom-up manner. And of
    course, most of the times, referring to the previous solution output is cheaper
    than recomputing in terms of CPU cycles.


