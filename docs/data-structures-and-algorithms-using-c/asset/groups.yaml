    Return success.


    # Algorithm for dequeue Operation


    ```

    procedure dequeue

    if queue is empty

    return underflow

    end if

    data = queue[front]

    front <- front + 1

    return true

    end procedure

    ```


    Implementation of dequeue() in C programming language –


    ```

    int dequeue() {

    if(isempty())

    return 0;

    int data = queue[front];

    front = front + 1;

    return data;

    }

