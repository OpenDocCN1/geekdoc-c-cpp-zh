  mdcn: "\n\n## 删除操作\n\n删除也是一个多步骤的过程。我们将通过图示来学习。首先，使用搜索算法定位要删除的目标节点。\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_0.png)\n\
    \n目标节点的（前驱）节点现在应指向目标节点的下一个节点 – LeftNode.next -> TargetNode.next;\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_1.png)\n\
