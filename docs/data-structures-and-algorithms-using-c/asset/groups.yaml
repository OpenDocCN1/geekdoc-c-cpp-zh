    # # BST Basic Operations


    The basic operations that can be performed on a binary search tree data structure,
    are the following –


    +   - **Insert** – Inserts an element in a tree/create a tree.

    +   - **Search** – Searches an element in a tree.

    +   - **Pre-order Traversal** – Traverses a tree in a pre-order manner.

    +   - **In-order Traversal** – Traverses a tree in an in-order manner.

    +   - **Post-order Traversal** – Traverses a tree in a post-order manner.


    We shall learn creating (inserting into) a tree structure and searching a data
    item in a tree in this chapter. We shall learn about tree traversing methods in
    the coming chapter.'
