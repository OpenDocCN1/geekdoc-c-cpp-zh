    ## Linear Probing


    As we can see, it may happen that the hashing technique is used to create an already
    used index of the array. In such a case, we can search the next empty location
    in the array by looking into the next cell until we find an empty cell. This technique
    is called linear probing.


    | Sr. No. | Key | Hash | Array Index Probing | Array Index |

    |---|---|---|---|---|

    | 1 | 1 | 1 % 20 = 1 | 1 | 1 |

    | 2 | 2 | 2 % 20 = 2 | 2 | 2 |

    | 3 | 42 | 42 % 20 = 2 | 2 | 3 |

    | 4 | 4 | 4 % 20 = 4 | 4 | 4 |

