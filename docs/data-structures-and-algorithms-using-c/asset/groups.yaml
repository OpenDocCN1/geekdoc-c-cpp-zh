    Now, let us learn some programming aspects of selection sort.


    # Algorithm


    Step 1 – Set MIN to location 0 Step 2 – Search the minimum element in the list
    Step 3 – Swap with value at location MIN Step 4 – Increment MIN to point to next
    element Step 5 – Repeat until list is sorted


    # Pseudocode


    ```

    procedure selection sort list : array of items n : size of list

    for i = 1 to n - 1

    /* set current element as minimum*/ min = i

    /* check the element to be minimum */

    for j = i+1 to n

    if list[j] < list[min] then min = j;

    end if

