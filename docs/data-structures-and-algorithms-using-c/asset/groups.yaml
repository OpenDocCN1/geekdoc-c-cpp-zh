    - (17,11)

    - (13,78)

    - (37,98)


    | Sr. No | Key | Hash | Array Index |

    |---|---|---|---|

    | 1 | 1 | 1 % 20 = 1 | 1 |

    | 2 | 2 | 2 % 20 = 2 | 2 |

    | 3 | 42 | 42 % 20 = 2 | 2 |

    | 4 | 4 | 4 % 20 = 4 | 4 |

