    [\"); // navigate through all items\n   for(i = 0; i < MAX; i++){\n      printf(\"\
    %d \",list[i]);\n   }\n   printf(\"]\\n\");\n}\nvoid bubbleSort() {\n   int temp;\n\
    \   int i,j;\n   bool swapped = false;\n   // loop through all numbers\n   for(i\
    \ = 0; i < MAX-1; i++) {  swapped = false;\n      // loop through numbers falling\
    \ ahead\n      for(j = 0; j < MAX-1-i; j++) {\n         printf(\"Items compared:\
