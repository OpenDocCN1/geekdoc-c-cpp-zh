  md: "\n## Pop Operation\n\nAccessing the content while removing it from the stack,\
    \ is known as a Pop Operation. In an array implementation of pop() operation,\
    \ the data element is not actually removed, instead **top** is decremented to\
    \ a lower position in the stack to point to the next value. But in linked-list\
    \ implementation, pop() actually removes data element and deallocates memory space.\n\
    \nA Pop operation may involve the following steps –\n\n- Step 1 – Checks if the\
    \ stack is empty.\n- Step 2 – If the stack is empty, produces an error and exit.\n\
    - Step 3 – If the stack is not empty, accesses the data element at which **top**\
    \ is pointing.\n- Step 4 – Decreases the value of **top** by 1.\n- Step 5 – Returns\
    \ success.\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_105_0.png)\n\n## Algorithm\
    \ for Pop Operation\n\nA simple algorithm for Pop operation can be derived as\
    \ follows –\n\n```\nbegin procedure pop: stack\n\nif stack is empty\nreturn null\n\
    endif\n\ndata <- stack[top]\ntop <- top - 1\nreturn data\nend procedure\n```\n\
    \nImplementation of this algorithm in C, is as follows –\n\n```\nint pop(int data)\
    \ {\n\nif(!isempty()) {\ndata = stack[top];\ntop = top - 1;\nreturn data;\n} else\
    \ {\nprintf(\"Could not retrieve data, Stack is empty.\\n\");\n}\n}\n```\n\nFor\
