    在此场景中，我们给出了数组的确切位置（索引），需要在其中插入新数据元素（值）。首先我们检查数组是否已满，如果未满，则将该位置的所有数据元素向下移动一步。这将为新数据元素腾出空间。


    ### 算法


    我们假设 A 是包含 N 个元素的数组。它可以存储的最大元素数由 MAX 定义。

    begin

    IF N = MAX, return ELSE

