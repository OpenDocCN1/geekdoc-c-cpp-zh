    # Insertion at the Beginning of an Array


    When the insertion happens at the beginning, it causes all the existing data items
    to shift one step downward. Here, we design and implement an algorithm to insert
    an element at the beginning of an array.


    # Algorithm


    We assume A is an array with N elements. The maximum numbers of elements it can
    store is defined by MAX. We shall first check if an array has any empty space
    to store any element and then we proceed with the insertion process.


    ```

    begin

    IF N = MAX, return ELSE

    N = N + 1

    For All Elements in A

    Move to next adjacent location

    A[FIRST] = New_Element end

    ```


    # Implementation in C


    ```

