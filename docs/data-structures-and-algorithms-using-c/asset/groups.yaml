    ### 在数组开头插入


    当插入发生在开头时，会导致所有现有数据项向下移动一步。这里，我们设计并实现一个算法，将元素插入数组开头。


    ### 算法


    我们假设 A 是包含 N 个元素的数组。它可以存储的最大元素数由 MAX 定义。我们首先检查数组是否有空闲空间来存储任何元素，然后再进行插入过程。


    ```

    begin

    IF N = MAX, return ELSE

    N = N + 1

    For All Elements in A

    Move to next adjacent location

    A[FIRST] = New_Element

    end

    ```


