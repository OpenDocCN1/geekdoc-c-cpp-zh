    \ == NULL) {\nparent->leftChild = tempNode;\nreturn;\n}\n}\n//go to right of the\
    \ tree\nelse {\ncurrent = current->rightChild;\n//insert to the right\nif(current\
    \ == NULL) {\nparent->rightChild = tempNode;\nreturn;\n}\n}\n}\n}\n}\n```\n\n\
    ## 搜索操作\n\n每当要搜索元素时，从根节点开始搜索，如果数据小于键值，则在左子树中搜索该元素。否则，在右子树中搜索该元素。对每个节点遵循相同的算法。\n\
    \n### 算法\n\n```\nIf root.data is equal to search.data return root else while data\
    \ not found If data is greater than node.data goto right subtree else goto left\
    \ subtree If data found return node endwhile return data not found end if\n```\n\
    \n此算法的实现应如下所示。\n\n```c\nstruct node* search(int data) {\nstruct node *current\
    \ = root;\nprintf(\"Visiting elements: \");\nwhile(current->data != data) {\n\
    if(current != NULL)\nprintf(\"%d \",current->data);\n//go to left tree\nif(current->data\
    \ > data) {\ncurrent = current->leftChild;\n}\n//else go to right tree\nelse {\n\
    current = current->rightChild;\n}\n//not found\nif(current == NULL) {\nreturn\
    \ NULL;\n}\n}\nreturn current;\n}\n```\n\n要了解二叉搜索树数据结构的实现，请单击此处。\n\n"
