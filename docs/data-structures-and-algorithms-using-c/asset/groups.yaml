  - '[PAGE 237]


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_237_0.png)


    First, we perform the right rotation along C node, making C the right subtree
    of its own left subtree B. Now, B becomes the right subtree of A.


    Node A is still unbalanced because of the right subtree of its right subtree and
    requires a left rotation.


    A left rotation is performed by making B the new root node of the subtree. A becomes
    the left subtree of its right subtree B.


    The tree is now balanced.'
  - '[PAGE 238]


    A spanning tree is a subset of Graph G, which has all the vertices covered with
    minimum possible number of edges. Hence, a spanning tree does not have cycles
    and it cannot be disconnected.


    By this definition, we can draw a conclusion that every connected and undirected
    Graph G has at least one spanning tree. A disconnected graph does not have any
    spanning tree, as it cannot be spanned to all its vertices.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_238_0.png)


    We found three spanning trees off one complete graph. A complete undirected graph
    can have maximum n^n-2 number of spanning trees, where n is the number of nodes.
    In the above addressed example, n is 3, hence 3^3-2 = 3 spanning trees are possible.'
  - '[PAGE 239]


    # GeneralPropertiesofSpanning Tree


    We now understand that one graph can have more than one spanning tree. Following
    are a few properties of the spanning tree connected to graph G


    A connected graph G can have more than one spanning tree.


    All possible spanning trees of graph G, have the same number of edges and vertices.


    The spanning tree does not have any cycle (loops).


    Removing one edge from the spanning tree will make the graph disconnected, i.e.
    the spanning tree is minimally connected.


    Adding one edge to the spanning tree will create a circuit or loop, i.e. the spanning
    tree is maximally acyclic.'
  - '[PAGE 240]


    # MathematicalPropertiesofSpanningTree


    Spanning tree has n-1 edges, where n is the number of nodes (vertices).

    From a complete graph, by removing maximum e-n+1 edges, we can construct a spanning
    tree.

    A complete graph can have maximum n^(n-2) number of spanning trees.

    Thus, we can conclude that spanning trees are a subset of connected Graph G and

    disconnected graphs do not have spanning tree.'
  - '[PAGE 241]


    # ApplicationofSpanningTree


    Spanning tree is basically used to find a minimum path to connect all nodes in
    a graph.


    +   Common application of spanning trees are –

    +   - Civil Network Planning

    +   - Computer Network Routing Protocol

    +   - Cluster Analysis


    Let us understand this through a small example. Consider, city network as a huge
    graph and now plans to deploy telephone lines in such a way that in minimum lines
    we can connect to all city nodes. This is where the spanning tree comes into picture.'
  - '[PAGE 242]


    # MinimumSpanningTree(MST)


    In a weighted graph, a minimum spanning tree is a spanning tree that has minimum
    weight than all other spanning trees of the same graph. In real-world situations,
    this weight can be measured as distance, congestion, traffic load or any arbitrary
    value denoted to the edges.'
  - '[PAGE 243]


    # MinimumSpanning-TreeAlgorithm


    We shall learn about two most important spanning tree algorithms here – Kruskal''s
    Algorithm Prim''s Algorithm Both are greedy algorithms.'
  - '[PAGE 244]


    # # Kruskal''s Spanning Tree Algorithm


    Kruskal''s algorithm to find the minimum cost spanning tree uses the greedy approach.
    This algorithm treats the graph as a forest and every node it has as an individual
    tree. A tree connects to another only and only if, it has the least cost among
    all available options and does not violate MST properties.


    To understand Kruskal''s algorithm let us consider the following example –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_244_0.png)


    # ## Step 1 - Remove all loops and parallel edges


    Remove all loops and parallel edges from the given graph.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_244_1.png)


    In case of parallel edges, keep the one which has the least cost associated and
    remove all others.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_244_2.png)


    # ## Step 2 - Arrange all edges in their increasing order of weight'
  - '[PAGE 245]


    The next step is to create a set of edges and weight, and arrange them in an ascending
    order of weightage (cost).


    | B, D | D, T | A, C | C, D | C, B | B, T | A, B | S, A | S, C |

    |---|---|---|---|---|---|---|---|---|

    | 2 | 2 | 3 | 3 | 4 | 5 | 6 | 7 | 8 |


    # Step 3 - Add the edge which has the least weightage


    Now we start adding edges to the graph beginning from the one which has the least
    weight. Throughout, we shall keep checking that the spanning properties remain
    intact. In case, by adding one edge, the spanning tree property does not hold
    then we shall consider not to include the edge in the graph.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_245_0.png)


    The least cost is 2 and edges involved are B,D and D,T. We add them. Adding them
    does not violate spanning tree properties, so we continue to our next edge selection.


    Next cost is 3, and associated edges are A,C and C,D. We add them again –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_245_1.png)


    Next cost in the table is 4, and we observe that adding it will create a circuit
    in the graph.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_245_2.png)


    We ignore it. In the process we shall ignore/avoid all edges that create a circuit.'
  - '[PAGE 246]


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_246_0.png)


    We observe that edges with cost 5 and 6 also create circuits. We ignore them and
    move on.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_246_1.png)


    Now we are left with only one node to be added. Between the two least cost edges
    available 7 and 8, we shall add the edge with cost 7.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_246_2.png)


    By adding edge S,A we have included all the nodes of the graph and we now have
    minimum cost spanning tree.'
  - '[PAGE 247]


    # # Prim''sSpanningTreeAlgorithm


    Prim''s algorithm to find minimum cost spanning tree (as Kruskal''s algorithm)
    uses the greedy approach. Prim''s algorithm shares a similarity with the **shortest
    path first** algorithms.


    Prim''s algorithm, in contrast with Kruskal''s algorithm, treats the nodes as
    a single tree and keeps on adding new nodes to the spanning tree from the given
    graph. To contrast with Kruskal''s algorithm and to understand Prim''s algorithm
    better, we shall use the same example –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_247_0.png)


    # ## Step 1 - Remove all loops and parallel edges


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_247_1.png)


    Remove all loops and parallel edges from the given graph. In case of parallel
    edges, keep the one which has the least cost associated and remove all others.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_247_2.png)


    # ## Step 2 - Choose any arbitrary node as root node'
  - '[PAGE 248]


    In this case, we choose S node as the root node of Prim''s spanning tree. This
    node is arbitrarily chosen, so any node can be the root node. One may wonder why
    any video can be a root node. So the answer is, in the spanning tree all the nodes
    of a graph are included and because it is connected then there must be at least
    one edge, which will join it to the rest of the tree.


    # Step 3 - Check outgoing edges and select the one with less cost


    After choosing the root node S, we see that S,A and S,C are two edges with weight
    7 and 8, respectively. We choose the edge S,A as it is lesser than the other.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_248_0.png)


    Now, the tree S-7-A is treated as one node and we check for all edges going out
    from it. We select the one which has the lowest cost and include it in the tree.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_248_1.png)


    After this step, S-7-A-3-C tree is formed. Now we''ll again treat it as a node
    and will check all the edges again. However, we will choose only the least cost
    edge. In this case, C-3-D is the new edge, which is less than other edges'' cost
    8, 6, 4, etc.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_248_2.png)


    After adding node D to the spanning tree, we now have two edges going out of it
    having the same cost, i.e. D-2-T and D-2-B. Thus, we can add either one. But the
    next step will again yield edge 2 as the least cost. Hence, we are showing a spanning
    tree with both edges included.'
