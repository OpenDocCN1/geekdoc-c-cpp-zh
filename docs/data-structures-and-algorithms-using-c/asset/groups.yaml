    \n## 26. 快速排序 数据结构与算法\n\n快速排序是一种高效的排序算法，基于将数据数组划分为更小数组的方式。大数组被划分为两个数组，一个存储小于指定值（称为基准值\
    \ pivot）的值，另一个存储大于基准值的值，划分依据即为该基准值。\n\n快速排序对数组进行分区，然后递归调用自身两次来对生成的两个子数组进行排序。该算法对于大型数据集非常高效，因为其平均和最坏情况复杂度为\
    \ O(nlogn)，其中 n 为项目数量。\n\n### 快速排序中的分区\n\n以下动画表示说明如何在数组中找到基准值。\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_187_0.png)\n\
    \n基准值将列表分为两部分。然后递归地，为每个子列表找到基准值，直到所有列表只包含一个元素。\n\n### 快速排序基准值算法\n\n基于我们对快速排序中分区的理解，我们现在尝试为其编写一个算法，如下所示。\n\
    \n- 步骤 1 – 选择最高索引值作为基准值\n- 步骤 2 – 取两个变量指向列表左侧和右侧（不包括基准值）\n- 步骤 3 – left 指向低索引\n\
    - 步骤 4 – right 指向高索引\n- 步骤 5 – 当 left 处的值小于基准值时，向右移动\n- 步骤 6 – 当 right 处的值大于基准值时，向左移动\n\
    - 步骤 7 – 如果步骤 5 和步骤 6 都不匹配，交换 left 和 right\n- 步骤 8 – 如果 left ≥ right，则它们相遇的点即为新基准值\n\
    \n### 快速排序基准值伪代码\n\n上述算法的伪代码可推导如下 –\n\n```\nfunction partitionFunc(left, right,\
    \ pivot)\n   leftPointer = left - 1\n   rightPointer = right\n\n   while True\
    \ do\n      while A[++leftPointer] < pivot do\n      // do nothing\n      end\
    \ while\n\n      while rightPointer > 0 && A[--rightPointer] > pivot do\n    \
    \  // do nothing\n      end while\n\n      if leftPointer >= rightPointer then\n\
    \         break\n      else\n         swap leftPointer, rightPointer\n      end\
    \ if\n   end while\n\n   swap leftPointer, right\n   return leftPointer\nend function\n\
    ```\n\n### 快速排序算法\n\n递归使用基准值算法，最终得到尽可能小的分区。然后对每个分区进行快速排序。我们定义快速排序的递归算法如下 –\n\n\
    - 步骤 1 – 将最右侧索引值设为基准值\n- 步骤 2 – 使用基准值对数组进行分区\n- 步骤 3 – 递归对左侧分区进行快速排序\n- 步骤 4 –\
    \ 递归对右侧分区进行快速排序\n\n### 快速排序伪代码\n\n要深入了解，让我们看看快速排序算法的伪代码 –\n\n```\nprocedure quickSort(left,\
    \ right)\n   if right - left <= 0 then\n      return\n   else\n      pivot = A[right]\n\
    \      partition = partitionFunc(left, right, pivot)\n      quickSort(left, partition\
    \ - 1)\n      quickSort(partition + 1, right)\n   end if\nend procedure\n```\n\
    \n要了解 C 语言中快速排序的实现，请单击此处。\n\n### C 语言中的快速排序程序\n\n快速排序是一种高效的排序算法，基于将数据数组划分为更小数组的方式。大数组被划分为两个数组，一个存储小于指定值（称为基准值\
    \ pivot）的值，另一个存储大于基准值的值，划分依据即为该基准值。\n\n### C 语言实现\n\n```c\n#include <stdio.h>\n\
    #include <stdbool.h>\n#define MAX 7\nint intArray[MAX] = {4, 6, 3, 2, 1, 9, 7};\n\
    \nvoid printline(int count) {\n   int i;\n   for (i = 0; i < count - 1; i++) {\n\
    \      printf(\"=\");\n   }\n   printf(\"=\\n\");\n}\n\nvoid display() {\n   int\
    \ i;\n   printf(\"[\");\n   // navigate through all items\n   for (i = 0; i <\
    \ MAX; i++) {\n      printf(\"%d \", intArray[i]);\n   }\n   printf(\"]\\n\");\n\
    }\n\nvoid swap(int num1, int num2) {\n   int temp = intArray[num1];\n   intArray[num1]\
    \ = intArray[num2];\n   intArray[num2] = temp;\n}\n\nint partition(int left, int\
    \ right, int pivot) {\n   int leftPointer = left - 1;\n   int rightPointer = right;\n\
    \n   while (true) {\n      while (intArray[++leftPointer] < pivot) {\n       \
    \  // do nothing\n      }\n\n      while (rightPointer > 0 && intArray[--rightPointer]\
    \ > pivot) {\n         // do nothing\n      }\n\n      if (leftPointer >= rightPointer)\
    \ {\n         break;\n      } else {\n         printf(\" item swapped :%d,%d\\\
    n\", intArray[leftPointer], intArray[rightPointer]);\n         swap(leftPointer,\
    \ rightPointer);\n      }\n   }\n\n   printf(\" pivot swapped :%d,%d\\n\", intArray[leftPointer],\
    \ intArray[right]);\n   swap(leftPointer, right);\n\n   printf(\"Updated Array\
    \ : \");\n   display();\n   return leftPointer;\n}\n\nvoid quickSort(int left,\
    \ int right) {\n   if (right - left <= 0) {\n      return;\n   } else {\n    \
    \  int pivot = intArray[right];\n      int partitionPoint = partition(left, right,\
    \ pivot);\n      quickSort(left, partitionPoint - 1);\n      quickSort(partitionPoint\
    \ + 1, right);\n   }\n}\n\nint main() {\n   printf(\"Input Array : \");\n   display();\n\
    \   printline(50);\n   quickSort(0, MAX - 1);\n   printf(\"Output Array : \");\n\
    \   display();\n   printline(50);\n}\n```\n\n如果编译并运行上述程序，将产生以下结果 –\n\n```\nInput\
    \ Array: [4 6 3 2 1 9 7]\n\npivot swapped :9,7\nUpdated Array: [4 6 3 2 1 7 9\
