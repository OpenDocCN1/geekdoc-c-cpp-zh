    ## 14. 表达式解析数据结构与算法\n\n编写算术表达式的方式称为表示法。算术表达式可以用三种不同但等价的表示法编写，即不改变表达式的本质或输出。这些表示法如下\
    \ –\n\n- 中缀表示法\n- 前缀（波兰）表示法\n- 后缀（逆波兰）表示法\n\n这些表示法根据其在表达式中使用运算符的方式命名。我们将在本章中学习相同内容。\n\
    \n## 中缀表示法\n\n我们使用中缀表示法编写表达式，例如 a-b+c，其中运算符位于操作数之间。对人类来说，使用中缀表示法阅读、编写和表达都很容易，但这对计算设备来说并不适用。处理中缀表示法的算法在时间和空间消耗方面可能既困难又昂贵。\n\
    \n## 前缀表示法\n\n在这种表示法中，运算符置于操作数之前，即运算符写在操作数前面。例如，+ab。这等同于其中缀表示法 a+b。前缀表示法也称为波兰表示法。\n\
    \n## 后缀表示法\n\n这种表示法样式称为逆波兰表示法。在这种表示法样式中，运算符置于操作数之后，即运算符写在操作数后面。例如，ab+。这等同于其中缀表示法\
    \ a+b。\n\n下表简要展示了三种表示法之间的区别 –\n\n| 序号 | 中缀表示法 | 前缀表示法 | 后缀表示法 |\n|---|---|---|---|\n\
    | 1 | a + b | + a b | a b + |\n| 2 | (a + b) * c | * + a b c | a b + c * |\n|\
    \ 3 | a * (b + c) | * a + b c | a b c + * |\n| 4 | a / b + c / d | + / a b / c\
    \ d | a b / c d / + |\n| 5 | (a + b) * (c + d) | * + a b + c d | a b + c d + *\
    \ |\n| 6 | ((a + b) * c) - d | - * + a b c d | a b + c * d |\n\n## 解析表达式\n\n正如我们所讨论的，设计算法或程序来解析中缀表示法并不是一种非常高效的方式。相反，这些中缀表示法首先被转换为后缀或前缀表示法，然后再进行计算。\n\
    \n要解析任何算术表达式，我们还需要考虑运算符优先级和结合性。\n\n### 优先级\n\n当操作数位于两个不同运算符之间时，哪个运算符首先获取该操作数由运算符相对于其他运算符的优先级决定。例如\
    \ –\na + b * c -> a + ( b * c ) 由于乘法运算优先于加法运算，因此 b * c 将首先被求值。运算符优先级表将在后面提供。\n\
    \n### 结合性\n\n结合性描述了具有相同优先级的运算符出现在表达式时的规则。例如，在表达式 a+b-c 中，+ 和 – 具有相同的优先级，那么表达式的哪一部分将首先被求值由这些运算符的结合性决定。这里，+\
    \ 和 – 都是左结合的，因此表达式将被求值为 (a+b)-c。\n\n优先级和结合性决定了表达式求值的顺序。以下是运算符优先级和结合性表（从高到低） –\n\
    \n| 序号 | 运算符 | 优先级 | 结合性 |\n|---|---|---|---|\n| 1 | 幂运算 ^ | 最高 | 右结合 |\n| 2 |\
    \ 乘法 ( * ) & 除法 ( / ) | 次高 | 左结合 |\n| 3 | 加法 ( + ) & 减法 ( - ) | 最低 | 左结合 |\n\n\
    上表显示了运算符的默认行为。在表达式求值的任何时候，都可以通过使用括号来改变顺序。例如 – 在 a+b*c 中，表达式部分 b*c 将首先被求值，乘法优先于加法。我们在此处使用括号使\
    \ a+b 首先被求值，例如 (a+b)*c。\n\n## 后缀求值算法\n\n我们现在来看如何求值后缀表示法的算法 –\n\n- 步骤 1 – 从左到右扫描表达式\n\
