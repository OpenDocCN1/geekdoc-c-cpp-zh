    # Insert Operation


    The very first insertion creates the tree. Afterwards, whenever an element is
    to be inserted, first locate its proper location. Start searching from the root
    node, then if the data is less than the key value, search for the empty location
    in the left subtree and insert the data. Otherwise, search for the empty location
    in the right subtree and insert the data.


    # Algorithm


    ```

    If root is NULL

    then create root node

    return

    If root exists then

    compare the data with node.data

    while until insertion position is located

    If data is greater than node.data goto right subtree

    else

    goto left subtree

    endwhile insert data end If

    ```


