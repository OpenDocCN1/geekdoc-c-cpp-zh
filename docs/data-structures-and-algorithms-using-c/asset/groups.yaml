    \n## 26. Quick Sort Data Structures & Algorithms\n\nQuick sort is a highly efficient\
    \ sorting algorithm and is based on partitioning of array of data into smaller\
    \ arrays. A large array is partitioned into two arrays one of which holds values\
    \ smaller than the specified value, say pivot, based on which the partition is\
    \ made and another array holds values greater than the pivot value.\n\nQuick sort\
    \ partitions an array and then calls itself recursively twice to sort the two\
    \ resulting subarrays. This algorithm is quite efficient for large-sized data\
    \ sets as its average and worst case complexity are of O(nlogn), where n is the\
    \ number of items.\n\n### Partition in Quick Sort\n\nFollowing animated representation\
    \ explains how to find the pivot value in an array.\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_187_0.png)\n\
    \nThe pivot value divides the list into two parts. And recursively, we find the\
    \ pivot for each sub-lists until all lists contains only one element.\n\n### Quick\
    \ Sort Pivot Algorithm\n\nBased on our understanding of partitioning in quick\
    \ sort, we will now try to write an algorithm for it, which is as follows.\n\n\
    - Step 1 – Choose the highest index value has pivot\n- Step 2 – Take two variables\
    \ to point left and right of the list excluding pivot\n- Step 3 – left points\
    \ to the low index\n- Step 4 – right points to the high\n- Step 5 – while value\
    \ at left is less than pivot move right\n- Step 6 – while value at right is greater\
    \ than pivot move left\n- Step 7 – if both step 5 and step 6 does not match swap\
    \ left and right\n- Step 8 – if left ≥ right, the point where they met is new\
    \ pivot\n\n### Quick Sort Pivot Pseudocode\n\nThe pseudocode for the above algorithm\
    \ can be derived as –\n\n```\nfunction partitionFunc(left, right, pivot)\n   leftPointer\
    \ = left - 1\n   rightPointer = right\n\n   while True do\n      while A[++leftPointer]\
    \ < pivot do\n      // do nothing\n      end while\n\n      while rightPointer\
    \ > 0 && A[--rightPointer] > pivot do\n      // do nothing\n      end while\n\n\
    \      if leftPointer >= rightPointer then\n         break\n      else\n     \
    \    swap leftPointer, rightPointer\n      end if\n   end while\n\n   swap leftPointer,\
    \ right\n   return leftPointer\nend function\n```\n\n### Quick Sort Algorithm\n\
    \nUsing pivot algorithm recursively, we end up with smaller possible partitions.\
    \ Each partition is then processed for quick sort. We define recursive algorithm\
    \ for quicksort as follows –\n\n- Step 1 – Make the right-most index value pivot\n\
    - Step 2 – partition the array using pivot value\n- Step 3 – quicksort left partition\
    \ recursively\n- Step 4 – quicksort right partition recursively\n\n### Quick Sort\
    \ Pseudocode\n\nTo get more into it, let see the pseudocode for quick sort algorithm\
    \ –\n\n```\nprocedure quickSort(left, right)\n   if right - left <= 0 then\n \
    \     return\n   else\n      pivot = A[right]\n      partition = partitionFunc(left,\
    \ right, pivot)\n      quickSort(left, partition - 1)\n      quickSort(partition\
    \ + 1, right)\n   end if\nend procedure\n```\n\nTo know about quick sort implementation\
    \ in C programming language, please click here.\n\n### Quick Sort Program in C\n\
    \nQuick sort is a highly efficient sorting algorithm and is based on partitioning\
    \ of array of data into smaller arrays. A large array is partitioned into two\
    \ arrays one of which holds values smaller than the specified value, say pivot,\
    \ based on which the partition is made and another array holds values greater\
    \ than the pivot value.\n\n### Implementation in C\n\n```c\n#include <stdio.h>\n\
    #include <stdbool.h>\n#define MAX 7\nint intArray[MAX] = {4, 6, 3, 2, 1, 9, 7};\n\
    \nvoid printline(int count) {\n   int i;\n   for (i = 0; i < count - 1; i++) {\n\
    \      printf(\"=\");\n   }\n   printf(\"=\\n\");\n}\n\nvoid display() {\n   int\
    \ i;\n   printf(\"[\");\n   // navigate through all items\n   for (i = 0; i <\
    \ MAX; i++) {\n      printf(\"%d \", intArray[i]);\n   }\n   printf(\"]\\n\");\n\
    }\n\nvoid swap(int num1, int num2) {\n   int temp = intArray[num1];\n   intArray[num1]\
    \ = intArray[num2];\n   intArray[num2] = temp;\n}\n\nint partition(int left, int\
    \ right, int pivot) {\n   int leftPointer = left - 1;\n   int rightPointer = right;\n\
    \n   while (true) {\n      while (intArray[++leftPointer] < pivot) {\n       \
    \  // do nothing\n      }\n\n      while (rightPointer > 0 && intArray[--rightPointer]\
    \ > pivot) {\n         // do nothing\n      }\n\n      if (leftPointer >= rightPointer)\
    \ {\n         break;\n      } else {\n         printf(\" item swapped :%d,%d\\\
    n\", intArray[leftPointer], intArray[rightPointer]);\n         swap(leftPointer,\
    \ rightPointer);\n      }\n   }\n\n   printf(\" pivot swapped :%d,%d\\n\", intArray[leftPointer],\
    \ intArray[right]);\n   swap(leftPointer, right);\n\n   printf(\"Updated Array\
    \ : \");\n   display();\n   return leftPointer;\n}\n\nvoid quickSort(int left,\
    \ int right) {\n   if (right - left <= 0) {\n      return;\n   } else {\n    \
    \  int pivot = intArray[right];\n      int partitionPoint = partition(left, right,\
    \ pivot);\n      quickSort(left, partitionPoint - 1);\n      quickSort(partitionPoint\
    \ + 1, right);\n   }\n}\n\nint main() {\n   printf(\"Input Array : \");\n   display();\n\
    \   printline(50);\n   quickSort(0, MAX - 1);\n   printf(\"Output Array : \");\n\
    \   display();\n   printline(50);\n}\n```\n\nIf we compile and run the above program,\
    \ it will produce the following result –\n\n```\nInput Array: [4 6 3 2 1 9 7]\n\
