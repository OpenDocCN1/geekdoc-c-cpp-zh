    \ Data Structures & Algorithms\n\nCircular Linked List is a variation of Linked\
    \ list in which the first element points to the last element and the last element\
    \ points to the first element. Both Singly Linked List and Doubly Linked List\
    \ can be made into a circular linked list.\n\n### Singly Linked List as Circular\n\
    \nIn singly linked list, the next pointer of the last node points to the first\
    \ node.\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_90_0.png)\n\n### Doubly Linked\
    \ List as Circular\n\nIn doubly linked list, the next pointer of the last node\
    \ points to the first node and the previous pointer of the first node points to\
    \ the last node making the circular in both directions.\n\n![](img/30fc9e3f8ee01facfae8d1c9621936b3_91_0.png)\n\
    \nAs per the above illustration, following are the important points to be considered.\n\
    \n- The last link's next points to the first link of the list in both cases of\
    \ singly as well as doubly linked list.\n- The first link's previous points to\
    \ the last of the list in case of doubly linked list.\n"
