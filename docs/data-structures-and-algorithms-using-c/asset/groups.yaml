    ### C 编译器


    源文件中编写的源代码是程序的人类可读源代码。它需要被“编译”，转换为机器语言，以便 CPU 根据给定指令实际执行程序。


    此 C 语言编译器将用于将源代码编译成最终可执行程序。我们假设你具备编程语言编译器的基本知识。


    最常用且免费的编译器是 GNU C/C++ 编译器。否则，如果你拥有相应的操作系统 (OS)，也可以使用 HP 或 Solaris 的编译器。


