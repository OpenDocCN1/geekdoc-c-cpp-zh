  mdcn: "\n\n## C 语言中的希尔排序程序\n\n希尔排序是一种高效的排序算法，基于插入排序算法。当较小的值位于最右侧且需要移动到最左侧时，该算法避免了像插入排序那样的大规模移动。\n\
