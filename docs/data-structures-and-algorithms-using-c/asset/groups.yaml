    # 28. Depth First Traversal Data Structures & Algorithms


    Depth First Search (DFS) algorithm traverses a graph in a depthward motion and
    uses a stack to remember to get the next vertex to start a search, when a dead
    end occurs in any iteration.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_197_0.png)


    As in the example given above, DFS algorithm traverses from A to B to C to D first
    then to E, then to F and lastly to G. It employs the following rules.


    +   - Rule 1 – Visit the adjacent unvisited vertex. Mark it as visited. Display
    it. Push it in a stack.

    +   - Rule 2 – If no adjacent vertex is found, pop up a vertex from the stack.
    (It will pop up all the vertices from the stack, which do not have adjacent vertices.)

    +   - Rule 3 – Repeat Rule 1 and Rule 2 until the stack is empty.


