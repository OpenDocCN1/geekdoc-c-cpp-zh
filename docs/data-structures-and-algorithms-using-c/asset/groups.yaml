    \ \");\n   display();\n   printf(\"\\n\");\n   bubbleSort();\n   printf(\"\\nOutput\
    \ Array : \"); display();\n}\n```\n\n```\nInput Array: [1 8 4 6 0 3 5 2 7 9]\n\
