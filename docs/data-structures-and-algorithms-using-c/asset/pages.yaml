  md: '# # PopOperation


    Accessing the content while removing it from the stack, is known as a Pop Operation.
    In an array implementation of pop() operation, the data element is not actually
    removed, instead **top** is decremented to a lower position in the stack to point
    to the next value. But in linked-list implementation, pop() actually removes data
    element and deallocates memory space.


    A Pop operation may involve the following steps –


    +   Step 1 – Checks if the stack is empty.

    +   Step 2 – If the stack is empty, produces an error and exit. Step 3 – If the
    stack is not empty, accesses the data element at which **top** is pointing.

    +   Step 4 – Decreases the value of **top** by 1. Step 5 – Returns success.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_105_0.png)


