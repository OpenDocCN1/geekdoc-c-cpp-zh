- pgno: 251
  md: '# # MaxHeapConstructionAlgorithm


    We shall use the same example to demonstrate how a Max Heap is created. The procedure
    to create Min Heap is similar but we go for min values instead of max values.


    We are going to derive an algorithm for max heap by inserting one element at a
    time. At any point of time, heap must maintain its property. While insertion,
    we also assume that we are inserting a node in an already heapified tree.


    +   Step 1 – Create a new node at the end of heap.

    +   Step 2 – Assign new value to the node.

    +   Step 3 – Compare the value of this child node with its parent.

    +   Step 4 – If value of parent is less than child, then swap them.

    +   Step 5 – Repeat step 3 & 4 until Heap property holds.


    Note – In Min Heap construction algorithm, we expect the value of the parent node
    to be less than that of the child node.


    Let''s understand Max Heap construction by an animated illustration. We consider
    the same input sample that we used earlier.


    Input 35 33 42 10 14 19 27 44 26 31


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_251_0.png)'
  merge: -1
