    then move to its left subtree B. B is also traversed pre-order. The process goes
    on until all the nodes are visited. The output of preorder traversal of this tree
    will be –


    A → B → D → E → C → F → G


    Until all nodes are traversed –


    +   Step 1 – Visit root node. Step 2 – Recursively traverse left subtree. Step
