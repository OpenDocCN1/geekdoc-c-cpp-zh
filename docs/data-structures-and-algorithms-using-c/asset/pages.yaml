  md: '# FibonacciInteractiveProgram inC


    # Fibonacci Program in C RecursionDemo.c


    ```

    #include <stdio.h>

    int factorial(int n) {/base case

    if(n == 0){

    return 1;

    return n * factorial(n-1); }

    }

    int fibbonacci(int n){

    if(n == 0){

    return 0;

    }else if(n == 1){

    return 1;

    }else {

    return (fibbonacci(n-1) + fibbonacci(n-2));

    }

    }

