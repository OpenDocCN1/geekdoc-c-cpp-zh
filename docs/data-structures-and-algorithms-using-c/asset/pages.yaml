  md: '# Update Operation


    Update operation refers to updating an existing element from the array at a given
    index.


    # Algorithm


    Consider **LA** is a linear array with **N** elements and **K** is a positive
    integer such that **K<=N**. Following is the algorithm to update an element available
    at the K<sup>th</sup> position of LA.


    +   1. Start

    +   2. Set LA[K-1] = ITEM

    +   3. Stop


    # Example


    Following is the implementation of the above algorithm –


    ```

    #include <stdio.h>

    main() {

    int LA[] = {1,3,5,7,8};

