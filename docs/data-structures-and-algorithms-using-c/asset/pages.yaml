  md: '# # StableandNotStableSorting


    If a sorting algorithm, after sorting the contents, does not change the sequence
    of similar content in which they appear, it is called stable sorting.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_156_0.png)


    If a sorting algorithm, after sorting the contents, changes the sequence of similar
    content in which they appear, it is called unstable sorting.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_156_1.png)


    Stability of an algorithm matters when we wish to maintain the sequence of original
    elements, like in a tuple for example.'
