  md: '# # 6. Divide & Conquer Data Structures & Algorithms


    In divide and conquer approach, the problem in hand, is divided into smaller sub-problems
    and then each problem is solved independently. When we keep on dividing the subproblems
    into even smaller sub-problems, we may eventually reach a stage where no more
    division is possible. Those “atomic” smallest possible sub-problem (fractions)
    are solved. The solution of all sub-problems is finally merged in order to obtain
    the solution of an original problem.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_40_0.png)


    Broadly, we can understand divide-and-conquer approach in a three-step process.'
