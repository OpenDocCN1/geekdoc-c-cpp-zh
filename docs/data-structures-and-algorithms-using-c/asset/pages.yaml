- pgno: 263
  md: '# Algorithm


    To write an algorithm for Tower of Hanoi, first we need to learn how to solve
    this problem with lesser amount of disks, say → 1 or 2. We mark three towers with
    name, **source**, **destination** and **aux** (only to help moving the disks).
    If we have only one disk, then it can easily be moved from source to destination
    peg.


    If we have 2 disks –


    +   First, we move the smaller (top) disk to aux peg.


    +   Then, we move the larger (bottom) disk to destination peg.


    +   And finally, we move the smaller disk from aux to destination peg.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_263_0.png)


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_263_1.png)


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_263_2.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/30fc9e3f8ee01facfae8d1c9621936b3_264_0.png)


    So now, we are in a position to design an algorithm for Tower of Hanoi with more
    than two disks. We divide the stack of disks in two parts. The largest disk (n<sup>th</sup>
    disk) is in one part and all other (n-1) disks are in the second part.


    Our ultimate aim is to move disk **n** from source to destination and then put
    all other (n1) disks onto it. We can imagine to apply the same in a recursive
    way for all given set of disks.


    The steps to follow are –


    **Step 1** – Move n-1 disks from **source** to **aux** **Step 2** – Move n<sup>th</sup>
    disk from **source** to **dest** **Step 3** – Move n-1 disks from **aux** to **dest**


    A recursive algorithm for Tower of Hanoi can be driven as follows –


    ```

    START

    Procedure Hanoi(disk, source, dest, aux)

    IF disk == 0, THEN

    move disk from source to dest

    ELSE

    Hanoi(disk - 1, source, aux, dest) // Step 1 move disk from source to dest //
    Step 2

    Hanoi(disk - 1, aux, dest, source) // Step 3

    END IF

    END Procedure STOP

    ```


    To check the implementation in C programming, click here.'
