  md: '# Deletion Operation


    Deletion refers to removing an existing element from the array and re-organizing
    all elements of an array.


    # Algorithm


    Consider LA is a linear array with N elements and K is a positive integer such
    that K<=N. Following is the algorithm to delete an element available at the Kth
    position of LA.


    +   1. Start

    +   2. Set J=K

    +   3. Repeat steps 4 and 5 while J < N

    +   4. Set LA[J-1] = LA[J]

    +   5. Set J = J+1

    +   6. Set N = N-1

    +   7. Stop


    # Example


    Following is the implementation of the above algorithm –


    ```

    #include <stdio.h>

    main() {

    int LA[] = {1,3,5,7,8};

    int k = 3, n = 5;

    int i, j;


    printf("The original array elements are :\n"); for(i = 0; i<n; i++) {

    printf("LA[%d] = %d \n", i, LA[i]); }

    j = k;

    while( j < n) {

    LA[j-1] = LA[j]; j = j + 1;

    }

    n = n -1;

    printf("The array elements after deletion :\n");

    for(i = 0; i<n; i++) {

    printf("LA[%d] = %d \n", i, LA[i]);

    }

    }

    ```


    When we compile and execute the above program, it produces the following result
    –


    The original array elements are : LA[0]=1

    LA[1]=3

    LA[2]=5

    LA[3]=7'
