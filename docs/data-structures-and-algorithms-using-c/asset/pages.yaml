- pgno: 113
  md: "# # ParsingExpressions\n\nAs we have discussed, it is not a very efficient\
    \ way to design an algorithm or program to parse infix notations. Instead, these\
    \ infix notations are first converted into either postfix or prefix notations\
    \ and then computed.\n\nTo parse any arithmetic expression, we need to take care\
    \ of operator precedence and associativity also.\n\n# ## Precedence\n\nWhen an\
    \ operand is in between two different operators, which operator will take the\
    \ operand first, is decided by the precedence of an operator over others. For\
    \ example – \na + b * c -> a + ( b * c ) As multiplication operation has precedence\
    \ over addition, b * c will be evaluated first. A table of operator precedence\
    \ is provided later.\n\n# ## Associativity\n\nAssociativity describes the rule\
    \ where operators with the same precedence appear in an expression. For example,\
    \ in expression a+b-c, both + and – have the same precedence, then which part\
    \ of the expression will be evaluated first, is determined by associativity of\
    \ those operators. Here, both + and – are left associative, so the expression\
    \ will be evaluated as (a+b)-c.\n\nPrecedence and associativity determines the\
    \ order of evaluation of an expression. Following is an operator precedence and\
    \ associativity table (highest to lowest) –\n\n| Sr. | Operator | Precedence |\
    \ Associativity |\n|---|---|---|---|\n| 1 | Exponentiation ^ | Highest | Right\
    \ Associative |\n| 2 | Multiplication ( * ) & Division ( / ) | Second Highest\
    \ | Left Associative |\n| 3 | Addition ( + ) & Subtraction ( - ) | Lowest | Left\
    \ Associative |\n\nThe above table shows the default behavior of operators. At\
    \ any point of time in expression evaluation, the order can be altered by using\
    \ parenthesis. For example – In a+b*c, the expression part b*c will be evaluated\
    \ first, with multiplication as precedence over addition. We here use parenthesis\
    \ for a+b to be evaluated first, like (a+b)*c."
