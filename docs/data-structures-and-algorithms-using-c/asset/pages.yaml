- pgno: 72
  md: '# Insertion Operation


    Adding a new node in linked list is a more than one step activity. We shall learn
    this with diagrams here. First, create a node using the same structure and find
    the location where it has to be inserted.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_72_0.png)


    Imagine that we are inserting a node B (NewNode), between A (LeftNode) and C (RightNode).
    Then point B.next to C NewNode.next --> RightNode; It should look like this -


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_72_1.png)


    Now, the next node at the left should point to the new node. LeftNode.next -->
    NewNode;


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_72_2.png)


    This will put the new node in the middle of the two. The new list should look
    like this -


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_72_3.png)


    Similar steps should be taken if the node is being inserted at the beginning of
    the list. While inserting it at the end, the second last node of the list should
    point to the new node and the new node will point to NULL.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Deletion Operation


    Deletion is also a more than one step process. We shall learn with pictorial representation.
    First, locate the target node to be removed, by using searching algorithms.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_0.png)


    (previous) node of the target node now should point to the next node of the target
    node – LeftNode.next -> TargetNode.next;


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_1.png)


    This will remove the link that was pointing to the target node. Now, using the
    following code, we will remove what the target node is pointing at.


    ```

    TargetNode.next -> NULL;

    ```


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_2.png)


    the deleted node. We can keep that in memory otherwise we can simply deallocate
    memory and wipe off the target node completely.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_73_3.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Reverse Operation


    This operation is a thorough one. We need to make the last node to be pointed
    by the head node and reverse the whole linked list.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_74_0.png)


    First, we traverse to the end of the list. It should be pointing to NULL. Now,
    we shall make it point to its previous node –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_74_1.png)


    We have to make sure that the last node is not the lost node. So we’ll have some
    temp node, which looks like the head node pointing to the last node. Now, we shall
    make all left side nodes point to their previous nodes one by one.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_74_2.png)


    Except the node (first node) pointed by the head node, all nodes should point
    to their predecessor, making them their new successor. The first node will point
    to NULL.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_74_3.png)


    We’ll make the head node point to the new first node by using the temp node.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_74_4.png)


    The linked list is now reversed. To see linked list implementation in C programming
    language, please click here.'
