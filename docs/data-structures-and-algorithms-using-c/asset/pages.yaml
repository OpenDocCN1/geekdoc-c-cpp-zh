  md: '# EnqueueOperation


    Queues maintain two data pointers, **front** and **rear**. Therefore, its operations
    are comparatively difficult to implement than that of stacks.


    The following steps should be taken to enqueue (insert) data into a queue – Step
    1 – Check if the queue is full. Step 2 – If the queue is full, produce overflow
    error and exit. Step 3 – If the queue is not full, increment rear pointer to point
    the next empty space. Step 4 – Add data element to the queue location, where the
    rear is pointing. Step 5 – Return success.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_124_0.png)


    # Queue Enqueue


    Sometimes, we also check to see if a queue is initialized or not, to handle any
    unforeseen situations.


    # Algorithm for enqueue Operation


    ```

    procedure enqueue(data) if queue is full return overflow endif

    rear ← rear + 1 queue[rear] ← data return true

    end procedure

    Implementation of enqueue() in C programming language –

    int enqueue(int data) if(isfull())

    return 0;

    rear = rear + 1; queue[rear] = data;

    return 1; end procedure

    ```'
