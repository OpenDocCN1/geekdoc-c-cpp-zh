- pgno: 233
  md: '# 33. AVL Trees Data Structures & Algorithms


    What if the input to binary search tree comes in a sorted (ascending or descending)
    manner? It will then look like this –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_233_0.png)


    It is observed that BST''s worst-case performance is closest to linear search
    algorithms, that is O(n). In real-time data, we cannot predict data pattern and
    their frequencies. So, a need arises to balance out the existing BST.


    Named after their inventor Adelson, Velski & Landis, AVL trees are height balancing
    binary search tree. AVL tree checks the height of the left and the right sub-trees
    and assures that the difference is not more than 1. This difference is called
    the Balance Factor.


    Here we see that the first tree is balanced and the next two trees are not balanced
    –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_233_1.png)


    In the second tree, the left subtree of C has height 2 and the right subtree has
    height 0, so the difference is 2. In the third tree, the right subtree of A has
    height 2 and the left is missing, so it is 0, and the difference is 2 again. AVL
    tree permits difference (balance factor) to be only 1.


    BalanceFactor = height(leftsutree) – height(right-sutree)'
  merge: -1
  img_proc: true
- pgno: 234
