  md: '# Post-orderTraversal


    In this traversal method, the root node is visited last, hence the name. First
    we traverse the left subtree, then the right subtree and finally the root node.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_223_0.png)


    We start from A, and following pre-order traversal, we first visit the left subtree
    B. B is also traversed post-order. The process goes on until all the nodes are
    visited. The output of postorder traversal of this tree will be –


    **D → E → B → F → G → C → A**


    Until all nodes are traversed –


    +   Step 1 – Recursively traverse left subtree. Step 2 – Recursively traverse
    right subtree. Step 3 – Visit root node.


