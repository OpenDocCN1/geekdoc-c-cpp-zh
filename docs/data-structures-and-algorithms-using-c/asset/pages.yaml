  md: '# # Sorting Techniques


    # ## 20. Sorting Algorithm Data Structures & Algorithms


    Sorting refers to arranging data in a particular format. Sorting algorithm specifies
    the way to arrange data in a particular order. Most common orders are in numerical
    or lexicographical order.


    The importance of sorting lies in the fact that data searching can be optimized
    to a very high level, if data is stored in a sorted manner. Sorting is also used
    to represent data in more readable formats. Following are some of the examples
    of sorting in real-life scenarios:


    +   - **Telephone Directory** – The telephone directory stores the telephone numbers
    of people sorted by their names, so that the names can be searched easily.


    +   - **Dictionary** – The dictionary stores words in an alphabetical order so
    that searching of any word becomes easy.'
