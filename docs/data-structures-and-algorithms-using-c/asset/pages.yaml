- pgno: 260
  md: '# Rules


    The mission is to move all the disks to some another tower without violating the
    sequence of arrangement. A few rules to be followed for Tower of Hanoi are – Only
    one disk can be moved among the towers at any given time. Only the “top” disk
    can be removed.


    No large disk can sit over a small disk.


    Following is an animated representation of solving a Tower of Hanoi puzzle with
