- pgno: 221
  md: '# # In-order Traversal


    In this traversal method, the left subtree is visited first, then the root and
    later the right sub-tree. We should always remember that every node may represent
    a subtree itself.


    If a binary tree is traversed **in-order**, the output will produce sorted key
    values in an ascending order.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_221_0.png)


    We start from **A**, and following in-order traversal, we move to its left subtree
    **B**. **B** is also traversed in-order. The process goes on until all the nodes
    are visited. The output of inorder traversal of this tree will be –


    **D → B → E → A → F → C → G**


    # ## Algorithm


    Until all nodes are traversed –


    +   - Step 1 – Recursively traverse left subtree.

    +   - Step 2 – Visit root node.

    +   - Step 3 – Recursively traverse right subtree.'
