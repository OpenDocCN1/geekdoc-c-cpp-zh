- pgno: 235
  md: '# AVL Rotations


    To balance itself, an AVL tree may perform the following four kinds of rotations
    –


    +   - Left rotation

    +   - Right rotation

    +   - Left-Right rotation

    +   - Right-Left rotation


    The first two rotations are single rotations and the next two rotations are double
    rotations. To have an unbalanced tree, we at least need a tree of height 2. With
    this simple tree, let''s understand them one by one.


    # Left Rotation


    If a tree becomes unbalanced, when a node is inserted into the right subtree of
    the right subtree, then we perform a single left rotation –


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_235_0.png)


    In our example, node A has become unbalanced as a node is inserted in the right
    subtree of A''s right subtree. We perform the left rotation by making A the left-subtree
    of B.


    # Right Rotation


    AVL tree may become unbalanced, if a node is inserted in the left subtree of the
    left subtree. The tree then needs a right rotation.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_235_1.png)


    As depicted, the unbalanced node becomes the right child of its left child by
    performing a right rotation.


    # Left-Right Rotation


    Double rotations are slightly complex version of already explained versions of
    rotations. To understand them better, we should take note of each action performed
    while rotation.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Let''s first check how to perform Left-Right rotation. A left-right rotation
    is a combination of left rotation followed by right rotation.


    # State Action


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_236_0.png)


    A node has been inserted into the right subtree of the left subtree. This makes
    C an unbalanced node. These scenarios cause AVL tree to perform left-right rotation.


    We first perform the left rotation on the left subtree of C. This makes A, the
    left subtree of B.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_236_1.png)


    # Right-Left Rotation


    Node C is still unbalanced, however now, it is because of the left-subtree of
    the left-subtree.


    We shall now right-rotate the tree, making B the new root node of this subtree.
    C now becomes the right subtree of its own left subtree.


    The tree is now balanced.


    The second type of double rotation is Right-Left Rotation. It is a combination
    of right rotation followed by left rotation.


    # State Action


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_236_2.png)


    A node has been inserted into the left subtree of the right subtree. This makes
    A, an unbalanced node with balance factor 2.'
  merge: -1
  img_proc: true
