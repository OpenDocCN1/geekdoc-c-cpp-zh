- pgno: 252
  md: '# MaxHeapDeletionAlgorithm


    Let us derive an algorithm to delete from max heap. Deletion in Max (or Min) Heap
    always happens at the root to remove the Maximum (or minimum) value.


    +   **Step 1** – Remove root node.

    +   **Step 2** – Move the last element of last level to root. **Step 3** – Compare
    the value of this child node with its parent. **Step 4** – If value of parent
    is less than child, then swap them.

    +   **Step 5** – Repeat step 3 & 4 until Heap property holds.


    ![](img/30fc9e3f8ee01facfae8d1c9621936b3_252_0.png)'
