  md: '# HowBubbleSortWorks?


    We take an unsorted array for our example. Bubble sort takes O(n²) time so we''re
    keeping it short and precise.


    | 14 | 33 | 27 | 35 | 10 |


    Bubble sort starts with very first two elements, comparing them to check which
    one is greater.


    | 14 | 33 | 27 | 35 | 10 |


    In this case, value 33 is greater than 14, so it is already in sorted locations.
    Next, we compare 33 with 27.


    | 14 | 33 | 27 | 35 | 10 |


    We find that 27 is smaller than 33 and these two values must be swapped.


    | 14 | 33 | 27 | 35 | 10 |


    The new array should look like this –


    | 14 | 27 | 33 | 35 | 10 |


    Next we compare 33 and 35. We find that both are in already sorted positions.


    | 14 | 27 | 33 | 35 | 10 |


    Then we move to the next two values, 35 and 10.


    | 14 | 27 | 33 | 35 | 10 |


    We know then that 10 is smaller 35. Hence they are not sorted.


    | 14 | 27 | 33 | 35 | 10 |


    We swap these values. We find that we have reached the end of the array. After
    one iteration, the array should look like this –


    | 14 | 27 | 33 | 10 | 35 |


    To be precise, we are now showing how an array should look like after each iteration.
    After the second iteration, it should look like this –


    | 14 | 27 | 10 | 33 | 35 |


    Notice that after each iteration, at least one value moves at the end.


    | 14 | 10 | 27 | 33 | 35 |


    And when there’s no swap required, bubble sorts learns'
