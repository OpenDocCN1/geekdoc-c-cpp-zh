  \n# 献词\n\n献给我的母亲 Henrietta Hay，她教会我如何写好文章，并欣赏优秀的文字。\n\n# 献词\n\n*时空任意汇聚点*——想象一下，你爸爸是地球上存在过的最聪明的人，他知道一切可以发现的事，而且对每事都是完全正确的，并且能证明自己对每事都是正确的。现在再想象在百万光年外的某个美妙世界上有另一个小孩，那个孩子的爸爸是到目前为止那个遥远世界上存在过的最聪明的人。他和你爸爸一样聪明，和你爸爸一样正确。两个爸爸都是聪明的，也是正确的。*\n\
  \n*只有当他们相遇时，才会发生一场可怕的争论，因为他们对任何事情都无法达成一致。现在，你说你爸爸是对的，而另一个孩子的爸爸是错的，但宇宙是一个非常大的地方。有足够的空间让许多人在某些事情上都是正确的，却无法达成一致。*\n\
  \n*两个爸爸之所以可能都是的还会发生激烈争斗，是因为正确的方法有很多种。然而，在宇宙中有些地方，每个爸爸都能理解对方在说什么。我们把这些地方称为时空任意汇聚点。chrono（ROH-no）意味着时间。synclastic（sin-tick）意味着向同一侧弯曲，就像橘子皮一样。infundulum（in-fun-D-lum）是古代罗马人如尤利叶·西撒对漏斗的称呼。*\n\
  \nKurt Vonnegut, Jr., 来自《泰坦之炉》，版权所有 1988, Kurt Vonnegut。经 Dell Publishing（Random\
  \ House, Inc. 分公司）许可。\n\n# 前言 关于元数据\n\n二十年前，当我开始担任 `Oracle Corporation` 的顾问时，我学习了一种特定的数据建模方法。在此之前，我已经做了多年的数据库设计，并经常用图表辅助设计。然而，我在\
  \ `Oracle` 学习的这种特定风格非常不同。我第一次对公司的结构——语言进行建模，而不仅仅是数据库结构。组织如何理解自己，我该如何将其呈现出来以便我们讨论需求？\n\
  \n得益于这种方法，我能够进入一个对我几乎没有任何先验知识的公司，并迅速理解该组织的本质和问题——往往比那里的大多数人还要清楚。\n\n我很快意识到，要高效完成工作，重要的不是语法（表示法）的约定，而是语义（含义）的约定。这就是我第一本书《数据模型模式：思维约定》的来源。我发现几乎所有的商业和政府组织——在几乎所有的行业——都共享某些语义结构，理解这些结构使得我能快速理解每个组织独特的语义。\n\
  \n然而，在这个方面尚未得到妥善解决的唯一行业是我们自己的行业——信息技术。至少是因为处理大多数业务的模式对于理解这个行业并没有太大帮助。当业务模型代表业务的语义时，我们需要的是表示语义本身的模型。我们需要用于描述业务的模型的模型。\n\
  \n\n\n\n\n由于许多公司没有数据模型的原因，我们的行业也因为同样的原因没有得到妥善解决：我们尚未看到这种需求。正如对组织数据进行建模的想法对于许多业务人士来说似乎有些过于深奥一样，对信息技术数据进行建模的想法对我们中的许多人来说也显得太奇怪了。但这种需求确实存在。如果一个组织要成功地获取和使用系统来满足客户需求，那么它更好地理解其数据的底层本质（并借此理解自身结构的底层本质）是至关重要的；同理，如果我们要成功地为客户产出信息系统产品，那么理解我们数据的底层本质（并借此理解行业自身结构的底层本质）也是至关重要的。\n\
  \n正如你将看到的，某些语义模式在信息技术领域与在任何其他行业实际上是相同的。最值得注意的是，人和组织是信息技术世界的组成部分，就像它们是任何业务的核心一样。同样，在信息技术世界中定位程序和数据，与在业务世界定位产品和客户并没有太大区别。然而，除了这些主题，书中的模型与典型的商业模型非常不同。业务关注的是产品和流程的建模，而我们的模型关注的是对产品或流程进行`描述的概念`建模。\n\
  \n亚里士多德将他的著作称为“Meta” 物理学，仅仅是因为他在写完关于物理学的著作后写的这一本，而`meta`在希腊语中是“之后”的意思。这本书也可以关于一个“元”模型，仅仅是因为我在创建了多年业务模型之后了它。但它不仅于此。由于亚里士多德形而上学的特殊性质，`meta`一词变成了“之上”或“超越”。由于这个模型的特殊性质，我确定没有人会反对在这种更具宇宙意义的层面使用这个词。\n\
  \n## 关于本书\n\n`metadata`（元数据）中的“data”意味着我们对行业的这一描述将以数据模型的形式表达。这里的概念使用语义数据构造来呈现。但数据并不是该模型的唯一`主体`。本书旨在比之前的努力更具`全面性`，因为它将涵盖我们行业的更多方面。因为这是对元数据的全面观察，因此需要一个对世界的全面观察。本书不仅描述了数据建模的结构，还描述了活动、人、组织、地点、事件和时间以及动机的模型。\n\
  \n是的，你们中熟悉约翰·扎克曼（John Zachman）的企业架构框架的人会认出这些主题。他们他理解信息系统开发世界这一知识体系的方法中，关于“什么、如何、谁、在哪里、何时以及为什么”的列。这些列确实构成了书中章节的基础。\n\
  \n虽然该模型旨在是全面的，但顺便说一下，我敏锐地意识到它可能还不够全面。首先，并不是所有的行都被覆盖了。建模构建者的世界（第五行）需要对每种不同品牌的关系型数据库、编程语言以及处理业务规则和其他领域的新工具进行建模。光是这些模型就需要几本这种大小的书了。因此，从“小处”着手是合理的。\n\
  \n其次，正如书名所示，这些真的只是为元数据建模的模式。这并不是一个“元数据仓库”的全面设计。相反，这个模型是尝试识别必须在此类仓库中存在的最基础且最广泛适用的的概念。我敏锐地意识到一个事实：如果你在特定环境中构建一个仓库，你将在许多领域需要更具体的细节。我唯一的希望是这个模型能让你清楚在何添加这些细节。\n\
  \n除了解决约翰·扎克曼架构框架中的各个列之外，本书还探讨了系统开发过程中不同人员所采取的观点：首席执行官、经营业务的人、信息架构师、设计师、构建者以及系统的用户。通过探讨框架中描述的不同视角，本书应该比之前的努力更`易于理解`。它描述了业务所有者、系统架构师和设计师视角下的元数据——用他们的术语来描述。\n\
  \n由于这里描述的架构框架的每一行都代表一个特定的视角，而描述该行的模型部分是以适用于该视角的语言呈现的，因此业务元数据和技术元数据都被包含在内。每个部分旨在让其目标受众阅读并理解。此外，模型是一小块地呈现的，以确保描述的结构可以被任何受过教育的——即使不精通技术的读者所理解。\n\
  \n本书的主题是控制系统开发和管理的元数据的单一`概念数据模型`（一个`实体关系模型`）。它是一个概念数据模型，因为它是对我们所处业务的统一描述，而不是针对特定数据库的设计。事实上，它根本不是元数据仓库的设计，尽管它确实描述了此类仓库应该包含什么，而且任何设计师在承担此类设计之前，都被建议彻底理解它。从根本上说，这是一个三行模型（Row\
  \ Three model）。这本书本身使用特定的词汇（尽可能接近受过教育的英语）来描述这里包含的概念。然而，所描述的内容之一本身就是词汇这个概念。这意味着所使用的模型本身就是所描述内容的示例。（对于那些尽管作者付尽了努力但仍发现模型意义并非直观易见的人，呈现的所有实体类和属性在文中和书末的词表里都有了定义。）\n\
  \n当一家公司开发其业务的数据模型时，该模型是开发新数据库的有用产品。然而，产生模型本身的工作往往会让参与人员对他们业务的本质产生深刻的见解。这些见解通常代表了企业的直接利益，优于从模型中获得的任何改进系统。它给了他们一个机会去理解他们赖以生存工作的`影响`——对他们的系统、同事以及整个业务的影响。\n\
  \n所以，你拥有的是一个在我们尝试改进组织信息管理时背后主要概念的模型。有趣的是，一旦我们理解了这些概念，过去几十年困扰我们行业的主要争议（例如对象对象与关系型、实体关系图与\
  \ UML 类模型等）就不再那么激烈了。事实证明，人们对任何特定技术变化的价值并没有真正的分歧，只是在竞争者的观点上有分歧。理解了这些视角的差异，争论消失了。\n\
  \n书中的模型展示的正是这些技术变化意味着什么。这个新工具改变了我们编写程序的方式吗？它改变了我们构建（或执行）流程的方式吗？它改变了我们分析需求的方式吗？将技术正确放在框架中有助于理解其意义——实际上，增加了增加了我们有效实施的能力。\n\
  \n\n\n\n\n例如，`UML` 被誉为建模领域的一项伟大创新。确实，它在某些方面的表达能力比以前所见的要强。但重要的是，要理解它真正新颖在哪里，哪些仅仅是可以用其他方式表示的事物的新表示法。书中的模型应当明确区分这种区别。\n\
  \n本书面向数据管理社区——数据管理员、数据库管理员、数据建模师等此类人员。但它对系统开发人员也应该有用，帮助他们更轻松地理解自己所做内容的意义，以及这些内容在宏大蓝图中的位置。它在学术环境中教授上述所有这些人时也应该是很有用的。这可能要求过高，但如果信息技术经理至少了解这些模型的大轮廓，也将具有价值，因为这同样是为了确保他们理解自己所做工作的背景。\n\
  \n这些页面中的模型试图从许多不同的视角展示信息处理世界。如果运气的话，也许我们真的拥有一个“时空同步漏斗”（chrono-synclastic infundibula）。\n\
  \n## 致谢\n\n我必须首先对 Allan Kolber 表示感谢，他不仅在整个过程中鼓励我，还对 `Zachman Framework` 提供了非常有价值的见解，特别是对\
  \ `Business Owner’s View`（业务所有者视角）真实含义。我仍然保留在细节上与他持不同意见的权利，但他的见解对本书至关重要。\n\n当然，还要感谢我的\
  \ `Business Rules Group` 同事，他们为业务规则和 `Architecture Framework` 的孵化提供了一个极好的平台。他们成为\
  \ `Business Rules Team` 合作者是向前迈出的重要一步，我感谢《业务词汇与业务规则的语义》（Semantics of Business Vocabulary\
  \ and Business Rules）的出版。我诚心希望本书是对那项工作的恰当补充。特别是 Cheryl Estep，花了许多时间帮助澄清我的工作在哪些地方与\
  \ `Business Rule Team` 的努力产生了分歧。\n\n请注意，我大量借鉴了 `BRT` 早期草稿。虽然我想对成员的贡献表示感谢，但任何解释上的错误或与最终定稿的偏差完全由我负责。\n\
  \n还必须感谢 Bob Seiner 多年来忠实地出版了《数据管理简报》（[`www.tdan.com`](http://www.tdan.com)）。除了为世界提供了一个关于所有数据管理事务的绝佳知识来源外，它还为我提供了一个极佳的平台，用于探索最终导致本书的理念。\n\
  \n感谢 Meiler Page-Jones，他写下了我发现的关于对象设计的最好的书籍 [Page-Jones 2000]`。它足够清晰，可以作为我对象方向模型的基础。\n\
  \n从 ANSI 到 John Zachman，我一直对我书单中的所有作者（以及其他人）怀感激，他们为我在这里所做的任何事情形成了智力基础。\n\n我很幸能够向各种组织展示这一模型。我特别想要感谢德克萨斯建模与用户小组，特别感谢\
  \ Lee Leclair 提供的富有见解的评论。还要感谢加拿大信息资源管理协会的款待；特别是 Dorothy Russel、Kerel Vitrofsky 和\
  \ Deborah Henderson 的意见非常有帮助。也感谢来自波士顿和罗彻斯特 `DAMA` 分会的意见。在伦敦参加 `Metadata 2005 Conference`\
  \ 的人员也帮助帮助我指出了模型中一些剩余的错误。\n\n如果没有我在 Morgan Kaufmann 的拥护人 Diane Cerra 以及整合这一切的项目经理/编辑\
  \ Marilyn E. Rash 的帮助，这一切将是不可能的。此外，由于所有慷慨花时间审阅手稿内容的人的建议，书籍的质量得到了极大提升：James Bean,\
  \ Charles Betz, Malcolm Chisolm, Michael Eulenberg, Dagna Gaythorpe, Terry Halpin,\
  \ Mike Lynott, Dave McComb, Ken Orr 和 Graeme Simseon。\n\n当然，一如既往，感谢我的妻子 Jola，以及\
  \ Pamela 和 Bob 的陪伴。\n\n## 前言\n\n马塞尔·普鲁斯特（Marcel Proust）曾写道，真正的发现之旅不在于寻找新的风景，而在于拥有新的眼光。在信息系统领域，景观的一部分变化如此迅速，以至于我们很容易忽视从新鲜视角中可以发现的价值。这对于系统规范尤为如此，这里的进步更多来自于新想法而非新技术。\n\
  \n系统规范传统上根据其过程进行讨论。初学者学习阶段和任务；辩论集中在不同方法论的优缺点上。然而，信息系统专家很久以前就知道，虽然过程分析可能是理解业务最明显的方法，但它不是唯一的方法。观察数据——关注*是什么*（what）而不是*如何做*（how）——不仅补充了过程视角，而且可能产生更深入、更简洁、更稳定的描述。数据建模师经常获得过程建模师会遗漏的洞察。\n\
  \n在书中，Dave Hay 将专家数据建模师的视角引入了系统规范业务。他的起点是 `Zachman Framework for Enterprise Architecture`（企业架构\
  \ Zachman 框架），该框架本身的长寿至少部分归功于对产物而非活动的关注。\n\n本书从对 `Framework` 的一些见见且实用的调整开始。在二十多年后，反思型用户应该会有一些改进建议，这并不意外；如果纯主义者将这些变化视为对\
  \ `Framework` 持续适用性和适应性的确认，那将是令人失望的。随后，Dave 详细介绍了每个相关单元格中使用的信息的结构。根据他数据建模的哲学，他寻求描述而非规定，阐明已有的方法而非提出自己的方法。\n\
  \n结果是构成信息系统规范的全面蓝图，从业务需求到逻辑设计。Dave 将其称为“IT 行业的企业数据模型”——对系统专业人员完成工作所需的数据描述。无论我们使用什么方法论，无论我们是记录数据还是非正式地传递数据，这些都是我们需要的内容。对于\
  \ Zachman Framework 的用户来说，这里的信息提供了一个清晰的“下一层”。对于普通的信息系统从业者、学生和学者来说，它提供了一个即使在方法和技术变化时也可能具有持续价值的视角。\n\
  \n本书的语言是数据建模——这是它的特别优势之一。使用数据模型，而非依赖文本和示例，提供了该领域许多其他工作所缺乏的完整性和严谨性。Dave 作为一名在职数据建模师的背景，在模型的内容和呈现中，以及他用于说明模型的示例中是显而易见的。读过他早期关于数据模型模式和系统规范书籍的读者将知道，他为这项任务带来了学科领域知识和数据建模专业知识的独特结合。\n\
  \n因此，阅读这本书不仅是为了获得对系统规范的“新眼光”，更是为了看到专家建模师如何使用数据建模语言来表示和交流复杂而重要的领域。\n\nGraeme Simsion,\
  \ Simsion & Associates 以及墨尔本大学\n\n1\n\n关于元数据模型\n\n*曾经有一个叫 Corey 的家伙*\n\n*他的职业生涯未曾光辉*\n\
  \n*由于他有了糟糕的一天*\n\n*因为他就是说不出*\n\n\n\n\n元数据仓库。\n\n# 什么是元数据？\n\n在 20 世纪 90 年代，`data\
  \ warehouse`的概念席卷了整个信息技术行业。在经历了多年的尝试后，公司似乎终于能够将其所有数据存储在一个地方，用于报告和分析。实现这一点的技术仍然很新，初期的尝试结果参差不齐，但这种努力是非常严肃的。\n\
  \n这一努力过程中产生的问题之一是：人们意识到，如果高级管理人员要向一个巨大的数据库提问，就必须知道数据库中究竟包含什么，以及应该提什么类型的问题。因此，除了数据本身之外，还需要保留关于数据的数据。20\
  \ 世纪 90 年代为这种“关于数据的数据”创造的术语是`元数据`（metadata）。\n\n从那时起，关于主题出版了大量的书籍和杂志文章，但大多数都集中在为什么元数据很重要，以及管理元数据的技术和方法上。这些出版物遗漏的是对这些东西究竟*是什么*的清晰描述。十年过去了，仍然没有一种简单、清晰的元数据描述，它既足够全面以涵盖我们的行业，又易于人们理解和使用。本书试图产生这样一种描述。\n\
  \n与所有的流行术语一样，元数据这个术语一旦发明就有了了自己的生命力。它被各种描述为：\n\n• `关于组织数据资源的任何数据` [[Brackett 2000],\
  \ [p. 149]]。\n\n• `组织内外的所有物理数据和知识，包括关于物理数据的信息、技术和业务流程、数据的规则和约束，以及公司所使用的数据结构` [[Marco\
  \ 2000], [p. 5]]。\n\n• `对实例数据的详细描述。已填充实例数据的格式和特征：实例和值，取决于元数据接收者的角色` [[Tannenbaum\
  \ 2002], [p. 93]]。\n\n从这些定义中得出了几个重要的点。首先，正如 Marco 先生指出的，`业务元数据`（business metadata）和`技术元数据`（technical\
  \ metadata）之间存在区别。元数据的业务用户感兴趣的是语言的定义和结构，作为所检索信息类型的术语。技术人员则关注用于存储和管理数据的物理技术。这两个观点都是重要的，并且必须同时解决。\n\
  \n其次，该主题涉及的不是数据。正如 Brackett 先生所说，它是“关于组织数据资源的*任何*数据”。一旦你开始观察组织的数据结构，你就必须也要考虑其活动、人员、组织、地点、时间、事件以及动机。\n\
  \n第三，正如 Tannenbaum 女士指出的，问题的“元”（meta）维度是一个观点问题。相对于业务收集的数据，存在元数据。还有`元元数据`（meta-metadata），用于理解和管理元数据。\n\
  \n最后一点在[图 1-1]中得到了说明。在这里，底部显示了信息系统中经常被描述的世界中的事物。“朱莉娅·罗伯茨”（Julia Roberts）是一个真实的人。银行的“华街分行”是开展业务的物理场所。储蓄账户“09743569”是特定客户（例如朱莉娅·罗伯茨）在该银行的一个特定账户。该账户的客户可能会在特定时间执行实际的“ATM\
  \ 取款”。\n\n![image](img/B9780120887989500024_f01-01-9780120887989.jpg)\n\n图 1-1 数据与元数据。\n\
  \n再上一行在前三列中显示了可能描述这三件事的数据：(1) 客户的名字为“朱莉娅·罗伯茨”，“出生日期”为“10/28/67”。(2) 分行的地址为“华街 111\
  \ 号”，经理是“Sam Sneed”。(3) 储蓄账户的账号为“09743569”，每月费用为“$4.50”。在第四列中，从底部起的第一行显示一个特定的程序（在此称为“Java\
  \ 代码”）负责“取款交易”。这些是管理银行业务数据的人员所关心的事项。注意，每个术语都被描述为它们是什么：客户名、分行经理、账号等。\n\n从倒数第三行收集了这些描述符并依次对它们进行标记。这是为了创建我们数据管理领域所说的`元数据`。这些标签包含两个部分。首先是业务数据所描述的重要事物的名称，例如实体类\
  \ `Customer`（客户）和 `Branch`（分行）。其次，这些每个项又由属性描述，例如“姓名”、“地址”和“出生日期”。在银行分行的案例中，我们还发现实际上还有一个实体类\
  \ `Manager`（经理），并且与 `Branch` 相关（“每个分行必须恰好由一名员工管理。”）。\n\n在储蓄账户列中，我们看到储蓄账户实际上是数据库中一个表的主体。该表名为\
  \ `CHECKING_ACCOUNT`，具有 `Account_number`（账号）和 `Monthly_charge`（每月费用）列。第二行中简单描述为“Java\
  \ 代码”的 ATM 程序实际上是语言 `Java` 中名为 `ATM Controller`（ATM 控制器）的程序模块。正如我们看到的，元数据行本身包含了几种不同对象（`实体类`、`属性`、`表`、`列`、`程序模块`和`语言`）。顶行代表的元数据行的任务是展示这些对象是如何相互关联的。\n\
  \n\n\n\n当然，要意识到即使是业务数据和元数据之间的界限也不像看起来那样清晰。例如，`PRODUCT TYPE`（产品类型）关于约束业务模型中许多属性的引用数据。尽管如此，产品类型列表的规范仍然属于业务领域，而不是数据管理员。它既扮演了业务数据又是元数据的角色。可能更属于元数据管理人员领域的是\
  \ `PRODUCT CATEGORY`（产品类别）。这类应该相对少，且列表应该相对稳定。\n\n## 寻找元数据\n\n`Metadata repository`（元数据仓库）是一个辞藻过大的术语，其实无非一个包含元数据的计算机数据库，用于支持企业大部分系统的开发、维护和运行。除其他外，这样的仓库可以作为数据仓库的基础。\n\
  \n在过去的三十多年里，这一构想被以许多不同的方式进行解释。第一批元数据仓库是 20 世纪 70 年代和 80 年代程序中的 `data dictionaries`（数据字典）和\
  \ `copy libraries`（拷贝库）。`data dictionary` 只是传统大型机数据处理应用程序文件中特定类型记录所包含字段的列表。`Sometimes`\
  \ 这还会伴随着对每个文件和字段含义的定义。`copy library` 是一个包含数据定义部分的文件，供多个程序使用（通常是 `COBOL` 程序，但其他语言也使用拷贝库）。特定的程序随后将利用\
  \ `copy library` 获取它们的数据规格。。这很少伴随着对程序代码中每个术语的定义。\n\n自 20 世纪 80 年代以来，`computer-aided\
  \ systems engineering`（CASE，计算机辅助软件工程）工具一直在记录它们组织中创建和管理的结构描述，某些 `CASE` 工具厂商提供了他们自己的底层数据结构模型（通常这些是作为数据和功能模型及其背后文档捕获的数据和活动模型）。即使是现在，需求分析期间收集的业务信息通常也是任何开发项目中捕获的元数据的第一个组件。\n\
  \n思路类似，“百科全书”被开发以支持其他类型的工具，例如 `extraction, transfer, and load`（ETL，提取、转换和加载）设施。在世纪世纪\
  \ 80 年代和 90 年代初，IBM 花了巨大的精力开发了一种名为 `Repository Manager MVS` (`RM/MVS`) 的通用元数据管理工具。该工具是\
  \ IBM 作为 `CASE` 运动一部分开发的 `AD/Cycle` 工具活动的核心。IBM 与多个 `CASE` 合作伙伴和其他组织合作，试图为从规划到运行的所有应用开发构建一个通用的、端到端的元数据管理体系。\n\
  \n各种软件供应商都尝试过改进 `CASE` 工具之间的通信，这要求它们对元数据的内部结构进行建模。然而，这种结构通常是专有的，这些厂商没有动力发布他们的版本。近年来，随着数据仓库运动的兴起，关于元数据仓库的文献大量增多。有大量的书籍和杂志文章描述了元数据的重要性以及它们对\
  \ 21 世纪运营的企业的意义。\n\nTannenbaum 女士、Brackett 先生和 Marco 先生的原始著作（在本章前文中已提到）包含了前述引用的定义，并且是目前关于元数据及其对现代商业意义这一主题最完善的资源。但尽管它们描述了元数据的重要性和影响，但它们对元数据仓库中应该包含什么内容的描述并没有呈现出一个完整的模型。\n\
  \nTannenbaum 女士确实提供了一份分类应包含内容的列表 [Tannenbaum 2002]，但她并没有尝试对这些进行建模。Marco 先生在他 2000\
  \ 年的书中提出了一个简单的模型，但即使他也承认这只是一个起点。他的最新书籍 [Marco and Jennings 2004] 是一个更好的数据仓库设计实用元模型改进版本，但尽管如此，它遗漏了许多可以包含的内容：它还没有远到能够解决我们整个行业的底层结构问题。\n\
  \n20 世纪 90 年代，几家公司提供了元数据仓库产品，每个产品都由一个空数据库和操作此类数据库可能包含的元数据的工具组成。然而，这些产品只描述了部分所需的信息——很大程度上只是表和列结构，以及跟踪更新历史的能力。\n\
  \n元数据联盟 (`MDC`) 曾尝试开发一个更全面的元数据模型，并在 1999 年发表了它的模型 `Object Information Model`（对象信息模型）。然而，它是非常复杂且抽象的，非常难以理解。`MDC`\
  \ 此后被并入对象管理小组 (`OMG`)，合并后的组织现在发布了 `Common Warehouse Metamodel` (`CWM$，通用仓库元数据模型）和\
  \ `Meta Object Facility` (`MOF$，元对象设施)。John Poole 和他的同事在 `Common Warehouse Metamodel`\
  \ [Poole et al. 2002] 中描述了这些。更详细的描述可以在 OMG 网站 `http://www.omg.org/cwm/` 上找到。\n\n\
  `CWM` 旨在成为业务元数据模型，而 `MOF` 旨在成为元数据的元数据模型。虽然比 `MDC` 模型好得多，但这两个模型都存在在面向对象的设计环境中开发的缺陷，并且侧于适用于定义设计而非显示概念本身的元素。这两个模型对于那些只想查看业务规则、实体类及关系或功能层次的人来说，并不容易理解。那么，这一切给我们留下了什么？我们应该在元数据仓库中包含什么？\n\
  \n## 架构框架 ^*\n\n由于这里介绍的模型旨在代表整个信息管理行业，因此需要一个 `Architecture Framework` 来组织知识体系。这里使用的架构框架基于\
  \ John Zachman 1987 年和 1992 年的 `Enterprise Architecture Framework` [Zachman 1987;\
  \ Sowa and Zachman 1992]。\n\n`Zachman Framework` 由一个矩阵组成，行代表不同的人对信息技术项目的视角，列代表他们从每个视角看到的内容。后者包括数据、活动、动机等等。（这里使用的架构框架关注同一个矩阵，但在行的定义上与\
  \ Zachman 先生的版本略有不同。）事实证明，我们对信息系统想知道的一切都在这个矩阵的一个或多个单元格中，而这些单元格集合为组织本书提供了一个非常有用的基础。这里介绍的模型每个部分描述了一个或多个单元格的内容。在本引言章节之后，每一章将处理一列。\n\
  \n\n\n\n\n架构框架如图图 1-2 所示。框架中的行代表了系统开发过程中不同参与者的视角，而列代表了从每个视角观察的事物。尽管这些概念是相同的，但某些行的名称与\
  \ Zachman 先生在其原始论文使用的名称有所不同。\n\n![image](img/B9780120887989500024_f01-02-9780120887989.jpg)\n\
  \n图 1-2 架构框架。\n\n### 行\n\n框架中的每一行 `row` 都代表了系统开发过程中某一类参与者的视角，而每一列则代表了该过程的不同方面。这些视角包括：\n\
  \n-   `范围`（`规划者视角`）：这定义了企业的方向和业务目的。这对于为任何系统开发工作建立背景是是必要的。它包含了对系统或其他项目边界的定义。\n- \
  \  `业务模型`（`业务所有者视角`）：这从业务术语的角度定义了业务的本质，包括其结构、流程、组织等。通常，一个特定的企业会有多个业务所有者视角，这些视角可能会重叠甚至相互矛盾。这些业务所有者的视角可以分为两类。\n\
  \n![image](img/x25CB.gif) `业务当前实体状况的视图：` 业务中的大多数人关注的是按照目前存在的方式开展业务所需的特定组织、计算机系统、表单和程序。这种世界观构成了美国国家标准协会在\
  \ 1975 年所说的“外部模式” [ANSI 1975]。\n\n![image](img/x25CB.gif) `对业务底层本质的单一视图：` 每个业务所有者所看到的单个事物通常是更具通用性和更基础的事物的示例。这种视角是相对抽象的，尽管它尚未被结构化以作为设计计算机系统的基础。这是业务“概念性”模式（模型）的开始\
  \ [ANSI 1975]。\n\n这一行的本质在于它捕捉了组织的 `semantics`（语义）。也就是说，这一行是关于业务所有者视角下看到的业务词汇。\n\n\
  -   `基本概念模型`（`架构师视角`）：这一视角将第二行中的底层结构以一种更严谨的方式呈现出来，完善了业务的概念模型。这仍然没有参考任何特定的技术。\n\n\
  例如，业务所有者对业务规则的视角涵盖了可能施加于业务的所有约束，而架构师视角仅关注影响数据更新或执行此类更新过程的约束。业务所有者的数据视角可以包含多对多关系、三个或更多实体类之间的关系（`n\
  \ 元关系`）以及 `multi-valued attributes`（多值属性）。^*。架构师视角消除了所有这些。\n\nZachman 先生最初将此称为“信息设计者视角”，因为它在使结构适用于自动化方面发挥了作用。然而，`designer`（设计师）一词带有将技术应用于问题解决方案的含义，尽管这一行实际上仅仅代表了尽可能严谨地描述企业的最终阶段。建筑项目的建筑师负责描述其结构，重点在于设计而非技术。出于这个原因，将其称为“架构师视角”似乎更为合适。\n\
  \n-   `技术模型`（`设计者视角`）：这描述了如何使用技术来解决上述行中所确定的信息处理需求。在这里，选择了对象型数据库而非关系型数据库（或反之），选择了编程语言类型（第三代或第四代、面向对象等等），定义了程序结构，指定了用户界面等。\n\
  \n前三个视角是业务的视角。这是第一个关于信息技术的视角。\n\nANSI 的数据视图将其称为“逻辑”模式 [ANSI 1975]，但在多年后的以后，它变为了“物理模型”的名称。事实上，即使是\
  \ Zachman 先生也将这一视角称为“构建者视角”。这很遗憾，因为下一行似乎才更符合“构建者”和所有“物理”事物的领域。这第四行是关于新构件的 `design`（设计），而不是它们的\
  \ `construction`（构建）。\n\n-   `详细表示`（`构建者视角`）：构建者看到了特定语言的细节、数据库存储规范、网络等。这就是 ANSI\
  \ 所说的“物理”模式 [ANSI 1975]。\n\nZachman 先生将此称为“分包商视角”。\n\n-   `运行中的系统`（`清单视角`）：最后，以新系统的形式向组织呈现了一个新视角。这是安装在特定位置的实际计算机系统及其数据库的视角。来自第四行的单一系统设计可能实现在许多系统中。\n\
  \n### 列\n\n架构框架中的每一列 `column` 代表了每个视角感兴趣的领域。列描述了开发的维度。这些是：\n\n-   `数据`：该列的每一行都处理企业关注的、需要存储信息的事物。在第一行中，它是关于企业处理的对象。在第二行中，它是关于所使用的语言——术语、事实和定义；在第三行中，它是关于具体定义的实体类及其相互关系。第四行关注计算机软件和数据库管理系统对数据的表示。这可以是表和列、对象类或其他任何系统开发方法的产物来表示。在第五行中，它是关于使用特定数据管理技术在计算机上物理存储的方式。这一行通过表空间、磁盘驱动柱等进行描述。第六行是关于数据库的物理清单。\n\
  -   `活动`：第二列的行关注企业为了支持自身所做的事情。在第一行中，这些是业务整体功能。在第二行中，这些是执行这些功能的物理流程。在第三行中，它们是第二行流程的核心活动。第四行关注程序的运行，第五行视角关注编程语言的细节。第六行是关于程序代码的物理清单。\n\
  -   `位置`：这一列关注运营的地理分布及其元素如何相互通信。在第一行中，它关注企业运营区域。在第二行中，它专门关注企业的各个办公室及其相互关系。在第三行中，它关注每个位置扮演的角色，以及如何与其他位置进行通信。第四行关注计算机网络和通信的设计，而第五行关注通信网络的协议和特定组件。第六行是关于网络中每个节点的物理组件和位置，以及连接它们的通信设施。\n\
  \n\n\n\n\n- **人员**：这一列描述了谁参与了业务以及技术的引入和管理。第一行涉及企业对人力资源管理的态度和哲学。第二行专门关注人员对语言、流程等第二行产物的责任。第三行涉及对定义和架构的管理责任（stewardship）。第四行关注人机界面的设计，包括安全和访问问题，而第五行（结合“活动”列）则涉及这些界面的编程。第六行关于受过培训的人员在安全高效的环境中与系统进行交互。\n\
  - **时间**：这一列描述了时间对企业的影响。这包括第一行的年度规划、第二行的业务事件以及第三行的数据相关事件。第四行将数据相关事件转换为系统触发器。第五行涉及这些触发器的实现。第六行关于对实际事件的跟踪。\n\
  - **动机**：正如扎赫曼先生（Mr. Zachman）最初描述这一列时那样，它涉及将业务目标和策略转化为具体的终和手段。从以后，这已扩展到适用于企业努力的全套约束条件（业务规则），因为正是这些约束决定了人们为何行事所为。第一行关注企业的愿景和使命。第二行处理其目标、目的、策略和战术，并将它们转变为业务政策和业务规则。第三行处理系统约束对数据影响的特定表述。第四行关于设计实现这些影响（以及应用于活动的约束）的程序，而第五行关于这些程序的构建。第六行是实现规则的程序集合（包括数据库管理系统）。\n\
  \n## 元模型与框架\n\n因此，框架中的每个单元格都包含了从从特定视角对企业某个层面的描述。通常情况下，这种描述以一个或多个模型的形式呈现，尽管大多数第一行的产物仅仅是列表。对这些描述（模型或列表）的描述就是元数据。那么，本书的主体模型，就是对这些描述的模型。\n\
  \n本书按列组织结构，但底层模型是按行组织的。也就是说，每个视角都会产生一个涵盖该行内所有框架单元格（行/列交汇点）的模型。在介绍某个单元格时，模型中的概念将作为“属于”该列中的该单元格而被引入，但它几乎总会在同一行其他列单元格概念的语文中进行展示。\n\
  \n由于列之间存在重叠，按顺序介绍它们会有些棘手。在某些情况下，必须在介绍其所属的列之前先引入概念。这需要耐心。\n\n在大多数情况下，行之间没有相同程度的重叠。大多数概念只属于一个视角。然而，例外也是。首先，第二行的数据列涉及\
  \ `BUSINESS CONCEPT`（业务概念）的概念。在第三行中，`ENTITY CLASS`（实体类）和 `ATTRIBUTE`（属性）被作为 `BUSINESS\
  \ CONCEPT` 的子类型（示例）。还有其他一些行间重叠的情况。但更常见的是，在每一列中，实体类的示例简单连接了来自不同行的概念（例如第三行描述的属性与第四行列之间的\
  \ `ATTRIBUTE COLUMN MAPPING`）。\n\n本书介绍的模型本身就是数据列的一个产物，其中涉及的“企业”是指参与信息系统开发、维护和运行的人员集合。它是外部业务所有者视图（Business\
  \ Owner’s View）与概念架构师视图（Architect’s View）的交叉体。它首先是一个架构师的概念模型，因为它遵循所有数据建模的规范化学科，并完全以二值关系表示。除此之外，这涉及到解决多对多的关系。它还是一个连贯、统一的视图——整个元数据管理元素的单一模型。\n\
  \n然而，该模型也类似于业务所有者视图，因为它完全使用元数据管理器和系统开发者的语言。它极少使用这些术语的抽象，并且在需要抽象时，会解释其原理（和结果）。该模型提供了一套讨论元数据的词汇，该词汇的术语在正文和书末的附表中均有定义。\n\
  \n本书的模型旨在描述架构框架第二行到第四行所有列的元数据。也就是说，它展示了每一列中不同部分的图表，这些部分按顺序反映了业务所有者视图、架构师视图和设计者视图。此外，它将涵盖数据、活动、位置和动机列的第六行（运行中的系统）。为了建立上下文，偶尔会引用其他行的模型。\n\
  \n这一切都说明框架的单元格并不是整齐划的。在某些情况下，行之间的差异无非模型的内容。在另一些情况下，列的元模型利用了来自同一列其他视角的元素。在另一些示例中，图可能会描述来自多个一个列的元素。具体而言，模型的组织方式如下节所示。\n\
  \n### 数据\n\n数据由以下部分组成：\n\n- **第二行**关注业务语言。它处理概念、事实、词汇和符号。模型的这部分源自业务规则团队联合对象管理小组\
  \ [`BRT 2005`]的开创性工作。\n- **第三行**关于实体关系模型（“概念性”数据模型）。也就是说，它关注实体类、属性和关系，用严谨的术语描述对业务具有重要意义的事物。这些实际上是第二行中表述的概念的子类型。\n\
  - **第四行**描述了用于特定技术的数据结构。在前三行中，描述的是业务的本质，而在第四行中，模型是设计产物——关系型数据库表、面向对象的设计类等。这一行中的表或类在从上上与第三行中出现的实体类不同。所选择的技术会影响该行的元模型。关系型数据库设计模型与面向对象的类模型是不同的。注意，建模符号\
  \ `UML` 原意是作为在第四行中建模面向对象设计的方法。`UML 类图` 中的某些符号也可以用于创建第三行的实体关系图，这并没有改变第三行模型的含义在根本上不同于第四行模型的事实。\n\
  - **第六行**描述构成真实数据库的表和列的实际实例。\n\n# 活动\n\n活动由以下部分组成：\n\n- **第二行**描述业务的功能（在功能层次结构中，不考虑时间或机制）以及执行这些功能的特定业务流程（带有机制、参与者和时间要求）。\n\
  - **第三行**对具有顺序和时间的关键系统过程进行建模，但不包含机制。最重要的是，`essential data flow diagram`（关键数据流图）模拟了数据从一个过程传递到另一个过程的方式以及每个过程执行的转换。\n\
  \n\n\n\n\n- `Row Four` 根据所采用的技术描述计算机处理过程。在这里，你将看到对程序模块、其结构以及它们使用和产生的数据引用。\n- `Row\
  \ Six` 关于实际程序模块的清单及其运行日志。\n\n## 位置 (Locations)\n\n位置由以下部分组成：\n\n- `All rows`：此模型利用了地理位置业务模型，但将那里的相关概念链接到框架中每一行的元模型（metamodel）概念。在元数据世界中，我们关注活动发生在哪里、数据在何处捕获和分类等，就像在业务模型中我们关注人们居住在哪里、设施位于何处以及生产在哪里一样。行之间的区别取决于每个位置中对象的类型。\n\
  \n## 人员与组织 (People and Organizations)\n\n人员和组织由以下部分组成：\n\n- `All rows`：同样，元级别的人员和组织模型大量使用了业务级别的概念。在仓库中，我们希望记录谁负责实体类或程序模块，就像在业务中我们想知道谁负责产品或合同一样。同样，层级之间的唯一区别在于每个人或每个组织负责的内容。\n\
  \n## 时间 (Timing)\n\n时序由以下部分组成：\n\n- `Rows Two and Three` 都关注`状态转换图`(state-transition\
  \ diagram)——展示了实体类（或业务概念）可以经历的状态以及触发这些状态变化的事件。在 Row Three 中，我们增加了对`实体生命历史`(entity\
  \ life history)的引用，并重新审视了`基本数据流图`(essential data flow diagram)。\n- `Row Four` 有它自己的模型，描述了程序元素的触发器。\n\
  \n## 动机 (Motivation)\n\n动机包括：\n\n- `Rows One and Two` 是业务运行中的`动机`(motivation)模型。Row\
  \ One 描述了企业的`愿景`(vision)和`使命`(mission)，而 Row Two 关注`目标、目的、策略、战术、业务策略`以及`业务规则`(business\
  \ rules)。请注意，业务目标可能包括对新系统的业务需求。\n- `Row Three` 是数据的`约束`(constraints)模型，包括域。业务规则被翻译对属性值、关系存在性和实体类实例存在性的约束。这些约束反过来可以作为系统需求的依据。\n\
  - `Row Four` 是程序模块如何实现 Row Three 中定义的系统需求的模型。这包括通常由数据库管理系统管理的引用完整性和唯一性约束，以及必须由存储过程和其他程序实现的其他约束。\n\
  - `Row Six` 关于真实数据库中数据质量控制程序的执行。\n\n## 记法：对象与实体类 (THE NOTATION: OBJECT AND ENTITY\
  \ CLASSES)\n\n元数据仓库模型是数据体结构的图形化表示。因此，它可以使用任何描述数据结构的技术来表示。这些包括各种形式的实体关系建模、信息工程、UML\
  \ 等。在进入元模型的细节之前，值得探讨记法的问题。由于呈现的元数据实际上是数据，让我们深入架构框架的“数据”列，以探索数据模型背后的概念。\n\n### 类模型\
  \ (Class Model (UML))\n\nUML 正成为一种表示数据模型的流行记法。在 UML 类图中，我们可以将`对象类`(object class)\
  \ 表示为业务对象的定义——组织对某个具有重要意义并希望对其捕获信息的实体。图 1-3 中的 UML 类图展示了我们可能为描述销售业务准备的模型示例。方框（`Customer`、`SalesOrder`、`LineItem`\
  \ 和 `ProductType`）代表对象类；即对业务具有重要意义且业务希望持有信息的实体。\n\n![image](img/B9780120887989500024_f01-03-0780120887989.jpg)\n\
  \n图 1-3 一个 UML 类图。\n\n在每个对象类框内列出了`attributes`(属性），描述了要关于每个对象类捕获的信息。例如，`Customer`\
  \ 由`Name`、`Shipping address`配送地址）和`Billing address`账单地址）描述。对于`Customer` 的每个实例，每个属性必须至少有一个值，但不能超过一个，如\
  \ `[1..1]` 所示。这些每一个数据类型都是 `string`，意味着其值是一段文本。注意，对象类 `ProductType` 的`Description`(描述）和`Unit\
  \ cost`（单元成本）都用标识符 `[0..1]` 显示，这意味着如果合适，`ProductType` 的实例在这两个属性上的任何一个都没有值。\n\n注意，通常对象类之间是成对关联的，如它们之间的线所示。连接两个方框的线意味着一个对象类的实例以某种方式与另一个对象类的实例相关。关系名称的设计是为了在每个方向上读取，例如，“每个\
  \ Customer 可能是一个或多个 SalesOrders 中的买家”，以及“每个 SalesOrder 必须来自且仅来自一个 Customer”。\n\n\
  在书中，为了清晰起见，对关系名称应用了 UML 实践者通常不遵循的约定。每个角色名称都被设计成一个结构化句子的一部分，以准确地传达可选性（optionality）和基数（cardinality）约束。\n\
  \n![image](img/B9780120887989500024_u01-01-9780120887989.jpg)\n\n![image](img/B9780120887989500024_u01-02-9780120887989.jpg)\n\
  \n例如，每个角色可以读作：“每个 Customer 可能是一个或多个 SalesOrders 中的买家”，以及“每个 SalesOrder 必须来自且仅来自一个\
  \ Customer”。\n\n在介绍之后，让我们开始建模我们将使用的语言。图 1-4 显示了语言对象的开始。在这个模型中，`ObjectClass` 本身是一个对象类的示例，`Attribute`\
  \ 也是。\n\n![image](img/B9780120887989500024_f01-04-9780120887989.jpg)\n\n图 1-4 对象类。\n\
  \n`attribute`(属性) 是关于对象类的某些信息的定义。在 UML 图中，属性显示在每个对象类框内部。由于 `ObjectClass` 在此模型中本身也是一个对象类，它有属性——至少有一个（即\
  \ `Name`）。这在图 1-4 中所示，并包含了属性可以包含的数据类型——在这种情况下为 `string`。此外，`Name` 旁边的[1..1]` 意味着它是强制性的，且其值不能超过一个。也就是说，对于\
  \ `ObjectClass` 的每个实例，`Name` 必须恰有一个值。\n\n由于它是我们感兴趣的事物，`Attribute` 也是图中对象类的示例。`Attribute`\
  \ 也有属性，包括它的 `Name`，以及它的 `Data Type`数据类型、`Maximum Length`最大长度、`Average Length`平均长度、`number\
  \ of Decimal places`小数位数和`Optionality`可选性。再次，`Name` 是强制性的，`Optionality` 也是，但其他属性对于每个实例可能有零或一个值——它们是可选的。这通过强制属性旁边的\
  \ `[1..1]` 和可选属性旁边的 `[0..1]` 显示出来。由于我们是在关系环境中构建概念业务模型，在实践中，每个属性被限制为不能超过一个值，如注释中的\
  \ `[..1]` 部分所示。UML 允许放松该约束并允许每个属性实例具有多个值，但你的的作者并不这样做。\n\n\n\n\n\n如果将图 1-4 中的模型转换为关系数据库设计，你将拥有一个名为\
  \ `ObjectClass` 的表，而实例将（如表 1-1 所示）以 `ObjectClass` 和 `Attribute` 的名称显示。你还将拥有名为 `Attributes`\
  \ 的表（在表 1-1 中所示）。`Attributes` 表的列包括 `Name`（来自 `ObjectClass` 表）、`Name`、`Data Type`、`Maximum\
  \ Length` 等。\n\n#### 表 1-1\n对象类和属性。\n\n![image](img/B9780120887989500024_cetable1.png)\n\
  \n对象类之间可以相互关联。正如我们之前看到的，`association` 在 UML 中通过对象类之间的带注释线进行图形化表示。\n\n关联的每个部分（向一个方向）都是\
  \ `role`。`Role` 随后是我们元模型中的另一个对象类，如图 1-5 所示。`Role` 的一个属性是 `Cardinality`，它是与扮演角色的类的实例相关的关联类实例的最大数量。另一个属性是\
  \ `Optionality`，这是一个二值变量，决定了角色的实例是否必须存在。当然，每个角色都必须有一个 `Name`。\n\n![image](img/B9780120887989500024_f01-05-9780120887989.jpg)\n\
  图 1-5 角色 (Roles)。\n\n模型图中的 `Optionality` 由表示扮演角色的对象类框旁符号的前半部分表示。正如我们之前看到的，初始位置的字符\
  \ `1` 意味着相反对象的类的每个实例**必须**与相邻对象的类的至少一个实例关联。因此，该角色是`mandatory`（强制的）。（`Role` 的 `Optionality`\
  \ 属性值为 `False`）。字符 `0` 意味着相反对象的类的每个实例**可以**与相邻对象的任何实例关联。也就是说，该角色是`optional`（可选的）。（`Role`\
  \ 的 `Optionality` 属性值为 `True`）。使用元模型本身作为示例，“每个 Role 必须连接到且仅连接到一个 ObjectClass”，但“每个\
  \ ObjectClass 可能或可能通过 Role 连接”。\n\n模型图中的 `Cardinality` 由每个对象类旁符号的后半部分表示。第二个位置的字符\
  \ `1` 意味着相反对象的类的每个实例可以与相邻对象的**不多于一个**实例关联。（也就是说，`Role` 的 `Cardinality` 属性值为 `1`）。字符\
  \ `^*` 意味着相反对象的类的每个实例可以与相邻对象的**一个或多个**实例关联。（`Role` 的 `Cardinality` 属性值为 `^*` 或某个特定数字）。例如，在图\
  \ 1-5 中，“每个 Role 必须连接到且仅连接到一个 ObjectClass”，但“每个 ObjectClass 可能通过一个或多个 Roles 连接”。\n\
  \n那么，在模型中（正如我们之前看到的），每个属性必须与恰一个 `[1..1]` `ObjectClass` 实例关联。每个 `ObjectClass` 可以与零、一个或多个\
  \ `[0..^*]` `Attribute` 实例关联。同样，每个 `ObjectClass` 可以通过一个或多个 `Roles` 连接，每个 `Role`\
  \ 必须连接到另一个 `Role`，而该 `Role` 必须连接到相同或另一个 `ObjectClass`。\n\n相同的符号适用于属性。正如我们之前看到的，`Name`\
  \ 边的 `[1..1]` 意味着对于任何 `Attribute` 实例，`Name` 必须有一个值。`Data Type` 边的 `[0..1]` 意味着 `Attribute`\
  \ 实例可以在没有 `Data Type` 值的情况下，但它的值不能超过一个。因此，`Optionality` 是 `Attribute` 的一个属性，但 `Cardinality`\
  \ 不是。^*\n\n`sub-type`（子类型）是一个包含 `super-type`（超类型）对象类某些实例的对象类。也就是说，超类型的实例可以被分类为两个或多个子类型。例如，对象类\
  \ `Person` 可能有 `MalePerson` 和 `FemalePerson` 作为子类型。那么，图 1-5 显示，每个对象类可以是两个或多个其他对象类的\
  \ `super-type of`（零、两个或多个）。每个对象类反过来可以是一个且仅一个另一个对象类的 `sub-type of`（零或一个）。^* \n\n\
  ### 实体关系模型 (Entity-Relationship Model)\n\n很多都是对象类和关联（正如我们之前看到的）。如果你是那些仍然对实体进行建模的人，那么实体关系模型长什么样？图\
  \ 1-6 显示了实体的对象模型。\n\n![image](img/B9780120887989500024_f01-06-9780120887989.jpg)\n\
  图 1-6 实体关系版本。\n\n具体来说：\n- 实体由一个或多个 `Attributes` 描述。\n- 每个实体类型可以通过一个或多个 `RelationshipEnds`\
  \ 连接，每个 `RelationshipEnd` 必须连接到另一个 `RelationshipEnd`，而该 `RelationshipEnd` 必须连接到相同或另一个\
  \ `EntityType`。\n- 每个实体类型可以是两个或多个其他实体的超类型（零或一个子类型）。\n\n关于实体和关系的元模型有一个有趣的现象：只需更改几个名称，图\
  \ 1-6（实体类型的元模型）看起来与图 1-5](#B9780120887989500024.htm_f5)（对象和角色的元模型）非常相似。这并非巧合。它们代表的是相同的内容。\n\
  \n对象类模型（至少就我们目前所知）实际上就是实体关系模型。实体类型和对象类都代表了业务希望持有的某种信息的定义。\n\n然而，UML 符号包含许多不适用于架构师模型的特征。当它描述系统对象而非业务对象时，它偏离了实体关系建模。它包含许多描述面向对象设计考虑的符号。这些包括组合、关联导航等。\n\
  \n图 1-7 显示了实体关系图（ERD），它是我们模型的一个版本。它使用了结构化系统分析与设计（SSADM）方法 [Eva 1994]，该方法由英国政府资助。这种符号在欧洲广泛使用，也是\
  \ Oracle 公司在其 Designer CASE 工具中使用的实体关系表示法。\n\nUML 和实体关系表示法当然不同。这两种方法之间三个主要区别。\n\n\
  \n\n\n首先，最明显的一点是排版和图形（语法）是不同的。这里显示的实体关系（entity-relationship）表示法是为了提高非技术读者对图表的可读性。如果模型需要提交给用户社区进行验证，这一点非常重要。例如，通常世界期望在名称的单词之间看到空格。\n\
  \n在关系表示法中，不再使用第一个字符“0”，而是在第一个实体类旁看到一个 `dashed line half`（虚线半线段）。这意味着该关系是可选的（在之前的关联句子中为“可能”）。而不是使用第一个字符“1”，你会在第一个实体类旁看到一个\
  \ `solid line half`（实线半线段）。这表示强制性关系（在先的句子示例中为“必须”）。\n\n而不是使用第二个字符“^*”，你看到的是一个表示“一个或多个”的“乌爪脚”符号。缺少乌爪脚则表示\
  \ UML 的第二个字符“1”，并代表“有且仅有一个”。实体类名称采用全大写，且单词之间插入了空格。\n\n### 语法与语义\n\n现在在实体关系图中读取关系的语法如下。\n\
  \n![image](img/B9780120887989500024_u01-03-9780120887989.jpg)\n\n因此，以元模型为例，每个 `ENTITY\
  \ CLASS` 可以被 `described by` 一个或多个 `ATTRIBUTES`，且每个 `ATTRIBUTE` 必须 `about` 有且仅有一个\
  \ `ENTITY CLASS`。此外，模型还说明每个 `ENTITY CLASS` 可以通过 `connected via` 一个或多个 `RELATIONSHIP\
  \ ROLES`，且每个 `RELATIONSHIP ROLE` 必须 `connected to` 有且仅有一个 `ENTITY CLASS`。和以前一样，每个\
  \ `RELATIONSHIP ROLE` 必须 `connected to` 另一个另一个 `RELATIONSHIP ROLE`，而该角色本身必须 `connected\
  \ to` 有且仅有一个 `ENTITY CLASS`。\n\n### 属性信息\n\n实体关系表示法与 UML 之间的第二个区别在于每个属性表示的信息。由于这些模型仅用于说明，而不是设计的基础，因此没有必要在图中描述每个属性的数据类型。这样做会使图表变得杂乱。^*（当然，这些信息应该记录在支持绘图的存储库中。）\n\
  \n然而，能够看到属性值是否必用是有用的，因此在每个属性名称旁边仍然保留了“可选性”符号。如果符号是星号（`^*`）或井号（`#`），实类的每次出现都必须具有属性值（等于\
  \ UML 中的 `1..`）。如果符号是空圈（`o`），则实类的出现可能具有或不具有该属性（等于 UML 中的 `0..`）。同样，由于这是一个规范化的概念模型——在任何情况下属性都不可能有多个值——因此\
  \ ERD 表示法没有理由显示 UML 基数表示法的后半部分（`..1` 和 `..`)^*\n\n### 标识符\n\n在标识符领域，实体关系模型比 UML\
  \ 模型更具表达力。在面向对象的设计中，假设每个对象类都有一个对象标识符（`OID`）来识别类的实例。因此，不需要显式地指定属性或角色为标识性。然而，在实体关系模型支持的关系型世界中，实体实例的标识符非常重要，因为它预期显式由可见的属性或关系组成。\n\
  \n图 1-7 显示在每个实体类的“Name（名称）”旁边都有井号（`#`）。这意味着在每种情况下，属性至少部分负责识别实体类的实例。例如，这里假设每个 `ENTITY\
  \ CLASS` 将被赋予一个唯一的名称。但在 `RELATIONSHIP ROLE` 的情况下，可能存在多个 `RELATIONSHIP ROLE` 实例具有相同的名称。在这种情况下，在指向\
  \ `ENTITY CLASS` 的关系上也会打一个标记，以指示有必要指定所涉及的 `ENTITY CLASS`（以及其 `Name`）来唯一标识每个 `RELATIONSHIP\
  \ ROLE` 出现情况。\n\n### 基数\n\n实体关系模型在描述复杂基数方面并不完全像 UML 类图那样具有表达力。UML 版本可以断言“每个 `ENTITY\
  \ CLASS` 可以是 `two or more` `ENTITY CLASSES` 的超类型”。标准的实体关系表示法只能说一个 `ENTITY CLASS`\
  \ 可以是一个或多个其他实体的超类型。它不能将该语句限制为`两个`或更多。然而，为了本模型的目的，我们的表示法已经修改为显示这一点。\n\n### 表示法选择\n\
  \n多年来，使用哪种表示法一直是信息技术领域广泛争论的基础。开发了不同的表示法来服务不同的目的和不同的受众。UML 类图是与面向对象的开发人员通信的表示法，而实体关系图是专门为支持与不熟悉数据建模的业务人员讨论概念而设计的。由于这个原因，它对普通读者来说稍微易读。由于本书的目的是解释概念，而不是提供构建系统的原理图，因此这里使用了这种表示法。\n\
  \n因此，UML 类图并不是对系统开发过程的宏大新概念化。这种表示法只是创建概念实体关系模型的另一种方式。新之处在于它表示面向对象设计的能力。^*\n\n##\
  \ 抽象层次\n\n可以在不同的抽象程度上对任何事物进行建模。每当尝试创建一个数据模型时，就会出现将其抽象到什么程度的问题。做得太抽象，对于想要理解它的人来说就没有意义。做得不够抽象，它就会容易变化。达到恰好的平衡既是艺术也是科学。\n\
  \n最终，所有元数据的模型可以是[图 1-8 所示模型的变体。在这里，模型中所有感兴趣的事物都简单地表示为 `THING`。每个 `THING` 必须是`an\
  \ of` 有且仅有一个 `THING TYPE`，其中 `THING TYPE` 是 `THINGS` 类的定义。\n\n![image](img/B9780120887989500024_f01-08-9780120887989.jpg)\n\
  \n图 1-8 终极元模型\n\n在接下来的章节中，UML 伞下的各种类型模型，以及类模型的额外表示法将在元模型中讨论。\n\n该模型实际上可以描述我们可能包含在存储库中的*任何*事物。在这种情况下，它可以表示实体类、类、程序单元、人员、概念等。\n\
  \n\n\n那么，我们所知的具体模型每一个都可以被视为这一更抽象模型的*视图*。例如，一个 `ENTITY CLASS`（实体类）可以定义为“一个作为 `entity\
  \ class` 类型*实例的*事物（THING）”。另一个视图可以将 `ATTRIBUTE`（属性）定义为“一个作为 `attribute` 类型*实例的*事物（THING）”。`THING\
  \ TYPE RELATIONSHIP`（事物类型关系）被定义从 `entity class` 类型到 `attribute` 类型，名称为“被描述”。另一个\
  \ `THING TYPE RELATIONSHIP` 被定义从 `attribute` 类型到 `entity class` 类型，名称为“关于”。\n\n\
  实际上，图 1-8 中的模型可以通过显示其仅由 `THING`（事物）和 `THING RELATIONSHIP`（事物关系）组成来变得更加抽象。毕竟，`THING`\
  \ 到 `THING TYPE` 的关联本身仅仅是两个高级 `THINGS` 之间的关联。\n\n事实上，书中包含的所有实体类都只是图 1-8 中实体类的视图。因此，元数据仓库拥有基于图\
  \ 1-8 抽象模型的*物理*结构是完全合理的。这使得管理仓库的工具在处理未来需求时具有最大的灵活性。然而，作为对我们元数据业务的描述，它并没有告诉我们很多实际发生的情况。当人们去仓库获取信息时，他们希望使用比这丰富得多的词汇。他们将寻找关于*业务术语*的定义、*程序*何时运行，或者*数据*是如何受到约束的信息。\n\
  \n因此，为仓库用户提供一组更符合其需求的词汇视图是关重要的。由于这个原因，在书中，我们必须产出一个并不完全像图 1-8 中所示那样抽象的模型。在编写这本书时，作者努力达到正确的抽象水平。他是否成功了，由你，读者来判断。\n\
  \n***\n\n好吧，这是事实。我在高中学过拉丁语，并一直认为 *data* 是单词 *datum* 的复数形式。我意识到我可能是在逆潮流而行，但嘿！这是我的书！\n\
  \n用粗体斜字体显示的关键词和短语定义在书末的词表中。\n\n某天在进行关于宇宙学的讲座时，亚瑟·爱丁顿爵简要概述了宇宙的早期理论。其中，他提到了美洲印人的观点，即世界在一个巨大乌龟的背上，并补充说这不是特别实用的模型，因为它无法解释乌龟本身支撑在什么。讲座结束后，一位老太太找到了爱丁顿。“你非常聪明，年轻人，非常聪明，”她有力地宣告道，“但你对印第安宇宙学有一点并不理解：层层都是乌龟！”\n\
  \n本节基于你作者的著作《需求分析：从业务视图到架构》中对架构框架的类似描述 [Hay 2003]。\n\n多值属性是指那些每一行可以取多个值的属性，例如当一个人可以有多个值时，使用\
  \ `Address` 作为属性。\n\n在此语境下，二元关系是指仅两个实体类之间的关系。\n\nUML 中至少有六种不同类型的模型。表示数据结构的“类”图只是其中之一。\n\
  \n注意，本书遵循一种约定，关系名称和多重性指示器（`[1..1]`、`[0..^*]` 等）应按顺时针方向读取。\n\n递归（参见 *Recursion*）。\n\
  \n\n\n\n![image](img/B9780120887989500036_f02-01-9780120887989.jpg)\n\n图 2-1 数据列。\n\
  \n# 业务所有者与业务规则\n\n业务规则小组（曾称为业务规则 GUIDE 项目）于 1995 年发表了一篇描述业务规则类别的论文 [Business Rules\
  \ Group 1995]。该论文从根本上讨论了架构师视角的业务规则，侧重于如何捕获并组织这些规则，以便最终在信息系统中实现。\n\n在其他观察结果中，该论文指出，第三行（Row\
  \ Three）的业务规则最好被理解为定义或约束关于企业 `data` 的陈述。诚然，某些规则用 `events`（事件）和 `activities`（活动）来描述更为合适，但大多数规则最好用数据的允许状态来表达。业务规则小组论文识别的类别为：\n\
  \n* `Terms`（术语，*以及这些术语所描述的业务概念*）：业务术语的定义本身就是一条描述人们如何思考和谈论事物的规则。因此，根据这种观点，术语的定义（即其底层的业务概念）建立了一类业务规则。例如，这可以是数据模型中使用的术语（如\
  \ `product type`），也可以是业务中简单使用的术语，如 `prestige client`。\n* `Facts`（事实）：这些事实连接了术语。组织的性质和运作结构都可以通过将企业术语相互关联的事实来描述。例如，说“客户可以下单”就是一个事实；因此是一条业务规则。事实可以以自然语言句的形式记录，也可以以图形模型中的关系、属性或泛化结构的形式记录。例如，一个事实可以用一个句子表达，如“每个产品实例可能位于一个或多个站点。”\n\
  * `Derivations`（推导）：这些是业务规则（包括自然法则），定义了一种形式的知识如何转换为其他知识（可能以不同的形式）。产品成本和利润率的计算就是此类类别的示例。\n\
  * `Constraints`（约束）：每家企业都会以某种方式限制行为，这与对哪些数据可以或不可以更新的约束密切相关。这些包括业务约束（例如控制向谁发放信贷的约束）以及数据约束（例如对数据元素可以取值的约束）Business\
  \ Rules Group 1995, [p.6]。\n\n在业务规则小组的论文中，术语和事实被称为 `structural assertions`（结构断言），而约束被称为\
  \ `action assertions`（动作断言）。推导是一个独立的类别，尽管推导的结果 `derived facts`（派生事实，结构断言）。在大多数情况下，结构断言（术语和事实）是数据列的产物——可以在实体关系（或对象）模型中表示——而动作断言（约束）是动机列的产物，大部分无法实体关系模型中表示。派生术语（属性）是可以在数据模型中呈现的结构断言，尽管其推导逻辑是无法的。\n\
  \n自该篇原始论文发表以来，业务规则小组与其他组织以及对象管理组（Object Management Group）合作，形成了他们所谓的“业务规则团队”（Business\
  \ Rules Team）。^* 他们的任务是尝试不从架构师视角（第三行），而是从业务所有者视角（第二行）更详细地处理数据列和动机列。他们设定的具体实践目标是描述一种语言的特征，这种语言既可以用来用业务所有者的术语描述业务，又能（使用形式逻辑）以严谨的方式传达这种意义，从而对技术设计人员有用。通过这项工作，他们对语言在操控业务概念和技术方面发挥的作用产生了一些深刻的见解\
  \ [BRT 2006]。\n\n该小组得出的结论之一是，严格来说，术语和事实并不是业务规则。首先，术语背后的 `business concepts`（业务概念）才是重要的。其次，一组事实的定义（实际上是\
  \ `fact types`，关于这一点稍后详述）对于理解企业的本质比事实本身更有用。严格来说，这两者都不是业务规则。相反，业务规则团队认为，业务规则（前者的动作断言）是建立在事实类型之上的，而事实类型又建立在术语背后的业务概念之上。\n\
  \n这种第一个大类别——结构断言的另一个术语是 `universe of discourse`（论域）。它由术语和事实类型背后的 `business concepts`\
  \ 组成，每一个概念都是一个事实类别的定义。\n\n术语、概念和事实类型是架构框架第二行业务所有者视角中数据列的领域。它们将在接下来的章节中进行更严谨的描述。第二行的业务规则（以及随之产生的数据和数据库管理系统约束）属于动机列，并在第七章中进行更充分的探讨。\n\
  \n# 第二行：业务术语、概念和事实类型\n\n对第二行的检查始于描述每个业务用户所看到的具体且有形的（尽管通常很窄）的世界。这种观点描述了事物的特定发生（例如，“A-26\
  \ 车床”），并且通常与当前系统交织在一起（例如，“我的工作是查看 Framis 报告并确定哪些项目需要维护”）。从这里的第一步是将这些观察结果泛化为更通用的结构。那么，示例中的泛化结构可能是“设备”和“确定维护需求”。\n\
  \n然而，这些结构仍然是没有约束的。这里的模型可能包含 `many-to-many relationships`（多对多关系）、`ternary (and higher-order)\
  \ relationships`（三元及更高阶关系）、`multi-valued attributes`（多值属性）以及其他规范问题。这些约束在第三行添加。\n\
  \n在数据列，第二行主要关注组织的 `semantics`（语义）。语义是研究意义的哲学分支 [Kemerling 1997–2002]，这里的任务是确定业务在使用某些语言时的含义。语义最近被明确认为是知识库开发的一个重要领域，事实上，即使未被意识到，它在开发任何能够顺畅运行的系统中一直是重要的。当你讨论组织部分之间相互通信的方式时，你讨论的就是语义。\n\
  \n## 术语与概念\n\n图 2-2 显示，对于我们的目的，`BUSINESS TERM` 被定义为使用单个 `WORD` 或 `PHRASE` 来表示单个\
  \ `BUSINESS CONCEPT`。^*。`BUSINESS CONCEPT` 简单来说是我们理解为存在的事物。在这种语境下，`BUSINESS CONCEPT`\
  \ 是企业运营或环境的一个方面。它可以是有形的东西，也可以是从特定实例中泛化出来的抽象思想。`BUSINESS CONCEPTS` 的集合赋予了我们的语言意义。\n\
  \n\n\n\n这可能是我们数据建模人员所描述的一个实体类（例如“产品”）、此类类的一个属性（例如“颜色”）或该类的一个实例（例如“IBM ThinkPad Model\
  \ T24”）。然而，更重要的是，它也可能是对业务非常重要的内容，但并不一定包含在我们的数据模型中（例如“ICD 10”，医学世界的疾病目录，或 `completion`——石油行业的一个术语，指井中带孔的部分，石油通过这些孔从地面流向井中）。\n\
  \n一个 `PHRASE`（短语）可以由一个或多个 `WORDS`（单词）组成。一个 `WORD` 可以是一个或多个 `PHRASES`（短语）的一部分。那么，`WORD\
  \ USAGE`（词用法）是在一个 `PHRASE` 中使用一个 `WORD` 的行为。在传统语言中，`term`（术语）几乎等同于 `word` 或 `phrase`，但这里使用的\
  \ `BUSINESS TERM`（业务术语）的限定定义允许我们处理这种事实：同一个 `BUSINESS CONCEPT`（业务概念）可以用许多不同的 `WORDS`\
  \ 或 `PHRASES`（`synonyms` 同义词）来描述，而同一个 `WORD` 或 `PHRASE` 可能代表许多 `BUSINESS CONCEPTS`（`homonyms`\
  \ 同音词）。\n\n例如，`client`、`customer` 和 `account` 通常是同义词。另一种，石油公司中的 `facility` 是为了执行某功能而组合的大型设备复合体，而银行中的\
  \ `facility` 是一项向特定客户提供规定金额信贷的内部协议。这些是同音词。因此，将 `BUSINESS TERM` 限制为将单个单词或短语分配给单一含义是非常有用的。\n\
  \n我们在这里关注的 `BUSINESS TERMS` 可能是任何用于描述组织及其运作的单词（例如 `product`）。然而，它们也可能是描述特定行业（或特定公司）的词汇，用于描述流程的各个方面或企业的其他方面（例如，银行使用“instrument”一词，它所描述的概念与管弦乐队使用“instrument”一词的概念完全不同）。\n\
  \n请注意，该模型中存在一个异常：在模型中，我们无法在不使用单词的情况下讨论 `BUSINESS CONCEPT` 的实例。因此，“Name”（名称）显示为一个完全合理的属性。然而，事实上，任何语言都无法引用一个不属于\
  \ `used in` `BUSINESS TERMS` 的 `WORDS` 和 `PHRASES` 的 `to represent` `BUSINESS CONCEPT`。事实上，重要的一点是，`BUSINESS\
  \ CONCEPT` 的存在独立于我们描述它的能力。\n\n## Business Rule（业务规则）\n\n至少，每个 `BUSINESS CONCEPT`\
  \ 必须被 `BUSINESS TERM` 表示，而 `BUSINESS TERM` 是一个 `WORD` 或 `PHRASE` 的使用，其值等同于 `BUSINESS\
  \ CONCEPT` 的“Name”属性的值。\n\n***\n\n正如书中将变得显而易见的，业务规则与数据模型中通常显示的内容非常不同。这要求我们单独对它们进行记录。书中描绘的元数据模型背后的业务规则与任何规模相当的企业模型所预期的一样。因此，在这里，我们以这种形式将它们添加到文中。\n\
  \n`BUSINESS CONCEPTS` 还是描述它们的 `WORDS` 都不是孤立存在的。人们必须使用它们。在图 2-3 中，每个 `BUSINESS CONCEPT`\
  \ 必须是 `SEMANTIC COMMUNITY`（语义社区）的 `the shared understanding of`。也就是说，只有当一群人认可它时，概念才被识别。`SEMANTIC\
  \ COMMUNITY` 是一组对一组 `BUSINESS CONCEPTS` 的含义表示一致的人，例如油井工人或数据建模人员。\n\n![image](img/B9780120887989500036_f02-03-9780120887989.jpg)\n\
  \n图 2-3 语义社区。\n\n在图 2-4 中，`SPEECH COMMUNITY`（言语社区）被定义为任何 `part of` `SEMANTIC COMMUNITY`\
  \ 且是特定 `LANGUAGE` 的 `speakers of` 的人群。在一般层面上，这可以是“英国人口”或简单来说是“英语使用者”，但也可以具体到某种特定的方言。因此，`SPEECH\
  \ COMMUNITY` 可能由一个或多个其他 `SPEECH COMMUNITIES` 组成。\n\n![image](img/B9780120887989500036_f02-04-9780120887989.jpg)\n\
  \n图 2-4 言语社区。\n\n根据定义，`SPEECH COMMUNITY` 的所有成员都是同一个 `LANGUAGE` 的 `speakers of` 且同一个\
  \ `SEMANTIC COMMUNITY` 的 `part of`。在图 2-4 中，每个 `BUSINESS TERM` 都显示为 `in the language\
  \ of` 正好一个 `SPEECH COMMUNITY`。即使一个 `WORD` 或 `PHRASE` 存在于多个 `SPEECH COMMUNITIES`\
  \ 中，每个 `BUSINESS TERM` 都显示为 `in the language of` 正好一个 `SPEECH COMMUNITY`。（注：原文此处存在大量重复，译文已按要求处理并翻译）。\n\
  \n\n\n\n任何作为 `SYMBOL` 的 `ONTOLOGICAL CLASSIFICATION` 的 `ONTOLOGY` 必须由相同的 `SEMANTIC\
  \ COMMUNITY` `defined by`，该社区也对 `SYMBOL` 所代表的 `BUSINESS CONCEPT` 共享理解。换句话说，定义 `ONTOLOGY`\
  \ 的 `SEMANTIC COMMUNITY` 必须是该 `ONTOLOGY` 中所有 `SYMBOLS` 来源的 `SEMANTIC COMMUNITY`。\n\
  \n任何系统分析师的首要任务是协调组织内部不同 `SEMANTIC COMMUNITIES` 之间的语言。这具有挑战性，但大多数行业在该行业大多数公司都有共同的基础词汇，这提供了便利。信息处理行业中的语义方法开始做的之一就是对这些行业词汇进行编码。本体论开始在万维网上出现，其形式允许它们被整合到公司本体论中。\n\
  \n事实上，正努力让本体论成为 Web 的基础部分。从一开始开始，蒂姆·伯纳斯-李（Web 发明者）就预见到它最终将超越其作为 `协作媒介` 的原始目标，实现\
  \ `语义网` 的目标——即机器可以理解并因此可以 `处理` 的。也就是说，语义网是“机器可处理的智能数据网络，[其中]智能数据是独立于应用的、可组合的、分类的且更大信息生态系统（本体论）的一部分的数据”\
  \ [Daconta et al. 2003, p. 4]。语义网预计通过包含本体论来支持不仅搜索文档标签而且搜索文档本身文本的技术。对主题的搜索不仅能找到显式标识为该主题的文档，还能找到文本中提到该主题的文档。\n\
  \n一种特殊的本体论被称为 `taxonomy`（分类法）。这是概念的层次级组织。其中广为人的是生命结构本身的生物分类。它是通过门、科、属、种等来描述的。遗憾的是，企业中许多感兴趣的领域并不容易进行层次级表示，尽管这种表示可能方便。\n\
  \n### Propositions（命题）\n\n`PROPOSITION` 是一个可能真或假的陈述。`PROPOSITIONS` 将概念连接在一起。是命题描述了业务在做什么以及是如何做的。\n\
  \n每个 `PROPOSITION` 将 `BUSINESS CONCEPTS` 连接在一起。也就是说，每个 `PROPOSITION` 必须 `composed\
  \ of` 两个或多个 `PROPOSITION ELEMENTS`，每个元素都必须 `about` 一个 `BUSINESS CONCEPT`。这在图 2-8\
  \ 中所示。\n\n![image](img/B9780120887989500036_f02-08-9780120887989.jpg)\n\n图 2-8 命题。\n\
  \n同样注意，在图 2-8 中，每个 `PROPOSITION` 必须是恰好一个 `PROPOSITION TYPE` 的 `example of`，而该类型本身也是一种\
  \ `BUSINESS CONCEPT`。就像每个 `PROPOSITION` 必须 `composed of` 两个或多个 `PROPOSITION ELEMENTS`\
  \ 一样，每个 `PROPOSITION TYPE` 也也必须 `composed of` 两个或多个 `PROPOSITION TYPE ELEMENTS`。由于\
  \ `PROPOSITION TYPE` 是 `BUSINESS CONCEPT` 的示例，因此识别一个 `BUSINESS CONCEPT ELEMENT`\
  \ 是合适的，即 `BUSINESS CONCEPT` 内部（`part of`）的组件。这是 `PROPOSITION TYPE ELEMENT` 的超类型。\n\
  \n特定 `PROPOSITION TYPE` 的所有 `PROPOSITIONS` 的真值可能是：\n\n- `Deontic`（道论）——这是对义务的陈述（要求必须如此）或许可的陈述（允许如此）。这是业务规则的领域。\n\
  - `Alethic`（真值论）——这是对必然性的陈述（必须是真的）或可能性的陈述。这是物理学领域。\n- `Epistemological`（认识论）——这是对某事为人知的陈述。认识论命题以典型的数据模型呈现。\n\
  \n这通过 `PROPOSITION TYPE` 属性 `Modal type` 表示。\n\n`PROPOSITION ELEMENT` 的一个属性是 `Predicate`（谓词），谓词是“逻辑命题中对主体所肯或否定的某些内容”\
  \ [Merriam-Webster 2005]。命题“太阳明天会升起”由两个 `PROPOSITION ELEMENTS`。一个连接到 `BUSINESS CONCEPT`\
  \ “明天”，谓词为 `will rise`。另一个连接到 `BUSINESS CONCEPT` “太阳”，谓词为 `<subject>`，表示“太阳”是该 `PROPOSITION`\
  \ 的主体。\n\n### Fact Types（事实类型）\n\n一个 `FACT` 是一个永远为真的 `PROPOSITION`。因此，图 2-9 中的元模型显示\
  \ `FACT` 是 `PROPOSITION` 的一种类型。一个 `FACT` 可能是“查理在 1 月 14 日被分配到 Z 项目”。这把 `BUSINESS\
  \ CONCEPT` “查理”与 `BUSINESS CONCEPTS` “Z 项目”和“1 月 14 日”连接在一起。\n\n![image](img/B9780120887989500036_f02-09-9780120887989.jpg)\n\
  \n图 2-9 事实。\n\n每个 `FACT` 必须 `composed of` 两个或多个 `PROPOSITION ELEMENTS`，每个元素 `about`\
  \ 一个 `BUSINESS CONCEPT`。事实类型是相似事实的定义。`FACT TYPE` 的一个属性是 `Predicate`。`FACTS` 包括：\n\
  \n- 查理在 1 月 14 日被分配到 Z 项目\n- 太阳明天会升起\n\n### Characteristics（特性）\n\n一种 `FACT TYPE`，如图\
  \ 2-10\n\n图 2-10 特性。\n\n`BUSINESS CONCEPT` 实例的规范在于其使用一组指定的 `CHARACTERISTICS`。“磁盘空间大小”、“内存大小”、“长度”和“宽度”是可以应用于计算机和其他事物的\
  \ `CHARACTERISTICS`。例如，一个 `CHARACTERISTIC ASSIGNMENT` 可能会将 `CHARACTERISTIC` “随机内存大小”连接到另一个\
  \ `BUSINESS CONCEPT` “笔记本电脑”。\n\n注意 `CHARACTERISTIC ASSIGNMENT` 的属性 `Essential indicator`\
  \ 和 `Delimiting indicator`。如果 `Essential indicator` 为“True”，则对于通过 `CHARACTERISTIC\
  \ ASSIGNMENT` 连接的 `BUSINESS CONCEPT` 实例，该 `CHARACTERISTIC` 是必要的。如果 `Delimiting indicator`\
  \ 为“True”，则该 `CHARACTERISTIC` 的值将一个 `BUSINESS CONCEPT` 的实例与其他区分来。\n\n\n\n\n\n除非“必要指示”（Essential\
  \ indicator）已设置为“True”，否则“界定指示”（Delimiting indicator）可能无法设置为“True”。\n\n这揭示了在同一个模型中包含通用概念和特定概念的问题。`CHARACTERISTIC`\
  \ 确实是 `BUSINESS CONCEPT` 的一种，而 `CHARACTERISTIC ASSIGNMENT` 确实是 `BUSINESS CONCEPT\
  \ ELEMENT` 的一种。同样，`CHARACTERISTIC ASSIGNMENT` 与 `CHARACTERISTIC` 之间的关系（\"of\"）实际上是\
  \ `BUSINESS CONCEPT ELEMENT` 与 `BUSINESS CONCEPT` 之间关系（\"part of\"）的一种`sub-type`。\n\
  \n同样，关系角色“每个 `CHARACTERISTIC ASSIGNMENT` 必须指向（to）一个且唯一的 `BUSINESS CONCEPT`”是“每个\
  \ `PROPOSITION TYPE ELEMENT` 必须描述于（descriptive of）一个且唯一的 `BUSINESS CONCEPT`”的子类型。问题在于这些关系的名称确实应该是不同的，但在不显得冗余的情况下无法显示两者。为了清晰起见，这里显示了两者，而且这并不是唯一出现此类问题的地方。作为替代，如果不显示冗余的关系，可以记录以下业务规则。\n\
  \n## 业务规则\n\n每个作为 `CHARACTERISTIC ASSIGNMENT` 的 `BUSINESS CONCEPT ELEMENT` 必须属于（part\
  \ of）一个且唯一的作为 `CHARACTERISTIC` 的 `BUSINESS CONCEPT`。\n\n#### 资源\n\n这些 `SYMBOLS`（`BUSINESS\
  \ TERMS` 和 `ICONS`）所代表的信息来自哪里？通常它们最初记录在某种文档中：规格书、录像带、电子邮件等。`图 2-11` 显示 `RESOURCE`\
  \ 是一个或多个 `SYMBOLS` 的来源（source of）。`RESOURCE` 是一组 `SYMBOLS` 的集合。\n\n![image](img/B9780120887989500036_f02-11-9780120887989.jpg)\n\
  \n图 2-11 资源。\n\n由于每个 `SYMBOL` 也可能创建自（created from）一个或多个 `RESOURCES`，因此“交叉”实体类 `RESOURCE\
  \ ELEMENT` 定义为：特定的 `SYMBOL` 被某个 `RESOURCE` 提到的事实。也就是说，每个 `RESOURCE ELEMENT` 必须属于（part\
  \ of）恰好一个 `RESOURCE`，并且引用（reference to）恰好一个 `SYMBOL`。注意，资源元素的一个属性是“权威性指示”（authority\
  \ indicator），表示该特定资源是否是该符号（业务术语或图标）定义的权威来源。\n\n`RESOURCE` 的属性包括：\n\n* `Uniform resource\
  \ identifier`（`URI`）：一种标识资源的方法。\n* `Title`（标题）：命名资源的文本。\n* `Subject`（主题）：简述资源主要用途的文本。\n\
  * `Abstract`（摘要）：对资源内容的描述，长度不超过两个段落。\n* `Description`（描述）：摘要的替代方案，是对资源的更详细描述。\n\
  * `Date created`（创建日期）。\n\n每个 `RESOURCE` 必须是恰好一个 `RESOURCE TYPE` 的示例（example of），但可能的\
  \ `RESOURCE TYPES` 列表比作为 `RESOURCE` 子类型显示的 `DOCUMENT` 详得多（尽管这也是 `RESOURCE TYPE`\
  \ 的一个例子）。`BUSINESS CONCEPTS` 的识别和定义也可能是由某种事件、甚至是服务的执行引起的。都柏林核心（Dublin Core）是一个尝试标准化描述文档的元数据的组织。它识别了以下\
  \ `RESOURCE TYPES`：\n\n* `Document`（文档）\n* `Collection`（集合）\n* `Data Set`（数据集）\n\
  * `Image`（图像）\n* `Interactive Resource`（交互式资源）\n* `Moving Image`（动态图像）\n* `Physical\
  \ Object`（实体）\n* `Software`（软件）\n* `Sound`（音频）\n* `Still Image`（静态图像）\n* `Text`（文本，文档）\n\
  \n* `Other Resource Types`（其他资源类型）\n* `Event`（事件）\n* `Service`（服务）\n\n每个 `RESOURCE\
  \ TYPE` 可能是其他（2+）`RESOURCE TYPES` 的超类型（super-type of）。注意，每个 `RESOURCE` 可能是一个或多个\
  \ `SYMBOLS` 的来源，每个符号原则上可能属于不同的语言。不过，在大多数情况下，作为 `RESOURCE` 呈现（presented as）的所有 `SYMBOLS`\
  \ 更有可能是同一种语言。然而，模型中并未显示这一点。\n\n在 `图 2-12` 中，`RESOURCE STRUCTURE` 是一个 `RESOURCE`\
  \ 以指定方式与另一个相关的实。也就是说，`RESOURCE STRUCTURE` 是一个 `RESOURCE STRUCTURE TYPE` 的示例（example\
  \ of）。目前，候选的 `RESOURCE STRUCTURE TYPES`（再次来自都柏林核心）如下：\n\n![image](img/B9780120887989500036_f02-12-9780120887989.jpg)\n\
  \n图 2-12 资源结构。\n\n* `A reference to`（引用）\n* `The source of`（来源）\n* `Bibliographic\
  \ citation`（文献引用）\n* `Conforms to`（符合）\n* `Structure`（结构）\n* `Has format of`（格式为）\n\
  * `Replacement for`（替换）\n* `Required by`（被……需要）\n* `Updated version of`（更新版本）\n\
  * `Derived from`（源自）\n\n其他情况也是可能的。\n\n#### 身份\n\n`图 2-13` 引入了 `PARTY` 类，该类在第五章中有更详细的描述。它被突出显示是因为\
  \ `PARTY` 属于我们正在讨论的特定 `RESOURCE`。\n\n![image](img/B9780120887989500036_f02-13-9780120887989.jpg)\n\
  \n图 2-13 身份。\n\n`PARTY` 是为了特定目的指定的地点（location），例如房屋、办公室或仓库。由于 `RESOURCE` 也可能由一个或多个\
  \ `PARTIES` 加工，`AUTHORSHIP ROLE` 被定义为特定的 `PARTY` 参与了创建。根据标准，以下是 `AUTHORSHIP` 的种类：\n\
  \n* `Author`（作者）\n* `Contributor`（贡献者）\n* `Publisher`（出版者）\n* `Rights Holder`（权利持有者）\n\
  \n#### 文档发行\n\n`RESOURCE` 是抽象的。它是受版权保护的表达，独立于其物理表现。特别是，它的存在是 `SYMBOLS` 的集合。也就是说，每个\
  \ `RESOURCE` 必须体现为（embodied in）至少一个（可能多个）`COPY`。`COPY` 可以 `PHYSICAL COPY`（如书籍或期刊）或\
  \ `VIRTUAL COPY`（如电子邮件或网站）。\n\n`SITE` 是另一个在其他章节中有更完整定义的实体类——在本例中为第四章。每个 `COPY` 发送到一个或多个\
  \ `PARTIES` 和/或一个或多个 `SITES`。具体来说，`RESOURCE DISTRIBUTION` 是特定的 `COPY` 在特定时间发送（to）特定\
  \ `PARTY` 或 `SITE`（当涉及的 `PARTY` 未识别时）的事实。\n\n#### 范围\n\n`图 2-15` 显示了 `GEOGRAPHIC\
  \ LOCATION`，这是借自第四章的另一个实体类。`GEOGRAPHIC LOCATION` 是地球表面一个边界明确的地点，例如州或省、销售区域或测量的土地。该图还显示，每个资源都可能被用于描述（used\
  \ to describe an aspect of）一个或多个 `COVERAGES`，其中 `COVERAGE` 是关于关于（by）一个 `RESOURCE`\
  \ 且关于（of）一个 `GEOGRAPHIC LOCATION` 的事实。\n\n\n\n\n\n`GEOGRAPHIC LOCATION`（地理位置）可以是`GEOGRAPHIC\
  \ AREA`（地理区域，所示）或`GEOGRAPHIC POINT`（地理点，在第四章中描述）。`GEOGRAPHIC AREA` 进一步可以是`GEOPOLITICAL\
  \ AREA`（地缘政治区域，如城市、州、国家等）、`MANAGEMENT AREA`（管理区域，其边界由企业定义，例如“西南销售区”）、`NATURAL AREA`（自然区域，如栖息地或湖泊）或`SURVEYED\
  \ AREA`（测量区域，其边界按镇、分区等单位具体测量）。在这些区域中，元数据领域通常只有`GEOPOLITICAL AREA`和`MANAGEMENT AREA`是受关注的兴趣点，但其中任何一个都可以由`RESOURCE`（资源）来描述。\n\
  \n### 柏林核心（The Dublin Core）\n\n前文提到的柏林核心已为其描述数据资源所需的基础属性集获得了 ISO 认证。如你所见，完整模型比描述文档的简单属性集要复杂一些，但实际上所有的柏林/ISO\
  \ 属性都被该模型涵盖了，如表 2-1 所示 [ISO 2003; DCMI 2005]。柏林核心指定的为“其他元素和元素细化”的附加属性也被该模型涵盖，其中大部分以`RESOURCE\
  \ STRUCTURE TYPES`（资源结构类型）的形式存在。\n\n表 2-1：柏林核心等效项。\n\n| 柏林核心术语 | 元数据元素 |\n| :---\
