  \ — 未知\n\n### 活动与架构框架\n\n架构框架中的“活动”列（见图 3-1）涉及企业`如何`执行其工作。\n\n![image](img/B9780120887989500048_f03-01-9780120887989.jpg)\n\
  图 3-1 活动列。\n\n*   `planner`（规划者）查看企业的愿景和使命，并规划组织如何运作的方法。\n*   `business owner`（业务所有者）看到业务的整体功能，以及占据其日常生活的实际流程，这些流程涉及执行机制、参与人员以及双方沟通的方式。\n\
  *   `architect`（架构师）将流程视为业务功能的表达，而不考虑执行它们所需的系统和其他机制。架构师随后根据对外部事件的响应对其进行组织。\n*  \
  \ `designer`（设计者）关注为了协助执行流程而创建程序的结构。\n*   `builder`（构建者）深度参与编程语言以及创建系统所需的其他技术的复杂细节。\n\
  *   `functioning system`（运行系统）是程序和其他技术的清单，以及跟踪它们使用情况的流程。\n\n图 3-1 显示了框架，并强调了本章将处理的单元格。这些单元代表了业务所有者、架构师、设计者和运行系统的视图。\n\
  \n### 定义\n\n在原始框架中，John Zachman 将第二列标记为 `Function`（功能）。在原始的数据流图表示法以及后来的业务流程重组中，公司所做的被称为\
  \ `process`（流程）。在日常对话中，我们谈论 `activities`（活动）。事实上，在日常对话中，这三个术语被混用，仿佛它们是同义词一样。但对于我们来说，对这些术语进行区分是非常重要的。\n\
  \n*   `activity`（活动）：涵盖以下所有术语的最通用超类型。\n*   `function`（功能）是一种为实现企业目标的活动。它完全根据其预期完成的任务来描述，而不考虑执行它时使用的技术或由谁来执行。这种描述同样不参考时间。功能代表了第二行中“业务所有者视图”的概念版本。它们从全局视角（企业的使命是什么？）开始，并可能被拆解以显示大量的细节。\n\
  *   `process`（流程）是企业为产生特定输出或实现目标而执行的活动类型。可以根据、也可以不根据所使用的机制或执行它的参与方进行描述。一组流程通常按顺序描述。`business\
  \ process`（业务流程）描述了由业务人员执行的活动，包括涉及的机制。这属于第二行“业务所有者视图”的领域。或者，第三行的架构师看到的是 `system\
  \ process`（系统流程），它是关于执行流程所涉及的数据转换的。无论哪种，流程都可以从高层或原子级进行查看。\n\n图 3-2 显示了 `ACTIVITY`（活动）的第二行（业务所有者视图），`FUNCTION`\
  \ 和 `BUSINESS PROCESS` 是子类型。稍后将详细介绍。\n\n![image](img/B9780120887989500048_f03-02-9780120887989.jpg)\n\
  图 3-2 活动、功能与流程。\n\n术语在表 3-1 中进行了比较。对于本书，术语 `activity` 将作为架构框架列的标题，因为它涵盖了所有概念，尽管在该模型中\
  \ `ACTIVITY` 将与 `SYSTEM PROCESS`（系统流程）区分开，后者在第三行部分描述（见第 142 至 157 页）。\n\n表 3-1\n\
  \n活动类型。\n\n![image](img/B9780120887989500048_cetable1.png)\n\n\n\n\n\n描述活动建模的一个困难在于，实现它的方法实在太多了！诚然地说，其底层概念是非常通用的，但仅仅看现有的各种技术，你永远无法发现这一点。\n\
  \n### 过程建模的演变\n\n第一种通用的过程模型几乎同时由 Tom DeMarco [DeMarco 1978] 以及 Chris Gane 和 Trish\
  \ Sarson [Gane and Sarson 1979] 引入。这就是`数据流图`（data flow diagram），它提供了一种表示过程、外部实体（数据的最终来源和终点）以及`数据存储`（数据在过程之间临时存放的地方）之间数据流的方法。它包含了将过程分解为更详细细节。此外，作者们区分了`物理数据流图`和`逻辑数据流图`。DeMarco\
  \ 先生扩展了这些思想，描述了从当前物理数据流图到逻辑数据流图，再到新的物理数据流图的转换。\n\n然而，DeMarco 先生对于如何区分物理数据流图和逻辑数据流图显得有些模糊。直到\
  \ James McMenamin 和 John Palmer 出版了《本质系统分析》（Essential Systems Analysis）[McMenamin\
  \ and Palmer 1984]，这一过程才被形式化。McMenamin 和 Palmer 先生提出了`本质数据流图`（essential data flow\
  \ diagram）的概念。它的特征是由`本质过程`（essential processes）构成的，这些过程被定义为对外部事件的完整响应。本质过程又被细分为`基础过程`（fundamental\
  \ processes，负责执行企业工作）和`托管过程`（custodial processes，负责维护基础过程所需的数据）。\n\n在 20 世纪 90 年代初，`业务流程重组`主题变得流行，并导致了\
  \ Geary Rummler 和 Alan Brache 所说的`流程图`（process map）的兴起[Rummler and Brache 1995]。这些与物理数据流图类似，但它们根据执行过程的部门或人员来组织过程。它们与其关注正在通信的数据，不如说关注用通用语言表达的任务序列；它们不再关注物理和逻辑数据流，而是简单地反映了当前存在（“现状”）以及作为分析结果而规划的（“目标态”）的任务结构。\n\
  \n### 用例与 IDEF 系列\n\n不久之后，`用例`（use cases）在面向对象的世界中流行起来。这种技术最初由 Ivar Jacobson 描述[Jacobson\
  \ 1992]，随后由 Alistair Cockburn [Cockburn 2000] 等人进行了详述。这些也与数据流图相似，之处在于它们在外部实体（此处称为“用例者”）和过程之间有通信，但假设是所涉及的过程代表了计算机系统（通常只显示为代表整个系统的单一过程）。数据流的内容没有被记录，而且这些细节并不是被分解为更低级的细节，而是简单地用文本描述为“步骤”。这里没有在中间数据存储中存储数据的概念。\n\
  \n与此同时，当 Sarson 女士以及 DeMarco 和 Gane 先生发明数据流图时，联邦政府正启动其集成计算机辅助制造（ICAM）项目。这是一种设计和建造飞机机的方法。这项工作产生了一些建模技术，后来被\
  \ ITT 规范为结构化分析与设计技术（SADT）。1981 年，空军认可了 SADT 的价值，并要求出一个适用于空军的版本。这就是`IDEF`系列建模技术的源头。*^*\n\
  \n“完整的 IDEF 集合（IDEF0、IDEF1 和 IDEF3——后来扩展包含 IDEF1X、IDEF4 和 IDEF5）, p. 7]。`IDEF1`\
  \ 是一种建模数据的通用方法，而 `IDEF1X` 专门解决关系数据库的设计。IDEF4 是一种观察面向对象设计的方法。IDEF5 提供了一种协助`本体`（ontologies）创建、修改和维护的方法。\n\
  \n`IDEF3` 是一种根据所做决策来描述流的方法，而 `IDEF0` 则用于简单的布局企业功能。根据 IDEF 网站，“IDEF0 是一种用于建模组织或系统的决策、行动和活动的方法”\
  \ [KBSI 2005]。\n\n1998 年，Clarence Feldmann 出版了《使用 IDEF0 进行业务流程重组的实用指南》（The Practical\
  \ Guide to Business Process Re-engineering Using IDEF0）[Feldmann 1998]，对该技术非常清晰的描述。然而，它讨论了“行动”，这使得功能与过程之间更微妙的区别未能得到解决。\n\
  \nIDEF0 在严谨性上与数据流图非常相似，尽管它没有显式地记录外部实体或数据存储。它对每个过程的逻辑结构建模，但在每个情况下都包含了添加箭头来描述所用机制的能力。UML\
  \ 提供的模型类型之一是过程模型 [Rumbaugh et al. 1999]。它的组织方式类似于 BPR 过程模型，取决于谁在进行处理，并且它有以“对象”形式存在的数据存储。它还有一个表示并行发生过程的显式符号。\n\
  \n###\n\n表 3-2 显示了上述技术及其主要特征。本书中元模型的目标是涵盖几乎所有这些技术揭示的概念。由于需要，每个实体类只能有一个名称（其中许多来自数据流图），但意图是提供一个能够适应所有方法的结构。\n\
  \n表 3-2\n\n技术对比。\n\n![image](img/B9780120887989500048_cetable2.png)\n\n## 第二行：功能与业务流程\n\
  \n接下来的章节将探讨功能和业务流程。\n\n### 功能\n\n`功能`（function）是业务执行的活动，描述时时不考虑执行它的任何机制、顺序或参与者。每个功能都旨在执行企业的“任务”，这就是为什么它们通常以分级形式呈现，任务位于顶部。也就是说，在任务下方通常呈现五个到九个执行它的功能。然后，这些每个功能进一步分解为另外五个到九个功能。重复这一过程，直到得到一组构成层级底部的基础业务功能。\n\
  \n\n\n\n\n`基础业务功能`被定义为最细粒度的函数。这种函数一旦启动，在不改变其性质的情况下无法停止 [Barker and Longman 1992,\
  \ p. 40]。公共图书馆的示例功能层级图见图 3-3。*\n\n![image](img/B9780120887989500048_f03-03-9780120887989.jpg)\n\
  \n图 3-3 功能层级示例。\n\n组织的**使命**（MISSION）与其**功能**（FUNCTIONS）不同之处在于，前者为公司所做的一切奠定了基调。它不仅仅是描述某件要做的事，更是组织持续运行的整体方法的陈述。**功能**倾向于简短的动词-名词组合（如“招聘员工”），而使命倾向于是一个复杂的句子，不仅描述了组织想要做什么（如“为社区提供甜甜圈”），还包含了对为什么要这么做的描述。它包含了诸如价值声明，例如“……从而增加该社区的快乐和愉悦”。\n\
  \n以功能层级图如图 3-3 所示的图书馆为例，其使命是“为恐龙县的所有公民和组织提供信息、学习和通俗阅读所需的材料和及”。更简洁地说，功能包括“管理读者账户”、“向读者借出书籍”等。请注意，“获取书籍和其他材料”被进一步细分为五个子功能。\n\
  \n图 3-4 显示了作为层级结构的的功能元模型，从顶部的组织**使命**开始，下方是许多**业务功能**，最后是底部的一组**基础业务功能**。也就是说，一个**使命**可以`通过`一个或多个**功能**执行。每个**其他功能**（即每个不是基础业务功能的功能）都可以`由`一个或多个**其他功能**或**基础业务功能**组成。\n\
  \n![image](img/B9780120887989500048_f03-04-9780120887989.jpg)\n\n图 3-4 功能。\n\n因此，每个**功能**必须`执行`一个**使命**或一个**其他功能**。注意，**使命**是灰色的。这里借用自第七章。之前提到过，每层应出现“五到九个”功能。这些数字并不是偶然得到的：在一项引人入胜的\
  \ 1956 年研究《神奇数字七，加减二：我们信息处理能力的某些限制》[Miller 1956]中，G. A. Miller 假设人类大脑在活动记忆中只能容纳七（加减二）“东西”。\n\
  \n这就是为什么我们以前能记住七位电话号码，但现在由于区码失去了意义，我们学习朋友新的 10 位号码时非常困难。当面对演示稿中的两个或三个要点时，我们认为它是微不足道的。*当面对\
  \ 10 个或更多点时，它看起来很复杂。简而言之，为了使功能层级易于理解，层级中的每一行应该只有七加减二个功能。\n\n建立**功能**层级是可能的，每个功能都符合之前描述的标准（没有机制或执行者，且没有顺序），一直直到**基础业务功能**。然而，越往下，人们越容易描述为了`实施`这些**功能**每一个而正在执行的实际**业务流程**。这在图\
  \ 3-4 中也有体现。\n\n### 业务流程\n\n`业务流程`是一种将物理材料或数据从一种状态转换为另一种状态的活动。由于上一个流程的输出通常被下一个流程使用，因此隐含了一个顺序。也可以描述用于执行每个过程的具体机制（表单、设备、计算机系统等）。\n\
  \n图 3-5 显示一个**功能**可以`通过`一个或多个**业务流程**`实施`。和**功能**一样，每个**其他业务流程**都可能`由`一个或多个**其他业务流程**或**基础业务流程**组成。\n\
  \n![image](img/B9780120887989500048_f03-05-9780120887989.jpg)\n\n图 3-5 业务流程。\n\n\
  根据定义，**基础业务功能**位于树的底部，因此它可能不`由`任何其他功能组成。\n\n\n\n\n\n图 3-7 引入了`核心业务流程`，它被定义为一组`基础业务流程`的集合，这些流程共同构成了对某种`外部业务事件类型`的完整响应。正如在第六章中详细讨论的那样，`外部业务事件类型`是发生在世界上的、在企业控制之外的事情。这不仅可能是某个发生的事，例如收到订单；它可能仅仅是时间的流逝，例如“季度末”或“每月初”。在这种情况下，`外部业务事件类型`的“时间指示”属性`必须设置为`为“真”。这与`内部业务事件类型`不同，后者是企业内部另一个`业务流程`的`动作`。\n\
  \n![image](img/B97801208879895000048_f03-07-9780120887989.jpg)\n\n图 3-7 核心业务流程。\n\
  \n一个`核心业务流程`必须是`基础业务流程`（直接用于`实施`某个`业务功能`）或`支撑业务流程`，后者为`基础业务流程`提供所需的数据。例如，“维护产品定义”的流程是一个`支撑业务功能`，用于支持`基础业务流程”“销售产品”。`内部事件类型`必须是任何类型`业务流程`的`触发器`，但`外部事件类型`必须具体地作为`核心业务流程`的`基础（定义）。\n\
  \n### 示例流程模型\n\n图 3-8 显示了前述功能层级模型所示描述的图书馆 3.4 和 3.5 功能的详细流程模型。它以“泳道”的形式组织，使得由同一部门执行的所有流程都在同一个泳道中。在这个示例中，收货部门的工作从“收到书籍”事件开始。然后，该部门通过与文件中存档的采购单“蓝色”副本进行比对，确认货物是正确的。（推测在订书时，采购单的蓝色副本已发送到收货部门以达到目的。）书籍被交给编目部门，该部门随后为其分配一个十威分类法，从而识别其分类——并据此确定其在图书馆中的准确位置。然后，书籍被放在书架上，并准备一张目录卡，描述该书籍并记录其十威分类号。^*\n\
  \n![image](img/B97801208879895000048_f03-08-9780120887989.jpg)\n\n图 3-8 示例业务流程模型。\n\
  \n收货部门还会在蓝色采购单副本上标记为“已收到”，并将其发送到应付账部门。（这等同于发送了一条消息“已收到书籍”）。当该部门随后收到供应商发的发票时，它将支付书籍的费用。图\
  \ 3-8 显示了三个`基础业务流程`。\n\n– 确认标题、数量\n– 分类书籍\n– 支付发票\n\n此外，还显示了四个`数据存储`：\n\n– 待处理订单\n\
  – 待付发票\n– 书架上的书籍\n– 更新后的目录卡\n\n所有这些元素，除了两个与发票有关的，都可以汇总为`核心业务流程`“接收每本书”。在这种情况下，控制性的`外部业务事件类型`是“收到书籍”。支付发票”不是这个`核心业务流程`的一部分，因为它不是由“收到书籍”事件触发的。相反，它是由`外部事件类型`“收到发票”和`内部事件类型”“收到书籍”组合触发的。\n\
  \n除了*外部*`事件类型`之外，组织内部`其他业务流程`经常触发`基础业务流程`和`其他业务流程`。这些触发（如之前描述的“收到书籍”消息）是`内部业务事件类型`的示例。也就是说，这些描述的是企业内部的、受控的事件。\n\
  \n### 业务流程的驱动\n\n在第七章中，我们将学习作为公司动力基础的手段和目的。然而，在这里理解这些概念是有用的，至少在某种程度上如此。在在该章中，你将学习企业实现目标的`手段`可以是`使命`或`行动方案`。在这种情况下，一种行动方案必须是`策略`或`战术`。\n\
  \n如图 3-9 所示，重要的是，这些`手段`对`业务流程`有影响。在可能的影响中，主要的是由`行动方案`发起的`努力`，通过使用`业务流程`来实现`预期结果`。\n\
  \n![image](img/B97801208879895000048_f03-09-9780120887989.jpg)\n\n图 3-9 努力。\n\n\
  例如，图书馆循环率提高 10%的目标可以通过“在当地报纸上登广告”这一`战术`的`努力`来实现。\n\n# 访问角色\n\n第五章描述了`人员`和`组织`对元模型的影响。在那里，你将看到更复杂的`位置`，但关于这一点请见第二章](#B9780120887989500036.htm_chapter2)，那里引入了`实体`，即个人或组织。`位置`是由`组织`定义的特定责任\
  \ set。\n\n图 3-10 显示了`实体`（个人或组织）或定义的`位置`可以是一个或多个`访问角色`的`执行者`。这涉及流程模型中的“泳道”。`访问角色`简单是指`实体`或`位置`处于企业的某个方面。在这种背景下，`访问角色`必须是`管理角色`、`规格角色`或`权限角色`，或者可以是`其他访问角色`。\n\
  \n![image](img/B97801208879895000048_f03-10-9780120887989.jpg)\n\n图 3-10 访问角色。\n\
  \n具体来说：\n\n–`管理角色`是关于管理`活动`的`实体`或`位置`。\n–`规格角色`描述了`实体`或`位置`负责*指定*具体的`活动`、`努力`或`手段`。\n\
  –`权限角色`断言`实体`或`位置`被*允许或禁止*参与`业务流程`。\n\n在之前的示例中，“编目员”这一`位置`（即编目部门的职责）是`基础业务流程`“书籍分类”的`管理角色`的`执行者`。\n\
  \n## 数据处理\n\n如果`业务流程`描述的是业务做什么，那么我们如何描述支持这些活动的相应数据处理呢？这些“数据处理”（在此处称为*系统流程*）将在本节中详细描述。再次，记住，这里说的“系统”仅是指以自动化所需的严谨性进行定义的。这使得它们的定义比为业务所有者描述的“业务流程”更严谨。`系统流程`不涉及任何可能采用的技术。\n\
  \n\n\n\n\n## 数据流图\n\n一种用于描述系统过程结构及其相互通信的经典且仍在使用使用的模型是`数据流图`。`图 3-11`展示了一个数据流图。`*`。该图与之前描述的二行过程模型（`(图\
  \ 3-8)`）有几处不同之处。首先，它具有更多的数据细节，具体描述了每条数据流的内容，并包含一个“记录货物到达”的过程。\n\n![image](img/B9780120887989500048_f03-11-9780120887989.jpg)\n\
  \n图 3-11 数据流图。\n\n其次，它不是用涉及的表单和机制来表示的。例如，过程模型中的卡片索引在这里被简单地描述为“图书存档”。这有助于人们避免假设在未来的系统中它必须以\
  \ 3 英寸乘 5 英寸纸质卡的格式存在。\n\n第三，`数据存储`——数据在等待其他过程停留的地方——被显式地显示为开放侧矩形。最后，系统过程模型与业务过程模型不同，因为它没有被组织成泳道（swim\
  \ lanes）。事实上，尽管在这个示例中，每个系统过程都识别出是由哪个部门在执行，但通常通常不这样做，以避免对任何未来的实现产生偏见。\n\n注意，这种记法也可以用于生成二行过程模型。“物理”数据流图根据所使用的机制来描述过程和数据流，正如之前描述的过程模型那样。事实上，这是一个很好的方法，因为它在描述数据流和数据存储方面提供了更详细的细节。\n\
  \n要得到三行的“逻辑”（或“本质”）数据流图，有必要：\n\n- 移除所有对物理机制的引用，将术语更改为描述涉及的实际数据的术语。\n- 移除任何仅作为“缓冲区”的数据存储，以解释两个过程之间处理速度的差异。\n\
  - 移除任何仅仅验证上一个过程结果的过程。（相反，修复上一个过程。）\n\n`图 3-12`跨越了框架中二行和三行的边界。它显示了每个业务过程可以通过一个或多个业务过程设计来执行，其中每个业务过程设计由一个系统过程来描述。因此，接收货物的业务过程通过以下系统（数据）过程执行：“记录收货”、“记录差异”、“向应付账部门发送货物已到的消息”等。\n\
  \n![image](img/B9780120887989500048_f03-12-9780120887989.jpg)\n\n图 3-12 业务过程与系统过程。\n\
  \n注意，与功能（FUNCTIONS）和业务过程（BUSINESS PROCESSES）一样，每个系统过程由一个或多个其他系统过程组成。这种关系实际上比这更复杂，如下所示，但正如此处所示，该概念是有效的。这支持了选取之前提到的过程之一（如“接收每本书”）并据此创建另一个数据流图，从而揭示其组成过程的想法。\n\
  \n## 系统过程与数据流\n\n`图 3-11`的数据流图显示了代表`系统过程`的圆角框，其中数据从一种结构转换为另一种结构。`数据流`（如“所需书籍的标题、作者”、“订单详情”等）由带标签的箭头表示。根据定义，所有数据都源于并最终到达直角框，称为`外部实体`，例如“读者”、“图书供应商”等。在我们的元模型中，这些外部实体几乎总是对应于我们的参与方（PARTIES）——无论是人员还是组织。\n\
  \n在图中，系统过程的示例包括“选择订购书籍”、“订购一套书籍”等。右侧开放的矩形代表`数据存储`，数据在被进一步处理之前可能会在那里停留一段时间。该图显示了两个数据存储：“待处理采购订单”（一份等待货物到达的订单列表）和“图书存档”（以前称为卡片索引的现代用词）。如上所述，箭头代表从一个系统过程、外部实体或数据存储到另一个的数据流。\n\
  \n数据流箭头和数据存储用标准英语对流和存储的内容进行标记。这些中的每一个都代表了一组数据实体类、关系和属性的`视图`，正如在`第二章`中讨论的那样。也就是说，每一个代表一个虚拟实体类（VIRTUAL\
  \ ENTITY CLASS），它包含一组重新构建的基础实体类（ENTITY CLASSES）、关系角色（RELATIONSHIP ROLES）和属性（ATTRIBUTES）（如在`第二章`中描述）。\n\
  \n`图 3-13`显示了数据流元模型的开始，这里`数据流`描述了数据如何从一个系统过程移动到另一个。事实上，一个系统过程可以是一个或多个数据流的源。之前引用的图书馆示例中，虚拟实体类“所需书籍的标题、作者”是从系统过程“选择订购书籍”到系统过程“订购一套书籍”的数据流。\n\
  \n![image](img/B9780120887989500048_f03-13-9780120887989.jpg)\n\n图 3-13 数据流与过程\n\
  \n处理通常不是连续的。处理之前可能需要数据。在三行模型中，这只是因为过程在等待数据。在二行模型中，它可以是一个“缓冲区”，仅仅是因为处理速度不相同。对于三行模型，此类数据存储必须移除。`图\
  \ 3-14`显示数据存储也是虚拟实体类的使用，并且它可以是数据流的源或终点。也就是说，数据流可能来自系统过程或指向数据存储。\n\n![image](img/B9780120887989500048_f03-14-9780120887989.jpg)\n\
  \n图 3-14 数据存储\n\n在示例中，“待处理采购订单”是一个数据存储，它是同名虚拟实体类的使用。该虚拟实体类由“读者”、“订单”、“项目”和“书籍”的实体类汇。“订单详情”是该虚拟实体类从数据存储“待处理采购订单”到系统过程“接收每本书”的流。\n\
  \n在业务所有者看来，过程很少与执行它们的机制和人员分开。但在创建三行数据流图时，不应再表示机制。尽管如此，在三行数据流中有必要显示所有数据的源和目的地，因此`图\
  \ 3-15`再次引入了第三列中的参与方（PARTY）和位置（POSITION）实体类。\n\n![image](img/B9780120887989500048_f03-15-9780120887989.jpg)\n\
  \n图 3-15 外部实体\n\n在这里你可以看到，除了目前所看到的之外，数据流还可以来自或指向指定的参与方（例如“莎拉·琼斯”或“会计部门”），或者简单定义为来自或指向某个位置，例如“首席会计”。这些都是外部实体的示例。在示例中，外部实体“目录服务”和“图书供应商”将是公司（组织的一种）；“恐龙县”（政府）是一个政府机构；而“读者”可以被视为参与方类型（PARTY\
  \ TYPE）。\n\n\n\n\n\n请注意，在第三行中，实际上很少看到数据流被标识为指向（to）或来自（from）某个人。涉及的`PARTY`（参与者）通常是一个`ORGANIZATION`（组织），例如供应商公司或部门。图\
  \ 3-15 显示，`DATA FLOW`（数据流）必须来自以下之一：\n\n- `PARTY`（参与者）\n- `PARTY TYPE`（参与者类型）\n-\
  \ `POSITION`（位置）\n- `SYSTEM PROCESS`（系统过程）\n- `DATA STORE`（数据存储）\n\n此外，它必须指向相同实体类之一。\n\
  \n## 访问角色与系统事件\n\n在之前的示例图中，从外部实体“图书供应商”到过程“接收每本书”的数据流线被标记为“书籍发运”。该流实际上并不需要包含任何信息，除了收到书籍这一事实之外。由于这个原因，与其说它是一个`DATA\
  \ FLOW`，不如说它是一个`SYSTEM EVENT TYPE`（系统事件类型），如图 3-16 所示。也就是说，`SYSTEM EVENT TYPE`是发送给过程的消息，导致某些事情的发生。它可能不包含任何待处理的数据。相反，它仅仅是过程的触发器。`SYSTEM\
  \ EVENT TYPE`必须来自另一个`SYSTEM PROCESS`，或者来自一个`PARTY`或`POSITION`，或者必须是另一个`SYSTEM PROCESS`的操作。在后一种，由于`SYSTEM\
  \ EVENT TYPE`是一个时间点，而`SYSTEM PROCESS`是随时间发生的，因此`SYSTEM EVENT TYPE`具有与`BUSINESS EVENT\
  \ TYPE`（业务事件类型）相同的属性——即之前描述的“位置”、“滞后数量”和“滞后单位”。\n\n![image](img/B9780120887989500048_f03-16-9780120887989.jpg)\n\
  \n图 3-16 系统事件类型。\n\n如前所述，我们在这里只关注事件类型，即事件类型的定义。该示例是关于接收书籍的概念，而不是 7 月 18 日的实际收据。注意，适用于`BUSINESS\
  \ PROCESS`的`MANAGEMENT ROLE`（管理角色）也适用于`SYSTEM PROCESS`。\n\n## 核心系统过程\n\n之前谈论`FUNCTIONS`（功能）和`BUSINESS\
  \ PROCESSES`（业务过程）时，强调了这样一个事实：在最低层面可以找到`ELEMENTARY FUNCTIONS`（基础功能）和`ELEMENTARY\
  \ BUSINESS PROCESSES`（基础业务过程）。如图 3-17 所示，在分析`SYSTEM PROCESS`的层次结构时也可以发现类似的内容——`ELEMENTARY\
  \ SYSTEM PROCESS`（基础系统过程）。与`ELEMENTARY FUNCTIONS`和`ELEMENTARY BUSINESS PROCESSES`一样，`ELEMENTARY\
  \ SYSTEM PROCESS`是保留其身份的最小工作单元。你可以通过意识到这一点来识别这个最原化的过程：一旦一旦开始，说它在完成之前可以停止是没有意义的。因此，每个`OTHER\
  \ SYSTEM PROCESS`可能由一个或多个`OTHER SYSTEM PROCESSES`、`ESSENTIAL SYSTEM PROCESSES`（核心系统过程）和/或`ELEMENTARY\
  \ SYSTEM PROCESSES`组成。\n\n![image](img/B9780120887989500048_f03-17-9780120887989.jpg)\n\
  \n图 3-17 核心系统过程。\n\n`EXTERNAL BUSINESS EVENT TYPES`（外部业务事件类型）将`ELEMENTARY BUSINESS\
  \ PROCESSES`组合成`ESSENTIAL BUSINESS PROCESSES`。同样，`ELEMENTARY SYSTEM PROCESSES`可以通过`SYSTEM\
  \ EVENT TYPES`分组，以创建一个`ESSENTIAL SYSTEM PROCESS` [McMenamin and Palmer 1984]。\n\n\
  之前我们断言，`SYSTEM PROCESS`可以由`SYSTEM EVENT TYPE`触发。同样，我们寻找的是代表对外部事件的“完整响应”的过程级别。例如，当收到客户订单时（一个`SYSTEM\
  \ EVENT TYPE`），可能需要许多步骤来先填写订单，然后进行订单装入。这些步骤中的每一步都可以合理地称为一个`SYSTEM PROCESS`（具体来说是一个`ELEMENTARY\
  \ SYSTEM PROCESS`）。但整个努力的目标是完成订单。\n\n包含所有这些`ELEMENTARY SYSTEM PROCESSES`的`SYSTEM\
  \ PROCESS`在这里被称为`ESSENTIAL SYSTEM PROCESS`。也就是说，根据定义，`ESSENTIAL SYSTEM PROCESS`必须是对特定`EVENT\
  \ TYPE`（由其定义）的完整响应。注意，虽然每个`ESSENTIAL SYSTEM PROCESS`必须由恰好一个`SYSTEM EVENT TYPE`定义，但它可能由一个或多个`ELEMENTARY\
  \ SYSTEM PROCESSES`组成。\n\n与`ESSENTIAL BUSINESS PROCESSES`一样，重要的是，只有“外部”的`SYSTEM\
  \ EVENTS`可以作为定义`ESSENTIAL SYSTEM PROCESS`的依据。在`BUSINESS EVENT TYPE`的情况下，这种区别在子类型`EXTERNAL\
  \ BUSINESS EVENT`（外部业务事件）和`INTERNAL BUSINESS EVENT`（内部业务事件）中体现，而在在这里通过“外部指示器”（External\
  \ indicator）属性显示。如果`SYSTEM EVENT TYPE`是外部的，该属性值为“True”。否则，为“False”。\n\n## 业务规则\n\
  \n如果`SYSTEM EVENT TYPE`是`ESSENTIAL SYSTEM PROCESS`的依据，则属性“外部指示器”的值必须为“True”。\n\n\
  图 3-17 也显示，在`ESSENTIAL BUSINESS PROCESS`的情况下，一个`FUNDAMENTAL PROCESS`（基础过程）是由一个的`CUSTODIAL\
  \ PROCESS`（维护过程）触发的`FUNDAMENTAL PROCESS`。为了执行该`FUNDAMENTAL PROCESS`，需要一些数据。这些`CUSTODIAL\
  \ PROCESS`是负责维护数据的，由`SYSTEM EVENT TYPES`定义。图 3-18 显示了为了构成“接收每本书”这一`ESSENTIAL SYSTEM\
  \ PROCESS`的集合。为了简单起见，在更高层删除了`ORGANIZATIONS`（组织）。\n\n![image](img/B9780120887989500048_f03-18-9780120887989.jpg)\n\
  \n图 3-18 示例数据流。\n\n指向这些外部实体的`DATA FLOWS`在过程边界处标记了 X。除了该事件外，还有其他通信没有带到摘要层。这些在边界处也标记了\
  \ X。\n\n业务规则\n\n1. 在分解过程中识别的外部实体、数据流和数据存储不需要出现在更高层次的过程中。\n2. 高层次过程中描绘的每个数据存储、外部实体和数据流必须出现在其分解中。\n\
  \n## 第四行：程序模块\n\n一旦映射了活动——过程，就可以询问这些哪些活动应该自动化。此外，当业务规则（在第七章中描述）完整记录后，就可以询问它们将如何实现。这种实现将通过程序模块进行。第四行涉及这些模块的设计。因此，设计者的活动列完全是关于程序的。\n\
  \n## 模块结构\n\n`PROGRAM MODULE`是执行业务任务的程序代码。这可能是数据的处理、报告的或某些内部处理或计算。每个`PROGRAM MODULE`必须用`PROGRAMMING\
  \ LANGUAGE`（编程语言）编写，例如 Java、C++、COBOL 甚至 FORTRAN。这在图 3-19 中所示。在图中，显示了七种类型的`PROGRAM\
  \ MODULES`。当我们以后讨论面向对象时，会添加更多，但目前足够了。\n\n![image](img/B9780120887989500048_f03-19-9780120887989.jpg)\n\
  \n图 3-19 模块。\n\n- `DBMS TRIGGER`：与数据库`TABLE`或`COLUMN`关联的代码段，在发生指定操作（如更新`COLUMN`）时激活。\n\
  - `STORED PROCEDURE`：存储在数据库管理系统中的程序代码，用于控制数据的更新和检索。\n\n\n\n\n\n## 模块定义\n\n- `DATABASE\
  \ MANAGEMENT SYSTEM`：一种复杂的软件，执行许多与数据存储和检索相关的有用功能，并在保护数据完整性方面起着关键作用。\n- `SYSTEM MODULE`：一个操作系统或操作系统的部分（包括服务器软件和服务）。\n\
  - `UTILITY`：一种执行支持性功能的程序，为其他软件的用户提供服务。\n- `INTERACTIVE MODULE`：控制屏幕元素（其窗口、光标等）的程序代码。\n\
  - `OTHER EXECUTABLE MODULE`：其他所有内容。\n\n该模型还显示，每个 `PROGRAM MODULE` 必须是恰好一个 `PROGRAM\
  \ MODULE TYPE` 的实例。这些中的第一个类型与作为 `PROGRAM MODULE` 自身的子类型所示的类型相同。每个 `PROGRAM MODULE\
  \ TYPE` 可以是两个或多个其他 `PROGRAM MODULE TYPE` 的父类型。正如我们之前看到的，这种结构允许基于它的系统的用户定义比模型中所示更详细的类型。\n\
  \n## 业务规则\n\n`PROGRAM MODULE TYPE` 的第一个实例必须是 `DBMS Trigger`、`Stored procedure`（存储过程）等，以与之前所示的子类型相对应。\n\
  \n可以描述一个代表模块处理过程的场景。这加上程序代码本身，都是 `PROGRAM MODULE` 的属性。`PROGRAM MODULES` 可以以至少三种不同的方式链接。\n\
  \n首先，`PROGRAM MODULE` 可能由一个或多个其他 `PROGRAM MODULES` 组成。图 3-20 则显示，每个 `PROGRAM MODULE\
  \ COMPOSITION` 必须是在另一个 `PROGRAM MODULE` 中使用 `PROGRAM MODULE`。\n\n![image](img/B9780120887989500048_f03-20-9780120887989.jpg)\n\
  \n图 3-20 程序模块链接。\n\n其次，图中显示每个 `PROGRAM MODULE` 可能依赖于另一个 `PROGRAM MODULE`。也就是说，每个\
  \ `PROGRAM MODULE` 都可能被另一个 `PROGRAM MODULE` 调用，这里表现为每个 `PROGRAM MODULE` 可能受到一个或多个\
  \ `PROGRAM MODULE DEPENDENCIES` 的影响，每个依赖必须位于另一个 `PROGRAM MODULE`。\n\n第三，每个 `PROGRAM\
  \ MODULE` 可能是向其他 `PROGRAM MODULES` 发出的一个或多个 `PROGRAM MODULE COMMUNICATIONS` 的源。注意，这些行四\
  \ `PROGRAM MODULE COMMUNICATIONS` 中的每一个可能是之前描述的行三 `DATA FLOW` 的实现。\n\n在数据库管理系统和面向对象设计之前，几乎所有的程序都属于\
  \ `OTHER EXECUTABLE MODULE` 类别。然而，正如本章其余部分所示，近年来这些区别变得越来越重要。\n\n图 3-21 总结了来自 图 3-20\
  \ 的链接。`PROGRAM MODULE STRUCTURE` 是包含 `PROGRAM MODULE DEPENDENCY`、`PROGRAM MODULE\
  \ COMMUNICATION` 和 `PROGRAM MODULE COMPOSITION` 的父类型，同时增加了 `OTHER PROGRAM MODULE\
  \ STRUCTURE` 的可能性。因此，每个 `PROGRAM MODULE STRUCTURE` 必须从一个 `PROGRAM MODULE` 到另一个 `PROGRAM\
  \ MODULE`。\n\n![image](img/B9780120887989500048_f03-21-9780120887989.jpg)\n\n图 3-21\
  \ 程序模块结构。\n\n正如实体类型有父类型一样，关系也可以有父类型。遗憾的是，这在实体关系图中并不容易显示。在这种情况下，关系“每个 `PROGRAM MODULE\
  \ STRUCTURE` 必须来自一个且仅一个 `PROGRAM MODULE`”具有以下子类型：\n\n- 每个 `PROGRAM MODULE DEPENDENCY`\
  \ 必须属于一个且仅一个 `PROGRAM MODULE`。这包括子程序调用。\n- 每个 `PROGRAM MODULE COMMUNICATION` 必须来自一个且仅一个\
  \ `PROGRAM MODULE`，包括从一个 `PROGRAM MODULE` 发送到另一个的类型类型。消息将在对象模块章节中讨论（请参见第 171 页）。\n\
  - 每个 `PROGRAM MODULE DECOMPOSITION` 必须使用一个且仅一个 `PROGRAM MODULE`。一个大型 `PROGRAM MODULE`（实际上是一个程序模块组）可能由一个或多个其他\
  \ `PROGRAM MODULES` 组成。\n\n当然，相反的关系角色也有相应的子类型结构。这非常重要，因为为了清晰地解释这里介绍的概念，有时在介绍更通用的父类型关系之前，呈现两个子类型之间的关系。遗憾的是，子类型级别使用的语言并不总是与父类型级别的语言对应。\n\
  \n在书中，作者尝试了两种方法。在这种情况下，图 3-20 中看到的子类型关系名称未出现在 图 3-21 中，尽管它们继续存在于底层模型中。^* 在其他情况下，父类型名称并不总是对应。图\
  \ 3-22 显示 `PROGRAM MODULE STRUCTURE` 是包含 `PROGRAM MODULE DEPENDENCY`、`PROGRAM MODULE\
  \ COMMUNICATION` 和 `PROGRAM MODULE COMPOSITION` 的父类型，同时增加了 `OTHER PROGRAM MODULE\
  \ STRUCTURE` 的可能性。因此，每个 `PROGRAM MODULE STRUCTURE` 必须从一个 `PROGRAM MODULE` 到另一个 `PROGRAM\
  \ MODULE`。\n\n![image](img/B9780120887989500048_f03-22-9780120887989.jpg)\n\n图 3-22\
  \ 。\n\n正如实体类型有父类型一样，关系也可以有父类型。遗憾的是，这在实体关系图中并不容易显示。在这种情况下，关系“每个 `PROGRAM MODULE STRUCTURE`\
  \ 必须来自一个且仅一个 `PROGRAM MODULE`”具有以下子类型：\n\n- 每个 `PROGRAM MODULE DEPENDENCY` 必须属于一个且仅一个\
  \ `PROGRAM MODULE`。这包括子程序调用。\n- 每个 `PROGRAM MODULE COMMUNICATION` 必须来自一个且仅一个 `PROGRAM\
  \ MODULE`，包括从一个 `PROGRAM MODULE` 发送到另一个的类型类型。消息将在对象模块章节中讨论（请参见第 171 页）。\n- 每个 `PROGRAM\
  \ MODULE DECOMPOSITION` 必须使用一个且仅一个 `PROGRAM MODULE`。一个大型 `PROGRAM MODULE`（实际上是一个程序模块组）可能由一个或多个其他\
  \ `PROGRAM MODULES` 组成。\n\n当然，相反的关系角色也有相应的子类型结构。这非常重要，因为为了清晰地解释这里介绍的概念，有时在介绍更通用的父类型关系之前，呈现两个子类型之间的关系。遗憾的是，子类型级别使用的语言并不总是与父类型级别的语言对应。\n\
  \n在书中，作者尝试了两种方法。在这种情况下，图 3-20 中看到的子类型关系名称未出现在 图 3-21 中，尽管它们继续存在于底层模型中。^* 在其他情况下，父类型名称并不总是对应。图\
  \ 3-22 显示 `PROGRAM MODULE STRUCTURE` 是包含 `PROGRAM MODULE DEPENDENCY`、`PROGRAM MODULE\
  \ COMMUNICATION` 和 `PROGRAM MODULE COMPOSITION` 的父类型，同时增加了 `OTHER PROGRAM MODULE\
  \ STRUCTURE` 的可能性。因此，每个 `PROGRAM MODULE STRUCTURE` 必须从一个 `PROGRAM MODULE` 到另一个 `PROGRAM\
  \ MODULE`。\n\n![image](img/B9780120887989500048_f03-22-9780120887989.jpg)\n\n图 3-22\
  \ 。\n\n图 3-24 显示 `MODULE USAGE`——即特定的 `PROGRAM MODULE` 特别创建、检索、更新或删除整个 `DATA GROUP`\
  \ 或特定 `COLUMN` 的实例。每个属性标识了是否执行了该操作。\n\n![image](img/B9780120887989500048_f03-24-9780120887989.jpg)\n\
  \n图 3-24 。\n\n## 程序角色\n\n不同的人和组织在创建 `PROGRAM MODULES` 时扮演不同的角色，无论是单个 `PROGRAM MODULE`\
  \ 还是更复杂的 `APPLICATION SYSTEMS`。这些角色可能包括各种类型的程序员、经理或管理员。图 3-25 借用了第五章的内容来显示 `PARTY`、`ACCESS\
  \ ROLE` 和 `ACCESS ROLE TYPE`。`ACCESS ROLE` 是一个复杂的话题，在第五章 中详细讨论，但这里显示了 `ACCESS ROLE`\
  \ 的三个子类型：\n\n![image](img/B9780120887989500048_f03-25-9780120887989.jpg)\n\n图 3-25\
  \ 访问角色。\n\n- `PROGRAMMING ROLE`：简单是指某个 `PARTY`（或 `POSITION` 等）与创建 `PROGRAM MODULE`\
  \ 或 `APPLICATION SYSTEM` 的某些方面有关。\n- `MANAGEMENT ROLE`：指某个 `PARTY` 负责 `PROGRAM MODULE`\
  \ 或 `APPLICATION SYSTEM` 的开发或部署。\n\n\n\n\n– `PERMISSION ROLE`：指 `PARTY`（主体）被允许或禁止访问\
  \ `PROGRAM MODULE`（程序模块）或整个 `APPLICATION SYSTEM`（应用程序系统）。如果该角色表示 `PARTY` 被禁止访问 `PROGRAM\
  \ MODULE` 或 `APPLICATION SYSTEM`，则属性 `Prohibition indicator`（禁止指示）为 `True`；如果该角色表示允许，则为\
  \ `False`。\n\n在这里我们引入一个断言：每个 `ACCESS ROLE`（访问角色）必须是某种 `ACCESS ROLE TYPE`（访问角色类型）的实例。这些类型必须包括\
  \ `Programming role`（编程角色）、`Management role`（管理角色）和 `Permission role`（权限角色）。每个 `ACCESS\
  \ ROLE TYPE` 可以是两个或多个 `ACCESS ROLE TYPE` 的超类型，因此 `Program module role` 可以是 `Programmer`（程序员）和\
  \ `Programming manager`（编程经理）等角色的超类型。\n\n或者，如果不需要更多细节，`Programmer` 和 `Programming\
  \ manager` 可以仅仅是 `PROGRAM MODULE ROLE`（程序模块角色）的实例。\n\n## 业务规则\n\n1. `ACCESS ROLE\
  \ TYPE` 的一个实例必须是 `Programming role`。\n2. 如果一个 `ACCESS ROLE` 是 `PROGRAMMING ROLE`，它可能仅针对一个\
  \ `PROGRAM MODULE` 或 `APPLICATION SYSTEM`。\n\n`APPLICATION SYSTEM` 一词的常见用法通常比之前描述的要缺乏律得多。公司往往认为一个程序模块或表被多个应用程序系统所有。但如果要成功管理它们，系统的每个元素的责任必须根据最初负责其创建的特定项目（`APPLICATION\
  \ SYSTEM`）来指定。\n\n鉴于这种责任划分，访问权限可以广泛分布。一旦 `APPLICATION SYSTEMS` 经过仔细定义，通常 `ACCESS\
  \ ROLES` 可以完全根据它们来定义，而对访问特定 `PROGRAM MODULES` 或 `TABLES`（表）的需求降至最低。\n\n有时 `PROGRAM\
  \ MODULES` 是为了生成其他 `PROGRAM MODULES` 而编写的。图 3-26 显示，`GENERATION SPECIFICATION`（生成规范）可以针对一个\
  \ `PROGRAM MODULE`，并根据一个 `DATA GROUP`（数据组），该数据组包含了该 `PROGRAM MODULE` 的实际规范。一旦创建了\
  \ `GENERATION SPECIFICATION` 中作为生成器的 `PROGRAM MODULE`，当它运行时（在“生成日期”上），它将成为一个或多个其他\
  \ `PROGRAM MODULES` 的 `GENERATIONS`（生成）的基础。\n\n![image](img/B9780120887989500048_f03-26-9780120887989.jpg)\n\
  \n图 3-26 模块生成。\n\n图 3-27 显示四行构件 `PROGRAM MODULE` 也基于一个或多个三行 `SYSTEM PROCESSES`（系统过程）。具体而言，它可能基于一个或多个\
  \ `PROCESS IMPLEMENTATIONS`（过程实现），每个实现必须属于且仅属于一个 `SYSTEM PROCESS`。然而，一个 `SYSTEM\
  \ PROCESS` 可以是 `PROGRAM MODULE` 或整个 `APPLICATION SYSTEM` 的来源。也就是说，一个 `SYSTEM PROCESS`\
  \ 不仅可以作为单个 `PROGRAM MODULES` 存在于一个或多个实现中，也可以作为完整的 `APPLICATION SYSTEMS` 存在于一个或多个实现中。\n\
  \n![image](img/B9780120887989500048_f03-27-9780120887989.jpg)\n\n图 3-27 过程实现。\n\n\
  ## 对象模块\n\n图 3-28 显示了两种新的 `PROGRAM MODULE` 类型。第一，`CLASS IMPLEMENTATION`（类实现，如第二章\
  \ 所示）扮演了四行数据项的角色，但它实际上是一段代码。因此，它在该章节中被描述并在处被高亮显示。`CLASS IMPLEMENTATION` 在第二章 中被描述为描述类（“类”）对象的代码。它可以指的是一个\
  \ `BUSINESS ENTITY CLASS`（业务实体类），也可以对计算机系统部分的“对象”进行分类，例如窗口光标、屏幕窗口和其他元素。\n\n![image](img/B9780120887989500048_f03-28-9780120887989.jpg)\n\
  \n图 3-28 可执行模块的类型。\n\n第二种 `PROGRAM MODULE` 是 `EXECUTABLE MODULE`（可执行模块）。这是老手们会简单记忆为曾经被称为“计算机程序”的代码。也就是说，它是任何执行某些操作程序（或程序组件）。注意（如图\
  \ 3-28 所示），`EXECUTABLE MODULE` 包含了之前介绍的七种子类型，再加上两个新的、专门面向对象的类型：\n\n- `METHOD`：执行\
  \ `OPERATION`（操作）的程序。\n- `PACKAGE`：`CLASS IMPLEMENTATIONS` 的集合。也就是说，一个 `PACKAGE`\
  \ 可以由一个或多个 `CLASS IMPLEMENTATIONS` 组成。\n\n\n\n\n`MESSAGE` 存在于对象之间，是 `PROGRAM MODULE`\
  \ 运行时发生的实际通信。因此，每个 `MESSAGE` 必须是 `MESSAGE TYPE` 的一个实例，而 `MESSAGE TYPE` 被设计为 `PROGRAM\
  \ MODULE` 的一部分。具体而言，每个 `MESSAGE TYPE` 必须由一个 `OPERATION` 发送，并可以调用另一个 `OPERATION`。每个\
  \ `MESSAGE TYPE` 还必须通过 `PROGRAM MODULE COMMUNICATION`（即两个 `PROGRAM MODULES` 之间的链接）进行。`MESSAGE\
  \ TYPE` 必须是以下类型之一：\n\n*   `INFORMATIVE MESSAGE TYPE`（信息消息类型），为对象提供更新自身的信息\n*   `INTERROGATIVE\
  \ MESSAGE TYPE`（查询消息类型），请求对象披露自身信息\n*   `IMPERATIVE MESSAGE TYPE`（命令消息类型），请求对象对其执行某些操作\n\
  \n每个 `MESSAGE` 可能包含一个或多个输入或输出 `MESSAGE ARGUMENTS`，如图 3-31 所示。每个 `MESSAGE ARGUMENT`\
  \ 必须针对特定的 `MESSAGE`，并且可以是指向另一个 `OBJECT` 的引用。同样，由于 `MESSAGES` 只存在于运行时，它们的 `MESSAGE\
  \ ARGUMENTS` 也是如此。因此，`MESSAGE TYPE` 的定义也包含了 `MESSAGE ARGUMENT TYPE`。\n\n![image](img/B9780120887989500048_f03-31-9780120887989.jpg)\n\
  \n图 3-31 参数。\n\n`MESSAGE` 参数可以是输入参数也可以是输出参数，这由每个 `MESSAGE ARGUMENT TYPE` 的“In indicator”（输入指示）和“Out\
  \ indicator”（输出指示）的值决定。这两个指示都存在，因为同一个 `MESSAGE ARGUMENT TYPE` 既可以是输入参数也可以输出参数。在程序中，这些参数显示为输入参数在前（可选跟在单词“in”），随后是单词“out”和输出参数，可选跟在“inout”以及任何既是输入又是输出的参数。\n\
  \n在 Page-Jones 先生的示例中，如果 `PROGRAM MODULE`（一个 `PACKAGE`）`hom1` 的执行创建了一个类为 `Hominoid`\
  \ 的 `OBJECT`，则 `MESSAGE TYPE` `advance` 被指定为 `hom1.advance(noOfSquares, out advanceOK)`。在这里，`noOfSquares`\
  \ 是输入参数（要移动的格子数），`advanceOK` 是输出参数（“True”或“False”，取决于移动是否成功）[Page-Jones 2000, p.\
  \ 22]。同样，`advance` 的运行时实例将有一个对象 ID，并且实际上会移动特定数量的格子（例如“5”）。\n\n每个 `MESSAGE ARGUMENT`\
  \ 本身通常是对 `OBJECT` 的引用，这反映了每个 `MESSAGE ARGUMENT TYPE` 可能是 `CLASS IMPLEMENTATION`\
  \ 的引用。这可以是指向“基础类”（Foundation Class）中对象的引用——例如，整数、字符或类似的类型。在以前的示例中，`MESSAGE ARGUMENT\
  \ TYPE` “noOfSquares”可以引用 `IMPLEMENTATION CLASS` “Integer”中的对象。\n\n## 第六行：程序清单](#B9780120887989500048.htm_fn14)\n\
  \n第六行涉及现有系统的清单。这不仅包括内部开发的系统，还包括商业现成软件包。在第四行中，我们设计了程序，确定了它们的结构，并定义了它们如何使用数据。第五行将涉及编码工作。第六行则是我们记录已产生的实际程序副本，以及它们产生和使用的数据（在第二章中进行描述）。\n\
  \n图 3-32 显示了在第四行设计的每个 `PROGRAM MODULE` 的 `PROGRAM COPIES`。因此，每个 `PROGRAM COPY` 必须属于一个\
  \ `PROGRAM MODULE`，并且必须保存在作为 `SERVER` 的 `VIRTUAL SITE` 中。`SERVER` 在第四章中有更详细的定义，它是支持程序持续运行的操作系统，使得\
  \ `PROGRAM MODULE` 能够与其他程序异步交互。也就是说，`SERVER` 身通过一个或多个 `SERVER IMPLEMENTATIONS` 实现，其中每个实现都必须是对另一个\
  \ `PROGRAM COPY` 的使用。\n\n![image](img/B9780120887989500048_f03-32-9780120887989.jpg)\n\
  \n图 3-32 程序副本。\n\n这意味着，例如 Oracle 数据库管理系统的 `PROGRAM COPY` 可以用作单独 `SERVERS` 的一个或多个\
  \ `SERVER IMPLEMENTATIONS`。这也被称为数据库管理系统具有多个实例。\n\n图 3-33 描述了 `PROGRAM COPY` 的运行、它产生的数据以及产生这些数据所使用的数据。具体而言，`TRANSFORMATION\
  \ RUN` 必须是 `PROGRAM COPY` 的实现，在特定的“Run date”（运行日期）上执行。\n\n\n\n\n\n给任何尝试实现此操作者的提示：在尝试生成测试数据库设计之前，确保你已经减少了概念模型中的关系数量。如果不这样做，你将导致额外的外键。\n\
  \n我听说现在这种现象的时髦说法是*应用程序组合集*（application portfolio）。由于我们谈论的是存储在某处的程序集合，我觉得*清单*（inventory）一词更合适，且不那么自命。\n\
  \n# 4 位置 (LOCATIONS)\n\n网络——任何以等距离网格化或交叉，且交叉点之间有间隙的物体。萨缪尔·约翰逊 [1755]\n\n## 关于位置\n\
  \n架构框架中的“位置”（Locations）列关注企业开展业务的*地点*。\n\n- `规划者`（planner）看到一组简单的企业位置，通常按城市划分。\n\
  - `业务所有者`（business owner）看到一组构成企业物流网络的办公室、工厂和仓库。\n- `架构师`（architect）看到每个位置在信息和通信处理中扮演的角色。\n\
  - `设计者`（designer）看到硬件和软件的潜在分布以及通信网络的设计。\n- `构建者`（builder）关注通信节点和协议的细节。\n- `运行系统`（functioning\
  \ system）由发生通信的设施组成。\n\n[图 4-1] 显示了架构框架，并突出了本章关注的单元。具体而言，这些是业务所有者、架构师、设计者和运行系统的视图。\n\
  \n![image](img/B9780120887989500005X_f04-01-9780120887989.jpg)\n\n图 4-1 位置列。\n\n\
  “位置”列既涉及事物所在之处，也涉及它们相互连接的网络。业务发生在哪里？它的组件之间如何通信？数据如何在地点与地点之间传输？我们将如何将技术布线在一起？这些问题的答案属于“位置”列的范畴。\n\
  \n对数据实体类或活动的*结构*进行建模，与对业务中的实体类或活动*本身*进行建模并不是回事。在我们的数据元模型中，我们关注的是例如“实体类”和“属性”的概念。在我们的活动模型中，我们关注的是“过程”和“功能”的概念。描述特定公司的实际实体类（例如\
  \ `PRODUCT`）和过程（例如“接受订单”）本身将在为该公司开发系统的过程中进行建模。但在大多数情况下，业务数据和元数据的领域是完全不同的。\n\n另一方面，位置在业务层面和元数据层面的建模方式基本上是相同的。正如第五章描述的“人员和组织”（People\
  \ and Organizations）列一样，“位置”列的中心实体类实际上取自通用业务模型。在业务模型和元模型中，我们必须对我们关注的位置进行建模，无论我们是在那里开展业务还是在那里运行系统。出于这个原因，正如第五章一样，本章模型的核心大量使用了《数据模型模式：思维惯》（*Data\
  \ Model Patterns: Conventions of Thought*）[[Hay 1996]]中介绍的位置业务模型。\n\n“位置”列与“人员和组织”列共享另一个特征：“位置”列和“人员和组织”列主要关乎*其他*列的位置和管理。具体而言，模型中的位置部分显示了*活动、业务规则、表*等等的位置。\n\
  \n### 站点 (Site)\n\n“位置”列中的所有视图都使用相同的核心实体类 `SITE`，如[图 4-2]所示。一个也可以称为`地址`（ADDRESS）的\
  \ `SITE` 是定位人员、组织或其他资源的手段。`SITE` 有两种主要类型。\n\n![image](img/B9780120887989500005X_f04-02-9780120887989.jpg)\n\
  \n图 4-2 站点。\n\n- `物理站点`（PHYSICAL SITE）是地球上具有特定用途的实体场所，如办公楼、家庭或油井。另一个名称是`设施`（FACILITY）。它必须是以下内容之一：\n\
  \    → `街道地址`（STREET ADDRESS）：这包括对一条或多条街道的引用，加上站点所在的城市、州或省份。\n    → `邮政箱`（POST OFFICE\
  \ BOX）：因为邮政箱也有唯一的物理位置，因此`物理站点`也包含这些。\n- `虚拟站点`（VIRTUAL SITE）除了某处计算机中的比特之外，没有物理现实。它通过仅在电子环境中才有意义的地址进行识别。这包括：\n\
  \    → `电子邮件站点`（E-MAIL SITE）：通过电子邮件地址识别。\n    → `网站`（WEB SITE）：通过“统一资源定位符 (URL)”、“万维网”识别。\n\
  \    → `电话站点`（TELEPHONIC SITE）：通过“国家代码”、“区码”、“分机号”识别。\n    → `数据库实例`（DATABASE INSTANCE）：数据可能所在的地方。\n\
  \    → `服务器`（SERVER）：系统的一部分。\n    → `其他虚拟站点`（OTHER VIRTUAL SITE）：不是上述任何一个。\n\n`SITE`\
  \ 类型冗余地表示了所示的`子类型`（sub-types）。每个`站点类型`（SITE TYPE）可以是两个或多个`站点类型`的父类型。例如，子类型可以是“办公楼”、“家庭”、“仓库”。\n\
  \n`站点类型`的第一个实例必须包含“物理站点”、“虚拟站点”、“电子邮件站点”等。\n\n[图 4-3] 引入了`站点结构`（SITE STRUCTURE）的概念，它必须是`物理通信链路`（PHYSICAL\
  \ COMMUNICATION LINK，即从一个站点向另一个站点发送消息的事）、`站点组合`（SITE COMPOSITION，即一个站点包含另一个站点的事）或`其他站点结构`。`站点组合`的属性`重叠指示`Overlap\
  \ indicator）决定了两个`站点`是否重叠（真）或一个在另一个内部（假）。\n\n![image](img/B9780120887989500005X_f04-03-9780120887989.jpg)\n\
  \n图 4-3 站点结构。\n\n每个`站点结构`必须是仅一个`站点类型`的实例。每个`站点类型`可以是至少两个其他`站点类型`的父类型。\n\n根据定义，`站点类型`的第一个实例必须是“站点组合”、“物理通信链路”和“其他站点结构”。\n\
  \n### 地理位置 (Geographic Location)\n\n如果`物理站点`是一个具有用途的场所，那么它在哪里？[图 4-4]显示`地理位置`仅仅是地球上任何被识别的地点。这可以是`地理区域`（GEOGRAPHIC\
  \ AREA）或`地理点`（GEOGRAPHIC POINT）。`地理区域`可以是`地缘区域`（GEOPOLITICAL AREA）或`管理区域`（MANAGEMENT\
  \ AREA）。`地缘区域`（如州或邮政区）的边界是由法律或条约定义的。`管理区域`如“东南销售区”）的边界是由公司自身定义的。\n\n\n\n\n\n`GEOGRAPHIC\
  \ POINT`（地理点）简单来说是一维中的一个点。在这个模型中，属性显示为纬度、经度以及海拔的组件。参考方案可以比这复杂得多，但对于元数据目的来说已经足够。与该模型中的其他实体类一样，每个\
  \ `GEOGRAPHIC LOCATION`（地理位置）必须恰好是一个 `GEOGRAPHIC LOCATION TYPE`（地理位置类型）的实例，其中 `GEOGRAPHIC\
  \ LOCATION TYPE` 的第一个实例对应于 `GEOGRAPHIC LOCATION` 显式显示的 `sub-types`（子类型）。`Geopolitical\
  \ area`（地缘区域）的`Sub-types`可以是“州”、“国家”、“邮政区”、“城市”等。`ADMINISTRATIVE AREA`（行政区域）的`sub-type\
  \ of`可以是“邮政区”。\n\n## 业务规则\n`GEOGRAPHIC LOCATION TYPE`的前两个实例必须是“地理区域”、“地理点”、“地缘区域”和“管理区域”，其中“地缘区域”和“管理区域”都是“地理区域”的`sub-types`。\n\
  \n由于某些 `PHYSICAL SITE`（物理场所）可能位于多个 `GEOGRAPHIC LOCATION`，反之亦然，交叉实体类 `SITE LOCATION`（场所位置）代表了单个\
  \ `PHYSICAL SITE` 位于特定 `GEOGRAPHIC LOCATION` 的事实。注意，`PHYSICAL SITE` 的属性“（城市）”、“（州）”、“（国家）”和“（邮政区）”用括号括表示它们实际上是派生属性。它们通过\
  \ `SITE LOCATION` 实体类派生自 `GEOGRAPHIC LOCATION` 实体类，其中 `SITE LOCATION` 是特定 `SITE`\
  \ 位于特定 `GEOGRAPHIC LOCATION` 的事实。例如，`PHYSICAL SITE` 中 `(City)` 的值实际上是该 `GEOGRAPHIC\
  \ LOCATION` 的“名称”，它是 `GEOGRAPHIC LOCATION TYPE`“城市”的`an example of`，并且是涉及 `PHYSICAL\
  \ SITE` 的 `SITE LOCATION` 的 `the location of`。\n\n## 业务规则\n尽管一个 `PHYSICAL SITE`\
  \ 可能与多个地理位置关联，但它与每个“城市”、“州”、“国家”和“邮政区”只能关联一个。\n\n`GEOGRAPHIC LOCATION`可以是复杂的。例如，一个美国的“邮政区”可能位于两个（或更多？）城市。因此，有必要添加实体类\
  \ `GEOGRAPHIC STRUCTURE`（地理结构），它允许任何 `GEOGRAPHIC LOCATION` 成为一个或多个（`GEOGRAPHIC STRUCTURES`，每个结构必须`the\
  \ placement in`一个且仅一个）其他 `GEOGRAPHIC LOCATION`的`part of`。属性“叠加指示”描述了一个 `GEOGRAPHIC\
  \ LOCATION` 是完全包含在另一个内部（“否”），还是它们仅仅重叠（“是”）。\n\n注意，此外，这允许每个 `GEOGRAPHIC AREA`（地理区域）根据标记边界的\
  \ `GEOGRAPHIC POINTS`集合来定义。由于每个 `PHYSICAL SITE` 可能通过一个或多个 `GEOGRAPHIC LOCATION`\
  \ `located via`，且每个 `GEOGRAPHIC LOCATION` 可能是一个或多个 `PHYSICAL SITES`的`the location\
  \ of`，实体类 `SITE LOCATION` 的每个实例都是一个 `PHYSICAL SITE` 位于一个 `GEOGRAPHIC LOCATION` 的事实。\n\
  \n## 第二行：放置主体、业务流程和动机\n\n### 业务位置\n除了 `PARTY`（主体）与 `SITE`（场所）之间的关系（来自人员和组织列，在见第五章显示了\
  \ `SITE`与`BUSINESS PROCESS`（业务流程）之间的关系（来自活动列，在第三章所示，`BUSINESS LOCATION`（业务位置）被定义为一个\
  \ `SITE`在特定时间与一个 `BUSINESS PROCESS`关联（*为了*）的事实。位置的时间受属性“生效日期”和“截止日期”的约束。关联的性质由 `BUSINESS\
  \ LOCATION TYPE`定义，可以是“执行于”、“通过管理”等。\n\n![image](img/B978012088798950005X_f04-05-9780120887989.jpg)\n\
  图 4-5 业务流程位置。\n\n### 手段、目标和努力\n图 4-6 复制了第七章中关于动机列的模型部分。特别是，这是模型的第二行视图，显示了`END`（目标）、`MEANS`（手段）和`EFFORT`（努力）。组织的`END`简单来说就是它打算完成的事情。其中最重要的是当然是它的`VISION`（愿景）。其他`ENDS`包括各种`DESIRED\
  \ RESULT`（预期结果）。\n\n![image](img/B978012088798950005X_f04-06-978012088799.jpg)\n\
  图 4-6 努力。\n\n`MEANS`是任何为了实现`ENDS`而可能被调用的能力。`MEANS`的主要类型是`COURSE OF ACTION`（方案）和`DIRECTIVE`（指令）。`COURSE\
  \ OF ACTION`是一种方法或计划，而`DIRECTIVE`是一种约束`COURSE OF ACTION`的规范——例如业务规则。\n\n如图 4-6 所示，`EFFORT`是应用`BUSINESS\
  \ ACTIVITY`来执行`COURSE OF ACTION`。具体来说，`EFFORT`是一个`PROJECT`（项目）或一个`PROGRAM`（计划）。\n\
  \n`MEANS`、`END`和`EFFORT`在图 4-6 中显示，以便为在`SITE`定位它们做准备。图 4-7 引入了（再次，借自第七章)`INFLUENCER`（影响因素）。`INFLUENCER`是任何在没有明显努力的情况下对企业产生影响的事物。`INFLUENCER`通常在没有刻意意图的情况下作用。\n\
  \n![image](img/B978012088798950005X_f04-07a-978012088799.jpg)\n![image](img/B978012088798950005X_f04-07b-978012088799.jpg)\n\
  图 4-7 动机位置。\n\n`INFLUENCERS`是`INTERNAL INFLUENCERS`（公司内部，例如“可用技术的限制”）或外部影响因素，如“竞争”或“供应问题”。参见第七章获取更多关于`INFLUENCERS`的信息。这一切的意义在于，`SITE`的`MOTIVATION\
  \ LOCATION`可能是某个`INFLUENCER`的。图 4-7 显示，`SITE`的`MOTIVATION LOCATION`必须是`EFFORT`、`DIRECTIVE`或`INFLUENCER`的位置。\n\
  \n## 第三行：数据流图\n在大多数情况下，第三行是一个概念模型，描述了流程和数据流，而不考虑这些内容在哪里发生。应由第二行（业务发生的地方）、第四行（计划发生的地方）和第六行（系统安装的地方）来适应位置列。\n\
  \n\n\n\n然而，网络的概念对系统的设计非常重要，它在这里同样适用，主要以`DATA FLOWS`（数据流）的形式存在。图 4-8 源自元模型的第三章（活动）视图，显示了`DATA\
  \ FLOWS`以及它们连接的`SYSTEM PROCESSES`（系统过程）、`DATA STORES`（数据存储）、`PARTIES`（参与方）和`POSITIONS`（位置）。如前所述，这是一个概念网络，不考虑机制、已识别的人员或办公室。然而，可以确定这种数据流可能是*通过*两个`SITES`（站点，如前文所述）之间的`PHYSICAL\
  \ COMMUNICATION LINK`（物理通信链路），作为记录三行模型含义含义的一种。再次，这不会在基本数据流图中完成。\n\n![image](img/B978012088798950005X_f04-08-9780120887989.jpg)\n\
  \n图. 4-8 数据流图。\n\n## 第四行：放置数据和程序\n\n第四行涉及系统设计，这种设计必须考虑程序和数据将放在何处以及程序之间如何相互通信。图 4-9\
  \ 显示了第二、第三章中讨论的设计的第四行模型的一部分。在图中我们看到了实体类`CLASS IMPLEMENTATION`（类实现）、`CLASS ELEMENT`（类元素）和`PERSISTENCE\
  \ MECHANISM`（持久化机制，特别是`TABLE`、`VIEW`和`COLUMN`）。在此基础上我们增加了`SITE`（站点），并通过`PERSISTENCE\
  \ MECHANISM LOCATION`（持久化机制位置）将其与表和列连接。也就是说，`PERSISTENCE MECHANISM LOCATION`是指特定的`TABLE`、`VIEW`或`COLUMN`预计保留在特定`SITE`中的事实。\n\
  \n![image](img/B978012088798950005X_f04-09-9780120887989.jpg)\n\n图. 4-9 持久化机制。\n\
  \n注意，这允许我们不仅将`TABLE`放在克利夫兰数据中心（例如），还可以放在特定的数据库中。也就是说，`PERSISTENCE MECHANISM`可能*特定于*某个`SITE\
  \ TYPE`某处的`PERSISTENCE MECHANISM LOCATION`。从设计者的角度来看，指定特定的`SITE`可能还为过早。相反，通过在`SITE\
  \ TYPE`处创建`PERSISTENCE MECHANISM LOCATION`，设计师只需指定该位置是`PHYSICAL SITE`（如上述克利夫兰数据中心）还是`VIRTUAL\
  \ SITE`（虚拟站点，例如`WHIMSY`^* `DATABASE INSTANCE`（数据库实例））。\n\n这是一个通过*超类型之*关系扩展`SITE\
  \ TYPES`列表的机会。自然地，`SITE STRUCTURE`也允许你指定`WHIMSY DATABASE INSTANCE`是克利夫兰数据中心`PHYSICAL\
  \ SITE`的*一部分*，因此没有必要为它们都指定`PERSISTENCE MECHANISM LOCATION`。\n\n图 4-10 借用了第三章模型中面向对象的部分，并显示了`MODULE\
  \ LOCATION`可以连接`SITE TYPE`与`PROGRAM MODULE`或特定的`OPERATION`。\n\n![image](img/B978012088798950005X_f04-10-9780120887989.jpg)\n\
  \n图. 4-10 模块位置。\n\n图 4-11 显示了设计网络的另一种方法。首先，“物理链路”是一个`SITE TYPE`，它是一个或多个其他`SITE STRUCTURE`的超类型。因此，我们有一种对可能的“物理通信”类型进行分类的方法。\n\
  \n![image](img/B978012088798950005X_f04-11-9780120887989.jpg)\n\n图. 4-11 链接。\n\n\
  如第三章所示，`PROGRAM MODULE COMMUNICATION`是其部分一个`PROGRAM MODULE`向另一个发送消息的事实。在图 4-11 中，`DESIGN\
  \ LINK`是`PROGRAM MODULE COMMUNICATION`使用了特定的`SITE TYPE`。具体来说，`DESIGN LINK`必须用于`PROGRAM\
  \ MODULE COMMUNICATION`，并且是特定`SITE TYPE`的使用，特别是该`SITE TYPE`的子类型，“物理链路”。例如，`PROGRAM\
  \ MODULE COMMUNICATION`可能描述调用`PROGRAM MODULE B`的`PROGRAM MODULE A`。\n\n\n\n\n在石油行业中，也有必要使用“地理实体”（GEOGRAPHIC\
  \ SOLID）来描述油层，但这超出了本书的范围。\n\n当然，还有“仓库信息系统”……\n\n# 人与组织\n\n*人类存在之所以如此困惑且悲剧，众多原因之一在于社会组织既是必要的又是致命的。人类为了自己的便利不断创造这样的组织，却永远发现自己成了这些亲手制造的怪物的受害者。*\n\
  \n——奥尔德·赫胥黎（ALDOUS HUXLEY）[1950]\n\n## 人与组织列\n\n人员与组织的视角涵盖以下内容：\n\n- `planner`规划者）负责说明组织的理念和人力资源管理方法。这是一个威权主义组织（如军队），还是非正式的组织（如公社）？\n\
  - `business owner`业务所有者）查看组织图。企业在汇报结构和整体责任方面是如何组织的？\n- `architect`架构师）捕捉并描述角色和职责。在角色和职位方面，每个人在公司运营中负责什么？\n\
  - `designer`设计师）指定用户界面和安全需求。首先，人们将如何与任何潜在系统交互？其次，哪些元素涉及提供数据访问的安全保障？\n- `builder`构建者）负责用户界面和安全方案的实际构建。\n\
  - `functioning system`运行系统由控制访问系统和数据库的实际机制组成。\n\n[图 5-1]显示了架构框架，其中高亮了我们在本章将涵盖的单元。具体来说，这些包括业务所有者、架构师、设计师和运行系统的视图。\n\
  \n![image](img/B9780120887989500061_f05-01-9780120887989.jpg)\n\n图 5-1 人员与组织列。\n\
  \n## 关于人员与组织\n\n正如第四章中描述的位置一样，人员和组织在业务层和元数据级别的建模方式是相同的。我们必须对关注的人员和组织进行建模，无论他们是在经营业务还是管理数据仓库。由于这个原因，本章中的模型将与《数据模型模式：思维约定》（Data\
  \ Model Patterns: Conventions of Thought）[Hay 1996]中关于人员和组织的模型非常相似。区别在于，业务中的主要实体类关联的不是其他业务实体类，而是我们一直在讨论的元模型实体类。此外，元模型借用的业务实体类将用在所有行中。\n\
  \n[图 5-2]显示了主题中的主要实体类。正如`PERSON`（人员）是任何业务模型中的重要实体类一样，它对于我们的元模型也是本质的。这里包含了对特定工作感兴趣的所有人员的记录。在业务中，这些是员工、客户、供应商、代理人等。在元模型世界中，人员也扮演许多角色（数据库管理员、程序员、数据管理师等），但这些是为了产生系统并维护企业所使用的每条数据的质量（准确性、时效性等）。\n\
  \n![image](img/B9780120887989500061_f05-02-9780120887989.jpg)\n\n图 5-2 人员与组织。\n\n\
  `PEOPLE`（人员）组成了`ORGANIZATIONS`（组织）。业务和数据经理感兴趣的`ORGANIZATIONS`可能包括`COMPANY`（公司）、`GOVERNMENT\
  \ AGENCY`政府机构）和`INTERNAL ORGANIZATION`内部组织。一个`COMPANY`是为了开展业务而组织的。在美国，一个`COMPANY`可以是公司、独资企业或合伙企业。\n\
  \n`GOVERNMENT AGENCY`政府机构是国家、州、省级或地方政府中的`ORGANIZATION`组织。这还包括国家以及国际组织，如欧盟和联合国。`INTERNAL\
  \ ORGANIZATION`内部组织是`COMPANY`或`GOVERNMENT AGENCY`内部的任何永久或临时的部门、科、分支或其他小组。这包括临时组织，如项目组和工作小组。此外，还有一些不属于这些类别的`OTHER\
  \ ORGANIZATIONS`其他组织。这些可能是工会、专业协会或家庭。\n\n在元数据世界中，最感兴趣的是作为业务规则、数据质量标准等的来源的组织。这些很大程度上是`INTERNAL\
  \ ORGANIZATIONS`，尽管在许多行业中`GOVERNMENT AGENCIES`也是一个因素。\n\n有许多适用于`PERSON`或`ORGANIZATION`的关系示例。因此，发明`PARTY`（参与方）的概念是方便的，它是我们感兴趣的`PERSON`或`ORGANIZATION`。这在[图\
  \ 5-3]中所示。\n\n![image](img/B9780120887989500061_f05-03-9780120887989.jpg)\n\n图 5-3\
  \ 参与方。\n\n事实上，`PARTIES`经常相互关联。`Corporate structure`公司结构指的是一个`INTERNAL ORGANIZATION`是另一个`INTERNAL\
  \ ORGANIZATION`的一部分；`Employment`雇佣描述了一个`PERSON`被`COMPANY`或`GOVERNMENT AGENCY`雇佣，等等。一个`PERSON`与另一个`PERSON`结婚。[图\
  \ 5-4]显示了`PARTY RELATIONSHIP`参与方关系是一个一个`PARTY`与另一个`PARTY`关联的事实。也就是说，`PARTY RELATIONSHIP`必须从一个`PARTY`到另一个`PARTY`。\n\
  \n![image](img/B9780120887989500061_f05-04-9780120887989.jpg)\n\n图 5-4 参与方关系。\n\n\
  在[图 5-5]中，每个`PARTY RELATIONSHIP`被视为一个`PARTY RELATIONSHIP TYPE`的示例。`PARTY RELATIONSHIP\
  \ TYPE`的示例如上所示。`Corporate structure`公司结构指的是一个`INTERNAL ORGANIZATION`是另一个`INTERNAL\
  \ ORGANIZATION`的一部分；`Employment`雇佣描述了一个`PERSON`被`COMPANY`或`GOVERNMENT AGENCY`雇佣，等等。\n\
  \n![image](img/B9780120887989500061_f05-05-9780120887989.jpg)\n\n图 5-5 雇佣。\n\n`EMPLOYMENT`雇佣是一种特殊的`PARTY\
  \ RELATIONSHIP`类型，它总是关于`PERSON`且与`ORGANIZATION`的。注意，这与将`EMPLOYEE`作为实体类是一种替代方案。如果你仔细一下，一个`PERSON`本质上并不是员工。他或她通过与`ORGANIZATION`维持`EMPLOYMENT`关系才成为员工。\n\
  \n这是另一个……`TYPE`实体类复制了父实体类的子类型结构。在这种情况下，`PARTY RELATIONSHIP TYPE`的前两个实例必须是“雇佣”和“其他参与方关系”。然而，每个`PARTY\
  \ RELATIONSHIP TYPE`可以是两个或多个其他`PARTY RELATIONSHIP TYPE`的父类型，因此可以指定`OTHER RELATIONSHIP`其他关系的子类型作为该实类的实例。这些可能包括“组织结构”、“公司所有权”等等。`CONTRACT\
  \ EMPLOYMENT`合同雇佣没有在图中显式显示为子类型，但它可以作为`PARTY RELATIONSHIP TYPE`的另一个实例包含。根据公司政策，“承包商”可以被认为是“雇佣”的子类型，也可以仅仅是“其他参与方关系”的子类型。\n\
  \n\n\n\n\n一个 `EMPLOYMENT`（推此类推，一个 `PARTY`）可以拥有一个或多个 `POSITION ASSIGNMENTs`（岗位分配），且每个\
  \ `POSITION ASSIGNMENT` 必须对应一个且仅对应一个 `POSITION`（职位）。`POSITION` 是对具有特定技能的人员所完成的特定类别工作的定义。因此，`POSITION\
  \ ASSIGNMENT` 是某个特定 `EMPLOYMENT`（即某个特定的受雇 `PERSON`）拥有某个特定 `POSITION` 的事实。图 5-6 显示了这一点，其中每个\
  \ `POSITION` 都是一个且仅一个 `ORGANIZATION`（组织）的`责任`。\n\n![image](img/B9780120887989500061_f05-06-9780120887989.jpg)\n\
  \n图 5-6 职位。\n\n请注意，一个 `PERSON` 的 `EMPLOYMENT` 随着时间的推移可能涉及对 `POSITIONs` 的多个 `POSITION\
  \ ASSIGNMENTs`。这还包括临时外调^* 到不同部门。这也意味着在任何时间点，由某个部门（通过 `EMPLOYMENT`）雇佣的人数并不一定等于在该部门的`负责的`\
  \ `POSITIONs` 中实际工作的人数。\n\n`POSITION RESPONSIBILITY`（职位责任/职责，详见图 5-7）是分配给 `POSITION\
  \ ASSIGNMENT` 中的 `PERSON`（对应某个 `POSITION`）或任何持有该 `POSITION` 的人的任务类型。例如，任何持有“数据库管理员”这一\
  \ `POSITION` 的人都拥有（除其他之外）“安装新 DBMS 版本”`POSITION RESPONSIBILITY`。由于一个 `POSITION ASSIGNMENT`\
  \ 可能拥有多个 `POSITION RESPONSIBILITYs`，且每个 `POSITION RESPONSIBILITY` 都可能被包含于一个或多个 `POSITION\
  \ ASSIGNMENTs` 或一个或多个 `POSITIONs` 中，因此实体类 `POSITION RESPONSIBILITY HOLDING` 是特定\
  \ `POSITION` 或 `POSITION ASSIGNMENT` 拥有某个特定 `POSITION RESPONSIBILITY` 的事实。也就是说，每个\
  \ `POSITION RESPONSIBILITY HOLDING` 必须由一个 `POSITION ASSIGNMENT` 或 `POSITION` 产生，并且属于一个特定的\
  \ `POSITION RESPONSIBILITY`。\n\n![image](img/B9780120887989500061_f05-07-9780120887989.jpg)\n\
  \n图 5-7 职位责任。\n\n## 第二行：业务所有者的视图\n\n### 访问角色 (Access Roles)\n\n既然我们已经描述了元数据的业务环境——人及其在组织的工作——我们就可以开始观察业务实体类与我们一直关注的元数据实体类之间是如何相关的。接下来的图表（从图\
  \ 5-8 开始）显示，`ACCESS ROLE`（访问角色）是某人在企业系统的某个方面（在这种情况下）扮演角色的事实。具体而言，一个 `ACCESS ROLE`\
  \ 必须由以下者之一扮演：\n\n![image](img/B9780120887989500061_f05-08-9780120887989.jpg)\n\n\
  图 5-8 访问角色与站点。\n\n– 一个特定的 `PARTY`（`PERSON` 或 `ORGANIZATION`）\n– 某个受雇于 `ORGANIZATION`\
  \ 的 `PERSON` 对应某个 `POSITION` 的 `POSITION ASSIGNMENT`\n– 在指定 `POSITION` 中的任何人\n–\
  \ 任何人对某个 `POSTION RESPONSIBLITY` 拥有的 `POSITION RESPONSIBILITY HOLDING`\n– 任何持有特定\
  \ `POSITION RESPONSIBILITY` 的人\n\n最初，我们可以说一个 `ACCESS ROLE` 必须是以下之一：\n\n– `PLACEMENT\
  \ ROLE`（安置角色），将 `PERSON`、`POSITION` 等在物理上放置于所涉及的事物中\n– `PERMISSION ROLE`（权限角色），授予\
  \ `PERSON`、`POSITION` 等访问某些事物的权限。（属性“禁止指示器”如果为“True”，则表示该角色实际上是禁止 `PARTY` 等访问的。）\n\
  – `MANAGEMENT ROLE`（管理角色），断言 `PERSON`、`POSITION` 等对涉及 `ACCESS ROLE` 的事物具有管理责任\n\
  – `OTHER ACCESS ROLE`（其他访问角色），涵盖除上述角色之外的任何角色\n\n每个 `ACCESS ROLE` 必须是 `ACCESS ROLE\
  \ TYPE`（访问角色类型）的一个实例。再次请注意，此实体类冗余地表示了与 `ACCESS ROLE` 子类型结构所示的相同事实。\n\n随着本章的进行，我们将看到\
  \ `ACCESS ROLE` 可以用于元模型中的许多不同事物。首先，在图 5-8 中，一个 `ACCESS ROLE` 可能是为了一个 `SITE`（站点）^*，其中\
  \ `SITE` 是一个地方。一个 `ACCESS ROLE` 可能是为了一个 `SITE`，`SITE` 是放置 `PEOPLE`、`ORGANIZATIONS`\
  \ 的地方。一个 `PLACEMENT ROLE` 可能是言某个 `PERSON` 位于某个特定的 `SITE`。而 `PERMISSION ROLE` 则表示该\
  \ `PERSON` 有权访问该 `SITE`。在大多数情况下，`ACCESS ROLE` 只是属于一个 `SITE`。\n\n业务规则\n\n每个 `ACCESS\
  \ ROLE` 必须是 `ACCESS ROLE TYPE` 的实例。\n\n### 概念、符号与标识符 (Concepts, Symbols, and Signifiers)\n\
  \n在第二章中，我们看到一个 `SYMBOL` 是一个 `WORD`、`PHRASE` 或 `GRAPHIC`，代表一个 `BUSINESS CONCEPT`。图\
  \ 5-9 显示 `PARTIES` 和 `SIGNIFIERS` 拥有 `ACCESS ROLES`——针对 `BUSINESSCEPTS`。在列出的 `ACCESS\
  \ ROLE` 类型中，只有 `MANAGEMENT ROLE` 适用。\n\n![image](img/B9780120887989500061_f05-09a-9780120887989.jpg)\n\
  \n![image](img/B9780120887989500061_f05-09b-9780120887989.jpg)\n\n图 5-9 概念与符号。\n\
  \n– `ENFORCEMENT ROLE`（执行角色）：由数据管理员执行^*，以确保整个组织使用的 `WORDS` 和 `PHRASES` 一致。\n– `SPECIFICATION\
  \ ROLE`（规范角色）：由针对 `BUSINESS CEPTS` 和 `SYMBOLS` 的适当人员执行\n\n注意连线。每个 `ACCESS ROLE`\
  \ 必须对应一个且仅一个 `SITE`。也就是说，每个 `ACCESS ROLE` 必须针对一个 `SITE`、一个 `SYMBOL` 或一个 `BUSINESS\
  \ CONCEPT`。随着其他元素的添加，连线将扩展到这些元素。\n\n除了 `BUSINESS CEPTS` 和 `BUSINESS CONCEPT ELEMENTS`（以及\
  \ `SYMBOLS` 和 `SIGNIFIERS`）之外，`ACCESS ROLES` 还可以定义为针对 `RESOURCES` 本身针对它们的 `COPIES`。这在图\
  \ 5-10 中所示。除了之前描述的 `MANAGEMENT ROLE` 和 `PERMISSION ROLE` 之外，该图引入了以下内容：\n\n![image](img/B97801208879895000061_f05-10a-9780120887989.jpg)\n\
  \n![image](img/B97801208879895000061_f05-10b-9780120887989.jpg)\n\n图 5-10 资源。\n\n\
  – `AUTHORSHIP ROLE`：仅适用于 `RESOURCE`（所有 `COPIES`），并描述资源的创建者。`ACCESS ROLE TYPES` 作为“作者角色”的子类型可以是“作者”、“出版者”、“编辑”等。\n\
  \n业务规则\n\n每个 `AUTHORSHIP ROLE` 必须专门针对一个且仅针对一个 `RESOURCE`。（这通常是一个 `DOCUMENT`，但可能是针对某个\
  \ `RESOURCE`。）\n\n### 活动、决策与事件 (Activities, Decisions, and Events)\n\n\n\n\n一个 `ACCESS\
  \ ROLE` 可能`用于`一个 `ACTIVITY`（`ACTIVITY` 已在第三章中定义）。这在图 5-11 中所示（参见第 226 页和 [227 页）。因此，一个\
  \ `PARTY`（或 `POSITION` 中的 `PARTY` 或具有 `POSITION RESPONSIBILITY` 的 `PARTY`）可以是某个\
  \ `ACTIVITY` 的 `ACCESS ROLE` `扮演者`。这可能适用于 `FUNCTION` 或 `BUSINESS PROCESS`。\n\n![image](img/B9780120887989500061_f05-11-9780120887989.jpg)\n\
  \n图 5-11 活动与事件。\n\n具体而言，`用于` `ACTIVITY` 的 `ACCESS ROLES` 包括：`SPECIFICATION ROLE`（定义\
  \ `ACTIVITY` 的性质）；`ENFORCEMENT ROLE`（要求在适当的情况下执行 `ACTIVITY`）；`PERMISSION ROLE`（允许或禁止参与\
  \ `ACTIVITY`）；`MANAGEMENT ROLE`（负责 `ACTIVITY` 的整体执行）；以及一如往常的，`OTHER ACCESS ROLE`。再次注意，`用于`一个\
  \ `ACTIVITY` 的关系与我们见过的其他关系的 `ACCESS ROLES` 是“弧形”连接在一起的。\n\n### 手段与目的\n\n第七章对架构框架中\
  \ `Motivation` 列的描述比这里能做的更详尽。然而，总之，在业务所有者的行二行视图的 `Motivation` 列中，该单元格描述了组织的目标和目的、策略和战术，以及使其这一切运行的指令（业务政策和业务规则）。具体而言，模型集中于以下内容：\n\
  \n- `END`：组织试图实现的某事，例如：\n  → `A VISION`\n  → `A GOAL`\n  → `An OBJECTIVE`\n- `MEANS`：组织用来实现它的能力，通过：\n\
  \  → `A MISSION`\n  → `A COURSE OF ACTION`，例如策略或战术\n  → `A DIRECTIVE`，例如业务政策或业务规则\n\
  - 对 `INFLUENCER` 的 `ASSESSMENT`，例如“竞争”对 `MEANS` 或 `END` 的影响（on）\n\n当然，这些实体类在这里是相关的，因为可以指定在\
  \ `MEANS`、`END`、`INFLUENCER` 或 `ASSESSMENT` 中扮演 `ACCESS ROLE` 的 `PARTIES`（参见图 5-12）。`ACCESS\
  \ ROLE` 可能由 `PARTY`（或 `POSITION` 等）`扮演`，这些实体是负责 `DIRECTIVE` `ENFORCEMENT` 的 `PARTY`、负责\
  \ `ASSESSMENT` `MANAGEMENT` 的 `PARTY` 或负责 `INFLUENCER`、`END` 或 `MEANS` 的 `MANAGEMENT`\
  \ 的 `PARTY`。注意，通常在行二中，特别是这里，如果 `ACCESS ROLE` 由一个 `PARTY` 扮演，它很可能是由一个 `INTERNAL ORGANIZATION`\
  \ 扮演，尽管它也可以由一个 `COMPANY` 或 `GOVERNMENT AGENCY` 扮演。\n\n![image](img/B9780120887989500061_f05-12-9780120887989.jpg)\n\
  \n图 5-12 手段与目的。\n\n此外，`Motivation` 列描述了一种 `EFFORT`（参见图 5-13），例如项目或计划，旨在`通过使用` `BUSINESS\
  \ PROCESS` 来`实现` `DESIRED RESULT`。此 `EFFORT` 也可以通过 `MANAGEMENT ROLE` `进行`。\n\n![image](img/B9780120887989500061_f05-13-9780120887989.jpg)\n\
  \n图 5-13 努力。\n\n## 行三：架构师视图\n\n正如 `ACCESS ROLE` 决定了 `PARTIES` 等实体如何与行二内容（如 `BUSINESS\
  \ CONCEPTS` 和 `ACTIVITIES`）相关，它也可以用于表示人们对此类行三产物（如 `SYSTEM PROCESSES` 和 `DATA FLOWS`）的责任。其中之一在图\
  \ 5-14 中所示。在这里，由所示的各种实体类之一`扮演`的 `ACCESS ROLE` 必须`用于`一个 `SYSTEM PROCESS`。（#B9780120887989500061.htm_f7)\n\
  \n![image](img/B9780120887989500061_f05-14-9780120887989.jpg)\n\n图 5-14 角色。\n\n\
  注意，在行三数据图中，我们通常不识别谁是 `MANAGEMENT ROLE`。尽管如此，说明 `ACCESS ROLE` 由一个 `PARTY` 扮演是有用的，它很可能是由一个\
  \ `INTERNAL ORGANIZATION` 扮演，尽管也可以由一个 `COMPANY` 或 `GOVERNMENT AGENCY` 扮演。此外，`Motivation`\
  \ 列描述了一个 `EFFORT`（参见图 5-13），例如项目或计划，旨在`通过使用` `BUSINESS PROCESS` 来`实现` `DESIRED RESULT`。此\
  \ `EFFORT` 也可以通过 `MANAGEMENT ROLE` `进行管理`。注意，在行三数据图中，我们通常不识别谁是 `MANAGEMENT ROLE`。尽管如此，说明\
  \ `ACCESS ROLE` 由一个 `PARTY` 扮演是有用的，它很可能是由一个 `INTERNAL ORGANIZATION` 扮演，尽管也可以由一个\
  \ `COMPANY` 或 `GOVERNMENT AGENCY` 扮演。\n\n\n\n\n![image](img/B9780120887989500061_f05-19-9780120887989.jpg)\n\
  \n图 5-19 持久化机制。\n\n## 交互模块\n\n正如我们所见，处理人员和组织的基础元模型与处理人员和组织的业务模型是相同的。区别在于，元模型描述的是它们在管理信息和系统中所扮演的角色，而不是在管理业务中所扮演的角色。\n\
  \n为现代计算机系统编写的大量软件都涉及屏幕上信息的显示和输入。作者在 20 世纪 60 年代后期通过一次偶然进入计算机行业，当时在使用一种名为`computer\
  \ time-sharing`（计算机分时共享）的新技术。那时，大多数计算机处理的是打孔卡，有限的处理能力意味着编程工作的重心完全放在执行构成程序工作的的计算和其他任务上。\n\
  \n然而，随着`computer time-sharing`的出现，现在可以坐在打字机前输入内容，并让计算机返回响应。这是一个革命性的想法！除此之外，在在这种环境下开发系统时，人们很快发现，必须关注人机对话的性质。特别是，打字机非常慢（每秒仅\
  \ 10 个字符，或 100 波），因此信息提示是否过长非常重要。没有人有耐心等待计算机问一个非常长的问题。但新用户需要更多帮助。因此在早期，计算机对话被设计为两种模式：初学者和专家。\n\
  \n这一点在于，支持交互所需的代码是执行工作所需代码之外的。更重要的是，它必须经过技巧巧妙的设计。多年来，分时共享世界一直处于主流计算之外。那些谈论用户界面的人对于普通的\
  \ `COBOL` 程序员来说，显然像是在说外语。\n\n然后个人电脑出现了。突然，开发的软件开始供那些不熟悉计算机的人使用。突然，人机交互的特征变得重要起来。与此同时，计算经济学发生了发生变化，使得可以将计算周期花费在用户界面的细节上。\n\
  \n在 21 世纪，大多数程序代码中最大的部分都分配给了用户界面，无论是直接实现，还是通过调用该目的的程序库。即使是产生一个用户界面的通用模型也使得本书面临未来过时的风险，但在\
  \ 2005 年，这种结构是如此基础，以至于值得一看。\n\n[图 5-20] 显示了 `EXECUTABLE MODULE` 的一种新类型，`INTERACTIVE\
  \ MODULE`。就像一个 `PACKAGE` 一样，`INTERACTIVE MODULE` 可能 `composed of` 一个或多个 `CLASS IMPLEMENTATIONS`，具体来说是\
  \ `HUMAN INTERFACE CLASSES` 的 `ARCHITECTURAL CLASSES`。事实上，我们在这里观察到两种特定的 `HUMAN INTERFACE\
  \ CLASSES` 类型：`WINDOW` 和 `DISPLAY GROUP`。`WINDOW` 是屏幕上的一个定义区域，可以作为一个对象独立被实现。这然后可以被\
  \ `composed of` 一个或多个 `DISPLAY GROUPS`，其中 `DISPLAY GROUP`是一组被视为逻辑单元的字段或其他对象。\n\n\
  ![image](img/B9780120887989500061_f05-20-9780120887989.jpg)\n\n图 5-20 窗口。\n\n每个\
  \ `DISPLAY GROUP` 必须是某个 `PROGRAM MODULE TYPE` 的 `example of`，该类型是“Display group\
  \ type”的 `sub-type of`。`WINDOW` 可能是“模态的”，即如果它打开，则没有其他 `WINDOW` 可以被操作；它可能是“非模态的”，意味着其他窗口可以移动到前面并进行操作。“Modal\
  \ indicator”属性决定了这一点。\n\n这些是 `CLASS IMPLEMENTATION` 的示例，它们是计算机对象，而不是业务世界中某些东西的类比。即使在\
  \ `UML` 中绘制，它们也不会出现在实体关系图中。请注意，这些对象并没有在 `PERSISTENCE MECHANISM` 中被持久化。\n\n[图 5-21]\
  \ 显示了 `WINDOW` 和 `DISPLAY GROUP` 都可能 `composed of` 一个或多个其他 `HUMAN INTERFACE CLASSES`，这次是\
  \ `INTERFACE ELEMENTS`。一个 `INTERFACE ELEMENT` 必须是以下内容之一。\n\n![image](img/B9780120887989500061_f05-21-9780120887989.jpg)\n\
  \n图 5-21 界面元素。\n\n– `FIELD`，显示数据库中的一列，或接受输入的键值以添加到数据库中。也就是说，一个 `FIELD` 必须是且仅是对一个\
  \ `PERSISTENCE MECHANISM` 的 `the use or display of`（通常是数据库中的一个 `COLUMN`）。`FIELD`\
  \ 也可以在按下回车键时作为 `EXECUTABLE MODULE` 的 `trigger of`。\n\n– `DISPLAY ELEMENT`，仅显示特定的文本或图形元素。\n\
  \n– `ICONIC TRIGGER`，如果被光标触碰将导致另一个程序动作（`ICONIC TRIGGER` 必须是 `of` 且仅一个 `EXECUTABLE\
  \ MODULE`）。\n\n– `OTHER INTERFACE ELEMENT`，可以是窗口中显示的任何其他内容（图形或文本）。\n\n每个 `INTERFACE\
  \ ELEMENT` 必须恰好对应一种“Interface type”。\n\n## 业务规则\n\n`PROGRAM MODULE` “Interface type”的第一个实例必须是“Field”、“Display\
  \ element”、“Interface trigger”和“Other element”。这些中的每一个随后都可以作为其他 `MODULE TYPES` 的超类类型。\n\
  \n# 第六行：安全与治理\n\n`Framework` 的运行系统视图关注实际的数据库和程序。这意味着在人员和组织中，我们关注以下内容的 `ACCESS ROLES`：\n\
  \n– `PROGRAM COPIES`\n\n– `DATABASE INSTANCES`\n\n– `TABLE INSTANCES`\n\n[图 5-22]\
  \ 显示了这一点，同样显示了 `PROGRAM MODULE`（特别是 `DATABASE MANAGEMENT SYSTEM`）的 `ACCESS ROLE`。注意，在这种情况下，我们只向\
  \ `PARTIES` 授予 `ACCESS ROLES`。特别是，这些是 `ENFORCEMENT ROLE` 和 `PERMISSION ROLE`。当然，`PERMISSION\
  \ ROLE` 只是一个 `PARTY` 有权限进入 `DATABASE INSTANCE` 或 `TABLE INSTANCE` 的事实。`ENFORCEMENT\
  \ ROLE` 是 `DATABASE MANAGEMENT SYSTEM` 为其中任何一个建立规则（以及 `PERMISSION ROLES`）的能力。`MANAGEMENT\
  \ ROLE` 或 `PROGRAMMING ROLE` 负责处理 `PROGRAM COPIES`。\n\n![image](img/B9780120887989500061_f05-22-9780120887989.jpg)\n\
  \n图 5-22 数据库与程序。\n\n***\n\n* 如果 data 是复数，单数必须用 datum，对吗？\n* 我知道，这与元数据无关，但它是 `PARTY\
  \ RELATIONSHIP` 的一个很好的例子。\n* 注意，在业务设置中，断言每个 DEPLOYMENT 必须属于一个 `ORGANIZATION` 是合理的，但在更通用的情况下，个人可以雇佣女佣或司机，因此该模型的纯粹版本是由\
  \ `PARTY` 发起的，但在我们的元数据环境中，呈现的版本是合适的。\n* 给我们的美国读者：“Seconded”是临时派往其他地方英国英语。一个很棒的词！\n\
  * 关系说必须，是因为正如你很快就会看到的，这是一个广泛弧的一部分，而且确实每个 `ACCESS ROLE` 必须对应备选方案之一。当我们讨论每种备选方案时，该方案显然是可选的。\n\
  \n\n\n\n\n是的，模型指出一个特定的 `SIGNIFIER` 可以代表多个 `BUSINESS CONCEPT`，而且这种情况经常发生，但数据管理的目标是尽可能地减少这种情况的发生。而且，当然，必须有人负责\
  \ `BUSINESS CONCEPT` 定义的 `MANAGEMENT`。\n\n自然地，这种关系处于之前所示的弧线之下，用于指定 `ACCESS ROLE`\
  \ 可能的所有的所有用途。例如，一个 `ACCESS ROLE` 必须是*为了*第二行的 `BUSINESS CONCEPT`、第三行的 `ACTIVITY`\
  \ 或 `SYSTEM PROCESS`。\n\n与今天拥有 54,000,000 波特的 DSL 线路相比，这简直太简单了！\n\n# 事件与时间\n\n*时间是这种让事件不会同时发生的自然属性。最近，它似乎没起起作用。*\n\
  —— 佚\n\n*当我无法处理事件时，我就让它们自己处理自己。*\n—— 亨利·福特\n\n## 事件与时间列\n\n架构框架中的活动（Activities）列关注企业**何时**执行其工作。\n\
  \n- `planner`（规划者）制定年度和长期的计划与进度。\n- `business owner`（业务所有者）查看控制业务行为的业务事件类型。\n- `architect`（架构师）查看控制数据处理的系统事件类型。\n\
  - `designer`（设计师）定义程序事件类型以触发特定的程序活动。\n- `builder`（构建者）关注响应系统事件所需的详细编程。\n- `functioning\
  \ system`（运行中的系统）是在事件发生时对其做出响应的系统。\n\n`Figure 6-1` 显示了高亮了本章单元格的架构框架。特别是，我们将从三个视角来看事件类型：业务所有者、架构师和设计师。\n\
  \n![image](img/B9780120887989500073_f06-01-9780120887989.jpg)\n图 6-1 时间列。\n\n##\
  \ 第二行：业务事件类型\n\n对业务和系统活动的时间进行建模，实际上是对*事件*类型进行建模。事件是正在发生并导致另一某事情发生的事情。这可以是触发企业内部活动的业务事件，也可以是导致计算机系统中发生某事情的的技术事件。*事件类型*是对一类事件的定义。因为我们在这里关注的是元数据而非业务数据，所以此模型将涵盖事件类型，而不是发生在特定日期的实际事件。\n\
  \n注意，这包含了*时间事件*（temporal event）概念，它仅仅是指时钟（包括日历）过了某一点的事。例如，月底可能是触发公司结账的时间事件。进度表（例如制造主计划）仅仅是时间事件的集合。\n\
  \n时间列的元模型与活动的元模型有显著的重叠，后者在`Chapter Three` 中进行了详细描述。在这里，第二行中，*业务事件类型*是导致*业务过程*执行发生的因素。\n\
  \n### 外部业务事件类型\n\n在`Chapter Three` 中，我们看到 `ESSENTIAL BUSINESS PROCESS`（核心业务过程）被定义为`ELEMENTARY\
  \ BUSINESS PROCESSES`（基础业务过程）的集合，形成对外部事件类型的完整响应。`Figure 6-2` 显示了涵盖这部分的元模型。具体而言，我们将\
  \ `ESSENTIAL BUSINESS PROCESS` 的本质定义为：它必须*基于* `EXTERNAL BUSINESS EVENT TYPE`（外部业务事件类型）。`EXTERNAL\
  \ BUSINESS EVENT TYPE` 定义了企业控制之外发生的事情。这包括诸如“收到付款”、“候选人到达”等。注意，这也可以包括发生在组织设施内部的事情，例如“炼油厂火灾”，只要它*不是*在企业的控制范围内。这与\
  \ `INTERNAL BUSINESS EVENT TYPE`（内部业务事件类型）相反，后者定义了企业控制下发生的事情，例如制造步骤的完成（`INTERNAL\
  \ BUSINESS EVENT TYPES` 在后续材料中进一步讨论）。\n\n![image](img/B9780120887989500073_f06-02-9780120887989.jpg)\n\
  图 6-2 外部事件类型和核心过程。\n\n注意，`EXTERNAL BUSINESS EVENT TYPE` 的属性是“时间指示”（Temporal indicator），它指示该类型的事件是否为时间事件。如前所述，时间事件是由时间的流逝触发的，例如“每月初”、“12\
  \ 月 25 日”等。\n\n`Figure 6-3` 显示了最初在`Chapter Three` 中描述的详细业务模型。注意有两个 `EXTERNAL EVENT\
  \ TYPES` 驱动该模型：`Receipt of invoice`（收到发票）和 `Receipt of book`（收到书籍）。`Receipt of book`\
  \ 触发了两个 `ELEMENTARY PROCESSES`，然后它们可以汇总为核心过程 `ESSENTIAL BUSINESS PROCESS` `Book\
  \ received`（收到书籍）。它还向 `BUSINESS PROCESS` `Pay invoice`（支付发票）发送消息 `Marked ‘Blue’`（标记为蓝色）。注意，在\
  \ `EXTERNAL EVENT TYPE` 类型的 `Receipt of invoice` 的事件发生之前，`Pay invoice` 无法发生。\n\n\
  ![image](img/B9780120887989500073_f06-03-9780120887989.jpg)\n图 6-3 示例核心过程模型。\n\n\
  ### 内部业务事件类型\n\n除了组织内的 `EXTERNAL EVENT TYPES`、`ELEMENTARY PROCESSES` 和 `OTHER BUSINESS\
  \ PROCESSES` 外，通常也由 `BUSINESS PROCESSES`*触发。这些触发（如消息 `Book received`）是 `INTERNAL\
  \ EVENT TYPES` 的示例。也就是说，它们描述的是企业内部的、受控制的事件。\n\n在 `Figure 6-3` 中，我们看到了相互影响的 `ELEMENTARY\
  \ PROCESSES`。模型中有两种流。粗线是物理书籍的移动。细线是所需的信息从一个过程传递到下一个过程所需的机制移动（如带颜色的订单副本）。这些流实际上都是\
  \ `INTERNAL EVENT TYPE`（如`Figure 6-4`所示）。\n\n![image](img/B9780120887989500073_f06-04-9780120887989.jpg)\n\
  图 6-4 内部事件类型。\n\n`INTERNAL EVENT TYPE` 代表一个 `BUSINESS PROCESS` 可能会触发另一个的事实。作为 `BUSINESS\
  \ PROCESS` 触发因素的 `INTERNAL EVENT TYPE` 可能是另一个 `BUSINESS PROCESS` 的动作。也就是说，一个 `BUSINESS\
  \ PROCESS` 可以是*触发*一个或多个 `INTERNAL EVENT TYPES` 的决策，而每个类型随后必须是另一个 `BUSINESS PROCESS`\
  \ 的触发因素。\n\n注意，决策本身没有在模型中显式表示。触发某个 `INTERNAL EVENT TYPE/BUSINESS PROCESS` 而不是另一个的决策包含在触发它的\
  \ `BUSINESS PROCESS` 逻辑中。\n\n在 `Figure 6-3` 中，`PROCESS FRAGMENT`（`BUSINESS PROCESS`\
  \ 的一种类型）`Classify book`是由一个 `INTERNAL EVENT TYPE`*启动的*，即 `PROCESS FRAGMENT` `Title,\
  \ quantity confirmed` 的完成。`EXTERNAL EVENT TYPE` 是企业控制之外发生的事情。它可以发生在市场上、天灾或仅仅是时间的（由\
  \ `Temporal indicator` 属性为“True”定义）。根据定义，时间事件不能是内部事件。\n\n\n\n\n顺便请注意，尽管 `BUSINESS\
  \ PROCESS`（业务过程）可能扮演 `INTERNAL BUSINESS EVENT TYPE`（内部业务事件类型）的角色，但事件类型与过程有很大不同。根据定义，过程是跨越时间发生的，而事件类型是瞬时发生的。如果说\
  \ `BUSINESS PROCESS` 是触发 `BUSINESS EVENT TYPE`（业务事件类型）的决策，那么执行这一点的并不是整个过程，而是 `BUSINESS\
  \ PROCESS` 完成时、开始时或持续期间的某个时间点充当了 `BUSINESS EVENT`（业务事件）。\n\n`INTERNAL BUSINESS EVENT\
  \ TYPE` 属性 `Position flag`（位置标记）在事件类型位于 `BUSINESS PROCESS` 开始时取值为 `Beginning`（开始）。如果事件类型位于\
  \ `BUSINESS PROCESS` 结束时，取值为 `End`（结束）；如果位于 `BUSINESS PROCESS` 开始后的预定义点，则取值为 `Lag`（延迟）。如果是\
  \ `Lag`，则属性 `Lag quantity`（延迟数量）是指从 `BUSINESS PROCESS` 开始后构成事件的时间长度。`Lag quantity`\
  \ 必须有一个 `Unit of measure`（单位），如 `Weeks`（周）或 `Days`（天），并存储在属性 `Lag unit of measure`（延迟单位）中。\n\
  \n图 6-4 也显示 `INTERNAL BUSINESS EVENT TYPE` 和 `EXTERNAL BUSINESS EVENT TYPE`（外部业务事件类型）都是\
  \ `BUSINESS EVENT TYPE` 的子类型。再次记住，我们在这里讨论的是事件*类型*。实际事件的日期和时间不是本模型的主题。\n\n### 动机\n\
  \n请注意，在目前模型中，`BUSINESS EVENT TYPE` 定义了对 `BUSINESS PROCESS` 的直接影响。在第七章中，我们将遇到 `INFLUENCERS`（影响因素），影响因素是指“任何可以在不明显施加有形力量或直接行使命令的情况下对企业产生影响的事物”\
  \ [Business Rules Group 2005, p. 21]。也就是说，`BUSINESS EVENT TYPE` 直接导致 `BUSINESS PROCESS`\
  \ 的发生，而 `INFLUENCER` 的影响则更为间接。它首先必须被判定为重要的。\n\n正如第七章中所描述，`INFLUENCER` 通过影响 `ENDS`（目标，特别是\
  \ `DESIRED RESULTS` 预期结果）发挥作用，这些目标描述了企业经营业务要完成的任务（见图 6-5）。它还影响 `MEANS`（手段，特别是 `COURSES\
  \ OF ACTION` 行动方案），这些定义了为了实现组织目标可能调用、激活或强制执行的任何能力。因此，可用的 `MEANS` 限制了可能的 `BUSINESS\
  \ PROCESSES`。\n\n![image](img/B9780120887989500073_f06-05-9780120887989.jpg)\n\n\
  图 6-5 事件与影响因素。\n\n具体来说，第二行（所有者视角）关注的是触发企业工作的 `BUSINESS EVENTS`，而第三行（架构师视角）关注的是处理企业数据的\
  \ `SYSTEM EVENTS`^*。本章描述了三种类型的模型来记录事件类型：\n\n-   `state-transition diagram`（状态转换图）：表示实体类（或系统）在定义类型事件的触发下可能经历的状态转换序列。\n\
  -   `entity life history`（实体生命周期历史）：也表示实体类可能经历的状态转换序列，但其重点更多在于触发这些状态更改的事件类型，而不是状态本身。\n\
  -   `essential system process diagram`（核心系统过程图）：它与核心*业务*过程图一样，将过程简化为执行公司对某类系统事件响应所需的过程。\n\
  \n### 状态转换图\n\n图 6-6 显示了一个 `state-transition diagram` 示例。这是一项相对较老的技术例如，[Martin and\
  \ McClure 1985, pp. 219–230]，但它包含在 UML 支持范围内例如，[Booch et al. 1999]]。实际事件的日期和时间不是本模型的主题。\n\
  \n\n\n\n请注意，与 Row Two 模型讨论的情况类似，我们在这里感兴趣的是`event types`（事件类型），而不是`system processes`（系统过程）。事件是世界上发生的某件事，导致其他事情的发生。这意味着事件中没有`elapsed`（经过）时间——只有时间上的一个`point`（点）。即使业务或系统过程是由另一个过程触发的，触发它的也是上一个过程的`completion\
  \ of`（或`beginning of`等），而不是它的持续时间。\n\n具体来说，`SYSTEM EVENT TYPE`（系统事件类型）是由`SYSTEM\
  \ PROCESS`（系统过程）`caused by`，而 `Position flag`（位置标记）属性告诉我们 `SYSTEM EVENT TYPE` 是\
  \ `BUSINESS PROCESS`（业务过程）的`Beginning`（开始）、`End`（结束），还是相对于 `BUSINESS PROCESS` 开始时间延迟了指定的\
  \ `Lag time`（延迟时间）。`Lag time` 属性通过 `Lag unit of measure`（延迟单位）属性表示，例如 `weeks`（周）或\
  \ `days`（天）。\n\n## 实体生命历史 (Entity Life History)\n\n对象社区声称，对象建模优于实体关系模型的优势在于对象模型对`object\
  \ class behavior`（对象类行为）的表示。也就是说，该类中的对象在其生命周期内发生了什么。由于对象模型从根本上是关于程序设计的，这并不奇。这一点尤为真实，因为行为在模型中并不是通过程序逻辑实际表示的，而是通过程序的名称表示。这使得实现变得非常容易。\n\
  \n在原则上，实体关系模型中的实体框也可以扩展以包含对行为的引用。问题在于，在此类模型所代表的现实世界中，行为无法通过命名包简单识别。当然，可以对实体类的行为进行建模，但这会导致生成的模型比挤进模型中实体类框的模型复杂得多。\n\
  \n一种专门解决此任务的模型类型被称为`entity life history`（实体生命历史）[Jackson 1983; Eva 1994]。这里的思想是，根据影响实体类典型实例整个生命周期的`system\
  \ events`（系统事件）来描述实体类。\n\nFigure 6-8 显示了一个示例。在图中，顶部显示了实体类`(PURCHASE) ORDER`（采购订单），一组矩形代表以层级形式悬挂在其下方的事件。在这种情况下，`(PURCHASE)\
  \ ORDER` 的目的是获取产品。有三种事件。\n\n![image](img/B9780120887989500073_f06-08-9780120887989.jpg)\n\
  \n图 6-8 实体生命历史示例。\n\n- `Sequence`（序列）：预计这些每一项都按照所示顺序发生。\n- `Iteration`（迭代）：这些每一项都可能发生多次。\n\
  - `Alternative`（备选）：在一个父事件的发生过程中，这组事件中只能发生一个。\n\n在 Figure 6-9 的元模型中，实体类 `SYSTEM\
  \ EVENT TYPE` 的实例现在显示为 `SEQUENTIAL SYSTEM EVENT TYPE`（顺序系统事件类型）、`ITERATIVE SYSTEM\
  \ EVENT TYPE`（迭代系统事件类型）或 `ALTERNATIVE SYSTEM EVENT TYPE`（备选系统事件类型）。这对应于刚刚描述的三种事件类型*^*\
  \ 实体类 `SEQUENTIAL SYSTEM EVENT TYPE` 显示位于 `EVENT TYPE SEQUENCE`（事件类型序列）的之后，而该序列又在另一个\
  \ `SEQUENTIAL SYSTEM EVENT TYPE` 之后。图中还显示每个 `SYSTEM EVENT TYPE` 可能由一个或多个其他 `SYSTEM\
  \ EVENT TYPES`组成。在 Figure 6-8 中，事件的主`sequence`（按此顺序执行）是：\n\n![image](img/B9780120887989500073_f06-09-9780120887989.jpg)\n\
  \n图 6-9 系统事件类型。\n\n- `Order issued`（订单发布）：创建订单的每个实例\n- `Order life`（订单生命）：由在其生命期间可能发生的事件组成\n\
  - `Completion life`（完成生命）：满足订单条款\n- `Order end`（订单结束）：触发订单的正式关闭\n- `Obsolescence`（过时）：导致订单的物理删除\n\
  \n在这个示例中，三个 `SEQUENTIAL EVENT TYPES` 确实由其他 `SYSTEM EVENT TYPES`组成。例如，`Order life`\
  \ 由一个 `ITERATIVE SYSTEM EVENT TYPE`——即 `Order event`（订单事件）组成。`Order event` 又由三个\
  \ `ALTERNATIVE SYSTEM EVENT TYPES` 组成。\n\n- `Order found obsolete`（发现订单过时）\n- `Party\
  \ no longer needs`（当不再需要）\n- `New line item needed`（需要新行项目）\n\n每个 `Order event`\
  \ 必须是以下事实之一（仅限一个）：\n\n- 订单被发现有误（因此必须修正）。\n- 参与其中的某一方离开了订单（因此必须从订单中移除）。\n- 需要一个新的行项目（指的是一个新的订单项）。\n\
  \n## 核心系统过程 (Essential System Processes)\n\nChapter Three 讨论了开发*essential system\
  \ process model*（核心系统过程模型）的过程 [McMenamin and Palmer 1984]。Figure 6-12 重现了 Chapter\
  \ Three 中的示例数据流图，展示了从过程片段推导出核心数据流图的过程。在这里我们从外部系统事件 `Receipt of books`（书籍接收）的角度进行检查，以及连接从\
  \ SYSTEM PROCESS `Check shipment against purchase order`（根据采购订单检查装货）的 `Book received`（收到书籍）到\
  \ SYSTEM PROCESS `Classify book`（书籍分类）的内部系统事件。\n\n\n\n\n此内容的元模型如图图 6-13 所示。它包含了我们之前见过的实体类，但增加了一个特殊的关系，显示每个\
  \ `ESSENTIAL SYSTEM PROCESS` 必须由恰一个 `SYSTEM EVENT TYPE` `定义`。也就是说，虽然一个 `SYSTEM EVENT\
  \ TYPE` 确实可以是任何类型 `SYSTEM PROCESS`的`触发器`，但它只能是 `ESSENTIAL SYSTEM PROCESS`的`基础`。与\
  \ `ESSENTIAL BUSINESS PROCESS`类似，每个 `ESSENTIAL SYSTEM PROCESS` 可能由一个或多个 `ELEMENTARY\
  \ SYSTEM PROCESSES` `组成`。\n\n![image](img/B9780120887989500073_f06-13-9780120887989.jpg)\n\
  \n图 6-13 核心系统过程。\n\n## 业务规则\n\n只有当 `SYSTEM EVENT TYPE` 的“外部指示”为“True”时，它才可以作为 `ESSENTIAL\
  \ SYSTEM PROCESS`的`基础`。\n\n### 反馈循环\n\n二十世纪`控制论`领域的一个伟大见解是对控制结构的表征。其前提是，任何过程都必须通过某种控制器进行管理。控制器向过程发送指令，并接收关于其性能的反馈信息。返回的信息根据指定的\
  \ `set points`（设定点）进行评估，这些值是用于比较信息的标准。（参见图 6-14）。\n\n![image](img/B9780120887989500073_f06-14-9780120887989.jpg)\n\
  \n图 6-14 反馈循环。\n\n这最为人知的例子是家用恒温器。设定一个目标温度（“Set point”），并持续监控房间的实际温度（返回的“Values”）。如果温度高于设定点，则会发送一个指令给空调将其开启。^*\n\
  \n这种结构源于二战期间的工程和过程控制。一旦它被清晰地阐述 [Ashby 1956]，人们就会发现它也适用于企业管理等较“软”的学科。从根本上说，所有的管理数据处理活动（数据仓库等）都涉及向管理层反馈适当的信息，以便做出适当决策来控制和引导组织。事实上，斯坦福德·比尔（Stafford\
  \ Beer）写了《企业的心脏》来记录他描述业务的特定控制论模型[Beer 1979]。作者在《需求分析：从业务视图到架构》中总结了这些原则 [Hay 2003,\
  \ 第 210–235 页]。\n\n图 6-15 显示了 `PROCESS OBJECTIVE`和`SUCCESS CRITERION`，它们是控制论的基础。（此处的\
  \ `SUCCESS CRITERION` 是“Set point”）。每个 `SYSTEM PROCESS` 都可能`指向`一个或多个 `PROCESS OBJECTIVES`。这些每一个目标反过来由一个或多个\
  \ `SUCCESS CRITERIA`（设定点）`控制`。`SUCCESS CRITERION`由“最大值”或“最小值”定义。\n\n![image](img/B9780120887989500073_f06-15-9780120887989.jpg)\n\
  \n图 6-15 指令。\n\n图 6-16 显示了循环的反馈部分。它添加了实体类 `PROCESS MEASUREMENT`，该类属于 `SUCCESS CRITERION`所`依据的`\
  \ `ATTRIBUTE`。此 `PROCESS MEASUREMENT` 就可以作为 `SYSTEM EVENT TYPE`的`来源`，而后者反又是另一个 `SYSTEM\
  \ PROCESS`的触发器。\n\n![image](img/B9780120887989500073_f06-16-9780120887989.jpg)\n\
  \n图 6-16 反馈。\n\n## 第四：程序事件\n\n在传统的计算机编程中，事件最初并没有发挥重要作用。隐式事件是启动程序，因此步骤按顺序执行。有两个趋势改变了这一点：面向对象以及基于用户与计算机直接交互的系统运动。\n\
  \n# 面向对象\n\n图 6-17 显示了面向对象的扩展。这是第三章中面向对象模型的扩展。它是`SUCCESS CRITERION`所`衡量其` `ATTRIBUTE`的`PROCESS\
  \ MEASUREMENT`。此 `PROCESS MEASUREMENT` 就可以作为 `SYSTEM EVENT TYPE`的`来源`，而后者反又是另一个\
  \ `SYSTEM PROCESS`的触发器。注意`DISCRETE INSTANCE`的增加。`DISCRETE INSTANCE`可以接受任何数字或文本。`DISCRETE\
  \ INSTANCE`只能接受一个列表。`DISCRETE INSTANCE`是`STATE`。`DISCRETE INSTANCE`在任何时候都是````的`值`。`DISCRETE\
  \ INSTANCE`是`STATE`是`CLASS IMPLEMENTATION`的`部分`。\n\n![image](img/B9780120887989500073_f06-17-9780120887989.jpg)\n\
  \n图 6-17 状态。\n\n`MESSAGE TYPE`可以作为一个或多个`状态`的`触发器`。也就是说，一个`STATE`可以通过`MESSAGE`移动到另一个`VALUE`。^*\n\
  \n## 业务规则\n\n1. 只有当 `SYSTEM EVENT TYPE` 的“外部指示”为“True”时，它才可以作为 `ESSENTIAL SYSTEM\
  \ PROCESS`的`基础`。\n2. 如前所述，任何`DISCRETE INSTANCE`都由一个或多个`值`控制。\n3. 在模型中，一个`TRANSFORMATION`表现为从一个`VALUE`到另一个。事实上，一个`STATE\
  \ TRANSFORMATION`专门适用于`DISCRETE INSTANCE`。同样，一个`OTHER TRANSFORMATION`只适用于`DISCRETE\
  \ INSTANCE`。\n\n顺便说一下，状态的概念也可以在关系设计中实现。然而，由于面向对象模型起源于实时世界，这个概念更为核心。\n\n例如，假设之前的示例是由面向对象的应用程序实现的，`ORDER`的`CLASS\
  \ IMPLEMENTATION`可能具有从“Issued”的`VALID ATTRIBUTE`值到“Complete”的`TRANSFORMATIONS`，以及从“Complete”到“Closed”，但可能没有从“Issued”到“Closed”的`TRANSFORMATION`。由“接收收货”操作向“目录书籍”操作发送的`MESSAGE`可以作为从“Issued”到“Complete”的`TRANSFORMATION`的`触发器`。\n\
  \n在描述类人的第三章的程序代码示例中，`INSTANCE ATTRIBUTE` `facingWall`是一个`STATE`的例子。在这个模型中，管理`TRANSFORMATION`的业务规则简单地呈现为`STATE\
  \ TRIGGER`的文本属性。也许更复杂的模型可以更明确地表示这种规则的结构。这留给读者练习。\n\n* * *\n\n^*再次需要注意的是，这里使用“系统”一词是为了表示我们正在查看可以自动化的事件，而不是预计使用任何特定的技术。\n\
  \n^*稍后我们将看到，它必须由`BUSINESS EVENT TYPE`或`BUSINESS PROCESS`触发。这就是为什么图中的关系线是强制实线，即使文本说的是“可能”。\n\
  \n\n\n\n\n这些子类型是我之前之所以选择不将 `INTERNAL EVENT TYPE` 和 `EXTERNAL EVENT TYPE` 表示为 `EVENT\
  \ TYPE` 的子类型，而是使用“外部指示器”（External indicator）属性来显示这种区别的原因。\n\n对于那些处于较冷气候地区的人来说，如果温度低于设定点，就会向锅炉发送一个指令让其开启。同样的道理。\n\
  \n在实践中，`STATE` 通常不被视为一个显式属性，而是其他属性值的复合。也就是说，一个 `CLASS` 的完整“状态”是其所有 `STATE` 属性值的总和。然而，出于这个模型的考虑，这样表示会更简单。\n\
  \n# 动机 (MOTIVATION)\n\n“该死，这里没有规则——我们正在完成某些事情。”\n——托马斯·A·爱迪生\n\n“成功有两个规则：1. 永远不要说出你知道的一切。”\n\
  ——罗杰·H·林肯\n\n## 动机列 (THE MOTIVATION COLUMN)\n\n动机列关注企业为什么要做正在做的事情。\n\n– *规划者*（planner）制定了企业的愿景和使命，以及定义业务策略和规则的方法。\n\
  \n– *业务所有者*（business owner）关注所有激励企业业务活动的因素，从规划者视角所赋予的愿景和使命，到构成业务计划的目标、目的以及策略和战术。还包括约束业务运营的业务策略和业务规则。\n\
  \n– *架构师*（architect）负责将业务规则转换为架构数据模型中数据结构上的约束。\n\n– *设计师*（designer）负责实现约束——包括直接存在于数据库管理系统内部的约束，以及必须在数据库外部通过程序编写的约束。\n\
  \n– *构建者*（builder）负责构建将监控和执行业务规则的系统及系统组件。\n\n– *运行系统*（functioning system）实施并执行企业的业务规则和政策。\n\
  \n### 关于动机 (About Motivation)\n\n[图 7-1] 显示了架构框架，其中高亮显示的单元格将是本章的主题。2000 年，业务规则小组（Business\
  \ Rules Group）发表了一篇论文，从业务所有者的视角描述了动机列。该论文在 2005 年进行了更新并重新出版，是本章第一部分的依据 [BRG 2005]。在那篇论文中，小组旨在描述业务计划的终点和手段，以及塑造这些计划元素的影响因素。此外，论文还描述了对这些因素影响的评估，以及启动和约束计划执行的指令。\n\
  \n![image](img/B9780120887989500085_f07-01-9780120887989.jpg)\n\n图 7-1 动机列。\n\n\
  业务规划的元素被认为是元数据，因为它们描述了实际业务过程发生的结构（以及动机）。支持业务所需的概念和事实在这里被描述，恰恰作为业务所有者视角元数据的一部分。\n\
  \n整个企业受到竞争、物理定律和政府的约束。它的目标、目的以及策略和战术，无论如何都会受到这些约束的影响。此外，在表达目标和目的时，管理层对其员工施加了进一步的约束。由于这些原因，来自所有角度的业务规则都是动机列的重要组成部分。\n\
  \n### 使命与愿景 (Mission and Vision)\n\n根据业务规则小组（BRG）的说法，“如果一个企业对其业务活动规定了某种方法，它应该能够说明原因；也就是说，该方法旨在实现什么结果……BRG\
  \ 早期就意识到，任何处理动机的工作基石必须是企业的抱负（其愿景 Vision）以及如何实现的行动计划（其使命 Mission）” [BRG 2005, p.\
  \ 3]。\n\n与其第二行（Row Two），企业的使命和愿景代表了规划者对公司动机的第一行（Row One）视角。然而，它们为理解第二行的元素提供了背景，因此我们将花一点时间来处理它们。[图\
  \ 7-2] 将 `MISSION` 和 `VISION` 显示为实体类。如所述，这些确实是第一行的领域，即规划者视角。在这里，`VISION` 是企业期望未来状态的描述，而不考虑如何实现它。\n\
  \n![image](img/B9780120887989500085_f07-02-9780120887989.jpg)\n\n图 7-2 使命与愿景。\n\n\
  一份特别著名的愿景声明是由制药巨头强生雅约翰公司（Johnson & Johnson）在 1943 年作为其“信条”（Credo）开发的。该声明包含四个段落，每一段都致力于公司对每一位伙伴的责任：医生、护士和患者；其员工；社区以及其股东\
  \ [1943]。\n\n另一方面，`MISSION`（使命）是企业的整体方法——即业务每天正在或将要做的事情。请注意，模型断言每个 `VISION` 可以由多个\
  \ `MISSION` 变为生效，但每个 `MISSION` 只能使一个 `VISION` 生效。在原始的业务规则模型中，没有对基数的可选性做出断言。\n\n\
  ### 终点 (Ends)\n\n[图 7-3] 显示 `VISION` 只是 `END`（终点）的一种。对于组织来说，`END` 只是它想要完成的事情。虽然公司的\
  \ `VISION` 是主要的 `END`，其他的包括各种类型的 `DESIRED RESULT`（预期结果）。`DESIRED RESULT` 是企业意图维持的一种\
  \ `END` 或目标。\n\n![image](img/B9780120887989500085_f07-03-9780120887989.jpg)\n\n\
  图 7-3 终点。\n\n`DESIRED RESULTS` 有两种类型：`GOALS`（目标）和 `OBJECTIVES`（指标）。`GOAL` 是一种 `DESIRED\
  \ RESULT`，是关于通过 `MEANS`（手段）实现或维持的企业状态或条件的特定陈述。（稍后详细介绍 MEANS。）`GOAL` 是 `VISION` 的放大器。换句话，当\
  \ `VISION` 泛指企业的未来状态时，`GOAL` 是实现该 `VISION` 所采取的步骤之一。根据定义，`GOAL` 比 `VISION` 更窄。\n\
  \n`OBJECTIVE` 是对可实现的、有时间目标的且可衡量的 `DESIRED RESULT` 的陈述，企业为了实现其 `GOALS` 而寻求满足。注意，`GOAL`\
  \ 比 `VISION` 窄，但比 `OBJECTIVE` 更通用。与 `GOAL` 不同，`OBJECTIVE` 是：\n\n– *可实现的*（Attainable）：你可以判断它何时被实现。\n\
  – *有时间目标的*（Time-targeted）：有一个特定的日期（如“2007 年 12 月 31 日”）或相对日期（如“两年内”）。\n– *可衡量的*（Measurable）：`OBJECTIVE`\
  \ 的表达中必须包含一个或多个具体的标准，以便衡量以判断目标何时实现，例如“销售额增长 10%”。\n\n\n\n\n\n如果说“目标”（GOAL）是对理想未来状态的通用陈述，那么“业务目标”（OBJECTIVE）就是类似的表达，但使用了具体的、可量化的术语。一个目标可以是“每年增加收入”，但一个业务目标应该是“明年收入增长\
  \ 10%”。除了业务目标可能是目标的`量化`（quantifier）这一显式关系外，“期望结果”（DESIRED RESULT）也可能`由`（composed\
  \ of）一个或多个其他期望结果组成。通常情况下，这种情况仅适用于目标或业务目标内部（目标可以由其他目标组成，业务目标可以由其他业务目标组成），但并非总是如此。\n\
  \n## 手段（Means）\n\n正如“愿景”（VISION）是“目的”（END）的一种类型，“使命”（MISSION）也是“手段”（MEANS）的一种类型，如图\
  \ 7-4\n\n图 7-4 手段。\n\n行动方案必须是“策略”（STRATEGY）或“战术”（TACTIC）。策略是为了实现企业“目的”——特别是“目标”而尝试采取的核心“行动方案”。此外，策略必须是`执行`（to\
  \ carry out）恰一个“使命”。\n\n战术是代表策略的一个或多个细节的行动方案。因此，一个策略可能`通过`（implemented by）一个或多个战术来实施。例如，一家图书馆的愿景是“为全县提供阅读和其他知识材料”，其策略是“运营县立图书馆”；而其战术之一是“获取各种主题的最新书籍”。请注意，尽管模型没有强制这一约束，但通常情况下，策略针对“目标”，而战术针对“业务目标”。\n\
  \n除了每个策略可能`通过`（implemented by）一个或多个战术实施这一显式关系外，通常任何行动方案都可能`由`（composed of）一个或多个其他行动方案组成。此外，一个行动方案可以`启用`（enable）另一个行动方案。也就是说，一个使得另一个方案成为可能。图\
  \ 7-4 显示了“启用”（ENABLEMENT）实体类，即特定行动方案启用另一个行动方案这一事实。换句话之，每个“启用”必须是一个行动方案`通过`（by）另一个行动方案实现的。例如，“为销售团队的每位成员提供笔记本电脑”这一战术启用了“在现场输入销售订单”这一战术。\n\
  \n## 指令（Directives）\n\n手段的第三种类型是“指令”（DIRECTIVE）——一种约束行动方案的规范。它通过两种方式实现这一点。首先，它可能仅仅被设计为`管理`（to\
  \ govern）某个行动方案。例如，“不向信用评级低于 B 的人发放贷款”管理了涉及发放贷款的行动方案。第二个效果是，有时指令本身就是行动方案的`来源`（the\
  \ source of）。这适用于那些其全部目的在于执行指令的行动方案。例如，图书馆的“业务策略”（BUSINESS POLICY）可能是“尽可能为读者提供计算机”，这就是“将现有计算机数量翻倍”这一行动方案（一个战术）的`来源`（source\
  \ of）；图 7-5 显示了这一点。它还显示了指令必须是是“业务策略”或“业务规则”（BUSINESS RULE）。\n\n![image](img/B9780120887989500085_f07-05-9780120887989.jpg)\n\
  \n图 7-5 指令。\n\n业务策略是一种不可直接执行的指令，用于指导业务活动或以通用方式管理这些活动。请注意，它是“管理”，而不是控制或塑造行动方案。例如，说“我们不允许实地访访”限制了为了实现“增加市场份额”这一策略而可选的战术。它并没有规定这些战术应该是什么。\n\
  \n业务规则是对企业更具体、更具操作性的`约束`（constraint on）。特别是，`基于`（based on）业务策略，它对“事实”（FACT）或“事实类型”（FACT\
  \ TYPE）施加`约束`。例如，一个事实类型可以是“客户为租赁汽车的损坏支付费用”这一断言。业务规则可以为此陈述增加义务，如下：“客户`必须`（must be）为租赁汽车的损坏付费”。或者规则可以为事实类型增加许可：“客户`不需要`（need\
  \ not）为租赁汽车的损坏付费”。\n\n在业务规则团队提交给对象管理小组（Object Management Group）的报告《业务词汇和业务规则的语义》中，他们将业务规则定义为“一个引入义务或必要性的元素”\
  \ [BRT 2005, 第 14–15 页]。通常，业务策略为行动方案设定方向，而业务规则是对其更具体的约束。图 7-6 显示了更多关于指令的内容。具体而言，它显示了每个指令可能`取决于`（subject\
  \ to）一个或多个“执行实现”（ENFORCEMENT IMPLEMENTATIONS），其中每一个都必须是特定的“执行级别”（ENFORCEMENT LEVEL）。执行级别是衡量业务规则执行程度的指标。\n\
  \n![image](img/B9780120887989500085_f07-06-9780120887989.jpg)\n\n图 7-6 执行级别。\n\n\
  虽然执行级别可以通过多种方式定义，但业务规则小组列出了：\n\n- `严格执行`（Strictly enforced）：如果违反规则，则始终执行惩罚。\n- `预先授权覆盖`（Pre-authorized\
  \ override）：执行但允许预先批准。\n- `事后证明覆盖`（Post-justified override）：如果事后未获得批准，可能会受到制裁或其他后果。\n\
  - `带解释覆盖`（Override with explanation）：发生违规时，必须有说明注释。\n- `指南`（Guideline）：建议性的规则，但不执行。\n\
  \n执行实现是指特定业务规则按照指定的执行级别被执行的事实。这种执行实现才是一个或多个“后果调用”（CONSEQUENCE INVOCATIONS）的来源。每个后果调用反过来必须是特定“后果”（CONSEQUENCE）的`示例`，例如“解雇”、“扣薪”等。\n\
  \n因此，例如，“公司车辆不得用于个人事务”这一业务规则可能`取决于`一个属于`预先授权覆盖`执行级别的执行实现（经预先批准后可以借用），而“没有签名字的取货单不允许从库存中提取材料”的规则可能是一个`严格执行`执行级别的执行实现对象。这种执行实现反过来可能是“损失薪水”这一后果调用的`来源`（of）。\n\
  \n请注意，指令的执行实现可能受到受该指令``管理`（governed by）或`基于其制定`（formulated based on）的战术的影响。也就是说，在一种战术下，指令可能是“严格执行”，但在另一种战术下，同一个指令可能是“事后证明覆盖”。^*\n\
  \n\n\n\n\n为了完全理解一个组织的动机，必须处理其运作的环境。在这个模型中，环境被刻画为一组`INFLUENCERS`（影响因素），其中`INFLUENCER`是指任何可以在不明显施加实体力量或直接行使命令的情况下对企业产生影响的事。影响因素通常在没有刻意努力或意图的情况下发挥作用。\n\
  \n影响因素必须是是源于组织内部的`INTERNAL INFLUENCER`，或者是以某种形式来自外部世界的`EXTERNAL INFLUENCER`。每个影响因素必须恰好属于一种`INFLUENCER\
  \ TYPE`。这种冗余表示意味着前两种类型是“内部影响因素”和“外部影响因素”。\n\n根据业务规则小组（Business Rules Group），内部影响因素包括：\n\
  \n- `Habit`（习惯）：惯常做法或用法。\n- `Assumption`（假设）：被视为所当然或未经证明的断言。\n- `Infrastructure`（基础设施）：企业的基础特征。\n\
  - `Issue`（问题）：两个竞争双方之间的争议点或事项。\n- `Prerogative`（特权）：根据企业中的所有权或职位行使的权利或优先权。\n- `Resource`（资源）：开展企业业务的可用资源，特别是它们的质量。\n\
  - `Corporate value`（企业价值观）：企业推广或认可的理想、习惯或制度。其中每项必须是：\n    - `Explicit corporate\
  \ value: A`（显性企业价值观）：作为书面政策说明的价值观。\n    - `Implicit corporate value: A`（隐含企业价值观）：企业内部部分或全员理解但未明确说明的价值观。\n\
  - `Other internal influencer`（其他内部影响因素）：此处未列出的内部影响因素 [BRG 2005, p. 29]。\n\n同样根据业务规则小组，企业的每个外部影响因素必须是以下之一：\n\
  \n- `Environment`（环境）：影响企业存在或发展的周围条件的和。\n- `Technology`（技术）：应用于企业的技术流程、方法或知识的发展及其局限性。\n\
  - `Supplier`（供应商）：能够为企业提供或供应产品或服务的个人或企业。\n- `Customer`（客户）：调查过、订购、接收或支付过企业产品或服务的个人或企业。\n\
  - `Competitor`（竞争对手）：竞争企业。\n- `Partner`（合作伙伴）：由于互利互惠，与目标企业共享风险和利润的企业。\n- `Regulation`（监管）：由政府机构或企业管理层等权威规定的命令。\n\
  - `Other external influencer`（其他外部影响因素）：此处未列出的外部影响因素 [BRG 2005, p. 26]。\n\n图 7-7\
  \ 显示，影响因素对`MEANS`（手段）和`ENDS`（目的）的影响由一个或多个`ASSESSMENTS`（评估）决定，而一个`ASSESSMENT`是对影响因素相对于一个或多个`MEANS`（如特定的`COURSE\
  \ OF ACTION`行动方案）或相对于一个或多个`ENDS`（如特定的`DESIRED RESULT`预期结果）的判断，因为一个评估可能有多种影响。因此，模型还显示每个`ASSESSMENT`必须由一个或多个`ASSESSMENT\
  \ ELEMENTS`（评估元素）组成。然后，这些元素中的每一个必须针对一个`MEANS`或一个`END`。\n\n![image](img/B9780120887989500085_f07-07-9780120887989.jpg)\n\
  \n图 7-7 影响因素与评估。\n\n此外，图 7-7 根据一种称为“SWOT”的特定评估方法，显示了`ASSESSMENT ELEMENT`的四种子类型。该方法认为，对影响因素进行评估可以构成针对某个`END`或`MEANS`的以下之一：\n\
  \n- `STRENGTH`（优势）：企业内部优势领域的优点。\n- `WEAKNESS`（劣势）：企业内部不足的领域。\n- `OPPORTUNITY`（机会）：有利的影响。\n\
  - `THREAT`（威胁）：不利的影响。\n\n存在其他评估影响因素的方案。例如，“企业价值观”如果与新趋势兼容，可以代表针对特定`COURSE OF ACTION`的`STRENGTH`；或者如果它导致了损害销售的行为，可以代表针对特定`OBJECTIVE`目标的`WEAKNESS`。竞争对手营销活动的问题可能是机会，而与合作伙伴（`PARTNER`的问题可能是威胁。\n\
  \n`ASSESSMENT ELEMENT`的净效应是识别一个衡量的`POTENTIAL IMPACT`（潜在影响），这可能是潜在的`RISK`（风险）或潜在的`REWARD`（奖励）。`POTENTIAL\
  \ IMPACT`可以用`RISK`或`REWARD`的“概率”及其“影响值”来表示。该值以“单位”为准。\n\n\n\n\n\n例如，库`BUSINESS RULE`（业务规则）“逾期书籍应及时回收”通过使用`BUSINESS\
  \ PROCESS`（业务流程）“致电逾期书籍读者”提供了`GOVERNANCE`（治理）。`BUSINESS POLICY`（业务策略）“图书馆将始终保持吸引且整洁的外观”通过所有与清洁和维护相关的`BUSINESS\
  \ PROCESSES`（业务流程）提供了`GUIDANCE`（指导）。\n\n注意，通常每个 `MEANS EFFECT`（手段效果）必须属于一个`MEANS`（手段），并通过一个`BUSINESS\
  \ PROCESS`（业务流程）来支持一个`DESIRED RESULT`（预期结果）。但你在这里看到的是另一个具有子类型的示例。显然，`EFFORT`（努力）被`COURSE\
  \ OF ACTION`（行动方案）调用的实例，以及`DIRECTION`（方向）来自`DIRECTIVE`（指令）的实例，也都都是属于`MEANS`的`MEANS\
  \ EFFECT`的子类型。\n\n遗憾的是，正如我们之前看到的，这种关系作为另一种关系的子类型的概念无法直接在实体-关系图中显示。这让建模者陷入了困境。如果模型的目的是解释概念，那么这里使用的方法是合适的。查看者首先看到详细的关系，然后看到它是更通用的事物的示例。这毕竟，这就是实体类被揭示的方式。然而，它的缺点是，当模型交给数据库设计人员时，可能会产生一项重大的任务。在生成数据库设计之前，消除此类冗余将是非常重要的。\n\
  \n或者，可以只显示通用关系，但必须添加业务规则来断言，例如，`EFFORT`（努力）只能属于`COURSE OF ACTION`（行动方案）。\n\n## 第三行：架构师视图\n\
  \n在处理动机主题时，架构师关注`business rules`（业务规则），并将其视为`system constraints`（系统约束）。正如本章开头所述，整个企业受到竞争、物理定律、物流和政府的约束。它的目标和目的以及策略和战术受到这些约束的影响。此外，管理层在表达其目标和目的时对其员工施加了进一步的约束。由于这些原因，所有角度的业务规则都是`Motivation`（动机）列的重要组成部分。架构师对这些约束的视图专门关注规则如何在数据中被解释。\n\
  \n### 关于业务规则\n\n第二行模型建立了描述公司动机的参数。当你到达第三行的架构师视图时，有必要更具体地描述约束和指导企业行为的业务规则。具体来说，架构师关注业务规则如何约束`data`（数据）。\n\
  \n1994 年，Ron Ross 规定了描述业务规则的语法。同时，他意识到在信息处理背景下，业务规则对数据的应用比对过程的应用更多 [Ross 1994, 1997]。几乎每条规则都是对数据可以更新、删除或访问——以及何时访问的约束。\n\
  \n1995 年（2000 年更新），业务规则小组（Business Rules Group）从信息系统（第三行）的角度概述了业务规则的概念。尽管他们将其称为“定义或约束业务某些层面的陈述”\
  \ [BRG 2000]，但他们的意图是描述业务规则对数据的影响。出于这个原因，这里的第三行业务规则将被称为`system constraints`（系统约束）。^*\
  \ 在“定义业务规则”论文中，业务规则小组将业务规则分为以下几类。\n\n- 结构性断言，包括：\n    → 术语（及其背后的概念）\n    → 事实（基于术语的组合）\n\
  \    → 衍生\n- 动作性断言，可以进一步分类为：\n    → 唯一性约束\n    → 可选性和功能性\n    → 引用完整性约束\n    → 对数据的其他所有其他约束\
  \ [BRG 2000, p. 6]\n\n在这些规则中，只有术语和事实可以在实体-关系模型中被很容易地描述，因为它们是关于数据结构的。另一方面，动作性断言是关于数据处理的，因此通常不表示在实体-关系图中。由于这个原因，术语和事实的概念不是业务规则讨论的一部分，而是在第二章中被描述为第一列（数据）主题。这也是为什么业务规则团队最近将术语和事实从“业务规则”类别中排除出去。相反，他们断言业务规则是建立在事实类型之上的\
  \ [BRT 2005]。\n\nRoss 先生的努力强调的一点是，在大多数情况下数据模型无法描述动作性断言。为此，需要不同的模型。这与数据建模与关系理论的联系有关。可以想象数据库管理系统执行引用完整性、唯一性和可选性，但对于其他所有情况，都需要编写程序来实现约束^*\n\
  \n有一些在数据模型中显示的结构性约束（基数、可选性、领域），但它们是事实约束，因此在这里的业务规则语境下被恰当地讨论。衍生也是如此，尽管衍生属性可以在实体-关系模型中显示。\n\
  \n动作性断言是最难处理的。其中较小的是找到一种语言来表达它们。Ross 先生创建了一种符号，作为《业务规则》（Ross 1997 的基础，而对象角色技术（Object\
  \ Role technique）具有描述某些规则的语法，但两者都没有被广泛接受。对这种语言的需求是业务规则团队将语义作为其目标部分的动力，这项工作在第二章中描述\
  \ [BRT 2005]。\n\n然而，我们可以使用元模型来分解第三行约束的含义。这里的模型描述了这种语言应该表达的内容。它将从处理由数据模型处理的约束（唯一标识符、可选性和基数）开始。它将处理动作性断言，在这里称为`system\
  \ constraints`。\n\n### 示例模型\n\n为了说明本节及后续章节的主题，图 711 显示了在第二章中首次显示的示例实体关系模型。在图中，一个`ORDER`（订单）必须从一个`PARTY`（买方）到另一个`PARTY`（卖家）。它由一个或多个`LINE\
  \ ITEMS`（行项目）组成，每个行项目必须属于一个`PRODUCT TYPE`（产品类型）或一个`SERVICE TYPE`（服务类型）。下面的图说明了可以在此类模型中表示的约束。\n\
  \n![image](img/B9780120887989500085_f07-11-9780120887989.jpg)\n\n图 7-11 示例实体关系模型。\n\
  \n- 任何参与`unique identifier`（唯一标识符）的`ATTRIBUTE`（属性）都用井号（#）标记，任何参与的`RELATIONSHIP ROLE`（关系角色）都通过跨越关系线靠近被识别实体类的短线来显示。其他表示法不同，但含义相同。\n\
  \n\n\n\n因此，`PURCHASE ORDER`的发生通过 `ATTRIBUTE` “Order number”的值来唯一标识，正如 `PARTY`的发生通过其“Id”来标识一样。另一方面，`LINE\
  \ ITEM` 发生的 `UNIQUE IDENTIFIER` 是 `ATTRIBUTE` “Line number”和 `RELATIONSHIP ROLE`\
  \ “part of one and only one ORDER”的组合。也就是说要唯一标识一个行项目，你必须同时知道“Line number”和它所关联的\
  \ `ORDER`。\n\n- 关系中的每条实线半线意味着其相邻的实体类的每个发生实例*必须*与对立实体类的至少一个实例相关联（*可选性约束*）。\n\n- 如果关系线的一端没有被“乌鸦爪”标记，则对立实体类的发生实例*可能不会*与相邻实体类的多个发生实例相关联（*基数约束*）。\n\
  \n- 括号中显示的属性是*派生的*。例如，`LINE ITEM` 中的“(Value)”是通过从 `PRODUCT TYPE` 或 `SERVICE TYPE`\
  \ 推导出“Price”或“Rate per hour”，然后乘以 `LINE ITEM` 中的“Quantity”得到的。`ORDER` 中的“((Total\
  \ value)”是通过对所有*属于* `ORDER` 实例的 `LINE ITEMS` 求和“(Value)”来计算的。（大多数 CASE 工具必须在后台描述这些计算的算法。）\n\
  \n- 跨越 `LINE ITEM` 的两个 *for* 关系的弧意味着每个 `LINE ITEM` 必须是*为了*一个 `SERVICE TYPE` 或为了一个\
  \ `PRODUCT TYPE`（*排他性约束*）。\n\n这些将在后续章节中进行更详细的描述和建模。 # 唯一标识符\n\n关系环境中应用的第一个约束是根据定义，每个实体类的发生都必须被唯一标识。也就是说，你必须能够区分\
  \ `ENTITY CLASS` 的一个发生实例另一个。这是通过一个或多个 `ATTRIBUTES` 或 `RELATIONSHIP ROLES` 的值实现的。用于唯一标识\
  \ `ENTITY CLASS` 发生的 `ATTRIBUTES` 和 `ASSOCIATIVE ROLES` 的组合就是该 `ENTITY CLASS` 的*唯一标识符*。\n\
  \n图 7-12 中的模型显示，每个 `ENTITY CLASS` 的 `UNIQUE IDENTIFIER`（作为 `FACT TYPE`）必须*由*一个或多个\
  \ `UNIQUE IDENTIFIER ELEMENTS`（作为 `FACT TYPE ELEMENTS`）*组成*。因此，每个 `UNIQUE IDENTIFIER\
  \ ELEMENT` 必须*使用* `ATTRIBUTE` 或 `ASSOCIATIVE ROLE`。\n\n![image](img/B9780120887989500085_f07-12-9780120887989.jpg)\n\
  \n图 7-12 唯一标识符。\n\n## 业务规则\n\n1. 每个 `UNIQUE IDENTIFIER ELEMENT` 必须*属于*唯一的 `UNIQUE\
  \ IDENTIFIER`。\n2. 每个 `UNIQUE IDENTIFIER` 必须*由*至少一个可能的多个 `UNIQUE IDENTIFIER ELEMENTS`\
  \ 组成。\n\n### 可选性约束\n\n在数据模型中，关系角色的参数之一是对于第一个类的每个发生是否存在第二个类的发生。换句话说，角色是*强制的*还是*可选的*？同样，对于实体类的每个发生，每个属性是*强制的*还是*可选的*？\n\
  \n大多数符号都有符号来表示这一点。在本书使用的符号中，如果靠近第一个实体的线段是虚线，则角色是可选的；如果该线段是实线，则是强制的。如果属性在图上的名字前面有一个圆圈\
  \ (o)，它是可选的，如果前面有星号 (^*) 或井号 (#)，则是强制的。\n\n在目前为止显示的元数据模型（参见图 7-13, pp. 57–63]。但“最初可能但最终必须”也并不足够。\n\
  \n![image](img/B9780120887989500085_f07-13-9780120887989.jpg)\n\n图 7-13 默认可选性。\n\
  \n我们需要根据涉及的实体类的状态指定可选性如何变化。也许当某事处于“待处理”时是可选的，但在“生效”之前是强制的，当它变成“过时”时又是可选的。\n\n\n\n\
  \n![image](img/B9780120887989500085_f07-16-9780120887989.jpg)\n\n图 7-16 基数。\n\n\
  对于实体/关系表示法，`Cardinality indicator`（基数指示器）的值必须为 `True`（只允许属性或关系存在一个实例）或 `False`（允许多个）。对于\
  \ UML，`Cardinality indicator` 可以取特定值（如 `\"1\"`、`^*`、`2–3` 等）。\n\n## 推导\n\n*derivation*（推导）是从业务中其他知识中推得出的知识陈。在从业务所有者处收集二层（Row\
  \ Two）信息时，将最重要的推导捕并记录为 `FACT TYPES`（事实类型）可能是合适的。然而，要将推导添加到我们的三层（Row Three）元模型中，必须用三层的\
  \ `ENTITY CLASSES`（实体类）、`ATTRIBUTES`（属性）和 `RELATIONSHIP ROLES`（关系角色）来表示它们。这在图 7-17\
  \ 中所示。\n\n![image](img/B9780120887989500085_f07-17-9780120887989.jpg)\n\n图 7-17\
  \ 推导。\n\n## 业务规则\n\n1. 作为一个 `FACT TYPE`，一个 `DERIVATION`（推导）必须由一个或多个作为 `ATTRIBUTES`\
  \ 的 `FACT TYPES ELEMENTS` *组成的*（即*对这些元素的*约束*），并由一个或多个作为 `DERIVATION ELEMENTS` 的\
  \ `FACT TYPES ELEMENTS` *组成的*。\n2. 每个 `DERIVATION ELEMENT` 必须*属于*一个且仅一个 `DERIVATION`。\n\
  \n一个 `DERIVATION ELEMENT` 也可以*通过*（`\"SUM-THROUGH\"` 或 `\"INFER-THROUGH\"`）一个 `ASSOCIATIVE\
  \ ROLE`（关联角色）（此类示例请参见第 306 页）。\n\n公式的计算可以使用逆波尔表达式法（Reverse Polish Notation）表示：公式中的每个变量都被分离并分配一个\
  \ `Operator`（运算符）。因此，每个 `DERIVATION ELEMENT` 可能是*使用*一个变量，该变量是另一个 `ATTRIBUTE`、`SYSTEM\
  \ VARIABLE`（系统变量）或 `\"Constant\"`（常量）。除了变量外，每个 `DERIVATION ELEMENT` 还包含属性 `Operator`，以定义变量在公式中的作用。例如，根据公式\
  \ `\"A = B + C ^* D + 15\"`，属性 `A` 可以由属性 `B`、`C` 和 `D` 推导出。这将如表 7-1 所示。\n\n表 7-1\n\
  \n推导元素。\n\n![image](img/B9780120887989500085_cetable1.png)\n\n在三种情况下，`DERIVATION\
  \ ELEMENT` 是*使用*其他 `ATTRIBUTES` 作为变量。在一种情况下，它使用了 `DERIVATION ELEMENT` 自身的属性：`\"\
  Constant\"`。因此，首先加上属性 `B`（加无无），得到 `\"B\"`。然后加上 `\"C\"`，得到 `\"B + C\"`。然后将 `\"D\"\
  ` 乘以到此为止的结果，从而得到 `\"(B + C) ^* D\"`。\n\n最后，加上常量 `\"15\"` 以得到最终结果。作为一个更真实的例子，`\"\
  Age last week\"` 可以定义为 `\"<system date> – Birthdate – 7 days\"`，其中 `<system date>`\
  \ 是 `SYSTEM VARIABLE` 的示例。该公式的 `DERIVATION ELEMENTS` 显示在表 7-2 中。\n\n表 7-2 系统变量。\n\
  \n![image](img/B9780120887989500085_cetable2.png)\n\n注意，这是架构师视图（Architect’s View），而不是设计视图（designer’s\
  \ view）。这里没有说明计算是在数据输入时完成（然后存储），还是在请求结果时动态完成。这是一个基于预期更新和检索频率的设计决策。\n\n同样注意，计算可以跨实体类关系进行。例如，在图\
  \ 7-11 中，`PRODUCT` 的 `\"Price\"` 可以跨 `LINE ITEM` 和 `PRODUCT` 之间的关系推导出来。由于每个 `LINE\
  \ ITEM` 必须对应一个且仅一个 `PRODUCT`，因此 `\"Price\"` 对 `LINE ITEM` 可用。因此，`LINE ITEM` 的 `(Value)`\
  \ 可能被表示为 `\"Quantity^* INFER-THROUGH (** PRODUCT TYPE)\"`，如表 7-3 所示。\n\n表 7-3 1\
  \ (Value)。\n\n![image](img/B9780120887989500085_cetable3.png)\n\n同样，`PURCHASE ORDER`\
  \ 的 `(Total value)` 可能是所有 `PURCHASE ORDER` `LINE ITEMS` 的 `(Value)` 之和。它是 `PURCHASE\
  \ ORDER` 的 `(Value)` 的*组成部分*。\n\n\n\n\n与 `ATTRIBUTE` 的子类型类似，每个 `DOMAIN` 必须是一个 `VALUE\
  \ SET`、`VALUE EXPRESSION` 或 `OTHER DOMAIN`。`VALUE SET` 用于验证 `DISCRETE ATTRIBUTES`，它同样由一个或多个\
  \ `PERMITTED ATTRIBUTE VALUES` 组成。`VALUE EXPRESSION` 运用数学方法来约束 `ATTRIBUTES`。除其他外，它可以可以是用于得出\
  \ `ATTRIBUTE` “值”的 `DERIVATION`，也可以用于一组 `CONTINUOUS ATTRIBUTES` 设定“最大值”和/或“最小值”。`OTHER\
  \ DOMAIN` 可用于指定格式或模式。\n\n请注意，文中并未说明 `DOMAIN` 和 `PERMITTED ATTRIBUTE VALUE` 将如何被表述。相反，给定一个特定的\
  \ `PERMITTED ATTRIBUTE VALUE`，它必须由一个或多个 `VALID CODE` 表示（参见图 7-20）。（注意，这是 `BUSINESS\
  \ CONCEPT` 与 `SYMBOL` 之间更通用关系的一种子类型。）\n\n![image](img/B9780120887989500085_f07-20-978012088798.jpg)\n\
  \n图 7-20 代码集。\n\n`VALUE SET` 与 `CODE SET` 之间的区别在于，`PERMITTED ATTRIBUTE VALUE` 是该值的概念。`PERMITTED\
  \ ATTRIBUTE VALUE` 由 `VALUE CODE` 表示，而 `VALUE CODE` 反过来又使用 `SIGNIFIER`，例如 `WORD`\
  \ 或 `ABBREVIATION`。例如，“加拿大省份”的 `VALUE SET` 由“魁北克”（Quebec）、阿尔伯塔”（Alberta）、安大略”（Ontario）等概念的\
  \ `PERMITTED ATTRIBUTE VALUES` 组成。其中每一个概念都可以由一个或多个 `VALID CODES` 表示。例如，不列颠哥伦比亚省可以用“British\
  \ Columbia”、“BC”、“02”等表示。\n\n每个 `VALID CODE` 反过来必须是 `CODE SET` 的一部分，即在这种情况下，它是 `VALUE\
  \ SET` 的一种表示。在加拿大省份的示例中，“加拿大省份”的 `VALUE SET` 可以由“官方名称”、“邮政缩写”等 `CODE SET` 表示，其中“官方名称”是作为\
  \ `VALUE SET` “加拿大省份”标准表示的 `CODE SET`。\n\n## 业务规则\n\n1. `VALUE SET` 可以仅是对某个 `DISCRETE\
  \ ATTRIBUTE` 的约束。\n2. `OTHER DOMAIN` 可以仅是对某个 `CONTINUOUS ATTRIBUTE` 的约束。\n3. `PERMITTED\
  \ ATTRIBUTE VALUE` 只能由一个 `VALID CODE` 表示，该代码属于 `CODE SET`，且它是该 `PERMITTED ATTRIBUTE\
  \ VALUE` 所属的 `VALUE SET` 的标准表示。\n\n# 系统约束\n\n由于数据模型可以表示基数和可选性、唯一标识符以及派生属性，因此这些约束的元模型（以及域的元模型）与第二章中描述的数据模型元模型密切相关。然而，还有许多实体关系模型无法表示的约束。因此，用于数据建模的元数据也不足以表示这些约束。但在表示法有限的情况下，该元模型并非如此。模型可以很容易地扩展，如图\
  \ 7-21 所示。[^*]](#B9780120887989500085.htm_fn9)\n\n![image](img/B9780120887989500085_f07-21-978012088798.jpg)\n\
  \n图 7-21 系统约束。\n\n此图引入了 `SYSTEM CONSTRAINT` 的概念，它必须约束 `ATTRIBUTE`、`ASSOCIATIVE ROLE`\
  \ 或 `ENTITY CLASS`。也就是说，`SYSTEM CONSTRAINT` 是限制可以创建或更新数据的断言。推测，这是 `BUSINESS RULE`\
  \ 的反映，该规则断言了业务中可以做什么或不能做什么。与 `BUSINESS RULES` 的这种联系将在后续材料中进一步讨论。\n\n每个 `SYSTEM CONSTRAINT`\
  \ 可能是更复杂的 `SYSTEM CONSTRAINT` 的一部分。请注意，`SYSTEM CONSTRAINT` 只是我们已经看到的 `OPTIONALITY\
  \ CONSTRAINT` 和 `EXCLUSIVITY CONSTRIANT` 的泛化。尽管，它们只是特例，而这是一个要广泛得的模型。\n\n属性“Condition\
  \ indicator”（指示器）决定了 `SYSTEM CONSTRAINT` 是一个 `integrity constraint`（指示器值为“False”）——意味着它在断言某事必须成立——还是一个\
  \ `condition`（指示器值为“True”），意味着如果存在某种情况，则必须发生其他指定的动作。（请注意，根据定义，`OPTIONALITY CONSTRAINT`\
  \ 和 `EXCLUSIVITY CONSTRAINT` 都是完整性约束。）\n\n图 7-21 还显示了 `SYSTEM CONSTRAINT` 可能是一个或多个\
  \ `SYSTEM CONSTRAINT TRIGGERS` 的源，每个触发器都必须是 `SYSTEM PROCESS` 或另一个 `SYSTEM CONSTRAINT`。请注意，只有当\
  \ `SYSTEM CONSTRAINT` 为“True”时，才可能这样做。\n\n## 业务规则\n\n1. 只有“指标”为“True”的 `SYSTEM CONSTRAINT`\
  \ 可作为一个或多个 `SYSTEM CONSTRAINT TRIGGERS` 的源。\n2. 根据定义，每个 `EXCLUSIVITY CONSTRAINT`\
  \ 必须是完整性约束，其“指标”为“False”。\n3. `OPTIONALITY CONSTRAINT` 必须基于唯一的 `ENTITY CLASS`。（这在此未显示，但在图\
  \ 7-15 中显示过。）\n\n如图 7-21 所示，每个 `SYSTEM CONSTRAINT` 必须遵循一个或多个 `CONSEQUENCE OF VIOLATION`，每个\
  \ `CONSEQUENCE OF VIOLATION` 都必须是 `SYSTEM PROCESS` 或另一个 `SYSTEM CONSTRAINT`。请注意，只有当\
  \ `SYSTEM CONSTRAINT` 指标为“True”时，才可能这样做。\n\n除了 `OPTIONALITY CONSTRAINT` 和 `EXCLUSIVITY\
  \ CONSTRAINT`，还有许多 `SYSTEM CONSTRAINT`（类型）。这里的 `SYSTEM CONSTRAINT` 为“可选约束”、“互斥约束”和“其他系统约束”。\n\
  \n#### 系统约束元素与参数\n\n如果 `SYSTEM CONSTRAINT` 要约束某些东西，是什么在进行约束？例如，`EXCLUSIVITY CONSTRAINT`\
  \ 约束了 `ASSOCIATIVE ROLES`。也就是说，它被两个或多个 `EXCLUSIVITY ELEMENTS` 约束，其中每个元素都由一个唯一的 `ASSOCIATIVE\
  \ ROLE` 约束。大多数 `SYSTEM CONSTRAINTS` 并不限于由单一事物进行约束，因此我们需要额外的实体类，`SYSTEM CONSTRAINT\
  \ ELEMENT`。这种 `EXCLUSIVITY CONSTRAINT` 的泛化是特定的 `ATTRIBUTE`、`RELATIONSHIP ROLE` 或\
  \ `ENTITY CLASS` 参与了 `SYSTEM CONSTRAINT`。\n\n图 7-22 显示每个 `SYSTEM CONSTRAINT` 由一个或多个\
  \ `SYSTEM CONSTRAINT ELEMENTS` 组成，每个元素都是另一个 `ENTITY CLASS`、`ATTRIBUTE` 或 `RELATIONSHIP\
  \ ROLE` 的约束。或者，它可以是另一个 `SYSTEM CONSTRAINT` 的约束。图还显示了 `SYSTEM CONSTRAINT` 或 `SYSTEM\
  \ CONSTRAINT ELEMENT` 如何由一个或多个 `SYSTEM CONSTRAINT ARGUMENTS` 进行限定。\n\nRoss 先生在其著作\
  \ [Ross 1997] 中，列举了四十种 `SYSTEM CONSTRAINT TYPES`，并将其分为七类。\n\n- 实例验证（Instance verifiers）：完整性约束要求受约束对象的实例存在。这包含了之前描述的可选性约束。条件用于检查其是否存在。\n\
  - 类型验证（Type verifiers）：完整性约束要求受约束对象的实例以指定的关系相互关联（互斥、互包含等）。这包含了图 7-11 中所示的互斥弧。在该示例中，该表示法断言“每个\
  \ LINE ITEM 必须属于一种 PRODUCT TYPE 或一种 SERVICE TYPE”。条件用于检查是否如此。\n\n\n\n\n- **位置验证器\
  \ (Position verifiers):** 完整性约束要求受约束相对于相对于对象具有特定的排序（最低、最高、最旧、最新或指定的排序，例如第五个）。条件用于检查是否满足该要求。\n\
  **功能验证器 (Functional verifiers):** 完整性约束要求一个对象相对于受约束对象承担某种功能。例如，某个属性的值可能在实体类中是唯一的。条件用于检查是否满足该要求。\n\
  - **比较评估器 (Comparative evaluators):** 通常应用于属性，完整性约束要求一个对象大于、小于或等于受约束对象。条件用于检查是否满足该要求。\n\
  - **数学评估器 (Mathematical evaluators):** 这是之前述的指定派生属性的另一种方式。在这种情况下，完整性约束规定根据公式（或函数，如\
  \ `SUM`）对受约束实体类进行属性计算。条件用于检查是否满足该要求。\n- **投影控制器 (Projection controllers):** 当其他类型的约束阻止某些事情发生时，投影控制器断言在特定情况下某些事情*必须*发生。例如启用某个状态、复制某些内容或执行某项操作。\n\
  \n此外，还有许多派自这些规则的规则类型。图 7-23 显示了 Ross 表示法，用于处理我们在图 7-14 中看到的可选问题的另一种方法。该符号显示了一个由带有“TI”的自行车座形状符号表示的\
  \ `SYSTEM CONSTRAINT (Timing)`（时间），另一个由带有“X”的箭头表示的 `SYSTEM CONSTRAINT (Optionality)`（可选性）。自行车符号表示时间约束是一个\
  \ `Condition`（条件），箭头符号表示可选性约束是一个完整性约束。\n\n![image](img/B9780120887989500085_f07-23-9780120887989.jpg)\n\
  \n图 7-23 业务规则参数示例。\n\n`TI` 和 `X` 是之前讨论过的 `SYSTEM CONSTRAINT TYPES` 的示例。`TI` 是一个派生的\
  \ `SYSTEM CONSTRAINT TYPE`，意味着如果在指定的时间范围内发生了某事，则应该发生另一件事。在这种情况下，“另一件事”是一个 `X` `SYSTEM\
  \ CONSTRAINT`（来自前一个列表的 `Instance Verifier`），意味着它所指向的内容（在本例中为*已入账的* RELATIONSHIP\
  \ ROLE）*必须*发生。换句话说，在 `TI` 约束显示的时间间隔之后，*已入账的*关系必须被填充。\n\n在每个情况下，被约束的对象位于指向约束的线的另一端，而执行约束的对象位于*远离*约束的线的末端。也就是说，`TI`\
  \ 正在约束 `ENTITY CLASS` “Asset”，而 `X` 正在约束约束 `TI`。理解“被……约束/……的约束”语法的另一种方法是将每条规则想象成\
  \ *if/then* 语句：(1) 如果 `ASSET` 存在超过 1 周，则调用强制（“X”）约束；(2) 如果时间（“TI”）约束触发，则*已入账的*关系角色必须存在。\n\
  \n请注意，显示“GT”（代表“大于”）和“1 wk”（代表“一周”）的圆圈是约束的 `SYSTEM CONSTRAINT ARGUMENTS` 示例，在这种情况下意味着“如果经过了超过一周的时间段”，那么……在图\
  \ 7-22 中，`<unused123> CONSTRAINT ARGUMENT` 显示适用于一个 `SYSTEM CONSTRAINT ELEMENT` 或*针对*一个\
  \ `SYSTEM CONSTRAINT`，并且它必须是 `SYSTEM CONSTRAINT ARGUMENT TYPE` 的*示例*，例如“运算符”或“时长”。\n\
  \n### 业务规则映射\n\n请注意，本节描述的所有系统约束都派生自 `BUSINESS RULES`，正如上一节中为第二行指定的那样。图 7-24 具体展示了来自第二行的\
  \ `BUSINESS RULE` 如何映射到此处描述的、适用于第三行的任何约束上。\n\n![image](img/B9780120887989500085_f07-24-9780120887989.jpg)\n\
  \n图 7-24 业务规则映射。\n\n- 唯一标识符 (Unique Identifiers)\n- 域 (Domains)\n- 系统约束 (System\
  \ Constraints)\n\n具体而言，每个 `BUSINESS RULE` 都可能*适用于*一个或多个 `BUSINESS RULE MAPPINGS`，其中每一个映射反过来必须*由*一个或多个\
  \ `BUSINESS RULE MAPPING ELEMENTS`。那么，每个 `BUSINESS RULE MAPPING ELEMENT` 必须映射*到*\
  \ `DOMAIN`、`UNIQUE IDENTIFIER` 或 `SYSTEM CONSTRAINT`。\n\n### 参与方 (Parties)\n\n图\
  \ 7-25 显示了第四章中描述的 `PARTY` 和 `ACCESS ROLES` 如何在此发挥作用。请注意，可以为 `SYSTEM CONSTRAINT`\
  \ 指定由 `PARTY`（或扩展）的 `MANAGEMENT ROLE` 或 `ENFORCEMENT ROLE`。\n\n![image](img/B9780120887989500085_f07-25.jpg)\n\
  \n图 7-25 访问角色与约束。\n\n# 数据质量\n\n构成 `ATTRIBUTES` 和 `RELATIONSHIP ROLES` 的数据质量通常用一个或多个\
  \ `QUALITY CHARACTERISTICS` 来衡量。首先，有*内在*质量的衡量。\n\n- **定义符合性 (Definition conformance):**\
  \ 实际数据与其定义之间的一致性。\n- **完整性 (Completeness):** 实体类的所有实例都具有值的程度。\n- **有效性或业务规则 (Validity\
  \ or business rule):** 数据符合其域的程度。\n- **对源数据的准确性 (Accuracy to surrogate source):**\
  \ 数据与原始源一致的程度，原始源是来自组织外部且被认为是权威的表单、文档或原始电子数据。\n- **对现实的准确性 (Accuracy to reality):**\
  \ 数据准确反映所描述的现实对象或事件的程度。准确性是内在质量。\n- **精确性 (Precision):** 数据粒度正确的特性。\n- **去重复性 (Nonduplication):**\
  \ 记录与现实对象之间一一一对应的程度。\n- **冗余或分布式数据的等效性 (Equivalence of redundant or distributed\
  \ data):** 一个数据集或数据库中的数据与另一个数据库中相同对象或数据的语义相等程度。\n- **冗余或分布式数据的并发性 (Concurrency of\
  \ redundant or distributed data):** 数据在一个数据库中已知（创建或更改）到在另一个数据库中已知的时间延迟。\n- **可访问性\
  \ (Accessibility):** 在需要时访问数据的特性。\n\n其次，有*实用*质量的衡量，包括呈现的直观性和对知识工作者的价值。\n\n- **及时性\
  \ (Timeliness):** 在执行流程所需的时间表内支持给定流程的数据相对可用性。\n- **上下文清晰度 (Contextual clarity):**\
  \ 数据呈现使知识工作者理解数据含义并避免误解的相对程度。\n- **派生完整性 (Derivation integrity):** 派生或计算数据根据其基础数据计算的正确性。\n\
  - **可用性 (Usability):** 信息呈现为了其目的而直接且高效使用的程度。\n- **“正确性”或事实完整性 (“Rightness” or fact\
  \ completeness):** 支持给定流程或决策的正确类型和正确质量数据的程度。\n\n\n\n\n\n图 7-26 将 `QUALITY CHARACTERISTIC`\
  \ 显示为一个实体类，其中每个 `QUALITY CHARACTERISTIC` 可能根据一个或多个 `VALID QUALITY CHARACTERISTIC\
  \ VALUES` 来`定义`。例如，`QUALITY CHARACTERISTIC` “准确性（针对替代源）”可以在一个包含五个 `VALID QUALITY\
  \ CHARACTERISTIC VALUES` 的量表上评分：“完全不准确”、“大致”、“中等准确”、“非常准确”和“完美准确”。\n\n![image](img/B9780120887989500085_f07-26-9780120887989.jpg)\n\
  \n图 7-26 数据质量。\n\n用于描述 `ATTRIBUTE` 或 `RELATIONSHIP ROLE` 的捕获数据随后可以 `通过`一个或多个 `QUALITY\
  \ STANDARDS` 进行 `评估`，其中每个 `QUALITY STANDARD` 必须是 `使用` 单 `VALID QUALITY CHARACTERISTIC\
  \ VALUE`。因此，对于第二章中图 7-11 所示的模型，其业务策略可能规定 `PERSON` 的“姓氏”必须是“非常准确的”，并且通过 `ORDER` 的\
  \ `from` 角色确定的 `PARTY` 身份必须是“完美准确”。\n\n## 第四行：设计者视图\n\n在第二行中，我们查看了业务运行的整体动机和约束，在第三行中查看了从数据角度（系统约束）来看业务规则的具体结构，而第四行关注如何使用数据库技术以及其他技术来实现业务规则。在可能的范围内，我们将使用关系数据库结构，但如果系统约束超出了此类结构，我们不得不扩展模型以引用执行处理的程序。\n\
  \n### 示例数据库设计\n\n图 7-27 是第二章中最初展示的表的副本。它展示了可以从图 7-11 中的示例实体类模型派生的示例数据库设计。\n\n![image](img/B9780120887989500085_f07-27-9780120887989.jpg)\n\
  \n图 7-27 示例数据库设计。\n\n#### 唯一键\n\n在前面的节中，一种约束类型是 `UNIQUE IDENTIFIER`。`UNIQUE IDENTIFIER`\
  \ 在关系技术中通过 `unique key` 实现，它可以是 `primary key` 也可以是 `alternative key`。\n\n根据关系理论，表中的每行都必须通过表中一个或多个列的值被唯一标识。图\
  \ 7-28 显示了此的元模型。在该模型中，每个 `TABLE` 必须 `围绕`一个或多个 `UNIQUE KEYS` 组织。每个 `UNIQUE KEY` 反而必须\
  \ `由`一个或多个 `UNIQUE KEY ELEMENTS` 组成，其中每个元素都必须 `使用` 一个 `COLUMN`。`UNIQUE KEY` 必须是\
  \ `PRIMARY KEY` 或 `ALTERNATIVE KEY`。\n\n![image](img/B9780120887989500085_f07-28-9780120887989.jpg)\n\
  \n图 7-28 唯一键。\n\n## 业务规则\n\n每个 `TABLE` 必须恰 `围绕`一个 `PRIMARY KEY` 组织，但它也可以 `围绕`一个或多个\
  \ `ALTERNATIVE KEYS` 组织。\n\n注意，在图 7-27 中，`PARTIES`、`ORDERS`、`LINE ITEMS`、`PRODUCT\
  \ TYPES` 和 `SERVICE TYPES` 都是图 7-29 所示实体类 `TABLE` 的示例。在那个示例中，`ORDER` 可以通过其“order_number”被唯一标识。也就是说，名称为“Order”的\
  \ `TABLE` `围绕`一个 `UNIQUE KEY`（在此情况下是 `PRIMARY KEY`）组织，该键 `由`一个 `UNIQUE KEY ELEMENT`\
  \ 组成，而该元素反过来 `使用` 一个名称为“order_number”的 `SPECIFIED COLUMN`。\n\n![image](img/B9780120887989500085_f07-29-9780120887989.jpg)\n\
  \n图 7-29 外键。\n\n## 业务规则\n\n`作为` `UNIQUE KEY ELEMENT` 且 `是` `UNIQUE KEY` 部分的 `COLUMN`\
  \ 必须 `是` 该 `UNIQUE KEY` 所属 `TABLE` 的一部分。\n\n#### 外键\n\n正如实体类之间通过关系相互关联一样，关系数据库中的表通过\
  \ `foreign keys` 在逻辑上相互关联。`foreign key` 是一个表中的一个或多个列对另一个表中的一个或多个列的引用。\n\n\n\n\n\
  在前面的行三（Row Three）章节中，展示了一个用于计算 `ATTRIBUTE` 值的 `DERIVATION`。该 `DERIVATION` 由一个或多个\
  \ `DERIVATION ELEMENTS` 组成，其中每个元素要么是常量的使用，要么是另一个 `ATTRIBUTE`，要么是 `SYSTEM VARIABLE`（例如“今天的日期”）。由于这是一个概念模型，其核心点在于：在该阶段描述推导过程，并不假设计算是在数据收集时完成的，还是在请求派生值时动态完成的。\n\
  \n在此时处表示的系统设计中，任何在数据存储之前就计算好值的 `COLUMNS` 与此元模型中的任何其他列均没有区别。它们不需要特殊处理。然而，如果设计提供了在请求值时动态计算值的能力，则需要一个类似于之前所示的结构。这在图\
  \ 7-30 中所示。\n\n![image](img/B9780120887989500085_f07-30-9780120887989.jpg)\n\n图.\
  \ 7-30 计算列。\n\n具体而言，一个 `COLUMN` 可以通过一个或多个 `COMPUTATIONS` 进行计算，每个 `COMPUTATION` 必须由一个或多个\
  \ `COMPUTATION ELEMENTS` 组成。每个 `COMPUTATION ELEMENT` 而言必须是常量的使用、另一个 `COLUMN` 的使用或\
  \ `SYSTEM VARIABLE`（例如“今天的日期”）的使用。之前描述的逆波兰表示法（Reverse Polish Notation）也适用于此处。\n\n\
  ## 业务规则\n\n1. `COMPUTATION ELEMENT` 所依据的 `DERIVATION ELEMENT` 必须是相应的 `COMPUTATION`\
  \ 所依据的 `DERIVATION` 的一部分。\n2. 如果要计算的 `COLUMN` 基于一个 `ATTRIBUTE`（使用 `COLUMN ATTRIBUTE\
  \ MAPPING`），则该 `ATTRIBUTE` 也必须派生自一组 `DERIVATION ELEMENTS`，且这些元素与该 `COLUMN` 的 `COMPUTATION\
  \ ELEMENTS` 完全对应。\n\n## 列域 (Column Domains)\n\n在图 7-31 中，我们看到 `COLUMN` 必须是 `DISCRETE\
  \ COLUMN` 或 `CONTINUOUS COLUMN`。`CONTINUOUS COLUMN` 可以取任何实数作为值，尽管该值可能被限制在“最大值”和“最小值”之间。然而，`DISCRETE\
  \ COLUMN` 只能取指定 `CODE SET` 部分的 `VALID CODE` 作为值。也就是说，每个 `DISCRETE COLUMN` 必须由一个且仅一个\
  \ `CODE SET` 评估。\n\n![image](img/B9780120887989500085_f07-31-9780120887989.jpg)\n\
  \n图. 7-31 列域。\n\n注意，这与我们之前在模型行三部分看到的 `CONTINUOUS` 和 `DISCRETE` 属性的结构相似。在那里，`ATTRIBUTE`\
  \ 可能会受到 `DOMAIN` 的约束，如果该 `ATTRIBUTE` 是 `DISCRETE ATTRIBUTE`，则该域是一个 `VALUE SET`。\n\
  \n`VALUE SET` 和 `CODE SET` 的区别在于 `PERMITTED ATTRIBUTE VALUE` 是值的概念。`PERMITTED ATTRIBUTE\
  \ VALUE` 由 `VALUE CODE` 表示，而 `VALUE CODE` 反而使用 `SIGNIFIER`（例如单词或缩写）。\n\n例如，一个 `VALUE\
  \ SET` 可以描述美国各州，但可能有多个 `CODE SETS` 实际上描述这些州。在一个 `CODE SET`（邮政缩写）中，阿拉拉巴马州由使用 `SIGNIFIER`（缩写）“AL”的\
  \ `VALUE CODE` 表示。在另一个 `CODE SET`（过时邮政缩写）中，它由使用 `SIGNIFIER`（缩写）“ALA”的 `VALUE CODE`\
  \ 表示。在第三个 `CODE SET`（州代码）中，阿拉拉巴马州由使用 `SIGNIFIER`（缩写）“01”的 `VALUE CODE` 表示。\n\n重点在于在设计\
  \ `COLUMN` 时，有必要识别该实现应使用哪个 `CODE SET`。如之前所述，由于 `PERMITTED ATTRIBUTE VALUES` 必须以某种方式被识别，每个\
  \ `VALUE SET` 必须主要由一个 `CODE SET` 表示。在示例中，`VALUE SET`“美国各州”必须主要由如“州名”之类的 `CODE SET`\
  \ 表示。在这种情况下，阿拉拉巴马州的 `VALID CODE` 将是使用 `SIGNIFIER`（单词）“Alabama”。\n\n## 业务规则\n\n1.\
  \ `VALID CODE` 只能用于表示一个 `PERMITTED ATTRIBUTE VALUE`。\n2. 如果一个 `DISCRETE COLUMN`\
  \ 通过单一的 `COLUMN ATTRIBUTE MAPPING` 映射到一个 `ATTRIBUTE`，则该 `ATTRIBUTE` 必须是 `DISCRETE\
  \ ATTRIBUTE`。\n3. 如果一个 `DISCRETE COLUMN` 通过单一的 `COLUMN ATTRIBUTE MAPPING` 映射到一个\
  \ `ATTRIBUTE`，则用于评估它的 `CODE SET` 必须是对该 `ATTRIBUTE` 约束的 `VALUE SET` 的表示。\n\n# 数据库约束\n\
  \n图 7-32 显示了 `UNIQUE KEYS`、`COMPUTATIONS` 和 `FOREIGN KEYS` 是 `DATABASE` 概念的例子。如此，我们可以推断\
  \ `COLUMNS` 上存在其他的 `DATABASE CONSTRAINTS`。\n\n![image](img/B9780120887989500085_f07-32-9780120887989.jpg)\n\
  \n## 面向对象的约束\n\n与 `ATTRIBUTES` 和关系型 `COLUMNS` 一样，面向对象的 `INSTANCE ATTRIBUTES` 有两种类型，如图\
  \ 7-33 所示。`DISCRETE INSTANCE ATTRIBUTES`（例如“州”）取自 `INSTANCE VALID` 列表。另一种 `INSTANCE\
  \ ATTRIBUTE`如“比重”）取自连续范围并可能有“最小值”和“最大值”。注意，`INSTANCE VALID` 的一种用法是使用随后的（在第六章中详细描述）`LEGAL\
  \ TRANSFORMATION`机制将 `CLASS IMPLEMENTATIONS` 从一处移动到另一处。\n\n![image](img/B9780120887989500085_f07-33-9780120887989.jpg)\n\
  \n图. 7-33 类元素。\n\n虽然建议指定域来验证 `INSTANCE ATTRIBUTES` 组（就像对概念 `ATTRIBUTES`那样），但关于面向对象的文献并没有在此范围内提到它们。相反，在面向对象的社区中，“域”指的是一个领域。\n\
  \n## 链接\n\n### 行三\n\n之前，我们看到架构视图中的 `ENTITY CLASSES` 如何变为数据库设计中的 `TABLES`，`ATTRIBUTES`\
  \ 如何变为 `COLUMNS`。然后我们看到设计者视图中的 `COMPUTATIONS` 如何派生自架构视图中的 `DERIVATIONS`。\n\n图 7-34\
  \ 通过显示 `UNIQUE KEYS` 与 `UNIQUE IDENTIFIERS` 之间的连接、`FOREIGN KEYS` 与 `INFORMATION\
  \ ENGINEERING ROLES` 之间的连接以及 `OTHER CONSTRAINTS` 与 `SYSTEM CONSTRAINTS` 之间的连接来延续这一。这显示设计者视图中的\
  \ `FOREIGN KEY` 基于架构视图中的 `ASSOCIATIVE RELATIONSHIP ROLE`。同样，设计者视图的 `UNIQUE KEY`\
  \ 和 `UNIQUE KEY ELEMENT` 分别基于架构视图的 `UNIQUE IDENTIFIER` 和 `UNIQUE IDENTIFIER ELEMENT`。注意，由于\
  \ `UNIQUE IDENTIFIER ELEMENT` 可能是使用 `ATTRIBUTE` 或 `RELATIONSHIP ROLE`，而 `UNIQUE\
  \ KEY ELEMENT` 仅使用 `COLUMN`。这是因为角色在关系设计中实际上是作为 `FOREIGN KEY` 列实现的。\n\n![image](img/B9780120887989500085_f07-34-9780120887989.jpg)\n\
  \n图. 7-34 唯一键、外键与概念模型。\n\n\n\n最后，设计者视图（Designer’s View）中的一个或多个 `OTHER CONSTRAINTS`（其他约束）均基于架构视图（Architect’s\
  \ View）中的一个 `SYSTEM CONSTRAINT`（系统约束）。请注意，在架构视图与设计者视图之间的所有链接中，并不假设设计者会简单地采用实体关系模型所蕴含的默认设计。该模型旨在描述数据的内在结构，而不考虑技术。当在具有真实数据库管理系统软件的真实计算机上构建数据库时，这些结构通常需要根据数据的实际用途进行修改。\n\
  \n然而，重要的是维护关于设计来源的信息。即使一个 `ATTRIBUTE`（属性）被实现为许多列，或者反之亦然，该模型也展示了如何记录这些链接。为了后期的维护，做到这一点至关重要。\n\
  \n## 编程约束\n\n外键约束和主键约束可以通过数据库管理系统实现。`COMPUTATIONS`（计算）需要软件来实现逆波波兰表示法。`OTHER CONSTRAINTS`（其他约束）显然也需要软件，无论是以数据库触发器、存储过程或其他程序的形式。\n\
  \n[图 7-35] 显示每个 `CONSTRAINT`（约束）必须由且仅由一个 `PROGRAM MODULE`（程序模块）实现。常用的 `PROGRAM MODULES`\
  \ 类型包括 DBMS 本身、`STORED PROCEDURES`（存储过程）和 `TRIGGERS`（触发器），以及 `OTHER EXECUTABLE MODULES`（其他可执行模块）。\n\
  \n![image](img/B9780120887989500085_f07-35-9780120887989.jpg)\n\n图 7-35 约束实现。\n\n\
  # 数据质量\n\n在质量标准应用于 `ENTITY CLASSES`（实体类）和 `RELATIONSHIP ROLES`（关系角色）的范围内，将它们应用于实际数据库的\
  \ `COLUMNS`（列）变得更为重要。毕竟，这才是执行数据质量的地方。[图 7-36] 显示了将 `QUALITY STANDARD`（质量标准，如[图 7-26]所示）扩展到同样适用于\
  \ `COLUMN`（列）。也就是说，每个 `QUALITY STANDARD` 都是一个 `VALID QUALITY CHARACTERISTIC VALUE`（有效质量特征值），作为评估\
  \ `COLUMN`（列）的 `QUALITY STANDARD`（质量标准）使用。\n\n![image](img/B9780120887989500085_f07-36-9780120887989.jpg)\n\
  \n图 7-36 扩展的数据质量。\n\n## 业务规则\n\n用于评估 `COLUMN`（列）的 `QUALITY STANDARD`（质量标准）的 `VALID\
  \ QUALITY CHARACTERISTIC VALUE`（有效质量特征值），应当大于实现该 `COLUMN`（列）的 `ATTRIBUTE`（属性）或 `RELATIONSHIP\
  \ ROLE`（关系角色）评估标准的 `VALID QUALITY CHARACTERISTIC VALUE`。\n\n## 第六行：衡量数据质量\n\n正如我们在前面的章节中所看到的，第六行是实际实现系统的视图。在“动机”（Motivation）列中，我们关注了规则和约束等内容。要检查所有系统中全范围的约束对于这本书来说有些心过大，但对数据质量约束的实现进行建模是可能的，如[图\
  \ 7-37]所示。\n\n![image](img/B9780120887989500085_f07-37-9780120887989.jpg)\n\n图 7-37\
  \ 衡量数据质量。\n\n应用于属性和关系的标准定义在[图 7-26]中给出，作为之前讨论的第三行模型的一部分。这在[图 7-36]的第四行模型中扩展到了列。在这里，我们看到实际的\
  \ `QUALITY VALUE ASSIGNMENT`（质量值分配）是特定 `CELL INSTANCE`（单元实例）的 `VALID QUALITY CHARACTERISTIC\
  \ VALUE`（有效质量特征值）。\n\n此处指定的 `CELL INSTANCE`（单元实例）的 `VALID QUALITY`（有效质量）至少应与评估所有\
  \ `COLUMN`（列）`CELL INSTANCE`（单元实例）的 `VALID QUALITY CHARACTERISTIC VALUE`（有效质量特征值）一样。\n\
