  \n[content]\n第五章 详细讨论了人员、组织、职位等在管理元数据方面扮演的角色。然而，在这里定义`BUSINESS CONCEPTS`（业务概念）的表示（`SYMBOLS`）的具体责任在图\
  \ 2-16 中所示。定义`BUSINESS CONCEPTS`的表示（`SYMBOLS`）的具体责任在图 2-16 中所示... (此处注：原文文本本身存在严重的逻辑重复，翻译时已按要求去重)。\n\
  \n\n\n\n\n**业务术语**包括`属性`(ATTRIBUTES)、`实体类`(ENTITY CLASSES)、`其他业务概念`(OTHER BUSINESS\
  \ CONCEPTS)以及`实例名称`(INSTANCE NAMES)。`实体类`和`属性`的实例名称是作为`业务术语`来表示它们的`单词`(WORDS)和`短语`(PHRASES)的典型示例。这些中的每一项都是为了表示一个`实体类`或`属性`的发生。例如，“Colorado”是一个用作`STATE`（州）类的`实例名称`的单词。（“State”是一个用作实体类`STATE`的`实体类名称`的单词。请注意，“Name”作为`业务概念`（BUSINESS\
  \ CONCEPT）的一个`属性`，将是第一个表示任何`业务概念`的`其他业务术语`。）\n\n当然，企业使用的其他所有语言将不会出现在实体关系模型中，这包含了所有用作`其他业务术语`来表示`其他业务概念`或`业务概念元素`的`单词`和`短语`。\n\
  \n## 业务规则\n\n1.  `实体类名称`必须专门用于表示一个`实体类`，而不是任何其他类型的`业务概念`或`业务概念元素`。\n2.  `属性名称`必须专门用于表示一个`属性`，而不是任何其他类型的`业务概念`或`业务概念元素`。\n\
  \n请注意，`属性`被显示为`领域`(DOMAIN)`特征`(CHARACTERISTIC)的一种`特征赋值`(CHARACTERISTIC ASSIGNMENT，一个事实类型元素）。也就是说，每个`属性`都必须被`领域`约束。它的意思是`领域`在抽象上是一种`特征`，它可以分配给许多`实体类`。\n\
  \n`属性`是特定的`领域`适用于特定的`实体类`的事实。当我们说`产品`具有“名称”、“长度”和“宽度”等属性时，我们通常没有意识到领域的存在，但它确实在那里。它是我们所指的属性含义的定义。它可以简单到如格式规范，也可以复杂到如计算出的约束，但它隐式或显式地存在。请注意`领域`被突出显示了。它实际上在第七章中作为约束进行了更充分的记录。\n\
  \n我们已经看到，“每个`特征赋值`必须属于一个`特征`”的关系是“每个`业务概念元素`必须属于一个`业务概念`的关系的关系特定子类型。同样，“每个`属性`必须被一个且仅一个`领域`约束”是其他关系的进一步子类型。同样，“每个`属性`必须关于一个`实体类`”的断言是“每个`命题类型元素`必须描述一个`业务概念`”的关系的一个特例。要消除冗余表示，需要显式说明以下业务规则。\n\
  \n## 业务规则\n\n1.  每个`特征赋值`都是一个`业务概念元素`，必须属于一个作为`特征`的`业务概念`。\n2.  每个`属性`都是`业务概念`，必须属于一个且仅一个作为`领域`的`事实类型`。\n\
  3.  每个`属性`都是`业务概念`，必须描述一个且仅一个作为`实体类`的`业务概念`。\n\n`属性`的属性包括“默认值”、“格式”、“最大长度”、“平均长度”和“小数位”数量。“默认可选性”也是一种属性，通常用于指定该`属性`是否是强制性的。事实上，可选性是一个比这更复杂表示的概念（参见第七章），但定义一个“默认可选性指示器”对于最初绘制数据模型足够了。\n\
  \n模型中包含了“基数指示器”以保持完整，但它也是一种约束，并在第七章中进行了更广泛的讨论。它允许你指定该`属性`在该`实体类`中值的出现最大次数。如果规范化关系模型是本次练习的对象，则该值必须为“1”。然而，某些环境不是归一化的，因此如果你想捕捉这一事实，这就是记录它的地方。（UML\
  \ 提供了指定此能力。）\n\n## 关系与关系角色\n\n正如我们在第一章中所示，`关系角色`(RELSHIP ROLE)是`实体类`参与另一个`实体类`之间关系的事实。每个`关系角色`必须由一个`实体类`扮演，并必须连接到另一个由相同或另一个`实体类`扮演的`关系角色`。图\
  \ 2-19 展示了这一点。\n\n![image](img/B9780120887989500036_f02-19-9780120887989.jpg)\n\n\
  图. 2-19 关系角色。\n\n### 关系角色\n\n请注意，每个`关系角色`必须连接到另一个另一个`关系角色`，而该角色反过来必须由相同或另一个`实体类`扮演。因此，两个`实体类`的发生通过两个`关系角色`连接。这两个角色属于一个`关系`，该关系是两个`实体类`之间的。也就是说，每个`关系`必须由多个（在本例中为两个）`关系角色`组成。\n\
  \n“关系角色必须仅由一个实体类扮演”等同于“每个`关系角色`可以由一个`命题类型元素`（实际上是`事实类型元素`）组成，该元素关于一个作为实体类的`业务概念`”。直接的关系更简洁且易于理解，但它是冗余的。\n\
  \n就此而言，`关系角色`与`实体类`之间的关系以及`关系角色`与其自身的关系同样是冗余的。关系的基数由“基数指示器”属性传达，但显式关系实无法通过这些更间接的关系来表达。\n\
  \n换句话说，每个`业务概念`（在本例中为`关系角色`）可以由多个`业务概念元素`（在本例中为如`played by`和`connected to`）组成。每个`关系`可以是两个或多个`关系`的子类型。与其显示冗余的关系子类型，相同的约束可以通过业务规则来表达。\n\
  \n## 业务规则\n\n1.  每个作为`关系角色`的`业务概念`必须由一个`命题类型元素`（名称为`played by`）组成，该元素必须关于是实体的类的`业务概念`。\n\
  2.  每个作为`关系角色`的`业务概念`必须由一个`命题类型元素`（名称为`connected to`）组成，该元素必须关于是角色的`业务概念`。\n3. \
  \ 每个作为`关系角色`的`业务概念`必须由一个`业务概念元素`（名称为`connected from`）组成，该元素必须关于是角色的`业务概念`。\n\n请注意，“每个实体类可以是另一个实体类的子类型”这种关系角色（以及反之反过来）并不是冗余的，因为`实体类`既不是`命题类型`也不是`命题类型元素`。\n\
  \n\n\n\n\n图 2-19 显示 `RELATIONSHIP ROLE`（关系角色）要么是 `ASSOCIATIVE ROLE`（关联角色），要么是 `GENERALIZATION\
  \ ROLE`（泛化角色）。`ASSOCIATIVE ROLE` 描述当 `ENTITY CLASS`（实体类）代表本质上不同的事物（或同一事物的不同发生，例如递归物料结构中将一种产品类型与另一种类型关联起来）时，从一个\
  \ `ENTITY CLASS` 到另一个类的关系。以此模型作为数据模型的示例，作为 `BUSINESS CONCEPT ELEMENT`（业务概念元素）的 `ENTITY\
  \ CLASS` 是 `ASSOCIATIVE ROLE` `“部分属于\"` 的 `player of`，它 `connected to` `ASSOCIATIVE\
  \ ROLE` `“组成\"`，而后者是由 `BUSINESS CONCEPT`（业务概念）这一 `ENTITY CLASS` 所 `played by`。\n\
  \n`GENERALIZATION ROLE` 描述了一个 `ENTITY CLASS` 的实例实际上是另一个实例的事实。`GENERALIZATION ROLE`\
  \ 必须是 `SUB-TYPE ROLE`（子类型角色）或 `SUPER-TYPE ROLE`（父类型角色）。如果一个 `ENTITY CLASS` 是 `SUB-TYPE\
  \ ROLE` 的 `player of`，那么它必须 `connected to` 一个由另一个 `ENTITY CLASS` 所 `played by` 的\
  \ `SUPER-TYPE ROLE`。那么，第一个 `ENTITY CLASS` 的发生根据定义也是第二个 `ENTITY CLASS` 的发生。\n\n再次使用此模型作为示例，作为\
  \ `OTHER BUSINESS CONCEPT`（其他业务概念）的 `ENTITY CLASS` 是 `SUB-TYPE ROLE` 的 `player of`，该角色\
  \ `connected to` 由 `BUSINESS CONCEPT` `ENTITY CLASS` 所 `played by` 的 `SUPER-TYPE\
  \ ROLE`。实体类 `ASSOCIATIVE ROLE` 有两个属性：“基数指示器”（Cardinality Indicator）和“默认可选性指示器”（Default\
  \ Optionality Indicator）。这两将在第七章中有更详细的讨论。\n\n将图 2-19 本身作为实体关系图的示例，从 `ENTITY CLASS`\
  \ 到命名为 `player of` 的 `RELATIONSHIP ROLE` 的 `ASSOCIATIVE ROLE` 的“基数指示器”为“True”，这意味着\
  \ `ENTITY CLASS` 的角色是对应多个 `RELATIONSHIP ROLE` 的发生。命名为 `“played by\"` 的 `ASSOCIATIVE\
  \ ROLE` 的“基数指示器”为“False”，这意味着 `RELATIONSHIP ROLE` 的角色仅对应一个 `ENTITY CLASS` 的发生。或者，该属性也可以称为“基数值”（Cardinality\
  \ value），值为“1”、“^*”、“<2”等。在信息工程和其他类似的表示法中，基数只能是“一个且仅有一个”（“False”或“1”）或“一个或多个”（“True”或“^*”）；然而，在\
  \ UML 中，可以隐含其他值，例如“>4”、“2, 4, 或 6”等。\n\n与 `ATTRIBUTE`（属性）类似，从`ASSOCIATIVE ROLE`\
  \ 中本应被称为“可选性指示器”（Optionality indicator）的属性实际上被称为“默认可选性指示器”，因为 `ASSOCIATIVE ROLE`\
  \ 的可选性可能是其自身状态或受影响 `ENTITY CLASS` 状态的函数。（参见第七章）。但目前，我们假设它的默认只有一个“可选性指示器”值。对于此模型中命名为\
  \ `“player of\"` 的角色，它是“true”——这意味着每个 `ENTITY CLASS` 的发生可能是或不是至少一个 `RELATIONSHIP\
  \ ROLE` 的 `player of`。命名为 `“played by\"` 的 `RELATIONSHIP ROLE` 的“默认可选性指示器”为“False”，意味着不会创建任何不是被至少一个\
  \ `ENTITY CLASS` 所 `played by` 的 `RELATIONSHIP ROLE` 发生。\n\n### 关联类角色 (Association\
  \ Class Roles)\n\n之前描述的角色被称为 `INFORMATION ENGINEERING ROLES`（信息工程角色），因为它们受到该技术的约束。在信息工程及相关学科中，例如这些图中使用的\
  \ Barker/结构化系统分析与设计方法 (SSADM)，所有关系都假假设是二元的，即它们只存在两个实体类之间。这为该练习提供了某种严谨性，你的作者认为这是非常理想的。然而，还有其他表示法并没有那么严格限制。\n\
  \n例如，UML 主要使用信息工程方法，但它也有处理多对多关系的特殊方法。在信息工程或 SSADM 中，当遇到多对多关系时，响应是创建一个新的实体类，其每个发生都代表一个实体类的发生与另一个实体类的发生相关。\n\
  \n例如，想象图 2-20 所示的模型，其中 `PROJECT`（项目）和 `PERSON`（人员）之间存在多对多关系（每个 `PROJECT` 可能是一个或多个\
  \ `PEOPLE` 的 `work site for`;每个 `PERSON` 可能被 `assigned to` 一个或多个 `PROJECT`）。在这种情况下，信息工程的响应（在此处使用\
  \ UML 表示法）是创建一个 `intersect entity class`（交叉实体类，如图 2-21\n图 2-20 多对多关系。\n\n![image](img/B9780120887989500036_f02-21-978012088789.jpg)\n\
  图 2-21 关联类。\n\n然而，UML 还提供了创建*关联类*（association class）的选择。这是一个表示关系本身，而不仅仅是类之间的交互集合。图\
  \ 2-22 显示了一个示例关联类作为 `ProjectAssignment`。该实体类与任何实体类相关，只与关系相关。\n\n![image](img/B9780120887989500036_f02-22-978012088789.jpg)\n\
  图 2-22 关联类。\n\n注意，这是一个非常有约束性的设备。所示，它假设特定的 `PERSON` 分配到特定 `PROJECT` 的只有一个，因为根据定义，关联类的每次发生是由这两个类的标识确定的。\n\
  \n如果 Charlie 为项目工作了几个月，离开了，然后又重新分配到该项目，这是无法记录的。在这种情况下，必须使用图 2-22 所示的交叉实体类。注意，交叉实体方法允许指定\
  \ `sequenceNumber` 属性，它可以包含在唯一标识中以保持实例唯一。这样特定的 `PERSON` 到特定 `PROJECT` 就可以无限多个 `PROJECT\
  \ ASSIGNMENT` 发生。\n\n在 `PROJECT` 多次分配给 `PERSON` 的情况下，如果在 `PERSON` 或 `PROJECT` 中添加“累计次数”属性，可以使用关联类，但这将无法指定每次分配的时间。\n\
  \nUML 的这一特性要求在我们的元模型中定义一种新的 `RELATIONSHIP ROLE`，即 `ASSOCIATION CLASS ROLE`，如图 2-23\
  \ 所示。在这里，每个 `RELATIONSHIP` 必须由一个或多个 `RELATIONSHIP ROLES` 组成，但这次不是一个角色 `connected\
  \ to` 另一个 `RELATIONSHIP ROLE`，而是每个 `ASSOCIATION CLASS ROLE` 必须“描述”另一个 `RELATIONSHIP`。这里还创建了一个新的\
  \ `ENTITY CLASS` 子类型——`ASSOCIATION ENTITY CLASS`——用于描述 `ASSOCIATION CLASS ROLE`\
  \ 的末端。\n\n![image](img/B9780120887989500036_f02-23-978012088789.jpg)\n图 2-23 关联类角色。\n\
  \n这是 `ENTITY CLASS` 的一种，因此它可以是一个或多个 `RELATIONSHIP ROLES` 的 `player of`，但在这种情况下，它被限制扮演\
  \ `ASSOCIATION CLASS ROLE`。之前讨论的 `RELATIONSHIP ROLE` 在此处渲染为 `INFORMATION ENGINEERING\
  \ ROLE` 以与 `ASSOCIATION CLASS ROLE` 区分。\n\n\n\n\n\n`INFORMATION ENGINEERING ROLE`（信息工程角色）用于实体关系图，既适用于原始的信息工程技术，也适用于基于此的技术（包括本书中使用的\
  \ Barker/SSADM 记法）。`ASSOCIATION CLASS ROLE`（关联类角色）仅出现在 UML 和 IDEF1X 中，尽管这两者主要使用\
  \ `INFORMATION ENGINEERING ROLES`。\n\n## 业务规则\n\n1. `ASSOCIATION CLASS ROLE` 必须由\
  \ `ASSOCIATION ENTITY CLASS`（关联实体类）*扮演*。相反，`ASSOCIATION ENTITY CLASS` 必须是一个且仅一个\
  \ `ASSOCIATION CLASS ROLE` 的*参与者*。^*\n2. 在图 2-23 中，一个 `INFORMATION ENGINEERING ROLE`\
  \ 只能由 `OTHER ENTITY CLASS`（其他实体类）扮演。（后文将详细介绍此点。）\n3. 如果一个关系由 `ASSOCIATION CLASSES`（关联类）组成，则它仅由*一个*此类类组成。\n\
  4. 如果一个关系由 `INFORMATION ENGINEERING CLASSES`（信息工程类）组成，则它正好由*两个*此类类组成。\n\n^*在这里，使用业务规则来代替显式地描述每个\
  \ `ASSOCIATION CLASS ROLE` 必须由一个 `ASSOCIATION ENTITY CLASS`*扮演*。\n\n### 多元关系\n\n\
  即使引入了 `ASSOCIATION CLASS ROLES`，UML 仍然主要关注二元关系。但那些允许真正的三元及高阶关系的记法（包括 UML）又是怎样的？其中主要的是*对象角色建模*（`ORM`）和*Chen\
  \ 记法*（（Chen notation）。在这些记法中，多个对象（实体类和属性）可以在不受限制的情况下相互关联。图 2-24 显示，对于每种记法，都展示了一个关于“项目”（Project）与“人员”（Person）关联的示例（如前所述），在这种情况下，关系中存在第三个参与者（“位置”Location）。也就是说，该模型断言人员可以被分配到特定位置的项目中。\n\
  \n![image](img/B9780120887989500036_f02-24-9780120887989.jpg)\n\n图 2-24 三元关系示例。\n\
  \n注意，在 UML 中，也可以添加一个 `ASSOCIATION CLASS ROLE` 来描述（即为三元关系本身添加属性）。在 ORM 中，带有箭头的线段表示每个“项目/人员”的组合是唯一的。这种约束在上一个示例的\
  \ UML 关联类中是隐式的。一个人员只能对一个项目工作一次。在 ORM 中，这种约束是显式的，并由建模者控制。虽然一个人员只能对一个项目工作一次，但一个人员可以在同一地点工作多次，就像一个项目可以出现在同一地点多次一样。\n\
  \n这要求对我们的模型进行进一步的细化。图 2-25 展示了 `RELATIONSHIP`（关系）必须*由*（三个）或多个 `N-ARY ROLES`（多元角色）组成，且对涉及的数量没有限制。在\
  \ UML 示例中，一个 `RELATIONSHIP` 将*由*三个 `N-ARY ROLES` 和一个 `ASSOCIATION CLASS ROLE` 组成。\n\
  \n![image](img/B9780120887989500036_f02-25a-9780120887989.jpg)\n\n![image](img/B9780120887989500036_f02-25b-9780120887989.jpg)\n\
  \n图 2-25 多元角色。\n\n## 业务规则\n\n一个 `N-ARY ROLE`（多元角色）必须由一个且仅一个 `OTHER ENTITY CLASS`*扮演*。\n\
  \n注意，由于 ORM 包含了唯一标识 `N-ARY ROLES` 组合的记法，图 2-25 增加了 `IDENTIFICATION ROLE`（标识角色）的概念。每个\
  \ `N-ARY ROLE` 都可以*用于*一个或多个 `IDENTIFICATION ROLE ELEMENTS`，每个元素都必须是一个 `IDENTIFICATION\
  \ ROLE`*的一部分*。在之前的 ORM 示例中，一个 `IDENTIFICATION ROLE`由 `N-ARY ROLES` `assignment of`（分配的）和\
  \ `assignment to`（分配到）组成。\n\n### 实体类视图\n\n三层概念数据模型受限于 `ENTITY CLASSES`（实体类），这些类代表了对业务具有意义的基础性且通常是抽象的实体。然而，二层业务所有者所看到的事物往往更具体，并且通常是概念模型中\
  \ `ENTITY CLASSES` 的示例、组合或子类。\n\n我们之前规定过，多个 `BUSINESS TERMS`（业务术语）可以*表示*一个 `BUSINESS\
  \ CONCEPT`（业务概念，`ENTITY CLASS` 或 `ATTRIBUTE`），但这通常不足以描述这两种语言之间详细的交互。我们需要的是*虚拟实体类*来表示业务所有者的语言，但它可以显式地映射到更基础的类。\n\
  \n在原始的 ANSI 三模式架构中，外部模式被认为是概念模型的“视图”。关系型数据库管理系统已经实现了这种视图的概念，但目前没有工具支持这一点。在图 2-26\
  \ 中，外部视图是概念模型的“视图”：\n\n![image](img/B9780120887989500036_f02-24a-9780120887989.jpg)\n\
  \n![image](img/B9780120887989500036_f02-26b-9780120887989.jpg)\n\n图 2-26 视图。\n\n\
  ## 业务规则\n\n每个 `INFORMATION ENGINEERING ROLE` 必须由一个 `ENTITY CLASS`*扮演*。`VIRTUAL ENTITY\
  \ CLASS`（虚拟实体类）是视图。\n\n此外，每个 `VIRTUAL ENTITY CLASS` 可以由一个或多个 `SELECTION CONDITIONS`（选择条件）填充，每个条件要么是基于\
  \ `ATTRIBUTE`，要么基于 `RELATIONSHIP ROLE`。`SELECTION CONDITION` 中的 `Operator`（运算符）会评估\
  \ `ATTRIBUTE` 或 `RELATIONSHIP ROLE`。例如，来自 `ENTITY CLASS` 的行可以被选中，如果 `SELECTION CONDITION`\
  \ 是关于 `ATTRIBUTE` `Length`（关于 `Part` 类），运算符为“小于”，且值为“24”。也就是说，该视图将包含所有小于 24（单位）^*](#B9780120887989500036.htm_fn10)的部分。\n\
  \n作为另一个例子，在图 2-17 所示的示例模型中，假设你想定义 `CUSTOMER`（客户）视图，它是 `ENTITY CLASS` `PARTY`（在 `ORDER`\
  \ 中的购买者）的行集。为了这一点，`VIRTUAL ENTITY CLASS` 将由 `ENTITY CLASS` `PARTY` 的 `ENTITY CLASS\
  \ SELECTION`*定义*。这反过来将由表 2-2 所示的 `ATTRIBUTE SELECTIONS` 组成。\n\n表 2-2\n\n虚拟实体类示例。\n\
  \n| 关于 | 每一个 | 意味着 |\n| :--- | :--- | :--- |\n| ATTRIBUTE | Party ID | ENTITY CLASS\
  \ Party |\n| ATTRIBUTE | Person given name | ENTITY CLASS Person |\n| ATTRIBUTE\
  \ | Person surname | ENTITY CLASS Person |\n| ATTRIBUTE | Person middle initial\
  \ | ENTITY CLASS Person |\n| ATTRIBUTE | Organization name | ENTITY CLASS Organization\
  \ |\n\n因此，构建 `VIRTUAL ENTITY CLASS` 的过程由以下业务规则控制。\n\n\n\n\n\n每次 `ATTRIBUTE SELECTION`\
  \ 的出现必须 `属于`一个 `ATTRIBUTE`，而该属性 `关于`一个 `ENTITY CLASS`。每个 `ATTRIBUTE` 的出现也必须 `属于`一个\
  \ `ENTITY CLASS SELECTION`，而该选择 `属于`一个 `ENTITY CLASS`。对于每个 `ATTRIBUTE SELECTION`，同一个\
  \ `ENTITY CLASS` 必须位于这两个导航的末尾。\n\n## 关于参考数据\n\n在每个业务数据模型中，某些实体类不依赖于其他实体类。也就是说，`reference\
  \ data` 没有强制性关系。通常，这些是包含其他实体所使用的参考术语的实体类。参考数据包括如 `STATUS`、`CURRENCY`、`EVENT TYPE`、`LICENSE\
  \ TYPE` 等值。通常，这些每项都只有几个值，由组织定义。它们代表了模型其他地方用术语的合法值。因此，确保这些实例被定义正确，是创建使用这些系统的人员的工作——正由于这个原因，它们通常被视为元数据的一部分。\n\
  \n这些参考实体类在这里没有单独表示，因为它们没有为模型的结构添加任何内容。然而，管理元数据的人必须注意这些参考数据，并在管理使用它们的任何系统的结构的同时也管理它们。\n\
  \n在在本章开头的引言中，亚里士多德断言两个或多个事物之间的连接确实是一个事实。是的，我们关注的是涉及的事物（业务概念）是否存在。我们还关注业务概念的本质（由事实揭示）。关于连接\
  \ `为什么` 存在的问题超出了本书的范围。\n\n## 第四行：数据设计\n\n架构框架的第四行是设计者视图（Designer’s View）。在 `Data`\
  \ 列的情况下，这指的是引入的管理第三行所描述数据的特定类型数据处理技术。截至 2006 年，最常用的技术是关系型数据库和面向对象的程序设计。\n\n关系技术侧重于数据如何被存储，而面向对象的技术解决数据如何在程序中被处理。原则上，这些者应该是兼容的，因为存储的数据必须以某种方式被程序处理，而处理过的数据通常必须被存储。\n\
  \n数据库管理的优先级是确保其设计尽可能不冗余，并控制对数据结构的修改和对数据的访问。数据库实现的关系方法支持这种方法。它利用数据库管理系统 (`DBMS`)\
  \ 软件来存储和处理组织成二维表的数据。根据 E. F. Codd 的 `relational theory` [Codd 1970]，根据关系规则存储数据可以最大限地减少存储中的冗余，但它不会以任何方式限制如何编写程序来使用和处理这些存储的数据。\n\
  \n尽管数据库设计中的一个组件解决了性能问题，但数据库管理员对数据在程序中如何使用并不关心。另一方面，数据的面向对象方法强调程序的正确设计和编写。数据结构被嵌入在程序中，描述了所谓的“对象”类。这些类可能对应于之前描述的用于第三行概念模型的业务实体类，也可能是仅供程序使用的对象类。然后将过程（称为“行为”）附加到这些类上。\n\
  \n当面向对象的程序的对象必须变得是 `persistent`（持久化）的——即在程序终止后保留其取值时——涉及的数据必须存储在某处。这里没有单一的面向对象方法，因此，尽管这不是唯一的解决方案，但它在行业中的普及表明关系型数据库是存储此类持久化数据的合理场所。然而，这样做需要将程序的对象结构翻译成数据库的表和列。如果对象结构和数据库结构都紧密接近概念模型的结构，这应该是非常简单的。在这两种情况下，数据都假设有一种结构，原则上，这两种结构应该源于同一个第三行模型。但在实践中，映射往往并不容易。\n\
  \n无论是从实体关系模型翻译还是从面向对象设计翻译，关系型数据库缺乏处理继承的能力使得该方向的翻译成为一项需要思考的巨大工作。\n\n此外，关系型设计者和面向对象设计者都会修改结构以适应处理瓶颈，但他们对什么构成此类瓶颈观点完全不同。\n\
  \n存储在关系型 `DBMS` 中的数据受到广泛规则的约束以保护其完整性并控制对它们的访问。这些规则并不一定适用于程序中所使用的数据结构。本章的其余部分描述了关系型和面向对象方法的元模型，揭示了两种数据视图之间的相似与不同。\n\
  \n## 关系型数据库设计\n\nCodd 原始的关系模型通过 `relations, attributes` 和 `tuples`（元组）描述数据。这些在概念模型中反映为\
  \ `entity classes, attributes,*` 和 `occurrences`。在关系型数据库设计中，它们分别被实现为 `tables, columns`\
  \ 和 `rows`。\n\n### 表和列\n\n实体类 `TABLE` 和 `COLUMN` 显示在图 2-27 中。这种结构与之前描述的 `ENTITY\
  \ CLASS` 和 `ATTRIBUTE` 相似。一个 `TABLE` 是关于某事的数据的集合，组织成一组行和列。也就是说，`TABLE` 的结构由一组 `COLUMNS`\
  \ 定义。因此，每个 `TABLE` 可能 `由`一个或多个 `COLUMNS` 组成，而每个 `COLUMN` 必须 `属于`单个 `TABLE`。\n\n\
  ![image](img/B9780120887989500036_f02-27-9780120887989.jpg)\n\n图 2-27 列的视图。\n\n\
  `COLUMN` 不能在表中重复，它定义了 `TABLE` 所描述的特定事物。`ROW` 是 `TABLE` 所关于的事物的实例。行和列可以是任何顺序。它们的顺序不被赋予任何意义。\n\
  \n### 业务规则（关系理论版本）\n\n1. 每个 `COLUMN` 在 `TABLE` 中只能出现一次。\n2. 每个 `COLUMN` 的实例（即列在行中的出现）一次只能包含一个值。\n\
  3. `COLUMNS` 在 `TABLE` 中的呈现方式没有隐含顺序。\n4. 行在 `TABLE` 中出现的顺序没有隐含顺序。\n\n每个 `COLUMN`\
  \ 由一个“标签”描述，除其他外，该标签在 `COLUMN` 出现在屏幕或报告时都可以显示。列的特征由其 `Format` 定义，可选由其 `Length` 和（数量）`Decimal\
  \ places` 定义。其 `Mandatory indicator` 决定了是否必须为所有行提供该列提供值。`COLUMN` 的实例可以被分配一个“默认值”。\n\
  \n\n\n\n\n图 2-28 显示了一个数据库设计图，该图可以从图 2-17 的示例实体类模型中推导出来。这是一个通用的数据库设计图，由 Oracle 的\
  \ Designer 建模工具生成。其他工具可能会以不同的方式呈现相同的信息。在这张图中，每个表由一个矩形表示，矩形内部列出了所有列。与实体类模型一样，星号表示必填列，空心圆表示可选列。此外，实心圆表示作为\
  \ `primary key`（主键）一部分的列（主键已在第七章\n\n图 2-28 示例数据库设计。\n\n因此，在这个示例中，“Parties”、“Orders”、“Line\
  \ Items”、“Product types”和“Service types”都是图 2-27 中实体类 TABLE 的示例。请注意，在此设计中保留了概念模型中的弧形表示法。在这种情况下，这意味着必须由存储过程或其他类型的程序化约束来强制排他性。`Pdty_pdty_id`\
  \ 或 `St_service_type_id` 必须为为空。此外，取决于概念模型中的约束，另一列必须是“空”或“非空”。\n\n数据库设计中的大部分内容涉及对约束的提供：主键、外键、域、列约束、弧等。由于这些是业务规则的实现，因此对这些内容的详细讨论推迟到了第七章。\n\
  \n### 视图\n\nSQL 作为关系型数据库的语言，提供了定义 `views`（视图）的能力，视图是组织成类似于表的数据集合，但它们实际上派生自其他表。图\
  \ 2-29 将 VIEW 和 TABLE 显示为更通用的概念 DATA GROUP（数据组）的子类型。DATA GROUP 是任何组织的数据集合，可以是 TABLE，也可以是从一个或多个其他\
  \ TABLE 派生的 VIEW。这与之前描述的实体类模型视图结构相同。\n\n![image](img/B9780120887989500036_f02-29-9780120887989.jpg)\n\
  \n图 2-29 表视图。\n\nVIEW 必须由一个或多个 TABLE SELECTIONS（表选择）定义，其中每个 TABLE SELECTION 是使用另一个\
  \ DATA GROUP（TABLE 或 VIEW）。每个 TABLE SELECTION 反而可能由一个或多个 COLUMN SELECTIONS（列选择）组成，每个列选择使用该表中的一列。通过根据一个或多个\
  \ VIEW SELECTION CONDITIONS（视图选择条件）评估所选 DATA GROUPS 和 COLUMNS，从组件 DATA GROUPS 中的数据填充视图。每个\
  \ VIEW SELECTION CRITERION（视图选择标准）将指定 COLUMN 的值与“常量”或另一列的值进行比较。\n\n## 业务规则\n\n任何用于作为\
  \ TABLE SELECTION 部分的 COLUMN SELECTION 必须是该 TABLE SELECTION 中使用的 DATA GROUP 的一部分。\n\
  \n例如，在图 2-28 所示的示例数据库设计中，可以为 CUSTOMER 构建一个视图，其实例被定义为参与 ORDER 的 PARTY（“Party_ID_from”），其中作为“Party_ID_to”的\
  \ PARTY 是我们。在 SQL 中，视图定义如下：\n\n![image](img/B9780120887989500036_u02-01-9780120887989.jpg)\n\
  \n在我们的模型中，这翻译为一个名为“Customer”的 VIEW，由以下 TABLE SELECTIONS 定义：\n\n- 使用 DATA GROUP (TABLE)\
  \ “Orders”\n- 使用 DATA GROUP (TABLE) “Parties”，并由属于 DATA GROUP (TABLE) “Parties”的以下\
  \ COLUMNS 组成：\n→ ID\n→ Party_type\n→ Organization_name\n→ Given_name\n→ Middle_initial\n\
  → Surname\n- 根据以下 TABLE SELECTION CONDITIONS 定义，这些条件比较了以下 COLUMNS：\n→ 根据第一个 TABLE\
  \ SELECTION 条件定义\n• 根据属于 TABLE “Order” 的 COLUMN “Party_id_from” 定义\n• 运算符 = “equal”\n\
  • 与属于 TABLE “Party” 的 COLUMN “ID” 比较 <and> \n• 根据属于 TABLE “Order” 的 COLUMN “Party_id_from”\
  \ 定义\n• 运算符 = “equal”\n• 与常量 <the party of company> 比较\n→ 根据第二个 TABLE SELECTION\
  \ 条件定义\n• 根据属于 TABLE “Order” 的 COLUMN “Party_id_to” 定义\n• 运算符 = “not equal”\n• 与常量\
  \ <the party of company> 比较\n\n定义视图的 SQL 语句是属性值。由于 VIEWS 派生自 ENTITY CLASSES，每个 TABLE\
  \ SELECTION 必须基于 ENTITY CLASS SELECTION，每个 COLUMN SELECTION 必须基于 ATTRIBUTE SELECTION，且每个\
  \ TABLE SELECTION 必须基于 CRITERION。\n\n![image](img/B9780120887989500036_f02-30-9780120887989.jpg)\n\
  \n图 2-30 实体类与表视图\n\n### 数据组与应用程序系统\n\n图 2-31 显示了表和视图为了方便而进行的分组。这可能与开发和实现的方式有关，也可能具有功能上的意义。无论\
  \ DATA GROUPS 是如何组织的，它们最终应该按 APPLICATION SYSTEM 组织。本书以这种方式呈现元模型，尽管并非所有的信息技术部门都会这样做。对于我们的目的，APPLICATION\
  \ SYSTEM 是为了实现业务功能而的数据分组。（程序也是 APPLICATION SYSTEM 的部分，第第三章](#B9780120887989500048.htm_chapter3)将详细讨论这一点，以及\
  \ APPLICATION SYSTEM 如何运作。）\n\n### 面对象数据设计\n\n描述数据的另一种方法是使用面向对象的方法设计程序的人所采用的方法。这种方法关注不是数据的存储方式，而是它们在程序中的处理方式。然而，结构是相关的，因为它们也派生自概念模型。\n\
  \n2005 年最常用的面向对象数据的表示法是 UML 类图，它是 20 世纪 90 年代一组设计师开发的 [OMG 2003]。它与之前描述的实体关系表示相似，事实上（正如我们在第一章](#B9780120887989500024.htm_chapter1)中所看到的），可以使用\
  \ UML 的子集绘制实体关系图。\n\n关于 UML 优点的说法之一是，在需求分析期间用于描述业务实体类的符号也可以用于描述为计算机系统创建的类。这令人遗憾，因为这些*并不是同一个东西*，在描述两者时使用相同的符号和术语具有误导性。正如我们在这里看到的，面向对象的设计模型与分析模型完全不同，无论其表示法如何。\n\
  \n\n\n\n在关系世界中，区分了对业务具有重要意义的“实体”与在计算机中表示这些事物的“表和列”。虽然关系世界中的许多数据建模者确实混淆了它们，但至少在原则上，实体和表是可以分开处理的。事实上，尽管数据库设计应该*基于*实体模型，但出于性能或其他物理特性的考虑，让设计人员*偏离*该结构通常是合适的。\n\
  \n同样，在面向对象的世界中，世界中事物的“类”与计算机产物的“类”仍然非常不同。这些事物之间的混淆可能会导致遗憾的结果。即使在面向对象的世界中，描述类的代码片段与代码所描述的实体类并不是同一种事物。\n\
  \n此外，面向对象的程序还关注业务完全不可见的事物。这些是纯粹为了辅助计算机处理而定义的对象。尽管如此，与关系世界一样，如果为了响应业务需求，面向对象设计的类结构应该派源于业务的实体关系模型。然而，与关系模型一样，面向对象的设计模型也可能出于良好且有效的设计原因与实体关系模型产生差异。\n\
  \n由于需求分析中的现实世界“类”与设计中的计算机化“类”具有区分的重要性，前者在此处将继续被称为 `ENTITY CLASS`。后者在此处被称为 `CLASS\
  \ IMPLEMENTATION`。图 2-32 显示了 `CLASS IMPLEMENTATION`，它代表描述类的代码片段。因为它指的是一段程序代码，`CLASS\
  \ IMPLEMENTATION`将在第三章中进行更详细的描述，此处类型为灰色。\n\n![image](img/B9780120887989500036_f02-32-9780120887989.jpg)\n\
  \n图 2-32 类实现。\n\n与关系世界不同，子类型和超类型（（父类）可以直接在面向对象设计中实现。也就是说，每个 `CLASS` 都可以是一个或多个其他\
  \ `CLASSES`的*泛化*，并且每个 `CLASS` 可以*继承自*一个且仅一个另一个 `CLASS`。（出于哲学原因，在书中我们排除了多重继承。尽管当然，模型可以更改以适应它。）[^*\
  \ Meilir Page-Jones 将 `CLASS IMPLEMENTATION` 描述为四类类别之一，此处表示为 `CLASS IMPLEMENTATION`\
  \ 的子类型 [Page-Jones 2000, pp. 233–240]。^(**)\n\n– 一个 `BUSINESS CLASS` 代表业务中的某物，可能是以下任何一种。\n\
  \n→ 一个 `CLASS OF ENTITY`，例如“人员”或“合同”\n\n→ 一个 `ATTRIBUTE CLASS`，为 `INSTANCE ATTRIBUTES`（后文将描述）提供数据类型，例如“余额”（银行账户）或“单位成本”（产品）\n\
  \n→ 一个 `ROLE CLASS`，例如“客户”或“患者”\n\n→ 一个 `RELATIONSHIP CLASS`，例如“账户所有权”或“患者监督”（类似于三表实体关系图中的交叉实体）\n\
  \n这些分别对应于（并应该基于）概念模型的实体类、属性、关系角色和关联类。其余的类别仅是面向对象设计者和程序员关注的。\n\n– 一个 `ARCHITECTURAL\
  \ CLASS` 涉及在特定计算机上的实现细节。这可能是以下之一。\n\n→ 一个 `HUMAN INTERFACE CLASS`，例如“窗口”或“命令按钮”\n\
  \n→ 一个 `DATABASE MANIPULATION CLASS`，例如“事务”或“备份”\n\n→ 一个 `MACHINE-COMMUNICATION\
  \ CLASS`，例如“端口”或“远程机器”\n\n– 一个 `FOUNDATION CLASS`，广泛可用。`FOUNDATION CLASSES` 包括以下：\n\
  \n→ 一个 `FUNDAMENTAL CLASS`，例如“整数”、“布尔值”和“字符”。\n\n→ 一个实现数据结构的 `STRUCTURAL CLASS`，例如“栈”、“队列”等等。\n\
  \n→ 一个 `SEMANTIC CLASS`，例如“日期”、“时间”、“角度”等。（这些类具有比基础类丰富的含义。此外，它们的属性值可以用特定单位表示，例如“英尺”或“秒”\
  \ [Page-Jones 2000, pp. 233–240]。）\n\n– 一个 `APPLICATION CLASS` 代表特定于应用程序，可能是以下之一。\n\
  \n→ 一个 `EVENT-RECOGNIZER`，寻找“患者发热”事件。\n\n→ 一个 `EVENT-MANAGER`，执行“患者发热”事件。\n\n由于需求分析中的现实世界“类”与设计中的计算机化“类”具有区分的重要性，前者在此处将继续被称为\
  \ `ENTITY CLASS`。后者在此处被称为 `CLASS IMPLEMENTATION`。图 2-32 显示了 `CLASS IMPLEMENTATION`，代表描述类的代码片段。因为它指的是一段程序代码，`CLASS\
  \ IMPLEMENTATION`将在第三章中进行更详细的描述，此处类型为灰色。\n\n与关系世界不同，子类型和超类型可以直接在面向对象设计中实现。也就是说，每个\
  \ `CLASS` 都可以是一个或多个其他 `CLASSES`的*泛化*，并且每个 `CLASS` 可以*继承自*一个且仅一个另一个 `CLASS`。（出于哲学原因，在书中我们排除了多重继承。尽管当然，模型可以更改以适应它。）[^*\
  \ Meilir Page-Jones 将 `CLASS IMPLEMENTATION` 描述为四类类别之一，此处表示为 `CLASS IMPLEMENTATION`\
  \ 的子类型 [Page-Jones 2000, pp. 233–240]。\n\n– 一个 `BUSINESS CLASS` 代表业务中的某物，可能是以下任何一种。\n\
  \n→ 一个 `CLASS OF ENTITY`，例如“人员”或“合同”\n\n→ 一个 `ATTRIBUTE CLASS`，为 `INSTANCE ATTRIBUTES`（后文将描述）提供数据类型，例如“余额”（银行账户）或“单位成本”（产品）\n\
  \n→ 一个 `ROLE CLASS`，例如“客户”或“患者”\n\n→ 一个 `RELATIONSHIP CLASS`，例如“账户所有权”或“患者监督”（类似于三表实体关系图）\n\
  \n这些分别对应于（并应该基于）概念模型的实体类、属性、关系角色和关联类。其余的类别仅是面向对象设计者和程序员关注的。\n\n– 一个 `ARCHITECTURAL\
  \ CLASS` 涉及在特定计算机上的实现细节。这可能是以下之一。\n\n→ 一个 `HUMAN INTERFACE CLASS`，例如“窗口”或“命令按钮”\n\
  \n→ 一个 `DATABASE MANIPULATION CLASS`，例如“事务”或“备份”\n\n→ 一个 `MACHINE-COMMUNICATION\
  \ CLASS`，例如“端口”或“远程机器”\n\n– 一个 `FOUNDATION CLASS`，广泛可用。`FOUNDATION CLASSES` 包括以下：\n\
  \n→ 一个 `FUNDAMENTAL CLASS`，例如“整数”、“布尔值”和“字符”。\n\n→ 一个实现数据结构的 `STRUCTURAL CLASS`，例如“栈”、“队列”等。\n\
  \n→ 一个 `SEMANTIC CLASS`，例如“日期”、“时间”、“角度”等。（这些类具有比基础类丰富的含义。此外，它们的属性值可以用特定单位表示，例如“英尺”或“秒”\
  \ [Page-Jones 2000, pp. 233–240]。）\n\n– 一个 `APPLICATION CLASS` 代表特定于应用程序，可能是以下之一。\n\
  \n→ 一个 `EVENT-RECOGNIZER`，寻找“患者发热”事件。\n\n→ 一个 `EVENT-MANAGER`，执行“患者发热”事件。\n\n为了提供更大的灵活性，`CLASS\
  \ IMPLEMENTATION` 可能是一个或多个其他 `CLASSES`的*超类型*。此外，每个 `CLASS` 可能是一个且仅一个另一个 `CLASS`的*超类型*。\n\
  \n### 规则\n\n由于需求分析中的现实世界“类”与设计中的计算机化“类”具有区分的重要性，前者在此处将继续被称为 `ENTITY CLASS`。后者在此处被称为\
  \ `CLASS IMPLEMENTATION`。图 2-32 显示了 `CLASS IMPLEMENTATION`，代表描述类的代码片段。因为它指的是一段程序代码，`CLASS\
  \ IMPLEMENTATION`将在第三章中进行更详细的描述，此处类型为灰色。\n\n\n\n\n- **受保护 (Protected):** `CLASS\
  \ ELEMENT` 只能在其 `CLASS IMPLEMENTATION` 内部以及由继承自该类的类被可见和使用。\n- **私有 (Private):**\
  \ `CLASS ELEMENT` 仅在在其 `CLASS IMPLEMENTATION` 的上下文中可见的。\n\n其他类型的可见性由特定的面向对象语言实现，但这三种是最常用的。请注意，`CLASS\
  \ ELEMENT` 本身可以是另一个 `CLASS IMPLEMENTATION` 的*使用*——具体来说，是一个 `FOUNDATION CLASS`（基础类）或\
  \ `ARCHITECTURE CLASS`（架构类）。例如`INSTANCE ATTRIBUTE` “Name”本身可以是一个 `ATTRIBUTE CLASS`。同样请注意，尽管\
  \ `CLASS IMPLEMENTATION` 显示为灰色——因为作为程序代码，它实际上属于“活动”（Activities）列（参考第三章）——但 `CLASS\
  \ ELEMENT` 并不是。它只出现在数据（Data）列中。\n\n### 对象\n\n图 2-34 显示 `CLASS` 可以*体现于*一个或多个实际的 `OBJECTS`；也就是说，一个\
  \ `OBJECT` 是一个且仅一个 `CLASS` 的*实例*。^*\n\n![image](img/B9780120887989500036_f02-34-9780120887989.jpg)\n\
  \n图 2-34 对象。\n\n### 从概念模型到关系数据库设计\n\n图 2-35 显示了 `COLUMN` 和 `TABLE` 的定义如何基于 `ATTRIBUTE`\
  \ 和 `ENTITY CLASS` 的定义——通过 `COLUMN ATTRIBUTE MAPPINGS`（列属性映射）和 `TABLE ENTITY CLASS\
  \ MAPPINGS`（表实体类映射）。原则上，初始数据库设计应该直接源自实体关系模型结构。在大多数情况下，一个 `TABLE` 应该*基于*单个 `ENTITY\
  \ CLASS`。当然，情况并不总是那么整洁，因为由于等原因，实体关系模型中的超类型/子类型结构无法直接在纯关系型数据库中实现。\n\n![image](img/B9780120887989500036_f02-35-9780120887989.jpg)\n\
  \n图 2-35 表和实体类。\n\n将超类型/子类型结构映射到扁平关系表原则上有三种不同的方法。每种方法都有优缺点，因此选择方法时必须谨慎：\n\n- 可以为每个超类型定义一个\
  \ `table`，包含其所有的子类型。然后为超类型属性以及每个子类型中的属性定义列。这种方法的优点是简单，但意味着许多列将具有空值。此外，将无法对任何子类型列强制值。描述子类型的列仅对代表该子类型发生情况的行有值。\n\
  - 可以为每个子类型定义一个 `table`，包括源自其属性的列以及包含所有继承的超类型属性的列。这允许对列的每一行强制值，但增加了结构的复杂性。任何指向超类型的关系（例如），现在必须（通过排斥性弧）使用指向每个相应子类型表的外键来实现。此外，超类型的列必须在每个子类型中冗余地定义。\n\
  - 可以为超类型和每个子类型分别定义一个 `table`，并用外键从超类型指向每个子类型。这种方法最优雅，冗余最少且控制力最强，但实现起来也最复杂。\n\n原则上，没有必要连接\
  \ `ENTITY CLASS` 和 `TABLE`，因为这种关系已经通过 `ATTRIBUTE` 和 `COLUMN` 之间的映射实体类 `COLUMN ATTRIBUTE\
  \ MAPPING` 隐含地包含了。然而，在设计过程中，通常在映射单个列和属性之前，就已经确定了实体类和表之间的关系。此处所示的配置提供了做出此类临时设计决策的能力。再次强调，这是临时的。一旦完成\
  \ `COLUMN ATTRIBUTE MAPPINGS`，`TABLE ENTITY CLASS MAPPING` 实体类就是多余的。\n\n### 从概念模型到面向对象的设计\n\
  \n正如之前的定义所暗示的那样，`BUSINESS CLASS` 可以直接源自需求分析期间创建的概念模型。具体而言，如图 2-36 所示，`BUSINESS CLASS`\
  \ 可以*基于*一个或多个 `CLASS DEFINITIONS`，每一个定义反过来都是 `ATTRIBUTE`、`ENTITY CLASS` 或 `RELATIONSHIP\
  \ ROLE` 的*使用*。由于这些中的每一个都可能被*用于*一个或多个 `BUSINESS CLASSES`，交叉实体类 `CLASS DEFINITION\
  \ ELEMENT` 被定义为：特定的 `CLASS DEFINITION` 正在使用特定的 `ATTRIBUTE`、`ENTITY CLASS` 或 `RELATIONSHIP\
  \ ROLE`。\n\n![image](img/B9780120887989500036_f02-36-9780120887989.jpg)\n\n图 2-36\
  \ 类定义。\n\n正如之前的定义所暗示的，一个 `ENTITY CLASS` 是特定的 `ATTRIBUTE` 的*使用*。同样，在面向对象世界中，所有属性都会被考虑到。注意，`CLASS\
  \ IMPLEMENTATION` 这种可以*基于*一个 `ATTRIBUTE`。\n\n\n\n\n\n*可扩展标记语言*（*XML*）是一种用于描述和为文本及数值数据提供结构的语言，以便将其从一个地方传输到另一个地方。它利用\
  \ `tags`（类似于 HTML `tags`）来识别数据以及数据与其他数据之间的关系。它类似于数据建模，因为它为数据提供了结构，但它不是图形表示，而是一种通过文本对数据进行标记的手段。以下是一个\
  \ XML 示例，用于描述可能在文档中呈现的数据记录。\n\n![image](img/B9780120887989500036_u02-02-9780120887989.jpg)\n\
  \n你看到的大部分内容都是描述结构的。唯一的数据元素是**粗体**显示的值。在每个数据元素周围都有描述它的 `tags`。每个 `tag` 都括在`<角括号>`\
  \ 中。每个 `tag` 都是成对出现的。第一个是一个单词或短语（例如，`<PRODUCT>`）；第二个在下方，具有相同的单词或短语，前面有一个右斜杠（例如，`</PRODUCT>`）。根据\
  \ XML 的规则，指定一组数据始终需要 `end tag`，尽管起始标签和结束标签之间可能没有数据（例如，`<specification></specification>`）。单个\
  \ `tag` 可以表示这种情况，右斜杠只需跟在初始标签短语之后（如，`<specification/>`）。\n\n`Tags` 可以嵌套。在以前的示例中，`tag`\
  \ `<PRODUCT>` 包含了（其他之外的）`<specification>` 的 `tag`，而它又包含了 `<variable>` 和 `<value>`\
  \ 的 `tags`。图 2-38 中的数据模型显示，一个 XML DOCUMENT 可能`由`一个或多个 XML `TAGS` 组成，每个 `TAGS` 反过来也可以`由`更多\
  \ XML `TAGS` 组成。注意 XML `TAGS` 的属性““Tag”，它包含了作为该元素 `tag` 的单词或短语。\n\n![image](img/B9780120887989500036_f02-38-9780120887989.jpg)\n\
  \n图 2-38 XML 文档和元素。\n\n注意，之前的 XML 示例像所有 XML 文件一样，以标准头开头，揭示了文档所使用的 XML 版本。也就是说，每个\
  \ XML DOCUMENT 都是根据其所`示例的`的 XML VERSION 相应的规则定义的。\n\n你可能注意到，在示例中 `<PRODUCT>` 是由每个\
  \ `<product_id>`、`<product_name>` 和 `<unit_of_measure>` 描述的，但 `<specification>`\
  \ 出现了多次。XML 本身没有任何规定来决定在何处使用哪些 `tags`，但这种嵌套结构可以通过一种特殊的 XML 文档——`document type declaration`（`DTD`）来控制。该示例的\
  \ `DTD` 如下。\n\n![image](img/B9780120887989500036_u02-03-9780120887989.jpg)\n\n由于\
  \ DOCUMENT 的的主是是产品，因此 `DOCTYPE` 称为 `PRODUCT`。该规范的第一个 `ELEMENT` 标识了第一个 `tag`（也称为\
  \ `PRODUCT`），随后是其中包含的 `tags` 列表（`product_id`、`product_name`、unit of measure 和 `specification`）。\n\
  \n`unit_of_measure` 后面的问号 `?` 意味着每当指定 `<PRODUCT>` 时，可能有一个 `<unit_of_measure>` `tag`，但后面可能不超过一组。`specification`\
  \ 后面的星号 `^*` 意味着 `<PRODUCT>` 后面可能有一个或多个 `<specification>` `tag` 组，也可以没有。如果在任何 `tag`\
  \ 后面有一个加号 `+`，则意味着必须有一个或多个。也就是说，`tag` 必须出现在父标签之后，它可以出现多次。缺少星号或问号（如“<product id>”和“<product\
  \ name>”）意味着对于每个 `<PRODUCT>` 出现，必须有且只有一个值。\n\n在 `PRODUCT` 内部的 `tags` 列表之后，每个 `tag`\
  \ 都有它自己的 `ELEMENT` 行。在大多数情况下，每个标签的参数是 (`#PCDATA`)，这意味着该 `tag` 将描述数据。另一方面，`Specification`\
  \ 有它自己的参数列表“variable”和“value”，就像 `PRODUCT` 一样。它的 `tags` 随后被列为它们自己的 `ELEMENTS`。\n\
  \n图 2-39 显示每个 XML DOCUMENT 必须`受限于`恰好一个 DOCUMENT TYPE DECLARATION。（实际上，你可以创建一个没有\
  \ `DTD` 的 XML DOCUMENT，但不建议这样做。）那么，每个 DOCUMENT TYPE DECLARATION 必须`由`一个或多个 XML `ELEMENTS`\
  \ 组成，其中每个 XML `ELEMENT` 可能会`体现在`真实 XML 文档上的一个或多个 XML `TAGS` 中。\n\n![image](img/B9780120887989500036_f02-39-9780120887989.jpg)\n\
  \n图 2-39 XML 文档类型声明。\n\n除了起始标签之间的数据外，还可以为 `attributes` 指定值。例如，之前示例的替代方案可能是：\n\n\
  ![image](img/B9780120887989500036_u02-02-9780120887989.jpg)\n\n这看起来像是：\n\n![image](img/B9780120887989500036_u02-03-9780120887989.jpg)\n\
  \n在 图 2-40 中，XML `ATTRIBUTE` 是 `ELEMENT` 的限定符。同样，XML CONTENT 可能是部分：\n\n![image](img/B9780120887989500036_f02-38-9780120887989.jpg)\n\
  \n图 2-40 XML 属性。\n\nXML 显然是一种数据方式，但它的优势在于表达概念。合理的做法是将 `tags` 映射到 图 2-41。这显示了一个或多个\
  \ XML `TAGS` 如何定义 XML CONTENT：\n\n![image](img/B9780120887989500036_f02-39-9780120887989.jpg)\n\
  \n图 2-41 XML 元素。\n\n# 第六章：生产系统\n\n建模第五章（构建者视图）需要描述 Oracle、DB2、Sybase 等内部机制的元模型。这超出了本书的范围。\n\
