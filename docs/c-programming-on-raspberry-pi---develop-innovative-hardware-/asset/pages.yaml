    # 4.3.3 • Using relays


    In applications where the load operates with large voltages and currents, it is
    recommendable to use relays to switch the loads ON and OFF. Either semiconductor
    or contact-based physical relays can be used in circuits. Relays are also available
    as modules with built-in transistors making them easier to use in microcontroller
    applications. Figure 4.8 shows such a relay module with 4 onboard relays. Alternatively,
    a transistor circuit can be used to switch the relay ON and OFF.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_103_1.png)


