    To be able to access the Raspberry Pi from a mobile phone app, make the following
    changes to your Raspberry Pi from the command line:


    +   - Start nano and edit the following file:


    ```

    ```bash

    pi@raspberrypi:~ $ sudonanо /etc/systemd/system/dbus-org.bluez.service

    ```

    ```


    +   - Add **-C** at the end of the **ExecStart=** line. Also, add another line
    after ExecStart. The final two lines should look like this:


    ```

    ```ini

    ExecStart=/usr/lib/bluetooth/bluetoothd -C

    ExecStartPost=/usr/bin/sdpdtool add SP

    ```

    ```


    +   - Exit and save the file by entering **Ctrl+X** followed by **Y**

    +   - Reboot your Raspberry Pi:


    ```

