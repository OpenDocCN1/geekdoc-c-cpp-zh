- pgno: 35
  md: "# Chapter 3 • C Programming for Raspberry Pi\n\n# 3.1 • Overview\n\nIn this\
    \ chapter we will be look at the basic principles of programming using C. There\
    \ are hundreds of books, tutorials and application notes on programming using\
    \ C and therefore this chapter is not intended to teach C programming in detail.\n\
    \n# 3.2 • The C Language\n\n# 3.2.1 • Variables\n\nC language supports the following\
    \ variable types:\n\n| Type | Description |\n|---|---|\n| char | single character\
    \ or 8-bit variable (-255 to + 256) |\n| unsigned char | 8-bit unsigned number\
    \ (0 to +255) |\n| int | 32-bit signed integer (-2147483648 to +2147483647) |\n\
    | long | 32-bit signed integer (-2147483648 to +2147483647) |\n| unsigned int\
