  md: '# 3.2.18 • Pointers


    Pointers are very important parts of the C programming language. A pointer holds
    the address of a variable in memory, or it points to the address of a variable.
    A pointer is defined by specifying its type, followed by the * character and the
    name of the pointer:


    ```

    char *ptr;

    ```


    In the above example, **ptr** is a character pointer. Similarly, we can have an
    integer pointer called **p**:


    ```

    int *p;

    ```


    We can initialise a pointer with the address of a variable as shown below. Here,
    character variable **c** is assigned value Z. **p** is defined as a character
    pointer and it is initialised with the address of **c** i.e. **p** points to the
    address of variable **c**:


    ```

    char c = ‘Z’;

    char *p = &c;

    ```


    The above assignments are illustrated in Figure 3.58, where it is assumed character
    j is at address 200.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_86_0.png)


    The indirection operator * can be used to assign values to the memory address
    pointed to by a pointer. For example, the contents of location 200 in Figure 3.58
    can be changed to ‘Y’ by the statement:


    ```

    *p = ‘Y’;

    ```


    Some examples of using pointers are given below:


    ```

    int a = 10;

    int b;

    int *p = &a;

    ```'
