- pgno: 364
  md: '# ## Chapter 17 • Sending Data to the Cloud


    # ### 17.1 • Overview


    The Internet of Things (IoT) has recently become one of the popular topics in
    embedded applications. In IoT based applications, we usually want to send sensor
    data to the cloud so it can be accessed from anywhere. Several cloud services
    can be used to store data (for example **SparkFun, ThingSpeak, Cloudino, Bluemix**).
    In this project, **ThingSpeak** is used. This is an open-source, free, cloud service
    where sensor data can be stored and retrieved using simple HTTP requests over
    the internet. ThingSpeak enables the creation of sensor logging applications,
    location tracking applications, and a social network of things with status updates.
    ThingSpeak was originally launched by ioBridge in 2010 as a service to support
    IoT applications. ThingSpeak has integrated support with MATLAB. In this chapter,
    we will be developing an interesting network-based application. Here, the system
    will get ambient temperature and humidity from the DHT11 sensor and then store
    this data on the cloud every minute so it can be accessed from anywhere.


    # ### 17.2 • Project – Sending temperature and humidity data to the cloud


    # **Description:**


    In this chapter, we will be using the DHT11 temperature and humidity sensor chip
    and send the readings to the cloud every minute.


    # **Block Diagram:**


    The block diagram of the project is shown in Figure 17.1.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_364_0.png)


    Figure 17.1 Block diagram of the project'
  merge: -1
  img_proc: true
