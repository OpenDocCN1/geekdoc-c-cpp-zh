- pgno: 243
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_243_0.png)


    *The ACKs are provided by the MCP23017.

    Figure 8.4 MCP23S17 addressing registers


    Like the MCP23017, the MCP23S17 chip has 8 internal registers that can be configured
    for its operation. The device can either be operated in 16-bit mode or in two
    8-bit mode by configuring bit IOCON.BANK. On power-up, this bit is cleared which
    chooses the two 8-bit mode by default.


    The I/O direction of the port pins are controlled with registers IODIRA (at address
    0x00) and IODIRB (at address 0x01). Clearing a bit to 0 in these registers makes
    the corresponding port pin(s) as output(s). Similarly, setting a bit to 1 in these
    registers makes the corresponding port pin(s) input(s). GPIOA and GPIOB register
    addresses are 0x12 and 0x13 respectively. This is shown in Figure 8.5.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_243_1.png)


    Figure 8.5 Configuring the I/O ports


    Further information on the MCP23S17 chip can be obtained from the Microchip Inc
    datasheet on the following web site:

    http://ww1.microchip.com/downloads/en/DeviceDoc/20001952C.pdf


