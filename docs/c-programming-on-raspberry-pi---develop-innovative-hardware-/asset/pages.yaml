- pgno: 32
  md: "# Which Method?\n\nThe choice of method depends upon the size and complexity\
    \ of the program we wish to develop. Small programs can be interactively run without\
    \ creating a program file. Larger programs can be created as Python files by using\
    \ either nano in command mode. Thonny and Mu can be used to create programs in\
    \ Desktop GUI mode. Python beginners should find Mu easy to use.\n\n# 2.5 ● Creating\
    \ and running a C program on Raspberry Pi\n\nProgramming Raspberry Pi in C is\
    \ the main topic of this book. We will use nano to create our C source programs.\
    \ The programs should have the file extensions .c. Figure 2.16 shows the program\
    \ listing our simple project (Program: msg.c).\n\n```\n#include <stdio.h>\n\n\
    int main(void)\n{\n    printf(\"Hello From Raspberry Pi 4\\n\");\n}\n```\n\nFigure\
    \ 2.16 Program: msg.c\n\nThe header file stdio.h is included at the beginning\
    \ of the program. The message is printed using the printf statement. A new-line\
    \ is printed at the end of the text using the \\n keyword.\n\nThe program is compiled\
    \ by entering the following command. Here, gcc is the C compiler, -o option specifies\
    \ that the next word (i.e. hello) is the output filename:\n\n```\npi@raspberrypi:~\
    \ $ gcc -o hello msg.c\n```\n\nThe program is run by entering the command:\n\n\
    ```\npi@raspberrypi:~$ ./hello\nHello From Raspberry Pi 4\npi@raspberrypi:~ $\n\
    ```\n\nNotice ./ specifies the file is in our current directory, which is by default\
    \ /home/pi. Alternatively you could enter the following command to run the program:\n\
    \n```\npi@raspberrypi:~ $ /home/pi/hello\nHello From Raspberry Pi 4\npi@raspberrypi:~\
    \ $\n```\n\nSome useful options of the gcc compiler are:\n\n+   - If the output\
    \ option -o is not specified, the compiler creates the executable file"
  merge: -1
  img_proc: true
- pgno: 33
  md: "called **a.out** in the default directory. For example:\n\n```\n    pi@raspberrypi:~$\
    \ gcc msg.c\n```\n\n+   - Option **-Wall** enables all compiler warnings. For\
    \ example:\n\n```\n    pi@raspberrypi:~$ gcc -Wall -o hello msg.c\n```\n\n+  \
    \ - Option **-S** generates an assembly code listing of the program. In the following\
    \ example, the assembly listing is stored in file msg.s:\n\n```\n    pi@raspberrypi:~$\
    \ gcc -S msg.c>msg.s\n```\n\n+   - Option **-save-temps** creates executable file\
    \ (a.out), assembly file, compile file, and list file:\n\n```\n    pi@raspberrypi:~$\
    \ gcc -save-temps msg.c\n    pi@raspberrypi:~$ ls msg.*\n    msg.c msg.i msg.o\
    \ msg.s\n```\n\n+   - Option **-l** links with the specified library. In the following\
    \ example, the code is linked with a library called **wiringPi**:\n\n```\n   \
    \ pi@raspberrypi:~$ gcc -o hello msg.c -lwiringPi\n```\n\n+   - Option **-v**\
    \ displays all the steps gcc takes while compiling the program:\n\n```\n    pi@raspberrypi:~$\
    \ gcc -v msg.c\n```\n\n+   - Option **@** can be used to read the compiler options\
    \ from a file. For example, assume **MyOptions** contains the lines:\n\n```\n\
    \    -Wall -o MyOutputFile\n```\n\nThen, program **msg.c** can be compiled with\
    \ the above options as:\n\n```\n    pi@raspberrypi:~$ gcc msg.c @MyOptions\n```\n\
    \n# 2.6 • Summary\n\nIn this chapter, we learned how to develop Python 3 and C\
    \ programs using several methods. The choice of method for Python depends entirely\
    \ on the user. In this book, we are interested in developing programs using C.\
    \ Therefore, the remainder of this book is about the C language and its use with\
    \ Raspberry Pi."
  merge: -1
