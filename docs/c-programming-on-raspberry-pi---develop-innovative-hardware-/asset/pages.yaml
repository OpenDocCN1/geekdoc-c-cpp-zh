    # HTTP Web server/client


    A web server is a program that uses HTTP (Hypertext Transfer Protocol) to serve
    web pages to users in response to their requests. These requests are forwarded
    by HTTP clients. By using the HTTP server/client pair, we can control any device
    connected to a web server processor over the web.


    Figure 14.16 shows the structure of a web server/client setup. In this figure,
    the Raspberry Pi is the webserver and the PC (or a laptop, tablet, or mobile phone)
    is the web client. The device to be controlled is connected to the webserver processor.
    In this example, we have'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'two LEDs connected to a Raspberry Pi. The operation of the system is as follows:


    +   - The web server is in listen mode, listening for requests from the web client.

    +   - The web client makes a request to the web server by sending a HTTP request.

    +   - In response, the webserver sends a HTTP code to the web client which is
    activated by the web browser by the user on the web client and is shown as a form
    on the web client screen.

    +   - The user sends a command (e.g. clicks a button on the web client form to
    turn ON an LED) and this sends a code to the webserver so that the webserver can
    carry out the required operation.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_341_0.png)


    In this program, a laptop with the IP address 192.168.1.199 is used as the web
    client. The Raspberry Pi with the IP address 192.168.1.202 is used as the webserver.


    # Program listing:


    Figure 14.21 shows the complete program (Program: WEBSERVER.c). At the beginning
    of the program, the library header files required are included in the program.
    Notice the port number is set to 80 which is the default HTTP port number. LED0
    and LED1 are assigned to 21 and 20 which are the GPIO port numbers respectively.


    The program then defines the HTML code that is to be sent to the web client when
    a request'
