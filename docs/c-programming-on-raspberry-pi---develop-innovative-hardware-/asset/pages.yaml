- pgno: 4
  md: '# Preface


    The Raspberry Pi 4 is the latest credit-card sized computer that can be used in
    many applications, such as audiovisual media centers, desktop computers, industrial
    control, robotics, and many more domestic and commercial applications. In addition
    to the many features found in other versions of Raspberry Pi, The Pi 4 also offers
    Wi-Fi and Bluetooth, making it highly desirable in remote and internet-based control
    and monitoring applications.


    The Raspberry Pi has traditionally been programmed using Python. Although Python
    is a very powerful language, many programmers may not be familiar with using it.
    The C language is probably the most commonly used programming languages. All embedded
    microcontrollers can be programmed using the C language these days. The C language
    is taught in all technical colleges and universities - almost all engineering
    students are familiar with the use of this language in their projects.


    This book is about using C with Raspberry Pi to develop various hardware-based
    projects. Two of the most popular C libraries, wiringPi and pigpio are used.


    The book starts with an introduction to the C language and most students and newcomers
    will find this chapter invaluable. Many projects are provided in the book, including
    using Wi-Fi and Bluetooth to establish communication with smartphones.


    The book includes many sensors and hardware-based projects. Both wiringPi and
    pigpio libraries are used in all projects. Complete program listings are given
    with full explanations. All projects given in the book have been fully tested
    and work. The following sub-headings are used in the projects where applicable:


    +   - Project title

    +   - Project description

    +   - Aim of the project

    +   - Block diagram

    +   - Circuit diagram

    +   - Program listing


    wiringPi and pigpio program listings of all Raspberry Pi projects developed in
    the book are available on the Elektor website. Readers can download and use these
    programs in their applications. Alternatively, they can modify the supplied programs
    to suit their applications.


    I hope readers find this book helpful and enjoy reading it.


    Prof Dr Dogan Ibrahim

    January 2021

    London.'
  merge: -1
  img_proc: true
