    \n# 5.11 • Project 10 – ON/OFF temperature controller\n\n# Description:\n\nTemperature\
    \ control is important in many industrial, commercial, and domestic chemical applications\
    \ as well as in many other applications. A temperature control system consists\
    \ of a temperature sensor, heater, fan (optional), an actuator to operate the\
    \ heater, and a controller. Negative feedback is used to control the heater so\
    \ that the temperature is at the desired set-point value. Accurate temperature\
    \ control systems are based on the PID (Proportional+Integral+Derivative) algorithm.\
    \ In this project, an ON/OFF type simple control system is designed. ON/OFF temperature\
    \ control systems commonly use relays to turn the heater ON or OFF depending on\
    \ the set-point temperature and measured temperature. If the measured temperature\
    \ is below the set-point value, the relay is activated which turns the heater\
    \ ON. If on the other hand, the measured temperature is above the set-point value,\
    \ the relay is de-activated to turn the heater OFF so that the temperature is\
    \ lowered.\n\nIn this project, a DHT11 type sensor chip is used together with\
    \ a heater, active buzzer, and an LED to control the temperature of a small room.\
    \ The heater is turned **ON** by the relay if the room temperature measured (**RoomTemp**)\
    \ is below the set-point temperature (**SetTemp**). It turns **OFF** if it is\
    \ above the set-point value. The buzzer sounds if the room temperature is equal\
    \ to or greater than the **MaxTemp** which is a preset danger value. **SetTemp**\
    \ and **MaxTemp** are entered from the keyboard.\n\n# Aim:\n\nThis project aims\
    \ to show how an ON/OFF temperature control system can be designed using a DHT11\
    \ sensor chip with Raspberry Pi."
