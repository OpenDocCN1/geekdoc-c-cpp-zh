    as shown in Figure 17.3. Give the name TempandHum to the application and create
    two channels called Temperature and Humidity. You can give Tags to the channels
    (separate tags with commas) for easy identification if you wish so they are not
    identified as field1 and field2. You can also include geographical data and video
