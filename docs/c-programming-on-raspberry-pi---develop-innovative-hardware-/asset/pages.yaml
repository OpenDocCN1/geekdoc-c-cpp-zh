  md: 'If the script or command we wish to run requires privilege, it should be prefixed
    with the sudo command.


    # Example


    It is required to run myscript.sh every minute. Assume this script file has the
    following line of command:


    ```

    date>> /home/pi/myfile

    ```


    Schedule this event using the crontab command. Send the output from the command
    to myfile.


    # Solution


    First of all, create the myscript.sh file and type in the above command. The default
    editor is nano. Save the file (Ctrl+X, followed by Y and Enter) and exit the editor.
    Next, give the file execute permission by entering the following command:


    ```

    pi@raspberrypi:~ $ sudo chmod 755 myscript.sh

    ```


    The steps for using the crontab command to schedule this event are given below:


    +   - Run the crontab command with the -e flag. You should see the crontab editor
    screen as in Figure 16.1


    ```

    pi@raspberrypi:~ $ crontab -e

    ```


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_359_0.png)


    Figure 16.1 Empty crontab text editor screen'
  merge: -1
