    # **Program Listing:**


    Before driving the display, we have to know the relationship between the numbers
    to be displayed and the corresponding segments to be turned ON. This is shown
    in Table 9.2. GPIO ports 21, 20, 16, 12, 7, 8, 25 are collected together to form
    an 8-bit port (top bit not used), and display data is sent to this port. For example,
    to display number 3, we have to send the hexadecimal number 0x4F to the port which
    turns ON segments **a,b,c,d,** and **g**. Similarly, to display number 9, we have
    to send the hexadecimal number 0x6F to the port which turns ON segments **a,b,c,d,
    f,** and **g**.


    x is not used, taken as 0


