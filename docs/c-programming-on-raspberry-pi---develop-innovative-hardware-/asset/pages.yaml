  md: '# 12.10 • Project 7 – Multi-threading – Two-digit 7-segment LED counter


    # Description:


    In this project, a 7-segment 2-digit multiplexed LED display is used as a counter
    to count up every second from 0 to 99. Multi-digit 7-segment displays require
    continuous refreshing of their digits so that the human eye sees the digits as
    steady and non-flashing. The general technique used is to enable each digit for
    a short time (e.g. 10ms) so that the human eye sees both digits ON at any time.
    This process requires the digits to be enabled alternately and continuously. As
    a result, the processor cannot perform any other tasks and is busy refreshing
    the digits. One technique used in non-multitasking systems is to use timer interrupts
    and refresh digits in the timer interrupt service routines. In this project, we
    will be employing a multitasking approach to refreshing the display digits.


    # Aim:


    This project aims to show how the digits of a multiplexed 2-digit 7-segment LED
    display can be refreshed in a task, while another task sends data to the display
    to count up from 0 to 99 in seconds.


    # 7-Segment LED Displays


    7-segment LED displays are frequently used in electronic circuits to show numeric
    or alphanumeric values. As shown in Figure 12.17, a 7-segment LED display consists
    of 7 LEDs connected so that numbers 0 to 9 and some letters can be displayed.
    Segments are identified by letters from a to g. Figure 12.18 shows the segment
    names of a typical 7-segment display.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_299_0.png)


    Figure 12.18 Segment names of a 7-segment display


    Figure 12.19 shows how numbers 0 to 9 can be obtained by turning ON different
    segments of the display.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_299_1.png)


    Figure 12.19 Displaying numbers 0 – 9


    7-segment LED displays are available in two different configurations: **common
    cathode** and **common anode**. As shown in Figure 12.20, in common cathode configuration,
    all cathodes of all segment LEDs are connected to ground. The segments are turned
    ON by applying a logic 1 to the required segment LED via current limiting resistors.
    In common cathode configuration, the 7-segment LED is connected to the microcontroller
    in current sourcing mode.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_299_2.png)


    Figure 12.20 Common cathode 7-segment LED display


    In a common anode configuration, the anode terminals of all the LEDs are connected'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'as shown in Figure 12.21. This common point is normally then connected to the
    supply voltage. A segment is turned ON by connecting its cathode terminal to logic
    0 via a current limiting resistor. In common anode configuration, the 7-segment
    LED is connected to the microcontroller in current sinking mode.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_300_0.png)


    In multiplexed LED applications (for example, see Figure 12.22 for a 2-digit LED)),
    the LED segments of all digits are tied together and the common pins of each digit
    are turned ON separately by the microcontroller. By displaying each digit for
    several milliseconds, the eye can not differentiate that digits are not ON all
    the time. This way we can multiplex any number of 7-segment displays. For example,
    to display number 53, we have to send 5 to the first digit and enable its common
    pin. After a few milliseconds, number 3 is sent to the second digit and the common
    point of the second digit is enabled. When this process is repeated, the user
    sees it as if both displays are continuously ON.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_300_1.png)


    Some manufacturers provide multiplexed multi-digit displays in single packages.
    For example, we can purchase 2, 4, or 8-digit multiplexed displays in a single
    package. The display used in this project is the DC56-11EWA which is a red colour,
    0.56-inch height common-cathode two-digit display having 18 pins and the pin configuration
    as shown in Table 9.1. This display can be controlled from the microcontroller
    as follows:


    +   - Send the segment bit pattern for digit 1 to segments a to g.

    +   - Enable digit 1.

    +   - Wait for a few milliseconds.'
