- pgno: 251
  md: '# # Chapter 9 • Using Analogue-to-Digital Converters (ADCs)


    # ## 9.1 • Overview


    Most sensors, in reality, are analogue and give output voltages or currents which
    are proportional to a measured variable. Such sensors cannot be directly connected
    to digital computers without using ADCs. In this chapter, we will learn how to
    connect an analogue temperature sensor chip to our Raspberry Pi and how to program
    the Raspberry Pi using the wiringPi and pigpio libraries.


    Most microcontroller systems have ADC modules. Unfortunately, the Raspberry Pi
    has no ADC modules and because of this, we have to use an external ADC chip to
    read external analogue voltages and convert them into digital. Most ADCs used
    in general purpose applications are 8 or 10-bits wide, although some higher-grade
    professional ones are 16 or even 32-bit. The conversion time of an ADC is one
    of its important specifications. This is the time taken for the ADC to convert
    an analogue input into digital. The smaller the conversion time the better. Some
    cheaper ADCs give converted digital data in serial format, while some more expensive
    professional ones provide parallel digital outputs. In this chapter, we will be
    using a 10-bit serial output ADC with a reference voltage of +3.3V. When using
    such an ADC, the resolution is 3300mV/1024 = 3.22mV per bit. Therefore, an analogue
    input voltage of 3.22mV gives a digital output of 00 0000001. 6.44mV gives 00
    0000010, 9.66mV gives 00 0000011, and so on.


    # ## 9.2 • Project 1 – Analogue temperature sensor thermometer


    **Description:**


    In this project, an analogue temperature sensor chip is used to measure and display
    ambient temperature every second on a PC screen. The Raspberry Pi does not have
    any analogue-to-digital converters (ADC) on-board, so an external ADC chip is
    used in this project.


    **Aim:**


    This project aims to show how an external ADC chip can be connected to a Raspberry
    Pi and how temperature can be read and displayed on a monitor using an analogue
    temperature sensor chip.


    **Block Diagram:**


    Figure 9.1 shows the block diagram of the project.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Circuit Diagram:


    The dual MCP3002 ADC chip is used in this project to provide analogue input capability
    to the Raspberry Pi. The chip has the following features:


    +   - 10-bit resolution (0 to 1023 quantisation levels).

    +   - On-chip sample and hold.

    +   - SPI bus compatible.

    +   - Wide operating voltage (+2.7V to +5.5V).

    +   - 75 Ksps sampling rate.

    +   - 5nA standby current, 50µA active current.


    The MCP3002 is a successive approximation 10-bit ADC with an on-chip sample and
    hold amplifier. The device is programmable to operate as either a differential
    input pair or as dual single-ended inputs. The device is offered in an 8-pin package.
    Figure 9.2 shows the pin configuration of the MCP3002.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_252_0.png)


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_252_1.png)


    The pin definitions are as follows:


    Vdd/Vref: Power supply and reference voltage input

    CHO: Channel 0 analogue input

    CH1: Channel 1 analogue input

    CLK: SPI clock input

    DIN: SPI serial data in

    DOUT: SPI serial data out

    CS/SHDN: Chip select/shutdown input'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'The MCP3002 ADC has two configuration bits: SGL/DIFF and ODD/SIGN. These bits
    follow the sign bit and are used to select the input channel configuration. The
    SGL/DIFF is used to select single-ended or pseudo-differential mode. The ODD/SIGN
    bit selects which channel is used in single-ended mode and is used to determine
    polarity in pseudo-differential mode. In this project, we are using channel 0
    (CH0) in single-ended mode. According to the MCP3002 datasheet, SGL/DIFF and ODD/SIGN
    must be set to 1 and 0 respectively.


    Figure 9.3 shows the circuit diagram of the project. A TMP36DZ type analogue temperature
    sensor chip is connected to CH0 of the ADC. TMP36DZ is a 3 terminal small sensor
    chip with pins: Vs, GND, and Vo. Vs is connected to +3.3V, GND is connected to
    system ground, and Vo is the analogue output voltage. Temperature in degrees centigrade
    is given by:


    **Temperature = (Vo – 500) / 10**


    Where Vo is the sensor output voltage in millivolts.


    The CS, Dout, CLK, and Din pins of the ADC are connected to SPI pins CEO, MISO,
    SCLK, and MOSI of the Raspberry Pi respectively.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_253_0.png)


    Figure 9.3 Circuit diagram of the project


    # Program listing:


    # wiringPi


    Figure 9.4 shows the program listing (Program: tmp36.c). Inside the main program,
    function get_adc_data is used to read the analogue data between 0 and 1023, where
    the channel number (AdcChan) is specified in the function argument as 0 or 1.
    This value is then converted into millivolts, 500 is subtracted from it, and the
    result is divided by 10 to find the temperature in degrees centigrade. The temperature
    is displayed on the monitor every second.'
