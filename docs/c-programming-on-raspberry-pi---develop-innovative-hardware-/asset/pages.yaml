    | Option | Description |

    |---|---|

    | CSIZE | CS5, CS6, CS7, CS8 (character size, 5,6,7,8 bits) |

    | CLOCAL | Ignore modem status lines |

    | CREAD | Enable receiver |

    | IGNPAR | Ignore parity errors |

    | ICRNL | Map CR to NL (auto correct end of line characters) |

    | PARENB | Enable parity (even parity by default) |

    | PARODD | Odd parity |


    For example, to set the port to 9600 Baud, 8-bit data, even parity, ignore parity
    errors (fd is the file descriptor handle):


