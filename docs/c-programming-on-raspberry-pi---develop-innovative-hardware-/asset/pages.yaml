    Where rows and cols are the number of rows and columns respectively, the next
    is the number of bits used for the data interface (4-bit in this project), the
    remaining are the pins of the LCD. Notice only 4 data pins (D4-D7) are used. The
    function returns a handle (e.g. lcd) which is used in reference to LCD functions.


    Some commonly used LCD functions supported by the LCD library are: **lcdHome (handle)**:
    home the cursor


    **lcdClear (handle)**: clear the LCD


    **lcdDisplay(fd, state)**: turn the display ON or OFF (state)


    **lcdCursor(fd, state)**: turn the cursor ON or OFF (state)


    **lcdCursorBlink(fd, state)**: turn blinking ON or OFF (state)


    **lcdPosition(handle, x, y)**: position the cursor at column x, row y. (0, 0)
    is the top left-hand corner of the LCD


    **lcdCharDef(handle, index, char data[8])**: this function allows the user to
    define 8-byte custom characters to represent a 5x8 array of pixels. Up to 8 custom
    characters (pointed to by the index argument) can be stored in LCD memory. Only
    the lower 5 bits are used in the character definition. The custom character created
    can be displayed using the **lcdPutchar** function call. Examples are given in
    later sections of this chapter.


    **lcdPutchar(handle, char data)**: display ASCII character data


    **lcdPuts(handle, *string)**: display string


    **lcdPrintf(handle, char *message,...)**: display using the usual **printf** format


