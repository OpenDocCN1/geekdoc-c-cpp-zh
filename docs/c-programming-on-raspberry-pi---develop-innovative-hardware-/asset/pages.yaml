  md: "At the beginning of the program, an array called LEDs is set up to store the\
    \ port numbers of the LEDs used in the project. Name **Button** is assigned to\
    \ GPIO port 14, and names **UP** and **DOWN** are assigned to 0 and 1 respectively.\
    \ Global variable **count** is initialised to zero. The GPIO ports where the LEDs\
    \ are connected are then configured as output ports, and the GPIO port where the\
    \ **Button** is connected is configured as an input port. Inside the main program,\
    \ function **Display** is called and **count** is sent as the argument. The state\
    \ of the **Button** is then read: if the **Button** is not pressed (**Button_State**\
    \ equal to **UP**) then an UP count is performed. If on the other hand the **Button**\
    \ is pressed, (**Button_State** equal to **DOWN**) a DOWN count is performed.\
    \ Notice variable **count** is reset at the end of the counts. i.e. during an\
    \ up count when the count reaches 255 it is reset to 0 on the next cycle. Similarly,\
    \ on a down count when the count reaches 0, it is reset to 255 on the next cycle.\
    \ You can use GPIO numbering in this program by changing the following two statements:\n\
    \n```\n~~~\nint LEDs[] = {11, 9, 10, 22, 27, 17, 3, 2};\n\nand\n\nwiringPiSetupGpio()\n\
    ~~~\n```\n\n# ### pigpio\n\nThe pigpio program of the project is shown in Figure\
