    Figure 7.17 Block diagram of the project


    # **Circuit diagram:**


    The circuit diagram of the project is shown in Figure 7.18. On-chip pull-up resistors
    are available on the TMP102 I2C bus lines.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_218_1.png)


    Figure 7.18 Circuit diagram of the project


    # **Program listing:**


    Figure 7.19 shows the program listing (Program: **TMP102.c**). In this program,
    GPIO pin numbering is used. Port pins GPIO 2 and 3 I2C of Raspberry Pi are used
    as in the previous program. At the beginning of the program, the I2C address of
    TMP102 and the Pointer register addresses are defined. The Pointer register is
    set to 0 to select the temperature register.


    The program runs inside a **while** loop. Here, the temperature is read from TMP102
    and stored in integer arrays **buf[0]** and **buf[1]**. These two bytes are then
    combined to form the 12-bit temperature data in variable **Temp**. If the temperature
    is negative, it is in 2’s complement form and its complement is taken and 1 is
    added to find the true negative value. By multiplying **Temp** with the LSB, we
    find the temperature in degrees centigrade. The temperature is then displayed
    on the PC screen as a floating-point number.


    The above process is repeated after a one-second delay. Table 7.4 shows the data
    output format of the temperature. Let us look at two examples:'
