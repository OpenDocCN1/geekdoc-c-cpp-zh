- pgno: 348
  md: '# # Chapter 15 • Bluetooth Communication


    # ## 15.1 • Overview


    Bluetooth has become one of the most commonly used technologies to establish communication
    between various devices. Bluetooth is used to transfer data, pictures, and messages
    between mobile devices. All current mobile phones, laptop computers, and tablets
    are equipped with Bluetooth communication modules. The advantage of Bluetooth
    is that it can be used anywhere, at any time since it does not operate through
    a router like a Wi-Fi device. Any two Bluetooth compatible devices can establish
    communication anywhere on earth, even on a mountain top. Additionally, Bluetooth
    is an easy means of transferring data, such as pictures between different devices.
    The range of present-day Bluetooth devices is comparable to and even longer than
    most Wi-Fi routers.


    In this chapter, we will learn how Bluetooth can be used with a Raspberry Pi to
    establish communication with other Bluetooth compatible devices, such as smartphones
    (an Android phone is used in this chapter).


    # ## 15.2 • Project 1 – Bluetooth communication with a smartphone – sending and
    receiving text messages


    # **Description:**


    In this project, we develop a program to receive and send messages to an Android
    mobile phone over the Bluetooth link.


    # **Aim:**


    This project aims to show how Bluetooth can be used to establish communication
    with a Raspberry Pi.


    # **Block diagram:**


    Figure 15.1 shows the block diagram of the project.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_348_0.png)


    Figure 15.1 Block diagram of the project'
  merge: -1
