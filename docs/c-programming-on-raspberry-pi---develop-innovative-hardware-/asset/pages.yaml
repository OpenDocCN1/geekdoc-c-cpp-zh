- pgno: 270
  md: '# # Chapter 11 • Using Serial Communication


    # ## 11.1 • Overview


    Serial communication is a simple means of sending data over long distances quickly
    and reliably. The most commonly used serial communication method is based on the
    RS232 standard. Using this standard, data is sent over a single line from a transmitting
    device to a receiving device in bit-serial format at a pre-specified speed, also
    known as the Baud rate, or the number of bits sent each second. Typical Baud rates
    are 4800, 9600, 19200, 38400, etc.


    RS232 serial communication is a form of asynchronous data transmission where data
    is sent character by character. Each character is preceded with a start bit, seven
    or eight data bits, an optional parity bit, and one or more stop bits. The most
    commonly used format is eight data bits, no parity bit, and one-stop bit. Therefore,
    a data frame consists of 10-bits. With a Baud rate of 9600, we can transmit and
    receive 960 characters every second. The least significant data bit is transmitted
    first, and the most significant bit is transmitted last.


    In standard RS232 communication, logic high is defined as -12V. Logic 0 is at
    +12V. Figure 11.1 shows how character "A" (ASCII binary pattern 0010 0001) is
    transmitted over a serial line. The line is normally idle at -12V. The start bit
    is first sent by the line going from high to low. Then eight data bits are sent,
    starting from the least significant bit. Finally, the stop bit is sent by raising
    the line from low to high.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_270_0.png)


    In a serial connection, a minimum of three lines are used for communication: transmit
    (TX), receive (RX), and ground (GND). Some high-speed serial communication systems
    use additional control signals for synchronisation, such as CTS, DTR, and so on.
    Some systems use software synchronisation techniques where a special character
    (XOFF) is used to tell the sender to stop sending. Another character (XON) is
    used to tell the sender to re-start transmission. RS232 devices are connected
    using two types of connector: a 9-way, and 25-way. Table 11.1 shows the TX, RX,
    and GND pins of each type of connector. The connectors used in RS232 serial communication
    are shown in Figure 11.2.'
  merge: -1
  img_proc: true
