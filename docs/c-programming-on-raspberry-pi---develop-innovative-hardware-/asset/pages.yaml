    The MCP23017 is addressed using pins A0 to A2. Table 7.2 shows the address selection.
    In this project, address pins are connected to ground, thus the address of the
    chip is 0x20. The chip address is 7 bits wide with the low bit set or cleared
    depending on whether we wish to read data from the chip or write data to the chip
    respectively. Since in this project we will be writing to the MCP23017, the low
