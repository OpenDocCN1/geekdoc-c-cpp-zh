    \ Notice the conditions are specified using the case statement followed by the\
    \ condition. If for example, the user entered +, the two numbers added together\
    \ and the sum is stored in variable result, which is then displayed. The break\
    \ statements make sure that the switch block terminates after the contents of\
    \ a condition are executed.\n\n```\n```c\n/*---------------------------------------------------------------\n\
    \                    SIMPLE CALCULATOR\n                    =============\n\n\
