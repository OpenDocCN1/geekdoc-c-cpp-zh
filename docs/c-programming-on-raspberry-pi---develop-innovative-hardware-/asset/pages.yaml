  md: '# 1.8 • Summary


    In this chapter, we learned how to install the latest Raspberry Pi operating system
    on an SD card, and also how to start using the Raspberry Pi remotely. The instructions
    provided apply to all versions of Raspberry Pi. Additionally, setting a static
