    |---|---|

    | P0 | R/S |

    | P1 | R/W |

    | P2 | E |

    | P3 | LCD backlight |

    | P4 | D4 |

    | P5 | D5 |

    | P6 | D6 |

    | P7 | D7 |


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_222_0.png)


    Internal pull-up resistors are used on the LCD module. Therefore there is no need
    to connect external pull-up resistors. The backlight of the LCD is controlled
    from pin P3 of the PCF8574. Setting P3 to logic 1 turns the LCD backlight ON.


    Figure 7.23 shows the circuit diagram of the project where the SDA and SCL pins
    of the PCF8574 expander chip are connected to port pins GPIO 2 (SDA) and 3 (SCL)
    of Raspberry Pi.'
