  md: "# 12.7 • Timing library\n\nwiringPi provides the following timing functions\
    \ (for full details, see: http://wiringpi.com/reference/timing/ ):\n\n**millis**:\
    \ This function returns a 32-bit number representing the number of milliseconds\
    \ since the program called the wiringPiSetup function.\n\n**micros**: This function\
    \ returns a 32-bit number representing the number of microseconds since the program\
    \ called the wiringPiSetup function.\n\n**delay**: This function pauses the program\
    \ for the specified number of milliseconds. Notice the delay could be longer.\
    \ The delay is a 32-bit integer and is passed as an argument to the function.\n\
    \n**delayMicroseconds**: This function pauses the program for the specified number\
    \ of microseconds. Notice the delay could be longer. The delay is a 32-bit integer\
    \ and is passed as an argument to the function.\n\n# 12.8 • Multitasking threads\n\
    \nwiringPi provides support for multi-tasking (or multi-threading) which enables\
    \ the programmer to create new processes (functions inside a main program) that\
    \ run concurrently.\n\nThe following functions are provided:\n\n**piThreadCreate**:\
    \ This function creates a thread which is a function in the main program. This\
    \ newly created function runs concurrently with the main program. The thread name\
    \ must be passed as an argument to the function. Multitasking has many applications\
    \ in many fields. Perhaps the best-known application is in refreshing multi-digit\
    \ 7-segment displays.\n\nA thread function is created using the keyword PI_THREAD:\n\
    \n```\nPI_THREAD(MyThread)\n{\n    Body of the thread function\n}\n```\n\nA thread\
    \ is started from the main program by using function call **piThreadCreate** and\
    \ passing the thread name as the argument.\n\nSome synchronisation can be established\
    \ in a program using the **piLock** and **piUnlock** functions. The argument to\
    \ these functions are key numbers 0 to 3 used by a thread to prevent access to\
    \ variables."
  merge: -1
