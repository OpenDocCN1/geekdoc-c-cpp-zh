    Figure 11.2 RS232 connectors


    As described above, RS232 voltage levels are ±12V. On the other hand, microcontroller
    input-output ports operate at 0 to +5V voltage levels. It is therefore necessary
    to translate the voltage levels before a microcontroller can be connected to an
    RS232 compatible device. Thus, the output signal from the microcontroller has
    to be converted into ±12V, and the input from an RS232 device must be converted
    into 0 to +5V before it can be connected to a microcontroller. This voltage translation
    is normally done using special RS232 voltage converter chips. One such popular
    chip is the MAX232. This is a dual converter chip having the pin configuration
    as shown in Figure 11.3. This particular device requires four external 1µF capacitors
    for its operation.'
