  md: '# Aim:


    This project aims to show how the SPI bus can be used in Raspberry Pi-based projects.


    # Block diagram:


    The block diagram of the project is the same as in Figure 7.2, but the MCP23017
    chip is replaced with MCP23S17.


    # The MCP23S17


    The MCP23S17 is a 28 pin chip with the following features. The pin configuration
    is shown in Figure 8.2, which is the same as the pin configuration of MCP23017,
    but SPI pins are used instead of I2C pins:


    +   - 16 bi-directional I/O ports.

    +   - Up to 1.7MHz operation on the I2C bus.

    +   - Interrupt capability.

    +   - External reset input.

    +   - Low standby current.

    +   - +1.8 to +5.5V operation.

    +   - 3 address pins so that up to 8 devices can be used on the SPI bus.

    +   - 28-pin DIL package.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_241_0.png)


    Pin descriptions are given in Table 8.1.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '| Pin | Description |

    |---|---|

    | GPA0-GPA7 | Port A pins |

    | GPB0-GPB7 | Port B pins |

    | VDD | Power supply |

    | VSS | Ground |

    | SI | SPI MOSI data pin |

    | SCK | SPI clock pin |

    | SO | SPI MISO data pin |

    | CS | SPI SSEL chip enable pin |

    | A0-A2 | I2C address pins |

    | RESET | Reset pin |

    | INTA | Interrupt pin |

    | INTB | Interrupt pin |


    Table 8.1 MCP23S17 pin descriptions


    The MCP23S17 is a slave SPI device. The slave address contains four upper fixed
    bits (0100) and three user-defined hardware address bits (pins A2, A1, and A0)
    with the read/write bit filling out the control byte. These address bits are enabled/disabled
    by control register IOCON.HAEN. By default, the user address bits are disabled
    at power-up (i.e. IOCON.HAEN = 0) and A2 = A1 = A0 = 0 and the chip is addressed
    with 0x40. As such, we can use two MCP23S17 chips on SPI0 by connecting one CS
    bit to CE0, and the other one to CE1 and addressing both chips with 0x40. By setting
    bit HAEN to 1, we can change the addresses of the devices in multiple MCP23S17
    based applications (e.g. more than 2) by connecting the A2, A1, and A0 accordingly.
    Sixteen such chips can be connected (8 to CE0 and 8 to CE1), corresponding to
    16x16 = 256 I/O ports. Figures 8.3 and 8.4 show the addressing format. The address
    pins should be externally biased even if disabled.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_242_0.png)


    Figure 8.3 MCP23S17 control byte format'
  merge: -1
