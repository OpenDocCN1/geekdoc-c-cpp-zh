- pgno: 367
  md: 'You need an API key and a channel number before you start using the ThingSpeak
    Cloud service. API keys are unique to users and should not be given to other people.
    To get an API key, you should click the **API Keys** tab and save your **Write
    API** and **Read API** keys and the **Channel ID** in a safe place. In this project,
    we will be using only the Write API key. The Write API Key and Channel Number
    used in this project were (the API key has been modified for security reasons):


    **API Key = R1RZZTHF262M1W56**


    **ChannelNumber = 1278451**


    # **Program Listing:**


    We are now ready to write our program to send ambient temperature and humidity
    readings to the ThingSpeak Cloud. The program listing is shown in Figure 17.5
    (Program: **Cloud.c**). The program uses the wiringPi library for the GPIO. GPIO
    numbering is used in the program. The **libdht11.a** library function developed
    in Chapter 5 (see Figure 5.47 and Figure 5.48) is used to read temperature and
    humidity from the DHT11. Communication with ThingSpeak is by use of the HTTP protocol
    with TCP packets. Since we are using the HTTP protocol, you will have to free
    port 80 on your Raspberry Pi. This is done in Section 14.8 using the command to
    find the programs using port 80: **sudo netstat -tlnpu**, and then command **sudo
    killprogramID** to stop the programs using port 80.


    At the beginning of the program, the URL of the ThingSpeak service is defined.
    Port is assigned to 80, and the output pin of the DHT11 is assigned to 2 (i.e.
    GPIO 2 of the Raspberry Pi). The main program calls function **Send**. Complete
    processing is performed inside this function. Character arrays **msg** to **msg5**
    store the data to be sent to ThingSpeak. The complete data string is in the following
    format:


    ```

    GET /update?key=QAAHT5XIK3ZB8736&field1=Data1&field2=Data2

    HTTP/1.0\r\nHost: api.thingspeak.com\r\n\r\n

    ```


    Where **Data1** and **Data2** are the data fields **field1** and **field2** respectively
    (i.e. the temperature and humidity data respectively). In this program, temperature
    and humidity data is loaded in **msg2** and **msg4** respectively after it is
    read from the DHT11.


    The operation of function **Send** can be summarised in the following PDL:'
