- pgno: 261
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_261_0.png)


    Figure 10.3 Circuit diagram of the project


    Data is written to the DAC in 2 bytes. The lower byte specifies D0:D8 of the digital
    input data. The upper byte consists of the following bits:


    +   - **D8:D11**: bits D8:D11 of the digital input data

    +   - **SHDN**: 1: active (output available), 0: shutdown the device

    +   - **GA**: output gain control. 0: gain is 2x, 1: gain is 1x

    +   - **BUF**: 0: input unbuffered, 1: input buffered

    +   - **A/B**: 0: write to DACA, 1: Write to DACB (MCP4921 supports only DACA)


    In normal operation, we will send the upper byte (D8:D11) of the 12-bit (D0:D11)
    input data with bits D12 and D13 set to 1 so that the device is active. Gain is
    set to 1x. We then send the low byte (D0:D7) of data. This means that 0x30 should
    be added to the upper byte before sending it to the DAC.


    # Program listing:


    # wiringPi


    Figure 10.4 shows the program listing (program: squaredac.c). Since we are using
    a DAC with reference voltage set to +3.3V (3300mV), and 12-bit wide data (i.e.
    4096 steps), the required digital value to set the output voltage to 2V is given
    by ONvalue, where: ONvalue = 2000 x 4095 / 3300


    The OFF value of the signal (OFFvalue) is set to 0V. Function DAC configures the
    DAC so that 2V is output from it. First the HIGH byte (in buff[0]) is put into
    buffer buff, followed by the LOW byte (in buff[1]):


    ```

    buff[0] = (data >> 8) & 0x0F

    buff[0] = buff[0] + 0x30

    buff[1] = data & 0xFF

    wiringPiSPIDataRW(handle, buff, 2);

    ```'
