- pgno: 136
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_136_0.png)


    Figure 5.20 Block diagram of the project


    As shown in Figure 5.21, the LEDs are organised such that when they turn ON, they
    indicate the numbers as in a real dice. The operation of the project is as follows:
    Normally the LEDs are all OFF to indicate that the system is ready to generate
    a new dice number. Pressing the switch generates a random dice number between
    1 and 6 and displays on the LEDs for 3 seconds. After 3 seconds the LEDs turn
    OFF again.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_136_1.png)


    Figure 5.21 LED dice


    # Circuit diagram:


    The circuit diagram of the project is shown in Figure 5.22. 7 LEDs are connected
    to GPIO pins 9, 10, 22, 27, 17, 3 and 2 through 470 Ohm current limiting resistors.
    The connection is as follows:


    | LED | GPIO pin | wiringPi pin | Physical pin |

    |---|---|---|---|

    | D1 | 9 | 13 | 21 |

    | D2 | 10 | 12 | 19 |

    | D3 | 22 | 3 | 15 |

    | D4 | 27 | 2 | 13 |

    | D5 | 17 | 0 | 11 |

    | D6 | 3 | 9 | 5 |

    | D7 | 2 | 8 | 3 |


    The push-button switch is connected to GPIO pin 14 through a 10K pull-down resistor
    so the button output is at logic 0 and goes to logic 1 when the button is pressed.'
