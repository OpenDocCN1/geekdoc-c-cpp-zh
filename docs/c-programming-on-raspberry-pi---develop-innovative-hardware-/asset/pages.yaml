- pgno: 246
  md: 'The header file `<wiringPiSPI.h>` must be included at the beginning of the
    program. The wiringPi library supports the following SPI functions:


    +   - **wiringPiSPISetup**: This function initialises the SPI bus. The function
    has two arguments: the first is the SPI channel number, and the second is the
    SPI speed. Raspberry Pi 4 has two SPI channels: 0, and 1. The SPI speed is an
    integer in the range of 500,000 to 32,000,000 Hz. The function returns a handle
    that is used to reference the initialised SPI channel. A -1 is returned if the
    SPI channel cannot be initialized.

    +   - **wiringPiSPIDataRW**: This function performs simultaneous write/read transactions
    on the selected SPI bus. Data in the buffer is overwritten by data returned from
    the bus. The function has three arguments: the first is the channel number, the
    second is a pointer to the data. The third parameter is the length of data.


    The programming of the MCP23S17 chip is as follows (notice that not all SPI devices
    require device addresses):


    +   - Send device address (it is 0x40 in this project).

    +   - Send register address.

    +   - Send register data.


    First of all, we have to program the I/O direction register IODIRA to 0 so that
    PORT A pins are outputs. This register has address 0x0. We should then program
    bit 0 of PORT A (pin GPIOA) where the LED is connected. The address of register
    GPIOA is 0x12.


    Figure 8.8 shows the program listing (Program: **SPILED2.c**). At the beginning
    of the program, the device and register addresses are defined. **channel** is
    set to 0 since CS of MCP23S17 is connected to pin CE0 of the Raspberry Pi. Inside
    the main program, function **wiringPiSPISetup** is called to set the channel number
    and the speed on the SPI bus. This function returns a **handle** which is used
    in other SPI function calls.


    Two functions are used in the program: **configure** sets register IODIRA so PORT
    A pins are outputs. Function **send** sends a byte (0 or 1) to register GPIOA
    of MCP23S17 so the LED is turned ON or OFF as required. You can compile and run
    the program by entering the following commands:


    ```

    ```bash

    gcc -o SPILED SPILED2.c -lwiringPi

    sudo ./SPILED

    ```

    ```'
