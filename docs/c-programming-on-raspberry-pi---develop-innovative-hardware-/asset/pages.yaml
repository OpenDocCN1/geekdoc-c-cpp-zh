    # ### 8.3 • Project 1 – Port expander


    # #### Description:


    A simple project is given in this section to show how the SPI functions can be
    used in a program. This project is very similar to the port expander project 1,
    given in section 7.3. In this project, the I2C compatible chip MCP23017 was used.
    In this project, the SPI bus compatible port expander chip MCP23S17 is used to
    give additional 16 I/O ports to the Raspberry Pi. The operation of the MCP23S17
    is identical to the operation of MCP23017, except the MCP23S17 uses the SPI bus.
    In this project, an LED is connected to MCP23S17 port pin GPA0 and the LED is
    flashed ON and OFF every second. A 470 Ohm current limiting resistor is used in
    series with the LED.'
