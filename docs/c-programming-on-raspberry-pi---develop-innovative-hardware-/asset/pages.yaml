    ```\n\nFigure 7.25 Program I2CLCD.c\n\n# Creating an I2C LCD library\n\nThere\
    \ are many situations where we may want to use the I2C LCD in our projects. It\
    \ will be easier if we put all the LCD functions in a library and link this library\
    \ with our main program so that we don't have to include the LCD source code in\
    \ our program. Such an approach will make our programs very tidy and easy to follow.\n\
    \nThe steps to put the LCD functions in a library are given below:\n\n+   - Create\
    \ the main program (Program: **LCDmain.c**) which consists of a few lines of code\
    \ as shown in Figure 7.26. This program simply displays text on the LCD.\n+  \
    \ - Create a file that contains the LCD functions (File: **lcdfunc.c**) as shown\
    \ in Figure 7.27\n+   - Compile the functions program (this will create the compiled\
    \ file **lcdfunc.o**):\n+     ```bash\n+   gcc -c lcdfunc.c\n+     ```\n+   -\
    \ Create a library, e.g. with the name **liblcd** (this will create the library\
    \ file **liblcd.a**):\n+     ```bash\n+   ar -cvq liblcd.a lcdfunc.o\n+     ```\n\
    +   - Include header file **lcdinc.h** at the beginning of the main program **LCDmain.c**\
    \ program (Figure 7.28). Make sure that the **lcdinc.h** file is in your default\
    \ directory.\n+   - Compile and link the main program (this will create executable\
    \ file **LCDmain**):\n+     ```bash\n+   gcc -o LCDmain LCDmain.c -lwiringPi liblcd.a\n\
    +     ```"
