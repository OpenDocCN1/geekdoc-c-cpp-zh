    # ### Using the DHT11


    The DHT11 sensor chip operates through a single data pin. Data is extracted by
    applying accurate timing pulses to the chip. 5 bytes (40 bits) of data is received
    from the chip, 2 bytes of humidity data(1-byte integral, 1-byte decimal), 2 bytes
    of temperature data (1-byte integral, 1 byte decimal), 1-byte of checksum data.


    The procedure to extract temperature and humidity is as follows (MCU is the Raspberry
    Pi here):


    +   - After the chip is powered up, we should wait one second for the chip to
    settle down.

    +   - The MCU sets the data pin LOW for a minimum of 18 milliseconds.

    +   - The MCU sets the data pin HIGH and waits for 40 microseconds.

    +   - DHT11 lowers the data pin for 80 microseconds.

    +   - DHT11 sets the data pin HIGH for 80 microseconds (Figure 5.43).

    +   - Now, data transmission starts between the DHT11 and MCU.

    +   - LOW data is identified with 50 microseconds of LOW, followed by 26-28 microseconds
    of HIGH data

    +   - HIGH data is identified with 50 microseconds of LOW, followed by 70 microseconds
    of'
