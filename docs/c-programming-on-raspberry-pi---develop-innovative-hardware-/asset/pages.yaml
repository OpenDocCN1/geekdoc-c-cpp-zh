  md: '# Chapter 4 • Hardware Programming using C


    # 4.1 • Overview


    The main theme of this book is the development of projects using the C language
    on Raspberry Pi. Several C compilers can be used with the Raspberry Pi. In this
    chapter, we will briefly look at these compilers by developing a very simple project.
    In the remaining chapters of the book, the chosen compiler will be used to developing
    various hardware-based projects.


    # 4.2 • The general purpose input-output ports (GPIO)


    Before going into the details of C compilers and hardware interfaces, it is worthwhile
    looking at the Raspberry Pi 4 GPIO connector. This connector is a 40-pin dual-in-line
    2.54mm wide connector as shown in Figure 4.1. Other recent Raspberry Pi models
    have similar connectors with almost the same pin configurations.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_99_0.png)


    Figure 4.1 Raspberry Pi 4 GPIO connector


    When the GPIO connector is on the far side of the board, the pins at the bottom,
    starting from the left of the connector are numbered as 1, 3, 5, 7, and so on.
    The ones at the top are numbered as 2, 4, 6, 8, and so on.


    The GPIO provides 26 general purpose bi-directional I/O pins. Some of the pins
    have multiple functions. For example, pins 3 and 5 are the GPIO2 and GPIO3 input-output
    pins respectively. These pins can also be used as the I2C bus, I2C SDA, and I2C
    SCL pins'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'respectively. Similarly, pins 9,10,11,19 can be used as general-purpose input-output,
    or as SPI bus pins. Pins 8 and 10 are reserved for UART serial communication.


    Two power outputs are provided: +3.3V and +5.0V. The GPIO pins operate at +3.3V
    logic levels (not like many other computer circuits that operate with +5V). A
    pin can either be an input or an output. When configured as an output, the pin
    voltage is either 0V (logic 0) or +3.3V (logic 1). Raspberry Pi 4 is normally
    operated using an external power supply (e.g. a mains adapter) with +5V output
    and minimum 2A current capacity. A 3.3V output pin can supply up to 16mA of current.
    Total current drawn from all output pins should not exceed the 51mA limit. Care
    should be taken when connecting external devices to the GPIO pins as drawing excessive
    currents or short-circuiting a pin can easily damage your Pi. The amount of current
    that can be supplied by the 5V pin depends on many factors such as the current
    required by the Pi itself, current taken by the USB peripherals, camera current,
    HDMI port current, and so on.


    When configured as an input, a voltage above +1.7V will be taken as logic 1, and
    a voltage below +1.7V will be taken as logic 0. Care should be taken to not supply
    voltages greater than +3.3V to any I/O pin as large voltages can easily damage
    your Pi. For example, the output pin of an Arduino must not be connected directly
    to a Raspberry Pi input pin as it can easily damage input circuitry. Similarly,
    although connecting a Raspberry Pi output pin to an Arduino input pin is safe,
    the output voltage level of the Raspberry Pi may not be high enough to drive the
    Arduino input circuitry when it is at logic 1. In such circumstances, a voltage
    level converter circuit should be used to convert from either 5V to 3.3V logic
    levels, or from 3.3V to 5V. An example logic level converter circuit is shown
    in Figure 4.2.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_100_0.png)


    Figure 4.2 Voltage level converter circuit


    # 4.3 • Interfacing with GPIO


    # 4.3.1 • Loads requiring small currents


    Loads requiring small currents such as LEDs can be connected directly to the GPIO
    pins through current limiting resistors. LEDs are available in different sizes.
    Small LEDs draw a few milliamperes of current, while larger LEDs require about
    15mA to be bright. The voltage drop across an LED again depends on the type of
    LED used. In most cases, we can assume a voltage drop of around 2V. LEDs can be
    either connected in current source or current sink mode as described below.'
