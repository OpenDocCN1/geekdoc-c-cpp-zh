    # 7.5 • Project 3 – TMP102 temperature display


    **Description:**

    In this project, the I2C compatible TMP102 temperature sensor chip is used. Ambient
    temperature is read every second and then displayed on the PC screen.


    **Aim:**


    This project aims to show how the TMP102 temperature sensor chip can be used in
    a program.


    # The TMP102


    The TMP102 is a highly accurate I2C temperature sensor chip with a built-in thermostat.
    It has the following basic features:


    +   - Supply voltage: 1.4V to 3.6V

    +   - Supply current: 10µA

    +   - Accuracy: ±0.5ºC

    +   - Resolution: 12 bits (0.0625ºC)

    +   - Operating range: −40ºC to +125ºC


    The TMP102 is a 6-pin chip as shown in Figure 7.14. The pin descriptions are:


    | Pin | Name | Description |

    |---:|---|---|

    | 1 | SCL | I2C line |

    | 2 | GND | power supply ground |

    | 3 | ALERT | Over temperature alert, Open-drain output requires a pull-up resistor
    |

    | 4 | ADD0 | Address select |

    | 5 | V+ | power supply |

    | 6 | SDA | I2C line |'
