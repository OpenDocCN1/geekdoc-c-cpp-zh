- pgno: 199
  md: '# Chapter 7 • I2C Bus Interface


    # 7.1 • Overview


    The I2C (or I²C) bus is commonly used in microcontroller based projects. In this
    chapter, we will look at the use of this bus on Raspberry Pi. The aim is to make
    the reader familiar with I2C bus library functions and to show how they can be
    used in a real project. Before looking at the details of the project, it is worthwhile
    to look at the basic principles of the I2C bus.


    # 7.2 • The I2C Bus


    The I2C bus is one of the most frequently used microcontroller communication protocols
    for communicating with external devices such as sensors and actuators. The I2C
    bus is a single master, multiple slave bus, and can operate on standard mode:
    100 Kbit/s, full speed: 400 Kbit/s, fast mode: 1 Mbit/s, and high speed: 3.2 Mbit/s.
    The bus consists of two open-drain wires, pulled-up with resistors:


    +   - **SDA**: data line

    +   - **SCL**: clock line


    Figure 7.1 shows the structure of an I2C bus with one master and three slaves.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_199_0.png)


    Figure 7.1 I2C bus with one master and three slaves


    Because the I2C bus is based on just two wires, there should be a way to address
    an individual slave device on the same bus. For this reason, the protocol dictates
    that each slave device provides a unique slave address for the given bus. This
    address is usually 7-bits wide. When the bus is free, both lines are HIGH. All
    communication on the bus is initiated and completed by the master which initially
    sends a START bit, and completes a transaction by sending STOP bit. This alerts
    all slaves that data is coming on the bus. After the start bit, 7 bits of unique
    slave address is sent. Each slave device on the bus has an address and this ensures
    that only the addressed slave communicates on the bus at any time to avoid any
    collisions. The last sent bit is the read/write bit. If this bit is 0, the master
    wishes to write to the bus (e.g. to a register of a slave). If it is 1, the master
    wishes to read from the bus (e.g. from the register of a slave). The data is sent
    on the bus with the MSB bit first. An acknowledgment (ACK) bit takes place after
    every byte and this bit allows the'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'receiver to signal to the transmitter that the byte was received successfully,
    resulting in another byte being sent. ACK bit is sent at the 9th clock pulse.


    Communication over the I2C bus is as follows:


    +   - The master sends on the bus the address of the slave it wants to communicate
    with.

    +   - The LSB is the R/W bit which establishes the direction of data transmission,
    i.e. from master to slave (R/W = 0), or from slave to master (R/W = 1).

    +   - Required bytes are sent, each interleaved with an ACK bit until a stop condition
    occurs.


    Depending on the type of slave device used, some transactions may require a separate
    transaction. For example, the steps to read data from an I2C compatible memory
    device are:


    +   - Master starts the transaction in write mode (R/W = 0) by sending the slave
    address on the bus.

    +   - The memory location to be retrieved are then sent as two bytes (assuming
    64Kbit memory).

    +   - The master sends a STOP condition to end the transaction

    +   - The master starts a new transaction in read mode (R/W = 1) by sending the
    slave address on the bus

    +   - The master reads the data from the memory. If reading the memory in sequential
    format, more than one byte will be read.

    +   - The master sets a stop condition on the bus


    Before using any I2C device we have to enable I2C in our Raspberry Pi configuration.
    The steps are:


    +   - Start the configuration tool

    +   - Move down to **Interface Options** and press **Enter**

    +   - Select **I2C** and press **Enter** to enable it


    ```

    pi@raspberrypi:~ $ sudo raspi-config

    ```


    Before using the I2C pins of the Raspberry Pi, we have to make sure the I2C device
    connected to Raspberry Pi is recognized by the Raspberry Pi I2C bus. Build your
    circuit and enter the following command on the command line and ensure the I2C
    address of the connected device is displayed:


    ```

    pi@raspberrypi:~ $ sudo i2cdetect -y 1

    ```'
