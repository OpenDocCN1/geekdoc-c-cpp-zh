  md: '# ## Chapter 14 • Communication over Wi-Fi


    # ### 14.1 • Overview


    In the last chapter we learned how to use various practical functions of the pigpio
    library. In this chapter we will learn how to communicate over a Wi-Fi link using
    the UDP protocol.


    # ### 14.2 • UDP and TCP/IP


    Communication over a Wi-Fi link is in the form of client and server. Sockets are
    used to send and receive data packets. Server-side usually waits for a connection
    from the clients and once it is made, two-way communication can start. Two protocols
    are mainly used for sending and receiving data packets over a Wi-Fi link: UDP
    and TCP. TCP is a connection-based protocol that guarantees the delivery of packets.
    Packets are given sequence numbers and the receipt of all the packets is acknowledged
    to avoid them arriving in the wrong order. As a result of this confirmation, TCP
    is usually slow but is reliable as it guarantees the delivery of packets. UDP
    on the other hand is not connection-based. Packets do not have sequence numbers
    and as a result, there is no guarantee they will arrive at their destination.
    UDP has less overhead than TCP and as a result, is faster. Table 14.1 lists some
    of the differences between the TCP and UDP protocols.


    | TCP | UDP |

    |---|---|

    | Packets have sequence numbers and delivery of every packet is acknowledged |
    There is no delivery acknowledgment |

    | Slow | Fast |

    | No packet loss | Packets may be lost |

    | Large overhead | Small overhead |

    | Requires more resources | Requires fewer resources |

    | Connection based | Not connection based |

    | More difficult to program | Easier to program |

    | Examples: HTTP, HTTPS, FTP | Examples: DNS, DHCP, Computer games |


    Table 14.1 TCP and UDP packet communications


    # ### 14.3 • UDP communication


    Figure 14.1 shows the UDP communication over a Wi-Fi link:


    **Server**


    +   1. Create UDP socket.

    +   2. Bind the socket to the server address.

    +   3. Wait until the datagram packet arrives from the client.

    +   4. Process the datagram packet.'
