- pgno: 304
  md: "Figure 12.26 shows the program listing (program: **Sevensg.c**). The program\
    \ consists of the main program and a thread running concurrently. The thread is\
    \ named as **ThreadRefresh** and this refreshes the display. The thread is started\
    \ from the main program by calling the **piThreadCreate** function. Inside the\
    \ main program, variable **cnt** is incremented every second. When it reaches\
    \ 100, it resets to 0.\n\n**ThreadRefresh** displays the contents of variable\
    \ **Cnt** on the 7-segment 2-digit display. The bit pattern corresponding to each\
    \ digit (i.e. Table 9.2) is stored in an array called **data**. Initially, both\
    \ digits are disabled by setting both **E1** and **E2** to 0. The **MSD** digit\
    \ of the **Cnt** is extracted and **E2** is enabled if the count is greater than\
    \ 9 so this digit is displayed. If **cnt** is less than 10, the left digit is\
    \ blanked. After a delay of 10ms, the **LSD** digit is extracted and **E2** disabled.\
    \ **E1** is enabled so this digit is displayed. Each digit is displayed for 10\
    \ milliseconds so the eye sees the digits as if they are enabled at the same time.\n\
    \nFunction **Configure** configures the used GPIO pins as outputs and sets them\
    \ to 0. In this program, function **send** sends 7-bit data to the port which\
    \ is made up of the 7 GPIO port names stored in array **segs**.\n\n```\n```c\n\
    /*----------------------------------------------------------------------------\n\
    \                    2-DIGIT 7-SEGMENT COUNTER\n                    =======================\n\
    \nIn this project a 2-digit 7-segment display is connected to Raspberry\nPi. A\
    \ multithreading approach is used here where the display is\nrefreshed in a separate\
    \ thread. The program counts up every second\nfrom 0 to 99 and displays on the\
    \ 7-segment counter\n\nAuthor: Dogan Ibrahim\nFile  : Sevensg.c\nDate  : December\
    \ 2020\n----------------------------------------------------------------------------*/\n\
    #include <wiringPi.h>\n\n//\n// Define GPIO pins used for the display\n//\nint\
    \ segs[] = {21, 20, 16, 12, 7, 8, 25};\n\n//\n// Define 7-segment display bit\
    \ patterns\n//\nint data[] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07,\
    \ 0x7F, 0x6F};\n\n#define E1 23                      // Digit E1\n#define E2 24\
    \                      // Digit E2\n```\n```"
