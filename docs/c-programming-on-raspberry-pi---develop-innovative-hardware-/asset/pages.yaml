    # Program listing:


    # wiringPi


    The header file **<wiringSerial.h>** must be included at the beginning of the
    program. The library supports the following serial communication functions (see
    link: http://wiringpi.com/reference/serial-library/ ):


    **serialOpen:** This function opens and initialises the serial port. The baud
    rate and device must be specified in the arguments. The read timeout is set to
    10 seconds by default. The function returns a file descriptor handle.


    **serialClose:** This function closes an open serial port. The file descriptor
    handle must be specified as an argument to the function


    **serialPutchar:** This function sends the single-byte passed as the second argument.
    The first argument is the file descriptor handle.


    **serialPuts:** This function sends a NULL-terminated string to the serial device.
    The first argument is the file descriptor handle. The second argument is a pointer
    to the string.


    **serialPrintf:** This function is similar to printf. The first argument is the
    file descriptor handle, while other arguments are as in the printf function


    **serialDataAvail:** This function returns the number of characters available
    in the receive buffer. The file descriptor handle is the only argument of this
    function'
