  md: '# Block diagram:


    Figure 14.2 shows the block diagram of the project. The Raspberry Pi and Android
    smartphone communicate over a Wi-Fi router link.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_326_0.png)


