- pgno: 23
  md: "# Chapter 2 • Raspberry Pi Program Development\n\n# 2.1 • Overview\n\nIn the\
    \ last chapter, we learned how to install Raspbian Buster on a Raspberry Pi SD\
    \ card. In this chapter, we will learn how to develop programs using Raspberry\
    \ Pi 4. We will develop a very simple example project and learn how to use Python\
    \ and C. Although Python is not the topic of this book, it will be used in a simple\
    \ project so that readers can compare Python with C programming.\n\n# 2.2 • The\
    \ nano text editor\n\nA text editor is a very useful tool for creating program\
    \ source files. Raspberry Pi supports several text editors including vi, nano,\
    \ etc. In this section, we will introduce nano which is normally run from the\
    \ command line.\n\nAs an example, suppose we wish to create a text file called\
    \ myfile.txt and insert the following lines into the file:\n\nThis is a simple\
    \ text file created using nano\nThis is the second line of the file\nThis is the\
    \ third line of the file\n\nThe steps are as follows:\n\n+   - Start nano\n+ \
    \  \n+     `pi@raspberrypi:~ $ nano myfile.txt`\n+   \n+   - Enter the above text\
    \ into the file (see Figure 2.1). You should see several control codes at the\
    \ bottom of the screen.\n\n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_23_0.png)\n\
    \nFigure 2.1 Text entered into the editor"
  merge: -1
  img_proc: true
- pgno: 24
  md: "+   - Enter **Ctrl+X** followed by the letter **Y** to save the file. You should\
    \ now see the file listed in your directory if you enter the command:\n\n```\n\
    \    pi@raspberrypi:~$ ls myfile.txt\n    myfile.txt\n    pi@raspberrypi:~$\n\
    ```\n\n+   - Let us now edit the file we just created to learn some of the editor\
    \ commands. Restart **nano** as above by specifying the filename.\n\n+   - Let\
    \ us search for text starting with the word **simple**: press **Ctrl+W** and type\
    \ **simple** and press **Enter** (see Figure 2.2). You should see the cursor moving\
    \ to the start of the word **simple**. Delete **simple** and change it to **difficult**.\n\
    \n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_24_0.png)\n\n+   - Let us replace the\
    \ word **third** with **fourth**: press Ctrl+\\ and type **third**, and then **fourth**\
    \ when **Replace with:** is displayed. Press **Enter**. The message **Replace\
    \ this instance?** will be displayed. Type **Y**. You should see that the word\
    \ **third** is replaced with **fourth**.\n\n+   - Let us delete the second line\
    \ of text: Move the cursor to the second line and enter **Ctrl+K**. You should\
    \ see all the text on the second line is deleted.\n\n+   - To recall the line\
    \ just deleted, enter **Ctrl+U**.\n\n+   - To get help on using **nano**, enter\
    \ **Ctrl+G**. An example help screen is shown in Figure 2.3. Enter **Ctrl+N**\
    \ to display the next page, and **Ctrl+P** to display the previous page. Enter\
    \ **Ctrl+X** to close the help screen.\n\n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_24_1.png)\n\
    \n+   - Enter **Ctrl+X** followed by **Y** to save and exit the editor.\n\n+ \
    \  - The contents of the edited file are shown in Figure 2.4."
  merge: -1
