  md: '# 7.3 ● Project 1 – Port expander


    # Description:


    A simple project is given in this section to show how I2C functions can be used
    in a program. In this project, the I2C bus compatible Port Expander chip (MCP23017)
    is used to give an additional 16 I/O ports to the Raspberry Pi. This is useful
    in some applications where a large number of I/O ports are required. In this project,
    an LED is connected to MCP23017 port GPA0 (pin 21) and the LED is flashed ON and
    OFF every second so the operation of the program can be validated. A 470 Ohm current
    limiting resistor is used in series with the LED.


    # Aim:


    This project aims to show how the I2C bus can be used in Raspberry Pi projects.


    # Block diagram:


    The block diagram of the project is shown in Figure 7.2.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_201_0.png)


    # The MCP23017


    The MCP23017 is a 28-pin chip with the following features. Pin configuration is
    shown in Figure 7.3:


    +   - 16 bi-directional I/O ports.

    +   - Up to 1.7MHz operation on the I2C bus.

    +   - Interrupt capability.

    +   - External reset input.

    +   - Low standby current.

    +   - +1.8 to +5.5V operation.

    +   - 3 address pins so that up to 8 devices can be used on the I2C bus.

    +   - 28-pin DIL package.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_202_0.png)


    Figure 7.3 Pin configuration of the MCP23017


    Pin descriptions are given in Table 7.1.


    | Pin | Description |

    |---|---|

    | GPA0–GPA7 | Port A pins |

    | GPB0–GPB7 | Port B pins |

    | VDD | Power supply |

    | VSS | Ground |

    | SDA | I2C data pin |

    | SCL | I2C clock pin |

