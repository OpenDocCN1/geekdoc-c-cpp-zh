  md: '**pwmSetMode**: This function sets the PWM mode as either balanced or as mark/space.
    The mode must be passed as an argument to the function. Valid values are PWM_MODE_BAL
    and PWM_MODE_MS.


    **pwmSetRange**: This function sets the range register in the PWM generator (default
    value is 1024). The range must be passed as an argument to the function.


    **pwmSetClock (int divisor)**: This function sets the divisor value for the PWM
    clock. It must be passed as an argument to the function.


    # 12.12 • GPIO utility


    The GPIO utility is a command-line utility that can be used to test the GPIO pins.
    In addition to testing the GPIO pins, this utility has many other useful applications
    (for full details, see: https://projects.drogon.net/raspberry-pi/wiringpi/the-gpio-utility/).


    Some examples of using the GPIO utility from the command-line are given below.


    To configure a port pin as an output:


    ```

    pi@raspberrypi:~ $ gpio -g mode pin out

    ```


    where option -g causes the pin to be recognised as BCM_GPIO numbering, rather
    than wiringPi pin numbering. For example, to set pin GPIO 2 (physical pin number
    3) as an output input the command:


    ```

    pi@raspberrypi:~ $ gpio -g mode 2 out

    ```


    Other mode options are: in, pwm, up, down, tri


    To set GPIO 2 to logic 1:


    ```

    pi@raspberrypi:~ $ gpio -g write 2 1

    ```


    To set GPIO 2 to logic 0:


    ```

    pi@raspberrypi:~ $ gpio -g write 2 0

    ```


    To read and display the state of GPIO 2:


    ```

    pi@raspberrypi:~ $ gpio -g read 2

    ```


    To read the state of all pins and display them as a table (see Figure 12.27):


    ```

    pi@raspberrypi:~ $ gpio readall

    ```'
