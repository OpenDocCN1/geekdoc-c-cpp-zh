    \ array called **Numbers** is created to store the port numbers (in wiringPi format)\
    \ that must be turned ON to display a given number. Here, each row is terminated\
    \ with 99 and the first row is not used since its index is 0, but dice numbers\
    \ are between 1 and 6.\n\n```\n```c\nint Numbers[][7] = {\n        {0,99},   \
    \                      // Dummy\n        {2,99},                         // Display\
