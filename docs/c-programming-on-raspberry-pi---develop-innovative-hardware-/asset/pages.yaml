    In this project, we are assuming that Bluetooth is enabled on your Raspberry Pi
    and is already paired with your Android mobile phone. Before developing your program,
    you will need to install the Bluetooth library on your Raspberry Pi. This can
    be done by entering the following command on your Raspberry Pi while in command
    mode:


    ```

    ```bash

    pi@raspberrypi:~ $ sudo apt-get install bluetooth libbluetooth-dev

    pi@raspberrypi:~ $ sudo python3 -m pip install pybluez

