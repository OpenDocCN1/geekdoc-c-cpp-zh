- pgno: 10
  md: '# Chapter 1 • Installing the Operating System on Raspberry Pi


    # 1.1 • Overview


    In this chapter, we will learn how to install the latest operating system (Raspbian
    Buster) on the Raspberry Pi 4. We will also learn the different ways that Python
    can be used to develop applications. Notice the installation process given below
    applies to all Raspberry Pi models unless otherwise specified.


    # 1.2 • Raspbian Buster installation steps on Raspberry Pi 4


    Raspbian Buster is the latest operating system for the Raspberry Pi. This section
    provides the steps necessary for installing this operating system on a new blank
    SD card, ready to use with Raspberry Pi 4. You will need a micro SD card with
    a capacity of at least 8GB (16 GB is preferable) before installing the new operating
    system.


    The steps to install the Raspbian Buster operating system are as follows:


    +   - Download the Buster image to a folder on your PC (e.g. C:\RPIBuster) from
    the following link by clicking the Download ZIP under section Raspbian Buster
    with desktop and recommended software (see Figure 1.1). At the time of writing
    this book, the file was called: 2020-02-13-raspbian-buster-full.img. You may have
    to use the Windows 7Zip software to unzip the download due to some features not
    being supported by older zip software.


    https://www.raspberrypi.org/downloads/raspbian/


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_10_0.png)


    Figure 1.1 Raspbian Buster download page'
  merge: -1
  img_proc: true
- pgno: 11
  md: "+   - Put the blank micro SD card into the card slot of your computer. You\
    \ may need an adapter to do this.\n+   - Download Etcher to your PC to flash the\
    \ disk image. The link is (see Figure 1.2):\n+   \n+   https://www.balena.io/etcher/\n\
    \n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_11_0.png)\n\nFigure 1.2 Download Etcher\n\
    \n+   - Double click to open Etcher and then click **Select image**. Select the\
    \ Raspbian Buster file you downloaded and unzipped.\n+   - Click **Select target**\
    \ and select the micro SD card.\n+   - Click **Flash** (see Figure 1.3). This\
    \ may take several minutes, wait until it is finished. The program will then validate\
    \ and unmount the micro SD card. You can remove your micro SD card after it is\
    \ unmounted.\n\n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_11_1.png)\n\nFigure 1.3\
    \ Click 'Flash' to flash the disk image"
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Your micro SD card now has been loaded with the Raspberry Pi operating system.
    The various options now are as follows:


    # Using direct connection


    If you are making a direct connection to your Raspberry Pi using a monitor and
    keyboard, just insert the SD card into the card slot and power-up your Raspberry
    Pi. After a short while, you will be prompted to enter the login details. The
    default values are username: pi, password: raspberry.


    You can now start using your Raspberry Pi either in command mode or in desktop
    mode. If you are in command mode, enter the following command to start the GUI
    mode:


    ```

    pi@raspberrypi:~ $ startx

    ```


    If you want to boot in GUI mode by default, the steps are:


    +   - Start the configuration tool:

    +     `pi@raspberrypi:~ $ sudo raspi-config`

    +   - Move down to Boot Options and press Enter to select (Figure 1.4).


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_12_0.png)


    +   - Select Desktop / CLI and then select Desktop Autologin to boot automatically
    into GUI mode.

    +   - Click OK and accept to reboot the system. The system will be in GUI mode
    next time it reboots.

    +   - You can change your selections to boot in command mode if you wish by selecting
    Console in Boot Options.


    You may now want to connect your Raspberry Pi to the internet either to access
    it remotely from a PC or to use the internet. If your Raspberry Pi is equipped
    with an ethernet port (e.g. Raspberry Pi 2/3/4), you can directly connect to your
    Wi-Fi router using an ethernet cable. You may find the IP address of your connection
    by entering the command: ifconfig in command mode.


    Alternatively, you may want to configure your Raspberry Pi to Wi-Fi and access
    it remotely.'
  merge: -1
  img_proc: true
- pgno: 13
  md: "You will need to enable SSH. The steps are as follows:\n\n+   - Start the configuration\
    \ tool:\n\n```\n```\npi@raspberrypi:~$ sudo raspi-config\n```\n```\n\n+   - Move\
    \ down to **Interface Options** and select **SSH** and enable it.\n+   - If you\
    \ are in GUI mode, click the Wi-Fi icon at the top right hand of the screen and\
    \ enable Wi-Fi. Note the IP address allocated automatically to your Raspberry\
    \ Pi.\n+   - You can now remotely access your Raspberry Pi using terminal emulation\
    \ software, such as **Putty** (see Section 1.4 and 1.5).\n\n# ### 1.3 • Using\
    \ networked connection\n\nIf you do not have a suitable monitor and keyboard to\
    \ directly connect to your Raspberry Pi, you will have to use a networked connection\
    \ and remotely access your Raspberry Pi using a PC. There are two options: **connection\
    \ using an Ethernet cable**, and **connection over Wi-Fi**.\n\n**Connection using\
    \ an Ethernet cable:** The steps are as follows:\n\n+   - Install **Notepad++**\
    \ on your PC from the following web site:\n+   \n+       https://notepad-plus-plus.org/downloads/v7.8.5/\n\
    +   \n+   - Insert the SD card back to your PC and start **Notepad++**.\n+   -\
    \ Click **Edit -> EOL Conversion -> UNIX/OSX Format**.\n+   - Create a new empty\
    \ file with the **Notepad++** and save it to the boot folder of the SD card with\
    \ the name **ssh** (without any extension), where this file will enable SSH to\
    \ be used to remotely access your Raspberry Pi. In Windows, this is the only folder\
    \ you will see which contains items including loader.bin, start.elf, kernel.img,\
    \ etc.\n+   - Insert the SD card back into your Raspberry Pi.\n+   - Connect your\
    \ Raspberry Pi to one of the ports of your Wi-Fi router through an Ethernet cable\
    \ and power it up.\n+   - Find out the IP address allocated to your Raspberry\
    \ Pi by accessing your Wi-Fi router. Alternatively, install **Advanced IP Scanner**\
    \ on your PC, which is available at the following link:\n+   \n+       https://www.advanced-ip-scanner.com\n\
    +   \n+   - Run the software and look for your Raspberry Pi. You do not have to\
    \ install the software to run it. Click **Run portable version**, and then **Scan**.\
    \ As shown in Figure 1.5, the IP address of the author’s Raspberry Pi was 191.168.1.202.\n\
    \n![](img/7ba4e9a445f8a2ad48358a7aed37b32e_13_0.png)"
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   - You can now use Putty to log in to your Raspberry Pi (see Section 1.4
    and 1.5)


    Alternatively, you can find the IP address of your Raspberry Pi by opening the
    command prompt on your PC with administrator privilege (by right-clicking to accepting
    to run as an administrator) and then inputting the command: `ping raspberrypi.home`
    as shown in Figure 1.6.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_14_0.png)


    It is also possible to find the IP address of your Raspberry Pi using your smartphone.
    Many apps can be used to find out who is currently using your Wi-Fi router. e.g.
    **Who''s On My Wi-Fi – Network Scanner** by Magdalm.


    **Connection using Wi-Fi:** This is the preferred method to access your Raspberry
    Pi and is the one used by the author. Here, as described in Chapter 1, the Raspberry
    Pi can be placed anywhere you like within the range of the Wi-Fi router and is
    easily accessed from your PC using Putty (see Section 1.4 and 1.5).


    The steps are:


    +   - Install **Notepad++** on your PC from the following web site:

    +     https://notepad-plus-plus.org/downloads/v7.8.5/

    +   - Insert the SD card back to your PC and start **Notepad++**.

    +   - Click **Edit -> EOL Conversion -> UNIX/OS X Format**

    +   - Create a new empty file with **Notepad++** and save it to the boot folder
    of the SD card with the name `ssh`(without any extension), where this file will
    enable SSH to be used to remotely access your Raspberry Pi. In Windows, this is
    the only folder you will see which contains items like loader.bin, start.elf,
    kernel.img, etc.

    +   - Enter the following statements into a blank file (replace the **MySSID**
    and **MyPassword** with the details of your own Wi-Fi router):'
  merge: -1
  img_proc: true
- pgno: 15
  md: "```\ncountry=GB\nupdate_config=1\nctrl_interface=/var/run/wpa_supplicant\n\n\
    network={\n    scan_ssid=1\n    ssid=\"MySSID\"\n    psk=\"MyPassword\"\n}\n```\n\
    \n+   - Copy the file (save) to the boot folder on your SD card with the name:\
    \ **wpa_supplicant.conf**.\n+   - Insert the SD card back into your Raspberry\
    \ Pi and power-up the device.\n+   - Use **Advanced Ip Scanner** or one of the\
    \ methods described earlier to find out the IP address of your Raspberry Pi.\n\
    +   - Log in to your Raspberry Pi remotely using **Putty** on your PC (see Section\
    \ 1.3 and 1.4).\n+   - After logging in, you are advised to change your password\
    \ for security reasons. You should also run **sudoraspi-config** from the command\
    \ line to enable VNC, I2C, and SPI as they are useful interface tools that can\
    \ be used in your future GPIO based work.\n\n# ### 1.4 • Remote access\n\nIt is\
    \ much easier to remotely access the Raspberry Pi over the internet: for example\
    \ using a PC rather than connecting a keyboard, mouse, and display to it. Before\
    \ being able to remotely access the Raspberry Pi, we have to enable SSH by entering\
    \ the following command in a terminal session (if you have followed the steps\
    \ given earlier, SSH is already enabled and you can skip the following command):\n\
    \n```\npi@raspberrypi:~$  sudo raspi-config\n```\n\nGo to the configuration menu\
    \ and select **Interface Options**. Go down to **P2 SSH** and enable SSH. Click\
    \ **<Finish>** to exit the menu.\n\nYou should also enable VNC so the Raspberry\
    \ Pi Desktop can be accessed graphically over the internet. This can be done by\
    \ entering the following command in a terminal session:\n\n```\npi@raspberrypi:~$\
    \  sudo raspi-config\n```\n\nGo to the configuration menu and select **Interface\
    \ Options**. Go down to **P3 VNC** and enable VNC. Click **<Finish>** to exit\
    \ the menu. At this stage you may want to shut down or restart your Raspberry\
    \ Pi by entering one of the following commands in command mode:\n\n```\npi@raspberrypi:~$\
    \  sudo shutdown now\n```\n\nor\n\n```\npi@raspberrypi:~$  sudo reboot\n```"
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 1.5 • Using Putty


    Putty is a communications program used to create a connection between your PC
    and Raspberry Pi. This connection uses a secure protocol called SSH (Secure Shell).
    Putty doesn’t need to be installed and can be stored in any folder of your choice
    and run from there.


    Putty can be downloaded from the following web site:


    [https://www.putty.org/](https://www.putty.org/)


    Simply double click to run it and the Putty startup screen will be displayed.
    Click **SSH** and enter the Raspberry Pi IP address, then click **Open** (see
    Figure 1.7). The message shown in Figure 1.8 will be displayed the first time
    you access the Raspberry Pi. Click **Yes** to accept this security alert.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/7ba4e9a445f8a2ad48358a7aed37b32e_17_0.png)


    Figure 1.8 Click Yes to accept


    You will be prompted to enter the username and password. Notice the default username
    and password are:


    username: pi

    password: raspberry


    You now have a terminal connection with the Raspberry Pi and can type in commands,
    including the sudo privileged administrative commands.


    To change your password, enter the following command:


    ```

    passwd

    ```


    You can use the cursor keys to scroll up and down through the commands you’ve
    previously entered in the same session. You can also run programs although not
    graphical programs.


    # 1.5.1 ● Configuring Putty


    By default, the Putty screen background is black with white foreground characters.
    The author prefers to have white background with black foreground characters,
    with the character size set to 12 points bold. The steps to configure the Putty
    with these settings are given below. Notice that in this example these settings
    are saved with the name RPI4 so that they can be recalled whenever the Putty is
    restarted:


    +   - Restart Putty.

    +   - Select SSH and enter the Raspberry Pi IP address.

    +   - Click Colours under Window.

    +   - Set the Default Foreground and Default Bold Foreground colours to black
    (Red:0,'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Green:0, Blue:0).


    +   - Set the **Default Background** and **Default Bold Background** to white
    (Red:255, Green:255, Blue:255).

    +   - Set the **Cursor Text** and **Cursor Colour** to black (Red:0, Green:0,
    Blue:0).

    +   - Select **Appearance** under **Window** and click **Change** in **Font settings**.
    Set the font to **Bold 11**.

    +   - Select **Session** and give a name to the session (e.g. RPI4) and click
    **Save**.

    +   - Click **Open** to open the Putty session with the saved configuration.

    +   - Next time you re-start the Putty, select the saved session and click **Load**
    followed by **Open** to start a session with the saved configuration.


    # 1.6 ● Remote access of the Desktop


    You can control your Raspberry Pi via Putty, and run programs on it from your
    Windows PC. This however will not work with graphical programs because Windows
    doesn''t know how to represent the display. As a result of this, for example,
    we cannot run any graphical programs in the Desktop mode. We can get round this
    problem using some extra software. Two popular software used for this purpose
    are: VNC (Virtual Network Connection), and Xming. Here, we shall be learning how
    to use the VNC.


    # Installing and using VNC


    VNC consists of two parts: VNC Server and the VNC Viewer. VNC Server runs on the
    Raspberry Pi, and the VNC Viewer runs on the PC. VNC server is already installed
    on your Raspberry Pi and is enabled as described in Section 1.3 using raspi-config.


    The steps to install and use VNC Viewer on your PC are given below:


    +   - There are many VNC Viewers available, but the recommended one is TightVNC
    which can be downloaded from the following web site:

    +     https://www.tightvnc.com/download.php

    +   - Download and install **TightVNC** for your PC. You will have to choose a
    password during the installation.

    +   - Enter the following command:

    +     ```

    +     pi@raspberrypi:~ $ vncserver :1

    +     ```

    +   - Start **TightVNC Viewer** on your PC and enter the Raspberry Pi IP address
    (see Figure 1.9) followed by :1. Click **Connect** to connect to your Raspberry
    Pi.'
  merge: -1
  img_proc: true
