- pgno: 343
  md: 'When the link is accepted by the web browser, the Html page is sent to the
    browser which is displayed as shown in Figure 14.17. When a button is clicked
    on the client, a command is sent to the Raspberry Pi in addition to some other
    data. Here, we are only interested in the actual command sent. The following commands
    are sent to the Raspberry Pi for each button pressed:


    | Button pressed | Command sent to web server |

    |---|---|

    | LED0 ON | /?LED0=ON |

    | LED0 OFF | /?LED0=OFF |

    | LED1 ON | /?LED1=ON |

    | LED1 OFF | /?LED1=OFF |


    The received data is stored in a character array called buffer which is appended
    with a NULL character to make it a string. The program searches the received command
    to see if any of the above commands are present in the received data. The following
    code is used to search the received data and activate an LED:


    ```

    if(strstr(buffer,"LED0=ON"))digitalWrite(LED0, HIGH);

    if(strstr(buffer,"LED0=OFF"))digitalWrite(LED0, LOW);

    if(strstr(buffer,"LED1=ON"))digitalWrite(LED1, HIGH);

    if(strstr(buffer,"LED1=OFF"))digitalWrite(LED1, LOW);

    ```


    If for example, the user clicks on LED0 ON, string LED0=ON will be detected in
    the data and LED0 will be turned ON.


    In this project, the IP address of the Raspberry Pi was 192.168.1.202. The procedure
    to test the system is as follows:


    +   - Compile and run the program on the Raspberry Pi:


    ```

    gcc -o WEB WEBSERVER.c -lwiringPi

    sudo ./WEB

    ```


    +   - Open your web browser and enter the address 192.168.1.202.

    +   - The form shown in Figure 14.17 will be displayed on your screen.

    +   - Click a button, e.g. LED0 ON.


    The program was tested using the following web browsers:


    +   - Google Chrome

    +   - Internet Explorer

    +   - Microsoft Edge


    Figures 14.19 and 14.20 show the commands sent to the webserver when the LED0
    ON'
