    Figure 12.24 Block diagram of the project


    # Circuit Diagram:


    The circuit diagram of the project is shown in Figure 12.25. In this project,
    the following pins of the Raspberry Pi are used to interface with the 7-segment
    display:


    | 7-segment display pin | Raspberry Pi port pin |

    |---|---|

    | a | GPIO 21 |

    | b | GPIO 20 |

    | c | GPIO 16 |

    | d | GPIO 12 |

    | e | GPIO 7 |

    | f | GPIO 8 |

    | g | GPIO 25 |

    | E1 | GPIO 23 (via transistor) |

    | E2 | GPIO 24 (via transistor) |


    7-segment display segments are driven from the port pins through 470 Ohm current
    limiting resistors. Digit enable pins E1 and E2 are driven from port pins GPIO
    22 and 24 respectively through two BC108 type NPN transistors (any other NPN transistor
    can be used here), used as switches. The collectors of these transistors drive
    the segment digits. The segments are enabled when the base of the corresponding
    transistor is set to logic 1. Notice the following pins of the display are connected
