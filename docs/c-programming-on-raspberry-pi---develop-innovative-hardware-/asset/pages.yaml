- pgno: 356
  md: '# Chapter 16 • Automatically Running Programs on Startup


    # 16.1 • Overview


    Many applications may require the automatic commencing of a program as soon as
    the Raspberry Pi starts up. This can be achieved using several techniques. Perhaps
    the easiest method is to use file /etc/rc.local. The program called MyProg.c is
    compiled into MyProg and is required to commence automatically just after a system
    startup:


    +   - Edit /etc/rc.local as a superuser using nano.

    +   - Go to the end of the file and enter the following statements before exit
    0. The & character at the end of the command runs the program as a background
    process. This is required if the program is in a loop, otherwise, the startup
    will never complete:

    +   - Save and exit nano by entering Ctrl+X followed by Y.

    +   - Restart your Raspberry Pi.

    +   - The program will run automatically after the startup.


    ```

    pi@raspberrypi:~ $ sudo nano /etc/rc.local

    ```


    ```

    sudo /home/pi/./MyProg&

    ```


    Do not forget to edit the file /etc/rc.local and remove the statement to start
    the program if it is not required anymore.


    # 16.2 • Scheduling a program to run at specified times


    There are many applications where we may want to run programs automatically at
    regular intervals. These include backup operations, time synchronisation, and
    running a process in the future.


    Running tasks at regular intervals is managed by the crontab command. This consists
    of a set of tables (crontab tables) and crondeamon. The deamon is started by the
    init process at system startup. It wakes up every minute and checks the crontab
    tables to determine if there are any tasks scheduled to run.


    To create a crontab table, use the crontab command with the -e option. This opens
    the vi editor (unless another editor is specified in the environment variable).
    Each crontab contains 6 fields. The values in the fields can have fixed, a range,
    or a list of values separated by commas:


    +   - Minute (0 - 59).

    +   - Hour (0 - 23).

    +   - Day of the month (1 - 31).

    +   - Month of the year (1 - 12. It can also be specified as Jan, Feb, Mar, and
    so on).'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   - Day of the week (0 – 6, where 0=Sunday, it can also be Mon, Tue, Wed,
    etc).

    +   - String (command) to be executed.


    A `*` character in the digit position means every. Ranges of numbers are specified
    by separating them with a hyphen and the specified range is inclusive. For example,
    `9-12` for an Hour entry specifies execution at hours 9, 10, 11, and 12.


    Skips of numbers in ranges can be specified by adding character `/` after the
    range. For example, `0-12/2` in the Hours field specifies execution every other
    hour i.e. at hours 0, 2, 4, 6, 8, 10.


    By using a combination of `*` and `/`, we can specify steps. For example, `*/2`
    in the Hours field specifies every two hours.


    Instead of the first five fields, we can specify special strings as follows:


    | String | Meaning |

    |---|---|

    | `@reboot` | run once at startup |

    | `@yearly` | run once every year (`"0 0 1 1 *"`) |

    | `@monthly` | run once every month (`"0 0 1 * *"`) |

    | `@weekly` | run once a week (`"0 0 * * 0"`) |

    | `@daily` | run once a day (`"0 0 * * *"`) |

    | `@hourly` | run once an hour (`"0 * * * *"`) |


    Multiple commands can be entered on a line and such commands must be separated
    with `&&` characters.


    Some examples of crontab lines are given below:


    ```

    ```text

    1. 30,50 22-23 * 6 fri-sat/home/pi/mycron.sh

    ```

    ```


    Run on the 30th and 50th minutes, for hours between 10 p.m. and midnight on Fridays
    and Saturdays during June.


    ```

    ```text

    2. @daily <command1>&&<command2>

    ```

    ```


    Run command 1 and command 2 daily.


    ```

    ```text

    3. 30 0 * * /home/pi/mycron.sh

    ```

    ```


    Run at 12:30 daily.


    ```

    ```text

    4. 0 4 12 * * /home/pi/mycrob.sh

    ```

    ```


    Run at 4 a.m. on the 12th of every month.


    ```

    ```text

    5. ****** /home/pi/mycron.sh

    ```

    ```


    Run every minute.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '+   6. `0 4 15-21 * 1 /home/pi/mycron.sh`


    Run every month at 4 a.m. on Mondays, and the days between 15–21. Notice the day
    of the month and week are used with no restrictions (no *) and therefore this
    is an "or" condition - both will be executed.


    +   7. `0 11,16+ * * /home/pi/mycron.sh`


    Run every day at 11:00 and 16:00 hours


    +   8. `0 11-14 * * /home/pi/mycron.sh`


    Run every day during the hours 11 a.m. - 2 p.m. (i.e. 11 a.m., 12 a.m., 1 p.m.,
    2 p.m.)


    +   9. `*/10 **** /home/pi/mycron.sh`


    Run every 10 minutes


    +   10. `@yearly /home/pi/mycron.sh`


    Run on the first minute of every year


    By default, crontab sends the job to the user who scheduled the job. If you don’t
    want any mail to be sent, you should specify the following line in the crontab:


    ```

    ```

    MAIL=""

    ```

    ```


    Any outputs in a scheduled process are usually logged in files. For example, to
    run **mycron.sh** daily and send the output to **daily.txt**, enter the following
    command:


    ```

    ```

    @daily /home/pi/mycron.sh > daily.txt

    ```

    ```


    Instead of editing the crontab file directly, you can also add the entries to
    a cron-file first and then install them to cron using the crontab command and
    specify the filename. An example is given below:


    ```

    ```

    pi@raspberrypi:~ $ crontab /home/pi/mycron.sh

    ```

    ```


    This will install **mycron.sh** to our crontab, which will also remove any old
    cron entries. The created crontab is stored in directory **/etc/spool/cron/&lt;user&gt;**


    In all the examples above, we specified the absolute path of the script file that
    should be executed. We can specify this path in the PATH environment variable
    in the crontab and enter the filename. An example is given below where the absolute
    path to the file is **/home/pi/mycron.sh**.


    ```

    ```

    PATH=/home/pi

    @daily mycron.sh

    ```

    ```'
  merge: -1
  img_proc: true
