    # 3.2.15 ● File processing


    File processing functions enable us to write and read data on a Raspberry Pi SD
    card. By default, data is written and read from the default user folder which
    is: /home/pi.


    The following functions are available for file processing:


    | Function | Description |

    |---|---|

    | fopen | open a file for reading/writing (a file must be opened before accessing
    it) |

    | fprintf | print data to a file |

    | fgets | read data from a file |

    | fscanf | read data from a file |

    | fputs | write data to a file |

    | fclose | close a file (an open file must always be closed when finished working
    with it) |


    Files can be opened in one of the following modes:


    +   - r Opens a file in read mode and sets pointer to the first character in the
    file. It returns NULL if a file does not exist.

    +   - w Opens a file in write mode. It returns NULL if a file could not be opened.
    If the file does not exist then a new file is created. If a file exists, data
    is overwritten.

    +   - a Opens a file in append mode. If the file does not exist then a new file
    is created. It returns NULL if a file couldn''t be opened.

    +   - r+ Opens a file for read and write mode and sets pointer to the first character
    in the file. This mode is also called the update mode

    +   - w+ opens a file for read and write mode and sets pointer to the first character
    in the file. If a file does not exist then a new one is created

    +   - a+ Opens a file for read and write mode and sets pointer to the end of the
    file for appending. A new file is created if it does not exist. Data can be appended
    to the end of the file, but the existing data cannot be modified.

    +   - wb Opens the file in binary write mode


    It is always good programming practice to check whether a file can be opened before
    reading or writing to it. Some file processing examples are given below. Also,
    a file must always be closed when we finish working on it.'
