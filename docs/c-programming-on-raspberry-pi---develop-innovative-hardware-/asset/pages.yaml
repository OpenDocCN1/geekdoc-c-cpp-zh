    \n#include <stdio.h>\n\nint main(void)\n{\n    float no1, no2, result;\n    char\
    \ oper;\n\n    printf(\"Enter first number, operation, and second number: \");\n\
    \    scanf(\"%f%c%f\", &no1,&oper,&no2);\n\n    switch(oper)\n    {\n        case\
