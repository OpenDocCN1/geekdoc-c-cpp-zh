    # **pigpio**


    pigpio provides the following functions for serial communication:


    **serOpen:** This function opens the serial port (first argument) and specifies
    Baud rate (second argument). The third argument must be set to 0. A handle is
    returned by the function. Valid Baud rates are: 50, 75, 110, 134, 150, 200, 300,
    600, 1200, 1800, 2400, 4800, 9600, 19200, 38400, 57600, 115200, or 230400.


    **serClose:** This function closes the serial port. The handle must be specified
    as the argument.


    **serWriteByte:** This function writes a byte to the serial port. The first argument
    is the handle. The second argument is the byte to be written.


    **serReadByte:** This function reads and returns a byte. The handle must be specified
    in the argument


    **serWrite:** This function writes several bytes to the serial port. The first
    argument is the handle. The second is the character buffer that holds the data.
    The last is the byte count.


    **serRead:** This function reads the specified number of bytes and stores them
    in the buffer.


    **serDataAvailable:** This function returns the number of bytes available in the
    receive buffer. The handle must be specified as the argument.


