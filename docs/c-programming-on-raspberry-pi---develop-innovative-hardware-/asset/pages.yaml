    # ### 1.7 • Static IP address


    When we are using the Raspberry Pi with a Wi-Fi router, the IP address is automatically
    allocated by the router. It is possible that every time we start the Raspberry
    Pi, the Wi-Fi router will give the Pi another IP address. This makes it difficult
    to log in as we have to find the new IP address before we log in.


    We can give our Raspberry Pi a static IP address so that every time it starts,
    the same IP'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'address is allocated from the Wi-Fi router. The IP address is given by the
    DHCP protocol running on the Wi-Fi router.


    Before setting a static IP address, we have to decide what this address will be,
    and also make sure that no other devices on our network use this address. We can
    check this by logging in to the Wi-Fi router or by displaying the devices on our
    network using an app on a smartphone.


    The steps to assign a static IP address are as follows:


    +   - First, check **dhcpcd** is active by entering the following command:


    ```

    ```

    pi@raspberrypi:~$ sudo service dhcpcd status

    ```

    ```


    You should see the text **active: (running)** displayed as shown in Figure 1.11
    (only part of the display is shown). Enter **Ctrl+C** to exit from the display.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_20_0.png)


    +   - If dhcpcd is not running, enter the following commands to activate it:


    ```

    ```

    pi@raspberrypi:~$ sudo service dhcpcd start

    pi@raspberrypi:~$ sudo systemctl enable dhcpcd

    ```

    ```


    +   - We now need to find the IP address (Default Gateway) and the Domain Name
    Server address of our router. This can easily be obtained either from our Wi-Fi
    router or PC. The steps to obtain these addresses from a PC are:

    +     - Go to **Control Panel** on your Windows 10 PC.

    +     - Click **Network and Sharing Centre**.

    +     - Click **Internet** as shown in Figure 1.12.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_20_1.png)


    +   - Click **Details**. You will see a screen similar to the one shown in Figure
    1.13 where you'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'can see the Default Gateway and DNS server addresses. In this example, they
    are both: 191.168.1.254.


    | Item | Value |

    |---|---|

    | DHCP Enabled | Yes |

    | IPv4 Address | 192.168.1.199 |

    | IPv4 SubnetMask | 255.255.255.0 |

    | Lease Obtained | 08 July 2020 08:10:45 |

    | Lease Expires | 09 July 2020 12:27:53 |

    | IPv4 Default Gateway | 192.168.1.254 |

    | IPv4 DHCP Server | 192.168.1.254 |

    | IPv4 DNS Server | 192.168.1.254 |


    Figure 1.13 Click Details


    +   - You will have to edit the following file: `/etc/dhcpcd.conf` using a text
    editor such as **nano**. Although you may not be familiar with **nano**, follow
    the instructions given here (**nano** is described in a later chapter.)


    ```

    pi@raspberrypi:~ $ sudo nano /etc/dhcpcd.conf

    ```


    +   - Go to the end of the file using the down arrow key and enter the following
    lines:


    ```

    interface wlan0

    static ip_address=191.168.1.120/24

    static routers=191.168.1.254

    staticdomain_name_servers=191.168.1.254


    interface eth0

    static ip_address=191.168.1.120/24

    static routers=191.168.1.254

    static domain_name_servers=191.168.1.254

    ```


    In this example, we chose a static IP address of 191.168.1.120 after making sure
    there are no other devices on our network with the same IP address. The suffix
    /24 is an abbreviation of the subnet mask 255.255.255.0. You have to make sure
    you only change the last digit of the IP address. i.e. choose an address in the
    form 191.168.1.x. wlan0 is for the Wi-Fi link, and eth0 is for the Ethernet link.


    +   - Now, save the file by entering Ctrl+X, followed by Y.

    +   - Display the file on your screen to make sure the changes you made are correct.
    Enter the command:

    +   ```

    +   pi@raspberrypi:~ $ cat /etc/dhcpcd.conf

    +   ```

    +   - Reboot your Raspberry Pi and it should come up with the IP address set as
    required'
  merge: -1
  img_proc: true
