    # 4.6 ● The hardware


    In simple projects where there is no external hardware, we can simply use the
    Raspberry Pi board as it is and only software development is then required. Most
    projects however are more complex and require additional external components,
    such as LEDs, motors, displays, keypads, etc. The developer then has the task
    of making sure that the hardware is set up correctly and is working before any
    software development is started. If the hardware is not set up correctly, time
    will be wasted trying to develop software. Hardware development may require additional
    skills such as familiarity with interfacing and correctly using various electronic
    components in microcontroller-based systems.


    While developing hardware-based projects on the Raspberry Pi, we have to make
    connections to the 40-pin male type GPIO connector. This can be done easily using
    female-male type jumper leads. One side of the jumper lead can be connected to
    the GPIO connector, while the other can be connected to a breadboard so external
