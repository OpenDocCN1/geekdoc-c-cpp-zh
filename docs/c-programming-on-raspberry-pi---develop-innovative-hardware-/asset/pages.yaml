  md: '**Thonny** is an easy to use tool which is only available for Python 3. The
    nice thing about **Thonny** is that it formats code while it is entered from the
    terminal. For example, all statements in the body of a **while** loop are automatically
    and correctly indented.


    The steps to use **Thonny** are provided below:


    +   - Click **Applications menu**, then **Programming**, and select **Thonny Python
    IDE** as shown in Figure 2.7


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_27_0.png)


    Figure 2.7 Select Thonny Python IDE


    +   - The Thonny startup screen will be displayed as shown in Figure 2.8. The
    screen has two parts: The program is written in the upper part. The lower part
    is the **shell** where the results of the program are displayed. We can also run
    Python 3 commands interactively in the lower part of the screen. In the upper
    part, we have the usual menu items found in most GUI type displays. Menu option
    **File** is used to create a new file, open an existing file, close, save, or
    print a file. Menu option **Edit** is used to undo, cut, paste, select, find,
    replace, and so on. Option **View** is used to enable us to view files, heap,
    notes, stack, variables, and so on. Menu option **Run** is used to run or debug
    a program. Menu option **Device** is used to soft reboot, upload a current script
    as main script, and so on. Menu option **Tools** is used to manage packages, manage
    plug-ins, configure Thonny, and so on. Finally, the **Help** menu option is used
    to get help on using Thonny.'
