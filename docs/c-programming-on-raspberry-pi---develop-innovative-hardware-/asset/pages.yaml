    Nowadays, serial communication is done using standard TTL logic levels instead
    of ±12V, where logic 1 is +5V (or greater than +3V) and logic 0 is 0V. A serial
    line is idle when voltage is at +5V. The start bit is identified on the high-to-low
    transition of the line, i.e. the transition from +5V to 0V.


    # 11.2 • Raspberry Pi serial port


    The Raspberry Pi has two built-in UARTs: a PL011 and a mini UART. They are implemented
    using different hardware blocks and have slightly different characteristics. Since
    both are 3.3V devices, extra care must be taken when connecting to other serial
    communication lines operating at higher voltages (e.g. +5V).


    On Raspberry Pi is equipped with Wireless/Bluetooth modules (e.g. Raspberry Pi
    3, Zero W, 4, etc), the PL011 UART is connected to the Bluetooth module by default,
    while the mini is the primary UART with the Linux console on it. In all other
    models, the PL011 is used as the primary UART. By default, **/dev/ttyS0** refers
    to the mini UART and **/dev/ttyAMA0** refers to the PL011. The Linux console uses
    the primary UART which depends on the Raspberry Pi model used. Also, if enabled,
    **/dev/serial0** refers to the primary UART (if enabled), and if enabled, **/dev/serial1**
    refers to the secondary UART.


    By default, on the Raspberry Pi 4, the primary UART (**serial0**) is assigned
    to the Linux console. Using the serial port for other purposes requires this default
    configuration to be changed. On startup, **systemd** checks the Linux kernel command
    line for any console entries and will use the console defined therein. To stop
    this behaviour, the serial console setting needs to be removed from the command
    line. This is done as follows:'
