  md: "**PI_PUD_DOWN, and PI_PUD_OFF.**\n\n# ### 13.3 • Timing\n\nThe pigpio library\
    \ provides the following timing functions (for full details see the link: http://abyz.me.uk/rpi/pigpio/cif.html#gpioHardwareRevision\
    \ ):\n\n**gpioDelay**: This function pauses the program for the specified number\
    \ (32-bit integer) of microseconds. The actual delay is returned by the function.\n\
    \n**gpioTick**: This function returns the current system tick as a 32-bit integer.\n\
    \n**gpioTime**: This function returns the current system time. The function has\
    \ three arguments: The first argument is the typetype (0=relative, 1=absolute).\
    \ The second is the pointer to an integer which holds the seconds. The last argument\
    \ is the pointer to an integer which holds the microseconds. Absolute time is\
    \ the seconds and microseconds since the Epoch (1st January, 1970). Relative time\
    \ is the number of seconds and microseconds since the library was started.\n\n\
    **gpioSleep**: This function sleeps for specified seconds and microseconds. The\
    \ first argument is the typetype (0=relative, 1=absolute). The second is an integer\
    \ that specifies the seconds to sleep. The last is an integer which specifies\
    \ the number of microseconds to sleep.\n\n**time_sleep**: As we have seen before,\
    \ this function delays the execution for the specified number of seconds which\
    \ is a double type variable.\n\n**time_time**: This function returns the current\
    \ time in Epoch.\n\nAn example program is shown in Figure 13.2 (Program: **timing.c**)\
    \ which shows how to use the timing functions.\n\n```\n/*\n                  \
