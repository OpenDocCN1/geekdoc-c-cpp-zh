    # Description:


    In this project, a TMP102 temperature sensor chip (see Chapter 7) is connected
    to a Raspberry Pi. The ambient temperature reading is sent to an Android smartphone
    when a request is made by the smartphone. The smartphone makes a request by sending
    character T to Raspberry Pi over the Wi-Fi link using UDP protocol. Sending character
    x terminates the program.


    # Aim:


    This project aims to show how the temperature reading can be sent to an Android
    smartphone over a Wi-Fi link using the UDP protocol.


