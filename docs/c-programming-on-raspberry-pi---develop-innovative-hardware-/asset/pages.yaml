- pgno: 150
  md: '# 5.8 ● Project 7 – Changing the brightness of an LED


    # Description:


    In this project, an LED is connected to Raspberry Pi. The program changes the
    brightness of the LED by changing the voltage applied to it using PWM.


    # Aim:


    This project aims to show how PWM type waveform can be generated in a program
    and how this waveform can be effectively used to vary the voltage applied to an
    LED.


    # Circuit diagram:


    The circuit diagram of the project is as shown in Figure 4.10. An LED is connected
    to GPIO port 2 through a 470 Ohm current limiting resistor.


    # Program listing:


    # wiringPi


    The fading of the LED is done by applying a PWM waveform to the LED and changing
    the duty cycle of this waveform, effectively changing the average voltage applied
    to the LED. Figure 5.32 shows a typical PWM waveform. The duty cycle is defined
    as the ratio of the ON time to the period:


    Duty cycle = ONtime / Period ×100%


    or


    Duty cycle = ONtime / (ONtime + OFFtime) ×100%


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_150_0.png)


    Thus for example, when the duty cycle is 0%, ON time is 0, and when the duty cycle
    is 100% the OFF time is 0.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# wiringPi software PWM


    wiringPi includes a software-driven PWM handler capable of outputting a PWM signal
    on any of the Raspberry Pi GPIO pins.


    The following header file must be included at the beginning of the program:


    ```

    ```c

    #include <softPwm.h>

    ```

    ```


    Also, the library file **pthread** must be included during the compile time. For
    example, if the program name is test.c, the program can be compiled as follows:


    ```

    ```bash

    gcc -o test test.c -lwiringPi -lpthread

    ```

    ```


    The following two functions are available:


    ```

    ```c

    int softPwmCreate (int pin, int initialValue, int pwmRange);

    ```

    ```


    This creates a software-controlled PWM pin. You can use any GPIO pin. Pin numbering
    will be that of the **wiringPiSetup()** function. The basic pulse unit is 100
    microseconds. Therefore, as an example, **softPwmCreate(LED, 0, 200)** creates
    a PWM waveform with a period of T = 20 ms (200 x 100 microseconds = 20 ms).


    The following function updates the PWM value on the specified pin:


    ```

    ```c

    void softPwmWrite (int pin, int value) ;

    ```

    ```


    The value indicates how long the pulse will be ON. For example, assuming the above
    **softPwmCreate** values, **softPwmWrite(LED, 100)** means the PWM **ON** time
    will be for 100 x 100 microseconds = 10 ms. This corresponds to 50% duty cycle
    (i.e. 10 ms **ON** time + 10 ms **OFF** time with 20 ms period). Similarly, using
    the above settings, **softPwmWrite(LED, 200)** will correspond to 20 ms **ON**
    time, i.e. 100% duty cycle.


    In this project, the period of the PWM waveform is set to 50 Hz (20 ms). The waveform
    ON time is varied from 0% to 100% with the **softPwmWrite** value changing from
    0 to 200 as described above.


    At the beginning of the program, LED is assigned to 8 which corresponds to GPIO
    2. Two for loops are formed. Inside the first for loop, the PWM ON time is varied
    from 0 to 200 (i.e. 0 to 20 ms = 100% duty cycle). A 25 ms delay is used between
    each output change, therefore, with 200 iterations, it takes 200 x 25 ms = 5000ms
    or 5 seconds for the LED to go from OFF to full brightness. Inside the second
    **for** loop, the brightness of the LED is decreased from full brightness to full
    **OFF** at the same rate.


    The program listing of the project is very simple and shown in Figure 5.33 (Program:
    **FadeLED.c**). The program was compiled as follows:'
