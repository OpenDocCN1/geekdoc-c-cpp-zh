    \ the Raspberry Pi and DHT11, LED, buzzer, and relay are defined. This program\
    \ uses the VT100 cursor control codes with a **Putty** terminal emulation program\
    \ to display the set temperature, room temperature, and heater status. Using cursor\
    \ control codes has the advantage that data is displayed at fixed points of the\
    \ screen and does not scroll, hence it is much easier to see. For example, printing\
    \ `esc[2J` clears the screen. `esc[H` homes the cursor to the top left-hand of\
    \ the screen. `esc[3;4H` positions the cursor at line 3, column 4 of the screen,\
    \ and so on. A full list of the cursor control codes is available at the link:\n\
    \nhttps://git.github.com/fnky/458719343aabd01cfb17a3a4f7296797\n\nThe functions\
    \ that read temperature and humidity from the DHT11 sensor chip are the same as\
