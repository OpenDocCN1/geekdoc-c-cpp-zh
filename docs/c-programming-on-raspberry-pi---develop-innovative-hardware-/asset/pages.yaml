  md: 'For example, if A2 = A1 = A0 = 0 then the I2C address is 0xA0.


    V_cc and V_ss are the power supply pins.


    WP is the write protection pin. If this pin is tied to the ground, writing is
    enabled. If connected to Vcc then the write operations have no effects.


    # Circuit diagram:


    The circuit diagram of the project is shown in Figure 7.10. In this project, I2C
    pins GPIO 2 and GPIO 3 of Raspberry Pi are used. A0, A1 and A2 are connected to
    ground so that the device address is 0xA0. Also, the write-protect pin WP is tied
    to ground.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_209_0.png)


    Figure 7.10 Circuit diagram of the project


    Before going into the details of the memory write and read operations, it is worthwhile
    to learn how this is done.


    # Memory write operation


    As an example, assume that we want to write byte 0x25 into memory location 0x0250.
    Figure 7.11 shows the write steps in detail. First of all, the START bit is sent
    on the bus, followed by the device address which is assumed to be 0xA0, with the
    LSB bit set to 0 to indicate that we wish to do a write operation. The memory
    address 0x0250 is then split into upper and lower bytes as 0x02 and 0x50. They
    are sent sequentially with the higher byte sent first over the bus. Then, data
    byte 0x25 is sent (this is called Byte Writing since only one byte is written
    to memory). Notice we can send multiple bytes (called Page Writing where up to
    64 bytes can be written sequentially. There are 512 pages and each page is 64
    bytes long) in the same transaction (an internal address counter is incremented
    automatically after a byte is sent). The write operation is terminated with the
    STOP bit. Notice that ACK bit is sent by the EEPROM between the byte transfers.
    After a byte write'
