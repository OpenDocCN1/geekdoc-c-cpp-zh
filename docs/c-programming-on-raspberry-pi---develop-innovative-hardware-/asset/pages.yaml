- pgno: 259
  md: '# # Chapter 10 • Using Digital-to-Analogue Converters (DACs)


    # ## 10.1 • Overview


    DACs are used to convert digital signals into analogue form. Such converters have
    many applications in digital signal processing and digital control applications.
    For example, we can generate waveforms by writing programs and convert these waveforms
    into analogue forms and output them from our digital computer. We also need DACs
    if we want to interface a speaker or other device operating with analogue voltages
    to a Raspberry Pi.


    The Raspberry Pi has no built-in ADC converter and therefore an external DAC chip
    must be used to output analogue signals. In this chapter, we will learn how to
    use a popular DAC (the MCP4921) chip with Raspberry Pi to generate simple signal
    waveforms.


    # ## 10.2 • The MCP4921 DAC


    Before using the MCP4921, it is worthwhile to look at its features and operation
    in some detail. MCP4921 is a 12-bit DAC operating with the SPI bus interface.
    Figure 10.1 shows the pin layout of this chip. The basic features are (for more
    details see the link: [http://ww1.microchip.com/downloads/en/DeviceDoc/21897B.pdf](http://ww1.microchip.com/downloads/en/DeviceDoc/21897B.pdf)):


    +   - 12-bit operation

    +   - 20MHz clock support

    +   - 4.5µs settling time

    +   - External voltage reference input

    +   - Unity or 2x Gain control

    +   - 1x or 2x gain

    +   - 2.7 to 5.5V supply voltage

    +   - -40°C to +125°C temperature range


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_259_0.png)


    Figure 10.1 MCP4921 DAC'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Pin descriptions are:


    +   - **Vdd:** supply voltage

    +   - **CS:** chip select (active LOW)

    +   - **SCK:** SPI clock

    +   - **SDI:** SPI data in

    +   - **LDAC:** Used to transfer input register data to the output (active LOW)

    +   - **Vref:** Reference input voltage

    +   - **Vout:** analogue output

    +   - **Vss:** supply ground


    In this project, we will be operating the MCP4921 with a gain of 1. As a result,
    with a reference voltage of 3.3V and 12-bit conversion data, the LSB resolution
    of the DAC will be 3300mV / 4096 = 0.8mV


    # ### 10.3 • Project 1 - Generating square wave signal with any peak voltage


    # #### Description:


    In this project, we will be using the DAC to generate a square wave signal with
    the frequency of 500Hz (Period = 2ms), and a 50% duty cycle (i.e. ON time = 1ms,
    OFF time = 1ms). The output voltage will be a 2V peak (notice this could not be
    achieved without using a DAC since the output HIGH voltage of a pin is +3.3V).


    # #### Aim:


    This project aims to show how a DAC chip can be interfaced with a Raspberry Pi.


    # #### Block Diagram:


    Figure 10.2 shows the block diagram of the project.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_260_0.png)


    Figure 10.2 Block diagram of the project


    # #### Circuit Diagram:


    The circuit diagram of the project is shown in Figure 10.3. The output of the
    DAC is connected to an oscilloscope.'
