- pgno: 179
  md: '| Pin no | Name | Function |

    | --- | --- | --- |

    | 1 | VSS | Ground |

    | 2 | VDD | + ve supply |

    | 3 | VEE | Contrast |

    | 4 | RS | Register select |

    | 5 | R/W | Read/write |

    | 6 | E | Enable |

    | 7 | D0 | Daat bit 0 |

    | 8 | D1 | Data bit 1 |

    | 9 | D2 | Data bit 2 |

    | 10 | D3 | Data bit 3 |

    | 11 | D4 | Data bit 4 |

    | 12 | D5 | Data bit 5 |

    | 13 | D6 | Data bit 6 |

    | 14 | D7 | Data bit 7 |

    | 15 | A | Backlight anode (+) |

    | 16 | K | Backlight cathode (GND) |


    Table 6.1 Pin configuration of HD44780 LCD module


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_179_0.png)


    Figure 6.1 HD44780 compatible parallel LCD


    V<sub>SS</sub> (pin 1) and V<sub>DD</sub> (pin 2) are the ground and power supply
    pins. The power supply should be +5V.


    V<sub>EE</sub> is pin 3 and this is the contrast control pin used to adjust the
    contrast of the display. The arm of a 10K potentiometer is normally connected
    to this pin and the other two terminals of the potentiometer are connected to
    the ground and power supply pins. The contrast of the display is adjusted by rotating
    the potentiometer arm.


    Pin 4 is the Register Select (RS) and when this pin is LOW, data transferred to
    the display is treated as commands. When RS is HIGH, character data can be transferred
    to and from the display.


    Pin 5 is the Read/Write (R/W) line. This pin is pulled LOW to write commands or
    character data to the LCD module. When the pin is HIGH, character data or status
    information can be read from the module. This pin is normally connected permanently
    LOW so commands and'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'character data can be sent to the LCD module.


    Enable (E) is pin 6 which is used to initiate the transfer of commands or data
    between the LCD module and microcontroller. When writing to the display, data
    is transferred only on the HIGH to LOW transition of this pin. When reading from
    the display, data becomes available after the LOW to HIGH transition of the enable
    pin and this data remains valid as long as the enable pin is at logic HIGH.


    Pins 7 to 14 are the eight data bus lines (D0 to D7). Data can be transferred
    between the microcontroller and LCD module using either a single 8-bit byte or
    as two 4-bit nibbles. In the latter case, only the upper four data lines (D4 to
    D7) are used. 4-bit mode has the advantage that four fewer I/O lines are required
    to communicate with the LCD. 4-bit mode is slower however due to the data being
    transferred in two stages. In this book, we will use the 4-bit interface.


    Pins 15 and 16 are for background brightness control. To enable background brightness,
    a 220 Ohm resistor should be connected from pin 15 to +5V supply. Pin 16 should
    be connected to ground.


    In 4-bit mode, the following pins of the LCD are used. The R/W line is permanently
    connected to ground. This mode uses 6 GPIO port pins of the microcontroller:


    ```

    V_SS, V_DD, V_EE, E, RS, D4, D5, D6, D7

    ```


    The libraries allow the control of 1, 2, and 4-line LCDs that are based on the
    **Hitachi HD44780** or compatible controllers. More than one LCD can be connected
    to Raspberry Pi. LCDs usually operate with +5V. There is no problem connecting
    them to Raspberry Pi GPIO pins because the display never writes data back to the
    Raspberry Pi (R/W pin is tied to GND).


    # 6.3 • Project 1 – Displaying text


    # **Description:**


    In this project, an LCD is connected to Raspberry Pi. The program displays text
    **Raspberry Pi** at row 0 (first row), column 2 of the LCD. Also, text **Computer**
    is displayed at row 1 (second row), column 4 of the display.


    # **Aim:**


    This project aims to show how an LCD can be connected to Raspberry Pi, and be
    programmed using C.'
