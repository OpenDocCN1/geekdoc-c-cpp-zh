    struct termios options;

    tcgetattr(fd, &options);    // Read options

    options.c_cflag = B9600 | CS8 | CLOCAL | CREAD, PARENB;

    options.c_iflag = IGNPAR;

    tcsetattr(fd, &options);    // Set options

    ```

