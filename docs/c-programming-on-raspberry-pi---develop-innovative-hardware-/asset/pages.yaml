  md: '# 5.9 • Project 8 – Generating random sounds using a buzzer


    # Description:


    In this project, a passive buzzer is connected to GPIO port pin 2 (wiringPi pin
    8) of the Raspberry Pi. The buzzer generates sound with frequencies randomly changing
    between 100 Hz and 1 kHz.


    # Aim:


    This project aims to show how a passive buzzer can be connected to a Raspberry
    Pi and how, with different frequencies, sound can be generated using a buzzer.


    # Circuit diagram:


    There are two types of buzzers: Passive and Active. Passive buzzers require an
    AC signal in the audible frequency range to operate. Active buzzers on the other
    hand have built-in oscillators that generate fixed frequency sound when logic
    1 is applied to them, just like turning ON and LED. The frequency of an active
    buzzer can be changed by the ON/OFF frequency of the applied I/O logic signal.
    In this project, a passive buzzer is used and a PWM signal with different frequencies
    is applied to the buzzer. Figure 5.36 shows the circuit diagram of the project.


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_155_0.png)


    Figure 5.35 Passive buzzer used in the project


    ![](img/7ba4e9a445f8a2ad48358a7aed37b32e_155_1.png)


    Figure 5.36 Circuit diagram of the project'
