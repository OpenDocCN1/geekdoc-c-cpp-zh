    # 3.2.8 Arrays


    During program development, there is usually a need to record related items of
    data of the same type. For example, we may want to save the heights of students
    in a classroom. In such applications, it is easy to use arrays to store related
    data items.


    An array has a type and name. For example, an integer called age with 5 elements
    can be defined as follows:


    ```

    integer[5];

    ```


    Each element of the array is unique. The index of the array always starts from
    0 and goes up the defined value minus 1. Therefore, in the above definition, array
    age has 5 elements where each element can be accessed as follows:


    +   - age[0]

    +   - age[1]

    +   - age[2]

    +   - age[3]

    +   - age[4]


    The contents of an array element can be changed by specifying its index and assigning
    new data to it. In the following example, the second element of the array is changed
    to 10:


    ```

    age[1] = 10;

    ```


