- pgno: 282
  md: "```\n```c\nwiringPiISR (int pin, intedgeType, void (*function)(void));\n```\n\
    ```\n\nHere, pin is the pin used for external interrupt. edgeType specifies how\
    \ the interrupt will be recognised on the pin. Valid options are: **INT_EDGE_FALLING**,\
    \ **INT_EDGE_RISING**, **INT_EDGE_BOTH** and **INT_EDGE_SETUP**. The specified\
    \ function will be called whenever an external interrupt is detected. If another\
    \ interrupt occurs while servicing the current one, the new interrupt will be\
    \ saved and will be handled when the current one is completed. The ISR has full\
    \ access to all program global variables, and filehandles, etc.\n\nFigure 12.2\
    \ shows the program listing (Program: **EventInt.c**). Inside the main program,\
    \ function **wiringPiISR** is called and external interrupts are initialised on\
    \ pin **Button** with falling edge detection. The ISR function is named **MyISR**.\
    \ Inside this routine, variable count is incremented by one and **flag** is set\
    \ to 1. The **flag** variable is used in the main program loop to detect if an\
    \ interrupt has occurred. Contact bouncing is minimised by waiting until the **Button**\
    \ is released and by introducing a short delay after the **Button** action.\n\n\
    Example output from the program is shown in Figure 12.3.\n\n```\n```c\n/*--------------------------------------------------------------\n\
    \                 EXTERNAL INTERRUPT EVENT COUNTER\n                 ===============================\n\
    \nThis is an external interrupt event counter program. A button is\nconnected\
    \ to GPIO 2 and the state of the button is at 0. When the\nbutton is pressed GPIO\
    \ 2 goes from 1 to 0 and generates an external\ninterrupt. Inside the ISR a counter\
    \ is incremented and the total\ncount is displayed on the PC screen\n\nAuthor:\
    \ Dogan Ibrahim\nFile  : EventInt.c\nDate  : December 2020\n--------------------------------------------------------------*/\n\
    #include <wiringPi.h>\n#include <stdio.h>\n\n#define Button 2                \
    \              // Button at GPIO 2\nint count, flag;                         \
    \     // Init count\n\n//\n// This is the interrupt service routine. The value\
    \ of count is\n// incremented by one in this routine\n//\nvoid MyISR()\n{\n  \
    \      count++;                              // Increment count\n        flag\
    \ = 1;                             // Set flag\n```\n```"
