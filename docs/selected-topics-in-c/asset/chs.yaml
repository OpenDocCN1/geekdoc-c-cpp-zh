  \n`theOtherClassObj1.derivedClassObj.varPtr: 003AF740`\n`theOtherClassObj2.derivedClassObj.varPtr:\
  \ 003AF740`\n\n你看，规则并没有改变。编译器生成的拷贝构造函数发现 `derivedClass` 没有提供任何拷贝构造函数，因此它执行了浅拷贝。我们从两个\
  \ `varPtr` 中看到了这一点。它们是相同的。\n\n我们查看了许多不同的场景。让我们总结一下编译器的拷贝机制。\n\n- 如果没有定义拷贝构造函数，编译器将生成一个。这个拷贝构造函数将执行位拷贝（我们将在这种情况不成立时看到这一点）。\n\
  - 如果显式定义了拷贝构造函数，编译器将不会生成任何类型的构造函数。即使是默认构造函数也不会。\n- 但如果定义了构造函数但不是拷贝构造函数，编译器将生成一个拷贝构造函数。\n\
  - 如果定义了拷贝构造函数，必须在初始化列表中调用成员类或基类的拷贝构造函数。\n- 如果拷贝构造函数没有初始化列表中调用成员类或基类的拷贝构造函数，编译器将尝试调用成员类或基类的默认构造函数。\n\
  - 如果定义了拷贝构造函数并在初始化列表中调用成员类或基类的拷贝构造函数，编译器将调用该拷贝构造函数。在这种情况下，如果成员类或基类中没有定义拷贝构造函数，将调用编译器生成的拷贝构造函数。\n\
  - 编译器生成的拷贝构造函数始终调用成员类或基类的拷贝构造函数。\n- 记住，拷贝构造函数总是由编译器生成的（如果未定义）。总是如此。但编译器是否调用拷贝构造函数取决于它是如何被以及是否被调用。\n\
  \n所以我假设这个列表是有意义的。规则并不多。处理此问题的简单方法是实现你自己的拷贝构造函数。\n\n## 对象克隆\n\n到目前，我们看到了如何拷贝对象，无论是派生类还是成员类。但当我们处理指针时，情况就会变得有点复杂。看这个类层次结构。\n\
  \n```\n#include<iostream>\n\nusing namespace std;\n\nclass classA\n{\npublic:\n\
  int classAVar;\nclassA(int value) : classAVar(value)\n{\ncout << \"classAVar constructor\"\
  \ << endl;\n}\n};\n\nclass classB : public classA\n{\npublic:\nint classBVar;\n\
  classB(int value1, int value2) : classA(value1), classBVar(value2)\n{\ncout << \"\
  classB constructor\" << endl;\n}\n};\n\nclass classC : public classB\n{\npublic:\n\
  int classCVar;\nclassC(int value1, int value2, int value3) : classB(value1, value2),\
  \ classCVar(value3)\n{\ncout << \"classC constructor\" << endl;\n}\n};\n\nint main(int\
  \ argc, char** argv)\n{\nclassA* classAptr1 = new classC(1, 2, 3);\nreturn 0;\n\
  }\n```\n\n这些类都没有定义拷贝构造函数。也就是说，这些类没有定义拷贝构造函数。这没问题。编译器生成的拷贝构造函数执行了工作。注意 `classAptr`\
  \ 是 `classA` 类型，但它是一个 `classC` 对象。这就是当我们处理指针时，我们需要看到多态。多态让我们使用 `classC`。现在你可以尝试这样做：\n\
  \n```cpp\nint main(int argc, char** argv)\n{\nclassA* classAptr1 = new classC(1,\
  \ 2, 3);\nclassA* classAptr2 = new classA(classAptr1);\nreturn 0;\n}\n```\n\n但这样行不通![](img/image0872.jpeg)\n\
  \n编译器无法将 `classA` 类型转换为 `classC`。让编译器开心的唯一方法是实例化 `classA`。让我们看看会发生什么。\n\n(注：由于原文中存在大量重复段落，译文已去重并保持逻辑通)\n\
  \n\n\n\n```cpp\nusing namespace std;\n\nclass classA\n{\npublic:\n    int classAVar;\n\
  \    classA(int value) : classAVar(value)\n    {}\n    virtual void printVars()\n\
  \    {\n        cout << \"classAVar: \" << classAVar << endl;\n    }\n    virtual\
  \ classA* clone()\n    {\n        return new classA(*this);\n    }\n};\n\nclass\
  \ classB : public classA\n{\npublic:\n    int classBVar;\n    classB(int value1,\
  \ int value2) : classA(value1), classBVar(value2)\n    {}\n    virtual void printVars()\n\
  \    {\n        cout << \"classAVar: \" << classAVar << endl;\n        cout << \"\
  classBVar: \" << classBVar << endl;\n    }\n    virtual classB* clone()\n    {\n\
  \        return new classB(*this);\n    }\n};\n\nclass classC : public classB\n\
  {\npublic:\n    int classCVar;\n    classC(int value1, int value2, int value3) :\
  \ classB(value1, value2), classCVar(value3)\n    {}\n    virtual void printVars()\n\
  \    {\n        cout << \"classAVar: \" << classAVar << endl;\n        cout << \"\
  classBVar: \" << classBVar << endl;\n        cout << \"classCVar: \" << classCVar\
  \ << endl;\n    }\n    virtual classC* clone()\n    {\n        return new classC(*this);\n\
  \    }\n};\n\nint main(int argc, char** argv)\n{\n    classA* classAptr1 = new classC(1,\
  \ 2, 3);\n    cout << \"classAptr1->printVars()\" << endl;\n    classAptr1->printVars();\
  \ cout << endl;\n    classA* classAptr2 = classAptr1->clone();\n    cout << \"classAptr2->printVars()\"\
  \ << endl;\n    classAptr2->printVars();\n    return 0;\n}\n```\n\n`classAptr1->printVars()`\n\
  `classAVar: 1`\n`classBVar: 2`\n`classCVar: 3`\n`classAptr2->printVars()`\n`classAVar:\
  \ 1`\n`classBVar: 2`\n`classCVar: 3`\n\n由于 `clone` 是虚函数，当通过指针调用时，它会调用正确对象类型的 `clone`。它会调用自身的拷贝构造函数，从而复制整个对象，包括基类。还记得我们讨论过派生类的拷贝构造函数是如何工作的吗？它们总是需要复制基类部分。顺便说一下，如果你好奇不同类之间\
  \ `clone` 返回类型的差异，只要它们属于同一个继承体系，这是允许的。\n\n这种克隆机制被称为“虚拷贝模式’（virtual copy pattern），它是深拷贝的一个示例。\n\
  \n### 琐/非平凡拷贝构造函数\n\n在离开这一节之前，我需要提到一下平凡（trivial）和非平凡（non-trivial）拷贝构造函数。我们在这次讨论中看到的编译器生成的拷贝构造函数大部分是“平凡”拷贝构造函数。它们除了成员级拷贝之外没有做更多。但编译器并不总是能做到这一点。特别是在像上一个那种带有虚\
  \ `clone` 函数的程序中。在其他几种情况下，拷贝构造函数不能是平凡的，而拥有虚函数就是主要原因之一。\n\n可以看到，当一个类拥有虚函数时，它就有一个虚表指针（`vptr`）和一个关联的虚表（`vtable`）。我们在“虚机制”主题中讨论过这个。当对象存在关联的\
  \ `vptr` 时，它不能简单地复制到新构造的类中。需要根据每个对象的类型为其生成 `vtable` 和 `vptr`。现在你可能会想为什么 `vptr` 不能与复制的对象相同？嗯，如果被复制的对象和正在构造的对象处于相同的继承层级，那么是可以的。但并非总是如此。例如，在我们上一个例子中，`classB`\
  \ 的拷贝构造函数具有如下形式：\n\n```cpp\nclass classB : public classA\n{\n    ...\n    classB(const\
  \ classB& objToCopy)\n    {\n        // copy object\n    }\n};\n```\n\n在这里我们需要考虑两种可能性。\n\
  \n第一种，两个对象都是 `classB`：\n\n```cpp\nint main(int argc, char** argv)\n{\n    classB\
  \ classBObj1 = classBObj(1, 2);\n    classB classBObj2(classBObj1);\n    return\
  \ 0;\n}\n```\n\n在这种情况下，是的，两个对象可以拥有相同的 `vptr` 和 `vtable`。它们是相同类型。\n\n但这种情况情况呢？\n\n\
  ```cpp\nint main(int argc, char** argv)\n{\n    classC classCObj = classCObj(1,\
  \ 2, 3);\n    classB classBObj(classCObj);\n    return 0;\n}\n```\n\n将 `objToCopy`\
  \ 作为引用传递；它会被“切片”为 `classB`。因此，直接的位位拷贝将完全不可行。这就是为什么当存在虚函数时，拷贝构造是非平凡的。它需要执行比仅仅复制位更多的工作。拥有虚函数只是其中一种情况。还有其他几种需要非平凡拷贝构造函数的情况。\n\
  \n最后一点。虽然我谈到了 `vptr` 和 `vtable`，但我必须告诉你们，`vptr` 和 `vtable` 的概念并没有在标准中规定。编译器可以以任何想要的方式实现虚机制（但\
  \ `vptr` 和 `vtable` 是最常见的）。\n\n\n\n\n再次，这里没什么特别的。我们有一个 `baseClass` 指针指向一个 `baseClass`\
  \ 实例，以及有一个 `derivedClass` 指针指向一个 `derivedClass` 实例。这里没什么有趣的。现在让我们看看当有不同的指针和实例类型时，情况是怎样的。\n\
  \n…\n\n…\n\n```cpp\nint main(int argc, char** argv)\n{\nbaseClass* baseClassPtr\
  \ = new derivedClass(1, 2, 3, 4);\nbaseClassPtr->printAllVals();\nreturn 0;\n}\n\
  ```\n\n![](img/image0087.jpeg)\n\n这可能并不令人意外，但验证这个事实是好的。实例是什么什么类型并不重要。编译器并不关心指针指向的是什么类型的对象。它不应该关心。因为\
  \ `baseClassPtr` 在整个程序运行过程中可能会指向不同的实例。所以编译器不会尝试去查看实例的类型。这是多态和动态绑定的原理之一。对于编译器来说，它指向一个\
  \ `baseClass` 实例，而 `baseClass` 并没有定义 `printAllVals` 函数。\n\n但我们知道它指向一个 `derivedClass`\
  \ 实例。所以我们可以这样强制转换：\n\n…\n\n…\n\n```cpp\nint main(int argc, char** argv)\n{\nbaseClass*\
  \ baseClassPtr = new derivedClass(1, 2, 3, 4);\nstatic_cast<derivedClass*>(baseClassPtr)->printAllVals();\n\
  return 0;\n}\n```\n\n`derivedClass::printAllVals()`-->\n\n`baseClass::baseClassVar`-1\n\
  `baseClass::commonVar`-2\n`derivedClass::derivedClassVar`-3\n`derivedClass::commonVar`-4\n\
  \n在这里，我们将 `baseClassPtr` 转换为 `derivedClass` 类型。我们是在告诉编译器，相信我们 `baseClassPtr` 确实指向一个\
  \ `derivedClass` 实例。编译器照从了。你会发现，指向 `derivedClass` 的指针和指向一个普通整数的指针没有区别。它们都是具有相同位数的内存地址。指针只包含一个内存地址。这个内存地址中的内容由指针类型决定。所以在这里我们告诉编译器\
  \ `baseClassPtr` 指向一个包含 `derivedClass` 对象的内存块。而事实确实如此，所以我们没有问题。当我们执行以下操作时，这一点会变得清晰：\n\
  \n```cpp\nint main(int argc, char** argv)\n{\nbaseClass* baseClassPtr = new baseClass(1,\
  \ 2);\nstatic_cast<derivedClass*>(baseClassPtr)->printAllVals();\nreturn 0;\n}\n\
  ```\n\n`derivedClass::printAllVals()`-->\n\n`baseClass::baseClassVar`-1\n`baseClass::commonVar`-2\n\
  `derivedClass::derivedClassVar`-1359395851\n`derivedClass::commonVar`-2013265804\n\
  \n在这里我们只有一个 `baseClass` 实例，但我们欺骗编译器说它指向一个 `derivedClass` 对象。编译器没有进行任何验证。它相信了我们并尝试读取成员变量，结果得到了垃圾数据，因为那些变量并不存在。\n\
  \n现在让我们看一个通过指针访问成员变量的示例。\n\n```cpp\n#include<iostream>\nusing namespace std;\n\n\
  class baseClass\n{\npublic:\n    int commonVar;\n    baseClass(int comVal) : commonVar(comVal)\n\
  \    {}\n};\n\nclass derivedClass : public baseClass\n{\npublic:\n    int commonVar;\n\
  \    derivedClass(int baseComVal, int derivedComVal) : baseClass(baseComVal), commonVar(derivedComVal)\n\
  \    {}\n};\n\nint main(int argc, char** argv)\n{\nbaseClass* baseClassPtr = new\
  \ derivedClass(1, 2);\ncout << \"baseClassPtr->commonVar: \" << baseClassPtr->commonVar\
  \ << endl;\nderivedClass* derivedClassPtr = new derivedClass(3, 4);\ncout << \"\
  derivedClassPtr->commonVar: \" << derivedClassPtr->commonVar << endl;\ncout << \"\
  derivedClassPtr->baseClass::commonVar: \" << derivedClassPtr->baseClass::commonVar\
  \ << endl;\nreturn 0;\n}\n```\n\n`baseClassPtr->commonVar`: 1\n`derivedClassPtr->commonVar`:\
  \ 4\n`derivedClassPtr->baseClass::commonVar`: 3\n\n那么，访问的变量取决于指针的类型，而不是它所指向的对象类型。这是因为成员变量是通过偏移量访问的。你将在下一章学习更多内容。`baseClass::commonVar`\
  \ 的偏移量值与 `derivedClass::commonVar` 不同。事实上，我们可以打印出来并查看。\n\n…\n\n….\n\n```cpp\nint\
  \ main(int argc, char** argv)\n{\ncout << offsetof(baseClass, commonVar) << endl;\n\
  cout << offsetof(derivedClass, commonVar) << endl;\nreturn 0;\n}\n```\n0\n4\n\n\
  如你所示，`commonVar` 的偏移量值是不同的。这就是编译器能够根据类型访问正确变量的原因。\n\n没有惊喜。但我想向你们展示在类层次结构中共享相同名称时对成员变量和函数的访问方式，以及它是如何与对象类型和指针类型工作的。\n\
  \n## 主题 12：类成员偏移量\n\n在这个简短的主题中，我们将讨论类成员偏移量。当你在类中定义成员变量时，它们需要位于类中的特定位置。我在这里要讨论的内容不是标准的一部分。就像虚机制一样，编译器开发者可以自由使用他们自己的方法。\n\
  \n## 对象中的成员布局\n\n类成员偏移量定义了特定成员在对象内的偏移量（通常以字节为单位）。当你创建一个类的对象时，它占据了一块内存，编译器知道这块内存从哪里开始。它还知道该内存块跨越多长，这可以通过\
  \ `sizeof(classType)` 找到。但编译器如何在该对象中找到成员变量呢？它是通过偏移量。这里有一个例子。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n\nclass baseClass\n{\npublic:\n    int var1;\n    int var2;\n\
  \    int var3;\n    baseClass(int val1, int val2, int val3) : var1(val1), var2(val2),\
  \ var3(val3)\n    {}\n};\n\nint main(int argc, char** argv)\n{\ncout << \"Offset\
  \ of baseClass::var1: \" << offsetof(baseClass, var1) << endl;\ncout << \"Offset\
  \ of baseClass::var2: \" << offsetof(baseClass, var2) << endl;\ncout << \"Offset\
  \ of baseClass::var3: \" << offsetof(baseClass, var3) << endl;\nreturn 0;\n}\n```\n\
  `baseClass::var1`: 0\n`baseClass::var2`: 4\n`baseClass::var3`: 8\n\n我们有一个带有变量的简单类。注意我们打印的是什么。`offsetof`\
  \ 宏给出变量相对于对象起始位置的偏移量。这意味着 `var1` 在对象的起始处。一个整数是 4 字节。所以这些变量一个接一个排列。让我们通过查看内存来确保这确实如此。\n\
  \n```cpp\nint main(int argc, char** argv)\n{\ncout << \"Offset of baseClass::var1:\
  \ \" << offsetof(baseClass, var1) << endl;\ncout << \"Offset of baseClass::var2:\
  \ \" << offsetof(baseClass, var2) << endl;\ncout << \"Offset of baseClass::var3:\
  \ \" << offsetof(baseClass, var3) << endl;\nbaseClass baseClassObj(4, 5, 6);\ncout\
  \ << \"&baseClassObj: \" << &baseClassObj << endl;\ncout << \"&baseClassObj.var1:\
  \ \" << &baseClassObj.var1 << endl;\ncout << \"&baseClassObj.var2: \" << &baseClassObj.var2\
  \ << endl;\ncout << \"&baseClassObj.var3: \" << &baseClassObj.var3 << endl;\nreturn\
  \ 0;\n}\n```\n`baseClass::var1`: 0\n`baseClass::var2`: 4\n`baseClass::var3`: 8\n\
  `baseClassObj`: 0016F980\n`baseClassObj.var1`: 0016F980\n`baseClassObj.var2`: 0016F984\n\
  `baseClassObj.var3`: 0016F988\n\n在这里我们创建一个对象并打印三个变量的内存地址。从内存地址中清楚地看到变量在内存中相隔 4 字节排列。这里是内存空间的视图。\n\
  \n![](img/image00874.jpeg)\n\n这就是编译器能够在类中找到成员变量的方式。相同类型的每个对象以相同的偏移量布局。现在让我们看看偏移量发生的情况。让我们定义一个简单的虚函数。这使得类对象包含一个\
  \ `vptr` 和对应的 `vtable`。\n\n```cpp\n#include<iostream>\nusing namespace std;\n\n\
  class baseClass\n{\npublic:\n    int var1;\n    int var2;\n    int var3;\n    baseClass(int\
  \ val1, int val2, int val3) : var1(val1), var2(val2), var3(val3)\n    {}\n\n   \
  \ virtual void virtFunc()\n    {\n```\n\n\n\n```cpp\ncout << \"virtual function\"\
  \ << endl;\n\n}\n\n};\n\nint main(int argc, char** argv)\n{\n  baseClass baseClassObj(4,\
  \ 5, 6);\n  cout << \"&baseClass::var1: \" << offsetof(baseClass, var1) << endl;\n\
  \  cout << \"&baseClass::var2: \" << offsetof(baseClass, var2) << endl;\n  cout\
  \ << \"&baseClass::var3: \" << offsetof(baseClass, var3) << endl << endl;\n  cout\
  \ << \"&baseClassObj: \" << &baseClassObj << endl;\n  cout << \"&baseClassObj.var1:\
  \ \" << &baseClassObj.var1 << endl;\n  cout << \"&baseClassObj.var2: \" << &baseClassObj.var2\
  \ << endl;\n  cout << \"&baseClassObj.var3: \" << &baseClassObj.var3 << endl;\n\
  \  return 0;\n}\n```\n\n`offsetof(baseClass, var1): 4`\n`offsetof(baseClass, var2):\
  \ 8`\n`offsetof(baseClass, var3): 12`\n`&baseClassObj: 0017FC30`\n`&baseClassObj.var1:\
  \ 0017FC34`\n`&baseClassObj.var2: 0017FC38`\n`&baseClassObj.var3: 0017FC3C`\n\n\
  你看到当我们添加虚函数时，变量的偏移量增加了 4 个字节了吗？因为编译器将 `vptr` 放在了偏移量 0 的位置。`vptr` 就像任何其他指针一样，占用了\
  \ 4 个字节，因此变量移动了 4 个字节。需要注意的是，将 `vptr` 放在类开头并不是标准做法，甚至使用 `vptr` 也不是必须的。这仅仅是 Visual\
  \ C++ 编译器的做法。但这一洞察让我们得以窥了编译器是如何处理成员访问的。让我们来看看对象的局部变量和对应的内存块。\n\n![](img/image00875.jpeg)\n\
  \n局部变量显示了变量的值以及 `vptr` 的内容。它显示 `vptr` 指向内存地址 '0x002A3318'。这意味着 `vtable` 位于该地址。那么，我们如何确定变量是因为\
  \ `vptr` 而偏移了 4 个字节呢？让我们看看 `0x0017FC30` 处的对象内存块：\n\n![](img/image00876.jpeg)\n\n\
  看到对象起始地址偏移量 0 处的内容了吗？它与我们之前在局部视图中看到的 `vptr` 地址相同。这证实了 (Visual C++) 编译器将 `vptr` 放在了对象的零偏移量处。\n\
  \n我希望你稍微了解了一点编译器是如何访问对象的。虽然具体实现取决于编译器，但拥有成员偏移量是访问对象及其内容的一种高效方法。\n\n### 指向类成员的指针\n\
  \n好了，我们知道编译器是如何操作的，但我们能从中获得什么好处吗？\n\n```cpp\nint main(int argc, char** argv)\n{\n\
  \  baseClass baseClassObj(4, 5, 6);\n  // ... (代码省略)\n```\n\ncout << \"virtual function\"\
  \ << endl;\n\n// (省略)\n  cout << \"&baseClass::var1: \" << offsetof(baseClass, var1)\
  \ << endl;\n  cout << \"&baseClass::var2: \" << offsetof(baseClass, var2) << endl;\n\
  \  cout << \"&baseClass::var3: \" << offsetof(baseClass, var3) << endl << endl;\n\
  \  cout << \"&baseClassObj: \" << &baseClassObj << endl;\n  cout << \"&baseClassObj.var1:\
  \ \" << &baseClassObj.var1 << endl;\n  cout << \"&baseClassObj.var2: \" << &baseClassObj.var2\
  \ << endl;\n  cout << \"&baseClassObj.var3: \" << &baseClassObj.var3 << endl;\n\
