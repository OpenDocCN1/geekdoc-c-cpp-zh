  \n派生类的拷贝构造函数与派生类构造函数没有区别。你需要在初始化列表中调用基类的拷贝构造函数，千万不要在函数体内部。如果你尝试这样做：\n\n```cpp\n\
  derivedClass(const derivedClass& objToCopy)\n{\n    baseClass(objToCopy);\n    cout\
