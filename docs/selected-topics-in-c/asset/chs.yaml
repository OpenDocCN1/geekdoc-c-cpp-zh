  \n![](img/image00886.jpeg)\n\n我们需要做的只是通过使用类名正确地限定调用，告诉编译器我们想要调用哪一个 `foo`。\n\n```cpp\n\
  int main(int argc, char** argv)\n{\nABDerived ABDerObj(1, 2);\naBDerObj.A::foo();\
  \         // 对函数进行限定\nreturn 0;\n}\n```\n`Class A foo()`\n\n如果 `foo` 在类 `A` 中是私有的呢？在这种情况下\
  \ `ABDerived` 只能访问 `B::foo`，所以我们不需要对 `foo` 的调用进行限定，对吧？不。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass A\n{\npublic:\nint var;\nA(int val) : var(val)\n\
  {}\nprivate:\nvoid foo()\n{\n    cout << \"Class A foo()\" << endl;\n}\n};\n\nclass\
  \ B\n{\npublic:\nint var;\nB(int val) : var(val)\n{}\nvoid foo()\n{\n    cout <<\
  \ \"Class B foo()\" << endl;\n}\n};\n\nclass ABDerived : public A, public B\n{\n\
  public:\nABDerived(int var1, int var2) : A(var1), B(var2)\n{}\n};\n\nint main(int\
  \ argc, char** argv)\n{\nABDerived ABDerObj(1, 2);\naBDerObj.foo();\nreturn 0;\n\
  }\n```\n![](img/image00887.jpeg)\n\n为什么这个调用对编译器来说仍然是模糊的？显然有一个 `ABDerived` 可以访问的\
  \ `foo`。\n\n\n\n嗯，它不应该是这样的。遗憾的是，它在我运行的 Visual Studio 版本中可以编译并运行，尽管有一个工具提示警告写着“*基类\
  \ Base 是歧义的*”。这意味着它理解了调用的歧义性，但即使在较高的警告级别下，它似乎也没有发出警告。\n\n## 基类函数访问\n\n所以你看，这里的真正问题在于我们的类层次结构实际上是这样的：\n\
  \n![](img/image00891.jpeg)\n\n我们有两个 `Base` 的实例，我们需要显式地告诉编译器我们想要使用哪一个。对于 `var`，我们理解这一点。有两个\
  \ `var`，一个值为 1，另一个为 2。我们也理解了 `foo` 调用的歧义性。有两个重写版本。但如果我们没有在派生类中重写函数 `foo` 呢？像这样：\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass Base\n{\npublic:\n\
  int var;\nBase(int val) : var(val)\n{}\n\nvoid foo()\n{\ncout << \"Class Base foo()\"\
  \ << endl;\n}\n};\n\nclass Derived_A : public Base\n{\npublic:\nDerived_A(int val)\
  \ : Base(val)\n{}\n};\n\nclass Derived_B : public Base\n{\npublic:\nDerived_B(int\
  \ val) : Base(val)\n{}\n};\n\nclass Derived_AB : public Derived_A, public Derived_B\n\
  {\npublic:\nDerived_AB(int var1, int var2) : Derived_A(var1), Derived_B(var2)\n\
  {}\n};\n\nint main(int argc, char** argv)\n{\nDerived_AB ABDerObj(1, 2);\naBDerObj.foo();\n\
  return 0;\n}\n```\n\n![](img/image00886.jpeg)\n\n函数 `foo` 不应该有任何歧义，对吧？因为 `foo` 在任何地方都没有被重写，`Base`\
  \ 类是唯一包含 `foo` 实现的地方，而且函数不是实例特定的。它们是类特定的。所以 `foo` 应该只有一个版本。那么为什么对 `foo` 的调用仍然是歧义的？\n\
  \n你看，编译器实际上有两个可以调用的 `foo` 版本。记住，类的每个成员函数都有一个由编译器传递的隐式 `this` 参数。这就是为什么你可以在成员函数中访问特定对象的变量。所以，对\
  \ `foo` 的调用有一个由编译器传递的隐式 `Base` 参数。问题是，正如我们看到的，我们的 `Derived_AB` 对象有两个 `Base` 子对象。那么应该将哪一个传递给\
  \ `foo` 呢？这就是编译器感到困惑的地方。因此，我们需要通过限定调用来显式指定我们想要传递哪个子对象。\n\n## 多重继承中的拷贝构造\n\n现在，这些多个基类实例不仅对于函数和成员变量的访问是个问题，它们在其他地方也可能会有问题，如下所示：\n\
  \n```cpp\nint main(int argc, char** argv)\n{\nDerived_AB ABDerObj(1, 2);\nBase BaseObj\
  \ = static_cast< Base&> (ABDerObj);\nreturn 0;\n}\n```\n\n在这里，我们正尝试使用 `Derived_AB`\
  \ 对象实例化一个 `Base` 对象。如果没有多重继承，就不会有任何问题。但现在存在歧义。\n\n![](img/image00892.jpeg)\n\n我们正在调用\
  \ `Base` 拷贝构造函数，它接收一个类型为 `Base &` 的参数。这里的问题是 `Derived_AB` 对象有两个 `Base` 对象实例。编译器应该使用哪一个？一如既往，我们需要显式地告诉它。\n\
  \n```cpp\nint main(int argc, char** argv)\n{\nDerived_AB ABDerObj(1, 2);\nBase BaseObj\
  \ = static_cast<Derived_B&> (ABDerObj);\nreturn 0;\n}\n```\n\n`BaseObj.var: 2`\n\
  \n我们将对象强制转换为 `Derived_B` 实例。你可以看到，编译器确实复制了正确的 `Base` 实例，即 `var` 值为 2 的那个。\n\n##\
  \ 虚继承\n\n现在有一种机制可以避免所有这些混乱的限定访问和歧义性。它被称为 `虚继承`（virtual inheritance）。\n\n让我们看看当我们实例化一个\
  \ `Derived_AB` 对象时，我们的菱形类层次结构中到底发生了什么。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass Base\n{\npublic:\nint var;\nBase(int val) : var(val)\n{\ncout <<\
  \ \"Base constructor with var: \" << var << endl;\n}\nvoid foo()\n{\ncout << \"\
  Class Base foo()\" << endl;\n}\n};\n\nclass Derived_A : public Base\n{\npublic:\n\
  Derived_A(int val) : Base(val)\n{\ncout << \"Derived_A constructor.\" << endl;\n\
  }\n};\n\nclass Derived_B : public Base\n{\npublic:\nDerived_B(int val) : Base(val)\n\
  {\ncout << \"Derived_B constructor.\" << endl;\n}\n};\n\nclass Derived_AB : public\
  \ Derived_A, public Derived_B\n{\npublic:\nDerived_AB(int var1, int var2) : Derived_A(var1),\
  \ Derived_B(var2)\n{\ncout << \"Derived_AB constructor.\" << endl;\n}\n};\n\nint\
  \ main(int argc, char** argv)\n{\nDerived_AB ABDerObj(1, 2);\nreturn 0;\n}\n```\n\
  \nBase constructor with var: 1\nDerived_A constructor.\nBase constructor with var:\
  \ 2\nDerived_B constructor.\nDerived_AB constructor.\n\nBase constructor with var:\
  \ 1\nDerived_A constructor.\nBase constructor with var: 2\nDerived_B constructor.\n\
  Derived_AB constructor.\n\n看看对象构造的顺序。首先，`Base` 构造函数由 `Derived_A` 构造函数调用，然后 `Base`\
  \ 构造函数由 `Derived_B` 构造函数调用，最后是 `Derived_AB` 构造函数。\n\n所以我们现在确认了在多重继承中，如果存在共享基类，该基类会被构造多次。这正是我们想要避免的。\n\
  \nBase constructor with var: 1\nDerived_A constructor.\nBase constructor with var:\
  \ 2\nDerived_B constructor.\nDerived_AB constructor.\n\nBase constructor with var:\
  \ 1\nDerived_A constructor.\nBase constructor with var: 2\nDerived_B constructor.\n\
  Derived_AB constructor.\n\nBase constructor with var: 1\nDerived_A constructor.\n\
  Base constructor with var: 2\nDerived_B constructor.\nDerived_AB constructor.\n\n\
  Base constructor with var: 1\nDerived_A constructor.\nBase constructor with var:\
  \ 2\nDerived_B constructor.\nDerived_AB constructor.\n\nBase constructor with var:\
  \ 1\nDerived_A constructor.\nBase constructor with var: 2\nDerived_B constructor.\n\
  Derived_AB constructor.\n\nBase constructor with var: 1\nDerived_A constructor.\n\
  Base constructor with var: 2\nDerived_B constructor.\nDerived_AB constructor.\n\n\
  Base constructor with var: 1\nDerived_A constructor.\nBase constructor with var:\
  \ 2\nDerived_B constructor.\nDerived_AB constructor.\n\nBase constructor with var:\
  \ 1\nDerived_A constructor.\nBase constructor with var: 2\nDerived_B constructor.\n\
  Derived_AB constructor.\n\nBase constructor with var: 1\nDerived_A constructor.\n\
  Base constructor with var: 2\nDerived_B constructor.\nDerived_AB constructor.\n\n\
  Base constructor with var: 1\nDerived_A constructor.\nBase constructor with var:\
  \ 2\nDerived_B constructor.\nDerived_AB constructor.\n\nBase constructor with var:\
  \ 1\nDerived_A constructor.\nBase constructor with var: 2\nDerived_B constructor.\n\
  Derived_AB constructor.\n\nBase constructor with var: 1\nDerived_A constructor.\n\
  Base constructor with var: 2\nDerived_B constructor.\nDerived_AB constructor.\n\n\
  \n\n在虚继承下，虚基类（在我们的案例中为 `Base` 类）的构造函数不应该由虚继承自它的类的类调用。这意味着 `Derived_A` 和 `Derived_B`\
  \ 类的构造函数不应该调用 `Base` 类的构造函数，因为那意味着 `Base` 类将被构造多次。相反，在虚继承中，由最终的具体类负责调用虚基类的构造函数。具体类是指我们用来来实例化对象的类，在我们的案例中就是\
  \ `Derived_AB`。因此，编译器期望 `Derived_AB` 构造函数调用 `Base` 类的构造函数。由于我们没有在 `Derived_AB` 构造函数中对\
  \ `Base` 类的构造函数进行调用，编译器尝试调用 `Base` 的默认构造函数，但它并没有，因此导致编译器错误。让我们为 `Base` 类实现一个默认构造函数看看结果。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass Base\n{\npublic:\n\
  int var;\nBase()\n{\ncout << \"Base default constructor.\" << endl;\n}\n\nBase(int\
  \ val) : var(val)\n{\ncout << \"Base constructor with var: \" << var << endl;\n\
  }\n\nvoid foo()\n{\ncout << \"Base foo()\" << endl;\n}\n};\n\nclass Derived_A :\
  \ public virtual Base\n{\npublic:\nDerived_A(int val) : Base(val)\n{\ncout << \"\
  Derived_A constructor.\" << endl;\n}\n};\n\nclass Derived_B : public virtual Base\n\
  {\npublic:\nDerived_B(int val) : Base(val)\n{\ncout << \"Derived_B constructor.\"\
  \ << endl;\n}\n};\n\nclass Derived_AB : public Derived_A, public Derived_B\n{\n\
  public:\nDerived_AB(int var1, int var2) : Derived_A(var1), Derived_B(var2)\n{\n\
  cout << \"Derived_AB constructor.\" << endl;\n}\n};\n\nint main(int argc, char**\
  \ argv)\n{\nDerived_AB ABDerObj(1, 2);\nreturn 0;\n}\n```\n\nBase default constructor.\n\
  \nDerived_A constructor.\n\nDerived_B constructor.\nDerived_AB constructor.\n\n\
  它可以工作。编译器隐式地对 `Base` 类的默认构造函数进行了调用。然后调用了 `Derived_A` 和 `Derived_B` 构造函数。你注意到 `Derived_A`\
  \ 和 `Derived_B` 构造函数调用有什么之处？它们不再调用 `Base` 类的构造函数了。通常，派生类构造函数在执行自己的构造函数之前总是调用其基类构造函数。但在虚继承下的情况略有不同。我们之前讨论过派生类不应该调用基类构造函数，因为那意味着多个基类对象。因此，在虚继承中，编译器避免了从派生类到基类构造函数的调用。虚基类的构造函数只能由具体类调用。注意，这是派生类允许调用非直接基类类的构造函数的唯一场景。\n\
  \n因此，我们的示例应该如下所示调用。注意 `Derived_AB` 构造函数中对 `Base` 类构造函数的调用。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass Base\n{\npublic:\nint var;\nBase(int val) : var(val)\n\
  {\ncout << \"Base constructor with var: \" << var << endl;\n}\n\nvoid foo()\n{\n\
  cout << \"Base foo()\" << endl;\n}\n};\n\nclass Derived_A : public virtual Base\n\
  {\npublic:\nDerived_A(int val) : Base(val)\n{\ncout << \"Derived_A constructor.\"\
  \ << endl;\n}\n};\n\nclass Derived_B : public virtual Base\n{\npublic:\nDerived_B(int\
  \ val) : Base(val)\n{\ncout << \"Derived_B constructor.\" << endl;\n}\n};\n\nclass\
  \ Derived_AB : public Derived_A, public Derived_B\n{\npublic:\nDerived_AB(int var1,\
  \ int var2) : Base(1), Derived_A(var1), Derived_B(var2)\n{\ncout << \"Derived_AB\
  \ constructor.\" << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\nDerived_AB\
  \ ABDerObj(1, 2);\naBDerObj.var;\naBDerObj.foo();\nreturn 0;\n}\n```\n\nBase constructor\
  \ with var: 1\n\nDerived_A constructor.\n\nDerived_B constructor.\nDerived_AB constructor.\n\
  \nBase foo()\n\n编译器不再有歧义了。现在看看对象的结构。\n\n![](img/image00894.jpeg)\n\n将其与之前没有使用虚继承时的对象结构（所示）进行比较。\n\
  \n![](img/image00895.jpeg)\n\n在多重继承中，你可以看到在 `Derived_AB` 对象直接有一个独立的 `Base` 类子对象。尽管此视图显示在\
  \ `Derived_A` 和 `Derived_B` 下有 `Base` 类对象，但实际上并没有。只有一个 `Base` 子对象。这个结构描述的是，这个 `Base`\
  \ 子对象在逻辑上位于 `Derived_A` 和 `Derived_B` 内部。这意味着我们可以像之前在没有使用虚继承且有多个 `Base` 子对象时那样访问\
  \ `Base` 类。\n\n...\n\n...\n\n```cpp\nint main(int argc, char** argv)\n{\nDerived_AB\
  \ ABDerObj(1, 2);\naBDerObj.var;\naBDerObj.foo();\nreturn 0;\n}\n```\n\n\n\n\n```cpp\n\
  Base(int val) : var(val)\n{}\n};\n\nclass Derived_A : public virtual Base\n{\npublic:\n\
  \    Derived_A(int val) : Base(val)\n{}\n};\n\nclass Derived_B : public virtual\
  \ Base\n{\npublic:\n    Derived_B(int val) : Base(val)\n{}\n};\n\nclass Derived_AB\
  \ : public Derived_A, public Derived_B\n{\npublic:\n    Derived_AB(int var1, int\
  \ var2) : Base(1), Derived_A(var1), Derived_B(var2)\n{} // calling virtual Base\
  \ constructor here\n};\n\nclass Derived_C : public Derived_AB\n{\npublic:\n    Derived_D(int\
  \ var1, int var2) : Derived_AB(var1, var2)\n{}\n};\n\nint main(int argc, char**\
  \ argv)\n{\n    Derived_C CDerObj(1, 2);\n    return 0;\n}\n```\n\n![](img/image00898.jpeg)\n\
  \n编译器正在寻找 `Base` 的默认构造函数。这与之前我们在 `Derived_AB` 构造函数中没有调用 `Base` 类构造函数的情况是一样的。因此，编译器期望\
  \ `Derived_C` 调用虚基类构造函数。让我们添加构造函数调用：\n\n...\n...\n\n```cpp\nclass Derived_C : public\
  \ Derived_AB\n{\npublic:\n    Derived_C(int var1, int var2) : Base(10), Derived_AB(var1,\
  \ var2)\n{}\n};\n\nint main(int argc, char** argv)\n{\n    Derived_C CDerObj(1,\
  \ 2);\n    cout << \"CDerObj.var: \" << CDerObj.var << endl;\n    return 0;\n}\n\
  ```\n`CDerObj.var: 10`\n\n这种运行运行良好。这意味着什么呢？\n\n这意味着如果你在类层次结构中使用了虚继承，你必须从最派生类中调用虚基类的构造函数。那么，我们可以移除\
  \ `Derived_AB` 中对 `Base` 构造函数的调用吗？不能。\n\n...\n...\n\n```cpp\nclass Derived_AB :\
  \ public Derived_A, public Derived_B\n{\npublic:\n    Derived_AB(int var1, int var2)\
  \ : Derived_A(var1), Derived_B(var2) // No call to Base constructor\n{}\n};\n\n\
  class Derived_C : public Derived_AB\n{\npublic:\n    Derived_C(int var1, int var2)\
  \ : Base(10), Derived_AB(var1, var2)\n{}\n};\n\nint main(int argc, char** argv)\n\
  {\n    Derived_C CDerObj(1, 2);\n    cout << \"CDerObj.var: \" << CDerObj.var <<\
  \ endl;\n    return 0;\n}\n```\n![](img/image00899.jpeg)\n\n即使你没有实例化一个 `Derived_AB`\
  \ 对象，如果你的类继承自一个虚派生类，你也需要调用虚基类的构造函数。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass Base\n{\npublic:\n    int var;\n    Base(int val) : var(val)\n{}\n\
  };\n\nclass Derived_A : public virtual Base\n{\npublic:\n    Derived_A(int val)\
  \ : Base(val)\n{}\n};\n\nclass Derived_B : public virtual Base\n{\npublic:\n   \
  \ Derived_B(int val) : Base(val)\n{}\n};\n\nclass Derived_AB : public Derived_A,\
  \ public Derived_B\n{\npublic:\n    Derived_AB(int var1, int var2) : Base(10), Derived_A(var1),\
  \ Derived_B(var2)\n{}\n};\n\nclass Derived_C : public Derived_AB\n{\npublic:\n \
  \   Derived_C(int var1, int var2) : Base(20), Derived_AB(var1, var2)\n{}\n};\n\n\
  int main(int argc, char** argv)\n{\n    Derived_AB ABDerObj(1, 2);\n    cout <<\
  \ \"ABDerObj.var: \" << ABDerObj.var << endl;\n    Derived_C CDerObj(3, 4);\n  \
  \  cout << \"CDerObj.var: \" << CDerObj.var << endl;\n    return 0;\n}\n```\n`ABDerObj.var:\
  \ 10`\n`CDerObj.var: 20`\n\n看，你在 `Derived_AB` 中需要对 `Base` 的调用，因为如果你实例化一个 `Derived_AB`\
  \ 对象，那么就需要该调用。对于 `Derived_C` 对象，你不需要。但编译器并不知道你计划实例化哪些类，所以如果需要，它就希望你调用虚基构造函数。\n\n\
  这就是虚继承。\n\n# 主题 18: 强制转换 (Casting)\n\nC++ 引入了四种转换。这些转换在功能上与 C 风格的转换相同，但存在一些区别。转换也有许多特殊的用法，但在本主题中，我将讨论限制在最常用的转换类型。\n\
  \n以下是四种转换：\n\n* `static cast`\n* `dynamic cast`\n* `reinterpret cast`\n* `const\
  \ cast`\n\n在开始讨论转换之前，定义 `upcast`（向上转型）和 `downcast`（向下转型）是非常重要的。`upcast` 是在层次结构中向上进行转换，即从派生类转换为基类。`downcast`\
  \ 是从基类转换为派生类。\n\n## 静态转换 (Static cast)\n\n`static cast` 用于许多隐式转换。隐式转换由编译器自动完成，显式说明转换是不必要的。但当你想要让这一事实已知时，通常最好显式转换。`upcast`\
  \ 是隐式的，不需要 `static cast`。但 `downcast` 需要。\n\n```cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nclass Base {\n    int Base_ID;\npublic:\n    Base(int val) :\
  \ Base_ID(val)\n{}\n    void func()\n    {\n        cout << \"Base class func. ID:\
  \ \" << Base_ID << endl;\n    }\n};\n\nclass Derived : public Base {\n    int Derived_ID;\n\
  public:\n    Derived(int baseID, int derivedID) : Base(baseID), Derived_ID(derivedID)\n\
  {}\n    void func()\n    {\n        cout << \"Derived class func. ID: \" << Derived_ID\
  \ << endl;\n    }\n};\n\nint main(int argc, char** argv)\n{\n    Base* basePtr1\
  \ = new Base(1);\n    Derived* derivedPtr1 = new Derived(2, 3);\n    basePtr1->func();\n\
  \    derivedPtr1->func();\n    Base* basePtr2 = static_cast<Base*> (derivedPtr1);\n\
  \    basePtr2->func();\n    derivedPtr1->func();\n    Derived* derivedPtr2 = static_cast<Derived*>\
  \ (basePtr1);\n    basePtr2->func();\n    derivedPtr2->func();\n    return 0;\n\
  }\n```\n`Base class func. ID: 1`\n`Derived class func. ID: 3`\n`Base class func.\
  \ ID: 1`\n`Derived class func. ID: 3`\n`Base class func. ID: 1`\n`Derived class\
  \ func. ID: 3`\n`Base class func. ID: 2`\n`Derived class func. ID: -338609`\n\n\
  调用 `Derived` 版本的 `func` 的是因为函数不是对象的一部分。记得我们函数位于对象外部并与类类型绑定。因此，当我们通过 `Derived` 指针调用\
  \ `func` 时，编译器实际上调用了 `Derived::func`。它指向的对象类型是 `Base` 无关。该对象并不包含 `func` 的实现。\n\n\
  现在，如果 `func` 是虚函数，行为会发生什么变化？（我知道我们超出了主题，但这是重要的。）\n\n```cpp\nclass Base {\n    int\
  \ Base_ID;\npublic:\n    Base(int val) : Base_ID(val)\n{}\n    virtual void func()\n\
  \    {\n        cout << \"Base class func. ID: \" << Base_ID << endl;\n    }\n};\n\
  ```\n...\n...\n`Base class func. ID: 1`\n`Derived class func. ID: 3`\n`Derived class\
  \ func. ID: 3`\n\n\n\n\n\n# 基类 func. ID: 1\n\n我们在这里没有看到任何问题，尽管它的执行结果可能与我们的预期不符。前两次\
  \ `func` 调用没有虚函数的影响。第三次 `func` 调用是虚函数机制的一个经典示例：通过基类指针调用派生类重写的函数。最后一次调用虽然执行了正确的函数，但并不是使用虚函数的通常方式。如你所知，当一个函数是虚函数时，编译器会在编译期间避免绑定函数调用。要调用的函数是在运行时确定的。与\
  \ `func` 不是虚函数时不同，在这种情况下要调用的函数是通过 `vtable` 确定的。我们已经看到 `vtable` 是特定对象的。在我们的案例中，`basePtr1`\
  \ 指向 `Base` 对象，其 `vtable` 包含 `Base::func` 的实现。因此调用了 `Base` 版本的 `func`，并传递了一个 `Base`\
  \ 对象。这与之前相同，但现在 `func` 访问的是 `Base_ID` 而不是 `Derived_ID`，所以偏移量是正确的。\n\n如果我们省略 `static_casts`\
  \ 会怎样？\n\n```cpp\nint main(int argc, char** argv)\n{\nBase* basePtr1 = new Base(1);\n\
  Derived* derivedPtr1 = new Derived(2, 3);\nbasePtr1->func();\nderivedPtr1->func();\n\
  Base* basePtr2 = (derivedPtr1);               // 没有转换\nDerived* derivedPtr2 = (basePtr1);\
  \         // 没有转换\nbasePtr2->func();\nderivedPtr2->func();\nreturn 0;\n}\n```\n\n\
  ![](img/image00900.jpeg)\n\n所以你看到，向上转换（upcasting）是隐式的。你不需要对其进行 `static_cast`。但向下转换（downcast）需要。这是因为编译器知道将基类对象对象向下转换为派生类类型可能会出问题，因此它不会隐式地执行操作。但通过\
  \ `static_cast`，我们显式地告诉编译器我们知道自己在做什么。因为 `basePtr1` 很有可能指向一个 `Derived` 实例。如下：\n\n\
  ```cpp\nint main(int argc, char** argv)\n{\nBase* basePtr1 = new Derived(4, 5);\
  \ // Derived 对象\nDerived* derivedPtr1 = new Derived(2, 3);\nbasePtr1->func();\n\
  derivedPtr1->func();\nBase* basePtr2 = static_cast<Base*> (derivedPtr1);\nDerived*\
  \ derivedPtr2 = static_cast<Derived*> (basePtr1);\nbasePtr2->func();\nderivedPtr2->func();\n\
  return 0;\n}\n```\n\n# 基类 func. ID: 4\n派生类 func. ID: 3\n基类 func. ID: 2\n派生类 func.\
  \ ID: 5\n\n这种类型检查是 `static_cast` 的重要部分部分。它在编译期或运行时都不会进行任何类型检查。这就是为什么我们能够将 `Base`\
  \ 实例转换为 `Derived` 指针。但 `static_cast` 忽略了所有的检查吗？\n\n```cpp\n#include<iostream>\n\n\
  using namespace std;\n\nclass Base {\nint ID;\npublic:\nBase(int val) : ID(val)\n\
  {}\nvoid func()\n{\ncout << \"Base class func. ID: \" << ID << endl;\n}\n};\n\n\
  class Derived : public Base {\nint ID;\npublic:\nDerived(int baseID, int derivedID)\
  \ : Base(baseID), ID(derivedID)\n{}\nvoid func()\n{\ncout << \"Derived class func.\
  \ ID: \" << ID << endl;\n}\n};\n\nclass AnotherClass {\npublic:\nvoid func()\n{\n\
  cout << \"AnotherClass func.\" << endl;\n}\n};\n\nint main(int argc, char** argv)\n\
  {\nBase* basePtr1 = new Base(1);\nDerived* derivedPtr1 = new Derived(2, 3);\nAnotherClass*\
  \ anotherPtr = new AnotherClass;\nanotherPtr = static_cast<AnotherClass*> (basePtr1);\n\
  return 0;\n}\n```\n\n![](img/image00901.jpeg)\n\n在这里，我们尝试将 `Base` 指针转换为 `AnotherClass`\
  \ 指针，编译器对此并不满意。尽管我们能够将基类实例转换为派生类指针，但 `static_cast` 并不那么幼稚。它不允许我们在不同类型之间进行转换。而且在在使用对象时，它也不允许我们进行向下转换：\n\
  \n```cpp\nint main(int argc, char** argv)\n{\nBase baseObj1(1);\nDerived derivedObj1(2,\
  \ 3);\nbaseObj1.func();\nderivedObj1.func();\nBase baseObj2 = static_cast<Base>(derivedObj1);\n\
  Derived derivedObj2 = static_cast<Derived>(baseObj1);\nbaseObj2.func();\nderivedObj2.func();\n\
  return 0;\n}\n```\n\n![](img/image00902.jpeg)\n\n但就像指针一样，我们可以通过引用进行向下转换。\n\n```cpp\n\
  int main(int argc, char** argv)\n{\nBase baseObj1(1);\nDerived derivedObj1(2, 3);\n\
  Base& baseRef1 = baseObj1;\nDerived& derivedRef1 = derivedObj1;\nbaseRef1.func();\n\
  derivedRef1.func();\nBase& baseRef2 = static_cast<Base>(derivedObj1);\nDerived&\
  \ derivedRef2 = static_cast<Derived>(baseObj1);\nbaseRef2.func();\nderivedRef2.func();\n\
  return 0;\n}\n```\n\n基类 func. ID: 1\n派生类 func. ID: 3\n基类 func. ID: 2\n派生类 func.\
  \ ID: 5\n\n所以你看到，向上转换是隐式的。你不需要对其进行 `static_cast`。但向下转换需要。这是因为编译器知道将基类对象向下转换为派生类类型可能会出问题，因此它不会隐式地执行操作。但通过\
  \ `static_cast`，我们显式地告诉编译器我们知道自己在做什么。因为 `basePtr1` 很有可能指向一个 `Derived` 实例。\n\n\n\n\
  \n这次代码可以正常编译并运行，但你绝对会遇到运行时错误。这是因为我们正在对一个 `NULL` 指针进行解引用。让我们来看。\n\n```cpp\nint main(int\
  \ argc, char** argv)\n{\n    Base* basePtr1 = new Base(1);\n    Derived* derivedPtr1\
  \ = new Derived(2, 3);\n    basePtr1->func();\n    derivedPtr1->func();\n    Base*\
  \ basePtr2 = dynamic_cast<Base*> (derivedPtr1);\n    Derived* derivedPtr2 = dynamic_cast<Derived*>\
  \ (basePtr1);\n    if (basePtr2 == NULL)\n    {\n        cout << \"basePtr2 == NULL\"\
  \ << endl;\n    }\n    else\n    {\n        basePtr2->func();\n    }\n    if (derivedPtr2\
  \ == NULL)\n    {\n        cout << \"derivedPtr2 == NULL\" << endl;\n    }\n   \
  \ else\n    {\n        derivedPtr2->func();\n    }\n    return 0;\n}\n```\n基类 `func`。ID:\
  \ 1\n派生类 `func`。ID: 3\n派生类 `func`。ID: 3\n`derivedPtr2 == NULL`\n\n看，`derivedPtr2`\
  \ 是 NULL，而我们尝试对其解引用。这就是运行时错误的原因。\n\n但为什么 `derivedPtr2` 是 NULL 呢？这是因为 `dynamic_cast`\
  \ 在运行时进行的检查。`dynamic_cast` 会检查 `basePtr1` 指向的对象是否真的是 `Derived` 类型，如果不是，则返回 `NULL`\
  \ 指针。\n\n所以你可以看到，动态转换会检查转换类型与对象是否匹配，以确保转换是有效的。这是在运行时完成的，并使用对象的 `typeid` 来确定类型。现在让我们看看引用时会发生什么（提示：会有惊喜）。\n\
  \n```cpp\nint main(int argc, char** argv)\n{\n    Base baseObj1(1);\n    Derived\
  \ derivedObj1(2, 3);\n    Base& baseRef1 = baseObj1;\n    Derived& derivedRef1 =\
  \ derivedObj1;\n    baseRef1.func();\n    derivedRef1.func();\n    Base& baseRef2\
  \ = dynamic_cast<Base&>(derivedRef1);\n    Derived& derivedRef2 = dynamic_cast<Derived&>(baseRef1);\n\
  \    baseRef2.func();\n    derivedRef2.func();\n    return 0;\n}\n```\n这段代码也可以编译并运行，但会因为未处理的异常而崩溃。你可以看到，在转换指针时会返回\
  \ `NULL` 指针，而在转换引用时会抛出异常。让我们尝试捕获它。\n\n```cpp\nint main(int argc, char** argv)\n\
  {\n    Base baseObj1(1);\n    Derived derivedObj1(2, 3);\n    Base& baseRef1 = baseObj1;\n\
  \    Derived& derivedRef1 = derivedObj1;\n    baseRef1.func();\n    derivedRef1.func();\n\
  \    try\n    {\n        base& baseRef2 = dynamic_cast<Base&>(derivedRef1);\n  \
  \      Derived& derivedRef2 = dynamic_cast<Derived&>(baseRef1);\n        baseRef2.func();\n\
  \        derivedRef2.func();\n    }\n    catch (exception e)\n    {\n        cout\
  \ << e.what() << endl;\n    }\n    return 0;\n}\n```\n基类 `func`。ID: 1\n派生类 `func`。ID:\
  \ 3\nBad `dynamic_cast`!\n运行时抛出了 `bad cast` 异常。\n\n这就是动态转换的两个重要区别。如果转换类型不匹配，对于指针会返回\
  \ `NULL` 指针，对于引用则会抛出 `bad cast` 异常。那么对于像我们用 `static_cast` 向上转换的类型使用动态转换又会怎样？\n\n\
  ```cpp\nint main(int argc, char** argv)\n{\n    Base baseObj1(1);\n    Derived derivedObj1(2,\
  \ 3);\n    baseObj1.func();\n    derivedObj1.func();\n    Base baseObj2 = dynamic_cast<Base>(derivedObj1);\n\
  \    baseObj2.func();\n    return 0;\n}\n```\n![](img/image00906.jpeg)\n\n在这种情况下，`dynamic_cast`\
  \ 甚至不允许你进行向上转换，而这在 `static_cast` 中完全没问题的。这是因为 `dynamic_cast` 只能用于指针和引用。\n\n## Reinterpret\
  \ cast (重新解释转换)\n\n`reinterpret_cast` 是非常危险的。它会允许你做 `static_cast` 做不到的事情。`reinterpret_cast`\
  \ 字面上是让编译器将某些指针或引用解释为转换类型。不问任何理由。让我们来看一个 `static_cast` 的示例。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\nclass Base {\npublic:\n    int Base_ID;\n    Base(int val)\
  \ : Base_ID(val) {}\n    void func()\n    {\n        cout << \"Base class func.\
  \ ID: \" << Base_ID << endl;\n    }\n};\nclass AnotherClass {\npublic:\n    int\
  \ AnotherClass_ID;\n    AnotherClass(int val) : AnotherClass_ID(val) {}\n    void\
  \ func()\n    {\n        cout << \"AnotherClass func. ID: \" << AnotherClass_ID\
  \ << endl;\n    }\n};\nint main(int argc, char** argv)\n{\n    Base* basePtr1 =\
  \ new Base(10);\n    AnotherClass* anotherPtr = new AnotherClass(20);\n    anotherPtr\
  \ = static_cast<AnotherClass*>(basePtr1);\n    anotherPtr->func();\n    return 0;\n\
  }\n```\n![](img/image00907.jpeg)\n我们之前见过这个错误了。虽然 `static_cast` 可以用于向下转换，但它不允许我们将类型转换为不同的类类型。现在让我们尝试\
  \ `reinterpret_cast`。\n\n```cpp\nint main(int argc, char** argv)\n{\n    Base* basePtr1\
  \ = new Base(10);\n    AnotherClass* anotherPtr = new AnotherClass(20);\n    anotherPtr\
  \ = reinterpret_cast<AnotherClass*>(basePtr1);\n    anotherPtr->func();\n    return\
  \ 0;\n}\n```\nAnotherClass `func`。 AnotherClass_ID: 10\n它仅仅通过了编译，代码几乎可以工作！我们将 `Base`\
  \ 类型的指针赋值给了 `AnotherClass` 指针，并调用了 `AnotherClass` 中的函数。到此时你应该应该知道为什么调用了正确的函数但打印了错误的值。`reinterpret_cast`\
  \ 解释了为什么调用了正确的函数但打印了错误的值。它告诉编译器忽略类型检查并强制解释。\n\n## Const cast (常量转换)\n\n`const_cast`\
  \ 看起来简单，但它做了以前转换无法做的事情。`const_cast` 能够移除或添加指针或引用的常量属性。但理解何时不使用它很重要。让我们从一个简单的示例开始。\n\
  \n```cpp\nint main(int argc, char** argv)\n{\n    int non_const_int = 1;\n    const\
  \ int* const_int_ptr = &non_const_int;\n    *const_int_ptr = 2;\n    return 0;\n\
  }\n```\n\n![](img/image00909.jpeg)\n我们无法通过 `const_int_ptr` 修改 `non_const_int`，因为指针是常量的。这里我们可以使用\
  \ `const_cast`。\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main(int\
  \ argc, char** argv)\n{\n    int non_const_int = 1;\n    const int* const_int_ptr\
  \ = &non_const_int;\n    int* non_const_int_ptr = const_cast<int*>(const_int_ptr);\n\
  \    *non_const_int_ptr = 2;\n    cout << \"non_const_int: \" << non_const_int <<\
  \ endl;\n    return 0;\n}\n```\nnon_const_int: 2\n这里我们使用 `const_cast` 获取了一个没有常量属性的指针，并用它来修改\
  \ `non_const_int`。\n\n现在让我们看看 `const_cast` 在哪里失败。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\nint main(int argc, char** argv)\n{\n    const int const_int\
  \ = 1;\n    const int* const_int_ptr = &const_int;\n    int* non_const_int_ptr =\
  \ const_cast<int*>(const_int_ptr);\n    *non_const_int_ptr = 2;\n    cout << \"\
  const_int: \" << const_int << endl;\n    return 0;\n}\n```\nconst_int: 1\n由于 `const_int`\
  \ 本身是常量，所以这种修改是未定义的行为。\n\n\n\n确保值没有被改变。在这种情况下（Visual C++ 2013），代码编译并运行没有问题（除了值没有像我们希望的那样被修改），但实际上这种行为是未定义的。因此，你可能会在其他编译器上看到不同的结果。需要注意的是的是，你不能使用\
  \ `const_cast` 来修改声明为 `const` 的值。在这里，`*const_int` 被声明为常量。`const cast` 无法将其变为非常量。\n\
  \n我将把类型转换的话题到此为止。我们讨论了类型转换的基础和一些特殊情况。每种转换都有自己的用途，现在你应该知道在何时使用它们了。\n\n# 主题 19\n\n\
  ## 转换与提升\n\n转换（Conversion）是指将某种类型的值转换为另一种类型。提升（Promotion）在意义上与之相似，因为它也会改变值的类型，但它是被提升到了层级中更高的类型。我们将在本主题中介绍不同类型的转换和提升的示例。\n\
  \n在进入示例之前，你认为转换和提升发生在哪里？它们可能发生在以下情况：\n\n* 当使用操作符使用不同类型的操作数时\n* 当向函数传递参数时\n* 在初始化对象时\n\
  * 在 if/switch 语句中\n\n现在让我们通过示例来看这些情况。\n\n### 算术转换\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nvoid Func(short val)\n{\n\tcout << \"Short arg. Result:\
  \ \" << val << endl;\n}\n\nvoid Func(int val)\n{\n\tcout << \"Int arg. Result: \"\
  \ << val << endl;\n}\n\nvoid Func(float val)\n{\n\tcout << \"Float arg. Result:\
  \ \" << val << endl;\n}\n\nint main(int argc, char** argv)\n{\nshort shortVal =\
  \ 1;\nint intVal = 2;\nfloat floatVal = 3.0f;\n\nFunc(shortVal + intVal);\nFunc(shortVal\
  \ + floatVal);\nFunc(intVal + floatVal);\n\nreturn 0;\n}\n```\n\n```\nInt arg. Result:\
  \ 3\nFloat arg. Result: 4\nFloat arg. Result: 5\n```\n\n我们有三个不同的重载函数，接收 `short`、`int`\
  \ 和 `float` 类型的参数。然后我们对 `short`、`int` 和 `float` 类型进行加法运算并将它们作为参数传递给 `Func`。理解发生什么并不困难。当操作符获取不同类型的操作数时，需要转换其中一个操作数以将两个操作数转换为公共类型。例如，在将\
  \ `short` 和 `int` 传递给 `+` 操作符的情况下，`short` 操作数被转换为 `int`。结果是一个 `int`，然后传递给接收 `int`\
  \ 参数的函数。\n\n这些类型的转换被称为 `算术转换`（arithmetic conversions）。\n\n让我们再看几个涉及字符（char）和布尔值（bool）的算术转换示例。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid Func(bool val)\n{\n\
  \tcout << \"Bool arg. Result: \" << val << endl;\n}\n\nvoid Func(char val)\n{\n\t\
  cout << \"Char arg. Result: \" << val << endl;\n}\n\nvoid Func(short val)\n{\n\t\
  cout << \"Short arg. Result: \" << val << endl;\n}\n\nvoid Func(int val)\n{\n\t\
  cout << \"Int arg. Result: \" << val << endl;\n}\n\nint main(int argc, char** argv)\n\
  {\nbool boolVal = true;\nchar charVal = 'a';\nshort shortVal = 1;\nint intVal =\
  \ 2;\n\nFunc(charVal + boolVal);\nFunc(charVal + shortVal);\nFunc(charVal + charVal);\n\
  Func(shortVal + shortVal);\nFunc(charVal + intVal);\n\nreturn 0;\n}\n```\n\n```\n\
  Int arg. Result: 98\nInt arg. Result: 98\nInt arg. Result: 194\nInt arg. Result:\
  \ 2\nInt arg. Result: 99\n```\n\n你看到，所有的加法结果都得到了整数结果。因此，当操作数被转换时，它们并没有转换为两者之间较高的类型。例如，之前我们看到当\
  \ `short` 和 `int` 结果是 `int`。`short` 被转换为 `int`。但在这里，当我们加上两个 `chars` 或两个 `shorts`\
  \ 时，结果不是 `char` 或 `short`。它们是 `integers`（整数）。所以你可以看到，如果你在相两个比 `ints` 低的操作数，那么两个操作数在操作之前都会被转换为\
  \ `ints`。当你有比整数更大的类型时，情况就会不同。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nvoid Func(int val)\n{\n\tcout << \"Int arg. Result: \" << val << endl;\n}\n\n\
  void Func(float val)\n{\n\tcout << \"Float arg. Result: \" << val << endl;\n}\n\n\
  void Func(double val)\n{\n\tcout << \"double arg. Result: \" << val << endl;\n}\n\
  \nvoid Func(long int val)\n{\n\tcout << \"Long int arg. Result: \" << val << endl;\n\
  }\n\nvoid Func(long double val)\n{\n\tcout << \"Long double arg. Result: \" << val\
  \ << endl;\n}\n\nint main(int argc, char** argv)\n{\nint intVal = 1;\nfloat floatVal\
  \ = 2.0f;\ndouble doubleVal = 3;\nlong int lIntVal = 4;\nlong double lDoubleVal\
  \ = 5;\n\ncout << \"Func(intVal + intVal) - \"; Func(intVal + intVal);\ncout <<\
  \ \"Func(intVal + floatVal) - \"; Func(intVal + floatVal);\ncout << \"Func(intVal\
  \ + doubleVal) - \"; Func(intVal + doubleVal);\ncout << \"Func(intVal + lIntVal)\
  \ - \"; Func(intVal + lIntVal);\ncout << \"Func(intVal + lDoubleVal) - \"; Func(intVal\
  \ + lDoubleVal);\n\ncout << \"Func(floatVal + doubleVal) - \"; Func(floatVal + doubleVal);\n\
  cout << \"Func(floatVal + lIntVal) - \"; Func(floatVal + lIntVal);\ncout << \"Func(floatVal\
  \ + lDoubleVal) - \"; Func(floatVal + lDoubleVal);\n\nreturn 0;\n}\n```\n\n```\n\
  Func(intVal + intVal) - Int arg. Result: 2\nFunc(intVal + floatVal) - Float arg.\
  \ Result: 3\nFunc(intVal + doubleVal) - double arg. Result: 4\nFunc(intVal + lIntVal)\
  \ - Long int arg. Result: 5\nFunc(intVal + lDoubleVal) - Long double arg. Result:\
  \ 6\nFunc(floatVal + doubleVal) - double arg. Result: 5\nFunc(floatVal + lIntVal)\
  \ - Float arg. Result: 6\nFunc(floatVal + lDoubleVal) - Long double arg. Result:\
  \ 7\n```\n\n在这里我们查看更大的类型：float、double、long int 和 long double。转换与我们处理 chars 和 shorts\
  \ 时不同。你可以看到有一个顺序：`int`、`long int`、`float`、`double`、`long double`。当我们混合这些类型时，较小的类型会被转换为较大的类型。\n\
  \n现在让我们看看无符号类型（unsigned types）是如何发生算术转换的。\n\n```cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nvoid Func(int val)\n{\n\tcout << \"Int arg. Result: \" << val\
  \ << endl;\n}\n\nvoid Func(unsigned int val)\n{\n\tcout << \"Unsigned int arg. Result:\
  \ \" << val << endl;\n}\n\nvoid Func(float val)\n{\n\tcout << \"Float arg. Result:\
  \ \" << val << endl;\n}\n\nvoid Func(double val)\n{\n\tcout << \"Double arg. Result:\
  \ \" << val << endl;\n}\n\nint main(int argc, char** argv)\n{\nint intVal = -10;\n\
  unsigned int unsIntVal = 5;\nfloat floatVal = 1.0f;\ndouble doubleVal = 2;\n\ncout\
  \ << \"Func(intVal + unsIntVal) - \"; Func(intVal + unsIntVal);\ncout << \"Func(unsIntVal\
  \ + unsIntVal) - \"; Func(unsIntVal + unsIntVal);\ncout << \"Func(unsIntVal + floatVal)\
  \ - \"; Func(intVal + floatVal);\ncout << \"Func(unsIntVal + doubleVal) - \"; Func(unsIntVal\
  \ + doubleVal);\n\nreturn 0;\n}\n```\n\n```\nFunc(intVal + unsIntVal) - Unsigned\
  \ int arg. Result: 4294967291\nFunc(unsIntVal + unsIntVal) - Unsigned int arg. Result:\
  \ 10\nFunc(unsIntVal + floatVal) - Float arg. Result: -9\nFunc(unsIntVal + doubleVal)\
  \ - Double arg. Result: 7\n```\n\n\n\n我们有一个 `int`、一个 `unsigned int`、一个 `float` 和一个\
  \ `double`。这里需要注意的重要事实是，当你有一个 `int` 操数和一个 `unsigned int` 操作数时，`int` 会转换为 `unsigned`。你可以看到，有符号\
  \ `int` 和 `unsigned` 相加的结果并不是我们预期的。它给了我们一个非常大的值。这是因为当（有符号）`int` 转换为 `unsigned` 时，它的符号性丢失了。有符号整数的负值用补码表示，补码使用最高位来表示符号。因此，在这种情况下，当我们的\
  \ `int` 为 `-10` 时，最高位被设置为 1。当它被转换为 `unsigned` 时，这些位就形成了一个非常大的无符号值。这就是我们看到那个大值的原因。其余组合的行为符合我们的预期。`float`\
  \ 和 `double` 仍然比 `unsigned int` 大。因此，在将符号类型与 `unsigned` 混合时，你需要小心。\n\n## 函数参数转换\n\
  \n现在让我们来看第二种情况。如果我们没有一个接收 `unsigned` 类型参数的函数会怎样？\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nvoid Func(int val)\n{\n    cout << \"Int arg. Result:\
  \ \" << val << endl;\n}\n\nvoid Func(float val)\n{\n    cout << \"Float arg. Result:\
  \ \" << val << endl;\n}\n\nvoid Func(double val)\n{\n    cout << \"Double arg. Result:\
  \ \" << val << endl;\n}\n\nint main(int argc, char** argv)\n{\n    int intVal =\
  \ -10;\n    unsigned int unsIntVal = 5;\n    float floatVal = 1.0f;\n    double\
  \ doubleVal = 2;\n    cout << \"Func(intVal + unsIntVal) - \"; Func(intVal + unsIntVal);\n\
  \    cout << \"Func(unsIntVal + unsIntVal) - \"; Func(unsIntVal + unsIntVal);\n\
  \    return 0;\n}\n```\n\n![](img/image00910.jpeg)\n\n编译器面临歧义。你可以看到，加法的结果类型是 `unsigned`。当没有函数接收\
  \ `unsigned` 的函数时，编译器尝试将 `unsigned` 结果转换为已定义的函数类型。`unsigned` 可以转换为 `int` 类型，而我们有一个接收\
  \ `int` 的函数。歧义是因为我们还有两个接收 `floats` 和 `doubles` 的函数。`unsigned` 可以转换为 `int`，但随后 `int`\
  \ 可以转换为 `float` 或 `double`。因此，结果可以传递给这三个函数中的任何一个。这就是我们得到错误的原因。让我们只保留带有 `int` 参数的函数。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid Func(int val)\n{\n\
  \    cout << \"Int arg. Result: \" << val << endl;\n}\n\nint main(int argc, char**\
  \ argv)\n{\n    int intVal = -10;\n    unsigned int unsIntVal = 5;\n    float floatVal\
  \ = 1.0f;\n    double doubleVal = 2;\n    cout << \"Func(intVal + unsIntVal) - \"\
  ; Func(intVal + unsIntVal);\n    cout << \"Func(unsIntVal + unsIntVal) - \"; Func(unsIntVal\
  \ + unsIntVal);\n    return 0;\n}\n```\n\n`Func(intVal + unsIntVal) - Int arg. Result:\
  \ -5`\n`Func(unsIntVal + unsIntVal) - Int arg. Result: 10`\n\n没有问题。现在让我们只保留带有 `float`\
  \ 参数的函数。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid Func(int\
  \ val)\n{\n    cout << \"Int arg. Result: \" << val << endl;\n}\n\nint main(int\
  \ argc, char** argv)\n{\n    int intVal = -10;\n    unsigned int unsIntVal = 5;\n\
  \    cout << \"Func(intVal + unsIntVal) - \"; Func(intVal + unsIntVal);\n    cout\
  \ << \"Func(unsIntVal + unsIntVal) - \"; Func(unsIntVal + unsIntVal);\n    return\
  \ 0;\n}\n```\n\n`Func(intVal + unsIntVal) - Float arg. Result: 4.29497e+009`\n`Func(unsIntVal\
  \ + unsIntVal) - Float arg. Result: 10`\n\n结果被隐式转换为 `floats`。到 `float` 的转换发生在运算符结果之后。这就是为什么你看到一个很大的数字，因为有符号和无符号\
  \ `ints` 的结果是 `unsigned`，正如我们之前看到的，这是一个非常大的值。\n\n所以你在这里看到的是隐式函数参数转换。如果转换可能，编译器将把传递的参数转换为可用的函数参数类型。记住，如果没有提供正确的参数类型，编译器可能会进行转换，正如我们在上面的示例中看到的，这将产生完全出意之外的结果。在转换过程中，你也可能会丢失值的精度。当\
  \ `float` 转换为 `int` 时，小数部分会被丢弃。同样，`int` 可能无法精确地表示为 `float`。因此，当你有接收数值参数的函数以及算术运算符的结果类型时，你需要注意这一点。\n\
  \n## 对象实例化\n\n现在让我们讨论在实例化类时是如何进行转换的。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass conversion\n{\npublic:\n    float var;\n    conversion(float val)\
  \ : var(val)\n    {\n        cout << \"Constructor\" << endl;\n    }\n    conversion(int\
  \ val) : var(val)\n    {\n        cout << \"Constructor\" << endl;\n    }\n    conversion&\
  \ operator=(const conversion& other)\n    {\n        var = other.var;\n        cout\
  \ << \"Assignment operator\" << endl;\n        return *this;\n    }\n};\n\nint main(int\
  \ argc, char** argv)\n{\n    int intVal = -10;\n    unsigned int unsIntVal = 5;\n\
  \    float floatVal = 1.0f;\n    double doubleVal = 2;\n\n    cout << \"Line #1:\
  \ \"; conversion conv1(floatVal);\n    cout << \"Line #2: \"; conversion conv2(intVal);\n\
  \    cout << \"Line #3: \"; conversion conv3(unsIntVal);\n    cout << \"Line #4:\
  \ \"; conversion conv4(doubleVal);\n\n    cout << \"Line #5: \"; conv1 = conversion(intVal);\n\
  \    cout << \"Line #6: \"; conv2 = floatVal;\n\n    return 0;\n}\n```\n\n`Line\
  \ #1: Constructor`\n`Line #2: Constructor`\n`Line #3: Constructor`\n`Line #4: Constructor`\n\
  `Line #5: Assignment operator`\n`Line #6: Assignment operator`\n\n我们在这里看到的是赋值转换。\n\
  \n## 命名查找\n\n命名查找是查找名称正确声明的机制。命名查找可以用于函数、类型（包括内置）和枚举。当涉及多级继承、命名空间和模板时，命名查找可能会变得复杂。在本主题中，我们将查看访问函数或类型的基本命名查找。\n\
  \n所有的命名查找只有两种：\n\n*   限定查找\n*   未限定查找\n\n到目前为止我们使用了这两种类型。让我们从限定查找开始。\n\n### 限定限查找\n\
  \n当你使用作用域解析运算符 `::` 显式限定名称时就会发生限定查找。让我们先看一个使用命名空间的示例。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n\nnamespace A {\n    void foo()\n    {\n        cout << \"\
  A::foo()\" << endl;\n    }\n}\n\nint main(int argc, char** argv)\n{\n    foo();\n\
  \    return 0;\n}\n```\n\n![](img/image00911.jpeg)\n\n在这里我们声明了一个命名空间 `A` 并在该作用域内定义了函数\
  \ `foo`。然后我们在 `main` 中调用了 `foo`。注意这是一个未限定调用，因为我们没有用任何命名空间类型限定 `foo`。但我们不需要这样做对吧？因为只有一个\
  \ `foo`，它在命名空间 `A` 中。你看，即使 `foo` 被定义了，它不在作用域内。你需要显式将命名空间 `A` 引入作用域。你有两种方法可以：\n\n\
  *   使用 `using` 指令\n*   对调用限定\n\n如果我们想通过 `using` 指令将 `foo` 引入作用域：\n\n```cpp\nint\
  \ main(int argc, char** argv)\n{\n    using namespace A;\n    foo();\n    return\
  \ 0;\n}\n```\n\n`A::foo()`\n\n你不需要在调用函数之前使用 `using` 指令。它可以位于函数调用和命名空间定义之间的任何地方。\n\
  \n现在如果我们想限定函数调用可以这样做：\n\n```cpp\nint main(int argc, char** argv)\n{\n    A::foo();\
  \ // 限定调用\n    return 0;\n}\n```\n\n\n\n\n```cpp\nreturn 0;\n}\n```\n\n在我们继续进行限定名查找之前，先来聊一下命名空间。\n\
  \n## 命名空间\n\n如你在上面的示例所示，我们需要显式地将命名空间引入作用域。即使命名空间在同一个编译单元中，编译器也不会在其中进行查找。这就是为什么在使用\
  \ `cout` 和 `endl` 时，我们需要始终使用 `'using namespace std'`。如果我们删除了 `'using namespace std'`，将会得到：\n\
  \n![](img/image00912.jpeg)\n\n这些函数定义在 `iostream` 中，我们在编译单元中包含了它，但这是不够的。当函数或类型声明在命名空间内部时，你需要显式地将其引入作用域，或者对调用进行限定限定。因此，如果我们删除了\
  \ `'using namespace std'`，我们就必须对 `cout` 和 `endl` 的调用进行限定。\n\n```cpp\nnamespace A\
  \ {\n    void foo()\n    {\n        std::cout << \"A::foo()\" << std::endl; // 限定调用\n\
  \    }\n}\n```\n\n...\n\n...\n\n## 限定名查找\n\n所谓的限定名查找（Qualified name lookup）基本上就是对调用名进行限定。我们将在接下来的示例中从不同方面来看这个问题。\n\
  \n### 多命名空间\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid foo()\n\
  {\n    cout << \"::foo()\" << endl;\n}\n\nnamespace A {\n    void foo()\n    {\n\
  \        cout << \"A::foo()\" << endl;\n    }\n}\n\nnamespace B {\n    using namespace\
  \ A;\n    void foo(int val)\n    {\n        cout << \"B::foo(int)\" << endl;\n \
  \   }\n}\n\nint main(int argc, char** argv)\n{\n    b::foo(1);\n    return 0;\n\
  }\n```\n\n`B::foo(int)`\n\n这里有三个 `foo` 的实现：在全局作用域、命名空间 `A` 以及命名空间 `B` 中。注意 `B::foo(int)`\
  \ 是重载的，且命名空间 `B` 包含了命名空间 `A`。我们正在对 `B::foo(int)` 进行限定函数调用。编译器在命名空间 `B` 中定位它没有问题。现在我们想调用\
  \ `A::foo()`。我们需要对这次调用进行限定，因为全局作用域中还有另一个 `foo`。我们可以通过两种方式实现：首先可以用命名空间 `A` 限定，然后也可以通过命名空间\
  \ `B` 限定。注意命名空间 `B` 将命名空间 `A` 引入了它的作用域。\n\n…\n\n…\n\n```cpp\nint main(int argc,\
  \ char** argv)\n{\n    b::foo();\n    return 0;\n}\n```\n\n![](img/image00913.jpeg)\n\
  \n尽管编译器在查找 `B::foo()` 时似乎遇到了问题。但为什么呢？`A::foo()` 位于 `B` 的命名空间中。我们之前看到过可以通过 `'using'`\
  \ 指令将命名空间引入作用域。让我们做一个小小的修改：将函数名 `B::foo(int)` 改为不同的名称并尝试。\n\n…\n\n…\n\n```cpp\n\
  namespace B {\n    using namespace A;\n    void fooBar(int val)\n    {\n       \
  \ cout << \"B::fooBar(int)\" << endl;\n    }\n}\n```\n\n…\n\n…\n\n### `A::foo()`\n\
  \n当我们在命名空间 `B` 中更改函数名时，编译器在命名空间 `B` 中查找 `A::foo()` 没有遇到问题。发生了什么？\n\n问题在于，当我们用命名空间限定函数名时，编译器首先仅在该命名空间中搜索。在我们的案例中，编译器在命名空间\
  \ `B` 中搜索 `foo` 并找到了一个 `foo` 函数。但那个 `foo` 并不匹配我们的调用，因为它接受一个 `int` 参数。因此，编译器将其标记为错误，并报错没有接受\
  \ 0 个参数的 `foo` 函数。问题是，一旦编译器找到了 `foo` 的声明，它就会终止搜索。编译器不会继续寻找一个接受 0 个参数的函数 `foo`。一旦它找到了一个\
  \ `foo`，它就会尝试调用该函数。如果函数声明不符合调用，那么就是一个错误。那么，为什么当我们把函数名改为 `fooBar` 时，对 `B::foo()`\
  \ 的调用成功了呢？因为现在 `B` 命名空间中没有 `foo` 了，所以编译器现在会去搜索通过 `'using'` 指令引入的作用域中的命名空间。命名空间 `B`\
  \ 通过 `'using'` 指令引入了命名空间 `A`，编译器进入 `A` 查找 `foo` 并找到了它。所以记住，当我们限定名称时，编译器会首先检查限定的命名空间，只有当找不到它时，才会移动到包含其中的其他命名空间。\n\
  \n全局命名空间呢？迭代搜索最终会移动到全局作用域吗？让我们更改 `A::foo` 和 `B::foo` 的名称，只留下 `::foo`。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nvoid foo()\n{\n    cout << \"::foo()\"\
  \ << endl;\n}\n\nnamespace A {\n    void fooA()\n    {\n        cout << \"A::fooA()\"\
  \ << endl;\n    }\n}\n\nnamespace B {\n    using namespace A;\n    void fooB(int\
  \ val)\n    {\n        cout << \"B::fooB(int)\" << endl;\n    }\n}\n\nint main(int\
  \ argc, char** argv)\n{\n    b::foo();\n    return 0;\n}\n```\n\n![](img/image00914.jpeg)\n\
  \n不。编译器不会移动到全局命名空间。所以请记住，当你进行限定查找时，编译器只会搜索指定的命名空间及其包含的命名空间。尽管全局命名空间是……你知道的，全局的，但它并不包含其中。\n\
  \n让我们再添加两个命名空间。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid foo()\n\
  {\n    cout << \"::foo()\" << endl;\n}\n\nnamespace A {\n    void foo()\n    {\n\
  \        cout << \"A::foo()\" << endl;\n    }\n}\n\nnamespace B {\n    using namespace\
  \ A;\n    void foo(int val)\n    {\n        cout << \"B::foo(int)\" << endl;\n \
  \   }\n}\n\nnamespace C {\n    void foo(int val)\n    {\n        cout << \"C::foo(int)\"\
  \ << endl;\n    }\n}\n\nnamespace D {\n    using namespace B;\n    using C;\n}\n\
  \nint main(int argc, char** argv)\n{\n    d::foo(1);\n    return 0;\n}\n```\n\n\
  `C::foo(int)`\n\n现在我们在命名空间中只有两个 `foo` 实现（排除 `::foo`，因为全局命名空间未被查找）。对 `D::foo()` 的限定调用可以找到\
  \ `C::foo()` 或通过命名空间 `B` 找到 `A::foo()`。但你看，这里没有歧义。编译器将调用解析为 `C::foo()`。为什么没有找到 `A::foo()`？因为搜索没有到达那一层。由于没有\
  \ `D::foo()`，所以搜索向上移动了一层包含的命名空间，即 `C` 和 `B`，编译器在这些作用域中找到了 `C::foo()`。搜索停止并调用了 `C::foo()`。没有必要向上进入命名空间\
  \ `A`。如果没有函数 `C::foo()`，搜索将移动到包含的命名空间，在这种情况下是 `B` 的命名空间 `A`，并找到 `A::foo()`。如果相反存在\
  \ `C::foo(int)`，我们将得到关于 `C::foo(int)` 不接受 0 个参数的编译器错误。\n\n### 嵌套命名空间\n\n命名空间内部嵌套命名空间的情况如何？\n\
  \n```cpp\n#include<iostream>\n```\n\n\n\n\n\n```cpp\nusing namespace std;\n\nnamespace\
  \ A {\nvoid foo()\n{\n    cout << \"A::foo()\" << endl;\n}\n}\n\nnamespace B {\n\
  using namespace A;\nvoid fooB()\n{\n    cout << \"B::fooB()\" << endl;\n}\nnamespace\
  \ C {\nvoid foo()\n{\n    cout << \"B::C::foo()\" << endl;\n}\nvoid fooC()\n{\n\
  \    cout << \"B::C::fooC()\" << endl;\n}\n}\n}\n\nint main(int argc, char** argv)\n\
  {\n    // b::foo();\n    // b::fooC();\n    b::C::foo();\n    return 0;\n}\n```\n\
  \n![](img/image00917.jpeg)\n\n这里有一个命名空间 `A` 和命名空间 `B`，它包含了命名空间 `A`，然后命名空间 `C` 定义在\
  \ `B` 内部。命名空间 `C` 中也定义了 `foo()`。因此，在命名空间 `B` 中有两个 `foo` 函数。\n\n从编译器错误中可以看出，编译器找不到\
  \ `fooC`。虽然命名空间 `C` 定义在 `B` 内部，但 `C` 内部的函数不在作用范围内。如果我们注释掉 `B::fooC()`，就会得到：\n\n\
  `A::foo()`\n`B::C::foo()`\n\n所以你会发现，`B` 作用域内的 `foo` 只有 `A::foo`。`B::C::foo()` 不在作用范围内。如果我们想调用命名空间\
  \ `C` 中的函数，我们需要对调用进行限定。但看这个例子。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nnamespace A {\nvoid fooA()\n{\n    cout << \"A::fooA()\" << endl;\n}\n\
  }\n\nnamespace B {\nusing namespace A;\nvoid fooB()\n{\n    cout << \"B::fooB()\"\
  \ << endl;\n}\nnamespace C {\nvoid fooC()\n{\n    fooA();\n    fooB();\n}\n}\n}\n\
  \nint main(int argc, char** argv)\n{\n    b::C::fooC();\n    return 0;\n}\n```\n\
  `A::fooA()`\n`B::fooB()`\n\n即使命名空间 `C` 在命名空间 `B` 的作用范围内，`B` 中的所有内容（包括通过 'using'\
  \ 引入作用域的命名空间）都在命名空间 `C` 的作用范围内。\n\n这就是关于命名空间限定名查找常见用法的全部内容。记住在进行限定调用时，命名空间查找的迭代过程。这与我们进行未限定调用时发生的情况略有不同。\n\
  \n## 未限定名查找 (Unqualified name lookup)\n\n未限定名查找就是字面意思。它是在名称未经过限定时的名称查找。早些我们讨论了限定调用，即调用名称使用作用域解析运算符进行了限定的。而在限定名查找中，我们主要考虑命名空间，而未限定名查找完全关乎作用域。让我们从一个例子开始。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nnamespace A {\nint x = 1;\n\
  void foo1()\n{\n    cout << \"A::foo1 - x= << << x << endl;\n}\n}\n\nnamespace B\
  \ {\nint x = 2;\nvoid foo2()\n{\n    cout << \"B::foo2 - x =\" << x << endl;\n}\n\
  using namespace A;\nvoid foo3()\n{\n    cout << \"B::foo3 - x =\" << x << endl;\n\
  }\nnamespace C {\nvoid foo4()\n{\n    cout << \"B::C::foo4 - x =\" << x << endl;\n\
  }\nint x = 3;\nvoid foo5()\n{\n    cout << \"B::C::foo5 - x =\" << x << endl;\n\
  }\n}\n}\n}\n\nint main(int argc, char** argv)\n{\n    a::foo1();\n    // b::foo1();\n\
  \    b::foo2();\n    b::foo3();\n    b::C::foo4();\n    b::C::foo5();\n    return\
  \ 0;\n}\n```\n`A::foo1 - x= 1`\n`A::foo1 - x= 1`\n`B::foo2 - x =2`\n`B::foo3 - x\
  \ =2`\n`B::C::foo4 - x =2`\n`B::C::foo5 - x =3`\n\n理解这里发生了什么并不困难。我们正在尝试查看变量 `x`\
  \ 的作用边界。正如我们在上一个限定名查找的示例中看到的，内部命名空间的作用域包含了所属命名空间中的所有内容。因此，命名空间 `C` 的作用域内包含了 `B`\
  \ 中的变量 `x`。\n\n在限定名查找中，我们看到对命名空间进行迭代搜索。首先搜索限定的命名空间，如果未找到该名称，则搜索包含的命名空间，并一直持续直到找到它或到达最后一个命名空间。我们还看到搜索不会进入全局命名空间。同样的机制也发生在未限定查找中。名称的查找从当前作用域开始并向上传移动。\n\
  \n所以，当我之前提到内部命名空间的作用域内包含外部命名空间时，这实际上是不准确的。说最内层命名空间在其“作用域”内拥有外部命名空间是不正确的。它并没有。但未限定名查找的关键在于，名称查找会移动到外层作用域。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nnamespace A {\nint a = 1;\n\
