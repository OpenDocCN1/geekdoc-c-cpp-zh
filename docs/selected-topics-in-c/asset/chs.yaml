  \n。。。，\n，，，，，，，，，，，，，，，，。，。。。。翻译。。\n\n\n\n现在我们有两个命名空间 `A` 和 `B`，命名空间 `B` 中的 `fooB`\
  \ 正在尝试调用命名空间 `A` 中的 `fooA1`。编译器在搜索范围内没有找到 `fooA1`。但为什么呢？虽然我们向 `fooB` 传递了一个属于命名空间\
  \ `A` 的参数。看吧，它并不是这样工作的。函数本身必须接收一个带有该命名空间的参数。尽管 `A_struct` 被传递给了 `fooB`，但它并没有传递给\
  \ `fooA1`，因此编译器不会在 `A_struct` 的命名空间中查找 `fooA1`。那么 `fooA2` 呢？\n\n...\n\n```cpp\n\
  namespace B {\n\nstruct B_struct\n{};\n\nvoid fooB(A::A_struct structA)\n{\n   \
  \ cout << \"B::fooB calling fooA...\" << endl;\n    fooA2(structA);\n}\n\n}\n```\n\
  \n...\n\n`B::fooB calling fooA...`\n`A::fooA2`\n\n正如预期，现在编译器在命名空间 `A` 中中搜索 `fooA2`，因为我们传递了一个来自\
  \ `A` 的参数。这就是参数依赖查找（ADL）的基本机制。然而，这种机制存在一些局限性。\n\n#### 对内置类型参数不起作用：\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nnamespace A {\n\nint A_var = 1;\n\nstruct A_struct\n{};\n\
  \nvoid fooA1()\n{\n    cout << \"A::fooA1\" << endl;\n}\n\nvoid fooA2(int var)\n\
  {\n    cout << \"A::fooA2\" << endl;\n}\n\n};\n\nnamespace B {\n\nstruct B_struct\n\
  {};\n\nvoid fooB(A::A_struct structA)\n{\n    cout << \"B::fooB calling fooA...\"\
  \ << endl;\n    fooA2(A::A_var);\n}\n\n}\n\nint main(int argc, char** argv)\n{\n\
  \    a::A_struct structA;\n    b::fooB(structA);\n    return 0;\n}\n```\n\n![](img/image00921.jpeg)\n\
  \n我们将 `fooA2` 改为接收 `int` 参数而不是 `A::struct_A`，然后传递了命名空间 `A` 中的整型变量 `A_var`。显然，尽管我们传递了命名空间\
  \ `A` 中的 `int`，编译器在这种情况下并没有进入命名空间 `A`。因此，ADL 对内置类型无效。它对类类型有效（正如我们之前看到的 `struct`\
  \ 所示），也对枚举类型有效。有许多规则和条件控制着 ADL 查找，但让我们将讨论限制在 ADL 的常用用法上。\n\n#### 命名空间搜索不是迭代的：\n\n\
  在早先的限定名查找中，我们看到查找是在嵌套的命名空间中进行迭代搜索的。但对于 ADL 并非如此。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nnamespace A {\n\nstruct A_struct\n{};\n\nvoid fooA1()\n\
  {\n    cout << \"A::fooA1\" << endl;\n}\n\nvoid fooA2(A_struct)\n{\n    cout <<\
  \ \"A::fooA2\" << endl;\n}\n\nnamespace insideA {\n\nvoid fooA3(A_struct)\n{\n \
  \   cout << \"A::insideA::fooA3\" << endl;\n}\n\n}\n\nusing namespace insideA;\n\
  \n};\n\nnamespace B {\n\nstruct B_struct\n{};\n\nvoid fooB(A::A_struct structA)\n\
  {\n    cout << \"B::fooB calling fooA...\" << endl;\n    fooA3(structA);\n}\n\n\
  }\n\nint main(int argc, char** argv)\n{\n    a::A_struct structA;\n    b::fooB(structA);\n\
  \    return 0;\n}\n```\n\n![](img/image00922.jpeg)\n\n在这里我们在 `A` 内部定义了一个命名空间 `insideA`，并定义了接收\
  \ `A` 类型参数的 `fooA3`。但你会发现，尽管我们通过 `using` 指令包含了命名空间 `insideA`，编译器仍然无法找到它。因此，ADL 将搜索限制在参数所在的命名空间。\n\
  \n#### 类和命名空间的 ADL 不同：\n\n我们先看命名空间。我们在命名空间 `A` 中定义了函数 `foo`，在命名空间 `B` 中也定义了它，然后从命名空间\
  \ `B` 进行调用。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nnamespace A\
  \ {\n\nstruct A_struct\n{};\n\nvoid foo(A_struct)\n{\n    cout << \"A::foo\" <<\
  \ endl;\n}\n\n};\n\nnamespace B {\n\nvoid foo(A::A_struct)\n{\n    cout << \"B::foo\"\
  \ << endl;\n}\n\nvoid fooB(A::A_struct structA)\n{\n    cout << \"B::fooB calling\
  \ foo\" << endl;\n    foo(structA);\n}\n\n}\n\nint main(int argc, char** argv)\n\
  {\n    a::A_struct structA;\n    b::fooB(structA);\n    return 0;\n}\n```\n\n![](img/image00923.jpeg)\n\
  \n这里存在歧义，因为编译器找到了两个 `foo` 函数：当前作用域下的 `B::foo` 和通过 ADL 找到的 `A::foo`。\n\n但类的情况略有不同。让我们把同样的程序改为使用类而不是命名空间。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass A {\n\npublic:\n\n\
  struct A_struct\n{};\nstatic void foo(A_struct)\n{\n    cout << \"A::foo\" << endl;\n\
  }\n\n};\n\nclass B {\n\npublic:\n\nstatic void foo(A::A_struct)\n{\n    cout <<\
  \ \"B::foo\" << endl;\n}\n\nstatic void fooB(A::A_struct structA)\n{\n    cout <<\
  \ \"B::fooB calling foo\" << endl;\n    foo(structA);\n}\n\n};\n\nint main(int argc,\
  \ char** argv)\n{\n    A::A_struct structA;\n    B::fooB(structA);\n    return 0;\n\
  }\n```\n\n`B::fooB calling foo`\n\n`B::foo`\n\n对于类，没有歧义。编译器在当前作用域内找到了 `B::foo` 并调用它。因此，在处理类时，只有当编译器找不到类成员函数时，才会使用\
  \ ADL。\n\n"
