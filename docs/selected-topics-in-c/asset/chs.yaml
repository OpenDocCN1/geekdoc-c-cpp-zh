  \ `__vfptr` 指针位于对象的起始，这显然是 Visual C++ 的实现方式。\n\n## 虚函数表的构造\n\n我希望你对虚机制的实现有了良好的基础理解（至少在\
  \ Visual C++ 中是如何实现的）。在我们结束这个话题之前，让我们快速看看 `vptrs` 在对象构造期间是如何被构建的。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass baseClass\n{\npublic:\nbaseClass()\n{\nvoid(**vtPtr)()\
