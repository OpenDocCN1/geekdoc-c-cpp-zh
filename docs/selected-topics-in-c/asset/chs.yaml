  \ `dcPtr` 正指向它。\n\n### 但我们在代码的这部分具体在执行什么？\n\n```cpp\n*(void(***)())dcPtr\n```\n\n\
  `*(void(***)())` 仅仅是一个类型转换。什么类型的转换？一个“指向指针指向指针指向函数的指针”。对吧？这就是 `dcPtr` 的类型。我们在这里所做的，是告诉编译器\
  \ `dcPtr` 是一个“指向指针指向指针指向函数的指针”。此此。然后我们对它进行一次解引用。仅一次。当你解引用 `dcPtr` 一次时你会得到什么？看这张图。如果我们对\
  \ `dcPtr` 解引用一次，我们得到了 'vtable'。它是什么？是的，一个“指向指针指向函数的指针”。这正是我们需要赋值给 `vtPtr` 的内容。\n\
  \n语法看起来相当复杂，但如果你把它分层来看，其实没什么了。我们所做的只是将 `dcPtr` 转换为“指向指针指向指针指向函数的指针”，然后对其解引用以获取对象的\
  \ 'vtable'，这正是我们想要的。现在让我们看看如何通过 `vtable` 条目调用虚函数。\n\n在代码的其余部分，我们通过 `vtable` 调用虚函数。我们在代码中使用\
  \ `typedef` 来让调用看起来更像普通的函数调用，但让我们在不使用 `typedef` 的情况下重写那部分代码。我们需要清楚地理解这个函数指针是如何工作的。\n\
  \n那么 `vtPtr` 到底是什么？它是一个“指向指针指向函数的指针”。目前它指向 `vtable` 的第一个元素。所以为了调用 `vtable[0]` 处的函数指针，我们只需要解引用\
  \ `vtPtr`。你还记得我们是如何调用函数指针的吗？你不应该忘记括号。我们可以简单地调用第一个虚函数像如下：\n\n```cpp\n(*(*vtPtr))();\n\
  ```\n\n内部的解引用是为了获取 `vtable[0]`。由于 `vtable[0]` 是一个指向函数的指针，所以我们有了外层的解引用。但记得我们之前看到过，在函数指针的情况下，我们实际上不需要解引用函数指针本身。所以你可以直接执行以下操作：\n\
  \n```cpp\n(*vtPtr)();\n```\n\n为了获取其他指针，你只需要加一或二。由于 `vtPtr` 是一个指针，它会执行正确的指针算术来引用\
  \ `vtable[1]` 和 `vtable[2]`。让我们重写代码并确认我们是正确的。\n\n```cpp\nint main(int argc, char**\
  \ argv)\n{\n    derivedClass derivedClassObj;\n    derivedClass *dcPtr = new derivedClass;\n\
  \    cout << \"Invoking function through the object pointer\";\n    // ...\n```\n\
  *(注：由于原文提供的示例代码块在结尾处存在重复和乱码，翻译时根据语境保持了核心逻辑，消除了重复的输出。)*\n\n## 题 14：函数遮蔽 (Function\
  \ Shadowing)\n\n这不是一个大话题，但尽管如此是很重要的。在 C++ 中从一个例子开始。每个类都实现了 `foo`。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n\nclass A\n{\npublic:\n    void foo() {\n        cout << \"\
  foo in A\" << endl;\n    }\n};\n\nclass B : public A\n{\npublic:\n    void foo(int\
  \ val) {\n        cout << \"foo(int) in B\" << endl;\n    }\n    void foo(int val1,\
  \ int val2) {\n        cout << \"foo(int, int) in B\" << endl;\n    }\n};\n\nclass\
  \ C : public B\n{\npublic:\n    void foo(string str) {\n        cout << \"foo(string)\
  \ in C\" << endl;\n    }\n};\n\nint main(int argc, char** argv)\n{\n    A classAobj;\n\
  \    B classBobj;\n    C classCobj;\n    classAobj.foo(); // 行 1\n    classBobj.foo();\
  \ // 行 2\n    classBobj.foo(1); // 行 3\n    classBobj.foo(1, 2); // 行 4\n    classCobj.foo();\
  \ // 行 5\n    classCobj.foo(1); // 行 6\n    classCobj.foo(1, 2); // 行 7\n    classCobj.foo(\"\
  foo\"); // 行 8\n    return 0;\n}\n```\n\n\n\n\n这些错误都说明了什么？它们说明编译器简单地找不到我们想要的 `foo`\
  \ 函数。但我们知道这些函数已经正确地继承并是可以访问的。它们只是被遮蔽（shadowed）了。它们被同名的重载函数所遮蔽。每当我们重载一个继承而来的函数时，所有具有相同函数名的基类函数都会被遮蔽。但是，某些东西处于阴影中并不意味着它们不存在。这些函数是在那儿的。我们只需要告诉编译器那些函数存在。这样做非常简单。让我们来修复它。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass A\n{\npublic:\n  \
  \  void foo()\n    {\n        cout << \"Function foo in class A\" << endl;\n   \
  \ }\n};\n\nclass B : public A\n{\npublic:\n    using A::foo;\n    void foo(int val)\n\
  \    {\n        cout << \"Function foo(int) in class B\" << endl;\n    }\n    void\
  \ foo(int val1, int val2)\n    {\n        cout << \"Function foo(int, int) in class\
  \ B\" << endl;\n    }\n};\n\nclass C : public B\n{\npublic:\n    using B::foo;\n\
  \    void foo(string str)\n    {\n        cout << \"Function foo(string) in class\
  \ C\" << endl;\n    }\n};\n\nint main(int argc, char** argv)\n{\n    A classAobj;\n\
  \    B classBobj;\n    C classCobj;\n    classAobj.foo();\n    classBobj.foo();\n\
  \    classBobj.foo(1);\n    classBobj.foo(1, 2);\n    classCobj.foo();\n    classCobj.foo(1);\n\
  \    classCobj.foo(1, 2);\n    classCobj.foo(\"foo\");\n    return 0;\n}\n```\n\n\
  ```\nFunction foo in class A\nFunction foo in class A\nFunction foo(int) in class\
  \ B\nFunction foo(int, int) in class B\nFunction foo in class A\nFunction foo(int)\
  \ in class B\nFunction foo(int, int) in class B\nFunction foo(string) in class C\n\
  ```\n\n我们只需要使用 `using` 指令将我们需要的函数引入作用域。这与我们说 `using namespace std` 时做的是相同的事情。我们只是将那些定义引入到我们需要它们的作用域中。所以，当我们说\
  \ `using A::foo` 时，我们将类 `A` 中定义的所有 `foo` 函数引入了类 `B`。我们在类 `C` 中也执行了同样的操作。注意，我们只将\
  \ `B::foo` 引入了类 `C` 的作用域，尽管我们正在使用类 `A::foo`。我们不需要这样做，因为类 `A::foo` 已经在 `B` 的作用域中了，所以\
  \ `B::foo` 的作用域中已经包含了 `A::foo`。\n\n现在这里有一个重要的点。你放置 `using` 指令的位置很重要。让我们这样修改类 `C`，使得\
  \ `using` 指令在公共声明之前被调用。\n\n...\n...\n\n```cpp\nclass C : public B\n{\n    using\
  \ B::foo; // 在声明公共成员之前\npublic:\n    void foo(string str)\n    {\n        cout <<\
  \ \"Function foo(string) in class C\" << endl;\n    }\n};\n```\n\n…\n...\n\n![](img/image00881.jpeg)\n\
  \n现在编译器正在报错尝试访问私有方法。编译器现在完全意识到类 `A` 和 `B` 中的函数了，但不幸的是，这些函数被引入作用域时是私有的。这都是因为我们的 `using`\
  \ 指令在公共声明 之前。所以你会看到，`using` 指令只是关于将函数引入该作用域，而我们将这些函数引入的位置很重要。由于函数是在我们声明公共成员之前被引入的，对于编译器来说，就好像这些来自\
  \ `A` 和 `B` 的 `foo` 函数被定义在类 `C` 的私有部分一样。函数是在那儿，编译器知道这一点，但我们没有对它们的访问权限。\n\n这就是函数遮蔽（function\
  \ shadowing）的全部。没什么特别的，但意识到当你重载基类函数时发生了什么是很重要的。在我们离开这个话题之前，你认为认为如果函数 `foo` 是虚函数（virtual）的话，会有什么变化吗？不会的。因为虚函数是关于动态分发（dynamic\
  \ dispatching）。这是一个运行时机制，而不是编译时机制。在到达运行时之前，我们需要通过编译。函数遮蔽与虚函数之间没有关系。重载函数是不同的函数，所以\
  \ `foo()` 和 `foo(int)` 是不同的函数。`foo()` 是否为虚函数对 `foo(int, int)` 没有任何影响。\n\n## 主题 15\n\
  \n## 理解析构函数\n\n我们知道析构函数是什么以及它的作用，但让我们在这个主题中花些时间真正理解对象在析构阶段发生了什么。我们开始。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass A\n{\npublic:\n    A()\n   \
  \ {\n        cout << \"A constructor\" << endl;\n    }\n    ~A()\n    {\n      \
  \  cout << \"A destructor\" << endl;\n    }\n};\n\nclass B : public A\n{\npublic:\n\
  \    B()\n    {\n        cout << \"B constructor\" << endl;\n    }\n    ~B()\n \
  \   {\n        cout << \"B destructor\" << endl;\n    }\n};\n\nint main(int argc,\
  \ char** argv)\n{\n    B bobj;\n    return 0;\n}\n```\n\n```\nA constructor\nB constructor\n\
  B destructor\nA destructor\n```\n\n我们知道析构函数是什么以及它的作用，但让我们在这个主题中花些时间真正理解对象在析构阶段发生了什么。我们开始。\n\
  \n（由于提供的原文文本中存在部分重复和逻辑错乱，此处已根据指令“不要重复输出原文”的原则进行了清理，确保翻译逻辑的连贯性。）\n\n*注：基于提供的原始文本，后续内容的翻译如下：*\n\
  \n现在编译器正在报错尝试访问私有方法。编译器现在完全意识到类 `A` 和 `B` 中的函数了，但不幸的是，这些函数被引入作用域时是私有的。这都是因为我们的 `using`\
  \ 指令在公共声明 之前。所以你会看到，`using` 指令只是关于将函数引入该作用域，而我们将这些函数引入的位置很重要。由于函数是在我们声明公共成员之前被引入的，对于编译器来说，就好像这些来自\
  \ `A` 和 `B` 的 `foo` 函数被定义在类 `C` 的私有部分一样。函数是在那儿，编译器知道这一点，但我们没有对它们的访问权限。\n\n这就是函数遮蔽的全部。没什么特别的，但意识到当你重载基类函数时发生了什么是很重要的。在我们离开这个话题之前，你认为如果函数\
  \ `foo` 是虚函数的话，会有什么变化吗？不会的。因为虚函数是关于动态分发。这是一个运行时机制，而不是编译时机制。在到达运行时之前，我们需要通过编译。函数遮蔽与虚函数之间没有关系。重载函数是不同的函数，所以\
  \ `foo()` 和 `foo(int)` 是不同的函数。`foo()` 是否为虚函数对 `foo(int, int)` 没有任何影响。\n\n## 主题 15\n\
  \n## 理解析构函数\n\n我们知道析构函数是什么以及它的作用，但让我们在这个主题中花些时间真正理解对象在析构阶段发生了什么。我们开始。\n\n\n\n\n\
  当 `Bobj` 超出范围时，`B` 的析构函数会被调用，而该析构函数反过来又调用成员变量的析构函数。这就是为什么使用智能指针并采用“资源获取初始化”（RAII）的概念始终是一个好主意。\n\
  \n## 删除 `this`\n\n让我们用这个话题结束这个讨论：`'delete this'` 究竟在做什么什么？尝试一下吧。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass A\n{\n\npublic:\n\nA()\n{\ncout << \"A constructor\"\
  \ << endl;\n}\n\n~A()\n{\ncout << \"A destructor\" << endl;\n}\n\nvoid callDeleteThis()\n\
  {\ndelete this;\n}\n\n};\n\nint main(int argc, char** argv)\n{\nA Aobj;\naobj.callDeleteThis();\n\
  return 0;\n}\n```\n\nA constructor\n\nA destructor\n\n这不应该能够工作。结果取决于运行时系统，但你一定会遇到某种类型的运行时错误。不过，如果你在返回语句处设置断点，你就能看到上面显示的输出。\n\
  \n我们在这里尝试执行一个未定义的操作。那么`'delete this'` 到底做了什么？它只是调用了析构函数。仅此而已。为什么这会导致运行时错误呢？因为我们正尝试对一个已经析构的对象调用析构函数。当我们调用\
  \ `callDeleteThis` 时，析构函数首先被调用。当对象超出范围时，编译器隐式地调用 `Aobj` 的析构函数。但 `Aobj` 已经析构了。这是未定义行为。\n\
  \n那么显式地调用析构函数呢？你可以这样做吗？你当然可以。\n\n...\n\n...\n\n```cpp\nint main(int argc, char**\
  \ argv)\n{\nA Aobj;\naobj.~A();\nreturn 0;\n}\n```\n\n你现在注意到有什么不同了吗？这段代码没有发生任何运行时错误。它运行得良好。但我们的操作和之前执行\
  \ `'delete this'` 时做的是完全一样的事情，对吗？实际上，并不是。\n\n现在有一个注意事项：析构函数不会释放对象。析构函数只是另一个函数，用于在对象释放内存之前执行一些清理工作。但析构函数本身并不释放内存。在析构函数被调用后，对象的内存仍然完好地存在那里。对象在技术上仍然存在。这就是显式调用析构函数与通过\
  \ `operator delete` 调用它的区别。注意看，我们之前执行 `'delete this'` 时得到了运行时错误，但当我们显式调用析构函数时并没有出现问题。这是因为\
  \ `delete` 真正执行了内存释放的操作。所以 `operator delete` 有两个操作：\n\n*   首先调用析构函数，让它完成必要的清理工作。\n\
  *   释放对象的内存。\n\n`operator delete` 的功能听起来熟悉吗？这与 `operator new` 完全相反。`operator new`\
  \ 分配内存然后构造对象，而 `operator delete` 析构对象并释放内存。这里有一个例子。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass A\n{\n\npublic:\n\nint var;\nA() : var(10)\n{\n\
  cout << \"A constructor\" << endl;\n}\n\n~A()\n{\ncout << \"A destructor\" << endl;\n\
  }\n\nvoid callDeleteThis()\n{\ndelete this;\n}\n\n};\n\nint main(int argc, char**\
  \ argv)\n{\nA Aobj;\naobj.~A();\naobj.var = 20;\ncout << \"Aobj.A: \" << Aobj.var\
  \ << endl;\nreturn 0;\n}\n```\n\nA constructor\n\nA destructor\n\nAobj.A: 20\n\n\
  A destructor\n\n在这里我们构造了一个对象，然后（尝试）通过显式调用析构函数来析构它，然后给它的成员变量赋值并将其读取。整个过程中没有出现任何问题。现在你相信析构函数只是另一个函数了吗？它唯一的特殊之处是在对象被删除之前会被自动调用。\n\
  \n如果我们这样做，情况就不同了：\n\n```cpp\nint main(int argc, char** argv)\n{\nA Aobj;\naobj.callDeleteThis();\n\
  aobj.var = 20;\ncout << \"Aobj.A: \" << Aobj.var << endl;\nreturn 0;\n}\n```\n\n\
  这是一个运行时错误。为什么？因为我们通过 `delete` 析构了对象。这实际上释放了内存，所以对象不再存在。而我们试图访问一个不存在的对象，这导致了运行时错误。\n\
  \n那么，为什么我们需要显式地调用析构函数呢？你应该显式调用析构函数的情况并不多。一种你会显式调用析构函数的情况是：你想破坏对象但不释放内存时。我们什么时候想这样做呢？还记得\
  \ `'placement new'` 吗？即我们在已经分配的内存上构造新对象。这就是我们会显式调用析构函数的情况之一。我们显式调用析构函数来破坏对象，但不释放内存，然后使用\
  \ `placement new` 在该块内存上构造一个新对象。如下：\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass A\n{\n\npublic:\n\nint var;\nA(int val) : var(val)\n{\ncout << \"\
  A constructor\" << endl;\n}\n\n~A()\n{\ncout << \"A destructor: \" << var << endl;\n\
  }\n\n};\n\nint main(int argc, char** argv)\n{\nA* Aptr = new A(1);\ncout << \"Aptr->var:\
  \ \" << Aptr->var << endl;\n\naptr.~A();\ndelete Aptr;\nreturn 0;\n}\n```\n\n\n\n\
  \n- 比较运算符 – 大于 (`<`, `<=`)，小于 (`>`, `>=`)，等于 (`==`)\n\n## 一元运算符重载\n\n让我们先从一元运算符\
  \ `+` 的非成员函数开始起。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass\
  \ A\n{\n\npublic:\nint var;\nA(int val) : var(val)\n{}\n};\n\nA operator+(const\
  \ A& Aref)\n{\ncout << “Received value: “ << Aref.var << endl;\nreturn A(Aref.var\
  \ + 1);\n}\n\nint main(int argc, char** argv)\n{\nA Aobj1(20);\nA Aobj2(+Aobj1);\n\
  cout << “Aobj2.var: “ << Aobj2.var << endl;\nreturn 0;\n}\n```\n\n输出：\nReceived\
  \ value: 20\nAobj2.var: 21\n\n这种实现方式很容易理解。运算符 `+` 仅仅是增加了接收引用的值，并返回一个带有该值的对象。注意看我是如何在对象上调用运算符的，即\
  \ `*+Aobj1*`？运算符在对象的左侧。如果它在右侧呢，比如 `'Aobj1+*`？你不能这样做。你会得到一个类似于下面的错误：\n\n![](img/image00882.jpeg)\n\
  \n你能猜到发生了什么吗？你注意到运算符 `+` 既是一元运算符也是二元运算符吗？当运算符出现在右侧时，编译器会将其视为二元运算符 `+`。而二元运算符需要两个参数，左侧的一个和一个右侧的。当我们写\
  \ `*Aobj1+*` 时，编译器将其解析为二元运算符 `+`，并期望运算符右侧有第二个参数。这些编译错误是因为缺少该参数。当我们看二元运算符时就会变得清晰，但现在请记住，一元运算符必须在操作数的左侧。嗯，至少在大多数情况下是这样。\n\
  \n现在，我们如何作为成员函数来实现这个一元运算符 `+` 呢？这非常直接。当函数是非成员函数时，我们必须将类类型作为参数。由于这是一个一元运算符，所以只能有一个参数。当这个运算符重载函数是类的成员时，我们不再需要指定参数，因为每个成员函数都会获得一个隐式的\
  \ `*this*`。而 `*this*` 就是运算符所需的参数。所以对于一元运算符，我们不能有任何函数参数。这就是我们变成成员函数的方法。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass A\n{\n\npublic:\nint var;\n\
  A(int val) : var(val)\n{}\n\nA operator+()\n{\ncout << \"'this' value: \" << this->var\
  \ << endl;\nreturn A(this->var + 1);\n}\n};\n\nint main(int argc, char** argv)\n\
  {\nA Aobj1(20);\nA Aobj2(+Aobj1);\ncout << “Aobj2.var: “ << Aobj2.var << endl;\n\
  return 0;\n}\n```\n\n输出：\n'this' value: 20\nAobj2.var: 21\n\n看，没那么复杂。我们在非成员函数中的参数现在在成员函数中变成了隐式的\
  \ `*this*`。现在让我们快速看一眼递增递减运算符。你知道递增递减运算符有两个版本：前缀 (`prefix`) 和后缀 (`postfix`)。前缀是运算符在操作数的左侧，后缀是它在右侧。\n\
  \n### 前缀递增\n\n让我们在前缀递增。它和递增运算符没有区别。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass A\n{\n\npublic:\nint var;\nA(int val) : var(val)\n{}\n\nA operator++(A&\
  \ Aref)\n{\ncout << “Received value: “ << Aref.var << endl;\nreturn A(Aref.var +\
  \ 1);\n}\n\nint main(int argc, char** argv)\n{\nA Aobj1(1);\nA Aobj2(++Aobj1);\n\
  cout << “Aobj2.var: “ << Aobj2.var << endl;\nreturn 0;\n}\n```\n\n输出：\nReceived\
  \ value: 1\nAobj2.var: 2\n\n### 后缀递增\n\n我们如何实现后缀版本？因为从递增运算符需要在左侧。这种情况有特殊的处理方法。在重载的运算符中插入一个哑参数。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass A\n{\n\npublic:\n\
  int var;\nA(int val) : var(val)\n{}\n\nA operator++(A& Aref, int dummy)\n{\ncout\
  \ << “Received value: “ << Aref.var << endl;\nreturn A(Aref.var + 1);\n}\n\nint\
  \ main(int argc, char** argv)\n{\nA Aobj1(1);\nA Aobj2(Aobj1++);\ncout << “Aobj2.var:\
  \ “ << Aobj2.var << endl;\nreturn 0;\n}\n```\n\n输出：\nReceived value: 1\nAobj2.var:\
  \ 2\n\n很巧妙吧？但你一定对这个哑参数感到好奇。哑参数起什么作用？它必须是整数吗？我们在那里放了一个 `float`。这只是一个哑参数。类型重要吗？\n\n\
  ```cpp\nA operator++(A& Aref, float dummy)\n{\ncout << “Received value: “ << Aref.var\
  \ << endl;\nreturn A(Aref.var + 1);\n}\n```\n\n![](img/image00883.jpeg) 我们不能这样做。这是一堆错误，但看第一个错误。编译器说后缀运算符的第二个参数必须是\
  \ `int`。如果你想重载后缀运算符，必须让第二个操作数是 `int`。这就是规则。遵守它。\n\n现在你可能正在为了泛化运算符重载的规则而抓头。不要！试图为运算符重载寻找通用规则。某些运算符有特殊的重载签名。当我们重载\
  \ `new` 时这一点会变得清晰。记住这些运算符有重载的方式。你需要遵循这些方式。在递增递减运算符的情况下，第二个参数必须是 `int`。不是 `void`，只有\
  \ `int`。\n\n为了完成一元运算符，让我们看看如何作为成员函数实现后缀递减运算符。\n\n```cpp\n#include<iostream>\n\n\
  using namespace std;\n\nclass A\n{\n\npublic:\nint var;\nA(int val) : var(val)\n\
  {}\n\nA operator--(int dummy)\n{\ncout << \"Received value: \" << this->var << endl;\n\
  return A(this->var - 1);\n}\n};\n\nint main(int argc, char** argv)\n{\nA Aobj1(1);\n\
  A Aobj2(Aobj1--);\ncout << \"Aobj2.var: \" << Aobj2.var << endl;\nreturn 0;\n}\n\
  ```\n\n输出：\nReceived value: 1\nAobj2.var: 0\n\n## 二元运算符重载\n\n现在我们将开始重载二元运算符。让我们从\
  \ `+` 运算符开始。这是一个既可以作为一元运算符也可以作为二元运算符工作的运算符。我们先看非成员函数。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass A\n{\n\npublic:\nint var;\nA(int val) : var(val)\n\
  {}\n};\n\nA operator+(A& leftOp, A& rightOp)\n{\ncout << \"Received left: \" <<\
  \ leftOp.var << endl;\ncout << \"Received right: \" << rightOp.var << endl;\nreturn\
  \ A(leftOp.var + rightOp.var);\n}\n\nint main(int argc, char** argv)\n{\nA Aobj1(1);\n\
  A Aobj2(2);\nA Aobj3(Aobj1 + Aobj2);\ncout << \"Aobj3.var: \" << Aobj3.var << endl;\n\
  return 0;\n}\n```\n\n输出：\nReceived left: 1\nReceived right: 2\nAobj3.var: 3\n\n\
  由于这是二元运算符，你需要两个操作数。一个用于运算符左侧的操作数，另一个用于右侧的。注意函数参数与运算符操作数的关联是非常重要的。第一个参数 `leftOp`\
  \ 是位于运算符左侧的，而 `rightOp` 是位于右侧的。非常直观。记得我提到过不能对内置类型重载运算符吗？如果我们尝试这样做会发生什么？\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass A\n{\n\npublic:\nint var;\n\
  A(int val) : var(val)\n{}\n};\n\nA operator+(int leftOp, int rightOp)\n{\ncout <<\
  \ \"Received left: \" << leftOp << endl;\ncout << \"Received right: \" << rightOp\
  \ << endl;\nreturn A(leftOp + rightOp);\n}\n\nint main(int argc, char** argv)\n\
  {\nA Aobj(1 + 2);\ncout << \"Aobj.var: \" << Aobj.var << endl;\nreturn 0;\n}\n```\n\
  \n![](img/image00884.jpeg) 我们不能这样做。那么“必须有一个形式参数”意味着什么？它意味着当你重载运算符时，它必须有一个形式参数。也就是说，一个自定义类型。而不是内置类型。这是否意味着我们可以有一个类类型参数和一个内置类型？是的。\n\
  \n```cpp\nA operator+(A& leftOp, int rightOp)\n{\ncout << \"Received left: \" <<\
  \ leftOp.var << endl;\ncout << \"Received right: \" << rightOp << endl;\nreturn\
  \ A(leftOp.var + rightOp);\n}\n```\n\n\n\n\n\n## 代码分析\n\n```cpp\ncout << \"Aobj2.var:\
  \ \" << Aobj2.var << endl;\n\nreturn 0;\n\n}\n```\n\n接收到的左侧: 1\n\n接收到的右侧: 2\n\n\
  Aobj3.var: 3\n\n因此你可以让类类型与内置类型配合。但请确保你拥有操作数关联性。在上面的示例中，左操作数必须是我们的类类型。不能反过来过来。也就是说，我们不能写\
  \ `A Aobj2(2 + Aobj1)`。为了这一点，我们需要另一个重载的运算符 `A operator+(int leftOp, A& rightOp)`。\n\
  \n现在，如果写成成员函数的形式会是什么样？\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class A\n{\n\npublic:\nint var;\n\nA(int val) : var(val)\n{}\n\nA operator+(A& rightOp)\n\
  {\ncout << \"Received left: \" << this->var << endl;\ncout << \"Received right:\
  \ \" << rightOp.var << endl;\n\nreturn A(this->var + rightOp.var);}\n\n};\n\nint\
  \ main(int argc, char** argv)\n{\nA Aobj1(1);\nA Aobj2(2);\nA Aobj3(Aobj1 + Aobj2);\n\
  cout << \"Aobj3.var: \" << Aobj3.var << endl;\n\nreturn 0;\n}\n```\n\n接收到的左侧: 1\n\
  \n接收到的右侧: 2\n\nAobj3.var: 3\n\n记住，我们讨论过成员函数总是有一个隐式的 `this` 指针，它对应于调用函数的对象。这里也是一样。运算符的左操作数变成了\
  \ `this`。在我们的示例中，我们正在调用对象 `Aobj1` 的运算符，而 `Aobj2` 变成了 `rightOp` 参数。当你发现实际上可以像调用成员函数一样调用重载的运算符时，这一点会变得更加清晰。\n\
  \n...\n\n...\n\n```cpp\nint main(int argc, char** argv)\n{\nA Aobj1(1);\nA Aobj2(2);\n\
  A Aobj3(Aobj1.operator+(Aobj2));\ncout << \"Aobj3.var: \" << Aobj3.var << endl;\n\
  \nreturn 0;\n}\n```\n\n你看到重载运算符仅仅是函数。编译器处理它们的方式略有不同，以便你可以像调用普通运算符一样调用它们。你真的想像调用\
  \ `Aobj1.operator+(Aobj2)` 这样调用 `+` 运算符吗？有什么意义呢？你宁愿定义一个成员函数 `A Plus(A& obj)` 来这样做。但这有助于澄清一点：它是在运算符左侧对象上调用的另一个成员函数。\n\
  \n现在，如果我们想要有一个成员函数，但带有一个 `int` 参数的呢？就像我们之前在非成员函数情况下讨论的那样 `A operator+(A& leftOp,\
  \ int rightOp)`？它在成员函数版本中将如何工作？我们完全可以制作一个左操作数为类类型的成员函数版本。\n\n...\n\n...\n\n```cpp\n\
  A operator+(int rightOp)\n{\ncout << \"Received left: \" << this->var << endl;\n\
  cout << \"Received right: \" << rightOp << endl;\n\nreturn A(this->var + rightOp);}\n\
  ```\n\n...\n\n...\n\n我们可以这样做是因为左操作数应该是类类型。但当我们想要实现一个以整数作为左操作数的成员函数时呢？也就是说，非成员函数\
  \ `A operator+(int leftOp, A& rightOp)` 的成员函数版本是什么？它不存在。这是你在成员函数方面的一个局限性。它对虚拟变量没有特殊处理。你无法通过成员函数做到这一点。如果你想重载加运算符以使内置类型成为左操作数，你必须使用非成员函数。\n\
  \n其他二元运算符的规则也是相同的：I/O 运算符和比较运算符。运算符的返回值没有限制。到目前为止，我们只看了返回对象的简单情况。但你可以根据运算符返回不同的类型。例如，在所有情况下，比较运算符都应该返回布尔值。但你可以自由返回任何值。\n\
  \n最后我们将查看另外两个某些特殊处理的运算符。\n\n### 函数运算符重载\n\n第一个是重载函数调用运算符 `()`，被称为函数运算符。它有非常巧妙的用例。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass A\n{\n\npublic:\n\
  int var;\n\nA(int val) : var(val)\n{}\n\nvoid operator() ()\n{\ncout << \"In overloaded\
  \ operator ()\" << endl;}};\n\nint main(int argc, char** argv)\n{\nA Aobj(1);\n\
  aobj();\n\nreturn 0;\n}\n```\n\n在重载的运算符 () 中\n\n你注意到我们是如何调用重载运算符的吗？很酷的语法，不是吗？而且我们并不局限于无参数函数。我们可以加载它。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass A\n{\n\npublic:\n\
  int var;\n\nA(int val) : var(val)\n{}\n\nvoid operator() (int a, int b)\n{\ncout\
  \ << \"In overloaded operator(): \" << a << \" and \" << b << endl;\n}\n\n};\n\n\
  int main(int argc, char** argv)\n{\nA Aobj(1);\naobj(1, 2);\n\nreturn 0;\n}\n```\n\
  \n\n\n\n在这里我给类又添加了两个 `int` 变量。这应该使 `A` 对象的大小的大小变为 12 字节（一个 `int` 是 32 位）。在 `operator\
  \ new` 中，它本应该分配 12 字节的堆内存，但它只分配了其中一半。因此，`operator new` 给 `new-expression` 的内存块没有足够的空间来放置三个\
  \ `ints`。随后，`new-expression` 就会在 8 字节的空间内构造这个 12 字节的对象，然后我们尝试访问最后一个 `int` 变量，这显然已经超出了对象的内存空间。这将会导致一个运行时错误。根据系统的不同，即使我们尝试访问第一个变量，也可能看到运行时失败，因为我们显然地违反了所分配的内存边界。所以，如果你正在重载\
  \ `operator new`，请确保你的实现是正确的。\n\n现在，在最后一部分，让我们看看如何为自定义的签名重载 `new` 算符。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass A\n{\npublic:\nint var;\nA(int\
  \ val) : var(val)\n{}\nvoid* operator new(size_t count, int var1, int var2, bool\
  \ state)\n{\n    if (state)\n    {\n        cout << \"TRUE state: var1- \" << var1\
  \ << \", var2- \" << var2 << endl;\n    }\n    return ::operator new(count);\n}\n\
  };\n\nint main(int argc, char** argv)\n{\nA* Aptr = new (1, 2, true) A(1);\nreturn\
  \ 0;\n}\n```\n`TRUE state: var1- 1, var2- 2`\n\n你看到，你可以向重载的 `operator new` 传递任意数量的参数。第一个参数\
  \ `count` 总是由 `new-expression` 隐式传递。然而，其余参数需要作为列表的形式在操作数之前传递。注意我们是如何传递参数列表的。它在操作数之前。这看起来很奇怪，但请记住，编译器有它处理算符重载的方法。请记住你不需要传递第一个参数，因为它是由\
  \ `new-expression` 传递的。\n\n希望你已经理解了算符重载是如何工作的，以及这种机制在让算符执行符合你需求的定制化功能方面是多么强大。\n\n\
  # 主题 17：多重继承\n\n如果处理当，多重继承可以是一项强大的特性。但继承层级越长，就越容易出错。本主题将快速讨论多重继承、可怕的“菱形问题”以及虚继承。\n\
  \n这是一个简单的多重继承示例。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass\
  \ A\n{\npublic:\nint var;\nA(int val) : var(val)\n{}\nvoid foo()\n{\n    cout <<\
  \ \"Class A foo()\" << endl;\n}\n};\n\nclass B\n{\npublic:\nint var;\nB(int val)\
  \ : var(val)\n{}\nvoid foo()\n{\n    cout << \"Class B foo()\" << endl;\n}\n};\n\
  \nclass ABDerived : public A, public B\n{\npublic:\nABDerived(int var1, int var2)\
  \ : A(var1), B(var2)\n{}\n};\n\nint main(int argc, char** argv)\n{\nABDerived ABDerObj(1,\
  \ 2);\naBDerObj.foo();\nreturn 0;\n}\n```\n\n类 `A` 和 `B` 拥有它们共享的成员名称，`var` 和 `foo`。你知道这将带来麻烦。类\
  \ `ABDerived` 可以访问类 `A` 和 `B` 两个类的函数 `foo`。那么我们调用的是哪一个 `foo` 呢？幸运的是，编译器不会随机选择一个。它会报错说不知道选择哪一个。\n\
  \n![](img/image00886.jpeg)\n\n我们需要做的只是通过使用类名正确地限定调用，告诉编译器我们想要调用哪一个 `foo`。\n\n```cpp\n\
  int main(int argc, char** argv)\n{\nABDerived ABDerObj(1, 2);\naBDerObj.A::foo();\
  \         // 对函数进行限定\nreturn 0;\n}\n```\n`Class A foo()`\n\n如果 `foo` 在类 `A` 中是私有的呢？在这种情况下\
  \ `ABDerived` 只能访问 `B::foo`，所以我们不需要对 `foo` 的调用进行限定，对吧？不。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass A\n{\npublic:\nint var;\nA(int val) : var(val)\n\
  {}\nprivate:\nvoid foo()\n{\n    cout << \"Class A foo()\" << endl;\n}\n};\n\nclass\
  \ B\n{\npublic:\nint var;\nB(int val) : var(val)\n{}\nvoid foo()\n{\n    cout <<\
  \ \"Class B foo()\" << endl;\n}\n};\n\nclass ABDerived : public A, public B\n{\n\
  public:\nABDerived(int var1, int var2) : A(var1), B(var2)\n{}\n};\n\nint main(int\
  \ argc, char** argv)\n{\nABDerived ABDerObj(1, 2);\naBDerObj.foo();\nreturn 0;\n\
  }\n```\n![](img/image00887.jpeg)\n\n为什么这个调用对编译器来说仍然是模糊的？显然有一个 `ABDerived` 可以访问的\
  \ `foo`。这是因为 `ABDerived` 确实可以访问一个 `foo`。\n[/content]\n\n非常抱歉，我发现在翻译提供的文本时，我似乎混淆了你提供的“示例”和“需要翻译的文本”。\n\
