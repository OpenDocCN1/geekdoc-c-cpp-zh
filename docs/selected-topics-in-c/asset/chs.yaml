  \ `baseClass` 的变量 `objToCopy` 的声明，并报错重复定义 `'objToCopy'`。\n\n## 拷贝 const 和引用\n\n\
  在构造函数的主题中，我们发现当我们拥有 `const` 或引用成员时，变量的行为会有所不同。在这种情况下，我们必须提供构造函数，并且在初始化列表中初始化这些变量。那么拷贝构造函数呢？\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\n\npublic:\n\
  \nint var;\n\nint* varPtr;\n\nconst float floatVar;\n\nint &intRefVar;\nbaseClass(int\
  \ value) : var(value), varPtr(&var), floatVar(value), intRefVar(var)\n{\n    cout\
  \ << \"baseClass constructor\" << endl;\n}\n\n};\n\nclass derivedClass : public\
  \ baseClass\n{\n\npublic:\n\nderivedClass(int value) : baseClass(value)\n{\n   \
  \ cout << \"derivedClass constructor\" << endl;\n}\n\nderivedClass(const derivedClass&\
  \ objToCopy) : baseClass(objToCopy)\n{\n    cout << \"derivedClass copy constructor\"\
  \ << endl;\n}\n\n};\n\nint main(int argc, char** argv)\n{\n\nderivedClass derivedObj1(5);\n\
  \nderivedClass derivedObj2(derivedObj1);\n\ncout << endl;\n\ncout << \"derivedObj1.var:\
  \ \" << derivedObj1.var << endl;\ncout << \"derivedObj1.varPtr: \" << derivedObj1.varPtr\
  \ << endl;\ncout << \"derivedObj1.intRefVar: \" << derivedObj1.intRefVar << endl;\n\
  cout << \"derivedObj2.var: \" << derivedObj2.var << endl;\ncout << \"derivedObj2.varPtr:\
  \ \" << derivedObj2.varPtr << endl;\ncout << \"derivedObj2.intRefVar: \" << derivedObj2.intRefVar\
  \ << endl;\n\nderivedObj1.intRefVar = 99;\ncout << \"redivedObj2.intRefVar: \" <<\
  \ derivedObj2.intRefVar << endl << endl;\n\nreturn 0;\n}\n```\n\nbaseClass constructor\n\
  derivedClass constructor\nderivedClass copy constructor\nredivedObj1.var: 5\nredivedObj1.varPtr:\
  \ 0043FEB0\nredivedObj1.intRefVar: 5\nredivedObj2.var: 5\nredivedObj2.varPtr: 0043FEB0\n\
  redivedObj2.intRefVar: 5\nredivedObj2.intRefVar: 99\n\n显然，编译器对于我们没有定义拷贝构造函数来显式初始化\
  \ `const` 和引用并没有问题。从输出中可以看出编译器已经完成了工作。\n\n## 默认拷贝构造函数\n\n好了，在我们离开这一节之前，你是否注意到 `baseClass`\
  \ 是如何影响 `derivedClass` 的？如果我们定义了它，编译器将始终调用默认构造函数。\n\n现在我们到了最后一部分。首先我们讨论了当拥有类成员时的拷贝。然后我们讨论了拷贝类层次结构。现在让我们看看当我们拥有一个具有层次结构的成员类时该如何处理。\n\
  \n![](img/image0871.jpeg)\n\n\n\n\n## 对象构造\n\n`baseClass` 构造函数\n`derivedClass` 构造函数\n\
  `theOtherClass` 构造函数\n\n## 对象拷贝\n\n`baseClass` 拷贝构造函数\n`derivedClass` 拷贝构造函数\n\n\
  你可以在输出中清晰地看到对象的构造和拷贝。当我们拷贝对象时，编译器正确地调用了 `baseClass` 和 `derivedClass` 的拷贝构造函数。所以当我们当我们定义了拷贝构造函数时，当有一个具有层次结构的成员对象时，我们不需要做任何额外的处理。注意，我们没有为\
  \ `theOtherClass` 定义任何拷贝构造函数。编译器为我们生成了一个，它正确地调用了在 `derivedClass` 中定义的拷贝构造函数。它没有进行浅拷贝。如果\
  \ `derivedClass` 没有定义拷贝构造函数会怎样？\n\n```\n#include<iostream>\n\nusing namespace std;\n\
  \nclass baseClass\n{\npublic:\nint var;\nint* varPtr;\nconst float floatVar;\nint\
  \ &intRefVar;\nbaseClass(int value) : var(value), varPtr(&var), floatVar(value),\
  \ intRefVar(var)\n{\ncout << \"baseClass constructor\" << endl;\n}\n};\n\nclass\
  \ derivedClass : public baseClass\n{\npublic:\nderivedClass(int value) : baseClass(value)\n\
  {\ncout << \"derivedClass constructor\" << endl;\n}\n};\n\nclass theOtherClass\n\
  {\npublic:\nderivedClass derivedClassObj;\ntheOtherClass(int value) : derivedClassObj(value)\n\
  {\ncout << \"theOtherClass constructor\" << endl;\n}\n};\n\nint main(int argc, char**\
  \ argv)\n{\ncout << \"---- Object construction ----\" << endl;\ntheOtherClass theOtherClassObj1(5);\n\
  cout << endl;\ncout << \"---- Object copy ----\" << endl;\ntheOtherClass theOtherClassObj2(theOtherClassObj1);\n\
  cout << endl;\ncout << \"---- Print varPtr ----\" << endl;\ncout << \"theOtherClassObj1.derivedClassObj.varPtr:\
  \ \" << theOtherClassObj1.derivedClassObj.varPtr << endl;\ncout << \"theOtherClassObj2.derivedClassObj.varPtr:\
  \ \" << theOtherClassObj2.derivedClassObj.varPtr << endl;\nreturn 0;\n}\n```\n\n\
  ---- Object construction ----\n\n`baseClass` constructor\n`derivedClass` constructor\n\
  `theOtherClass` constructor\n\n---- Object copy ----\n\n---- Print varPtr ----\n\
  \n`theOtherClassObj1.derivedClassObj.varPtr: 003AF740`\n`theOtherClassObj2.derivedClassObj.varPtr:\
  \ 003AF740`\n\n你看，规则并没有改变。编译器生成的拷贝构造函数发现 `derivedClass` 没有提供任何拷贝构造函数，因此它执行了浅拷贝。我们从两个\
  \ `varPtr` 中看到了这一点。它们是相同的。\n\n我们查看了许多不同的场景。让我们总结一下编译器的拷贝机制。\n\n- 如果没有定义拷贝构造函数，编译器将生成一个。这个拷贝构造函数将执行位拷贝（我们将在这种情况不成立时看到这一点）。\n\
  - 如果显式定义了拷贝构造函数，编译器将不会生成任何类型的构造函数。即使是默认构造函数也不会。\n- 但如果定义了构造函数但不是拷贝构造函数，编译器将生成一个拷贝构造函数。\n\
  - 如果定义了拷贝构造函数，必须在初始化列表中调用成员类或基类的拷贝构造函数。\n- 如果拷贝构造函数没有初始化列表中调用成员类或基类的拷贝构造函数，编译器将尝试调用成员类或基类的默认构造函数。\n\
  - 如果定义了拷贝构造函数并在初始化列表中调用成员类或基类的拷贝构造函数，编译器将调用该拷贝构造函数。在这种情况下，如果成员类或基类中没有定义拷贝构造函数，将调用编译器生成的拷贝构造函数。\n\
  - 编译器生成的拷贝构造函数始终调用成员类或基类的拷贝构造函数。\n- 记住，拷贝构造函数总是由编译器生成的（如果未定义）。总是如此。但编译器是否调用拷贝构造函数取决于它是如何被以及是否被调用。\n\
  \n所以我假设这个列表是有意义的。规则并不多。处理此问题的简单方法是实现你自己的拷贝构造函数。\n\n## 对象克隆\n\n到目前，我们看到了如何拷贝对象，无论是派生类还是成员类。但当我们处理指针时，情况就会变得有点复杂。看这个类层次结构。\n\
  \n```\n#include<iostream>\n\nusing namespace std;\n\nclass classA\n{\npublic:\n\
  int classAVar;\nclassA(int value) : classAVar(value)\n{\ncout << \"classAVar constructor\"\
  \ << endl;\n}\n};\n\nclass classB : public classA\n{\npublic:\nint classBVar;\n\
  classB(int value1, int value2) : classA(value1), classBVar(value2)\n{\ncout << \"\
