- "# C++ 选编话题\n\n\n\n![](img/cover00925.jpeg)\n\n# 前言\n\nC++ 起于 20 世纪 80 年初，在 30 多年后，它仍然是最广泛使用的编程语言之一。这有充分的原因。让\
  \ `C++` 受受欢迎的不仅仅是它的速度，它还是一门非常灵活且可预测的语言。你可以确保一个 `C++` 程序具有恒定的性能，而这是通过能够控制程序的许多方面来实现的。`C++`\
  \ 将程序员置于主驾驶位，程序员可以控制程序需要运行的方式。它是可预测的，没有任何惊喜。最重要的是，`C++` 让你能够非常接近计算机的底层。\n\n你可以找到很多关于\
  \ `C++` 对比 `Java` 速度的讨论。人们公认，`Java` 的速度在理想情况下可以匹配 `C++`，但不会超越它。但这里有一个警告：要获得 `C++`\
  \ 的最佳性能，你需要学习如何正确地使用它。正如我所说，`C++` 让程序员拥有完全的控制权，妥善地控制它是我们的责任。用 `C++` 写出糟糕的代码很容易，但要编写优秀且经过优化的代码，你需要学习它的核心，因为除非你确切知道代码到底发生了什么，否则你无法控制或优化它。\n\
  \n人们常说 `C++` 是一门很难学习的语言。学习一门语言其实并不难，`C++` 如此。它并不是一门困难的语言，当你并不真正它时，它才会变得困难。当你理解它的核心概念时，它就会变得困难。`C++`\
  \ 没有垃圾回收机制，你需要自己清理垃圾。`C++` 有栈内存和堆内存的概念，你需要控制想将对象放在哪里。它有构造函数和析构函数，你需要知道它们何时以及如何被调用。然后它还有多重继承，这是大多数语言不具备的特性。它有指针和引用，你需要知道应该何时以及如何使用它们。此外还有虚函数、虚表和虚指针。这些都是\
  \ `C++` 应该牢牢掌握的重要基础。\n\n# 本书目的\n\n上手 `C++` 并不困难，它和任何其他语言一样。但一旦你学习了语言基础、类、构造函数、继承、条件判断、循环等之后，`C++`\
  \ 的感觉就像大多数其他高层语言一样。但是从那里进一步进，从一个 `C++` 初学者变为中级或高级程序员，可能会是一项挑战。`C++` 有许多核心概念，如果不了解它们，你就无法完全掌握这门语言。如果你不知道编译或运行时发生了什么，你就无法编写出快速优化的代码。\n\
  \n本书的目标是将 `C++` 初学者推向下一个水平。讨论语言的基础内部原理，以便初学者能够完全理解他们的代码中发生了什么。本书分为 20 个不同的主题，尝试讨论\
  \ `C++` 最常用的概念。\n\n# 本书适合谁\n\n本书面向初级 `C++` 程序员。如果你了解类、继承、构造函数和虚函数，那么你就是本书的预期读者群。\n\
  \n# 本书不适合谁\n\n本书不适合从零开始学习 `C++` 的程序员。也就是说，这并不是一本“Hello, World”书。这应该是你读完那本书之后再读这本书。\n\
  \n\n\n\n\n因此，对象的大小实际上就是整数的大小。当对象中没有任何内容时，它的大小为 1 字节，但当我们在里面放入一个整数时，它就变得和整数本身一样大，即\
  \ 4 字节。这表明这个几乎为空的对象只包含整数变量，没有其他内容。让我们多添加一些东西看看会发生什么变化。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass notSoEmptyClass\n{\npublic:\n    int value;\n};\n\
  \nint main(int argc, char** argv)\n{\n    int intVal = 5;\n    notSoEmptyClass notSoEmptyClassObj;\n\
  \    cout << \"Size of notSoEmptyClassObj: \" << sizeof(notSoEmptyClassObj) << endl;\n\
  \    cout << \"Size of integer: \" << sizeof(intVal) << endl;\n    return 0;\n}\n\
  ```\n\nSize of notSoEmptyClassObj: 16\nSize of integer: 4\nSize of double: 8\n\n\
  正如预期的，对象的大小增加了。但为什么是 16 而不是整数和双点数的之和呢？为什么不是 12 字节？这是因为 `padding`（填充）。变量会被对齐到某些边界值。这主要取决于实现/架构，在这一特定情况下，边界似乎是\
  \ 8 字节。让我们通过添加另一个整数来确认这一点。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass notSoEmptyClass\n{\npublic:\n    int intValue1;\n    double doubleVal;\n\
  \    int intValue2;\n};\n\nint main(int argc, char** argv)\n{\n    notSoEmptyClass\
  \ notSoEmptyClassObj;\n    cout << \"Size of notSoEmptyClassObj: \" << sizeof(notSoEmptyClassObj)\
  \ << endl;\n    return 0;\n}\n```\n\nSize of notSoEmptyClassObj: 24\n\n现在对象的大小是\
  \ 24 字节。这符合我们关于“对齐边界”的概念吗？是的。你会发现，变量的布局必须是 8 字节边界或更小。由于 `double` 长度为 8 字节，这些变量需要打包在\
  \ 8 字节宽的内存位置中。你可以将上述内容可视化为如下内存中的打包方式：\n\n![](img/image0082.jpeg)\n\n现在让我们看看如果重新排列变量的位置以稍微节省空间，会发生什么。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass notSoEmptyClass\n\
  {\npublic:\n    int intValue1;\n    int intValue2;\n    double doubleVal;\n};\n\n\
  int main(int argc, char** argv)\n{\n    notSoEmptyClass notSoEmptyClassObj;\n  \
  \  cout << \"Size of notSoEmptyClassObj: \" << sizeof(notSoEmptyClassObj) << endl;\n\
  \    return 0;\n}\n```\n\nSize of notSoEmptyClassObj: 16\n\n仅仅重新排列位置就将对象的大小减少了 8\
  \ 字节。你可能猜到了这里发生了什么。现在变量打包得高效得多。\n\n![](img/image00823.jpeg)\n\n那么变量为什么要这样布局呢？为什么编译器不做一个智能的选择，重新排列变量以更节省空间呢？我确定现代编译器在排列变量以提高内存效率方面要智能得多，但按照程序员的意图进行布局还有其他原因。我们将在另一个主题中讨论这一点。在离开成员变量之前，让我们快速检查其他内容。\n\
  \n当我们把其中一个整数变量变为 `static` 时会发生什么？\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass notSoEmptyClass\n{\npublic:\n    int intValue1;\n    double doubleVal;\n\
  \    static int intValue2;\n};\n\nint main(int argc, char** argv)\n{\n    notSoEmptyClass\
  \ notSoEmptyClassObj;\n    cout << \"Size of notSoEmptyClassObj: \" << sizeof(notSoEmptyClassObj)\
  \ << endl;\n    return 0;\n}\n```\n\nSize of notSoEmptyClassObj: 16\n\n我们从之前的示例中知道，如果\
  \ `intVal2` 不是静态的，对象的大小将是 24 字节。但现在是 16 字节，就好像 `intVal2` 不在对象中一样。事实确实如此。因为静态变量并不存储在对象本身中。一个类的对象可以有很多。所以必须有许多个\
  \ `intVal2` does not exist in the object。\n\n\n\n我不打算解释 C++ 虚机制是什么。我确定你知道什么是虚函数。在这个主题中，我只需要证明它在对象层面的存在性，并向你展示它在幕后究竟是如何运作的。\n\
  \n让我们从主题 1 结束的地方继续下去。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class notSoEmptyClass\n{\npublic:\n    void foo() {}\n};\n\nint main(int argc, char**\
  \ argv)\n{\n    notSoEmptyClass notSoEmptyClassObj;\n    cout << \"Size of notSoEmptyClassObj:\
  \ \" << sizeof(notSoEmptyClassObj) << endl;\n    return 0;\n}\n```\nSize of notSoEmptyClassObj:\
  \ 1\n\n我们已经证明了函数不占用对象的任何空间，因为它们存在于对象内存空间之外。让我们来看看当我们将唯一的函数变为虚函数时会发生什么变化。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass virtualFuncClass\n{\npublic:\n\
  \    virtual void foo() {}\n};\n\nint main(int argc, char** argv)\n{\n    double\
  \ *doublePrt;\n    virtualFuncClass virtualFuncClassObj;\n    cout << \"Size of\
  \ virtualFuncClassObj: \" << sizeof(virtualFuncClassObj) << endl;\n    cout << \"\
  Size of a pointer: \" << sizeof(doublePrt) << endl;\n    return 0;\n}\n```\nSize\
  \ of virtualFuncClassObj: 4\nSize of a pointer: 4\n\n我对类做的唯一修改就是将函数 `foo` 变为虚函数（以及更改了类名）。对象的尺寸跳到了\
  \ 4 字节。所以将函数 `foo` 变为虚函数给对象添加了东西。正如你猜的那样，这就是虚函数指针，通常被称为 `vptr`。它只是一个指针。为了清楚，我还声明了一个指向\
  \ `double` 的指针，并显示它的大小是 4 字节。我没有特殊理由选择 `double` 指针，它可以指向任何类型，因为指针的大小不会随它所指向的内容而改变。这提供了一个略有说服力的论：将函数变为虚函数为对象添加了一个指针。但它也可能是一个整数变量，对吧？因为我们在主题\
  \ 1 中看到整数变量在对象中占用了 4 字节的空间。在展示实际的 `vptr` 以及它指向的内容之前，让我们确认这个怀疑。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass virtualFuncClass\n{\npublic:\n    virtual void foo()\
  \ {}\n    virtual void bar() {}\n};\n\nint main(int argc, char** argv)\n{\n    double\
  \ *doublePrt;\n    virtualFuncClass virtualFuncClassObj;\n    cout << \"Size of\
  \ virtualFuncClassObj: \" << sizeof(virtualFuncClassObj) << endl;\n    cout << \"\
  Size of a pointer: \" << sizeof(doublePrt) << endl;\n    return 0;\n}\n```\nSize\
  \ of virtualFuncClassObj: 4\nSize of a pointer: 4\n\n现在有两个虚函数了，但对象的尺寸并没有改变。让我们来看看这个指针指向什么，里面装了什么。我们将使用\
  \ Visual Studio 进行此插说明，因为这些信息在调试模式下是视觉可见的。\n\n```cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nclass baseClass\n{\npublic:\n    void nonVirtualFunc() {}\n\
  \    virtual void virtualOverriddenFunc() {}\n    virtual void virtualOverriddenFunc()\
  \ {}\n};\n\nint main(int argc, char** argv)\n{\n    baseClass baseObj1;\n    baseClass\
  \ baseObj2;\n    return 0;\n}\n```\n暂时忍受一下函数名，它们是有目的的。现在如果你在返回语句处设置断点并查看调试窗口的局部变量（Locals），你会看到类似这样的：`image00824.jpeg`。内容自而易见。我们正在查看创建的两个\
  \ `baseClass` 对象的内容。你可以从这个调试视图中看到：\n\n* 此对象中除了虚函数指针外什么都没有，这里命名为 `vfptr`\n* `vfptr`\
  \ 是一个指向 `void` 类型指针的指针。这意味着它指向一个 `void` 类型的指针数组（检查最后一列）\n* `vfptr` 指向 `vftable`\n\
  * `vftable` 有两个 `void` 条目\n* `vftable` 完全没有提到 `nonVirtualFunc()`\n\n通过检查 `vftable`\
  \ 条目，它们指向什么是显而易见的。第一个指向函数 `virtualOverriddenFunc`，第二个指向 `virtualOverriddenFunc`。更值得注意的是，这两个函数都是\
  \ `baseClass` 类型。它的意义将显而易见。我创建两个相同类型的对象是为了验证函数只有一份拷贝这一事实。如果你查看 `vftable` 条目的值，这一点显而易见。`baseObj1`\
  \ 和 `baseObj2` 的两个虚函数地址是相同的，再次证明了类成员函数只有一份拷贝。更有趣的是，两个对象的 `vftable` 地址也是相同的。这意味着对于所有相同类型的对象只有一个虚函数表。现在你需要仔细记住，这是\
  \ C++ 的实现方式。其他编译器可能会有不同的做法。但真的没有理由为相同的对象准备两个不同的 `vftables`，因为它们都指向相同的函数。这仅适用于这种情况，因为我们有两个\
  \ `baseClass` 对象，而它没有派生自任何类。如果不是的话，这个事实就会改变。现在，让我们来看看当我们派生 `baseClass` 并重写函数时情况发生什么变化。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    void nonVirtualFunc() {}\n    virtual void virtualOverriddenFunc() {}\n   \
  \ virtual void virtualOverriddenFunc() {}\n};\n\nclass derivedClass : public baseClass\n\
  {\npublic:\n    virtual void virtualOverriddenFunc() {}\n};\n\nint main(int argc,\
  \ char** argv)\n{\n    baseClass baseObj;\n    derivedClass derivedObj;\n    return\
  \ 0;\n}\n```\n`image00825.jpeg`\n\n情况如预期。`baseClass` 的 `vftable` 没有改变。两个函数仍然指向 `baseClass`\
  \ 版本的函数。然而，`derivedClass` 的 `vftable` 条目是不同的。`vftable` 的第二个条目是 `derivedClass` 类型。检查它们指向的地址。第一个虚函数\
  \ `virtualOverriddenFunc` 在两个 `vftables` 中指向同一个地址。这是正确的，因为该函数没有被重写。但 `virtualOverriddenFunc`\
  \ 地址在两个 `vftables` 中是不同的。这符合预期，因为 `derivedClass` 对象重写了该函数。\n\n让我们用一个完整的示例结束这里，这个示例将讨论虚机制的更多方面。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass1\n{\npublic:\n\
  \    void nonVirtualFunc1() { cout << \"nonVirtualFunc1\" << endl; }\n    virtual\
  \ void virtualOverriddenFunc1() { cout << \"virtualOverriddenFunc1\" << endl; }\n\
  \    virtual void virtualOverriddenFunc1() { cout << \"virtualOverriddenFunc1\"\
  \ << endl; }\n};\n\nclass baseClass2\n{\npublic:\n    void nonVirtualFunc2() { cout\
  \ << \"nonVirtualFunc2\" << endl; }\n    virtual void virtualOverriddenFunc2() {\
  \ cout << \"virtualOverriddenFunc2\" << endl; }\n    virtual void virtualOverriddenFunc2()\
  \ { cout << \"virtualOverriddenFunc2\" << endl; }\n};\n\nclass derivedClass : public\
  \ baseClass1, baseClass2\n{\npublic:\n    virtual void virtualOverriddenFunc1()\
  \ { cout << \"virtualOverriddenFunc1\" << endl; }\n    virtual void derivedClassOnlyVirtualFunc()\
  \ { cout << \"derivedClassOnlyVirtualFunc\" << endl; }\n};\n\nint main(int argc,\
  \ char** argv)\n{\n    baseClass1 baseClass1Obj;\n    baseClass2 baseClass2Obj;\n\
  \    derivedClass derivedClassObj;\n    baseClass1 *bc1Ptr = new derivedClass;\n\
  \    derivedClass *dcPtr = new derivedClass;\n    bc1Ptr->virtualOverriddenFunc1();\n\
  \    dcPtr->virtualOverriddenFunc1();\n    dcPtr->derivedClassOnlyVirtualFunc();\n\
  \    return 0;\n}\n```\n\n首先，让我解释一下这里正在发生什么：\n\n* 现在有两个基类：`baseClass1` 和 `baseClass2`\n\
  * 每个基类都有自己的方法\n* `derivedClass`（多重继承）派生自 `baseClass1` 和 `baseClass2`\n\n\n\n\n`derivedClass`\
  \ 引入了它自己的虚拟函数 `derivedClassOnlyVirtualFunc`\n\n有两个指针，类型为 `baseClass1` 的 `bc1Ptr`\
  \ 和类型为 `derivedClass` 的 `dcPtr`。它们都指向一个 `derivedClass` 对象。\n\n现在是我想说明的几点：\n\n1.\
  \ 这无法通过编译。在 `bc1Ptr->derivedClassOnlyVirtualFunc()` 这一行存在编译错误：\n\n![](img/image00826.jpeg)\n\
  \n这一点很重要，需要记住。多态赋予了你通过基类指针进行动态绑定调用派生类中重写函数的能力。但在运行时进行动态绑定之前，编译器必须在编译时知道存在这样一个函数。对于编译器来说，它在\
  \ `baseClass1` 中无法看到 `derivedClassOnlyVirtualFunc`。`__ vfptr` 和 `__ vftable` 的使用发生在运行时。编译器并不知道将调用哪个函数。所以对编译器来说，这看起来是你正尝试调用一个在类中未定义的函数。它并不知道你引用的是一个派生对象，且该函数定义在该处。事实上，它并不需要知道。这并不是多态本该做的。所以请记住这一点。现在我们注释掉这一错误行并继续。\n\
  \n2. 让我们观察对象中的 `__vfptr` 和 `__vftable` 信息：\n\n![](img/image00827.jpeg)\n\n这里有几个有趣的点：`baseClass1Obj`\
  \ 和 `baseClass2Obj` 的 `__vfptr` 和 `__vftable` 符合预期。四个函数对应四个不同的地址。虚函数表也不同。`derivedClassObj`\
  \ 有点趣。它包含两个类型为 `baseClass1` 和 `baseClass2` 的子对象。这是符合预期的，因为这是多重继承。这两个基类对象有它们自己的 `__vfptrs`。而且它们指向不同的\
  \ `__vftables`，因为 `baseClass1Obj` 和 `baseClass2Obj` 指向的是不同的表。还要注意，函数地址指向与 `baseClass2`\
  \ 相同的函数，因为 `is` 没有虚函数被重写。对于 `baseClass1` 函数，重写后的函数有不同的地址。这里没什么新奇的，只是在证明我们早之前讨论的内容。现在看\
  \ `dcPtr` 指向的对象。其 `__vfptrs` 和 `__vftables` 与 `derivedClassObj` 完全相同。同样，这并不意外，因为我们正在创建并指向\
  \ `derivedClass`。但 `bc1Ptr` 有点不同。它有一个 `derivedClass` 组件和一个 `__vfptr`。如果你仔细检查，会发现\
  \ `derivedClass` 内部的 `baseClass1` 的 `__vftable` 与 `bc1Ptr` 指向的是同一个。这意味着 `bc1Ptr`\
  \ 只有一个 `__vftable`。你无法访问 `derivedClass` 部分的任何内容。它确实在那里，只是无法通过 `baseClass1` 指针访问。所以，如果你有一个指向派生对象的基类指针，你只能访问基类中已知的的内容。\n\
  \n总结一下，`dcPtr` 拥有两个 `__vftables`，因为 `derivedClass` 拥有两个，但 `bc1Ptr` 只有一个，这与 `baseClassObj`\
  \ 拥有的对应，尽管它们都指向 `derivedClassObj` 对象。\n\n在上面的讨论中我漏掉了一个小细节。`derivedClassOnlyVirtualFunction`\
  \ 怎么了？它是 `derivedClass` 中的一个新虚函数。所以显而易见你无法通过 `bc1Ptr` 调用它。由于它是虚函数，必须在 `__vftable`\
  \ 中。回去看那里所有的 `__vftable` 条目。你找不到它。这里没有秘密。它似乎就是没有显示在那里。老实说，我不知道为什么，但我会向你证明它确实在那里。关于\
  \ `__vfptrs` 和 `__vftables` 的点在于：这并不是标准。动态绑定的执行取决于实现。编译器可以自由选择任何方法来使其工作。尽管大多数实现会使用\
  \ `__vfptrs` 和 `__vftables`，但它们不必这样做。即使它们使用虚函数表和指针，也可以以不同的方式实现。\n\n所以，当我们添加新的虚函数\
  \ `derivedClassOnlyVirtualFunc` 时，基本上可以通过添加一个新的 `__vfptr` 和一个新的 `__vftable` 来支持它。或者，它可以被添加到现有的\
  \ `__vftable` 中。这完全取决于编译器和运行时系统如何查找它。那么这里发生了什么？新函数绝对不在任何一个 `__vftables` 中。是否还有另一个我们看不见的\
  \ `__vftable`？嗯，我当时不知道发生了什么以及为什么发生。所以我尝试打印出 `derivedClassObj` 的大小。如果你还记得之前的讨论，`__vfptr`\
  \ 的大小是 4 字节。所以我预想我“不可见”的 `__vfptr` 会让对象变成 8 字节。但它只有 4 字节！所以真的只有一个 `__vfptr`。\n\n\
  我现在说的是针对 Visual Studio 2013 C++ 编译器的。如果你使用其他编译器，情况很可能不同。我尝试解决这个谜团的方法是查看 `__vftable`\
  \ 的内存内容。当我查看 `derivedClassObj` `__vftable` 的内存空间时，我看到了这些：\n\n![](img/image00828.jpeg)\n\
  \n0x0100DA64 是 `derivedClassObj` `__vfptr` 的内存地址。你可以清晰看到前两个条目是虚函数的地址：0x01001564\
