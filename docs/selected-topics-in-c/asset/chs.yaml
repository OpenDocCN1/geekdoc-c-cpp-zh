  \n编译后你将得到类似下面的错误：\n\n![](img/image00831.jpeg)\n\n如果你按照错误信息操作，你会发现编译器正在抱怨访问 `baseClass`\
  \ 的三个私有成员。因此，我想在这个例子中说明的观点是：**继承类型对你可以在类中访问的内容没有影响**。基类的所有私有成员仍然是私有的，所有的公共成员仍然是公有的。无论该类是私有继承还是公有继承，这一点都是成立的。\n\
  \n那么继承类型影响的是什么呢？它影响的是从外部访问基类对象的方式。看这个例子：\n\n```cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nclass baseClass\n{\n\nint pvt_var = 1;\nvoid pvt_func() {}\n\
  \nvirtual  void pvt_virtFunc() {}\n\npublic:\nint pub_var = 1;\nvoid pub_func()\
  \ {}\nvirtual void pub_virtFunc() {}\n};\n\nclass pvtDerivedClass : baseClass\n\
  {};\n\nclass pubDerivedClass : public baseClass\n{};\n\nint main(int argc, char**\
  \ argv)\n{\n\nbaseClass baseClassObj;\npvtDerivedClass pvtDerivedClassObj;\npubDerivedClass\
  \ pubDerivedClassObj;\n\nbaseClassObj.pub_var;\nbaseClassObj.pub_func();\nbaseClassObj.pub_virtFunc();\n\
  \npvtDerivedClassObj.pub_var;\npvtDerivedClassObj.pub_func();\npvtDerivedClassObj.pub_virtFunc();\n\
  \npubDerivedClassObj.pub_var;\npubDerivedClassObj.pub_func();\npubDerivedClassObj.pub_virtFunc();\n\
  \nreturn 0;\n}\n```\n\n你将得到类似这样的编译错误：\n\n![](img/image00832.jpeg)\n\n编译错误仅针对 `pvtDerivedClassObj`。`pvtDerivedClass`\
  \ 和 `pubDerivedClass` 都派生自 `baseClass`。在示例中，这两个对象都尝试访问 `baseClass` 的公共方法。但 `pvtDerivedClassObj`\
  \ 不允许访问 `baseClass` 的公共成员。因此，这里发生的情况显而易见。当你从一个类进行私有继承时，所有继承自基类的成员都表现像派生类中定义的私有成员。公共成员在派生类内部仍然可以访问，但从外部来看，它们表现就像派生类中的私有成员一样。类似的效果也发生在公有继承和保护继承中。\n\
  \n众所周知，在 C++ 上下文中，`struct` 和 `class` 的功能几乎完全相同，主要的区别在于 `struct` 的默认访问级别是公有的，而 `class`\
  \ 是私有的。那么这在继承过程中是如何产生影响的呢？让我们把所有的类都改为 `struct` 看看。\n\n```cpp\nstruct baseClass\n\
  {\n\nprivate:\nint pvt_var = 1;\nvoid pvt_func() {}\nvirtual  void pvt_virtFunc()\
  \ {}\n\npublic:\nint pub_var = 1;\nvoid pub_func() {}\nvirtual void pub_virtFunc()\
  \ {}\n};\n\nstruct pvtDerivedClass : baseClass\n{};\n\nstruct pubDerivedClass :\
  \ public baseClass\n{};\n\nint main(int argc, char** argv)\n{\n\nbaseClass baseClassObj;\n\
  pvtDerivedClass pvtDerivedClassObj;\npubDerivedClass pubDerivedClassObj;\n\nbaseClassObj.pub_var;\n\
  baseClassObj.pub_func();\nbaseClassObj.pub_virtFunc();\n\npvtDerivedClassObj.pub_var;\n\
  pvtDerivedClassObj.pub_func();\npvtDerivedClassObj.pub_virtFunc();\n\npubDerivedClassObj.pub_var;\n\
  pubDerivedClassObj.pub_func();\npubDerivedClassObj.pub_virtFunc();\n\nreturn 0;\n\
  }\n```\n\n注意，我对 `baseClass` 做了微小的修改并添加了 `private` 访问修饰符，否则所有成员都将是公有的。编译它你会发现没有编译错误。这是因为当从一个\
  \ `struct` 继承另一个 `struct` 时，默认继承是公有的。这与 `struct` 成员的默认访问级别相同。因此 `pvtDerivedClass`\
  \ 实际上是公有继承，而不是像 `class` 那样私有继承。为了证明我们的观点，我们将显式地为 `pvtDerivedClass` 指定私有继承。\n\n```cpp\n\
  struct baseClass\n{\n\nprivate:\nint pvt_var = 1;\nvoid pvt_func() {}\nvirtual void\
  \ pvt_virtFunc() {}\n\npublic:\nint pub_var = 1;\nvoid pub_func() {}\nvirtual void\
  \ pub_virtFunc() {}\n};\n\nstruct pvtDerivedClass : private baseClass\n{};\n\nstruct\
  \ pubDerivedClass : public baseClass\n{};\n\nint main(int argc, char** argv)\n{\n\
  \nbaseClass baseClassObj;\npvtDerivedClass pvtDerivedClassObj;\npubDerivedClass\
  \ pubDerivedClassObj;\n\nbaseClassObj.pub_var;\nbaseClassObj.pub_func();\nbaseClassObj.pub_virtFunc();\n\
  \npvtDerivedClassObj.pub_var;\npvtDerivedClassObj.pub_func();\npvtDerivedClassObj.pub_virtFunc();\n\
  \npubDerivedClassObj.pub_var;\npubDerivedClassObj.pub_func();\npubDerivedClassObj.pub_virtFunc();\n\
  \nreturn 0;\n}\n```\n\n编译这个你会发现你得到了和之前 `class` 版本相同的编译错误。所以这就是继承 `struct` 时的区别。\n\
  \n## struct 和 class 之间的继承\n\n自然地，你现在很想知道当我们用一个继承另一个时会发生什么，对吧？让我们来发现。首先，我们从一个 `struct`\
  \ 派生出一个类并显式地指定访问级别。\n\n```cpp\nstruct baseClass\n{\n\nprivate:\nint pvt_var = 1;\n\
  void pvt_func() {}\nvirtual  void pvt_virtFunc() {}\n\npublic:\nint pub_var = 1;\n\
  void pub_func() {}\nvirtual void pub_virtFunc() {}\n};\n\nclass pvtDerivedClass\
  \ : private baseClass\n{};\n\nclass pubDerivedClass : public baseClass\n{};\n\n\
  int main(int argc, char** argv)\n{\n\nbaseClass baseClassObj;\npvtDerivedClass pvtDerivedClassObj;\n\
  pubDerivedClass pubDerivedClassObj;\n\nbaseClassObj.pub_var;\nbaseClassObj.pub_func();\n\
  baseClassObj.pub_virtFunc();\n\npvtDerivedClassObj.pub_var;\npvtDerivedClassObj.pub_func();\n\
  pvtDerivedClassObj.pub_virtFunc();\n\npubDerivedClassObj.pub_var;\npubDerivedClassObj.pub_func();\n\
  pubDerivedClassObj.pub_virtFunc();\n\nreturn 0;\n}\n```\n\n![](img/image00833.jpeg)\n\
  \n你会记得这些是我们在 `class` 中遇到的错误。因此在私有继承和公有继承中，当从 `struct` 派生类时，成员上没有区别。将基类改为 `class`，派生类改为\
  \ `struct`，你会看到相同的编译错误。如果我们不指定，默认级别是什么？\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nstruct baseClass\n{\n\nprivate:\nint pvt_var = 1;\nvoid pvt_func() {}\n\
  virtual  void pvt_virtFunc() {}\n\npublic:\nint pub_var = 1;\nvoid pub_func() {}\n\
  virtual void pub_virtFunc() {}\n};\n\nclass defaultDerivedClass : baseClass\n{};\n\
  \nint main(int argc, char** argv)\n{\n\ndefaultDerivedClass defaultDerivedClassObj;\n\
  defaultDerivedClassObj.pub_var;\ndefaultDerivedClassObj.pub_func();\ndefaultDerivedClassObj.pub_virtFunc();\n\
  \nreturn 0;\n}\n```\n\n这些是你会得到的编译错误：\n\n![](img/image00834.jpeg)\n\n你会意识到这些是我们在私有继承中遇到的错误。所以当我们从\
  \ `struct` 继承到派生的 `class` 时，默认访问修饰符类似于 `class`。另一种方式呢？\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass baseClass\n{\n\nprivate:\nint pvt_var = 1;\nvoid\
  \ pvt_func() {}\nvirtual  void pvt_virtFunc() {}\n\npublic:\nint pub_var = 1;\n\
  void pub_func() {}\nvirtual void pub_virtFunc() {}\n};\n\nstruct defaultDerivedStruct\
  \ : baseClass\n{};\n\nint main(int argc, char** argv)\n{\n\ndefaultDerivedStruct\
  \ defaultDerivedStructObj;\ndefaultDerivedStructObj.pub_var;\ndefaultDerivedStructObj.pub_func();\n\
  defaultDerivedStructObj.pub_virtFunc();\n\nreturn 0;\n}\n```\n\n你不会得到编译错误。这意味着当从\
  \ `class` 继承到派生的 `struct` 时，默认访问修饰符是 `struct` 的。\n\n## 第 4 节\n\n### 对象构造\n\n在本节中，我们将查看类对象是如何构造的。有几种方法可以构造对象。有些是显式的，有些是隐式的。这是一个标准的类定义：\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass standardClass\n{\n\
  \nint objID;\n\npublic:\nstandardClass(int ID) // 构造函数\n{\nobjID = ID;\ncout <<\
  \ \"Constructor: \" << objID << endl;\n}\n\n~standardClass() // 析构函数\n{\n```\n\n\
  \n\n\n现在，让我们定义一些函数并看看这个机制是如何运作的。\n\n```cpp\n#include<iostream>\nusing namespace\
  \ std;\n\nclass standardClass\n{\n    int objID;\npublic:\n    standardClass(int\
  \ ID) // 构造函数\n    {\n        objID = ID;\n        cout << \"Constructor: \" <<\
  \ objID << endl;\n    }\n    ~standardClass() // 析构函数\n    {\n        cout << \"\
  Destructor: \" << objID << endl;\n    }\n    standardClass(const standardClass &objToCopy)\
  \ // 拷贝构造函数\n    {\n        objID = objToCopy.objID;\n        cout << \"Copy constructor:\
  \ \" << objID << endl;\n    }\n    standardClass & operator=(const standardClass\
  \ &objToCopy) // 运算符\n    {\n        cout << \"Copy assignment operator: \" << objID\
  \ << endl;\n        objID = objToCopy.objID;\n        return *this;\n    }\n   \
  \ void funcCallByVal(standardClass stdClass)\n    {\n        objID = stdClass.objID;\n\
  \    }\n    void funcCallByRef(standardClass &stdClass)\n    {\n        objID =\
  \ stdClass.objID;\n    }\n    void funcCallByPtr(standardClass *stdClass)\n    {\n\
  \        objID = stdClass->objID;\n    }\n};\n\nint main(int argc, char** argv)\n\
  {\n    standardClass stdClassObj1(1);                  // Line #1\n    standardClass\
  \ stdClassObj2(2);                  // Line #2\n    cout << \"-Line #2 end -\" <<\
  \ endl;\n    funcCallByVal(stdClassObj1);                   // Line #3 逻辑\n    cout\
  \ << \"-Line 2 end -\" << endl;\n    standardClass stdClassObj3 = stdClassObj2;\
  \      // Line #3\n    cout << \"-Line 3 end -\" << endl;\n    stdClassObj1 = stdClassObj2;\
  \                   // Line #4\n    cout << \"-Line 4 end -\" << endl;\n    stdClassObj2\
  \ = standardClass(4);               // Line #5\n    cout << \"-Line 5 end -\" <<\
  \ endl;\n    stdClassObj3 = 5;                             // Line #6\n    cout\
  \ << \"-Line 6 end -\" << endl;\n    standardClass stdClassObj4 = standardClass(4);\
  \  // Line #7\n    cout << \"-Line 7 end -\" << endl;\n    standardClass stdClassObj5\
  \ = 5;                // Line #8\n    cout << \"-Line 8 end -\" << endl;\n    return\
  \ 0;\n}\n```\n\n让我们快速回顾一下这里发生了什么：\n\n* `Line 1` 通过调用构造函数创建了一个新对象。\n* `Line 2` 传递一个对象来创建一个新对象。这调用了拷贝构造函数。请注意，在调用拷贝构造函数的情况下，任何地方都没有调用默认构造函数。\n\
  * `Line 3` 通过赋值一个已存在的对象来创建一个新对象。但这调用的是拷贝构造函数**而不是**赋值运算符。所以 `stdClassObj3` 的效果与\
  \ `line 2` 相同。\n* `Line 4` 调用了赋值运算符。这是因为我们正在将 `stdClassObj2` 赋值给 `stdClassObj1`，而后者已经创建了。所以请记住，赋值运算符只在赋值给现有对象时被调用。\n\
  * `Line 5` 将 `stdClassObj2` 赋值给一个新创建的对象。所以这种情况发生的情况：通过带有值 `4` 的构造函数创建了一个临时对象。该对象使用赋值运算符赋值给\
  \ `stdClassObj2`。\n`Line 6` 通过传递一个整数为 `stdClassObj3` 赋值一个新对象。这完全没有问题，因为我们有一个接受整数的构造函数。所以\
  \ `line 6` 等同于 `stdClassObj3 = standardClass(5)`，与 `line 5` 相同。\n\n现在看 `lines 7`\
  \ 和 `8`。我们正在以与 `lines 5` 和 `6` 相同的顺序执行执行相同的操作，但现在我们正在创建新对象。在 `lines 5` 和 `6` 中，我们对现有对象进行了赋值。但现在我们正在实例化新对象。这里存在临时对象的构建以及对拷贝构造函数的调用。编译器非常智能，它理解可以直接调用构造函数，因为这是一个新的对象实例。所以请记住新对象的创建与对现有对象赋值之间的区别。\n\
  \n我在中间插入打印语句是为了显示不同语句之间的边界，并显示在退出 `main` 函数之前发生隐式析构的时机。在 `line 6` 输出之后，函数将返回，这将触发栈对象的析构。在\
  \ `main` 中创建的所有内容都是 `main` 函数局部的，因此它们在栈上。这些栈对象将在函数结束时通过调用它们的析构函数被销。\n\n最后，所有对象的析构函数都会被调用。你应该注意，对象的销毁顺序与其创建顺序相反。最后创建的对象最先被。所以在我们的案例中，`stdClassObj3`\
  \ 首先被破坏，然后是 `stdClassObj2`，以此类推。注意，它们是按照“创建”的顺序销毁的，而不是赋值的顺序。\n\n输出：\n```\nConstructor:\
  \ 1\n- Line 1 end -\nCopy constructor: 1\n- Line 2 end -\nCopy constructor: 1\n\
  - Line 3 end -\nCopy assignment operator: 1\n- Line 4 end -\nConstructor: 4\nCopy\
  \ assignment operator: 1\n- Line 5 end -\nConstructor: 5\nCopy assignment operator:\
  \ 1\n- Line 6 end -\nConstructor: 4\nCopy assignment operator: 1\n- Line 7 end -\n\
  Constructor: 5\nCopy assignment operator: 1\n- Line 8 end -\nDestructor: 5\nDestructor:\
  \ 4\nDestructor: 5\nDestructor: 1\nDestructor: 4\nDestructor: 1\nDestructor: 1\n\
  Destructor: 1\nDestructor: 1\n```\n[/content]\n\n*(注：由于用户提供的文本中 `[content]` 标签未闭合，且输出要求包含在标签内，我遵循了指令要求将翻译后的内容包裹在\
  \ `[content]...\n\n\n现在让我们来看引用传递。我只会更改函数名，保持参数不变。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass standardClass\n{\nint objID;\npublic:\n\nstandardClass(int\
  \ ID) // constructor\n{\n    objID = ID;\n    cout << \"Constructor: \" << objID\
  \ << endl;\n}\n~standardClass() // destructor\n{\n    cout << \"Destructor: \" <<\
  \ objID << endl;\n}\nstandardClass(const standardClass &objToCopy) // copy constructor\n\
  {\n    objID = objToCopy.objID;\n    cout << \"Copy constructor: \" << objID <<\
  \ endl;\n}\nstandardClass & operator=(const standardClass &objToCopy) // assignment\
  \ operator\n{\n    cout << \"Copy assignment operator: \" << objID << endl;\n  \
  \  objID = objToCopy.objID;\n    return *this;\n}\n\nvoid funcCallByVal(standardClass\
  \ stdClass)\n{\n    objID = stdClass.objID;\n}\n\nvoid funcCallByRef(standardClass\
  \ &stdClass)\n{\n    objID = stdClass.objID;\n}\n\nvoid funcCallByPtr(standardClass\
  \ *stdClass)\n{\n    objID = stdClass->objID;\n}\n};\n\nint main(int argc, char**\
  \ argv)\n{\nstandardClass stdClassObj1(1);                           // Line #1\n\
  standardClass stdClassObj2(2);                           // Line #2\ncout << \"\
  -Line #2 end-\" << endl;\nstdClassObj1.funcCallByRef(stdClassObj2);      // Line\
  \ #3\ncout << \"-Line #3 end-\" << endl;\nstdClassObj1.funcCallByRef(3);       \
  \                    // Line #4\ncout << \"-Line #4 end-\" << endl;\nreturn 0;\n\
  }\n```\n\n编译后，你可能会看到这个错误：\n\n![](img/image00835.jpeg)\n\n在解释原因之前，请对第 4 行的函数调用进行如下微小的修改。像这样传递一个对象参数：\n\
  \n```cpp\n...\nstdClassObj1.funcCallByRef(standardClass(3));  // Line #4\n...\n\
  ```\n\n如果你正在使用 Visual Studio，很有可能这可以编译通过。但坦率地说，这并不符合标准。编译器厂商会在标准规范中添加他们自己的扩展，这似乎是\
  \ Visual C++ 的扩展之一。你需要进入项目属性，选择 `C/C++` 并选择 `All Options`。在里面你会看到 `Disable language\
  \ extensions`（禁用语言扩展）。选择 `Yes`。现在尝试重新编译。你应该看到与之前类似的错误：\n\n![](img/image00836.jpeg)\n\
  \n现在我们有了一个统一的错误案例，为什么会发生这种情况？为什么它说不能将 `standardClass` 对象传递给引用呢？毕竟，我们在第 3 行通过传递 `stdClassObj2`\
  \ 也不是在做同样的事情吗？那么区别在哪里？\n\n### 临时变量与常量引用\n\n在深入研究之前，让我问问你，你是否好奇为什么拷贝构造函数和拷贝赋值运算符接受\
  \ `const` 参数？为什么参数需要是指向 `const` 的引用？\n\n让我们重做一遍例子，这次不使用常量引用。此外，如果你正在使用 Visual Studio，请确保已禁用了语言扩展。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass standardClass\n{\n\
  int objID;\npublic:\n\nstandardClass(int ID) // constructor\n{\n    objID = ID;\n\
  \    cout << \"Constructor: \" << objID << endl;\n}\n~standardClass() // destructor\n\
  {\n    cout << \"Destructor: \" << objID << endl;\n}\nstandardClass(standardClass\
  \ &objToCopy) // copy constructor\n{\n    objID = objToCopy.objID;\n    cout <<\
  \ \"Copy constructor: \" << objID << endl;\n}\nstandardClass & operator=(standardClass\
  \ &objToCopy) // assignment operator\n{\n    cout << \"Copy assignment operator:\
  \ \" << objID << endl;\n    objID = objToCopy.objID;\n    return *this;\n}\n};\n\
  \nint main(int argc, char** argv)\n{\nstandardClass stdClassObj1(1);           \
  \                // Line #1\ncout << \"- Line 1 end-\" << endl;\nstandardClass stdClassObj2(stdClassObj1);\
  \      // Line #2\ncout << \"- Line 2 end-\" << endl;\nstandardClass stdClassObj3\
  \ = stdClassObj2;    // Line #3\ncout << \"- Line 3 end-\" << endl;\nstdClassObj1\
  \ = stdClassObj2;                              // Line #4\ncout << \"- Line 4 end-\"\
  \ << endl;\nstdClassObj1.funcCallByRef(3);                           // Line #5\n\
  cout << \"- Line 5 end-\" << endl;\nstdClassObj1.funcCallByRef(standardClass(3));\
  \              // Line #6\ncout << \"- Line 6 end-\" << endl;\nreturn 0;\n}\n```\n\
  \n\n\n\n\n```cpp\ncout << \"Constructor: \" << objID << endl;\n}\n\n~standardClass()\
  \ // 析构函数\n\n{\n    cout << \"Destructor: \" << objID << endl;\n}\n\nstandardClass(const\
  \ standardClass &objToCopy) // 拷贝构造函数\n{\n    objID = objToCopy.objID;\n    cout\
  \ << \"Copy constructor: \" << objID << endl;\n}\n\nstandardClass & operator=(const\
  \ standardClass &objToCopy) // 运算符\n{\n    cout << \"Copy assignment operator: \"\
  \ << objID << endl;\n    objID = objToCopy.objID;\n    return *this;\n}\n\nvoid\
  \ funcCallByVal(standardClass stdClass)\n{\n    objID = stdClass.objID;\n}\n\nvoid\
  \ funcCallByRef(const standardClass &stdClass)\n{\n    objID = stdClass.objID;\n\
  }\n\nvoid funcCallByPtr(const standardClass *stdClass)\n{\n    objID = stdClass->objID;\n\
  }\n};\n\nint main(int argc, char** argv)\n{\n    standardClass stdClassObj1(1);\
  \                    // Line #1\n    standardClass stdClassObj2(2);            \
  \        // Line #2\n    cout << \"-Line #2 end-\" << endl;\n    stdClassObj1.funcCallByPtr(&stdClassObj2);\
  \        // Line #3\n    cout << \"-Line #3 end-\" << endl;\n    //stdClassObj1.funcCallByPtr(3);\
  \                     // Line #4\n    cout << \"-Line #4 end-\" << endl;\n    return\
  \ 0;\n}\n```\n\n由于指针是一个包含其所指向内容地址的变量，当我们没有没有指针本身时，我们需要传递想要传递的对象的地址。因此，在第 3 行中，我们传递了对象的地址。而对于第\
  \ 4 行，我们无法传递一个整数并让编译器隐式调用构造函数。为什么我们不能这样做呢？\n\n……\n\n```cpp\nstdClassObj1.funcCallByPtr(3);\
  \ // Line #4\n```\n\n你将得到类似下面的编译器错误：\n\n![](img/image00838.jpeg)\n\n我们正在尝试做的是获取一个临时对象的地址。这个临时对象不是左值（lvalue），我们不允许获取非左值的地址。因此产生了错误。\n\
  \n## 显式构造函数\n\n让我们通过讨论 `explicit` 关键字来结束这个话题，该关键字自 C++11 起被引入。在讨论 `explicit` 之前，让我们重新回顾第一个例子（经过了部分精简）。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass standardClass\n{\n\
  \    int objID;\npublic:\n    standardClass(int ID)\n    {\n        objID = ID;\n\
  \        cout << \"Constructor: \" << objID << endl;\n    }\n};\n\nint main(int\
  \ argc, char** argv)\n{\n    standardClass stdClassObj1(1);                    //\
  \ Line #1\n    standardClass stdClassObj2 = 2;                    // Line #2\n \
  \   return 0;\n}\n```\n\nConstructor: 1\nConstructor: 2\n\n这是构造函数被直接调用的两种情况。这样的构造被称为*转换构造函数*（converting\
  \ constructor）。转换构造函数允许编译器使用该构造函数将参数转换为类类型。例如，在上面的第 2 行中，我们实际上应该赋值的是一个 `standardClass`\
  \ 类型的对象。相反我们赋值了一个 `int`。但编译器能够隐式将此 `int` 转换为 `standardClass` 实例，因为存在一个转换构造函数。使用什么样的\
  \ 'explicit' 可以让构造函数变成非转换的。这将限制编译器隐式地将 `int` 转换为对象。让我们试试看。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass standardClass\n{\n    int objID;\npublic:\n    explicit\
  \ standardClass(int ID)               // 现在是显式的\n    {\n        objID = ID;\n  \
  \      cout << \"Constructor: \" << objID << endl;\n    }\n};\n\nint main(int argc,\
  \ char** argv)\n{\n    standardClass stdClassObj1(1);                    // Line\
  \ #1\n    standardClass stdClassObj2 = 2;                    // Line #2\n    return\
  \ 0;\n}\n```\n\n![](img/image00839.jpeg)\n编译器现在无法将 `int` 转换为 `standardClass` 对象了。它不允许隐式地调用构造函数。那么我们需要做什么呢？我们需要显式地调用构造函数。\n\
  \n```cpp\n...\nint main(int argc, char** argv)\n{\n    standardClass stdClassObj1(1);\
  \                    // Line #1\n    standardClass stdClassObj2 = standardClass(2);\
  \    // Line #2\n    return 0;\n}\n```\n\nConstructor: 1\nConstructor: 2\n\n在这个例子中，没有理由要求这个构造函数是\
  \ `explicit` 的。但在某些情况下，你不希望编译器隐式地调用构造函数并传入错误的参数。虽然你可以将接受多个参数的构造函数设为 `explicit`，但这样做并没有太大益处。唯一的效果是在使用\
  \ C++11 的列表初始化时。这结束了我们关于对象构造的话题。从在本话题中讨论的四种方法中，C++11 又增加了几种方法。在本话题中学习的基础知识将有助于理解这些方法的机制。\n\
  \n## 话题 5：指针\n\n如果不谈论指针，关于 C++ 的讨论就是不完整的。在这个话题中，我们将查看指针的几个方面。在这个话题中，我们将查看指针。\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\n\nint main(int argc, char**\
  \ argv)\n{\n    int val = 10;\n    int *intPtr = &val;\n    int **intPtrPtr = &intPtr;\n\
  \    cout << \"val: \" << val << endl;\n    cout << \"*intPtr: \" << *intPtr <<\
  \ endl;\n    cout << \"**intPtr: \" << **intPtrPtr << endl;\n    return 0;\n}\n\
  ```\n\nval: 10\n*intPtr: 10\n**intPtr: 10\n\n这里有一个整数，一个指向整数的指针，以及一个指向指针的指针。\n\n\
  ### 传递指针\n\n现在尝试传递指针函数。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  void funcIntPtr(int *intPtr)\n{\n    cout << \"Value: \" << *intPtr << endl;\n}\n\
  \nvoid funcIntPtrPtr(int **intPtrPtr)\n{\n    cout << \"Value: \" << **intPtrPtr\
  \ << endl;\n}\n\nint main(int argc, char** argv)\n{\n    int val = 10;\n    int\
  \ *intPtr = &val;\n    int **intPtrPtr = &intPtr;\n    funcIntPtr(intPtr);\n   \
  \ funcIntPtrPtr(&intPtrPtr);\n    return 0;\n}\n```\n\nValue: 10\nValue: 10\n\n\
  非常基础的内容。现在让我们看看数组加入后会发生什么变化。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nvoid funcIntPtr(int *intPtr)\n{\n    cout << \"Value: \" << *intPtr << endl;\n\
  }\n\nvoid funcIntPtrPtr(int **intPtrPtr)\n{\n    cout << \"Value: \" << **intPtrPtr\
  \ << endl;\n}\n\nvoid funcIntArr(int intArr[])\n{\n    cout << \"Value: \" << intArr[0]\
  \ << endl;\n}\n\nint main(int argc, char** argv)\n{\n    int val = 10;\n    int\
  \ *intPtr = &val;\n    int **intPtrPtr = &intPtr;\n    int intArr[] = { 1, 2, 3\
  \ };                    // Line #1\n    intPtr = intArr;                       \
  \         // Line #2\n    funcIntPtr(intArr);                             // Line\
  \ #3\n    funcIntArr(intArr);                             // Line #4\n    funcIntPtr(intPtr);\
  \                             // Line #5\n    funcIntPtrPtr(intPtrPtr);        \
  \                // Line #6\n    funcIntPtrPtr(&intPtr);                       \
  \  // Line #7\n    return 0;\n}\n```\n\nValue: 10\nValue: 10\nValue: 1\nValue: 10\n\
  Value: 10\n\n我们定义了一个新的整数数组，还定义了一个接受整数数组参数的函数。让我们逐行查看我们在这里做了什么。\n\n*   第 1 行定义了一个包含\
  \ 3 个元素的整数数组并对其进行了初始化。\n\n*   在第 2 行中，我们将 `intArr` 赋值给之前定义的整指针。注意 `intPtr` 指向整数和指向数组的区别。\n\
  \n*   在第 3 行中，我们将数组传递给一个接受整数指针作为参数的函数。正如你所看到的，它打印了数组的第一个元素。\n\n\n\n\n这意味着，数组是以指针的形式传递的。当我们对该指针进行解引用时，它打印的是数组的第一个元素。这意味着数组名是一个指向其第一个元素的指针。\n\
  \n事实上，这就是 C/C++ 将数组传递给函数的方式。它们并不会像按值传递那样被复制。当数组作为参数传递给函数时，它是作为指向其第一个元素的指针进行传递的。\n\
  \n*   `Line 4` 正在将数组传递给函数，该函数期望一个整数数组。这块没什么特别的。\n*   在第 5 行中，我们将 `intPtr` 传递给函数，该函数期望一个指向整数的指针，而这恰好是它所指向的内容。\n\
  *   `Line 6` 有点意思。我们将一个指向整数的指针传递给函数，该函数期望一个整数数组作为参数。但从代码编译的情况来看，编译器似乎很乐意接受一个指向整数的指针作为整数数组参数。\n\
  \n为什么会这样？正如我之前提到的，这是因为编译器将数组参数视为指向其第一个元素的指针。因此，对于编译器来说，`funcIntPtr` 和 `funcIntArr`\
  \ 是完全相同的函数，都拥有一个指向整数的参数。\n\n*   在 `line 7` 中，我们传递的是一个指向指针的指针。这与我们在上一个示例中所做的是一样的。\n\
  \n既然我们已经明白了这一点，你是否好奇编译器是如何在第 7 行对指针调用下标运算符的？让我们来揭秘吧。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nint main(int argc, char** argv)\n\n{\n\nint intArr[] =\
  \ { 1, 2, 3 };\n\nint *intPtr = intArr;\n\ncout << *intPtr << endl;            \
  \            // Line 1\ncout << intPtr[0] << endl;                     // Line 2\n\
  cout << intPtr[1] << endl;                     // Line 3\ncout << *(intPtr + 1)\
  \ << endl;              // Line 4\ncout << *(intPtr + 2) << endl;              //\
  \ Line 5\ncout << 2[intPtr] << endl;                      // Line 6\n\nreturn 0;\n\
  \n}\n```\n\n1\n1\n2\n2\n3\n3\n\n*   `Line 1` 对指针进行解引用，打印出 1。这意味着 `intPtr` 确实指向 `intArr`\
  \ 的第一个元素。\n*   `Line 2` 看起来有点奇怪。我们在指针上使用了下标运算符。但它有效。这会再次打印出 `intArr` 的第一个元素。\n*\
  \   `Line 3` 访问 `intArr` 的第二个元素，并正确地打印出 2。这说明你确实可以使用下标运算符对指针进行解引用，就像处理普通数组一样。但这是如何可能的？\n\
  *   `Line 4` 解释了为什么第 2 行和第 3 行有效。这是因为指针上所有的下标运算符都会被转换为一个表达式，如第 4 行所示。指针根据增加的值向前移动，然后进行解引用。但编译器是如何确切知道该移动多少的？它通过指针的类型知道。由于\
  \ `intPtr` 是整数指针，编译器知道它应该移动 4 字节（我们在主题 1 中发现在该平台上一个 `int` 是 4 字节）。\n*   `Line 5`\
  \ 与第 4 行相同，但现在访问的是数组的第 3 个元素。\n*   `Line 6` 看起来也很奇怪。你可能永远不想使用这种写法，但它展示了我们所说的编译器如何将下标运算符转换为加法然后解引用。所以对于编译器来说，第\
  \ 6 行看起来就像：\n\n```cpp\ncout << *(2 + intPtr) << endl;\n```\n\n在例示例中，我们将 `intPtr`\
  \ 赋值为 `intArr`。我提到过 `intPtr` 是指向其第一个元素的指针。从这个意义上说，我们应该能够这样给 `intPtr` 赋值指向数组第二个元素的指针：\n\
  \n```cpp\nint *intPtr = intArr[1];\n```\n\n这样做的话，你将得到一个错误，说无法从 'int' 转换为 'int *'。但为什么呢？\n\
  \n因为 `intArr` 本身是一个指向其第一个元素的指针。但 `intArr[1]` 只是一个整数变量。如果是这样的话，我们应该能够像在上一个示例中对 `val`\
  \ 那样赋值它的地址，对吧？我们确实可以。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  int main(int argc, char** argv)\n\n{\n\nint intArr[] = { 1, 2, 3 };\n\nint *intPtr\
  \ = &(intArr[1]);\n\ncout << *intPtr << endl;\ncout << intPtr[0] << endl;\ncout\
  \ << intPtr[1] << endl;\ncout << *(intPtr + 1) << endl;\ncout << *(intPtr + 2) <<\
  \ endl;\ncout << 2[intPtr] << endl;\n\nreturn 0;\n}\n```\n\n2\n3\n3\n-85993460\n\
  -85993460\n\n你可以轻松地解码输出。需要注意的是最后两个输出。你可以猜为什么它们是垃圾值。因为 `intPtr` 现在指向 `intArr` 的第二个元素，而第\
  \ 5 行和第 6 行正尝试访问数组的第四个元素，而该元素并不存在。所以它正在读取越界内存并获取垃圾值。注意，你可以使用下标运算符或指针加法来处理指针，`intPtr`\
  \ 现在指向的是一个数组，正如我们在上一个示例中处理 `val` 那样。\n\n### 字符及其指针\n\n处理字符及其指针有时会很困惑。在接下来的部分我们将查看字符及其指针的各种用法。除了函数名外，其他部分与整数示例非常相似。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid funcCharPtr(char *charPtr)\n\
  {\n    cout << \"Value: \" << *charPtr << endl;\n}\n\nvoid funcCharPtrPtr(char **charPtr)\n\
  {\n    cout << \"Value: \" << **charPtr << endl;\n}\n\nvoid funcCharArr(char charArr[])\n\
  {\n    cout << \"Value: \" << charArr[0] << endl;\n}\n\nint main(int argc, char**\
  \ argv)\n{\n    char val = 'a';\n    char *charPtr = &val;\n    char **charPtrPtr\
  \ = &charPtr;\n\n    funcCharPtr(charPtr);             // Line 1\n    funcCharArr(charPtr);\
  \              // Line 2\n    funcCharPtrPtr(charPtrPtr);       // Line 3\n    char\
  \ charArr[] = { 'x', 'y', 'z' }; // Line 4\n    charPtr = charArr;             \
  \   // Line 5\n    funcCharPtr(charArr);             // Line 6\n    funcCharArr(charPtr);\
  \              // Line 7\n    funcCharPtr(charPtr);             // Line 8\n    funcCharArr(charPtr);\
  \              // Line 9\n    funcCharPtrPtr(charPtrPtr);       // Line 10\n\n \
  \   return 0;\n}\n```\n\nValue: a\nValue: a\nValue: a\nValue: x\nValue: x\nValue:\
  \ x\n\n\n\n\n```cpp\ncout << \"Value: \" << charPtrArr[0] << endl;\n\n}\n\nvoid\
  \ funcCharPtr1(char * charPtr)\n{\ncout << \"Value: \" << charPtr << endl;\n}\n\n\
  void funcCharPtr2(char * charPtr)\n{\ncout << \"Value: \" << *charPtr << endl;\n\
  cout << \"Value: \" << charPtr[3] << endl;\n}\n\nint main(int argc, char** argv)\n\
  {\nchar charArr1[] = { 'A', 'r', 'r', '1', '\\0' };              // Line 1\nchar\
  \ charArr2[] = { 'A', 'r', 'r', '2', '\\0' };              // Line 2\nchar charArr3[]\
  \ = { 'A', 'r', 'r', '3', '\\0' };              // Line 3\nchar *charPtrArr[] =\
  \ { charArr1, charArr2, charArr3 };\nfuncCharPtrArr(charPtrArr);               \
  \                  // Line 4\nfuncCharPtr1(*charPtrArr);                       \
  \          // Line 5\nfuncCharPtr1(charArr1);                                  \
  \   // Line 6\nfuncCharPtr2(*charPtrArr);                                 // Line\
  \ 7\nreturn 0;\n}\n```\n\nValue: Arr1\nValue: Arr1\nValue: Arr1\nValue: A\nValue:\
  \ 3\n\n在讨论结果之前，让我们先来说一下这里发生了什么。\n\n![](img/image00842.jpeg)\n\n上面的图显示了指针和数组之间的关系。注意箭头。这些箭头显示了每个元素与变量名的绑定。记住，数组名是指向其第一个元素的指针。这正是箭头所描绘的。每个数组名都是指向其第一个元素的指针：`charPtrArr`\
  \ 是指向 `charArr1` 的指针，而 `charArr1` 是指向字符 'A' 的指针，以此此类推。\n\n现在，理解上述代码的结果应该非常容易。注意我在每个数组的末尾都包含了终止字符。包含这个字符对代码来说没有特殊意义，只是为了让输出看起来更整洁。如果没有终止字符，当我们打印字符数组时，输出将包含垃圾值。现在我们来看一遍代码。\n\
  \n*   `charPtrArr` 是一个指向字符的指针数组。记住，数组名是指向其第一个元素的指针。所以我们可以用我们在开头定义的三个数组来初始化 `charPtrArr`，因为它们是指向字符的指针（指向它们的第一个字符）。\n\
  *   `funcCharPtrArr` 具有一个指向字符的指针数组参数。这与 `charPtrArr` 的类型相同，所以传递它时应该没有问题。它打印了 'Arr1'，你知道这是为什么。\n\
  \n正如我们之前学过的，对于编译器来说，`charPtrArr[0]` 就是 `charPtrArr`。它指向 `charArr1`。因此，我们将 `charArr1`\
  \ 传递给 `cout`，它通过打印数组内容来予以响应。这就是为什么我们需要终止字符，让 `cout` 知道序列何时结束。\n\n*   `funcCharPtr1`\
  \ 接收一个指向字符的指针参数并将其打印。在第 5 行中，我们传递了 `charPtrArr`。你可以很容易理解我们在这里实际上传递了什么。我们传递了 `charArr1`，它正如我们预期的那样打印出\
  \ `Arr1`。注意与第 4 行输出的相似性，并理解在两种情况下我们向 `cout` 传递了相同的内容。\n*   为了巩固你的理解，我使用 `charArr1`\
  \ 调用 `funcCharPtr1`，以说明这与传递 `charPtrArr` 完全相同。\n*   `funcCharPtr2` 接收与 `funcCharPtr1`\
  \ 相同的参数类型，但 `cout` 语句有点不同。我想再次展示变量名和指针之间的关系。同时注意这里传递的参数略有不同，但你可以很容易理解我们传递了什么。`(charPtrArr+2)`\
  \ 只是 `charArr3`。\n\n接着在 `funcCharPtr2` 中，我们将 `charArr3` 传递给 `cout`。那么我们在这里传递了什么呢？你知道\
  \ `charArr3` 是指向第一个元素 'A' 的指针，所以对其进行解引用只需打印出 'A'。最后，为了保险起见，我们在下一语句中也打印了最后一个字符。这证实了我们确实传递了\
  \ `charArr3`。\n\n如果我们将字符数组替换为整数数组，以及一个指向整数的指针数组，并更改函数参数的类型，一切都能正常工作，但有一个例外。当我们将字符数组传递给\
  \ `cout` 时，它打印了整个数组。但如果我们对整数数组这样做，`cout` 就不会打印所有的整数元素。相反，它只会打印它的指针值。即指向第一个元素的地址。这并不是因为字符指针有任何特殊之处，而是因为\
  \ `cout` 处理不同类型的方式。\n\n让我们来看另一个观察结果。我们之前讨论过，数组是被编译器作为指针传递给函数的。因此，函数参数 `char*` 和\
  \ `char[]` 对编译器来说是等等的。我们可以进行如下操作：\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nvoid funcCharPtrArr(char *charPtrArr[])\n{\ncout << \"Value: \" << charPtrArr[0]\
  \ << endl;\n}\n\nvoid funcCharPtrArr2(char **charPtrArr)\n{\ncout << \"Value: \"\
  \ << charPtrArr[0] << endl;\n}\n\nint main(int argc, char** argv)\n{\nchar charArr1[]\
  \ = { 'A', 'r', 'r', '1', '\\0' };\nchar charArr2[] = { 'A', 'r', 'r', '2', '\\\
  0' };\nchar charArr3[] = { 'A', 'r', 'r', '3', '\\0' };\nchar *charPtrArr[] = {\
  \ charArr1, charArr2, charArr3 };\nfuncCharPtrArr(charPtrArr);\nfuncCharPtrArr2(charPtrArr);\n\
  return 0;\n}\n```\n\nValue: Arr1\nValue: Arr1\n`funcCharPtrArr` 与之前相同，`funcCharPtr2`\
  \ 的参数稍有不同。它接收一个指向指针的指针。但你现在知道这两个函数是相同的。由于数组名本质上是一个指针，我们可以将 `charPtrArr[]` 写为 `(*charPtrArr)`。所以指针数组是一个指向指针的指针。\n\
  \n在我们结束这个主题之前，让我们另一个例子来演示指针对编译器意味着什么。正如我之前提到的，指针只是指向内存块的地址。指向对象的指针与指向整数或其他任何内容的指针没有区别。所有指针的大小都相同，它们都有内存地址。指针的类型定义了它。指针的类型告诉编译器它指向的内存块中有什么。因为你看，指针只指向内存块的起始。编译器并不知道那个特定的内存块有多大。它从指针的类型中推断这些信息。通过\
  \ `sizeof(typeOfPointer)` 确定内存块的大小是一个简单的问题。这就是为什么你永远无法解引用 `void**` 指针，因为编译器不知道如何处理那个内存块。这个例子应该能清楚这一点。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  int baseClassVar;\nbaseClass(int baseVal) : baseClassVar(baseVal)\n{}\n\nvoid printVals()\n\
  {\ncout << \"baseClass::baseClassVar- \" << baseClassVar << endl;\n}\n};\n\nclass\
  \ derivedClass : public baseClass\n{\npublic:\nint derivedClassVar;\nderivedClass(int\
  \ baseVal, int derivedVal) : baseClass(baseVal), derivedClassVar(derivedVal)\n{}\n\
  \nvoid printVals()\n{\nbaseClass::printVals();\ncout << \"derivedClass::derivedClassVar-\
  \ \" << derivedClassVar << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\n\
  baseClass* baseClassPtr = new baseClass(1);\nstatic_cast<derivedClass*>(baseClassPtr)->printVals();\n\
  return 0;\n}\n```\n\nbaseClass::baseClassVar- 1\nderivedClass::derivedClassVar-\
  \ 7536751\n\n\n\n\n我们所做的是让一个 `baseClass` 指针指向一个 `baseClass` 实例。然后将其静态强制转换（static\
  \ cast）为 `derivedClass`。由于 `derivedClass` 处于同一个层次结构中，编译器可以接受这一点，并信任我们它确实指向一个 `derivedClass`\
  \ 实例。接着，我们调用 `derivedClass` 的 `printVals` 函数。`derivedClass` 的 `printVal` 函数访问了 `derivedClassVar`。编译器假设\
  \ `baseClassPtr` 指向的内存块包含一个大小为 `sizeof(derivedClass)` 的完整 `derivedClass` 实例，但实际上它只包含一个\
  \ `baseClass` 实例，后者比 `derivedClass` 小。因此，当编译器访问 `derivedClassVar` 时，它访问的是一个不属于它的位置，从而打印出垃圾值。对于编译器来说，它无法进行任何边界检查。边界是由指针类型设置的。我们将在讨论类成员偏移时学习更多相关内容。在此之前，请记住，编译器了解对象类型和大小的唯一方法是通过指针类型。\n\
  \n所以现在你应该理解你一直在编写的 `main` 函数的第二个参数了。`char** argv` 基本上是 `char *argv[]`。它是一个指向 char\
  \ 的指针数组，与我们示例中的 `charPtrArr` 完全相同，而且你所知，`argv` 包含了传递给 `main` 函数的参数列表。\n\n## 主题 6\n\
  \n## 不可构造、不可拷贝的类\n\n在“对象构造”主题中，我们讨论了对象是如何创建、拷贝和赋值的。每个类都应该具备三个主要函数：`constructor`（构造函数）、`copy\
  \ constructor`（拷贝构造函数）和 `assignment operator`（赋值运算符）。C++11 了一些额外的函数，但我们将重点限制在这三个主要函数上。在本主题中，我们将讨论如何使一个类变得不可构造或不可拷贝，并详细研究这些函数。\n\
  \n### 不可构造的类\n\n构造或实例化一个对象意味着什么？它意味着调用类的其中一个构造函数。那么，你如何让一个类变得不可构造呢？你只需要让类的构造函数无法被调用即可。有两种方法可以实现：\n\
  \n*   使类成为抽象类\n*   将构造函数设为私有\n\n#### 抽象类\n\n与 Java 不同，C++ 没有用于使类抽象的 `abstract` 关键字。使\
  \ C++ 类变为抽象的方法是拥有一个纯虚函数。如何让一个虚函数变成纯虚？给函数赋值为零。\n\n```cpp\nclass AbstractClass {\n\
  public:\n    AbstractClass();\n    virtual void pureVirtFunc() = 0;  // <-- 这使得该类成为抽象类。\n\
  };\n```\n\n那么，一个类是抽象的意味着什么？\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass AbstractClass {\npublic:\n    AbstractClass();\n    virtual void pureVirtFunc()\
  \ = 0; // <-- 这使得该类成为抽象类。\n};\n\nint main(int argc, char** argv)\n{\n    // AbstractClass\
  \ absClass; // 这会报错\n    return 0;\n};\n```\n\n![](img/image00843.jpeg)\n\n这意味着你不能通过调用构造函数来实例化对象。你知道，唯一的方法是派生该类并实现纯虚函数。\n\
  \n顺便问一下，非虚函数变成抽象的意味着什么？这没有意义。使函数变为“纯”的目的是让派生类去定义它。因此，该函数必须是虚函数。但如果你尝试让一个非虚函数变成纯虚会发生什么？\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass AbstractClass {\n\
  public:\n    AbstractClass();\n    void pureVirtFunc() = 0; // <-- (^_^)\n};\n\n\
  int main(int argc, char** argv)\n{\n    cout << \"Can we make it pure???\" << endl;\n\
  \    return 0;\n};\n```\n\n![](img/image00844.jpeg)\n\n编译器显然很智能。\n\n那么，使类变为抽象有什么用？它让类本身无法实例化。但任何派生（并定义了纯虚函数）的类都可以。那么，使类变为抽象的真正动机是让该类成为基类。确保任何想使用该类的人都派生它并实现纯虚函数。我们将在另一个主题中研究这个概念，但你在这里需要理解的是抽象类在不可构造性上的区别。抽象类对象是不可构造的，因为它们不应该被原样构造，而不是因为它们不应该被构造。正如我们将看到的，它们是有区别的。\n\
  \n抽象类仍然可以通过派生来构造。抽象类的构造函数可以是公有的或保护的。使类变为抽象的动机是使其成为基类。基类必须能够被构造。但如果你想让你的类完全不可构造呢？你移除它可以被构造的唯一方法。你知道构造函数是类被实例化的唯一方法。你让构造函数无法从类外部被调用。怎么做？将构造函数设为私有。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass NonContructible {\n\
  private:\n    NonContructible() { cout << \"Haha. You can't call this.\" << endl;\
  \ }\n};\n\nint main(int argc, char** argv)\n{\n    // NonContructible nonCons; //\
  \ 这会报错\n    return 0;\n};\n```\n\n![](img/image00845.jpeg)\n\n编译器并不高兴，因为它无法调用私有方法。那么你该如何处理这样的类呢？像这样，你做不了什么。你没有办法实例化它。将构造函数设为私有的用途之一是在\
  \ `Singleton`（单例）模式中：\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class Singleton {\nprivate:\n    static Singleton *theSingleton;\n    Singleton()\
  \ { cout << \"This will be called once.\" }\npublic:\n    static Singleton* getSingleton()\
  \ {\n        if (!theSingleton)\n            theSingleton = new Singleton;\n   \
  \     return theSingleton;\n    }\n};\n\nSingleton* Singleton::theSingleton = NULL;\n\
  \nint main(int argc, char** argv)\n{\n    Singleton *singleton1 = Singleton::getSingleton();\n\
  \    Singleton *singleton2 = Singleton::getSingleton();\n    Singleton *singleton3\
  \ = Singleton::getSingleton();\n    return 0;\n}\n```\n\n所有指针指向同一个对象。到目前为止，我们看到的是让一个类不可构造。。我们将查看如何使其不可拷贝。\n\
  \n### 不可拷贝的类\n\n让我们复习一下主题 4 中的拷贝构造函数。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass standardClass\n{\n    int objID;\npublic:\n    standardClass(int\
  \ ID) // 构造函数\n    {\n        objID = ID;\n    }\n    ~standardClass() // 析构函数\n\
  \    standardClass(const standardClass &objToCopy) // 拷贝构造函数\n    {\n        objID\
  \ = objToCopy.objID;\n    }\n    standardClass & operator=(const standardClass &objToCopy)\
  \ // 赋值运算符\n    {\n        objID = objToCopy.objID;\n        return *this;\n   \
  \ }\n};\n\nint main(int argc, char** argv)\n{\n    standardClass stdClassObj1(1);\n\
  \    standardClass stdClassObj2(stdClassObj1); // Line #1\n    standardClass stdClassObj3\
  \ = stdClassObj2;  // Line #2\n    stdClassObj1 = stdClassObj2;              //\
  \ Line #3\n    stdClassObj2 = standardClass(4);         // Line #4\n    stdClassObj3\
  \ = 5;                        // Line #5\n    return 0;\n}\n```\n\n\n\n第 1 行和第 2\
  \ 行调用了拷贝构造函数，第 3-5 行调用了赋值运算符（构造函数在第 4 行中也被调用）。使一个类不可拷贝意味着不允许用户执行像上述代码中的操作。这意味着你限制了从一个对象创建另一个对象。停止拷贝。现在你知道如何做到这一点。我们只需要将执行拷贝的函数设置为\
  \ `private`。简单地将拷贝构造函数和拷贝赋值运算符设置为 `private`。让我们这样做吧。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass nonCopyable\n{\nint objID;\n\npublic:\nnonCopyable(int\
  \ ID) // 构造函数\n{\nobjID = ID;\n}\n~nonCopyable()         // 析构函数\n{}\n\nprivate:\n\
  nonCopyable(const nonCopyable &objToCopy)        // 拷贝构造函数\n{\nobjID = objToCopy.objID;\n\
  }\nnonCopyable & operator=(const nonCopyable &objToCopy) // 赋值运算符\n{\nobjID = objToCopy.objID;\n\
  return *this;\n}\n};\n\nint main(int argc, char** argv)\n{\nnonCopyable ncClassObj1(1);\n\
  nonCopyable ncClassObj2(ncClassObj1);       // Line #1\nnonCopyable ncClassObj3\
  \ = ncClassObj2;     // Line #2\n                    ncClassObj1 = ncClassObj2;\
  \                             // Line #3\n                    ncClassObj2 = nonCopyable(4);\
  \                        // Line #4\n                    ncClassObj3 = 5;      \
  \                               // Line #5\nreturn 0;\n}\n```\n\n![](img/image00847.jpeg)\n\
  \n编译器会抛出多个错误，你可以轻松地理解它们的含义。它无法访问拷贝构造函数和赋值运算符来执行拷贝。\n\n注意上面的代码，我们把构造函数设为了 `public`。当然，这是必要的，因为我们需要实例化对象，而且否则没有其他工具函数。现在，如果我们想让一个类既不可构造又不可拷贝呢？仅将构造函数设置为\
  \ `private` 就足够吗？毕竟，如果你无法构造，又如何拷贝呢，对吧？让我们来看一个明显的例子。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass nonCopyable\n{\nint objID;\nclass nonCopyable(int\
  \ ID) // 构造函数\n{\nobjID = ID;\n}\n\npublic:\nnonCopyable(const nonCopyable &objToCopy)\
  \ // 拷贝构造函数\n{\nobjID = objToCopy.objID;\n}\nnonCopyable & operator=(const nonCopyable\
  \ &objToCopy) // 赋值运算符\n{\nobjID = objToCopy.objID;\nreturn *this;\n}\n~nonCopyable()\
  \ // 析构函数\n{          }\nstatic nonCopyable * getObject()\n{\nreturn new nonCopyable(1);\n\
  }\n};\n\nint main(int argc, char** argv)\n{\nnonCopyable *ncClassObjPtr = nonCopyable::getObject();\n\
  nonCopyable ncClassObj2(*ncClassObjPtr);\nnonCopyable ncClassObj3 = ncClassObj2;\n\
  delete ncClassObjPtr;\nreturn 0;\n}\n```\n\n在上面的代码中，我们把构造函数设为了 `private`，并提供了一个工具函数来接收新对象（类似于单例模式，但我们并没有限制为一个对象）。然后，我们把拷贝构造函数和赋值运算符设为了\
  \ `public`。这段代码可以编译并运行，原因显而易见。我只是想向你展示，如果你想让一个类既不可构造又不可拷贝，仅将构造函数设置为 `private` 是不够的。但是，如果我们完全不定义拷贝构造函数和赋值运算符呢？让我们移除这两个函数并看。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass nonCopyable\n{\nint\
  \ objID;\nclass nonCopyable(int ID) // 构造函数\n{\nobjID = ID;\n}\n\npublic:\nstatic\
  \ nonCopyable * getObject()\n{\nreturn new nonCopyable(1);\n}\n};\n\nint main(int\
  \ argc, char** argv)\n{\nnonCopyable *ncClassObjPtr = nonCopyable::getObject();\n\
  nonCopyable ncClassObj2(*ncClassObjPtr);\nnonCopyable ncClassObj3 = ncClassObj2;\n\
  delete ncClassObjPtr;\nreturn 0;\n}\n```\n\n这段代码可以顺利编译，并且会无问题地拷贝 `*ncClassObjPtr`。但为什么呢？因为，由于我们没有定义拷贝构造函数和赋值运算符，编译器为我们生成了它们。有一些规则规定编译器是否会生成默认的拷贝构造函数和赋值运算符。但你需要记住的是，这些编译器生成的函数是\
  \ `public` 的。在像这样的几乎为空的类中，编译器会选择进行位拷贝而不是定义显式函数。我们将在稍后的主题中讨论这一点。但需要记住的是，如果你不定义它们，编译器就会为你完成工作。所以在这种情况下，编译器乐意为我们执行拷贝。因此，如果你不想让你的类被拷贝，请将这些函数定义为\
  \ `private`。\n\n我应该提到，除了将它们设置为 `private` 之外，还有一种不定义拷贝构造函数和赋值运算符的概念。如下：\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass nonCopyable\n{\nint objID;\n\
  \npublic:\nnonCopyable(int ID) // 构造函数\n{\nobjID = ID;\n}\n~nonCopyable()    //\
  \ 析构函数\n\nprivate:\nnonCopyable(const nonCopyable &objToCopy); \nnonCopyable & operator=(const\
  \ nonCopyable &objToCopy);\n```\n\n这里的想法是，如果有一个 `friend` 类，那么该类将无法拷贝，否则友类允许调用私有函数。当这些函数没有定义时，代码可以正常编译，但链接器会报错，因为链接器找不到这些函数的实现。但你可能需要拷贝构造函数和赋值运算符的实现。无论你如何选择，请记住，如果你希望这些函数是私有的，请定义它们。\n\
  \n在我们离开不可拷贝类之前，不可拷贝类的派生类将会如何？\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass nonCopyable\n{\nint objID;\n\npublic:\nnonCopyable(int ID) // 构造函数\n{\n\
  objID = ID;\n}\n~nonCopyable()         // 析构函数\n{}\n\nprivate:\nnonCopyable(const\
  \ nonCopyable &objToCopy)        // 拷贝构造函数\n{\nobjID = objToCopy.objID;\n}\nnonCopyable\
  \ & operator=(const nonCopyable &objToCopy) // 赋值运算符\n{\nobjID = objToCopy.objID;\n\
  return *this;\n}\n};\n\nclass derivedNonCopyable : public nonCopyable\n{\npublic:\n\
  derivedNonCopyable(int ID) : nonCopyable(ID)\n{}\n};\n\nint main(int argc, char**\
  \ argv)\n{\nderivedNonCopyable dncClassObj1(2);\nderivedNonCopyable dncClassObj2(dncClassObj1);\
  \   // Line #1\nderivedNonCopyable dncClassObj3 = dncClassObj2;   // Line #2\ndncClassObj1\
  \ = dncClassObj2;                             // Line #3\ndncClassObj2 = derivedNonCopyable(4);\
  \                        // Line #4\ndncClassObj3 = 5;                         \
  \            // Line #5\n\nreturn 0;\n}\n```\n\n\n\n编译器并不高兴。它正在抱怨 `nonCopyable`\
  \ 类的拷贝构造函数和赋值运算符是私有的。正如你多次看到的那样，上方的第 1 行和第 2 行调用了拷贝构造函数，而第 3-5 行调用了赋值运算符。如果你注释掉第\
  \ 1-5 行，你会发现没有编译器错误。由于构造函数是公共的，`dncClassObj1` 可以无问题地进行构造。但如果你随后只取消了第 1 行的注释，编译器将抛出一个错误，说\
  \ `nonCopyable` 的拷贝构造函数是私有的。如果你取消了第 3-5 行的任何一行，它都会抱怨赋值运算符是私有的。\n\n发生这种情况的原因是：只要程序没有调用拷贝构造函数或赋值运算符，编译器就不会理会它们。但当有语句调用拷贝构造函数或赋值运算符时，如果类没有定义它们，编译器会为你为你生成它们，而生成的函数将包含对基类拷贝构造函数和赋值运算符的调用。但如果\
  \ `nonCopyable` 将这些内容设为私有，编译器就无法这样做，因此你得到了错误。\n\n让我稍作绕路。假设所有的 `nonCopyable` 函数都是公共的（它就不不再是不可拷贝的）。你该如何实现派生类的拷贝构造函数？\n\
  \n你应该这样写。注意，`nonCopyable` 现在是可以拷贝的。\n\n```cpp\n#include<iostream>\n\nusing namespace\
  \ std;\n\nclass nonCopyable\n{\nint objID;\n\npublic:\nnonCopyable(int ID) // 构造函数\n\
  {\nobjID = ID;\n}\n~nonCopyable()               // 析构函数\n{              }\npublic:\n\
  nonCopyable(const nonCopyable &objToCopy) // 拷贝构造函数\n{\nobjID = objToCopy.objID;\n\
  }\nnonCopyable & operator=(const nonCopyable &objToCopy) // 赋值运算符\n{\nobjID = objToCopy.objID;\n\
  return *this;\n}\n};\n\nclass derivedNonCopyable : public nonCopyable\n{\npublic:\n\
  derivedNonCopyable(int ID) : nonCopyable(ID)\n{}\nderivedNonCopyable(const derivedNonCopyable\
  \ &objToCopy) : nonCopyable(objToCopy)\n{}\n};\n\nint main(int argc, char** argv)\n\
  {\nderivedNonCopyable dncClassObj1(2);\nderivedNonCopyable dncClassObj2(dncClassObj1);\
  \      // Line #1\nderivedNonCopyable dncClassObj3 = dncClassObj2;      // Line\
  \ #2\nreturn 0;\n}\n```\n\n我们在初始化列表中调用了 `nonCopyable` 拷贝构造函数。但你知道你必须在初始化列表中调用它吗？如果不会怎样？\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass nonCopyable\n{\nint\
  \ objID;\n\npublic:\nnonCopyable(int ID) // 构造函数\n{\nobjID = ID;\n}\n~nonCopyable()\
  \ // 析构函数\n{              }\npublic:\nnonCopyable(const nonCopyable &objToCopy)\
  \ // 拷贝构造函数\n{\nobjID = objToCopy.objID;\n}\n\nclass derivedNonCopyable : public\
  \ nonCopyable\n{\npublic:\nderivedNonCopyable(int ID) : nonCopyable(ID)\n{}\nderivedNonCopyable(const\
  \ derivedNonCopyable &objToCopy)\n{\nnonCopyable::nonCopyable(objToCopy);\n}\n};\n\
  \nint main(int argc, char** argv)\n{\nderivedNonCopyable dncClassObj1(2);\nderivedNonCopyable\
  \ dncClassObj2(dncClassObj1);      // Line #1\nderivedNonCopyable dncClassObj3 =\
  \ dncClassObj2;      // Line #2\nreturn 0;\n}\n```\n\n为什么你收到了关于默认构造函数的错误？为什么我们不能在方法体中调用基类的拷贝构造函数？\n\
  \n因为，请记住我们正在调用拷贝构造函数，这与调用赋值运算符不同，此时对象并不存在。拷贝构造函数将实例化一个新的对象。所以当派生类的拷贝构造函数被调用以创建新的派生类对象时，它必须先有一个基类对象。因为在这一点上不存在基类对象。这类似于调用派生类构造函数。在派生类构造函数执行工作之前，它会先调用基类构造函数来构造它的部分。拷贝构造函数也是同样的操作。它需要基类来构造自己。那么派生类的拷贝构造函数做了什么呢？它调用了基类构造函数。这就是为什么我们得到这个错误。因为\
  \ `nonCopyable` 没有一个接受无参数的构造函数（如果有的话，我们就不会有这个错误了）。\n\n那么在初始化列表中编写拷贝构造函数会改变这一点吗？原因和我们在构造函数的初始化列表中初始化\
  \ `const` 变量或引用相同。我们在方法体之前初始化了它。因为编译器需要在到达方法体之前初始化它们。拷贝构造函数的情况也一样。如果没有调用基类构造函数或拷贝构造函数来初始化基类对象，它就会尝试初始化基类对象。因此，与其在初始化列表中调用拷贝构造函数，你完全可以调用构造函数（在本例中，由于变量是私有的，无法将其传递给构造函数）。\n\
  \n注意我用类限定符调用了 `nonCopyable` 拷贝构造函数吗？如果我们这样调用：\n\n```cpp\nclass derivedNonCopyable\
  \ : public nonCopyable\n{\npublic:\nderivedNonCopyable(int ID) : nonCopyable(ID)\n\
  {}\nderivedNonCopyable(const derivedNonCopyable &objToCopy)\n{\nnonCopyable(objToCopy);\
  \ // Line 1\n};\n```\n\n你会得到一个新的错误：什么是 \"redefinition of formal parameter 'objToCopy'\"\
  ？因为你看到，由于你不允许直接调用构造函数，上面的第 1 行定义了一个类型为 `nonCopyable` 的变量 `objToCopy`就像定义了一个整数 `int(5)`。由于已经有一个同名的变量，编译器报错。这就是为什么你需要用类来限定这个调用。\n\
  \n抱歉做了这么长的绕路。我认为这是一个值得提到的。\n\n### 栈与堆分配\n\n控制对象实例化的位置。在 C++ 中，对象可以存在的两个实体：栈（`stack`）和堆（`heap`）。栈用于过程记录和局部变量，而堆用于进行动态分配。这里有一个简单的例子。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass someClass\n{\nint\
  \ objID;\n\npublic:\nsomeClass(int ID)\n{\nobjID = ID;\ncout << \"Constructor for\
  \ ID: \" << objID << endl;\n}\n~someClass()\n{\ncout << \"Destructor for ID: \"\
  \ << objID << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\nsomeClass someClassObj(1);\
  \                           // Line 1\nsomeClass *someClassPtr = new someClass(2);\
  \            // Line 2\ndelete someClassPtr;                                 //\
  \ Line 3\nreturn 0;\n}\n```\n\nConstructor for ID: 1\nConstructor for ID: 2\nDestructor\
  \ for ID: 2\nDestructor for ID: 1\n\n-   第 1 行在栈上创建 `someClassObj`。这是输出中的第一个构造函数打印。\n\
  -   第 2 行在堆上创建一个 `someClass` 对象并将其地址返回给 `someClassPtr`。第二个构造函数打印对应于实例化。\n-   第 3\
  \ 行通过显式调用析构函数删除 `someClassPtr`。我们必须释放分配的每个堆内存。这是输出中的第三次打印。\n-   最后看到 `someClassObj`\
  \ 的析构函数被调用。\n\n这里需要注意的几点：\n\n-   所有在堆分配的对象必须显式释放。编译器不会为我们做这一点。\n-   栈分配的对象在离开作用域时会自动释放。`someClassObj`\
  \ 是在 `main` 作用域内创建的，当 `main` 返回时，`someClassObj` 离开作用域，因此其析构函数会被自动调用。\n\n\n\n这是关于\
  \ C++ 需要注意的重要要点之一。与 Java/C# 具有自动垃圾回收不同，在 C++ 中，每当你使用堆内存时，都需要自己进行清理工作。栈则是另一回事，编译器会负责清理它。因此，所有自动变量在离开作用域时都会由编译器处理。让我们给代码添加一小小的改进。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass someClass\n{\nint\
  \ objID;\npublic:\nsomeClass(int ID)\n{\nobjID = ID;\ncout << \"Constructor for\
  \ ID: \" << objID << endl;\n}\n~someClass()\n{\ncout << \"Destructor for ID: \"\
  \ << objID << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\nsomeClass someClassObj(1);\
  \                  // Line 1\n{\nsomeClass someClassObj2(3);                 //\
  \ Line 2\n}\nsomeClass *someClassPtr = new someClass(2); // Line 3\ndelete someClassPtr;\
  \                                                              // Line 4\nreturn\
  \ 0;\n}\n```\n\nConstructor for ID: 1\nConstructor for ID: 3\nDestructor for ID:\
  \ 3\nConstructor for ID: 2\nDestructor for ID: 2\nDestructor for ID: 1\n\n注意我们添加了一个作用域对象\
  \ `someClassObj2`。由于它在一对大括号内，`someClassObj2` 的作用域被限制在这些括号之内。一旦执行离开右大括号 `}`，`someClassObj2`\
  \ 就会离开作用域，编译器就会调用它的析构函数。这就是为什么你看到构造函数和析构函数是连续被调用的。\n\n如果你查看上述代码的反汇编代码，情况会变得更有说服力。\n\
  \n```assembly\nint main(int argc, char** argv)\n{\n009D8BA0 push ebp\n009D8BA1 mov\
  \ ebp, esp\n...\n...\nsomeClass someClassObj(1);\n009D8BDD push 1\n009D8BDF lea\
  \ ecx, [someClassObj]\n009D8BE2 call someClass::someClass(09D14E7h) <--(1)\n009D8BE7\
  \ mov dword ptr[ebp - 4], 0\n{\nsomeClass someClassObj(3);\n009D8BEE push 3\n009D8BF0\
  \ lea ecx, [ebp - 20h]\n009D8BF3 call someClass::someClass(09D14E7h) <--(2)\n}\n\
  009D8BF8 lea ecx, [ebp - 20h]\n009D8BFB call someClass::~someClass(09D150Fh)   \
  \ <--(3)\nsomeClass *someClassPtr = new someClass(2);\n009D8C00 push 4\n009D8C02\
  \ call operator new (09D13DEh)      <--(4)\n009D8C07 add esp, 4\n009D8C0A mov dword\
  \ ptr[ebp - 11Ch], eax\n...\n...\n009D8C25 call someClass::someClass(09D14E7h) \
  \    <--(5)\n...\n...\n009D8C4C mov ecx, dword ptr[ebp - 128h]\n009D8C52 mov dword\
  \ ptr[someClassPtr], ecx\ndelete someClassPtr;\n009D8C55 mov eax, dword ptr[someClassPtr]\n\
  ...\n...\n009D8C75 mov ecx, dword ptr[ebp - 110h]\n009D8C7B call someClass::`scalar\
  \ deleting destructor' (09D1500h) <--(6)\n...\n...\nreturn 0;\n009D8C92 mov dword\
  \ ptr[ebp - 0F8h], 0\n009D8C9C mov dword ptr[ebp - 4], 0FFFFFFFFh\n009D8CA3 lea\
  \ ecx, [someClassObj]\n009D8CA6 call someClass::~someClass(09D150Fh) <--(7)\n009D8CAB\
  \ mov eax, dword ptr[ebp - 0F8h]\n}\n```\n\n代码语句在反汇编中清晰地打印出来，你可以轻松看到该特定语句的反汇编。注意我删除了之间大量的汇编语句：\n\
  - `(1)` 是实例化第一个对象的构造函数调用（Line 1）。\n- `(2)` 是括号内显式作用域对象的构造函数调用。\n- 在右大括号之后，我们看到 `(3)`\
  \ 调用了 `someClassObj` 的析构函数。所以你会看到这个调用是在对象离开作用域后立即发生的。\n- `(4)` 调用 `operator new`\
  \ 在堆上分配内存。在某些操作之后，它调用了 `(5)` 中的构造函数。\n- `(6)` 是我们删除堆对象的调用。\n- 最后在 `return` 语句之后，你可以看到编译器在\
  \ `(7)` 中调用了 `someClassObj` 的析构函数。\n\n查看反汇编可以清楚地看到幕后到底发生了什么。`(3)` 处的析构函数调用和 `(7)`\
  \ 处的调用显示了编译器是如何处理的。通过反汇编来看，这其实非常清晰。\n\n\n\n\n\n```cpp\nreturn 0;\n\n}\n```\n\n![](img/image00852.jpeg)\n\
  \n你得到了相同的错误。编译器仍然需要调用成员对象的析构函数，而在使用私有析构函数时它是无法做到的。在这种情况下，将析构函数设置为受保护（protected）也没有任何帮助。\n\
  \n所以你可以看到，通过将析构函数设为私有（private），你可以完全限制类的栈上分配。但请记住，这将导致你无法对堆上分配的对象调用 `delete`。你需要一些其他工具函数来处理这个问题。\n\
  \n## 限制堆分配\n\n现在让我们来看看我们是如何限制堆分配的。你还记得我们前段时间看过的汇编代码吗？在汇编代码中，堆分配包含对 `operator new`\
  \ 的调用。在 C++ 中，在堆上分配对象的方法是使用 `operator new`。那么，我们如何控制堆分配呢？我们做一些与对栈分配进行类似的操作。我们将 `operator\
  \ new` 设为私有。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass notOnHeapClass\n\
  {\n\nint objID;\n\npublic:\nnotOnHeapClass(int ID)\n{\nobjID = ID;\ncout << \"Constructor\
  \ for ID: \" << objID << endl;\n}\n\n~notOnHeapClass()\n{\ncout << \"Destructor\
  \ for ID: \" << objID << endl;\n}\n\nprivate:\nvoid *operator new(size_t);\n};\n\
  \nint main(int argc, char** argv)\n{\nnotOnHeapClass notOnHeapObj(1);          \
  \                      // 第 1 行\nnotOnHeapClass *notOnHeapPtr = new notOnHeapClass(2);\
  \        // 第 2 行\ndelete notOnHeapPtr;\nreturn 0;\n}\n```\n\n![](img/image00853.jpeg)\n\
  \n正如预期，编译器抛出了错误，说它无法访问 `operator new`。就这样。这就是你限制堆分配的方法。当我们在另一个主题中讨论 `placement new`\
  \ 时，我们将详细介绍 `operator new`。\n\n理想情况下，当我们通过将 `operator new` 设为私有来限制堆分配时，我们通常会将以下四个运算符也设为私有。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass notOnHeapClass\n{\n\
  \nint objID;\n\npublic:\nnotOnHeapClass()\n{\nobjID = 0;\n}\n\nnotOnHeapClass(int\
  \ ID)\n{\nobjID = ID;\ncout << \"Constructor for ID: \" << objID << endl;\n}\n\n\
  ~notOnHeapClass()\n{\ncout << \"Destructor for ID: \" << objID << endl;\n}\n\nprivate:\n\
  void *operator new(size_t);\nvoid *operator new[](size_t);\nvoid operator delete(void*);\n\
  void operator delete[](void*);\n};\n\nint main(int argc, char** argv)\n{\nnotOnHeapClass\
  \ notOnHeapObj(1);\nnotOnHeapClass *notOnHeapPtr = new notOnHeapClass(2);     //\
  \ 第 1 行\nnotOnHeapClass *notOnHeapArr = new notOnHeapClass[5];     // 第 2 行\ndelete\
  \ notOnHeapPtr;                                     // 第 3 行\ndelete[] notOnHeapArr;\
  \                                   // 第 4 行\nreturn 0;\n}\n```\n\n![](img/image00854.jpeg)\n\
  \n如果不将 `new[]`、`delete` 和 `delete[]` 设为私有，第 2、3 和 4 行分别可以在没有任何错误的情况下编译。虽然在无法使用 `new`\
  \ 的情况下你无法 `delete`，但如果这是你的意图，将它们都设为私有总是更好的。请注意 `operator new` 不同于 `operator new[]`。因此，如果你需要限制对象数组的堆分配，请确保也将数组\
  \ `operator new` 设为私有。\n\n在我们结束这个主题之前，请记住将 `operator new` 设为私有并不能帮助你在像这样的情况下限制堆分配：\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\n#include <vector>\n\nclass\
  \ notOnHeapClass\n{\n\nint objID;\n\npublic:\nnotOnHeapClass()\n{\nobjID = 0;\n\
  }\n\nnotOnHeapClass(int ID)\n{\nobjID = ID;\ncout << \"Constructor for ID: \" <<\
  \ objID << endl;\n}\n\n~notOnHeapClass()\n{\ncout << \"Destructor for ID: \" <<\
  \ objID << endl;\n}\n\nprivate:\nvoid *operator new(size_t){}\nvoid *operator new[](size_t){}\n\
  void operator delete(void*){}\nvoid operator delete[](void*){}\n};\n\nint main(int\
  \ argc, char** argv)\n{\nstd::vector<notOnHeapClass> notOnHeapVec;\nnotOnHeapVec.push_back(notOnHeapClass(1));\n\
  return 0;\n}\n```\n\n这个程序运行良好。你可能认为这应该是行的，因为我们没有在堆上分配任何东西，因为 `notOnHeapVec` 在栈上。实际上，并非如此。像\
  \ `Vector` 这样的 STL 会分配 vector 本（即栈上的 vector 头部数据），但真正的 vector 元素（即 `notOnHeapClass`\
  \ 对象）实际上是在堆上分配的。因此当我们把 `notOnHeapClass` 对象 push 到 vector 时，该对象实际上是在堆上实例化的。但是，为什么在\
  \ `operator new` 是私有的情况下没有错误呢？因为编译器没有调用 `operator new`。看这段代码的汇编：\n\n```assembly\n\
  int main(int argc, char** argv)\n{\nstd::vector<notOnHeapClass> notOnHeapVec;\n\
  notOnHeapVec.push_back(notOnHeapClass(1));\nreturn 0;\n}\n```\n*(注：此处提供的原文汇编部分在输入中不完整，翻译已根据上下文保持逻辑)*\n\
  \n实际上，由于原文提供的汇编代码在输入中被截断，此处仅翻译了逻辑结构。\n\n\n\n\n\n```\n0010591F call operator new\
  \ (0101514h)                            <--(1)\n\n...\n\n...\n\n0010593D push 7DFh\
  \                                <--(2)\n\n00105942 mov ecx,dword ptr [ebp-0ECh]\n\
  \n00105948 call simpleClass::simpleClass (010162Ch)       <--(3)\n\n...\n\n...\n\
  \ndelete simpleClassPtr;\n\n...\n\n...\n\n0010598B call operator delete (01011B3h)\
  \               <--(4)\n00105990 add esp,4\nreturn 0;\n\n}\n```\n\n这里有几个有趣的点，我相信它们为理解编译器层面发生的情况提供了很好的见解。\n\
  \n- 当调用 `new` 时，注意编译器实际上在 (1) 处调用了 `operator new`。正如我们稍后调查的，`operator new` 是负责分配内存的。因此，`new`\
  \ 的第一个任务是使用 `operator new` 分配内存。\n- 注意我是如何传递 2015 作为对象初始化器的吗？2015 没有什么特殊。我只是想传递一个比数字\
  \ '1' 更独特的数字，并展示这个数字在反汇编代码中是如何使用的。在 (2) 中，你看到 2015 被推入一个寄存器，用于对象构造。\n- 在 (3) 中，我们看到对象的构造函数被调用。这是\
  \ `new` 的第二个任务。首先它通过调用 `operator new` 分配了内存，现在它调用了构造函数。\n- (4) 对对象调用了 `operator\
  \ delete`。\n\n所以我们看到 `new` 执行了两个主要操作：\n\n- 调用 `operator new` 分配内存\n- 调用类的构造函数\n\n\
  让我们再仔细观察一下 `operator new`。\n\n## Operator new 和 placement new\n\n`operator new`\
  \ 有两种主要的变体：\n\n```cpp\nvoid* operator new (std::size_t size);\nvoid* operator new\
  \ (std::size_t size, void* ptr);\n```\n\n这两个操作运算符版本执行的操作略有不同。\n\n### 第一种语法：\n\n\
  ```cpp\nvoid* operator new (std::size_t size);\n```\n\n接收字节为单位的大小作为参数，分配相应数量的存储空间并返回指向该分配内存第一个字节的\
  \ `void*` 指针。这通常被称为 `operator new`。\n\n### 第二种语法：\n\n```cpp\nvoid* operator new\
  \ (std::size_t size, void* ptr);\n```\n\n它执行的是不同的操作。它简单地返回传递的 `ptr` 参数。这看起来可能意义不大，但当你看到它的用途时，就会变得很清晰。这种语法被称为\
  \ `placement new`（定位 new）。它用于当我们在 `ptr` 指定的位置构造所需的对象时。\n\n让我们来看一个例子。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass simpleClass\n{\n    int objID;\n\
  public:\n    simpleClass(int ID)             // 构造函数\n    {\n        objID = ID;\n\
  \        cout << \"Constructing object with ID: \" << objID << endl;\n    }\n  \
  \  ~simpleClass()\n    {\n        cout << \"Destructing object with ID: \" << objID\
  \ << endl;\n    }\n};\n\nint main(int argc, char** argv)\n{\n    void *ptrToMem\
  \ = operator new(sizeof(simpleClass));               // Line 1\n    simpleClass\
  \ *simpleClassPtr = new (ptrToMem)simpleClass(26);       // Line 2\n    simpleClassPtr->~simpleClass();\
  \                                // Line 3\n    operator delete(ptrToMem);     \
  \                                // Line 4\n    //delete simpleClassPtr;       \
  \                                  // Line 5\n    return 0;\n}\nConstructing object\
  \ with ID: 26\nDestructing object with ID: 26\n```\n\n- 第 1 行调用 `operator new`（语法\
  \ 1），即分配函数，并传入大小。它简单地分配一块内存并返回指向该位置的指针。\n- 第 2 行调用 `placement new`（语法 2），并传递传递已分配内存的指针，同时也传递了构造函数的参数。这一行将\
  \ `simpleClass` 对象放置在 `ptrToMem` 并对其调用构造函数。\n- 第 2 行实际发生的情况是 `new` 将调用 `placement\
  \ new`（因为语法如此）。然后 `placement new` 将简单地返回 `ptr`；这是我们想要构造对象的分配内存。之后，`new` 调用类的构造函数，这与我们使用\
  \ `new` 的步骤相同。\n- 第 3 行显式调用了析构函数。我们将在析构函数的话题中详细讨论，但析构函数可以这样调用。如果我们这样调用析构函数，那么我们也需要像第\
  \ 4 行那样显式地调用 `operator delete`。调用 `operator delete` 将释放内存。\n- 你不需要调用析构函数和 `operator\
  \ delete`。你可以像第 5 行那样使用 `delete`，它会为你调用析构函数和 `operator delete`。它是 `new` 的反向操作。但注意我注释掉了第\
  \ 5 行。因为如果你打算使用 `operator delete`（第 4 行）释放内存，就不能再次执行 `delete`。在 C++ 中释放已经分配的内存是未定义操作。\n\
  \n## Placement new\n\n这也许是一个进一步解释 `placement new` 的地方，因为它的功能有点特殊。它简单地返回传入的 `void*`\
  \ 指针。编译器根据语法来决定是调用 `operator new` 还是 `placement new`，这取决于传入的参数。如果我们没有任何参数调用 `new`，编译器将：\n\
  \n- 调用 `operator new` 并接收指向分配内存的指针。\n- 调用构造函数在分配内存上构造对象。\n\n如果我们带参数调用 `new`，编译器将：\n\
  \n- 调用 `placement new` 并接收指向分配内存的指针。\n- 调用构造函数在分配内存上构造对象。\n\n\n\n\n好的，我们已经查看了 `operator\
  \ new` 和 `placement new` 的工作原理。这些是全局作用范围的操作符。它们有定义的行为。`operator new` 分配内存，而 `placement\
  \ new` 则在已分配的内存上构造对象。如果我们想改变这种行为呢？我们完全可以做到，我们只需要在类中定义自己的 `operator new` 即可。一个特定于类的自定义运算符。让我们来看一个例子。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass simpleClass\n{\n \
  \   int objID;\npublic:\n    simpleClass(int ID) // 构造函数\n    {\n        objID =\
  \ ID;\n        cout << \"Constructing object with ID: \" << objID << endl;\n   \
  \ }\n\n    void* operator new(std::size_t size)\n    {\n        void * ptr = malloc(size);\n\
  \        cout << \"Custom operator new. Allocating \" << size << \" bytes at \"\
  \ << ptr << endl;\n        return ptr;\n    }\n\n    void operator delete(void*\
  \ ptr)\n    {\n        cout << \"Custom operator delete\" << endl;\n        std::free(ptr);\n\
  \    }\n\n    void* operator new (std::size_t count, void* ptr)\n    {\n       \
  \ cout << \"Custom placement new.\" << endl;\n    }\n};\n\nint main(int argc, char**\
  \ argv)\n{\n    simpleClass *simpleClassPtr = new simpleClass(10);\n    cout <<\
  \ \"simpleClassPtr at \" << simpleClassPtr << endl;\n    delete simpleClassPtr;\n\
  \    return 0;\n}\n```\n\n```text\nCustom operator new. Allocating 4 bytes at 003A95B8\n\
  Constructing object with ID: 10\nsimpleClassPtr at 003A95B8\nCustom operator delete\n\
  ```\n\n### 我们在这里做了什么？\n\n*   我们通过重载定义了一个特定于类的自定义 `operator new`。在这里，我们简单地使用 `malloc`\
  \ 分配了所需的字节数，并返回了 `malloc` 返回的指针。我们已经看到可以使用 `malloc` 作为 `operator new` 的替代品。\n* \
  \  我们还重载了 `operator delete`。由于我们使用 `malloc` 分配内存，因此必须注意使用 `free` 来释放它。\n*   在结果输出中，我们看到\
  \ `new` 调用了我们自定义的 `operator new`，它分配了 4 个字节并返回内存指针。\n*   然后我们看到构造函数被调用。\n*   作为确认，我们看到从我们的自定义\
  \ `operator new` 分配的内存地址与构造对象的位置相同。\n*   最后我们调用了 `delete`，它调用了重载后的版本。\n*   还要注意我们是如何定义类特定的\
  \ `placement new` 的。它除了打印输出之外什么都没做，甚至没有返回 `void*`。但请看，它并没有被 `new` 调用。所以 `new` 没有使用\
  \ `placement new` 来构造对象。\n\n所以你看到我们可以通过拥有类特定的 `operator new` 来轻松地自定义内存分配例程了。如果你只是想在自定义的\
  \ `operator new` 中记录日志或进行其他类型的清理工作，而不扰动全局的 `operator new` 呢？只需按照如下方式修改你的自定义函数：\n\
  \n```cpp\nvoid* operator new(std::size_t size)\n{\n    void * ptr = ::operator new(size);\
  \ // 调用全局 operator new\n    cout << \"Custom operator new. Allocating \" << size\
  \ << \" bytes at \" << ptr << endl;\n    return ptr;\n}\n```\n\n注意我们调用了 `::operator\
  \ new`，带有全局作用域限定符。这是非常重要的。否则，我们的 `operator new` 将递归地调用自己。同样，在这种情况下，`operator delete`\
  \ 的重载应该调用 `::operator delete`。\n\n还有一点；我们如何在没有实例化的情况下调用类特定的 `operator new` 呢？我们像调用静态函数一样调用它，但我们并没有将其定义为\
  \ `static`。这是因为这些 `allocation functions` 实际上确实是静态的。它们实际上是特殊的运算符，并以特殊的方式进行处理（我们将在运算符重载主题中学习更多）。\n\
  \n所以让我们回顾一下到目前为止我们所做的：\n\n*   我们发现了 `new` 运算符的作用。它会调用 `operator new`，然后调用构造函数来创建对象。\n\
  *   我们看到 `operator new` 仅仅是分配内存并返回一个 `void*`。并且我们可以使用 `malloc` 做到同样的操作。\n*   我们使用\
  \ `placement new` 在已分配的内存上构造新对象。\n*   我们定义了自定义类特定的 `operator new`，并看到调用 `new` 如何调用我们自定义的\
  \ `operator new` 来分配内存，然后像通常一样调用构造函数。\n\n我们已经涵盖了 `new` 的很多内容。让我们通过查看如何进一步自定义 `new`\
  \ 的行为来结束这个主题。\n\n假设你想在构造新对象之前执行一些清理任务。你不希望将这些任务放在类构造函数中。你可以简单地通过带有额外参数来重载 `placement\
  \ new`。例如：\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass simpleClass\n\
  {\n    int objID;\npublic:\n    simpleClass(int ID) // 构造函数\n    {\n        objID\
  \ = ID;\n        cout << \"Constructing object with ID: \" << objID << endl;\n \
  \   }\n\n    void* operator new(std::size_t size)\n    {\n        void * ptr = ::operator\
  \ new(size); // 调用全局 operator new\n        cout << \"Custom operator new.\" << endl;\n\
  \        return ptr;\n    }\n\n    void* operator new(std::size_t size, bool memoryFull)\n\
  \    {\n        cout << \"Custom placement new. count: \" << size << endl;\n   \
  \     if (memoryFull) \n        {\n            cout << \"Memory full!\" << endl;\n\
  \        }\n    }\n\n    void operator delete(void* ptr)\n    {\n        cout <<\
  \ \"Custom operator delete.\" << endl;\n    }\n};\n\n// 注意：原文示例代码中 placement new\
  \ 的定义括号匹配似乎有误，在翻译/转换时保持逻辑对应\nint main(int argc, char** argv)\n{\n    simpleClass\
  \ *simpleClassPtr = new simpleClass(10);\n    simpleClass *simpleClass2 = new (true,\
  \ false) simpleClass(20);\n    delete simpleClassPtr;\n    delete simpleClass2;\n\
  \    return 0;\n}\n```\n\n```text\nCustom operator new.\nConstructing object with\
  \ ID: 10\nCustom placement new. count: 20\nMemory full!\nConstructing object with\
  \ ID: 20\nCustom operator delete\nCustom operator delete.\n```\n\n*   第一行在没有参数的情况下调用\
  \ `new`。这调用了类中的 `operator new`。\n*   第二行向 `new` 传递了 `bool` 和 `int`。这与我们定义的自定义 `placement\
  \ new` 匹配。\n*   在调用自定义 `placement new` 并获取内存后，`new` 然后调用构造函数。\n*   注意 `placement\
  \ new` 从未被调用。这显示 `placement new` 只有当我们向分配的内存传递 `void*` 时才会调用。\n*   最后我们看到调用了 `operator\
  \ delete`。\n\n最后一点要注意 `placement new` 并不总是需要传递指针。`placement new` 是 `operator new`\
  \ 的重载版本。\n\n我希望这个主题让你对 `new` 运算符有了深入了解，以及如何重载 `operator new` 分配函数来获得所需的灵活性。\n\n\
  ### 主题 8：理解构造函数\n\n构造函数。我们都知道它们是什么，让我们直接开始吧。\n\n```cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nclass baseClass\n{\npublic:\n    int objID;\n    baseClass()\n\
  \    {\n        cout << \"(1) Default constructor \" << objID << endl;\n    }\n\
  \    baseClass(int ID)\n    {\n        objID = ID;\n        cout << \"(2) Constructing\
  \ base object with ID: \" << objID << endl;\n    }\n};\n\nclass derivedClass : public\
  \ baseClass\n{\npublic:\n    derivedClass()\n    {\n        cout << \"(3) Constructing\
  \ derived object with default ID: \" << objID << endl;\n    }\n    derivedClass(int\
  \ ID) : baseClass(ID)\n    {\n        cout << \"(4) Constructing derived object\
  \ with ID: \" << objID << endl;\n    }\n    derivedClass(float ID)\n    {\n    \
  \    cout << \"(5)Cstructing derived object with ID: \" << objID << endl;\n    }\n\
  };\n\nint main(int argc, char** argv)\n{\n    derivedClass dcObj1(); // Line 1\n\
  \    cout << \"-- Line 1 --\" << endl;\n    derivedClass dcObj2; // Line 2\n   \
  \ cout << \"-- Line 2 --\" << endl;\n    return 0;\n}\n```\n\n*(注：原文示例代码中存在一些 C++\
  \ 语法错误，如括号不匹配和重复定义，在翻译时已根据原文逻辑保留其结构)*\n\n\n\n\n\n```cpp\nderivedClass dcObj3(1);\
  \                              // Line 3\ncout << \"-- Line 3 --\" << endl;\n\n\
  derivedClass dcObj4(2.0f);                         // Line 4\nreturn 0;\n\n}\n```\n\
  \n-- Line 1 --\n\n(1) 构造函数-858993460\n\n(3) 正在使用默认 ID -858993460 构建派生对象\n\n-- Line\
  \ 2 --\n\n(2) 正在使用 ID 1 构建基对象\n\n(4) 正在使用 ID 1 构建派生对象\n\n-- Line 3 --\n\n(1) 构造函数-858993460\n\
  \n(5) 正在使用 ID -858993460 构建派生对象\n\n让我们快速过一下步骤：\n\n- 输出输出是 `-- Line 1 --`。这意味着代码的第\
  \ 1 行没有调用构造函数。为什么呢？因为它没有调用，因为第 1 行并没有定义一个 `derivedClass` 类型的对象。对于编译器来说，第 1 行是一个函数原型。一个名为\
  \ `dcObj1` 且返回 `derivedClass` 对象的函数。所以它除了声明函数原型外什么都没做。因此，请确保省略括号！\n\n- 第 2 行通过调用默认构造函数实例化了一个对象。看，没有括号。这就是调用默认构造函数的方法。记住，默认构造函数是不带参数的那一个。这里还有一点需要注意：变量\
  \ `objID` 没有初始化。我们稍后会详细讨论这一点，但请记住，编译器不会自动初始化你的类变量。\n\n- `dcObj2` 还展示了先调用 `baseClass`\
  \ 构造函数，然后调用派生类构造函数。这是关于构造函数和继承最基础的知识。基类的构造函数总在派生类的构造函数之前调用。\n\n- 同样，`derivedClass`\
  \ 的默认构造函数没有显式调用基类构造函数。编译器会为你完成这一点。它会在函数体之前隐式地添加对基类默认构造函数的调用。\n\n- 第 3 行使用 `int`\
  \ 参数实例化了一个对象。这个构造函数显式地调用了带参数的 `baseClass` 构造函数。你可以看到 `objID` 现在被 `baseClass` 构造函数正确地初始化了。\n\
  \n- 最后在第 4 行我们使用 `float` 参数调用。这里需要注意的是，`baseClass` 的默认构造函数被显式调用了。\n\n- 这里的结论是：基类构造函数总在派生类构造函数之前调用，如果派生类没有在初始化列表中显式调用基类构造函数，编译器将始终隐式地调用默认构造函数。我们将看到为什么在初始化列表中调用基类构造函数是关重要的。\n\
  \n### 调用基类构造函数\n\n让我们来看另一个例子。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass baseClass\n{\npublic:\n    int objID;\n    baseClass()\n    {\n        cout\
  \ << \"(1) Default constructor\" << objID << endl;\n    }\n    baseClass(int ID)\n\
  \    {\n        objID = ID;\n        cout << \"(2) Constructing base object with\
  \ ID: \" << objID << endl;\n    }\n};\n\nclass derivedClass : public baseClass\n\
  {\npublic:\n    derivedClass(int ID)\n    {\n        baseClass(ID);\n        cout\
  \ << \"(4) Constructing derived object with ID: \" << objID << endl;\n    }\n};\n\
  \nint main(int argc, char** argv)\n{\n    derivedClass dcObj(1);\n    return 0;\n\
  }\n```\n\n![](img/image00855.jpeg)\n\n注意我如何修改了 `derivedClass` 构造函数中对 `baseClass`\
  \ 构造函数的调用？之前我们把它放在初始化列表中。在这里我从那里移除并放到了函数体中。那么，为什么会出现这个错误呢？\n\n因为我们在函数内部调用 `baseClass(ID)`\
  \ 时，发生的情况是：编译器将其解释为名为 `ID` 的 `baseClass` 类型的声明。由于参数列表中有一个名为 `ID` 的参数，编译器正在抱怨我们正在重新定义参数\
  \ `ID`。这种发生是因为你不被允许直接调用构造函数，也就是说，除非你在初始化列表中这样做。\n\n现在纯粹好玩一下，你认为如果上面的例子中派生类是这样写的，会发生什么？\n\
  \n```cpp\nclass derivedClass : public baseClass\n{\npublic:\n    derivedClass(int\
  \ ID)\n    {\n        baseClass(1); // 使用 int 调用\n        cout << \"(4) Constructing\
  \ derived object with ID: \" << objID << endl;\n    }\n};\n```\n\n(1) 构造函数-858993460\n\
  \n(2) 正在使用 ID 1 构建基对象\n\n(4) 正在使用 ID -858993460 构建派生对象\n\n所以，我们没有传递参数 `ID`，而是显式地传递了一个\
  \ `int`。你会发现它是可以的。这将调用 `baseClass` 构造函数。但为什么呢？当我们传递 `ID` 时得到了错误，但当我们传递 `int` 时却没有？毕竟，`ID`\
  \ 是一个整数。\n\n发生了和之前一样的事情。首先，编译器会尝试将该调用解释为声明。在编译器中，`baseClass(ID)` 被解释为名为 `ID` 的 `baseClass`\
  \ 类型的声明。这种发生是因为你不被允许直接调用构造函数，也就是说，除非你在初始化列表中这样做。\n\n\n\n\n\n```cpp\nint main(int\
  \ argc, char** argv)\n{\n    baseClass bcObj(1);\n    return 0;\n}\n```\n\n(1) 默认构造函数-858993460\n\
  (3) 默认析构函数-858993460\n(2) 正在构造 ID 为 1 的基对象\n(3) 默认析构函数 1\n\n你看到发生了什么吗？\n\n首先调用了默认构造函数，紧接着调用了析构函数。什么？\n\
  \n这里的调用 `baseClass()`构造了一个无名的 `baseClass` 对象，然后编译器立即将其销毁。接着，编译器继续执行构造函数中的剩余语句。因此，我们并没有调用\
  \ `this` 对象的默认构造函数。我们是在另一个对象（一个无名的临时对象）上调用它，该对象在下一行就被销毁了，没有任何作用。那么，这与我们在派生类构造函数调用基类构造函数的情况下有什么区别吗？没有。是一样的。你根本无法在方法体中调用构造函数。为什么我们在上一个用例中遇到了错误而在这次中没有呢？因为我们调用的是没有参数的默认构造函数。下面的示例会让这一点变得清晰。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    int objID;\n    baseClass()\n    {\n        cout << \"(1) Default constructor\"\
  \ << objID << endl;\n    }\n    baseClass(int ID) // 构造函数\n    {\n        objID\
  \ = ID;\n        cout << \"(2) Constructing base object with ID: \" << objID <<\
  \ endl;\n    }\n    baseClass(int ID1, int ID2) // 构造函数\n    {\n        baseClass(ID1);\n\
  \        cout << \"(3) Constructing base object with ID: \" << objID << endl;\n\
  \    }\n};\n\nint main(int argc, char** argv)\n{\n    baseClass bcObj(12);\n   \
  \ return 0;\n}\n```\n\n![](img/image00856.jpeg)\n\n我确定你不需要进一步的解释了。\n\n所以底线是，你永远无法直接调用构造函数。唯一的方法是在初始化列表中。像这样。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    int objID;\n    baseClass()\n    {\n        cout << \"(1) Default constructor\"\
  \ << objID << endl;\n    }\n    baseClass(int ID) : baseClass()\n    {\n       \
  \ objID = ID;\n        cout << \"(2) Constructing base object with ID: \" << objID\
  \ << endl;\n    }\n    baseClass(int ID1, int ID2) : baseClass(ID1)\n    {\n   \
  \     cout << \"(3) Constructing base object with ID: \" << objID << endl;\n   \
  \ }\n};\n\nint main(int argc, char** argv)\n{\n    baseClass bcObj(1, 2);\n    return\
  \ 0;\n}\n```\n\n(1) 默认构造函数-858993460\n(2) 正在构造 ID 为 1 的基对象\n(3) 正在构造 ID 为 1 的基对象\n\
  \n### 构造函数委托\n\n调用其他构造函数（当然是在初始化列表中）的构造函数类型出于显而易见的原因被称为`委托构造函数`（delegating constructors）。但委托构造函数有一个局限性。你不能在初始化列表中进行任何初始化。这意味着你不能执行这样的代码：\n\
  \n```cpp\nbaseClass(int ID) : baseClass(), objID(ID)\n{\n    cout << \"(2) Constructing\
  \ base object with ID: \" << objID << endl;\n}\n```\n\n编译器会忠实地告知你这一事实 ![](img/image00857.jpeg)。委托构造函数在消除相似构造函数中的重复代码方面非常高效，但当然有一个很小的限制。\n\
  \n### 成员初始化\n\n在上面的示例中，我们看到成员变量 `objID` 必须在构造函数显式初始化，编译器不会为我们这样做。那么成员变量究竟是由编译器初始化的呢？让我们从一个非常简单的开始。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    int objID;\n};\n\nint main(int argc, char** argv)\n{\n    baseClass bcObj;\n\
  \    cout << \"bcObj.objID: \" << bcObj.objID << endl;\n    return 0;\n}\n```\n\n\
  `bcObj.objID: 41438` 这里我们没有定义任何构造函数，让编译器为我们生成一个。但实际上，编译器并不会提供。因为我们只有一个成员变量，编译器不需要对它做任何事情。所以在这里我们看到整数被原样留下了。没有进行初始化。务必初始化变量；未初始化的变量具有未定义行为。让我们增加一些背景信息。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    int baseClassID;\n};\n\nclass anotherClass\n{\npublic:\n    int anotherClassObjID;\n\
  \    baseClass baseClassObj;\n};\n\nint main(int argc, char** argv)\n{\n    anotherClass\
  \ acObj;\n    cout << \"anotherClassObjID: \" << acObj.anotherClassObjID << endl;\n\
  \    cout << \"baseClassObjID: \" << acObj.baseClassObj.baseClassObjID << endl;\n\
  \    return 0;\n}\n```\n\n`anotherClassObjID: -8589934` `baseClassObjID: -993460`\
  \ 在这里同样，如所预期，整数成员变量没有被初始化。现在如果 `baseClass` 有一个默认构造函数呢？\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass baseClass\n{\npublic:\n    int baseClassObjID;\n\
  \    baseClass()\n    {\n        baseClassObjID = 1;\n        cout << \"baseClass\
  \ constructor\" << endl;\n    }\n};\n\nclass anotherClass\n{\npublic:\n    int anotherClassObjID;\n\
  \    baseClass baseClassObj;\n};\n\nint main(int argc, char** argv)\n{\n    anotherClass\
  \ acObj;\n    cout << \"anotherClassObjID: \" << acObj.anotherClassObjID << endl;\n\
  \    cout << \"baseClassObjID: \" << acObj.baseClassObj.baseClassObjID << endl;\n\
  \    return 0;\n}\n```\n\n`baseClass constructor` `anotherClassObjID: -8589934`\
  \ `baseClassObjID: 1` 在这里我们看到 `baseClass` 的默认构造函数被隐式调用了。为什么？记得我之前说过当我们只有整数成员变量时编译器甚至不会生成默认构造函数吗？但这种情况下编译器为\
  \ `anotherClass` 生成了默认构造函数。因为它有一个定义了默认构造函数的成员变量。所以编译器有义务调用它。这就是类型成员变量与像整数（POD）变量之间的区别。对于\
  \ POD，编译器不会进行任何初始化。但对于类型，如果存在默认构造函数，编译器必须调用它。\n\n这里我们为 `baseClass` 定义了默认构造函数。如果它有一个带参数的构造函数呢？\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  \    int baseClassObjID;\n    baseClass(int ID)\n    {\n        baseClassObjID =\
  \ ID;\n        cout << \"baseClass constructor\" << endl;\n    }\n};\n\nclass anotherClass\n\
  {\npublic:\n    int anotherClassObjID;\n    baseClass baseClassObj;\n};\n\nint main(int\
  \ argc, char** argv)\n{\n    anotherClass acObj;\n    cout << \"anotherClassObjID:\
  \ \" << acObj.anotherClassObjID << endl;\n    cout << \"baseClassObjID: \" << acObj.baseClassObj.baseClassObjID\
  \ << endl;\n    return 0;\n}\n```\n\n![](img/image00858.jpeg) 编译器抱怨 `anotherClass`\
  \ 缺少默认构造函数。发生的情况是，编译器看到 `baseClass` 定义了一个构造函数。它不是默认构造函数，所以必须显式调用。编译器永远不会调用非默认构造函数（嗯，它根本不知道调用时需要的参数）。但编译器看到\
  \ `anotherClass` 中没有调用 `baseClass` 构造函数的构造函数，并发布了错误。因此，如果你的成员变量有非默认构造函数，封装类必须有一个初始化成员类对象的构造函数。\n\
  \n如果你为 `anotherClass` 定义了构造函数，但它没有调用 `baseClass` 构造函数呢？像这样：\n\n```cpp\nclass anotherClass\n\
  {\npublic:\n    int anotherClassObjID;\n    baseClass baseClassObj;\n    anotherClass()\n\
  \    {\n        anotherClassObjID = 2;\n    }\n};\n```\n\n![](img/image00859.jpeg)\n\
  \n\n\n\n这是同样的问题。因为我们在拥有一个带有没有默认构造函数的基类的派生类时，也遇到过同样的错误。在派生类构造函数的案例中，我们看到总是需要在初始化列表中调用基类的构造函数。如果我们没有初始化基类，编译器会尝试在进入构造函数体之前执行初始化。但编译器只能调用默认构造函数。如果没有默认构造函数，它就会报错。\n\
  \n如果有一个类类型的成员变量且它带有构造函数，编译器需要确保它被调用。如果构造程序中没有显式调用它，它会尝试调用默认构造函数。如果没有默认构造函数，编译将无法通过。\n\
  \n这里还有一点需要注意。我们之前看到过，如果需要，编译器会生成一个默认构造函数（例如，当存在一个带有构造函数的类成员变量时）。但你需要记住，如果用户定义了构造函数，编译器永远不会生成默认构造函数。这就是为什么编译器抱怨\
  \ `baseClass` 没有默认构造函数的原因。因为存在一个非默认构造函数。所以编译器不会为我们生成一个。\n\n现在，你该如何处理这种情况呢？你有一个 `baseClass`，它有一个接收整数参数的构造函数。这是你打算初始化\
  \ `baseClass` 的方式。你如何避免其他想要将 `baseClass` 作为成员的类产生错误？比如 `anotherClass`。当然，按照意图初始化\
  \ `baseClass` 变成了 `anotherClass` 的责任。但如果你的实现允许，你只需简单为你的构造函数参数提供默认值，问题就会消失。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\n\npublic:\nint\
  \ baseClassObjID;\nbaseClass(int ID = 1)\n{\nbaseClassObjID = ID;\ncout << \"baseClass\
  \ constructor\" << endl;\n}\n\n};\n\nclass anotherClass\n{\npublic:\nint anotherClassObjID;\n\
  baseClass baseClassObj;\nanotherClass()\n{\nanotherClassObjID = 2;\n}\n};\n\nint\
  \ main(int argc, char** argv)\n{\nanotherClass acObj;\ncout << \"anotherClassObjID:\
  \ \" << acObj.anotherClassObjID << endl;\ncout << \"baseClassObjID: \" << acObj.baseClassObj.baseClassObjID\
  \ << endl;\nreturn 0;\n}\n```\n\n```text\nbaseClass constructor\nanotherClassObjID:\
  \ 2\nbaseClassObjID: 1\n```\n\n看，没问题。当我们提供了一个默认值时，编译器可以像调用默认构造函数一样调用它。\n\n让我们快速看两件事。\n\
  \n*   你可以在派生类中将基类实例作为成员变量吗？\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nclass derivedClass;\n\nclass baseClass\n{\npublic:\nint objID;\nbaseClass()\n\
  {\ncout << \"(1) Default constructor\" << objID << endl;\n}\n\nbaseClass(int ID)\n\
  {\nobjID = ID;\ncout << \"(2) Constructing base object with ID: \" << objID << endl;\n\
  }\n};\n\nclass derivedClass : public baseClass\n{\npublic:\nbaseClass baseClassObj;\n\
  derivedClass() : baseClass(), baseClassObj()\n{}\nderivedClass(int ID) : baseClass(ID),\
  \ baseClassObj(ID)\n{\ncout << \"(3) Constructing derived object with ID: \" <<\
  \ objID << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\nderivedClass dcObj(9);\n\
  return 0;\n}\n```\n\n```text\n(2) Constructing base object with ID: 9\n(2) Constructing\
  \ base object with ID: 9\n(3) Constructing derived object with ID: 9\n```\n\n所以是的，可以的。没问题。\n\
  \n*   那么基类中是否有派生类实例呢？\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  class derivedClass;\n\nclass baseClass\n{\npublic:\nint objID;\nderivedClass *derivedClassObj;\n\
  baseClass();\nbaseClass(int ID)\n{\nobjID = ID;\ncout << \"(2) Constructing base\
  \ object with ID: \" << objID << endl;\n}\n};\n\nclass derivedClass : public baseClass\n\
  {\npublic:\nderivedClass()\n{}\nderivedClass(int ID) : baseClass(ID)\n{\ncout <<\
  \ \"(3) Constructing derived object with ID: \" << objID << endl;\n}\n};\n\nbaseClass::baseClass()\n\
  {\ncout << \"(1) Default constructor\" << objID << endl;\nderivedClassObj = new\
  \ derivedClass();\n}\n\nint main(int argc, char** argv)\n{\nderivedClass dcObj;\n\
  return 0;\n}\n```\n\n注意，派生类是一个指针，而不是我们在上一个示例中基类那样的实例。这是因为我们不能在 `baseClass` 中定义一个实例，因为此时\
  \ `derivedClass` 还没有被定义。我们可以使用指针，并在顶部进行前置声明，将构造函数的定义移动到 `derivedClass` 定义之后。我们将在另一个主题中详细讨论这一点。\n\
  \n这可以编译并运行。但发生了什么呢？它会陷入死循环。`derivedClass` 继承自 `baseClass`，所以它内部有一个 `baseClass` 实例。而这个\
  \ `baseClass` 实例内部又有一个 `derivedClass` 实例，以此此类推。所以你不能在基类中拥有派生类实例。\n\n到目前为止学到了：\n\n\
  *   如果没有定义带参数的默认构造函数，编译器会生成一个。\n*   如果定义了构造函数，否则将不会生成任何。\n*   基类构造函数和成员类构造函数必须在初始化列表中调用。\n\
  *   如果没有默认构造函数，它们需要被初始化。\n*   必须显式初始化，否则会导致编译错误。\n*   初始化列表是你可以调用构造函数的地方。\n\n成员初始化开销\n\
  \n是否存在一种我们在构造函数体中而不是初始化列表中初始化类成员的情况？是的的，但你可能不想这样做。考虑这个：\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nclass baseClass\n{\npublic:\nint baseClassObjID;\nbaseClass()\n\
  {\nbaseClassObjID = 99;\ncout << \"(1) baseClass constructor:\" << baseClassObjID\
  \ << endl;\n}\n\nbaseClass(int ID)\n{\ncout << \"(2) baseClass constructor: \" <<\
  \ baseClassObjID << endl;\nbaseClassObjID = ID;\ncout << \"(3) baseClass constructor:\
  \ \" << baseClassObjID << endl;\n}\n\nbaseClass & operator =(const baseClass & baseClassObj)\n\
  {\nbaseClassObjID = baseClassObj.baseClassObjID;\ncout << \"(4) baseClass assignment\
  \ operator: \" << baseClassObjID << endl;\nreturn *this;\n}\n\n~baseClass()\n{\n\
  cout << \"Destructor for object: \" << baseClassObjID << endl;\n}\n};\n\nclass anotherClass\n\
  {\npublic:\nint anotherClassObjID;\nbaseClass baseClassObj;\nanotherClass(int ID)\n\
  {\nbaseClassObj = ID;\nanotherClassObjID = 2;\n}\n};\n\nint main(int argc, char**\
  \ argv)\n{\nanotherClass acObj(5);\nreturn 0;\n}\n```\n\n```text\n(1) baseClass\
  \ constructor:99\n(2) baseClass constructor: -858993460\n(3) baseClass assignment\
  \ operator: 5\n(4) Destructor for object: 5\n(4) Destructor for object: 5\n```\n\
  \n我们在这里做什么？我们向 `anotherClass` 构造函数传递了一个整数参数，然后这个参数被赋值给 `baseClass` 成员。让我们来看输出：\n\
  \n\n\n\n*   输出的 `Line 1` 是在调用 `baseClass` 的默认构造函数时。它是在哪里被调用的？它是在 `anotherClass`\
  \ 的构造函数中调用的。而且这是由编译器隐式调用的。为什么？正如我之前所说，如果一个成员类定义了默认构造函数，那么当且仅当初始化列表中没有对该构造函数的调用时，编译器就有义务调用它。我们没有在\
  \ `anotherClass` 构造函数的初始化列表中进行任何初始化，因此编译器正在调用 `baseClassObj` 的默认构造函数。\n\n*   现在我们进入了\
  \ `anotherClass` 构造函数的体内部并正在执行赋值。我们在构造函数的主题中看到过，在这种情况下，编译器所做的是创建一个带有参数 `ID` 的临时类，然后将这个临时对象传递给\
  \ `baseClassObj` 的赋值运算符。这就是你在输出的第 2 行看到的。它通过调用带有 `int` 参数的构造函数创建了一个临时对象。我打印了两次以显示我们处理的是不同的对象。因此，在输出的第\
  \ 2 行中，`baseClassObjID` 没有被初始化，这证明了不是 `baseClassObj` 成员，而是一个新的临时对象。\n\n*   输出的 `Line\
  \ 3` 是赋值运算符。之前创建的新临时对象被传递给 `baseClassObj` 的赋值运算符。现在 `baseClassObj` 被设置为值 5。这正是我们想要做的。\n\
  \n*   然后有两次析构函数的调用。第一次是针对我们为了传递赋值运算符而创建的临时对象，另一个是当 `acObj` 离开作用域时调用的。\n\n现在对比一下如果我们在初始化列表中这样做会发生什么：\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  int baseClassObjID;\nbaseClass()\n{\nbaseClassObjID = 99;\ncout << \"(1) baseClass\
  \ constructor:\" << baseClassObjID << endl;\n}\nbaseClass(int ID)\n{\ncout << \"\
  (2) baseClass constructor: \" << baseClassObjID << endl;\nbaseClassObjID = ID;\n\
  }\n\nbaseClass & operator =(const baseClass & baseClassObj)\n{\nbaseClassObjID =\
  \ baseClassObj.baseClassObjID;\ncout << \"(3) baseClass assignment operator: \"\
  \ << baseClassObjID << endl;\nreturn *this;\n}\n~baseClass()\n{\ncout << \"(4) Destructor\
  \ for object: \" << baseClassObjID << endl;\n}\n};\n\nclass anotherClass\n{\npublic:\n\
  int anotherClassObjID;\nbaseClass baseClassObj;\nanotherClass(int ID) : baseClassObj(5)\
  \ // <-- 在初始化列表中\n{\nanotherClassObjID = 2;\n}\n};\n\nint main(int argc, char**\
  \ argv)\n{\nanotherClass acObj(5);\nreturn 0;\n}\n```\n`(2) baseClass constructor:\
  \ -858993460`\n`(4) Destructor for object: 5`\n\n看到区别了吗？当我们在初始化列表中这样做时，它直接调用了带有参数的构造函数。我们在这里节省了许多步骤。首先，没有对默认构造函数的调用，也没有临时对象的构造和析构。因此，始终尝试在初始化列表中初始化。这要高效得多。\n\
  \n我们查看了构造函数的许多不同场景，我相信你现在牢固地掌握了构造函数。还有几点需要讨论。\n\n### Const 引用引用成员\n\n我们之前看到过整数等成员变量没有被初始化，而且基类必须在初始化列表中初始化。这给\
  \ `const` 变量和引用增加了限制。你会发现，如果你将 `const` 或引用作为成员，你必须在初始化列表中初始化它们。你不能像处理类类型变量那样省略初始化并期望编译器去完成它，同样不能在构造函数体中初始化它们。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  int intVar;\nconst float floatVar;\nint &intRefVar;\nbaseClass()\n{\ncout << \"\
  (1) Default constructor\" << endl;\n}\n};\n\nint main(int argc, char** argv)\n{\n\
  baseClass bcObj;\ncout << \"objID: \" << bcObj.intVar << endl;\nreturn 0;\n}\n```\n\
  ![](img/image00860.jpeg)\n\n你会得到一个编译器错误，提示你需要初始化 `const` 和引用。而且你无法这样做。\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\nint intVar;\n\
  const float floatVar;\nint &intRefVar;\nbaseClass()\n{\nintVar = 1;\nfloatVar =\
  \ 2.0f;\nintRefVar = intVar;\ncout << “(1) Default constructor” << endl;\n}\n};\n\
  \nint main(int argc, char** argv)\n{\nbaseClass bcObj;\ncout << “objID: “ << bcObj.intVar\
  \ << endl;\nreturn 0;\n}\n```\n`const` 和引用必须在初始化列表中“显式地”初始化。如果你没有定义任何构造函数会呢？\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  int intVar;\nconst float floatVar;\nint &intRefVar;\n};\n\nint main(int argc, char**\
  \ argv)\n{\nbaseClass bcObj;\nreturn 0;\n}\n```\n![](img/image00860.jpeg)\n\n`const`\
  \ 必须在初始化列表中显式初始化。即使你没有定义任何构造函数，你也必须在初始化列表中初始化它们。\n\n`const` 和引用必须在初始化列表中初始化。\n\n\
  ### 成员初始化\n\n我需要讨论关于初始化列表的一点是初始化的顺序。一个简单的示例足够了。\n\n```cpp\n#include<iostream>\n\n\
  using namespace std;\n\nclass baseClass\n{\npublic:\nint baseClassObjID;\nbaseClass(int\
  \ ID)\n{\nbaseClassObjID = ID;\ncout << \"baseClass constructor: \" << baseClassObjID\
  \ << endl;\n}\n};\n\nclass anotherClass\n{\npublic:\nbaseClass baseClassObj1;\n\
  baseClass baseClassObj3;\nbaseClass baseClassObj2;\nanotherClass(int var1, int var2,\
  \ int var3) : baseClassObj1(var1), baseClassObj2(var2), baseClassObj3(var3)\n{}\n\
  };\n\nint main(int argc, char** argv)\n{\nanotherClass acObj(1, 2, 3);\nreturn 0;\n\
  }\n```\n`baseClass constructor: 1`\n`baseClass constructor: 3`\n`baseClass constructor:\
  \ 2`\n\n你注意到输出中的什么了吗？它先构造 `baseClassObj1`，然后是 `baseClassObj3`，最后是 `baseClassObj2`。但在初始化列表中，我们先初始化\
  \ `baseClassObj1`，然后是 `baseClassObj2`，最后是 `baseClassObj3`。这是因为编译器总是按照成员定义的顺序进行初始化，而不是它们在初始化列表中的顺序。\n\
  \n### 值初始化\n\n关于构造函数和初始化的最后一点：“值初始化”。C++11 可以在不显式在构造函数中初始化你的类成员。如下所示：\n\n```cpp\n\
  #include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\nint var1;\n\
  int var2;\nint var3;\n};\n\nint main(int argc, char** argv)\n{\nbaseClass bcObj\
  \ = { 10, 20, 30 };\ncout << \"var1: \" << bcObj.var1 << endl;\ncout << \"var2:\
  \ \" << bcObj.var2 << endl;\ncout << \"var3: \" << bcObj.var3 << endl;\nreturn 0;\n\
  }\n```\n`var1: 10`\n`var2: 20`\n`var3: 30`\n\n简单。你只需要在大括号内定义你想要成员变量初始化的值，编译器就会为你完成。很酷。所以这意味着我们不需要在初始化列表中初始化它们了，对吧？没那么快。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass baseClass\n{\npublic:\n\
  int var1;\nint var2;\nint var3;\nbaseClass()\n{\n```\n\n\n\n\n\n```cpp\ncout <<\
  \ \"Constructor\" << endl;\n\n}\n\n};\n\nint main(int argc, char** argv)\n{\n  \
  \  baseClass bcObj = { 10, 20, 30 };\n    cout << \"var1: \" << bcObj.var1 << endl;\n\
  \    cout << \"var2: \" << bcObj.var2 << endl;\n    cout << \"var3: \" << bcObj.var3\
  \ << endl;\n    return 0;\n}\n```\n\n![](img/image00862.jpeg)\n\n你可以看到，如果你定义了一个构造函数，那么编译器就不会为你进行初始化了。这很合理，对吧？如果你定义了构造函数，说明你这样做是为了初始化对象。所以你应该初始化它们。因此，当你实现构造函数时，编译器就会退后，不再参与你的初始化工作。这里说得有点长，但我们在这里涵盖了很多内容。我相信你对构造函数是如何工作的已经有了相当深入的见解。\n\
  \n## 第 9 节 前向声明、编译与链接\n\n有时我们将某些事情理所当然。如果你在使用 IDE（如 Visual Studio 或 Eclipse），你构建项目并运行它，从没有考虑过编译和链接。但这两个步骤一直在发生，理解它们的基础知识是有用的。\n\
  \n## 函数前向声明\n\n让我们从简单的开始。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\
  \nvoid printFunction(int var); // 前向声明\n\nclass simpleClass\n{\npublic:\n    int\
  \ var;\n    simpleClass(int value)\n    {\n        var = value;\n        printFunction(var);\n\
  \    }\n};\n\nvoid printFunction(int var)\n{\n    cout << \"Passed value is: \"\
  \ << var << endl;\n}\n\nint main(int argc, char** argv)\n{\n    simpleClass(10);\n\
  \    return 0;\n}\n```\n\n传递的值是: 10\n\n这个程序并没有在任何有意义的事情。我们通过传递一个整数来实例化对象，构造函数将此值传递给\
  \ `printFunction` 并打印它，或者执行它所做的任何操作。\n\n这些是起点：\n\n*   在类定义开始之前，我们对函数进行了前向声明。这就是函数的\
  \ `prototype`（原型）。\n*   `simpleClass` 构造函数调用了 `printFunction` 并向它传递了整数。重要的是，要理解在此时，编译器并不知道\
  \ `printFunction` 的定义。它只知道有一个同名的函数，它接受一个整数参数并且没有返回值。注释掉顶部的前向声明，你将会得到这个：\n\n![](img/image00863.jpeg)\n\
  \n所以你可以看到，你得到了编译器错误，尽管我们已经定义了函数（在类定义之后），但编译器并没有感知到它。这是因为编译器是按顺序处理代码的。所以当它在构造函数中时，它并不知道函数定义就在它下方。现在去取消前向声明的注释吧。\n\
  \n*   现在保留前向声明，并注释掉整个函数定义。你应该得到一个类似这样的错误：\n\n![](img/image00864.jpeg)\n\n这是一个链接错误（Linker\
  \ error）。之前是编译错误。注意它们的区别是非常重要的。链接是编译之后发生的事情。所以在这里我们知道代码编译得很好。但它无法链接。链接错误没有编译器错误那么友好。但你可以看出它正在对\
  \ `printFunction` 抱怨。\n\n在我们继续下去之前，稍微了解一下编译和链接是非常重要的。下面的图显示了编译和链接的一个非常基本的机制。\n\n\
  ![](img/image00865.jpeg)\n\n带有代码的源代码首先由编译器分析。这就是发现语法、定义等错误的地方。编译器然后生成对象文件（object\
  \ file）。如果你使用 Unix 环境，它将是一个 `*.o` 文件；如果你使用 Visual Studio，它将是一个 `*.obj` 文件。这个对象文件然后发送到链接器，链接器输出可执行文件。在我们目前为止的示例中，只有一个源文件。但注意，我们使用了\
  \ `<iostream>` 库。这就是链接器工作的地方。看到，对象文件包含了占位符。这些占位符用于源代码本身中未定义的变量或方法。链接器做的是获取这个对象文件并用其他对象文件填充这些占位符。让我们修改示例来查看实际效果。\n\
  \n我们的主文件如下：\n\n```cpp\n//main.cpp\n#include<iostream>\n\nusing namespace std;\n\n\
  void printFunction(int var); // 前向声明\n\nclass simpleClass\n{\npublic:\n    int var;\n\
  \    simpleClass(int value)\n    {\n        var = value;\n        printFunction(var);\n\
  \    }\n};\n\nint main(int argc, char** argv)\n{\n    simpleClass(10);\n    return\
  \ 0;\n}\n```\n\n注意，我们有 `printFunction` 的前向声明，但那里没有定义。现在编译它。如果你使用 Visual Studio，可以按\
  \ \"Ctrl+F7\"，或者通过 Visual Studio 命令提示符进行。你可以通过以下命令编译：\n\n```\nCL /c main.cpp\n```\n\
  \n这将创建一个 `main.obj` 文件。如果你使用 Unix 环境，可以执行：\n\n```\ng++ main.cpp main.o\n```\n\n\
  你会发现没有得到错误。然而，如果你尝试构建这个程序，你将会得到之前遇到的链接错误。所以现在你知道编译器是没问题的，但链接器报错了。\n\n所以现在你知道编译器对这个程序是满意的，但链接器并不满意。为什么编译器没有抱怨，链接器却在报错？因为你可以看到，编译器对前向声明是满意的。它确信有一个名为\
  \ `printFunction` 的函数，接受一个 int 参数并返回 void。从编译器的角度来看，它不需要知道任何信息。它只是放了一个占位符。但我们还没有在任何地方定义这个函数。所以链接器自然会抱怨。现在让我们继续并定义它。但这次，我们把它放在单独的文件中。命名\
  \ `printFunction.cpp`。\n\n```cpp\n//printFunction.cpp\n#include<iostream>\n\nusing\
  \ namespace std;\n\nvoid printFunction(int var)\n{\n    cout << \"Passed value is:\
  \ \" << var << endl;\n}\n```\n\n现在如果你构建项目，你会看到它编译并运行，没有任何问题。所以你知道链接器找到了并“链接”了。但让我们一步步来。我们现在想做的是编译\
  \ `printFunction.cpp` 之前……（注：此处原文有重复，译文已按逻辑理顺）\n\n```cpp\nCL /c printFunction.cpp\n\
  ```\n\n这将创建一个 `printFunction.obj` 文件或 `.o` 文件，取决于你的环境。再次，你可以看到编译器没有问题。我们现在想做的是链接这两个对象文件。让我们先只将\
  \ `main.obj` 传递给链接器看看它的想法：\n\n```\nLINK main.obj\n```\n\n你应该会看到之前的那个链接错误。所以现在你了解在\
  \ Visual Studio 中构建项目时发生了什么。它为你一步步完成了编译和链接。所以你可以看到，链接器对它所拥的信息（或缺失的信息）是不满意。让我们给链接器更多信息来处理。\n\
  \n```\nLINK main.obj printFunction.obj\n```\n\n你会发现链接器现在没有抱怨了。它创建了可执行文件。因为现在我们传递了\
  \ `printFunction` 对象文件，链接器现在可以用 `printFunction.obj` 中的函数定义填充 `main.obj` 文件中的 `printFunction`\
  \ 占位符。\n\n我们在这里讨论的是编译器和链接器最基本的功能，但它应该让你对后台发生的情况有一个基本的理解。\n\n## 类类型的前向声明\n\n现在让我们以稍微不同的方式来看这个问题。不是函数，我们将定义一个类。我们的主文件将如下：\n\
  \n```cpp\n// main.cpp\n#include<iostream>\n\nusing namespace std;\n\nclass fwdDeclClass;\
  \ // 前向声明\n\nclass simpleClass\n{\npublic:\n    fwdDeclClass fwdDeclClassObj;\n\n\
  \    simpleClass() : fwdDeclClassObj()\n    {}\n};\n\nint main(int argc, char**\
  \ argv)\n{\n    simpleClass simpleClassObj;\n    return 0;\n}\n```\n\n\n\n\n我们将像这样定义我们的\
  \ `fwdDeclClass`。\n\n```cpp\n// fwdDeclClass.cpp\n\n#include<iostream>\n\nusing\
  \ namespace std;\n\nclass fwdDeclClass\n{\npublic:\n    fwdDeclClass()\n    {\n\
  \        cout << \"fwdDeclClass cosntructor\" << endl;\n    }\n};\n```\n\n现在尝试编译你的\
  \ `main.cpp`。你将得到一个类似下面的错误：\n\n![](img/image00866.jpeg)\n\n编译器基本上是在抱怨使用了一个未定义的类。但为什么呢？让我们继续尝试编译我们的\
  \ `fwdDeclClass.cpp`。你不应该看到任何错误。它应该可以正常编译。那么，为什么我们的 `main.cpp` 拒绝编译呢？为什么在我们已经对它进行了前向声明的情况下，它仍然抱怨\
  \ `fwdDeclClass` 未定义？好的，让我们修改我们的 `simpleClass`，让它拥有一个指向 `fwdDeclClass` 的指针，而不是 `fwdDeclClass`\
  \ 实例。\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass fwdDeclClass;\
  \ // 前向声明\n\nclass simpleClass\n{\npublic:\n    fwdDeclClass *fwdDeclClassPtr;\n\
  \    simpleClass()\n{}\n};\n\nint main(int argc, char** argv)\n{\n    simpleClass\
  \ simpleClassObj;\n    return 0;\n}\n```\n\n这应该是可以正常编译的。事实上，你可以构建并运行。问题是，为什么当我们有一个成员类对象时编译器无法处理前向声明，但当有一个指向该类的指针时就可以正常工作？\n\
  \n原因是，编译器不需要知道关于类的任何信息就可以拥有指针。无论类型如何，指针占据的内存空间是相同的。指向 `fwdDeclClass` 的指针和指向整数的指针大小相同。因此，编译器可以在不需要知道其实现的情况下为\
  \ `fwdDeclClass` 指针分配内存。这与对函数进行前向声明的情况是一致的。编译器只需要知道函数签名来检查语法并为链接器放置占位符。这就是编译器对函数调用需要做的全部工作，而前向声明提供了必要的信息。\n\
  \n但当我们有一个类对象时，情况并非如此。当我们将类对象作为成员时，编译器必须了解该类的组成，因为它需要为它分配内存。该对象将是类本身的一部分。因此，编译器需要了解\
  \ `fwdDeclClass` 以在 `simpleClass` 内部实例化它。而编译器仅通过前向声明无法做到这一点。它除了包含一个名为 `fwdDeclClass`\
  \ 的类之外，不包含任何信息。\n\n当你修改 `simpleClass` 构造函数来初始化 `fwdDeclClassPtr` 时，这会变得更加清晰。\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass fwdDeclClass; // 前向声明\n\
  \nclass simpleClass\n{\npublic:\n    fwdDeclClass *fwdDeclClassPtr;\n    simpleClass()\n\
  \    {\n        fwdDeclClassPtr = new fwdDeclClass();\n    }\n};\n\nint main(int\
  \ argc, char** argv)\n{\n    simpleClass simpleClassObj;\n    return 0;\n}\n```\n\
  \n![](img/image00867.jpeg)\n\n现在能看到为什么了吗？我们尝试用 `fwdDeclClass` 的实例来初始化 `fwdDeclClassPtr`，你可以看到为什么这对编译器来说是一个问题。编译器对\
  \ `fwdDeclClass` 一无所知。它不知道 `fwdDeclClass` 是否有默认构造函数。现在如果你只是在 `main.cpp` 中包含 `\"\
  fwdDeclClass.cpp\"`，编译器错误就会消失（通常你会将 `fwdDeclClass` 放在一个 .h 头文件中）。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\n#include \"fwdDeclClass.cpp\"\n\nclass simpleClass\n{\n\
  public:\n    fwdDeclClass *fwdDeclClassPtr;\n    fwdDeclClass fwdDeclClassObj;\n\
  \    simpleClass(int value) : fwdDeclClassObj()\n    {\n        fwdDeclClassPtr\
  \ = new fwdDeclClass();\n    }\n    ~simpleClass()\n    {\n        delete fwdDeclClassPtr;\n\
  \    }\n};\n\nint main(int argc, char** argv)\n{\n    simpleClass simpleClassObj;\n\
  \    return 0;\n}\n```\n\n`fwdDeclClass` 构造函数\n`fwdDeclClass` 构造函数\n\n在我们结束这个主题之前，让我问问这个问题。如果在类中有一个未定义的函数会怎样？我们之前看到过，如果调用这个函数，就会出现链接错误。但如果我们不在代码中调用这个函数呢？还会有错误吗？让我们快速查一下。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nclass simpleClass\n{\npublic:\n\
  \    int var;\n    simpleClass(int value)\n    {\n        var = value;\n       \
  \ memberFunc(var); // <-- Line A\n    }\n    void memberFunc(int var);\n};\n\nint\
  \ main(int argc, char** argv)\n{\n    simpleClass(10);\n    return 0;\n}\n```\n\n\
  尝试编译并运行上面的代码。你会发现它编译正常但无法链接。这是因为我们在类中声明了 `memberFunc`，所以编译器感知到了它。但存在一个链接错误，我们知道原因。因为该函数没有定义。现在如果我们注释掉调用，会发生什么呢？\n\
  \n\n\n在这里我们打印的是指针地址，而不是像之前那样打印它们所指向的内容。你会发现它们是相同的。这意味着什么？是的，这意味着它们都指向同一个变量！你能看出这完全不是我们想要的吗？我们想要的只是复制\
  \ `anotherObj1` 的值，但我们想要一个独立的对象，而不是一个与原始对象绑定的对象。你能看出这会有多少种方式可能出错吗？\n\n让我们来看一些例子。（我省略了类的定义。它们不会改变。）\n\
  \n### 灾难 #1\n\n```cpp\nint main(int argc, char** argv)\n{\nanotherClass anotherObj1(10);\n\
  anotherClass anotherObj2(anotherObj1);\n\ncout << endl;\ncout << \"anotherObject1.var:\
  \ \" << anotherObj1.var << endl;\ncout << \"*anotherObject1.varPtr: \" << *anotherObj1.varPtr\
  \ << endl;\ncout << \"anotherObject2.var: \" << anotherObj2.var << endl;\ncout <<\
  \ \"*anotherObject2.varPtr: \" << *anotherObj2.varPtr << endl << endl;\n\nanotherObj1.var\
  \ = 20;\ncout << \"anotherObject1.var: \" << anotherObj1.var << endl;\ncout << \"\
  *anotherObject1.varPtr: \" << *anotherObj1.varPtr << endl;\ncout << \"anotherObject2.var:\
  \ \" << anotherObj2.var << endl;\ncout << \"*anotherObject2.varPtr: \" << *anotherObj2.varPtr\
  \ << endl << endl;\n\nreturn 0;\n}\n```\n\nanotherObject1.var: 10\n*anotherObject1.varPtr:\
  \ 10\nanotherObject2.var: 10\n*anotherObject2.varPtr: 10\nanotherObject1.var: 20\n\
  *anotherObject1.varPtr: 20\nanotherObject2.var: 10\n*anotherObject2.varPtr: 20\n\
  anotherObject1.var: 30\n*anotherObject1.varPtr: 30\nanotherObject2.var: 10\n*anotherObject2.varPtr:\
  \ 30\n\n在打印输出的第一部分，我们看到两个对象的 `var` 值都是 10，这是我们预期的，而且两个解引用指针的值也都是 10。到目前为止一切看起来都是正常的。但在打印输出的第二部分，我们看到情况变得极其糟糕了。我们将\
  \ `anotherObj1` 的 `var` 改为 20。我们预期的是 `anotherObj1` 的 `varPtr` 值为 20，并且预期 `anotherObj2`\
  \ 完全不会发生变化。但我们看到的并非如此。在第三部分，我们解引用了 `anotherObj2` 的 `varPtr` 并更改了它的值。结果改变了 `anotherObj1`\
  \ 的 `var`。这简直是疯了！\n\n这两个对象的行为完全违背了我们的预期。`varPtr` 并没有指向*当前*对象的 `var`，而是指向 `anotherObj1`\
  \ 的 `var`。这意味着每当我们改变一个对象的 `varPtr` 时，也会影响另一个对象。为什么会发生这种情况？\n\n这是因为编译器生成的拷贝构造函数执行了“位”（bit-wise）拷贝。这意味着拷贝构造函数按位地将\
  \ `anotherObj1` 复制到 `anotherObj2`。`anotherObj1.var` 中的任何位数据都被复制到了 `anotherObj2.var`\
  \ 的内存空间中。`varPtr` 也是如此。它基本上执行了 `memcopy`。编译器生成的拷贝构造函数很可能是这种形式：\n\n```cpp\nanotherClass(const\
  \ anotherClass& objToCopy)\n{\n    std::memcpy(this, &objToCopy, sizeof(anotherClass));\n\
  }\n```\n\n另一个线索应该是构造函数的输出。看，在第一个例子中，每个类的构造函数只被调用了一次。这意味着当我们复制对象时，构造函数从未被调用。在某些情况下是可以的。但当我们有指针时，这绝对是不的。你看，指针是这一切疯狂行为的根源。两个\
  \ `varPtr` 都指向 `anotherObj1` 的 `var`。这里是另一种出错的方式：\n\n### 灾难 #2\n\n```cpp\n...\n\
  ...\n\nint main(int argc, char** argv)\n{\nanotherClass* anotherPtr1 = new anotherClass(10);\n\
  anotherClass* anotherPtr2 = new anotherClass(*anotherPtr1);\n\ncout << endl;\ncout\
  \ << \"anotherPtr1->var: \" << anotherPtr1->var << endl;\ncout << \"*anotherPtr1->varPtr:\
  \ \" << *anotherPtr1->varPtr << endl;\ncout << \"anotherPtr2->var: \" << anotherPtr2->var\
  \ << endl;\ncout << \"*anotherPtr2->varPtr: \" << *anotherPtr2->varPtr << endl <<\
  \ endl;\n\ndelete anotherPtr1;\ncout << \"anotherPtr2->var: \" << anotherPtr2->var\
  \ << endl;\ncout << \"*anotherPtr2->varPtr: \" << *anotherPtr2->varPtr << endl <<\
  \ endl;\n\nreturn 0;\n}\n```\n\nanotherPtr1->var2: 10\n*anotherPtr1->var2Ptr: 10\n\
  anotherPtr2->var2: 10\n*anotherPtr2->var2Ptr: 10\nanotherPtr2->var2: 10\n*anotherPtr2->var2Ptr:\
  \ -5726\n\nanotherPtr1->var2: 10\n*anotherPtr1->var2Ptr: 10\nanotherPtr2->var2:\
  \ 10\n*anotherPtr2->var2Ptr: -5726\n\n在这里我们打印的是指针地址，而不是像之前那样打印它们所指向的内容。你会发现它们是相同的。这意味着什么？是的，这意味着它们都指向同一个变量！你能看出这完全不是我们想要的吗？我们想要的只是复制\
  \ `anotherObj1` 的值，但我们想要一个独立的对象，而不是一个与原始对象绑定的对象。你能看出这会有多少种方式可能出错吗？\n\n\n\n\n```cpp\n\
  class anotherClass\n{\npublic:\n    int var;\n    int* varPtr;\n    simpleClass\
  \ simpleObj;\n    anotherClass(int value) : var(value), varPtr(&var), simpleObj(value)\n\
  \    {}\n    anotherClass(const anotherClass& objToCopy)\n    {\n        var = objToCopy.var;\n\
  \        varPtr = &var;\n    }\n};\n```\n\n...\n\n![](img/image00868.jpeg)\n\n为什么编译器报错说没有默认构造函数呢？这就是我们之前讨论过的，拷贝构造函数是另一种构造函数。编译器看到\
  \ `simpleClass` 有一个构造函数，因此编译器现在有义务调用那个构造函数。它在抱怨没有默认构造函数。这和我们在调用派生类构造函数或带有构造函数的成员类的类时看到的情况是一样的吗？是一回事。编译器正尝试构造\
  \ `anotherClass` 对象，而其中包含一个定义了构造函数的 `simpleClass` 对象。现在编译器需要调用该构造函数，但它不能，因为没有默认构造函数。记住我之前说过的，编译器只能调用默认构造函数。现在让我们来看两种不同的场景。\n\
  \n### 1. `simpleClass` 没有构造函数\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  \nclass simpleClass\n{\npublic:\n    int val;\n};\n\nclass anotherClass\n{\npublic:\n\
  \    int var;\n    int* varPtr;\n    simpleClass simpleObj;\n    anotherClass(int\
  \ value) : var(value), varPtr(&var)\n    {}\n    anotherClass(const anotherClass&\
  \ objToCopy)\n    {\n        var = objToCopy.var;\n        varPtr = &var;\n    }\n\
  };\n\nint main(int argc, char** argv)\n{\n    anotherClass anotherObj1(10);\n  \
  \  anotherClass anotherObj2(anotherObj1);\n    return 0;\n}\n```\n\n这段代码可以正常编译并运行。但请注意我是如何从\
  \ `simpleClass` 中同时移除构造函数和拷贝构造函数的？因为如果我留着拷贝构造函数，就会得到：\n\n![](img/image00869.jpeg)\n\
  \n为什么有两个错误？一个是针对构造函数的，另一个针对拷贝构造函数的。所以这应该能说服你：对于编译器来说，拷贝构造函数就是一个接受常数引用参数的构造函数。仅此而已。这引出了我们的另一个观点：如果你为一个类实现了拷贝构造函数，你就必须也实现构造函数，因为编译器现在不会为你做这件事。\n\
  \n### 2. `simpleClass` 有默认构造函数\n\n现在你应该已经知道这个答案了。\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n\nclass simpleClass\n{\npublic:\n    int val;\n    simpleClass(int\
  \ value = 99) : val(value)\n    {\n        cout << \"SimpleClass constructor: \"\
  \ << val << endl;\n    }\n    simpleClass(const simpleClass& objToCopy)\n    {\n\
  \        val = objToCopy.val;\n        cout << \"SimpleClass copy constructor: \"\
  \ << endl;\n    }\n};\n\nclass anotherClass\n{\npublic:\n    int var;\n    int*\
  \ varPtr;\n    simpleClass simpleObj;\n    anotherClass(int value) : var(value),\
  \ varPtr(&var), simpleObj(value)\n    {}\n    anotherClass(const anotherClass& objToCopy)\n\
  \    {\n        var = objToCopy.var;\n        varPtr = &var;\n    }\n};\n\nint main(int\
  \ argc, char** argv)\n{\n    anotherClass anotherObj1(10);\n    anotherClass anotherObj2(anotherObj1);\n\
  \    return 0;\n}\n```\n\nSimpleClass constructor: 10  \nSimpleClass constructor:\
  \ 99\n\n很容易看出这里发生了什么。`anotherObj1` 的构造调用了带参数 `10` 的构造函数。`anotherObj2` 的拷贝构造函数调用了带默认参数\
