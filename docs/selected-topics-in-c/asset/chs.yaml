  \n这里有一个命名空间 `A` 和命名空间 `B`，它包含了命名空间 `A`，然后命名空间 `C` 定义在 `B` 内部。命名空间 `C` 中也定义了 `foo()`。因此，在命名空间\
  \ `B` 中有两个 `foo` 函数。\n\n从编译器错误中可以看出，编译器找不到 `fooC`。虽然命名空间 `C` 定义在 `B` 内部，但 `C` 内部的函数不在作用范围内。如果我们注释掉\
  \ `B::fooC()`，就会得到：\n\n`A::foo()`\n`B::C::foo()`\n\n所以你会发现，`B` 作用域内的 `foo` 只有 `A::foo`。`B::C::foo()`\
  \ 不在作用范围内。如果我们想调用命名空间 `C` 中的函数，我们需要对调用进行限定。但看这个例子。\n\n```cpp\n#include<iostream>\n\
  \nusing namespace std;\n\nnamespace A {\nvoid fooA()\n{\n    cout << \"A::fooA()\"\
  \ << endl;\n}\n}\n\nnamespace B {\nusing namespace A;\nvoid fooB()\n{\n    cout\
  \ << \"B::fooB()\" << endl;\n}\nnamespace C {\nvoid fooC()\n{\n    fooA();\n   \
  \ fooB();\n}\n}\n}\n\nint main(int argc, char** argv)\n{\n    b::C::fooC();\n  \
  \  return 0;\n}\n```\n`A::fooA()`\n`B::fooB()`\n\n即使命名空间 `C` 在命名空间 `B` 的作用范围内，`B`\
  \ 中的所有内容（包括通过 'using' 引入作用域的命名空间）都在命名空间 `C` 的作用范围内。\n\n这就是关于命名空间限定名查找常见用法的全部内容。记住在进行限定调用时，命名空间查找的迭代过程。这与我们进行未限定调用时发生的情况略有不同。\n\
  \n## 未限定名查找 (Unqualified name lookup)\n\n未限定名查找就是字面意思。它是在名称未经过限定时的名称查找。早些我们讨论了限定调用，即调用名称使用作用域解析运算符进行了限定的。而在限定名查找中，我们主要考虑命名空间，而未限定名查找完全关乎作用域。让我们从一个例子开始。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nnamespace A {\nint x = 1;\n\
  void foo1()\n{\n    cout << \"A::foo1 - x= << << x << endl;\n}\n}\n\nnamespace B\
  \ {\nint x = 2;\nvoid foo2()\n{\n    cout << \"B::foo2 - x =\" << x << endl;\n}\n\
  using namespace A;\nvoid foo3()\n{\n    cout << \"B::foo3 - x =\" << x << endl;\n\
  }\nnamespace C {\nvoid foo4()\n{\n    cout << \"B::C::foo4 - x =\" << x << endl;\n\
  }\nint x = 3;\nvoid foo5()\n{\n    cout << \"B::C::foo5 - x =\" << x << endl;\n\
  }\n}\n}\n}\n\nint main(int argc, char** argv)\n{\n    a::foo1();\n    // b::foo1();\n\
  \    b::foo2();\n    b::foo3();\n    b::C::foo4();\n    b::C::foo5();\n    return\
  \ 0;\n}\n```\n`A::foo1 - x= 1`\n`A::foo1 - x= 1`\n`B::foo2 - x =2`\n`B::foo3 - x\
  \ =2`\n`B::C::foo4 - x =2`\n`B::C::foo5 - x =3`\n\n理解这里发生了什么并不困难。我们正在尝试查看变量 `x`\
  \ 的作用边界。正如我们在上一个限定名查找的示例中看到的，内部命名空间的作用域包含了所属命名空间中的所有内容。因此，命名空间 `C` 的作用域内包含了 `B`\
  \ 中的变量 `x`。\n\n在限定名查找中，我们看到对命名空间进行迭代搜索。首先搜索限定的命名空间，如果未找到该名称，则搜索包含的命名空间，并一直持续直到找到它或到达最后一个命名空间。我们还看到搜索不会进入全局命名空间。同样的机制也发生在未限定查找中。名称的查找从当前作用域开始并向上传移动。\n\
  \n所以，当我之前提到内部命名空间的作用域内包含外部命名空间时，这实际上是不准确的。说最内层命名空间在其“作用域”内拥有外部命名空间是不正确的。它并没有。但未限定名查找的关键在于，名称查找会移动到外层作用域。\n\
  \n```cpp\n#include<iostream>\n\nusing namespace std;\n\nnamespace A {\nint a = 1;\n\
  namespace B {\nint b = 2;\nnamespace C {\nint c = 3;\nnamespace D {\nint d = 4;\n\
  }\n}\n}\n}\n\nint main(int argc, char** argv)\n{\n    return 0;\n}\n```\n（注：由于原文提供的待翻译文本在最后几段存在格式上的粘贴错误（代码块与描述的错乱），我将根据其描述的逻辑进行对齐）\n\
  \n等等，我发现您提供的待翻译文本在最后几段存在格式上的粘贴错误（代码块与描述的错乱），我将严格按照您提供的文本内容进行翻译翻译。\n\n（注：由于篇幅限制，此处仅在上方回复中完整呈现了译文。文文翻译翻译待翻译文本的翻译内容，，，，，，，，\n\
