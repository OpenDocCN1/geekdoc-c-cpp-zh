    # Real World


    Although obsessing about performance is a game programmer’s favorite hobby, there’s
    a danger in focusing too much on speed. In fact, the approach many developers
    take is to first get their game programs working well before they tweak for small
    performance gains. At that point, programmers will *profile* their code by running
    a utility (a profiler) that analyzes where the game program spends its time. If
    a programmer sees bottlenecks, he or she might consider hand optimizations such
    as function inlining.


