- pgno: 4
  md: '# ACKNOWLEDGMENTS


    ![](img/34f09be0ed6217c465debc4490197d4f_4_0.png)


    Every book you’ve ever read perpetuates a big fat lie. And I’m here to out the
    publishing industry’s dirty little secret—books are not “by” only one person.
    Yes, you see only one name on book covers (including this one), but it takes a
    team of dedicated people to pull off the final product. Authors could not do it
    alone; I certainly could not have done it alone. So I want to thank all those
    who helped make this book a reality.


    Thanks to Jenny Davidson for her dual role as Project Editor and Copy Editor.
    Jenny kept me on schedule and my commas in place.


    Thanks to Maneesh Sethi, my Technical Reviewer, who made sure my programs worked
    the way I said they did.


    Thanks to Michael Beady, my Proofreader. His work makes this book look good—literally.


    I also want to thank Emi Smith, my Senior Acquisitions Editor, for all of her
    encouragement.


    Finally, I want to thank all of the game programmers who created the games I played
    while growing up. They inspired me to work in the industry and create games of
    my own. I hope I can inspire a few readers to do the same.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# ABOUT THE AUTHOR


    ![](img/34f09be0ed6217c465debc4490197d4f_5_0.png)


    **Michael Dawson** is a game programming author and instructor who teaches students
    the art and science of writing their own games. Mike has developed and taught
    game programming courses for UCLA Extension, The Digital Media Academy, and The
    Los Angeles Film School. In addition, his books have been required reading in
    colleges and universities around the country.


    Mike got his start in the game industry as a producer and designer, but he also
    “starred” in an adventure game in which the player controls the main character,
    named Mike Dawson. In the game, the player directs the digitized images of Dawson,
    who must stop an extraterrestrial invasion before an implanted alien embryo is
    born from his head.


    In real life, Mike is the author of *Beginning C++ Through Game Programming*,
    *Python Programming for the Absolute Beginner*, *C++ Projects: Programming with
    Text-Based Games*, and *Guide to Programming with Python*. He earned his bachelor’s
    degree in Computer Science from the University of Southern California. Visit his
    website at www.programgames.com to learn more or to get support for any of his
    books.'
