- pgno: 273
  md: 'Q: What’s a dangling pointer?


    A: A pointer that points to an invalid memory location, where any data could exist.


    Q: What’s so dangerous about a dangling pointer?


    A: Like using an uninitialized pointer, using a dangling pointer can lead to disastrous
    results, including a program crash.


    Q: Why should I initialize a pointer to 0?


    A: By initializing a pointer to 0, you create a null pointer, which is understood
    as a pointer to nothing.


    Q: So then it’s safe to dereference a null pointer, right?


    A: No! Although it’s good programming practice to assign 0 to a pointer that doesn’t
    point to an object, dereferencing a null pointer is as dangerous as dereferencing
    a dangling pointer.


    Q: What will happen if I dereference a null pointer?


    A: Just like dereferencing a dangling pointer or an uninitialized pointer, the
    results are unpredictable. Most likely, you’ll crash your program.


    Q: What good are null pointers?


    A: They’re often returned by functions as a sign of failure. For example, if a
    function is supposed to return a pointer to an object that represents the graphics
    screen, but that function couldn’t initialize the screen, it might return a null
    pointer.


    Q: How does using the keyword `const` when declaring a pointer affect the pointer?


    A: It depends on how you use it. Generally, you use `const` when you are declaring
    a pointer to restrict what the pointer can do.


    Q: What kinds of restrictions can I impose on a pointer by declaring it with `const`?


    A: You can restrict a pointer so it can only point to the object it was initialized
    to point to, or you can restrict a pointer so it can’t change the value of the
    object it points to, or both.'
