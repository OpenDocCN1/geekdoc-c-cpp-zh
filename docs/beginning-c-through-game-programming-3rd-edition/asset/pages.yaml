  md: '# CHAPTER 4


    # THE STANDARD TEMPLATE LIBRARY: HANGMAN


    So far you’ve seen how to work with sequences of values using arrays. But there
    are more sophisticated ways to work with collections of values. In fact, working
    with collections is so common that part of standard C++ is dedicated to doing
    just that. In this chapter, you’ll get an introduction to this important library.
    Specifically, you’ll learn to:


    +   - Use `vector` objects to work with sequences of values

    +   - Use `vector` member functions to manipulate sequence elements

    +   - Use iterators to move through sequences

    +   - Use library algorithms to work with groups of elements

    +   - Plan your programs with pseudocode


    # INTRODUCING THE STANDARD TEMPLATE LIBRARY


    Good game programmers are lazy. It’s not that they don’t want to work; it’s just
    that they don’t want to redo work that’s already been done—especially if it has
    been done well. The STL (*Standard Template Library*) represents a powerful collection
    of programming work that’s been done well. It provides a group of containers,
    algorithms, and iterators, among other things.


    So what’s a container and how can it help you write games? Well, containers let
    you store and access collections of values of the same type. Yes, arrays let you
    do


    ![](img/34f09be0ed6217c465debc4490197d4f_137_0.png)'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'the same thing, but the STL containers offer more flexibility and power than
    a simple but trusty array. The STL defines a variety of container types; each
    works in a different way to meet different needs.


    The algorithms defined in the STL work with its containers. The *algorithms* are
    common functions that game programmers find themselves repeatedly applying to
    groups of values. They include algorithms for sorting, searching, copying, merging,
    inserting, and removing container elements. The cool thing is that the same algorithm
    can work its magic on many different container types.


    *Iterators* are objects that identify elements in containers and can be manipulated
    to move among elements. They’re great for, well, iterating through containers.
    In addition, iterators are required by the STL algorithms.


    All of this makes a lot more sense when you see an actual implementation of one
    of the container types, so that’s up next.


    # USING VECTORS


    The `vector` class defines one kind of container provided by the STL. It meets
    the general description of a *dynamic array*—an array that can grow and shrink
    in size as needed. In addition, `vector` defines member functions to manipulate
    vector elements. This means that the vector has all of the functionality of the
    array plus more.


    At this point, you may be thinking to yourself: Why learn to use these fancy new
    vectors when I can already use arrays? Well, vectors have certain advantages over
    arrays, including:


    +   - Vectors can grow as needed while arrays cannot. This means that if you use
    a vector to store objects for enemies in a game, the vector will grow to accommodate
    the number of enemies that get created. If you use an array, you have to create
    one that can store some maximum number of enemies. And if, during play, you need
    more room in the array than you thought, you’re out of luck.

    +   - Vectors can be used with the STL algorithms while arrays cannot. This means
    that by using vectors you get complex functionality like searching and sorting,
    built-in. If you use arrays, you have to write your own code to achieve this same
    functionality.'
