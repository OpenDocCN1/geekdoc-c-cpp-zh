  md: '# CHAPTER 10


    # INHERITANCE AND

    POLYMORPHISM: BLACKJACK


    ![](img/34f09be0ed6217c465debc4490197d4f_353_0.png)


    Classes give you the perfect way to represent game entities that have attributes
    and behaviors. But game entities are often related. In this chapter, you’ll learn
    about inheritance and polymorphism, which give you ways to express those connections
    and can make defining and using classes even simpler and more intuitive. Specifically,
    you’ll learn to:


    +   - Derive one class from another

    +   - Use inherited data members and member functions

    +   - Override base class member functions

    +   - Define virtual functions to enable polymorphism

    +   - Declare pure virtual functions to define abstract classes


    # INTRODUCING INHERITANCE


    One of the key elements of OOP is *inheritance*, which allows you to *derive*
    a new class from an existing one. When you do so, the new class automatically
    *inherits* (or gets) the data members and member functions of an existing class.
    It’s like getting the work that went into the existing class for free!


    Inheritance is especially useful when you want to create a more specialized version
    of an existing class because you can add data members and member functions to
    the new class to extend it. For example, imagine you have a class Enemy that defines
    an enemy in a game with a member function Attack() and a'
