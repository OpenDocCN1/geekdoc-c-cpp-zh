    \ the loop to find it.\n\n# Trap\n\nIf you’ve ever had a game get stuck in the\
    \ same endless cycle, you might have experienced an infinite loop—a loop without\
    \ end. Here’s a simple example of an infinite loop:\n\n```\nint test = 10;\nwhile\
    \ (test == 10)\n{\n    cout << test;\n}\n```\n\nIn this case, the loop is entered\
    \ because test is 10. But because test never changes, the loop will never stop.\
    \ As a result, the user will have to kill the running program to end it. The moral\
    \ of this story? Make sure that the expression of a loop can eventually become\
    \ false or that there’s another way for the loop to end, such as described in\
    \ the following section, “Using break and continue Statements.”\n\n# USING BREAK\
