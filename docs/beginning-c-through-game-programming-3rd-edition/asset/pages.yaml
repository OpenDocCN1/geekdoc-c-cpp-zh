  md: '# Hint


    Although a default case isn’t required, it’s usually a good idea to have one as
    a catchall.


    Here’s an example to cement the ideas. Suppose choice is equal to value2. The
    program will first test choice against value1. Because they’re not equal, the
    program will continue. Next, the program will test choice against value2. Because
    they are equal, the program will execute statement2. Then the program will hit
    the break statement and exit the switch structure.


    # Trap


    You can use the switch statement only to test an int (or a value that can be treated
    as an int, such as a char or an enumerator). A switch statement won’t work with
    any other type.


