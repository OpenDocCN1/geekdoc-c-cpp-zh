    \ changes. When the expression of the `if` statement, (`score = 1000`), is evaluated,\
    \ `score` is assigned 1000. The assignment statement evaluates to 1000, and because\
    \ that’s a non-zero value, the expression is interpreted as `true`. As a result,\
    \ the string is displayed.\n\nBe on guard for this type of mistake. It’s easy\
    \ to make and in some cases (like this one), it won’t cause a compile error.\n\
    \n# Nesting if Statements\n\nAn `if` statement can cause a program to execute\
