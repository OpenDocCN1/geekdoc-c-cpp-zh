    \ make the destructor virtual, too.\n\n# Using Abstract Classes\n\nAt times you\
    \ might want to define a class to act as a base for other classes, but it doesn’t\
    \ make sense to instantiate objects from this class because it’s so generic. For\
    \ example, suppose you have a game with a bunch of types of creatures running\
