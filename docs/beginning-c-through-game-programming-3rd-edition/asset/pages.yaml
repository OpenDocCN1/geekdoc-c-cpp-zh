    A comprehensive explanation of the various forms of casting a value from one type
    to another is beyond the scope of this book.


    # Calculating a Number within a Range


    After generating a random number, randomNumber holds a value between 0 and 32767
    (based on my implementation of C++). But I need a number between 1 and 6, so next
    I use the modulus operator to produce a number in that range.


    ```

    int die = (randomNumber % 6) + 1;  // get a number between 1 and 6

    ```


    Any positive number divided by 6 will give a remainder between 0 and 5. In the
    preceding code, I take this remainder and add 1, giving me the possible range
    of 1 through 6—exactly what I wanted. You can use this technique to convert a
    random number to a number within a range you’re looking for.'
