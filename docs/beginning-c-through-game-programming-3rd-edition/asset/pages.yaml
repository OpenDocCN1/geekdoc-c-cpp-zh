    ```\n\nAll I’ve done is play with the whitespace, which doesn’t change the meaning\
    \ of the code. Now the problem should be clear. The if statement sees the false\
    \ value and skips the next statement (the empty statement). Then the program goes\
    \ on its merry way to the statement after the if statement, which displays the\
