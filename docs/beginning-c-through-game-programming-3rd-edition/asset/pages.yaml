  md: "By using the reference operator in `string&` when I specify the return type,\
    \ I’m saying that the function will return a reference to a string object (not\
    \ a string object itself). You can use the reference operator like I did to specify\
    \ that a function returns a reference to an object of a particular type. Simply\
    \ put the reference operator after the type name.\n\nThe body of the function\
    \ `refToElement()` contains only one statement, which returns a reference to the\
    \ element at position i in the vector.\n\n```\nreturn vec[i];\n```\n\nNotice that\
    \ there’s nothing in the `return` statement to indicate that the function returns\
    \ a reference. The function header and prototype determine whether a function\
    \ returns an object or a reference to an object.\n\n# Trap\n\nAlthough returning\
    \ a reference can be an efficient way to send information back to a calling function,\
    \ you have to be careful not to return a reference to an out-of-scope object—an\
    \ object that ceases to exist. For example, the following function returns a reference\
    \ to a `string` object that no longer exists after the function ends—and that’s\
    \ illegal.\n\n```\nstring& badReference()\n{\n    string local = \"This string\
    \ will cease to exist once the function ends.\";\n    return local;\n}\n```\n\n\
    One way to avoid this type of problem is to never return a reference to a local\
    \ variable.\n\n# Displaying the Value of a Returned Reference\n\nAfter creating\
    \ `inventory`, a vector of items, I display the first item through a returned\
    \ reference.\n\n```\ncout << refToElement(inventory, 0) << \"\\n\\n\";\n```\n\n\
    The preceding code calls `refToElement()`, which returns a reference to the element\
    \ at position 0 of `inventory` and then sends that reference to `cout`. As a result,\
    \ `sword` is displayed."
