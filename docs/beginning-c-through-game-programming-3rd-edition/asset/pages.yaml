- pgno: 30
  md: 'I include the file iostream, which is part of the standard library, because
    it contains code to help me display output. I surround the filename with less
    than (<) and greater than (>) characters to tell the compiler to find the file
    where it keeps all the files that came with the compiler. A file that you include
    in your programs like this is called a header file.


    # Defining the main() Function


    The next non-blank line is the header of a function called main().


    ```

    int main()

    ```


    A function is a group of programming code that can do some work and return a value.
    In this case, int indicates that the function will return an integer value. All
    function headers have a pair of parentheses after the function name.


    All C++ programs must have a function called main(), which is the starting point
    of the program. The real action begins here.


    The next line marks the beginning of the function.


    ```

    {

    ```


    And the very last line of the program marks the end of the function.


    ```

    }

    ```


    All functions are delimited by a pair of curly braces, and everything between
    them is part of the function. Code between two curly braces is called a block
    and is usually indented to show that it forms a unit. The block of code that makes
    up an entire function is called the body of the function.


    # Displaying Text through the Standard Output


    The first line in the body of main() displays Game Over!, followed by a newline,
    in the console window.


    ```

    std::cout << "Game Over!" << std::endl;

    ```


    "Game Over!" is a string—a series of printable characters. Technically, it’s a
    string literal, meaning it’s literally the characters between the quotes.


    cout is an object, defined in the file iostream, that’s used to send data to the
    standard output stream. In most programs (including this one), the standard output
    stream simply means the console window on the computer screen.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'I use the *output operator* (`<<`) to send the string to `cout`. You can think
    of the output operator like a funnel; it takes whatever’s on the open side and
    funnels it to the pointy side. So the string is funneled to the standard output—the
    screen.


    I use `std` to prefix `cout` to tell the compiler that I mean `cout` from the
    standard library. `std` is a *namespace*. You can think of a namespace like an
    area code of a phone number—it identifies the group to which something belongs.
    You prefix a namespace using the *scope resolution operator* (`::`).


    Finally, I send `std::endl` to the standard output. `endl` is defined in `iostream`
    and is also an object in the `std` namespace. Sending `endl` to the standard output
    acts like pressing the Enter key in the console window. In fact, if I were to
    send another string to the console window, it would appear on the next line.


    I understand this might be a lot to take in, so check out Figure 1.3 for a visual
    representation of the relationship between all of the elements I’ve just described.


    ![](img/34f09be0ed6217c465debc4490197d4f_31_0.png)


    Figure 1.3

    An implementation of Standard C++ includes a set of files called the standard
    library, which includes the file `iostream`, which defines various things, including
    the object `cout`.


    # Terminating Statements


    You’ll notice that the first line of the function ends with a semicolon (;). That’s
    because the line is a *statement*—the basic unit controlling the execution flow.
    All of your statements must end with a semicolon—otherwise, your compiler will
    complain with an error message and your program won’t compile.'
