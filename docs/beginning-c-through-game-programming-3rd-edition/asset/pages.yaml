    # Declaring and Defining Copy Constructors


    Sometimes an object is copied automatically for you. This occurs when an object
    is:


    +   - Passed by value to a function

    +   - Returned from a function

    +   - Initialized to another object through an initializer

    +   - Provided as a single argument to the object’s constructor


    The copying is done by a special member function called the copy constructor.
    Like constructors and destructors, a default copy constructor is supplied for
    you if you don’t write one of your own. The default copy constructor simply copies
    the value of each data member to data members of the same name in the new object—a
    member-wise copy.


    For simple classes, the default copy constructor is usually fine. However, when
    you have a class with a data member that points to a value on the heap, you should
    consider writing your own copy constructor. Why? Imagine a Critter object that
    has a data member that’s a pointer to a string object on the heap. With only a
    default copy constructor, the automatic copying of the object would result in
    a new object that points to the same single string on the heap because the pointer
    of the new object would simply get a copy of the address stored in'
