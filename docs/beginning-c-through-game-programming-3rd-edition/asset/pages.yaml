  md: '# SETTING MEMBER ACCESS LEVELS


    Like functions, you should treat objects as encapsulated entities. This means
    that, in general, you should avoid directly altering or accessing an object’s
    data members. Instead, you should call an object’s member functions, allowing
    the object to maintain its own data members and ensure their integrity. Fortunately,
    you can enforce data member restrictions when you define a class by setting member
    access levels.


    # Introducing the Private Critter Program


    The Private Critter program demonstrates class member access levels by declaring
    a class for critters that restricts direct access to an object’s data member for
    its hunger level. The class provides two member functions—one that allows access
    to the data member and one that allows changes to the data member. The program
    creates a new critter and indirectly accesses and changes the critter’s hunger
    level through these member functions. However, when the program attempts to change
    the critter’s hunger level to an illegal value, the member function that allows
    the changes catches the illegal value and doesn’t make the change. Finally, the
    program uses the hunger-level-setting member function with a legal value, which
    works like a charm. Figure 8.3 shows the results of the program.


    ![](img/34f09be0ed6217c465debc4490197d4f_286_0.png)


    Figure 8.3

    By using a Critter object’s GetHunger() and SetHunger() member functions, the
    program indirectly accesses an object’s m_Hunger data member.'
