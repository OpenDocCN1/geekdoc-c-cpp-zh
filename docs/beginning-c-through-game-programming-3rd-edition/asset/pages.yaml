    Figure 10.1

    `Boss` inherits `Attack()` and `m_Damage` from `Enemy` while defining `SpecialAttack()`
    and `m_DamageMultiplier`.


    One of the many advantages of inheritance is that you can reuse classes you’ve
    already written. This reusability produces benefits that include:


    +   - **Less work.** There’s no need to redefine functionality you already have.
    Once you have a class that provides the base functionality for other classes,
    you don’t have to write that code again.

    +   - **Fewer errors.** Once you’ve got a bug-free class, you can reuse it without
    errors cropping up in it.'
