    \ is private, I can’t access it from code that is not part of the Critter class.\
    \ Again, only code that’s part of Critter can directly access the data member.\n\
    \nI’ve only shown you how to make data members private, but you can make member\
    \ functions private, too. Also, you can repeat access modifiers. So if you want,\
    \ you could have a private section, followed by a public section, followed by\
    \ another private section in a class. Finally, member access is private by default.\
    \ Until you specify an access modifier, any class members you declare will be\
    \ private.\n\n# Defining Accessor Member Functions\n\nAn accessor member function\
