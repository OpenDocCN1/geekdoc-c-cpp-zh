    # QUESTIONS AND ANSWERS


    Q: Why do game companies use C++?


    A: C++ combines speed, low-level hardware access, and high-level constructs better
    than just about any other language. In addition, most game companies have a lot
    invested in C++ resources (both in reusable code and programmer experience).


    Q: How is C++ different than C?


    A: C++ is the next iteration of the C programming language. To gain acceptance,
    C++ essentially retained all of C. However, C++ defines new ways to do things
    that can replace some of the traditional C mechanisms. In addition, C++ adds the
    ability to write object-oriented programs.'
