  md: '# Understanding the ISO Standard


    The ISO standard for C++ is a definition of C++ that describes exactly how the
    language should work. It also defines a group of files, called the standard library,
    that contain building blocks for common programming tasks, such as I/O—getting
    input and displaying output. The standard library makes life easier for programmers
    and provides fundamental code to save them from reinventing the wheel. I’ll be
    using the standard library in all of the programs in this book.


    # Hint


    > The ISO standard is often called the ANSI standard or ANSI/ISO standard. These
    different names involve the acronyms of the various committees that have reviewed
    and established the standard. The most common way to refer to C++ code that conforms
    to the ISO standard is simply Standard C++.


    I used Microsoft’s Visual C++ 2010 Express Edition to develop the programs in
    this book. The compiler that’s a part of this IDE is pretty faithful to the ISO
    standard, so you should be able to compile, link, and run all of the programs
    using some other modern compiler as well. However, if you’re using Windows, I
    recommend using Visual C++.


    # Hint


    > For step-by-step instructions on how to create, save, compile, and run the Game
    Over program using Microsoft Visual C++ 2010 Express Edition, check out Appendix
    A. If you’re using another compiler or IDE, check its documentation.


    # WRITING YOUR FIRST C++ PROGRAM


    Okay, enough theory. It’s time to get down to the nitty-gritty and write your
    first C++ program. Although it is simple, the following program shows you the
    basic anatomy of a program. It also demonstrates how to display text in a console
    window.


    # Introducing the Game Over Program


    The classic first task a programmer tackles in a new language is the Hello World
    program, which displays Hello World on the screen. The Game Over program'
