    # INTRODUCING C++


    C++ is leveraged by millions of programmers around the world. It’s one of the
    most popular languages for writing computer applications—and the most popular
    language for writing big-budget computer games.


    Created by Bjarne Stroustrup, C++ is a direct descendant of the C language. In
    fact, C++ retains almost all of C as a subset. However, C++ offers better ways
    to do things and some brand-new capabilities, too.'
