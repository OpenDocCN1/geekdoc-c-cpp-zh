  md: '# INTRODUCING THE TIC-TAC-TOE GAME


    In this chapter project, you’ll learn how to create a computer opponent using
    a dash of AI (*Artificial Intelligence*). In the game, the player and computer
    square off in a high-stakes, man-versus-machine showdown of Tic-Tac-Toe. The computer
    plays a formidable (although not perfect) game and comes with enough attitude
    to make any match fun. Figure 6.5 shows the start of a match.


    ![](img/34f09be0ed6217c465debc4490197d4f_225_0.png)


    Figure 6.5

    The computer is full of...confidence.


    # Planning the Game


    This game is your most ambitious project yet. You certainly have all the skills
    you need to create it, but I’m going to go through a longer planning section to
    help you get the big picture and understand how to create a larger program. Remember,
    the most important part of programming is planning to program. Without a roadmap,
    you’ll never get to where you want to go (or it’ll take you a lot longer as you
    travel the scenic route).


    # Real World


    > Game designers work countless hours on concept papers, design documents, and
    prototypes before programmers write any game code. Once the design work is done,
    the programmers start their work—more planning. It’s only after programmers write
    their own technical designs that they then begin coding in earnest. The moral
    of this story? Plan. It’s easier to scrap a blueprint than a 50-story building.'
