  md: '```

    cout << "Adding a score.\n";

    scores.push_back(0);  //memory is reallocated to accommodate growth

    cout << "Vector size is:" << scores.size() << endl;

    cout << "Vector capacity is:" << scores.capacity() << endl;

    ```


    Right after I declare and initialize the vector, this code reports that its size
    and capacity are both 10. However, after an element is added, the code reports
    that the vector’s size is 11 while its capacity is 20. That’s because the capacity
    of a vector doubles every time a program reallocates additional memory for it.
    In this case, when a new score was added, memory was reallocated, and the capacity
    of the vector doubled from 10 to 20.


    # Using the reserve() Member Function


    The reserve() member function increases the capacity of a vector to the number
    supplied as an argument. Using reserve() gives you control over when a reallocation
    of additional memory occurs. Here’s an example:


    ```

    cout << "Creating a list of scores.\n";

    vector<int> scores(10, 0);  //initialize all 10 elements to 0

    cout << "Vector size is:" << scores.size() << endl;

    cout << "Vector capacity is:" << scores.capacity() << endl;

    ```


    ```

    cout << "Reserving more memory.\n";

    scores.reserve(20);  //reserve memory for 10 additional elements

    cout << "Vector size is:" << scores.size() << endl;

    cout << "Vector capacity is:" << scores.capacity() << endl;

    ```


    Right after I declare and initialize the vector, this code reports that its size
    and capacity are both 10. However, after I reserve memory for 10 additional elements,
    the code reports that the vector’s size is still 10 while its capacity is 20.


    By using reserve() to keep a vector’s capacity large enough for your purposes,
    you can delay memory reallocation to a time of your choosing.


    # Hint


    > As a beginning game programmer, it’s good to be aware of how vector memory allocation
    works; however, don’t obsess over it. The first game programs you’ll write probably
    won’t benefit from a more manual process of vector memory allocation.'
