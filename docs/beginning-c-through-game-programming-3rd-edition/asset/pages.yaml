- pgno: 291
  md: 'need. If you don’t need to change any data members in a member function, then
    it’s a good idea to declare that member function to be constant. It protects you
    from accidentally altering a data member in the member function, and it makes
    your intentions clear to other programmers.


    # Trap


    Okay, I lied a little. A constant member function can alter a static data member.
    You’ll learn about static data members a bit later in this chapter, in the “Declaring
    and Initializing Static Data Members” section. Also, if you qualify a data member
    with the mutable keyword, then even a constant member function can modify it.
    For now, though, don’t worry about either of these exceptions.


    You can declare a constant member function by putting the keyword const at the
    end of the function header. That’s what I do in Critter with the following line,
    which declares GetHunger() to be a constant member function.


    ```

    int GetHunger() const;

    ```


    This means that GetHunger() can’t change the value of any non-static data member
    declared in the Critter class, nor can it call any non-constant Critter member
    function. I made GetHunger() constant because it only returns a value and doesn’t
    need to modify any data member. Generally, Get member functions can be defined
    as constant.


    # USING STATIC DATA MEMBERS AND MEMBER FUNCTIONS


    Objects are great because each instance stores its own set of data, giving it
    a unique identity. But what if you want to store some information about an entire
    class, such as the total number of instances that exist? You might want to do
    this if you’ve created a bunch of enemies and you want them to fight the player
    based on their total number. For example, if their total number is below a certain
    threshold, you might want the enemies to run away. You could store the total number
    of instances in each object, but that would be a waste of storage space. Plus,
    it would be cumbersome to update all of the objects as the total changes. Instead,
    what you really want is a way to store a single value for an entire class. You
    can do this with a static data member.'
