    # *Assigning Values to Boolean Variables*


    In the following statement I assign `shieldsUp` the value `true`.


    ```

    shieldsUp = true;

    ```


    In my program, this means that the player’s shields are up.


    `shieldsUp` is a `bool` variable, which means it’s a Boolean variable. As such,
    it can represent either `true` or `false`. Although intriguing, you’ll have to
    wait until Chapter 2, “Truth, Branching, and the Game Loop: Guess My Number,”
    to learn more about this kind of variable.


    # Initializing Variables


    You can both declare and assign a value to variables in a single initialization
    statement. That’s exactly what I do next.


    ```

    double engineTemp = 6572.89;

    ```


    This line creates a variable of type `double` named `engineTemp`, which stores
    the value 6572.89.


    Just as you can declare multiple variables in one statement, you can initialize
    more than one variable in a statement. You can even declare and initialize different
    variables in a single statement. Mix and match as you choose!


    # Hint


    > Although you can declare a variable without assigning it a value, it’s best
    to initialize a new variable with a starting value whenever you can. This makes
    your code clearer, plus it eliminates the chance of accessing an uninitialized
    variable, which may contain any value.


    # Displaying Variable Values


    To display the value of a variable of one of the fundamental types, just send
    it to `cout`. That’s what I do next in the program. Note that I don’t try to display
    `shieldsUp` because you don’t normally display `bool` values.'
