    # Trap


    You might notice that while the result of 7.0 / 3.0 (2.33333) includes a fractional
    part, it is still truncated. (The true result would stretch out 3s after the decimal
    point forever.) It''s important to know that computers generally store only a
    limited number of significant digits for floating point numbers. However, C++
    offers categories of floating point numbers to meet the most demanding needs—even
    those of computationally intensive 3D games.


    # Using the Modulus Operator


    In the next statement, I use an operator that might be unfamiliar to you—the modulus
    operator (%). The modulus operator returns the remainder of integer division.
    In this case, 7 % 3 produces the remainder of 7 / 3, which is 1.


    # Understanding Order of Operations


    Just as in algebra, arithmetic expressions in C++ are evaluated from left to right.
    But some operators have a higher precedence than others and are evaluated first,
    regardless of position. Multiplication, division, and modulus have equal precedence,
    which is higher than the precedence level that addition and subtraction share.


    The next line of code provides an example to help drive this home. Because multiplication
    has higher precedence than addition, you calculate the results of the multiplication
    first. So the expression 7 + 3 * 5 is equivalent to 7 + 15, which evaluates to
    22.


    If you want an operation with lower precedence to occur first, you can use parentheses,
    which have higher precedence than any arithmetic operator. So in the next statement,
    the expression (7 + 3) * 5 is equivalent to 10 * 5, which evaluates to 50.


    # Hint


    For a list of C++ operators and their precedence levels, see Appendix B.'
