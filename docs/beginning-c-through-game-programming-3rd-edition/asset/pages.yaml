    # INTRODUCING THE BLACKJACK GAME


    The final project for this chapter is a simplified version of the casino card
    game Blackjack (tacky green felt not included). The game works like this: Players
    are dealt cards with point values. Each player tries to reach a total of 21 without
    exceeding that amount. Numbered cards count as their face value. An ace counts
    as either 1 or 11 (whichever is best for the player), and any jack, queen, or
    king counts as 10.


    The computer is the house (the casino) and it competes against one to seven players.
    At the beginning of the round, all participants (including the house) are dealt
    two cards. Players can see all of their cards, along with their total. However,
    one of house''s cards is hidden for the time being.


    Next, each player gets the chance to take one additional card at a time for as
    long as he likes. If a player’s total exceeds 21 (known as busting), the player
    loses. After all players have had the chance to take additional cards, the house
    reveals its hidden card. The house must then take additional cards as long as
    its total is 16 or less. If the house busts, all players who have not busted win.
    Otherwise, each remaining player’s total is compared to the house’s total. If
    the player’s total is greater than the house’s, he wins. If the player’s total
    is less than the house’s, he loses. If the two totals are the same, the player
    ties the house (also known as pushing). Figure 10.6 shows the game.


    # Designing the Classes


    Before you start coding a project with multiple classes, it is helpful to map
    them out on paper. You might make a list and include a brief description of each
    class. Table 10.1 shows my first pass at such a list for the Blackjack game.


    To keep things simple, all member functions will be public and all data members
    will be protected. Also, I''ll use only public inheritance, which means that each
    derived class will inherit all of its base class members.'
