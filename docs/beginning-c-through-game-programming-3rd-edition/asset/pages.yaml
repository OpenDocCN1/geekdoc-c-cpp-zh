  md: 'To derive classes of your own, follow my example. After the class name in a
    class definition, put a colon followed by an access modifier (such as `public`),
    followed by the name of the base class. It’s perfectly acceptable to derive a
    new class from a derived class, and sometimes it makes perfect sense to do so.
    However, to keep things simple, I’m only going to deal with one level of inheritance
    in this example.


    There are actually a few base class member functions that are not inherited by
    derived classes. They are as follows:


    +   - Constructors

    +   - Copy constructors

    +   - Destructors

    +   - Overloaded assignment operators


    You have to write your own versions of these in the derived class.


    # Instantiating Objects from a Derived Class


    In `main()`, I instantiate an Enemy object and then call its `Attack()` member
    function. This works just as you’d expect. The interesting part of the program
    begins next, when I instantiate a Boss object.


    ```

    Boss boss1;

    ```


    After this line of code, I have a `Boss` object with an `m_Damage` data member
    equal to 10 and an `m_DamageMultiplier` data member equal to 3. How did this happen?
    Although constructors and destructors are not inherited from a base class, they
    are called when an instance is created or destroyed. In fact, a base class constructor
    is called before the derived class constructor to create its part of the final
    object.


    In this case, when a `Boss` object is instantiated, the default `Enemy` constructor
    is automatically called and the object gets an `m_Damage` data member with a value
