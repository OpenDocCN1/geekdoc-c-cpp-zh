- pgno: 249
  md: 'However, the clearest way to declare a pointer is to declare it in its own
    statement, as in the following lines.


    ```

    int* pScore;

    int score;

    ```


    # Initializing Pointers


    As with other variables, you can initialize a pointer in the same statement you
    declare it. That’s what I do next with the following line, which assigns 0 to
    pScore.


    ```

    int* pScore = 0; //declare and initialize a pointer

    ```


    Assigning 0 to a pointer has special meaning. Loosely translated, it means, “Point
    to nothing.” Programmers call a pointer with the value of zero a null pointer.
    You should always initialize a pointer with some value when you declare it, even
    if that value is zero.


    # Hint


    Many programmers assign NULL to a pointer instead of 0 to make the pointer a null
    pointer. NULL is a constant defined in multiple library files, including iostream.


    # Assigning Addresses to Pointers


    Because pointers store addresses of objects, you need a way to get addresses into
    the pointers. One way to do that is to get the memory address of an existing variable
    and assign it to a pointer. That’s what I do in the following line, which gets
    the address of the variable score and assigns it to pScore.


    ```

    pScore = &score; //assign pointer address of variable score

    ```


    I get the address of score by preceding the variable name with &, the address
    of operator. (Yes, you’ve seen the & symbol before, when it was used as the reference
    operator. However, in this context, the & symbol gets the address of an object.)


    As a result of the preceding line of code, pScore contains the address of score.
    It’s as if pScore knows exactly where score is located in the computer’s memory.
    This means you can use pScore to get to score and manipulate the value stored
    in score. Figure 7.2 serves as a visual illustration of the relationship between
    pScore and score.'
