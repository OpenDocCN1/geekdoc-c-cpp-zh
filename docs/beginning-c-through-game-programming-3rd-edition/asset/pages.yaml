  md: '+   - In many ways, pointers act like iterators from the STL. For example,
    just as with iterators, you use pointers to indirectly access an object.

    +   - To declare a pointer, you list a type, followed by an asterisk, followed
    by a name.

    +   - Programmers often prefix pointer variable names with the letter “p” to remind
    them that the variable is indeed a pointer.

    +   - Just like an iterator, a pointer is declared to refer to a value of a specific
    type.

    +   - It’s good programming practice to initialize a pointer when you declare
    it.

    +   - If you assign 0 to a pointer, the pointer is called a null pointer.

    +   - To get the address of a variable, put the address of operator (&) before
    the variable name.

    +   - When a pointer contains the address of an object, it’s said to point to
    the object.

    +   - Unlike references, you can reassign pointers. That is, a pointer can point
    to different objects at different times during the life of a program.

    +   - Just as with iterators, you dereference a pointer to access the object it
    points to with *, the dereference operator.

    +   - Just as with iterators, you can use the -> operator with pointers for a
    more readable way to access object data members and member functions.

    +   - A constant pointer can only point to the object it was initialized to point
    to. You declare a constant pointer by putting the keyword const right before the
    pointer name, as in `int* const p = &i;`.

    +   - You can’t use a pointer to a constant to change the value to which it points.
    You declare a pointer to a constant by putting the keyword const before the type
    name, as in `const int* p;`.

    +   - A constant pointer to a constant can only point to the value it was initialized
    to point to, and it can’t be used to change that value. You declare a constant
    pointer to a constant by putting the keyword const before the type name and right
    before the pointer name, as in `const int* const p = &i;`.

    +   - You can pass pointers for efficiency or to provide direct access to an object.'
