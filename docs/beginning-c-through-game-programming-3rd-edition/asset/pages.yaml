  md: "Here’s the generic form of for loop:\n\n```\nfor (initialization; test; action)\n\
    \    statement;\n```\n\ninitialization is a statement that sets up some initial\
    \ condition for the loop. (For example, it might set a counter variable to 0.)\
    \ The expression test is tested each time before the loop body executes, just\
    \ as in a while loop. If test is false, the program moves on to the statement\
    \ after the loop. If test is true, the program executes statement. Next, action\
    \ is executed (which often involves incrementing a counter variable). The cycle\
    \ repeats until test is false, at which point the loop ends.\n\n# Introducing\
    \ the Counter Program\n\nThe Counter program counts forward, backward, and by\
    \ fives. It even counts out a grid with rows and columns. It accomplishes all\
    \ of this through the use of for loops. Figure 3.1 shows the program in action.\n\
    \n![](img/34f09be0ed6217c465debc4490197d4f_104_0.png)\n\nFigure 3.1\nfor loops\
    \ do all of the counting, while a pair of nested for loops displays the grid.\n\
    \nYou can download the code for this program from the Course Technology website\
    \ (www.courseptr.com/downloads). The program is in the Chapter 3 folder; the filename\
    \ is counter.cpp."
