- pgno: 272
  md: '# Chapter 7 ■ Pointers: Tic-Tac-Toe 2.0


    +   - If you want to pass a pointer for efficiency, you should pass a pointer
    to a constant or a constant pointer to a constant so the object you’re passing
    access to can’t be changed through the pointer.

    +   - A dangling pointer is a pointer to an invalid memory address. Dangling pointers
    are often caused by deleting an object to which a pointer pointed. Dereferencing
    such a pointer can lead to disastrous results.

    +   - You can return a pointer from a function, but be careful not to return a
    dangling pointer.




    **Q:** How is a pointer different from the variable which it points?


    **A:** A pointer stores a memory address. If a pointer points to a variable, it
    stores the address of that variable.


    **Q:** What good is it to store the address of a variable that already exists?


    **A:** One big advantage of storing the address of an existing variable is that
    you can pass a pointer to the variable for efficiency instead of passing the variable
    by value.


    **Q:** Does a pointer always have to point to an existing variable?


    **A:** No. You can create a pointer that points to an unnamed chunk of computer
    memory as you need it. You’ll learn more about allocating memory in this dynamic
    fashion in Chapter 9, “Advanced Classes and Dynamic Memory: Game Lobby.”


    **Q:** Why should I pass variables using references instead of pointers whenever
    possible?


    **A:** Because of the sweet, syntactic sugar that references provide. Passing
    a reference or a pointer is an efficient way to provide access to objects, but
    pointers require extra syntax (like the dereference operator) to access the object
    itself.


    **Q:** Why should I initialize a pointer when I declare it or soon thereafter?


    **A:** Because dereferencing an uninitialized pointer can lead to disastrous results,
    including a program crash.'
