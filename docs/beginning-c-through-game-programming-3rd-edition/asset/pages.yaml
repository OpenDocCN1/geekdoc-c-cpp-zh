    # WORKING WITH DATA MEMBERS AND THE HEAP


    You’ve seen how you can use aggregation to declare data members that store objects,
    but you can also declare data members that are pointers to values on the heap.
    You might use a data member that points to a value on the heap for some of the
    same reasons you would use pointers in other situations. For example, you might
    want to declare a data member for a large 3D scene; however, you might only have
    access to the 3D scene through a pointer. Unfortunately, problems can arise when
    you use a data member that points to a value on the heap because of the way that
    some default object behaviors work. But you can avoid these issues by writing
    member functions to change these default behaviors.


    # Introducing the Heap Data Member Program


    The Heap Data Member program defines a new type of critter with a data member
    that is a pointer, which points to an object stored on the heap. The class defines
    a few new member functions to handle situations in which an object is destroyed,
    copied, or assigned to another object. The program destroys, copies, and assigns
    objects to show that the objects behave as you’d expect, even with data members
    pointing to values on the heap. Figure 9.6 shows the results of the Heap Data
    Member program.'
