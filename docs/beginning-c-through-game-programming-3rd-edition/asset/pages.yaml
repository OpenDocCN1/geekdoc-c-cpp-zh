    before the element referred to by a given iterator. You supply two arguments to
    this version of insert()—the first is an iterator, and the second is the element
    to be inserted. In this case, I inserted "crossbow" into inventory just before
    the first element. As a result, all of the other elements will move down by one.
    This version of the insert() member function returns an iterator that references
    the newly inserted element. In this case, I don’t assign the returned iterator
    to a variable.


    # Trap


