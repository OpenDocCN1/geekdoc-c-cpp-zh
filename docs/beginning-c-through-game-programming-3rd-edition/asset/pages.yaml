    # Hint


    > The fact that base class destructors are called for objects of derived classes
    ensures that each class gets its chance to clean up any part of the object that
    needs to be taken care of, such as memory on the heap.


    # Using Inherited Members


    Next, I call an inherited member function of the `Boss` object, which displays
    the exact same message as `enemy1.Attack()`.


    ```

    boss1.Attack();

    ```


    That makes perfect sense because the same code is being executed and both objects
    have an `m_Damage` data member equal to 10. Notice that the function call looks
    the same as it did for `enemy1`. The fact that `Boss` inherited the member function
    from `Enemy` makes no difference in how the function is called.


    Next, I get `Boss` to pull out its special attack, which displays the message
    `Special Attack inflicts 30 damage points!`


    ```

    boss1.SpecialAttack();

    ```


    The thing to notice about this is that `SpecialAttack()`, declared as a part of
    `Boss`, uses the data member `m_Damage`, declared in `Enemy`. That’s perfectly
    fine. `Boss` inherits `m_Damage` from `Enemy` and, in this example, the data member
    works like any other data member in the `Boss` class.


    # CONTROLLING ACCESS UNDER INHERITANCE


    When you derive one class from another, you can control how much access the derived
    class has to the base class’ members. For the same reasons that you want to provide
    only as much access as is necessary to a class’ members to the rest of your program,
    you want to provide only as much access as is necessary to a class’ members to
    a derived class. Not coincidentally, you use the same access modifiers that you’ve
    seen before—public, protected, and private. (Okay, you haven’t seen protected
    before, but I’ll explain that modifier in the “Using Access Modifiers with Class
    Members” section.)'
