- pgno: 224
  md: '# Assigning a Returned Reference to a Reference


    Next I assign a returned reference to another reference with the following line,
    which takes a reference to the element in position 1 of `inventory` and assigns
    it to `rStr`.


    ```

    string& rStr = refToElement(inventory, 1);

    ```


    This is an efficient assignment because assigning a reference to a reference does
    not involve the copying of an object. Then I send `rStr` to `cout`, and armor
    is displayed.


    # Assigning a Returned Reference to a Variable


    Next I assign a returned reference to a variable.


    ```

    string str = refToElement(inventory, 2);

    ```


    The preceding code doesn’t assign a reference to `str`. It can’t, because `str`
    is a `string` object. Instead, the code copies the element to which the returned
    reference refers (the element in position 2 of `inventory`) and assigns that new
    copy of the `string` object to `str`. Because this kind of assignment involves
    copying an object, it’s more expensive than assigning one reference to another.
    Sometimes the cost of copying an object this way is perfectly acceptable, but
    you should be aware of the extra overhead associated with this kind of assignment
    and avoid it when necessary.


    Next I send the new `string` object, `str`, to `cout`, and shield is displayed.


    # Altering an Object through a Returned Reference


    You can also alter the object to which a returned reference refers. This means
    you can change the hero’s inventory through `rStr`, as in the following line of
    code.


    ```

    rStr = "Healing Potion";

    ```


    Because `rStr` refers to the element in position 1 of `inventory`, this code changes
    `inventory[1]` so it’s equal to "Healing Potion". To prove it, I display the element
    using the following line, which does indeed show `Healing Potion`.


    ```

    cout << inventory[1] << endl;

    ```


    If I want to protect `inventory` so a reference returned by `refToElement()` can’t
    be used to change the vector, I should specify the return type of the function
    as a constant reference.'
