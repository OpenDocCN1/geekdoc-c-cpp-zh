  md: '# Using C++ for Games


    There are a variety of reasons why game programmers choose C++. Here are a few:


    +   - **It’s fast.** Well-written C++ programs can be blazingly fast. One of C++’s
    design goals is performance. And if you need to squeeze out even more performance
    from your programs, C++ allows you to use *assembly language*—the lowest-level,
    human-readable programming language—to communicate directly with the computer’s
    hardware.

    +   - **It’s flexible.** C++ is a multi-paradigm language that supports different
    styles of programming, including *object-oriented programming*. Unlike some other
    modern languages, though, C++ doesn’t force one particular style on a programmer.

    +   - **It’s well-supported.** Because of its long history in the game industry,
    there’s a large pool of assets available to the C++ game programmer, including
    graphics APIs and 2D, 3D, physics, and sound engines. All of this pre-existing
    code can be leveraged by a C++ programmer to greatly speed up the process of writing
    a new game.


    # Creating an Executable File


    The file that you run to launch a program—whether you’re talking about a game
    or a business application—is an *executable file*. There are several steps to
    creating an executable file from C++ *source code* (a collection of instructions
    in the C++ language). The process is illustrated in Figure 1.1.


    +   1. First, the programmer uses an *editor* to write the C++ source code, a
    file that usually has the extension .cpp. The editor is like a word processor
    for programs; it allows a programmer to create, edit, and save source code.

    +   2. After the programmer saves a source file, he or she invokes a C++ *compiler*—an
    application that reads source code and translates it into an *object file*. Object
    files usually have the extension .obj.

    +   3. Next, a linker links the object file to any external files as necessary,
    and then creates the executable file, which generally ends with the extension'
  merge: -1
