  md: '# UNDERSTANDING VECTOR PERFORMANCE


    Like all STL containers, vectors provide game programmers with sophisticated ways
    to work with information, but this level of sophistication can come at a performance
    cost. And if there’s one thing game programmers obsess about, it’s performance.
    But fear not, vectors and other STL containers are incredibly efficient. In fact,
    they’ve already been used in published PC and console games. However, these containers
    have their strengths and weaknesses; a game programmer needs to understand the
    performance characteristics of the various container types so that he can choose
    the right one for the job.


    # Examining Vector Growth


    Although vectors grow dynamically as needed, every vector has a specific size.
    When a new element added to a vector pushes the vector beyond its current size,
    the computer reallocates memory and might even copy all of the vector elements
    to this newly seized chunk of memory real estate. This can cause a performance
    hit.


    The most important thing to keep in mind about program performance is whether
    or not you need to care. For example, vector memory reallocation might not occur
    at a performance-critical part of your program. In that case, you can safely ignore
    the cost of reallocation. Also, with small vectors, the reallocation cost might
    be insignificant so, again, you can safely ignore it. However, if you need greater
    control over when these memory reallocations occur, you have it.


    # Using the capacity() Member Function


    The capacity() vector member function returns the capacity of a vector—in other
    words, the number of elements that a vector can hold before a program must reallocate
    more memory for it. A vector’s capacity is not the same thing as its size (the
    number of elements a vector currently holds). Here’s a code snippet to help drive
    this point home:


    ```

    cout << "Creating a 10 element vector to hold scores.\n";

    vector<int> scores(10, 0); //initialize all 10 elements to 0

    cout << "Vector size is:" << scores.size() << endl;

    cout << "Vector capacity is:" << scores.capacity() << endl;

    ```'
