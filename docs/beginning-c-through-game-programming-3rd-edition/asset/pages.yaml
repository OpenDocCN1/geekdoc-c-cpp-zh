  md: '# Understanding Which Types to Use


    You have many choices when it comes to the fundamental types. So how do you know
    which type to use? Well, if you need an integer type, you’re probably best off
    using int. That’s because int is generally implemented so that it occupies an
    amount of memory that is most efficiently handled by the computer. If you need
    to represent integer values greater than the maximum int or values that will never
    be negative, feel free to use an unsigned int.


    If you’re tight on memory, you can use a type that requires less storage. However,
    on most computers, memory shouldn’t be much of an issue. (Programming on game
    consoles or mobile devices is another story.)


    Finally, if you need a floating point number, you’re probably best off using float,
    which again is likely to be implemented so that it occupies an amount of memory
    that is most efficiently handled by the computer.


    # PERFORMING ARITHMETIC OPERATIONS WITH VARIABLES


    Once you have variables with values, you’ll want to change their values during
    the course of your game. You might want to add a bonus to a player’s score for
    defeating a boss, increasing the score. Or you might want to decrease the oxygen
    level in an airlock. By using operators you’ve already met (along with some new
    ones), you can accomplish all of this.


    # Introducing the Game Stats 2.0 Program


    The Game Stats 2.0 program manipulates variables that represent game stats and
    displays the results. Figure 1.6 shows the program in action.


    You can download the code for this program from the Course Technology website
    (www.courseptr.com/downloads). The program is in the Chapter 1 folder; the filename
    is game_stats2.cpp.


    ```

    // Game Stats 2.0

