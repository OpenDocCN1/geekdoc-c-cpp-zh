    \ really make sense to instantiate a Creature object. It would be great if there\
    \ were a way to indicate that Creature is a base class only, and not meant for\
    \ instantiating objects. Well, C++ lets you define a kind of class just like this,\
    \ called an abstract class.\n\n# Introducing the Abstract Creature Program\n\n\
    The Abstract Creature program demonstrates abstract classes. In the program, I\
