  md: '# Trick


    In the first statement of this section I use what’s called an escape sequence—a
    pair of characters that begins with a backslash (\), which represents special
    printable characters.


    ```

    cout << "\nscore: "     << score << endl;

    ```


    The escape sequence I used is \n, which represents a newline. When sent to cout
    as part of a string, it’s like pressing the Enter key in the console window. Another
    useful escape sequence is \t, which acts as a tab.


    There are other escape sequences at your disposal. For a list of escape sequences,
    see Appendix E.


    # Getting User Input


    Another way to assign a value to a variable is through user input. So next, I
    assign the value of a new variable, fuel, based on what the user enters. To do
    so I use the following line:


    ```

    cin >> fuel;

    ```


    Just like cout, cin is an object defined in iostream, which lives in the std namespace.
    To store a value in the variable, I use cin followed by >> (the extraction operator),
    followed by the variable name. You can use cin and the extraction operator to
    get user input into variables of other fundamental types too. To prove that everything
    worked, I display fuel to the user.


    # Defining New Names for Types


    You can define a new name for an existing type. In fact, that’s what I do next
    in the line:


    ```

    typedef unsigned short int ushort;

    ```


    This code defines the identifier ushort as another name for the type unsigned
    short int. To define new names for existing types, use typedef followed by the
    current type, followed by the new name. typedef is often used to create shorter
    names for types with long names.


    You can use your new type name just like the original type. I initialize a ushort
    variable (which is really just an unsigned short int) named bonus and display
    its value.'
