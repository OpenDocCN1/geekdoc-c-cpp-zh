  md: "You specify a pure virtual function by placing an equal sign and a zero at\
    \ the end of the function header. That’s what I did in Creature with the following\
    \ line:\n\n```\nvirtual void Greet() const = 0;    //pure virtual member function\n\
    ```\n\nWhen a class contains at least one pure virtual function, it’s an abstract\
    \ class. Therefore, Creature is an abstract class. I can use it as the base class\
    \ for other classes, but I can’t instantiate objects from it.\n\nAn abstract class\
    \ can have data members and virtual functions that are not pure virtual. In Creature,\
    \ I declare a data member m_Health and a virtual member function DisplayHealth().\n\
    \n# Deriving a Class from an Abstract Class\n\nWhen you derive a new class from\
    \ an abstract class, you can override its pure virtual functions. If you override\
    \ all of its pure virtual functions, then the new class is not abstract and you\
    \ can instantiate objects from it. When I derive Orc from Creature, I override\
    \ Creature’s one pure virtual function with the following lines:\n\n```\nvoid\
    \ Orc::Greet() const\n{\n    cout << \"The orc grunts hello.\\n\";\n}\n```\n\n\
    This means I can instantiate an object from Orc, which is what I do in main()\
    \ with the following line:\n\n```\nCreature* pCreature = new Orc();\n```\n\nThe\
    \ code instantiates a new Orc object on the heap and assigns the memory location\
    \ of the object to pCreature, a pointer to Creature. Even though I can’t instantiate\
    \ an object from Creature, it’s perfectly fine to declare a pointer using the\
    \ class. Like all base class pointers, a pointer to Creature can point to any\
    \ object of a class derived from Creature, like Orc.\n\nNext, I call Greet(),\
    \ the pure virtual function that I override in Orc with the following line:\n\n\
    ```\npCreature->Greet();\n```\n\nThe correct greeting, The orc grunts hello.,\
    \ is displayed."
