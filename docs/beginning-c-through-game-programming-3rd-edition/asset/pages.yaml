    \n# USING ARRAYS\n\nWhile `string` objects provide a great way to work with a\
    \ sequence of characters, arrays provide a way to work with elements of any type.\
    \ That means you can use an array to store a sequence of integers for, say, a\
    \ high-score list. But it also means that you can use arrays to store elements\
    \ of programmer-defined types, such as a sequence of items that an RPG character\
    \ might carry.\n\n# Introducing the Hero’s Inventory Program\n\nThe Hero’s Inventory\
    \ program maintains the inventory of a hero from a typical RPG. Like in most RPGs,\
    \ the hero is from a small, insignificant village, and his father was killed by\
    \ an evil warlord. (What’s a quest without a dead father?) Now that the hero has\
