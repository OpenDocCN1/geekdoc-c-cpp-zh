    \ fun you've ever had with text!\\n\\n\";\n    cout << \"Here's how to play the\
    \ game...\\n\";\n}\n```\n\n> Trap\n> A function definition must match its prototype\
    \ on return type and function name; otherwise, you’ll generate a compile error.\n\
    \n# Calling Functions\n\nYou call your own functions the same way you call any\
    \ other function—by writing the function’s name followed by a pair of parentheses\
    \ that encloses a valid list of arguments. In main(), I call my newly minted function\
    \ simply with:\n\n```\ninstructions();\n```\n\nThis line invokes instructions().\
    \ Whenever you call a function, control of the program jumps to that function.\
    \ In this case, it means control jumps to instructions() and the program executes\
    \ the function’s code, which displays the game instructions. When a function finishes,\
    \ control returns to the calling code. In this case, it means control returns\
    \ to main(). The next statement in main() (return 0;) is executed and the program\
    \ ends."
