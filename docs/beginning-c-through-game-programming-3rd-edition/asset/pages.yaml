    Q: I don’t have to include a file to use int or char types, so why do I have to
    include the string file to use strings?


    A: int and char are built-in types. They’re always accessible in any C++ program.
    The string type, on the other hand, is not a built-in type. It’s defined as part
    of the standard library in the file string.


    Q: How did C-style strings get their name?


    A: In the C programming language, programmers represent strings with arrays of
    characters terminated by a null character. This practice carried over to C++.
    After the new string type was introduced in C++, programmers needed a way to differentiate
    between the two. Therefore, the old method was dubbed C-style strings.


    Q: Why should I use string objects instead of C-style strings?


    A: string objects have advantages over C-style strings. The most obvious is that
    they are dynamically sizeable. You don’t have to specify a length limit when you
    create one.


    Q: Should I ever use C-style strings?


    A: You should opt for string objects whenever possible. If you’re working on an
    existing project that uses C-style strings, then you might have to work with C-style
    strings.


    Q: What is operator overloading?


    A: It’s a process that allows you to define the use of familiar operators in different
    contexts with different but predictable results. For example, the + operator that
    is used to add numbers is overloaded by the string type to join strings.


    Q: Can’t operator overloading be confusing?

    A: It’s true that by overloading an operator you give it another meaning. But
    the new meaning applies only in a specific new context. For example, it’s clear
    in'
