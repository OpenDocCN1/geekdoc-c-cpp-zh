  md: '+   - **Cleaner code.** Because the functionality of base classes exist only
    once in a program, you don’t have to wade through the same code repeatedly, which
    makes programs easier to understand and modify.


    Most related game entities cry out for inheritance. Whether it’s the series of
    enemies that a player faces, squadrons of military vehicles that a player commands,
    or an inventory of weapons that a player wields, you can use inheritance to define
    these groups of game entities in terms of each other, which results in faster
    and easier programming.


    # Introducing the Simple Boss Program


    The Simple Boss program demonstrates inheritance. In it, I define a class for
    lowly enemies, Enemy. From this class, I derive a new class for tough bosses that
    the player has to face, Boss. Then, I instantiate an Enemy object and call its
    Attack() member function. Next, I instantiate a Boss object. I’m able to call
    Attack() for the Boss object because it inherits the member function from Enemy.
    Finally, I call the Boss object’s SpecialAttack() member function, which I defined
    in Boss, for a special attack. Since I define SpecialAttack() in Boss, only Boss
    objects have access to it. Enemy objects don’t have this special attack at their
    disposal. Figure 10.2 shows the results of the program.


    ![](img/34f09be0ed6217c465debc4490197d4f_355_0.png)


