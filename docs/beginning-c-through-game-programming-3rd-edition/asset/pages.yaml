- pgno: 348
  md: '+   - A memory leak is an error in which memory that has been allocated becomes
    inaccessible and can no longer be freed. Given a large enough leak, a program
    might run out of memory and crash.

    +   - A destructor is a member function that’s called just before an object is
    destroyed. If you don’t write a destructor of your own, the complier will supply
    a default destructor for you.

    +   - The copy constructor is a member function that’s invoked when an automatic
    copy of an object is made. A default copy constructor is supplied for a class
    if you don’t write one of your own.

    +   - The default copy constructor simply copies the value of each data member
    to data members with the same names in the copy, producing a member-wise copy.

    +   - Member-wise copying can produce a shallow copy of an object, in which the
    pointer data members of the copy point to the same chunks of memory as the pointers
    in the original object.

    +   - A deep copy is a copy of an object that has no chunks of memory in common
    with the original.

    +   - A default assignment operator member function, which provides only member-wise
    duplication, is supplied for you if you don’t write one of your own.

    +   - The this pointer is a pointer that all non-static member functions automatically
    have; it points to the object that was used to call the function.


    # QUESTIONS AND ANSWERS


    Q: Why should you use aggregation?

    A: To create more complex objects from other objects.


    Q: What is composition?

    A: A form of aggregation in which the composite object is responsible for the
    creation and destruction of its object parts. Composition is often called a “uses
    a” relationship.'
