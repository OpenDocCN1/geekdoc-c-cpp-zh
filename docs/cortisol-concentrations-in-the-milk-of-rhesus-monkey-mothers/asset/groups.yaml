    # Discussion


    In this study, we have confirmed a role of the *CLOCK* gene in body weight regulation.
    Specifically, four out of five *CLOCK* SNPs genotyped, that is rs3749474, rs4864548,
    rs1464490 and rs1801260, were significantly associated with obesity parameters,
    and a trend was found for the fifth one (rs4580704). We have also shown that *CLOCK*
    rs1801260 was associated with response to a dietary and behavioural weight loss
    programme. Specifically, carriers of the G variant may be at higher risk for obesity,
    and they were less responsive to a weight loss intervention.


    In this study, we have replicated previous findings showing the association between
    different *CLOCK* SNPs and obesity, particularly for rs4864548 and rs4580704.11,12
    In addition, we have shown that minor allele carriers carrying at least one copy
    of the T allele at the *CLOCK* rs3749474 displayed a significantly higher degree
    of obesity (weight and BMI) and abdominal obesity (waist circumference) than major
    allele carriers. This SNP was selected because of its location in the 3′-UTR.
    The mechanism through which this particular SNP is associated with obesity could
    be attributed to changes in mRNA structure. Indeed, our analysis suggests that
    this one-base change (T/C) in the *CLOCK* 3′-UTR transforms the structure of this
    particular region (Figure 2). The 3′-UTR is characterized by sequences such as
    SECIS or AU-rich elements (AREs), which are recognised by particular proteins
    that exert an effect on mRNA stability or location in the cell. Although specific
    binding sites are not elucidated in the analysis presented here, the difference
    in the predicted allele-specific structures is consistent with the hypothesis
    that this SNP strongly affects mRNA structure and stability. On the other hand,
    this SNP is in complete LD with rs4864548 (Figure 1), which is located in the
    promoter region. Variation in the promoter activity may also explain the results
    we observed.


    These findings support the evolving view that the circadian oscillator has an
    important role in the development of obesity and metabolic syndrome.7 Recently,
    several studies have suggested that the disruption of the circadian system may
    contribute to obesity.26 Shift work, sleep deprivation and exposure to bright
    light at night are related to increased adiposity.27 Studies performed in animal
