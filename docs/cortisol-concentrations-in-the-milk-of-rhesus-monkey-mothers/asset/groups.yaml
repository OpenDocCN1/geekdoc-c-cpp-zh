    ## 展望：营养基因组学


    代谢：尽管母亲在哺乳儿子时血液中循环的皮质醇并不比哺乳女儿时更多。目前尚不清楚这种与皮质醇相关的性别差异是否具有功能。但已有线索：摄入含高水平该激素乳汁的幼年猕猴会表现出大胆行为，而乳汁中的皮质醇似乎对雌性猕猴幼崽没有影响³。这是否在人类中有对应现象，仍有待确定。


    人类泌乳研究的第二大转变在于纳入新工具，以回答传统问题——例如比较母乳喂养与配方奶喂养的效果——并应对进化与功能问题。与其他胎盘哺乳动物的乳汁相比，人乳更稀，但它确实含有一些令人惊讶的成分。例如，高通量质谱法的进步揭示了200多种人乳寡糖（HMO）的存在。加利福尼亚大学戴维斯分校的分析化学家Carlito
    Lebrilla发现，母亲似乎各自产生约100种HMO的个体化组合——但没有人弄清楚为什么不同母亲会产生不同的HMO组合，甚至不清楚每个孩子得到的是否为同一组HMO。


    尽管HMO属于碳水化合物，但它们似乎并不为婴儿提供营养。相反，它们喂养某些肠道细菌，使这些细菌比其他菌种更具竞争优势。“孩子出生后，其肠道会迅速被病原菌定植，”Lebrilla说。“然而，随着孩子摄入人乳，菌群会转变为有益菌种。”婴儿双歧杆菌（Bifidobacterium
    infantis）可预防腹泻，尤其擅长代谢泌乳早期大量存在的小分子量HMO⁴。因此，母乳使婴儿双歧杆菌在建立肠道菌群方面比其他菌种更具优势。“所以，母亲通过她的HMO‘选择’了要在婴儿肠道中生长的特定细菌，”Lebrilla说。


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_6_0.png)


    此外，一些HMO可以直接抑制有害细菌和病毒。例如，某些HMO可阻断空肠弯曲杆菌（细菌性腹泻最常见的原因）与肠黏膜的结合，从而抑制致病过程⁵。


    人乳还会将一些微生物直接递送到肠道。母乳中含有来自母亲肠道的数种乳酸菌，据认为这些乳酸菌会在白细胞内到达她的乳腺。其中大多数菌种通过分泌过氧化氢和被称为细菌素的化合物来抑制病原菌。


    过去十年间，人乳中存在的免疫因子清单大幅扩展。长期以来，人们认为母乳仅通过分泌型免疫球蛋白A形式的母体抗体为婴儿提供被动免疫。然而，新发现的一批免疫调节蛋白可能在促进和调节婴儿自身免疫系统的发育。尤其令人感兴趣的是细胞因子，它们通过细胞间信号传导来协调免疫系统。


    甚至有证据表明，母乳会影响婴儿肠道细胞的基因表达。在一项初步研究中，伊利诺伊大学儿科营养学家Sharon Donovan和得克萨斯A&M大学生化学家Robert
    Chapkin从几名3个月大婴儿脱落的肠道细胞中提取了RNA。他们评估了母乳喂养婴儿与配方奶喂养婴儿之间RNA表达的统计学差异。若干有变化的基因被鉴定为推测的主控基因，这些基因控制其他基因的表达。其中大多数基因编码与血管生成和伤口修复相关的转录因子——包括EPAS1，该基因在母乳喂养婴儿的肠道细胞中转录量是原来的三倍¹。


    ### 聪明宝宝


    **母乳会让你更聪明吗？**


    2002年末至2005年春季，13,889名约六岁的白俄罗斯儿童参加了智商测试，并由教师评估其阅读和写作技能。其中约一半儿童的母亲曾在世界卫生组织（WHO）一项名为“爱婴医院倡议”的项目下被鼓励母乳喂养。结果，这些母亲纯母乳喂养至孩子3个月大的可能性是其他母亲的七倍。


    这项名为“母乳喂养促进干预试验（PROBIT）”的研究结果显示，母亲参与WHO倡议的6岁儿童从教师那里获得更好的学业评分，智商分数平均高5.9分¹⁰。“PROBIT发现生命第一年有许多健康益处，”加拿大蒙特利尔麦吉尔大学的流行病学家Michael
    Kramer说，“但从长期看，唯一的差异是认知能力。”


    没有人十分确定是什么造成了这种智力提升。但杜克大学心理学家Avshalom Caspi在2007年的一项研究中确定了一个候选因素：一个似乎介导人乳对大脑发育影响的基因¹¹。Caspi及其同事检索了京都基因与基因组百科全书（KEGG）数据库中参与长链多不饱和脂肪酸代谢的基因。这些脂肪酸与神经元发育的多个方面有关。其中两种脂肪——二十二碳六烯酸（DHA）和花生四烯酸（AA）——存在于人母乳中，但不存在于牛乳或大多数婴儿配方奶粉中。


    KEGG检索在11号染色体上鉴定出一个名为FADS2的基因，它既受膳食AA和DHA调控，也编码一种催化这两种酸代谢的酶。FADS2基因的一个特定变体存在于该研究超过90%的队列中。研究人员发现，只有携带这一特定FADS2变体的母乳喂养婴儿表现出智商优势。该研究暗示，脂肪酸代谢可能是母乳喂养与智商之间缺失环节的一部分。据估计，这一FADS2变体可解释4.1个智商点的差异，这在很大程度上解释了PROBIT试验中发现的5.9个智商点差异。


    测试表明母乳喂养儿童智商更高。


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_6_1.png)


    Donovan和Chapkin的研究首次提供证据表明，富含天然细菌的母乳会影响婴儿基因表达，但Donovan提醒不要过度解读他们的发现。然而，随着益生菌越来越普遍地用作配方奶成分，这很可能是一个不断扩大的研究领域。“我们不知道这些益生菌可能如何影响基因表达，”Donovan说。


    多年来，“母乳与配方奶”之争已变得两极分化，本文联系过的几位研究人员抱怨说，母乳喂养倡导组织或配方奶公司过去曾夸大其研究结果。Donovan最近的基因表达研究由一家配方奶制造商资助，但她正在申请美国国立卫生研究院的资助以开展进一步研究，以避免商业资助带来的批评。


    ### 健康争议


    研究人员试图厘清用婴儿配方奶而非母乳喂养的影响。“绝大多数研究倾向于认为母乳更好，而非同等，但证据质量参差不齐，”在伦敦大学学院研究人类生态学的Jonathan
    Wells说。“人乳许多公认的益处与避免病原体有关。虽然与在发展中国家相比，这些病原体在医疗更发达社会中对婴儿的危险性可能更低，但母乳仍为所有婴儿提供益处。一致发现，母乳喂养可保护早产儿免患坏死性小肠结肠炎（部分肠组织死亡），并保护足月儿免患腹泻和耳部感染。”


    对日后健康的影响在数据中不那么明显，尽管已观察到配方奶喂养与2型糖尿病和炎症性肠病之间的关联。一些荟萃分析报告称，母乳喂养可将儿童学龄期肥胖的几率降低约20%。但这些结果并非决定性结论。最大的母乳喂养试验——母乳喂养促进干预试验（PROBIT）——发现，两组六岁半白俄罗斯儿童的胖瘦程度没有差异，其中一组在引入配方奶前接受母乳喂养的时间长得多²。


    ### 人乳中含有什么


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_7_0.png)


    这些组之间哮喘或过敏的患病率也没有差异³。然而，PROBIT确实显示了母乳喂养与智力之间有趣的联系（见“聪明宝宝”，第S6页）。


    母乳喂养与智商之间的关联此前已有报道，但使PROBIT结果重要的是其数据集规模。要消除混杂因素，非常大的样本量至关重要。肥胖和智商等特征在各富裕国家的差异模式，常与母亲母乳喂养倾向相似。在发达国家，较富裕女性更可能母乳喂养——但她们通常也更苗条、受教育程度更高，并花更多时间与婴儿说话。


    配方奶中的某些成分可能导致日后体重问题。欧洲儿童肥胖项目的结果支持“早期蛋白质假说”，该假说认为标准婴儿配方奶中较高水平的蛋白质会使身体在日后变得更胖⁴。


    ### 新生儿人乳配方——第2周起


    **成熟乳**


    为生长提供营养！


    - 更多乳汁

    - 更少脂肪

    - 更少乳清蛋白


    **方法**


    - HMO†含量应降至初始水平的一半。IL-1β、IL-6、维生素和类胡萝卜素也大幅减少。

    - 维持乳糖、IFN-γ和酪蛋白的浓度。


    †人乳寡糖


    该项目将1,000名欧洲婴儿随机分配接受高蛋白浓度配方奶（标准配方奶）、低蛋白浓度配方奶（接近人乳蛋白质含量）或母乳。结果是：与高蛋白组不同，低蛋白组并不比母乳喂养对照组更胖。


    婴儿第一餐的多样成分对其发育有影响，而无论我们如何调整配方奶的组成，它始终会缺乏人乳的许多微量成分。随着研究识别出这些物质，它们的作用似乎越来越超出直接营养益处：向婴儿传递关于环境乃至母亲周围社会结构的信息，这影响她饮食的丰富程度和体力活动水平，从而也影响她的乳汁。


    Wells认为，人类幼崽应被视为必须适应母亲周围环境，而非更广阔的世界。事实上，母乳中存在如此多生物活性分子，意味着母乳喂养是一项赋予母亲能力的行为。他补充说：“我们对母乳细节了解得越多，就越意识到男性通过非遗传途径影响后代的机会很小。母亲则拥有非常丰富的机会。”
    ■


    *Anna Petherick* 是布宜诺斯艾利斯的一名记者。


    - 1. LeBlanc, J. G. et al. *Genomics and Human Genetics* **11**, 219–238 (2010).

    - 2. Powe, C. E. et al. *Am. J. Hum. Biol.* **22**(1), 50–54 (2010).

    - 3. Sullivan, E. C. et al. *Developmental Psychology* DOI: 10.1038/jp.2043 (2010).

    - 4. Ward, R. E. et al. *Appl. Environ. Microbiol.* **72**(6), 4497–4499 (2006).

    - 5. Ruiz-Palacios, G. M. et al. *J. Biol. Chem.* **278**(15), 14112–14120 (2003).

    - 6. Chapkin, R. S. et al. *Am. J. Physiol. Gastrointest. Liver Physiol.* **296**,
    G892–G900 (2009).

    - 7. Kramer, M. S. et al. *Am. J. Clin. Nutr.* **86**, 1717–1721 (2007).

    - 8. Kramer, M. S. et al. *Br. Med. J.* **301**, 136–139 (2009).

    - 9. Koletzko, B. et al. *Adv. Exp. Med. Biol.* **646**, 15–29 (2009).

    - 10. Kramer, M. S. et al. *Arch. Gen. Psychiatry* **65**(5), 578–584 (2008).

    - 11. Caspi, A. et al. *Proc. Natl. Acad. Sci. USA* **104**(47), 18860–18865 (2007).

