    分别为 9 和 8；P = 0.07）；雄性为（7.40 ± 0.21 对 对照组 7.30 ± 0.20 g；n 分别为 9 和 9；P = 0.74）。在女孩中，脂肪堆积⁸,¹⁵和胰岛素抵抗¹⁶与其肥胖父亲的情况非常相似。由于一项初步研究发现雌性后代而非雄性后代的葡萄糖耐量显著受损（S.F.N.
    和 M.J.M.，未发表数据），我们在雌性断奶并改用对照饮食后进一步评估了它们。父代HFD未改变雌性后代的体重、特定生长率、能量摄入（图2a–c）或能量效率（未显示）。


    在人类中，父代脂肪堆积可预测其月经初潮前女儿的脂肪堆积¹⁵。在这里，父代HFD未改变成年雌性后代的脂肪堆积、肌肉量、空腹血浆瘦素、甘油三酯或非酯化脂肪酸（NEFA）浓度（表1）。要么肥胖可能较晚出现，要么它可能不会通过父系在啮齿动物中传递，正如对营养不良¹⁷和HFD喂养¹²祖母的后代所报道的那样。


    接下来，我们评估了雌性大鼠后代的葡萄糖耐量及其两个关键决定因素：胰岛素分泌和敏感性。父代HFD未改变雌性后代的空腹血糖（图2d、f）或血浆胰岛素（图2e、g），但在6周龄葡萄糖耐量试验期间增加了血糖升幅（峰值
    13.6 ± 0.3 对 12.3 ± 0.4 mM；P = 0.043）并降低了胰岛素分泌（峰值 0.24 ± 1.4 对 0.25 ± 0.4 mM；P
    = 0.043）（图2d、e）。在12周龄时观察到类似模式（图2f、g），但父代HFD后代的葡萄糖耐量进一步受损，表现为葡萄糖峰值更大（较对照组 +10%
    至 +23%）以及葡萄糖耐量试验期间葡萄糖曲线下面积增加，AUCglucose（+9% 至 +19%）。HFD父代后代在葡萄糖负荷后前30分钟内的胰岛素分泌（胰岛素分泌
    AUC₍₀–₃₀ min₎）减半（38.7 ± 5.8 对 86.8 ± 7.3 ng ml⁻¹；P = 0.004）；但其胰岛素抵抗指数和胰岛素耐量试验中的反应未改变（图2h、i）。


    在6周时检查时，我们检查了胰岛和β细胞丰度，并对分离的胰岛进行全基因组微阵列分析，以探索胰岛素分泌受损的机制。父代HFD降低了后代的相对胰岛面积（−23%；P
