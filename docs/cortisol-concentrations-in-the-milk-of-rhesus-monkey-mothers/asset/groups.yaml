    \n![](img/8e929f63d67ad563cea21a4a5b22eea4_2_0.png)\n\n### 跨学科研究\n\n## 餐桌上的大科学\n\
    \n*研究人员正在采用生物信息学和药物研发的工具，来研究和解读关于饮食与基因相互作用且不断增长的数据。*\n\n**作者：LUCAS LAURSEN**\n\
    \nJosé Ordovas 在西班牙马德里一家气氛慵懒的咖啡馆里啜饮薄荷茶。他一边查看两部手机，一边确认接下来的预约。交谈中，他在西班牙语和英语之间自如切换，以找到恰当的表达。如果这位遗传学家看起来与其他顾客不在同一频率上，他可以归咎于时差：他刚从波士顿飞来，那里现在是凌晨5点。这是他本月第三次海外之行，但\
    \ Ordovas 辩称，他从任职的塔夫茨大学频繁前往欧洲并没有不良影响。他说：“对我来说，时差不成问题。我在家时反正也会凌晨4点起来给欧洲打电话，然后又会熬夜与加利福尼亚通话。”\n\
    \nOrdovas 体现了“大科学”方法的忙碌喧嚣，这种方法在过去十年里改变了营养研究。这个领域曾局限于小型研究团队，研究单一营养素——如特定维生素或蛋白质——对几十名志愿者的影响；如今它正采用为遗传学和药物研究开发的重量级工具。它还有一个朗朗上口的名字：营养基因组学。研究人员越是了解我们的基因如何与饮食相互作用，就越能体会跨学科方法所带来的更深洞察。这类知识可能带来突破，帮助我们理解糖尿病和心血管疾病的风险因素（见第S10页“可食用的建议”），或者例如改进减重饮食的设计。\n\
    \n营养基因组学开始揭示，一个人的饮食不只是其摄入的卡路里数量，或蛋白质与碳水化合物或脂肪的比例。这些固然重要，但把人体代谢比作需要特定类型和数量燃料的汽车发动机，在全基因组分析时代已站不住脚。营养研究人员正意识到，我们的饮食不只是点燃活塞。就好像我们摄入的燃料能够从发动机的燃烧室伸出来——通过掌管我们代谢的遗传通路——在比赛途中调整发动机。\n\
    \n把这些细微调整乘以人类基因组每个基因中所有可能的突变——总共或许有1000万处微调——你就能大致了解 Ordovas 任务的规模。他说：“实现这一概念的唯一途径就是大科学。”\n\
    \nOrdovas 研究食物如何影响大量人群的胆固醇和其他心血管健康指标。“你选取大量具有良好特征描述的个体\n\n**NATURE.COM** 欲了解更多关于大科学如何塑造营养基因组学的内容，请访问\
    \ [go.nature.com/4qL2jY](http://go.nature.com/4qL2jY)\n"
