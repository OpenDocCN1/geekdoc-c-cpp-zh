    **INTERDISCIPLINARY RESEARCH**


    # # Big science at the table


    *Researchers are adopting the tools of bioinformatics and pharmaceuticals to study
    and interpret the ever-growing body of data on the interplay between diet and
    genes.*


    **BY LUCAS LAURSEN**


    José Ordovas sips a mint tea in a languid café in Madrid, Spain. His eyes scan
    two mobile phones as he confirms his next appointments. In conversation, he switches
    effortlessly between Spanish and English to find the right expressions. If the
    geneticist seems to be moving on a different wavelength from the other patrons,
    he could blame it on the jet lag: he has just flown from Boston where it''s now
    5am. This is his third overseas trip this month, but Ordovas contends his frequent
    visits from Tufts University, where he''s based, to Europe have no adverse effects.
    “For me the time difference doesn''t matter. I''m up at 4am to make calls to Europe
    when I''m home anyway, and then I''m up late on calls to California,” he says.


    Ordovas embodies the hustle and bustle of the ‘big science’ approach that has
    changed


    nutrition research in the past decade. This field, once confined to small groups
    of researchers studying the effects of single nutrients — such as particular vitamins
    or proteins — on a few dozen volunteers, is now adopting the heavyweight tools
    developed for genetics and pharmaceutical research. It also has a catchy name:
    nutrigenomics. And the more that researchers learn how our genes interact with
    our diet, the more they appreciate the deeper insight gained by an interdisciplinary
    approach. Such knowledge could lead to breakthroughs in our understanding of risk
    factors for diabetes and cardiovascular disease (see Edible advice, page S10)
    or, for example, improve the design of weight-loss diets.


    Nutrigenomics is starting to reveal that a person''s diet is more than the number
    of calories they eat or the ratio of proteins to carbohydrates or fats. Those
    are important, but the analogy of human metabolism as a car engine that requires


    a certain type and amount of fuel does not hold up in the age of whole-genome
    analysis. Nutrition researchers are realizing that our diet does more than just
    fire our pistons. It is as if the fuel we consume can reach out from the combustion
    chambers in the engine — through the genetic pathways that govern our metabolism
    — and tune the engine mid-race.


    Multiply those fine adjustments by every possible mutation in each gene of the
    human genome, perhaps 10 million tweaks in total, and you have an idea of the
    scale of Ordovas’ task. “The only way to realize this concept is via big science,”
    he says.


    Ordovas studies how food influences cholesterol and other cardiovascular health
    indicators in large groups of people. “You take large numbers of individuals with
    a well-characterized


    **NATURE.COM** For more on how big science is shaping nutrigenomics [go.nature.com/4qL2jY](http://go.nature.com/4qL2jY)'
