    - **目的：** 研究CLOCK的五个候选多态性是否与人体测量、代谢指标以及基于地中海饮食的行为减重计划的体重减轻相关。\n- **方法：** 研究纳入了500名年龄20–65岁、在肥胖专科门诊就诊的超重/肥胖受试者。分析了人体测量、生化和膳食摄入值。评估了该计划的有效性以及28周治疗期间的体重减轻进展。\n\
    - **结果：** 选定的五个CLOCK SNP中有四个与肥胖变量显著相关（P < 0.05）。rs1801260 CLOCK的遗传变异与基线肥胖相关，并影响体重减轻。携带变异等位基因（G）的患者体重减轻显著少于野生型（P\
    \ = 0.008）。重复测量分析显示，rs1801260 CLOCK变异随时间推移的体重减轻存在显著差异（P = 0.038）。G等位基因携带者在减重方面比非携带者面临更大困难。在该特定多态性中，短时间睡眠者（每天≤6小时）在次要等位基因携带者中的频率高于非携带者（59%对41%；P\
    \ < 0.05）。CLOCK多态性与饮食治疗完成时总血浆胆固醇的显著差异也相关（P < 0.05）。\n- **结论：** 我们重复了先前研究，显示CLOCK基因多态性与肥胖之间存在关系。CLOCK\
