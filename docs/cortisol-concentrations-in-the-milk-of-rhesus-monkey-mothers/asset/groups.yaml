    ### Islet isolation.


    Islets were harvested by standard techniques with cannulation of the pancreatic
    duct of anaesthetized rats^27 after an overnight fast.


    ### Islet transcriptomics.


    Affymetrix probe-set data were normalized using the robust multi-array average
    (RMA) method^28, which can yield attenuated estimates of differential expression
    for genes at low expression levels, albeit with high precision. Gene expression
    levels were compared using one-way ANOVA. This yielded 77, 642 and 2,492 differentially
    expressed genes at unadjusted P < 0.001, P < 0.01 and P < 0.05 levels, respectively.
    Differentially expressed genes (P < 0.01) were functionally annotated according
    to gene ontology terms and enriched terms were calculated using DAVID^29 (Supplementary
    Fig. 1). In addition, we hierarchically clustered^29 differentially expressed
    genes based on Euclidean distance to look for possible co-regulated pathways affecting
    islet metabolism. We also mapped differentially expressed genes at P < 0.05 to
    KEGG^30.


    ### Quantitative RT-PCR.


    Total islet RNA (one offspring per father; n = 5, HFD; n = 5, control), extracted
    using miRNeasy Mini kit (Qiagen), was used as a template for complementary DNA
    synthesis, using SuperScript III first strand synthesis (Invitrogen) with random
    hexamers. mRNA expression was determined using quantitative RT–PCR (Stratagene
    Mx3000P; Agilent) using primer sequences summarized in Supplementary Table 4 and
    Platinum SYBR Green SuperMix UDG (Invitrogen), normalized against β-actin.


    ### Molecular network generation using Ingenuity pathways analysis.


    Networks were generated through Ingenuity pathways analysis (Ingenuity Systems,
    http://www.ingenuity.com). Briefly, differentially expressed genes at P < 0.01
    or P < 0.05 and corresponding fold changes were used; the number of networks and
    eligible molecules per network is limited to 25 and 35, respectively. Networks
    were algorithmically generated based on their connectivity and ranked by score
    (negative exponent of the right-tailed Fisher''s exact test result). Molecules
    are represented as nodes, and the biological relationship between two nodes as
    an edge (line). Nodes are displayed using various shapes that represent the functional
    class of the gene product, whereas edges describe the nature of the relationship
    between the nodes, as defined in Ingenuity Systems.


    ### DNA methylation analysis by bisulfite sequencing.


    Bisulfite treatment was performed as described^40. One microgram of NaOH-denatured
    DNA was embedded in 2% low-melting-point agarose solution; bisulfite solution
    (Sigma) was added, followed by 4 h of incubation at 50 °C under light exclusion.
    Treatment was terminated with the Wizard DNA Clean-Up System (Promega) and DNA
    was eluted with 50 μl of 1 mM NaOH. PCR amplification was performed using the
    primers: 5′-TTTAAAATTTTAAATTTAAAATTGGAGG-3′ (forward), 5′-AATTAAAAAACCCCTAAAATTCAAAATACTAAC-3′
    (reverse). The obtained PCR fragments were purified using MinElute Gel Extraction
    Kit (Qiagen) and cloned into pCR-TOPO vector using TOPO TA cloning Kit (Invitrogen).
    Individual clones were grown and plasmids purified using PureLink Miniprep Kit
    (Invitrogen). For each, eight to nine clones were sequenced using T7 primer on
    an ABI 3730xl DNA Analyzer platform at the Ramaciotti Centre. Results were analysed
    using MethTools 2.0.


    ### Statistical analysis.


    Results are expressed as mean ± s.e.m. P < 0.05 was considered statistically significant.


