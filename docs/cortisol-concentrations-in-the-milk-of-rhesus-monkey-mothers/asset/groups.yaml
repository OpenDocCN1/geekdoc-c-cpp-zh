    \n# # Edible advice\n\n*Diet-related illnesses are some of the biggest killers\
    \ today. Can we tailor our food intake to prevent these diseases? Large international\
    \ projects are underway to find out.*\n\n**BY FAROOQ AHMED**\n\n“Too much tea\
