    criterion. However, in tables, untransformed means are presented. Distributions
    of frequencies of categorical variables were analyzed using the χ² test of independence.
    The association of genotypes with height was tested by applying a linear regression
    model, after controlling for the effects of several potential confounders, such
    as age, gender and diary intake, which are known from the available literature
    for their effects on height. The selection of each confounder was based on Pearson’s
    coefficient (P < 0.05). Interaction terms between genotypes and dairy intake were
    also tested through linear regression analysis. All statistical analyses were
    performed using SPSS 13.0 for Windows (SPSS Inc., Chicago, IL, USA).


    # Blood sampling


    A volume of 20 ml of venous blood was collected after an overnight fast (≥10 h).
    The samples were placed in plain tubes as well as ethylenediaminetetraacetic acid
    (EDTA)-containing tubes as separate aliquots, one for serum and one for plasma.
    Plasma was immediately separated by centrifugation (1800 g, 10 min, 4°C) and aliquots
    were stored at −80°C until assayed. DNA extraction was performed by the salting-out
    procedure (Miller et al., 1988). IGF2 rs680 polymorphism was performed by the
    TaqMan assay. Briefly, 5 ng/μl of each sample of DNA was used for the PCR. The
    forward and reverse primers, and fluorescntly labelled VIC and FAM probes were
    ordered from Applied Biosystems (Foster City, California, USA: www.appliedbiosystems.com).
    A master mix was prepared in a bigue (Sterilin, London, UK) using the following
    reagents: Sigma Jump Start Taq Ready Mix for High Throughput # D644Z-(2000RXN)
    (Sigma-Aldrich, Gillingham, Dorset, UK). A volume of 5 μl of the master mix was
    added to each of the 384 wells of the reaction plate using a Finnpipette multichannel
    dispenser (Life Sciences, Basingstoke, UK). An optical adhesive film (Applied
    Biosystems) was used to seal the plate. The plate was then centrifuged at 1000
    r.p.m. for 1 min. Each plate was then processed according to a universal thermal
    cycling protocol determined by ABI on Thermo Hybaid (Basingstoke, Hampshire, UK)
    384 well-headed blocks. After PCR amplification, allelic discrimination was determined
    using a 7900HT Fast Real-Time PCR System and Sequence Detection Software version
    2.1 (Applied Biosystems). Genotypes were determined and confirmed by two experienced
    technicians blinded to all study data. For 343 subjects, DNA samples were of limited
    amount or quality. Thus, we present the data on 795 children (424 girls and 371
    boys) for whom complete information and high-quality genotype data were available.


    # Statistical methods


    Continuous variables were presented as mean values ± s.d., whereas categorical
    variables were presented as frequencies or proportions (%). The normal distribution
    of the investigated variables was assessed using the Kolmogorov–Smirnov


    # Results


    The overall frequency of the G allele was 72%, while that of the minor A allele
    was 28%. The genotype frequencies were 51.9% for the GG, 39.9% for the GA and
    8.2% for the AA genotype, and they were in Hardy–Weinberg equilibrium (P = 0.94).
    Owing to the limited number of AA homozygotes, all analyses were undertaken by
    merging GA and AA into one group. The distribution of Tanner stage did not differ
    (P = 0.65) between GG and A-allele subjects. Table 1 shows the anthropometric
    and dietary parameters depending on the IGF rs680 genotype. A trend for tallness
    was found in children homozygous for the common allele (GG), compared with A-allele
    carriers (148.9 ± 7.9 vs 148.1 ± 7.9 cm, respectively; P = 0.19). When the macronutrient
    and food group intake was evaluated by the IGF2 genotype, no statistically significant
    difference for any of the parameters evaluated was detected. Multivariate analysis
    showed that, after adjustment for age, sex and dairy intake, the IGF2 rs680 genotype
    was a statistically significant predictor of height.


    **Table 1** Anthropometric, biochemical and dietary parameters of the study participants
    stratified by the *IGF rs680* genotype (data are presented as means ± s.d.)


    | Variable | GG | GA + AA | P-value |

    |---|---:|---:|---:|

    | **N** | 412 | 383 | |

    | Age | 11.15 ± 0.62 | 11.13 ± 0.65 | 0.69 |

    | Male/female | 188/224 | 183/200 | 0.54 |

    | **Anthropometric variables** |  |  |  |

    | Weight (kg) | 44.3 ± 9.6 | 44.3 ± 9.8 | 0.94 |

    | Height (cm) | 148.9 ± 7.9 | 148.1 ± 7.9 | 0.19 |

    | BMI (kg/m²) | 20 ± 3.5 | 20.3 ± 3.7 | 0.23 |

    | Waist-to-hip ratio | 0.80 ± 0.05 | 0.81 ± 0.09 | 0.45 |

    | **Dietary variables** |  |  |  |

    | Energy (kcal) | 1848.3 ± 566.5 | 1889.8 ± 575.4 | 0.30 |

