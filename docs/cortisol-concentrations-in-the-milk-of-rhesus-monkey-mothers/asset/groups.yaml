  md: "\n## ORIGINAL ARTICLE\n\n## Daily intake associates with the *IGF rs680* polymorphism\
    \ to height variation in periadolescent children\n\nGV Dedoussis, E Louizou, C\
    \ Papoutsakis, KP Skenderi and M Yannakoulia\n\n*Department of Dietetics – Nutrition,\
    \ Harokopio University, Athens, Greece*\n\n**Background/Objectives:** Height is\
    \ a classic polygenic trait, with a number of genes underlying its variation.\
    \ We evaluated the prospect of gene-diet interactions in a children’s cohort,\
    \ for the insulin-like growth factor II (*IGF rs680*) polymorphism and height\
    \ variation.\n\n**Subjects/Methods:** We screened 795 periadolescent children\
    \ (424 girls) aged 10–11 years old from the Gene and Diet Attica Investigation\
    \ (GENDAI) pediatric cohort for the *IGF rs680* polymorphism (rs680).\n\n**Results:**\
    \ Children homozygous for the common allele (GG) were taller (148.9 ± 7.9 cm)\
    \ compared with those with the A allele (148.1 ± 7.9 cm), after adjusting for\
    \ age, sex and dairy intake (*P* = 0.024). A trend for rs680 × dairy intake interaction\
    \ was also revealed (*P* = 0.09). Stratification by *IGF rs680* genotype revealed\
    \ a positive significant (*P* = 0.014) association between dairy product intake\
    \ and height in A-allele children adjusted for age and sex. A daily increase of\
    \ four dairy servings was associated with a 0.4 cm increase in height. On grouping\
    \ dairy intake into low (1.9 ± 0.7 servings per day) and high dairy product consumption\
    \ (4.4 ± 1.5 servings per day), children with the A allele who were high dairy\
    \ product consumers were taller compared with the low dairy product consumers\
    \ (148.8 ± 7.9 vs 147.4 ± 7.7 cm, respectively, *P* = 0.05).\n\n**Conclusions:**\
    \ A higher consumption of dairy products is associated with increased height depending\
    \ on the IGF2 rs680 genotype.\n\n**Keywords:** height; polymorphism; *IGF*; children;\
    \ diet; dairy products\n\n**Correspondence:** Professor G V Dedoussis, Department\
    \ of Nutrition – Dietetics, Harokopio University, 70 El. Venizelou St, Athens\
    \ 17671, Greece.  \nE-mail: dedousi@hua.gr\n\n**Contributors:** GVD planned the\
    \ study and wrote the manuscript; MY and CP were responsible for dietary data\
    \ collection; KPS performed the biochemical analyses; EL conducted genotyping.\
    \ All authors were involved in interpretation of the results and revision of the\
    \ manuscript.\n\nReceived 14 November 2008; revised 30 July 2009; accepted 5 August\
    \ 2009; published online 2 December 2009\n\n## Introduction\n\nAdult height is\
    \ one of the classical complex human traits reflecting the combined influence\
    \ of multiple genetic factors, with up to 90% of the variation within a population\
    \ being explained by genetic variation (Silventoinen *et al.*, 2003; Mullis, 2005;\
    \ MacGregor *et al.*, 2006; Perola *et al.*, 2007). At the same time, as evidenced\
    \ in industrialized societies over the previous century, environmental factors\
    \ and in particular dietary habits are widely accepted to affect significantly\
    \ a person’s height (Ogden *et al.*, 2004; Rosenfeld, 2007).\n\nDespite height’s\
    \ strong heritability, until very recently, there was limited success in identifying\
    \ specific genetic variants in the general population. Rare cases associated with\
    \ extreme stature could not explain the normal variation in the general population\
    \ (Palmert and Hirschhorn, 2003). Recently, genome-wide association (GWA) studies\
    \ have identified several loci that were strongly associated with variation in\
    \ height (Perola *et al.*, 2007; Weedon *et al.*, 2007; Gudbjartsson *et al.*,\
    \ 2008; Lettre *et al.*, 2008; Sanna *et al.*, 2008). Initially, common variants\
    \ in the *HMGA2* oncogene on chromosome 12 were found to explain 0.3% of the population\
    \ variation in height (Weedon *et al.*, 2007), whereas others (Perola *et al.*,\
    \ 2007; Sanna *et al.*, 2008) reported evidence for major quantitative trait loci\
    \ (QTLs) on 8q21.3 and common variants in the osteoarthritis-associated locus\
    \ *GDF5 UQCC* on chromosome 20. More recently (Gudbjartsson *et al.*, 2008; Lettre\
    \ *et al.*, 2008; Weedon *et al.*, 2008), new sequence variants at >30 loci were\
    \ found.\n\nProposed cut-off points for childhood overweight and obesity adopted\
    \ by the International Obesity Task Force (IOTF) (Cole et al., 2000). In addition,\
    \ central adiposity was assessed by measuring the waist and hip circumference\
    \ and calculating the ratio (WHR). A set of Lange skinfold calipers (Cambridge\
    \ Scientific Instruments, Cambridge, MA, USA) was applied to obtain two repeated\
    \ measurements of triceps and subscapular skinfolds for the right side of the\
    \ body to a precision of 0.2 mm. The mean of the two measurements was calculated.\
    \ The body fat percentage was estimated using the sex- and age-specific Slaughter\
    \ equations (Slaughter et al., 1988).\n\n### Blood sampling\n\nA volume of 20\
    \ ml of venous blood was collected after an overnight fast (≥10 h). The samples\
    \ were placed in plain tubes as well as ethylenediaminetetraacetic acid (EDTA)-containing\
    \ tubes as separate aliquots, one for serum and one for plasma. Plasma was immediately\
    \ separated by centrifugation (1800 g, 10 min, 4°C) and aliquots were stored at\
    \ −80°C until assayed. DNA extraction was performed by the salting-out procedure\
    \ (Miller et al., 1988). IGF2 rs680 polymorphism was performed by the TaqMan assay.\
    \ Briefly, 5 ng/μl of each sample of DNA was used for the PCR. The forward and\
    \ reverse primers, and fluorescently labelled VIC and FAM probes were ordered\
    \ from Applied Biosystems (Foster City, California, USA: www.appliedbiosystems.com).\
    \ A master mix was prepared in a bijou (Sterilin, London, UK) using the following\
    \ reagents: Sigma Jump Start Taq Ready Mix for High Throughput # D644Z-(2000RXN)\
    \ (Sigma-Aldrich, Gillingham, Dorset, UK). A volume of 5 μl of the master mix\
    \ was added to each of the 384 wells of the reaction plate using a Finnpipette\
    \ multichannel dispenser (Life Sciences, Basingstoke, UK). An optical adhesive\
    \ film (Applied Biosystems) was used to seal the plate. The plate was then centrifuged\
    \ at 1000 r.p.m. for 1 min. Each plate was then processed according to a universal\
    \ thermal cycling protocol determined by ABI on Thermo Hybaid (Basingstoke, Hampshire,\
    \ UK) 384-well-headed blocks. After PCR amplification, allelic discrimination\
    \ was determined using a 7900HT Fast Real-Time PCR System and Sequence Detection\
    \ Software version 2.1 (Applied Biosystems). Genotypes were determined and confirmed\
    \ by two experienced technicians blinded to all study data. For 343 subjects,\
    \ DNA samples were of limited amount or quality. Thus, we present the data on\
    \ 795 children (424 girls and 371 boys) for whom complete information and high-quality\
    \ genotype data were available.\n\n### Statistical methods\n\nContinuous variables\
    \ were presented as mean values ± s.d., whereas categorical variables were presented\
    \ as frequencies or proportions (%). The normal distribution of the investigated\
    \ variables was assessed using the Kolmogorov–Smirnov criterion. However, in tables,\
    \ untransformed means are presented. Distributions of frequencies of categorical\
    \ variables were analyzed using the χ² test of independence. The association of\
    \ genotypes with height was tested by applying a linear regression model, after\
    \ controlling for the effects of several potential confounders, such as age, gender\
    \ and dairy intake, which are known from the available literature for their effects\
    \ on height. The selection of each confounder was based on Pearson’s coefficient\
    \ (*P* < 0.05). Interaction terms between genotypes and dairy intake were also\
    \ tested through linear regression analysis. All statistical analyses were performed\
    \ using SPSS 13.0 for Windows (SPSS Inc., Chicago, IL, USA).\n\n## Results\n\n\
    The overall frequency of the G allele was 72%, while that of the minor A allele\
    \ was 28%. The genotype frequencies were 51.9% for the GG, 39.9% for the GA and\
    \ 8.2% for the AA genotype, and they were in Hardy–Weinberg equilibrium (*P* =\
    \ 0.94). Owing to the limited number of AA homozygotes, all analyses were undertaken\
    \ by merging GA and AA into one group. The distribution of Tanner stage did not\
    \ differ (*P* = 0.65) between GG and A-allele subjects. Table 1 shows the anthropometric\
    \ and dietary parameters depending on the *IGF rs680* genotype. A trend for tallness\
    \ was found in children homozygous for the common allele (GG), compared with A-allele\
    \ carriers (148.9 ± 7.9 vs 148.1 ± 7.9 cm, respectively; *P* = 0.19). When the\
    \ macronutrient and food group intake was evaluated by the IGF2 genotype, no statistically\
    \ significant difference for any of the parameters evaluated was detected. Multivariate\
    \ analysis showed that, after adjustment for age, sex and dairy intake, the IGF2\
    \ rs680 genotype was a statistically significant predictor of height.\n\n**Table\
    \ 1** Anthropometric, biochemical and dietary parameters of the study participants\
    \ stratified by the *IGF rs680* genotype (data are presented as means ± s.d.)\n\
    \n| Variable | GG | GA + AA | *P*-value |\n|---|---:|---:|---:|\n| **N** | 412\
    \ | 383 |  |\n| Age | 11.15 ± 0.62 | 11.13 ± 0.65 | 0.69 |\n| Male/female | 188/224\
    \ | 183/200 | 0.54 |\n| **Anthropometric variables** |  |  |  |\n| Weight (kg)\
    \ | 44.3 ± 9.6 | 44.3 ± 9.8 | 0.94 |\n| Height (cm) | 148.9 ± 7.9 | 148.1 ± 7.9\
    \ | 0.19 |\n| BMI (kg/m²) | 20 ± 3.5 | 20.3 ± 3.7 | 0.23 |\n| Waist-to-hip ratio\
    \ | 0.80 ± 0.05 | 0.81 ± 0.09 | 0.45 |\n| **Dietary variables** |  |  |  |\n|\
    \ Energy (kcal) | 1848.3 ± 566.5 | 1889.8 ± 575.4 | 0.30 |\n| Fats (g) | 81.7\
    \ ± 28.9 | 83.6 ± 29.5 | 0.19 |\n| Carbohydrates (g) | 210.4 ± 72 | 213.6 ± 71.3\
    \ | 0.53 |\n| Proteins (g) | 69.3 ± 22.3 | 70.2 ± 26.9 | 0.63 |\n| Dairy products\
    \ (servings per day) | 3.0 ± 1.4 | 3.2 ± 1.7 | 0.30 |\n"
  mdcn: "\n## 原始文章\n\n## 每日摄入量与 *IGF rs680* 多态性在青春期前后儿童身高变异中的关联\n\nGV Dedoussis, E\
    \ Louizou, C Papoutsakis, KP Skenderi and M Yannakoulia\n\n*希腊雅典Harokopio大学营养-饮食学系*\n\
    \n**背景/目的：** 身高是经典的多基因性状，其变异由多个基因决定。我们在儿童队列中评估了基因-饮食交互作用与胰岛素样生长因子 II（*IGF rs680*）多态性及身高变异关联的可能性。\n\
    \n**对象/方法：** 我们从基因与饮食阿提卡调查（GENDAI）儿科队列中筛查了795名10–11岁青春期前后儿童（424名女孩）的 *IGF rs680*\
    \ 多态性（rs680）。\n\n**结果：** 在校正年龄、性别和乳制品摄入后，常见等位基因纯合子（GG）儿童比携带A等位基因的儿童更高（148.9 ±\
    \ 7.9 cm 对比 148.1 ± 7.9 cm）（*P* = 0.024）。还发现rs680 × 乳制品摄入交互作用的趋势（*P* = 0.09）。按\
    \ *IGF rs680* 基因型分层显示，在校正年龄和性别后，A等位基因儿童的乳制品摄入与身高呈显著正相关（*P* = 0.014）。每日增加四份乳制品与身高增加0.4\
    \ cm相关。将乳制品摄入分为低（1.9 ± 0.7份/天）和高乳制品消费（4.4 ± 1.5份/天）后，携带A等位基因且高乳制品消费的儿童比低乳制品消费者更高（分别为148.8\
    \ ± 7.9 vs 147.4 ± 7.7 cm，*P* = 0.05）。\n\n**结论：** 较高的乳制品消费与身高增加相关，这取决于IGF2 rs680基因型。\n\
    \n**关键词：** 身高；多态性；*IGF*；儿童；饮食；乳制品\n\n**通信作者：** G V Dedoussis教授，希腊雅典El. Venizelou街70号，Harokopio大学营养-饮食学系，邮编17671。\
    \  \nE-mail: dedousi@hua.gr\n\n**贡献者：** GVD设计研究并撰写手稿；MY和CP负责饮食数据收集；KPS进行生化分析；EL进行基因分型。所有作者参与结果解释和手稿修订。\n\
    \n2008年11月14日收到；2009年7月30日修订；2009年8月5日接受；2009年12月2日在线发表\n\n## 引言\n\n成人身高是经典的复杂人类性状之一，反映了多个遗传因素的综合影响，人群中高达90%的变异可由遗传变异解释（Silventoinen\
    \ *et al.*, 2003; Mullis, 2005; MacGregor *et al.*, 2006; Perola *et al.*, 2007）。与此同时，正如过去一个世纪工业化社会所证明的那样，环境因素，尤其是饮食习惯，被广泛认为会显著影响一个人的身高（Ogden\
    \ *et al.*, 2004; Rosenfeld, 2007）。\n\n尽管身高具有强遗传力，但直到最近，在普通人群中识别特定遗传变异方面取得的成功仍然有限。与极端身材相关的罕见病例不能解释普通人群中的正常变异（Palmert\
    \ and Hirschhorn, 2003）。最近，全基因组关联（GWA）研究已鉴定出多个与身高变异强相关的位点（Perola *et al.*, 2007;\
    \ Weedon *et al.*, 2007; Gudbjartsson *et al.*, 2008; Lettre *et al.*, 2008; Sanna\
    \ *et al.*, 2008）。最初，发现12号染色体上 *HMGA2* 癌基因的常见变异可解释人群中0.3%的身高变异（Weedon *et al.*,\
    \ 2007），而其他研究（Perola *et al.*, 2007; Sanna *et al.*, 2008）报告了8q21.3上主要数量性状位点（QTLs）的证据，以及20号染色体上与骨关节炎相关位点\
    \ *GDF5 UQCC* 的常见变异。更近期（Gudbjartsson *et al.*, 2008; Lettre *et al.*, 2008; Weedon\
    \ *et al.*, 2008），在>30个位点发现了新的序列变异。\n\n采用国际肥胖工作组（IOTF）提出的儿童超重和肥胖切点（Cole et al.,\
    \ 2000）。此外，通过测量腰围和臀围并计算比值（WHR）评估中心性肥胖。使用一套Lange皮褶卡尺（Cambridge Scientific Instruments,\
    \ Cambridge, MA, USA）对右侧身体肱三头肌和肩胛下皮褶进行两次重复测量，精确到0.2 mm。计算两次测量的平均值。使用性别和年龄特异性Slaughter方程估计体脂百分比（Slaughter\
    \ et al., 1988）。\n\n### 血液采样\n\n过夜空腹（≥10 h）后采集20 ml静脉血。样本置于普通管以及含乙二胺四乙酸（EDTA）的管中，分别作为血清和血浆等分试样。血浆立即通过离心（1800\
    \ g，10 min，4°C）分离，等分试样储存于−80°C直至检测。DNA提取采用盐析法（Miller et al., 1988）。IGF2 rs680多态性采用TaqMan检测法进行检测。简言之，每个DNA样本取5\
    \ ng/μl用于PCR。正向和反向引物以及荧光标记的VIC和FAM探针购自Applied Biosystems（Foster City, California,\
    \ USA: www.appliedbiosystems.com）。在bijou（Sterilin, London, UK）中使用以下试剂制备预混液：Sigma\
    \ Jump Start Taq Ready Mix for High Throughput # D644Z-(2000RXN)（Sigma-Aldrich,\
    \ Gillingham, Dorset, UK）。使用Finnpipette多通道分配器（Life Sciences, Basingstoke, UK）将5\
    \ μl预混液加入反应板的每个384孔中。使用光学粘合膜（Applied Biosystems）密封板。然后将板以1000 r.p.m.离心1 min。每块板随后按照ABI在Thermo\
    \ Hybaid（Basingstoke, Hampshire, UK）384孔头上确定的通用热循环方案处理。PCR扩增后，使用7900HT Fast Real-Time\
    \ PCR System和Sequence Detection Software version 2.1（Applied Biosystems）进行等位基因判别。基因型由两名经验丰富的技术人员确定并确认，他们对所有研究数据不知情。对于343名受试者，DNA样本量有限或质量不佳。因此，我们呈现了795名儿童（424名女孩和371名男孩）的数据，这些儿童具有完整信息和高品质基因型数据。\n\
    \n### 统计方法\n\n连续变量以均值 ± 标准差表示，而分类变量以频率或比例（%）表示。使用Kolmogorov–Smirnov标准评估所研究变量的正态分布。然而，表中呈现的是未转换的均值。分类变量的频率分布使用χ²独立性检验分析。在控制若干潜在混杂因素（如年龄、性别和乳制品摄入，现有文献已知这些因素对身高有影响）后，应用线性回归模型检验基因型与身高的关联。每个混杂因素的选择基于Pearson系数（*P*\
    \ < 0.05）。基因型与乳制品摄入之间的交互项也通过线性回归分析检验。所有统计分析使用SPSS 13.0 for Windows（SPSS Inc.,\
    \ Chicago, IL, USA）进行。\n\n## 结果\n\nG等位基因总体频率为72%，而次要A等位基因频率为28%。基因型频率为GG 51.9%、GA\
    \ 39.9%和AA 8.2%，且符合Hardy–Weinberg平衡（*P* = 0.94）。由于AA纯合子数量有限，所有分析均将GA和AA合并为一组。Tanner分期分布在GG和A等位基因受试者之间无差异（*P*\
    \ = 0.65）。表1显示了根据 *IGF rs680* 基因型的人体测量和饮食参数。与A等位基因携带者相比，常见等位基因纯合子（GG）儿童有身高较高的趋势（分别为148.9\
    \ ± 7.9 vs 148.1 ± 7.9 cm；*P* = 0.19）。当按IGF2基因型评估宏量营养素和食物类别摄入时，所评估的任何参数均未检测到统计学显著差异。多变量分析显示，在校正年龄、性别和乳制品摄入后，IGF2\
    \ rs680基因型是身高的统计学显著预测因子。\n\n**表1** 按 *IGF rs680* 基因型分层的研究参与者人体测量、生化和饮食参数（数据以均值\
    \ ± 标准差表示）\n\n| 变量 | GG | GA + AA | *P*-值 |\n|---|---:|---:|---:|\n| **N** | 412\
    \ | 383 |  |\n| 年龄 | 11.15 ± 0.62 | 11.13 ± 0.65 | 0.69 |\n| 男/女 | 188/224 | 183/200\
    \ | 0.54 |\n| **人体测量变量** |  |  |  |\n| 体重（kg） | 44.3 ± 9.6 | 44.3 ± 9.8 | 0.94\
    \ |\n| 身高（cm） | 148.9 ± 7.9 | 148.1 ± 7.9 | 0.19 |\n| BMI（kg/m²） | 20 ± 3.5 |\
    \ 20.3 ± 3.7 | 0.23 |\n| 腰臀比 | 0.80 ± 0.05 | 0.81 ± 0.09 | 0.45 |\n| **饮食变量**\
    \ |  |  |  |\n| 能量（kcal） | 1848.3 ± 566.5 | 1889.8 ± 575.4 | 0.30 |\n| 脂肪（g） |\
    \ 81.7 ± 28.9 | 83.6 ± 29.5 | 0.19 |\n| 碳水化合物（g） | 210.4 ± 72 | 213.6 ± 71.3 |\
    \ 0.53 |\n| 蛋白质（g） | 69.3 ± 22.3 | 70.2 ± 26.9 | 0.63 |\n| 乳制品（份/天） | 3.0 ± 1.4\
    \ | 3.2 ± 1.7 | 0.30 |\n\n"
