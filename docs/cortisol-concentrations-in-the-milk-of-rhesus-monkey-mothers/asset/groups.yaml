    | Il2rb (d) | NM_130410 | 10899749 | 6.11 | 6.22 | −1.08 | 0.042 |

    | Bcl2l1 (d) | NM_031535 | 10850826 | 7.01 | 7.07 | −1.04 | 0.045 |

    | Il13ra2 (u) | NM_133538 | 10937279 | 3.77 | 2.95 | 1.76 | 0.018 |

