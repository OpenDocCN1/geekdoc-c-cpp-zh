    \n![](img/8e929f63d67ad563cea21a4a5b22eea4_5_1.png)\n\n## 发育\n\n### 母乳：丰富的机遇\n\
    \n*关于乳汁成分以及母乳喂养如何惠及成长中儿童的研究正令科学家感到惊讶。*\n\n**作者：安娜·佩瑟里克**\n\n如果你曾经需要为塔马尔沙袋鼠配制配方奶，你将面对一个复杂的配方。在从出生到断奶、待在育儿袋中的300天里，袋鼠幼崽每周都会饮用不同的乳汁。\n\
    \n早期，幼崽需要初乳，其中富含抗体。60天后，配方奶应富含含天冬酰胺的肽，这些肽被认为有助于大脑发育。90天后，袋鼠幼崽将需要一剂含硫氨基酸，如半胱氨酸和蛋氨酸，这会促使毛囊和指甲生长。\n\
    \n为了健康发育，乳汁所含的热量也必须增加，以至于幼崽断奶时所饮乳汁的能量密度是其最初饮用液体的四倍半。这种成分变化序列似乎完全由母体决定。而且奇怪的是，她的乳头可以独立运作，每只袋鼠幼崽在育儿袋中的前300天实际上都固定在一个乳头上。事实上，一只幼崽可能有一个年龄不同的同袋伙伴，它吸吮相邻的乳头——并接受适合其年龄的不同成分的乳汁¹。\n\
    \n与沙袋鼠的乳汁不同，人类乳汁不会随时间发生如此剧烈的变化，因为沙袋鼠通过乳汁传递的发育信号，可以通过人类胎盘传递。人类乳汁的主要成分——脂肪、蛋白质和碳水化合物——在整个哺乳期变化很小。但更仔细的分析揭示了人类乳汁中生物活性成分组成的重要时间依赖性变化——这些分子和细胞除了供能并为婴儿生长提供原料之外，还具有生物学功能。弄清这些成分是什么以及它们有何作用，推动了当今许多泌乳研究。\n\
    \n### 哺乳动物的混合物\n\n直到最近，人类泌乳研究主要还是从公共卫生角度构思的。现在的趋势是从进化角度探讨这一主题。这种观点假定，婴儿应尽可能多地接受母乳喂养以最大化其存活机会，而母亲必须平衡当前用于产奶的代谢投入与未来后代的潜在投入。\n\
    \n例如，进化理论表明，母亲应更多投入喂养儿子，因为一个成功的儿子能产生的后代比女儿多得多。近期几项研究通过识别男性和女性所摄入母乳的明显差异支持这一观点。例如，在人类中，男婴获得的乳汁脂肪和蛋白质含量显著高于女婴获得的乳汁²。\n\
    \nNATURE.COM  \n了解更多关于母乳喂养背后的科学  \nnature.com/95cSV7\n\n在恒河猴中，雄性幼崽饮用的乳汁含有更高浓度的皮质醇，这是一种调节……的激素\n"
