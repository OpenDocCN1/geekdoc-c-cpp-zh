    modulate gene activity and lower the levels of fatty acids and triglycerides in
    the liver: they can bind and activate a family of transcription factors called
    peroxisome-proliferator-activated receptors (PPARs) to speed up the breakdown
    of fatty acids; PUFAs can also deplete another transcription factor, sterol regulatory
    element binding protein-1 — thereby curtailing fatty-acid synthesis. This two-pronged
    attack provides a significant health benefit. “Along with cholesterol,” explains
    Jump, “elevated triglycerides are a common target for the management of atherosclerosis,
    cardiovascular disease and stroke.”


    Although most research on PUFAs has focused on their connection to cardiovascular
    disease, by manipulating an enzyme involved in fatty-acid metabolism Jump’s team
    has demonstrated that PUFAs can also balance blood glucose levels, suggesting
    a potential treatment for type 2 diabetes.


    “Dietary omega-3s are not usually thought of as a treatment for elevated blood
    sugar,” says Jump. Yet by studying diet and its effect on metabolic pathways,
    these types of links are being uncovered.


    After diet and metabolism, a third element in development of diet-related disease
    is the genome. “In humans, genetic background plays a role in either responding
    well, or not, to particular nutrients,” says Jump. Adding global


