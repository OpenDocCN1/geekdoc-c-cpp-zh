    # ORIGINAL ARTICLE


    # Daily intake associates with the *IGF rs680* polymorphism to height variation
    in periadolescent children


    GV Dedoussis, E Louizou, C Papoutsakis, KP Skenderi and M Yannakoulia


    *Department of Dietetics – Nutrition, Harokopio University, Athens, Greece*


    **Background/Objectives:** Height is a classic polygenic trait, with a number
    of genes underlying its variation. We evaluated the prospect of gene-diet interactions
    in a children’s cohort, for the insulin-like growth factor II (*IGF rs680*) polymorphism
    and height variation.


    **Subjects/Methods:** We screened 795 periadolescent children (424 girls) aged
    10–11 years old from the Gene and Diet Attica Investigation (GENDAI) pediatric
    cohort for the *IGF rs680* polymorphism (rs680).


    **Results:** Children homozygous for the common allele (GG) were taller (148.9
    ± 7.9 cm) compared with those with the A allele (148.1 ± 7.9 cm), after adjusting
    for age, sex and dairy intake (*P* = 0.024; A trend for rs680 × dairy intake interaction
    was also revealed (*P* = 0.09). Stratification by *IGF rs680* genotype revealed
    positive significant (*P* = 0.014) association between dairy product intake and
    height in A-allele children adjusted for age and sex. A daily increase of four
    dairy servings was associated with a 0.4 cm increase in height. On grouping dairy
    intake into low (1.9 ± 0.7 servings per day) and high dairy product consumption
    (4.4 ± 1.5 servings per day), children with the A allele who were high dairy product
    consumers were taller compared with the low dairy product consumers (148.8 ± 7.9
    vs 147.4 ± 7.7 cm, respectively, *P* = 0.05).


    **Conclusions:** A higher consumption of dairy products is associated with increased
    height depending on the rs680 IGF2 genotype.


    **Keywords:** height; polymorphism; *IGF*; children; diet; dairy products


    # Introduction


    Adult height is one of the classical complex human traits reflecting the combined
    influence of multiple genetic factors, with up to 90% of the variation within
    a population being explained by genetic variation (Silventoinen *et al.*, 2003;
    Mullis 2005; Macgregor *et al.*, 2006; Perola *et al.*, 2007). At the same time,
    as evidenced in industrialized societies over the previous century, environmental
    factors and in particular dietary habits are widely accepted to


    affect significantly a person’s height (Ogden *et al.*, 2004; Rosenfeld, 2007).


    Despite height’s strong heritability, until very recently, there was limited success
    in identifying specific genetic variants in the general population. Rare cases
    associated with extreme stature could not explain the normal variation in the
    general population (Palmert and Hirschhorn, 2003). Recently, genome-wide association
    (GWA) studies have identified several loci that were strongly associated with
    variation in height (Perola *et al.*, 2007; Weedon *et al.*, 2007; Gudbjartsson
    *et al.*, 2008; Lettre *et al.*, 2008; Sanna *et al.*, 2008). Initially, common
    variants in the *HMGA2* oncogene on chromosome 12 were found to explain 0.3% of
    the population variation in height (Weedon *et al.*, 2007), whereas others (Perola
    *et al.*, 2007; Sanna *et al.*, 2008) reported evidence for major quantitative
    trait loci (QTLs) on 8q21.3 and common variants in the osteoarthritis-associated
    locus *GDF5 UQCC* on chromosome 20. More recently (Gudbjartsson *et al.*, 2008;
    Lettre *et al.*, 2008; Weedon *et al.*, 2008), new sequence variants at >30 loci
    were found.


    **Correspondence:** Professor G V Dedoussis, Department of Nutrition – Dietetics,
    Harokopio University, 70 El. Venizelou St, Athens 17671, Greece.

    E-mail: dedousi@hua.gr


    **Contributors:** GVD planned the study and wrote the manuscript; MY and CP were
    responsible for dietary data collection; KPS performed the biochemical analyses;
    EL conducted genotyping. All authors were involved in interpretation of the results
    and revision of the manuscript.


    Received 14 November 2008; revised 30 July 2009; accepted 5 August 2009; published
    online 2 December 2009'
