    +   4. Matsuo, T. et al. *Obesity* 10, 1924–1931 (2009).

    +   5. Holmes, E. *Nature* 453, 396–400 (2008).

    +   6. Wise, C. & Kaput J. *J. Diabetes Sci. Technol.* 3, 710–721 (2009).'
