  mdcn: '

    研究已揭示，Clock基因被破坏的小鼠易于发生肥胖并出现类似MetS的表型。9 与此相似，我们最近提供了CLOCK基因在人类脂肪组织中表达的证据，并表明其与腰围及代谢综合征不同组分相关。28
    将代谢综合征与昼夜节律系统紊乱联系起来的精确机制尚不十分清楚。然而，大多数假说认为，代谢所涉及的不同昼夜节律之间的内部失同步（ID）是代谢综合征发生的关键因素。29


    我们的饮食干预研究表明，与AA纯合子相比，CLOCK基因座rs1801260的次要等位基因携带者对体重减轻以及能量限制饮食引起的代谢变化更具抵抗性。既往研究支持以下假说：个体CLOCK基因型可能影响健康个体和精神疾病患者中与行为相关的多个变量。30
    具体而言，针对rs1801260，已发现该多态性与情绪障碍的临床特征相关，可影响健康人的昼夜节律偏好，并可导致抑郁症和双相情感障碍患者出现睡眠时相延迟和失眠。30,32
    这些改变不仅可能与肥胖有关，也可能与体重减轻有关。同样，我们此前已表明，体重减轻的大部分障碍与受试者的饮食行为和心理特征有关，而这些障碍与减重难度直接相关。14
    此外，既往研究已将rs1801260与进食障碍和肥胖联系起来。1,2,25


    这一观点得到了动物研究结果的支持，表明Clock基因直接参与体重调节：纯合Clock突变小鼠出现肥胖、食欲亢进，并伴有进食行为、睡眠模式和情绪的改变。4 有趣的是，我们发现rs1801260变异体的次要等位基因携带者比主要等位基因携带者倾向于睡眠更少。我们的数据与将rs1801260与失眠相关联的早期研究30，以及表明睡眠剥夺可能增加肥胖和体重增加风险的流行病学研究33一致。尽管观察到的结果背后的分子机制仍不清楚，但我们可以从本研究中推测，rs1801260变异等位基因携带者可能经历与Clock基因敲除小鼠相似的生物钟系统紊乱。动物模型中Clock基因的缺失会影响肥胖、睡眠和进食行为，而这些在人类受试者中可能进而影响体重减轻。


    在一项既往研究中，研究者报告称，一组肥胖相关候选基因的多态性在调节中度低能量饮食引起的体重变化方面作用甚微（如果有的话）。4 研究者得出结论，他们所检测的遗传变异均与干预中的体重减轻无显著关联。虽然该研究未包含CLOCK基因，但先前研究与本研究之间的一个重要区别在于，先前研究的干预时间限制为10周，而本研究的减重治疗持续了28周。Sørensen等6
    提出，要有效评估特定多态性在体重减轻中的作用并检测变异之间的差异，需要更长期的干预。事实上，在本研究中，rs1801260变异体在体重减轻方面的最重要差异在治疗第3个月起就已显现。其他在肥胖人群中识别出遗传变异与体重减轻之间关联的研究所使用的干预时间与我们的研究相似。1
    到目前为止，大多数评估遗传变异与通过干预实现的体重减轻之间关系的研究，都集中于与能量消耗、食欲控制、脂肪生成或与胰岛素抵抗和脂质代谢相关的基因。1 我们的研究显示昼夜节律基因在体重减轻中可能发挥的作用，从而拓展了当前的知识领域。


    总之，在这项针对地中海人群进行的干预试验中，我们重复验证了既往研究报告的CLOCK基因多态性与肥胖之间的关系。我们的结果表明，rs1801260可以预测基于低能量饮食的减重策略的结局。G等位基因携带者可能表现出更高程度的肥胖，并且在低能量饮食干预下更难减轻体重。这种困难在整个治疗期间持续可见，但在治疗第3个月后最为明显。这些数据表明，CLOCK基因多态性可以预测低能量饮食干预下的体重减轻幅度。


