    ^a u，上调基因；d，下调基因。

    ^b 数值代表探针组的荧光强度，以log2尺度表示。

    ^c 倍数变化是HFD父亲子代相对于对照的基因表达。


    逆转录（RT–PCR）证实了子代胰岛中Il13ra2（+6.3；P < 0.05）和Klk8（+2.9；P < 0.01）的信使RNA表达上调（每组n =
    5），以及Fos（−4.0；P < 0.05）的表达下降。与对照（33.6 ± 4.0%，P < 0.001）相比，HFD子代中Il13ra2胞嘧啶−960处的甲基化降低（8.9
    ± 2.2%）。发现胞嘧啶−960位于T细胞因子1和NF-κB的假定结合位点，后者是一种甲基化DNA结合蛋白3。Il13ra2的这种表观遗传修饰——该基因是关键分子网络的一部分（表2、补充表3和补充图4）——表明父源性HFD改变子代胰岛功能，部分是通过影响子代的表观基因组实现的。


    在人类中，父源性胰岛素抵抗/糖尿病与子代出生体重呈负相关，并增加随后患糖尿病的风险。尽管遗传因素可能起作用，但我们的发现表明，父代HFD暴露可在子代中诱导相似的表型，揭示了一条额外且具有影响力的途径。值得注意的是，这些雌性子代在没有肥胖的情况下出现葡萄糖耐量受损和胰岛素分泌受损，表明父源性HFD特别靶向子代早期的内分泌胰腺和β细胞。雄性后代是否会出现类似缺陷仍有待确定。


    父代生活方式和特定环境因素可在生殖细胞和支持细胞水平以及精液组成方面影响精子发生。脂肪积累导致的睾丸温度升高、膳食脂肪增加以及细胞代谢副产物可直接对成熟睾丸内的生殖细胞产生遗传毒性，通过氧化损伤导致DNA损伤增加。此外，肥胖男性的高胰岛素血症、高脂血症和相对性低促性腺激素性性腺功能减退可能继而影响精子发生。HFD还可能干扰支持细胞增殖和血睾屏障的完整性，从而影响配子的DNA重编程。鉴于儿童肥胖流行日益加剧，一个尚未回答的关键问题是，早期发生和长期HFD暴露是否也可能影响配子发生，从而提供。


    据我们所知，这是首次在任何物种中直接证明父代环境暴露——HFD摄入——可诱导其雌性子代葡萄糖-胰岛素稳态受损的跨代传递。潜在机制似乎包括表观遗传修饰，其功能意义仍有待阐明。这些发现扩展了发育和适应性可塑性的概念，将父代作用纳入疾病的早期生命起源和糖尿病流行的放大。


    ## 方法摘要


    ### 动物实验


    纳入来自八只对照和九只HFD父亲的窝；每个测试使用每窝一只动物。实验方案经新南威尔士大学动物护理与伦理委员会批准。


    ### 微阵列基因表达分析


    使用miRNeasy Mini Kits（Qiagen）提取总胰岛mRNA。选择来自六只对照和五只HFD子代的样本（每只来自不同父亲），RNA完整性值（RIN）≥
    7.5，用于使用Affymetrix GeneChip Rat Gene ST 1.0 arrays进行转录组学分析。


    ### 统计分析


    表型数据在对数转换或平方根转换后使用SPSS 16.0分析，除非原始数据呈正态分布。单时间测量使用双尾Student''s t检验或Mann-Whitney
    U检验分析，时间过程使用重复测量ANOVA分析。完整方法和任何相关参考文献可在论文在线版www.nature.com/nature获取。


