    ## 讨论


    据我们所知，这是首次报告基因型驱动的乳制品摄入与儿童身高变异之间关联的研究。人类 IGF2/rs680 多态性与儿童期身高之间可能存在联系，这是一个引人注目但尚未解决的问题。我们儿科队列中的基因型频率与既往一项成人研究描述的几乎相同（GG：51.9%
    对 51.7%，GA：39.9% 对 40.6%，AA：8.2% 对 7.7%）（Heude 等，2007）。在该研究中，即欧洲癌症前瞻性研究（EPIC）的诺福克分支，作者报告
    rs680 SNP 与 BMI 无显著关联，但他们发现 rs680 IGF2 SNP 与身高独立相关。与他们的发现一致，我们未发现与 BMI 的任何关联，尽管其他研究表明较少见的
    rs680 A 等位基因与较低的 BMI 相关（Gaunt 等，2001）。在英国赫特福德郡人群中，GG 纯合子往往比 AA 纯合子更重且更高，杂合子（GA）居中（Sayer
    等，2002）。在巴尔的摩老龄化纵向研究中，A/A 基因型女性比 G/G 携带者更矮，男性中也观察到类似趋势（Roth 等，2002）。


    可能解释 IGF2 与身高关系的机制存在于儿童早期。与 A 等位基因相比，rs680 G 等位基因与显著更高水平的 IGF2 mRNA 相关，表明该多态性在该基因转录中发挥作用（Vafiadis
    等，1998）。体质性高身材儿童比正常身高儿童具有显著更高的生长速度和更高的 IGF2 水平（Garone 等，2002）。有研究提示，IGF2 可能通过增强对靶组织的作用，尤其是对软骨和骨组织的作用，导致体质性高身材儿童过度生长。


    我们在儿科队列中发现乳制品摄入与身高变异之间存在关联。更准确地说，在 IGF2 多态性 A 等位基因携带者儿童中，乳制品摄入与身高呈正相关。NHANES 研究（Wiley，2005）的结果表明，在控制性别、教育程度和种族后，成年身高与
    5–12 岁和 13–17 岁时的牛奶摄入量呈正相关。牛奶和乳制品摄入刺激线性生长的最强证据来自发展中国家的观察性和干预性研究，这些研究显示出相当大的效应。此外，来自营养良好人群的许多观察性研究也显示牛奶摄入与生长之间存在关联。这些结果表明，即使在营养素摄入充足的情况下，牛奶仍具有促进生长的作用。在一项随机对照喂养干预研究中，增加牛奶摄入量可改善年龄较小且已生长迟缓儿童的线性生长（Neumann
    等，2007）。青春期前儿童膳食摄入与 IGF 水平及生长之间的关联研究较少，但具有相当大的意义。在此背景下，牛奶和乳制品与 IGF-I 的关联尤其值得关注，因为儿童是这些食物的高消费人群。


    Silventoinen 等（2000）的研究表明，变化的环境因素会影响身高的遗传力。生活水平越好，遗传力越高。我们最近表明（Yannakoulia 等，2008），包括离婚在内的家庭因素会影响
    GENDAI 人群的肥胖状态。与已婚父母的孩子相比，离婚父母的孩子即使在调整社会经济状况和体力活动等各种混杂因素后，BMI 水平仍显著更高。因此，不利的家庭环境与儿童超重以及其饮食行为的某些方面相关。当我们按家庭状况对样本进行分层时，基因对身高的效应在离婚父母的孩子中被掩盖。另一方面，在稳定的家庭环境中（似乎即双亲均在场的家庭），IGF2
    基因对身高变异的效应仍具有统计学意义（数据未显示）。因此，探索身高变异并阐明其与饮食等环境因素的可能交互作用，有助于我们设计预防身高相关疾病的有效策略。


