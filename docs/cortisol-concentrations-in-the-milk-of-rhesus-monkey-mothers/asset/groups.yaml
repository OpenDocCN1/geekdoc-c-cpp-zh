    Reverse transcription (RT–PCR) confirmed upregulation of messenger RNA expression
    (n = 5 per group) of Il13ra2 (+6.3; P < 0.05) and Klk8 (+2.9; P < 0.01) and a
    decrease in Fos (−4.0; P < 0.05) in the islets of offspring. Methylation at cytosine
    −960 of Il13ra2 was reduced in HFD offspring (8.9 ± 2.2%) compared to controls
    (33.6 ± 4.0%, P < 0.001). Cytosine −960 was found to be located in a putative
    binding site for the T-cell factor-1 and NF-κB, the latter being a methylated
    DNA binding protein-3. This epigenetic modification of Il13ra2, a gene that is
    part of key molecular networks (Table 2, Supplementary Table 3 and Supplementary
    Fig. 4), indicates that a paternal HFD alters offspring islet function, in part
    by affecting the epigenome of offspring.


    In humans, paternal insulin resistance/diabetes is inversely associated with offspring
    birthweight and increases subsequent risk of diabetes. Although genetic factors
    may contribute, our findings show that paternal exposure to a HFD can induce a
    similar phenotype in offspring, identifying an additional and influential pathway.
    Notably, the impaired glucose tolerance and insulin secretion, in the absence
    of obesity, in these female offspring indicate that a paternal HFD acts to particularly
    target the endocrine pancreas and β-cells early in offspring. Whether similar
    defects emerge in male offspring remains to be determined.


    Paternal lifestyle and particular environmental factors can affect spermatogenesis
    at the level of germ and Sertoli cells and the composition of seminal fluid. Increased
    testicular temperature resulting from fat accumulation and increased dietary fat
    and by-products of cell metabolism can be directly genotoxic to germ cells within
    the mature testis, leading to increased DNA damage through oxidative injury. Furthermore,
    hyperinsulinaemia, hyperlipidaemia and the relative hypogonadotrophic hypogonadism
    in obese males may consequently affect spermatogenesis. A HFD may also interfere
    with Sertoli-cell proliferation, and the integrity of the blood–testis barrier,
    thus affecting DNA reprogramming of the gamete. A critical unanswered question,
    given the rising obesity epidemic in children, is whether early onset and prolonged
    HFD exposure may also affect gametogenesis and thereby offering.


    To our knowledge, this is the first direct demonstration in any species that a
    paternal environmental exposure, HFD consumption, can induce intergenerational
    transmission of impaired glucose-insulin homeostasis in their female offspring.
    The underlying mechanisms seem to include epigenetic modifications, the functional
    implications of which remain to be elucidated. These findings extend the concept
    of developmental and adaptive plasticity to include a paternal role in the early
    life origins of disease and amplification of the diabetes epidemic.


    ## METHODS SUMMARY


    ### Animal experiments


    Litters from eight control and nine HFD fathers were included; one animal per
    litter was used for each test. Experimental protocols were approved by the Animal
    Care and Ethics Committee, University of New South Wales.


    ### Microarray gene expression analysis


    Total islet mRNA was extracted using miRNeasy Mini Kits (Qiagen). Samples from
    six control and five HFD offspring, each from different fathers, with RNA integrity
    number (RIN) ≥ 7.5 were selected for transcriptomics using Affymetrix GeneChip
    Rat Gene ST 1.0 arrays.


    ### Statistical analyses


    Phenotype data were analysed using SPSS 16.0 after log transformation or square-root
    transformation unless raw data were normally distributed. Single time measurements
    were analysed by two-tailed Student''s t-test or Mann-Whitney U test, and time-courses
    were analysed by repeated-measures ANOVA. Full methods and any associated references
    are available in the online version of the paper at www.nature.com/nature.


