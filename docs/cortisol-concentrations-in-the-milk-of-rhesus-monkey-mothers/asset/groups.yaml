    ## 讨论


    在本研究中，我们确认了*CLOCK*基因在体重调节中的作用。具体而言，所检测的5个*CLOCK* SNP中有4个，即rs3749474、rs4864548、rs1464490和rs1801260，与肥胖参数显著相关，第5个（rs4580704）则呈现趋势。我们还表明，*CLOCK*
    rs1801260与对饮食和行为减重方案的应答相关。具体而言，G变异携带者可能具有更高的肥胖风险，且他们对减重干预的应答较差。


    在本研究中，我们重复了既往发现，即不同*CLOCK* SNP与肥胖相关，尤其是rs4864548和rs4580704.11,12。此外，我们表明，在*CLOCK*
    rs3749474位点携带至少一个T等位基因拷贝的次要等位基因携带者，其肥胖程度（体重和BMI）和腹型肥胖（腰围）显著高于主要等位基因携带者。选择该SNP是因其位于3′-UTR。该特定SNP与肥胖相关的机制可能归因于mRNA结构的变化。事实上，我们的分析表明，*CLOCK*
    3′-UTR中的这一单碱基改变（T/C）改变了该特定区域的结构（图2）。3′-UTR的特征在于含有SECIS或AU富集元件（ARE）等序列，这些序列被特定蛋白质识别，从而影响mRNA稳定性或其在细胞中的定位。尽管本文分析未阐明具体结合位点，但预测的等位基因特异性结构差异与以下假设一致：该SNP强烈影响mRNA结构和稳定性。另一方面，该SNP与位于启动子区域的rs4864548完全连锁不平衡（图1）。启动子活性的变异也可能解释我们观察到的结果。


    这些发现支持了不断发展的观点，即昼夜节律振荡器在肥胖和代谢综合征的发生中具有重要作用。7 最近，若干研究提示昼夜节律系统的紊乱可能促进肥胖。26 轮班工作、睡眠剥夺和夜间暴露于强光与脂肪堆积增加有关。27
