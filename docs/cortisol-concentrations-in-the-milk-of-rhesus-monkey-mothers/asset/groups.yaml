    Source: Interheart study. *Non-significant association.


    genetic diversity to the mix greatly increases the complexity of the research.
    The International HapMap Project, a database of genetic variation, began in 2002
    and stores data from Canada, China, Japan, Nigeria, the United Kingdom and the
    United States. So far, the project has identified tens of millions of single nucleotide
    polymorphisms (SNPs) associated with both disease and drug response. SNPs in PPAR
    genes that are regulated by PUFAs affect, among other things, the ability to lose
    weight, a crucial step to controlling diabetes. One SNP in particular has been


    found to account for 7% of the variation in peoples’ weight loss.


    In 2010, InterAct recruited the ten-thousandth person to their search for markers
    that reveal the roles of obesity and exercise in the risk of developing diabetes.
    Analyses of their genomes will be published in 2011, and Wareham is confident
    this approach will uncover new interactions. “We’re using a discovery approach
    on a mass scale,” he says. “We don’t focus so much on the expression of particular
    genes, but on the interplay between innate susceptibility and diet and lifestyle
    factors.”


    Such a link would fill a gap in our knowledge. “Hypothetically,” muses Wareham,
    “the genome-wide influence of dietary and lifestyle factors may account for the
    heritability we have seen in diabetes that remains unaccounted for on the basis
    of simple genetic variation.” Subtle changes are lost in the background noise
    of standard single-gene studies. But they do have an impact — not least of all
    for our definition of disease and the way that clinical trials are designed. “Geneticists,”
    says Kaput, “have been treating all of us like coins when it comes to deciding
    whether we have a disease: heads or tails — are you or are you not diabetic? That’s
    how many studies are designed.”


