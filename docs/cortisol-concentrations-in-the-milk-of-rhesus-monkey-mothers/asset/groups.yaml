    ## 方法


    ### 动物饲养。


    Sprague-Dawley大鼠购自动物资源中心，饲养于22 ± 2 °C、12:12小时光照/黑暗循环环境中。雄性F0代创始鼠在4周龄时被分配至高脂饮食（HFD，SF01-025，SF03-020；40.7%能量来自脂肪；Specialty
    Feeds）组或对照（Gordon''s Stockdiet）组。13周龄时，HFD组雄性体重增加22%（522 ± 11 g对428 ± 13 g，P =
    0.008）；与摄食对照饮食的雌性交配于13周龄开始。交配期间，一只雄性和一只雌性共同饲养，从0800–1800 h可自由获取对照饮食，连续8天。雄性夜间返回笼中继续其指定饮食，而雌性在整个交配、妊娠和哺乳期均摄食对照饮食。雄性及雌性创始鼠在幼崽被采集后不久于禁食状态下处死。与两个父本组交配的雌性在体重、肥胖程度、空腹血糖、胰岛素和HOMA-IR方面无差异（补充表1）。仅纳入窝产仔数为9–16只的幼崽，并在第1天按父本组将窝仔标准化为12只，以控制宫内及出生后营养。每只父本随机选择一只后代，获取其表型数据（体重、特定生长率、葡萄糖耐量、胰岛素耐量、死后检查）。第13周处死动物，从5只HFD和6只对照后代（各来自不同父本）中分离胰岛。第14周处死幼崽进行胰腺组织学及死后分析。


    每周监测体重和能量摄入，后者通过收集并称量24小时后剩余食物获得。能量摄入在每笼3–4只动物之间取平均值，以减少应激。计算特定生长率（SGR；两个时间点间的体重增加除以上一测量时的体重^1）和能量效率（两个时间点间的能量增加除以能量摄入）。


    ### 葡萄糖测量。


    测定了血糖（Accu-Chek Advantage血糖仪；罗氏）、血浆瘦素和胰岛素（Linco放射免疫测定）、血浆NEFA（Wako）和甘油三酯（罗氏比色酶法）。


    ### 葡萄糖耐量试验。


    葡萄糖耐量试验在过夜禁食15小时后进行，胰岛素耐量试验在移去食物2小时后进行。葡萄糖（2 g kg−1体重）和胰岛素（Actrapid，诺和诺德；父本为1
    U kg−1，后代根据其预测的胰岛素抵抗程度为0.5 U kg−1）经腹腔注射。为减少采血相关应激，另一批幼崽在6周龄时接受葡萄糖耐量试验，用于血糖和血浆胰岛素测定。


    ### 免疫组织化学和形态计量分析。


    每只动物取3张固定的胰腺切片（5 μm），间隔200 μm，用豚鼠抗胰岛素多克隆一抗染色，随后使用山羊抗兔免疫球蛋白二抗（DAKO）。相邻切片用苏木精和伊红染色。所有载玻片使用Aperio
    ScanScope XT Slide Scanner扫描。使用ImageJ 1.40软件（http://rsb.info.nih.gov/ij/）测定胰腺、胰岛和β细胞面积。胰岛分为小（1–5,000
    μm^2）、中（5,001–10,000 μm^2）和大（>10,000 μm^2）三类。


    ### 胰岛分离。


    大鼠过夜禁食后，通过插管麻醉大鼠的胰管^27，采用标准技术采集胰岛。


    ### 胰岛转录组学。


    Affymetrix探针组数据使用稳健多阵列平均（RMA）方法^28进行标准化，该方法对低表达水平基因的差异表达估计可能产生衰减，但具有较高精度。使用单因素方差分析比较基因表达水平。在未调整的P
    < 0.001、P < 0.01和P < 0.05水平下，分别得到77、642和2,492个差异表达基因。根据基因本体论术语对差异表达基因（P < 0.01）进行功能注释，并使用DAVID^29计算富集术语（补充图1）。此外，我们基于欧几里得距离对差异表达基因进行了层次聚类^29，以寻找可能共同调节影响胰岛代谢的通路。我们还将P
    < 0.05的差异表达基因映射至KEGG^30。


    ### 定量RT-PCR。


    使用miRNeasy Mini试剂盒（Qiagen）提取总胰岛RNA（每只父本一个后代；n = 5，HFD；n = 5，对照），作为互补DNA合成的模板，使用SuperScript
    III第一链合成试剂盒（Invitrogen）和随机六聚体引物。使用定量RT–PCR（Stratagene Mx3000P；安捷伦）测定mRNA表达，引物序列见补充表4，使用Platinum
    SYBR Green SuperMix UDG（Invitrogen），以β-肌动蛋白为参照进行标准化。


    ### 使用 ingenuity 通路分析生成分子网络。


    通过Ingenuity通路分析（Ingenuity Systems，http://www.ingenuity.com）生成网络。简言之，使用P < 0.01或P
    < 0.05的差异表达基因及其相应的倍数变化；每个网络的网络数和符合条件的分子数分别限制为25和35。网络基于其连通性算法生成，并按分数（右侧Fisher精确检验结果的负指数）排序。分子表示为节点，两个节点之间的生物学关系表示为边（线）。节点使用多种形状显示，代表基因产物的功能类别，而边描述节点之间关系的性质，如Ingenuity
    Systems所定义。


    ### 通过亚硫酸氢盐测序进行DNA甲基化分析。


    亚硫酸氢盐处理按所述^40进行。将1微克NaOH变性DNA包埋在2%低熔点琼脂糖溶液中；加入亚硫酸氢盐溶液（Sigma），然后在50 °C避光孵育4小时。用Wizard
    DNA Clean-Up系统（Promega）终止处理，并用50 μl 1 mM NaOH洗脱DNA。使用引物进行PCR扩增：5′-TTTAAAATTTTAAATTTAAAATTGGAGG-3′（正向），5′-AATTAAAAAACCCCTAAAATTCAAAATACTAAC-3′（反向）。所得PCR片段使用MinElute凝胶提取试剂盒（Qiagen）纯化，并使用TOPO
    TA克隆试剂盒（Invitrogen）克隆到pCR-TOPO载体中。培养单个克隆，并使用PureLink Miniprep试剂盒（Invitrogen）纯化质粒。对于每个样品，在Ramaciotti中心使用ABI
    3730xl DNA分析仪平台上的T7引物对8至9个克隆进行测序。结果使用MethTools 2.0分析。


    ### 统计分析。


    结果以平均值 ± 标准误表示。P < 0.05被认为具有统计学显著性。


