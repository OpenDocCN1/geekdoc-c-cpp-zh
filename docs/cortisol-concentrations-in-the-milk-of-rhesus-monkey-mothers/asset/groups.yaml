  mdcn: "\n![](img/8e929f63d67ad563cea21a4a5b22eea4_10_0.png)\n\n## 健康\n\n### 可食用的建议\n\
    \n*饮食相关疾病是当今最大的杀手之一。我们能否通过调整食物摄入来预防这些疾病？大型国际项目正在开展，以寻找答案。*\n\n**作者：法鲁克·艾哈迈德**\n\
    \n“饮茶过多会使女性患癌风险增至三倍”“茶可降低卵巢癌风险”。这只是相互矛盾的报纸标题中的两个例子，这些标题让公众对食物的健康益处——或风险——以及真正的营养相关研究感到困惑。\n\
    \n对于糖尿病等某些疾病，其与食物的联系较为微妙。英国医学研究理事会流行病学部门负责人 Nick Wareham 解释说：“尽管我们知道饮食因素与糖尿病风险有关，但关于究竟哪些微量营养素或宏量营养素与该疾病相关，各项研究之间存在许多不一致。我们在数据方面相当有限。”\n\
    \n利用新工具和新方法，一些雄心勃勃的项目正在开展，以弥补这一不足。其中一项由 Wareham 协调的工作是 InterAct——一项跨国研究，旨在明确饮食和生活方式如何影响\
    \ 2 型糖尿病风险。这种血糖调节障碍在欧洲日益成为问题，近40%的人口在一生中某个阶段会受其影响。InterAct 估计，糖尿病占欧洲医疗保健费用的比例高达10%。\n\
    \n通过 InterAct 等努力，研究人员正开始揭示遗传、饮食和疾病之间复杂的相互作用，并为纷繁混乱的营养信息带来秩序。\n\nInterAct 始于2006年，是欧洲共同体第六框架计划的一部分。该项目预算为1000万欧元，涉及10个国家（欧洲9国加印度）的逾1.2万名新近确诊的糖尿病患者。如此广泛的队列很重要。Wareham\
    \ 说：“有时一个国家内部的差异并不那么大。”“国际性努力能带来患者生活方式的异质性，尤其是在饮食方面，这是一个主要优势。”这种多样性为科学家提供了更多可研究的变量，帮助他们试图厘清哪些因素导致了疾病。\n\
    \n### 规模越大，优势越大\n\n这项研究是有史以来规模最大的饮食与疾病研究——欧洲癌症与营养前瞻性调查（EPIC）的一部分。EPIC 始于1992年，已招募超过50万人。参与者在23个中心之一接受体检，完成包括详细饮食问卷在内的生活方式调查，并接受血液检测。他们的\
    \ DNA 会被扫描以寻找疾病相关基因，所用技术可在大量个体中检测数十万个遗传变异。\n\nWareham 说：“大型项目确实可以成为催化剂，促使多个中心汇聚起来共享仪器。”“InterAct\
    \ 从庞大的 EPIC 队列以及对这些技术的使用中受益匪浅。”\n\n另一项大型研究是 Interheart——它与 InterAct 类似，但不属于 EPIC——考察了饮食模式与心脏病发作风险之间的联系。1999年至2003年间，这项由加拿大牵头的研究在六大洲52个国家招募了5,761名患者和10,646名对照受试者。各团队利用问卷、体检和血液分析，汇编了受试者的数据，包括人口学信息、饮食、体重指数等人体测量指标，以及胆固醇和脂蛋白等生物标志物水平。\n\
    \nInterheart 研究人员得出结论：西方模式饮食的全球化——即动物制品、油炸食品和咸味零食含量高——造成了全球三分之一的心脏病发作风险。¹ 无论身处何地，富含水果和蔬菜的谨慎饮食都能降低风险。在\
    \ Interheart 之前，很少有流行病学研究将不同族裔人群和文化中的饮食模式与疾病联系起来。营养遗传学家 Jim Kaput 说，像这样的研究“至关重要——如果我们真的想理解这些疾病的话，因为它们在欧洲和其他人群中表现不同”。他还担任美国食品药品监督管理局个性化营养与医学部主任。\n\
    \n### 交叉通路\n\nInterAct 和 Interheart 都表明，处于饮食相关疾病（如糖尿病和心血管疾病）核心的代谢通路密切相关。原因之一是，发现一种疾病的线索可以揭示另一种疾病。\n\
    \nWareham 指出：“血压、胆固醇和甘油三酯水平等因素可预测冠心病，同时也与糖尿病相关。”\n\n生菜和菠菜等叶菜是谨慎饮食的核心组成部分，也是 Interheart\
    \ 研究确定的成分。这些蔬菜富含多不饱和脂肪酸（PUFAs）——这是一类必需宏量营养素，也存在于某些鱼类、坚果和奶酪中。其中，omega-3 和 omega-6\
    \ 这两类 PUFAs 是强有力的膳食成分，因为它们能直接和间接地改变基因表达。俄勒冈州立大学的营养科学家 Donald Jump 研究这些宏量营养素，他说\
    \ PUFAs“更像激素，而不是典型食物”。\n\n例如，PUFAs 有两种方式调节基因活性并降低肝脏中的脂肪酸和甘油三酯水平：它们可以结合并激活一个名为过氧化物酶体增殖物激活受体（PPARs）的转录因子家族，从而加速脂肪酸分解；PUFAs\
    \ 还能消耗另一种转录因子——甾醇调节元件结合蛋白-1——从而抑制脂肪酸合成。这种双管齐下的作用带来了显著的健康益处。Jump 解释说：“与胆固醇一样，甘油三酯升高是防治动脉粥样硬化、心血管疾病和中风的常见靶点。”\n\
    \n尽管大多数关于 PUFAs 的研究都集中在其与心血管疾病的关联上，但 Jump 的团队通过操控一种参与脂肪酸代谢的酶，证明 PUFAs 还能平衡血糖水平，这提示其可能成为\
    \ 2 型糖尿病的治疗方法。\n\nJump 说：“膳食 omega-3 通常不被视为高血糖的治疗手段。”然而，通过研究饮食及其对代谢通路的影响，这类关联正不断被发现。\n\
    \n在饮食和代谢之后，饮食相关疾病发生的第三个要素是基因组。Jump 说：“在人类中，遗传背景在是否对特定营养素反应良好方面发挥作用。”将全球遗传多样性纳入其中，大大增加了研究的复杂性。国际\
    \ HapMap 计划是一个遗传变异数据库，始于2002年，存储来自加拿大、中国、日本、尼日利亚、英国和美国的数据。迄今为止，该项目已鉴定出数千万个与疾病和药物反应相关的单核苷酸多态性（SNPs）。受\
    \ PUFAs 调控的 PPAR 基因中的 SNPs 影响诸多方面，其中包括减重能力，而减重是控制糖尿病的关键一步。尤其是一个 SNP 被发现可解释人们减重差异的7%。\n\
    \n## 有风险的食物\n\n某些食物类型含量高的饮食会增加心脏病发作风险。\n\n![](img/8e929f63d67ad563cea21a4a5b22eea4_11_0.png)\n\
    \n来源：Interheart 研究。*无显著关联。\n\n2010年，InterAct 在寻找可揭示肥胖和运动在糖尿病发病风险中作用的标志物过程中，招募了第一万名受试者。对他们的基因组分析将于2011年发表，Wareham\
    \ 相信这种方法将揭示新的相互作用。他说：“我们正在采用大规模发现式方法。我们不太关注特定基因的表达，而是关注先天易感性与饮食和生活方式因素之间的相互作用。”\n\
    \n这样的关联将填补我们知识中的空白。Wareham 沉思道：“假设而言，饮食和生活方式因素的全基因组影响，或许可以解释我们在糖尿病中观察到的、基于简单遗传变异仍无法解释的遗传率。”细微变化会淹没在标准单基因研究的背景噪声中。但它们确实有影响——尤其是对我们定义疾病的方式以及临床试验设计方式的影响。Kaput\
    \ 说：“在判定我们是否患病时，遗传学家一直把我们所有人当作硬币来对待：正面还是反面——你患还是不患糖尿病？许多研究就是这样设计的。”\n\n我们需要以承认基因贡献的新方式来解释疾病。\n\
    \n## 发展中国家的营养基因组学\n\n*扭转健康与营养的关系。*\n\n随着全球化将高脂快餐饮食输出到世界各地，许多发展中国家营养不良问题猖獗。据无国界医生组织称，在发展中国家，营养不良占五岁以下儿童死因的60%。既能提供营养又能治疗疾病的新技术可能挽救数百万人的生命。\n\
    \n正是这一严峻现实促使 Raymond Rodriguez 发起全球健康共享倡议（GHSI）。加州大学戴维斯分校营养基因组学卓越中心主任 Rodriguez\
    \ 解释说：“我们开始关注种族、族裔和经济弱势群体中的健康差异。往往最需要食物和药物的人却最后才能得到它们。”\n\n缺乏适当营养会为疾病打开大门。GHSI\
    \ 的 Somen Nandi 说：“营养不良者免疫力下降，因此疫苗效果较差。”这种新思路的一项切实益处是，正在开发一种新型稻米基质，作为霍乱和腹泻疫苗的递送载体。这既有助于为营养不良者提供营养支持并增强其免疫力，又能使其获得针对这些疾病的免疫保护。\n\
    \n![](img/8e929f63d67ad563cea21a4a5b22eea4_11_1.png)\n\nGHSI 的疫苗开发项目也认识到其中涉及的经济因素。Rodriguez\
    \ 和 Nandi 的宏伟目标是帮助在腹泻性疾病流行的国家（如孟加拉国）建立可持续经济。他们希望在资源有限的国家确定并开发可用于治疗药物配制、生产和分销的场地。\n\
    \nRodriguez 说：“我们认为，GHSI 将为未参与全球经济的40亿人创造机会，让他们享有更好的健康和更高的生活水平。”因此，营养基因组学研究的成果不仅能帮助西方人应对过度饮食，还能为发展中国家的贫困人口带来更好的生活。\n\
    \n**NATURE.COM**  \n**查看关于饮食与疾病的最新研究**  \n`go.nature.com/cthpue`\n\n"
