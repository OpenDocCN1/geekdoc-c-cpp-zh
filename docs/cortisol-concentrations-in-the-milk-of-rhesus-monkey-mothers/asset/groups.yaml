    # # DEVELOPING WORLD NUTRIGENOMICS


    *Reversing the health and nutrition relationship.*


    As globalization is exporting fatty fast-food diets around the world, malnutrition
    is rampant in many developing countries. According to Médecins Sans Frontières,
    malnutrition causes 60% of deaths in children under the age of five in developing
    nations. New technologies that provide nourishment while treating diseases could
    save millions of lives.


    That’s the stark reality that led Raymond Rodriguez to launch the Global HealthShare
    Initiative (GHSI). “We started to look at health disparities in racial, ethnic
    and economically disadvantaged communities,” explains Rodriguez, director of the
    Center of Excellence for Nutritional Genomics at the University of California,
    Davis. “Often the people who need food and drugs the most are the last to get
    them.”


    Lack of proper nutrition opens the door to disease. “Malnourished individuals
    have reduced immunity, and thus vaccines are less effective,” says Somen Nandi
    of GHSI. One tangible benefit of this new way of thinking is a novel rice-based
    matrix in


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_11_1.png)


    development as a delivery base for a vaccine against cholera and diarrhoea. This
    could help sustain the malnourished and bolster their immunity, while immunizing
    against the diseases.


    GHSI’s vaccine development projects also recognize the economic factors involved.
    Rodriguez and Nandi’s ambitious goal is to help create sustainable economies in
    countries where diarrhoeal diseases are prevalent, such as Bangladesh. They hope
    to identify and develop sites in resource-limited countries where therapeutics
    can be formulated, manufactured and distributed.


    “We think that GHSI will create an opportunity for the four billion people who
    are not a part of the global economy to enjoy better health and a better standard
    of living,” says Rodriguez. Thus the fruits of nutrigenomics research could not
    only help Westerners cope with a diet of excess, but also bring better lives to
    the impoverished people in developing nations.'
