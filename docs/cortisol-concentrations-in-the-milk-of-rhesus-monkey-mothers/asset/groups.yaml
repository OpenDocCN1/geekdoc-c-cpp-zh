    BMI and waist than CC subjects. Similar results were found for rs1801260 in which
    minor allele carriers also showed the highest BMI values. These differences remained
    statistically significant after additional adjustment for sex, age, treatment
    centre and initial BMI (Figure 2). For rs4580704, the trend was the opposite;
    subjects homozygous for the minor allele showed lower values for weight, waist
    and WHR than non-carriers.


