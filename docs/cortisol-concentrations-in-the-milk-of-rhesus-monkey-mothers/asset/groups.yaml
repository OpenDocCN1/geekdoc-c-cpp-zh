    # MILK AND STARCH CONSUMPTION


    Global distribution of genes related to ability to digest starchy foods and lactose
    in milk.


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_15_0.png)


    components of our diet, and their metabolic products profoundly influence our
    physiology,” says Jeffrey Gordon, a microbiologist at Washington University in
    St Louis, Missouri. “It’s like bringing a set of utensils to a dinner party that
    the host does not have.”


    Nicholson has already found some compelling evidence that genes expressed by the
    gut flora have effects that reach far beyond the digestive tract. “We’ve found
    deep compartmental connections between microbial status and bile acid metabolism,”
    he says, “[And] there are some staggering connectivities between blood pressure
    and gut microbial metabolites.”


    Research from Gordon’s lab has shown there are differences in the sets of bacterial
    species that reside in the guts of individuals, even identical twins. “Certainly
    less than 10% — and it might even be less than 2%—of the bugs that are in you
    are also in me,” says Nicholson. Gordon and others are confident that the impact
    of cultural variation is at least as strong.


    Our understanding of the genetic basis of even relatively well-characterized phenomena
    pertaining to dietary variation, like lactase persistence, could be confounded
    by the impact of these commensals. “There are Chinese students who come to the
    West who can drink quite a lot of milk even though they come from a genetic background
    where they’re not lactase persistent,” says Swallow. “We think that’s due to adaptation
    of the intestinal flora.” It also appears possible that the considerably smaller,
    but potentially equally diverse, microbial communities in our mouths may play
    an important role in the early stages of meal digestion, as indicated by a recent
    study that suggests oral bacteria may facilitate the processing of wheat gluten.


    down these complex changes will require alternative allele-hunting tactics.


    # A TANGLED WEB


    University of Chicago geneticist Anna Di Rienzo recently tried to identify allelic
    variants that differ in frequency among populations residing in similar geographic
    regions or ecosystems but who have distinct diets or modes of subsistence, such
    as farming or foraging. Through this approach, her team uncovered various hints
    of genetic adaptation in carbohydrate metabolism and folate production, associated
    with the adoption of diets based on roots and tubers. Conversely, cultures with
    a cereal-rich diet were more likely to produce a truncated, hyperactive version
    of PLPR2 — an enzyme responsible for breaking down plant glycolipids — than their
    non-cereal-consuming counterparts. “There is a consistent frequency shift between
    populations,” says Di Rienzo. “The stop codon [in PLPR2] occurs always at higher
    frequencies in populations that have a cereal-rich diet compared to populations
    that don’t and yet live in the same geographic region.”


    Yet it remains a challenge to piece together such minor genetic variations scattered
    throughout the genome. “These aren’t mutations that will knock you dead,” says
    Di Rienzo. “They make subtle changes to gene function or expression, and detecting
    those subtle changes can really be quite hard.”


    For more recent adaptations, the mutations can also be very rare, making it difficult
    to detect clear patterns. Even when the data seem to suggest the presence of selective
    pressure behind a given variant, it is essential to have a solid understanding
    of the cultural history of the region to eliminate demographic biases. “If a lot
    of the individuals you’ve tested have the same great-grandparents, it’s quite
    a different story from if they were relatively unrelated,” explains Swallow.


    Most importantly, studies need to demonstrate clear functional contributions from
    a particular variant or subset of variants, and arrive at plausible reasons for
    why these changes are adaptive in some cases but not in others. “We want to know
    what the biology is that’s being affected by these unusual patterns,” says Stoneking.
    “How many of them are real, and how many are false positives, and what are the
    underlying stories? That’s sort of where the field is a bit stuck at the moment.”


    # IT TAKES A COMMUNITY


    Clearly, scouring for signals of recent evolution amid the tens of thousands of
    interconnected human genes and regulatory regions can be compared to finding the
    proverbial needle in the haystack — but what if that haystack is far bigger than
    most people think?


    Jeremy Nicholson, a biological chemist at Imperial College London, points out
    the tremendous diversity of the intestinal microbial flora, citing a report in
    2010 which showed that Europeans each carry a complement of at least 160 bacterial
    species, with more than 536,000 bacterial genes between them — well over 20-times
    the human gene count¹. “It actually should be thought of as a mult cellular organism
    — an organism with a very large genome,” he adds.


    Even with our limited understanding of the microbial communities that thrive in
    our digestive tract and elsewhere in the body, it’s increasingly clear that their
    net genomic output is inextricably linked with our own metabolic function, and
    the composition and activity of these communities is a direct by-product of our
    environment, culture and diet. “The gut microbial community can be viewed as a
    metabolic organ — an organ within an organ; they sense, adjust to, and process


    Since most striking findings comes from a recent study by a team at France’s Centre
    National de la Recherche Scientifique, presenting strong evidence that Japanese
    individuals can digest seaweed carbohydrates more efficiently⁴. This was made
    possible by an ancestral gene transfer event from kelp-borne bacteria that endowed
    their gut flora with the capacity to produce porphyranase and agarase enzymes.
    This adaptation is seemingly absent in North Americans who have not historically
    consumed raw kelp. Microbe-watchers like Nicholson suggest that this study could
    be a strong indicator of the future, as the research community begins to come
    to terms with the extent to which human genetic effects on diet might be overwhelmed
    by the bacteria we carry. “It’s a piece of genius,” he says. “It’s something I
    use in my slide presentations now to worry geneticists.”


    Michael Eisenstein is a journalist in Philadelphia.


