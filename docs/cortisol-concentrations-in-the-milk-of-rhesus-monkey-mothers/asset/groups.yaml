    # HISTORY


    # The changing notion of food


    The pioneers of nutrition research determined the energy content of food and also
    helped to overturn misconceptions about various diseases that plagued humankind.


    **BY NED STAFFORD**


    Nutrigenomics — and the rest of modern nutrition science — stand on foundations
    laid in the late eighteenth century.


    That is not to say nobody had taken an interest before then in how food works.
    The ancient civilizations of Egypt, Greece, Rome, Persia, China and India were
    aware of a link between food and health. “They all had their food rules, many
    of which are still valid today,” says Claus Leitzmann, a human nutritionist at
    the University of Giessen in Germany. “The ancient Egyptians used garlic medicinally.”


    Some of our food-truths hark back millennia. The ancient Greek physician Hippocrates
    recommended that food should be thoroughly chewed before swallowing, and consumed
    in moderation to maintain good health. In the Middle Ages, the German nun and
    Christian mystic Hildegard of Bingen “knew a lot about food”, says Leitzmann.
    “She made some very intelligent recommendations,” such as eating cooked rather
    than raw foods.


    But before the eighteenth century there was little scientific investigation into
    the composition of food or how the body processes


    it. The researchers of the time were “dependent on experimental observation”,
    says Leitzmann. Their method was ‘feed and watch’. It was French chemist Antoine
    Lavoisier, regarded as the father of modern chemistry, who first conducted the
    research that led to today’s science of nutrigenomics.


    # FOOD AS FUEL


    Lavoisier was one of the first scientists to design laboratory equipment to test
    what happens to food after it is swallowed. Before his work, scientists knew that
    the weight of ingested food exceeded the weight of excreted faeces and urine.
    They attributed this loss to perspiration. But Lavoisier believed that food was
    fuel and that the body, like the fuel-burning engines being developed at the time,
    must explode carbon dioxide as a product of combustion. He suspected that exhaled
    carbon dioxide accounted for this lost matter.


    To test his theory, in the early 1780s Lavoisier invented a new type of device
    — the ice calorimeter. It was composed of an outer shell packed with ice, to maintain
    a constant temperature of 0 °C, encasing a chamber housing a guinea pig. The animal’s
    body heat melted the ice. By weighing water flowing out of the calorimeter, Lavoisier
    was able to estimate


    metabolic heat and compare it with the heat produced by a lit candle or burning
    charcoal.


    His theory proved correct. Lavoisier declared: “respiratory gas exchange is a
    combustion like that of a candle burning.”


