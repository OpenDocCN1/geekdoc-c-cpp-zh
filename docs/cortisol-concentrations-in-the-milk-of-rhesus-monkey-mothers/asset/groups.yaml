    # DEVELOPMENT


    # Mother’s milk: A

    rich opportunity


    *Research on the contents of milk and how breast-feeding benefits a growing child
    is surprising scientists.*


    **BY ANNA PETHERICK**


    Should you ever need to mix formula milk for a tammar wallaby, you will face a
    complicated recipe. During its 300 days in the pouch between birth and weaning,
    the baby wallaby, or joey, drinks different milk on a weekly basis.


    Early on, the joey needs colostrum, which is packed with antibodies. After 60
    days, the formula should be rich in asparagine-containing peptides, which are
    thought to help brain development. Ninety days later, the baby wallaby will need
    a dose of sulphur-containing amino acids, such as cysteine and methionine, which
    will cause hair follicles and nails to grow.


    For healthy development, the number of calories contained in the milk must also
    rise, such that the joey is weaned from milk that is four and a half times as
    energy rich as the liquid it first drank. This compositional sequence appears
    to be entirely dictated by the mother’s body. And, bizarrely, her teats can function
    independently, with each baby wallaby effectively stuck to one teat for the first
    300 days in the pouch. In fact, a joey may have a pouch


    mate of a different age that feeds on an adjacent teat — and which receives milk
    of a different composition, appropriate for its age¹.


    Unlike a wallaby’s, human milk does not change so radically over time because
    the developmental signals, which wallabies transfer in milk, can be delivered
    through the human placenta. The major constituents of human milk — the fat, protein
    and carbohydrate — vary little over the course of lactation. But a closer analysis
    reveals important time-dependent variation in the complement of bioactive ingredients
    in human milk — the molecules and cells that have biological functions beyond
    fuelling metabolism and providing the raw materials for infant growth. Finding
    what these ingredients are and what they do drives much of today’s lactation research.


    # A MAMMALIAN MIXTURE


    Until recently, the study of human lactation was conceived mainly from the perspective
    of public health. Now the trend is to approach the subject from an evolutionary
    standpoint. This perspective presumes that an infant should breastfeed as much
    as possible to maximize its chances of survival, whereas a mother must balance
    her current metabolic investment in milk production with her potential investment
    in future offspring.


    For example, evolutionary theory suggests that mothers should invest more in feeding
    sons because a successful son can produce many more offspring than a daughter.
    Several recent studies support this view by identifying clear differences in the
    breast milk consumed by males and females. In humans, for example, baby boys receive
    milk that has substantially more fat and protein than the milk girls get².


