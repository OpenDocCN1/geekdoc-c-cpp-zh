    ## 细节中的魔鬼


    大规模表型分析是一项艰巨的工作，且耗资巨大。资源有限的研究人员有两种选择：以较低细节测量许多人，或以更高细节测量较少的人。大规模人群研究具有更强的统计效力，但由于最终目标是个性化营养，对个体的研究将提供更深入的信息。


    这是都柏林大学学院食品与健康研究所所长 Mike Gibney 面临的一个难题。“一项研究中人数太多会使数据趋于平滑，而且在需要如此多测量指标的时代成本太高，”他说。Gibney
    认为我们正处于向个性化营养过渡的阶段，并主张暂时放弃“个体”这一口号。相反，人们应根据生物标志物被划分为更宽泛的类别，这些生物标志物例如可指示不同糖类或蛋白质的代谢效率。“我正在把研究转向聚类方向，”他说。“我认为这是一种折中方案。”这些更宽泛的分组具有包含更大规模人群的优势，并可作为概念验证。


    > “终于，布丁里有了证据——饮食建议中的遗传差异是相关的。”


    支持这些聚类概念的结果正在涌现。Kenneth Kornman 是 InterLeukin Genetics（ILG）的创始人，这是一家总部位于马萨诸塞州的公司，基于单核苷酸多态性（SNP）开发影响食物代谢的基因检测。Kornman
    最近重新分析了 Christopher Gardner 及其斯坦福大学同事 2007 年的一项研究。在 Gardner 的研究中，311 名女性被随机分配到四种碳水化合物含量不同的饮食中。12
    个月后，采用低碳水、高蛋白阿特金斯饮食的女性体重下降最多。


    Kornman 的重新分析将其中 101 名女性（可进行随访研究者）归入三组之一，分组依据是与膳食脂肪和碳水化合物代谢相关的三个 SNP。‘脂肪敏感’组女性共有一种
    SNP，使她们在高脂饮食下比‘碳水化合物敏感’组女性增重更多，反之亦然。第三组对脂肪和碳水化合物均不敏感。“我们公司筛查了已发表的 200 多个 SNP 的证据，并确定这三个是唯一符合我们标准的
    SNP，”Kornman 说。这些标准是：每个 SNP 至少应有三项验证性临床研究，应具有功能性（直接与生物学或临床效应相关），并与体重相关。


    Kornman 发现，采用与自身基因型匹配的饮食的女性，其体重下降幅度是采用不匹配饮食者的两到三倍。这项由 ILG 赞助的研究在旧金山举行的 2010 年美国心脏协会联合会议上公布。“听众中的科学家们感到震惊，”荷兰应用科学研究组织及
    NuGO 主任 Ben van Ommen 回忆道，他曾邀请 Kornman 发言。他说，Kornman“受到了听众的严格审视，并经受住了考验。终于，布丁里有了证据——饮食建议中的遗传差异是相关的。”


    ### 食物部落


    要迈向营养谱系中更个性化的一端，将需要来自许多不同群体的数百万个额外数据点。从不同人群收集信息的一种方法是使用众包技术。许多已发现更多或全部遗传信息的人，正通过
    SNPedia、DIYGenomics 和哈佛医学院个人基因组计划等网站分享或提供这些信息以供分析。随着基因组检测变得更便宜，将会有更多数据可以以这种方式使用。


    个人基因组信息分享网站的创始人，例如 DIYGenomics 的 Melanie Swan，表示他们可以通过提供一种吸引受试者的新科研方式来促进这一数据收集过程。“我们的目标是让个人有机会参与公民科学研究，”Swan
    说。“关键就在于进行实验，并找出最适合你的方法。”


    一项典型实验可能会研究维生素补充剂及其前体。参与者将同意定期服用补充剂，自费进行基因测序检测，向经批准的实验室提交定期检测，并将结果上传到网站。将所有参与者的数据结合起来，可以描绘出某些基因与维生素或维生素前体对健康影响之间的关系。DIYGenomics
    的第一项研究——已提交给同行评审期刊——是一项概念验证，扩展了关于基因突变和维生素 B 缺乏的现有研究。另一项关于衰老的研究已完成设计，并准备招募参与者。


    这种新的研究方法模糊了研究组织者与参与者之间的界限。“我们都设计研究，也都参与其中。我们也有自己的知情同意流程，”Swan 说，并补充说，她看到一种‘公民伦理学家’版本的希波克拉底誓言正在演变，以适应新的研究开展方式。


    ### NATURE.COM


    **更多关于技术如何影响临床试验的内容**

    go.nature.com/07K55S


    有些人将个人基因组学视为社交网络的合理延续和宝贵资产。“公民科学方法肯定有潜力，”孟菲斯大学传播学研究员 Marina Levina 说。然而，Levina
    也提出了几点告诫。“公民科学暗示传统科学在某些方面辜负了我们，而我认为，那些或许会拖慢传统科学的指南和限制之所以存在，是因为存在合理的伦理问题。”


    还有其他潜在陷阱。提供基因组分享网站的基因检测公司因提供不一致的结果和关于疾病遗传倾向的薄弱诊断而受到批评。有迹象表明，美国食品药品监督管理局正采取行动限制它们，或许会通过执行更严格的监管。这与美国和欧洲正在进行的营养补充剂行业监管变化相呼应，该行业将更多地被当作制药行业来对待。


    在制定量身定制的营养建议时，基因并不是唯一重要的考虑因素。新兴的表观遗传学描述了基因在体内如何以及何时被开启和关闭，它预示着通往个性化营养的道路将既复杂又令人沮丧。


    ILG 的 Kornman 说，在确定最佳饮食方面，表观遗传学是房间里的大象：“越来越多的证据表明，产前营养和环境效应在胎儿发育和幼儿期营养方面具有终身、甚至可能跨代的影响。”即使我们能够解码饮食—健康关系的遗传配方，如果对生命早期——或母亲、或许祖母一生中——形成的表观遗传修饰没有更多了解，这个配方仍可能味道不对。


    此外，我们究竟能否克服对甜、脂肪和咸味食物的喜爱？“人们在饮食选择上很反常，”伦敦国王学院营养与饮食学负责人 Tom Sanders 说。“他们往往会用自己认为不好的食物来抵消自己认为好的食物。”换句话说，我们不擅长吃好食物，却很擅长吃坏食物。


    营养基因组学很可能改变我们对健康和疾病的定义；模糊食物与药物之间、实验者与受试者之间的界限；并展示由食物部落、公民科学家和在线社交网络驱动的新科学方法模型。悖论在于，随着我们的生活方式变得越来越个性化，可能正是群体才能为健康饮食提供最佳建议。


    *Arran Frood 是英国的自由撰稿人。*


