    regulated by dietary AA and DHA and also encodes an enzyme that catalyses metabolism
    of these two acids. One specific variant of the FADS2 gene was present in more
    than 90% of the cohort in the study. Researchers found that only the breastfed
    babies who had this specific FADS2 variant exhibited an IQ advantage. The research
    implies that fatty acid metabolism could be part of the missing link between breastfeeding
    and IQ. This FADS2 variant was estimated to account for a difference of 4.1 IQ
    points, which goes a long way towards explaining the 5.9 IQ points difference
    found in the PROBIT trial.


    Tests point to higher IQ in breast-fed children.


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_6_1.png)


    Donovan and Chapkin''s study is the first evidence that breast milk — rich in
    natural bacteria — affects infant gene expression, and Donovan cautions about
    over-interpreting their findings. This is, however, likely to be an expanding
    area of research as probiotics become more commonly used as ingredients in formula
    milk. ''We have no idea how these are potentially affecting gene expression,''
    says Donovan.


    Over the years, the ''breast versus formula'' debate has become polarized, and
    several researchers contacted for this article complained that either breastfeeding
    advocacy groups or formula companies had exaggerated their findings in the past.
    Donovan''s recent gene expression study was sponsored by a formula milk manufacturer,
    but she is applying for US National Institutes of Health funding for further studies
    to avoid the criticism that comes with being commercially funded.


    ### HEALTH CONTROVERSIES


    Researchers have tried to disentangle the effects of feeding an infant formula
    rather than breast milk. ''The vast majority of studies tend to gravitate towards
    breast milk as better, rather than equal, but the evidence varies in quality,''
    says Jonathan Wells, who studies human ecology at University College London. ''Many
    of the accepted benefits of human milk relate to avoiding pathogens. And while
    these pathogens might be less dangerous to a baby in a more medically advanced
    society than in a developing one, breast milk still offers advantages to all infants.
    Breastfeeding has consistently been found to protect against necrotizing enterocolitis
    (in which portions of the bowel tissue die) in pre-term infants, and against diarrhoea
    and ear infections in full-term infants.''


    Impacts on health in later life stand out less clearly in the data, although associations
    between formula feeding and type 2 diabetes and inflammatory bowel disease have
    been observed. Some meta-analyses report that breastfeeding reduces the chance
    that a child will be obese at school age by about 20%. But these results are not
    conclusive. The largest breastfeeding trial, Promotion of Breastfeeding Intervention
    Trial (PROBIT), found no difference in the plumpness of two groups of six-and-a-half-year-old
    Belarusian children, where one group had been breastfed for much longer before
    the introduction of formula milk².


    ### WHAT''S IN HUMAN MILK


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_7_0.png)


    There was also no difference between these groups in the prevalence of asthma
    or allergies³. PROBIT did, however, show an intriguing link between breastfeeding
    and intelligence (see Brainy Babies, page S6).


    The breastfeeding–IQ association had been reported before, but what made PROBIT''s
    results important is the size of its dataset. It is critical to have a very large
    sample size in order to eliminate confounding factors. Qualities such as obesity
    and IQ often vary across rich countries in similar patterns to the tendency of
    mothers to breastfeed. In developed countries, wealthier women are more likely
    to breast-feed — but they are also generally slimmer, better educated and spend
    more time talking to their babies.


    It might be that certain ingredients in formula milk are responsible for later
    weight issues. Results from the European Childhood Obesity Project support the
    ''early protein hypothesis'', which holds that higher levels of protein found
    in standard infant formula programme the body to become fatter in later years⁴.


    ### Human milk recipe for newborns — WEEK 2 ONWARDS


    **Mature milk**


    Nourishment for growth!


    - More milk

    - Less fat

    - Less whey protein


    **Method**


    - HMO† content should be at half initial level. IL-1β, IL-6, vitamins and carotenoids
    also substantially reduced.

    - Maintain concentration of lactose, IFN-γ, and casein.


    †Human milk oligosaccharides


    The project randomized 1,000 European infants to receive either formula of high-protein
    concentration (standard formula), formula of low-protein concentration (similar
    to the protein content of human milk), or breast milk. The result: unlike the
    high-protein group, the low-protein group grew no tubbier than the breastfed control
    group.


    The diverse ingredients of an infant''s first meal have an impact on its development,
    and no matter how much we tinker with the composition of formula milk, it will
    always lack many of the trace constituents of human milk. As research identifies
    these substances, it increasingly seems they serve a role beyond direct nutritional
    benefit: that of communicating information to the infant about the environment
    and even the social structure around the mother, which affects the richness of
    her diet and her level of physical activity and therefore also affects her milk.


    Wells believes that very young humans should be thought of as having to adapt
    to the mother''s surroundings, rather than to the wider world. Indeed, the fact
    that there are so many bioactive molecules in breast milk means that breast-feeding
    is an activity that empowers mothers. He adds, ''The more we learn about the details
    of breast milk, the more we realize that males have a little chance to influence
    their offspring by non-genetic pathways. Mothers have a very rich opportunity.''
    ■


    *Anna Petherick* is a journalist in Buenos Aires.


    - 1. LeBlanc, J. G. et al. *Genomics and Human Genetics* **11**, 219–238 (2010).

    - 2. Powe, C. E. et al. *Am. J. Hum. Biol.* **22**(1), 50–54 (2010).

    - 3. Sullivan, E. C. et al. *Developmental Psychology* DOI: 10.1038/jp.2043 (2010).

    - 4. Ward, R. E. et al. *Appl. Environ. Microbiol.* **72**(6), 4497–4499 (2006).

    - 5. Ruiz-Palacios, G. M. et al. *J. Biol. Chem.* **278**(15), 14112–14120 (2003).

    - 6. Chapkin, R. S. et al. *Am. J. Physiol. Gastrointest. Liver Physiol.* **296**,
    G892–G900 (2009).

    - 7. Kramer, M. S. et al. *Am. J. Clin. Nutr.* **86**, 1717–1721 (2007).

    - 8. Kramer, M. S. et al. *Br. Med. J.* **301**, 136–139 (2009).

    - 9. Koletzko, B. et al. *Adv. Exp. Med. Biol.* **646**, 15–29 (2009).

    - 10. Kramer, M. S. et al. *Arch. Gen. Psychiatry* **65**(5), 578–584 (2008).

    - 11. Caspi, A. et al. *Proc. Natl. Acad. Sci. USA* **104**(47), 18860–18865 (2007).

