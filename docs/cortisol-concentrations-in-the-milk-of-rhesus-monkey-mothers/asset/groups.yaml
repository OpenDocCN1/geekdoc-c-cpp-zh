    # Does breast milk make you smarter?


    Between late 2002 and the spring of 2005, 13,889 Belarusian children of about
    six years of age took an IQ test and had their reading and writing skills evaluated
    by teachers. The mothers of about half of them had been encouraged to breastfeed
    under a World Health Organization (WHO) programme called the Baby-Friendly Hospital
    Initiative. As a result, these mothers were seven times more likely to have exclusively
    breastfed until their child was 3-months old.


    Results of this study, called Promotion of Breastfeeding Intervention Trial (PROBIT),
    showed that the 6-year-olds whose mothers were part of the WHO initiative had
    better academic ratings from their teachers and IQ scores on average 5.9 points
    higher¹⁰. “PROBIT found lots of health benefits in the first year of life,” says
    Michael Kramer, an epidemiologist at McGill University in Montreal, Canada, “but
    over the longer term the only difference was cognitive ability.”


    No one is quite sure what causes this intelligence boost. But one 2007 study by


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_6_1.png)


    Duke University psychologist Avshalom Caspi has identified a candidate: a gene
    that appears to mediate the effects of human milk on brain development¹¹. Caspi
    and colleagues tracked the Kyoto Encyclopedia of Genes and Genomes (KEGG) database
    for genes involved in the


    metabolism of long-chain polyunsaturated fatty acids. These acids are linked to
    several aspects of neuron development. Two such fats — docosahexaenoic acid (DHA)
    and arachidonic acid (AA) — are present in human breast milk, but not in cows’
    milk or most infant formulas.


    The KEGG search identified a gene on chromosome 11, called FADS2, which is both
    regulated by dietary AA and DHA and also encodes an enzyme that catalyses metabolism
    of these two acids. One specific variant of the FADS2 gene was present in more
    than 90% of the cohort in the study. Researchers found that only the breastfed
    babies who had this specific FADS2 variant exhibited an IQ advantage. The research
    implies that fatty acid metabolism could be part of the missing link between breastfeeding
    and IQ. This FADS2 variant was estimated to account for a difference of 4.1 IQ
    points, which goes a long way towards explaining the 5.9 IQ points difference
    found in the PROBIT trial.


