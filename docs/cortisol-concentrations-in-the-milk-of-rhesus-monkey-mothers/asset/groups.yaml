  mdcn: "\n## 《自然·展望》\n\n### 营养基因组学\n\n![](img/8e929f63d67ad563cea21a4a5b22eea4_0_0.png)\n\
    \n### 食物如何塑造健康与进化\n\n![](img/8e929f63d67ad563cea21a4a5b22eea4_1_0.png)\n\n*封面图：*\
    \ NIK SPENCER\n\n- **增刊编辑**：Herb Brody\n- **副编辑**：Michelle Grayson\n- **文字编辑**：Tony\
    \ Scully\n- **制作编辑**：Donald McDonald\n- **美术编辑**：Wes Fernandes\n- **图片研究员**：Madeline\
    \ Hutchinson\n- **生产控制**：Emilia Orviss\n- **网络制作**：Terhi Raukko\n- **赞助**：Reya\
    \ Silao, Stephen Russell, Yvette Smith, Gerard Preston\n- **市场营销**：Elena Woodstock,\
    \ Hannah Phipps\n- **项目经理**：Helen Anthony\n- **杂志编辑**：Tim Appenzeller\n- **执行编辑**：Nick\
    \ Campbell\n- **主编**：Philip Campbell\n\n食物。我们对它的需求是原始的，但我们与食物的关系复杂且不断变化。对发达国家的许多人来说，进食已成为一种休闲追求，烹饪则是一种爱好。但我们的身体仍为更严酷的世界而天生设定——在那里，食物意味着生存。例如，我们的味觉进化成抵御毒素的前线防御，以及帮助探测能量最丰富食物的传感器。然而，我们天生对甜食和脂肪的渴望，如今似乎正把我们引向身体毁灭之路。\n\
    \n食物对人的影响因人而异。当前营养研究涉及超越成分层面，试图理解食物在遗传和表观遗传层面的影响。从我们吃下的第一口奶，到盛宴与饥荒；我们的基因影响我们的饮食，而营养素——或营养素的缺乏——影响基因表达。\n\
    \n食物和文化的地区差异在我们的基因组上留下了印记。在世界各地，人群已适应其饮食，以充分利用当地资源。在某些情况下，一种食物可以抵御致命感染，使那些能够容易消化它的人获得选择优势。营养也引导了我们物种的进化。\n\
    \n只有*智人*和我们已灭绝的类人猿近亲曾使用火来加工生食，从而创造出更安全、更易消化且更美味的食谱。结合工具的使用以及杂食、广泛的食欲，烹饪的出现提高了代谢的能量产出，并供养了我们不断增大的大脑。\n\
    \n由于食物充满复杂的、具有生物活性的分子，它对我们的健康产生影响并不令人意外。然而，厘清每种成分对身体的影响是一项艰巨任务，而且在未来许多年里仍将继续。有人预测将迎来根据个人能量需求和疾病易感性定制饮食的时代。但无论科学多么出色，或我们多么善于把食物用作促进健康的工具，在未来一段时间里，我们仍会为了愉悦而进食。\n\
    \n我们很高兴感谢雀巢研究中心在制作本期《展望》时提供的资金支持。一如既往，*《自然》*对所有编辑内容承担全部责任。\n\n**Michelle Grayson**\
