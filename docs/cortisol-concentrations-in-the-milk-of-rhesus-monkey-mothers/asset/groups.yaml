    \n### 采纳与适应\n\n回答这些问题需要考察称为单核苷酸多态性（SNPs）的小型基因突变如何影响控制代谢的酶和激素的产生。每个人体内都有数千个此类突变和无数反馈回路，这意味着新兴代谢组学领域的研究人员必须使用复杂的生物信息学模型。“这些工具中有许多最初是为药物研究开发的，如今在包括营养学在内的所有生物学领域几乎已司空见惯，”马瑟斯说。\n\
    \n荷兰马斯特里赫特大学的生物信息学家克里斯·埃弗洛说，药物研究的进展推动了微阵列、高通量测序、多态性鉴定和DNA甲基化技术的改进，这些技术用于扫描可能对潜在药物分子作出反应的新受体。在大型临床试验中，研究人员通常会在试验前后收集个体多个健康层面的信息，以防例如一种靶向心脏的药物对肝脏产生意外影响。同样，营养基因组学专家关注任何实验性饮食干预的更广泛影响。“这种全系统方法一直是营养基因组学研究的惯例。饮食变化往往没有明确的靶基因，”埃弗洛说。这个问题迫使研究人员寻找代谢系统许多要素与相关基因之间的微妙相互作用。\n\
    \n除了在不干预任何人饮食的情况下研究全球人群的流行病学研究外，许多营养基因组学研究人员正在采用干预研究，这类研究更像药物和医疗器械制造商使用的临床试验。“在另一种类型的研究中，你有意改变细胞、动物或人的营养暴露，”马瑟斯解释说，“然后使用全基因组表达微阵列测量基因表达，试图理解改变后的营养暴露如何调控基因表达，并最终影响表型。”\n\
    \n> **营养研究经历了向更像制药领域的全基因组干预研究的转变。**\n\n新西兰奥克兰大学的营养研究员林内特·弗格森经历了这种向更像制药领域的全基因组干预研究的转变。她指出，就在2003年，她和同事还在“谈论单个基因、单个营养素”。然而，许多基于单分子的有前景疗法在实验室中有明显效果，但从未通过动物试验。这是因为，正如埃弗洛所说，“如果你在一个地方推动系统，它会通过另一种机制进行补偿，最终期望的效果不会出现。”自那以后，微阵列和“深度测序”技术的快速进步使研究人员能够考虑食物在单个SNP层面上的影响。这也为他们提供了一种更客观的工具，用于测量志愿者实际吃什么，而不是依赖自我报告。\n\
    \n采用传统营养科学之外的技术意味着采用新的研究方法。“我自己的优势在于，我曾参与一个癌症研究项目，”弗格森说。“我观察了药物研发的进展，看到同事们如何使用它们，也看到他们使用的模型。”弗格森的团队使用高通量测序筛查人类细胞中白细胞介素-12/23受体通路的修饰——该通路对肠道健康很重要——他们怀疑这些修饰由某些食物引起。这项工作帮助他们开发了一种细胞检测方法，用于测量特定食物成分对人类细胞基因表达的影响。下一步是在计划人体试验之前，验证这种营养素-基因相互作用是否存在于动物模型中，就像测试一种新药一样。\n\
    \n### 基因分型\n\n这些检测不会简单，因为并非所有人对饮食变化的反应都相同，就像并非所有人对某种特定药物都有反应一样。奥多瓦斯表示，基于遗传反应性识别不同人群正开始显现前景。在最佳情况下，研究人员会根据一组遗传风险因素筛查个体。就胆固醇而言，奥多瓦斯及其同事发现，胆固醇水平会因改变饮食而受影响的人与仅对药物有反应的人之间存在特定的遗传差异。目前，医生会在开具降胆固醇药物前让患者尝试多种饮食，以避免副作用。但有了可靠的基因筛查检测，医生可以为不太可能对饮食变化产生反应的患者开具药物，从而节省时间，并帮助减少因胆固醇水平升高而造成的危害。\n\
    \n然而，大多数饮食效应都很微妙，某些基因图谱可能相对罕见且更难筛查。这需要大型队列来检测和识别信号。“在任何基因中，都有少数我们会扫描的关键多态性，但其他多态性可能不那么常见，可能不在我们使用的芯片上，或不在我们研究的特定族裔群体中，但仍可能致病，”奥多瓦斯说。这意味着他可能需要扫描越来越大量的志愿者——也许达到数十万人。当然，要解锁将出现的海量数据集，将需要数十名研究人员——超过20世纪80年代参与奥多瓦斯研究的志愿者人数——他在介绍这一新兴领域时会提到这一事实。\n\
