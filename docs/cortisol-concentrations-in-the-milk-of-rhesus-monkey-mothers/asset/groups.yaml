    \ 16, 1382-1387.\n\n## 功能基因组学\n\n## 维生素D与疾病\n\n最近的一项研究展示了将染色质免疫沉淀测序（ChIP–seq）与全基因组关联（GWA）研究数据相结合，以探索复杂疾病分子基础的能力。Ramagopalan及其同事使用ChIP–seq技术，在有或没有维生素D配体的情况下，绘制了人淋巴母细胞系中维生素D受体（VDR）——一种配体激活的转录因子——的基因组结合高分辨率图谱。在存在配体的情况下，他们鉴定出2,776个结合位点，其中许多位于与活性染色质相关的区域，这与VDR在基因调控元件中的预期作用一致。维生素D与多种疾病有关，尤其是自身免疫性疾病，但这种关联的基础尚不清楚。作者将他们的ChIP–seq数据与47种常见性状的GWA研究数据集进行比较，发现VDR位点在与多发性硬化症和1型糖尿病以及其他自身免疫性疾病、癌症和身高等性状相关的基因组区间内显著富集。结果提示VDR控制着许多先前被认为不受该转录因子调控的基因。在大多数情况下，疾病相关的SNP不会破坏VDR结合基序，因此进一步的重新测序可能有助于确定哪些遗传变异改变了基因调控。有趣的是，VDR结合也在具有正选择特征的区域中富集，因此未来的研究可能旨在探究维生素D在人类进化中的作用。\n\
