    ## Discussion


    To our knowledge, this is the first study reporting a genotype-driven dairy association
    with height variation in children. The existence of a possible link between human
    IGF2/rs680 polymorphism and body height in childhood is a striking, yet unresolved
    question. Genotype frequencies in our pediatric cohort were almost identical (51.9
    vs 51.7% for GG, 39.9 vs 40.6% for GA and 8.2 vs 7.7% for AA) to those previously
    described in an adult study (Heude et al., 2007). In this investigation, the Norfolk
    arm of the European Prospective Investigation of Cancer (EPIC), the authors reported
    no significant associations between rs680 SNP and BMI, whereas they found that
    the rs680 IGF2 SNP was independently associated with height. In accordance to
    their findings, we did not find any association with BMI, although others have
    shown that the less common rs680 A allele was associated with a lower BMI (Gaunt
    et al., 2001). In the Hertfordshire, UK, population GG homozygotes tended to be
    both heavier and taller than AA homozygotes, with heterozygotes (GA) being intermediate
    (Sayer et al., 2002). In the Baltimore Longitudinal Study of Aging, women with
    the A/A genotype were shorter than G/G carriers, and a similar trend was observed
    in men (Roth et al., 2002).


    The mechanism that might explain the relationship of IGF2 with height resides
    in early childhood. The rs680 G allele has been associated with significantly
    higher levels of IGF2 mRNA compared with the A allele, showing a role for this
    polymorphism in the transcription of this gene (Vafiadis et al., 1998). Children
    with constitutionally tall stature had significantly higher growth velocity and
    higher IGF2 levels than children with normal height (Garone et al., 2002). It
    has been suggested that IGF2 might be responsible for overgrowth of children with
    constitutionally tall stature, having an increase in activity on target tissues,
    particularly at the level of cartilaginous and bone tissue.


    We found an association between dairy intake and height variation in our pediatric
    cohort. More precisely, a positive correlation was found between the dairy intake
    and height in those children who were A-allele carriers for the IGF2 polymorphism.
    Results from the NHANES study (Wiley, 2005) indicated that adult height was positively
    associated with milk consumption at ages 5–12 and 13–17 years, after controlling
    for sex, education and ethnicity. The strongest evidence that milk and dairy product
    intake stimulate linear growth comes from observational and intervention studies
    in developing countries that show considerable effects. In addition, many observational
    studies from well-nourished populations also show an association between milk
    intake and growth. These results suggest that milk has a growth-stimulating effect
    even in situations in which the nutrient intake is adequate. In a randomized,
    controlled feeding intervention study, increase in milk intake resulted in improved
    linear growth in younger and already stunted children (Neumann et al., 2007).
    The associations of dietary intakes in prepubertal children with IGF levels and
    growth have been less often studied, but are of considerable interest. The associations
    of milk and dairy products with IGF-I are of particular interest in this context,
    as children are high consumers of these foods.


    The study of Silventoinen et al. (2000) showed that changing environmental factors
    affect the heritability of height. The heritability is higher when the standard
    of living is better. We have recently shown (Yannakoulia et al., 2008) that family
    factors, including divorce, influence the obesity status in the GENDAI population.
    Compared with children of married parents, those of divorced parents had significantly
    higher BMI levels even on adjusting for various confounders such as socioeconomic
    and physical activity. Thus, unfavorable family circumstances were associated
    with children’s overweight, as well as with aspects of their eating behavior.
    When we stratified our sample by the family status, the effect of gene on height
    was masked in children of divorced parents. On the other hand, in a stable family
    environment, which seems to be that in which both parents are present, the effect
    of the IGF2 gene on height variation remained statistically important (data not
    shown). Thus, exploring height variants and elucidating the possible interactions
    with environmental factors such as diet could help us to design effective strategies
    for the prevention of height-associated diseases.


