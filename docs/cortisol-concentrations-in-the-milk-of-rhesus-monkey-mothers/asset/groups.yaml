    肥胖。<sup>7</sup> 尽管我们对生物钟模型的理解仍在不断发展，但先前的研究已经证实，昼夜节律运动输出周期循环 kaput（CLOCK）蛋白——分子钟正反馈回路中的转录因子之一——参与代谢功能的改变。<sup>8</sup>
    动物模型显示，*Clock* 基因被破坏的小鼠容易发生肥胖。<sup>9</sup> 2004 年，Rudic *等人*<sup>10</sup> 的研究表明
    *Clock* 基因突变与葡萄糖耐量受损有关。近期，这些研究进一步扩展，旨在更深入地了解 *CLOCK* 基因变异在人类肥胖中的作用。到目前为止，只有两项针对肥胖的研究显示了不同
    *CLOCK* 基因多态性与体质指数（BMI）之间存在有趣的关联。<sup>11,12</sup> 然而，尚无研究报告 *CLOCK* 基因多态性与减重方案导致的体重减轻之间的关系。


    基于上述研究和一些尚未探索的问题，我们调查了 *CLOCK* 基因的五个候选多态性是否与西班牙东南部肥胖人群的人体测量指标、代谢指标以及基于地中海饮食的行为减重方案后的体重减轻相关。


    ## 研究对象与方法


    ### 研究对象


    我们招募了年龄在 20–65 岁之间的超重或肥胖受试者（BMI > 25 kg m⁻² 且 < 40 kg m⁻²）（*n* = 500），他们在 2008
    年期间就诊于位于西班牙东南部穆尔西亚市的五家肥胖门诊。服用产热或生脂药物，或被诊断为糖尿病、慢性肾功能衰竭、肝脏疾病或癌症的患者被排除在研究之外（11%）。最终样本包括
    454 名个体。


    所有程序均符合良好临床实践规范。每位患者在参与前均获得书面知情同意，研究原则经 Virgen de la Arrixaca 医院研究伦理委员会批准。患者数据已编码以保证匿名性。


    ### 治疗方案的特征


    减重方案的特征已在别处描述。<sup>13,14</sup> 简要来说，在最初的 4 个月中，受试者每周参加一次 60 分钟的支持小组治疗课程（*n* =
    10），随后是 5 个月的维持期。课程由营养师主持。治疗基于以下内容：


    - *饮食治疗。* 通过计算（1）根据 Harris–Benedict 公式估算的静息能量消耗（REE）和（2）根据体力活动的类型和持续时间估算的总能量消耗（TEE）来评估个体膳食能量需求。然后，从
    TEE 中减去约每天 2.6 MJ。最终膳食能量含量为女性每天 1200–1800 kcal，男性每天 1500–2000 kcal，以实现每周约 0.5–1
    kg 的体重减轻。这些建议与地中海饮食类型一致<sup>14</sup>，宏量营养素分布遵循西班牙社区营养学会的建议。<sup>15</sup>

    - *营养教育* 在小组治疗课程中提供，以帮助受试者计划自己的菜单，并教育受试者养成适当的终身饮食习惯。

    - *体力活动* 强调每周至少 2 或 3 次、每次 15–30 分钟或更长时间的中等强度体力活动的个人目标。鼓励患者使用计步器达到每天至少 10000 步。

    - *行为技术* 包括刺激控制、自我监测、正强化和认知行为疗法。


    ### 人体测量


    受试者在每天同一时间、赤脚、身着轻便衣物的情况下，使用数字秤称重，精确到 0.1 kg。身高使用 Harpenden 数字身高计（范围 0.7–2.05）测量。受试者直立、放松，头部处于法兰克福平面。根据这些测量值计算
    BMI，公式为体重(kg)/(身高(m))²。使用 TANITA TBF-300（TANITA Corporation of America, Arlington
    Heights, IL, USA）设备通过生物电阻抗法测量全身脂肪。身体脂肪分布通过测量不同围度来评估：腰围在脐水平测量，臀围为大转子处最宽围度。<sup>16</sup>
    所有测量均使用柔性且不可伸缩的卷尺进行。然后计算腰臀比（WHR）。


    ### 生化分析


    使用商业试剂盒（Roche Diagnostics GmbH, Mannheim, Germany）从隔夜空腹后的静脉血样本中测定血浆葡萄糖、总胆固醇、总血红蛋白和尿酸的浓度。


    ### 习惯性膳食摄入


    为了评估饮食习惯，通过 24 小时膳食回顾法确定初始营养素摄入量。访谈在周一至周五进行，包括周末和工作日的 24 小时食物摄入回顾。使用基于西班牙食物成分表的数字评估软件程序
    Grunm<sup>17</sup> 分析初始 24 小时回顾中的总能量摄入和宏量营养素组成。<sup>18</sup>


    ### DNA 提取与 CLOCK 基因分型


    我们使用基于 HapMap 白种人欧洲犹他州数据（www.hapmap.org）<sup>20</sup> 的 Tagger<sup>19</sup> 选择
    tagSNP，作为强连锁不平衡（LD）中未分型 SNP 的有效代理，次要等位基因频率（MAF）≥0.10，最小 r² 为 0.8。Tagger 使用一种算法来选择
    tagSNP，以构建单标记和多标记检验，基于它们之间计算的相关性 r² 来捕获感兴趣的等位基因。


    使用常规 DNA 分离试剂盒（Qiagen）从血液样本中分离 DNA。我们使用带有等位基因特异性探针的 TaqMan 检测方法，在 ABI Prism 7900HT
    序列检测系统（Applied Biosystems, Foster City, CA, USA）上按照标准化实验室方案进行 *CLOCK* 基因多态性的基因分型。<sup>21</sup>


    ### 生物信息学分析


    所研究 SNP 之间的 LD 图如图 1 所示。使用三个标准选择 SNP：文献报道的遗传关联或生物学功能、生物信息学功能评估和 LD 结构。结合 tagSNP
    的选择，我们还对包含不同 SNP 的基因组 DNA 序列进行了生物信息学分析，以确定不同等位基因可能产生的生物学后果。使用 MAPPER<sup>22</sup>
    研究映射到转录起始位点上游区域或内含子内的 SNP，以识别潜在的等位基因特异性转录因子结合位点。


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_37_0.png)


    **图 1** *CLOCK* 基因的连锁不平衡（LD）图。水平白色条表示样本中分析的染色体 4q12 的 113 kb DNA 片段。5 个 tagSNP
    的位置用刻度线标出。图底部为 LD 图：每个菱形代表一对标记的 LD 大小。黑色表示强 LD（r² = 1.0），白色表示无 LD（r² = 0），灰色色调表示中间
    LD。菱形内的数字表示 r²（D′）值。


    没有内含子 SNP 改变剪接受体或供体位点，或剪接机制识别的其他信号（如多嘧啶束）。mRNA 3′-UTR 内的多态性可能影响 mRNA 的折叠，并伴随 mRNA
    稳定性的变化。使用维也纳 RNA 包中的 RNAfold<sup>23</sup> 测试了 3′-UTR SNP 的潜在影响。


    ### 统计分析


    我们使用 Pearson χ² 检验和 Fisher 检验来检验频率差异。为评估方案的有效性，使用 Student 配对 t 检验评估治疗开始和结束时人群特征的变化。我们应用
    ANOVA 和 Student t 检验来比较各基因型组之间的粗略均值。我们检验了不同的遗传遗传模型，并在最终分析中对所有选定的 SNP 应用显性模型，但
    rs4580704 除外，它遵循隐性模型。我们通过协方差分析对关联进行多变量调整，并估计调整后均值。我们按性别、年龄和中心调整分析。我们还在相应的交互项回归模型中检验了性别效应的统计同质性。使用
    SPSS 15.0 软件（SPSS）进行统计分析。双侧 P 值 <0.05 被认为具有统计学显著性。


    ## 结果


    ### 人群特征


    研究对象的一般特征，包括人体测量指标、生化变量、膳食摄入和体力活动特征，列于表 1。454 名受试者（380 名女性，74 名男性）的平均年龄为 39 ±
    12 岁，BMI 为 31 ± 5.3 kg m⁻²（平均值 ± 标准差）。75% 的人群被认为久坐不动（每周体力活动少于 1 小时）。平均每日睡眠时间为
    7 小时。通过 24 小时回顾获得的饮食习惯显示，碳水化合物百分比低于西班牙建议值，而蛋白质和脂肪百分比高于建议水平。


    ### Garaulet 受试者中 CLOCK 变异体的基因型频率及其与肥胖参数的关联


    选择 SNP rs1464490 是因为它是大 LD 块（LD1）的 tagSNP；rs3749474 也来自 LD1，是在生物信息学功能评估表明 mRNA
    结构发生重要变化后选择的；rs4864548 是因为它先前与超重/肥胖相关。<sup>11,12</sup> 在构成 LD2 的不同 SNP 中，选择 rs4580704
    是基于其先前与 BMI 的关系。<sup>12</sup> 从 LD3 中，我们根据先前的报告选择了 rs1801260 SNP。


