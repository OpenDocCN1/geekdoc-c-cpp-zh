  - '[PAGE 27]


    # METHODS


    **Animal care.** Sprague-Dawley rats from the Animal Resource Centre were housed
    at 22 ± 2 °C, on a 12:12 h light/dark cycle. Male F0 founders were assigned to
    a HFD (SF01-025, SF03-020; 40.7% energy as fat; Speciality Feeds) or control (Gordon''s
    Stockdiet) at 4 weeks of age. At 13 weeks, HFD males were 22% heavier (522 ± 11
    versus 428 ± 13 g, P = 0.008); mating with females consuming control diet commenced
    at 4 weeks. During mating, one male and one female were housed together, with
    free access to control diet from 0800–1800 h, for 8 consecutive days. Males returned
    to their cages overnight to continue their assigned diets, whereas females consumed
    control diet throughout mating, gestation and lactation. Male and female founders
    were killed in the fasting state shortly after litters were harvested. Females
    mated with the two paternal groups did not differ in body weight, adiposity, fasting
    blood glucose, insulin and HOMA-IR (Supplementary Table 1). Only litters sized
    between 9–16 were included and litters were standardized to 12 pups at day 1 within
    father groups, to control for intrauterine and postnatal nutrition. Phenotypic
    data (body weight, specific growth rate, glucose tolerance, insulin tolerance,
    post mortem) from one offspring per father, chosen at random, were generated.
    At week 13, animals were killed and islets were generated from 5 HFD and 6 control
    offspring, each from a different father. Litters were killed for pancreas histology
    and post-mortem analysis at week 14.


    Body weight and energy intake were monitored weekly, the latter by collecting
    and weighing food remaining after 24 h. Energy intake was averaged across animals
    housed with 3–4 per cage to reduce stress. Specific growth rate (SGR; weight gain
    between two time-points divided by the previous body weight^1) and energy efficiency
    (energy gain divided by energy intake over the two time-points) were calculated.


    **Glucose measurements.** Blood glucose (Accu-chek Advantage glucose meter; Roche),
    plasma leptin and insulin (Linco radioimmunoassay), plasma NEFA (Wako) and triacylglycerol
    (Roche colorimetric enzymatic assay) were determined.


    **Glucose tolerance tests.** Glucose tolerance test was performed after a 15-h
    overnight fast and insulin tolerance test was performed 2 h after food removal.
    Glucose (2 g kg−1 body weight) and insulin (Actrapid, Novo Nordisk; 1 U kg−1 for
    fathers and 0.5 U kg−1 for offspring based on their predicted insulin resistance)
    were administered intraperitoneally. Separate cohorts of litters underwent a glucose
    tolerance test for blood glucose and plasma insulin measurements at 6 weeks of
    age, to reduce stress associated with blood sampling.


    **Immunohistochemistry and morphometric analysis.** Three fixed pancreas sections
    (5 μm) per animal per 200 μm apart, were stained with polyclonal guinea-pig anti-insulin
    primary antibody followed by goat anti-rabbit immunoglobulin secondary antibody
    (DAKO). Adjacent sections were stained with haematoxylin and eosin. All slides
    were scanned using Aperio ScanScope XT Slide Scanner. Pancreas, islet and β-cell
    areas were determined using ImageJ 1.40 software (http://rsb.info.nih.gov/ij/).
    Islets were classified into small (1–5,000 μm^2), medium (5,001–10,000 μm^2) and
    large (>10,000 μm^2), respectively.


    **Islet isolation.** Islets were harvested by standard techniques with cannulation
    of the pancreatic duct of anaesthetized rats^27 after an overnight fast.


    **Islet transcriptomics.** Affymetrix probe-set data were normalized using the
    robust multi-array average (RMA) method^28, which can yield attenuated estimates
    of differential expression for genes at low expression levels, albeit with high
    precision. Gene expression levels were compared using one-way ANOVA. This yielded
    77, 642 and 2,492 differentially expressed genes at unadjusted P < 0.001, P <
    0.01 and P < 0.05 levels, respectively. Differentially expressed genes (P < 0.01)
    were functionally annotated according to gene ontology terms and enriched terms
    were calculated using DAVID^29 (Supplementary Fig. 1). In addition, we hierarchically
    clustered^29 differentially expressed genes based on Euclidean distance to look
    for possible co-regulated pathways affecting islet metabolism. We also mapped
    differentially expressed genes at P < 0.05 to KEGG^30.


    **Quantitative RT-PCR.** Total islet RNA (one offspring per father; n = 5, HFD;
    n = 5, control), extracted using miRNeasy Mini kit (Qiagen), was used as a template


    for complementary DNA synthesis, using SuperScript III first strand synthesis
    (Invitrogen) with random hexamers. mRNA expression was determined using quantitative
    RT–PCR (Stratagene Mx3000P; Agilent) using primer sequences summarized in Supplementary
    Table 4 and Platinum SYBR Green SuperMix UDG (Invitrogen), normalized against
    β-actin.


    **Molecular network generation using Ingenuity pathways analysis.** Networks were
    generated through Ingenuity pathways analysis (Ingenuity Systems, http://www.ingenuity.com).
    Briefly, differentially expressed genes at P < 0.01 or P < 0.05 and corresponding
    fold changes were used; the number of networks and eligible molecules per network
    is limited to 25 and 35, respectively. Networks were algorithmically generated
    based on their connectivity and ranked by score (negative exponent of the right-tailed
    Fisher''s exact test result). Molecules are represented as nodes, and the biological
    relationship between two nodes as an edge (line). Nodes are displayed using various
    shapes that represent the functional class of the gene product, whereas edges
    describe the nature of the relationship between the nodes, as defined in Ingenuity
    Systems.


    **DNA methylation analysis by bisulfite sequencing.** Bisulfite treatment was
    performed as described^40. One microgram of NaOH-denatured DNA was embedded in
    2% low-melting-point agarose solution; bisulfite solution (Sigma) was added, followed
    by 4 h of incubation at 50 °C under light exclusion. Treatment was terminated
    with the Wizard DNA Clean-Up System (Promega) and DNA was eluted with 50 μl of
    1 mM NaOH. PCR amplification was performed using the primers: 5′-TTTAAAATTTTAAATTTAAAATTGGAGG-3′
    (forward), 5′-AATTAAAAAACCCCTAAAATTCAAAATACTAAC-3′ (reverse) and 5′-AATTAAAAAACCCCTAAAATTCAAAATACTAAC-3′.
    The obtained PCR fragments were purified using MinElute Gel Extraction Kit (Qiagen)
    and cloned into pCR-TOPO vector using TOPO TA cloning Kit (Invitrogen). Individual
    clones were grown and plasmids purified using PureLink Miniprep Kit (Invitrogen).
    For each, eight to nine clones were sequenced using T7 primer on an ABI 3730xl
    DNA Analyzer platform at the Ramaciotti Centre. Results were analysed using Molecular
    2.0.


    **Statistical analysis.** Results are expressed as mean ± s.e.m. P < 0.05 was
    considered statistically significant.


    +   31. Pröhl, J., Leikola, E., Vatt, R., Cameron-Smith, D. & Morris, M. J. Undernutrition
    during suckling in rats elevates plasma adiponectin and its receptor in skeletal
    muscle regardless of diet composition: a protective effect? Int. J. Obes. (Lond)
    32, 1585–1594 (2008).

    +   32. Chamson-Reig, A., Thyssen, S. M., Arany, E. & Hill, D. J. Altered pancreatic
    growth and insulin secretion in Wistar rats born small or during catch-up growth.
    J. Endocrinol. 191, 83–92 (2006).

    +   33. Lavy, P. E. & Koshinaka, Y. Molecular method for identification of islets
    of Langerhans from rat pancreas. Diabetes 16, 35–39 (1967).

    +   34. Laybutt, D. R. et al. Increased expression of antioxidant and antiapoptotic
    genes in islets that may contribute to β-cell survival during chronic hyperglycemia.
    Diabetes 51, 413–423 (2002).

    +   35. Laybutt, D. R. et al. Critical reduction in β-cell mass results in two
    distinct outcomes over time. Adaptation with impaired glucose tolerance or decompensated
    diabetes. J. Biol. Chem. 278, 2997–3005 (2003).

    +   36. Irizarry, R. A. et al. Exploration, normalization, and summaries of high
    density oligonucleotide array probe level data. Biostatistics 4, 249–264 (2003).

    +   37. Huang, da W., Sherman, B. T. & Lempicki, R. A. Systematic and integrative
    analysis of large gene lists using DAVID bioinformatics resources. Nature Protocols
    4, 44–57 (2009).

    +   38. Dennis, G. Jr et al. DAVID: database for annotation, visualization, and
    integrated discovery. Genome Biol. 4, P3 (2003).

    +   39. Saeed, A. I. et al. TM4: a free, open-source system for microarray data
    management and analysis. Biotechniques 34, 374–378 (2003).

    +   40. Kanehisa, M. & Goto, S. KEGG: Kyoto encyclopedia of genes and genomes.
    Nucleic Acids Res. 28, 27–30 (2000).

    +   41. Clark, S. J., Statham, A. L., Stirzaker, C. & Molloy, P. L. A modified
    and improved method for bisulfite based cytosine methylation analysis. Nucleic
    Acids Res. 24, 5064–5066 (1996).

    +   42. Grunau, C., Schattevoy, R., Machen, N. & Rosenthal, A. MethTools—a toolbox
    to visualize and analyze DNA methylation data. Nucleic Acids Res. 28, 1053–1058
    (2000).'
