  md: 'diet,” says his collaborator John Mathers, a nutrition scientist at the University
    of Newcastle, UK, “and you do a genomic study to ask the question: how does diet
    interact with the gene to produce a particular phenotype?” Cardiovascular health
    might be nutrigenomics’ strongest application to date, Mathers says, but researchers
    are also beginning to study the long-term effects of nutrition on the brain and
    on ageing.


    # ADOPTING AND ADAPTING


    Answering these questions requires examining how small genetic mutations, called
    single nucleotide polymorphisms (SNPs), affect the production of enzymes and hormones
    that control metabolism. There are thousands of these mutations in each individual
    and countless feedback loops, meaning that researchers in the emerging area of
    metabolomics must use sophisticated bioinformatics models. “A lot of those tools
    were developed for pharmaceutical studies and now have become almost commonplace
    in all areas of biology, including nutrition,” says Mathers.


    Progress in pharmaceutical research has stimulated improvements in microarrays,
    high-throughput sequencing, polymorphism identification and DNA methylation technologies,
    used to scan for novel receptors that might respond to potential drug molecules,
    says bioinformatic Chris Evelo of Maastricht University in the Netherlands. In
    large clinical trials, researchers often collect information about multiple levels
    of an individual’s health before and after the trial in case a drug targeting
    the heart has an unanticipated effect on the liver, for instance. Likewise, nutrigenomics
    specialists are concerned with the broader effects of any experimental dietary
    intervention. “This


    system-wide approach has been the rule in nutrigenomics research all along. There
    often are no clear target genes for diet changes,” says Evelos. This problem forces
    researchers to seek out subtle interactions among many elements of the metabolic
    system and related genes.


    In addition to epidemiological studies, which examine global populations without
    interfering with anybody’s diet, many researchers in nutrigenomics are employing
    intervention studies, which are more like the clinical trials used by drug and
    medical device makers. “In this other type of study you deliberately modify the
    nutritional exposure separately modify the nutritional exposure separately modify
    the nutritional exposure of cells, animals or people,” explains Mathers, “and
    then measure the expression of genes using whole genome expression arrays to try
    to understand how altered nutritional exposure regulates gene expression and,
    ultimately, phenotype.”


    > > **Nutrition research has experienced the move towards more pharma-like genome-wide
    intervention studies.**


    Nutrition researcher Lynnette Ferguson at the University of Auckland in New Zealand
    has experienced the move towards more pharma-like genome-wide intervention studies.
    She notes that, as recently as 2003, she and her colleagues were “talking about
    single genes, single nutrients.” Yet many promising treatments based on single
    molecules had clear effects in the lab but never passed animal trials. This is
    because, as Evelo says, “if you push the system in one place it will compensate
    through another mechanism and in the end the wished for effect does not occur.”
    Since then, rapid improvements in microarrays and


    ‘deep sequencing’ technologies have enabled researchers to consider the impact
    of food down to the level of individual SNPs. It has also given them a more objective
    tool to measure what volunteers are actually eating, rather than relying on self-reporting.


    Adopting technology from outside traditional nutrition science means adopting
    new research methods. “My own advantage was that I had been part of a cancer research
    programme,” says Ferguson. “I’ve watched the development of pharmaceuticals, seen
    my colleagues work with them and seen the models they use.” Ferguson’s team used
    high-throughput sequencing to screen human cells for modifications to the interleukin-12/23
    receptor pathway — important for bowel health — that they suspected were caused
    by certain foods. This work helped them develop a cellular assay for measuring
    the effect of a particular food component on gene expression in human cells. The
    next step is to validate whether such nutrient-gene interactions exist in animal
    models, before planning human trials, just as if they were testing a new drug.


    # GENETIC PROFILING


    These tests will not be straightforward as not all people respond to dietary changes
    in the same way that not all people react to a particular medicine. Identifying
    different populations based on their genetic responsiveness is starting to show
    promise, according to Ordovas. In the best case scenario, researchers would screen
    individuals against panels of genetic risk factors. In the case of cholesterol,
    Ordovas and colleagues have found specific genetic differences between people
    whose cholesterol levels are affected by changing their diet and those who only
    respond to medication. Right now, doctors try patients on multiple diets before
    prescribing cholesterol-reducing drugs to avoid side effects. But with a reliable
    genetic screening test, doctors could prescribe drugs to patients unlikely to
    respond to dietary changes, saving time and helping reduce the harm caused by
    living with elevated cholesterol levels.


    The majority of dietary effects are subtle, however, and certain genetic profiles
    might be relatively rare and more difficult to screen. This requires large cohorts
    to detect and identify signals. “In any gene, there are a few key polymorphisms
    that we scan, but others will be less common, may not be on the chip we use, or
    in the specific ethnic group that we are studying, but could still cause disease,”
    says Ordovas. That means he may need to scan ever-larger numbers of volunteers
    — perhaps into the hundreds of thousands. Unlocking the massive datasets that
    will emerge will, of course, require dozens of researchers — outnumbering the
    volunteers that participated in Ordovas’ studies in the 1980s a fact he mentions
    when he gives presentations about this burgeoning field.


