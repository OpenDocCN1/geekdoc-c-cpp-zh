    # TECHNOLOGY


    # A flavour of the future


    *Health biomarkers, smart technology and social networks are hastening an era
    of nutrition tailored to your individual needs but relying on information generated
    by the crowd.*


    A man steps out of a health clinic after his monthly nutritional profile. He slides
    a ring onto his finger and the injection-free technology transmits a read-out
    of his blood constituents to a central server. Skimming the data sent to his smart
    phone, he looks at the recommendation for his evening snack — something with a
    little more selenium: Brazil nuts, perhaps. He considers his diet for the coming
    week — logged with his refrigerator — and confirms an updated home-delivery shopping
    list. Finally, he tots up his credit for sharing this personal health data with
    a population-wide genome study—redeemable against the cost of his health insurance
    and nutritional supplements. It’s a familiar sight to his girlfriend. “We’re having
    dinner at my parents’ tomorrow. Don’t you dare let the FatNav tell you what to
    eat, or me what to drink.”


    There are signs that this future is fast approaching. Domestic sleep and weight
    monitors can transmit results using Wi-Fi; fridges are in development that log
    what you’ve eaten; and dinner parties are complicated by food intolerance and
    fad diets. Already, pin-prick blood


    test results for diabetes can be uploaded online. Websites such as patientslikeme.org
    offer tips on drug and nutritional supplement regimens. And at SNPedia.com and
    DIYgenomics.org, people can share their entire genomic data to pool resources
    and provide more personal guidance on health issues.


    Can all these platforms create genetics-based nutrition advice? Will this affect
    our definition of health, or the distinction between food and drugs? And how personalized
    will our diets become?


    # NOT IN SICKNESS BUT IN HEALTH


    Many researchers think that personalized nutrition must begin with a new suite
    of biomarkers: ones that measure health rather than disease. But what does that
    mean? “Here we are in the twenty-first century and we don’t have a definition
    of health other than ‘the absence of disease’,” says Ian Astley, a nutrition researcher
    at the Institute of Food Research, UK. “Health is about much more.”


    Astley says that to comprehend what bio-active food compounds are doing we first
    have


    to understand what’s going on in the body before it becomes ill. “Our difficulty
    is that the only biomarkers we have are for when the disease process has already
    started.”


    ‘Omics’ sciences, such as transcriptomics, proteomics and metabolomics, study
    many thousands of putative biomarkers in a process called ‘extensive phenotyping’.
    “We now have examples where the protein fingerprint in tissues can indicate precursor
    changes long before symptoms appear,” says Astley. “The protein fingerprint offers
    us early diagnosis as well as an insight into potential changes that might be
    elicited by feeding people a different diet.”


    Astley also works for the Nutrigenomics Organisation (NuGO), an EU-funded project
    involving 23 universities and research institutes. NuGO researchers believe that
    to find these health biomarkers, testing conditions will need a rethink. For example,
    although we are all in a state of homeostatic equilibrium, the ‘normal’ levels
    of metabolites, including glucose, plasma proteins, cytokines and signalling molecules,
