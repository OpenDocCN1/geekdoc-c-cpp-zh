  md: '# # HOMININ COOKBOOK


    Evolution of our diets and food preparation techniques.


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_9_0.png)


    million years ago. Wrangham has since developed this concept to explain how our
    ancestors maximized the nutritional benefits of tubers, meat and other foodstuffs.
    “It has not been appreciated by most people until recently that cooking has a
    large effect on net energy gain,” says Wrangham. “Normally it’s considered necessary
    because it enlarges the possible diet and makes food safer, but energy is such
    a key variable for evolutionary adaptation.”


    Preliminary analyses by Wrangham and colleagues suggest that cooking may have
    made proteins and starches more digestible while simultaneously reducing the cost
    to the immune system of fending off parasites or bacterial infection.


    # ## THE HARD FACTS


    Many anthropologists remain wary of the evidence gap in Wrangham’s hypothesis.
    The earliest sign of controlled fire comes from Israel, dating back some 800,000
    years — considerably shorter than 2 million years. Nevertheless, Braun is hesitant
    to rule out Wrangham’s theory, pointing out that remains of cooking fires can
    be ephemeral. The evidence found at the Israeli site is particularly unusual.
    “Gesher Benot Ya’aqov is the kind of place archaeologists dream of,” he says.
    “Wood is preserved there, as are all kinds of activities that aren’t preserved
    elsewhere.”


    Braun has encountered similar challenges: a recent study by his team at a 1.95
    million year old site in Turkana, Kenya, found remains of bones and stone tools
    indicating that predecessors of H. erectus may have routinely eaten fish and other
    marine life. If this represents a true dietary pattern, then “brain food” may
    have lived up to its name by providing an abundant source of the polyunsaturated
    fatty acids that fuel the growth of the cerebral cortex.


    Nevertheless, an early role for aquatic animals in the hominin diet remains controversial
    as archaeological evidence points to seafood only becoming a regular item on the
    menu between 150,000 and 200,000 years ago. This could be explained by the challenges
    of actually finding evidence of these foods being prepared. “The preservation
    that happened at that particular site, I think, is unusually good,” says Braun.
    “We usually see marks on bone surfaces as a determining factor of whether something
    is part of the diet [and] those don’t preserve really well for aquatic animals.”


    Unfortunately, any efforts to link food choice to human evolution will continue
    to depend on what can be unearthed at such sites; evidence from the genetic record
    is likely to be harder to find. Pääbo and colleagues assembled a draft of the
    Neanderthal genome. This offers a wealth of information on human evolution over
    the past 50,000 years. However, there is an expiration date for such analyses.
    “Even in the permafrost, which is probably ideal, [the] limit is maybe 50,000
    years,” says Pääbo. As such, any hope of obtaining usable genomic data from our
    early African ancestors is a pipe dream, and attempts to characterize hominin
    genetic evolution generally focus on our closest extant kin — the chimpanzee and
    bonobo.


    > > The pursuit of a steak dinner is not without hazards.


    Some of the best evidence might be found lining the fossilized homes of our ancestors.
    Peter Ungar, a paleoanthropologist at the University of Arkansas, has been using
    digital analysis to chart the “landscapes” of ancient teeth down to the subtle
    abrasions that cover the chewing surfaces.” Those scratches are the actual result
    of a hominin passing food across its teeth, and we can relate that to what the
    animal was adapted to doing,” he says.


    Based on a growing collection of both H. habilis and H. erectus samples, Ungar
    sees a striking transition to teeth that are thinly enamelled and highly textured,
    which are clues to a diversification of diet. “If our Homo ancestors were processing
    their food outside of the mouth more with tools, then you’re not going to get
    the same selective pressures to maintain big, thickly enamelled, flat teeth,”
    he says. “Teeth with thinner enamel and more relief are actually better for being
    and grinding tougher foods, like meat and leaves.” He suggests that although individual
    H. erectus may not have necessarily indulged in a diverse diet, they developed
    a capacity to rely on a broad array of “fallback foods” — a skill that would have
    proved useful in the rapidly changing climate of the early Palaeolithic, and enabled
    humanity to settle far beyond the continent of Africa.


    Braun considers this a reasonable theory, but he also appreciates the need for
    further investigation into the nutritional building blocks of this increasingly
    diverse diet. “For every 10 years of field work, we answer one or two questions,”
    he says. “It’s going to require a lot more boots on the ground.” In the meantime,
    anthropologists and archaeologists will have to continue to content themselves
    with reconstructing the Palaeolithic buffet one course at a time. ■


    **Michael Eisenstein** is a journalist in Philadelphia


