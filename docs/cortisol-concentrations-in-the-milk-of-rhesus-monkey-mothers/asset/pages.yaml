  md: 'adiposity.^7 Although our understanding of the biological clock model continues
    to evolve, previous studies have established that Circadian Locomotor Output Cycles
    Kaput (CLOCK), one of the transcription factors from the positive limb of the
    molecular clock, is involved in altered metabolic function.^8 Animal models have
    revealed that mice with *Clock* gene disruptions are prone to develop obesity.^9
    In 2004, Rudic *et al.*^10 showed that mutations in *Clock* gene were associated
    with impaired glucose tolerance. More recently, these research efforts have been
    extended to gain further understanding about the role of *CLOCK* gene variants
    in human obesity. Thus far, only two studies focused on obesity have shown interesting
    associations between different *CLOCK* gene polymorphisms and body mass index
    (BMI).^11,12 However, no study has yet reported relationships between *CLOCK*
    gene polymorphisms and weight loss in response to a weight reduction programme.


    On the basis of these previous studies and a number of remaining unexplored questions,
    we investigated whether five candidate polymorphisms from *CLOCK* were associated
    with anthropometric, metabolic measures and weight loss in response to a behavioural
    weight reduction programme based on the Mediterranean diet in an obese population
    from southeastern Spain.


    # Subjects and methods


    # *Subjects*


    We recruited overweight or obese subjects (BMI > 25 kg m−2 and < 40 kg m−2) within
    the age range of 20–65 years, (*n* = 500) who attended during 2008 five outpatient
    obesity clinics in the city of Murcia, located in southeastern Spain. Patients
    receiving thermogenic or lipogenic drugs, or those diagnosed with diabetes mellitus,
    chronic renal failure, hepatic diseases or cancer were excluded from the study
    (11%). The final sample consisted of 454 individuals.


    All procedures were in accordance with good clinical practice. Written consent
    was obtained from each patient before participation and the study principles were
    approved by the Research Ethics Committee of the Virgen de la Arrixaca Hospital.
    Patient data were codified to guarantee anonymity.


    # *Characteristics of the treatment*


    The characteristics of the weight reduction programme have been described elsewhere.^13,14
    Briefly, during the initial 4 months, subjects attended a weekly 60-min therapy
    session in support groups (*n* = 10), followed by a 5-month maintenance period.
    Sessions were conducted by a nutritionist. Treatment was based on the following:


    *Dietary treatment.* Dietary individual energy requirements were assessed by calculating
    (1) resting energy expenditure (REE) according to the Harris–Benedict formula
    and (2) total energy expenditure (TEE) according to the type and duration of physical
    activity. Next, about 2.6 MJ per day were


    subtracted from the TEE. The final dietary energy content ranged from 1200–1800
    kcal per day for women and 1500–2000 kcal per day for men to induce an approximate
    loss of 0.5–1 kg per week. The recommendations were consistent with the Mediterranean
    type of diet^14 and the macronutrient distribution followed the recommendations
    of the Spanish Society of Community Nutrition.^15


    *Nutritional education* was given during group therapy sessions to help subjects
    plan their own menus and to educate subjects to adopt appropriate lifetime eating
    habits.


    *Physical activity* emphasised individual goals of 15–30 min or more of moderate
    intensity physical activity, at least 2 or 3 times a week. Patients were encouraged
    to use a pedometer to reach at least 10000 steps per day.


    *Behavioural techniques* included stimulus control, self-monitoring, positive
    reinforcement and cognitive behavioural therapy.


    # *Anthropometric measurements*


    Subjects were weighed in barefoot wearing light clothes, with a digital scale
    to the nearest 0.1 kg, at the same time each day. Height was measured using a
    Harpenden digital stadiometer (rank 0.7–2.05). The subject was positioned upright,
    relaxed and with the head in the Frankfurt plane. BMI was calculated according
    to these measurements as weight(kg)/(height(m))^2. Total body fat was measured
    by bioelectrical impedance using TANITA TBF-300 (TANITA Corporation of America,
    Arlington Heights, IL, USA) equipment. Body fat distribution was assessed by the
    measurement of different circumferences: waist circumference, at the level of
    the umbilicus, and hip circumference, as the widest circumference over the greater
    trochanters.^16 All measurements were made with a flexible and inextensible tape
    measure. Waist–hip ratio (WHR) was then calculated.


    # *Biochemical analysis*


    Plasma concentrations of glucose, total cholesterol, total haemoglobin and uric
    acid were determined from venous blood samples after overnight fast with commercial
    kits (Roche Diagnostics GmbH, Mannheim, Germany).


    # *Habitual dietary intake*


    To evaluate food habits, initial nutrient intake was determined by a 24-h dietary
    recall. Interviews were conducted from Monday to Friday, including 24-h recalls
    of food intake from weekend and weekdays. Total energy intake and macronutrient
    composition from the initial 24-h recalls were analysed with the numerical evaluation
    software program Grunm^17 on the basis of Spanish food composition tables.^18


    # *DNA isolation and clock genotyping*


    We selected tagSNPs as effective proxies for untyped SNPs in strong linkage disequilibrium
    (LD) by using the Tagger^19'
