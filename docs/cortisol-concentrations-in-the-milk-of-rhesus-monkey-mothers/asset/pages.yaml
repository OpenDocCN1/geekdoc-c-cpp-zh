    diet. For example, the Japanese routinely consume large amounts of rice and other
    starch, whereas the Yakut, a Siberian hunting and fishing culture, have a diet
    based on fish and meat; these differences are reflected at the level of the AMY1
    gene in Japanese and Yakut populations. “Even though they are closely related
    genetically, and geographically not separated by a great distance, there’s a difference
    in the number of copies in these two populations on average,” says Dominic.


    # SUFFERING FOR HEALTH


    The shift from an active foraging lifestyle to a more sedentary agricultural existence
    also appears to have introduced selective pressures, as populations struggled
    to survive nutritional deficiencies. Some intriguing but enigmatic signs of lifestyle-specific
    adaptation have been detected in the gene encoding N-acetyltransferase 2 (NAT2),
    an enzyme that is best known for its role in drug metabolism, but which also contributes
    to the encoding of toxins ingested from plants and well-cooked meat. In a series
    of recent studies, geneticist Luis Quintana-Murci of the Institut Pasteur and
    colleagues investigated the extent by which different populations express NAT2
    variants that acetylate — and thereby help break down — target molecules quickly
    or slowly. “We showed that most hunter-gatherer populations present fast-acetylation
    alleles,” he says, “whereas the slower acetylators are very common in farmer-descended
    populations, like with most Europeans and particularly in the Middle East.” NAT2
    is also associated with the metabolism of folate, the natural form of folic acid,
    normally obtained from leafy greens or animal liver. Quintana-Murci’s team proposed
    a model in which the sharp drop in folate intake associated with a shift to a
    grain- and cereal-rich diet favoured the emergence of alleles that suppress use
    of folate reserves, although he emphasizes that this is a purely speculative until
    further data are available.


    Both versions of the NAT2 enzyme carry certain disadvantages, as acetylation can
    actually enhance rather than reduce the toxicity of certain compounds: fast acetylation
    is linked with colon and lung cancers, whereas slow acetylation is associated
    with prostate and bladder cancers. Therefore, any nutritional benefits are likely
    to be closely balanced against the potentially harmful outcomes of NAT2 variation.


    There are a number of other instances where selective pressures appear to have
    resulted in a trade-off. For example, although the twenty-odd T2R proteins involved
    in bitter taste perception represent a potent ally warning against consuming harmful
    compounds, the genes encoding these factors also exhibit a striking level of variability
    (see More than meets the mouth, page S18). Unusual patterns of distribution have
    been observed for several variants that could alter the sensitivity of the mouth
    to bitter chemicals. “It’s clear that there are ethnic differences in the composition
    of T2R haplotypes,” says Wolfgang Meyerhof, geneticist at the German Institute
    of Human Nutrition in Nuthetal.


    In a study of taste variation in central African populations by Meyerhof and colleagues,
    one low-sensitivity variant of the T2R16 bitter receptor, which normally responds
    to cyanogenic glycosides found in the starchy tuber cassava, was found to be unexpectedly
    common. These glycosides are metabolized in the gut to release toxic cyanide.
    The researchers speculated that the health costs of consuming potentially toxic
    compounds must be balanced by some sort of positive selection, perhaps arising
    from enhanced resistance against the malarial parasites that are widespread in
    this region, to sustain this allele in the population.


