    A second major shift in human lactation research entails the incorporation of
    new tools to answer traditional questions — such as comparing the effects of breast
    and formula feeding — and to grapple with evolutionary and functional issues.
    Human milk is dilute compared to the milk of other placental mammals, but it does
    contain some surprising ingredients. Advances in high-throughput mass spectrometry,
    for example, have revealed the existence of more than 200 human milk oligosaccharides
    (HMOs). Calito Lebrilla, an analytical chemist at the University of California,
    Davis, has found that mothers seem to produce individual complements of about
    100 HMOs — but no one has figured out why different mothers produce different
    sets of HMOs, or even if it is the same complement of HMOs for each child.


    Although they are carbohydrates, HMOs do not appear to nourish infants. Instead
    they feed certain gut bacteria, giving them a competitive edge over other species.
    “When a child is born its gut is rapidly populated by pathogenic bacteria,” says
    Lebrilla. “However as the child is fed human milk the population changes to beneficial


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_6_0.png)


    species.” Bifidobacterium infantis, which protects against diarrhoea, is particularly
    efficient at metabolizing the small-mass HMOs that abound in early lactation⁴.
    So breast milk gives B. infantis an advantage over other species in establishing
    a gut population. “The mother is therefore ‘selecting’ specific bacteria to grow
    in the infant’s gut by her HMOs,” says Lebrilla.


    Furthermore, some HMOs can inhibit harmful bacteria and viruses directly. For
    example, certain HMOs block the binding of Campylobacter jejuni, the most common
    cause of bacterial diarrhoea, to intestinal mucosa, and thereby inhibiting pathogenesis⁵.


    Human milk also delivers some microbes directly to the gut. Breast milk is laced
    with several species of lactic acid bacteria from the mother’s intestine that
    are thought to travel to her mammary glands inside white blood cells. Most of
    these species inhibit pathogenic bacteria by secreting hydrogen peroxide and compounds
    called bacteriocins.


    The past decade has seen a large extension in the list of immunological factors
    present in human milk. Breast milk was long thought to provide only passive immunity
    to infants, through maternal antibodies in the form of secretory immunoglobulin
    A. However, the newly identified crop of immune-regulatory proteins could be prompting
    and modulating development of the infant’s own immune system. Of particular interest
    are cytokines, which orchestrate the immune system by signalling between its cells.


    There is even evidence that breast milk influences gene expression in infant gut
    cells. In a pilot study, Sharon Donovan, a paediatric nutritionist at the University
    of Illinois, and Robert Chapkin, a biochemist at Texas A&M University, extracted
