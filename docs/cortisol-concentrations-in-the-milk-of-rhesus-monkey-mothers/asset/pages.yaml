    # DIVERSITY


    # # Of beans and genes


    *Several human genes involved in digestion have diverged along cultural lines.
    Research suggests these adaptations influence the range of foods tolerated and
    even certain diseases.*


    **BY MICHAEL EINSTEIN**


    Nathaniel Dominy was surprised to find that diet-related genes, like people, sometimes
    simply repeat themselves to get a point across rather than change the message.


    In 2007 while most evolutionary biologists were looking for evidence of selection
    in the form of genetic mutations, Dominy and colleagues learned that people with
    high-starch diets had additional copies of the gene coding salivary amylase and
    that these repeats increased production of the carbohydrate-processing enzyme.
    “Few would have expected at the time that [these repeats] could have any effect
    at all ... and they had a big effect,” recalls Dominy, an anthropologist at Dartmouth
    College in New Hampshire.


    This discovery also offered proof to the growing number of evolutionary geneticists
    who believe that culture-specific factors, such as diet, have had a powerful effect
    on human evolution as more obvious externalities like climate and habitat—some
    even suggesting that these factors could have accelerated the overall evolutionary
    pace. “I don’t think we have the data yet to make those claims,” cautions Mark
    Stoneking, a population geneticist at the Max Planck Institute in Leipzig, Germany.


    > “[But] there certainly has been recent evolution in modern humans because of
    responses to natural selection, and culture may very well be playing a role in
    a lot of those.”


    # ## THE GENETICS OF LUNCH


    Even if you can enjoy a cold glass of milk without then feeling sick to your stomach,
    chances are you know somebody who can’t. In fact, adult lactose intolerance is
    the biologically ‘normal’ state of affairs. “The gene pattern in mammals is to
    lose lactase expression after weaning,” explains Dallas Swallow, a geneticist
    at University College London.


    Nevertheless, adults with ‘lactase persistence’ are widespread in many parts of
    the world. For example, lactase persistence is characteristic of 89%–96% of Scandinavian
    and British people, is widespread among pastoralist cultures in Africa and the
    Middle East, but appears in only 1% of Chinese individuals.


    Although one single nucleotide polymorphism (SNP) affecting lactase gene expression
    accounts for the vast majority of European instances, this trait seems to have
    arisen independently in different regions of Africa as a result of several distinct
    yet tightly clustered variations within a regulatory segment of the lactase gene.
    “That’s convergent or parallel evolution,” says Swallow. “The same phenotype is
    being selected, with different mutations causing that phenotype.”


    Each of these variants is thought to have emerged within the last 10,000 years,
    roughly coinciding with the emergence of agriculture and dairy farming, and conferring
    obvious advantages on those cultures. “Milk is nutritionally good, and if you
    don’t have lactase you can’t digest the main carbohydrates in it: you might get
    diarrhoea or flatulence, and you’ve lost a source of food, water and calcium,”
    says Swallow. “In the context of African tribes, the most plausible thing is that
    it was a source of clean, nutritious liquid.”


    Most geneticists cite lactase persistence as a leading example of recent human
    evolution driven by shifts in culture and diet. “This happens to be a ‘low-hanging
    fruit’,” says Sarah Tishkoff, a geneticist at the University of Pennsylvania.
    “It’s a Mendelian trait and it left a really strong selection signature.” Identifying
    other, equally clear examples has proven challenging, although the subsequent
    amylase breakthrough by Dominy and colleagues suggests that other


