    M Garaulet¹,², MD Corbalán¹, JA Madrid¹, E Morales¹, JC Baraza¹, YC Lee² and JM
    Ordovas²


    ¹Department of Physiology, University of Murcia, Murcia, Spain and ²Jean Mayer
    US Department of Agriculture Human Nutrition Research Center on Aging, Tufts University
    School of Medicine, Boston, MA, USA


    **Introduction:** The success of obesity therapy is dependent on the genetic background
    of the patient. Circadian locomotor Output Cycles Kaput (CLOCK), one of the transcription
    factors from the positive limb of the molecular clock, is involved in metabolic
    alterations.


    **Objective:** To investigate whether five candidate polymorphisms from CLOCK
    were associated with anthropometric, metabolic measures and weight loss in response
    to a behavioural weight reduction programme based on the Mediterranean diet.


    **Methods:** Five hundred overweight/obese subjects, aged 20–65 years, who attended
    outpatient clinics specializing in obesity, were studied. Anthropometric, biochemical
    and dietary intake values were analysed. Effectiveness of the programme and weight
    loss progression during 28 weeks of treatment was assessed.


    **Results:** Four of five CLOCK SNPs selected were significantly associated with
    obesity variables (P < 0.05). The genetic variation in the rs1801260 CLOCK was
    associated with obesity at baseline and also affected weight loss. Patients with
    the variant allele (G) lost significantly less weight (P = 0.008) compared with
    wild type. Repeated measures analysis showed that weight loss over time was significantly
    different between rs1801260 CLOCK variations (P = 0.038). Carriers of the G allele
    displayed greater difficulty in losing weight than non-carriers. In this particular
    polymorphism, the frequency of short-time sleepers (≤6 h per day) was greater
    in minor allele carriers than in non-carriers (59% vs 41%; P < 0.05). CLOCK polymorphisms
    were also associated with significant differences in total plasma cholesterol
    at the completion of dietary treatment (P < 0.05).


    **Conclusions:** We have replicated previous studies showing a relationship between
    CLOCK gene polymorphisms and obesity. CLOCK rs1801260 SNP may predict the outcome
    of body weight reduction strategies based on low-energy diets.


    *International Journal of Obesity (2010) 34, 516–523; doi:10.1038/ijo.2009.255;
    published online 12 January 2010*


    **Keywords:** CLOCK; polymorphism; behavioural therapy


    # Introduction


    Weight loss in response to obesity management strategies shows a wide range of
    interindividual variation that is largely influenced by nutritional, hormonal
    and psycho-behavioural factors. In addition, the success of obesity therapy may
    be modulated by the genetic background of the patient,¹ as shown by studies carried
    out in monozygotic twins; weight loss seems to show substantial heritability.
    In addition, parental obesity has a role in the likelihood of obesity in


    offspring.¹ A number of potential candidate genes has been previously examined
    for associations with body weight loss and weight loss maintenance.²–⁵


    The Human Obesity Gene Map lists about 250 loci possibly involved in the development
    of obesity.¹ However, results from association studies for most of these loci
    are inconclusive for obesity and weight loss outcomes. Although some studies find
    no associations between weight loss and candidate genes,⁶ others have shown that
    changes in fat mass were predicted by polymorphisms at several obesity candidate
    genes, explaining up to 8.5% of the fat mass variance.¹ Examples of genes related
    to changes in fat mass include leptin, G protein, ADRB3, PPARγ and perilipin.²–⁵


    Recent clinical and epidemiological studies have shown significant relationships
    between chronobiology and obesity. For example, shift work, sleep deprivation
    and bright light exposure at night have been associated with increased


