  md: '"peoples'' excrement," says Neswald. "In nutrition experiments, it was vital
    to assess the differences between input and output — food going in and all products
    coming out."


    This method, known as ''balance trials,'' was pioneered in the 1836 by French
    chemist Jean-Baptiste Boussingault. He conducted balance trials for nitrogen —
    a constituent element of proteins — by comparing the nitrogen content of hay,
    oats and potatoes fed to cows and horses with the animals'' excrement and, in
    the case of cows, milk. He showed that animal feed contained sufficient nitrogen
    to meet body''s requirements, ending speculation that additional nitrogen was
    obtained from the atmosphere.


    # ### MACRONUTRIENT EXPLORATION


    By the mid nineteenth century, scientists had learned that the primary elements
    in food are carbon, nitrogen, hydrogen and oxygen, and had divided food constituents
    into four main types: carbohydrates, fats, protein and water. Yet the chemical
    make-up of the first three classes was unknown.


    It was a German chemist, Justus von Liebig, who made the next leap forward. The
    precocious von Liebig (appointed professor at the University of Giessen at age
    21) invented the ''kalipparat'', a special piece of glassware for analysis of
    carbon in organic compounds.


    Von Liebig''s laboratory, arguably the first teaching laboratory, attracted scientists
    from around the world. He helped train a generation of nutritional researchers
    whose work would carry on into the early twentieth century.


    In the 1860s, for example, two of von Liebig''s protégés — physiologist Carl Voit
    and chemist Max Joseph von Pettenkofer — obtained funding from the Bavarian government
    to build a state-of-the-art respiration chamber large enough to hold a person.
    The chamber could measure the daily balance of both carbon and nitrogen and thereby
    estimate human protein requirements.


    Neswald notes that most of the nutrition research of this period focused not on
    the health of individuals, but rather on finding the cheapest, easiest methods
    to feed "institutionalized and impoverished populations" to prevent food riots.
    Von Voit, says Neswald, visited prisons and workhouses "to assess what people
    were fed and what their state of health was, with the aim of providing dietary
    guidelines".


    The concept of food as fuel, which contains important dietary components, was
    further refined in the United States. Agricultural chemist Wilbur Olin Atwater
    had spent time in von Voit''s laboratory as a postdoc, returning to the United
    States in 1871 to spearhead nutrition science. Atwater spent five years in the
    1890s building a respiration calorimeter


    larger than von Voit''s and able to hold humans for longer than a day. His measurements
    were so precise that his energy equivalents for protein, fat and carbohydrate
    are still used today. Atwater was first to adopt the word ''calorie'' as an energy
    unit for food. (A calorie of food energy is actually equivalent to 1000 calories
    of thermal energy.)


    # ### SMALLER AND SMALLER


    Scientists soon began to realize that in addition to supplying energy and macronutrients,
    food also played a more subtle role in health and disease. Japanese physician
    Takaki Kanehiro, who studied in the 1870s at St Thomas''s Hospital Medical School
    in London, was a rare exception to the nineteenth century German dominance of
    nutrition. "He was the first person to show that beriberi arises from malnutrition,"
    says Katsuhiko Yokoi, a human nutritionist at Seitoku University in Japan. Previously
    beri-beri was thought to be an infectious disease.


    By the early twentieth century, other scientists around the world had begun to
    explore links between nutritional deficiencies and other ailments, including rickets
    and


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_17_0.png)


    scurvy. Unable to explain these afflictions in terms of fats, protein or carbohydrates,
    some scientists began to suspect the existence of another class of food ingredients.


    It was Polish biochemist Casimir Funk who in 1912, while studying beriberi, isolated
    thiamine, the nutrient that protects against this disease. He called the substance
    a ''vital amine,'' which soon became ''vitamin''.


    The battle against scurvy is an example of science later refining a nutrition-related
    disease association. In the mid-eighteenth century, Scottish naval physician James
    Lind found that scurvy could be treated or prevented by eating citrus fruits.
    But he incorrectly thought that sea air was to blame for the disease. Other erroneous
    suggestions followed. In 1846, for example, Scottish toxicologist Robert Christison
    hypothesized that scurvy was caused by protein deficiency. Scurvy continued to
    be a sporadic problem into the early twentieth century. It was not until 1932
    that


    US biochemist Charles Glen King showed that scurvy was caused by a deficiency
    of the newly discovered vitamin C.


    Animal research led to further vitamin and disease-related discoveries. US biochemist
    Elmer Vernon McCollum learned German so he could read the works of past nutrition
    researchers, which inspired him to experiment on rats. At the University of Wisconsin,
    where McCollum initially worked, research protocols stipulated the use of cows
    as animal models. But McCollum convinced his superiors to let him try smaller
    animals. He bought 12 albino rats from a pet store and established the first colony
    of rats for nutritional experimentation in the United States. In 1913, his studies
    with these rats led him to identify the first fat-soluble vitamin, vitamin A,
    and later showed that it is vitamin D — and not vitamin A as some thought — that
    prevents rickets.


    Proving the link between micronutrients and disease did not come easily. US Public
    Health Service worker and epidemiologist Joseph Goldberger theorized that pellagra,
    then a major disease causing diarrhoea, dermatitis, dementia and death, was diet-related
    and not, as prevailing medical opinion held at the time, an infectious disease.
    In 1916, to prove his point, Goldberger and his assistant subjected themselves
    to a series of tests — they injected each other with blood from a pellagra sufferer,
    swabbed out the secretions of a pellagra-infected person''s nose and throat and
    rubbed them into their own, and swallowed capsules containing scabs of pellagra
    sufferers'' rashes. And yet despite such gross exposure, they did not develop
    pellagra. However, Goldberger was unable to find the diet-related cause. It was
    another two decades before American biochemist Conrad Elvehjem realized that pellagra
    was caused by a deficiency of niacin (vitamin B3).


    So many micronutrients had been discovered by 1944 that some believed the field
    of nutrition had been fully defined with little else to discover. But while the
    constituent parts of food might have been teased out, their impact on the body
    was only starting to be appreciated.


    From Lavoisier, through von Liebig, to scientists today such as José Ordovas (see
    Big science at the table, page S2), nutrition research has focused on smaller
    and smaller elements. As scientists have probed deeper into biochemical mechanisms
    of bodily absorption and function — unlocking mysteries as they go — they have
    also triggered new questions, until we get to ''how do our genes interact with
    the food we eat?'' And that''s the question we are still trying to answer today.
    ■


    *Ned Stafford is a science writer in Hamburg.*'
