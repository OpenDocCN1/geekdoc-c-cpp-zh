- pgno: 41
  md: 'have revealed that mice with disruption of the Clock gene are prone to develop
    obesity and a phenotype resembling MetS.9 In a similar vein, we have recently
    provided evidence of CLOCK gene expression in human adipose tissue and shown its
    association with waist circumference and different components of the MetS.28 The
    precise mechanisms linking MetS to circadian system disruption are not well known.
    However, most hypotheses suggest that the internal desynchronization (ID) between
    different circadian rhythms involved in metabolism is a key factor in the development
    of MetS.29


    Our dietary intervention study has revealed that minor allele carriers of rs1801260
    at the CLOCK locus are more resistant to weight loss and to metabolic changes
    in response to an energy-restricted diet than AA homozygotes. Previous research
    supports the hypothesis that individual CLOCK genotypes may influence several
    variables linked with behaviour in both healthy individuals and in those with
    mental illness.30 Specifically, for rs1801260, it has been shown that this polymorphism
    is related to clinical features of mood disorders influencing diurnal preference
    in healthy humans and that it causes sleep phase delay and insomnia in people
    with depression and bipolar disorder.30,32 These alterations could be related
    not only to obesity but also to weight loss. Along the same lines, we have previously
    shown that most of the obstacles of weight loss are related to the subject’s eating
    behaviours and psychological characteristics and that these obstacles are directly
    related to the difficulty in losing weight.14 Moreover, previous works have related
    rs1801260 to eating disorders and obesity.1,2,25


    This idea is supported by animal findings suggesting a direct involvement of the
    Clock gene in the regulation of body weight, as homozygous Clock mutant mice developed
    obesity, hyperphagia and also suffered from changes in eating behaviour, sleep
    pattern and mood.4 Interestingly, we found that minor allele carriers of the rs1801260
    variant had a tendency to sleep less than major allele subjects. Our data are
    consistent with earlier studies associating this SNP with insomnia30 and also
    with epidemiological studies that indicate that sleep deprivation may increase
    the risk of obesity and weight gain.33 Although the molecular mechanisms underlying
    the observed results remain unknown, we can hypothesise from this study that carriers
    of the rs1801260 variant allele might experience a disruption in the chronobiology
    system similar to that shown in the Clock knockout mouse. Loss of the Clock gene
    in the animal model affects obesity, sleep and eating behaviours that may, in
    human subjects, consequently influence weight loss as well.


    In a previous study, investigators reported that polymorphisms in a panel of obesity-related
    candidate genes have a minor role, if any, in modulating weight changes induced
    by a moderately hypo-energetic diet.4 The investigators concluded that none of
    the genetic variants they examined had a significant association with weight loss
    in the intervention. Although the CLOCK gene was not included in that study, one
    important difference between


    the earlier study and this study was that in the earlier study the duration of
    interventions was limited to 10 weeks, whereas in this study the loss treatment
    was followed for 28 weeks. Sorenson et al.6 have suggested that more prolonged
    interventions are necessary to effectively evaluate the roles of particular polymorphisms
    in weight loss, and to detect differences among variants. Indeed, in this study,
    the most important differences between rs1801260 variants in weight loss were
    identified since the third month of treatment. Other studies that have identified
    associations between genetic variants and weight loss in obese populations have
    used intervention durations similar to those used in our study.1 Up to this point,
    most of the studies that have evaluated relationships between genetic variants
    and weight loss achieved through interventions have focused on genes related to
    energy expenditure, appetite control, adipogenesis or genes related to insulin
    resistance and lipid metabolism.1 Our study expands the realm of current knowledge
    by showing a potential role for circadian clock genes on weight loss.


    In conclusion, in this intervention trial performed in a Mediterranean population,
    we have replicated previous studies that reported relationships between CLOCK
    gene polymorphisms and obesity. Our results showed that rs1801260 may predict
    the outcome of weight loss strategies that are based on low-energy diets. Carriers
    of the G allele may exhibit a greater degree of obesity and experience greater
    difficulty in losing weight in response to a low-energy diet. The difficulty was
    consistently observed throughout the treatment period, although it was most evident
    since the third month of treatment. These data suggest that CLOCK gene polymorphisms
    may predict weight loss magnitude in response to a low-energy diet.


