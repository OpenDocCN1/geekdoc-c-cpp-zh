  md: "![](img/8e929f63d67ad563cea21a4a5b22eea4_10_0.png)\n\n# HEALTH\n\n# # Edible\
    \ advice\n\n*Diet-related illnesses are some of the biggest killers today. Can\
    \ we tailor our food intake to prevent these diseases? Large international projects\
    \ are underway to find out.*\n\n**BY FAROOQ AHMED**\n\n“Too much tea can treble\
    \ cancer risk in women,” “Tea could cut risk of ovarian cancer”. Just two examples\
    \ of the contradictory newspaper headlines that confuse the public about the health\
    \ benefits — or risks — of food and genuine nutrition-related research.\n\nFor\
    \ some diseases such as diabetes the link with food is subtle. “Although we know\
    \ that dietary factors are related to the risk of diabetes, there are a lot of\
    \ inconsistencies between studies in terms of what precise micronutrients or macronutrients\
    \ associate with the disease. We’re quite limited in terms of the data,” explains\
    \ Nick Wareham, head of the epidemiology unit at the UK’s Medical Research Council.\n\
    \nUsing new tools and methodologies, ambitious projects are underway to make up\
    \ this shortfall. One such effort, which Wareham coordinates, is InterAct — a\
    \ multinational study to define how diet and lifestyle influence risk of type\
    \ 2 diabetes. This disorder of blood glucose regulation is a growing problem in\
    \ Europe, afflicting nearly 40% of the population at some point in their lifetime.\
    \ InterAct estimates that the diabetes accounts for as much as 10% of health care\
    \ costs in Europe.\n\nThrough endeavours such as InterAct, researchers are starting\
    \ to expose the complex interplay of genetics, diet and disease, and bring order\
    \ to the confusing array of nutritional information.\n\nInterAct began in 2006\
    \ as part of the European Community’s sixth Framework Programme. It has a budget\
    \ of €10 million and involves more than 12,000 patients recently diagnosed with\
    \ diabetes across 10 countries — nine in Europe plus India. Such a broad cohort\
    \ is important. “Sometimes variation within a country is not so great,” says Wareham.\
    \ “International efforts give you heterogeneity in the lifestyles of patients,\
    \ especially in the diet, and that’s a major advantage.” This diversity provides\
    \ scientists with more variables to study as they attempt to untangle what factors\
    \ are responsible for causing disease.\n\n# ## THE BIGGER THE BETTER\n\nThis research\
    \ is part of the largest diet and disease study ever undertaken: the European\
    \ Prospective Investigation into Cancer and Nutrition (EPIC). Initiated in 1992,\
    \ EPIC has recruited more than half a million people. Participants are physically\
    \ examined at one of 23 centres, complete lifestyle surveys including detailed\
    \ diet questionnaires, and have their blood tested.\n\nblood tested. Their DNA\
    \ is scanned for disease-related genes using techniques that can detect hundreds\
    \ of thousands of genetic variants in large numbers of individuals.\n\n“Large-scale\
    \ projects can really be a catalyst to bring together multiple centres to share\
    \ instruments,” says Wareham. “InterAct has benefited greatly from the huge EPIC\
    \ cohort and access to those technologies.”\n\nAnother large-scale study, a parallel\
    \ to InterAct though not part of EPIC, is Interheart — which examined the link\
    \ between dietary patterns and heart-attack risk. Between 1999 and 2003, the Canadian-led\
    \ study recruited 5,761 patients and 10,646 control subjects, living in 52 countries,\
    \ across six continents. Using questionnaires, physical examinations, and blood\
    \ analysis, the teams compiled data on people including demography, diet, anthropometric\
    \ measurements such as body mass index and biomarker levels including cholesterol\
    \ and lipoproteins.\n\nInterheart researchers concluded that the globalization\
    \ of a Western pattern diet — high in animal products, fried foods, and salty\
    \ snacks — is responsible for a third of the risk of heart attack worldwide.¹\
    \ A prudent diet rich in fruits and vegetables reduced risk regardless of location.\
    \ Prior to Interheart, few epidemiological studies linked dietary patterns in\
    \ ethnically diverse populations and cultures to disease. Research like this “is\
    \ crucial if we truly want to understand these diseases, because they manifest\
    \ differently in European and other populations,” says nutritional geneticist\
    \ Jim Kaput, who also serves as director of the Division of Personalized Nutrition\
    \ and Medicine at the US Food and Drug Administration.\n\n# ## CROSSED PATHWAYS\n\
    \nInterAct and Interheart both demonstrate that the metabolic pathways at the\
    \ epicentre of dietary-related illnesses, such as diabetes and cardiovascular\
    \ disease, are strongly related. One reason one can uncover clues to the other.\n\
    \n“Factors like blood pressure, cholesterol and triglyceride levels, which are\
    \ predictive of coronary heart disease, are also associated with diabetes,” notes\
    \ Wareham.\n\nLeafy vegetables, such as lettuce and spinach, are core components\
    \ of the prudent diet and are identified by the Interheart study. These vegetables\
    \ are enriched in polyunsaturated fatty acids (PUFAs) — essential macronutrients\
    \ also found in some types of fishes, nuts and cheese. Two types of PUFAs in particular,\
    \ omega-3 and omega-6, are powerful dietary components because they can change\
    \ gene expression, both directly and indirectly. PUFAs “act more like hormones\
    \ than like typical food,” says nutrition scientist Donald Jump of Oregon State\
    \ University, who studies these macro-nutrients.\n\nFor example, PUFAs have two\
