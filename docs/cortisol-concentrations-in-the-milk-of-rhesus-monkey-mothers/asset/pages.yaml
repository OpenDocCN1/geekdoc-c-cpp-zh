    # TASTE


    # # More than meets the mouth


    *Certain things taste differently to different people. Why is this, and does this
    affect our choice of food?*


    **BY MICHAEL EISENSTEIN**


    Nearly 80 years after DuPont chemists stumbled across evidence of genetic variation
    in perception of the bitter-tasting compound phenylthiocarbamide (PTC), Danielle
    Reed’s team at the Monell Chemical Senses Center in Philadelphia, Pennsylvania,
    made a similarly serendipitous discovery.


    Reed was approaching her a lab technician worried she made a mistake with a experimental
    quinine preparation. “She said, ‘I think I made the solutions wrong — here, taste
    this,’” recalls Reed, who then tasted the bitter compound. “I’m like, ‘ugh, it
    seems fine to me.’ But she said, ‘It tastes like water to me.’”


    This strange observation eventually led to the discovery of a genetic locus that
    affects our tongue’s ability to detect bitterness in quinine — a big step on the
    road to understanding how people differ from one another in terms of taste, and
    how these differences shape what we like to eat.


    # A BITTER TASTE


    Bitter is one of the five primary tastes — along with sweet, sour, salty and the
    savoury umami — that compose the gustatory system. Of these, bitter is perhaps
    the best characterized in terms of the influence of genetic variability on taste.


    In humans, the cells responsible for bitter taste perception express 25 receptors
    (T2Rs) that vary in the chemicals they recognize but which appear to form a common
    role in preventing people from eating toxic compounds. Accordingly, some scientists
    are convinced that humans evolved taste to detect harmful substances. “A newborn
    baby is born loving sweet and hating bitter — no experience required,” says Linda
    Bartoshuk, director of human research at the Center for Smell and Taste at the
    University of Florida.


    Insensitive variants have been identified in several bitter receptor genes and
    are common in the general population. For example, mutations in T2R38 render individuals
    incapable of tasting PTC or the related compound 6-n-propylthiouracil (PROP).


    Such limited sensitivity can be an asset as many nutritive vegetables, including
    broccoli and sprouts, also produce bitter tasting glucosinolates. These compounds
    include goitrin, a thyroid toxin in large doses but which may protect against
    cancer in lower doses.


    There are obvious nutritional advantages in mitigating the urge to avoid sprouts,
    and the adaptive value of this reduced sensitivity allele is evident in its global
    distribution alongside the more common sensitive version.


    “The ratio of the alleles varies depending on where you go,” says Paul Breslin,
    a taste perception researcher at Monell, “but you see that both have been maintained
    in almost every population you look at anywhere on Earth.”


    Yet efforts to firmly link individual genetic variations with altered food preferences
    have not been easy. Several studies have revealed geographic or ethnic differences
    in the distribution of taste receptor variants that may have arisen from selective
    pressures (see *Of beans and genes*, page S13), but their effects on diet — and
    association with overall health — are controversial. “I’m a PTC non-taster: I
    can’t taste goitrin in vegetables very well. But I think this has very little
    to do with how much broccoli I choose to eat on a daily basis,” says Reed.


    Attempts to establish similar correlations between disease and taste have proven
    equally problematic. For example, there is no clear link between sensitivity to
    sweet tastes and predisposition to obesity, diabetes or other diseases related
    to excess consumption of sugars.


    Some of the strongest connections identified relate to alcohol preference. In
    one study, Bartoshuk partnered with Yale University geneticist Ken Kidd to examine
    how bitter taste shapes alcohol perception within a cohort of students. “There
    was a clear relationship between sensitivity and whether ethanol is perceived
    as bitter and harsh or slightly sweet,” says Kidd. “Among those who were homozygous
    for the high-sensitivity [bitterness allele], nobody drank very much.” Other studies
    at Monell have hinted at a parallel role for sweetness receptor variation, where
    sensitivity to sweet tastes and preference for sweet tastes is seemingly correlated
    with alcohol consumption. However, Kidd and others point out that this variability


