  md: 'and metabolic pathways. Metabolites are small molecules — amino acids, vitamins
    and other chemicals — in circulation and influenced by both genes and nutrient
    intake. Metabolomics, or the study of these metabolites, offers perhaps the best
    opportunity to observe these interactions in a minimally invasive manner.


    Metabolic phenotypes can be very finely segregated, as demonstrated in an analysis
    of urinary metabolite patterns found in thousands of individuals in China, Japan,
    the United Kingdom and the United States. Not only did East Asians have a different
    pattern of metabolites from Western populations, but individuals from northern
    China could be differentiated from those in southern China. Both Chinese groups
    were distinct from Japanese, who were in turn different from Japanese Americans.
    People who consumed a lot of meat, as is common in Western diets, had elevated
    levels of biomarkers indicative of high blood pressure compared with people who
    have a primarily vegetarian diet.


    InterAct is also searching for novel biomarkers that accumulate as an individual’s
    risk of diabetes rises. When combined with epidemiological studies, this type
    of metabolic phenotyping could lead to the identification of biological risk flags
    for individuals, even before disease manifests. Biomarker metabolites might also
    be therapeutic targets one day.


    # BREAKING DOWN SILOS


    While large-scale scientific projects such as InterAct and Interheart have had
    success, barriers still exist to international collaborations. Researchers occasionally
    encounter a lack of willingness or an inability to share information. “It has
    sometimes been a challenge to convince colleagues who run the individual centres
    that by working together we end up with better science,” says Wareham.


    Kaput agrees. He suggests that biologists take a page from the physicists’ handbook.
    “They built the Large Hadron Collider, thereby working across disciplines”, he
    says, “but we still haven’t made the silos go away in the biological sciences
    community.”


    Wareham has faith in the technology-driven approach that encourages and facilitates
    collaboration. These major projects, he says, can bring different disciplines
    closer together — as they have in the genetic Map project. “The ability to measure
    multiple SNPs at very low cost on a mass scale revolutionized that field, and
    I think that’s where we’re headed for other risk factors such as diet and nutrition,”
    contends Wareham.


    Such a large-scale, system-wide approach is being used by Kaput and FDA chemist
    Carolyn Wise. They are considering early environmental influences, micronutrient
    availability, metabolic and regulatory pathways and genome-wide association maps
    as they try to define combined genetic–metabolic types for people in terms of
    obesity and type 2 diabetes.⁵ This approach can be emulated and scaled in other
    studies to help researchers work together and share information as they try to
    make sense of huge amounts of data.


    # SUPPLEMENTARY ASSESSMENT


    Common ingredients and nutritional supplements and their relative health benefits.
    Larger, darker circles indicate greater likelihood that the supplement helps.


    ![](img/8e929f63d67ad563cea21a4a5b22eea4_12_0.png)


    Adapted from www.informationisbeautiful.net/play/snake-oil-supplements/


    As these nutrigenomic studies begin to classify individuals into specific groups
    based on the interplay of their lifestyle, metabolic pathways and genetic variants,
    tailored diets may become early therapeutic interventions. Personalized diets
    might even guide people genetically at risk for diabetes, but not yet in a pre-diabetic
    state, to help them avoid developing the disorder by fine-tuning what they eat.
    A well-regulated ounce of prevention could obviate the need for a cure.


    # PREVENTION IS BETTER THAN CURE


    However, the development of personalized diets has been prematurely promised before.
    In the early 2000s, a slew of companies claimed to be able to provide personalized
    nutritional advice based on genetic tests. An investigation by the US Government
    Accountability Office in 2006 found that these companies “misled consumers” and
    provided only generalized advice. The US Senate Special Committee on Aging convened
    a hearing that further criticized these direct-to-consumer genetic tests. Unable
    to secure funding, several of these companies went bust.


    Here, says Kaput, is where the FDA’s Division of Personalized Nutrition and Medicine
    is ahead of the curve. “Right now, we don’t have a product to regulate. We’re
    not sure where the field is going necessarily, but when products come in for possible
    FDA regulatory activities, we will have the research background to help the regulatory
    centres make their evaluation.”


    Teasing out the relationship between food and disease is a tricky task, one that
    involves tens of thousands of people and encompasses hundreds of nutritional and
    genetic factors. It is not likely to provide simple or quick fixes either, meaning
    that for now at least the ‘tea causes cancer’ stories can safely be ignored.


    *Farooq Ahmed is a science writer in New York.*


