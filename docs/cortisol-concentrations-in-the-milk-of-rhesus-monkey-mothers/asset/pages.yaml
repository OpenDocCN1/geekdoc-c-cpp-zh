  md: "![](img/8e929f63d67ad563cea21a4a5b22eea4_8_0.png)\n\n# EVOLUTION\n\n# # The\
    \ first super\n\n*Diet-directed evolution shaped our brains, but whether it was\
    \ meat or tubers, or their preparation, that spurred our divergence from other\
    \ primates remains a matter of hot debate.*\n\n**BY MICHAEL EISENSTEIN**\n\nGiven\
    \ the millions of years since our ancestors parted ways, it’s unsurprising that\
    \ a chimpanzee’s idea of a good meal differs from our own. “When I visited our\
    \ study site in Uganda, I followed a chimp in the forest for a day and tried to\
    \ eat everything it ate,” recalls Svante Pääbo, an evolutionary geneticist at\
    \ the Max Planck Institute in Leipzig, Germany. “It’s too disgusting and not digestible\
    \ — you can’t really do it.”\n\nPart of the reason is genetics. In 2008, Pääbo\
    \ and colleagues found evidence for accelerated evolution of both the regulatory\
    \ and coding sequences of diet-related genes shared by chimpanzees and humans¹.\
    \ Many anthropologists now believe that radical changes in diet may have been\
    \ a major driver of hominin evolution and possibly even the primary factor that\
    \ propelled our genus *Homo* forward by enabling us to survive and thrive.\n\n\
    One evolutionary milestone was encephalization: an enlargement of the brain estimated\
    \ to have begun roughly 1.8 million years ago when *Homo habilis* transitioned\
    \ to *Homo erectus*. What powered this growth spurt remains a subject of ongoing\
    \ debate.\n\n# ## MEAT AND POTATOES\n\nA big brain is a huge investment in metabolic\
    \ terms. One model advanced in the mid-1990s, the expensive tissue hypothesis,\
    \ suggests our ancestors settled that bill by gaining access to more nutrient-rich\
    \ diets, which spurred brain growth while reducing gut size. Scientists have suggested\
    \ that the wealth of vitamins, proteins and fats in meat was a major boon and\
    \ there is evidence our ancestors used stone tools to carve up their food as early\
    \ as 2.5 million years ago. An article published in *Nature* this year reported\
    \ the find of 3.4 million-year-old fossil bones scarred by cutting tools, pushing\
    \ the date back further still to australopithicines.\n\n“There’s fairly decent\
    \ evidence that meat was likely a piece of the diet of australopithecines,” says\
    \ Josh Snodgrass, an anthropologist at the University of Oregon, “but they were\
    \ probably eating diets that were much more plant-based.” Given the richness of\
    \ nutrients in meat, Snodgrass believes that even minor changes would have had\
    \ a big impact on caloric intake and contends that use of more sophisticated tools\
    \ may have increased consumption of meat in early hominins. “Access to high-quality\
    \ animal foods was probably at least one of the major driving factors in allowing\
    \ [encephalization] to happen,” he says.\n\nOn the other hand, the pursuit of\
    \ a steak dinner is not without hazards, according to David Braun, an archaeologist\
    \ at the University of Cape Town in South Africa. “There are multiple consequences\
    \ of making that shift,” he says. “There are costs of predator-prey interaction,\
    \ of entering into a niche that hominins\n\naren’t necessarily all that well-adapted\
    \ to, and all kinds of parasitological costs.”\n\nDartmouth College anthropologist\
    \ Nathaniel Dominy favours the view that our ancestors might have put their tools\
    \ to better use in unearthing root vegetables. He has observed how modern hunter-gatherers\
    \ survive in an African savannah-like environment that may not be radically dissimilar\
    \ from where *H. erectus* flourished. He suggests that tubers offered an essential\
    \ buffer against the vicissitudes of the hunter lifestyle. “Modern hunter-gatherers\
    \ have language, technology and iron-tipped spears, and they still struggle to\
    \ get enough meat to survive,” he says. “It’s hard to imagine a bunch of hominins\
    \ without those accoutrements getting a lot of meat.” Tubers were abundant and\
    \ may have provided the staple nutrients needed to make brain growth adaptive\
    \ when easy access to meat was no sure thing.\n\nHowever, efficient tuber digestion\
    \ depends on another major technological advance — cooking. “Most tubers absolutely\
    \ require roasting,” says Dominy. Harvard University anthropologist Richard Wrangham\
    \ believes this is not a problem. In 1999, he published a controversial article\
    \ promoting his hypothesis that controlled fire and cooking became a component\
    \ of the hominin toolbox as early as two\n\n> **NATURE.COM**\n> \n> For more on\
    \ how food and fire shaped humanity see [go.nature.com/txnfil](https://go.nature.com/txnfil)"
