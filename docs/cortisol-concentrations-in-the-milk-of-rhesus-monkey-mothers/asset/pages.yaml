  md: "*Nature Reviews Genetics* | AOP, published online 7 September 2010; doi:10.1038/nrg2873\n\
    \n# FUNCTIONAL GENOMICS\n\n# Vitamin D and disease\n\nA recent study demonstrates\
    \ the power of combining chromatin immunoprecipitation followed by sequencing\
    \ (ChIP–seq) with genome-wide association (GWA) study data sets to explore the\
    \ molecular basis of complex disease. Ramagopalan and colleagues used ChIP–seq\
    \ to produce high-resolution maps of the genomic binding of the vitamin D receptor\
    \ (VDR) — a ligand-activated transcription factor in human lymphoblastoid cell\
    \ lines, with and without a vitamin D ligand. In the presence of ligand, they\
    \ identified 2,776 binding sites, many of which are in regions associated with\
    \ active chromatin, consistent with the expected role of VDR at gene regulatory\
    \ elements. Vitamin D has been linked to several diseases, particularly autoimmune\
    \ diseases, but the basis for the link is unclear. The authors compared their\
    \ ChIP–seq data with GWA study data sets for 47 common traits and found significant\
    \ enrichment of VDR sites in associated\n\ngenomic intervals for multiple sclerosis\
    \ and type 1 diabetes, along with other autoimmune diseases, cancers and traits\
    \ such as height. The results implicated VDR in the control of many genes that\
    \ were not previously thought to be regulated by this transcription factor. In\
    \ most cases, the disease-associated SNPs do not disrupt VDR-binding motifs, so\
    \ further resequencing might be informative for pinpointing which genetic variants\
    \ alter gene regulation. Interestingly, VDR binding is also enriched in regions\
    \ with signatures of positive selection, so future studies might be aimed at investigating\
    \ the role of vitamin D during human evolution.\n\n*Mary Muers*\n\n**ORIGINAL\
    \ RESEARCH PAPER**  \nRamagopalan, S. V. et al. A ChIP-seq-defined genome-wide\
    \ map of vitamin D receptor binding: associations with disease and evolution.\
    \ *Genome Research* 24 Aug 2010 (doi:10.1101/gr.107920.110).  \n\n**FURTHER READING**\
    \  \nRen, B. et al. Next-generation genomics: an integrative approach. *Nature\
