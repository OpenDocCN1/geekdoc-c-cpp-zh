  md: 'He was referring to Jens Bergensten, one of the lead programmers at Mojang.


    The lad asked Jens for his autograph and peppered him with questions. He had eyes
    for no one else.


    And I’m, like, sitting right there. …


    Anyway, the point is that programmers have become role models and idols for our
    children. They dream of growing up to be like Jeb or Dinnerbone or Notch.


    Programmers, real-life programmers, are heroes.


    But where there are real heroes, there are also real villains.


    In October of 2015, Michael Horn, the CEO of Volkswagen North America, testified
    before the US Congress regarding the software in their cars that was cheating
    the Environmental Protection Agency’s testing devices. When asked why the company
    did this, he blamed programmers. He said, “This was a couple of software engineers
    who put this in for whatever reasons.”


    Of course, he was lying about the “whatever reasons.” He knew what the reasons
    were, and so did the Volkswagen company at large. His feeble attempt to shift
    blame onto the programmers was pretty transparent.


    On the other hand, he was exactly right. It *was* some programmers who wrote that
    lying, cheating code.


    And those programmers—whoever they were—gave us all a bad name. If we had a true
    professional organization, their recognition as programmers would, and should,
    be revoked. They betrayed us all. They besmirched the honor of our profession.


    And so, we’ve graduated. It’s taken 75 years. But we’ve gone from nothing to nerds
    to role models and villains in that time.


    Society has begun—just begun—to understand who we are and the threats and promises
    that we represent.


