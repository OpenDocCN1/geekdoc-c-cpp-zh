  md: "Click here to view code image\n\n```\n```\nif (employeeShouldHaveFullBenefits())\n\
    \  AddFullBenefitsToEmployee();\n```\n```\n\nIt will make your code read like\
    \ *well-written prose*.\n\nUsing the **Extract Method** refactoring is also how\
    \ you will get your functions to follow *the stepdown rule.*⁷ We want each line\
    \ of a function to be at the same level of abstraction, and that level should\
    \ be one level below the *name* of the function. To achieve this, we extract all\
    \ code snippets within a function that are below the desired level.\n\n7. Martin,\
    \ p. 37.\n\n# ## Extract Variable\n\nIf **Extract Method** is the most important\
    \ of refactorings, **Extract Variable** is its ready assistant. It turns out that\
    \ in order to extract methods, you often must extract variables first.\n\nFor\
    \ example, consider this refactoring from the bowling game in Chapter 2, “Test-Driven\
    \ Development.” We started with this:\n\nClick here to view code image\n\n```\n\
    ```\n@Test\npublic void allOnes() throws Exception {\n  for (int i=0; i<20; i++)\n\
    \    g.roll(1);\n  assertEquals(20, g.score());\n}\n```\n```\n\nAnd we ended up\
    \ with this:\n\nClick here to view code image\n\n```\n```\nprivate void rollMany(int\
    \ n, int pins) {\n  for (int i = 0; i < n; i++) {\n    g.roll(pins);\n  }\n}\n\
    ```\n```"
