    Why did Dijkstra consider the `GOTO` statement to be harmful? It all comes back
    to the three strategies for proving a function correct: enumeration, induction,
    and abstraction.


    Enumeration depends on the fact that each statement in sequence can be analyzed
    independently and that the result of one statement feeds into the next. It should
    be clear to you that in order for enumeration to be an effective technique for
    proving the correctness of a function, every statement that is enumerated must
    have a single entry point and a single exit point. Otherwise, we could not be
    sure of either the inputs or the outputs of a statement.


    What’s more, induction is simply a special form of enumeration, where we assume
    the enumerated statement is true for some *x* and then prove by enumeration that
    it is true for *x* + 1.


    Thus, the body of a loop must be enumerable. It must have a single entry and a
    single exit.


