  md: "themselves stuck and also find it difficult to back out.\n\nThe problem is\
    \ the good-old word-wrap problem: Given a string of text without any line breaks,\
    \ insert appropriate line breaks so that the text will fit in a column n characters\
    \ wide. Break at words if at all possible.\n\nStudents are supposed to write the\
    \ following function:\n\nClick here to view code image\n\n```\n~~~\nWrapper.wrap(String\
