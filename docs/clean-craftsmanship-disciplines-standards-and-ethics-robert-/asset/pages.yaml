- pgno: 50
  md: 'Extending that analogy to programming, if TDD is the quantum mechanics of programming,
    then refactoring is the chemistry and simple design is the microbiology. Continuing
    that analogy, SOLID principles, object-oriented design, and functional programming
    are the physiology, and architecture is the ecology of programming.


    Simple design is almost impossible without refactoring. Indeed, it is the end
    goal of refactoring, and refactoring is the only practical means to achieve that
    goal. That goal is the production of simple atomic granules of design that fit
    well into the larger structures of programs, systems, and applications.


    Simple design is not a complex discipline. It is driven by four very simple rules.
    However, unlike TDD and refactoring, simple design is an imprecise discipline.
    It relies on judgment and experience. Done well, it is the first indication that
    separates an apprentice who knows the rules from a journeyman who understands
    the principles. It is the beginning of what Michael Feathers has called *design
    sense*.


    # Collaborative Programming


    Collaborative programming is the discipline and the art of working together in
    a software team. It includes subdisciplines such as pair programming, mob programming,
    code reviews, and brainstorms. Collaborative programming involves everyone on
    the team, programmers and nonprogrammers alike. It is the primary means by which
    we share knowledge, assure consistency, and gel the team into a functioning whole.


    Of all the disciplines, collaborative programming is the least technical and the
    least prescriptive. Nevertheless, it may be the most important of the five disciplines,
    because the building of an effective team is both a rare and precious thing.


