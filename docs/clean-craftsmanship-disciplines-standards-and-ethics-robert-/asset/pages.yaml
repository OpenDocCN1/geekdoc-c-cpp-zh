- pgno: 245
  md: 'swathes of the code use. If you were to change that data structure, those swaths
    would stop working and many tests would break.


    Instead, you should create a new data structure that mirrors the content of the
    old data structure. Then, gradually, move each portion of the code from the old
    data structure to the new data structure while keeping the tests passing.


    While this is going on, you may also be adding new features and fixing bugs according
    to your regular schedule of work. There is no need to ask for special time to
    perform this restructuring. You can keep on doing other work while you opportunistically
    manipulate the code until the old data structure is no longer used and can be
    deleted.


    This may take weeks or even months, depending on how significant the restructuring
    is. Even so, at no time would the system be down for deployment. Even while the
    restructuring is only partially complete, the tests still pass and the system
    can be deployed into production.


    # Leave Yourself an Out


    When flying into an area where the weather might not be so good, pilots are taught
    to always make sure they leave an avenue of escape. Refactoring can be a bit like
    that. Sometimes you start a series of refactorings that, after an hour or two,
    leads you to a dead end. The idea you started with just didn’t pan out for some
    reason.


    In situations like this, `git reset --hard` can be your friend.


    So, when beginning such a sequence of refactorings, make sure to tag your source
    repository so you can back out if you need to.


    # Conclusion


    I kept this chapter intentionally brief because there were only a few ideas that
    I wanted to add to Martin Fowler’s *Refactoring*. Again, I urge you to refer to
    that book for an in-depth understanding.'
