    # ## What Is Good Structure?


    Good structure makes the system easy to test, easy to change, and easy to reuse.
    Changes to one part of the code do not break other parts of the code. Changes
    to one module do not force massive recompiles and redeployments. High-level policies
    are kept separate and independent from low-level details.


    Poor structure makes a system rigid, fragile, and immobile. These are the traditional
    *design smells*.


    Rigidity is when relatively minor changes to the system cause large portions of
    the system to be recompiled, rebuilt, and redeployed. A system is rigid when the
    effort to integrate a change is much greater than the change itself.


    Fragility is when minor changes to the behavior of a system force many corresponding
    changes in a large number of modules. This creates a high risk that a small change
    in behavior will break some other behavior in the system. When this happens, your
    managers and customers will come to believe that you have lost control over the
    software and don’t know what you are doing.


    Immobility is when a module in an existing system contains a behavior you want
    to use in a new system but is so tangled up within the existing system that you
    can’t extract it for use in the new system.


    These problems are all problems of structure, not behavior. The system may pass
    all its tests and meet all its functional requirements, yet such a system may
    be close to worthless because it is too difficult to manipulate.


    There’s a certain irony in the fact that so many systems that correctly implement
    valuable behaviors end up with a structure that is so poor that it negates that
    value and makes the system worthless.


