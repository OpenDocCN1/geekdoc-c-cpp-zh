  md: '# 8 Acceptance Tests


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_268_0.png)


    Of all the disciplines of clean craftsmanship, acceptance testing is the one that
    programmers have the least control over. Fulfilling this discipline requires the
    participation of the business. Unfortunately, many businesses have, so far, proven
    unwilling to properly engage.


    How do you know when a system is ready to deploy? Organizations around the world
    frequently make this decision by engaging a QA department or group to “bless”
    the deployment. Typically, this means that the QA folks'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'run a rather large bevy of manual tests that walk through the various behaviors
    of the system until they are convinced that the system behaves as specified. When
    those tests “pass,” the system may be deployed.


    This means that the true requirements of the system *are those tests*. It does
    not matter what the requirements document says; it is only the tests that matter.
    If QA signs off after running their tests, the system is deployed. Therefore,
    it is those tests that are the requirements.


    The discipline of acceptance testing recognizes this simple fact and recommends
    that all requirements be specified *as tests*. Those tests should be written by
    the business analysis (BA) and QA teams, on a feature-by-feature basis, shortly
    before each feature is implemented. QA is not responsible for running those tests.
    Rather, that task is left to the programmers; therefore, the programmers will
    very likely automate those tests.


    No programmer in their right mind wants to manually test the system over and over
    again. Programmers automate things. Thus, if the programmers are responsible for
    running the tests, the programmers *will* automate those tests.


    However, because BA and QA author the tests, the programmers must be able to prove
    to BA and QA that the automation actually performs the tests that were authored.
    Therefore, the language in which the tests are automated must be a language that
    BA and QA understand. Indeed, BA and QA ought to be able to *write* the tests
    in that automation language.


    Several tools have been invented over the years to help with this problem: FitNesse,<sup>1</sup>
    JBehave, SpecFlow, Cucumber, and others. But tools are not really the issue. The
    specification of software behavior is always a simple function of specifying input
    data, the action to perform, and the expected output data. This is the well-known
    AAA pattern: Arrange/Act/Assert.<sup>2</sup>


    +   1. fitnesse.org

    +   2. This pattern is credited to Bill Wake, who identified it in 2001 (https://xp123.com/articles/3a-arrange-act-assert).


    All tests begin by arranging the input data for the test; then the test causes
    the tested action to be performed. Finally, the test asserts that the output data
    from that action matches the expectation.'
  merge: -1
  img_proc: true
