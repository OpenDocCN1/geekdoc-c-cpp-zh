  md: "A dummy is an implementation that does *nothing*. Every method of the interface\
    \ is implemented to do *nothing*. If a method returns a value, then the value\
    \ returned by the dummy will be as close as possible to `null` or zero.\n\nIn\
    \ our example, the `AuthenticatorDummy` would look like this:\n\nClick here to\
    \ view code image\n\n```\n    public class AuthenticatorDummy implements Authenticator\
    \ {\n        public Boolean authenticate(String username, String password) {\n\
    \            return null;\n        }\n    }\n```\n\nIn fact, this is the precise\
    \ implementation that my IDE creates when I invoke the *Implement Interface* command.\n\
    \nNow the test can be written without all that cruft and all those nasty dependencies:\n\
    \nClick here to view code image\n\n```\n    @Test\n    public void whenClosed_loginIsCancelled()\
    \ throws Exception {\n        Authenticator authenticator = new AuthenticatorDummy();\n\
    \        LoginDialog dialog = new LoginDialog(authenticator);\n        dialog.show();\n\
    \        boolean success = dialog.sendEvent(Event.CLOSE);\n        assertTrue(success);\n\
    \    }\n```\n\nSo, a dummy is a test double that implements an interface to do\
    \ nothing. It is used when the function being tested takes an object as an argument,\
    \ but the *logic* of the test does not require that object to be present.\n\n\
    I don’t use dummies very often for two reasons. First, I don’t like having functions\
    \ with code pathways that don’t use the arguments of that function. Second, I\
    \ don’t like objects that have chains of dependencies such as `LoginDialog->Authenticator->DatabaseConnection->UID`.\
    \ Chains like that always cause trouble down the road.\n\nStill, there are times\
    \ when these problems cannot be avoided, and in those situations, I much prefer\
    \ to use a dummy rather than fight with complicated objects from the application."
