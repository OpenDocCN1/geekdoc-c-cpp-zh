    # # The TDD Uncertainty Principle


    Welcome to the first half of the TDD uncertainty principle. No matter how many
    values we try, we’re going to be left with this nagging uncertainty that we missed
    something—that some input value will not produce the right output value.


    Most functions don’t leave you hanging like this. Most functions have the nice
    quality that when you’ve written the last test, you *know* they work. But then
    there are these annoying functions that leave you wondering whether there is some
    value that will fail.


    The only way to solve that problem with the kinds of tests we’ve written is to
    try every single possible value. And since `double` numbers have 64 bits, that
    means we’d need to write just under 2 × 10^19 tests. That’s more than I’d like
    to write.


    So, what *do* we trust about this function? Do we trust that the Taylor series
    calculates the sine of a given angle in radians? Yes, we saw the mathematical
    proof for that, so we’re quite certain that the Taylor series will converge on
    the right value.


    How can we turn the trust in the Taylor series into a set of tests that will prove
    we are executing that Taylor series correctly?


    I suppose we could inspect each of the terms of the Taylor expansion. For example,
    when calculating sin(π), the terms of the Taylor series are 3.141592653589793,
    −2.0261201264601763, 0.5240439134171688, −0.075220615903062306, 0.006925270707505149,
    −4.4516023820919976E-4, 2.114256755841263E-5, −7.727858894175775E-7, 2.2419510729973346E-8.


    I don’t see why that kind of test is any better than the tests we already have.
    Those values apply to only one particular test, and they tell us nothing about
    whether those terms would be correct for any other value.'
