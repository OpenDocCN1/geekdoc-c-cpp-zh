- pgno: 165
  md: 'But wait. Did you know that there is a better algorithm for calculating sines?
    It’s called CORDIC. No, I’m not going to describe it to you here. It’s way beyond
    the scope of this chapter. But let’s just say that we wanted to change our function
    to use that CORDIC algorithm.


    Our spy tests would break!


    In fact, just look back at how much code we invested in that Taylor series algorithm.
    We’ve got two whole classes, the `SineTaylorCalculator` and the `SineTaylorCalculatorSpy`,
    dedicated to our old algorithm. All that code would have to go away, and a whole
    new testing strategy would have to be employed.


    The spy tests are *fragile*. Any change to the algorithm breaks virtually all
    those tests, forcing us to fix or even rewrite them.


    On the other hand, if we’d stayed with our original value tests, then they would
    continue to pass with the new CORDIC algorithm. No rewriting of tests would be
    necessary.


    Welcome to the second half of the TDD uncertainty principle. If you demand certainty
    from your tests, you will inevitably couple your tests to the implementation,
    and that will make the tests fragile.


    > > *The TDD uncertainty principle: To the extent you demand certainty, your tests
    will be inflexible. To the extent you demand flexible tests, you will have diminished
    certainty.*


    # ## London versus Chicago


    The TDD uncertainty principle might make it seem that testing is a lost cause,
    but that’s not the case at all. The principle just puts some constraints on how
    beneficial our tests can be.


    On the one hand, we don’t want rigid, fragile tests. On the other hand, we want
    as much certainty as we can afford. As engineers, we have to strike the right
    trade-off between these two issues.


    # ## The Fragile Test Problem'
