  md: '# Story 2: pCCU


    Then there was that time, in the early 1980s, when I had to work a miracle.


    You see, we had promised a new product to our customer. It was called CCU-CMU.


    Copper is a precious metal. It’s rare and expensive. The phone company decided
    to harvest the huge network of copper wires that it had installed all over the
    country during the last century. The strategy was to replace those wires with
    a much cheaper high-bandwidth network of coaxial cable and fiber carrying digital
    signals. This was known as *digital switching*.


    The CCU-CMU was a complete re-architecture of our measurement technology that
    fit within the new digital switching architecture of the phone company.


    Now, we had promised the CCU-CMU to the phone company a couple of years before.
    We knew it was going to take us a man-year or so to build the software. But then
    we just never quite got around to building it.


    You know how it goes. The phone company delayed their deployment, so we delayed
    our development. There were always lots of other, more urgent issues to deal with.


    So, one day, my boss calls me into his office and says that they had forgotten
    about one small customer who had already installed an early digital switch. That
    customer was now expecting a CCU/CMU within the next month—as promised.


    Now I had to create a man-year of software in less than a month.


    I told my boss that this was impossible. There was no way that I could get a fully
    functioning CCU/CMU built in one month.


    He looked at me with a sneaky grin and said that there was a way to cheat.


    You see, this was a very small customer. Their installation was literally the
    smallest possible configuration for a digital switch. What’s more, the configuration
    of their equipment just happened—just happened—to eliminate virtually all of the
    complexity that the CCU/CMU solved.'
