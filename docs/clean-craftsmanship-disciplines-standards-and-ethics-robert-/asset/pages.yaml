  img_proc: true
- pgno: 254
  md: 'Code coverage tools have been around for decades. I don’t remember when I first
    encountered them. I think it was in the late 1980s or early 1990s. At the time,
    I was working on Sun Microsystems Sparc Stations, and Sun had a tool called `tcov`.


    I don’t remember when I first heard the question, What’s your code coverage? It
    was probably in the very early 2000s. But thereafter the notion that code coverage
    was a number became pretty much universal.


    Since then, it has become relatively commonplace for software teams to run a code
    coverage tool as part of their continuous build process and to publish the code
    coverage number for each build.


    What is a good code coverage number? Eighty percent? Ninety percent? Many teams
    are more than happy to report such numbers. But six decades before the publication
    of this book, Miller and Maloney answered the question very differently: Their
    answer was 100 percent.


    What other number could possibly make sense? If you are happy with 80 percent
    coverage, it means you don’t know if 20 percent of your code works. How could
    you possibly be happy with that? How could your customers be happy with that?


    So, when I use the term *covered* in the first rule of simple design, I mean *covered*.
    I mean 100 percent line coverage and 100 percent branch coverage.


    # An Asymptotic Goal


    You might complain that 100 percent is an unreachable goal. I might even agree
    with you. Achieving 100 percent line and branch coverage is no mean feat. It may,
    in fact, be impractical depending on the situation. But that does not mean that
    your coverage cannot be improved.


    Think of the number 100 percent as an asymptotic goal. You may never reach it,
    but that’s no excuse for not trying to get closer and closer with every check-in.


    I have personally participated in projects that grew to many tens of thousands
    of lines of code while constantly keeping the code coverage in'
