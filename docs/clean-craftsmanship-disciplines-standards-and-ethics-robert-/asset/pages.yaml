  md: "```\n```java\nfactors.add(2);\nn /= 2;\n}\n}\nif (n > 1)\n  factors.add(n);\n\
    return factors;\n}\n```\n```\n\n# Value → Mutated Value\n\nThis transformation\
    \ mutates the value of a variable, usually for the purpose of accumulating partial\
    \ values in a loop or incremental computation. We saw this in several of the katas\
    \ but perhaps most significantly in the sort kata in [Chapter 3](#).\n\nNote that\
    \ the first two assignments are not mutations. The first and second values are\
    \ simply initialized. It is the `list.set(...)` operations that are the mutations.\
    \ They actually change the elements within the list.\n\n[Click here to view code\
    \ image](#)\n\n```\n```java\nprivate List<Integer> sort(List<Integer> list) {\n\
    \    if (list.size() > 1) {\n        if (list.get(0) > list.get(1)) {\n      \
    \      int first = list.get(0);\n            int second = list.get(1);\n     \
    \       list.set(0, second);\n            list.set(1, first);\n        }\n   \
    \ }\n    return list;\n}\n```\n```\n\n# Example: Fibonacci\n\nLet’s try a simple\
    \ kata and keep track of the transformations. We’ll do the tried and true Fibonacci\
    \ kata. Remember that `fib(0) = 1`, `fib(1) = 1`, and `fib(n) = fib(n-1) + fib(n-2)`."
