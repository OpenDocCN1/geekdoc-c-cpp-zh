    The name of the test tells us a lot. This test makes sure that the `LoginDialog`
    correctly invokes the `Authenticator`. It does this by making sure that the `authenticate`
    method is called only once and that the arguments were the arguments that were
    passed into `submit`.


    A spy can be as simple as a single Boolean that is set when a particular method
    is called. Or a spy can be a relatively complex object that maintains a history
    of every call and every argument passed to every call.


    Spies are useful as a way to ensure that the algorithm being tested behaves correctly.
    Spies are dangerous because they couple the tests to the *implementation* of the
    function being tested. We’ll have more to say about this later.


    # Mock


    Now, at last, we come to the true mock object ([Figure 3.6](#)). This is the mock
    that Mackinnon, Freeman, and Craig described in their endo-testing paper.'
