- pgno: 62
  md: 'When you follow the three laws, something very different happens. First of
    all, it’s fun. One more time, I don’t want to oversell this. TDD is not as much
    fun as winning the jackpot in Vegas. It’s not as much fun as going to a party
    or even playing Chutes and Ladders with your four-year-old. Indeed, *fun* might
    not be the perfect word to use.


    Do you remember when you got your very first program to work? Remember that feeling?
    Perhaps it was in a local department store that had a TRS-80 or a Commodore 64.
    Perhaps you wrote a silly little infinite loop that printed your name on the screen
    forever and ever. Perhaps you walked away from that screen with a little smile
    on your face, knowing that you were the master of the universe and that all computers
    would bow down to you forever.


    A tiny echo of that feeling is what you get every time you go around the TDD loop.
    Every test that fails just the way you expected it to fail makes you nod and smile
    just a little bit. Every time you write the code that makes that failing test
    pass, you remember that once you were master of the universe and that you still
    have *the power*.


    Every time around the TDD loop, there’s a tiny little shot of endorphins released
    into your reptile brain, making you feel just a little more competent and confident
    and ready to meet the next challenge. And though that feeling is small, it is
    nonetheless kinda fun.


    # Design


    But never mind the fun. Something much more important happens when you write the
    tests first. It turns out that you cannot write code that’s hard to test if you
    write the tests first. The act of writing the test first forces you to design
    the code to be easy to test. There’s no escape from this. If you follow the three
    laws, your code will be easy to test.


    What makes code hard to test? Coupling and dependencies. Code that is easy to
    test does not have those couplings and dependencies. Code that is easy to test
    is decoupled!


    Following the three laws forces you to write decoupled code. Again, there is no
    escape from this. If you write the tests first, the code that passes those tests
    will be decoupled in ways that you’d never have imagined.'
