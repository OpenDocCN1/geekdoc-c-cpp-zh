    \ of trichotomy?\n\nThe law of trichotomy says that given two numbers A and B,\
    \ there are only three possible relationships between them: A < B, A = B, or A\
    \ > B. Okay, so let’s arbitrarily pick one of the elements of the list and then\
    \ decide which of those relationships it has with the others.\n\nThe relevant\
    \ code looks like this:\n\nClick here to view code image\n\n```\n    else {\n\
