- pgno: 373
  md: '***Programmer:*** Wait. You asked me for the most honest estimate.


    ***Me:*** Right.


    ***Programmer:*** And I said I don’t know.


    ***Me:*** Right.


    ***Programmer:*** So, what it is?


    ***Me:*** I don’t know.


    ***Programmer:*** Well, then, how do you expect me to know?


    ***Me:*** You already said it?


    ***Programmer:*** Said what?


    ***Me:*** I don’t know.


    The most honest estimate you can give is “I don’t know.” But that estimate is
    not particularly accurate or precise. After all, you do know *something* about
    the estimate. The challenge is to quantify what you do and don’t know.


    First, your estimate must be accurate. That doesn’t mean you give a firm date—you
    don’t dare be that precise. It just means that you name a range of dates that
    you feel confident in.


    So, for example, sometime between now and ten years from now is a pretty accurate
    estimate for how long it would take you to write a hello world program. But it
    lacks precision.


    On the other hand, yesterday at 2:15 a.m. is a very precise estimate, but it’s
    probably not very accurate if you haven’t started yet.


    Do you see the difference? When you give an estimate, you want it to be honest
    both in accuracy and in precision. To be accurate, you name a range of dates within
    which you are confident. To be precise, you narrow that range up to the level
    of your confidence.


    And for both of these operations, brutal honesty is the only option.


    To be honest about these things, you have to have some idea of how wrong you can
    be. So let me tell you two stories about how wrong I once was.'
