    \ = list.get(2);\n      List<Integer> lessers = new ArrayList<>();\n      List<Integer>\
    \ greaters = new ArrayList<>();\n\n      if (first < middle)\n        lessers.add(first);\n\
    \      if (last < middle)\n        lessers.add(last);\n      if (first > middle)\n\
    \        greaters.add(first);\n      if (last > middle)\n        greaters.add(last);\n\
    \n      List<Integer> result = new ArrayList<>();\n      result.addAll(lessers);\n\
    \      result.add(middle);\n      result.addAll(greaters);\n      return result;\n\
    \    }\n```\n\nNow, don’t freak out. Let’s walk through this together.\n\nFirst,\
    \ we extract the three values into the three named variables: `first`, `middle`,\
    \ and `last`. We do this for convenience because we don’t want a bunch of `list.get(x)`\
    \ calls littering up the code.\n\nNext, we create a new list for the elements\
    \ that are less than the `middle` and another for the elements that are greater\
    \ than the `middle`. Note that we are"
