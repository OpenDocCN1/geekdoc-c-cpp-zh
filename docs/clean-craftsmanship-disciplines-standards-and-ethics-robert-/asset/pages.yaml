- pgno: 209
  md: 'Of course, the coupling can never be completely broken. There will be changes
    in one that force changes in the other. The goal is not to eliminate such changes
    but to minimize them. And the techniques described are effective toward that end.


    # # Transformation Priority Premise


    The previous chapters have led up to a fascinating observation. When we practice
    the discipline of TDD, we incrementally make the tests more specific, while we
    manipulate the production code to be ever more general. But how do these changes
    take place?


    Adding a constraint to a test is a simple matter of either adding a new assertion
    to an existing test or adding a whole new test method to arrange, act, and then
    assert the new constraint. This operation is entirely additive. No existing test
    code is changed. New code is added.


    Making the new constraint pass the tests, however, is very often not an additive
    process. Instead, the existing production code must be transformed to behave differently.
    These transformations are small changes to the existing code that alter the behavior
    of that code.


    Then, of course, the production code is refactored in order to clean it up. These
    refactorings are also small changes to the production code, but in this case,
    they preserve the behavior.


    Already you should see the correlation to the Red/Green/Refactor loop. The Red
    step is additive. The Green step is transformative. The Blue step is restorative.


    We discuss restorative refactorings in Chapter 5, “Refactoring.” Here, we discuss
    the transformations.


    Transformations are small changes to the code that change behavior and simultaneously
    generalize the solution. The best way to explain this is with an example.


    Recall the prime factors kata from Chapter 2. Early on, we saw a failing test
    and a degenerate implementation.


    Click here to view code image'
