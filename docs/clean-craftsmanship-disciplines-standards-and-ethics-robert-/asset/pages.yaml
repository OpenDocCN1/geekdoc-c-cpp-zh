    two thousand years ago. Slide rules were invented about four hundred years ago.


    In the early nineteenth century, Charles Babbage started building crank-powered
    calculating machines. These were true digital computers with memory and arithmetic
    processing. But they were difficult to build with the metalworking technology
    of the day, and though he built a few prototypes, they were not a commercial success.


    In the mid-1800s, Babbage attempted to build a much more powerful machine. It
    would have been steam powered and capable of executing true programs. He dubbed
    it the *Analytical Engine*.


    Lord Byron’s daughter, Ada—the Countess of Lovelace—translated the notes of a
    lecture given by Babbage and discerned a fact that had apparently not occurred
    to anyone else at the time: *the numbers in a computer need not represent numbers
    at all but can represent things in the real world*. For that insight, she is often
    called the world’s first true programmer.


    Problems of precise metalworking continued to frustrate Babbage, and in the end,
    his project failed. No further progress was made on digital computers throughout
    the rest of the nineteenth and early twentieth centuries. During that time, however,
    mechanical *analog* computers reached their heyday.


