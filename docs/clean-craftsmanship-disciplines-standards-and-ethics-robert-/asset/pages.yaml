- pgno: 63
  md: 'And that’s a very good thing.


    # ### The Pretty Little Bow on Top


    It turns out that applying the three laws of TDD has the following set of benefits:


    +   * You will spend more time writing code that works and less time debugging
    code that doesn’t.

    +   * You will produce a set of nearly perfect low-level documentation.

    +   * It is fun—or at least motivating.

    +   * You will produce a test suite that will give you the confidence to deploy.

    +   * You will create less-coupled designs.


    These reasons might convince you that TDD is a good thing. They might be enough
    to get you to ignore your initial reaction, even repulsion. Maybe.


    But there is a far more overriding reason why the discipline of TDD is important.


    # ### Fear


    Programming is hard. It may be the most difficult thing that humans have attempted
    to master. Our civilization now depends upon hundreds of thousands of interconnected
    software applications, each of which involves hundreds of thousands if not tens
    of millions of lines of code. There is no other apparatus constructed by humans
    that has so many moving parts.


    Each of those applications is supported by teams of developers who are scared
    to death of change. This is ironic because the whole reason software exists is
    to allow us to easily change the behavior of our machines.


    But software developers know that every change introduces the risk of breakage
    and that breakage can be devilishly hard to detect and repair.


    Imagine that you are looking at your screen and you see some nasty tangled code
    there. You probably don’t have to work very hard to conjure that image because,
    for most of us, this is an everyday experience.'
