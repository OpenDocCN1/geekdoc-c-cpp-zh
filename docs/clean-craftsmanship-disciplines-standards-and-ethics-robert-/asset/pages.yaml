  md: "We begin, as always, with a failing test. If you are wondering why I’m using\
    \ BigInteger, it is because Fibonacci numbers get big very quickly.\n\nClick here\
    \ to view code image\n\n```\n~~~java\npublic class FibTest {\n  @Test\n  public\
    \ void testFibs() throws Exception {\n    assertThat(fib(0), equalTo(BigInteger.ONE));\n\
    \  }\n\n  private BigInteger fib(int n) {\n    return null;\n  }\n}\n~~~\n```\n\
    \nWe can make this pass by using the Nil → Constant transformation.\n\nClick here\
    \ to view code image\n\n```\n~~~java\nprivate BigInteger fib(int n) {\n  return\
    \ new BigInteger(\"1\");\n}\n~~~\n```\n\nYes, I thought the use of the String\
    \ argument was odd too; but that’s the Java library for you.\n\nThe next test\
    \ passes right out of the box:\n\nClick here to view code image\n\n```\n~~~java\n\
    @Test\npublic void testFibs() throws Exception {\n  assertThat(fib(0), equalTo(BigInteger.ONE));\n\
    \  assertThat(fib(1), equalTo(BigInteger.ONE));\n}\n~~~\n```\n\nThe next test\
    \ fails:\n\nClick here to view code image\n\n```\n~~~java\n@Test\npublic void\
    \ testFibs() throws Exception {\n  assertThat(fib(0), equalTo(BigInteger.ONE));\n\
    \  assertThat(fib(1), equalTo(BigInteger.ONE));\n~~~\n```"
