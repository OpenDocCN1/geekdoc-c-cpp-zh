- pgno: 171
  md: 'Note that the arrows all point from lower-level components to higher-level
    components. This is the *Dependency Rule* that is discussed in *Clean Architecture*.
    The highest-level component contains the business objects. The next level down
    contains the interactors and the communications interfaces. At the lowest level
    is the GUI and the database.


    We might use some stubs when testing the business objects, but we won’t need any
    spies or mocks because the business objects don’t know about any other components.


    The interactors, on the other hand, manipulate the business objects, the database,
    and the GUI. Our tests will likely use spies to make sure that the database and
    GUI are being manipulated properly. However, we will probably not use as many
    spies, or even stubs, between the interactors and the business objects because
    the functions of the business objects are probably not expensive.


    When testing the controller, we will almost certainly use a spy to represent the
    interactor because we don’t want the calls to propagate to the database or presenter.


    The presenter is interesting. We think of it as part of the GUI component, but
    in fact we’re going to need a spy to test it. We don’t want to test it with the
    real view, so we probably need a fifth component to hold the view apart from the
    controller and presenter.


    That last little complication is common. We often modify our component boundaries
    because the tests demand it.


    # ## Conclusion


    In this chapter, we looked at some of the more advanced aspects of TDD: from the
    incremental development of algorithms, to the problem of getting stuck, from the
    finite state machine nature of tests to test doubles and the TDD uncertainty principle.
    But we’re not done. There’s more. So, get a nice hot cup of tea and turn the improbability
    generator up to infinity.'
