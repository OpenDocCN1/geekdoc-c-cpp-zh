  md: 'But society doesn’t understand everything yet. Indeed, neither do we. You see,
    you and I, we are programmers, and we rule the world.


    That may seem like an exaggerated statement, but consider. There are more computers
    in the world, right now, than there are people. And these computers, which outnumber
    us, perform myriads of essential tasks for us. They keep track of our reminders.
    They manage our calendars. They deliver our Facebook messages and keep our photo
    albums. They connect our phone calls and deliver our text messages. They control
    the engines in our cars, as well as the brakes, accelerator, and sometimes even
    the steering wheels.


    We can’t cook without them. We can’t wash clothes without them. They keep our
    houses warm in winter. They entertain us when we’re bored. They keep track of
    our bank records and our credit cards. They help us pay our bills.


    In fact, most people in the modern world interact with some software system every
    waking minute of every day. Some even continue interacting while they sleep.


    The point is that *nothing* happens in our society without software. No product
    gets bought or sold. No law gets enacted or enforced. No car drives. No Amazon
    products get delivered. No phone connects. No power comes out of outlets. No food
    gets delivered to stores. No water comes out of faucets. No gas gets piped to
    furnaces. None of these things happens without software monitoring and coordinating
    it all.


    And *we* write that software. And that makes us the rulers of the world.


    Oh, other people think they make the rules—but then they hand those rules to us,
    and *we* write the rules that execute in the machines that monitor and coordinate
    every aspect of our lives.


    Society does not quite understand this yet. Not quite. Not yet. But the day is
    coming soon when our society will understand it all too well.


    We, programmers, don’t quite understand this yet either. Not really. But, again,
    the day is coming when it will be savagely driven home to us.'
