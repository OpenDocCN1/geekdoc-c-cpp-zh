- pgno: 366
  md: 'There''s an altered state of mind that many programmers enjoy. It''s that hyperfocused,
    tunnel-vision state in which the code seems to pour out of every orifice of your
    body. It can make you feel superhuman.


    Despite the euphoric sensation, I''ve found, over the years, that the code I produce
    in that altered state tends to be pretty bad. The code is not nearly as well considered
    as code I write in a normal state of attention and focus. So, nowadays, I resist
    getting into the flow. Pairing is a very good way to stay out of the flow. The
    very fact that you must communicate and collaborate with someone else seems to
    interfere with the flow.


    Avoiding music also helps me stay out of the flow because it allows the actual
    environment to keep me grounded in the real world.


    If I find that I''m starting to hyperfocus, I break away and do something else
    for a while.


    # ## Time Management


    One of the most important ways to manage distraction is to employ a time management
    discipline. The one I like best is *the Pomodoro Technique*.^2


    2. Francesco Cirillo, *The Pomodoro Technique: The Life-Changing Time-Management
    System* (Virgin Books, 2018).


    *Pomodoro* is Italian for "tomato." English teams tend to use the word *tomato*
    instead. But you''ll have better luck with Google if you search for the Pomodoro
    Technique.


    The aim of the technique is to help you manage your time and focus during a regular
    workday. It doesn''t concern itself with anything beyond that.


    At its core, the idea is quite simple. Before you begin to work, you set a timer
    (traditionally a kitchen timer in the shape of a tomato) for 25 minutes.


    Next, you work. And you work until the timer rings.


    Then you break for 5 minutes, clearing your mind and body.


    Then you start again. Set the timer for 25 minutes, work until the timer rings,
    and then break for 5 minutes. You do this over and over.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'There’s nothing magical about 25 minutes. I’d say anything between 15 and 45
    minutes is reasonable. But once you choose a time, stick with that time. Don’t
    change the size of your tomatoes!


    Of course, if I were 30 seconds away from getting a test to pass when the timer
    rang, I’d finish the test. On the other hand, maintaining the discipline is important.
    I wouldn’t go more than a minute beyond.


    So far, this sounds mundane, but handling interruptions, such as phone calls,
    is where this technique shines. The rule is to *defend the tomato!*


    Tell whoever is trying to interrupt you that you’ll get back to them within 25
    minutes—or whatever the length of your tomato is. Dispatch the interruption as
    quickly as possible, and then return to work.


    Then, after your break, handle the interruption.


    This means that the time between tomatoes will sometimes get pretty long, because
    people who interrupt you often require a lot of time.


    Again, that’s the beauty of this technique. At the end of the day, you count the
    number of tomatoes you completed, and that gives you a measure of your productivity.


    Once you’ve gotten good at breaking your day up into tomatoes like this and defending
    the tomatoes from interruptions, then you can start planning your day by allocating
    tomatoes to it. You may even begin to estimate your tasks in terms of tomatoes
    and plan your meetings and lunches around them.'
