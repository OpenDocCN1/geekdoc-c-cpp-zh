- pgno: 170
  md: 'When writing the lowest-level programmer tests, I will use *spies* (and rarely
    *mocks*) when testing across an architectural boundary. Or, to say that a different
    way, when testing a component, I use *spies* to mock out any collaborating components
    and to ensure that the component I am testing invokes the collaborators correctly.
    So, if my test crosses an architectural boundary, I’m a Londoner.


    However, when a test does not cross such a boundary, I tend to be a Chicagoan.
    Within a component, I depend much more on state and property testing in order
    to keep the coupling, and therefore the fragility, of my tests as low as possible.


    Let’s look at an example. The UML diagram in **Figure 3.8** shows a set of classes
    and the four components that contain them.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_170_0.png)


    **Figure 3.8** A set of classes and the four components that contain them'
