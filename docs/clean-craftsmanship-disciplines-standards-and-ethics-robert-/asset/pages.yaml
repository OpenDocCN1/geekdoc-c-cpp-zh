- pgno: 208
  md: '![](img/7b01f9dd5d5d33f16ee27a44427cd56e_208_0.png)


    Figure 4.11 The suite of tests becomes more specific, while the family of modules
    being tested becomes more general.


    This is one of the goals of the refactoring step. You saw it happening in the
    video store example. First a test case was added. Then some ugly production code
    was added to get the test to pass. That production code was not general. Often,
    in fact, it was deeply specific. Then, in the refactoring step, that specific
    code was massaged into a more general form.


    This divergent evolution of the tests and the production code means that the shapes
    of the two will be remarkably different. The tests will grow into a linear list
    of constraints and specifications. The production code, on the other hand, will
    grow into a rich family of logic and behavior organized to address the underlying
    abstraction that drives the application.


    This divergent style further decouples the tests from the production code, protecting
    the two from changes in the other.'
