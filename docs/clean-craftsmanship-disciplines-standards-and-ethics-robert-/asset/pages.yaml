    | 5 | X | — | — | 60 |

    | 6 | 0 | 1 | — | 61 |

    | 7 | 7 | / | — | 77 |

    | 8 | 6 | / | — | 97 |

    | 9 | X | — | — | 117 |

    | 10 | 2 | / | 6 | 133 |'
