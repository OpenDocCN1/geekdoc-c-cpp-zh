- pgno: 259
  md: "# # The Underlying Abstraction\n\nLest you think that expressivity is solely\
    \ a matter of nice names for functions and variables, I should point out that\
    \ there is another concern: the separation of levels and the exposition of the\
    \ underlying abstraction.\n\nA software system is expressive if each line of code,\
    \ each function, and each module lives in a well-defined partition that clearly\
    \ depicts the level of the code and its place in the overall abstraction.\n\n\
    You may have found that last sentence difficult to parse, so let me be a bit clearer\
    \ by being much more longwinded.\n\nImagine an application that has a complex\
    \ set of requirements. The example I like to use is a payroll system.\n\n+   -\
    \ Hourly employees are paid every Friday on the basis of the timecards they have\
    \ submitted. They are paid time and a half for every hour they work after forty\
    \ hours in a week.\n+   - Commissioned employees are paid on the first and third\
    \ Friday of every month. They are paid a base salary plus a commission on the\
    \ sales receipts they have submitted.\n+   - Salaried employees are paid on the\
    \ last day of the month. They are paid a fixed monthly salary.\n\nIt should not\
    \ be hard for you to imagine a set of functions with a complex `switch` statement\
    \ or `if/else` chain that captures these requirements. However, such a set of\
    \ functions is likely to obscure the underlying abstraction. What is that underlying\
    \ abstraction?\n\n[Click here to view code image](#)\n\n```\n```java\npublic List<Paycheck>\
    \ run(Database db) {\n    Calendar now = SystemTime.getCurrentDate();\n    List<Paycheck>\
    \ paychecks = new ArrayList<>();\n    for (Employee e : db.getAllEmployees())\
    \ {\n        if (e.isPayDay(now))\n            paychecks.add(e.calculatePay());\n\
    \    }\n    return paychecks;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Notice that there is no mention of any of the hideous details that dominate
    the requirements. The underlying truth of this application is that we need to
    pay all employees on their payday. Separating the high-level policy from the low-level
    detail is the most fundamental part of making a design simple and expressive.


    # # Tests: The Other Half of the Problem


    Look back at Beck''s original first rule:


    +   1. *The system (code and tests) must communicate everything you want to communicate.*


    There is a reason he phrased it that way, and in some ways, it is unfortunate
    that the phrasing was changed.


    No matter how expressive you make the production code, it cannot communicate the
    context in which it is used. That''s the job of the tests.


    Every test you write, especially if those tests are isolated and decoupled, is
    a demonstration of how the production code is intended to be used. Well-written
    tests are example use cases for the parts of the code that they test.


    Thus, *taken together*, the code and the tests are an expression of what each
    element of the system does and how each element of the system should be used.


    What does this have to do with design? Everything, of course. Because the primary
    goal we wish to achieve with our designs is to make it easy for other programmers
    to understand, improve, and upgrade our systems. And there is no better way to
    achieve that goal than to make the system express what it does and how it is intended
    to be used.


    # # Minimize Duplication


    In the early days of software, we had no source code editors at all. We wrote
    our code, using #2 pencils, on preprinted coding forms. The best editing tool
    we had was an eraser. We had no practical means to copy and paste.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Because of that, we did not duplicate code. It was easier for us to create
    a single instance of a code snippet and put it into a subroutine.


    But then came the source code editors, and with those editors came copy/paste
    operations. Suddenly it was much easier to copy a snippet of code and paste it
    into a new location and then fiddle with it until it worked.


    Thus, as the years went by, more and more systems exhibited massive amounts of
    duplication in the code.


    Duplication is usually problematic. Two or more similar stretches of code will
    often need to be modified together. Finding those similar stretches is hard. Properly
    modifying them is even harder because they exist in different contexts. Thus,
    duplication leads to fragility.


    In general, it is best to reduce similar stretches of code into a single instance
    by abstracting the code into a new function and providing it with appropriate
    arguments that communicate any differences in context.


    Sometimes that strategy is not workable. For example, sometimes the duplication
    is in code that traverses a complex data structure. Many different parts of the
    system may wish to traverse that structure and will use the same looping and traversal
    code only to then operate on the data structure in the body of that code.


    As the structure of the data changes over time, programmers will have to find
    all the duplications of the traversal code and properly update them. The more
    the traversal code is duplicated, the higher the risk of fragility.


    The duplications of the traversal code can be eliminated by encapsulating it in
    once place and using lambdas, *Command* objects, the *Strategy* pattern or even
    the *Template Method* pattern¹⁰ to pass the necessary operations into the traversal.


    10. Erich Gamma, Richard Helm, Ralph Johnson, and John M Vlissides, *Design Patterns:
    Elements of Reusable Object-Oriented Software* (Addison-Wesley, 1995).


    # Accidental Duplication


    Not all duplication should be eliminated. There are instances in which two stretches
    of code may be very similar, even identical, but will change for'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'very different reasons.<sup>11</sup> I call this *accidental duplication*.
    Accidental duplicates should not be eliminated. The duplication should be allowed
    to persist. As the requirements change, the duplicates will evolve separately
    and the accidental duplication will dissolve.


    11. See the single responsibility principle. Robert C. Martin, *Agile Software
    Development: Principles, Patterns, and Practices* (Pearson, 2003).


    It should be clear that managing duplication is nontrivial. Identifying which
    duplications are real and which are accidental, and then encapsulating and isolating
    the real duplications, requires a significant amount of thought and care.


    Determining the real duplications from the accidental duplications depends strongly
    on how well the code expresses its intent. Accidental duplications have divergent
    intent. Real duplications have convergent intent.


    Encapsulating and isolating the real duplications, using abstraction, lambdas,
    and design patterns, involves a substantial amount of refactoring. And refactoring
    requires a good solid test suite.


    Therefore, eliminating duplication is third in the priority list of the rules
    of simple design. First come the tests and the expression.


    # Minimize Size


    A simple design is composed of simple elements. Simple elements are small. The
    last rule of simple design states that for each function you write, after you’ve
    gotten all the tests to pass, and after you have made the code as expressive as
    possible, and after you have minimized duplication, *then* you should work to
    decrease the size of the code within each function without violating the other
    three principles.


    How do you do that? Mostly by extracting more functions. As we discussed in [Chapter
    5, “Refactoring,”](#), you extract functions until you cannot extract any more.


    This practice leaves you with nice small functions that have nice long names that
    help to make the functions very small and very expressive.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Simple Design


    Many years back, Kent Beck and I were having a discussion on the principles of
    design. He said something that has always stuck with me. He said that if you followed
    these four things as diligently as possible, all other design principles would
    be satisfied—the principles of design can be reduced to coverage, expression,
    singularization, and reduction.


    I don’t know if this is true or not. I don’t know if a perfectly covered, expressed,
    singularized, and reduced program necessarily conforms to the open-closed principle
    or the single responsibility principle. What I am very sure of, however, is that
    knowing and studying the principles of good design and good architecture (e.g.,
    the SOLID principles) makes it much easier to create well-partitioned and simple
    designs.


    This is not a book about those principles. I have written about them many times
    before, ^1,2 as have others. I encourage you to read those works and study those
    principles as part of maturing in your craft.


    12. See Martin, *Clean Code*; *Clean Architecture*; and *Agile Software Development:
    Principles, Patterns, and Practices*.'
  merge: -1
