    # I expect fearless competence.


    As the internal structure of a system degrades, the complexity of the system can
    rapidly become intractable. This causes the developers to naturally become more
    and more fearful of making changes. Even simple improvements become fraught with
    risk. Reluctance to make changes and improvements can drastically lower the programmers’
    competence to manage and maintain the system.


    This loss of competence is not intrinsic. The programmers have not become less
    competent. Rather, the growing intractable complexity of the system begins to
    exceed the natural competence of the programmers.


    As the system becomes increasingly difficult for the programmers to handle, they
