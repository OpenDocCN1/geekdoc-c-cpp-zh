    continued to use this pessimistic locking strategy, keeping others from touching
    the modules we were changing until we were done.


    But CVS changed things—at least for some of us. Optimistic locking meant that
    one programmer could not lock others out of a module. We still committed only
    when we were done with a project, but others could be working concurrently on
    the same modules. Consequently, the average time between commits on a project
    shrank drastically. The cost of concurrency, of course, was merges.


