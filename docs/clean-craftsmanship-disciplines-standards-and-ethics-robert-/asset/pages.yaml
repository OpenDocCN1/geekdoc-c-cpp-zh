- pgno: 134
  md: '| Current State | Event | Next State |

    |---|---|---|

    | Unlocked | Coin | Refunding |

    | Unlocked | Pass | Locked |

    | Refunding | Refunded | Unlocked |

    | Alarming | Reset | Locked |


    Each row in the table is a transition from the current state to the next state
    triggered by the event. Each row is a triplet, just like GWT or AAA. More important,
    each one of those transition triplets is synonymous with a corresponding GWT or
    AAA triplet, as follows:


    Click here to view code image


    ```

    Given it is in the Locked state

    When it gets a Coin event

    Then it transitions to the Unlocked state.

    ```


    What we can deduce from this is that *every test you write is a transition of
    the finite state machine that describes the behavior of the system.*


    Repeat that to yourself several times. Every test is a transition of the finite
    state machine you are trying to create in your program.


    Did you know that the program you are writing is a finite state machine? Of course
    it is. Every program is a finite state machine. That’s because computers are nothing
    more than finite state machine processors. The computer itself transitions from
    one finite state to the next with every instruction it executes.


    Thus, the tests you write when practicing TDD and the behaviors you describe while
    practicing BDD are simply transitions of the finite state machine that you are
    attempting to create. Your test suite, if it is complete, *is that finite state
    machine.*


    The obvious question, therefore, is how do you ensure that all the transitions
    you desire your state machine to handle are encoded as tests? How do you ensure
    that the state machine that your tests are describing is the complete state machine
    that your program should be implementing?'
