  md: "```\n```\n  }\n}\n```\n```\n\nThis algorithm has a name. It's called *quick\
    \ sort*. It is one of the best sorting algorithms known.\n\nHow much better it\
    \ is? This algorithm, on my laptop, can sort an array of 1 million random integers\
    \ between zero and a million in 1.5 seconds. The bubble sort from the previous\
    \ section will sort the same list in about six months. So … better.\n\nAnd this\
    \ leads us to a disturbing observation. There were two different solutions to\
    \ sorting a list with two elements out of order. One solution led us directly\
    \ to a bubble sort, the other solution led us directly to a quick sort. This means\
    \ that identifying forks in the road, and choosing the right path, can sometimes\
    \ be pretty important. In this case, one path led us to a pretty poor algorithm,\
    \ and the other led us to a very good algorithm.\n\nCan we identify these forks\
    \ and determine which path to choose? Perhaps. But that's a topic for a more advanced\
    \ chapter.\n\n# ## Getting Stuck\n\nAt this point, I think you've seen enough\
    \ videos to get a good idea about the rhythm of TDD. From now on, we'll forego\
    \ the videos and just rely on the text of the chapter.\n\nIt often happens, to\
    \ TDD novices, that they find themselves in a pickle. They write a perfectly good\
    \ test and then discover that the only way to make that test pass is to implement\
    \ the entire algorithm at once. I call this \"getting stuck.\"\n\nThe solution\
    \ to getting stuck is to delete the last test you wrote and find a simpler test\
    \ to pass.\n\n> > Rule 8: If you must implement too much to get the current test\
    \ to pass, delete that test and write a simpler test that you can more easily\
    \ pass.\n\nI often use the following exercise in my classroom sessions to get\
    \ people stuck. It's pretty reliable. Well over half the people who try it find"
  merge: -1
