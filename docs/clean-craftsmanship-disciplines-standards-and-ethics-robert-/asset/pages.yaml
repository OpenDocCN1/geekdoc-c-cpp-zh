    # Software


    The maintenance of proper accounts is utterly essential for running a modern business,
    and the discipline of double-entry bookkeeping is essential for the maintenance
    of proper accounts. But is the proper maintenance of software any less essential
    to the running of a business? By no means! In the twenty-first century, software
    is at the heart of every business.


    What, then, can software developers use as a discipline that gives them the control
    and vision over their software that double-entry bookkeeping gives to accountants
    and managers? Perhaps you think that software and accounting are such different
    concepts that no correspondence is required or even possible. I beg to differ.


    Consider that accounting is something of a mage’s art. Those of us not versed
    in its rituals and arcanities understand but little of the depth of the accounting
    profession. And what is the work product of that profession? It is a set of documents
    that are organized in a complex and, for the layperson, bewildering fashion. Upon
    those documents is strewn a set of symbols that few but the accountants themselves
    can truly understand. And yet if even one of those symbols were to be in error,
    terrible consequences could ensue. Businesses could founder and executives could
    be jailed.


    Now consider how similar accounting is to software development. Software is a
    mage’s art indeed. Those not versed in the rituals and arcanities of software
    development have no true idea of what goes on under the surface. And the product?
    Again, a set of documents: the source code—documents organized in a deeply complex
    and bewildering manner, littered with symbols that only the programmers themselves
    can divine. And if even one of those symbols is in error, terrible consequences
    may ensue.


    The two professions are deeply similar. They both concern themselves with the
    intense and fastidious management of intricate detail. They both require significant
    training and experience to do well. They both are engaged in the'
