- pgno: 381
  md: 'The first thing we want to do is represent each task in terms of its expected
    completion time and the standard deviation.


    Now remember, 6 standard deviations (3 on each side of the mean) corresponds to
    a probability of better than 99 percent. So, we’re going to set our standard deviation,
    our sigma, to Worst minus Best over 6.


    The expected completion time (mu) is a bit trickier. Notice that N is probably
    not equal to (W-B), the midpoint. Indeed, the midpoint is probably well past N
    because it is much more likely for a project to take more time than we think than
    less time. So, on average, when will this task be done? What is the *expected*
    completion time?


    It’s probably best to use a weighted average like this: mu = (2N + (B + W)/2)/3.


    Now we have calculated the mu and sigma for a set of tasks. The expected completion
    time for the whole project is just the sum of all the mus. The sigma for the project
    is the square root of the sum of the squares of all the sigmas.


    This is just basic statistical mathematics.


    What I’ve just described is the estimation procedure invented back in the late
    1950s to manage the Polaris Fleet Ballistic Missile program. It has been used
    successfully on many thousands of projects since.


    It is called PERT—the program evaluation and review technique.


    # # Honesty


    We started with honesty. Then we talked about accuracy, and we talked about precision.
    Now it’s time to come back to honesty.


    The kind of estimating we are talking about here is intrinsically honest. It is
    a way of communicating, to those who need to know, the level of your uncertainty.


    This is honest because you truly are uncertain. And those with the responsibility
    to manage the project must be aware of the risks that they are taking so that
    they can manage those risks.'
  merge: -1
