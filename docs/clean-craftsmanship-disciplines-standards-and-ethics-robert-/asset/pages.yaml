- pgno: 166
  md: 'Newcomers to TDD often experience the problem of fragile tests because they
    are not careful to design their tests well. They treat the tests as second-class
    citizens and break all the coupling and cohesion rules. This leads to the situation
    where small changes to the production code, even just a minor refactoring, cause
    many tests to fail and force sweeping changes in the test code.


    Failed tests that necessitate significant rewriting of test code can result in
    initial disappointment and premature rejection of the discipline. Many young,
    new TDDers have walked away from the discipline simply because they failed to
    realize that tests have to be designed just as well as the production code.


    The more you couple the tests to the production code, the more fragile your tests
    become; and few testing artifacts couple more tightly than spies. Spies look deep
    into the heart of algorithms and inextricably couple the tests to those algorithms.
    And since mocks are spies, this applies to mocks as well.


    This is one of the reasons that I don’t like mocking tools. Mocking tools often
    lead you to write mocks and spies, and that leads to fragile tests.


    # The Certainty Problem


    If you avoid writing spies, as I do, then you are left with value and property
    testing. Value tests are like the sine value tests we did earlier in this chapter.
    They are just the pairing of input values to output values.


    Property tests are like the `testSineInRange` and `PythagoreanIdentity` tests
    we used earlier. They run through many appropriate input values checking for invariants.
    These tests can be convincing, but you are still often left with a nagging doubt.


    On the other hand, these tests are so decoupled from the algorithm being employed
    that changing that algorithm, or even just refactoring that algorithm, cannot
    affect the tests.


    If you are the kind of person who values certainty over flexibility, you’ll likely
    use a lot of *spies* in your tests and you’ll tolerate the inevitable fragility.'
