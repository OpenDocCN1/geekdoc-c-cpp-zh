- pgno: 64
  md: 'Now let’s say that as you glance at that code, for one very brief moment, the
    thought occurs to you that you ought to clean it up a bit. But your very next
    thought slams down like Thor’s hammer: “I’M NOT TOUCHING IT!” Because you know
    that if you touch it, you will break it; and if you break it, it becomes *yours
    forever*.


    This is a fear reaction. You fear the code you maintain. You fear the consequences
    of breaking it.


    The result of this fear is that the code must rot. No one will clean it. No one
    will improve it. When forced to make changes, those changes will be made in the
    manner that is safest for the programmer, not best for the system. The design
    will degrade, and the code will rot, and the productivity of the team will decline,
    and that decline will continue until productivity is near zero.


    Ask yourself if you have ever been significantly slowed down by the bad code in
    your system. Of course you have. And now you know why that bad code exists. It
    exists because nobody has the courage to do the one thing that could improve it.
    No one dares risk cleaning it.


    # ### *Courage*


    But what if you had a suite of tests that you trusted so much that you were confident
    in recommending deployment every time that suite of tests passed? And what if
    that suite of tests executed in seconds? How much would you then fear to engage
    in a gentle cleaning of the system?


    Imagine that code on your screen again. Imagine the stray thought that you might
    clean it up a little. What would stop you? You have the tests. Those tests will
    tell you the instant you break something.


    With that suite of tests, you can safely clean the code. With that suite of tests,
    you can *safely* clean the code. *With that suite of tests, you can safely clean
    the code.*


    No, that wasn’t a typo. I wanted to drive the point home very, very hard. With
    that suite of tests, you can safely clean the code!


    And if you can safely clean the code, you *will* clean the code. And so will everyone
    else on the team. Because nobody likes a mess.'
