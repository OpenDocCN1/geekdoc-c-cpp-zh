- pgno: 187
  md: '# # Breaking the Correspondence


    To break, or avoid creating, the correspondence between tests and production code,
    we need to think of the test modules the way we think of all the other modules
    in a software system: as independent and decoupled from each other.


    At first, this may seem absurd. You might argue that tests must be coupled to
    production code, because the tests *exercise* the production code. The last clause
    is true, but the predicate is false. Exercising code does not imply strong coupling.
    Indeed, good designers consistently strive to break strong couplings between modules
    while allowing those modules to interact with and exercise each other.


    How is this accomplished? By creating interface layers.


    In the diagram in Figure 4.8, we see αTest coupled to α. Behind α we see a family
    of modules that support α but of which αTest is ignorant. The α module is the
    interface to that family. A good programmer is very careful to ensure that none
    of the details of the α family leak out of that interface.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_187_0.png)'
