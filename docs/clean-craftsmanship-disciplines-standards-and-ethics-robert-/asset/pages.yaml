  md: 'The log to the base 2 of 100 million is approximately 27—divide that into 75,
    and you get about 2.8, so perhaps the number of programmers doubled roughly every
    two and a half-ish years.


    3. Visual Basic for Applications.


    Actually, as we saw earlier, the rate was higher in the first decades and has
    slowed down a bit now. My guess is that the doubling rate is about five years.
    Every five years, the number of programmers in the world doubles.


    The implications of that fact are staggering. If the number of programmers in
    the world doubles every five years, it means that half the programmers in the
    world have less than five years’ experience, and this will always be true so long
    as that doubling rate continues. This leaves the programming industry in the precarious
    position of—perpetual inexperience.


    # # Nerds and Saviors


    Perpetual inexperience. Oh, don’t worry, this doesn’t mean that *you* are perpetually
    inexperienced. It just means that once you gain 5 years of experience, the number
    of programmers will have doubled. By the time you gain 10 years of experience,
    the number of programmers will have quadrupled.


    People look at the number of young people in programming and conclude that it’s
    a young person’s profession. They ask, “Where are all the old people?”


    We’re all still here! We haven’t gone anywhere. There just weren’t that many of
    us to begin with.


    The problem is that there aren’t enough of us old guys to teach the new programmers
    coming in. For every programmer with 30 years’ experience, there are 63 programmers
    who need to learn something from her (or him), 32 of whom are brand new.


    Hence the state of perpetual inexperience, with insufficient mentors to correct
    the problem. The same old mistakes get repeated over and over and over again.'
