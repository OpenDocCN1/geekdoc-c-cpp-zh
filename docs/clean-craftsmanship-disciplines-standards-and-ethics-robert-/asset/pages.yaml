    If you look at the three laws of test-driven development (TDD), presented in [Chapter
    2], [“Test-Driven Development,”] you could come to the conclusion that TDD is
    a shallow skill: Follow the three laws, and you are done. This is far from the
    truth. TDD is a deep skill. There are many layers to it; and they take months,
    if not years, to master.


