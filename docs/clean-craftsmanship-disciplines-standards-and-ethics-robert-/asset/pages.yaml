- pgno: 293
  md: 'A team is a group of collaborators who understand their goals and their interaction
    so well that when a team member goes down for some reason, *they keep* making
    progress toward their goal. For example, every crew member on board a ship has
    a job to do. Every crew member also knows how to do someone else’s job—for obvious
    reasons. The ship has to keep sailing even when a crew member goes down.


    I expect that the members of a programming team will cover for each other like
    the crew of a ship. When a team member goes down, I expect others on the team
    to take over that role until the fallen team member resumes their place on the
    team.


    People on a team can go down for many reasons. They may get sick. They may be
    distracted by trouble at home. They may go on vacation. Work on the project cannot
    stop. Others must fill the hole left behind.


    If Bob is the database guy, and Bob goes down, someone else must pick up the database
    work and keep making progress. If Jim is the GUI guy, and Jim goes down, someone
    else must pick up the GUI work and continue to make progress.


    This means that each member of the team must be familiar with more than just their
    own work. They must be familiar with the work of others so that they can step
    in if one of those others goes down.


    But let me turn this around. It is *your* responsibility to make sure someone
    can cover for *you*. It is your responsibility to ensure that *you* are not the
    *one* indispensable player on the team. It is your responsibility to seek out
    others and teach them enough about your work that they can take over for you in
    a pinch.


    How can you teach others about your work? Probably the best way is to sit down
    with them at a workstation and write code together for an hour or so. And if you
    are wise, you will do this with more than one other member of the team. The more
    people who know your work, the more people can cover for you if you go down.


    And remember, once is not enough. As you continue to make progress on your part
    of the project, you’ll have to continually keep the others abreast of your work.'
