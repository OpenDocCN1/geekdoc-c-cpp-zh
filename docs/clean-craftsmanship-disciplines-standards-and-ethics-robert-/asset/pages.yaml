    valuable with the least amount of effort. But if you’ve got a software system
    that’s hard to change, then you’re going to have a devil of a time keeping that
    system working when the requirements change.


    When are requirements most likely to change? Requirements are most volatile at
    the start of a project, just after the users have seen the first few features
    work. That’s because they’re getting their first look at what the system actually
