  md: "```\n```java\nassertThat(fib(2), equalTo(new BigInteger(\"2\")));\n}\n```\n\
    ```\n\nWe can make this pass by using Unconditional → Selection:\n\nClick here\
    \ to view code image\n\n```\n```java\nprivate BigInteger fib(int n) {\n    if\
    \ (n > 1)\n        return new BigInteger(\"2\");\n    else\n        return new\
    \ BigInteger(\"1\");\n}\n```\n```\n\nThis is perilously close to being more specific\
    \ than general, though it titillates me with the potential for negative arguments\
    \ to the `fib` function.\n\nThe next test tempts us to go for the gold:\n\nClick\
    \ here to view code image\n\n```\n```java\nassertThat(fib(3), equalTo(new BigInteger(\"\
    3\")));\n```\n```\n\nThe solution uses Statement → Recursion:\n\nClick here to\
    \ view code image\n\n```\n```java\nprivate BigInteger fib(int n) {\n    if (n\
    \ > 1)\n        return fib(n-1).add(fib(n-2));\n    else\n        return new BigInteger(\"\
    1\");\n}\n```\n```\n\nThis is a very elegant solution. It’s also horrifically\
    \ expensive in terms of time¹⁰ and memory. Going for the gold too early often\
    \ comes at a cost. Is there another way we could have done that last step?\n\n\
    10. fib(40) == 165580141 took nine seconds to compute on my 2.3GHz MacBook Pro.\n\
    \nOf course there is:\n\nClick here to view code image\n\n```\n```java\nprivate\
    \ BigInteger fib(int n) {\n    return fib(BigInteger.ONE, BigInteger.ONE, n);\n\
    }\n```\n```"
