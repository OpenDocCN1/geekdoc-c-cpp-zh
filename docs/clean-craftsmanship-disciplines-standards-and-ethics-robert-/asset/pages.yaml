  md: "```\n```\n@Test\npublic void allOnes() throws Exception {\n    rollMany(20,\
    \ 1);\n    assertEquals(20, g.score());\n}\n```\n```\n\nThe sequence of refactorings\
    \ was as follows:\n\n+   1. **Extract Variable:** The `1` in `g.roll(1)` was extracted\
    \ into a variable named `pins`.\n+   2. **Extract Variable:** The `20` in `assertEquals(20,\
    \ g.score());` was extracted into a variable named `n`.\n+   3. The two variables\
    \ were moved above the `for` loop.\n+   4. **Extract Method:** The `for` loop\
    \ was extracted into the `rollMany` function. The names of the variables became\
    \ the names of the arguments.\n+   5. **Inline:** The two variables were inlined.\
    \ They had served their purpose and were no longer needed.\n\nAnother common usage\
    \ for **Extract Variable** is to create an *explanatory variable*.<sup>8</sup>\
    \ For example, consider the following if statement:\n\n8. Kent Beck, *Smalltalk\
