- pgno: 242
  md: '# Rubik’s Cube


    So far, I’ve tried to show you how powerful a small set of refactorings can be.
    In my normal work, I seldom use more than the ones I’ve shown you. The trick is
    to learn them well and understand all the details of the IDE and the tricks for
    using them.


    I have often compared refactoring to solving a Rubik’s cube. If you’ve never solved
    one of these puzzles, it would be worth your time to learn how. Once you know
    the trick, it’s relatively easy.


    It turns out that there are a set of “operations” that you can apply to the cube
    that preserve most of the cube’s positions but change certain positions in predictable
    ways. Once you know three or four of those operations, you can incrementally manipulate
    the cube into a solvable position.


    The more operations you know and the more adept you are at performing them, the
    faster and more directly you can solve the cube. But you’d better learn those
    operations well. One missed step and the cube melts down into a random distribution
    of cubies, and you have to start all over.


    Refactoring code is a lot like this. The more refactorings you know and the more
    adept you are at using them, the easier it is to push, pull, and stretch the code
    in any direction you desire.


    Oh, and you’d better have tests too. Without them, meltdowns are a near certainty.


    # The Disciplines


    Refactoring is safe, easy, and powerful if you approach it in a regular and disciplined
    manner. If, on the other hand, you approach it as an ad hoc, temporary, and sporadic
    activity, that safety and power can quickly evaporate.


    # Tests'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'The first of the disciplines, of course, is tests. Tests, tests, tests, tests,
    and more tests. To safely and reliably refactor your code, you need a test suite
    that you trust with your life. You need tests.


    # ## Quick Tests


    The tests also need to be quick. Refactoring just doesn''t work well if your tests
    take hours (or even minutes) to run.


    In large systems, no matter how hard you try to reduce test time, it''s hard to
    reduce it to less than a few minutes. For this reason, I like to organize my test
    suite such that I can quickly and easily run *the relevant subset* of tests that
    check the part of the code I am refactoring at the moment. This usually allows
    me to reduce the test time from minutes to sub-seconds. I run the whole suite
    once every hour or so just to make sure no bugs leaked out.


    # ## Break Deep One-to-One Correspondences


    Creating a test structure that allows relevant subsets to be run means that, at
    the level of modules and components, the design of your tests will mirror the
    design of your code. There will likely be a one-to-one correspondence between
    your high-level test modules and your high-level production code modules.


    As we learned in the previous section, deep one-to-one correspondences between
    tests and code lead to fragile tests.


    The speed benefit of being able to run relevant subsets of tests is much greater
    than the cost of one-to-one coupling *at that level*. But in order to prevent
    fragile tests, we don''t want the one-to-one correspondence to continue. So, below
    the level of modules and components, we purposely break that one-to-one correspondence.


    # ## Refactor Continuously'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'When I cook a meal, I make it a rule to clean the preparation dishes as I proceed.⁹
    I do not let them pile up in the sink. There’s always enough time to clean the
    used utensils and pans while the food is cooking.


    9. My wife disputes this claim.


    Refactoring is like that too. Don’t wait to refactor. Refactor as you go. Keep
    the red → green → refactor loop in your mind, and spin around that loop every
    few minutes. That way, you will prevent the mess from building so large that it
    starts to intimidate you.


    # ## Refactor Mercilessly


    Merciless refactoring was one of Kent Beck’s sound bites for Extreme Programming.
    It was a good one. The discipline is simply to be courageous when you refactor.
    Don’t be afraid to try things. Don’t be reluctant to make changes. Manipulate
    the code as though it is clay and you are the sculptor. Fear of the code is the
    mind-killer, the dark path. Once you start down the dark path, forever will it
    dominate your destiny. Consume you it will.


    # ## Keep the Tests Passing!


    Sometimes you will realize that you’ve made a structural error and that a large
    swath of code needs to change. This can happen when a new requirement that invalidates
    your current design comes along. It can also happen out of the blue when, one
    day, you suddenly realize that there’s a better structure for the future of your
    project.


    You must be merciless, but you must also be smart. Never break the tests! Or,
    rather, never leave them broken for more than a few minutes at a time.


    If the restructuring is going to take hours or days to complete, then do the restructuring
    in small chunks while you keep everything passing and while you continue to do
    other activities.


    For example, let’s say that you realize that you need to change a fundamental
    data structure in the system—a data structure that large'
  merge: -1
