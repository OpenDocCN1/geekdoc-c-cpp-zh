- pgno: 364
  md: 'I have a very simple rule for dealing with meetings. It goes like this:


    > *When the meeting gets boring, leave.*


    You should be polite about it. Wait a few minutes for a lull in the conversation,
    and then tell the participants that you believe your input is no longer required
    and ask them if they would mind if you returned to the rather large amount of
    work you have to do.


    Never be afraid of leaving a meeting. If you don’t figure out how to leave, then
    some meetings will keep you forever.


    You would also be wise to decline most meeting invitations. The best way to avoid
    getting caught in long, boring meetings is to politely refuse the invitation in
    the first place. Don’t be seduced by the fear of missing out. If you are truly
    needed, they’ll come get you.


    When someone invites you to a meeting, make sure they’ve convinced you that you
    really need to go. Make sure they understand that you can only afford a few minutes
    and that you are likely to leave before the meeting is over.


    And make sure you sit close to the door.


    If you are a group leader or a manager, remember that one of your primary duties
    is to defend your team’s productivity by keeping them out of meetings.


    # **Music**


    I used to code to music long, long ago. But I found that listening to music impedes
    my concentration. Over time, I realized that listening to music only *feels* like
    it helps me concentrate, but actually, it divides my attention.


    One day, while looking over some year-old code, I realized that my code was suffering
    under the lash of the music. There, scattered through the code in a series of
    comments, were the lyrics to the song I had been listening to.


    Since then, I’ve stopped listening to music while I code, and I’ve found I am
    much happier with the code I write and with the attention to detail that I can
    give it.'
