  md: '# # The Circle of Life


    In Figure 1.1, you see Ron Jeffries’ *Circle of Life*, which shows the practices
    of XP. The disciplines that we cover in this book are the four in the center and
    the one on the far left.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_47_0.png)


    **Figure 1.1** The Circle of Life: The practices of XP


    The four in the center are the engineering practices of XP: test-driven development
    (TDD), refactoring, simple design, and pairing (which we shall call *collaborative
    programming*). The practice at the far left, acceptance tests, is the most technical
