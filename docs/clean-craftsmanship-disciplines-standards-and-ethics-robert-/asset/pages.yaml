  md: '+   3. Time management—effectively separating productive time from all the
    other junk you have to do


    # ## Viscosity


    Programmers are often very myopic when it comes to productivity. They view the
    primary component to productivity as their ability to write code quickly.


    But the writing of code is a very small part of the overall process. If you made
    the writing of code *infinitely* fast, it would increase overall productivity
    only by a small amount.


    That’s because there’s a lot more to the software process than just writing code.
    There’s at least


    +   - Building

    +   - Testing

    +   - Debugging

    +   - Deploying


    And that doesn’t count the requirements, the analysis, the design, the meetings,
    the research, the infrastructure, the tooling, and all the other stuff that goes
    into a software project.


    So, although it is important to be able to write code efficiently, it’s not even
    close to the biggest part of the problem.


    Let’s tackle some of the other issues one at a time.


    # ### Building


    If it takes you 30 minutes to build after a 5-minute edit, then you can’t be very
    productive, can you?


    There is no reason, in the second and subsequent decades of the twenty-first century,
    that builds should take more than a minute or two.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'Before you object to this, think about it. How could you speed the build? Are
    you utterly certain, in this age of cloud computing, that there is no way to dramatically
    speed up your build? Find whatever is causing the build to be slow, and fix it.
    Consider it a design challenge.


    # # Testing


    Is it your tests that are slowing the build? Same answer. Speed up your tests.


    Here, look at it this way. My poor little laptop has four cores running at a clock
    rate of 2.8GHz. That means it can execute around *10 billion instructions per
    second.*


    Do you even have 10 billion instructions in your whole system? If not, then you
    should be able to test your whole system in less than a second.


    Unless, of course, you are executing some of those instructions more than once.
    For example, how many times do you have to test login to know that it works? Generally
    speaking, once should be sufficient. How many of your tests go through the login
    process? Any more than one would be a waste!


    If login is required before each test, then during tests, you should short-circuit
    the login process. Use one of the mocking patterns. Or, if you must, remove the
    login process from systems built for testing.


    The point is, don’t tolerate repetition like that in your tests. It can make them
    horrifically slow.


    As another example, how many times do your tests walk through the navigation and
    menu structure of the user interface? How many tests start at the top and then
    walk through a long chain of links to finally get the system into the state where
    the test can be run?


    Any more than once per navigation pathway would be a waste! So, build a special
    testing API that allows the tests to quickly force the system into the state you
    need, without logging in and without navigating.


    How many times do you have to execute a query to know that it works? Once! So,
    mock out your databases for the majority of your tests. Don’t allow the same queries
    to be executed over and over and over again.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'Peripheral devices are slow. Disks are slow. Web sockets are slow. UI screens
    are slow. Don''t let slow things slow down your tests. Mock them out. Bypass them.
    Get them out of the critical path of your tests. Don''t tolerate slow tests. Keep
    your tests running fast!


    # ### Debugging


    Does it take a long time to debug things? Why? Why is debugging slow?


    You are using TDD to write unit tests, aren''t you? You are writing acceptance
    tests too, right? And you are measuring test coverage with a good coverage analysis
    tool, right? And you are periodically proving that your tests are semantically
    stable by using a mutation tester, right?


    If you are doing all those things or even just *some* of those things, your debug
    time can be reduced to insignificance.


    # ### Deployment


    Does deployment take forever? Why? I mean, you *are* using deployment scripts,
    right? You aren''t deploying manually, are you?


    Remember, you are a programmer. Deployment is a procedure—automate it! And write
    tests for that procedure too!


    You should be able to deploy your system, every time, with a single click.


    # ### Managing Distractions


    One of the most pernicious destroyers of productivity is distraction from the
    job. There are many different kinds of distractions. It is important for you to
    know how to recognize them and defend against them.


    # ### Meetings


    Are you slowed down by meetings?'
