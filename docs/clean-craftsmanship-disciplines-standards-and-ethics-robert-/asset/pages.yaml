    Diophantine² equation has solutions. He constructed this proof by imagining a
    simple, if infinite, digital computer and then proving that there were numbers
    that this computer could not calculate. As a consequence of this proof, he invented
    finite state machines, machine language, symbolic language, macros, and primitive
    subroutines. He invented, what we would call today, software.


