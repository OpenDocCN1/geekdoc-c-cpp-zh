- pgno: 300
  md: '# # The First Programmer


    The profession of software began, inauspiciously, in the summer of 1935 when Alan
    Turing began work on his paper. His goal was to resolve a mathematical dilemma
    that had perplexed mathematicians for a decade or more—the *Entscheidungsproblem*.
    The decision problem.


    In that goal he was successful, but he had no idea, at the time, that his paper
    would spawn a globe-spanning industry upon which we would all depend and that
    now forms the life’s blood of our entire civilization.


    Many people think of Lord Byron’s daughter, Ada, the countess of Lovelace, as
    the first programmer, and with good reason. She was the first person we know of
    who understood that the numbers manipulated by a computing machine could represent
    nonnumeric concepts. Symbols instead of numbers. And, to be fair, Ada did write
    some algorithms for Charles Babbage’s Analytical Engine, which unfortunately was
    never built.


    But it was Alan Turing who wrote the first^1 programs to execute in an electronic
    computer. And it was Alan Turing who first *defined* the profession of software.


    In 1945, Turing wrote code for the Automated Computing Engine (ACE). He wrote
    this code in binary machine language, using base-32 numbers. Code like this had
    never been written before, so he had to invent and implement concepts such as
    subroutines, stacks, and floating-point numbers.


    After several months of inventing the basics and using them to solve mathematical
    problems, he wrote a report that stated the following conclusion:


    > > *We shall need a great number of mathematicians of ability, because there
    will probably be a good deal of work of this kind to be done.*


    +   1. Some folks point out that Konrad Zuse wrote algorithms for his electromechanical
    computer before Turing programmed the ACE.


    “A great number.” How did he know? In reality, he had no idea just how prescient
    that statement was—we certainly have a great number now.


    But what was that other thing he said? “Mathematicians of ability.” Do you consider
    yourself to be a mathematician of ability?'
