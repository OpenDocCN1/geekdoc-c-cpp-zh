- pgno: 66
  md: 'humans are not good at doing two things at once. If we focus on writing a failing
    test, it’s not likely to be a well-written test. If we focus on writing production
    code that passes the test, it is not likely to be good production code. If we
    focus on the behavior we want, we will not be focusing on the structure we want.


    Don’t fool yourself. You cannot do both at once. It is hard enough to get code
    to behave the way you want it to. It is too hard to write it to behave *and* have
    the right structure. Thus, we follow Kent Beck’s advice:


    > > *First make it work. Then make it right.*


    Therefore, we add a new law to the three laws of TDD: the law of refactoring.
    First you write a small amount of failing test code. Then you write a small amount
    of passing production code. Then you clean up the mess you just made.


    The traffic light gets a new color: red → green → refactor ([Figure 2.1](#figure-2-1)).


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_66_0.png)


    **Figure 2.1** Red → green → refactor


    You’ve likely heard of refactoring, and as I said earlier, we’ll be spending a
    great deal of time on it in coming chapters. For now, let me dispel a few myths
    and misconceptions:


    +   - Refactoring is a constant activity. Every time around the TDD cycle, you
    clean things up.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - Refactoring does not change behavior. You only refactor when the tests
    are passing, and the tests continue to pass while you refactor.

    +   - Refactoring *never* appears on a schedule or a plan. You do not reserve
    time for refactoring. You do not ask permission to refactor. You simply refactor
    *all the time*.


    Think of refactoring as the equivalent of washing your hands after using the restroom.
    It''s just something you always do as a matter of common decency.


    # ## The Basics


    It is very hard to create effective examples of TDD in text. The rhythm of TDD
    just doesn''t come through very well. In the pages that follow, I try to convey
    that rhythm with appropriate timestamps and callouts. But to actually understand
    the true frequency of this rhythm, you just have to see it.


    Therefore, each of the examples to follow has a corresponding online video that
    will help you see the rhythm first hand. Please watch each video in its entirety,
    and then make sure you go back to the text and read the explanation with the timestamps.
    If you don''t have access to the videos, then pay special attention to the timestamps
    in the examples so you can infer the rhythm.


    # ## Simple Examples


    As you review these examples, you are likely to discount them because they are
    all small and simple problems. You might conclude that TDD may be effective for
    such "toy examples" but cannot possibly work for complex systems. This would be
    a grave mistake.


    The primary goal of any good software designer is to break down large and complex
    systems into a set of small, simple problems. The job of a programmer is to break
    those systems down into individual lines of code.'
