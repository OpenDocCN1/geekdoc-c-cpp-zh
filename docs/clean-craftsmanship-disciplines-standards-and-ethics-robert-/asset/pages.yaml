- pgno: 377
  md: 'Long story short—I got a special-purpose, one-of-a-kind unit up and running
    for the customer in two weeks. We called it the pCCU.


    # # The Lesson


    Those two stories are examples of the huge range that estimates can have. On the
    one hand, I underestimated the vectoring of the chips by a factor of six. On the
    other, we found a solution to the CCU/CMU in one-twentieth the expected time.


    This is where honesty comes in. Because, honestly, when things go wrong, they
    can go very, very wrong. And when things go right, they can sometimes go very,
    very right.


    This makes estimating, one hell of a challenge.


    # # Accuracy


    It should be clear by now that an estimate for a project *cannot* be a date. A
    single date is far too precise for a process that can be off by as much as a factor
    of 6, or even 20.


    Estimates are not dates. Estimates are ranges. Estimates are *probability distributions*.


    Probability distributions have a mean and a width—sometimes called the *standard
    deviation* or the *sigma*. We need to be able to express our estimates as both
    the mean and the sigma.


    Let’s first look at the mean.


    Finding the expected mean completion time for a complex task is a matter of adding
    up all the mean completion times for all of the subtasks. And, of course, this
    is recursive. The subtasks can be estimated by adding up all the times for the
    sub-subtasks. This creates a tree of tasks that is often called a work breakdown
    structure (WBS).'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'Now, this is all well and good. The problem, however, is that we are not very
    good at identifying all the subtasks and sub-subtasks, and sub-sub-subtasks. Generally,
    we miss a few. Like, maybe, half.


    We compensate for this by multiplying the sum by two. Or sometimes three. Or maybe
    even more.


    **Kirk:** *How much refit time until we can take her out again?*


    **Scotty:** Eight weeks, sir. But you don’t have eight weeks, so I’ll do it for
    you in two.


    **Kirk:** Mr. Scott, have you always multiplied your repair estimates by a factor
    of four?


    **Scotty:** Certainly, sir! How else can I keep my reputation as a miracle worker?³


    3. *Star Trek II: The Wrath of Khan*, directed by Nicholas Meyer (Paramount Pictures,
    1982).


    Now this fudge factor of 2, or 3, or even 4, sounds like cheating. And, of course,
    it is. But so is the very act of estimating.


    There is only one real way to determine how long something is going to take, and
    that’s by doing it. Any other mechanism is cheating.


    So, face it, we’re going to cheat. We’re going to do the WBS and then multiply
    by some *F*, where *F* is between 2 and 4, depending on your confidence and productivity.
    That will give us our mean time to completion.


    Managers are going to ask you how you came up with your estimates, and you’re
    going to have to tell them. And when you tell them about that fudge factor, they’re
    going to ask you to reduce it by spending more time on the WBS.


    This is perfectly fair, and you should be willing to comply. However, you should
