  md: '# Finite State Machines


    The reason I made such a big deal out of the synonymity of GWT and AAA is that
    there is another famous trait that we frequently encounter in software: the transition
    of a finite state machine.


    Consider the state/transition diagram of a simple subway turnstile (Figure 3.1).


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_133_0.png)


    **Figure 3.1** Transition/state diagram for a subway turnstile


    The turnstile starts in the locked state. A coin will send it to the unlocked
    state. When someone passes through, the turnstile returns to the locked state.
    If someone passes without paying, the turnstile alarms. If someone drops two coins,
    the extra coin is refunded.


    This diagram can be turned into a state transition table as follows:


    | Current State | Event | Next State |

    |---|---|---|

    | Locked | Coin | Unlocked |

    | Locked | Pass | Alarming |'
