    analytics, it influences social and herd behavior. Therefore, we must be responsible
    and act with great care and empathy—the health and well-being of people depend
    on it. Uncle Bob helps us face this responsibility and *become the professionals
    that our society expects, and demands, us to be.*


    As the Agile Manifesto nears its twentieth birthday at the writing of this foreword,
    this book is a perfect opportunity to go back to basics: a timely and humble reminder
    of the ever-increasing complexity of our programmatic world and how we owe it
    to the legacy of humankind—and to ourselves—to practice ethical development. Take
    your time reading *Clean Craftsmanship*. Let the principles seep into you. Practice
    them. Improve them. Mentor others. Keep this book on your go-to bookshelf. Let
    this book be your old friend—*your* Uncle Bob, *your* guide—as you make your way
    through this world with curiosity and courage.


    *—Stacia Heimgartner Viscardi, CST & Agile Mentor*'
