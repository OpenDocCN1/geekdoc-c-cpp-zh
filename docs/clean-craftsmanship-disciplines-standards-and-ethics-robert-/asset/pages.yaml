  md: '# Story 1: Vectors


    The year was 1978. I was working at a company named Teradyne, in Deerfield, Illinois.
    We built automated test equipment for the telephone company.


    I was a young programmer, 26 years old. And I was working on the firmware for
    an embedded measurement device that bolted into racks in telephone central offices.
    This device was called a COLT—central office line tester.


    The processor in the COLT was an Intel 8085—an early 8-bit microprocessor. We
    had 32K of solid-state RAM and another 32K of ROM. The ROM was based on the Intel
    2708 chip, which stored 1K × 8, so we used 32 of those chips.


    Those chips were plugged into sockets on our memory boards. Each board could hold
    12 chips, so we used three boards.


    The software was written in 8085 assembler. The source code was held in a set
    of source files that were compiled as a single unit. The output of the compiler
    was a single binary file somewhat less than 32K in length.


    We took that file and cut it up into 32 chunks of 1K each. Each 1K chunk was then
    burned onto one of the ROM chips, which were then inserted into the sockets on
    the ROM boards.


    As you can imagine, you had to get the right chip into the right socket on the
    right board. We were very careful to label them.


    We sold hundreds of these devices. They were installed in telephone central offices
    all over the country and—indeed—the world.


    What do you think happened when we changed that program? Just a one-line change?


    If we added or removed a line, then all the addresses of all the subroutines after
    that point changed. And because those subroutines were called by other routines
    earlier in the code, every chip was affected. We had to reburn all 32 chips even
    for a one-line change!


    It was a nightmare. We had to burn hundreds of sets of chips and ship them to
    all the field service reps all around the world. Then those reps would'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'have to drive hundreds of miles to get to all the central offices in their
    district. They’d have to open our units, pull out all the memory boards, remove
    all 32 old chips, insert the 32 new chips, and reinsert the boards.


    Now, I don’t know if you know this, but the act of removing and inserting a chip
    into a socket is not entirely reliable. The little pins on the chips tend to bend
    and break in frustratingly silent ways. Therefore, the poor field service folks
    had to have lots of spares of each of the 32 chips and suffer through the inevitable
    debugging by removing and reinserting chips until they could get a unit to work.


    My boss came to me one day and told me that we had to solve this problem by making
    each chip independently deployable. He didn’t use those words, of course, but
    that was the intent. Each chip needed to be turned into an independently compilable
    and deployable unit. This would allow us to make changes to the program without
    forcing all 32 chips to be reburned. Indeed, in most cases, we could simply redeploy
    a single chip—the chip that was changed.


    I won’t bore you with the details of the implementation. Suffice it to say that
    it involved vector tables, indirect calls, and the partitioning of the program
    into independent chunks of less than 1K each.²


    2. That is, each chip was turned into a polymorphic object.


    My boss and I talked through the strategy, and then he asked me how long it would
    take me to get this done.


    I told him two weeks.


    But I wasn’t done in two weeks. I wasn’t done in four weeks. Nor was I done in
    six, eight, or ten weeks. The job took me twelve weeks to complete—it was a lot
    more complicated than I had anticipated.


    Consequently, I was off by a factor of 6. Six!


    Fortunately, my boss didn’t get mad. He saw me working on it every day. He got
    regular status updates from me. He understood the complexities I was dealing with.


    But still. Six? How could I have been so wrong?'
