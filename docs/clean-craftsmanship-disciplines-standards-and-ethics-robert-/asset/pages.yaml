    \ that this is correct.\n\nThis test fails, of course. So how do we get it to\
    \ pass? Let's look at the code:\n\n[Click here to view code image](#)\n\n```\n\
    ```java\npublic class Game {\n    private int score;\n    public void roll(int\
    \ pins) {\n        score += pins;\n    }\n\n    public int score() {\n       \
    \ return score;\n    }\n}\n```\n```\n\nThe score is being calculated in the `roll`\
    \ function, so we need to modify that function to account for the spare. But that\
    \ will force us to do something really ugly, like this:\n\n[Click here to view\
