- pgno: 246
  md: 'The best approach to refactoring is to develop a comfortable repertoire of
    refactorings that you use frequently and to have a good working knowledge of many
    others. If you use an IDE that provides refactoring operations, make sure you
    understand them in detail.


    Refactoring makes no sense without tests. Without tests, the opportunities for
    error are just too common. Even the automated refactorings that your IDE provides
    can sometimes make mistakes. So *always* back up your refactoring efforts with
    a comprehensive suite of tests.


    Finally, be disciplined. Refactor frequently. Refactor mercilessly. And refactor
    without apology. Never, ever ask permission to refactor.'
