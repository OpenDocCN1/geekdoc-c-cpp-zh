  md: '# # Test Automation


    In most instances, manual testing is a huge waste of money and time. Almost any
    test that can be automated *should* be automated. This includes unit tests, acceptance
    tests, integration tests, and system tests.


    Manual testing is expensive. It should be reserved for situations in which human
    judgment is necessary. This includes things like checking the aesthetics of a
    GUI, exploratory testing, and subjectively evaluating the ease of an interaction.


    Exploratory testing deserves a special mention. This kind of testing depends entirely
    on human ingenuity, intuition, and insight. The goal is to empirically derive
    the behavior of the system through extensive observation of the way the system
    operates. Exploratory testers must infer corner cases and deduce appropriate operational
    pathways to exercise them. This is no mean feat and requires a significant amount
    of expertise.


    Most tests, on the other hand, are eminently automatable. The vast majority are
    simple Arrange/Act/Assert constructs that can be executed by supplying canned
    inputs and examining expected outputs. Developers are responsible to provide a
    function-callable API that allows these tests to run quickly and without significant
    setup of an execution environment.


    Developers should design the system to abstract out any slow or high-setup operations.
    If, for example, the system makes extensive use of a relational database management
    system (RDBMS), the developers should create an abstraction layer that encapsulates
    the business rules from it. This practice allows the automated tests to replace
    the RDBMS with canned input data, vastly increasing both the speed and reliability
    of the tests.


    Slow and inconvenient peripherals, interfaces, and frameworks should also be abstracted
    so that individual tests can run in microseconds, can be run in isolation from
    any environment,^2 and are not subject to any ambiguity regarding socket timing,
    database contents, or framework behavior.


    2. For example, at 30,000 feet over the Atlantic on your laptop.


    # # Automated Testing and User Interfaces'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Automated tests *should not test business rules through the user interface.*
    User interfaces are subject to change for reasons that have more to do with fashion,
    facility, and general marketing chaos than with business rules. When automated
    tests are driven through the user interface, as shown in [Figure 10.1](#figure-10-1),
    those tests are subject to those changes. As a consequence, the tests become very
    fragile, which often results in the tests being discarded as too difficult to
    maintain.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_289_0.png)


    **Figure 10.1** Tests driven through the user interface


    To avoid this situation, developers should isolate the business rules from the
    user interface with a function call API, as shown in [Figure 10.2](#figure-10-2).
    Tests that use this API are completely independent of the user interface and are
    not subject to interface changes.'
