    # # Honest Estimates


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_294_0.png)


    I expect honest estimates.


    As a programmer, the most honest estimate you can give is “I don’t know” because
    you actually do not know how long the task will take. On the other hand, you do
    know that you will probably finish the task in less than a billion years. So,
    an honest estimate is an amalgam of what you don’t know with what you do know.


    An honest estimate looks something like this:


    +   - I have a 5 percent chance of finishing this task before Friday.'
