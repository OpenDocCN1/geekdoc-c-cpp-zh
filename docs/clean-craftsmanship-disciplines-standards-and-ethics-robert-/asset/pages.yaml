- pgno: 90
  md: "initialization of the `divisor` variable was moved above the `if` statement.\
    \ Finally, the `if` was changed into a `while`.\n\nThere it is again: that transition\
    \ from `if`->`while`. Did you notice that the predicate of the original `if` statement\
    \ turned out to be the predicate for the outer `while` loop? I found this to be\
    \ startling. There’s something genetic about it. It’s as though the creature that\
    \ I’ve been trying to create started from a simple seed and gradually evolved\
    \ through a sequence of tiny mutations.\n\nNotice that the `if` statement at the\
    \ bottom has become superfluous. The only way the loop can terminate is if n is\
    \ 1. That `if` statement really was the terminating condition of an unwound loop!\n\
    \n[Click here to view code image](#)\n\n```\n```java\nprivate List<Integer> factorsOf(int\
    \ n) {\n    ArrayList<Integer> factors = new ArrayList<>();\n    int divisor =\
    \ 2;\n    while (n > 1) {\n        while (n % divisor == 0) {\n            factors.add(divisor);\n\
    \            n /= divisor;\n        }\n        divisor++;\n    }\n    return factors;\n\
    }\n```\n```\n\nJust a little bit of refactoring, and we get this:\n\n[Click here\
    \ to view code image](#)\n\n```\n```java\nprivate List<Integer> factorsOf(int\
    \ n) {\n    ArrayList<Integer> factors = new ArrayList<>();\n\n    for (int divisor\
    \ = 2; n > 1; divisor++)\n        for (; n % divisor == 0; n /= divisor)\n   \
    \         factors.add(divisor);\n\n    return factors;\n}\n```\n```"
