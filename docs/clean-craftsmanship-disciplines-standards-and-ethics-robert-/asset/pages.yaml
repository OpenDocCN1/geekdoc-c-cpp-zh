- pgno: 48
  md: 'TDD is the lynchpin discipline. Without it, the other disciplines are either
    impossible or impotent. For that reason, the two upcoming sections describing
    TDD represent nearly half the pages of this book and are intensely technical.
    This organization may seem unbalanced. Indeed, it feels that way to me too, and
    I struggled with what to do about that. My conclusion, however, is that the imbalance
    is a reaction to the corresponding imbalance within our industry. Too few programmers
    know this discipline well.


    TDD is the discipline that governs the way a programmer works on a second-by-second
    basis. It is neither an up-front discipline nor an after-the-fact discipline.
    TDD is in-process and in-your-face. There is no way to do partial TDD; it is an
    all-or-nothing discipline.


    The essence of the TDD discipline is very simple. Small cycles and tests come
    first. Tests come first in everything. Tests are written first. Tests are cleaned
    up first. In all activities, tests come first. And all activities are broken down
    into the tiniest of cycles.


    Cycle times are measured in seconds, not minutes. They are measured in characters,
    not lines. The feedback loop is closed almost literally as soon as it is opened.


    The goal of TDD is to create a test suite that you would trust with your life.
    If the test suite passes, you should feel safe to deploy the code.


    Of all the disciplines, TDD is the most onerous and the most complex. It is onerous
    because it dominates everything. It is the first and last thing you think about.
    It is the constraint that lays thick over everything you do. It is the governor
    that keeps the pace steady regardless of pressure and environmental stresses.


    TDD is complex because code is complex. For each shape or form of code, there
    is a corresponding shape or form of TDD. TDD is complex because the tests must
    be designed to fit the code without being coupled to the code and must cover almost
    everything yet still execute in seconds. TDD is an elaborate and complex skill
    that is very hard won but immeasurably rewarding.'
