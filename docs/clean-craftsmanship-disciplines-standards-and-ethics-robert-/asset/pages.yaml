- pgno: 59
  md: 'Are you good at the debugger? Do you have the debug-foo in your fingers? Do
    you have all the hot keys primed and ready to go? Is it second nature for you
    to efficiently set breakpoints and watchpoints and to dive headlong into a deep
    debugging session?


    *This is not a skill to be desired!*


    You don’t want to be good at the debugger. The only way you get good at the debugger
    is by spending a lot of time debugging. And I don’t want you spending a lot of
    time debugging. You shouldn’t want that either. I want you spending as much time
    as possible writing code that works and as little time as possible fixing code
    that doesn’t.


    I want your use of the debugger to be so infrequent that you forget the hot keys
    and lose the debug-foo in your fingers. I want you puzzling over the obscure step-into
    and step-over icons. I want you to be so unpracticed at the debugger that the
    debugger feels awkward and slow. And you should want that too. The more comfortable
    you feel with a debugger, the more you know you are doing something wrong.


    Now, I can’t promise you that these three laws will eliminate the need for the
    debugger. You will still have to debug from time to time. This is still software,
    and it’s still hard. But the frequency and duration of your debugging sessions
    will undergo a drastic decline. You will spend far more time writing code that
    works and far less time fixing code that doesn’t.


    # ***Documentation***


    If you’ve ever integrated a third-party package, you know that included in the
    bundle of software you receive is a PDF written by a tech writer. This document
    purports to describe how to integrate the third-party package. At the end of this
    document is almost always an ugly appendix that contains all the *code examples*
    for integrating the package.


    Of course, that appendix is the first place you look. You don’t want to read what
    a tech writer wrote *about* the code; you want to read the code. And that code
    will tell you much more than the words written by the tech writer. If you are
    lucky, you might even be able to use copy/paste to move the code into your application
    where you can fiddle it into working.'
