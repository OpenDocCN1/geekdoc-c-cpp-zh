  md: 'At almost exactly the same time, Alonzo Church constructed a completely different
    proof for the same problem and consequently developed the lambda calculus—the
    core concept of functional programming.


    In 1941, Konrad Zuse built the first electromechanical programmable digital computer,
    the Z3. It consisted of more than 2,000 relays and operated at a clock rate of
    5 to 10Hz. The machine used binary arithmetic organized into 22-bit words.


    During World War II, Turing was recruited to help the “boffins” at Bletchley Park
    decrypt the German Enigma codes. The Enigma machine was a simple digital computer
    that randomized the characters of textual messages that were typically broadcast
    using radio telegraphs. Turing aided in the construction of an electromechanical
    digital search engine to find the keys to those codes.


    After the war, Turing was instrumental in building and programming one of the
    world’s first electronic vacuum tube computers—the Automatic Computing Engine,
    or ACE. The original prototype used 1,000 vacuum tubes and manipulated binary
    numbers at a speed of a million bits per second.


    In 1947, after writing some programs for this machine and researching its capabilities,
    Turing gave a lecture in which he made these prescient statements:


    > > We shall need a great number of mathematicians of ability [to put the problems]
    into a form for computation.

    > >

    > > One of our difficulties will be the maintenance of an appropriate discipline,
    so that we do not lose track of what we are doing.


