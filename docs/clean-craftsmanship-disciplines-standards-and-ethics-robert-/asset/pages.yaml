- pgno: 251
  md: 'It is hard to imagine the furor this new perspective raised in the late 1990s.
    Designers everywhere had gotten very used to putting all the hooks in. In those
    days, putting the hooks in was considered conventional wisdom and a best practice.


    So, when the YAGNI discipline of Extreme Programming surfaced, it was roundly
    criticized and panned as heresy and claptrap.


    Nowadays, ironically, it is one of the most important disciplines of good software
    design. If you have a good suite of tests and you are skilled at the discipline
    of refactoring, then the cost of adding a new feature and updating the design
    to support that new feature will almost certainly be smaller than the cost of
    implementing and maintaining all the hooks you might need one day.


    Hooks are problematic in any case. We seldom get them right. That’s because we
    are not particularly good at predicting what customers will actually do. Consequently,
    we tend to put in far more hooks than we need and base those hooks on assumptions
    that rarely pan out.


    The bottom line is that the effect that gigahertz clock rates and terabyte memories
    had on the process of software design and architecture took us all by surprise.
    We did not realize until the late 1990s that those advances would allow us to
    vastly *simplify* our designs.


    It is one of the great ironies of our industry that the exponential increase of
    Moore’s law that drove us to build ever-more complex software systems also made
    it possible to simplify the designs of those systems.


    YAGNI, it turns out, is the unintended consequence of the virtually limitless
    computer power now at our disposal. Because our build times have shrunk down into
    the seconds and because we can afford to write and execute comprehensive test
    suites that execute in seconds, we can afford to *not* put the hooks in and instead
    refactor the designs as the requirements change.


    Does this mean that we never put the hooks in? Do we always design our systems
    only for the features we need today? Do we never think ahead and plan for the
    future?


    No, that’s not what YAGNI means. There are times when putting a particular hook
    in is a good idea. Future-proofing the code is not dead, and it is always wise
    to think of the future.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'It’s just that the trade-offs have changed so dramatically in the last few
    decades that it is now usually better to leave the majority of the hooks out.
    And that’s why we ask the question:


    What if you aren’t gonna need it?


    # Covered by Tests


    The first time I ran across Beck’s rules of simple design was in the first edition
    of *Extreme Programming Explained.*⁴ At that time, the four rules were as follows:


    ⁴. Kent Beck, *Extreme Programming Explained* (Addison-Wesley, 1999).


    +   1. The system (code and tests) must communicate everything you want to communicate.

    +   2. The system must contain no duplicate code.

    +   3. The system should have the fewest possible classes.

    +   4. The system should have the fewest possible methods.


    By 2011, they had evolved to these:


    +   1. Tests pass.

    +   2. Reveal intent.

    +   3. No duplication.

    +   4. Small.


    By 2014, Corey Haines had written a book⁵ about those four rules:


    ⁵. Corey Haines, *Understanding the Four Rules of Simple Design* (Leanpub, 2014).


    In 2015, Martin Fowler wrote a blog⁶ about them in which he rephrased them:


    ⁶. Martin Fowler, “BeckDesignRules,” March 2, 2015,

    https://martinfowler.com/bliki/BeckDesignRules.xhtml.


    +   1. Passes the tests.

    +   2. Reveals intention.'
