  md: 'humble opinion.


    # # Synthesis


    Although these two schools of thought exist, and although there are practitioners
    who tend toward one side or the other, London versus Chicago is not a war. It’s
    not really even much of a disagreement. It is a minor point of emphasis, and little
    more.


    Indeed, all practitioners, whether Chicagoans or Londoners, use both techniques
    in their work. It’s just that some do a little more of one, and some do a little
    more of the other.


    Which is right? Neither, of course. I tend more toward the Chicago side, but you
    may look at the London school and decide you are more comfortable there. I have
    no disagreement with you. Indeed, I will happily pair program with you to create
    a lovely synthesis.


    That synthesis becomes very important when we start to consider architecture.


    # # Architecture


    The trade-off I make between the London and Chicago strategies is architectural.
    If you read *Clean Architecture*,^4 you know that I like to partition systems
    into components. I call the divisions between those components *boundaries*. My
    rule for boundaries is that source code dependencies must always cross a boundary
    pointing toward high-level policy.


    4. Robert C. Martin, *Clean Architecture: A Craftsman’s Guide to Software Structure
    and Design* (Addison-Wesley, 2018).


    This means that components that contain low-level details, like graphical user
    interfaces (GUIs) and databases, depend on higher-level components like business
    rules. High-level components do not depend on lower-level components. This is
    an example of the dependency inversion principle, which is the D in SOLID.'
