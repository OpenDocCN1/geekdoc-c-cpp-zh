  md: 'That year, the movie *War Games* depicted a young Mathew Broderick as a computer-savvy
    teenager and hacker. He hacks into the United States’ weapons control system,
    thinking it is a video game, and starts the countdown to thermonuclear war. At
    the end of the movie, he saves the world by convincing the computer that the only
    winning move is not to play.


    The computer and the programmer had switched roles. Now it was the computer that
    was the childlike naive character and the programmer the conduit, if not the source,
    of wisdom.


    We saw something similar in the 1986 movie *Short Circuit* in which the computerized
    robot known as Number 5 is childlike and innocent but learns wisdom with the help
    of its creator/programmer and his girlfriend.


    By 1993, things had changed dramatically. In the film *Jurassic Park*, the programmer
    was the villain, and the computer was not a character at all. It was just a tool.


    Society was beginning to understand who we were and the role we played. We had
    graduated from nerd to teacher to villain in just 20 years.


    But the vision changed again. In the 1999 film *The Matrix*, the main characters
    were both programmers and saviors. Indeed, their godlike powers came from their
    ability to read and understand—“the code.”


    Our roles were changing fast. Villain to savior in just a few years. Society at
    large was beginning to understand the power we have both for good and for bad.


    # ## Role Models and Villains


    Fifteen years later, in 2014, I visited the Mojang office in Stockholm to do some
    lectures on clean code and test-driven development. Mojang, in case you didn’t
    know, is the company that produced the game Minecraft.


    Afterward, because the weather was nice, the Mojang programmers and I sat outside
    at a beer garden, chatting. All of a sudden, a young boy, perhaps 12, runs up
    to the fence and calls out to one of the programmers: “Are you Jeb?”'
