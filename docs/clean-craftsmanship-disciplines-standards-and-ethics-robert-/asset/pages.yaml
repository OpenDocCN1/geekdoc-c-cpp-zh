  md: "# # Enter BDD\n\nIn 2003, while practicing and teaching TDD, Dan North, in\
    \ collaboration with Chris Stevenson and Chris Matz, made the same discovery that\
    \ Bill Wake had made. However, they used a different vocabulary: Given-When-Then\
    \ (GWT).\n\nThis was the beginning of *behavior-driven development* (BDD).\n\n\
    At first, BDD was viewed as an improved way of writing tests. Dan and other proponents\
    \ liked the vocabulary better and affixed that vocabulary into testing tools such\
    \ as JBehave, and RSpec.\n\nAs an example, I can rephrase the `gutterGame` test\
    \ in BDD terms as follows:\n\nClick here to view code image\n\n```\n    Given\
    \ that the player rolled a game of 20 gutter balls,\n    When I request the score\
    \ of that game,\n    Then the score will be zero.\n```\n\nIt should be clear that\
    \ some parsing would have to take place in order to translate that statement into\
    \ an executable test. JBehave and RSpec provided affordances for that kind of\
    \ parsing. It also ought to be clear that the TDD test and the BDD test are synonymous.\n\
    \nOver time, the vocabulary of BDD drew it away from testing and toward the problem\
    \ of system specification. BDD proponents realized that even if the GWT statements\
    \ were never executed as tests, they remained valuable as specifications of behavior.\n\
    \nIn 2013, Liz Keogh said of BDD:\n\n> > *It’s using examples to talk through\
    \ how an application behaves. ... And having conversations about those examples.*\n\
    \nStill, it is hard to separate BDD entirely from testing if only because the\
    \ vocabulary of GWT and AAA are so obviously synonymous. If you have any doubts\
    \ about that, consider the following:\n\n+   - *Given* that the test data has\
    \ been *Arranged*\n+   - *When* I execute the tested *Act*\n+   - *Then* the expected\
    \ result is *Asserted*"
