- pgno: 274
  md: 'Imagine that I am your new CTO. I’m going to tell you what I expect of you.
    You will read these expectations, and you will view them from two contradictory
    perspectives.


    The first will be the perspective of your managers, executives, and users. And,
    from their perspective, these expectations will seem obvious and normal. No manager,
    executive, or user would ever expect less.


    As a programmer, you may be more familiar with the second perspective. It is that
    of the programmers, architects, and technical leads. From their perspective, these
    expectations will seem extreme, impossible, even insane.


    The difference in those two perspectives, the mismatch of those expectations,
    is the primary failing of the software industry, and it is one that we must urgently
    repair.


    > > *As your new CTO, I expect. ...*'
