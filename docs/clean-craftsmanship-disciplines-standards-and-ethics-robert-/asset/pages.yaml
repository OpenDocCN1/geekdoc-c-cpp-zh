- pgno: 321
  md: 'Which of these two values is the greater? Which value should we prioritize
    above the other? We can answer that question with a simple thought experiment.


    Imagine two programs. One works perfectly but is impossible to change. The other
    does nothing correctly but is easy to change. Which is the more valuable?


    I hate to be the one to tell you this but, in case you hadn’t noticed, software
    requirements tend to change, and when they change, that first software will become
    useless—forever.


    On the other hand, that second software can be made to work, because it’s easy
    to change. It may take some time and money to get it to work initially, but after
    that, it’ll continue to work forever with minimal effort.


    Therefore, it is the second of the two values that should be given priority in
    all but the most urgent of situations.


    What do I mean by *urgent*? I mean a production disaster that’s losing the company
    $10 million per minute. That’s urgent.


    I do not mean a software startup. A startup is not an urgent situation requiring
    you to create inflexible software. Indeed, the opposite is true. The one thing
    that is absolutely certain in a startup is that you are creating the wrong product.


    No product survives contact with the user. As soon as you start to put the product
    into users’ hands, you will discover that the product you’ve built is wrong in
    a hundred different ways. And if you can’t change it without making a mess, you’re
    doomed.


    This is one of the biggest problems with software startups. Startup entrepreneurs
    believe they are in an urgent situation requiring them to throw out all the rules
    and dash to the finish line, leaving a huge mess in their wake. Most of the time,
    that huge mess starts to slow them down long before they do their first deployment.
    They’ll go faster and better and will survive a lot longer if they keep the structure
    of the software from harm.


    > > *When it comes to software, it never pays to rush.*

    > >

    > > —Brian Marick'
