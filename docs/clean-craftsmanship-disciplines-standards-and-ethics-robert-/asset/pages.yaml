  md: 'using *mock objects*, they likely thought nothing of it. Indeed, when I presented
    the idea of a mock object in Java to one expert Smalltalker and TDDer in 1999,
    his response to me was: “Too much mechanism.”


    Nevertheless, the technique caught hold and has become a mainstay of TDD practitioners.


    But before we delve too much further into the technique itself, we need to clear
    up a vocabulary issue. Almost all of us use the term *mock object* incorrectly—at
    least in a formal sense. The mock objects we talk about nowadays are very different
    from the mock objects that were presented in the endo-testing paper back in 2000.
    So different, in fact, that a different vocabulary has been adopted to clarify
    the separate meanings.


    In 2007, Gerard Meszaros published *xUnit Test Patterns: Refactoring Test Code*.^2
    In it, he adopted the formal vocabulary that we use today. Informally, we still
    talk about mocks and mocking, but when we want to be precise, we use Meszaros’s
    formal vocabulary.


    2. Gerard Meszaros, *xUnit Test Patterns: Refactoring Test Code* (Addison-Wesley,
    2007).


    Meszaros identified five kinds of objects that fall under the informal mock category:
    dummies, stubs, spies, mocks, and fakes. He called them all *test doubles*.


    That’s actually a very good name. In the movies, a stunt double stands in for
    an actor, and a hand double stands in for closeups of an actor’s hands. A body
    double stands in for shots when the body, and not the face, of the actor is on
    screen. And that’s just what a test double does. A *test double* stands in for
    another object while a test is being run.


    Test doubles form a type hierarchy of sorts (Figure 3.2). Dummies are the simplest.
    Stubs are dummies, spies are stubs, and mocks are spies. Fakes stand alone.'
