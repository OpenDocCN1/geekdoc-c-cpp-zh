- pgno: 181
  md: 'In this case, it is the `XRayTest` class that overrides the `turnOn` method
    and can also act as the spy for that method.


    I find Self-Shunt to be very convenient when I need a simple spy or a simple safety.
    On the other hand, the lack of a separate well-named class that specifically provides
    the safety or spying can be confusing for the reader, so I use this pattern judiciously.


    It is important to remember, when using this pattern, that different testing frameworks
    construct the test classes at different times. For example, JUnit constructs a
    new instance of the test class for every test method invocation. NUnit, on the
    other hand, executes all test methods on a single instance of the test class.
    So, care must be taken to ensure that any spy variables are properly reset.


    # Humble Object


    We like to think that every bit of code in the system can be tested using the
    three laws of TDD, but this is not entirely true. The parts of the code that communicate
    across a hardware boundary are perniciously difficult to test.


    It is difficult, for example, to test what is displayed on the screen or what
    was sent out a network interface or what was sent out a parallel or serial I/O
    port. Without some specially designed hardware mechanisms that the tests can communicate
    with, such tests are impossible.


    What’s more, such hardware mechanisms may well be slow and/or unreliable. Imagine,
    for example, a video camera staring at the screen and your test code trying desperately
    to determine if the image coming back from the camera is the image you sent to
    the screen. Or imagine a loopback network cable that connects the output port
    of the network adapter to the input port. Your tests would have to read the stream
    of data coming in on that input port and look for the specific data you sent out
    on the output port.


    In most cases, this kind of specialized hardware is inconvenient, if not entirely
    impractical.


    The *Humble Object* pattern is a compromise solution. This pattern acknowledges
    that there is code that cannot be practicably tested. The goal'
  merge: -1
