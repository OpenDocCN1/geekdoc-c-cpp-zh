- pgno: 365
  md: 'Programming is the act of arranging elements of procedure through sequence,
    selection, and iteration. Music is composed of tonal and rhythmic elements arranged
    through sequence, selection, and iteration. Could it be that listening to music
    uses the same parts of your brain that programming uses, thereby consuming part
    of your programming ability? That’s my theory, and I’m sticking to it.


    You will have to work this out for yourself. Maybe the music really does help
    you. But maybe it doesn’t. I’d advise you to try coding without music for a week,
    and see if you don’t end up producing more and better code.


    # Mood


    It’s important to realize that being productive requires that you become skilled
    at managing your emotional state. Emotional stress can kill your ability to code.
    It can break your concentration and keep you in a perpetually distracted state
    of mind.


    For example, have you ever noticed that you can’t code after a huge fight with
    your significant other? Oh, maybe you type a few random characters in your IDE,
    but they don’t amount to much. Perhaps you pretend to be productive by hanging
    out in some boring meeting that you don’t have to pay much attention to.


    Here’s what I’ve found works best to restore your productivity.


    Act. Act on the root of the emotion. Don’t try to code. Don’t try to cover the
    feelings with music or meetings. It won’t work. Act to resolve the emotion.


    If you find yourself at work, too sad or depressed to code because of a fight
    with your significant other, then call them to try to resolve the issue. Even
    if you don’t actually get the issue resolved, you’ll find that the action to attempt
    a resolution will sometimes clear your mind well enough to code.


    You don’t actually have to solve the problem. All you have to do is convince yourself
    that you’ve taken enough appropriate action. I usually find that’s enough to let
    me redirect my thoughts to the code I have to write.


    # The Flow'
