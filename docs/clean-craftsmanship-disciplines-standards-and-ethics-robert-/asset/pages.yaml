    # ## Mutation Testing


    One hundred percent test coverage implies that any semantic change to the code
    should cause a test to fail. TDD is a good discipline to approximate that goal
    because, if you follow the discipline ruthlessly, every line of code is written
    to make a failing test pass.


    Such ruthlessness, however, is often impractical. Programmers are human, and disciplines
    are always subject to pragmatics. So, the reality is that even the most assiduous
    test-driven developer will leave gaps in the test coverage.


    Mutations testing is a way to find those gaps, and there are mutation testing
    tools that can help. A mutation tester runs your test suite and measures the coverage.
    Then it goes into a loop, mutating your code in some semantic way and then running
