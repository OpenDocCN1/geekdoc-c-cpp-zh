  md: "The last two examples in [Chapter 2](#), “Test-Driven Development,” begged\
    \ an interesting question. Where does the algorithm that we derive using test-driven\
    \ development (TDD) come from? Clearly it comes from our brain, but not in the\
    \ way we are used to thinking. Somehow, the process of failing tests coaxes the\
    \ algorithm out of our brain without the need to think it all through beforehand.\n\
    \nThis raises the possibility that TDD may be a step-by-step, incremental procedure\
    \ for deriving any algorithm for any problem. Think of it like solving a mathematical\
    \ or geometric proof. You start from basic postulates—the degenerate failing tests.\
    \ Then, one step at a time, you build up the solution to the problem.\n\nAt each\
    \ step, the tests get more and more constraining and specific, but the production\
    \ code gets more and more generic. This process continues until the production\
    \ code is so general that you can’t think of any more tests that will fail. That\
    \ solves the entire problem.\n\nLet’s try this out. Let’s use the approach to\
    \ derive an algorithm for sorting an array of integers.\n\nIf you can watch the\
    \ video, this would be a good time, but in any case, please continue on to read\
    \ the text that follows.\n\nWatch related video: SORT 1\n\nAccess video by registering\
    \ at [informit.com/register](https://informit.com/register)\n\nWe begin, as usual,\
    \ with a test that does nothing:\n\n[Click here to view code image](#)\n\n```\n\
    ```java\npublic class SortTest {\n    @Test\n    public void nothing() throws\
    \ Exception {\n    }\n}\n```\n```\n\nThe first failing test will be the degenerate\
    \ case of an empty array:\n\n[Click here to view code image](#)\n\n```\n```java\n\
    public class SortTest {\n    @Test\n    public void sorted() throws Exception\
    \ {\n```\n```"
