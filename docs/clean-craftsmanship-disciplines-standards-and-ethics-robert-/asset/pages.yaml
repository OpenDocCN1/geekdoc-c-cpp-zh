- pgno: 218
  md: "```\n```java\nprivate BigInteger fib(BigInteger fm2, BigInteger fm1, int n)\
    \ {\n    if (n>1)\n        return fib(fm1, fm1.add(fm2), n-1);\n    else\n   \
    \     return fm1;\n}\n```\n```\n\nThis is a nice tail-recursive algorithm that\
    \ is tolerably fast.^11\n\n11. fib(100) ==573147844013817084101 in 10ms.\n\nYou\
    \ might think that last transformation was just a different application of Statement\
    \ → Recursion, but it wasn't. It was actually Selection → Iteration. In fact,\
    \ if the Java compiler would deign to offer us tail-call-optimization,^12 it would\
    \ translate almost exactly to the following code. Note the implied if->while.\n\
    \n12. Java, Java, wherefore art thou Java?\n\nClick here to view code image\n\n\
    ```\n```java\nprivate BigInteger fib(int n) {\n    BigInteger fm2 = BigInteger.ONE;\n\
    \    BigInteger fm1 = BigInteger.ONE;\n    while (n>1) {\n        BigInteger f\
    \ = fm1.add(fm2);\n        fm2 = fm1;\n        fm1 = f;\n        n--;\n    }\n\
    \    return fm1;\n}\n```\n```\n\nI took you on that little diversion to make an\
    \ important point:\n\n> *Rule 14: If one transformation leads you to a suboptimal\
    \ solution, try a different transformation.*\n\nThis is actually the second time\
    \ we have encountered a situation in which a transformation led us to a suboptimal\
    \ solution and a different transformation produced much better results. The first\
    \ time was back in the sort kata. In that case, it was the Value → Mutated Value\
    \ transformation"
