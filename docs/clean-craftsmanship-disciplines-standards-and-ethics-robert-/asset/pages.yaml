- pgno: 319
  md: 'because it’s not important enough. But you forget that software is very expensive
    to write, and at very least, the money spent on its development is at stake—not
    to mention whatever the users put at stake by depending on it.


    The bottom line is, there’s almost always more at stake than you think.


    # No Harm to Structure


    You must not harm the structure of the code. You must keep the code clean and
    well organized.


    Ask yourself why the programmers at Knight Capital did not KNOW that their code
    could be harmful.


    I think the answer is pretty obvious. They had forgotten that the Power Peg software
    was still in the system. They had forgotten that the flag they repurposed would
    activate it. And they assumed that all servers would always have the same software
    running.


    They did not know their system could exhibit harmful behavior because of the harm
    they had done to the structure of the system by leaving that dead code in place.
    And that’s one of the big reasons why code structure and cleanliness are so important.
    The more tangled the structure, the more difficulty in knowing what the code will
    do. The more the mess, the more the uncertainty.


    Take the Toyota case, for example. Why didn’t the programmers know their software
    could kill people? Do you think the fact that they had more than ten thousand
    global variables might have been a factor?


    Making a mess in the software undermines your ability to know what the software
    does and therefore your ability to prevent harm.


    Messy software is harmful software.


    Some of you might object by saying that sometimes a quick and dirty patch is necessary
    to fix a nasty production bug.


    Sure. Of course. If you can fix a production crisis with a quick and dirty patch,
    then you should do it. No question.'
