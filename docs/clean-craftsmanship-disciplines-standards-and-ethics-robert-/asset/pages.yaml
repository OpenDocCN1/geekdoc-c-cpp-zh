  md: 'But something else has happened in the last 70 years. Programmers have gained
    something that I am sure Alan Turing never anticipated: notoriety.


    Back in the 1950s and 1960s, nobody knew what a programmer was. There weren’t
    enough of them to have a social impact. Programmers did not live next door to
    very many people.


    That started to change in the 1970s. By then, fathers were advising their sons
    (and sometimes their daughters) to get degrees in computer science. There were
    enough programmers in the world so that everybody knew somebody who knew one.
    And the image of the nerdy, twinkie-eating geek was born.


    Few people had seen a computer, but virtually everyone had heard about them. Computers
    showed up in TV shows such as *Star Trek* and movies such as *2001: A Space Odyssey*
    and *Colossus: The Forbin Project*. All too often in those shows, the computers
    were cast as villains. But in Robert Heinlein’s 1966 book *The Moon Is a Harsh
    Mistress*,⁴ the computer was the self-sacrificing hero.


    Notice, however, that in each of these cases, the programmer is not a significant
    character. Society didn’t know what to make of programmers back then. They were
    shadowy, hidden, and somehow insignificant compared to the machines themselves.


    I have fond memories of one television commercial from this era. A wife and her
    husband, a nerdy little guy with glasses, a pocket protector, and a calculator,
    were comparing prices at a grocery store. Mrs. Olsen described him as “a computer
    genius” and proceeded to school the wife and husband alike on the benefits of
    a particular brand of coffee.


    The computer programmer in that commercial was naive, bookish, and inconsequential.
    Someone smart, but with no wisdom or common sense. Not someone you’d invite to
    parties. Indeed, computer programmers were seen as the kind of people who got
    beaten up a lot at school.


    4. Robert Heinlein, *The Moon Is a Harsh Mistress* (Ace, 1966).


    By 1983, personal computers started to appear, and it was clear that teenagers
    were interested in them for lots of reasons. By this time, a rather large number
    of people knew at least one computer programmer. We were considered professionals
    but still mysterious.'
