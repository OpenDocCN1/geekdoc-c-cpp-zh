- pgno: 226
  md: 'This discipline pursues two goals. First, every function should do *one thing*.<sup>5</sup>
    Second, your code should read like *well-written prose*.<sup>6</sup>


    +   5. Martin, *Clean Code*, p. 7.

    +   6. Martin, p. 8.


    A function does *one thing* when no other function can be extracted from it. Therefore,
    in order that your functions all do *one thing*, you should extract and extract
    and extract until you cannot extract any more.


    This will, of course, lead to a plethora of little tiny functions. And this may
    disturb you. You may feel that so many little tiny functions will obscure the
    intent of your code. You may worry that it would be easy to get lost within such
    a huge swarm of functions.


    But the opposite happens. The intent of your code becomes much more obvious. The
    levels of abstraction become crisp and the lines between them clear.


    Remember that languages nowadays are rich with modules, classes, and namespaces.
    This allows you to build a hierarchy of names within which to place your functions.
    Namespaces hold classes. Classes hold functions. Public functions refer to private
    functions. Classes hold inner and nested classes. And so on. Take advantage of
    these tools to create a structure that makes it easy for other programmers to
    locate the functions you have written.


    And then choose good names. Remember that the length of a function’s name should
    be *inversely* proportional to the scope that contains it. The names of public
    functions should be relatively short. The names of private functions should be
    longer.


    As you extract and extract, the names of the functions will get longer and longer
    because the purpose of the function will become less and less general. Most of
    these extracted functions will be called from only one place, so their purpose
    will be extremely specialized and precise. The names of such specialized and precise
    functions must be long. They will likely be full clauses or even sentences.


    These functions will be called from within the parentheses of `while` loops and
    `if` statements. They will be called from within the bodies of those statements
    as well, leading to code that looks like this:'
