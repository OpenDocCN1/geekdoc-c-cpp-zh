    # Short Cycles


    Consider again how we began. How long was the cycle when source code was controlled
    by physically possessing a deck of cards?


    You checked the source code out by taking those cards out of the cabinet. You
    held on to those cards until you were done with your project. Then you committed
    your changes by putting the changed deck of cards back in the cabinet. The cycle
    time was the whole project.


    Then, when we used thumbtacks on the bulletin board, the same rule applied. You
    kept your thumbtacks in the modules you were changing until you were done with
    the project you were working on.


