  md: '# I The Disciplines


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_44_0.png)


    What is a discipline? A discipline is a set of rules that are composed of two
    parts: the essential part and the arbitrary part. The essential part is what gives
    the discipline its power; it is the reason that the discipline exists. The'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'arbitrary part is what gives the discipline its form and substance. The discipline
    cannot exist without the arbitrary part.


    For example, surgeons wash their hands before surgery. If you were to watch, you
    would see that the handwashing has a very particular form to it. The surgeon does
    not wash hands by simply soaping them under running water, as you and I might
    do. Rather, the surgeon follows a ritualized discipline of handwashing. One such
    routine I have seen is, in part, as follows:


    +   * Use the proper soap.

    +   * Use the appropriate brush.

    +   * For each finger, use

    +     * Ten strokes across the top.

    +     * Ten strokes across the left side.

    +     * Ten strokes across the underside.

    +     * Ten strokes across the right side.

    +     * Ten strokes across the nail.

    +   * And so on.


    The essential part of the discipline should be obvious. The surgeon’s hands must
    be made very clean. But did you notice the arbitrary part? Why ten strokes instead
    of eight or twelve? Why divide the finger into five sections? Why not three or
    seven sections?


    That’s all arbitrary. There is no real reason for those numbers other than that
    they were deemed to be sufficient.


    In this book, we study five disciplines of software craftsmanship. Some of these
    disciplines are five decades old. Some are just two decades old. But all have
    shown their usefulness over those decades. Without them, the very notion of software-as-a-craft
    would be virtually unthinkable.


    Each of these disciplines has its own essential and arbitrary elements. As you
    read, you may find your mind objecting to one or more of the disciplines. If this
    happens, be aware of whether the objection is about the essential elements of
    the disciplines or just the arbitrary elements. Don’t'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'allow yourself to be misdirected by the arbitrary elements. Keep your focus
    on the essential elements. Once you have internalized the essence of each discipline,
    the arbitrary form will be likely to diminish in importance.


    For example, in 1861, Ignaz Semmelweis published his findings for applying the
    discipline of handwashing for doctors. The results of his research were astounding.
    He was able to show that when doctors thoroughly washed their hands in chlorine
    bleach before examining pregnant women, the death rates of those women from subsequent
    sepsis dropped from one in ten to virtually zero.


    But the doctors of the day did not separate the essence from the arbitrary when
    reviewing Semmelweis’s proposed discipline. The chlorine bleach was the arbitrary
    part. The washing was the essence. They were repelled by the inconvenience of
    washing with bleach, and so they rejected the evidence of the essential nature
    of handwashing.


    It was many decades before doctors started actually washing their hands.


    # # Extreme Programming


    In 1970, Winston Royce published the paper that drove the waterfall development
    process into the mainstream. It took almost 30 years to undo that mistake.


    By 1995, software experts started considering a different, more incremental approach.
    Processes such as Scrum, feature-driven development (FDD), dynamic systems development
    method (DSDM), and the Crystal methodologies were presented. But little changed
    in the industry at large.


    Then, in 1999, Kent Beck published the book *Extreme Programming Explained* (Addison-Wesley).
    Extreme Programming (XP) built upon the ideas in those previous processes but
    added something new. XP added *engineering practices*.


    Enthusiasm grew exponentially for XP between 1999 and 2001. It was this enthusiasm
    that spawned and drove the Agile revolution. To this day, XP remains the best
    defined and most complete of all the Agile methods. The engineering practices
    at its core are the focus of this section on disciplines.'
