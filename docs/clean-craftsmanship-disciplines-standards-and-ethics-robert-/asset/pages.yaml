    SCCS worked on only one file at a time but allowed you to lock that file so that
    no one else could edit it until you were done. It was a life saver.


    In 1982, RCS, the Revision Control System, was created by Walter Tichy. It too
    was file based and knew nothing of projects, but it was considered an improvement
    over SCCS and rapidly became the standard source code control system of the day.


    Then, in 1986, CVS, the Concurrent Versions System, came along. It extended RCS
    to deal with whole projects, not just individual files. It also introduced the
    concept of *optimistic locking*.


    Up to this time, most source code control systems worked like my thumbtacks. If
    you had checked out the module, nobody else could edit it. This is called *pessimistic
    locking*.


    CVS used optimistic locking. Two programmers could check out and change the same
    file at the same time. CVS would try to merge any nonconflicting changes and would
    alert you if it couldn''t figure out how to do the merge.


    After that, source code control systems exploded and even became commercial products.
    Literally hundreds of them flooded the market. Some used optimistic locking, others
    used pessimistic locking. The locking strategy became a kind of religious divide
    in the industry.


    Then, in 2000, Subversion was created. It vastly improved upon CVS, and was instrumental
    in driving the industry away from pessimistic locking once and for all. Subversion
    was also the first source code control system to be used in the cloud. Does anybody
    remember Source Forge?


    Up to this point, all source code control systems were based on the master tape
    idea that I used back in my bulletin board days. The source code was maintained
    in a single central master repository. Source code was checked out from that master
    repository, and commits were made back into that master repository.'
