  md: "```\n}\n```\n\nYou’re probably already bored. This should be nothing new to\
    \ you by now. But bear with me—it’s about to get interesting. There’s a bit of\
    \ duplication in the tests already. We should get rid of it, so we factor out\
    \ the creating of the game into the `setup` function:\n\n[Click here to view code\
    \ image](#)\n\n```\npublic class BowlingTest {\n    private Game g;\n\n    @Before\n\
    \    public void setUp() throws Exception {\n        g = new Game();\n    }\n\
    }\n```\n\nThis makes the first test completely empty, so we delete it. The second\
    \ test is also pretty useless because it doesn’t assert anything. We delete it\
    \ as well. Those tests served their purpose. They were stairstep tests.\n\n> *Stairstep\
    \ tests:* Some tests are written just to force us to create classes or functions\
    \ or other structures that we’re going to need. Sometimes these tests are so degenerate\
    \ that they assert nothing. Other times they assert something very naive. Often\
    \ these tests are superseded by more comprehensive tests later and can be safely\
    \ deleted. We call these kinds of tests stairstep tests because they are like\
    \ stairs that allow us to incrementally increase the complexity to the appropriate\
    \ level.\n\nNext, we want to assert that we can score a game. But to do that,\
    \ we need to roll a complete game. Remember that the `score` function can be called\
    \ only after all the balls in a game are rolled.\n\nWe fall back on Rule 4 and\
    \ roll the simplest, most degenerate game we can think of:\n\n[Click here to view\
    \ code image](#)\n\n```\n@Test\npublic void gutterGame() throws Exception {\n\
    \    for (int i=0; i<20; i++)\n        g.roll(0);\n    assertEquals(0, g.score());\n\
    }\n```"
