- pgno: 296
  md: 'One of the most important things a programmer can say is “No!” Said at the
    right time, in the right context, this answer can save your employer massive amounts
    of money and prevent horrible failures and embarrassments.


    This is not a license to storm around saying no to everything. We are engineers;
    our job is to find a way to yes. But sometimes yes is not an option. We are the
    only ones who can determine this. We are the ones who know. Therefore, it is up
    to us to say no when the answer really is no.


    Let’s say your boss asks you to get something done by Friday. After giving it
    due consideration, you realize that there is no reasonable chance that you’ll
    complete the task by Friday. You must return to your boss and say “No.” You would
    be wise to also say that you can get it done by the following Tuesday, but you
    must be firm that Friday is out of the question.


    Managers often don’t like to hear no. They may push back on you. They may confront
    you. They may yell at you. Emotional confrontation is one of the tools that some
    managers employ.


    You must not give in to it. If the answer is no, then you must hold to that answer
    and not yield to the pressure.


    And be very wary of the “Will you at least try?” gambit. It seems so reasonable
    to be asked to try, doesn’t it? But it’s not reasonable at all because *you are
    already trying*. There’s nothing new you can do to change the no to yes, so saying
    you’ll try is just a lie.


    I expect that when the answer is no, you will say no.


