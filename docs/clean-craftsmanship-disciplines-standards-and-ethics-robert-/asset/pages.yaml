  md: 'making it impossible to prove an algorithm correct by enumeration or induction.


    Dijkstra recommended that, in order to keep code provable, it be constructed of
    three standard building blocks.


    +   - **Sequence**, which we depict as two or more statements ordered in time.
    This simply represents nonbranching lines of code.

    +   - **Selection**, depicted as two or more statements selected by a predicate.
    This simply represents `if/else` and `switch/case` statements.

    +   - **Iteration**, depicted as a statement repeated under the control of a predicate.
    This represents a `while` or `for` loop.


    Dijkstra showed that any program, no matter how complicated, can be composed of
    nothing more than these three structures and that programs structured in that
    manner are provable.


    He called the technique *structured programming*.


    Why is this important if we aren’t going to write those proofs? If something is
    provable, it means you can reason about it. If something is unprovable, it means
    you cannot reason about it. And if you can’t reason about it, you can’t properly
    test it.


    # Functional Decomposition


    In 1968, Dijkstra’s ideas were not immediately popular. Most of us were using
    languages that depended on `GOTO`, so the idea of abandoning `GOTO` or imposing
    discipline on `GOTO` was abhorrent.


    The debate over Dijkstra’s ideas raged for several years. We didn’t have an Internet
    in those days, so we didn’t use Facebook memes or flame wars. But we did write
    letters to the editors of the major software journals of the day. And those letters
    raged. Some claimed Dijkstra to be a god. Others claimed him to be a fool. Just
    like social media today, except slower.


    But in time, the debate slowed, and Dijkstra’s position gained increasing support
    until, nowadays, most of the languages we use simply don’t have a `GOTO`.'
