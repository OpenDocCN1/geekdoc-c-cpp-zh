- pgno: 379
  md: 'be very expensive.


    There are many techniques for estimating the subtasks at the leaves of the WBS
    tree. You could use function points or a similar complexity measure. But I’ve
    always found that these tasks are best estimated by raw gut feel.


    Typically, I do this by comparing the tasks to some other tasks that I’ve already
    completed. If I think it’s twice as hard, I multiply the time by two.


    Once you’ve estimated all the leaves of the tree, you just sum the whole tree
    up to get the mean for the project.


    And don’t worry overmuch about dependencies. Software is a funny material. Even
    though A depends on B, B often does not have to be done before A. You *can*, in
    fact, implement logout before you implement login.


    # Precision


    Every estimate is wrong. That’s why we call it an estimate. An estimate that is
    correct is not an estimate at all—it’s a fact.


    But even though the estimate is wrong, it may not be all that wrong. Part of the
    job of estimation, then, is to estimate how wrong the estimate is.


    My favorite technique for estimating how wrong an estimate is, is to estimate
    three numbers: the best case, the worst case, and the normal case.


    The normal case is how long you think the task would take you if the average number
    of things go wrong—if things go the way they *usually* do. Think of it like a
    gut-level call. The normal case is the estimate you would give if you were being
    realistic.


    The strict definition of a normal estimate is one that has a 50 percent chance
    of being too short or too long. In other words, you should miss half of your normal
    estimates.


    The worst-case estimate is the Murphy’s law estimate. It assumes that anything
    that can go wrong will go wrong. It is deeply pessimistic. The worst-case estimate
    has a 95 percent chance of being too long. In other words, you would only miss
    this estimate 1 in 20 times.'
