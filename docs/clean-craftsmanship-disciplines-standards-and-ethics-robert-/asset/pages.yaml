- pgno: 212
  md: "# # Constant → Variable\n\nThis transformation changes a constant into a variable.\
    \ We saw this in the stack kata (Chapter 2) when we created the `empty` variable\
    \ to hold the `true` value that `isEmpty` had been returning.\n\nClick here to\
    \ view code image\n\n```\n~~~java\npublic class Stack {\n    private boolean empty\
    \ = true;\n\n    public boolean isEmpty() {\n        return empty;\n    }\n  \
    \  ...\n}\n~~~\n```\n\nWe saw this again in prime factors when, in order to pass\
    \ the case for factoring 3, we replaced the constant 2 with the argument `n`.\n\
    \nClick here to view code image\n\n```\n~~~java\nprivate List<Integer> factorsOf(int\
    \ n) {\n  ArrayList<Integer> factors = new ArrayList<>();\n  if (n>1)\n    factors.add(n);\n\
    \  return factors;\n}\n~~~\n```\n\nAt this point, it should be obvious that every\
    \ one of these transformations, so far, moves the code from a very specific state\
    \ to a slightly more general state. Each of them is a generalization, a way to\
    \ make the code handle a wider set of constraints than before.\n\nIf you think\
    \ about it carefully, you’ll realize that each of these transformations widens\
    \ the possibilities much more than the constraint placed on the code by the currently\
    \ failing test. Thus, as these transformations are applied, one by one, the race\
    \ between the constraints of the tests and the generality of the code must end\
    \ in favor of the generalizations. Eventually, the production code will become\
    \ so general that it will pass all future constraints within the current requirements."
