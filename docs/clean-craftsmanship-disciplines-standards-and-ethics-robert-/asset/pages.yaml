    \ BigInteger fib(int n) {\n    if (n > 1)\n        return fib(n-1).add(fib(n-2));\n\
    \    else\n        return new BigInteger(\"1\");\n}\n\nprivate BigInteger fib(int\
    \ n) {\n    return fib(BigInteger.ONE, BigInteger.ONE, n);\n}\n\nprivate BigInteger\
    \ fib(BigInteger fm2, BigInteger fm1, int n) {\n    if (n>1)\n        return fib(fm1,\
    \ fm1.add(fm2), n-1);\n    else\n        return fm1;\n\n}\n\nprivate BigInteger\
