  md: '+   - I have a 50 percent chance of finishing before the next Friday.

    +   - I have a 95 percent chance of finishing before the Friday after that.


    An estimate like this provides a probability distribution that describes your
    uncertainty. Describing your uncertainty is what makes this estimate honest.


    You should provide estimates in this form when managers ask you to estimate large
    projects. For example, they may be trying to judge the cost of a project before
    they authorize it. That''s when this kind of honesty about uncertainty is most
    valuable.


    For smaller tasks, it is best to use the Agile practice of story points. Story
    points are honest because they do not commit to a timeframe. Rather, they describe
    the cost of a task in comparison to another. The numbers used are arbitrary, but
    relative.


    A story point estimate looks something like this:


    > *The Deposit story has a cost of 5.*


    What is that 5? It''s an arbitrary number of points that is relative to some task
    of known size. For example, let''s say that the Login story was arbitrarily given
    3 points. When you estimate the Deposit story, you decide that Deposit is not
    quite twice as hard as Login, so you give it a 5. That''s really all there is
    to it.


    Story points already have the probability distribution embedded within them. First,
    the points are not dates or times; they are just points. Second, the points are
    not promises; they are guesses. At the end of each Agile iteration (usually a
    week or two), we total the points completed. We use that number to estimate how
    many points we might complete in the next iteration.


    I expect honest estimates that describe your uncertainty. I do not expect a promise
    of a date.


