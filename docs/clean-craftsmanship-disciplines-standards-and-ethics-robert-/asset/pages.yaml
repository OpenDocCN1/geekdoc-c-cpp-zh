  md: 'Nowadays, we are all structured programmers because our languages don’t give
    us a choice. We all build our programs out of sequence, selection, and iteration.
    And very few of us make regular use of unconstrained GOTO statements.


    An unintended side effect of composing programs from those three structures was
    a technique called *functional decomposition*. Functional decomposition is the
    process whereby you start at the top level of your program and recursively break
    it down into smaller and smaller provable units. It is the reasoning process behind
    structured programming. Structured programmers reason from the top down through
    this recursive decomposition into smaller and smaller provable functions.


    This connection between structured programming and functional decomposition was
    the basis for the structured revolution that took place in the 1970s and 1980s.
    People like Ed Yourdon, Larry Constantine, Tom DeMarco, and Meilir Page-Jones
    popularized the techniques of structured analysis and structured design during
    those decades.


    # ## Test-Driven Development


    TDD, the red → green → refactor cycle, is functional decomposition. After all,
    you have to write tests against small bits of the problem. That means that you
    must functionally decompose the problem into testable elements.


    The result is that every system built with TDD is built from functionally decomposed
    elements that conform to structured programming. And that means the system they
    compose is provable.


    *And the tests are the proof.*


    Or, rather, the tests are the *theory*.


    The tests created by TDD are not a formal, mathematical proof, as Dijkstra wanted.
    In fact, Dijkstra is famous for saying that tests can only prove a program wrong;
    they can never prove a program right.


    This is where Dijkstra missed it, in my opinion. Dijkstra thought of software
    as a kind of mathematics. He wanted us to build a superstructure of postulates,
    theorems, corollaries, and lemmas.'
