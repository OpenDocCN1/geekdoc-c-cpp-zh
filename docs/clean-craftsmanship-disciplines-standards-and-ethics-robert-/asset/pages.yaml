    One day, probably not too long from now, some poor programmer is going to do something
    just a little dumb, and tens of thousands of people will die.


    This isn’t wild speculation—it’s just a matter of time.


    And when this happens, the politicians of the world will demand an accounting.
    They will demand that we show them how we will prevent such errors in the future.


    And if we show up without a statement of ethics, if we show up without any standards
    or defined disciplines, if we show up and whine about how our bosses set unreasonable
    schedules and deadlines—then we will be found GUILTY.


    # # The Oath


    To begin the discussion of our ethics as software developers, I offer the following
    oath.


    > *In order to defend and preserve the honor of the profession of computer programmers,
    I promise that, to the best of my ability and judgment:*


    +   1. *I will not produce harmful code.*

    +   2. *The code that I produce will always be my best work. I will not knowingly
    allow code that is defective either in behavior or structure to accumulate.*

    +   3. *I will produce, with each release, a quick, sure, and repeatable proof
    that every element of the code works as it should.*

    +   4. *I will make frequent, small releases so that I do not impede the progress
    of others.*'
