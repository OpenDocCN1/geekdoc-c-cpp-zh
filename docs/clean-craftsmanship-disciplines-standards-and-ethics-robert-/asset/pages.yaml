- pgno: 383
  md: 'One of the prime values you bring to the organization is your ability to know
    when the answer must be no. By saying no at those times, you will save your company
    untold grief and money.


    One last thing. Often, managers will try to cajole you into committing—into saying
    yes. Watch out for this.


    They might tell you that you aren''t being a team player or that other people
    have more commitment than you do. Don''t be fooled by those games.


    Be willing to work with them to find solutions, but don''t let them bully you
    into saying yes when you know you shouldn''t.


    And be very careful with the word try. Your boss might say something reasonable,
    like “Well, will you at least try?”


    The answer to this question is


    > > NO! I am already trying. How dare you suggest that I am not? I am trying as
    hard as I can, and there is no way I can try harder. There are no magic beans
    in my pocket with which I can work miracles.


    You might not want to use those exact words, but that''s exactly what you should
    be thinking.


    And remember this. If you say, “Yes, I’ll try,” then you are lying. Because you
    have no idea how you are going to succeed. You don''t have any plan to change
    your behavior. You said yes just to get rid of the manager. And that is fundamentally
    dishonest.


    # # Respect


    > > Promise 9. I will respect my fellow programmers for their ethics, standards,
    disciplines, and skill. No other attribute or characteristic will be a factor
    in my regard for my fellow programmers.


    We, software professionals, accept the weighty burden of our craft. We brave folks
    are men and women, straight and gay, black, brown, yellow, and white, republicans,
    democrats, religious believers, and atheists. We are humans, in all the many forms
    and varieties that humans come in. We are a community of mutual respect.'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'The only qualifications for entry into our community and for receiving the
    acceptance and the respect of each and every member of that community are the
    skills, disciplines, standards, and ethics of our profession. No other human attribute
    is worthy of consideration. No discrimination on any other basis can be tolerated.


    ’Nuff said.


    # Never Stop Learning


    > *Promise 10. I will never stop learning and improving my craft.*


    A programmer never stops learning.


    I’m sure you’ve heard it said that you should learn a new language every year.
    Well, you should. A good programmer should know a dozen or so languages.


    And not just a dozen varieties of the same language. Not just C, C++, Java, and
    C#. Rather, you should know languages from many different families.


    You should know a statically typed language like Java or C#. You should know a
    procedural language like C or Pascal. You should know a logic language like Prolog.
    You should know a stack language like Forth. You should know a dynamically typed
    language like Ruby. You should know a functional language like Clojure or Haskell.


    You should also know several different frameworks, several different design methodologies,
    and several different development processes. I don’t mean to say you should be
    an expert in all these things, but you should make a point to expose yourself
    to them at significantly more than a cursory level.


    The list of things you should similarly expose yourself to is virtually endless.
    Our industry has experienced rapid change over the decades, and that change is
    likely to continue for some time. You have to keep up with it.


    And that means you have to keep on learning. Keep reading books and blogs. Keep
    watching videos. Keep going to conferences and user groups. Keep going to training
    courses. Keep learning.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'Pay attention to the treasured works of the past. The books written in the
    1960s, 1970s, and 1980s are wonderful sources of insight and information. Don’t
    fall into the trap of thinking that all that old stuff is out of date. There is
    not much, in our industry, that actually goes out of date. Respect the effort
    and accomplishments of those who came before you, and study their advice and conclusions.


    And don’t fall into the trap of thinking that it is your employer’s job to train
    you. This is *your career*—you have to take responsibility for it. It is your
    job to learn. It is your job to figure out what you should be learning.


    If you are lucky enough to work for a company that will buy you books and send
    you to conferences and training classes, then take full advantage of those opportunities.
    If not, then pay for those books, conferences, and courses yourself.


    And plan to spend some time at this. Time every week. You owe your employer 35
    to 40 hours per week. You owe your career another 10 to 20.


    That’s what professionals do. Professionals put in the time to groom and maintain
    their careers. And that means you should be working 50 to 60 hours per week total.
    Mostly at work, but a lot at home too.'
  merge: -1
