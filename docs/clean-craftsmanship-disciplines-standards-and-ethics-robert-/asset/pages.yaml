  md: 'window. The presenter does as much as possible toward that end, allowing us
    to make the GUI absurdly small.


    So, for example, the presenter is the module that determines the state of every
    button and menu item. It specifies their names and whether or not they should
    be grayed out. If the name of a button changes based on the state of a window,
    it is the presenter that knows that state and changes that name. If a grid of
    numbers should appear on the screen, it is the presenter that creates a table
    of strings, all properly formatted and arranged. If there are fields that should
    have special colors or fonts, it is the presenter that determines those colors
    and fonts.


    The presenter takes care of all of that detailed formatting and arrangement and
    produces a simple data structure full of strings and flags that the GUI can use
    to build the commands that get sent to the screen. And, of course, that makes
    the GUI very small indeed.


    The data structure created by the presenter is often called a *view model*.


    In the diagram in Figure 4.2, the interactor is responsible for telling the presenter
    what data should be presented to the screen. This communication will be in the
    form of one or more data structures passed to the presenter through a set of functions.
    The actual presenter is shielded from the interactor by the presenter interface.
    This prevents the high-level interactor from depending on the implementation of
    the lower-level presenter.


