  md: '![](img/7b01f9dd5d5d33f16ee27a44427cd56e_178_0.png)


    **Figure 4.3 Testing the GUI**


    The GUI framework communicates with a controller through an `EventHandler` interface.
    This makes sure that the controller has no transitive source code dependency on
    the GUI framework. The job of the controller is to gather the necessary events
    from the GUI framework into a pure data structure that I have here called the
    `RequestModel`.


    Once the `RequestModel` is complete, the controller passes it through the `InputBoundary`
    interface to the interactor. Again, the interface is there to ensure that the
    source code dependencies point in an architecturally sound direction.


    Testing the interactor is trivial; our tests simply create appropriate request
    models and hand them to the interactor. We can either check the results directly
    or use spies to check them. Testing the controller is also trivial—our tests simply
    invoke events through the event handler interface and then make sure that the
    controller builds the right request model.'
