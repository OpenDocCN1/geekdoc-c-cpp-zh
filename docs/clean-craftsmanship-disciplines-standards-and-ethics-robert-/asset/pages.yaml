- pgno: 23
  md: '# # Foreword


    I remember meeting Uncle Bob in the spring of 2003, soon after Scrum was introduced
    to our company and technology teams. As a skeptical, fledgling ScrumMaster, I
    remember listening to Bob teach us about TDD and a little tool called FitNesse,
    and I remember thinking to myself, “Why would we *ever* write test cases that
    fail first? Doesn’t testing come *after* coding?” I often walked away scratching
    my head, as did many of my team members, and yet to this day I distinctly remember
    Bob’s palpable exuberance for code craftsmanship like it was only yesterday. I
    recall his directness one day as he was looking at our bug backlog and asking
    us why on earth we would make such poor decisions about software systems that
    we did not in fact own—“These systems are *company assets*, not your own *personal
    assets*.” His passion piqued our curiosity, and a year and half later, we had
    refactored our way to about 80 percent automated test coverage and a clean code
    base that made pivoting much easier, resulting in much happier customers—and happier
    teams. We moved lightning fast after that, wielding our definition of *done* like
    armor to protect us from the always-lurking code goblins; we had learned, in essence,
    how to protect us from ourselves. Over time, we developed a warmth for Uncle Bob,
    who came to truly feel like an uncle to us—a warm, determined, and courageous
    man who would over time help us learn to stand up for ourselves and do what was
    right. While some kids’ Uncle Bobs taught them how to ride bicycles or fish, our
    Uncle Bob taught us to not compromise our integrity—and to this day, the ability
    and desire to show up to every situation with courage and curiosity has been the
    best lesson of my career.'
  merge: -1
  img_proc: true
