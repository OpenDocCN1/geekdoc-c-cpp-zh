  img_proc: true
- pgno: 253
  md: '+   3. No duplication.

    +   4. Fewest elements.


    In this book I express the first rule as


    +   1. *Covered by tests.*


    Notice how the emphasis of that first rule has changed over the years. The first
    rule split in two and the last two rules merged into one. Notice also that, as
    the years went by, tests grew in importance from communication to coverage.


    # # Coverage


    The concept of tests coverage is an old one. The first mention I was able to find
    goes all the way back to 1963.<sup>7</sup> The article begins with two paragraphs
    that I think you’ll find interesting, if not evocative.


    7. Joan Miller and Clifford J Maloney, “Systematic Mistake Analysis of Digital
    Computer Programs,” *Communications of the ACM* 6, no. 2 (1963): 58–63.


    > *Effective program checkout is imperative to any complex computer program. One
    or more test cases are always run for a program before it is considered ready
    for application to the actual problem. Each test case checks that portion of the
    program actually used in its computation. Too often, however, mistakes show up
    as late as several months (or even years) after a program has been put into operation.
    This is an indication that the portions of the program called upon only by rarely
    occurring input conditions have not been properly tested during the checkout stage.*


    > *In order to rely with confidence upon any particular program it is not sufficient
    to know that the program works most of the time or even that it has never made
    a mistake so far. The real question is whether it can be counted upon to fulfill
    its functional specifications successfully every single time. This means that,
    after a program has passed the checkout stage, there should be no possibility
    that an unusual combination of input data or conditions may bring to light an
    unexpected mistake in the program. Every portion of the program must be utilized
    during checkout in order that its correctness be confirmed.*


    Nineteen sixty-three was only seventeen years after the very first program ran
    on the very first electronic computer,<sup>8</sup> and already we knew that the
    only way to effectively mitigate the threat of software errors is to test every
    single line of code.


    8. Presuming that the first computer was the Automated Computing Engine and that
    the first program executed in 1946.'
