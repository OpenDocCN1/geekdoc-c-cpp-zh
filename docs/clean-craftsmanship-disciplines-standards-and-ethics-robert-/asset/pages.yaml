- pgno: 36
  md: 'showed some reasoned thought. It was DaVinci who realized that flight could
    be possible because air resistance works in both directions. The resistance caused
    by pushing down on the air creates lift of the same amount. This is the mechanism
    by which all modern airplanes fly.


    DaVinci’s ideas were lost until the middle of the eighteenth century. But then
    began an almost frantic exploration into the possibility of flight. The eighteenth
    and nineteenth centuries were a time of intense aeronautical research and experimentation.
    Unpowered prototypes were built, tried, discarded, and improved. The science of
    aeronautics began to take shape. The forces of lift, drag, thrust, and gravity
    were identified and understood. Some brave souls made the attempt.


    And some crashed and died.


    In the closing years of the eighteenth century, and for the half century that
