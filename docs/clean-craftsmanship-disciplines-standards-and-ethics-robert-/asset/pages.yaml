- pgno: 276
  md: '![](img/7b01f9dd5d5d33f16ee27a44427cd56e_276_0.png)


    As your new CTO, I expect that we will never ship S**T.


    I’m sure you know what S**T stands for. As your CTO, I expect that *we will not
    ship S**T.*


    Have you ever shipped S**T? Most of us have. I have. It didn’t feel good. I didn’t
    like it. The users didn’t like it. The managers didn’t like it. *Nobody* liked
    it.


    So why do we do it? Why do we ship S**T?


    Because somehow or another, we decided that we had no choice. Perhaps it was a
    deadline that we just absolutely had to meet. Maybe it was an estimate that we
