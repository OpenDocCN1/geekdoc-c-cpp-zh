  md: '# Test Patterns


    There are many different design patterns for testing, and there are several books
    that have documented them: *XUnit Test Patterns*⁴ by Gerard Meszaros and *JUnit
    Recipes*⁵ by J. B. Rainsberger and Scott Stirling, to mention just two of them.


    +   4. Gerard Meszaros, *XUnit Test Patterns: Refactoring Test Code* (Addison-Wesley,
    2012).

    +   5. J. B. Rainsberger and Scott Stirling, *JUnit Recipes: Practical Methods
    for Programmer Testing* (Manning, 2006).


    It is not my intention to try to document all those patterns and recipes here.
    I just want to mention the three that I have found most useful over the years.


    # Test-Specific Subclass


    This pattern is primarily used as a safety mechanism. For example, let’s say that
    you want to test the `align` method of the `XRay` class. However, the `align`
    method invokes the `turnOn` method. You probably don’t want x-rays turned on every
    time you run the tests.


    The solution, as shown in Figure 4.4, is to create a *test-specific subclass*
    of the `XRay` class that overrides the `turnOn` method to do nothing. The test
    creates an instance of the `SafeXRay` class and then calls the `assign` method,
    without having to worry that the x-ray machine will actually be turned on.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '**Figure 4.4** Test-Specific-Subclass pattern


    It is often helpful to make the test-specific subclass a spy so that the test
    can interrogate the safe object about whether the unsafe method was actually called
    or not.


    In the example, if `SafeXRay` were a spy, then the `turnOn` method would record
    its invocation, and the test method in the `XRayTest` class could interrogate
    that record to ensure that `turnOn` was actually called.


    Sometimes the *Test-Specific Subclass* pattern is used for convenience and throughput
    rather than safety. For example, you may not wish the method being tested to start
    a new process or perform an expensive computation.


    It is not at all uncommon for the dangerous, inconvenient, or slow operations
    to be extracted into new methods for the express purpose of overriding them in
    a test-specific subclass. This is just one of the ways that tests impact the design
    of the code.


    # ## Self-Shunt


    A variation on that theme is the *Self-Shunt* pattern. Because the test class
    *is* a class, it is often convenient for the test class to become the test-specific
    subclass, as shown in Figure 4.5.


    ![](img/7b01f9dd5d5d33f16ee27a44427cd56e_180_0.png)


    **Figure 4.5** Self-Shunt pattern'
