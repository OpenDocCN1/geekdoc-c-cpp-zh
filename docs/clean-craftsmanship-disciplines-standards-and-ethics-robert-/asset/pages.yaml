  md: 'Several promises in the oath are related to harm.


    # # First, Do No Harm


    *Promise 1. I will not produce harmful code.*


    The first promise of the software professional is DO NO HARM! That means that
    your code must not harm your users, your employers, your managers, or your fellow
    programmers.


    You must know what your code does. You must know that it works. And you must know
    that it is clean.


    Some time back, it was discovered that some programmers at Volkswagen wrote some
    code that purposely thwarted Environmental Protection Agency (EPA) emissions tests.
    Those programmers wrote harmful code. It was harmful because it was deceitful.
    That code fooled the EPA into allowing cars to be sold that emitted twenty times
    the amount of harmful nitrous oxides that the EPA deemed safe. Therefore, that
    code potentially harmed the health of everyone living where those cars were driven.


    What should happen to those programmers? Did they know the purpose of that code?
    Should they have known?


    I’d fire them and prosecute them because, whether they knew or not, they *should*
    have known. Hiding behind requirements written by others is no excuse. It’s your
    fingers on the keyboard, it’s your code. You must know what it does!


    That’s a tough one, isn’t it? We write the code that makes our machines work,
    and those machines are often in positions to do tremendous harm. Because we will
    be held responsible for any harm our code does, we must be responsible for knowing
    what our code will do.


    Each programmer should be held accountable based on their level of experience
    and responsibility. As you advance in experience and position, your responsibility
    for your actions and the actions of those under your charge increases.


    Clearly, we can’t hold junior programmers as responsible as team leads. We can’t
    hold team leads as responsible as senior developers. But those senior'
