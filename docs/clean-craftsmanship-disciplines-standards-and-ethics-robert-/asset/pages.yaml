- pgno: 61
  md: 'not a lot of fun, is it?


    It’s not fun because by the time we start writing after-the-fact tests, we already
    know the system works. We’ve tested it manually. We are only writing the tests
    out of some sense of obligation or guilt or, perhaps, because our management has
    mandated some level of test coverage. So, we begrudgingly bend into the grind
    of writing one test after another, knowing that each test we write will pass.
    Boring, boring, boring.


    Inevitably, we come to the test that’s hard to write. It is hard to write because
    we did not design the code to be testable; we were focused instead on making it
    work. Now, in order to test the code, we’re going to have to change the design.


    But that’s a pain. It’s going to take a lot of time. It might break something
    else. And we already know the code works because we tested it manually. Consequently,
    we walk away from that test, leaving a hole in the test suite. Don’t tell me you’ve
    never done this. You know you have.


    You also know that if you’ve left a hole in the test suite, everybody else on
    the team has too, so you know that the test suite is full of holes.


    The number of holes in the test suite can be determined by measuring the volume
    and duration of the laughter of the programmers when the test suite passes. If
    the programmers laugh a lot, then the test suite has a lot of holes in it.


    A test suite that inspires laughter when it passes is not a particularly useful
    test suite. It may tell you when certain things break, but there is no decision
    you can make when it passes. When it passes, all you know is that some stuff works.


    A good test suite has no holes. A good test suite allows you to make a decision
    when it passes. That decision is to *deploy*.


    If the test suite passes, you should feel confident in recommending that the system
    be deployed. If your test suite doesn’t inspire that level of confidence, of what
    use is it?


    # ***Fun***'
