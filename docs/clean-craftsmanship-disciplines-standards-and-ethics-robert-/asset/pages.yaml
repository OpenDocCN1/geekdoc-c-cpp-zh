  md: 'general procedure for deriving the algorithms that solve the problems that
    *can* be solved.


    +   3. This was Hilbert''s “decidability problem.” He asked whether there was
    a generalized way to prove that any given Diophantine equation was solvable. A
    Diophantine equation is a mathematical function with integer inputs and outputs.
    A computer program is also a mathematical function with integer inputs and outputs.
    Therefore, Hilbert''s question can be described as pertaining to computer programs.


    # ## The Bowling Game


    In 1999, Bob Koss and I were together at a C++ conference. We had some time to
    kill, so we decided to practice this new idea of TDD. We chose the simple problem
    of computing the score of a game of bowling.


    A game of bowling consists of ten frames. In each frame, the player is given two
    attempts to roll a ball toward ten wooden pins in order to knock them down. The
    number of pins knocked down by a ball is the score for that ball. If all ten pins
    are knocked down by the first ball, it is called a *strike*. If knocking all ten
    pins down requires both balls, then it is called a *spare*. The dreaded gutter
    ball (Figure 2.3) yields no points at all.'
