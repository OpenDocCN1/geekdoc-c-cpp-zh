    And what we’ve learned over the last seven decades of software is that the way
    you go fast is to go well.


    The *only* way to go fast is to go well.


    So, you keep your code clean. You keep your designs clean. You write semantically
    stable tests and keep your coverage high. You know and use appropriate design
    patterns. You keep your methods small and your names precise.


    But those are all *indirect* methods of achieving productivity. Here, we’re going
    to talk about much more direct ways to keep productivity high.


    +   1. Viscosity—keeping your development environment efficient

    +   2. Distractions—dealing with every day business and personal life'
