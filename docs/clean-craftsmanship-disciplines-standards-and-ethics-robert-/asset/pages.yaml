- pgno: 185
  md: 'One of the issues that plagues programmers who are new to TDD is the problem
    of fragile tests. A test suite is fragile when small changes to the production
    code cause many tests to break. The smaller the change to the production code,
    and the larger the number of broken tests, the more frustrating the issue becomes.
    Many programmers give up on TDD during their first few months because of this
    issue.


    Fragility is always a design problem. If you make a small change to one module
    that forces many changes to other modules, you have an obvious design problem.
    In fact, breaking many things when something small changes *is the definition*
    of poor design.


    Tests need to be designed just like any other part of the system. All the rules
    of design that apply to production code also apply to tests. Tests are not special
    in that regard. They must be properly designed in order to limit their fragility.


    Much early guidance about TDD ignored the design of tests. Indeed, some of that
    guidance recommended structures that were counter to good design and led to tests
    that were tightly coupled to the production code and therefore very fragile.


    # The One-to-One Correspondence


    One common and particularly detrimental practice is to create and maintain a one-to-one
    correspondence between production code modules and test modules. Newcomers to
    TDD are often erroneously taught that for every production module or class named
    χ, there should be a corresponding test module or class named χTest.


    This, unfortunately, creates a powerful structural coupling between the production
    code and the test suite. That coupling leads to fragile tests. Any time the programmers
    want to change the module structure of the production code, they are forced to
    also change the module structure of the test code.


    Perhaps the best way to see this structural coupling is visually ([Figure 4.7](#)).'
