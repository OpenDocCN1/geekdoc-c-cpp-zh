    It also sends the list of selectable `Order` objects for the menu.


    The presenter’s job is to turn everything into strings and flags and load them
    into the `Presentation`. The `Money` and `Date` objects are converted into locale-specific
    strings. The `Order` objects are converted into ID strings. The names of the two
    buttons are loaded as strings. If one or more of the buttons should be grayed
    out, an appropriate flag is set in the `Presentation`.


    The end result is that the `HumbleView` has nothing more to do than transport
    those strings across the boundary along with the metadata implied by the flags.
    Again, the goal is to make the `HumbleView` too simple to need testing.


    It should be clear that this strategy will work for any kind of boundary crossing,
    not just displays.


