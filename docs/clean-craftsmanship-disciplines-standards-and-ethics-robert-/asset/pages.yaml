  md: 'The source code is not stored on disk. It’s not “in the computer.” Your source
    code is, literally, in your hand.


    What is the source code control system? It is your desk drawer.


    When you literally possess the source code, there is no need to “control” it.
    Nobody else can touch it.


    And this was the situation throughout much of the 1950s and 1960s. Nobody even
    dreamed of something like a source code control system. You simply kept the source
    code under control by putting it in a drawer or a cabinet.


    If anyone wanted to “check out” the source code, they simply went to the cabinet
    and took it. When they were done, they put it back.


    We certainly didn’t have merge problems. It was physically impossible for two
    programmers to be making changes to the same modules at the same time.


    But things started to change in the 1970s. The idea of storing your source code
    on magnetic tape or even on disk was becoming attractive. We wrote line editing
    programs that allowed us to add, replace, and delete lines in source files on
    tape. These programs weren’t screen editors. We *punched* our add, change, and
    delete directives on cards. The editor would read the source tape, apply the changes
    from the edit deck, and write the new source tape.


    You may think this sounds awful. Looking back on it—it was. But it was better
    than trying to manage programs on cards! I mean 6,000 lines of code on cards weighs
    30 pounds. What would you do if you accidentally dropped those cards and watched
    as they spread all over the floor and under furniture and down into heating vents?


    If you drop a tape, you can just pick it up again.


    Anyway, notice what happened. We started with one source tape, and in the editing
    process, we wound up with a second, new source tape. But the old tape still existed.
    If we put that old tape back on the rack, someone else might inadvertently apply
    their own changes to it, leaving us with a merge problem.'
