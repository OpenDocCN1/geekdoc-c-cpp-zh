  md: '# # What Is an Algorithm?


    "Algorithm" sounds like a big word, but it just means a series of steps, like
    those of a recipe.


    Computers use algorithms to complete all the tasks we need them to do. We have
    to give computers clear instructions in the algorithms, so they understand what
    to do.


    5. Brush top and bottom teeth for 2 minutes.


    6. Spit out toothpaste.


    7. Rinse toothbrush.


    8. Put toothbrush back in holder.


    DATA DUCK


    A computer will use an algorithm to play a movie, search the Internet, or make
    a phone call.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_0.png)


    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_1.png)


