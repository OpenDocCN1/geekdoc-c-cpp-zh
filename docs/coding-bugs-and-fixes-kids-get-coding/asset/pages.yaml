  md: '# Loop the Loop


    Sometimes, we need computers to do a task over and over again. We call these sorts
    of instructions loops.


    We repeat tasks every day. When we walk to school, we repeatedly put one foot
    in front of the other. When we pedal our bikes, we move our feet round and round.
    To tell a computer to do these things, we can use loops.


    # DATA DUCK


    We use loops whenever there''s an action or instruction we want to repeat. For
    example, I need a loop to be able to walk all the way across the screen.


    On page 10, we had to tell the duck to "move 10 steps" five times to get it to
    move across the page. Another way to do this is to put one instruction inside
    a loop, like below:


    ```

    repeat 4 times

    move 10 steps

    ```


    Go to blueshiftcoding.com/kidsgetcoding for more practice with loops!'
