- img_proc: true
  md: '# Computers Everywhere


    Computers are all around us and come in all shapes and sizes. We can use computers
    to help us do do things, such as make phone calls, pay for groceries, and do homework.


    Computers are machines, so they aren''t very smart on their own. They need instructions
    to be able to do their tasks. This book will teach you all about how to give computers
    instructions.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_5_0.png)'
  merge: -1
  pgno: 5
