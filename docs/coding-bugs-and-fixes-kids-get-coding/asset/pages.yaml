  md: '# # Make a Move


    Algorithms are written in code. This is a kind of language that computers can
    understand.


    When we animate a character on a computer, we use code in the algorithm. It tells
    the computer where the character should be on the screen.


    To make the character move, we need to change the character''s position over and
    over again.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_11_0.png)


    +   move 10 steps


    +   move 90 steps


    +   move 10 steps


    +   move 10 steps


    +   move 10 steps


    > DATA DUCK

    The things that we can change in the algorithm, such as size, color, and position,
    are called variables.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_11_1.png)


    If we want to change a character''s size, color, or position, we have to change
    the code.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_11_2.png)'
