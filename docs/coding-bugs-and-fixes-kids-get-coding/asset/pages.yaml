  md: '# Search and Sort


    Algorithms can also be used to help search for information and sort through it.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_0.png)


    For example, a computer can put names in alphabetical order. The computer uses
    the alphabet to compare letters to see if they come before or after other letters.


    > DATA DUCK

    Algorithms that sort information have two simple parts:

    1. Data to be sorted.

    2. A rule for sorting the data.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_1.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Friend Sorting


    Can you sort your friends using a simple rule? Follow these easy steps to search
    and sort out information about your friends, just like a computer!


    +   1. Write down the names of eight of your friends.


    +   2. Cut up the names and put them in an envelope.


    +   3. Pull out one name at a time and put the names in alphabetical order.


    +   4. Can you think of other ways you might order your friends? For example,
    would you sort by height or by age?'
