  md: '# Getting Started


    Hi, I''m Data Duck! I''m here to help you learn

    all about algorithms and bugs. We''re going to

    have lots of fun with activities too!


    An algorithm is a simple set of instructions

    that tells a computer what to do. We''re

    going to learn how to make algorithms,

    how to try them out, and how to fix them.


    DATA DUCK

    Here are some key

    terms you will learn

    about in this book.

    Try saying them

    out loud:


    +   - algorithm

    - sequence

    - code

    - loop

    - debug


    There are lots of activities in the book for you to try out. There are also

    some activities for you to practice with too. For the online activities

    go to www.blueshiftcoding.com/kidsgetcoding and look for the activity

    with the page number from the book.'
  merge: -1
