    活动答案 23

    索引 24


    ![](img/1b6ae612dcebd27ea092d53714901ffe_3_0.png)


    # 开始学习


    你好，我是数据鸭子！我在这里帮助你学习所有关于算法和 Bug 的知识。我们将通过很多活动玩得很开心！


    算法是一组简单的指令集，告诉计算机要做什么。我们将学习如何制作算法、如何测试它们以及如何修复它们。


    数据鸭子

    这里是你将在书中书中学到的一些术语。试着大声读出来：


    - 算法 (algorithm)

    - 序列 (sequence)

    - 代码 (code)

    - 循环 (loop)

    - 调试 (debug)


    书中有很多活动供你尝试。还有一些活动是供你练习的。在线活动请访问 www.blastcoding.com/kidscoding，并根据书中的页码寻找寻找寻找与书中页码对应的活动。


    # 无处不在的计算机


    计算机环绕在我们身边，形状大小各异。我们可以用计算机帮助我们做事情，如打电话、买东西和做作业。


    计算机是机器，所以它们本身并不聪明。它们需要指令才能完成任务。这本书将教你所有关于如何指令的知识。


    ![](img/1b6ae612dcebd27ea092d53714901ffe_5_0.png)


    数据鸭子

    计算机的指令存储在它的内存中。


    # 你能看到什么？


    能在这些页面上发现五种不同的计算机吗？它们各是用来做什么？翻到第23页查看答案。


    # 什么是算法？


    “算法”听起来是一个很大的词，但它只是指一系列步骤，就像菜谱步骤一样。


    计算机使用算法来完成我们需要它们执行的所有任务。我们必须在算法中给计算机清晰的指令，这样它们才知道要做什么。


    5. 刷上下牙2分钟。

    6. 吐掉牙膏。

    7. 清洗刷牙。

    8. 把刷牙放回架子上。


    数据鸭子

    计算机将使用算法播放电影、搜索互联网或打电话。


    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_0.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_1.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_2.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_3.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_4.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_5.png)


    我们使用算法来完成各种日常工作。刷牙的算法可能看起来像这样：


    1. 取开牙膏盖。

    2. 拿起刷牙。

    3. 弄湿刷牙。

    4. 在刷牙上挤上豌豆大小的牙膏。

    9. 盖上牙膏盖。


    # 写一个算法


    尝试写一个为上学做准备的算法。你需要考虑从醒来到出门所的所有事情。翻到第23页查看示例。


    # 顺序，顺序！


    算法的步骤需要按照正确的顺序才能生效。算法中步骤的顺序被称为序列。


    当我们写算法时，我们必须确保步骤顺序正确。例如，当我们穿衣服时，如果我们在穿袜子之前穿鞋，那就太蠢了！


    数据鸭子

    如果算法的步骤顺序错误，算法将无法工作！


    ![](img/1b6ae612dcebd27ea092d53714901ffe_9_0.png)


    # 饼干算法


    数据鸭子写了一个算法来帮助他制作最喜欢的巧克力饼干，但他把步骤顺序全搞乱了。你能把步骤按正确顺序排列吗？翻到第23页查看答案。


    混合黄油和糖。然后加入鸡蛋和面粉。![](img/1b6ae612dcebd27ea092d53714901ffe_10_0.png) 混合在一起。抹油烤盘。![](img/1b6ae612dcebd27ea092d53714901ffe_10_1.png)
    在烤盘上放上一勺豌豆大小的混合物。![](img/1b6ae612dcebd27ea092d53714901ffe_10_2.png) 烤10分钟。![](img/1b6ae612dcebd27ea092d53714901ffe_10_3.png)
    关烤箱。![](img/1b6ae612dcebd27ea092d53714901ffe_10_4.png) 享受吧！


    # 移动


    算法是用来代码编写的。为了让角色移动，我们需要在算法中告诉它在屏幕上做什么。为了让它移动，我们需要重复执行：


    - 移动一下

    - 移动一下

    - 移动一下


    数据鸭子

    算法中可以改变的东西（如尺寸、位置）被称为变量。![](img/1b6ae612dcebd27ea092d53714901ffe_11_1.png) 当我们想要改变尺寸或位置时，我们需要代码。![](img/1b6ae612dcebd27ea092d53714901ffe_11_2.png)


    # 发现变量


    你能在这些页面上发现四种不同的变量吗？它们各是用来做什么的？![](img/1b6ae612dcebd27ea092d53714901ffe_12_0.png)
    仔细观察这两张图片。你能找到其中的四个变量吗？![](img/1b6ae612dcebd27ea092d53714901ffe_12_1.png) 翻到第23页查看答案。![](img/1b6ae612dcebd27ea092d53714901ffe_12_2.png)


    # 循环


    有时，我们需要计算机重复执行某项任务。我们把这些指令称为循环。当我们走路时，我们的脚在交替。当我们骑自行车时，我们的脚在转动。为了让计算机重复执行这些事情，我们可以使用循环。


    数据鸭子

    当有需要重复的操作或指令时，我们就使用循环。例如，为了让它穿过屏幕，我们在第10页让它“移动10步”。另一种方法是把指令放在循环中，如下：


    ```

    重复 4 次

    移动10步

    ```


    访问 blastcoding 进行更多循环练习！


    # 果酱三明治


    想象你在一家三明治店工作，需要反复制作同一种三明治。编写制作果酱三明治的指令。如果你要制作十个三明治，你会把哪些步骤放在循环里？


