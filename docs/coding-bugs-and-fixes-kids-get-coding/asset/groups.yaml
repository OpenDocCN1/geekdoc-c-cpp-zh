    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_3.png)


    # Search and Sort


    Algorithms can also be used to help search for information and sort through it.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_0.png)


    For example, a computer can put names in alphabetical order. The computer uses
    the alphabet to compare letters to see if they come before or after other letters.


    > DATA DUCK

    Algorithms that sort information have two simple parts:

    1. Data to be sorted.

    2. A rule for sorting the data.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_1.png)


    # Friend Sorting


    Can you sort your friends using a simple rule? Follow these easy steps to search
    and sort out information about your friends, just like a computer!


    1. Write down the names of eight of your friends.

    2. Cut up the names and put them in an envelope.

    3. Pull out one name at a time and put the names in alphabetical order.

    4. Can you think of other ways you might order your friends? For example, would
    you sort by height or by age?


    # Catching the Bug


    Algorithms are very useful, but sometimes they don''t work and we need to find
    out why. Problems with algorithms are called bugs.


    When a programmer reads through an algorithm to find errors and fix them, it is
    called debugging. Errors might be that a step is missing or that part of the sequence
    is in the wrong order.


    > DATA DUCK

    When computers were first invented, they were enormous! One day, one of these
    big computers wouldn''t work. When scientists took it apart, they found a moth
    inside! Some people say this is why we use the word computer "bug."


    ![](img/1b6ae612dcebd27ea092d53714901ffe_21_0.png)


    # Bed Bugs


    Have a look at this algorithm for getting ready for bed. There are two bugs in
    this algorithm. Can you find them?


    1. Put on pajamas.

    2. Brush teeth.

    4. Get into bed.

    3. Put on pajamas.

    6. Read story.

    7. Go to sleep.

    5. Turn off light.


    Go to code.com/kids and look at debugging exercises for more practice.


    # Extension Activities


    - creating algorithms

    - using variables

    - using loops

    - predicting outcomes

    - creating "if statements"

    - debugging


    # Words to Remember


    **animate:** to give the appearance that something on screen has come to life

    **bug:** an error in a computer program

    **debugging:** to find and remove bugs or errors in a computer program

    **loop:** a series of steps with the final step connected to the first step, steps
    are repeated

    **memory:** a way of storing information in a computer

    **sequence:** a particular order in which steps follow another

    **variable:** something that can be changed or adapted


