    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_1.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_2.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_3.png)


    # 搜索与排序


    算法也可以用于帮助搜索信息并对其进行排序。


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_0.png)


    例如，计算机可以按照字母顺序排列名字。计算机使用字母表来比较字母，查看它们是在其他字母之前还是之后。


    > 数据鸭

    对信息排序算法有两个简单的部分：

    1. 待排序的数据。

    2. 排序数据的规则。


    ![](img/1b6ae612dcebd27ea092d53714901ffe_19_1.png)


    # 朋友排序


    你能用简单的规则给你的朋友进行排序吗？遵循这些简单的步骤来搜索并排序朋友的信息，就像计算机一样！


    1. 写下八个朋友的名字。

    2. 将名字剪开并放入信封。

    3. 每次取出一个名字并按字母顺序排列。

    4. 你能想出其他排序朋友的方法吗？例如，按身高或年龄？


    # 寻找虫虫


    算法非常有用，但有时它们无法正常工作，我们需要找出原因。算法的问题被称为“bug”（虫错误）。


    当程序员阅读算法以寻找错误并修复它们时，这被称为“调试”（debugging）。错误可能是缺少了步骤，或者是步骤的顺序错了。


    > 数据鸭

    当计算机被发明时，它们是是巨大的！有一天，其中一台大机器无法工作了。当科学家将其拆开时，发现里面有一只蛾子（moth）！这就是我们使用“bug”这个词的原因。


    ![](img/1b6ae612dcebd27ea092d53714901ffe_21_0.png)


    # 床虫


    看看这个睡觉的算法。这个算法里有两个 bug。你能找到它们吗？


    1. 穿睡衣。

    2. 刷牙。

    3. 穿睡衣。

    4. 上床。

    5. 关灯。

    6. 睡觉。


    访问 code.com/kids 查看更多练习。


    # 扩展活动


    - 创建算法

    - 使用变量

    - 使用循环

    - 预测结果

    - 创建“if 语句”

    - 调试


    # 记忆词汇


    **animate**动画：让屏幕上的东西活起来。

    **bug**：计算机程序中的错误。

    **debugging**调试：寻找并移除计算机程序中的 bug 或错误。

    **loop**循环：最后一步与第一步连接的重复步骤。

    **memory**记忆：计算机中存储信息的方式。

    **sequence**顺序：步骤遵循的特定顺序。

    **variable**变量：可以改变或调整的东西。


    # 活动答案


    # 第 4–5 页

    这几页有五台计算机：电视、手机、平板电脑和音机，它们的小脑让它们能够找到运行程序。

    4. 取两片面包放在桌面上。

