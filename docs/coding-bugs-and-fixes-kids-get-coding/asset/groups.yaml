    # KIDS GET CODING


    # CODING, BUGS, AND FIXES


    Heather Lyons & Elizabeth Tweedale


    ![](img/1b6ae612dcebd27ea092d53714901ffe_1_0.png)

    https://archive.org/details/codingfixes0000


    # KIDS GET CODING


    # CODING, BUGS, AND FIXES


    Heather Lyons & Elizabeth Tweedale

    Illustrated by Alex West

    Lerner Publications • Minneapolis


    # Contents


    Getting Started 3

    Computers Everywhere 4

    What Is an Algorithm? 6

    Order, Order! 8

    Make a Move 10

    Loop the Loop 12

    Predict It 14

    Decisions, Decisions! 16

    Search and Sort 18

    Catching the Bug 20

    Extension Activities 22

    Words to Remember 22

    Activity Answers 23

    Index 24


    ![](img/1b6ae612dcebd27ea092d53714901ffe_3_0.png)


    # Getting Started


    Hi, I''m Data Duck! I''m here to help you learn all about algorithms and bugs.
    We''re going to have lots of fun with activities!


    An algorithm is a simple set of instructions that tells a computer what to do.
    We''re going to learn how to make algorithms, how to try them out, and how to
    fix them.


    DATA DUCK

    Here are some terms you will learn about this book. Try saying them out loud:


    - algorithm

    - sequence

    - code

    - loop

    - debug


    There are lots of activities in the book for you to try out. There are also some
    activities for you to practice with too. For online activities go to www.blastcoding.com/kidscoding
    and look for the activity with the page number from the book.


    # Computers Everywhere


    Computers are all around us and come in all shapes and sizes. We can use computers
    to help us do things such as make phone calls, pay for groceries, and do homework.


    Computers are machines, so they aren''t very smart on their own. They need instructions
    to be able to do their tasks. This book will teach you all about how to give instructions.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_5_0.png)


    DATA DUCK

    A computer’s instructions are stored in its memory.


    # What Can You See?


    Can you spot five different types of computers on these pages? What is each one
    used for? Turn to page 23 to see the answers.


    # What Is an Algorithm?


    "Algorithm" sounds like a big word, but it just means a series of steps, like
    those of a recipe.


    Computers use algorithms to complete all the tasks we need them to do. We have
    to give computers clear instructions in the algorithms so they understand what
    to do.


    5. Brush top and bottom teeth for 2 minutes.

    6. Spit out toothpaste.

    7. Rinse toothbrush.

    8. Put toothbrush back in holder.


    DATA DUCK

    A computer will use an algorithm to play a movie, search the Internet, or make
    a phone call.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_0.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_1.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_2.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_3.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_4.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_7_5.png)


    We use algorithms to do all sorts of everyday jobs. An algorithm for brushing
    our teeth might look something like this:


    1. Take lid off toothpaste.

    2. Pick up toothbrush.

    3. Wet toothbrush.

    4. Put a pea-sized drop of toothpaste on toothbrush.

    9. Put lid on toothpaste.


    # Write an Algorithm


    Try and write an algorithm for getting ready for school. You''ll need to think
    about all the things you do from the time you wake up, to the time you leave your
    house. Turn to page 23 to see an example.


    # Order, Order!


    The steps of an algorithm need to be in the correct order for it to work. The
    order of steps in an algorithm is called a sequence.


    When we write an algorithm, we have to get the sequence of steps right. When we
    get dressed, for example, it would be silly if we were to put on our shoes before
    our socks!


    DATA DUCK

    If the steps of an algorithm are in the wrong order, the algorithm won’t work!


    ![](img/1b6ae612dcebd27ea092d53714901ffe_9_0.png)


    # Cookie Algorithm


    Data Duck has written an algorithm to help him make his favorite chip cookies,
    but he''s got the order of the steps all up. Can you put the steps in the correct
    order? Turn to page 23 to see the answers.


    Mix together the butter and sugar. Then add in eggs and flour.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_10_0.png)

    Turn off oven.

    Grease baking tray.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_10_1.png)

    Put spoonfuls of mixture onto tray, then bake for 10 minutes.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_10_2.png)

    Eat and enjoy!

    ![](img/1b6ae612dcebd27ea092d53714901ffe_10_3.png)

    Heat oven to correct temperature: 350°F.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_10_4.png)


    # Make a Move


    Algorithms are written in code. This is a kind of language that computers can
    understand. When we animate a character on a computer, we use code in the algorithm.
    It tells the computer where the character should be on the screen. To make the
    character move, we need to change the character''s position over and again.


    - move 10 steps

    - move 10 steps

    - move 10 steps

    - move 10 steps


    DATA DUCK

    The things that we can change in the algorithm, such as size, color, and position,
    are called variables.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_11_1.png)


    If we want to change a character''s size, color, or position, we have to change
    the code.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_11_2.png)


    # Spot the Variables


    Look closely at the two pictures. Can you find four different variables in the
    second picture? Use this list to help you:

    ![](img/1b6ae612dcebd27ea092d53714901ffe_12_0.png)


    Turn to page 23 to see the answers.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_12_1.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_12_2.png)


    For more variable fun, and to try creating an algorithm to make Data Duck move,
    complete the activity found at: www.blastcoding.com/kidscoding


    # Loop the Loop


    Sometimes, we need computers to do a task over and again. We call these sorts
    of instructions loops. We repeat tasks every day. When we walk to school, we repeatedly
    put one foot in front of the other. When we pedal our bikes, we move our feet
    round and round. To tell a computer to do these things, we can use loops.


    DATA DUCK

    We use loops whenever there is an action or instruction we want to repeat. For
    example, I need a loop to be able to walk all the way across the screen. On page
    10, we had to tell the duck to "move 10 steps" five times to get it to move across
    the page. Another way to do this is to put one instruction inside a loop, like
    below:


    ```

    repeat 4 times

    move 10 steps

    ```


    Go to blastcoding.com/kidscoding for more practice with loops!


    # Jam Sandwiches


    Imagine you''re working in a sandwich shop and need to make the same type of sandwich
    over and over again. Write instructions to make a jam sandwich. If you had to
    make ten jam sandwiches, which steps would you put inside your loop? Turn to page
    23 to see an example.


    # Predict It


    It''s helpful if we can predict what an algorithm is meant to do before asking
    the computer to complete the instruction. When we press play on a video, for example,
    we expect a movie to start. But if the steps are in the wrong order, the video
    won''t play!


    Look at the algorithms below. Can we predict what will happen to Data Duck if
    we give him the following instructions?

    ![](img/1b6ae612dcebd27ea092d53714901ffe_15_0.png)


    ```

    change size by one-tenth smaller

    ```

    ```

    rotate by quarter-turn

    ```


    He''s going to become smaller, and twist around by a quarter-turn.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_15_1.png)


    Now, can we predict what will happen if we change the algorithm again?


    ```

    repeat 4 times

    ```

    ```

    change size by one-tenth smaller

    ```

    ```

    rotate by quarter-turn

    ```


    He''ll make the same movement as the first—but four times! He''s going to get
    smaller four times, and turn four quarter-turns.

    ![](img/1b6ae612dcebd27ea092d53714901ffe_15_2.png)

