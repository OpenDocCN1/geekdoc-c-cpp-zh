    - an L-shape


    Can a friend guess the shape by following your instructions?


    ![](img/1b6ae612dcebd27ea092d53714901ffe_16_0.png)


    # Decisions, Decisions!


    Sometimes, computers need to do something only when a special condition is met.
    To do this, they use "if statements" to make decisions.


    For example, if we tell Data Duck to move to the right, we want to make sure that
    he doesn''t move off the page.


    ```

    repeat 5 times

    move 10 steps

    If on edge of page, reverse direction

    ```


    The computer needs to make a decision about what Data Duck should wear today.
    First, it will check the weather. Then, it will look at a series of "if statements"
    to decide what to do:


    If it is sunny, tell Data Duck to wear sunglasses.


    If it is raining, tell Data Duck to bring an umbrella.


    If it is snowing, tell Data Duck to wear a winter hat.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_17_0.png)


    # DATA DUCK


    Here''s how to make an “if statement":

    First, think of a question you''d like to ask your friend, for example “Is it
    raining?” If the answer is “yes”, they will have to do the following: Bring an
    umbrella.

    So the statement is:


    # Make a statement


    Let''s make an “if statement” game to play with your friends!


    1. Write three different “if statements” on separate pieces of paper.

    2. Put them all into a hat. Shake them around and then take turns to be the caller.

    3. Each caller reads out an “if statement” for you and your friends to follow.


    > If it is raining, bring an umbrella.


    For example, you could use the following statements:


    > If you have brown hair, stand on one foot.


    > If you are a girl, raise your hands in the air.


    > If you are a boy, touch your toes.


    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_0.png)

    ![](img/1b6ae612dcebd27ea092d53714901ffe_18_1.png)

