    # 猜猜形状


    你能预测出数据鸭（Data Duck）正在画什么形状吗？


    - 重复 4 次

    - 移动 4 步

    - 转四分之一圈


    翻到第 23 页查看答案。


    现在，尝试编写你自己的指令来画出：


    - 十字形

    - 一个 T 形

    - 一个 L 形


    朋友能根据你的指令猜出这些形状吗？


    ![](img/1b6ae612dcebd27ea092d53714901ffe_16_0.png)


    # 抉择，抉择！


    有时候，计算机只有在满足特定条件时才执行某些操作。为了做到，它们使用“if 语句”（条件语句）来做决定。


    例如，如果我们告诉数据鸭向右移动，我们需要确保它不会离开页面。


    ```

    repeat 5 times

    move 10 steps

    If on edge of page, reverse direction

    ```


    计算机需要对数据鸭今天应该穿什么做出决定。首先，它会检查天气。然后，它将查看一系列“if 语句”来决定做什么：


    如果是晴天，告诉数据鸭戴上墨镜。


    如果是雨天，告诉数据鸭带上伞。


    如果是雪天，告诉数据鸭戴上冬帽。


