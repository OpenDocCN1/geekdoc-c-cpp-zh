    首先，想一个你想问朋友的问题，例如“下雨了吗？”如果答案是“是”，他们就必须执行以下操作：带上伞。

    所以这个语句是：


    # 制作一个语句


    让我们和朋友们玩一个“if 语句”游戏吧！


    1. 在三张纸上写下三个不同的“if 语句”。

    2. 把它们全部放入帽子里。摇一摇，然后轮流当指令者。

    3. 每个指令者为你读出一个“if 语句”，让你和朋友们执行。


    > 如果下雨了，带上伞。


    例如，你可以使用以下语句：


    > 如果你有棕色的头发，请单脚立。


    > 如果你是女孩，请举起双手。


    > 如果你是男孩，请摸你的脚趾。


