- md: "\n# Lab Report 02: Solving Problems Using C Programs\n\n## 1. Write a Program\
    \ in C/C++ which displays division of two numbers.\n\nProblem definition:\n\n\
    Division is a mathematical operation, written using the symbol ÷, that can be\
    \ thought of in two ways: a÷b is the size of each group when a objects are divided\
    \ into b groups of equal size, OR a÷b is the number of groups when a objects are\
    \ divided into groups of b objects each.\n\nAlgorithm:\n\n- Step 1: Start\n- Step\
    \ 2: Input a, b\n- Step 3: if (b=0) Display “Enter a non Zero number”\n- Step\
    \ 4: c=a/b\n- Step 5: Else Display c\n- Step 6: Stop\n\nFlow-chart:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_0_0.png)\n\
    \n## Source code:\n\n```c\n#include<stdio.h>\n\nint main()\n{\n    int a,b;\n\
    \    float div;\n\n    printf(\"Enter your first number: \");\n    scanf(\"%d\"\
    ,&a);\n\n    printf(\"Enter your second number: \");\n    scanf(\"%d\",&b);\n\n\
    \    //printf(\"Enter two numbers to add\\n\");\n    //scanf(\"%d%%d\",&a, &b);\n\
    \    /*div defined as a float & cast any variable a or b.*/\n    div=a/(float)b;//b\
    \ cast as float\n    if (b>0)\n        printf(\"\\nDivision of two numbers are:\
    \ %f\\n\",div);\n    else\n        printf(\"No Division\\n\");\n\n    return 0;\n\
    }\n```\n\n## Output:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_2_0.png)\n\n\
    ## 2. Write a C/C++ program which displays whether a number is odd or even.\n\n\
    ### Problem definition:\n\nAny integer that can be exactly divided by 2 is Even\
    \ and if any integer is not exactly divisible by 2 it is an Odd number. The even\
    \ numbers are multiplier of 2 and odd numbers are not.\n\nSo to check a number\
    \ is odd or even we have to divide it by 2 and if modulus is 0 it is even or else\
    \ odd.\n\n### Algorithm:\n\n- Step 1: Start\n- Step 2: [Input] Read number N\n\
    - Step 3: Check if N%2==0\n- Step 4: if true , N is an even number\n- Else,\n\
    - Step 5: N is an odd number\n- Step 6: Stop\n\n### Flow-chart:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_3_0.png)\n\
    \n### Source code:\n\n```c\n#include<stdio.h>\n\nint main() {\n\n    int n;\n\n\
    \    printf(\"Enter your number: \");\n    scanf(\"%d\",&n);\n\n    if(n%2==1)\
    \ {\n        printf(\"\\nNumber is odd\\n\");\n    } else \n        printf(\"\\\
    nNumber is even\\n\");\n    }\n\n    return 0;\n}\n```\n\n## Output: Code.exe\n\
    \n![](img/ae063c11b8af956e74f03493ca90aad3_4_0.png)\n\n## 3. Write C/C++ program\
    \ which checks a patient is in diabetics or not.\n\nProblem Definition:\n\nDiabetes\
    \ is a chronic disease that occurs either when the pancreas does not produce enough\
    \ insulin or when the body cannot effectively use the insulin it produces. A blood\
    \ sample will be taken after an overnight fast. A fasting blood sugar level less\
    \ than 100 mg/dL (5.6 mmol/L) is normal. A fasting blood sugar level from 100\
    \ to 125 mg/dL (5.6 to 6.9 mmol/L) is considered prediabetes. If it's 126 mg/dL\
    \ (7 mmol/L) or higher on two separate tests, you have diabetes.\n\nIn oral glucose\
    \ tolerance test a blood sugar level less than 140 mg/dL (7.8 mmol/L) is normal.\
    \ A reading of more than 200 mg/dL (11.1 mmol/L) after two tests indicates diabetes.\
    \ A reading between 140 and 199 mg/dL (7.8 mmol/L and 11.0 mmol/L) indicates prediabetes.\n\
    \n### Algorithm:\n\n- Step 1: Start\n- Step 2: Enter Blood glucose level\n- Step\
    \ 3: Check if bg<= 6.5\n- Print patient is healthy\n- Step 4: Check if bg<=7.0\n\
    - Print patient is in pre diabetes\n- Else Print patient is in diabetes\n- Step\
    \ 5: Stop\n\nFlow-chart:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_5_0.png)\n\
    \n### Source Code:\n\n```c\n#include <stdio.h>\n\nint main() {\n\n    float bg;\n\
    \n    printf(\"\\n Enter glucose level: %f\", &bg);\n    scanf(\"%f\",&bg);\n\n\
    \    if(bg<=6.5) {\n        printf(\"\\n Patient is healthy.\\n\");\n    } else\
    \ if(bg<=7.0) {\n        printf(\"\\n Patient is in pre-diabetics.\\n\");\n  \
    \  } else {\n        printf(\"\\nPatient is in diabetes.\\n\");\n    }\n    return\
    \ 0;\n}\n```\n\n## Output:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_6_0.png)\n\
    \n## 4. Write a C/C++ program which computes the largest number between two numbers.\n\
    \n### Problem definition:\n\nThe value of integers can be compared by their position\
    \ in the integer line. The value of the integer comes first than the value of\
    \ another integer, is smaller one between two integers.\n\n### Algorithm:\n\n\
    - Step 1: Start\n- Step 2: Read number a\n- Step 3: Read number b\n- Step 4: if\
    \ a > b, print a (Compare a and b using greater than operator)\n- Step 5: else\
    \ print b\n- Step 6: Stop\n\nFlow-chart:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_7_0.png)\n\
    \n### Source code:\n\n```c\n#include<stdio.h>\nint main()\n{\n    int No1,No2;\n\
    \    printf(\"Enter first number: \");\n    scanf(\"%d\",&No1);\n    printf(\"\
    Enter second number: \");\n    scanf(\"%d\",&No2);\n    if(No1>No2)\n        printf(\"\
    %d is larger\\n\",No1);\n    else\n        printf(\"%d is larger\\n\",No2);\n\
    \    return 0;\n}\n```\n\n## Output:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_8_0.png)\n\
    \n## 5. Write C/C++ program which sum of series 1+2+3+4+...+100.\n\n### Problem\
    \ definition:\n\nAn arithmetic progression is a sequence such that difference\
    \ between any succeeding term remains constant. The sum of arithmetic progression\
    \ is:\n\n$S_n = \\frac{n}{2}(2a+(n-1)d)$\n\nWhere:\n\n$n=$ the number of terms\n\
    $a=$ the first term\n$d=$ common difference\n\n### Algorithm:\n\n- Step 1: Start\n\
    - Step 2: Read number n\n- Step 3: Initialize sum=0, i=1\n- Step 4: Repeat step\
    \ 4 to step 7 until i <= n\n- Step 5: sum=sum+i\n- Step 6: i=i+1\n- Step 7: Print\
    \ the sum\n\n### Flow-chart:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_10.png)\n\
    \n### Source code:\n\n```c\n#include<stdio.h>\n\nint main() {\n    int n,i;\n\
    \    int sum=0;\n    printf(\"Enter n: \");\n    scanf(\"%d\",&n);\n    for(i=1;\
    \ i<=n; i++) {\n        sum=sum+i;\n    }\n    printf(\"Sum is: %d\", sum);\n\
    \    return 0;\n}\n```\n\n## Output:\n\n![](img/ae063c11b8af956e74f03493ca90aad3_11.png)\n\
    \n## 6. Write C/C++ program which display sum of squares of natural numbers.\n\
    \n### Problem definition:\n\nThe sum of squares of natural numbers is denoted\
    \ by $n^2$. Let n be natural number.\n\n### Algorithm:\n\n- Step 1: Start\n- Step\
    \ 2: Read number N\n- Step 3: Initialize sum=0, count=1\n- Step 4: Repeat step\
    \ 4 to step 6 until count <= N\n- Step 5: sum=sum+(count*count)\n- Step 6: count=count+1\n\
    - Step 7: Print the sum\n\n### Source code:\n\n```c\n#include <stdio.h>\nint main()\n\
    {\n    int N, count = 1, sum = 0;\n\n    printf(\"Enter the limit:\");\n    scanf(\"\
    %d\", &N);\n\n    while(count <= N)\n    {\n        sum = sum + (count * count);\n\
    \        count++;\n    }\n\n    printf(\"Sum of squares from 1 to %d: %d\", N,\
    \ sum);\n\n    return 0;\n}\n```\n\n## 7. Write a Program in C/C++ which displays\
    \ the average of n numbers.\n\nProblem definition:\n\nIn mathematics and statistics,\
    \ the arithmetic mean, arithmetic average, or just the mean or average, is the\
    \ sum of a collection of numbers divided by the count of numbers in the collection.\
    \ The collection is often a set of results from an experiment, an observational\
    \ study, or a survey.\n\nThe sum of n terms of an Arithmetic progression is,\n\
    \n$S_n = \\frac{n}{2}(a_1+a_n)$\n\n**Algorithm:**\n\n- Step 1: Start\n- Step 2:\
    \ Take the number of elements as input in n\n- Step 3: Initialize i = 0.\n- Step\
    \ 4: Repeat step 4 to step 7 until i < n.\n- Step 5: Take elements as input in\
    \ num\n- Step 6: Calculate, sum = sum + num\n- Step 7: Increment i by 1.\n- Step\
    \ 8: Finally divide sum by n, avg = sum / n\n- Step 9: Stop\n"
  mdcn: "\n\n# 实验报告 02：使用 C 程序解决问题\n\n## 1. 编写一个 C/C++ 程序显示两个数字的除法结果。\n\n问题定义：\n\n\
    除法是一种数学运算，使用符号 ÷ 表示，可以从两种方式来理解：a÷b 是将 a 个对象分成 b 组大小相等的组时每组的大小；或者 a÷b 是将 a 个对象分成每组\
    \ b 个对象的组时所形成的组数。\n\n算法：\n\n- 步骤 1：开始\n- 步骤 2：输入 a, b\n- 步骤 3：如果 (b=0) 显示“输入非零数字”\n\
    - 步骤 4：c=a/b\n- 步骤 5：否则，显示 c\n- 步骤 6：停止\n\n流程图：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_0_0.png)\n\
    \n## 源代码：\n\n```c\n#include<stdio.h>\n\nint main()\n{\n    int a,b;\n    float\
    \ div;\n\n    printf(\"Enter your first number: \");\n    scanf(\"%d\",&a);\n\n\
    \    printf(\"Enter your second number: \");\n    scanf(\"%d\",&b);\n\n    //printf(\"\
    Enter two numbers to add\\n\");\n    //scanf(\"%d%%d\",&a, &b);\n    /*div 定义为\
    \ float 并对任意变量 a 或 b 进行类型转换.*/\n    div=a/(float)b;//b 强制转换为 float\n    if (b>0)\n\
    \        printf(\"\\nDivision of two numbers are: %f\\n\",div);\n    else\n  \
    \      printf(\"No Division\\n\");\n\n    return 0;\n}\n```\n\n## 输出：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_2_0.png)\n\
    \n## 2. 编写一个 C/C++ 程序显示一个数字是奇数还是偶数。\n\n### 问题定义：\n\n任何能被 2 整除的整数都是偶数，如果任何整数不能被\
    \ 2 整整除，它就是奇数。偶数是 2 的倍数，而奇数不是。\n\n所以，为了检查一个数字是奇数还是偶数，我们需要将其除以 2，如果取数为 0 则是偶数，否则为奇数。\n\
    \n### 算法：\n\n- 步骤 1：开始\n- 步骤 2：[输入] 读取数字 N\n- 步骤 3：检查 N%2==0\n- 步骤 4：如果为，N 是偶数\n\
    - 否则，\n- 步骤 5：N 是奇数\n- 步骤 6：停止\n\n### 流程图：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_3_0.png)\n\
    \n### 源代码：\n\n```c\n#include<stdio.h>\n\nint main() {\n\n    int n;\n\n    printf(\"\
    Enter your number: \");\n    scanf(\"%d\",&n);\n\n    if(n%2==1) {\n        printf(\"\
    \\nNumber is odd\\n\");\n    } else \n        printf(\"\\nNumber is even\\n\"\
    );\n    }\n\n    return 0;\n}\n```\n\n## 输出：Code.exe\n\n![](img/ae063c11b8af956e74f03493ca90aad3_4_0.png)\n\
    \n## 3. 编写 C/C++ 程序检查患者是否患有糖尿病。\n\n问题定义：\n\n糖尿病是一种慢性病，发生在胰腺无法产生足够的胰岛素，或者身体无法有效利用其产生的胰岛素时。在过夜禁食后取血样本。空腹血糖水平低于\
    \ 100 mg/dL (5.6 mmol/L) 为正常。空腹血糖水平在 100 到 125 mg/dL (5.6 到 6.9 mmol/L) 之间被认为是糖尿病前期。如果在两次单独测试中达到\
    \ 126 mg/dL (7 mmol/L) 或更高，则说明患有糖尿病。\n\n在口服糖耐量测试中，血糖低于 140 mg/dL (7.8 mmol/L)\
    \ 是正常的。两次测试后读数超过 200 mg/dL (11.1 mmol/L) 表示有糖尿病。读数在 140 和 199 mg/dL (7.8 mmol/L\
    \ 和 11.0 mmol/L) 之间表示糖尿病前期。\n\n### 算法：\n\n- 步骤 1：开始\n- 步骤 2：输入血糖水平\n- 步骤 3：检查\
    \ bg<= 6.5\n- 打印患者健康\n- 步骤 4：检查 bg<=7.0\n- 打印患者处于糖尿病前期\n- 否则，打印患者患有糖尿病\n- 步骤 5：停止\n\
    \n流程图：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_5_0.png)\n\n### 源代码：\n\n```c\n\
    #include <stdio.h>\n\nint main() {\n\n    float bg;\n\n    printf(\"\\n Enter\
    \ glucose level: %f\", &bg);\n    scanf(\"%f\",&bg);\n\n    if(bg<=6.5) {\n  \
    \      printf(\"\\n Patient is healthy.\\n\");\n    } else if(bg<=7.0) {\n   \
    \     printf(\"\\n Patient is in pre-diabetics.\\n\");\n    } else {\n       \
    \ printf(\"\\nPatient is in diabetes.\\n\");\n    }\n    return 0;\n}\n```\n\n\
    ## 输出：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_6.png)\n\n## 4. 编写 C/C++ 程序计算两个数字之间的最大值。\n\
    \n### 问题定义：\n\n通过比较两个整数来计算整数的最大值。\n\n### 算法：\n\n- 步骤 1：开始\n- 步骤 2：读取数字 a\n- 步骤\
    \ 3：读取数字 b\n- 步骤 4：如果 a 大于 b，打印 a\n- 步骤 5：否则，打印 b（计算整数之间的值）\n\n流程图：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_7.png)\n\
    \n## 源代码：\n\n```c\n#include<stdio.h>\nint main()\n{\n    int No1,No2;\n    printf(\"\
    Enter first number: \");\n    scanf(\"%d\",No1);\n    printf(\"Enter second number:\
    \ \");\n    scanf(\"%d\",No2);\n    if(No1>No2)\n        printf(\"%d is larger\\\
    n\",No1);\n    else\n        printf(\"%d is larger\\n\",No2);\n    return 0;\n\
    }\n```\n\n## 输出：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_8.png)\n\n## 5. 编写\
    \ C/C++ 程序计算 1+2+3+...+n 的和。\n\n### 问题定义：\n\n等差数列是相邻项之间的差保持变化的序列。等差数列的和为：\n\n\
    $S_n = \\frac{n}{2}(2a+(n-1)d)$\n\n其中：\n\n$n=$ 项数\n$a=$ 首项\n$d=$ 公差\n\n 算法：\n\n\
    - 步骤 1：开始\n- 步骤 2：读取 n\n- 步骤 3：初始化 sum=0, i=1\n- 步骤 4：重复步骤 4 到步骤 7，直到 i <= n\n\
    - 步骤 5：sum=sum+i\n- 步骤 6：i=i+1\n- 步骤 7：打印和\n\n流程图：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_10.png)\n\
    \n## 源代码：\n\n```c\n#include<stdio.h>\n\nint main() {\n    int n,i;\n    int sum=0;\n\
    \    printf(\"Enter n: \");\n    scanf(\"%d\",&n);\n    for(i=1; i<=n; i++) {\n\
    \        sum+=i;\n    }\n    printf(\"Sum is: %d\", sum);\n    return 0;\n}\n\
    ```\n\n## 输出：\n\n![](img/ae063c11b8af956e74f03493ca90aad3_11.png)\n\n## 6. 编写\
    \ C/C 程序显示自然数的平方和。\n\n### 问题定义：\n\n自然数的平方表示为 $n^2$。令 n 为自然数。\n\n### 算法：\n\n- 步骤\
    \ 1：开始\n- 步骤 2：读取 N\n- 步骤 3：初始化 sum=0, count=1\n- 步骤 4：重复步骤 4 到步骤 6，直到 count <=\
    \ N\n- 步骤 5：sum=sum+(count*count)\n- 步骤 6：count=count+1\n- 步骤 7：打印和\n\n### 源代码：\n\
    \n```c\n#include <stdio.h>\nint main()\n{\n    int N, count = 1, sum = 0;\n\n\
    \    printf(\"Enter the limit:\");\n    scanf(\"%d\", &N);\n\n    while(count\
    \ <= N)\n    {\n        sum = sum + (count * count);\n        count++;\n    }\n\
    \n    printf(\"Sum of squares from 1 to %d: %d\", N, sum);\n\n    return 0;\n\
    }\n```\n"
