  md: '# 3. Write C/C++ program which checks a patient is in diabetics or not.


    Problem Definition:


    Diabetes is a chronic disease that occurs either when the pancreas does not produce
    enough insulin or when the body cannot effectively use the insulin it produces.
    A blood sample will be taken after an overnight fast. A fasting blood sugar level
    less than 100 mg/dL (5.6 mmol/L) is normal. A fasting blood sugar level from 100
    to 125 mg/dL (5.6 to 6.9 mmol/L) is considered prediabetes. If it''s 126 mg/dL
    (7 mmol/L) or higher on two separate tests, you have diabetes.


    In oral glucose tolerance test a blood sugar level less than 140 mg/dL (7.8 mmol/L)
    is normal. A reading of more than 200 mg/dL (11.1 mmol/L) after two tests indicates
    diabetes. A reading between 140 and 199 mg/dL (7.8 mmol/L and 11.0 mmol/L) indicates
    prediabetes.


