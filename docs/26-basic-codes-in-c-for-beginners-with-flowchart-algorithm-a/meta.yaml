    # 7. Write a Program in C/C++ which displays the average of n numbers.


    **Problem definition:**


    In mathematics and statistics, the arithmetic mean, arithmetic average, or just
    the mean or average, is the sum of a collection of numbers divided by the count
    of numbers in the collection. The collection is often a set of results from an
    experiment, an observational study, or a survey.


    The sum of n terms of an Arithmetic progression is,


    ```

    $S_n = \frac{n}{2}(a_1+a_n)$

    ```


    Where,


    $a_1$ is the first number of the progression


    $a_n$ is the last number of the progression.


    # **Algorithm:**


    +   Step 1: Start


    +   Step 2: Take the number of elements as input in n


    +   Step 3: Initialize i = 0.


    +   Step 4: Repeat step 4 to step 7 until i < n.


    +   Step 5: Take elements as input in num


    +   Step 6: Calculate,


    ```

    sum = sum + num

    ```


    +   Step 7: Increment i by 1,


    ```

    i = i + 1

    ```


    +   Step 8: Finally divide sum by n,


    ```

    avg = sum / n

    ```


    +   Step 9: Stop'
