    \ is commonly referred as leap day. Leap years have 366 days instead of the usual\
    \ 365 days and occur every four years. Leap days keep our modern calendar in alignment\
    \ with Earth’s revolutions around the Sun. It takes approximately 365.2422 days,\
    \ or 365 days, 5 hours, and 48 seconds, to circle around the Sun. This is called\
    \ a tropical year, and it starts on the March equinox. However, the Gregorian\
    \ calendar has only 365 days. If we didn't add a leap day on February 29 every\
    \ four years, each calendar year would drift apart from the tropical year and\
    \ get increasingly out of sync. With a deviation of approximately 6 hours per\
    \ year, seasons would shift by about 24 days within 100 years. Allow this to happen\
    \ for a while, and Northern Hemisphere dwellers will be celebrating Christmas\
