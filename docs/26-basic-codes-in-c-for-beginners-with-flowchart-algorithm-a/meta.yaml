  md: '# Lab Report 04: Discussion on Computer Network and Networking Command


    # Computer Network:


    A computer network is a group of interconnected computers and devices that communicate
    with each other to share resources and information. Networks can be categorized
    based on their size and geographical scope.


    Here are some of the most common types of computer networks:


    Local Area Network (LAN): A LAN is a network that connects devices in a small
    area such as a home, office, or school. A LAN typically uses Ethernet cables or
    Wi-Fi to connect devices.


    Wide Area Network (WAN): A WAN connects devices across a larger geographic area,
    such as different cities or countries. The internet is the largest WAN in the
    world.


    Metropolitan Area Network (MAN): A MAN is a network that spans across a metropolitan
    area, such as a city or a group of cities.


    Wireless Network: A wireless network uses radio waves to connect devices without
    cables. Wi-Fi is a common type of wireless network.


    Networks can also be classified by their topology, which refers to the way in
    which devices are connected to each other. Some of the most common network topologies
    include:


    +   Bus Topology: Devices are connected to a single cable that runs the length
    of the network.


    +   Ring Topology: Devices are connected in a circular chain.


    +   Star Topology: Devices are connected to a central hub or switch.


    +   Mesh Topology: Devices are connected to each other in a complex web of connections.


    Networks can also be classified by the type of protocol they use to transmit data.
    Some of the most common network protocols include:


    +   Transmission Control Protocol/Internet Protocol (TCP/IP): This protocol is
    used on the internet and most local networks.


    +   User Datagram Protocol (UDP): This protocol is used for real-time applications
    as video conferencing and online gaming.


    +   Hypertext Transfer Protocol (HTTP): This protocol is used for transmitting
    data over the World Wide Web.


    Overall, computer networks play a vital role in connecting devices and people
    around the world. They allow us to share information, resources, and services,
    and they enable us to communicate and collaborate with each other in real-time'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Internet Protocol& IP Address:


    Internet Protocol (IP) is a set of rules that govern the communication of data
    over a network, including the Internet. IP is responsible for breaking up data
    into packets, adding addressing information to each packet, and routing them to
    their intended destination.


    IP addresses are used to identify devices on a network. An IP address is a unique
    numerical identifier assigned to each device on a network. It is used to locate
    and communicate with devices over the Internet or a private network.


    IP addresses are divided into two types:


    +   - IPv4


    +   - IPv6.


    IPv4 addresses are 32-bit numbers expressed in dotted decimal notation, such as
    192.168.0.1. IPv4 addresses are widely used and are the most common type of IP
    address. However, as the number of devices connected to the Internet has grown
    rapidly, IPv4 addresses have become scarce. This has led to the development of
    IPv6 addresses.


    IPv6 addresses are 128-bit numbers expressed in hexadecimal notation, such as
    2001:0db8:85a3:0000:0000:8a2e:0370:7334.


    An IP address is divided into two parts: the network address and the host address.
    The network address identifies the network to which the device belongs, while
    the host address identifies the individual device on the network. The subnet mask
    is used to divide the IP address into two parts.


    IP packets are transmitted across a network using a variety of protocols, including
    TCP (Transmission Control Protocol) and UDP (User Datagram Protocol). TCP is a
    connection-oriented protocol that provides reliable, ordered, and error-checked
    delivery of data, while UDP is a connectionless protocol that provides faster,
    but less reliable, delivery of data.


    In summary, Internet Protocol is the set of rules that govern the communication
    of data over a network, while an IP address is a unique numerical identifier assigned
    to each device on a network. It is used to locate and communicate with devices
    over the Internet or a private network, and is divided into the network address
    and the host address.


