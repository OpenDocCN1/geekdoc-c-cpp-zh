  md: '10. Write a C/C++ program to find a year is Leap Year or not.


    # Problem definition:


    Leap years are years where an extra, or intercalary, day is added to the end of
    the shortest month, February. The intercalary day, February 29, is commonly referred
    to as leap day.


    Leap years have 366 days instead of the usual 365 days and occur almost every
    four years.


    Leap days keep our modern-day Gregorian calendar in alignment with Earth’s revolutions
    around the Sun. It takes approximately 365.242189 days, or 365 days, 5 hours,
    48 minutes, and 45 seconds, to circle around the Sun. This is called a tropical
    year, and it starts on the March equinox. However, the Gregorian calendar has
    only 365 days in a year. If we didn''t add a leap day on February 29 almost every
    four years, each calendar year would drift about 6 hours before Earth completes
    its revolution around the Sun (see illustration).


    As a consequence, our reckoning would slowly drift apart from the tropical year
    and get increasingly out of sync with the seasons. With a deviation of approximately
    6 hours per year, the seasons would shift by about 24 calendar days within 100
    years. Allow this to happen for a while, and Northern Hemisphere dwellers will
