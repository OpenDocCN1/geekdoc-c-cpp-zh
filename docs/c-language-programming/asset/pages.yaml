    \ a text message... */\n\n#include <stdio.h> /* Include the header file... */\n\
    \nmain() { // Start of a main Function...\n    printf(\"Hello, Programmers\\n\"\
    );\n    // printf()function to print the text to stdout...\n}\n```\n\nCopy this\
    \ code in the file. Open a Linux terminal and compile it with the command given\
    \ below.\n\n$ gcc hello.c\n\nIf no errors or warnings get displayed, the code\
    \ has compiled successfully. a.out file will be generated which is the default\
    \ executable file name in Linux. Run it as shown below.\n\n$ ./a.out\n\nIt should\
    \ print the text as expected.\n\nHello, Programmers\n\nNow let us understand what\
    \ the program does. The first line of the program is a comment describing the\
    \ purpose of the program. It becomes easier for others to understand the code\
    \ if the program is already described through comments. The second line of the\
    \ program asks the compiler to include the standard input/output library header\
    \ stdio.h. This line is common to almost all the C programs and should be included\
    \ if not specified in any programs in this textbook."
