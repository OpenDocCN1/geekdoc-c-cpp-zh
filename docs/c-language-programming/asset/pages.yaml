  md: '# 12. Linked List


    Linked List is a type of data structure . Data Structure is a method used to organize
    data so that it can be accessed in an efficient manner . Array is also a data
    structure as it can store same type of data in an efficient manner . Some other
    examples of data structures are linked lists , graphs , tree and stack . Structures
    can be used to store different types of data . Array of structures can be used
    to store data for several structures. However, it becomes a static storage . An
    efficient way is to allocate the memory when demanded . We will see how linked
    list serves this purpose.


    Linked list is a linear collection of nodes which are joined in a particular way
    using pointers. Using linked lists , memory can be allocated on demand from the
    users as it doesn''t need to be continuous and fixed. Since the memory is not
    continuous, self referential structures should be used. We will discuss following
    types of linked list.


    +   - Singly Linked List : Each node has 1 link to point to structure of same
    type.


    +   - Doubly Linked List : Each node has 2 links to point to two different structures
    of same type.


    +   - Circular Linked List : Linked list is arranged in circular fashion.


    There is one more type of linked list which is known as multiply linked list .
    Each node in multiply linked list contains two or more links to the structure
    of same type. In fact'
