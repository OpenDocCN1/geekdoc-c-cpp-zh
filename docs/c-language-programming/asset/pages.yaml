  md: '# 6.1 Why do we need Functions?


    We have used printf() and scanf() several times in the program till now. So why
    do we actually need them?


    +   - Using Functions, complex and big programs can be divided into relatively
    simple and smaller modules.


    +   - Each of these modules can be developed individually.


    +   - Reusability is one of the most important property of a Function.


    +   - Functions provide modular programming. Debugging becomes easier.


    Assume that printf function was not there. How difficult would your life be? Every
    time you want to print something, you have to write several sets of instructions
    ( that printf uses internally) to perform this task. So Functions bring reusability.


    The program looks better if divided into smaller functions. A single main() function
    would look messy and complex. Each of these functions works independently. Hence,
    they can be developed one at a time. When there are errors in the program, you
    know for sure function is giving the error. So you only need to look at that function.
    Think of a single main function. You would go crazy searching for an error for
    really big applications.'
