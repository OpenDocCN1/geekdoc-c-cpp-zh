  md: "# 5.4 Generic Pointers\n\nGeneric Pointer is a pointer of type void (no type).\
    \ However, we can't have any data of type void. Hence this pointer points nowhere\
    \ and has to be casted to required data type. Generic pointers are mostly used\
    \ in function arguments (to be discussed later). If you want a pointer capable\
    \ of accepting different type of data, make it generic. Small example is given\
    \ below.\n\n```\nint main() {\n    int a = 4;\n    float c;\n    int b;\n    void\
    \ *ptr; // Can point to any kind of data...\n\n    ptr = &a; // ptr contains address\
    \ of a...\n\n    b = *ptr; // ERROR!! What kind of data to dereference...\n\n\
    \    // Type Casting desired...\n    b = *(int*)ptr; // b now contains 4. Print\
    \ it...\n\n    ptr = &c; // Now let's make it point to float...\n}\n```\n\nHere,\
    \ we declared a void pointer and made it point to an int variable. However, when\
    \ we try to get the dereference value, the pointer doesn't how to dereference\
    \ the data. Hence type casting has to be done explicitly. For type casting, we\
    \ put (int *) between * and ptr so that the void pointer behaves like an int pointer\
    \ and retrieves int data from the memory address point to it. This pointer can\
    \ point to another type of data in the same program as shown in the last statement\
    \ of the code.\n\nGeneric pointers are generalized for all the types of data and\
    \ using them is considered a good programming practice."
