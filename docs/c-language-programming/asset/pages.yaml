  md: '# Binary To Decimal Conversion


    Consider a decimal number 1234.


    1234 = 1000 + 200 + 30 + 4


    $= 1 \times 10^3 + 2 \times 10^2 + 3 \times 10^1 + 4 \times 10^0$


    Here we multiplied each digit with the power of 10 because it is a decimal number
    (base 10). We can apply same method to convert the number from binary to decimal
    with the power of 2 (binary base 2). So we us convert a number 1001 0011$_2$ in
    decimal.


    1001 0011$_2 = 1 \times 2^7 + 0 \times 2^6 + 0 \times 2^5 + 1 \times 2^4 + 0 \times
    2^3 + 0 \times 2^2 + 1 \times 2^1 + 0 \times 2^0


    $= 128 + 0 + 0 + 16 + 0 + 0 + 2 + 1


    1001 0011$_{10}$


    This can be visualized as shown in the table below.


    | ... | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    |---|---|---|---|---|---|---|---||

    | ... | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    | Number | 1 | 0 | 0 | 1 | 0 | 0 | 1 | 1 |


    We have written down the powers of 2 and corresponding bits. The only thing you
    need to do is add the power values whose corresponding bits are 1 (as shown in
    Bold).'
  merge: -1
