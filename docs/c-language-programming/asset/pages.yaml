  md: '# 9.2 Macros


    Macros can be defined in C using the preprocessor directive #define . Macros are
    used to define a constant value that could be required in the program. It can
    have data of any type. The general syntax with some examples is shown below.


    ```

    #define MACRO_NAME VALUE

    #define PI 3.141

    #define STRING "MACRO"

    #define ROWS 10

    #define CHARACTER ‘A’

    ```


    If any of these MACRO_Names are used in the program, preprocessor replaces them
    with their corresponding value.


    ```

    printf("%d", PI * Pi); // Replaced at preprocessor stage...

    ```


    Similar results can be achieved using const float PI = 3.141; So why to opt for
    macros? As discussed above, if macros are used, the value of PI is replaced at
    the preprocessor stage and hence less operation has to be done at runtime. It
    results in faster operation using macros.


    Macros can also be used to perform small operations.


    ```

    #define SUM(x,y) x+y

    printf("%d", SUM(3,4));

    ```


    This doesn''t wait to be executed till runtime. Once preprocessing is over, the
    statement is changed as follows.


    ```

    printf("%d", 7);

    ```


    SUM(x,y) looked like a function call but it is a macro.'
