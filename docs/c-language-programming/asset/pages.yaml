- img_proc: true
  md: '# 1.4 Identifiers


    There are two types of words which we will use in a C program. They are either
    system or user defined words. The system defined words are known as keywords as
    the user defined words are known as identifiers (also known as Variables). C language
    specifies some rules for naming an identifier. The rules are given below.


    +   - Identifier names can only have alphabets, underscore (_) and digits.

    - The name should start with an alphabet or underscore.

    - Predefined keywords cannot be used as an identifier.

    - C language is case-sensitive. Therefore uppercase and lowercase names are considered
    separate.

    - Most of the C compilers support identifiers up to 31 characters. However it
    is advised to keep the names short and meaningful.


    Some valid examples of identifiers are given below


    ```

    income readBuffer filePointer _total subject1 i

    ```


    The names given below are invalid and will generate compilation error.


    ```

    8Subject    First character can''t be a digit.

    char        char is a keyword in C.

    Abc$        Only special character allowed is underscore (_).

    ```'
  merge: -1
