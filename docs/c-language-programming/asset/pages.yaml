  md: "# 3.2 Switch-Case Statements\n\nThe switch statement is used to test an expression\
    \ for several constant integer values. Each constant value makes an case. Switch-case\
    \ is used to replace the longer if-else statements where several integers have\
    \ to be compared. The general syntax for switch-case statements is shown below.\n\
    \n```\nswitch (expression) {\n  case constant1 // Execute this case...\n    Statement1\n\
    \    break;\n\n  case constant2 // Execute this case...\n    Statement2\n    break;\n\
    \n  case constant3 // Execute this case...\n    Statement3\n    break;\n\n  default\
    \ // Execute this case if no case matched ...\n    Statement\n    break;\n}\n\
    ```\n\nIf the constant value is equal to that expression, that case block is executed.\
    \ The break statement is used in each case so that after executing a single case,\
    \ it doesn't check for other cases. Break is an unconditional control statement\
