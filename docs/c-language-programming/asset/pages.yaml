  md: '# 11.1 Creating/Opening and Closing a file


    The function fopen() is used for opening as well as creating the file. It opens
    the file whose name is specified in the form of string in first argument. The
    second argument specifies the mode of operation.


    ```

    FILE *fptr;

    ```


    Above call to fopen() opens a file present at path /home/filename for reading.
    Other modes are explained below.


    +   - r - File opened for reading.


    +   - r+ - File opened for reading and writing.


    +   - w - File opened for writing. File created if doesn''t exist.


    +   - w+ - File opened for reading and writing. File created if doesn''t exist.


    +   - a - File opened for appending. File created if doesn''t exist.


    +   - a+ - File opened for reading and appending. File created if doesn''t exist.


    If the file is opened successfully, file pointer is returned. If any error occurs,
    NULL is returned. Once the operations on the file have been performed, file should
    be closed using fclose() function.


    ```

    fclose(fptr); // Close a file pointed by fptr...

    ```'
