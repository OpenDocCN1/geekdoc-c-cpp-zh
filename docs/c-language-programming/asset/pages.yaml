  md: '# 2.4 Operators


    Operators are the symbols used to perform numerous operations. C language provides
    several built-in operators that perform numerous tasks. C operators can either
    be classified based on the number of operands or the type of operation they perform.
    Based on the number of operands, C operators can either be unary, binary or ternary.
    Based on the type of operation they perform, C operators are classified as follows.


    # 2.4.1 Arithmetic Operators


    As the name suggests, this operators are used to perform Arithmetic operations.
    The basic arithmetic operators +, -, *, / that perform addition, subtraction,
    multiplication and division of two numbers. The % is a modulus operator which
    gives the remainder obtained on dividing numbers. Since they operate on two operands,
    they are all binary operators.


    There are two more Arithmetic operators which are unary, which means that they
    operate on a single operand. They are ++ and -- which increases/decreases the
    value of variables by 1. These two operators can be applied on either side of
    the variable as shown below.


    +   - ++a  Pre-Increment(or Decrement) the value

    - a++ Post-Increment(or Decrement) the value


    It is to be noted that all operators can be applied to float or double data types
    except % . A table for arithmetic operators is given below.


    | Operator Symbol | Description |

    | --- | --- |

    | + | Add two operands |

    | - | Subtract operand2 from operand1 |

    | * | Multiply two operands |

    | / | Divide two operands |

    | % | Gives remainder from division of two operands |'
  merge: -1
  pgno: 28
- img_proc: true
  md: '| ++ | Increment the operand by 1 |

    | --- | Decrement the operand by 1 |


    **Program 2-3:** Make use of all the arithmetic operators in a program.


    ```

    /* Understanding Arithmetic operators */

    // main() function not shown, should be written by you...


    int a, b, c;

    a = 20; // = is an assignment operator, refer Section 2.4.4

    b = 8;

    c = a % b; /* Here value of c becomes 4, i.e. remainder

    c = a ++ + b; /* Being post-increment, c = a + b happens and a++ happens. So c
    becomes 28 and changes to 21. */

    c = -a + b; /* Pre-decrement, a becomes 20 back from 21 and then c = 20 + 8 =
    28... */

    c = a + b * 2; /* Since * has precedence than +, b * 2 is done first, the result
    (16) is added to a(20) and finally assigned to c. So c = 36 */

    c = (a + b) * 2; /* Precedence is altered using parenthesis. Guess the final answer...
    */

    ```


    You can print the intermediate values for debugging using printf function. The
    precedence of the operators should be taken in consideration when they are used
    together in a statement. However, you can always alter the precedence using grouping
    or parenthesis as shown above. Precedence of the operators is shown at the end
    of the chapter.


    # 4.4.2 Relational Operators


    Relational operators are also known as logical operators. They help us to write
    very flexible logical expressions. Logical operators are shown below based on
    the precedence.


    | > >= < <= |

    | == != |

    | && || ! |'
  merge: -1
