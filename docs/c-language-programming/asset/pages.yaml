  md: '# 4.3 Multi-Dimensional arrays


    The arrays which we have used so far in the chapter are single dimensional arrays.
    However, C language supports the use of multi-dimensional arrays as well. We will
    learn two dimensional and three dimensional arrays in this section.


    # 4.3.1 Two Dimensional Arrays


    2D (Two Dimensional) arrays can be viewed as a collection of 1D (Single Dimensional)
    arrays. The declaration goes as follows.


    Data-type name[x][y];


    In the above declaration, name is a 2D array. In other words, it is a collection
    of x number of 1D arrays, each having y number of elements. It can also be viewed
    as x number of rows, each having y number of columns. Suppose we have 2D array
    of integers with 3 rows and 3 columns.


    ```

    int name[3][3]; // 2D arrays with 3 rows and 3 columns...

    ```


    Let us initialize a two dimensional array now.


    ```

    int name[3][3] = {1,2,3}, {4,5,6}, {7,8,9} };

    ```


    Above declaration can be simplified as shown in the table below. Value at each
    index is also shown. Please recall thatindex in arrays start from 0.


    | Rows/Columns | Col 0 | Col 1 | Col 2 |

    |---|---|---|---||

    | Row 0 | name[0][0] = 1 | name[0][1] = 2 | name[0][2] = 3 |

    | Row 1 | name[1][0] = 4 | name[1][1] = 5 | name[1][2] = 6 |

    | Row 2 | name[2][0] = 7 | name[2][1] = 8 | name[2][2] = 9 |'
