  md: "# ## 7.4 Register Storage Class\n\nWhen you run any program, it runs in primary\
    \ memory (RAM). Appendix 6 shows that stack and data both are part of primary\
    \ memory in addition to heap and code . RAM is external to CPU . If an operation\
    \ is to be performed faster, it is better to store the variable in CPU Registers\
    \ instead of RAM . This can be done by making the local variables of register\
    \ storage class as shown below.\n\n```\nint main() {\n    register int count;\n\
    }\n```\n\nCPU Registers are limited in memory and hence defining it of register\
    \ storage class does not guarantee that they will be stored in registers . It\
    \ would be stored in CPU registers based on the system architecture, design implementations\
    \ and the availability of memory. We can't print the address of register variables\
    \ using Unary & because the register doesn't represent a memory location. Also\
    \ a pointer to them is not possible.\n\nThe variables with register storage class\
    \ are stored in CPU registers preferably . Their scope is inside the function\
    \ block. Their life is the lifetime of the function and default initial value\
    \ is garbage . Register is the default storage class within the formal arguments.\n\
    \n```\nvoid function(int x) { // x is register preferably by default\n...\n}\n\
    ```\n\nThe whole storage class properties are summarized in the table given below.\n\
    \n| Properties | Auto | Extern | Static | Register |\n|---|---|---|---|--|\n|\
    \ Memory | Stack | Data | Data | CPU Register |\n| Lifetime | Function | Process\
    \ | Process | Function |\n| Scope | Inside the Function | Everywhere (all files)\
    \ | Inside the Function | Inside the Function |"
