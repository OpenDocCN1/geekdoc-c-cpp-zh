  md: "# 7.2 Extern Storage Class\n\nExtern storage class signifies a reference to\
    \ a global variable in another file. The obvious question would be – What is a\
    \ global variable ? A Global variable is a variable written outside the functions\
    \ and hence is visible to all the functions defined in a file.\n\n```\n#include\
    \ <stdio.h>\n\nint number = 5; // This is a Global Variable...\n\nvoid f1() {\n\
    \    printf(\"%d\",number);\n    // can access and modify Global variable...\n\
    }\n\nvoid f2() {\n    printf(\"%d\",number);\n    // can access and modify Global\
    \ variable...\n}\n\nint main() {\n    printf(\"%d\",number);\n    // can access\
    \ and modify Global variable...\n}\n```\n\nAs shown above, the variable number\
    \ is a global variable as it is common to all the functions. So what is the case\
    \ with Extern ? For large programs with several modules, it might happen that\
    \ you write each module in a new .c file and compile all of them together. In\
    \ such case, if a global variable declared in one file has to be used in another\
    \ one, we can use extern storage class. Consider the example given below.\n\n\
    Main.c ->\n\n```\n#include <stdio.h>\n```"
