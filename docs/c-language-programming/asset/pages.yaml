  md: '# 2.2 Variables declarations and Initialization


    A variable has to be declared before using it. When a variable is declared, memory
    is allocated. Variable can be declared by specifying the data type followed by
    name. The data type decides the type and range of values that a variable can store.
    The declaration syntax is shown below.


    Data-type Name;


    The name could be anything that satisfies the rules discussed in the beginning
    of the chapter. Some examples are given below.


    ```

    int year;

    char ch;

    flat a,b,c;

    ```


    More than one variable can be declared in same line as shown. These variables
    contain garbage (random data present in memory that is not useful) if not initialized.
    Hence it won''t get any error but the output might not be as expected if they
    are not assigned any values. Assigning values to the variables at the time of
    declaration is known initialization.


    ```

    int year = 2015;

    char ch = ''A'';

    float a = 1.2, b, c = 4.08;

    ```


    As you can see in the last line, only two floating-point variables have been initialized.
    If variables are not initialized, they should be assigned some values before they
    are used in a program. If they are not given any values, they will contain garbage
    . Garbage is the value present at the memory address (of variable) which is not
    usable.


    Integer variables are signed by default. The program given below will explain
    you the difference between signed and unsigned .


    Program 2-2:Write a program that explains the signed type qualifiers.'
