  md: 'positive number.


    +   - Next 8 bits are the Exponent bits.

    - Remaining 23 bits are called Mantissa.


    The sign bit is easy to determine as it represents actual sign of the number.
    The exponents for float datatype are unsigned integers with a bias of 7F (127
    in decimal). It means that the exponent is added to 7F to form actual 8-bits of
    exponent. Finding the mantissa gets interesting.


    Let''s take example of float b = 13.6;


    To find the mantissa part, we have converted the 0.6 of 13.6 in the binary form
    which is done as follows.


    0.6 is multiplied by 2. 1 is taken from the resulting 1.2 to give 0.2, 0.2 is
    again multiplied to 2 to give 0.4. 1 can''t be taken of 0.4 and hence resulting
    bit is 0. This process is carried on until we get a repeating pattern or 0 as
    multiplication.


    | 0.6 x 2 = 1.2 | |

    | 0.2 x 2 = 0.4 | 0 |

    | 0.4 x 2 = 0.8 | 0 |

    | 0.8 x 2 = 1.6 | 1 |

    | 0.6 x 2 = 1.2 ... | 1 ... |


    We can see that the repeating pattern here will be 1001. Now from 13.6, 13 can
    be expressed in binary as 1101 (Normal Decimal to Binary).


    > (13.6)$_{10}$ = (1101.1001)$_{2}$ Bold text means repeated...

    (13.6)$_{10}$ = (1.1011001e$^{3}$)$_{2}


    Now 7F is added to 3 to give exponent part. Resulting exponent is 82 or 1000 0010
    (Hex to Binary).'
