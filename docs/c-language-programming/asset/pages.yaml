    Endianness indicates how the data is stored in the memory. In Little Endian format,
    LSB (Least Significant byte) is stored in the lower address . In Big Endian format,
    MSB (Most Significant Byte) is stored in the lower address . For Example, Intel
    CPUs follow Little Endianness while Motorola and ARM based processors follow Big
    Endian . Table given below explains the memory storage for both Endianness.


    | Data Big Endian | 12 | 34 | 56 | 78 |

    | Data Little Endian | 78 | 56 | 34 | 12 |

    | Memory Address | 1000 | 1001 | 1002 | 1003 |


    It is assumed that int a is stored in memory address 1000-1003 . The difference
    between Little and Big Endian is clearly evident. You can confirm the Endianness
    of your system by running this program and verifying the output ( 12 for Big Endian
    and 78for Little Endian ).


