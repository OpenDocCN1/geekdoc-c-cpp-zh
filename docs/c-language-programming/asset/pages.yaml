  md: '# 6.6 Recursion


    If a function calls itself, it becomes a recursive function . Clearly, the calling
    function and called function are same here. The code snippet is shown below.


    ```

    void function() {

    ...

    function(); // Recursive call as function calls itself...

    ...

    }

    ```


    ```

    int main() {

    function(); // Normal Call...

    }

    ```


    If a function keeps calling itself, stack might get full due to number of calls
    and the result would be a stack overflow . Hence recursion should be used only
    with a terminating condition.


