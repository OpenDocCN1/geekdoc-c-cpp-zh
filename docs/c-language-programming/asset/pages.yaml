    In this chapter we had a small introduction to the C language. We saw the general
    structure of a C program, wrote the first program and ran it successfully. We
    introduced Tokens that are key elements of any programming language. Finally we
    had a look at identifiers and keywords. We are now ready to move to the next chapter
    and explore about them.'
