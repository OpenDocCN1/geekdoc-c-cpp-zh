  md: "# 7.3 Static Storage Class\n\nWe know that auto is the default storage class\
    \ for all the local variables. Similarly, static is the default storage class\
    \ for all the global variables. It means either of the variable declarations in\
    \ the code given below produces same results.\n\n```\nstatic int number;\n// int\
    \ number; // Same as above line...\n\nint main() {\n  ...\n}\n```\n\nHowever,\
    \ static variables cannot be used in multiple files because multiple storage classes\
    \ cannot be applied to a single variable.\n\n```\nextern static int number; //\
    \ X-This is Wrong-X...\n```\n\nThe main use of static variables is inside the\
    \ functions. If a static storage class is used inside a function, the variable\
    \ remains in existence, even if the function gets destroyed. The main reason behind\
    \ this is that local variables are stored in the stack, whereas variables are\
    \ stored in the data section. When a function gets destroyed, all its variables\
    \ (local) are destroyed from the stack as well. Data section remains intact. Hence\
    \ the value of static variable is maintained between several function calls.\n\
    \n```\nvoid visitors() {\n  int number = 0;\n  static int count = 0; // Initialized\
    \ only for 1st call...\n  count++; // Happens for all the calls...\n  number++;\n\
    \  printf(\"Company number = %d\\n\",number);\n  printf(\"Total number of Visitors\
    \ = %d\\n\",count);\n}\n\nvoid test {\n```\n\n![](img/852a18c39758ea225fff4350618abf80_141_0.png)"
