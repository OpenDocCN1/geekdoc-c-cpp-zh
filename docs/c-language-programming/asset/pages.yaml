  md: '# 2. Data Types & Operators


    Every application needs data. User provides input data which is processed to generate
    output data. This data can grouped into different types which are known as Data
    Types. C language provides several data types. They not only hold different type
    of data but have different storage representation in the memory.


    Data Types can be used for declaring identifiers, functions or other types. These
    types decide how much memory has to be occupied in the storage.'
  merge: -1
