  md: '# 10. Structures, Unions & Enums


    Before discussing structures unions and enums, let us learn how to create a new
    type using the keyword typedef . The general syntax for typedef is shown below.


    ```

    typedef EXISTING_TYPE NEW_TYPE;

    ```


    typedef is used to give a new name for the existing datatype as shown below. It
    is like this


    ```

    typedef int INTEGER;

    ```


    ```

    INTEGER number; // Compiler considers it as int number;

    ```


    The new type should not be a C keyword, conflicting type or a known variable.
    We know that int occupies 4 bytes in gcc compiler and 2 bytes in Turbo C . However,
    size_t occupies 4 bytes on any system and has the capability of unsigned long
    int . The header file stddef.h declares size_t and several other types using typedef
    .


    ```

    typedef unsigned long size_t; // 4 bytes unsigned int

    typedef signed long ssize_t; // 4 bytes signed int

    ```


    Instead of writing a big type like unsigned long, we can just write a small and
    meaningful name size_t and it will work in a similar way. Typedef can be used
    with pointers, structures and all other data types. Let us see some examples of
    creating new type using typedef keyword.


    ```

    typedef int * INTEGER_PTR;

    INTEGER_PTR x; // This is same as int * x;

    ```


    ```

    typedef int TENINT[10];

    TENINT arr; // arr is an array of 10 integers...

    ```'
