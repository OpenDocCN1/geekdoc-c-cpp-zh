  md: '# 11. File Handling


    File is a record or similar data stored in permanent (secondary) memory . Regardless
    of its type, files can be considered as sequence of data bytes. Everything in
    a computer system is either a file or process. Process runs in primary memory
    while files are found in secondary memory storage. File handling is a very important
    concept in C language.


    So what is the meaning of File handling ? File handling deals with the following
    operations on files.


    +   - Creation of file

    - Reading data from a file

    - Writing data to a file

    - Appending data to a file

    - Deletion of file


    Just like we use pointers to point to some data, we can have pointers that point
    to a file. They should be declared of type FILE as shown below.


    ```

    FILE *fptr; // fptr is a pointer of type FILE...

    ```


    There are three standard file streams connected to the input and output channels.
    These file streams are always open and can be used inside the programs.


    +   - stdin - stdin stands for Standard Input. If your program needs user input,
    it can be provided to this stream. Example is scanf() function which reads input
    from stdin.'
