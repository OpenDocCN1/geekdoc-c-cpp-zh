    \n```\nint main() {\n    auto int number;\n    //int number; // By default auto...\n\
    }\n```\n\nThe example above shows that we have declared a int variable with auto\
    \ storage class. Even if you declare a normal int variable, compiler considers\
    \ it auto . Since local variables are defined inside the function, scope of auto\
    \ variables is inside the function. The lifetime is also the lifetime of the function\
    \ in which it is defined. The default initial value is garbage for auto storage\
    \ class. Local variables are stored inside the stack section of primary memory.\
    \ Refer Appendix 6 for memory information."
