  md: '# 6.3 General Structure of a Function


    We have been using main() function in each program. Hence we are almost aware
    how it is done. The general structure is given below.


    ```

    return_type FunctionName(arguments); // Function Declaration...


    return_type FunctionName(arguments) { // Function Definition...

    // statements...

    }


    int main() {

    ...

    FunctionName(arguments); // Calling the function defined above

    ...

    }

    ```


    Any C program starts at execution from the main() function. Let us refer main()
    as the calling function and FunctionName() as the called function. Call to a function
    searches the function and executes it. Calling function searches the called function
    above its own definition. If the called function is defined below the calling
    function, it won''t find it until a function declaration is found above. Thus
    a function declaration is optional but mandatory when called function is defined
    below the calling function.


    Function declaration consists of a function name, return type and type of arguments.
    When control is passed to the called function, data may or not be passed to the
    function definition. Function definition consists of function header and the body.
    The following are required while defining a new function.


    +   - Return Type: A function may or may not return a value. The type of the data
    that a function returns is specified in place of return type. If no data is returned,
    void can be written. Please note that a function can return only 1 value.


    +   - Function Name: This is the name with which function is recognized. The rules
    for naming functions are same as that used for naming variables.'
