  md: '# Preface


    C is the most common and powerful programming language used for creating wide
    variety of applications. Unix based operating system was completely written in
    C. C is a mid-level programming language because it is capable to perform both
    low-level programming and cross-platform programming. C works closely with the
    memory and can interact with the hardware easily. It is this reason that it makes
    an idle programming language for writing device drivers and performing system
    programming. C language provides several operators to perform complex operations.
    C is portable to the source level.


    Many modern programming languages are derived fully or partially from C language.
    Once you get your hands on C language, you can switch on to any other programming
    language easily. Hence, if you are new to programming, C language is undoubtedly
    the best choice.


    This book has designed to explain each and every concept in detail. C is not just
    theory. Hence appropriate programs are used to explain the theories. There are
    several solved programs with detailed explanation. For practice, exercises are
    provided with a hint to solve them.


    Pointer is one of the major topics of C language. Some students find it confusing
    and avoid studying it. However, this book presents pointers in the most interesting
    way possible with several examples and pictorial visualization. Several applications
    of pointers like command line arguments, dynamic memory allocation are also explained.
    The book is concluded with Data Structures. Linked list program given in the book
    discusses all the possible cases and explains it in a meaningful way.


    The language in the book has been kept simple and to the point. Beginners will
    find this book very helpful as the chapters have been arranged so as leave no
    gaps in between. This book also helped the skilled programmers if they are confused
    in any topics. Appendix provided at the end of the book explains several concepts
    that are not part of C language but are required to understand certain theories.


    The main goal of this book is to impart maximum knowledge regarding C language
    to the students to make them better programmers. It is this reason that the book
    comes with a special package. You can now connect the author of the book in case
    of any queries/doubts/suggestions at jani@programminsage.com. Your requests and
    queries will be processed as soon as possible.'
