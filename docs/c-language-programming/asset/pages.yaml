  md: '# 4.1 What are Arrays?


    Arrays in C are derived data type and represent the collection of data of the
    same type in adjacent memory. The general syntax of array is shown below.


    Data-type name[quantity];


    Above declaration creates an array name of type Data type with quantity number
    of elements. Examples are shown below.


    ```

    int num[5]; // Declares an array named num of 5 integers...

    char name[10]; // Declares an array name of 10 characters...

    float f[6]; // Declares an array f of 6 float values...

    ```


    So are the advantages of using arrays over several variables of the same type.
    Well!! Here are few of them.


    +   - Easy to access as they are known by the same name.

    - By knowing the base address, other addresses can be known easily.

    - Only 1 variable declaration is required.

    - Memory execution is faster.


    Please note that array name indicates the base address. Array elements are accessed
    using their indexes. Indexes start from 0. So any array has 5 elements, indexes
    run from 0 to 4. Size of any array depends on its declaration. For example, if
    the declaration int num[5], num will occupy 20 bytes (1 occupies 4 bytes. So 5
    x 4 = 20 bytes). Array provides static memory allocation as many bytes to be allocated
    is specified in the declaration. The concept of dynamic memory allocation will
    be discussed later in the coming chapters.


    # 4.1.1 Array Initialization


    Initialization means assigning some value at the time of declaration. The example
    below shows how to do that.


    ```

    int age[4] = {11,22,33,44};

    ```'
