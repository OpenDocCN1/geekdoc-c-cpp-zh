  md: "# 10.2 Unions\n\nUnion is a user defined data type just like structures. General\
    \ syntax of Union is also similar to that of structures.\n\n```\nunion structName\
    \ {\n  datatype element1;\n  datatype element2;\n  ...\n};\n```\n\nSo what is\
    \ the difference between union and structure ? As the name suggests, union is\
    \ the union of several data members of different types. All the data members are\
    \ stored at same memory location in union\n\n```\nunion X {\n  int i;\n  float\
    \ j;\n  double k;\n};\n```\n\n```\n// Inside main function, let's print...\nprintf(\"\
    %d\", sizeof(var)); // Prints 8...\n```\n\nThe size of union is equal to the size\
    \ of its biggest data member. In the above example, int and float occupy only\
    \ 4 bytes whereas double occupies 8 bytes. Hence the size of union X is 8 bytes.\n\
    \nIf all data members are stored at same memory address, it is not possible to\
    \ access all of them simultaneously. Thus, only one member contains meaningful\
    \ value in a Union at point of time. If you want to store value for all the data\
    \ members at same time, go for structures.\n\nUnions can be accessed in same way\
    \ as structures. All the properties of structure applies to unions."
