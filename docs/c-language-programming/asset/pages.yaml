  md: "# 1.1 General Structure of a C Program\n\nC program can be seen as a collection\
    \ of functions. A function is a collection of C statements. Every function is\
    \ designed to perform a particular task. The general structure of a C program\
    \ is shown below.\n\n+   - Comments\n- Preprocessor Directives\n- Global Variables\n\
    - main() {\n  - Local Variables\n  Statements\n}\n- Other Functions\n\nComments\
    \ can be written anywhere inside the code. Comments make it easier for others\
    \ to understand your program and hence should be written in abundance. It can\
    \ also serve the purpose of documentation. Comments can be written inside a /*\
    \ ... */ or // if they are single line comments.\n\nPreprocessor Directive are\
    \ processed by a preprocessor and the C code is modified before it passes through\
    \ C compiler. #include and #define are the most common preprocessor directives.\
    \ #include serves the purpose of including header files while #define is used\
    \ to define macros and constants. We will discuss more about them later.\n\nEvery\
    \ C program contains one or more functions, the one being main(). It is the first\
    \ function to execute. The local variables are specific to a function and can't\
    \ be used outside that function. If you want to use same variable in more than\
    \ one function, the best way is to declare it global. C statements are executed\
    \ one by one from top to bottom. It's time for us to write the first C program."
