    C language provides several functions for reading and writing data from/to a file.
    Let have a short introduction to them.


    # 11.2.1 fgetc fputc getchar putchar


    The function fgetc() is used to read one character at a time from the file. The
    call to fgetc() is shown below.


    ```

    FILE *fptr;

    char ch;

    // Open the file for reading...

    ```


    ```

    ch = fgetc(fptr); // Read a char..

    ```


    Above call reads a character from a file where fptr is pointing and increments
    the fptr pointer. If error occurs or whole file has been read, EOF is returned.
    Function getc() also works in the same way as fgetc() except that getc() can be
    implemented as macro for optimization. There is one more function getchar() which
    reads from stdin instead of other files.


    ```

    /* Below three lines perform same operation – Read a char from stdin */

    ch = getchar();

    ch = getc(stdin);

    ch = fgetc(stdin);

    ```


