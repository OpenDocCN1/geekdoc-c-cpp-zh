  md: '# Appendix 3. Two’s Complement


    Two’s complement method helps to represent negative numbers in binary format .
    Since computers understand only binary system of numbers, two’s complement method
    is really important when it has to deal with negative numbers.


    If a decimal number is positive, the most significant bit (MSB) in the binary
    representation is 0. However, if a decimal number is negative, the most significant
    bit in the binary representation is 1. It means that if we have a binary number
    1... 1110 0011 , we cannot convert it directly to decimal (as it is in 2’s complement
    form) . We need to convert it back to a number and copy the sign.


    2’s Complement of a number = 1’s Complement + 1 . Here, 1’s complement means Binary
    NOT or negation of a number. It has to be added with 1 to get the 2’s complement
    figuring. Interesting thing is that same formula can be applied to convert to
    2’s complement form vice versa. Let us use an example to understand this formula.


    1110 0011 – A number (MSB is 1, so number is negative...)


    0001 0110 – 1’s complement (Convert 1 to 0 and 0 to 1)

    1 – Add 1 to it (Binary OR)


    0001 0111 – Binary to Decimal gives 23. But since this was a negative number,
    Answer is -23.


    Let us convert the number -30 in binary form. Since it is a negative number, we
    need to find 2’s complement of +30 .


    0001 1110 - +30 in Binary


    1110 0001 – 1’s complement of +30...

    1 – Add 1 to it


    1110 0010 - -30 in binary...'
