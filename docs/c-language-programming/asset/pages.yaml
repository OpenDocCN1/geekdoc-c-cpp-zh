  md: '# Decimal to Binary Conversion


    Let us convert the number $147_{10}$ back to binary . We will divide the number
    147 successively by 2 and find the remainders.


    | Divisor | Dividend | Remainder |

    | 2 | 147 | |

    | 2 | 73 | 1 LSB |

    | 2 | 36 | 1 |

    | 2 | 18 | 0 |

    | 2 | 9 | 0 |

    | 2 | 4 | 1 |

    | 2 | 2 | 0 |

    | 2 | 1 | 0 |

    | 2 | 0 | 1 MSB |


    $147 / 2 = 73$ with a remainder of 1. $73 / 2 = 36$ with a remainder of 1. Keep
    dividing the numbers and find the remainders. The last remainder obtained is the
    most significant bit ( MSB ). Thus, arranging all the remainders from bottom to
    top gives us the binary number $10010011_2$.'
