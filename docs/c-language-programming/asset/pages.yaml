    int a = 5, b = 4, c = 6, d = 0;\n\nprintf(\"%d\",a > b); // Prints **1** as a\
    \ is greater than b...\nprintf(\"%d\",a >= 5); // Prints **1** as a is equal to\
    \ 5...\nprintf(\"%d\", a < b); // Prints **0** as a is not less than b...\nprintf(\"\
