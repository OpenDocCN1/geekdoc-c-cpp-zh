  md: '# 8.2 Dynamic Memory Allocation


    The memory we have allocated till now ( variables and arrays ) was fixed and static.
    But what if you need the memory which is not fixed, at runtime? Dynamic Memory
    allocation (DMA) is the solution here.


    Dynamic memory allocation is used when memory that is not fixed, is required at
    runtime. This can be achieved by call the functions malloc, calloc, realloc and
    free . Dynamic memory is allocated from the heap section. Let us define these
    functions before using them in a program.


    +   - Malloc - Malloc function allocates bytes of memory from the heap and returns
    a pointer to. If allocation memory fails, NULL is returned. Declaration is given
    below.

    `void * malloc(int size);`


    +   - Calloc - Calloc is similar to malloc. The difference is that calloc will
    set all the allocated memory to zero, thus avoiding the garbage. Declaration is
    given below.

    `void * calloc(int elements, int size_type);


    +   - Realloc - Realloc function reallocates the memory at given pointer by changing
    the block size of the memory. There might be some wastage of memory from the call
    to malloc/calloc which can be removed using realloc. Realloc can also increase
    the size of block if required. If realloc fails, NULL is returned. Declaration
    is given below.

    `void * realloc(void *ptr, int size);


    +   - Free - Free function frees the memory allocated by above functions. If the
    pointer already points to NULL, no operation will be performed. Declaration is
    given below.

    `void free(void *ptr);`


    Generic pointer void * is used in the declarations and hence this functions work
    with all the datatypes with type casting ( sometimes type casting is handled internally
    by the compiler ). The memory allocated is continuous and hence it can be accessed
    just like arrays. Let us see how these functions are called and what they do.'
