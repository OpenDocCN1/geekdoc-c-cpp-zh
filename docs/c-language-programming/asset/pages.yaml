  md: '# # Appendix 5. ASCII Table


    ASCII stands for American Standard Code for Information Interchange. It provides
    a standard for encoding the characters. ASCII defines 128 characters using 7-bits
    of an integer as shown below.


    | ASCII Hex Char | ASCII Hex Char | ASCII Hex Char | ASCII Hex Char |

    |---|---|---|---|---|---|---|---|

