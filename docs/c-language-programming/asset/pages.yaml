    printf("%d", sizeof(var)); // Prints 24...


    Here, everything is same except that char d[5] has been placed below char b. The
    3 bytes that were wasted by char b will be occupied by char d[5]. The remaining
    2 bytes of char d[5] are placed in next address where only 2 bytes will be unused.
    The size of structure will be 24 time. This, rearrangement of structure members
    can minimize the holes in structure . However, there is another way which removes
    all the holes in structure.


    #pragma pack(1) // Preprocessor Directive...


    Above preprocessor directive is used to reduce the packing size of a structure
    to 1 from default packing size. Include this line in program and note that the
    size of structure will be printed as you guessed earlier.


    # 10.1.9 Struct Bit Field


    If your program needs to make more efficient use of memory (at the cost of memory
    access time), struct bit fields can be used. Suppose we need to store only 1 or
    0 representing true or false inside a structure. This task can be done using 1
    bit (Refer Appendix 4). An integer 4 bytes (32 bits) Using struct bit field, we
    can make sure that 1 bit will be occupied.


    ```

    struct Bike {

    unsigned int gearless:1; // only 1 bit. Value - 1 or 0

    unsigned int cc:12; // only 12 bits. 2^12 – 1 = 4095

