  md: '```

    char grade[4] = {''A'',''B'',''C'',''D''};

    double rate[4] = {1.11,2.22,3.33,4.44};

    ```


    If arrays are not initialized, they will contain garbage value, So what happens
    in above initializations? We know that array index starts from 0. Above declaration
    of integer array is equivalent to following statements.


    ```

    age[0] = 11;

    age[1] = 22;

    ...

    ```


    Here age[0], age[1] are the array indices and are each equivalent to an integer
    variable. The same goes for arrays of different data types. The table given below
    shows how all these arrays are stored in the memory.


    | i | 0 | 1 | 2 | 3 |

    |---|---|---|---||}{

    | age[i] | 11 | 22 | 33 | 44 |

    | Address age | 1000 | 1004 | 1008 | 1012 |

    | grade[i] | ''A'' | ''B'' | ''C'' | ''D'' |

    | Address grade | 2000 | 2001 | 2002 | 2003 |

    | rate[i] | 1.11 | 2.22 | 3.33 | 4.44 |

    | Address rate | 3000 | 3008 | 3016 | 3024 |


    It is assumed that the array age starts from address 1000, grade from 2000 and
    rate to 3000 to keep it simple. Since an int occupies 4 bytes, the next array
    index starts from 1004 and so on. A char data type occupies only 1 byte and hence
    the next address is 2001. However, double occupies 8 bytes and hence 3008 is the
