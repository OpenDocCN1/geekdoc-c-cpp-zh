  md: '# 2.5 Operator Precedence


    Operator precedence needs to be taken into consideration when several operators
    are used in a single C statement. If precedence is not considered, the output
    won''t be as expected.


    For Example, a = 10 - 8 / 2 6(Division has higher precedence) to a instead of
    1(Subtraction done first which is wrong). The precedence table for operators is
    shown below with the precedence, decreasing in each row. The operators that have
    precedence are shown on the same line.


    | Operator Symbol | Associativity |

    | --- | --- |

    | O [] . -> | Left to Right |

    | ++ — (Unary +-) ~ & sizeof | Left to Right |

    | * / % | Left to Right |

    | + - | Left to Right |

    | << >> | Left to Right |

    | > <= >= | Left to Right |

    | == != | Left to Right |

    | & | Left to Right |

    | ^ | Left to Right |

    | | | Left to Right |

    | && | Left to Right |

    | || | Left to Right |

    | ? : | Right to Left |

    | = += - *= /= %= &= ^= |= << >> >= | Right to Left |'
