  md: '# # 9.3 Conditional Compilation


    The name itself suggests that compilation of code is done based on certain condition.
    If a condition is true, one block of code is compiled. If not, other block of
    code can be compiled. We see all the preprocessor directives used for conditional
    compilation.


    # ## 9.3.1 #ifdef #else #endif


    #ifdef stands for if defined . It tells the compiler to compile the block following
    it only if the macro following it is defined. If the macro is not defined, #else
    block is compiled if present. #endif is used to mark the termination of conditional
    compilation. General syntax for #ifdef is shown below.


    ```

    #ifdef MACRO

    Compile this block

    ...

    #endif

    ```


    A small example is shown below. Here, only the first printf will be present in
    the code after the preprocessor as PI is already defined. The \ is a preprocessor
    operator and is used to mark the continuation of bigger lines.


    ```

    #include <stdio.h>

    #define PI 3.141


    int main() {

    #ifdef PI

    printf("PI is defined and can be used" \

    "in the program...\n");

    #else

    printf("PI not defined");

    #endif


    // Code follows here...

    ```'
