  md: '# 2.1 Data Types


    There are several types to represent different types of data in C. But mainly,
    they can be classified into 4 types as shown below.


    +   - Basic Types: The data types used to hold arithmetic data are known as Basic
    types. Integers are the best example of Basic data types.

    - Enum Types: Enum or Enumerated types also hold arithmetic data. The main difference
    between Enum and basic types is that Enum can only contain distinct integer values.

    - Derived Types: These types are derived from the basic types to perform specific
    tasks. For Ex.: Array is a derived data type capable of holding several integer
    values.

    - Void Type: Void stands for no value


    # 2.1.1 Basic Types


    Basic types are used to define integer and floating-point numbers. There are two
    other types based on size and sign. The table given below shows list of all basic
    data types along their size, range and format specifiers.


    | Data Type | Qualifiers | Size in Bytes | Range | Format Specifier |

    |---|---|---|---|-|

    | char | signed char | 1 | -128 to 127 | %c |

    | | unsigned char | 1 | 0 to 255 | %c |

    | int | signed int | 4 | -2147483648 to 2147483647 | %d |

    | | unsigned int | 4 | 0 to 429467295 | %u |

    | | signed short | 2 | -32768 to 32767 | %hi |'
