  md: '# 5.2 Dereferencing or Memory Indirection


    Dereferencing means accessing the data present at the memory address pointed by
    the pointer. It is done using * operator. Now it looks similar to pointer declaration.
    But it works as a dereference operator. A small example is given below.


    ```

    int num = 4;

    int *ptr = &num; // Pointer initialized, now it points to num


    printf("%d", *ptr); // Dereferencing ptr...prints 4

    *ptr = 5; // Actually num has been modified to 5 here

    // Above statement is equivalent to num = 5;

    ```


    Pointers can store a memory address and hence their size remain the same regardless
    of its data type. However the size of pointer depends on the IDE/compiler the
    operating system parameters. It could be 2/4/8 bytes. However on a given system,
    if it give you 4 bytes for a int pointer, char pointer will also give you 4 bytes.
    This will be same for all the data types.


