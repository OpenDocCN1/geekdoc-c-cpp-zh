  md: '# Binary to Hexadecimal Conversion


    Here, we need to carry out the reverse process of what we did above. We need to
    represent a binary number in a group of 4 and find hex value for each of these
    groups. Grouping has to be done from rigth to left.


    Hence $(1011000111011011)_2 = (1011 0001 1110 1011)_2 = (B1EB)_{16}$.


    Also $(11010101101010)_2 = (11 0101 1011 0110)_2 = (35B6)_{16}$.


    Here, the most significant froup had only two digits 11 . To make it in a group
    of four , we need to add two 0’s to the left. Hence it becomes $0011$ i.e. $3_{16}$.'
