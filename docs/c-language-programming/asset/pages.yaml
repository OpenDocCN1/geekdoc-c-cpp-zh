  md: '# # 1.3 Tokens in C


    The basic elements inside a C program that the compiler can identify are called
    Tokens. C language has 5 types of tokens that help to design a program. They are
    Identifiers, Keywords, Constants, Operators and Strings. Identifiers are also
    known as variables. A C program is constructed using these basic elements.'
