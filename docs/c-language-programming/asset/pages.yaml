  md: '# 9. Preprocessor


    Preprocessor is a part of the compiler ( Refer Appendix 7 ). It converts the C
    source code into pure/Extended source code. Preprocessor performs following operations
    to C code.


    +   - Removal of Comments : Comments are removed from the C code by Preprocessor.


    +   - Macro Replacement : Macros are replaced by the expected values.


    +   - File Inclusion : Content of Header files are included by Preprocessor.


    +   - Conditional Compilation : Conditional Compilation occurs at this stage.


    Why do we need all these if preprocessor removes them? The reason is - Programs
    are easier to read, develop and modify using preprocessor directives . Preprocessor
    directives begin with a # symbol. Let us have a look at these preprocessor directives
    and understand their purpose.'
