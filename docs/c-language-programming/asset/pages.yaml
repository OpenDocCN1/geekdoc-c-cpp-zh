    # 11.2.4 fseek rewind


    fseek() function is used to change the position of file pointer. It has three
    arguments shown below.


    ```

    FILE *fptr;

    int n; // number of bytes

    int whence; // could be 0 1 or 2

    ```


    ```

    // 0 – SEEK_SET – Start of the file

    // 1 – SEEK_CUR – Current position

    // 2 – SEEK_END – End of the file

    ```


    ```

    fseek(fptr, n, whence);

    ```


    Thus, fseek() moves makes file pointer point n bytes from whence . This function
    returns 0 on success or -1 if error occurred. Small example is shown below.


