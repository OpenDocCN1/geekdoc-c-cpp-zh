    \nprintf(\"%d\", sizeof(of)); // Prints 28 (32 on some systems).\n\nThe output\
    \ to program is 28 (or 32). However, if you count the size of each structure member,\
    \ the answer should be 22 (4 + 1 + 4 + 5 + 8). Why the size of structure reported\
    \ than expected? The structure member alignment. This concept is also known as\
    \ structure packing (padding of structure) or holes in structure.\n\nStructure\
    \ member alignment is a method used to arrange the data and access it from the\
    \ memory. Every processor processes the memory in the form of words whose length\
    \ is equal to the data size. On a 32 bit machine, word size is of 4 bytes . It\
    \ means that data is aligned at the address in the multiples of 4 to improve the\
    \ speed of memory access and system performance. Even if a data occupies less\
    \ than 4 bytes, bytes are left unused and the next data is stored at next address\
    \ which is multiple of 4. These unused bytes are called holes in structure . A\
    \ complete picture of what happens in the memory is shown below.\n\n| 0 0 0 0\
    \ X X X 0 0 0 0 0 0 0 0 X X 0 0 0 0 0 0 0 0 |\n| int a; | char b; | float c; |\
    \ char d[5]; | double e; |\n| 1000 | 1004 | 1008 | 1012 | 1020 |\n\nHere 0 represent\
    \ used bytes.\nX represents unused bytes or Holes in Structure.\nAddresses are\
    \ assumed to start from 1000 and goes till 1028."
- md: "\nConsider another example.\n\n```\nstruct Y {\n  int a; // 4 bytes\n  char\
    \ b; // 1 byte\n  char d[5]; // 5 bytes\n  float c; // 4 bytes\n  double e; //\
    \ 8 bytes\n} var;\n```\n\nprintf(\"%d\", sizeof(var)); // Prints 24...\n\nHere,\
    \ everything is same except that char d[5] has been placed below char b. The 3\
    \ bytes that were wasted by char b will be occupied by char d[5]. The remaining\
    \ 2 bytes of char d[5] are placed in next address where only 2 bytes will be unused.\
    \ The size of structure will be 24 time. This rearrangement of structure members\
    \ can minimize the holes in structure. However, there is another way which removes\
    \ all the holes in structure.\n\n#pragma pack(1) // Preprocessor Directive...\n\
    \nAbove preprocessor directive is used to reduce the packing size of a structure\
    \ to 1 from default packing size. Include this line in program and note that the\
    \ size of structure will be printed as you guessed earlier.\n\n## 10.1.9 Struct\
    \ Bit Field\n\nIf your program needs to make more efficient use of memory (at\
    \ the cost of memory access time), struct bit fields can be used. Suppose we need\
    \ to store only 1 or 0 representing true or false inside a structure. This task\
    \ can be done using 1 bit (Refer Appendix 4). An integer 4 bytes (32 bits) Using\
    \ struct bit field, we can make sure that 1 bit will be occupied.\n\n```\nstruct\
    \ Bike {\n  unsigned int gearless:1; // only 1 bit. Value - 1 or 0\n  unsigned\
    \ int cc:12; // only 12 bits. 2^12 – 1 = 4095\n};\n// Range for gearless is 0\
    \ to 1...\n// Range for cc is 0 to 4095...\n```\n\nEven if struct bit field is\
    \ used, structure member alignment remains the same. So proper arrangement of\
    \ structure members is required to save the memory.\n\n## 10.1.10 Self-Referential\
    \ Structure\n\nA structure which is capable of pointing to a structure of its\
    \ own type is called self-referential structure. This is possible only if at least\
    \ one of its data member is a pointer to the same structure as shown below.\n\n\
    ```\nstruct Bike {\n  char brandModel[20];\n  int price;\n  int cc;\n  struct\
    \ Bike *next; // Pointer to structure of same type.\n}; // This is a self-referential\
    \ structure...\n```\n\nSelf-referential structures are used to create data structures\
    \ like linked list, tree, graph, stack, etc.\n\n## 10.2 Unions\n\nUnion is a user\
    \ defined data type just like structures. General syntax of Union is also similar\
    \ to that of structures.\n\n```\nunion structName {\n  int element1;\n  int element2;\n\
    };\n```\n\nSo what is the difference between union and structure? As the name\
    \ suggests, union is of several members of different types. All the data members\
    \ are stored at same location in union.\n\n```\nunion X {\n  int i;\n  float j;\n\
    \  double k;\n};\n```\n\nThe size of union is equal to the size of its biggest\
    \ data member. In the above example, int and float occupy only 4 bytes whereas\
    \ double occupies 8 bytes. Hence the size of union is 8 bytes.\n\nIf all data\
    \ members are stored at same memory address, it is not possible to access all\
    \ of them simultaneously. Thus only one member contains meaningful value at point\
    \ of time. Unions can be accessed in same way as structures.\n\n```c\nunion X\
    \ {\n    char a[4];\n    int b;\n    int c;\n};\n\nint main() {\n  union X x;\n\
    \  strcpy(x.a, \"Hey\");\n\n  x.b = 10;\n  x.c = 20;\n\n  printf(\"%s\", x.a);\
    \ // Prints Hey...\n  printf(\"%d\", x.b); // Prints 10...\n  printf(\"%d\", x.c);\
    \ // Prints 20...\n}\n```\n\nx.b and c are stored at same memory address, both\
    \ will have same value when printed. However, x.a can't be used with x.b or c.\n\
    \n## Program 10-4: Print binary equivalent of float\n\n```c\n/* Program to print\
    \ binary equivalent of float using union. Another method */\nunion X {\n    int\
    \ a;\n    float f;\n};\n\nint main() {\n  union X x;\n  int i;\n\n  x.f = 10.23;\
    \ // float number\n\n  // We assigned value to x.f but we operate on x.a\n  //\
    \ Bitwise operations can't carried on real data.\n  for(i = 31; i>=0; i--) {\n\
