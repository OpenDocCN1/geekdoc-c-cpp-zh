    );\n  }\n}\n```\n\n## 10.3 枚举 (Enums)\n\nEnum代表枚举（Enumerated）。它也是一种用户定义类型。枚举用于通过名称标识多个整数常量。枚举成员的值从0开始赋值。枚举的通用语法如下。\n\
    \n```\nenum enum_name {\n  member1, // Value is 0...\n  member2, // Value is 1...\n\
    \  member3 // Value is 2...\n};\n```\n\n让我们定义星期几。\n\n```c\nenum days_of_week {\n\
    \  sunday,\n  monday,\n  tuesday,\n  wednesday,\n  thursday,\n  friday,\n  saturday\n\
    };\n\nint main() {\n  enum days_of_week today, tomorrow;\n  today = friday;\n\
