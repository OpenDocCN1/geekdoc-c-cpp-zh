    a block of code based on certain conditions, can execute it repeatedly, jump to
    a block of code and can make decisions. C language supports conditional control
    control statements, unconditional control statements as well as loops as shown
    in the table below.


    | Conditional Control | Unconditional Control | Loops |

    | if...else if...else | break | while |

    | switch...case | continue | do while |

    | | goto | for |

    | | return | |'
