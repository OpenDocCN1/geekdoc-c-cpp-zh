    # Preface


    C is the most common and powerful programming language used for creating wide
    variety of applications. Unix-based operating system was completely written in
    C. C is a mid-level programming language because it is capable to perform both
    low-level programming and cross-platform programming. C works closely with the
    memory and can interact with the hardware easily. It is this reason that it makes
    an ideal programming language for writing device drivers and performing system
    programming. C language provides several operators to perform complex operations.
    C is portable to the source level.


    Many modern programming languages are derived fully or partially from C language.
    Once you get your hands on C language, you can switch on to any other programming
    language easily. Hence, if you are new to programming, C language is undoubtedly
    the best choice.


    This book has been designed to explain each and every concept in detail. C is
    not just theory. Hence appropriate programs are used to explain the theories.
    There are several solved programs with detailed explanation. For practice, exercises
    are provided with a hint to solve them.


    Pointer is one of the major topics. Some students find it confusing and avoid
    studying it. However, this book presents pointers in the most interesting way
    with several examples. Applications of pointers like command line arguments and
    dynamic memory allocation are also explained. The book concludes with Data Structures.
    The appendix provided at the end of the book explains several concepts that are
    not part of C but are required.


    The main goal of this book is to impart maximum knowledge regarding C to students
    to make them better programmers. You can now connect the author of the book in
