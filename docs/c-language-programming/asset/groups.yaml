  - '[PAGE 249]


    # # Appendix 6. Primary Memory Layout


    Primary memory is where the applications/processes run. RAM (Random Access Memory)
    is also a primary memory. Regardless of the architecture used by the system, the
    memory is divided in four major segments.


    ![](img/852a18c39758ea225fff4350618abf80_249_0.png)'
- md: '

    # Stack


    Stack area contains the stack allocated to the programs. It consists of automatic
    variables, function calls, return addresses as well as formal arguments. Stack
    follows LIFO algorithm (i.e. Last In First Out). Stack is separated with Heap
    area by a free space. It means that if the stack pointer meets the heap pointer,
    memory gets exhausted. However, current architectures support large memory spaces
    along with virtual memories. Hence both of these sections are placed far away
    from each other. Depending on the system architecture, they grow towards higher
    or lower addresses. On Intel X86 based CPUs, stack grows towards zero i.e. lower
    addresses.


    # Heap


    Heap area starts at the end of the data section. Whenever the memory is allocated
    dynamically (using malloc, calloc, realloc and freed using free), it is stored
    inside the heap area. Heap area is shared by all the threads, dynamic modules
    and shared libraries. Dynamic memory can also be allocated from the virtual address
    space using the functions mmap and munmap.


    # Data


    The data section is divided into two parts – uninitialized data and initialized
    data.


    - All the static and global variables that are initialized at the time of declaration
    come under Data Section (Initialized Data). The static variables defined inside
    the functions are not the part of this area.

    - All the global and static variables that are initialized to 0 (No explicit initialization)
    comes under BSS (Uninitialized Data).


    # Code


    This can be called code or text. Code section contains actual instruction sets
    to be executed. It is normally placed below the data section as shown in the above
    diagram. Code section is kept read-only so that one program doesn''t affect the
    instruction sets of another.


    # Appendix 7. Compiler


    A compiler is a program that converts the source code into executable file. Several
    modules work as a single unit to perform this operation. The diagram given below
    shows how a compiler converts the source program to an executable file.


    ![](img/852a18c39758ea225fff4350618abf80_255_0.png)


    Each module is explained below.


    # Preprocessor


    Preprocessor converts source C program to extended/pure C code. Following operations
    are performed at the preprocessor level.


    - Removal of Comments

    - Macro Replacement

    - File Inclusion

    - Conditional Compilation


    If you are using gcc, the command `gcc -E program.c -o program.i` can be used
    to generate the preprocessor intermediate output.


    # Translator


    Translator translates the high level C code to assembly code. The command `gcc
    -S program.i -o program.s` can be used to generate the intermediate output.


    # Assembler


    Assembler converts the assembly code to opcodes. Opcodes are lower level codes
    that specify the instructions to be performed. The command `gcc -c program.s -o
    program.o` is used to generate the output from assembler.


    # Linker


    Linker adds additional content to make it an executable for the given operating
    system. It also links the executable file to the standard libraries. The command
    used is `gcc program.c` which generates the executable file with the default name
    a.out.

    '
  mdcn: '


    # 栈 (Stack)


    栈区域包含程序分配的栈。它由自动变量、函数调用、返回地址以及形式参数组成。栈遵循 LIFO 算法（即后进先出）。栈与堆（Heap）区域由一段空闲隔开。这意味着如果栈指针遇到堆指针，内存就会耗尽。然而，当前的架构支持大内存空间以及虚拟内存。因此，这两个区域被放置在很远的地方。根据系统架构，它们向高地址或低地址增长。在基于
    Intel X86 的 CPU 上，栈向零（即低地址）增长。


    # 堆 (Heap)


    堆区域始数据段的结尾。每当动态分配内存（使用 `malloc`、`calloc`、`realloc` 并使用 `free` 释放）时，内存存储在堆区域。堆区域由所有线程、动态模块和共享库共享。也可以使用
    `mmap` 和 `munmap` 函数从虚拟地址空间分配动态内存。


    # 数据 (Data)


    数据段分为两部分——未初始化数据和已初始化数据。


    - 所有在声明时已初始化的静态和全局变量都属于数据段（已初始化数据）。在函数内部定义的静态变量不属于此区域。

    - 所有初始化为 0（无显式初始化）的全局和静态变量都属于 BSS（未初始化数据）。


    # 代码 (Code)


    这可以通过代码或文本段。代码段包含要执行的实际指令集。如上所示，它通常位于数据段下方。代码段保持为只读，以确保一个程序不会影响另一个程序的指令集。


    # 附录 7 编译器 (Compiler)


    编译器是一个将源代码转换为可执行文件的程序。多个模块作为一个单元工作以执行此操作。下图显示了编译器如何将源程序转换为可执行文件。


    ![](img/852a18c39758ea225fff4350618abf80_255_0.png)


    下面是对每个模块的解释。


    # 预处理器 (Preprocessor)


    预处理器将 C 语言程序转换为扩展/纯 C 代码。在预处理器级别执行以下操作：


    - 移除注释

    - 宏替换

    - 文件包含

    - 条件编译


    如果你正在使用 `gcc`，可以使用命令 `gcc -E program.c -o program.i` 来生成预处理器的中间输出。


    # 翻译器 (Translator)


    翻译器将高级 C 代码转换为汇编代码。可以使用命令 `gcc -S program.i -o program.s` 生成中间输出。


    # 汇编器 (Assembler)


    汇编器将汇编代码转换为操作码。操作码是指定要执行指令的低级代码。使用命令 `gcc -c program.s -o program.o` 生成汇编器的输出。


    # 链接器 (Linker)


    链接器添加额外内容使其成为适用于给定操作系统的可执行文件。它还将将可执行文件链接到标准库。使用的命令是 `gcc program.c`，它会生成默认名为 `a.out`
    的可执行文件。


    '
