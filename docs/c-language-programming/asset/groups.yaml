    \ functions for reading and writing data from/to a file. Let us have a short introduction\
    \ to them.\n\n### 11.2.1 fgetc fputc getchar putchar\n\nThe function fgetc() is\
    \ used to read one character at a time from the file. The call to fgetc() is shown\
    \ below.\n\n```c\nFILE *fptr;\nchar ch;\n// Open the file for reading...\n```\n\
    \n```c\nch = fgetc(fptr); // Read a char..\n```\n\nAbove call reads a character\
    \ from a file where fptr is pointing and increments the fptr pointer. If error\
    \ occurs or whole file has been read, EOF is returned. Function getc() also works\
    \ in the same way as fgetc() except that getc() can be implemented as macro for\
    \ optimization. There is one more function getchar() which reads from stdin instead\
    \ of other files.\n\n```c\n/* Below three lines perform same operation – Read\
