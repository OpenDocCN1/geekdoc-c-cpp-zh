    \ as shown.\n\n```c\nint name[3][3] = {1, 2, 3, 4, 5, 6, 7, 8, 9};\n```\n\nLet\
    \ us assign values to whole array using a loop and user input.\n\n```c\nint name[3][3];\n\
    int rows = 3;\nint cols = 3;\nint i;\nint j;\n```\n\n```c\nprintf(\"Enter 9 values\
    \ for a 2D array with rows = col = 3\\n\");\n```\n\n```c\nfor(i = 0; i < rows;\
    \ i++) { // i runs from 0 to 2\n    for(j = 0; j < cols; j++) { // j runs from\
    \ 0 to 2\n        scanf(\"%d\", &name[i][j]);\n    }\n}\n```\n\nYou can access\
    \ all the values of 2D array by writing similar loops. As you know, array name\
    \ indicates address. The same goes in two dimensional arrays as well. However,\
    \ 2D array is a collection of 1D arrays (rows). Each row is also an address. name[0],\
    \ name[1] and name[2] represents address of 1st, 2nd and 3rd row respectively.\n\
    \nIf an array is partially initialized, all the other elements will become 0.\
    \ Hence, below two array definitions provide value to all the indexes.\n\n```c\n\
    int name[2][2] = {{1,0}, {0,0}};\nname[2][2] = {1};\n```\n\nSince there are row\
    \ x column elements in any 2D array, any 2D array occupies row x column sizeof(data-type)\
    \ bytes.\n\n```c\ndouble name[3][4];\n```\n\n```c\nprintf(\"%d\",sizeof(name));\
    \ // Prints 96. (3x4x8)...\n```\n\n**Program 4-5:** We have 3 students, each having\
    \ 4 subjects. Use a 2D array and initialize it with the marks of each student.\
    \ Print all the marks and the average for all the students.\n\n```c\n/* Program\
    \ to store marks of 3 students in a 2D array and print the result back... */\n\
    ```\n\n```c\nint main() {\n    int marks[3][4] = {\n        {67, 74, 82, 56},\n\
    \        {75, 54, 65, 81},\n        {75, 49, 98, 78}\n    };\n    int students\
    \ = 3, subjects = 4;\n    int total;\n    float average;\n    int i;\n    int\
    \ j;\n    for(i = 0; i < students; i++) {\n        printf(\"Student ID:%d\\tMarks:\\\
    t\", i);\n        for(j = 0, total = 0; j < subjects; j++) {\n            printf(\"\
    %d\\t\", marks[i][j]);\n            total += marks[i][j];\n        }\n    }\n\
    \    average = (float) total / subjects; // type casted\n\n    printf(\"Average:%.2f\\\
    n\", average);\n}\n```\n\nWe have used nested loops to print the results. For\
    \ a better formatted output, we did the rest part. Variable total is initialized\
    \ to 0 for every student and total is calculated for them. Once we have the total,\
    \ we can compute the average by dividing it by number of subjects. The (float)\
    \ in the average computation represents the type casting (from int to float).\n\
    \nIn the last printf statement, we have use %.2f . It helps to print the float\
    \ numbers with two decimal places. Remove it and you can see the default output.\
    \ Since we are discussing formatting, there is one more thing that you can do\
    \ here.\n\n```c\nprintf(\"Average:%10.2f\\n\", average);\nprintf(\"Average:%10f\\\
    n\", average);\n```\n\nHere, represent the width in which the number will be outputted.\
    \ The best way to view it is %[width].[decimals][type].\n\n## 4.3.2 Three Dimensional\
    \ Arrays\n\nThree Dimensional (3D) arrays can be viewed as a collection of two\
    \ dimensional (2D) arrays.\n\n```c\nint name[2][3][4];\n```\n\nHere, name is a\
    \ 3D array which can be viewed as a collection of two 2D arrays. Each of these\
    \ 2D array is a collection of three 1D arrays. Each 1D array has 4 integers. Let\
    \ us initialize a small 3D array.\n\n```c\nint array[2][2][2] = { {{1,2},{3,4}\
    \ }, {{5,6},{7,8} } };\n```\n\n3D arrays can be assigned values in same way as\
    \ you do for 2D arrays except that three nested loops are required here.\n\nExercise\
    \ 4-4: Declare a three dimensional array – int name[2][3][4]; . Assign values\
    \ to it and print the values back.\n\n## 5. Pointers\n\nPointer is a variable\
    \ capable of holding an address of another variable. The strength of C as a language\
    \ lies in the use of Pointers. Pointers make several things possible in C. Some\
    \ languages derived from C have eliminated the concept of Pointers. However, it\
    \ is highly important in C language. Simply put, Pointers point to a memory address.\n\
    \n### 5.1 Pointer Declaration, Initialization and Assignment\n\nPointers can be\
    \ declared as follows. It is similar to normal variable declaration. However it\
    \ stores the address of a variable. \n\n```c\nint *ptr;\n```\n\nPointers can be\
    \ initialized with the address of a variable using the & operator. \n\n```c\n\
    int num = 10;\nint *ptr = &num;\n```\n\nWe can also assign values to the pointed\
    \ memory using the * operator.\n\n```c\n*ptr = 20;\n```\n\nThis will change the\
    \ value of the variable.\n\n### 5.2 Dereferencing\n\nDereferencing means accessing\
    \ the data present at memory address pointed by. It is done using * operator.\n\
    \n```c\nint num = 4;\nint *ptr = &num;\nprintf(\"%d\", *ptr); // prints 4\n*ptr\
    \ = 5; // Actually num has been modified to 5\n```\n\nDereferencing an int pointer\
    \ gives an int (4 bytes). Dereferencing a char pointer gives char (1 byte). So\
    \ even if the sizes of all the pointers are same, their dereferencing properties\
    \ are different. Consider the following example to understand it better.\n"
  mdcn: "\n通过查看行和列号，可以清晰地识别每一个元素。初始化时也可以不写内部的大括号，如所示。\n\n```c\nint name[3][3] = {1,\
    \ 2, 3, 4, 5, 6, 7, 8, 9};\n```\n\n让我们使用循环和用户输入为整个数组赋值。\n\n```c\nint name[3][3];\n\
    int rows = 3;\nint cols = 3;\nint i;\nint j;\n```\n\n```c\nprintf(\"Enter 9 values\
    \ for a 2D array with rows = col = 3\\n\");\n```\n\n```c\nfor(i = 0; i < rows;\
    \ i++) { // i 从 0 运行到 2\n    for(j = 0; j < cols; j++) { // j 从 0 运行到 2\n    \
    \    scanf(\"%d\", &name[i][j]);\n    }\n}\n```\n\n你可以通过编写类似的循环来访问二维数组的所有值。如你所知，数组名表示地址。二维数组也是如此。然而，二维数组是一一维数组（行）的集合。每一行也是一个地址。name[0],\
    \ name[1] 和 name[2] 分别代表第 1、第 2 和第 3 行的地址。\n\n如果数组被部分初始化，所有其他元素将变为 0。因此，下面的两个数组定义为所有索引提供了值。\n\
    \n```c\nint name[2][2] = {{1,0}, {0,0}};\nname[2][2] = {1};\n```\n\n由于任何二维数组都包含行\
    \ x 列个元素，任何二维数组都占用行 x 列 x sizeof(data-type) 字节。\n\n```c\ndouble name[3][4];\n\
    ```\n\n```c\nprintf(\"%d\",sizeof(name)); // 输出 96. (3x4x8)...\n```\n\n**程序 4-5:**\
    \ 我们有 3 个学生，每个学生有 4 门课程。使用二维数组并每个学生的成绩进行初始化。打印所有分数以及所有学生的平均分。\n\n```c\n/* 在二维数组中存储\
    \ 3 个学生的成绩并打印回结果的程序... */\n```\n\n```c\nint main() {\n    int marks[3][4] = {\n\
    \        {67, 74, 82, 56},\n        {75, 54, 65, 81},\n        {75, 49, 98, 78}\n\
    \    };\n    int students = 3, subjects = 4;\n    int total;\n    float average;\n\
    \    int i;\n    int j;\n    for(i = 0; i < students; i++) {\n        printf(\"\
    Student ID:%d\\tMarks:\\t\", i);\n        for(j = 0, total = 0; j < subjects;\
    \ j++) {\n            printf(\"%d\\t\", marks[i][j]);\n            total += marks[i][j];\n\
    \        }\n    }\n    average = (float) total / subjects; // 类型强制转换\n\n    printf(\"\
    Average:%.2f\\n\", average);\n}\n```\n\n我们使用了嵌套循环来打印结果。为了获得更好的格式化输出，我们完成了剩余部分。变量\
    \ `total` 为每个学生都初始化为 0，并为他们计算了总和。一旦我们有了总和，就可以通过将其除以科目数来计算平均值。平均值计算中的 `(float)`\
    \ 代表类型转换（从 int 转换为 float）。\n\n在最后一个 `printf` 语句中，我们使用了 `%.2f`。它帮助以两位小数打印浮点数。移除它你就可以看到默认输出。由于我们正在讨论格式化，这里还有另一件你可以做的事。\n\
    \n```c\nprintf(\"Average:%10.2f\\n\", average);\nprintf(\"Average:%10f\\n\", average);\n\
    ```\n\n这里，代表数字输出的宽度。最好的查看方式是 `%[width].[decimals][type]`。\n\n## 4.3.2 三维数组\n\n\
    三维（3D）数组可以被视为二维（2D）数组的集合。\n\n```c\nint name[2][3][4];\n```\n\n在这里，name 是一个三维数组，它可以被视为两个二维数组的集合。这些二维数组中的每一个都是三个一维数组的集合。每个一维数组有\
    \ 4 个整数。让我们初始化一个较小的三维数组。\n\n```c\nint array[2][2][2] = { {{1,2},{3,4} }, {{5,6},{7,8}\
    \ } };\n```\n\n三维数组赋值的方式与你对二维数组的操作相同，不同在于这里需要三层嵌套循环。\n\n练习 4-4：声明一个三维数组 – `int\
    \ name[2][3][4];`。给它赋值并打印回值。\n\n## 5. 指针\n\n指针是一个能够存储另一个变量地址的变量。C 语言作为一种语言的强大在于指针的使用。指针让\
    \ C 中的许多事情成为可能。某些派生自 C 的语言消除了指针的概念。然而，它在 C 语言中非常重要。简单来说，指针指向内存地址。\n\n### 5.1 指针的声明、初始化和赋值\n\
    \n指针可以如下所示声明。这与普通变量的声明相似。然而它存储变量的地址。\n\n```c\nint *ptr;\n```\n\n指针可以使用 `&` 运算符使用变量地址进行初始化。\n\
    \n```c\nint num = 10;\nint *ptr = &num;\n```\n\n我们还可以使用 `*` 运算符向所指向的内存赋值。\n\n\
    ```c\n*ptr = 20;\n```\n\n这将会改变变量的值。\n\n### 5.2 解引用\n\n解引用意味着访问指针所指内存地址处的数据。它通过\
    \ `*` 运算符完成。\n\n```c\nint num = 4;\nint *ptr = &num;\nprintf(\"%d\", *ptr); //\
    \ 输出 4\n*ptr = 5; // 实际上 num 已修改为 5\n```\n\n解引用 int 指针得到一个 int（4 字节）。解引用 char\
    \ 指针得到 char（1 字节）。所以即使所有指针的大小相同，它们的解引用属性也是不同的。考虑以下示例以更好地理解。\n\n"
