    # 1. C 语言简介


    C 是一种通用的结构化编程语言。C 介于机器理解的低级语言和传统的高级语言之间。这意味着 C 语言既可以编写系统程序，也可以编写应用程序。丹尼斯·里奇在20世纪70年代初在
    AT&T贝尔实验室开发了 C。随后它被用于重写 Unix 操作系统。许多编程语言都完全或部分基于 C，包括 C++、Java、C#、Perl、Python、PHP
    等。


    C 仅包含32 个关键字。C 的主要力量在于 C 库，它包含了执行各种操作的函数。此外，用户可以为其添加自己的函数，因此它是可扩展的。C 程序是可移植的，这意味着在一个操作系统上编写的程序可以很容易地在另一个上运行，只需很少修改。需要注意的是，移植性仅适用于源代码，而不适用于可执行文件。


    在学习编程语言时，C 是大多数学生的首选。本书假设你没有任何编程语言知识，并旨在引导你从 C 语言基础过渡到更高级的程序。如果你熟悉介绍章节，可以跳过它们并进入下一节。在陷入理论之前，让我们先看看
    C 程序的通用结构并编写第一个 C 程序。


