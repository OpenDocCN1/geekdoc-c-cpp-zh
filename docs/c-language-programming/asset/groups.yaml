    # 4.2 Strings


    Strings in C are a collection of characters. Even a char array can be considered
    as a collection of characters. So what is the exact difference between the two?
    Strings are terminated by a null character ''\0''. Consider the below code snippet.


    ```

    // Initialize array1 with a set of characters...

    char array1[] = {''S'',''T'',''R'',''I'',''N'',''G''};

    // Initialize array2 with a string...

    char array2[] = "STRING";


    printf("%d", sizeof(array1)); // will print 6

    printf("%d", sizeof(array2)); // will print 7

    ```


    Here, array1 is a char array and is initialized with a group of characters. Whereas,
    array2 is a char array initialized with a string. Even though both seem to hold
    similar data, the first print gives 6 while the second print 7. This is because
    of the presence of null character until the array2 at last. The actual difference
    between array1 and array2 is shown below.


    array1


    ![](img/852a18c39758ea225fff4350618abf80_78_0.png)


    array2


    ![](img/852a18c39758ea225fff4350618abf80_78_1.png)


    Please note the presence of ''\0'' at the last index of array2. If we want to
    print whole string, we can print them character by character (or index by index)
    %c . However, C provides a format specifier especially for strings (%s). If %s
    is used inside printf statement, it prints the characters until it finds the null
    character (''\0''). So you can now guess what the following printf statements
    will print.


    ```

    printf("%s", array1);

    ```'
