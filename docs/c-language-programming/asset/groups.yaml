    \ // 错误。Bike 不是一个类型。\nprintf(\"%d\", sizeof(struct Bike)); // 输出其大小...\n\nprintf(\"\
    %d\", sizeof(car)); // 错误。car 不是一个类型??\nprintf(\"%d\", sizeof(struct car)); //\
    \ 输出其大小...\nprintf(\"%d\", sizeof(CAR)); // CAR 是一个类型。打印它的大小。\n```\n\n## 10.1.8\
    \ 结构体成员对齐\n\n考虑以下结构体并猜它的大小是多少。\n\n```c\nstruct X {\n  int a; // 4 字节\n  char b;\
    \ // 1 字节\n  float c; // 4 字节\n  char d[5]; // 5 字节\n  double e; // 8 字节\n};\n\
    struct X var;\n\nprintf(\"%d\", sizeof(var)); // 输出 28（某些系统上为 32）。\n```\n\n程序的输出是\
    \ 28（或 32）。然而，如果你计算每个结构体成员的大小，答案应该是 22 (4 + 1 + 4 + 5 + 8)。为什么结构体的大小比预期的多？结构体成员对齐。这个概念被称为结构体填充（padding）或结构体空隙。\n\
    \n结构体成员对齐是一种用于排列数据并从内存访问数据的方法。每个处理器以长度等于数据大小字的形式处理内存。在 32 位机器上，字的大小为 4 字节。这意味着数据对齐在\
    \ 4 的倍数地址上，以提高内存访问速度和系统性能。内存中发生情况的完整视图所示。\n\n| 0 0 0 0 X X X 0 0 0 0 0 0 0 0 X\
    \ X 0 0 0 0 0 0 0 0 |\n| int a; | char b; | float c; | char d[5]; | double e;\
    \ |\n| 1000 | 1004 | 1008 | 1012 | 1020 |\n\n这里 0 代表已使用的字节。\nX 代表未使用的字节或结构体空隙。\n\
    假设地址从 1000 开始到 1028。\n\n"
