- md: "\n```c\nchar *cptr = &a; // Assigned address of a integer to char pointer...\n\
    // De-ferencing a char pointer gives a char i.e. 1 byte...\n```\n\n```c\nprintf(\"\
    %x\", *cptr); // %x to print Hex numbers...\n// Prints 12 or 78 based on Big Endian\
    \ or Little Endian\n```\n\nThis program will give a warning at the time of compilation\
    \ as we are assigning address of int variable to a char pointer. We know that\
    \ dereferencing a char outputs a single char (or 1 byte data). Hence printf statement\
    \ prints 12 or 78 ( 12345678 ) i.first byte or the last byte based on Endianness.\n\
    \nEndianness indicates how the data is stored in the memory. In Little Endian\
    \ format, LSB (Least Significant byte) is stored in the lower address . In Big\
    \ Endian format, MSB (Most Significant Byte) is stored in the lower address .\
    \ For Example, Intel CPUs follow Little Endianness while Motorola and ARM based\
    \ processors follow Big Endian . Table given below explains the memory storage\
    \ for both Endianness.\n\n| Data | Big Endian | 12 | 34 | 56 | 78 |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| Data Little Endian | 78 | 56 | 34 | 12 |\n| Memory\
    \ Address | 1000 | 1001 | 1002 | 1003 |\n\nIt is assumed that int a is stored\
    \ in memory address 1000-1003 . The difference between Little and Big Endian is\
    \ clearly evident. You can confirm the Endianness of your system by running this\
    \ program and verifying the output ( 12 for Big Endian and 78 for Little Endian\
    \ ).\n\n# Program 5-3: Write a program to print the binary equivalent of float\
    \ variable.\n\n```c\n/* Program to print binary equivalent of float number. Let’s\
    \ use int pointer and make it point to a float number.\n```\n\nWhen data will\
    \ be retrieved, though both int and float are bytes, dereferencing (retrieval)\
    \ will be different. Data will be retrieved as if it is a int. Hence logic for\
    \ printing binary equivalent of int can be applied.\n\n```c\n/*\nint main() {\n\
    \    float f = 10.23; // Some float number...\n    int *ptr;\n    int num;\n \
    \   int i;\n\n    ptr = &f; // int pointer points to float variable...\n\n   \
    \ // dereference int pointer and get value in num\n    num = *ptr;\n\n    // Logic\
    \ to print binary equivalent of an int...\n    for(i = 31; i>=0; i-- ) {\n   \
    \     num & (1<<i ) ? printf(\"1\") : printf(\"0\");\n    }\n}\n```\n\nYou can\
    \ find the binary equivalent of float manually using the method discussed in Chapter\
    \ 2 to compare the results.\n\n**Exercise 5-1**: Write a program to print the\
    \ binary equivalent of double variable.\n\nRecall last part of the **Section 5.1.**\
    \ If a pointer points to the 0th index of an array, pointer can be used to access\
    \ all the indexes in the same way you do using array.\n\n# 5.3 Pointer Arithmetic\n\
    \nPointer represents a memory address. It means that pointer arithmetic deals\
    \ with arithmetic operations on addresses. Assume that we have int pointer pointing\
    \ at location address 1000. If we add 1 to it, pointer will jump 4 bytes (because\
    \ it is an int pointer) and will point to 1004. Let us use this concept and write\
    \ a program.\n\nProgram 5-4: Print all the numbers in an int array using pointer.\n\
    \n```c\n/* Program to print an int array... */\n\nint main() {\n    int array[5]\
    \ = {11,22,33,44,55};\n    int *ptr;\n    int i;\n\n    ptr = array; // points\
    \ to 0th index of array...\n    /* *** METHOD 1 ***\n    // use pointer like an\
    \ array\n    // Pointer ptr keeps pointing to the 0th index...\n    for(i = 0;\
    \ i < 5; i++) {\n        printf(\"%d\\n\", ptr[i]);\n    }\n    */\n\n    /* ***\
