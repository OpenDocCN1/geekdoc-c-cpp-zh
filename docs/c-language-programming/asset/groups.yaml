    \n    if(n > 9)\n        reverse(n/10); // 删除最后一位...\n\n    // 如果 n <= 9，它是一个位数并且已经打印过了\n\
    }\n\nint main() {\n    int number;\n\n    printf(\"Enter a number:\\t\");\n  \
    \  scanf(\"%d\", &number);\n\n    reverse(number);\n}\n```\n\n通过取示例数字来可视化上述程序。你可以尝试将递归应用于任何用循环完成的程序中。\n\
    \n## 6.7 函数指针\n\n就像数组名表示其基地址一样，函数名也表示其基地址。函数指针占用的字节数与普通指针相同。唯一的区别是它指向的是函数而不是变量。它也可以称为函数指针。函数指针的声明语法所示。\n\
    \nreturn_type (*ptrName) (参数的数据类型);\n\n识别以下声明代表什么。\n\nint *p1[3]; // p1 是一个包含\
    \ 3 个指针的数组...\n\nint (*p2)[3]; // p2 是一个指向数组（3个 int）的指针...\n\nint * p3(int); /*\
    \ p3 是一个函数声明，该函数接受 1 个 int 作为参数并返回 int *（int 指针） */\n\nint * (*p4)(int); // p4\
