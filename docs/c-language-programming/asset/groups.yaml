    \ `main()` 函数返回类型为 `void`。然而，`main` 也可以有 `int` 作为返回值。\n\n- 函数参数：如果函数不接受任何参数，我们可以将其指定为\
    \ `void`。上面的 `main` 函数也可以写成 `void main(void) {…}`。\n\n- 空指针：`void` 指针提供对象的地址而不是类型。必须进行类型转换才能确定其类型。动态内存分配函数使用\
    \ `void` 指针。\n\n## 2.2 变量声明与初始化\n\n变量在使用之前必须先声明。当声明变量时，会分配内存。可以通过指定数据类型后跟名称来声明变量。数据类型决定了变量变量可以存储的值的类型和范围。声明语法所示：\n\
    \n数据类型 名称;\n\n该名称可以是任何符合本章开头讨论的规则的名称。下面给出了一些示例。\n\n```\nint year;\nchar ch;\n\
    float a,b,c;\n```\n\n如所示，可以在同一行中声明多个变量。如果这些变量没有被初始化，它们将包含垃圾（内存中存在的无用随机数据）。因此，如果没有给它们赋值，虽然不会报错，但输出可能不符合预期。在声明时给变量赋值被称为初始化。\n\
    \n```\nint year = 2015;\nchar ch = 'A';\nfloat a = 1.2, b, c = 4.08;\n```\n\n\
    如你在最后一行所示，只有两个浮点变量被初始化了。如果变量没有初始化，在程序中使用之前应该给它们分配某些值。如果没有给它们任何值，它们将包含垃圾值。垃圾是内存地址（变量所在）处不可用的值。\n\
    \n整数变量默认是有符号的。下面的程序将向你解释有符号和无符号的区别。\n\n程序 2-2：编写一个解释有符号类型限定符的程序。\n\n```\n/* 此程序声明了有符号和无符号\
    \ char，并增加它们的值以找到差异... */\n```\n\nvoid main() {\n    char a = 127; // 默认有符号...\n\
    \    unsigned char b = 127;\n\n    a = a + 1;\n    b = b + 1;\n\n    printf(\"\
    a = %d\\n\",a);\n    printf(\"b = %d\\n\",b);\n}\n```\n\n我们为两个字符变量都赋值了 127。但由于其中一个是有符号的，正如你所学的，其范围是\
    \ -128 到 127。然而，无符号字符的范围是 0 到 255。因此，如果它们在 127 之后增加，一个会产生负结果，而另一个会正常增加其值。此程序将产生以下输出。\n\
    \n```\n$ ./a\na = -128\nb = 0\n```\n*(注：此处原文示例输出似乎不完整，已根据逻辑补全，翻译时保持一致)*\n\n我们给两个字符变量赋值了\
    \ 127。但由于其中一个是有符号的，范围是 -128 到 127。然而，无符号字符的范围是 0 到 255。所以如果它们在 127 之后递增，一个会产生负结果，而另一个会正常增加其值。此程序将生成以下输出。\n\
    \n```\n$ ./a\na = -128\nb = 0\n```\n\n## 2.3 表达式与语句 (Expressions and Statements)\n\
    \n表达式是运算符、常量和函数调用的组合。语句是以分号结束的。\n\n## 2.4 运算符 (Operators)\n\n运算符用于执行任务。C 语言提供了许多运算符。根据优先级，运算符可以分类。当它们在语句中一起使用时，应该考虑优先级。然而，你可以始终通过括号来改变优先级。\n\
    \n## 2.4.1 算术运算符 (Arithmetic Operators)\n\n正如名称所示，算术运算符用于执行操作。算术运算符 `+`、`-`、`*`、`/`、`%`\
    \ 用于加法、减法、乘法、除法和取模。根据优先级，递增和递减运算符 `++` 和 `--` 用于操作。算术运算符是单操作或二二的。算术运算符的优先级如下：\n\
    \n| 运算符 | 描述 |\n|---|---|\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| %\
    \ | 取模 |\n| ++ | 递增 |\n| -- | 递减 |\n\n**程序 2-3：** 在程序中使用所有算术运算符。\n\n```\n/* 理解算术运算符\
    \ */\n// main() 函数 所示...\n\nint a, b, c;\na = 20;\nb = 8;\nc = a + b; // c 为 28\n\
    c = a - b; // c 为 12\nc = a * b; // c 为 160\nc = a / b; // c 为 2\nc = a % b; //\
    \ c 为 4\nc = a++; // c 为 20, a 变为 21\nc = ++a; // a 变为 22, c 为 22\n```\n*(注：原文此处代码逻辑存在较多混乱和重复，翻译时已根据语意进行了逻辑对齐处理)*\n\
    \n## 2.4.2 关系运算符 (Relational Operators)\n\n关系运算符也称为逻辑运算符。它们帮助我们编写灵活的逻辑表达式。关系运算符根据优先级所示：\n\
    \n| > >= < <= |\n| == != |\n| && || ! |\n\n表解释了这些运算符的作用。\n\n| 运算符符号 | 描述 |\n|---|---|\n\
    | > | 如果左操作数大于一则为真 |\n| >= | 如果左操作数大于或等于一则为真 |\n| < | 如果左操作数小于一则为真 |\n| <= | 如果左操作数小于或等于一则为真\
    \ |\n| == | 如果两个操作数相等则为真 |\n| != | 如果两个操作数不等则为真 |\n| && | 如果两个操作数都非零则为真 |\n| ||\
    \ | 如果任意一个操作数非零则为真 |\n| ! | 如果右侧的操作数/条件为零则为真 |\n\n程序 2-4：在程序中使用逻辑运算符。\n\n```\n\
    /* 理解逻辑运算符..\n**注意** 如果逻辑运算符满足条件，则返回 **1**，否则返回 **0**。\n简单来说，1 代表逻辑真，0 代表逻辑假...\
    \ */\n\nint a = 5, b = 4, c = 6, d = 0;\n\nprintf(\"%d\",a > b); // 输出 1，因为 a\
    \ 大于 b...\nprintf(\"%d\",a >= 5); // 输出 1，因为 a 等于 5...\nprintf(\"%d\", a < b);\
    \ // 输出 0，因为 a 不小于 b...\nprintf(\"%d\",a <= c); // 输出 1，因为 a 小于 c... \nprintf(\"\
    %d\",a && b); // 输出 1，因为 a 和 b 都非零...\nprintf(\"%d\",a || d); // 输出 1，因为 a 或 d\
    \ 至少有一个非零\nprintf(\"%d\",!d); // 输出 1，因为 d 为零...\n```\n\n"
