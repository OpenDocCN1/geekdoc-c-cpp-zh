    # 9.1 File Inclusion using #include


    Header files normally contain function declarations, macros and conditional compilation
    statements, #include is a preprocessor directive and is used to insert the content
    of a header file in C programming. There are two ways this can be achieved.


    ```

    #include <file.h> // Search in system directories...

    #include "file.h" // Search in local directory first...

    ```


    First directive asks the preprocessor to search the header file in standard system
    directories where header files are placed. Second directive asks the preprocessor
    to search the header file in local directory first. If it is not found in local
    directory, then it is searched in system directories . If the file is not found,
    compiler generates error at the preprocessor stage.


    If a file is present somewhere else, whole path can also be specified.


    ```

    #include </usr/include/stdio.h>

    #include </home/user/Desktop/file.h>

    ```


    Above statements searches the header files in the given path and tries to include
    their code.'
