    printf(\"%s\", ptr3[0].color);\nprintf(\"%d\", &ptr3[0].price);\n```\n\n练习 10-1:\
    \ 使用动态内存分配重写程序 10-1，而不是使用包含 3 辆自行车的静态数组。\n\n提示：声明一个类型为 `struct Bike` 的指针，并使用 `malloc()`\
    \ 为 3 辆自行车分配内存。其余部分相同……\n\n## 10.1.5 将结构体传递给函数\n\n结构体变量可以像普通变量一样作为参数传递给函数。值传递（call\
    \ value）和引用传递（call by reference）的概念同样适用于这里。如果不需要修改调用函数的原始结构体数据，使用值传递并传递结构体变量。然而，如果调用函数需要修改原始结构体的数据，则使用引用传递并传递结构体变量的地址或其指针。\n\
    \n## 程序 10-2: 使用函数重写程序 10-1。为用户输入和输出打印创建单独的函数。\n\n```c\n/* 在结构体数组中输入自行车信息并打印程序...\n\
    让我们创建一个 input() 函数用于用户输入，创建一个 output() 函数用于打印输出。\n显然，input() 需要修改 main() 中的结构体变量，因此使用引用传递。\n\
    然而在 output() 中，我们只需要打印。所以不需要引用传递。\n*/\n```\n\n```c\n#include <stdio.h>\n#define\
    \ COUNT 3 // 用于 3 辆自行车...\nstruct Bike {\n  char brand[20];\n  char color[10];\n\
    \  int price;\n  int cc;\n};\n```\n\n```c\nvoid input(struct Bike *ptr) { // 引用传递...\n\
    \  printf(\"Enter Bike Model:%s\\t\");\n  scanf(\"%[^n]*s\", ptr->brand); // 输入中包含空格\n\
    \  printf(\"Enter Bike color:%s\\t\");\n  scanf(\"%s\", ptr->color);\n  printf(\"\
    Enter Bike Price:%d\\t\");\n  scanf(\"%d\", &ptr->price);\n  printf(\"Enter Bike\
    \ cc:%d\\t\");\n  scanf(\"%d\", &ptr->cc);\n}\n```\n\n```c\nvoid output(int i,\
    \ struct Bike print) { // 值传递...\n    printf(\"%d. This is a %s \", i+1, print.color);\n\
    \    printf(\"%s %d cc \", print.brand, print.cc);\n    printf(\"at $%d only\\\
    n\", print.price);\n}\n```\n\n```c\nint main() {\n    struct Bike b[COUNT]; //\
    \ 3 个 struct Bike 数组...\n    int i;\n```\n\n```c\n// 从用户处输入值...\nfor(i = 0; i\
    \ < COUNT; i++) {\n    input(&b[i]); // 传递了索引 i 个的地址...\n}\n```\n\n```c\n// 打印值...\n\
    printf(\"————\\n\");\nfor(i = 0; i < COUNT; i++) {\n    output(i,b[i]); // 传递了第\
    \ i 个。值传递...\n}\n```\n\n**练习 10-2:** 创建一个结构体来存储学生信息（姓名、ID、年龄、费用等）。为 3 个学生动态分配内存。使用函数从用户处输入数据并打印。创建一个\
    \ update() 函数，根据 ID 更新学生。\n\n提示：创建一个 struct student。用户输入和输出打印与程序 10-2 相同。\n\n\
    询问用户需要更新哪位学生的数据？搜索该学生的 ID，如果找到，调用 update() 函数，该函数根据用户输入更新姓名、年龄等……\n\n## 10.1.6\
    \ 结构体的嵌套\n\nC 语言也允许结构体的嵌套。可能会出现你的新结构体需要来自其他结构的数据以及一些新数据的情况。与其直接复制所有结构体成员，我们可以执行结构体嵌套。\n\
    \n```c\nstruct A {\n    int data1;\n};\n```\n\n```c\nstruct B {\n    int data2;\n\
    };\n```\n\n```c\nstruct C {\n    struct A a;\n    struct B b;\n    int data3;\n\
    }; // struct A 和 B 都嵌套在 struct C 内部...\n```\n\n```c\nint main() {\n    struct\
    \ C c; // 声明一个 struct C 类型的变量\n\n    // 给结构体成员赋值\n    c.a.data1 = 100;\n    c.b.data2\
    \ = 200;\n    c.data3 = 300;\n}\n```\n\n我们也可以使用指针进行结构嵌套。如果出现指针，必须在访问它之前指向变量或分配动态内存。\n\
    \n```c\nstruct A {\n  int data1;\n};\n```\n\n```c\nstruct B {\n  int data2;\n\
    };\n```\n\n```c\nstruct C {\n  struct A *a;\n  struct B *b;\n  int data3;\n};\
    \ // struct A 和 B 都嵌套在 struct C 内部...\n```\n\n```c\nint main() {\n    struct C\
    \ c; // 声明一个 struct C 类型的变量\n\n    // 为结构体分配内存\n    c.a = (struct A *)malloc(sizeof(struct\
    \ A));\n    c.b = (struct B *)malloc(sizeof(struct B));\n\n    // 结构结构体赋值\n从上面可以推导出一点——当发现指针时，需要分配内存并使用\
    \ -> 代替 (.) 来访问成员。\n\n```c\n// ...\n    c.a->data1 = 100;\n    c.b->data2 = 200;\n\
    \    c.data3 = 300;\n\n    free(c.a);\n    free(c.b);\n}\n```\n\n## 10.1.7 使用\
    \ typedef 的结构体\n\n`typedef` 可以应用于结构体以创建一个新类型。让我们使用 `typedef` 重写 `struct Bike`。\n\
