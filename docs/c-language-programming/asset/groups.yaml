    # 6.4 Call by Value and Call by Reference


    When we called positive() function in Program 6-1, we passed a single argument
    number. Inside the function, we received it in the variable num. Here a copy of
    variable (number) is created inside the positive() function which is identified
    by num. If we modify the copy (num), actual variable (number) doesn''t get modified.
    This is Call by Value


    There might arise a situation where we want the called function to modify the
    variables from calling function. This can be done by passing the address of the
    variables and receiving them inside the pointers. This is known as Call by Reference


    We know that any function can return only 1 value. But what if you need more than
    1 data to be modified inside the calling function? Solution to this is to pass
    the addresses of all the variables we need to modify and modify them inside the
    function. This is one more advantage of call by reference. If we see scanf() function,
    it uses the call by reference mechanism.


