    \    #define ROWS 5\n\n    printf(\"total rows = %d\\n\", ROWS); // 打印 5...\n\
    \    // 使用 ROWS 的代码...\n}\n```\n\n### 9.3.4 #if #elif #error\n\n`#if` 只有在给定条件为真时才编译。在这里可以测试算术表达式，而不是单个宏。可以使用\
