    # 9.4 Pragma Directives


    Using Pragma directives, we can provide extra information to the compiler that
    is not present in the language. They are invoked using #pragma . Let us have a
    look at few of them.


    +   - #pragma startup myfunction : This tells the compiler to execute myfunction
