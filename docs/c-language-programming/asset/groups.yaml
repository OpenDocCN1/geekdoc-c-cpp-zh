    # 5.6 Const Qualifier


    When const qualifier is applied to any variable, its value becomes constant throughout
    the program. It means that const variable can also be initialized but not assigned
    any value later in the program. The variable can also be called read-only variable
    as its value can be read but not be written. Consider the simple example given
    below.


    ```

    int x = 4; // Normal variable...

    const int y = 5; // Read-only variable...

    ```


    ```

    x = 5; // Allowed...

    y = 4; // Not allowed...

    x = y; // Allowed...

    ```


    Here, x is a normal int variable. However, y is const and hence it is a read-only
    variable . So when we do y = 4 , it shows error as we are trying to assign value
    to a read-only variable . The last line x = y is allowed because we are only reading
    the value of read-only variable y not modifying it.


    However, indirect operation on read-only variable is allowed (using pointer) with
    a warning.


    ```

    const int y = 4;

    int *ptr = &y; // Allowed with warning...

    ```


    ```

    *ptr = 5; // Actually modifying y indirectly...

    printf("%d", y); // Prints 5...

    ```


    This is because int *ptr = &y happens at the time of compilation while *ptr =
    5 happens at-runtime. The compiler doesn''t know where ptr is pointing and hence
    this gets allowed. However, it is not a good practice to perform this kind of
    operation. If a variable is const , you should use pointer to a const variable.


    ```

    const int y = 4;

    const int x = 5;

    ```'
