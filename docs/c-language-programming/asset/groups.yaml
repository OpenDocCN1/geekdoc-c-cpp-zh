    ## 5.6 Const Qualifier


    When const qualifier is applied to any variable, its value becomes constant throughout
    the program. It means that const variable can also be initialized but not assigned
    any value later in the program. The variable can also be called read-only variable
    as its value can be read but not be written. Consider the simple example given
    below.


    ```c

    int x = 4; // Normal variable...

    const int y = 5; // Read-only variable...

    ```


    ```c

    x = 5; // Allowed...

    y = 4; // Not allowed...

    x = y; // Allowed...

    ```


    Here, x is a normal int variable. However, y is const and hence it is a read-only
    variable. So when we do y = 4, it shows error as we are trying to assign value
    to a read-only variable. The last line x = y is allowed because we are only reading
    the value of read-only variable y not modifying it.


    However, indirect operation on read-only variable is allowed (using pointer) with
    a warning.


    ```c

    const int y = 4;

    int *ptr = &y; // Allowed with warning...

    ```


    ```c

    *ptr = 5; // Actually modifying y indirectly...

    printf("%d", y); // Prints 5...

    ```


    This is because int *ptr = &y happens at the time of compilation while *ptr =
    5 happens at-runtime. The compiler doesn''t know where ptr is pointing and hence
    this gets allowed. However, it is not a good practice to perform this kind of
    operation. If a variable is const, you should use pointer to a const variable.


    ```c

    const int y = 4;

    const int x = 5;

    const int *ptr = &y; // Pointer to a const int...


    *ptr = 5; // Not allowed as Pointer points to a const int...

    ptr = &x; // Allowed as Pointer itself is not const...

    ```


    Now let us see a const pointer pointing to a normal int variable.


    ```c

    int x = 4;

    int y = 4;

    int * const ptr = &x; // Allowed... Read-only pointer ptr

    ```


    ```c

    *ptr = 5; // Allowed as pointer is pointing to normal int...

    ptr = &y; // Not allowed as pointer itself is const...

    ```


    As shown above, ptr = &y is not allowed as we are trying to reassign a value to
    the pointer. However, *ptr = 5 works fine. The last case is a const pointer pointing
    to a const variable.


    ```c

    int x = 4;

    int y = 4;

    const int * ptr = &x; // Allowed...

    ```


    ```c

    *ptr = 5; // Not allowed...

    ptr = &y; // Not allowed...

    ```


    Here ptr is a read-only pointer pointing to a read-only int variable. Neither
    of the operations are allowed after initialization. Let us summarize all the above
    discussion.


    - int *ptr1; // ptr1 is a pointer pointing to an integer. It can be re-assigned
    another value. The value at that location can also be changed.

    - const int *ptr2; // ptr2 is a pointer pointing to a constant integer. It can
    be re-assigned another value. But the value at that location cannot be changed.

    - int * const ptr3; // ptr3 is a constant pointer pointing to a normal integer.
    It cannot be re-assigned another value. But the value at that location can be
    changed.

    - const int * const ptr4; // ptr4 is a constant pointer pointing to a constant
    integer. It cannot be re-assigned another value. Also the value at that location
    cannot be changed.


    Use of const makes sure that you don’t modify the given variable in the program.
    It’s better to have compile time errors rather than making a bug.


    ## 5.7 Multiple Indirection


    Chain of Pointers are used to achieve multiple indirection. We will discuss only
    double indirection here (double means of 2nd level here and not the real data
    type). Double pointer is used to achieve double indirection.


    Double pointer is a pointer to a pointer. A small example is shown below.


    ```c

    int num;

    int *iptr = &num;

    int **ptr = &iptr;

    ```


    The diagram given below explains the concept of double pointers.


    ![](img/852a18c39758ea225fff4350618abf80_103_0.png)


    It is clearly evident that double pointers store the address of single pointers.
    Dereferencing is done in similar way as pointers with one more * added.


    ```c

    int num;

    int *iptr = &num;

    int **ptr = &iptr;

    ```


    ```c

    num = 10; // Here num is made 10.

    *iptr = 10; // Here num is made 10.

    **ptr = 10; // Here num is made 10.

    ```


    ```c

    printf("%d",num); // Prints 10...

    printf("%d",iptr); // Prints 10...

    printf("%d",**ptr); // Prints 10...

    ```


    ```c

    printf("%d",num); // Prints Address of num

    printf("%d",iptr); // Prints Address of num

    printf("%d",*ptr); // Prints Address of num

    ```


    So what is the need of double pointers? This has similar uses as that of two dimensional
    arrays. If there is a single list to be pointed, a pointer is enough. If there
    are several lists to be pointed, there is a need of double pointers. The same
    theory can be extended for multiple pointers. This might seem a bit confusing
    here. It will be clearer when we see the application of pointers in the coming
    chapters.


