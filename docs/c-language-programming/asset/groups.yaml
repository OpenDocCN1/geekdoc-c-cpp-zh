    \ // fptr is a pointer of type FILE...\n```\n\nThere are three standard file streams\
    \ connected to the input and output channels. These file streams are always open\
    \ and can be used inside the programs.\n\n- stdin - stdin stands for Standard\
    \ Input. If your program needs input, it can be provided to this stream. Example\
