    \n对于我们的程序，用户也可以输入大写字母、小写字母和非字母字符。请按照以下步骤操作：\n\n- (1) 要求用户输入两个字符串。\n- (2) 从两个字符串中删除非字母字符。\n\
    - (3) 将它们都转换为大写或小写。\n- (4) 对两个字符串进行排序。\n- (5) 使用 `strcmp` 比较两者。\n- (6) 如果相等，它们就是字母异位词，否则不是。\n\
    \n## 6.6 递归\n\n如果一个函数调用自己，它就变成递归函数。显然，这里的调用函数和被调用函数是同一个。代码片段所示。\n\n```c\nvoid\
    \ function() {\n...\nfunction(); // 递归调用，因为函数调用自己...\n...\n}\n```\n\n```c\nint\
    \ main() {\n    function(); // 普通调用...\n}\n```\n\n如果一个函数不断调用自己，栈可能会因为调用次数过多而溢出，结果会导致栈溢出。因此，递归应该只在终止条件下使用。\n\
    \n程序 6-8：用户输入一个数字并递归找到它的阶乘。\n\n```c\n/* 使用递归找到数字阶乘的程序\nn! = n * (n-1) * (n-2)\
    \ * ... * 3 * 2 * 1\n5! = 5 * 4 * 3 * 2 * 1 = 120\n*/\n```\n\n```c\nint factorial(int\
    \ n) {\n    if(n <= 1) {\n        return 1;\n    }\n    else\n        return (\
    \ n * factorial(n-1) ); // 递归调用...\n    }\n}\n```\n\n```c\nint main() {\n  int\
    \ number;\n  int result;\n\n  printf(\"Enter a number\\t\");\n  scanf(\"%d\",\
    \ &number);\n\n  result = factorial(number);\n\n  printf(\"Factorial of %d is\
    \ %d...\\n\", number, result);\n}\n```\n\n`factorial()` 函数内部发生了什么？如果接收到的参数 `n`\
    \ 小于或等于 1，则返回 `n * factorial(n-1)`。让我们用一个示例变量来理解每一步发生了什么。\n\n假设 `number = 5`\n\
    \n- 1. factorial(n) // n = 5\n5 <= 1 吗否。所以返回 5 * factorial(4)\n\n- 2. factorial(n)\
    \ // n = 4\n4 <= 1 吗否。所以返回 4 * factorial(3)\n\n...\n写出直到 1 的所有值。现在倒序开始。\n\nfactorial(1)\
    \ = 1\nfactorial(2) = 2 * 1 = 2\nfactorial(3) = 3 * 2 * 1 = 6\nfactorial(4) =\
    \ 4 * 3 * 2 * 1 = 24\nfactorial(5) = 5 * 4 * 3 * 2 * 1 = 120\n\n同样的结果可以通过循环实现。那么递归的优势是什么？递归使程序看起来整洁且更容易理解。有些人可能会认为，在使用递归看起来对你容易之前，需要大量的练习。然而，如果运行速度很重要，你应该优先选择循环而不是递归，因为反复调用函数会产生开销。\n\
    \n## 程序 6-9：用户输入一个数字并按倒序打印。\n\n```c\n/* 倒序打印数字的程序...\n如果用户输入 1024（这是一个整数），打印 4\
