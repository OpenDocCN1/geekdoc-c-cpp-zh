    # 10.1.4 Pointers to Structures


    Pointers can be created for structures in the same way as you create for other
    data types. If a pointer to a structure is created, it has to be pointed to some
    memory to access the member elements . You can either point it to structure variables
    or allocate the memory dynamically . Both the methods are shown below for struct
    Bike


    struct Bike b1;


    struct Bike *ptr1;

    struct Bike *ptr2;

    struct Bike *ptr3;


    ptr1 = &b1; // ptr1 points to variable b1 of type struct Bike


    ```

    // Allocate dynamic memory for 1 Bike at pointer ptr2...

    ptr2 = malloc(sizeof(struct Bike));

    ```


    ```

    // Allocate dynamic memory for 3 Bikes at pointer ptr3...

    ptr3 = malloc(3 * sizeof(struct Bike));

    ```


    If we have pointers to structures instead of variables, the structure members
    can be accessed using -> instead of dot (.). Let us access the structure members
    for above declarations.'
