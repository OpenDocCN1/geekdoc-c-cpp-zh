    \n```\nunion structName {\n  int element1;\n  int element2;\n};\n```\n\n那么，联合体和结构体之间的区别是什么？正如名称所示，联合体包含多个不同类型的成员。联合体中的所有数据成员存储在同一个位置。\n\
    \n```\nunion X {\n  int i;\n  float j;\n  double k;\n};\n```\n\n联合体的大小等于其最大数据成员的大小。在上面的示例中，`int`\
    \ 和 `float` 只占用4个字节，而 `double` 占用8个字节。因此，联合体的大小为8字节。\n\n如果所有数据成员都存储在同一个内存地址，则就不可能同时访问它们。因此，在任何时刻，只有一个成员包含有意义的值。联合体可以像结构体一样被访问。\n\
    \n```c\nunion X {\n    char a[4];\n    int b;\n    int c;\n};\n\nint main() {\n\
    \  union X x;\n  strcpy(x.a, \"Hey\");\n\n  x.b = 10;\n  x.c = 20;\n\n  printf(\"\
    %s\", x.a); // Prints Hey...\n  printf(\"%d\", x.b); // Prints 10...\n  printf(\"\
    %d\", x.c); // Prints 20...\n}\n```\n\n`x.b` 和 `c` 存储在相同的内存地址，打印时具有相同的值。然而，`x.a`\
    \ 不能与 `x.b` 或 `c` 同时使用。\n\n程序10-4：使用union打印float的二进制等值\n\n```c\n/* Program to\
    \ print binary equivalent of float using union. Another method */\nunion X {\n\
    \    int a;\n    float f;\n};\n\nint main() {\n  union X x;\n  int i;\n\n  x.f\
