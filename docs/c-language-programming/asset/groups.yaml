    | :--- | :--- | :--- |


    - - 1st bit is a sign-bit. Here 1 represents a negative number while 0 represents
    a positive number.

    - - Next 11 bits are the Exponent bits.

    - - Remaining 52 bits are called Mantissa.


    The sign bit is same as in the float. The exponents for double datatype are unsigned
    integers with a bias of 3FF (1023 in decimal). It means that the exponent is added
    to 3FF to form actual 11-bits of exponent. Finding the mantissa is similar to
    that in float.


    For 13.6, Exponent = $3FF + 3 = 402 = 0\ 1000\ 0000\ 0010$


    Thus binary equivalent for a double 13.6 is given as below.


    $0\ 100\ 0000\ 0010\ 101\ 1001\ 1001\ ...$


