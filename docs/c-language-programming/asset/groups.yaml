    \  printf(\"Tomorrow is %d day of the week\\n\", tomorrow);\n}\n```\n\n程序的输出如下。\n\
    \nToday is 5 day of the week\nTomorrow is 6 day of the week\n\n由于由于枚举中的第一个成员是`sunday`，它的值为0。因此`monday`的值为1。然而，根据需要，我们可以分配不同的值。\n\
    \n```\nenum color {\n  white,\n  red,\n  black = 5,\n  green,\n  yellow\n};\n\
    ```\n\n在这里，`white`的值为0，`red`为1。我们显式地给`black`赋值5，因此`green`为6，`yellow`为7。枚举使代码看起来简单清晰。然而，预处理器指令\
    \ `#define`也可以用于创建整数常量，因此枚举在程序员中非常流行。\n\n## 11 文件处理 (File Handling)\n\n文件是存储在永久（辅助）内存中的记录或类似数据。无论其类型如何，文件都可以被视为字节序列。计算机系统中的一切不是文件就是进程。进程在主内存中运行，而文件位于辅助存储中。文件处理是C语言中一个非常重要的概念。\n\
    \n文件处理的含义是什么？文件处理涉及以下操作：\n\n- 创建文件\n- 从文件读取数据\n- 向文件写入数据\n- 向文件追加数据\n- 删除文件\n\n\
    就像使用指针指向数据一样，我们可以指向文件的指针。它们应该声明为`FILE`类型，如下。\n\n```\nFILE *fptr; // fptr is a\
    \ pointer of type FILE...\n```\n\n有三个标准文件流连接到输入输出通道。这些文件流始终打开并可以在程序内部。\n\n- stdin\
    \ - stdin代表标准输入。如果程序需要输入，可以提供此流。示例是`scanf()`函数，它从stdin读取输入。\n- stdout - stdout代表标准输出。如果你的程序需要在终端上打印内容，可以提供此流。示例是`printf()`函数，它在终端上打印数据。\n\
    - stderr - stderr代表标准错误。stderr也输出到终端。然而，它用于打印错误信息。示例是`perror()`函数，它向终端打印错误信息。\n\
    \nC语言提供了几个函数来处理文件。让我们讨论一些文件处理所需的常用函数。其他函数将在我们编写程序时讨论。每个函数的详细描述可以在手册（man pages）中找到。\n\
    \n### 11.1 创建/打开和关闭文件\n\n`fopen()`函数用于打开以及创建文件。它打开第一个参数以字符串形式指定的。。第二个参数指定操作模式。\n\
    \n```\nFILE *fptr;\n```\n\n上述`fopen()`调用打开了位于 `/home/filename` 的读取文件。其他模式解释如下。\n\
    \n- r - 只读打开文件。\n- r+ - 读写打开文件。\n- w - 写打开文件。如果不存在则创建。\n- w+ - 读写打开文件。如果不存在则创建。\n\
    - a - 追加打开文件。如果不存在则创建。\n- a+ - 读写追加打开文件。如果不存在则创建。\n\n如果文件成功打开，则返回文件指针。如果发生任何错误，则返回NULL。一旦完成了文件操作，应使用`fclose()`函数关闭文件。\n\
    \n```c\nfclose(fptr); // Close a file pointed by fptr...\n```\n"
