    $(22)_{10} = 0001 0110$

    $(34)_{10} = 0010 0010$

    ```

    ^ = 0011 0100 = 52_{10}

    ```

    因此 $22 \wedge 34 = 52$。


    ### 二进制非 (NOT)


    这是一个一元运算符。对于二进制非，如果输入为 0 则输出为 1，反之亦然。它是一个取反运算符。


    | A | B | NOT |

    | --- | --- | --- |

    | 0 | 0 | 1 |

    | 0 | 1 | 1 |

    | 1 | 0 | 0 |

    | 1 | 1 | 0 |


    示例：求 22 的二进制非。

    $(22)_{10} = 0001 0110$

    ! = $1110 1001 = -23_{10}$（补码，附录 3）


