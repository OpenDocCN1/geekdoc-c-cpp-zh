    # # 1. Introduction to C


    C is a general purpose structured programming language. C falls between machine
    understandable low level languages and the conventional high level languages.
    It means that C language can be used to write system programs as well as applications.
    Dennis Ritchie initially developed C at AT&T Bell Labs during early 1970s. It
    was then used to rewrite the Unix operating system. Many programming languages
    have been fully or partially written in C including C++, Java, C#, Perl, Python,
    PHP and many more.


    C contains only 32 keywords. The main power of C lies in the C library which contains
    numerous functions for performing various operations. Moreover, users can add
    their own functions to the library and hence it is extensible. C programs are
    portable which means that the programs written on one operating system can be
    easily run on another one with zero or minimum changes. It is to be noted that
    portability holds true only for source codes and not for executable files.


    C is the first choice among majority of students when it comes to learning programming
    language. This book assumes that you have no programming language knowledge and
    aims to take you from the C language basics to more advanced programs. If you
    are familiar with the introductory chapters, you can skip them and move to the
    next. Before getting stuck in the theory, let us have a look at the general structure
    of a C program and write the first C program.

