    \n#pragma pack(1) // Preprocessor Directive...\n\n上述预处理器指令用于将结构的对齐大小从默认值减小到 1。在程序中包含此行，注意结构的大小将如你之前猜的那样被打印。\n\
    \n## 10.1.9 结构体位域 (Struct Bit Field)\n\n如果你的程序需要更高效地利用内存（以内存访问时间为代价），可以使用结构体位域。假设我们需要在结构内部只存储表示真或假的1\
    \ 或 0。此任务可以使用 1 位完成（参见附录 4）。对于一个4字节（32位）的整数，使用结构体位域，我们可以确保占用 1 位。\n\n```\nstruct\
    \ Bike {\n  unsigned int gearless:1; // only 1 bit. Value - 1 or 0\n  unsigned\
    \ int cc:12; // only 12 bits. 2^12 – 1 = 4095\n};\n// Range for gearless is 0\
    \ to 1...\n// Range for cc is 0 to 4095...\n```\n\n即使使用了结构体位域，结构成员的对齐方式仍然保持不变。因此，需要对结构成员进行适当安排以节省内存。\n\
    \n## 10.1.10 自引用结构体 (Self-Referential Structure)\n\n能够指向自身类型结构的结构被称为自引用结构。只有当其至少有一个数据成员是指向相同结构的指针时，这种情况下才是可能的，如下所示。\n\
