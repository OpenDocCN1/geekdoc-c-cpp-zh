    # 8.2.1 Dangling Pointer


    In the above programs, we applied free() function to free the dynamically allocated
    memory. However, if you try using these pointers which have been freed, they still
    point at the same de-allocated memory and holds same data. Using the pointer whose
    memory has been de-allocated can result in program crash or unexpected behaviour.
    Thus dangling pointers are the one who still points to the de-allocated memory.


    The obvious solution to avoid dangling pointers is to make the pointer to NULL
    after memory has been freed.


    ```

    free(ptr); // ptr is a dangling pointer...

    ptr = NULL; // Avoiding dangling pointers...

    ```


    Most of the functions returning pointers have NULL as a return value if some error
    has occurred. Here it is always good to check any pointer for NULL before using
    its value in the program.


