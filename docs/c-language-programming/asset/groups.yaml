    | i | 0 | 1 | 2 | 3 |

    |---|---|---|---||}{

    | age[i] | 11 | 22 | 33 | 44 |

    | Address age | 1000 | 1004 | 1008 | 1012 |

    | grade[i] | ''A'' | ''B'' | ''C'' | ''D'' |

    | Address grade | 2000 | 2001 | 2002 | 2003 |

    | rate[i] | 1.11 | 2.22 | 3.33 | 4.44 |

    | Address rate | 3000 | 3008 | 3016 | 3024 |


    It is assumed that the array age starts from address 1000, grade from 2000 and
    rate to 3000 to keep it simple. Since an int occupies 4 bytes, the next array
    index starts from 1004 and so on. A char data type occupies only 1 byte and hence
    the next address is 2001. However, double occupies 8 bytes and hence 3008 is the
    address of next index.


    One thing that is assured is each of these indexes for a given array are stored
    in contiguous blocks.'
- md: "\n## 4.1.2 Assigning values to Arrays\n\nArrays can be assigned values index\
    \ by index. The procedure is similar as assigning values to variables. Each index\
    \ can be assigned values one by one or a single for loop is capable of assigning\
    \ values to whole array as shown below.\n\n```c\nint array[5];\nint i;\n\nfor(i\
    \ = 0; i < 5; i++) {\n  scanf(\"%d\",&array[i]); // assign value to ith index...\n\
    }\narray[4] = 25; // assign manually...\n```\n\nHere, each index is assigned value\
    \ by input from the user via scanf function. The address (&) of each index is\
    \ passed to the scanf function as scanf expects the address of a variable. Finally\
    \ the last index is assigned value manually.\n\n**Program 4-1**:Declare two arrays\
    \ of same size. Assign values to first via input and copy content of first array\
    \ in second one. Print both the arrays.\n\n```c\n/* Declare two arrays, assign\
    \ value to one, copy to another. Print them...\n*/\nint main() {\n  int array1[5];\n\
    \  int array2[5];\n  int i;\n\n  printf(\"Enter 5 numbers to store in array1:\\\
    n\");\n  for(i = 0; i < 5; i++) { // user input to array...\n    scanf(\"%d\"\
    ,&array1[i]);\n  }\n```\n\n```c\n// Copy content of array1 in array2...\nfor(i\
    \ = 0; i < 5; i++) {\n    array2[i] = array1[i];\n}\n// Print both the arrays\
    \ simultaneously...\nfor(i = 0; i < 5; i++) {\n    printf(\"array1[%d] = %d\\\
    n\", i, array1[i]);\n    printf(\"array2[%d] = %d\\n\", i, array2[i]);\n}\n```\n\
    \n**Program 4-2:** Given an array of 10 int, print how many numbers are positive\
    \ and how many are negative.\n\n/* Calculate how many numbers are +ve and -ve\
    \ in an array **/\n\n```c\nint main() {\n/* The no. Of index field is optional\
    \ if initialized as shown below... **/\nint array[] = {1,-1,3,-4,5,-7,12,-7,9,-9};\
    \ // 10 ints...\nint positive = 0; // Counter for positive numbers...\nint negative\
    \ = 0; // Counter for positive numbers...\nint i = 0;\n\nfor(i = 0; i < 10; i++)\
    \ {\n    if(array[i] < 0)\n        negative++;\n    else\n        positive++;\n\
    }\n// Print results...\nprintf(\"Total Positive numbers = %d\\n\",positive);\n\
    printf(\"Total Negative numbers = %d\\n\",negative);\n}\n```\n\n## Exercise 4-1:Given\
    \ an array of 10 int, print the average of all the numbers.\n\nHINT : Take sum\
    \ of all the indexes of Array. Divide the sum by 10.\n\n## Program 4-3:Copy the\
    \ content of first array into second in reverse order.\n\n```c\n/* Program to\
    \ copy content of first array in second one in reverse order...\nLet us take int\
    \ arrays and initialize first one.\n*/\n```\n\n```c\nint main() {\nint array1[5]\
    \ = {1,2,3,4,5};\nint array2[5];\nint i;\n\n// copy 1st array into 2nd in reverse\
    \ order...\nfor(i = 0; i < 5; i++) {\n  array2[4-i] = array1[i];\n}\n// Printing\
    \ both the arrays...\nfor(i = 0; i < 5; i++) {\n  printf(\"array1[%d] = %d\\t\"\
    , i, array1[i]);\n  printf(\"array2[%d] = %d\\n\", i, array2[i]);\n}\n}\n```\n\
    \nFor the 1st iteration, i is 0. Hence 4 - i = 4 - 0 = 4 is the last index. Hence\
    \ value at 0th index of array1 is copied in 4th index of array2. As i increases,\
    \ we keep on decreasing the array2 using 4 - i. If you check the output, array2\
    \ prints the numbers in reverse order.\n\n## 4.2 Strings\n\nStrings in C are a\
    \ collection of characters. Even a char array can be considered as a collection\
    \ of characters. So what is the exact difference between the two? Strings are\
    \ terminated by a null character '\\0'. Consider the below code snippet.\n\n```c\n\
    // Initialize array1 with a set of characters...\nchar array1[] = {'S','T','R','I','N','G'};\n\
    // Initialize array2 with a string...\nchar array2[] = \"STRING\";\n\nprintf(\"\
    %d\", sizeof(array1)); // will print 6\nprintf(\"%d\", sizeof(array2)); // will\
    \ print 7\n```\n\nHere, array1 is a char array and is initialized with a group\
    \ of characters. Whereas, array2 is a char array initialized with a string. Even\
    \ though both seem to hold similar data, the first print gives 6 while the second\
    \ print 7. This is because of the presence of null character until the array2\
    \ at last. The actual difference between array1 and array2 is shown below.\n\n\
    array1\n\n![](img/852a18c39758ea225fff4350618abf80_78_0.png)\n\narray2\n\n![](img/852a18c39758ea225fff4350618abf80_78_1.png)\n\
    \nPlease note the presence of '\\0' at the last index of array2. If we want to\
    \ print whole string, we can print them by character (or index by index) %c. However,\
    \ C provides format specifier for strings (%s). If %s is used inside printf statement,\
    \ it prints the characters until it finds null character ('0'). So you can now\
