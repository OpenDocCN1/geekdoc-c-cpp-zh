    C contains only 32 keywords. The main power of C lies in the C library which contains
    number of functions for performing various operations. Moreover, users can add
    their own functions to the library and hence it is extensible. C programs are
    portable which means that the programs written on one operating system can be
    easily run on another one with zero or minimum changes. It is to be noted that
    portability holds true only for source codes and not for executable files.


    C is the first choice among majority of students when it comes to learning programming
    language. This book assumes that you have no programming language knowledge and
    aims to take you from the C language basics to more advanced programs. If you
    are familiar with the introductory chapters, you can skip them and move to the
    next. Before getting stuck in the theory, let us have a look at the general structure
    of a C program and write the first C program.'
- md: "\n## 1.1 General Structure of a C Program\n\nC program can be seen as a collection\
    \ of functions. A function is a collection of C statements. Every function is\
    \ designed to perform a particular task. The general structure of a C program\
    \ is shown below.\n\n- Comments\n- Preprocessor Directives\n- Global Variables\n\
    - main() {\n  - Local Variables\n  - Statements\n}\n- Other Functions\n\nComments\
    \ can be written anywhere inside the code. Comments make it easier for others\
    \ to understand your program and hence should be written in abundance. It can\
    \ also serve the purpose of documentation. Comments can be written inside a /*\
    \ ... */ or // if they are single line comments.\n\nPreprocessor Directive are\
    \ processed by a preprocessor and the C code is modified before it passes through\
    \ C compiler. #include and #define are the most common preprocessor directives.\
    \ #include serves the purpose of including header files while #define is used\
    \ to define macros and constants. We will discuss more about them later.\n\nEvery\
    \ C program contains one or more functions, the one being main(). It is the first\
    \ function to execute. The local variables are specific to a function and can't\
    \ be used outside that function. If you want to use same variable in more than\
    \ one function, the best way is to declare it global. C statements are executed\
    \ one by one from top to bottom. It's time for us to write the first C program.\n\
    \n## 1.2 First C Program\n\nCreate a file with the name hello.c and open it using\
    \ gedit or vi if you are running on Linux. The first program is to print the text\
    \ “Hello, Programmers”. The C program is given below.\n\n```\n/* Program to print\
    \ a text message... */\n\n#include <stdio.h> /* Include the header file... */\n\
    \nmain() { // Start of a main Function...\n    printf(\"Hello, Programmers\\n\"\
    );\n    // printf()function to print the text to stdout...\n}\n```\n\nCopy this\
    \ code in the file. Open a Linux terminal and compile it with the command given\
    \ below.\n\n$ gcc hello.c\n\nIf no errors or warnings get displayed, the code\
    \ has compiled successfully. a.out file will be generated which is the default\
    \ executable file name in Linux. Run it as shown below.\n\n$ ./a.out\n\nIt should\
    \ print the text as expected.\n\nHello, Programmers\n\nNow let us understand what\
    \ the program does. The first line of the program is a comment describing the\
    \ purpose of the program. It becomes easier for others to understand the code\
    \ if the program is already described through comments. The second line of the\
    \ program asks the compiler to include the standard input/output library header\
    \ stdio.h. This line is common to almost all the C programs and should be included\
    \ if not specified in any programs in this textbook.\n\nThe third line indicates\
    \ the start of the main() function. It accepts no arguments (arguments not required\
    \ currently) and hence it is shown by empty list ( ). In the fourth line, main()\
    \ calls system define printf() function which prints the required text to the\
    \ standard output (also referred as stdout ) or terminal. It is to be noted that\
    \ C statements always ends with a semicolon (;) .\n\nThe escape sequence \\n indicates\
    \ the newline character which is required if you want to display the output to\
    \ the newline. Similarly \\t is an escape sequence used to display a horizontal\
    \ tab. There are several other escape sequences which we will see later. We can\
    \ see how the comments are written in the code using both the methods.\n\n###\
    \ Exercise 1-1: Write a program to print the text given below.\n\n> “ Good Morning\
    \ World! How’s everyone?\n> Did you run the first program correctly?”\n\n## 1.3\
    \ Tokens in C\n\nThe basic elements inside a C program that the compiler can identify\
    \ are called Tokens. C language has 5 types of tokens that help to design a program.\
    \ They are Identifiers, Keywords, Constants, Operators and Strings. Identifiers\
    \ are also known as variables. A C program is constructed using these basic elements.\n\
    \n## 1.4 Identifiers\n\nThere are two types of words which we will use in a C\
    \ program. There are either system or user defined words. The system defined words\
    \ are known as keywords as the user defined words are known as identifiers (also\
    \ known as Variables). C language specifies some rules for naming an identifier.\
    \ The rules are given below.\n\n- Identifier names can only have alphabets, underscore\
    \ (_) and digits.\n- The name should start with an alphabet or underscore.\n-\
    \ Predefined keywords cannot be used as an identifier.\n- C language is case-sensitive.\
    \ Therefore uppercase and lowercase are different.\n- Most of identifiers are\
    \ short.\n- It is advised to keep names meaningful.\n\nSome valid examples of\
    \ identifiers:\n\n```\nchar\n```\n\nThe invalid identifiers are given below:\n\
    \n```\n1variable\n```\n\nThe following characters cannot be used in identifiers:\n\
    \n```\n$\n```\n\n## 1.5 Keywords\n\nC language has 32 keywords that are reserved.\
    \ They are shown below.\n\n| auto | break | char |\n| continue | default | do\
    \ |\n| double | else | enum |\n| float | for | goto |\n| int | long | register\
    \ |\n| short | signed | static |\n| switch | union | void |\n\n### Summary\n\n\
    In this chapter we had introduction to Tokens. We saw keywords and identifiers.\
    \ We are now ready to move on.\n\n## 2. Data Types & Operators\n\nData Types are\
    \ used to define data. There are several types based on use.\n\n## 2.1 Data Types\n\
    \nThey are classified into:\n\n- Basic Types: These are known as arithmetic.\n\
    - Enum Types: These types also hold arithmetic data.\n- Derived Types: These types\
    \ are derived from basic types. For Ex.: Array is a derived type capable of holding\
    \ several values.\n- Void Type: Void stands for no value.\n\n### 2.1.1 Basic Types\n\
    \nBasic types are used to define size. The table given below shows all basic types\
    \ along with their size, range and format specifiers.\n\n| Data Type | Qualifiers\
    \ | Size in Bytes | Range | Format Specifier |\n|---|---|---|---|---|\n| char\
    \ | signed char | 1 | -128 to 127 | %c |\n| | unsigned char | 1 | 0 to 255 | %c\
    \ |\n| int | signed int | 4 | -2147483648 to 2147483647 | %d |\n| | unsigned int\
    \ | 4 | 0 to 4294967295 | %u |\n| short | signed short | 2 | -32768 to 32767 |\
    \ %hi |\n| | unsigned short | 2 | 0 to 65535 | %hu |\n| long | signed long | 4\
    \ | -2147483648 to 2147483647 | %li |\n| | unsigned long | 4 | 0 to 4294967295\
    \ | %lu |\n| float | float | 4 | 1.2E-38 to 3.4E+38 | %f |\n| double | double\
    \ | 8 | 2.3E-308 to 1.7E-308 | %lf |\n| long double | long double | 16 | 3.4E-4932\
    \ to 1.1E+4932 | %Lf |\n\nFor some types, the size may be different for different\
    \ compilers. For Ex.: int occupies 4 bytes when compiled with gcc compiler and\
    \ 2 bytes on a windows-based Turbo C compiler. Similarly the size of long double\
    \ could be 12 or 16 bytes depending upon the efficiency of the processor. Let\
    \ us write a program to print the size of a data type.\n\n# Program 2-1:Write\
    \ a program to display the size of “signed int”.\n\n```\n/* Program to print the\
    \ size of a data type... */\nvoid main() {\n    int size; // Variable declaration...\n\
    \    size=sizeof(signed int); // Get the size...\n    printf(\"signed int occupies\
    \ %d bytes\\n\",size);\n}\n```\n\nThe Header file stdio.h is not included in the\
    \ above program and should be included by you in all the programs. Here we have\
    \ used void as the return type of main() function. main() return either integer\
    \ or no values. If no values are returned, we can specify void. We will discuss\
    \ more about void in the coming chapters.\n"
  mdcn: "\n\n## 1.1 C 程序的通用结构\n\nC 程序可以被看作函数的集合。函数是 C 语句的集合。每个函数都设计用于执行特定的任务。C 程序的通用结构如下所示。\n\
    \n- 注释\n- 预处理器指令\n- 全局变量\n- main() {\n  - 局部变量\n  - 语句\n}\n- 其他函数\n\n注释可以写在代码的任何地方。注释有助于他人更容易理解你的程序，因此应该大量编写注释。它们也可以起到文档的作用。注释可以写在\
    \ `/* ... */` 内部，如果是单行注释则写在 `//`。\n\n预处理器指令由预处理器处理，C 代码在传递给 C 编译器之前会被修改。#include\
    \ 和 #define 是最常见的预处理器指令。#include 起到包含头文件的作用，而 #define 用于定义宏和常量。我们将在稍后详细讨论它们。\n\
    \n每个 C 程序都包含一个或多个函数，其中一个就是 `main()`。它是第一个执行的函数。局部变量是函数特有的，不能在函数外部使用。如果你想在多个函数中使用同一个变量，最好的方法将其声明为全局变量。C\
    \ 语句从上到下逐条执行。现在是我们时候写第一个 C 程序了。\n\n## 1.2 第一个 C 程序\n\n创建一个名为 `hello.c` 的文件，如果你在\
    \ Linux 上运行，请使用 `gedit` 或 `vi` 打开它。第一个程序是打印文本“Hello, Programmers”。C 程序如下所示。\n\n\
    ```\n/* 打印文本消息的程序... */\n\n#include <stdio.h> /* 包含头文件... */\n\nmain() { // main\
    \ 函数开始...\n    printf(\"Hello, Programmers\\n\");\n    // printf()函数将文本打印到标准输出...\n\
    }\n```\n\n将此代码复制到文件中。打开 Linux 终端并使用下面的命令进行编译。\n\n$ gcc hello.c\n\n如果没有显示任何错误或警告，则代码已成功编译。系统将生成一个\
    \ `a.out` 文件，这是 Linux 中默认的可执行文件名称。按如下所示运行它。\n\n$ ./a.out\n\n它应该按预期打印文本。\n\nHello,\
    \ Programmers\n\n现在让我们来理解这个程序做了什么。程序的第一行是描述程序用途的注释。如果程序已经通过注释进行了描述，他人理解代码就会变得更容易。程序的第二行要求编译器包含标准输入输出库头文件\
    \ `stdio.h`。这一行几乎适用于所有 C 程序，如果本教科书中任何程序中未指定，则都应该包含它。\n\n第三行表示 `main()` 函数的开始。它不接受任何参数（目前不需要参数），因此用空列表\
    \ `()` 表示。在第四行中，`main()` 调用系统定义的 `printf()` 函数，该函数将所需的文本打印到标准输出（也称为 stdout）或终端。需要注意的是，C\
    \ 语句总是以分号（`;`）结尾的。\n\n转义序列 `\\n` 表示换行符，如果你想在输出时换行，就需要它。同样，`\\t` 是用于显示水平制表符的转义序列。稍后我们还会看到其他转义序列。我们可以通过这两种方法看到代码中是如何编写注释。\n\
    \n### 练习 1-1：编写一个程序打印下面的文本。\n\n> “ 早上好，世界！大家还好吗？\n> 你正确运行第一个程序了吗？”\n\n## 1.3 C\
    \ 中的令牌 (Tokens)\n\nC 程序中编译器可以识别的内部元素称为令牌。C 语言有 5 类令牌，有助于设计程序。它们是标识符、关键字、常量、运算符和字符串。标识符也被称为变量。C\
    \ 程序是用这些基本元素构建的。\n\n## 1.4 标识符\n\n我们在 C 程序中使用两种类型的单词。它们是系统定义的或用户定义的单词。系统定义的单词是关键字，用户定义的单词是标识符。标识符被用于命名。标识符的命名规则如下：\n\
    \n- 标识符名称可以包含字母、数字和下划线（_）。\n- 标识符以字母或下划线开头。\n- C 语言是区分大小写的。\n- 建议大多数标识符要有意义。\n\
    \n有效的标识符示例：\n\n```\nchar\n```\n\n无效的标识符示例：\n\n```\n1\n```\n\n不能用于标识符的字符：\n\n```\n\
    $\n```\n\n## 1.5 关键字\n\nC 语言有 32 个关键字，如下所示。\n\n| auto | break | char |\n| continue\
    \ | default | do |\n| double | else | enum |\n| float | for | goto |\n| int |\
    \ long | register |\n| short | signed | static |\n| switch | union | void |\n\n\
    ### 总结\n\n在本章中，我们介绍了令牌。我们看到了关键字和标识符。我们现在准备好继续。\n\n## 2. 数据类型 & 运算符\n\n数据类型用于定义数据。它们分为几类：\n\
    \n- 基础类型：用于算术运算。\n- 枚举类型：也可以持有多个值。\n- 派生类型：基于基础类型。例如：数组是派生类型。\n- 空类型：代表无值。\n\n\
    ### 2.1 数据类型\n\n基础类型用于定义大小。下表显示了基本类型及其范围和格式说明符。\n\n| 数据类型 | 限定符 | 字节大小 | 范围 |\
    \ 格式说明符 |\n|---|---|---|---|---|\n| char | signed char | 1 | -128 to 127 | %c\
    \ |\n| | unsigned char | 1 | 0 to 255 | %c |\n| int | signed int | 4 | -2147483648\
    \ to 2147483647 | %d |\n| | unsigned int | 4 | 0 to 4294967295 | %u |\n| short\
    \ | signed short | 2 | -32768 to 32767 | %hi |\n| | unsigned short | 2 | 0 to\
    \ 65535 | %hu |\n| long | signed long | 4 | -2147483648 to 2147483647 | %li |\n\
    | | unsigned long | 4 | 0 to 4294967295 | %lu |\n| float | float | 4 | 1.2E-38\
    \ to 3.4E+38 | %f |\n| double | double | 8 | 2.3E-308 to 1.7E-308 | %lf |\n| long\
    \ double | long double | 16 | 3.4E-4932 to 1.1E+4932 | %Lf |\n\n对于某些类型，不同编译器的大小可能不同。例如：`int`\
    \ 在使用 gcc 编译器时占用 4 字节，在基于 Windows 的 Turbo C 编译器上占用 2 字节。同样，`long double` 的大小取决于处理器的效率。让我们写一个程序来打印数据类型的大小。\n\
    \n# 程序 2-1：写一个程序显示“signed int”的大小。\n\n```\n/* 打印数据类型大小的程序... */\nvoid main() {\n\
    \    int size; // 变量声明...\n    size=sizeof(signed int); // 获取大小...\n    printf(\"\
    signed int occupies %d bytes\\n\",size);\n}\n```\n\n上面的程序没有包含头文件 `stdio.h`，你应该在所有程序中包含它。这里我们使用\
    \ `void` 作为 `main()` 函数的返回类型。`main()` 返回整数或无值。如果不返回值，我们可以指定 `void`。我们将在后续章节中讨论更多关于\
    \ `void` 的内容。\n\n"
