    %d\", __STDC__); // 如果支持 ISO 则打印 1\n}\n```\n\n## 9.3 条件编译\n\n名称本身就表明代码编译是根据某些条件完成的。如果条件为真，则编译一个代码块。如果不是，则编译另一个代码块。我们看到了所有用于条件编译的预处理器指令。\n\
    \n### 9.3.1 #ifdef #else #endif\n\n`#ifdef` 代表 `if defined`（如果定义）。它告诉编译器只有在宏被定义时才编译其后的代码块。如果宏未定义，则编译\
    \ `#else` 块。`#endif` 用于标记条件编译的结束。`#ifdef` 的通用语法所示。\n\n```\n#ifdef MACRO\n    编译此代码块\n\
    #endif\n```\n\n下文显示了一个小示例。在这里，只有当 `PI` 已定义时，第一个 `printf` 才会出现在代码中。由于 `PI` 已定义，`#`\
