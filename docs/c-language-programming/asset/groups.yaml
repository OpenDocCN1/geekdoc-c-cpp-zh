- md: "\n## 6.1 Why do we need Functions?\n\nWe have used printf() and scanf() several\
    \ times in the program till now. So why do we actually need them?\n\n- Using Functions,\
    \ complex and big programs can be divided into relatively simple and smaller modules.\n\
    - Each of these modules can be developed individually.\n- Reusability is one of\
    \ the most important property of a Function.\n- Functions provide modular programming.\
    \ Debugging becomes easier.\n\nAssume that printf function was not there. How\
    \ difficult would your life be? Every time you want to print something, you have\
    \ to write several sets of instructions (that printf uses internally) to perform\
    \ this task. So Functions bring reusability.\n\nThe program looks better if divided\
    \ into smaller functions. A single main() function would look messy and complex.\
    \ Each of these functions works independently. Hence, they can be developed one\
    \ at a time. When there are errors in the program, you know for sure function\
    \ is giving the error. So you only need to look at that function. Think of a single\
    \ main function. You would go crazy searching for an error for really big applications.\n\
    \n## 6.2 Types of FunctionName\n\nThere are two types of Functions in C.\n\n-\
    \ **System Defined Functions**: The functions that are available to us from the\
    \ standard C library are called System defined functions.\n- **User Defined Functions**:\
    \ This are the functions user writes for the use in their program.\n\nPrintf,\
    \ scanf are the best examples of system defined function. We are yet to create\
    \ user defined function. However, main() is a user defined function as its definition\
    \ is written by us.\n\n## 6.3 General Structure of a Function\n\nWe have been\
    \ using main() function in each program. Hence we are almost aware how it is done.\
    \ The general structure is given below.\n\n```c\nreturn_type FunctionName(arguments);\
    \ // Function Declaration...\n\nreturn_type FunctionName(arguments) { // Function\
    \ Definition...\n// statements...\n}\n\nint main() {\n...\nFunctionName(arguments);\
    \ // Calling the function defined above\n...\n}\n```\n\nAny C program starts at\
    \ execution from the main() function. Let us refer main() as the calling function\
    \ and FunctionName() as the called function. Call to a function searches the function\
    \ and executes it. Calling function searches the called function above its own\
    \ definition. If the called function is defined below the calling function, it\
    \ won't find it until a function declaration is found above. Thus a function declaration\
    \ is optional but mandatory when called function is defined below the calling\
    \ function.\n\nFunction declaration consists of a function name, return type and\
    \ type of arguments. When control is passed to the called function, data may or\
    \ not be passed to the function definition. Function definition consists of function\
    \ header and the body. The following are required while defining a new function.\n\
    \n- Return Type: A function may or may not return a value. The type of the data\
    \ that a function returns is specified in place of return type. If no data is\
    \ returned, void can be written. Please note that a function can return only 1\
    \ value.\n- Function Name: This is the name with which function is recognized.\
    \ The rules for naming functions are same as that used for naming variables.\n\
    - Arguments: Depending on the number of data items you want the function to receive,\
    \ arguments can be written. If no data has to be passed, void can be specified\
    \ or the braces can be left empty.\n- Function Body: It contains set of instructions\
    \ for performing specific task.\n\nThe code given below shows function declarations\
    \ and definitions along with calls to them.\n\n```c\nvoid f1(); // Declaration\
    \ for function f1...\nvoid f2 (); // Declaration for function f2...\nint f3 (int);\
    \ // Declaration for function f3...\nint f4 (int, int, char *); //Declaration\
    \ for function f4...\n```\n\n```c\nvoid f1(void) { // Definition for function\
    \ f1...\n/* f1 is a function that receives no argument and returns no data...\n\
    */\n}\n```\n\n```c\nint f2 () { // Definition for function f2...\n/* f2 is a function\
    \ that receives no argument and returns int data...\n*/\n}\n```\n\n```c\nint f3\
    \ (int x) { // Definition for function f3...\n/* f3 is a function that receives\
    \ a single int as argument and returns int data...\n*/\n}\n```\n\n```c\nint f4\
    \ (int x,int y,char *z) { // Definition for function f4...\n/* f4 is a function\
    \ that receives a 3 arguments – int, int and a char * and returns data...\n*/\n\
    }\n```\n\n```c\nint main() {\n    int a,b,c;\n    char *ptr;\n\n    f1(); // no\
    \ argument to be passed. No data to be received\n    a = f2(); // no arguments.\
    \ Receive an int...\n    a = f3(c); // Single int to send. Receive an int\n  \
    \  a = f4(b,c,ptr); // Send int,int,char*. Receive int...\n}\n```\n\nThe arguments\
    \ inside the optional function declarations have to be in same order as they are\
    \ definition. However it is optional to specify the name of variables inside declarations\
    \ (only data types works fine). Call to the function should also have same number\
    \ of arguments as given in function definition. With basics for functions, let\
    \ us write a small program.\n\nProgram 6-1: Create a function positive that takes\
    \ single int as an argument and returns 1 if the number is positive and 0 if it\
    \ is negative. Test the code as well.\n\n```c\n/* Program to find whether a number\
    \ is positive or not. Use functions */\n#include <stdio.h>\n\nint positive(int);\
    \ // Declaration\n\nint positive(int num) {\n    if(num >= 0)\n        return\
    \ 1;\n    else\n        return 0;\n}\n\nint main() {\n    int number;\n    int\
    \ check;\n\n    printf(\"Enter a number:\\t\");\n    scanf(\"%d\", &number);\n\
    \    check = positive(number);\n    if(check == 1) {\n        printf(\"Number\
    \ %d is positive\", number);\n    } else {\n        printf(\"Number %d is negative\"\
    , number);\n    }\n    return 0;\n}\n```\n\n## 6.4 Call by Value and Call by Reference\n\
    \nWhen we called positive() function in Program 6-1, we passed a single argument\
    \ number. Inside the function, we received it in the variable num. Here a copy\
    \ of variable (number) is created inside the positive() function which is identified\
    \ by num. If we modify the copy (num), actual variable (number) doesn't get modified.\
    \ This is Call by Value\n\nThere might arise a situation where we want the called\
    \ function to modify the variables from calling function. This can be done by\
    \ passing the address of the variables and receiving them inside the pointers.\
    \ This is known as Call by Reference\n\nWe know that any function can return only\
    \ 1 value. But what if you need more than 1 data to be modified inside the calling\
    \ function? Solution to this is to pass the addresses of all the variables we\
    \ need to modify and modify them inside the function. This is one more advantage\
    \ of call by reference. If we see scanf() function, it uses the call by reference\
    \ mechanism.\n\nProgram 6-2: Modify Program 5-1. Swap the values of 2 integers\
    \ by creating a function swap().\n\n```c\n/* Program to swap values of 2 ints.\
    \ Let's use the temporary variable method...\nDefine a function swap & use Call\
    \ by reference...\n*/\n#include <stdio.h>\n\nvoid swap(int *ptra, int *ptrb);\
    \ // Declaration\n\nvoid swap(int *ptra, int *ptrb) {\n    int temp;\n\n    temp\
    \ = *ptra;\n    *ptra = *ptrb;\n    *ptrb = temp;\n}\n\nint main() {\n    int\
    \ a, b;\n\n    printf(\"Enter two integers:\\t\");\n    scanf(\"%d %d\", &a, &b);\n\
    \    printf(\"Before swap: a=%d, b=%d\\n\", a, b);\n    swap(&a, &b);\n    printf(\"\
    After swapping: a=%d, b=%d\\n\", a, b);\n    return 0;\n}\n```\n"
  mdcn: "\n\n## 6.1 为什么我们需要函数？\n\n到目前为止，我们在程序中已经多次使用了 `printf()` 和 `scanf()`。那么我们实际上为什么需要它们呢？\n\
    \n-   通过函数，复杂的巨大程序可以被分成相对简单且更小的模块。\n-   这些模块中的每一个都可以被独立开发。\n-   可重用性是函数最重要的属性之一。\n\
    -   函数提供了模块化编程。调试变得更加容易。\n\n假设 `printf` 函数不存在。你的生活将会变得多么困难？每当你想要打印东西时，都必须编写几组指令（即\
    \ `printf` 内部使用的指令）来完成这项任务。因此，函数带来了可重用性。\n\n如果程序被分成更小的函数，看起来会更清晰。单一的 `main()`\
    \ 函数会显得杂乱且复杂。这些函数每一个独立工作。因此，它们可以一个一个开发。当程序出现错误时，你可以确定是哪个函数出的错误。所以你只需要查看那个函数。想象一个单一的\
    \ `main` 函数，在非常大的应用程序中寻找错误会让你疯掉。\n\n## 6.2 函数的类型\n\nC 语言中有两种函数。\n\n-   **系统函数\
    \ (System Defined Functions)**：从标准 C 库中提供的函数被称为系统函数。\n-   **用户定义函数 (User Defined\
    \ Functions)**：这些是用户为了自己的程序而编写的函数。\n\n`printf`、`scanf` 是系统函数的最佳例子。我们还没有创建用户定义函数。然而，`main()`\
    \ 是用户定义函数，因为它的定义是由我们编写的。\n\n## 6.3 函数的通用结构\n\n我们在每个程序中都使用 `main()` 函数。因此我们几乎知道它是如何做的。通用的结构如下。\n\
    \n```c\nreturn_type FunctionName(arguments); // 函数声明...\n\nreturn_type FunctionName(arguments)\
    \ { // 函数定义...\n// statements...\n}\n\nint main() {\n...\nFunctionName(arguments);\
    \ // 调用上面定义的函数\n...\n}\n```\n\n任何 C 程序的执行都从 `main()` 函数开始。让我们把 `main()` 称为调用函数，把\
    \ `FunctionName()` 称为被调用函数。对函数的调用会搜索该函数并执行它。调用函数会在其自身定义上方搜索被调用函数。如果被调用函数定义在调用函数的下方，那么在上方找到函数声明之前，它将找不到它。因此，函数声明是可选的，但当被调用函数定义在调用函数下方时，它是强制性的。\n\
    \n函数声明由函数名、返回类型和参数类型组成。当控制传递给被调用函数时，可能会传递给函数定义。函数定义由函数头和函数体组成。定义新函数时需要以下内容：\n\n\
    -   **返回类型 (Return Type)**：函数可能返回一个值，也可能不返回。函数返回的数据类型在返回类型的位置指定。如果没有返回数据，可以写 `void`。请注意，一个函数只能返回\
    \ 1 个值。\n-   **函数名 (Function Name)**：识别函数的名称。函数的命名规则与变量的命名规则相同。\n-   **参数 (Arguments)**：根据你想让函数接收的数据项数量，可以编写参数。如果没有需要传递的数据，可以指定\
    \ `void` 或留空括号。\n-   **函数体 (Function Body)**：它包含执行特定任务的一组指令。\n\n给出的代码展示了函数声明、定义以及对它们的调用。\n\
    \n```c\nvoid f1(); // 函数 f1 的声明...\nvoid f2 (); // 函数 f2 的声明...\nint f3 (int);\
    \ // 函数 f3 的声明...\nint f4 (int, int, char *); // 函数 f4 的声明...\n```\n\n```c\nvoid\
    \ f1(void) { // 函数 f1 的定义...\n/* f1 是一个不接收参数且不返回数据的函数...\n*/\n}\n```\n\n```c\n\
    int f2 () { // 函数 f2 的定义...\n/* f2 是一个不接收参数并返回 int 数据的函数...\n*/\n}\n```\n\n```c\n\
    int f3 (int x) { // 函数 f3 的定义...\n/* f3 是一个接收单个 int 作为参数并返回 int 数据的函数...\n*/\n\
    }\n```\n\n```c\nint f4 (int x,int y,char *z) { // 函数 f4 的定义...\n/* f4 是一个接收 3\
    \ 个参数 – int, int 和 char * 并返回数据的函数...\n*/\n}\n```\n\n```c\nint main() {\n    int\
    \ a,b,c;\n    char *ptr;\n\n    f1(); // 无参数传递。无数据接收\n    a = f2(); // 无参数。接收一个\
    \ int...\n    a = f3(c); // 发送单个 int。接收一个 int\n    a = f4(b,c,ptr); // 发送 int,int,char*。接收\
    \ int...\n}\n```\n\n可选函数声明中的参数顺序必须与定义时的顺序相同。然而，在声明内部指定变量名是可选的（仅数据类型即可）。函数调用的参数数量也与函数定义中给出的相同。有了函数的基础知识，让我们来写一个小程序。\n\
    \n程序 6-1：创建一个函数 `positive`，接收单个 int 作为参数，如果数字是正数则返回 1，如果是负数则返回 0。同样测试代码。\n\n```c\n\
    /* 判断一个数字是否为正数的程序。使用函数 */\n#include <stdio.h>\n\nint positive(int); // 声明\n\n\
