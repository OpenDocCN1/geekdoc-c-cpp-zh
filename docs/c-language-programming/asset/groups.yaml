  - '[PAGE 87]


    # 5.1 Pointer Declaration, Initialization and Assignment


    Pointers can be declared as follows.


    Data-type * pointerName;


    It is similar to the normal variable declaration. The only change is a * in between
    which says that it''s a Pointer. Some examples are given below.


    ```

    int * iptr;

    char * cptr;

    double *dptr;

    ```


    However these pointers are not initialized yet. It means that they are pointing
    to some garbage location. Pointers should never be use uninitialized (or unassigned).
    If used, it might result in a segmentation fault (Runtime Error caused by illegal
    memory operation that crashes the program ). Let us initialize these pointers
    first.


    ```

    int num;

    int * iptr = &num; // Initialize it with the address of num...

    char ch;

    char * cptr = &ch; // Initialize it with the address of ch...

    double d;

    double *dptr = &d; // Initialize it with the address of d...

    ```


    The figure given below clearly explains what happens here.'
  - '[PAGE 88]


    ![](img/852a18c39758ea225fff4350618abf80_88_0.png)


    Assume that the variable num is stored in memory at address starting from 1000.
    A pointer iptr is declared and let us assume it is stored at memory location starting
    from 2000. Now, when the pointer is initialized with the address of num, its address
    value (1000 here) is actually stored inside this pointer as its content and hence
    it points to the given memory address (or variable).


    The same goes for all the type of pointers. Since array name itself is an address,
    & won''t be required if pointer is initialized with array name. However it doesn''t
    mean that pointer points to the given array. **Please note that** char pointer
    can point to only one char, here 0th index of the array.


    ```

    char array[10]; // Declared an char array of 10 chars...

    char *ptr = array; // No & required here...

    ```'
