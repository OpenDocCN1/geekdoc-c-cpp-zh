    \    try:\n        os.system('clear')\n    except OSError:\n        os.system('cls')\n\
    ```\n\n## C++ Mistakes\n\nThere are many pitfalls developers can encounter, especially\
    \ as this is a more complex and often unforgiving language. Beginners need to\
    \ take it step at a time and digest what they've learned before moving on.\n\n\
    ## VOID(C++, MISTAKES)\n\nAdmittedly it is not just C++ who make the kinds of\
    \ errors on these pages. Here are some common issues to try and avoid.\n\n## UNDECLARED\
    \ IDENTIFIERS\n\nA common mistake with most programming languages, is when you\
