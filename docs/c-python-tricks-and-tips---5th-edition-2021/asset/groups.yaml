    \n# 定义常量\n\n常量代码中的固定值。它们可以是任何基本数据类型，但名称表明它们的值在整个代码中保持不变。在 C++ 中定义常量有两种独立的方法：`#define`\
    \ 预处理器和 `const`。\n\n# #DEFINE\n\n预处理器是给编译器的指令，用于在编译代码之前对信息进行预处理。`#include` 是预处理器，`#define`\
    \ 也是。\n\n步骤 1 你可以使用 `#define` 预处理器在代码中定义任何你需要的常量。从创建一个包含以下头文件的 C++ 文件开始：\n\n步骤\
    \ 2 现在让我们假设你的代码中有三个常量：长度、宽度和高度。你可以定义：\n\n```cpp\n#include <iostream>\nusing namespace\
