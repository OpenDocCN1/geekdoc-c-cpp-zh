    ## 日期和时间


    在处理日期时，它通常需要帮助你查看用户登录系统的时间，例如，你可能想对条目进行时间戳或查看持续了多久。得益于 `time` 模块，获取日期和时间是非常简单的。


    ## 时间模块


    `time` 模块包含了许多函数，可以帮助你获取当前系统时间、从字符串中读取日期、格式化日期等。


    - **步骤 1** 首次，你需要导入 `time` 模块。它是 Python 3 内置的，因此你不需要将其复制到提示符中并导入它。一旦导入，你就可以用简单的命令调用当前的时间和日期：


    ```python

    import time

    time.ctime()

    ```


    ```python

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.ctime()

    ''Wed Jan  4 07:48:24 2017''

    >>>

    ```


    - **步骤 3** 你可以通过 `time.localtime()` 查看时间的呈现结构。


    输出显示为：`time_struct_tm(tm_year=2017, tm_mon=9, tm_hour=7, tm_min=6, tm_sec=13,
    tm_wday=3, tm_yday=250, is_dst=0)`，显然这取决于你的当前时间。


    ```python

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.localtime()

    time_struct_tm(tm_year=2017, tm_mon=9, tm_hour=7, tm_min=6, tm_sec=13, tm_wday=3,
    tm_yday=250, is_dst=0)

    >>>

    ```


    - **步骤 2** 时间被分为九个元组，这些元组像任何其他元组一样被划分为索引项目，如下方的屏幕所示。


    - **步骤 4** `time` 模块中内置了许多函数。最常用的之一是 `strftime()`。通过它，你能够呈现广泛的参数，因为它会将时间转换为字符串。例如，要显示当前的星期几，你可以使用：


    | 索引 | 字段 | 取值 |

    |---|---|---|

    | 0 | 4位年份 | 2016 |

    | 1 | 月份 | 1 到 12 |

    | 2 | 日 | 1 到 31 |

    | 3 | 小时 | 0 到 23 |

    | 4 | 分钟 | 0 到 59 |

    | 5 | 秒 | 0 到 61（如果是闰秒则为 60） |

    | 6 | 星期 | 0 到 6（周一到周日） |

    | 7 | 年中的天 | 1 到 366 (儒日) |

    | 8 | 夏令时 | -1, 0, 1 - 库定义的 DST |


    time.strftime(''%A'')


    ```python

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.strftime(''%A'')

    ''Wednesday''

    >>>

    ```


    ## **步骤 5**


    这自然意味着你可以将各种函数整合到代码中，例如：


    ```python

    time.strftime("%H:%M")

    time.strftime("%M:%S")

    time.strftime("%S")

    time.strftime("%Y-%m-%d")

    time.strftime("%H:%M:%S")

