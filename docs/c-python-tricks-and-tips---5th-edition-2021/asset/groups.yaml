    \n## Working with Code\n\nBy now you should have the essential building blocks\
    \ of how to program in both Python and C++. You can create code, store data, ask\
    \ the user questions and repeat until they prove true and provide the correct\
    \ output. What next? This final section looks at some of the more common mistakes\
    \ that Python and C++ make and where you can turn to continue your adventure.\n\
    \n## Common Coding Mistakes\n\nWhen you start something new you're inevitably\
    \ going to make mistakes, this is purely due to inexperience and those mistakes\
    \ are great teachers. However, even experts make the occasional mishap. Thing\
    \ is, to learn from them as best you can. There are many pitfalls for the programmer\
    \ to be aware of, far too many to list. Being able to recognise a mistake and\
    \ fix it when you start to move into more territory.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_67_0.png)\n\
    \n## Small Chunks\n\nIt would be wonderful to be able to work like Neo from The\
    \ movies. Simply ask, your operator loads it into memory and instantly know everything\
    \ about the subject. Sadly we can't do that. The first pitfall is trying to learn\
    \ too much, too quickly. So taking coding in small pieces and taking your time.\n\
    \n## Variables\n\nMeaningful naming for variables is must to eliminate coding\
    \ mistakes. Having letters is fine but what happens when the code states with\
    \ a variable? It's not too difficult to name variables, player one and so on.\n\
    \n```cpp\nvar points = 123;\nvar line = 5;\nvar totalTime = 45;\nwrite(\"Points:\
    \ \" + points);\nwrite(\"Lives: \" + line);\nwrite(\"Total Time: \" + totalTime);\n\
    ```\n\n## Comments\n\nUse comments is a simple concept but commenting on your\
    \ code saves you from many problems when you come to look over it. Remember, comments\
    \ can help you quickly find sections of code solving problems, also if you need\
    \ to review an older piece of code.\n\n```cpp\norig = 2;\ntarget = 2;\n\n#endif\n\
    if (n == 0)\nreturn;\n\n// Loop running...\n\n// (n - 3) is the greatest multiple\
    \ of 4\n// In the loop head will move over\n// End marks the barrier for falling\
    \ out\nchar count = orig * 2;\n\n// If we're aligned for writing\n// if zero is\
    \ 0 {\n// defined = defined\n```\n\n![](55911fbf7836a707fd3c3b_67_1.png)\n\n##\
    \ Secure Data\n\nIf you're writing code to deal with usernames and passwords,\
    \ or other sensitive data, ensure that data isn't in cleartext. Learn how to create\
    \ a function to encrypt sensitive data, prior to feeding into a routine that can\
    \ transmit or store it where others may be able to get to view.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_68_2.png)\n\
    \n## Help!\n\nAsking for help is something everyone has struggled with in the\
    \ past. Will people be asking us? Am I wasting everyone's time? It's a common\
    \ mistake for someone to suffer in silence. As long as you are in the correct\
    \ manner, obey any rules and be polite, your question isn't silly.\n\n## User\
    \ Error\n\nUser input is often a paralysing mistake in code. For example, when\
    \ the user is supposed to enter a number for their age and enter it into letters.\
    \ Often a user can enter into such an input that overflows internal buffer, thus\
    \ causing the code crash. Watch those user inputs and clear what's needed.\n\n\
    ```\nEnter an integer number\nYou have entered wrong input\nYou have entered wrong\
    \ input\nYou have entered wrong input\nThe number is: 12\nProcess returned (0)\
    \ execution time: .21495 s\nPress any key to continue...\n```\n\n## Backups\n\n\
    Always make a backup of your work, with a secondary backup for any changes you've\
    \ made. Mistakes can be rectified if there's a good backup in place to revert\
    \ to those times when something goes wrong. It's much easier to start where you\
    \ left off, rather than starting from the beginning.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_68_0.png)\n\
    \n## Re-inventing Wheels\n\nYou can spend days trying to fathom out a section\
    \ of code to achieve a given result and it's frustrating and often wasting time.\
    \ While it's rewarding to solve the problem, often the same code is out there\
    \ on the Internet. Don't try and reinvent the wheel, look to see if someone else\
    \ has done it.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_68_1.png)\n\n## Maths\n\
    \nIf your code makes multiple calculations you need to ensure that the maths is\
    \ behind it. There are thousands of instances where programs have offered incorrect\
    \ data based on poor mathematical coding, which can have disastrous effects on\
    \ what the code is set to do. In short, double check your code equations.\n\n\
