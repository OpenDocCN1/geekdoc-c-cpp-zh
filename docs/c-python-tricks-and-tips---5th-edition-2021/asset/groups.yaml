    # # Writing to Files


    The ability to read external files within Python is certainly hard but writing
    a file is better still. Using the write() function, you''re able to output the
    results of the program to a file, that you can then read() back into Python.


    # ## WRITE AND CLOSE


    The write() function is slightly more complex than read(). Along with the filename
    you must also include an access mode which determines whether the file in question
    is in read or write mode.


    +   - Start by opening IDLE and entering the following:

    `t.open(''/home/pi/Documents/text.txt'',''w'')`


    Change the destination from home/pi/Documents to your system. This code will create
    a file named text.txt in write mode using the variable ''t''. If there''s no file
    of that name in the location, it will create one. If one already exists, it will
    overwrite it, so be careful.


    +   - STEP 3 However, the actual file is still blank (you can write the line of
    the file object but not committed to the file part). Part of the write() function
    is that you need to commit the changes to the file:

    t.close()()`


    ![](img/763cdde75d55911fbf7836a707fd3c3b_21_0.png)


