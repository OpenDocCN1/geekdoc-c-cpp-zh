    \ << \"The Value of Pi: \" << PI << endl;\n\n    return 0;\n}\n```\n\n步骤 9 因为你在\
    \ `main` 块中使用了 `const`，你需要在行尾加上分号。你可以使用名称和值而不会冲突，值得注意的是 `#define` 不需要内存，所以对于较小的内存区域，你的方法是最好的。\n\
    \n步骤 10 `const` 的工作方式与 `#define` 相同。你可以创建静态整数和变量：\n\n```cpp\n#include <iostream>\n\
