    \ LENGTH = 50;\nconst int WIDTH = 40;\nconst int HEIGHT = 60;\n```\n\n步骤 5 你还可以将其他元素定义为常量。\n\
    \n步骤 6 代码在构建和执行时与之前完全一样，通过在 `cout` 语句中使用换行符。逐行地，创建一个换行常量是个好主意，\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_50_0.png)\n\
    \n步骤 7 定义常量是在代码开头初始化值的一种良好方法。你可以定义三行代码，甚至是定义 Pi 的值：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\n#define PI 3.14159\n\nint main() {\n\n    cout << \"The\
