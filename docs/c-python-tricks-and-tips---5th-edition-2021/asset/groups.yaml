    \ 13:31:11\n[GC 4.9.1 on 5 line]\n>>> type(\"January\") # 'str' for more information.\n\
    >>> months=(\"January\", \"February\", \"March\", \"April\", \"May\", \"June\"\
    )\n>>> months(\"January\", \"February\", \"March\", \"April\", \"May\", \"June\"\
    )\n```\n\n### STEP 3\nYou can create grouped tuples inside lists that contain\
    \ multiple sets of data. For instance, a tuple called NPC (Non-Playing Characters)\
    \ containing the character name and their combat rating for an adventure game:\n\
    `NPC=(\"Conan\", 100), (\"Beit\", 80), (\"Valeria\", 95)`\n\n```\nPython 3.4.2\
    \ (Default) - Windows Shell\nFile \"example.py\", Oct 19 2014, 13:31:11\n[GC 4.9.1\
    \ on 5 line]\n>>> type(\"January\") # 'str' or 'license' for more information.\n\
    >>> NPC=(\"Conan\", 100), (\"Beit\", 80), (\"Valeria\", 95))\n>>> NPC(\"Conan\"\
    , 100), (\"Beit\", 80), (\"Valeria\", 95))\n```\n\n### STEP 2\nJust as lists,\
    \ the items within a named tuple can be indexed by their position in the tuple:\n\
    `months[]`\n`months[5]`\n\nHowever, any attempt to delete or replace the tuple\
    \ will result in an Error. \n\n```\nPython 3.4.2 (Default) - Windows Shell\nFile\
    \ \"example.py\", Oct 19 2014, 13:31:11\n[GC 4.9.1 on 5 line]\n>>> type(\"January\"\
    ) # 'str' for more information.\n>>> months=(\"January\", \"February\", \"March\"\
    , \"April\", \"May\", \"June\")\n>>> months[0]\n'January'\n>>> months[5]\n'June'\n\
    >>> months.append(\"July\")\nFile \"example.py\", line 11\nAttributeError: 'tuple'\
    \ object has no attribute 'append'\n```\n\n### STEP 4\nEach of these data items\
    \ can be accessed as a by entering entire NPC into the Shell; or they be indexed\
    \ by their position NPC[0]. You can also index the individuals within the NPC\
    \ list:\n`NPC[0]`\nWill display 100.\n\n```\nPython 3.4.2 (Default) - Windows\
