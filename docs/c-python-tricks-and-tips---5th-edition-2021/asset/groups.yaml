    GCC 4.9.2 on Linux\n>>> Type \"help\" or \"license\" for more information.\n>>>\
    \ phonebook['Emma']\n1234\n>>> phonebook['Daniel']\n3456\n>>> phonebook['Hannah']\n\
    6789\n```\n\nJust as with most lists, tuples and so on, strings need to be enclosed\
    \ in quotes (single or double), whilst integers can be left open. To return the\
    \ value you just need to enclose the key in one quotes:\n`phonebook['Daniel']=987\
    \ 654 321`\n\nThe benefit of using a dictionary is that you can enter the index\
    \ to the value. Using the phonebook from the previous examples, you can `phonebook['Emma']`\
    \ and `phonebook['Hannah']`\n\n```\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n\
    GCC 4.9.2 on Linux\n>>> Type \"help\" or \"license\" for more information.\n>>>\
    \ phonebook['Emma']\n1234\n>>> phonebook['Daniel']\n3456\n>>> phonebook['Hannah']\n\
    6789\n>>> phonebook['Emma']\n1234\n>>> phonebook['Hannah']\n6789\n```\n\n### STEP\
    \ 5\nAdding to a dictionary is easy too. You can include a new data entry by adding\
    \ the new key and value items:\n`phonebook[\"David\"] = \"0987 654 321\"`\n\n\
    ```\n# Python 3.4.2\n>>> phonebook = {}\n>>> phonebook[\"David\"] = \"0987 654\
    \ 321\"\n>>> type(\"dict\") or type(\"list\") for more information.\n<class 'dict'>\n\
    >>> len(phonebook)\n1\n>>> print(phonebook[\"David\"])\n'David\n0987 654 321\n\
    ```\n\n### STEP 8\nNext, you need to define the user inputs and variables: for\
