    # Splitting and Joining Strings


    When dealing with data in Python, especially from a user''s input, you will undoubtedly
    come across long sets of strings. A useful skill to learn in Python programming
    is being able to split those strings for better readability.


    ## STRING THEORIES


    You''ve already looked at some lists, using `.insert`, `.remove`, and `.pop` but
    there are also functions that can be applied to strings.


    - **STEP 1** The main tool in the string function arsenal is `.split()`. With
    it you''re able to split a string of data, based on the argument within the brackets.
    For example, here''s a string with three items, each separated by a space:

    `text="Daniel Hannah Emma"`


    - **STEP 3** Note that the `text.split()` part has the quotes, then a space followed
    by closing quotes and brackets. The space is the separator, indicating that each
    list item is separated by a space. Like, CSV (Comma Separated Value) contains
    commas, so you''d use:

    `text="January,February,March,April,May,June"`

    `text.split(",")`


    - **STEP 2** Now lets turn the string into a list and split the content accurately:

    `names=text.split(",")`

    Then enter the new list, to see the three items.


    ```python

    ### Python 3.4.2

    >>> Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> text="Daniel Hannah Emma" for more information.

    >>> names=text.split(",")

    >>> [''Daniel'', ''Hannah'', ''Emma'']

    ```


    - **STEP 4** You''ve previously seen how you can split a string into individual
    letters, using a name:

    `name=text.split("David")`


    ```python

    ### Python 3.4.2

    >>> Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> text="David" for more information.

    >>> name=text.split("")

    >>> [''D'', ''a'', ''v'', ''i'', ''d'']

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_13_0.png)


    # Splitting and Joining Strings


    **STEP 5** The opposite of the split join, where you will have separate items
    in a string and can join them all to form a word or join a combination of items,
    depending on the way you are writing for:


    ```python

    alphabet="".join(["a","b","c","d","e"])

    alphabet

    ```


    This will display ''abcde'' in the shell


    ![](img/763cdde75d55911fbf7836a707fd3c3b_14_0.png)


    **STEP 8** As with the split join, the separator doesn''t have to be a space,
    it can also be a comma, a hyphen or whatever you feel like:


    ```python

    colour=["Red", "Green", "Blue"]

    col="".join(colour)

    col

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_14_1.png)


    **STEP 6** You can therefore apply join, to the separated name you made in Step
    4, combining the letters again to


    ```python

    name="".join(name)

    name

    ```


    We''ve joined the string back, and retained the kept list, passing it through
    the join.


    **STEP 9** There''s some interesting functions you apply to a string, such as
    .capitalize() and .title(). For example:


    ```python

    title="con cimerian"

    title.capitalize()

    title.title()

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_14_2.png)


    ```python

    Python 3.2.2 (default, Oct 19 2014, 13:31:11)

    SGC 4.9 on linux

    Type "copyright, "credits" or "license" for more information.

    >>> name="con cimerian"

    >>> name.capitalize()

    ''Con cimerian''

    >>> name.title()

    ''Con Cimerian''

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_14_3.png)


    **STEP 7** A good example of using the join function is when you have a list of
    words you want to combine into a sentence:


    ```python

    list=["con", "raised", "his", "mighty", "and", "struck", "the"]

    text="".join(list)

    text

    ```


    Note the space between characters before the join (where were no spaces in Step
    6)


    **STEP 10** You can use logic operators on strings, to check if ''in'' and ''not''
    in strings. These enable you to check if a string contains (or doesn''t contain)
    a sequence of characters:


    ```python

    message="Have a nice day"

    "nice" in message

    "bad" not in message

    "day" in message

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_14_4.png)


    ```python

    Python 3.2.2 (default, Oct 19 2014, 13:31:11)

    SGC 4.9 on linux

    Type "copyright, "credits" or "license" for more information.

    >>> message="Have a nice day"

    >>> "nice" in message

    True

    >>> "bad" not in message

    True

    >>> "day" in message

    True

    >>> "mighty" in message

    False

    ```


