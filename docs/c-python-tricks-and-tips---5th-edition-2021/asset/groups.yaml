    Python 3.4.2 (Default, Oct 19 2014, 13:31:11)\n[GCC 4.9.2] on line\nType=\"copyright\"\
    , \"credits\" or \"license\" for more information.\n>>> NPC=(\"Conan\", 100),\
    \ (\"Beit\", 80), (\"Valeria\", 95)\n>>> max(numbers)\n109.3\n>>> min(numbers)\n\
    6.1\n```\n\n# Dictionaries\n\nLists are extremely useful but dictionaries in Python\
    \ are far more technical way of dealing with data items. They can be tricky to\
    \ get with at first then you'll be able to apply them to your own code.\n\n##\
    \ KEY PAIRS\n\nA dictionary is like a list but each data item comes as a pair,\
    \ these are known as Key and Value. The key part must be unique and can either\
    \ a number or string whereas the Value can be any data item. Let's say you create\
    \ a phonebook in Python. You would create the dictionary name and enter the data\
    \ in curly brackets, separating the key and value by a colon. For example: `phonebook={'Emma':\
    \ 1234, 'Daniel': 3456, 'Hannah': 6789}`\n\nAs with lists and tuples, you can\
    \ check the contents of a dictionary by giving the dictionary name: phonebook,\
    \ in this example will display the data items you've entered in a list, which\
