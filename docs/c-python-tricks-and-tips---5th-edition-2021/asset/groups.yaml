    # C++ Input/Output


    There''s a satisfying feeling when you program code that asks the user for input,
    then uses that input to produce something that the user can see. Even if it''s
    simply asking for someone''s name, and displaying a personal welcome message,
    it''s a big leap forward.


    User interaction, character literals, defining constants and file input and output
    are all covered in the following pages. All of which help you to understand how
    a C++ program works better.'
  - '[PAGE 45]


    # User Interaction


    There''s nothing quite as satisfying as creating a program that responds to you.
    This basic user interaction is one of the most taught aspects of any language
    and with it you''re able to do much more than simply greet your name.


    # HELLO, DAVE


    You have already used cout, the standard output stream, throughout our code. Now
    you''re going to be using cin, the standard input stream, to prompt a user response.


    +   STEP 1 Anything that you want the user to input into the program needs to
    be somewhere in the system memory, so it can be retrieved and used. Therefore,
    any input must be declared as a variable, so it''s ready to be used by the user.
    Start by creating a C++ file with headers.


    +   STEP 3 The cin command in the opposite way from the cout command. With the
    first cout line you''re output ''What is your name?'' to the screen, as indicated
    with the chevrons. Cin into facing chevrons, indicating an input. The input is
    put into the integer variable and again in the second command. Build and run the
    code.


    ```

    #include <iostream>

    using namespace std;


    int main ()

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_45_0.png)


    +   STEP 2 The data type of the variable must also match the type of input you
    want from the user. For example, to ask a user, you would use an integer like:


    +   STEP 4 If you''re asking a question, you need to store the input as a string;
    to ask the name


    ```

    #include <iostream>

    using namespace std;

    int main () {

    int age;

    cout << "What is your age: ";

    cin >> age;

    cout << "You are " << age << " years old.\n";

    }

    ```


    ```

    #include <iostream>

    using namespace std;

    int main () {

    string name;

    cout << "What is your name: ";

    cin >> name;

    cout << "Hello, " << name << ". I hope you''re well today!\n";

    }

    ```'
