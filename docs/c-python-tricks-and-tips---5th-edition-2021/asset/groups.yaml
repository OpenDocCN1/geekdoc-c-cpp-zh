    # Random Module


    The random module is one you will likely come across many times in your Python
    programming life; as the name suggests, it''s designed to create random numbers
    or letters. However, it''s not exactly random but it will suffice for most needs.


    # RANDOM NUMBERS


    There are numerous functions within the random module, when applied can create
    some interesting and very useful Python programs.


    Just as other modules you need to import random before you use any of the functions
    we''re going to learn in this tutorial. Let''s begin by simply printing a random
    from 1 to 5:


    ```

    import random

    print(random.randint(0,5))

    ```


    In our example the number four was returned. However, enter the function a few
    more times and it will return different integer values from seven to five. The
    overall quality of pseudo-randomness is adequate for the average programmer to
    practise in their code.


