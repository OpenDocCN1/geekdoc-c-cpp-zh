    \ Python 和 C++ 会出现的一些常见错误，你可以继续你的冒险。\n\n## 常见代码错误\n\n当你开始学习新事物时，不可避免会犯错，这完全是因为缺乏经验，而这些错误是很好的老师。然而，即使是专家也会偶尔出错。关键在于尽可能从错误中学习。有很多程序员需要注意的陷阱，当你进入新领域时，能够识别错误并修复它。\n\
