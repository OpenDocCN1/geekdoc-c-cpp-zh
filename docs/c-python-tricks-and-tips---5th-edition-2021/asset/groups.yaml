  - '[PAGE 7]


    # Lists


    Lists are one of the most common types of data structures will come across in
    Python. A list is simply a collection of items, or if you prefer, that can be
    accessed as a whole, or individually if wanted.


    # WORKING WITH LISTS


    Lists are extremely handy in Python. A list can be strings, integers and also
    variables. You can even include functions in lists, and within lists:


    +   - A list is a sequence of data values called items. You create the name of
    your list followed by an equals sign, square brackets and the items separated
    by commas; note that strings use quotes.


    ```

    numbers = [1, 4, 7, 21, 98, 156]

    mythical_creatures = ["Unicorn", "Balrog", "Vampire", "Dragon", "Minotaur"]

    ```


    STEP 3 You can also access, or index, the list in a list by using the minus sign
    before the item [-1], or to the second item with [-2] and so on. Trying to reference
    an item that isn''t in the list, such as [10] will return an error:


    ```

    numbers[-1]

    mythical_creatures[-4]

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_7_0.png)


    STEP 2 Once you''ve defined your list you can call each by referencing its index,
    a name or by slicing. Lists start the first entry as 0, followed by 1, 2 and 3
    and so on. For example:


    numbers


    To call up the entire contents of the list


    numbers[3]


    To call the third from zero in the list (in this case):


    STEP 4 Slicing is similar to indexing but you can retrieve multiple items in a
    list by separating item numbers with a colon:


    numbers[1:3]


    Will output the 4 and 7, being item numbers 1 and 2. Note that the returned values
    do not include the second index position (such as numbers[1:3]) will return 4,
    7.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_7_1.png)


    ```

    >>> numbers

    [1, 4, 7, 21, 98, 156]

    >>> mythical_creatures

    [''Unicorn'', ''Balrog'', ''Vampire'', ''Dragon'', ''Minotaur'']

    ```'
  - '[PAGE 8]


    # STEP 5


    You can update items within an existing list, remove items and even lists together.
    For example, to join two lists you can use:


    ```

    everything = numbers + mythical_creatures

    ```


    Then view the combined list:


    ```

    everything

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_8_0.png)


    # STEP 8


    You can view what can be done with lists by entering dir(list) into list. The
    output is the available functions, insert and pop are used to add and remove items
    at certain positions. To insert 62 at index 4:


    ```

    numbers.insert(4, 62)

    ```


    To remove it:


    ```

    numbers.pop(4)

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_8_1.png)


    # STEP 6


    Add an item to a list by inserting:


    ```

    numbers=numbers+[201]

    ```


    For strings:


    ```

    mythical_creatures+[''Griffin'']

    ```


    Or by using the append function:


    ```

    mythical_creatures.append(''Nessie'')

    ```


    # STEP 9


    You also use the list function to break a string down into its components. For
    example:


    ```

    list(''David'')

    ```


    Breaks the name David into ''D'', ''a'', ''v'', ''i'', ''d''. This can then be
    passed to a new list:


    ```

    name=list(''David'')

    ```


    ```

    name + age

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_8_2.png)


    # STEP 7


    Removal of items can be done in two ways. The first by the index number:


    ```

    del numbers[7]

    ```


    Alternatively, by name:


    ```

    mythical_creatures.remove(''Nessie'')

    ```


    # STEP 10


    Based on that, you can create a program to store your name and age.


    ```

    name=input(''What is your name? '')

    ```


    ```

    age=input(''How old are you? ''

    ```


    ```

    user = name + age

    ```


    The combined name and age is list, which can be called by entering user in the
    Shell. Experiment and see what you can do.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_8_3.png)'
- md: "\n# Working with Data\n\n## Tuples\n\nTuples are very similar to lists. However,\
    \ where lists can be updated, deleted or changed in some way, a tuple remains\
