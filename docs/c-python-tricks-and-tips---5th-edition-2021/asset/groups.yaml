    >>> print(random.randint(0,5))

    3

    ```


    ```

    >>> print(random.randint(0,5))

    1

    ```


    ```

    >>> print(random.randint(0,5))

    4

    ```


    However, the random module isn''t used exclusively for numbers. You can use it
    to select an entry from a list, and that list can contain:


    ```

    import random

    random.choice(["Conan", "Valeria", "Belit"])

    ```


    This will display the name of one of our adventurers at random, which is a great
    way to add variety to a text.


