- md: "\n# Create Your Own Modules\n\nLarge programs can be much easier to manage\
    \ if you break them up into smaller parts and import the parts you need as modules.\
    \ Learning to build your own modules also makes it easier to understand how they\
    \ work.\n\n## BUILDING MODULES\n\nModules are Python files, containing code, that\
    \ you save using a .py extension. These are imported into Python using the familiar\
    \ import command.\n\nLet's start by creating a set of basic mathematics functions.\
    \ Multiply a number by two, or raise a number to an exponent (power). Create a\
    \ New File in the IDE and editor:\n\nSTEP 1\n\n```python\ndef timestwo(x):\n \
    \   return x * 2\n\ndef timethree(x):\n    return x * 3\n\ndef square(x):\n  \
    \  return x * x\n\ndef power(x,y):\n    return x ** y\n```\n\nNow you're going\
    \ to take the function definitions out of the program and into a separate file.\
    \ Highlight the functions and choose Edit > Cut. Choose File > New File and Paste\
    \ in the new window. You now have separate files, one with the functions, the\
    \ other with the calls:\n\nSTEP 3\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_41_0.png)\n\
    \nUnder the box, enter functions to call the code:\nprint(timestwo(2))\nprint(timethree(3))\n\
    print(square(4))\nprint(power(5,3))\n\nSTEP 2\n\nIf you now try and execute the\
    \ basic_math.py code not **defined**, you will get the **NameError: 'timestwo'\
    \ is not defined**. This is because the code no longer has access to the functions.\n\
    \nSTEP 4\n\n```\nTraceback (most recent call last):\n  File \"C:/Users/Documents/Python/basic_math.py\"\
    , line 3, in <module>\n    print(timestwo(2))\nNameError: 'timestwo' is not defined\n\
    ```\n\nSave the program as basic_math.py and execute it to get the results:\n\n\
    ![](img/763cdde75d55911fbf7836a707fd3c3b_41_1.png)\n\nSTEP 5\n\nReturn to the\
    \ newly created window containing the function definitions, and click File > Save\
    \ As. Name it minim.py and save it in the same location as the original basic_math.py.\
    \ Now close the minim.py window, so the basic_math.py window is left open.\n\n\
    # Create Your Own Modules\n\nSTEP 6 Back to the basic_math.py window: at the top\
    \ of the code entry:\nfrom minimax import *\n\nSTEP 9 Finally, you can now create\
    \ a range of if statements to determine what to do with the number and the newly\
    \ created functions:\n\nThis will import the functions as you defined. Press F5\
    \ to save and execute the code to see it in action.\n\n```python\nif choice ==\
    \ '1':\n    print(timestwo(num1))\nelif choice == '2':\n    print(timethree(num1))\n\
    elif choice == '3':\n    print(square(num1))\n```\n\n```python\nelif choice ==\
    \ '4':\n    num2 = int(input(\"Enter second number: \"))\n    print(power(num1,num2))\n\
    else:\n    print(\"Invalid input\")\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_42_0.png)\n\
    \nSTEP 7 You can now use the code further to make the created module to its full\
    \ more advanced, utilizing the newly created user interaction. By creating a basic\
    \ menu you can choose from:\n\n```python\nprint(\"Select option.\\n\")\nprint(\"\
    1.Times by two\")\nprint(\"2.Times by Three\")\nprint(\"3.Square\")\nprint(\"\
    4.Power of\")\nnchoice = int(input(\"Enter choice (1/2/3/4): \"))\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_42_1.png)\n\
    \nSTEP 8 Now we can add the user to get the number the code will work on:\n\n\
    ```python\nnum1 = int(input(\"enter number: \"))\n```\nThis will save the user-entered\
    \ variable as variable num1.\n\nSTEP 10 Note that for the last options, the Power\
    \ of choice, we added a second variable, num2. This passes a second number through\
    \ the function defined. Save and execute the program to see it in action.\n\n\
    ![](img/763cdde75d55911fbf7836a707fd3c3b_42_2.png)\n\n```python\nprint(\"Select\
    \ option.\\n\")\nprint(\"1.Times by two\")\nprint(\"2.Times by Three\")\nprint(\"\
    3.Square\")\nprint(\"4.Power of\")\nnchoice = int(input(\"Enter choice (1/2/3/4):\
    \ \"))\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_42_3.png)\n\n# C++ Input/Output\n\
    \n![](img/763cdde75d55911fbf7836a707fd3c3b_43_0.png)\n\n# C++ Input/Output\n\n\
    There's a satisfying feeling when a program that asks the user for input, then\
    \ uses that input to produce something the user can see. User interaction, character\
    \ literals, defining constants and file input and output are all covered in the\
    \ following pages. All of which help you understand how C++ program works better.\n\
    \n# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and you're able to do more than simply greet your name.\
    \ You have already used cout, the standard output stream, Now you're going to\
    \ use cin, the standard input stream, to prompt a user.\n\nSTEP 1 Anything that\
    \ the user wants to input into the program needs to be declared as a variable.\
    \ The `cin` command works the opposite way from the `cout` command to output to\
    \ the screen.\n\nSTEP 2 The data type of the variable must also match the type\
    \ of input you want from the user. For example, to ask a question you would use\
    \ an integer like:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n \
    \   cout << \"You are \" << age << \" years old.\\n\";\n}\n```\n\nSTEP 3 To ask\
    \ a name you need to store the input as a string:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    string name;\n    cout << \"What is your\
    \ name: \";\n    cin >> name;\n    cout << \"Hello, \" << name << \". I hope you're\
    \ well today!\\n\";\n}\n```\n\n# User Interaction\n\nSTEP 5 The principal works\
    \ same as the previous code. The user's input is stored in a string because it\
    \ contains multiple characters. As the variable 'name' doesn't change, then can\
    \ retrieve it however you like.\n\nSTEP 8 While `cin` works for most input tasks,\
    \ it has a limitation. It is designed for single words, not multiple words. However,\
    \ `getline` can consider the first argument and the variable as:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    string mystr;\n    cout\
    \ << \"Enter a sentence: \\n\";\n    getline(cin,mystr);\n    cout << \"Your sentence\
    \ is: \" << mystr.size() << \" characters long.\";\n    return 0;\n}\n```\n\n\
    STEP 6 You can input request to the user but just make sure a variable to store\
    \ the value. Let's assume the user to enter two numbers:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    int num1, num2;\n    cout << \"Enter two\
    \ whole numbers: \\n\";\n    cin >> num1 >> num2;\n    cout << num1 << \" and\
    \ \" << num2 << \" is: \" << num1 + num2 << \" \\n\";\n    return 0;\n}\n```\n\
    \nSTEP 9 Build and execute the code, then a center with spaces. When you're done\
    \ the code reads the line replace it with `cin >> mystr` and again, the result\
    \ displays the number of characters to the stage.\n\n| | | |\n|---|---|---|\n\
    | 1 | <iostream> | |\n| 2 | using namespace std; | |\n| 3 | | |\n| 4 | int main()\
    \ | |\n| 5 | | |\n| 6 | string mystr; | |\n| 7 | cout << \"Enter a sentence: \\\
    n\"; | |\n| 8 | getline(cin,mystr); | |\n| 9 | | |\n| 10 | cout << \"Your sentence\
    \ is: \" << mystr.size() << \" characters long.\"; | |\n\nSTEP 7 Likewise, data\
    \ can be manipulated once you have stored it in a string. For instance, ask for\
    \ two numbers and do some maths on:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    int num1, num2;\n    cout << \"Enter two whole numbers:\
    \ \\n\";\n    cin >> num1 >> num2;\n    cout << num1 << \" and \" << num2 << \"\
