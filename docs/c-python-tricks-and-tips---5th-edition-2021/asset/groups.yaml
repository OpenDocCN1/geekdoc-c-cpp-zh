- md: "\n# Character Literals\n\nIn C++ a literal is an object or variable that once\
    \ defined remains the same throughout the code. However, a character literal is\
    \ defined by a backslash, such as the `\\n` you've been using at the end of a\
    \ cout statement to signify a new line.\n\n# ESCAPE SEQUENCE\n\nWhen used like\
    \ a cout statement, character literals are also called Escape Sequence Codes.\
    \ They allow you to insert a quote, an alert, new line and much more.\n\n- **STEP\
    \ 1** Create a new C++ file and enter the relevant headers:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n\n}\n```\n\n- **STEP 2** You've\
    \ already experienced the `\\n` character placing a new line wherever it's called.\
    \ The line: **cout << \"Hello\\n\\I'm a C++\\nProgram\\n\";** outputs three lines\
    \ of text, each starting after the last `\\n`.\n\n- **STEP 3** If you wanted to\
    \ insert speech quotes inside a cout statement, you would have to use a backslash\
    \ as it already uses `<iostream>`.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n\ncout << \"Hello, user. This is how to use \\\"quotes\\\
    \";\n\n}\n```\n\n| | userinteraction.cpp | <iostream> |\n|---|---|---|\n| 1 |\
    \ | #include <iostream> |\n| 2 | | using namespace std; |\n| 3 | | |\n| 4 | |\
    \ |\n| 5 | | int main () |\n| 6 | | |\n| 7 | | |\n| 8 | | |\n| 9 | | |\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_47_0.png)\n\
    \n- **STEP 4** There's a character literal that can trigger an alarm. In Windows\
    \ 10, it's the notification that chimes when you use `\\a`. Try this, and turn\
    \ up your sound.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n\ncout << \"ALARM! \\a\";\n\n}\n```\n\n| | userinteraction.cpp | <iostream>\
    \ |\n|---|---|---|\n| 1 | | #include <iostream> |\n| 2 | | using namespace std;\
    \ |\n| 3 | | |\n| 4 | | int main () |\n| 5 | | |\n| 6 | | cout << \"Hello\\n\\\
    I'm a C++\\nProgram\\n\"; |\n| 7 | | C:\\Users\\Documents\\userinteraction.exe\
    \ |\n| 8 | | process finished (0x) execution time: 0.000s |\n\n| | userinteraction.cpp\
    \ | <iostream> |\n|---|---|---|\n| 1 | | #include <iostream> |\n| 2 | | using\
    \ namespace std; |\n| 3 | | |\n| 4 | | int main () |\n| 5 | | |\n| 6 | | cout\
    \ << \"ALARM! \\a\"; |\n| 7 | | |\n| 8 | | |\n\n# A HANDY CHART\n\nThere are numerous\
    \ character literals, or escape sequence codes, to choose from. We therefore thought\
    \ it would be good for you to have a handy chart, for those times when you need\
    \ to insert a code.\n\n| ESCAPE SEQUENCE CODE | CHARACTER |\n|---|---|\n| `\\\\\
    ` | Backslash |\n| `\\'` | Single Quote |\n| `\\\"` | Double Quote (Speech Marks)\
    \ |\n| `\\?` | Question Mark |\n| `\\a` | Alert/Alarm |\n| `\\b` | Backspace |\n\
    | `\\f` | Form Feed |\n| `\\n` | New Line |\n| `\\r` | Carriage Return |\n| `\\\
    t` | Horizontal Tab |\n| `\\v` | Vertical Tab |\n| `\\uXXXX` | Null Character\
    \ (UTF-8) |\n| `\\uXXXXXXXX` | Unicode (UTF-16) |\n\n# UNICODE CHARACTERS (UTF-8)\n\
    \nUnicode characters are symbols or characters that are standard across all platforms.\
    \ For example, the copyright symbol, that can be entered via the keyboard by entering\
    \ the Unicode code, followed by ALT+X. In the case of the copyright symbol enter:\
    \ 00A9 Alt+X. In C++ code, you would use\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n\n    cout << \"\\u00A9\";\n}\n```\n\n# UNICODE\
    \ CHARACTER TABLE\n\nA complete list of the available Unicode characters can be\
    \ found at www.unicode-table.com/en/. Hover your mouse over the character to see\
    \ its unique code to enter in C++.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_48_0.png)\n\
    \n# Defining Constants\n\nConstants are fixed values in your code. They can be\
    \ any basic data type but the name suggests their value remain constant throughout\
    \ the entire code. There are two separate ways to define a constant in C++, the\
    \ #define pre-processor and const.\n\n# #DEFINE\n\nThe pre-processors are instructions\
    \ to the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as is #define.\n\nSTEP 1 You can use the\
    \ #define pre-processor to define any constants you want in our code. Start by\
    \ creating a C++ file with the following headers:\n\nSTEP 2 Now let's assume your\
    \ code has three constants: length, width and height. You can define\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define WIDTH 40\n\
    #define HEIGHT 60\n\nint main() {\n\n}\n```\n\nSTEP 3 Note the capitals for defined\
    \ constants, it's considered good practise to define all constants in capitals.\
    \ Here, the assigned values are 50, 40 and 60. Instead of using \\n for a newline\
    \ in the cout statement, you can define it here at the start of the code:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\n#define LENGTH 50\n#define\
    \ WIDTH 40\n#define HEIGHT 60\n#define NEWLINE \"\\n\"\n\nint main() {\n\n   \
    \ cout << \"Length: \" << LENGTH << NEWLINE;\n    cout << \"Width: \" << WIDTH\
    \ << NEWLINE;\n    cout << \"Height: \" << HEIGHT << NEWLINE;\n\n    return 0;\n\
    }\n```\n\nSTEP 4 Build and run the code. Just as it displays, the values for each\
    \ of your constants created. You don't need a semicolon when you're defining a\
    \ constant with the const keyword.\n\n```cpp\nconst int LENGTH = 50;\nconst int\
    \ WIDTH = 40;\nconst int HEIGHT = 60;\n```\n\nSTEP 5 You can also define other\
    \ elements as a constant.\n\nSTEP 6 The code, when built and executed, does exactly\
    \ as before, by using the newline in the cout statement. Incrementally, creating\
    \ a newline constant is a good idea unless you're making it \\n over every line\
    \ command,\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_50_0.png)\n\nSTEP 7 Defining\
    \ a constant is a good way of initialising your values at the start of your code.\
    \ You can define that you have three lines, or even the value of Pi with the C++\
    \ library:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n#define PI\
    \ 3.14159\n\nint main() {\n\n    cout << \"The Value of Pi: \" << PI << endl;\n\
    \n    return 0;\n}\n```\n\nimg/763cdde75d55911fbf7836a707fd3c3b_50_1.png\n\nSTEP\
    \ 8 Another method of defining a constant is with the const keyword. Use together\
    \ with a data type; const variable = value. Using Pi as an example:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n\n    const double\
    \ PI = 3.14159;\n    cout << \"The Value of Pi: \" << PI << endl;\n\n    return\
    \ 0;\n}\n```\n\nSTEP 9 Because you are using const within the main block of code,\
    \ you need to finish the line with a semicolon. You can use the names and values\
    \ without clash, it's worth noting that #define requires no memory, so for a small\
    \ area of memory, your approach is best.\n\nSTEP 10 Const works in the same way\
    \ as #define. You can create static integers and variables with:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n\n    const int LENGTH = 50;\n\
    \    const int WIDTH = 40;\n    const char NEWLINE = \"\\n\";\n\n    int area;\n\
    \    area = LENGTH * WIDTH;\n    cout << \"Area is: \" << area << NEWLINE;\n\n\
    \    return 0;\n}\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_50_2.png)\n\
    \n# File Input/Output\n\nThe standard iostream library provides C++ coders with\
    \ the cin and cout output functionality. However, to be able to read and write\
    \ from a file you need to utilise another C++ library, called fstream.\n\n# FSTREAMS\n\
    \nThere are two main data types within the Fstream library that are used to open\
    \ a file, read from it and write to it, ofstream and ifstream. Here's how they\
    \ work.\n\n- **STEP 1** The first task is to create a new C++ file and along with\
    \ the usual headers you need to include the new fstream header.\n\n```cpp\n#include\
    \ <iostream>\n#include <fstream>\nusing namespace std;\n\nint main() {\n\n}\n\
    ```\n\n- **STEP 2** Begin by asking a user for their name and writing that to\
    \ a file. You need the usual string to store the name, and getline to accept the\
    \ input from the user.\n\n```cpp\n#include <iostream>\n#include <fstream>\nusing\
    \ namespace std;\n\nint main() {\n\nstring namefile;\nofstream newfile;\nnewfile.open(\"\
    name.txt\");\ncout << \"Enter your name: \" << endl;\ngetline(cin, namefile);\n\
    newfile << namefile << endl;\nnewfile.close();\n\n}\n```\n\n- **STEP 3** We've\
    \ included comments in the screenshot of step 2 to help you understand the process.\
    \ You created a string name, to store the user's input name. You also created\
    \ a text file called name.txt (with the ofstream and newfile.open), asked the\
    \ user for their name and stored it and then written the data to the file.\n\n\
    ![](img/763cdde75d55911fbf7836a707fd3c3b_51_0.png)\n\n- **STEP 4** To read the\
    \ contents of a file, and output it to the screen, you need to do things differently.\
    \ You first need to create a string variable to store the file's contents (by\
    \ line), then open the file, use getline to read the line by line and output the\
    \ lines to the screen. Finally, close the file.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_51_1.png)\n"
