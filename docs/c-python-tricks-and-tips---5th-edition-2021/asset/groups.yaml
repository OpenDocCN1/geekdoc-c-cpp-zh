    # Formatting Strings


    When you work with data, creating lists, dictionaries and objects you may want
    to print out the results. Mer strings with data is easy with Python 3, as earlier
    versions of Python tended to complicate matters.


    ## FORMATTING


    Since Python 3, string formatting has become much neater process, using the .format
    function with curly brackets. It''s a more logical and better approach than previous
    versions.


    **STEP 1** The basic formatting in Python is to call each variable into the curly
    brackets:

    `name="Conan"`

    `print("the hero of the Hyborian Age is: {}".format(name))`


    **STEP 2** Remember to close the print function with two sets of brackets, as
    you''ve encased the variable in one and the print function in another. You can
    include multiple cases of string formatting in a single function:

    `name="Conan"`

    `place="Cimmeria"`

    `print("{} hailed the North, in a cold land known as {}".format(name, place))`


    **STEP 4** There are many different ways to apply string formatting, which are
    quite simple, as we''ve shown can be significantly more complex. It depends on
    what you want from your program. A good place to reference frequently string formatting
    is the Python docs, found at https://docs.python.org/3.11/library/string.html.
    Here, you will find:


    ```python

