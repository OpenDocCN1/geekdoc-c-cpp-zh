    Conan\", 100), (\"Beit\", 80), (\"Valeria\", 95)`\n\n### STEP 10 You can use the\
    \ max and min functions to find the highest and lowest value of a tuple of numbers.\
    \ The numbers can be integers or floats. To output the highest and lowest, use:\n\
