- md: "\n## If... Else Statement\n\nThere is a much better way to use an if statement\
    \ in your code, if... else works in the same way as a standard if statement. If\
    \ the Boolean expression is true, the code within the braces is executed. Else,\
    \ the code within the next set of braces is used instead.\n\n## IF YES, ELSE NO\n\
    \nThere are two sections of code that can be executed depending on the outcome\
    \ in an if... else statement. It's quite easy to visualise once you get used to\
    \ its structure.\n\n- STEP 1 Begin with a C++ file and the standard headers:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int num\
    \ = 1;\n    if (num < 30) {\n        cout << \"The number is less than 30!\" <<\
    \ endl;\n    }\n    else {\n        cout << \"The number is greater than 30!\"\
    \ << endl;\n    }\n    return 0;\n}\n```\n\n- STEP 2 Let's expand the code from\
    \ the If Statement on the previous page:\n\n```cpp\nint num = 1;\nif (num < 30)\
    \ {\n    cout << \"The number is less than 30!\" << endl;\n}\nelse {\n    cout\
    \ << \"The number is greater than 30!\" << endl;\n}\nreturn 0;\n```\n\n- STEP\
    \ 3 The first line in the code creates the integer variable and gives it a value\
    \ of 1. If the statement checks to see if the value of num is less than 30 and\
    \ if it outputs \"The number is less than 30\" to the console.\n\n```cpp\nif (num\
    \ < 30) {\n    cout << \"The number is less than 30!\" << endl;\n}\n```\n\n- STEP\
    \ 4 The else companion to it checks if the number is greater than 30 and if so,\
    \ it displays \"The number is greater than 30\" to the console, and finally is\
    \ terminated satisfactorily.\n\n```cpp\nelse {\n    cout << \"The number is greater\
    \ than 30!\" << endl;\n}\n```\n\n- STEP 5 You can change the value of num in the\
    \ code or improve the code by asking the user to enter a value:\n\n```cpp\nint\
    \ num;\ncout << \"Enter a number: \";\ncin >> num;\nif (num < 30) {\n    cout\
    \ << \"The number is less than 30!\" << endl;\n}\nelse {\n    cout << \"The number\
    \ is greater than 30!\" << endl;\n}\nreturn 0;\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_63_0.png)\n\
    \n## If... Else Statement\n\nSTEP 6 The code works the same, as you would expect,\
    \ but if you wanted to display something if the user entered the number 30? Try:\
    \ \n\nSTEP 8 You can take this up to a notch and create a two-player number guessing\
    \ game. Begin by creating the variables:\n\n```cpp\n{\n  int num;\n  cout << \"\
    Enter a number: \";\n  cin >> num;\n  if (num < 30) {\n    cout << \"The number\
    \ is less than 30!\" << endl;\n  } else if (num > 30) {\n    cout << \"The number\
    \ is greater than 30!\" << endl;\n  } else if (num == 30) {\n    cout << \"The\
    \ number is exactly 30!\" << endl;\n  }\n}\n```\n\n```cpp\nint num, guess, tries\
    \ = 0;\ncout << \"****** Two-player guessing game *******\" << endl;\ncout <<\
    \ \"\\nPlayer One, enter a number for\\nPlayer Two to guess: \" << endl;\ncout\
    \ << string(50, '\\n');\n```\n\nSTEP 9 The cout string(50,'n') line clears the\
    \ screen so Player Two doesn't see the entered number. Now you can create a do...\
    \ while loop, together with if else:\n\n```cpp\ndo {\n  cout << \"enter your guess:\
    \ \";\n  cin >> guess;\n  tries++;\n  if (guess > num) {\n    cout << \"\\nToo\
    \ High!\\n\" << endl;\n  } else if (guess < num) {\n    cout << \"\\nToo Low!\\\
    n\" << endl;\n  } else {\n    cout << \"\\nWell done! You got it in\" << endl;\n\
    \  }\n} while (guess != num);\n```\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n  int num;\n  cout << \"Enter a number: \";\n  cin >> num;\n\
    \  if (num < 30) {\n    cout << \"The number is less than 30!\" << endl;\n  }\
    \ else if (num > 30) {\n    cout << \"The number is greater than 30!\" << endl;\n\
    \  } else if (num == 30) {\n    cout << \"The number is exactly 30!\" << endl;\n\
    \  }\n  return 0;\n}\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_64_0.png)\n\
    \nThe new addition to the code is what's known as a nested if else statement.\
    \ For multiple conditions. In this case, if the user enters a number greater than\
    \ 30 or actually 30, a different outcome is presented to them.\n\nSTEP 10 Grab\
    \ a second player, and build the code. Player One enters the number to be guessed,\
    \ then Player Two can guess as many as they need to get it right. Want to make\
    \ it harder? Maybe use decimal numbers.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_64_1.png)\n\
    \n```\nC:\\Users\\David\\Documents\\C++\\Else.exe\nEnter a number: 30\nNumber\
