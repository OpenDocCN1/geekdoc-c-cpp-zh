    set_count = random.randint(1, 10)\nall = 'abcdef'\nvalue = random.choice(all)\n\
    if set_count > 5:\n    print(value)\n```\n\n### COUNTING LOOPS\n\nRemember that\
    \ in a Python loop doesn't count the last number you specify in range. So you\
