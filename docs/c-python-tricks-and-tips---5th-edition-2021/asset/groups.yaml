    \ type(\"January\") # 'str' for more information.\n>>> months=(\"January\", \"\
    February\", \"March\", \"April\", \"May\", \"June\")\n>>> NPC=(\"Conan\", 100),\
    \ (\"Beit\", 80), (\"Valeria\", 95))\n>>> NPC[0]\n100\n```\n\n# Tuples\n\n###\
    \ STEP 5 It's worth noting when referencing multiple tuples in a list, the indexing\
    \ is slightly different from the norm. If you use the 95 count of character Valeria\
    \ to NPC[5], but it's not exactly:\n\n### STEP 8 Now unpack the tuple into two\
