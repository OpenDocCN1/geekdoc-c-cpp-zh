    \ 的文本文件（使用 `ofstream` 和 `newfile.open`），询问用户的名称并存储它，然后将数据写入文件。\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_51_0.png)\n\
    \n- **步骤 4** 要读取文件内容并输出到屏幕，你需要不同的方法。首先首先创建一个字符串变量来存储文件内容（按行），然后打开文件，使用 `getline`\
