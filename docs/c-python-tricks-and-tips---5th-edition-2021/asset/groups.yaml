    \ name;\n    std::cout << \"Enter your name: \";\n    std::cin >> name;\n    std::cout\
    \ << \"Hello, \" << name << \"!\" << std::endl;\n    return 0;\n}\n```\n\n## 48\
    \ Character Literals\n\nCharacters are single characters enclosed in single quotes.\n\
    \n```cpp\nchar grade = 'A';\n```\n\n## 50 Defining Constants\n\nConstants are\
    \ defined using the `const` keyword.\n\n```cpp\nconst double PI = 3.14159;\n```\n\
    \n## 52 File Input/Output\n\nC++ uses the `fstream` library for file operations.\n\
    \n```cpp\n#include <fstream>\n#include <iostream>\n\nint main() {\n    std::ofstream\
    \ outfile(\"test.txt\");\n    outfile << \"Writing to a file.\";\n    outfile.close();\n\
