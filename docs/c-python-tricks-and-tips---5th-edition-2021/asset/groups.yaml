    # Common Coding Mistakes


    When you start something new you''re inevitably going to make mistakes, this is
    purely down to inexperience and those mistakes are great teachers in themselves.
    However, even experts make the occasional mishap. Thing is, to learn from them
    as best you can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognise a mistake and fix it when you start to move
    into more advanced territory.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_67_0.png)


    # SMALL CHUNKS


    It would be wonderful to be able to work like Neo from The Matrix movies. Simply
    ask, your operator loads it into your memory and you instantly know everything
    about the subject. Sadly, we can''t do that. The first pitfall is trying to learn
    too much, too quickly. So taking coding in small pieces and take your time.


    # EASY VARIABLES


    Meaningful naming for variables is must to eliminate common coding mistakes. Having
    letters of the alphabet is fine but what happens when the code states with a variable.
    It''s not too difficult to name variables lives, player 1 and so on.


    ```

    var points = 123;

    var line = 5;

    var totalTime = 45;

    write("Points: "points");

    write("Lives: "lives");

    write("Total Time: "totaltime");

    var totalScore = 0;

    write("Your total Score: "totalScore");

    ```


    # //COMMENTS


    Use comments is a simple concept but commenting on your code saves you from many
    problems when you come to look over it. Remember, comment lines can help you quickly
    find sections of code that are solving problems, also if you need to review an
    older piece of code.


    ```

    orig = 2;

    target = 2;


    #endif

    if (n == 0)

    return;


    // Loop running...


    // (n - 3) is the greatest multiple of 4

    // In the loop head orig will move over

    // End ends marks the barrier for falling out

    char count = orig * 2 * (n


    // If we''re aligned for writing

    // if AR_ZERO is 0 { (

    ((defined, amended)) = defined {

    ```


    # PLAN AHEAD


    While it''s great to wake up one morning and decide to code a classic text, it''s
    not practical without a small plan. Simple snippets of code can be written without
    much thinking and planning but more depth requires a working plan to stick and
    help you out knots.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_67_1.png)'
  - '[PAGE 68]


    # USER ERROR


    User input is often a paralysing mistake in code. For example, when the user is
    supposed to enter a number for their age and enter it into letters. Often a user
    can enter into such an input that overflows internal buffer, thus causing the
    code crash. Watch those user inputs and clear state what''s needed.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    You have entered wrong input

    sdfprintf(21322121,%s,13232423242323232)

    You have entered wrong input

    The number is: 12

    Process returned (0x0) execution time: .21495 s

    Press any key to continue...

    ```


    # BACKUPS


    Always make a backup of your work, with a secondary backup for any changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to revert to
    those times when something goes wrong. It''s much easier to start where you left
    off, rather than starting from the beginning.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_68_0.png)


    # RE-INVENTING WHEHEELS


    You can spend days trying to fathom out a section of code to achieve a given result
    and it''s frustrating and often wasting-time. While it''s rewarding to solve the
    problem, often the same code is out there on the Internet. Don''t try and re-invent
    the wheel, look to see if someone else has done it.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_68_1.png)


    # SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, ensure that data isn''t in cleartext. Learn how to create a function to
    encrypt sensitive data, prior to feeding into a routine that can transmit or store
    it where may be able to get to view.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_68_2.png)


    # HELP!


    Asking for help is something everyone has struggled with in the past. Will people
    be asking us at? Am I wasting everyone''s time? It''s a common mistake for someone
    to suffer in silence. As long as you are in the correct manner, obey any rules
    and be polite, your question isn''t silly.


    # MATHS


    If your code makes multiple calculations you need to ensure that the maths is
    behind it. There are thousands of instances where programs have offered incorrect
    data based on poor mathematical coding, which can have disastrous effects on what
    the code is set to do. In short, double check your code equations.


