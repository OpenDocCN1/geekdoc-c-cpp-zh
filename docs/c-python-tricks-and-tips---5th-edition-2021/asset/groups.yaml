  - "[PAGE 57]\n\n# For Loop\n\nIn some respects, a loop works in a very similar way\
    \ to that of a while, although it's structure is different. A loop is split into\
    \ three stages: an initialiser, a condition and an incremental step. Once set\
    \ up, the loop repeats itself until the condition becomes false.\n\n# LOOPY LOOPS\n\
    \nThe initialise stage of a for loop is executed only once and sets the point\
    \ reference for the loop. The condition is evaluated by the loop to see if it's\
