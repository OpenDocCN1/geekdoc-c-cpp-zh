    \ std;\n\nint main() {\n    int a, b, c, d;\n    a=10;\n    b=20;\n    c=30;\n\
    \    d=40;\n}\n```\n\n## SEMICOLONS\n\nRemember each line of C++ program must\
    \ end with a semicolon.\n\n## GCC OR G++\n\nIf you are compiling in Linux you\
    \ will come across gcc and g++. In short, gcc is the GNU Compiler (or C Compiler\
