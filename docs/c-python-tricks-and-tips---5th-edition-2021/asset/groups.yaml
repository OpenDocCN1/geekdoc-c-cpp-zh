    \ are due to missing comments in the code.\n\n# INITIALISE VARIABLE\n\nIn C++\
    \ variables aren't initialized to default. If you create a variable without it,\
    \ it is likely a random number from 0 to 18,446,744,073,709,561, which can be\
    \ difficult to include in an equation. When creating a variable, give it a value\
    \ to begin with:\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_72_0.png)\n\n```\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    int x;\n    x=0;\n\
    \    cout << x;\n}\n```\n\n# EXTRA SEMICOLON\n\nWhile it seems to have a semicolon\
    \ at the end of every C++ line, there are some exceptions to the rules. At the\
    \ end of every complete statement but some lines of code are not\n\n# #include\n\
    if lines\nswitch lines\n\nIf it confuses you, the people you know like where you\
    \ went wrong.\n\n# A.OUT\n\nA common mistake when compiling in Linux is forgetting\
    \ to name your C code post. When you compile from the Terminal, you\n\n```\n//\
    \ Program to print positive number entered by the user\nand not negative number.\
    \ If it is should\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \   int number;\n    cout << \"Enter an integer: \";\n    cin >> number;\n   \
    \ // checks if the number is positive\n    if (number > 0) {\n        cout <<\
    \ number << \" entered a positive integer\" << endl;\n    }\ncout << \"This statement\
    \ is always executed.\";\n    return 0;\n}\n```\n\nThis compiles the file.cpp\
    \ and create an a.out that can be executed with ./a.out. However, if you already\
    \ have code in it it's overwritten:\n\n```\ng+ code.cpp -o nameofprogram\n```\n\
    \n```\nFile View Search Terminal Help\ng++ main-point ~/Documents g++ test1.cpp\
    \ -o a.out\ndavid-point~/Documents g++ test1.cpp -o printerzer\ndavid-point~/Documents\
    \ $ /printerzer\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_72_0.png)"
- md: "\n## Where Next?\n\nCoding, like most subjects, is a continual learning experience.\
    \ You may not class yourself as a beginner anymore but still need to test your\
    \ code, learn new tricks and hacks to make it more efficient and even branch out\
    \ and learn another programming language.\n\n## INCLUDE<KEEP ON LEARNING>\n\n\
    What can you do to further your skills, learn new coding practices, experiment\
    \ and present your code and even begin to help others using what you've experienced\
    \ so far?\n\n## TWITTER\n\nTwitter isn't all trolls and antagonists, among the\
    \ well-personalised people who are more than willing to spread their coding knowledge.\
    \ We recommend you find a few you can relate to and follow. They often post great\
    \ tips, hacks and fixes for common coding problems.\n\n## OPEN PROJECTS\n\nLook\
    \ for open projects that you like the sound of and offer to contribute to the\
    \ code to keep it alive and up to date. There are millions of projects to choose\
    \ from, so contact a few and see where they need help. It may only be a minor\
    \ code update but it's a noble opportunity for coders to learn.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_73_0.png)\n\
    \n![](img/763cdde75d55911fbf7836a707fd3c3b_73_1.png)\n\n## KEEP CODING\n\nIf you've\
    \ mastered Python fairly, then turn your attention to C++ or C#. Keep still your\
    \ coding skills while learning a new language opens the old brain trick nicely\
    \ and gives you into another community, and how they think differently.\n\n##\
    \ SHARE SKILLS\n\nBecome active on coding and development knowledge sites, such\
    \ as StackExchange. If you have the skills to start and help others, you won't\
    \ really feel lose doing it for good so you can learn a lot by interacting with\
    \ other members.\n\n```cpp\n#pragma once\n#define EXPORT_ME __FILE__, __LINE__\n\
    const auto ptr = 3.14159, length = 0;\nconst char* s = \"hello\" noexcept(nullptr);\n\
    template<typename T> struct T {\n    static_assert(is_floating_point_v<T>, \"\
    T must be a floating point\");\n    virtual void func() override = default;\n\
    };\ntemplate<typename T> bool EqualityComparable = requires(T a, T b) -> bool;\n\
    ```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_73_2.png)\n\n## GOING MOBILE\n\
    \nThe mobile market is a great place to test your coding skills and present games\
    \ or apps you've created. If your app is good, then who knows, it could be the\
    \ next thing to appear on the stores. It's a great learning experience nevertheless,\
    \ and something worth considering.\n\n## PORTFOLIOS\n\nIf you've learned how to\
    \ code with an eye for a developer job in the future, then it's worth starting\
    \ to build up a portfolio of code. Look at jobs and see what they require, learn\
    \ and code with those skills and add it to the portfolio. When it comes to applying,\
    \ add a link to your portfolio.\n\n## My Work\n\nWant to see more examples? Email\
    \ me\n\n## Chronicle.org\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_74_0.png)\n\
    \n![](img/763cdde75d55911fbf7836a707fd3c3b_74_1.png)\n\n## ONLINE LEARNING\n\n\
    Online courses are some good examples of how to take your coding skills next,\
    \ even if you start from beginner level. An online course follows a strict coding\
    \ convention, so if you're self-taught it might be worth seeing how other developers\
    \ lay out their code, and what's considered acceptable.\n\n## TEACH CODE\n\nCan\
    \ you teach if your coding skills are spot on, consider approaching a college\
    \ or university to see if they need a programming language teacher, perhaps a\
    \ part-time or even a course. If not, consider creating your own YouTube channel\
    \ to teach code.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_74_2.png)\n\n## SHARE\
    \ CODE\n\nGet sharing, even if your code isn't very good. The criticism, advice\
    \ and comments you receive back help iron out any issues with your code, and you\
    \ add them to your checklist. Alternatively your code might be utterly amazing\
    \ but you won't know unless you share it.\n\n## HARDWARE PROJECTS\n\nContributing\
    \ to hardware projects is a great resource for proving your code with others and\
    \ learning from other members. Many of the developer boards have postings for\
    \ coders to apply for hardware projects, using unique code to get the most from\
    \ the hardware that is being designed.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_74_3.png)\n\
    \nCongratulations, we have reached the end of your latest tech adventure. With\
    \ help from our team of tech experts, you have been able to answer all your questions,\
    \ grow in confidence and ultimately master any issues you had. You can now proudly\
    \ proclaim that you are getting the absolute best from your latest choice from\
    \ the ever changing world of consumer technology and software.\n\nSo what’s next?\
    \ Do you want to start a new hobby? Are you looking to upgrade to a new device?\
    \ Or simply looking to learn a new skill? Whatever your plans are we are here\
    \ to help you. Just check our expansive range of guidebooks and you will find\
    \ what you are looking for. This adventure with us may have ended, but that's\
    \ not to say your journey is over. Every new hardware or software update brings\
    \ new challenges, and of course you already know we are here to help. We will\
    \ look forward to seeing you again.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_75_0.png)\n\
