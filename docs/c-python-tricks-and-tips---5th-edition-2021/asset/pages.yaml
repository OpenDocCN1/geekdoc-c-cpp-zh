  md: "# For Loop\n\nIn some respects, a loop works in a very similar way to that\
    \ of a while, although it's structure is different. A loop is split into three\
    \ stages: an initialiser, a condition and an incremental step. Once set up, the\
    \ loop repeats itself until the condition becomes false.\n\n# LOOPY LOOPS\n\n\
    The initialise stage of a for loop is executed only once and sets the point reference\
    \ for the loop. The condition is evaluated by the loop to see if it's true or\
    \ false and the increment executes the second and third stage.\n\n+   * STEP 1\
    \ Create a new C++ file, with the standard headers:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n\n}\n}\n```\n\n+   * STEP 4 After the loop,\
    \ you created a compound statement in braces (curly brackets), that displays the\
    \ current value of the integer num. Every time the loop repeats, the second and\
    \ third stages of the loop, it adds 1 until the condition <30 is false. The loop\
    \ then ends and code continues, ending nearly with 0.\n\n```\n//For Loop Begins\n\
    for (int num = 1; num < 30; num = num + 1)\n{\n\tcout << \"Number: \" << num <<\
    \ endl;\n\treturn 0;\n}\n```\n\n+   * STEP 2 Start simple and create a loop that\
    \ counts from 1 to 30, displaying the value to the screen with\n\n```\n//For Loop\
    \ Begins\nfor (int num = 1; num < 30; num = num + 1)\n{\n\tcout << \"Number: \"\
    \ << num << endl;\n\treturn 0;\n}\n```\n\n+   * STEP 5 A for loop is quite a neat\
    \ package in C++, all contained within its brackets, while the other elements\
    \ outside of the loop are displayed. If you want create a 10-stage condition,\
    \ you could use:\n\n```\n#include <iostream>\n#include <windows.h>\nusing namespace\
    \ std;\nint main()\n```\n\n+   * STEP 3 Working through the process of the for\
    \ loop, by creating an integer num and assigning it a value of 1. Next, set the\
    \ condition, in this case num being 30. The last stage is where you create the\
    \ increments; here's the value of being added by 1.\n\n```\n//For Loop Begins\n\
    for (int a = 10; a != 0; a = a - 1)\n{\n\tcout << a << endl;\n\tSleep(1000);\n\
    }\n```\n\n```\n//For Loop Begins\nfor (int num = 1; num < 30; num = num + 1)\n\
    ```\n\n```\ncout << \"\\nBlast Off!\"; << endl;\nreturn 0;\n}\n```"
