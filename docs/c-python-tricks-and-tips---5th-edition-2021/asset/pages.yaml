  md: "# Exceptions\n\nWhen coding, you'll naturally come some issues that are out\
    \ of your control. Let's assume you ask a user to divide two numbers and they\
    \ try to divide by zero. This will report back an error and break your code. \n\
    \n# EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python includes\
    \ exception objects which handle unexpected errors in the code. You can combat\
    \ errors by creating conditions where exceptions may occur.\n\n+   STEP 1 You\
    \ can create an exception by simply trying to divide a number by zero. With the\
    \ ZeroDivisionError: Division by zero message, as seen in the screenshot. The\
    \ exception is a class, of which there are many.\n\n+   STEP 3 You can use the\
    \ functions raise to create our error handling code Python. Let's assume your\
    \ code has warping around the cosmos, too much results in a warp core breach.\
    \ To stop the game from exiting due to the warp core, you can create a custom\
    \ exception: raise(\"warp core breach\")\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_23_0.png)\n\
    \n+   STEP 2 Most exceptions are raised automatically by Python comes across from\
    \ something's inherently wrong with the code. However, you can use your own exceptions\
    \ that are designed to contain the potential error and react to it, as opposed\
    \ to letting the code fail.\n\n+   STEP 4 To trap any errors in the code you can\
    \ catch the potential error within a block: This block consists of try, except,\
    \ where the code is held, then there's an exception to do something, do something\
    \ else.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_23_1.png)"
