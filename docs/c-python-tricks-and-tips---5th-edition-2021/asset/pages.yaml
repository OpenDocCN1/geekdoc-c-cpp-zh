  md: '# GOING MOBILE


    The mobile market is a great place to test your coding skills and present games
    or apps you''ve created. If your app is good, then who knows, it could be the
    next thing to appear on the stores. It''s a great learning experience nevertheless,
    and something worth considering.


    # PORTFOLIOS


    If you''ve learned how to code with an eye for a developer job in the future,
    then it''s worth starting to build up a portfolio of code. Look at jobs and see
    what they require, learn and code with those skills and add it to the portfolio.
    When it comes to applying, add a link to your portfolio.


    # My Work


    Want to see more examples? Email me


    # Chronicle.org


    ![](img/763cdde75d55911fbf7836a707fd3c3b_74_0.png)


    ![](img/763cdde75d55911fbf7836a707fd3c3b_74_1.png)


    # ONLINE LEARNING


    Online courses are some good examples of how to take your coding skills next,
    even if you start from beginner level. An online course follows a strict coding
    convention, so if you''re self-taught it might be worth seeing how other developers
    lay out their code, and what''s considered acceptable.


    # TEACH CODE


    Can you teach if your coding skills are spot on, consider approaching a college
    or university to see if they have need a programming language teacher, perhaps
    a part-time or even course. If not, consider creating your own YouTube channel
    to teach code.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_74_2.png)


    # SHARE CODE


    Get sharing, even if your code isn''t very good. The criticism, advice and comments
    you receive back help iron out any issues with your code, and you add them to
    your checklist. Alternatively your code might be utterly amazing but you won''t
    know unless you share it.


    # HARDWARE PROJECTS


    Contributing to hardware projects is a great resource for proving your code with
    others and learning from other members. Many of the developer boards has postings
    for coders to apply for hardware projects, using unique code to get the most from
    the hardware that is being designed.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_74_3.png)'
