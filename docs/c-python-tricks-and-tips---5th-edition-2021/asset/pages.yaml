  md: '# # Date and time


    When working with date it often has to help you see at what time a user logged
    into the system and for example, you may want to time-stamp an entry or see for
    how long. Loquiringly acquiring the date and time is easy, thanks to the Time
    module.


    # TIME LORDS


    The time module contains functions that help you retrieve the current system time,
    reads the date from strings, formats the date and much more.


    +   **STEP 1** First you need to import the time module. It''s built-in to Python
    3 so you shouldn''t need to drop a copy into prompt and import it. Once it''s
    imported, you can call the current time and date with a simple command:


    ```

    import time

    time.ctime()

    ```


    ```

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.ctime()

    ''Wed Jan  4 07:48:24 2017''

    >>>

    ```


    +   **STEP 3** You can see the structure of how time is presented by `time.localtime()`


    The output is displayed as: `time_struct_tm(tm_year=2017, tm_mon=9, tm_hour=7,
    tm_min=6, tm_sec=13, tm_wday=3, tm_yday=250, is_dst=0)`, obviously dependent on
    your current time as opposed


    ```

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.localtime()

    time_struct_tm(tm_year=2017, tm_mon=9, tm_hour=7, tm_min=6, tm_sec=13, tm_wday=3,
    tm_yday=250, is_dst=0)

    >>>

    ```


    +   **STEP 2** The time is split into nine tuples, these are divided into indexed
    items, as with any other tuple, and in the screen below.


    +   **STEP 4** There are numerous functions built into the time module. One of
    the most common is `strftime()`. With it you''ll be able to present a wide range
    of arguments as it converts the time into a string. For example, to display the
    current day of the week you use:


    | Index | Field | Values |

    |---|---|---|

    | 0 | 4-digit year | 2016 |

    | 1 | Month | 1 to 12 |

    | 2 | Day | 1 to 31 |

    | 3 | Hour | 0 to 23 |

    | 4 | Minute | 0 to 59 |

    | 5 | Second | 0 to 61 (or 60 if leap seconds) |

    | 6 | Day of Week | 0 to 6 (Monday to Sunday) |

    | 7 | Day of year | 1 to 366 (Julian day) |

    | 8 | Daylight | -1, 0, 1 - minus library defines DST |


    time.strftime(''%A'')


    ```

    Python 3.4.2 Shell

    >>> help(shell) gethelp options() help

    Python 3.4.2 (default, Oct 14, 2014, 13:51:11)

    (GCC 4.9.0) on Linux

    Type "help "credits" or "license" for more information.

    >>> time.strftime(''%A'')

    ''Wednesday''

    >>>

    ```'
