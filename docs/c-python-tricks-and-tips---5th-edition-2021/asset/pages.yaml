  md: '# # File Input/Output


    The standard iostream library provides C++ coders with the cin and cout output
    functionality. However, to be able to read and write from a file you need to utilise
    another C++ library, called fstream.


    # ## FSTREAMS


    There are two main data types within the Fstream library that are used to open
    a file, read from it and write to it, ofstream and ifstream. Here''s how they
    work.


    +   **STEP 1** The first task is to create a new C++ file and along with the usual
    headers you need to include the new fstream header.


    ```

    #include <iostream>

    #include <fstream>

    using namespace std;


    int main() {


    }

    ```


    +   **STEP 3** We''ve included comments in the screenshot of step 2 to help you
    understand the process. You created a string name, to store the user''s input
    name. You also created a text file called name.txt (with the ofstream and newfile.open),
    asked the user for their name and stored it and then written the data to the file.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_51_0.png)


    +   **STEP 2** Begin by asking a user for their name and writing that to a file.
    You need the usual string to store the name, and getline to accept the input from
    the user.


    ```

    #include <iostream>

    #include <fstream>

    using namespace std;


    int main() {


    string namefile;

    ofstream newfile;

    newfile.open("name.txt");

    cout << "Enter your name: " << endl;

    getline(cin, namefile);

    newfile << namefile << endl;

    newfile.close();


    }

    ```


    +   **STEP 4** To read the contents of a file, and output it to the screen, you
    need to do things differently. You first need to create a string variable to store
    the file''s contents (by line), then open the file, use getline to read the line
    by line and output the lines to the screen. Finally, close the file.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_51_1.png)'
