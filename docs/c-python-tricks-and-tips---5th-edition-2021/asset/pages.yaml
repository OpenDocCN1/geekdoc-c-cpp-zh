  md: "# COUNTING LOOPS\n\nRemember that in a Python loop doesn't count the last number\
    \ you specify in a range. So you wanted the loop to count from 1 to 10, then you\
    \ would need to use:\n\n```\nn = list(range(1, 11))\n```\n\nWhich will return\
    \ 1 to 10.\n\n# COLONS\n\nIt's for beginners to forget add a colon to the end\
    \ of a structural statement, such as:\n\n```\nclass Hongkong:\n    def guessed(self,\
    \ letter):\n        def __init__(self, word):\n            self.word = word\n\
    \            self.missed_letters = []\n            self.missed_letters.append(letter)\n\
    ```\n\nAnd so on. The colon separates the code, and creates the indents to which\
    \ following code belongs.\n\n```\nclass Hongkong:\n    def __init__(self, word):\n\
    \        self.word = word\n        self.missed_letters = []\n        self.missed_letters.append(letter)\n\
    \n    def guessed(self, letter):\n        if letter not in self.missed_letters:\n\
