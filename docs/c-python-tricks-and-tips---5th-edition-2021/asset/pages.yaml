  md: '# Lists


    Lists are one of the most common types of data structures will come across in
    Python. A list is simply a collection of items, or if you prefer, that can be
    accessed as a whole, or individually if wanted.


    # WORKING WITH LISTS


    Lists are extremely handy in Python. A list can be strings, integers and also
    variables. You can even include functions in lists, and within lists:


    +   - A list is a sequence of data values called items. You create the name of
    your list followed by an equals sign, square brackets and the items separated
    by commas; note that strings use quotes.


    ```

    numbers = [1, 4, 7, 21, 98, 156]

    mythical_creatures = ["Unicorn", "Balrog", "Vampire", "Dragon", "Minotaur"]

    ```


    STEP 3 You can also access, or index, the list in a list by using the minus sign
    before the item [-1], or to the second item with [-2] and so on. Trying to reference
    an item that isn''t in the list, such as [10] will return an error:


    ```

    numbers[-1]

    mythical_creatures[-4]

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_7_0.png)


    STEP 2 Once you''ve defined your list you can call each by referencing its index,
    a name or by slicing. Lists start the first entry as 0, followed by 1, 2 and 3
    and so on. For example:


    numbers


    To call up the entire contents of the list


    numbers[3]


    To call the third from zero in the list (in this case):


    STEP 4 Slicing is similar to indexing but you can retrieve multiple items in a
    list by separating item numbers with a colon:


    numbers[1:3]


    Will output the 4 and 7, being item numbers 1 and 2. Note that the returned values
    do not include the second index position (such as numbers[1:3]) will return 4,
    7.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_7_1.png)


    ```

    >>> numbers

    [1, 4, 7, 21, 98, 156]

    >>> mythical_creatures

    [''Unicorn'', ''Balrog'', ''Vampire'', ''Dragon'', ''Minotaur'']

    ```'
  merge: -1
