  md: "# # Tkinter Module\n\nWhile running your code from the command line, or even\
    \ in the Shell, the Tkinter module enables the programmer to set up a Graphical\
    \ User Interface to interact with the user, and it's surprisingly powerful too.\n\
    \n# ## GETTING GUI\n\nTkinter is easy to use but there's a lot more you can do.\
    \ Let's start by seeing how it works and getting some code into it. Before long\
    \ you will discover how powerful this module really is.\n\n+   **STEP 1** Tkinter\
    \ is usually built into Python 3. However, if it's not available you need to install\
    \ tkinter from the command prompt. We can start importing modules differently\
    \ than before, to save on typing and importing all their contents:\n```python\\\
    import tkinter as tk\nfrom tkinter import *\n```\n\n+   **STEP 3** The ideal approach\
    \ is to add mainloop() into your event loop, but we will get to that soon. You've\
    \ just created a Tkinter widget and there are several more we can play with:\n\
    ```python\nbtn=Button(root)\nbtn.pack()\nbtn[\"text\"]=\"Hello everyone\"\n```\n\
    \nThe fine focuses on the newly created window. Click back on the Shell and continue\
    \ the other lines.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_35_0.png)\n\n```\n\
    Python 3.4.2 Shell\nTkinter 3.4.2 (default, Oct 19 2014, 13:31:11)\n(C) 2000-2014\
    \ Python Software Foundation, Inc., in Windows\nType \"copyright\", \"credits\"\
    \ or \"license\" for more information.\nType help() for more general help.\n>>>\
    \ from tkinter import *\n>>> root=Tk()\n```\n\n+   **STEP 2** It's not recommended\
    \ to import everything from the module using the asterisk but it won't do any\
    \ harm normally. Let's begin by creating a basic GUI window, however:\n\n```\n\
    root=Tk()\n```\n\nThis creates a small, basic window. There's not much left to\
    \ do at this point but click the X to close the window.\n\n```\nPython 3.4.2 Shell\n\
    Tkinter 3.4.2 (default, Oct 19 2014, 13:31:11)\n(C) 2000-2014 Python Software\
    \ Foundation, Inc., in Windows\nType \"copyright\", \"credits\" or \"license\"\
    \ for more information.\nType help() for more general help.\n>>> from tkinter\
    \ import *\n>>> root=Tk()\n```\n\nThen add some functions:\n\n```\ndef click():\n\
    \    print(\"You just clicked me!\")\nbtn[\"command\"]=click\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_35_1.png)"
