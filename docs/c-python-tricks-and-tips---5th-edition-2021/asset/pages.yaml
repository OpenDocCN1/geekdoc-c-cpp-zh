    \nSTEP 8 You can take this up notch and create a two-player number guessing game.\
    \ Begin by creating the variables:\n\n```\n{\n  int num;\n  cout << \"Enter a\
    \ number: \";\n  cin >> num;\n  if (num < 30) {\n    cout << \"The number is less\
    \ than 30!\" << endl;\n  } else if (num > 30) {\n    cout << \"The number is greater\
    \ than 30!\" << endl;\n  } else if (num == 30) {\n    cout << \"The number is\
    \ exactly 30!\" << endl;\n  }\n```\n\n```\nint num, guess, tries = 0;\ncout <<\
    \ \"****** Two-player guessing game *******\"\" << endl;\ncout << \"\\nPlayer\
    \ One, enter a number for\\nPlayer Two to guess: \"\" << endl;\ncout << string(50,\
    \ '\\n');');\n```\n\nSTEP 9 The cout string(50,'n') line clears the screen so\
    \ Player Two doesn't see the entered number. Now you can create a do... while\
    \ loop, together with if else:\n\n```\ndo {\n  cout << \"enter your guess: \"\
    ;\n  cin >> guess;\n  tries++;\n  if (guess > num) {\n    cout << \"\\nToo High!\\\
    n\" << endl;\n  } else if (guess < num) {\n    cout << \"\\nToo Low!\\n\" << endl;\n\
    \  } else {\n    cout << \"\\nWell done! You got it in\" << endl;\n  }\n} while\
    \ (guess != num);\n```\n\n```\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n  int num;\n  cout << \"Enter a number: \";\n  cin >> num;\n  if (num\
    \ < 30) {\n    cout << \"The number is less than 30!\" << endl;\n  } else if (num\
    \ > 30) {\n    cout << \"The number is greater than 30!\" << endl;\n  } else if\
    \ (num == 30) {\n    cout << \"The number is exactly 30!\" << endl;\n  }\n  return\
    \ 0;\n}\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_64_0.png)\n\nThe new\
    \ addition to the code is what's known as a nested if else statement. For multiple\
    \ conditions. In this case, if the user enters a number greater than 30 or actually\
