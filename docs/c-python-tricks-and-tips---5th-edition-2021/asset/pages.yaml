  md: "# # Create Your Own Modules\n\nLarge programs can be much easier to manage\
    \ if you break them up into smaller parts and import the parts you need as modules.\
    \ Learning to build your own modules also makes it easier to understand how they\
    \ work.\n\n# ## BUILDING MODULES\n\nModules are Python files, containing code,\
    \ that you save using a .py extension. These are imported into Python using the\
    \ familiar import command.\n\nLet's start by creating a set of basic mathematics\
    \ functions. Multiply a number by two, or raise a number to an exponent (power).\
    \ Create a New File in the IDE and editor:\n\nSTEP 1\n\n```\ndef timestwo(x):\n\
    \    return x * 2\n\ndef timethree(x):\n    return x * 3\n\ndef square(x):\n \
    \   return x * x\n\ndef power(x,y):\n    return x ** y\n```\n\nNow you're going\
    \ to take the function definitions out of the program and into a separate file.\
