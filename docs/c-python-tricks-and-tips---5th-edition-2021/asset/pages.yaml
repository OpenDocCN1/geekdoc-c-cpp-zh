    Python and C++. You can create code, store data, ask the user questions, offer
    them a choice and repeat functions until they prove true and provide the correct
    output. What next then?


    This final section looks at some of the more common coding mistakes that Python
    and C++ beginners make and where you can turn to next to continue your programming
    adventure.'
