    \ items.\n\n# ## THE IMMUTABLE TUPLE\n\nReasons for having tuples vary depending\
    \ on what the program is intended to do. Normally, a tuple is reserved for something\
    \ special but they're also used for example, in an adventure game, where non-playing\
    \ character names are stored.\n\n+   ### STEP 1\nA tuple is created the same way\
    \ as a list but in this case you use curved brackets instead of square brackets.\n\
    months=(\"January\", \"February\", \"March\", \"April\", \"May\", \"June\")\n\n\
