  md: '# # Python Graphics


    While dealing with text on the screen, either as a game or in a program, it is
    great, there will come a time when a bit of graphical representation wouldn''t
    go amiss. Python 3 has numerous ways in which to include graphics and they''re
    surprisingly powerful too.


    # ## GOING GRAPHICAL


    You can draw simple graphics, lines, squares and so on, or you can use one of
    the many Python modules available, to bring out spectacular effects.


    +   - **STEP 1** One of the best graphical modules to begin learning Python graphics
    is Turtle. The Turtle is based on turtle robots used in many schools, that can
    be programmed to draw something on a large piece of paper. The Turtle module can
    be imported with: `import turtle`


    +   - **STEP 3** The command turtle.circle(50) is what draws the circle on the
    screen, with 50 being the size. beyond, you can draw with the sizes you like,
    going up to 100, 150 and 180), where the size is 50, but you''re telling Python
    to only draw 180° of the circle.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_25_0.png)


    ```

    Python 3.4.2 (Default. Oct 19 2014, 13:31:11)

    >>> import turtle

    >>> type(turtle)

    <module ''turtle''>

    >>> type("credits or "license") for more information.

    >>> turtle

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_25_1.png)


    +   - **STEP 2** Let''s begin by drawing a simple circle. Start a New File, then
    enter the following code:

    import turtle

    turtle.circle(50)

    turtle.getscreen()._root.mainloop()

    As usual press F5 to save the code and execute it. A new window will open up and
    the ''Turtle'' will draw a circle.


    +   - **STEP 4** The last part of the circle code tells Python to keep the window
    where drawing is taking place to remain open, so the user can close it. Now, let''s
    make a square:

    import turtle

    print("Drawing a square_")

    for t in range(4):

    turtle.forward(100)

    turtle.left(90)

    turtle.getscreen()._root.mainloop()

    nYou can see that we''ve inserted a loop to draw the sides of the square.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_25_2.png)


    ![](img/763cdde75d55911fbf7836a707fd3c3b_25_3.png)'
