  md: '# # Opening Files


    In Python you can read and write binary files in your programs. You can also write
    to file, which is something we are not good at. Reading and writing files enables
    you to output and store data from your programs.


    # ## OPEN, READ AND WRITE


    In Python you can create a file object, similar to creating a variable, only pass
    in file using the open() function. Files are usually categorised as text or binary.


    +   - **STEP 1** Start by opening your system''s text editor. The text editor
    is best, not a word processor, as word processors include background formatting
    and other elements. In example, we have the Poem Cimmerian, by Robert E Howard.
    You need to save the file as poem.txt.


    +   **STEP 3** If you now enter into the Shell, you will get some information
    reading the file you just asked to opened. You can now use the poem to read the
    contents of the file:


    ```

    poem.read()


    Note an entry in each text represents a new line, as you used previously.

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_19_0.png)


    +   **STEP 2** You use the open() function to pass the file into a variable and
    object. You can name the file object anything you like, but you will need to tell
    Python the name and location of the file you are opening:


    ```

    poem=open("/home/pi/Documents/Poem.txt")

    ```


    +   **STEP 4** If you now enter a second time you will notice that the text has
    been read from the file. You will need to enter: `poem(\("/home/pi/Documents/Poem.txt")`
    to recreate the file. This, however, is:


    ```

    print(poem.read())

    ```


    This, in entry will return entries in Favour of new lines and readable text.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_19_1.png)'
