  md: '# # OS Module


    The OS module allows you to interact directly with the built-in commands in your
    operating system. Commands vary depending on the OS you''re running, as some will
    work with Windows whereas others will work with Linux and macOS.


    # ## INTO THE SYSTEM


    One of the primary features of the OS module is the ability to list, move, create,
    delete and otherwise interact with files stored on the system, making it the perfect
    module for backup code.


    You can start the os module with some simple system environment that Python interacts
    with. If you''re using Linux or the Raspberry Pi, try this:


    ```

    import os

    home=os.getcwd()

    print(home)

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_31_0.png)


    **STEP 3** The Windows output is different from that''s the system: as you might
    suspect, the os.getcwd() function is asking Python to retrieve the Current Working
    Directory. Linux users will see something alike as the Raspberry Pi, as


    **STEP 2** The returned result from printing the variable home is the current
    user''s folder on the system. In our example that./home/pi; it will be different
    depending on the user name you log in and the operating system you use. For example,
    Windows 10 will output: C:\Program Files (x86)\Python36-32.


    **STEP 4** Yet another interesting element to the OS module, is its ability to
    launch programs that are installed in the system host. For instance, if you wanted
    to launch the Chrome browser from within a Python program you can use the command:


    ```

    import os

    browser=os.system("/usr/bin/chromium-browser")

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_31_1.png)'
