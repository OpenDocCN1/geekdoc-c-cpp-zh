  md: '# STEP 5


    Adding to a dictionary is easy too. You can include a new data entry by adding
    the new key and value items:


    phonebook["David"] = "0987 654 321"


    ```

    # Python 3.4.2

    >>> phonebook = {}

    >>> phonebook["David"] = "0987 654 321"

    >>> type("dict") or type("list") for more information.

    <class ''dict''>

    >>> len(phonebook)

    1

    >>> print(phonebook["David"])

    ''David

    0987 654 321

    ```


    # STEP 8


    Next, you need to define the user inputs and variables: for one person''s name,
    the other (let''s keep it simple to avoid lengthy code):


    name=input("Enter name: ")

    number=int(input("Enter phone number: "))


    ```

    # Python 3.4.2

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    ```


    # STEP 6


    You can also remove items from a dictionary by issuing the del command following
    the item''s key; the value will be removed as well, which is a part of our data
    items:


    del phonebook["David"]


    ```

    # Python 3.4.2

    Python 3.2 (default, Oct 19 2014, 13:21:11)

    >>> type("dict") or type("list") for more information.

    <class ''dict''>

    >>> phonebook["David"] = "0987 654 321"

    >>> del phonebook["David"]\n>>> len(phonebook)

    0

    ```


    # STEP 9


    We''ve keep the number of a string, an integer or a string. You now need to add
    the user''s inputs to the newly created dictionary. By using the same process
    as Step 5, you can


    phonebook[name] = number


    ```

    # Python 3.4.2

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    ```


    # STEP 7


    This taking a step further, how creating a piece of code that will ask the user
    for the key and value items? Create a new editor instance and start to coding
    in the


    phonebook[]


    ```

    # Python 3.4.2

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    ```


    # STEP 10


    Now you save and execute the code, Python will ask you for a name and a number.
    It will then insert into the phone dictionary, which you can then insert in the:


    phonebook

    phonebook["David"]


    If the need to contain spaces to make it a string, remove the int part of the
    input.


    ```

    # Python 3.4.2

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    >>> print(phonebook)

    ```


