  md: '# Dictionaries


    Lists are extremely useful but dictionaries in Python are by far more technical
    way of dealing with data items. They can be tricky to get grips with at first
    but then you''ll be able to apply them to your own code.


    # KEY PAIRS


    A dictionary is like a list but instead each data item comes as a pair, these
    are known as Key and Value. The key part must be unique and can either be a number
    or string whereas the Value can be any data item you like.


    Let''s say you create a phonebook in Python. You would create the dictionary name
    and enter the data in curly brackets, separating the key and value by a colon
    Key:Value. For example:


    ```

    phonebook={''Emma'': 1234, ''Daniel'': 3456, ''Hannah'': 6789}

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_11_0.png)


    As with lists and tuples, you can check the contents of a dictionary by giving
    the dictionary name: phonebook, in this example will display the data items you''ve
    entered in a list, which you''d doubt however by now.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GCC 4.9.2 on Linux

    >>> Type "help" or "license" for more information.

    >>> phonebook[''Emma'']

    1234

    >>> phonebook[''Daniel'']

    3456

    >>> phonebook[''Hannah'']

    6789

    ```


    Just as with most lists, tuples and so on, strings need to be enclosed in quotes
    (single or double), whilst integers can be left open. To return the value you
    just need to enclose the key in one quotes:


    ```

    phonebook[''Daniel'']=0987 654 321

    ```


    The benefit of using a dictionary is that you can enter the index to the value.
    Using the phonebook from the previous examples, you can


    phonebook[''Emma'']

    phonebook[''Hannah'']


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    GCC 4.9.2 on Linux

    >>> Type "help" or "license" for more information.

    >>> phonebook[''Emma'']

    1234

    >>> phonebook[''Daniel'']

    3456

    >>> phonebook[''Hannah'']

    6789

    >>> phonebook[''Emma'']

    1234

    >>> phonebook[''Hannah'']

    6789

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_11_1.png)'
