  md: '# STEP 6


    Interestingly, you can also use a function within the random module to shuffle
    the items in the list, adding a little more randomness to the equation:


    ```

    random.shuffle(list)

    print(list)

    ```


    This way, you can keep shuffling the list before displaying a random item from
    it.


    # STEP 9


    Let''s use an example of code which flips a virtual coin ten thousand times and
    counts how it lands on heads or tails:


    ```

    import random

    output={"Heads":0,"Tails":0}

    coin=list(output.keys())

    for i in range(10000):

    output[random.choice(["Heads","Tails"]])+=1

    print("Heads:", output["Heads"])

    print("Tails:", output["Tails"])

