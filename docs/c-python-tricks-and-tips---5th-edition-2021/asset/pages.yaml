  md: "# Beginner C++ Mistakes\n\nThere are many pitfalls the C++ developer can encounter,\
    \ especially as this is a more complex and often unforgiving language to master.\
    \ Beginners need to take C++ a step at a time and digest what they've learned\
    \ before moving on.\n\n# VOID(C++, MISTAKES)\n\nAdmittedly it is not just C++\
    \ beginners who make the kinds of errors we outline on these pages, even hardened\
    \ coders are prone to the odd mishap here. Here are some common issues to try\
    \ and avoid.\n\n# UNDECLARED IDENTIFIERS\n\nA common C++ mistake, and to be honest\
    \ a common mistake with most programming languages, is when you try and output\
    \ a variable that doesn't exist. Displaying the value of x on screen is fine but\
    \ not if you haven't told the compiler what the value of x is to begin with.\n\
    \n# STD NAMESPACE\n\nReferencing the Standard Library is common for beginners\
    \ throughout their code, but if you miss the std:: element of a statement, your\
    \ code errors out when compiling. You can combat this by adding:\n\n```\nusing\
    \ std;\n```\n\nUnder the #include part and simply using cout, and so on when\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    int a, b,\
    \ c, d;\n    a=10;\n    b=20;\n    c=30;\n    d=40;\n    cout << a, b, c, d;\n\
    }\n```\n\n# SEMICOLONS\n\nRemember each line of a C++ program must end with a\
    \ semicolon. If it doesn't the compiler treats the line with the missing semicolon\
    \ as the next semicolon. This creates all manner of problems when trying to compile,\
    \ so don't forget semicolons.\n\n```\n#include <iostream>\n```\n\n# GCC OR G++\n\
    \nIf you're compiling in Linux you will not come across gcc and g++. In short,\
    \ gcc is the GNU Compiler (or GNU C Compiler as it was used to be) and g++ is\
    \ the GNU (the C++ version). If you're using g++, the compiler will try to use\
    \ your code, so the incorrect errors will be generated.\n\n```\nint main() {\n\
    \    int a, b, c, d;\n    a=10;\n    b=20;\n    c=30;\n    d=40;\n    cout <<\
    \ a, b, c, d;\n}\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_71_0.png)"
