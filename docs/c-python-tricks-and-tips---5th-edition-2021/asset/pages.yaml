  md: '# Calendar Module


    STEP 5 You can also create a program that will display all the days, weeks and
    months within a given year:


    ```

    import calendar

    year=int(input("Enter the year to display: "))

    print(calendar.month(year))

    ```


    We''re sure you''ll quite agree that a handy bit of code to handle.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_30_0.png)


    STEP 8 You''re also able to print the individual months or days of the week:


    ```

    import calendar

    for name in calendar.month_name:

    print(name)

    ```


    ```

    import calendar

    for name in calendar.day_name:

    print(name)

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_30_1.png)


    STEP 6 Interestingly we can list the number of days in a month by using a simple
    loop:


    ```

    import calendar

    cal=calendar.TextCalendar(calendar.SUNDAY)

    for i in cal.monthdays(2018, 6):

    print(i)

    ```


    ![](img/763cdde75d55911fbf7836a707fd3c3b_30_2.png)


    STEP 9 The calendar module also allows us to write the functions in HTML, so that
    you can display it on a website. Let''s start by creating a new file:


    ```

    import calendar

    cal=open("/home/pi/Documents/calendar.html", "w")

    cal.write(calendar.TextCalendar(calendar.SUNDAY).formathtml(2018, 1))

    print("Done")

    cal.close()

    ```


    This code will create an HTML file called calendar, open it with a browser and
    it displays the calendar for January 2018.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_30_3.png)


    STEP 7 You can see that code produced zeros at the starting of the week, Sunday
    in case, and overlapping days from the previous month. So the count of days will
    start on Friday 2018 and 2013 to show the output firstcls.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_30_4.png)


    STEP 10 Of course, you can modify to display a given day as a web page:


    ```

    import calendar

    year=int(input("Enter the year to display as a webpage: "))

    cal=open("/home/pi/Documents/calendar.html", "w")

    cal.write(calendar.TextCalendar(calendar.MONDAY).formatyear(year))

    cal.close()

    ```


    This code asks for the user, then creates the necessary webpage. Remember to change
    your destination file.


