    ;\n\n    int area;\n    area = LENGTH * WIDTH;\n    cout << \"Area is: \" << area\
    \ << NEWLINE;\n\n    return 0;\n}\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_50_2.png)"
