  md: "# STEP 5\n\nYou can also define other elements as a constant. For example,\
    \ instead of using \\n for a newline in the cout statement, you can define it\
    \ here at the start of the code:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n#define NEWLINE\
    \ \"\\n\"\n\nint main() {\n\n    cout << \"Length: \" << LENGTH << NEWLINE;\n\
    \    cout << \"Width: \" << WIDTH << NEWLINE;\n    cout << \"Height: \" << HEIGHT\
    \ << NEWLINE;\n\n    return 0;\n}\n```\n\n# STEP 8\n\nAnother method of defining\
    \ a constant is with the const keyword. Use together with a data type; const type\
    \ variable = value. Using Pi as an example:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n\n    const double PI = 3.14159;\n    cout <<\
    \ \"The Value of Pi: \" << PI << endl;\n\n    return 0;\n}\n```\n\n# STEP 6\n\n\
    The code, when built and executed, does exactly as before, by using the new newline\
    \ in the cout statement. Incrementally, creating a newline constant is a good\
