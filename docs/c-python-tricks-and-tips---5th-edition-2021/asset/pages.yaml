    \ matters.\n\n# STRING FORMATTING\n\nSince Python 3, string formatting has become\
    \ much neater process, using the .format function combined with curly brackets.\
    \ It's a more logical and better approach than previous versions.\n\n+   STEP\
    \ 1\nThe basic formatting in Python is to call each variable into the curly brackets:\n\
    name=\"Conan\"\nprint(\"the barbarian hero of the Hyborian Age is: {}\".format(name))\n\
