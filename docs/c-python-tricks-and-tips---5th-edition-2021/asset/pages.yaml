  md: "# STEP 5\n\nThe os.system function is what allows interaction\nwith external\
    \ programs; you can even call up\nprevious Python programs using this method.\
    \ You will obviously\need to know the full path and program name for it to work\n\
    successfully. You can use the following:\n\n```\nimport os\ns.system('start chrome\
    \ \"https://www.youtube.com/\nfeed/music/\")\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_32_0.png)\n\
    \n# STEP 8\n\nThe ability to manipulate directories, or folders\nyou prefer, is\
    \ one of the OS module's best features.\nFor example, to create a new directory\
    \ you can use:\n\n```\nimport os\ns.mkdir(\"NEW\")\n```\n\nThis creates a new\
    \ directory in the Current Working Directory,\nnamed according to the mkdir function.\n\
    \n![](img/763cdde75d55911fbf7836a707fd3c3b_32_1.png)\n\n# STEP 9\n\nYou can rename\
    \ any directories you've created\nby entering:\n\n```\nimport os\ns.rename(\"\
    NEW\", \"OLD\")\n```\n\nTo delete:\n\n```\nimport os\ns.rmdir(\"OLD\")\n```\n\n\
    ![](img/763cdde75d55911fbf7836a707fd3c3b_32_2.png)\n\n# STEP 6\n\nFor Step 5's\
    \ example we used Windows, to show\nthat the OS works roughly the same\nall platforms.\
    \ In that, we opened YouTube's music feed, so\nit is therefore possible to open\
    \ specific pages:\n\n```\nimport os\ns.system('chromium-browser \"http://\ndmpublications.com/\\\
    ')\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_32_3.png)\n\n# STEP 10\n\n\
    Another module that goes together with OS\nshutil. You can use the shutil module\n\
    with OS and time to create a timestamp-backed directory,\nand copy files into:\n\
    \n```\nimport os, shutil, time\nroot_src_dir = r'/home/pi/Documents/'\ndst_dst_dir\
    \ = r'/home/pi/backup/' + time.asctime(0)\nfor root, dirs, files in os.walk(root_src_dir):\n\
    \    for d in dirs:\n        dst = os.path.join(dst_dst_dir, d.replace(root_src_dir,\
    \ ''))\n```\n\n```\nif not os.path.exists(dst):\n    os.makedirs(dst)\nfor file\
    \ in files:\n    src_file = os.path.join(root_src_dir, file)\n    dst_file = os.path.join(dst,\
    \ file)\n    if os.path.exists(dst_file):\n        shutil.copy(src_file, dst_file)\n\
    print('>>>>>>>>>>Backup complete<<<<<<<<<<')\n```\n\n# STEP 7\n\nNote in the previous\
    \ step's example we use\nsingle and double quotes. The single quotes\nentire command\
    \ and launching Chromium, whereas the double\nquotes opened the specific page.\
    \ You can use variables to\ncall in the same browser:\n\n```\nimport os\na=('chromium-browser\
    \ \"http://Bdpublications.com/\n/\\')\nb=('chromium-browser \"http://www.google.co.uk/\\\
    ')\ns.system(a+b)\n```\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_32_4.png)\n\
    \n![](img/763cdde75d55911fbf7836a707fd3c3b_32_5.png)"
