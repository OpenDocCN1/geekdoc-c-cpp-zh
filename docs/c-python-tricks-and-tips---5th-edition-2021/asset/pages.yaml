    \nYou can also display text and images within a Tkinter window. However, only\
    \ GIF, PCM or PPM formats are supported. So find an image and convert it to the\
    \ other. Here is an example from the BDM Publishing:\n\nfrom tkinter import *\n\
    \n```\nroot = Tk()\nlogo = PhotoImage(file=\"/home/pi/Downloads/BDM.gif\")\nimage\
    \ = Label(root, image=logo, pack=side=\"left\")\nimage.pack(side=\"left\")\nw1\
    \ = Label(root, text=\"BDM Publications\")\nw1.pack(side=\"right\")\ncontent =\
    \ \"From humble beginnings in 2004, the BDM brand grew quickly from a single publication\
    \ to become one of the largest names in global book publishing for two simple\
    \ reasons. Our passion and commitment to deliver the very best product and every\
    \ volume. While the company grew with a portfolio of over 250 titles delivered\
    \ by international staff, the foundation that has been built upon remains the\
    \ same, which is why we believe BDM isn't just the first choice - it's the smart\
    \ choice for you.\nw2 = Label(root, justify=LEFT, pack=10, text=content)\n.pack(side=\"\
    left\")\nroot.mainloop()\n```\n\n# STEP 8\n\nYou can create radio buttons too.\
    \ Try:\n\n```\nfrom tkinter import *\nroot = Tk()\nv = IntVar()\nLabel(root, title=\"\
    Options\", text=\"Choose\na preferred language:\"\")\n(justify=LEFT, padx=20).pack()\n\
    Radiobutton(root, text=\"Python\", variable=v, value=1).pack(anchor=W)\nRadiobutton(root,\
    \ text=\"C++\", variable=v, value=2).pack(anchor=W)\nmainloop()\n```\n\n# STEP\
    \ 9\n\nYou can create check boxes, with buttons and output to the Shell:\n\n```\n\
    from tkinter import *\nroot = Tk()\ndef var_states():\n    print(\"Choice: %d\\\
    nName: %d\" % (var1.get(), var2.get()))\nvar1 = IntVar()\nLabel(root, title=\"\
    Adventure Game\")ngrid.grid(row=0, column=0)\nCheckbutton(root, text=\"Warrior\"\
    , variable=var1)\ngrid.grid(row=1, column=0)\nvar2 = IntVar()\nCheckbutton(root,\
    \ text=\"Magic\", variable=var2)\ngrid.grid(row=2, column=0)\nButton(root, text=\"\
    Quit\", command=destroy)\ngrid.grid(row=3, column=0)\nButton(root, text=\"Show\"\
    , command=var_states)\ngrid.grid(row=4, column=0)\nmainloop()\n```\n\n# STEP 7\n\
    \nThe previous code is quite weighty, mostly due to the content including part\
    \ of BDM's About page from the website. You can also change the content, the root_title\
    \ and the image to suit your needs.\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_36_1.png)\n\
    \n# STEP 10\n\nThe code introduced from Step 9 introduces geometry elements in\
    \ Tkinter. Note this describes the locations of the check boxes and buttons (North,\
    \ East, South and West). The root argument places on separate rows. Have a play\
    \ and see what you get:\n\n![](img/763cdde75d55911fbf7836a707fd3c3b_36_2.png)\n\
    \nwww.bdmpublications.com 37"
