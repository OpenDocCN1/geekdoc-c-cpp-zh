    \n# STEP 9\n\nBecause you are using const within the main block of code, you need\
    \ to finish the line with a semicolon. You can use the names and values without\
    \ clash, it's worth noting that #define requires no memory, so for a small area\
    \ of memory, your approach is best.\n\n# STEP 7\n\nDefining a constant is a good\
    \ way of initialising your values at the start of your code. You can define that\
    \ you have three lines, or even the value of Pi with the C++ library:\n\n```\n\
    #include <iostream>\nusing namespace std;\n\n#define PI 3.14159\n\nint main()\
