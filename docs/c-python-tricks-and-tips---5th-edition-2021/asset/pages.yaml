  md: '# While Loop


    While a loop''s function is to repeat a statement, or a group of statements, while
    a condition remains true. When the while loop starts, it initializes itself by
    testing the condition of the loop and the statements within, before executing
    the rest of the loop.


    # TRUE OR FALSE?


    While are one of the most popular form of C++ code looping. They repeatedly run
    the code contained within the while condition is true. Once it proves false, the
    code continues as normal.


    +   STEP 1 Clear what you''ve done so far and create a new C++ file. There''s
    no need for any extra headers as per


    ```

    #include <iostream>

    using namespace std;


    int main() {


    ```


    +   STEP 3 First you need to create a condition, use a variable name and give
    it the value 1. Now create the while loop, stating that as long as num is less
    than 30, the loop is true. The loop value of num is displayed and adds 1 until
    it''s more than 30.


    ![](img/763cdde75d55911fbf7836a707fd3c3b_55_0.png)


    ```

