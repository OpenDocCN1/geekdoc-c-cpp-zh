  md: "# # Calendar Module\n\nBeyond the time module, the calendar module can produce\
    \ some interesting results when executed within your code. It does far more than\
    \ simply display the data in the time module-like format, you can actually call\
    \ up a wall calendar type display.\n\n# ## WORKING WITH DATES\n\nThe calendar\
    \ module is built into Python 3. However, if for some reason it's not installed\
    \ you can add it using pip install calendar as a Windows administrator or sudo\
    \ pip install calendar for Linux and macOS.\n\n+   * **STEP 1** Launch Python\
    \ and import calendar to call up the module and inherit functions. It's loaded\
    \ into memory, by entering:\n`sep=calendar.TextCalendar(calendar.SUNDAY)`\n`sep.month(2017,9)`\n\
    \n+   * **STEP 3** There are numerous functions within the calendar module that\
    \ may be of interest to you when forming your code. For example, you can display\
    \ the number of leap years between two specific years:\n`leaps=calendar.leapdays(1900,2018)`\n\
    `print(leaps)`\n\nThe result is 29, starting from 1904.\n\n```\nPython 3.2 Shell\n\
    Em E Shell Debug Config windows x\nPython 3.2 (default, Oct 19 2014, 13:01:11)\n\
    >>> import calendar\n>>> dir(calendar)\n>>> print('credits' or 'license') for\
