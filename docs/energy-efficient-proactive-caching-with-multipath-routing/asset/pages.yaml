    # ## 3. System model


    # ### 3.1. Network model


    The network is modelled as an undirected graph G = (E, L) as shown in Fig. 1,
    where E represents the set of nodes and L denotes the set of links. Each link
    l ∈ L is equipped with bandwidth c_l. The nodes are partitioned to access routers²
    (AR) A ⊂ C, forward routers F ⊂ C and servers {0} ∈ E. Additionally, each caching
    node c ∈ E^C = E\{0} has storage capacity a_c, and can provide both data flow
    forwarding and content caching services.


    Let N be the set of contents. For each content n ∈ N, the required caching size
    and transmission bandwidth are represented by s_n and b_n, respectively. Without
    loss of generality, we assume all contents can be retrieved from backbone servers;
    in case of a cache miss, the user-requested file is described as x_{n,k}, which
    is the probability of user k requesting file n. Furthermore, we use x_{k,t} to
    represent the user k accesses to the network service via AR a_t, which depends
    on


    2 Here we consider the ICN-based network structure. Thus, the term router in this
    paper is not the core router in the Internet backbone but the ICN content router
    [2].


    the user movement behaviour. For modelling simplification purposes, we assume
    the user''s movement is already known, thus x_{k,t} becomes a binary indicator;
    otherwise, x_{k,t} is the moving probability and the model for this case is discussed
    in our previous work [30]. Regarding the user mobility prediction, some commonly-used
    models include association rule-based model [31], Markov-based model [32,33] and
    deep neural network-based model [34,35] by mining historical data and extracting
    user location information. Consequently the aggregated number of request for content
    n at AR a, x_{n,a}, can be determined by x_{n,a} = \sum_k x_{n,k}. For ease of
    reference, all used symbols and their meanings are summarized in Table 2.


    # ### 3.2. Energy model


    In this paper, we focus on two types of energy consumption in the caching-enabled
    network: the caching energy E^C and the communication transmission energy E^T.
    Therefore, the total energy consumption can be represented by E = E^C + E^T. Similar
    to [22], the caching energy is a proportional iteration of content size and can
    be given by,


    ```

    E^C = \sum_{n \in \mathcal{N}} \sum_{k \in \mathcal{K}} \alpha x_n \cdot s_n \cdot
    T, (1)

    ```


    where \alpha is the power efficiency for caching n-bit of information; s_n is
    the required caching space for content n; x_n is a binary decision'
