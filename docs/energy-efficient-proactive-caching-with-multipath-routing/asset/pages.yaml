  md: 'popular content and how to design an efficient routing path to minimize the
    total energy consumption while satisfying the network resource limitations. To
    date, there are a number of prior works on the issues related to location selection
    for hosting popular content in order to minimize energy consumption as detailed
    in Section 2. However, most of these works do not take the routing policies into
    consideration or only adopt the shortest path. It is insufficient to only consider
    the shortest path routing especially when the network bandwidth is limited.


    Inspired by the above discussion, in this article, we jointly consider the caching
    placement and multipath routing to minimize the total energy consumption and study
    the following two content delivery models [13]: (1) the service flow can be shared
    if the users have the same content preference as well as connected access router,
    which is called *multicast mode*. For example, semi-synchronous requests can be
    bundled together and served via a single transmission. (2) the service flow cannot
    be shared and each request is satisfied with an independent (unicast) transmission,
    i.e. unicast mode. We also consider explicitly the caching memory space and link
    bandwidth limitations. The main contributions of this work can be summarized as
    follows.


    +   - An energy-efficient caching scheme is proposed by jointly considering the
    content placement and multipath routing. The problem is formulated as an optimization
    model with caching space and link capacity limitations. In particular, two Integer
    Linear Programming (ILP) models are derived according to the two delivery models.

    +   - Since the proposed ILP models belong to the N-P hard family, we provide
    a heuristic algorithm named Greedy Simulated Annealing Caching (GSAC). In this
    approach, we divide the original problem into several sub-problems and employ
    the simulated annealing to find sub-optimal, albeit competitive, solutions for
    caching nodes recursively.

    +   - To understand the performance gap among evaluated methods, a wide-set of
    simulations is performed under different scenarios. More specifically, we evaluate
    influences from the aspects of the user (in terms of the number of requests, user
    preference and prediction accuracy) and the network (such as the available bandwidth
    and caching space and the underlying network topology).


    The rest of this paper is organized as follows. Section 2 reviews the existing
    research on proactive caching. Section 3 formulates the system model. Section
    4 provides a simulated annealing-based heuristic algorithm. Section 5 presents
    an ICN and multi-access edge computing (MEC) integration platform for proposed
    methods deployment. In the end, Sections 6 and 7 give the numerical investigations
    and conclusions respectively.


    # 2. Related work


    This section first reviews some related works on energy-efficient caching in ICN-based
    networks [8–12]. An ILP model is studied in [8], where the limitation of router
    caching space and different caching hardware technologies have been taken into
    account. J. Llorca et. al [9] explicitly consider the temporal and spatial dynamics
    of user requests and the heterogeneity of network resources. The authors in [10]
    present a distributed in-network caching scheme in which each content router determines
    its own caching policy in [10], which is a centralized approach is also provided
    in the non-cooperative mode. An energy consumption model with propagation delay-awareness
    is investigated in [11] and a quantized Hopfield neural network is proposed to
    derive competitive solutions. The relationship between aggregate energy consumption
    per transmitted bit of information and the average number of hops has been studied
    in [12].


    There are also some researches concentrating on energy-efficient caching in cellular
    networks [14–18]. The authors in [14] propose a coordinated caching model in eNodeBs
    for energy saving. A hybrid


    caching policy for reducing latency and energy consumption is designed in [15]
    which consists of device local caching, device-to-device (D2D) caching, base station
    (BS) caching. Except for saving the traditional energy in the above works, energy
    harvesting technology together with cooperative caching has also received scholarly
    attention in recent years, such as BS caching in [16,17] and D2D caching in [18].
    In particular, the authors in [16] formulate a BS caching problem as a mixed integer
    linear programming routing problem and then decompose it as two sub-problems,
    and the work [18] considers the caching performance with storage capacity limit.
    Unlike [16,18], the study in [17] uses a simulation-based method, instead of an
    optimization model, to measure the energy efficiency of different BS switching.
    Apart from the aforementioned scenarios, the dense vehicular network and the unmanned
    aerial vehicle (UAV) network are considered in paper [19,20] respectively.


    Furthermore, a number of studies have investigated the energy-efficient schemes
    by jointly considering caching, communication, and resource allocations. For instance,
    the authors in [21] propose a framework combining software defined networking,
    caching, and computing (SD-NCC) to balance the energy consumption and network
    resource utilization, which has the potential to support general in-network services.
    In addition, the problem investigated in [21] is formulated as a mixed-integer
    nonlinear programming (MINLP) problem and an alternating direction method of multipliers
    (ADMM)-based algorithm is provided for computational complexity reduction purpose.
    The inherent lack of user request arrival knowledge case is considered in [22]
    where caching, transcoding, and backhaul retrieving are jointly optimized. The
    research in [23] concentrates on the trade-offs between communication, computation
    and caching and provides a ~optimal solution to the proposed non-linear optimization
    model. Another joint optimization research can be found in [24], where the user
    association, resource allocation, and caching deployment are jointly utilized
    in the fog radio access networks (Fog-RAN) environment.


    However, the majority of the aforementioned works do not take the routing policies
    into consideration [8,10,11,15–20,22,24] or only adopt the shortest path [9,12,4,2,3,23].
    Therefore, the designed caching strategies may be inefficient when dealing with
    the limited network bandwidth scenario. There are also some researches discussing
    the design of joint caching and routing schemes. For example, a study in [25]
    formulates a joint caching and multipath routing problem as an ILP problem to
    maximize the volume of cached-served file requests in the wireless network. Chu
    et al. [26] jointly consider the cache allocation and routing path to maximize
    content utilities based on cache partitioning. The delay optimization scenario
    is also considered in [26]. The authors in [27] investigate the caching and routing
    problem considering both source routing and nominal shortest path routing to minimize
    routing cost. To simplify the model, the link bandwidth in [27] is assumed to
    be abundant. However, none of the above studies [25–27] consider caching placement
    for energy efficiency purposes. For a more detailed and extensive treatment of
    the overall state-of-the-art caching and routing policies in ICN, we refer the
    reader to [28].


    We summarized the aforementioned works in Table 1. Motivated by these researches,
    the caching placement and multipath routing are jointly optimized in this paper
    to minimize energy consumption. The existing research in [29] is closest to the
    problem we tackle here. Though [29] considers the energy-efficient caching and
    routing algorithm in content delivery networks (CDN), here are some main differences
    between our work and [29]. On the one hand, the caching methods are quite different.
    For example, we allow replicated caching while [29] considers unique caching that
    each content is satisfied by exactly one node. On the other hand, our work includes
    modelling for different delivery modes, i.e. multicast and unicast, while [29]
    only considers the nominal method of delivery which is the unicast.'
