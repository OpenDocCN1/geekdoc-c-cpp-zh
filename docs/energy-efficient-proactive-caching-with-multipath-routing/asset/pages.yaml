    # 5. Algorithm deployment


    In this section, we first introduce an integrated ICN and MEC platform in a 5G
    environment for the proposed caching schemes deployment. Then we briefly describe
    the workflow during a caching time slot.


    # 5.1. Architecture of the integrated framework


    The amalgamated platform is presented in Fig. 2 based on [47,48], which consists
    of 5G network, MEC, ICN, and network virtualisation technologies.


    Unlike the 4G network, 5G is more than a network; it brings a global ecosystem
    that promises not only to provide massive data traffic and connectivity with high
    reliability, but also to support massive communication types. The 5G core network
    evolves to a service-based architecture (SBA). As shown in the top left of Fig.
    2, five key network functions (NFs, i.e. network repository function — NRF, policy
    control function — PCF, network exposure function — NEF, access and mobility management
    function — AMF, and session management function — SMF) are connected via a service-based
    interface (SBI) message bus. In particular, NRF maintains NFs and their profiles;
    PCF controls network behaviours; NEF exposes services and available resources
    within and outside core networks; AMF manages end device connection; and SMF is
    primarily responsible for the session context with the user plane function (UPF).
    Additionally, UPF is used to route and forward caching content.


    MEC refers to the platform that provide computing, caching and other kinds of
    services at the network edge, which can release


    backhaul congestion and achieve quality of service (QoS) for the 5G network. On
    the right-hand side of Fig. 2 are the MEC functional entities. The MEC orchestrator
    acts as an external application function and communicates with NF via the Nef
    interface, which is responsible for maintaining the entire system. Moreover, the
    proposed caching strategies (i.e. optimization model as user QoS) and those behaviour
    and prediction algorithms are used to achieve prediction accuracy. According to
    the user request forecast [36–45] and the caching in the MEC orchestrator. After
    the caching decision is determined, the content and transmission path routing
    policy can be distributed via the NEF-PCP-SMF-UPF route. The MEC host, which contains
    a MEC platform and a virtualisation infrastructure, provides compute, storage,
    and network resources for the MEC applications. Additionally, the ICN caching
    service is viewed as a MEC application. The network available resource information,
    like memory space and link bandwidth in the local ICN data network (ICN-DN), is
    collected by the virtualisation infrastructure manager in the MEC host level,
    and then is maintained in the MEC orchestrator. To supports the caching service,
    the MEC host can be deployed on access routers, forward routers and even data
    server.


    # 5.2. Illustration of working process


    The proposed algorithm can be extended to various ICN implementations, like Data
    Oriented Network Architecture (DONA) [49], Content Centric Network (CCN) [50]
    and Named Data Network (NDN) [51]. Here we use the NDN as an example to further
    illustrate the workflow. The working process of the proposed algorithm is presented
    in two phases: the content deployment phase and the flow service phase.


    The content deployment phase is presented as follows:


    +   Step 1: The MEC orchestrator collects the current user behaviour information
    from access routers and the network available resource status (like storage space
    and link bandwidth) from all caching nodes.

    +   Step 2: The MEC orchestrator calls the predicted algorithms, such as user
    mobility prediction and request preference forecast, to estimate the user behaviour
    in the next time slot;

    +   Step 3: Based on the prediction and available network resources, the orchestrator
    call the proposed algorithm to determine caching locations and relevant routing
    path;

    +   Step 4: The orchestrator distributes the routing path to all routers by broadcasting,
    and proactively pushes the content from the original data server to the routers
    according to the caching decisions;

    +   Step 5: Based on the received routing path, the router updates the Forwarding
    Information Base (FIB) by translating the path to the representation of interface,
    and caches relevant content in the Content Store (CS).


    After the content deployment phase, in the next time slot the flow service process
    works as follows:


    +   Step 1: Access routers receive requests from connected end-users and record
    for the next time slot estimation;

    +   Step 2: The router does a CS lookup to check whether the content is stored
    in local ICN-DN or not. If cache hits, then the request can be served locally;
    Otherwise,'
