    # Theorem 1. The ILP models (P1) and (P2) fall into the family of N-P-hard problems.


    Proof. For (P1), we will establish the proof by showing that model (3) is a generalization
    of the uncapacitated facility location (UFL) problem where UFL is a well-known
    N-P-hard problem. Suppose the network is a tree topology and all users request
    the same content, then the distance between any two nodes is unique. In addition,
    the link capacity x_e and y_ea. Consider the case that the caching space and link
    bandwidth are infinite, i.e. w_i = c_j = +\infty, and hence, constraints (3b)
    and (3c) can be relaxed. Furthermore, let \lambda_a \ge 1, \forall a \in A. As
    a result, constraint (3e) is guaranteed by (3b), and \lambda_a can be safely divided
    on both sides of (3b). In the end, (P1) can be rewritten as a UFL problem as follows:


    ```

    min_{x,yap,yap} \sum_{a \in A} s: T_a x_s + \sum_{n \in N} \sum_{a \in A} (b \cdot
    s - N_n) y_{nae} \quad (5a)

    s.t. \quad y_{yae} = x_s, \forall a \in A, e \in e^0; \quad (5b)

    \sum_{e \in e^0} y_{yae} = 1, \forall a \in A; \quad (5c)

    x_e \in \{0, 1\}, \forall e \in e^0; \quad (5d)

    y_{yae} \in \{0, 1\}, \forall a \in A, e \in e^0. \quad (5e)

    ```


    This means (P1) is at least as difficult as UFL. Thus, we have proved that (P1)
    is N-P-hard.


    Similarly, by setting \lambda_a = 1 constraint (4c) and slacking model (4) as
    above, (P2) can be converted to UFL optimization model, which means (P2) is a
    generalization of the UFL problem, and consequently (P2) is N-P hard as well.
    \(\square\)


    Therefore, due to the curse of dimensionality it is challenging to solve problems
    (P1) and (P2) in a reasonable time when the network instances becomes large. In
    order to accelerate the computational time and provide decision making that is
    amenable for real-time operation we propose a Greedy Simulated Annealing Caching
    (GSAC) algorithm in the next section.


    # 4. A metaheuristic optimization algorithm


    In GSAC, the original optimization model is decomposed by the content categories
    and these contents are allocated in descending order, i.e. the network serves
    the content with the most requests first. Then, for each content assignment, we
    employ a simulated annealing algorithm to allocate popular content in the most
    suitable nodes.


    Simulated Annealing (SA) [46] is a well-known optimization method for approximating
    the global optimization of a given function. SA is an annealing process by statistical
    mechanics concepts, and it is motivated by an analogy with the behaviour of physical
    systems during the cooling process. It can be deemed as a powerful heuristic method
    which is suitable for global optimization which requires no particular assumption
    on the structure of the objective function. Compared with other evolutionary algorithms
    such as genetic algorithm, SA can provide competitive solutions with faster convergence.
    The main structure of SA contains two nested loops, where the external is controlled
    by the temperature and the internal is managed by a Markov-chain length. In each
    loop a new solution is produced which


    then compared with the previously stored result. The new solution is accepted
    if its performance is better than the previous otherwise, the new solution would
    be accepted with some predefined probability. The iterations continue until meeting
    the stopping criterion.


    Regarding the optimization model (P1), the solution generated in each loop includes
    the decision variable x_e and y_{yap} (here we deal with the sub-problem oriented
    towards specific content n, so n is omitted from the subscript notation for simplicity).
    Note, however, that the decision about those two variables, i.e., x_e and y_{yap}
    might result in an infeasible allocation. To restore feasibility, we set x_e as
    the pivot variable. Then, once x_e is allocated, y_{yap} can be determined as
    follows,


    ```

    [y_{yae}[0] = 1, \quad \text{if } \sum_{e \in e^0} x_e = 0 \text{ and } [a|a_a
    > 0];

    [y_{yap} = 1, \quad \text{if } ((a, p) \in l_a, x_e > x_e, 1 \min N_{na}, b \leq
    c_j, \forall a \in A, \exists e \in e^0, l \in p \in P_a];

    [y_{yap} = 0, \quad \text{otherwise.}

    ```


    If there is a request in RA (i.e. l_a > 0) but all caching nodes e \in e^0 do
    not host the required content (i.e. \sum_{e \in e^0} x_e = 0), then the request
    is redirected to the backbone server (via the shortest path (i.e. p = 1)). If
    there is a request in RA (i.e. l_a > 0), some nodes host the content (i.e. x_e
    = 1, \exists e \in e^0), and the connected link l guarantees the transmission
    bandwidth (i.e. b > c), then the request is served by the nearest caching node
    (i.e. e) to alleviate the network congestion.


    The determination of x_{yap} in problem (P2) is as follows:


    ```

    [y_{yae}[0] = \lambda_a, \quad \text{if } \sum_{e \in e^0} x_e = 0 \text{ and
    } [a|a_a > 0];

    [y_{yap} = |c/b|, \quad \text{if } ((a, p) \in l_a, x_e > x_e, 1 \min N_{na},
    b \leq c_j, \forall a \in A, \exists e \in e^0, l \in p \in P_a];

    [y_{yap} = 0, \quad \text{otherwise.}

    ```


    Similar to the multicast case, all requests are served at the backbone server
    (0) in the cache-miss case (i.e. \sum_{e \in e^0} x_e = 0, \lambda_a > 0). If
    some nodes host the content and the link capacity is sufficient to support at
    least one request transmission, then we keep allocating routing paths according
    to the bandwidth (i.e. y_{yap} = |c/b|) until all requests are assigned or no
    more link is available; Otherwise, the routing assignment is neglected.


    The details of the proposed GSAC framework is depicted in Algorithm 1. There are
    four hyperparameters involved as explained in the sequel. The L parameter controls
    the internal loop from line 8 to 20, whilst parameters T_0, T_{end} and \gamma
    manage the external loop from line 7 to 21. Moreover, the current temperature
    T_m influences the acceptance probability, i.e. the external loop of the GSAC
    algorithm. In line 2, we compute the k-shortest path via Yen’s Algorithm where
    the time complexity is O(K|E|^2) and symbol | | represents set cardinality. In
    this paper, we consider the 5-shortest paths, i.e. k = 5, and we require the path
    for each AR a. Consequently, the time complexity of line 2 becomes O(|A| k |E|^2).
    For each external iteration of simulated annealing, the temperature is reduced
    by \gamma from T_0 to T_{end}. Suppose I is the number of external loops, then
    there is \gamma^I = T_f / T_0 when terminating. In most cases, the cooled down
    factor \gamma is between 0 and 1. Therefore, we have I = \lceil \log_\gamma(T_{end}/T_0)
    \rceil. It is clear that the number of internal loops is L. In each external loop,
    the worst case is enumerating the combination of a, e and p when determining decision
    variable y_{yap}. In addition, the time complexity of checking whether y_{yap}
    is O(|A||P||E|). Note that we need to assign caching location for each content
    n \in N^c. In the end, the time complexity of Algorithm 1 becomes O(|L| \cdot
    |A||P||E|^N + |A||E|^2).


    The configuration of hyperparameters depends on the scope of problem. In this
    paper, after several rounds of grid search and by considering the trade-off after
    time complexity and performance, the best configuration is recorded as follows:
    T_0 = 10^6, T_{end} = 10^{-4}, \gamma = 0.9 and L = 300.'
