    ## 6.5. Impact of the prediction accuracy (\(\rho_{ls}\))


    In the previous evaluation, we test the performance of different schemes under
    the salient assumption of an ideal condition that all users'' preference is exactly
    predicted, i.e. \(\rho_{ls} = 1\). Hereafter, we relax this assumption and perform
    a wide set of experiments to understand the impact of prediction accuracy by varying
    it from 100% down to, effectively, 0%. As shown in Figs. 5(a) and 5(c), regarding
    the Optimal, GSAC, and Coordinated Caching, there is a steep drop on the energy
    gain from 100% to 80% then, the value decline steadily. By the same token, the
    performance gap among the Optimal, GSAC, Coordinated, and Random Caching becomes
    very small when prediction accuracy significantly deteriorates. It is worth noting
    that for (P1), when the predicted accuracy is less than 30% (For (P2), the threshold
    is 20%), the energy gain is less than 1. In other words, the proactive caching
    method cannot save energy but consume more than No-caching, if the user preference
    prediction is inaccurate, since we pay extra energy for caching contents. This
    result means that attention should be placed on managing effectively user content
    prediction in order to fully capitalize on gains stemming from network and storage
    dimensioning. In Figs. 5(b) and 5(d), the cache-hit ratio reduces as the accuracy
    is declining. An interesting observation is that even when the prediction accuracy
    reduces to 0% (for example in the case of very new popular content), the cache-hit
    ratio is still above 0. The main reason is that inaccurate predicted requests
    can be redirected to other nodes where the required content is cached, and it
    is still counted for the cache-hit ratio calculation.


