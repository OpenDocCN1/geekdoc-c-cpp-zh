    # 6. Numerical investigations


    # 6.1. Simulation setting


    In this section, we compare the caching allocation derived from the set of proposed
    schemes against some well known previously proposed techniques such as the Random
    Caching and the Coordinated Caching schemes, which have been introduced in [52]
    and [14] respectively. The proposed set of techniques include the ILP optimization
    model (which is viewed as offering the optimal solution in this paper by using
    the branch-and-bound method, hence in the figures to follow we use term Optimal
    to represent the results of the ILP model) and the GSAC technique. Random Caching
    can be deemed as a technique that can be easily adopted and used by operators
    where hosting nodes are chosen randomly for the requested content. Based on the
    caching capacity, the Coordinated Caching places content in local or nearby caching
    nodes, and, thus, balances the energy consumption between data transmission and
    storage.


    The experiments are performed in a 20 caching nodes and 52 links network model,
    which captures a nominal tree-like configuration of a mobile edge network. Without
    loss of generality, we assume that all links have equal capacity and all caching
    nodes have identical memory space, but the actual values vary to investigate the
    trade-off between bandwidth and storage (caching memory capacity). Accordingly,
    we investigate the trade-off between caching memory capacity and 80/20 rule, i.e.,
    approximate 80% of user requests concentrate on the top 20% content categories.
    This rule has been widely used in various fields including caching [38]. The caching
    allocation based on such prediction and the impact of predicted accuracy is also
    discussed.


    The performance is evaluated mainly via two key metrics: the energy gain and cache-hit
    ratio. As for the energy gain, we use the so-called No-caching approach as the
    benchmark, which, in essence, means we do not host any content in caching nodes,
    and each flow request should be transferred to a core network content server.
    In that case, the gain is calculated by


    \(Gain = \frac{E(\chi_{s_{no\_snap}})}{E(\chi_{s_{snap}})}\)

    where \(E(\chi_{s_{no\_snap}})\) is the energy cost by applying No-caching strategy,
    and \(E(\chi_{s_{snap}})\) represents the energy consumption by using estimated
    algorithms, i.e. the Optimal, the GSAC, the Coordinated Caching and the Random
    Caching. As a result, a larger energy gain indicates a better energy-saving performance.
    Furthermore, the cache-hit ratio is defined as the percentage of content requests
    served by caching nodes.


    All results presented hereafter are averaged over one hundred network scenarios
    (i.e., Monte Carlo simulations) and based on those we analyse the performance
    of different schemes. To put the computational times in context we note that all
