    ## 4. 一种元启发式优化算法


    在 GSAC 中，原始优化模型按内容类别分解，这些内容按降序分配，即网络首先服务请求最多的内容。然后，对于每个内容分配，我们采用模拟退火算法将热门内容分配到最合适的节点。


    模拟退火（SA）[46] 是一种用于逼近给定函数全局优化的著名优化方法。SA 是基于统计力学概念的退火过程，其灵感来自于物理系统在冷却过程中的行为类比。它可以被视为一种强大的启发式方法，适用于全局优化，且对目标函数的结构无特定假设。与其他进化算法（如遗传算法）相比，SA
    能以更快的收敛速度提供具有竞争力的解。SA 的主要结构包含两个嵌套循环，外部循环由温度控制，内部循环由马尔可夫链长度管理。在每个循环中生成一个新解，然后与先前存储的结果进行比较。如果新解的性能优于之前的解，则接受该新解；否则，新解将以某些预定义的概率被接受。迭代继续直到满足停止准则。


    关于优化模型 (P1)，每个循环生成的解包括决策变量 x_e 和 y_{ap}（此处我们处理针对特定内容 n 的子问题，因此为简化起见，下标表示中省略了 n）。但是，请注意，关于这两个变量（即
    x_e 和 y_{ap}）的决策可能导致不可行的分配。为了恢复可行性，我们将 x_e 设为枢纽变量。然后，一旦 x_e 被分配，y_{ap} 可以按如下方式确定：


    ```

    [y_{ap} = 1, \quad \text{if } \sum_{e \in e^0} x_e = 0 \text{ and } l_a > 0];

    [y_{ap} = 1, \quad \text{if } ((a, p) \in l_a, x_e = 1, 1 \leq N_{na}, b \leq
    c_j, \forall a \in A, \exists e \in e^0, l \in p \in P_a];

    [y_{ap} = 0, \quad \text{otherwise.}

    ```


    如果在 RA 中存在请求（即 l_a > 0），但所有缓存节点 e \in e^0 都不托管所需内容（即 \sum_{e \in e^0} x_e = 0），则请求被重定向到骨干服务器（通过最短路径，即
    p = 1）。如果在 RA 中存在请求（即 l_a > 0），某些节点托管了内容（即 x_e = 1，\exists e \in e^0），且连接链路 l
    保证了传输带宽（即 b > c），则请求由最近的缓存节点（即 e）服务，以缓解网络拥塞。


    问题 (P2) 中 y_{ap} 的确定如下：


    ```

    [y_{ap} = \lambda_a, \quad \text{if } \sum_{e \in e^0} x_e = 0 \text{ and } l_a
    > 0];

    [y_{ap} = |c/b|, \quad \text{if } ((a, p) \in l_a, x_e = 1, 1 \leq N_{na}, b \leq
    c_j, \forall a \in A, \exists e \in e^0, l \in p \in P_a];

    [y_{ap} = 0, \quad \text{otherwise.}

    ```


    类似于组播情况，在缓存未命中情况下（即 \sum_{e \in e^0} x_e = 0，\lambda_a > 0），所有请求均在骨干服务器（0）处服务。如果某些节点托管了内容且链路容量足以支持至少一个请求传输，则我们继续根据带宽（即
    y_{ap} = |c/b|）分配路由路径，直到所有请求都被分配或没有更多链路可用；否则，路由分配被忽略。


    所提 GSAC 框架的细节在算法 1 中描述。涉及四个超参数，如后文所述。L 参数控制第 8 到 20 行的内部循环，而参数 T_0、T_{end} 和 \gamma
    管理第 7 到 21 行的外部循环。此外，当前温度 T_m 影响接受概率，即 GSAC 算法的外部循环。在第 2 行，我们通过 Yen’s Algorithm
    计算 k-最短路径，其时间复杂度为 O(K|E|^2)，符号 | | 表示集合基数。在本文中，我们考虑 5-最短路径，即 k = 5，并且要求每个 AR a
    的路径。因此，第 2 行的时间复杂度变为 O(|A| k |E|^2)。对于模拟退火的每次外部迭代，温度从 T_0 降低到 T_{end}，减少量为 \gamma。假设
    I 是外部循环的次数，则在终止时有 \gamma^I = T_{end} / T_0。在大多数情况下，冷却因子 \gamma 在 0 和 1 之间。因此，我们有
    I = \lceil \log_\gamma(T_{end}/T_0) \rceil。很明显，内部循环的次数是 L。在每个外部循环中，最坏情况是在确定决策变量
    y_{ap} 时枚举 a、e 和 p 的组合。此外，检查 y_{ap} 是否的时间复杂度为 O(|A||P||E|)。请注意，我们需要为每个内容 n \in
    N^c 分配缓存位置。最终，算法 1 的时间复杂度为 O(|L| \cdot |A||P||E|^N + |A||E|^2)。


    超参数的配置取决于问题的范围。在本文中，经过多轮网格搜索并考虑时间复杂度与性能之间的权衡后，最佳配置记录如下：T_0 = 10^6，T_{end} = 10^{-4}，\gamma
    = 0.9 和 L = 300。


    ### Algorithm 1: 贪心模拟退火缓存（GSAC）


    ```

    Data: Variables in Table 2; Simulated Annealing Initial Temperature T0; Stopping
    Temperature Tend; Annealing Parameter γ; Markov-chain Length L

    Result: Cache allocation X_{ap} and path delivery y_{ap}

    1 Initialize N'' = {n | \sum_{a,q,u} > 0} and sort descendingly;

    2 Generate {p ∈ Pe} the k-shortest path for each {a, e} pair via Yen''s Algorithm;

    3 foreach x ∈ N'' do

    4 Initialize x_e randomly {x_e | 0/1 | x_e ≤ u_e, ∀e ∈ E^0}, T_n = T0,

    5 j ← 1;

    6 Determine y_{ap} through (6) or (7); // for (P1) or (P2)

    7 Set best solution x* ← x, y* ← y_{ap};

    8 while T_n ≥ Tend do

    9 while j ≤ L do

    10 Generate x_e via flipping one bit in x_e randomly;

    11 Determine y_{ap} through (6) or (7);

    12 if δ ∈ E(x_e, y_{ap}) − E(x_{prev}, y_{ap,prev}) < 0 then

    13 Update x_{prev} ← x_e, y_{ap,prev} ← y_{ap};

    14 if E(x_e, y_{ap}) − E(x*, y*) < 0 then

    15 Update x* ← x_e, y* ← y_{ap};

    16 end

    17 else

    18 Update x_e, y_{ap} ← x_{prev}, y_{ap,prev} with probability exp(−δ/T_n);

    19 end

    20 j ← j + 1;

    21 end

    22 T_n = γ × T_n;

    23 end

    24 x_{ap}, y_{ap} ← x*, y*;

    25 Update w_e, c;

    26 end

    ```


    ## 5. 算法部署


    在本节中，我们首先介绍一个在 5G 环境中用于所提缓存方案部署的集成 ICN 和 MEC 平台。然后我们简要描述缓存时间槽期间的工作流程。


    ### 5.1. 集成框架的架构


    集成平台如图 2 所示，基于 [47,48]，由 5G 网络、MEC、ICN 和网络虚拟化技术组成。


    与 4G 网络不同，5G 不仅仅是一个网络；它带来了一个全球生态系统，承诺不仅提供海量数据流量和高可靠性的连接，还支持海量通信类型。5G 核心网演进为基于服务的架构（SBA）。如图
    2 左上角所示，五个关键网络功能（NF，即网络存储库功能—NRF、策略控制功能—PCF、网络暴露功能—NEF、接入和移动性管理功能—AMF、会话管理功能—SMF）通过基于服务的接口（SBI）消息总线相连。具体而言，NRF
    维护 NF 及其配置文件；PCF 控制网络行为；NEF 暴露核心网内外的服务和可用资源；AMF 管理终端设备连接；SMF 主要负责与用户面功能（UPF）的会话上下文。此外，UPF
    用于路由和转发缓存内容。


    MEC 是指在网络边缘提供计算、缓存和其他各种服务的平台，可以缓解回程拥塞并为 5G 网络实现服务质量（QoS）。图 2 右侧是 MEC 功能实体。MEC
    编排器充当外部应用功能，并通过 NEF 接口与 NF 通信，负责维护整个系统。此外，所提缓存策略（即作为用户 QoS 的优化模型）和那些行为及预测算法用于实现预测精度。根据用户请求预测
    [36–45] 和 MEC 编排器中的缓存。在缓存决策确定后，内容和传输路径路由策略可以通过 NEF-PCP-SMF-UPF 路由分发。MEC 主机包含 MEC
    平台和虚拟化基础设施，为 MEC 应用程序提供计算、存储和网络资源。此外，ICN 缓存服务被视为一种 MEC 应用。本地 ICN 数据网络（ICN-DN）中的可用网络资源信息（如内存空间和链路带宽）由
    MEC 主机级别的虚拟化基础设施管理器收集，然后在 MEC 编排器中维护。为了支持缓存服务，MEC 主机可以部署在接入路由器、转发路由器甚至数据服务器上。


    ### 5.2. 工作流程示例


    所提算法可以扩展到各种 ICN 实现，如面向数据的网络架构（DONA）[49]、面向内容的网络（CCN）[50] 和命名数据网络（NDN）[51]。此处我们以
    NDN 为例进一步说明工作流程。所提算法的工作流程分为两个阶段：内容部署阶段和流量服务阶段。


    内容部署阶段如下：


    - Step 1: MEC 编排器从接入路由器收集当前用户行为信息，并从所有缓存节点收集网络可用资源状态（如存储空间和链路带宽）。

    - Step 2: MEC 编排器调用预测算法，如用户移动性预测和请求偏好预测，以估计下一个时间槽的用户行为；

    - Step 3: 基于预测和可用网络资源，编排器调用所提算法以确定缓存位置和相关路由路径；

    - Step 4: 编排器通过广播将路由路径分发到所有路由器，并根据缓存决策从原始数据服务器主动将内容推送到路由器；

    - Step 5: 基于接收到的路由路径，路由器通过将路径转换为接口表示来更新转发信息库（FIB），并在内容存储（CS）中缓存相关内容。


    内容部署阶段之后，在下一个时间槽中，流量服务过程如下：


    - Step 1: 接入路由器接收来自连接终端用户的请求，并记录用于下一个时间槽的估计；

    - Step 2: 路由器执行 CS 查找以检查内容是否存储在本地 ICN-DN 中。如果缓存命中，则请求可以在本地服务；否则，


