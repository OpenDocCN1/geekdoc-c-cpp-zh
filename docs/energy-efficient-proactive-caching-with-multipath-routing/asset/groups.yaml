    # Energy-efficient proactive caching with multipath routing


    Yantong Wang a,*, Vasilis Friderikos b


    a School of Information Science and Engineering, Shandong Normal University, Changqing
    District, 250358, Jinan, China b Center of Telecommunications Research, Department
