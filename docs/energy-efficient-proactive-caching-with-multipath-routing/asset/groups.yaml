    王言彤（Yantong Wang）于2014年获得中国上海大学物联网工学学士学位，2017年获得中国电子科技大学硕士学位，2022年获得英国伦敦国王学院电信博士学位。他目前担任英国埃塞克斯大学计算机科学与电子工程学院讲师。他的研究兴趣包括面向信息的网络、移动边缘计算、网络优化以及机器学习在电信领域的应用。


    ![](img/6b9226526d7260024653712412f81bfd_11_1.png)


    瓦西利斯·弗里德里科斯（Vasillis Friderikos）目前是伦敦国王学院电信研究中心的读者（Reader）。他在 IEEE、Elsevier、Springer
    等旗舰期刊、国际会议及书籍章节中发表了200多篇研究论文。他曾担任 IEEE 国际通信会议的分会共同主席，以及 IEEE Globecom、IEEE ICC
    及其他多个旗舰国际会议的委员会成员。他还曾担任 IEEE Globecom 和 IEEE VTC Spring 2011 上绿色无线通信研讨会的组织委员会成员。他还两次在法国里尔高等电子与数字学院（ISEN）和里尔大学教授面向未来互联网的高级移动性管理协议，分别获得
    IEEE ICC 2010 和 WWRF 会议的最佳论文奖。他曾是美国新泽西罗格斯大学 WinLab 的访问研究员，并获得英国电信研究与创新（BT）未来互联网奖。他的研究领域广泛涵盖无线网络、移动计算以及未来互联网的架构方面，这些领域高度重叠。Vasillis
    是 IEEE 会员、IET 会员和 INFORMS 电信分会会员。


