    node c ∈ E^C = E\{0} has storage capacity a_c, and can provide both data flow
    forwarding and content caching services.


    Let N be the set of contents. For each content n ∈ N, the required caching size
    and transmission bandwidth are represented by s_n and b_n, respectively. Without
    loss of generality, we assume all contents can be retrieved from backbone servers;
    in case of a cache miss, the user-requested file is described as x_{n,k}, which
    is the probability of user k requesting file n. Furthermore, we use x_{k,t} to
