    ![](img/6b9226526d7260024653712412f81bfd_8_0.png)


    图 3. 算法性能随请求数量的变化。


    在性能改进中发挥重要作用，因为箭头的斜率保持接近 1。


    因此，基于上述分析，关于优先扩展缓存内存还是链路容量的问题，答案可分为以下三种情况：(1) 对于 Optimal 和 GSAC 算法，带宽和内存扩展都能带来更好的缓存命中率。然而，提高链路容量可以带来更多的能量收益，尤其是在
    (P1) 上内存空间超过 0.5 GB 或 (P2) 上超过 0.75 GB 时；(2) 如果使用协调缓存或随机缓存，则最佳网络策略是优先增加带宽而非缓存，以增加能量减少效益。


    ## 6.4. 网络拓扑的影响


    表 4 研究了不同网络拓扑的影响，同时也说明了每个仿真场景的置信区间。除了之前模拟中使用的标记为 original 的常规树状网络外，我们还采用了严格树结构，即网络中任意两个节点之间只存在一条路径，以及全连接拓扑，它提供了网络中节点间路由的最大多样性。预计随着网络中节点度的增加，所评估算法的能量收益和缓存命中率都能进一步提高，因为提供更多直接连接相当于扩展可用链路带宽，尤其是对于
    (P2)。同样清楚地说明，在全连接网络拓扑的情况下，即使使用随机缓存也可以被视为一种适合节能目的的方法。然而请注意，随着连接链路的增加，随机缓存与其他策略之间的性能差距会变小。在全连接网络拓扑中，协调缓存甚至表现不佳。主要原因是，当每两个缓存节点在一跳内连接时，Optimal、GSAC
    和 协调缓存 在节省传输能量方面的一个优势变得不那么明显。结果，缓存能量主导了能量收益。


    图 4. 带宽与缓存空间之间的权衡。


