    # ABSTRACT


    The ever-continuing explosive growth of on-demand content distribution has imposed
    great pressure on mobile/wireless network infrastructures. To ease congestion
    in the network and to increase perceived user experience, caching of popular content
    closer to the end-users can play a significant role and as such this issue has
    received significant attention over the last few years. Additionally, energy saving
    is treated as a fundamental requirement in the design of next-generation mobile
    networks. However, there has been little attention to the overlapping area between
    energy saving and network caching especially when considering multipath routing.
    To this end, this paper proposes an energy-efficient caching with multipath routing
    support. The proposed scheme provides a joint anchoring of popular content into
    a set of potential caching nodes with optimized caching probabilities and routing
    probabilities for minimizing the total energy consumption of the proposed model
    also considers different content delivery modes, such as multicast and unicast.
    Two separated Integer-Linear Programming (ILP) models are formulated for each
    delivery mode. To tackle the curse of dimensionality we then provide a greedy
    simulated annealing algorithm, which not only reduces the time complexity but
    also provides a competitive performance. A wide set of numerical investigations
    reveal that the proposed scheme reduces the energy consumption up to 75% compared
    with other widely used caching approaches under the premise of network resource
    limitation. Sensitivity analysis to different parameters is also meticulously
    discussed in this paper.


    # 1. Introduction


    The enormous amount of mobile traffic, which is expected to reach more than 300
    exabytes per month in 2026 [1], is creating great challenges in the 5G and beyond
    mobile network infrastructures. As an evolutionary network architecture, Information-Centric
    Networking (ICN) is designed to support content distribution and user mobility
    with in-network caching feature [3]. Compared with other caching approaches, in-network
    caching can significantly improve network capacity and latency, whose key aspects
    are related to the following type of questions: “where to cache”, “what to cache”,
    “cache dimensioning”, and “content delivery” [3]. In this paper, the focus is
    on the location to anchor popular content and determining an efficient routing
    path to be employed for caching delivery.


    Despite the well-known benefits of mobile/wireless ICN, there are still a number
    of significant and challenging open-ended topics in this field, such as utilizing
    multipath routing, security and energy consumption [4]. When addressing energy
    consumption, it is treated as one of the key pillars in the design of 5G and beyond
    networks, which is not only important in monetary terms due to energy savings


    but also for curbing the CO2 emissions [5] and aligning operators with the goals
    related to the so-called 1.5 °C climate trajectory.1 Recently, 5G has been commercialized
    in many markets across the world and 6G has already started to attract significant
    attentions from both academia and industry [6]. Though the vision and requirements
    of 6G are still under study, there is no doubt that reducing the overall network
    energy consumption is a significant target for 6G. According to [7], the energy
    efficiency of 6G is expected to be improved by at least a factor of 10, when compared
    with 5G networks.


    The energy consumption in ICN can be divided into two parts [8–12]: the energy
    required for content caching and the energy for data transmission. Content replicas
    can be placed near access routers as a means of reducing transmission costs but
    with an extra cost paid for being popular content, repeatedly consuming caching
    hash nodes can be adopted to reduce caching energy. However, the cache placement
    of an application-specific content, the cache placement and content routing decisions
    are inherently coupled since the request can only be served from a node that caches
    the required information. This inherent trade-off raises the following key question:
    where to cache'
