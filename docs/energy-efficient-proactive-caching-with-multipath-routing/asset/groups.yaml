    在图4中，我们测试了不同算法在(P1)和(P2)上的性能。带标签的等高线分别表示能量增益或缓存命中率。此外，蓝色箭头描绘了梯度，可以被视为指向优化参数化的方向性。在图4(a)中，当带宽和内存都小于0.5时，无论是增加缓存空间还是扩展链路容量，都会导致能量增益增长。但是，一旦链路容量超过0.5
    GB，当链路带宽大于内存时，能量增益会增加，如图4(a)所示，箭头指向带宽增加的方向。在某种程度上，扩大缓存内存意味着托管内容的能耗增加。图4(b)也呈现类似趋势，0.5
    GB起着分水岭的作用：在0.5 GB之前，带宽和缓存内存都对能量增益有贡献；在0.5 GB之后，带宽主导性能改进。说到(P2)，最优4(i)和GSAC 4(j)的趋势与(P1)相似。图4(c)中引人注目的是，所有箭头都指向带宽增加的方向，这表明扩展链路容量对能量增益改进有显著影响，而缓存空间对能量增益改进的影响可忽略不计。其对缓存内存不敏感的原因是协同缓存忽略了链路带宽限制。换句话说，当链路容量无限时，协同缓存提供最优缓存分配。因此，更大的带宽更接近协同缓存的假设。这一原因也可以解释为什么图4(g)、4(k)和4(c)中的梯度箭头指向右侧。同样，如图4(d)、4(h)和4(p)所示，随机缓存的性能对带宽变化非常敏感，但对缓存内存反应迟钝。对于缓存命中率的其他情况（图4(e)-(f)、4(m)-(n)），缓存空间和链路带宽都起着同等重要的


