    ## 6.5. 预测准确性的影响 (\(\rho_{ls}\))


    在之前的评估中，我们在所有用户偏好都被准确预测（即 \(\rho_{ls} = 1\)）的理想条件这一显著假设下，测试了不同方案的性能。随后，我们放宽了这一假设，并进行了一系列广泛的实验，通过将预测准确性从
    100% 变化到实际上的 0% 来了解其影响。如图 5(a) 和 5(c) 所示，对于 Optimal、GSAC 和 协调缓存，能量收益从 100% 到 80%
    有急剧下降，然后数值稳步下降。同样，当预测准确性显著恶化时，Optimal、GSAC、协调缓存和随机缓存之间的性能差距变得非常小。值得注意的是，对于 (P1)，当预测准确性小于
    30% 时（对于 (P2)，阈值为 20%），能量收益小于 1。换句话说，如果用户偏好预测不准确，主动缓存方法不仅不能节省能量，反而会比不缓存消耗更多能量，因为我们为缓存内容支付了额外的能量。这一结果意味着，应将注意力放在有效管理用户内容预测上，以充分利用来自网络和存储规模的收益。在图
    5(b) 和 5(d) 中，随着准确性下降，缓存命中率降低。一个有趣的观察是，即使预测准确性降至 0%（例如在非常新的热门内容的情况下），缓存命中率仍高于
    0。主要原因是，不准确的预测请求可以重定向到缓存所需内容的其他节点，并且仍计入缓存命中率的计算。


    ![](img/6b9226526d7260024653712412f81bfd_10_0.png)


    ## 7. 结论


    为了满足热门按需内容的显著增长，同时实现网络节能运行，我们共同考虑在具有缓存功能的网络节点上锚定热门内容并决定传输路由路径的问题。提出的整数线性规划模型综合了能量消耗、缓存内存、链路带宽、多路径路由以及不同传输模式（即多播和单播）的约束。此外，提出了一种贪婪模拟退火缓存算法，并通过一系列广泛的数值研究评估了所提方案的有效性。例如，我们在不同的网络资源、拓扑、移动模式、用户偏好和缓存大小下测试了所评估算法的性能。结果表明，与其他缓存方案相比，所提算法有潜力将能量消耗降低高达
    75%。此外，扩展链路带宽、丰富路径多样性和提高偏好预测准确性对节能有有益影响。为深化这项工作，我们计划考虑与所提框架相结合的 ML/AI 驱动算法，以通过深度学习功能增强模型，从而自主学习最优分配模式。在这种情况下，会出现一些开放性问题，例如用于机器学习决策行动的资源使用历史需要制定一些适当的算法，也应考虑到以提供理论性能保证。这些方面为未来工作扩展我们的贡献开辟了新的研究途径。


