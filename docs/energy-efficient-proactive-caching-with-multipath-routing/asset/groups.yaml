    # 7. Conclusions


    To meet the significant growth of popular on-demand content whilst empowering
    a network energy saving operation, we jointly consider the problem of anchoring
    popular content at network nodes with caching capabilities and deciding delivery
    routing paths. The proposed integer linear programming model amalgamates energy
    consumption, the constraints of caching memory, link bandwidth, multipath routing,
    and different delivery modes, i.e. multicast and unicast. In addition, a greedy
    simulated annealing caching algorithm is presented and the effectiveness of the
    proposed scheme is evaluated by a wide set of numerical investigations. For instance,
    we test the performance of evaluated algorithms under different network resources,
    topologies, mobility patterns, user preferences, and cache sizes. The results
    suggest that the proposed algorithms have the potential to reduce the energy consumption
    to up to 75% compared with other caching schemes. Furthermore, expanding link
    bandwidth, enriching path diversity, and increasing the preference prediction
    accuracy can have beneficial effects on energy saving. Furthering this work, we
    plan to consider ML/AI-driven algorithms amalgamated with the proposed framework
    to augment the model with deep learning capabilities so that the optimal allocation
    patterns can be learnt autonomously. In that case a number of open ended questions
    arises such as the resource usage history to be used in machine-learning-based
    decision making actions has to be made some appropriate algorithms should also
    be taking into account to provide theoretical performance guarantees. Those aspects
    open up new research avenues that may expand our contributions in future work.


