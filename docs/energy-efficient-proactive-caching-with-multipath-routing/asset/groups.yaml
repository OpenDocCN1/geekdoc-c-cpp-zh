    ## 3.3. 优化模型


    In this subsection, we consider two types of content delivery mode, i.e. the multicast
    and the unicast mode. For modelling simplification purposes, the following optimization
    models are under the assumption that the user''s interested content is already
    known by request prediction, which indicates p_{kn} becomes a binary indicator
    to bridge user k and content n. To lay out how the user request can be predicted,
    we introduce related algorithms from two perspectives. Please note that this brief
    introduction is not exhaustive since the request prediction is beyond the scope
    of this paper. From the view of aggregated content popularity prediction, the
    Zipf model [36], the shot noise model [37], and the stochastic block model [38]
    are widely used models for the case of static popularity, time-varying popularity,
    and location-dependent popularity, respectively. Recently, deep learning has become
    an active method for popularity prediction [39–41]. From the aspect of individual
    user preference prediction, it can be predicted by collaborative filtering [42]
    which predicts the histories of the similar user and the similarity among users.
    The typical collaborative filtering model includes matrix factorization [43],
    latent Dirichlet allocation [44], and probabilistic latent semantic analysis [45].
    The influence of the predicted accuracy on system energy consumption is discussed
    in Section 6. Moreover, in this paper we focus on delay-insensitive requests,
    such as non-real-time HTTP video downloading and video on demand services. Therefore,
    the latency constraint for energy-efficient caching is not considered in the latency
    models and would be studied as a future work.


    在本小节中，我们考虑两种内容传输模式，即组播和单播模式。为简化建模，以下优化模型基于以下假设：用户感兴趣的内容已通过请求预测得知，这表明 p_{kn} 成为连接用户
    k 与内容 n 的二进制指示器。为阐明如何预测用户请求，我们从两个角度介绍相关算法。请注意，此简要介绍并非详尽无遗，因为请求预测超出了本文的范围。从聚合内容流行度预测的角度来看，Zipf
    模型 [36]、射击噪声模型 [37] 和随机块模型 [38] 分别是静态流行度、时变流行度和位置相关流行度情况下的广泛使用模型。最近，深度学习已成为流行度预测的活跃方法
    [39–41]。从单个用户偏好预测的角度来看，可以通过协同过滤 [42] 进行预测，该方法预测相似用户的历史记录和用户之间的相似性。典型的协同过滤模型包括矩阵分解
    [43]、潜在狄利克雷分配 [44] 和概率潜在语义分析 [45]。预测精度对系统能耗的影响在第 6 节中讨论。此外，在本文中，我们关注对延迟不敏感的请求，例如非实时
