    caching, base station (BS) caching. Except for saving the traditional energy in
    the above works, energy harvesting technology together with cooperative caching
    has also received scholarly attention in recent years, such as BS caching in [16,17]
    and D2D caching in [18]. In particular, the authors in [16] formulate a BS caching
    problem as a mixed integer linear programming routing problem and then decompose
    it as two sub-problems, and the work [18] considers the caching performance with
    storage capacity limit. Unlike [16,18], the study in [17] uses a simulation-based
    method, instead of an optimization model, to measure the energy efficiency of
    different BS switching. Apart from the aforementioned scenarios, the dense vehicular
    network and the unmanned aerial vehicle (UAV) network are considered in paper
    [19,20] respectively.


    Furthermore, a number of studies have investigated the energy-efficient schemes
    by jointly considering caching, communication, and resource allocations. For instance,
    the authors in [21] propose a framework combining software defined networking,
    caching, and computing (SD-NCC) to balance the energy consumption and network
    resource utilization, which has the potential to support general in-network services.
    In addition, the problem investigated in [21] is formulated as a mixed-integer
    nonlinear programming (MINLP) problem and an alternating direction method of multipliers
    (ADMM)-based algorithm is provided for computational complexity reduction purpose.
    The inherent lack of user request arrival knowledge case is considered in [22]
    where caching, transcoding, and backhaul retrieving are jointly optimized. The
    research in [23] concentrates on the trade-offs between communication, computation
    and caching and provides a ~optimal solution to the proposed non-linear optimization
    model. Another joint optimization research can be found in [24], where the user
    association, resource allocation, and caching deployment are jointly utilized
    in the fog radio access networks (Fog-RAN) environment.


    However, the majority of the aforementioned works do not take the routing policies
    into consideration [8,10,11,15–20,22,24] or only adopt the shortest path [9,12,4,2,3,23].
    Therefore, the designed caching strategies may be inefficient when dealing with
    the limited network bandwidth scenario. There are also some researches discussing
    the design of joint caching and routing schemes. For example, a study in [25]
    formulates a joint caching and multipath routing problem as an ILP problem to
    maximize the volume of cached-served file requests in the wireless network. Chu
    et al. [26] jointly consider the cache allocation and routing path to maximize
    content utilities based on cache partitioning. The delay optimization scenario
    is also considered in [26]. The authors in [27] investigate the caching and routing
    problem considering both source routing and nominal shortest path routing to minimize
    routing cost. To simplify the model, the link bandwidth in [27] is assumed to
    be abundant. However, none of the above studies [25–27] consider caching placement
    for energy efficiency purposes. For a more detailed and extensive treatment of
    the overall state-of-the-art caching and routing policies in ICN, we refer the
    reader to [28].


    We summarized the aforementioned works in Table 1. Motivated by these researches,
    the caching placement and multipath routing are jointly optimized in this paper
    to minimize energy consumption. The existing research in [29] is closest to the
    problem we tackle here. Though [29] considers the energy-efficient caching and
    routing algorithm in content delivery networks (CDN), here are some main differences
    between our work and [29]. On the one hand, the caching methods are quite different.
    For example, we allow replicated caching while [29] considers unique caching that
    each content is satisfied by exactly one node. On the other hand, our work includes
    modelling for different delivery modes, i.e. multicast and unicast, while [29]
    only considers the nominal method of delivery which is the unicast.


