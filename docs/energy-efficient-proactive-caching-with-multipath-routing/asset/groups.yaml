    Yantong Wang received the BE degree in Internet of Things from Shanghai University,
    China, in 2014, the integrated master degree from the University of Electronic
    Science and Technology of China, in 2017, and the Ph.D. degree in telecommunications
    from King’s College London, UK, in 2022. He is currently working as a lecturer
    with the School of Computer Science and Electronic Engineering, University of
    Essex, Colchester, UK. His research interests include Information-Centric Networking,
    mobile edge computing, network optimization, and the application of machine learning
    on telecommunications.


    ![](img/6b9226526d7260024653712412f81bfd_11_1.png)


    Vasillis Friderikos is currently a Reader at the Centre for Telecommunications
    Research at King’s College London. He has published more than 200 research papers
    in flagship IEEE, Elsevier, Springer journals, international conferences and book
    chapters. He has been track co-chair at the IEEE International Conference on Communications
    and the committee member for IEEE Globecom, IEEE ICC and several other flagship
    international conferences. He has also been organizing committee member of the
    Green Wireless Communications Symposium at IEEE Globecom and the IEEE VTC Spring
    2011. He has also been teaching advanced mobility management protocols for the
    Future Internet at the Institut Supérieur de l’Electronique et du Numérique (ISEN)
    Lille, France, and the University of Lille for two times best paper awards in
    IEEE ICC 2010 and WWRF conferences respectively. He has been visiting researcher
    at WinLab in Rutgers University (USA) and recipient of the British Telecom Research
    and Innovation (BT) award on Future Internet. He is broadly within the closely
    overlapped areas of wireless networking, mobile computing, and architectural aspects
    of the Future Internet. Vasillis is a member of IEEE, member of IET and member
    of the INFORMS section on Telecommunications.

