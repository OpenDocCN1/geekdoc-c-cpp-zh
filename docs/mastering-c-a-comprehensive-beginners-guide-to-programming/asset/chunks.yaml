    In this chapter, we have done quite a bit. We have looked at some specialized
    functions, accessing objects, text manipulators, and operators. We will cover
    them in more detail in the coming chapters. I hope you have seen the role of operators
    in directing data and ending program functionality. In the following chapter,
    we are going to be looking at operators and how they give programs decision-making
    capabilities. A A


    # A Chapter 4: Operations in C++


    A


    We talked about how `C++` is mainly a back-end, server-side language that is suited
    for controlling servers and other decision-making utilities for delivering content.
    In the last chapter, we looked at small ways that `C++` handles data by looking
    at strings. In it, we saw the central role that operations play. Operations allow
    us to control loops and decision-making in programs. A better understanding of
    operations allows us to add more functionality to our programs. Functionality
    is how programmers use methods and features of a language to achieve an end. We
    have seen how thesethese string-handling methods work, but what would be better
    is if we used those features in A context that allows us to achieve Aa particular
    end, like content management. A


    Note: An `Operand` describes the value or variable being operated on. An `Operator`
    describes the symbol indicating the sort of operation being carried out. The following
    is a list of operators in `C++` (and.): A


    This table lists the operators by (1) how many operands they accept at a time
    and (2) the type of operation they execute. They are divided into three types:


    - Unary operators that only accept 1 operand at a time

    - Binary operators that only accept 2 operands at a time

    - Ternary operators that accept more than 2 operands, or conditional operators
    with several arguments


    In this chapter, we will look at 5 types of operators and their functionalities.


    Note: Operators have precedence, just as in mathematical equations. For example,
    parentheses, which are used to call a function, have higher precedence than addition
    or subtraction. However, you should try to keep your lines of code as simple as
    possible. This makes your programs easier to edit and debug. Having clean, uncomplicated
    code avoids bugs.


    # Binary Operators


    Binary operators are the majority of operands you find in `C++`. They include
    5 of the 6 types of operators. This makes them the perfect place to start. As
    the name suggests, binary operators compare two operands. They are perfect for
    decision-making and controlling switches.


    ## Arithmetic Operators


    They are the most common and well-understood of all operators because of how much
    we use them even outside programming, since they are primarily mathematical. We
    use them to perform mathematical operations.


    Note: In the string concatenation example, the `images/Image00087.jpg` used to
    concatenate was not an arithmetic function. Instead, it was a function of the
    `images/Image00088.jpg` library that handled the concatenation.


    Most operators in this category require two operands. The only exceptions are
    the unary `++` and `--` operators which we use to increase or decrease within
    a loop. The binary operators are (Jaggi, 2015a):


    - `images/Image00087.jpg`: the addition operator that adds two operands

    - `images/Image00089.jpg`: the subtraction operator that subtracts one operand
    from another

    - `images/Image00090.jpg`: the multiplication operator that multiplies two operands

    - `images/Image00091.jpg`: the division operator that divides the first operand
    into the second

    - `images/Image00092.jpg`: the modulus operator that returns the remainder from
    dividing the first operand into the second


