- fmt: '

    IDE environments that are focused on programming always have a text editor and
    a compiler within them. Non-IDE environments separate compilers and plain text
    editors. The text editor serves as a programming interface in non-IDE setups;
    this simply means the text editor will be the place you tinker with the code.


    ![Text Box 56](images/Image00001.jpeg)


    When looking for a text editor, you need one with syntax highlighting and indenting
    as all programming languages follow their syntax. This is because you want to
    be able to read your code easily and you want collaborators to be able to do so,
    too. These text editors help by improving readability. This is especially important
    because coding is no longer and has never been a solitary task. There is no one-man
    genius like in movies.


    Github and Pastebin are code aggregators that have syntax highlighting add-ons
    enabled. Github will allow you to host your entire project on their site, while
    Pastebin only allows code snippets. On these platforms, you can save code in a
    variety of languages.


    They are very useful to programmers because they allow programmers to share code,
    collaborate, test, and so forth. Learning how to deploy a project to Github is
    one of the most important things in programming because it has become so standardized.
    So, maintaining a Github profile has also become important, as it holds all the
    projects you are working on, have worked on, and your activity (Peshev, 2017).
    To a potential employer or collaborator, this information is invaluable.


    | ![image34.png](images/Image00002.jpeg) |

    | C++ Code Syntax Example | This is a screenshot from Pastebin with syntax highlighting
    enabled . [A](https://www.zotero.org/google-docs/?MBrR1L)[(“C++ Code,” 2015)](https://www.zotero.org/google-docs/?MBrR1L)
    [A](https://www.zotero.org/google-docs/?MBrR1L) . Syntax highlighting and tabbed
    spacing help with making the code more comprehensible. All text editors with syntax
    highlighting will use this scheme: libraries in green, and functions, data types,
    and data in blue. Strings will show up as red. |


    When you are working locally you will not have luxuries like these readily available.
    The first text editor you will find on your system if you are using Windows is
    Notepad. Wordpad is another one that has more GUI features. What you will notice
    as you open these programs is how plain and boring they are. They are like Word
    but worse, because they shouldn’t be simple word processors if writing efficient,
    elegant code is important to us. Their word processor-like aspects make them more
    suitable for writing words in them, not code, although you can code in them.


    | ![image7.png](images/Image00003.jpeg) |

    | Side-by-side comparison of Windows’ Notepad utility and Wordpad utility | This
    is a screenshot that features two of Windows’ built-in utilities, Notepad on the
    left and Wordpad on the right. Wordpad has more Microsoft suite GUI features that
    may be more recognizable to you, including Microsoft''s Quick access bar located
    above the highlighted "File" tab. Notepad is very bare-bones in comparison. Both
    utilities, unlike word processors, allow you to save in a different file extensions.
    However, Wordpad is more similar to a word processor than Notepad, saving files
    in a rich text format (.rtf). Wordpad will warn you that you will lose formatting
    if you save in an extension other than rich text format. |


    What makes Notepad and Wordpad unique is that they can save files in a variety
    of extensions, while word processors cannot. File extensions are important because
    they tell the compiler how to interpret what is written in the file and that leads
    to a machine having a set of instructions it can understand and execute. Despite
    their abilities, these two programs lack crucial editor features like syntax highlighting.
    You might think this is no big deal, but code can mean different things because
    of how and when they appear, so helping helps distinguish what they are. So if
    everything is plain black and white, you have to work to figure out what piece
    of code refers to. It sounds complex, but once you code this will become obvious
    and necessary. Notepad++, not be confused with Notepad, has highlighting features
    but you will have to activate them like:


    | ![image.png](images/Image00004.jpeg) |

    | Screenshot of Notepad++ with C++ This illustrates how to enable a language syntax
    by going to Language>"C" and navigating to C++. Notepad++ is only available on
    the Windows platform (etc.). |


    Bluefish is a more advanced editor that comes with more features (“Bluefish Editor:
    Features,” etc.). Unlike Notepad++, Bluefish is available on multiple platforms
    other than Windows. But I would not recommend Bluefish for beginners because it
    has a lot of features that can be overwhelming to a complete. If you are new to
    programming you can give it a shot; you will find it has many of the typical features
    of an IDE text editor. Once in the text editor, you must select a compiler. Now
    let me show how you would set up your local environment on three platforms: Windows,
    Linux, and Mac.


    # Windows IDE Installation and Setup


    All you need to do is install an IDE. Just remember that it has a text editor
    and a compiler within it. Code::Blocks is a useful, open-source IDE made for C++
    and easily fits with a variety of compilers including Microsoft''s Visual C++.
    Installing Code::Block is easy. You just have to go to their downloads page at
    [http://www.codeblocks.org/downloads/26](http://www.codeblocks.org/downloads/26)
    [http://www.codeblocks.org/downloads/26] and select the latest version.


    | ![image13.png](images/Image00005.jpeg) |

    | Code::Blocks Download Page | As of this writing, Code::Blocks has version 20.03
    for Windows and Linux distributions. The page also includes helpful notes for
    installation. |


    Once the program is installed, you are set. You can use it to write C++ programs.
    To do so you have to follow three steps: creating a file, building the program,
    and running the program.


    Creating a new file is a bit more nuanced. Here is what you have to do:


    1. Go to `File` > `New`

    2. Select `Create an empty file` and input your code

    3. Save the file with a `.cpp` extension


    And, needless to say, you have to build a program before you can run it. You can
    do this by going to `Build` > `Build and Run` in the menu.


