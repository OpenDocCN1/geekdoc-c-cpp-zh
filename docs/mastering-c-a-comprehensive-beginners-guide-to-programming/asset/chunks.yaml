    ## Logic Gates and Logical Operators


    | Logic Gates A | Physical Electronic Circuits that have one or more inputs while
    only having one output. `AND` gates only pass "1" when all inputs are "1"; `OR`
    gates pass "1" as their output when they receive "1" at any of their inputs; `NOT`
    gates pass "1" when they receive "0" at their input. | Logical Operators |

    |---|---|---|---|

    | Logical Operators | Binary operators used in combination with relational operators
    combine two or more conditions to describe a specific constraint. | Loops | Function
    that execute a block of code as long as a specified condition is reached |

    | Low-Level Language | A programming language that closely follows a computer''s
    instruction set architecture—commands or functions in the language map closely
    to processor instructions. This reduces the overhead for running the program as
    the compiler takes resources to translate low-level languages into machine code.
    | Chapter 2 |

    | Machine Language | Coding language that is directly compiled and executed by
    A CPU. See "Assembler Language". | Chapter 1 |

