    但这些实践对你来说不仅仅是有处。随着世界的发展，它变得越来越复杂，因此程序能够向用户解释自身是非常好的。如果你的程序有输出内容，请确保它是易于阅读的。我们已经在书中看到了如何实现这一点。使用像
    `\n` 序列来换行，使用 `\t` 创建水平制表符（缩进），以确保你的代码中有足够的空白。但作为一名与服务器和其他设备工作的后端程序员，你可能不需要像为客户端提供内容的前端程序员那样频繁地输出。唯一可能查看你的输出内容的用户是通过终端管理这些机器的其他技术人员和管理员。格式化实践在后端编程中经常被忽视，但仍然是一个良好的习惯。对于管理员和技术人员来说，这非常有价值，因为他们没有资源去处理程序员在调试时遇到的那些晦涩的编译器错误。因此，一个格式化良好并在终端或控制台中清晰提供这些信息的程序是重要的。


    # 核心总结：C++ 中的计算机科学概念


    除了编程之外，我们还探索了一些基础计算机科学概念。我们观察了机器的行为及其语言。我们讨论了学习编程就像学习一种新语言：两者都有语法和规则，确保了通信的可能。C++
    是一种后端服务器语言，用于管理控制海量数据的服务器。与 Python 这种更具人道化的高级语言不同，C++ 要求程序员在代码中更加详尽。每个变量在函数中必须是唯一的，否则将会出错。所有函数和语句都是区分大小写的，并有管理它们的特定规则。我们实现了许多
    `if() ...else` 语句，并制作了嵌套的 `if-else` 语句。我们看到像 `if()` 这样的条件语句可以在没有 `else` 的情况下执行，但如果条件为假，缺少
    `else` 语句会导致错误。正如缺失动词表示句子不完整一样，没有 `if()` 的 `else` 语句是无法实现的。


    我们看到了计算机如何使用逻辑数学通过二进制数进行通信。我们看到了位运算函数（bitwise functions）如何在位级别上工作，完成如 `AND`、`OR`
    和 `NOT` 等逻辑数学计算。所有其他基于对象的 C++ 函数必须由编译器翻译成机器语言。但位运算速度更快，因为它们跳过了这一步，直接与机器通信。它们通常部署在竞争性编程中，以创建高度敏捷的程序和例程。在竞争性编程之外，位运算在管理大数据方面也具有功能。


    位运算的挑战在于它们对人类来说非常难以理解，因为它们是二进制的。为了看到计算机看到的内容，我们上了关于二进制和二进制数学的简短计算机科学课。我们用位运算例程程序了一个“字节大小”的寄存器流，并制作了动态缓冲区来存储位运算的位。这些虚拟缓冲区和寄存器就是服务器管理
    TB 级数据。想一下；我们的缓冲区和寄存器都只有一个字节长，但 1 TB 是 1,000,000,000,000 字节（或 1.099.511.627. 字节）。它服务了超过
    32.5 亿小时的内容（“YouTube 存储多少数据？—— Quora”等）。位运算让这些服务器能够在不中断或不产生巨大延迟的情况下处理这些数据。这是 C++
    的优势之一，允许程序员处理位操作，特别是我们在编程时，我们还会处理不同类型的数据。我们看到字符串是字符数组，这对程序员来说很有用。在 C++ 中，字符串不是对象数组，这对于其他语言来说更灵活。在
    C++ 中，字符串是字符数组。事实上，字符串就是数组。想一下；我们的缓冲区和寄存器都只有一个字节长，但 1 TB 是 1000 GB 或 1,000,000,000
    字节。1,000,000,000 字节是 1 GB。1,000,000,000,000 字节是 1 TB。

