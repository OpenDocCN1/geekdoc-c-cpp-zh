    same allocations. Therefore, any changes made inside the `main()` function will
    impact the actual parameters that were passed. | Parameter Passing |

    | Parameter Passing Value | Values of actual parameters are copied into and stored
    in the function''s formal parameters. Any changes made inside `main()` does not
