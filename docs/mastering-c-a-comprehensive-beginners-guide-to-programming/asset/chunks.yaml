  trans: '

    由于 Linux 是一个使用控制界面的操作系统，对于初学者或习惯了 Windows 或 Mac 的人来说可能会很奇怪。这是因为用户通常习惯了 GUI（图形用户界面）。Linux
    的 GUI 化允许释放更多的计算能力用于编程——因为 GUI 需要一定的计算能力来生成和维护。这就是为什么许多服务器和其他编程环境使用控制界面。此外，许多环境使用
    Linux 发行版。


    Linux 发行版（distro）是一种基于 Linux 内核软件集合以及用于安装额外软件的包管理系统的操作系统。


    以下是安装和初始化编译器的指令。这将适用于 Ubuntu，一种流行的初学者 Linux 发行版。在你使用的任何 Linux 发行版中，这些安装过程都是相似的。


    注意：有许多 Linux 发行版提供用户喜爱的基于 GUI 的桌面体验。其中大多数是开源的并可以免费下载和安装。你可以探索这些发行版并创建控制界面进行练习。一个值得考虑的免费发行版是
    CentOS，它基于 Red Hat 用于服务器管理。红帽企业级 Linux (RHEL) 用于许多服务器管理设置，并且不是免费。然而，CentOS 使用了它的许多组件，是准备在
    Red Hat 环境工作的极佳发行版。


    在本示例中，我们将使用 Linux 上的 GNU 编译器集合（GCC）。GNU 编译器是一个基于 Linux 的编译器，支持 C++ 以及其他各种语言，如
    Fortran、`ada` 和 Java（“GCC 7 Release Series—Changes, New Features, and Prefixes—GNU
    Project—Free Software Foundation (FSF)”等）。要安装 GNU GCC，请遵循以下步骤：


    ### 1. 在控制台中，输入以下命令：


    首先通过输入此命令检查机器是否已经安装了版本：


    ```bash

    gcc -v

    ```


    ![image45.png](img/Image00014.jpeg)


    #### 1. 在 Ubuntu 控制台中检查 GNU GCC


    你应该检查系统是否有 GCC 副本。此截图显示了一个已安装 GCC 的系统。在使用命令后，如果你的系统中没有 GCC 副本，将缺少这一行。如果有副本，它将有一行类似的内容。很可能你的版本会更近。


    以下命令将在你的系统中安装 GCC：


    ```bash

    sudo apt-get update

    sudo apt-get install gcc

    ```


    ![image19.png](img/Image00015.jpeg)


    #### 1. 在 Ubuntu 控制台中安装 GNU GCC


    在截图中，GNU GCC 已经存在。如果系统中不存在 GNU GCC，运行高亮命令将在你的系统上安装 GNU GCC（Patel, 2014）。控制台将提示你输入“Y”来开始安装。你还将获得包管理功能，例如终端可以你过时或不需要的包。它还会建议让你的系统更高效的命令。这解释了
    Linux 为什么在程序员中如此受欢迎；尽管它允许他们轻松地排除故障，给予他们更多控制权，并且与 GUI 相比更容易导航。这是因为程序员更有可能记住一行代码，而不是某物在
    GUI 中的位置。


    以下命令将安装编译并最终运行 C++ 所需的所有库：


    ```bash

    sudo apt-get install build-essential

    ```


    ![image39.png](img/Image00016.jpeg)


    #### 1. 在 Ubuntu 中安装 GNU GCC


    此截图显示了一个安装了 build-essential 库并输入高亮命令的系统。与安装 GCC 类似，在使用命令并在发现系统中没有 build-essential
    副本后，它会提示你安装“Y”，然后终端将安装库。


    #### 1. 使用以下命令检查安装：


    ```bash

    g++ --version

    ```


    如果一切顺利，它将告诉你安装了哪个版本的 GCC。由于 Linux 有内置的文本编辑器，你将需要使用以下命令访问文本编辑器的 GUI：


    ```bash

    gedit

    ```


    你可以自由地按照你的意愿编写程序。记住以 ".cpp" 扩展名保存程序，以便它们能被正确编译。


    ![image52.png](img/Image00017.jpeg)


    gedit Ubuntu 此截图显示了 Linux 的内置文本编辑器 gedit，gedit 是一种 Linux 编程文本编辑器工具，具有针对多种编程语言的语法高亮和标签页功能。确保从高亮的下拉菜单中选择“C++”。你可以通过点击“保存”按钮在
    GUI 中保存你的程序文件。确保列出你保存文件的目录，因为你必须将编译器指向该目录以编译和运行代码。


    要测试并运行你的代码，你必须遵循这些指令：


    #### 1. 终端进入文件目录


    要做到这一点，请使用此命令。重复进入目录直到显示 `.cpp` 文件：


    ```bash

    ls

    ```


    #### 1. 编译并测试程序文件


    使用这些命令进行操作：


    ![Image00018.jpg](img/Image00018.jpeg)


    如果有任何错误，此命令将告诉你哪一行包含错误，就像你从 IDE 中预期的那样样。然后你可以通过“gedit [filename.cpp]”打开程序文件并修复代码行。


    #### 1. 运行程序文件


    编译器将创建一个名为 `test` 的可执行文件来运行程序。你可以通过在终端输入 `./test` 来执行它。


    ```bash

    ./test

    ```


    ![image32.png](img/Image00019.jpeg)


    在 Ubuntu 中测试、编译和运行 .cpp 文件 此截图显示了终端测试、编译和运行在 gedit 中编写的示例代码（运行 AC、Linux C++ 程序、Ubuntu
    16.04（初学者 Ubuntu 教程）等）。


    Linux 发行版是详细的基于控制台的系统，大多数系统可以通过终端处理任何语言的编程。学习在 Linux 环境中工作是有益的，因为它让你接触到服务器端编程。

