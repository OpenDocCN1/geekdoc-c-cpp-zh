    The last binary operators we will discuss are assignment operators. Assignment
    operators are used for assigning value and dynamically changing values. In a principles
    of programming, we talked about programs needing to be as efficient as possible
    while using a few instructions as possible. Advanced assignment operators combine
    with equal assignments and other various operations to reduce lines of code. They
    are all atomic operations, meaning they allow programmers to manipulate stored
    values within variables and reassign them. Below is a list of common assignment
    operators (Prabhu, 2018):


    - “![Image00151.jpg](images/Image00151.jpeg)”: Equal assignment operator assigns
    the value on the right to the variable on the left.

    - “![Image00152.jpg](images/Image00152.jpeg) +=”: This operator adds the value
    of the variable on the left to the value on the right. Then it saves the result
    to the variable on the left. For example, `![Image00153.jpg](images/Image00153.jpeg)`
    without having to use a separate arithmetic operator.

    - “![Image00154.jpg](images/Image00154.jpeg) -=”: This operator subtracts the
    value of the variable on the left from the value on the right. Then it saves the
    result to the variable on the left.

