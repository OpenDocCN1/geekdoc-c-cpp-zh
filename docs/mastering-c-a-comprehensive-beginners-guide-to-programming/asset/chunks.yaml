    # 变量


    变量是任何编程语言中最重要的方面之一。编程语言的函数和其他操作通常对变量进行操作。正如我们所说的，并不是所有程序都需要输入或输出，但所有程序都会有一些正在处理的变量，否则就无事可做了。


    函数的结果始终是状态改变。状态改变是指机器从一个决策或操作阶段变为另一个阶段。这个术语曾用于描述旧大型机计算机中的操作，但我们仍然在计算机中使用它来描述程序的工作原理。在我们的示例中，IDE
    在程序运行之前从初始化的主状态开始。然后它切换状态以执行输出命令。


    状态改变经常在低级语言中被讨论，因为它们接近机器语言。低级语言也被编译语言，因为它们被编译成机器语言。这与 Python 等高级语言形成对比。如果你还记得，我们讨论过由于内置库的存在，高级语言不需要声明带有其数据类型的变量。例如，Python
    使用 Python 环境来识别变量及其数据类型。而在 C++ 中，变量和数据类型必须声明。数据类型告诉编译器如何处理数据。当你考虑到数学中的向量时，数据类型就更有意义；与表示数量的整数不同，向量告诉我们空间的尺寸和方向。因此，向量是与整数不同的数据类型。这类属性用于
    Photoshop 等软件中以帮助渲染。


    注意：基于向量的图像可以在不丢失图像质量的情况下进行。这是因为 `.jpeg` 或 `.png` 等文件将图像的像素位置作为整数存储在网格上。`.svg`
    或 `.pdf` 等矢量文件使用向量来描述它们的像素分配。因此，当图像放大时，向量会指示颜色如何扩展，而普通图像文件则不会。这就是在处理非矢量图像文件时导致像素化和失真的原因。


    # 输入与输出：声明变量


    在上节中，我们在学习如何使用 `cout` 时声明了一些内容。在本节中，我们将查看数据类型的示例以及如何声明它们。以下是变量声明示例及其含义（“C++ Variables”，n.d.）。请记住，变量本质上存储的是类型的数据：


    * “`![Image00058.jpg](img/Image00058.jpeg)`”是“integer”的缩写，存储不带小数的整数。该关键字包括正整数和负整数。

    * “`![Image00059.jpg](img/Image00059.jpeg)`”：存储带小数的数字，包括正数和负数。

    * “`![Image00060.jpg](img/Image00060.jpeg)`”是“character”的缩写，无论大小写都存储单个字符。`Char`
    值用单引号括。

    * “`![Image00061.jpg](img/Image00061.jpeg)`”：存储文本，例如我们的“Hello World”示例。`String`
    值用双引号括。

    * “`![Image00062.jpg](img/Image00062.jpeg)`”是“Boolean”的缩写，存储两个状态的值：`true` 或 `false`。正如之前过的，这些值可以表示为“0/1”或“false/true”。


    在下一节中，我们将详细讨论它们。现在让我们来看这些示例。要创建一个变量，你必须在 `=` 操作符之后分配值。它们的语法如下：


    ```

    datatype name = value;

    ```


    注意：每个 `![Image00063.jpg](img/Image0063.jpeg)` 在你的函数内部必须是唯一的。否则将会导致错误。现在让我们创建一个名为
    `myNum` 数据类型为 `int` 值为 `10` 的变量，然后让我们的程序打印出来。


    ![image2.png](img/Image0064.jpeg) 声明 `int` 数字此截图是“myNum”程序的成功测试。你可以通过以下 URL 访问保存的
    IDE 工作空间：[`ide.geeksforge.org/t4P6qCVkg`](https://ide.geeksforge.org/t4P6qCVkg）（注意：文本中的
