  trans: '

    专注于编程的 IDE 环境内部始终包含一个文本编辑器和一个编译器。非 IDE 环境则将编译器和纯文本编辑器分开。在非 IDE 设置中，文本编辑器充当编程接口；这简单意味着文本编辑器将是你修改代码的地方。


    ![Text Box 56](img/Image00001.jpeg)


    在寻找文本编辑器时，你需要一个具有语法高亮和缩进功能的编辑器，因为所有编程语言都遵循其特定的语法规则。这是因为你希望能够轻松地阅读自己的代码，也希望合作者也能读懂代码。这些文本编辑器通过提高可读性来提供帮助。这一点尤为重要，因为编码不再是也从来不是一项单独完成的任务。现实中不存在电影里那种独行的天才。


    Github 和 Pastebin 是启用了语法高亮插件的代码聚合平台。Github 允许你在他们的网站上托管整个项目，而 Pastebin 仅允许代码片段。在这些平台上，你可以用各种语言保存代码。


    它们对程序员来说非常有用，因为它们允许程序员共享代码、协作、测试等。学习如何将项目部署到 Github 是编程中最重要的事情之一，因为它已经变得非常标准化。因此，维护一个
    Github 档案也变得很重要，因为它包含了你正在进行、曾经进行过的项目以及你的活动（Peshev, 2017）。对于潜在的雇主或合作者来说，这些信息是无价的。


    | ![image34.png](img/Image00002.jpeg) |

    | C++ 代码语法示例 | 这是一个开启了语法高亮的 Pastebin 截图。[A](https://www.zotero.org/google-docs/?MBrR1L)[“C++
    Code,” 2015)](https://www.zotero.org/google-docs/?MBrR1L) [A](https://www.zotero.org/google-docs/?MBrR1L)
    。语法高亮和制表间距有助于让代码更易理解。所有带有语法高亮的文本编辑器都会使用这种方案：库显示绿色，函数、数据类型和数据显示蓝色。字符串将显示为红色。 |


    当你在本地工作时，无法立即获得这些便利。如果你使用的是 Windows，在系统上找到的文本编辑器是记事本（Notepad）。Wordpad 是另一个具有更多
    GUI 特性的编辑器。当你打开这些程序时，你会注意到它们是多么单调和无聊。它们像 Word 但更糟，因为如果编写高效、优雅的代码对我们来说很重要，那么它们就不应该是简单的文字处理程序。它们类文字处理器的特性使得它们更适合在里面写字而不是代码，尽管你也可以在里面写代码。


    | ![image7.png](img/Image00003.jpeg) |

    | Windows 记事本工具与 Wordpad 工具的并排对比 | 这是一个包含 Windows 两个内置工具的截图，左侧是记事本，右侧是 Wordpad。Wordpad
    具有更多微软套件的 GUI 特性，这些特性你可能更加熟悉，包括位于高亮“文件”选项卡上方的微软快速访问栏。相比之下，记事本非常简陋。与文字处理器不同，这这两个工具都允许你以不同的文件扩展名保存。然而，Wordpad
    比记事本更像文字处理器，它以富文本格式 (.rtf) 保存文件。如果你使用富文本格式以外的扩展名进行保存，Wordpad 会警告你将丢失格式。 |


    记事本和 Wordpad 的独特之处在于它们可以以多种扩展名保存文件，而文字处理器则不能。文件扩展名很重要，因为它们告诉编译器如何解释文件中编写的内容，从而让机器拥有一组它可以理解并执行的指令。尽管有这些能力，这两个程序缺乏语法高亮等关键的编辑器功能。你可能认为这没什么大碍，但代码根据其出现的方式和时间意味着不同的含义，因此高亮有助于区分它们的身份。所以，如果一切都是黑白色的，你就必须费力去判断某段代码指的是什么。听起来很复杂，但一旦你开始编程，这就会变得显而易见且必要。Notepad++（不要与
    Notepad 混淆）具有高亮功能，但你必须激活它们：


    | ![image.png](img/Image00004.jpeg) |

    | Notepad++ 的 C++ 截图 | 这说明了如何通过进入语言 (Language) > "C" 并导航到 C++ 来启用语言语法。Notepad++
    仅适用于 Windows 平台（等）。 |


    Bluefish 是一个更高级的编辑器，带有更多功能（“Bluefish Editor: Features”等）。与 Notepad++ 不同，Bluefish
    在 Windows 之外的多个平台上可用。但我不会向初学者推荐 Bluefish，因为它有很多功能会让完全的新手无所适措。如果你是编程新手，可以尝试一下；你会发现它具有许多
    IDE 文本编辑典型功能。一旦进入文本编辑器，你就必须选择一个编译器。现在让我向你展示如何在 Windows、Linux 和 Mac 三个平台上设置你的本地环境。


    # Windows IDE 安装与设置


    你只需要安装一个 IDE。只需记住它内部包含一个文本编辑器和一个编译器。Code::Blocks 是一个为 C++ 制作的有用开源 IDE，可以轻松适配各种编译器，包括微软的
    Visual C++。安装 Code::Blocks 非常简单。你只需要访问他们的下载页面 [`www.codeblocks.org/downloads/26`](http://www.codeblocks.org/downloads/26)
    [http://www.codeblocks.org/downloads/26] 并选择最新版本。


    | ![image13.png](img/Image00005.jpeg) |

    | Code::Blocks 下载页面 | 截至本文写作，Code::Blocks 有适用于 Windows 和 Linux 发行版的 20.03 版本。页面还包含有助于安装的说明。
    |


    一旦安装了程序，你就准备好了。你可以用它编写 C++ 程序。要做到这一点，你必须遵循三个步骤：创建文件、生成程序和运行程序。


    创建新文件稍微复杂一点。你需要执行操作：


    1. 转到 `File` (文件) > `New` (新建)

    2. 选择 `Create an empty file` (创建空文件) 并输入你的代码

    3. 使用 `.cpp` 扩展名保存文件


    不用说，在运行程序之前必须生成它。你可以通过进入菜单中的 `Build` (生成) > `Build and Run` (生成并运行)来实现。


    | ![image20.png](img/Image00006.jpeg) |


    '
