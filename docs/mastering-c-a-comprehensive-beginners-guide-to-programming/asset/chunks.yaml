    # 数据类型


    数据类型指定了存储在变量中的信息的大小和类型。每个类型都有自己的关键字和关联的大小（“C++ Data Types”，n.d.）：


    * “`![Image00058.jpg](img/Image00058.jpeg)`”是“integer”的缩写，存储整数。大小为 4 字节。

