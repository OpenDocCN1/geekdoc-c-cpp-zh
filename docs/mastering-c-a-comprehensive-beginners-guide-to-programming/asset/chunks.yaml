    现在我们已经了解了决策函数以及它们是如何工作的，让我们让我们到函数以及它们在编程中的作用上。


    ## 第 6 章：创建函数


    我们讨论过算法是理解问题和规划代码如何工作以修复问题的方法。算法接收输入，执行操作，然后给出一个会导致状态更改的结果。函数是一段你可以多次调用的代码，而无需再次编写代码。代码通常是执行所需任务并具有高重用性的内容。函数由头部和体组成。以下是函数的语法格式：


    ![Image00204.jpg](img/Image00204.jpeg)


    ```cpp

    {

    ![Image00205.jpg](img/Image00205.jpeg)

    ![Image00206.jpg](img/Image00206.jpeg)

    }

    ```


    正如你所看到的，与其他任何编程语言一样，C++ 基本上是一系列函数、语句和运算符，中间夹杂着对象和其他数据存储元素。我们目前为止写的所有内容都使用了 `main()`
    函数，其语法与上面的类似。所以函数对你来说并不是新鲜的。


    每个函数必须返回一个数据类型，就像 `main()` 函数返回 `int` 0 一样。如果函数没有这样做，则使用 `(void)` 作为返回类型。正如你可能猜到的那样，`return`
    语句是结束函数的语句。


    函数接收的输入被称为参数或实参。并不是所有函数都会像我们在 `main()` 中那样接收输入；无论如何，你仍然可以将参数传递给函数以便其运行。这就是库将对象传递给
    `main()` 的方式。


    # 创建并调用函数


    要开始调用函数，你必须在 `main()` 之前对其进行声明和定义。这是因为 C++ 是顺序执行的。C++ 实践优先，函数也具有优先级。这就是为什么你必须在
    `main()` 之前声明它们以便你可以调用它们。它们也被这样命名，因为它们让代码更有组织。一旦声明了函数，我们可以在 `main()` 任何地方定义它。


