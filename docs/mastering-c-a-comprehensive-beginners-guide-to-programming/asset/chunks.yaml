    \ 作为默认版本。`get/put...` 函数都存在 C++11 中。如果你在使用这些操纵符时遇到错误，请检查你的设置是否在使用 C++11。此外，`A![Image00054.jpg](img/Image00054.jpeg)\
    \ A` 是仅限 C++14 的操纵符。该操纵符允许你插入和提取带有空格的引号字符串 [A](https://www.zotero.org/google-docs/?6OhBz2)[(](https://www.zotero.org/google-docs/?6OhBz2)\
