    \ you with debugging skills. Also take your time to appreciate the code and understand\
    \ it.\n\n## Logical Operators\n\nLogical operators add more complexity to relational\
    \ operators. These are comparable to human ideas of \"and\" or \"or\". They also\
    \ have qualities that switch the meaning of relational operator. Logical operators\
    \ are used in conjunction with relational operators to combine two or more conditions\
    \ to describe a constraint. They make us catch lot more and do lot more with our\
    \ conditions. There are three logical operators (aggi, 215b):\n\n- `&&`: The AND\
    \ operator returns a Boolean `true` when both conditions are met and `false` if\
    \ they aren’t.\n- `||`: The OR operator returns a Boolean `true` when one (or\
    \ both) of the conditions are met, and `false` if none of the conditions are met.\n\
    - `!`: The NOT operator returns a Boolean `true` if the conditions in consideration\
    \ are not satisfied. If one of the conditions is true, it returns a Boolean `false`.\n\
    \nLogical operators are used a lot in machines. Imagine a `NOT` operator in a\
    \ security system of a bank. Let’s say locked doors are `0 [false]` and unlocked\
    \ doors are `1`. Because the bank should stay secure, our default value is `0`.\
    \ This is called a failed closed system, because if things go wrong the doors\
    \ will be closed (the default). All signals that go to the door are controlled\
    \ by a `NOT` signal: If nothing is going on, the doors should remain locked, and\
    \ if there is a robbery they should also remain locked. Doors that open during\
    \ a robbery will get a `NOT` signal to fail-close. But in a fire, these doors\
    \ should open, so the fail-closed `NOT` signal will return `true` to open doors.\n\
    \nLet’s explore logical operators by building a logical routine program. Follow\
