    ## 字符串索引与数组


    回想我们关于对象的对话。向量数组也是一种特殊的数学现象，具有其特殊的属性。数组是对象的有序排列——通常是行、列或矩阵——每个对象都有其特定的位置。字符串存储在由字符组成的数组中。因此，字符串数组是字符的有序排列，字符串中的每个字符都有其自己的索引位置。使用
    `[]` 访问数组以查找数组中的任何字符或其他项。字符串索引从 `[0]` 开始。让我们通过修改程序使其打印出 `fullName` 的第 3 个字符来观察这一操作。


    注意：请记住索引从 `[0]` 开始。因此，字符串数组中的第 3 个字符位于 `[2]`，而不是 3。


    我们将使用以下语法来实现此：


    ```

    fullName[x]

    ```


