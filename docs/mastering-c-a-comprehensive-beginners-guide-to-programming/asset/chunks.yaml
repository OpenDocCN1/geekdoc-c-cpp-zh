    Here is how it looks:


    | `![image15.png](images/Image00159.jpeg)` |

    | Assignment Routine This screenshot is a successful run of our assignment routine
    program. This program has a sequential output, which means that each instruction
    impacts the result of the next instruction. This means if we were to change the
    order of atomic operations applied to `A![Image00160.jpg](images/Image00160.jpeg)`
    that the output would be different. To study it fully, you can access it on our
