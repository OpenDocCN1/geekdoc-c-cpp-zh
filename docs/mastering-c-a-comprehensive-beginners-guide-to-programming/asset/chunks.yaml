- fmt: "\nNote: The process for installing GCC and compiling on CentOS is similar.\
    \ To install, you instead use a `!![Image00020.jpg](images/Image00020.jpeg)`.\
    \ This command automatically installs the need libraries as well. The steps for\
    \ composing, compiling, testing, and running the program are all the same.\n\n\
    Creating your own programming environment helps prepare you for real-world scenarios\
    \ far away that online coding spaces cannot. In this book, we will be using an\
    \ online AIDE. This is because everyone will have the same learning environment\
    \ with standardized outputs and interfaces. It simplifies things.\n\n# Chapter\
    \ 2: Basics of C++, Principles of Programming\n\nProgramming languages are alike\
    \ to any other human language: they have a structure, syntax, and rules. It is\
    \ not enough to know the words of another human language. Knowing how to use them\
    \ and how they function in that language is an integral apart of communicating\
    \ effectively in that language. Programming languages function the same away,\
    \ but the communication they care about is trying to help one another between\
    \ a man and a machine. While machines, at least today, can never be as clever\
    \ and capable as we are, there is a lot they can understand and operate with an\
    \ efficacy that is alien to us. All programming is a set of instructions. These\
    \ instructions can be rules, they can be actions you want the machine to perform,\
    \ or something else. But all this communication is possible because we follow\
    \ the rules of a programming language.\n\nProgramming rules, or syntax, are a\
    \ list of delineating symbols used to communicate aspects of a program alike functions\
    \ and variables. Syntax is important to the compiler because it tells the compiler\
    \ what instructions it should give to the machine.\n\nBefore we start, it is worth\
    \ keeping a few things in mind. Unlike `Python` or other high-level programming\
    \ languages, C++ does not resemble the language of humans quite as easily. High-level\
    \ languages like JS, Python, and C# are made this away because it makes them easy\
    \ to read and manage. C++, despite being this away, is easier for machines to\
    \ understand precisely because it is not so abstracted. This is why when working\
    \ with C++ you only need a compiler and a text editor, whereas languages like\
    \ Python need their environments installed.\n\n# Principles of Programming \n\n\
    C++ has many ways of completing the same task. Just like with human languages,\
    \ there are many ways of saying the same thing, but some ways are best suited\
    \ for certain occasions and some aren’t. C++ is the same away; some methods are\
    \ great because they reduce program overhead. Many developers will want that because\
    \ it increases the performance of the entire application, and that is the first\
    \ principle of programming: complete a task with the least amount of functions\
    \ as possible. Do not make things more complicated than they need to. In most\
    \ cases, this means using a loop or a switch statement in frugal away.\n\nThe\
    \ best way to do this is by understanding the nature of the problem first and\
    \ how best to implement the solution. In other words, you will need to write an\
    \ algorithm – a list of instructions that you want the machine to follow to fix\
    \ the problem.\n\nYour designs should always begin with the thing you want the\
    \ program to do. This will also include your algorithm, or at least the problem\
    \ that your algorithm will fix. The algorithm will always look something like\
    \ this:\n\n1. Input: data coming, where applicable\n2. Processing: operations\
    \ performed on the data and declaration of variables\n3. Output: the results,\
    \ or the action you want performed\n\nHere is a verbose example of a C++ program\
    \ to display \"Hello\":\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    cout << \"Hello\";\n    return 0;\n}\n```\n\nHere is the structure:\n\
    \n1. Call header for input and output\n2. Call `main()` function where execution\
    \ happens\n3. Print \"Hello\"\n4. Terminate a statement that indicates the state\
    \ of machine\n\nWe can see C++ needs the libraries that are needed to execute.\
    \ Despite being simple, this algorithm illustrates how developers take tasks and\
    \ translate them into code. In the next chapter, we will use this algorithm to\
    \ write a program. As you noticed in the example, there are comments comments.\
    \ It is good practice to include comments so people know what each line does.\n\
    \n# Overview of C++ Syntax\n\nWe have talked about the importance of syntax for\
    \ the compiler, but it is also important to understand the syntax of a language\
    \ because it will allow you to debug the code. Just like with human languages,\
    \ if you know the rules of a language you can correct yourself easily when you\
    \ make mistakes. Debugging is the process of finding and removing errors and abnormalities\
    \ in code, also known as \"bugs\".\n\nIDEs have debugging tools that highlight\
    \ where errors occur in code, but these features are not always reliable. For\
    \ instance, leaving out a semicolon to terminate a line of code is a common error,\
    \ but the debugger will highlight the error in the `.h` file instead of the code\
    \ where the mistake happens in the `.cpp` file. Most debuggers are not intelligent\
    \ enough to detect an absence of something and will throw a verbose error that\
    \ the compiler gives when the unterminated line violates a rule in the library.\n"
