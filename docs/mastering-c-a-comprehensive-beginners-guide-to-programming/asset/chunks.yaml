    “Hello World”是每种编程语言的入门项目；其目的是向学习者展示程序的基本语法以及函数的工作原理。随着你学习越多的语言，你将编写许多“Hello World”程序。在上一节中，我们用它来探索算法、语法和
    C++ 编程环境等主题。在本节中，我们将更进一步：对代码进行操作。


    C++ 使用来自 `iostream` 库的 `cout` 对象。对象是计算机用于管理数据的实体。在我们的示例中，`cout` 被配合 `<<` 运算符告诉编译器打印“Hello
    World”。不要惊慌；我们将在后面的章节中讨论操作符和对象。现在，理解编译器将 `cout` 读取为特定的特定指令就足够了，因为该指令定义在我们声明的 `iostream`
    库中。


    现在，让我们通过更改输出内容来看查看“Hello World”和 `cout` 对象。在这里找到原始代码，以便将其作为参考：[A](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [`ide.geeksforgeeks.org/eA8ZMEKiDO`](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO)


    | ![image16.png](img/Image00027.jpeg) | A |

    | GeeksforGeeks IDE 中的“Hello World”程序。此截图是在分屏模式下成功运行“Hello World”的界面。当我们开始使用 IDE
    进行编码练习时，请注意输入框和输出框。虽然此程序没有输入，但当输出区域下程序提示时，你会将数据输入到标记为“Input Goes Here...”的顶部框中。你可以在这里保存的
    IDE 中访问此程序：[A](https://ide.geeksforgeeks.org/eA8ZMEKiDO) [`ide.geeksforgeeks.org/eA8ZMEKiDO`](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO)。你也可以在索引中查看代码的副本。 |


    ## 使用 `cout`


    `cout` 对象使用 `<<` 运算符来打印值和文本，我们可以根据需要使用任意数量的它。使用浏览器中的 IDE，将代码更改为打印：


    ```cpp

    Hello World

    I am learning C++

    ```


    如下所示：


    | ![image30.png](img/Image00028.jpeg) | 添加 `cout` 对象。此截图是在分屏模式下成功运行我们编辑后的“Hello
    World”程序的界面。虽然程序运行没有任何错误，但它没有产生我们想要的结果。观察输出发现，打印的文本缺少换行。我们必须指示编译器添加换行以获得预期的结果。
    | 添加行可以通过多种方式实现：我们可以在字符串内部添加分隔符，或者使用来自 `iostream` 库的另一个操作符对象。 |


    ## 使用转义序列


    尽管可能想在 `cout` 中编写字符串并换行，这是行不通的。它会破坏代码并导致无法运行。不相信我的话？试试看！你可以通过转义序列来添加换行。转义序列用于许多需要在字符串和字符流中引入特殊字符的场景。它也可以添加行，如下所示：


    | ![image23.png](img/Image00029.jpeg) | 使用字符串内转义序列来分隔和处理输出。此截图是在分屏模式下成功运行我们编辑后的“Hello
    World”程序的界面。使用 ![Image00030.jpg](img/Image0030.jpg)，我们能够获得预期的输出。 |


    当你查看代码时，可以看到使用了双重引号。因此，如果你想在字符串中添加双引号，将必须使用转义序列，以便编译器知道它不是代码的一部分，从而避免不可预见的错误或漏洞。这就是转义序列重要原因。以下是可以使用它们的许多实例列表（转义序列—Cppreference.com.）：


    - `\''`: 单单引号

    - `\"`: 双引号

    - `\n`: 换行符

    - `\?`: 问号

    - `\\`: 反斜杠

    - `\t`: 制表符

    - `\r`: 回车

    - `\a`: 水平制表符

    - `\v`: 垂直制表符


    注意：如果你决定尝试不同的转义序列作为文本分隔符，请务必只使用显示的那些。在另一个 URL 处有一个保存你的工作以便稍后返回的按钮。要返回我们的练习，你可以使用我们保存的
    IDE 工作空间 URL（[A](https://ide.geeksforgeeks.org/PsgSHE4h) [`ide.geeksforgeeks.org/PsgSHE4h`](https://ide.geeksforgeeks.org/PsgSHE4h)
    [A](https://ide.geeksforgeeks.org/PsgSHE4h)）。你也可以在索引中访问此代码。 |


    ## 使用 `endl`：输入输出操作符


    正如我们所说，编程语言像人类一样灵活。你可以用多种方式表达一条指令，结束字符串也不例外。转义序列和 `endl` 区别在于 `endl` 会刷新并刷新用于存储字符串的缓冲区。程序员使用
    `endl` 在打印大量文本后清理内存。你可以看到这在内存管理很有用。`endl` 是输入输出操作符的一个示例。输入输出操作符是允许使用 `<<` 运算符或
    `>>` 运算符控制输入输出流的函数（输入输出操作符—Cppreference.com.,.d.）。


    | ![image29.png](img/Image00041.jpeg) | 使用输入输出操作符来分隔和处理输出。此截图是在分屏模式下成功运行我们编辑后的“Hello
    World”程序的界面。使用 ![Image0042.jpg](img/Image0042.jpeg)，我们能够获得预期的输出。在如此小的程序中，很难看到使用操作符的影响。操作符在调用函数中使用时才会产生差异。你可以在此
    URL 访问代码：[A](https://ide.geeksforgeeks.org/htcfFytK71) [`ide.geeksforgeeks.org/htcfFytK71`](https://ide.geeksforgeeks.org/htcfFytK71)
    [A](https://ide.geeksforgeeks.org/htcfFytK71)。 |


    ## 更多输入输出操作符


    就像转义序列一样，还有许多输入输出操作符可以让程序员对数据类型或字符串有更多控制。当我们讨论数据类型和类结构时，其中许多将变得意义。以下是其中一些（输入输出操作符—Cppreference.com.,.d.）：


    - `setw`: 设置字段宽度

    - `fixed`: 使用定点表示法

    - `setprecision`: 设置小数位数

    - `left`: 输出向左对齐

    - `right`: 输出向右对齐

    - `hex`: 以十六进制显示数字

    - `oct`: 以八进制显示数字

    - `dec`: 以十进制显示数字


