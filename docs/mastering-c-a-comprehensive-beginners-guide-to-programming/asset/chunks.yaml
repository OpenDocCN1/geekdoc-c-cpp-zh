    # Variables


    Variables are one of the most important aspects of any programming language. Functions
    and other operations of a programming language, generally operate on variables.
    As we have said, not all programs need input or output, but all programs will
    have some variable that they are working on or there is nothing to work on.


    The outcome of a function is always a state change. A state change is when a machine
    changes from one decision or operational phase to another. This term was used
    to describe operations in old mainframe computers, but we still use it in computer
    science to describe how programs work. In our example, the IDE started with an
    initialized main state before the program ran. Then it switched states to execute
    the output command.


    State changes are often discussed in lower-level languages because of how close
    they are to machine language. Lower-level languages are also called compiled languages
    because they are compiled into a machine language. This is in contrast to high-level
    languages like Python. If you remember, we spoke of how higher-level languages
    do not need variables to be declared with their data types because of their built-in
    libraries. For instance, Python uses a Python environment to recognize variables
    and their data types. In C++, variables and the data types have to be declared.
    A data type tells the compiler how to treat the data. Data types make more sense
    when you think of vectors in math; unlike integers, which communicate amounts,
    vectors tell us the size and direction of space. Therefore, vectors are a different
    data type than an integer. Properties like these are used in software like Photoshop
    to help with rendering.


    Note: Vector-based images can be manipulated without losing the quality of the
    image. This is because files like `.jpeg` or `.png` store pixel location of an
    image as integers on a grid. Vector files such as `.svg` or `.pdf` use vectors
    to describe their pixel allocations. Therefore, when the image is made larger,
    the vectors indicate how the colors should expand while the regular image files
    do not. This is what causes the pixelation and distortion when manipulating non-vector
    image files.


    # Input and Output: Declaring Variables


    In the previous chapter, we declared some things as we were learning how to use
    `cout`. In this section, we are going to look at examples of data types and how
    they are declared. Below are examples of variable declarations and what they stand
    for (“C++ Variables,” n.d.). Keep in mind that variables essentially store types
    of data:


    * “`![Image00058.jpg](images/Image00058.jpeg)`”: A keyword is short for “integer”
    and stores whole numbers, without decimals. This keyword includes positive and
    negative integers.

    * “`![Image00059.jpg](images/Image00059.jpeg)`”: Stores numbers with decimals,
    both positive and negative numbers.

    * “`![Image00060.jpg](images/Image00060.jpeg)`”: A keyword is short for “character”
    and stores single characters regardless of their capitalization. `Char` values
    are single-quoted.

    * “`![Image00061.jpg](images/Image00061.jpeg)`”: Stores text, such as in our "Hello
    World" example. `String` values are double-quoted.

    * “`![Image00062.jpg](images/Image00062.jpeg)`”: A keyword is short for “Boolean”
    and stores values with two states: `true` or `false`. As previously discussed,
    these values can be expressed as either “0/1” or “false/true.”


    In the next section, we will discuss them in detail. Now let''s look at examples
    of these. To create a variable you have to assign a value after the `=` operator.
    Their syntax looks like this:


    ```

    datatype name = value;

    ```


    Note: Each `![Image00063.jpg](images/Image0063.jpeg)` must be unique within your
    function. Otherwise, it will cause an error. Now let''s create a variable called
    `myNum` with an `int` data type and a value of `10`, then have our program print
    out.


    `![image2.png](images/Image0064.jpeg)` Declaring `int` numbers This screenshot
    is a successful test of the “myNum” program. You can access the saved IDE workspace
    with the following URL: [https://ide.geeksforge.org/t4P6qCVkg](https://ide.geeksforge.org/t4P6qCVkg)
    (Note: the URL in the text seems to be a placeholder). This code was implemented
    without `![Image00056.jpg](images/Image0056.jpeg)` as it''s best practice. You
    should practice implementing the same code successfully with the namespace. Remember
    that you can reset the workspace to a successful state using the URL.


    We have our examples in our code. Let’s use an input box on top right so our program
    takes inputs and operates on them. We can do this by writing programs that take
    two numbers and add them together. To do this, we have to declare two variables
    that will store our inputs for our program to operate on. We will declare multiple
    variables:


    1. Two `int` variables named `x` and `y`,

    2. One `int` variable named `sum`.


    We can also tell the program to prompt the user to give two inputs. Note: In our
    IDE, you must enter the inputs before you run the program. Each input should be
    on its own line.


    `![image46.png](images/Image0065.jpeg)` Summing inputs and printing the result
    This screenshot is a successful test of the “Summing” program. You can access
    the saved IDE workspace with the following URL. This exercise had to be modified
    for our IDE’s input system. Therefore, we included additional `![Image00066.jpg](images/Image0066.jpeg)`
    lines that confirm our inputs. This code was implemented without `![Image00056.jpg](images/Image0056.jpeg)`
    as it''s best practice. You should practice implementing the same code successfully
    with the namespace. Remember that you can reset the workspace to a successful
    state using the URL.


    # Basic Data Types


    Data types specify the size and types of information stored in a variable. Each
    has its own keyword and an associated size (“C++ Data Types,” n.d.):


    * “`![Image00058.jpg](images/Image00058.jpeg)`”: A keyword is short for “integer”
    and stores whole numbers. It has a size of 4 bytes.

    * “`![Image00067.jpg](images/Image00067.jpeg)`”: Stores decimal numbers with 7
    decimal digits. It has a size of 4 bytes.

    * “`![Image00059.jpg](images/Image00059.jpeg)`”: Stores decimal numbers with 15
    decimal digits. It has a size of 8 bytes.

    * “`![Image00060.jpg](images/Image00060.jpeg)`”: A keyword is short for “character”
    and stores single characters regardless of their capitalization. It has a size
    of 1 byte.

    * “`![Image00062.jpg](images/Image00062.jpeg)`”: A keyword is short for “Boolean”
    and stores values that have a state of being `true` or `false`. It has a size
    of 1 byte.

