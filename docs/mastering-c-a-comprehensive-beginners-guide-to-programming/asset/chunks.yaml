    ## Introduction


    This book is fit for beginners and coders who are interested in getting into backend
    programming. Although C++ is sometimes portrayed as an aspect of days past, the
    language is still with us and continues to be behind some of the biggest technologies
    we use today–not mentioning its big impact in the gaming world. Its power and
    versatility continue to make it one of the most important languages of our time.
    It is not going anywhere and learning it will expand our horizons. C++ is often
    utilized as a backend language for data because of its little overhead. Companies
    like Spotify, Adobe, and Amazon power their backend with C++, and you will soon
    see why. It is also behind powerful gaming engines allowing programmers to build
    a game from scratch and effectively render content. The Unity and Unreal Engine
    are examples of gaming engines that run on C++. C++ is a beautiful, efficient
    language because of its favorable ratio to hardware: power it gives. This is why
    those who learn love it.


    In this book we will cover the following topics:


    * Programming terminology and principles

    * Setting up C++ environment

    * Getting Started: Syntax, Types, and Variables

    * Power of C++: Operations, Loops, Switches, and Decision making

    * Creating custom functions


    You will also find a useful glossary at the end so you can use the book as a reference
    once you get stuck.


    # Chapter 1: Setting up a C++ Development Environment


    At most basic, programming is writing a list of instructions in code that a machine
    can understand. The code results are executables. These files come with extensions
    that tell the compiler what the language is. These extensions are suffixes you
    often see at the end of a file like `.js`, `.cpp`, or `.hpp`.


    To write code and save an executable file, you need the following:


    1. A text editor: this will allow you to write and edit code.

    2. A language compiler: this program takes the code you have written and translates
    it into machine language your computer can understand and follow.


    All programming languages work like this except HTML, CSS, and JavaScript-these
    programs are interpreted and executed by a browser (.html). This means browser
    languages like JavaScript are software-based, while C++ is compiled and runs directly
    on your machine, not in a software environment. This means C++ is an assembly
    language. Assembly languages are low-level programming languages that need a compiler
    so they can run on a machine (Lithmee, 2018). In this context, the word low-level
    does not carry a bad connotation; it is descriptive, meaning that the language
    is closer to the machine or just step away from it.


    As you can probably guess, C++ is a general-purpose language that can run almost
    anywhere. This means it can be assembled and compiled in several different ways.
    This will largely depend on your operating system and the creation utilities you
    are using.


    Our C++ exercises will be compiled on an online IDE. IDE stands for Integrated
    Development Environment and it is used to edit and compile code. A bet that description
    sounds familiar. Yes, an IDE is an example of a text editor, but unlike a plain
    text editor, it has extra features that are important to the programming process.
    An IDE can do things like compile code, debug code, highlight code, warn you of
    syntax errors, and more.


    | ![image44.png](images/Image00000.jpeg) |

    | GeeksforGeeks IDE: A web-based Program Compiler. This IDE can be found at [https://ide.geeksforgeeks.org/](https://ide.geeksforgeeks.org/)
    [https://ide.geeksforgeeks.org/] and has several programming languages. We will
    be focusing on C++. This IDE has many coding utilities: a tabbed working space,
    an input box, and a code manager. This code manager includes two bottom buttons
    highlighted on the left. These code manager buttons allow you to download and
    upload code as files with their corresponding file extension. This IDE also allows
    you to run and generate a URL that saves the result. We’ll using these generated
    URLs to manage our lessons. |

