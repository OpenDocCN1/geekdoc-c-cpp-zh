    注意：在 CentOS 上安装 GCC 和进行编译的过程类似。要进行安装，你仅需使用 `!!![Image00020.jpg](img/Image00020.jpeg)`。此命令会自动安装所需的库。编写、编译、测试和运行程序的步骤都是相同的。


    创建你自己的编程环境有助于你应对在线编程空间无法提供的真实世界场景。在本书中，我们将使用在线 AIDE。这是因为每个人都拥有相同的学习环境，并具有标准化的输出和界面。这简化了事情。


    # 第 2 章：C++ 基础、编程原理


    编程语言与其他任何人类语言一样：它们有自己的结构、语法和规则。仅仅知道另一种语言的词汇是不够的。了解如何使用它们以及它们在该语言中如何运作，是在该语言中进行有效交流不可或缺的一部分。编程语言的功能也是如此，但它们关注的通信是人与机器之间的相互帮助。虽然机器至少在今天永远不会像我们一样聪明和能干，但有很多东西它们可以理解并以我们无法想象的效率进行操作。所有的编程都是指令集。这些指令可以是规则，可以是你想让机器执行的动作，或者是其他东西。但这一切通信之所以可能，是因为我们遵循了编程语言的规则。


    编程规则（或语法）是一系列用于界定的符号，用于通信程序的各个方面，例如函数和变量。语法对于编译器来说很重要，因为它告诉编译器应该向机器发出哪些指令。


    在我们开始之前，值得记住几点。与 `Python` 或其他高级编程语言不同，C++ 并不那么容易类似于人类语言。像 JS、Python 和 C# 等高级语言设计成这样是为了让它们易于阅读和管理。C++
    尽管如此，但它更易被机器理解，恰恰是因为它不那么抽象。这就是为什么在处理 C++ 工作时，你只需要一个编译器和一个文本编辑器，而像 Python 这样的语言需要安装它们的环境。


    # 编程原理


    C++ 有许多方法可以完成相同的任务。就像人类语言一样，有许多方式表达相同的意思，但某些方式适用于特定的场合，而另一些则不然。C++ 也是如此；某些方法非常好，因为它们减少了程序的开销。许多开发者会希望这样，因为提高了整个应用程序的性能，这就是编程的第一条原则：用尽可能少的函数完成任务。不要让事情变得比需要的更复杂。在大多数情况下，这意味着以节约的方式使用循环或
    switch 语句。


    实现此点的最好方法是首先理解问题的本质以及如何最好实现解决方案。换句话说，你需要编写一个算法——一组你想让机器遵循以解决问题的指令。


    你的设计应该从你想让程序做的事情开始。这也将包括你的算法，或者至少是算法将解决的问题。算法总是看起来像这样：


    1. 输入：适用时传入的数据

    2. 处理：对数据执行的操作以及变量的

    3. 输出：结果或你想执行的动作


    这是一个显示 "Hello" 的 C++ 程序详细示例：


    ```cpp

    #include <iostream>

    using namespace std;


    int main() {

    }

    ```


    其结构如下：


    1. 调用输入输出的头文件

    2. 调用执行执行的 `main()` 函数

    3. 打印 "Hello"

    4. 终止一个指示机器状态的语句


    我们可以看到 C++ 需要执行所需的库。尽管很简单，但这个算法说明了开发者如何获取任务并将其翻译成代码。在下一章中，我们将使用这个算法来编写程序。正如你在示例中注意到的那样，这里有注释。包含注释是一个良好的习惯，这样人们就知道每行代码的作用。


    # C++ 语法概述


    我们讨论过语法对编译器的重要性，但理解语言的语法同样重要，因为它允许你调试代码。就像人类语言一样，如果你了解一种语言的规则，当你出错时可以很容易纠正。调试是发现并移除代码中错误和异常的过程，也称为“bug”。


    IDE 具有可以高亮代码错误位置的调试工具，但这些功能并不总是可靠。例如，缺少分号来结束一行代码是一个常见错误，但调试器会高亮 `.h` 文件中的错误，而不是
    `.cpp` 文件中发生错误的地方。大多数调试器并不智能到可以检测到缺失，并且当未结束的行违反库中的规则时，抛出编译器给出的详细错误。


