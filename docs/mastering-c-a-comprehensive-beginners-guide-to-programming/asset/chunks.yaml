    ## 逻辑门与逻辑运算符


    | 逻辑门 A | 具有一个或多个输入和一个输出的物理电子电路。`AND` 门仅在所有输入都为"1"时才通过"1"；`OR` 门在任何一个输入接收到"1"时将"1"作为输出；`NOT`
    门在输入接收到"0"时通过"1"。 | 逻辑运算符 |

    |---|---|---|---|

    | 逻辑运算符 | 与关系运算符结合使用的二运算符，通过组合两个或多个条件来描述特定的约束。 | 循环 | 只要满足指定的条件就会执行代码块的函数 |

    | 低级语言 | 一种紧随计算机指令集架构的编程语言——语言中的命令或函数与处理器指令紧密对应。这减少了运行程序的开开销，因为编译器需要资源将低级语言翻译成机器码。
    | 第 2 章 |

    | 机器语言 | 直接由 CPU 编译并执行的编码语言。参见“汇编语言”。 | 第 1 章 |

    | 操作符，输入/输出 | C++ `iostream` 库中的辅助函数，允许使用 `<<` 运算符或 `>>` 运算符控制输入/输出流。 | 使用 endl：输入/输出操作符
    |

    | Notepad++ | 用于 Microsoft Windows 的文本编辑器和源代码编辑器。 | 设置文本 |

    | 对象 | 一种通用计算术语，描述计算机用于管理数据的方法。 | 第一个程序：输出和基础字符串 |

    | 操作数 | 描述被操作的值、对象或变量的操作组件。 | 注意：操作数... |

    | 操作 A | 运算符 | 描述指示正在执行的操作种类的符号的操作组件。运算符根据它们一次可以操作多少个操作数进行描述：一元、二元和三元。 | 第 4 章：C++
    中的操作 |

    | 组织标识符 | Apple 的专用命名法，用于在各种 Apple 数据库中创建唯一的 ID：Apple 开发者网站、iCloud 容器、App Store
    中的 iTunes Connect 门户。组织标识符作为“反向域名”的第一个参数，确保所有开发项目都能无缝集成到专用 macOS 框架中。 | Mac ADE
    安装 |

    | 参数传递引用 | 实际参数和形式参数指向相同的内存分配。因此，在 `main()` 函数内部进行的任何更改都会影响所传递的实际参数。 | 参数传递 |

    | 参数传递值 | 实际参数的值被复制并存储在函数的形式参数中。在 `main()` 内部进行的任何更改都不会影响所传递的实际参数。 | 参数传递 |

    | 红帽企业级 Linux (RHEL) | 红帽为商业市场开发的商业 Linux 发行版。 | Linux 编译器安装 > 注意：有许多发行版…… |

    | 寄存器 | 二进制存储数组，其中每个位在数组中都有自己的位置。寄存器用于计算位运算符。 | 位运算运算符 |

    | 关系运算符 | 用于比较两个值并返回布尔响应的二元运算符。 | 关系运算符 |

    | 脚本 | 由某些程序或脚本引擎执行的命令补充列表。 | 第 6 章：创建... |

    | 二进制 | 机器用于计算的数制。也称为二进制数系统。二进制数表示为位流，其中每个单独位可以是 0 或 1。位的位置决定了该位的值。 | 位运算 |

    | 服务端编程 | 编写管理动态或静态网站、主要服务的代码。 | | |

    | 服务水平协议 (SLA) | 管理为客户服务的协议。 | | |

    | `sizeof()` | 查询对象大小和字节数的一元操作。 | | | |

    | 软件开发包 (SDK) | 硬件和软件供应商提供的用于开发应用的工具集。 | | | |

    | 语句 | 描述代码开始部分的通用术语。取决于语句的类型和环境。 | | | |

    | 字符串 | 表示字符序列的编程数据类型，可以是字面量常量也可以是变量。 | | | |

    | 数组 | 字符的排列，每个字符通过其数值位置进行索引。 | | | |

    | switch() | 根据评估后的表达式执行不同代码块的分支语句。 | 循环 |

    | 三元运算符 | 接受超过 2 个操作数的运算符，或带有多个参数的条件运算符。 | 三元运算符 |

    | 文本编辑器 | 允许编辑代码的程序。 | 第 1 章 |

    | 一元运算符 | 使用单个操作数执行的运算符分类。 | 一元运算符 |

    | 变量 | 借自数学的概念，描述可以更改和操作的符号值。变量通过函数控制程序。 | 第 3 章 |

    | `while()` 循环 | 入口控制循环，测试条件并循环执行代码块直到满足条件。 | 循环 |

    | Xcode | 用于 macOS 的免费 IDE 开发套件。 | Mac ADE 安装 |


