    现在我们已经知道了 `for()` 循环是如何工作以及如何构建的，让我们来看看我们之前使用的拷贝构造函数。用于 `for` 拷贝构造函数调用的表达式为：


    ![Image00182.jpg](img/Image00182.jpeg)


    “e”是索引变量，“arr”是变量数组。我们看到 `for()` 循环需要三个表达式才能工作：初始化、测试表达式和更新表达式。


    拷贝构造函数有一个初始化函数 `(const auto& e)`。当你仔细观察时，你会发现这个表达式也可以用作测试表达式，因为 `&` 是一个取地址运算符，指向
    `e`，而 `e` 代表 `arr` 数组中的 `indices`。`:` 是一个进入类的运算符。它允许容器 `arr` 的属性传递给变量 `e`。`for()`
    循环将一直打印 `e` 直到 `arr` 的末尾。


    拷贝构造函数的调用适用于容器大小未知且你想打印出所有项目的情况。`for()` 循环从一开始就定义了必须发生的迭代次数，而拷贝构造函数的调用则取决于容器的大小。`while()`
