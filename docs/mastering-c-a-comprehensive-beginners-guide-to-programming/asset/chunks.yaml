    对于人类来说，计算这些并不容易，但这就是计算机以数据流进行通信的方式。它们更擅长识别和计数这些数字，就像人类处理十进制数字一样简单。因此，使用运行在计算机原生层级运行的位运算符可以提高速度和性能
    [Killian, 2012]，因为这跳过了将目标性编程转换为机器语言的翻译。这就是为什么你会发现位运算经常用于竞争性编程中。以下是 C++ 位运算符的列表（<Bitwise
    Operators in C/C++, 2014）：


    - “&”：位逻辑 `AND`（与）接收两个数字（操作数），并对这两个数字流中的每一个位执行 `AND` 运算。如果两者都为 1，则 `AND` 流的结果为
    1。

    - “![Image00123.jpg](img/Image00123.jpeg)”：位逻辑 `OR`（或）接收两个数字（操作数），并对这两个数字流中的每一个位执行
    `OR` 运算。如果其中任一个为 1，则 `OR` 流的结果为 1。

    - “![Image00124.jpg](img/Image00124.jpeg)”：位逻辑 `XOR`（异或）接收两个数字作为操作数，并对这两个数字流中的每一个位执行
    `XOR` 运算。如果两个位不同，则 `XOR` 的结果为 1。

    - “![Image00125.jpg](img/Image00125.jpeg)”：`Left Shift`（左移）运算符接收两个数字并将第一个操作数的位向左移动。第二个操作数用于确定移动位数。

    - “![Image00126.jpg](img/Image00126.jpeg)”：`Right Shift`（右移）运算符接收两个数字并将第一个操作数的位向右移动。第二个操作数用于确定移动位数。

    - “![Image00127.jpg](img/Image00127.jpeg)”：位逻辑 `NOT`（非）运算符接收一个数字并切换所有位的状态（1 变
    0，0 变 1）。


    注意：机器使用寄存器和缓冲区来存储用于计算的位。寄存器就是一个存储数组，每个位在数组中都有自己的位置。如果你将这些数据流看作一个数组，将有助于你理解任何位运算符，特别是移位运算符。


    让我们写一个位运算例程程序。首先，我们需要创建一个位寄存器并研究位流。这需要 `<bitset>` 库中的 `bitset<x>()` 函数。它允许你打印长度为
