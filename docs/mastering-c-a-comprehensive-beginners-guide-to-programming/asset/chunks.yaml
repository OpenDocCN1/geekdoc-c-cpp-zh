    | `++` | 一元 `operator`，用于将 `integer` 的 `value` 增加 `1`。该 `unary` 运算符通常用于增加 `loop`
    中的 `variable`。 | 一元运算符 |

    | `--` | 一元 `operator`，用于减少 `loop` 中的 `variable`。该 `unary` 运算符通常用于减少 `loop` 中的
    `variable`。 | 一元运算符 |

    | `-` | 二元算术 `operator`，从另一个操作数中减去一个。 | 算术运算符 |

    | `-` | 一元负 `operator`，用于更改 `variable` 或参数的 `sign`。对 `negative` 的 `integer` 执行
    `unary-minus-operation` 将使其转变为 `positive`，反之亦然。 | 一元运算符 |

    | `-=` | 用于结合 `-` 和 `=` `operators` 的原子减 `subtraction`。该运算符首先将左侧 `variable` 的当前
    `value` 减去右侧的 `value`，然后将 `result` 赋值给左侧的 `variable`。例如，`x-=y` 是 `x=x-y` 的简写，无需使用单独的
    `arithmetic` `operator`。 | 赋值运算符 |

    | `!` | 二元逻辑“非” `operator`，如果考虑的 `conditions` 不满足，则返回 `Boolean true`。如果 `conditions`
    之一为 `true`，则返回 `Boolean false`。 | 逻辑运算符 |

    | `!` | NOT `operator` 用于反转操作数的 `Boolean logical state`。例如，如果 `variable` `x` 的
    `Boolean` `value` 为 `false`，则 `!x` 为 `true`。 | 一元运算符 |

    | `!=` | “不等于” `operator` 检查两个给定的 `operands` 是否相等。然而，如果 `operands` 不相等则返回 `Boolean
    true`，如果 `operands` 相等则返回 `false`。 | 关系运算符 |

    | `*` | 乘两个 `operands` 的二元 `operator`。操作数的顺序不重要。 | 算术运算符 |

    | `*=` | 原子乘法运算符，用于结合 `*` 和 `=` `operators`。该运算符首先将左侧 `variable` 的当前 `value` 乘以右侧的
    `value`，然后将 `result` 赋值给左侧的 `variable`。例如，`x*=y` 是 `x=x*y` 的简写，无需使用单独的 `arithmetic`
    `operator`。 | 赋值运算符 |

    | `/` | 二元除法“正斜杠” `operator`，将第一个 `operand` 除以第二个。 | 算术运算符 |

    | `/=` | 原子除法 `operator` 是 `/` 和 `=` `operators` 的组合。该运算符首先将左侧 `variable` 的当前
    `value` 除以右侧的 `value`，然后将 `result` 赋值给左侧的 `variable`。例如，`x/=y` 是 `x=x/y` 的简写，无需使用单独的
    `arithmetic` `operator`。 | 赋值运算符 |

    | `\?` | 用于问号的转义序列。 | 使用转义序列 |

    | `\''` | 用于单引号的转义序列。 | 使用转义序列 |

    | `\"` | 用于双引号的转义序列。 | 使用转义序列 |

    | `\\` | 用于反斜线的转义序列。 | 使用转义序列 |

    | `\f` | 代表“换页”，用于跳转到下一“page”。 | 使用转义序列 |

    | `\n` | 代表“换行”，用于跳转到下一行。 | 使用转义序列 |

    | `\t` | 代表“水平制表符”，水平添加 5 个空格。 | 使用转义序列 |

    | `\v` | 代表“垂直制表符”，用于垂直语言中的间距。 | 使用转义序列 |

    | `&` | 用于获取 `variable` 地址的一元 `operator`。 | 一元运算符 |

    | `&` | 位 `AND` `operator`，取两个 `operands` 并对它们的每个位进行 `AND` 操作。 | 位运算运算符 |

    | `&&` | 二元逻辑“与” `operator`，当 `conditions` 满足时返回 `Boolean true`。否则，返回 `false`。
    | 逻辑运算符 |

    | `%` | 二元取模 `operator`，返回第一个 `operand` 除以第二个后的余数。 | 算术运算符 |

    | `^` | 位 `XOR` `operator`，取两个 `operands` 并对它们的每个位进行 `XOR` 操作。如果两个位中任一为不同，则 `XOR`
    的结果为 1。 | 位运算运算符 |

    | `+=` | 原子加法运算符，用于结合 `+` 和 `=` `operators`。它将左侧 `variable` 的当前 `value` 加上右侧的
    `value`并将 `result` 赋值给该 `variable`。例如，`x+=y` 是 `x=x+y` 的简写。 | 赋值运算符 |

    | `<` | “小于” `operator` 检查第一个 `operand` 是否小于第二个。如果是，则返回 `true`。否则，返回 `false`。
    | 关系运算符 |

    | `<<` | 左移运算符，取两个 `numbers` 并移动第一个 `operand` 的位。第二个 `operand` 用于确定位数。 | 位运算运算符
    |

    | `<=` | “小于等于” `operator` 检查第一个 `operand` 是否小于或等于第二个。如果是，则返回 `true`。否则，返回 `false`。
    | 关系运算符 |

    | `=` | 赋值运算符，将右侧的 `value` 赋值给左侧的 `variable`。 | 赋值运算符 |

    | `==` | “等于” `operator` 检查两个 `operands` 是否相等。如果 `operands` 相等则返回 `true`，否则返回
    `false`。 | 关系运算符 |

    | `>` | “大于” `operator` 检查第一个 `operand` 是否大于第二个。如果是，则返回 `true`。否则，返回 `false`。
    | 关系运算符 |

    | `>=` | “大于等于” `operator` 检查第一个 `operand` 是否大于或等于第二个。如果是，则返回 `true`。否则，返回 `false`。
    | 关系运算符 |

    | `>>` | 右移运算符，取两个 `numbers` 并移动第一个 `operand` 的位。第二个 `operand` 用于确定位数。 | 位运算运算符
    |

    | `|` | 位 `OR` 运算符，取两个 `operands` 并对它们的每个位进行 `OR` 操作。如果两个位中任一为 1，则 `OR` 的结果为 1。
    | 位运算运算符 |

    | `||` | 二元逻辑“或” `operator`，当一个（或两个）`conditions` 满足时返回 `Boolean true`。否则，返回 `false`。
    | 逻辑运算符 |


