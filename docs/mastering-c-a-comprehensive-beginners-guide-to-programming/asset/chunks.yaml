    Because Linux is an operating system that uses a console interface, it will be
    strange to beginners or anyone who is used to Windows or Mac. This is because
    users are often used to a GUI. The GUI-lessness of Linux allows more computing
    power to be freed for programming – as a GUI takes some computing power to produce
    and maintain. This is why many servers and other programming environments have
    console interfaces. Also, many of them use Linux distributions.


    A Linux Distribution (distro) is an operating system made from Linux kernel-based
    software collection and package management system for installing additional software.


    The following are instructions for installing and initializing a compiler. This
    will be for Ubuntu, a popular Linux distro for beginners. These installations
    will be similar in any Linux distro you will be using.


    Note: There are many distributions of Linux that provide a GUI based desktop experience
    that any users love. Most of these are open-source and free to download and install.
    You can explore these distros and create console interfaces to practice on. One
    free distro to consider is CentOS, which is based on Red Hat for server management.
    Red Hat Enterprise Linux (RHEL) is used in many server management setups and is
    not free. However, CentOS uses many of its components and is an excellent distro
    for preparing to work in Red Hat environments.


    In this example, we will use the GNU Collection Compiler on Linux. The GNU Collection
    Compiler is a Linux-based compiler that supports C++ and other various languages
    alike Fortran, `ada`, and Java ("GCC 7 Release Series—Changes, New Features, and
    Prefixes—GNU Project—Free Software Foundation (FSF)," etc.). To install GNU GCC,
    follow these steps:


    ### 1. In the console, enter the following commands:


    Check first if there is a version already installed on your machine by entering
    this command:


    ```bash

    gcc -v

    ```


    ![image45.png](images/Image00014.jpeg)


    #### 1. Check for GNU GCC in Ubuntu Console


    You should check your system for a copy of the GCC. This screenshot features a
    system with GCC already installed. After using the command, if there is no copy
    of GCC in your system, it will be missing this line. If there is a copy, it will
    have a similar line. Most likely, your version will be more recent.


    The following commands will install GCC on your system:


    ```bash

    sudo apt-get update

    sudo apt-get install gcc

    ```


    ![image19.png](images/Image00015.jpeg)


    #### 1. Install GNU GCC in Ubuntu Console


    In the screenshot, GNU GCC is already present. Running the highlighted command
    will install the GNU GCC on your system if it isn’t there (Patel, 2014). The console
    will prompt you to type "Y" to begin the installation. You are also offered package
    management features like the ability of the terminal to inform you of outdated
    or unnecessary packages. It will also suggest commands that will make your system
    more efficient. This explains the popularity of Linux with programmers; although
    it allows them to troubleshoot with ease, gives them more control, and is easy
    to navigate compared to GUI. This is because programmers are more likely to remember
    a line of code than where something resides in a GUI.


    The following command will install all libraries required to compile and eventually
    run C++:


    ```bash

    sudo apt-get install build-essential

    ```


    ![image39.png](images/Image00016.jpeg)


    #### 1. Install GNU GCC in Ubuntu


    This screenshot shows a system with build-essential libraries installed and inputting
    the highlighted command. Just as installing GCC, after using the command and finding
    no copy of build-essential in your system, it will prompt you to install "Y" and
    the terminal will install libraries.


    #### 1. Check the installation with the following command:


    ```bash

    g++ --version

    ```


    If all went well it will tell you what version of GCC is installed. Because Linux
    has a built-in text editor, you will have to use the following command to access
    the GUI for the text editor:


    ```bash

    gedit

    ```


    You will be free to write your program as you see it. Remember to save the programs
    with a ".cpp" extension so that they will be compiled correctly.


    ![image52.png](images/Image00017.jpeg)


    gedit Ubuntu This screenshot features Linux’s built-in text editor, gedit is a
    Linux programming text editor utility that has syntax highlighting and tabbed
    features for a diverse array of programming languages. Ensure to have “C++” selected
    from the highlighted dropdown menu. You can save your program file in the GUI
    by clicking the “save” button. Ensure to list which directory you have your file
    saved as, as you will have to point the compiler to that directory to compile
    and run the code.


    To test and run your code, you must follow these instructions:


    #### 1. Lead the terminal to the files directory


    To do this, use this command. Enter the directory repeatedly until the `.cpp`
    file is revealed:


    ```bash

    ls

    ```


    #### 1. Compile and test the program file


    Use these commands to do so:


    ![Image00018.jpg](images/Image00018.jpeg)


    If there are any errors this command will tell you which line contains the error
    just like you would expect from an IDE. Then you can open your program file through
    “gedit [filename.cpp]” and fix the line of code.


    #### 1. Run the program file


    The compiler will create an executable file called `test` that will run the program.
    You can execute it by entering `./test` in the terminal.


    ```bash

    ./test

    ```


    ![image32.png](images/Image00019.jpeg)


    Testing, Compiling and Running a .cpp file in Ubuntu This screenshot features
    the terminal testing, compiling, and running the example code written in gedit
    (Running AC, C++ Programs in Linux, Ubuntu 16.04 (Ubuntu Tutorial for beginners),
    etc.).


    Linux distros are verbose console-based systems and most of them can handle programming
    in any language through the terminal. Learning to work in the Linux environment
    is beneficial as it exposes you to server-side programming.

