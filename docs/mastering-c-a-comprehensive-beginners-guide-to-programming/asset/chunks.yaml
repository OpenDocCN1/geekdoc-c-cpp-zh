    ## 引言


    本书适合对后端编程感兴趣的初学者程序员。尽管 C++ 有时被描绘为过去的产物，但这种语言仍然与我们并肩存在，并持续支持着我们今天使用的一些顶级技术——更不用说它在游戏世界的巨大影响了。它的强大和多功能使其持续成为我们时代最重要的语言之一。它永远不会消失，学习它将开宽我们的视野。因为开销很小，C++
    经常被数据的后端语言。Spotify、Adobe 和 Amazon 等公司使用 C++ 支持它们的后端，你很快就会知道为什么。许多强大的游戏引擎允许程序员从零构建游戏并有效地渲染内容。Unity
    和 Unreal Engine 就是运行在 C++ 之上的游戏引擎示例。C++ 是一种美丽且高效的语言，因为它与硬件的性能比例极佳。这就是为什么学习者热爱它的原因。


    在书中，我们将涵盖以下主题：


    * 编程术语与原理

    * 配置 C++ 环境

    * 入门：语法、类型与变量

    * C++ 的威力：操作、循环、Switch 与决策

    * 创建自定义函数


    你还可以在书末找到一个实用的词汇表，这样当你遇到困难时就可以把这本书作为参考。


    # 第一章：配置 C++ 开发环境


    从最基础的来说，编程是用代码编写一系列机器可以理解的指令列表。代码的结果是可执行文件。这些文件带有扩展名，告诉编译器使用的是什么语言。这些扩展名是你经常在文件末看到的后缀，如
    `.js`、`.cpp` 或 `.hpp`。


    要编写代码并保存可执行文件，你需要：


    1. 一个文本编辑器：这将允许你编写和编辑代码。

    2. 一个语言编译器：该程序将你编写的代码翻译成你的计算机可以理解并遵循的机器语言。


    所有的编程语言都像这样，但 HTML、CSS 和 JavaScript 除外——这些程序由浏览器（.html）解释并执行。这意味着像 JavaScript
    这样的浏览器语言是基于软件的，而 C++ 是经过编译直接在你的机器上运行的，而不是在软件环境中。这意味着 C++ 是一种汇编语言。汇编语言是低级编程语言，需要编译器才能在机器上运行（Lithmee,
    2018）。在这种语境下，“低级”一词并不带有负面含义；它是一种描述性的，意味着这种语言更接近机器，或者与机器仅一步之遥。


    正如你可能猜到的，C++ 是一种可以在几乎任何地方运行的通用语言。这意味着可以通过几种不同的方式进行汇编和编译。这在很大程度上取决于你的操作系统以及你正在使用的创建工具。


    我们的 C++ 练习将在在线 IDE 上进行编译。IDE 代表集成开发环境（Integrated Development Environment），用于编辑和编译代码。你觉得这个描述听起来熟悉吗？是的，IDE
    是文本编辑器的一个示例，但与纯文本编辑器不同，它具有对编程过程关重要的额外功能。IDE 可以执行编译代码、调试代码、高亮代码、警告你语法错误等操作。


    | ![image44.png](img/Image00000.jpeg) |

    | GeeksforGeeks IDE：基于 Web 的程序编译器。此 IDE 可以在 [`ide.geeksforgeeks.org/`](https://ide.geeksforgeeks.org/)
    [https://ide.geeksforgeeks.org/] 找到，并支持多种编程语言。我们将专注于 C++。此 IDE 有许多编码工具：标签页工作区、一个输入框和一个代码管理器。该代码管理器包含了左侧高亮的两个按钮。这些代码管理器按钮允许你作为带有相应扩展名的文件下载和上传代码。此
    IDE 还允许你运行并生成一个保存结果的 URL。我们将使用这些生成的 URL 来管理我们的课程。 |


