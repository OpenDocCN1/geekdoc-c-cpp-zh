    * “`![Image00059.jpg](img/Image00059.jpeg)`”：存储带 15 位小数的数字。大小为 8 字节。

    * “`![Image00060.jpg](img/Image00060.jpeg)`”是“character”的缩写，无论大小写都存储单个字符。大小为 1
    字节。

    * “`![Image00062.jpg](img/Image00062.jpeg)`”是“Boolean”的缩写，存储具有 `true` 或 `false`
    状态的值。大小为 1 字节。


