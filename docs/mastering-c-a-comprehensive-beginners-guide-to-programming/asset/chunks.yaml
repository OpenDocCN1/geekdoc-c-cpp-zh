    # `if()`...else`


    到目前为止，我们在示例中使用了 `if()`...else` 函数。它们易于理解，且结构也非常直观。`if()`...else` 语句测试条件，并根据结果执行一个代码块或另一个。它们是两个独立语句的组合。


    你可以单独执行 `if()` 函数，但编译器期望一个 `else` 语句。`else` 语句包含随 `if()` 表达式的代码。没有 `if()` 语句，`else`
    语句永远无法执行。


    `else if()` 语句指定了另一个要测试的条件。它创建了一个嵌套 `if-else` 语句的链。如果你正在测试很多条件，最好使用 `switch`，我们将在下一节讨论。让我们制作第一个嵌套的
    `if-else` 语句。

