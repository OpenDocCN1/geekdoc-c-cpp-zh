    | Screenshot of "Hello World" in Code::Blocks. This program shows an error shows
    up in the build messages of the code. `Code::Blocks` highlights the error on line
    6. Given your C++ syntax from the earlier section, you should see how to repair
    the code. How can we repair the code? A Hint: Data and functions are supposed
    to show up in blue. |


    By the way, this program is very lightweight for the amount of work it allows
    you to do. `Code::Blocks` is available on Windows and Linux, but there is no Mac
    version.


    # Mac Xcode IDE Installation and Setup


    For Mac, you will need to get `Xcode`. It is a free IDE software development suite
    for macOS. You can get it on the Mac App Store. `Xcode` supports a variety of
    other languages like `Java`, `Python`, and `Ruby`.


    It is geared towards developing software for macOS operating systems; this can
    be for iOS for AppleTV, `watchOS` for Apple Watches, and `iPadOS` for iPad tablets
    ("What’s New in Xcode 9," etc.). `Xcode` offers a variety of software development
    kits (`SDKs`) for different macOS platforms to help programmers through Apple’s
    proprietary programming schemes. `SDKs` are a set of tools, provided by hardware
    and software vendors, used for developing applications for specific platforms
    ("What’s New in Xcode 9," etc.). `SDKs` allow developers to be fully integrated
    within a development community, like Apple’s or Android’s.


    Mac uses proprietary compilers that will only work with `Xcode`, so if you are
    on Mac you have a little choice but not to develop with `C++` using `Xcode`. You
    can download and install `Xcode` by following this link:


    [Xcode](https://apps.apple.com/us/app/xcode/id497799835?mt=12) [https://apps.apple.com/us/app/xcode/id497799835?mt=12]


    Once the file is downloaded and installed, open `Xcode` and click on the "Create
    a New Xcode Project" icon. Then select "New Project" in the initial window.


    | ![image12.png](images/Image00007.jpeg) | Initial Screen for Xcode: Select a
    New project. These screenshots feature `Xcode` build version 8.3.3 (Patel, 2017).
    Therefore, our examples might look different from a more up-to-date build. As
    of this writing, the most current version is A12.1, which mostly includes updates
    to the various macOS platform SDKs ("Xcode," etc.). Despite these differences,
    these screenshots will still help you orient yourself in the more current build.
    Our instruction will still yield results. |


    After you do this, a prompt window will appear that ask you to choose a template.
    This window will guide you through the rest of the setup. Select the macOS sections
    and go to the Application section; there, choose the Command Line Tool. It looks
    something like this:


    | ![image6.png](images/Image00008.jpeg) | 1. Project Selection Screen: macOS >
    Application > Command Line Tool. `Xcode` has many built-in code utilities for
    running programs on various Apple platforms. Therefore, to run a test program
    you would have to select macOS for it to run your program. Further, to access
    assembly language software development needed for `C++`, you would have to use
    `Xcode`’s command line. This command line can handle Objective-C and `C` as well.
    |


    After you select a template, the guide will present options for the command line
    tool. Here you can name the project, add your organization, use an identifier,
    and select a programming language.


    | ![image49.png](images/Image00009.jpeg) | 2. Command Line Tool Options: Language
    > Select C++. `Xcode`’s command line can handle Apple’s proprietary languages
    like Swift. This program can run alongside C-based languages compilers. Swift
    is selected by default. |


    In the same window, you will be required to add an organization. Remember that
    `Xcode`’s command line is a template for proprietary macOS operating systems,
    so the identifier is used to create a unique idea for your program at Apple: The
    Developer Website and Cloud Container, portal to the App store. This will stream
    your app into a proprietary macOS framework. | ![image5.png](images/Image0010.jpeg)
    | 3. Command Line Tool Options: Identifier > "cpp". The identifier is a naming
    convention that helps programmers integrate their projects into Apple’s software
    development scheme. Here, we are using "cpp" as our identifier, which generates
    `cpp.HelloWorld` as our identifier. Once we indicate it, the guide allows us to
    proceed to the next step. |


    Now, save your project in a directory of your choice. On the left-hand pane, `Xcode`
    will be able to open the file. You will have to select `main.cpp` to access the
    global `C++` file for your program in `Xcode`. If you desire, you can upload `.cpp`
    files into the directory and edit them. | ![image40.png](images/Image0011.jpeg)
    | 3. Xcode Command Line Tool: "main.cpp". This screenshot features the IDE style
    `Xcode` command line tool workspace. It has ![Image0012.jpg](images/Image0012.jpeg)
    opened in the text editor (Patel, 2017). |


    Once you have written some code and you want to run it, you select product and
    click on Run. Also, you can run and build the program by selecting the button.
    | ![image3](images/Image0013.jpeg) | 4. Xcode Command Line Tool: "Hello World"
    Build and Run. Similar to the `Code::Blocks` IDE, you will also have to build
    and run your program. This screenshot also features the results of "Hello World"
    and the return value (Patel, 2017). |


    If you are a programmer who sees themselves working with Apple devices, working
    and practicing in `Xcode` is a good investment. For instance, Apple has a healthy
    share of the market with a wide variety of consumer goods and services like streaming
    services and devices. With that said, you should keep in mind that `C++` is used
    mostly as a server-side language. Server-side programming is code that controls
    how content is delivered to dynamic website like YouTube. Most server-side programming
    is done on Linux machines.


    # Linux Compiler Installation


    Linux is a console-based operation system, so it does not need a text editor.
    Instead, we will focus on installing and setting up a programming compiler. Mac
    and Windows automatically initialize a compiler within the IDE, but on Linux,
    a more hands-on approach is required. You will be required to execute a backend
    initialization. It might seem like a lot of work, but in the great scheme of things,
    it allows those working with Linux to have full control of the development procedure
    and unlock more computing power.

