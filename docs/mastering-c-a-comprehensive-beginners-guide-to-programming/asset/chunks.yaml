    此程序展示了增量计数器是如何工作的。为了让循环运行，数字必须从 `1` 开始而不是 `0`。大多数人习惯了数字这种工作方式。为了实现这一点，我们将计数器初始化为
    `1`。然而，如果我们把条件设置为 `10`，它将带给我们 `9` 次。若要输出 `10` 次，我们必须将数字增加到 `11`。


    控制循环的另一个示例是 `for()` 函数；它需要三个表达式作为输入：


    1. 一个初始化表达式，用于声明数据类型和变量。该变量可以是计数器，也可以是索引变量。

    2. 一个产生布尔值的测试表达式。![Image00179.jpg](img/Image00179.jpeg) 如果条件为真，则 `for` 循环将继续循环其指定的代码块。

    3. 一个更新表达式，用于增加计数器或索引变量。


