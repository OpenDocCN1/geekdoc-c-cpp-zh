  trans: '

    有很多编程环境和文本编辑器可以支持 C++。有些环境包含多个版本的 C++。在编写本文时，最新的 C++ 版本是 C++17，但支持得最好的是 C++14，它是
    C++ 的演进版本，具有更易于理解的语言特性。C++14 比其前身版本更符合人类直觉，你可以预计这种趋势将会持续下去。最旧且广泛提供的 C++ 版本是 C++11。


    我鼓励你搭建一个本地 IDE 并在上面工作。它将让你成长得更快，并适应现实场景。我们提到过适用于 Microsoft 的 `Code::Blocks` 和适用于
    Mac 的 `Xcode`。如果你使用的是 Linux，可以使用跨越所有发行版的标准选项。Linux 是一种基于控制台的环境，深受软件开发者的青睐，因为控制台环境内置了许多直接与程序交互的强大功能。


    许多发行版提供了基于 GUI 的桌面，这对于许多用户来说更优优。它们大多数是开源的，可以免费下载和安装。我们非常推荐 `CentOS`，这是一种用于服务器管理的免费
    Linux 发行版。`CentOS` 使用了许多红帽 Linux (RHEL) 的组件。它是准备在红帽服务器管理环境中工作的最佳发行版。


    # 编码最佳实践：学习的主权与协作


    在我们共同相处的时间里，我们看到了许多软件开发的技巧和最佳实践。在第一章中，我们讨论了程序如何用尽可能少的代码来完成任务。坦率地说，随着 C++ 的每一个新版本，增加了更多实现这一目标的方法。大多数初级编程课程教授的是较旧、效率较低的方法，来实现常见的编程任务，如解析数组、条件语句和调用函数。你会发现这些技术大部分在实际编程场景中从未被使用。大多数初级课程侧重于让初学者牢牢掌握基础——你的知识基础往往与你如何进步同样重要。随着你的成长，你将发现用代码解决问题有更高效的方法，但这只有在实践和学习的情况下才能实现。


    如果你想成为一名更优秀的程序员，就必须掌握自己的学习主权。学习开发前的工具，例如 `algorithms`。这核心在于学习如何解决问题。你还有其他可以尝试的前开发工具，比如
    `diagramming`。绘图对于视觉型学习者非常有帮助。这些工具对程序员的成长都是非常有益的；你选择哪一个并不重要，只要你利用了前开发工具即可。


    回到 `algorithms`，更详细的 `algorithms` 将解释输入、输出和其他数据所需的各种数据类型。`algorithms` 的优势在于你可以将它们作为简写。你还可以对代码进行注释和管理。这些习惯将帮助你的代码对你的团队成员来说保持有序且连贯。所有这些实践将有助于增强你看待和思考程序的方式。


    软件开发者在团队中工作，几个人同时处理同一段代码。在这样的情况下，注释代码的重要性变得越来越显而易见。


    此外，与他人协作也会加速你的成长。与他人一起编码时，你可以从他们的经验和认可中学习。正如我们所说的，C++ 拥有各种库对象、语句和其他工具。它是一种丰富的语言，因为实现相同的事情有许多方法。但最终，所有的编程和开发都是创造性的活动。与他人协作将增加你的编程能力，你也会发现如何解决问题的见解。你应该始终记住，每个人都能贡献力量，而他们贡献的内容深受其经验的影响。因此，即使你是
    C++ 新手，你仍然拥有独特的解决经验和方法，这本身对任何团队都是价值的，特别是当你学会很好地交流你的想法时。我强烈建议你使用注释来帮助你清晰地交流。


    除了注释之外，让代码尽可能整洁也是良好的做法。我们演示了如何对代码行进行注释以防止中断。在练习中，当你破坏代码到无法修复时，你可以随时从保存的 IDE 重新开始，或者简单地刷新浏览器重新开始（这取决于状态）。只在保存代码时生成
    URL，而不是在开发过程中生成。


    我们还强调了代码结构的重要性。例如，我们讨论了声明和定义函数的重要性：最佳实践是在顶部声明函数，并在 `main()` 函数之后定义它们。这与声明整数类似。这些技术确保你在开始时拥有一个函数、变量和对象的清单。它的作用像索引，可以帮助你避免定义错误。


    格式化你的代码并删除不必要的行可以减少开发过程中出现错误的可能性。当你做出更改时，应该始终更新注释。未格式化的代码不会影响性能，影响的是代码逻辑。格式化代码是一种礼貌，而不是为了方便你自己。你团队中的其他程序员能够实现你的代码，甚至改进它，并且他们会留下注释。

