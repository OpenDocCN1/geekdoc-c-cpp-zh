  trans: "\n\n| ![image47.png](img/Image0017.jpeg) | 数组大小报告程序 |\n\n这张截图是我们的数组大小报告程序。我们鼓励你将你的结果与我们的进行比较。为了完整学习，可以通过此\
    \ URL 访问我们保存的工作空间：[A](https://ide.geeksforgeeks.org/HwpcLYB4P0) [https://ide.geeksforgeeks.org/HwpcLYB4P0)。\n\
    \n这是一个关于两个一元运算符的很好的例子：`sizeof()` 和地址指针 `&`。我们用于打印数组的 `for(){}` 循环被称为 `copy` 构造函数调用。`Constructor`\
    \ 拷贝调用由一个带有索引变量的 `for(){}` 循环、一个 `offsetof` 运算符以及一个带有索引的容器对象组成。`copy` 构造函数通过使用\
    \ `offsetof` 指针自动推导出 `[size of arr]` 并打印其内容，从而设置 `[0]: arr[the size of arr]`。简单来说，`copy`\
    \ 构造函数使用 `offsetof` 来减小程序的大小。\n\n`sizeof()` 运算符是一个客观操作，它使用单个操作数即 `arr` 数组对象。它们都有优缺点。`sizeof()`\
    \ 运算符使用一个操作数，在没有晦涩内存寄存器的情况下更容易识别。该调用组合必须使用额外的对象 `(` 来打印数组，但可以使用更少的增量运算符完成。我们将在下一章更详细地讨论\
    \ C++ 的循环和决策功能。现在，让我们关注三元运算符。\n\n# 三元运算符\n\nC++ 只有一个三元运算符。三元运算符，也称为条件运算符，接受 3\
    \ 个或更多操作数——它们是基于布尔逻辑的运算符。结果始终取决于第一个表达式是否为真，如果是，则将评估第二个；如果第一个表达式为假，则将评估第三个表达式。如果你记得我们在关系程序例程中的\
    \ `if...else` 语句，它包含三个部分：函数评估的初始表达式、当初始表达式为真时评估的表达式，以及当初始表达式不为真时评估的 `else` 语句。条件运算符的组件与\
    \ `if...else` 语句相同，它们只是更紧凑。\n\n让我们编写一个程序来阐明这些相似之处：\n\n1. 打开一个新的 IDE C++ 工作空间。\n\
    2. 要使用条件运算符，你必须调用 `![Image00173.jpg](img/Image00173.jpeg)` 库。\n3. 打印条件运算符的解释。\n\
    \n该程序将使用两种方法选取最大的值：条件运算符和 `![Image00118.jpg](img/Image00118.jpeg)` 语句。我们期望结果为\
    \ 5。\n\n1. 声明变量并执行条件运算符：\n```cpp\nint arsize=sizeof(arr)/sizeof(arr[0]);\n```\n\
    2. 打印 `![Image00118.jpg](img/Image00118.jpeg)` ![Image00174.jpg](img/Image00174.jpeg)\
    \ 的解释，然后打印 2\n然后打印 5。\n\n| ![image43.png](img/Image00176.jpeg) | 条件操作演示 |\n\n\
    这张截图是我们的条件操作演示。这个程序没有实际功能。但是，对于我们的目的来说，它确实展示了条件运算符与 `![Image00118.jpg](img/Image0018.jpeg)`\
    \ 语句之间的相似结构。为了完整学习，我们建议通过此 URL 访问我们保存的工作空间的副本：[A](https://ide.geeksforgeeks.org/9kJBAqt)\
    \ [https://ide.geeksforgeeks.org/9kJBAqt] [`ide.geeksforgeeks.org/9kJBAqt)。\n\n\
    在本章中，我们查看了 3 类运算符：一元、二元三元。正如你所见，这些运算符允许程序员应用 C++ 的强大特性。例如，二元运算符允许机器通过更改函数做出逻辑决策、计算值并控制过程。一元函数有助于收缩和简化复杂的代码。三元运算符允许代码更加简洁。它们都是\
    \ C++ 中决策和切换的核心。\n\n# 第 5 章：决策\n\n我们将讨论决策函数；这些函数类似于 `if-else` 循环。编程在很大程度上依赖于决策，而决策是由涉及我们见过的运算符的逻辑表达式提供的。决策是指根据程序员所选的标准做出判断的能力。在我们的大小练习中，我们在构造函数中使用\
    \ `for` 循环来填充数组，并打印所有索引。一元运算符 `offsetof` 配合 `auto` 数据类型允许在不使用额外的 `for` 循环的情况下实现\
    \ `for` 循环。如果你从未有过自己初始化和实现循环的经验，拷贝的简单性并不明显。\n\n# 循环\n\n程序员花费大量时间通过脚本和例程自动执行单调、重复的任务。允许脚本和例程实现这一点的是循环。正如名称所示，只要满足特定条件，循环就会重复相同的指令。循环通常用于通过索引（如数组和向量）遍历聚合对象。例如，你可能会写一个循环，不断搜索数组直到找到特定项目。循环有两种类型：入口控制循环和退出控制循环。\n\
    \n在我们的一元算术示例中，我们有一个带有 `counter` 的 `while` 循环。`counter` 是一个任意变量，配合一元运算符用于递增指定的表达式。它是入口控制循环的示例——在执行代码之前测试条件。让我们将该示例修改为\
    \ `while` 循环以探索它的组件。我们将用它打印 10 次 \"Hello World\"。遵循以下指令：\n\n1. 打开以下 IDE C++ 工作空间：[A`](https://ide.geeksforgeeks.org/MgMUtZdlpb)\
    \ [https://ide.geeksforgeeks.org/MgMUtZdlpb] `ide.geeksforgeeks.org/MgMUtZdlpb)。\n\
    2. 打印程序的解释。该程序将编号并打印 10 行--\n   1. 将条件测试改为 `![Image00177.jpg``。   2. 带编号地打印 10\
    \ 次 \"Hello World\"。| ![image53.png](img/Image00178.jpeg) | While 循环演示 |\n\n这张截图是我们的\
    \ `while` 循环演示。你可以通过此 URL 访问我们保存的工作空间的副本：[A](https://ide.geeksforgeeks.org/9kJBAqt)\
    \ [https://ide.geeksforgeeks.org/9kJBAqt)。\n\n"
- fmt: "\nThis program shows how incremental counters work. For a loop to work, a\
    \ number must start with `1`, not `0`. Most people are used to numbers working\
    \ that way. To do this, we initialize the counter at `1`. Yet if we set the condition\
    \ to `10` it will give us `9` printouts. To get `10` we have to increase the number\
    \ to `11`.\n\nAnother example of a controlled loop is the `for()` loop function;\
    \ it requires three expressions as inputs: \n\n1. An initialization expression\
