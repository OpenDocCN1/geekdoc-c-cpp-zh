    \ 。\n\n## 省略命名空间\n\n我们已经讨论过使用 `using namespace` 语句。我们说过它有助于全局声明字符串，但对于像“Hello\
    \ World”这样的小程序来说，这并不那么重要。对于使用多个函数的较大型程序，使用该语句单独声明每个字符串是一个良好的做法。这可以节省编译器的内存空间，否则你会发现编译器被不必要地阻塞，必须加载整个字符串命名空间库来打印代码。单独声明每个字符串可能会让你的代码更冗长，但它会减少编译开销并聚焦你的指令。`std`\
    \ 命名空间包含多个对象和定义，这使得计算机难以找到操作和定义字符串的适当方法。当你有会被多个程序调用的函数时，命名空间约定非常重要。因此，不必要地将其放在那里可能会导致你的函数定义不当，并引起它们之间的识别错误。\n\
