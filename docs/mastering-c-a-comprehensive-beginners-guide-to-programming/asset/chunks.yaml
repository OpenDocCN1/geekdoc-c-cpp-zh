    These binary assignment operators combine assignments and arithmetic functions.
    They work well when controlling loops and conditional statements, too. Atomic
    assignment operators are closely related to unary arithmetic operators. Both are
    frequently used to control loops. Let’s take a look at unary operations.


    # Unary Operations


    Before we discuss unary operations, let’s look at code that uses them.


    | `![image5.png](images/Image00161.jpeg)` |

    | While Loop featuring A Unary Operator This screenshot is of a simple while loop
    that prints the value of the counter, `![Image00162.jpg](images/Image00162.jpeg)`
    will cause an error as the while loop would not be able to advance. We will talk
    about loops extensively in the next [A](https://docs.google.com/document/d/1rfTukE008PScFE0mgrN2m-UKMEAv4Y8VYrXHB3BjvOU/edit)
    [decision making chapter](https://docs.google.com/document/d/1rfTukE008PScFE0mgrN2m-UKMEAv4Y8VYrXHB3BjvOU/edit)
    [A](https://docs.google.com/document/d/1rfTukE008PScFE0mgrN2m-UKMEAv4Y8VYrXHB3BjvOU/edit).
    To study it fully, you can access it on our saved workspace using this URL: [A](https://ide.geeksforgeeks.org/MgMUtZdlpb)](https://ide.geeksforgeeks.org/MgMUtZdlpb)](https://ide.geeksforgeeks.org/MgMUtZdlpb)
    |


    The `i=i+1` is the same as `i++`. Using the unary form makes the code neat because
    it precludes the `+` arithmetic operator and the `=` assignment operator. We can
    also use an atomic addition operator to complete the code: `i+=1` is the same
    as `i++`. But a format Alike that that would require the compiler to store and
    operate on an additional operand. Unary operators are there to simplify code by
    only having one operand. Remember, unary operators are those operators that use
    one operand. Here are some of the other examples of unary operators (Kumar, 2017):


    “`![Image00163.jpg](images/Image00163.jpeg)`”: Increment operator used to increase
    the value of an integer by 1. It can increase the value immediately or after the
    expression.


    “`![Image00164.jpg](images/Image00164.jpeg)`”: Decrement operator used to decrease
    the value of an integer by 1. Similar to increment, it can decrease immediately
    or after the expression. “`![Image00189.jpg](images/Image00189.jpeg)`”: Unary
    minus that is used to change the sign of a variable. It can make a negative integer
    positive. For example, `![Image00165.jpg](images/Image00165.jpeg)`: Address operator
    that is used to point to the address of a variable.


    | `![image2.png](images/Image00166.jpeg)` |

    | Unary Operator with Post- and Pre- This screenshot is of our assignment routine.
    The program operates on buffer and while calculates, stores the value. Comparing
    A buffer, the post-operation delays the value; pre-operations change the value
    immediately.




    On top of all, we have the `sizeof()` operator. It looks like a function but it
    is categorized as an operator. It returns the size of an object. Recall our conversation
    about streams being often divided into groups of bytes. One byte is a single 8-bit
    stream that can present 255 numbers. In our bitwise routine, our registers were
    1 byte long, that was because we were working with numbers that were less than
    255.

