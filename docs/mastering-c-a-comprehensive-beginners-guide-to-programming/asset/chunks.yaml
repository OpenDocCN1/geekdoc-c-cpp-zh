    `A![Image00156.jpg](images/Image00156.jpeg)![Image00157.jpg](images/Image00157.jpeg)`
    without having to use a separate arithmetic operator.


    Note: There are also bitwise atomic assignment operations: “`![Image00158.jpg](images/Image00158.jpeg)`”.
    We will focus on the arithmetic-atomic functions for now.


    Let’s create an assignment operator routine program to see how these assignment
    operations work. Follow these steps:


    1. Open A New AIDE workspace

    2. Declare and initialize our variable `int A=10;`

    3. Print An explanation of the program and the starting value Note: When making
