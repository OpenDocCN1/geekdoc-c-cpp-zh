- fmt: '

    “Hello World” is every programming language’s a beginner’s project; its aim is
    to show the learner the basic syntax of a program and how functions work. As you
    learn more languages, you will write many “Hello World” programs. In the previous
    section, we used it to explore topics like algorithms, syntax, and C++ programming
    environments. In this section, we will go further: we will manipulate the code.


    C++ uses the `cout` object from the `iostream` library. An object is a thing that
    a computer uses to manage data. In our example, `cout` was used to tell the compiler
    to print “Hello World” with the `<<` operator. Don’t freak out; we will discuss
    operators and objects in later chapters. For now, it’s enough to understand that
    the compiler reads `cout` as a specific instruction because that instruction is
    defined in the `iostream` library that we declared.


    Now, let’s look at “Hello World” and the `cout` object by changing the printout.
    Find the original code here so you can use it as a reference: [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [https://ide.geeksforgeeks.org/eA8ZMEKiDO](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO)


    | ![image16.png](images/Image00027.jpeg) | A |

    | “Hello World” program in GeeksforGeeks IDE. This screenshot is the successful
    run of “Hello World” in split-screen mode. As we begin to use the IDE for coding
    exercises, note the input and output boxes. While there are no inputs for this
    program, you will input data into the top box labeled “Input Goes Here...” when
    prompted by the program in the output area below. You can access this program
    in the saved IDE here: [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO) [https://ide.geeksforgeeks.org/eA8ZMEKiDO](https://ide.geeksforgeeks.org/eA8ZMEKiDO)
    [A](https://ide.geeksforgeeks.org/eA8ZMEKiDO). You can also view a copy of the
    code in the index. |


    ## Using `cout`


    The `cout` object uses the `<<` operator to print values and text, and we can
    have as many of them as we like. Using the IDE in your browser, change the code
    to print out:


    ```cpp

    Hello World

    I am learning C++

    ```


    Like this:


    | ![image30.png](images/Image00028.jpeg) | Adding `cout` objects. This screenshot
    is the successful run of our edited “Hello World” program in split-screen mode.
    While the program ran without any errors, it didn’t produce the result we wanted.
    Observing the output, the printed text is missing a new line. We will have to
    instruct the compiler to add a new line to get the desired result. | Adding lines
    can be done in several ways: we can add delimiters within the strings or use another
    manipulator object from the `iostream` library.


    ## Using Escape Sequences


    Although it might be tempting to write a string within `cout` and enter a line,
    it will not work. It will break the code and it will not run. Don’t believe me?
    Test it! You can add a new line by using an escape sequence. Escape sequences
    are used in many instances where you need to introduce special characters within
    strings and character streams. It can also add lines, like so:


    | ![image23.png](images/Image00029.jpeg) | Using in-string escape sequences to
    delimit and manipulate the output. This screenshot is the successful run of our
    edited “Hello World” program in split-screen mode. Using ![Image00030.jpg](images/Image0030.jpg),
    we were able to get our expected output. |


    As you look at the code, you can see that doubles are used. So, if you want to
    add double quotes in a string, you will have to use an escape sequence so that
    the compiler knows it is not part of the code avoiding unforeseen errors or bugs.
    This is why escape sequences matter. Here is a list of many instances where they
    can be used (Escape sequences—Cppreference.com.):


    - `\''`: single quotes

    - `\"`: double quotes

    - `\n`: backticks

    - `\?`: question marks

    - `\\`: backslashes

    - `\t`: tabs

    - `\r`: carriage return

    - `\a`: horizontal tab

    - `\v`: vertical tab


    Note: If you decide to try different escape sequences as text delimiters, be sure
    to only use the ones shown. A button to save your work at another URL to return
    later. To return to our exercise, you can use our saved IDE workspace URL ([A](https://ide.geeksforgeeks.org/PsgSHE4h)
    [https://ide.geeksforgeeks.org/PsgSHE4h](https://ide.geeksforgeeks.org/PsgSHE4h)
    [A](https://ide.geeksforgeeks.org/PsgSHE4h)). You can also access this code in
    the index.


    ## Using `endl`: Input/Output Manipulators


    Like we have said, programming languages are as versatile as a human language.
    You can express one instruction in many ways, and terminating a string is no exception.
    The difference between an escape sequence and `endl` is that `endl` flushes and
    refreshes the buffer used to store the string. Programmers use `endl` to clear
    memory after printing a lot of text. You can see why this is useful in memory
    management. `endl` is an example of an input/output manipulator. Input/Output
    Manipulators are functions that allow you to control input/output streams using
    the `<<` operator or the `>>` operator (Input/output manipulators—Cppreference.com.,.d.).


    | ![image29.png](images/Image00041.jpeg) | Using an input/output manipulator to
    delimit and manipulate the output. This screenshot is the successful run of our
    edited “Hello World” program in split-screen mode. Using ![Image00042.jpg](images/Image0042.jpeg)
    we were able to get our expected output. In a program this small, it is difficult
    to see the effects of using a memory manipulator. Manipulators only begin to make
    a difference when using them in called functions. You can access the code at this
    URL: [A](https://ide.geeksforgeeks.org/htcfFytK71) [https://ide.geeksforgeeks.org/htcfFytK71](https://ide.geeksforgeeks.org/htcfFytK71)
    [A](https://ide.geeksforgeeks.org/htcfFytK71). |


    ## More Input/Output Manipulators


    Like escape sequences, there are many more input/output manipulators that give
    programmers more control over data types or strings. Many of them will make sense
    once we talk about data types and structuring classes. Here are some of them (Input/output
    manipulators—Cppreference.com.,.d.):


    - `setw`: sets the field width

    - `fixed`: uses fixed-point notation

    - `setprecision`: sets the number of decimal places

    - `left`: aligns output to the left

    - `right`: aligns output to the right

    - `hex`: displays numbers in hexadecimal

    - `oct`: displays numbers in octal

    - `dec`: displays numbers in decimal

