- fmt: "\nThere are many programming environments and text editors that can support\
    \ C++. Some will have multiple versions of C++. As of writing this, the most up\
    \ to date version of C++ is A17 but the most supported is C++14 is The evolved\
    \ version of C++ and it features more comprehensible language features. C++14\
    \ is more intelligible to humans than its predecessor and you can expect this\
    \ trend to continue. The oldest, widely available C++ version is C++11.\n\nI encourage\
    \ you to set up a local IDE and work on it. It will allow you to grow faster and\
    \ get accustomed to real-world scenarios. We have spoken of `Code::Blocks` for\
    \ Microsoft and `Xcode` of Mac. If you have a Linux there are standardized options\
    \ you can use across all distros. Linux is a console-based environment that is\
    \ highly preferred by software developers because console-based environments are\
    \ entrenched with many built-in features that directly interact with programs.\n\
    \nThere are many distros that provide a GUI-based desktop that is preferable for\
    \ many users. Most of them are open source, free to download and install. We highly\
    \ recommend `CentOS`, a free Linux distro for server management. `CentOS` uses\
    \ many of Red Hat Linux (RHEL) components. It is the best distro for preparing\
    \ to work in Red Hat server management environments.\n\n# Coding Best Practices:\
    \ Ownership of Learning and Collaboration\n\nIn our time together we have seen\
    \ many techniques and best practices for software development. In the first chapter,\
    \ we talked about how programs should fulfill their tasks with as little code\
    \ as possible. Frankly, with each new version of C++, more ways of doing this\
    \ are added. The majority of beginner programming courses teach older, less efficient\
    \ methods of implementing common programming tasks like parsing arrays, conditional\
    \ statements, and calling functions. You will find most of these techniques are\
    \ never used in actual programming situations. Most beginner courses are focused\
    \ on equipping beginners with a strong grasp of the basics– the foundation of\
    \ your knowledge is often as important as how you are going to progress. As you\
    \ grow you will find more efficient ways of solving problems with your code, but\
    \ this can only happen if you practice and study. \n\nIf you want to improve as\
    \ a programmer you have to take ownership of your learning. Learn pre-development\
    \ tools like `algorithms`. It is all about learning to to fix problems. There\
    \ are other pre-development tools you can try, like `diagramming`. Diagramming\
    \ is good for individuals who are visual learners. All of these are great for\
    \ growing as a programmer; it does not matter which you choose, as long as pre-development\
    \ tools are something you take advantage of. \n\nTurning back to `algorithms`,\
    \ more detailed `algorithms` will explain all sorts of data types required for\
    \ inputs, outputs, and other data. The advantage of `algorithms` is that you can\
    \ use them as a shorthand. You can also annotate and manage your code. These habits\
    \ will help keep your code ordered and coherent to your team members. All these\
    \ practices will help enhance how you see and think about programs.\n\nSoftware\
    \ developers work in teams, with several people working on the same piece of code\
    \ at the same time. The importance of annotating your code becomes every apparent\
    \ in such situations.\n\nIt also happens that working with others will accelerate\
    \ your growth. When coding with others you learn from their experience and acknowledge.\
    \ As we have said, C++ has a variety of library objects, statements, and other\
    \ tools. It is a rich language because there are many ways of doing the same things.\
    \ But ultimately all programming and developments are creative endeavors. Working\
    \ with others will increase your programming and you will find insights on how\
    \ fix problems. You should always keep in mind that everyone can contribute something\
    \ and what they contribute is heavily influenced by the experience they have.\
    \ So even if you are new to C++, you still have a unique experience and approach\
    \ to solving problems that itself is valuable to any team, particularly if you\
    \ learn to communicate your ideas well. I highly recommend you use annotations\
    \ to help you communicate clearly.\n\nIn addition to annotations, it is good practice\
    \ to make your code as clean as possible. We have demonstrated how to comment\
    \ lines of code to prevent breaking. In your exercises, when you break code beyond\
    \ repair, you can always start over from saved IDEs, or you can simply refresh\
    \ the browser to start over (this will depend on the state). Only generate URLs\
    \ when you save your code, not while you are developing.\n\nWe also stressed the\
    \ importance of code structure. For instance, we talked about the importance of\
    \ declaring and defining functions: the best practice is to declare your functions\
    \ on the top and define them after the `main()` function. It is similar to declaring\
    \ integers. The techniques ensure you have an inventory of functions, variables,\
    \ and objects right at the beginning. It works like an index and can help you\
    \ avoid definition errors.\n\nFormatting and editing your code of unnecessary\
    \ lines reduces the possibility of errors during development. You should always\
    \ update your comments when you make a change. Unformatted code will not impact\
    \ performance, the logic of the code will. It is a courtesy to format your code,\
    \ not to make things easier for you. Other programmers on your team will be able\
    \ to implement your code, or even improve it, and they will leave comments.\n"
