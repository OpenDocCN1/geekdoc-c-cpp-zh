    # C++的力量：高级字符串


    我们将另一个数据类型是字符串。字符串是计算机科学中最流行的数据类型之一；它们是字符序列。将它们想象成句子可能会有用，但并不是每个句子都代表一个字符串。我们已经看到它们在“Hello
    World”应用程序中是如何工作的。字符串是一个独立的数据类型，有它们自己的库。为了操作和使用它们，程序需要适当的 `<string>` 库。库具有允许程序操作字符串的方法和特性。


    ## 操作：字符串拼接 (String Concatenation)


    字符串拼接是将不同的字符串组合成一个字符串。它是组合字符串。这是程序最常见的功能之一。例如，当你在网站上输入姓名并切换到另一个页面，屏幕问候你“Hello,
    [your_name]!”时，程序就使用了拼接来实现这一点。它将“Hello,”与你的名字以及“!”结合了一起。


    在 C++ 中，字符串拼接通过 `+` 运算符完成。让我们通过创建一个打印带有问候语的输入字符串的程序来观察此操作。为了使其工作，我们必须包含 `<string>`
