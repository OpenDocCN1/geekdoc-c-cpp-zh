    `i=i+1` 等于 `i++`。使用一元形式可以使代码更整洁，因为它排除了 `+` 算术运算符和 `=` 赋值运算符。我们也可以使用原子加运算符来完成代码：`i+=1`
    等于 `i++`。但类似的格式将需要编译器存储并操作额外的操作数。一元运算符的作用是通过仅有一个操作数来简化代码。记住，一元运算符是那些使用一个操作数的运算符。以下是一元运算符的其他一些示例（Kumar,
    2017）：


    “`![Image00163.jpg](img/Image00163.jpeg)`”：增运算符，用于将整数的值增加 1。它可以在立即增加值，也可以在表达式之后增加。


    “`![Image00164.jpg](img/Image00164.jpeg)`：减运算符，用于将整数的值减少 1。与增运算符类似，它可以立即减少值，也可以在表达式之后减少。“`![Image00189.jpg](img/Image00189.jpeg)`”：一元负号，用于改变变量的符号。它可以使负整数变为正整数。例如，`![Image00165.jpg](img/Image00165.jpeg)`：地址运算符，用于指向变量的地址。


    | `![image2.png](img/Image00166.jpeg)` |

    | 带有后置和前置的一元运算符 此截图是我们的赋值程序。程序在缓冲区上操作并在计算时存储值。对比 缓冲区，后置操作延迟值；前置操作立即更改值。




    除此之外，我们还有 `sizeof()` 运算符。它看起来像一个函数，但被归类为运算符。它返回对象的大小。回想我们讨论过的流通常被分成字节组。一个字节是一个单
    8 位流，可以表示 255 个数字。在我们的位运算程序中，我们的寄存器长度为 1 字节，这是因为我们处理的是小于 255 的数字。


