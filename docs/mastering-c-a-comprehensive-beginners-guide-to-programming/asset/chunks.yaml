  trans: "\n\ncout << \"\\n 使用三元运算符执行表达式\";\ncout << \" 三元运算符: \";\n\n// 使用三元\n//\
    \ 运算符执行表达式\n\nint a = 2 > 5 ? 2 : 5;\ncout << a << endl;\n\ncout << \"\\n 使用 if-else\
    \ 语句执行表达式\";\ncout << \" 语句: \";\n\n// 使用 if-else 执行表达式\nif (2 > 5)\n    cout\
    \ << \"2\";\nelse\n    cout << \"5\";\nreturn 0;\n}\n\n## While 循环演示\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // 初始化计数器 i\n   \
    \ int i = 1;\n    // 打印程序说明\n    cout << \"此程序将计数一个数字并打印 10 行--\";\n    // 当 i\
    \ 小于 11 时，打印 \"Hello World\"\n    while (i < 11) {\n        cout << \"\\n\\t\"\
    \ << i << \" Hello World\";\n        i++; // 一元计数器 i\n    }\n    return 0;\n}\n\
    ```\n\n## For 循环演示\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // 打印程序说明\n    cout << \"此程序将计数一个数字并打印 10 行--\";\n    // 当 i 小于 11 时，打印\
    \ \"Hello World\"\n    for (int i = 1; i < 11; i++) {\n        cout << \"\\n\\\
    t\" << i << \" Hello World\";\n    }\n    return 0;\n}\n```\n\n## 展示退出控制循环的 Do-While\
    \ 循环\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    //\
    \ 初始化计数器 i\n    int i = 11;\n    // 打印程序说明\n    cout << \"此程序可能会或可能不会一个 \\\"Hello\
    \ World\\\"\";\n    // 当 i 小于 11 时，打印 \"Hello World\"\n    do {\n        cout\
    \ << \"\\n\\t\" << i << \" Hello World\";\n        i++; // 一元计数器 i\n    } while\
    \ (i < 11);\n    return 0;\n}\n```\n\n## 嵌套 If-Else 演示\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    cout << \"此程序将遍历一个 2 到 4 的连续数字列表，并使用\"\
    \n    << \"\\n 嵌套 if-else 语句选出最大的一个。\";\n    cout << \"\\n 最大的数字:\\t\";\n    if\
    \ (2 > 3)\n        cout << \"2\";\n    else if (3 > 4)\n        cout << \"3\"\
    ;\n    else\n        cout << \"4\";\n    return 0;\n}\n```\n\n## 嵌套 If-Else 与嵌套三元运算符的比较\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << \"\
    此程序将遍历一个 2 到 4 的连续数字列表，并使用两种方法\"\n    << \"\\n 选出最大的一个：一个嵌套 if-else 和一个嵌套三元运算符\"\
    \n    << \"\\nn 嵌套 If-else 的最大数字:\\t\";\n    if (2 > 3)\n        cout << \"2\"\
    ;\n    else if (3 > 4)\n        cout << \"3\";\n    else\n        cout << \"4\"\
    ;\n    cout << \"\\n 嵌套三元运算符的最大数字:\\t\";\n    int a = 2 > 3 ? 2 : 3 > 4 ? 3 :\
    \ 4;\n    cout << a;\n    return 0;\n}\n```\n\n## Switch 演示\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // 初始化变量\n    int x = 2;\n\
    \    // 打印说明\n    cout << \"此程序打印一个给值。\\n 变量 x 等于: \\t\";\n    // 程序分支切换\n   \
    \ switch (x) {\n        case 1:\n            cout << \"1\";\n            break;\n\
    \        case 2:\n            cout << \"2\";\n            break;\n        case\
    \ 3:\n            cout << \"3\";\n            break;\n        default:\n     \
    \       cout << \"程序退出\";\n            break;\n    }\n    return 0;\n}\n```\n\n\
    ## 函数演示\n```cpp\n#include <iostream>\nusing namespace std;\n// 声明\nvoid Function();\n\
    // 主函数\nint main() {\n    Function(); // 调用函数\n}\n// 定义\nvoid Function() {\n \
    \   cout << \"我收到了!\";\n}\n```\n\n## 带参数的函数\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n// 声明函数\nint max(int x, int y);\n// 主函数\nint main() {\n    int\
    \ a = 10, b = 20;\n    // 调用上面的函数查找 'a' 和 'b'\n    int m = max(a, b);\n    cout\
    \ << \"m 是 \" << m;\n    return 0;\n}\n// 定义函数\nint max(int x, int y) {\n    if\
    \ (x > y)\n        return x;\n    else\n        return y;\n}\n```\n\n## 程序重载\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint plusFuncInt(int x, int\
    \ y) {\n    return x + y;\n}\ndouble plusFuncDouble(double x, double y) {\n  \
    \  return x + y;\n}\nint main() {\n    int num1 = plusFuncInt(8, 5);\n    double\
    \ num2 = plusFuncDouble(4.3, 6.26);\n    cout << \"Int: \" << num1 << \"\\n\"\
    ;\n    cout << \"Double: \" << num2;\n    return 0;\n}\n```\n\n## 程序重载\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint plusFuncInt(int x, int y) {\n \
    \   return x + y;\n}\n// 修改函数\ndouble plusFuncInt(double x, double y) {\n    return\
    \ x + y;\n}\nint main() {\n    int num1 = plusFuncInt(8, 5);\n    // 代替旧的调用\n\
    \    double num2 = plusFuncInt(4.3, 6.26);\n    cout << \"Int: \" << num1 << \"\
    \\n\";\n    cout << \"Double: \" << num2;\n    return 0;\n}\n```\n\n# References\n\
