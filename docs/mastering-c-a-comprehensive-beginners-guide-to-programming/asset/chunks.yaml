    | Code::Blocks 中 "Hello World" 的截图。此程序显示构建消息中出现了一个错误。`Code::Blocks` 高亮显示了第 6 行的错误。根据你之前章节介绍的
    C++ 语法，你应该知道如何修复代码。我们该如何修复代码呢？提示：数据和函数应该显示为蓝色。 |


    顺便说一下，对于它允许你完成的工作量来说，这个程序非常轻量。`Code::Blocks` 适用于 Windows 和 Linux，但没有 Mac 版本。


    # Mac Xcode IDE 安装与设置


    对于 Mac，你需要获取 `Xcode`。它是一个针对 macOS 的免费 IDE 软件开发全套件。你可以在 Mac App Store 获取它。`Xcode`
    支持 `Java`、`Python` 和 `Ruby` 等多种其他语言。


    它旨在为 macOS 操作系统开发软件；这包括适用于 AppleTV 的 iOS、适用于 Apple Watch 的 `watchOS` 以及适用于 iPad
    平板的 `iPadOS`（“Xcode 9 新功能”等）。`Xcode` 为不同的 macOS 平台提供了多种软件开发工具包（`SDKs`），帮助程序员通过
    Apple 的专有编程方案进行开发。`SDKs` 是由硬件和软件供应商提供的工具集，用于开发特定平台的应用程序（“Xcode 9 新功能”等）。`SDKs`
    允许开发者完全集成到开发社区中，例如 Apple 或 Android 社区。


    Mac 使用专有的编译器，这些编译器只能在 `Xcode` 中运行，因此如果你在 Mac 上，你除了使用 `Xcode` 进行 `C++` 开发外没有其他选择。你可以通过此链接下载并安装
    `Xcode`：


    [Xcode](https://apps.apple.com/us/app/xcode/id497799835?mt=12) [https://apps.apple.com/us/app/xcode/id497799835?mt=12]


    文件下载并安装完成后，打开 `Xcode` 并点击“Create a New Xcode Project”（新建 Xcode 项目）图标。 然后在初始窗口中选择“New
    Project”（新项目）。


    | ![image12.png](img/Image00007.jpeg) | Xcode 初始界面：选择新项目。这些截图展示的是 `Xcode` 8.3.3
    版本 (Patel, 2017)。因此，我们的示例可能与更更新的版本有所不同。截至本文编写时，最新版本是 A12.1，主要包含了对各种 macOS 平台 SDK
    的更新（“Xcode”等）。尽管存在这些差异，这些截图仍将帮助你在更当前版本中定位。我们的指令仍然产生结果。 |


    完成此操作后，会弹出一个提示窗口要求你选择模板。此窗口将引导你完成剩余设置。选择 macOS 部分并进入 Application（应用程序）部分；在那里选择
    Command Line Tool（命令行工具）。它看起来像这样：


    | ![image6.png](img/Image00008.jpeg) | 1. 项目选择屏幕：macOS > Application > Command
    Line Tool。`Xcode` 有许多内置代码工具用于在各种 Apple 平台上运行程序。因此，为了运行测试程序，你必须选择 macOS 才能运行你的程序。此外，为了访问
    `C++` 所需的汇编语言开发，你需要使用 `Xcode` 的命令行。该命令行还可以处理 Objective-C 和 `C` 语言。 |


    选择模板后，指南将提供命令行工具的选项。在这里你可以命名项目、添加你的组织、使用标识符（identifier）并选择编程语言。


    | ![image49.png](img/Image00009.jpeg) | 2. 命令行工具选项：Language > Select C++。`Xcode`
    的命令行可以处理像 Swift 这样的 Apple 专有。该程序可以与基于 C 的语言编译器一起运行。默认选择 Swift。 |


    在同一个窗口中，你将被添加一个组织。记住 `Xcode` 的命令行是专有 macOS 操作系统的模板，因此标识符用于在 Apple 中为你的程序创建一个唯一的标识符：开发者网站和云容器，通往
    App Store 的门户。这将你的应用流式传输到专有的 macOS 框架中。 | ![image5.png](img/Image0010.jpeg) |
    3. 命令行工具选项：Identifier > "cpp"。标识符是一种命名规范，帮助程序员将项目集成到 Apple 的软件开发方案中。在这里，我们使用 "cpp"
    作为我们的标识符，生成 `cpp.HelloWorld` 作为我们的标识符。一旦我们指定了它，指南允许我们进入下一步。 |


    现在，将你的项目保存到选择的目录中。在左侧面板中，`Xcode` 将打开该文件。你必须选择 `main.cpp` 以在 `Xcode` 中访问你程序的全局
    `C++` 文件。如果你愿意，可以将 `.cpp` 文件上传到目录并编辑它们。 | ![image40.png](img/Image0011.jpeg) |
    3. Xcode 命令行工具："main.cpp"。此截图展示了 IDE 风格的 `Xcode` 命令行工具工作空间。它在文本编辑器中打开了 ![Image0012.jpg](img/Image0012.jpeg)
    (Patel, 2017)。 |


    你写了一些代码并想要运行它，选择 product（产品）并点击 Run（运行）。你也可以通过选择按钮来运行并构建程序。 | ![image3](img/Image0013.jpeg)
    | 4. Xcode 命令行工具："Hello World" 构建与运行。与 `Code::Blocks` 类似，你也必须构建并运行程序。此截图还展示了 "Hello
    World" 的结果和返回值 (Patel, 2017)。 |


    如果你是一个认为自己将与 Apple 设备工作的程序员，在 `Xcode` 中工作和练习是一项很好的投资。例如，Apple 拥有健康的市场份额，提供广泛的消费品和服务，如流媒体服务和设备。尽管如此，你应该记住
    `C++` 主要用作服务端语言。大多数服务端编程都在 Linux 机器上完成。 |


