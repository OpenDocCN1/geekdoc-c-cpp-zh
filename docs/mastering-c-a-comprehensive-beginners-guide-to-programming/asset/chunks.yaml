    在本章中，我们做了很多工作。我们查看了一些特殊函数、对象访问、文本处理程序和操作符。我们将在接下来的章节中详细介绍它们。我希望你已经看到了操作符在引导数据和实现程序功能方面的作用。在接下来的章节中，我们将研究操作符以及它们如何赋予程序决策能力。


    # 第 4 章：C++ 中的操作


    我们讨论了 `C++` 主要是一种后端、服务器端语言，适用于控制服务器和其他用于交付内容的决策类实用程序。在上一章中，我们通过查看字符串，了解了 `C++`
    处理数据的简易方式。在其中，我们看到了操作扮演的核心作用。操作允许我们控制程序中的循环和决策。更好地理解操作允许我们为程序添加更多功能。功能是程序员如何使用语言的方法和特性来实现目的。我们已经看到了这些字符串处理方法是如何工作的，但更好的做法是在允许我们实现特定目的（如内容管理）的语境中使用这些特性。


    注意：`操作数`（Operand）描述了操作的值或变量。`操作符`（Operator）描述了指示正在执行的操作类型的符号。以下是 `C++`（以及其他）中的操作符列表。


    此表根据 (1) 每次接受多少操作数以及 (2) 它们执行的操作类型列出了操作符。它们分为三类：


    - 一元操作符：每次只接受 1 个操作数

    - 二元操作符：每次只接受 2 个操作数

    - 三元操作符：接受多个操作数，或带有多个条件的操作符


    在本章中，我们将查看 5 种操作符及其功能。


    注意：操作符具有优先级，就像数学方程一样。例如，用于调用函数的括号优先级高于加法或减法。然而，你应该尝试保持代码行尽可能简单。这使得你的程序更容易编辑和调试。拥有整洁、不复杂的代码可以避免错误。


    # 二元操作符


    二元操作符是 `C++` 中发现的大多数操作。它们包含了 6 种操作符中的 5 种。这使得它们成为完美的起点。正如名称所示，二进制操作符比较两个操作数。它们对于决策和控制开关非常完美。


    ## 算术操作符


    它们是所有操作符中最常见、最易理解的，因为即使在编程之外我们也经常使用它们，由于它们主要是数学性的。我们用它们来执行数学运算。


    注意：在字符串拼接示例中，用于拼接的 `images/Image00087.jpg` 并不是算术函数。相反，它是 `images/Image00088.jpg`
    库的一个函数，负责处理拼接。


    此类中的大多数操作符都需要两个操作数。唯一的异常是一元的 `++` 和 `--` 操作符，我们它们在循环内增加或减少。二元操作符如下 (Jaggi, 2015a)：


    - `images/Image00087.jpg`：加法，将两个操作数相加

    - `images/Image00089.jpg`：减法，从一个操作数中减去另一个操作数

    - `images/Image00090.jpg`：乘法，将两个操作数相乘

    - `images/Image00091.jpg`：除法，将第一个操作数除以第二个操作数

    - `images/Image00092.jpg`：模运算，返回第一个操作数除以第二个操作数后的余数


    让我们编写一个程序来演示这 5 种操作。


    1. 声明两个变量 `images/Image00093.jpg`

    2. 声明一个变量 `images/Image00094.jpg`

    3. 打印变量 `images/Image00095.jpg`

    4. 加 `images/Image00096.jpg` 并打印结果

    5. 减 `images/Image00097.jpg` 并打印结果

    6. 乘 `images/Image00097.jpg` 并打印结果

    7. 除 `images/Image00097.jpg` 并打印结果

    8. 计算 `images/Image0096.jpg` 的余数并打印结果


    如下所示：


    ```

    ![images/Image0098.jpg]

    ```


