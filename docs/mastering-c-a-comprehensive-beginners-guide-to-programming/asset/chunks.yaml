    当你整合相似的函数时，你就清理了代码。这很重要，特别是当你需要调试代码时，因为当发生错误时，编译器可能会指向函数。编译器之所以这样做是因为在 C++ 中它指向了多个库。整合和重载函数可以确保你的编译器引用的函数更少，让你更容易调试。请记住，C++
    正在不断更新，使其变得变得更加容易。新功能被不断添加，库也被压缩并进一步组织。因此，C++ 中的错误看起来会与 C++14 中的错误不同。更新带来了执行平凡任务的新简方法。例如，复制所有组合（copy
    all combinations）被认为是数组等容器索引更现代的方法。为了保持更新并获得新 C++ 进展的益处，你必须不断练习、测试自己并提问。


    # 结论和最后的注意事项


    学习编程是一段认知之旅，是一段激发人心、令人兴奋且有时令人沮丧的旅程。当我们到达这本书的结尾时，回顾我们学到的一些重要课程是非常重要的。它们还将伴随着最终的思考和建议，旨在为你提供在该领域继续成长所需的一切。。


    # 扩展你的实践：准备你的编码环境


    我们使用了在线 IDE，以确保每个人都有相同的体验。如果你想保存工作成果，可以使用 Run 按钮将其保存到另一个 URL。你也可以将书中列出的所有保存 IDE
    工作区和 URL 签名，以便日后参考。将它们作为参考或修复损坏的代码。我已经尽力在所做的练习中向你展示了最佳编码实践。你已经看到在 C++ 中有许多实现某功能的方法，所以利用这一点。不要害怕实验和尝试新事物，并阅读关于你感兴趣的其他内容的资料。书中的练习并不是标准答案，编程领域不存在这种标准答案。所以，请参考这本书，并探索实现其他功能的方法。我们将代码放在了电子书的索引中以便快速查阅。

