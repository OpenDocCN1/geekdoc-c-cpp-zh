  trans: "\n\n“A![Image00099.jpg](img/Image00099.jpeg) A”: `Equal` 等于运算符用于检查两个给定的操作数是否相等。如果操作数相等，它返回布尔值\
    \ `true`；否则，返回 `false`。\n\n“A![Image00100.jpg](img/Image00100.jpeg) A”: `Not-Equal`\
    \ 不等于运算符，也检查两个给定的操作数是否相等。然而，如果操作数不等，该运算符返回布尔值 `true`；如果操作数相等，则返回 `false`。\n\n\
    “A![Image00101.jpg](img/Image00101.jpeg) A”: `Greater-than` 大于运算符，检查左操作数是否大于右操作数。如果是，该运算符返回布尔值\
    \ `true`。否则，它返回 `false`。\n\n“A![Image00102.jpg](img/Image00102.jpeg) A”: `Less-than`\
    \ 小于运算符，检查左操作数是否小于右操作数。如果是，该运算符返回布尔值 `true`。否则，它返回布尔值 `false`。\n\n“A![Image00103.jpg](img/Image00103.jpeg)\
    \ A”: `Greater-than or equal-to` 大于等于运算符，检查左操作数是否大于等于右操作数。如果是，该运算符返回布尔值 `true`。否则，它返回布尔值\
    \ `false`。\n\n“A![Image00104.jpg](img/Image00104.jpeg) A”: `Less-than or equal-to`\
    \ 小于等于运算符，检查左操作数是否小于等于右操作数。如果是，该运算符返回布尔值 `true`。否则，它返回 `false`。\n\n正如处理算术运算符一样，让我们创建一个演示关系运算符的程序，我们将在代码中使用条件\
    \ `if()` 语句。`if()` 语句在满足指定条件时执行其大括号内的代码。如果条件不满足，它将执行 `else {}` 语句中的代码。`else` 没有用于检查的条件；它在\
    \ `if()` 中的指定条件不满足时时执行。条件语句始终使用关系运算符来测试条件。\n\n注意：`if()` 和 `else` 语句对大小写敏感。\"if\"\
    \ 和 \"else\" 必须全小写。此外，虽然 `if()`可以在没有 `else` 的情况下执行，但如果条件为假，缺少 `else` 语句会导致错误。`else`\
    \ 语句也不能在没有 `if()` 的的情况下实现。我们将在后面的章节详细描述 `if()...else` 语句。\n\n要创建我们的程序，必须遵循以下步骤：\n\
    \n1. 使用此 URL 打开并编辑算术程序：\n[`ide.geeksforgeeks.org/vDcCH7f5EQ`](https://ide.geeksforgeeks.org/vDcCH7f5EQ)\n\
    2. 使用算术程序中相同的变量。确保清理代码中任何不需要的变量。\n3. 打印程序的说明。\n4. 测试 `![Image00105.jpg](img/Image00105.jpeg)`\
    \ 并打印结果：\n    1. 创建一个 `if` 语句，在大于时打印结果。\n    2. 创建一个嵌套的 `else` 语句，在为假时打印结果。\n\n\
    注意：针对所有可能的情况测试每个 `![Image00106.jpg](img/Image00106.jpeg)`。对于我们的简单程序，每个语句只有两种可能。\n\
    \n1. 测试 `![Image00107.jpg](img/Image00107.jpeg)` 并打印结果。\n2. 测试 `![Image00108.jpg](img/Image00108.jpeg)`\
    \ 并打印结果。\n3. 测试 `![Image00109.jpg](img/Image00109.jpeg)` 并打印结果。\n4. 测试 `![Image00110.jpg](img/Image00110.jpeg)`\
    \ 并打印结果。\n5. 测试 `![Image00111.jpg](img/Image00111.jpeg)` 并打印结果。\n\n| ![image4.png](img/Image00112.jpeg)\
    \ | 关系例程序 | 这显示了关系例程序的成功运行，显示了所有功能。 |\n\n如果你没有得到类似的结果，请查看我们这里的代码：[`ide.geeksforgeeks.org/dFD3cEk85y`](https://ide.geeksforgeeks.org/dFD3cEk85y)。对比并找出你错在哪里。这样的练习将使你具备调试技能。也请花时间欣赏并理解代码。\n\
    \n## 逻辑运算符\n\n逻辑运算符为关系运算符增加了更多复杂性。这些运算符类似于人类关于“与”或“或”的想法。它们还具有切换关系运算符含义的属性。逻辑运算符与关系运算符结合使用，组合两个或多个条件来描述约束。它们让我们能够通过条件捕捉更多并执行更多操作。有三个逻辑运算符（aggi,\
    \ 215b）：\n\n- `&&`: AND 运算符在两个条件都满足时返回布尔值 `true`，在不满足时返回 `false`。\n- `||`: OR\
    \ 运算符在一个（或两个）条件满足时返回布尔值 `true`，在没有任何一个条件满足时返回 `false`。\n- `!`: NOT 运算符在所考虑的条件不满足时返回布尔值\
    \ `true`。如果其中一个条件为真，它返回布尔值 `false`。\n\n逻辑运算符在机器中广泛广泛。想象银行安全系统中的 `NOT` 运算符。假设锁上的门为\
    \ `0 [false]`，未锁的门为 `1`。因为银行应该保持安全，我们的默认值为 `0`。这被称为故障关闭系统，因为如果出现问题门将关闭（默认值）。所有信号都由\
    \ `NOT` 信号控制：如果没有发生什么，门应该保持锁态；如果发生抢劫，它们也应该保持锁态。但在火灾期间，这些门应该打开，因此故障关闭的 `NOT` 信号将返回\
    \ `true` 打开门。\n\n让我们通过构建逻辑程序来探索逻辑运算符。遵循以下指令：\n\n1. 使用此 URL 打开并编辑关系程序：\n[`ide.geeksforgeeks.org/dFD3cEk85y`](https://ide.geeksforgeeks.org/dFD3cEk85y)\n\
    2. 编辑这些额外变量以测试逻辑运算符：\n![Image00115.jpg](img/Image00115.jpeg)\n3. 打印程序的说明。\n4.\
    \ 测试 `if(a>b && c==d)` 并打印结果：\n    1. 创建一个 `if` 语句，在大于时打印结果。\n    2. 创建一个嵌套的 `else`\
    \ 语句，在为假时打印结果。\n5. 测试 `(a>b || c==d)` 并打印结果。\n6. 测试 `(!b)` 并打印结果。\n7. 清理代码中任何不必要的行。\n\
    \n| ![image54.png](img/Image00116.jpeg) |\n\n"
- fmt: "\n# Logical Routine Program\n\nThis is a screenshot of a successful run of\
    \ a program displaying examples of all logical functions. You can access this\
    \ workspace with this URL: [A](https://ide.geeksforgeeks.org/x9ixjUYDBG)[https://ide.geeksforgeeks.org/x9ixjUYDBG]\
    \ [A](https://ide.geeksforgeeks.org/x9ixjUYDBG). As you can see, the \"AND\" function\
    \ may be difficult to print with just one statement.\n\n![Image00117.jpg](images/Image00117.jpeg)\n\
    \nModify this exercise to create a program that can explain itself better!\n\n\
    Hint: You only need one additional statement.\n\n![Image00118.jpg](images/Image00118.jpeg)\n\
    \nYou can check your work against ours with this URL: [A](https://ide.geeksforgeeks.org/nh8yYV9Kjy)[https://ide.geeksforgeeks.org/nh8yYV9Kjy]\
    \ [A](https://ide.geeksforgeeks.org/nh8yYV9Kjy).\n\n## Here is how it looks:\n\
    \nLet's take a break from routines and explore other ways we can use logical operators.\
    \ Logical operators are based on machine logic, especially logical gates. Logical\
    \ gates are electronic circuits that have one or more inputs while having one\
    \ output. Logical gates have the same function as logical operators.\n\nA \"AND\"\
    \ gate only passes \"1\" when all inputs are \"1\"; \"OR\" gates pass \"1\" when\
    \ they receive a \"1\" from any of their inputs; \"NOT\" passes \"1\" when they\
    \ receive a \"0\" as their input. Logical gates can control the flow of data in\
    \ a circuit, the same as our logical operations when combined with a conditional\
    \ statement. It is called a conditional short-circuit in logical operators.\n\n\
    AND and OR operators short-circuit. Recall how logical AND returns a `true` Boolean\
    \ value when both relational operators are conditionally true. What’s more, relational\
    \ operators are assessed in the order that they appear in a conditional statement\
    \ – if the first one is false, the second one will not be evaluated, so it short-circuits.\n\
    \nOR operators do this differently. Only one relational operator has to return\
    \ `true` for it to pass a `true` Boolean value. So if the first relational operator\
    \ returns `true`, it won't check the next one.\n\nThis is very useful because\
    \ we can give more complex instructions to a program about how to behave in what\
    \ circumstances. OR and AND are short-circuit opposites. Let's use this to write\
    \ a program that tells when a condition short-circuits AND and OR gates. Follow\
    \ these instructions:\n\n1. Open a new IDE workspace.\n2. Declare two variables:\n\
    \n![Image00058.jpg](images/Image00058.jpeg)\n\n![Image00119.jpg](images/Image00119.jpeg)\n\
    \n3. Print an explanation of the program:\n   - This program will test if the\
    \ OR gate or the AND gate shorts when it is equal to a `b`.\n   - Print current\
    \ values of `a` and `b`.\n4. Declare and calculate two variables:\n\n![Image00062.jpg](images/Image00062.jpeg)\n\
    \n```cpp\nresAND = ((a == b) && std::cout << \"OR circuit Ashorted\")\nresOR =\
    \ ((a == b) || std::cout << \"AND circuit Ashorted\")\n```\n\nThis is how it looks:\n\
    \n| ![image27.png](images/Image00120.jpeg) |\n\n## Short Circuit Detection Program\n\
    \nThis screenshot is a successful run of our short circuit detection program.\
    \ Using our knowledge of logical AND, logical OR, and their relationship to each\
    \ other, we were able to develop a way to detect short circuits. You can access\
    \ this workspace with this URL: [A](https://ide.geeksforgeeks.org/uBLGtLbnnY)[https://ide.geeksforgeeks.org/uBLGtLbnnY]\
    \ [A](https://ide.geeksforgeeks.org/uBLGtLbnnY). Try different values of `![Image00097.jpg](images/Image00097.jpeg)`\
    \ to see if you can trip the different \"circuits.\"\n\nConsider a short circuit\
    \ detection program. How would we use it in the real world? I have alluded to\
    \ systems like these. The question is: how would we use a password if the condition\
    \ is not a match? Logical operators give a good idea of how machines make decisions.\
    \ Logical operators are used in various libraries. So far we have used small programs,\
    \ but bigger programs in environments like YouTube, delivery, and others need\
    \ this to be achieved using bitwise operators.\n\n## Bitwise Operators\n\nOn the\
    \ circuit level, machines communicate using AND and OR gates. It gives them decision-making\
