    \    else\n        cout << \"4\";\n    return 0;\n}\n```\n\n## Nested If-Else\
    \ and Nested Ternary Operation Comparison\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    cout << \"This program will go through A sequential\\\
    nlist of Numbers 2 through 4 and pick the \"\n    << \"\\ngreatest one using two\
