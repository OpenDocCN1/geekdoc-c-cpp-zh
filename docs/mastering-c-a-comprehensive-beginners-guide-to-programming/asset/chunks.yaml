    It is not as easy for humans to calculate, but this is how computers communicate
    in streams of data. They are more adept at recognizing and counting these numbers
    as easily as if they were base-10 numbers to humans. Therefore, using bitwise
    operators that function at the computer’s natural level improves speed and performance
    [Killian, 2012] because it skips the translation of objective programming into
    a machine language. This is why you will find bitwise operations are often used
    in competitive programming. Below is a list of C++ bitwise operators (Bitwise
    Operators in C/C++, 2014):


    - “&”: Bitwise `AND` takes two numbers (operands) and runs `AND` on every bit
    within the stream of those numbers. The results of the `AND` stream will be 1
    if both are 1.

    - “![Image00123.jpg](images/Image00123.jpeg)”: Bitwise `OR` takes two numbers(operands)
    and runs `OR` on every bit within the stream of those numbers. The results of
    the `OR` stream is 1 if any of the two is 1.

    - “![Image00124.jpg](images/Image00124.jpeg)”: Bitwise `XOR` that takes two numbers
    as operands and does `XOR` on every bit within the stream of the two numbers.
    The result stream of `XOR` is 1 if the two bits are different.

    - “![Image00125.jpg](images/Image00125.jpeg)”: The `Left Shift` operator takes
    two numbers and left shifts the bits of the first operand. The second operand
    is used to determine the number of places to shift.

    - “![Image00126.jpg](images/Image00126.jpeg)”: The `Right Shift` operator takes
    two numbers and right shifts the bits of the first operand. The second operand
    is used to determine the number of places to shift.

    - “![Image00127.jpg](images/Image00127.jpeg)”: Bitwise `NOT` operator that takes
    one number and switches the state of all the bits (1s to 0s, 0s to 1s).


    Note: Machines use registers and buffers to store the bits for calculation. A
    register is just an array of storage, where each bit gets its own place in the
    array. If you think of these data streams as an array, it will help you rationalize
    any of the bitwise operators, particularly the shift operators.


    Let’s write a bitwise routine program. First, we will need to create a bit register
    and study bitwise streams. This requires the `bitset<x>()` function for the `<bitset>`
    library. It allows you to print a binary stream with a length of `<x>`. Follow
