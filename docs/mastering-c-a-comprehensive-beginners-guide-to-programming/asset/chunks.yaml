  trans: "\n\n# 逻辑例程序\n\n这是一个显示所有逻辑函数示例的程序运行截图。你可以通过此 URL 访问工作空间：[A](https://ide.geeksforgeeks.org/x9ixjUYDBG)[https://ide.geeksforgeeks.org/x9ixjUYDBG]\
    \ [A](https://ide.geeksforgeeks.org/x9ixjUYDBG)。如你所见，仅通过一条语句很难打印“AND”函数。\n\n![Image00117.jpg](img/Image00117.jpeg)\n\
    \n修改这个练习题，创建一个能够更好地解释自己的程序！\n\n提示：你只需要一条额外的语句。\n\n![Image00118.jpg](img/Image00118.jpeg)\n\
    \n你可以通过此 URL 与我们的作业进行对比：[A](https://ide.geeksforgeeks.org/nh8yYV9Kjy)[https://ide.geeksforgeeks.org/nh8yYV9Kjy]\
    \ [A](https://ide.geeksforgeeks.org/nh8yYV9Kjy)。\n\n## 它是应该是这样的：\n\n让我们暂时离开例行程序，探索一下我们使用逻辑运算符的其他方法。逻辑运算符基于机器逻辑，特别是逻辑门。逻辑门是具有一个或多个输入和一个输出的电子电路。逻辑门的功能与逻辑运算符相同。\n\
    \n“AND”门只有在所有输入都为“1”时才通过“1”；“OR”门在接收到任何一个输入为“1”时通过“1”；“NOT”门在接收输入为“0”时通过“1”。逻辑门可以控制电路中的数据流，就像我们的逻辑操作与条件语句结合时一样。这在逻辑运算符中被称为“条件短路”（conditional\
    \ short-circuit）。\n\nAND 和 OR 运算符具有短路特性。回想当两个关系运算符在条件上为真时，逻辑 AND 如何返回一个 `true`\
    \ 布尔值。此外，关系运算符按照它们在条件语句中出现的顺序进行求值——如果第一个为假，则第二个将不会被评估，因此产生短路。\n\nOR 运算符的处理方式不同。只需要一个关系运算符返回\
    \ `true`，它就会通过一个 `true` 布尔值。因此，如果第一个关系运算符返回 `true`，它就不会检查下一个。\n\n这非常有用，因为我们可以为程序提供更复杂的指令，告诉它在什么情况下如何运行。OR\
    \ 和 AND 是短路的对立面。让我们利用这一点编写一个程序，告诉我们何时 AND 和 OR 发生了短路。遵循以下指令：\n\n1. 打开一个新的 IDE\
    \ 工作空间。\n2. 声明两个变量：\n\n![Image00058.jpg](img/Image00058.jpeg)\n\n![Image00119.jpg](img/Image00119.jpeg)\n\
    \n3. 打印程序的解释：\n   - 该程序将测试 OR 或 AND 门在等于 `b` 时是否短路。\n   - 打印 `a` 和 `b` 的当前值。\n\
    4. 声明并计算两个变量：\n\n![Image00062.jpg](img/Image00062.jpeg)\n\n```cpp\nresAND = ((a\
    \ == b) && std::cout << \"OR circuit Ashorted\")\nresOR = ((a == b) || std::cout\
    \ << \"AND circuit Ashorted\")\n```\n\n它应该是这样的：\n\n| ![image27.png](img/Image00120.jpeg)\
    \ |\n\n## 短路检测程序\n\n此截图是我们的短路检测程序的成功运行。利用我们对逻辑 AND、逻辑 OR 以及它们之间关系的知识，我们能够开发出检测短路的方法。你可以通过此\
    \ URL 访问工作空间：[A](https://ide.geeksforgeeks.org/uBLGtLbnnY)[https://ide.geeksforgeeks.org/uBLGtLbnnY]\
    \ [A](https://ide.geeksforgeeks.org/uBLGtLbnnY)。尝试 `![Image00097.jpg](img/Image00097.jpeg)`\
    \ 的不同值，看看是否能触发不同的“电路”。\n\n考虑一个短路检测程序。我们在现实世界中会如何使用它？我曾提到过这类系统。问题是：如果条件不匹配，我们该如何使用密码？逻辑运算符为机器如何决策提供了很好的思路。逻辑运算符被用于各种库中。到为止，我们使用的是小型程序，但在\
    \ YouTube、外卖等环境中的大型程序需要使用位运算符来实现这一点。\n\n## 位运算符\n\n在电路层面，机器使用 AND 和 OR 门进行通信。这让它们在单个位级别具有决策能力。换句话说，它们是操作于二进制数字的逻辑运算符。\n\
    \n要使用它们，你需要了解二进制。人类使用十进制数字（也称为十制）来概念化数字。例如，像 543 这样的数字被理解为五百、三十十和四个。在十进制中，它看起来像这样：\n\
    \n![Image00121.jpg](img/Image00121.jpeg)\n\n在二进制中，同一个数字看起来像这样：`0b100010110` ——\
    \ `0b` 只是让我们理解它是二进制。所有的二进制数字都以位流的形式呈现，位处于两种状态：`1` 或 `0`。就像十进制一样，数字的位置决定了它的值。534\
    \ 的示例显示了一个 10 位的二进制数。仔细观察 534 位流，我们可以看到第 2、3、4 和第 10 位是开启的（从右向左），而其他所有位都是关闭的。在\
    \ 2 基中，我们这样计算这个……（正文继续）。\n\n![Image00122.jpg](img/Image00122.jpeg)\n\n"
