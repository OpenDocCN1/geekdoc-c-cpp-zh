    variable, rather the loop is controlled by an event. The event here refers to
    a number 0 entered by the user. As the loop is controlled by event, this loop
    becomes an event-controlled loop. All the for loops used in programs preceding
    Program 5 were counter controlled.


    It can be observed in Output 1 that the loop stops after the sixth iteration;
