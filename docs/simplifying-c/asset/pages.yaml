    The programs discussed in earlier chapters of this book were very simple programs
    with few lines of code. In real-life scenario, the size of the program code is
    very large. For example, assume an application of banking. In case of banking
    application, the code size of a program may run into thousands of lines. If we
    create a single code file in such a case, it will be very difficult to understand,
    maintain, and manage this code. A better approach to programming is to break the
    single file code into set of files so that it is easy to understand, maintain,
    and manage the application. In this chapter, we will learn about the concept of
    structured programming. We will learn about functions in C and their types and
    categories. Then we explore the recursive function and command line argument.
    We will also learn how C language facilitates structured programming and how a
    C language program can be written in a better way. Finally, we will learn about
    the advantages of functions.


    # ## 8.1 Structured Programming Approach


    Around 1972, Edsger Dijkstra, a Dutch computer scientist, popularized a theory
    known as structured programming. The theory was based on the concept that, to
    solve any problem efficiently, we need to first break down the problem into small
    parts. Each of the small parts was known as module. Thus, a program would then
    consist of a set of modules. To break down the problem into a set of modules,
    we need to have an overall picture of the problem. The overall picture of the
    problem can be obtained using a structure chart, and this approach of designing
    a structure chart is known as top-down approach of design. We all know that a
    program consists of three functionalities, namely, an input, a process, and an
    output. Figure 1 illustrates a structure chart for breaking a single program into
    three different modules:'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/5d422ba7108ffdf64376be51eaf0c459_167_0.png)


    ▲ Figure 1: Structure Chart for Breaking a Single Program


    In Figure 1, the main program represents the entire code to solve the problem.
    The input module, process module, and output module are at second level of the
    structure chart. Thus, to complete the entire code, we will have to first code
    the input module, the process module, and the output module. Once the codes of
    these modules are ready, we will combine them together to form a single source
    code. The job of the input module is to get data from the user; the job of the
    process module is to perform the required operation on the data obtained, and
    the output module provides the results in the desired format to the user.


    The execution of the program here starts from the main program. The main program
    then calls the input module that accepts data from the user. Then, it passes the
    data to the process module by calling it. Finally, the output module prints the
    information on the monitor. To make this method success, the modules need to interact
    with each other. The interaction between two modules happens by means of passing
    a message between each other. The two message passing mechanism used in structured
    programming are passing a data and passing a reference. Both these methods will
    be discussed later in this chapter. The next section discusses how C language
    implements modularity within a program.


    # 8.2  Functions in C


    In C language, the idea of structured programming is implemented using a concept
    called functions. A C program consists of one or more functions, one out of which
    has to be a function named main. Each function implements particular aspect of
    a large problem. For example, a function named input may accept the data required
    for the execution program. The execution of a C program always starts from and
    ends at the function main. To execute a C program, the operating system calls
    the function main, and the function main, in turn, can call other functions if
    required. Once the work of the main function is completed, the control is transferred
    back to the operating system.


    Normally, a function may accept one or more inputs and returns at most one output.
    The function at times can cause side effect of different forms. A side effect
    is an indication of an action that changes the state of the program. For example,
    after the evaluation of an expression, a change in the value of an identifier
    used in the expression indicates a side effect. The next section discusses the
    components of C function.


    # ■  Components of C function


    A C function is made up of different entities such as function name, number of
    parameters it accepts, number of parameters it returns, data type of the parameter,
    and so on. Figure 2 shows the components of a C function:'
