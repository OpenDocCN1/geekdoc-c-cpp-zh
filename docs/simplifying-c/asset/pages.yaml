  md: "variable. Depending on what content is passed, we have two parameter passing\
    \ mechanisms in C language, namely, pass by value and pass by address. The next\
    \ subsection discusses the pass-by-value mechanism of parameter passing.\n\n#\
    \ Pass-by-Value Mechanism\n\nIf the calling function passes the value of the variable\
    \ as content to the called function, then it is said to have used the concept\
    \ of pass by value. When the calling function passes a value of a variable to\
    \ the called function, the compiler assigns the value passed to an appropriate\
    \ local variable of the called function. Once this assignment operation is done,\
    \ the original values of the parameters in the calling function are blocked and\
    \ cannot be modified till the function call processing is over. All the operations\
    \ are then performed using the local variable of the called function. As the pass-by-value\
    \ technique protects the data of variable in the calling function, it is a preferred\
    \ way of parameter passing. Programs 4 and 5 have used the pass-by-value technique\
    \ for passing parameters. The next subsection discusses about pass-by-address\
    \ technique of parameter passing.\n\n# Pass-by-Address Mechanism\n\nAt times it\
    \ becomes necessary to pass the reference of the variable in the calling function\
    \ to the called function. Passing reference establishes a direct link between\
    \ the actual parameters and the corresponding formal parameters. When the called\
    \ function changes the value of the formal parameter, this change actually modifies\
    \ the value of the actual parameter. Programming language such as C++ calls this\
    \ technique as pass by reference. C language does not actually support direct\
    \ pass by reference. In C language, to pass the reference, we actually pass the\
    \ address of the variable. This technique of passing the address of a variable\
    \ to the called function by the calling function is called pass by address. Pass-by-address\
    \ technique uses the concepts of pointers learned in Chapter 3. Program 6 illustrates\
    \ the use of pass-by-address technique.\n\n▶ Program 6\n\n```\n```c\n/* Program\
    \ to illustrate the use of pass by address */\n/* Program swaps the values of\
    \ two integers */\n#include <stdio.h>\n/* Beginning of function swap */\nvoid\
    \ swap(int *i_first, int *i_second)\n{\n    /* Declare local variables */\n  \
    \  int i_temp;\n    /* Swap values */\n    i_temp = *i_first;\n    *i_first =\
    \ *i_second;\n    *i_second = i_temp;\n}\n/* End of function swap */\n/* Beginning\
    \ of function main */\nmain()\n{\n    /* Declare local variables */\n    int i_first,\
    \ i_second;\n    /* Accept value from user */\n    printf(\"\\nEnter first number:\
    \ \");\n```\n```"
