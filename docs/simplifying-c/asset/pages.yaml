- pgno: 367
  md: '# # Simplifying C


    Second Edition


    C language is the first course for all computer programming aspirants. This book
    is designed to fulfill the needs of all the beginning aspirants of C language.
    It will serve as a textbook for the students of Engineering (BE/Btech), Computer
    Applications (BCA/MCA), Computer Science (BSc/MSc), and Diploma Programs with
    no prior programming experience. Beginning with basic concepts of logic development,
    this book gives a detailed coverage of C language constructs, functions, pointers,
    arrays, strings, structure, union, files, and pre processor directives. It contains
    code of many executable C programs that can run on various C compilers, such as
    gcc, Borland Turbo C/C++, and Visual Studio.


    # Salient features of the book:


    +   - Clear organizational structure, supplemented by easy to understand figures
    and tables.

    - Program tracing technique to assist user in validating the algorithm.

    - Easy to understand collection of real life programs.

    - Plenty of review questions and programming exercises at the end of each chapter.

    - Emphasize on using modular approach of programming by using more user-defined
    functions.

    - Each concept has been supplemented with detailed theoretical discussion.


    # About the Authors


    Harshal A Arkolkar is Associate Professor, at GLS Institute of Computer Technology
    (MCA). An ardent practitioner and teacher he possesses a Ph.D. in Computer Science.
    He has more than 12 years of teaching experience in Computer Science. He has published
    and presented several research papers in international and national conferences
    and journals.


    Sonal Jain is Associate Professor, at GLS Institute of Computer Technology (MCA).
    A lucid writer and teacher, she possesses a Ph.D. in Computer Science. She has
    more than 11 years of teaching experience in Computer Science. She has published
    and presented several research papers in international and national conferences
    and journals.


    The proficient teams at **Kogent Learning Solutions Inc.** and **Dreamtech Press**
    have seized the market of engineering textbooks, bringing excellent content in
    engineering and technical education to the fore. The teams at Kogent Learning
    Solutions, Inc. and Dreamtech Press are committed to providing excellence in quality
    of content by judiciously analyzing the needs of its readers and ensuring dedication
    of its authors and editors in catering to these needs.


    ![](img/5d422ba7108ffdf64376be51eaf0c459_367_0.png)


    ![](img/5d422ba7108ffdf64376be51eaf0c459_367_1.png)'
  merge: -1
  img_proc: true
