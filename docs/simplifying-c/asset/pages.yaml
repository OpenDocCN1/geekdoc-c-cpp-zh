  md: '# 10 Strings in C


    # OBJECTIVES


    +   Describe String

    describe Character Array as String

    Initializing Strings

    Displaying Strings

    Manipulating Strings

    Implementing Array of Strings


    We have already mentioned in Chapter 9 that an array is a data structure used
    to store elements that have the same data type. The elements of an array are stored
    in sequence, one after the other. This arrangement is known as contiguous memory
    allocation. Till now, an array has been used to store numeric data such as age,
    marks, and height. In practical scenario, we need to store data such as name of
    person or city. Numeric arrays will not work in such cases and hence the need
    of character array arises. In this chapter, we will learn what a string is, how
    to define a character array, and how to store and retrieve data from character
    array. We will also learn to perform various operations on character array.


    # 10.1 String


    The term string, in general, refers to a series of character that represents an
    entity such as name. Most of the programming languages provide logical implementation
    of strings. The reason to provide a logical implementation rather than physical
    implementation is the nature of string. Almost all strings that are used in program
