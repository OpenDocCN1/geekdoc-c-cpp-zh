  md: '# # 03 C Data Types


    # OBJECTIVES


    +   - Understanding Data Type

    - Explain Data Types in C

    - Explain User-Defined Data Type

    - Describe Derived Data Type

    - Describe Void Pointers


    In the previous chapter, we have discussed about a C token called *identifier*.
    Identifiers are integral part of any C program. For example, assume that in our
    program, we have defined an identifier named *joining_month*, which is used to
    store the numeric value of month in which an employee has joined the organization.
    This identifier can then store any value between number 1 and 12, as we only have
    12 months in the calendar year. It is not possible here to store a value such
    as 1.8, as the value will be inappropriate. This example suggests that the type
    of values stored in an identifier also has significance. C language uses certain
    reserve words to identify the type of data value that can be stored in an identifier.
    As the reserve word associates a data value type with the identifier, it is known
    as data type. In this chapter, we will understand and discuss in detail about
    different data types available in C and their usage. We will also learn about
    user-defined data type and enumerated data type.


    # ## 3.1 Understanding Data Type


    The type of data value that can be stored in an identifier is known as its data
    type. If an identifier *joining_month* is assigned a data value 8, then we would
    say that the identifier is capable of storing an integer data. This in turn states
    that the data type of the identifier *joining_month* is an integer. Similarly,
    if an identifier *total_marks* is assigned a data value 95.75, then we would say
    that it is capable of storing real data; hence, its data type has to be real.


    Reserved words of C are used to associate two entities with an identifier. First
    is the type of value that can be stored in the identifier, and second is the memory
    space required for storage by the identifier. The compiler designers associate
    a pre-allocated fixed memory space with a data type. Thus, it becomes easier for
    the compiler to handle different identifiers used in C. The basic unit of memory
    space is byte, and 8 bits makes 1 byte. The data types in C are classified as
    primitive and derived. The next section discusses the basic data types available
    in C.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3.2  **Data Types in C**


    As discussed earlier, the identifiers defined in C store a predefined type of
    value. To implement this feature, C language supports two categories of data types,
    namely, primitive and derived. Figure 1 shows the data types that fall under each
    of these categories:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_57_0.png)


    The primitive data types form the basic building block for defining an identifier.
    C language supports four primitive or basic data types, namely, integer, decimal,
    character, and empty. These data types are represented by using keywords *int,
    float, char, and void*, respectively. To associate an identifier with its data
    type, the following syntax is used:


    ```

    Data Type identifier 1[, identifier 2, identifier 3, ..., identifier n];

    ```


    The preceding syntax is known as a declaration statement in C language, where
    the identifier 2, identifier 3, ....,identifier n are all optional. It means that
    they may be present or absent in the definition. In case these identifiers are
    present, it means that we have multiple identifiers of the same type. In this
    chapter, we are going to have a look at primitive data types in detail. The derived
    data types, except for enum and pointer, are discussed later in separate chapters.


    # Integer


    Many numeric operations involve a positive or a negative integer number. To store
    integer numbers in an identifier, we need to define the identifier of type *int*.
    In this case, int is a C reserved word, which indicates that the identifier is
    capable of storing an integer data value. To declare a variable of type integer,
    we use the following syntax:


    ```

    int identifier1[, identifier 2, identifier 3, ..., identifier n];

    ```


    Some examples of declaring an integer identifier are as follow:


    ```

    int i_joining_month;

    int i_age, i_basic_salary;

    ```


    In the preceding examples, the first statement declares an identifier with a name
    *i_joining_month* capable of storing integer value that represents the numeric
    value of month of joining for an employee in an organization. The second statement
