    # ## 5.1 Operators


    At some point of time during our studies, all of us have learned mathematics,
    wherein we have performed operations such as addition, subtraction, multiplication,
    and division of two numbers. For example, 7 + 5 is how we represent an addition
    in mathematics, where 7 and 5 are termed as constant; on the other hand, + is
    a special symbol that identifies the operation to be performed on the constants.
    An operator can be defined as a special symbol in a language that identifies the
    operation that can be performed on the operands in the language. The operators
    in C are categorized into eight types, as shown in Figure 1:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_90_0.png)'
