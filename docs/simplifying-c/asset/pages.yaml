    # ## Summary


    In this chapter, we have learned about the concept of repetition. The loops are
    categorized as pretest loop and posttest loop. In pretest loop, the test condition
    is checked at the time of entering the loop, while in posttest loop, it is checked
    at the time of exit. The posttest loop will always be executed once, while the
    pretest loop may not be executed at all. Both the pretest loop and the posttest
    loop can be governed by a counter or an event. If the loop is governed by a counter,
    it is called counter-controlled loop; when it is governed by an event, it is called
    event-controlled loop. C language provides us three loop constructs, namely, for,
    while, and do…while. The for and while loop constructs are pretest loops. The
    do…while loop construct is a posttest loop. Finally, we learned about the concept
    of nested loop and how to alter the flow of control within the loops using break,
    continue, return, and goto statements.


