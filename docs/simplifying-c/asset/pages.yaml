- pgno: 23
  md: 'Let’s now discuss these symbols in brief.


    +   □ Input/Output symbol: Represents an input to be taken from a user or an output
    to be displayed on the terminal. It is usually known as an I/O symbol. We can
    use this symbol for accepting multiple inputs as well as displaying multiple line
    outputs on the screen.


    +   □ Terminal symbol: Indicates start or end of a set of instructions in a sequence
    within a flowchart. At times, it is used to indicate a pause in the set of instructions.


    +   □ Process symbol: Signifies the core logic of the set of instructions. It
    represents data movement and arithmetic operations, such as addition, subtraction,
    and multiplication, present in the set of instructions. Multiple operations can
    be shown in a single process symbol, which is known as a compound process symbol.
    The operations in the compound process symbol will be resolved in the sequence
    of their appearance.


    +   □ Decision symbol: Alters the flow of execution as per the need of the user.
    Decision making is a part of all complex set of instructions. It so happens at
    times that we may need to skip certain instructions and jump to a specific statement.
    Such a requirement is taken care of by the decision symbol. Figure 3 shows three
    different ways in which a decision symbol can be used in a flowchart:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_23_0.png)


    Each of these representations is used in specific conditions only.


    +   □ Flow lines: Indicates which instruction to execute at any given moment of
    time. The flow of instructions is very important when the solution is to be converted
    into a computer program. The machine needs to know exactly which step or instruction
    it has to perform next. The flow lines in a flowchart using arrow heads indicate
    which instruction needs to be executed next. While drawing a flowchart, we must
    see to it that the flow lines do not intersect with each other. Avoiding intersections
    helps in understanding the flow of instructions clearly, although it may not be
    possible to remove the intersection of flow lines completely for a complex problem.


    +   □ Connector: Solution of a complex problem is lengthy most of the times. To
    draw a flowchart for such problems, we need more than one page. It becomes mandatory
    in such cases to see that the flow of the solution does not go haywire. Connector
    helps the designer in identifying the flow across the pages.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# ### Benefits and Drawbacks of a Flowchart


    The tools like flowchart allow the user to device solution faster. However, the
    use of tools has its own benefits and drawbacks. Let''s now discuss some of the
    benefits and drawbacks of using a flowchart as a solution design tool.


    The benefits of using a flowchart are as follows:


    +   It is easy to understand because of limited symbols used

    It provides convenient and easy approach to represent a solution to a problem

    It assists the user in reviewing and correcting the solution

    It allows us to generate multiple solutions for a problem

    It allows us to compare the various solutions generated


    The drawbacks of using a flowchart are as follows:


    +   It becomes time-consuming with flowcharts to represent a complex and large
    problem.

    It can require redrawing an entire flowchart in case of a minor change in the
    logic.

    It does not have any standards to represent the details of data that should be
    shown in the flowchart. Therefore, two flowcharts for a same problem may vary
    in details.


    # ### Guidelines to Draw a Flowchart


    There are no standardized rules to design a flowchart. However, we have tried
    to give a guideline to assist the user in improving the flowchart design. These
    guidelines are mentioned as follows:


    +   1. Concentrate on the problem

    2. Identify the inputs, outputs, and constraints

    3. Limit the details to minimum

    4. Do not design or use your own symbols in a flowchart

    5. Use language that is easy to understand

    6. Select appropriate naming conventions for the variables used

    7. Be consistent with the naming conventions throughout the solution

    8. Keep the drawing sequence from left to right and top to bottom

    9. Avoid intersections, rather use connectors wherever possible

    10. Always keep in mind that a flowchart is only a representation tool. The solution
    is always devised by us.


    # ### Writing an Algorithm


    Another popular approach to manually solve a problem is an algorithm. The techniques
    of a flowchart and an algorithm are used alternatively according to the convenience
    of the user. An algorithm is a sequence of finite logical steps required to perform
    a specific task. The term algorithm originated from the name of a Persian mathematician
    named Al-Khwarizmi.


    Designing a flowchart or an algorithm is an art that requires a lot of thinking.
    Two well-known approaches used by programmers to formulate an algorithm are *stepwise
    refinement* and *divide and conquer*. In the stepwise refinement method, we initially
    design an algorithm with minimum details. Then, as and when needed, further details
    are added step by step to it such that the final solution is obtained. In the
    divide-and-conquer method, a complex task is simplified by breaking it'
  merge: -1
  img_proc: true
