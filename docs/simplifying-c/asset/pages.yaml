    \ = *(*(a + rownum) + column)\n```\n\nNote that the statements written in Program\
    \ 10 can be reduced with nested for loop. Let us now write a program to display\
    \ the transpose of a matrix. When a matrix is transposed, the row values of a\
    \ matrix gets interchanged with its column values. Program 11 illustrates the\
    \ use of nested for loop to access individual elements of a two-dimensional array:\n\
    \n# ▶ **Program 11**\n\n```\n/ * Program to create transpose of a matrix*/\n#include<stdio.h>\n\
    \n/* Beginning of function main */\nmain()\n{\n    /* Declare variables */\n \
    \   int i_mat[3][3],i_row,i_col,i_temp;\n\n    /* Accept values of matrix from\
