    = basic * 0.25; where the special symbol > is a relational operator.


    C language has six relational operators for the purpose of comparison. Table 2
    lists the relational operators and their use:


    Table 2: Relational Operators

    | Symbol | Name | Usage |

    | --- | --- | --- |

    | == | Equal To | Checks whether operand 1 is equal to operand 2. |

    | != | Not Equal To | Checks whether operand 1 is not equal to operand 2. |

    | > | Greater Than | Checks whether operand 1 is greater than operand 2. |

    | < | Less Than | Checks whether operand 1 is less than operand 2. |

    | >= | Greater Than Equal To | Checks whether operand 1 is greater than or equal
    to operand 2. |

    | <= | Less Than Equal To | Checks whether operand 1 is less than or equal to
    operand 2. |


    In mathematics, to check the equality of two operands, we use a single equal to
    sign (=). In C language, we use double equal to signs (= =) to check the equality
    as = is used as an assignment operator here. The syntax for using relational operators
    is as follows:


    ```

    (Expression-1) ROP (Expression-2)

    ```


    where Expression-1 and Expression-2 can be arithmetic expressions, variable, or
    constant, and ROP refers to one of the relational operator mentioned in Table
    2. The entire expression here is known as relational expression. The result of
    a relational expression is always either true or false. Relational operators are
    generally used along with decision structures, such as if, or control structures,
    such as for, while, and do. These structures are discussed in detail in Chapter
    6 and 7. Let us now look at a C program snippet that uses relational operators.'
