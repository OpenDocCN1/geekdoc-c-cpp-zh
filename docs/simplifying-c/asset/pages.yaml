  md: '# # 15 Preprocessor Directives


    # OBJECTIVES


    +   - Describe A Preprocessor Directive

    - Describe File Inclusion

    - Describe Macro Expansion

    - Describe #undef Directive

    - Describe Conditional Compilation

    - Describe #error Directive

    - Describe Stringizing Operator

    - Describe Token-Pasting Operator


    In the earlier chapters of this book, we have discussed about many C programs,
    and also compiled these programs using the C compiler. C language compiler consists
    of two different programs, namely, a preprocessor and a translator. The preprocessor,
    as its name implies, is a program that processes the code before it is passed
    to the translator. The preprocessor removes all the preprocessor directive statements
    such as #include <file> from the source code and prepares the source code for
    translation. The translator then converts the source code into a machine language
    code, and vice versa. Preprocessor directives make a program easy to read, modify,
    and more efficient. In this chapter, various preprocessor directives for file
    inclusion, macro expansion, and conditional compilation are discussed. The need
    of directive, its usages, as well as pros and cons of the directives are also
    mentioned. Finally, stringizing and token pasting operator are also discussed
    in this chapter.


    # ## 15.1 A Preprocessor Directive


    Preprocessor directives are special lines included in the source code of C programs.
    These lines are not executable program statements, but provide instructions to
    the preprocessor. The preprocessor based on the instructions given by the lines
    then performs some tasks in C program. From the earlier chapters, we know that
    a C program is a collection of statements known as source code. When the program
    is compiled, the first program that it comes across is preprocessor. Recall that
    till now, we have written #define<stdio.h> in almost every program. This statement
    is a preprocessor directive statement. The main task of the preprocessor is to
    replace the preprocessor directive statements with its actual definition. Thus,
    some symbolic constants or statements in the C source code will be replaced by
    other lines of code as defined in the preprocessor directive.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Preprocessor directives follow a special syntax; they always begin with the
    hash (#) sign. Unlike other C statements, the preprocessor directives do not end
    with a semicolon (;). End of the line is considered as end of the directive. C
    language provides different category of preprocessor directives for different
    purposes. Table 1 lists a set of common preprocessor directives and their purpose:


    Table 1: Preprocessor Directives


    | Category | Directive | Purpose |

    | :--- | :--- | :--- |

    | File inclusion | #include | Specify source code of external files to be included
    in a program |

    | Macro expansion | #define | Define substitution macros |

    | Conditional compilation | #if, #else, #ifndef, #ifend, #endif | Conditional
    compilation of macros |

    |  | #undef | Undefine macros |


    The next section discusses about each of the directives mentioned in Table 1 with
    examples.


    # 15.2 File Inclusion


    C language allows modular programming; hence, a code once created can be reused
    again. To reuse the code, we may prepare C files, which are considered to be external
    files. The external files usually contain functions, macros, prototype declarations,
    or any other valid C statements. To use them in any C program, we then need to
    use the preprocessor directives. The syntax to include the header file in a current
    C program is as follows:


    ```

    #include<file name>

    ```


    For example, #define<stdio.h> will be replaced by the source code written in stdio.h
    header file. Figure 1 shows the expansion of the source code expanded by the preprocessor:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_335_0.png)'
