    # 5.3 Expression Evaluation in C


    Till now our focus of discussion was on different operators available in C and
    their usage in expression. Evaluation of expression is a major concern if the
    statements are not properly formed. Consider the expression: result = first *
    second + third / fourth – fifth. In the preceding expression, the multiplication
    of identifiers first and second will be done initially, and its value will be
    stored in a temporary location. Then third will be divided by fourth and its value
    will be stored in another temporary location. The values in both the temporary
    locations will then be added, and finally fifth will be subtracted. Figure 10
    shows the evaluation order of this expression:


