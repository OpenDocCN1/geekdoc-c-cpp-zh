    \ is then compared with various ranges of values using the if-else statement.\
    \ As one of the test conditions become true, the message is printed and the program\
    \ stops execution.\n\nThe if-else ladder does provide us the multiway selection.\
    \ However, as the number of choices increases, the complexity of the program will\
    \ also increase. To make the programs look more readable and compact, C provides\
    \ another multiway selection structure called switch. The next subsection discusses\
    \ how to use a switch structure.\n\n# The Switch Statement\n\nThe if-else structure\
    \ was a derived mechanism to implement multiway selection in a C language. C provides\
    \ an inbuilt decision structure called switch for multiway selection. The decision\
    \ structure when used improves the readability of the program. The complete switch\
    \ decision structure is made up of four C keywords, namely, switch, case, default,\
    \ and break. The syntax of the switch statement is as follows:\n\n```\nswitch\
    \ (expression)\n{\n    case value 1:\n        [Action block 1]\n        [break;]\n\
    \    case value 2:\n        [ Action block 2 ]\n        [break;]\n    case value\
    \ 3:\n        [ Action block 3 ]\n        [break;]\n    : \n    : \n    case value\
    \ N:\n        [Action block N]\n        [break;]\n    [default:\n        [default\
    \ action block]\n        [ break ;]\n    ]\n}\n```\n\nIt can be observed in the\
    \ preceding syntax that we have used square brackets at many places. The square\
    \ bracket indicates that the statements written within them are optional. The\
    \ term expression immediately succeeding the switch keyword refers to an expression\
    \ that can be evaluated to an integer constant or a character constant. Each case\
    \ option contains an integer constant or a character constant, which is known\
    \ as case label. The case labels always end with a colon (:).\n\nThe expression\
    \ value once evaluated is compared with the values specified along with the case\
    \ keyword from top to bottom. When the expression value matches with the case\
    \ value, the compiler starts to execute the statements mentioned in this case\
    \ of switch structure. To come out of a particular block of case within the switch\
    \ structure, we use"
