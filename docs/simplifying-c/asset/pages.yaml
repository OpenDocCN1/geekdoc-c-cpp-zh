  md: 'from 3.14 to 3.1415. If macro is used, these types of changes are to be done
    only at a single place. The convenience of changing a value at one place may not
    matter in small programs. However, in large programs, the usage of macros is almost
    inevitable. We can also use the variable PI = 3.14, instead of defining macro
    using the preprocessor directive. But it is not a good idea. Preprocessor replaces
    macro body wherever macro name is found throughout the program. This reduces the
    task of compiler. Thus, the compilation time is reduced at a large extent.


    Macro allows us to write modular programs to certain extent. We can create a library
    of C macros similar to C functions. The next section discussed the differences
    between macro and functions.


    # Macros versus Functions


    We have seen macros with arguments in Programs 9, 10, and 11. The operation that
    we performed in these programs using macro could also be performed using functions.
    When we make a call to function, it is referred to as function call, while macro
    when called is termed as macro call. Both of them look alike; hence a question
    may arise whether it is better to use a macro or a function? If both are same,
    either can be used in any situation. However, though function calls and macro
    calls look alike, both of them are not same. There is a difference in their working.
    Table 2 describes the difference between macros and functions:


    | Table 2: Macros versus Functions |  |

    |---|---|

    | Macro | Function |

    | Macro call is replaced by macro expansion while processing the source code by
    the preprocessor. Macros are faster and efficient than functions. | Whenever a
    function is called, the control is passed to the function along with the arguments.
    After the calculations are performed, control is returned back to the main function.
    |

    | If a macro is called multiple times in a program, the macro body is replaced
    multiple times in a program. The size of the program may exceed if macros are
    used. | Program size remains compact even though the function call is made for
    several times in a program. |

    | No address is associated with macro identifier, and hence pointers cannot be
    used with macros. | Functions have their own addresses defined, and hence pointers
    can be used. |

    | When we pass the arguments to the macro, it never checks for their data types.
    It only checks for the number of arguments. | Function calls always check for
    data types as well as number of arguments. |


    It is clear from Table 2 that macros are typically used to associate meaningful
    identifiers with constants, keywords, and commonly used statements or expressions.
    The choice between using a macro and using a function is decided between the tradeoff
    of faster program execution versus smaller program size. Generally, we should
    use macros to replace small, repeatable code sections. It avoids the overheads
    associated with function calls. We should use functions for larger coding tasks
    that might require several lines of code.


    C language allows us to remove the definition of an existing macro. The next section
    shows us how a macro definition can be removed.'
