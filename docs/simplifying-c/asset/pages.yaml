    # ## Summary


    In this chapter, we have learned about the concept of structure and union. They
    are practically very useful when variables of different data type are to be grouped
    together in a program. The declaration of structure, defining structure variables,
    accessing structure variables, passing and returning entire structure through
    functions, and accessing individual members of a structure through functions are
    discussed using examples in this chapter. The usage of typedef to create synonyms
    of a structure is also explained. Difference between union and structure is discussed
    in this chapter. The usage of bit fields for saving memory space has also been
    discussed at the end of the chapter.


    # ## Review Questions


