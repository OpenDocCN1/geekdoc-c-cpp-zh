    | 3 | 80 | 85 | 55 | 60 |


    It can be observed in Table 1 that the data shows marks obtained by roll number
    1, 2, and 3 in English, Math, Science, and Drawing, respectively. The data here
    is represented in multiple dimensions as we have three rows and four columns.
    The data of listed in Table 1 can be easily represented in C using the two-dimensional
    array. If the marks obtained are assumed to be integer, then the syntax of a multidimensional
    array can be declared as follows:


    ```

    int i_mark[row size][column size];

    ```


    In the preceding syntax, row size refers to the roll number of student and column
    size refers to different subjects. Both these values are integer values. The entity
    i_mark[0][3] would then refer to marks obtained by roll number 1 in Drawing. Figure
    4 shows the memory representation of the multidimensional array:'
