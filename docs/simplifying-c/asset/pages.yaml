    In all the previous chapters, we have used input from the keyboard and displayed
    the output on the monitor. C language provides inbuilt function to handle input/output
    (I/O) operations. We have seen the use of the function scanf to accept input,
    the function getchar to read a single character at a time from the keyboard, the
    function printf for formatted output, the function putchar to output a single
    character on the monitor, the function gets to read a string from the keyboard,
    and the function puts to output a string on display terminal. The keyboard and
    monitor act as standard input and standard output devices.


    The aforementioned library functions serve the purpose of the programmers as long
    as small amount of data is to be processed and temporary input and output are
    required. However, real-life problems work on large volume of data stored on permanent
    storage. Voluminous data can be stored in a file and the contents of the file
    are retained even when the computer is switched off. In this chapter, we will
    discuss about the concept of files and the two different types of files, namely,
    text files and binary files. We will also discuss the use of different library
    functions to perform various operations on files.


    # ## 13.1 Concept of File


    A file is a collection of related data. For example, we have created structure
    in Chapter 11 to store contact details. However, we have observed that the data
    input by the user are stored in the form of variable values, which are stored
    in the memory. To retain the contents, these contents are to be transferred to
    a permanent storage. The primary'
