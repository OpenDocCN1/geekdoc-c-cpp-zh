    # 5.2  Precedence and Associativity of Operators


    C language designers have predefined the precedence and associativity of each
    operator used in C. The precedence of an operator tells the compiler the order
    in which the operators should be evaluated. In case two operators with the same
    precedence are part of an expression, then associativity is taken into account.
    The associativity of operators tells the compiler from which side (from left to
    right or vice versa) the expression should be resolved. Table 8 lists the operators
    along with their precedence and associativity:


    | **Operator Symbol** | **Usage** | **Precedence** | **Associativity** |

    | :--- | :--- | :--- | :--- |

    | ( ) | Function call | First | Left to Right |

    | [ ] | Array expression | | |

    | \(\rightarrow\) | Structure operator | | |

    | . | Structure operator | | |

    | \(+\) | Unary plus | | |

    | \(-\) | Unary minus | | |

    | \(+\)\(+\) | Increment | | |

    | \(-\)\(-\) | Decrement | | |

    | \(!\) | Logical NOT | Second | Right to Left |

    | \(~\) | Bitwise NOT | | |

    | \(*\) | Pointer operator | | |

    | \(&\) | Address operator | | |

    | sizeof (\) | Size of operand | | |

    | \(*\) | Multiplication | Third | Left to Right |

    | \(/\) | Division | | |

    | \(\%\) | Modulo division | | |

    | \(+\) | Binary addition | Fourth | Left to Right |

    | \(-\) | Binary subtraction | | |

    | \(\<\<\) | Left shift | Fifth | Left to Right |

    | \(\>\>\) | Right shift | | |

    | \(\<\) | Less than | Sixth | Left to Right |

    | \(\<\=\) | Less than equal to | | |

    | \(\>\) | Greater than | | |'
