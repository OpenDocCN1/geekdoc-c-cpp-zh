- pgno: 291
  md: 'purpose of a file is to store data in a nonvolatile storage device. The contents
    of primary memory get lost when the computer is turned off. Files are stored in
    secondary storage devices. Magnetic disk, commonly referred as hard disk, is the
    most common secondary storage device. Thus, contact details discussed in Chapter
    11 can also be stored in a file. The data in a file can be accessed later whenever
    required. There are two fundamental types of file, namely, text and binary files.
    The next section gives an idea about text files.


    # Text File


    A text file is meant to store textual information such as alphabets, digits, and
    special symbols in a computer. In real sense, the American Standard Code for Information
    Interchange (ASCII) codes of these characters are stored in text files. Text files
    are readable to the users. For example, a C program that we have written in this
    book can be opened in an editor and read by the user. This suggests that a C program
    file is a text file. Figure 1 shows examples of text files opened using Notepad
    editor:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_291_0.png)


    It can be observed in Figure 1 that all the contents of the file, including numbers,
    are visible to us. The file shown in Figure 1 is an example of fixed-width record.
    Observe that the contents in all the three columns visible in the figure 1 start
    at a fixed position and also ends at a fixed position within the file. Figure
    2 shows an example of another text file:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_291_1.png)


    In Figure 2, the start point and the end point of the contents cannot be demarked
    easily. This is a free-format text file. The next section discusses the concept
    of binary file.'
