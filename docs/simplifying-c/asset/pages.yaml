    # 4.3 Formatted Functions


    The formatted functions are considered to be all-purpose functions. These functions,
    as can be seen from Table 1, are used to input or output all type of data, may
    it be char, int, float, or double. The general syntax of the formatted function
    is shown in Figure 3:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_75_0.png)


    It can be seen in Figure 3 that the function name can be scanf or printf. The
    format specifier string indetifies the data type format in which the values of
    the variables are to be read or written. The identifier list consists of the address
    of variables in case of scanf and names of variables in case of print.

    Before we continue further, let us understand the concept of address and name
    of a variable. An identifier when defined in C program is associated with three
    entities, as shown in Figure 4:


