  md: 'into several numbers of subtasks, which are less complex but similar in nature.
    For example, we need to find maximum of 100 numbers. Instead of directly going
    for the solution, we break the task to find maximum of two numbers first, and
    then using the solution devised, we find maximum of 100 numbers.


    Let’s now write an algorithm for the problem of voting eligibility, which is shown
    in the following box:


    Step 1: Start

    Step 2: Define CAge, CStatus

    Step 3: Accept value of CAge

    Step 4: If CAge >= 18 go to step 5

    Else go to step 8

    Step 5: Accept value of CStatus

    Step 6: If CStatus = Indian go to step 7

    Else go to step 8

    Step 7: Print Eligible to Vote go to step 9

    Step 8: Print Not Eligible to Vote

    Step 9: Stop


    The flow of an algorithm is always sequential, which means that step 2 should
    come only after step 1 unless and until the user implicitly changes the flow.
    The implicit change of flow can be seen in step 4. The execution of step 5 depends
    on the result of the condition in step 4. If the condition is not satisfied, we
    directly execute step 8 and all the steps from 5 to 7 are skipped. The user needs
    to handle the change of flow in the sequence carefully. The preceding example
    had a scenario of forward jump. At times, we also have to jump backward. For example,
    if we are at step 6, and due to some conditions we jump to step 3, then it is
    known as backward jump.


    # ► Properties of an Algorithm


    Similar to a flowchart, no standard convention have been defined for writing an
    algorithm. However, we have provided a list of properties that a good algorithm
    should satisfy:


    +   - ☐ **Definite**: Precisely defined such that each step in the set of instructions
    has only one meaning.

    - ☐ **Effective**: All operations should be carried out exactly in finite time
    limit.

    - ☐ **Finite**: An algorithm should always have finite number of steps. After
    completion of these finite steps, the algorithm should stop.

    - ☐ **Input**: Algorithm may have zero or more inputs.

    - ☐ **Output**: Algorithm may have one or more outputs.


    The next section provides some examples for solving problems using the flowchart
    and algorithm methods.


    # Examples


    As we have learned about the three different techniques of solving problems, let’s
    now work on some problems. In this section, we have provided the solutions using
    techniques'
