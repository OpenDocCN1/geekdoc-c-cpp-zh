    # ### 7.4 Altering Execution Control Flow in Loops


    To alter the execution sequence within loops, C language provides us with four
    jump statements, as shown in Figure 9:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_160_0.png)


    These jump statements are break, continue, return, and goto. Each of the jump
    statement is used to alter the execution sequence.


    The break and return statements have been used in many programs discussed in this
    book. Both these statements are used to come out of the current scope. The scope
    may be a decision structure, a loop structure, or a program. Normally, return
    statement is used to come out of the scope with a returning value, and break statement
    is used with the case keyword within switch structure. It is recommended not to
    use these keywords in other constructs.


    In this section, we will discuss the remaining two jump statements, namely, goto
    and continue.


    # ■ The Goto Statement


    The goto statement is the preliminary execution sequence altering statement. It
    is used for conditional or unconditional alteration of the execution sequence.
    The syntax of using the goto statement is as follows:


    ```

    goto label;

    ```


    In the preceding syntax, the term label refers to an identifier defined in a program.
    A label is a special identifier that has its own name space in the memory. This
    name space only exists for the function containing the label; hence, the label
    names can be reused in different functions. The label identifier is the only identifiers
    in C language that can be used before it is declared. Figure 10 illustrates a
    forward jump and a backward jump using the goto statement.'
