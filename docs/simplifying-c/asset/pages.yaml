    # 8.9 Advantages of Functions


    A user can create single function for a program that has code length of 50 lines.
    However, if the code length of a program goes beyond 50 lines, using only single
    function may lead to problems. The program may become too large and complex, thus
    making maintenance of the program problematic. The testing and debugging of a
    program also becomes difficult. Testing is the process of reviewing and executing
    a program with the intent of detecting errors. Debugging is the process of isolating
    and correcting the errors present in the program. The use of functions in programs
    gives the following advantages:


    +   - Improves the readability of the program.

    - Allows us to follow a structured approach of programming.

    - Understanding and maintenance of program becomes easy.

    - Debugging of problems becomes easy as we need to work on the problematic function
    only, rather than the entire program source code.

    - Functions once written can be used to make a user-defined library, thus allowing
    the function to be used many times.


    # Summary


    In this chapter, we have learned about structured approach of programming. We
    have observed how C language allows us to use structured approach by using functions.
    We also learned about various components of C function such as the function prototype,
    function definition, called function, calling function, actual parameter, and
    formal parameter. The function in C language has been classified into two categories,
    namely, library functions and user-defined functions. Irrespective of the categories,
    there are four types of functions, namely, function with no parameter and no return
    value, function with no parameter and return value, function with parameter and
    return value, and function with parameter and return no return value. We have
    also learned that C function uses two parameter passing techniques called pass
    by value and pass by address. Then the use of recursive functions and command-line
    arguments are covered in this chapter. Finally, we discussed the four storage
    classes, namely, automatic, external, static, and register.'
