    # ■ Real


    Most of the financial and mathematical calculations require a real number in calculation.
    In such situations, the data type *int* does not work. To use real values in C
    language, we need to use keyword *float* as the data type. Float data type uses
    4 bytes of memory storage space and have a precision of six decimal digits in
    most cases. For higher precision values, keyword *double* is used instead of float.
    Double data types use 8 bytes of memory storage space and are precise up to 16
    decimal digits. We can also use *long* as a prefix to double. This increases the
    value range of double. Table 4 list a brief description of float data type:


    **Table 4: Description of Float Data Type**


    | Data Type | Memory Allocated by the Compiler in Bytes | Description | Precision
    Digits | Value Range |

    | :--- | :--- | :--- | :--- | :--- |

    | float | 4 | To store positive or negative numbers with decimal points | 6 |
    ±3.4E-38 to ±3.4E38 |

    | double | 8 | For storing real values with more precision than float | 15 | ±1.7E-308
    to ±1.7E308 |

    | long double | 10, 12, or 16 | For storing real values with the most precision
    (depends on compiler) | 18-19 | ±1.7E-4932 to ±1.7E4932 |'
