    # Points to Remember


    The proverb *practice makes man perfect* is to be always remembered by all the
    initial learners of C programming. Along with lot of practice, we need to remember
    the points mentioned in the following paragraph to reduce the mistakes committed
    during programming:


    +   1. All needed header files should be included before declaring the main( )
    function.

