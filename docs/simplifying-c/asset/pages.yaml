  md: 'It can be seen in Figure 10 that if two operators with the same priority appear
    in an expression, they are evaluated based on their associativity, in this case
    left to right. To modify the sequence of evaluation, we can make use of brackets.
    If we rewrite the expression as *result = first + second * (third − fourth) /
    fifth*; then the identifiers third and fourth will be subtracted initially, resulting
    in intermediate result 1. The intermediate result 1 will then be multiplied with
    the second, giving intermediate result 2. The intermediate result 2 will then
    be divided by fifth. Finally, addition with the first will be done. Figure 11
    shows the evaluation order of the new expression:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_113_0.png)


