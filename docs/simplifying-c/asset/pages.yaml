    # 2.7 Creation and Execution of a C Program


    In the previous sections, we have discussed about C programs and their outputs
    without bothering about how to create and execute them. Let us now learn how to
    create and execute the C program. The steps that we need to perform while creating
    and executing C program are as following:


    +   1. Create a C program using any text editor. This program is known as a *source
    code* or a *source program*. The extension of the executable C program is .c.

    2. We then compile the source program using a C compiler. A C compiler consists
    of two different programs, namely, a preprocessor and a translator. The preprocessor
    removes all the preprocessor directive statements from the source code and prepares
    the source code for translation. The translator then converts the source code
    into a machine language code, and vice versa. The machine language code is known
    as an *object code* or an *object program*. The extension of the object code is
    .obj.

    3. The object code is then linked, if needed, with the library functions giving
    *executable code* or *executable program*. The extension of the executable code
    is .exe. For linking the object code with the object code of inbuilt functions
    used in a C program, we use a program called linker. The linker is needed in C
    as most of the operations that we perform in C have been provided as inbuilt functions.

    4. Finally, the executable code is loaded to the memory by a program called loader,
    along with the data required to give us the output. The data required for execution
    of program can be fetched from a file or entered by the user. Once the program
    finishes its work, the control is returned to the operating system by removing
    the program from the memory.


    Only four steps have been mentioned in this section; however, in practical scenario,
    five steps are performed. Some of the steps are automatically handled by the translator;
    hence, the user need not bother about them. Figure 5 depicts the entire process
    of creating and executing a C program:'
