  md: "# ■ **The Multiway Selection**\n\nAt times we need to make a multiway selection\
    \ based on several conditions. C supports two decision structures, namely, if-else\
    \ ladder and switch, which allow multiway selection. The if-else ladder is a variant\
    \ of the if-else statement studied earlier, while switch has its own structure.\
    \ The next subsection discusses how to use the if-else ladder.\n\n# ■ **The If-Else\
    \ Ladder Statement**\n\nThe if-else ladder is more commonly known as else-if ladder\
    \ as it associates the else statement with another if. The ladder is formed by\
    \ cascading several conditions else part with if statement. The conditions are\
    \ evaluated from top to bottom in the ladder. As soon as one of the test conditions\
    \ is evaluated to true, its corresponding action block is executed. Once the execution\
    \ of the true action block is over, the execution of the entire if statement stops.\
    \ The syntax of the else if ladder is as follows:\n\n```\n```\nif( test condition\
    \ 1 )\n    action statement 1;\nelse if( test condition 2 )\n    action statement\
    \ 2;\n:\n:\nelse if (test condition n)\n    action statement n;\nelse\n    default\
    \ action statement;\n```\n```\n\nIt can be observed in the preceding syntax that\
    \ we start with the if-else statement, then with every else statement we have\
    \ appended the if statement. The last else statement becomes a default action\
    \ statement. In case all the test conditions are evaluated to false, the default\
    \ action statement would be executed. Figure 7 shows the logical flow of the else-if\
    \ ladder:\n\n![](img/5d422ba7108ffdf64376be51eaf0c459_131_0.png)"
  merge: -1
  img_proc: true
