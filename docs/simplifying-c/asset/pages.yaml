  md: "```\nEnter Rate of interest: 10\nEnter Duration: 1\nCalculated Simple Interest\
    \ is : 100.00\n```\n\nIn Program 9, we have defined a macro named SI with three\
    \ arguments, namely, Principal amount (p), Rate of Interest(r), and Duration of\
    \ deposit (n). The macro body contains the expression ((p * r * n )/100). The\
    \ statement f_si = SI(i_principal, f_roi, i_duration) will be converted to f_si\
    \ = ((i_principal * f_roi * i_duration) /100) by the preprocessor before sending\
    \ it to the translator. This replacement of the macro body is termed as macro\
    \ call, as it is not simple replacement, but replacement with argument value substitution.\n\
    \nBe careful not to leave blank between macro name and opening braces containing\
    \ arguments. For example, no space should be left between SI and (p, r, n) in\
    \ the definition #define SI(p, r, n) ((p * r * n ) / 100). In case we leave a\
    \ blank space between the macro name and its arguments, say, #define SI (p, r,\
    \ n) ((p * r * n) / 100), the preprocessor will consider SI as the macro name\
