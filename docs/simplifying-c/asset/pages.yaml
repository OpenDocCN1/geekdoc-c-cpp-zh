    | a | To open a text file for appending contents at the end of the file. If the
    file already exists, its contents will be retained. If the file does not exist,
    an attempt to create a file will be made. |

    | r+ | To open a text file for both reading and writing. A file must exist if
    it is to be opened in a read plus mode. |

    | w+ | To create a text file both for reading and writing. If the file already
    exists, its contents will be overwritten. If a file does not exist, an attempt
    to create a file will be made. |

    | a+ | To open a text file both for reading and appending. If the file already
    exists, its contents will be retained. If the file does not exist, an attempt
    to create a file will be made. |

    | rb | To open a binary file for reading. A file must exist if it is to be opened
    in a read mode. |

    | wb | To write contents in a binary file. If the file already exists, its contents
