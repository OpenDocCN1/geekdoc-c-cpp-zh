- pgno: 161
  md: '![](img/5d422ba7108ffdf64376be51eaf0c459_161_0.png)


    ▲ Figure 10: Forward and Backward Jumps Using the Goto Statement


    It can be observed in Figure 10 that an unconditional goto statement jumps to
    the specified label directly. While in case of conditional jump, we jump only
    when a condition is satisfied. The jumps are defined as forward jump or backward
    jump. If the execution control flow moves to statements below the use of goto
    statement, the jump is known as a forward jump. If the execution control flow
    moves to statements above the use of goto statement, the jump is known as a backward
    jump. As it is not recommended to use the goto statements in structured programming,
    hence detailed discussion of this topic has not been included in this book.

    Another statement that alters the flow of execution is the continue statement.
    The next subsection discusses about the use of continue.


    # ■ The Continue Statement


    The continue statement in C language is used to skip certain statements of the
    loop. It skips the execution of the statements that are written below the continue
