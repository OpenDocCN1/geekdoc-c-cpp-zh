    # 12.3 Pointer Expressions


    Similar to other variables, the pointer variables can also be used in expressions.
    For example, if ptr1 and ptr2 are properly declared and initialized pointers,
    then the following statements are valid:

    ```

    mult = *ptr1 * *ptr2;

    sum = sum + *ptr1;

    total = *ptr2 / *ptr1 + 17;

    *ptr2 = *ptr2 + 40;

    ```


