  md: 'This extra byte padding is also referred to as struct member alignment. The
    extra bytes padded to align the address are known as holes. This padding is done
    so that each member of the structure can be accessed faster without delays. Modern
    Central Processing Units (CPUs) perform better in data transfer when the fundamental
    data types, such as integer and float, are stored in the memory addresses that
    are in multiples of their length. The data members that have unaligned memory
    allocation require extra data transfer, thereby resulting in performance degradation.


    It is advisable to group members of the same data type together at the time of
    structure declaration to minimize the extra padded bytes needed for the alignment.
    For example, if the structure declaration shown in Figure 4 is defined as shown
    in Figure 5, the single structure member will occupy 60 bytes instead of 64 bytes:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_237_0.png)


    ▲ Figure 5: Structure with Rearranged Structure Members


    It can be seen in Figures 4 and 5 that two structures with the same data elements,
    but with different arrangement of data elements, make a different sized structure.


