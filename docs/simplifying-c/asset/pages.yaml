    }\n/* End of function main */\n```\n```\n\n**Output:**\n```\nThe size of structure\
    \ contact is 64\n```\n\nIt can be observed in Program 1 that the output of the\
    \ program is 64 bytes and not 59 bytes, as expected. The compiler when allocating\
    \ memory to the structure variable adds additional bytes, if needed, to align\
    \ all the addresses of the data members according to the largest sized data member.\
    \ This is the reason we get the size as 64 bytes instead of 59 bytes.\n\nLet us\
    \ try to understand this concept more clearly. In case of the template contact,\
    \ the char data type occupies 1 byte, while the unsigned long int occupies 4 bytes.\
    \ The larger size out of the two is 4 bytes. Therefore, the compiler will align\
    \ all the variable addresses in the multiple of 4. The first variable c_name will\
    \ thus occupy 28 (25 + 3) bytes, the unsigned long int will occupy 4 bytes, and\
    \ the c_email will occupy 32 (30 + 2) bytes. The compiler has added 3 + 2 = 5\
    \ bytes extra to align all the structure members evenly, as shown in Figure 4:\n\
    \n![](img/5d422ba7108ffdf64376be51eaf0c459_236_0.png)"
