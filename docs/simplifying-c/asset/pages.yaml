    # 3.3 User-Defined Data Type


    C language is a flexible language; it allows the users to create new entities
    from the existing one. We can create a new data type by making use of the existing
    data type. The keyword typedef is used in C language to create a new data type.
    It is used to define a variable that can be used as data type in our program.


    # Type Definition


    The syntax for using type definition is as follows:


    ```

    typedef datatype identifier;

    ```


    where datatype refers to an existing data type and the data type used can be primitive
    or derived. Identifier refers to new name that we want to assign to the available
    data type. In real sense, C language does not allow us to create a new data type.
    Instead, it allows us to give an alias to an existing data type. Some examples
    of the usage of type definition are as follows:


    ```

    typedef int Num;

    typedef long Big;

    ```


    The first example gives an alias Num to the integer data type, while the second
    example gives an alias Big to the modifier long. The new identifiers can now be
    used to declare an integer variable. The example of the usage of alias is as follows:


    ```

    Num i_roll_no;

    Big i_amount;

