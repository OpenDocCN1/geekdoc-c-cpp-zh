    / * End of function main */\n```\n\nOutput 1:\n\n```\nEnter the values: 4557.76g\n\
    Values of the variables are 4557 0.760000 g\n```\n\nOutput 2:\n\n```\nEnter the\
    \ values: 75 65.50 t\nValues of the variables are 75 65.500000\n```\n\nIn Program\
    \ 1, we have used three variables: two are numeric and one character. The program\
    \ just asks us to enter the values without specifying the order in which we need\
    \ to enter. In addition, we observed that the format string does not have any\
    \ separators to separate the format codes.\n\nIn Output 1, the user would like\
    \ to enter 45, 57.76, and g in the variables. However, C allocates the values\
    \ as 4557, 0.760000, and g. Out of the three values entered, only one value seems\
    \ to be as per the choice of the user. Let us try to understand what happened\
    \ here. The user entered 4557.76g from the keyboard without inserting any separator\
    \ in between the values. The data from the keyboard generated a stream of characters.\
    \ At the time when the result was to be printed, the output function tried to\
    \ convert the data into integer. As the stream data 4557 did not have any decimal\
    \ place in between, it was assumed to be an integer. When . (dot) was read from\
    \ the stream, the compiler tried to map it with the next variable data type; hence,\
    \ .76 was allocated to variable d_second, and finally, g was allocated to c_choice.\n\
    \nTo solve this problem, the user in Output 2 enters the data using space as a\
    \ separator. The entry that the user does here is 75, 65.50, and t. It can be\
    \ seen that the first two variables are assigned appropriate values, while the\
    \ last one seems to be wrong. In fact, the output is absolutely correct. In this\
    \ case also, the data is first converted to stream. When the first space is encountered,\
    \ the value 75 is allocated to i_first. then the compiler drops the space and\
    \ allocates 65.50 to d_second. The space after 65.50 is the problem here, as space\
    \ is also considered a valid alphabet of C language and the compiler allocates\
    \ the value of space to c_choice. As space indicates a nonprintable character,\
    \ it is not"
