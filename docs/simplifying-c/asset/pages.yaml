    ▲ Figure 1: String Format


    It can be seen in Figure 1 that in all the string formats, one additional character
    is required. In case of fixed-length string, we need to specify a delimiter that
    identifies the end of string. This delimiter cannot become a part of the string
    data as it works as end of string marker. For example, in Figure 1, * has been
    used as delimiter; hence, if we write a string Ahme*dabad, it will be converted
    to two string Ahme and datab. Same is the case with the delimited strings; the
    only difference is the amount of memory space occupied in memory. In case of fixed-length
    strings, if the number of characters in the string is less than the allocated
    fixed size, then the remaining memory blocks will always be wasted. The length-controlled
    strings require the string to start with a numeric value that identifies the number
    of characters in the string.

    C language allows both fixed-length as well as variable-length string formats.
    The next section discusses how to define a string using character array.


    # 10.2 Character Array as String


    C language allows us to group set of characters terminated by a null character
    (\0) together to generate meaningful data entities. This sequence of characters
    is known as a string. The syntax of defining a character array is as follows:


    ```

    char identifier name[size];

    ```


    where the identifier name refers to any valid C variable name and the size is
    the total number of characters that can be stored in the array. As C uses a delimiter
    to mark end of string, the number of characters that can be stored in the array
    will always be one less than the size of array. For example, the definition char
    s_name[10]; defines a character array called s_name capable of storing 10 characters.
    The array here can store only one name and is considered as one dimensional. Figure
    2 shows the representation of the string s_name.'
