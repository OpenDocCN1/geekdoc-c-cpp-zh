    # Multidimensional array


    Most of the data that we use is represented in multiple dimensions. For example,
    consider the data given in Table 1:


    | | English | Math | Science | Drawing |

    | :-- | :-- | :-- | :-- | :-- |

    | **Table 1: Sample Data** | | | | |

