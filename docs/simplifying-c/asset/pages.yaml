    # ► Example 1:


    Mr. Ramesh has purchased a rectangular-shaped land that is 150 m in length and
    200 m in breadth. Calculate the area of the land.


    # Solution 1:


    +   a. Using a flowchart, the area of the land can be calculated as follows:


    The formula to compute the area of a rectangular surface is: Area = Length × Breadth


    Keeping this formula in mind, we can devise a solution using the flowchart and
    algorithm.


    We will use three variables, namely, area, length, and breadth, to solve this
    problem.


    Figure 4 shows the flowchart to calculate the area of the rectangular surface:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_26_0.png)


    ▲ Figure 4: Flowchart to Calculate the Area of the Rectangular Surface


    Figure 4 shows that the two variables length and breadth have been assigned constant
    values of 150 and 200, respectively. Therefore, every time we use this flowchart,
    the output of area available will always be 30,000 m². In addition, note that
    the flow execution starts at top and flows down toward bottom.


    +   b. Using an algorithm, the area of the land can be calculated as follows:


    The following box shows the algorithm method to solve the given problem:


    ```

    Step 1: Start

    Step 2: Define length, breadth, area

    Step 3: length = 150

    Step 4: breadth = 200

    Step 5: area = length × breadth

    Step 6: Print value of area

    Step 7: Stop

    ```


    The flowchart and algorithm created to calculate the area of the rectangular surface
    are considered to be static solution. The reason for calling the solution a static'
