    raisetopower is a recursive function. Observe the last statement of the function,
    that is, return (i_number * raisetopower(i_number, i_power - 1)); In this statement,
    a call is again made to function raisetopower. Figure 12 illustrates how the function
    recursion works for Program 7:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_190_0.png)


    # Figure 12: Recursive Function Call


    It can be seen in the Figure 12 that the one call of the function raisetopower
    within the function main recursively generates additional two calls. It can be
    seen that we are not able to return any value back to the calling functions until
    the call number 3 is processed. Once the function call number 3 receives value
    1, its execution is completed. Similarly, the function call 2 receives value 3,
    and finally, the function call number 1 receives value 9 that is assigned to the
    variable i_result. The symbol shown in Figure 12 indicates that after returning
    the values, the function is removed from the stack.


    Recursive functions can be effectively used to solve problems where the solution
    is expressed in terms of applying the same solution repeatedly. The use of recursive
    function also reduces the size of the program code and the program looks simpler.
    The only disadvantage of the recursive function is the memory requirement. With
    every call, the memory contents of the recursive function are replicated. A user
    should begin with the iterative solutions of a program first and then try to convert
    them to recursive solution.


    The next section discusses a concept called command line arguments.'
