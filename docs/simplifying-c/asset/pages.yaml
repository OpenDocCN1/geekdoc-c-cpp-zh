    \ the macro TRUE defined in Program 10, the statement #undef TRUE can be used.\
    \ Once a macro has been undefined, the identifier associated with that macro can\
    \ be reused to define another macro in a subsequent #define directive.\n\nC has\
    \ a rich collection of directives; the next section discusses the conditional\
    \ compilation directives available with C.\n\n# ### 15.5 Conditional Compilation\n\
    \nSo far we have seen that statements in C program are executed sequentially.\
    \ To change the sequence of execution, or skip some statements, or execute one\
    \ set of statements on one condition and another set on other condition, we have\
    \ discussed sequence control structures in Chapter 6. A preprocessor conditional\
    \ compilation directive causes the preprocessor to compile portions of the source\
    \ code based on conditions specified by the user. These directives test a constant\
    \ expression or an identifier to determine which tokens the preprocessor should\
    \ pass on to the compiler and which tokens should be bypassed during preprocessing.\
    \ Table 3 lists the various directives and their purpose:\n\n| Directive | Purpose\
    \ |\n| :--- | :--- |\n| #if | The code following the #if directive will be executed\
    \ only when the condition specified along with #if is true |\n| #ifdef | To check\
    \ whether the macro is defined or not |\n| #else | To specify alternate code to\
    \ be executed in case of if condition failure |\n| #ifndef | To specify set of\
    \ statements to be executed if macro is not defined |\n| #elif | To specify alternate\
    \ condition in case of if condition failure |\n| #endif | End of if expression\
    \ |\n\nWe have defined macro CUBE in Program 11. Program 12 illustrates the usage\
    \ of #ifdef directive to check whether CUBE is defined or not. If defined, the\
    \ statements following the #if directive will be compiled.\n\n▶ Program 12\n\n\
    ```\n```\n/* Program to illustrate the #ifdef conditional compilation directive\
    \ */\n#include<stdio.h>\n#define CUBE(i_x) (i_x * i_x * i_x)\n#define TRUE 1\n\
    main()\n{\n  int i_num = 10,i_result;\n  #ifdef CUBE\n  i_result= 1000 / CUBE(i_num);\n\
    ```\n```"
