    In Program 3, we have declared three integer variables named i_first, i_second,
    and i_sum, and three pointers variables named p_x, p_y, and p_sum. The statement
    p_x = &i_first; indicates that p_x points to i_first. Similarly, p_y points to
    i_second and p_sum points to i_sum. Later in the program, the pointers are used
    to store the input values provided by the user. Note that in the scanf statements
    used in this program, the pointers p_x and p_y are not prefixed with & as in usual
    scanf statements. This is because the pointer variables p_x and p_y themselves
    contain an address. As discussed earlier, the value stored at address, which is
