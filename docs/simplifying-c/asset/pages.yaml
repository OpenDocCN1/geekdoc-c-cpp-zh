    if(i_num >= 0).


    One has to be cautious about deciding the terminating condition while using the
    for loop as an event-controlled loop. In the case of Program 5, the loop terminates
    only when the user enters a number 0. When the user enter 0, the compiler evaluates
    the condition if(i_num >= 0) to true, then the condition if(!i_num) is evaluated
