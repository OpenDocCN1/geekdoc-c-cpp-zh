    # ## 2.4 Structure of a C program


    From Program 1 and 2, we can say that a C program is a collection of blocks called
    functions. A function is made up of one or more statements used for performing
    a predefined task. Figure 2 shows a complete structure of a C program:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_41_0.png)


    Figure 2 shows that two sections are optional sections and may or may not be present
    in a program. However, the compulsory section that contains the function main
    will always be present in a C program.


    Each of the sections shown in Figure 2 are discussed in detail in the following
    subsections.


    # ■ Documentation Section


    Documentation section is an optional section in the structure of a C program.
    As the name indicates, it is used for the purpose of documentation and normally
    includes details such as purpose of program, author details, important logical
    aspects, and date of creation. The statements within this section are called comment
    lines in C. C program uses an opening (/*) and closing (\*/) tokens to represent
    a comment. Whenever the text is enclosed between /* and \*/, it is considered
    as a comment in C. Comments are not processed by C compiler and are left as they
    are.'
