    # 13.5 Characters and File


    Once a file has been opened, it is ready to read, or write, or both, as specified
    in a mode. In Chapter 4, the functions getchar and putchar were discussed to read
    characters from standard input device and display characters on standard output
    device. The function getchar accepts single character from a file, and the function
    putchar displays single character at a time on the screen. Similarly, to write
    a single character to a file, the function fputc can be used.


    The function fgetc can be used to read a single character from a file. Remember
    that a file pointer is associated with each file when a file is opened. The file
    pointer is positioned at the beginning of the file when it is opened. The function
    fputc writes one character in a file where a file pointer is positioned. It then
    advances the file pointer by one character. Thus, next time when the function
    fputc is called, a new character is written at the next position. After the character
    is written, the file pointer is advanced by one character again. Figure 4 illustrates
    how the function works:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_297_0.png)


    **Figure 4: Working of the Function fputc**


    Similarly, the function fgetc returns a character that is positioned at the file
    pointer. It then advances file pointer by one character. Thus, next time when
    the function fgetc is called, it returns next character.


    The syntax for the usage of function fputc is as follows:'
