  md: 'Program 12 demonstrates two different methods to pass a two-dimensional array
    as a function parameter. It contains a function named getdata to accept the values
    of elements of two-dimensional array. The getdata function accepts base address
    of the two-dimensional array being passed to it as an ordinary integer pointer.
    Then, the values of array are scanned using the nested for loop. Note the expression
    i_tempmat + i_row * 3 + i_col in the scanf statement. This expression is used
    to reach individual elements of an array. For example, i_row is 1 and i_col is
    2, and base address is 65510, then the value of 65510 + 1 * 3 + 2= 65530 will
    be scanned. This address is the address of element i_mat[2][1]. It is assumed
    that integer occupies 4 bytes for calculations. Figure 15 shows how the two-dimensional
    array elements are accessed using pointer arithmetic:


    ![](img/5d422ba7108ffdf64376be51eaf0c459_280_0.png)


    ▲ Figure 15: Individual Two-Dimensional Array Elements Address Access in Functions


    The other function that accesses two-dimensional array in Program 12 is sumofarray.
    We pass the variable i_mat that refers to the address of the first element of
    the two-dimensional array to this function. The parameters that accepts the value
    of i_mat within the function sumofarray is i_tempmat[][3]. Here, i_tempmat is
    a pointer to an array of three integers per row. The advantage of accepting array
