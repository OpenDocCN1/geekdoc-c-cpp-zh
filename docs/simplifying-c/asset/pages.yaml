  md: '# 01 Introduction to Logic Development


    # **OBJECTIVES**


    +   Describe Steps for Solving Problem

    Describe Techniques of Solving Problem


    **N**owadays, computers are capable of solving numerous problems. The problems
    can be as simple as adding two numbers or as complex as launching a missile. People
    who use computer most of the time assume that a computer does all the work on
    its own; however, it is not true. Any problem whose solution is not known cannot
    be solved using a computer. A computer only works on the set of instructions given
    to it by a programmer. If it does not understand any of the given instructions,
    the solution may go haywire. Hence, the sole responsibility of devising a solution
    to the problem lies in the hands of the programmer. This chapter discusses a general
    approach of solving a problem and various techniques used to reach to a solution
    of any given problem.


    # 1.1 Steps for Solving Problem


    As mentioned earlier, it is humans who solved the problems, not the computers.
    A computer simply assists us in solving the problems faster. Irrespective of the
    type and complexity of problems, we need to follow the steps mentioned below to
    solve them:


    +   Define the problem

    Identify the input, output, and constraints

    Find various alternative solutions

    Select the best possible alternative

    Prepare detailed stepwise result for the identified alternative

    Compute the required result using the identified set of instructions

    Check the correctness of the answer obtained


    These steps, though look simple, require a good amount of efforts from the user
    while devising. The steps 1 through 5 are all performed by the user. The work
    of a computer comes into picture only in the 6$^{th}$ and 7$^{th}$ steps. This
    simply suggests that the critical part of achieving the solution to a problem
    is done by the user.


    Let''s take an example of a problem. Assume that we need to know whether Mr. Mohit
    Arolkar is eligible to vote in assembly elections for India or not. To get an
    answer to the preceding problem, knowledge of two things is important: the current
    age and citizenship status of Mr. Mohit Arolkar. Therefore, two main inputs to
    solve the given problem would be current age and citizenship status. If the current
    age and citizenship status are provided to the computer through instruction, the
    solution is applicable for any person'
  merge: -1
  img_proc: true
