  md: '# 4.3 Equality Comparison and Three-Way Comparison


    ![](img/c60a87adb7f61e2e82071d081bbb389a_156_0.png)


    C++20 empowers you to define or autogenerate the equality operator. The equality
    operator determines for two values A and B, whether A == B, or A != B. Additionally,
    if your values A and B should support ordering, use the three-way comparison operator
    <=>. The three-way comparison operator is often called the spaceship operator.
    The spaceship operator determines for two values A and B, whether A < B, A ==
    B, or A > B. As with the equality operator, you can define the spaceship operator,
    or the compiler can autogenerate it for you.


    To appreciate the advantages of the three-way comparison operator, let me start
    with the classical way of doing it.


    # 4.3.1 Comparison before C++20


    I implemented a simple int wrapper MyInt. Of course, I want to compare MyInt.
    Here is my solution using the function template `isLessThan`.'
  merge: -1
  img_proc: true
