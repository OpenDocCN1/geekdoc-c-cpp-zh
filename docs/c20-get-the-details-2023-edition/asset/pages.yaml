- pgno: 631
  md: "# Accessing a private attribute\n\n```\n```cpp\nclass X {\npublic:\n    void\
    \ f(int n)\n        [[ expects: n < m ]] // error; m is private\n    {\n     \
    \   [[ assert: n < m ]]; // OK\n        // ...\n    }\nprivate:\n    int m;\n\
    };\n```\n```\n\nThe attribute m is private and cannot, therefore, be part of a\
    \ precondition. By default, a violation of a contract terminates the program.\n\
    \nYou can adjust the behavior of the attributes.\n\n# 8.2.1.1 Fine-tune Attributes\n\
    \nThe syntax for adapting the attributes is quite elaborate: [[contract-attribute\
    \ modifier: conditional-expression ]]\n\n+   * contract-attribute: expects, ensures,\
    \ and assert\n+   * modifier: specifies the contract level or the enforcement\
    \ of the contract; possible values are default, audit, and axiom\n+     * default:\
    \ the cost of run-time checking should be small; it is the default modifier\n\
    +     * audit: the cost of run-time checking is assumed to be large\n+     * axiom:\
    \ the predicate is not checked at run time\n+   * conditional-expression: the\
    \ predicate of the contract\n\nFor the ensures attribute, there is additionally\
    \ an identifier available: [[ensures modifier identifier: conditional-expression\
    \ ]]\n\nThe identifier lets you refer to the return value of the function."
