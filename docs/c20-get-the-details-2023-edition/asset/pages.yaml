  md: '# ## 6.1 Coroutines


    ![](img/c60a87adb7f61e2e82071d081bbb389a_437_0.png)


    Coroutines are functions that can suspend and resume their execution while keeping
    their state. The evolution of functions in C++ goes one step further.


    # ### The Challenge of Understanding Coroutines


    It was quite a challenge for me to understand coroutines. I strongly suggest that
    you should not read the sections in the chapter in sequence. Skip in your first
    iteration the sections The Framework, Available and Awaiters, and The Workflow.
    Furthermore, read the case studies Variations of Futures, Modification and Generalization
    of a Generator, and Various Job Workflows. Reading, studying, and playing with
    the examples provided should give you the initial intuition needed to dive into
    details and the workflow of coroutines.


    What I present in this section as a new idea in C++20 is quite old. The term coroutine
    was coined by Melvin Conway¹. He used it in his publication on compiler construction
    in 1963. Donald Knuth² called procedures a special case of coroutines. Sometimes,
    it just takes a while to get your ideas accepted.


    ¹https://en.wikipedia.org/wiki/Melvin_Conway

    ²https://en.wikipedia.org/wiki/Donald_Knuth'
