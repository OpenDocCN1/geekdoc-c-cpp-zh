  md: "# Member functions of a `std::latch`\n\n| Member function | Description |\n\
    |---|---|\n| `std::latch latch(cnt)` | Creates a `std::latch` with counter `cnt`.\
    \ `cnt` must be a signed integral. |\n| `lat.count_down(upd = 1)` | Atomically\
    \ decrements the counter by `upd` without blocking the caller. |\n| `lat.try_wait()`\
    \ | Returns true if counter == 0. |\n| `lat.wait()` | Returns immediately if counter\
    \ == 0. If not blocks until counter == 0. |\n| `lat.arrive_and_wait(upd = 1)`\
    \ | Equivalent to `count_down(upd); wait();`. |\n| `std::latch::max` | Returns\
    \ the maximum value of the counter supported by the implementation |\n\nThe default\
    \ value for upd is 1. If upd is greater than the counter or negative, the behavior\
    \ is undefined. The call `lat.try_wait()` never actually waits, as its name suggests.\n\
    \nThe following program shows `bossWorkers.cpp` uses two `std::latch` to build\
