  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_212_0.png)\n\n# ### 4.7.3.2 Stateless\
    \ Lambda\n\nA stateless lambda is a lambda that captures nothing from its environment.\
    \ Or, to put it another way, a stateless lambda is a lambda where the initial\
    \ brackets `[]` in the lambda definition are empty. For example, the lambda expression\
    \ `auto add = [](int a, int b){ return a + b; };` is stateless.\n\n# ### 4.7.3.3\
    \ Adapting Associative Containers of the Standard Template Library\n\nBefore I\
    \ show you the example, I must add a few remarks. Container `std::set` and all\
    \ other ordered associative containers from the Standard Template Library (`std::map`,\
    \ `std::multiset`, and `std::multimap`) use the function object `std::less` to\
    \ sort the keys. `std::less` sorts all keys lexicographically in ascending order\
    \ by default. The declaration of `std::set`[^28] shows the implicit usage of `std::less`.\n\
    \nDeclaration of `std::set`\n\n```\n~~~cpp\ntemplate<\n    class Key,\n    class\
    \ Compare = std::less<Key>,\n    class Allocator = std::allocator<Key>\n> class\
    \ set;\n~~~\n```\n\nNow, let me play with the ordering.\n\n[^28]: https://en.cppreference.com/w/cpp/container/set"
