    # ### 6.1.2 Characteristics


    Coroutines have a few unique characteristics.


    # #### 6.1.2.1 Typical Use Cases


    Coroutines are the usual way to write event-driven applications¹, which can be
    simulations, games, servers, user interfaces, or even algorithms. Coroutines are
    also typically used for cooperative multitasking². The key to cooperative multitasking
    is that each task takes as much time as it needs but avoids sleeping or waiting
    and instead allows some other task to run. Cooperative multitasking stands in
    contrast to pre-emptive multitasking, for which we have a scheduler that decides
    how long each task gets the CPU.


    There are different kinds of coroutines.


    # #### 6.1.2.2 Underlying Concepts


    Coroutines in C++20 are **asymmetric**, **first-class**, and **stackless**.


    The workflow of an **asymmetric** coroutine goes back to the caller. This does
    not hold for a **symmetric** coroutine. A **symmetric** coroutine can delegate
    its workflow to another coroutine.


    **First-class** coroutines are similar to first-class functions, since coroutines
    behave like data. Behaving like data means that you can use them as arguments
    to or return values from functions, or store them in a variable.


    A **stackless** coroutine can suspend and resume the top-level coroutine. The
    execution of the coroutine and the yielding from the coroutine comes back to the
    caller. The coroutine stores its state for resumption separate from the stack.
    **Stackless** coroutines are often called resumable functions.


    ¹ https://en.wikipedia.org/wiki/Event-driven_programming

    ² https://en.wikipedia.org/wiki/Computer_multitasking'
