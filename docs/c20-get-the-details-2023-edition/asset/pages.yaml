    \ instead of unconstrained placeholders in action\n\n# 4.1.6 Abbreviated Function\
    \ Templates\n\nWith C++20, you can use an unconstrained placeholder (auto) or\
    \ a constrained placeholder (concept) in a function declaration including member\
    \ functions and operators. This function declaration automatically becomes a function\
    \ template.\n\nAbbreviated function templates\n\n```\n```cpp\n// abbreviatedFunctionTemplates.cpp\n\
    \n#include <concepts>\n#include <iostream>\n\ntemplate<typename T>\nrequires std::integral<T>\n\
    T gcd(T a, T b) {\n    if( b == 0 ) return a;\n    else return gcd(b, a % b);\n\
    }\n\ntemplate<typename T>\nT gcd1(T a, T b) requires std::integral<T> {\n    if(\
    \ b == 0 ) return a;\n    else return gcd1(b, a % b);\n}\n\ntemplate<std::integral\
    \ T>\nT gcd2(T a, T b) {\n    if( b == 0 ) return a;\n    else return gcd2(b,\
    \ a % b);\n}\n\nstd::integral auto gcd3(std::integral auto a, std::integral auto\
    \ b) {\n    if( b == 0 ) return a;\n    else return gcd3(b, a % b);\n}\n```\n\
    ```"
