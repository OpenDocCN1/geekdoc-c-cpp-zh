  md: '# ### 4.1.3 The long, long History


    The first time I heard about concepts was around 2005 - 2006. They reminded me
    of Haskell type classes. Type classes in Haskell are interfaces for similar types.
    Here is a part of [Haskell’s](https://en.wikipedia.org/wiki/Haskell_(programming_language))
    type classes hierarchy.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_58_0.png)


    Haskell Type Classes Hierarchy


    But C++ concepts are different. Here are a few observations.


    +   - In Haskell, any type has to be an instance of a type class. In C++20, a
    type has to fulfill the requirements of a concept.

    +   - Concepts can be used on non-type arguments of templates in C++. For example,
    numbers such as the value 5 are non-type arguments. For example, when you want
    to have a `std::array` of ints with 5 elements, you use the non-type argument
    `5:std::array<int, 5> myArray`.

    +   - Concepts add no run-time costs.


    Originally, concepts were going to be the main feature of C++11, but they were
    removed during a standardization meeting in July 2009 in Frankfurt. The quote
    from Bjarne Stroustrup speaks for itself: “*The C++0x concept design evolved into
    a monster of complexity.*” A few years later, the next try was also not successful:
    concepts lite was removed from the C++17 standard. They finally became part of
    C++20.


    # ### 4.1.4 Use of Concepts


    Essentially, there are four ways to use a concept.


    [^1]: https://en.wikipedia.org/wiki/Haskell_(programming_language)

    [^2]: https://isocpp.org/blog/2013/02/concepts-lite-constraining-templates-with-predicates-andrew-sutton-bjarne-s'
