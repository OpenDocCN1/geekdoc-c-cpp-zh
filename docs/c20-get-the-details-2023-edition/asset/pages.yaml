- pgno: 166
  md: "```\n    std::partial_ordering::less\n    std::partial_ordering::equivalent\n\
    \    std::partial_ordering::greater\n    std::partial_ordering::unordered\n```\n\
    \nEquality of values support `std::strong_ordering` can either be expressed with\
    \ `std::strong_ordering::equal` or `std::strong_ordering::equivalent`. `std::partial_ordering::unordered`\
    \ represent values supporting `std::weak_ordering`, which neither support less,\
    \ equal, or greater.\n\nYou can use the comparison categories and their values\
    \ to explicitly define the three-way comparison operator. The following code snippet\
    \ does it for the simple type `MyInt`.\n\nExplicit definition of the three-way\
    \ comparison operator\n\n```\n    struct MyInt {\n      int value;\n      explicit\
    \ MyInt(int val): value{val} { }\n      std::strong_ordering operator<=>(const\
    \ MyInt& rhs) const {\n        return value == rhs.value ? std::strong_ordering::equal\
    \ :\n               value < rhs.value ? std::strong_ordering::less :\n       \
    \        std::strong_ordering::greater;\n      }\n    };\n```\n\nNow, I want to\
    \ focus on the compiler-generated spaceship operator.\n\n# ### 4.3.4 Compiler-Generated\
    \ Equality and Spaceship Operator\n\nThe compiler-generated comparison operators\
    \ are implicit `constexpr` and `noexcept`<sup>44</sup>, and performs a lexicographical\
    \ comparison. The comparison operator is defined for all fundamental types for\
