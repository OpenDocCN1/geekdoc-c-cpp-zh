- pgno: 376
  md: "The following program converts the time point 2021-8-5 17:00:00 between the\
    \ various clocks.\n\n# Conversion of time point between various clocks\n\n```\n\
    ~~~cpp\n// convertClocks.cpp\n\n#include <iostream>\n#include <sstream>\n#include\
    \ <chrono>\n\nint main() {\n\n    std::cout << '\\n';\n\n    using namespace std::literals;\n\
    \n    std::chrono::utc_time<std::chrono::utc_clock::duration> timePoint;\n   \
    \ std::istringstream{\"2021-8-5 17:00:00\"} >> std::chrono::parse(\"%F %T\", timePoint);\n\
    \n    auto timePointUTC = std::chrono::clock_cast<std::chrono::utc_clock>(timePoint);\n\
    \    std::cout << \"UTC_time:  \" << std::format(\"{:%F %X %Z}\", timePointUTC)\
    \ << '\\n';\n\n    auto timePointSys = std::chrono::clock_cast<std::chrono::system_clock>(timePoint);\n\
    \    std::cout << \"sys_time:  \" << std::format(\"{:%F %X %Z}\", timePointSys)\
    \ << '\\n';\n\n    auto timePointFile = std::chrono::clock_cast<std::chrono::file_clock>(timePoint);\n\
    \    std::cout << \"file_time: \" << std::format(\"{:%F %X %Z}\", timePointFile)\
    \ << '\\n';\n\n    auto timePointGPS = std::chrono::clock_cast<std::chrono::gps_clock>(timePoint);\n\
    \    std::cout << \"GPS_time:  \" << std::format(\"{:%F %X %Z}\", timePointGPS)\
    \ << '\\n';\n\n    auto timePointTAI = std::chrono::clock_cast<std::chrono::tai_clock>(timePoint);\n\
    \    std::cout << \"TAI_time:  \" << std::format(\"{:%F %X %Z}\", timePointTAI)\
    \ << '\\n';\n\n    std::cout << '\\n';\n\n}\n~~~\n```\n\nThe function `std::chrono::parse`\
    \ (line 14) parses the chrono object from the stream. In lines 16, 19, 22, 25,\
    \ and 28, the `std::chrono::clock_cast` converts the `timePoint` into the specified\
    \ clock. The following line displays the time point, specifying its date (`%F`),\
    \ its local time representation (`%X`), and its time zone abbreviation (`%Z`).\
    \ The section Chrono I/O provides the details about the format string."
