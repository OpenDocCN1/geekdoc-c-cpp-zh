  md: "The three functions `yield_value`, `initial_suspend` and `final_suspend` return\
    \ an awaiter. Often, the predefined Awaiters `std::suspend_always` and `std::suspend_never`\
    \ are used. This Awaiter can start eager or lazy. The function `final_suspend`\
    \ can execute some logic if the coroutine is finally suspended. A promise needs\
    \ at least one of the member functions `return_value`, `return_void`, or `yield_value`.\
    \ Additionally, either `return_value` or `return_void` must be available. When\
    \ you overload `yield_value` or `return_value` of the promise object for different\
    \ types, the coroutine can return different values using `co_yield`, or `co_return`.\n\
    \nThe static function `get_return_object_on_allocation_failure` guarantees that\
    \ memory allocation of the coroutine never throws. When this static member function\
    \ is implemented, the overloaded `::operator new(std::size_t sz, std::nothrow_t)`\
    \ is called. Consequently, when you implement your `operator new`, it must be\
    \ `noexcept` and return a `nullptr` when memory allocation fails.\n\nThanks to\
    \ the two functions `operator new(size)`, and `operator delete(ptr, size)`, you\
    \ can implement a coroutine-specific memory allocation strategy. This strategy\
    \ may avoid memory allocation on the heap.\n\nFor an unhandled exception in the\
    \ coroutine, the function `unhandled_exception` is called. Now, you can handle\
    \ your exception in various ways: you can ignore the exception, terminate your\
    \ program using, for example `std::exit⁹`, handle the exception, or store it using\
    \ `std::current_exception¹⁰`. You have to rethrow the exception in the `try` block\
