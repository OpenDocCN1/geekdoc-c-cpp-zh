- pgno: 458
  md: '| The Awaiter |  |

    |---|---|

    | **Member Function** | **Description** |

    | `Constructor` | Initializes the Awaiter. Can take arguments. |

    | `await_ready` | Indicates if the coroutine is ready for suspension. |

    | `await_suspend(coroutineHandle)` | Handles the suspension of the coroutine.
    |

    | `await_resume` | Handles the resumption of the coroutine. |


    The three member functions `await_ready`, `await_suspend`, and `await_resume`
    are typically `const`, `noexcept`, and `constexpr`.


    # 6.1.4.2.1 `await_ready`


    The function `await_ready` returns a boolean and is immediately called before
    the coroutine is suspended. The coroutine is suspended if `await_ready` returns
    true; otherwise, it is not suspended and continues its control flow. Typically,
    `await_ready` returns false, but it may return true if the reason for suspension
    no longer exists.


    # 6.1.4.2.2 `await_suspend`


    The function `await_suspend(coroutineHandle)` handles the suspension of the coroutine.
    `await_suspend` is the crucial function of the Awaiter. It supports various control
    flows based on its parameters and return types:


    **Parameter**


    +   - `std::coroutine_handle<PromiseType>`: the coroutine handle

    +   - `std::coroutine_handle<>`: a type-erased coroutine handle that doesn’t have
    access to the promise

    +   - `auto`: automatically deduced return type


    **Return type**


    +   - `void`: the control flow immediately returns to the caller. The coroutine
    remains suspended.

    +   - `bool`:

    +     - `true`: the control flow immediately returns to the caller

    +     - `false`: the coroutine is resumed

    +   - `std::coroutine_handle<>`:

    +     - if it returns a coroutine handle `coroHandle` of another coroutine, this
    coroutine is resumed: `coroHandle.resume()`. This strategy is called symmetric
    transfer.

    +     - `std::noop_coroutine`: no coroutine is resumed. Equivalent to returning
    true.'
