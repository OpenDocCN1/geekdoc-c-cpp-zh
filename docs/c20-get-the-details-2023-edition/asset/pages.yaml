- pgno: 634
  md: "# ## 8.2.2 Reflection\n\nReflection is the possibility of a program to analyze\
    \ and modify itself. Reflection takes place at compile time and, therefore, adheres\
    \ to the C++ metarule: “don’t pay for anything you don’t use”. The [type-traits\
    \ library] is a powerful tool for reflection, but the proposal P0385 for static\
    \ reflection goes much further.\n\nThe following code snippet should give you\
    \ a first impression of reflection:\n\n# The reflection operator\n\n```\n```cpp\n\
    template <typename T>\nT min(constT& a,constT& b) {\n  log() << \"function: min\"\
    \n        << get_base_name_v<get_aliased_t<$reflect(T)>>\n        << \"(\"\n \
    \       << get_base_name_v<$reflect(a)> << \": \"\n        << get_base_name_v<get_aliased_t<get_type_t<$reflect(a)>>>>\n\
    \        << \", \" << get_base_name_v<$reflect(b)> << \": \"\n        << get_base_name_v<get_aliased_t<get_type_t<$reflect(b)>>>>\n\
    \        << \" = \" << a << \", \"\n        << \")\" << '\\n';\n  return a < b\
    \ ? a : b;\n}\n```\n```\n\nThe new reflection operator `$reflect` is the crucial\
    \ expression in the example. First, the new operator creates a special data type,\
    \ which provides meta information on the template parameter T (line 4) and the\
    \ values a (line 6), and c (line 9). Thanks to function composition, the metainformation\
    \ can be used to provide more information: `get_base_name_v<get_aliased_t<...`\
    \ (lines 7 and 10).\n\nWhen you invoke the function min with the argument min(12.34,\
    \ 23.45), you get the following output:\n\n```\n```text\nfunction: min<double>(a:\
    \ double = 12.34, b: double = 23.45)\n\nCalling min(12.34, 23.45)\n```\n```\n\n\
    You may be curious and want to know: Which metainformation could you get with\
    \ reflection? The following points give you the answer:\n\n+   - Objects: the\
    \ source-code line and column and the name of the file\n+   - Classes: the private\
    \ and public data members and member functions\n+   - Aliases: the name of the\
    \ resolved alias\n\nThe next example from proposal P0385 shows how reflection\
    \ helps determine the private and public members of a class.\n\n[26] https://en.cppreference.com/w/cpp/header/type_traits\n\
    [27] http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0385r2.pdf"
