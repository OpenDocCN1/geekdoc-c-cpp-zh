    Sending a signal to various executing entities


    You may wonder why the various executing entities sleep for one second (lines
    10, 16, and 36) in the previous program `signalStopRequests.cpp`? I want to be
    sure that the call `stopSource.request_stop()` in line 44 has an effect. The execution
    entity as the `std::thread` (line 31), the `std::jthread` (line 33), `std::async`
    (line 35), or `std::promise` (line 42) can have one of the following states, when
    the request to stop is signaled.


    +   - **Not started:** The call `stopToken.stop_requested()` returns true when
    executed. The callback is executed when `stopSource.request_stop()` is signaled.

    +   - **Executing:** The execution entity receives the signal. To take effect,
    the `stopSource.request_stop()` must happen before the running entity calls `stopToken.stop_requested`.
    Accordingly, the `stopSource.request_stop()` must happen before the callback is
    initialized.

    +   - **Finished:** The call `stopSource.request_stop` has no effect. The callback
    is not executed.


