    ```cpp

    template< class RandomIt >

    constexpr void sort( RandomIt first, RandomIt last );

    ```

    ```


    std::sort uses strange-named argument types such as RandomIt. RandomIt stands
    for a random-access iterator and gives the decisive hint for the overwhelming
    error message. A std::list only provides a bidirectional iterator, but std::sort
    requires a random-access iterator. The following graphic shows why a std::list
    does not support a random access iterator.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_55_0.png)


    If you study the std::sort documentation on cppreference.com, you will find something
    exciting: type requirements on template parameters. They place conceptual requirements
    on the types that have been formalized into the C++20 feature: concepts.


    # 4.1.1.3 Concepts to the Rescue


    Concepts are compile-time predicates. They put semantic constraints on template
    parameters. std::sort has overloads that accept a comparator.


    ```

    ```cpp

    template< class RandomIt, class Compare >

    constexpr void sort( RandomIt first, RandomIt last, Compare comp);

    ```

    ```


    These are the type requirements for the more powerful overload of std::sort:


    +   - RandomIt must meet the requirements of ValueSwappable and LegacyRandomAccessIterator.

    +   - The type of the dereferenced RandomIt must meet the requirements of MoveAssignable
    and MoveConstructible.

    +   - The type of the dereferenced RandomIt must meet the requirements of Compare.


    Requirements such as ValueSwappable or LegacyRandomAccessIterator are so-called
    named requirements. Some of these requirements are formalized in C++20 in concepts⁴.


    In particular, std::sort requires a LegacyRandomAccessIterator. Let’s have a closer
    look at the named requirement LegacyRandomAccessIterator that is called random_access_iterator
    (part of <iterator>) in C++20:'
