    \ sec) {\n    return fir + sec;\n}\n```\n```\n\n# ### The submodule math.math2\n\
    \n```\n```cpp\n// mathModule2.ixx\n\nexport module math.math2;\n\nexport {\n \
    \   int mul(int fir, int sec) {\n        return fir * sec;\n    }\n}\n```\n```\n\
    \nIf you look carefully, you recognize a slight difference in the export statements\
    \ in the modules `math`. While `math.math1` uses an export specifier, `math.math2`\
