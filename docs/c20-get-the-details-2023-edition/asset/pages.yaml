- pgno: 632
  md: "Accessing the return value\n\n```\n```cpp\nint mul(int x, int y)\n    [[expects:\
    \ x > 0]]        // implicit default\n    [[expects default: y > 0]]\n    [[ensures\
    \ audit res: res > 0]] {\n    return x * y;\n}\n```\n```\n\nres as the identifier\
    \ is an arbitrary name. As shown in the example, you can use more contracts of\
    \ the same kind.\n\nLet me dive deeper into the handling of contract violations.\n\
    \n# 8.2.1.2 Handling Contract Violations\n\nA compilation has three assertion\
    \ build levels:\n\n+   - off: no contracts are checked\n+   - default: default\
    \ contracts are checked; this is the default\n+   - audit: default and audit contracts\
    \ are checked\n\nWhen a contract violation occurs because the predicate returns\
    \ false, the violation handler is invoked. The violation handler gets a value\
    \ of type std::contract_violation. This value provides detailed information about\
    \ the violation of the contract.\n\nThe class contract_violation\n\n```\n```cpp\n\
    namespace std {\n    class contract_violation{\n    public:\n        uint_least32_t\
    \ line_number() const noexcept;\n        string_view file_name() const noexcept;\n\
    \        string_view function_name() const noexcept;\n        string_view comment()\
    \ const noexcept;\n        string_view assertion_level() const noexcept;\n   \
    \ };\n}\n```\n```\n\n+   - line_number: the line number of the contract violation\n\
    +   - file_name: the file name of the contract violation\n+   - function_name:\
    \ the function name of the contract violation\n+   - comment: the predicate of\
    \ the contract\n+   - assertion_level: the assertion level of the contract"
