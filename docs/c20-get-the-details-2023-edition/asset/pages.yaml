  md: '![](img/c60a87adb7f61e2e82071d081bbb389a_602_0.png)


    # Distilled Information


    +   - The section coroutines introduced an eager future, using `co_return`. This
    future is an ideal starting point to make it lazy and finally let it run on its
    thread.

    +   - Thanks to the Ranges Library, I can implement Python’s `filter`, `map`,
    and list comprehension functions in C++20.

    +   - Modifications of the generator for an infinite data stream reveal its nature.
    When the member function `initial_suspend` returns `std::suspend_never`, the coroutine
    starts immediately and ignores the first value. In contrast, returning `std::suspend_never`
    from the function `yield_value` ends in an infinite loop. When you forget to resume
    the coroutine, it will never run. The generator `Generator<T>` is generally applicable.
    Instead of an infinite data stream, it can successively return the elements of
    an arbitrary container of the Standard Template Library.

    +   - Implementing your own awaitable `MySuspendNever` and `MySuspendAlways` makes
    the awaiter workflow transparent. Adapting the available `MySuspendAlways` enables
    it to create an Awaiter that resumes itself if necessary. Changing awaitable allows
    you to automatically resume the coroutine on a separate thread.

    +   - If you want to synch threads more than once, you have many options. You
    can use condition variables, `std::atomic_flag`, `std::atomic<bool>`, or semaphores.
    This case study answers the question: Which variant is the fastest one? The numbers
    show that condition variables are the slowest way and atomic flags are the fastest
    way to synchronize threads. The performance of `std::atomic<bool>` is in between.
    Semaphores are nearly as fast as atomic flags.'
