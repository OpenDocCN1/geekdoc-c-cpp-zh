  md: "# ## 3.2 Core Language\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_30_0.png)\n\
    \n# ### 3.2.1 Three-Way Comparison Operator\n\nThe **three-way comparison operator**\
    \ (`<=>`), or spaceship operator, determines, for two values A and B, whether\
    \ A < B, A == B, or A > B.\n\nBy declaring the three-way comparison operator `default`,\
    \ the compiler will attempt to generate a consistent relational operator for the\
    \ class. In this case, you get all six comparison operators: `==`, `!=`, `<`,\
    \ `<=`, `>`, and `>=`.\n\nAuto-generating the three-way comparison operator\n\n\
    ```\n```cpp\nstruct MyInt {\n    int value;\n    MyInt(int value) : value(value)\
    \ { }\n    auto operator<=>(const MyInt&) const = default;\n};\n```\n```\n\nThe\
    \ compiler-generated operator `<=>` performs a lexicographical comparison, starting\
    \ with the base classes and taking into account all the non-static data members\
    \ in their declaration order. Here is a quite sophisticated example from the Microsoft\
    \ blog: [Simplify Your Code with Rocket Science: C++ 20's Spaceship Operator](https://devblogs.microsoft.com/cppblog/simplify-your-code-with-rocket-science-c20s-spaceship-operator/).\n\
    \n# ### 3.2.2 Designated Initialization\n\n1 https://devblogs.microsoft.com/cppblog/simplify-your-code-with-rocket-science-c20s-spaceship-operator/"
