- pgno: 231
  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_231_0.png)\n\n# volatile and Multithreading\
    \ Semantics\n\nvolatile is typically used to denote objects that can change independently\
    \ of the regular program flow. These are, for example, objects in embedded programming\
    \ that represent an external device (memory-mapped I/O). Because these objects\
    \ can change independently of the regular program flow and their value is directly\
    \ written to main memory, no optimized storing in caches takes place. In other\
    \ words, volatile avoids aggressive optimization and has no multithreading semantics.\n\
    \n# 4.9.2 Range-based for loop with Initializers\n\nWith C++20, you can directly\
    \ use a range-based for loop with an initializer.\n\nRange-based for loop with\
    \ initializer\n\n```\n```cpp\n// rangeBasedForLoopInitializer.cpp\n\n#include\
    \ <iostream>\n#include <string>\n#include <vector>\n\nint main() {\n\n    for\
    \ (auto vec = std::vector{1, 2, 3}; auto v : vec) {\n        std::cout << v <<\
    \ \" \";\n    }\n\n    std::cout << \"\\n\\n\";\n\n    for (auto initList = {1,\
    \ 2, 3}; auto e : initList) {\n        e *= e;\n        std::cout << e << \" \"\
    ;\n    }\n\n    std::cout << \"\\n\\n\";\n\n    using namespace std::string_literals;\n\
    \    for (auto str = \"Hello World\"s; auto c : str) {\n        std::cout << c\
    \ << \" \";\n    }\n\n    std::cout << '\\n';\n}\n```\n```"
