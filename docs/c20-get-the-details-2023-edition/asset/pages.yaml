  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_77_0.png)\n\n# # What we don't get:\
    \ Template Introduction\n\nMaybe you are missing one feature in this chapter on\
    \ concepts: template introduction. Template introduction was part of the technical\
    \ specification on concepts, TS ISO/IEC TS 19217:2015¹³; and was an experimental\
    \ implementation of concepts. GCC 6¹⁴ fully implemented the concepts TS. Aside\
    \ the syntactic differences to concepts in C++20, the concepts TS supports a concise\
    \ way of defining templates.\n\nIn the example below, assume that Integral is\
    \ a concept.\n\n**Template introduction in the concepts TS**\n\n```\n```\nIntegral{T}\n\
    Integral gcd(T a, T b){\n    if( b == 0 ){ return a; }\n    else{\n        return\
    \ gcd(b, a % b);\n    }\n}\n\nIntegral{T}\nclass ConstrainedClass{};\n```\n```\n\
    \nThis small code snippet above used template introduction in two ways. First,\
    \ to define a function template with a constrained template parameter; second,\
    \ to define a class template with a constrained template parameter. Template introduction\
    \ had one limitation. You could only use it with a constrained template parameter\
    \ (concept), but not with an unconstrained template parameter (auto). This asymmetry\
    \ could easily be overcome by defining a concept that always returns true:\n\n\
    **The concept Generic is always fulfilled**\n\n```\n```\ntemplate <typename T>\n\
    concept bool Generic(){\n    return true;\n}\n```\n```\n\nDon't be irritated,\
    \ I used in the example the concepts TS syntax to define the Generic concept.\
    \ The C++20 syntax is slightly more concise. Read more details of the C++20 syntax\
    \ in section Defining Concepts.\n\n# ## 4.1.7 Predefined Concepts\n\nThe golden\
    \ rule “Don't reinvent the wheel” also applies to concepts. The C++ Core Guidelines¹⁵\
    \ are very clear about this rule: T.11: Whenever possible, use standard concepts.\
