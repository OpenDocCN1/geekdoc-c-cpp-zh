    # 5.7.4 `std::source_location`


    `std::source_location` represents implementation-defined information about the
    source code. This information includes the file name, line number, column number,
    and function name. The information is precious if you need information about the
    call site for debugging, logging, or testing purposes. The class `std::source_location`
    is a better alternative than the predefined C++11 macros `__FILE__` and `__LINE__`
    and should be used instead.


    `std::source_location` can give you the following information.


    | Function | Description |

    |---|---|

    | `std::source_location::current()` | Creates a new source_location object src
    |

    | `src.line()` | Returns the line number |

    | `src.column()` | Returns the column number |

    | `src.file_name()` | Returns the file name |

    | `src.function_name()` | Returns the function name |


    The static `consteval` function `std::source_location::current()` creates a new
    source location object `src` that represents the information of the call site.
    You can store this object in a container `std::vector<std::source_location>` or
    display its information.'
