    \ an integer or floating-point type is used.\n\nThe sign can have the following\
    \ values:\n\n+   - `+`: sign is used for zero and positive numbers\n+   - `-`:\
    \ sign is only used for negative numbers (default)\n+   - space: leading space\
    \ is used for non-negative numbers and a minus sign for negative numbers\n\n#\
    \ Applying the sign character\n\n```\n```cpp\n// formatSign.cpp\n\n#include <format>\n\
    #include <iostream>\n\nint main() {\n\n    std::cout << '\\n';\n\n    std::cout\
    \ << std::format(\"{0:},{0:+},{0:-},{0:}\", 0) << '\\n';\n    std::cout << std::format(\"\
    {0:},{0:+},{0:-},{0:}\", 0) << '\\n';\n    std::cout << std::format(\"{0:},{0:+},{0:-},{0:}\"\
    , 1) << '\\n';\n    std::cout << std::format(\"{0:},{0:+},{0:-},{0:}\", -1) <<\
    \ '\\n';\n\n    std::cout << '\\n';\n}\n```\n```\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_356_0.png)\n\
    \nApplying the sign character\n\nThe # causes the alternative form:\n\n+   - For\
    \ integer types, the prefix `0b`, `0`, or `0x` is used for binary, octal, or hexadecimal\
    \ represented types\n+   - For floating-point types, a decimal point is always\
    \ used\n+   - `0`: pads with leading zeros"
