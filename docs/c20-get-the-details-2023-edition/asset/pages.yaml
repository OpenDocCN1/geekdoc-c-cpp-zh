- pgno: 332
  md: '# The execution policies


    ```

    ```cpp

    std::vector<int> v = {1, 2, 3, 4, 5, 6, 7, 8, 9};


    // sequential execution (C++98)

    std::sort(v.begin(), v.end());


    // sequential execution (C++17)

    std::sort(std::execution::seq, v.begin(), v.end());


    // permitting parallel execution (C++17)

    std::sort(std::execution::par, v.begin(), v.end());


    // permitting parallel and vectorized execution (C++17)

    std::sort(std::execution::par_unseq, v.begin(), v.end());


    // permitting vectorized execution (C++20)

    std::sort(std::execution::unseq, v.begin(), v.end());

    ```

    ```


    Applying the vectorized execution policies (std::execution::par_unseq or std::execution::unseq)
    does not guarantee vectorized execution. You pay your architecture to execute
    it vectorized. Additionally, you should not use a blocking mechanism such as a
    mutex. This may end in a deadlock.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_332_0.png)


    # Distilled Information


    +   - `std::vector` and `std::string` have `constexpr` constructors and can, therefore,
    be instantiated at compile time. Thanks to the `constexpr` algorithms of the Standard
    Template Library (STL), you can manipulate them at compile time.

    +   - C++20 offers two convenient ways to create arrays. `std::to_array` creates
    a `std::array` and `std::make_shared` allows the creation of a `std::shared_ptr`
    wrapping a C-array.

    +   - The new algorithms `std::erase` and `std::erase_if` are used to erase specific
    elements (erase) or elements satisfying a predicate (erase_if) from an arbitrary
    container of the STL.

    +   - Thanks to the member function `contains`, you can check for an associative
    container if it has the requested key.

    +   - The new algorithms `std::shift_left` and `std::shift_right` enable it to
    shift the content of a container by n positions.

    +   - `std::string` supports the new member function `starts_with` and `ends_with`
    to check if the container has a specific prefix or suffix.

    +   - The new execution policy `std::execution::unseq` permits the vectorized
    execution of an algorithm.'
