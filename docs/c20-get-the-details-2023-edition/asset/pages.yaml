  md: "# 5.4 Arithmetic Utilities\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_333_0.png)\n\
    \nCippi studies arithmetic\n\nComparing signed and unsigned integers is a subtle\
    \ cause for unexpected behavior and, therefore, bugs. Thanks to the new safe comparison\
    \ functions for integers, `std::cmp_*`, a source of subtle bugs is gone. Additionally,\
    \ C++20 includes mathematical constants such as *e*, π, or φ, and with the functions\
    \ `std::midpoint` and `std::lerp`, you can calculate the midpoint of two numbers\
    \ or their linear interpolation. The new bit manipulation allows you to access\
    \ and modify individual bits or bit sequences.\n\n# 5.4.1 Safe Comparison of Integers\n\
    \nWhen you compare signed and unsigned integers, you may not get the result you\
    \ expect. Thanks to the six `std::cmp_*` functions, there is a cure in C++20.\
    \ Motivating safe comparison of integers, I want to start with the unsafe variant.\n\
    \n![](img/c60a87adb7f61e2e82071d081bbb389a_333_1.png)\n\n> **Integral versus Integer**\n\
    > \n> The terms integral and integer are synonyms in C++. This is the wording\
    \ from the standard for fundamental types: “Types `bool`, `char`, `char8_t`, `char16_t`,\
    \ `char32_t`, `wchar_t`, and the signed and unsigned integer types are collectively\
    \ called integral types. A synonym for [an] integral type is integer type”. I\
    \ prefer the term integer in this book.\n\n# 5.4.1.1 Unsafe Comparison\n\nOf course,\
    \ there is a reason for the name `unsafeComparison.cpp` of the following program."
