    \ add(int fir, int sec) {\n    return fir + sec;\n}\n~~~\n```\n\n# ### Second\
    \ module partition\n\n```\n~~~cpp\n// mathPartition2.ixx\n\nexport module math:math2;\n\
    \nexport {\n    int mul(int fir, int sec) {\n        return fir * sec;\n    }\n\
    }\n~~~\n```\n\nSimilar to the module declaration, the expressions `export module\
    \ math:math1` and `export module math:math2` (line 3) declare a module interface\
    \ partition. A module interface partition is also a module interface unit. `math`\
