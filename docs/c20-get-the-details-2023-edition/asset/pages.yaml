    A special Awaitable


    # 6.1.3.3 Coroutine Frame


    The coroutine frame is an internal, typically heap-allocated state. It consists
    of the already mentioned promise object, the coroutine’s copied parameters, the
    representation of the suspension points, local variables whose lifetime ends before
    the current suspension point, and local variables whose lifetime exceeds the current
    suspension point.


    The coroutine is typically heap-allocated, but compilers may avoid heap allocation.
    The following properties increase the likelihood that the coroutine is not heap
    allocated.


    +   1. The lifetime of the coroutine has to be nested inside the lifetime of the
    caller.

    +   2. Inline function give the compiler more insight to see the size of the frame.

    +   3. `std::final_suspend` returns `std::suspend_always`. This simplifies lifetime
    management.


    The crucial abstractions in the coroutine framework are Awaitables and Awaiters.'
