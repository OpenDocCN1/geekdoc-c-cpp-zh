    [] { return not myVec.empty(); });`. The waiting thread always performs the same
    steps. When awoken, it checks the predicate while holding the lock (`[] { return
    not myVec.empty(); }`). If the predicate does not hold, it puts itself back to
    sleep. If the predicate holds, it continues with its work. In the concrete workflow,
    the sending thread puts the initial values into the `std::vector` (line 18), which
    the receiving thread completes (line 29).'
