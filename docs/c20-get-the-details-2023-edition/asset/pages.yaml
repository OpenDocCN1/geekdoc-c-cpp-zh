    \ \" << dur.count() << \" seconds\" << '\\n';\n\n}\n~~~\n```\n\nA call `condAtomicFlag1.wait(false)`\
    \ (line 15) blocks if the atomic flag's value is false, and returns if `condAtomicFlag1`\
    \ has the value true. The boolean value serves as a kind of predicate and must,\
