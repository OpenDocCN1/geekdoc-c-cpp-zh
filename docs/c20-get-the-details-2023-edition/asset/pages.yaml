  md: "# 5.1.7 Define a View\n\nYou can define your view.\n\n# 5.1.7.1 `std::ranges::view_interface`\n\
    \nThanks to the `std::ranges::view_interface` helper class, defining a view is\
    \ easy. To fulfill the concept view, your view needs at least a default constructor,\
    \ and member functions `begin()` and `end()`:\n\n```\nYour own view\n\n```cpp\n\
    class MyView : public std::ranges::view_interface<MyView> {\npublic:\n    auto\
    \ begin() const { /*...*/ }\n    auto end() const { /*...*/ }\n};\n```\n```\n\n\
    By deriving MyView public from the helper class `std::ranges::view_interface`\
    \ using itself as a template parameter, MyView becomes a view. This technique\
    \ of class template having itself as a template parameter is called [Curiously\
    \ Recurring Template Pattern](https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern)\
    \ (short CRTP).\n\nI use this technique in the next example to create a view out\
    \ of a container of the Standard Template Library.\n\n# 5.1.7.2 A Container View\n\
    \nThe view `ContainerView` creates a view on an arbitrary container.\n\n```\n\
    Creating a view from a container\n\n```cpp\n// containerView.cpp\n\n#include <iostream>\n\
    #include <ranges>\n#include <string>\n#include <vector>\n\ntemplate<std::ranges::input_range\
    \ Range>\nrequires std::ranges::view<Range>\nclass ContainerView : public std::ranges::view_interface<ContainerView<Range>>\
    \ {\nprivate:\n    Range range_{};\n    std::ranges::iterator_t<Range> begin_{\
    \ std::begin(range_) };\n    std::ranges::iterator_t<Range> end_{ std::end(range_)\
    \ };\n```\n```\n\n[^1]: https://www.modernescpp.com/index.php/c-is-still-lazy"
