  md: '# # Epilogue


    Congratulations! If you are reading these lines, you have mastered the challenging
    and exciting C++20 standard. C++20 is a C++ standard that likely has the same
    influence on C++, such as the other two significant C++ standards: C++98 and C++11.
    Due to C++11, the following names for the C++ standards are used by the C++ community.


    +   - **Legacy C++:** C++98, and C++03

    +   - **Modern C++:** C++11, C++14, and C++17

    +   - **<Placeholder>:** C++20


    I’m not sure what name will be used for C++20 in the future. I’m only sure that
    C++20 starts a new C++ area. Let me remind you why, in particular, the *Big Four*
    change the way we program in C++.


    +   - **Concepts:** Concepts are revolutionizing the way we think about and write
    generic code. Thanks to them, we can reason about our program for the first time
    in semantic categories such as `Number` or `Ordering`.

    +   - **Modules:** Modules are the starting point of software components. Modules
    help overcome the deficiencies of legacy headers and macros.

    +   - **Ranges:** The ranges library extends the Standard Template Library with
    functional ideas. Algorithms can operate directly on the containers, be evaluated
    lazily, and be composed.

    +   - **Coroutines:** Thanks to coroutines, asynchronous programming becomes a
    first-class citizen in C++. Coroutines transform blocking function calls in waiting
    and are highly valuable in event-driven systems such as simulations, servers,
    or user interfaces.


    C++20 is just the starting point. In the chapter about C++23 and Beyond, I give
    more details on the near future of C++.


    To make it short: C++ has a bright, shining future.


