    | Function | Description |

    |---|---|

    | `store` | Atomically replaces the value of the referenced object with a non-atomic.
    |

    | `exchange` | Atomically replaces the value of the referenced object with the
    new value. |

    | `compare_exchange_strong` | Atomically compares and eventually exchanges the
    value of the referenced object. |

    | `compare_exchange_weak` |  |

    | `fetch_add, +=` | Atomically adds (subtracts) the value to (from) the referenced
    object. |

    | `fetch_sub, -=` |  |

    | `fetch_or, \|=` | Atomically performs bitwise (AND, OR, and XOR) operation on
    the referenced object. |

    | `fetch_and, &=` |  |

    | `fetch_xor, ^=` |  |

    | `++, --` | Increments or decrements (either pre- and post-increment) the referenced
    object. |

    | `notify_one` | Notifies one atomic wait operation. |

    | `notify_all` | Notifies all atomic wait operations. |

    | `wait` | Blocks until it is notified.<br>Compares itself with the old value
    to protect against spurious wakeups.<br>If the value is different from the old
    value, returns. |


    The composite assignment operators (`+=`, `-=`, `|=`, `&=`, or `^=`) return the
    new value; the fetch variations return the old value.


    Thanks to the constexpr function `atomic_ref<type>::is_always_lock_free`, you
    can check for each atomic type if it’s lock-free on all supported hardware that
    the executable might run on. This check returns only true if it is true for all
    supported hardware. The check is performed at compile-time and is available since
    C++17.


    Each function supports an additional memory-ordering argument. The default for
    the memory-ordering argument is `std::memory_order_seq_cst`, but you can also
    use `std::memory_order_relaxed`, `std::memory_order_consume`, `std::memory_order_acquire`,
    `std::memory_order_release`, or `std::memory_order_acq_rel`. The compare_exchange_strong
    and compare_exchange_weak member functions can be parameterized with two memory
    orderings, one for the success case, and the other for the failure case. Both
    calls perform an atomic exchange if equal and an atomic load if not. They return
    true in the success case, false otherwise. If you only explicitly provide one
    memory ordering, it is used for both'
