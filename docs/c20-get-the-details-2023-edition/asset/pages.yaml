- pgno: 163
  md: 'Strong ordering is also called total ordering.


    For a type T the three following properties distinguish the three comparison categories.


    +   1. T supports all six relational operators: ==, !=, <, <=, >, and >= (short:
    Relational Operator)

    +   2. All equivalent values are indistinguishable (short: Equivalence)

    +   3. All values of T are comparable: For arbitrary values a and b of T, one
    of the three relations a < b, a == b, and a > b must be true (short: Comparable)


    Integral types or strings are typical examples of strong ordering. The ordering
    is called weak when comparing the absolute value of signed integral types or strings
    case-insensitive. Strong ordering determines the identity of values, but weak
    ordering the equivalence of values. Additionally, two arbitrary floating-point
    values need not to be comparable: for a = 5.5 and b = NaN (Not a Number) neither
    of the following expressions returns true: a < NaN, a == NaN, or a > NaN. This
    means floating-point values support partial ordering.


    Based on the three properties, distinguishing the three comparison category is
    straightforward:


    Strong, weak, and partial ordering


    | Comparison Category | Relational Operator | Equivalence | Comparable |

    | --- | --- | --- | --- |

    | Strong Ordering | yes | yes | yes |

    | Weak Ordering | yes |  | yes |

    | Partial Ordering | yes |  |  |


    A type supporting strong ordering supports implicitly weak and partial ordering.
    The same holds for weak ordering. A type supporting weak ordering also supports
    partial ordering. The other directions do not apply.'
