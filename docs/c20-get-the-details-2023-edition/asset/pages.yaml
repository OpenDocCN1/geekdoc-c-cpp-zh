  md: "# An improved definition of the function template sum\n\n```\n```cpp\n// mathModuleTemplate1.ixx\n\
    \nmodule;\n\n#include <iostream>\n#include <typeinfo>\n#include <utility>\n\n\
    export module math;\n\ntemplate <typename T>\nauto showType(T&& t) {\n    return\
    \ typeid(std::forward<T>(t)).name();\n}\n\nexport namespace math {\n\n    template\
    \ <typename T, typename T2>\n    auto sum(T fir, T2 sec) {\n        auto res =\
    \ fir + sec;\n        return std::make_pair(res, showType(res));\n    }\n}\n```\n\
    ```\n\nInstead of the sum of the numbers, the function template sum returns a\
    \ `std::pair`¹ (line 21) consisting of the sum and a string representation of\
    \ the type of the value res. Note that I put the function template showType (line\
    \ 11) outside the exported namespace math (line 16). Consequently, invoking it\
    \ from outside the module math is impossible. Function template showType uses\
    \ perfect forwarding² to preserve the function argument t value category. The\
    \ `typeid`³ operator queries information about the type at run time (run time\
    \ type identification (RTTI))⁴.\n\n¹ https://en.cppreference.com/w/cpp/utility/pair\n\
    ² https://www.modernescpp.com/index.php/perfect-forwarding\n³ https://en.cppreference.com/w/cpp/language/typeid\n\
    ⁴ https://en.cppreference.com/w/cpp/types"
