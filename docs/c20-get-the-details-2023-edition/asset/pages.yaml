    Designated initializers detect narrowing conversion


    Interestingly, designated initializers in C behave differently from designated
    initializers in C++.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_181_1.png)


    # Differences Between C and C++


    C designated initializers support use cases that are not supported in C++. C allows


    +   - initializing the members of the aggregate out-of-order

    +   - initializing the members of a nested aggregate

    +   - mixing designated initializers and regular initializers

    +   - designated initialization of arrays


    The proposal [P0329R4](#fn63) provides self-explanatory examples for these use
    cases:


    ```

    ```c

    Difference between C and C++

    struct A { int x, y; };

    struct B { struct A a; };

    struct A a = { .y = 1, .x = 2}; // valid C, invalid C++ (out of order)

    int arr[3] = {[1] = 5};         // valid C, invalid C++ (array)

    struct B b = {.a.x = 0};        // valid C, invalid C++ (nested)

    struct A a = {.x = 1, 2};        // valid C, invalid C++ (mixed)

    ```

    ```


    The rationale for this difference between C and C++ is also part of the proposal:
    “In C++, members are destroyed in reverse construction order and the elements
    of an initializer list are evaluated in lexical order, so field initializers must
    be specified in order. Array designators conflict with lambda-expression syntax.
    Nested designators are seldom used.” The paper continues to argue that only out-of-order
    initialization of an aggregate is commonly used.


    <sup>63</sup> [http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0329r4.pdf](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0329r4.pdf)'
