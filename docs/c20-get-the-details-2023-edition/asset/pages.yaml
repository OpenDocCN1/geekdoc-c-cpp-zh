- pgno: 661
  md: '# 10.38 The Big Six


    The Big Six consists of the following functions:


    +   - Default constructor: `X()`

    +   - Copy constructor: `X(const X&)`

    +   - Copy assignment: `X& operator = (const X&)`

    +   - Move constructor: `X(X&&)`

    +   - Move assignment: `X& operator = (X&&)`

    +   - Destructor: `~X()`


    # 10.39 Thread


    In computer science, a thread of execution is the smallest sequence of programmed
    instructions that a scheduler can manage independently typically. It is typically
    part of the operating system. The implementation of threads and processes differs
    between operating systems, but in most cases, a thread is a process component.
    Multiple threads can exist within one process, executing concurrently and sharing
    resources such as memory, while different processes do not share these resources.
    For the details, read the Wikipedia article about threads¹.


    # 10.40 Thread Storage Duration


    `thread_local` variables have thread storage duration. Thread-local data is created
    for each thread that uses this data. `thread_local` data exclusively belongs to
    the thread. They are created at their first usage and its lifetime is bound to
    the lifetime of the thread it belongs to. Often thread-local data is called thread-local
    storage.


    # 10.41 Time Complexity


    *O(i)* stands for the time complexity (run time) of an operation. With *O(1)*,
    the run time of an operation on a container is constant and is, hence, independent
    of its size. Conversely, *O(n)* means that the run time depends linearly on the
    number of container elements.


    # 10.42 Translation Unit


    A translation unit is the source file after processing of the C preprocessor.
    The C preprocessor includes the header files using `#include` directives, and
    performs conditional inclusion with directives such as `#ifdef`, or `#ifndef`,
    and expands macros. The compiler uses the translation unit to create an object
    file.'
