- pgno: 230
  md: "If you want to know all the sophisticated details, I strongly suggest you watch\
    \ the CppCon 2019 talk “Deprecating volatile” from JF Bastien. Here are a few\
    \ examples from his talk. Additionally, I fixed a few typos in the source code.\
    \ The numbers in the following code snippets refer to the three deprecations listed\
    \ earlier.\n\n# ### Deprecated use case for volatile\n\n```\n```cpp\n// (1)\n\
    int neck, tail;\nvolatile int brachiosaur;\nbrachiosaur = neck;      // OK, a\
    \ volatile store\ntail = brachiosaur;      // OK, a volatile load\n\n// deprecated:\
    \ does this access brachiosaur once or twice\ntail = brachiosaur = neck;\n\n//\
    \ deprecated: does this access brachiosaur once or twice\nbrachiosaur += neck;\n\
    \n// OK, a volatile load, an addition, a volatile store\nbrachiosaur = brachiosaur\
    \ + neck;\n\n***********************************************\n// (2)\n// deprecated:\
    \ a volatile return type has no meaning\nvolatile struct amber jurassic();\n\n\
    // deprecated: volatile parameters aren't meaningful to the\n//             caller,\
    \ volatile only applies within the function\nvoid trex(volatile short left_arm,\
    \ volatile short right_arm);\n\n// OK, the pointer isn't volatile, the data it\
    \ points to is\nvoid fly(volatile struct pterosaur* pteranodon);\n\n***********************************************\n\
    (3)\nstruct linhenykus { volatile short forelimb; };\nvoid park(linhenykus alvarezsauroid)\
    \ {\n    // deprecated: does the binding copy the forelimbs?\n    auto [what_is_this]\
    \ = alvarezsauroid; // structured binding\n    // ...\n}\n```\n```\n\n1 https://www.youtube.com/watch?v=KjW_DLaVXlY"
