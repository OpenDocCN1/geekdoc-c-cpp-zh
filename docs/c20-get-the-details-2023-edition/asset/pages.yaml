  md: 'The program `pingPongSemaphore.cpp` uses two semaphores: `signal2Ping` and
    `signal2Pong` (lines 7 and 8). Both can have the two values 0 or 1, and are initialized
    with 0. This means when the value is 0 for the semaphore `signal2Ping`, a call
    `signal2Ping.release()` (lines 24 and 32) sets the value to 1 and is, therefore,
    a notification. A `signal2Ping.acquire()` (line 15) call blocks until the value
    becomes 1. The same argument holds for the second semaphore `signal2Pong`.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_601_0.png)


    On average, the execution time is 0.33 seconds.


    # 7.5.5 All Numbers


    As expected, condition variables are the slowest way, and atomic flag the fastest
    way to synchronize threads. In between is the performance of a `std::atomic<bool>`.
    There is one downside with `std::atomic<bool>`, `std::atomic_flag` is the only
    atomic data type that is always lock-free. Semaphores impressed me most because
    they are nearly as fast as atomic flags.


    **Execution Time**


    | Condition Variables | Two Atomic Flags | One Atomic Flag | Atomic Boolean |
    Semaphores |

    |---|---:|---:|---:|---:|

    | Execution Time | 0.52 | 0.32 | 0.31 | 0.38 | 0.33 |'
