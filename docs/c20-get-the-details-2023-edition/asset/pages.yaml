  md: "# ### 8.1.2.5 Container Adapters\n\nThe four associative containers std::flat_map,\
    \ std::flat_multimap, std::flat_set, and std::flat_multiset in C++23 are a drop-in\
    \ replacement for the ordered associative containers^9 std::map, std::multimap,\
    \ std::set, and std::multiset. More precisely, a std::flat_map is a drop-in replacement\
    \ for a std::map, a std::flat_multimap is a drop-in replacement for a std::multimap,\
    \ and so forth.\n\nThe flat-ordered associative containers require separate sequence\
    \ containers^10 for their keys and values. These sequence containers must support\
    \ a random access iterator. By default, a std::vector^11 is used, but a std::array^12,\
    \ or a std::deque^13 is also valid.\n\nThe following code snippet shows the declaration\
    \ of std::flat_map, and std::flat_set.\n\n```\n```cpp\ntemplate<class Key, class\
    \ T,\n         class Compare = less<Key>,\n         class KeyContainer = vector<Key>,\
    \ class MappedContainer = vector<T>>\nclass flat_map;\n\ntemplate<class Key,\n\
    \         class Compare = less<Key>,\n         class KeyContainer = vector<Key>>\n\
    class flat_set;\n```\n```\n\nThe flat-ordered associative containers provide better\
    \ time and space properties than the ordered associative containers. The flat\
    \ variants require less memory and are faster to read than their non-flat-ordered\
    \ pendants. The following comparison goes more into the details about the flat\
    \ and the non-flat-ordered associative containers.\n\n# #### Comparison of the\
    \ Flat Ordered Associative Container and their Non-Flat Pendants\n\nThe flat variants\
    \ provide better reading performance, such as iterating through the container,\
    \ and require less memory. They also need that the elements must either be copyable\
