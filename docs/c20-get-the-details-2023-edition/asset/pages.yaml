- pgno: 20
  md: '# 2. Standardization


    The C++ standardization process is democratic: the committee called WG21 (Working
    Group 21) was formed in 1990–91. The officers of WG 21 are:


    +   - **Convener:** chairs the WG21, sets the meeting schedule, and appoints Study
    Groups

    +   - **Project Editor:** applies changes to the working draft of the C++ standard

    +   - **Secretary:** assigns minutes of the WG21 meetings


    The image shows you the various subgroups and Study Groups of the committee.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_20_0.png)


    Study groups in the C++ standardization process


    The committee is organized into a three-stage pipeline consisting of several subgroups.
    SG stands for Study Group.


    # 2.1 Stage 3


    Stage 3 for the wording and the change proposal’s consistency has two groups:
    core language wording (CWG) and library wording (LWG).'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# ## 2.2 Stage 2


    Stage 2 has two groups: core language evolution (EWG) and library evolution (LEWG).
    EWG and LEWG are responsible for new features that involve language and standard
    library extensions, respectively.


    # ## 2.3 Stage 1


    Stage 1 aims for domain-specific investigation and incubation. The study groups''
    members meet in face-to-face meetings, between the meeting by telephone or video
    conferences. Central groups may review the work of the study groups to ensure
    consistency.


    These are the domain-specific Study Groups:


    +   - **SG1, Concurrency:** Concurrency and parallelism topics, including the
    memory model

    +   - **SG2, Modules:** Modules-related topics

    +   - **SG3, File System**

    +   - **SG4, Networking:** Networking library development

    +   - **SG5, Transactional Memory:** Transactional memory constructs for future
    addition

    +   - **SG6, Numerics:** Numerics topics such as fixed-point numbers, floating-point
    numbers, and fractions

    +   - **SG7, Compile time programming:** compile time programming in general

    +   - **SG8, Concepts**

    +   - **SG9, Ranges**

    +   - **SG10, Feature Test:** Portable checks to test whether a particular C++
    supports a specific feature

    +   - **SG11, Databases:** Database-related library interfaces

    +   - **SG12, UB & Vulnerabilities:** Improvements against vulnerabilities and
    undefined/unspecified behavior in the standard

    +   - **SG13, HMI & I/O (Human/Machine Interface):** Support for output and input
    devices

    +   - **SG14, Game Development & Low Latency:** Game developers and (other) low-latency
    programming requirements

    +   - **SG15, Tooling:** Developer tools, including modules and packages

    +   - **SG16, Unicode:** Unicode text processing in C++

    +   - **SG17, EWG Incubator:** Early discussion about the core language evolution

    +   - **SG18, LEWG Incubator:** Early discussions about the library language evolution

    +   - **SG19, Machine Learning:** Artificial intelligence (AI) specific topics
    but also linear algebra

    +   - **SG20, Education:** Guidance for modern course materials for C++ education'
  merge: -1
  img_proc: true
