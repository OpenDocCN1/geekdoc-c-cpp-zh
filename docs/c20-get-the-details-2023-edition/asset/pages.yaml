    # 3.3.5 Calendar and Time Zones


    The chrono library’s[^5] from C++11 is extended with calendar and time-zone functionality.
    The calendar consists of types representing a year, a month, a day of the week,
    and an n-th weekday of a month. These elementary types can be combined into complex
    types such as year_month, year_month_day, year_month_day_last, year_month_weekday,
    and year_month_weekday_last. The operator “/” is overloaded for the convenient
    specification of time points. Additionally, we get new literals: d for a day and
    y for a year.


    Time points can be displayed in various time zones. Due to the extended chrono
    library, the following use cases are now trivial to implement:


