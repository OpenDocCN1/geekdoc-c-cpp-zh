    # Distilled Information


    +   - Coroutines are generalized functions that can pause and resume their execution
    while keeping their state.

    +   - With C++20, we don’t get concrete coroutines but a framework for implementing
    coroutines. This framework consists of more than 20 functions that you partially
    have to implement and partially could overwrite.

    +   - With the new keywords `co_await` and `co_yield`, C++20 extends the execution
    of C++ functions with two new concepts.

    +   - Thanks to `co_await` expression, it is possible to suspend and resume the
    execution of the expression. If you use a `co_await` expression in a function
    `func`, the call `getResult = func()` does not block if the function’s result
    is not available. Instead of resource-consuming blocking, you have resource-friendly
    waiting.

    +   - `co_yield` empowers you to write infinite data streams.'
