- pgno: 229
  md: '# 4.9 Further Improvements


    ![](img/c60a87adb7f61e2e82071d081bbb389a_229_0.png)


    This section presents the remaining small improvements in the C++20 core language.


    # 4.9.1 `volatile`


    The abstract in the proposal P1152R0[^78] gives a short description of the changes
    that `volatile` undergoes: “*The proposed deprecation preserves the useful parts
    of volatile, and removes the dubious / already broken ones. This paper aims at
    breaking at compile-time code which is today subtly broken at run time or through
    a compiler update.*”


    Before I dive into `volatile`, I want to answer the crucial question: When should
    you use `volatile`? A note from the C++ standard says that “*volatile is a hint
    to the implementation to avoid aggressive optimization involving the object because
    the value of the object might be changed by means undetectable by an implementation.*”
    That means that for a single thread of execution, the compiler must perform load
    or store operations in the executable as often as they occur in the source code.
    `volatile` operations, therefore, cannot be eliminated or reordered. Consequently,
    you can use volatile objects for communication with a signal handler but not for
    communication with another thread of execution.


    Before I show you what semantics of volatile are preserved, I want to start with
    the deprecated features:


    +   1. Deprecate volatile compound assignment, and pre/post increment/decrement

    +   2. Deprecate volatile qualification of function parameters or return types

    +   3. Deprecate volatile qualifiers in a structured binding declaration


    [^78]: http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1152r0.html'
