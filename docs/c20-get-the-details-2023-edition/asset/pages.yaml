  md: "# Polymorphism versus pattern matching\n\n```\n```cpp\nstruct Shape { virtual\
    \ ~Shape() = default; };\nstruct Circle : Shape { int radius; };\nstruct Rectangle\
    \ : Shape { int width, height; };\n\nvirtual int Shape::get_area() const = 0;\n\
    \nint Circle::get_area() const override {\n    return 3.14 * radius * radius;\n\
    }\nint Rectangle::get_area() const override {\n    return width * height;\n}\n\
    \nint get_area(const Shapes shape) {\n    return inspect (shape) {\n        <Circle>\
    \ [r] => 3.14 * r * r,\n        <Rectangle> [w, h] => w * h\n    }\n}\n```\n```\n\
    \nThe proposal P1371R2 on pattern matching offers more advanced use cases. For\
    \ example, pattern matching can be used to traverse an expression tree¹³.\n\n\
    ¹³https://en.wikipedia.org/wiki/Binary_expression_tree"
