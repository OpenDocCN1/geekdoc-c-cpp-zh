  md: "# #### 5.5.2.1 Compile Time\n\n+   - Performance: If the format string is checked\
    \ at compile time, there is nothing to do at run time. Consequently, the three\
    \ functions `std::format`, `std::format_to`, and `std::format_to_n` promise excellent\
    \ performance. The prototype library `fmt`⁴⁷ has a few exciting benchmarks.\n\
    +   - Safety: Using a wrong format string at compile time causes a compilation\
    \ error. On the contrary, using a format string at run time with `std::vformat`\
    \ or `std::vformat_to` causes a `std::format_error` exception.\n\nI will use the\
    \ next sections to fill in the theory with practice. Let me start with the argument\
    \ id and continue with the format specification.\n\n# #### 5.5.2.2 Argument ID\n\
    \nThanks to the argument id, you can reorder or address particular arguments.\n\
    \nUsing the argument id\n\n```\n```cpp\n// formatArgumentID.cpp\n\n#include <format>\n\
    #include <iostream>\n#include <string>\n\nint main() {\n\n  std::cout << '\\n';\n\
    \n  std::cout << std::format(\"{} {}: {}!\\n\", \"Hello\", \"World\", 2020);\n\
    \n  std::cout << std::format(\"{1} {0}: {2}!\\n\", \"World\", \"Hello\", 2020);\n\
    \n  std::cout << std::format(\"{0} {0} {1}: {2}!\\n\", \"Hello\", \"World\", 2020);\n\
    \n  std::cout << std::format(\"{0}: {2}!\\n\", \"Hello\", \"World\", 2020);\n\n\
    \  std::cout << '\\n';\n\n}\n```\n```\n\nLine 11 displays the argument in the\
    \ given order. On the contrary, line 13 reorders the first and second argument,\
    \ line 15 shows the first argument twice, and line 17 ignores the second argument.\n\
    \nFor completeness, here is the output of the program:\n\n1) https://github.com/fmtlib/fmt"
