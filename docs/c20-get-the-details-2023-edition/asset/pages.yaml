  md: "# Definition of the concept std::semiregular and std::regular\n\n```\n```cpp\n\
    template<class T>\nconcept movable = is_object_v<T> && move_constructible<T> &&\n\
    \                  assignable_from<T&, T> && swappable<T>;\n\ntemplate<class T>\n\
    concept copyable = copy_constructible<T> && movable<T> &&\n                  assignable_from<T&,\
    \ T&> &&\n                  assignable_from<T&, const T&>;\n\ntemplate<class T>\n\
    concept semiregular = copyable<T> && default_initializable<T>;\n\ntemplate<class\
    \ T>\nconcept regular = semiregular<T> && equality_comparable<T>;\n```\n```\n\n\
    Interestingly, the `std::regular` concept is defined similarly to concept Regular.\
    \ On the other hand, the `std::semiregular` concept is combined with more elementary\
    \ concepts, such as `std::copyable` and `std::movable`. The concept `std::movable`\
    \ is based on the type-traits function `std::is_object`<sup>32</sup>. `cppreference.com`\
    \ also provides a possible implementation of the compile-time predicate.\n\n#\
    \ A possible implementation of the type trait std::is_object\n\n```\n```cpp\n\
    template <class T>\nstruct is_object : std::integral_constant<bool,\n        \
    \                 std::is_scalar<T>::value ||\n                         std::is_array<T>::value\
    \ ||\n                         std::is_union<T>::value ||\n                  \
    \       std::is_class<T>::value > {};\n```\n```\n\nA type is an object if it is\
    \ either a scalar, an array, a union, or a class.\n\nTo conclude this section,\
    \ I want to apply the user-defined concept Regular and the C++20 concept `std::regular`.\
    \ The program regularSemiRegular.cpp does this job."
