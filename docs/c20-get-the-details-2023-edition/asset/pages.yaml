  md: "# **Unsafe comparison of integers resolved**\n\n```\n~~~cpp\n// unsafeComparison2.cpp\n\
    \nint main() {\n    int x = -3;\n    unsigned int y = 7;\n\n    bool val = x <\
    \ y;\n    static_assert(static_cast<unsigned int>(-3) == 4'294'967'293);\n}\n\
    ~~~\n```\n\nIn the example, I'm focusing on the less-than operator. C++ Insights^11\
    \ gives me the following output:\n\n```\n~~~cpp\nint main()\n{\n    int x = -3;\n\
    \    unsigned int y = 7;\n    bool val = static_cast<unsigned int>(x) < y;\n \
    \   /* PASSED: static_assert(static_cast<long>(static_cast<unsigned int>(-3))\
    \ == 4294967293L); */\n}\n~~~\n```\n\n# **Unsafe comparison analyzed**\n\nHere\
    \ is what's happening:\n\n+   - The compiler transforms the expression x < y (line\
    \ 7) into static_cast<unsigned int>(x) < y. In particular, the signed x is converted\
    \ to an unsigned int.\n+   - Due to the conversion, -3 becomes 4'294'967'293.\n\
    +   - 4'294'967'293 is equal to -3 mod 2^32\n+   - 32 is the number of bits of\
    \ an unsigned int on C++ Insights.\n\nThanks to C++20, we have a safe comparison\
    \ of integers.\n\n# ### 5.4.1.2 Safe Comparison of Integers\n\nC++20 supports\
    \ six comparison functions for integers:"
  merge: -1
