  md: "The application of pattern matching on `std::tuple`, `std::variant`, or polymorphy\
    \ demonstrates its power.\n\n+   - `std::tuple`\n\n# std::tuple versus pattern\
    \ matching\n\n```\n```cpp\nauto& [x, y] = p;\nif (x == 0 && y == 0) {\n    std::cout\
    \ << \"on origin\";\n} else if (x == 0) {\n    std::cout << \"on y-axis\";\n}\
    \ else if (y == 0) {\n    std::cout << \"on x-axis\";\n} else {\n    std::cout\
    \ << x << ',' << y;\n}\n\ninspect (p) {\n    [0, 0]: std::cout << \"on origin\"\
    ;\n    [0, y]: std::cout << \"on y-axis\";\n    [x, 0]: std::cout << \"on x-axis\"\
    ;\n    [x, y]: std::cout << x << ',' << y;\n}\n```\n```\n\n+   - `std::variant`\n\
    \n# std::variant versus pattern matching\n\n```\n```cpp\nstruct visitor {\n  \
    \  void operator()(int i) const {\n        os << \"got int: \" << i;\n    }\n\
    \    void operator()(float f) const {\n        os << \"got float: \" << f;\n \
    \   }\n    std::ostream& os;\n};\nstd::visit(visitor{strm}, v);\n\ninspect (v)\
    \ {\n    <int> i: strm << \"got int: \" << i;\n    <float> f: strm << \"got float:\
    \ \" << f;\n}\n```\n```\n\n+   - Polymorphic data types"
