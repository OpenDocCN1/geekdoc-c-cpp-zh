    \ of a std::vector\n\n```\n~~~cpp\n// constPropagationContainer.cpp\n\n#include\
    \ <iostream>\n#include <vector>\n\ntemplate <typename T>\nvoid modifyConstRange(const\
    \ T& cont) {\n    cont[0] = 5;\n}\n\nint main() {\n\n    std::vector myVec{1,\
    \ 2, 3, 4, 5};\n    modifyConstRange(myVec);          // ERROR\n\n}\n~~~\n```\n\
    \nThe call modifyConstRange(myVec) causes a compile-time error.\n\nOn the contrary,\
    \ views model shallow constness. They do not propagate the constness to their\
    \ elements. They can still be modified."
