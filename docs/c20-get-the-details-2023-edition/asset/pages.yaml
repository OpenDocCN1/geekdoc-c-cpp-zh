    +   - calls `prom.final_suspend()` and `co_awaits` the result (line 11)


    When you use `co_await expr` in a coroutine, or the compiler implicitly invokes
    `co_await prom.initial_suspend()`, `co_await prom.final_suspend()`, or `co_await
