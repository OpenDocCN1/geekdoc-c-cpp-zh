  md: "# ### Definition of `std::ranges::filter_view::begin`\n\n```\n```cpp\nif constexpr\
    \ (ranges::forward_range<V>)\n    return /* iterator */{*this, ranges::find_if(base_,\
    \ std::ref(*pred_))};\nelse\n{\n    if (!begin_has_value())\n        begin_ =\
    \ ranges::find_if(base_, std::ref(*pred_)); // caching\n    return /* iterator\
    \ */{*this, begin_value()};\n}\n```\n```\n\nLet’s analyze lines 5 - 7. First,\
    \ the compiler checks if `begin_has_value()` is true. If not, it determines `begin_`.\
    \ This means that this member function caches the result within the `std::ranges::filter_view`\
    \ object for use on subsequent calls. This caching has serious consequences. Let\
    \ me exemplify this with a code snippet.\n\n# ### Efficiency of `std::views::filter`\n\
    \n```\n```cpp\n// cachingRanges.cpp\n\n#include <numeric>\n#include <iostream>\n\
    #include <ranges>\n#include <vector>\n\nint main() {\n\n    std::vector<int> vec(1'000'000);\n\
    \    std::iota(vec.begin(), vec.end(), 0);\n\n    for (int i : vec | std::views::filter([](auto\
    \ v) { return v > 1000; })\n                       | std::views::take(5)) {\n\
    \        std::cout << i << \" \";   // 1001 1002 1003 1004 1005\n    }\n\n}\n\
    ```\n```\n\nThe first call of `std::views::filter([](auto v) { return v > 1000;\
    \ })` determines the begin iterator and reuses it in subsequent calls. The benefit\
    \ of this caching is obvious. Many subsequent iterations of the pipeline are spared.\
    \ But there are also severe drawbacks: cache issues and constness issues.\n\n\
    # ### 5.1.9.1 Cache\n\nHere are the two important cache rules for ranges:"
