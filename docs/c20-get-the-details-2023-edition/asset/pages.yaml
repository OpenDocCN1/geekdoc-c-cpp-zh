  md: "In contrast to a naive calculation of the midpoint of two numbers first and\
    \ second with the expression `(first + second) / 2`, `std::midpoint(first, second)`\
    \ automatically deals with overflow errors.\n\n# Calculating the midpoint of two\
    \ big numbers without overflow\n\n```\n```cpp\n// midpoint.cpp\n\n#include <limits>\n\
    #include <numeric>\n#include <iostream>\n\nint main() {\n\n    std::cout << '\\\
    n';\n\n    int first = std::numeric_limits<int>::max();\n    int second = std::numeric_limits<int>::max()\
    \ - 2;\n\n    std::cout << \"first: \" << first << '\\n';\n    std::cout << \"\
    second: \" << second << '\\n';\n\n    std::cout << '\\n';\n\n    std::cout <<\
    \ \"(first + second) / 2: \" << (first + second) / 2 << '\\n';\n    std::cout\
    \ << \"std::midpoint(first, second): \" << std::midpoint(first, second) << '\\\
    n';\n\n    std::cout << '\\n';\n\n}\n```\n```\n\nThe calculation `(first + second)\
    \ / 2` (line 19) causes an overflow because the variable `first` (line 19) is\
    \ the largest possible value for type `int` and the variable `second` (line 20)\
    \ is quite close to it. On the contrary, `std::midpoint(first, second)` (line\
    \ 20) returns the correct value.\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_342_0.png)\n\
    \nCalculating the midpoint of two big numbers without overflow"
