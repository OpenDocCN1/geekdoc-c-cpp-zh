  md: '# # Time of Day


    | Function | Description |

    |---|---|

    | tofDay_is_negative() | Returns if the time duration is negative |

    | tofDay_to_duration() | Returns the time duration since midnight<br>If tofDay_is_negative(),
    returns -(h + m + s + ss),<br>otherwise h + m + s + ss |

    | tofDay_fractional_width | Number of fractional decimal digits |

    | std::chrono::make12(hour) | Returns the 12-hour equivalent of a 24-hour format
    time |

    | std::chrono::make24(hour) | Returns the 24-hour equivalent of a 12-hour format
    time |

    | std::chrono::is_am(hour) | Detects if the 24-hour format time is a.m. |

    | std::chrono::is_pm(hour) | Detects if the 24-hour format time is p.m. |


    Depending on the used time duration, the static member provides the appropriate
    tofDay_fractional_width. If no such value of fractional_width in the range [0,
    18] exists, then fractional_width is 6. See for example, std::chrono::duration<int,
    std::ratio<1, 3>> in the following table.


    # fractional_width


    | Time Duration | Value of fractional_width |

    |---|---|

    | std::chrono::hours | 0 |

    | std::chrono::minutes | 0 |

    | std::chrono::seconds | 0 |

    | std::chrono::milliseconds | 3 |

    | std::chrono::microseconds | 6 |

    | std::chrono::nanoseconds | 9 |

    | std::chrono::duration<int, std::ratio<1, 2>> | 1 |

    | std::chrono::duration<int, std::ratio<1, 3>> | 6 |


    The use of the chrono type std::chrono::hh_mm_ss is straightforward.'
