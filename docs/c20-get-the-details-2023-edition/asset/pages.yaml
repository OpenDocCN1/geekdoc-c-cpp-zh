- pgno: 154
  md: "The command line to compile the program is not different from the previous\
    \ ones. Consequently, I skip it and present the output of the program directly:\n\
    \n![](img/c60a87adb7f61e2e82071d081bbb389a_154_0.png)\n\nUse of the function template\
    \ sum\n\nWith modules, we get a new kind of linkage.\n\n# ### 4.2.4.3 Migrating\
    \ from Headers to Modules\n\nBroadly speaking, there are two options when migrating\
    \ from headers to modules. You can use header units instead of headers, or reimplement\
    \ your header in one module or in a module partition. From the implementers perspective\
    \ and the users perspective, both options are very convenient.\n\nFor convenience,\
    \ I refer to modules and module partitions as modules for the rest of this section.\n\
    \nHeader units are a no-brainer for the implementer. Headers are a good starting\
    \ point for modules because they already provide the necessary modularization\
    \ of the system. The user of the header units has to replace the #include directive\
    \ with the new import statement and add a semicolon (;).\n\nReplacing headers\
    \ with a header units\n\n```\n    #include <vector> => import <vector>;\n    #include\
    \ \"math.h\" => import \"math.h\";\n```\n\nUsing a module makes no significant\
    \ difference for the user. Importing a module is quite similar to including a\
    \ header.\n\nReplacing headers with modules\n\n```\n    #include <vector> => import\
    \ vector;\n    #include \"math.h\" => import math;\n```\n\nThe burden of modules\
    \ lies on their implementer, but the implementer can do this migration successfully,\
    \ thanks to header units. Therefore, a sound migration strategy is to start your\
    \ migration with header units. Only headers that are not importable must be implemented\
    \ as modules. Additionally, new functionality should be implemented as a named\
    \ module."
