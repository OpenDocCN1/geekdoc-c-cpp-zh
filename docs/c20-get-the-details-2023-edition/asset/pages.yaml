- pgno: 462
  md: "# The transformed coroutine\n\n```\n```c\n{\n    Promise prom;\n    co_await\
    \ prom.initial_suspend();\n    try {\n        <function body having co_return,\
    \ co_yield, or co_await>\n    }\n    catch (...) {\n        prom.unhandled_exception();\n\
    \    }\nFinalSuspend:\n    co_await prom.final_suspend();\n}\n```\n```\n\nThe\
    \ compiler automatically runs the transformed code using the functions of the\
    \ promise object. In short, I call this workflow the promise workflow. Here are\
    \ the main steps of this workflow.\n\n+   - Coroutine begins execution\n+    \
    \ - allocates the coroutine frame if necessary\n+     - copies all function parameters\
    \ to the coroutine frame\n+     - creates the prom object prom (line 2)\n+   \
    \  - calls prom.get_return_object() to create the coroutine handle and keeps it\
    \ in a local variable. The result of the call will be returned to the caller when\
    \ the coroutine first suspends.\n+     - calls prom.initial_suspend() and co_awaits\
    \ its result. The promise type typically returns suspend_never for eagerly-started\
    \ coroutines or suspend_always for lazily-started coroutines. (line 3)\n+    \
    \ - the body of the coroutine is executed when co_await prom.initial_suspend()\
    \ resumes\n+   - Coroutine reaches a suspension point\n+     - the return object\
    \ (prom.get_return_object()) is returned to the caller which resumed the coroutine\n\
    +   - Coroutine reaches co_return\n+     - calls prom.return_void() for co_return\
    \ or co_return expression, where expression has type void\n+     - calls prom.return_value(expression)\
    \ for co_return expression, where expression has non-void type.\n+     - destroys\
    \ all stack-created variables\n+     - calls prom.final_suspend() and co_awaits\
    \ its result\n+   - Coroutine is destroyed (by terminating via co_return or via\
    \ uncaught exception, or via the coroutine handle)"
