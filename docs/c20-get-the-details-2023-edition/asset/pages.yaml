- pgno: 149
  md: '# Create the module `head.h.ifc` and use it


    ```

    cl.exe /std:c++latest /EHsc /exportHeader head.h

    cl.exe /std:c++latest /EHsc /headerUnit head.h=head.h.ifc head.cpp

    cl.exe /std:c++latest /EHsc /headerUnit head.h=head.h.ifc helloWorld13.cpp head.obj

    ```


    +   - The flag `/exportHeader` in line 1 causes the creation of the ifc file `head.h.ifc`
    from the header file `head.h`.

    +   - The implementation file `head.cpp` (line 2) and the client file `helloWorld13.cpp`
    (line 3) use the header unit. The flag `/headerUnit head.h=head.h.ifc` imports
    the header and tells the compiler/linker the name of the ifc file for the specified
    header.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_149_0.png)


    Use the module `head.h.ifc`


    # 4.2.3.14.3 GCC Compiler


    Creating and using the module consists of three steps.


    # Create the module head.gcm and use it


    ```

    g++ -fmodules-ts -fmodule-header head.h -std=c++20

    g++ -fmodules-ts -c -std=c++20 head.cpp

    g++ -fmodules-ts -std=c++20 head.h.gcm helloWorld13.cpp -o helloWorld13

    ```


    +   - Line 1 creates the module `head.gcm`. The flag `-fmodule-header` specifies
    that `head.h` is a header unit.

    +   - The following line creates the object file `head.o`.

    +   - Finally, line 3 creates the executable that implicitly refers to the module
    `head.gcm`.


    # 4.2.3.14.4 One Drawback


    There is one drawback with header units. Not all headers are importable. Which
    headers are importable is implementation-defined⁵, but the C++ standard guarantees
    all standard library headers are importable headers. The ability to import excludes
    C headers. They are wrapped in the `std` namespace. For example, `<cstring>` is
    the C++ wrapper for `<string.h>`. You can quickly identify the wrapped C header
    because the pattern is: `xxx.h` becomes `cxxx`.


    > [^5]: https://en.cppreference.com/w/cpp/language/ub'
