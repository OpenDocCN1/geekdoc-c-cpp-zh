  md: "# ### 5.3.1.1 Transient Allocation\n\nTransient allocation means that memory\
    \ allocated at compile time must also be released at compile time. Consequently,\
    \ the compiler can detect a mismatch of allocation and deallocation in a constexpr\
    \ function.\n\nMismatch of allocation and deallocation in constexpr functions\n\
    \n```\n~~~cpp\n// transientAllocation.cpp\n\n#include <memory>\n\nconstexpr auto\
    \ correctRelease() {\n    auto* p = new int[2020];\n    delete [] p;\n    return\
    \ 2020;\n}\n\nconstexpr auto forgottenRelease() {\n    auto* p = new int[2020];\n\
    \    return 2020;\n}\n\nconstexpr auto falseRelease() {\n    auto* p = new int[2020];\n\
    \    delete p;\n    return 2020;\n}\n\nint main() {\n    constexpr int res1 =\
    \ correctRelease();\n    constexpr int res2 = forgottenRelease();\n    constexpr\
    \ int res3 = falseRelease();\n}\n~~~\n```\n\nThe small program has two serious\
    \ issues. First, the memory in the constexpr function forgottenRelease (line 11)\
    \ is not released. Second, the non-array deallocation (line 18) in the constexpr\
    \ function falseRelease (line 16) does not match with the array allocation."
  merge: -1
