  md: "# #### 4.2.3.2.8 Used Compiler\n\nI use mainly the cl.exe compiler from Microsoft\
    \ in this book. Microsoft has currently (end of 2023) the best support for modules<sup>47</sup>.\
    \ The Microsoft blog provides a few excellent articles to modules: Overview of\
    \ modules in C++<sup>48</sup>, C++ Modules conformance improvements with MSVC\
    \ in Visual Studio 2019 16.5<sup>49</sup>, and Using C++ Modules in MSVC from\
    \ the Command Line Part 1: Primary Module Interfaces<sup>50</sup>. Neither Clang\
    \ nor GCC provides similar introductions, making it quite difficult to use modules\
    \ with those compilers.\n\nI exemplify the usage of header units in the corresponding\
    \ chapter.\n\n# #### 4.2.3.3 Export\n\nThere are three ways to export names in\
    \ a module interface unit: export specifier, export group, and export namespace.\n\
    \n# #### 4.2.3.4 Export Specifier\n\nYou can export each name explicitly.\n\n\
    | Export specifier |\n| --- |\n| `export module math;` |\n| `export int mult(int\
    \ fir, int sec);` |\n| `export void doTheMath();` |\n\n# #### 4.2.3.5 Export Group\n\
    \nAn export group exports all of its names.\n\n<sup>47</sup> https://en.cppreference.com/w/cpp/compiler_support\
    \  \n<sup>48</sup> https://docs.microsoft.com/en-us/cpp/cpp/modules-cpp?view=msvc-160&viewFallbackFrom=vs-2019\
    \  \n<sup>49</sup> https://devblogs.microsoft.com/cppblog/c-modules-conformance-improvements-with-msvc-in-visual-studio-2019-16-5/\
    \  \n<sup>50</sup> https://devblogs.microsoft.com/cppblog/using-cpp-modules-in-msvc-from-the-command-line-part-1/"
  merge: -1
  img_proc: true
- pgno: 130
  md: "# **Export group**\n\n```\n```\nexport module math;\n\nexport {\n\n    int\
    \ mul(int fir, int sec);\n    void doTheMath();\n\n}\n```\n```\n\n# **4.2.3.6\
    \ Export Namespace**\n\nInstead of an exported group, you can use an export namespace.\n\
    \n# **Export namespace**\n\n```\n```\nexport module math;\n\nexport namespace\
    \ math {\n\n    int mul(int fir, int sec);\n    void doTheMath();\n\n}\n```\n\
    ```\n\nWhen clients use names from an export namespace, they have to qualify them."
