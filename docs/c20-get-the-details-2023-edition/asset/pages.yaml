  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_57_0.png)\n\n# # The Essence of Generic\
    \ Programming\n\nI want to start this short historical detour with a quote from\
    \ the invaluable book *From Mathematics to Generic Programming*, written by Alexander\
    \ Stepanov (creator of the Standard Template Library) and Daniel Rose (information\
    \ retrieval researcher): “*The essence of generic programming lies in the idea\
    \ of concepts. A concept is a way of describing a family of related object types.*”\
    \ These related object types can be integral types such as `bool`, `char`, or\
    \ `int`. A concept embodies a set of requirements on related types such as their\
    \ supported operations, their semantics, and their time and space complexity.\
    \ For example, on average, accessing an unordered associative container's elements\
    \ has constant-time complexity.\n\nThe Standard Template Library (STL) as a generic\
    \ library is based on concepts. From a bird's-eye view, the STL consists of three\
    \ components. Those are containers, algorithms that run on containers, and iterators\
    \ that connect both of them.\n\nEach container provides iterators that respect\
    \ its structure, and the algorithms operate on these iterators. A container, such\
    \ as a sequence container or an associative container, models a semi-open range.\
    \ The elements of the container are accessed via iterators, as well as iterating\
    \ through them, and comparing their equality. The abstraction of the STL is based\
    \ on concepts such as semi-open range and iterator and allows for transparent\
    \ use of the containers and algorithms of the STL.\n\nMore generally, what are\
    \ the advantages of concepts?\n\n# ## 4.1.2 Advantages of Concepts\n\n+   - Requirements\
    \ for template parameters are part of the interface.\n+   - Concepts are executable\
    \ documentation. They document the restrictions on the generic code that the compiler\
    \ verifies.\n+   - The overloading of functions and specialization of class templates\
    \ can be based on concepts.\n+   - Concepts can be used for function templates,\
    \ class templates, and generic member functions of classes or class templates,\
    \ but also variable templates⁴ and alias templates⁵\n+   - You get improved error\
    \ messages because the compiler compares the requirements of the template parameters\
    \ with the given template arguments.\n+   - You can use predefined concepts or\
    \ define your own.\n+   - The usage of auto and concepts is unified. Instead of\
    \ auto, you can use a concept.\n+   - If a function declaration uses a concept,\
    \ it automatically becomes a function template. Writing function templates is,\
    \ therefore, as easy as writing a function.\n\n³https://www.fmi2gp.com/  \n⁴https://en.cppreference.com/w/cpp/language/variable_template\
    \  \n⁵https://en.cppreference.com/w/cpp/language/type_alias"
  merge: -1
