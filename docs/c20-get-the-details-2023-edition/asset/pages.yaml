    # 6.2.2 Atomic Smart Pointer


    A [`std::shared_ptr`](https://en.cppreference.com/w/cpp/memory/shared_ptr) consists
    of a control block and its resource. The control block is thread-safe, but access
    to the resource is not. This means modifying the reference counter is an atomic
    operation, and you have the guarantee that the resource is deleted exactly once.
    These are the guarantees `std::shared_ptr` gives you.


    22. https://en.cppreference.com/w/cpp/atomic/memory_order

    23. https://en.cppreference.com/w/cpp/memory/shared_ptr'
