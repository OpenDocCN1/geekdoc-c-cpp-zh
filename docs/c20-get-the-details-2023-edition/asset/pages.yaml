  md: "```\n```cpp\n}\n// Block until work is done\ncompletion_latch.wait();\n}\n\
    ```\n```\n\nThe counter of `std::latch` `completion_latch` is set to `NTASKS`\
    \ (line 3). The thread pool executes `NTASKS` jobs (lines 4 - 10). At the end\
    \ of each job, the counter is decremented (line 8). The thread running function\
    \ `DoWork` blocks in line 12 until all tasks are done.\n\n# 3.4.4 Cooperative\
    \ Interruption\n\nThanks to `std::stop_token`, a `std::jthread` can be interrupted\
    \ cooperatively.\n\nInterrupting a `std::jthread`\n\n```\n```cpp\nint main() {\n\
    \n    std::cout << '\\n';\n\n    std::jthread nonInterruptible([]{\n        int\
    \ counter{};\n        while (counter < 10){\n            std::this_thread::sleep_for(0.2s);\n\
    \            std::cerr << \"nonInterruptible: \" << counter << '\\n';\n      \
    \      ++counter;\n        }\n    });\n\n    std::jthread interruptible([](std::stop_token\
    \ stoken){\n        int counter{};\n        while (counter < 10){\n          \
    \  std::this_thread::sleep_for(0.2s);\n            if (stoken.stop_requested())\
    \ return;\n            std::cerr << \"interruptible: \" << counter << '\\n';\n\
    \            ++counter;\n        }\n    });\n\n    std::this_thread::sleep_for(1s);\n\
    \n    std::cerr << '\\n';\n    std::cerr << \"Main thread interrupts both jthreads\"\
    \ << std::endl;\n    nonInterruptible.request_stop();\n    interruptible.request_stop();\n\
    }\n```\n```"
