    \ specifies a range whose iterator type satisfies `std::input_iterator` (e.g.\
    \ can iterate from beginning to end at least once)\n+   - `std::ranges::output_range`:\
    \ specifies a range whose iterator type satisfies `std::output_iterator`\n+  \
    \ - `std::ranges::forward_range`: specifies a range whose iterator type satisfies\
    \ `std::forward_iterator` (can iterate forward from beginning to end more than\
    \ once)\n+   - `std::ranges::bidirectional_range`: specifies a range whose iterator\
    \ type satisfies `std::bidirectional_iterator` (can iterate forward and backward\
    \ more than once)\n+   - `std::ranges::random_access_range`: specifies a range\
    \ whose iterator type satisfies `std::random_access_iterator` (can jump in constant\
    \ time to an arbitrary element with the index operator `[]`)\n+   - `std::ranges::contiguous_range`:\
    \ specifies a range whose iterator type satisfies `std::contiguous_iterator` (elements\
    \ are stored consecutively in memory)\n\nEach container of the Standard Template\
    \ Library supports a specific range. The supported range specifies the capabilities\
