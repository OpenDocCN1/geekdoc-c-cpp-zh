    ```


    Line (16) returns the new logical end newEnd of the container myVec. This new
    logical end is applied in line 18 to remove all elements from myVec starting at
    newEnd. When you apply the functions remove and erase in one expression such as
    in line 19, you see exactly why this construct is called erase-remove idiom.'
