  md: "# ## 8.1 C++23\n\nThis C++23 chapter should give you a first impression but\
    \ not a detailed presentation of C++23.\n\nLet me start with the core language.\n\
    \n# ### 8.1.1 Core Language\n\n# #### 8.1.1.1 Deducing This\n\nDeducing this,\
    \ sometimes also called explicit object parameter, allows it to make the implicit\
    \ this pointer of a member function explicit. Similar to [Python](https://www.python.org/),\
    \ the explicit object parameter must be the first function parameter and is called\
    \ in C++, by convention, self and self.\n\n```\n```cpp\nstruct Test {\n    void\
    \ implicitParameter();                 // implicit this pointer\n    void explicitParameter(this\
    \ Self& self);  // explicit this pointer\n};\n```\n```\n\nImplicit this enables\
    \ new programming techniques in C++23: deduplication of function overloading based\
    \ on the object's lvalue/rvalue value category and its constness. Additionally,\
    \ you can reference a lambda and invoke it recursively. Furthermore, deducing\
    \ this simplifies the implementation of [CRTP](https://en.cppreference.com/w/cpp/language/crtp).\n\
    \n# ##### 8.1.1.1.1 Deduplicating Function Overloading\n\nAssume you want to overload\
    \ a member function based on the lvalue/rvalue value category and constness of\
    \ the calling object. This means you have to overload your member function four\
    \ times.\n\n**Deduplicating Function Overloading**\n\n```\n```cpp\n// deducingThis.cpp\n\
    \n#include <iostream>\n\nstruct Test {\n    template <typename Self>\n    void\
    \ explicitCall(this Self& self, const std::string& text) {\n        std::cout\
    \ << text << '\\n';\n        std::cout << forward<Self>(self).implicitCall();\n\
    \        std::cout << '\\n';\n    }\n};\n```\n```\n\n[1] https://www.python.org/\
    \  \n[2] https://www.modernescpp.com/index.php/c-is-still-lazy"
