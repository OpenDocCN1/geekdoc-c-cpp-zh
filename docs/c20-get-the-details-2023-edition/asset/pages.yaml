    # Distilled Information


    +   - With C++20, we get two new keywords: `consteval` and `constinit`. `consteval`
    produces a function that is executed at compile time, and `constinit` guarantees
    that the variable is initialized at compile time.

    +   - In contrast to `constexpr` in C++11, `consteval` guarantees that the function
    is executed at compile time.

    +   - There are subtle differences between `const`, `constexpr`, and `constinit`.
    `const` and `constexpr` create constant variables. `constexpr` and `constinit`
    are executed at compile time.'
