  md: "# **MyInt supports less than comparisons**\n\n```\n```cpp\n// comparisonOperator.cpp\n\
    \n#include <iostream>\n\nstruct MyInt {\n    int value;\n    explicit constexpr\
    \ MyInt(int val): value{val} { }\n    bool operator < (const MyInt& rhs) const\
    \ {\n        return value < rhs.value;\n    }\n};\n\ntemplate <typename T>\nconstexpr\
    \ bool isLessThan(const T& lhs, const T& rhs) {\n    return lhs < rhs;\n}\n\n\
    int main() {\n\n    std::cout << std::boolalpha << '\\n';\n\n    MyInt myInt2011(2011);\n\
    \    MyInt myInt2014(2014);\n\n    std::cout << \"isLessThan(myInt2011, myInt2014):\
    \ \"\n              << isLessThan(myInt2011, myInt2014) << '\\n';\n\n    std::cout\
    \ << '\\n';\n\n}\n```\n```\n\nThe program works as expected:"
