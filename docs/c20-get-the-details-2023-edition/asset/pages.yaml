- pgno: 393
  md: "# 5.6.4.3 Cute Syntax\n\nThe cute syntax consists of overloaded division operators\
    \ to specify a calendar date. The overloaded operators support date literals (e.g.,\
    \ `2020y`, `3d`) and `std::chrono::month` constants such as `std::chrono::January`,\
    \ `std::chrono::February`, ... `std::chrono::December`).\n\nThe following three\
    \ combinations of year, month, and day are possible using the cute syntax.\n\n\
    | Cute syntax |\n|---|\n| year/month/day |\n| day/month/year |\n| month/day/year\
    \ |\n\nThese combinations are not chosen arbitrarily. They are the ones used worldwide.\
    \ Any other combination is not allowed.\n\nConsequently, when you choose the type\
    \ year, month, or day for the first argument, the type for the remaining two arguments\
    \ is no longer necessary, and a number does the job.\n\n```\n```cpp\n// cuteSyntax.cpp\n\
    \n#include <chrono>\n#include <iostream>\n\nint main() {\n\n    std::cout << '\\\
    n';\n\n    constexpr auto yearMonthDay{std::chrono::year(1966)/6/26};\n    std::cout\
    \ << yearMonthDay << '\\n';\n\n    constexpr auto dayMonthYear{std::chrono::day(26)/6/1966};\n\
    \    std::cout << dayMonthYear << '\\n';\n\n    constexpr auto monthDayYear{std::chrono::month(6)/26/1966};\n\
    \    std::cout << monthDayYear << '\\n';\n\n    constexpr auto yearDayMonth{std::chrono::year(1966)/std::chrono::month(26)/6};\n\
    \    std::cout << yearDayMonth << '\\n';\n\n    std::cout << '\\n';\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
