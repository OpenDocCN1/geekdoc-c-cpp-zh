- pgno: 336
  md: "# ### Six safe comparison functions\n\n| Compare Function | Meaning |\n|---|---|\n\
    | std::cmp_equal | == |\n| std::cmp_not_equal | != |\n| std::cmp_less | < |\n\
    | std::cmp_less_equal | <= |\n| std::cmp_greater | > |\n| std::cmp_greater_equal\
    \ | >= |\n\nThanks to the six comparison functions, I can easily transform the\
    \ previous program unsafeComparison.cpp into the program safeComparison.cpp. The\
    \ new comparison functions require the header <utility>.\n\n# ### Safe comparison\
    \ of integers\n\n```\n~~~cpp\n// safeComparison.cpp\n\n#include <iostream>\n#include\
    \ <utility>\n\nint main() {\n\n    std::cout << '\\n';\n\n    std::cout << std::boolalpha;\n\
    \n    int x = -3;\n    unsigned int y = 7;\n\n    std::cout << \" -3 == 7: \"\
    \ << std::cmp_equal(x, y) << '\\n';\n    std::cout << \" -3 != 7: \" << std::cmp_not_equal(x,\
    \ y) << '\\n';\n    std::cout << \" -3 < 7: \" << std::cmp_less(x, y) << '\\n';\n\
    \    std::cout << \" -3 <= 7: \" << std::cmp_less_equal(x, y) << '\\n';\n    std::cout\
    \ << \" -3 > 7: \" << std::cmp_greater(x, y) << '\\n';\n    std::cout << \" -3\
    \ >= 7: \" << std::cmp_greater_equal(x, y) << '\\n';\n\n    std::cout << '\\n';\n\
    \n}\n~~~\n```"
  merge: -1
  img_proc: true
