    \ class RandomIt, class Compare >\nconstexpr void sort( RandomIt first, RandomIt\
    \ last, Compare comp );\n\ntemplate< class ExecutionPolicy, class RandomIt, class\
    \ Compare >\nvoid sort( ExecutionPolicy&& policy,\n           RandomIt first,\
    \ RandomIt last, Compare comp );\n```\n```\n\nstd::sort has four overloads in\
    \ C++20. Let’s see what I can deduce from the names of the function declarations.\
    \ All four overloads take a range, given by a begin and end iterator. The iterators\
    \ must be random access iterators. The first and third overloads (lines 1 and\
    \ 8) are declared as constexpr and can run at compile time. The second and fourth\
    \ overloads (lines 4 and 11) require an execution policy<sup>16</sup>. The execution\
    \ policy lets you specify if the program should run sequentially, parallel, or\
    \ vectorized. Additionally, the last two overloads (lines 8 and 11) let you specify\
    \ the sorting strategy. Compare has to be a binary predicate. A binary predicate\
    \ is a callable that takes two arguments and returns something convertible to\
    \ a bool.\n\nI assume my analysis reminded you of concepts. But there is a big\
    \ difference. The names in the `std::sort` do not stand for concepts but only\
    \ for documentation purposes. In `std::ranges::sort` the names are concepts.\n\
    \n```\n```cpp\ntemplate <std::random_access_iterator I, std::sentinel_for<I> S,\n\
    \          class Comp = ranges::less, class Proj = std::identity>\nrequires std::sortable<I,\
    \ Comp, Proj>\nconstexpr I sort(I first, S last, Comp comp = {}, Proj proj = {});\n\
    \ntemplate <ranges::random_access_range R, class Comp = ranges::less,\n      \
    \    class Proj = std::identity>\nrequires std::sortable<ranges::iterator_t<R>,\
    \ Comp, Proj>\nconstexpr ranges::borrowed_iterator_t<R> sort(R&& r, Comp comp\
    \ = {}, Proj proj = {});\n```\n```\n\nWhen you study the two overloads, you notice\
    \ that it takes a sortable range R (lines 3 and 8), either given by a begin iterator\
    \ and end sentinel (line 1) or by a `ranges::random_access_range` (line 6). The\
    \ iterator and the range must support random access. Additionally, the overloads\
    \ take a predicate Comp, and a projection Proj. The predicate Comp is used for\
    \ default less, and the projection Proj the identity\n\n> <sup>16</sup>https://www.modernescpp.com/index.php/parallel-algorithms-of-the-stl-with-gcc"
