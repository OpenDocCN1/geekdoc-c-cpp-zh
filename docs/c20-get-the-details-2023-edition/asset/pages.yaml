    # 5.5.2.3 Format Specification


    I won''t present the formal format specification for basic types, string types,
    or chrono types. For basic types and std::string, read the full details here:
    standard format specification^11^. Accordingly, you can find the details of chrono
    types here: chrono format specification^12^.


    Instead, I present a pragmatic description of the format string for basic types,
    string types, and chrono types. The presentation of chrono types is in the Calendar
    and Time Zones chapter.


    A simplified format specification for basic types and string types


    ```

    fill_align(opt) sign(opt) #(opt) 0(opt) width(opt) precision(opt) L(opt) type(opt)

    ```


    All parts are optional (opt). The following few sections present the features
    of this format specification.


    # 5.5.2.3.1 Fill Character and Alignment


    The fill character is optional (any character except { or }) and followed by an
    alignment specification. To us the fill character you must specify the alignment.


    +   * Fill character: by default, space is used

    +   * Alignment:

    +     - <: left (default for non-numbers)

    +     - >: right (default for numbers)

    +     - ^: center'
