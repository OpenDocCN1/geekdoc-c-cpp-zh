    # ## 8.1.2 The Standard Library\n\n# ### 8.1.2.1 Ranges Extensions\n\nThe ranges\
    \ library got powerful extensions in C++23. This extension includes a convenient\
    \ way to construct a container, various new views, and with `std::generator` the\
    \ first concrete coroutine.\n\n# #### 8.1.2.1.1 ranges::to\n\n`std::ranges::to`\
    \ is a convenient way to construct a container from a range:\n\n```\n~~~cpp\n\
    std::vector<int> range(int begin, int end, int stepsize = 1) {\n    auto boundary\
    \ = [end](int i){ return i < end; };\n    std::vector<int> result = std::ranges::views::iota(begin)\n\
    \                            | std::views::stride(stepsize)\n                \
    \            | std::views::take_while(boundary)\n                            |\
    \ std::ranges::to<std::vector>();\n    return result;\n}\n~~~\n```\n\nThe function\
    \ `range` creates a `std::vector<int>` consisting of all elements from `begin`\
    \ to `end` with the `stepsize` stepsize. `begin` must be smaller than `end`. Thanks\
    \ to `std::ranges::to`, the element can be directly pushed into the `std::vector`.\n\
    \n# #### 8.1.2.1.2 New Views\n\nC++23 supports additional views:"
