  md: "# 6.6.2 Cooperative Interruption of a `std::jthread`\n\nTo get the general\
    \ idea, let me present a simple example.\n\nInterrupt a non-interruptible and\
    \ interruptible `std::jthread`\n\n```\n```cpp\n// interruptJthread.cpp\n\n#include\
    \ <chrono>\n#include <iostream>\n#include <thread>\n\nusing namespace std::literals;\n\
    \nint main() {\n\n    std::cout << '\\n';\n\n    std::jthread nonInterruptible([]{\n\
    \        int counter{};\n        while (counter < 10){\n            std::this_thread::sleep_for(0.2s);\n\
    \            std::cerr << \"nonInterruptible: \" << counter << '\\n';\n      \
    \      ++counter;\n        }\n    });\n\n    std::jthread interruptible([](std::stop_token\
    \ stoken){\n        int counter{};\n        while (counter < 10){\n          \
    \  std::this_thread::sleep_for(0.2s);\n            if (stoken.stop_requested())\
    \ return;\n            std::cerr << \"interruptible: \" << counter << '\\n';\n\
    \            ++counter;\n        }\n    });\n\n    std::this_thread::sleep_for(1s);\n\
    \n    std::cerr << '\\n';\n    std::cerr << \"Main thread interrupts both jthreads\"\
    \ << '\\n';\n    nonInterruptible.request_stop();\n    interruptible.request_stop();\n\
    \n    std::cout << '\\n';\n```\n```"
