  md: '# ## 5.6 Calendar and Time Zones


    ![](img/c60a87adb7f61e2e82071d081bbb389a_373_0.png)


    Cippi studies the calendar


    To get the most out of the chapter about calendars and time zones, a basic understanding
    of the chrono terminology is essential.


    # ### 5.6.1 Basic Chrono Terminology


    Essentially, the time-zone functionality (C++20) is based on the calendar functionality
    (C++20) and the calendar functionality (C++20), which are based on the chrono
    functionality (C++11). Consequently, this basic chrono terminology starts with
    the three C++11 components time point, time duration, and clock.


    +   - A **time point** is defined by a starting point, the so-called epoch, and
    additional time duration since the epoch.

    +   - A **time duration** is the difference between two time points. The number
    of ticks of the clock defines the time duration.

    +   - A **clock** consists of a starting point (epoch) and a tick to calculate
    the current time point.


    You can subtract time points and get a time duration. You get a new time point
    when you add a time duration to a time point. A year is the typical accuracy of
    the clock and the measure of the time duration.


    I will use the three concepts to present the lifetime of the 2011 died father
    of the programming language C: Dennis Ritchie. For simplicity reasons, I''m only
    interested in the years.'
