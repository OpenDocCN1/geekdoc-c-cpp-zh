  md: "defined in another translation unit, and `staticB` needs `staticA` to initialize\
    \ itself, you end up with the static initialization order fiasco. The program\
    \ is ill-formed because you have no guarantee which static variable is initialized\
    \ first at (dynamic) run time.\n\nBefore I write about the solution, let me show\
    \ you the static initialization order fiasco in action.\n\n# 4.5.4.1.1 A 50:50\
    \ Chance to get it Right\n\nWhat is unique about the initialization of statics?\
    \ The initialization-order of statics happens in two steps: static and dynamic.\n\
    \nWhen a static cannot be const-initialized during compile time, it is zero-initialized.\
    \ At run time, the dynamic initialization happens for these statics that was zero-initialized.\n\
    \nThe static initialization order fiasco\n\n```\n```cpp\n// sourceSIOF1.cpp\n\n\
    int square(int n) {\n    return n * n;\n}\n\nauto staticA = square(5);\n```\n\
    ```\n\nThe static initialization order fiasco\n\n```\n```cpp\n// mainSIOF1.cpp\n\
    \n#include <iostream>\n\nextern int staticA;\nauto staticB = staticA;\n\nint main()\
    \ {\n\n    std::cout << '\\n';\n\n    std::cout << \"staticB: \" << staticB <<\
    \ '\\n';\n\n    std::cout << '\\n';\n\n}\n```\n```\n\nLine 5 declares the static\
    \ variable `staticA`. The initialization of `staticB` depends on the initialization\
    \ of `staticA`. But `staticB` is zero-initialized at compile time and dynamically\
    \ initialized at run time."
