  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_162_0.png)\n\n# Automatic Comparison\
    \ of Pointers\n\nThe compiler-generated comparison operator compares the pointers\
    \ but not the referenced objects.\n\n# Automatic Comparison of Pointers\n\n```\n\
    ```cpp\n// spaceshipPointer.cpp\n\n#include <iostream>\n#include <compare>\n#include\
    \ <vector>\n\nstruct A {\n    std::vector<int>* pointerToVector;\n    auto operator\
    \ <=> (const A&) const = default;\n};\n\nint main() {\n\n    std::cout << '\\\
    n';\n\n    std::cout << std::boolalpha;\n\n    A a1{new std::vector<int>()};\n\
    \    A a2{new std::vector<int>()};\n\n    std::cout << \"(a1 == a2): \" << (a1\
    \ == a2) << \"\\n\\n\";\n\n}\n```\n```\n\nAstonishingly, the result of a1 == a2\
    \ (line 21) is false and not true because the addresses of std::vector<int> are\
    \ compared.\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_162_1.png)\n\nThere are\
    \ three comparison categories.\n\n# 4.3.3 Comparison Categories\n\nThe names of\
    \ the three comparison categories are strong ordering (std::strong_ordering),\
    \ also known as total ordering, weak ordering (std::weak_ordering), and partial\
    \ ordering (std::partial_ordering)."
