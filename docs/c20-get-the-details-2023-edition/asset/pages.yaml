    \ mainly due to the iterator. The member function getNext (line 53) checks if\
    \ the handle coro represents a coroutine (line 54). Additionally, the member function\
    \ begin (line 72) guarantees that the coroutine is only resumed if not completed:\
    \ coro.done() (line 73). To resume an already completed coroutine is undefined\
    \ behavior.\n\n# Resuming a completed coroutine\n\n```\n```\nstd::string helloWorld\
    \ = \"Hello world\";\nauto genChar = getCoroutine(helloWorld);\nfor (const auto&\
    \ val : genChar) {\n    std::cout << val << \" \";\n}\n\nfor (const auto& val\
    \ : genChar) {\n    std::cout << val << \" \";\n}\n```\n```\n\nWithout the check\
    \ coro.done() (line 73) in the program coroutineRange.cpp. The second range-based\
    \ for-loop (line 7) would trigger are resumption of the coroutine, and, therefore,\
    \ undefined behavior.\n\nThe generic function getCoroutine (line 86) uses the\
