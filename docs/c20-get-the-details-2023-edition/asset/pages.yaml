  md: "# #### 5.2.2.1 Default constructor\n\nYou can only default construct a `std::span`\
    \ with dynamic extent (`std::span<int>` sp). Creation of a `std::span` with static\
    \ extent gives a compile-time error (`std::span<int, 5>` sp) if the size is not\
    \ 0: `std::span<int, 0>` sp.\n\n# #### 5.2.2.2 Constructing and Initializing\n\
    \nIn general, a `std::span` can be initialized using a contiguous range, two iterators\
    \ defining a contiguous range, an iterator and a length, or array. The array can\
    \ be a C-array or a C++-array (`std::array`). Let me show you all variations.\n\
    \n**Constructing and initializing `std::span`'s with static and dynamic extent**\n\
    \n```\n~~~cpp\n// constructingInitializingSpan.cpp\n\n#include <array>\n#include\
    \ <list>\n#include <vector>\n#include <span>\n\nint main() {\n\n    std::vector<int>\
    \ myVec{1, 2, 3, 4, 5};\n    std::list<int> myList{1, 2, 3, 4, 5};\n\n    // Direct\
    \ from a container\n\n    std::span<int> mySpan1{myVec};\n    std::span<int, 5>\
    \ mySpan2{myVec};\n    std::span<int, 3> mySpan3{myVec}; // undefined behavior\n\
    \    // std::span<int> mySpan4{myList};  // compile-time error\n\n    // Two iterators\
