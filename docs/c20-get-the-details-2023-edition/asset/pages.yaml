  md: "# 4.2 Modules\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_110_0.png)\n\nCippi\
    \ prepares the packages\n\nModules are one of the four big features of C++20:\
    \ concepts, modules, ranges, and coroutines. Modules promise much: shorter compile\
    \ times, macro isolation, abolishing header files, and avoiding ugly workarounds.\
    \ Before I dive into modules, I want to provide a first example.\n\n# 4.2.1 A\
    \ First Example\n\nLet’s start with a simple math module.\n\n```\n```cpp\n// math.hxx\n\
    \nexport module math;\n\nexport int add(int fir, int sec){\n    return fir + sec;\n\
    }\n```\n```\n\nThe expression `export module math` is the module declaration.\
    \ By putting `export` before the function `add`’s declaration, `add` is exported\
    \ and can, therefore, be used by a module consumer."
