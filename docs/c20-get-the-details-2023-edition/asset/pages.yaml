    \ Description |\n|---|---|\n| sem.try_acquire() | Tries to decrement the counter\
    \ by 1 if it is greater than 0. |\n| sem.try_acquire_for(relTime) | Tries to decrement\
    \ the counter by 1 or blocks for at most relTime if the counter is 0. |\n| sem.try_acquire_until(absTime)\
    \ | Tries to decrement the counter by 1 or blocks at most until absTime if the\
    \ counter is 0. |\n\nThe constructor call std::counting_semaphore<10> sem(5) creates\
    \ a semaphore sem with at least a maximal value of 10 and a counter of 5. The\
    \ call sem.max() returns the maximum possible value of the internal counter. The\
    \ following relations must hold for upd in sem.release(upd = 1): update >= 0 and\
    \ update + counter <= sem.max(). sem.try_acquire_for(relTime) needs a time duration;\
    \ the member function sem.try_acquire_until(absTime) needs a time point. The three\
    \ calls sem.try_acquire, sem.try_acquire_for, and sem.try_acquire_until return\
    \ a boolean indicating the success of the calls.\n\nSemaphores are typically used\
    \ in sender-receiver workflows. For example, initializing the semaphore sem with\
    \ 0 will block the receiver's sem.acquire() call until the sender calls sem.release().\
    \ Consequently, the receiver waits for the notification of the sender. One-time\
    \ synchronization of threads can easily be implemented using semaphores.\n\n#\
