  md: '# # Reader Testimonials


    Sandor Dargo


    ![](img/c60a87adb7f61e2e82071d081bbb389a_10_0.png)


    *Senior Software Development Engineer at Amadeus*


    > ”C++ 20: Get the details’ is exactly the book you need right now if you want
    to immerse yourself in the latest version of C++. It’s a complete guide, Rainer
    doesn’t only discuss the flagship features of C++20, but also every minor addition
    to the language. Luckily, the book includes tons of example code, so even if you
    don’t have direct access yet to the latest compilers, you will have a very good
    idea of what you can expect from the different features. A highly recommended
    read!”


    **Adrian Tam**


    ![](img/c60a87adb7f61e2e82071d081bbb389a_10_1.png)


    *Director of Data Science, Synchron Inc.*


    > ”C++ has evolved a lot from its birth. With C++20, it is like a new language
    now. Surely this book is not a primer to teach you inheritance or overloading,
    but if you need to bring your C++ knowledge up to date, this is the right book.
    You will be surprised about the new features C++20 brought into C++. This book
    gives you clear explanations with concise examples. Its organization allows you
    to use it as a reference later. It can help you unleash the old language into
    its powerful future.”'
