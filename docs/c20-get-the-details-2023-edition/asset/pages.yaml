- pgno: 641
  md: '# # 9. Feature Testing


    The header `<version>` allows you to ask your compiler for its C++11 or later
    support. You can ask for attributes, features of the core language, or the library.
    `<version>` has about 200 macros defined, which expand to a number when the feature
    is implemented. The number represents the year and month in which the feature
    was added to the C++ standard. These are the numbers for static_assert, lambdas,
    and concepts.


    **Macros for static_assert, lambdas, and concepts**


    |  |  |

    | --- | --- |

    | `__cpp_static_assert` | 200410L |

    | `__cpp_lambdas` | 200907L |

    | `__cpp_concepts` | 201907L |


    ![](img/c60a87adb7f61e2e82071d081bbb389a_641_0.png)


    # ## Feature Support


    When I experiment with brand-new C++ features, I check which compiler implements
    the feature I''m interested in. That''s the time I visit cppreference.com/compiler_support,
    searching for the feature I want to try out, and hope that at least one compiler
    of the big three (GCC, Clang, MSVC) implements the new feature.


    Getting the answer partial is not satisfying. In the end I don''t know who I should
    contact when the compilation of a brand-new feature fails.


    ¹https://en.cppreference.com/w/cpp/compiler_support'
  merge: -1
  img_proc: true
