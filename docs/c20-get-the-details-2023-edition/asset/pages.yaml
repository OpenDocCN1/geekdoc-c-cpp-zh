    According to the FAQ at isocpp.org, the static initialization order fiasco is\
    \ “a subtle way to crash your program”. The FAQ continues: “The static initialization\
    \ order problem is a very subtle and commonly misunderstood aspect of C++.”\n\n\
    Before I continue, I want to make a short disclaimer. Dependencies on variables\
    \ with static storage duration (short: statics) in different translation units\
