- pgno: 653
  md: '# 10. Glossary


    The idea of this glossary is by no means to be exhaustive but to provide a reference
    for the essential terms.


    # 10.1 Aggregate


    Aggregates are arrays and class types. A class type is a class, a struct, or a
    union.

    With C++20, the following condition must hold for a class type to be an aggregate.


    +   - No private or protected non-static data members

    +   - No user-declared or inherited constructors

    +   - No virtual, private, or protected base classes

    +   - No virtual member functions


    # 10.2 Automatic Storage Duration


    Object storage with automatic storage duration is automatically allocated at the
    beginning of the enclosing scope and deallocated at its end. All locals except
    objects with static storage duration have automatic storage duration.


    # 10.3 Awaitable


    An Awaitable is something you can await on. It is the argument of `co_await`:
    `co_await awaitable`. The awaitable determines if the coroutine pauses or not.


    # 10.4 Awaiter


    The `co_await` operator needs an awaitable as an argument. Typically, the awaitable
    becomes the awaiter. The concept awaiter requires three functions.'
