    \n# ## 4.1.8.2 Requires Expressions\n\nThanks to requires expressions, you can\
    \ define powerful concepts. A requires expression has the following form:\n\n\
    **Requires expression**\n\n```\n```cpp\nrequires (parameter-list(optional)) {requirement-seq}\n\
    ```\n```\n\n+   - `parameter-list`: A comma-separated list of parameters, such\
    \ as in a function declaration\n+   - `requirement-seq`: A sequence of requirements\
    \ consisting of simple, type, compound, or nested requirements\n\nRequires expressions\
    \ can also be used as a standalone feature when a compile-time predicate is required.\
    \ Read more about this feature in the secion require expression.\n\n# ### 4.1.8.2.1\
    \ Simple Requirements\n\nThe following concept Addable is a simple requirement\n\
    \n**The concept Addable**\n\n```\n```cpp\ntemplate <typename T>\nconcept Addable\
    \ = requires (T a, T b) {\n    a + b;\n};\n```\n```\n\nThe concept Addable requires\
    \ that the addition a + b of two values of the same type T is possible.\n\n# ###\
    \ 4.1.8.2.2 Type Requirements\n\nIn a type requirement, you have to use the keyword\
    \ typename together with a type name."
