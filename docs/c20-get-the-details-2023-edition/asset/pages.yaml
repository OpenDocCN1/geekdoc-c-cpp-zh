  md: "# Parameter Packs in the Capture Clause\n\n```\n```cpp\n// parameterPacksLambda.cpp\n\
    \nvoid hello(int, double, bool) { }\n\ntemplate<typename... Args>\nvoid func(Args...\
    \ args) {\n    auto newFunc = [args...] { return hello(args...); };\n    newFunc();\n\
    }\n\nint main() {\n\n    func(5, 5.5, true);\n\n}\n```\n```\n\n# Generalized Captures\n\
    \n```\n```cpp\n// generalizedCaptures.cpp\n\n#include <memory>\n#include <utility>\n\
    \nint main() {\n\n    auto uniq = std::make_unique<int>(5);\n\n    auto lamb =\
    \ [newUniq = std::move(std::move(uniq))] {\n        int val = *newUniq;\n    };\n\
    \n    lamb();\n\n}\n```\n```\n\nCombining both features was not possible before\
    \ C++20. Since C++20, the asymmetry is gone."
