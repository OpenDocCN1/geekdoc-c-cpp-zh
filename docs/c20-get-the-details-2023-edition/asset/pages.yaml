- pgno: 131
  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_131_0.png)\n\n# Selectively Exporting\
    \ Namespaces\n\nYou can also use the export specifier, the export group, and the\
    \ export namespace inside a namespace. In this case, only exported names are visible\
    \ to a module consumer. The following example uses the three ways to export names\
    \ inside a namespace.\n\nSelectively exporting inside Namespaces\n\n```\n```cpp\n\
    export module math;\n\nnamespace math {\n\n    export int mult(int fir, int sec);\
    \ // use with math::mult\n    export {\n        void doTheMath();            //\
    \ use with math::doTheMath\n    }\n    export namespace mathDetails {   // use\
    \ with math::mathDetails::add\n        int add(int fir, int sec);\n    }\n   \
    \ int div(int fir, int sec);       // no use outside the module\n\n}\n```\n```\n\
    \nThe function div cannot be used outside the module math and has to be fully\
    \ qualified:\nmath::div(6, 2).\n\nOnly names that don’t have an internal linkage\
    \ can be exported.\n\n# 4.2.3.7 Import\n\nThanks to import, you can import a module,\
    \ a module partition, or a header unit.\n\nThe contextual keyword import\n\n```\n\
    ```cpp\nexport module math;\n\nimport math.sin;\nimport math::cos;\nimport <vector>;\n\
    ```\n```\n\nimport is a contextual keyword. This means import is an identifier\
    \ and is only a keyword in certain contexts. Before you import an importable entity,\
    \ you should compile it. If not, you may import an old version of the importable\
    \ entity.\n\n# 4.2.3.8 Guidelines for a Module Structure\n\nLet’s examine guidelines\
    \ for how to structure a module."
  merge: -1
  img_proc: true
- pgno: 132
  md: "# # Guidelines for the structure of a module\n\n```\n```cpp\nmodule;      \
    \                  // starts the global module fragment\n\n#include <headers for\
    \ libraries not modularized so far>\n\nexport module math;            // exporting\
    \ module declaration; starts the module preamble\n\nimport <importing of other\
    \ modules>\n\n<non-exported declarations>    // names only visible inside the\
    \ module\n\nexport namespace math {\n\n    <exported declarations>    // exported\
    \ names\n\n}\n\nmodule :private;               // not part of the interface\n\n\
    // part of the module implementation that does not cause a recompilation\n```\n\
    ```\n\nThis guideline serves one purpose: to give you a module structure and an\
    \ idea of what I'm going to write about. So, what's new in this module structure?\n\
    \n+   - The *global module fragment* starting with the keyword `module` is optional.\
    \ After it and preceding the module declaration, this is the right place to include\
    \ headers. Only preprocessor directives are allowed here.\n+   - The required\
    \ exporting module declaration `export module math` starts the so-called *module\
    \ preamble* followed by the *module purview* that ends at the end of the translation\
    \ unit. The module preamble consists of import declarations, and the module purview\
    \ mainly of export declarations.\n+   - The module purview can have the `private\
    \ module fragment`. The private module fragment is part of the module's implementation\
    \ and can only be used in the primary module interface unit. Modifications in\
    \ the private module fragment do not require the recompilation of the module.\n\
    +   - You can import modules at the beginning of the module purview. The imported\
    \ modules have module linkage and are not visible outside the module. This observation\
    \ also applies to the non-exported declarations.\n+   - I put the exported names\
    \ in namespace `math`, which has the same name as the module.\n+   - The module\
    \ has only declared names. Let's write about the separation of the interface and\
    \ the implementation of a module.\n\nEssentially, the module structure boils down\
    \ to three sections."
  merge: -1
  img_proc: true
