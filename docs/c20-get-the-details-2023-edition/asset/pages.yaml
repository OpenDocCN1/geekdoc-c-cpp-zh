  md: "# Declaration and definition of a function\n\n```\n```cpp\nint add1(int, int);\
    \                 // declaration\nint add2(int a, int b) { return a + b; } //\
    \ definition\n```\n```\n\nFunction `add1` is declared, while `add2` is defined.\
    \ That means, if you use `add1` in an evaluated context, for example, by invoking\
    \ it, you get a link-time error. The key observation is that you can use `add1`\
    \ in unevaluated contexts, such as `typeid`[^70] or `decltype`[^71]. Both operators\
    \ accept unevaluated operands.\n\n# Unevaluated context\n\n```\n```cpp\n// unevaluatedContext.cpp\n\
    \n#include <iostream>\n#include <typeinfo>  // typeid\n\nint add1(int, int); \
    \                // declaration\nint add2(int a, int b) { return a + b; } // definition\n\
    \nint main() {\n\n    std::cout << '\\n';\n\n    std::cout << \"typeid(add1).name():\
    \ \" << typeid(add1).name() << '\\n';\n\n    decltype(*add1) add = add2;\n\n \
    \   std::cout << \"add(2000, 20): \" << add(2000, 20) << '\\n';\n\n    std::cout\
    \ << '\\n';\n}\n```\n```\n\n`typeid(add1).name()` (line 13) returns a string representation\
    \ of the type and `decltype` (line 15) deduces the type of its argument.\n\n+\
    \   [^70]: https://en.cppreference.com/w/cpp/language/typeid\n+   [^71]: https://en.cppreference.com/w/cpp/language/decltype"
