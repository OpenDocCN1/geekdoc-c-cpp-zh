- pgno: 99
  md: "# ### 4.1.10.1.1 The Concept Ordering\n\nThanks to the `requires` expression,\
    \ the definition of the concept `Ordering` looks quite similar to the definition\
    \ of the type class `Ord` in Haskell.\n\n**The concept Ordering**\n\n```\n```cpp\n\
    template <typename T>\nconcept Ordering =\n    Equal<T> &&\n    requires(T a,\
    \ T b) {\n        { a < b } -> std::convertible_to<bool>;\n        { a <= b }\
    \ -> std::convertible_to<bool>;\n        { a > b } -> std::convertible_to<bool>;\n\
    \        { a >= b } -> std::convertible_to<bool>;\n    };\n```\n```\n\nThe `Ordering`\
    \ concept uses **nested requirements** under the hood. A type `T` supports the\
    \ concept `Ordering` if it supports the concept `Equal` and, additionally, the\
    \ four comparison operators. Let's try it out.\n\n**Definition and usage of the\
    \ concept Ordering**\n\n```\n```cpp\n// conceptsDefinitionOrdering.cpp\n\n#include\
    \ <concepts>\n#include <iostream>\n#include <unordered_set>\n\ntemplate <typename\
    \ T>\nconcept Equal =\n    requires(T a, T b) {\n        { a == b } -> std::convertible_to<bool>;\n\
    \        { a != b } -> std::convertible_to<bool>;\n    };\n\n\ntemplate <typename\
    \ T>\nconcept Ordering =\n    Equal<T> &&\n    requires(T a, T b) {\n        {\
    \ a < b } -> std::convertible_to<bool>;\n        { a <= b } -> std::convertible_to<bool>;\n\
    \        { a > b } -> std::convertible_to<bool>;\n        { a >= b } -> std::convertible_to<bool>;\n\
    \    };\n```\n```"
