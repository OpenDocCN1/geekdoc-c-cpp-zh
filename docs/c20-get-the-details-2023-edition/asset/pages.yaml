  md: "# Interface of `std::span` `sp`\n\n| Operation | Description |\n|---|---|\n\
    | `sp.subspan(first)` | Returns a subspan with the same extent of the elements\
    \ starting at `first`. |\n| `sp.subspan(first)` | Returns a subspan with dynamic\
    \ extent of the elements starting at `first`. |\n| `sp.subspan(first, count)`\
    \ | Returns a subspan with static extent of the elements starting at `first`.\
    \ |\n| `sp.subspan(first, count)` | Returns a subspan with static extent of count\
    \ elements starting at `first`. |\n| `as_bytes` | Returns the sequence as a span\
    \ of read-only `std::byte`s. |\n| `as_writable_bytes` | Returns the sequence as\
    \ a span of writable `std::byte`s. |\n\nThe program `subspan.cpp` shows the member\
    \ function subspan usage.\n\n# Use of the member function subspan\n\n```\n```cpp\n\
    // subspan.cpp\n\n#include <iostream>\n#include <numeric>\n#include <span>\n#include\
    \ <vector>\n\nint main() {\n\n    std::cout << '\\n';\n\n    std::vector<int>\
    \ myVec(20);\n    std::iota(myVec.begin(), myVec.end(), 0);\n    for (auto v:\
    \ myVec) std::cout << v << \" \";\n\n    std::cout << \"\\n\\n\";\n\n    std::span<int>\
    \ mySpan(myVec);\n    auto length = mySpan.size();\n\n    std::size_t count =\
    \ 5;\n    for (std::size_t first = 0; first <= (length - count); first += count)\
    \ {\n        for (auto ele: mySpan.subspan(first, count)) std::cout << ele <<\
    \ \" \";\n        std::cout << '\\n';\n    }\n}\n```\n```\n\nLine 13 fills the\
    \ vector with all numbers from 0 to 19 (line 13) using the algorithm `std::iota`²⁵.\n\
    \n²⁵https://en.cppreference.com/w/cpp/algorithm/iota"
