  md: '# 6.1.3.1 Promise Object


    The promise object is manipulated inside the coroutine, and it delivers its result
    or exception via the promise object.


    The promise object supports the following interface. Some of the functions must
    be implemented, some of them are optional.


    **Promise object**


    | Member Function | Description |

    |---|---|

    | `Constructor` | A promise needs a constructor. |

    | `initial_suspend()` | Determines if the coroutine suspends before it runs. |

    | `final_suspend noexcept()` | Determines if the coroutine suspends before it
    ends. |

    | `unhandled_exception()` | Called when an unhandled exception happens. |

    | `get_return_object()` | Initializes the coroutine handle that is returned to
    the caller. |

    | `get_return_object_on_allocation_failure()` | Defines if memory allocation fails.
    |

    | `return_value(val)` | Is invoked by `co_return val`. |

    | `return_void()` | Is invoked by `co_return` or the end of the coroutine. |

    | `yield_value(val)` | Is invoked by `co_yield val`. |

    | `await_transform(val)` | Returns an Awaitable. |

    | `operator new(size)` | Defines how the coroutine allocates memory. |

    | `operator delete(ptr, size)` | Defines how the coroutine frees memory. |


    The compiler automatically invokes these functions during its execution of the
    coroutine. The section workflow presents this workflow in detail.


    The function get_return_object initializes the coroutine handle that the client
    uses to interact with the coroutine.'
