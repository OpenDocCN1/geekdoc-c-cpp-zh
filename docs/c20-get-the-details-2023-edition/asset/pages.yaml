  md: "# 8.2.3 Pattern Matching\n\nNew data types such as `std::tuple`<sup>28</sup>\
    \ or `std::variant`<sup>29</sup> need new ways to work with their elements. Simple\
    \ if or switch conditions or functions like `std::apply`<sup>30</sup> or `std::visit`<sup>31</sup>\
    \ can only provide basic functionality. Pattern matching, heavily used in functional\
    \ programming, allows the more efficient handling of the new data types.\n\nThe\
    \ following code snippets from the proposal P1371R2<sup>32</sup> on pattern matching\
    \ compare classical control structures with pattern matching. Pattern matching\
    \ uses the keyword `inspect` and `__` for a placeholder.\n\n+   - switch statement\n\
    \n# switch statement versus pattern matching\n\n```\n```cpp\nswitch (x) {\n  \
    \  case 0: std::cout << \"got zero\"; break;\n    case 1: std::cout << \"got one\"\
    ; break;\n    default: std::cout << \"don't care\";\n}\n\ninspect (x) {\n    0:\
    \ std::cout << \"got zero\";\n    1: std::cout << \"got one\";\n    __: std::cout\
    \ << \"don't care\";\n}\n```\n```\n\n+   - if condition\n\n# if statement versus\
    \ pattern matching\n\n```\n```cpp\nif (s == \"foo\") {\n    std::cout << \"got\
    \ foo\";\n} else if (s == \"bar\") {\n    std::cout << \"got bar\";\n} else {\n\
    \    std::cout << \"don't care\";\n}\n\ninspect (s) {\n    \"foo\": std::cout\
    \ << \"got foo\";\n    \"bar\": std::cout << \"got bar\";\n    __: std::cout <<\
    \ \"don't care\";\n}\n```\n```"
  merge: -1
  img_proc: true
