  md: 'affects all associated `std::stop_token`. The three classes, `std::stop_source`,
    `std::stop_token`, and the `std::stop_callback` share the ownership of an associated
    stop state. The stop state is allocated on the heap and automatically released
    when it is not needed anymore. This cooperative interruption facility is, by design,
    thread-safe.


    In the following subsections, I provide more details about the cooperative interruption.


    # 6.5.1 `std::stop_source`


    You can construct a `std::stop_source` in two ways:


    Constructors of `std::stop_source`


    ```

    std::stop_source();

    explicit std::stop_source(std::nostopstate_t) noexcept;

    ```


    The default constructor (line 1) creates a `std::stop_source` with an associated
    stop state. The constructor taking `std::nostopstate_t` (line 2) constructs an
    empty `std::stop_source` without an associated stop state.


    The component `std::stop_source src` provides the following member functions for
    handling stop requests.


    **Member functions of `std::stop_source src`**


    | Member function | Description |

    |---|---|

    | `std::stop_source src` | Creates a stop source with an associated stop state.
    |

    | `std::stop_source(std::nostopstate_t)` | Creates a stop source without an associated
    stop state. |

    | `std::stop_source src{nostopstate}` | Creates a stop source without associated
    stop state. |

    | `src.get_token()` | If `src.stop_possible()`, returns a stop token for the associated
    stop state. Otherwise, returns a default-constructed (empty) stop_token without
    associated stop state. |

    | `src.stop_possible()` | true if src can be requested to stop. |

    | `src.stop_requested()` | true if `src.stop_possible()` and `request_stop()`
    was called by one of the owners. |

    | `src.request_stop()` | Calls a stop request if `src.stop_possible()` and `!src.stop_requested()`.
    Otherwise, the call has no effect. |


    The call `src.get_token()` returns the stop token `stoken`. Thanks to stoken you
    can check if a stop request has been made or can be made by its associated stop
