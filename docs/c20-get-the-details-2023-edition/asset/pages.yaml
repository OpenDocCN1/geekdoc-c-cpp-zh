- pgno: 155
  md: '# ## Distilled Information


    +   - Modules overcome the deficiencies of headers and macros. Their import is
    literally for free, and in contrast to macros, the sequence you import does not
    matter. Additionally, they overcome name collisions.

    +   - A module consists of one module interface unit and arbitrarily many module
    implementation units. The module interface must have the exporting module declaration
    and the module implementation units must have the non-exporting module declaration.
    Names that are not exported in the module interface have module linkage and cannot
    be used outside the module.

    +   - Modules can have headers or import and re-export other modules.

    +   - The standard library in C++20 is not modularized. With C++20, Building your
    modules is a challenging task.

    +   - To structure large software systems, modules provide two ways: submodules
    and partitions. In contrast to a partition, a submodule can live on its own.

    +   - Thanks to header units, you can replace an include statement with an import
    statement, and the compiler autogenerates a module.

    +   - Header units do support macros, but modules not.

    +   - A sound migration strategy from headers to modules or module partitions
    is to start your migration with header units. Only headers that are not importable
    must be implemented as modules. Additionally, new functionality should be implemented
    as a named module.'
  merge: -1
