  md: "# A simple math module\n\n```\n```cpp\n// math.cpp\n\nexport module math;\n\
    \nexport int add(int fir, int sec){\n    return fir + sec;\n}\n```\n```\n\nThe\
    \ client file client.cpp is unchanged. These are the necessary steps to create\
    \ the executable.\n\n# Building the executable with the Clang compiler\n\n```\n\
    ```bash\nclang++ -std=c++20 -c math.cpp -fprecompile -o math.pcm\n\nclang++ -std=c++20\
    \ client.cpp -fprebuilt-module-path=. math.pcm -o client.exe\n```\n```\n\n+  \
    \ - Line 1 creates the module math.pcm. The suffix pcm stands for precompiled\
    \ module and is equivalent to the ifc file of the Microsoft Visual Compiler. Additionally,\
    \ the produced module already includes the module definition. Consequently, the\
    \ Clang compiler does not produce an object file math.o. The option “-precompile\
    \ is necessary for creating the precompiled module.\n+   - Line 3 creates the\
    \ executable client.exe, which uses the module math.pcm. The Clang compiler requires\
    \ that you specify the path to the module with the -fprebuilt-module-path flag.\
    \ If not, the link process fails.\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_125_0.png)\n\
    \n**Missing path to the module**\n\nThe Clang compiler provides various options\
    \ for the creation of modules.\n\n# 4.2.3.2.4 Module Options\n\nClang support\
    \ three kinds of options for creating and using the module.\n\n# 4.2.3.2.5 Creating\
    \ the Module\n\nA module can be created in two ways. From a named module or a\
    \ header unit. The Clang compiler requires that you always specify the path to\
    \ the module. The following table shows the options for handling modules."
