  md: '# ### 6.1.2.3 Design Goals


    Gor Nishanov describes in proposal N4402^4 the design goals of coroutines.


    Coroutines should


    +   - be highly scalable (to billions of concurrent coroutines)

    +   - have highly efficient resume and suspend operations comparable in cost to
    the overhead of a function

    +   - seamlessly interact with existing facilities with no overhead

    +   - have open-ended coroutine machinery allowing library designers to develop
    coroutine libraries exposing various high-level semantics such as generators,
    coroutines^5, tasks and more

    +   - usable in environments where exceptions are forbidden or not available


    Due to the design goals of scalability and seamless interaction with existing
    facilities, the coroutines are stackless. In contrast, a stackful coroutine reserves
    a default stack of 1MB on Windows and 2MB on Linux.


    There are four ways for a function to become a coroutine.


    # ### 6.1.2.4 Becoming a Coroutine


    A function becomes a coroutine if it uses


    +   - `co_return`, or

    +   - `co_await`, or

    +   - `co_yield`, or a

    +   - `co_await` expression in a range-based for loop.


    ^4 https://isocpp.org/files/papers/N4402.pdf

    ^5 https://tour.golang.org/concurrency/1'
