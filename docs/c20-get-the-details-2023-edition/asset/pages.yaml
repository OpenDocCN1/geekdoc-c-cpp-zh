  md: "# Function composition with the pipe symbol\n\n```\n```cpp\nint main() {\n\
    \    std::vector<int> ints{0, 1, 2, 3, 4, 5};\n    auto even = [](int i){ return\
    \ i % 2 == 0; };\n    auto square = [](int i) { return i * i; };\n\n    for (int\
    \ i : ints | std::views::filter(even) |\n                    std::views::transform(square))\
    \ {\n        std::cout << i << ' ';          // 0 4 16\n    }\n}\n```\n```\n\n\
    Lambda expression even (line 3) is a lambda expression that returns `true` if\
    \ an argument `i` is even. Lambda expression square (line 4) maps the argument\
    \ `i` to its square. Lines 6 and 7 demonstrate function composition, which you\
    \ have to read from left to right: for `(int i : ints | std::views::filter(even)\
    \ | std::views::transform(square))`. Apply on each element of `ints` the even\
    \ filter and map each remaining element to its square. If you are familiar with\
    \ functional programming, this reads like prose.\n\n# 3.1.4 Coroutines\n\nCoroutines\
    \ are generalized functions that can be suspended and resumed later while maintaining\
    \ their state. Coroutines are a convenient way to write event-driven applications.\
    \ Event-driven applications can be simulations, games, servers, user interfaces,\
    \ or even algorithms. Coroutines are also typically used for cooperative multitasking.\n\
    \nC++20 does not provide concrete coroutines, but C++20 provides a framework for\
    \ implementing coroutines. This framework consists of more than 20 functions,\
    \ and some of which you must implement, some of which you can override. Therefore,\
    \ you can tailor coroutines to your needs.\n\nThe following code snippet uses\
    \ a generator to create a potentially infinite data stream. The coroutines chapter\
    \ provides the implementation of the Generator.\n\n# A generator for an infinite\
    \ data stream\n\n```\n```cpp\nGenerator<int> getNext(int start = 0, int step =\
    \ 1){\n    auto value = start;\n    while (true) {\n        co_yield value;\n\
    \        value += step;\n    }\n}\n\nint main() {\n\n}\n```\n```"
