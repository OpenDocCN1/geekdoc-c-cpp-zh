  md: "# 6.1.4.2.3 `await_resume`\n\nTypically, after the call `await_suspend`, `await_resume`\
    \ is called. `await_resume` return value is the result of the `co_await` awaitable\
    \ expression. The return value can also be void.\n\n# 6.1.4.2.4 Symmetric Transfer\n\
    \nThe symmetric transfer is if the call `std::await_suspend` returns a coroutine\
    \ handle. This means that the coroutine is suspended, but the returned coroutine\
    \ immediately resumed. Thanks to this technique, the immediately resumed coroutine\
    \ uses the stack from the given coroutine.\n\nThe following code snippet shows\
    \ the critical ideas of coroutine and an Awaiter implementing the continuation\
    \ of coroutines.\n\nContinuation with symmetric transfer\n\n```\n```cpp\nstruct\
    \ Task {\n    struct promise_type;\n    using handleType = std::coroutine_handle<promise_type>;\n\
    \    handle_type origHandle;\n\n    struct promise_type {\n        std::coroutine_handle<>\
    \ continuationHandle = contHandle;\n        ...\n        auto final_suspend()\
    \ noexcept {\n            return ContinuationAwaiter{};\n        }\n    };\n};\n\
    ...\nstruct ContinuationAwaiter {\n    bool await_ready() noexcept {\n       \
    \ return false;\n    }\n\n    std::coroutine_handle<> await_suspend(Task::handleType\
    \ handle) noexcept {\n        if (handle.promise().continuationHandle) {\n   \
    \         return handle.promise().continuationHandle;\n        }\n        else\
    \ {\n            return std::noop_coroutine();\n        }\n    }\n\n    void await_resume()\
    \ noexcept { }\n};\n```\n```"
