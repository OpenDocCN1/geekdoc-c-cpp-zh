    # ## 5.3.7 Vectorized Execution Policy: `std::execution::unseq`\n\nUsing an execution\
    \ policy in C++17, you can specify whether the algorithm should run sequentially,\
    \ in parallel, or parallel with vectorization.\n\nThe policy tag specifies whether\
    \ an algorithm should run sequentially, in parallel, or in parallel with vectorization.\n\
    \n+   - `std::execution::seq`: runs the algorithm sequentially\n+   - `std::execution::par`:\
    \ runs the algorithm in parallel on multiple threads\n+   - `std::execution::par_unseq`:\
    \ runs the algorithm in parallel on multiple threads and allows the interleaving\
    \ of individual loops; permits a vectorized version with SIMD<sup>22</sup> (Single\
    \ Instruction Multiple Data) extensions.\n\nC++20 supports a new execution policy:\
    \ `std::execution::unseq`;\n\n+   - `std::execution::unseq`: runs the algorithm\
    \ on **one thread**; permits a vectorized version with SIMD<sup>23</sup> (Single\
    \ Instruction Multiple Data) extensions.\n\nThe following code snippet shows the\
    \ application of the execution policies."
