  md: "# Designated initialization\n\n```\n```cpp\nstruct Point2D{\n    int x;\n \
    \   int y;\n};\n\nclass Point3D{\npublic:\n    int x;\n    int y;\n    int z;\n\
    };\n\nint main(){\n\n    Point2D point2D {.x = 1, .y = 2};\n    // Point2D point2D\
    \ {.y = 2, .x = 1};          // error\n    Point3D point3D {.x = 1, .y = 2, .z\
    \ = 2};\n    // Point3D point3D {.x = 1, .z = 2}           // {1, 0, 2}\n\n  \
    \  std::cout << \"point2D: \" << point2D.x << \" \" << point2D.y << \"\\n\";\n\
    \    std::cout << \"point3D: \" << point3D.x << \" \" << point3D.y << \" \" <<\
    \ point3D.z\n              << \"\\n\";\n\n}\n```\n```\n\nThe arguments for the\
    \ instances of Point2 and Point3D are explicitly named. The output of the program\
    \ is identical to the output of the previous one. The commented-out lines 16 and\
    \ 18 are quite interesting. Line 16 would give an error because the order of the\
    \ designators does not match the declaration order of the data members. As for\
    \ line 18, the designator for y is missing. In this case, y is initialized to\
    \ 0, such as when using braced initialization list {1, 0, 2}.\n\n# 3.2.3 constexpr\
    \ and constinit\n\nThe new `constexpr` specifier added in C++20 creates an immediate\
    \ function. For an immediate function, each invocation of the function must produce\
    \ a compile-time constant expression. An immediate function is implicitly a constexpr\
    \ function but not necessarily the other way around."
