  md: "# 6.1.4 Awaitables and Awaiters\n\nThe three functions of a promise object\
    \ `promise.yield_value`, `initial_suspend`, and `final_suspend` return Awaitables.\n\
    \n# 6.1.4.1 Awaitables\n\nAn Awaitable is something you can await on. It is the\
    \ argument of `co_await`: `co_await` Awaitable. The Awaitable determines if the\
    \ coroutine pauses or not.\n\nEssentially, the compiler generates the following\
    \ function calls using the promise prom and the `co_await` operator.\n\n| Call\
    \ | Compiler generated call |\n|---|---|\n| Start coroutine execution | `co_await\
    \ prom.initial_suspend()` |\n| `co_yield` value | `co_await prom.yield_value(value)`\
    \ |\n| `co_return` value | `co_await prom.return_value(value)` |\n| End coroutine\
    \ execution | `co_await prom.final_suspend()` |\n\nThanks to the member function\
    \ `await_transform`, the promise becomes the Awaitable.\n\n# 6.1.4.1.1 `await_transform`\n\
    \nThe following Awaitable suspends never. This example also shows how the Awaitable\
    \ can get an argument.\n\n# A special Awaitable\n\n```\n```cpp\n// suspendsNeverWithSleep.cpp\n\
