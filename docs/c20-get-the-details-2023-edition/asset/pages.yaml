  md: '![](img/c60a87adb7f61e2e82071d081bbb389a_102_0.png)


    # Regular **Types**


    [Alexander Stepanov](https://en.wikipedia.org/wiki/Alexander_Stepanov), the designer
    of the Standard Template Library, defined the terms regular type and semiregular
    type. A type, according to him, is regular if it supports these functions:


    +   - Copy construction

    +   - Assignment

    +   - Equality

    +   - Destruction

    +   - Total ordering


    Copy construction implies default construction and Equality implies Inequality.
    When Stepanov defined the requirements above, move semantics was not present in
    C++. The book [Elements of Programming](http://elementsofprogramming.com/), which
    Alexander Stepanov wrote together with [Paul McJones](https://www.mcjones.org/paul/),
    is devoted to regular types.


    # 4.1.10.2.1 The Concept `SemiRegular`


    A semiregular type X must support the Big Six and be swappable. The Big Six consists
    of the following functions:


    +   - Default constructor: `X()`

    +   - Copy constructor: `X(const X&)`

    +   - Copy assignment: `X& operator = (const X&)`

    +   - Move constructor: `X(X&&)`

    +   - Move assignment: `X& operator = (X&&)`

    +   - Destructor: `~X()`


    Additionally, X has to be swappable: `swap(X&, X&)`


    Thanks to the [type-traits library](https://en.cppreference.com/w/cpp/header/type_traits),
    defining the corresponding concept is a no-brainer. First, I define the type trait
    isSemiRegular and then use it to define the concept SemiRegular.


    +   28. https://en.wikipedia.org/wiki/Alexander_Stepanov

    +   29. http://elementsofprogramming.com/

    +   30. https://www.mcjones.org/paul/

    +   31. https://en.cppreference.com/w/cpp/header/type_traits'
