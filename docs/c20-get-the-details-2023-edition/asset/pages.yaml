    ![](img/c60a87adb7f61e2e82071d081bbb389a_478_0.png)


    Cippi studies the atomics


    Atomics receives a few important extensions in C++20. Probably the most important
    ones are atomic references and atomic smart pointers.


    # ### 6.2.1 `std::atomic_ref`


    The class template `std::atomic_ref` applies atomic operations to the referenced
    object.


    Concurrent writing and reading of an atomic object ensure that there is no data
    race. The lifetime of the referenced object must exceed the lifetime of the `atomic_ref`.
    If any `atomic_ref` accesses an object, all other accesses to the object must
    use an `atomic_ref`. In addition, no subobject of the `atomic_ref`-accessed object
    may be accessed by another `atomic_ref`.


    # #### 6.2.1.1 Motivation


    Stop. You may think that using a reference inside an atomic would do the job.
    Unfortunately not.


    In the following program, I have a class `ExpensiveToCopy`, which includes a `counter`.
    A few threads concurrently increment the `counter`. Consequently, `counter` has
    to be protected.'
