  md: "# # Distinguish Between the Coroutine and the Coroutine Handle\n\nThe term\
    \ coroutine is often used for two different things: the function invoking `co_return`,\
    \ `co_await`, or `co_yield`, and the coroutine handle. Using one term for two\
    \ different entities may puzzle you (such as it did me). Let me clarify both terms.\n\
    \n**A simple coroutine producing 2021**\n\n```\n~~~cpp\nMyFuture<int> createFuture()\
    \ {\n    co_return 2021;\n}\n\nint main() {\n\n    auto fut = createFuture();\n\
    \    std::cout << \"fut.get(): \" << fut.get() << '\\n';\n\n}\n~~~\n```\n\nThis\
    \ straightforward example has a function `createFuture` and returns an object\
    \ of type `MyFuture<int>`. Both are called coroutines. To be specific, the function\
    \ `createFuture` is the coroutine that returns a coroutine handle `MyFuture<int>`.\
    \ The coroutine handle is a handle to an object that implements the framework\
    \ to model a specific behavior. I present in the section `co_return` the implementation\
    \ and the use of this straightforward coroutine.\n\n# ##### 6.1.2.4.1 Restrictions\n\
    \nCoroutines cannot have `return` statements or placeholder return types. This\
    \ applies for unconstrained placeholders (`auto`) and constrained placeholders\
    \ (concepts).\n\nAdditionally, functions having variadic arguments^8, `constexpr`\
    \ functions, `consteval` functions, constructors, destructors, and the `main`\
    \ function cannot be coroutines.\n\n# ### 6.1.3 The Framework\n\nThe framework\
    \ for implementing coroutines consists of more than 20 functions, some of which\
    \ you must implement and some of which you may overwrite. Therefore, you can tailor\
    \ the coroutine to your needs.\n\nA coroutine is associated with three parts:\
    \ the promise object, the coroutine handle, and the coroutine frame. The client\
    \ gets the coroutine handle to interact with the promise object, which keeps its\
    \ state in the coroutine frame."
