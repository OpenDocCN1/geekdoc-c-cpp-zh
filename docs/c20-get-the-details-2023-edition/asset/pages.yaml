  md: 'There are two ways to create a calendar date. You can use the so-called cute
    syntax `yearMonthDay(year(1940)/month(6...` (line 40), or you can use the explicit
    type `date :: year_month_day(year(1940), June, 26d)` (line 42). To avoid overwhelming
    you, I will delay my explanation of the cute syntax to the next section. The explicit
    type is interesting because it uses the date-time literals `1940y`, `26d`, and
    the predefined constant `June`. This was the obvious part of the program.


    Line 46, line 50, and line 54 offer additional ways to create calendar dates.


    +   - Line 46: the last day of March 2010: `year(2010)/March/last` or `year_month_day_last(2010y,
    month_day_last(month(3)))`

    +   - Line 50: the second Thursday of March 2020: `year(2020)/March/Thursday[2]`
    or `year_month_weekday(2020y, month(March), Thursday[2])`

    +   - Line 54: the last Monday of March 2010: `year(2010)/March/Monday[last]`
    or `year_month_weekday_last(2010y, month(March), weekday_last(Monday))`


    The remaining calendar types stand for a day (line 60), a month (line 64), or
    a year (line 68). You can combine them as basic building blocks for fully specified
    calendar dates, such as in lines 46, 50, or 54.


