    # Format String must be a C++ String


    The format string in `std::chrono::parse` must be a C++ string and cannot be a
    C string.

    This issue is already regarded as an oversight and will be fixed.


    ```

    ```cpp

    std::chrono::parse("%F %T", timePoint);


    std::chrono::parse(std::string("%F %T"), timePoint);


    using namespace std::literals;

    std::chrono::parse("%F %T"s, timePoint);

    ```

    ```


    A straightforward fix for this issue (line 1) is to use a `std::string` (line
    3), or a string literal (line 6).


    ![](img/c60a87adb7f61e2e82071d081bbb389a_426_1.png)


    # Distilled Information


    +   - C++20 adds new components to the chrono library: time of day, calendar,
    and time zone.

    +   - Time of day is the time duration since midnight, split into hours, minutes,
    seconds, and fractional seconds.

    +   - Calendar stands for various calendar dates such as year, a month, a weekday,
    or the n-th day of a week.

    +   - A time zone represents time specific to a geographic area.

    +   - Thanks to the new formatting library, you can read and write chrono objects
    formatted to and from input streams.'
