    # ## 10.18 Lock-free


    A non-blocking algorithm is lock-free if there is guaranteed system-wide progress.


    # ## 10.19 Lost Wakeup


    A lost wakeup is a situation in which a thread misses its wake-up notification
    due to a [race condition](#race-condition).


    # ## 10.20 Math Laws


    A binary operation (*) on some set X is


    +   - **associative**, if it satisfies the associative law for all x, y, z in
    X: (x * y) * z = x * (y * z)

    +   - **commutative**, if it satisfies the commutative law for all x, y in X:
    x * y = y * x

    +   - **distributive**, if it satisfies the distributive law for all x, y, z in
    X: x(y + z) = xy + xz


    # ## 10.21 Memory Location


    A memory location is according to [cppreference.com](https://en.cppreference.com/w/cpp/language/memory_model)⁷


    +   - an object of scalar type (arithmetic type, pointer type, enumeration type,
    or `std::nullptr_t`),

    +   - or the largest contiguous sequence of bit fields of non-zero length.


    ⁷ [http://en.cppreference.com/w/cpp/language/memory_model](http://en.cppreference.com/w/cpp/language/memory_model)'
