  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_144_0.png)\n\nUsing the module bar\n\
    \n# 4.2.3.13 Module Linkage\n\nUntil C++20, C++ supported two kinds of linkage:\
    \ internal linkage and external linkage.\n\n+   - **Internal linkage:** Names\
    \ with internal linkage are not accessible outside the [translation unit](#).\
    \ Internal linkage includes mainly namespace-scope names declared `static` and\
    \ members of anonymous namespaces.\n+   - **External linkage:** Names with external\
    \ linkage are accessible outside the translation unit. External linkage includes\
    \ names declared not as `static`, class types, and their members, variables, and\
    \ templates.\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_144_1.png)\n\n# Language\
    \ Linkage\n\nExternal linkage implies language linkage. Language linkage provides\
    \ linkage between different programming languages. C++ is the default language\
    \ linkage, but you can specify other language linkages, such as c linkage.\n\n\
    ```\nLanguage linkage\nextern \"C\" {\n    int openFile(const char* path);   \
    \    // C function declaration\n}\nint main() {\n    int fileHandle = openFile(\"\
    grimm.txt\");  // invokes a C function from C++\n}\n```\n\nThe c function declaration\
    \ openFile has C language linkage and can be called from a C++ program. It supports\
    \ C calling conventions and name mangling.\n\nModules introduce module linkage:\n\
    \n+   - **Module linkage:** Names with module linkage are only accessible inside\
    \ the module. Names have module linkage if they don’t have external linkage and\
    \ they are not exported.\n\nA slight variation of the previous module declaration\
    \ `mathModuleTemplate.ixx` makes my point. Imagine that I want to return the user\
    \ of my function template sum not only the result of the addition but also the\
    \ return type the compiler deduces."
