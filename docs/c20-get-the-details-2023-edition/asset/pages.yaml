  md: '# # 7.1 A Flavor of Python


    ![](img/c60a87adb7f61e2e82071d081bbb389a_549_0.png)


    The programming language Python¹ has the convenient functions `filter` and `map`.


    +   - **filter**: applies a predicate to all elements of an iterable and returns
    those elements for which the predicate returns `true`

    +   - **map**: applies a function to all elements of an iterable and returns a
    new iterable with the transformed elements


    An iterable in C++ would be a type that you could use in a range-based for loop.


    Furthermore, Python lets you combine both functions in a list comprehension.


    +   - **list comprehension**: applies a filter and map phase to an iterable and
    returns a new iterable


    My challenge is: I want to implement Python2-like functions `filter`, `map`, and
    list comprehension in C++20 using the ranges library.


    # ## 7.1.1 `filter`


    Python''s `filter` function has a corresponding ranges function.'
