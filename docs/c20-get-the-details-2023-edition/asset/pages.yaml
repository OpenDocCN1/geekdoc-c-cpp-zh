- pgno: 461
  md: "# 6.1.4.4 Get the Awaitable and the Awaiter\n\nThere are essentially two ways\
    \ to get an Awaiter.\n\n+   - A `co_await` operator is defined.\n+   - The Awaitable\
    \ becomes the Awaiter.\n\nRemember, when `co_await` expression is invoked, the\
    \ expression is converted to an Awaitable:\n\n+   1. If expression is created\
    \ by an initial suspension point (`from initial_suspend()`), final suspension\
    \ point (`from final_suspend()`), or yield expression (`from yield_value(value)`),\
    \ the Awaitable is the expression.\n+   2. If the current coroutine's promise\
    \ type has a member function `await_transform`, the Awaitable is from `await_transform(expression)`.\n\
    +   3. the Awaitable is the expression.\n\nNow, the compiler performs the following\
    \ lookup rule to get an Awaiter:\n\n+   1. It looks for the `co_await` operator\
    \ on the promise object and returns an Awaiter:\n+   \n+       awaiter = awaitable.operator\
    \ co_await();\n+   \n+   2. It looks for a freestanding `co_await` operator and\
    \ returns an Awaiter:\n+   \n+       awaiter = operator co_await(awaitable);\n\
    +   \n+   3. If there is no `co_await` operator defined, the Awaitable becomes\
    \ the Awaiter:\n+   \n+       awaiter = awaitable;\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_461_0.png)\n\
    \n```\n`awaiter = awaitable`\n```\n\n> > When you study my coroutine implementations\
    \ in this chapter, you may notice that I use most of the time that an Awaitable\
    \ implicitly becomes an Awaiter. Only the example to thread synchronization uses\
    \ the `co_await` operator to get the Awaiter.\n\nAfter these static aspects of\
    \ coroutines, I want to continue with their dynamic aspects.\n\n# 6.1.5 The Workflows\n\
    \nThe compiler transforms your coroutine and runs two workflows: the outer promise\
    \ workflow and the inner Awaiter workflow.\n\n# 6.1.5.1 The Promise Workflow\n\
    \nWhen you use `co_yield`, `co_await`, or `co_return` in a function, the function\
    \ becomes a coroutine, and the compiler transforms its body to something equivalent\
    \ to the following lines."
