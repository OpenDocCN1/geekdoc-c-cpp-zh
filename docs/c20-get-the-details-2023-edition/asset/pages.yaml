    \ a -> Bool\n  (/=) :: a -> a -> Bool\n\nclass Eq a => Ord a where\n  compare\
    \ :: a -> a -> Ordering\n  (<) :: a -> a -> Bool\n  (<=) :: a -> a -> Bool\n \
    \ (>) :: a -> a -> Bool\n  (>=) :: a -> a -> Bool\n  max :: a -> a -> a\n```\n\
    ```\n\nEach type a supporting the type class Eq (line 1), has to support equality\
    \ (line 2) and inequality (line 3). Now to the interesting part of this definition.\
    \ Each type a supporting the type class Ord has to support the type class Eq (class\
    \ Eq a => Ord a in line 5). Additionally, type a has to support the four comparison\
    \ operators and the functions compare and max (lines 6 - 11).\n\nHere is my challenge.\
    \ Can we express Haskell's relationship between the type classes Eq and Ord with\
