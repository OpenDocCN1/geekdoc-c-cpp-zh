  md: "# 5.6.4.8 Calculating Ordinal Dates\n\nAs a last example of the new calendar\
    \ facility, I want to present the online resource Examples and Recipes⁵⁵ from\
    \ Howard Hinnant, which has about 40 examples of the new chrono functionality.\
    \ Presumably, the chrono extension in C++20 is not easy to get there; it’s essential\
    \ to have so many examples. You should use these examples as a starting point\
    \ for further experiments and, therefore, sharpen your understanding. You can\
    \ also add your recipes.\n\nTo get an idea of Examples and Recipes, I want to\
    \ present a slightly modified program by Roland Bock⁵⁶ that calculates ordinal\
    \ dates.\n\n> > *“An ordinal date consists of a year and a day of year (1st of\
    \ January being day 1, 31st of December being day 365 or day 366). The year can\
    \ be obtained directly from year_month_day. And calculating the day is wonderfully\
    \ easy. In the code below, we make use of the fact that year_month_day can deal\
    \ with invalid dates like the 0th of January.” (Roland Bock)*\n\nI added the necessary\
    \ headers to Roland’s program.\n\n**Calculating ordinal dates**\n\n```\n```cpp\n\
    // ordinalDate.cpp\n\n#include <cassert>\n#include <chrono>\n#include <iomanip>\n\
    #include <iostream>\n\nint main() {\n\n    std::cout << '\\n';\n\n    using std::chrono::system_clock;\n\
    \n    using std::chrono::floor;\n\n    using std::chrono::days;\n\n    using std::chrono::January;\n\
    \n    using std::chrono::year_month_day;\n    using std::chrono::sys_days;\n\n\
    \    const auto time = system_clock::now();\n    const auto daypoint = floor<days>(time);\n\
    \    const auto ymd = year_month_day(daypoint);\n```\n```\n\n35 https://github.com/HowardHinnant/date/wiki/Examples-and-Recipes\n\
    \n36 https://github.com/rhack"
