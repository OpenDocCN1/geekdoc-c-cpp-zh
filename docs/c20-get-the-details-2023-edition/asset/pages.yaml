    **Return value of `awaiter.await_suspend()`**


    | Type | Description |

    |---|---|

    | `void` | The coroutine keeps suspended and returns to the caller. |

    | `bool` | `bool == true`: The coroutine keeps suspended and returns to the caller.<br>`bool
    == false`: The coroutine is resumed and does not return to the caller. |

    | `anotherCoroutineHandle` | The other coroutine is resumed and returns to the
    caller. |


    What''s happens in case an exception is thrown? It makes a difference if the exception
    occurs in `await_ready`, `await_suspend`, or `await_resume`.


    +   - `await_ready`: The coroutine is not suspended, and the calls `await_suspend`
    or `await_resume` are not evaluated.

    +   - `await_suspend`: The exception is caught, the coroutine is resumed, and
    the exception rethrown. `await_resume` is not called.

    +   - `await_resume`: `await_ready` and `await_suspend` are evaluated, and all
    values are returned. Of course, the call `await_resume` does not return a result.


