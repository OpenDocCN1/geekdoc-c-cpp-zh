    ```


    In contrast to a std::mutex, a std::counting_semaphore is not bound to a thread.
    This means that the acquisition and release of a semaphore call can happen on
    different threads. The following table presents the interface of a std::counting_semaphore.


    **Member functions of a std::counting_semaphore sem**


    | Member function | Description |

    |---|---|

    | `std::counting_semaphore sem(num)` | Creates a semaphore with the counter num.
    cnt must be a signed integral. |

    | `sem.max() (static)` | Returns the maximum value of the counter. |

    | `sem.release(upd = 1)` | Increases counter by upd and subsequently unblocks
    threads acquiring the semaphore sem. |

    | `sem.acquire()` | Decrements the counter by 1 or blocks until the counter is
    greater than 0. |


    ^33 https://commons.wikimedia.org/w/index.php?curid=1972304


    ^34 https://en.cppreference.com/w/cpp/named_req/BasicLockable'
