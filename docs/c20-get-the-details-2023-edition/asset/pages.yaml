  md: '# Views in C++23


    | View | Description |

    |---|---|

    | `std::ranges::zip_view`<br>`std::views::zip` | Creates a view of tuples. |

    | `std::ranges::zip_transform_view`<br>`std::views::zip_transform` | Creates a
    view of tuples by applying the transformation function. |

    | `std::ranges::adjacent_view`<br>`std::views::adjacent` | Creates a view of adjacent
    elements. |

    | `std::ranges::adjacent_transform_view`<br>`std::views::adjacent_transform` |
    Creates a view of adjacent elements by applying the transformation function. |

    | `std::ranges::join_with_view`<br>`std::views::join_with` | Joins existing ranges
    into a view by applying a delimiter. |

    | `std::ranges::slide_view`<br>`std::views::slide` | Creates N-tuples by taking
    a view and a number N. |

    | `std::ranges::chunk_view`<br>`std::views::chunk` | Creates N-chunks of a view
    and a number N. |

    | `std::ranges::chunk_by_view`<br>`std::views::chunk_by` | Creates chunks of a
    view based on a predicate. |

    | `std::ranges::as_const_view`<br>`std::views::as_const` | Converts a view into
    a constant range. |

    | `std::ranges::as_rvalue_view`<br>`std::views::as_rvalue` | Casts each element
    into an rvalue. |

    | `std::ranges::stride_view`<br>`std::views::stride` | Creates a view of the N-th
    elements of another view. |


    The following code snippet applies the new views.'
