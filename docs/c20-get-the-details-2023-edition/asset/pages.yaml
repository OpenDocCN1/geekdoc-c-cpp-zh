    the == operator. On the other hand, the compiler does not synthesize the == operator
    out of the != operator.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_175_1.png)


    # ### Similarity to Python


    In Python 3, the compiler generates != out of == if necessary but not the other
    way around. In Python 2, the so-called rich comparison (the user-defined six comparison
    operators) has a higher priority than Python’s three-way comparison operator __cmp__.
    I have to say Python 2 because the three-way comparison operator __cmp__ was removed
    in Python 3.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_175_2.png)


    # ### Distilled Information


    +   - By defaulting the operator `==`, the compiler autogenerates the equality
    and the inequality operator: `==`, and `!=`.

    +   - By defaulting the operator `<=>`, the compiler autogenerates the six comparison
    operators: `==`, `!=`, `<`, `<=`, `>`, and `>=`.

    +   - The compiler-generated comparison operators are `noexcept` and `constexpr`.
    They apply lexicographical comparison: all base classes are compared left to right,
    and all non-static members of the class in their declaration order.

    +   - When auto-generated comparison operators and user-defined comparison operators
    are present, the user-defined comparison operators have a higher priority.

    +   - The compiler rewrites expressions to take care of the symmetry of the comparison
    operators. For example if `(a <=> b) > 0` does not work, the compiler generates
    `0 < (b <=> a)`.'
