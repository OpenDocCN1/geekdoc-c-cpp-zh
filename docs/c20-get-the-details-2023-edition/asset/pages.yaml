  md: "# ### Primary interface file\n\n```\n~~~cpp\n// mathPartition.ixx\n\nexport\
    \ module math;\n\nexport import math1;\nexport import math2;\n~~~\n```\n\nThe\
    \ primary interface file consists of the exporting module declaration (line 3).\
