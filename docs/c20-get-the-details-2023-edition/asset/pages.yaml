  md: "# 8.1.1.1.3 Simplifying CRTP\n\nBut what does CRTP mean? The acronym CRTP stands\
    \ for the C++ idiom Curiously Recurring Template Pattern and means a technique\
    \ in C++ in which a class `Derived` derives from a class template `Base`. The\
    \ crucial point is that `Base` has `Derived` as a template argument.\n\n```\n\
    ```cpp\ntemplate <typename T>\nclass Base{\n    ...\n};\n\nclass Derived : public\
    \ Base<Derived>{\n    ...\n};\n```\n```\n\nCRTP is typically used to implement\
    \ polymorphism at compile time. For further information, please read my post [More\
    \ about Dynamic and Static Polymorphism](https://www.modernescpp.com/index.php/more-about-dynamic-and-static-polymorphism).\n\
    \nThanks to the explicit object parameter, I can remove the C and the R from the\
    \ acronym CRTP.\n\n# Simplifying CRTP\n\n```\n```cpp\n// deducingThisCRTP.cpp\n\
    \n#include <iostream>\n\nstruct Base{\n    template <typename Self>\n    void\
    \ interface(this Self&& self){\n        std::forward<Self>(self).implementation();\n\
    \    }\n    void implementation(){\n        std::cout << \"Implementation Base\\\
    n\";\n    }\n};\n\nstruct Derived : Base {\n    void implementation(){\n     \
    \   std::cout << \"Implementation Derived1\\n\";\n    }\n};\n\nstruct Derived2\
    \ : Base {\n    void implementation(){\n```\n```\n\nhttps://www.modernescpp.com/index.php/more-about-dynamic-and-static-polymorphism"
