  md: "```\nVector<std::regular>\nVector<T>\n```\n\nPartial template specialization\
    \ of concepts\n\n# 4.1.4.4.7 Using More than One Concept\n\nSo far, using the\
    \ concepts has been easy, but most of the time more than one concept is used at\
    \ a time.\n\nUsing more than one concept\n\n```\ntemplate<typename Iter, typename\
    \ Val>\n    requires std::input_iterator<Iter>\n             && std::equality_comparable<Value_type<Iter>,\
    \ Val>\nIter find(Iter b, Iter e, Val v)\n```\n\nfind requires for the iterator\
