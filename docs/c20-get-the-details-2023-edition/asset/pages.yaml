  md: "# New views in C++23\n\n```\n```cpp\n// cpp23Ranges.cpp\n\n#include <ranges>\n\
    \n...\n\nstd::vector vec = {1, 2, 3, 4};\n\nfor (auto i : vec | std::views::adjacent<2>)\
    \ {\n    std::cout << '(' << i.first << \", \" << i.second << \") \"; // (1, 2)\
    \ (2, 3) (3, 4)\n}\n\nfor (auto i : vec | std::views::adjacent_transform<2>(std::multiplies<>()))\
    \ {\n    std::cout << i << ' ';                                  // 2 6 12\n}\n\
    \nstd::print(\"{}\\n\", vec | std::views::chunk(2));             // [[1, 2], [3,\
    \ 4],\nstd::print(\"{}\\n\", vec | std::views::slide(2));             // [[1,\
    \ 2], [2, 3], [3, 4]\n\nfor (auto i : vec | std::views::slide(2)) {\n    std::cout\
    \ << '[' << i[0] << \", \" << i[1] << \"] \";      // [1, 2] [2, 3] [3, 4] [4,\
    \ 5]\n}\n\nstd::vector vec2 = {1, 2, 3, 0, 5, 2};\nstd::print(\"{}\\n\", vec2\
    \ | std::ranges::chunk_by(std::ranges::less_equal{}));\n                     \
    \                                         // [[1, 2, 3], [0, 5], [2]]\n\nfor (auto\
    \ i : vec | std::views::slide(2)) {\n    std::cout << '[' << i[0] << \", \" <<\
    \ i[1] << \"] \";      // [1, 2] [2, 3] [3, 4] [4, 5]\n}\n```\n```\n\n# 8.1.2.1.3\
