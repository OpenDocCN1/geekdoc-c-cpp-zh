- pgno: 126
  md: '# Modules compiler options


    | Modules Compiler Options | Description |

    |---|---|

    | `--precompile` | Creates the module. |

    | `-fmodule-output` | Creates the module in the working directory having the name
    of the input file with the extension `.pcm`. |

    | `-fmodule-output=<ModuleName>` | Creates the module having the name ModuleName.
    |

    | `-fmodule-header` | Enables the creation of the module from a header unit. Uses
    the user search path. |

    | `-fmodule-header=user` | Enables the creation of the module from a header unit.
    Uses the user search path. |

    | `-fmodule-header=system` | Enables the creation of the module from a header
    unit. Uses the system search path. |

    | `-xc++-header` | Headers without suffixes can be marked as header. |

    | `-xc++-user-header` | User headers without suffixes can be marked as header.
    |

    | `-xc++-system-header` | System headers without suffixes can be marked as header.
    |

    | `-x c++-module` | Enables you to use an importable module unit having not the
    suffix `.cppm`. |

    | `-fprebuilt-module-path=<ModuleDirectory>` | The compiler looks up the module
    in the directory ModuleDirectory. |

    | `-fmodule-file=<ModuleName>=<ModulePath>` | The compiler looks up the module
    ModuleName in the path ModulePath. The option `-fprebuilt-module-path` has a higher
    priority. |


    An importable module is a module unit that can be imported. Valid suffixes for
    header units are `h` or `hh`.


    For more details, refer to the official *Standard C++ Modules* documentation.
    In the following command lines, I use the compiler options for the module, and
    the file `math.pcm`.


    +   - Use the module declaration file `math.cppm` to create the pcm file (`math.pcm`).'
