    # ## 5.6.2.2 Time Durations and Literals


    C++14 introduced helper types such as `std::chrono::seconds` for time durations
    and corresponding time literals such as `5s`. C++20 added new helper types. The
    following table shows all for completeness.


    Time Durations and Time Literals


    | Helper Type | Suffix | Example | Duration | C++ Standard |

    |---|---|---|---|---|

    | std::chrono::nanoseconds | ns | 5ns | | C++14 |

    | std::chrono::microseconds | us | 5us | | C++14 |

    | std::chrono::milliseconds | ms | 5ms | | C++14 |

    | std::chrono::seconds | s | 5s | | C++14 |

    | std::chrono::minutes | min | 5min | | C++14 |

    | std::chrono::hours | h | 5h | | C++14 |

    | std::chrono::days | | | | C++20 |

    | std::chrono::weeks | | | | C++20 |

    | std::chrono::months | | | 30.436875 days | C++20 |

    | std::chrono::years | | | 365.2425 days (including leap years) | C++20 |


    Often the time duration `std::chrono::days` and the calendar date `std::chrono::day`
    are mixed up. The same holds for the time duration `std::chrono::years` and the
    calendar date `std::chrono::year`.


    # ### 5.6.2.2.1 Distinguish between the time durations std::chrono::days, std::chrono::years,
    and the calendar types std::chrono::day, std::chrono::year


    C++20 added two new literals for new calendar types `std::chrono::day` and `std::chrono::year`.
    The literals `d` and `y` refer to a `std::chrono::day` and `std::chrono::year`'
