  md: "# 4.5.2 constinit\n\nconstinit can be applied to variables with static storage\
    \ duration or thread storage duration.\n\n+   - Global (namespace) variables,\
    \ static variables, or static class members have **static storage duration**.\
    \ These objects are allocated when the program starts and are deallocated when\
    \ the program ends.\n+   - `thread_local` variables have **thread storage duration**.\
    \ Thread-local data is created for each thread that uses this data. `thread_local`\
    \ data exclusively belongs to the thread. They are created at their first usage\
    \ and their lifetime is bound to the lifetime of the thread it belongs to. Often\
    \ thread-local data is called thread-local storage.\n\nconstinit ensures that\
    \ this kind of variable (static storage duration or thread storage duration) is\
    \ initialized at compile time. constinit does not imply constness. This has two\
    \ interesting consequences: A constinit variable requires a constant compile time\
    \ value and cannot initialize another constinit variable.\n\n# Initialization\
    \ with constinit\n\n```\n```cpp\n// constinitSqr.cpp\n\n#include <iostream>\n\n\
    constexpr int sqr(int n) {\n    return n * n;\n}\n\nconstexpr auto res1 = sqr(5);\n\
    constinit auto res2 = sqr(5);\n\nint main() {\n\n    std::cout << \"sqr(5): \"\
    \ << res1 << '\\n';\n    std::cout << \"sqr(5): \" << res2 << '\\n';\n\n    constinit\
    \ thread_local auto res3 = sqr(5);\n    std::cout << \"sqr(5): \" << res3 << '\\\
    n';\n\n}\n```\n```\n\nres1 and res2 have static storage duration. res3 has thread\
    \ storage duration."
