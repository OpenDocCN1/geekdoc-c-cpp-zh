    \ Basics&) const = default;\n};\n\nstruct Arrays {\n    int ai[1];\n    char ac[2];\n\
    \    float af[3];\n    double ad[2][2];\n    auto operator<=>(const Arrays&) const\
    \ = default;\n};\n\nstruct Bases : Basics, Arrays {\n    auto operator<=>(const\
    \ Bases&) const = default;\n};\n\nint main() {\n    constexpr Bases a = { { 0,\
    \ 'c', 1.f, 1 },\n        { { 1 }, { 'a', 'b' }, { 1.f, 2.f, 3.f }, {{ 1., 2.\
    \ }, { 3., 4. } } } };\n    constexpr Bases b = { { 0, 'c', 1.f, 1 },\n      \
    \  { { 1 }, { 'a', 'b' }, { 1.f, 2.f, 3.f }, {{ 1., 2. }, { 3., 4. } } } };\n\
    \    static_assert(a == b);\n    static_assert(!(a != b));\n    static_assert(a\
    \ <= b);\n    static_assert(!(a > b));\n    static_assert(a >= b);\n}\n```\n```\n\
    \nI assume the most complicated stuff in this code snippet is not the spaceship\
