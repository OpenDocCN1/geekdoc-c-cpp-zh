- pgno: 109
  md: '# # Distilled Information


    +   - Functions or classes defined on a specific type or a type parameter have
    their set of problems. Concepts overcome these problems by putting semantic constraints
    on type parameters.

    +   - Concepts can be applied in requires clauses, in trailing requires clauses,
    as constrained template parameters, or in the abbreviated function templates.

    +   - Concepts are compile-time predicates that can be used for all kinds of templates.
    You can overload on concepts, specialize templates on concepts, use concepts for
    member functions or variadic templates.

    +   - Thanks to C++20 and concepts, the use of unconstrained placeholders (`auto`)
    and constrained placeholders (concepts) is unified. Whenever you use `auto`, you
    can use concepts in C++20.

    +   - Thanks to the new abbreviated function-templates syntax, defining a function
    template has become a piece of cake.

    +   - Don''t reinvent the wheel. Before you define your concepts, study the rich
    set of predefined concepts in the C++20 standard. When you define your concepts,
    you can apply two techniques: combine concepts and compile-time predicates or
    use requires expressions.

    +   - Requires expressions can be used as a compile-time predicate in `static_assert`,
    or `constexpr if`.'
