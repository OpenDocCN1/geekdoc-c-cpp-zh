  md: "# 10.22 Memory Model\n\nThe memory model defines the relationship between objects\
    \ and [memory locations] and deals with the question: What happens if two threads\
    \ access the same memory locations?\n\n# 10.23 Non-blocking\n\nAn algorithm is\
    \ called non-blocking if a failure or suspension of any thread cannot cause failure\
    \ or suspension of another thread. This definition is from the excellent book\
    \ [Java concurrency in practice](https://jcip.net).\n\n# 10.24 Object\n\nA type\
    \ is an object if it is either a [scalar], an array, a union, or a class.\n\n\
    # 10.25 Parallelism\n\nParallelism means that several tasks are performed at the\
    \ same time. Parallelism is a subset of [Concurrency]. In contrast to concurrency,\
    \ parallelism requires multiple cores.\n\n# 10.26 POD (Plain Old Data)\n\nA POD\
    \ type is [trivial] and has [standard layout].\n\n# 10.27 Predicate\n\nPredicates\
    \ are [callable units] that return something convertible to a boolean as a result.\
    \ If a predicate has one argument, it’s called a unary predicate. If a predicate\
    \ has two arguments, it’s called a binary predicate.\n\n# 10.28 RAII\n\nResource\
    \ Acquisition Is Initialization, or RAII for short, stands for a popular technique\
    \ in C++ in which the resource acquisition and release are bound to the lifetime\
    \ of an object. This means for a lock that the mutex will be locked in the constructor\
    \ and unlocked in the destructor.\n\nTypical use cases in C++ are [locks] that\
    \ handle the lifetime of its underlying [mutex], smart pointers that handle the\
    \ lifetime of its resource (memory), or [containers of the standard template library]\
    \ that handle the lifetime of their elements.\n\n¹ https://jcip.net  \n² https://en.cppreference.com/w/cpp/container"
  merge: -1
