  md: '![](img/c60a87adb7f61e2e82071d081bbb389a_352_0.png)


    Formatted output


    Presumably, the most exciting part of the formatting functions is the format string
    `("Hello, C++{}!\n")`.


    # ## 5.5.2 Format String


    The formatting string syntax is identical for the formatting functions `std::format`,
    `std::format_to`, `std::format_to_n`, `std::vformat`, and `std::vformat_to`. I
    use `std::format` in my examples.


    +   - Syntax: `std::format(FormatString, Args)`


    The format string FormatString consists of


    +   - Ordinary characters (except `{` and `}`)

    +   - Escape sequences (`{{` and `}}`) that are replaced by `{` and `}`)

    +   - Replacement fields


    A replacement field has the format `{ }`


    +   - You can use an argument id and a colon inside the replacement field followed
    by a format specification. Both components are optional.


    The argument id allows you to specify the index of the arguments in Args. The
    ids start with 0. When you don''t provide the argument id, the fields are filled
    in the same order as the arguments are given. Either all replacement fields have
    to use an argument id or none; i.e., `std::format("{}", "{}", "Hello", "World")`
    and `std::format("{1}", "{0}", "World", "Hello")` will both compile, but `std::format("{1}",
    "{}", "World", "Hello")` won''t.


    `std::formatter` and its specializations define the **format specification** for
    the argument types.


    +   - Basic types and `std::string`: standard format specification¹⁰ based on
    Python''s format specification¹¹

    +   - Chrono types: Chrono format specification¹². I present them in the Chrono
    I/O section of the Calendar and Time Zones chapter.

    +   - Other formattable types: User-defined `std::formatter` specialization


    The fact that the format strings is a compile time variable, has two interesting
    consequences: performance and safety.


    > > ¹⁰ https://en.cppreference.com/w/cpp/utility/format/formatter#Standard_format_specification

    > > ¹¹ https://docs.python.org/3/library/string.html#str.format

    > > ¹² https://en.cppreference.com/w/cpp/chrono/system_clock/formatter#Format_specification'
