  md: '# 4.1 Concepts


    ![](img/c60a87adb7f61e2e82071d081bbb389a_50_0.png)


    Cippi studies the stars


    To appreciate the impact of concepts to their full extent, I want to start with
    a short motivation for concepts.


    # 4.1.1 Two Wrong Approaches


    Before C++20, we had two opposed ways to think about functions or classes: defining
    them for specific types or defining them for generic types. In the latter case,
    we call them function templates or class templates. Both approaches have their
    own set of problems:


    # 4.1.1.1 Too Specific


    It’s tedious work to overload a function or reimplement a class for each type.
    To avoid that burden, type conversion often comes to our rescue. What seems like
    rescue is often a curse.'
