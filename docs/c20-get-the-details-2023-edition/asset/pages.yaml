    15

    16     auto newEnd = std::remove_if(myVec.begin(), myVec.end(),

    17         [](int ele){ return ele < 0; });

    18     myVec.erase(newEnd, myVec.end());

    19     // myVec.erase(std::remove_if(myVec.begin(), myVec.end(),

    20     //         [](int ele){ return ele < 0; }), myVec.end());

