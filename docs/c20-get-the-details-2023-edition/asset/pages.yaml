    # 4.1.7.4 Iterators Library


    The iterators library has many important concepts. They are defined in the `<iterator>`
    header. Here are the iterator categories:


    +   - `std::input_output_iterator`

    +   - `std::input_iterator`

    +   - `std::output_iterator`

    +   - `std::forward_iterator`

    +   - `std::bidirectional_iterator`

    +   - `std::random_access_iterator`

    +   - `std::contiguous_iterator`


    The six categories of iterators correspond to the respective iterator concepts.
    The table below provides two interesting pieces of information. For the four most
    prominent iterator categories, the table shows their properties and the associated
    standard library containers.


    ### Properties and Containers of each iterator category


    | Iterator Category | Properties | Containers |

    |---|---|---|

    | `std::forward_iterator` | `++It, It++, *It`<br>`It == It2, It != It2` | `std::unordered_set`<br>`std::unordered_map`<br>`std::unordered_multiset`<br>`std::unordered_multimap`<br>`std::forward_list`
    |

    | `std::bidirectional_iterator` | `--It, It--` | `std::set`<br>`std::map`<br>`std::multiset`<br>`std::multimap`
    |'
