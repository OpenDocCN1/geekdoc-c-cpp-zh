  md: '# ## 6.3 Semaphores


    ![](img/c60a87adb7f61e2e82071d081bbb389a_502_0.png)


    Cippi directs the train


    Semaphores are a synchronization mechanism used to control concurrent access to
    a shared resource. A counting semaphore is a special semaphore that has a counter
    greater than zero. The counter is initialized in the constructor. Acquiring the
    semaphore decreases the counter, and releasing the semaphore increases the counter.
    If a thread tries to acquire the semaphore when the counter is zero, the thread
    will block until another thread increments the counter by releasing the semaphore.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_502_1.png)


    # ### Edsger W. Dijkstra invented Semaphores


    The Dutch computer scientist Edsger W. Dijkstra<sup>31</sup> presented in 1965
    the concept of a semaphore. A semaphore is a data structure with a queue and a
    counter. The counter is initialized to a value equal to or greater than zero.
    It supports the two operations wait and signal. Operation wait acquires the semaphore
    and decreases the counter. It blocks the thread from acquiring the semaphore if
    the counter is zero. Operation signal releases the semaphore and increases the
    counter. Blocked threads are added to the queue to avoid starvation<sup>32</sup>.


    Originally, a semaphore was a railway signal.


    <sup>31</sup> https://en.wikipedia.org/wiki/Edsger_W._Dijkstra

    <sup>32</sup> https://en.wikipedia.org/wiki/Starvation_(computer_science)'
