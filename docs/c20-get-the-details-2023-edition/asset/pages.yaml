  md: '# 6.6 `std::jthread`


    ![](img/c60a87adb7f61e2e82071d081bbb389a_531_0.png)


    Cippi ties a braid


    `std::jthread` stands for joining thread. In addition to `std::thread`<sup>36</sup>
    from C++11, `std::jthread` automatically joins in its destructor and can cooperatively
    be interrupted. `std::jthread` models RAII and, therefore, also joins when an
    exception occurs.


    The `std::jthread` constructor creates a `std::stop_source` and stores it as a
    member of the thread object. It passes the corresponding `std::stop_token` to
    the called function if that function takes an additional `std::stop_token` as
    first parameter. The `std::stop_token` can be used by the functions to check if
    a stop request has been made.


    The following table gives you a concise overview of the `std::jthread` functionality.
    For additional details, please refer to cppreference.com<sup>37</sup>.'
