- pgno: 654
  md: '# The Concept Awaiter


    | Function | Description |

    |---|---|

    | `await_ready` | Indicates if the result is ready. When it returns false, `await_suspend`
    is called. |

    | `await_suspend` | Schedules the coroutine to resume or destroy. |

    | `await_resume` | Provides the result for the `co_await` expression. |


    The C++20 standard already defines two basic awaitables: `std::suspend_always`,
    and `std::suspend_never`.


    # 10.5 Callable


    see Callable Unit.


    # 10.6 Callable Unit


    A callable unit, or callable for short, is something that behaves like a function.
    Not only are these named functions but also function objects or lambda expressions.
    If a callable accepts one argument, it’s called a unary callable, and with two
    arguments, it’s called a binary callable.


    Predicates are special callables that return a boolean as a result.


    # 10.7 Concurrency


    Concurrency means that the execution of several tasks overlaps. Concurrency is
    a superset of parallelism.


    # 10.8 Critical Section


    A critical section is a section of code that contains shared variables and must
    be protected to avoid a data race. At most one thread at a time should enter a
    critical section.


    # 10.9 Data Race


    A data race is a situation in which at least two threads access a shared variable
    at the same time. At least one thread tries to modify the variable, and the other
    tries to read or modify the variable. If your program has a data race, it has
    undefined behavior. This means all outcomes are possible.'
