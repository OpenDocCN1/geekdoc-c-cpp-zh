    \ from an input stream using `std::chrono::from_stream`\n\n# 5.6.6.2 `std::chrono::parse`\n\
    \nAccordingly to `std::chrono::from_stream`, you can use the function `std::chrono::parse`\
    \ for parsing input. The following code snippet shows their equivalence.\n\n|\
    \ Equivalence of `std::chrono::from_stream` and `std::chrono::parse` |\n|---|\n\
    | `std::chrono::from_stream(is, fmt, chro)` |\n| `is >> std::chrono::parse(fmt,\
    \ chro)` |\n\nInstead of `std::chrono::from_stream`, `std::chrono::parse` is directly\
    \ invoked on the input stream is. `std::chrono::parse` also needs a format string\
    \ fmt and a chrono object chro.\n\nConsequently, I can directly rewrite the previous\
    \ program inputChrono.cpp using `std::chrono::from_stream` into the program inputChronoParse.cpp\
    \ using `std::chrono::parse`.\n\nReading chrono objects from an input stream using\
    \ `std::chrono::parse`\n\n```\n```cpp\n// inputChronoParse.cpp\n\n#include <chrono>\n\
    #include <iostream>\n#include <string>\n#include <sstream>\n\nint main() {\n\n\
    \    std::cout << '\\n';\n\n    std::chrono::sys_seconds timePoint;\n    std::istringstream\
    \ iStream{\"2021-08-11 21:49:35\"};\n    iStream >> std::chrono::parse(\"%F %T\"\
    , timePoint);\n    if (iStream) std::cout << \"timePoint: \" << timePoint << '\\\
    n';\n    else std::cerr << \"timePoint: Reading failed\\n\";\n}\n```\n```"
