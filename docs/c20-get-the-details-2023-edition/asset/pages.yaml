    \n**Bit manipulation**\n\n| Function | Description |\n|---|---|\n| `std::bit_cast`\
    \ | Reinterprets the object representation |\n| `std::has_single_bit` | Checks\
    \ if a number is a power of two |\n| `std::bit_ceil` | Finds the smallest integer\
    \ power of two that is not smaller than the given value |\n| `std::bit_floor`\
    \ | Finds the largest integer power of two that is not greater than the given\
    \ value |\n| `std::bit_width` | Finds the smallest number of bits to represent\
    \ the given value |\n| `std::rotl` | Computes the bitwise left-rotation |\n| `std::rotr`\
    \ | Computes the bitwise right-rotation |\n| `std::countl_zero` | Counts the number\
    \ of consecutive 0s, starting with the most significant bit |\n| `std::countl_one`\
    \ | Counts the number of consecutive 1s, starting with the most significant bit\
    \ |\n| `std::countr_zero` | Counts the number of consecutive 0s, starting with\
    \ the least significant bit |\n| `std::countr_one` | Counts the number of consecutive\
    \ 1s, starting with the least significant bit |\n| `std::popcount` | Counts the\
    \ number of 1s in an unsigned integer |\n\nAll of the functions except `std::bit_cast`\
    \ require an unsigned integral type (unsigned char, unsigned short, unsigned int,\
    \ unsigned long, or unsigned long long). `std::bit_cast` guarantees that the"
