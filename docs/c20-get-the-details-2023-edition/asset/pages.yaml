    \ not the spaceship operator but the initialization of Bases via aggregate initialization\
    \ (lines 22 and 25). Aggregate initialization enables us to directly initialize\
    \ the members of a class type (class, struct, union) when the members are all\
    \ public. In this case, you can use brace initialization. Aggregate initialization\
    \ is discussed in more detail in the section on designated initializers in C++20.\n\
    \n![](img/c60a87adb7f61e2e82071d081bbb389a_170_0.png)\n\n# Optimized == and !=\
    \ Operators\n\nThere is an optimization potential for string-like or vector-like\
    \ types. In this case, a == and != may be faster than the compiler-generated comparison\
    \ operator. The == and != operators can stop if the two values compared have different\
    \ lengths. Otherwise, if one value were a prefix of the other, lexicographical\
    \ comparison would compare all elements until the end of the shorter value. Consequently,\
    \ the compiler-generated == and != operators compare, in the case of a string-like\
    \ or a vector-like type, first their lengths and then their content if necessary.\
    \ The standardization committee was aware of this performance issue and fixed\
    \ it with the paper [P1185R2](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p1185r2.html).\n\
    \nNow, it’s time for something new in C++. C++20 introduces the concept of rewriting\
    \ expressions.\n\n# 4.3.5 Rewriting Expressions\n\nWhen the compiler sees something\
    \ such as `a < b`, it rewrites it to `(a <=> b) < 0` using the spaceship operator.\n\
    \n⁶² [http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p1185r2.html](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p1185r2.html)"
