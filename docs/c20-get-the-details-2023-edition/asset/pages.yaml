  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_225_0.png)\n\n# ## The issue with\
    \ std::async\n\nMany existing functions in C++ could benefit from the [[nodiscard]]\
    \ attribute. An ideal candidate is the function std::async. When you don't use\
    \ the return value of std::async, what you intended as an asynchronous std::async\
    \ call implicitly becomes synchronous. What should have run in a separate thread\
    \ behaves instead as a blocking function call. Read more about the counterintuitive\
    \ behavior of std::async in my post “The Special Futures”⁷⁶.\n\nWhile studying\
    \ the [[nodiscard]] syntax on cppreference.com/nodiscard⁷⁷, I noticed that the\
    \ declarations of std::async⁷⁸ changed with C++20. Here is one:\n\n```\n    std::async\
    \ uses in C++20 the attribute [[nodiscard]]\n    template<class Function, class...\
    \ Args>\n    [[nodiscard]]\n    std::future<std::invoke_result_t<std::decay_t<Function>,\n\
    \                                     std::decay_t<Args>>...>\n      async( Function&&\
    \ f, Args&&... args );\n```\n\nThe return-type of promise std::async, is declared\
    \ as [[nodiscard]] in C++20.\n\nThe next two attributes [[likely]] and [[unlikely]]\
    \ are about optimization.\n\n# ### 4.8.2 [[likely]] and [[unlikely]]\n\nProposal\
    \ P0479R5⁷⁹ for the attributes [[likely]] and [[unlikely]] is the shortest proposal\
    \ I know of. To give you an idea, this is an interesting note to the proposal:\
    \ “*The use of the likely attribute is intended to allow implementations to optimize\
    \ for the case where paths of execution including it are arbitrarily more likely\
    \ than any alternative path of execution that does not include such an attribute\
    \ on a statement or label. The use of the unlikely attribute is intended to optimize\
    \ for the case where paths of execution including it are arbitrarily more unlikely\
    \ than any alternative path of execution that does not include such an attribute\
    \ on a statement or label. A path of execution includes a label if and only if\
    \ it contains a jump to that label. Excessive usage of either of these attributes\
    \ is liable to result in performance degradation.*”\n\nIn summary, both attributes\
    \ allow for giving the optimizer a hint regarding the path of execution expected\
    \ to be more or less likely."
