    # ### 4.5.4.1.2 Lazy initialization of a static with a Local Scope


    Static variables with local scope are created when they are used the first time.
    Local scope essentially means that the static variable is surrounded in some way
    by curly braces. This lazy creation is a guarantee that C++98 provides. With C++11,
    static variables with local scope are also initialized in a thread-safe way. The
    thread-safe Meyers⁴² singleton is based on this additional guarantee. The lazy
    initialization can also be used to overcome the static initialization order fiasco.'
