- pgno: 662
  md: '# ## 10.43 Trivial Type


    A trivial type is a type for which the compiler creates all the special member
    functions implicitly or explicitly they are defaulted by the user. The member
    of a trivial type can have different access specifiers and occupies a contiguous
    memory block.


    A trivial type cannot have


    +   - virtual functions or virtual base classes.

    +   - non-trivial base classes.

    +   - non-trivial members.


    A trivial type is in contrast to a standard-layout¹² type not compatible with
    C.


    # ## 10.44 Type Erasure


    Type erasure is a type-safe generic way to provide a unique interface for different
    types. The different types don''t need a common base class and are unrelated.


    # ## 10.45 Undefined Behavior


    All bets are off. Your program can produce the correct or the wrong result, can
    crash at run time, or may not even compile. That behavior might change when porting
    to a new platform, upgrading to a new compiler, or as a result of an unrelated
    code change.'
