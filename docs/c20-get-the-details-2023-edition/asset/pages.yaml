  md: "# ### 3.3 The Standard Library\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_36_0.png)\n\
    \n+   **The Big Four**\n+   - Concepts\n+   - Modules\n+   - Ranges library\n\
    +   - Coroutines\n\n+   **Core Language**\n+   - Three-way comparison operator\n\
    +   - Designated initializers\n+   - consteval and constinit\n+   - Template improvements\n\
    +   - Lambda improvements\n+   - New attributes\n\n+   **Library**\n+   - std::span\n\
    +   - Container improvements\n+   - Automatic utilities\n+   - Calendar and time\
    \ zone\n+   - Formatting library\n\n+   **Concurrency**\n+   - Atomics\n+   -\
    \ Semaphores\n+   - Latches and barriers\n+   - Cooperative interruption\n+  \
    \ - std::jthread\n\n# #### 3.3.1 std::span\n\nA std::span represents an object\
    \ that can refer to a contiguous sequence of objects. A std::span, sometimes also\
    \ called a view, is never an owner. This view can be a C-array, a std::array,\
    \ a pointer with a size, or a std::vector. A typical implementation of a std::span\
    \ needs a pointer to its first element and a size. The main reason for having\
    \ a std::span is that a plain array will decay to a pointer if passed to a function;\
    \ therefore, its size is lost. std::span automatically deduces the size of an\
    \ array, a std::array, or a std::vector. If you use a pointer to initialize a\
    \ std::span, you have to provide the size in the constructor.\n\n**std::span as\
    \ function argument**\n\n```\n    void copy_n(const int* src, int* des, int n){}\n\
    \n    void copy(std::span<const int> src, std::span<int> des){}\n\n    int main(){\n\
    \n        int arr1[] = {1, 2, 3};\n        int arr2[] = {3, 4, 5};\n\n       \
    \ copy_n(arr1, arr2, 3);\n        copy(arr1, arr2);\n\n    }\n```\n\nCompared\
    \ to the function `copy_n`, `copy` doesn't need the number of elements. Hence,\
    \ a common cause of errors is gone with `std::span<T>`."
