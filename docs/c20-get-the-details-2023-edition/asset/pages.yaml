  md: '# 5.7 Further Improvements


    ![](img/c60a87adb7f61e2e82071d081bbb389a_427_0.png)


    Cippi goes up


    # 5.7.1 `std::bind_front`


    `std::bind_front (Func&& func, Args&& ... args)` creates a callable wrapper for
    a callable func.


    `std::bind_front` can have an arbitrary number of arguments and binds its arguments
    to the front.


    ![](img/c60a87adb7f61e2e82071d081bbb389a_427_1.png)


    # `std::bind_front` versus `std::bind`


    Since C++11, we have had `std::bind` and lambda expressions. With C++20, we get
    `std::bind_front`. This may make you wonder. To be pedantic, `std::bind` is available
    since the Technical Report 1 (TR1), `std::bind` and lambda expressions can be
    used as a replacement of `std::bind_front`. Furthermore, `std::bind_front` seems
    like the little sister of `std::bind`, because only `std::bind` supports the rearranging
    of arguments. Of course, there is a reason to use `std::bind_front` in the future:
    in contrast to `std::bind`, `std::bind_front` propagates the exception specification
    of the underlying callable operator.


    The following program shows that you can replace `std::bind_front` with `std::bind`
    or lambda expressions.


    +   1. https://en.cppreference.com/w/cpp/utility/functional/bind

    +   2. https://en.cppreference.com/w/cpp/language/lambda

    +   3. https://en.cppreference.com/w/cpp/utility/functional/bind_front

    +   4. https://en.wikipedia.org/wiki/C%2B%2B%20Technical_Report_1'
