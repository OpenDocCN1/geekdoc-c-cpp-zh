  md: "# 4.2.2 Advantages\n\nLet me start with a simple executable. For obvious reasons,\
    \ I create a `helloWorld.cpp` program.\n\n# A simple hello world program\n\n```\n\
    ```cpp\n// helloWorld.cpp\n\n#include <iostream>\n\nint main() {\n    std::cout\
    \ << \"Hello World\" << '\\n';\n}\n```\n```\n\nMaking an executable `helloWorld`\
    \ out of the program `helloWorld.cpp` with GCC<sup>1</sup> increases its size\
    \ by factor 130.\n\n![](img/c60a87adb7f61e2e82071d081bbb389a_113_0.png)\n\nSize\
    \ of an object file\n\nThe numbers 100 and 12928 in the screenshot represent the\
    \ number of bytes. Okay. We should have a basic understanding of what’s happening\
    \ under the hood.\n\n# 4.2.2.1 The Classical Build Process\n\nThe build process\
    \ consists of three steps: preprocessing, compilation, and linking.\n\n# 4.2.2.1.1\
    \ Preprocessing\n\nThe preprocessor handles the directives as `#include` and `#define`.\
    \ The preprocessor substitutes `#include` directives with the corresponding header\
    \ files, and it substitutes the macros (`#define`). Thanks to directives such\
    \ as `#if`, `#else`, `#elif`, `#ifdef`, `#ifndef`, and `#endif`, parts of the\
    \ source code can be included or excluded.\n\nYou can observe this straightforward\
    \ text substitution process by using the compiler flag `-E` on GCC/Clang or /E\
    \ on Windows.\n\n> <sup>1</sup>http://gcc.gnu.org/"
