    # 5.3.2.2 `std::make_shared`


    Since C++11, C++ supports the creation of the `std::shared_ptr` via the factory
    function `std::make_shared`^28. With C++20, this factory function supports the
    creation of arrays of `std::shared_ptr`.


    +   - `std::shared_ptr<double[]> shar = std::make_shared<double[]>(1024);` creates
    a shared_ptr with 1024 default-initialized doubles

    +   - `std::shared_ptr<double[]> shar = std::make_shared<double[]>(1024, 1.0);`
    creates a shared_ptr with 1024 doubles initialized to 1.0


