  md: "# Pack Expansion in Init-Capture\n\n```\n```cpp\n// packExpansionInitCapture.cpp\n\
    \n#include <iostream>\n#include <memory>\n#include <utility>\n\ntemplate<typename\
    \ Callable, typename ... Args>\nauto packExpansion(Callable call, Args ... args)\
    \ {\n    return [call, ...args = std::move(args)] {\n        return call(args...);\n\
    \    };\n}\n\nvoid func(int fir, double sec, bool thi) {\n    std::cout << std::boolalpha;\n\
    \    std::cout << \"fir: \" << fir << '\\n';\n    std::cout << \"sec: \" << sec\
