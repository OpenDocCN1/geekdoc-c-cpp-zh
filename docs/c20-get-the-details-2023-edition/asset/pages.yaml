- pgno: 117
  md: "# 4.2.2.2.2 Isolation from Preprocessor Macros\n\nIf there is one consensus\
    \ in the C++ community, it’s the following: we should eliminate the preprocessor\
    \ macros. Why? Using a macro is simply text substitution, excluding any C++ semantics.\
    \ Of course, this has many negative consequences: for example, it may depend on\
    \ which sequence you include macros, or macros can clash with already defined\
    \ macros or names in your application.\n\nImagine you have two header files `webcolors.h`\
    \ and `productinfo.h`.\n\nFirst definition of macro RED\n\n```\n    // webcolors.h\n\
    \n    #define RED   0xFF0000\n```\n\nSecond definition of macro RED\n\n```\n \
    \   // productinfo.h\n\n    #define RED   0\n```\n\nWhen a source file `client.cpp`\
    \ includes both headers, the value of the macro RED depends on the order of the\
    \ included header. This dependency is very error-prone.\n\n**With modules, import\
    \ order makes no difference.**\n\n# 4.2.2.2.3 Multiple Definitions of Symbols\n\
    \nODR stands for the One Definition Rule and says in the case of a function:\n\
    \n+   - A function can have not more than one definition in any translation unit.\n\
    +   - A function can not have more than one definition in the program.\n\nInline\
    \ functions with external linkage can be defined in more than one translation\
    \ unit. The definitions must satisfy the requirement that all definitions have\
    \ to be the same.\n\nLet’s see what my linker says when I try to link a program\
    \ that violates the one-definition rule. The following code example has two header\
    \ files, `header.h` and `header2.h`. The main program includes the header files\
    \ `header.h` twice, breaking the one-definition rule because two definitions of\
    \ `func` are included."
