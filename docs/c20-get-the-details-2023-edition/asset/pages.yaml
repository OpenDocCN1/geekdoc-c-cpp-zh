  md: "```\n```cpp\n// macro.ixx\n\nmodule;\n\n#include \"macro.h\"\n\nexport module\
    \ macro;\n```\n```\n\n# #### 4.2.4.2 Templates in Modules\n\nI often hear the\
    \ question: How do modules export templates? When you instantiate a template,\
    \ its definition must be available. For this reason, template definitions are\
    \ hosted in headers. Conceptually, the usage of a template has the following structure.\n\
    \n# ##### 4.2.4.2.1 Without Modules\n\n+   - `templateSum.h`\n\n# **Definition\
    \ of the function template sum**\n\n```\n```cpp\n// templateSum.h\n\ntemplate\
    \ <typename T, typename T2>\nauto sum(T fir, T2 sec) {\n    return fir + sec;\n\
    }\n```\n```\n\n+   - `sumMain.cpp`\n\n# **Use of the template sum**\n\n```\n```cpp\n\
    // sumMain.cpp\n\n#include \"templateSum.h\"\n\nint main() {\n\n    sum(1, 1.5);\n\
    \n}\n```\n```\n\nThe main program includes the header `templateSum.h`. The call\
    \ `sum(1, 1.5)` triggers the template instantiation. In this case, the compiler\
    \ generates out of the function template `sum` the concrete function `sum`, which\
    \ takes an `int` and a `double` as arguments. If you want to visualize this process,\
    \ use the example on [C++ Insights](https://cppinsights.io/).\n\n[https://cppinsights.io/](https://cppinsights.io/)"
