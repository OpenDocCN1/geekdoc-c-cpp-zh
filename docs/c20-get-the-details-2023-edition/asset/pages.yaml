  md: "# **The equivalent function and function template add**\n\n```\n```cpp\ntemplate<typename\
    \ T, typename T2>\nauto add(T fir, T2 sec) {\n    return fir + sec;\n}\n\nauto\
    \ add(auto fir, auto sec) {\n    return fir + sec;\n}\n```\n```\n\nAccordingly,\
    \ due to the usage of the concept `std::integral`, the function `sub` is equivalent\
    \ to the function template `sub`.\n\n# **The equivalent function and function\
    \ template sub**\n\n```\n```cpp\ntemplate<std::integral T, std::integral T2>\n\
    std::integral auto sub(T fir, T2 sec) {\n    return fir - sec;\n}\n\nstd::integral\
    \ auto sub(std::integral auto fir, std::integral auto sec) {\n    return fir -\
    \ sec;\n}\n```\n```\n\nThe function and the function template can have arbitrary\
    \ types. This means both types can be different but must be integral. For example,\
    \ a call `sub<100, 10>` and also `sub<100, true>` would be valid.\n\nAdditionally,\
    \ you can also explicitly specify the template parameter:\n\n# **Explicit template\
    \ parameters**\n\n```\n```cpp\nadd<int>(100, 10);   // equivalent to add(100,\
    \ 10)\nsub<int>(100, 10);   // equivalent to sub(100, 10)\n```\n```\n\nThere is\
    \ one interesting feature still missing in the abbreviated function templates\
    \ syntax: you can overload on `auto` or concepts.\n\n# **4.1.6.1 Overloading**\n\
    \nThe following functions overload are overloaded on `auto`, the concept `std::integral`,\
    \ and the type `long`."
