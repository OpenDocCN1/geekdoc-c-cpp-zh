    # # The Importance of being Thread Safe


    I want to take a short detour to emphasize how important it is that the `std::shared_ptr`
    has well-defined multithreading semantics. At first glance, using a `std::shared_ptr`
    does not appear to be a sensible choice for multithreaded code. It is by definition
    shared and mutable and is the ideal candidate for non-synchronized read and write
    operations and hence for undefined behavior. On the other hand, there is the guideline
    in modern C++: **Don''t use raw pointers.** This means, consequently, that you
    should use smart pointers in multithreaded programs.


    The proposal N4162^24^ for atomic smart pointers directly addresses the deficiencies
    of the current implementation. The shortcomings boil down to these three points:
    consistency, correctness, and performance.


    +   - **Consistency**: the atomic operations for `std::shared_ptr` are the only
    atomic operations for a non-atomic data type.

    +   - **Correctness**: using global atomic operations is quite error-prone because
    the correct usage is based on discipline. It is easy to forget to use an atomic
    operation - such as using `ptr = localPtr` instead of `std::atomic_store(&ptr,
    localPtr)`. The result is undefined behavior because of a data race. If we used
    an atomic smart pointer instead, the type system would not allow it.

    +   - **Performance**: the atomic smart pointers have a significant advantage
    compared to non-atomic versions. The atomic versions are designed for the particular
    use case and can internally have a `std::atomic_flag` as cheap spinlock^25^. Designing
    the non-atomic versions of the pointer functions to be thread-safe would be overkill
    when they are used in a single-threaded scenario. They would have a performance
    penalty.


    The correctness argument is probably the most important one. Why? The answer lies
    in the proposal. The proposal presents a thread-safe singly-linked list that supports
    insertion, deletion, and searching of elements. This singly-linked list is implemented
    in a lock-free way.


    +   24. https://wg21.link/n4162

    +   25. https://en.wikipedia.org/wiki/Spinlock'
