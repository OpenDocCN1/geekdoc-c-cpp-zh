- pgno: 18
  md: '# # 1. Historical Context


    C++20 is the next big C++ standard after C++11. Like C++11, C++20 changes the
    way we program in modern C++. This change mainly results from the addition of
    Concepts, Modules, Ranges, and Coroutines to the language. To understand this
    next big step in the evolution of C++, let me write a few words about the historical
    context of C++20.


    | Version | C++98 | C++11 | C++14 | C++17 | C++20 |

    | --- | --- | --- | --- | --- | --- |

    | Year | 1998 | 2011 | 2014 | 2017 | 2020 |

    | Features | Templates; STL with containers and algorithms; Strings; IO Streams
    | Move semantics; Uniform initialization; auto and decltype; Lambda functions;
    constexpr; Multithreading and the memory model; Regular expressions; Smart pointers;
    variadic templates; std::array | Reader-writer locks; Generic lambda functions
    | Fold expressions; constexpr if; Structured binding; std::string_view; Parallel
    algorithms of the STL; Filesystem library; std::optional, std::variant, and std::any
    | Concepts; Modules; Ranges library; Coroutines |


    *C++ History*


    C++ is about 40 years old. Here is a brief overview of what has changed in the
    previous years.


    # ## 1.1 C++98


    At the end of the ‘80s, Bjarne Stroustrup and Margaret A. Ellis wrote their famous
    book Annotated C++ Reference Manual[^1] (ARM). This book served two purposes,
    to define the functionality of C++ in a world with many implementations and to
    provide the basis for the first C++ standard C++98 (ISO/IEC 14882). Some of the
    essential features of C++98 were: templates, the Standard Template Library (STL)
    with its containers and algorithms, strings, and IO streams.


    # ## 1.2 C++03


    With C++03 (14882:2003), C++98 received a technical correction, so small that
    it doesn''t fit the timeline above. In the community, C++03, which includes C++98,
    is called legacy C++.


    [^1]: https://www.stroustrup.com/arm.html'
  merge: -1
  img_proc: true
