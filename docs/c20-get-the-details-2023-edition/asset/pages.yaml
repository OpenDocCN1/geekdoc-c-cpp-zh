    **Thread synchronization with condition variables**


    Condition variables have many inherent issues. For example, the receiver could
    be awakened without notification or could lose the notification. The first issue
    is known as a spurious wakeup and the second as a lost wakeup. The predicate protects
    against both flaws. The notification could be lost when the sender sends its notification
    before the receiver is in the wait state and does not use a predicate. Consequently,
    the receiver waits for something that never happens. This is a deadlock. When
    you study the program''s output, you see that every second run would cause a deadlock
    if I did not use a predicate. Of course, it is possible to use condition variables
    without a predicate.


    If you want to know the details of the sender-receiver workflow and the traps
    of condition variables, read my posts “C++ Core Guidelines: Be Aware of the Traps
    of Condition Variables”.


