    \ syntax\n\nI assume you want to display a calendar date (`year(2010)/March/last`)\
    \ in a readable form, for example, 2020-03-31. This is a job for the `local_days`\
    \ or `sys_days` operator.\n\n# ### 5.6.4.4 Displaying Calendar Dates\n\nThanks\
    \ to `std::chrono::local_days` or `std::chrono::sys_days`, you can convert calendar\
    \ dates to a local or a system `std::chrono::time_point`. I use `std::chrono::sys_days`\
    \ in my example. `std::chrono::sys_days` is based on `std::chrono::system_clock`^33.\
    \ Let me convert the calendar dates (lines 18, 22, and 26) from the previous program\
    \ `createCalendar.cpp`.\n\n# **Displaying calendar dates**\n\n```\n```cpp\n//\
    \ sysDays.cpp\n\n#include <chrono>\n#include <iostream>\n\nint main() {\n\n  \
    \  std::cout << '\\n';\n\n    using std::chrono::last;\n\n    using std::chrono::year;\n\
    \    using std::chrono::sys_days;\n\n    using std::chrono::March;\n    using\
    \ std::chrono::February;\n\n    using std::chrono::Monday;\n```\n```"
