    \ {\n        std::cout << i << \" \";\n    }\n\n    std::cout << \"\\n\\n\";\n\
    }\n```\n```\n\nIn the program dataRaceRanges.cpp, I iterate concurrency two times\
    \ through a view in a non-modifying way. First, I iterate in the `std::jthread`\
    \ thr1 (line 17) and second in the main function (line 24). This is a data race\
