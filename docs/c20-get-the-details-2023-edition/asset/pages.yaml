    # Don’t define Concepts Recursively or try to Constrain them


    A recursive definition of a concept is not valid:


    # Recursively defining a concept


    ```

    ```cpp

    template <typename T>

    concept Recursive = Recursive<T>;

    ```

    ```


    The GCC compiler complains in this case that `Recursive` was not declared in this
    scope.


    When you try to constrain a concept such as in the following code snippet, the
    GCC compiler unambiguously complains that a concept cannot be constrained.


    Let’s


    # Constraining a concept


    ```

    ```cpp

    template <typename T>

    concept AlwaysTrue = true;


    template <typename T>

    requires AlwaysTrue<T>

    concept Error = true;

    ```

    ```


    start with the concepts Integral, SignedIntegral, and UnsignedIntegral.


    # The concepts Integral, SignedIntegral, and UnsignedIntegral


    ```

    ```cpp

    template <typename T>

    concept Integral = std::is_integral<T>::value;


    template <typename T>

    concept SignedIntegral = Integral<T> && std::is_signed<T>::value;


    template <typename T>

    concept UnsignedIntegral = Integral<T> && !SignedIntegral<T>;

    ```

    ```


