    \ if you follow my advice to refactor, you can skip this section.\n\n# 4.5.4.1\
    \ Static Initialization Order Fiasco\n\nStatic variables in one translation unit\
    \ are initialized according to their definition order.\n\nIn contrast, the initialization\
    \ of static variables between translation units has a severe issue. When one static\
    \ variable `staticA` is defined in one translation unit and another static variable\
    \ `staticB` is"
