  md: "# 5.4.4 Bit Manipulation\n\nThe header `<bit>` supports various `constexpr`\
    \ functions to access and manipulate individual bits or bit sequences.\n\n# 5.4.4.1\
    \ `std::endian`\n\nThanks to the new type `std::endian`, you get the endianness\
    \ of a scalar type. Endianness can be big-endian or little-endian. Big-endian\
    \ means that the most significant byte is furthest left, little-endian means that\
    \ the least significant byte is furthest left. A scalar type is either an arithmetic\
    \ type, an enum, a pointer, a member pointer, or a `std::nullptr_t`.\n\nThe class\
    \ `endian` provides the endianness of all scalar types:\n\n```\n```cpp\nenum class\
    \ endian\n{\n    little = /*implementation-defined*/,\n    big    = /*implementation-defined*/,\n\
    \    native = /*implementation-defined*/\n};\n```\n```\n\n+   - If all scalar\
    \ types are little-endian, `std::endian::native` is equal to `std::endian::little`.\n\
    +   - If all scalar types are big-endian, `std::endian::native` is equal to `std::endian::big`.\n\
    \nEven corner cases are supported:\n\n+   - If all scalar types have `sizeof 1`\
    \ and therefore endianness does not matter, the values of the enumerators `std::endian::little`,\
    \ `std::endian::big`, and `std::endian::native` are identical.\n+   - If the platform\
    \ uses mixed endianness, `std::endian::native` is neither equal to `std::endian::big`\
    \ nor `std::endian::little`.\n\nWhen I perform the following program `getEndianness.cpp`\
    \ on a x86 architecture, I get the answer `little-endian`.\n\n```\n```cpp\nenum\
    \ class endian\n\n// getEndianness.cpp\n\n#include <bit>\n#include <iostream>\n\
    \nint main() {\n\n    if constexpr (std::endian::native == std::endian::big) {\n\
    \        std::cout << \"big-endian\" << '\\n';\n```\n```"
