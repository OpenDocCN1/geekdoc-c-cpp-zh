  md: "set can be addressed. A bit field is most commonly used to represent integral\
    \ types of known, fixed bit-width.\n\nWith C++20, we can default-initialize the\
    \ members of a bit field:\n\n# Default initializers for the members of a bit field\n\
    \n```\n```cpp\n// bitField.cpp\n\n#include <iostream>\n\nstruct Class11 {\n  \
    \  int i = 1;\n    int j = 2;\n    int k = 3;\n    int l = 4;\n    int m = 5;\n\
    \    int n = 6;\n};\n\nstruct BitField20 {\n    int i : 3 = 1;\n    int j : 4\
    \ = 2;\n    int k : 5 = 3;\n    int l : 6 = 4;\n    int m : 7 = 5;\n    int n\
    \ : 7 = 6;\n};\n\nint main () {\n\n    std::cout << '\\n';\n\n    std::cout <<\
    \ \"sizeof(Class11): \" << sizeof(Class11) << '\\n';\n    std::cout << \"sizeof(BitField20):\
    \ \" << sizeof(BitField20) << '\\n';\n\n    std::cout << '\\n';\n\n}\n```\n```\n\
    \nAccording to the members of a class (lines 6 - 11) with C++11, the members of\
    \ the bit field can have default initializers (lines 15 - 20) with C++20. When\
    \ you sum up the numbers 3, 4, 5, 6, 7, and 7, you get 32. Hence, 32 bits, or\
    \ 4 bytes is exactly the size of the BitField20:"
