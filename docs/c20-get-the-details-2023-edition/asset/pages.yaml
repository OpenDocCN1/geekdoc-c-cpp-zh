  md: "# #### An immediate function\n\n```\n~~~cpp\nconstexpr int sqr(int n) {\n \
    \   return n*n;\n}\nconstexpr int r = sqr(100);  // OK\n\nint x = 100;\nint r2\
    \ = sqr(x);             // Error\n~~~\n```\n\nThe final assignment gives an error\
    \ because x is not a constant expression and, therefore, sqr(x) cannot be performed\
    \ at compile time.\n\nconstinit ensures that the variable with static storage\
    \ duration or thread storage duration is initialized at compile time. Static storage\
    \ duration means that the object is allocated when the program begins and is deallocated\
    \ when the program ends. Thread storage duration means that the object's lifetime\
    \ is bound to the lifetime of the thread.\n\nconstinit ensures for this kind of\
    \ variable (static storage duration or thread storage duration) that they are\
    \ initialized at compile time. constinit does not imply constness.\n\n# ### 3.2.4\
    \ Template Improvements\n\nC++20 offers various improvements to programming with\
    \ templates. A generic constructor is a catch-all constructor because you can\
    \ invoke it with any type.\n\n# #### An implicit and explicit generic constructor\n\
    \n```\n~~~cpp\nstruct Implicit {\n    template <typename T>\n    Implicit(T t)\
    \ {\n        std::cout << t << '\\n';\n    }\n};\n\nstruct Explicit {\n    template\
    \ <typename T>\n    explicit Explicit(T t) {\n        std::cout << t << '\\n';\n\
    \    }\n};\n\nExplicit exp1 = \"implicit\";  // Error\nExplicit exp2{\"explicit\"\
    };\n~~~\n```"
