  md: "# Calendar Type and Literals\n\n| Type | Suffix | Example | Available since\
    \ |\n|---|---|---|---|\n| `std::chrono::day` | `d` | `5d` | C++20 |\n| `std::chrono::year`\
    \ | `y` | `5y` | C++20 |\n\n+   - The day literal represents a day of the month\
    \ and is unspecified if outside the range `[0, 255]`.\n+   - The year literal\
    \ represents a year in the [Gregorian calendar](https://en.wikipedia.org/wiki/Gregorian_calendar)\
    \ and is unspecified if outside the range `[-32767, 32767]`.\n\nThe following\
    \ program emphasizes the difference between `std::chrono::days` and `std::chrono::day`\
    \ and, accordingly, `std::chrono::years` and `std::chrono::year`.\n\n# The types\
    \ day/days and year/years\n\n```\n```cpp\n// dayDays.cpp\n\n#include <iostream>\n\
    #include <chrono>\n\nint main() {\n    std::cout << '\\n';\n\n    using namespace\
    \ std::chrono_literals;\n\n    std::chrono::days days1 = std::chrono::day(30)\
    \ - std::chrono::day(25);\n    std::chrono::days days2 = 30d - 25d;\n    if (days1\
    \ == days2 &&\n        days1 == std::chrono::days(5)) std::cout << \"Five days\\\
    n\";\n\n    std::chrono::years years1 = std::chrono::year(2021) - std::chrono::year(1998);\n\
    \    std::chrono::years years2 = 2021y - 1998y;\n    if (years1 == years2 &&\n\
    \        years1 == std::chrono::years(23)) std::cout << \"Twenty-three years\\\
    n\";\n\n    std::cout << '\\n';\n}\n```\n```\n\nWhen you subtract two objects\
    \ of type `std::chrono::day` (line 12), you get an object of type `std::chrono::days`.\
    \ The same holds for the `std::chrono::year` (lines 17) and `std::chrono::years`.\n\
    \n[^51]: https://en.wikipedia.org/wiki/Gregorian_calendar"
