- pgno: 659
  md: '# ### 10.29 Race Conditions


    A race condition is a situation in which the result of an operation depends on
    the interleaving (ordering of operations) of certain individual operations.


    Race conditions are quite difficult to see. Whether they occur depends on the
    interleaving of the threads. That means the number of your cores, your system''s
    utilization, or your executable''s optimization level may all be reasons why a
    race condition appears or does not.


    # ### 10.30 Regular Type


    In addition to the requirements of the concept `SemiRegular`, the concept `Regular`
    requires that the type is equally comparable.


    # ### 10.31 Scalar Type


    A scalar type is either an arithmetic type (see `std::is_arithmetic`¹⁹), an enum,
    a pointer, a member pointer, or a `std::nullptr_t`.


    # ### 10.32 SemiRegular


    A semiregular type `X` has to support the Big Six and has to be swappable: `swap(X&,
    X&)`


    # ### 10.33 Short-Circuit Evaluation


    Short circuit evaluation means that the evaluation of a logical expression automatically
    stops when its overall result is already determined.


    # ### 10.34 Standard-Layout Type


    A standard-layout type does not use features that are not available in C. All
    its members must have the same access specifier. User-defined special members
    are allowed. The following characteristic holds for standard layout types.


    A standard-layout type can only have


    +   * non-virtual functions or non-virtual base classes


    ¹⁹https://en.cppreference.com/w/cpp/types/is_arithmetic'
  merge: -1
  img_proc: true
- pgno: 660
  md: '+   - non-static data members with the same access specifiers

    +   - non-static members or bases classes that are standard layout

    +   - Meets one of these conditions:

    +     - no non-static data member in the most-derived class and no more than one
    base class with non-static data members, or

    +     - has no base classes with non-static data members


    A standard-layout Type is in contrast to a trivial type C compatible.


    # 10.35 Static Storage Duration


    Global (namespace) variables, static variables, or static class members have static
    storage duration. These objects are allocated when the program starts and are
    deallocated when the program ends.


    # 10.36 Spurious Wakeup


    A spurious wakeup is an erroneous notification. The waiting component of a condition
    variable or atomic flag can receive a notification, even though the notification
    component did not send the signal.


    # 10.37 The Big Four


    The Big Four are the four key features of C++20: concepts, modules, the ranges
    library, and coroutines.


    +   - **Concepts** change the way we think about and program with templates. They
    are semantic categories for template parameters. They enable you to express your
    intention directly in the type system. If something goes wrong, the compiler gives
    you a clear error message.

    +   - **Modules** overcome the restrictions of header files. They promise a lot.
    For example, the separation of header and source files becomes as obsolete as
    the preprocessor. In the end, we have faster build times and an easier way to
    build packages.

    +   - The new **ranges** library supports performing algorithms directly on the
    containers, composing algorithms with the pipe symbol, and applying algorithms
    lazily on infinite data streams.

    +   - Thanks to **coroutines**, asynchronous programming in C++ becomes mainstream.
    Coroutines are the basis for cooperative tasks, event loops, infinite data streams,
    or pipelines.'
