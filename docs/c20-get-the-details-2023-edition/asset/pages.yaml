- pgno: 630
  md: "# ## 8.2 Beyond C++23\n\n“Prediction is very difficult, especially if it’s\
    \ about the future.” (Niels Bohr²³). Consequently, you should read this chapter\
    \ as my best attempt to predict the C++ future.\n\nIt’s highly likely that the\
    \ four features reflection, pattern matching, and contracts are successively added\
    \ to the C++ standard, starting with C++26.\n\n# ### 8.2.1 Contracts\n\nContracts\
    \ were planned to be the fifth great feature of C++20. Because of design issues,\
    \ they were removed in the standardization committee meeting in July 2019 in Cologne.\
    \ At the same time, the study group 21 for contracts²⁴ was created.\n\n+   * What\
    \ is a Contract?\n\nA contract specifies in a precise and checkable way interfaces\
    \ for software components. These software components are typically functions and\
    \ member functions that have to fulfill preconditions, postconditions, or invariants.\
    \ Here are the simplified definitions of these three terms:\n\n+   * A **precondition**:\
    \ a predicate that is supposed to hold upon entry into a function\n+   * A **postcondition**:\
    \ a predicate that is supposed to hold upon exit from the function\n+   * An **assertion**:\
    \ a predicate that is supposed to hold at its point in the computation\n\nThe\
    \ precondition and the postcondition are placed outside the function definition,\
    \ but the invariant (assertion) is placed inside. A predicate is a function which\
    \ returns a boolean.\n\nHere is a first example:\n\n```\nThe function `push` uses\
    \ contracts\n\n```cpp\nint push(queue& q, int val)\n{\n    [[ expects: !q.full()\
    \ ]]\n    [[ ensures !q.empty() ]]\n    ...\n    [[ assert: q.is_ok() ]]\n   \
    \ ...\n}\n```\n```\n\nThe attribute `expects` is a precondition, the attribute\
    \ `ensures` a postcondition, and the attribute `assert` an assertion. The contracts\
    \ for the function `push` are that the queue is not full before adding an element,\
    \ that it is not empty after adding and the assertion `q.is_ok()` holds.\n\nPreconditions\
    \ and postconditions are part of the function interface. That means they can't\
    \ access local members of a function or private or protected members of a class.\
    \ Assertions, however, are part of the implementation and can, therefore, access\
    \ local members of a function of private or protected members of a class:"
