- pgno: 114
  md: '![](img/c60a87adb7f61e2e82071d081bbb389a_114_0.png)


    Preprocessors output


    WOW!!! The output of the preprocessing step has more than half a million bytes.
    I don’t want to blame GCC; the other compilers are similarly verbose. The output
    of the preprocessor is the input for the compiler.


    The result of this preprocessing step is the translation unit.


    # 4.2.2.2.1.2 Compilation


    The compilation is performed separately on each output of the preprocessor. The
    compiler parses the C++ source code and converts it into assembly code. The generated
    file is called an object file and contains the compiled code in binary form. The
    object file, which can build archives for later reuse, can refer to symbols that
    don’t have a definition. These archives are called static libraries.


    The object files that the compiler produces are the inputs for the linker.


    # 4.2.2.2.1.3 Linking


    The linker’s output is an executable or a static or shared library. The linker’s
    job is to resolve the references to undefined symbols. Symbols are defined in
    object files or libraries. The typical error in this phase is that symbols aren’t
    defined or are defined more than once.


    C++ inherited the build process from C. It works sufficiently well if you have
    only one translation unit. But when you have more than one, many issues can occur.


    # 4.2.2.2 Issues of the Build Process


    Here’s an incomplete list of the flaws in a classical build process. Modules solve
    these flaws.


    # 4.2.2.2.1 Repeated Substitution


    The preprocessor substitutes `#include` directives with the corresponding header
    files. Let me change my initial `helloWorld.cpp` program to make the repetition
    visible.


    I refactored the program and added two source files `hello.cpp` and `world.cpp`.
    The source file `hello.cpp` provides the function `hello`, and the source file
    `world.cpp` provides the function `world`. Both source files include the corresponding
    headers. Refactoring means the program has the same external behavior as the previous
    program, `helloWorld.cpp`, but the internal structure is improved.


    Here are the new files:


    +   - `hello.cpp` and `hello.h`'
