    # 5.6.4 Calendar Dates


    A new type of the chrono extension in C++20 is a calendar date. C++20 supports
    various ways to create a calendar date and interact with them. First of all: What
    is a calendar date?


    +   - A **calendar date** is a date that consists of a year, a month, and a day.
    Consequently, C++20 has a specific data type `std::chrono::year_month_day`. C++20
    has way more to offer. The following table should give you the overview of calendar
    types before I show you various use cases.'
