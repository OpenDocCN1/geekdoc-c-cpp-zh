  md: "a begin and an end iterator. Line 24 applies a `std::counted_iterator` and\
    \ a `std::default_sentinel`. Using a `std::counted_iterator` and end iterator\
    \ does not compile (line 19).\n\n# 5.1.2 Views\n\nViews are lightweight ranges.\
    \ A view does not own data, and its time complexity to copy, move, or assign is\
    \ constant. The containers of the STL and `std::ranges` are ranges but not views.\
    \ A view allows you to access ranges, iterate through ranges, or modify or filter\
    \ elements of a range.\n\n# 5.1.2.1 `std::ranges::view_interface`\n\nViews derive\
    \ from the class `std::ranges::view_interface<View>` which derives from the class\
    \ `std::ranges::view_base`.\n\n`std::ranges::view_interface` supports a few basic\
    \ operations:\n\n#### Operations of a `std::ranges::view_interface`  \n\n| Operation\
    \ | Requirement | Description |\n|---|---|---|\n| `v.empty()` | At least a forward\
    \ iterator | Returns if v is empty |\n| `if (v)` | At least a forward iterator\
    \ | Returns if v is not empty |\n| `v.size()` |  | Returns the number of elements\
    \ |\n| `v.front()` | At least a forward iterator | Returns the first element |\n\
    | `v.back()` | At least bidirectional iterator<br>begin and end have the same\
    \ type | Returns the last element |\n| `v[i]` | At least random-access iterator\
    \ | Returns the i-th element |\n| `v.data()` | Returns a raw pointer to the elements\
    \ | Elements are in contiguous memory |\n\nAs you may guess, a view is also a\
    \ concept. For a more detailed discussion about the concept view, read the chapter\
    \ on concepts: views.\n\n# 5.1.2.2 `std::ranges::subrange`\n\nThe class template\
    \ `std::ranges::subrange` combines an iterator and a sentinel into a single view.\
    \ Thanks to `std::ranges::subrange`, creating a view out of a begin iterator and\
    \ a sentinel is straightforward."
