    \  a1 < a2;\n}\n```\n```\n\nThe type `StrongWeakPartial` has subtypes supporting\
    \ strong (line 6), weak (line 10), and partial ordering (line 14). The common\
    \ comparison category for the type `StrongWeakPartial` (line 17) is, therefore,\
    \ `std::partial_ordering`. Using a more powerful comparison category, such as\
    \ strong ordering (line 29) or weak ordering (line 30), would result in a compile-time\
    \ error.\n\n# 4.3.3.1 Values of the Comparision Categories\n\nEach of the three\
    \ comparison categories `std::strong_ordering`, `std::weak_ordering`, and `std::partial_ordering`\
    \ has three values for denoting less, equal, or greater.\n\n# 4.3.3.1.1 `std::strong_ordering`\n\
    \n```\n```cpp\nstd::strong_ordering::less\nstd::strong_ordering::equal, or std::strong_ordering::equivalent\n\
    std::strong_ordering::greater\n```\n```\n\n# 4.3.3.1.2 `std::weak_ordering`\n\n\
    ```\n```cpp\nstd::weak_ordering::less\nstd::weak_ordering::equivalent\nstd::weak_ordering::greater\n\
    ```\n```\n\n# 4.3.3.1.3 `std::partial_ordering`"
