  md: '# ### 6.2.3.2 C++20 Extensions


    The following table shows the more powerful interface of `std::atomic_flag` in
    C++20.


    **All operations of `std::atomic_flag` atomicFlag**


    | Method | Description |

    |---|---|

    | `atomicFlag.clear()` | Clears the atomic flag. |

    | `atomicFlag.test_and_set()`<br>`atomicFlag.test()` (C++20) | Sets the atomic
    flag and returns the old value.<br>Returns the value of the flag. |

    | `atomicFlag.notify_one()` (C++20)<br>`atomicFlag.notify_all()` (C++20) | Notifies
    one thread waiting on the atomic flag.<br>Notifies all threads waiting on the
    atomic flag. |

    | `atomicFlag.wait(bo)` (C++20) | Blocks the thread until notified and the atomic
    value changes. |


    The call `atomicFlag.test()` returns the `atomicFlag` value without changing it.
    Further on, you can use `std::atomic_flag` for thread synchronization: `atomicFlag.wait()`,
    `atomicFlag.notify_one()`, and `atomicFlag.notify_all()`. The member functions
    `notify_one` or `notify_all` notify one or all of the waiting atomic flags. `atomicFlag.wait(bo)`
    needs a boolean `bo`. The call `atomicFlag.wait(bo)` blocks until the next notification
    or spurious wakeup. It checks when the value of `atomicFlag` is equal to `bo`
    and unblocks if not. The value `bo` serves as a predicate to protect against spurious
    wakeups. A spurious wakeup is an erroneous notification.


    Compared to C++11, the default construction of a `std::atomic_flag` is initialized
    to `false` state.


    The remaining more powerful atomics can provide their functionality by using a
    mutex. That is according to the C++ standard. So these atomics have a member function
    `is_lock_free` to check if the atomic internally uses a mutex. On the popular
    platforms, I always get the answer false. But you should be aware of that. Thanks
    to the constexpr function `atomic<T>::is_always_lock_free`, you can check any
    atomic type if it''s lock-free on each supported hardware that the executable
    might run on. This check returns only true if it is true for all supported hardware.
    The check is performed at compile-time and is available since C++17.


    # ### 6.2.3.3 One Time Synchronization of Threads


    Sender-receiver workflows are pretty common for threads. In such a workflow, the
    receiver is waiting for the sender''s notification before Future continues to
    work. There are various ways to implement these workflows. With C++11, you can
    use condition variables or promise/future pairs; with C++20, you can use `std::atomic_flag`.
    Each way has its pros and cons. Consequently, I want to compare them. I assume
    you don''t know the details of condition variables or promises and futures. Therefore,
    I give a short refresher.'
