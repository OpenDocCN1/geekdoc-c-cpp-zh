- pgno: 14
  md: '# # How should you read the Book?


    If you are not familiar with C++20, start at the very beginning with a quick overview
    to get the big picture.


    Once you get the big picture, you can proceed with the core language. The presentation
    of each feature should be self-contained, but reading the book from the beginning
    to the end would be the preferable way. On first reading, you can skip the features
    not mentioned in the quick overview chapter.


