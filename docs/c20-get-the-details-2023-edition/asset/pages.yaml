  md: '# ### 5.5.2.3.4 Type


    In general, the compiler deduces the type of the value used. But sometimes, you
    want to specify the type. These are the most important type specifications:


    +   - Strings: s

    +   - Integers:

    +     - b: binary format

    +     - B: same as b but base Prefix is 0B

    +     - d: decimal format

    +     - o: octal format

    +     - x: hexadecimal format

    +     - X: same as x, but base prefix is 0X

    +   - char and wchar_t:

    +     - b, B, d, o, x, X: such as integers

    +   - bool:

    +     - s: true or false

    +     - b, B, d, o, x, X: such as integers

    +   - Floating-point:

    +     - e: exponential format

    +     - E: same as e, but the exponent is written with E

    +     - f, F: fixed point; precision is 6

    +     - g, G: precision 6 but exponent is written with E

    +   - Pointer:

    +     - p: hexadecimal notation of its address


    Only void, const void, and std::nullptr_t pointer types are valid. If you want
    to display the address of an arbitrary pointer, you must cast it to (const) void*.


    Output of pointers


    ```

    ```cpp

    double d = 123.456789;


    std::format("{}", &d);                          // ERROR

    std::format("{}", static_cast<void*>(&d));      // okay

