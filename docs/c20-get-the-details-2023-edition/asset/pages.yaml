    \    atomic_shared_ptr<Node> head;\n    // in C++11: remove \"atomic_\" and remember\
    \ to use the special\n    // functions every time you touch the variable\n   \
    \ concurrent_stack(concurrent_stack &) =delete;\n    void operator=(concurrent_stack&)\
    \ =delete;\n\npublic:\n    concurrent_stack() =default;\n    ~concurrent_stack()\
    \ =default;\n    class reference {\n        shared_ptr<Node> p;\n    public:\n\
    \        reference(shared_ptr<Node> p_) : p{p_} { }\n        T& operator* () {\
    \ return p->t; }\n        T* operator->() { return &p->t; }\n    };\n\n    auto\
    \ find( T t ) const {\n        auto p = head.load();  // in C++11: atomic_load(&head)\n\
    \        while( p && p->t != t )\n            p = p->next;\n        return reference(move(p));\n\
    \    }\n    auto front() const {\n        return reference(head); // in C++11:\
    \ atomic_load(&head)\n    }\n    void push_front( T t ) {\n        auto p = make_shared<Node>();\n\
