- pgno: 249
  md: "# Operations of a `std::ranges::subrange`\n\n| Operation | Requirement | Description\
    \ |\n|---|---|---|\n| `sub.next(n = 1)` |  | Returns a subrange starting with\
    \ the n-th element |\n| `sub.prev(n = 1)` |  | Returns a subrange starting with\
    \ the n-th element before the first element |\n| `sub.advance(n)` |  | Returns\
    \ a subrange starting n-th elements later (n-th elements earlier if n < 0) |\n\
    | `auto[beg, end] = sub` |  | Creates beg and end with begin and end of sub |\n\
    \nThe concept of a view is strongly related range adaptors.\n\n# 5.1.3 Range Adaptors\n\
    \nA range adaptor transforms a range into a view.\n\nThe following code snippet\
    \ shows range adaptors operating on a range.\n\n```\nRange adaptors operating\
    \ on a range\n\n```cpp\nstd::vector<int> numbers = {1, 2, 3, 4, 5, 6};\n\nauto\
    \ results = numbers | std::views::filter([](int n){ return n % 2 == 0; })\n  \
    \                    | std::views::transform([](int n){ return n * 2; });\n```\n\
    ```\n\nIn this code snippet, numbers is the range, and range adaptors `std::views::filter`\
    \ and `std::views::transform` create the views. Additionally, `std::string_view`²\
    \ and `std::span` are also views.\n\nThanks to range adaptors, C++20 allows programming\
    \ in a functional style. Range adaptors can be combined, and the resulting views\
    \ are lazy. I already presented two range adaptors, but C++20 offers more."
