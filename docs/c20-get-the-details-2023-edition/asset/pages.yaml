- pgno: 314
  md: '# 5.3 Container and Algorithm Improvements


    ![](img/c60a87adb7f61e2e82071d081bbb389a_314_0.png)


    C++20 has many improvements regarding containers of the Standard Template Library.
    First, `std::vector` and `std::string` have constexpr constructors and can be
    used at compile time. All containers support consistent container erasure and
    the associative containers a member function contains. Thanks to the new algorithms
    `std::shift_left` and `std::shift_right`, you can shift the content of a container.
    Additionally, `std::string` allows you to check for a prefix or suffix. The execution
    policy `std::execution::unseq` permits the vectorized execution of an algorithm.


    # 5.3.1 constexpr Containers and Algorithms


    C++20 supports the constexpr containers `std::vector` and `std::string`, where
    constexpr means that the member functions of both containers can be applied at
    compile time. Additionally, more than 100 algorithms^26 of the Standard Template
    Library are declared as constexpr.


    Consequently, you can sort a `std::vector` of ints at compile time.'
  merge: -1
