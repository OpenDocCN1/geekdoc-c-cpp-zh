  md: "# ## About the Numbers\n\nI made my performance test at the end of 2020 with\
    \ the brand new Visual Studio compiler 19.28 because it already supported synchronization\
    \ with atomics (`std::atomic_flag` and `std::atomic`) and semaphores. Additionally,\
    \ I compiled the examples with maximum optimization (`/Ox`). The performance number\
    \ should only give a rough idea of the relative performance of the various ways\
    \ to synchronize threads. If you want to have the exact number on your platform,\
    \ you have to repeat the tests.\n\nLet me start the comparison with C++11.\n\n\
    # ### 7.5.1 Condition Variables\n\nMultiple time synchronization with a condition\
    \ variable\n\n```\n```cpp\n1  // pingPongConditionVariable.cpp\n2  \n3  #include\
    \ <condition_variable>\n4  #include <iostream>\n5  #include <atomic>\n6  #include\
    \ <thread>\n7  \n8  bool dataReady{false};\n9  \n10  std::mutex mutex_;\n11  std::condition_variable\
    \ condVar1;\n12  std::condition_variable condVar2;\n13  \n14  std::atomic<int>\
    \ counter{};\n15  constexpr int countLimit = 1'000'000;\n16  \n17  void ping()\
    \ {\n18  \n19      while(counter <= countLimit) {\n20          {\n21         \
    \     std::unique_lock<std::mutex> lck(mutex_);\n22              condVar1.wait(lck,\
    \ []{return dataReady == false;});\n23              dataReady = true;\n24    \
    \      }\n25          ++counter;\n26          condVar2.notify_one();\n27     \
    \ }\n28  }\n29  \n30  void pong() {\n```\n```"
