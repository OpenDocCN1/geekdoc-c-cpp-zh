  md: '![](img/c60a87adb7f61e2e82071d081bbb389a_543_0.png)


    *Synchronized access of std::cout*


    With C++20, writing synchronized to `std::cout` is a piece of cake. `std::basic_syncbuf`
    is a wrapper for a `std::basic_streambuf`⁴¹. It accumulates output in its buffer.
    The wrapper sets its content to the wrapped buffer when it is destructed. Consequently,
    the content appears as a contiguous sequence of characters, and no interleaving
    of characters can happen.


    Thanks to `std::basic_osyncstream`, you can directly write synchronously to `std::cout`.


    C++20 defines two specializations of `std::basic_osyncstream` for `char` and `wchar_t`.


    ⁴¹https://en.cppreference.com/w/cpp/io/basic_streambuf'
