  md: "# ### 4.1.7.2.4 Comparison Concepts\n\n+   * `std::equality_comparable`\n+\
    \   * `std::totally_ordered`\n\nMaybe you know it from your mathematics studies.\
    \ For values a, b, and c of type T, T models std::totally_ordered if and only\
    \ if\n\n+   * Exactly one of bool(a < b), bool(a > b), or bool(a == b) is true\n\
    +   * If bool(a < b) and bool(b < c), then bool(a < c)\n+   * bool(a > b) == bool(b\
    \ < a)\n+   * bool(a <= b) == !bool(b < a)\n+   * bool(a >= b) == !bool(b < a)\n\
    \n# ### 4.1.7.2.5 Object Concepts\n\n+   * `std::movable`\n+   * `std::copyable`\n\
    +   * `std::semiregular`\n+   * `std::regular`\n\nHere are the concise definitions\
    \ of the four concepts:\n\n```\n```cpp\ntemplate<class T>\nconcept movable = is_object_v<T>\
    \ && move_constructible<T> &&\n                  assignable_from<T&, T> && swappable<T>;\n\
    \ntemplate<class T>\nconcept copyable = copy_constructible<T> && movable<T> &&\n\
    \                   assignable_from<T&, T&> &&\n                   assignable_from<T&,\
    \ const T&> && assignable_from<T&, const T>;\n\ntemplate<class T>\nconcept semiregular\
    \ = copyable<T> && default_initializable<T>;\n\ntemplate<class T>\nconcept regular\
    \ = semiregular<T> && equality_comparable<T>;\n```\n```\n\nI have to add a few\
    \ words. The concept std::movable requires for T that std::is_object_v<T> holds.\
    \ From the definition of the type-trait std::is_object_v<T>, this means that T\
    \ is either a scalar, an array, a union, or a class.\n\nI implement the concept\
    \ semiregular and regular in the section define concepts. Informally, a semiregular\
    \ type behaves similarly to an int, and a regular type behaves similarly to an\
    \ int and can be compared using ==."
