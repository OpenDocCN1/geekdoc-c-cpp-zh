- pgno: 407
  md: '# The time-zone data types


    | Type | Description |

    |---|---|

    | `std::chrono::zoned_traits` | Class for time zone pointers |

    | `std::chrono::zoned_time` | Represents a time zone and a time point |

    | `std::chrono::leap_second` | Contains information about a leap-second insertion
    |

    | `std::chrono::time_zone_link` | Represents an alternative name for a time zone
    |

    | `std::chrono::nonexistent_local_time` | Exception which is thrown if a local
    time does not exist |


    The use of the time zone database requires an operating system. Consequently,
    using the time zone database on a freestanding system typically results in an
    exception. The time-zone database is updated during the operating system’s update,
    such as a reboot. When your system supports updating the [IANA time-zone database](https://www.iana.org/time-zones)
    without rebooting, you can use `std::chrono::reload_tzdb()`. The new database
    is atomically added to the front of the linked list. Calls such as `std::chrono::get_tzdb_list()`
    or `std::chrono::get_tzdb()` parse the front of the list. Consequently, the database
    queries get the updated database entries, and `std::chrono::get_tzdb().version`
    returns the version of the used database.


    The two elementary types for time zones are `std::chrono::time_zone` and `std::chrono::zoned_time`.


    The possible time zones are predefined by the [IANA time-zone database](https://www.iana.org/time-zones).
    The calls `std::chrono::current_zone()` and `std::chrono::locate_zone(name)` return
    a pointer to the current or R named requested time zone. The call `std::chrono::locate_zone(name)`
    causes a search for name in the database. If the search is unsuccessful, you get
    a `std::runtime_error` exception.


    `std::chrono::zoned_time()` represents a time zone combined with a time point.
    You can use a system time point, or a local time point as time point. A system
    time point uses `std::chrono::system_clock` and a local time point uses the pseudo
    clock `std::chrono::local_t`.


    My first example is straightforward. It displays the UTC time and the local time.


    # 5.6.5.1 UTC Time and Local Time


    The [UTC time or Coordinated Universal Time](https://www.iana.org/time-zones)
    is the primary time standard worldwide. A computer uses [Unix time](https://www.iana.org/time-zones),
    a very close approximation of UTC. The UNIX time is the number of seconds since
    the Unix epoch. The Unix epoch is 00:00:00 UTC on 1 January 1970.


    `std::chrono::system_clock::now()` returns in the program localTime.cpp the Unix
    time.'
