  md: "# 4.1.4.1 Four Ways to use a Concept\n\nI apply the predefined concept `std::integral`\
    \ in the program `conceptsIntegralVariations.cpp` in all four ways.\n\n# Four\
    \ variations using the concept `std::integral`\n\n```\n```cpp\n// conceptsIntegralVariations.cpp\n\
    \n#include <concepts>\n#include <iostream>\n\ntemplate<typename T>\nrequires std::integral<T>\n\
    auto gcd(T a, T b) {\n    if( b == 0 ) return a;\n    else return gcd(b, a % b);\n\
    }\n\ntemplate<typename T>\nauto gcd1(T a, T b) requires std::integral<T> {\n \
    \   if( b == 0 ) return a;\n    else return gcd1(b, a % b);\n}\n\ntemplate<std::integral\
    \ T>\nauto gcd2(T a, T b) {\n    if( b == 0 ) return a;\n    else return gcd2(b,\
    \ a % b);\n}\n\nauto gcd3(std::integral auto a, std::integral auto b) {\n    if(\
    \ b == 0 ) return a;\n    else return gcd3(b, a % b);\n}\n\nint main(){\n\n  \
    \  std::cout << '\\n';\n\n    std::cout << \"gcd(100, 10)= \" << gcd(100, 10)\
    \ << '\\n';\n    std::cout << \"gcd1(100, 10)= \" << gcd1(100, 10) << '\\n';\n\
    \    std::cout << \"gcd2(100, 10)= \" << gcd2(100, 10) << '\\n';\n    std::cout\
    \ << \"gcd3(100, 10)= \" << gcd3(100, 10) << '\\n';\n\n    std::cout << '\\n';\n\
    }\n```\n```"
