  md: "In C++20, you can use unconstrained placeholders (auto) or constrained placeholders\
    \ (concepts) in function declarations to automatically get function templates.\
    \ The rule for applying is as simple as it can be: Any place where you can use\
    \ an unconstrained placeholder auto, you can use a concept. I will explain this\
    \ in detail in the section on abbreviated function templates.\n\n# 4.1.5.2 Placeholders\n\
    \nUse of constrained placeholders instead of unconstrained placeholders\n\n```\n\
    ```cpp\n// placeholders.cpp\n\n#include <concepts>\n#include <iostream>\n#include\
    \ <vector>\n\nstd::integral auto getIntegral(int val){\n    return val;\n}\n\n\
    int main(){\n\n    std::cout << std::boolalpha << '\\n';\n\n    std::vector<int>\
    \ vec{1, 2, 3, 4, 5};\n    for (std::integral auto i: vec) std::cout << i << \"\
    \ \";\n    std::cout << '\\n';\n\n    std::integral auto b = true;\n    std::cout\
    \ << b << '\\n';\n\n    std::integral auto integ = getIntegral(10);\n    std::cout\
    \ << integ << '\\n';\n\n    auto integ1 = getIntegral(10);\n    std::cout << integ1\
    \ << '\\n';\n\n    std::cout << '\\n';\n\n}\n```\n```\n\nThe concept std::integral\
    \ can be used as a return type (line 7), in a range-based for loop (line 16),\
    \ or as a type for variable b (line 19), or variable integ (line 22). To see the\
    \ symmetry between auto and concepts, line 25 uses auto alone instead of std::integral\
    \ auto, which is used on line 22. Hence, integ1 can accept a value of any type."
