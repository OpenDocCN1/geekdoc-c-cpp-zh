  md: "![](img/c60a87adb7f61e2e82071d081bbb389a_62_0.png)\n\n# Avoid Compile-Time\
    \ Predicates in Requires Clauses\n\nWhen you constrain template parameters or\
    \ function templates using concepts, you should use named concepts or combinations\
    \ of them. Concepts are meant to be semantic categories, but not syntactic constraints\
    \ like `i <= 20`. Giving concepts a name enables their reuse.\n\n# 4.1.4.3 Concepts\
    \ as Return Type of a Function\n\nHere are the definitions of the function template\
    \ gcd and the function gcd1 using concepts as return types.\n\n# Using a concept\
    \ as return type\n\n```\n```cpp\ntemplate<typename T>\nrequires std::integral<T>\n\
    std::integral auto gcd(T a, T b) {\n    if( b == 0 ) return a;\n    else return\
    \ gcd(b, a % b);\n}\n\nstd::integral auto gcd1(std::integral auto a, std::integral\
    \ auto b) {\n    if( b == 0 ) return a;\n    else return gcd1(b, a % b);\n}\n\
    ```\n```\n\n# 4.1.4.4 Use-Cases for Concepts\n\nFirst and foremost, concepts are\
    \ compile-time predicates. A compile-time predicate is a function that is executed\
    \ at compile time and returns a boolean. Before I dive into the various use cases\
    \ of concepts, I want to demystify concepts and present them simply as functions\
    \ returning a boolean at compile time.\n\n# 4.1.4.4.1 Compile-Time Predicates\n\
    \nA concept can be used in a control structure, which is executed at run time\
    \ or compile time."
