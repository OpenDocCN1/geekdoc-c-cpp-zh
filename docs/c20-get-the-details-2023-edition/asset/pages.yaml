  md: "# Operations on the calendar types\n\n| Calendar Type | ++/-- | +/- | difference\
    \ | ==/!= | <=> |\n|---|---|---|---|---|---|\n| `std::chrono::year_month` |  |\
    \ months, years | yes | yes | yes |\n| `std::chrono::year_month_day` |  | months,\
    \ years |  | yes | yes |\n| `std::chrono::year_month_day_last` |  | months, years\
    \ |  | yes | yes |\n| `std::chrono::year_month_weekday` |  | months, years | \
    \ | yes |  |\n| `std::chrono::year_month_weekday_last` |  | months, years |  |\
    \ yes |  |\n\nThe increment and decrement operations<sup>52</sup>++/-- are supported\
    \ in the prefix and postfix version. Adding the subtraction +/- requires objects\
    \ of type `std::chrono::duration` as arguments. You can calculate the difference\
    \ of two objects having the same calendar type. The result is a object of type\
    \ `std::chrono::duration`. That means when you build the difference of two objects\
    \ of calendar type `std::chrono::day` you get an object of type `std::chrono::days`.\
    \ <=> is the new three-way comparison operator.\n\nThe following program uses\
    \ the operations on the calendar types.\n\n# Operations on calendar types\n\n\
    ```\n```cpp\n// calendarOperations.cpp\n\n#include <chrono>\n#include <iostream>\n\
    \nint main() {\n\n    std::cout << '\\n';\n\n    using std::chrono::Monday;\n\
    \    using std::chrono::Saturday;\n\n    using std::chrono::March;\n    using\
    \ std::chrono::June;\n    using std::chrono::July;\n\n    using std::chrono::days;\n\
    \    using std::chrono::months;\n    using std::chrono::years;\n\n    using std::chrono::last;\n\
    \n    using namespace std::chrono_literals;\n\n    std::cout << std::boolalpha;\n\
    ```\n```\n\n<sup>52</sup> https://en.cppreference.com/w/cpp/language/operator_incdec"
