    Non-synchronized writing to std::cout


    ![](img/c60a87adb7f61e2e82071d081bbb389a_540_1.png)


    # std::cout is thread-safe


    The C++11 standard guarantees that you need not protect std::cout. Each character
    is written atomically. More output statements like those in the example may interleave.
    This interleaving is only a visual issue; the program is well-defined. This remark
    is valid for all global stream objects. Insertion to and extraction from global
    stream objects (std::cout, std::cin, std::cerr, and std::clog) is thread safe.
    To put it more formally: writing to std::cout is not participating in a data race,
    but does create a race condition. This means that the output depends on the interleaving
    of threads.


    How can we solve this issue? With C++11, the answer is straightforward: use a
    lock such as lock_.'
