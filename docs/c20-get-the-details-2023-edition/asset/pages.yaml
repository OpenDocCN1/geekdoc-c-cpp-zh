    In the next two sections, I will demonstrate various ways of defining concepts.


    # #### 4.1.8.1 A Logical Combination of other Concepts and Compile-Time Predicates


    You can combine concepts and compile-time predicates using conjunctions (&&) and
    disjunctions (||). You can negate components using the exclamation mark (!). Evaluation
    of this logical combination of concepts and compile-time predicates obeys short-circuit
    evaluation²⁰. Short circuit evaluation means that the evaluation of a logical
    expression automatically stops when its overall result is already determined.


    Thanks to the many compile-time predicates of the type-traits library²¹, you have
    all tools required to build powerful concepts at your disposal.


