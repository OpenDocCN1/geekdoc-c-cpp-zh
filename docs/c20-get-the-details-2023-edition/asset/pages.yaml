  md: "# 5.2.2.3 Conversion\n\nstd::span does not support implicit conversions applied\
    \ to the underlying elements. It only supports conversions by adding an additional\
    \ qualifier to them. When you use a std::span with static or dynamic extent to\
    \ initialize a std::span with static extent, the size must fit.\n\nConversion\
    \ of std::span's with static and dynamic extent\n\n```\n```cpp\n// conversionSpans.cpp\n\
    \n#include <array>\n#include <list>\n#include <vector>\n#include <span>\n\nint\
    \ main() {\n\n    std::vector<int> myVec{1, 2, 3, 4, 5};\n\n    // conversion\
    \ of underlying elements\n\n    std::span<int> sp1{myVec};\n    std::span<const\
    \ int> sp2{myVec};\n    std::span<int, 5> sp3{myVec};\n    std::span<const int,\
    \ 5> sp4{sp3};\n    // std::span<int> sp5{sp2};    // compile-time error\n   \
    \ // std::span<long> sp6{sp1};   // compile-time error\n\n    // static extent\
    \ => dynamic extent\n\n    std::span<int, 5> sp11{myVec};\n    std::span<int>\
    \ sp12{myVec};\n\n    // dynamic extent => static extent\n\n    std::span<int,\
    \ 5> sp21{sp12};\n    std::span<int, 6> sp22{sp12};    // undefined behavior\n\
    \n    // static extent => static extent\n\n    // std::span<int, 6> sp31{sp21};\
    \  // compile-time error\n    // std::span<int, 4> sp32{sp22};  // compile-time\
    \ error\n\n}\n```\n```\n\nYou can initialize a std::span with const underlying\
    \ elements with a std::span with non-const"
