- pgno: 16
  md: '# About the Authors


    Drs. Edna Reiter and Clayton Matthew Johnson are faculty in the Department of
    Mathematics and Computer Science at California State University, East Bay (CSUEB)
    in the San Francisco Bay area. Together, they developed the subject matter of
    the CSUEB course Computation and Complexity, required for all students in the
    Master of Science program. The course covers the hard problems of computer science—those
    that are intractable or undecidable. The text and the exercises in the text have
    been tested on multiple sections of CSUEB students.


    Edna E. Reiter, Ph.D., received M.S. degrees from the University of Michigan and
    the University of California at Davis, and a Ph.D. from the University of Cincinnati.
    Her initial research interests were in noncommutative ring theory, but she then
    became interested in the theoretical aspects of computer science. Dr. Reiter has
    discovered that she enjoys introducing students to these subjects. She is currently
    Chair of the Department of Mathematics and Computer Science at CSUEB.


    Clayton Matthew Johnson, Ph.D., received an M.S. degree from Michigan State University,
    and holds a Ph.D. from the College of William and Mary in Virginia. His current
    research interests are genetic algorithms and machine learning. He teaches many
    of the core courses for both graduate and undergraduate students including data
    structures, automata theory, analysis of algorithms and complexity. Dr. Johnson
    is the graduate coordinator for all M.S. students at CSUEB; he is also the incoming
    Chair of the Department of Mathematics and Computer Science.'
  merge: -1
