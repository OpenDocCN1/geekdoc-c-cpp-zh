  md: '# Set Theory


    STUDENTS WILL HAVE SEEN set theory before and thus, the following is a brief review.
    Some important ideas, though, may be new and will be covered in more detail.


    # 1.1 SETS—BASIC TERMS


    # Definition 1.1


    A set is a collection of objects.


    # Definition 1.2


    A member or element is an object in a set. A set is said to contain its elements.


    Elements in a set are listed in braces.


    # Examples


    ```

    $S_1 = \{1, 2, 3, 4\}$

    ```


    ```

    $S_2 = \{a, b, c\}$

    ```


    ```

    $S_3 = \{♠, ♢, ♥, ♣\}$

    ```'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2 Limits of Computation


    Repetition does not matter in a set and ordering means nothing, {a, b, c} = {b,
    a, c, b}.

    ellipses can be used in set notation once a pattern of membership has been established.


    # Examples


    ```

    $S_4 = {1, 2, 3, ..., 99, 100}$

    ```


    ```

    $S_5 = {1, 2, 3, ...}$

    ```


    ```

    $S_6 = {..., -3, -2, -1}$

    ```


    ```

    $S_7 = {..., -2, -1, 0, 1, 2, ...}$

    ```


    Sets can also be described using Peano''s notation.


    ```

    $S = {x | x satisfies some condition}$

    ```


    # Examples


    {x | x = y^2 and y is an integer} {squares}


    {x | x = 2y and y is an integer} {even numbers}


    There must always be an underlying universal set U, either specifically stated
    or implicit. Some common universal sets include:


    +   N = {0, 1, 2, 3, ...} (natural or counting numbers)


    +   Z = {..., -2, --1, 0, 1, 2, ...} (integers)


    +   Z+ = {1, 2, 3, ...} (positive integers)


    +   Z- = {..., -3, -2, -1} (negative integers)


    +   Q = {x : x = m/n, m, n are integers, n ≠ 0} (rational numbers)


    +   R = real numbers'
  merge: -1
  img_proc: true
