    # Theorem 10.5


    If any NP-complete problem is also in co-NP, then NP = co-NP.


    # Proof


    Assume some NP-complete problem Z is also in co-NP. This means (1) for any X in
    NP, X ≤p, Z, and (2) Z is also in NP.


    First, to show NP ⊆ co-NP, assume that X is in NP. But, X ≤p Z so X ≤p Z (why?).
    Now X is polynomially reducible to an element of NP, so X is also in NP. Then,
    of course, X is in co-NP.


    One must also show that co-NP ⊆ NP; the proof is very similar and leaves as an
    exercise.


