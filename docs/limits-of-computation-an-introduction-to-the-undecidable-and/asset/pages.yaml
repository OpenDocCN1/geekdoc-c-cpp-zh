    The formal definition for a two-tape Turing machine is:


    # Definition 5.5


    A two-tape Turing machine M = $(\Sigma, \Gamma, Q, q_{accept}, q_{reject}, q_{start},
    \delta)$ differs from the definition of an ordinary Turing machine only in the
    delta function, which maps a state, a symbol from tape 1, and a symbol from tape
    2; writes new symbols to two tapes; and moves the two heads left or right (unless
    it also has a stay option).


    ```

    \delta: Q - \{q_{accept}, q_{reject}\} \times \Gamma \times \Gamma \rightarrow
    Q \times \Gamma \times \Gamma \times \{Left, Right\} \times \{Left, Right\}

    ```


    The convention is that the machine begins with the input written on the first
    tape in the usual way, and the second tape begins blank.


    **Note:** For many uses of multitape Turing machines, the stay option is very
    convenient—so that one head can remain in place while another head moves. Thus,
    we will generally assume a delta function of the form


    ```

    \delta: Q - \{q_{accept}, q_{reject}\} \times \Gamma \times \Gamma \rightarrow
    Q \times \Gamma \times \Gamma \times \{Left, Right, Stay\} \times \{Left, Right,
    Stay\}

    ```


    To see how this is, think of a simple example as $L = \{strings\ of 0''s and 1''s\}$
    that the number of zeros is equal to the number of ones. This can be done on one
    tape by moving back and forth, crossing out a zero and a one on each, and finding
    if all characters are crossed out on the same pass. With three tapes, (1) move
    across the input once, copying each zero to tape 2 and each one to tape 3. Then
    (2) pass back across these two tapes, checking that heads on tape 2 and tape 3
    hit the blank at the same time, so that the count of 0s must have equaled the
    count of 1s. Or, to accept the language of palindromes, $\{w | w = w^R\}$, simply
    copy the input to tape 2 and run two heads, one forward across the string and
    the other backward, checking that the symbols match (Figure 5.3).


    Another machine is shown in Figure 5.4 for the language $0^n10^n$. This is an
    interesting machine because it would be much easier to write if one assumed a
    stay option for the multitape Turing machine. See Exercises 6 and 7 at the end
    of the chapter.'
