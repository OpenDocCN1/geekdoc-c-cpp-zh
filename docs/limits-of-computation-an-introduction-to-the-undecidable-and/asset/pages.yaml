  md: '# Turing Machines


    # 4.1 OVERVIEW


    Theoretical computer science needs a model of a computer—a perfect machine, not
    dependent on electricity, chip design, or anything that might have a flaw. This
    model could run programs in a high-level language such as C++, Java, or Python—but
    usually be much simpler than that. What is needed is a simple machine such that
    if a problem can be solved on this machine, then it can be solved on a PC, a supercomputer,
    or whatever—and vice versa. Moreover, one would also want that a solution “in
    reasonable time” on a standard computer would be possible if and only if (iff)
    it could be done in reasonable time on the model machine.


    There have been several different models proposed—some very related, some that
    do not look like machines at all, but rather are similar to an abstract branch
    of mathematics. The most useful and widely used model is the one proposed by the
    English mathematician and code breaker Alan Turing.


    The purpose of this chapter is the exploration of this model (in several different
    flavors), and to explore the idea that some problems are not solvable all on any
    variety of computer.


    # 4.2 THE TURING MACHINE MODEL


    Informally, a Turing machine is a device with a very, very large memory (so large
    that no problem can ever exhaust it) and a means to read and write to that memory—that
    is, to act on its storage locations in some very precisely defined manner.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 62 Limits of Computation


    Machine tape


    ![](img/d80067a1fcf4f931f840f447fc7d1650_83_0.png)


    FIGURE 4.1 Sample Turing machine. the only question is yes/no, whether or not


    For decision problems, the only question is yes/no, whether or not a certain string
    is in a language or not. The job of the Turing machine is simply to take an input
    string and determine whether the answer is yes or no.


    It does this by following a scheme where it looks at memory locations, one at
    a time, possibly changing the contents, and moving to the next location either
    or back (right or left). Its set of instructions tells it what to do when reading
    a certain symbol on its tape.


    We think of a Turing machine, then, as an infinitely long tape containing symbols,
    with a read/write head sitting over one of these symbols. This read/write head
    is connected to the Turing machine control, which keeps track of which state it
    is in and gives instructions to the read/write head. A diagram of a sample Turing
    machine showing the tape, the read/write head, and the control is shown in Figure
    4.1.


    # 4.3 FORMAL DEFINITION OF TURING MACHINE


    Definition 4.1


    A Turing machine M = (Σ, Γ, Q, q_accept, q_reject, q_start, δ) in which:


    +   * Σ is the input alphabet with blank B ∉ Σ.

    * Γ is the tape alphabet with B ∈ Γ and Σ ⊂ Γ.

    * Q is a set of finite states.

    * q_accept ∈ Q is the unique accept state.'
