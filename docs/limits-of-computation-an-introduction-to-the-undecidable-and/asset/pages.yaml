    as a deciding Turing machine. Thus, the contradiction must be in the existence
    of the de-deciding Turing machine $M_{ACCEPT}$.


    The important point here is that $ACCEPT_{TM}$ is not decidable; however, it is
    Turing *acceptable* (by the universal Turing machine).


    The above proof, with its contradiction, only works for deciding Turing machines.
    If not all strings end up in $q_{accept}$ and $q_{reject}$ there is no contradiction
    interchanging these states. The strings that did not end up in either one still
    not. What gives the contradiction is that since we are assuming a deciding TM,
    $M_R$ on $M_R$ has only the choice of $q_{accept}$ and $q_{reject}$ and both of
    these are impossible.


    # Corollary 6.3


    $ACCEPT_{TM}$ is not accepted by any Turing machine.'
