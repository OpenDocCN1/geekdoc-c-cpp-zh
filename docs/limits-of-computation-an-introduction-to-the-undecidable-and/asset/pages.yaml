    $P_1 \le P_2$


    so that answering $P_2$ will give answers to both $P_1$ and $P_2$. Intuitively,
    $P_2$ is harder than $P_1$ (or more correctly, $P_2$ is at least as hard as $P_1$,
    or $P_2$ is as hard or harder than $P_1$).


    Here, because we are also concerned with the length of time—polynomial whatever—we
    must assume that mapping is of reasonable length. If the mapping took too long
    to compute, a fast solution to $P_2$ would not necessarily be a fast solution
    to $P_1$.


    Thus, we will put a restriction on the definition of reducibility, so that solving
    the second problem not only solves the first, but fast solutions to the second
    are also fast to the first.


    # Definition 8.5 (Definition 7.2 Restated)


    A problem $P_1$ is polynomially reducible to a problem $P_2$ if there is a mapping
    $f$ from the domain of all instances of $P_1$ into the set of instances of $P_2$.


    +   1. If $A$ is a yes instance of $P_1$, then $f(A)$ is a yes instance of $P_2$.

    2. If $A$ is no instance of $P_1$, then $f(A)$ is a no instance of $P_2$.

    3. For any yes/no instance $A$ of $P_1$, $f(A)$ can be computed in polynomial
    time (polynomial, as usual, in the size of the input).


    One can rephrase the second requirement as 2'': If $f(A)$ is a yes instance of
    $P_2$, then $A$ was a yes instance of $P_1$.

    write:


    $P_1 \le_p P_2$


    The means (more formally) that if the length of the encoding of $A$ is $|A|$,
    then there is a polynomial $p$ of degree $n$ such that the number of steps to
    compute $f(A)$ is bounded by $p(|A|)$.


    Sometimes, this mapping is trivial. For example, if $P_1$ is a subset of $P_2$,
    then we can just use the identity mapping. This makes sense; restricted restricted
    problems are easier (or at least no harder) than their generalizations.'
