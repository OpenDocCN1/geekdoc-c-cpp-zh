  md: 'instructions for a supercomputer, then it can emulate any program on the supercomputer—perhaps
    taking much longer, but time and efficiency are not part of the definition of
    equivalent computing power.


    Several different changes are proposed to the Turing machine model below. All
    of these modifications are shown to be Turing-complete.


    # 5.1.1 Semi-Infinite Tape


    Many authors use a model of a Turing machine that has a semi-infinite (or one-way
    infinite) tape—the tape has a left end, but no right end. The machine starts in
    Start, with the input placed on the leftmost portion of its tape and with the
    read/write head positioned on the first tape location.


    The disadvantage of this model is that one must have some convention to deal with
    a transition function that acts for a move when the head is on the left end of
    the tape. Various conventions work—that the head falls off the left end of the
    tape and enters a hanging state from which it can never recover, a move when the
    left is implemented as remaining on the left so that the head does not move, or
    other possibilities. For various formal definitions of semi-infinite Turing machines,
    see Hopcroft et al. (2007), Lewis and Papadimitriou (1997), Sipser (2006), and
    others.


    Having a left end to the tape also makes awkward to return to the left end of
    the input. Finding the right end is easy—simply move to the first blank, and then
    move to the one position. Finding the end is similarly easy if the tape is two-way
    infinite; there is always a blank to the left of the input, but it is much more
    difficult with a semi-infinite tape.


    The two-way tape seems to allow simpler constructions and simpler combinations
    of moves. However, it does not add additional power.


    # Theorem 5.2


    Any standard Turing machine M with two-way infinite tape can be emulated by a
    Turing machine M’ with semi-infinite tape, and vice versa. Thus, the semi-infinite
    tape model of a Turing machine is Turing-complete.


