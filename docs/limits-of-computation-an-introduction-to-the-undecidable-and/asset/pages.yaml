  md: '![](img/d80067a1fcf4f931f840f447fc7d1650_146_0.png)


    FIGURE 6.13 Deciding Turing machine $M_{ACCEPT}$ for ACCEPT (and two modifications).


    One more transformation is in order—accepting and rejecting states. Call this
    machine $M_{REVISED}$ or $M_R$ for short.


    Now, when we use self-reference (that is, sending $M_R$ into $M_R$), we get a
