    # 5.2 TURING MACHINES TO EVALUATE A FUNCTION


    In this course, Turing machines are used to answer decision problems. However,
    there are other kinds of Turing machines that can be developed.


    If $f$ is any function from strings to strings (and this is any computational
    problem that can be imagined), then a Turing machine $M$ calculates (or computes)
    the function $f$ if it starts with the input $(x_1, \dots, x_n)$ on its tape,
    and ends (in some specially designated state $q_{done}$) with $f(x_1, \dots, x_n)$
    on the tape. This kind of Turing machine is sometimes called a transducer. A simple
    example would be a machine to add the numbers n and m, written in decimal.


    Addition Turing machine transducer:


    +   Start: $q_{start}$ n#m


    +   Finish: $q_{done}$, n + m


    # 5.3 ENUMERATING TURING MACHINES


    A Turing machine enumerates a language $L$ if it has a special state $q_{found\_one}$.
    An enumerating TM takes no input. It starts with an empty tape, and lists the
    strings in $L$, one by one. Each time it writes a string from $L$ onto its output
    tape, it announces it has found one by entering the special state $q_{found\_one}$.
    It can erase the tape and work on producing another string from $L$. Eventually,
    every string in $L$ must be enumerated (although not in any particular order).


