    # 8.8.2 Proof Part II: Construction in Polynomial Time and Correctness


    +   1. Polynomial time: Each group of clauses consists of a polynomial number
    of polynomial clauses. Thus, putting these together with ∧ to make a Boolean clause
    in conjunctive normal form, we get a long—but still polynomially bounded—clause.


    +   2. Yes goes to yes: If the Turing machine accepts the string, then there is
    a path—a sequence of configurations—from the start state to accept it. That sequence
    will guide how to set the Boolean variables—at each step t, set them to match
    the configuration and the moves used. Now, the clause will be satisfied.


