    # Definition 7.2


    A decision problem $P_1$ is polynomially reducible to decision problem $P_2$,
    written $P_1 \leq_p P_2$, if there is a mapping $f$ from possible instances (yes
    or no) of $P_1$ to possible instances of $P_2$, such that:


    +   1. For any yes/no instance X of $P_1$, $f(X)$ can be computed by a Turing
    machine (transducer) in time bounded by a polynomial $p(|X|), |X|$ = length of
    the input.

    2. If X is a yes instance of $P_1$, then $f(X)$ is a yes instance of $P_2$.

    3. If X is no instance of $P_1$, then $f(X)$ is a no instance of $P_2$.


    The only difference between definitions 7.1 and 7.2 is the addition of the restriction
    that the function can be computed in polynomial time.


