    # 5.1.3 Multiple Tapes


    It is convenient to have multiple tapes. By convention, a k-tape Turing machine
    starts with its input on the first tape, and the first head on the first character
    of the input. The other tapes all begin as blank tapes.


    A move of this Turing machine now takes a state, a k-tuple of characters under
    the k-heads. It writes a character on each of the k-tapes, and moves each of the
    heads left or right. One can choose any k that is convenient for the problem—often
    three tapes allow enough flexibility. A sample three-tape Turing machine with
    input $\sigma_1\sigma_2\sigma_3\sigma_4\sigma_5\sigma_6\dots$ is shown in Figure
    5.2.


