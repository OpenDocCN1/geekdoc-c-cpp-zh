    # 6.5 CONSTRUCTION OF THE UNDECIDABLE LANGUAGE ACCEPT_{TM}


    Now we know undecidable languages exist (by counting arguments), but we have not
    yet produced an example. We have shown that there are uncountably many languages
    and only countably decidable languages (since countably many Turing machines means
    uncountable number of undecidable languages, should it be easy to actually display
    one? Well, not quite. Essentially any description of a language that you are likely
    to come up with have a deciding Turing machine. We want to produce an undecidable
    language.


    This will be done by constructing a language that is not decided. This is essentially
    the same proof (by contradiction) as the proofs that writing "Hello World" or
    detecting infinite loops are not decidable.


    Let ACCEPT_{TM} = {M, w: M is the encoding of a Turing machine, w is the encoding
    of a string, and M accepts w}


    # Theorem 6.2


    The language ACCEPT_{TM} is not decided by any Turing machine.


    # Proof


    By contradiction, suppose ACCEPT_{TM} is decided by a Turing machine M_{ACCEPT}.
    That is, M_{ACCEPT} takes an encoded Turing machine M and string w goes to q_{accept}
    exactly when M accepts w; otherwise, it will terminate in q_{reject}. Of course,
    it terminates in one or the other since it is a deciding TM. This is shown in
    the first part of Figure 6.13.


    Now, we modify M_{ACCEPT} so that it takes machines as input—that is, its input
    is an encoded machine M. M_{ACCEPT} will tell if the machine M accepts its own
    description.'
