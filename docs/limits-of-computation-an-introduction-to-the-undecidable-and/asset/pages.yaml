  md: '# Classes NP and NP-Complete


    8.1 THE CLASS NP (NONDETERMINISTIC POLYNOMIAL)


    Most of the problems met in the standard computer science curriculum are in the
    class P, defined in Chapter 3 (see Definition 3.6), of problems that have polynomial
    solutions. One spends a lot of time in classes in data structures and algorithms
    analysis considering whether an algorithm is of order n², n³, Ln in n, and so
    on. You might note that one often deals with *search* problems—not—and in this
    class, we are dealing with *decision* problems—not “What is the shortest path?”
    but “Is there a path from A to B shorter than L?”


    Now, we introduce a class of problems, NP, which (almost certainly—more about
    this later) do not have polynomial solutions.


    You should be asking yourself while you read this chapter:


    +   Do I understand what makes a problem belong to the class NP? Can I show that
    a problem is in NP?


    +   What kinds of problems are not in NP?


    +   What problems are *not* in NP? Do I know if they are not in NP?


    +   If I were given the task of writing an algorithm for a problem in NP, what
    are my options?


    8.2 DEFINITION OF P AND NP


    Recall the definition of P—those decision problems that are easy to solve.'
