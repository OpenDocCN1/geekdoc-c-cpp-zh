    \ state $q_{reject}$ is in all respects the counterpart of $q_{accept}$. The Turing\
    \ machine enters this state after it has determined that the input string is not\
    \ a member of its language, and then stops processing.\n\nAs with the accept state,\
    \ $q_{reject}$ must be a unique element of the machine’s state set. This means\
    \ $q_{accept}$ and $q_{reject}$ are distinct, as the Turing machine cannot answer\
    \ the same question with both yes and no answer.\n\n# 4.3.6 Start State\n\nThe\
