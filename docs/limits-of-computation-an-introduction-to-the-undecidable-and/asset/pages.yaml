  md: '# # Algorithms


    # 3.1 COMPUTATIONAL PROBLEMS


    A text with the word computation in the title will clearly need to describe what
    is meant by a computation. This is both easy (in one sense) and hard (in others).


    # ## Definition 3.1


    A computational problem specifies a relation between two sets of finite sequences
    (or two sets of strings).


    Recall that a finite sequence is a finite ordered list of elements from a set.
    For example, an integer is a finite sequence of digits (so that 921,233,456,181
    is a sequence of length 15 as written, but the commas could be omitted, which
    would make it a sequence of length 12). An English word is a finite sequence of
    letters. An array of integers can be considered a finite sequence of integers—this
    is the usual interpretation in an algorithms analysis class—or as a finite sequence
    of digits with separators.


    (23, 512, 312, 987, 45, 641) is a sequence of six integers


    or

    23,512,312,987,45,641 is a sequence of 21 characters from

    0 to 9 and commas.'
