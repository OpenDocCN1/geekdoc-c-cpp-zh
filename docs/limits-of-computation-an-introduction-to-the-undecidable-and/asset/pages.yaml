    There is no one answer here. But, armed with what you know, you can find much
    more information on your particular problem. As has been said elsewhere, forewarned
    is forearmed.


    # 10.14 SUMMARY


    The most important classes for us have been the undecidable and intractable classes.
    This is because it is crucial that anyone in computer science must realize that
    not all problems, even not all easily stated problems, have any solution or any
    reasonable solution.


    There are many other interesting classes of problems.

    The entire text could be summarized in a diagram of the sets involved. Note that
    in Figure 10.2, it is assumed that both (1) P ≠ NP and (2) NP ≠ co-NP. A good
    exercise would be to redraw the diagram assuming that (a) P ≠ NP but NP = co-NP,
    and that for (b) P = NP.'
