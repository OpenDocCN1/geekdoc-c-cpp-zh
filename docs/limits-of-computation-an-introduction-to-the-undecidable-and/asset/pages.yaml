- pgno: 59
  md: 'there were only a finite number of possible instances, the question could be
    answered by a simple table lookup, and would not be interesting.


    Chess is something of an aberration—there are only a finite number of board configurations,
    and for each board configuration, only a finite number of possible moves. However,
    except for some near-end-game configurations with only a few pieces left on the
    board, the number of possible moves and countermoves is so large that no solution
    has been found. But because of the finiteness, standard 8 by 8 chess does not
    fit into the problems considered in this course.


    Computational problems can always—with varying degrees of difficulty—be restated
    as decision problems. Certainly, a solution to the general problem solves the
    decision problem, but the reverse is also true. A machine powerful to answer the
    decision problem can—perhaps with some effort—do the path finding, prime generation,
    or addition (by restatements as those above). In formal language and computation
    theory, we will not lose any generality ourselves by restricting decision problems,
    and we will state all problems as language membership questions.


