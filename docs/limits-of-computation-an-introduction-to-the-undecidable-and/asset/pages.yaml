    # 8.5 COMPLETNESS


    Another definition is in order—one that applies to this class of problems, but
    also to any other class C.

    This will give us a formal definition for what it means to be the hardest kind
    of a problem in C—to be at least as hard as any other problem in the class.


    # Definition 8.11


    A problem Y is “complete for the class C” or **C-complete** if:


    +   1. Y is in the class C.

    2. For any problem X in C, $X \le_p Y$.


    # Definition 8.12


    A problem Y is **C-hard** if for any problem X in C, $X \le_p Y$.


    Thus, any C-complete problem is also C-hard. A problem can be hard without being
    in the appropriate class. A problem might be C-hard without even being decidable.

    These definitions of *hard* and *complete* do not work well for the class **P**
    of decision problems with polynomial solvers. Using these definitions, every nontrivial
    decision problem in **P** would be **P-hard** and **P-complete**'
