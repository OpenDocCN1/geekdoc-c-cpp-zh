    GRAPH 1:


    Hamiltonian Circuit: $v_1, v_6, v_7, v_5, v_4, v_3, v_2$ (and others)

    Hamiltonian Path: $v_1, v_6, v_7, v_4, v_3, v_2$ (and others)


    GRAPH 2:


    Hamiltonian Circuit: None

    Hamiltonian Path: $v_1, v_6, v_7, v_4, v_3$ (and others)


    Figure 9.2 Examples of Hamiltonian circuits and paths.


    A path is a circuit if the first and last nodes are the same. In $G_1, (v_3, v_5,
    v_0, v_2, v_3)$ is a circuit. **A Hamiltonian circuit** (in a directed or undirected
    graph) is a circuit that visits every vertex in the graph exactly once. **A Hamiltonian
    path** is a path from some vertex $v$, to a different vertex $v$, that visits
    all other vertices on route. See Figure 9.2 for examples.


    Note that both graphs in Figure 9.2 are connected; there can never be a Hamiltonian
    circuit or a Hamiltonian path unless the graph is connected.


    We need to consider the encoding of a graph $|G|$, since to show something is
    in **NP**, we will have to know the length of the encoding and find a certificate
    that is polynomial in this length $|G|$.


    There are at least three (but course related) standard ways to encode $G$, whether
