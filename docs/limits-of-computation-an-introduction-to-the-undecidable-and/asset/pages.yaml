    Clearly, the set V'' = V is a vertex cover of size |V| for any graph G. Also clearly,
    no graph (except the graph with no edges) can have a vertex cover of size 0. For
    other numbers m between 1 and |V| - 2, a graph may or not have a vertex cover
    of size m.


    Finding vertex covers and determining whether they exist for a given m is easy
    for small graphs. However, imagine a graph with 100 vertices and thousands of
    edges. Does it have a vertex cover of, for example, 50? Perhaps yes, perhaps no,
    but there are a lot of possible vertex covers to try (100!/(50!50!) to be exact),
    and for each of these possible covers, a lot of edges need to be checked.


    The Vertex Cover (VC) problem is the decision problem: Given a graph G = (V, E)
    and a number 0 k < |V|, does G have a vertex cover of size k?


    # Theorem 9.7


    The VC problem is NP-complete.


    # Proof


    +   1. Vertex cover is in NP. The certificate c is the list of m vertices that
    form the vertex cover, that is, it is the set V''. It is important that we do
    not have to find a certificate: we are given the list, and all we do is to check
    or verify that it is indeed a cover.

    VERTEX-COVER-VERIFY (G, m, c) =

    Check that each element of c is an element of V in G. If not, reject.

    Check that each element of c is distinct. If not, reject.

    Check that |c| < m (of course, if |c| = m, we can easily find the vertex cover
    of size m).

    Check the vertices of c form a vertex cover for G. If yes, accept.

    The first three steps are simple to compute in a polynomial time. For each of
    the edges (and there are fewer than n² edges), the last step of the verifier goes
    through the list of m < n vertices in the certificate, checking that one end of
    the edge is in c. Since there are at most n² to check and each requiring a list
    of length < n, the last step is bounded by O(n³).

