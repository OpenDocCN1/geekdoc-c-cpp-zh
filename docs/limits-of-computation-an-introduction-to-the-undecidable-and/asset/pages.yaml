    The upper right quadrant (II) is constructed by cross-indexing each variable class.
    If the positive literal x, appears in class Ci, we place a 1 in the corresponding
    (k + j)th column for x; otherwise, the digit is 0. If the negative literal ¬x,
    appears in class Ci, we place a 1 in the corresponding (k + j)th column for ¬x;
    otherwise, the value is 0. Thus, each partial row in II may have any number of
    1s since x, or ¬x, can appear in any of classes. Each partial column in II can
    have one (if the three-clause is x v x), twos (one repeated literal), or threes
    (three distinct literals).


    For example, the literal x, occurs in Ci in the Boolean expression above, so the
    column for 1 in the upper right quadrant is set to 1; x does not appear in C2
    or C3, so a 0 is placed in columns 2 and 3. The literal ¬x occurs in C+, so the
    column for 3 in the upper right quadrant is set to 1; ¬x does not appear in Ci,
    or C+, and so a 0 is placed in the columns for clauses 1 and 2. This is shown
    in Figure 9.24.


    The lower right quadrant (III) adds a pair of numbers 10^{i-1} for each class
    Ci. These numbers serve as a reserve, so that we have the option of adding these
