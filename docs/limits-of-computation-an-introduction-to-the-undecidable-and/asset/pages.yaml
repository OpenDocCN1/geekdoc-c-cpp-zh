    ```

    00122 \rightarrow ababbaba \quad h(00122) = ababbaba

    110 \rightarrow ab \quad h(110) = ab

    202 \rightarrow baabba \quad h(202) = baabba

    \varepsilon \rightarrow \varepsilon \quad h(\varepsilon) = \varepsilon$

    ```


    # Definition 2.6


    **The shuffle** of strings $v$ and $w$ is a set of strings of the form $v_{i_1}w_{j_1}v_{i_2}w_{j_2}
    \dots v_{i_n}w_{j_n}$, where $n \geq 1$ and $v = v_1, \dots, v_n$ and $w = w_1,
    \dots, w_n$. The $v_i$ and $w_j$ are substrings of $v$ and $w$.


    Because some of the substrings are $\varepsilon$, this does not mean the two strings
    are the same length or that characters alternate. It does mean the symbols of
    $v$ and $w$ both appear in order in any string in their shuffle.


    For example, if $v = 000$ and $w = 11111, 011010110$ is in the shuffle of strings
    $v$ and $w$. And if $v = 01$ and $w = 110$, then $10110$ is in the shuffle of
    $v$ and $w$. (Exercise: List other strings in the shuffle.) Note that for $v=01$
    and $w = 110$, all strings in the shuffle of $v$ and $w$ have two $0$''s and three
    $1$''s—but not strings with two $0$''s and three $1$''s are in shuffle$(v,w)$;
    for $00111$ is not (why?).


    Shuffles are not the only interesting operations on strings and languages. One
    can take halves (or last halves, or thirds) of strings, cycle the characters in
    a string, and more. However, none of these operations have much general use. And
    if you think that shuffle is weird and of not much general use, you may be correct—generally,
    operations such as concatenation and reversal are of much more use (and simpler
    to understand).


    # 2.3 OPERATIONS ON LANGUAGES


    Languages are sets, so course all the usual set operations are available on two
    languages $L_1$ and $L_2$: **union** $(L_1 \cup L_2)$, **intersection** $(L_1
    \cap L_2)$, **difference** $(L_1 - L_2)$, and **complement** $(L_1$ or $L_1^*)$.'
