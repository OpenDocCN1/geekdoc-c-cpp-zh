    members of the class NP and depending on the definition of NP-completeness. Instead,
    all these proofs use polynomial reducibility.


    Recall to show that Y is NP-complete, show that:


    +   1. Y is in NP.

    2. X ⩽ Y, for some known NP-complete problem X (to begin with, there is no choice,
    X is conjunctive normal form satisfiability {CNF-SAT}).


    # 9.2 REDUCTIONS TO PROVE NP-COMPLETENESS


    These proofs of polynomial reducibility vary in difficulty from the very easy
    to the very hard. Garey and Johnson (1979) classify these proofs into three kinds.'
