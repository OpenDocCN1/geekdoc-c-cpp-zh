    # 9.2.2 Local Replacement


    In a proof of this kind, one takes reasonably subparts of the known NP-complete
    problem, and transforms each subpar into a piece of the new problem. The term
    *gadget* is often used for the pieces constructed by this transformation.


    # **Theorem 9.2**


    3-CNF-SAT (Boolean satisfiability in which each clause in conjunctive normal form
    has three terms, not necessarily distinct) is **NP-complete.


    # **Proof**


    Using local replacement we can take each clause of a yes or no instance in CNF-SAT,
    and transform that clause into a group of clauses, each of which has three terms.
    The original set of clauses is satisfiable if and only if the transformed set
    of clauses is also satisfiable.


    The conversion will depend on the length of k to be converted. For ≤ 3, the method
    is straightforward.


    If k = 1, repeat the term three times; so (xi) becomes (xi ∨ xi ∨ xi).'
