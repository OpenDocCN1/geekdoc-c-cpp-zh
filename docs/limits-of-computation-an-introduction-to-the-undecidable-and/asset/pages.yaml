- pgno: 55
  md: '# 34 Limits of Computation


    The domain of a computational problem is a set of data (the *questions*) called
    the input. The range is a set of *answers* called the output. A computational
    problem, then describes how questions are related to answers.


    For example, students in computer science are frequently asked to arrange data
    in ascending order. This is known as the *Sorting Problem* and is defined as follows.


    # Example: Sorting Problem


    Input: $(i_1, i_2, ..., i_n)$, where $(o_1, o_2, ..., o_n)$ is a permutation of
    $(i_1, i_2, ..., i_n)$ such that $o_1 \leq o_2 \leq ... \leq o_n$


    One solution to the sorting problem is the bubble sort algorithm, which correctly
    maps inputs (questions) to outputs (answers).


    # Definition 3.2


    An **instance** of a computational problem is one particular element from the
    input set. A **solution of an instance** is the corresponding element from the
    output set as specified by the computational problem.


    For example, the (5, 4, 2, 3, 1) of the sorting problem has the solution (1, 2,
    3, 4, 5), whereas the instance (20, 40, 20, 20, 60, 60, 80, 40, 20) has the solution
    (20, 20, 20, 20, 40, 60, 60, 80).


    Note that there are several possible solutions to these instances! It does not
    matter, for example, which of the four twenty elements (20, 40, 20, 60, 20, 80,
    40, 20) we permute into the first position of the output sequence as long as we
    place one of them at that location. There are in many (4! 2!) different solutions
    to this!


    There is nothing in the statement of the sorting problem that places a limit on
    the number of elements that an instance may have. In other words, the sorting
    problem can take any number of arguments. This means, for example, the empty sequence
    () is a valid instance. It also means that an instance could be phenomenally,
    staggering. An instance cannot, however, be infinite. There must be some final
    element $i_n$ of an instance, as—by definition—a computational problem only describes
    a relation between *finite* sequences.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Algorithms ■ 35\n\nThere are, however, an infinite number of both instances\
    \ and solutions to the sorting problem. This distinction is important. Although\
    \ each instance and each solution to every computational problem must be finite,\
    \ there may be infinitely many instances.\n\nConsider another familiar problem\
    \ from introductory computer science—searching.\n\n# Example: Searching Problem\n\
    \nInput: $(k, i_1, i_2, \\dots, i_n)$\nOutput: $(o)$, where $o = TRUE$ if $\\\
    exists j [i_j = k]$; $o = FALSE$ otherwise\nAlternate output: $(n)$, where $n\
    \ = j$ if $\\exists j [i_j = k \text{ and } m < j, i_m \neq k]$; $n = -1$ otherwise\n\
    \nThe input to this computational problem might seem a bit confusing at first.\
    \ In the first case, the input sequence contains a key $k$ followed by a list\
    \ of elements $i_1, i_2, \\dots, i_n$. The output of the searching problem is\
    \ $TRUE$ if it exists in this list, or $FALSE$ if it does not.\n\nJust as the\
    \ sorting problem, there is no upper limit to the number of elements $i$ that\
    \ might appear in the input sequence—just as long as this number is finite. The\
    \ empty sequence (), however, is not a valid instance of the searching problem,\
    \ as a key $k$ must always be the first element of every input sequence.\n\nNote\
    \ that even though there are only two possible solutions to the searching problem,\
    \ there are still an infinite number of instances, and therefore an infinite number\
    \ of question–answer pairings.\n\n# Example: Integer Addition Problem\n\nInput:\
    \ $(d_1 d_2 \\dots d_n, c_1 c_2 \\dots c_m)$, where $d_i$ and $c_i$ are digits\
    \ with base 10\nOutput: $(b_1 b_2 \\dots b_r)$, where this is the proper sum of\
    \ the two integers\n\nOne valid input instance would be (10,341, 79,855); its\
    \ solution would be (90,196).\n\nThe problem of real addition is not a computational\
    \ problem—there is no way to specify a pair of arbitrary real numbers (or even\
    \ a single number) as a finite sequence."
