    EXPTIME, or simply EXP.


    # Facts


    NP ⊆ EXP


    This was proved above; use transformation from NDTM to TM.


    PSPACE ⊆ EXP


    This follows directly as corollary to Theorem 10.8.


    To reiterate the important point, time and space are related.


    P (poly time) ⊆ PSPACE (poly space) ⊆ EXP (exp time)


    There is no easy way to find a problem in EXP but proved not in NP or PSPACE.
    Most problems are produced by diagonalization arguments, so the problem produced
    is not natural and is easy to describe. The proof that a particular problem is
    not in either of these classes is really difficult: one that no algorithm can
    ever be found that will run in polynomial space. There have been problems (such
    as combinatorial game problems) that have been proved complete for EXP, and thus
    are the hardest problems in EXP. These'
