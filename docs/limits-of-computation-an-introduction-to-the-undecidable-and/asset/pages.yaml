    to analyze an algorithm. And what do we mean by an efficient algorithm?

    Analysis could mean many things. Efficiency could mean that it runs quickly, or
    that it does not use much memory, or even that it is easily modified by a programming
    maintenance team. The standard measure of efficiency is running time, but even
    here, do we mean best running time? Average case? Worst case? And on what computer
    or model?


    The standard approach is to count the number of steps (operations) necessary to
    solve an input with size n = |I| in the worst case with input size. Note that
    counting in the number of steps, it is automatically assumed that all steps require
    the same amount of time—division by 713191 is almost certainly more expensive
    than multiplication by 2—however, only by a constant factor. Constant factors
    do not affect rates of growth—it is more important than an (n ln) algorithm is
    better than an n³ algorithm might be better than a 5311n² algorithm. In fact,
    because the 3n² and 6311n² algorithms have the same polynomial order, they will
    be in sense considered the same size. Although 6311n² is more than 2000 times
    large as 3n², they grow faster than n term for size when n is large. One grows
    faster than the other, but constantly. On the other hand, n³ grows much faster
    than n². And the function 2 grows much faster than either.

    We will say that n³ and 10,000n³ have the same rate of growth since they differ
    only by a constant.


    # 3.8 DEFINITIONS


