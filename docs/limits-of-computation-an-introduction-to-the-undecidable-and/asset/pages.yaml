    # 5.4 THE CHURCH–TURING THESIS


    There have been models of what computation means. Programs written in any one
    of the programming languages are some of these models, but the idea of computation
    goes back to well before the existence of computers and computer languages. The
    question goes back to Leibniz, and what was one of the important problems of the
    early 20th century (David Hilbert made several references to it). But it was only
    about 1930 that the problem was sufficiently precise to be answered. Two logicians/mathematicians
    first answered this question were Alonzo Church and Alan Turing.


    Alonzo Church was an American mathematician at Princeton. He developed the model
    of computation called lambda calculus. Alan Turing was a British mathematician.
    He is well known for his codebreaking work during World War II at Bletchley Park.
    But he also wrote (1936) a paper, “On Computable Numbers, with an Application
    to the Entscheidungsproblem.” The Entscheidungsproblem is the problem of finding
    an algorithm for deciding whether a proposition in first-order logic is always
    true.


    The work of Church and Turing showed that there is no algorithm to solve the Entscheidungsproblem.
    Part of the work in doing this requires the formalization: What is an algorithm?
    Church used lambda calculus, Turing used Turing machines (not his name for them).
    It was easily shown that these two characterizations of algorithms (Church’s and
    Turing’s) are equivalent.'
