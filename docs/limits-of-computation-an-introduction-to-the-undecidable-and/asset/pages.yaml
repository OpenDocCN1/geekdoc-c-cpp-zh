  md: 'Set membership is indicated by the $\in$ symbol, and set exclusion (is not
    a member) by $

    otin$.


    # Examples


    $a \in \{a, b, c\}$


    $d \notin \{a, b, c\}$


    # Definition 1.3


    The set A is a subset of set B, denoted $A \subseteq B$, if and only if (iff)
    every member of A is also a member of B.


    # Example


    {a}, {b, c}, and {c, b, a} are some of the subsets of {a, b, c}.


    # Definition 1.4


    The empty set, denoted $\varnothing$, is the set {}. It contains no elements.


    # Definition 1.5


    The set A is a proper subset of set B iff every member of A is also a member of
    B and $A \neq B$, denoted $A \subset B$.


    # Example


    {a}, {b, c} are some proper subsets of {a, b, c}.


    The empty set is a subset of every set, and a proper subset of every set except
    itself.


    # Definition 1.6


    The standard set operations are union, intersection, difference, and complement.
    They are defined as:'
