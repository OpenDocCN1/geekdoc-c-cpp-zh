    is true, there seems to be a good short way to show that all rows are false without
    actually constructing the rows.


    Thus, by definition, CNF-SAT is in co-NP. But it seems not to be in NP. Notice,
    proving that problem is not in NP is nontrivial. One would have to prove that
    no polynomial certificate exists, and nondeterministic proofs are often difficult
    (usually assuming existence and getting a contradiction).


    Or, consider the complement of the Hamiltonian circuit, HC = {G | there is no
    way to make a Hamiltonian circuit through G}. One way to check that a graph is
    in HC would be to try all possible circuits; no easier way is readily apparent.
    HC is also in co-NP, but almost certainly is not in NP.


