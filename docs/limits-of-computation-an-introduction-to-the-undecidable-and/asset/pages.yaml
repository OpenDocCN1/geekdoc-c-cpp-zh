  md: 'The certificate includes the prime factorization of $n$, followed by certificates
    that each of the given factors is prime. Note that there are at most $\lg n =
    O(s)$ prime factors, since each is at least 2 and they multiply to $n$. To verify
    a certificate, we check that all the given factors multiply to $n$, and we check
    that all the given factors are prime using the primality certificates at the end
    (however they work). We verify that $n$ is perfect by determining whether the
    sum of all factors (including $n$) is $2n$, which we can do using the technique
    outlined in the hint, which involves at most $\lg n$ additions and $\lg^2 n$ multiplications.


    **Hint (for Exercise 16):** Given $n$ and $k$, one decision problem asks whether
    $n$ has factors greater than or equal to $k$, aside from $n$ itself. Given a polynomial
    time algorithm for this, we can find a factor of $n$ by performing a binary search
    to find the smallest value of $k$ We can find the other factor by dividing $n$
    by $k$. If $n$ is written in $s = O(\log n)$ bits, and the algorithm for the decision
    problem takes $O(n^d)$ time, then it will take us $O(\log n) = O(s)$ calls to
    find the first factor using binary search, taking so we have $O(s^{d+1})$ time,
    plus the time to do division, which is of course polynomial.'
