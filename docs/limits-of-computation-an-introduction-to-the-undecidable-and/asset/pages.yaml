    # 2. OPERATIONS ON STRINGS


    There are many operations that can be done on strings—simple one, others more
    complicated.


    The **reversal** of a string $w = \sigma_1\sigma_2 \dots \sigma_n$ (written $w^R$)
    is obtained by placing its characters in the opposite order, $w^R = \sigma_n\sigma_{n-1}
    \dots \sigma_1$. Note that the lengths are the same, $|w| = |w^R|$.


    # Examples


    $(abc)^R = cbba$


    $(00111)^R = 11100$


    $(abba)^R = abba$


    $\varepsilon^R = \varepsilon$


    The **concatenation** of two strings $u = \sigma_1\sigma_2 \dots \sigma_n$ and
    $v = \tau_1\tau_2 \dots \tau_m$ (write $uv$, $u v$, or sometimes as $u \times
    v$) is the string obtained by appending $v$ onto the end of $u$, as $\sigma_1\sigma_2
    \dots \sigma_n\tau_1\tau_2 \dots \tau_m$.


    The length $|uv| = |u| + |v|$.


    # Examples


    Consider the following strings over $\Sigma = \{0, 1\}:


    $w = 000$'
