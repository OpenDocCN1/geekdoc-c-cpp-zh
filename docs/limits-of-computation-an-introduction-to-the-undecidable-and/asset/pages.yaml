    10.1 INTRODUCTION

    In this chapter, we will look at interesting questions and classes that come out
    of the ideas in the previous chapters. Are there other complexity classes? The
    answer is yes, that there are entire hierarchies of classes, although most are
    not naturally defined as P and NP. We will consider some of the most important
    of these classes.


    How do these relate to what has already been discussed? In many cases, we will
    be able to show some interesting relationships. But are there any subset relations
    known to be proper subsets? If so, which? What natural questions are still unanswered?


    Are there distinctions between or among the members of the class of NP-complete
    problems? Are there any subclasses of NP except the classes P and NP-complete?
    Are all NP-complete problems of the same difficulty? In one sense, since of course
    any NP-complete problem is polynom reducible to any other NP-complete problem.
    However, some might be considered to be harder than others. A few owe their difficulty
    to aspects of the problem that disappear when certain limits are set on the input.


