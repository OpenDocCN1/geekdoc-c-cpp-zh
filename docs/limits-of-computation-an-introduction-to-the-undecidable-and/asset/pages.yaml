- pgno: 18
  md: '# Introduction


    ALGORITHM: WHAT IS IT, WHEN DOES ONE EXIST?

    Most of the computer science courses in the first several years of a student''s
    experience are concerned with teaching algorithms, and getting students to implement
    them, and so on. The student of computer science spends many hours in many courses
    learning how to write programs to solve problems. She learns about sorting data,
    saving data in various data structures, maintaining databases, managing networks,
    creating graphics, and more. She learns algorithms for supporting an operating
    system, maintaining data purity, parsing source files, and so on. The question
    of unsolvable problems may not even appear—the instructor, the text, and the student
    are too busy learning the efficient algorithms that are in use.


    Even the word algorithm is often used without a good definition—and expressing
    that definition will be a major theme of this text, one that cannot be answered
    in just a few paragraphs.


    # IMPORTANT QUESTIONS


    Only in a few places the computer science student study such questions: What is
    computation? What is an algorithm? How do I know this problem has a solution?
    If there is a solution, will it answer the problem fast enough? An answer in the
    next century is no better than no answer at all.


    Any “educated” computer scientist needs to know about the answers to these questions.
    There are many easy-to-state questions in computer science that either have no
    algorithm at all, or have no practical algorithm. These include:'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    +   - Given a context-free grammar G, is it ambiguous?


    +   - What is the shortest route for a salesman to take, starting at his home,
    visiting all the cities on his route?


    +   - Given a program written by another computer science student, will this program
    terminate? Or will it go into an infinite loop?


    +   - Given a set of processes running on a system, will they end in deadlock?


    These questions have intrigued computer scientists and others. Some popular books
    address some of the same questions as this—see Hofstadter (1979) and Penrose (1991).
    Some questions have monetary prizes for any-one who can solve them (see Devlin,
    2002).


    # DOES MY PROBLEM HAVE A SOLUTION?

    A GOOD SOLUTION?


    The computer scientist should be aware—of questions like these, and if told to
    write code to solve problem X, it would be nice to know that X has a solution
    and that this solution will not require centuries or millennium to execute.


    Questions to consider before beginning: Is there a known algorithm for this problem?
    Or, are algorithms that work, but take too long? A problem that used to be difficult,
    but now has become easier, is the forecasting of weather. Weather (like many physical
    systems) obeys a complicated set of differential equations, and it can be forecast
    by getting initial data points—the current weather—and solving these equations.
    However, if it takes longer to solve the equations than for weather to happen,
    these forecasts are not useful. It does not do much to have the forecast for Tuesday
    on the following Wednesday. Problems like this one generated research in methods
    for solving differential equations, and considerable progress has been made.


    But what problems are like this—solvable with good methods? Are there any problems
    that are difficult and not that we can expect ever to have good solutions?


    Of course, if one needs a solution to a problem that has no solution—or no reasonable
    solution—then here too, some knowledge is useful. It is not necessary to give
    up and say, “Can’t be done.” Knowing the difficulties (and the options around
    them) is the first step.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   * What is an algorithm?

    * What is a computation?

    * What is a computer?

    * When does an algorithm exist?

    * When do reasonable algorithms exist?

    * What is meant by reasonable?


    FIGURE 1.1 Questions for this course.


    In short, an educated computer scientist needs more than tools of programming.
    He or she needs to understand what is possible to program—which is the topic of
    this book.


    # THE “BIG” IDEAS


    The two big questions that this book deals with are:


    +   * Which problems have no algorithm at all (and what does that mean)?


    +   * Which problems cannot be solved efficiently (and what does that mean)?


    Answering these questions—and even having the machinery to properly pose them
    as questions—will take some time and effort.

    This can be summarized in Figure I.1.'
  merge: -1
