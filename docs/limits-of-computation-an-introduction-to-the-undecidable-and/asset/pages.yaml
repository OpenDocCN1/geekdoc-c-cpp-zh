    # 9.10 SUMMARY AND REPRISE


    We have seen a variety of NP-complete problems from areas of logic, graph theory,
    and number theory. There seems to be little of making blanket categorizations,
    except that NP-complete problems involve finding a solution from an exponential
    number of possibilities, and for these problems, no good shortcuts have been found.'
