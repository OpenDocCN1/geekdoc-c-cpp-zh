    unreasonable—computer memories are bounded but very large (especially if one considers
    CDs, DVDs, USB drives, tape drives, and other external memory as part of memory).
    There is a bound on the largest number that can be stored in one word of memory
    (size of an integer, or long integer, something similar). The way around bounded
    word size is to store large integers and real numbers in linked lists of memory
    cells, but we will assume that is not necessary.


    Our model of a computer will have:


    +   - Program counter: Automatically incremented at each instruction, except for
    jumps (PC).


    +   - Three registers: Used for any sequence of bits, generally used as address
    registers (AR1, AR2, AR3).


    +   - Infinite memory: Each memory addressed by an integer (1, 2, 3, ...); each
    can hold any sequence of bits.


    +   - Program: Set of instructions, stored in memory.


    +   - Input from some standard device; output to some standard device.


    Notice that we assume that each register (PC, AR) and each memory cell can hold
    arbitrarily long sequences of bits. Despite the instruction set and the lack of
    registers, this makes our model more powerful than the computer you use.


    Instruction set: We will choose an instruction set to be small but not miniscule.
    Here, one can get into interesting side excursions. A “Tarpit” is a computer language
    designed to be Turing-complete but as small as possible—several different tarpsits
    have been developed. Each must be able to read a symbol, write a symbol, increment
    (or decrement), and have some kind of branch. At least one language has managed
    to do all this in one instruction. There is a language whose only instruction
    is “subtract and branch if negative.” There is also the language OISC (a reduced
    instruction set language)—the instruction set computer—whose instruction also
    combines the increment/decrement and the branch.


    The instruction set we will use has a subset of some of the standard three-address
    instructions. Addressing can be:'
