- fmt: "\n`Array` is the collection of similar data types or collection of similar\
    \ entity stored in contiguous memory location. `Array` of character is a string.\n\
    \nEach data item of an array is called an element. And each element is unique\
    \ and located in separated memory location. Each of elements of an array share\
    \ a variable but each element having different index no., known as subscript.\n\
    \nAn array can be a single dimensional or multi-dimensional and number of subscripts\
    \ determines its dimension. And number-of-subscript always starts with zero. One\
    \ dimensional array is known as vector, and two dimensional arrays are known as\
    \ matrix.\n\n**ADVANTAGES:** Array variable can store more than one value at a\
    \ time where other variable can store only one value at a time.\nExample:\n```c\n\
    int arr[100];\nint mark[100];\n```\n\n**DECLARATION OF AN ARRAY:**\nIts syntax\
