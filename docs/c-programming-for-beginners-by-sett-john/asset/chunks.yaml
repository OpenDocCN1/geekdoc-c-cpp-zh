  trans: "\n将源代码的一行转换为目标代码。如果检查错误，则逐条进行，因此耗时更长。\n\n## 集成开发环境 (IDE)\n\n编辑、编译、运行和调试程序的过程通常由一个集成的单一应用程序管理，称为集成开发环境（简称`IDE`）。\
    \ `IDE`是一个基于窗口的程序，使我们能够轻松管理大型软件项目；在窗口中编辑文件；编译、链接并运行；以及调试程序。\n\n在 Mac OS X 上：CodeWarrior\
    \ 与 `Xcode`。在 Windows 下：Microsoft Visual Studio IDE。Kylix 用于 Linux 下的应用开发。大多数还支持多种语言的开发！包括\
    \ C++\n\n### 语言程序结构：\n1)  注释行  \n2 )预处理指令    \n3  全局变量声明   \n4   主函数 main() \n\
    \n```\n{ \n局部变量 ;语句 ;\n}\n用户自定义函数\n```\n\n**注释行:**表示程序的用途/目的/*……………………………..*/提高可读性有利于解释一般情况下文档包含在这些定界符内可以是单行或多行的但不应嵌套任何地方除了字符串常量字符常量内部\
    \  \n\n预处理器指令:`#include <stdio.h>`告诉编译器包含关于标准输入/输出库的信息例如符号常量等```...\n\n全局声明–定义在外部的函数可以在整个编程中访问其声明的变量每个用户都有一个实际开始执行的地方用一对花括号括起来放在第一个位置语法如下：\n\
    \n```c\nmain()\n{\n    ……\n  ………\n}\n```\n\n当数据类型为 int_main 时返回值:\n\n```c\nint\
    \ main(void)\n{\n return0;\n}\n\nvoid 意味着空值/null void_(参数):\nprintf(“C language”);\
    \ Output-> \"MachineCode\".\n\n执行从起始大括号开始到结束大括号终止两者之间是可执行部分每行末尾使用分号表示该行的终结。**\n\
    \n/**首个带返回值的 C 语言程序*/\n\n#include<stdio h>\n\nInt_ Main( Void){\nPrintf(\"欢迎来到编程世界\\\
    n \") Return Zero;}\n输出的问候消息经过涉及计算机输入的典型 Unix 命令命令行步骤后得到结果创建的名为 prog.c 的文件使用了文本编辑器\
    \ vi 这一流行的系统工具原始形式代表源文件内容被保存下来随后通过键入特殊命令启动 gcc 或更早的 cc 版本进行检查是否符合语法语义规则发现的错误会被报告出来必须更正后才能重新尝试典型的常见问题有不匹配的花括号未定义的变量等等修正之后下一步移除中间产物并将其翻译成汇编等价物此任务完成后再进一步转换成二进制代码写入后缀字母改为\
    \ o 而不是原格式准备好连接最终再次处理后生成可执行的机器码利用之前处理过的过程把各个不同的目标模块连接到一起搜索并调用相应的静态共享库这个过程被称为构建一个默认的可执行对象存放到\
    \ a.name.out 文件中正常运行顺序是依次进行的遇到像鼠标点击这类事件时会临时挂起进程直到条件满足才恢复。\n"
