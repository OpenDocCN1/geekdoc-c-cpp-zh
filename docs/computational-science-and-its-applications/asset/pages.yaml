    Of course one should mention some of the limitations of the proposed approach
    (and how to overcome them). It is clear that choosing one fixed Banach space of
    test functions and its dual (with the Hilbert space in the middle) one cannot
    expect to be able to get boundedness of effectively unbounded (in whatever sense)
