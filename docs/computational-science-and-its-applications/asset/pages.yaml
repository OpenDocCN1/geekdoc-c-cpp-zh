    # Theorem 5.1: The operator ℱ which maps q to the solution u(q) ∈ H of the forward
    problem with current f is Fréchet differentiable. If η ∈ L^∞(Ω) is such that q
    + η ∈ Q, then the derivative ℱ(q)η = w satisfies the following variational problem


    b(w, v) = -∫_Ω η ∇u ∇v dx  (5.30)


