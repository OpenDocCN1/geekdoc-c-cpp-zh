    # 3.1 Introduction: Modern Terrorist Attacks


    Terrorism has always existed in history and has taken different forms: anarchist
    attacks, political attacks, or attacks by colonial states, such as the terrible
    Jallianwala Bagh massacre, which took place on April 13, 1919 in Amritsar, Punjab,
    when a crowd of non-violent protesters were fired upon by troops of the British
    Indian Army.


    In this article we focus specifically on the behavior of populations facing new
    forms of terrorism, such as the attacks perpetrated by sects, groups or “lone
    wolves” that are becoming more and more prevalent. Three types of acts can be
    distinguished:


    +   - Shooting and bombing attacks, for example in bus and subway stations (Madrid,
    Spain, 2004; Paris, France, 1995, 2015; Nigeria, 2014; Belgium, 2016; Kashmir,
    2019), at airports (Brussels airport, 2016; Atatürk airport, 2016), in urban areas
    with simultaneous terrorist acts (Mumbai, India, 2008, with 12 coordinated shooting
    and bombing attacks lasting four days).'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - Attacks using CBRN (chemical, biological, radiological, and nuclear weapons)
    such as the sarin gas attack on the Tokyo subway committed by the Aum sect (March
    20, 1995) (Dauphiné and Provitolo 2013).

    +   - Ad hoc weapons are now being employed, such as suicide planes flown into
    the World Trade Center (2001), lorries or cars that are simply driven directly
    through a crowd massed for a cultural event or strolling peacefully. This is in
    response to tightened police controls aiming to reduce bombing attacks. These
    attacks are most often led by “lone wolves,” who are difficult to detect beforehand
    and equally difficult to locate because they are “nested” among civilians. On
    July 14, 2016, 86 people who attended the Bastille Day fireworks on the “Promenade
    des Anglais” in Nice, France, were killed; 458 more were wounded.


    These attacks, perpetrated in crowds, in frequented places, or on public transport
    at rush hour, give rise to diversified human reactions. One can observe behaviors
    of sideration (paralysing panic), of flight panic, of agitation in all directions,
    of reasoned flight, of sheltering, or mutually offered assistance (Crocq 2013),
    etc.


    Except for sideration, sheltering and escape behaviors, whether taken under the
    influence of panic (flight panic) or of reason (reasoned escape), produce trajectories
    of displacement. When an attack happens, the topography of the area is also very
    important. The dynamics of human reactions and the associated displacements are
    indeed guided by the space and the alternatives that it offers, as displayed in
    Figure 3.1, especially in terms of evacuation, flight, and accessibility to refuge
    areas, such as safe places and squares.


    There are few data available to identify the dynamics of the displacements associated
    with these behaviors. Of course, it is difficult to artificially reproduce a disaster,
    which would otherwise allow us to observe the diversity of human reactions that
    could occur, to follow the spatio-temporal dynamics, and to analyze the impact
    of spatial configurations on these dynamics. To overcome these limits, it is possible
    to develop mathematical models from which hypotheses are tested by means of a
    human behavior computer simulation model.


    The Com2SiCa research team* proposed the Panic–Control–Reflex (PCR) model (Provitolo
    et al. 2015), as shown in Figure 3.2, which is a model that simulates the possible
    human behavior that can occur during sudden onset and unpredictable disasters,
    such as


