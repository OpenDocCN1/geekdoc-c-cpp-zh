  md: '# 14.2 Material and Method


    In this chapter, the de-noising of Raman spectra of material Barium Zirconium
    Titanate is done using a method based on total variation.


    # 14.2.1 Material


    FT-Raman spectra of Zr doped BaTiO₃ (BZT) with composition (x) = 0.010 has been
    carried out at room temperature. The spectra has been recorded in back scattering
    geometry by means of a Varian (Digilab), a dedicated FT-Raman Spectrometer (Nd-YAG
    Laser, 1064 nm, 500 mW laser power) in the range of 100 cm⁻¹–4000 cm⁻¹.


    # 14.2.2 Total Variation (TV) De-Noising


    For a given M-point signal s(m) such that 0 ≤ m ≤ M−1, the total variation of
    s(m) is defined by:


    $$TV(s)=\sum_{m=1}^{M-1}|s(m)-s(m-1)|=\|Ds\|_1$$


    where D is a matrix of order M−1 × M.


    For a given measured data y(m) containing noise and represented by


    $$y(m)=s(m)+\varepsilon(m),\quad m=0,1,2,\ldots,M-1$$


    where s(m) is a piecewise constant signal and ε(m) is white Gaussian noise, estimation
    of s(m) is the inverse problem. Estimate of the signal s(m) using TV de-noising
    is obtained by the solution of the optimization problem


    $$\underset{s\in\mathbb{R}^{M}}{\operatorname{arg\,min}}\left\{J(s)=\frac{1}{2}\|y-s\|_2^2+\lambda\|Dx\|_1\right\}$$


    It is worth noting here that the degree of smoothing is controlled by λ (Santamarina
    and Fratta, 2005).


    # 14.2.3 Algorithm for TV De-Noising


    In Equation (14.2), replacing D by a matrix A of order M × N and using the min–max
    property (Rockafellar, 1970; Hiriart-Urruty and Lemarechal, 1993) and the majorization-minimization
    method (Figueiredo et al., 2007), Selesnick and Bayram (2014) have developed the
    iterative clipping algorithm as:


    $$x^{(i+1)}=y-\frac{\lambda}{2}A^Tz^{(i)}$$


    $$z^{(i+1)}=\operatorname{clip}\left(z^{(i)}+\frac{2}{\alpha\lambda}Ax^{(i+1)},1\right)$$


    where i is the iteration index.'
