  md: 'of the Sobolev embedding was the question of prescribing the Gaussian curvature.
    Our approach is from this point of view. To explain the context let us recall
    some notions from geometry.


    Let $(M, g)$ be a Riemannian manifold of dimension $n$ and $P_{1,g}$ be the conformal
    Laplacian defined by


    $P_{1,g} = -\Delta_g + \frac{n-2}{4(n-1)} R_g,$


    where $R_g$ is the scalar curvature of the metric. We know that if $\tilde g =
    e^{2u} g$ is a metric conformal to $g$, then


    $P_{1,\tilde g}(v) = e^{-\left(\frac{n+2}{2}\right)u} P_{1,g}\left(e^{\left(\frac{n-2}{2}\right)u}
    v\right),$


    for all smooth functions $v$. Paneitz introduces a fourth order operator $P_{2,g}$
    of the form


    $P_{2,g} = \Delta_g^2 + \text{lower order terms}$


    and Branson found a sixth order operator $P_{3,g}$ of the form


    $P_{3,g} = \Delta_g^3 + \text{lower order terms}$


    with the conformal invariance properties. The existence of a general conformal
    operator of higher-degree was obtained by Graham, Jenne, Mason, and Sparling (what
    is popularly known as GJMS operators). They proved


    # **Theorem 9.8** Let $(M, g)$ be a Riemannian manifold of even dimension $n$.
    For $k \in \left\{1,2,\dots,\frac{n}{2}\right\}$ there exists a conformally invariant
    differential operator $P_{k,g}$ of the form


    $P_{k,g} = \Delta_g^k + \text{lower order terms}$


    satisfying,


    $P_{k,\tilde g}(v) = e^{-\left(\frac{n+2k}{2}\right)u} P_{k,g}\left(e^{\left(\frac{n-2k}{2}\right)u}
    v\right)$


    for a conformal metric $\tilde g = e^{2u} g$.


    When $n$ is even and $k > \frac{n}{2}$, a conformally invariant operator $P_{k,g}$
    with the above properties may not exist in general. For this reason $P_{\frac{n}{2},g}$
    is known as the critical GJMS operator.


    Observe that one can recover the scalar curvature of a metric by acting $P_{1,g}$
    on the constant function. Similarly we define higher order curvatures known as
    $Q_k$ curvature for a Riemannian manifold $(M, g)$ of even dimension $n$. Let
    $k$ be an integer satisfying $k < \frac{n}{2}$ then the $Q_k$ curvature is defined
    by


    $Q_k = \frac{2(-1)^k}{n-2k} P_k(1)$'
