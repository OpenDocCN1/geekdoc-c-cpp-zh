  md: 'Let $(X, d)$ be a metric space, $x \in X$ and $r \in \mathbb{R}^+$, we set


    $B[x, r] = \{z \in X; d(x, z) \le r\}$


    $B^c[x, r] = \{z \in X; d(x, z) \ge r\}$


    For a subset $K$ of a metric space $(X, d)$, $K''$ denotes the set of all limit
    points of $K$ and $\overline{K}$ denotes closure of $K$.


    # Definition 21.3 A subset $V$ of a metric space $(X, d)$ is said to be proximinal
    (see [Phelps 1957]) if for each $x \in X$ there exists a point $v_o \in V$ which
    is nearest to $x$, i.e.


    $d_x = d(x, v_o) = d(x, V) \equiv \inf\{d(x, v) : v \in V\}. \quad (21.2)$


    Every element $v_o \in V$ satisfying Equation (21.2) is called a best approximation
    or a nearest point or a closest point to $x$ in $V$.


    We denote by $P_V(x)$, the set of all best approximants to $x$ in $V$, i.e.


    $P_V(x) = \{v_o \in V : d(x, v_o) = d(x, V)\}.$


    The set $V$ is said to be proximinal or an existence set if $P_V(x) \neq \phi$
    for each $x \in X$. The set $V$ is said to be antiproximal if $P_V(x) = \phi$
    for each $x \in X / V$.


    In case $P_V(x)$ is exactly a singleton (at most a singleton) for each $x \in
    X$, we have the following:


    # Definition 21.4 A subset $V$ of a metric space $(X, d)$ is said to be Chebyshev
    or uniquely proximinal (respectively, semi-Chebyshev) if $P_V(x)$ is exactly a
    singleton (at most a singleton) for each $x \in X$ i.e. for each $x \in X$ there
    exists exactly one (respectively, at most one) point $v_o$ in $V$ such that $d(x,
    v_o) = d(x, V)$.


    # Definition 21.5 The set-valued mapping $P_V : X \to 2^V \equiv$ the set of all
    subsets of $V$, which associates with each $x \in X$, the set $P_V(x)$ is called
    the metric projection or the best approximation map or the nearest point map.


    From the definition of $P_V$, it is clear that $P_V$ exists if and only if $V$
    is proximinal and that $P_V$ is single-valued if and only if $V$ is Chebyshev.


    # Definition 21.6 Let $(X, d)$ be a metric space and $K$ a non-empty bounded subset
    of $X$. The set $K$ is said to be remotal (uniquely remotal) if for each $x \in
    X$ there exists at least one (exactly one) $k \in K$ such that $d(x, k) = \sup
    \{d(x, y) : y \in K\} \equiv \delta(x, K)$. Such a point $k$ is called a farthest
    point of $x$ in $K$. The set-valued map $F_K : X \to 2^K \equiv$ the collection
    of all subsets of $K$, defined by


    $F_K(x) = \{k \in K : d(x, k) = \delta(x, K)\}$


    is called the farthest point map (f.p.m.). The set $K$ is said to be antiremotal
    if $F_K(x) = \phi$ for each $x \in X$. The farthest distance of $x$ from $K$ may
    or may not be attained by an element of $K$. If this distance is attained, then
    collection of all such points of $K$ is denoted by $F(x, K)$, i.e.'
