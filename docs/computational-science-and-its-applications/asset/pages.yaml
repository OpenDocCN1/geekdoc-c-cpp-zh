    2^k Γ((k+1)/2)]^p′ / Γ((n−k+1)/2) , if k is odd, n/ωₙ₋₁ [π^(n/2) 2^k Γ(k/2)]^p′
    / Γ((n−k)/2) , if k is even, } (9.15)


    Furthermore, if β > β₀, then the supremum in Equation (9.14) is infinite.


    Inequalities of the above form are called Adams inequalities. As mentioned earlier,
    even though the statements of Adams look similar to that of Moser–Trudinger, proofs
    are significantly different. Adams used the Riesz transform to convert it into
    a convolution type estimate and then use a lemma due to O’Neil for convolution
    operators of nonincreasing rearrangement of functions to prove the result. Subsequently
    Fontana in [15] obtained the following sharp version of Equation (9.14) on compact
    Riemannian manifolds:


    # Theorem 9.6 (Fontana [15]) Let (M, g) be an n dimensional compact Riemannian
    manifold without boundary, and k be a positive integer less than n, then there
    exists a constant c₀ = c₀(k, M) such that


    sup_{u∈C^k(M), ∫_M u=0, ∫_Ω |∇_g^k u|^p′ ≤1} ∫_M e^{β|u(x)|^{p′}} dx ≤ c₀ (9.16)


    if β ≤ β₀(k, n), where p, p′, ∇_g^k as above where ∇_g and Δ_g are the gradient
    and Laplace Beltrami operators with respect to the metric g. Furthermore, if β
    > β₀, then the supremum in Equation (9.16) is infinite.


    Since the Moser–Trudinger inequality holds in the hyperbolic space, a natural
    question is whether we have Adams inequality in the hyperbolic space. An answer
    was given by Fontana and Morpurgo:


    # Theorem 9.7 (Fontana and Morpurgo,[23]) Let 1 ≤ k < n then the Adams inequality


    sup_{u∈C^k_c(H^n), ∫_{H^n} |∇_g^k u|^p′ ≤1} ∫_{H^n} Exp_{[p−1]}(β |u(x)|^{p′})
    dx < ∞, (9.17)


    holds in the n dimensional hyperbolic space H^n iff β ≤ β₀(k, n) where [p − 1]
    denotes the integer part of p − 1 and Exp_m(x) = e^x − Σ_{i=1}^m x^i / i!


    Another approach to Adams inequality in the Hyperbolic space was taken by us in
    [24]. Recall that the original motivation of Moser to prove the sharp version
    in Equation (9.8)'
