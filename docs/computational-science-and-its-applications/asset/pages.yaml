    # 12.1 Introduction


    User identification should be a requirement for many applications such as access
    control, aviation, online banking, e-commerce, national identity card, forensic
    investigations, etc. which should be safe and secure. Maintaining and managing
    access while protecting both the user’s identity and the data has become a challenge.
    To resolve such an issue, biometric systems, which use distinct behavioral or
    physical traits of human beings, have recently become more popular because of
    their robustness and high accuracy. In recent decades, researchers have extensively
    studied several biometric features, such as, among others, fingerprints [1–4],
    iris [5–8], face [9–12], footprint [13–15], palmprint [16–20], etc. The palm print
    has been clearly noted because it is difficult to interfere with and data is easily
    gathered. There are two types of skin pattern on the inner surface of the palm,
    i.e., ridges and valleys. As a prominent component of biometric traits, the palmprint
    is interesting and consists of many characteristics like high articulateness,
    durability, and user-compatibility etc. In fact, the first use of palmprint for
    personal recognition was found in Chinese sales deeds in the sixteenth century
    [21, 22].'
