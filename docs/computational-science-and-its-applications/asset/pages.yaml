  md: '# 9


    # Moser-Trudinger and Adams Inequalities


    Kunnath Sandeep


    # CONTENTS


    +   9.1 Introduction...............................................................................135

    +   9.2 Preliminaries.............................................................................137

    +   9.3 Moser–Trudinger...........................................................................139

    +   9.4 Adams Inequality..........................................................................142

    +   References......................................................................................147


    # 9.1 Introduction


    In this chapter we will focus on the sharp Sobolev inequalities known as the Moser–Trudinger
    and Adams inequalities.


    Recall the well-known classical Sobolev inequality which states there exists an
    optimal constant $S_n>0$ such that the inequality


    $S_n\left[\int_{\mathbb{R}^n}|u|^{2^*}dx\right]^{\frac{2}{2^*}} \le \int_{\mathbb{R}^n}|\nabla
    u|^2 dx \quad (9.1)$


    holds for all $u \in C_c^1(\mathbb{R}^n)$, $n\ge 3$, where $2^* = \frac{2n}{n-2}$.
    It immediately follows from this inequality that if $\Omega$ is a bounded domain
    in $\mathbb{R}^n$ and $1\le p\le 2^*$, then there exists an optimal constant $C_{n,p,\Omega}>0$
    such that


    $C_{n,p,\Omega}\left[\int_{\Omega}|u|^p dx\right]^{\frac{2}{p}} \le \int_{\Omega}|\nabla
    u|^2 dx \quad (9.2)$


    holds for all $u \in C_c^1(\Omega)$. The inequalities of Equation (9.1) and Equation
    (9.2) hold for all $u$ in $D^{1,2}(\mathbb{R}^n)$ and $H_0^1(\Omega)$ respectively
    where $D^{1,2}(\mathbb{R}^n)$ and $H_0^1(\Omega)$ are respectively the completion
    of $C_c^1(\mathbb{R}^n)$ and $C_c^1(\Omega)$ with respect to the norm $\left(\int
    |\nabla u|^2 dx\right)^{\frac12}$.'
