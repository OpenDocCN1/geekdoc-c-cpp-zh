  md: '-Δ_g u + k_g = k_g e^{2u} on M


    Thus if we want to know whether a given function k : M → ℝ is the Gaussian curvature
    of a conformal metric is equivalent to proving whether the PDE


    -Δ_g u + k_g = k e^{2u} on M


    has a solution. Solutions of this PDE are the critical points of the energy functional:


    J(u) = 1/2 ∫_M |∇_g u|^2 dV_g + ∫_M k_g u dV_g - 1/2 ∫_M k e^{2u} dV_g  (9.6)


    defined on appropriate function spaces. Another equation where similar type of
    nonlinearity arises is the mean-field equation: Let (M, g) be a two dimensional
    compact Riemannian manifold, then the mean-field equation under certain assumption
    reduces to


    -Δ_g u = λ ( k e^{u} / ∫_M k e^{u} dV_g - 1 / Vol(M) ) on M


    where k : M → ℝ is given. The corresponding energy is:


    J(u) = 1/2 ∫_M |∇_g u|^2 dV_g + λ/Vol(M) ∫_M u dV_g - λ/2 log( ∫_M k e^{2u} dV_g
    )


    The above examples show that if we need the energy to be defined in the natural
    spaces then we need to estimate terms of the form ∫_M e^{2u} dV_g using ∫_M |∇_g
    u|^2 dV_g. Indeed such estimates are available and its optimal version is known
    as the Moser–Trudinger inequality. Higher order versions of this inequality are
    known as the Adams inequality. We will discuss these inequalities in detail in
    the next sections.


    # 9.2 Preliminaries


    In this section we will recall some basic definition and standard results.


    We will denote by D^α the differential operator


    D^α = ∂^{|α|} / ∂x_1^{α_1} ... ∂x_n^{α_n}


    corresponding to a multi-index by α = (α_1, ..., α_n) where |α| = α_1 + ... +
    α_n.'
