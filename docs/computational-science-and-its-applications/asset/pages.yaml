  md: 'can take place either through the heating (thermal melting) or by varying the
    pH value of the solvent (DNA denaturation) [54]. Thermal melting causes breaking
    of hydrogen bonds due to the increase in entropy and, as a result, two strands
    get separated. Usually, melting temperature ($T_m$) is defined as the temperature
    at which half of the base-pairs of a dsDNA gets dissociated. In vitro, the melting
    temperature was found to be in the range of 80°C and 90°C, depending on the sequence,
    and denaturation is obtained for the pH value greater than 9.0 [54]. Physically
    these two extreme conditions are not possible inside a living body. This indicates
    that there must be some other mechanism involved in the separation of dsDNA.


    It has been realized now that these processes are mediated via certain enzymes
    or proteins that exert mechanical force on DNA, and, as a result, it separates
    [55]. Motivated by this, Bockelmann and coworkers [39, 40] applied a force perpendicular
    to the helix direction i.e. at 5′–3′ ends, and measured the unzipping force ~15
    pN to separate a dsDNA. Essential information about sequence and strength of the
    interactions involved in base pairing have been revealed.


    # 11.3 Computer Simulations


    In recent years Molecular Dynamic (MD) simulations [56, 57] have emerged as an
    important tool to understand the results of SMFS experiments. Such a tool has
    enhanced our understanding of these molecules and also predicted structures and
    function of these molecules. In fact, it has served as a bridge between theory
    and experiment. It offers so much information that is hard to quantify. Excellent
    reviews on molecular dynamics are in the literature, and its use in biochemistry
    and biophysics are numerous (see, e.g. [58] and references therein).


    Before studying structural and dynamical properties of DNA through simulations,
    it is important to note that DNA exhibits a wide range of length and time scales
    over which specific processes take place. For example, local motion, which involves
    atomic fluctuations, side chain motion, and loop motion occurs on the length scale
    of 0.01 to 5 Å, and the time involved in such processes is of the order of 10⁻¹⁵
    to 10⁻¹² s. The motion of a helix or a sub-unit falls under the domain of rigid
    body motion with typical length scales between 1 and 10 Å, and the time involved
    in such motion is between 10⁻⁹ and 10⁻⁶ s. Large-scale motion consists of helix-coil
    transitions, which involve length scales of more than 10 Å and time scales from
    10⁻⁷ to 10¹ s. Depending upon the nature of problems, one considers either the
    coarse-grained description or a detailed atomistic description of the DNA.


    However, in this chapter, we focus our discussion on all-atom simulations [59–61].
    In fact, this chapter provides the most detailed description on the atomistic
    level, including the local interaction and non-bonded interactions. The latter
    includes the (6–12) Lenard–Jones potential, the electrostatic interaction, and
    the interaction with the environment. The all-atom model with the CHARMM (Chemistry
    at HARvard Molecular Mechanics) force field [59] was first employed by Grubmuller
    et al. [62]. The NAMD (NAnoscale Molecular Dynamics) software [60] is now widely
    used for the stretching of biomolecules by constant mechanical force and by the
    force with a constant loading rate. Recently, GROMACS (GROningen MAchine for Chemical
    Simulations) software [61] has been developed to study the mechanical unfolding
    in explicit water. In this chapter, we used an Assisted Model Building with Energy
    Refinement (AMBER) software package [63]. It is a general-purpose'
