    # Theorem 21.10 Let (X, d, W) be a convex metric space. If K ⊆ X is uniquely remotal
    and M-compact, then K'' is either empty or M-compact and uniquely remotal.


    Proof. If FarK ⊆ K'' then K is a singleton by Theorem 21.5. Suppose FarK ⊆ K''.
    We claim that δ(x, K) = δ(x, K''). First we show that δ(x, K) ≥ δ(x, K'') for
    all x ∈ X. For x ∈ X, there exists {k''_n} ⊆ K'' such that d(x, k''_n) → δ(x,
    K'') as n → ∞. As k''_n ∈ K'', for each n ∈ ℕ there exists k_n ∈ K such that d(k_n,
    k''_n) < 1/n. Now d(x, k''_n) ≤ d(x, k_n) + d(k_n, k''_n), implies d(x, k_n) ≥
