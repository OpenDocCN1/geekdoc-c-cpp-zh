  md: 'knowledge. The cognitive computing agent framework employs semantic knowledge
    extraction technology according to the user situation description or query.


    +   4. **Inference the Query:** A cognitive computing agent develops a reward-based
    knowledge inference method according to current situation information in an intuitive
    way. This technique applies the human mental model of comprehending knowledge.
    So, this enables the agent to perceive and understand the decision situation more
    quickly.


    Let us consider a case study of implementing cognitive computing agent in clinical
    decision-making in the following steps.


    **Step 1.** Describing Experience and Query as the part of Decision Situation
    (DS):

    The user can specify a situation for knowledge-building and input his/her query
    with natural language. An appropriate way to denote the query through natural
    language is with plain text. Therefore, a decision situation can be described
    and queried as natural language questions and sentences.


    **Definition 17.1.** User Decision Situation Query (Q) and Experience (E) inputs
    as shown in Equations (17.1–17.3).


    ```

    $$Q := (Q_1, Q_2 \ldots Q_n), \tag{17.1}$$

    $$E := (E_1, E_2 \ldots E_n), \tag{17.2}$$

    $$DS = \{Q_i, E_i\} \tag{17.3}$$

    ```


    where, n ≥ 0, Qᵢ is a natural language query and Eᵢ is a natural language experience
    about a certain situation.

    A decision situation (DS) denotes an n-tuple comprising of n inputs. Each input
    of (Eᵢ) and (Qᵢ) is termed a (DS) comprising experience and query input which
    is in the form of natural language. The following example is a clinician’s (DS)
    consisting of two inputs:


    **Example 17.1.** A Clinician’s Query and Experience Decisions are as follows:


    +   1. $Q_1=$ *What is the treatment for the flu?*

    +   2. $E_1=$ *(Ashish was having symptoms like cold, cough, and mild fever in
    August 2018. He was suffering from flu. However, AntiViral has taken control of
    flu.)*


    **Step 2.** Creating Query and Developing Experience based Knowledge:

    Logically when humans are interacting with each other, they have a habit of highlighting
    particular matters in the domain of interest and expressing significant information
    about these entities in a situation from a specific opinion. Consider the following
    example of Decision situation (DS) sentence:


    **Example 17.2.** A Decision situation having Experience sentence $E_i$


    ```

    $E_a$ = “Ashish was having symptoms like cold, cough, and mild fever in August
    2018.”

    $E_b$ = “He was suffering from flu.”

    $E_c$ = However, AntiViral has taken control of the flu.

    $E_i$ = { $E_a$, $E_b$, $E_c$ }

    ```'
