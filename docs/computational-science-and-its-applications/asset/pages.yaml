- pgno: 66
  md: 'incorporates the pressure and counterpressure of the crowd in each place via
    a bottleneck effect, which takes into account the narrowness and the length of
    the streets and the size of places. We will consider an oriented network with
    three nodes representing three places or public squares of different sizes, linked
    by narrow streets. In this network, we compute the equilibrium points that show
    the motion of the crowd after a terrorist attack. Section 3.4 is therefore devoted
    to the analysis of the impact of the size of the intermediate place of this network
    on the evacuation of the population in the face of a terrorist attack, by means
    of numerical simulations. The numerical results highlight that, depending on their
    respective size, intermediate places modulate the dynamics and the speed of flow
    of the crowd. In this sense, they become strategic places, both for the planners
    who must think about the organization of the area to host public events and festivals,
    and also for the terrorists who can use these strategic places to multiply the
    effect of their harmful actions by trapping the escape movements between two areas
    of action. Finally, in Section 3.5, a brief conclusion will be drawn.


    # 3.2 Weighted PCR System: A Model for Analyzing the Dynamics of Human Behavior
    During a Disaster


    # 3.2.1 Network of Squares and Streets Modelling Spatial Urban Configurations


    Just before a dramatic event like a terror attack in a city, the crowd is generally
    spread across several places, public squares and streets. In the aftermath of
    the initial shock, people rush through the streets to reach what they think will
    be more secure places, as one can see in Figure 3.3.


    In this chapter, we define a city by a mathematical graph, where the places and
    public squares are called vertices or nodes and are denoted N₁, N₂, …, Nₚ, and
    the streets, escalators, doors, and stairs are the oriented edges (Nᵢ → Nⱼ) linking
    these nodes. They are oriented, because the flow from one place toward another
    is not symmetric during terrorist attacks. Our aim is to model the motion of the
    crowd through such edges. To achieve this, we must introduce some “geographical”
    particularities of the city, like the size of places, the narrowness of streets,
    and the number of people initially present in each place. This is why we need
    to upgrade the standard PCR model, into the Weighted PCR (WPCR) model, by introducing
    new data, with Weight standing for the relative sizes of crowd, places, and streets.


    First, on each node Nₖ, k=1, p we call rₖ(t), cₖ(t), pₖ(t), qₖ(t), bₖ(t) the number
    of people being in reflex, control, panic, daily usual behavior, and return to
    normal life and Vₖ(t) the total number of people present at this node


    Vₖ(t) = rₖ(t) + cₖ(t) + pₖ(t) + qₖ(t) + bₖ(t)  (3.1)


    Second, in order to more precisely model the characteristics of the city, we introduce
    Wₖ the maximum capacity of the number of people who can be present in each node
    Nₖ (i.e. due to the size of the corresponding place). Each maximum capacity is
    a constant. Each time one must have


    Vₖ(t) ≤ Wₖ  (3.2)'
