    resonance (MR), and fluid attenuated inversion recovery (FLAIR) images for preferable
    segmentation [10]. An overlap performance of 84% to 93% was achieved with an emphasis
    on robustness with respect to distinct and heterogeneous lesion types.


    To achieve the higher accuracy, a new data-mining technique, based on a combination
