    Considering a linear variation in the seepage velocity with distance and time
    and assuming the dispersion coefficient directly proportional to the square of
    the seepage velocity (Kumar et al., 2009), the two are written with further modifications
    as


    $$u=u_0f(pt)(a+b^*x)$$  \tag{19.10}


    Where, the velocity increases from $f(pt)au_0$, at $x=0$ to a value $f(pt)(a+e)u_0$
    at $x=L$, such that $b^*=\frac{e}{L}$ is the in-homogeneity parameter of the medium;
    for the sake of validity of Darcy’s law (i.e. variation in the velocity should
    not be very large) in the medium, it is assumed that as $x\to\infty$, $b^*x\to
    M$, where $b^*=\frac{M}{x}$. Using Equation (19.10), the coefficient of dispersion
    is written as follows:


    $$D=D_0f^2(pt)(a+b^*x)^2$$  \tag{19.11}


