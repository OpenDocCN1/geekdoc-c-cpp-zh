    # 7.7 Road Map of Future Research Work


    Adzievsk and Siddiqi [4] have studied simulation of partial differential equations
    using Mathematica. Similar methods could be investigate for fractional partial
    derivatives, particularly conformable partial differential equations. Our centre
    (Research Centre for Advanced Research in Applied Mathematics and Physics, Sharda
    University) will take up this research in the curve numerical methods for fractional
    analogue of partial differential equations given in [50], pp. 3–15. Harmann [30]
    has presented a beautiful account of applications of classical fractional derivatives
    like Riemann, Caputo, Liouville in several emerging areas of Physics. Conformable
    derivative was introduced in 2014 and its applications in several area have been
    studied recently. We may study the roll of conformable fractional derivative in
    the problems considered by Hermann. In Section 7.5 and 7.6, conformable fractional
    derivative of Shannon wavelet and sine-cosine wavelet have been studied. In future
    work we plan to study the solution of fractional differential equations and to
    apply these results.


