  md: 'resolution capacity; it yields less spectral distortion and higher spatial
    resolution. In [8], a method to remove speckle noise is discussed using generalized
    guided filters and Bayesian non-local means. It calculates the nonlinear weight
    kernel and generates guidance image with homogeneity analysis considering maximum
    likelihood rule and local regions.


    Due to its robustness and effectiveness, multi-scale pan-sharpening based on the
    Laplacian pyramid decomposition is used such as shiftable complex directional
    pyramid [9], contrast pyramid transform [10], image decomposition [11], Laplacian
    pyramid with multiple features (LPMF) [12], etc. These techniques have emerged
    as a popular method that has shown utility in many pan-sharpening–based applications.
    However, the number of pyramid levels increases with the image size, which implies
    sophisticated data management and memory accesses, as well as additional computations
    [13]. Due to the loss of dependence of coefficients, most of the traditional multi-scale
    decomposition-based image pan-sharpening methods suffer from an inaccurate image
    representation. To overcome these problems, nonsubsampled shearlet transform (NSST)
    is used. The dependence of NSST coefficients is captured by the contextual hidden
    Markov model [14]. Explicit luminance and contrast masking models are combined
    to give the perceptual importance of each coefficient of source images produced
    by the dual-tree complex wavelet transform. This combined model of perceptual
    importance is used to select which coefficients are retained and furthermore to
    determine how to present the retained information in the most efficient manner
    as in [15]. In this chapter, we present a novel image pan-sharpening approach
    to overcome these limitations. The proposed method evaluates weight values of
    the input images and then uses the corresponding pan-sharpening map to develop
    the final fused image. To reduce the halo and gradient reversal artifacts further,
    a modified non-local means-based guided image filter (MNLMGIF) is proposed and
    applied on the fused image as a post-processing technique. Therefore, this method
    maintains all the information from both images, which is not done by most of the
    existing pan-sharpening methods. Moreover, the proposed technique can reduce gradient
    and halo artifacts problems using MNLMGIF. To justify the efficiency of the proposed
    method quantitatively, experiments have been carried out on remotely sensed images
    [16], QUICKBIRD [17], IKONOS [18], and MODIS [19] sensors.


    The remainder of this chapter is organized as follows: a proposed filtering-based
    image pan-sharpening technique is discussed in Section 8.2. To verify the effectiveness
    of the proposed technique, visual and quantitative results are carried out on
    remote sensing images in Section 8.3. In Section 8.4 the conclusion is presented
    along with future directions.


    # 8.2 Proposed Method


    This section discusses the proposed methodology. A systematic procedure is adopted
    to evaluate the weighted map, multiscale image pan-sharpening, guidance image
    generation for filtering, and finally MNLMGIF for pan-sharpening is used. Figure
    8.2 demonstrates the overview of graphical flow explaining the technique.


