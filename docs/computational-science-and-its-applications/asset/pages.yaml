    # 17.1.3 Aim of Writing this Chapter


    In this chapter, the main aim is to cover the untouched portions in the progress
    of intelligent agent design which previous work has not considered. Second, it
    provides a comparison of intelligent and cognitive agent architectures at the
    functional and design level, as well as reviewing intelligent agent architecture
    advancement until the year 2016.


    This chapter will help budding intelligent and cognitive agent researchers who
    are developing intelligent systems based on an architectural framework. The survey
    aids a thorough overview of this area, and it will offer an up-to-date theoretical
    literature in the area. New researchers may obtain a new prospect of progressing
    the development of an intelligent agent. So, the key objectives are:


    +   1. Suggest a universal taxonomy and definition on various intelligent agents
    based on a physical, mental, and conscious approach.

    +   2. Provide a state-of-the-art review on the design of artificial intelligent
    and cognitive agent based on the architecture approach. The review elaborates
    the different categories based on its architectural design, advantages, and disadvantages,
    removing past exploration loopholes. This chapter classifies intelligent agent
    architectures as reactive, deliberative BDI, and hybrid layer. On the other hand,
    cognitive agent architecture is categorized as symbolic, emergent, and hybrid
    model.

    +   3. Give a brief review of cognitive agent systems based on new architectures
    progress after the year 2010. So, it leads to development on the subject, as no
    previous survey has focused in this way.

    +   4. Focus on the role and applications of cognitive computing in the area of
    artificial intelligent and cognitive agent systems based on designs and application.

    +   5. Finally, embrace some discussion and conclusions.


    # 17.2 Background


    # 17.2.1 General Intelligent Agents


    Researchers define intelligent agents as the software and hardware entities that
    can perform in place of humans and conduct specific complex tasks or give expert
    decisions'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'intelligently as shown in Figure 17.1. Intelligent agents comprise of certain
    internal, as well as external, characteristics which come from different software
    programs. The authors discuss the features as follows.


    # 17.2.1.1 Internal Features of Intelligent Agent


    An intelligent agent possesses certain inner features like autonomy, learning,
    inference, goal orientation, and reactive action:


    +   - **Autonomy:** Intelligent agents can control their task. The agent can self-sense
    the environment and generate action based on its knowledge provided by the knowledge
    experts in the form of rules.

    +   - **Learning:** An intelligent agent can learn facts and create its knowledge
    for developing behavior for achieving goals.

    +   - **Inference:** An intelligent agent can provide a decision by exploiting
    its knowledge and choose the best action for a particular uncertain situation.

    +   - **Goal Orientation:** Every agent has individual goals, according to the
    appropriate information and expertise it attempts to reach the goals.

    +   - **Reactive Action:** Each agent has the ability to provide an immediate
    best reaction on perceiving information from its environment.


    # 17.2.1.2 External Features of Intelligent Agents


    Apart from the internal characteristic the agents also have few external features
    like mobility, cooperation, and communication.


    +   - **Mobility:** Intelligent agents can navigate electronically through communication
    networks.

    +   - **Cooperation:** For conducting specific composite tasks agents may have
    the skills to cooperate with other agencies and improve its self-abilities for
    attaining goals.

    +   - **Communication:** Every agent can interact with its environment and other
    entities like humans, agents, systems, etc. to accomplish the goals.


