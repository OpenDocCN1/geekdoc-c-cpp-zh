    # Wavelet Approach for the Classification of Autism Spectrum Disorder


    Noore Zahra, Hessa N. Al Eisa, Kahkashan Tabassum, Sahar A. El-Rahman, and Mona
    Jamjoom


    # CONTENTS


    +   13.1 Introduction................................................................................................................
    209

    +   13.2 Literature Survey and Background Information .......................................................................
    210

    +   13.3 Materials and Methods ...............................................................................................................
    212

