    Recall that a multipoint method with memory reuses old information, for example,
    some entries from the previous iteration. In this section, we will improve the
    convergence rate of the family in Equation (6.8) using an old idea given, consisting
    of varying the parameters $\gamma = \gamma_k$ and $\lambda = \lambda_k$ as the
    iteration proceeds. We aim at accelerating convergence without imposing further
    functional evaluations per cycle. This means that using two function evaluations,
    we must increase the R-order of convergence by more than 4. Here, we attempt to
    prove that the R-order of convergence of a new derivative-free methods in Equation
    (6.8) with memory is 6. For this purpose, we state the following lemma.


    # Lemma 6.1 Let $\gamma_k = -\dfrac{1}{N''_3(x_k)}$, and $\lambda_k = -\dfrac{N''''_4(w_k)}{N''_4(w_k)}$
    where $e_k = x_k - \alpha, e_{k,y} = y_k - \alpha, e_{k,w} = w_k - \alpha$, then
    the following asymptotic relations hold:


    ```

    \begin{cases}

    1 + \gamma_k f''(\alpha) \sim \Psi_1 e_{k-1} e_{k-1,w} e_{k-1,y}, \\

    c_2 + \lambda_k \sim \Psi_2 e_{k-1} e_{k-1,w} e_{k-1,y},

    \end{cases} \tag{6.9}

    ```


    where $\Psi_1$ and $\Psi_2$ these some asymptotic constants.


    Now, we state the convergence theorem for Equation (6.8).


    # Theorem 6.3 If an initial guess $x_0$ is sufficiently close to the zero $\alpha$
    of $f(x)$ and the parameter $\gamma = \gamma_k$ and $\lambda = \lambda_k$ in the
    iterative scheme in Equation (6.8) is recursively calculated by the form given
    in Equation (6.9), then the R-order of convergence of methods with memory in Equation
    (6.8) is at least 7.


    # Proof 6.3 First we assume that the R-order of convergence of sequence $x_k,
    w_k, y_k$ is at least $r, p,$ and $q$, respectively.


    Hence:


    ```

    e_{k+1} \sim e_k^r \sim e_{k-1}^{r^2}, \tag{6.10}

    ```


    ```

    e_{k,w} \sim e_k^p \sim e_{k-1}^{p^2}, \tag{6.11}

    ```


    and


    ```

    e_{k,y} \sim e_k^q \sim e_{k-1}^{q^2}. \tag{6.(12)}

    ```'
