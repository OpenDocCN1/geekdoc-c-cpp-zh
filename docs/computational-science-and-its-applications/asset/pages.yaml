    ...... 217

    +   13.6 Conclusions...............................................................................................................................
    217

    +   References...........................................................................................................................................
    223


    # 13.1 Introduction


    Autism spectrum disorder (ASD) is found in approximately 1 in 59 children as determined
    by the Centers for Disease Control (CDC) in 2018; this leads to anxiety disorder,
    sleep disorder, ADHD etc. ASD is a disorder that affects communication, interaction
    with other people, and behaviour. It restricts a person’s ability to function
    properly in daily life. Autism is known as a “spectrum” disorder because of its
    large array of variation in types and symptoms. Autism can strike at any age but
    mostly it is found in children of below two years of age [1].


    By using models and analysis of autism spectrum disorder it is expected to get
    psychometric tools that will further help psychologists and pediatricians to diagnose
    and evaluate patients suffering with ASD. Non-linear statistical analysis provides
    the measurements of metabolites that facilitate an understanding of the complexities
    of disorder. The outcome of the analysis of ASD will help in early diagnosis of
    the disease, which leads to favorable results in the long run.


    This chapter is dedicated to the wavelet analysis of autism that will go through
    the phase of multi-scale decomposition and entropy calculation of corresponding
    delta, theta, alpha, beta, and gamma for different age-groups of children. Results
    of the wavelet analysis algorithm will indicate the classification of Autism.'
