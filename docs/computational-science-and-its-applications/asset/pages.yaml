    Rice is the staple food of the eastern and the southern parts of the country,
    particularly in the areas having over 1500 mm annual rainfall. Climate change
    has created one of the important challenges of the twenty-first century—to supply
    food for increasing populations, and to sustain the stressed environment, which
    also threatens global food security. The fourth assessment of the IPCC (Intergovernmental
    Panel on Climate Change) confirmed that in the last 100 years there has been an
    increase in atmospheric temperature of 0.74°C due to global warming and an expected
    increase in records of warmest year, frost, flood, heavy rainfall, etc. These
    changes have a tendency of posing likely threats to the ecosystem and to agricultural
    production all over the world. Agricultural productivity is most sensitive to
    climate change, as climate is the primary determinant of agricultural productivity
    [1].


    Much work has already been done on almost all crops; however, the authors are
    not aware of any study conducted on rice in the Gorakhpur region of Eastern Uttar
