  md: 'In the remaining six sections we present the basic properties of conformable
    fractional derivative (Section 7.2), simulation of conformable fractional heat
    equation (Section 7.3), simulation of conformable fractional harmonic oscillator
    (Section 7.4), simulation of conformable fractional derivative of Shannon wavelet
    (Section 7.5), simulation of conformable fractional derivative of sine-cosine
    wavelet (Section 7.6), and a road map of future research work (Section 7.7).


    # 7.2 Conformable Fractional Derivative


    The concept of conformable fractional derivative has been studied by Khalil et
    al. [32], Abdel-jawed [2], Abdelhakim et al. [1]. Conformable differential equations
    have been studied by Hammed and Khalil [28, 30], Çenesiz and Kurt [16], Avct [9]
    and Nurudeen et al. [43]. We state below a few useful properties of conformable
    fractional derivative [2, 32]. Conformable fractional derivative is denoted by
    $T_\alpha f$ for $0<\alpha<1$, of a function $f:[0,\infty)\to\mathbb{R}$ is defined
    as:


    $$T_\alpha f(x)=\lim_{\epsilon\to0}\frac{f(x+\epsilon\,x^{1-\alpha})-f(x)}{\epsilon},\quad
    x>0,\tag{7.1}$$


    provided the limit exists, in this case $f$ is called $\alpha$- differentiable
    on $(0,a)$ for some $a>0$. Also


    $$T_\alpha f(0)=\lim_{x\to0^+}T_\alpha(x).\tag{7.2}$$


    It has been observed by Abdelhakim and Machado [1] that if $f$ is $\alpha$- differentiable
    in the conformable sense at $x>0$, then it must be differentiable in the classical
    sense at $x$ and


    $$T_\alpha f(x)=x^{1-\alpha}f''(x).\tag{7.3}$$


    Various analogous properties of classical derivative including Rolle’s Theorem,
    Chain Theorem, Gronwall inequality, integration of parts formula are studied in
    references mentioned above. Khalil et al. [32] have also introduced fractional
    integral associated with conformable fractional derivative. The following theorems
    containing various properties have proved very useful.


    **Theorem 7.1** Let $\alpha\in(0,1)$ and $f,g$ be $\alpha$- differentiable at
    $t>0$. Then


    +   (a) $T_\alpha(\lambda f+\mu g)=\lambda T_\alpha(f)+\mu T_\alpha(g),\forall\
    \lambda,\mu\in\mathbb{R}$

    +   (b) $T_\alpha(fg)=fT_\alpha(g)+gT_\alpha(f)$.

    +   (c) $T_\alpha\left(\frac{f}{g}\right)=\frac{gT_\alpha(g)-fT_\alpha(f)}{g^2}$.

    +   (d) $T_\alpha(t^p)=pt^{p-\alpha}\ \forall\ p\in\mathbb{R}$.

    +   (e) $T_\alpha(\lambda)=0$ for all constant functions $f(t)=\lambda$.

    +   (f) $T_\alpha(e^{ct})=c x^{1-\alpha}e^{cx},\ c\in\mathbb{R}$.

    +   (g) $T_\alpha(\sin bx)=b x^{1-\alpha}\cos bx,\ b\in\mathbb{R}$.'
