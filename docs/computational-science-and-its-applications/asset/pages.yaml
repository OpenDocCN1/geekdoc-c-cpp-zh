  md: 'consider the backward Euler method for temporal discretization, whereas readers
    are referred to [9] for an overview of other time discretization schemes in the
    context of finite elements.


    We first transform the second-order differential equations into a system of first-order
    differential equations. Then the linear momentum equation becomes


    $$\frac{d\mathbf{X}_b}{dt}=\mathbf{u}_b;\qquad \frac{d\mathbf{u}_b}{dt}=\frac{\rho
    L^3}{m}\mathbf{F}_{flow}+\frac{1}{Fr}\mathbf{e}.$$


    Similarly, angular momentum equation is also transformed into a system of first-order
    differential equations. Let $\alpha=\alpha(\alpha_1,\alpha_2,\alpha_3)$ be the
    rotational angles on the body axis and $\omega=(\omega_1,\omega_2,\omega_3)$ be
    its rotational vector, then we have


    $$\frac{d\alpha}{dt}=\omega;\qquad \mathbb{I}_m\cdot\frac{d\omega}{dt}=M-\omega\times(\mathbb{I}_m\omega).$$


    Applying backward Euler, we get


    $$\mathbf{X}_b^{n+1}=\mathbf{X}_b^{n}+\delta t\mathbf{u}_b^{n+1}$$


    $$\mathbf{u}_b^{n+1}=\mathbf{u}_b^{n}+\delta t\left(\frac{\rho L^3}{m}\mathbf{F}_{flow}^{n+1}+\frac{1}{Fr}\mathbf{e}\right)$$


    $$\alpha^{n+1}=\alpha^{n}+\delta t\omega^{n+1}$$


    $$\omega^{n+1}=\omega^{n}+\delta t\left(\mathbb{I}_m^{n+1}\right)^{-1}\left(M^{n+1}-\omega^{n+1}\times\left(\mathbb{I}_m^{n+1}\omega^{n+1}\right)\right).$$\n(10.13)


    We next denote $\mathbf{u}^n=\mathbf{u}_h(\mathbf{x},t^n)$, $p^n=p_h(\mathbf{x},t^n)$
    and $\mathbf{w}_h^n=\mathbf{w}(\mathbf{x},t^n)$ as the approximations of the velocity,
    pressure and mesh velocity, respectively at time $t=t^n$, where $\mathbf{x}\in\Omega_h^n$.
    Applying temporal discretization to the Navier-Stokes system (Equation (10.12))
    and to the 6-DOF equations in Equation (10.8), we get a sequence of stationary
    equations:


    For given $\hat{\Omega}_{h}$, $\mathbf{u}_0$, $\mathbf{u}^n$, $\mathbf{w}^n$,
    find $(\mathbf{u}^{n+1},p^{n+1})\in V_h\times Q_h$ and $\mathbf{w}^{n+1}\in H^1\left(\Omega_h(t^{n+1})\right)^3$
    such that for all $(\mathbf{v},q)\in V_h\times Q_h$


    $$\left(\frac{\mathbf{u}^{n+1}-\mathbf{u}^n}{\delta t},\mathbf{v}\right)_h + a_h(\mathbf{u}^{n+1}-\mathbf{w}^{n+1};\mathbf{u}^{n+1},\mathbf{v})
    + b(p^{n+1},\mathbf{v}) = f^{n+1}(\mathbf{v})$$


    $$b(q,\mathbf{u}^{n+1})=0.$$\n(10.14)


    # 10.4.4 Linearization and Solution Process


    Monolithic or partitioned approach can be used to solve the strongly coupled discrete
    systems in Equation (10.13) and (10.14). In the monolithic approach, interactions
    between the fluid and the solid at the interface occur simultaneously and is synchronised
    [27, 28]. Further, the discrete systems in Equation (10.13) and (10.14) will be
    treated as a single system and a non-linear solver is used to solve the non-linear
    system. Moreover, conservation properties could be preserved [29] and the scheme
    will become unconditionally stable. Hence, the admissible time-step size is limited
    only by the required accuracy.'
