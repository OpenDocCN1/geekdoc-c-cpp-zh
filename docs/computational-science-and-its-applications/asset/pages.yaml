    # 16.4 Conclusions


    The study shows that the observed weather variables, i.e. maximum and minimum
    temperature, morning and evening time relative humidity (RHI and RHII), 24-hourly
    rainfall, and past observed yields of rice of previous years over Gorakhpur district,
    through multiple linear regression could be used to develop a yield forecast model,
    five, and even ten, weeks in advance of harvest. The performance of the developed
    yield forecast model was tested and found to be satisfactory. The average error
    calculated for the validation years 2007 and 2008 was found to be 9.54%, which
    is within an acceptable limit of error. Yield forecast for the years 2009 and
    2010 five weeks in advance of harvesting shows the percentage errors of 2.47%
    and 0.13%, while ten weeks in advance of harvesting it shows errors of 3.56% and
    3.50% respectively. The observed errors were, therefore, found to be within an
    acceptable limit. The yield forecast model developed in this study include independent
    weather variables, which indicates the prime dependence of rice yield on these
    weather variables that play a major role in crop growth and production, directly
    or indirectly. Hence, from this chapter we can say that this type of yield forecast
    model can efficiently be used for future yield predictions at a district level
    for various crops like wheat, sugarcane, maize, cereals etc.


