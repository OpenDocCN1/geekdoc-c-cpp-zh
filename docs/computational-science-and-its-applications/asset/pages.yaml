    # 10.2.2 Governing Equations of the Fluid Flow


    Let $\Omega(t)\subset\mathbb{R}^3$ be the time-dependent domain of the fluid around
    the ship (floating structure). We consider a free surface flow in a towing tank
    with a partially submerged ship in the fluid, as shown in Figure 10.2.


    Further, the time-dependent boundary is defined by $\partial\Omega(t):=\Gamma_{in}\cup\Gamma_{out}\cup\Gamma_{wall}\cup\Gamma_s\cup\Gamma_{fs}$,
    where $\Gamma_{in}$ is the inlet boundary, $\Gamma_{out}$ outlet boundary, $\Gamma_{wall}$
    container/tank wall, $\Gamma_s$ ship-fluid interface, and $\Gamma_{fs}$ is the
    free surface as shown in Figure 10.2. The fluid flow around the ship is described
    by the time-dependent incompressible Navier–Stokes equations [9]


    ```

    $$\frac{\partial\mathbf{u}}{\partial t}+(\mathbf{u}\cdot\nabla)\mathbf{u}-\frac{1}{\rho}\nabla\cdot\mathbf{T}(\mathbf{u},p)=\mathbf{g}e
    \quad \text{in }\Omega(t)\times[0,I],$$


    $$\nabla\cdot\mathbf{u}=0 \quad \text{in }\Omega(t)\times[0,I].$$

    ```


    where $\mathbf{u}$, $p$, and $\rho$ denote the fluid velocity, pressure in the
    fluid and density of the fluid, respectively. Here, the stress tensor $\mathbf{T}(\mathbf{u},p)$
    and the velocity deformation tensor $\mathbf{D}(\mathbf{u})$ are given by


    ```

    $$\mathbf{T}(\mathbf{u},p)=-p\mathbf{I}+2\mu\mathbf{D}(\mathbf{u}),\qquad \mathbf{D}(\mathbf{u})=\frac{1}{2}(\nabla\mathbf{u}+\nabla\mathbf{u}^{T}),$$

    ```


    where $\mathbf{I}$ and $\mu$ denote the identity tensor and the viscosity of the
    fluid, respectively and the superscript $T$ is used to denote transpose.


