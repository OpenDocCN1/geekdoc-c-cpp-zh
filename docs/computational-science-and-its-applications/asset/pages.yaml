    classification. Heena Hooda et al have compared three image segmentation techniques—K-Means
    Clustering, Fuzzy C-Means Clustering, and Region Growing—for detection of brain
    tumors and claim that Fuzzy C-Means is the best technique for image segmentation
    out of these techniques. For better accuracy and to shorten the processing time
