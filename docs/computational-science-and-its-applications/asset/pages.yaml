- pgno: 78
  md: '# 3.4 Influence of the Spatial Configuration on the Pace of Evacuation


    We now seek to identify the obstacles that slow the escape of the crowd in the
    aftermath of the initial shock by analyzing the topology of the network of streets
    and places in a city. This information can potentially be used to improve the
    design of a city to facilitate the escape of a crowd towards more secure places.


    # 3.4.1 Scaling the Parameters


    Fixing the value of all the parameters in PCR, WPCR, or CWPCR is a very complicated
    task, which has not yet been done on an experimental basis. In the framework of
    the Com2SiCa project, an experimental protocol is under scrutiny, in order to
    achieve these results in the near future. However, it is important to note that
    only relative values between parameters are important, because there is a relationship
    between the unit of time and the unit used for the parameters. In other words,
    considering all the parameters of the adimensional Equation (3.17), (i.e. B_i
    ≥ 0, C_i ≥ 0, η_{c,i,j}, η_{p,i,j}, η_{r,i,j}, i = 1,2, j = i + 1) integrated
    with respect to the variable time t, it is nearly equivalent to consider such
    parameters multiplied by the same constant κ and integrated using the time variable
    τ = t/κ (e.g. t can be considered in seconds, minutes, or hours). There is not,
    strictly speaking, equivalence because such parameters are linearly used in the
    WPCR model; however in the CWPCR model the coupling is nonlinear and a slight
    distortion intervenes during a transient short period for some variables.


    # 3.4.2 Influence of the Intermediate Place Capacity on the Evacuation Dynamics


