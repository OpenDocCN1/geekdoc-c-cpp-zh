- pgno: 23
  md: '# 1


    # Ingredients for Applied Fourier Analysis


    Hans G. Feichtinger


    # CONTENTS


    +   1.1 Introduction.........................................................1

    +   1.2 The Status Quo.........................................................2

    +   1.3 A Short Historical Glimpse.............................................2

    +   1.4 Ingredients for Applied Fourier Analysis...............................3

    +   1.4.1 The Pre-Assumptions..................................................4

    +   1.5 System Theory and Fourier Transforms..................................5

    +   1.6 The Computational Side.................................................6

    +   1.7 The Goals of Fourier Analysis..........................................6

    +   1.7.1 Spectral Analysis and Synthesis.....................................8

    +   1.8 The Shortcomings of Classical Fourier Analysis.........................9

    +   1.9 A Guide to the Literature..............................................10

    +   1.9.1 Renewal of our Approach to Fourier Analysis.......................10

    +   1.9.2 A Reading List on the Subject.......................................11

    +   1.10 Levels of Explanation................................................14

    +   1.10.1 Limitations of the Approach........................................14

    +   1.11 Arguments for a Limited Distribution Theory..........................15

    +   1.12 Things That Can Be Done Using S₀''(ℝᵈ)...............................16

    +   1.13 Summary................................................................18

    +   Acknowledgments...........................................................19

    +   References................................................................20


    # 1.1 Introduction


    This chapter outlines some ideas of material that should be covered by an application-oriented
    course on Fourier Analysis. It also comments on the topics that are seen as crucial
    for an understanding of Fourier Analysis (beyond the technical treatment of the
    subject). In some sense the article tries to further develop the ideas that have
    been already described in [1].


    The difficulty is to find a balance between pure theory (which may require a huge
    amount of mathematical background and preparation) and the rather formal use of
    mathematical symbols in engineering or physics books. Evidently, this situation
    calls for a reconciliation of the two worlds.


    We consider it as a wrong attitude that good theory does not need to show its
    usefulness for applications, but it is equally misleading to think that applied
    scientists need not worry about a conceptual background when they build their
    devices. Of course, one can proceed'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'for a while using established recipes, but if there is a change of technology,
    or if new possibilities or combinations of existing possibilities arise, then
    a simple experimental exploitation without an underlying concept often proves
    to be cumbersome and inefficient. It is true that engineers or physicists sometimes
    find—based on intuition or experiments—interesting new ways of overcoming existing
    problems, but in the long run those empirical facts have to be complemented by
    a mathematical model in order to capture fine details and to find optimal regimes
    of operation.


    # 1.2 The Status Quo


    The current situation is really deplorable in the sense that pure mathematics
    provides a full-blown theoretical structure far from applications, while applied
    scientists make use of formulas and algorithms based on Fourier analytic methods,
    which are often viewed as a mystery or make use of “non-existent” objects (more
    correctly: not well-defined symbols) like the Dirac delta, described as δ(t) in
    a schematic way to “derive” results of practical relevance.


    Taking this viewpoint further, one can say that distribution theory, especially
    in the form of tempered distributions as introduced by Laurent Schwartz some 70
    years ago ([2]) has become a cornerstone of the mathematical treatment of partial
    differential equations (abbreviated as PDEs), especially through the work of Lars
    Hörmander (starting with [3]), but has found little attention in the engineering
    community, although it is the ideal framework to treat continuous and discrete,
    periodic and non-periodic signals on an equal footing. Abstract Harmonic Analysis,
    as proposed by Andre Weil ([4]) allows an understanding—based on group theoretical
    considerations—of the analogy between the different settings (see also [5] for
    an applied variant of this perspective), but it does not give any hint about the
    connection between the Fourier transform defined for integrable functions on the
    real line (i.e. f ∈ L¹(ℝ)) and its numerical realization using the DFT (discrete
    Fourier transform), usually nowadays in the form of the FFT (as introduced by
    Cooley/Tuckey [6]) of the FFTW ([7]). The connection is sometimes described in
    a rather vague way, starting from a Riemannian sum for the Fourier transform defined
    through the usual integral:


    f̂(s) = ∫_ℝ f(t) e^{-2π i s t} dt,  t, s ∈ ℝ. (1.1)


