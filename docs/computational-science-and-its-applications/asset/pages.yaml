  md: '# 24.2.2 Operational Matrix of Integration


    Let ψ(x) = {ψ1,0,...,ψ1,m/ψ2,0,...,ψ2,m...ψn,0...ψn,m} be the Legendre wavelet.
    Then integration of ψ(x) over interval [0,x] is given by


    ∫₀ˣ ψ(x)dx = P ψ(x)


    where P is square matrix of order 2^{k-1}M and is given by


    P = 1/2^k [ L F F ... F ; 0 L F ... F ; 0 0 L ... F ; ⋮ ⋮ ⋮ ⋱ ⋮ ; 0 0 ... 0 L
    ]


    The matrix P is known as operational matrix of integration. The matrix L and F
    are of order M×M and are given as


    L = [ 1 1/√3 0 ... 0 0 0 ; -√3/3 0 √3/(3√5) 0 ... 0 0 ; 0 -√5/(5√3) 0 ... 0 0
    0 ; ⋮ ⋮ ⋮ ⋮ ⋮ ⋮ ⋮ ; 0 0 0 ... -√(2M-3)/[(2M-3)√(2M-5)] 0 √(2M-3)/[(2M-3)√(2M-1)]
    ; 0 0 0 ... 0 -√(2M-1)/[(2M-1)√(2M-3)] 0 ]


    F = [ 2 0 ... 0 ; 0 0 ... 0 ; ⋮ ⋮ ⋮ ⋮ ; 0 0 ... 0 ]


    # 24.3 Numerical Technique


    In the Volterra problem the solution f(x), x ∈ [0,1) on interval [0,x] depends
    only on the values of g(x) on this interval but for the non-Volterra problem the
    values on interval (x,1] are also used i.e., it also uses future data values.
    The classical regularization method converts the Volterra problem into a non-Volterra
    problem. To overcome the difficulty arising in classical regularization techniques,
    local regularization methods are used. We have used a local regularization method
    to find the approximate solution to the ill-posed Volterra problem. A brief introduction
    to local regularization methods is given in this section.'
