- pgno: 167
  md: 'and $Q_{\frac{n}{2}}$ curvature is defined using analytic continuation in the
    above formulae.


    Similar to Gaussian curvature, the change of $Q_{\frac{n}{2}}$ curvature under
    a conformal change of the metric is governed by the GJMS operator. Let $\tilde{g}=e^{2u}g$
    be a conformal metric on $(M,g)$, then $Q_{\frac{n}{2},g}$ and $Q_{\frac{n}{2},\tilde{g}}$
    are related by the relation


    $$P_{\frac{n}{2},g}(u)+Q_{\frac{n}{2},g}=Q_{\frac{n}{2},\tilde{g}}\,e^{nu}\tag{9.18}$$


    One can easily see that solutions of the above equations are the critical points
    of the energy $J$ given by


    $$J(u)=\frac{1}{2}\int_{M}P_{k}(u)u\,dV_{g}+\int_{M}Q_{k,g}u\,dV_{g}-\frac{1}{N}\int_{M}Q_{k,\tilde{g}}e^{nu}\,dV_{g}\tag{9.19}$$


    where $k=\frac{n}{2}$.


    A natural space where one would like to pose this functional is the space where
    $\int_{M}P_{k}(u)u\,dV_{g}<\infty$. Then one would like to know whether we can
    control $\int_{M}e^{nu}\,dV_{g}$ in terms of $\int_{M}P_{k}(u)u\,dV_{g}$. We answered
    these questions positively in [24]. We will briefly discuss the main results.


    First let us recall the definition of the Sobolev space $H^{k}(\mathbb{H}^{n})$.
    We define the space $H^{k}(\mathbb{H}^{n})$ as the completion of $C_{c}^{\infty}(\mathbb{H}^{n})$
    with respect to the norm


    $$||u||_{H^{k}(\mathbb{H}^{n})}:=[\sum_{m=0}^{k}\int_{\mathbb{H}^{n}}|\nabla_{g}^{m}u|_{g}^{2}\,dv_{g}]^{\frac{1}{2}},$$


    It is well known that we have the Poincaré inequality


    $$\left(\frac{n-1}{2}\right)^{2}\int_{\mathbb{H}^{n}}u_{g}^{2}\,dv_{g}\le\int_{\mathbb{H}^{n}}|\nabla_{g}u|_{g}^{2}\,dv_{g}$$


    holds for all $u\in H^{1}(\mathbb{H}^{n})$. We also have


    $$\int_{\mathbb{H}^{n}}|\nabla_{g}u|_{g}^{2}\,dv_{g}=\int_{\mathbb{H}^{n}}- (\Delta_{g}u)u\,dv_{g}\le\left(\int_{\mathbb{H}^{n}}|\Delta_{g}u|^{2}\,dv_{g}\right)^{\frac{1}{2}}\left(\int_{\mathbb{H}^{n}}u^{2}\,dv_{g}\right)^{\frac{1}{2}}$$


    Combining the above two inequalities and an induction argument gives us the following
    higher order Poincaré type inequality:


    Let $k,l$ be non-negative integers such that $l<k$, then


    $$\left(\frac{N-1}{2}\right)^{2(k-l)}\int_{\mathbb{H}^{n}}|\nabla_{g}^{l}u|_{g}^{2}\,dv_{g}\le\int_{\mathbb{H}^{n}}|\nabla_{g}^{k}u|_{g}^{2}\,dv_{g}$$


    holds for all $u\in H^{k}(\mathbb{H}^{n})$.'
