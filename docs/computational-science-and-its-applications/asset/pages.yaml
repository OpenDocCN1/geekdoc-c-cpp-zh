- pgno: 48
  md: "techniques apply to problems of sewer systems, freshwater networks, irrigation\
    \ systems, as well as traffic networks.\n\nWe depart from a full space–time formulation\
    \ of the problem with both discrete and continuous controls. After that we discretize\
    \ the problem with respect to time using a simple implicit Euler step, for the\
    \ sake of brevity. The corresponding optimal control problem, which still involves\
    \ all time-steps is then reduced to what has come to be known as an instantaneous\
    \ control problem that is defined on a single time-step, thereby decoupling the\
    \ time history. The resulting optimal control problem can be viewed as a nonlinear\
    \ (semi-linear or even linear) elliptic optimal control problem on the network.\
    \ The network, in turn, is then decomposed into small subnetworks even to single\
    \ links. As a result, at the core of the approach, elementary problems can be\
    \ solved very effectively.\n\nClearly, in this chapter, we can only indicate the\
    \ procedure and refer to mathematically rigorous results from the literature whenever\
    \ possible and feasible.\n\nTo this end, we consider the Euler equations consisting\
    \ of the continuity equation, the balance of moments, and the energy equation.\
    \ (cf. [1, 2, 3, 4]) We denote by ρ the density, by v the velocity of the gas,\
    \ and by p the pressure. We define λ as the friction coefficient of the pipe,\
    \ D the diameter, a the cross section area. The unknowns of the system are given\
    \ by ρ and the flux q = aρv. We also denote by c with c² = ∂p/∂ρ (for constant\
    \ entropy) the speed of sound. For horizontal pipes\n\n```\n∂ρ/∂t + ∂/∂x (ρv)\
    \ = 0\n∂/∂t (ρv) + ∂/∂x (p + ρv²) = - λ/(2D) ρv|v|.\n(2.1)\n```\n\nIn the particular\
    \ case, where we have a constant speed of sound c = √(p/ρ), for small velocities\
    \ |v| ≪ c, we arrive at the semi-linear model\n\n```\n∂ρ/∂t + ∂/∂x (ρv) = 0\n\
    ∂/∂t (ρv) + ∂p/∂x = - λ/(2D) ρv|v|.\n(2.2)\n```\n\n# 2.1.2 Network Modeling\n\n\
    Let G = (V, E) denote the graph of the gas network with vertices (nodes) V = {n_j\
    \ : j ∈ \U0001D4A5, |\U0001D4A5| = |V|} and edges E = {e_i : i ∈ ℐ, |ℐ| = |E|}.\
    \ We associate to each edge a direction. To this end, we introduce the edge-node\
    \ incidence matrix\n\n```\nd_ij = { -1, if node n_j is the left node of the edge\
    \ e_i,\n          +1, if node n_j is the right node of the edge e_i,\n       \
    \   0,  else. }\n```\n\nIn contrast to the classical notion of discrete graphs,\
    \ the graphs considered here are known as metric graphs, in the sense that the\
    \ edges are continuous curves. In fact, we consider here straight edges, along\
    \ which differential equations hold. The index set of all edges incident"
  merge: -1
  img_proc: true
- pgno: 49
  md: 'at node $n_j$ is $i \in \mathcal{I}_j := \{i \in 1,\dots E \mid d_{ij} \neq
    0\}$. We introduce the edge degree $d_j := |\mathcal{I}_j|$ and distinguish between
    multiple nodes $\{n_j : d_j > 1\} = \{j \in \mathcal{J}^M\}$ and simple nodes
    $\{n_j : d_i = 1\} = \{i \in \mathcal{J}^S\}$. We decompose the set of simple
    nodes into Dirichlet nodes $\mathcal{J}_D^S$ and Neumann nodes $\mathcal{J}_N^S$.
    At multiple nodes, we assume continuity conditions


    ```

    $p_i(n_j,t)=p_k(n_j,t),\ \forall i,k \in \mathcal{I}_j,\ j \in \mathcal{J}^M,\
    t \in (0,T).\qquad (2.3)$

    ```


    The nodal balance for the fluxes can be written as


    ```

    $\sum_{i \in \mathcal{I}_j} d_{ij} q_i(n_j,t)=0,\ j \in \mathcal{J}^M,\ t \in
    (0,T).\qquad (2.4)$

    ```


    We assume that valves and compressors are serial nodes $n_j$ i.e. $j \in \mathcal{J}^M$
    with $d_j=2$. At such a node we have an incoming edge with unique index $i \in
    \mathcal{I}_j^+$, where $\mathcal{I}_j^+ := \{i \in \mathcal{I}_j : d_{ij}=1\}$,
    and an outgoing edge with unique index $k \in \mathcal{I}_j^- := \{i \in \mathcal{I}_j
    : d_{ij}=-1\}$. We label compressor and valve nodes by $\mathcal{J}_c,\mathcal{J}_v$,
    respectively.


    With this, we now provide the network model of Equation (2.2).


    ```

    $\partial_t p_i(x,t)+\frac{c_i^2}{a_i}\partial_x q_i(x,t)=0,\quad i \in \mathcal{I}$


    $\partial_t q_i(x,t)+\partial_x p_i(x,t)=-\frac{\lambda c_i^2}{2D_i a_i^2}\frac{q_i(x,t)|q_i(x,t)|}{p_i(x,t)}\quad
    i \in \mathcal{I}$


    $p_i(n_j,t)=p_k(n_j,t),\quad j \in \mathcal{J}^M\setminus(\mathcal{J}_c \cup \mathcal{J}_v),\
    i,k \in \mathcal{I}_j$


    $g_j(p_i(n_j,t),q_i(n_j,t))=u_j(t),\quad j \in \mathcal{J}^S,\ i \in \mathcal{I}_j$


    $\sum_{i \in \mathcal{I}_j} d_{ij} q_i(n_j,t)=0,\quad j \in \mathcal{J}^M\qquad
    (2.5)$


    $s_j^v(t)\big(p_i(n_j,t)-p_k(n_j,t)\big)+(1-s_j^v(t))q_i(n_j,t)=0,\quad j \in
    \mathcal{J}_v,\ i \in \mathcal{I}_j^-,\ k \in \mathcal{I}_j^+$


    $s_j^c(t)\left(u_j - C\left(\left(\frac{p_k(n_j,t)}{p_i(n_j,t)}\right)^{\operatorname{sign}(q_k(n_j,t))\kappa}
    -1\right)\right)+(1-s_j^c(t))\big(p_i(n_j,t)-p_k(n_j,t)\big)=0,\quad j \in \mathcal{J}_c,\
    i \in \mathcal{I}_j^-,\ k \in \mathcal{I}_j^+$


    $p_i(x,0)=p_{i,0}(x),\ q_i(x,0)=q_{i,0}(x),\quad i \in \mathcal{I}$

    ```


    It is obvious from Equation (2.5) that for $s_j^v(t)=1$, i.e. the case in which
    the valve at node $n_j$ is open, the classical transmission conditions hold, while
    for $s_j^v(t)=0$, the outgoing flow and—according to the Kirchhoff condition,
    which still holds—the incoming flow is zero. Similarly, for $s_j^c(t)=1$, the
    compressor is active, resulting in pressure control such that the pressure in
    the outgoing pipe is increased with respect to the pressures of the incoming pipes.
    Equation (5) is an example of a dynamical system evolving on a metric graph according
    to discrete and continuous controls. To the best knowledge of the author, Equation
    (2.5) with switching functions $s_j^v(t),s_j^c(t)\in\{0,1\}$, even for simple
    but non-trivial networks has not been considered for the semilinear problem so
    far. Even smooth relaxations of the discrete control variables $s_j^v(\cdot)$
    and $s_j^c(\cdot)$ do not seem to have been investigated for that system. See
    [5] for a more detailed discussion.'
