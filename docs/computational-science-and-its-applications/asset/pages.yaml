- pgno: 235
  md: "![](img/81c56bc4b2fca1951aff5e0ab85b66be_235_0.png)\n\n**FIGURE 13.2**  \n\
    10–20 International System for the electrode placement of data acquisition data.\n\
    \nWavelet transform is a time–frequency analysis tool widely used in signal processing.\
    \ The wavelet transformation is well suited to representing various aspects of\
    \ EEG signals such as trends, discontinuities, and repeated patterns where other\
    \ signal processing approaches fail. Wavelet is an effective time–frequency tool\
    \ for analyzing transient signals. In the wavelet transform (WT) case, WT employs\
    \ a windowing technique with variable-size windows. Wavelets are mathematical\
    \ functions that cut up data into different frequency components, and then study\
    \ each component with a resolution matched to its scale.\n\nIn both continuous\
    \ and discrete forms of wavelet analysis, the signal is decomposed into scaled\
    \ and translated versions $(\\psi_{a,b}(t))$ of a single function $\\psi(t)$ called\
    \ a mother wavelet:\n\n$$\\Psi_{a,b}(t)=\\frac{1}{\\sqrt{|a|}}\\Psi\\left(\\frac{t-b}{a}\\\
    right)$$  \\qquad (13.1)\n\nWhere $a$ and $b$ are the scale and translation parameters\
    \ respectively $a,b\\in\\mathbb{R}$ and $a\\neq0$.\n\nIf a signal $f(t)$ is a\
    \ square integrable function of time, i.e., $f\\in L^2(\\mathbb{R})$ (the space\
    \ of finite energy signals), then the continuous wavelet transform (CWT) of the\
    \ signal is defined as\n\n$$W(a,b)=C_{a,b}=\\int_{-\\infty}^{\\infty}f(t)\\frac{1}{\\\
    sqrt{|a|}}\\psi^*\\left(\\frac{t-b}{a}\\right)dt=\\langle f,\\psi_{a,b}\\rangle$$\
    \  \\qquad (13.2)\n\nwhere $\\langle\\cdot,\\cdot\\rangle$ means the inner product\
    \ and the symbol ‘*’ means complex conjugate. The factor $1/\\sqrt{|a|}$ is used\
    \ to normalize the energy so that it stays at the same level for different values\
    \ of $a$ and $b$.\n\nThe discrete wavelet transform (DWT) is obtained by discretizing\
    \ the parameters $a$ and $b$. We may choose $a=2^{-j}, b=k2^{-j}$ with $j,k\\\
    in\\mathbb{Z}$. By substituting this in Equation (13.1) We get\n\n$$\\Psi_{j,k}(t)=2^{j/2}\\\
    Psi(2^jt-k).$$  \\qquad (13.3)"
