  md: 'joint replacement had a life of about 15 to 20 years and was prescribed to
    patients above 60 years of age, now the reliability of UHMWPE in cases of orthopedic
    surgery has increased. Currently, many research studies are being carried out
    to improve the mechanical properties of medical-grade UHMWPE which can potentially
    increase the longevity of the joint components.7 8 The global market size of UHMWPE
    was estimated at USD 1.33 billion in 2016, and Grand View Research Inc. reported
    that the market is expected to reach at USD 2.60 billion by 2022.9 10


    In medical applications, however, UHMWPE is subject to ionizing radiation, in
    the form of electron beam (e-beam) or gamma rays, for two basic reasons: One is
    to crosslink the long-chain molecules, and the other is to sterilize the finished
    products. Although the gamma sterilization technique has several advantages over
    other sterilization techniques, its strong penetrating radiation breaks the bonds
    of polymer chains and produces highly reactive free-radical species—in the core,
    as well as in/at the surface—of a UHMWPE component.11-13 Some free radicals may
    also get trapped for long periods of time in the crystalline region of the polyethylene
    matrix, and then initiate long-term oxidation reactions with oxygen as it diffuses
    into the polyethylene. These free radical reactions ultimately lead to increased
    material degradation/wear and, ultimately, joint failure.14-17 Free-radical induced
    degradation may also continue when the sterilization process (of the finalized
    products) involves gamma-radiation that is then stored in packages containing
    air (oxygen).17, 18 To mitigate the oxidation and its subsequent adverse effects
    on the mechanical properties and wear of UHMWPE, gamma-sterilization of the joint
    components can be performed in vacuum-packaging or inert-gas packaging.19 However,
    when implanted, in vivo oxidation is still possible in a body-fluid environment.20
    As for crosslinking via gamma-irradiation, to reduce in vivo oxidation, thermal
    annealing or melting of UHMWPE joint components in vacuum or in an inert gas can
    be used to stabilize the free radicals.21 Nonetheless, questions remain about
    the optimum temperature and annealing time and their effect on material properties.
    Figure 4.1 outlines the impact of gamma sterilization of medical-device components
    in the presence or absence of oxygen.


