    # 1.10 Levels of Explanation


    When proposing an alternative approach with simplified methods one has to address
    a number of questions.


    First of all, in some cases it is necessary but fortunately also possible to use
    simplified definitions. For example, it should not be required to make use of
    Lebesgue integration for the definition of the space of test function (so it will
    not be defined a priori as a subspace of L²(ℝᵈ) or L¹(ℝᵈ), but rather using spaces
    of continuous and Riemann integrable functions. Based on this one can introduce
    a suitable space of distributions, which are described either as the weak limits
    of ordinary functions or the elements of the dual space of the (normed, in fact
    Banach) space of test functions, which can be embedded into this dual space in
    a natural way (using the Haar measure on ℝᵈ, i.e. the Riemann integral).


    In a further step one has to relate the new approach to the well-established approach.
    For example, the set of distributions which can be approximated by test functions
    through bounded sequences of integrable functions (e.g. in the distributional
    sense) can be identified with the Lebesgue space (L¹(ℝᵈ), ‖·‖₁), due to the uniqueness
    of the completion of a normed space, in this case the space of test functions
    (or just C_c(ℝᵈ)), endowed with the k ↦ ‖k‖₁, defined using the Riemann integral.


    It is clear that in some cases the justification of certain simplifications itself
    will not be possible using elementary methods. Instead one will have to relate
    abstract results (involving arguments concerning topological vector spaces, e.g.
    dual spaces with weak or w*-convergence) to equivalent ways to describe convergence
    (e.g. using sequences only). Of course, this discussion has to be carried out
    in the background, and only once, until it is clear that a teacher using the simplified
    method is not defining simplified objects but rather provides a simplified description
    of the (mathematically) correct objects.


    # 1.10.1 Limitations of the Approach


    First of all, let us mention that it has been already recognized by e.g. A. Papoulis
    (see the preface to his book [44] published in 1962) that distribution theory
    is potentially important for engineers interested in signal processing or communication
    theory, but that the theory as proposed by Laurent Schwartz is considered too
    cumbersome, so that he gave a short summary as an Appendix, somehow better accessible
    to a mathematically educated engineer. There are also, of course, other attempts
    to simplify the approach to distribution theory by using e.g. the sequential approach
    (as promoted by Lighthill, see [45]), but in such a setting some of the important
    results are again cumbersome to prove and the independence of the representative
    sequence defining a generalized function is a boring and repetitive task that
    one should avoid. Sometimes, of course, the topological setup combined with operational
