    # 23.1 Introduction


    Computational linguistics is the scientific discipline concerned with understanding
    written and spoken language from a computational perspective, and building devices
    that usefully process and produce language in various settings. It is basically
    a branch of linguistics which deals with applications of techniques of computer
    science to the analysis and synthesis of language and speech. It can also be understood
    as a conglomerate of mathematics and linguistics with computer science. As far
    as it is known, language is a mirror of mind and a computational understanding
    of language provides insight into'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'thinking and intelligence. Language being our most natural and versatile means
    of communication, linguistically competent computers greatly facilitate our interaction
    with machines and software of all sorts.


    To have a better understanding of computational linguistics, knowing what linguistics
    is, is a prerequisite. A brief introduction to linguistics follows.


    # 23.2 What is Linguistics?


    Language is one of the fundamental aspects of human behavior and a major component
    of our lives. In written form it serves as a long-term record of knowledge from
    one generation to the next. In spoken form it serves as our primary means of coordinating
    our day-to-day interaction with others. Linguistics is the scientific study of
    language. Anderson calls linguistics a science because the discipline of linguistics
    consists of a set of true facts that can be proven objectively; it uses scientific
    methods in its various dealings; and it uses empirical evidences to develop theories
    of language (Anderson 2018). The study of linguistics involves an analysis of
    language form, language meaning, and language in context. Therefore, the approach
    of linguists is of a descriptive, not a prescriptive kind (Anderson 2018). Their
    work is to understand why human language is the way it is. They do not prescribe
    rules to be followed but describe language in all aspects.


    # 23.2.1 Core Areas of Linguistics


    The core areas of linguistics are phonetics, phonology, morphology, syntax, semantics,
    and pragmatics (Crystal 2008).


    +   - **Phonetics:** It is the subfield of linguistics that deals with the physical
    aspect of sounds. It involves the study of characteristics of human sound production
    and provides methods for their description, classification, and transcription.

    +   - **Phonology:** It deals with the sound systems of specific languages focusing
    on the study of the patterns of distinctive sounds found in a language and generalizing
    the nature of sound systems in the languages of the world.


    Phonetics and phonology are the study of language at the level of sounds.


    +   - **Morphology:** It is the study of language at the level of words dealing
    with the formation of words from smaller units called morphemes.

    +   - **Syntax:** Syntax is the study of language at the level of sentences. It
    is the subfield of linguistics that studies the rules governing the ways in which
    words combine to form sentences.

    +   - **Semantics:** It is the subfield of linguistics that deals with the study
    of meaning in the language.

    +   - **Pragmatics:** Pragmatics is the study of language meaning and use in context.
    It is the study of language from the point of view of the speakers, the choices
    they make, the problems they come across while using language in social situations
    and the effect their use of language has on others (Figure 23.1).'
