    +   7.5 Simulation of Conformable Fractional Derivative of Shannon Wavelet and
    Scaling Function ...................................................................110

    +   7.6 Simulation of Conformable Fractional Derivative of Sine-Cosine Wavelet
    ...............112

    +   7.7 Road Map of Future Research Work...................................................................113

    +   References................................................................................................................113


    # 7.1 Introduction


    A differential equation, an equation relating a function with its derivatives,
    is a powerful tool to model real-world problems. It is frequently used in all
    sciences and different branches of engineering and technology. It is well known
    that first and second classical derivatives denote fundamental concepts of physics
    such as velocity and acceleration. The calculus dealing with positive integer
    derivatives was developed by Newton, Leibniz, and Gauss et al. Since the invention
    of integer derivatives the concept of fractional derivative like half derivative
    d^{1/2}y/dx^{1/2} was known to L’Hospital as far back as 1695. Those fractional


    derivatives and fractional calculus including fractional deferential equations
    have a history of more than 300 years. Several eminent mathematicians like Liouville,
    Riemann, Weyl Fourier, Abel, Leibniz, Grunwald, and Letnikov have actively worked
    in this field. Mathematicians and scientists were curious to know the physical
    meaning of fractional derivatives like half derivative, πth, and imaginary derivative.
    This question was raised since the days of L’Hospital but for centuries no satisfactory
    answer could be given. During the last few decades this theme has developed rapidly.
    Nowadays, the fractional calculus including fractional differential equations
    attracts many scientist and engineers. There are several applications of this
    mathematical phenomena in mechanics, physics, chemistry, control theory, and so
    on. It is natural that many authors tried to solve the problems concerning fractional
    derivatives, fractional integral and fractional differential equations in MATLAB®.'
