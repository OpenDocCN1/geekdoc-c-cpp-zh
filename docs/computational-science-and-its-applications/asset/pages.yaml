    # 15.1 Introduction


    Cloud computing is an Internet-based technology which is providing resource utilization
    in communication system. In cloud computing the end-user is not conscious with
    regard to where data is stockpiled and how their data is being developed. They
    only admit data, proceed, and lastly, store in the cloud database. They may have
    the right to use the data at anytime, anywhere, if they are using internet communications.
    This technology is extremely flexible, scalable, and allocated in the cloud environment.
    In cloud computing computational sources are delivered to the client as a facility
    (Almorsy et al. (2016)). In the proposed framework, we followed the NIST characterization
    of cloud computing, a model for enabling convenient on-demand network access to
    a shared pool of configurable computing resources that can be rapidly provisioned
    and released with minimal management effort or service-provider interaction (Zhang
    et al. (2010)). Cloud computing technologies are divided into several services,
    such as: Infrastructure as a service, Platform as a service, Integration Platform
    as a service, Block-chain as a service, Software as a service,'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Mobile backend as a service, Serverless computing, and Function as a service
    (Dinesha and Agrawal (2012); Jing and Jian-Jun (2010)).


    In the cloud environment, outside attackers have to have a whole authentication
    procedure made necessary by the service producer, whenever they use the cloud
    facility. Frequently, a client registers through individual data, and a service
    supplier offers a client''s acquired identifier and a validation technique in
    favor of client authentication once a registration is completed. In 2009, Yang
    and Chang (2009) suggested an ID-assisted authentication framework for mobiles
    which is based on ECC. In 2011, Chen et al. (2011) suggested an ECC-assisted authentication
    framework for cloud atmosphere and Chang and Choi (2011) a client authentication
    work for cloud system. After that, the user makes use of the identity and the
    authentication technique to work the client authentication whenever the customer
    starts to use cloud facilities (Nayak et al. (2012)). Mishra et al. (2013) and
    Khan et al. presented identity-based authentication schemes for the cloud environment;
    these show identity-based authentication and security in the cloud environment
    using different approaches. In 2017, Luo et al. presented an ID-based efficient
    authentication framework with a smart card applying ECC (Luo et al. (2017)). In
    2018, Kumar et al. (2019b, 2018) suggested cloud-assisted authentication protocols
    in telecare medical information systems.


    # 15.1.1 Research Contribution


    We proposed a mutual authentication framework in the cloud computing environment.
    The proposed protocol has many security features and attributes. This work discusses
    characters such as:


    +   - The mutual authentication property is satisfied between user and cloud server
    and manages security issues in cloud computing.

    +   - Further, the proposed framework is strong against known session-specific
    at-tack, known-key attack, reflection attack, and unknown key-share attack, support
    anonymity, replay attack, no key control, PKG forward secrecy, key freshness,
    man-in-the-middle attack, message authentication, and off-line guessing attack.

    +   - We evaluated the proposed framework with other presented protocols in the
    same domain and show that it is more secure.


