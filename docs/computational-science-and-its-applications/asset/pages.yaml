    that K is a singleton. Suppose inf C = t_o > 0. Consider x_o ∈ W(x, k_o, t_o)
    such that d(x_o, x) = t_o d(x, k_o)). We claim that there exist ε_o > 0 such that
    d(x_o, k) < d(x_o, k_o) − ε_o for every k ∈ K / {k_o}. If not, then there exists
