    # Step 4. The inference of Decision Query


    The clinician’s decision requirement imitates his/her belief in the situation
    information input and inference inside the cognitive computing agent. Situation
    information is stored in the data warehouse (Chandiok and Chaturvedi, 2016). Thus,
    information inference is one of the important features of a cognitive computing
    system. We define inference decision (I(K(E)) as follows:


    # Definition 17.4. Inference for Decision Query I(K(E)) shown in Eq. (17.8):


    I(K(E)) := I{Q₁, Q₂, ..., Qₙ} => D, n ≥ 0, (17.8)


    Where, Qᵢ is a query and the inference I(Q) outcomes in a set of decisions (D)
    based on the rankings. Rendering to this definition, the generation of inference
    is equal to the creation of the relevant decision.


    # 17.6 Summary


    This chapter presents intelligent agent, cognitive agent, and cognitive computing
    agent architectures for building intelligent applications. The cognitive computing
    agent framework performs best in developing decisions for future intelligent applications.
    The cognitive computing agent framework outlines two elementary features of a
    cognition-based decision development: cognitive agent and cognitive computing
    framework. According to this framework, the model proposes four features. The
    four important features of the model are knowledge creation, query understanding,
    knowledge retrieval, and inference.


    In this sense, the cognitive computing agent decision method is determined by
    human-like cognition for achieving the best decision. Although the cognitive computing
    agent model is autonomous and its application does not depend on a specific field,
    the discussion of this model is grounded in the clinical domain for the sake of
    practical understanding. We believe the cognitive computing agent model can extend
    into other domains, such as finance, business, and education. This chapter embodies
    the theoretical as well as the practical portion of this cognition decision support
    for developing intelligent applications. Surely, cognitive computing agents are
    the future for building intelligent applications.'
