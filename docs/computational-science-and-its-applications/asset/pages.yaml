    # 20.1 Introduction


    In the medical domain, many critical human diseases are making an appearance.
    CT scans, MRI images, and ECGs are well-known tools used for the detection of
    such human diseases [1]. The utilization of MRI is very important in view of its
    major feature of soft tissue discretization, high contrast and high spatial resolution
    , and the fact that no harmful ionizing radiation is used for imaging [2]. Our
    work deals with the classification of tumor and non-tumor MRI images of the brain.
    A brain tumor is one of the major reasons for death. It is caused due to abnormal
    growth of cells in the brain. To spot the presence of a tumor,'
