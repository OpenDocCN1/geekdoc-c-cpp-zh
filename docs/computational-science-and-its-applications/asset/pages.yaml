- pgno: 50
  md: 'Note that we can replace the transmission conditions at the compressor node
    by the bilinear transmission conditions as follows:


    u_j - C\left(\left(\frac{p_k(n_j,t)}{p_i(n_j,t)}\right)^{\frac{\operatorname{sign}(q_k(n_j,t))}{\kappa}}
    -1\right)=0


    \Leftrightarrow \left(\frac{u_j + C}{C}\right)^{\frac{1}{\kappa}\operatorname{sign}(q_k(n_j,t))}=\frac{p_k(n_j,t)}{p_i(n_j,t)}.


    If we replace u_j by


    u_j := \left(\frac{u_j + C}{C}\right)^{\frac{1}{\kappa}\operatorname{sign}(q_k(n_j,t))}


    and ensure u_j \ge 1, the original transmission condition at the compressor node
    can be replaced with


    p_i(n_j,t)u_j(t) - p_k(n_j,t)=0


    if the compressor is active. Otherwise, the classical continuity condition for
    the pressure holds. This is then a bilinear boundary control. Even in this simplified
    version, such problems have not been considered rigorously so far. This already
    indicates that a lot of interesting mathematical problems can be derived from
    the context of applications.


    # 2.2 Optimal Control Problems and Outline


    We now formulate optimal control problems. In real industrial gas-network applications,
    there are two types of controls to be considered: optimizing decision variables
    such as on-off states for valves and compressors, zero full-supply, and demand
    variables for input and exit nodes and continuous profile nodal controls. Valves
    and compressors, in turn, can be modeled as transmission conditions at a serial
    node, as above (see [5, 6, 7]). We now describe the general format for an optimal
    control problem associated with the semi-linear model equations.


    \min_{(p,q,u,s)\in\Xi} I(p,q,u,s) := \sum_{i\in\mathcal{I}} \int_0^{T''} \int_0^{l_i}
    L_i(p_i,q_i,u_i,s_i) dx dt + \frac{\nu}{2} \sum_{j\in\mathcal{S}} \int_0^{T} |u_j(t)|^2
    dt + \frac{\mu}{2} \sum_{j\in\mathcal{J}_0\cup\mathcal{J}_C} \int_0^{T} s_j(t)^2
    dt


    s.t.


    (p,q,u,s) satisfies (2.5),


