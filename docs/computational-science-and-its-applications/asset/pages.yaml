    # 20.4 The Kernel Trick


    Sometimes linear classification is not a possibility, not even with a fair amount
    of slack. This issue can be handled with something called a kernel trick [15,29].
    The kernel trick basically takes all the points and maps them into a higher dimensional
    space. To do so, a kernel K is defined such that points x and x′ have a kernel
    value K(x; x′) which is equal to an inner product of Φ) and Φx′). That is


    $$K(x,x'') = (\Phi(x), \Phi(x''))$$ (20.6)


    In practice, this means that instead of using x in Equation (20.6) we will use
    Φ). In this work, we have applied Linear, Quadratic, and Radial Basis Function
    (RBF) kernel, sometimes also known as a Gaussian kernel. It can be thought of
    simply as a transformation of x into an infinite dimensional space, allowing the
    linear classification which is the basis of SVM.


    # 20.5 Training


    The training and the testing are the two important parts of the classification
    process. For the step of training, the set of data which is already known are
    fed to the algorithm that is used for classification. For this experiment 96 MRI
    pictures have been used for the training of the classifier.


    # 20.6 Testing


    In the testing step the dataset other than the training is get to the classifier.
    The classification is done after the training part; the efficiency of the training
    is responsible for error rates and the success rate of the classification. For
    the testing set, 24 unknown MRI images are taken, out of which how many are correctly
    detected and how many are incorrectly detected is analyzed.'
