  md: '# 13.3 Materials and Methods


    Biomedical signals carry information of physiological events. The part of a signal
    related to a specific event and the analysis of a signal helps in monitoring and
    diagnosis of problems related with particular disease [10–13]. When an event is
    identified, the corresponding waveform may be analyzed in terms of its amplitude,
    waveshape, time duration, energy distribution, frequency contents, and so on.
    Event detection is an important part of biomedical signal analysis. To reveal
    the pattern of electrical activity of the heart, doctors use electrocardiogram
    (ECG); to detect abnormal activity of muscles, electromyogram (EMG) is used; and
    to record the electrical activity of the brain, electroencephalogram (EEG) is
    widely used.


    EEG rhythms or frequency bands are as follows:


    Delta (δ): 0.5 ≤ f < 4 Hz; Theta (θ): 4 ≤ f < 8 Hz; Alpha (α): 8 ≤ f ≤ 13 Hz;


    and, Beta (β): f > 13 Hz.


    These bands make a significant contribution in the identification of brain abnormalities
    but it is not easy to read them or classify them without the appropriate tool.
    To understand them properly, computer-aided digital filter design and hidden mathematics
    would be required. In Figure 13.1 different lobes of the brain are shown. The
    occipital lobe is responsible for seeing. Alpha waves (8–13 Hz) are clearest in
    this lobe. The frontal lobe is responsible for consciousness and thoughts. Beta
    waves, which have a range greater than 13 Hz, are often found in the frontal lobe.
    Delta waves are the slowest waves, but with the strongest signal of highest amplitude
    having a frequency up to 4 Hz. This wave is common in children below one year
    of age. Gamma waves are of the frequency 26–100 frequencies. Theta waves are between
    the frequencies 4–7 Hz. These waves are called ‘slow activity’ and occur during
    sleep in young children [30]. The EEG dataset that is used here is based on the
    10–20 International System as shown in Figure 13.2.


    In this chapter EEG is used as an input to diagnose and classify diseases along
    with the computer tool MATLAB®. Wavelet transform will serve the purpose of mathematical
    insight of disease.


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_234_0.png)


    FIGURE 13.1

    Anatomical region showing lobes of mammalian brain.'
