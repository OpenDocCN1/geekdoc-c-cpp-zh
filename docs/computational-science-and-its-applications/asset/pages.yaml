- pgno: 69
  md: 'that satisfies the following properties


    ```

    r(t₀) > 0, c(t₀) > 0, p(t₀) > 0, q(t₀) > 0, b(t₀) > 0  (3.10)

    ```


    We suppose that the characteristic parameters B₁, B₂, C₁, C₂, of each node have
    the same value, because they depend on cultural and psychological factors specific
    to each individual rather than to spatial configurations and crowd context. It
    is why we use function Φᵢ instead of function Φₖ,ᵢ.


    # 3.2.3 Transitional Dynamics


    Both forcing functions, γ and φ respectively, model the beginning of the disaster
    and the return to a quiescent daily behavior. Their shape can be adapted to various
    scenarios. When t is sufficiently large, they satisfy γ(t)=φ(t)=1. In catastrophic
    situations it is considered that γ is a stiff function, ranging from 0 to 1 in
    a very brief interval of time (Verdière et al. 2014, 2015, Cantin et al. 2016)
    because if we consider a bomb attack, the entire crowd that is near the explosion
    passes from daily to reflex behavior in an instant, and it takes a very long time
    for people to return to their normal state.


    Therefore, one can suppose that a terror attack is shaped by two characteristic
    times: tₛ (for start) and tₑ (for end) with t₀ < tₛ < tₑ for which


    ```

    γ(t) = 1,    ∀t ≥ tₛ

    φ(t) = 0,    ∀t < tₑ  (3.11)

    ```


    As an example for I_trans = [3.2, 43.2], these functions can be defined by


    ```

    φ(t) = { 0, if 0 ≤ x < 43.2

    cos²(2π (x-3.2)/160), if 43.2 ≤ x ≤ 83.2,

    1, if x > 83.2 }  (3.12)

    ```


    ```

    γ(t) = { cos²(2π (x-3.2)/12.8), if 0 ≤ x ≤ 3.2,

    1, if x > 3.2 }  (3.13)

    ```


    There are displayed in Figure 3.4.


    Following Cantin et al. (2016) we keep the term transitional dynamics for the
    dynamics of the PCR model (likewise for both improved WPCR and the CWPCR model
    presented in Section 3.3) in the interval of time I_trans = [tₛ, tₑ] (in terror
    attacks this interval of time can last from several minutes up to hours, as observed
    during the 2016 terrorist attack in Nice). Therefore in ∀t ∈ I_trans functions
    φ and γ verify


    ```

    γ(t) = 1

    φ(t) = 0  (3.14)

    ```


    Hence, during the transitional dynamics, the population with daily behavior collapses
    and there is not yet a population that is back to daily behavior (i.e. q(t)=b(t)=0).'
