  md: 'the posterior density of the conductivity $q_M$ given the measurements $g_K$
    on $\partial\Omega$. In other words, if we know the density of the conductivity
    $q_M$ given the measurements $g_K$ we can obtain the expected value of the conductivity
    given the measurements. This estimate is a reasonable point estimate of the solution
    of the ill-posed inverse problem. In the statistical setting, one derives the
    posterior density of the finite dimensional version of the conductivity mainly
    $q_M$ given the finite dimensional measurement $g_K$ on $\partial\Omega$ [19,
    17, 18].


    # 5.4.2.1 The Posterior Density


    The density of $q_M^*$ is usually called prior density. This is because it contains
    all the information about $q_M^*$ that we believe to be true. Here we assume that


    $\pi_{q_M}^* (q_M) \propto \chi_A(q_M) \exp[-\alpha R(q_M)],$ (5.34)


    where $R(\cdot)$ is a regularization function, $\alpha > 0$ a constant, and $\chi_A(q_M)$
    an indicator function with $A = [0,\infty)^n$. In the following section we discuss
    several common choices for the regularizing function $R(\cdot)$.


    # 5.4.3 Regularization Functions


    In this section we discuss several choices for the regularization function $R(\cdot)$.
    We have several choices for the regularization function $R(\cdot)$ which are used
    in the analytical and the statistical settings.


    # 5.4.3.1 The $\ell_p$ Regularizations


    The idea of the $\ell_p$ regularization is to force the difference of the parameters
    $q_M$ and the background $q_M^b$ mainly $q_M - q_M^b$ to be sparse with respect
    to some basis. For example, when using EIT to reconstruct an object mainly made
    of concrete we would choose $q_M^b$ to be the typical conductivity of concrete.
    The $\ell_p$ regularization $R_{\ell_p}(q_M)$ is defined as


    $R_{\ell_p}(q_M) := \sum_{i=1}^n c_i \, |q_M(i) - q_M^b(i)|^p,$ (5.35)


    where $c_i$ represents weights and $0 < p \le 2$ a constant [25]. In theory a
    good choice for the weights would be large values at the boundary and exponentially
    decreasing values toward the center of $\Omega$. This is because the variance
    is smaller on the boundary than in the center [10]. The $\ell_p$ regularization
    enforces sparsity when $0 < p \le 1$ and enforces smoothness when $p \ge 2$.


    # 5.4.3.2 The Total Variation Regularization


    The idea behind the total variation regularization is to obtain smooth images.
    This is meaningful in most practical applications. The total variation regularization
    is defined as


    $R_{TV_c}(q) := \int_{\Omega} |\nabla q| \, dx,$ (5.36)'
