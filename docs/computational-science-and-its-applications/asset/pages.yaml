    # 8.1  Introduction


    Remote sensing images are widely used for different areas ranging from mineral
    exploration to agricultural applications [1], but the poor quality of hyperspectral
    images will directly have an adverse effect on these applications [2]. Remotely
    sensed image pan-sharpening techniques combine a high-spatial–low-spectral–resolution
    image and a low-spatial–high-spectral–resolution image to attain high-quality
    images [3].


    Satellite images are basically of two types: (a) multispectral images (MS), which
    have low spatial and high spectral resolution; and (b) panchromatic images with
    high-spatial and low-spectral resolutions as shown in Table 8.1.


    The need for image pan-sharpening methods arises from the fact that satellite
    sensors face technical difficulties in capturing high-spatial resolution MS images.
    This is because detailed maps calculated through Pan images are injected to sharpen
    the MS images. To calculate the detailed map is the main objective of the pan-sharpening
    procedure.'
