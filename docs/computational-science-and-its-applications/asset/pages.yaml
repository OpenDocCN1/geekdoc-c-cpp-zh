  md: '+   - Ω should not contain balls of arbitrary large radius, i.e.,


    ```

    IR_Ω := sup{r > 0 : B(x, r) ⊂ Ω, for some x ∈ Ω} < ∞

    ```


    As a consequence of the above theorem we showed that these conditions are equivalent
    when Ω is simply connected.


    # Theorem 9.4 (G. Mancini, K. Sandeep [16])


    Let Ω be a simply connected open set in ℝ², then the following are equivalent:


    +   - Moser–Trudinger inequality (Equation (9.12)) holds in Ω.

    +   - λ₁(Ω) > 0

    +   - IR_Ω < ∞.


    The theorem is not true if we remove the simply connectedness


    It is easy to show that (i) ⇒ (ii) ⇒ (iii). So it remains to show that (iii) ⇒
    (i). Since Ω is simply connected, it is conformally equivalent to the unit disc
    and hence one can pull back the inequality to the unit disc and the pulled-back
    inequality becomes like Equation (9.11), then the previous theorem applies as
    one can show that using Kobe’s one quarter theorem (iii) implies the pullback
    metric is bounded from above by the Poincaré metric (see [16] for details).


    Even though the theorem is not true for nonsimply connected domains, one may ask
    whether (i) and (ii) are equivalent in the general case. The question was answered
    positively in [17].


    # 9.4 Adams Inequality


    Adams inequalities are the Moser–Trudinger type inequalities in higher-order Sobolev
    spaces W₀^{k,p}(Ω) when kp = n. Even though one expects a similar type inequality
    to hold for higher-order Sobolev spaces, it is not at all obvious how to modify
    the proofs of the case k = 1 to k > 1 due to the failure of Polya–Szego type inequalities
    for higher-order gradients ∇ᵏ defined by


    ```

    ∇ᵏ := { Δ^{k/2}, if k is even,

    ∇Δ^{(k-1)/2}, if k is odd. } (9.13)

    ```


    In a significant work, D.R. Adams ([22]) established the sharp embedding in the
    case of higher order Sobolev spaces W₀^{k,p}(Ω) when kp = n.


    # Theorem 9.5 (Adams [22])'
