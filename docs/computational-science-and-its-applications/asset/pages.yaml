    # 5.4.1 Iteratively Regularized Gauss–Newton Method


    Suppose λ_k is a sequence of regularizing parameters [30]. A general algorithm
    is given by Smirnova [30] using a line search procedure with a variable step size
    α_k such that


    0 < α_k ≤ 1  (5.31)


    yielding the following Iteratively Regularized Gauss–Newton (IRGN) algorithm


    q_{k+1} = q_k - α_k {ℱ(q_k)^T ℱ(q_k) + λ_k W_2}^{-1} {ℱ(q_k)^T (ℱ(q_k) - g_δ)
    + λ_k W_2 (q_k - q^*) }  (5.32)


    where W_2 is a preconditioning matrix. Due to the inexact nature of g_δ, we adopt
    a stopping rule presented in [31] to terminate the iterations at the first index
    ℵ = ℵ(δ), such that


    ‖ℱ(q_k) - g_δ‖^2 ≤ ρδ < ‖ℱ(q_k) - g_δ‖^2,  0 ≤ k ≤ ℵ,  ρ > 1  (5.33)


    The line search parameter α_k is chosen appropriately with a search direction
    using a backtracking strategy until either the strong or weak Wolfe conditions
    are satisfied [32], or a maximum number of backtracking steps have been taken.


