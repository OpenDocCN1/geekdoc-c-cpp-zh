- pgno: 383
  md: 'To apply a local regularization let us first extend the domain of $x$ from
    $[0,1)$ to $[0,1+r)$, where $r>0$ is a small fixed constant. Again assume that
    Equation (24.1) holds on extended domain, then the solution $f(x)$ satisfies


    $$\int_0^{x+p} K(x+p,t)f(t)\,dt=g(x+p),\quad x\in[0,1),\ p\in[0,r).$$


    Splitting the integration at $x$,


    $$\int_0^x K(x+p,t)f(t)\,dt+\int_x^{x+p}K(x+p,t)f(t)\,dt=g(x+p) \tag{24.9}$$


    $$\int_0^x K(x+p,t)f(t)\,dt+\int_0^p K(x+p,x+t)f(t+x)\,dt=g(x+p) \tag{24.10}$$


    Integrating w.r.t to ''$p$'' and interchanging order of integration in the first
    integral, we get


    $$\int_0^x\int_0^r K(x+p,t)\,dp\,f(t)\,dt+\int_0^r\int_0^p K(x+p,x+t)f(t+x)\,dt\,dp=\int_0^r
    g(x+p)\,dp \tag{24.11}$$


    The idea of local regularization is to assume that function $f(x)$ is constant
    over an extended local interval $[x,x+r)$, where $r$ is the length of local interval
    and is known as a regularization parameter. Replacing $f(x+t)$ by $f(x)$ in second
    integral, Equation (24.11) becomes


    $$\int_0^x\int_0^r K(x+p,t)\,dp\,f(t)\,dt+f(x)\int_0^r\int_0^p K(x+p,x+t)\,dt\,dp=\int_0^r
    g(x+p)\,dp \tag{24.12}$$


    Equation (24.12) represents a regularized form of Equation (24.1) which is a second
    kind integral equation. Like other regularization methods, it also converts first-kind
    integral equations into second-kind integral equations but it also retains the
    Volterra properties of the original problem. For more details about this regularization
    method and its convergence, see [4] and references therein.


    Now we will apply Legendre wavelets to Equation (24.12). Expanding $f(x)\in L^2[0,1)$
    as sum of series of Legendre wavelets, we get


    $$f(x)=\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\psi_{n,m}(x). \tag{24.13}$$


    Putting this values of $f(x)$ in Equation (24.12), we get


    $$\int_0^x\int_0^r K(x+p,t)\,dp\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\psi_{n,m}(t)\,dt+$$


    $$\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\psi_{n,m}(x)\int_0^r\int_0^p K(x+p,x+t)\,dt\,dp=\int_0^r
    g(x+p)\,dp,$


    $$\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\left\{\int_0^x L(x,t)\psi_{n,m}(t)\,dt+\psi_{n,m}(x)\alpha\right\}=G(x).
    \tag{24.15}$$'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'where $L(x,t)=\int_0^r K(x+p,t)\,dp$, $G(x)=\int_0^r g(x+p)\,dp$ and $\alpha=\int_0^r\int_0^p
    K(x+p,x+t)\,dt\,dp$.


    $$\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\left(H_{n,m}(x)+\psi_{n,m}(x)\alpha\right)=G(x),
    \tag{24.16}$$


    where $H_{n,m}(x)=\int_0^x L(x,t)\psi_{n,m}(t)\,dt$. Collocation points are defined
    as


    $$x_i=\frac{2i-1}{2p},\quad i=1,2,\ldots,p,$$


    where $p=2^{k-1}M$. Satisfying Equation (24.15) at collocation points $x_i$, yields
    a linear system of equations. In matrix notation, we write


    $$C(H+\Psi\alpha)=G,$$


    where $G=[G(x_0),G(x_1),G(x_2),\ldots,G(x_p)]^T$,


    $$\Psi=\begin{bmatrix}

    \psi_{1,0}(x_1)&\psi_{1,0}(x_2)&\cdots&\psi_{1,0}(x_p)\\

    \psi_{1,1}(x_1)&\psi_{1,1}(x_2)&\cdots&\psi_{1,1}(x_p)\\

    \vdots&\vdots&\ddots&\vdots\\

    \psi_{1,M-1}(x_1)&\psi_{1,M-1}(x_2)&\cdots&\psi_{1,M-1}(x_p)\\

    \psi_{2,0}(x_1)&\psi_{2,0}(x_2)&\cdots&\psi_{2,0}(x_p)\\

    \vdots&\vdots&\ddots&\vdots\\

    \psi_{2^{k-1},M-1}(x_1)&\psi_{2^{k-1},M-1}(x_2)&\cdots&\psi_{2^{k-1},M-1}(x_p)

    \end{bmatrix}$$


    and


    $$H=\begin{bmatrix}

    H_{1,0}(x_1)&H_{1,0}(x_2)&\cdots&H_{1,0}(x_p)\\

    H_{1,1}(x_1)&H_{1,1}(x_2)&\cdots&H_{1,1}(x_p)\\

    \vdots&\vdots&\ddots&\vdots\\

    H_{1,M-1}(x_1)&H_{1,M-1}(x_2)&\cdots&H_{1,M-1}(x_p)\\

    H_{2,0}(x_1)&H_{2,0}(x_2)&\cdots&H_{2,0}(x_p)\\

    \vdots&\vdots&\ddots&\vdots\\

    H_{2^{k-1},M-1}(x_1)&H_{2^{k-1},M-1}(x_2)&\cdots&H_{2^{k-1},M-1}(x_p)

    \end{bmatrix}$$


    $$C=G(H+\Psi\alpha)^{-1}. \tag{24.17}$$


    The wavelet coefficients $C=\{c_{n,m}\}$ are calculated by using Equation (24.17).
    Then using the values of $c_{n,m}$, the function $f(x)$ can be obtained by using
    Equation (24.13).'
