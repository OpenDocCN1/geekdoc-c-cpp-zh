    # 4.1 Introduction


    In arthroplasty, medical-grade biomaterials need an optimal combination of mechanical
    properties with appropriate design and manufacturability according to the application
    area. When complex forms and flexibility are required, polymeric biomaterials
    are used, although metals and ceramics occupy a significant segment of implant
    science and technology.1 2 Of course, being biocompatible, interactions between
    implants and host biological cell tissues should not induce any inflammatory response
    or formation of unusual tissues.3 In total hip- and knee-joint replacement parts,
    for example, ultra-high-molecular-weight polyethylene (UHMWPE) is extensively
    used.4 5 It is a non-biodegradable polymer which is formed from ethylene gas with
    the generic chemical formula –(C2H4)n–, where n is the degree of polymerization.
    With nearly 200,000 ethylene repeat units and average molecular weight up to 6
    million g/mol, and density of 0.94–0.97 g/ml, UHMWPE is significantly more abrasion-resistant
    and wear-resistant than HDPE (high-density polyethylene).6 The crystallinity of
    UHMWPE is around 30 to 40%, and crystalline regions are randomly oriented with
    respect to each other.7 The UHMWPE molecules are made of very long hydrocarbon
    polymeric chains, which all align in the same direction. Although the intermolecular
    bonds are relatively weak due to Van der Waals interactions, overlaps can exist
    between the long molecular chains, which allow transfer of the large shear forces
    from molecule to molecule.6 Approximately one million UHMWPE components are implanted
    yearly worldwide. The commercial production of UHMWPE started in the 1950s, and
    since then over 90% of UHMWPE has been used in industry.3 The medical industry
    has been one of the major areas of application for UHMWPE since its first use
    as the bearing material in total joint replacement by Sir John Charnley in 1962.1
    Although in the recent past, the'
