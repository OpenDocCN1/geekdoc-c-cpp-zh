    +   5.4.3.2 The Total Variation Regularization..................................................................................87

    +   5.4.4 The Markov Chain Monte Carlo Method...............................................................................88

    +   5.5 Conclusion...............................................................................................................................88

    +   References.......................................................................................................................................89


    # 5.1 Introduction


    The field of inverse problem is a fairly mature area of research and was initially
    motivated by industrial problems [1]. The growth of this research area has been
    tremendous in the last two decades. It is predicted that the use of inverse problems
    in applications in developing countries will grow due to significant demand from
    the industrial sector. Therefore, inverse problems relevant to developing countries
    should be getting a lot more attention. For example, the application of inverse
    problems in biomedical imaging is relevant in developing countries. Breast cancer
    is the most common cancer after skin-related cancers in the US. In 2012, 232,714
    women in the US were diagnosed with breast cancer, and 43,909 women died from
    breast cancer, whereas 144,937 women in India were diagnosed with breast cancer
    during 2012, and 70,218 women died from breast cancer—a significantly'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'higher death rate than in the US [2]. This is partly due to the failure to
    detect breast cancer early. X-ray mammography is still the predominant method
    for detection. However X-ray has drawbacks in terms of exposure to harmful radiation
    and high false-positive rates in younger women. On the other hand, Diffuse Optical
    Tomography (DOT) has the potential to be a cheaper alternative, particularly useful
    in developing countries. However, the mathematics and computational challenges
    of this highly nonlinear ill-posed inverse problem still make it impossible to
    use it in clinical applications.


    Let us describe the difference between a forward and an inverse problem. A forward
    problem is given by a process where with given/known model parameters q we need
    to predict the solution or the output/data u(q). For example, q could be parameters
    involving a partial differential equation (PDE) and u would be the solution of
    the PDE. Forward problems involving PDEs have been around for hundreds of years,
    where mathematicians and scientists are looking for appropriate solutions given
    known parameters q. Many practical applications in fields such as biology, medicine,
    ecology, geophysics, flexible structures, as well as industry, including biomedical
    imaging, involve distributed parameter systems, i.e. partial differential equations
    (PDEs) [1] where the solution u is measured but the model parameters q are unknown.
    In order to validate models and/or control theoretical issues for these systems,
    it is often necessary to determine these model parameters q, such as coefficients,
    boundary terms, initial conditions, and control inputs, given a source or forcing
    function f and observations of the system z for which a quantitative model is
    sought. In general the inverse parameter estimation problem requires minimizing
    an error or a cost functional J(q; z, f). In most cases a regularization procedure
    is also required to generate a well-posed minimization problem (existence, uniqueness,
    and stability of the inverse problem with respect to data). If an inverse problem
    suffers from existence, uniqueness, or stability, it is referred to as an ill-posed
    problem. Therefore, a typical reformulation of an ill-posed inverse parameter
    estimation problem requires optimizing J(q; z, f) + ψ(q) where ψ is a regularization
    functional. Therefore for ill-posed inverse problems, one must investigating several
    mathematical issues: (i) the choice of appropriate error or cost functional J;
    (ii) the algorithm to find the parameter q in the appropriate abstract function
    space given an initial parameter guess q0; (iii) the selection of the best regularization
    operator ψ for inverse stability.


    Here is an outline of this chapter. In Section 5.2, we describe Electrical Impedance
    Tomography (EIT) as an example of an ill-posed inverse problem involving PDEs,
    and in Section 5.3, we describe Diffuse Optical Tomography (DOT) as another example
    of an ill-posed inverse problem. In Section 5.4, we provide details of computational
    challenges including regularization. In Section 5.5, we conclude with a summary
    of future trends in solving ill-posed inverse problems.


    # 5.2 Electrical Impedance Tomography


    The Electrical Impedance Tomography (EIT) problem involves measuring electrical
    voltages on the smooth boundary ∂Ω to determine the spatially varying electrical
    conductivity q within the bounded region Ω ⊆ R^d (d = 2,3). We assume q is strictly
    positive, isotropic and bounded conductivity with no current sources inside Ω.
    The EIT forward problem is typically given by the following elliptic partial differential
    equation,


    ```

    − div (q∇u) = 0  in Ω,   (5.1)

    ```'
