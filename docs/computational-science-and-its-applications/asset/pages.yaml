  md: 'It can be calculated at document level or sentence level. In the first type,
    the whole transcript is evaluated to classify the opinion polarity, where the
    characteristics relating to the goods is highlighted primarily. Further, the document
    is diversified into five subsets of equal number of sentences and each is evaluated
    distinctively to discuss the polarization.

    Steps for calculations are:


    +   1. First determine the number of clean words (C) out of the total raw number
    of words (T) in the document set.

    +   2. Then, find the ratio of number of clean words (C) and number of total raw
    words (T).

    +   3. Given the ratio (r) of number of clean words (C) to number of total raw
    words (T), compute the reduction score, R = 1 − (C/T) = 1 − r.


    Now, 0 < r < 1 ⇒ 1 − 0 > 1 − r > 1 − 1 ⇒ 0 < R < 1. When 0<r<0.5, the polarity
    of opinions is toward the negative perspective and 0.5<r<1, polarity moves toward
    the positive perspective. Thus, when 0< r <0.5⇒ 0.5<R<1, the attitude toward the
    product or service is satisfied, whereas if 0.5 < r < 1 ⇒ 0 < R < 0.5, which means
    that the attitude of reviews indicates dissatisfaction towards the product or
    service.


    # 25.3 Mathematical Case Study of the E-Commerce Market Reviews


    For this case study, the text data have been extracted from the enormous corpora
    of Amazon customer reviews for Amazon products: Amazon Fire TV stick, Amazon Fire
    HD 8 inch tablet, and Amazon Kindle Paper white [22]. Then, the dataset is clustered
    into five subsets of equal size. Each subset is transformed into an array of tokenized
    documents. Every such tokenized document is sensitized by removing the non-attributing
    words occurring in the document. This is followed by forming the word clusters.
    Now, word clusters are filtered by removing the infrequent words, etc. Generation
    of the word cloud is the final outcome of the process. The response can be easily
    seen through the words captured by the clouds or bag of words. If there is an
    affirmative vibe across all the reviews given by the users, then it can be decided
    in favor of buying product whose reviews have been taken into account. The two
    word bags containing raw and filtered data are compared, to visualize the analysis.


