    \ to compute matching percentage. In this study, 100% matching has been found\
    \ between the input palmprint image and the texture features available in the\
    \ centralized database.\n\n# 12.4.2 Phase and Phase Symmetry\n\nIn the proposed\
    \ GUI, phase symmetry features have also been computed, which are given on Panel\
    \ 4. This paper proposes a method of palm identification by using phase information\
    \ contained in images spread across all frequencies [62]. In addition, to reconstruct\
    \ a signal within a scale factor phase information is sufficient. 2D Fourier transformation\
    \ using the forward and reverse transformation function given in equations (12.1)\
    \ and (12.2) is used to transform the palmprint image into the frequency domain.\n\
    \n$$F(a,b)=\\sum_{x=0}^{M-1}\\sum_{y=0}^{N-1} f(x,y)\\cdot e^{-j2\\pi\\left(\\\
    frac{ax}{M}+\\frac{by}{N}\\right)}$$  (12.1)\n\n$$f(x,y)=\\frac{1}{MN}\\sum_{p=0}^{M-1}\\\
    sum_{q=0}^{N-1} F(a,b)\\cdot e^{j2\\pi\\left(\\frac{ax}{M}+\\frac{by}{N}\\right)}$$\
    \  (12.2)\n\n![](img/81c56bc4b2fca1951aff5e0ab85b66be_224_0.png)\n\n**FIGURE 12.6**\
    \  \nTexture features: Principal lines."
