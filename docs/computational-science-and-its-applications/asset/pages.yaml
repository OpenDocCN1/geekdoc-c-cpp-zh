    of location (hence decreasing the vulnerability of populations), the faster this
    speed leads to significant flows of panic in both places 2 and 3. There is a paradox
    here: the fast self-safety movement of populations leads to situations of collective
    panic that are more difficult to manage. This fact must be taken into account
    by emergency services and emergency physicians.


    Although the deaths that occur are not included in this CWPCR model version, one
    can imagine that the escape of panicked populations would give rise to more victims.


    As has already been said, the simulation results shed light on the importance
    of the size of the intermediate places and their role in the fluidity or, to the
    contrary, on the congestion of movements between a dangerous place and a place
    of shelter.


    Depending on their respective size, intermediate places will modulate the dynamics
    and the speed of flow of the crowds. In this sense, they become strategic places
    both for the planners, who must think about the organization of the area to host
    public events, and also for the terrorists who can use these strategic places
    to multiply the effect of their harmful actions by trapping the escape movements
    between two areas of action.


    # 3.5 Conclusion


    In this article we have developed a new model of weighted human behaviour coupled
    with street and place networks, in the context of an urban terrorist attack, thus
    improving the PCR model with bottleneck coupling and taking into account the capacity
    of each place and the number of people stranded in these places. The simulation
    results in a simple network with three nodes (places or public squares) and two
    edges (streets) that demonstrates the key role of the capacity of an intermediate
    place in the dynamics of evacuation from dangerous to safe places.


