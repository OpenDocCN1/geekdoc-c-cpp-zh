- pgno: 65
  md: '# FIGURE 3.2


    Graphic representation of the Panic-Control-Reflex behavior model (PCR) in the
    exceptional situation of disaster. (D. Provitolo et al. 2015. With permission.)


    terrorist attacks. This model is formed by a system of ordinary differential equations
    to describe behavioral dynamics over time (Verdière et al. 2014, 2015, Cantin
    et al. 2016).


    Neuroscience research explains that during a disaster, humans are rarely stuck
    in one type of behavior. The population switches between different behavioral
    states, some of which are the result of instinctive, others of reasoned, reaction.


    As the brain switches from one behavioral state to another, in the context of
    terrorist attacks and therefore in a situation of sudden and unforeseen threat,
    the entire impacted population first adopts a behavioral reaction, Reflex r(t),
    under the influence of surprise and the suddenness of the event, before transiting
    to the Panic reflex behavior p(t), or Controlled behavior c(t) (Provitolo et al.
    2015). Reflex r(t) and Panic p(t) behavior are managed by the reptilian brain:
    they are instinctive, automatic reactions, allowing one to react extremely quickly
    to the threat, either by being stunned and paralyzed r(t), or by fleeing as quickly
    as possible due to the panic fear p(t). Controlled behavior c(t) is managed by
    the pre-frontal cortex, which concerns reasoned and self-control reactions. These
    can take different forms during a catastrophe, for example, in the form of evacuation,
    escape, containment, sheltering, search for help, mutual aid, or, on the contrary,
    looting, etc. Despite their diversity, the PCR model aggregates all of these controlled
    behaviors.


    In this article we propose an extension of the PCR model in order to take into
    account the influence of spatial configuration in the mathematical modeling of
    the dynamics of human reactions in the face of traumatic situations, such as terrorist
    attacks. We call this extended model the Coupled Weighted PCR (CWPCR).


    In Section 3.2, we will present the Weighted Panic Control Reflex model in its
    graphic and mathematical form, as published by the Com2SiCa research team. This
    model is improved from the PCR model in order to take into account the role of
    spatial configurations on behavioral dynamics. In Section 3.3 we introduce the
    CWPCR model, which'
