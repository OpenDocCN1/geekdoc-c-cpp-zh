    # 6.1 Introduction


    Nonlinear equations are ubiquitous in many areas of applied mathematics and play
    vital roles in a number of applications such as science and engineering. Nonlinear
    equations are usually difficult to solve analytically, therefore a numerical method
    is needed. Construction of iterative methods to approximate a solution for solving
    nonlinear equation f(x)=0 is one of the most important tasks in applied mathematics.
    The best-known iterative method for determining the solution of this problem is
    Newton’s method (NM) given by x_{k+1}=x_k - f(x_k)/f''(x_k), which produces a
    sequence {x_n} quadratically convergent to the simple root α, if the initial approximation
    x_0 is sufficiently close to α and f'' exists near α. The key idea by Traub [16]
    that provides the order acceleration lies in a special form of the error relation
    and a convenient choice of a free parameter. We define a self-accelerating parameter,
    which is calculated during the iterative process using Newton’s interpolating
    polynomial. Accelerating technique relies on information from the current and
    the previous iterative step, defining in this way two-point methods with memory.
    The rest of this chapter is organized as follows: Section 6.2 is devoted to modifications
    of the two steps of Guo and Qian methods [11]. Section 6.3 is concerned with developing
    new with-memory methods. Section 6.4 includes some numerical performances and
    conclusions are made in Section 6.5.'
