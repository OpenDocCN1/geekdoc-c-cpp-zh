    Figure 8.1 shows the fusion effect of panchromatic and multispectral images into
    a pan-sharpened image.


    Intensitiy hue saturation (IHS) methods begin with the transformation of RGB (Red,
    Green, Blue) to IHS space followed by replacing the intensity band with a Panchromatic
    image. Finally this new image is inversely mapped back from IHS to RGB space.
    This conventional IHS based method is efficient and simple to execute but it is
    not able to enhance an RGB-based MS image and often contains major distortions
    in spectral aspect, due to color changes among fused MS and the composition of
    re-sampled bands. Thus it misses near infrared band (NIR) which is the fourth
    band after RGB. [4] studies a fast pan-sharpening technique with spectral adjustment
    for IKONOS imagery. IKONOS is a commercial earth observing satellite collecting
    MS and Pan images.


    In [5], two approaches are merged to form a hybrid pan-sharpening scheme: (a)
    local variation with contourlet transformation (CT); and (b) adaptive PCA and
    CT. It performs better compared to APCA+CT, APCA, PCA+CT, and PCA. Thus for multispectral
    satellite images, the spatial details are enhanced by introducing Pan images and
    extracting higher spatial details. [6] discusses a pan-sharpening method based
    on deep neural networks to model complex relations among independent variables
    by composing multiple non linear levels. Back propagation is also used for improved
    training as a second training phase after the pre-training phase of the complete
    deep neural network. In [7], sparse pan-sharpening of images based on a self-adaptive
    technique is studied. It makes no assumption about the spectral structure of the
    Pan image and inherits sparse signal reconstruction super


