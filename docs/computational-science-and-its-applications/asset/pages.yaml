  md: "left_mask, right_image, right_mask) is used to extract principal lines of both\
    \ the palms. Principal Lines button is used for this operation. The output image\
    \ of the operation is shown in Figure 12.6. The function palm_matching(L_features,\
    \ L_valid_corners, R_features, R_valid_corners, New_L_features, New_L_valid_corners,\
    \ New_R_features, New_R_valid_corners) is used to match the texture features of\
