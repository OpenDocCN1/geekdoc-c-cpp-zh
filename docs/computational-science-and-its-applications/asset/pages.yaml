    # FIGURE 5.2


    Nonlinear mapping.


    Now, we can define the forward problem as: given sources f_j in ∂Ω and q in Q,
    a vector of model parameters, for example the coefficient of diffusion D and the
    coefficient of absorption μ_a (i.e. q = (D, μ_a)^T) that belongs to a parameter
    set Q, find the data u on ∂Ω and the inverse problem as: given data z on ∂Ω find
    q. We can recast the forward problem in an abstract setting with u in an appropriate
    abstract space H, and f represents a source or a forcing distribution. In general,
    measurement of u may not be possible; only some observable part z = 𝒞 u(q) of
    the actual state u(q) may be measured. In this abstract setting, the objective
    of the inverse or parameter estimation problem is to choose a parameter q* in
    Q, that minimizes an error criterion or cost functional J(u(q), 𝒞 u(q), q) over
    all possible q in Q subject to u(q) satisfying the diffusion approximation. A
    typical observation operator is,


    ```

    𝒞^f u(q) = { -D ∂u/∂ν (x_i ; q, f) }_{i=1}^m  (5.26)

    ```


    where x_i is in ∂Ω, m is the number of measurements, and the second equality comes
    from the boundary condition (24). A typical Tikhonov cost functional J_λ is given
    as,


    ```

    J_λ(q) = 1/2 Σ_{j=1}^{m_s} Σ_{i=1}^{m} w_{ij} | 𝒞_i^{f_j} u(q) - z_i^{f_j} |^2
    + λ || q - q_0 ||^2  (5.27)

    ```


    where z_i^{f_j} is the measured data at the boundary for a given source f_j, w_{ij}
    is the weight for ij-th data, and λ is the Tikhonov regularization parameter.
    As shown in Figure 5.2, composing u(q) and 𝒞 u(q) we obtain the parameter-to-output
    mapping:


    ```

    T : Q → Z

    ```


    such that T q = 𝒞 u(q), where Z is the space of measurments. This is the nonlinear
    mapping of DOT in abstract setting. The map from Q to Z is nonlinear because the
    solution of a partial differential equation is a nonlinear function of its coefficients
    q = (D, μ_a).


