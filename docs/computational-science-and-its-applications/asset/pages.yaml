    # 11.7 Conclusions and Future Perspective


    It is pertinent to mention here that the force-extension curves of ssDNA (or RNA)
    consisting of similar type of nucleotides show striking differences [95–97]. It
    was found that the poly(T) or poly(U) show the entropic response whereas poly(A)
    show the plateaus arising due to the base stacking interaction. These studies
    indicate that the elastic constants of complimentary strands are different. However,
    in the analytical model [71] proposed by de Gennes and the coarse-grained molecular
    dynamics simulations performed by Mishra et al. [73] the same elastic constant
    for both strands was considered. Latter, Mishra et al. [86] performed their simulation
    with different elastic constants of complimentary strands and found that the extension
    in distribution of base-pairs are asymmetric. This also helped them to modify
    the Ladder model of dsDNA with different elastic constants, which also showed
    the asymmetry (Figure 11.14).


    It was observed that the stability of the DNA aptamer depends on the base-pocket
    position of AMP. We have found that in the absence of AMP, the rupture force profile
    contains two minima while in the presence of AMP, which interacts with the base
    pocket; the rupture force remains constant irrespective of the binding-pocket
    position. This may have biological/pharmaceutical significance, because after
    the release of the drug molecule, the stability of carrier DNA depends on the
    position from where it is released.


    DNA intra-strand cross links (ICLs) agents are widely used in the treatment of
    cancer. ICLs are thought to form a link between the same strand (intra-strand)
    or complimentary strand (inter-strand) and thereby increase the stability of DNA,
    which forbids processes like replication and transcription. As a result, cell
    death occurs. The atomistic simulations presented here provide a semi-microscopic
    description of the process of DNA separation in the presence and absence of ICLs.
    Force-extension curves of unzipping and rupture revealed a clear difference between
    the response of drug-free DNA and DNA-ICLs.


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_211_0.png)


    FIGURE 11.14

    (a and b) The same as Figure 11.11 but for the unzipping force, which is applied
    perpendicular to the helical direction with a 0.0001 pN fs⁻¹ pulling rate at room
    temperature (c) Force-extension curves for the unzipping.'
