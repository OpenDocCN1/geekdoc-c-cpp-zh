    inverse $\mathcal{A}_t^{-1}\in C^0(\overline{\Omega(t)})$. Furthermore, we assume
    that the mapping


    $t\rightarrow X(Y,t),\quad Y\in\hat{\Omega}$


    is differentiable almost everywhere in $t\in[0,I)$. Let us consider a scalar function
    $v$ on the Eulerian frame. Then, we have


    $\hat v:=v\circ\mathcal{A}_t,\quad \hat v:\hat\Omega\times(0,I)\to\mathbb{R},\quad
    \hat v(Y,t)=v(\mathcal{A}_t(Y,t)),$


    which is the corresponding function on the ALE frame. Furthermore, the time derivative
    of $v$ as seen from ALE frame (but expressed in Eulerian coordinates) is defined
    by


    $\left.\frac{\partial v}{\partial t}\right|_{\hat\Omega}:\Omega(t)\times(0,I)\to\mathbb{R},\quad
    \left.\frac{\partial v}{\partial t}\right|_{\hat\Omega}(X,t)=\frac{\partial\hat
    v}{\partial t}(Y,t),\quad Y=\mathcal{A}_t^{-1}(X)$


    Here, $\left.\right|_{\hat\Omega}$ is used to indicate that the time derivative
    is as seen from ALE frame. Further, the time derivative as seen from Eulerian
    frame is indicated by $\left.\right|_X$. The domain velocity $\mathbf{w}$ is defined
    by


    $\mathbf{w}(X,t)=\left.\frac{\partial X}{\partial t}\right|_{\hat\Omega}.$


    Now, we apply the chain rule to the time derivative of $v\circ\mathcal{A}_t$ on
    the ALE frame and obtain


    $\left.\frac{\partial v}{\partial t}\right|_{\hat\Omega}=\left.\frac{\partial
    v}{\partial t}\right|_X+\left.\frac{\partial X}{\partial t}\right|_{\hat\Omega}\cdot\nabla_Xv=\left.\frac{\partial
    v}{\partial t}\right|_X+\mathbf{w}\cdot\nabla_Xv,$ (10.9)


    where $\nabla_X$ denotes the gradient with respect to the Eulerian coordinate.
    Using the above relation in Equation (10.9) in the momentum equation in Equation
    (10.5), we get


    $\left.\frac{\partial\mathbf{u}}{\partial t}\right|_X+\mathbf{w}\cdot\nabla\mathbf{u}+(\mathbf{u}\cdot\nabla)\mathbf{u}-\nabla\cdot\mathbf{T}(\mathbf{u},p)=\frac{1}{\mathrm{Fr}}\mathbf{e}.$
    (10.10)


    Note that the domain velocity term is the only difference between Equations (10.5)
    and (10.10).


    # 10.4 Finite Element Scheme


    # 10.4.1 Weak Form of the Navier–Stokes Equations


    Let $L^2(\hat\Omega)$ and $H^1(\hat\Omega)$ be the standard Sobolev spaces and
    $(.,.)$ be the inner product in $L^2(\Omega(t))$ and its vector/tensor-valued
    versions, respectively. Further, define


    $H_0^1(\hat\Omega)^3:=\{\mathbf{v}\in H^1(\hat\Omega)^3:\mathbf{v}\cdot\mathbf{v}=0\text{
    on }\Gamma_{wall}(t)\cup\Gamma_s(t)\}$.'
