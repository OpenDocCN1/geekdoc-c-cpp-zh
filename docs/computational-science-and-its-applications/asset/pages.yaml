    # FIGURE 11.4


    Schematic representation of dsDNA under the shear force applied at 5′–5′ ends.


    as shown in Figure 11.4. The electrostatic interactions have been calculated with
    Particle Mesh Ewald (PME) method [70, 77] using a cubic B-spline interpolation
    of order 4 and a 10−5 tolerance is set for the direct space sum cutoff. A real
    space cutoff of 10 Å is used for both the van der Waal and the electrostatic interactions.


    The starting structure of the DNA duplex sequence (GTCACCTTAGAC) is built using
    the Nucleic Acid Builder (NAB) module of the AMBER10 suit of programs. Using the
    LEaP module in AMBER, we add the Na+ (counterions) to neutralize the negative
    charges on the phosphate backbone group of DNA structure. This neutralized DNA
    structure is immersed in a water box using the TIP3P model for water [68]. We
    have chosen the box dimension in such a way that the ruptured DNA structure is
    fully inside the water box. For the 12 base-pairs sequence, we have taken the
    box size of 55×56×199 Å3 which contains 16690 water molecules and 22 Na+ (counterions).
    The system is equilibrated at F=0 for 100 ps under a protocol described in Ref.
    [7, 8]. We carried out simulations in the isothermal-isobaric (NPT) ensemble using
    a time step of 1 fs. We maintain the constant pressure by isotropic position scaling
    [63] with a reference pressure of 1 atm and a relaxation time of 2 ps. Constant
