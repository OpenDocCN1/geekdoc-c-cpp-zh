  md: 'dispersion and seepage velocity, in the presence of zero-order production term
    assumed to depict continuous supply of contaminants to the flow, is considered
    as follows:


    $$\frac{\partial c}{\partial t}+\frac{1-n}{n}\frac{\partial F}{\partial t}=\frac{\partial}{\partial
    x}\left(D\frac{\partial c}{\partial x}-uc\right)+\gamma \tag{19.1}$$


    Where, $D\,[L^2T^{-1}]$ is the longitudinal dispersion coefficient, $C\,[ML^{-3}]$
    is the volume averaged dispersing solute concentration (liquid phase). $u\,[LT^{-1}]$
    is the unsteady seepage velocity, $F\,[ML^{-3}]$ is the solute concentration in
    the solid phase, $\gamma\,[ML^{-3}T^{-1}]$ is the zero order production rate coefficient
    for solute production in the liquid phase, $n$ is the porosity of the geological
    formation considered constant throughout, $t$ and $x$ are temporal and spatial
    variables respectively.


    For the sake of ease in the numerical calculation, a linear isotherm $F=K_dc$
    is taken into account, where $F$ is the solid phase solute concentration, $c$
    is the liquid phase solute concentration, $K_d\left(\frac{mg}{g}\right)\left(\frac{dm^3}{g}\right)^n$
    is the isotherm constant related to the adsorption capacity of the medium, $b''$
    is the non linearity factor corresponding to the in-homogeneity of the medium.


    Equation (19.1) is considered with following initial and boundary conditions.


    $$c(x,0)=c_i f(ax)+\frac{\gamma x g(ax)}{u} \tag{19.2}$$


    $$c(0,t)=c_i e^{-\delta t},\ t>0 \tag{19.3}$$


    $$\frac{\partial c}{\partial x}=0;\ x\to\infty \tag{19.4}$$


    Where, $\alpha[L^{-1}]$ is the in-homogeneity parameter, $\delta[t^{-1}]$ is the
    decay constant.


    Using the relation $F=K_dc$ in equation (19.1), we obtain,


    $$\left(1+\frac{1-n}{n}K_d\right)\frac{\partial c}{\partial t}=\frac{\partial}{\partial
    x}\left(D\frac{\partial c}{\partial x}-uc\right)+\gamma \tag{19.5}$$


    Further equation (19.5) becomes


    $$r\frac{\partial c}{\partial t}=\frac{\partial}{\partial x}\left[D_0f(pt)(a+b^*x)^2\frac{\partial
    c}{\partial x}-u_0(a+b^*x)c\right]+\gamma^* \tag{19.6}$$


    Where


    $$t^*=\int_0^t f(pt)\,dt \tag{19.7}$$


    $$\frac{\gamma}{f(pt)}=\gamma^* \tag{19.8}$$


    $$r=1+\frac{1-n}{n}K_d \tag{19.9}$$'
