    # 1.8 The Shortcomings of Classical Fourier Analysis


    The original question treated by J. B. Fourier, namely to find a solution to the
    heat equation, poses itself not naturally on a closed circle but rather for a
    long and extended rod. But it is a physically realistic approximation (allowing
    for a good mathematical treatment) to work with a periodic signal. In fact, if
    we assume a deviation from a constant (say zero) only on some finite interval,
    given the (practically) finite speed of propagation of heat in such a homogeneous
    rod the Fourier series description gives a very good approximation. Only in the
    long run does the finite length comes into play and clearly then the total heat
    imposed at the beginning is just equally spread out over the rod, while in the
    truly infinite case heat is diffusing toward infinity. We have, so to say, an
    infinitesimal increase of temperature everywhere.


    Only ca. 100 years after Fourier the limit from periodic to non-periodic signals
    was taken (even nowadays this is often done in a hand-waving way, in order to
    motivate the formulas for the forward and inverse Fourier transform). After Riemann,
    the introduction of the Lebesgue integral allowed the definition of a Fourier
    transform for rather general functions in L¹(ℝᵈ) with a continuous frequency distribution
    f̂ via the well-known integral transform.


    Formulas found in books on the subject may read as follows:


    ```

    ∫₋∞^∞ ∫₋∞^∞ e^{i2πν(t−τ)} f(τ) dτ dν = f(t)  (1.7)

    ```


    which is sometimes rewritten as


    ```

    ∫₋∞^∞ e^{i2πν(t−τ)} dν = δ(τ − t)  (1.8)

    ```


    because this formula, combined with the so-called sifting property of the Dirac
    delta, namely the formula


    ```

    ∫₋∞^∞ f(s) δ(s − t) ds = ∫₋∞^∞ f(s) δ(t − s) ds = f(t)  (1.9)

    ```


    gives a "formal proof" of the Fourier inversion'
