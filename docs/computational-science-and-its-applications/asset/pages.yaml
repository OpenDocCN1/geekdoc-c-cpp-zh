  md: 'As a consequence we see that the norm $\|u\|_{H^k(\mathbb{H}^n)}$ defined by


    $$\|u\|_{H^k(\mathbb{H}^n)}:=\left[\int_{\mathbb{H}^n}|\nabla_g^k u|^2\,dv_g\right]^{\frac12},\qquad
    u\in H^k(\mathbb{H}^n)$$


    defines an equivalent norm in $H^k(\mathbb{H}^n)$.\nNext we define $\|\cdot\|_{k,g}$
    by


    $$\|u\|_{k,g}:=\left[\int_{\mathbb{H}^n}(P_k u)u\,dv_g\right]^{\frac12},\qquad
    u\in C_0^\infty(\mathbb{H}^n),$$


    then we have:


    # **Lemma 9.2** *(Karmakar, Sandeep [24])*


    Let $\|\cdot\|_{k,g}$ be as above then it defines a norm on $C_0^\infty(\mathbb{H}^n)$
    for $2k\le n$. Moreover when $n=2k$ there exists a positive constant $\Theta$
    such that


    $$\frac{1}{\Theta}\|u\|_{k,g}\le \|u\|_{H^k(\mathbb{H}^n)}\le \Theta\|u\|_{k,g},$$


    for all $u\in C_0^\infty(\mathbb{H}^n)$.\nUsing this norm $\|\cdot\|_{k,g}$ we
    established an Adams type inequality in $\mathbb{H}^n$.


    # **Theorem 9.9** *(Karmakar, Sandeep [24])*


    Let $\mathbb{H}^n$ be the $n$ dimensional hyperbolic space with $n$ even and $k=\frac
    n2$ then,


    $$\sup_{u\in C_0^\infty(\mathbb{H}^n),\ \|u\|_{k,g}\le1}\int_{\mathbb{H}^n}(e^{\beta
    u^2}-1)\,dv_g<+\infty$$


    iff $\beta\le\beta_0(k,n)$, where $\beta_0(k,n)$ is as before.


    Recall that a version of Adams inequality on $\mathbb{H}^n$ was obtained by Fontana
    and Morpurgo in [23]. A natural question is how does Theorem 9.8 compare with
    the inequality in [23]. For $n=4,\ 6,\ 8$ we can check that $\|u\|_{k,g}<\int_{\mathbb{H}^n}|\nabla^k
    u|^2$. Thus our inequality implies the one obtained by Fontana and Morpurgo.


    To complete our aim we investigated the existence of PDEs of the form in Equation
    (9.18) using the Adams inequality in Equation (9.18). We could show that negative
    $Q_{k,\hat g}$ curvature which are $L^2$ perturbations of $Q_{k,g}$ can be prescribed.
    More generally we proved


    # **Theorem 9.10** *(Karmakar, Sandeep [24])*


    Suppose $Q_1-Q_2\in L^2(\mathbb{H}^n)$ and $Q_2\le0$ then the equation


    $$P_k(u)+Q_1=Q_2e^{nu}$$


    has a solution in $H^k(\mathbb{H}^n)$.'
