  md: 'problems that arise in other related fields. The most well-developed area of
    applied linguistics is the teaching and learning of foreign languages.


    +   - **Stylistics:** Crystal (2008) defines stylistics as “a branch of linguistics
    which studies the features of situationally distinctive uses (varieties) of language,
    and tries to establish principles capable of accounting for the particular choices
    made by individual and social groups in their use of language.”

    +   - **Computational linguistics:** As mentioned earlier, computational linguistics
    is the branch of linguistics that deals with applications of techniques of mathematics
    and computer science to the analysis and synthesis of language and speech.


    # 23.3 What Is Computational Linguistics?


    Computational linguistics is the simulation of language by the use of computers
    (Finch 2000). As the name itself suggests, it comprises of two main components—computer
    science and linguistics. It involves a formal, rigorous, computationally based
    investigation that intercedes with linguistics. The term computational linguistics,
    according to Roland Hausser, refers to that subarea of non-numerical computer
    science that deals with language production and language understanding (Hausser
    2001). Thus, the primary concern of computational linguistics is computational
    modeling of linguistic processes to support the development of software applications
    that do useful things with language.


    Natural languages such as English, Hindi, Spanish, French, etc. are supple and
    depend upon apparently obvious situations of utterances. Favorable circumstances
    for such languages also include common background knowledge and content of earlier
    conversations, among other things. On the other hand, programming languages are
    inflexible and entirely depend upon the operations of the machine. Moreover, the
    expressions of the programming languages differ from those of everyday languages
    and also the use of the programming languages requires great precision. Computational
    linguists not only bridge this gap but also work to build devices that make use
    of language in innovative modes.


    Computational linguistics is a highly interdisciplinary field. It takes inputs
    from different other fields besides computer science and linguistics. Cognitive
    science, philosophy, psychology and mathematics are some of the areas from which
    insights are taken in computational linguistics.


    # 23.4 History of Computational Linguistics


    # 23.4.1 1940s and 1950s


    Study in the field of computational linguistics began in the 1940s and 1950s.
    The first project undertaken in computational linguistics was machine translation
    (MT) (Bates 1995, Jones 2001, Manaris 1998, etc.). Jones (2001) suggests that
    the obsession with MT was prompted by Weaver’s (1949) memorandum on translation,
    although a couple MT projects were already in the works at that time. One of the
    early works was the efforts of a group of scholars who were experienced in decryption.
    They aimed to apply their knowledge base to translation'
  merge: -1
  img_proc: true
- pgno: 371
  md: '(Manaris 1998). One of the notable events of the times was the IBM-Georgetown
    demonstration in 1954. It was an experiment in automatic translation from Russian
    to English (Jones 2001). Although the 1940s and 1950s were still the era of extremely
    primitive processing, with no higher-level programming languages and restricted
    access to machines and storage, the researchers persisted, with special focus
    on syntax.


    # 23.4.2  1960s


    During the 1960s, the focus of the researchers into computational linguistics
    turned from machine translation to question answering (Bates 1995). A little flavor
    of artificial intelligence (AI) also seeped in as companies looked for a product
    that could deal with some of the more basic customer queries without having to
    pay the salaries of an actual human being (Jones 2001, Wahlster 1989). Perhaps
    the most important event of the 1960s was the 1966 report released by the Automatic
    Language Processing Advisory Council (ALPAC) sponsored by the US National Academy
    of Sciences (Manaris 1998). The report was intended to critically survey the natural
    language processing field at the time to see if it was actually making valid progress
    and was worth government funding being spent on it. However, things took a turn
    in 1966 when a report on the survey done in the field of natural language processing
    by the Automatic Language Processing Advisory Council (ALPAC) condemned the field
    of machine translation, which eventually resulted in the termination of funding
    for all MT projects in the US (Manaris 1998). MT gradually died out in favor of
    other more profitable-looking topics of research.


    # 23.4.3  1970s and 1980s


    The search that began in the 1960s for a system that could replace a basic customer
    service representative continued in the 1970s (Wahlster 1989). Furthermore, additional
    tools were developed to allow for more advanced stochastic processes, including
    Hidden Markov Models and the Viterbi algorithm (Manaris 1998).


    The 1980s brought a major change that included a switch from complete understanding
    programs to partial understanding programs (Bates 1995). Earlier the complete
    understanding programs used to collate the meaning of every single part of the
    input. On the other hand, the partial understanding programs just sought to understand
    the overall gist of the input and ignored non-essential elements. Another major
    element of the 1980s was the return of machine translation. Not only this but
    the work done in the field of machine translation in the difficult circumstances
    of the 1940s and 1950s gained appreciation from researchers. It was also expanded
    in order to provide more practical and easily accessible tools. However, researchers
    in most of the natural language systems failed on broader discourse levels. Consequently,
    steps were taken to deal with those shortcomings.


    # 23.4.4  1990s to the present


    The 1990s saw a considerable expansion in the field of computational linguistics.
    The return to MT in the 1980s witnessed more popularity in the 1990s. Along with
    the stochastic techniques, new evaluation techniques were also developed in order
    to judge the viability of each product or program (Manaris 1998). However, work
    in the field of natural language processing was not that smooth. Nonetheless work
    continued to overcome the loopholes and, to a great extent, things smoothened
    out in the field of natural language processing. On the other hand, development
    of learning algorithms took a jump from'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'lexicon and syntax to semantics and pragmatics. Other popular topics in the
    1990s were spoken language systems combining speech recognition with language
    understanding, language generation, text processing, and interactive NL interfaces.

    After the 1990s the 2000s focused on the need for more user-friendly systems that
    did not require learning complicated programming (Frappaola 2000, Bose 2004).


    # 23.5 Applications of Computational Linguistics


    Applications of computational linguistics techniques are varied. From those depending
    on linguistic structure and meaning, such as document retrieval and clustering,
    to those that use comprehension and communication, such as dialogue agents, there
    are a number of applications of computational linguistics. The following section
    briefly elucidates some of the applications.


    # 23.5.1 Machine Translation


    Machine translation (MT) is the subfield of computational linguistics that uses
    specific software to translate speech or text from one language to another. SYSTRAN,
    one of the oldest MT systems was developed as a rule-based system in the 1960s,
    and had been in vogue in US and European government agencies until recently (Arnold,
    Balkan, Meijer, Humphreys, and Sadler 2001). In the beginning of the twenty-first
    century, it was hybridized with statistical MT techniques. Google Translate currently
    uses a phrase-based machine translation technique. Microsoft’s Bing Translator
    together with statistical MT employs dependency structure analysis. Other compendious
    translation systems include Asia Online and WorldLingo. Many other translation
    systems exist for small groups of languages such as OpenLogos, IdiomaX, and GramTrans.


    Although translations done through MT techniques fail to remain error-free but
    they suffice in situations where only a restricted understanding is required,
    such as international web browsing where the readers are required to grasp just
    a general drift of the source contents. Also, MT applications on hand-held devices,
    meant to aid international travelers with enquiries such as asking for directions
    or help, interacting with transportation personnel, or making purchases or reservations,
    often serve their purpose successfully. For purposes where high-quality translations
    are required, automatic methods can be used as an aid to human translators, but
    it can be cumbersome at times.


    # 23.5.2 Information Retrieval and Clustering Applications


    Information retrieval, a central theme of information science, covers retrieval
    of both structured data as well as unstructured text documents (e.g., Salton 1989).
    Retrieval of both structured and unstructured data require content-directed methods.
    Retrieving employee records by the unique name/number of employees is an example
    of retrieving information from structured data. Text documents might also be retrieved
    using some unique label. Also, information can be retrieved with its relevance
    to a certain query or topic header. The idea behind it is that the documents should
    contain the terms of the query.


    Document clustering is used when a large number of data needs to be organized
    for easy access. For example, in collections of patent descriptions, medical histories,
    or captioned'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'images. Clustering also indirectly aids various NLP applications. Clustering
    is widely used in other areas, such as biological and medical research and epidemiology,
    market research and grouping and recommendation of shopping items, educational
    research, social network analysis, geological analysis, and many others.


    Document retrieval and clustering are the preliminary steps in information extraction
    or text mining. Information extracting or text mining involves extracting useful
    knowledge from documents of named entities (category, roles in relation to other
    entities, location, dates, etc.) or of particular types of events, or inferring
    correlations between relational terms (e.g., that purchasing of one type of product
    correlates with purchase of another), etc.


    # 23.5.3 Chatbots and Companionable Dialogue Agents


    Chatbots are used for entertainment purposes or to engage the interest of visitors
    of certain websites. Current chatbots are the descendants of Weizenbaum’s ELIZA.
    They are equipped with large readymade scripts that enable them to answer simple
    inquiries about the concerned topic. They are also designed to exchange greetings
    and pleasantries. They can also be a part of interactive gaming sites or can be
    used to recommend websites or products to users.


    Companionable dialogue agents use chatbot techniques in engaging in authored input
    patterns and corresponding outputs. The higher goal, however, is to transcend
    these techniques and to create agents with personality traits and capable of showing
    emotion and empathy. They are required to have semantic and episodic memory, learning
    about the user over the long term and providing services to the user. Those services
    might include advice in some areas of life, health and fitness, schedule maintenance,
    reminders, question answering, game playing, and internet services (Wilks 2010).


    Other uses include systems aimed at clinically well-founded health counseling
    (Bickmore et al. 2011). Such systems have proved to simulate human counselors
    to a large extent but since they consist of scripted system utterances paired
    with multiple-choice lists of responses offered to the client, they cannot be
    efficient all the time.


    # 23.5.4 Virtual Worlds, Games, and Interactive Fiction


    Text-based adventure (quest) games generally feature textual descriptions of the
    setting and challenges confronting the player, and allow for simple command-line
    input from the player to select available actions. Description of the settings
    is often accompanied by pictures and can be elaborate, as in adventure fiction.
    However, the input options available to the player can be restricted to simple
    utterances which can be anticipated by the programmers of the game and be manually
    prepared responses. Nonetheless text-based games are no longer in vogue. Likewise,
    interactive fiction development softwares that enable online dialogue are also
    elaborately scripted programs, allowing only for inputs that can be heuristically
    mapped to one of various preprogrammed responses. Many games in this genre also
    make use of chatbot-like input–output response patterns. At present, much advanced
    research is being done in this area.


    # 23.5.5 Natural Language User Interfaces


    This topic includes a variety of natural language applications, ranging from text-based
    systems dependent on minimal understanding to systems with significant comprehension'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'and inference capabilities in text- or speech-based interactions. Some of the
    traditional and current applications are discussed.


    +   - **Text-based question answering:** Text-based QA involves storing ready-made
    answers in the text corpora being accessed by the QA system for a certain type
    of question being asked. Questions need to be factual in nature and straightforward
    and not ones requiring inference. Text-based QA begins with question classification
    (e.g., yes–no questions, who-questions, what-questions, when-questions, etc.),
    followed by information retrieval for the identified type of question, followed
    by narrowing of the search to paragraphs and finally sentences that may contain
    the answer to the question (Maybury 2004).

    +   - **Inferential (knowledge-based) question answering:** Inferential QA systems
    rely on the ability to confirm entailment relations between candidate answers
    and questions. They make use of simple sorts of semantic relations among the terms
    involved. Other things that can be done through these systems are sorting or categorizing
    data sets from databases, computing averages, creating statistical charts, etc.
    However, these systems rely on quite limited and specialized inference methods
    as opposed to general reasoning based on symbolic knowledge.

    +   - **Voice-based web services and assistants:** Voice-based services on mobile
    devices can serve as organizers (for grocery lists, meeting schedules, reminders,
    contact lists, etc.), to in-car “infotainment” (routing, traffic conditions, hazard
    warnings, iTunes selection, finding nearby restaurants and other venues, etc.).
    A number of other uses include dialing contacts, financial transactions, reservations
    and placing orders, Wikipedia access, help-desk services, health advising, and
    general question answering. Some of these services (such as dialing and iTunes
    selection) fall into the category of hands-free controls, and such controls are
    becoming increasingly important in transport (including driverless or pilotless
    vehicles), logistics, and manufacturing.


    The key technology in these services is speech recognition. One of the examples
    of advanced voice-based assistants is iPhone’s Siri. Siri adds personality and
    improved dialogue handling and service integration, which give users the feeling
    of interacting with a lively synthetic character rather than an app.


    # 23.5.6 Knowledge Extraction


    Extracting knowledge or producing summaries from unstructured text are very important
    applications. One commonly used method in knowledge extraction is the use of extraction
    patterns. The patterns are designed to match the kinds of conventional linguistic
    patterns typically used by authors to express the concerned information. For example,
    text corpora or news wires might be mined for information about companies, by
    keying in on known company names and terms such as “Corp.,” “.com,” “headquartered
    at,” etc.


    # 23.5.7 Sentiment Analysis


    Sentiment analysis is understood as the detection of positive or negative attitudes
    on the part of authors of articles or blogs toward commercial products, films,
    organizations, persons, ideologies, etc. This has become a very active area of
    applied computational linguistics.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Its importance largely lies with the marketing and ranking of products, analysis
    of social networks, classification of personality types or disorders based on
    writing samples, and other areas. The techniques that are used in such analyses
    are based on sentiment lexicons that classify the affective polarity of vocabulary
    items. Also, supervised machine learning applied to texts is used from which word
    and phrasal features are extracted that have been labeled as expressing positive
    or negative attitudes towards some theme.


    For example, frequent occurrences of phrases such as wonderful match or great
    match or terrible match in blogs concerning some football match might suggest
    that wonderful, great, and terrible belong to a contrast spectrum ranging from
    a very positive to a very negative polarity. However, sentiment analysis based
    on lexical and phrasal features has obvious limitations, such as obliviousness
    to sarcasm and irony, and lack of understanding of entailments. The paper (Zhao,
    Qin, & Liu 2010) surveys the state of art of sentiment analysis. There are three
    main areas of sentiment analysis, namely entraction, classification, and extraction.
    The paper also presents evaluation and corpus for sentiment analysis.


    # 23.5.8 Language-Enabled Robots


    Robots today are equipped with web services, question-answering abilities, chatbot
    techniques (for fallback and entertainment), tutoring functions, and so on. They
    are equipped with the hardware and software needed for basic visual perception,
    speech recognition, exploratory and goal-directed navigation (in the case of mobile
    robots), and object manipulation. However, the keen public interest in intelligent
    robots and their enormous economic potential (for household help, eldercare, medicine,
    education, entertainment, agriculture, industry, search and rescue, military missions,
    space exploration, and so on) surely has the potential to continue to energize
    the drive toward greater robotic intelligence and linguistic competence.


    The challenges in real-time interaction involve speech recognition errors, non-fluent
    and complex multi-clause utterances, perspective-dependent utterances, and deixis.
    Other problems include recognition of speech in the presence of noise, better
    and broader linguistic coverage, parsing, and dialogue handling, mental modeling
    of the interlocutor and other humans in the environment, and greater general knowledge
    about the world and the ability to use it for inference and planning.


    # 23.6 Mathematics and Computational Linguistics


    Mathematical tools like inverse problems, wavelets and fractals, fractional derivatives
    are discussed in Meyer (1993), Daubechies (1992), and Siddiqi (2018). A beautiful
    account of application of mathematical tools in speech recognition is given in
    Suksiri (2016). These artificial neural network tools such as wavelet theory,
    neural network, are nicely elaborated in this context. Against this background,
    classical wavelet theory is being replaced by wavelet constructed by Walsh function;
    see Farkov, Manch, Siddiqi (2019). It is well known that many physical laws are
    modeled by classical derivatives and differential equations. In recent years the
    effect of replacing classical derivatives with fractional derivatives has been
    studied in a large number of research problems; see, for example, Siddiqi, Alam,
    and Tripathi (2019). Somehow or other such studies in computational linguistics
    have escaped the attention of researchers of this field.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 23.7 Scope of Computational Linguistics


    The scope of computational linguistics includes systems such as automatic fact
    retrieval systems, question-answering systems, the production of computer generated
    abstracts, indexes and catalogues, and the analysis of the information content
    of literature by statistical, syntactic, and logical methods.


    Although it is a challenging field, skilled computational linguists are in demand
    and are highly paid. Computational linguists need a good understanding of both
    programming and linguistics. They are hired to develop computer systems that deal
    with human language, to build systems that can perform tasks such as speech recognition,
    speech synthesis, machine translation, grammar checking, text mining, etc.


    People with a degree in computational linguistics can work in research groups
    in universities, governmental research labs, and large enterprises. The demand
    for computational linguists is quite high in the public sector. With the ever-increasing
    availability of unstructured data, governments are searching for ways to better
    process and understand this information and, therefore, are looking for skilled
    computational linguists to hire.


