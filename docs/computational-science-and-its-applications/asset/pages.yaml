  md: 'used in the literature. These different conformations of the DNA helix are
    responsible for specific biological functions. B-DNA is the canonical right-handed
    DNA, which has ten bases per helical turn [53]. It is about 23.7 Å wide and extends
    34 Å per ten base-pair sequence. A-DNA is the right-handed double helix with 11
    base-pairs in one complete turn of the helix. In normal conditions, the distance
    between successive sugars or phosphates in A-DNA is found 0.6 nm. Z-DNA is the
    left-handed double helix in which the arrangement of bases appears in a zigzag
    pattern. It has 12 bases per helical twist (Figure 11.2).


    There are two important biological processes, where unwinding of DNA takes place.
    These are DNA transcription and DNA replication processes. Transcription occurs
    during protein translation. It involves copying DNA into RNA. The portion of the
    DNA that codes for genes is transcribed or copied into messenger RNA (mRNA). DNA
    replication is the process of copying the DNA itself into two copies before the
    cell division in order to transfer genetic information from the parent cell to
    the daughter cells. Separation of dsDNA


