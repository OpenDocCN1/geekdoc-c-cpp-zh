    # 2.4.2 Decomposition of the Optimality System for Continuous Controls with Fixed
    Switching Structure s


    In order not to obscure the procedure and the presentation, we neglect the discrete
    control entirely. It is clear that the subgraph decomposition, where discrete
    controls are present, can be handled by the method outlined below. One needs to
    keep in mind only that the switching structure provided by the discrete controls
    $s$ is fixed in this approach. Therefore, in contrast to the mixed-integer problem
    above, we can focus on optimality systems. We follow the article [13] of the author.
    We pose the following optimal control problem with Neumann boundary controls:


    $$\min_{(q,u)} I(q,u) := \frac{\kappa}{2}\sum_{i\in \mathcal{I}} \|q_i - q_i^0\|^2
    + \frac{\nu}{2}\sum_{k\in \mathcal{J}_N^S} |u_k|^2$$


    subject to


    $\alpha_i q_i(x) - \beta_i \partial_{xx} q_i(x) + g_i(x; q_i(x)) = f_i(x),\ x
    \in (0,\ell_i), i \in \mathcal{I}$


    $q_i(n_k)=0,\ i \in \mathcal{I}_k,\ n_k \in \mathcal{J}_D^S$


    $\partial_x q_i(n_k)=u_k,\ i \in \mathcal{I}_k,\ n_k \in \mathcal{J}_N^S$


    $\beta_i \partial_x q_i(n_k)=\beta_j \partial_x q_j(n_k),\ i \ne j \in \mathcal{I}_k,\
    k \in \mathcal{J}^M,$


    $\sum_{i\in \mathcal{I}_k} d_{ik} q_i(n_k)=0,\ k \in \mathcal{J}^M.$


    The corresponding optimality system then reads as follows:


    $$\alpha_i q_i - \beta_i \partial_{xx} q_i + g_i(q_i) = f_i\ \text{in}(0,\ell_i),\
    i \in \mathcal{I}$$


    $$\alpha_i \rho_i - \beta_i \partial_{xx} \rho_i + g_i''(q_i)\rho_i = -\kappa(q_i
    - q_i^0)\ \text{in}(0,\ell_i),\ i \in \mathcal{I}$$


    $$q_i(n_k)=0,\ \rho_i(n_k)=0,\ i \in \mathcal{I}_k,\ n_k \in \mathcal{J}_D^S$$


    $$\partial_x q_i(n_k)=\frac{1}{\nu}\rho_i(n_k),\ \partial_x \rho_i(n_k)=0,\ i
    \in \mathcal{I}_k,\ n_k \in \mathcal{J}_N^S$$


    $$\beta_i \partial_x q_i(n_k)=\beta_j \partial_x q_j(n_k),\ \beta_i \partial_x
    \rho_i(n_k)=\beta_j \partial_x \rho_j(n_k),\ i \ne j \in \mathcal{I}_k,\ k \in
    \mathcal{J}^M$$


    $$\sum_{i\in \mathcal{I}_k} d_{ik} q_i(n_k)=0 = \sum_{i\in \mathcal{I}_k} d_{ik}
    \rho_i(n_k),\ k \in \mathcal{J}^M.$$


    (2.27)'
