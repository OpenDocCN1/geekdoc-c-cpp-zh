  md: '# 9.3 Moser–Trudinger


    The Moser–Trudinger inequality deals with the case of embedding of $W_0^{1,n}(\Omega)$.
    We know that


    $$W_0^{1,n}(\Omega)\hookrightarrow L^q(\Omega),\ 1\le q<\infty$$


    and the result is not true for $q=\infty$. Now the question is whether we can
    embed this space into a better space. To explain this first let us note that $W_0^{1,n}(\Omega)\hookrightarrow
    L^q(\Omega)$ if there exists $C>0$ such that


    $$\left[\int_\Omega |u|^p\,dx\right]^{\frac np}\le C\int_\Omega |\nabla u|^n\,dx,\quad
    u\in C_c^\infty(\Omega)$$


    Equivalently


    $$\sup_{u\in C_c^\infty(\Omega),\ \int_\Omega |\nabla u|^n\le1}\int_\Omega |u|^q\,dx\le
    C, \tag{9.7}$$


    Now one may ask whether the function $|u|^q$ can be replaced by some $f(u)$ of
    higher growth than polynomial power. An answer to this question was given by Pohožaev
    ([1]) and Trudinger([2]). They established an embedding of the Sobolev space $W_0^{1,n}(\Omega)$
    into an Orlicz space establishing the exponential integrability of these functions.


    In 1971 J. Moser ([3]) while trying to study the question of prescribing the Gaussian
    curvature on sphere understood the need for establishing a sharp form of the embedding
    obtained by Pohožaev and Trudinger. He showed that:


    # **Theorem 9.1** *(Moser, [3])*


    There exists a positive constant $C_0$ depending only on $n$ such that


    $$\sup_{u\in C_c^\infty(\Omega),\ \int_\Omega |\nabla u|^n\le1}\int_\Omega e^{\alpha|u|^{\frac
    n{n-1}}}\,dx\le C_0\,|\Omega|. \tag{9.8}$$


    holds for all $\alpha\le\alpha_n=n[\omega_{n-1}]^{\frac1{n-1}}$ where $\Omega$
    is a bounded domain in $\mathbb{R}^n$, and $|\Omega|$ denotes the volume of $\Omega$
    and $\omega_{n-1}$ denotes the $n-1$ dimensional area of the sphere $S^{n-1}$.
    Moreover when $\alpha>\alpha_n$, the above supremum is infinite.


    The above inequality for $\alpha\le\alpha_n$ was proved by using symmetrization
    and reducing the problem to a one-dimensional inequality. The case $\alpha<\alpha_n$
    is easier comparing with the case $\alpha=\alpha_n$. The case $\alpha>\alpha_n$
    is proved using the following test functions which we call as Moser functions:
    For $0<l<R<\infty$, define


    $$u_{R,l}(r)=\frac1{\sqrt{2\pi}}\left[\sqrt{\log\left(\frac Rl\right)}\,\chi_{(0,l)}+\left(\log\frac
    Rl\right)^{-\frac12}\log\left(\frac rR\right)\chi_{[l,R]}\right]$$'
