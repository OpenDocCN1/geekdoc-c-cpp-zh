    # 26.1 Introduction


    The forecasting skill of numerical weather prediction (NWP) depends upon the accuracy
    of the initial conditions(ICs). If we know the present weather conditions, i.e.
    the IC of the model, the mathematical models of the earth’s atmosphere system
    can be developed to predict the future weather conditions. These mathematical
    models use basic differential equations based on the physical principles of fluid
    dynamics.


    In recent decades, the non-hydrostatic regional models have been developed and
    are capable of predicting the heavy rainfall events associated with extreme weather
    phenomenon over the Indian monsoon regime (Routray et al. 2005, 2010; Kalra et
    al. 2019). However, the forecasting skill of the regional models are dependent
    upon the initial and the lateral boundary conditions (IC and BCs). The ICs and
    BCs are provided from the analyses or'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'forecasts of low-resolution global NWP models. These ICs have certain limitations
    such as coarse resolution and inadequate representation of localized mesoscale
    processes. Therefore, the assimilation approach is one of the most promising techniques
    to provide improved analyses by utilizing the high spatial and temporal observations
    from different platforms, which serve as ICs to the regional models (Daley 1991).
    The data assimilation is a mathematical technique to create the best estimate
    of the initial state of the atmosphere by inserting the observed information into
    the model background field.


    India receives 80% to 90% of its annual rainfall during the southwest monsoon
    season (June–September). The major portion of the rainfall is received due to
    formation of monsoon depressions (MDs) moving across India. During the life span
    of the MDs, heavy to very rainfall occur along their paths, which create havoc
    across the region (Sikka and Rao, 2008; Chang et al., 2009). Therefore, the accurate
    prediction of the heavy to very heavy rainfall events associated with MDs is a
    demanding and challenging task for the Indian monsoon operational and research
    community. In recent years, the high-resolution mesoscale models with three/four
    dimensional variational (3/4DVAR) assimilation techniques have become more popular
    for such types of weather events (Routray et al. 2013, 2014, 2016; Mohanty et
    al. 2013; Kumar et al. 2014; Dutta et al. 2019).


    The main objective of this chapter is to improve the forecasting performance of
    the high-resolution mesoscale model Weather Research and Forecasting (WRF) with
    modified initial conditions by inserting the conventional and non-conventional
    observations through 3DVAR analysis technique. For this purpose, a heavy rainfall
    event (August 9–12, 2016) associated with the MD, formed over the Bay of Bengal
    (BoB), is considered. The WRF and 3DVAR modeling systems are briefly described
    in Section 26.2. The synoptic conditions associated with the heavy rainfall event
    are presented in Section 26.3, while Section 26.4 presents the numerical experiments
    performed in this study. Section 26.5 is presents the results and discussion and
    is followed by the overall conclusions drawn from this chapter in Section 26.6.


    # 26.2 Modeling System


    # 26.2.1 Advanced Research WRF Modeling System (ARW)


    The study uses the advanced research core of WRF model (ARW version 3.4), which
    is derived from fully compressible, non-hydrostatic Eulerian equations, horizontal
    staggering from Arakawa C grid, and Runge–Kutta time integration scheme, etc.
    The ARW model is formulated using a terrain-following hydrostatic-pressure vertical
    co-ordinate (η) defined as


    $$\eta = \frac{p_h-p_{ht}}{\mu} \quad \text{Where } \mu=p_{hs}-p_{ht}$$


    $p_h$ refers to the hydrostatic component of pressure, $p_{hs}$ and $p_{ht}$ are
    values along the surface and top boundaries respectively. As described in NCAR
    technical note (Skamarock et al. 2008), the governing equation of ARW model is
    expressed as:


    ```

    $$\begin{aligned}

    \partial_t U &= F_U-(\vec{\nabla}\cdot\vec{V}u)+\partial_x p_\theta \eta-\partial_\eta
    p\partial_x\varphi \qquad (26.1)\\

    \partial_t V &= F_V-(\vec{\nabla}\cdot\vec{V}v)+\partial_y p_\theta \eta-\partial_\eta
    p\partial_y\varphi \qquad (26.2)

    \end{aligned}$$

    ```'
