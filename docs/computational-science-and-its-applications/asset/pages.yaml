  md: 'We now define the functional spaces for the velocity and pressure in Ω(t) as


    V(Ω(t)) := { v ∈ H¹(Ω(t))³ : v = v̂ ∘ 𝒜ₜ⁻¹ , v̂ ∈ H₀¹(Ω̂)³ },


    Q(Ω(t)) := { q ∈ L²(Ω(t)) : q = q̂ ∘ 𝒜ₜ⁻¹ , q̂ ∈ L₂(Ω̂) }.


    In order to derive the variational form of the Navier–Stokes equations, we multiply
    the ALE form of momentum equation in Equation (10.8) by a test function v ∈ V,
    integrate over the computational domain Ω(t) and get


    ∫_{Ω(t)} ∂u/∂t · v dx + ∫_{Ω(t)} ((u − w)·∇)u · v dx − ∫_{Ω(t)} ∇·𝕋(u,p)·v dx
    = 1/Fr ∫_{Ω(t)} e·v dx.


    Applying integration by parts to the third term gives


    ∫_{Ω(t)} ∇·𝕋(u,p)·v dx = ∫_{∂Ω(t)} v·𝕋·v ds − ∫_{Ω(t)} 𝕋(u,p):∇v dx = ∫_{∂Ω(t)}
    v·𝕋·v ds − ∫_{Ω(t)} 1/2 𝕔(u):∇v dx − ∫_{Ω(t)} 1/2 𝕔(u):∇vᵀ dx + ∫_{Ω(t)} p∇·v
    dx = ∫_{Γ_fs} v·𝕋·v ds + ∫_{Γ_wall} v·𝕋·v ds + ∫_{Γ_s} v·𝕋·v ds − ∫_{Ω(t)} 𝕔(u):𝕔(v)
    dx + ∫_{Ω(t)} p∇·v dx.


    Using the vector decomposition, v = (v·ν)ν + (v·τ)τ and incorporating the boundary
    conditions results in


    ∫_{Ω(t)} ∇·𝕋(u,p)·v dx = 1/We ∫_{Γ_fs} ℛ v·v ds − 1/β ∫_{Γ_s} ((u − η u_s)·τ)(v·τ)
    ds − ∫_{Ω(t)} 𝕔(u):𝕔(v) dx ∫_{Ω(t)} p∇·v dx.


    Thus the weak form of the Navier–Stokes equations in Equation (10.8) reads:

    Find u ∈ V and p ∈ Q such that for all v ∈ V and q ∈ Q


    (∂u/∂t , v) + a(u − w : u, v) − b(p, v) + b(q, u) = f(v),   (10.11)'
