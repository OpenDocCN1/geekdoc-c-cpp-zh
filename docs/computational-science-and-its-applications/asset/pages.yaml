  md: '# 21.4 Unique Remotality in Convex Spaces


    Theorem 21.5 Let (X, d) be a convex linear metric space and A a closed bounded
    remotal subset of X admitting a center c. If A is not a singleton, then for any
    extracted function F of F(x, A) there exists a ρ > 0 such that d(F(x), F(c)) >
    ρ for all x in a neighborhood of c on (c, F(c)].


    Proof. Let F be any extracted function from F(., A) and x ∈ (c, F(c)] then


    ```

    d(x, F(x)) = d(tc + (1 − t)F(c), F(x))

    ≤ t d(c, F(x)) + (1 − t) d(F(c), F(x))

    ≤ t d(c, F(c)) + (1 − t) d(F(c), F(x))

    ≤ t d(x, F(x)) + (1 − t) d(F(c), F(x)).

    ```


    which implies


    ```

    d(x, F(x)) − t d((x, F(x) ≤ (1 − t) d(F(c), F(x))

    i.e (1 − t) d(x, F(x)) ≤ (1 − t) d(F(c), F(x))

    i.e d(x, F(x)) ≤ d(F(c), F(x))

    ```


    Therefore


    ```

    d(F(x), F(c)) ≥ d(x, F(x)) > d(c, F(c)) ≡ r.

    ```


    Thus ρ can be chosen so that ρ ≤ r, the Chebyshev radius of A.


    Theorem 21.6 Let A be a non-singleton closed and bounded subset of a convex linear
    metric space (X, d) admitting a center c and let ρ be as in Theorem 21.1. If the
    distance δ(c, A / B(F(c), ρ)) is attained, then A can not be uniquely remotal


    Proof. Suppose on contrary that A is uniquely remotal and assume c = 0. Let a
    ∈ (0, F(0)) be such that d(F(x), F(0)) > ρ for every x ∈ (0, a]. Let xₙ ∈ (0,
    a] be such that xₙ → 0. By isolation result F(xₙ) ∈ A / B(F(c), ρ). Consider


    ```

    δ(0, A) = lim δ(xₙ, A)

    = lim δ(xₙ, A / B(F(0), ρ))

    = δ(0, A / B(F(0), ρ))

    ```


    Since δ(0, A / B(F(0), ρ)) is attained, there exists a₀ ∈ A / B(F(0), ρ)) such
    that δ(0, A) = d(0, a₀). Since a₀ ∈ A / B(F(0), ρ)), a₀ ≠ F(0), contradicting
    the assumption that A is uniquely remotal.


    Corollary 21.1 If a compact subset A with center c is uniquely remotal in a convex
    linear metric space (X, d), then A must be a singleton.'
