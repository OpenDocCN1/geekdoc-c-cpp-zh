    # 16.3 Results and Discussion


    A crop yield forecast model for district-level rice production was developed over
    Gorakhpur region of Eastern Uttar Pradesh with the help of statistical technique,
    by using five weather variables, i.e. maximum and minimum temperatures, relative
    humidity of morning and evening time and 24-hourly rainfall, of the crop growing
    season, i.e. the period from sowing to harvesting of crop, and the observed yield
    of past years and results were discussed. The variability of weather variables
    (maximum and minimum temperatures, relative humidity of morning and evening time,
    and rainfall) are illustrated through graphs.


    Interannual variation in the mean maximum temperature of the crop growing period
    from the year 1971 to 2010 is shown in Figure 16.1. There is a decreasing trend
    in the temperature at a rate of 0.044°C/year with coefficient of distribution
    value (R² value) 0.3102.'
