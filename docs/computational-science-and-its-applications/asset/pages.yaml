    # 4.8 Summary


    To retain the original mechanical properties as needed in orthopedic applications,
    UHMWPE has undergone several stages of improvements. The flow chart in Figure
    4.15 shows stages of improvement the UHMWPE has gone through since its first application
    in 1960. During each period of improvement, the focus of the experimental work
    was “how to control” the free radicals. In summary, orthopedic UHMWPE has been
    found to undergo oxidative degradation because of the reactions of radiation-induced
    free radicals with diffused or trapped oxygen. While thermal quenching of free
    radicals in an inert environment are found to reduce material degradation, the
    residual radicals are found to undergo oxidation reactions for a very long time
    (>25 years, in our laboratory). To combat free radicals, vitamin E has been added
    to UHMWPE as an antioxidant. While the experimental as well as clinical results
    show a significant improvement in the radical-induced degradation, ESR data show
    the presence of remaining free radicals at any concentration of α-Tocopherol.


