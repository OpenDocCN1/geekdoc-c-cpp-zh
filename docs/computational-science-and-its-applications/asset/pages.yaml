    # Step 3. Retrieving Situation Knowledge


    The purpose of knowledge retrieval is to acquire appropriate experience which
    can be used to assist present decision-making. Therefore, it is sensible to form
    the knowledge retrieval based on decision situation triples stored in the knowledge
    base. The following description shows the method of knowledge need extraction.


    # Definition 17.4. Knowledge (KR(Q)) shown in Equation (17.7):


    ```

    KR(Q) := {Q(E_i) | E_i ∈ DS},

    ```


    where Q is a query, Ei is an experience of Decision Situation (DS), and Q(E_i)
    is the knowledge experience retrieved during the process of searching for best
    experiences based on certain criteria.


    The knowledge denotes the clinician’s experience which is warehoused in the experience
    base of the cognitive computing agent. The concepts about clinical practices and
    the experiences create the domain knowledge base So, the response for clinical
    query is retrieved from the knowledge base created by storing experiences from
    clinicians.


    # Example 17.3. Knowledge retrieval according to query (Q)


    Q1 = What is the treatment of the flu?


    The cognitive computing agent applies natural language processing and understands
    the meaning of the question.


    +   - Question Type = What (Fact)

    +   - Subject = Flu

    +   - Predicate = treatment

    +   - Answer Type = treatment


    The cognitive computing agent retrieves the knowledge according to the situation
    decision based on the query input.


    > E_a = "Ashish was having symptoms like cold, cough, and mild fever in August
    2018."

    > E_b = "He was suffering from flu."

    > E_c = However, AntiViral has taken control of the flu.

    > E_1 = {E_a, E_b, E_c}'
