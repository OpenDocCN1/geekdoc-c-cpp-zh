    # Computational Methods for Conformable Fractional Differential Equations


    A. H. Siddiqi, R. C. Singh, and Santosh Kumar


    # CONTENTS


    +   7.1 Introduction...............................................................................103

    +   7.2 Conformable Fractional Derivative...................................................................105

    +   7.3 Simulation of Conformable Fractional Heat Equation.........................................106

    +   7.4 Simulation of Conformable Fractional Derivative of Harmonic Oscillator
