    Because of the extensive time involved in the all-atoms simulations, we restricted
    ourselves at three different (extreme) base-pocket positions D_i = 1, 4 and 7
    (Figure 11.8(b)) and calculated the rupture force with 10 realizations of different
    seeds as a mean force [86]. The required rupture forces for these positions are
    840 pN ± 20 pN, 720 pN ± 20 pN, and 830 pN ± 20 pN, indicating that the complete
    profile contains two minima [87]. In the presence of AMP, which interacts with
    the base-pocket, we find f_c = 925 pN ± 20 pN remains constant irrespective of
    binding-pocket position, as seen earlier (Figure 11.7(a)) [84]. This validates
    the finding of the simple coarse-grained model, which captured some essential
    but unexplored aspects of rupture mechanism of DNA aptamer.


    # 11.6 Stability of DNA-ICLs against Force and Its Use as an Anti-Tumor Drug


    ICL agents can form a number of adducts with DNA. Because of the chromatin structure,
    these adducts are not always produced randomly throughout the genome [88–92].
    The three-dimensional structures of the DNA-ICLs are variable, which could influence
    the efficiency of ICL recognition and repair. Mitomycin C is one of the ICLs which
    has been used as a natural anti-tumor antibiotic (Figure 11.9). It forms adducts
    at the N-7 and N-2 of guanine intra-strand cross-links, and ICLs between the N-2
    of guanines at d(CpG) sequences in the minor groove [89]. On the other hand, Trabectedin
    forms monoadducts in the minor groove (Figure 11.9) that increases the melting
    temperature of selected DNA oligonucleotides [90–92]. Juan et al. [93] have studied
    the thermal stabilization of different DNA-ICLs, e.g. Mitomycin C, mono-functional
    tetrahydroisoquinolines (Yondelis), Zalypisis, and PM01183. Using atomistic simulations,
    they analyzed the thermal denatuaration of these ICLs. However, because of a large
    molecular size, their simulations were limited to <200 ns at temperature 400 K;
    such a high temperature is unrealistic for living systems.


    The aim of this section is to explore the stability of DNA-ICLs at room temperature.
    For this, we first choose a 15-mer sequence of TAATAACGGATTATT built by using
    the NAB module in the AMBER suite of programs without any ICLs agent [63]. The
    initial structure of dsDNA (TAATAACGGATTATT) is built by the NAB (Nucleic Acid
    Builder) module in the AMBER suite of programs without any ICL agent. The structure
    of ICLs (Trabectedin and Mitomycin C) have been taken from Protein Data Bank (PDB).
    The data file for ICLs has been used from the Supplementary material provided
    in Ref. [93]. Using the Xleap (module in the AMBER tool), we build the initial
    structure of dsDNA-ICLs (covalent bond between guanine of dsDNA and ICLs) and
    set the modified parameter (charge, atom type, etc). Finally, we build the initial
    coordinate file and parameter topology file, which were used in the calculation
    of force fields. These molecular systems are immersed in a water box using the
    TIP3P model for water [68]. Using the LEaP module in AMBER, 27 Na⁺ (counter-ions)
    are added in the system to neutralize the negative charges on the phosphate backbone
    group of the DNA-ICL structure. We have chosen the box dimension in such a way
    that the ruptured/unzipped structure always remains inside the water box. In the
    case of rupture, we have taken the box size of 48 × 55 × 189 Å³, which contains
    39918 atoms, while for unzipping, the box size is 188 × 55 × 78 Å³, containing
    67536 atoms. Other simulation details were the same as those described in the
    Section 11.4.'
