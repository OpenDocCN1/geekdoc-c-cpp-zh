    # 17.3.1 Reactive Architecture


    Reactive agent architecture is grounded on the straight mapping of perception
    states into action. It does not use any fundamental symbolic knowledge model and
    reasoning as used in deliberative architecture. This artificial agent reacts to
    direct changes in the real-world environment in a perception-and-action response.
    The reactive architecture comprehends by using a combination of sensors and actuators,
    where sensor input is mapped to the actuator based on alterations in the environment.


    Brooks’ subsumption architecture is accepted as the most exquisite untainted reactive
    architecture. Brooks developed the architecture based on several assessments of
    various drawbacks in deliberative architecture. The percept situation mapped into
    an action which specifically respondes to the percept situation.


    Brooks’ basic idea of subsumption architecture is that agents can generate intelligence
    in performance without explicit knowledge illustrations and abstract inference
    by using symbolic artificial intelligence techniques. Intelligence in an agent
    is an evolving feature of complex iterative systems. Subsumption architecture
    is understood in finite state machines through exclusive mapping layers linked
    to sensors that observe the environment variations and map the individual action
    executed.


    # 17.4 Cognitive Agent System


    As specified in (Langley, 2004), and also shown in the proposed taxonomy, there
    are numerous ways and types of building artificial intelligent agents, which are
    the robotic agent, software-based rational (single and multi-agent) approach,
    cognitive architecture, and conscious computing agent approach. “A cognitive architecture
    approach is a blueprint for developing artificial agents system with human-like
    intelligence” (Anderson et al., 2004). It postulates the fundamental framework
    of an intelligent agent that acts like real cognitive systems by proposing human-like
    artificial computational software and hardware structure as shown in Figure 17.4.


    So, it is not wrong to say that cognitive architectures denotes blueprints of
    the human mind. So, the model shows not only the behavioural properties of the
    system but also the structural features of the system.


    Cognitive architecturel, classified as symbolic, emergent, and hybrid as shown
    in Table 17.1, is grounded on the basis of cognitive science. Cognitive science
    centers on human-level cognition, intelligence, neurology, anthropology, and psychology.
    Cognitive architecture began with a particular category of design acknowledged
    as a production system and is still progressing over time with the fantastic research
    work of cognitive scientists. The earliest architecture for building a cognitive
    agent is ACT for forming human-like behavior (Anderson et al., 2004). The production
    of an intelligent agent using cognitive architecture focuses on the cognition
    part, the simulation and modelling of human behaviour. The cognitive architecture
    approach is said to be different from the artificial intelligent agent architecture
    approach in the following ways (Langley et al., 2009).'
  merge: -1
