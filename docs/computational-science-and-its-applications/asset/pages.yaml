  md: 'saturation regions are depicted in a better form in the outcome. The saliency
    weighted map calculates the visibility degree relative to the neighborhood areas.
    It basically measures the relative coefficients of a region or a segment in an
    NSDFB with respect to its surroundings based upon coefficient orientation and
    values. As discussed in [25], the weight is defined as follows:


    ```

    $$W_n^S = ||\text{NSDFB}_n^f - \text{NSDFB}_n^{\text{avg}}||$$

    ```


    Here NSDFB$_n^{\text{avg}}$ is the average coefficient value of NSDFB and is of
    low-resolution image from where the high-frequency noise needs to be removed.
    It is obtained by using the high-frequency value of cut-off ($f=\pi/2.75$) into
    a separable binomial kernel. Therefore, the impact of these three measures is
    important in different aspects but the first one, which is the luminance weight
    map, has greater visibility impact overall. The aggregated weight map is obtained
    by multiplicative expression:


    ```

    $$W_n = W_n^L \times W_C^n \times W_n^S$$

    ```


    The normalized form of the aggregate weight guarantees that the sum will be 1
    for each pixel:


    ```

    $$\overline{W_n} = \frac{W_n}{\sum W_n}$$

    ```


    # 8.2.3 Pan-Sharpening on Multi-Scale


    During the image pan-sharpening, weighted inputs are computed in order to detect
    the features more significantly for each pixel:


    ```

    $$F = \sum_n \overline{W_n} I_n \text{s.t.} \sum_n \overline{W_n} = 1$$

    ```


    Intensity scale of the resulting image is maintained because a normalized weighted
    map is used in the above calculation. But this equation may result in halos artifacts
    where the weighted maps have stronger transitions. Therefore an approach [26]
    which is known as pyramidal refinement is applied to get rid of this degradation.
    In the proposed method, $I_n$ is actually decomposed using a Laplacian operator
    into a pyramid with different scales. On the parallel track, $\overline{W_n}$
    is also derived from a Gaussian pyramid for each of its weighted normalized maps.
    Now at each respective pyramid level $i$ (default value $i=5$) the mixing is applied
    as follows:


    ```

    $$F_i = \sum_n G_i(\overline{W_n}) L_i(I_n)$$

    ```


    where $L_i$ is the Laplacian operation of the input $I$ and $G_i(\overline{W_n})$
    is the Gaussian operator on the weighted normalized map $\overline{W_n}$. Bottom-up
    direction is adopted for respective pyramid layers and the final restored version
    of $I$ is calculated after adding all the pyramid levels using upsampling operator
    $U(x)$ with $x=2^{i-1}$.


    ```

    $$G(x) = \sum_i F_i(x) U(x)$$

    ```'
