  md: '# 22.3.3 Generating Function for $U_n(x^\beta)$


    The Chebyshev fractional polynomials of the first kind can be developed by the
    following:


    $$\frac{1 - t x^\beta}{1 - 2 t x^\beta + t^2} = \sum_{n=0}^{\infty} U_n(x^\beta)
    t^n$$


    # 22.4 Conclusion


    We have discussed the fractional power series solution as well as corresponding
    functions of conformable fractional Laguerre and Chebyshev differential equations.
    The work reflects that at $\beta=1$ all the solutions and functions behave like
    classical functions. In addition, we present some properties of the special fractional
    functions. The findings of the whole work indicate that the results of the fractional
    case conform with the results of the ordinary case.


