- pgno: 126
  md: 'A few interesting and useful MATLAB functions have been submitted to the Math
    Works, Inc. Until recently, fractional calculus was considered rather esoteric
    and without application. But in the past couple of decades there have been tremendous
    research activities on the application of fractional calculus to very diverse
    scientific fields ranging from the physics diffusion and advection phenomena,
    to control systems, to finance and economics. Indeed, at present, application
    and activities related to fractional calculus have appeared in at least the following
    fields: fractional control of engineering systems; advancement of calculus of
    variations and optimal control to fractional dynamic systems; analytical and numerical
    tools and techniques; fundamental explorations of the mechanical, electrical,
    and thermal constitutive relations and other properties of various engineering
    materials such as viscoelastic polymers, foams, gels, and their engineering and
    scientific applications; fundamental understanding of wave and diffusion phenomenon,
    their measurements and verifications, including applications to plasma physics
    (such as diffusion in Tokamak); bioengineering and biomedical applications; thermal
    modeling of engineering systems such as brakes and machine tools; image and signal
    processing.


    The increasing interest in application of fractional calculus has motivated the
    development and investigation of numerical methods specially devised to solve
    fractional differential equations (FDEs). In references, Garrappa [25, 26] has
    explained a basic principle behind some methods for FDEs. He has developed some
    MATLAB routines for the solution of a wide range of FDEs. In these references
    he has discussed MATLAB routines for classical fractional derivatives like Caputo
    and Riemann In this chapter we intend to examine numerical tools and MATLAB routines
    for comparatively new fractional derivatives known as conformable derivatives.
    For conformable fractional derivatives and associated differential equations we
    refer to [21, 28, 31]. Differential equations containing conformable derivatives
    are called conformable differential equations.


    In a beautiful article, Petras [46] has presented the MATLAB code for solving
    a partial differential equation where derivatives are taken in the sense of Caputo,
    Reimann, Liouville, and Riesz. In general he has described the methods for calculation
    of fractional derivative and fractional integrals together with methods for solution
    of the fractional differential equations in MATLAB. Several useful pieces of information
    are provided in this paper. Chi and Gao [18] observe that numerical computation
    of fractional derivatives is a task. However they have efficiently computed Riemann–Liouville
    fractional derivatives and integrals applying Fourier series and Taylor’s series
    combined with MATLAB. Garrappa [25, 26] has presented an updated account of numerical
    methods and MATLAB codes for solution of fractional differential equations. It
    has been observed by Avct [9] that the computational results of a conformable
    heat equation are quite successful in showing the sub-behavior of the heat process.
    Fractional calculus is considered as a laboratory for special functions and integral
    transforms. The efficient implementation of product integration rules has been
    presented in this chapter. The MATLAB codes presented are available on the websites
    of [25, 26].


    Applications of fractional derivatives and fractional integrals are discussed
    in [5, 6, 7, 10, 11, 14, 17, 19, 20, 21, 22, 31, 33, 34, 36, 38, 39, 40, 42, 43,
    44, 45, 48, 53, 57, 58, 60, 62, 64, 65]. The concept of inverse problem is quite
    popular in classical calculus, differential equations, and partial differential
    equations, see for example [23, 24, 27, 35, 49, 51, 52, 55, 66]. However, there
    are only few papers devoted to inverse problem in fractional calculus and differential
    equations, for example [19, 35, 40, 56, 59, 60, 63, 64] and a recent Ph.D thesis
    submitted to Sharda University, Greater Noida India by Mr. Masood Alam. [12, 13,
    14, 15] are devoted to Shannon wavelets which are useful for numerical simulation
    of fractional differentiable equations. Numerical methods for solution of fractional
    differential equations are investigated in [3, 31, 67, 68].'
