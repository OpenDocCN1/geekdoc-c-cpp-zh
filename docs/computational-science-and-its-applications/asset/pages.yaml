  md: 'specific humidity. The RMSE of the background field departure of the variables
    is higher as compared to the RMSE of the departure of the analysis.


    The relative vorticity around the MD is stronger in the 3DV analysis as compared
    to the CNTL analysis at different pressure levels. It is clearly suggested that
    the intensity of the MD is improved at model initial time after assimilation of
    observations through the 3DVAR analysis system.


    The model-simulated horizontal and vertical moisture fluxes are reasonably well
    represented in both the simulations. However, the positive fluxes are stronger
    and extended up to the upper atmosphere in the 3DV simulation during the life
    span of the MD. It is also noticed in the 3DV simulation that horizontal and vertical
    moisture fluxes are gradually increased from depression stage to deep depression
    stage and decreased afterward (i.e. dissipation of MD). These features are not
    well represented in the CNTL simulation.


    The magnitude of intensity and rainfall associated with MD are well simulated
    in the 3DV experiment as compared to the CNTL experiments.


    This chapter clearly suggests the advantages of impact of the assimilation of
    observations through the 3DVAR analysis system for the simulation of a heavy rainfall
    event during the monsoon season. However, further improvement can be obtained
    by increasing the model resolution, assimilation of additional high-quality spatial
    and temporal observations like Doppler weather radar (DWR) radial velocity and
    reflectivity, radiance with more advance data assimilation techniques such as
    4DVAR, Hybrid, Ensemble methods, etc.


