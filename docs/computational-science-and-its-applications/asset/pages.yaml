- pgno: 233
  md: 'entropy value in ASD and TD. Also, they explored which areas in the brain are
    considered to differentiate the ASD children from the TD children, through 43
    children with autism compared to 43 normal children aged from 4 to 8 years old.
    Entropy-specifically and region-specifically, the findings were that sensitivity
    increases with age.


    Ibrahim et al. (2018) presented various EEG features extraction and classification
    algorithms to support ASD and epilepsy diagnosis [22]. The researchers found that
    the combination of discrete wavelets transform in the preprocessing stage, and
    that Shannon entropy and the k-nearest neighbor classifier always fulfilled the
    best results.


    Askari et al. (2018) proposed a designed model based on EEG features and cellular
    neural networks to show the brain connections of autistic children. The proposed
    model can be used to distinguish the children with autism from the control group
    based on CNN and Support vector machine with an accuracy 95.1%. The findings indicate
    that there are considerable differences and abnormalities in the left hemisphere
    in the autistic children in comparison with the control children, and most abnormalities
    are related to the regions in frontal and parietal lobes in the autistic children
    [23]. Grossi et al. (2017) proposed an artificial adaptive system for features
    extraction in computerized EEGs and the researchers discriminate ASD children
    from control subjects [24]. Sharma et al. (2017) proposed an automated identification
    system of focal–class (FC) and non-focal–class (NFC) of EEG signals that are localized
    in a time–frequency domain based on orthogonal wavelet filter banks [25]. The
    researchers calculate different entropies from the EEG signal wavelet coefficients
    as discriminating features. These features are utilized to classify FC and NFC
    of EEG signals and ranked based on Student’s t-test ranking method and then the
    signals are classified by Least Squares Support Vector Machine classifier. The
    proposed wavelet-based system fulfilled an accuracy up to 94.25%, 91.95% sensitivity,
    and 96.56% specificity. Faust et al. (2015) presents a wavelet algorithms which
    shows computer aided epilepsy diagnosis and seizure detection. The researchers
    found that a considerable literature review established that wavelet transform
    is the main method for EEG-based seizure detection, and most researchers utilize
    the discrete wavelet transform more than the continuous time wavelet analysis
    in their scientific work [26].


    Duffy et al. (2013) explored the relation between Asperger’s syndrome and autism
    utilizing EEG coherence study. The researchers got the coherence data and used
    principle component analysis to attenuate the frequencies. They realized that
    these factors could considerably distinguish neurotypical ASD from the control
    subjects by discriminant function analysis [27]. Ahmadlou et al. (2012) investigated
    the brain region’s connectivity with ASD based on EEGs, Fuzzy Synchronization
    Likelihood, and a wavelet-chaos neural network algorithm [28]. The researchers
    aimed to explore the nonlinear features space for a more accurate EEG-based autism
    diagnosis; also, which regions in the autistic brain indicate connectivity deficits
    and that the deficit sub-bands that are more pronounced are determined. The findings
    are that the proposed method can be utilized as an effective tool for autism diagnosis,
    where the achieved classification accuracy is 95.5% to distinguish the autistic
    EEG from normal EEG. Adeli et al. proposed a wavelet-chaos neural network algorithm
    for EEG analysis to detect seizure and epilepsy. The methodology is applied to
    three EEG signals groups that include healthy, epileptic during a seizure-free
    interval, and epileptic during a seizure. The research ideology is that nonlinear
    features may not disclose considerable variations between neurological and psychiatric
    disorder groups and healthy groups in the entire band-limited EEGs, but may detect
    the variations in specific sub-bands [29].'
