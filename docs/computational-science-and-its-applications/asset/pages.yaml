  img_proc: true
- pgno: 236
  md: 'The DWT can be written as


    $$d_{j,k}=\int_{-\infty}^{\infty}f(t)2^{j/2}\psi(2^jt-k)\,dt=\langle f,\Psi_{j,k}\rangle$$


    where $d_{j,k}$ are known as wavelet (or detailed) coefficients at scale $j$ and
    location $k$. The wavelet coefficients $d_{j,k}$ measure the amount of fluctuation
    about the point $t=k2^{-j}$ with a frequency determined by the dilation index
    $j$.


    Given a signal $f(t)$, its multi-resolution decomposition formula at level H is
    defined as


    $$f(t)=\sum_{k=-\infty}^{\infty}a_{H,k}2^{-H/2}\phi(2^{-H}t-k)+\sum_{j=0}^{H}\sum_{k=-\infty}^{\infty}d_{j,k}2^{-j/2}\psi(2^{-j}t-k)=A_H(t)+\sum_{j=0}^{H}D_j(t)$$


    $\psi(t)$ is the mother wavelet, while $\phi$ is a companion function, called
    scaling function:


    $$\phi_{j,k}(t)=2^{-j/2}\phi(2^{-j}t-k)$$


    are scaled and translated versions of the original scaling function $\phi(t)$.
    $a_{H,k}$ represent approximation or scaling coefficients at level H, and defined
    as $a_{H,k}=\langle f,\phi_{H,k}\rangle$.


    $$f(t)=\sum_{j=-\infty}^{+\infty}\sum_{k=-\infty}^{+\infty}d_{j,k}2^{-j/2}\psi(2^{-j}t-k)$$


    Equation (13.6) expresses the synthesis of the original signal from wavelet coefficients.
    By using down-sampling operations along with low-pass and high-pass filtering,
    signal decomposition as in Equation (13.4) can be efficiently implemented.


    # 13.3.1 Wavelet Entropy


    Wavelet entropy can be calculated from the decomposed signal [29].The orthonormal
    basis in $L^2(\mathbb{R})$ is family $\{\Psi_{j,k}(t)=2^{j/2}\psi(2^jt-k)\}$.
    The energy series is given by


    $$E_{j,k}=|d_{j,k}|^2$$


    and overall energy at resolution $j$ is


    $$E_j=\sum_{k=0}^{2^{M-j}-1}|d_{j,k}|^2$$


    The total energy for the signal can be obtained as


    $$E_{tot}=|cA_l|^2+\sum_{j=1}^{l}|d_{j,k}|^2$$


    Relative wavelet energy at each level is calculated by


    $$P_i=\frac{E_i}{E_{tot}},\ i=1,2,\ldots,l+1$$'
