  md: 'These calculations [57] are sometimes carried out under vacuum conditions.
    A more realistic approach is to use the solvent explicitly. This is done by soaking
    the molecule in a box of solvent molecules. Several water models are proposed
    but the TIP3P water model [68] has been used quite frequently. In this water model,
    the water molecule is defined as a molecule with a rigid triangular geometry having
    a partial charge at each angle referring to the two hydrogens and the intermediate
    oxygen atom of a real water molecule. But the explicit description of a water
    molecule requires additional computational effort. Periodic Boundary Conditions
    (PBC) are normally employed to model the bulk solvent. In infinite PBC, the simulation
    box is infinitely replicated in all directions to form a lattice. Since most of
    the computational time is spent on evaluating the non-bonded interactions between
    atoms, the evaluation time step for non-bonded atom pairs can be increased to
    a small extent. Using a cutoff distance beyond which atoms are no longer considered
    to interact can significantly reduce the amount of non-bonded atom pairs. In these
    cutoff schemes, each particle interacts with the nearest images of the other N-1
    particles or only with those minimum images contained in a sphere of radius R
    cutoff centered at the particle. Usually, a cutoff distance of less than half
    the length of the box is used. However, for long-range interactions such as electrostatic
    interactions, for which the range exceeds half the box, size methods such as Particle
    Mesh Ewald summation [69] or Ewald summation [70] are used.


    # 11.4 Atomistic Simulations of DNA Rupture


    Lee et al. [41] studied the unbinding (rupture) of dsDNA by applying a force along
    the helix direction i.e. at 5′–5′. The rupture force was found to be one order
    magnitude greater than the unzipping force. Strunz et al. [42, 43] investigated
    the unbinding of DNA duplex of various lengths and found that the unbinding force
    depends on the loading rate and sequence length. It was also found that the unbinding
    force is different when a force is applied at 5′–5′ and 3′–3′ of DNA [46, 48].


    Hatch et al. [45] measured the rupture force of dsDNA for different sequence length.
    The rupture force is found to increase linearly for small sequence length and
    saturates for higher sequence length. This is in accordance with the earlier work
    of de Gennes based on the Ladder Model of DNA [71]. In another study, Chakrabarti
    and Nelson [72] extended the de Gennes model (nonlinear generalization of the
    ladder model) and studied the effects of sequence heterogeneity. Mishra et al.
    [73] considered a homo-sequence of DNA, where the covalent bonds and base-pairing
    interactions are modeled by the harmonic spring and Lennard-Jones (LJ) potential,
    respectively. Using Langevin dynamics (LD) simulations [73], they obtained the
    distribution of stretching of hydrogen bonds and the extension in the covalent
    bonds for a wide range of forces below the rupture, which are consistent with
    the Ladder model.


    In this section, we shall perform atomistic simulations with the explicit solvent
    to study the rupture event of the base sequence used in the recent experiment
    [45]. More specifically, here, we are interested in the distribution of extension
    in the hydrogen and covalent bonds of dsDNA along the chain at the semi-microscopic
    level, which is experimentally difficult to obtain.


    We have used AMBER10 software package [63] with all-atom (ff99SB) force field
    [74] to simulate the rupture event of DNA. A force routine has been added in AMBER10
    to do simulation at constant force [75, 76]. In this case, the force has been
    applied at 5′–5′ ends'
