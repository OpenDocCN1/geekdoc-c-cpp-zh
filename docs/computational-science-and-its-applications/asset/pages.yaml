    # 10.4.2 Finite Element Discretization


    There are lot of open-source meshing tools like Gmsh [24] and Tetgen [25] to generate
    unstructured meshes. However, the most important task in computation is to import
    the mesh data and its connectivity generated by these packages into the existing
    data structure of the solver package. For our computations we have used Gmsh to
    generate mesh in ‘.mesh’ file format which is then imported into our in-house
    parallel Finite Element Solver package ParMooN [26] which has built-in modules
    to import the mesh data structure from ‘.mesh’ into ParMooN’s mesh data structure.


    Let $\{\mathscr{T}_h\}$ be a partition of the domain $\Omega(t)$ into tetrahedra
    or hexahedra cells. The diameter of a cell $K \in \mathscr{T}_h$ is denoted by
    $h_K$. The mesh parameter $h$ is defined by $h = \max\{h_K | K \in \mathscr{T}_h\}$
    and $\Omega_h(t) := \bigcup_{K \in \mathscr{T}_h} K$. Further, let $V_h \subset
    V$ and $Q_h \subset Q$ be the conforming finite dimensional subspaces on $\mathscr{T}_h$.
    The standard Galerkin finite element approximation of the variational problem
    (10.11) reads:


    For given $\Omega(0)$, $\mathbf{w}$, $\mathbf{u}_{in}$ and $\mathbf{u}_{0v}$ find
    $(\mathbf{u}_h, p_h) \in V_h \times Q_h$ such that

    $

    \left(\frac{\partial \mathbf{u}_h}{\partial t}, \mathbf{v}\right)_h + a_h(\mathbf{u}_h
    - \mathbf{w}:\mathbf{u}_h, \mathbf{v}) - b_h(p_h, \mathbf{v}) + b_h(q, \mathbf{u}_h)
    = f_h(\mathbf{v}) \quad (10.12)$

    for all $(\mathbf{v}, q) \in V_h \times Q_h$. Here, the subscripts $h$ in $(\cdot,
    \cdot)_h$ and in the bi-/tri-linear forms denote the inner product in $L^2(\Omega_h(t))$
    and its vector valued versions respectively. Next, the choice of the finite element
    spaces for the velocity and pressure is subject to the following inf–sup condition,

    $\inf_{q_h \in Q_h} \sup_{\mathbf{v}_h \in V_h} \frac{(q_h, \nabla \cdot \mathbf{v}_h)}{\|q_h\|_{0_h}
    \|\mathbf{v}_h\|_{V_h}} \ge \beta_1 > 0.$


    We can use equal-order interpolation spaces for the velocity and pressure but
    it will not satisfy the above inf–sup condition and a stabilization method needs
    to be used. Thus, in the proposed numerical scheme, we use inf–sup stable finite
    element pairs for the velocity and pressure (see [9] for more details).


    # 10.4.3 Temporal Discretization and Linearization


    Let $0 = t^0 < t^1 < ... < t^N = I$ be a decomposition of the given time interval
    $[0,I]$, and $\delta t = t^{n+1} - t^n$, $n = 0, ..., N-1$, be a uniform time
    step. Denote $\Omega_h^n = \Omega_h(t^n)$. For brevity, we'
