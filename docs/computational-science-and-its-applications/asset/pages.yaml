  md: '$$\left(m\frac{d^{\alpha}}{dt^{\alpha}}+k\right)f(t)=0,\tag{7.16}$$


    where $\frac{d^{\alpha}f}{dt^{\alpha}}$ denotes the classical fractional derivative
    of order $\alpha$. In this section we replace classical frictional derivative
    by conformable fractional derivative. Thus the equation of harmonic oscillator
    takes the form:


    $$m t^{1-\alpha}\frac{df}{dt}+k f(t)=0.\tag{7.17}$$


    The solution of this equation is


    $$f=c e^{\left(\frac{-k}{m\alpha}\right)^{\alpha}}$$


    MATLAB simulation of conformable fractional harmonic oscillator is given in Figure
