    # 19.6 Conclusions


    This chapter makes some important observations, they are as follows:

    The solute density in the gravel, sand, and clay formations increases with increasing
    temporal variables; moreover the increment in concentration in the clay medium
    is relatively more than that in the gravel or sand medium. The concentration decreases
    more rapidly in the gravel medium than in sand or clay medium. The solute is more
    sensitive to the clayey formation. Further, the concentration curve in the gravel,
    sand, clay concentration curve shows positive skewed nature for the sinusoidal
    velocity pattern of solute particles. The solute under transport shows the highest
    sensitivity to the clayey formations and least sensitivity to the gravel formation.
    The velocities with which a solute advances and the distance it travels affect
    the Peclet number. The solute concentration increases with a decreased value of
    the Courant number at each place in the domain. The contaminant concentration
    increases with the decreasing value of the in-homogeneity parameter (b*) in the
    gravel, sand, and clay mediums. The peak concentration magnitude is higher in
    the clayey formation, for diminished values of b*. At the beginning the concentration
    decreases with the increasing in-homogeneity parameter (b*) and after the attainment
    of the concentration peak, the solute density increases with increasing b*, for
    decreased seepage velocity.


