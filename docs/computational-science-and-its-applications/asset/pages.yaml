    At a technical level it is clear that vector spaces of signals are not just finite
    dimensional, and consequently it is not possible to describe e.g. linear systems
    via ordinary linear algebra, using (finite) matrices or bases for the involved
    function spaces. Again this points to the use of methods from (linear) functional
    analysis, as we have seen. Let us repeat the hint that concrete material can be
    found at the NuHAG web-page (www.nuhag.eu) and that further material may be available
    directly from the author by writing an email to hans.feichtinger@univie.ac.at.


    Based on this insight we have tried to outline in a quasi-practical way the ingredients
    required to design a course providing a good basis for further mathematical studies
    of problems arising in signal processing.


    In the spirit of Conceptual Harmonic Analysis such an approach does not limit
    the considerations to a catalog of settings, usually described in using the categories
    “discrete or continuous,” “periodic or non-periodic,”* but rather asks for a mathematically
    correct description of the transition between the different settings, making use
    of distributional convergence. The most interesting aspect is related to the question
    of approximately computing the ordinary (integral transform called) Fourier transform
    of a smooth function in a numerical way, based on the FFT.


    We expect that it will be important in the coming years to take care of a quantitative
    estimates for constructive realizations of many different operators or procedures,
    using a variety of function space norms (cf. [82, 23]). The present chapter should
    encourage readers to think about the general setting and find some suggestions
    that hopefully will help them to make use of a suitable set of tools, and to prepare
    their students for such tasks ahead.


    In this sense we would like to communicate to the readers that Harmonic Analysis
    should not be seen as an abstract, bloodless, and perhaps esoteric subject of
    pure mathematics, where it is hard to find interesting mathematical problems,
    or only those which have been left over by earlier generations of mathematicians,
    or which require a heavy machinery. In contrast, a systematic recombination of
    methods from linear algebra, supported through numerical software such as MATLAB®,
    with good functional analytic foundations, including a certain collection of function
    spaces, mostly Banach spaces (according to our vision), quickly leads to a number
    of interesting questions which may not only be mathematically challenging but
    also relevant for applied scientists.


