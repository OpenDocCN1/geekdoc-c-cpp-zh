- pgno: 71
  md: '# FIGURE 3.5


    Three-node network: people in every state are rushing from node 1 towards node
    2, and from node 2 towards node 3, keeping the same behavioral class.


    We suppose that during the short interval of time when people are traveling inside
    one edge, they remain in the same behavioral class as displayed in Figure 3.5.
    In this figure, the “geographical” edges (N₁ → N₂); (N₂ → N₃) (i.e. the streets
    linking node 1 to node 2, and node 2 to node 3) are split in three “behavioral
    edges” meaning that on the same street people in reflex, panic, or controlled
    behavior are escaping from node 1 to node 2 (and from node 2 to node 3), therefore
    people in each particular behavior in node 1 are meeting people in the same behavior
    in node 2 (and in the same manner from node 2 to node 3).


    To continue focusing on the special coupling that we are introducing here, we
    suppose that imitation mechanisms are not activated (i.e. F ≡ H ≡ G ≡ 0, which
    is equivalent to αᵢ = δᵢ = μᵢ = 0 for i = 1, 2), and, furthermore, there is no
    domino effect (sᵢ = 0, i = 1, 2) and we also suppose that we are in the interval
    I_trans = [t_s, t_e] where only transitional dynamics are considered. Of course,
    it is easy to relax such limitations, which are not dependent upon the coupling,
    by not eliminating the corresponding terms in the equations.


    In each node N_k, k = 1, 2, 3 such transitional dynamics are the solution of the
    system


    ```

    ⎧ ṙ_k(t) = −(B₁ + B₂) r_k(t)

    ⎨ ċ_k(t) = B₁ r_k(t) + C₁ p_k(t) − C₂ c_k(t)

    ⎩ ṗ_k(t) = B₂ r_k(t) − C₁ p_k(t) + C₂ c_k(t)  (3.16)

    ```


    which is the reduction of System (3.4) in the transition interval (and a particular
    case of Equation (3.15)).


    # 3.1 Note: in the WPCR model, the terms ṙ_k(t), ċ_k(t), ṗ_k(t), q̇_k(t), ḃ_k(t)
    can be considered as flows, because a flow is a quantity of something divided
    by a unit of time. There are two kinds of flow. In Equations (3.4), (3.15), and
    (3.16) flows are “behavioral,” as they represent the quantities of people changing
    their behavior per unit of time. Now we consider also “motion” flows, which are
    the quantities of people in each behavior class, moving from one node to another
    node, per unit of time. Of course, both kinds of flow are combined to produce
    a global equivalent in the following equations.


    Many studies on pedestrian flows have been published (Daamen et al. 2005, Dias
    et al. 2013, Kretz et al. 2006, Liao et al. 2014, Seyfried et al. 2005, Zhang
    et al. 2013, Zhou et al. 2014). We consider, in particular, the survey of Daamen
    et al. (2005), in which the graphs'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'of six different experiments showing the relationship between the flow of pedestrians
    and their densities are displayed. All these graphs show clearly a nonlinear relationship
    of a logistic type between density and flow.


    Moreover, Daamen and co-authors developed a first-order traffic flow theory to
    describe two-dimensional pedestrian flow operations in the case of an oversaturated
    bottleneck in front of which a large, high-density region has formed. Such a mathematical
    model also highlights the logistic relationship for any bottleneck width as one
    can see in Figure 3.6.


    We now introduce our hypothesis for the coupled WPCR (CWPCR), based on this type
    of logistic relationship. Again, for the sake of simplicity, we consider only
    unidirectional motion of the crowd (i.e. motion on an oriented graph), as the
    one displayed in Figure 3.5, because it is supposed that a terrorist attack occurs
    in node 1 and that people try to escape from this node towards nodes 2 and 3.


    When the crowd is moving from one node to another, its speed and the corresponding
    motion flow depends on three factors. The first factor reflects the narrowness
    and the length of the street. More people can go from one place to the next if
    the street is large, rather than in the case of a narrow street. This topological
    characteristic will be modelled by “roughness” coefficients η1,2, η2,3. In fact,
    in the considered coupling, we suppose that people cannot change their behavior
    when they move from one node to another (e.g. controlled people remain controlled,
    panicked people remain panicked, and so on), and thus we use three such kinds
    of roughness coefficients ηr,1,2, ηp,1,2, ηr,1,2, ηr,2,3, ηp,2,3, ηr,2,3 to refer
    to the population in reflex, panic, or controlled situations, respectively. Of
    course, they can have the same value. The second factor is proportional to the
    number of people present in the node from which the crowd is escaping. This is
    equivalent to the pressure of the crowd in these places. The third factor reflects
    the counterpressure due to the maximal capacity of the place toward which the
    people are fleeing, conjugated with the number of persons already present there.
    The combination of pressure and counterpressure gives a bottleneck effect.


    We propose to model this bottleneck effect by a nonlinearity of a logistic type
    to keep the same philosophy as Daamen et al. (2005).


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_72_0.png)


    FIGURE 3.6

    Relationship between flow and density of pedestrians going through an oversaturated
    bottleneck. (Adapted from Daamen et al. 2005.)'
  merge: -1
  img_proc: true
