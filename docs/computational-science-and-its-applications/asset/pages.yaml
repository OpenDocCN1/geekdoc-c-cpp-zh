- pgno: 288
  md: '![](img/81c56bc4b2fca1951aff5e0ab85b66be_288_0.png)


    FIGURE 17.4

    Cognitive agent system.


    # TABLE 17.1


    Cognitive Architecture Taxonomy


    +   - Symbolic architecture based on rules

    +   - Emergent architectures based on models

    +   - Hybrid architecture (A combination of symbolic and connectionist models)


    Cognitive architecture is the layout to develop cognitive agents. It is the foundation
    for the agent and leads to the creation of a unified software program framework
    having the ability to perceive information from the environment, learn and encode
    knowledge, store it in the memory, and associate it with reasoning and decision-making
    to achieve the goal completely inside the framework. So, cognitive architecture
    offers the following outcomes:


    +   1. It provides cognitive agents with robust conventions on modular knowledge
    representation and its processing.

    +   2. It provides the cognitive agent with system-level mental, psychological,
    and human-like intelligent behavior. So, it removes the fundamental level of function
    design to complete particular tasks as in the case of an intelligent agent.

    +   3. It delivers a unified cognitive system methodology in which agents can
    have a common base of knowledge representation and method. So, it decreases the
    need for constructing specific local and unique features in the agent.

    +   4. It gives short- and long-term memories for artificially storing the cognitive
    agent’s knowledge, experiences, beliefs, and goals.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   5. It helps the cognitive agent’s framework for the representation and
    organization of memories and for acquiring the knowledge for achieving goals.
    So, in a cognitive architecture, memory and learning are the two principal components.
    The grouping of these two modules forms a taxonomy of three broad kinds of cognitive
    agent architecture, explicitly symbolic, emergent, and hybrid models (Duch et
    al., 2008).


    # 17.4.1 Symbolic Architectures


    Symbolic archetypes track an extensive belief in Artificial Intelligence and are
    founded on the postulate that the mind occurs primarily to operate symbols that
    indicate features of the world. Specimens for most popular symbolic architectures
    amongst many others are SOAR, ICARUS, and GLAIR. Though symbolic architectures
    comprise several much-appreciated ideas and have produced some remarkable outcomes,
    it is uncertain whether they will encourage the development of the emergent configurations
    and dynamics necessary for human-like general intelligence.


    # 17.4.2 Emergent Architectures


    The emergent architecture help to sustain cognitive agent’s autonomy as humans
    do with the brain. Therefore, the cognitive agent is able to make interactions
    with the environment. They are intended to mimic neural networks or other characteristics
    of the human brain. Similar to traditional AI, emergent cognitive architectures
    have proven to be robust in identifying patterns in high-dimensional facts, associative
    memory configuration, reinforcement learning (Fodar and Plysyn, 1988). Nevertheless,
    perhaps due to the shallow analogy to brain circuits, these architectures have
    not yet led to the high-level emergence of any brain-like tasks.


    # 17.4.3 Hybrid Architecture


    From the work done by researchers, there are equal merits and demerits to symbolic
    and emergent methods. So, researchers fully dedicated themselves to, and focused
    on, developing cognitive architecture on integrative, hybrid architectures. So,
    this links the strengths of both designs, focusing on functioning as described
    above. Research scientists suggest groupings in various ways based on top-down
    and bottom-up approaches. Examples of popular and latest hybrid cognitive architectures
    are ACT-R, CLARION, and LIDA.


    # 17.5 Cognitive Computing Agent Systems


    The architecture of the cognitive computing agent system is the main focus of
    this chapter as a whole and is shown in Figure 17.5. It signifies the essential
    idea about cognitive computing agent-based human-like decision-making processes.


    Compared to traditional intelligent and cognitive agent systems, the cognitive
    computing agent framework is a hybrid cognitive agent plus cognitive computing
    technology centered model (Chandniok and Chaturvedi, 2018). The agent-centric
    prototype gives importance to human perception, learning, memory, knowledge, and
    decision-making'
