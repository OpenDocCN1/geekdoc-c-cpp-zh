    DNA-ICLs prevent the replication and transcription processes to cause cell death.


    # 11.6.2 Unzipping of DNA and DNA-ICLs


    In order to resolve whether the stability of MMC-DNA is greater, compared to t-DNA,
    because of two covalent bonds or not, we unzip the ICLs-free DNA and DNA-ICLs
    (MMC-DNA and t-DNA). Since unzipping force only acts at the center point of the
    fork, the applied force breaks only one base pair at a time and unzipping progresses
    gradually. We expect, when the center fork point meets the ICLs, there will be
    pause. However, for ICLs-free DNA, one should not expect such pause. One can see
    this in Figure 11.13, and that at 300 pN two strands of dsDNA are completely unzipped,
    whereas for DNA-ICLs, only half of the chain is unzipped, and the remaining portion
    of DNA remains intact. Here, one can also see that the relative extension in MMC-DNA
    is much larger compared to t-DNA.


