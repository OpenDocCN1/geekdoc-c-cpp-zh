  md: '```

    a(t + Δt) = a(t) + b(t)Δt + ⋯, (11.10)

    ```


    where Δt is the time step used in the simulation. There are various algorithms/numerical
    schemes for integrating Newton''s equations of motion [56, 57]. The procedure
    for a molecular dynamics simulation is subject to many user-defined variables.
    However, one should consider certain criteria in choosing these algorithms. It
    should conserve energy, momentum, and be computationally efficient so that long
    time-step integration can be performed; because the evaluation of the atomic positions
    is not performed on a continuous basis but at intervals of a time step (Δt ~ femtosecond
    (fs)). Since this is the time scale involved in stretching the bonds with hydrogen
    atoms, one needs a time step of 2 fs. The algorithm that permits this increase
    in simulation speed is called SHAKE [56]. Application of constraints on all bond
    lengths and bond angles would increase the permitted time step even more, without
    too much loss of information.


    It may be noted that the MD is a scheme for studying the time evolution of a classical
    system of N particles in volume V, where total energy is a constant of motion.
    As a result, time averages are equivalent to ensemble averages, the observables,
    say A, evolve according to constant energy simulation, and hence,


    ```

    ⟨A⟩_{N,V,E} = lim_{τ→∞} ∫₀^τ A(t) dt. (11.11)

    ```


    It is possible to run many NVE simulations with different energies and the result
    could be used in a Boltzmann-weighted average as


    ```

    ⟨A⟩_{NVT} = Σ_E ⟨A⟩_{NVE} e^{-βE}. (11.12)

    ```


    Conservation of energy during simulation is a tough task because of the thermal
    fluctuations. Therefore, one prefers to do the simulation in the constant temperature
    ensembles, i.e. NVT ensemble (temperature is fixed). There are different thermostats
    available in the literature (e.g. Berendsen thermostat [65], Langevin thermostat
    [66], Anderson thermostat [67], etc.). Here, we use the Langevin thermostat, where,
    at each time step, all particles of the system experience a random force (white
    noise) originating from stochastic fluctuation and have their velocities influenced
    by a frictional force. These two factors ensure a constant temperature during
    simulation. The Langevin equation of motion is described by


    ```

    m d²r/dt² = -ζ dr/dt + F + Γ (11.13)

    ```


    F is derived from Equation (11.7) ζ and Γ are the friction coefficient and random
    force, respectively. This corresponds to the implicit solvent condition, where
    the contribution of forces arising due to the solvent molecules is taken care
    of by ζ and Γ. The random force is also related to the friction coefficient by
    the fluctuation–dissipation [6, 56, 57] relation given by the following expression:


    ```

    ⟨Γ(t)Γ(t′)⟩ = 2dζTδ(t−t′) (11.14)

    ```


    Here, δ(t−t′) represents the Dirac Delta function and d is dimension of space.
    It may be noted that the friction term ζ only influences the kinetic, but not
    the thermodynamic, properties [6].'
