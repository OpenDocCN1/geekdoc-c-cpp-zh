    # 20.3.1 MRI and Its Preprocessing


    MRI is a safe and useful technique for medical diagnosis by reason of its ability
    to distinguish between various organs and tissues. Also, more biologically variable
    parameters, variable image contrast, transversal relaxation time (T1), proton
    density (PD), longitudinal relaxation time (T2), are often achieved by using various
    pulse sequences and varying the image parameters. Three pictures PD, T1, and T2
    are produced and their signal strength used to specify tissue characteristics.
    Any one of the following can be used to take pictures: (Neck to head), coronal
    (front to back), and sagittal (ear to ear) [24]. Brain MRI pictures may be color
    pictures. The color picture is initially converted into grey scale or an intensity
    image. The gray scale image is the array of groups of pixel intensity values that
    specifies the intensity strength. The range of the intensity is (0,1) for single
    and double cases. For unsigned integer 8-bits, the values change from [0,255].
    For unsigned integer 16-bits, the values also change from [0, 65535]. For signed
    integer 16-bits, the values change from [−32768, 32767]. Strength or brightness
    of a picture as two-dimensional continuous function F (x, y) wherever (x, y) denotes
    the spatial coordinates [25].


    # 20.3.2 Filtering


    Filtering is the procedure of eliminating noise from MRI pictures. In general,
    medical pictures contain several noises at the time of acquisition. In this work,
    a median filter is applied to separate noise from the MRI pictures (Figure 20.6).


    # 20.3.3 Skull Masking


    An exclusion of non-brain tissue like scalp, skull, fat, eyes, neck, etc. from
    MRI brain pictures is known as skull masking. It is used for enhancing the speed
    and accuracy, in medical applications, to diagnose and predict. Two elementary
    morphological operations


