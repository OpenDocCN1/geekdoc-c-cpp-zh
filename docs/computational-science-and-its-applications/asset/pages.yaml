  md: 'the usual sense. Practically speaking we restrict our attention to spaces of
    test functions inside the Wiener algebra W(C0, ℓ1)(ℝd), but we do not discuss
    this aspect here.


    To come back to our argument: we prefer to work with S0(ℝd), which is a space
    of continuous and Riemann integrable functions with the additional property of
    being Fourier invariant, which in turn implies that also the dual space is invariant
    under the (extended) Fourier transform, defined simply by the relation


    ```

    σ̂(f) = σ̂(f),  f ∈ S0(ℝd), σ ∈ S0''(ℝd).

    ```


    The elements of S0(ℝd) are not smooth, in the sense that they may not have a derivative.
    The most simple example is the “triangular function,” i.e. the convolution product
    of a rectangular function (the indicator function of some interval [a,b] ⊂ ℝ)
    by itself, because this function is obviously in the Fourier algebra (its Fourier
    transform is of the form sin(πt)² / (πt)² ∈ L1(ℝ)) and it has compact support.


    This lack of smoothness at the level of test functions should not only be seen
    as a drawback. It also has advantages at the level of the dual spaces. Among others
    it is the reason why one can prove that any distribution with finite support is
    just a finite discrete measure, i.e. it is of the form μ(f) = Σk=1n ckδxk, a finite
    linear combination of Dirac measure.


    Distributions (in fact bounded, continuous functions) whose Fourier transform
    (in the S0''(ℝd)-sense) is such a finite discrete measure are called a “trigonometric
    polynomial.” In fact the uniform limits of such trigonometric polynomials are
    known as “almost periodic functions” in the classical literature. The formulas
    to determine the frequencies contained in such an almost periodic function can
    also be well explained by means of this generalized Fourier transform. Individual
    discrete contributions on the Fourier side are filtered out by functions which
    are concentrated near such a Dirac measure and mostly ignoring the nearby contributions.
    On the time-side these filters can be characterized as convolutions with widely
    stretched envelope windows modulated by the corresponding frequency which has
    to be filtered out in a kind of “tuning process” comparable to the selection of
    a radio channel in a receiver.


    A similar statement is valid for distributions σ ∈ S0''(ℝd) supported on a discrete
    lattice Λ. This is the basis for the proof of the so-called “Janssen representation”
    for the Gabor frame operator as given in [46] (an argument which does not work
    in the setting of s''(ℝd), because in this case also partial derivatives of Dirac
    measures are among the distributions concentrated in a single point).


