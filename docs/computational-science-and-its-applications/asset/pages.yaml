    # 10.3.1.2 Level Set Method


    A continuous zero-level set function represents the interface in the level set
    method. The level set function $\phi(x,t)$ is constructed as signed distance function
    in such a way that $\phi(x,t)>0$ holds on one side of the interface and $\phi(x,t)>0$
    holds on the other side of the interface. Similarly, several interfaces can be
    represented by the same level set function $\phi(x,t)$.


    As an example, let us consider an interface of an unit circle centre at origin
    at time $t=0$. We assume that the interface inside a square domain $[-2,2]$, which
    is meshed by a square grid (Figure 10.4). A signed distance level set function,
    pictures which have positive values inside the circle and negative values outside
    the circle, at a time $t=0$ is defined by


    $$\phi(x,0)=1-\sqrt{x^2+y^2}.$$


    Here, the zero level set function $\phi(x,0)=0$, represents the interface. Given
    the fluid velocity **u** on the background mesh, the interface is advected by
    solving the advection equation


    $$\frac{\partial \phi(x,t)}{\partial t}+\mathbf{u}\cdot\phi(x,t)=0,$$


    for a new level set function at time $t\geq 0$. The numerical error, which is
    obtained by discretizing the advection equation, causes a problem to guarantee
    mass conservation in each fluid phase. In particular, the most losses are significant
    on coarse meshes [10]. More accurate and robust numerical schemes (for e.g., higher
    order ENO/WENO) are proposed in the literature to solve this type of advection
    equation. In the finite element context, the mass loss can be reduced by using
    finer meshes. However, the computational costs would enormously increase. Alternatively,
    a mass correction scheme has been used in [12]. Additionally, a stabilization
    technique such as streamline diffusion (SDFEM) has to be used for advection equation
    to get a stable system [12, 13].


    Moreover, it is essential that $\phi(x,t)$ remains as a signed distance function
    to guarantee mass conservation. In general, this property is not preserved during
    the advection and thus a reinitialization technique has been proposed in the literature
    to overcome this difficulty. Recent advances in the level set method, add the
    natural ability to handle the topological changes of the interface, make the method
    attractive.


    # 10.3.1.3 Front Tracking Method


    The basic idea behind the front tracking method is to use separate front markers
    for the interface on a fixed mesh and modify the mesh near the front to fit the
    interface. The method which we discuss here is a hybrid one between the front
    tracking and the front capturing methods [14]. The main idea is to use stationary
    meshes for the fluid flow and a separate one-dimensional lower moving mesh to
    track the interface. The front points (interface mesh points) are advected by
    the computed velocity, where the velocity at each front is obtained by an interpolation
    from the fixed background mesh.'
