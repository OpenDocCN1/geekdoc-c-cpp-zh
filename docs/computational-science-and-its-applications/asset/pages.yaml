  md: 'We will denote by C_c^k(Ω) the collection of all functions with compact support
    in Ω for which all partial derivatives of order up to k exist and all the partial
    derivatives are continuous. We also denote C_c^∞(Ω) = ∩_{k=1}^∞ C_c^k(Ω).


    # Definition 9.1 Let Ω be an open set in ℝ^n we define for 1 ≤ p ≤ ∞ and k ∈ ℕ
    the Sobolev spaces W^{k,p}(Ω) and W_0^{k,p}(Ω) by


    W^{k,p}(Ω) = { u ∈ L^p(Ω) : D^α u ∈ L^p(Ω), ∀ α with |α| ≤ k }


    and


    W_0^{k,p}(Ω) = closure of C_c^∞(Ω) in W^{k,p}(Ω)


    where W^{k,p}(Ω) is endowed with the norm ||·||_{k,p} given by


    || u ||_{k,p} = Σ_{|α| ≤ k} || D^α u ||_{L^p}


    When p = 2 we denote


    W^{k,2}(Ω) = H^k(Ω), W_0^{k,2}(Ω) = H_0^k(Ω)


    With these definitions we can state the Sobolev embedding theorem:


    # Lemma 9.1 Let Ω be a bounded domain in ℝ^n and kp < n, then


    W^{k,p}(Ω) ↪ L^q(Ω), 1 ≤ q ≤ np / (n - kp)


    When kp = n


    W^{k,p}(Ω) ↪ L^q(Ω), 1 ≤ q < ∞


    but W^{k,p}(Ω) ↪̸ L^∞(Ω)


    Let us also recall the well-known Poincaré lemma:


    # Lemma 9.2 Let Ω be a bounded domain in ℝ^n, then there exists a constant C depending
    on Ω such that


    C ∫_Ω |u|^p dx ≤ ∫_Ω |∇u|^p dx, ∀ u ∈ W_0^{1,p}(Ω).


    As a corollary we get


    # Corollary 9.1 Let Ω be a bounded domain in ℝ^n then (∫_Ω |∇u|^p dx)^{1/p} is
    an equivalent norm in W_0^{1,p}(Ω).'
