    # 15.5 Conclusion


    This chapter has presented a secure and efficient identity-based mutual authentication
    protocol for cloud computing. This work has shown that it is secure and has many
    features and attributes such as key freshness, known session keys impersonation
    attack, PKG forward secrecy, replay attack, known session-specific attack, perfect
    forward secrecy, man-in-the-middle attack, mutual authentication, session key
    establishment, session key security, support anonymity property, and implicit
    key authentication. Further, this work proved that the framework is secured to
    launch safe communication channels via the unconfident channel. Future research
    also includes conserving the secrecy of the users’ information offered to the
    cloud server.


