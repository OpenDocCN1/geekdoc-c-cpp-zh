    # 10.1 Introduction


    Computational fluid dynamics (CFD) for ship hydrodynamics has been the subject
    of intense research in both scientific and industrial communities over the past
    few decades. The ultimate goal of the computational ship hydrodynamics is to compute
    the behavior of flows around the ships, the motion of the ships, etc., and to
    study the performance of full-scale ships under real operating conditions. Full-scale
    simulations will reduce the dependence on the time consuming tank tests and the
    costs associated with it. Further, tank tests on scaled-down prototypes need not
    necessarily reflect the behaviors of newly designed full-scale versions of ships.
    Moreover experiments on full-scale models are very challenging and are not'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'economical, and thus computational modeling is the way forward. Thanks to the
    constant increase in computer memory, core count, and speed, together with improvements
    in the numerical schemes and parallel algorithms, the computational costs are
    constantly decreasing. Moreover, enhanced flow visualization and force decomposition
    provide much richer information and may lead to a much better understanding of
    the flow phenomena.


    The earliest important theoretical result on ship hydrodynamics by Froude and
    Krylov [1, 2], dating back to the end of the nineteenth century, was the first
    general theory on ship motion. The authors built bases for the understanding of
    the different physical aspects in the dynamics of an advancing vessel. In particular,
    Froude investigated the role of the wave component of the resistance and gave
    his name to the non-dimensional number that characterizes free-surface flows—the
    Froude number. In 1898, a thin-ship theory was proposed in [3] to describe the
    waves generated by an advancing ship and an analytical estimation of the wave
    resistance (based on the so-called Mitchell’s integral) was derived. Moreover,
    numerical schemes based on the solution of the potential flow equation have been
    developed in the field of aerodynamics (see, e.g., the pioneering work of Hess
    and Smith [4]) and later extended to the solution of ship hydrodynamic problems
    [5, 6]. However, a simple irrotational and inviscid flow model has been considered
    in these studies.


    In the last two decades several numerical schemes for the solution of the Navier–Stokes
    equations have successfully been developed for naval engineering problems [7,
    8]. In addition, an increase in computing power has broadened the class of naval
    problems that could be solved, including the possibility of treating viscous,
    turbulent, and separated flows.


    CFD approaches for free-surface and multiphase-flow problems can be classified
    into two main categories based on the kinematic approaches on calculating fluid
    flows: (i) Eulerian approach, and (ii) Lagrangian approach. In the Eulerian approaches
    such as Front Tracking, Level Set, Volume-of-Fluid, Immersed Boundary, etc., the
    model equations are solved in a fixed computational mesh, whereas the moving interfaces
    are tracked separately. Accurately specifying the material properties in their
    respective phases, incorporating interfacial forces, and accurately tracking the
    interface between two fluids are the main challenges in Eulerian approaches. Contrarily,
    in the Lagrangian approaches like the Arbitrary Lagrangian Eulerian (ALE) method,
    the material properties and the interfacial forces can be incorporated accurately
    since the interface is resolved by the computational mesh. Nevertheless, handling
    geometries with large deformation and incorporating topological changes are very
    challenging in the ALE approach. Despite several advances made in the field of
    CFD, tracking interfaces, incorporating interfacial forces, and accurately coupling
    the existing flow solvers with structure models still remains challenging.


    In this chapter, the ship hydrodynamics model, a numerical scheme based on the
    ALE approach, solution approaches and a few results are presented.


