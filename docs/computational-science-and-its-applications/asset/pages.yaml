    \ a keen interest in developing the theory as this definition has resolved the\
    \ problem of computation. Fractional power series [8,9,10] is one of the applications\
    \ of conformable fractional derivative. Here we study the fractional power series\
    \ solution of Laguerre and Chebyshev conformable differential equations using\
    \ Katugampola’s derivative [11] which is the generalized form of conformable derivative.\n\
