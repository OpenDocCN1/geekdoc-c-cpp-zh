  md: '# 5.2.2 Inverse Problem in EIT


    The forward problem uses knowledge of conductivity parameter $q$ to find the boundary
    data associated with a given source. The inverse problem instead uses knowledge
    of the source and boundary data and finds the conductivity interior to the object.
    The goal is to estimate the conductivity distribution $q$ from all pairs of current
    and voltage measurements. The identification of the parameter $q$ can be formulated
    as the following minimization problem for the cost functional


    $$J(q)=\|\mathscr{F}(q)-g_{\delta}\|_{L_2(\partial\Omega)}^2 \tag{5.16}$$


    where $g_{\delta}$ approximate the exact data $g=\mathscr{F}(q)$ with the accuracy
    $\delta$, i.e.


    $$\|g-g_{\delta}\|<\delta \tag{5.17}$$


    However, because of the ill-posedness of the problem, regularization is needed
    and one of the well-known regularizations is Tikhonov''s regularization, mainly,


    $$J_{\alpha}(q)=\|\mathscr{F}(q)-g_{\delta}(q)-g_{\delta}\|_{L_2(\partial\Omega)}^2+\alpha\|q-q^*\|_{L_2(\Omega)}^2
    \tag{5.18}$$


    where $\lambda$ is the regularization parameter and $q^*$ is the prior or background
    parameter.


    There are several other regularization approaches (see Section 5.4), for example
    for a particular EIT application total variation (TV) regularization functional
    may be most appropriate,


    $$J_{\alpha}(q)=\|\mathscr{F}(q)-g^{\delta}\|_{L_2(\partial\Omega)}^2+\alpha\|\nabla
    q\|_{L_1(\Omega)} \tag{5.19}$$


    where $\alpha$ is a TV regularization parameter. The regularization parameter
    $\alpha$ is typically determined on a trial and error basis.


    # 5.2.2.1 Why Is the Inverse Problem Ill-Posed?


    The inverse problem here is ill-posed because the EIT model is an elliptic PDE
    and an elliptic forward operator is a highly smooth operator, which means the
    information about the parameter $q$ is diffused as it travels to the boundary
    i.e. the boundary measurements don''t have enough information about an inhomogeneity
    located far away from the boundary. In fact, the information from the data at
    the boundary about the inhomogeneity is exponentially decayed away from the boundary
    [10]. This means that if an inhomogeneity is closer to the boundary then the data
    on the boundary provides better information for a reconstruction of the inhomogeneity.
    If an inhomogeneity is far away from the boundary, then the data on the boundary
    does not provide sufficient information due to the exponential decay [10]. So
    the very fact that elliptic equations can handle rough parameters $q$ and still
    solve the forward problem for $u$ resulting in a very smooth solution, in turn
    makes the inverse problem ill-posed. Therefore, EIT is an extremely challenging
    inverse problem.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'We will discuss more about the nonlinearity and ill-posedness of inverse problems
    while discussing DOT below.


    # 5.2.2.2 Connection to DOT


    EIT is a close cousin of DOT because the forward problem for both is elliptic
    with DOT being worse in the sense that DOT requires estimating two functions mainly
    q = (D, μ_a) rather than one parameter for EIT. However DOT is an important modality
    in practice because DOT can be used as an alternative to X-ray in detecting cancer
    in the breast and the brain.


    # 5.3 Diffuse Optical Tomography


    In optical imaging, low-energy visible light is used to illuminate biological
    tissue. The illumination of the tissue is modelled as a photon transport phenomenon.
    The process is described by the most widely applied equation in optical imaging,
    the radiative transfer, or transport equation (RTE) [11, 12]. RTE is an integro-differential
    equation for photon density and has spatially dependent diffusion and absorption
    parameters as coefficients. These coefficients are a priori unknown for a particular
    tissue sample of an individual who is being examined for cancer. Therefore, the
    problem is to infer from the measurements of the photon density on the boundary
    the coefficients of absorption and diffusion in the tissue. This estimate helps
    determine the location and size of the abnormality in the tissue.


    # 5.3.1 Radiative Transport Equation


    Let Ω ⊂ R^n, with n=2, 3 and with boundary ∂Ω, ν(x) denote the outward unit normal
    to ∂Ω at the point x ∈ ∂Ω, and Γ± is defined as,


    Γ± := { (x,s,t) ∈ ∂Ω × S^{n-1} × [0,T], ±ν(x)·s > 0 }.


    For example, one may assume a geometry as shown in Figure 5.1.


    Then the RTE is given by,


    1/c ∂u/∂t (x,s,t) + s·∇u(x,s,t) + a(x)u(x,s,t) - b(x) ∫_{S^{n-1}} Θ(s·s'') u(x,s'',t)
    ds'' = f(x,s,t) (5.20)


    together with the initial and boundary conditions,


    u(x,s,0) = 0 in Ω × S^{n-1} (5.21)


