    + 3M²/2 ∑_{n=2^{k−1}+1}^{∞} ∑_{m=0}^{M−1} 1/(n⁵(2m−3)⁴) )^{1/2} (24.18)


    We have applied Legendre wavelets to Equation (24.12) which is a second-kind Volterra
    integral equation. Writing Equation (24.12) in simplified form we get


    ∫₀ˣ K(x,t) f(t) dt + α f(x) = g(x) (24.19)


    Let f_{n,m}(x) be the approximate value of function f(x) obtained by truncating
    the Legendre wavelet for some suitable value of M and k. If we use the approximate
    value of f(t) in Equation (24.19), the function g(x) will also differ from its
    actual value (let us denote it by g_{n,m}(x)), we have


    ∫₀ˣ K(x,t) f_{n,m}(t) dt + f_{n,m}(x) α = g_{n,m}(x) (24.20)


    Subtracting Equation (24.20) from Equation (24.19), we get


    g_{n,m}(x) − g(x) = ∫₀ˣ K(x,t)(f_{n,m}(t) − f(t)) dt + (f_{n,m}(x) − f(x)) α


    which is again a second-kind integral equation. Taking L² norm, we have


    ‖ g(x) − g_{n,m}(x) ‖ = ‖ ∫₀ˣ K(x,t)(f_{n,m}(t) − f(t)) dt + (f_{n,m}(x) − f(x))
    α ‖ ≤ ‖ ∫₀ˣ K(x,t)(f_{n,m}(t) − f(t)) dt ‖ + ‖ (f_{n,m}(x) − f(x)) α ‖ ≤ ∫₀ˣ ‖
    K(x,t)(f_{n,m}(t) − f(t)) ‖ dt + ‖ (f_{n,m}(x) − f(x)) α ‖ ≤ ∫₀ˣ ‖ K(x,t) ‖ ‖
    (f_{n,m}(t) − f(t)) ‖ dt + ‖ (f_{n,m}(x) − f(x)) ‖ |α| = ‖ (f_{n,m}(x) − f(x))
    ‖ ( ∫₀ˣ ‖ K(x,t) ‖ dt + |α| )


