- pgno: 199
  md: 'The dihedral angle potential energy term between four atoms (i, j, k, l) is
    usually expressed as a cosine series expansion


    ```

    $$V_{\text{torsion}} = \sum_{\text{dihedrals}} \left(\frac{V_n}{2}\right)(1 +
    \cos[n\phi + \delta]), \tag{11.4}$$

    ```


    where $V_n$ refers to the barrier height, $\phi$ is the torsion angle for the
    quadruple of atoms $i$–$j$–$k$–$l$, $n$ is the multiplicity that gives the number
    of minima in the cosine function, and $\delta$ (the phase factor) determines which
    dihedral angle values correspond to these minima. $V_n$, $n$, $\delta$ are set
    for each type of atom quadruplet.


    The non-bonded interactions are usually divided into two groups: (i) van der Waals
    and (ii) electrostatic interactions. The van der Waals interactions between non-bonded
    atoms are usually represented by a Lennard–Jones potential function:


    ```

    $$V_{\text{vdw}} = \sum_{\text{nonbij}} \left(\frac{A_{ij}}{r_{ij}^{12}} - \left(\frac{B_{ij}}{r_{ij}^{6}}\right)\right)
    \tag{11.5}$$

    ```


    where $A_{ij}$ is the repulsive term coefficient, $B_{ij}$ is the attractive term
    coefficient, and $r_{ij}$ is the distance between the two atoms $i$ and $j$.


    Nucleic acids have been considered as a challenge for simulation because of the
    negative backbone charge and the behavior of polyelectrolytes. In simulations,
    particular attention should be paid to the atomic charges. The electrostatic interactions
    are generally described by a simple Coulomb potential function:


    ```

    $$V_{\text{elec}} = \sum_{\text{nonbij}} \left(\frac{q_i q_j}{r_{ij}}\right),
    \tag{11.6}$$

    ```


    where $q_i$ and $q_j$ correspond to the atomic charges of interacting atoms $i$
    and $j$, respectively, and $r_{ij}$ corresponds to the distance between the two
    atoms.


    In a typical MD simulation, an initial configuration of the system is obtained
    from either experimental structures or comparative modeling data, and the particles
    are allowed to interact under the suitable potential, say by Equation (11.1).
    The time evolution of a molecular system is determined by solving the following
    Newton’s equation of motion for all atoms,


    ```

    $$\mathbf{F}_i = m_i \frac{d^2 \mathbf{r}_i}{dt^2} = -\frac{dV}{d\mathbf{r}_i},
    \tag{11.7}$$

    ```


    where $\mathbf{F}_i$ is the force experienced by the $i^{th}$ particle of mass
    $m_i$ due to the potential energy $V$ of the system. The potential energy, as
    defined above, is a complicated function, and there is no analytic solution to
    the equation of motion, and therefore, one has to solve these equations numerically.
    They all are derived from the Taylor expansion. The expansion for the position
    ($\mathbf{r}$), velocity ($\mathbf{v}$), and acceleration ($\mathbf{a}$) of the
    particles at some instant of time $t$ is


    ```

    $$\mathbf{r}(t + \Delta t) = \mathbf{r}(t) + \mathbf{v}(t)\Delta t + \frac{1}{2}
    \mathbf{a}(t)\Delta t^2 + \cdots \tag{11.8}$$

    ```


    ```

    $$\mathbf{v}(t + \Delta t) = \mathbf{v}(t) + \mathbf{a}(t)\Delta t + \frac{1}{2}
    b(t)\Delta t^2 + \cdots \tag{11.9}$$

    ```'
