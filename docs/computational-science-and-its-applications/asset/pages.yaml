    # 26.4 Numerical Experiments


    In this chapter, the ARW model is configured with a single domain at 9 km horizontal
    grid resolution and 42 sigma levels vertically. The details of physical parameterization
    schemes and model configuration are summarized in Table 26.1. In this study, two
    numerical experiments are performed to simulate two heavy rainfall events. The
    first experiment is named as a control (CNTL) experiment without data assimilation
    using global National Centers for Environmental Prediction (NCEP) FiNaL analysis
    (FNL, resolution 1°×1°) with a 6-hourly interval as IC and BCs of the model. The
    second experiment is named as 3DV, where the model IC is modified by inserting
    Global Telecommunication System (GTS) observations through 3DVAR data assimilation
    system. The detail observations used in the data assimilation system are provided
    in Table 26.2. The observations used in the assimilation experiment are with a
    ± 3 h time window. The ARW model configuration and model physics are the same
    for both experiments.


    # 26.5 Result and Discussions


    # 26.5.1 Impact of Assimilation on Model Initial Fields


    The impact of inserting observations through 3DVAR analysis system at model initial
    condition and model simulated meteorological fields is examined in this section.
