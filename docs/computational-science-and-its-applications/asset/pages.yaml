- pgno: 17
  md: '# Editors


    The late Prof. A. H. Siddiqi was an Indian mathematician and Professor of Applied
    Mathematics. He serred as Professor Emeritus in the School of Basic Sciences and
    Research at Sharda University, Greater Noida, India. He also served as a former
    Pro Vice-Chancellor, Aligarh Muslim University. Siddiqi was also the President
    of the Indian Society of Industrial and Applied Mathematics (ISIAM). He authored
    12 books, edited 12 books, and published more than 100 research papers. He has
    also held important administrative positions in AMU and other institutions of
    repute.


    Dr. R. C. Singh has 30 years of experience as a researcher, of which more than
    10 years were as Professor of Physics. Dr. Singh is a Professor of Physics at
    and the Controller of Examinations of Sharda University. Dr. Singh obtained his
    doctorate from Banaras Hindu University (BHU), Varanasi in theoretical Condensed
    Matter Physics. He obtained his B.Sc. (Hons.) and M.Sc. degrees also in Physics
    from Banaras Hindu University. Dr. Singh has published more than 30 research papers
    in peer-reviewed international journals and conference proceedings. He has authored
    one book and co-edited seven conference proceedings. His area of research interest
    includes study of phase transitions in molecular liquids using density-functional
    theory; time-series analysis using wavelets; biometrics and solar cells.


    Dr. G. D. Veerappa Gowda is a Professor at the TIFR Centre for Applicable Mathematics,
    Bangalore. He has done fundamental work in the areas of Hyperbolic conservation
    laws, control theory, and numerical approximation of conservation laws. Dr. Gowda
    obtained their M.Sc in Physics from Mysore India, in 1978. They obtained their
    PhD. from the University of Paris-Dauphine, France in 1988. Dr. Gowda obtained
    an explicit formula for the entropy weak solution of convex conservation laws
    with boundary conditions, extending the earlier work of Hopf and Lax for the initial
    value problem. Dr. Gowda has developed numerical schemes to solve problems arising
    in oil recovery and sand pile problems on a vertical source.'
