    # 24.5 Numerical Examples


    We will present the numerical solution to some problems of Volterra integral equations
    of the first kind. The numerical results presented in this chapter are obtained
    using $k=3$, $M=3$, i.e., 12 collocation points. All the computations are performed
    with help of Matlab.


    # Example 5.1 Solve the following integral equation


    $$\int_{0}^{x} \cos(x-t) f(t) dt = x \sin x, \ 0 \le x < 1.$$


    The exact solution is $f(x)=2\sin x$.


    The numerical solution converges to the exact solution for $r=10^{-3}$. The RMS
    and MAE obtained are 9.90872e-05 and 1.57312e-04 respectively. Table 24.1 shows
    the numerical results for Example 1. The error obtained is less than the method
    discussed in [2] using 64 and 128 collocation points. Maleknejad [10] used Haar
    wavelets with 128 elements and MAE obtained is 0.01, which is very large as compared
    to our method where we have used 12 collocation points. The results obtained by
    the proposed method are better as compared to the methods presented in [2] and
    [10].


