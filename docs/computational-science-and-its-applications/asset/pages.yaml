- pgno: 348
  md: 'The importance of this question grew more when [Klee 1961] proved: Singletonness
    of uniquely remot al sets in Hilbert spaces is equivalent to convexity of Chebyshev
    sets.


    Most of the literature available in approximation theory is in spaces which are
    normed linear spaces. The absolute homogeneity of norm function, convexity of
    balls, and existence of non-trivial dual spaces of normed linear spaces have helped
    a lot in developing a fairly large theory of approximation in normed linear spaces.
    On the other hand, such properties are generally not available in more general
    spaces. Moreover, in these spaces the spheres are not generally convex and there
    are linear metric spaces whose dual spaces consist of zero element alone.


    So, the consideration of problems of approximation in abstract spaces like linear
    metric spaces, convex metric spaces, and metric spaces is quite challenging. It
    is interesting in itself to see which of the results about normed linear spaces
    survive in the somewhat more general settings. Moreover, often one has to consider
    approximation problems in spaces which are not normed linear spaces. With this
    aim, in this chapter we consider nearest points and farthest points in abstract
    spaces which are more general than normed linear spaces. We obtain results for
    subsets of these spaces to be proximinal, Chebyshev, remotal, and uniquely remotal,
    and also discuss singletonness of uniquely remotal sets. The results proved in
    this chapter extend results proved in [Mousavi et al. 2017], [Sababheh et al.
    2010], and [Sain et al. 2017] for normed linear spaces to other abstract spaces.


    # 21.2 Notations and Definitions


    In this section we give some notations and recall a few definitions to be used
    in the sequel.


    Definition 21.1 Let (X, d) be a metric space and x, y, z ∈ X. We say that z is
    between x and y if d(x, z) + d(z, y) = d(x, y). For any two points x, y ∈ X, the
    set


    {z ∈ X : d(x, z) + d(z, y) = d(x, y)}


    is called a metric segment and is denoted by [x, y]. The set [x, y, −[ = {z ∈
    X : d(x, y) + d(y, z) = d(x, z)} denotes a half ray starting from x and passing
    through y. Also (x, y] denotes [x, y] / {x}.


    Definition 21.2 A metric space (X, d) is called externally convex [Khalil 1988]
    if for all distinct points x, y ∈ X such that d(x, y) = λ and r > λ there exists
    a unique z ∈ X such that d(x, y) + d(y, z) = d(x, z) = r.


    Example 21.1 (Khalil 1988) Consider the space (X, d) consisting of points on the
    lines y = 1 and y = 2 in the cartesian plane with x ≥ 0. Define a metric d as


    d((x₁, y₁), (x₂, y₂)) = { |x₁| − |x₂| , if y₁ = y₂, 1 + |x₁| + |x₂| , if y₁ ≠
    y₂. (21.1)


    Then (X, d) is externally convex. X is not a normed linear space as it is not
    a linear space.'
