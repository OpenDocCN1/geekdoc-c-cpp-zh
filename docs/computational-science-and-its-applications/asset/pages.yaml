  md: '# 17.2.2 Taxonomy of Intelligent Agent


    The research is carried out by several researchers in the field of developing
    and using agents for intelligent systems. Each researcher has proposed their concepts
    for the individual agent’s model. Therefore, for removing research gaps and creating
    a single base for all the works in an intelligent system, offering a holistic
    taxonomy of agent-based on prenominal concepts is necessary, as shown in Figure
    17.2.


    The classification of intelligent agents is as follows:


    +   - **Physical Agents:** Physical agents are individual biological, artificial,
    or a combination of both of the physical entities that can perform intelligence-based
    decision-making. Physical agents are further classified as:

    +     1. **Natural Agents:** Humans, animal, and other biological entities are
    examples of natural agents.

    +     2. **Artificial Agents:** Artificial entities have features of autonomy,
    learning, reactivity, and reasoning power and are the particular cases of an artificial
    agent that humans create using artificial technology to get help in completing
    specific tasks. The artificial agents are further grouped as follows:

    +        - **Robotic Agents:** Robots are the agents that perform mechanical actions
    on getting perception from an environment based on hard-coded software instructions.

    +        - **Intelligent Agents:** These agents perform autonomously using stored
    memory knowledge and a sense-making ability to complete the goal in the best way
    based on certain architecture models.

    +        - **Cognitive Agents:** Cognitive agents are software agents specifically
    having human-like mental intelligence using the concept of cognitive science to
    provide human-mind based decision-making.


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_284_0.png)


    FIGURE 17.2

    Taxonomy of intelligent agent system.'
  merge: -1
  img_proc: true
