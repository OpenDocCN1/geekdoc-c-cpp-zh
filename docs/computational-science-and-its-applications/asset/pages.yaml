    Through de-noising, the quality of spectra is enhanced. Thus, the physical and
    chemical properties of material can be analyzed more accurately.


    # 14.4 Conclusions


    Increased values of signal to noise ratio for different values of regularization
    parameter show that iterative clipping algorithm suits for de-noising the Raman
    spectral data. As the values of regularization parameter increase, the SNR ratio
    decreases, and RMSE increases. This shows that de-noising depends on the values
    of the regularization parameter. Larger noise levels call for larger regularization
    parameter λ. This is reflected from the Table 14.1. The calculated SNR and RMSE
    for different values of regularization parameter show a satisfactory result.


    # References


    Bredies, K., Kunisch, K., and Pock, T. 2010. Total generalized variation. SIAM
    Journal on Imaging Sciences 3(3): 492–526.'
