    214

    +   13.4 Implementation...........................................................................................................................
    215

    +   13.5 Results and Discussion ..............................................................................................................
    215

    +   13.5.1 Wavelet Transform and Decomposition at Different Levels .......................................
    215

    +   13.5.2 Classification of Frequency Band .....................................................................................
    215

