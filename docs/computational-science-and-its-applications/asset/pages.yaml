  md: 'CERES-rice model was done for different rice cultivars in Navsari, hence the
    lowest percentage errors in grain yield and biomass production were found [25].
    A statistical yield forecast model has been developed for chickpea productivity
    over Rajkot district of Gujarat using the combined effect of weather parameters
    which shows very high variations in the generated model and could be efficiently
    used for the pre-harvest forecast, four weeks in advance of harvesting of the
    crop [26]. A yield forecast of winter rice in seven districts of two agro-climatic
    zones of Assam (central and upper Brahmaputra valley) has been developed employing
    meteorological variables through combined effects which could forecast with errors
    of less than 1% over almost all the districts except for Golaghat (2.02%) and
    Tinisukia (17.61%) [27].


    The objective of this chapter is to examine the effect of weather parameters on
    rice production, i.e. maximum and minimum temperature, rainfall, and morning and
    evening time relative humidity over Gorakhpur District of Eastern U.P. and to
    forecast rice yield five to ten weeks in advance of harvesting.


    # 16.2 Materials and Method


    The production data of the rice crop in quintal/hectare for Gorakhpur district
    (which lies between latitude 26°13′N and 27°29′N and longitude 83°05′E and 83°56′E
    and receives annual rainfall of about 1200 mm) of Eastern Uttar Pradesh for a
    period of 40 years, i.e. from 1971 to 2010, are collected from ICRISAT (International
    Crop Research Institute for the Semi-Arid Tropics). Daily weather data for this
    long period were collected from National Data Centre of IMD (India Meteorological
    Department). The five weather variables used in the study are maximum temperature
    (°C), minimum temperature (°C), rainfall (mm), relative morning and evening humidity
    in percentages. The collected daily weather data for this period were arranged
    in weeks for each year. According to the standard meteorological week (SMW), the
    rice-growing season (the period from sowing to harvesting the crop) runs from
    the twenty-second to the forty-first week of the year, with the weeks arranged
    according to the crop season. Correlation was calculated between adjusted yield
    and each week of weather variables to obtain the Z indices, i.e. the list of unweighted
    and weighted indices, and these are shown in Table 16.1 with their notations.
    Unweighted indices are the simple sum and weighted indices are the sum product
    of weather variables, their correlation and past year observed yields. Out of
    40 years, 36 years were used for generating the model, i.e. 1971 to 2006. The
    best regression model was generated through multiple linear stepwise regression
    procedure using SPSS (Statistical Package for Social Sciences) [28]. The statistical
    analyses of variables were carried out with a probability level of 0.05 to enter
    and 0.1 to remove the variables. A total of five models were generated, out of
    which the fifth model was selected for further analysis, on the basis of coefficients
    of determination (R²). Hence, with the help of this model, the yield forecast
    equation was generated which was then used for validation (2007 and 2008) and
    a pre-harvest forecast of rice yield (five and ten weeks in advance of harvest
    for the years 2009 and 2010). Further, Root Mean Square Error (RMSE) and Mean
    Bias Error (MBE) were calculated [29] as follows:


    ```

    RMSE = [ Σᵢ₌₁ⁿ (Pᵢ − Oᵢ)² / n ]⁻¹/²  (16.1)

    ```'
