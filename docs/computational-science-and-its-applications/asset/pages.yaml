- pgno: 212
  md: 'In rupture, a drug-free DNA duplex and t-DNA are stretched into a zipper-like
    conformation followed by the strand separation. Since MMC-DNA has covalent bonds
    with each strand, the complete separation requires quite high force (>1500 pN)
    compared to t-DNA (≈900 pN). For t-DNA, unzipping takes place at much lower force
    (≈450 pN) compared to rupture. This is in agreement with previous studies, where
    the melting temperature of t-DNA is found to be lower as compared to MMC-DNA [93].
    It is pertinent to mention that melting is defined when half of the base pairs
    open, and the chain can open from both ends, whereas the rupture requires complete
    separation of strands. Moreover, in the unzipping mode, the chain opens from the
    end where a force is applied. The other end remains intact. The presence of ICLs
    at intermediate base positions induces a pause-like event, which is not detected
    in melting. At this point of time our results warrant further experimental investigations
    to enhance our understanding about the molecular forces that govern the binding
    of important anti-tumor compounds to DNA. Information gathered through our simulations
    should be useful in designing better chemotherapeutic drugs in the future.


