    # 6.5 Conclusion


    In this chapter, we have presented a new family of two-step iterative methods
    with memory for solving nonlinear equations. Since our aim is to construct the
    method of higher-order convergence without additional calculation, we have used
    two approximations of selfcorrecting parameters, designed by Newton interpolating
    polynomials in the fourth-order methods to achieve higher-order convergence without
    any additional calculation. The R-order of convergence of the new with-memory
    iterative methods is increased from 4 to 6, and 7. The numerical results have
    been given to confirm the validity of theoretical results.'
