    Steps involved in the generation of word cloud are as follows:


    +   1. Data extraction:

    +      (i) Extract text data

    +      (ii) Prepare string data for tokenizing

    +      (iii) Create an array of tokenized documents

    +   2. Data cleaning:

    +      (i) Remove stop words like "to," "the," "in," "and" etc.

    +      (ii) Remove unnecessary long words or short words according to length of
    the words'
