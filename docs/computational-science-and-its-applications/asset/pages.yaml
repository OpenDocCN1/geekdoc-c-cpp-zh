    # 26.5.2.3 Model Simulated Rainfall


    A comparative study of location specific 24 hours accumulated observed from IMD
    and model-simulated rainfall (cm) is depicted in Figure 26.6(a) and (b) for Day
    1 and Day 2 valid at 03 UTC of August 10 and 11 2016 respectively. It is clearly
    seen that the observed amount of rainfall over the maximum number of stations
    is well simulated in the 3DV experiment as compared to the CNTL for both the days.
    During the Day 1 forecast, the 3DV experiment overestimated the rainfall over
    the station at Salebhatta. Similarly, on Day 2 the CNTL experiment also overpredicted
    the rainfall over the station at Kalna.


    # 26.6 Conclusions


    The high-resolution state-of-the-art mesoscale model WRF and 3DVAR analysis systems
    with single domain (9 km horizontal resolution) are considered to simulate a heavy
    rainfall event (August 9–12 2016) associated with the MD during the summer monsoon
    season along the east coast of India. To this purpose, two numerical experiments,
    i.e CNTL without data assimilation where FNL analyses are provided as IC and BCs
    to the model and 3DV by assimilating observations from GTS through 3DVAR, are
    carried out to evaluate the impact of high-resolution analysis. The broad conclusions
    of this chapter are given below.


    The performance of the 3DVAR analysis system is examined during the initial time
    through various statistical verifications, i.e innovation error of background
    (O–B) and analysis (O–A) for the meteorological variables, i.e u-wind, v-wind,
    temperature, and


