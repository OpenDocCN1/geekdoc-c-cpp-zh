    # 24.6 Conclusion


    An approximate solution to Volterra integral equations of the first kind is obtained
    by combining a local regularization method with Legendre wavelet. The numerical
    solution to some of the Volterra problems is approximated using the proposed method
    and the results obtained are in good agreement with exact solutions. Also, the
    numerical results obtained by the presented method are compared with existing
    methods which shows that our method is better as compared to other methods. Only
    a small number of basis functions are required to achieve satisfactory results.
    Also the concept of regularization is used, which leads to stable results. The
    described method is very simple and reliable. All the calculations are done using
    $M=3$, $k=3$ and very good results are obtained. However, the values of $k$ and
    $M$ can be increased to get more accuracy.


