    # Theorem 7.2 Let $f(t)$ be a $\alpha$- differentiable function and let $g(t)$
    be also $\alpha$- differentiable in the range of $f''(t)$ for $\alpha \in (0,1)$,
    then


    $T_\alpha( f \circ g)(t) = t^{1-\alpha} g''(t) f''(g(t))$.


    # 7.3 Simulation of Conformable Fractional Heat Equation


    The general form for a one-dimensional heat equation is


    $\frac{\partial u}{\partial t} = k \frac{\partial^2 u}{\partial x^2}$.


    A heat equation has many fractional forms ,see for example Hammed and Khalil [28,
    29] and AVCT et al. [9]. In this section we investigate the solution of a time
    fractional heat differential equation:


    $\frac{\partial^{\alpha} u}{\partial t^{\alpha}} = k \frac{\partial^2 u}{\partial
    x^2}, \quad 0 < x < L, \ t > 0. \quad (7.4)$


    with conditions


    $u(0,t)=0, \ t \ge 0 \quad (7.5)$


    $u(L,t)=0, \ t \ge 0 \quad (7.6)$


    $u(x,0)=f(x), \ 0 \le x \le L, \quad (7.7)$


    where the derivative is conformable fractional derivative and $0 < \alpha < 1$.


    The conformable fractional linear differential equations with constant coefficients


    $\frac{\partial^{\alpha} y}{\partial t^{\alpha}} \pm \mu^2 y = 0. \quad (7.8)$


    From Equation (7.3), we can obtain


    $\frac{\partial^{\alpha} y}{\partial t^{\alpha}} = t^{1-\alpha} \frac{dy}{dt}.
    \quad (7.9)$'
