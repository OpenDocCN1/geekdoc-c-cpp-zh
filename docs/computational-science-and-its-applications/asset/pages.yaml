    # De-Noising Raman Spectra Using Total Variation De-Noising with Iterative Clipping
    Algorithm


    Padmesh Tripathi, Nitendra Kumar, and A. H. Siddiqi


    # CONTENTS


    +   14.1 Introduction...............................................................................
    225

    +   14.2 Material and Method.......................................................................
    227

    +   14.2.1 Material ...................................................................................
    227

    +   14.2.2 Total Variation (TV) De-Noising...................................................
    227

    +   14.2.3 Algorithm for TV De-Noising.......................................................
    227

    +   14.2.4 Numerical Implementation and Performance Analysis ...................
    228

    +   14.3 Results and Discussion ..................................................................
    228

    +   14.4 Conclusions...................................................................................
    230

    +   References...........................................................................................
