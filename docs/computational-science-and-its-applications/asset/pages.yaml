  md: "![](img/81c56bc4b2fca1951aff5e0ab85b66be_67_0.png)\n\n# ### 3.2.2 Equations\
    \ of the WPCR System on Each Node\n\nThe WPCR simulates human behavior, in one\
    \ specific place, during a catastrophic event. As explained in the introduction,\
    \ it is based on neuroscience studies. During the event, the switches from one\
    \ behavioral state to another are caused by transitional dynamics, as schematized\
    \ in Figure 3.2 due to:\n\n+   i. **Causal relationships** ($B_1$, $B_2$, $C_1$,\
    \ $C_2$). Once the population is in the reflex behavior state, a part of it can\
    \ evolve toward controlled behaviors at the rate $B_1$, while another part transitions\
    \ towards panic behaviors at the rate $B_2$. Likewise, a part of the panicked\
    \ population may switch to controlled behavior at the rate $C_1$. According to\
    \ the evolution of the situation, individuals who have adopted a controlled behavior\
    \ may switch back to panic behavior at the rate $C_2$. This process can be iterated\
    \ many times.\n+   \n+    ii. **Processes of imitation and contagion**, which\
    \ are well known in crowd psychology and have been termed “emotional contagion”\
    \ (Hatfield et al. 1994). The imitation processes are modelled identically to\
    \ epidemiological propagation (Provitolo 2005). The imitation is valid in both\
    \ directions and is modelled by the function $F(r,c)$ (see Equation (3.5)) for\
    \ emotional contagion between reflex and controlled behavior (using the damping\
    \ coefficients $\\alpha_1$ and $\\alpha_2$), by the function $G(r,p)$ (see Equation\
    \ (3.6)) for emotional contagion between reflex and panic behavior ($\\delta_1$\
    \ and $\\delta_2$), and by the function $H(c,p)$ (see Equation (3.7)) for emotional\
    \ contagion between controlled and panicked behavior ($\\mu_1$ and $\\mu_2$).\n\
    +   \n+    iii. **Domino effects**, which illustrate a succession of events ($s_1$\
    \ and $s_2$) correspond, for example, to a new attack in an urban area or to a\
