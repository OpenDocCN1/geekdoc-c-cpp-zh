  md: 'ill-posed problem because the solution f(x) does not depend continuously on
    the data g(x). Therefore, regularization techniques are necessary to find a stable
    solution to the problem. The regularization method converts an ill-posed problem
    into a well-posed problem and the approximate solution to the original problem
    can be found by solving this well-posed problem. A survey of regularization methods
    for first kind Volterra equations is given by Lamm [4].


    Volterra problems are casual in nature, which means that the solution at any point
    depends only on the past and present data values. Classical regularization methods
    like Tikhonov, bounded variation regularization methods, etc destroy its casual
    behaviour as these methods use adjoint operator which is non-casual in nature.
    So these methods convert a Volterra problem into a non-Volterra problem, i.e.,
    evaluation of a solution at any point also requires the knowledge of future data
    values. In recent years, different local regularization methods have been developed
    which are effective in handling the Volterra problem as they preserve the causal
    structure of the Volterra problem. The classical methods require an initial guess
    of an unknown function to start the algorithm which strongly affects the performance
    of the method. However, no initial guess is required in the case of local regularization
    methods. Also, the computation cost of local regularization is lower than that
    of classical methods. In recent years, several local regularization techniques
    have been used for solving first-kind Volterra integral equations [5, 6, 7, 8].


    Different types of orthogonal functions and wavelets have been used for numerical
    approximation of the ill-posed Volterra problem. Babolian et al. [1] have solved
    Volterra and integro-differential equations of the convolution type using Laplace
    transform and block pulse function. This problem has been investigated by Babolian
    et al. [2] using block pulse function. Maleknejad et al. [9] has used modified
    block pulse function to solve Volterra integral equation of the first kind. The
    Haar wavelet collocation method has been applied for solving first-kind Volterra
    integral equations by Maleknejad et al. [10] and Singh et al. [13]. Legendre wavelets
    have been successfully applied to solve systems of Volterra integro-differential
    equations [12], Volterra–Fredholm integro-differential equations [11], and first-kind
    Fredholm integral equations [3]. In this chapter, we have used Legendre wavelet
    to solve Volterra integral equations of the first kind.


    The aim of this chapter is to present an efficient numerical method to find a
    stable solution of Volterra integral equations of the first kind. For this purpose,
    a combination of local regularization method and Legendre wavelets has been used.
    The method of local regularization helps in finding a stable solution by converting
    the problem into a well-posed problem and then after applying wavelets the equation
    is reduced to a system of algebraic equations which can then be solved to find
    the solution to the problem.


    The outline of this chapter is as follows. In Section 24.2, we give an introduction
    to Legendre wavelets and an approximation of function using Legendre wavelets.
    Section 24.3 introduces a local regularization method and presents the numerical
    method to find an approximate solution to the given problem. The convergence and
    error analysis is considered in Section 24.4. In Section 24.5, some numerical
    examples are presented to verify the accuracy of the numerical method. A conclusion
    is given in the last section.


    # 24.2 Legendre Wavelet


    In this section, we present a brief introduction to Legendre wavelets. Let P_m(x)
    be Legendre polynomials of order m ≥ 0, then the Legendre wavelets ψ_{n,m}(x)
    on interval [0,1) are defined by'
  merge: -1
  img_proc: true
- pgno: 381
  md: '$$\psi_{n,m}(x)=\begin{cases}\sqrt{\left(m+\frac{1}{2}\right)2^{k/2}P_m(2^k
    x-\hat n)}, & \text{for }\frac{\hat n-1}{2^k}\le x<\frac{\hat n+1}{2^k},\\0, &
    \text{otherwise}\end{cases}$$


    where $\hat n=2n-1$, $n=1,2,\ldots,2^{k-1}$; $k\ge 1$. The polynomials $P_0(x)$
    and $P_1(x)$ are given as


    $$P_0(x)=1$$


    $$P_1(x)=x$$


    and all higher degree Legendre polynomials are obtained using recursive formula


    $$P_{m+1}(x)=\left(\frac{2m+1}{m+1}\right)xP_m(x)-\left(\frac{m}{m+1}\right)P_{m-1}(x),\quad\text{for
    }m=1,2,3,\ldots$$


    Legendre wavelets have compact support and form a complete orthonormal basis for
    $L^2[0,1]$ [3, 12].


    # 24.2.1 Approximation of Function


    Any square integrable function $f(x)$ defined over $[0,1]$ can be written as the
    sum of Legendre wavelets as


    $$f(x)=\sum_{n=1}^{\infty}\sum_{m=0}^{\infty}c_{n,m}\psi_{n,m}(x),$$


    where $\psi_{n,m}(x)$ are Legendre wavelets and $c_{n,m}$ are Legendre wavelet
    coefficients given by


    $$c_{n,m}=\langle f(x),\psi_{n,m}(x)\rangle=\int_0^1 f(x)\psi_{n,m}(x)\,dx.$$


    After truncating the series at $m=0,1,2,\ldots,M-1$ and $n=1,2,\ldots,2^{k-1}$,
    Equation (24.4) can be written as the sum of series of $2^{k-1}M$ terms.


    $$f(x)\simeq\sum_{n=1}^{2^{k-1}}\sum_{m=0}^{M-1}c_{n,m}\psi_{n,m}(x),$$


    Writing it in matrix notation,


    $$f(x)=C\psi^T(x),$$


    where $C$ and $\psi(x)$ are $1\times 2^{k-1}M$ matrices and are given by


    $$C=[c_{1,0},c_{1,1},\ldots,c_{1,M-1},c_{2,0},\ldots,c_{2,M-1},\ldots,c_{2^{k-1},0},\ldots,c_{2^{k-1},M-1}],$$


    $$\psi(x)=[\psi_{1,0}(x),\psi_{1,1}(x),\ldots,\psi_{1,M-1}(x),\psi_{2,0}(x),\ldots,\psi_{2,M-1}(x),\ldots,$$
    $$\ldots,\psi_{2^{k-1},0}(x),\ldots,\psi_{2^{k-1},M-1}(x)].$$'
