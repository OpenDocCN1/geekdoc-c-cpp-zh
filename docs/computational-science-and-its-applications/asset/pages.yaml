  img_proc: true
- pgno: 218
  md: 'In the early 1950s, the first automated palmprint recognition system was made
    available [17]. Since then, researchers have made numerous efforts to improve
    the productivity and efficiency of palmprint recognition systems. In the initial
    stage, the ink palm was used for offline recognition [17]. The first online palmprint
    recognition system was proposed by Zhang et al. [18], in which 2D reduced palmprint
    pictures were used, taken by contact mode, to recognize an individual. It was
    found that principal lines and creases could be easily seen in palmprint images
    that were captured at 75dpi. Zhang et al. [18] also proposed the first 3D palmprint
    recognition system that has greater accuracy in recognizing an individual compared
    to a 2D system. In recent years, researchers have focused more on recognizing
    high-resolution palmprints. When a palmprint image is taken at 400–500dpi, features
    like ridges, minutiae, and pores could be extracted from it for matching purposes
    [22, 23]. In comparison to fingerprint, iris, and face biometric traits, palmprint
    has many advantages such as stability, ease of capture, and richness of features.
    Researchers have proposed several effective palmprint recognition methods [24,
    25] that can be divided into various categories, like texture-based [26], line-based
    [27], based on subspace learning [28], based on correlation filters [29], based
    on local descriptors [30], and based on orientation coding [31]. In texture-based
    methods, Gabor wavelet [32], fractal dimension [33], dual-tree complex wavelets
    [34], discrete cosine transform [35], region covariance matrices [36], co-occurrence
    matrices [37], discrete orthonormal S-transform [38], and other statistical methods
    have been used for extracting texture features from palmprints. Line-based methods
    are also very important in recognizing palmprints. A method for extracting the
    principal line based on modified radon transformation (MFRAT) was proposed by
    Jia et al. [39] to recognize the palmprint. Wu et al. [40] used the first- and
    second-order derivatives of Gaussian function for detection of palm lines. Liu
    et al. [41] used isotropic responses via a circular mask for developing a wide
    palm-line detector. The principal component analysis (PCA) and linear discriminant
    analysis (LDA) [42, 43] are two subspace-learning methods that are used for palmprint
    recognition. In these methods 2D image data is converted into a 1D vector, which
    is known as the “image-as-vector.” In the past decade, matrix and tensor embedding
    [44, 45], kernel [46], sparse learning [47], low-rank representation-based methods
    [48], and manifold learning [49], have also been applied for palmprint recognition.
    An optimal trade-off synthetic discriminant function (OTSDF) filter [50] and band-limited
    phase-only correlation filter (BLPOC) [51] are correlation methods that are also
    used for palmprint recognition. The coding methods have been found to be more
    accurate for recognition of an individual in terms of computing performance measures
    and matching speed in comparison to the other methods mentioned. Competitive code
    [52–54], binary orientation co-occurrence vector (BOCV) [55], robust line orientation
    code (RLOC) [56], and ordinal code [57, 58] are representative coding methods.


    The palmprint biometric systems have good prospects for commercial development
    as they have achieved 100% accuracy. Graphical user interface (GUI) plays an important
    role in computing, whether it is web app, m-app, or any electronic or mechanical
    device that is used by a person in his/her daily life. Well-designed GUIs have
    interactive buttons that can be used by any users even when they are not trained
    on the particular interface. It is easier to use buttons with the same functionality
    rather than to write codes or commands. The motivation behind developing this
    GUI is to help students, young researchers, and users to understand processes
    like plotting of histograms, texture features extraction that includes principal
    lines, phase symmetry features that includes energy and convolution, and computation
    of similarity measures for palmprint recognition.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The rest of this chapter is organized as follows: Section 12.2 presents system
    development. The functionalities of the buttons of the interface are discussed
    in Section 12.3. Results are reported in Section 12.4. This chapter ends with
    the overall conclusion and future scope of GUI in Section 12.5. The MATLAB® functions
    have been used to develop this GUI.


    # 12.2 System Development


    A biometric system is a pattern recognition system that is used to match the features
    of sample images with the template images stored in a centralized database. Each
    biometric system comprises the following modules: i) the image acquisition module
    takes the biometric trait image and transmits it to the system for later processing;
    ii) the feature extraction module extracts the essential or discriminatory features
    from the captured image; iii) the matcher module matches the extracted image characteristics
    of the sample image to the database to obtain a match score, whereas iv) the embedded
    decision-making module decides whether the user is genuine or an imposter based
    on the matching score, and v) the database module contains the templates of the
    captured images. Figure 12.1 shows the functioning of a biometric system.


    The process of palmprint recognition of an individual consists of following stages.


    # 12.2.1 Enrolment


    In enrolment stage, the palmprint image of an individual is acquired for feature
    extraction; the extracted features are stored as template in a database. A database
    of palmprint images has been created using the database of the blue band of the
    Hong Kong Polytechnic University Multispectral Palmprint database [59] and the
    IIT-Delhi touchless palmprint database [60]. The Multispectral palmprint images
    are taken from 250 individuals, comprising 195 males and 55 females, in two different
    sessions. The individuals were asked to provide 6 images for each palm in a session,
    thus the database contains 6,000 images of 500 different palms. The IIT-Delhi
    touchless palmprint database was acquired on the IIT-Delhi campus from July 2006
    to June 2007. The database was constructed using 7 images for each palm of 235
    volunteers, thus it contains 3,290 images of 470 different palms.


    A centralized database of texture features, phase symmetry features, and similarity
    measures of 9,290 palmprint images has been created and stored for matching with
    the input image.


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 12.2.2 Verification


    At the verification stage, the system validates the identity of an individual
    by comparing the fingerprint image with its own palm print pattern template(s)
    stored in the centralized database. If a match is found with the template then
    the user is legitimate to access the system, otherwise, the user is fraudulent.


    # 12.2.3 GUI of Palmprint Recognition


    The GUI of palmprint recognition has been developed using MATLAB that allows steer
    focus and is intuitive. It consists of one axis and six panels, as shown in Figure
    12.2. Axis 1 is for the sample input image. The first panel is used for performing
    the basic operations that contain Load Image and Reset buttons. Load Image button
    is to take the image as input for processing and the Reset button is used to restart
    the processing. Panel 2 is the histogram panel of GUI with Histogram button; to
    plot the histogram of an image, and Histogram EQV; to adjust the intensity of
    the palmprint image. The third panel is used for texture feature extraction. Principal
    lines have been extracted as texture features for identifying the authenticity
    of a user. This panel consists of Principal Lines and Match Score_T buttons. Panel
    4 is used for extracting phase symmetry features. Energy and Convolution can be
    computed for matching purpose using this panel. Similarity measure has been computed
    from Panel 5, and Panel 6 is used to display numerical values of various operations.


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_220_0.png)


    FIGURE 12.2

    GUI of palmprint recognition.'
  merge: -1
  img_proc: true
