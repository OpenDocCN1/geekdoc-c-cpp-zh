  md: 'molecular mechanics and dynamics program designed for the refinement of macro-molecular
    conformations using an analytical potential energy function.


    The force field describes the detail inter- and intra-molecular interactions involved
    among the constituent of biomolecules [64]. The parameter of the force field is
    in amber generally calculated from experiments or first-principle quantum mechanical
    calculations. The force field for a system consisting of N particles can be written
    as the sum of the following energy terms:


    ```

    $$V(r) = V_{\text{bond}} + V_{\text{angle}} + V_{\text{torsion}} + V_{\text{vdw}}
    + V_{\text{elec}}, \tag{11.1}$$

    ```


    where V(r) (Figure 11.3) denotes the total energy that is the function of position
    (r) of N particles. V_bond, V_angle and V_torsion are the bond stretching, the
    bending, and the torsional energy terms, respectively. V_vdw (van der Waals energy),
    and V_elec (electrostatic energy) are non-bonded energy terms such as Lennard-Jones
    and Coulomb potential and calculated between all pairs (i and j). The energy terms
    V_bond, V_angle, and V_torsion are the bonded interaction which is the sum over
    the sets of all bonds, angles, and dihedral angles respectively. The most commonly
    used one is modeled by a simple harmonic potential function:


    ```

    $$V_{\text{bond}} = \sum_{\text{bonds}} k_b (b - b_0)^2, \tag{11.2}$$

    ```


    where k_b is the spring (harmonic) force constant, b is the bond length between
    atoms, and b_0 is the equilibrium bond length. Similarly, the bond-angle bending
    between three consecutively bonded atoms (i, j, k) and the formation of an angle
    can also be modeled by a simple harmonic potential function:


    ```

    $$V_{\text{angle}} = \sum_{\text{angles}} k_\theta (\theta - \theta_0)^2, \tag{11.3}$$

    ```


    where k_θ is the angle-bending force constant, θ is the actual bond angle between
    the three consecutively bonded atoms (i, j, k), and θ_0 is the equilibrium bond
    angle (Figure 11.3).


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_198_0.png)


    FIGURE 11.3

    Schematic representations of bond-stretching, angle-bending, torsion, and non-bonded
    interactions terms contributing to Equation (11.1).'
