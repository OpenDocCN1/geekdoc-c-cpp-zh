  md: "the radiologist visually examines MRI pictures and interprets them. If a large\
    \ volume of MRI images are analyzed at the same time, it can lead to a wrong diagnosis\
    \ because the analysis is done by visual detection and the sensitivity of the\
    \ human eye decreases if the same task is performed continuously for a long time.\
    \ So, an economical automated system is needed for analysis and classification\
    \ of medical pictures. Our work considers both normal and abnormal MRI images\
    \ to check the validation of the proposed technique. A brain tumor is a collection,\
    \ or mass, of abnormal cells in the brain. The skull, which encloses the brain,\
    \ is very rigid. Any growth inside the skull, which has restricted space, can\
    \ cause problems. A brain tumor can be cancerous (malignant) or non-cancerous\
    \ (benign) [3]. When a benign or a malignant tumor grows, it can cause the pressure\
    \ inside the skull to increase. This can cause brain damage, and it can be life-threatening\
    \ [4]. A brain tumor can be categorized as primary or secondary. A primary brain\
    \ tumor originates in the brain. Many primary brain tumors are benign. A secondary\
    \ brain tumor, also known as a metastatic brain tumor, occurs when cancer cells\
    \ spread to the brain from another organ, such as the lung or breast. Types of\
    \ brain tumor are shown in Figure 20.1, according to the World Health Organization\
    \ [5].\n\n# 20.2 Literature Review\n\nBhanumurthy and Koteswararao have developed\
    \ a Graphical User Interface (GUI) with an automated artificial intelligence system\
    \ that uses a neuro-fuzzy classifier to detect and segment tumors in MR images\
    \ of the brain. Padmakant, Dhage, and Phegade illustrate the watershed segmentation\
    \ technique to segregate the abnormal tissue from the adjacent normal tissue to\
    \ make an actual identification of allied and non-allied portions that help doctors\
    \ to establish the relevant area precisely. This technique can accurately localize\
    \ activated abnormal tissue such as tumors. Lakshmi et al. introduced an efficient\
    \ denoising technique using curvelet transform and mathematical morphology to\
    \ enhance the quality of the MR image of the brain. After the removal of noise,\
