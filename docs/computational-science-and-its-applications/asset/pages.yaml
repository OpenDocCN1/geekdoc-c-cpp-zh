    # 1.4 Ingredients for Applied Fourier Analysis


    It is the purpose of this section to outline a sequence of courses (resp. a reading
    list concerning existing material or material in preparation) that would cover
    most of the topics within Fourier Analysis that are relevant for applications,
    while still being mathematically well justified. Corresponding material is and
    will become available step by step at the NuHAG web-page (www.nuhag.eu).


    We are convinced that also the applied scientist should get an idea of the concept
    of generalized functions. We do not think that is more abstract than the idea
    of point charges or the concentration of mass in a given point (center of gravity
    of a body), or even the idea of a force acting on a given piece of matter. We
    are comfortable with models of the gravitational laws (attracting objects on earth
    toward the center of the mass of the earth), but sometimes Dirac measures are
    treated as magic objects or inventions of mathematicians (inspired by the “sloppy”
    but ingenious ideas of Paul Dirac!).


    In contrast, aside from technicalities, distributions (in the way described in
    this section) are the natural objects, which can only be described indirectly
    by a large number of measurements, which hopefully satisfy the superposition principle,
    or in other words through linear measurements.


    As mathematicians we are trained to identify the concept of signals with the concept
    of “functions,” which means, according to established mathematical tradition,
    the unique assignment of the function value f(x) to any given point x in the domain
    of f. When we want to describe the Fourier transform we write an integral and
    require integrability of the function and so on. But how realistic (aside from
    its mathematical elegance) is such a modelling.


    Let me give a few examples. In fact, a few similar ideas appear in the literature
    on distribution theory.


    Is the room temperature in a given room a function, well-defined in any (tiny)
    point in a three-dimensional coordinate system, and at any moment in time, at
    a millisecond scale? It should have this property if we think of the solution
    to the heat equation as an infinitely differentiable function, but the identification
    of this “function,” even by very fine thermometers placed at a fine grid in the
    room, would not really allow us to describe (in a deterministic way) this function
    of four variables. Nevertheless it is of course meaningful to study the corresponding
    differential equation.'
