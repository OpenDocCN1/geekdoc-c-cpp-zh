    The agro- meteorological models can be used successfully for predicting, preharvest,
    the yield of any crop, and for policy planning to ensure food security under climate
    change scenarios over the regions of Central Punjab [2]. The influence of rainfall
    on the yield of London wheat was analyzed and a weekly weather data was developed
