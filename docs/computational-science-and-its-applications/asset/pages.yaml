    # 4.4 Free Radicals in Irradiated UHMWPE


    Primarily, three types of radicals are formed when PE is exposed to ionizing radiation
    (in the absence of oxygen). The name and chemical formula of each type are given
    below.


    Alkyl : – CH₂ – • CH – CH₂  (4.1)


    Allyl : – CH₂ – CH=CH – • CH – CH₂ –  or  (4.2)


    – CH₂ – CH – • CH=CH – CH₂ –  (4.3)


    Polyenyl : – CH• – H(CH=CH)ₙ –  (4.4)


    Figure 4.5 displays characteristic ESR spectra for each radical type; the first
    derivative of an absorption at resonance is plotted as a function of the resonance
    magnetic field (in Gauss). As mentioned earlier, the relative intensity (h_pp)
    of each line and the number of lines depend on the coupling (magnetic interaction)
    between the unpaired electrons (at the site of the broken molecular chain) and
    the nearby protons (hydrogen atoms) on the same chain.


    As a function of time, a given radical decays to a non-radical species (neutral,
    non-detectable by ESR) when it combines with another radical and/or captures a
    proton (hydrogen atom). In air (presence of oxygen), a primary radical reacts
    with an oxygen to form a secondary or tertiary radical (oxygen-centered species);
    thus, it initiates an oxidation process [ATD10]. The oxygen-centered radicals
    and the molecular structure of each radical are listed as follows:


    Peroxy : – CHO₂• –  (4.5)


    Alkoxy : – CHO• –  (4.6)


    Vinyl : >CH=•CH₂ –  (4.7)


    An ESR spectrum, therefore, may represent a combination of any number and type
    of radical species depending on factors such as the irradiation environment, radiation
    type and dose, and temperature. For example, when UHMWPE is irradiated with gamma
    rays in a vacuum or an inert environment (N₂ gas, for example), a broad, 7-line
    spectrum, is detected (see Figure 4.6). On the other hand, when irradiated with
    X-rays under similar conditions, a 6-line spectrum is obtained (see Figure 4.7).
    The measurements are made at room temperature, in air, immediately after irradiation
    (X-rays) or after removing the sample from its inert-sealed package (following
    gamma-irradiation). For these tests, care is taken so that minimum or no oxidation
    occurs during measurements (i.e., limited exposure to air). This method is particularly
    important because it allows one to detect and analyze primarily allyl (seven-line
    spectrum) or alkyl (six-line spectrum) radicals before'
