  md: '# 1.9.2 A Reading List on the Subject


    The paper [14] makes use of the term “Postmodern.” Clearly the next step after
    “Modern Analysis” (which was fashionable in the second half of the last century)
    is “Postmodern.”


    What we mean by this is the following: In the period of “Modern Analysis,” after
    the Bourbaki movement, it was clear how (Fourier) Analysis should be taught, based
    on the theory of Lebesgue integration and using perhaps tempered distribution.
    Details had to be filled in, the theory had to be taken from the Euclidean case
    to the setting of LCA groups and so on. There was no question of how and where
    to apply it (at least not for most mathematicians working in the field), but rather
    to clarify the foundations. Lebesgue, Wiener, Weil, and many others had paved
    the way toward a general approach to Fourier analysis in the context of LCA groups
    and now the generation of Reiter ([15, 16]), Loomis ([17]), and Hewitt ([18, 19])
    had to fill in the missing pieces to get to the complete picture, with all the
    necessary (technical) details and results.


    In the postmodern area the questions comes up: What can we do with all the accumulated
    knowledge on the field?, and also: Now that the tools are clear, can we use them
    for real-world applications? Even if the possibility is often claimed and exists
    in a vague sense, one would like to be able to argue how it is done concretely,
    and of course all too often engineers find mathematical courses too abstract,
    even if they provide examples and establish (in a wider sense) connections to
    the applications. There is no doubt that the mathematical theory of PDE has made
    gigantic progress due to the tools that became available through the theory of
    L. Schwartz ([2]) and the efforts following the work of Hörmander ([3]), but there
    Fourier analysis is showing up as a servant, a method to transform problems into
    a more handy form and solve them there. The whole calculus of pseudo-differential
    operators is based on such refined mathematical tools, but obviously these aspects
