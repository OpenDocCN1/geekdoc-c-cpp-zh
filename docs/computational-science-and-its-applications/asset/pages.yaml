    # 5.3.2 DOT Model


    Simpler deterministic models can be derived from RTE by expanding the density
    u and source f in spherical harmonics and retaining a limited number of terms
    [13, 14, 15, 16]. Due to the prevalence of scattering, the flux is essentially
    isotropic a small distance away from the sources; i.e. it depends only linearly
    on s. Thus we may describe the process adequately by the first two moments of
    u. We get diffusion approximation P₀. Frequency-domain diffusion approximation
    can easily be obtained by Fourier transforming the time-domain equation. Furthermore,
    the diffusion approximation to the radiative transfer model can be written in
    the time independent (dc) case as in [16],


    ```

    -∇·D∇u + μ_a u = 0.  (5.23)

    ```


    The associated boundary condition is


    ```

    u + 2D ∂u/∂ν = f, x ∈ ∂Ω.  (5.24)

    ```


    If we let Ω be the domain under consideration with surface ∂Ω, the weak forward
    problem corresponding to equation (23) is to find u ∈ H¹(Ω) such that for all
    v ∈ H¹(Ω), the following variational equation is satisfied,


    ```

    ∫_Ω D∇v·∇u dx + ∫_Ω μ_a u dx + ∫_{∂Ω} 1/2 v u ds = ∫_{∂Ω} v f ds.  (5.25)

    ```'
