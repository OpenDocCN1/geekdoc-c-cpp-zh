    # Definition 22.1. For $h:[0,\infty)\to R$, and $x>0$ Conformable fractional derivative
    of order $\beta$ is given as


    $D^{\beta}h(x)=\lim_{\epsilon\to0}\frac{h(x+\epsilon\,x^{1-\beta})-h(x)}{\epsilon}\quad\forall
    x>0,\beta\in(0,1]$


    # Definition 22.2. For $h:[0,\infty)\to R$, and $x>0$ Fractional derivative of
    order $\beta$ is given as:


    $D^{\beta}h(x)=\lim_{\epsilon\to0}\frac{h(xe^{\epsilon x^{-\beta}})-h(x)}{\epsilon}\quad\forall
    x>0,\beta\in(0,1]$


    The above two definitions of fractional derivative are given by R. Khalil and
    U. N. Katugampola respectively and both possess the following property:


    If $h(x)$ is differentiable then $\beta$ derivative is $D^{\beta}h(x)=\frac{d^{\beta}h(x)}{dx^{\beta}}=x^{1-\beta}\frac{dh(x)}{dx}$.


    # Definition 22.3. (Fractional Integral) Let $0\le a\le x$, and $h$ be a function
    defined on $(a,x]$, then $\beta$–fractional integral, $\beta\in(0,1]$ is defined
    by


    $I_a^{\beta}(x)=\int_a^x\frac{h(t)}{t^{1-\beta}}dt$


    provided integral exists.


    # Definition 22.4. (Fractional power series) A power series is called a fractional
    power series about origin, if it can be written in the form of $\sum_{r=0}^{\infty}c_r
    x^{\beta r}$ for all $\beta\in(0,1]$.


    # 22.2 Conformable Fractional Laguerre Equation and Its Solution


    Consider the following sequential conformable Laguerre equation


    $x^{2\beta}D^{\beta}D^{\beta}y+\beta(1-x^{\beta})+\beta^{2}\lambda y=0$


    where $0<\beta\le1$ and $\lambda$ is a positive integer.


    It is obvious that at $\beta=1$; this equation becomes a classical Laguerre differential
    equation.


    Now we are interested to find a series solution about $\beta$ singular point $x=0$
    so consider the Frobenious method for solving fractional differential equation
    as


    $y=\sum_{r=0}^{\infty}c_r x^{(m+r)\beta}=x^{m\beta}\sum_{r=0}^{\infty}c_r x^{r\beta}$'
