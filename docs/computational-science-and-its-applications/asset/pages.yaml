    # Theorem 21.3 Every non empty compact set in a linear metric space (X, d) is
    proximinal and remotal.


    Proof. Suppose A is a non-empty compact set in X and x ∈ X. For n ∈ ℕ, consider
    the set H_n(x) = { a ∈ A : d(x, a) ≤ d_x + 1/n }. From the definition of d_x,
    H_n(x) ≠ ∅, H_{n+1}(x) ⊆ H_n(x) and H_n(x) ⊆ A is compact. So, there exists an
    a ∈ A such that for all n ∈ ℕ, n ≥ 1, a ∈ H_n(x) i.e. for all n ≥ 1, d(x, a) ≤
    d_x + 1/n. Therefore d(x, a) ≤ d_x and x ∈ H_{d_x}. It follows that A is proximinal.


    For n ∈ ℕ, consider the set K_n(x) = { a ∈ A : d(x, a) ≥ δ_x − 1/n }. From the
    definition of δ_x, K_n(x) ≠ ∅, K_{n+1}(x) ⊆ K_n(x) and K_n(x) ⊆ A is compact.
    So there exist a ∈ A such that for all n ≥ 1, a ∈ K_n(x) i.e. for all n ≥ 1, d(x,
    a) ≥ δ_x − 1/n. Therefore d(x, a) ≥ δ_x and x ∈ K_{δ_x}. It follows that A is
    remotal.


    # Theorem 21.4 Let (X, d) be a linear metric space and A a closed remotal(proximinal)
    subset of X, 0 ∈ A and x ∈ X. If the set K_{δ_x} (H_{d_x}) is compact, then F_A(x)(P_A(x))
    is compact.


    Proof. We know that the set K_{δ_x} ≠ ∅(H_{d_x} ≠ ∅). Suppose that the set K_{δ_x}(H_{d_x})
    is compact. If {g_n} ⊆ F_A(x) ({g_n} ⊆ P_A(x)) then d(x, g_n) = d(x − g_n, 0)
    = δ_x (d(x, g_n) = d(x − g_n, 0) = d_x). Since 0 ∈ A, we have {x − g_n} ⊆ K_{δ_x}
    ({x − g_n} ⊆ H_{d_x}) has a convergent subsequence {x − g_{n_k}}. Therefore there
    exists a z_o ∈ K_{δ_x} (z_o ∈ H_{d_x}) such that x − g_{n_k} → z_o, g_{n_k} →
    x − z_o as k → ∞. Since g_{n_k} ⊆ A and A is closed, we have g_o = x − z_o ∈ A
    and d(x, g_{n_k}) = δ_x (d(x, g_{n_k}) = d_x). It follows that d(x, g_o) = δ_x
    (d(x, g_o) = d_x) and g_o ∈ F_A(x) (g_o ∈ P_A(x)). Therefore the set F_A(x) (P_A(x))
    is compact.


    # Note 21.1 For normed linear spaces these results were proved in Mousavi et al.
    [2017].'
