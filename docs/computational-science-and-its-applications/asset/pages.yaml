    by adding and deleting or redistributing the front points. In front tracking method
    there is no need to solve any additional equation to advect the interface. However,
    one has to solve some algebraic equations to construct a parametrized curve, calculate
    the curvature, and redistribute the front points.


    Since the interface is tracked explicitly, topological changes such as breaking
    and merging of interfaces have to be done manually. Furthermore, the interface
    is not advected by an interpolated velocity and generally this interpreter velocity
    is not divergence-free at the front points. Therefore, guaranteeing the mass conservation
    in each phase is a challenge in the front tracking method.


    # 10.3.2 Lagrangian Approaches


    Even though there are several advantages in computations when using Eulerian approaches,
    the Lagrangian approach is preferred for flows with rigid bodies. Since the interface
    is not deforming, interface resolved mesh in the Lagrangian approach can be used
    to develop efficient and accurate numerical schemes.


    # 10.3.2.1 Arbitrary Lagrangian Eulerian Approach


    An early description of the ALE approach was given in [16]. The ALE approach is
    quite popular for fluid structure interaction and free-surface/two-phase problems.
    For the application to free-surface flows in the finite element context, we refer
    to [17, 18, 19, 20, 21, 22, 23]. Here, we recall the ALE approach which is based
    on the description in [23].


    Let us denote the boundary points of all interfaces by χ_F. In the ALE approach,
    the boundary points χ_F are advected with their corresponding velocity, as


    ```

    dχ_F/dt = u(χ_F, t)

    ```


    and the inner points can be moved arbitrarily to preserve the mesh quality.


    Let us define a family of mappings 𝒳_t, which at each time t ∈ [0,1) map a point
    (namely ALE coordinate) Ŷ ∈ Ω̂ of a reference domain Ω̂ onto a point (namely Eulerian
    coordinate) X of the current domain Ω_t. That is,


    ```

    𝒳_t : Ω̂ → Ω(t),    𝒳_t(Y) = X(Y, t)

    ```'
