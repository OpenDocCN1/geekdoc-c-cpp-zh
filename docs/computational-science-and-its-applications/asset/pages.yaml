- pgno: 15
  md: '# Professor K. R. Sreenivasan


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_15_0.png)


    This book, “Computational Science and Its Applications” is dedicated to Professor
    Katepalli R. Sreenivasan to mark his 70th birthday. He is one of the most well-known
    scientists in his field and has made outstanding interdisciplinary contributions
    in turbulent flow, intermittency, cryogenic helium, and nonlinear dynamics. Professor
    Sreenivasan is Dean of the NYU Tandon School of Engineering and Eugene Kleiner
    Professor for Innovation. He is a professor at the Department of Physics and at
    the Courant Institute for Mathematical Sciences. He was director of the Abdus
    Salam International Center for Theoretical Physics (ICTP) in Trieste, Italy, between
    2003 and 2009.


    In recognition of his scientific contributions, he has received numerous awards,
    including the Guggenheim Fellowship, the Otto Laporte Memorial Award, the Dwight
    Nicholson Medal from the American Physical Society, the UNESCO Medal for the Promotion
    of International Scientific Cooperation and World Peace from the World Heritage
    Center, and the Award for Scientific Cooperation of the American Association for
    the Advancement of Science. He has been elected to many prestigious academies
    including the US National Academy of Sciences, US National Academy of Engineering,
    American Academy of Arts and Sciences, Indian Academy of Sciences, Indian National
    Science Academy, Indian National Academy of Engineering, the Academy of Sciences
    for the Developing World (TWAS), the Accademia dei Lincei in Rome, and the African
    Academy of Sciences.


    G. D. Veerappa Gowda

    TIFR-CAM, Bangalore'
