  md: 'Nonlinear Volterra integral equations can also be handled using the proposed
    method. First, we will convert a nonlinear equation into a linear Volterra integral
    equation by substituting


    Y(f(x)) = v(x).


    Then after finding solution to this linear equation using the method explained
    above, the value of f(x) can be obtained by


    f(x) = Y^{-1}(v(x)).


    To check the accuracy of the proposed method, we use root mean square error (RMS)
    and maximum absolute error (MAE) given by


    RMS = ( 1/N sum_{i=1}^{N} | f(x_i) - f_{ex}(x_i) |^2 )^{1/2}, MAE = max_{1 <=
    i <= N} | f(x_i) - f_{ex}(x_i) |,


    where f(x_i) and f_{ex}(x_i) are numerical and exact solution and N is the number
    of points.


    Now the question is what value of r should be choosen to find accurate results.
    We start with r=0.1 and decrease the value of α until the numerical solution converges
    to the exact solution of integral equation. We have choosen that value of r for
    which the root mean square (RMS) attained is minimum. For practical problems,
    we do not know the exact solution and so finding the optimal value of α is difficult.
    In that case, the value of the regularization parameter is chosen depending upon
    the a priori information about the solution.


    # 24.4 Error Analysis


    We present the following convergence theorem for Legendre wavelet basis.


    Theorem 24.1 [11] Let f(x) be a function defined on [0,1) with bounded second
    derivative, say | f''''(x) | ≤ M, and sum_{n=1}^{∞} sum_{m=0}^{∞} c_{n,m} ψ_{n,m}(x)
    be its infinite Legendre wavelets expansion, then |c_{n,m}| ≤ sqrt(12M) / [ (2n)^{5/2}
    (2M - 3)^2 ].


    This means the Legendre wavelets series converges uniformly to f(x) and f(x) =
    sum_{n=1}^{∞} sum_{m=0}^{∞} c_{n,m} ψ_{n,m}(x).


    Theorem 24.2 [11] Suppose f(x) be a continuous function defined on [0,1), with
    a second derivative f''''(x) bounded by M, then we have the following accuracy
    estimation'
