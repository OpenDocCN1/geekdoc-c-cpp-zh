    # 1.9 A Guide to the Literature


    # 1.9.1 Renewal of our Approach to Fourier Analysis


    The idea of taking a fresh look at Fourier Analysis has been promoted by the author
    in several publications in recent years. Partially the writing is and was educational
    or quite informal (like the current chapter), partially more in the usual style
    of presentation, providing mathematical results (or at least describing such results)
    rather than providing perspectives and making suggestions.


    One has to be aware that such a renewal process, as we have it in mind, will take
    quite a long time, especially due to the fact that Fourier Analysis is a well-established
    field both within mathematics and in the engineering literature, and generations
    of scientists and practitioners have been educated in the traditional way.


    It needs strong arguments, but also willingness to listen to the needs of those
    in the applied science (and perhaps sometimes a bit of phantasy and willingness
    to explore possibly new questions on the basis of your own intuition) in order
    to move things in that direction and provide (as we expect) more and more insight
    that the proposed approach is not only a hobby of this author, but—up to details—the
    best way to reunify the different directions of Fourier Analysis or its applications
    in the various sciences using it.'
