    space $\mathcal{S}(\mathbb{R}^d)$, with a countable family of seminorms (hoping
    to get at least a complete metric space, i.e. a Frechet topology, by this approach),
    even if that metric is only used in order to provide analytic claims and not in
    order to do concrete estimates of operators. In short, we cannot describe the
    properties of $\mathcal{S}(\mathbb{R}^d)$ or satisfy the needs of PDE people using
    the single Banach Gelfand triple $(S_0,L^2,S_0'')(\mathbb{R}^d)$.


    # 1.11 Arguments for a Limited Distribution Theory


    In discussions with colleagues sometimes the following question arises: “What
    is a distribution theory good for if it does not allow being able to deal with
    differential operators?” This question is, of course, well justified, because
    most of the time the idea of distributions is connected with the space of test
    functions $\mathcal{D}(\mathbb{R}^d)$ of infinitely differentiable, compactly
    supported functions. This space is obviously closed under differentiation, and
    differentiation is even a continuous linear procedure on such a space. The same
    is true for the Schwartz space $\mathcal{S}(\mathbb{R}^d)$.


    Via transposition, differentiation can be applied to the dual space $\mathcal{D}''(\mathbb{R}^d)$
    resp. $\mathcal{S}''(\mathbb{R}^d)$, turning such a dual space into a collection
    of objects which allow differentiation without leaving the vector space. In fact,
    in some sense the new (extended) operation is in some sense the only reasonable
    way of extending differentiation as it is known from smooth functions to more
    general objects. Since this is a feature of most variants of the usual distribution
    spaces (classical distributions, or tempered distributions, etc.) which are important
    for the distributional treatment of PDEs, it is plausible that most mathematicians
    familiar with distribution theory think of this as a key property of distribution
    theory.


    In contrast, we take the liberty of calling a vector space a space of “distributions”
    if it is just a natural extension of a space of test functions, i.e. if the space
    of test functions is rich enough and can be naturally embedded into its dual space
    with the help of the (Riemann) integral:


    $k \mapsto \sigma_k:\quad \sigma_k(f)=\int_{\mathbb{R}^d}f(x)k(x)\,dx.$


