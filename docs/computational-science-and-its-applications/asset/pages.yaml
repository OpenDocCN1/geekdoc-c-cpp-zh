    # 17.1 Introduction: Cognitive Computing-Based Intelligent Systems


    The basis for an artificial agent to have human-like decision-making characteristics
    is due to an essential element that is known as agent architecture, the blueprint
    for constructing an agent having reasoning skills. Wooldridge, in 1995, discussed
    agent architecture as a software design that is anticipated to provide human-like
    rational decision-making processes (Wooldridge and Jennings, 1995). Maes defined
    agent architecture as a design that incorporates methods and procedures to include
    discrete components inside a holistic system and help these elements work together
    (Maes, 1991). Agent architecture is the constructing wedge for making an agent,
    much like building an object inside a software class. The agent architecture acts
    as the manager of an artificial agency as it controls the flow and representation
    of knowledge/information by the agent. It also decides the'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'appropriate action of the agent based on its unique fundamental inference/reasoning
    tool. Therefore, researchers have developed several agent architectures based
    on the knowledge representation approaches and its reasoning mechanism for solving
    real-world problems. The research science world classifies artificial agent architectures
    into two broad sets: the intelligence-based single/multi-agent design, and the
    cognitive architecture. Agent architecture comprises reflex, model-based, goal-based,
    utility-based, and learning agent architectures based on their actions, while
    the conventional architectural designs for building explicit multi-agents include
    Reactive, Deliberative, BDI, and Hybrid layered architectural designs based on
    the concept of human information handling skills. Cognitive architecture is classified
    as symbolic, emergent, and hybrid cognitive, based on the ideas of the cognitive
    sciences.


    # 17.1.1 Motivation


    The progress of the Internet and computer technologies has increased the need
    for artificial agent-based distributed, dynamic, coordinated, and heterogeneous
    intelligent systems. Intelligent Agent skill is a novel model appropriate for
    evolving such structures that positions and functions dynamically under the uncertain
    and mixed real-world scenario. So, the aim of this chapter is to ascertain precisely
    what intelligent agents are. How do artificial intelligence scientists create
    intelligent agents? What is the progress in the area of creating artificial systems
    to help humanity? How does the unified architecture approach works and what are
    its advantages and disadvantages? Currently, there is no extensively accepted
    definition of what an intelligent agent is and how its research is progressing
    with time. In this chapter, the focus is to answer the above-mentioned question
    and show what points the researcher must keep in mind while developing these systems.


    # 17.1.2 Literature Review


    Architecture-based intelligent-agent system research is currently a universal
    methodology in the area of general artificial intelligence. Between 1990 and 2016,
    the creation of various intelligent and cognitive architectures took place due
    to the work of several researchers in creating artificial systems. Although architectural
    models for an artificial agent have been an important research characteristic,
    there is a lack of suitable state-of-the-art reviews on the subject. This review
    details the critical facts of previous surveys on cognitive and intelligent architecture.


    Wray et al. did a pioneering survey on a mixture of intelligent and cognitive
    agent architectures. It explains 12 architectures like the Subsumption, Homer,
    Theo, Teton, X Meta-reasoning architecture, RALPH-MEA Prodigy, Atlantis, Entropy
    Reduction Engine, SOAR, and ICARUS. The review focuses on the comparison of intelligent
    agents based on architectural properties, skills of agents, environmental situation
    and conditions, psychological validity, efficiency, and generality. The main drawback
    of this website-based survey is that the comparisons are made only on the criteria
    and the citations given by the authors on their website, which focus only on the
    years up to 1991 (Wray et al., 1994).


    Stollberg and Rhomberg illuminated the thorough survey on intelligent agent architecture
    like BDI, UPML SOAR, AI, based on constrained types of goals, goal specification
    language, goal description model, and goal resolution technique. The authors only
    focused on the feature of the goal, while not considering other intelligent agent
    criteria (Stollberg and Rhomberg, 2006).'
  merge: -1
  img_proc: true
