    Combining Equations (6.10)–(6.16), (6.11)–(6.14), and (6.12)–(6.15), we conclude


    e_{k,w} ∼ e_{k-1}^{(1+p+q)+r}, (6.17)


    e_{k,y} ∼ e_{k-1}^{2(1+p+q)+2r}, (6.18)


    and


    e_{k+1} ∼ e_{k-1}^{3(1+p+q)+4r}. (6.19)


    Equating the powers of error exponents of e_{k-1} in pairs of relations in Equations
    (6.14)–(6.17), (6.15)–(6.18), and (6.16)–(6.19), we have


    rp - r - (p + q + 1) = 0, rq - 2r - 2(p + q + 1) = 0, r^2 - 4r - 3(p + q + 1)
    = 0. (6.20)


    This system has the solution p=2, q=4, and r=7 which specifies the R-order of
    convergence of the derivative-free scheme with memory in Equation (6.8).


    Remark 6.1 The new two-step derivative-free methods in Equation (6.8) require
    three function evaluations and have the order of convergence 7. Therefore, the
    proposed methods are of optimal order and support the Kung–Traub conjecture [16].
    Hence, the efficiency index of the proposed methods is 7^{1/3} = 1.91293.


