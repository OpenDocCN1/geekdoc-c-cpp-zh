  md: '# 19


    # The Advection-Dispersion Equation

    for Various Seepage Velocity Patterns

    in a Heterogeneous Medium


    Amit Kumar Pandey and Mritunjay Kumar Singh


    # CONTENTS


    +   19.1 Introduction...............................................................................
    291

    +   19.2 The Advection-Dispersion Equation with Linear-Isotherm.......................................
    293

    +   19.2.1 Numerical Values, Results, and Discussion....................................................
    299

    +   19.2.2 Sinusoidal Velocity Pattern.....................................................................
    299

    +   19.3 The Concentration Distribution for the Sinusoidal Velocity Pattern ......................
    299

    +   19.4 The Concentration Distribution for Exponentially Decreasing Velocity
    Pattern....... 304

    +   19.5 The Concentration Distribution for Exponentially Increasing Velocity
    Pattern....... 305

    +   19.6 Conclusions...................................................................................
    307

    +   References...........................................................................................
    307


    # 19.1 Introduction


    As far as the domain of the information regarding solute transport in the soil
    medium is concerned, a vast form of the literature has been observed over the
    last four to five decades. The downstream movements of heavy metals, pesticides,
    agricultural waste, waste materials as a result of continuous industrial growth,
    and the reduced tolerance of the earth due to construction that requires hollowing
    out the earth’s surface, are some of the major factors that affect the groundwater
    environment. Solute transport relies not only on complex geo-hydrological structures
    of soil aquifers, but also on the anomalous behavior of the solute particles due
    to which the process of solute spreading takes place. Enormous efforts have been
    made to develop the deterministic/stochastic mathematical model to observe the
    temporal-spatial distribution of contaminants in natural geological formations.
    The heterogeneous nature of the transport medium causes spreading of a solute
    in terms of the spatially or temporally dependent dispersion and seepage velocity.
    Variations in seepage velocity are due to varying hydraulic conductivity. A relatively
    lower positional change in porosity is observed than in hydraulic conductivity;
    in the solute transport process therefore, uniform porosity is frequently considered
    for the sake of numerical calculations.


    As the initial framework on transport models, the advection–dispersion/diffusion
    equation based on the fundamental concept of mass conservation has been proven
    to be of great importance to provide deterministic/stochastic outcomes of the
    solute transport models under different initial and boundary conditions. A sequence
    of continuous attempts'
