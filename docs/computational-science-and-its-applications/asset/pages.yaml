    # 19.2.1 Numerical Values, Results, and Discussion


    Due to the irregular soil structure, an aquifer medium shows spatial-temporal
    variation of the flow parameters. A 1D- ADE has been considered with varying dispersion
    and seepage velocity. The ADE is solved by the Laplace transform technique. The
    in-homogeneity parameter (b*) is taken into account corresponding to the spatial
    heterogeneity of the aquifer system. The obtained analytical solution has been
    discussed for c_i = 0.01; c_0 = 1.0; D_0 = 0.1(km² / year); u_0 = 0.7(km / year)
    δ = 0.02; γ = 0.0005(1 / km), K_d = 2.5; n = 0.32; n = 0.37; n = 0.55 p = 0.01(year)⁻¹
    (Singh and Das, 2015) for various seepage velocity patterns.


    # 19.2.2 Sinusoidal Velocity Pattern


    In the tidal region of flow, a sinusoidal form of the non-dimensional seepage
    velocity can be of great importance; therefore the velocity pattern is assumed
    to be as follows:


    ```

    $$f = A \sin(pt) + L\tag{19.40}$$

    ```


    Where, p [s⁻¹] is the flow resistance coefficient.


    # 19.3 The Concentration Distribution for the Sinusoidal Velocity Pattern


    Figures 19.1 to 19.3 represents the solute concentration in the gravel medium,
    the sand medium, and the clay medium, for the period of five, six, and seven years,
    respectively. It is observed that the concentration magnitude at each point of
    the gravel formation is lower than that in the sand medium and clayey medium.
    Due to the low porosity but active permeability of the gravel medium and sand
    medium, solute transport is less resistive in the mediums; on the other hand,
    the clayey formation with diminished permeability allows solute to move in a resistive
    way and therefore an accumulation of the contaminant particles is noticed there.
    Since solute moves in the micro pore through the process of mixing and in macrospores,
    it moves via advection, hence the dispersion pathway is longer than the advection
    pathway; as a result, a long-tailed concentration curve is remarked. It is also
    noticed that in the gravel, sand, and clay formation at each point the concentration
    increases with increasing temporal variables. The concentration decreases more
    rapidly in the gravel medium than in the sand medium (Figures 19.1 and 19.2) or
    in the clay medium (Figure 19.3). Therefore the solute is more sensitive to the
    clay formation. Further, the concentration curve in the gravel, sand, clay concentration
    curve shows positive skewed nature.


    Figure 19.4 depicts the concentration distribution for different values of the
    Peclet number. A Peclet number can relate the effectiveness of mass transport
    by advection to the effectiveness of mass transport by either dispersion or diffusion.'
