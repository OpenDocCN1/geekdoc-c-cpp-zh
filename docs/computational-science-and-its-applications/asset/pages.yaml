  md: '# 21


    # Proximality and Remotality in Abstract Spaces


    Sangeeta and T. D. Narang


    # CONTENTS


    +   21.1 Introduction...................................................................................................................
    325

    +   21.2 Notations and Definitions...................................................................................................................
    326

    +   21.3 Proximality and Remotality in Linear Metric Spaces...............................................................................
    329

    +   21.4 Unique Remotality in Convex Spaces...................................................................................................
    331

    +   References...........................................................................................................................
    334


    # 21.1 Introduction


    Approximation theory consists of the theory of nearest points (best approximation)
    and the theory of farthest points (worst approximation). The theory started with
    the concept of best approximation, which is concerned with the problem of describing
    the elements of a space X that may be approximated by the elements of a subset
    M of X. Given a non-empty subset M of a metric space (X, d) and x ∈ X, an element
    y ∈ M satisfying d(x, y) = d(x, M) ≡ inf{d(x, m) : m ∈ M} is called a nearest
    point or a best approximation to x in M. The set of all such nearest points in
    M is denoted by P_M(x). The set M is called proximinal (Chebyshev) if P_M(x) ≠
    ∅ (a singleton) for each x ∈ X. It is well known that a closed convex subset of
    a Hilbert space is Chebyshev (see e.g. [Deutsch 2001], p. 302). Whether every
    Chebyshev subset of a Hilbert space is convex is still an open problem in Approximation
    Theory. Various partial answers to this problem are known in the literature (see
    e.g. [Deutsch 2001], [Narang 1977], and [Singer 1970]). As in the theory of nearest
    points, a basic problem in the theory of farthest points is:


    Given a bounded subset K of a metric space (X, d) and p ∈ X, determine a point
    in K farthest from p i.e. to find k_o ∈ K such that d(p, k_o) = sup {d(p, k) :
    k ∈ K}. Such a farthest point may or may not exist. If such an k_o exists for
    each p ∈ X, then K is said to be remotal and if it is also unique for each p ∈
    X then K is said to be uniquely remotal.


    One of the most interesting and hitherto unsolved problems in the theory of farthest
    points, known as the “farthest point problem” (f. p. p.), is: If every point of
    a normed linear space X admits a unique farthest point in a given bounded subset
    K, then must K be a singleton? There are some partial affirmative answers to this
    problem and there are many special cases in which the answer is negative (see
    e.g. [Baronti and Papini 2001], [Klee 1961], [Narang 1990], [Narang 1991] and
    references cited therein). The problem is not solved in general even in Hilbert
    spaces. Most natural examples of uniquely remotal sets in normed linear spaces
    are the singletons.'
