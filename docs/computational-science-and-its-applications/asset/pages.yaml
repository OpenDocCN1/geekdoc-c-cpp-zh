  md: 'intractable. Therefore, one requires numerical solutions. The finite element
    method (FEM) is somewhat more versatile because of its ease in complex geometries
    and modelling boundary effects. The FEM is a variational method used to approximate
    the solution by a family of finite dimensional basis functions. Then the forward
    problem is reduced to one of linear algebra and one computes the approximate solution
    using FEM codes. The FEM is derived by projecting the weak form of Equation (5.25)
    onto a finite dimensional function space. For example, the finite dimensional
    function space could be the set of continuous and twice differentiable, piecewise
    cubic polynomials.


    More precisely, for example in EIT, we can project the infinite dimensional solution
    space X into a finite dimensional subspace X_K ⊂ X which means to restrict u and
    v above to lie in X_K rather than X. Let us assume that there exists a family
    of basis functions φ_m(x) for m = 1,⋯,K for X_K. Then let u_K = Σ_{m=1}^K c_m
    φ_m(x) to be the approximation to u and we want the weak formulation to be satisfied
    for the K test functions φ_k = v for k = 1,⋯,K. Now plugging this into the weak
    formulation we obtain the system of equations for c_m:


    ```

    ∑_{m=1}^K (∫_Ω q ∇φ_m · ∇φ_k dx) c_m = ∫_{∂Ω} f Γ_D φ_k ds   (5.28)

    ```


    for k = 1,⋯,K. If we denote


    ```

    A_{mk} = ∫_Ω q ∇φ_m · ∇φ_k dx


    F_k = ∫_{∂Ω} f Γ_D φ_k ds

    ```


    then we can solve for the solution c = (c_m)_{m=1}^K, which depends nonlinearly
    on q using the linear system Ac = F where A is a K × K matrix and F is a vector
    of length K. We can also approximate the infinite dimensional parameter space
    Q by a finite dimensional subspace Q_M ⊂ Q. The solution to the finite dimensional
    problem is the solution q_M in Q_M that is closest to the infinite dimensional
    optimization problem, for example J_α(q). Therefore we assume that there exists
    a family of basis functions ψ_k(x) for k = 1,⋯,M for Q_M. Then set q_M = Σ_{k=1}^M
    q_k ψ_k(x) to be the approximation to q and we arrive at the finite dimensional
    nonlinear optimization problem for q_M = (q_k)_{k=1}^M:


    ```

    Ĵ_{α1,α2}(q_M) = Σ_{k=1}^Ķ |ĝ_k(j) - ĝ_k^δ|^2 + α1 Σ_{i=1}^M δ_i |q_i - q_i^*|^p
    + α2 Σ_{j=1}^Z d_j |Δ_j q_M| .   (5.29)

    ```


    where 1 ≤ p ≤ 2 and δ_i''s are weights, ĝ_k(f) = Γ_D u_K^q_M(f)[x̂_k] is the trace
    of the solution evaluated at Ķ boundary points x̂_k, ĝ_k^δ is the noisy voltage
    data collected at the boundary point x̂_k, the second term is the approximation
    to the TV term using a nearest neighbor approximation where Z is the number of
    nearest neighbors, and d_j is the distance between two neighbors [18, 17, 19].


