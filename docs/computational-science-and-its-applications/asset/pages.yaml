- pgno: 76
  md: 'The values of this fixed point mean that:


    # Situation 1: if the number of people initially staying in the three nodes is
    less than the capacity of node 3 (i.e. $V_{1,0} + V_{2,0} + V_{3,0} \le W_3$),
    after a while, both nodes 1 and 2 become empty and all the crowd has sought refuge
    in node 3.


    Alternatively, if this number is greater than the capacity (i.e. $V_{1,0} + V_{2,0}
    + V_{3,0} > W_3$), then two situations can occur:


    # Situation 2: node 3 becomes full and the remaining people are still stranded
    in node 2 if $V_{1,0} + V_{2,0} + V_{3,0} \le W_2 + W_3$


    or, Situation 3: stranded in both nodes 1 and 2 if $V_{1,0} + V_{2,0} + V_{3,0}
    > W_2 + W_3$.


    From Equations (3.21), (3.22), and (3.23) it is obvious that only the ratio $\frac{C_1}{C_2}$
    is significant for the limit of solutions of Equation (3.17) because $\frac{c_1^*}{p_1^*}
    = \frac{c_2^*}{p_2^*} = \frac{c_3^*}{p_3^*} = \frac{C_1}{C_2}$ (when defined),
    instead of parameters $B_1$ and $B_2$, becomes important for the pace at which
    the “reservoir” of people in reflex behavior is emptied.


    Of course, across the world there are different cultures, which lead to different
    behaviors. These behaviors can be modelled by varying parameters.


    For example, if populations are not made aware of major risks and not prepared
    for them, it causes a panic reaction ($B_1 < B_2$); this behavior is then regulated
    by the ratio $\frac{C_1}{C_2}$.


    The higher this ratio, the more the population remains in or transits to the controlled
    state.


    In simulated situation, we choose a set of parameters that highlight a weak risk
    culture, while favoring the return to a controlled behavior: the values, $B_1=0.15$,
    $B_2=0.45$, mean that there is a weak risk culture and, $C_1=0.21$, $C_2=0.07$,
    mean that the panic in the crowd context is compensated by controlled reactions
    for a part of the population who keep self-control, notably because there is no
    new threat or sudden attack.


    Therefore, in Situation 1 when $V_{1,0}=18\,000$, $V_{2,0}=0$, $V_{3,0}=0$, $W_2=1000$,
    $W_3=18\,500$ and $\eta_{c,1,2}=\eta_{c,2,3}=\eta_{p,1,2}=\eta_{p,2,3}=0.004$,
    one obtains the following convergence towards the fixed point:


    $r_1^*=0,\,c_1^*=0,\,p_1^*=0,\,r_2^*=0,\,c_2^*=0,\,p_2^*=0,$


    $r_3^*=0,\,c_3^*=\frac{C_1(V_{1,0}+V_{2,0}+V_{3,0})}{C_1+C_2}$


    $=\frac{0.21(18\,000)}{0.21+0.07}=13\,500,\,p_3^*=\frac{C_2(V_{1,0}+V_{2,0}+V_{3,0})}{C_1+C_2}=4\,500.$


    This value means that, initially, all the people are in node 1 and both nodes
    2 and 3 are empty, but after a certain period of time, both nodes 1 and 2 are
    empty and everyone has reached node 3. One can see the flow of people through
    the two edges $(N_1 \to N_2); (N_2 \to N_3)$, in Figure 3.9.'
