- pgno: 129
  md: 'by substituting Equation (7.9) in Equation (7.8), we get


    ```

    $$t^{1-\alpha} \frac{dy}{dt} \pm \mu^2 y = 0.$$

    ```


    We obtain the solution of Equation (7.10)


    ```

    $$y = c e^{\frac{\pm \mu^2}{\alpha} t^{\alpha}}.$$

    ```


    Now we can use separation of variables methods for our time fractional heat equation.
    Let u = p(x)q(t). Substituting the time fractional heat equation, we have


    ```

    $$\frac{d^{\alpha} q(t)}{dt^{\alpha}} p(x) = k \frac{d^2 p(x)}{dx^2} q(t)$$

    ```


    we obtain


    ```

    $$\frac{d^{\alpha} q(t)}{dt^{\alpha}} / k q(t) = \frac{d^2 p(x)}{dx^2} / p(x)
    = \omega$$

    ```


    As a result:


    ```

    $$\frac{d^{\alpha} q(t)}{dt^{\alpha}} - \omega k q(t) = 0$$

    ```


    and


    ```

    $$\frac{d^2 p(x)}{dx^2} - \omega p(x) = 0.$$

    ```


    There are three cases for values of ω to be evaluated. ω = 0, −μ² and μ² with
    boundary conditions, we get


    ```

    $$\mu = \frac{n\pi}{L} \quad \text{and} \quad p_n(x) = a_n \sin \frac{n\pi x}{L}.$$

    ```


    Equations (7.8) and (7.11) give,


    ```

    $$q_n(t) = b_n e^{-\left(\frac{n\pi}{L}\right)^2 \frac{k}{\alpha} t^{\alpha}}$$

    ```


    From Equations (7.12) and (7.13), the solution of the Cauchy problem which satisfies
    two boundary conditions is obtained as


    ```

    $$u(x,t) = \sum_{n=1}^{\infty} c_n \sin \frac{n\pi x}{L} e^{-\left(\frac{n\pi}{L}\right)^2
    \frac{k}{\alpha} t^{\alpha}}.$$

    ```


    With the help of the initial condition, we get


    ```

    $$c_n = \frac{2}{L} \int_{0}^{L} f(x) \sin\left(\frac{n\pi x}{L}\right) dx.$$

    ```'
