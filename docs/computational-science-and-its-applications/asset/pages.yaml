  md: 'Thus, the bottleneck coupling corresponding to the one of Figure 3.5, is given
    by the system


    ```

    ṙ₁(t) = −(B₁ + B₂)r₁(t) − ηᵣ,1,2 r₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))

    ċ₁(t) = B₁r₁(t) + C₁p₁(t) − C₂c₁(t) − ηc,1,2 c₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))

    ṗ₁(t) = B₂r₁(t) − C₁p₁(t) + C₂c₁(t) − ηp,1,2 p₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))

    ṙ₂(t) = −(B₁ + B₂)r₂(t) + ηᵣ,1,2 r₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t)) − ηᵣ,2,3 r₂(t)(W₃
    − c₃(t) − p₃(t) − r₃(t))

    ċ₂(t) = B₁r₂(t) + C₁p₂(t) − C₂c₂(t) + ηc,1,2 c₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))
    − ηc,2,3 c₂(t)(W₃ − c₃(t) − p₃(t) − r₃(t))

    ṗ₂(t) = B₂r₂(t) − C₁p₂(t) + C₂c₂(t) + ηp,1,2 p₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))
    − ηp,2,3 p₂(W₃ − c₃(t) − p₃(t) − r₃(t))

    ṙ₃(t) = −(B₁ + B₂)r₃(t) + ηᵣ,2,3 r₂(t)(W₃ − c₃(t) − p₃(t) − r₃(t))

    ċ₃(t) = B₁r₃(t) + C₁p₃(t) − C₂c₃(t) + ηc,2,3 c₂(t)(W₃ − c₃(t) − p₃(t) − r₃(t))

    ṗ₃(t) = B₂r₃(t) − C₁p₃(t) + C₂c₃(t) + ηp,2,3 p₂(t)(W₃ − c₃(t) − p₃(t) − r₃(t))
    (3.17)

    ```


    with initial conditions satisfying


    ```

    r₁,₀ + c₁,₀ + p₁,₀ = V₁,₀ ≤ W₁; r₂,₀ + c₂,₀ + p₂,₀ = V₂,₀ ≤ W₂; r₃,₀ + c₃,₀ +
    p₃,₀ = V₃,₀ ≤ W₃ (3.18)

    ```


    In this system the bottleneck coupling, concerning, for example, the controlled
    population that is moving from node 1 to node 2 is given by the term:


    ```

    ηc,1,2 c₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t)) (3.19)

    ```


    in the second equation of (3.17)


    ```

    ċ₁(t) = B₁r₁(t) + C₁p₁(t) − C₂c₁(t) − ηc,1,2 c₁(t)(W₂ − c₂(t) − p₂(t) − r₂(t))

    ```


    In this bottleneck coupling, Equation (3.19), ηc,1,2 is the parameter that models
    the topological characteristic of the street linking node 1 to node 2. The second
    factor c₁(t) of Equation (3.19) reflects the pressure of controlled people in
    node 1 willing to escape towards node 2 and also the proportionality of people
    escaping with respect to people staying in node 1. Finally, the factor (W₂ − c₂(t)
    − p₂(t) − r₂(t)) shows the counterpressure which is maximum (i.e. the term vanishes)
    when W₂ = c₂(t) + p₂(t) + r₂(t) because, in this case, there is no more room for
    people coming from node 1. This bottleneck coupling is nonlinear, as shown on
    Figure 3.7.


    As we consider only transitional dynamics where qk(t) = bk(t) = 0, Equation (3.19)
    can be written


    ```

    ηc,1,2 c₁(t)(W₂ − V₂(t)) (3.20)

    ```


    # 3.3.2 Fixed Points of the Three-Node System


