- pgno: 225
  md: 'where F(a, b) is a complex function which is represented as magnitude and phase
    of an image and f(x, y) is the image in reality. The magnitude |F(a,b) given in
    Equation (12.3) depicts quantity of frequency components present in the image,
    and phase φ(F(a,b)) in Equation (12.4) provides information of distribution of
    frequency components in the image:


    ```

    |F(a,b)| = sqrt({Re(F(a,b))}^2 + {Im(F(a,b))}^2)  (12.3)

    ```


    ```

    φ(F(a,b)) = tan^{-1} { Im(F(a,b)) / Re(F(a,b)) }  (12.4)

    ```


    Figure 12.7 shows the frequency components of a palmprint image. Symmetry is a
    useful feature to identify objects in an image. These objects exist at regular
    intervals in a structure of an image that is clearly visible in a Fourier series.
    The maximum and minimum points in sine waves (phase 0 or π) are symmetric points
    to detect symmetry phase information [64, 65]. The bandpass log-Gabor filter is
    used to filter the frequency domain image to evaluate phase symmetry. Field [66]
    suggested that instead of using a linear scale, log-Gabor filter uses a logarithmic
    frequency scale. A log-Gabor filter is of the form given in Equation (12.5) where
    ω₀ is the filter''s center frequency.


    ```

    G(ω) = e^{ [ -log(ω/ω₀)² ] / [ 2 log(ω/ω₀)² ] }  (12.5)

    ```


    To obtain the band-passed image in the frequency domain, a band-passed log-Gabor
    filter is applied on frequency domain images and is shown in Equation (12.6)


    ```

    IMF = F × G(ω)  (12.6)

    ```


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_225_0.png)


    FIGURE 12.7

    Frequency components of image.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The real part of the band-passed image in the spatial domain that is obtained
    after converting the filtered image back to the spatial domain is represented
    by f and is given in Equation (12.7)


    f = Re{Γ⁻¹(IMF)}  (12.7)


    In order to obtain the window-filtered image h shown in Equation (12.8), the log-Gabor-based
    adaptive window image is used where a monogenic H filter is obtained from the
    horizontal and vertical dimensions of the image convoluted with the band-passed
    image.


    h = Γ⁻¹(IMF × H)}  (12.8)


    To obtain the amplitude of the filtered image Equation (12.9) is used.


    A = {Re(h)}² + {Im(h)}²  (12.9)


    To calculate the filtered image energy, the cumulative sum of the band-passed
    image and filter outputs is used and shown in Equation (12.10) on a number n of
    band-passed versions.


    E = Σₙ √(f² + A)  (12.10)


    The symmetry energy of an image is given by Equation (12.11).


    S = Σₙ (f - √A)  (12.11)


    The normalized phase symmetry of an image is computed using Equation (12.12).


    P = S / E  (12.12)


    Figure 12.8 shows the phase symmetry components of a palmprint image.

    Experiments are conducted using a centralized database of 9,290 palmprint images
    of 485 individuals. The correlation is computed for the precision calculations
    using the phase energy, the training symmetry energy (the centralized database)
    and the test data sets (palmprint input images). The accuracy of palmprint recognition
    of an individual is found to be 100%.


    # 12.4.3 Similarity Measures


    A palmprint template contains spatial information about the principal lines and
    putative points, which are generally between 30 and 100 points. A match of six
    to eight putative points is usually considered enough for verification of an individual’s
    palmprint. A biometric system must classify a pair of templates having too low
    or too high a similarity value that is paired with intermediate values that take
    a larger calculation from the matcher to classify. The similarity measure gives
    good results in cases where the matching is either extremely too low or too high.
    For a perfect match, the matching probability should be extremely high and for
    a mismatch, it should be extremely low. The MATLAB function that is used in this
    study to compute the similarity metric of left palm is showMatchedFeatures(OLeft_Image,
    Left_image, L_macthed_pts1(i), L_matched_pts2(i), ‘montage’) and for computing
    the'
