  md: regarding the solute transport model has been reported in the literature, as
    Ebach and White (1958) concentrated their work on the longitudinal dispersion
    for a periodically varying input and plotted a curve of modified Peclet numbers
    as a function of Reynolds number. Ogata and Banks (1961) have obtained non-symmetric
    concentration distribution curves and claimed that the curves show a symmetric
    nature for a vanished value of dispersion in a region away from the source of
    concentration. The porous medium was assumed homogeneous and isotropic, and the
    effect of adsorption was not considered in the model. Bruce and Street (1967)
    discussed both longitudinal and lateral dispersion effect in the semi-infinite
    non-adsorbing porous media in a steady unidirectional fluid flow for a fixed input
    concentration. Marino (1974) discussed the contaminants distribution in the porous
    media, considering temporal variation of the contaminant concentration. The solution
    obtained by Marino was valid for constant seepage velocity and dispersion, although
    in natural geological formations; flow parameters are usually non-uniform and
    spatially or temporally varying. Crank (1975) presented the mathematical background
    behind the process of diffusion in the transport mechanism and made use of various
    advection–diffusion models with their analytical and numerical solutions. Genuchten
    and Alves (1982) presented the analytical solutions of a set of one-dimensional
    convective–dispersive transport equation with linear equilibrium adsorption, first-order
    decay, and zero-order production in some cases. Kumar (1983) presented an illuminating
    discussion on the solute transport against dispersion and introduced a new time
    variable to solve the unsteady flow problem. Yates (1990) presented the analytical
    solution for one-dimensional transport in a heterogeneous porous medium assuming
    spatially dependent dispersion; however, solute dispersion is also influenced
    by temporal change up-to some extent. Gelher et al. (1992) presented a critical
    review of the data on field-scale dispersion in aquifer formations and concluded
    that longitudinal dispersivities with diminished values are applicable to field
    studies. Basha and El-Habel (1993) obtained the analytical solution of a one-dimensional
    advection–dispersion equation for time-dependent dispersion and uniform seepage
    velocity, employing Green’s function method, but seepage velocity may vary spatially
    or temporally in the heterogeneous medium. Fry et al. (1993) presented the analytical
    solution of the solute transport equation with rate-limited desorption and decay
    applying an eigen function integral function method. The contaminant flux at the
    inlet boundary was assumed to be zero. Logan and Zlotnik (1995) discussed the
    effect of convection diffusion on the solute transport for periodic boundary conditions
    in the presence of adsorption and decay and studied their interaction with the
    media in-homogeneity. Logan (1996) considered the effect of scale-dependent dispersion
    on the solute transport for periodic boundary conditions and obtained the solution
    in terms of hypergeometric functions; it was concluded that wave amplitude in
    the homogeneous medium was lower than that in the heterogeneous medium but not
    in general. Huang et al. (1996) obtained the analytical solution of the ADE with
    asymptotically saturated dispersion. Aral and Liao (1996) have discussed the effect
    of constant, linear, asymptotic, exponentially time dependent dispersion on the
    two dimensional solute transport. The obtained solutions have restricted applications
    or applicable to specific boundary conditions. Dispersivity may be increasing
    non-linearly with distance in natural geological formations. Zoppou and Knight
    (1997) presented the analytical solution for the advection and advection–diffusion
    equation with spatially changing variables. In the considered model the diffusion
    coefficient was assumed to be directly proportional to the square of the seepage
    velocity. Neelz (2006) discussed the limitations of the analytical solution for
    the spatially changing flow parameters and compared the analytical solution with
    the obtained numerical solution. Although the spatially varying deterministic
    dispersion and seepage velocity reflect the influence of the media heterogeneity
    on the solute transport, the stochastic behavior of the solute advancement is
    not
