  md: 'We end the section with a result that is taken again from [13]. The convergence
    problem differs from [12] in that the nonlinear term $g_i$ has to be taken care
    of. The stiffness $g_i''(q_i)$ influences the choice of the parameters $\lambda$,
    $\mu$. In particular, if $\alpha = \frac{1}{\Delta t}$ is large, which means small
    time-steps, $\kappa_i$ is small and $\mu$ is large compared to $\lambda$, then
    in the case $\mu, \lambda > 0$, we have convergence. We refer to [13] for the
    precise statement.


    Under the assumptions above, for $\lambda > 0$, $\mu > 0$, the iterations converge
    and the solutions $q''^l = (q_i^l)_{i \in T}$ of the iterative process (28), describing
    the local optimality systems on the individual edges, converge to the solution
    of the optimality system in Equation (2.27). $q_i^l$, $\rho_i^l$ converge to $q_i$,
    $\rho_i$ in the energy sense.


