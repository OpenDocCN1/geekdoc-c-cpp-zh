  md: 'The idea now is to use a domain decomposition similar to the original system
    on the network. The method allows the interpretation of the decomposed optimality
    system in Equation (28) as an edge-wise optimality system of an optimal control
    problem formulated on an individual edge. Therefore, it is then possible to parallelize
    the optimization problems rather than the forward and backward solves. To this
    end, we introduce the following local system:


    ```

    α_i q_i^{l+1} - β_i ∂_xx q_i^{l+1} = f_i  in (0, ℓ_i), i ∈ ℐ

    α_i ρ_i^{l+1} - β_i ∂_xx ρ_i^{l+1} = -κ(q_i^{l+1} - q_i^0) in (0, ℓ_i), i ∈ ℐ

    q_i^{l+1}(n_k) = 0, ρ_i^{l+1}(n_k) = 0, i ∈ ℐ_k, n_k ∈ 𝒥_D^S

    ∂_x q_i^{l+1}(n_k) = 1/v ρ_i^{l+1}(n_k), ∂_x ρ_i^{l+1}(n_k) = 0, i ∈ ℐ_k, n_k
    ∈ 𝒥_N^S

    d_{ik} q_i^{l+1}(n_k) + λ_k ∂_x q_i^{l+1}(n_k) + μ_k ∂_x ρ_i^{l+1}(n_k)

    = λ( 2/d_k Σ_{j∈ℐ_k} β_j ∂_x q_j^l(n_k) - β_i ∂_x q_i^l(n_k) ) + μ_k( 2/d_k Σ_{j∈ℐ_k}
    β_j ∂_x ρ_k^l(n_k) - β_i ∂_x ρ_i^l(n_k) )

    - ( 2/d_k Σ_{j∈ℐ_k} d_{jk} q_j^l(n_k) - d_{ik} q_i^l(n_k) ) = g_{ik}^{l+1},


    d_{ik} ρ_i^{l+1}(n_k) + λ_k ∂_x ρ_i^{l+1}(n_k) - μ_k ∂_x q_i^{l+1}(n_k)

    = λ( 2/d_k Σ_{j∈ℐ_k} β_j ∂_x ρ_j^l(n_k) - β_i ∂_x ρ_i^l(n_k) ) - μ_k( 2/d_k Σ_{j∈ℐ_k}
    β_j ∂_x q_j^l(n_k) - β_i ∂_x q_i^l(n_k) )

    - ( 2/d_k Σ_{j∈ℐ_k} d_{ik} ρ_k^l(n_k) - d_{ik} ρ_i^l(n_k) ) = h_{ik}^{l+1}, k
    ∈ 𝒥^M. (2.28)

    ```


    It is important to remark that the decomposition involves the original state variables
    as well as adjoint variables. The same arguments that led from Equations (2.15)
    and (2.14) to (2.16) and (2.17) apply to show that, upon convergence as l → ∞,
    Equation (2.28) tends to Equation (2.27). Now, Equation (2.28) decomposes the
    fully connected problem in Equation (2.27) to a problem on a single edge i ∈ ℐ
    with inhomogeneous Robin-type boundary conditions.


    # 2.4.3 Virtual Controls


    Let us now consider the following optimization problems on a single edge. The
    idea is to introduce a virtual control that aims at controlling classical inhomogeneous
    Neumann condition including the iteration history at the interface as inhomogeneity
    to the Robin-type condition that appears in the decomposition. To this end, it
    is sufficient to consider three cases: (a) the edge i connects a controlled Neumann
    j ∈ 𝒥_N^S node with a multiple node k ∈ 𝒥^M at which the domain decomposition
    is active, (b) the edge i connects a controlled Neumann node j ∈ 𝒥_N^S with multiple
    node k ∈ 𝒥^M at which the domain decomposition is active, and (c) the edge i connects
    two multiple nodes j, k ∈ 𝒥^M.


    Case (a):


    ```

    min_{u_j, v_{ik}} I(q_i, u_j, v_{ik}) := κ/2 ||q_i - q_i^0||^2 + ν/2 u_j^2 + 1/(2
    μ_k) v_{ik}^2 + 1/(2 μ_k) (μ_k ∂_x q_i(n_k) + h_{ik}^l)^2

    ```'
