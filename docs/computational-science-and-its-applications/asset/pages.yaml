    A * x = b.


    This task is easily solved if A is a diagonal matrix, with diagonal entries of
    the form [d1,...,dn], because then A * x = (d_k x_k)_{k=1}^n and all the questions
    are easily answered. Invertibility is equivalent to the condition d_k ≠ 0 for
    all k. For the case of some zeros the (pseudo)-inverse is obtained by inverting
    exactly the non-zero coordinates.


    We all know that it is hence a great opportunity if we can diagonalize a given
    matrix, because then our main questions are reduced to the diagonal case, making
    use of a basis of eigenvectors, and the elements in the diagonal matrix are just
    the eigenvalues of the given matrix A.


    Of course it may be cumbersome to compute a set of eigenvectors, perhaps more
    complicated than solving the equation right away. But in some (lucky) cases, and
    for us most importantly, the structure of a matrix (in fact a commutative algebra
    of matrices) can already guarantee that there is a common set of eigenvectors
    which does not depend on the fine details of the given matrix. If then, in addition,
    there are fast algorithms to compute the eigenvalues of each such matrix A we
