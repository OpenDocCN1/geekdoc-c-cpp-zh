    H₀(z)G₀(z) + H₁(z)G₁(z) = 1

    ```


    Here, G₀(z) and G₁(z) represent low- and high-pass reconstruction filters, respectively.
    H₀(z) and H₁(z) represent low- and high-pass decomposition filters, respectively.


    The passband frequency support of the low-pass filter at jth level is the region
    [−π/2ʲ, π/2ʲ]². In the same way, the support of the high-pass filter is the complement
    of low-pass support


