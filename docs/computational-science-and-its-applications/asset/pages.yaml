    # 15.3 The Proposed Protocol


    In this section, we discuss the proposed protocol. The architecture of the proposed
    protocol is shown in Figure 15.1. The presented protocol has three phase, which
    are as follows:


    # 15.3.1 Set-Up Phase


    PKG inputs a security value l, returns safety values, and M, for given PKG, executes
    the following steps:


    +   Step 1. Inputs g of G.

    +   Step 2. Inputs M ∈ Z*_p and sets public key PK = M g.

    +   Step 3. Chooses collision free one way hash functions:

    +   H₁: {0, 1}* × G → Z*_p.

    +   H₂: {0, 1}* × {0, 1}* × {0, 1}* × Z*_p × Z*_p → {0, 1}^l.

    +   H₃: {0, 1}* × {0, 1}* × G × G × Z*_p × Z*_p → {0, 1}^l.


    After that, PKG publishes systems parameters F_p, E, G, l, g, PK, H₁, H₂, H₃,
    and M keep safe.


    # 15.3.2 Extraction Phase


    # User private key extraction


    U takes extraction as:


    +   Step 1. U uploads her/his ID_U to PKG via secure channel.

    +   Step 2. PKG verifies the validation of ID_U. If validation succeeds, then
    PKG takes a random number x_U ∈ Z*_p.


