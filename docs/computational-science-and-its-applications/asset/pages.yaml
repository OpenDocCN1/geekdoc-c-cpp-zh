  md: 'and so on.


    # Theorem 22.2. Orthogonal property of Laguerre’s fractional polynomials.


    $$\int_{0}^{\infty} e^{-x^{\beta}} x^{\beta-1} L_{n}(x^{\beta}) L_{m}(x^{\beta})
    dx = \frac{1}{\beta} \delta_{mn} \begin{cases}0, m \neq n \\ 1, m = n\end{cases}$$


    Proof. Consider


    $$\sum_{n=0}^{\infty} L_{n}(x^{\beta}) t^{n} = \frac{\exp\left(\frac{-x^{\beta}
    t}{1-t}\right)}{1-t} \quad \text{and} \quad \sum_{m=0}^{\infty} L_{m}(x^{\beta})
    s^{m} = \frac{\exp\left(\frac{-x^{\beta} s}{1-s}\right)}{1-s}$$


    $$\sum_{n=0}^{\infty} \sum_{m=0}^{\infty} L_{n}(x^{\beta}) L_{m}(x^{\beta}) t^{n}
    s^{m} = \frac{\exp\left(\frac{-x^{\beta} t}{1-t} + \frac{-x^{\beta} s}{1-s}\right)}{(1-t)(1-s)}$$


    Multiplying by $x^{\beta-1} e^{-x^{\beta}}$ and integrating


    $$\sum_{n=0}^{\infty} \sum_{m=0}^{\infty} \int_{0}^{\infty} e^{-x^{\beta}} x^{\beta-1}
    L_{n}(x^{\beta}) L_{m}(x^{\beta}) t^{n} s^{m} dx = \frac{1}{(1-t)(1-s)} \int_{0}^{\infty}
    \exp\left(-x^{\beta} + \frac{-x^{\beta} t}{1-t} + \frac{-x^{\beta} s}{1-s}\right)
    dx$$


    $$= \frac{1}{\beta (1-t)(1-s)} \left[ \frac{e^{-x^{\beta} \{1+t/(1-t)+s/(1-s)\}}}{\{1+t/(1-t)+s/(1-s)\}}
    \right]_{\infty}^{0}$$


    $$= \frac{1}{\beta (1 - s t)}$$


    $$= \frac{1}{\beta} \sum_{n=0}^{\infty} t^{n} s^{n}$$


    Now equating the coefficients of $t^{n} s^{n}$ both sides we get


    $$\int_{0}^{\infty} e^{-x^{\beta}} x^{\beta-1} L_{n}(x^{\beta}) L_{m}(x^{\beta})
    dx = 0, \; m \neq n$$


    $$\int_{0}^{\infty} e^{-x^{\beta}} x^{\beta-1} L_{n}(x^{\beta}) L_{m}(x^{\beta})
    dx = \frac{1}{\beta}, \; m = n$$


    # Theorem 22.3. $L_{n}(x^{\beta})$ has the following recurrence relations:


    +   (a) $(n+1)L_{n+1}(x^{\beta}) = (2n+1 - x^{\beta}) L_{n}(x^{\beta}) - n L_{n-1}(x^{\beta})$


    +   (b) $L''_{n+1}(x^{\beta}) = L''_{n}(x^{\beta}) - L_{n}(x^{\beta})$


    +   (c) $x^{\beta} L''_{n}(x^{\beta}) = n L_{n}(x^{\beta}) - n L_{n-1}(x^{\beta})$'
