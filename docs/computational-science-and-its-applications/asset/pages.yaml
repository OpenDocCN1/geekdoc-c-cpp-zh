    \(\int_{\mathbb{R}} \delta(y - x) f(y) dy = f(y - x) = [T_x f](y).\quad (1.5)\)


    # 1.6 The Computational Side


    An important part of modern digital signal processing is based on the use of computers.
    It is a plain statement that a computer—at least if viewed as a number-crunching
    machine—can only digest a finite set of vectors of finite length (and deal with
    time at the level of finite precision). Therefore one has to replace the continuous
    function by a sequence of samples each time a Fourier transform has to be computed
    approximately using the FFT. Recall that the mathematical description of the DFT
    (the Discrete Fourier Transform) is based on the rule $\mathbf{x} \mapsto \mathbf{y}$,
    with $\mathbf{x}, \mathbf{y} \in \mathbb{C}^n$:


    \(y_k = \sum_{j=1}^{n} x_j \omega_N^{(k-1)(j-1)},\quad k = 1,2,..,n.\quad (1.6)\)


    Sometimes this formula will be justified by some form of Riemann-sum argument,
    But most of the time it is (implicitly) suggested that the FFT applied to a sequence
    of regular samples corresponds to a sequence of samples of the Fourier transform
    (as defined by the integral transform). But this is true only approximately, and
    one has a quantitative control on the deviation, which of course depends mostly
    on the signal length $n$ and certain properties of the involved function $f$ (like
    smoothness or decay). But even if $n$ and $f$ are given the sampling strategy,
    this may strongly influence the result. A qualitative control in a rather general
    setting is provided by the paper [10], but further quantitative investigation
    should be carried out.


