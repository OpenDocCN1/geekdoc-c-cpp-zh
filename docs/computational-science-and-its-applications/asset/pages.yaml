- pgno: 12
  md: 'There are 26 chapters in this edited volume. Chapter 1 is contributed by Prof.
    Hans G. Feichtinger of Vienna University, who is well-known throughout the world
    for his work in the field of numerical harmonic analysis. His research collaborators
    are spread all over Europe and even in India and North America. He is the Editor-in-Chief
    of Springer’s Journal of Fourier Analysis and Applications. He has written an
    interesting chapter on “Ingredients for Applied Fourier Analysis.”


    In Chapter 2, Prof. Guenter Leugering of Friedrich-Alexander University, Erlangen,
    Germany, has presented his study on industrial applications of optimal control
    for partial differential equations on networks: reduction and decomposition methods
    applied to the discrete continuous control of gas flow in complex pipe systems.


    Chapter 3, by Professors D. Provitolo and R. Lozi, is devoted to a comparatively
    new type of problem, namely, a model to access the role of spatial urban configurations
    on crowd evacuation dynamics during terrorist attacks.


    Prof. Lozi is a well-known researcher who has collaborated with Prof. Leon Chua
    (inventor of Chua Circuit and Memristor and Alexander Sharkovsky, who introduced
    “Sharkovsky’s order”). Lozi has discovered a particular mapping of a simple strange
    attractor now known as the “Lozi Map.”


    Prof. M. Shah Jahan of Memphis University, who has established a well-reputed
    department of Physics and Material Science, has presented his work on free radical
    processes in medical grade UHMWPE in Chapter 4.


    Chapter 5 deals with the work of Prof. Taufiquar Khan of Clemson University, USA
    on computational algorithms for ill-posed inverse problems.


    Kazemi and Gulshan of Iran have presented their work on an efficient family of
    Steffensen-like methods for finding nonlinear equations in Chapter 6.


    In Chapter 7, Siddiqi, Singh, and Kumar have discussed their work on computational
    methods for conformable fractional differential equations.


    Tarlok Singh and Manchanda present their work on pan-sharpening using modified
    nonlocal means based guided image filter in NSCT domain in Chapter 8.


    Bhatnagar awardee Prof. Kunnath Sandeep of TIFR, CAM, Bengaluru, has presented
    his work on Moser–Trudinger and Adams inequalities in Chapter 9.


    Prof. Ganesan et al, IISc Bengaluru, a leading expert in computational science
    and data analysis, introduce their work on computational ship hydrodynamics: modeling
    and simulation, in Chapter 10.


    Upadhyaya, Nath, and Sanjay Kumar (of BHU, a well-known expert in his field) have
    presented their work on computer simulations of DNA-drug interaction in Chapter
    11.


    In Chapter 12, Khokhar and Singh introduce a graphical user interface for palmprint
    recognition.


    In Chapter 13 Noor Zahra (currently at Prince Nura University Riyadh, Saudi Arabia)
    et al have studied wavelet approach for the classification of autism spectrum
    disorder.


    Chapter 14, by Tripathi et al, presents de-noising Raman spectra using total variation,
    de-noising the iterative clipping algorithm.


    Chapter 15, by Kumar and Ahmad, is devoted to cloud computing.


    Bhatla et al have studied the development of a statistical yield forecast model
    for rice using weather variables in Gorakhpur district of eastern Uttar Pradesh
    in Chapter 16.


    In Chapter 17, Chandok et al have studied cognitive computing agent systems.


    Lizzy and Balachandran (expert in fractional calculus and analysis) have studied
    the controllability of quasi-linear stochastic fractional dynamical systems in
    Hilbert spaces in Chapter 18.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'In Chapter 19 the advection-dispersion equation with zero-order production
    term and various seepage velocity patterns in a heterogeneous medium has been
    studied by Pandey and Singh.


    Chapter 20, devoted to the application of genetic algorithm and support vector
    machine for brain-tumor classification of MRI images, has been written by Gupta
    and Ahmad.


    Sangeeta and T. D. Narang have presented their work on proximity and remotality
    in abstract spaces in Chapter 21.


    Chapter 22, by Dixit and Ujlayan, is devoted to conformable fractional Lauguerre
    and Chebyshev differential equations.


    Chapter 23, by Ansari and Alam, is essentially related to the role of mathematics
    in Computational Linguistics.


    Pooja et al have studied Legendre Wavelets methods for solution of first-kind
    Volterra problems in Chapter 24.


    In Chapter 25, Bhardwaj and Bangia carry out computational linguistic analysis
    of retail e-commerce using word clouds.


    Chapter 26 deals with the impact of data assimilation on the simulation of a monsoonal
    heavy rainfall event over India using the ARW modelling system.


    We take this opportunity to thank Ms. Aastha Sharma of Taylor & Francis for providing
    continuous guidance and help. We will be failing in our duty if we don’t express
    our gratitude to Mr. P. K. Gupta, Chancellor, Sharda University, Greater Noida
    and Dr. Nadeem Tarin, alumni of AMU based in Saudi Arabia for providing valuable
    financial help in organizing academic activity yielding a valuable volume.


