    **Definition 17.2.** A Decision Situation Experience as Triple (**T**) represented
    as shown in Equation (17.4):


    $$T := (e, a, e) \mid (e, a, p)$$  (17.4)


    where, e, a, and p denote the *entity, association,* and *phrase* correspondingly.


    A Decision Situation triple has three components: entity (e), association (a),
    and phrase (p). The third part of the triple represents an entity (single word)
    or a phrase (multiple words), which is the actual knowledge info the DS triple
    indicates. For the experience sentence in Example 2 denoted as (Eₐ, Eᵦ, E𝒸), *Ashish*,
    (cough, cold and mild fever), August 2018, flu, and *AntiViral* are respectively
    the third part of the five different DS Experience Knowledge triples.


    +   - (Patient, Patient Name, Ashish)

    +   - (Patient, Patient Symptom, cold cough and mild fever)

    +   - (Patient, Time Report, August 2018)

    +   - (Patient, Patient Disease, Flu)

    +   - (Patient, Patient Treatment, AntiViral)


    If the user input is a query (**Qᵢ**), then it is necessary to understand the
    question type, subject, predicate, and the answer type.


    *Q₁ = What is the treatment of the flu?*


    Let us consider (Q₁) as the query input given by the user. The cognitive computing
    agent develops the understanding of the query as follows:


    +   - Question Type = What (Fact)

    +   - Subject = Flu

    +   - Predicate = treatment

    +   - Answer Type = treatment


