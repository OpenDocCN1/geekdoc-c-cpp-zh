    sentiment of the users of the product and helps other prospective buyers in choosing
    the product best suited for themselves. Also, it improves market value and their
    consumer outlook, so the text made available is such that the outcomes are positively
    bent toward the product. Customer feedback from retail e-commerce is the source
    that consists of a treasure-trove of valuable business information. But, it is
    not enough to know what customers are talking about. One must also get their sentiments.
    Computational linguistics is one way to uncover those views. Table 25.1 shows
