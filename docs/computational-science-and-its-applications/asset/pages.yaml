  md: '# 13.2 Literature Survey and Background Information


    In order to observe brain activity, the electroencephalogram (EEG) and functional
    magnetic resonance imaging (fMRI) are extensively used methods, EEG being a direct
    and the latter an indirect method. When EEG signals are applied, the brain''s
    electrical activity is measured and recorded as voltages. Recently researchers
    have produced immense evidence demonstrating autism spectrum disorder, which is
    a stereotyped, heterogeneous neurodevelopmental syndrome categorized by weak social
    communication skills and recurring activities among children, and it is proposed
    that EEG could be used to quantify this abnormal and digressive neural connectivity.
    The incredible increase in autism spectrum disorder requires methods of magnetoencephalography
    functional magnetic resonance imaging and electroencephalography based on neuroimaging.
    These methods are applicable with the help of processes of functional connectivity,
    segregation, and integration of information processing. The brain deficiencies/incapabilities
    can be solved by the application of functional connectivity [2]. This refers to
    the degree of compatibility of correlation or synchronization of different regions
    in the brain at the time of resting or performing states and the latter could
    be based on functional connectivity; finally the results can be combined to reflect
    neurological and psychiatric syndromes. An aberrant functional connectivity is
    applied to study and classify the cognition disorders [3, 4, 5, 6]. ASD is a neurodevelopmental
    disorder characterized by a typical functional integration of brain region. Brain
    connectivity measures may identify early ASD. Few of the earlier studies of ASD
    symptoms consist of local over-connectivity, global under-connectivity of aberrant
    functional connectivity. They presented the one core neuro-biological mechanism
    with applied entropy of EEG that is known to reveal unpredictable brain activities
    and also show the anomalies associated with it [7, 8]. The researchers McDonough
    et al., Ghanbari et al., and Misic et al. were able to predict that EEG complexity
    is useful to determine brain functional connectivity [9, 10, 11]. Li et al stated
    that entropy could be used to monitor functional states of the brain [12]; Piryatinska
    et al., Arton et al., and Tan et al. predicted the existence of neuropsychiatric
    and neuro-diseases such as Parkinson''s disease, epilepsy, schizophrenia [13–17].
    The researchers Perkins et al. and Mason et al. confirmed, after examining the
    studies conducted on a persons'' brain connections, that a specific set of connections
    within regions of the brain, depending on human conditions, have abnormalities
    in the brain patterns, physical connections between regions sometimes referred
    to as structural connection or, if based on similarity of temporal characteristics
    in regions of brain activity, as functional connection [15, 17].


    Liang et al. target entropy measures in anaesthesia [18]. At the time of perception
    and other active processes like cognition the temporal activities got spotted,
    then the task-related functional connection offers evidence that the brain regions
    within the network are employed in order to route and integrate information by
    responding to events occurred [19]. An electroencephalography test is commonly
    used to detect electrical brain activities and also to identify abnormal brain
    activities; it can predict underlying structural disorder in ASD patients [20].


    Many researchers have studied the EEG signals and analyzed signals of children
    with autism. Kang et al. (2018) presented four entropy algorithms to discriminate
    autism spectrum disorder (ASD) and typical development (TD) children based on
    the resting-state EEG [21]. The algorithms are sample entropy, fuzzy entropy,
    Renyi permutation entropy, and Renyi wavelet entropy. The researchers studied
    the relation between age and the'
