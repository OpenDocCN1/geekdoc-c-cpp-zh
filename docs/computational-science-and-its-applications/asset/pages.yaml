  md: 'that is, $Z_h$ are the vertices on the boundary $\Gamma_s$. Then the displacement
    of inner mesh points is obtained by solving the linear elasticity equation, i.e.,


    Find $\boldsymbol{\Psi} \in H^1(\Omega(t^n))^3$, such that


    $\nabla \cdot S(\boldsymbol{\Psi}) = 0$ in $\Omega(t^n)$,


    $\boldsymbol{\Psi} = \boldsymbol{d}$ on $\Gamma_s$,


    $\boldsymbol{\Psi} = 0$ on $\partial\Omega(t^n) \\ \Gamma_s$,


    where $S(\boldsymbol{\Psi}) = \lambda_{L_1}(\nabla \cdot \boldsymbol{\Psi})I +
    2\lambda_{L_2}D(\boldsymbol{\Psi})$. Here, $\lambda_{L_1}$ and $\lambda_{L_2}$
    are Lame constants, and in computations we use $\lambda_{L_1}=\lambda_{L_2}=1$.
    Once the displacement vector $\boldsymbol{\Psi}$ is computed, the mesh velocity
    is then calculated as $\boldsymbol{w}_k^{n+1}=\boldsymbol{\Psi}/\delta t$.


    The proposed algorithms are implemented in our in-house finite element package,
    ParMooN [26, 32].


    # 10.5 Numerical Results


    In this section, we present a few computations results for a flow past a KVLCC2
    (KRISO Very Large Container Carrier, where KRISO stands for Korea Research Institute
    of Ships and Ocean engineering) ship hull. Here, we considered only the fluid
    flow around the ship by keeping the solid structure fixed. In the considered model,
    the KVLCC2 hull is submerged 30 m in a fluid tank of length 500 m, width 185 m,
    and depth 58 m. The basic dimensions of the KVLCC2 ship hull are as follows: (i)
    length between perpendiculars ($L_{pp}$) 320 m, (ii) waterline length ($L_{wl}$)
    325.5 m, (iii) breadth ($B$) 58 m, see [33] for more details. Further, the computations
    are performed with 146739 and 6888 DOFs for the velocity and pressure, respectively.


    The plots in Figure 10.5 show the evolution of flow around the ship’s hull at
    different instances. Further, the velocity plots are plotted on a logarithmic
    scale to effectively visualize the minute variations in the velocity of the flow.


    Next, streamlines are most commonly used to visualize a fluid flow since it could
    easily represent the features like vorticity present within the fluid flow. Streamlines
    are imaginary lines that are drawn tangent to the velocity vector at any point
    along the line. Streamlines tend to group together when the flow velocity is high,
    whereas the streamlines are usually separated out in a low-speed flow. The plots
    in Figures 10.6 through 10.8 show the velocity streamlines along the axis of flow
    observed from various points around the ship’s hull.


    We could see that the streamlines tend to move upwards below the stern portion
    of the ship; this is due to the fact that the bottom portion on the stern side
    of the ship is inclined upwards toward the surface of the water. This design is
    similar to the design of the upper surface of an airfoil, which is done to prevent
    the separation of fluid flow when a flow is past an object. Separation of a fluid-flow
    form surface may lead to adverse pressure gradients on the rear end of the surface
    which significantly contributes to pressure drag, which could be observed in flow
    past a flat plate placed perpendicular to the direction of flow.'
