  md: '# FIGURE 11.9


    (a) The chemical structure of the N-protonated form of the drugs (Trabectedin
    and Mitomycin C) used as intra-strand cross-links used to study force-induced
    transitions in DNA-ICLs; (b) Schematic representations of binding modes of the
    Trabectedin and Mitomycin C to a central CGG triplet of the DNA. Base numbers
    correspond to their position in the 15-mer: the strand bearing the adduct = 1–15,
    whereas the complementary strand = 16–30. Here, the solid and dashed lines between
    the two strands correspond to the covalent bond and the hydrogen bond, respectively.


    We have studied the force-induced separation of dsDNA in the absence and presence
    of ICL agents. The dynamics of the system have been studied using atomistic simulation
    (AMBER10 software package) with an all-atoms (parmbsc0) force field [74]. A force
    routine has been added in AMBER10 for simulation under constant force conditions
    [75, 76]. This allowed us to conduct single-molecule experiments in silico and
    observe biomolecular mechanics in action. We have carried out simulations in the
    isothermal-isobaric (NPT) ensemble using a time step of 1 fs. We maintain the
    constant pressure by isotropic position scaling with a reference pressure of 1
    atm and a relaxation time of 2 ps. A constant temperature is maintained at 300
    K using a Langevin thermostat with a collision frequency of 1 ps⁻¹ [56].


    We have used three-dimensional periodic boundary conditions during the simulation.
    The external force started at 0 pN and increased linearly with time steps depending
    on the forcing rate until the DNA separates completely. The loading rate used
    in these studies is kept fixed at 0.0001 pN fs⁻¹. Three-dimensional structures
    and trajectories were visually studied using the computer graphics program, with
    visual molecular dynamics (VMD) software [78]. Because of the computational limitations,
    we could not employ a pulling rate slower than 0.0001 pN fs⁻¹. As a result, the
    rupture force of DNA is seen here to be an order of magnitude higher than the
    one obtained in the experiments. The relationship of simulated, and measured,
    rupture forces has been discussed extensively by Sotomayor and Schulten [94].


    ![](img/81c56bc4b2fca1951aff5e0ab85b66be_207_0.png)


