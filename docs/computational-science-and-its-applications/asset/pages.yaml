    # ### 1.5 System Theory and Fourier Transforms


    One of the central topics of Fourier Analysis is clearly the concept of “convolution”
    and the so-called “convolution theorem,” essentially stating that the Fourier
    transform is turning convolution into pointwise multiplication (and vice versa)
    which are used to characterize translation-invariant linear systems (TILS) as
    a kind of moving average or convolution. So we have essentially to take care of
    the following questions:


    +   1. For which pairs of objects can one define a convolution?

    +   2. For which objects can one define a Fourier transform?

    +   3. Under which conditions can one prove that convolution is turned into pointwise
    multiplication and vice versa?


    We avoid on purpose the question of whether the “convolution exists” or “whether
    a given function” (or distribution) “has a Fourier transform,” because such statements
    become easily ambiguous and hence unclear. Also, the answer may depend on the
    technical machinery in the background which would have to be specified. In some
    cases a function may have a Fourier transform in the distributional sense which
    is even a function, without allowing the transform being realized as a Lebesgue
    integral pointwise (not even pointwise almost everywhere). We will try to avoid
    such questions here.


    As we will see, these answers have easy and clear answers for “nice functions”
    but may be more delicate in a more general setting, even if the involved objects
    are quite reasonable functions.


    We also did not call the “objects” functions or generalized functions in the above
    formulation, because to make these terms precise is one of the tasks of such a
    course and needs some preparation.


    At first sight the answer to all these questions is provided by the use of the
    space Banach space $(L^1(\mathbb{R}^d),\|\cdot\|_1)$ of Lebesgue integrable functions,
    with the norm


    ```

    $$\|f\|_1=\int_{\mathbb{R}}|f(x)|\,dx,\qquad f\in L^1(\mathbb{R}). \tag{1.2}$$

    ```


    It appears as the right domain for convolution, because first of all one can show
    that the pointwise defined convolution integral


    ```

    $$[g*f](x)=\int_{\mathbb{R}} f(x-y)g(y)\,dy,\qquad x,y\in\mathbb{R}, \tag{1.3}$$

    ```


    is defined almost everywhere whenever $f,g\in L^1(\mathbb{R})$, and furthermore
    the class (up to null functions) defined in this way (we call it $g*f$) is again
    an integrable function, with the important estimate


    ```

    $$\|g*f\|_1\leq\|g\|_1\cdot\|f\|_1,\qquad f,g\in L^1(\mathbb{R}). \tag{1.4}$$

    ```'
