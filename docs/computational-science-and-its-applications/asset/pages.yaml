  md: "restrained to fundamental sentimentality analysis and count based measures.\
    \ In this chapter, we study sentiment across all the customer reviews by separating\
    \ the text into word clouds.\n\nText data can be large and can contain lots of\
    \ noise which can have undesirable effects on analysis. Text data can contain\
    \ the following forms of noises:\n\n+   (a) Variations in case i.e. lowercase\
    \ and uppercase\n+   \n+   (b) Variations in word forms i.e. verb forms, adjective\
    \ forms etc.\n+   \n+   (c) Words that add noise, stop words such as “the,” “in,”\
    \ and “of” etc.\n+   \n+   (d) Punctuation and special characters\n+   \n+   (e)\
    \ HTML and XML tags\n\nThe text data in such formed word cloud sis a visualization\
    \ of word occurrence in a given document as a weighted list of words. The practice\
    \ of visualizing the content on specific issues has recently gained popularity\
    \ on various platforms.\n\n# 25.2.2 Word Cloud\n\nDisplay of data using font size\
    \ and color (optional) to indicate statistical or arithmetical synthesis of information\
    \ is known as word cloud. Analogous to tag cloud, it displays data as a weighted\
    \ list of words in an innovative visual representation of text data. Classically,\
    \ it depicts keyword metadata on different websites, and visualizing free forms\
    \ of manuscript data. Different font sizes or colors highlight the importance\
    \ of each tag in different orders. This procedure is used to swiftly identify\
    \ the most noticeable terms and for allocating the terms an alphabetic order to\
    \ define their relative importance. In the case of website navigation, the expressions\
    \ are hyperlinked to the ones associated with the tag. These word clouds illustrate\
    \ word frequency analysis applied to some raw text data from various sources,\
    \ and a preprocessed version of the same text data. The bag of words after all\
    \ the cleaning is converted into a matrix. The matrices that encompass all occurrences\
    \ of words are generated as the words are embodied in rows and the number of documents\
    \ in columns.\n\nThe type size of a word existing in a word cloud is decided on\
    \ the basis of its occurrence in the text under considerations. Word clouds of\
    \ various classifications have frequencies of words that resemble the number of\
    \ word admittances that are apportioned for classification. Font sizes, from one\
    \ to some maximum font size, are specified for lesser frequencies, whereas a ruling\
    \ should be made for greater frequencies. Under an undeviating regularization,\
    \ the weight $c_i$ of a describing word is mapped to a size scale of 1 through\
    \ $y_{max}$, where $c_{min}$ and $c_{max}$ are defining the range of obtainable\
    \ weights. This computation is carried out through the following formula:\n\n\
    $$F_i=\\begin{cases}\\dfrac{y_{max}(c_i-c_{min})}{c_{max}-c_{min}}, & \\text{for\
    \ } c_i>c_{min};\\\\1, & \\text{else}\\end{cases}$$\n\nwith\n\n$F_i$ = display\
    \ fontsize\n\n$y_{max}$ = maximum fontsize\n\n$c_i$ = count\n\n$c_{min}$ = minimum\
    \ count\n\n$c_{max}$ = maximum count"
