  md: 'In a partitioned approach, the discrete solid (Equation (10.13)) and fluid
    (Equation (10.14)) systems are integrated in time alternatingly and the interface
    conditions are enforced asynchronously [30, 31]. This sequential process allows
    for software modularity, that is, different solvers can be used to solve Equation
    (10.13) and Equation (10.14) systems. Partitioned schemes require only one fluid
    and structure solution per time step, which can be considered as a single fluid-structure
    iteration. On the other hand, due to the time lag between the time integration
    of fluid and structure, the conservation properties of the continuum fluid-structure
    system are lost. Partitioned schemes are commonly energy increasing and therefore
    numerically unstable [31]. In practice, this introduces a restriction on the admissible
    time-step size.


    In the proposed numerical scheme, we treat the non-linear and coupled terms semi-implicitly
    and apply an iteration of fixed-point type to the decoupled, linearized monolithic
    system. It alleviates the time-step restriction but preserves the conservation
    properties and allows software modularity. In a time interval (t^n, t^{n+1}),
    we adopt the following strategy:


    Let F^{n+1,0}_{flow}=F^n_{flow}, M^{n+1,0}=M^n, 𝕀^{n+1,0}_m=𝕀^n_m, u^{n+1}_0=u^n,
    w^{n+1}_0=w^n, then solve


    ```

    X_b^{n+1}=X_b^n+δt u_b^{n+1}


    u_b^{n+1}=u_b^n+δt( (ρ L^3 / m) F^{n+1,k}_{flow}+ (1/Fr) e )


    alpha^{n+1}=alpha^n+δt ω^{n+1}


    ω^{n+1}=ω^n+δt(𝕀^{n+1,k}_m)^{-1}(M^{n+1,k}-ω^{n+1}×(𝕀^{n+1,k}·ω^{n+1}))

    ```


    ```

    ( (u^{n+1}_{k+1}-u^n)/δt , v )_h + a_h(u^{n+1}_k - w^{n+1}_k , u^{n+1}_{k+1} ,
    v) + -b(p^{n+1}, v)=f^{n+1}(v)


    b(q, u^{n+1}_{k+1})=0.

    ```


    for k = 0,1,..., until the residual of the above system reduces to a threshold
    value or to a maximum number of prescribed steps. In this solution process, the
    following steps are involved in one iteration step:


    +   - solve 6DOF Equation (10.15) in Ω_s(t^n) and compute the motion of the structural
    boundary

    +   - move Ω(t^n) using linear elastic approach, see below, for the computed motion
    of the structural boundary

    +   - compute the mesh velocity and restore the domain to Ω(t^n)

    +   - solve NSE (10.16) and compute structural load F_flow and 𝕀_m with the updated
    velocity and pressure.


    During the iteration, we solve the linear elasticity problem to compute the mesh
    velocity. In the linear elastic mesh update, we first compute the displacement
    of the boundary vertices on the solid structure, that is,


    ```

    d = Z_b^{n+1} - Z_b^n,    where Z_b = X_b |_{Γ_S}

    ```'
