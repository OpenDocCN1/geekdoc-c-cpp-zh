  md: 'The WPCR model is defined on each node k by


    ```

    Ẋ = Φ(t, X)  (3.3)

    ```


    with Ẋ = dX/dt, X = (r, c, p, q, b)^T ∈ ℝ^5 and Φ given by Φ(t, X) = (Φ_i(t, X))^T,
    i = 1, ..., 5, where the functions Φ_i are defined by


    ```

    { Φ₁(t, X_k) = ṙ_k(t) = γ(t) q_k(t)(W_k − r_k(t)) − (B₁ + B₂) r_k(t) + s₁(t) c_k(t)
    + s₂(t) p_k(t) + F(r_k(t), c_k(t)) r_k(t) c_k(t) + G(r_k(t), p_k(t)) r_k(t) p_k(t)
    Φ₂(t, X_k) = ċ_k(t) = −φ(t) c_k(t)(W_k − b_k(t)) + B₁ r_k(t) + C₁ p_k(t) − C₂
    c_k(t) − s₁(t) c_k(t) − F(r_k(t), c_k(t)) r_k(t) c_k(t) + H(c_k(t), p_k(t)) c_k(t)
    p_k(t) Φ₃(t, X_k) = ṗ_k(t) = B₂ r_k(t) − C₁ p_k(t) + C₂ c_k(t) − s₂(t) p_k(t)
    − G(r_k(t), p_k(t)) r_k(t) p_k(t) − H(c_k(t), p_k(t)) c_k(t) p_k(t) Φ₄(t, X_k)
    = q̇_k(t) = −γ(t) q_k(t)(W_k − r_k(t)) Φ₅(t, X_k) = ḃ_k(t) = φ(t) c_k(t)(W_k −
    b_k(t)) } (3.4)

    ```


    The parameters involved in Equation (3.4) are real positive coefficients:


    ```

    B_i ≥ 0, C_i ≥ 0, i = 1, 2; α_i ≥ 0, δ_i ≥ 0, μ_i ≥ 0, i = 1, 2; s_i ≥ 0, i =
    1, 2.

    ```


    The imitation functions F, G, and H are real valued functions defined on ℝ × ℝ
    by


    ```

    F(r(t), c(t)) = −α₁ f₁( r(t) / (c(t) + ε) ) + α₂ f₂( c(t) / (r(t) + ε) ) (3.5)

    ```


    ```

    G(r(t), p(t)) = −δ₁ g₁( r(t) / (p(t) + ε) ) + δ₂ g₂( p(t) / (r(t) + ε) ) (3.6)

    ```


    ```

    H(c(t), p(t)) = μ₁ h₁( c(t) / (p(t) + ε) ) − μ₂ h₂( p(t) / (c(t) + ε) ), (3.7)

    ```


    where ε is a positive number and f_i, g_i, h_i for i = 1, 2 are real valued functions
    defined on ℝ. They have a decreasing shape indicating that the behavior imitation
    is symmetric. Moreover they are normalized,


    ```

    0 ≤ f_i(u) ≤ 1, 0 ≤ g_i(u) ≤ 1, 0 ≤ h_i(u) ≤ 1, ∀ u ∈ ℝ, i = 1, 2 (3.8)

    ```


    Because this model does not take the mortality rate into account, the population
    remains constant. Therefore Equation (3.4) is considered when time is proceeding
    from an initial time t₀ ≥ 0, with initial condition


    ```

    r_k(t₀) + c_k(t₀) + p_k(t₀) + q_k(t₀) + b_k(t₀) = V_k(t₀) = r_{k,0} + c_{k,0}
    + p_{k,0} + q_{k,0} + b_{k,0} = V_{k,0} ≤ W_k (3.9)

    ```'
