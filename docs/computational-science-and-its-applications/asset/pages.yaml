  md: '# 6.2 A Class of Without-Memory Methods


    In 2015 Guo and Qian followed the two-point methods without memory (GQM) [11]:


    \begin{cases} w_k = x_k + f(x_k), y_k = x_k - \dfrac{f(x_k)}{f[x_k, w_k]}, \quad
    k = 0,1,2,\dots, \\ x_{k+1} = y_k - \dfrac{(x_k - y_k)(x_k - w_k)(y_k - w_k)f(y_k)}{(y_k
    - w_k)^2 f(x_k) + (x_k - w_k)(x_k - 2y_k + w_k)f(y_k) - (x_k - y_k)^2 f(w_k)}.
    \end{cases} (6.1)


    The next theorem states the error equations in the methods in Equation (6.1).


    # Theorem 6.1 Let I ⊆ ℝ be an open interval, f : I → ℝ be a scalar function which
    has a simple root α in the open interval I, and also the initail approximation
    x₀ is sufficiently close the simple zero, then the iteration method defined by
    (1) is of fourth-order convergence and it satisfies the error equation below:


