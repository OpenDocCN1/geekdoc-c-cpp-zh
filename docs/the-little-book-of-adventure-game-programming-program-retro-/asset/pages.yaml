  md: '# THE LITTLE BOOK OF ADVENTURE GAME PROGRAMMING


    # JUST THE STUFF YOU REALLY NEED...


    The fastest, easiest way to learn to program object oriented adventures. This
    book will teach you the real secrets of adventure game programming. You will learn
    how to create Rooms and Treasures, how to let the player take and drop objects
    and how to save and restore games using serialization. The projects (which can
    be downloaded free) are written in C#. Advice is also given on translating to
    other languages such as Java, Object Pascal and Ruby.


    The Little Book Of Adventure Game Programming gives you just the stuff you need
    to get straight to the heart of writing retro adventures without all the fluff
    and padding.


    # About the author


    Huw Collingbourne is the author of the cult text adventure game, The Golden Wombat
    Of Destiny. Huw has been a programmer for more than 30 years and is a well-known
    online programming instructor. He has written programming columns for numerous
    computer magazines such as PC Plus and Computer Shopper. He is the author of programming
    books on a range of subjects including The Little Book Of C, The Little Book Of
    C# and The Little Book Of Ruby.


    ![](img/79557530489e53febfe5a6898863b83c_135_0.png)


