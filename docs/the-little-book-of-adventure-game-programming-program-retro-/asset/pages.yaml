  md: '# What Next?


    The darkneon game now has all the essential features of a fully-formed text adventure.
    It has a map containing rooms that have exits leading in any of the four compass
    directions ''up'' and ''down''. It has a player which can move freely around the
    map. It has treasures that can be found in rooms and taken or dropped by the player.
    It has containers into which treasures can be placed and those containers may
    be opened or closed.


    It also has a simple English language parser so that it is possible to interact
    with the game by writing short commands such as ''Take the sword'' or ''Put the
    ring into the sack''. So what is left to do?


    In fact, there is a great deal that you can do in order to turn what is, in effect,
    a ''game framework'' – a set of classes and methods required to write a game –
    into your own adventure game. Let''s first consider a few technical improvements
    that can be made: some additions to the fundamental features of the code.


    # Taking Container Objects


    At present, but all one of the containers in the game are fixed in place (that
    is, they are not takeable). But what would happen if there were a container object
    that can be taken? The sack in the first room can be taken, so try doing so. Take
    the sack, take the leaflet, then put the leaflet into the sack.


    So far, so good. But now try to take the leaflet again. It can''t be done because
    the leaflet, according to the current code logic, isn''t here. It is only here
    if it is in the room, in the player''s inventory, or in an open container in the
    current room. The leaflet, however, is in an open container in the player''s inventory.
    My code doesn''t deal with that. But if you drop the sack and then to take the
    leaflet, you can do so!


    You will need to rewrite the others() method to deal with this and also check
    that all methods that act upon objects (to take, drop, push, pull, look at and
    so on) continue to work correctly with objects inside containers in the player''s
    inventory.


    All the list management techniques required to implement this can be found in
    your existing code. After all, an object inside a container in the player''s inventory
    is not much different from an object in a container in a room. Try extending the
    game to deal correctly with this problem.'
