  md: '# private field names


    I choose to the precede private field names such as _name and _description with
    an underscore, for clarity. That''s a common convention across many programming
    languages. However, some programmers prefer to use the same names for fields and
    accessor methods but start fields with a lowercase letter (e.g. name) and properties
    with a capital letter (e.g. Name).


    _name and _description are now private, they can''t be referenced by code outside
    an object. I need to add public accessor methods to get and set the values of
    those variables. In C#, I can get with the => operator to return the value of
    a field. I can use set with the => operator to assign a value (represented by
    the keyword value) like this:


    ```

    public string Name {

    get => _name;

    set => _name = value;

    }


    public string Description {

    get => _description;

    set => _description = value;

    }

    ```


    # Properties


    In C# and .NET, when you provide get and set accessors to assign and return the
    value of an object''s variable, as I have done with Name and Description, these
    are called ''properties''. Some other languages provide similar capabilities.
    In Ruby, for example, they are called ''attributes''.


    Now that I have a Thing class, I can rewrite the Room class as its descendant.
    The way to do that, in C#, is to put a colon after the name of the class followed
    by its ancestor class name as I have done here:


    | public class Room : Thing |'
