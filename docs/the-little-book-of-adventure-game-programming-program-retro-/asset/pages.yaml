    \ better if I avoid this unnecessary duplication by creating another class with\
    \ a name and a description so that the *Room* and the *Actor* class *inherit*\
    \ these features.\n\nThis is a basic principle of object orientation: first create\
    \ a simple class, then create more complex classes that inherit the features of\
    \ the simple class and add on additional features as required.\n\nIn the game05\
    \ project Ive created a class called *Thing*. The *Thing* class has a name and\
