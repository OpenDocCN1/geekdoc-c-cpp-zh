    \ Just as in Zork, the player can enter fairly complex commands such as “Put the\
    \ coin in the kennel!” and the game responds appropriately.\n\n retrospect, for\
    \ a novice programmer, learning to program by writing a game of that complexity\
    \ was a stupidly ambitious thing to do. When I began it, I knew nothing about\
    \ programming. By the time I finished writing The Golden Wombat, I was a moderately\
    \ experienced programmer, so I was horrified to see all the ugly code I had written\
    \ (and which now solidly welded into the game) when I had been a beginner. Suffice\
    \ to say, it was a huge learning experience!\n\nThe other big limitation I faced\
    \ when writing that game was that the language I was using — Pascal was far from\
    \ ideal for the project. Object Oriented Programming (OOP) was not common in those\
    \ days and Pascal had no object oriented features at all. The modern version of\
    \ Turbo Pascal (Object Pascal and Delphi) has OOP. And so do many other mainstream\
    \ languages such as Ruby, Python, Java and C#. Orientation is for writing adventure\
    \ games because the rooms and textures are naturally represented by objects.\n\
    \nTo day, I still think that writing an adventure game is a wonderful way to develop\
    \ your programming skills. Unlike modern fast-action graphics games, a text adventure\
    \ can be written from start to finish by a single programmer without having to\
    \ use complicated third-party ‘game frameworks’. In the process of writing an\
    \ adventure"
