  md: '# Appendix


    Meretzky did all the programming. Many of our writers have not previously professional
    programmers so it''s not an inherently difficult system to learn. Part of the
    reason for moving onto the Mac is to make it more usable to non-programmers.


    Where do you find new games writers?


    All kinds of places. Usually they approach us. The vast majority of writers have
    come from promotions in-house – people we knew already, who''ve tried out on small
    projects. That''s basically how Steve Meretzky came in – he was a tester. Brian
    Moriarty was in our Systems Group – the expert on 6502 chips. Amy Briggs was another
    one who came in testing. And occasionally we''ve hired people from outside.


    What kind of organisation is there in Infocom? You''ve talked about testers and
    so on. Is there a kind of elite of games writers and millions of people just testing
    for bugs?


    There''s what''s called the Software Development Group. That''s divided into three
    parts. One part is famously known as the Imps, that''s the game writers, the second
    is the Testers. Then the third group is called the Systems Group. These are the
    people who maintain ZIL and various computers. I have to say that the Imps are
    a sort of elite.


    # The Imps?


    ''Imp'' is short for Implementers. By tradition, adventure game writers are called
    ''Implementers''. Some games even contain jokes about them!


    What''s an average day for your Infocom programmer? Do you come in as though was
    an ordinary job and get on with your work? Or are there times when your mind is
    just a total blank and you can''t produce anything?


    What really depends on what stage you are writing the games. If you are still
    in the design process you may well come in and scratch your head lot. Later, once
    the game is largely complete, you spend a lot of time reading the scripts of testers
    playing the games, seeing what they tried and modifying the game appropriately.
    And just fixing bugs.'
