  md: '# # Appendix


    # ## The Language of Adventures and Programming


    Here are a few of the important terms relating to programming in general and adventure
    de-wait, let me re-read


    Actually

    Here are a few of the important terms relating to programming in general and adventure
    game programming in particular which are used throughout this book. You don''t
    to understand all the terms given here in order to follow this book. However,
    this list may be of use if you come across a term with which you are unfamiliar.


    **Argument** – a data item that is passed to a function or method. Arguments are
    normally declared in the definition of the function. When the function is called
    by some other piece of code, the programmer must normally send the same number
    (and usually the same data type) of arguments to the function as declared in the
    function header.


    **Array** – a sequential list of elements. Each element can be indexed by its
    numeric position in the list.


    **Character** – a single character such as ''h'', delimited (in C#) by single-quote
    characters. Multiple characters in sequence form a string. See the entry for ‘string’.


    **Class** – the definition of an object. See ‘Object Orientation’.


    **Class Hierarchy** – in Object Orientation, one class may descend from another
    class in which a way inherits the behaviour and data of its ancestor class. This
    makes it possible to create ever more specialised classes in a hierarchy, rather
    like a family tree. For example, you might create a Car class and have two descendants:
    SportsCar and SaloonCar. The descendants would both have the features of the ancestor.
    Car, but would add on new behaviour to define the special features of a racing
    car or a saloon car.


    **Constant** – a named item that can store some piece of data as its value. The
    value of a constant may not vary during program execution. Compare with ‘variable’.


    **Double** – see *Float*.


    **Encapsulation** – this is an Object Oriented term that describes the ‘wrapping
    up’ of data and the methods that act upon it inside an object. Some (but not all!)
    programmers would also consider that ‘data hiding’ is an essential feature of
    proper encapsulation.'
