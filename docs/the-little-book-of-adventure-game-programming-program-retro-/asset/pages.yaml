    \ state includes the player's position (the 'current room'), treasures in the\
    \ player's inventory and also in the rooms – plus any other changes that have\
    \ been made to rooms and objects (if doors have been opened, their 'open' state\
    \ needs to be saved; if one treasure was put inside another, that must be saved\
    \ too – so on.\n\nMany object oriented languages implement 'serialization' which\
    \ semi-automatically saves the data defining a whole network of objects and on\
