    be stored by variables of that data type.


    IDE – Integrated Development Environment. A suite of tools normally including
    a

    code editor, compiler and debugger (and sometimes as a user-interface designer)
    for

    developing programs. The IDE used for programming C# in this book is Microsoft

    Visual Studio (for Windows).


    Integer – a ‘whole number’ with no ‘floating point’. e.g. 102.


    Interactive Fiction (or IF) – a game in which the player can interact with the
    story,

    using human-language words. Most adventure games are interactive fiction.


    Keyword – a special bit of syntax that is ‘built in’ to the programming language.
    For

    example, the words if and while are built into many programming languages.


    LISP – List Processing Language. An old computer language dating from 1958 was

    much used by early adventure game programmers. See also MDL and ZIL.


    MDL – MIT Design Language (pronounced ‘muddle’), a type of LISP developed at MIT

    (Massachusetts Institute of Technology). An early version of Zork was written
    in MDL.

    Later, ZIL was used.


    Method – a function (or procedure) that is defined inside a class in Object Oriented

    languages such as C#, Object Pascal or Ruby.


    Object – Object Oriented programming languages, an object is a structure that

    contains both data (variables) and the functions (methods) needed to act upon
    that data.

    Typically an object is created from a class. Many different objects may each be
    created

    from a single class.


    Object Orientation – a style of programming in which objects form the fundamental

    building blocks. C#, C++, Object Pascal, Smalltalk, Ruby and Java are examples
    of

