  md: 'object just as multiple objects may be in a container. But one object that''s
    *on another object* will always be visible (always ‘here’) so you need to extend
    the code to handle that. In short, small changes to the game''s vocabulary may
    require big changes to the game''s code. If your game really doesn''t need all
    these new relationships between objects, don''t overcomplicate the coding by adding
    new words.


    # Writing Puzzles


    Now that we''ve completed a solid foundation for a complete game, the time has
    come to start puzzles. This is where the fun begins. I can''t tell you which puzzles
    to add – the possibilities are endless, limited only by your own imagination.
    If you''ve played some other adventure games, you may already have ideas of the
    sort of puzzles you would like to add. You may want to write your own game from
    scratch – it could be a fantasy game with dragons and warriors; it might be a
    science fiction game set in outer space; or it could be a detective game set in
    1930s New York. Anything that could be written as a could also be programmed as
    an adventure game.


    The *darkneon* sample game I''ve created is a ‘ampunk’ futuristic Victorian setting.
    Think of it as a sort of Jack-The-Ripper-Meets-Blade-Runner scenario. It takes
    place in a dark, rambling city of misty alleyways and hissing gas lamps. There
    is a big public garden in one location with a magnificent Palm House made of cast-iron
    and glass. There is an oak tree you can climb and a deserted shop you can enter.
    There are various interesting objects scattered around including a gnawed bone,
    a coin, a lamp and an acorn. There is a lever you can pull, a button you can press
    and there is a sack, a bin and a chest – all of which are containers into which
    objects can be placed.


    If you want to go on and develop this into a finished game (and you are welcome
    to do so – all I ask is that you give me a credit for including the copyright
    notice in the comment at the start of the *Adventure.cs* code file). Let give
    you a few ideas of things you might want to do extend your sample game.


    Obviously, the first thing you may want to do is add new rooms and new treasures.
    In principle, the map could contain hundreds of linked rooms. Just be sure to
    keep track of all the connections by making a drawing of your map and checking
    that the exits defined by the *Room* objects lead to the ‘adjoining’ rooms.


    Then, think about puzzles that are suggested by things that happen in the game.
    For example, when the player goes into the garden, a squirrel runs out holding
    a pearl then it runs away. The pearl would be a good treasure if you only get
    it. But how can get it when the squirrel runs away every time you see it? Maybe
    if you found an acorn – the squirrel might take the acorn, and with its hands
    now full, would drop the pearl?'
