  md: '# Appendix


    I read a little while ago that you get problems from Christian fundamentalists
    who object to your stories?


    ![](img/79557530489e53febfe5a6898863b83c_123_0.png)


    It''s really a pretty minor problem problem. There is a certain antipathy on the
    part of a certain class of religious fundamentalists to any reference to magic.
    Most of our fantasy games have magic in them the thing that caused the greatest
    number of complaints was we ran an ad'' for Spellbreaker which showed a picture
    of a wizard.


    We ran it in Boy''s Life magazine which is the magazine of the Boy Scouts. Boy
    Scouting in America is very strong amongst the same class of people who are likely
    to be religious fundamentalists. So parents saw this ad and got annoyed.


    I must say we got more letters than we ever got about sex. We did a few complaints
    about The Leather Goddesses of Phobos, but not as many as we''d feared. I think
    Leather Goddesses was sufficiently obviously packaged that most people who bought
