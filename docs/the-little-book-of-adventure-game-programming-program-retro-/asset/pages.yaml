  md: '# Introduction


    What is in the book and what do you need in order to get started? Read on...


    # What is in the Book?


    This book provides a step-by-step guide to creating text based adventure games.
    The principal language used is C#, which is one of the most important languages
    on Windows and is also available on macOS and Linux. However, the programming
    principles and techniques explained in the book can also be used to write adventure
    games in other languages such as Java, Ruby or Object Pascal. We will end by creating
    the game below which includes a map of connected locations and takes English-language
    commands to let the user move around and interact with objects.


    ![](img/79557530489e53febfe5a6898863b83c_8_0.png)'
