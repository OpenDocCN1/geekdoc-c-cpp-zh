    # # C# Partial Classes


    Since there is only one parser in my game, I won''t need to create any parser
    objects. I therefore decided to put the parser routines into the Adventure class.
    This makes the code of that class a bit longer than is entirely convenient to
    work with in a single code file. I have therefore split the code of the Adventure
    class more than one source file.


    In C#, I can share a class across multiple files by creating a partial class.
    This is done by putting the partial keyword before the class name. I have done
    this in the file Adventure.cs and also in Adventure.parser.cs. The code in both
    these files define the class, Adventure:


    ```

    partial class Adventure

    ```


    I''ve extended the class further in the file Adventure.puzzles.cs, which is where
    I (or you!) will be able to write code for specific puzzles in this game.


    By keeping map and room initialization (as well as the code of the puzzles), all
    within the Adventure class, I can make sure that most of the rest of my game is
    ''generic'' which means that it is applicable to adventure games in general rather
    than to this adventure game in particular. Then, when I write new games, I can
    easily reuse all the generic code.


