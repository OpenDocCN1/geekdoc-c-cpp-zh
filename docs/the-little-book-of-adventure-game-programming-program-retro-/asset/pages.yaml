  md: '# Introduction


    # Compiling Projects


    Before you can run a C# program you need to compile it. The C# compiler is a tool
    that translates the code you write into ''intermediate code'' to provide instructions
    that can be executed by the C# ''runtime'' system. The intermediate code is called
    CIL (Common Intermediate Language).


    When your program runs, this CIL is executed by a ''runtime environment'' called
    the CLR (Common Language Runtime). That is why you must always ''build'' or ''compile''
    your programs before they are run. Compiling is very easy in Visual Studio. Once
    a project has been set as the Startup project, you can simply select Start without
    Debugging from the Debug menu. This compiles and runs the current project. If
    there are any errors you will be notified and will need to fix them before re-compiling.
    You can also compile all projects in a solution by selecting Build Solution from
    the Build menu.


    # Command-line Games


    Most of the projects described in this book are created using .NET Windows Forms.
    This makes it possible to create user interfaces with buttons, text fields, menus
    and so on. However, if you want an authentic 1980s-style ''retro'' game, or if
    you want to deploy your game on operating systems that do not support Windows
    Forms, you can create a command-line game similar to the one shown below. This
    is explained in the Appendix.


    ```

    sack dropped!

    look at the sack

    This is a smelly old sack

    In the sack you can see:

    acorn


    take the acorn

    acorn taken!

    put the acorn into the slot

    You put the acorn into the slot.

    pull the lever

    The lever moves slightly when you pull it.

    look at the lever

    lever a lever fixed to the wall

    down

    Palm House. This is a tall, elegant structure made of glass panes set in an cast-iron
    frame.

    The atmosphere is hot and humid.

    Huge palm trees rise overhead. An elaborate cast-iron staircase leads up to a
    balcony

    Here you can see:

    nothing


    You have nothing

    ```'
