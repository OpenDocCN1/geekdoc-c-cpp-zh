  md: '# 6 — Collections of Treasures


    And of course, having derived this new class from List, I can add on other methods
    – as I have here to return a description of all the objects in the list by iterating
    over the Thing objects, getting the Description of each, and building up a string
    by concatenating Those descriptions.


    I''ve also written a ThisOb() method which returns an object matching a string
    name, if that object is found in the list. So, for example, if the player wants
    to take a carrot and enters the string "carrot", the ThisOb() method searches
    through the ThingList collection and, if it finds an object with the Name property
    "carrot", then it returns that object.


    # Generic Dictionaries


    You may recall that you saw a similar syntax when I showed how to subclass a Dictionary
    in Chapter 4. A Dictionary is a collection of key-value pairs.


    When I wanted a Dictionary typed to deal with elements that have Rm constants
    as the key and Room objects as the value, I defined a RoomList like this:


    ```

    public class RoomList : Dictionary<Rm, Room>

    ```


    My RoomList is a generic Dictionary, just as my ThingList is a generic List. In
    strongly-typed languages, such as C# and Java, generic collections give you the
    benefit of type safety (because they specify exactly which types of object can
    be used in a list) without forcing you to inherit from a base class that defines
    the specific object types (which may not be what you want) for its list elements.


    So, in summary, the ThingList implements a list of Thing objects. My ThingHolder
    class defines an object that contains a ThingList. Both Room and Actor objects
    are descendants of ThingHolder and so they each contain a ThingList.


    Any treasures in a Room are stored in a ThingList. An Actor, such as the player,
    can collect treasures and these are added to a ThingList. Neither a Room nor an
    Actor is a list of objects, but they may contain a list of objects.'
