  md: '# 4 – Rooms in a Dictionary


    # Unique Room Identifiers – Enums


    For my map, I could have decided to use a string as the key into my dictionary.
    If I had done that, the string "Cave" could have been a key and the room2 object
    containing the description and exits of the cave could have been its associated
    value.


    The trouble is, I might have more than one room called "Cave" – maybe I have a
    whole underground empire, with hundreds of caves. But I need each key into the
    map dictionary to be unique so that when I need to find a specific cave, I know
    for sure which one I''m going to.


    That is why, instead of using strings, I decided to use constants. As my game
    currently has four rooms, I need four constants, plus NOEXIT, which will be used
    instead of -1 (which I used in earlier projects) to indicate when there is no
    adjoining room in a certain direction. Instead of declaring the constants one
    at a time, I''ve decided to ‘wrap them up in an enumeration or enum. An enum provides
    a convenient way to make a group of constants. For example, if this were a game
    that used a deck of cards, I might have an enum like this:


    ```

    public enum CardSuit {

    Clubs,

    Spades,

    Hearts,

    Diamonds

    }

    ```


    Each suit of cards has its own unique identifier in the CardSuit enum. Then I
    could create a CardSuit variable and assign it one of the suit names like this:


    ```

    CardSuit selectedSuit;

    selectedSuit = CardSuit.Clubs;

    ```


    In game06 I’ve declared the Rm enum to group together identifiers for each Room.
    You’ll find this in AdvCons.cs in the source code archive:


    ```

    public enum Rm {

    TrollRoom,

    Forest,

    Cave,

    Dungeon,

    NOEXIT

    }

    ```


    41'
