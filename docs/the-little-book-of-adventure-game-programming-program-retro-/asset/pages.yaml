  md: '# Appendix


    Have you got a favourite game?


    My favourite game of the ones I have written Enchanter. Then after that I guess
    Spellbreaker and The Lurking Horror. Though maybe Zork II. Zork II was really
    our first game that really had anything remotely resembling a story in it. It''s
    hard to say. Of everyone else''s games I''ve always had a fondness for Planetfall.
    I like all my games but I always see the flaws in them.


    How similar is the Zork Trilogy to the original Zork?


    It''s quite similar in all that the puzzles in the original Zork are also in the
    Trilogy with the exception of two. What''s different is that the original Zork
    had one fairly compact, connected geography. In the Trilogy what happened was
    that I went in and choked out the middle of that geography and it became Zork
    I. Then I made a new middle and added some of the periphery of the mainframe game
    to make Zork II. And then the remaining puzzles became Zork III. All the puzzles
    are there and the vast majority of the rooms too, but they''ve all been rearranged.


    I have to tell you one of the things that had me puzzled about Zork II was all
    the references to baseball which I didn''t understand at all.


    Yes, since we''ve gotten more contacts from fans beyond the United States – Germany,
    Britain, Australia and so forth – it becomes more and clear that references to
    things like baseball are not universally appreciated. It didn''t even occur to
    us that the games would have been distributed as widely as they are.


    Which do you think is the most difficult Infocom game?


    Spellbreaker. It was designed and written as a gift to rabid fans. It''s the third
    game in a trilogy and it''s intentionally more difficult because I was getting
    sick and tired of people writing to saying the games were too easy. I thought,
    right, you''ve asked for it. Some of the easiest puzzles for some people can be
    insoluble and vice versa.


    Do you get feedback from other people giving alternative solutions to puzzles
    you never thought of?


    Sometimes. Occasionally, people just alert us to things we hadn''t thought about.
    Like, it used to be that inflatable boat in Zork I could be used to carry every
    object in the game once you deflated it. But the classic case of getting a new
    solution to a puzzle was when we were writing mainframe Zork. We had just implemented
    the clockwork canary'
