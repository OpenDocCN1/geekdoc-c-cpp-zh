  md: '# 2 — Make a Map


    # String Interpolation


    You may notice that I sometimes embed actual bits of code such as room0.name into
    strings like this:


    ```

    outputTB.Text = $"You are in {room0.name}";

    ```


    In C#, a string preceded by a dollar $ is called an ‘interpolated string’. This
    kind of string lets you embed code between pairs of curly brackets. It evaluates
    the code and puts the result into the string. Some other languages provide similar
    capabilities. For example, Ruby programmers can use double-quoted strings for
    this purpose.


    # Link the Rooms


    In order to link the rooms, I need a map. The Room direction variables, n, s,
    w and e integers which indicate which other room should ‘connect’ to the current
    room in each direction. So I need to be able to use these numbers to find a room
    by its number. One simple way of doing that is to put all the rooms into an array
    and use the array index to locate a room.


    # Other Ways to Link Rooms


    Integer exists have the virtue of simplicity. But they are not very descriptive
    since you are forced to remember that 1 indicates the Troll Room, 2 is the Forest
    and so on. Later in the book I''ll explain other — and I think better — ways of
    ‘linking’ rooms.


    Earlier on, I made a drawing of a map to show how the rooms are connected. You
    can do this on paper. But it is also useful (for fairly small maps, anyway) to
    show a diagram of the map in a comment in your code, which is what I''ve done
    in the game03 project:


    ```

    /* game03

    * Troll Room -- Forest

    * |

    * Cave ----- Dungeon

    * */

    ```'
