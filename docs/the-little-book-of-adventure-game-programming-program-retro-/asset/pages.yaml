  md: '# 8 — Saving Games


    A stream is a sequence of bytes and it stores the data to be saved. The BinaryFormatter
    class does all the hard work for me. I create a binary formatter object and it
    serializes the data ''contained'' by the top-level object of my game, adv to the
    stream. Since adv contains both the player and the map, and the map contains all
    the rooms, and the rooms contain treasures – then the data of the map, rooms,
    player and treasures will be written into the stream just by writing adv to the
    stream. This is how I write the binary data, binfmt, of stream to the selected
    disk file:


    ```

    binfmt.Serialize(st, adv);

    ```


    # Writing Streams To Files


    In Windows Forms applications the OpenFile() of Save and Load File dialogs open
    a file whose name is specified in the dialog and return a stream (the variable
    st in my code) from which data is written to/read from the file on saving and
    loading.


    The game-loading method, loadToolStripMenuStripItem_Click(), works in much the
    same way as saveToolStripMenuItem_Click() except it de-serializes the data read
    from the disk file, casting it to the Adventure class type and assigns the data
    to the adv object:


    ```

    adv = (Adventure)binfmt.Deserialize(st);

    ```


    This reconstructs the adv object – that is, the entire state of the adv object
    including everything it contains, the game player, the map, every room in the
    map and every treasure in every.


    So you can see that the built-in serialization and deserialization capabilities
    of .NET are incredibly powerful. They do a huge amount of work to let us save
    and restore complex networks of objects with very little coding effort.


