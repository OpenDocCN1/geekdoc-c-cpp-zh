    Wombat Of Destiny*. Hu has been a programmer for more than 30 years. He is an
    online programming instructor with successful courses on C, C#, Java, Object Pascal,
    Ruby, JavaScript and other programming languages and topics. For a full list of
    available courses be sure to visit the Bitwise Courses website: http://bitwisecourses.com/


