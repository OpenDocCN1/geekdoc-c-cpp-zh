  md: '# Dave Lebling Interview


    Dave Lebling was a founder of Infocom, which created games ranging from the famous
    Zork trilogy to an adaptation of Douglas Adams''s The Hitchhiker''s Guide To The
    Galaxy. In 1988 I interviewed Lebling. You can read that interview here.


    ![](img/79557530489e53febfe5a6898863b83c_116_0.png)


    We didn''t know it at the time, but the late ''80s was the beginning of the end
    of the ''golden age'' of adventure games. At that time, neither Lebling nor I
    had any real idea of how the games industry would develop over the next thirty
    years or so. Zork, and other text-based Infocom games, worked fine of a PC with
    just 512K of memory. Today, in order to play a modern, fast-action game you may
    need a PC whose card alone boasts 6 Gigabytes (or more) of memory in addition
    to the 16 Gigabytes of the PC''s system memory. In 1988, mere megabytes of memory
    seemed like a futuristic dream. The idea that anyone would ever have gigabytes
    on their graphics card would have seemed ridiculous. This interview originally
    appeared in the UK edition of Computer Shopper magazine #7 (September 1988). My
    questions are shown in italic. Dave Lebling''s replies are printed in a standard
    font.'
  merge: -1
