  md: '# 8 – Saving Games


    How do you save and load a complex network of rooms and treasures? Let me introduce
    you to serialization!


    When playing a game, you will normally want to be able to save the game so that
    you can load it later and start playing where you left off previously. To do that
    you need to store the internal state of all the objects in the game – the player''s
    position, the treasures in the player''s inventory and the treasures in each room.


    When you want to restore a saved game, you will need to reconstruct the map, the
    rooms and their contents, the player''s inventory, the player''s position and
    so on. The good news is that .NET gives us a very easy way of doing all this.
    It''s called serialization.


    Serialization describes the process of saving an object''s data – all its public
    and private fields – by converting data to a sequence or ''stream'' of bytes.
    This stream of bytes can be written to some device, such as your hard disk. Later
    on, you can read in those bytes and deserialize them to reconstruct the objects
    that you previously serialized.


    You may think that this sounds horribly complicated. After all, a game may contain
    hundreds or even thousands of different objects. Does that mean we have to serialize
    and deserialize the map, each room in the map and each treasure in room one at
    a time?


    In fact it doesn''t. I said that when you serialize an object, you save all its
    data. The map object contains a dictionary of room objects, the room objects contain
    lists of treasures and so on. So when I serialize the map, I also serialize its
    rooms, and when each room is serialized, its list of treasures is also serialized.
    That means that in order to save the entire game state all I need to do is serialize
    the top-level object of the game.


    In my game, the top-level object is adv, an instance of the Adventure class. The
    adv object contains the _player and the _map. So when I serialize the adv object,
    the player and the player''s inventory, the map, its rooms and the treasures in
    each of those rooms are all serialized too.'
