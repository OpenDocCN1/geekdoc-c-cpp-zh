    \ games of the 1980s, which run from a command-line with nothing but a command\
    \ prompt as a user interface?\n\nIt is straightforward to convert your Windows\
    \ Forms games to command-line games. When I write the final version of my game\
    \ (the *darkneon* project) I spent some time ‘tidying up’ the program to ensure\
    \ that the code in Form1.cs contains very little code apart from method-handlers\
    \ for user interface controls. Then I can easily remove Form1.cs from my project\
    \ and replace it with code to interact with the command-line. That is what I’ve\
    \ done in the *darkneonconsole* project which is supplied in the code archive.\n\
