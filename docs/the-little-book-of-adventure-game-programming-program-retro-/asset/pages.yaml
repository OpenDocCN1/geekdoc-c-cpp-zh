    Book Of Pointers* and *The Little Book Of Recursion* from Bitwise Books. He is
    a well-known technology writer in the UK and has written numerous opinion and
    programming columns for a number of computer magazines, such as Computer Shopper,
    PC Pro, and PC Plus. At various times Huw has been a magazine publisher, editor,
