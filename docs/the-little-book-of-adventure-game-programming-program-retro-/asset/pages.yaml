  md: 'Appendix


    What exactly do the testers do? Do they just spot bugs or do they suggest new
    puzzles?


    They do everything from just beating on the program to see if they can break it
    to by making, in effect, literary criticism. Everything from nit-picking about
    whether a particular word should have a hyphen to a deep analysis of what is going
    on in a program as regards the story.


    Is it a big problem finding ever-new ideas for games? There are so many Infocom
    games and you''ve covered so much ground ...


    Well, I don''t have any difficulty coming up with ideas. If you view the spectrum
    of what we put out – we have sci-fi, fantasy, mystery and romance – when you do
    a new thing you aim it at one of those points. You have an audience in mind. You
    want to satisfy those fans. The avid fans are always calling for more difficult
    puzzles. They complain if it only took two weeks to finish and such a game. On
    the other hand, you don''t want to make them inaccessible to people who haven''t
    got much experience at playing games.


    When you''re stuck for ideas where do you go? Do you go to a library to ransack
    books, do you play other games or do you just ask one another?


    ![](img/79557530489e53febfe5a6898863b83c_122_0.png)


    All of those things. For his current game, Steve Meretzky has been collecting
    books of logic puzzles. In general we all get ideas from books. I have a very
    large library. Lurking Horror [a game written by Lebling] was quite obviously
    the result of reading too much H.P. Lovecraft.


    These days you''re putting on-screen hints for people who get stuck. Will these
