  md: 'Operator – one or more characters that are used to indicate some special operation.
    For example, most languages use the arithmetic operators, +, -, *, / to add, subtract,
    multiply and divide.


    Parameter – approximately synonymous with ‘argument’. Computer scientists may
    make the distinction between a ‘named parameter’ – which is the name of a variable
    that is declared by the function (in C#, between parentheses after the function
    name) and an ‘argument’ – which is the piece of data passed to the function and
    which is assigned to a matching parameter.


    Return value – the data item returned by a function. In many languages the type
    of the data item must be declared in the function header. For example, in C# you
    might declare a function that returns a string like: string someFunction(). Some
    languages allow functions to return unspecified types. For example, a Ruby function
    declared as someFunction might return a string, an integer, some other data type
    or nothing at all.


    String – a sequence of characters such as “Hello world”. Most programming languages
    delimit strings with single or double quotation marks. C# uses double-quotes.


    Text Adventure – an exploring-style game in which descriptions are given in text
    and commands are entered as words. The classic text adventures do not have graphics
    through some (such as the Magnetic Scrolls games mentioned in the Dave Lebeling
    interview) do show images in addition to text.


    Variable – a named item that can store some piece of data as its value. The value
    of a variable may vary during program execution. Compare with ‘constant’.


    ZIL – Zork Implementation Language: a L-like language that was used by Inforcom
    to program its adventure games.'
