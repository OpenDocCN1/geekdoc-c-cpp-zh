  md: '# Add Adjectives and Conjunctions


    Grammatically my game parser only deals with nouns ("sword", "coin" etc.), verbs
    ("take", "drop" etc.), articles ("a", "an", "the") and prepositions ("in", "into",
    "at\). However, if you look at the definition of the `WT enum` that lists valid
    word types, you''ll see it also contains the CONSTANTS, CONJUNCTION.


    An adjective is a word that describes a noun such as "golden" or "magical". If
    adjectives were added to the vocabulary of the game, the player would be able
    to describe different types of treasure object. Instead of entering "Take the
    ring", if there were several rings in the current room and you wrote "Take the
    ring", the game could reply "Do you mean the golden ring, the silver ring or the
    diamond ring?" You would need to add adjectives to the game vocabulary in `Adventure.parser`,
    add appropriate fields (to distinguish a golden from a diamond ring and so forth)
    to extend the command processing methods in `Adventure.cs` in order to handle
    adjectives.


    If you wanted to add the conjunction "and", the player would be able to chain
    commands such as "Take the sword and put it into the chest". Conjunctions make
    command processing a bit more complicated, as long as you only permit word orders
    (handled by the methods in `Adventure.parser`) you could try to recognize a single
    full command as "Take the sword" then, when the conjunction "and" is found, look
    for another full command such as "Put it into the chest". In this example, we
    already have a method, `ProcessVerbNoun()`, to handle "Take the sword" and another
    method, `ProcessVerbNounPrepositionNoun()` to handle "Put it into the chest".
    The only additional complication would be identifying which "it" refers to. This
    isn''t a hard problem but it''s one you need to bear in mind when using conjunctions.


    # More Prepositions


    You could also add more prepositions such as "with", "onto" and "under". These
    would allow commands such as "Shoot the dragon with the gun", "Put the sword onto
    the table" and "Look under the carpet".


    If you are not sure which words are prepositions, take a look in one of the online
    dictionaries which will list the most common examples. Adding prepositions isn''t
    difficult but you need to be aware that they will often change the relationship
    of one object to another – an object that is *under* the carpet is like an object
    *inside* a closed container: both are "here" but not visible; however, a carpet
    is not a container! An object on another object is like an object in a container:
    multiple objects may be on an'
