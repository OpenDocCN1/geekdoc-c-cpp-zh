    but it was also more illogical. We just got so annoyed with it. By today''s standards
    that puzzle was terrible. But when we wrote it we thought it was pretty good stuff.


    Do you see a day when you''ll say ''That''s it. I''m never doing another game
    in my life?''


    I always say that about two weeks before my game ships. I suspect at some point
    I might conceivably run out of ideas.


    Is it still fun or is it just a job?


    Oh it''s still a lot of fun. If it wasn''t fun it wouldn''t be worth doing.


    # Appendix


    # Online Adventure Games


    There are numerous adventure games that you can download or play online.


    Infocom games can be downloaded, free, from several locations on the Internet
    such as http://www.infocom-if.org.


    My game, The Golden Wombat Of Destiny can be played online or downloaded from:
    https://archive.org/details/TheGoldenWombatOfDestiny.


    Other old adventure games are available from http://www.abandonia.com.


    You may need a DOS emulator such as DOSBox http://www.dosbox.com/ to run some
    of these games.


    # Bitwise Books and Courses


    For our full range of paperback books and eBooks plus free downloads, be sure
    to visit the Bitwise Books web site: http://www.bitwisebooks.com


    For video-based programming tutorials, go to the Bitwise Courses web site: http://www.bitwisecourses.com


