    # 引言


    ![](img/79557530489e53febfe5a6898863b83c_13_0.png)


    作者仅仅凭借他多年来玩过的几款经典 Infocom 冒险游戏！


    # I – 冒险游戏简教程


    房屋之西（West of House）。你站在一栋白色房子西侧的空旷地上，前门封着木板。这里有一个小信箱。


    我对计算机编程的兴趣真正始于此。那是 20 世纪 80 年代初。我用过文字处理器，用过电子表格软件，但都没有激发我的想象力。当我玩 Infocom 的 Zork
    冒险游戏时，我才真正对计算机到底是如何工作的产生好奇。


    ![](img/79557530489e53febfe5a6898863b83c_14_0.png)


    在上面的截图中，我正在 DOSBox 操作系统模拟器（可从 https://www.dosbox.com/ 获取）中运行 Zork 1（Zork 三部曲的第一部分）。我在
    > 提示符后输入了如“read the leaflet”（阅读说明）之类的命令。其余文本由游戏显示。


    # – 冒险游戏简教程


    ## 什么是冒险游戏？


    冒险游戏——特别是文本冒险游戏——发生在由相互连接的地点组成的复杂世界中。世界、地点以及其中包含的所有生物和宝藏都是用文字描述的，而不是图像。有些冒险游戏也提供图形，但该类型的真正经典之作（如
    Zork）完全是文字性的。


    当我第一次玩 Zork 时，令我着迷的是它的世界如此广阔却在内部保持一致。你可以把一盏提灯放进袋子里，然后沿着穿过森林的小径游荡，爬树，开门，并探索构成“大大的地下帝国”的巨大洞穴网络。在探索了几个小时后，你最终会回到房子看到那个袋子。袋子里有那盏灯——正如我离开它时的一样。


    游戏是如何“记得”我几小时前把灯放进袋子的呢，即使我已经忘记了做过那件事？当时我真的完全不知道计算机是如何运作的。在 Zork 中，我收集宝藏，将物体放入容器中，解决谜题，并探索看似广阔的
    Zork 世界。虽然没有图形，但描述非常生动，就像读小说一样，世界变成了一种沉浸式的现实。我甚至可以通过输入英文命令与游戏对话：“Take the sword”（拿剑）、“Light
    the lantern”（点灯）、“Climb the tree”（爬树）、“Put the magic ring into the sack”（把魔戒指放入袋子里）等等。


    ## 交互式小说


    文本冒险有时被称为“交互式小说”或简称“IF”。这强调了这类游戏的叙事 aspects。有些冒险游戏提供长段描述文字，玩家可以输入文本获取更多信息、查看物体并以其他方式与游戏交互。


    我很快被 Zork 吸引，并决定编写一个自己的游戏。在那个年代，没有全球网，没有 Wikipedia，没有 YouTube，没有亚马逊，也没有（我能找到）书籍解释如何做。我必须通过试错来学习。


    # I - 冒险游戏简教程


    ![](img/79557530489e53febfe5a6898863b83c_16_0.png)


    上面的照片显示了《命运之黄金土鼠》（The Golden Wombat Of Destiny）的部分游戏。就像 Zork 一样，玩家可以输入相当复杂的命令，如“Put
    the coin in the kennel!（把硬币放在圈里！）”，游戏会做出相应的响应。


    回顾，对于一个新手程序员来说，通过编写一个那种复杂的游戏来学习编程是非常愚蠢自自的行为。当我开始时，我对编程一无所知。当我写完《黄金土鼠》时，我已经成了一个具有中等经验的程序员，所以当我看到自己在还是新手时期写下的所有丑陋代码（现在已经牢固地焊接在游戏里）时，我感到非常震惊。可以说，这是一个巨大的学习经历！


    编写那个游戏时面临的另一个大局限是，我使用的语言——Pascal 对该项目来说远非理想。面向对象编程（OOP）在当时并不常见，而且 Pascal 完全没有面向对象的特征。Turbo
    Pascal 的现代版本（Object Pascal 和 Delphi）拥有 OOP。许多其他主流语言如 Ruby、Python、Java 和 C# 也有。面向对象非常适合编写冒险游戏，因为房间和纹理自然地被表示为对象。


    今天，我仍然认为编写冒险游戏是提高编程技能的一种极佳方式。与现代快速动作图形游戏不同，文本冒险游戏可以由单个程序员从头到尾编写，而不需要使用复杂的第三方“游戏框架”。在编写冒险游戏的过程中，你需要使用非常广泛的编程技术——创建层次结构、将对象序列化（保存）到磁盘、处理错误处理，甚至将用户输入解析为有意义的人类语言命令。


    当我写我的第一个游戏时，我必须自己想办法完成一切。现在你有这本书来引导你。我将解释关于编写冒险游戏你需要的一切知识，从你的第一个简单“房间”到一个包含众多宝藏的巨大连接房间地图复杂游戏。我大部分时间将使用
    C# 语言，附录也提供了一些将 C# 翻译到其他语言的帮助。所有的源代码（C# 和其他语言）都可以免费下载。我相信这本书是编写文本冒险游戏最全面的指南。我希望你玩得开心！


    ## 冒险游戏简史


    虽然无法知道是谁写了第一款冒险游戏，但第一个引起计算机用户兴趣的作品几乎无疑是 Will Crowther 的《Colossal Cave》（巨型洞穴），它有时被称为“原始冒险”。除了编程外，Crowther
    还是一个洞穴爱好者，这解释了为什么他的冒险游戏发生在一个巨大的洞穴系统中。《Colossal Cave》开发于 1975 年到 1977 年之间，并在另一位程序员
    Don Woods 的帮助下完成。他们的游戏是用 FORTRAN 写的，运行在 PDP-10 主机计算机上。


    ![](img/79557530489e53febfe5a6898863b83c_17_0.png)


    冒险游戏演变的下一个大步随着 Zork 的发布而来的。这个游戏对 Colossal Cave 有巨大的借鉴，包括构成了 Zork 世界大部分部分的地下网络。Zork
    是由 Dave Lebling 领导的 MIT 程序员团队开发的。


    关于 Zork 的更多信息，请务必阅读附录中我对 Dave Lebling 的采访。


    # I — 冒险游戏简教程


    Zork 最初是用 MDL 编程语言编写的，同样是在 PDP-10 上。MDL 是一种基于 LISP 列表处理的语言。后来游戏重写了几次，最著名的实现是用
    ZIL（Zork 实现语言）编写的，这是另一种专为编写游戏而开发的类 LISP 语言。当 Infocom 游戏于 1979 年成立时，Zork 最终发布了一个可以在个人计算机上运行的版本。


    Infocom 以《星交叉》、《银河系漫游》和《三位》等作品统治了冒险游戏领域。Infocom 对早期 Colossal Cave 游戏做的改进之一是更好的“解析器”，以解释简单的人类语言命令。Colossal
    Cave 限于两个单词命令，如“Take sword”。Infocom 游戏允许更长的命令，如“Put the Elvish sword into the
    sack”。


    ## 编程概念和术语


    我不会在书中详细解释编程术语。我还有其他从零开始教编程的书。例如，《C# 小书》提供了 C# 编程的逐步引导指南。本书的附录提供了一些常用编程术语的简短定义。


    ## 冒险开始 ...


    好了，现在你有了对冒险游戏的背景了解，是时候开始编程了。在玩家探索游戏之前，我们需要创建一个游戏“世界”。我们的世界以链接连接地点的形式存在。我们需要做的第一件事是创建一些地点并将它们放在地图上……


