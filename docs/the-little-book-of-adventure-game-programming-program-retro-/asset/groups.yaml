  - '[PAGE 15]


    # – A Short Guide to Adventure Games


    # What is an Adventure Game?


    An adventure game – specifically a text adventure game – takes place in a complex
    world of connected locations. The world, the locations and all the creatures and
    treasures it contains are described with words, not images. Some adventure games
    also provided graphics but the real classics of the genre, such as Zork, were
    all about words.


    The thing that fascinated me about Zork when I first played it was how its world
    was so vast yet internally consistent. You could put a lantern into a sack and
    then go wandering along paths through forests, climb trees, open doors and explore
    a gigantic cave network that made the Great Underground Empire. After hours of
    exploring you would eventually come back to the house and see the sack. Inside
    the sack and there was the lantern – just as I''d left it.


    How did the game ‘remember’ that I’d put the lantern into the sack, several hours
    earlier, even though I had forgotten that I’d done so? I really had no idea how
    computers worked at time. In Zork, I collect treasures, put objects inside containers,
    solve puzzles and explore the seemingly vast world of Zork. There were no graphics
    but the descriptions were so vivid as that, just when reading a novel, the world
    took on an immersive reality. I could even talk to the game by entering English
    commands: “Take the sword”, “Light the lantern”, “Climb the tree”, “Put the magic
    ring into the sack,” and so on.


    # Interactive Fiction


    Text adventures are sometimes called ‘interactive fiction’ or ‘IF’ for short.
    This emphasises the story-telling aspect of this type of game. Some adventure
    games provide long descriptive passages and the player can enter text to ask for
    more information, look at objects and interact with the game in other ways.


    I became so intrigued by Zork that I soon decided to program a game of my own.
    Back in those days there was no worldwide web, no Wikipedia, no YouTube, no Amazon
    and no books (that I could find) which explained how to do it. I had to learn
    by trial and error.


