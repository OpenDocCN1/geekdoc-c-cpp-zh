    # 3 – Move Around the Map


    # 3 – Move Around the Map


    It''s no good having a complicated network of locations in your game if the player
    can''t move from one location to another.

    We''ll look at how to do that in this chapter.


    In the game04 project, I''ve designed a simple user interface with buttons, N,
    S, W and E, which the user can click in order to move in the four compass directions.
    The Visual Studio Events panel, seen on the left, lets me browse the click ''event-handler''
    methods for these buttons. Here, for example, I can see that the method called
    s8tn_Click() will run when the user clicks the S button.


    ![](img/79557530489e53febfe5a6898863b83c_28_0.png)


    There are a few other changes I''ve made too. First of all, I''ve changed the
    ''scope'' of the Room variables. In previous projects they were declared inside
    the button1_click() event-handler method which runs when the user clicks button.


    The trouble is that variables inside a method are ''local'' to that method. Once
    the function stops running, the rooms all disappear! That''s no good for my game.
    So in game04 I declared the Room variables outside the function so they have ''global''
    scope (actually, they are scoped inside Form1) and so they will continue to exist
    throughout the game. I have also slightly changed the Room class by adding a new
    string field, description, which provides a description of the room when necessary.'
