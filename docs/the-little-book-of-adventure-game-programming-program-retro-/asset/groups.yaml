    of what we put out – we have sci-fi, fantasy, mystery and romance – when you do
    a new thing you aim it at one of those points. You have an audience in mind. You
    want to satisfy those fans. The avid fans are always calling for more difficult
    puzzles. They complain if it only took two weeks to finish and such a game. On
    the other hand, you don''t want to make them inaccessible to people who haven''t
    got much experience at playing games.


    When you''re stuck for ideas where do you go? Do you go to a library to ransack
    books, do you play other games or do you just ask one another?


    ![](img/79557530489e53febfe5a6898863b83c_122_0.png)


    All of those things. For his current game, Steve Meretzky has been collecting
    books of logic puzzles. In general we all get ideas from books. I have a very
    large library. Lurking Horror [a game written by Lebling] was quite obviously
    the result of reading too much H.P. Lovecraft.


    These days you''re putting on-screen hints for people who get stuck. Will these
    appear in all future releases?


    At the moment, that''s our plan. We''ve had reaction to it. Some people love the
    idea, some people hate it. We may even go so far as to put on-line maps later.
    That''s still under consideration. We tried the idea with Beyond Zork. But Beyond
    Zork shows you a fairly small section of the total map. It would be nice if you
    could see a bit more of it.


    121'
  - '[PAGE 123]


    # Appendix


    I read a little while ago that you get problems from Christian fundamentalists
    who object to your stories?


    ![](img/79557530489e53febfe5a6898863b83c_123_0.png)


    It''s really a pretty minor problem problem. There is a certain antipathy on the
    part of a certain class of religious fundamentalists to any reference to magic.
    Most of our fantasy games have magic in them the thing that caused the greatest
    number of complaints was we ran an ad'' for Spellbreaker which showed a picture
    of a wizard.


    We ran it in Boy''s Life magazine which is the magazine of the Boy Scouts. Boy
    Scouting in America is very strong amongst the same class of people who are likely
    to be religious fundamentalists. So parents saw this ad and got annoyed.


    I must say we got more letters than we ever got about sex. We did a few complaints
    about The Leather Goddesses of Phobos, but not as many as we''d feared. I think
    Leather Goddesses was sufficiently obviously packaged that most people who bought
    it were not surprised. It didn''t speak up on them.


    # Leather Goddesses Of Phobos


    This was a 1986 comedy ''sex adventure'' game written by Steve Meretzky. It allowed
    the player to select a naughtiness level ranging between ''tame'' and ''lewd''.


    Got some other complaints too, didn''t you - about your newsletter, The New York
    Times. I gather you were obliged to change its name.


    It depends on what you mean by ''obliged''. We periodically got letters from lawyers
    of The New York Times complaining about the title of our newsletter.


    And these complaints were in all seriousness?


    Oh, they were quite serious. But we ignored them. Finally, about the same time
    we were merging with Activision, and their lawyers and our lawyers were poring
    over everything that might be a potential drawback or holdup to the merger, we
    got a potentially nasty complaint. Instead of saying ''We object to your use of
    our trademark'', they said ''Stop using our trademark or we''ll see you in court''.'
  - '[PAGE 124]


    # Appendix


    I find it almost incomprehensible that they could really be serious. What were
    they afraid of – that people were mistakenly going out to buy New Zork Times instead
    of the New York Times?


    I don''t know. My understanding from talking to the legal people at Activision
    is that the real problem is if you own a trade mark you are obliged to defend
    that trademark against infringement, otherwise your trademark can become a generic
    term as happened with Kleenex.


    Maybe the newspaper''s lawyers were just in a bad mood because they hadn''t managed
    to solve the latest Infocom game?


    Hmm, now that may be a possibility...


    How about you? Do you get around to playing the games written by all the other
    Infocom programmers?


    Not as much as I''d like. But I try to play as many as I can.


    Does the experience of writing so many games help you solve the other people''s
    games?


    No, it really doesn''t, actually. Because different authors have a different style.
    The fact that I''ve written so many games doesn''t help when I play Steve Meretzkky''s
    games because his style is so different. And Brian Moriarty''s is even more different.
    On the other hand, we play them on a version of our interpreter that allows you
    to escape into debugging, so I can always cheat.


    # Steve Meretzky and Brian Moriarty


    Steve Meretzky wrote a number of hugely successful Infocom games including Planetfall,
    The Hitchhiker''s Guide To The Galaxy, Leather Goddesses of Phobos and A Mind
    Forever Voyager. Meretzky games were often characterised by their humour. Brian
    Moriarty wrote games including Wishbringer and Beyond Zork. He also wrote one
    of my personal favourites, Trinity – a very weird, somewhat surreal, game that
    takes the player from London''s Kensington Gardens to the Trinity nuclear test
    site.


    ![](img/79557530489e53febfe5a6898863b83c_124_0.png)


    123'
  - '[PAGE 125]


    # Appendix


    Have you got a favourite game?


    My favourite game of the ones I have written Enchanter. Then after that I guess
    Spellbreaker and The Lurking Horror. Though maybe Zork II. Zork II was really
    our first game that really had anything remotely resembling a story in it. It''s
    hard to say. Of everyone else''s games I''ve always had a fondness for Planetfall.
    I like all my games but I always see the flaws in them.


    How similar is the Zork Trilogy to the original Zork?


    It''s quite similar in all that the puzzles in the original Zork are also in the
    Trilogy with the exception of two. What''s different is that the original Zork
    had one fairly compact, connected geography. In the Trilogy what happened was
    that I went in and choked out the middle of that geography and it became Zork
    I. Then I made a new middle and added some of the periphery of the mainframe game
    to make Zork II. And then the remaining puzzles became Zork III. All the puzzles
    are there and the vast majority of the rooms too, but they''ve all been rearranged.


    I have to tell you one of the things that had me puzzled about Zork II was all
    the references to baseball which I didn''t understand at all.


    Yes, since we''ve gotten more contacts from fans beyond the United States – Germany,
    Britain, Australia and so forth – it becomes more and clear that references to
    things like baseball are not universally appreciated. It didn''t even occur to
    us that the games would have been distributed as widely as they are.


    Which do you think is the most difficult Infocom game?


    Spellbreaker. It was designed and written as a gift to rabid fans. It''s the third
    game in a trilogy and it''s intentionally more difficult because I was getting
    sick and tired of people writing to saying the games were too easy. I thought,
    right, you''ve asked for it. Some of the easiest puzzles for some people can be
    insoluble and vice versa.


    Do you get feedback from other people giving alternative solutions to puzzles
    you never thought of?


    Sometimes. Occasionally, people just alert us to things we hadn''t thought about.
    Like, it used to be that inflatable boat in Zork I could be used to carry every
    object in the game once you deflated it. But the classic case of getting a new
    solution to a puzzle was when we were writing mainframe Zork. We had just implemented
    the clockwork canary'
