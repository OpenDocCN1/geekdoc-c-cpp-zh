    \        if (s == \"\") {\n            if (t.Movable) {\n                s = \"\
    ${obname} moves slightly when you pull it.\";\n            } else {\n        \
    \        s = \"You try to pull the {obname} but nothing happens.\";\n        \
    \    }\n        }\n    }\n    return s;\n}\n```\n\nIn some cases, you may want\
    \ to have special actions for specific objects. For example, when you pull most\
