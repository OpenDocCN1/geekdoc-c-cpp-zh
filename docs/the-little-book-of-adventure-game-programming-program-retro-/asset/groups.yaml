    # 4 – Rooms in a Dictionary\n\nUp to now I've used an array to store the map of\
    \ my rooms. An array is a fixed length list of elements. Now let's look at another\
    \ type of list called a dictionary.\n\nThe array which I've been using for my\
    \ map finds me a room at a numerical index. For example, I could find the room\
    \ at index 2 in an array called map by placing the index between square array\
    \ name map[2].\n\nMany languages such as C#, Java, Ruby (and many others) also\
