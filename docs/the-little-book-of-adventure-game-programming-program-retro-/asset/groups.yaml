  - "[PAGE 104]\n\n# # Writing Adventure Games in Other Languages\n\nWhile I've used\
    \ the C# language to write the games described in this book, my approach to writing\
    \ text adventures can be adapted to pretty much any mainstream language. In fact,\
    \ at various times, I've written games (some quite small, others more complex)\
    \ in Ruby, Java, ActionScript, Objective-C, Pascal, Object Pascal and Smalltalk.\
    \ I'll give you some advice on how to write a game in any programming language.\n\
    \n# ## Download The Code\n\nBe sure to download the source code archive for this\
    \ book (available from http://www.bitwisebooks.com) which includes sample code\
    \ in several programming languages.\n\n# ## First, Plan your Rooms\n\nBefore you\
    \ do anything else, you need to create the 'world' of your game. The world will\
    \ take the form of Rooms stored in a map. The map will probably be a list of some\
    \ sort – anything from an array to a dictionary. So begin by defining the class\
    \ for a Room.\n\n# ## Ruby Example\n\nThis is an example of a simple Room written\
    \ in Ruby (but you could take a similar approach in other programming languages):\n\
    \n```\nclass Room\n  accessor(:n, :s, :w, :e)\n\n  def initialize(aName, aDescription,\
    \ dirN, dirS, dirW, dirE)\n    @name = aName\n    @description = aDescription\n\
    \    @n = dirN\n    @s = dirS\n    @w = dirW\n    @e = dirE\n  end\nend\n```"
  - "[PAGE 105]\n\n# Appendix\n\nHere attr_accessor creates attributes (the Ruby equivalent\
    \ of C# properties) for variables, n, w and e. The initialize() method, which\
    \ is called after a new Room object is created, accepts arguments to assign values\
    \ to the name, description and direction variables. You might then decide to create\
    \ a class hierarchy, as I did in my C# project, so that Room is a type of ThingHolder\
    \ (it contains lists of treasure objects) and ThingHolder is a type of Thing.\
    \ These are my Ruby classes:\n\n```\nclass Thing\nattr_accessor(:name, :description)\n\
    \ndef initialize(aName, aDescription)\n  @name = aName\n  @description = aDescription\n\
    end\nclass ThingHolder < Thing\nattr_accessor(:aName, aDescription, someThings)\n\
