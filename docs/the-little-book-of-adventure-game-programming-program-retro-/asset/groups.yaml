    # Dave Lebling Interview


    Dave Lebling was a founder of Infocom, which created games ranging from the famous
    Zork trilogy to an adaptation of Douglas Adams''s The Hitchhiker''s Guide To The
    Galaxy. In 1988 I interviewed Lebling. You can read that interview here.


    ![](img/79557530489e53febfe5a6898863b83c_116_0.png)


    We didn''t know it at the time, but the late ''80s was the beginning of the end
    of the ''golden age'' of adventure games. At that time, neither Lebling nor I
    had any real idea of how the games industry would develop over the next thirty
    years or so. Zork, and other text-based Infocom games, worked fine on a PC with
    just 512K of memory. Today, in order to play a modern, fast-action game you may
    need a PC whose card alone boasts 6 Gigabytes (or more) of memory in addition
    to the 16 Gigabytes of the PC''s system memory. In 1988, mere megabytes of memory
    seemed like a futuristic dream. The idea that anyone would ever have gigabytes
    on their graphics card would have seemed ridiculous. This interview originally
    appeared in the UK edition of Computer Shopper magazine #7 (September 1988). My
    questions are shown in italic. Dave Lebling''s replies are printed in a standard
    font.


    # Appendix


    When you first wrote the mainframe version of Zork did it occur to you that you
    might be able to make some money out of it?


    Oh no. We had written Zork kind of a lark back in 1976/7. There was quite a history
    of that sort of thing at MIT - lots of people did that kind of ''midnight programming
    projects'' - you know, the kind of thing you didn''t do during normal working
    hours. There were a lot of what would now be called video games and a lot of trivia
    games - lots of things to keep you entertained. And Zork was just one more ...


    So you are saying that you and Marc Blank just managed to jot it off in your free
    time when you were still students?


    No, not exactly. There were four of us involved. Some of us were students. Some
    of us were not. I was a staff member, a researcher. Marc Blank was a student,
    Tim Anderson was a graduate student and Bruce Daniels was a graduate student -
    they were the other three authors of the mainframe Zork.


    ![](img/79557530489e53febfe5a6898863b83c_117_0.png)


    # The Zork Team


    Marc Blank, Tim Anderson, Bruce Daniels and Dave Lebling were members of the MIT
    Dynamic Modelling Group. They all contributed to the programming of Zork.


    What language was Zork written in originally?


    It was written in a language called Muddle (MDL) – an ‘AI’ language developed
    at MIT. It’s like LISP – it’s a recursive structure-oriented, user-extensible
    language. People who know LISP can look at Muddle and sort of figure out what
    they’re doing.


    If it’s so similar to LISP, why didn’t you just use LISP?


    Because Muddle was the language that our research group used. When we moved to
    Infocom we wrote another language especially for implementing Zork – that was
    ZIL – very much like Muddle itself but adapted specially to deal with adventure
    games.


    What’s the difference between ZIL and a more standard version of LISP such as
    Common LISP?


    The most obvious difference is that instead of having parentheses it has angle
    brackets. That’s the first thing that would strike a LISP user as being strange.
    Another that, ZIL has in it operations for the kind of things that are useful
    in adventure games – moving one object from one place to another and very quickly
    checking to see if an object has a particular property. But there’s nothing in
    it that couldn’t easily be implemented in a good LISP system.


