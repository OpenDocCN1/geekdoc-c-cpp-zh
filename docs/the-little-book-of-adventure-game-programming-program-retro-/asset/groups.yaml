- md: "\n# Writing Adventure Games in Other Languages\n\nWhile I've used the C# language\
    \ to write the games described in this book, my approach to writing text adventures\
    \ can be adapted to pretty much any mainstream language. In fact, at various times,\
    \ I've written games (some quite small, others more complex) in Ruby, Java, ActionScript,\
    \ Objective-C, Pascal, Object Pascal and Smalltalk. I'll give you some advice\
    \ on how to write a game in any programming language.\n\n## Download The Code\n\
    \nBe sure to download the source code archive for this book (available from http://www.bitwisebooks.com)\
    \ which includes sample code in several programming languages.\n\n## First, Plan\
    \ your Rooms\n\nBefore you do anything else, you need to create the 'world' of\
    \ your game. The world will take the form of Rooms stored in a map. The map will\
    \ probably be a list of some sort – anything from an array to a dictionary. So\
    \ begin by defining the class for a Room.\n\n## Ruby Example\n\nThis is an example\
    \ of a simple Room written in Ruby (but you could take a similar approach in other\
    \ programming languages):\n\n```\nclass Room\n  accessor(:n, :s, :w, :e)\n\n \
    \ def initialize(aName, aDescription, dirN, dirS, dirW, dirE)\n    @name = aName\n\
    \    @description = aDescription\n    @n = dirN\n    @s = dirS\n    @w = dirW\n\
    \    @e = dirE\n  end\nend\n```\n\nAppendix\n\nHere attr_accessor creates attributes\
    \ (the Ruby equivalent of C# properties) for variables, n, w and e. The initialize()\
    \ method, which is called after a new Room object is created, accepts arguments\
    \ to assign values to the name, description and direction variables. You might\
    \ then decide to create a class hierarchy, as I did in my C# project, so that\
    \ Room is a type of ThingHolder (it contains lists of treasure objects) and ThingHolder\
    \ is a type of Thing. These are my Ruby classes:\n\n```\nclass Thing\nattr_accessor(:name,\
    \ :description)\n\ndef initialize(aName, aDescription)\n  @name = aName\n  @description\
    \ = aDescription\nend\nclass ThingHolder < Thing\nattr_accessor(:aName, aDescription,\
    \ someThings)\n\ndef initialize(aName, aDescription, someThings)\n  super(aName,\
    \ aDescription)\n  @things = someThings\nend\n#:arg: aThing => Thing\ndef addThing(aThing)\n\
    \  @things << aThing\nend\n#:arg: someThings => Array\ndef addThings(someThings)\n\
    \  @things.concat(someThings)\nend\n# find is a method of the Enumerable module\
    \ which is\n# mixed into the Array class\ndef objInThings(aName)\n  @things.find\
    \ {\n    |t|\n    t.name == aName\n  }\nend\n#:arg: aThing => Thing\n#:arg: someThings\
    \ => Array\ndef takeThingFrom(aThing, someThings)\n  addThing(someThings.delete(aThing))\n\
    end\n```\n\n## Ruby example (continued)\n\n```\nclass Room < ThingHolder\n  attr_accessor(:n,\
    \ :s, :w, :e)\n\n  def initialize(aName, aDescription, someThings, dirN, dirW,\
    \ dirE)\n    super(aName, aDescription, someThings)\n    @n = dirN\n    @s = dirS\n\
    \    @w = dirW\n    @e = dirE\n  end\nend\n```\n\nRooms will be stored in a map,\
    \ which is a list of rooms. You have a choice of list types which will vary depending\
    \ on the language you are using. In my Ruby example, I simply add Rooms to an\
    \ array, someRooms:\n\n```\nsomeRooms = [\n  Room.new(\"Treasure Room\", \"a fabulous\
    \ golden chamber\", r1obs, -1, 2, -1, 1),\n  Room.new(\"Dragon's Lair\", \"a huge\
    \ and glittering lair\", [], -1, -1, 0, -1),\n  Room.new(\"Troll Cave\", \"a dank\
    \ and gloomy cave\", [], -1, 0, -1, 3),\n  Room.new(\"Crystal Dome\", \"a vast\
    \ dome of glass\", [], -1, -1, 2, -1)\n]\n```\n\nAppendix\n\n## Java Example\n\
    \nIn Java, you might create a Room class like this: \n\n```\npublic class Room\
    \ extends ThingHolder implements java.io.Serializable {\n    private int n, s,\
    \ w, e;\n\n    public Room(String aName, int aS, int aW, int aE, List tl) {\n\
    \        super(aName, aDescription, tl); // init superclass\n        this.n =\
    \ aN;\n        this.s = aS;\n        this.w = aW;\n        this.e = aE;\n    }\n\
    \n    public int getN() {\n        return n;\n    }\n\n    public void setN(int\
    \ aN) {\n        this.n = aN;\n    }\n\n    public int getS() {\n        return\
    \ s;\n    }\n\n    public void setS(int aS) {\n        this.s = aS;\n    }\n\n\
    \    public int getE() {\n        return e;\n    }\n\n    public void setE(int\
    \ aE) {\n        this.e = aE;\n    }\n\n    public int getW() {\n        return\
    \ w;\n    }\n\n    void setW(int aW) {\n        this.w = aW;\n    }\n```\n\n##\
    \ Java example (continued)\n\n```\npublic String describe() {\n    return String.format(\"\
    %s. %s.\\n\",\n        getName(), getDescription())\n        + \"Things: \" +\
    \ getThings().describe());\n}\n```\n\nNote that once again, the Room class descends\
    \ from ThingHolder (I won't put all Java code here – you can download it if you'd\
    \ like to see it, or better set yourself the task of writing the other classes).\
    \ Notice that Room implements java.io.Serializable which will be needed when you\
    \ save and load the game.\n\n## Now Add Player\n\nThe player sees the game from\
    \ the viewpoint of an object that can move around the map (and, later on, interact\
    \ with objects). You must define a class to represent the player. I've called\
    \ that class Actor. Once again, class descends from ThingHolder because the player\
    \ maintains a list of objects (the inventory). Here is my Actor class in Ruby:\n\
    \n```\nclass Actor < ThingHolder\n  attr_accessor(:position)\n\n  def initialize(aName,\
    \ aDescription, someThings, aPosition)\n    super(aName, aDescription, someThings)\n\
    \    @position = aPosition\n  end\nend\n```\n\nThis is the Actor class in Java:\n\
    \n```\npublic class Actor extends ThingHolder implements java.io.Serializable\
    \ {\n    private Room room; // the Room where player is\n\n    public Actor(String\
    \ aName, String aDescription, List tl, Room aRoom) {\n        super(aName, aDescription,\
    \ tl); // init super class\n        this.room = aRoom;\n    }\n\n    public void\
    \ setRoom(Room aRoom) {\n        this.room = aRoom;\n    }\n\n    public Room\
    \ getRoom() {\n        return this.room;\n    }\n}\n```\n\n## Now Add Treasures\n\
    \nAdd treasures for the player to take and drop. These can simply be instances\
    \ of Thing or ThingHolder classes depending on whether they are containers (such\
    \ as sacks and treasure chests). Or could create a special Treasure class if you\
    \ need additional properties such as value, effect and on.\n\n## Save and Restore\
    \ the Game\n\nNeed to have some way of storing the 'game state' to disk and restoring\
    \ it later on. The game state includes the player's position (the 'current room'),\
    \ treasures in the player's inventory and also in the rooms – plus any changes\
    \ have been made to rooms and objects (if doors have been opened, their 'open'\
    \ state needs to be saved; so on).\n\nMany object oriented languages implement\
    \ 'serialization' which semi-automatically saves the data defining a whole network\
    \ of objects and on serializing data, the objects can be simply recreated. Chapter\
    \ 8 of this book explains serialization in C#.\n\nIn Java, classes to be serialized\
    \ must implement java.io.Serializable as in the code examples earlier. This is\
    \ how I save and load my game in Java (output is a text area in which I display\
    \ messages):\n\n```\nprivate void saveGame() {\n    try {\n        FileOutputStream\
    \ fos = new FileOutputStream(\"Adv.sav\");\n        ObjectOutputStream oos = new\
    \ ObjectOutputStream(fos);\n        oos.writeObject(game);\n        oos.flush();\
    \ // write out any bytes\n        oos.close();\n        outputTA.append(\"Game\
    \ saved\\n\");\n    } catch (Exception e) {\n        outputTA.append(\"Serialization\
    \ Error: \" + e.getMessage() + \"\\n\");\n        outputTA.append(e.getClass()\
    \ + \": \" + e.getMessage() + \"\\n\");\n    }\n}\n```\n\n```\nprivate void loadGame()\
    \ {\n  try {\n    FileInputStream fis = new FileInputStream(\"Adv.sav\");\n  \
    \  ObjectInputStream ois = new ObjectInputStream(fis);\n    game = (Game) ois.readObject();\n\
    \    ois.close();\n    outputTA.append(\"\\n---Game loaded--\\n\");\n  } catch\
    \ (Exception e) {\n    outputTA.append(\"Serialization Error! Can't load data.\\\
    n\");\n    outputTA.append(e.getClass() + \" : \" + e.getMessage() + \"\\n\");\n\
    \  }\n}\n```\n\nIn Ruby, I can save data in various ways – for example using the\
    \ YAML format or using Marshal. This is the Marshal version which saves a map\
    \ and all the rooms and objects they contain (remember that more code examples\
    \ are available in the downloadable archive):\n\n```\nFile.open(\"game.sav\",\
    \ \"w\") { |f|\n  Marshal.dump(ymap, f)\n}\n\nymap = Map.new([]) # empty map after\
    \ saving\nputs(\"Game saved. before reloading...\")\nFile.open(\"game.sav\") {\
    \ |f|\n  ymap = Marshal.load(f)\n}\n```\n\nIf the language you are using can serialize\
    \ objects, use that capability. If not, you may need to do some more work. You\
    \ could simply write into a text file, describing each object, with one piece\
    \ of data per line. For example the data for a Room called \"Troll Room\" with\
    \ N, S, W and E exists to Rooms 1, 2, 3 and 4 might be written to a text file\
    \ like this:\n\n# Troll Room\n\n- 1\n- 2\n- 3\n- 4\n\nTo be a bit more ambitious,\
    \ you could even implement your own serialization routines. One way of doing that\
    \ would be to give each object a serializing method which writes the class name,\
    \ then the size of the data (in bytes) followed by actual of each field.\n"
  mdcn: "\n\n# 用其他语言编写冒险游戏\n\n虽然我使用 C# 语言编写了书中描述的游戏，但我编写文本冒险游戏的方法几乎可以适用于任何主流编程语言。事实上，在不同的时期，我曾用\
    \ Ruby、Java、ActionScript、Objective-C、Pascal、Object Pascal 和 Smalltalk 编写过游戏（有些非常小，另一些则复杂）。我将就如何用任何编程语言编写游戏向你提供一些建议。\n\
    \n## 下载代码\n\n请务必下载本书的源代码压缩包（可从 http://www.bitwisebooks.com (bitwisebooks.com 获取），其中包含了多种编程语言的示例代码。\n\
    \n## 首先，规划你的房间\n\n在进行任何其他操作之前，你需要创建你游戏的“世界”。这个世界将以存储在地图（map）中的房间（Rooms）的形式存在。地图很可能是某种列表——从数组到字典的任何形式。因此，从定义\
    \ Room 类开始吧。\n\n## Ruby 示例\n\n这是一个用 Ruby 编写的简单 Room 示例（但你可以在其他编程语言中采用类似的方法）：\n\
    \n```\nclass Room\n  accessor(:n, :s, :w, :e)\n\n  def initialize(aName, aDescription,\
    \ dirN, dirS, dirW, dirE)\n    @name = aName\n    @description = aDescription\n\
    \    @n = dirN\n    @s = dirS\n    @w = dirW\n    @e = dirE\n  end\nend\n```\n\
    \n附录\n\n在这里 `attr_accessor` 为变量 `n`、`w` 和 `e` 创建了属性（Ruby 中相当于 C# 的属性）。initialize()`\
    \ 方法在创建新的 Room 对象后被调用，接受参数以为 `name`、`description` 和方向变量赋值。然后你可能决定创建一个类层次结构，就像我在\
    \ C# 项目中做的那样，使得 `Room` 是 `ThingHolder` 的类型（它包含物品对象的列表），而 `ThingHolder` 是 `Thing`\
    \ 的类型。这些是我的 Ruby 类：\n\n```\nclass Thing\nattr_accessor(:name, :description)\n\n\
    def initialize(aName, aDescription)\n  @name = aName\n  @description = aDescription\n\
    end\nclass ThingHolder < Thing\nattr_accessor(:aName, aDescription, someThings)\n\
    \ndef initialize(aName, aDescription, someThings)\n  super(aName, aDescription)\n\
    \  @things = someThings\nend\n#:arg: aThing => Thing\ndef addThing(aThing)\n \
    \ @things << aThing\nend\n#:arg: someThings => Array\ndef addThings(someThings)\n\
    \  @things.concat(someThings)\nend\n# find 是 Enumerable 模块的一个方法，\n# 它被混入了 Array\
    \ 类\ndef objInThings(aName)\n  @things.find {\n    |t|\n    t.name == aName\n\
    \  }\nend\n#:arg: aThing => Thing\n#:arg: someThings => Array\ndef takeThingFrom(aThing,\
    \ someThings)\n  addThing(someThings.delete(aThing))\nend\n```\n\n## Ruby 示例（继续）\n\
    \n```\nclass Room < ThingHolder\n  attr_accessor(:n, :s, :w, :e)\n\n  def initialize(aName,\
    \ aDescription, someThings, dirN, dirW, dirE)\n    super(aName, aDescription,\
    \ someThings)\n    @n = dirN\n    @s = dirS\n    @w = dirW\n    @e = dirE\n  end\n\
    end\n```\n\n房间将存储在地图中，地图是一个房间列表。你可以选择不同的列表类型，这取决于你正在使用的语言。在我的 Ruby 示例中，我简单地将 Room\
    \ 添加到一个数组 `someRooms` 中：\n\n```\nsomeRooms = [\n  Room.new(\"Treasure Room\",\
    \ \"a fabulous golden chamber\", r1obs, -1, 2, -1, 1),\n  Room.new(\"Dragon's\
    \ Lair\", \"a huge and glittering lair\", [], -1, -1, 0, -1),\n  Room.new(\"Troll\
    \ Cave\", \"a dank and gloomy cave\", [], -1, 0, -1, 3),\n  Room.new(\"Crystal\
    \ Dome\", \"a vast dome of glass\", [], -1, -1, 2, -1)\n]\n```\n\n附录\n\n## Java\
    \ 示例\n\n在 Java 中，你可能会这样创建一个 Room 类： \n\n```\npublic class Room extends ThingHolder\
    \ implements java.io.Serializable {\n    private int n, s, w, e;\n\n    public\
    \ Room(String aName, int aS, int aW, int aE, List tl) {\n        super(aName,\
    \ aDescription, tl); // 初始化父类\n        this.n = aN;\n        this.s = aS;\n  \
    \      this.w = aW;\n        this.e = aE;\n    }\n\n    public int getN() {\n\
    \        return n;\n    }\n\n    public void setN(int aN) {\n        this.n =\
    \ aN;\n    }\n\n    public int getS() {\n        return s;\n    }\n\n    public\
    \ void setS(int aS) {\n        this.s = aS;\n    }\n\n    public int getE() {\n\
    \        return e;\n    }\n\n    public void setE(int aE) {\n        this.e =\
    \ aE;\n    }\n\n    public int getW() {\n        return w;\n    }\n\n    void\
    \ setW(int aW) {\n        this.w = aW;\n    }\n```\n\n## Java 示例（继续）\n\n```\n\
    public String describe() {\n    return String.format(\"%s\\n\",\n        getName(),\
    \ getDescription())\n        + \"Things: \" + getThings());\n}\n```\n\n注意：许多面向对象的语言都支持序列化（serialization），这可以让你保存并加载游戏状态。在\
    \ Java 中，需要序列化的类必须实现 `java.io.Serializable`。\n\n在 Java 中，你可能会这样保存游戏：\n\n```java\n\
    private void saveGame() {\n    try {\n        FileOutputStream fos = new FileOutputStream(\"\
    game.sav\");\n        ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
    \        oos.writeObject(game);\n        oos.flush();\n        oos.close();\n\
    \        outputTA.append(\"Game saved\");\n    } catch (Exception e) {\n     \
    \   outputTA.append(\"Serialization Error: \" + e.getMessage());\n    }\n}\n```\n\
    \n```java\nprivate void loadGame() {\n  try {\n    FileInputStream fis = new FileInputStream(\"\
    game.sav\");\n    ObjectInputStream ois = new ObjectInputStream(fis);\n    game\
    \ = (Game) ois.readObject();\n    ois.close();\n    outputTA.append(\"\\n---Game\
    \ loaded--\\n\");\n  } catch (Exception e) {\n    outputTA.append(\"Serialization\
    \ Error! Can't load data.\\n\");\n    outputTA.append(e.getClass() + \" : \" +\
    \ e.getMessage() + \"\\n\");\n  }\n}\n```\n\n在 Ruby 中，我可以使用各种方式保存数据——例如使用 YAML\
    \ 格式或 Marshal。这是使用 Marshal 的示例：\n\n```ruby\nFile.open(\"game.sav\", \"w\") do\
    \ |f|\n  Marshal.dump(ymap, f)\nend\n\nymap = Map.new([]) # 保存后的空地图\nputs(\"Game\
    \ saved. before reloading...\")\nFile.open(\"game.sav\") do |f|\n  ymap = Marshal.load(f)\n\
    end\n```\n\n"
