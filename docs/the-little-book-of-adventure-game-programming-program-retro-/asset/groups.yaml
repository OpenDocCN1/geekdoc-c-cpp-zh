- md: "\n## 10 – Putting Objects into Containers\n\nIf your game has treasure chests,\
    \ sacks, cupboards and boxes, the player should be able to put things into them.\
    \ In this chapter, we'll find out how to program that.\n\nIn previous versions\
    \ of my game, treasure objects could only exist either in a room or in the player's\
    \ inventory. When an object was taken it was added to the inventory; when it was\
    \ dropped it was added to the list of objects in the current room. But maybe you\
    \ want your game to have objects such as treasure chests, bags, sacks or cupboards.\
    \ All of those objects should be able to contain other objects. That means that\
    \ we need some way of putting one object into another object. But we also want\
    \ to make sure that only certain objects can act as containers. It would be pretty\
    \ silly to let the player “Put the lantern into the sword”, for example.\n\n![](img/79557530489e53febfe5a6898863b83c_88_0.png)\n\
    \n## The ContainerThing Class\n\nIn the darken project, I have a ContainerThing\
    \ class which is used for creating container objects. You can see the full code\
    \ listing of this class on the next page. ContainerThing is a descendant of ThingHolder,\
    \ which is the class that handles objects that can contain lists of other objects.\
    \ The ContainerThing class has two new properties, Openable and IsOpen. I don't\
    \ allow things to be put into containers that aren't open. ContainerThing has\
    \ Open() and Close() methods that change the state of the _isopen data field.\n\
    \n## Putting Objects into Containers\n\n```\ndarkneon (ContainerThing.cs)\npublic\
    \ class ContainerThing : ThingHolder {\n    private bool _openable;\n    private\
    \ bool _isopen;\n\n    public ContainerThing(string aName, string aDescription,\
    \ ThingList tl) : base(aName, aDescription, tl) {\n        _openable = false;\n\
    \        _isopen = true;\n    }\n\n    public ContainerThing(string aName, string\
    \ aDescription, bool isTakable, bool isMovable, bool isOpen, bool tl) : base(aName,\
    \ aDescription, isTakable, isMovable, tl) {\n        _openable = isOpenable;\n\
    \        _isopen = open;\n    }\n\n    public void Open() {\n        _isopen =\
    \ true;\n    }\n\n    public void Close() {\n        _isopen = false;\n    }\n\
    \n    public override string Describe() {\n        string desc = \"\";\n     \
    \   string thingsdesc = \"\";\n        desc = $\"This is {Description}\";\n  \
    \      thingsdesc = Things.Describe();\n        if (thingsdesc == \"\") {\n  \
    \          desc += thingsdesc;\n```\n\nWhen the player wants to put an object\
    \ into a container, PutObInContainer() checks that the player has the object (it\
    \ is in the player's inventory) and that the container is here – or that it is\
    \ in the player's inventory or it is in the current room:\n\n```\nThing t = _player.Things.GetOb(obname);\n\
    Thing container = ObHere(containername);\n```\n\nIt checks that the container\
    \ is really a container (instance of the Container Thing class) and that it is\
    \ open. If it is really an open container, then the code calls the TransferOb()\
    \ method to put the object into the container:\n\n```\ndarkneon (Adventure.cs)\n\
    public string PutObInContainer(string obname\n```\n\nI also rewritten the TakeOb()\
    \ method so that objects can be taken out of containers:\n\n```\ndarkneon (Adventure.cs)\n\
    if (t == null) {\n    kv = ObContainerHere(obname);\n    t = kv.Key;\n    tl =\
    \ kv.Value;\n}\n```\n\nHere, kv is a KeyValuePair where a Thing is the key and\
    \ a ThingList object is the value. I assign the key to the Thing variable t and\
    \ the value to the ThingList variable tl. So if the object specified by obname\
    \ is found in an open container in the current location, kv is initialized with\
    \ the object (kv.Key) and the container's ThingList — that is, the list in which\
    \ object was found (kv.Value). When TransferOb() is called, the object is transferred\
    \ from the container's list to the player's inventory in the usual way:\n\n```\n\
