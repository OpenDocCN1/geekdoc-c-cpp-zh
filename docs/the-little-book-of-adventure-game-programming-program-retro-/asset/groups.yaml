    Subscribe to our Twitter feed: https://twitter.com/bitwisecourses


    # Adventure Game Programming Course (and more...)


    If you enjoy learning with video-based lessons, you may be interested to know
    that the author of The Little Book Of Adventure Game Programming teaches a range
    of online programming courses, including a course that is complementary to this
    book, Adventure in C# Programming.


    ![](img/79557530489e53febfe5a6898863b83c_128_0.png)


    Huw also teaches a more traditional C# course, Learn To Program C# which contains
    more than seven hours of video instruction in over 115 lessons.


    ![](img/79557530489e53febfe5a6898863b83c_128_1.png)


    Readers of this book may be able to claim special deals on these courses by going
    to: http://www.bitwisebooks.com/specials


    # Little Books Of ...


    The Little Book Of Adventure Game Programming is one of a series of ‘Little Books
    Of ...’ for programmers. In each Little Book we aim to give you just the stuff
    you really need to get straight to the heart of the matter without all the fluff
    and padding.


    We know that there is plenty of information online about standard code libraries,
    so we don''t fill the pages of these books by duplicating information. Instead,
    we aim to explain the really important details that you need to gain a solid understanding
    of each subject and start hands-on programming as quickly as possible.


    Some other ‘Little Books Of ...’ are:


    ![](img/79557530489e53febfe5a6898863b83c_129_0.png)


    # The Little Book of C#


    A beginners guide to the C# language:


    - Object Orientation

    - Classes and Methods

    - Methods & Arguments

    - Arrays & Strings

    - Exception-handling

    - Lists & Generics


    ![](img/79557530489e53febfe5a6898863b83c_129_1.png)


    # The Little Book of Pointers


    An in-depth guide to pointers in C:


    - Induction

    - Pointer arithmetic

    - Data Alignment

    - Linked Lists (single/double)

    - Stacks & Queues

    - Function Pointers

    - Common Pointer Problems


    # The Little Book of C


    A beginners guide to the C language:


    - Fundamentals of C

    - Variable & Types

    - Operators & Tests

    - Functions & Arguments

    - Arrays & Strings

    - User-Defined Types


    ![](img/79557530489e53febfe5a6898863b83c_130_0.png)


    # The Little Book of Recursion


    Understanding recursion techniques in C:


    - Recursive Functions

    - The Call Stack

    - Stack Frames

    - Stack Corruption

    - Recursion & Scope

    - Tree Structures

    - Disk Directory Recursion


    ![](img/79557530489e53febfe5a6898863b83c_130_1.png)


    # The Little Book of Ruby


    A beginners guide to the Ruby Language:


    - Getting Started with Ruby

    - Object Orientation

    - Classes & Superclasses

    - Modules & Mixins

    - Methods & Arguments

    - Class & Instance Variables

    - Operators & Tests

    - Arrays & Hashes

    - File Operations

    - Exception-handling


    ![](img/79557530489e53febfe5a6898863b83c_130_2.png)


    You can also download a number of useful free resources from the Bitwise web site:
    http://www.bitwisebooks.com


