    # A Short Guide to Adventure Games


    game you will need to use a very broad range of programming techniques – to create
    hierarchies, serialize (save) objects to and from disk, deal with error-handling
    and even parse user input into meaningful human-language commands.


    When I wrote my first game, I had to work out how to do everything for myself.
    Now you have this book to guide you. I''ll explain everything you need to know
    about adventure-game writing from your first simple ''room'' to a complex game
    with a huge map of connected rooms containing numerous treasures. I will use the
    C# language most of the time and the appendix also provides some help on translating
    C# to other languages. All the source code (in C# and other languages) is also
    available as a free download. I believe this book is the most comprehensive guide
    available to writing text adventures. I hope you have fun!


    # A Brief History of Adventure Games


    While it''s impossible to know who wrote the very first adventure game, the first
    one to generate any interest among computer users was almost certainly Will Crowther''s
    Colossal Cave which is sometimes called the ''Original Adventure''. In addition
    to programming, Crowther was also a caving enthusiast who explains why his adventure
    game took place in a massive caving system. Colossal Cave was developed between
    1975 and 1977 and was finished with the assistance of another programmer, Don
    Woods. Their game was written in FORTRAN and ran on a PDP-10 mainframe computer.


    ![](img/79557530489e53febfe5a6898863b83c_17_0.png)


    The next big step in the evolution of adventure games came with the release of
    Zork. This game owed a huge debt to Colossal Cave, including the underground network
    that formed a large part of the Zork world. Zork was developed by a team of programmers
    at MIT, led by Dave Lebling.


    For more on Zork, be sure to read my interview with Dave Lebling in the appendix
    of this book.'
