  mdcn: "\n\n## 2 — 创建地图\n\n这张地图包含四个房间。巨魔房（Troll Room）通往东边的森林（当然，森林也通往西边的巨魔房）。巨魔房还向南通往洞穴（Cave），而洞穴向东通往地下地牢（Dungeon）。在没有显示连接的地方意味着没有“出口”。例如，巨魔房北方没有出口，南方也没有出口。在我的程序中，我的地图结构将是一个数组。\n\
    \n## 数组\n\n数组是一个顺序列表。你可以将其将其看作一组槽位，可以在其中存储固定数量特定类型的项目。\n\n## 创建地图\n\n我通过输入类名 `Room`，后跟一对方括号以及数组变量名\
    \ `map` 来声明一个用于持有`Room`对象的数组：\n\n```\nRoom[] map;\n```\n\n这仅仅是数组对象的声明。和其他对象（在\
    \ C# 中）一样，我必须先使用 `new` 关键字创建数组对象后才能使用它。我想存储四个 `Room` 对象，所以我写了 `Room`、另一对方括号，以及在括号之间的数组长度\
    \ `4`：\n\n```\nmap = new Room[4];\n```\n\n当我想向此数组添加 `Room` 对象时，我将它们放在数组的特定索引处。数组的第一个索引是\
    \ `0`。因此，我将数组变量名 `room0` 放在方括号之间，然后是赋值运算符 `=`，最后是 `Room` 变量名 `room0` 后跟分号：\n\n\
    ```\nmap[0] = room0;\n```\n\n现在该房间对象被放在数组索引为 `0` 的第一个槽位中。我将剩下的三个房间对象放在索引为 `1`、`2`\
    \ 和 `3` 的数组索引中：\n\n```\nmap[1] = room1;\nmap[2] = room2;\nmap[3] = room3;\n```\n\
    \n## 2 — 创建地图\n\n由于 `Room` 对象位于 `map` 数组的索引 0、1、2 和 3 处，我可以使用每个房间对象的整数出口值（分配给房间\
    \ `n`、`s`、`w` 和 `e` 变量的值）来查找特定索引处的房间。这告诉我在我的游戏世界中，哪个房间与当前房间在任何方向上相邻。当我需要从地图上的一个房间移动到另一个房间时，这将至关重要。\n\
    \n## 3 – 在地图上移动\n\n如果玩家无法从一个位置移动到另一个位置，那么在游戏中拥有复杂的地点网络是没有用的。\n我们将在本章中查看如何实现。\n\
    \n在 `game04` 项目中，我设计了一个带有 N、S、W 和 E 按钮的简单用户界面，用户可以点击这些按钮在四个指南针方向上移动。左侧的 Visual\
    \ Studio 事件面板允许我浏览这些按钮的点击事件处理器（event-handler）方法。在这里，我可以看到当用户点击 `S` 按钮时，名为 `s8tn_Click()`\
    \ 的方法将运行。\n\n![](img/79557530489e53febfe5a6898863b83c_28_0.png)\n\n我还做了一些其他更改。首先，我更改了\
    \ `Room` 变量的“作用域（scope）”。在之前的项目中，它们被声明在 `button1_click()` 事件处理器方法内部，该方法在用户点击按钮时运行。\n\
    \n问题是，方法内部的变量是该方法的“局部”变量。一旦函数停止运行，所有房间都会消失！这对我的游戏没有好处。因此，在 `game04` 中，我将 `Room`\
    \ 变量声明在函数外部，以便它们具有“全局”作用域（实际上，它们的作用域在 `Form1` 内部），这样它们在整个游戏中持续存在。我还稍微修改了 `Room`\
    \ 类，添加了一个新的字符串字段 `description`，它在需要时提供房间的描述。\n\n## 3 — 在地图上移动\n\n### 方法（Methods）\n\
    \n在面向对象的术语中，“函数（function）”和“方法（method）”的意思大体相同。函数是一个命名的代码块，它可能不接收参数也不返回结果。方法是声明在类内部的函数，并且“属于”一个对象。在大多数现代面向对象的语言（如\
    \ C#、Java 和 Ruby）中，所有函数都属于对象，可以认为是这些对象的方法。在本书中，每当我使用“方法”一词时，我简单指的是与对象关联的函数。\n\n\
    `Form1` 有它自己的构造函数方法 `Form1()`，它在表单创建时（当我的程序启动时）运行。Visual Studio 会自动添加对 `InitializeComponent()`\
    \ 方法的调用。该方法设置表单、创建按钮等。之后，我想运行我编写的两个新方法：`InitGame()` 和 `StartGame()`。我在构造函数中调用了它们：\n\
    \n```go\npublic Form1() {\n    InitializeComponent();\n    InitGame();\n    StartGame();\n\
    }\n```\n\n`InitGame()` 方法包含了我之前编写的用于初始化 `Room` 对象并将它们添加到地图中的代码。`StartGame()` 方法在游戏开始时打印欢迎消息和指令：\n\
