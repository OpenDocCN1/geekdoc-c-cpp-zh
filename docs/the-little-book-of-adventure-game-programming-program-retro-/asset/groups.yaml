    # Magnetic Scrolls


    > Magnetic Scrolls was a British company that broke with convention by adding
    graphics (static images) to their adventure games and also programmed a better
    parser than most competing games of the period, to interpret moderately complex
    English-language commands. Trivia detail: The author of this book (Huw Collingbourne)
    used to teach the martial art Aikido to the Magnetic Scrolls programmer, Doug
    Dobson.


    ![](img/79557530489e53febfe5a6898863b83c_120_0.png)


    One of the things Magnetic Scrolls pride themselves on is their parser. The ''in''
    seems to allow users to type in an ever more varied range of grammatical constructions.
    But I wonder how many people get around to exploring the possible things you can
    say to an Infocom or a Magnetic Scrolls game? Most people end up just saying ''Read
    scroll'' or ''Kill troll'', don''t they? So is it really worth developing parsers
    beyond a certain point?


    I think it is. It''s a controversial opinion, but I think the advantage of a better
    parser is that the player can say more things to the game and be understood. The
    disadvantage of a better parser is that the player can say many more things that
    will be superbly understood but not actually understood. You can''t just blithely
    go off and say: Oh, sure, I''m going to have a parser with ellipses and questions
    and statements and so forth so on. You have to do it fairly carefully. Magnetic
    Scrolls have done a fairly good job of extending the basic three-word parser and
    adding a few more bells and whistles.


    And you are going to respond to that challenge, I presume.


    We''re certainly hoping to carry on improving our parser. Over the last few months
    we rewrote the parser from scratch. The games that we''ll be producing this year
    will have new capabilities of the old one plus a few new ones.


    Good parsers obviously need good programmers. But I gather that some of the people
    who wrote Infocom adventures are not programmers at all. Does that mean that anybody
    can be given your system and a manual, put in front of a computer and writing
    an adventure?


    Not exactly. I think a better way of saying it is that some of our writers are
    not professional programmers. You could not take an author off the street and
    let them get on with it. You can take someone who''s technically sophisticated,
    like, say, Douglas Adams, with Hitchhiker''s. He can comprehend what''s going
