    inside the jewel-encrusted egg. Someone was playing the game and said ''I''m really
    having trouble with this. And it''s frustrating because I know exactly what you''re
    meant to do once you got the canary.'' We said ''Oh really?'' – we had no idea
    what you were meant to do. He said, ''You''re supposed to take it up to the forest
