    \ - simple and easy to understand and modify - then I generally try to restructure\
    \ it to make it clear.\n\n## 9 – The Command Parser\n\n“Take the lantern”, “Look\
    \ at the goblin” – the original text adventures understood commands like these\
    \ when entered by the player. So will our game!\n\nAll the classic adventure games\
    \ from the 1970s and 1980s accepted natural language commands – words entered\
