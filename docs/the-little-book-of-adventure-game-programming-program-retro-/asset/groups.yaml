    # 10 — Putting Objects into Containers


    Where might you find an acorn?


    Oh, look! In another part of the garden there''s an oak tree. When you climb the
    tree, you see that there''s an acorn in it. So maybe you can take the acorn, go
    back to the garden, drop it and then see if the squirrel takes it (it would have
    you to program the squirrel to behave differently when an acorn is there, of course).


    What''s that button on the wall in the Dead End? Surely maybe it happens to an
    object in another room? Maybe it opens the wooden chest in the bedroom? That contains
    a key. Where is that needed? Maybe the Palm House should have a locked door that
    opens the keys?


    There''s the rat in the attic—a lump of cheese in the kitchen. What would happen
    if I''ve gave the cheese to the rat? Now think of all the other things that might
    be used for special purposes. There''s a coin and a slot. What would happen if
    you put the coin into the slot? There''s a lever on the balcony. Something must
    happen when it is pulled. As for the bone and the bin and the blood-stained knife—they
    are all objects that might suggest puzzles for the player to solve. Let your imagination
    run riot when you figure out how they all fit together to create the plot of your
    game.


    # Over to You!


    So that''s it. You now know everything you need to write a classic-style text
    adventure I hope you''ve enjoyed delving into the capabilities of C# and .NET
    and I hope you may be inspired to try creating a game of your own. As I hope you''ve
    discovered, writing text adventure is quite a challenging project. But it is also
    a great deal of fun!


    If you''ve enjoyed this book, I would be enormously grateful if you could leave
    a short review on Amazon. Reviews are extremely important to a writer, and if
    you could take a minute or two to leave a review, that would mean a great deal
    to me.


    # Appendix


    ## The Language of Adventures and Programming


    Actually here are a few of the important terms relating to programming in general
    and adventure game programming in particular which are used throughout this book.
    You don''t need to understand all the terms given here in order to follow this
    book. However, this list may be of use if you come across a term with which you
    are unfamiliar.


    - **Argument** – a data item that is passed to a function or method. Arguments
    are normally declared in the definition of the function. When the function is
    called by some other piece of code, the programmer must normally send the same
    number (and usually the same data type) of arguments to the function as declared
    in the function header.

    - **Array** – a sequential list of elements. Each element can be indexed by its
    numeric position in the list.

    - **Character** – a single character such as ''h'', delimited (in C#) by single-quote
    characters. Multiple characters in sequence form a string. See the entry for ‘string’.

    - **Class** – the definition of an object. See ‘Object Orientation’.

    - **Class Hierarchy** – in Object Orientation, one class may descend from another
    class in which it inherits the behaviour and data of its ancestor class. This
    makes it possible to create ever more specialised classes in a hierarchy, rather
    like a family tree. For example, you might create a Car class and have two descendants:
    SportsCar and SaloonCar. The descendants would both have the features of the ancestor.
    Car, but would add on new behaviour to define the special features of a racing
    car or a saloon car.

    - **Constant** – a named item that can store some piece of data as its value.
    The value of a constant may not vary during program execution. Compare with ‘variable’.

    - **Double** – see *Float*.

    - **Encapsulation** – this is an Object Oriented term that describes the ‘wrapping
    up’ of data and the methods that act upon it inside an object. Some (but not all!)
    programmers would also consider that ‘data hiding’ is an essential feature of
    proper encapsulation.


    Many programmers tend to ignore data-hiding, however which (in my opinion) is
    a rather bad habit to get into!


    - **Float** – a floating point number such as 1.36. There are several data types
    for floating point numbers (e.g., double) according to the size or ''precision''
    of the numbers that can be stored by variables of that data type.

    - **IDE** – Integrated Development Environment. A suite of tools normally including
    a code editor, compiler and debugger (and sometimes as a user-interface designer)
    for developing programs. The IDE used for programming C# in this book is Microsoft
    Visual Studio (for Windows).

    - **Integer** – a ‘whole number’ with no ‘floating point’. e.g. 102.

    - **Interactive Fiction (or IF)** – a game in which the player can interact with
    the story, using human-language words. Most adventure games are interactive fiction.

    - **Keyword** – a special bit of syntax that is ‘built in’ to the programming
    language. For example, the words if and while are built into many programming
    languages.

    - **LISP** – List Processing Language. An old computer language dating from 1958
    was much used by early adventure game programmers. See also MDL and ZIL.

    - **MDL** – MIT Design Language (pronounced ‘muddle’), a type of LISP developed
    at MIT (Massachusetts Institute of Technology). An early version of Zork was written
    in MDL. Later, ZIL was used.

    - **Method** – a function (or procedure) that is defined inside a class in Object
    Oriented languages such as C#, Ruby.

    - **Object** – in Object Oriented programming, an object is a structure that contains
    both data (variables) and the functions (methods) needed to act upon.

    - **Object Orientation** – a style of programming in which objects form the fundamental
    blocks. C++, Object Pascal, Smalltalk, Ruby and Java are examples of.

    - **OOP** – Object Oriented Programming. See Object Orientation.

    - **Operator** – one or more characters that are used to indicate some operation.
    For example, most languages use the arithmetic operators +, -, *, / to add, subtract,
    multiply and divide.

    - **Parameter** – approximately synonymous with ‘argument’. Computer scientists
    may make the distinction between a ‘named parameter’ – which is the name of a
    variable that is declared by the function (in parentheses after the function name)
    and an ‘argument’ – which is the piece of data passed to the function.

    - **Return value** – the data item returned by a function. In many languages the
    type of the data must be declared in the function header. For example, in C# you
    might declare a function that returns a string like: string someFunction(). Some
    languages allow functions to return unspecified types. For example, a Ruby function
    might return a string, an integer, some other data type or nothing at all.

    - **String** – a sequence of characters such as “Hello world”. Most programming
    languages delimit strings with single or double quotation marks. C# uses double-quotes.

    - **Text Adventure** – an exploring-style game in which descriptions are given
    in text and commands are entered as words. The classic text adventures do not
    have graphics (such as the Magnetic Scrolls games mentioned in the Dave Lebeling
    interview) do show images in addition to text.

    - **Variable** – a named item that can store some piece of data as its value.
    The value of a variable may vary during program execution. Compare with ‘constant’.

    - **ZIL** – Zork Implementation Language: a L-like language that was used by Inforcom
    to program its adventure games.


    # The darkneon Game Map


    The darkneon sample project supplied in the source code archive has a map containing
    the locations (Rooms) shown below. The rooms are connected by exits in the compass
    directions, N, S, W and E. Notice that the exit to the west of Dagger Street leads
    to the exit at the North of the Alleyway. As long as the exits are consistent
    (they connect the same rooms in the same way in both directions), ''twisted''
    connections like this are occasionally acceptable in games (especially in mazes).
    The dotted lines in the map below indicate up/down connections. Here the Deserted
    Shop leads up to the Attic and down to the Basement. The south end of the Garden
    leads up to the Oak Tree. The Palm House leads up to the Balcony.


