    # 2 – Make a Map


    In an adventure game, the player needs to be able to move around, exploring the
    various locations in the game world. To do that, we need to create a map.


    It''s a good idea, planning a game to begin by drawing a map of the ‘world’ of
    the game. A map is a collection of linked locations or ‘rooms’. Here’s my map
    of four rooms: Troll Room, Forest, Cave and Dungeon. The lines show the exits
    that connect one room to another. Where there are no connecting lines, there are
    no exits.


    ![](img/79557530489e53febfe5a6898863b83c_20_0.png)


    # Rooms or Locations?


    Traditionally, adventure games refers to locations as ‘rooms’ whether or not those
    locations are literally rooms inside a building. In this book, when I talk about
    a room I mean any distinct location even if it happens to be somewhere in the
    ‘outside world’ such as in a street or in a forest. Similarly, when I talk about
    an ‘exit’ I mean a connection to another room or location in a specific ‘direction’.'
  - '[PAGE 21]


    # ## -- Make a Map


    # # Create a Room


    Before I can create a map, clearly I have to have some way of creating a room.
    Even though I will will start with just one room, I need to keep in mind that
    eventually the game will have lots of rooms. Each room will be different from
    every other room – for example, a room in a forest will be very different from
    a room in a cave. But room objects will all have many similar features too.


    You can see from my little map, that room has a name and some exits which lead
    into other rooms. Since each room has these features, I need to write a ‘blueprint’
    from which room ‘objects’ can be created. In oriented terminology, the blue-print
    for an object is its class.


    I need a Room class that contains a name and four exits. A name will be a string
    (a bit of text such as “Troll Room”). What type of data should an exit be? You
    might think that if a Room enters another room then the exit itself be a Room
    – that is, if I did that, my Room class (in pseudocode) might look something like
    this:


    ```

    (pseudocode)

    class Room

    name: string

    n: Room

    s: Room

    w: Room

    e: Room

    end class

    ```


    # pseudocode


    Pseudocode is not real programming code. It is a simplified representation of
    data, structures or techniques. Pseudocode can be rewritten in ‘real’ program
    code using the syntax of whichever language you are using.


    I once wrote a game that implemented rooms in exactly this way – with each exit
    being a Room object. However, I soon realised that the advantages are outweighed
    by the disadvantages. For one thing, it takes two steps to create a map: first
    you have to create all the Room objects; then you have to initialize the n, s,
    w and e variables by assigning Room objects to them.'
  - '[PAGE 22]


    # 2 – Make a Map


    But worst of all is the fact that when you create a complex network of Room objects
    that contain Room objects, your code rapidly becomes difficult to understand (especially
    when saving and loading a map to and from disk), hard to maintain and problematic
    to debug.


    Ive therefore decided to keep things much simpler – and I''d recommend you do
    so too. Initially, I''m going to assume that every Room in the map will be identified
    with a whole number (integer). The exits are integer variables that indicate room
    number can be found in each of the four compass directions, like this:


    # (pseudocode)


    ```

    class Room

    name: string

    n: integer

    s: integer

    w: integer

    e: integer

    end class

    ```


    This is how I define a Room class in C#:


    # game01


    ```

    public class Room {

    public string name;

    public int n;

    public int s;

    public int w;

    public int e;

    }

    ```


    The Room is only a blueprint for an object. In order to have a usable room, I
    need to create one with actual integer and string values for the exits and name
    fields. In C#, I can do that like this:


    ```

    Room r = new Room();

    r.name = "Troll Room";

    r.n = 1;

    r.s = 2;

    r.w = 3;

    r.e = 4;

    ```


    This creates a new Room object and assigns it to the variable, r. Then I assign
    values to each of the object''s fields: a string name and four integers for the
    ‘direction’ variables: n, s, w and e.'
  - '[PAGE 23]


    # 2 — Make a Map


    # Create Multiple Rooms


    An adventure game with just one location – ‘room’ won’t be much fun. I need to
    have lots of different rooms to explore. In object-oriented terminology, an object
    can be said to be an ‘instance’ of a class.


    You define a class once and then you can create numerous instances of that class.
    I can do that by declaring a new Room variable for each Room object. The Room
    class defines what a room is. The Room objects represent individual rooms. In
    the game02 project I have four Rooms room0, room1, room2 and room3:


    | game02 |

    | room0; |

    | room1; |

    | room2; |

    | room3; |


    I create each Room object by calling the Room constructor to create a new Room
    object and assign that to one of my variables:


    ```

    room0 = new Room();

    room1 = new Room();

    room2 = new Room();

    room3 = new Room();

    ```


    # Constructors


    In C#, a function or method such as Room() with the same name as a class (here
    Room), is a ‘constructor’. The constructor method is called following the keyword
    new when to create a new object.


    In some cases, a constructor may take arguments which can be used to initialize
    the fields (the variables) of the new object. We’ll see examples of that later
    on.


    Here, however, the Room constructor takes no arguments which is why I use an empty
    pair of parentheses:


    ```

    room0 = new Room();

    ```'
