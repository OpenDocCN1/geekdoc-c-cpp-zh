    # I — A Short Guide to Adventure Games


    Zork was originally written in the MDL programming language, once again on a PDP-10.
    MDL was a language based on the LISP list processing language. Later the game
    was rewritten several times and the most famous implementation was written in
    ZIL (Zork Implementation Language), another LISP-like language developed specifically
    for writing games. Zork was eventually released in a version that could run on
    personal computers when the Infocom games company was founded in 1979.


    Infocom dominated the field of adventure games with titles such as Starcross,
    The Hitchhiker''s Guide To The Galaxy and Trinity. One of the improvements Infocom
    made to the earlier Colossal Cave game was a better ‘parser’ to interpret simple
    human language commands. Colossal Cave was limited to two word commands such as
    “Take sword”. Infocom games allowed longer commands such as “Put the Elvish sword
    into the sack”. We''ll look at the problems of command parsing in Chapter 9.


    # Programming Concepts and Terminology


    I won''t be explaining programming terminology in great detail in this book. I
    have other books that teach programming languages from the ground up. For example,
    The Little Book Of C# provides a step-by-step guide to C# programming. The Appendix
    of this book provides short definitions of some common programming terms.


