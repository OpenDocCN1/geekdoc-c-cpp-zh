    In the Adventure class, I''ve initialized _player with an empty ThingList. An
    object will be added to this whenever the player takes a Thing from a Room as
    the game is played:


    ```

    _player = new Actor("You", "The Player", _map.RoomAt(Rm.TrollRoom),

    new ThingList());

    ```


    As I intend to let the player take treasures from rooms, there''s one other thing
    I have to do. I need to make sure that only those things are logically small enough
    to be taken, can be taken. For example, forestlist includes a gigantic oak tree:


    ```

    new Thing("tree", "It is a gigantic oak tree", false)

    ```


    It would be pretty silly if the player went into the forest and took the tree.
    I need to have some way to make sure that some things can be taken and some can''t.
    That''s what the third argument does. By setting it to false, I make sure the
    tree can''t be taken. However, you may have noticed that the carrot and the sausage
    don''t have a third argument:


    ```

    new Thing("carrot", "It is a very crunchy carrot"

    new Thing("sausage", "It is a plump pork sausage")

    ```


    How can a constructor require three arguments and sometimes only two? It turns
    out that my rewritten Thing class now has two constructors. The first constructor
    requires two string arguments; the second constructor requires two strings followed
    by a bool (true or false) argument:'
  - "[PAGE 60]\n\n# Overloaded Methods\n\n```\npublic Thing(string aName, string aDescription)\
    \ {\n    _name = aName;\n    _description = aDescription;\n    _cantake = true;\
    \ // sets cantake to default value\n}\n\npublic Thing(string aName, string aDescription,\
    \ bool aCantake) {\n    _name = aName;\n    _description = aDescription;\n   \
    \ _cantake = aCantake;\n}\n```\n\nWhen you have two methods (constructor methods\
    \ or other methods), that have the same name but different sets of arguments,\
    \ they are said to be overloaded. When you call an overloaded method, the number\
    \ and types of the arguments that you pass to that method determine which implementation\
    \ of that method will actually run.\n\nWhen I call the Thing constructor and pass\
    \ two string arguments, the first constructor shown above is the one that runs.\
    \ But if I call the Thing constructor with two string arguments and a bool, then\
    \ the second constructor is run.\n\nOf course, I could omit the first constructor\
    \ completely. But if I did that, whenever I wanted to construct a takeable object,\
    \ I would need to pass true as the third argument. Since most of the objects in\
    \ the game are takeable, I've decided to retain the old constructor (with just\
    \ two arguments), so that usually when I create a Thing object I just have to\
    \ pass a name and a description. The first constructor sets the _cantake field\
    \ to true for all objects constructed in that way. The second constructor is reserved\
    \ for special cases, when I want to set the bool value explicitly."
