    # 2 - Make a Map


    I need to put some data into each object to initialize its name and its four exits.
    I do that by assigning strings and integers to each object:


    ```

    room0.name = "Troll Room";

    room0.n = -1;

    room0.s = 2;

    room0.w = -1;

    room0.e = 1;


    room1.name = "Forest";

    room1.n = -1;

    room1.s = -1;

    room1.w = 0;

    room1.e = -1;


    room2.name = "Cave";

    room2.n = 0;

    room2.s = -1;

    room2.w = -1;

    room2.e = 3;


    room3.name = "Dungeon";

    room3.n = -1;

    room3.s = -1;

    room3.w = 2;

    room3.e = -1;

    ```


    I now have four Room objects, each with its own name and integers representing
    the four exits. Theoretically these rooms are connected as shown in the little
    diagram at the start of this chapter (I use -1 when there is no exit).


    The one called Troll Room, that''s room0, has no exit North, so its n field is
    set to -1. But it has an exit south to the Cave - which is room2 because the value
    of room0''s variable is 2. And so on.


    But in fact, in this program the rooms are separate objects which are not really
    ''connected together'' in any meaningful way. So, if I play the game in its present
    form, I have no way of moving from one room to another. In order to be able to
    do that, I need to find a way of using the four exit variables to find a specific
    Room object.


    Remember, my ultimate aim is to allow the user to enter rooms by moving in the
    compass directions. If there is no exit (-1), I should inform the player. My next
    job, then, is to ''link'' the exits to some Room objects.


