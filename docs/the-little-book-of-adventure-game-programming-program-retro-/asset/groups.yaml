    # Dave Lebling 采访


    Dave Lebling 是 Infocom 的创始人之一，该公司创作的游戏了从著名的《魔王王国》（Zork）三部曲到根据道格拉斯·亚当斯的《银河系漫游指南》改编的各种作品。我在
    1988 年采访了 Lebling。你可以在这里阅读当时的采访。


    ![](img/79557530489e53febfe5a6898863b83c_116_0.png)


    我们当时并不知道，但 80 年代末是冒险游戏“黄金时代”终结的开始。那时，Lebling 还是我对游戏行业在未来三十年左右将如何发展都没有任何真实的想法。《魔王王国》以及其他基于文本的
    Infocom 游戏在仅有 512K 内存的 PC 上就能运行良好。今天，为了玩现代的快速动作游戏，你可能需要一台除了 16 Gigabytes PC 系统内存外，显卡本身就拥有
    6 Gigabytes（或更多）内存的 PC。在 1988 年，几兆字节的内存看起来就像一个未来的梦想。任何人的显卡上拥有 GB 内存的想法在当时是荒谬的。这次采访最初出现在英国版《计算机购物者》杂志第
    7 期（1988 年 9 月）。我的问题以斜体形式显示。Dave Lebling 的回答用标准字体打印。


    # 附录


    *当你第一次编写《魔王王国》的主机版本时，你想过你可能会从中赚到钱吗？*


    哦，没有。我们在 1976/77 年出于兴趣之于随手写了《魔王王国》。在麻省理工学院（MIT），这类事情是有历史的——很多人做过那种“深夜编程项目”——你懂的，就是那种你不会在正常工作时间内做的事情。当时有很多现在被称为视频游戏的东西和很多益智游戏——有很多让你娱乐的东西。而《魔王王国》只是其中又一个……


    *所以你是说，你和 Marc Blank 只是在还是学生的时候利用空余时间随手写出来的吗？*


    不，不完全是。我们有四个人参与。我们中有些人是学生，有些人则不是。我是一名工作人员，一名研究员。Marc Blank 是学生，Tim Anderson 是研究生，Bruce
    Daniels 也是研究生——他们是《魔王王国》主机版的另外三位作者。


    ![](img/79557530489e53febfe5a6898863b83c_117_0.png)


    # 《魔王王国团队


    Marc Blank, Tim Anderson, Bruce Daniels 和 Dave Lebling 是 MIT 动态建模小组的成员。他们都为《魔王王国》的编程做出了贡献。


    *《魔王王国》最初是用什么编写的？*


    它是用一种名为 Muddle (MDL) 的语言编写的——这是一种在 MIT 开发的“人工智能”语言。它像 LISP——是一种递归结构导向、用户可扩展的语言。熟悉
    LISP 的人可以看到 Muddle 并大致弄清楚他们在做什么。


    *既然它和 LISP 如此相似，为什么你们不直接用 LISP 呢？*


    因为 Muddle 是我们研究小组使用的语言。当我们加入 Infocom 时，我们又编写了另一种语言专门用于实现《魔王王国》——那是 ZIL——它非常像 Muddle
    本身，但专门针对处理冒险游戏进行了适配。


    *ZIL 和更标准的 LISP 版本（如 Common LISP）之间的区别是什么？*


    最明显的区别是它没有圆括号，而是使用角括号。这是 LISP 用户感到奇怪的第一点。另一个是，ZIL 包含了一些对冒险游戏非常有用的操作——将对象从一个地方移动到另一个地方，并非常快速地检查某个对象是否具有特定属性。但其中没有任何东西是良好的
    LISP 系统无法轻松实现的。


    *ZIL 在这些年是如何发展的？据我所知，你们有几个不同的版本。*


    哦，绝对是。在第一个版本中，实际游戏体的大小为 128K，最多有 256 个对象——这包括房间以及宝藏等。在 ZIL 中，房间和对象是以相同的方式表示的。但目前游戏的最大大小为
    256K，而且房间和对象的数量实际上没有限制。还有其他变化。到目前为止，我们的开发系统一直在 DEC 20 上运行，但现在我们正将其迁移到 Mac II。Dec
    20 尽管我们非常喜欢它并希望它永远存在下去，但遗憾的是它过时了。它是一台巨大、昂贵的主机计算机。维护成本很高。它确实非常消耗资源，我们认为 Mac 应该容易管理得多。


    *当游戏发布时，它们是什么形式的？你们似乎有某种读取数据的基本程序。当我们玩这些游戏时，它是以某种方式被解释的吗？*


    是的，它是一个解释器。ZIL 本身是一个虚拟机。这意味着是一个模拟特定的不存在的计算机行为的计算机程序。这有点像 IBM 所做的。他们以模拟其计算机的早期型号而闻名。你这一点的方法是编写一段像
    CPU 的软件。我们的不是在模拟现有的机器，而是在模拟一台不存在的机器。

    '
