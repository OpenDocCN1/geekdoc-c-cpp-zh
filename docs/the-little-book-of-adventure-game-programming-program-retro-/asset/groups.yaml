- md: "\nJAVA EXAMPLE...............................................................................................................\
    \ 106\nSAVE AND RESTORE THE GAME...............................................................................\
    \ 108\nPROGRAMMING A COMMAND-LINE GAME...............................................................\
    \ 111\nDAVE LEBLING INTERVIEW......................................................................................\
    \ 115\nONLINE ADVENTURE GAMES......................................................................................\
    \ 126\nBITWISE BOOKS AND COURSES...............................................................................\
    \ 126\nADVENTURE GAME PROGRAMMING COURSE (AND MORE...)........................................\
    \ 127\nLITTLE BOOKS OF .....................................................................................................\
    \ 128\n\n## Introduction\n\nWhat is in the book and what do you need in order\
    \ to get started? Read on...\n\n## What is in the Book?\n\nThis book provides\
    \ a step-by-step guide to creating text based adventure games. The principal language\
    \ used is C#, which is one of the most important languages on Windows and is also\
    \ available on macOS and Linux. However, the programming principles and techniques\
    \ explained in the book can also be used to write adventure games in other languages\
    \ such as Java, Ruby or Object Pascal. We will end by creating the game below\
    \ which includes a map of connected locations and takes English-language commands\
    \ to let the user move around and interact with objects.\n\n![](img/79557530489e53febfe5a6898863b83c_8_0.png)\n\
    \nWhile the main projects in this book are all written in C#, brief help on translating\
    \ from C# to other languages is provided in the appendix. In addition, you can\
    \ go to the Bitwise Books website to download code samples of simple adventure\
    \ games written in several different programming languages.\n\nAs well as teaching\
    \ adventure games specifically, this book can also be used as a tutorial to writing\
    \ C# programs. It covers all the most important features of the C# language. If,\
    \ you prefer a \"traditional\" approach to learning C#, \"The Little Book Of C#\
    \ Programming\" by the same author (Huw Colbourne) is the perfect companion to\
    \ the present book. Each of the books in the Little Colbourne series aims to give\
    \ you just the stuff you really need to get straight to the heart of the matter\
    \ without all the fluff and padding.\n\n## Who Should Read this Book?\n\nThis\
    \ book is suitable for anyone interested in learning to write text adventure games\
    \ in the tradition of the classic games such as Zork and Colossal Cave. It also\
    \ provides a tutorial to C#, making it suitable for beginners (who may already\
    \ be studying C# using a more conventional tutorial) and more experienced programmers\
    \ who are looking for an entertaining and challenging project to develop their\
    \ programming skills.\n\n## Making Sense of the Text\n\nIn The Little Book Of\
    \ Adventure Game Programming, any source code is written like this:\n\n```c\n\
    private void Greet(string aName) {\n    textBox1.AppendText(\"Hello, \" + aName\
    \ + \"!\");\n}\n```\n\nSome code may be preceded by a project name like this:\n\
    \n| HelloWorld |\n| :--- |\n| private void Greet(string aName) {\n    textBox1.AppendText(\"\
    Hello, \" + aName + \"!\");\n} |\n\nThis shows that the code can be found in the\
    \ HelloWorld project in the source code archive. To follow along with the tutorial,\
    \ you can load the named project or solution into your editor or IDE (for C# projects,\
    \ I assume you will use Visual Studio). Any output that you may expect to see\
    \ on screen when a program is run shown like this:\n\nHello, Fred!\n\nExplanatory\
    \ notes (which generally provide some hints or give a more-in-depth explanation\
    \ of some point mentioned in the text) are shown like this:\n\n### This is a Note\n\
    \nThis is an explanatory note. You can skip it if you like – but if you so, you\
    \ may miss something of interest...!\n\n## Download the Source Code\n\nAll the\
    \ source code shown in this book is available for download. The source code archive\
    \ contains code in the form of a single Visual Studio multi-project solution.\
    \ Download the code from the Bitwise Books web site at: www.bitwisebooks.com\n\
    \n## Using the Code Archive\n\nMost of the programs described in this book are\
    \ written in the C# language and are intended to be loaded into Microsoft Visual\
    \ Studio. You may either load the projects from the code archive one by one (by\
    \ selecting the solution or project files from the subdirectories containing each\
    \ project) or, as I recommend, you may load a solution that groups all the sample\
    \ projects.\n\n![](img/79557530489e53febfe5a6898863b83c_10_0.png)\n\nThis solution\
    \ is supplied in the source code archive is called CSharpAdventureGames.sln. This\
    \ contains multiple projects, these are shown as 'nodes' (game01, game02) and\
    \ so in the Solution Explorer. Before compiling or running a specific project\
    \ you need to activate it. You can do that by right-clicking the project node\
    \ and selecting 'Set as StartUp Project' from the menu.\n\n## Compiling Projects\n\
    \nBefore you can run a C# program you need to compile it. The C# compiler is a\
    \ tool that translates the code you write into 'intermediate code' to provide\
    \ instructions that can be executed by the C# 'runtime' system. The intermediate\
    \ code is called CIL (Common Intermediate Language).\n\nWhen your program runs,\
    \ this CIL is executed by a 'runtime environment' called the CLR (Common Language\
    \ Runtime). That is why you must always 'build' or 'compile' your programs before\
    \ they are run. Compiling is very easy in Visual Studio. Once a project has been\
    \ set as the Startup project, you can simply select Build from the menu.\n\n##\
    \ Command-line Games\n\nMost of the programs described in this book are written\
    \ in the C# language and are intended to be loaded into Microsoft Visual Studio.\
    \ This makes it possible to create user interfaces with buttons, text fields,\
    \ menus and so on. However, if you want an authentic 1980s-'retro' game, or if\
    \ you want to deploy your game on operating systems that do not support Windows\
    \ Forms, you can create a command-line game similar to the one shown in the Appendix.\n\
    \n```\nsack dropped!\nlook at the sack\nThis is a smelly old sack\nIn the sack\
    \ you can see:\nacorn\n\ntake the acorn\nacorn taken!\nput the acorn into the\
    \ slot\nYou put the acorn into the slot.\npull the lever\nThe lever moves slightly\
    \ when you pull it.\nlook at the lever\nlever fixed to the wall\ndown\nPalm House.\
    \ This is a tall, elegant structure made of glass panes set in an iron-frame.\n\
    The atmosphere is hot and humid. Huge palm trees rise overhead. An elaborate iron\
    \ staircase leads up to a balcony.\nHere you can see:\nnothing\n\nYou have nothing\n\
    ```\n\n## About the Author\n\n![](img/79557530489e53febfe5a6898863b83c_12_0.png)\n\
    \n**Huw Colbourne** is the author of the cult adventure game, *The Wombat Of Destiny*.\
    \ Hu has been a programmer for more than 30 years. He is an online programming\
    \ instructor with successful courses on C, C#, Object Pascal, Ruby, JavaScript\
    \ and other languages and topics. For a full list of available courses be sure\
    \ to visit the Bitwise Courses website: http://bitwisourses.com/\n\nHuw is author\
    \ of *The Little Book Of Ruby*, *The Little Book Of C*, *The Little Book Of Pointers*\
    \ and *The Little Book Of Recursion* from Bitwise Books. He is a well-known technology\
    \ writer in the UK and has written numerous opinion and programming columns for\
    \ a number of computer magazines, such as Computer Shopper, PC Pro, and PC Plus.\
    \ At various times Huw has been a magazine publisher, editor, and TV broadcaster.\
    \ He has an MA in English from the University of Cambridge and holds a 2nd dan\
    \ black belt in aikido, a martial art which he teaches in North Devon, UK.\n\n\
    ## About the Technical Editor\n\n![](img/79557530489e53febfe5a6898863b83c_12_1.png)\n\
    \n**Dr. Dermot Hogan** is a software developer who has led major projects written\
    \ in Assembly Language, C, C# and a number of other programming languages. A specialist\
    \ in real time trading technologies, he has managed and developed global risk\
    \ management systems for international banks and financial institutions. He is\
    \ the lead developer of the independent software company, SapphireSteel Software.\
    \ He holds a Ph.D in physics from the University of Cambridge. His current area\
    \ of research is devoted to robotic control and imaging systems.\n"
