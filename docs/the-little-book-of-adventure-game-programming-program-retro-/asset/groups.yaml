    \ rooms stored in a list using descriptive names such as Troll or Forest rather\
    \ than integers as 1 or 2. So I am going to re-implement my map as a dictionary.\n\
    \n# Dictionaries, Associative Arrays and Hashes\n\nDictionaries are sometimes\
    \ called “hashes” or “associative arrays”. Usually these terms mean more or less\
    \ the same thing. However, some languages have ‘special purpose’ types of dictionary\
    \ which may use different names. In this book, I will use the term ‘dictionary’\
    \ very broadly to describe any list that takes the form of key-value pairs.\n\n\
    # Key-Value Pairs\n\nA dictionary takes the form of pairs of elements. In C#,\
    \ the first element is the key. The associated element is the value. In C#, a\
    \ key can be an integer, a string or some other type of object. You use the key\
    \ to find its associated value.\n\nIn that sense it is a bit like a real-world\
    \ dictionary. The name of each entry in a dictionary is the key. The definition\
    \ is the value. If the key is “dog”, that word can be used to locate the entry\
    \ for “dog” in the dictionary and that takes me its value (the definition), which\
    \ says “A four legged animal that goes woof!”\n\n# 4 – Rooms in a Dictionary\n\
    \n# RoomList – Subclassing a Dictionary\n\nIn the game06 project, you'll see that\
    \ I created a new class called RoomList. This class will define the new version\
    \ of the map. It is a descendant of the Dictionary class:\n\n```csharp\ngame06\n\
    public class RoomList : Dictionary<Rm, Room> {\n    public RoomList() {\n    }\n\
    \n    public Room RoomAt(Rm id) {\n        return this[id];\n    }\n\n    public\
    \ string Describe() {\n        string s = \"\";\n        if (this.Count == 0)\
    \ {\n            s = \"Nothing in RoomList\";\n        } else {\n            foreach\
    \ (KeyValuePair<Rm, Room> kv in this) {\n                s = s + kv.Value.Describe()\
    \ + \"\\r\\n\";\n            }\n        }\n        return s;\n    }\n}\n```\n\n\
    Notice how I declared the RoomList class. As in previous examples, its base class\
