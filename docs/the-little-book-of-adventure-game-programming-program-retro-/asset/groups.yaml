  - '[PAGE 26]


    # 2 — Make a Map


    This map contains four rooms. The Troll Room leads to the Forest in the east (and,
    of course, the Forest leads to the Troll Room in the west). The Troll Room also
    leads south to the Cave, and the Cave leads east to the Dungeon. Where no connection
    is shown there is no ‘exit’. So, for example, the Troll Room has no exit to the
    north and no exit to the south. In this program, my map structure will be an array.


    # Arrays


    An array is a sequential list. You can think of it as a set of slots in which
    a fixed number of items of a specific type can be stored.


    # Create a Map


    I declare an array to hold Room objects by entering the class name Room followed
    by a pair of square brackets and the array variable name, map:


    ```

    Room[] map;

    ```


    This is just the declaration of the array object. As with other objects (in C#),
    I have to create the array object using the keyword new before I can use it. I
    want to store four Room objects so I write Room, another pair of square brackets
    and, between the brackets, the length of the array, 4:


    ```

    map = new Room[4];

    ```


    When I want to add Room objects to this array, I put them into the array at specific
    indices. The first index of an array is 0. So I put the name of the array variable,
    room0 between square brackets, then the assignment operator =, and finally the
    name of the Room variable room0 followed by a semicolon:


    ```

    map[0] = room0;

    ```


    The room object is now put into the first slot of the array at index 0. I put
    the remaining three room objects into the array at index 1, 2 and 3:


    ```

    map[1] = room1;

    map[2] = room2;

    map[3] = room3;

    ```'
