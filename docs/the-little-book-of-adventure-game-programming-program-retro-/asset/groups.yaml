  - "[PAGE 46]\n\n# 5 – Restructuring the Game\n\nAt some time in most programming\
    \ projects of any size you will need to rewrite and simplify your code to make\
    \ it more modular and maintainable. That time has arrived for my game.\n\nUp to\
    \ now, I've put the initialization of the game – the creation of the map, rooms\
    \ and player – in the 'main' code file. In C# that is Form1.cs. While this is\
    \ convenient when testing a small program, it is not good design in a big program.\
    \ In fact, in my C# game, Form1.cs should really be reserved for those functions,\
    \ such as button-click event-handlers, which are related to the visual form design.\
    \ In the game07 project I have begun a substantial restructuring of my code.\n\
    \n# The Adventure Class\n\nI have created a new Adventure class to contain the\
    \ game initialization (such as the creation of the rooms, the map and the player)\
    \ which was previously contained in Form1:\n\n```\npublic Adventure() {\n    //\
    \ This is a simplified listing of the Adventure class\n    // Room, map and player\
    \ initialization code goes here...\n}\npublic Actor Player {\n    get => _player;\n\
    }\npublic string MovePlayerTo(Rm newpos) {\n    string s;\n    if (newpos == Rm.NOEXIT)\
    \ {\n        s = \"There is no exit in that direction\\r\\n\";\n    } else {\n\
    \        _player.Location = _map.RoomAt(newpos);\n        s = $\"You are now in\
    \ the {_player.Location.Name}\\\r\\n\";\n    }\n    return s;\n}\n```"
- md: "\n## Restructuring the Game\n\nNotice that I've provided the code in Form1\
    \ can access (or 'get') the _player object but not change it. In other words,\
    \ Player is a read-only property. I've added the MovePlayerTo() function to Adventure.\
    \ This returns a string giving the new location or stating that there is no exit.\
    \ Also, in Form1, I've added an Adventure object, adv:\n\n```\nAdventure adv;\n\
    ```\n\nWhen I run the program, the InitGame() method executes as before. But this\
    \ time it creates the adv object. This calls the Adventure constructor which initializes\
    \ the map and the player:\n\n```c\nprivate void InitGame() {\n    adv = new Adventure();\n\
    }\n```\n\n## Simplifying Map Construction\n\nSince map is now a RoomList which\
