    # Appendix


    like the kind of thing IBM do. They are famous for simulating earlier models of
    their computers. And the way you do to that is to write a piece of software that
    acts like a CPU. Ours isn''t emulating an existing machine, it''s simulating a
    machine that doesn''t exist in hardware — but theoretically it could. Another
    similar idea is languages like Pascal which are often compiled into what''s called
    a p-code. We call thing the zee-system. It was done in this way to make it easy
    to convert from one computer to another. Now as we move into the uncharted waters
    of sound and colour, it''s becoming more and more difficult to maintain that portability.


    Sound and colour! I thought they were an anathema to you. You''re not saying that
    Infocom is finally going to break with tradition and go into the sordid world
    of graphic adventures, are you you?


    Yes. We''re thinking of that.


    After all those years when you''ve said you''d never have anything to do with
    graphics! What''s brought about this change of mind?


    When people ask me about graphics, I have never said we will never put graphics
    in our games. What I have said is that we will never put graphics in our games
    until a) they enhance the game and b) they do not detract from the amount of game
    available to the player. I mean, graphics eat up disk space and memory. If you
    put in 20 pictures, it would be unconscience to reduce the game to half its size.


    So are you thinking of graphics you can look at every once in a while rather than
    fully animated graphics?


    That is close to what we are thinking of.


    In other words, just like Magnetic Scrolls adventures.


    I haven''t the slightest idea what you''re talking about! Oh well, OK, to be honest,
    we are very closely affiliated with Magnetic Scrolls, we like them a lot and I1
    they think they like us. I''ve heard that they have even put in quite a few references
    to us in their games.


    Is this an admission that you consider Magnetic Scrolls'' games like The Pawn
    and Guild Of Thieves to your main competition?


    I would not go further than to say that we consider ourselves to be friendly rivals.'
