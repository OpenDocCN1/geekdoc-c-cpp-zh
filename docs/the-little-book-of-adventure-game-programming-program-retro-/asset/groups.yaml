    这是 darkneon 游戏的主类层次结构。它仅显示了类名和属性（但不包含方法）。请记住，我还创建了另外两个类 `ThingList` 和 `RoomList`
    来管理列表。


    `ThingList` 类是 `Thing` 对象的列表。ThingHolder 及其后代类定义的 `Things` 属性（用于访问私有字段 `_things`）是
    `ThingList` 的实例。地图是一个 `RoomList`。我的 `RoomList` 类是一个键值对字典，其类型定义为接受 `Rm` 常量作为键并接受
    `Room` 对象作为值。


    # 接下来做什么？


    darkneon 游戏现在已经拥有了完整文本冒险游戏的所有核心功能。它包含一个地图，地图中各个房间，房间有通往四个方位方向以及“上”和“下”的出口。它有一个可以在地图上自由移动的玩家。它可以在房间内找到并由玩家拾取或丢弃宝藏。它还有可以放置宝藏的容器，这些容器可以被打开或关闭。


    它还有一个简单的英语语言解析器，因此可以通过编写如“拿起剑”或“将戒指放入袋子”之类的短命令与游戏进行交互。那么，剩下的工作是什么呢？


    事实上，你可以做很多事情来将这个实质上是“游戏框架”——即编写游戏所需的一组类和方法——的东西转化为你自己的冒险游戏。让我们先考虑一些可以进行的技术改进：对代码的基础功能进行一些增补。


    # 拾取容器对象


    目前，游戏中的所有容器都是固定在位置的（也就是说它们是不可拾取的）。但如果有一个可以被拾取的容器对象会发生什么呢？第一个房间里的袋子是可以拾取的，所以试着这样做吧。拿起袋子，拿起传单，然后将传单放入袋子。


    到目前为止一切正常。但现在尝试再次拿起传单。这是做不到的，因为根据目前的代码逻辑，传单“不在这里”。只有当它在房间里、在玩家的背包中，或在当前房间的开启容器内时，它才在这里。然而，传单现在在玩家背包中的一个开启容器里。我的代码没有处理这种情况。但如果你丢掉袋子然后再拿起传单，你就可以做到了！


    你需要重写 `others()` 方法来处理这种情况，并检查所有作用于对象的方法（拾取、丢弃、推、拉、查看等）是否继续正确处理玩家背包中容器内的对象。


    实现此功能所需的所有列表管理技术都可以在你现有的代码中找到。毕竟，玩家背包中容器内的对象与房间内容器内的对象并没有多大区别。尝试扩展游戏来正确处理这个问题。


    # 添加形容词和连词


    从语法上说，我的游戏解析器只处理名词（“sword”、“coin”等）、动词（“take”、“drop”等）、冠词（“a”、“an”、“the”）和介词（“in”、“into”、“at”）。然而，如果你看一眼列列出所有有效单词类型的
    `WT enum` 的定义，你会发现它还包含了常量 `CONSTANTS` 和连词 `CONJUNCTION`。


    形容词是描述名词的词，如“金色的”或“魔法的”。如果将形容词加入游戏的词汇中，玩家就能描述不同类型的宝藏对象。与其其输入“拿起戒指”，如果当前房间里有几枚戒指，而你写下“拿起戒指”，游戏可以回答：“你是指金戒指、银戒指还是钻石戒指吗？”你需要在
    `Adventure.parser` 中向游戏词汇添加形容词，并添加适当的字段（以区分金戒指和钻石戒指等）来扩展 `Adventure.cs` 中的命令处理方法，以便处理形容词。


    如果你想添加连词“and”（和），玩家就可以链式执行命令，例如“拿起剑并将其放入箱子”。连词会让命令处理变得稍微复杂一些，只要你只允许单词顺序（由 `Adventure.parser`
    中的方法处理），你就可以尝试将单个完整的命令识别为“拿起剑”，然后当发现连词“and”时，寻找另一个完整的命令，如“将其放入箱子”。在这个示例中，我们已经有一个方法
    `ProcessVerbNoun()` 来处理“拿起剑”，以及另一个方法 `ProcessVerbNounPrepositionNoun()` 来处理“将其放入箱子”。唯一的额外复杂之处在于识别“它”指的是哪一个。这不是一个难题，但在使用连词时，你需要记住这一点。


    # 更多介词


    你还可以添加更多介词，如“with”（用）、“onto”（在……之上）和“under”（在……之下）。这将允许诸如“用枪射射龙”、“把剑放在桌子上”等命令。如果你不确定哪些单词是介词，可以查看在线字典，它们会列出最常见的例子。添加介词并不困难，但你需要意识到它们经常会改变一个对象相对于另一个对象的关系——一个在地毯*下面*的对象就像在容器*内部*的对象：多个对象可能“在这里”但不可见；所以你需要扩展代码来处理这种情况。简之之，对游戏词汇的小幅更改可能需要代码的大改。


    # 编写谜题


    现在我们已经为完整的游戏奠定了坚实的基础，是时候开始编写谜题了。这才是乐趣所在。我无法告诉你添加哪些谜题——可能性是无限的，仅限于你的想象。如果你玩过一些冒险游戏，你可能对想添加的谜题类型已经有了想法。你可能想从零开始编写自己的游戏——它可能是一个带有龙和武士的奇幻游戏；它可能是一个设定在太空的科幻游戏；也可能是一个设定在
    1930 年代纽约的侦探游戏。任何可以写下的都可以程序化为冒险游戏。


    我创建的 *darkneon* 示例游戏是一个“蒸汽朋克”式的未来维多利亚背景。把它想象成某种“杰杰·大破手遇上银翼杀手”的场景。它发生在一个充满巷弄和嘶嘶气灯的黑暗、蜿蜒城市里。在一个地方有一个大型公共公园，有一个由铸铁和玻璃制成的华丽棕榈房。有一棵可以爬的橡树和一个可以进入的废弃商店。周围散落着各种物体，包括被啃过的骨头、硬币、灯和和橡果。有一个可以拉的杠杆，一个可以按的按钮，还有一个袋子、垃圾桶和一个箱子——它们都是可以放置对象的容器。


    如果你想继续将其开发成一个完成的游戏（非常欢迎这样做——我只要求你在 *Adventure.cs* 代码文件开头的注释中包含我的版权声明）。让我给你一些关于你如何扩展示例游戏的想法。


    显然，你可能想做的第一件事是添加新的房间和新的宝藏。原则上，地图可以包含数百个链接的房间。只需确保通过绘制地图并检查由 *Room* 对象定义的出口指向“相邻”房间来跟踪所有的连接即可。


    然后，思考由发生的事件所启发的谜题。例如，当玩家进入花园时，一只松鼠拿着珍珠跑出来然后逃了。如果你能得到珍珠，它将是一个很好的宝藏。但每当你看到它时它都逃跑，该怎么得到它呢？也许如果你发现了一个橡果——松鼠可能会拿走橡果，因为现在手满了，就会掉下珍珠？


