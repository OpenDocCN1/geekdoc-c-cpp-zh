    # Appendix


    What language was Zork written in originally?


    It was written in a language called Muddle (MDL) – an ‘AI’ language developed
    at MIT.

    It’s like LISP – it’s a recursive structure-oriented, user extensible language.
    People who know LISP can look at Muddle and sort of figure out they’re doing.


    If it’s so similar to LISP, why didn’t you just use LISP?


    Because Muddle was the language that our research group used. When we moved to
    Infocom we wrote another language especially for implementing Zork – that was
    ZIL – very much like Muddle itself but adapted specially to deal with adventure
    games.


    What’s the difference between ZIL and a more standard version of LISP such as
    Common LISP?


    The most obvious difference is that instead of having parentheses it has angle
    brackets. That’s the first thing that would strike a LISP user as being strange.
    Another that, ZIL has in it operations for the kind of things that are useful
    in adventure games – moving one object from one place to another and very quickly
    checking to see if an object has a particular property. But there’s nothing in
    it that couldn’t easily be implemented in a good LISP system.


    How ZIL developed over the years You’ve had several different versions as I understand
    it.


    Oh, absolutely. In the first version the actual game was 128K and there was a
    maximum of 256 objects – and that includes rooms as well as treasures and so on.
    In ZIL, the rooms and the objects are represented in the same way. But at present
    the maximum game size is 256K and there is, in effect no limit to the number of
    rooms and objects. There are other changes too. Up till now our development system
    has been run on a DEC 20 but now we’re moving it onto a Mac II. The Dec 20, although
    we love it and wish it would stay around forever, is unfortunately obsolete. It’s
    a huge, expensive mainframe computer. It costs a lot to maintain. It really quite
    a drain on resources and we think the Mac should be a lot more manageable.


