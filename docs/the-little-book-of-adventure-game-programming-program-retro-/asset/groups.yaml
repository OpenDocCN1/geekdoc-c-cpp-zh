    # Introduction


    ![](img/79557530489e53febfe5a6898863b83c_13_0.png)


    The author with just a few of the classic Infocom adventure games he''s played
    over the years!


    # I – A Short Guide to Adventure Games


    West of House. You are standing in an open field west of a white house, with a
    boarded front door. There is a small mailbox here.


    That is my interest in computer programming really began. This was back in the
    early 1980s. I''d used word processors and I''d used spreadsheets but neither
    of those fired up my imagination. It was only when I played Infocom''s Zork adventure
    game that I really started to become fascinated in how computers actually worked.


    ![](img/79557530489e53febfe5a6898863b83c_14_0.png)


    In the screenshot above, I am running Zork 1 (the first part of the Zork trilogy)
    inside the DOSBox operating system emulator (available from https://www.dosbox.com/).
    I have entered commands such as "read the leaflet" after the > prompt. The remaining
    text has been displayed by the game.


    # – A Short Guide to Adventure Games


    ## What is an Adventure Game?


    An adventure game – specifically a text adventure game – takes place in a complex
    world of connected locations. The world, the locations and all the creatures and
    treasures it contains are described with words, not images. Some adventure games
    also provided graphics but the real classics of the genre, such as Zork, were
    all about words.


    The thing that fascinated me about Zork when I first played it was how its world
    was so vast yet internally consistent. You could put a lantern into a sack and
    then go wandering along paths through forests, climb trees, open doors and explore
    a gigantic cave network that made the Great Underground Empire. After hours of
    exploring you would eventually come back to the house and see the sack. Inside
    the sack and there was the lantern – just as I''d left it.


    How did the game ‘remember’ that I’d put the lantern into the sack, several hours
    earlier, even though I had forgotten that I’d done so? I really had no idea how
    computers worked at time. In Zork, I collect treasures, put objects inside containers,
    solve puzzles and explore the seemingly vast world of Zork. There were no graphics
    but the descriptions were so vivid as that, just when reading a novel, the world
    took on an immersive reality. I could even talk to the game by entering English
    commands: “Take the sword”, “Light the lantern”, “Climb the tree”, “Put the magic
    ring into the sack,” and so on.


    ## Interactive Fiction


    Text adventures are sometimes called ‘interactive fiction’ or ‘IF’ for short.
    This emphasises the story-telling aspect of this type of game. Some adventure
    games provide long descriptive passages and the player can enter text to ask for
    more information, look at objects and interact with the game in other ways.


    I became so intrigued by Zork that I soon decided to program a game of my own.
    Back in those days there was no worldwide web, no Wikipedia, no YouTube, no Amazon
    and no books (that I could find) which explained how to do it. I had to learn
    by trial and error.


    # I - A Short Guide to Adventure Games


    ![](img/79557530489e53febfe5a6898863b83c_16_0.png)


    The shot above shows part of the game play from The Golden Wombat Of Destiny.
    Just as in Zork, the player can enter fairly complex commands such as “Put the
    coin in the kennel!” and the game responds appropriately.


    Retrospect, for a novice programmer, learning to program by writing a game of
    that complexity was a stupidly ambitious thing to do. When I began it, I knew
    nothing about programming. By the time I finished writing The Golden Wombat, I
    was a moderately experienced programmer, so I was horrified to see all the ugly
    code I had written (and which now solidly welded into the game) when I had been
    a beginner. Suffice to say, it was a huge learning experience!


    The other big limitation I faced when writing that game was that the language
    I was using — Pascal was far from ideal for the project. Object Oriented Programming
    (OOP) was not common in those days and Pascal had no object oriented features
    at all. The modern version of Turbo Pascal (Object Pascal and Delphi) has OOP.
    And so do many other mainstream languages such as Ruby, Python, Java and C#. Orientation
    is for writing adventure games because the rooms and textures are naturally represented
    by objects.


    Today, I still think that writing an adventure game is a wonderful way to develop
    your programming skills. Unlike modern fast-action graphics games, a text adventure
    can be written from start to finish by a single programmer without having to use
    complicated third-party ‘game frameworks’. In the process of writing an adventure
    game you will need to use a very broad range of programming techniques – to create
    hierarchies, serialize (save) objects to and from disk, deal with error-handling
    and even parse user input into meaningful human-language commands.


    When I wrote my first game, I had to work out how to do everything for myself.
    Now you have this book to guide you. I''ll explain everything you need to know
    about adventure-game writing from your first simple ''room'' to a complex game
    with a huge map of connected rooms containing numerous treasures. I will use the
    C# language most of the time and the appendix also provides some help on translating
    C# to other languages. All the source code (in C# and other languages) is also
    available as a free download. I believe this book is the most comprehensive guide
    available to writing text adventures. I hope you have fun!


    ## A Brief History of Adventure Games


    While it''s impossible to know who wrote the very first adventure game, the first
    one to generate any interest among computer users was almost certainly Will Crowther''s
    Colossal Cave which is sometimes called the ''Original Adventure''. In addition
    to programming, Crowther was also a caving enthusiast who explains why his adventure
    game took place in a massive caving system. Colossal Cave was developed between
    1975 and 1977 and was finished with the assistance of another programmer, Don
    Woods. Their game was written in FORTRAN and ran on a PDP-10 mainframe computer.


    ![](img/79557530489e53febfe5a6898863b83c_17_0.png)


    The next big step in the evolution of adventure games came with the release of
    Zork. This game owed a huge debt to Colossal Cave, including the underground network
    that formed a large part of the Zork world. Zork was developed by a team of programmers
    at MIT, led by Dave Lebling.


    For more on Zork, be sure to read my interview with Dave Lebling in the appendix.


    # I — A Short Guide to Adventure Games


    Zork was originally written in the MDL programming language, once again on a PDP-10.
    MDL was a language based on theISP list processing language. Later the game was
    rewritten several times and the most famous implementation was written in ZIL
    (Zork Implementation Language), another LISP-like language developed specifically
    for writing games. Zork was eventually released in a version that could run on
    personal computers when the Infocom games company was founded in 1979.


    Infocom dominated the field of adventure games with titles such as Starcross,
    The Hitchiker''s Guide To The Galaxy and Trinity. One of the improvements Infocom
    made to the earlier Colossal Cave game was a better ‘parser’ to interpret simple
    human language commands. Colossal Cave was limited to two word commands such as
    “Take sword”. Infocom games allowed longer commands such as “Put the Elvish sword
    into the sack”.


    ## Programming Concepts and Terminology


    I won''t be explaining programming terminology in great detail in this book. I
    have other books that teach programming from the ground up. For example, The Little
    Book Of C# provides a step-by-step guide to C# programming. The Appendix of this
    book provides short definitions of some common programming terms.


    ## The Adventure Begins ...


    OK, so now you have a bit of background on adventure games, it''s time to start
    programming. Before the player can explore the game, we need to create a game
    ‘world’. Our world takes the form of linked locations. The first thing we need
    to do is create some locations and put them onto a map...

    '
