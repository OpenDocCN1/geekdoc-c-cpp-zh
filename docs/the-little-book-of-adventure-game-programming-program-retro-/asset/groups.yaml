  - '[PAGE 54]


    # 6 – Collections of Treasures


    Now that we have a map and a player we need to add some treasures that the player
    will be able to take from one room and drop in another room.


    The foundations of the game are all in place. We have rooms stored in a map and
    the player is able to move from room to room. What we haven''t yet got is the
    ability for the player to collect treasures. Before we do that, we need to be
    able to add lists of treasures to rooms.


    The player will also need to be able to store a list of treasures. And there will
    need to be some way to transfer treasures from one list to another – from the
    room to the player''s inventory when the player takes a treasure; and from the
    inventory to a room when the player drops a treasure. I''ve added all these capabilities
    to the game09 project.


    # Treasure Lists


    Since both the player and the rooms need to hold lists of objects, it makes sense
    to add a list not to the Room and Actor classes individually but to a common ancestor
    class. That way, instead of implementing the list twice, the Room and the Actor
    class will inherit the same set of list management capabilities from their ancestor.


    Up to now Room and Actor have descended directly from the Thing class. The Thing
    class is a very simple class and I want to stay that way! It is good object oriented
    design to keep a base class small and ‘generic'' and to place more specialized
    features (such as list management) in descendant classes. If I were to add list
    management to the Thing class then all other classes would inherit lists. That
    is not what I want.


    So since I want an ancestor of Room and Actor to include a list but currently
    their ancestor has no list, what am I to do? My solution is to create an intermediate
    class – one that goes between the base class, Thing, and the more specialized
    classes, Actor and Room. In game09 I created a class called ThingHolder to maintain
    a list of things. It can add one or more things to its list using the AddThing()
    or AddThings() methods and it has a property called Things which returns the list:'
