    9 – The Command Parser


    # 9 – The Command Parser


    “Take the lantern”, “Look at the goblin” – the original text adventures understood
    commands like these when entered by the player. So will our game!


    All the classic adventure games from the 1970s and 1980s accepted natural language
    commands – words entered by the user at a prompt: “Take the sword”, “Climb the
    tree” and so on. That was true of all the classic adventure games including Colossal
    Cave, Infocom games such as Zork and my own game, The Golden Wombat Of Destiny.


    None of those games had a very sophisticated parser – by which I mean the part
    of the program that analyzes words into meaningful commands. In fact Colossal
    Cave only allowed one or two word commands such as “take sword” or “drop lamp”.
    The Infocom parser, and the parser in The Golden Wombat Of Destiny, could handle
    more complicated commands such as “Put the coin into the slot”. So, their ability
    to “understand” English was extremely limited. The games understood just enough
    to let the player communicate using basic instructions. In this lesson we will
    look at one way of creating a simple parser so that the player can enter short
    English language commands.


    # One-word and Multiple-word commands


    At its simplest, our parser will be able to process one-word or even one-letter
    commands such as “N”, “S”, “W”, “E” to move the player in the compass directions:
    North, South, West and East. It will also need to understand two word commands
    such as “Take sword” and “Drop lantern”, three word commands such as “Look at
    sword” and four word commands such as “Put lantern in box”.


    In addition, I want to allow determine words or ‘articles’ such as the definite
    article, “the” and the indefinite articles, “a” and “an” so the player will be
    able to enter commands such as “Put the lantern into the box” and so forth. I
    am not going to do any clever grammatical analysis. I am going to allow the articles
    to be used and then I will completely ignore them. In my long experience of playing
    adventure games, I noticed that game players are most unlikely to write long and
    difficult sentences. They usually stick to short and simple commands so there
    is really no point in trying to write a


