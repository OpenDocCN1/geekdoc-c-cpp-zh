    # 4 – Rooms in a Dictionary


    Up to now I''ve used an array to store the map of my rooms. An array is a fixed
    length list of elements. Now let''s look at another type of list called a dictionary.


    The array which I''ve been using for my map finds me a room at a numerical index.
    For example, I could find the room at index 2 in an array called map by placing
    the index between square array name map[2].


    Many languages such as C#, Java, Ruby (and many others) also provide lists that
    can be indexed using non-numeric data types. This sort of list is called a dictionary.
    In my game, I think it would be useful to index rooms stored in a list using descriptive
    names such as Troll or Forest rather than integers as 1 or 2. So I am going to
    re-implement my map as a dictionary.


    # Dictionaries, Associative Arrays and Hashes


    Dictionaries are sometimes called “hashes” or “associative arrays”. Usually these
    terms mean more or less the same thing. However, some languages have ‘special
    purpose’ types of dictionary which may use different names. In this book, I will
    use the term ‘dictionary’ very broadly to describe any list that takes the form
    of key-value pairs.


    # Key-Value Pairs


    A dictionary takes the form of pairs of elements. In C#, the first element is
    the key. The associated element is the value. In C#, a key can be an integer,
    a string or some other type of object. You use the key to find its associated
    value.


    In that sense it is a bit like a real-world dictionary. The name of each entry
    in a dictionary is the key. The definition is the value. If the key is “dog”,
    that word can be used to locate the entry for “dog” in the dictionary and that
    takes me its value (the definition), which says “A four legged animal that goes
    woof!”'
