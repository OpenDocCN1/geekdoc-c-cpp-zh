- md: "\n# Appendix\n\nWhen de-serializing objects, you would need another routine\
    \ that reads back the size and data that you previously saved and then reads in\
    \ the correct number of bytes when initializing each data field.\n\nI wrote a\
    \ simple game in Object Pascal (Delphi) in which each class contains two virtual\
    \ methods called WriteToStream() and ReadFrom() that do this. As with the other\
    \ samples mentioned here, the code is all available in the source code archive\
    \ which can be downloaded from the Bitwise Web site.\n\nIn my Delphi project,\
    \ this is how a Thing object saves and loads its data:\n\n```pascal\nprocedure\
    \ Thing.WriteToStream(fs: TFileStream)\nvar\n  currentClassName: string;\nbegin\n\
    \  currentClassName := self.classname;\n  fs.WriteBuffer(currentClassName, sizeof(currentClassName));\n\
    \  fs.WriteBuffer(_name, sizeof(_name));\n  fs.WriteBuffer(_description, sizeof(_description));\n\
    end;\n\nprocedure Thing.ReadFromStream(fs: TFileStream)\nbegin\n  fs.ReadBuffer(_name,\
    \ sizeof(_name));\n  fs.ReadBuffer(_description, sizeof(_description));\nend;\n\
    ```\n\nClearly, this requires some careful coding since each object has to be\
    \ capable of writing the correct amount of data into a stream (a sequence of bytes).\
    \ When the saved data is reloaded, each object has to be recreated and initialized\
    \ with the saved data. That's quite tricky (and error-prone) to program. As I\
    \ said, many OOP languages have serialization capabilities 'built in' so in all\
    \ probability you won't need to write your own serialization methods. But my Object\
    \ Pascal example shows that it can be done if you absolutely need to.\n\n# Add\
    \ More Interaction\n\nOnce you have a map, a player that can move around taking\
    \ and dropping things and an ability to save and restore all the object data,\
    \ the 'core' of your game is pretty much complete. From here on, it's just a matter\
    \ of refining the game by adding more commands – “look”, “look at”, “pull”, “push\"\
    \ and so on. It should be easy to translate my C# code to deal with. Then it's\
    \ time to add more puzzles. And those are limited only by your imagination. Good\
    \ luck!\n\n# Programming a Command-line Game\n\nIn the C# projects described in\
    \ this book I have used the visual interface capabilities of Windows Forms in\
    \ order to design and code a game that has drop-down menus, buttons, text fields\
    \ and so on. But what if you want to create a really retro game, just like the\
    \ Infocom games of the 1980s, which run from a command-line with nothing but a\
    \ command prompt as a user interface?\n\nIt is straightforward to convert your\
    \ Windows Forms games to command-line games. When I write the final version of\
    \ my game (the *darkneon* project) I spent some time ‘tidying up’ the program\
    \ to ensure that the code in Form1.cs contains very little code apart from method-handlers\
    \ for user interface controls. Then I can easily remove Form1.cs from my project\
    \ and replace it with code to interact with the command-line. That is what I’ve\
    \ done in the *darkneonconsole* project which is supplied in the code archive.\n\
    \n# C# Console Applications\n\nTo create a command-line program in Visual Studio,\
    \ select File, New Project, then go to C# Console App.\n\nInstead of Form1.cs,\
    \ the user interface of my game has been put into a new class called GameRunner\
    \ in the GameRunner.cs code file. The Program.cs file, which runs when the program\
    \ starts, simply creates a GameRunner object in the Main() function:\n\n| darkneonconsole\
    \ (Program.cs) |\n| :--- |\n| static void Main(string[] args) { |\n| GameRunner\
    \ gr = new GameRunner(); |\n| } |\n\nThe GameRunner constructor calls InitGame()\
    \ and that creates the Adventure object, adv, just as in previous projects. It\
    \ then calls StartGame() which begins by displaying some text welcoming the player\
    \ to the game and then running a loop. This is the important bit:\n\n```csharp\n\
    do {\n    Console.Write(\"> \");\n    input = Console.ReadLine().ToLower();\n\
    \    output = save_or_load(input);\n    if (output == \"\") {\n        output\
    \ = adv.RunCommand(input);\n    }\n    Console.WriteLine(output);\n} while (output\
    \ != \"q\");\n```\n\n# Appendix\n\nThe code in this loop prompts the player to\
    \ enter commands after the \"> \" prompt. It reads a line of text using Console.ReadLine()\
    \ and sets it to lowercase. It then checks to see if the command was to save or\
    \ load a game (more on that later). If not (that is, if the output variable is\
    \ an empty string) it passes the user input to the adv.RunCommand() method. This\
    \ returns a string which is assigned to the output variable and that string is\
    \ displayed.\n\nThe loop here has to keep running – reading commands, passing\
    \ them to the adv.RunCommand() method for processing and displaying any output\
    \ on screen – for as long as the game is being played. Of course, we need some\
    \ way to end the game and here the end condition occurs when the player enters\
    \ \"q\" to quit. The loop runs as long as \"q\" was not entered:\n\n```csharp\n\
    while (output != \"q\");\n```\n\nI've had the routines to save and load a game\
    \ because the previous version used a file dialog box to select a file and return\
    \ a stream. The serialization, however, works pretty much as before. To save or\
    \ load a game in this program you must enter \"save\" or \"load\" at the command\
    \ prompt, then, when asked for a file name, enter the name of a game file:\n\n\
    ![](img/79557530)\n\n# Appendix\n\nBe aware that I haven't done much error checking\
    \ so if you plan to develop this game further you should add code to verify that\
    \ name is correct and that file exists. The comment provides some ideas on how\
    \ to make these routines robust:\n\ndarkneonconsole (GameRunner.cs)\n\n```csharp\n\
    public string SaveGame() {\n    FileStream fs;\n    BinaryFormatter binfmt;\n\
    \    string filename;\n    string msg = \"saved\";\n    Console.Write(\"Enter\
    \ filename to save: \");\n    filename = Console.ReadLine();\n    fs = new FileStream(filename,\
    \ FileMode.Create);\n    binfmt = new BinaryFormatter();\n    try {\n        binfmt.Serialize(fs,\
    \ adv);\n    } catch (SerializationException e) {\n        msg = \"Save failed:\
    \ \" + e.Message;\n    } finally {\n        fs.Close();\n    }\n    return msg;\n\
    }\n\npublic string LoadGame() {\n    FileStream fs;\n    BinaryFormatter binfmt;\n\
    \    string filename;\n    string msg = \"loaded\";\n    Console.Write(\"Enter\
    \ filename to load: \");\n    filename = Console.ReadLine();\n    fs = new FileStream(filename,\
    \ FileMode.Open);\n    binfmt = new BinaryFormatter();\n    try {\n        adv\
    \ = (Adventure)binfmt.Deserialize(fs);\n    } catch (SerializationException e)\
    \ {\n        msg = \"Load failed: \" + e.Message;\n    } finally {\n        fs.Close();\n\
    \    }\n    return msg;\n}\n```\n\n# Appendix\n\nI've also added an 'inventory'\
    \ or 'i' command was invoked by a button on form of objects owned by the player\
    \ (previously this command was invoked from a button on them. And about it. As\
    \ before, the RunCommand() method is the starting point for making sense of commands\
    \ that were entered:\n\n```csharp\npublic string RunCommand(string inputstr) {\n\
    \    char[] delims = { ' ', '.' };\n    List<string> strlist;\n    string s =\
    \ \"\";\n\n    string lowstr = inputstr.Trim().ToLower();\n    if(lowstr == \"\
    \") {\n        s = \"You must enter a command\";\n    } else {\n        strlist\
    \ = new List<string>(inputstr.Split(delims, StringSplitOptions.RemoveEmptyEntries));\n\
    \        s = ParseCommand(strlist);\n    }\n    return s;\n}\n```\n\nOnce a string\
    \ is passed to RunCommand(), the code executes the same process of parsing the\
    \ string and acting upon various types of commands as in the darkneon project.\n\
    \nSo, by keeping all the user-interface code all in one place, I've been able\
    \ to transform my Windows Forms game into a command-line game with very little\
    \ effort. This demonstrates one advantage of keeping your code 'modular'! Incrementally,\
    \ the command-line game could now be fairly easily deployed on other operating\
    \ systems such as Linux and macOS that support .NET Core but not Windows Forms.\n"
  mdcn: "\n\n# 附录\n\n在反序列化对象时，你需要另一个例程来读取你之前保存的大小和数据，然后在初始化每个数据字段时读取正确的字节数。\n\n我用\
    \ Object Pascal (Delphi) 编写了一个简单的游戏，其中每个类都包含两个名为 `WriteToStream()` 和 `ReadFrom()`\
    \ 的虚方法来执行此操作。与这里提到的其他示例一样，所有代码都可以在源码存档中找到，你可以从 Bitwise 网站下载。\n\n在我的 Delphi 项目中，`Thing`\
    \ 对象是这样保存和加载其数据的：\n\n```pascal\nprocedure Thing.WriteToStream(fs: TFileStream)\n\
    var\n  currentClassName: string;\nbegin\n  currentClassName := self.classname;\n\
    \  fs.WriteBuffer(currentClassName, sizeof(currentClassName));\n  fs.WriteBuffer(_name,\
    \ sizeof(_name));\n  fs.WriteBuffer(_description, sizeof(_description));\nend;\n\
    \nprocedure Thing.ReadFromStream(fs: TFileStream)\nbegin\n  fs.ReadBuffer(_name,\
    \ sizeof(_name));\n  fs.ReadBuffer(_description, sizeof(_description));\nend;\n\
    ```\n\n显然，这需要一些仔细的编码，因为每个对象都必须将正确数量的数据写入流（字节序列）。当重新加载保存的数据时，每个对象都必须被重新创建并使用保存的数据进行初始化。编写这种程序相当棘手（且容易出错）。正如我所说，许多\
    \ OOP 语言都“内置”了序列化功能，因此在大多数情况下，你不需要编写自己的序列化方法。但我的 Object Pascal 示例表明，如果你绝对需要，这是可以实现的。\n\
    \n# 添加更多交互\n\n一旦你有了地图、一个可以移动、拾取和丢弃物品的玩家，以及一个保存和恢复所有对象数据的能力，你游戏的“核心”就基本完全完成了。从这里开始，只需要通过添加更多命令来完善游戏——“look（看）”、“look\
    \ at（看一眼）”、“pull（拉）”、“push（推）”等。处理我的 C# 代码应该是很容易的。然后是时候添加更多谜题了。而这些谜题仅限于你的想象力。祝你好运！\n\
    \n# 编写命令行游戏\n\n在本书描述的 C# 项目中，我利用了 Windows Forms 的可视化界面能力来设计并编写了一个具有下拉菜单、按钮、文本框等的游戏。但如果你想创建一个真正的复古游戏，就像20\
    \ 世纪 80 年代的 Infocom 游戏那样，从命令行运行，只有一个命令提示符作为用户界面，该怎么办？\n\n将你的 Windows Forms 游戏转换为命令行游戏是非常简单的。当我编写我的游戏最终版本（*darkneon*\
    \ 项目）时，我花了一些时间“整理”程序，以确保 `Form1.cs` 中的代码除了用户界面控件的方法处理器外，只包含极少的代码。然后我就可以轻松地从项目删除删除\
    \ `Form1.cs`，并用与命令行交互的代码替换它。这就是我在代码存档中提供的 *darkneonconsole* 项目中所做的。\n\n# C# 控制台应用程序\n\
    \n要在 Visual Studio 中创建命令行程序，请选择文件（File）、新建项目（New Project），然后转到 C# 控制台应用（C# Console\
    \ App）。\n\n与其使用 Form1.cs，我的游戏用户界面被放在一个名为 `GameRunner` 的新类中，位于 `GameRunner.cs`\
    \ 代码文件中。程序启动时运行的 `Program.cs` 文件在 `Main()` 函数中简单创建一个 `GameRunner` 对象：\n\n| darkneonconsole\
    \ (Program.cs) |\n| :--- |\n| static void Main(string[] args) { |\n| GameRunner\
    \ gr = new GameRunner(); |\n| } |\n\n`GameRunner` 构造函数调用了 `InitGame()`，它像在之前的项目一样创建了\
    \ `Adventure` 对象 `adv`。然后它调用 `StartGame()`，该方法首先显示一些欢迎玩家进入游戏的文本，然后运行循环。这是关键部分：\n\
    \n```csharp\ndo {\n    Console.Write(\"> \");\n    input = Console.ReadLine().ToLower();\n\
    \    output = save_or_load(input);\n    if (output == \"\") {\n        output\
    \ = adv.RunCommand(input);\n    }\n    Console.WriteLine(output);\n} while (output\
    \ != \"q\");\n```\n\n# 附录\n\n此循环中的代码提示玩家在 `> ` 提示符后输入命令。它使用 `Console.ReadLine()`\
    \ 读取一行文本并将其设置为小写。然后它检查命令是否为保存或加载游戏（稍后会详细介绍）。如果不是（即 `output` 变量为空字符串），它将将用户输入传递给\
    \ `adv.RunCommand()` 方法。该方法返回一个字符串并赋值给 `output` 变量，然后显示该字符串。\n\n只要游戏在进行，这里的循环就一直运行——读取命令、将其传递给\
    \ `adv.RunCommand()` 方法进行处理并在屏幕上显示任何输出。当然，我们需要一种结束游戏的方法，在这里，结束条件是玩家输入 \"q\" 退出。只要没有输入\
    \ \"q\"，循环就会运行：\n\n```csharp\nwhile (output != \"q\");\n```\n\n我有了保存和加载游戏的例程，因为之前的版本使用文件对话框来选择文件并返回流。然而，序列化的工作原理与之前基本无异。要在此程序中保存或加载游戏，你必须在命令提示符处输入“save”或“load”，然后当要求文件名时，输入游戏文件的名称：\n\
    \n![](img/79557530)\n\n# 附录\n\n注意，我没有做很多错误检查，如果你计划进一步开发此游戏，应该添加代码验证名称是否正确以及文件是否存在。注释提供了如何让这些例程更健壮的想法：\n\
    \ndarkneonconsole (GameRunner.cs)\n\n```csharp\npublic string SaveGame() {\n \
    \   FileStream fs;\n    BinaryFormatter binfmt;\n    string filename;\n    string\
    \ msg = \"saved\";\n    Console.Write(\"Enter filename to save: \");\n    filename\
    \ = Console.ReadLine();\n    fs = new FileStream(filename, FileMode.Create);\n\
    \    binfmt = new BinaryFormatter();\n    try {\n        binfmt.Serialize(fs,\
    \ adv);\n    } catch (SerializationException e) {\n        msg = \"Save failed:\
    \ \" + e.Message;\n    } finally {\n        fs.Close();\n    }\n    return msg;\n\
    }\n\npublic string LoadGame() {\n    FileStream fs;\n    BinaryFormatter binfmt;\n\
    \    string filename;\n    string msg = \"loaded\";\n    Console.Write(\"Enter\
    \ filename to load: \");\n    filename = Console.ReadLine();\n    fs = new FileStream(filename,\
    \ FileMode.Open);\n    binfmt = new BinaryFormatter();\n    try {\n        adv\
    \ = (Adventure)binfmt.Deserialize(fs);\n    } catch (SerializationException e)\
    \ {\n        msg = \"Load failed: \" + e.Message;\n    } finally {\n        fs.Close();\n\
    \    }\n    return msg;\n}\n```\n\n# 附录\n\n我还添加了“inventory（库存）”或“i”命令，该命令以前是由玩家拥有的对象上的按钮调用的。关于它。和之前一样，`RunCommand()`\
    \ 方法是理解所输入命令的起点：\n\n```csharp\npublic string RunCommand(string inputstr) {\n \
    \   char[] delims = { ' ', '.' };\n    List<string> strlist;\n    string s = \"\
    \";\n\n    string lowstr = inputstr.Trim().ToLower();\n    if(lowstr == \"\")\
    \ {\n        s = \"You must enter a command\";\n    } else {\n        strlist\
    \ = new List<string>(inputstr.Split(delims, StringSplitOptions.RemoveEmptyEntries));\n\
    \        s = ParseCommand(strlist);\n    }\n    return s;\n}\n```\n\n一旦字符串传递给\
    \ `RunCommand()`，代码就会执行与 darkneon 项目相同的解析字符串并处理各种类型命令的过程。\n\n因此，通过将所有的用户界面代码放在一个地方，我能够以极小的努力将我的\
    \ Windows Forms 游戏转换为命令行游戏。这证明了保持代码“模块化”的优势之一！渐进地，该命令行游戏现在可以相当容易地在支持 .NET Core\
    \ 但不支持 Windows Forms 的其他操作系统（如 Linux 和 macOS）上。\n\n"
