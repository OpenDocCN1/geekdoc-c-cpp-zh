    \ similar feature (which may be called something as ‘package’, ‘unit’ or ‘module’).\
    \ A namespace defines the ‘scope’ or ‘visibility’ of the code it contains.\n\n\
    I've decided to put the essential classes of my game into a namespace gameclasses\
    \ which is under the ‘top-level’ namespace, game. When namespaces are organised\
