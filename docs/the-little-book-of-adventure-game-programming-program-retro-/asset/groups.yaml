    # 10 – Putting Objects into Containers


    # 10 – Putting Objects into Containers


    If your game has treasure chests, sacks, cupboards and boxes, the player should
    be able to put things into them. In this chapter, we''ll find out how to program
    that.


    In previous versions of my game, treasure objects could only exist either in a
    room or in the player''s inventory. When an object was taken it was added to the
    inventory; when it was dropped it was added to the list of objects in the current
    room. But maybe you want your game to have objects such as treasure chests, bags,
    sacks or cupboards. All of those objects should be able to contain other objects.
    That means that we need some way of putting one object into another object. But
    we also want to make sure that only certain objects can act as containers. It
    would be pretty silly to let the player “Put the lantern into the sword”, for
    example.


    ![](img/79557530489e53febfe5a6898863b83c_88_0.png)


    # The ContainerThing Class


    In the darken project, I have a ContainerThing class which is used for creating
    container objects. You can see the full code listing of this class on the next
    page. ContainerThing is a descendant of ThingHolder, which is the class that handles
    objects that can contain lists of other objects. The ContainerThing class has
    two new properties, Openable and IsOpen. I don''t allow things to be put into
    containers that aren''t open. ContainerThing has Open() and Close() methods that
    change the state of the _isopen data field.'
