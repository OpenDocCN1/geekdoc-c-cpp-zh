- md: "\n# The darkneon Class Hierarchy\n\n| Thing | Description |\n| --- | --- |\n\
    | Name | Takable Movable |\n\nThingHolder\nThings\n\n| Actor | Room | ContainerThing\
    \ |\n| --- | --- | --- |\n| Location | N S W E Up Down | Openable IsOpen |\n\n\
    This is the principal class hierarchy of the darkneon game. This shows the class\
    \ names and properties only (but not the methods). Bear in mind that I have also\
    \ created two other classes, ThingList and RoomList, to manage lists. \n\nThe\
    \ ThingList class is a list of Thing objects. The Things property (giving access\
    \ to the private _things field) defined in ThingHolder and its descendants is\
    \ an instance of ThingList. The map is a RoomList. My RoomList class is a Dictionary\
    \ of key/value pairs that are typed to accept a Rm constant as a key and a Room\
    \ object as a value.\n\n# What Next?\n\nThe darkneon game now has all the essential\
    \ features of a fully-formed text adventure. It has a map containing rooms that\
    \ have exits leading in any of the four compass directions 'up' and 'down'. It\
    \ has a player which can move freely around the map. It has treasures that can\
    \ be found in rooms and taken or dropped by the player. It has containers into\
    \ which treasures can be placed and those containers may be opened or closed.\n\
    \nIt also has a simple English language parser so that it is possible to interact\
    \ with the game by writing short commands such as 'Take the sword' or 'Put the\
    \ ring into the sack'. So what is left to do?\n\nIn fact, there is a great deal\
    \ that you can do in order to turn what is, in effect, a 'game framework' – a\
    \ set of classes and methods required to write a game – into your own adventure\
    \ game. Let's first consider a few technical improvements that can be made: some\
    \ additions to the fundamental features of the code.\n\n# Taking Container Objects\n\
    \nAt present, all one of the containers in the game are fixed in place (that is,\
    \ they are not takeable). But what would happen if there were a container object\
    \ that can be taken? The sack in the first room can be taken, so try doing so.\
    \ Take the sack, take the leaflet, then put the leaflet into the sack.\n\nSo far,\
    \ so good. But now try to take the leaflet again. It can't be done because the\
    \ leaflet, according to the current code logic, isn't here. It is only here if\
