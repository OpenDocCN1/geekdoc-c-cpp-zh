    # 10 — Putting Objects into Containers


    Where might you find an acorn?


    Oh, look! In another part of the garden there''s an oak tree. When you climb the
    tree, you see that there''s an acorn in it. So maybe you can take the acorn, go
    back to the garden, drop it and then see if the squirrel takes it (it would have
    you to program the squirrel to behave differently when an acorn is there, of course).


    What''s that button on the wall in the Dead End? Surely maybe it happens to an
    object in another room? Maybe it opens the wooden chest in the bedroom? That contains
    a key. Where is that needed? Maybe the Palm House should have a locked door that
    opens the keys?


    There''s the rat in the attic—a lump of cheese in the kitchen. What would happen
    if I''ve gave the cheese to the rat? Now think of all the other things that might
    be used for special purposes. There''s a coin and a slot. What would happen if
    you put the coin into the slot? There''s a lever on the balcony. Something must
    happen when it is pulled. As for the bone and the bin and the blood-stained knife—they
    are all objects that might suggest puzzles for the player to solve. Let your imagination
    run riot when you figure out how they all fit together to create the plot of your
    game.


    # Over to You!


    So that''s it. You now know everything you need to write a classic-style text
    adventure I hope you''ve enjoyed delving into the capabilities of C# and .NET
    and I hope you may be inspired to try creating a game of your own. As I hope you''ve
    discovered, writing text adventure is quite a challenging project. But it is also
    a great deal of fun!


    If you''ve enjoyed this book, I would be enormously grateful if you could leave
    a short review on Amazon. Reviews are extremely important to a writer, and if
    you could take a minute or two to leave a review, that would mean a great deal
    to me.'
