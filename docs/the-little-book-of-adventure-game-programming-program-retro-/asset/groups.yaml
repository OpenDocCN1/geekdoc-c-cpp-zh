- md: "\n# 5 — Restructuring the Game\n\n## Debug With Visual Studio\n\nIf you are\
    \ using Visual Studio to try out the C# code provided with this book, run game08\
    \ in the debugger. Put breakpoints on the various button event-handlers, and also\
    \ on (at the very least) the final lines of code in the MoveTo() and MovePlayerTo()\
    \ methods. Then debug by pressing F5 to run until a breakpoint or F11 (Step Into)\
    \ and F10 (Step Over), then watch the values of variables in the Locals or Watch\
    \ window of the debugger.\n\nIncidentally, since MovePlayerTo() is the only one\
    \ of these three player-moving methods that's public, it is the only one that\
    \ can be called from the code in Form1.cs. I've made the MoveTo() and MoveActorTo()\
    \ methods private because it is possible I may want to call them to move other\
    \ actor objects around (interactive characters) in some future version of my game.\n\
    \nNow that I've tidied up the code of my game, I'm ready to start adding some\
    \ treasures. Treasures are objects located in various rooms. Sometimes the player\
    \ may want to collect some treasures. That is when things really start to get\
    \ interesting.\n\n# 6 – Collections of Treasures\n\nNow that we have a map and\
    \ a player we need to add some treasures that the player will be able to take\
    \ from one room and drop in another room.\n\nThe foundations of the game are all\
    \ in place. We have rooms stored in a map and the player is able to move from\
    \ room to room. What we haven't yet got is the ability for the player to collect\
    \ treasures. Before we do that, we need to be able to add lists of treasures to\
    \ rooms.\n\nThe player will also need to be able to store a list of treasures.\
    \ And there will need to be some way to transfer treasures from one list to another\
    \ – from the room to the player's inventory when the player takes a treasure;\
    \ and from the inventory to a room when the player drops a treasure. I've added\
    \ all these capabilities to the game09 project.\n\n## Treasure Lists\n\nSince\
    \ both the player and the rooms need to hold lists of objects, it makes sense\
    \ to add a list not to the Room and Actor classes individually but to a common\
    \ ancestor class. That way, instead of implementing the list twice, the Room and\
    \ the Actor class will inherit the same set of list management capabilities from\
    \ their ancestor.\n\nUp to now Room and Actor have descended directly from the\
    \ Thing class. The Thing class is a very simple class and I want to stay that\
    \ way! It is good object oriented design to keep a base class small and ‘generic'\
    \ and to place more specialized features (such as list management) in descendant\
    \ classes. If I were to add list management to the Thing class then all other\
    \ classes would inherit lists. That is not what I want.\n\nSo since I want an\
    \ ancestor of Room and Actor to include a list but currently their ancestor has\
    \ no list, what am I to do? My solution is to create an intermediate class – one\
    \ that goes between the base class, Thing, and the more specialized classes, Actor\
    \ and Room. In game09 I created a class called ThingHolder to maintain a list\
    \ of things. It can add one or more things to its list using the AddThing() or\
    \ AddThings() methods and it has a property called Things which returns the list:\n\
    \n```c\npublic class ThingHolder : Thing {\n    private ThingList _things = new\
    \ ThingList();\n\n    public ThingHolder(string aName\n```\n\nThingHolder is a\
    \ descendant of Thing. In order to add the features of the ThingHolder class to\
    \ both the Actor and Room classes, all I need to do is redefine the ancestors\
    \ of those classes. Previously Room and Actor descended directly from Thing. Now\
    \ I make them descend from ThingHolder. They still ultimately descend from Thing,\
    \ of course, because the ThingHolder itself descends from Thing. But their immediate\
    \ ancestor is now ThingHolder, so they inherit class's ThingList. I've also changed\
    \ the Room and Actor constructors to accept a new argument, which is a ThingList\
    \ object:\n\n```csharp\npublic Room(string aName, string aDescription, Rm aN,\
    \ Rm aS, Rm aW, Rm aE,\n    ThingList tl)\n\npublic Actor(string aName, string\
    \ aDescription, Room aRoom, ThingList tl);\n```\n\n## The ThingList class\n\n\
    My Room and Actor classes both maintain a list of objects stored in a ThingList.\
    \ Look at my declaration of this class:\n\n```csharp\npublic class ThingList :\
    \ List<Thing>\n```\n\nThis shows that ThingList is a generic list, which is a\
    \ strongly-typed collection. The List class can hold a collection of objects and\
    \ it comes with lots of useful methods to add, remove and locate objects in the\
    \ collection. The actual type of objects to be stored in the list is added between\
    \ pointy brackets as I have done here: <Thing>\n\nOnly Thing Objects, and their\
    \ descendants, can be stored in this list. My ThingList class can now use methods\
    \ defined by the List class such as Add() and AddRange() to add one or more objects\
    \ of the defined types (Thing objects) to a ThingList collection:\n\n![](img/79557530489e53febfe5a6898863b83c_56_0.png)\n\
    \n```csharp\npublic class ThingList : List<Thing> {\n  public string Describe()\
    \ {\n    string s = \"\";\n    if (this.Count == 0) {\n      s = \"nothing.\\\
    r\\n\";\n    } else {\n      foreach (Thing t in this) {\n        s = s + t.Description\
    \ + \"\";\n      }\n    }\n    return s;\n  }\n\n  public Thing IsOb(string aName)\
    \ {\n    Thing athing = null;\n    string thingName = \"\";\n    string aLowerCase\
    \ = aName.ToLower();\n\n    foreach (Thing t in this) {\n      if (thingName.Equals(aLowerCase))\
    \ {\n        athing = t;\n      }\n    }\n    return athing;\n  }\n}\n```\n\n\
    # 6 — Collections of Treasures\n\nAnd of course, having derived this class from\
    \ List, I can add other methods – as I have here – to return an object matching\
    \ a string. \n\n```csharp\npublic class RoomList : Dictionary<Rm, Room>\n```\n\
    \nMy RoomList is a generic List, just as my ThingList is. In strongly-typed languages,\
    \ such as C# and Java, generic collections give you the benefit of type safety\
    \ (because they specify exactly which types can be used in a list) without forcing\
    \ you to inherit from a base class that defines specific object types. So, in\
    \ summary, the ThingList implements a list of objects. My ThingHolder class defines\
    \ an object that contains a ThingList. Both Room and Actor objects are descendants\
    \ of ThingHolder and so they each contain a ThingList. Any treasures in a Room\
    \ are stored in a ThingList. An Actor, such as the player, can collect treasures\
