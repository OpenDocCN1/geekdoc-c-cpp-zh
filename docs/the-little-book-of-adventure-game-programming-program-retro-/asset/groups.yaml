    # Encapsulation and Data-Hiding


    Wrapping up data — the internal fields and variables — along with the functions
    or methods that act upon data is termed ''encapsulation''. When you make the data
    private, as I have done with the fields of my classes, that''s called data-hiding.
    All my classes from now on will use encapsulation and data-hiding.


