    \ value:\n\n```c\ngame07\n_map.Add(Rm.RoomList,\nnew Room(\"Troll Room\", \"a\
    \ dank, dark room that smells of troll\",\nRm.NOEXIT, Rm.Cave, Rm.NOEXIT, Rm.Forest));\n\
    ```\n\nSince I no longer have any Room variables, I also need to initialize the\
    \ player's location when I call the Actor constructor using a key into the _map.\
    \ The starting location is the Troll Room so I access that Room using the map's\
    \ RoomAt() method to return the Room object associated with the Rm.TrollRoom key:\n\
    \n```c\n_player = new Actor(\"You\", \"The Player\", _map.RoomAt(Rm.TrollRoom));\n\
    ```\n\n## Moving the Player\n\nI've continued restructuring my code in game08.\
    \ I've decided I don't like the event-handlers for the buttons poking around inside\
    \ the Player to find exits in the current Location:\n\n```c\ngame07\nprivate void\
    \ NBtn_Click(object sender, EventArgs e) {\n    MovePlayer(adv.Player.Location.N);\n\
    }\n```\n\nThe button event-handlers shouldn't be messing around with the internal\
    \ details of the Player. They should simply request that the player be moved in\
    \ some direction. This is an example of how I've now implemented the event-handlers:\n\
    \n```c\ngame08\nprivate void NBtn_Click(object sender, EventArgs e) {\n    MovePlayer(Dir.NORTH);\n\
    }\n```\n\nEach event-handler, for the N, S, E and W buttons passes a direction\
    \ constant to the MovePlayer() method; and that method passes this constant on\
    \ to the adv object's MovePlayer() method. I've defined the direction constants\
    \ in AdvConsists.cs. Just like the Rm constants, Dir is an enum with a fixed set\
    \ of identifiers: NORTH, SOUTH, EAST, WEST:\n\n```c\npublic enum Dir {\nNORTH,\n\
    SOUTH,\nEAST,\nWEST\n}\n```\n\nI've rewritten the MovePlayer() function to take\
    \ a Dir constant rather than an Rm previously. This is the old version:\n\n```c\n\
    game07\nprivate void MovePlayer(Rm newpos) {\n    outputTB.Text = adv.MovePlayerTo(newpos);\n\
    }\n```\n\n## 5 – Restructuring the Game\n\nAnd this is the new version:\n\n```c\n\
    game08\nprivate void MovePlayer(Dir direction) {\n    outputTB.Text = adv.MovePlayerTo(direction);\n\
    }\n```\n\nAs before, MovePlayer() calls the Adventure class's MovePlayerTo() method.\
    \ I've rewritten MovePlayerTo(). It now calls a private method called MoveTo().\
    \ This uses a switch...case statement to test the value of a direction and it\
    \ returns Whoever Rm constant is assigned to the N, S, or E properties of the\
    \ player's Location for that direction:\n\n```c\nprivate Rm MoveTo(Actor anActor,\
    \ Dir direction) {\n    Room r = anActor.Location;\n    Rm exit;\n    switch (direction)\
    \ {\n        case Dir.NORTH:\n            exit = r.N;\n            break;\n  \
    \      case Dir.SOUTH:\n            exit = r.S;\n            break;\n        case\
    \ Dir.EAST:\n            exit = r.E;\n            break;\n        case Dir.WEST:\n\
    \            exit = r.W;\n            break;\n        default:\n            exit\
    \ = Rm.NOEXIT;\n            break;\n    }\n    if (exit != Rm.NOEXIT) {\n    \
    \    MoveActorTo(anActor, _map.RoomAt(exit));\n    }\n    return exit;\n}\npublic\
    \ string MovePlayerTo(Dir direction) {\n    string s;\n    if (MoveTo(_player,\
    \ direction) == Rm.NOEXIT) {\n        s = \"There is no exit in that direction\\\
    r\\n\";\n    } else {\n        s = $\"You are now in the {_player.Location.Name}\\\
    r\\n\";\n    }\n    return s;\n}\n```\n\n## 5 — Restructuring the Game\n\nThe\
    \ MoveTo() method assigns the 'current room' (anActor.Location) to a local Room\
    \ variable. It looks for an exit from Room r by testing the Dir direction constant\
    \ against the value of that exit. If there is no Room in that direction, then\
    \ the constant is Rm.NOEXIT. If there is a Room in that direction, the MoveActorTo()\
    \ method is called to move the actor to that room.\n\n```c\nprivate void MoveTo(Actor\
    \ anActor, Dir direction) {\n    Room r = anActor.Location;\n    Rm exit;\n  \
    \  switch (direction) {\n        case Dir.NORTH:\n            exit = r.N;\n  \
    \          break;\n        case Dir.SOUTH:\n            exit = r.S;\n        \
    \    break;\n        case Dir.EAST:\n            exit = r.E;\n            break;\n\
    \        case Dir.WEST:\n            exit = r.W;\n            break;\n       \
    \ default:\n            exit = Rm.NOEXIT;\n            break;\n    }\n    if (exit\
    \ != Rm.NOEXIT) {\n        MoveActorTo(anActor, _map.RoomAt(exit));\n    }\n \
    \   return exit;\n}\n```\n\nThe MoveTo() method assigns the 'current room' (anActor.Location)\
    \ to a local Room variable. It looks for an exit from Room r by testing the Dir\
    \ direction constant against the value of that exit. If there is no Room in that\
    \ direction, then the constant is Rm.NOEXIT. If there is a Room in that direction,\
    \ the MoveActorTo() method is called to move the actor to that room.\n\nFinally,\
    \ MoveTo() returns the exit constant, which is used by MovePlayerTo().\n\n## Step-by-Step\
    \ Example\n\nLet's consider the case where the player is in the Troll Room and\
    \ clicks the North button. The map is initialized as follows:\n\n```c\n_map.Add(Rm.RoomList,\n\
    new Room(\"Troll Room\", \"a dank, dark room that smells of troll\",\nRm.NOEXIT,\
    \ Rm.Cave, Rm.NOEXIT, Rm.Forest));\n```\n\nThe Troll Room has no exit to the North,\
    \ so `MoveTo()` returns Rm.NOEXIT. `MovePlayerTo()` then returns \"There is no\
    \ exit in that direction\".\n\nHowever, if the player clicks the South button,\
    \ `MoveTo()` returns Rm.Cave. `MoveActorTo()` is called, and the player is moved\
    \ to the Cave. `MovePlayerTo()` then returns \"You are now in the Cave\".\n"
