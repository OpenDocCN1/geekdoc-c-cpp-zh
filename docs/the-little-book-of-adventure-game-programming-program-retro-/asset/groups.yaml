    \n在规划游戏时，先为游戏的“世界”绘制一张地图是一个好主主意。地图是相互连接的地点或“房间”的集合。这里是我设计的包含四个房间的地图：巨人房、森林、洞穴和地牢。线条表示连接一个房间到另一个房间的出口。没有连接线的地方表示没有出口。\n\
    \n![](img/79557530489e53febfe5a6898863b83c_20_0.png)\n\n## 房间还是地点？\n\n传统上，冒险游戏将地点称为“房间”，无论这些地点是否真的是建筑内部的房间。在本书中，当我谈到房间时，指的是任何独特的地点，即使它恰好位于“外外世界”的某个地方，比如街道或森林。同样，当我谈到“出口”时，指的是通往特定“方向”另一个房间或地点的连接。\n\
    \n## -- 创建地图\n\n### 创建房间\n\n在创建地图之前，显然我必须有一种创建房间的方法。虽然我将只从一个房间开始，但我需要记住，游戏将有很多房间。每个房间都与其他任何房间都不同——例如，森林里的房间与洞穴里的房间会非常不同。但房间对象也具有许多相似的特征。\n\
    \n从我的这张小地图中看到，房间有一个名称和一些通往其他房间的出口。由于每个房间都具有这些特征，我需要写一个“蓝图”，根据这个蓝图可以创建房间“对象”。在面向对象的术语中，对象的蓝图就是它的类（class）。\n\
    \n我需要一个 `Room` 类，包含一个名称和四个出口。名称将是一个字符串（string）（一段文本，如“巨人房”）。出口应该是什么类型的数据？你可能会认为，如果一个房间进入了另一个房间，那么出口本身应该是一个\
    \ `Room` —— 也就是说，如果我这样做，我的 `Room` 类（伪代码）看起来可能像这样：\n\n```\n(pseudocode)\nclass\
    \ Room\nname: string\nn: Room\ns: Room\nw: Room\ne: Room\nend class\n```\n\n###\
    \ 伪代码\n\n伪代码不是真实的编程代码。它是数据、结构或技术的简化表示。伪代码可以使用你正在使用的任何语言的语法重写为“真实的”程序代码。\n\n我曾写过一个游戏，完全以这种方式实现房间——每个出口都是一个\
    \ `Room` 对象。然而，我很快发现缺点大于优点。首先，创建地图需要两个步骤：首先你必须创建所有的 `Room` 对象；然后你必须通过将 `Room`\
    \ 对象分配给变量来初始化 `n`、`s`、`w` 和 `e`。\n\n## 2 – 创建地图\n\n但最糟糕的是，当你创建一个包含 `Room` 对象的复杂网络时，你的代码会迅速变得难以理解（尤其是从磁盘保存和加载地图时）、难以维护且调试存在问题。\n\
    \n因此，我决定让事情变得简单得多——我也建议你这样做。起初，我将假设地图上的每个 `Room` 都用一个整数（integer）来标识。出口是整数变量，指示在四个方位方向上可以找到房间编号，如下所示：\n\
    \n### (pseudocode)\n\n```\nclass Room\nname: string\nn: integer\ns: integer\n\
    w: integer\ne: integer\nend class\n```\n\n这是我在 C# 中定义 `Room` 类的方式：\n\n### game01\n\
    \n```csharp\npublic class Room {\n    public string name;\n    public int n;\n\
    \    public int s;\n    public int w;\n    public int e;\n}\n```\n\n`Room` 仅仅是对象的蓝图。为了有一个可用的房间，我需要创建一个带有出口和名称字段的实际整数和字符串值的房间。在\
    \ C# 中，我可以这样这样做：\n\n```csharp\nRoom r = new Room();\nr.name = \"Troll Room\";\n\
    r.n = 1;\nr.s = 2;\nr.w = 3;\nr.e = 4;\n```\n\n这创建了一个新的 `Room` 对象并将其分配给变量 `r`。然后，我为对象的每个字段分配值：一个字符串名称和四个用于“方向”变量的整数：n、s、w\
    \ 和 e。\n\n## 2 — 创建地图\n\n### 创建多个房间\n\n一个只有一个地点——“房间”的冒险游戏将将不好玩。我需要许多不同的房间来探索。在面向对象的术语中，一个对象可以说是类的“实例”（instance）。\n\
    \n你只需要定义一次类，然后就可以创建该类的许多实例。我可以通过为每个 `Room` 对象声明一个新的 `Room` 变量来实现。`Room` 类定义了房间是什么。`Room`\
    \ 对象代表单个房间。在 `game02` 项目中我有四个房间 `room0`、`room1`、`room2` 和 `room3`：\n\n| game02\
    \ |\n| :--- |\n| room0; |\n| room1; |\n| room2; |\n| room3; |\n\n我通过调用 `Room`\
    \ 构造函数创建一个新的 `Room` 对象，并将其分配给我的变量之一：\n\n```csharp\nroom0 = new Room();\nroom1\
    \ = new Room();\nroom2 = new Room();\nroom3 = new Room();\n```\n\n### 构造函数\n\n\
    在 C# 中，与类同名的函数方法称为“构造函数”（constructor）。构造函数可以接受参数。在这里，构造函数没有参数：\n\n```csharp\n\
    room0 = new Room();\n```\n\n## 2 - 创建地图\n\n### 字符串插值\n\n你可能注意到，我有时会将实际的代码（如 `room0.name`）嵌入到字符串中，如下所示：\n\
    \n```csharp\noutputTB.Text = $\"You are in {room0.name}\";\n```\n\n在 C# 中，前带 `$`\
    \ 的字符串被称为“插值字符串”（interpolated string）。这种字符串允许你在大括号之间嵌入代码。它会计算代码并将结果放入字符串。某些其他语言提供类似的功能。\n\
    \n### 连接房间\n\n为了连接房间，我需要一张地图。房间的方向变量 `n`、`s`、`w` 和 `e` 整数指示每个方向应该“连接”到哪个房间。因此，我需要能够使用这些数字来查找房间。一种简单的方法是将所有房间放入数组中，并使用数组索引来定位房间。\n\
    \n### 连接房间的其他方法\n\n整数出口的优点是简单。但它们没有描述性，因为你被迫记住 1 代表巨人房，2 是森林，以此此类推。在书的后面，我将解释其他以及我认为更好的“连接”房间的方法。\n\
    \n早些时候我画了一张地图来显示房间是如何连接的。你可以在纸上这样做。但（至少对于较小的地图来说）在代码注释中显示地图的图也是很有用的，这就是我在 `game03`\
    \ 项目中所做的：\n\n```csharp\n/* game03\n* Troll Room -- Forest\n* |\n* Cave ----- Dungeon\n\
    * */\n```\n\n"
