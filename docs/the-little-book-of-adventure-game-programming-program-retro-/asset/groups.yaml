- md: "\n# Add a Player\n\nUp to now the technique I've been using for moving around\
    \ a map is not object oriented. The player's position is just an integer. It would\
    \ be much better to have a player *object* to contain all the data (variables)\
    \ and behaviour (methods) relevant to the player of the game. Let's see how to\
    \ do that.\n\nI've decided to create a class called Actor. This could be used\
    \ to define any interactive character – one that can move around the map, taking\
    \ and dropping treasures. Currently I only need one Actor to represent the player.\
    \ In more complicated games you could create other interactive characters too.\n\
    \nAs with every other object in my game, an Actor object should have a name and\
    \ a description. I chose to write an Actor class like this:\n\n```csharp\npublic\
    \ class Actor {\n  public string name;\n  public string description;\n}\n```\n\
    \nBut since the *Room* class also defines name and description, it would be better\
    \ if I avoid this unnecessary duplication by creating another class with a name\
    \ and a description so that the *Room* and the *Actor* class *inherit* these features.\n\
    \nThis is a basic principle of object orientation: first create a simple class,\
    \ then create more complex classes that inherit the features of the simple class\
    \ and add on additional features as required.\n\nIn the game05 project Ive created\
    \ a class called *Thing*. The *Thing* class has a name and a description and it\
    \ will be the ultimate ancestor of all the other classes in my game. Up to now,\
    \ I made the fields inside objects public so that whenever an object I created\
    \ can get those fields or assign new values to them. That's easy to do but it's\
    \ bad practice.\n\nFields, the actual data, inside objects should be hidden. They\
    \ should only be accessible using accessor methods – that is, methods that provide\
    \ a public ‘interface’ to the variables. For that reason, the fields (the variables)\
    \ of *Thing*, and the other classes in my game, are now being made private:\n\n\
    ```csharp\npublic class Thing {\n  private string _name;\n  private string _description;\n\
    }\n```\n\n# private field names\n\nI choose to precede the private field names\
    \ such as _name and _description with an underscore, for clarity. That's a common\
    \ convention across many programming languages. However, some programmers prefer\
    \ to use the same names for fields and accessor methods but start fields with\
    \ a lowercase letter (e.g. name) and properties with a capital letter (e.g. Name).\n\
    \n_name and _description are now private, they can't be referenced by code outside\
    \ an object. I need to add public accessor methods to get and set the values of\
    \ those variables. In C#, I can get with the => operator to return the value of\
    \ a field. I can use set with the => operator to assign a value (represented by\
    \ the keyword value) like this:\n\n```csharp\npublic string Name {\n    get =>\
    \ _name;\n    set => _name = value;\n}\n\npublic string Description {\n    get\
    \ => _description;\n    set => _description = value;\n}\n```\n\n# Properties\n\
    \nIn C# and .NET, when you provide get and set accessors to assign and return\
    \ the value of an object's variable, as I have done with Name and Description,\
    \ these are called 'properties'. Some other languages provide similar capabilities.\
    \ In Ruby, for example, they are called 'attributes'.\n\nNow that I have a Thing\
    \ class, I can rewrite the Room class as its descendant. The way to do that, in\
    \ C#, is to put a colon after the name of the class followed by its ancestor class\
    \ name as I have done here:\n\n```csharp\npublic class Room : Thing {\n```\n\n\
    # 3 — Move Around the Map\n\nThat shows that Room is a type of Thing so it will\
    \ inherit the features of Thing. In this case, any Room object will automatically\
    \ have a name and a description because they are inherited from the Thing class.\
    \ I don't therefore to have name and description fields or any accessor methods\
    \ defined in the Room class itself.\n\nSince Room descends from Thing, it automatically\
    \ inherits the Name and Description properties. This means that all I now need\
    \ to do is add on any extra features required for a Room; here's the four exits:\
    \ North, South. East and West. I make these private variables with public accessors:\n\
    \n```csharp\nprivate int _n;\nprivate int _s;\nprivate int _w;\nprivate int _e;\n\
    \npublic int N {\n    get => _n;\n    set => _n = value;\n}\n\npublic int S {\n\
    \    get => _s;\n    set => _s = value;\n}\n\npublic int W {\n    get => _w;\n\
    \    set => _w = value;\n}\n\npublic int E {\n    get => _e;\n    set => _e =\
    \ value;\n}\n```\n\n# Encapsulation and Data-Hiding\n\nWrapping up data — the\
    \ internal fields and variables — along with the functions or methods that act\
    \ upon data is termed 'encapsulation'. When you make the data private, as I have\
    \ done with the fields of my classes, that's called data-hiding. All my classes\
    \ from now on will use encapsulation and data-hiding.\n\n# 3 – Move Around the\
    \ Map\n\nActor class also descends from the Thing class so it too automatically\
    \ has a name and a description. It needs one more item – the current location\
    \ of the Actor object. That location is a Room. So I've given it a Room field,\
    \ the private variable _location. And a public accessor method:\n\n```csharp\n\
    public class Actor : Thing {\n    private Room _location; // Room where Actor\
    \ is at present\n\n    public Actor(string aName, string aDescription, Room aRoom)\
    \ {\n        base(aName, aDescription);\n        _location = aRoom;\n    }\n\n\
    \    public Room Location {\n        get => _location;\n        set => _location\
    \ = value;\n    }\n}\n```\n\n# The Thing Hierarchy\n\n![Thing Hierarchy](https://example.com/image_link.png)\n\
    \nThe diagram above shows the class hierarchy. Room and Actor classes descend\
    \ from Thing.\n\n# 3 — Move Around the Map\n\nThat shows that Room is a type of\
    \ Thing so it will inherit the features of Thing. In this case, any Room object\
    \ will automatically have a name and a description because they are inherited\
    \ from the Thing class. I don't therefore to have name and description fields\
    \ or any accessor methods defined in the Room class itself.\n\nSince Room descends\
    \ from Thing, it automatically inherits the Name and Description properties. This\
    \ means that all I now need to do is add on any extra features required for a\
    \ Room; here's the four exits: North, South. East and West. I make these private\
    \ variables with public accessors:\n\n```csharp\nprivate int _n;\nprivate int\
    \ _s;\nprivate int _w;\nprivate int _e;\n\npublic int N {\n    get => _n;\n  \
    \  set => _n = value;\n}\n\npublic int S {\n    get => _s;\n    set => _s = value;\n\
    }\n\npublic int W {\n    get => _w;\n    set => _w = value;\n}\n\npublic int E\
    \ {\n    get => _e;\n    set => _e = value;\n}\n```\n\n# Constructors\n\nI mentioned\
    \ earlier that when you want to create a new object you call its constructor.\
    \ If a constructor requires no arguments, you can call the default constructor\
    \ like this:\n\n```csharp\nroom = new Room();\n```\n\nIn fact, when I want to\
    \ initialize some variables in game05 I've created this Room constructor:\n\n\
