    \ + \".\");\n    outputTB.AppendText(\"Where do you want to go?\");\n    outputTB.AppendText(\"\
    Click a direction: N, S or E.\");\n}\n```\n\n`InitGame()` 代码中还有另一个重要的添加。我为变量 `position`\
    \ 赋值了一个值。这是一个新变量，我全局声明了它。我使用它来保存当前房间。\n\n## 3 — 在地图上移动\n\n由于 `Room` 对象位于 `map`\
    \ 数组的索引 0, 1, 2 和 3 处，我可以使用每个房间对象的整数出口值（分配给房间 `n`、`s`、`w` 和 `e` 变量的值）来查找特定索引处的房间。这告诉我在我的游戏世界中，哪个房间与当前房间在任何方向上相邻。当我需要从地图上的一个房间移动到另一个房间时，这将至关重要。\n\
    \n一旦 `position` 变量的值为 0，我再次通过数组索引使用该对象：\n\n```go\nposition = 0;\n```\n\n假设 `position`\
    \ 为 0，这将会显示：\n\n- 你在巨魔房。\n- 这是一个潮湿、黑暗且有巨魔气味的房间\n\n要移动到一个新房间，我要做的是检查指定方向的房间并相应地更新\
    \ `position` 变量。例如，当我点击 `S` 按钮向南时，`SBtn_Click()` 方法运行：\n\n```go\nprivate void\
    \ SBtn_Click(object sender, EventArgs e) {\n    MovePlayer(map[position].s);\n\
    }\n```\n\n## 在地图移动\n\n如果 `newpos` 数字为 `-1`，则意味着该方向没有房间，因此我显示“该方向没有出口”。否则，我通过将\
    \ `newpos` 的值赋值给 `position` 来更新它，并显示新房间。这个数字被传递给 `MovePlayer()` 函数：\n\n```go\n\
    private void MovePlayer(int newpos) {\n    if (newpos == -1) {\n        outputTB.Text\
    \ = \"There is no exit in that direction\";\n    } else {\n        position =\
    \ newpos;\n        outputTB.Text = \"You are now in \" + map[position].name +\
    \ \".\";\n    }\n}\n```\n\n"
