- pgno: 22
  md: '# Overview of CUDA C: Syntax and Structure


    CUDA C extends the C programming language by introducing a handful of language
    extensions, APIs, and parallel computation patterns that leverage the massively
    parallel computational capabilities of NVIDIA GPUs. This section aims to dissect
    the syntax and structure peculiarities of CUDA C, making a clear distinction from
    standard C practices and highlighting what makes CUDA C uniquely suited for GPU-based
    computing.


    CUDA C introduces a few key concepts that are essential for parallel computation:
    kernels, memory hierarchy, and execution configuration. Let’s delve deeper into
    each of these aspects to understand the fundamentals of CUDA C programming.


    Kernels: At the heart of CUDA C programming is the concept of A kernel is essentially
    a function that is executed on the GPU, but defined using CUDA C syntax. Unlike
    a standard C function, kernels can be executed by multiple threads in parallel
    across the data they operate on. To define a kernel, CUDA C uses the __global__
    keyword. Here is an example of a kernel definition:


    ```

    __global__ void *a, float *b, float *c, int N) { i = threadIdx.x; (i < N) = a[i]
    + b[i]; }

    ```


    This kernel, named adds two vectors of floats in parallel. Each thread that executes
    the kernel handles one element of the vector.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Execution Configuration: When a kernel is launched, execution configuration
    must be specified. This includes the number of blocks and the number of threads
    per block. CUDA C uses a unique syntax for this, often referred to as the execution
    configuration triple


    threadsPerBlock>>>(a, b, c, N);


    The variables numBlocks and threadsPerBlock determine the grid and block dimensions,
    respectively, for kernel execution. These are critical for harnessing the GPU’s
    parallel processing capability effectively.


    Memory Hierarchy: CUDA C introduces an intricate memory hierarchy to optimize
    data transfer and access times between the CPU (host) and GPU (device). At a high
    level, CUDA C distinguishes between global, shared, and local memory spaces, each
    serving a unique purpose in the context of GPU computing.


    Global by all threads, but with the highest access latency.

    Shared than global memory, accessible by threads within the same block.

    Local to each thread, useful for temporary data storage.


    Understanding how to efficiently manage and utilize these different types of memory
    is crucial for optimizing CUDA C applications.


    Example: To illustrate these concepts in action, consider the following simple
    program that utilizes CUDA kernel to add two arrays:'
