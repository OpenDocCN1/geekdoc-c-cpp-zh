- pgno: 215
  md: '# Understanding CUDA Error Types


    CUDA errors can be broadly classified into two categories: runtime errors and
    driver errors. Runtime errors occur during the execution of CUDA kernel or runtime
    API calls, while driver errors are related to the CUDA driver API. Most CUDA developers
    will primarily interact with runtime errors, as they encompass encompass issues
    such as kernel launch failures, illegal memory accesses, and issues with CUDA
    runtime API functions.


    CUDA runtime errors are reported via the cudaError_t type, which is returned by
    most CUDA runtime API functions. This error code can then be used to query more
    information about the error and to react accordingly.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Checking for Errors in Kernel Launches


    Kernel launches in CUDA are asynchronous, meaning that the CPU dispatches the
    kernel to the GPU and then immediately continues to the next line of code without
    waiting for the kernel to complete. This poses a challenge for error handling,
    as errors that occur during the kernel execution will not be reported immediately.


    To check for errors after a kernel launch, one must use the cudaDeviceSynchronize()
    function, which blocks the CPU until the GPU has completed all preceding tasks,
    including kernel execution. Only after synchronization can the error status be
    queried using cudaGetLastError() function. The following code snippet illustrates
    this:


    ```

    __global__ void parameters { Kernel code } int main() { Kernel launch parameters
    Synchronize Check for any errors = cudaGetLastError();

    (error != cudaSuccess) { "Kernel launch failed: %s\n",ncudaGetErrorString(error);
    0; }

    ```'
