  md: '# Image Processing: Gaussian Blur


    Gaussian blur is a common image processing operation that smoothens images by
    averaging pixel values with their neighbors. It has wide applications in edge
    detection, image smoothing, and graphics.


    Implementation Strategy:


    ```

    __global void gaussianBlurKernel(unsigned char *input, unsigned char *output,
    int height, float sigma) { col = blockIdx.x * blockDim.x + threadIdx.x; row =
    blockIdx.y * blockDim.y + threadIdx.y; if (& width && row < height) { sum = 0;
    size = 2 * ceil(2 * sigma) + 1; // Kernel size i = -size/2; i <= size/2; j = -size/2;
    j <= size/2; ++j) { x = min(max(col + i, 0), width - 1); y = min(max(row + j,
    0), height - 1); value = input[y * width + x]; weight = exp(-(i*i + j*j)/(2*sigma*sigma));
    += value * weight; } width + col] = sum / (size * size); }

    ```


    Despite its simplicity, the Gaussian blur kernel can be optimized further by utilizing
    shared memory for loading image patches and exploiting constant memory for the
    Gaussian weights.


