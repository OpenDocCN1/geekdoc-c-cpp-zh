- pgno: 34
  md: '# Differences between CUDA C and Standard C


    The introduction and evolution of CUDA C have marked a significant transformation
    in the way computational tasks are approached and executed, particularly in the
    realm of parallel processing utilizing GPUs. At its core, CUDA (Compute Unified
    Device Architecture) is a parallel computing platform and programming model developed
    by NVIDIA, which allows developers to use a CUDA-enabled graphics processing unit
    (GPU) for general purpose processing – an approach known as GPGPU (General-Purpose
    computing on Graphics Processing Units). While CUDA C syntax is largely derived
    from the standard C programming language, enabling some familiarity for those
    already versed in C programming, there are notable differences that distinguish
    CUDA C and require a paradigm shift in thought and implementation. These differences
    are not just syntactical, but also conceptual, reflecting the fundamentally different
    architecture of GPUs relative to CPUs.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Memory Model Distinctions


    One of the primary differences between CUDA C and standard C lies in their respective
    approaches to memory management and the underlying memory model. In standard C
    programming, memory management is relatively straightforward, with a universal
    view of an abstracted memory space. Conversely, CUDA C introduces a more complex
    memory hierarchy designed to cater to the architectural specifics of the GPU:


    Global Accessible by all threads, but with higher latency and lower bandwidth

    Shared A faster, block-wide limited memory area accessible by threads within the
    same block, facilitating quicker data exchange.

    The fastest form of memory, used on a per-thread basis.

    Constant and Texture Cache-optimized spaces useful for read-only data.


    This diversity in memory types necessitates a more strategic approach to memory
    allocation and access patterns in CUDA C, aiming to maximize throughput and efficiency.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Parallel Execution Model


    Another core distinction between CUDA C and standard C is the parallel execution
    model. Standard C is designed primarily for sequential execution of code, with
    parallelism (when utilized) often managed through libraries or extensions like
    OpenMP. CUDA C, however, inherently relies on a parallel execution model, defining
    a hierarchical organization of thread groups as the basis for its computation:


    Here, the computation is broken down into a grid of blocks, each containing a
    set of threads. This model not only enables massive parallelism but also requires
    a different programming mindset, focusing on dividing tasks among an extensive
    set of parallel execution units.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Kernel Functions


    A unique feature of CUDA C programming is the concept of kernel which are functions
    executed N times in parallel by N different CUDA threads:


    ```

    __global__ void *array) { index = threadIdx.x + blockIdx.x * blockDim.x;

    = ...; // Perform some computation }

    ```


    The __global__ qualifier specifies that the function is a kernel and can be called
    from the host (CPU) code but runs on the device (GPU). This is a departure from
    standard C function calls, emphasizing the execution of concurrent operations
    rather than sequential.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Execution Control


    Standard C programs typically execute instructions sequentially, controlled by
    the CPU’s flow control logic. In contrast, CUDA C introduces explicit control
    over parallel execution, including synchronization points to manage dependencies
    and execution flow across different threads and blocks. The __synctreads() function,
    for example, acts as a barrier at which all threads in a block must wait before
    any can proceed, ensuring correct data sharing and task coordination.


    ```

    __global__ void *array) { Part 1: Perform initial computations // Synchronize
    all threads in the block Part 2: Perform subsequent computations that depend on
    Part 1 }

    ```


    This level of execution control is integral to efficiently managing the parallel
    computational capabilities of GPUs.'
  merge: -1
  img_proc: true
