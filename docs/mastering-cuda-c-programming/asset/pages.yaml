  md: '# cuRAND: Random Number Generation


    Random number generation is a cornerstone in various computational tasks, including
    simulations, Monte Carlo methods, and machine learning algorithms. The cuRAND
    library, part of NVIDIA''s CUDA ecosystem, offers a robust solution for generating
    high-quality random numbers at speed on GPUs. This section delves deeply into
    cuRAND, exploring its functionality, advantages, and how to effectively incorporate
    it into CUDA applications.


    The cuRAND library provides two types of random number generators (RNGs): pseudo-random
    number generators (PRNGs) and quasi-random number generators (QRNGs). PRNGs generate
    a sequence of numbers that approximate the properties of random numbers, starting
    from an initial value called a "seed". The sequence may eventually repeat, but
    the period is typically very long. QRNGs, on the other hand, aim to fill the space
    more evenly than is typical of random sequences, which is particularly valuable
    in high-dimensional numerical integration.


    Essential functions of cuRAND:


    +   Initialization and setup of RNGs.

    Generation of various data types of random numbers, including uniform or normal
    (Gaussian) distributions.

    Control over stream generation for parallel applications.'
  merge: -1
  img_proc: true
