    by all threads across all thread blocks. It has the largest storage capacity among
    the memory types available in CUDA, but it also has the highest access latency.
    Optimizing usage of global memory is crucial because uncoordinated access patterns
    can lead to substantial performance degradation.


    One common strategy to improve global memory performance is to ensure coalesced
    access by threads within a warp. When threads of a warp access contiguous memory
    locations, the hardware can combine these accesses into a single transaction,
    significantly reducing memory bandwidth usage.


    Consider a kernel that increments each element in an array:


