    In this example, if each thread in a warp accesses consecutive src elements, the
    reads (and writes) will be coalesced, resulting in efficient memory transactions.
    Contrastingly, if threads access memory memory in a strided pattern, bandwidth
    utilization drops, increasing latency.'
