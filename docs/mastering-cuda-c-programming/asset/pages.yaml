  md: '# CUDA-GDB


    CUDA-GDB is the NVIDIA variant of the GNU Debugger (GDB) adapted for debugging
    CUDA applications. It allows developers to inspect the state of a running CUDA
    application, providing the capability to pause execution at any point. This enables
    examination of both host and device variables, setting breakpoints, and stepping
    through both CPU and GPU code.


    To use CUDA-GDB, compile your CUDA application with the -G and -g flags to include
    debugging information:


    ```

    nvcc -G -g -o my_cuda_app my_cuda_app.cu

    ```


    Once compiled, the application can be launched under CUDA-GDB:


    ```

    ./my_cuda_app

    ```


