    __global__ void *data) { int idx = threadIdx.x + blockIdx.x * blockDim.x; += 1;
    // Simple operation on data } __global__ void *data, int N) { threadsPerBlock
    = 256; blocksGrid = (N + threadsPerBlock - 1) / threadsPerBlock; threadsPerBlock>>>(data);
