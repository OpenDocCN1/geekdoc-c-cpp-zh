- pgno: 17
  md: '# Basics of Parallel Computing


    Parallel computing represents a computational methodology essentially aimed at
    executing numerous calculations simultaneously, leveraging the fact that large
    problems can often be divided into smaller ones, which can then be solved concurrently.
    This paradigm shift from traditional serial computing, where tasks are executed
    sequentially, to parallel processing, marks a monumental leap in enhancing computation
    speed and efficiency.


    To fully appreciate the pivotal role that parallel computing plays in modern computational
    science, it is crucial to understand the fundamental concepts that underpin it,
    differentiate between its models, and grasp how it interfaces with hardware architectures,
    such as GPUs, enabled by programming models like CUDA C.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Key Concepts of Parallel Computing


    Parallel computing rests on several core concepts that together enable efficient
    division and execution of computational tasks. Here are key terms and concepts:


    Task This involves decomposing the overall task into discrete functions that can
    be executed in parallel. Each task performs different operations on the same or
    different data sets.


    Data Contrary to task parallelism, data parallelism involves executing the same
    operation on different parts of distributed data across multiple processors.


    This term describes multiple tasks executing in overlapping time periods. It is
    the core of parallel computing, enabling tasks to make progress simultaneously.


    In parallel computing, tasks often depend on the results of others. Synchronization
    mechanisms ensure that these dependencies are respected by coordinating the execution
    order of tasks.


    These occur when a set of tasks are waiting on each other to release resources
    or make progress, leading to a situation where none of the tasks can proceed.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Parallel Computing Models


    Understanding the theoretical models of parallel computation can provide insight
    into how algorithms are designed and executed in a parallel environment.


    Shared Memory In this model, multiple processors access a single shared memory
    space. Processors communicate by reading and writing to shared variables, which
    demands careful synchronization to prevent conflicts. Distributed Memory Here,
    each processor has its own local memory. Communication between processors is achieved
    through message passing, which involves explicitly sending and receiving data
    among processors. Hybrid The Hy hybrid model combines aspects of both shared and
    distributed memory models, utilizing shared memory within nodes and message passing
    between nodes, offering scalability and efficiency advantages.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Parallel Computing and GPUs


    Graphics Processing Units (GPUs) have evolved into highly parallel, multithreaded,
    manycore processors capable of very high computation and data throughput. CUDA
    C programming model unlocks the potential of GPU’s parallel computing capabilities,
    enabling the development of high performance, scalable parallel applications.
    Here’s a quick overview of how CUDA maps to GPU architecture:


    In CUDA, a kernel is the function executed N times in parallel by N different
    CUDA threads, as if each thread executes a single instance of the kernel.


    Threads and CUDA organizes threads into blocks, which can be further grouped into
    a grid. This hierarchical organization facilitates efficient data sharing and
    synchronization among threads.


    The power of parallel computing, especially when applied through platforms like
    CUDA on GPUs, lies in its ability to significantly reduce computation times for
    suitable problems. As new architectures and programming models emerge, the potential
    for parallel computing continues to expand, opening new frontiers in computational
    science.


    In summary, understanding the basics of parallel computing, from its concepts
    to its application in GPUs through CUDA C, provides the foundational knowledge
    necessary for developing efficient parallel applications capable of tackling complex
    computational problems.'
  merge: -1
  img_proc: true
