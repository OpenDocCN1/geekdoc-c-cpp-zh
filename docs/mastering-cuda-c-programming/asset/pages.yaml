    Constant Memory:


    Constant Memory in CUDA is a read-only memory space on the device which is cached
    and designed for scenarios where all threads read the same value. It is most effective
    when a kernel reads from a small set of data repeatedly. This memory type is relatively
    small; however, due to its caching mechanism, it can significantly reduce memory
