- pgno: 148
  md: '# Coalesced Access


    One of the most critical factors influencing memory access performance in CUDA
    is whether or not memory accesses are coalesced. Coalesced access refers to the
    scenario where consecutive threads access consecutive memory locations within
    the same warp. When accesses are coalesced, the hardware combines them into as
    few transactions as possible, significantly reducing memory access latency and
    increasing bandwidth utilization.


    To understand how to achieve coalesced access, consider the global memory, which
    is accessed by threads within a warp. For access to be coalesced, each thread
    in a warp should access an address that follows a specific pattern relative to
    other threads in the warp:


    ```

    int idx = threadidx.x; // Thread index ptr = &array[idx]; // Address accessed
    by the thread

    ```


    In the above example, if array is an array of floats, and each thread in a warp
    accesses consecutive elements, the access is coalesced, leveraging the maximum
    memory bandwidth.


    Optimizing for coalesced access often involves aligning data structures in memory
    and structuring memory accesses such that threads within a warp access contiguous
    memory locations. Sometimes, padding might be necessary to align data structures
    properly.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Strided Access


    Conversely, strided access occurs when threads access memory locations that are
    spaced out by a constant stride. This access pattern can lead to performance degradation
    as it prevents efficient utilization of memory bandwidth.


    Consider the following example where threads access elements in a strided manner:


    ```

    int stride = 2; // Stride length int idx = threadIdx.x; ptr = &array[idx * stride];
    // Strided access

    ```


    Here, each thread accesses memory locations two elements apart, resulting in poor
    memory access efficiency. Each memory transaction fetches data for fewer threads,
    leading to an increase in the required number of transactions and, consequently,
    lower bandwidth utilization.


    To optimize strided access, one can either modify the access pattern to make it
    coalesced or adjust the compute-to-memory access ratio. Techniques such as loop
    unrolling and data restructuring can be used to minimize the adverse effects of
    strided access. Increasing computation per memory access ensures that the computational
    cores are better utilized, mitigating the impact of inefficient memory access.'
  merge: -1
  img_proc: true
