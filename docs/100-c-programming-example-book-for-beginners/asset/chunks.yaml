    3\. Factorial of a Number:


    #include <stdio.h>


    int main() {


    int n, i;


    unsigned long long fact = 1;


    printf("Enter an integer: ");


    scanf("%d", &n);


    for (i = 1; i <= n; ++i) {


    fact *= i;


    }


    printf("Factorial: %llu", fact);


    return 0;


