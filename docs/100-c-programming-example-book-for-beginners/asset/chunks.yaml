    4\. Fibonacci Series:


    #include <stdio.h>


    int main() {


    int n, first = 0, second = 1, next, i;


    printf("Enter the number of terms: ");


    scanf("%d", &n);


    printf("Fibonacci Series: ");


    for (i = 0; i < n; i++) {


    if (i <= 1)


    next = i;


    else {


    next = first + second;


    first = second;


    second = next;


    }


    printf("%d ", next);


    }


    return 0;


    }


    5\. Check Prime Number:


    #include <stdio.h>


    #include <stdbool.h>


    bool isPrime(int n) {


    if (n <= 1)


    return false;


    for (int i = 2; i * i <= n; i++) {


    if (n % i == 0)


    return false;


    }


    return true;


    }


    int main() {


    int num;


    printf("Enter a number: ");


    scanf("%d", &num);


    if (isPrime(num))


    printf("%d is a prime number.", num);


    else


    printf("%d is not a prime number.", num);


    return 0;


    }


