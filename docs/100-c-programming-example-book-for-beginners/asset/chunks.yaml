    \ {\n        return 1;\n    }\n    return 0;\n}\n\nvoid enQueue(int element) {\n\
    \    if (isFull()) {\n        printf(\"\\n 队列已满\");\n    } else {\n        if\
    \ (front == -1) {\n            front = 0;\n        }\n        rear++;\n      \
    \  items[rear] = element;\n        printf(\"\\n 插入 -> %d\", element);\n    }\n\
    }\n\nvoid deQueue() {\n    if (isEmpty()) {\n        printf(\"\\n 队列为空\");\n \
    \   } else {\n        printf(\"\\n 删除 -> %d\", items[front]);\n        front++;\n\
    \        if (front > rear) {\n            front = rear = -1;\n        }\n    }\n\
