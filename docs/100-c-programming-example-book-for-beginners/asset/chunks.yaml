    \ Algorithm\n\n```c\n#include <stdio.h>\n\nvoid swap(int* a, int* b) {\n    int\
    \ t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint partition(int arr[], int low, int\
    \ high) {\n    int pivot = arr[high];\n    int i = (low - 1);\n    for (int j\
    \ = low; j <= high - 1; j++) {\n        if (arr[j] < pivot) {\n            i++;\n\
    \            swap(&arr[i], &arr[j]);\n        }\n    }\n    swap(&arr[i + 1],\
    \ &arr[high]);\n    return (i + 1);\n}\n\nvoid quickSort(int arr[], int low, int\
    \ high) {\n    if (low < high) {\n        int pi = partition(arr, low, high);\n\
    \        quickSort(arr, low, pi - 1);\n        quickSort(arr, pi + 1, high);\n\
    \    }\n}\n\nint main() {\n    int arr[] = {10, 7, 8, 9, 1, 5};\n    int n = sizeof(arr)\
