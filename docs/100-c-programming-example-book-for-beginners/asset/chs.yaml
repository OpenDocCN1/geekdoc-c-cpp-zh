  \ /= 10;\n        ++n;\n    }\n    originalNumber = number;\n    while (originalNumber\
  \ != 0) {\n        remainder = originalNumber % 10;\n        result += pow(remainder,\
  \ n);\n        originalNumber /= 10;\n    }\n    return result == number;\n}\n\n\
  int main() {\n    int number;\n    printf(\"Enter a number: \");\n    scanf(\"%d\"\
  , &number);\n    if (isArmstrong(number)) {\n        printf(\"%d is an Armstrong\
