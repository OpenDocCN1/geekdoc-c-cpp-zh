  \ size) {\n    for (int step = 0; step < size - 1; ++step) {\n        int min_idx\
  \ = step;\n        for (int i = step + 1; i < size; ++i) {\n            if (array[i]\
  \ < array[min_idx]) {\n                min_idx = i;\n            }\n        }\n\
  \        // 将找到的最小元素与第一个元素交换\n        int temp = array[min_idx];\n        array[min_idx]\
  \ = array[step];\n        array[step] = temp;\n    }\n}\n\nint main() {\n    int\
