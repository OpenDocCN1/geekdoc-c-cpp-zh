  \ 命令提供了关于命令的帮助信息。当你知道命令名称并需要关于传递参数的快速文档时，`help` 非常有用。`docsearch` 允许你搜索一个术语，无论会显示包含它的命令列表。例如，`help\
  \ average` 告诉我们未找到并建议 `docsearch`。使用 `docsearch average` 会弹出一个有 800 多个结果的浏览器窗口。\n\
  \n### 3. 返回 `a` 除以 `b` 的结果。用法：\n```matlab\nc=mydivision(a,b);\nfunction c = mydivision(a,\
  \ b)\n  assert(b ~= 0, 'Second parameter must be zero.');\n  c = a/b;\nend\n```\n\
  现在测试一下：\n```matlab\n>> mydivision(3, 2)\nans = 1.5000\n>> mydivision(3, 0)\nError\
  \ using mydivision (line 5) Second parameter must be zero.\n>> mydivision(3, -2)\n\
  ans = -1.5000\n```\n\n### 5. 它包含了以下行。MathWorks 的参数验证网页列出了 `mustReal(value)` 和 `mustInteger(value)`\
  \ 两种可能性。然而，第二个还包含了确保它是实数的检查，所以我们不需要第一个。另一个函数是 `mustNonzero(value)`，它完成了检查。因此我们将该行更改为：\n\
  `{mustInteger(value), mustNonzero(value)}`\n这显示了这些更改后如何工作。\n```matlab\n>> exampleValidation2(4)\n\
  2\n>> exampleValidation2(-4)\n0.0000 + 2.0000i\n>> exampleValidation2(0)\nError\
  \ using exampleValidation2 Invalid input argument at position 1. Value not zero.\n\
  >> exampleValidation2(4.1)\nError using exampleValidation2 Invalid input argument\
  \ at position 1. Must be integer.\n>> exampleValidation2(4 + 1j)\nError using exampleValidation2\
  \ Invalid input argument at position 1. Must be real.\n```\n\n### 7. 它返回 0。`uint8(4)`\
  \ 部分指定返回值为无符号 8 位值。MATLAB 使用此数据类型作为表达式的结果，从 4 中减去 6 得到 0，这是它最接近 -2 的 `uint8` 值。\n\
  \n### 9. 假设代码中定期对该变量进行检查，并在其为真时打印额外信息，这在程序需要更新时会让程序员的工作变得更容易。这可能发生在添加新功能或发现程序对某些输入失效时。\n\
  \n# 第 12 章答案\n\n### 1. 我们可以很容易地读取数据并绘制前两列。\n```matlab\nx = csvread('BB133temps.csv');\n\
  plot(x(:,1),'b')\nhold on\nplot(x(:,2),'g')\n```\n为了找到误差，我们将一列减另一列。接下来，在单独的图中绘制此图。\n\
  ```matlab\n% Find the error\ny = x(:,1) - x(:,2);\nfigure();\nplot(y, 'r');\n```\n\
  绘制测量温度与设定温度之间的误差，但“平均误差”呢？我们可以保持误差的运行加和，其中样本 $n$ 处的值是到目前为止的总和。然后我们可以通过所有误差之和除以测量次数找到平均误差。\n\
  ```matlab\nerr_sum(1) = y(1);\nfor k=2:length(y)\n  err_sum(k) = err_sum(k-1) +\
  \ y(k);\nend\navgerr = err_sum./(1:length(y));\nplot(avgerr);\n```\n我们然后绘制平均误差。\n\
  \n### 3. `fixCSV.m` 程序有几行需要更改。\n```matlab\nif (y1(k, 1) <= -1000)\n...\nif (y1(k,\
  \ 4) <= -1000)\n```\n由于 -1000 比 0 小得多，我们可以简单查找小于 0 或大于 100 的值。这假设单位是摄氏度；华氏度使用 32\
  \ 和 212。\n```matlab\nif ((y1(k, 1) < 0) || (y1(k, 1) > 100))\n...\nif ((y1(k, 4)\
  \ < 0) || (y1(k, 4) > 100))\n```\n最好是定义冰点和沸点值，而不是硬编码。\n\n\n\n\n\n# 第 13 章答案\n\n\
  ### 1\n可以使用 `perms` 函数，尽管自己编写一个程序来实现这一过程更具启发性。例如 `perms(1:3)` 会生成一个矩阵，其中每一行都对应值\
  \ 1、2 和 3 的一种排列。\n\n```matlab\nN = length(str);\n\n% 获取值 1, 2, .. N 的排列矩阵\np = perms(1:N);\n\
  \n% 将 p 应用于字符串\n[MAXR, MAXC] = size(p);\n\nfor k=1:MAXR\ndisp(str(p(k, :)))\nend\n\
  ```\n\n对于 3 个字符的字串，它会打印 6 行。对于 4 个字符，它打印 24 行，即 4×(6)。对于 5 个字符，它打印 120 行，即 5×(4×(6))。从这可以看出，`N`\
  \ 个字符会生成 `N!` 行。这种增长速率为 `O(N!)`。\n\n### 3\n```matlab\na = rand(1, 1000000);\nt =\
  \ zeros(1, 10);\n\nfor k=1:10\ntic;\nc = fft(a);\nt(k) = toc;\nend\n```\n\n据此可知，一台计算机给出的平均值为\
  \ 47 ms。\n\n```bash\n>> t1 = sum(t)/10;\n>> disp(t1)\n0.0468\n```\n\n假设这代表 `n log2`\
  \ 次操作，其中 `n` 为 1,000,000，那么这是 19,931,568 次操作 (`op1`)。执行 DFT 将需要 `n²` 或 1,000,000,000,000\
  \ 次操作 (`op2`)。\n\n```bash\n>> op1 = 19931568;\n>> op2 = 1000000 ^ 2;\n>> t2 = t1\
  \ * op2 / op1;\n```\n\n通过简单的比例 `t2 = t1 * op2 / op1`，我们发现 `t2` 为 2348 秒，或者比之前长了\
  \ 2347.9872 秒。\n\n# 第 14 章答案\n\n### 1\n你也可以在机器上建立 git 仓库。这里是一个提交和更新项目的示例。\n\n```bash\n\
