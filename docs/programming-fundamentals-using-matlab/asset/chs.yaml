  # 第 6 章答案\n\n### 1. 包含电子邮件的文件可以视为文本。每条消息都包含一个头部，包括发送者、时间、主题和接收者。它可能包含许多其他信息，比如到达你这里的路径。头部之后是一个空行，然后是消息正文。对于此解决方案，头部的第一行假设“From,”后面跟着空格。为了查看它是如何工作的，将一组示例消息放在名为\
  \ `myemails.txt` 的文件中。`fgetl` 函数可能有用，但它省略了行尾，这意味着寻找空行很难。\n\n```matlab\nfilename1\
  \ = 'myemails.txt';\n% 打开文件，检查是否成功。\ninfile = fopen(filename1, 'r');\nif (infile\
  \ < 0)\nerror('Could not open the input file');\nreturn\nend\n% 读取整个文件。\ntemp =\
  \ fgets(infile);\nlinecount = 0;\nwhile (ischar(temp))\nlinecount = linecount +\
  \ 1;\nlines{linecount} = temp;\ntemp = fgets(infile);\nend\nfclose(infile);\n\n\
  % 遍历行，分离主题\nLF = 10; % 换行，行尾\nem = 0; % 电子邮件索引\nfor k=1:length(lines)\ntemp = lines{k};\n\
  % 注意下一行 F 之后的空格\nfoundStatus = strfind(temp, 'From ');\nif (~isempty(foundStatus))\
  \ && (foundStatus == 1)\n% 这是一条新消息的开始\nheader = true;\nif (em > 0)\n% 这我们的第一封邮件，\n\
  % 所以记录停止\nemail(em).stopLine = k-1;\nend\nem = em + 1;\nemail(em).startLine = k;\n\
  end\nif ((temp(1) == LF) && (header)\n% 找到消息正文的开始\nheader = false;\nemail(em).startBody\
  \ = k;\nend\nfoundStatus = strfind(temp, 'Subject');\nif (~isempty(foundStatus))\
  \ && (foundStatus == 1) && header\n% 找到主题\n% 如果输入格式错误，em 可能是 0。\nemail(em).subjectIndex\
  \ = k;\nend\nend\n% 记录最后的停止行\nemail(em).stopLine = k;\n% 将所有主题合并\nfor k=1:length(email)\n\
  si = email(k).subjectIndex;\nsubjects{k} = lines{si};\nend\n% 排序主题\n[sorted, indices]\
  \ = sort(subjects);\n% 按排序顺序打印电子邮件\n% 这可以写入文件。\nfor m=1:length(indices)\n% 按排序顺序显示电子邮件\n\
  em = indices(m);\nfor k=email(em).startLine:email(em).stopLine\n% 在屏幕上，这会打印一个额外的\
  \ LF\nend\nend\n```\n\n\n\n\n\n```matlab\n% 在每行执行后\n\ndisp(lines{k});\n\nend\n\n\
  end\n```\n\n### 3.  base64 编码每次从二进制值中提取 6 位并转换为字符。这 64 个字符为 `A` 到 `Z`，然后是 `a` 到\
  \ `z`，接着是 `0` 到 `9`，最后是 `+` 和 `/`。当二进制序列没有在偶数边界结束时，使用字符 `=` 进行填充。以下是一个编码程序。\n\n\
  ```matlab\nfilename1 = 'somebinaryfile';\n\nfilename2 = 'somebinaryfile.txt';\n\n\
  base64 = strcat('ABCDEFGHIJKLMNOPQRSTUVWXYZ', ...\n\n'abcdefghijklmnopqrstuvwxyz0123456789+/=');\n\
  \n% 打开文件，检查操作是否成功。\n\ninfile = fopen(filename1, 'r');\n\noutfile = fopen(filename2,\
  \ 'w');\n\nif ((infile < 0) || (outfile < 0))\nerror('Could not open the files');\n\
  return\nend\n\n% 处理输入\nbinvals = [1, 2, 4, 8, 16, 32];\n\n[ch, notdone] = fscanf(infile,\
  \ '%c', 3);\n\nwhile (notdone == 3)\n% 每读入 3 个字符输出 4 个\na = uint8(ch); % 转换为 uint8\n\
  % 提取位。\nbits1 = bitget(a(1), 1:6);\nbits2 = [bitget(a(1), 7:8), bitget(a(2),1:4)];\n\
  bits3 = [bitget(a(2), 5:8), bitget(a(3),1:2)];\nbits4 = bitget(a(3), 3:8);\n% 将位转换为索引\
  \ (0 到 63) + 1\nv1 = sum(binvals .* double(bits1)) + 1;\nv2 = sum(binvals .* double(bits2))\
  \ + 1;\nv3 = sum(binvals .* double(bits3)) + 1;\nv4 = sum(binvals .* double(bits4))\
  \ + 1;\n% 一组新的 base64 字符\noutchars = [ base64(v1), base64(v2), ...\n\n  base64(v3),\
  \ base64(v4)];\nfwrite(outfile, outchars);\n% 获取更多\n[ch, notdone] = fscanf(infile,\
  \ '%c', 3);\nend\n\n% 处理最后几个字符\na = uint8(ch);\na(notdone+1:3) = 0;\nbits1 = bitget(a(1),\
  \ 1:6);\nbits2 = [bitget(a(1), 7:8), bitget(a(2),1:4)];\nbits3 = [bitget(a(2), 5:8),\
  \ bitget(a(3),1:2)];\nv1 = sum(binvals .* double(bits1)) + 1;\nv2 = sum(binvals\
  \ .* double(bits2)) + 1;\nv3 = sum(binvals .* double(bits3)) + 1;\nv4 = 65;\nif\
  \ (notdone < 2)\nv3 = 65;\nend\noutchars = [ base64(v1), base64(v2), ...\n\n   \
  \   base64(v3), base64(v4)];\nfwrite(outfile, outchars);\n% 关闭文件\nfclose(infile);\n\
  fclose(outfile);\n```\n\n这里是一个解码程序。\n\n```matlab\nfilename1 = 'somebinaryfile.txt';\n\
  \nfilename2 = 'somebinaryfile2';\n\nbase64 = strcat('ABCDEFGHIJKLMNOPQRSTUVWXYZ',\
  \ ...\n\n'abcdefghijklmnopqrstuvwxyz0123456789+/=');\n\n% 打开文件，检查操作是否成功。\ninfile\
  \ = fopen(filename1, 'r');\noutfile = fopen(filename2, 'w');\n\nif ((infile < 0)\
  \ || (outfile < 0))\nerror('Could not open the files');\nreturn\nend\n\n% 处理输入\n\
  binvals2 = [1, 2, 4, 8, 16, 32, 64, 128];\n\n[ch, notdone] = fscanf(infile, '%c',\
  \ 4);\n\nwhile (notdone == 4)\n% 每读入 4 个字符输出 3 个\na = uint8(ch); % 转换为 uint8\n%\
  \ 转换为索引\nv1 = strfind(base64, a(1)) - 1;\nv2 = strfind(base64, a(2)) - 1;\nv3 =\
  \ strfind(base64, a(3)) - 1;\nv4 = strfind(base64, a(4)) - 1;\n% 索引为 0..64\nbits1\
  \ = [bitget(v1, 1:6), bitget(v2, 1:2)];\nbits2 = [bitget(v2, 3:6), bitget(v3, 1:4)];\n\
  bits3 = [bitget(v3, 5:6), bitget(v4, 1:6)];\n% 将位转换为 0..255\nv1 = uint8(sum(binvals2\
  \ .* double(bits1))) ;\nv2 = uint8(sum(binvals2 .* double(bits2))) ;\n% 如果文件经过编码后又解码，这会追加一个\
  \ 0。\n% 对于需要精确解码的文件，这是一个问题。\nv3 = uint8(sum(binvals2 .* double(bits3))) ;\nfprintf(outfile,\
  \ '%c%c%c', v1, v2, v3);\n% 获取更多\n[ch, notdone] = fscanf(infile, '%c', 4);\nend\n\
  % 假设在偶数边界结束。\n% 对于编码器这可能是真的。\n% 关闭文件\nfclose(infile);\nfclose(outfile);\n```\n\n\
  ### 第 7 章答案\n1. 这是一个该函数。\n```matlab\nfunction rsum = recursive_sum(n)\nif (n <=\
  \ 1)\n% 如果得到错误的输入如 -1，将得到错误的结果\n% 但可以工作。\nrsum = 1;\nelse\nrsum = n + recursive_sum(n-1);\n\
