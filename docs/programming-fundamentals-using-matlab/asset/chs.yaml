  表 7.2 递归的工作原理。\n\n## 前言\n\n人们在许多领域使用 MATLAB，例如生物学、化学、数学、工程和物理。考虑到数据量以及 MATLAB 的易用性，这是一个非常自然的契合。\n\
  \n## 为什么写一本 MATLAB 书\n\n这本书源于一门 MATLAB 入门课程。每一章尽可能保持独立。第一章涵盖了反复出现的概念和术语。对于已经有编程经验的人来说，这部分读起来，但对于其他人来说，足够让他们开始编程了。\n\
  \n\n\n\n\n本书附有配套文件和补充材料。例如，许多插图都有彩色版本。文中显示的示例代码、函数和程序，图像、声音和其他数据文件也是提供的。书中的所有彩色插图都可以在光盘上（或可下载的配套文件中）找到。*您也可以写邮件至\
  \ info@merclearning.com 向出版方获取这些文件。*\n\n# 教学辅助材料\n\n采用本教材后，教师可以获得章节末练习题的答案和幻灯片。\n\
