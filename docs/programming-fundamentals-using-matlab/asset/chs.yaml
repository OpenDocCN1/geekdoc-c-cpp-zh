  x = imread('redBottle3.jpg');\nfigure();\nimshow(x);\n% 转换为灰度图\ny = rgb2gray(x);\n\
  figure();\nimshow(y);\n```\n3. 使用 `edge`，我们看到了边缘检测技术。这里是使用它们的程序。\n```matlab\nx =\
  \ imread('redBottle3.jpg');\ny = rgb2gray(x);\nedges1 = edge(y, 'canny');\nedges2\
  \ = edge(y, 'log');\nedges3 = edge(y, 'witt');\nedges4 = edge(y, 'sobel');\n% 显示结果\n\
  figure();\nsubplot(2, 2, 1);\nimshow(edges1);\ntitle('Canny');\nsubplot(2, 2, 2);\n\
  imshow(edges2);\ntitle('Laplacian of Gaussian');\nsubplot(2, 2, 3);\nimshow(edges3);\n\
  title('Prewitt');\nsubplot(2, 2, 4);\nimshow(edges4);\ntitle('Sobel');\n```\n5.\
  \ 这个解决方案有两个部分：第一部分是直接的，显示图像，获取 `ginput` 坐标，转换为行列并获取对应的图像像素值。将该像素变为蓝色很容易，只需更改颜色值。第二部分更困难，尽管我们可以很容易想象。通过检查相邻像素并更改它们，等等，它增长很快。从第一个像素开始，我们有\
  \ 8 个邻居需要检查。每个邻居也有 8 个邻居（包括第一个像素），至少重复两次。我们需要一种方法来记住哪些邻居需要检查以及是否已经检查过位置。这是一个处理第一部分的函数。第二部分将由名为\
  \ `blue_image` 的函数处理。\n```matlab\nv = imread('redBottle3.jpg');\nx = rgb2gray(v);\n\
  imshow(x);\n[mousex, mousey] = ginput(1);\nr = round(mousey);\nc = round(mousex);\n\
  % 将邻居也设置为蓝色\ny = blue_image(x, r, c);\n% 显示结果\nimshow(y);\n```\n更改邻居需要一些工作。处理此问题的方法是创建一个与图像大小相同的矩阵。我们可以用\
  \ 0 表示未检查，1 表示已检查。因此我们将第一个像素的坐标设置为 1，并将图像像素变为蓝色。然后我们将行和列添加到 `checklist` 数组中。处理 `checklist`\
  \ 数组直到到达末尾，表示没有剩余需要检查的。从它的当前条目开始检查所有邻居，如果为 0，则将其更改为 1。我们检查它们是否与原始像素值相同，如果是，将其变为蓝色并将所有邻居添加到\
  \ `checklist` 数组中。\n```matlab\nfunction x = blue_image(original, r, c)\n% 将原始拷贝到颜色\n\
  x(:,:,1) = original;\nx(:,:,2) = original;\nx(:,:,3) = original;\noriginalR = x(r,\
  \ c, 1);\noriginalG = x(r, c, 2);\noriginalB = x(r, c, 3);\n% 将此像素变为蓝色\nblue1 =\
  \ 0;\nblue2 = 0;\nblue3 = 200;\nx(r, c, 1) = blue1;\nx(r, c, 2) = blue2;\nx(r, c,\
  \ 3) = blue3;\n[MAXR, MAXC, MAXD] = size(x);\ncheckMatrix = zeros(MAXR, MAXC);\n\
  k = 1;\ncheckedIndex = 0;\nchecklist(k).row = r;\nchecklist(k).col = c;\ncheckMatrix(r,\
  \ c) = 1;\n% 邻居的偏移\nroffset = [-1, -1, -1, 0, 0, 1, 1, 1];\ncoffset = [-1, 0, 1,\
  \ -1, 1, -1, 0, 1];\nwhile (checkedIndex < length(checklist))\ncheckedIndex = checkedIndex\
  \ + 1;\n% 获取下一个项，处理它\nr1 = checklist(checkedIndex).row;\nc1 = checklist(checkedIndex).col;\n\
  % 检查每个 8 个邻居\nfor m=1:8\nr2 = r1 + roffset(m);\nc2 = c1 + cooffset(m);\n% 确保这个行、列是有效的\n\
  if (isRCinbounds(r2, c2, MAXR, MAXC))\n% 我们之前检查过吗？\n% 如果是，跳到下一个\nif (checkMatrix(r2,\
  \ c2) == 0)\ncheckMatrix(r2, c2) = 1; % 标记它\n% 此像素是否与原始值相同？\nif ((x(r2, c2, 1) ==\
  \ originalR) && ...\n(x(r2, c2, 2) == originalG) && ...\n(x(r2, c2, 3) == originalB))\n\
  % 将其变为蓝色\nx(r2, c2, 1) = blue1;\nx(r2, c2, 2) = blue2;\nx(r2, c2, 3) = blue3;\n\
  % 将邻居添加到检查列表\nfor m=1:8\nr3 = r2 + roffset(m);\nc3 = c2 + cooffset(m);\nif (isRCinbounds(r3,\
  \ c3, MAXR, MAXC))\n% 将此邻居添加到列表\nk = length(checklist) + 1;\nchecklist(k).row =\
  \ r3;\nchecklist(k).col = c3;\nend\nend\nend\nend\nend\nend\n\nfunction OK = isRCinbounds(r1,\
  \ c1, MAXR, MAXC)\nif ((r1 > 0) && (r1 <= MAXR) && (c1 > 0) && (c1 <= MAXC))\nOK\
  \ = 1;\n\nelse\nOK = 0;\nend\n```\n\n\n\n```matlab\nOK = 0;\nend\n```\n\n子函数 `isRCinbounds`\
  \ 用于让代码更易读。\n\n# 第 9 章答案\n\n### 1. 这是一个用于设置 GUI 的程序。\n\n```matlab\nglobal x;\n%\
