  \ 255 - x;\n\n% 显示结果\nimshow(y);\n```\n\n### 11. 有时候以后考虑问题的“边缘”会更容易。我们在这里在这里处理。问题归结为判断当前值是否与上一个值相同。下面的\
  \ `if` 语句实现了这一点。\n\n```matlab\n% 从示例输入开始\na = [2, 1, 1, 1, 1, 7, 3, 8, 2, 2, 7];\n\
  n = 2;\ncount = 1;\nout = ''; % 空字符串\nwhile (n <= length(a))\n% 对于当前值 (n)，它是否重复了？\n\
  if (a(n) == a(n-1))\n% 与上一个重复\ncount = count + 1;\nelse\n% 不重复\n% 报告上一次运行\nout =\
  \ sprintf('%s, %d - %d', out, count, a(n-1));\ncount = 1;\nend\nn = n + 1;\nend\n\
  disp(out);\n```\n\n### 13. 这个解决方案还有几个问题。其一是输出总是以逗号开头。这是一个微不足的问题，可以通过在 `out = sprintf...`\
  \ 命令周围添加一个 `if` 语句来修复。第二个问题是最后一组值没有包含在内。修复这个问题的方法是在最后的 `disp` 命令之前添加 `out = sprintf...`\
  \ 命令。最后，虽然代码对字符字符串有效，但输出将字符作为十进制值输出，例如，“A”变成 65。解决方案是在需要时将 `sprintf` 命令中的 `%d` 格式说明符改为\
  \ `%c`。当输入 `a` 具有字符类时，调用 `ischar(a)` 返回 true。\n\n第一个值将始终被保留。只有当下一个值没有出现在“保留”列表中时，它才会被保留。\n\
  \n```matlab\n% 从示例输入开始\na = [2, 1, 1, 1, 1, 7, 3, 8, 2, 2, 7];\nkept(1) = a(1);\
  \ % 保留第 1 值\nk = 2; % 下一个保留值的索引\nfor n = 2:length(a)\n% a(n) 是否已经在 kept 列表中？\n%\
  \ find (a(n) == kept) 得到一个逻辑数组\n% 如果它的和为 0，说明它不在列表中\nif (sum(a(n) == kept) == 0)\n\
  % 尚不在 kept 列表中\nkept(k) = a(n);\nk = k + 1;\nend\nend\ndisp(kept);\n```\n\n这个解决方案使用了一个技巧：将值与数组进行比较，这会产生一个零和一组成的数组。如果结果全为零，我们就知道数组中没有匹配项。\n\
  \n### 15. 这是一个简单的语法错误。我们使用方括号来定义数组。\n\n```bash\n>> a = [1, 2, 3]\n```\n\n或者，范围 `a\
  \ = 1:3` 同样有效。\n\n---\n\n# 第 5 章答案\n\n### 1. 结构应该包含像 `value` 和 `repetitions` 这样的字段。这个问题没有明确说明我们必须解析序列字符串，尽管这个答案会这样做。解析字符串可能是最困难的部分。这个答案假设所有数字都是整数。\n\
  \n```matlab\ninput_str = '1 - 2, 4 - 1, 1 - 7, 1 - 3, 1 - 8, 2 - 2, 1 - 7';\n% 将字符串中的数字找到数组中。虽然有\n\
  % 更紧凑的解决方案，但应该易于理解。\n% 注意输入中的逗号和横线。\ndigits = ((input_str >= '0') & (input_str <=\
  \ '9'));\ncount = 1;\nk = 1;\n% 循环直到处理完所有 digits\nwhile (sum(digits(k:end)) > 0)\n\
  % 找到第一个 1 (digit)\nwhile ((k <= length(digits)) && (digits(k) ~= 1))\nk = k + 1;\n\
  end\nstart = k;\n% 找到下一个 0 (意味着 digit 结束)\nwhile ((k <= length(digits)) && (digits(k)\
  \ ~= 0))\nk = k + 1;\nend\nstop = k - 1;\n% 现在 start, stop 定义了子字符串。\nnumbers(count)\
  \ = str2double(input_str(start:stop));\n% ...\n% 现在我们有一个包含 input 中所有值的数组。假设第一个是\
  \ value，第二个是 repetitions，\n% 第三个是 value，第四个是 repetitions...\ncount = 1; % 为了不同的目的复用\n\
  for k=1:floor(length(numbers)/2)\nmystruct.value = numbers(count);\ncount = count\
  \ + 1;\nmystruct.repetitions = numbers(count);\ncount = count + 1;\nrunlengths(k)\
  \ = mystruct;\nend\n% 最后，打印它以确保正确\ndisp('Original input:');\ndisp(input_str);\n\
  disp('Structure of values and repetitions');\nfor k=1:length(runlengths)\ndisp(sprintf('%d\
  \ value %d', runlengths(k).value, runlengths(k).repetitions));\n```\n\n### 3. 这个问题有一个潜在陷阱：对文件使用\
  \ `csvread` 会产生错误，因为它包含文本。解决方案是使用 `readtable`。\n\n```matlab\nemployee_table = readtable('example_table.csv');\n\
