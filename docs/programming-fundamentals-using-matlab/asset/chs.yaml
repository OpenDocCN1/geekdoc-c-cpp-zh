  \ 第 1 章：MATLAB 环境与编程术语\n\n```matlab\ndisp('helloworld!');\n```\n\n人们学习一种新编程语言时，编写的第一个程序通常是“Hello,\
  \ World!”程序。计算机对程序员要求它执行的操作做出响应，展示了在控制方面取得的一个小胜利。程序员给计算机一个命令，计算机执行该命令并返回显示其已完成任务的消息。更好的是，它没有警告和错误信息。许多语言有几行代码必须精确输入，即使是这样简单的任务也是如此。幸运的是，MATLAB^®\
  \ 不需要，上面那行代码就足够了。\n\n如果你是一个经验丰富的程序员，应该注意 MATLAB 使用单引号来标记字符串的开始和结束。最近的 MATLAB 版本也允许使用双引号来界定字符串。如果你不是经验程序员，不要担心，这本书是为所有人编写的。\n\
  \nMATLAB 会计算你输入的表达式的结果，因此你可以将其用作计算器。假设你正在订购外卖送回家里，并想根据订单金额包含小费。如果订单金额为 23.17 美元，你想知道\
  \ 15% 的小费是多少，你可以输入 `23.17 * 15/100`，其中 `15/100` 字面意思就是 15 百分，即 15 除以 100。表达式 `23.17\
  \ * 0.15` 同样有效。输入 MATLAB 命令窗口后，你将看到以下内容。`>>` 是 MATLAB 的命令提示符，当它等待你输入内容时会显示。\n\n\
  ```text\n>> 23.17 * 15/100\n\nans =\n\n3.4755\n```\n\n编程世界涉及*抽象*（abstractions），我们总结代码的行为，然后将该代码作为构建模块。在前面的的示例中，我们可以将其总结为针对\
  \ 23.17 美元订单的 15% 小费计算器，尽管如果能让它适用于任何给定的订单金额会更好。这将在后面的材料中讨论。为了理解抽象，我们首先需要一些经验，所以当你看到代码或等式时，请输入你自己的数字。对于文中的示例代码，在\
  \ MATLAB 会话的命令提示符处输入它，并查看是否符合你的预期。书中包含的许多示例都采用了随机选择的值。例如，如果用 `15/100*23.17` 重复之前的示例会怎样？或者用\
  \ `10*20/30` 呢？为了理解事物是如何运行的，请输入一个数字。在实验代码时，选择什么值通常并不重要，因为我们只是想要一个“具体的”示例。如果数字不起作用，计算机可能会指出。或者它可能会执行命令并给你一个意料之外的结果，例如当指示寻找\
  \ `15/0` 时。\n\n```text\n>> 15/0\n\nans =\n\nInf\n```\n\n某些计算机语言在被除以零时会报错。在这种情况下，MATLAB\
  \ 仅返回“无穷”作为答案。\n\n为了记住反复使用的值，我们使用*变量*（variable）。一个常见的类比是将变量想象成邮政箱，你可以在每个箱子里放入一个值。为了跟踪变量，也许在尝试弄清楚程序在做什么时，写下它的名称并在旁边画一个框。在箱子里放入它拥有的任何值。它一次只能有一个值，所以在给它赋予新值时，请删掉任何旧值。你可能注意到\
  \ MATLAB 将上一个表达式的结果存储在 `ans` 变量中。\n\n技术随时间而变化。正如你无法想象你的父母在没有手机、电视和互联网的情况下如何生活一样，20\
  \ 年后的人将认为今天的最新进展相比之下是原始的。对于我们来说，计算机是一个可以放入手提包的轻量级设备；对于他们来说，计算机可能像信用卡一样重（虽然没有那么大），并且可以放在钱包里。\n\
  \n![Image](img/figure1_1.jpg)\n\n***图 1.1*** MATLAB 用户界面的草图。命令窗口在左侧。\n\n注意：此图和书中的所有彩色插图都可以在光盘上（或可下载的配套文件中）找到。\n\
  \n随着技术的变化，我们使用的工具也随之变化。本文关于其中一种工具，它被全球的科学家和工程师使用。随着开发者添加新功能，它随时间变化。过去让用户说“为什么这不起作用？它应该可以”的事情现在已经实现了。用户的工作变得更简单了，因为工具做得更多，而关于工具的必要信息也增加了。在某种意义上，用户预期了解更多。\n\
  \n本指南并不是为了教你该工具的一切。相反，目标是教授基础知识，并建立语法：即我们给计算机的指令。\n\n注意，本文示例有时包含提示符 `>>`。如果你自己尝试这些示例（强烈建议这样做），你不需要输入\
  \ `>>`。如果你使用的是为学生设计的“教育版” MATLAB，你会看到 `EDU>>` 作为提示符。这并不重要。本文中的示例可以使用三个点（`...`）换行。你会经常看到这种情况，主要是为了让示例很好地适应页边距，并且仍然有效。当你对事物如何运行产生疑问时，会有这种情况。例如，在\
  \ `a = 5` 中，等号周围的空格是必要的吗？试试看！\n\n### 1.1 算法\n\n*算法*（algorithm）至少在日常术语中意味着完成任务的计划。它是按给定顺序采取的抽象步骤列表。这些步骤在“抽象”意义上可能非常复杂。形式上，计算机科学家用图灵机（Turing\
  \ Machine）来描述算法，这是一种简单的理论设备，在带上运行，左右移动，读取和替换符号，根据一组状态（条件）和指令运行。它可以进入接受状态、拒绝状态或无限运行。模糊地说，状态跟踪步骤，并根据输入产生其他状态的转换。\n\
  \n为了说明算法的非正式概念，让我们考虑一组驾驶指令。假设你有一组指令：\n\n1. 直行一英里，然后左转。\n2. 在第三个路灯处右转。\n3. 过铁路后，立即右转。\n\
  4. 在左侧的第五栋房子停下。\n5. 如果看到死胡同标志，说明你走得太远了。后退约 500 英尺。\n\n\n显然，你必须按顺序执行这些步骤，否则你无法到达目的地。此外，人类能够理解每一步的含义，而无需进一步解释。人类也非常擅长发现问题。例如，如果铁路轨道被铺盖了会怎样？如果我们开车了很久却一直没看到轨道会怎样？人类会知道某些地方不对，并采取行动（例如，给提供方向指示的人打电话）。\n\
  \n算法是用类英语的方式制定的，被称为`伪代码`（`pseudo-code`）。当我们编写一个算法时，我们首要关注的是传达思路，而对符合机器可理解的模式的关注程度较小。例如，如果第二行以小写字母开头，而第四行没有以句号结尾会怎样？虽然我们喜欢一致性，但任何人类仍然能理解算法。\n\
  \n`循环`（`loop`）是指一组指令的重复，每次重复被称为一次`迭代`（`iteration`）。例如，烹饪说明可能会写道：“切胡萝卜并放在一旁。对洋葱重复此操作。”如果我们遵循要求多次执行某事的指令，我们可能会数手指，或者可能大声数出来。`索引`（`index`）用于跟踪迭代次数，用一个变量存储此值。我们从\
  \ 1 开始，每重复一次计数加 1，并在达到最大值时停止。当然，我们可以从最大值开始倒数，就像有些人在锻炼时将其作为一种激励技巧那样。我们甚至不需要按整数来数；想象一下如果你在四分之一英里的跑道上跑圈数。如果你计划达到每天\
  \ 5 英里的目标目标，而你今天早上已经跑了 2.5 英里，你可能会从 2.5 开始，每回到起点就加 0.25。这种类型的循环执行固定的次数，且该次数是预先的。其他循环则重复直到满足某个条件为止。\n\
  \n伪代码语句由人类编写，供其他人类阅读。它们遵循标准，以便可以直接在编程语言中表达，例如对每一步进行编号，并包含诸如 `for` 等特定的关键字。许多计算机语言都有由关键字\
  \ `for` 调用的循环结构，尽管它们在特定语法（语句的表达方式）上有所不同。伪代码语句并不是为了让计算机理解。它们在指令序列和控制流方面非常精确，但对某些事情的实现方式又刻意保持模糊，例如“显示结果”。无论该结果是以文本形式显示在屏幕上、打印在纸上，还是显示在高分辨率显示器上，并不重要。实现该算法的程序员将使用特定的计算机语言确定显示结果的最佳方法。\n\
  \n### 1.2 程序\n\n`程序`（`program`）是一系列供计算机遵循的指令列表。有些人会将其与算法混淆，但两者的目标受众不同。算法是面向人类的，而程序主要面向计算机的。程序必须比算法详细得多，因为它们必须以计算机可以理解的方式规定要做什么，而不是以同类人类会遵循的方式来表述。程序必须符合`语法`（`syntax`），即程序员向计算机指定命令的规则。不同的计算机语言具有不同的语法。\n\
  \n假设我们将上述算法翻译成程序并交给计算机。它将完全按照它被指示要做的事情执行。如果它没有检测到铁路交叉口，它可能会一直寻找下去。我们需要测试它。我们需要提供命令来处理意外情况，例如未使用的火车轨道被铺盖了这种情况。\n\
  \n当我们编写程序时，我们称其为`源代码`（`source code`）。大多数编程语言都有一个特殊程序被称为`编译器`（`compiler`），这意味着程序将被翻译（`编译`）成计算机的微处理器（也称为中央处理单元，或\
  \ `CPU`）可以使用的形式。编译后的代码特定于该计算机类型的 `CPU`，即：在基于 PowerPC 的 Mac 上编译的程序与 Sun SPARC 处理器不兼容，与基于\
  \ Intel 的个人电脑也不兼容。同样，在基于 PowerPC 的 Mac 上编译的程序与最近基于 Intel 的 Mac 不兼容。编译器生成一个`可执行`（`executable`）程序，其他人可以在他们的计算机上使用它，甚至可以为此付费。大多数人在说“软件”时，指的是可执行程序。相比之下，`硬件`（`hardware`）指的是物理计算机。`运行`程序意味着执行它；即告诉计算机应该遵循程序指定的指令。顺便说一下，“app”只是应用程序的流行词，它的意思和软件一样，尽管它通常是专门为移动设备制作的软件。\n\
  \n在某些公司，可执行程序是出售的，而制作它们的源代码则被严格视为秘密。一个类比是可口可乐最近的新闻：尽管每天有数百万人购买口可乐产品，但据一名员工获得了秘密配方，并试图以超过百万美元的价格卖给竞争对手百事乐\
  \ [1]。不用说，这一阴谋被发现了，相关人员被捕了。与软饮料制造商销售产品但不披露具体制作方法一样，软件公司可能会编写一个实用的程序并只出售其可执行版本。我们称之为`闭源`（`closed\
  \ source`）。普通（家庭）用户如果拥有源代码将不知道该怎么办，但程序员可以检查其错误或添加新功能，并可能使其变得更好。当然，不道德的程序员可能会对其进行足够修改以使其看起来是自己的作品，然后出售可执行代码。或者他们可以发现代码中的漏洞，并将其用于恶意目的，例如接管别人的机器。\n\
  \n另一种方法是`开源`（`open source`）运动，源代码是公开的（通常是免费的）。一个明显的问题是：“你如何通过免费送东西来赚钱？”答案之一是便利。考虑给汽车换油。如果你曾经换过汽车机油，可能并不困难，但是一种很糟糕的体验。当你开车去快速换油中心，支付合理的费用让别人在几分钟内帮你完成时，何必要让自己弄脏呢？同样，一个技术人员可能会发现软件光盘（或其他介质）的微小费用非常值得，而不是花费整个晚上去下载代码、配置、编译等。此外，服务是开源软件公司的一个潜在收入领域，因为许多用户愿意支付年费，以便咨询非常熟悉该软件的技术人员。用户还会付费订阅自动更新。但如果一个不道德的人发现了软件中可以被他们利用的漏洞怎么办？当然，这是一个潜在的问题，但开源社区发现的是，许多好人会发现潜在问题，并且更新会迅速发布。\n\
  \n\n\n\n与开源软件相关的是开放标准。一个很好的例子是便式文档格式（PDF），它与 Adobe Acrobat 程序相关。虽然 Acrobat 是闭源软件，但便式文档格式标准是一个开放标准；它在互联网上是可以获取的。（实际上，便式文档格式标准基于\
  \ postscript，另一种开放标准。）这意味着，虽然你无法访问 Acrobat 的源代码，但你仍然可以编写自己的程序来读取或写入便式文档格式文件。并不是所有标准都是开放的，使用闭源标准已成为一个争议性话题。马萨诸塞州最近通过了一项法律，要求州政府在处理文档时使用开放标准，其理念是他们的公民有权以开放格式获取公共信息\
  \ [2]。\n\nMATLAB 是 MathWorks 公司的产品，该公司总部位于马萨诸塞州。MATLAB 是一个提供编程环境的程序。（深吸一口气——它真的没有复杂！）根据\
  \ MATLAB 语法编写的程序由 MATLAB 编程环境读取并解释。或者，你也可以说，MATLAB 程序是由 MATLAB 程序读取并执行的。由于这会导致混淆，我们将意将\
  \ MATLAB 程序称为“MATLAB 编程环境”或简单称为“MATLAB”，而用“MATLAB 程序”来指代用 MATLAB 能理解的语法编写的程序。\n\n\
  虽然它是闭源软件，意味着你无法访问源代码，但你会发现许多 MATLAB 函数是可以检查的。程序存储在一种开放标准中，即上述的“MATLAB 语法”。MATLAB\
  \ 程序是扩展名为 `.m` 的文本文件。例如，如果你在 MATLAB 中写了一个计算税费的程序，你可以将其命名为 `mytaxes.m`。顺便说一下，Objective-C\
  \ 语言也使用 `.m` 作为扩展名。如果你点击扩展名为 `.m` 的文件，电脑可能会调用与 MATLAB 不同的编程环境。请见第 2.10 节 MATLAB\
  \ 环境中使用的其他常用扩展名。\n\n通过 MATLAB，你可以与命令行窗口进行交互，逐个输入命令，获取反馈并根据需要修改命令。你可能有一系列命令想要保存并在以后再次使用。在命令行窗口中，输入\
  \ `edit` 会调用 MATLAB 的编辑器，类似于你使用过的其他文本处理软件。在这里，你可以将命令复制并粘贴到编辑器中，然后以以 `.m` 结尾的名字保存，尽管编辑器可能会替你处理好这个细节。该文件就是一个程序，也被称为代码（code）、源代码（source-code）或脚本（script）。稍后我们将介绍函数，目前你可以通过\
  \ `function` 关键字来区分脚本和函数。如果一个 MATLAB 文件的第一行命令开头包含 `function` 单词，那么它就是一个函数。否则，它就是一个脚本。\n\
  \n### 1.3 编译器与错误\n\n编译器一次性翻译整个程序。语法错误（类似于上述算法中缺失的句号）会阻止计算机理解指令。它本质上会说：“我不理解这些指令，所以我无法执行它们。”它可能会在此时停止尝试。如果它继续运行，随后报告的任何进一步错误都可能是第一个错误的结果，因此按顺序检查错误信息是一个良好的习惯。语法错误由程序员修复。另一种错误被称为逻辑错误（logic\
  \ error），当程序执行了程序员无意执行的操作时就会发生。这些命令单独看可能是有意义的，但一起考虑就不太合理了。计算机不会做出判断（除非我们明确告诉它如何做）。它会执行每条命令，精确执行我们要求它做的事。但它可能并没有执行我们希望它做的事！我们还将逻辑错误称为\
  \ bug，这源于一个关于计算先驱格蕾斯·霍珀（Grace Hopper）发现一只导致导致计算机短路并引发错误的飞蛾的故事。\n\n这是一个逻辑错误的示例。假设你写下了计算员工总薪的步骤。有些人兼职，有些人是全职。许多人加班，并获得“时间加半倍”的加班奖金。你的指令可能看起来像这样：\n\
  \n1. if the number of hours worked < 40, then pay=(hours worked)*(pay rate)\n2.\
  \ if the number of hours worked > 40, then pay=(hours worked)*1.5*(pay rate)\n\n\
  如果计算机处理这些指令，许多人将收到奇怪的工资单，甚至可能是负数！这些指令说明了当人工作少于 40 小时该做什么，也说明了当人工作超过 40 小时该做什么。但这些指令完全没有说明当一个人恰好工作\
  \ 40 小时该怎么办。因此，我们得到了逻辑错误。取决于所使用的编程语言，`pay` 中存储的值可能没有经过初始化，因此那里的值是之前偶然存在的任何值。某人可能会收到负几十亿的自动付款，而另一个人可能被记入数百万。\n\
  \nMATLAB 提供了一个解释器。它的工作方式与编译器略有不同，它是逐行翻译的。我们有一个 MATLAB 的交互式环境：你输入一个命令，它执行执行。它会给你即时反馈（除非你让它执行非常耗时的任务）。你可以不断实验，直到完全完美。这种迭代的编程方法意味着对程序进行微小更改、测试并重复此过程。它允许我们一步一步地构建程序。MATLAB\
  \ 为这种方法提供了一个良好的环境，因为我们可以逐条输入命令，并在出错时纠正它们。\n\n### 1.4 变量\n\n变量是数据的标签。正如其名称所暗示，变量的值是可以改变的。计算机程序中的变量与数学中的变量类似。数学家可能会写“设\
  \ x = 1”。同样，计算机程序员可能会写 `x = 1`，这是一个赋值语句的示例。它将值 1 赋值给变量 `x`，因此未来对 `x` 的引用都会变为 1，直到我们为\
  \ `x` 赋值另一个值。下面的简例演示了这一观点。`>>` 之后的所有内容是你输入的命令。\n\n```\n>> x = 1;\n>> disp(x);\n\
  1\n>> x = 5;\n>> disp(x);\n5\n```\n\n如果你在命令行窗口中输入这些行，第一次显示 `x` 时它返回 1，第二次返回 5，因为第三条命令重新赋值了\
  \ `x` 的值。\n\nMATLAB 中的变量是灵活的。你可以存储整数（integer），例如 1、14 或 -937。你可以存储实数，称为浮点数（float）或双精度浮点数（double，精度是\
  \ float 的两倍），例如 1.0、14.6 或 -937.7259。当你需要存储范围很大的数值时，精度差异就会体现。在许多计算机语言中，程序员必须预先“声明”变量，即指定数据类型以及变量名，然后才能赋值。MATLAB\
  \ 允许在不先声明的情况下赋值。MATLAB 的默认数据类型是双。你还可以存储字符，或一组字符，称为字符串（string），例如 'a'、'abc' 或 'My\
  \ address is 246 Oak Street'。\n\n赋值语句的模式是 `变量 = 表达式`，其中变量给出标签如 `x`、`x1` 或 `address`。更通用地说，你可以将等号左侧的所有内容视为存储结果的地方。表达式可以是一个简单的数字，也可以是像复杂的公式。以下是赋值语句的一些示例。\n\
  \n```\nx = 14.6;\naddress = 'My address is 246 Oak Street';\ny = x * 7 + 5;\n```\n\
  \n\n\n\n最后一行回了 `x` 的值，将其乘以 7 并加上 5。如果你输入上述三行代码，变量 `y` 的值将是 107.2。字符串用单引号 `'` 开始和结束，尽管现在\
  \ MATLAB 也允许使用双引号。若要在字符串中使用单引号，请连续使用两个单引号，例如 `mystr = 'don''t have a cow';`。\n\n\
  ### 赋值 vs. 方程\n\n赋值语句与方程不同。例如，在数学中，方程\n\n`x = x + 2`\n\n会导致逻辑不一致，因为 `x` 可以从等式两边消去，导致\
  \ `0 = 2`。显然，这在任何情况下都是可能的。然而，语句 `x = x + 2` 作为赋值是完全有效的。计算机计算该语句的右侧部分 `x + 2`，获取\
  \ `x` 的当前值并对其加 2。（注意，`x` 必须已经有一个值，否则计算机如何知道 `x + 2` 应该是多少？）然后，它将结果存储在左侧给定的变量 `x`\
  \ 中。因此，`x = x + 2` 在数学中不能作为方程，但在计算机语言中作为赋值是完全接受的。作为一个反例，像\n\n`2*y = 4`\n\n这样的方程在数学中是有效的，但不能作为赋值语句，因为左侧包含的不仅仅是一个变量名。我们可以通过求解\
  \ `y` 来修改使其生效；即语句 `y = 4 / 2` 是可以的。\n\n### 使用变量\n\n我们使用变量来跟踪事物。假设你想算出自己在工作中赚了多少钱。你需要知道自己工作了多少小时、每小时工资是多少、所得税比例以及任何其他支出（如停车的税前扣除费用）。如果你把这些内容记录下来，看起来可能像这样：\n\
  \n我本月工作了 60 小时。\n我的工资标准是每小时 $18.75。\n所得税为 20%。\n我每月支付 $30.00 的停车费（税前）。\n税前，我的工资小计将是\
  \ `60*18.75 - 30.00`。\n税费将是上述小计 `* 0.20`。\n我的工资将是 `subtotal - taxes`。\n\n我们可以重写这些信息，将所有内容存储在变量中。下面的文本实际上作为一个简单的程序运行。\n\
  \n```\nhoursWorked = 60;\npayRate = 18.75;\ntaxRate = 0.20;\nparking = 30;\nsubtotal\
  \ = hoursWorked * payRate - parking;\ntaxes = subtotal * taxRate;\npay = subtotal\
  \ - taxes;\ndisp(pay);\n```\n\n上面我们看到了赋值的示例，如 `hoursWorked = 60;`，以及算运算如 `subtotal\
  \ = hoursWorked * payRate - parking;`。注意每行都以分号 `;` 结尾。这不是 MATLAB 的要求，但它展示了程序语法的典型示例——我们使用分号就像在伪代码（英语版）中使用句号一样。在\
  \ MATLAB 命令中使用分号意味着不会回显结果。此外注意变量名不包含空格。有些变量不需要，如 `taxes`，而另一些变量名是两个单词连在一起，如 `payRate`。MATLAB\
  \ 变量名不允许包含空格。\n\n允许的字符包括所有字母，包括大写和小写。但 MATLAB 是区分大小写的；对于它来说，变量 `payRate` 和 `payrate`\
  \ 是不同的变量。变量名中允许数字，只要数字不是第一个字符。例如，`tax1` 和 `t1ax` 是可以接受的，但 `1tax` 则不行。你也可以在变量名中使用下划线\
  \ `_`，同样仅当它不是第一个字符时如此。所以 `pay_rate` 很好，p_a_yRate` 也是。变量名的长度可以任意，但 MATLAB 会忽略第 63\
  \ 个字符之后的所有内容。\n\n### 常数\n\n有时我们可能希望定义一个值，并在整个过程中保持该值不变。我们称之为`常量`。许多计算机语言都有定义常量的方法，使得你的程序以后无法更改它。除了第\
  \ 5 章“组数据”中类定义的 `Constant` 属性外，MATLAB 并没有这种机制。当然，你总是定义一个变量并简单地不改变它。在 MATLAB 中这样做时，通常的做法是使用全大写字母，例如\
  \ `FULL_TIME = 40;`，这定义了一个代表全职员工预期工作小时数的变量。用全大写字母命名变量向程序员发出信号，该值不应被更改。此类赋值通常出现在程序的顶部，以便将来方便地修改。虽然我们不期望常量在程序运行时发生变化，但可能会有我们想要更改值的时候。例如，某些公司将工作\
  \ 35 小时的员工归类为全职。在程序顶部用全大写仅定义一次值，使我们知道该变量应该被视为常量。\n\n### 工作空间与命令\n\n顺便说，你可能会忘记定义过哪些变量。如果你的\
  \ MATLAB 界面显示“工作空间”（Workspace）窗口，你可以在那里查看它们。或者，你可以使用 `who` 命令打印当前定义的变量名。\n\n![Image](img/c3a.jpg)\n\
  \n类似的命令 `who` 显示名称以及其他信息。\n\n![Image](img/c3b.jpg)\n\n在你在本章过程中，尝试不同的命令。当命令行窗口充满了你输入的内容和计算机的响应时，它将开始滚动。如果你想清除命令行窗口，可以使用\
  \ `clc` 命令。在某些时候，你可能想重新开始。在提示符输入 `exit` 或 `quit` 会导致 MATLAB 停止并关闭所有窗口。你可以随时重新启动。当你这样做时，之前的命令会出现在命令行历史窗口中，但响应不会。如果你想保留输入内容以及响应的副本，请使用\
  \ `diary` 命令，如下所示：\n\n```\ndiary('logFromOctober3');\n```\n\n`diary` 命令导致此后输入的命令及其响应被存储在一个名为“logFromOctober3”的文件中，当然你也可以给它起其他名字。\n\
  \n\n\n当我们只有少数值时，这种方法是有效的。但当值很多时，我们该怎么办？如果你发现有一箱满的加油站收据，并想要输入它们，你会很快意识到这种命名方案是不可行的。手动输入平均值的公式将是一项苦差事。当我们需要存储许多数据值时，一个自然的解决方案是使用数组。下面的代码看起来与之前的变量赋值，但有一个关键的区别：数字\
  \ `1` 和 `2` 并不是名称的一部分，它们是值列表的索引。\n\n```mat\ngas(1) = 23.64;\ngas(2) = 35.78;\n```\n\
  \n如果你在列表中列出你在加油站的支出，你就可以通过位置来引用这些值。你可能会问：“为什么我第七次花了那么多钱？”使用数组的优势是计算机可以更抽象地引用这些值。例如，考虑以下代码。\n\
  \n```mat\nx = 7;\ngas(x)\n```\n\n假设 `gas(7)` 有一个值，计算机会将行 `gas(x)` 中的 `x` 替换为索引 `7`，然后查找该值。可以使用循环（稍后会讨论）来处理数组中的所有值。另一个改进方法（稍后也会讨论）是我们可以将所有值存储在一个文件中。\n\
  \n如果我们想向数组中添加另一个值 `42.13`，但我们不确定数组有多长，我们可以使用以下命令来实现这一点。\n\n```matlab\nx = length(gas);\n\
  gas(x+1) = 42.13;\n```\n\n第一行查找数组 `gas` 中有多少个条目，并将结果存储在变量 `x` 中。第二行使用 `x+1` 作为索引，也就是说无论数组有多长，都在其基础上加\
  \ 1。它将数字 `42.13` 存储在该位置。我们可以将上面的代码缩短为一行，如下：\n\n```matlab\ngas(length(gas)+1) = 42.13;\n\
  ```\n\n然而，紧凑的代码并不一定是好代码，尤其是当它降低了可读性时。\n\n在上面的示例中，我们使用了函数 `length`。`function` 是预定义的指令，它可以带有参数（例如示例中的\
  \ `gas`），并在完成后向我们返回一个或多个值。\n\n给变量（或函数）赋予一个预定义的名称是可能的。我们称之为**重载**（overloading），这在某些编程语言中可能很有用。在\
  \ MATLAB 中，这通常是一个坏主意。只要新的变量或函数名存在，你就无法使用原始名称（除非使用函数 `builtin`），然而，你运行的程序可能会使用原始名称，并在重定义的名称上出现问题。考虑以下示例。\n\
  \n```matlab\n>> disp = 4 %      这是一个坏主意\ndisp =\n4\n>> disp(disp)\nIndex exceeds\
  \ matrix dimensions.\n'disp' 似乎既是一个函数又是一个变量。如果这是无意中，请使用 'clear disp' 从工作区中移除变量 'disp'。\n\
  ```\n\n虽然我们可以将 `disp` 设置为一个值，但这样做会导致后续使用 `disp` 作为函数的行出现问题。\n\n大多数编程语言在 във先指定变量的\
  \ `type`（类型）之前不会创建变量，也就是说，你打算在其中存储什么类型的内容。例如，像 `3` 这样的数字是整数，而 `3.1` 是浮点数，`\"3\"\
  ` 是字符（类似于 `\"a\"` 甚至是@\"`）。计算机对它们的处理方式不同，并以不同的方式存储每一个。事实上，你的计算机可能使用 4 字节存储 `3`，使用\
  \ 8 字节存储 `3.1`，使用 1（或 2）字节存储 `\"3\"`。它们的内部表示看起来完全不同。在大多数编程语言中，程序员必须为每个变量指定使用的类型，这很大程度上说明了它将如何被使用。然而，MATLAB\
  \ 会尽力确定正确的类型来创建变量，并根据需要创建变量。默认情况下，MATLAB 将变量创建为 `double` 类型，这意味着它将作为一个具有 64 位精度的浮点数存储。换句话说，数字\
  \ `3` 将存储为 `+3.0 × 2⁰` 的二进制等效值。对于 `'3'`，单引号让 MATLAB 知道不应该用默认类型存储它。我们所说的 `precision`（精度）是指使用的二进制位（“bits”）。可以从油泵的角度来考虑这一点：显示你加了多少油的屏幕通常有\
  \ 3 位美元，然后是 2 位角分。因此，它具有 5 位小数精度。\n\nMATLAB 提供了将数据（以及变量）从一种类型转换为另一种类型的方法，其他语言也是。它对变量非常灵活，允许轻松创建和操作数组及矩阵。\n\
  \n### 1.5 数据类型\n\n值默认是 `double` 数据类型，这意味着计算机在内部将每个值表示为一个符号位（正为 0，负为 1）、一个二进制尾数（52\
  \ 位）和一个二进制指数（11 位），总共 64 位。就像我们可以用科学计数法写浮点数一样，我们可以对包含小数部分的二进制数使用如 `+1.*X × 2^(Y*)`\
  \ 这样的表示法，其中 `X` 和 `Y` 代表二进制值组。例如，数字 `125.125 = 1.25125 × 10²`，而 `1.111101001 × 2⁰¹¹⁰\
  \ = 111101.001`。二进制值 `111101` 表示 `1 × 2⁷ + 1 × 2⁶ + 1 × 2⁵ + 1 × 2⁴ + 1 × 2³ + 1\
  \ × 2² + 0 × 2¹ + 1 × 2⁰`，等于 `125`。同时，`0.001` 等 `0 × 2^(−1) + 0 × 2^(−2) + 1 × 2^(−3)`，或\
  \ `0.125`。所以我们可以用小数表示包含小数部分的数字，或者等价地用二进制表示。`double` 类型意味着它使用 64 位存储包含小数部分的二进制数。\n\
  \n“double”这个名字可能很奇怪。有“single”吗？是的，MATLAB 支持一种 `single` 数据类型，每个值 32 位。如果我们把 `single`\
  \ 类型的精度翻倍，就会得到 `double` 类型，因此有了这个名字。\n\nMATLAB 还支持其他数据类型，我们将关注最常用的几种。`logical` 数据类型存储\
  \ 1 或 0，对应真或假。事实上，这些占用一个字节（8 位）的内存，因为任何小于字节的内容引入的开销都大于其节省的内存。顺便说一下，这些被称为布尔值。\n\n\
  MATLAB 提供了将数据（以及变量）从一种类型转换为另一种类型的方法，其他语言也是。它对变量非常灵活，允许轻松创建和操作数组及矩阵。\n\n\n\n有几个基础\
  \ MATLAB 命令将会被反复使用，本节将提供预览。接下来的章节将提供更多细节以及用法示例。首先，我们有 `assignment`（赋值）语句，它使用等号（`=`）。等号右侧出现的任何内容都会被求值，然后存储在左侧变量中。我们可以在右侧包含算术或逻辑操作。\n\
  \nMATLAB 允许你处理一组数字列表（`array`数组，也称为`vector`向量），就像你处理单个数字（`scalar`标量）一样。事实上，你处理数值\
  \ `matrices`（矩阵）通常和处理标量一样容易。我们还使用 `element`（元素）一词来表示数组或矩阵中的一个值。\n\n算术操作包括我们熟悉的加、减、乘、除。逻辑操作包括比较，例如大于或等于、小于、等于、不等于等。我们使用两个等号（`==`）来测试相等性。此外，我们还可以用\
  \ `and`、`not` 和 `or` 指定复杂的逻辑操作。\n\n编程语言提供了一种执行 `conditional flow`（条件流）的方法，通常使用 `if`\
  \ 语句。我们在上面的驾驶方向中看到过这一点；如果你看到死胡同标志……除了简单的示例外，程序需要一种能够偏离执行某些步骤的方法。在 MATLAB 中，我们通过\
  \ `if .. else .. end` 块来实现这一点。一个 `block`（块）是一组计算机按顺序执行的程序行。关键字 `if` 开始一个块，关键字 `else`\
  \ 或 `end` 结束块。`if` 语句位于一个 `condition`（条件）之前，条件是一个可能（也可能不）求值为真的的表达式。通常，会测试一个比较操作，例如\
  \ `(a < 3)`。当条件为真时，`if` 下的块将执行执行。但当条件不满足时，如果指定了 `else`，则执行 `else` 块。\n\n`switch\
  \ .. case .. end` 语句提供了另一种执行条件流的方法。有时在编程时，我们根据一个变量有几种可能执行的操作。例如，我们可能会提示用户输入，例如“我们应该保存您的更改吗？”，并从键盘读取一个字符。如果键是“Y”或“y”，我们想要执行保存；如果键是“N”或“n”，我们想要在不保存的情况下继续；如果键是“?”，我们可能会打印一些有用信息；如果键是其他任何内容，我们可能会打印我们期望的是“y”或“n”。我们可以用\
  \ `if` 语句编码所有这些内容，但 `switch` 语句可能让程序更容易理解。\n\n很多时候，程序员会反复重复同一段代码。虽然复制和粘贴代码可以起作用，但这将非常繁琐。你可能在某处做了纠正，但忘记在其他地方纠正问题了。`loop`（循环）是一种编程结构，其中可以根据需要重复执行相同的命令。MATLAB\
  \ 提供了 `for .. end` 语句来执行循环，特别是当你知道循环应该发生多少次时（例如，“执行此操作 10 次”）。一组类似的指令 `while ..\
  \ end` 语句只要满足给定条件，就会持续循环（重复命令块）。搜索就说明了这一点；在我们还没有找到（我们正在寻找的内容）之前，继续遍历数据。\n\n程序程序执行的任务有时会失败。一个显著的例子是处理文件。如果某人指定了文件名，而程序尝试读取该文件，如果文件不存在，程序可能会崩溃。出于这个原因，`try\
  \ .. catch .. end` 语句允许程序优雅地处理此类操作，并在发生错误时恢复。计算机执行 `try` 之后块中的命令，并在遇到错误时跳转到 `catch`\
  \ 块。如果一切运行正常，它将跳过 `catch` 块。\n\nMATLAB 还提供了许多实用的函数，例如 `length`，它返回数组中的元素数量。此外，你也可以创建自己的函数。这允许抽象，抽象有助于人们理解和维护程序。例如，假设你想对数字列表进行排序。MATLAB\
  \ 包含一个名为 `sort` 的函数，它默认按升序对数组排序。它使用的是冒泡排序、插入排序、合并排序还是其他算法吗？只要它运行良好，你在意乎吗？顺便说一下，如果你熟悉冒泡排序，你可能很在乎，因为它是特别低效。函数允许抽象——我们知道它做什么，但我们并不确切知道它是怎么做的，除非问题迫使我们去研究。\n\
  \n### 1.7 快捷键\n\n你可以使用向上方向键来回溯之前的命令。此外，如果你输入命令的一部分，然后按向上方向键，它将回溯以你输入的内容开头的最后一个命令。例如，假设你输入了一个\
  \ `length` 命令，稍后输入 `le` 并按向上方向键。MATLAB 应该显示 `length` 命令。如果有多个以 `le` 开头的命令，它们会在按下向上方向键时按反序回溯。向下方向键回溯下一个输入的命令，实际上允许你在两个方向上循环遍历早之前的命令。\n\
  \n当命令在输入行上时，你可以使用左方向键和右方向键分别将光标向左或右移动。例如，假设你输入 `lenght(myarray);` 然后按 `RETURN` 键。此命令将不起作用，因为\
  \ `length` 拼错了。要修复它，输入向上方向键，然后反复按左方向键，直到光标位于 `t` 上。然后按两次 `DELETE` 键，然后输入 `t` 和 `h`\
  \ 键。这时你可以按 `RETURN`（无需将光标移动到行尾）。如果你喜欢，可以使用鼠标移动光标。\n\n当找不到函数时，最新版本的 MATLAB 会建议一个命令。在以下代码中，我们定义\
  \ `gas` 数组有两个值，就像之前的示例。\n\n```matlab\n>> gas(1) = 23.64;\n>> gas(2) = 35.78;\n>>\
  \ lenght(gas)\nUndefined function 'lenght' for input arguments of 'double'.\n\n\
  Did you mean:\n>> length(gas)\nans =\n2\n```\n\n输入 `lenght(gas)` 导致解释器说没有名为 `lenght`\
  \ 的函数，并会在提示符处放置 `length(gas)`，就像用户输入的一样。在这种情况下，输入错误函数后，用户只需按 `RETURN` 接受修正后的行。\n\
  \n`TAB` 允许完成，就像在操作系统的命令提示符一样，例如 Apple Macintosh 上“实用”下的 `Terminal` 程序。Linux 操作系统也提供了\
  \ `Terminal` 程序。在 Microsoft Windows 下，命令行实用程序具有类似的快捷键，取决于其配置。\n\n### 1.8 编写易读的程序\n\
  \n大多数人认为程序员花费时间在写代码。这在某种程度上是正确的，但大量时间将花在维护代码以及其他涉及交流的任务上。公司会有一组能够完成他们所需的程序。但如果发现了漏洞，或者需要新功能，就有人必须更改代码来修复它或添加新代码。人员会来往往去，所以维护代码的人往往不是编写它的人。因此，一个优秀的程序员会编写他人容易阅读、理解和维护的代码。一些惯例有助于这一点。程序的可读性有助于良好的维护。\n\
  \n\n\n\n首先，你必须对代码进行记录。使用百分号（`%`）来添加注释。该字符之后行中的任何内容都会被计算机忽略。始终确保在开头包含相关的细节：你是谁、日期是什么时候、你计划做什么（特别是当你对旧代码进行修改时）。你的注释应该解释程序的功能，既包括在程序开头（通过\
  \ `help` 命令显示的结果），也包括在程序正文中。你可能会想这些注释是写给谁看的，答案因人而异。你是否曾经写过一个很久以前的程序，以至于你忘记了那是你写的？你会这样的！首先首要任务是在你的代码中处处添加注释，留给未来的自己看。你可能会尝试一种一种方法，发现它效果并不好，然后将其改为更好的方法。如果你不记录你所做的工作，某一天你重新看到这个程序时，可能会想：“我为什么要那样写？我要把它改了……”\
  \ 从而重新引入你已经解决过的问题。使用注释向你自己和其他解释你正在做什么。记录代码还有助于巩固你的思路。\n\n务必在适当的地方给予他人荣誉，正如例句所示。\n\
  \n```matlab\n% The next 4 lines are from Sally Smith.\n```\n\n如果你包含了来自互联网的代码，请确保尽可能提供详细信息（谁写的、哪家公司、哪本书介绍的、你何时获取的、URL\
  \ 等）。务必说明借用代码从哪里开始，到哪里结束，例如：\n\n```matlab\n% Begin: code from King's \"C Programming:\
  \ A Modern Approach\"\n%             2nd ed, 2006, page 300\n```\n\n随后在后面附上像这样的一条注释。\n\
  \n\n\n```matlab\n% End: code from page 300 of King's book.\n```\n\n显然，仅仅因为你发现了别人的代码，并不意味着你有权使用它。你应该确保自己已经获得了许可（这可能通过你发现代码的位置和方式推断）。你应该确定使用这些代码是合法且符合伦理的，并咨询你的导师或雇主。如果你使用了他人的代码，你仍然负责了解它的作用。\n\
  \n为了澄清这一点，假设你从另一个来源获取了 3 行代码，并将其放在你的代码中间。只有当你完全理解这些行代码的作用，并且在时间允许的情况下你可以自己完成时，才应该包含它们。现在假设你发现了一个函数可以为你完成复杂的任务，例如读取并解码\
  \ `.ogg` 音频文件，并返回一个从 -1 到 1 的双精度值数组。在这种情况下，你不需要了解每一行代码是如何工作的。你的代码调用了别人写的函数，就像他们的代码是\
  \ `MATLAB` 的一部分一样。你理解它的作用什么，而不需要知道它是如何实现的。只要在时间足够的情况下你可以将其逐行拆解，就不必担心不了解细节。\n\n你还可以使用\
  \ `%{` 和 `%}` 来表示多行注释。也就是说，计算机将忽略这两个符号之间的所有内容，如下例所示。\n\n```matlab\n%{\nAll of these\
  \ lines are comments,\nmeant for a human to read,\nso the computer ignores them.\n\
  %}\n```\n\n如果你有一个程序，其中几行想要注释掉，可以在编辑器中选择它们并点击注释按钮，或者你可以简单地在这些行周围使用 `%{` 和 `%}`。\n\
  \n`MATLAB` 对连续的两个百分号 `%%` 具有特殊含义，它们定义了一个直到下一对百分号为止的代码单元。你可以通过编辑器窗口上的“评估单元格”（evaluate\
  \ cell）按钮运行该区域的代码。在编写代码并定期测试以达到完美状态时，此功能允许你专注于程序的子集。\n\n紧凑性是好事，但走向极端是不好的。不可理解以便代码是不可维护的。记住，别人可能需要理解并维护你的代码，如果时间过得足够，苦于理解你代码的人可能你自己。使用括号来使意义清晰。使用\
  \ `whitespace`（如空格和空行）提供结构。一个常见的约定是对同一块中的代码进行缩进。计算机并不关心；无论有没有空格，它都能理解代码。但这让代码更易读。请保持这种一一致性！如果你在块中的每行左侧包含四个空格，那么你以后就不应该使用三个空格。`MATLAB`\
  \ 的内置编辑器会提供帮助，它会自动对你的代码进行缩进。然而，即使没有编辑器，你也应该养成为了清晰而缩进代码的习惯。你可以使用任何你喜欢的编辑器，不过内置编辑器提供了其他编辑器不具备的功能，例如注释选定的行或对命令进行颜色标记。\n\
  \n给变量（以及程序）赋予合理的名称。如果你存储某人的薪率，像 `rateOfPay`、`rate0pay`、`payRate` 或 `pay_rate` 这样的名称都能传达意图。应该避免像\
  \ `p`、`PR` 和 `thing` 这样的名称。如果合理且局部化良好，请使用像 `i` 或 `n` 这样的单字母变量。例如，`payRate(i)` 是可以接受的。所谓“局部化良好”，是指一个单字母变量不应该在赋值一次值后，在数百行之后才被使用。\n\
  \n考虑为任何常量值使用变量，因为你以后可能想要更改它。某些常量，如 `pi`（π），永远不会改变。然而，通常程序会根据当时合理的选择而具有常量值，例如预期要处理\
  \ 100 张图像并显示 100 秒。可能会诱惑你在需要的地方直接使用数值 100，但如果你以后想处理 150 张图像并显示 80 秒，该如何更改呢？更好的解决方案是为这些值赋值，如下：\n\
  \n```matlab\nnumberOfImages = 100;\nsecondsToShow = 80;\n```\n\n将这些行放在程序开头，更改它们变得简单。\n\
  \n使用注释记录你的假设。例如，假设我们向用户询问年龄。我们的程序应该拒绝任何小于 18 的年龄吗？应该拒绝任何大于 100 的年龄吗？如果不使用这些最小或最大年龄，应该拒绝任何年龄吗？零可以吗？我们可以使用字节值存储年龄，即\
  \ 0 到 255 之间？负数可以接受吗？分数（如 4.5）可以吗，还是数字应该是整数？复数、字符或字符串呢？数值矩阵合理吗（例如在年龄作为参数传递的函数中）？我们应该在代码注释中具体说明我们的预期。向用户明确这一点也是一个好主意。\n\
  \n与其他编程语言一样，`MATLAB` 包含了特殊用途的关键字。例如，`for` 词只能作为 `for` 循环的一部分。像 `for = 4` 这样的命令会导致错误。关键字包含了你预期的编程结构，例如\
  \ `while`、`switch`、`end`、`try`、`if` 等。这些词已有特定的含义，因此不能重新定义。\n\n我们把嵌入式称为针对特定产品的硬件和软件开发的广泛领域。它们在意义上是计算机，因为它们拥有处理器、程序、内存、输入和输出，但这些部分嵌入产品中的程度以至于我们并不认为它们是计算机。例如，可穿戴健身追踪设备、微波炉和手机都是嵌入式系统。许多此类系统使用\
  \ `MATLAB` 和 `Simulink` 进行设计和原型制作，尽管 `MATLAB` 通常不是控制它们的编程语言。本文经常使用嵌入式系统一词，通常是为了与更传统的计算机进行对比。\n\
  \n\n\n无论你使用何种命名规范，请在整个过程中保持一致。在嵌入式系统中，某些程序员使用小写字母来指示变量类型，例如用 `iCounter` 表示一个整数数据类型的计数器。另一些程序员则用全大写字母表示`constants`（常量不发生改变的值），例如\
  \ `π`。或者，如果是函数名，则首字母大写，作为变量时则小写。你甚至会发现不同的公司有不同的风格。无论你使用哪种风格，请与其保持一致。\n\n除了处理错误的情况外，你的代码应该只有一个入口和一个出口。这已经不再像在“`goto`”语句时代那样是一个问题了，在那个时代，`goto`语句会导致流程图（程序执行顺序的图形化描述）看起来像一盘散乱的意大利面。今天，这意味着你应该避免使用\
  \ `break` 语句在循环中间结束循环，除非你有充分的理由这样做。\n\n使用封装。如果一页代码执行某个特定任务，你应该考虑将其移动到独立的单独文件中。你也可以对其进行标准化，以便将来再次使用。虽然\
  \ `MATLAB` 允许全局变量（这意味着任何函数都可以查看和修改它们），但尽可能多使用局部变量。默认情况下，你创建的变量将是局部变量。\n\n打印代码时，请使用等宽字体（`Courier`\
  \ 是一个很好的选择）。这使得打印出来的内容更易读，空白部分也更明显。对比下面两行：\n\n这个句子不是等宽字体。\n\n这个句子是等宽字体。\n\n第二行使用了等宽字体，它类似于你在\
  \ `MATLAB` 命令行窗口和编辑器中看到的内容。\n\n对你的代码要保持专业性。通过注释让事情变得显式化，不要像发短信那样使用缩写。完成后要清理你的代码。在让代码运行正常的过程中，你可以对代码块进行注释和取消注释。当程序“完成”时，你应该删掉那些不再需要的被注释掉的代码。尽量不要拼错单词，并注意其他语法错误。是的，计算机并不在乎这些。然而，如果你交流良好，看到你工作的其他程序员或经理可能会对你的严谨和对细节的关注留有深刻印象。\n\
  \n在编写代码时，尽量让它具有 `robust`（健壮性），这指的是程序在输入糟糕或条件劣的情况下仍能工作的质量。可能，它应该在不产生错误的情况下运行。有时，可能会出现程序无法处理的问题，例如重要数据文件不存在。在这种情况下，它应该传递错误信息。然而，如果用户给程序提供了糟糕的数据（例如超出预期范围的值），程序应该优雅地处理它。它可以显示一条关于数据超出范围的消息，并返回到提示符。\n\
  \n代码的另一个良好品质是让其具有 `modular`（模块化），即它是自包含的。它应该包含运行所需的一切内容，尽管它可能会指定任何所需的参数。像积木一样，一个编写良好的程序或函数可以作为大设计中的一小部分被包含。通过模块化，每个部分都可以进行测试，以确保其按预期工作。\n\
  \n记住，我们可以将一个命令分成多行。当某一行变得很长时，使用省略号（三个点）来指定它在下一行继续。这允许我们提高代码的可可读性。\n\n```matlab\n\
  >> disp(sprintf('Using 10 places, pi has value %2.8f,\\n%s', ...\npi, 'counting\
  \ the decimal point.'));\nUsing 10 places, pi has value 3.14159265,\ncounting the\
  \ decimal point.\n```\n我们看到，该命令的解释方式与我们全部写在一行里是一样的。\n\n在 `disp` 语句内部嵌入 `sprintf`\
  \ 会导致一个警告，提示 `fprintf('...')` 可以替换它。前者创建一个字符串然后显示给用户。后者也创建一个字符串，并将其打印到文件中，但该文件默认恰好是命令行窗口。`MATLAB`\
  \ 的编辑器提供了关于此的信息。编辑器会给带有 `disp(sprintf('...'))` 的行加上橙色下划线，并在编辑器窗口右侧出现一个橙色条。如果你将光标悬停在行或橙色条上，它会解释与\
  \ `fprintf('...')` 相比，`disp(sprintf('...'))` 会消耗额外的内存资源和时间。然而，本文中的示例使用了 `disp(sprintf('...'))`，因为它的含义更清晰。\n\
  \n## 1.9 调试技巧\n\n弄清楚程序的一种好方法是亲自模拟计算机。深吸一口气，尝试清空头脑。从第一行开始，逐行检查程序，按照计算机执行的方式执行每一行。忽略注释。记住，计算机不理解注释，而且注释中写的很可能是你希望命令执行的操作，而不是它们实际执行的操作。对于每个\
  \ `variable`，在纸上写下它的值，如果有之前的值，则划掉它。模拟计算机的操作，将变量替换为它们的值。像计算机一样思考。\n\n从第一个错误开始向后调试，而不是从最后一个错误开始。当计算机遇到问题时，它会生成一条错误信息。根据严重程度，它可能不会在该处停止，而是继续处理代码。这可能会触发“级联错误”，即一个错误导致另一个错误，只是后者的错误描述可能会误导你。在某些计算机语言中，一个较小的错误可能会引发满屏的错误信息。有时，当程序员修复了第一个错误时，剩下的错误就消失了。\n\
  \n如果你不确定程序在何失败，使用 `display` 语句来显示进度。你可能需要在 `display` 语句之后添加 `pause(0.5)` 命令，给计算机时间更新屏幕。\n\
  \n你还可以设置断点，并使用 `MATLAB` 内置的调试程序。第 11 章《获取帮助与调试》对此进行了详细介绍。\n\n## 1.10 常用 UNIX 命令\n\
  \n科学家使用各种不同的计算机。你可能会惊讶地发现，2017 年 11 月宣布，世界上前 500 台超级计算机都运行 `Linux` [3, 4]。`Linux`\
  \ 是一种流行的免费开源操作系统 (OS)，它是作为针对 IBM 个人电脑 (PC) 和 PC 兼容系统的 Unix 版本开发的。\n\n过去的几里，Unix\
  \ 系统主导了高性能计算市场。实验室和企业通常拥有强大昂贵的计算机来处理工作，称为服务器。人们使用较弱（且便宜得多）的计算机连接到这些机器，称为 `client`。某些客户端仅仅是键盘和显示器。你可能已经熟悉这些术语；当你用笔记本电脑或手机查看网页时，你的\
  \ `client` 设备会连接远程 `server` 获取内容。从这个意义上说，你已经依赖于运行 `Unix` 和 `Linux` 的计算机。\n\n\n\n\
  \n\n`terminal`（终端）是指一种允许用户通过发布文本命令与操作系统进行交互的程序。Microsoft Windows^® 的对应物是命令窗口，尽管它识别的命令略有不同。大多数用户并不使用终端窗口，因为他们可以通过图形用户界面\
  \ (GUI) 来完成所需的操作。启动程序、编辑文件、重命名文件、移动文件和删除文件都可以通过 GUI 完成，但也可以通过 `terminal` 完成。当我们与终端窗口进行交互时（例如在教室环境中），我们使用的是\
  \ Unix/Linux 命令。你不需要对 Unix 有深入的了解，但下述命令列表中包含了一些你应该知道的命令。有趣的是，Apple 基于 Unix 变体开发了\
  \ OS X。因此，这些命令在许多不同的设备上都是通用的，从运行 Linux 的超级计算机，到运行 Unix 的高性能服务器，再到运行 OS X^(3) 的 Macintosh，或者运行\
  \ Linux 的 PC，甚至低到像树莓派（Raspberry Pi）这样的小设备。\n\nUnix 工作站很早就就提供了图形用户界面，拥有 20 世纪 80\
  \ 年代的 `X Window System` 等窗口标准。然而，如果你的电脑运行 Unix/Linux，或者如果你的数据来自此类机器，你可能还需要知道如何从终端窗口操作。以下是一些常用命令。\n\
  \n- `cat file`\n这是 `concatenate file(s)`（连接文件）的缩写，你可以指定多个文件。它会将所有 `file(s)` 的内容连续打印到屏幕上，而不会暂停。该命令也可用于创建文件。MATLAB\
  \ 的等价是 `type file`。\n\n- `cd`\n切换目录（目录）。单独使用时，它将切换到你的主目录。MATLAB 的等价是 `cd ~`。例如，`cd\
  \ /home/mweeks` 表示将目录更改为 `/home/mweeks`，这是用户“mweeks”的主目录。MATLAB 的等价是 `cd /home/mweeks`。主目录因系统而异，你的系统可能使用不同的名称。例如，在\
  \ Macintosh 上，命令可能是 `cd /Users/mweeks`。连续两个点表示父目录，因此 `cd ..` 将目录更改到上一级。例如，从 `/home/myaccount`\
  \ 目录，这将将其更改到 `/home` 目录。`cd ..` 命令在 MATLAB 中同样有效。\n\n- `chmod`\n更改模式（权限）。你可能不需要它。它允许你设置文件的权限，例如，`chmod\
  \ 644 myfile` 为 `myfile` 的所有者设置读取和写入权限，为组组的每个人设置读取权限，并为计算机上的任何其他人员设置读取权限。要了解它是如何工作的，请考虑每个数字代表一个八进制数（即\
  \ 0 到 7 的整数），对应读、写、执行位，而数字的位置意味着它适用于所有者、组或其他世界用户。八进制数 `6` 的二进制模式为 `110`，因此所有者可以读取或写入文件，但不能执行它。接下来，八进制数\
  \ `4` 的二进制模式为 `100`，因此组组成员可以读取文件。之后，其他世界用户（该计算机上的任何人）也可以读取它。八进制（也称为 8 进制）在此之外没有太大的用途。这些文件属性允许你控制计算机上的谁可以访问你的文件。MATLAB\
  \ 的等价是 `fileattrib`。\n\n- `date`\n给出包含今天日期的时间戳。MATLAB 有一个 `date` 命令，尽管它不返回时间。要获取日期和时间，MATLAB\
  \ 的 `clock` 命令将它们作为一个六个值的数组返回。下面的示例显示了 MATLAB 会话中 `date` 和 `clock` 之间的区别。\n\n```\n\
  >> date\nans =\n11-Dec-2017\n\n>> a = clock; sprintf('%d-%d-%d at %d:%d:%2.0f',\
  \ a)\nans =\n2017-12-11 at 18:22:37\n```\n\n同时，这个示例显示了终端窗口中 `date` 的输出。\n\n```\n\
  cascade:~> date\nMon Dec 11 18:24:18 EST 2017\n```\n如你所见，终端命令在不到两分钟后发布。\n\n- `echo`\n\
  重复返回后面的任何内容。例如，`echo hello` 导致打印文本“hello”。MATLAB 提供了 `disp` 语句用于此目的。\n\n- `ls`\n\
  列出当前目录下的文件。你可以配合文件名使用，或者配合带有通配符的文件名使用，例如 `ls *.m` 以生成所有以 `.m` 结尾的文件。你经常会看到 `ls -l`：以长格式列出当前目录下的文件，这提供了额外信息。MATLAB\
  \ 也识别 `ls` 和 `ls -l`。\n\n- `man command`\n显示命令的手册条目。它提供的信息类似于 MATLAB 中的帮助功能信息。\n\
  \n- `matlab`\n启动 MATLAB 程序，假设它已经安装。当然，它也可以通过点击图标来调用。\n\n- `mkdir newdirectory`\n\
  创建一个新目录。MATLAB 也可以用 `mkdir` 创建新目录。\n\n- `more file`\n将 `file` 的内容显示在屏幕上，一次一屏，并带有一个提示显示后面还有“更多”内容。有趣的是，许多系统包含了它的一个改进版本，称为\
  \ `less`。MATLAB 的等价是 `more` 后紧跟 `type file`。\n\n- `path`\n“path”（路径）更多地是一个概念而不是命令，尽管环境变量\
  \ `$PATH` 包含了重要信息。在查找文件时，计算机会搜索路径，并报告找到的第一个匹配名称的文件。如果找不到该文件，这可能意味着它没有查看正确的位置。`echo\
  \ $PATH` 命令揭示了计算机在何处查找匹配项以及以什么顺序进行搜索。在 MATLAB 中，`path` 命令返回在确定某个内容是“未定义的函数或变量”之前搜索的目录列表。\n\
  \n- `pwd`\n打印工作目录。它显示你当前在目录树中的位置。MATLAB 也支持 `pwd`。\n\n- `sftp account@computer`\n\
  这运行安全文件传输协议，允许你登录到远程计算机并从那里获取文件，或向其放置文件。没有 MATLAB 的等价物。\n\n- `ssh -Y -l account\
  \ computer`\n这运行安全外壳，允许你登录到远程计算机并像在它面前一样运行命令。`-l` 表示在远程计算机上使用的账户。当然，它会提示你输入该账户的密码。`-Y`\
  \ 参数指定 X 转发。\n\n- `vi filename`\n调用视觉编辑器。这很有用，因为大多数运行 Unix/Linux 的计算机都支持它。通过 `ssh`\
  \ 和 `vi`，你可以在远程计算机上编辑文件。与此最的 MATLAB 命令是 `edit`。\n\n\n\n\n拥有 MathWorks 账户，你可以下载 MATLAB\
  \ Mobile^® 应用并从手机或其他移动设备访问计算环境。当你想要使用时，必须可以使用互联网连接，因为你的移动设备并不执行计算。相反，它与另一台计算机通信以执行命令。图\
  \ 1.2 和 1.3 显示了应用程序正在连接，然后执行了几个示例命令。注意键盘顶部包含一些方便的键，例如向上箭头、向下箭头、括号和单引号。使用向上箭头导航到之前的命令。\n\
  \n![Image](img/figure1_2.jpg)\n\n**图 1.2** MATLAB Mobile 必须连接互联网才能工作。\n\n![Image](img/figure1_3.jpg)\n\
  \n**图 1.3** MATLAB Mobile 可以计算结果并显示图形，就像在笔记本电脑/台式电脑上一样。\n\n移动环境使用“MATLAB Drive”，它可以无缝地将存储在计算机上的文件与其他计算机（包括移动设备）链接起来。设置完成后，你可以指定程序和其他文件通过它可用。图\
  \ 1.4 显示了一个名为 `matches_example.m` 的程序的运行，该程序比较两个字符串。在手机上，用户输入了 `matches_example`，这是\
  \ MATLAB Drive 上可用程序名称。计算机运行该程序，并将结果返回给手机。有趣的是，这个特定示例调用了函数 `matches`，这是 2019 年发布的命令。如果没有互联网连接，手机对\
  \ MATLAB 无法做什么。而托管程序的计算机版本为 `R2016b`，这意味着当用户运行该程序时，它会报“未定义函数”错误。这看起来可能很模糊：是哪台计算机运行了程序？MATLAB\
  \ Drive 文件存储在哪里？远程服务器负责这些细节。这就是基于“云”的计算。\n\n将一个计算机上的文件复制到特定的子目录，可以让这些文件在其他设备上可用。例如，在台式电脑上，将文件\
  \ `mymagic5.mat` 复制到 `MATLAB-Drive` 目录下的 `Published` 文件夹，允许它与 MathWorks 云同步，然后它在手机上可见，如图\
  \ 1.5 所示。\n\n![Image](img/figure1_4.jpg)\n\n**图 1.4** 通过设备间链接的文件（例如此 `matches_example.m`），我们可以在手机上运行\
  \ MATLAB 程序。\n\n![Image](img/figure1_5.jpg)\n\n**图 1.5** 文件 `mymagic5.mat` 在复制到\
  \ `MATLAB-Drive` 目录后在手机上变得可用。\n\n### 1.12 总结\n\n本章介绍了 MATLAB 计算机编程的环境、术语和概念。后续章节将反复使用这些术语，它们在在使用过程中会变得清晰。下一章将对以下概念进行详细说明并包含示例。\n\
  \n- `算法`（algorithm）通俗地说，是一个解决问题或实现目标的过程或一组步骤。\n- `伪代码`（Pseudo-code）像英语一样，分解为计算机可以执行的小步骤。\n\
  - `程序`（program）或`代码`（code）是用于计算机的指令集合。我们也将其称为`脚本`（script）。\n- `函数`（function）是程序的特殊情况，可以接受参数并返回值。\n\
  - 程序中包含`注释`（Comments）供人们理解代码。计算机会忽略它们。\n- `语法`（Syntax）意味着命令如何指定，就像语法和标点符号影响人类语言一样。计算机会迅速指出`语法错误`（syntax\
  \ error），即它不理解该命令的地方。\n- `逻辑`（Logic）意味着命令如何组合。当代码对计算机来说有意义但没有解决问题时，就会发生`逻辑错误`（logic\
  \ error）。类比，考虑缺少重要步骤的驾驶指令，例如“向前一个街区，然后右转”。这些指令可能以我们理解的方式表达，但并没有带我们到达目标。\n- 赋值语句与方程的区别\n\
  - 条件\n- 循环\n- 命令窗口、命令行界面 (CLI)\n- 通过 `edit` 命令调用的 MATLAB 编辑器\n- 解释与编译\n- 变量\n- 无需声明\n\
  - 浮点、整数、字符、字符串、布尔值\n- 标、数组、矩阵\n- 快捷键\n- 关键字\n- 基础 MATLAB 命令\n- 赋值\n- `if .. else/elseif\
  \ .. end`\n- `for .. end`\n- `while .. end`\n- `switch .. case .. end`\n- `try ..\
  \ catch .. end`\n- `length`\n\n### 练习\n\n1. 让计算机打印“hello”加上你的名字。\n2. 下行代码存在什么问题？\n\
  ```mat\nend = 2;\n```\n3. 下行代码存在什么问题？\n```mat\ndisp('Hello);\n```\n4. 下行代码存在什么问题？\n\
  ```mat\nDISP('One small step for man');\n```\n5. 下行代码存在什么问题？\n```mat\nintrest =\
  \ 5; sprintf('Rate is %d per year', interest);\n```\n6. 下行代码存在什么问题？\n```mat\nsprintf('value\
  \ = %d ,' 5)\n```\n7. 你如何从一个长值列表中给出一个唯一的数字列表？如果你能口述要执行的所有小步骤，形成一个算法并不复杂。就像在没有计算机的情况下你会做那样，寻找唯一的数字（测试题）。\n\
  8. 从字符串中删除非数字字符，例如让 `mymagic5.mat` 在其他设备上可用。\n\n\n\n描述一个幅度为 `1` 的正弦波。值 `π` 在 MATLAB\
  \ 中被预先定义为 `pi`。相位应该是 `−π/2` 和 `π/2` 之间的某个值，包括零。你可以使用以下定义 `t`，它代表时间。\n\n```matlab\n\
  t = 0:0.0001:0.03;\n```\n\n绘制几个频率为 100 且相位值不同的正弦波。\n\n21. 要开发一个算法，想象你正在通过电话给某人下指令。那个人可以看到输入值，并有一块大白板用于记录和擦除数值。你提供的指令必须简单，例如“复制第一个值并写在字母\
  \ A 旁边”。那个人可以执行任何算术或逻辑函数，如乘法、减法、比较、`AND` 等。可以包含条件语句（例如“如果值 1 小于值 2 则……”）以及循环。思考你会如何描述这些指令以便他们得到正确答案。你会如何告诉那个人将一组数字列表（例如\
  \ `3, 7, 1, 4, 2`）从大到小排序？\n\n## 项目\n\n### 文档与帮助\n程序中的第一部分应该是文档，例如下所示。这应该出现在程序的最顶部。\n\
  \n```matlab\n% (program_name).m\n%\n% Author: (你的名字)\n%\n% Date: (填写开始截止的日期)\n%\n\
  % Revision Date: (以后进行更改时在此处填写日期)\n%\n% Description:\n% (简要描述你的程序的功能。)\n%\n% Input:\n\
  % (说明程序的输入是什么。)\n%\n% Output:\n% (说明程序的输出是什么。)\n%\n% Usage:\n% (给出一个如何使用你程序的示例。)\n\
  % (例如：out = myabs(in); )\n```\n\n创建一个具有适当名称的文件，并输入上述注释。验证 `help` 命令加上程序名是否显示这些信息。\n\
  \n### 获取并检查用户输入\n你的程序将提示用户输入几条信息，然后将这些信息打印回命令行窗口。\n\n你的程序应该输入用户的姓名、年龄以及今天加仑油的价格。确保提示用户输入信息，例如“请输入你的年龄：”。\n\
  \n一旦用户输入了这些信息，在屏幕上打印以下内容：`Welcome age year old user name`。还要打印油价以及油价的平方。包含文字说明你正在打印的内容。如果油价的平方大于该人的年龄，打印“恭喜获得驾照”。否则，打印“我打赌你还记得油价一加仑一美元的时候”。一个小提示：要打印单引号字符，你需要连续使用两个，如下所示。\n\
  \n```matlab\ndisp('driver''s license');\n```\n\n你的程序应该适用于所有可能的输入。确保你已经用几种不同的情况对其进行了测试。例如，如果给出的年龄是浮点数（如\
  \ `21.4`）怎样？用户输入 `0`、`−10` 或 `1000` 怎样？你可以假设用户会在年龄和价格提示处输入数字。\n\n***\n\n- 尝试输入 `x\
  \ = 5` 和 `y = 5`；查看区别。\n- 有些键盘标记为 `ENTER` 的键。这些键是等价的。\n- 在 2000 年代的某时期，本书作者经常在 Sun\
  \ SPARC 服务器上使用 Solaris Unix，在 Macintosh 上使用 BSD Unix，在 PC 上使用 RedHat Linux，以及在惠惠公司的一种名为\
  \ `iPAQ PocketPC` 的手持设备上使用 Familiar Linux。虽然 Linux/Unix 发行版之间存在差异，但大多数日常交互不需要感知操作系统。换句话说，从一个设备的终端切换到另一个设备是无缝的。\n\
  \n# 第 2 章\n## MATLAB 编程基础\n本章旨在让你开始在 MATLAB 中编写自己的代码。首先，我们涵盖范围、字符串和格式化。然后我们转向编程结构。在本章结束时，你应该能够在\
  \ MATLAB 中为一个小的编程问题创建一个解决方案。\n\n### 2.1 范围\n通常，我们想要生成一个值序列，例如 1 到 5 之间的整数。MATLAB\
  \ 提供了一种实现此点的简单方法，称为 `range`。在这里，我们将变量 `r` 设置为这些值。\n\n```matlab\n>> r = 1:5\nr =\n\
  \     1     2     3     4     5\n```\n\n冒号 (`:`) 分隔了起始值和结束值。默认情况下，数字递增 1。如果我们希望按另一个值计数，则指定起始值、冒号、增量值、冒号和结束值。下一个示例创建了一个\
  \ 5 到 13 之间的范围，仅包含奇值。\n\n```matlab\n>> 5:2:13\nans =\n     5     7     9    11 \
  \   13\n```\n\n值不需要是整数，正如下一个示例所示。\n\n```matlab\n>> 5.1:2.1:13.1\nans =\n   5.1000\
  \   7.2000   9.3000   11.4000\n```\n\n注意，值每次递增 `2.1`，且范围不包含 `13.1`。这是因为 `11.4 +\
  \ 2.1 = 13.5`，它超出了指定的范围。\n\n正如你所预期的那样，范围也适用于内部存储为整数的值。之前的示例中有些使用了整型值，但它们具有默认的 `double`\
  \ 类型。下一个示例创建了一个从 3 到 7 的范围，其中值具有 `uint8` 类型，这意味着 8 位无符号整数。\n\n```matlab\n>> a =\
  \ uint8(3);\n>> b = uint8(7);\n>> c = a:b\nc =\n     3     4     5     6\n```\n\n\
  \n\n字符串由单引号界定，这意味着我们用单引号来指定字符串的开始和结束。MATLAB 的最新更改也允许使用双引号。\n\n注意以下字符串中的两个单引号。\n\n\
  ```matlab\ndisp('Don''t forget...');\n```\n\n通常情况下，我们使用一个单引号开始字符串，用另一个单引号结束，但在这里我们连续使用两个单引号来表示一种特殊情况，即我们希望单引号本身作为字符串的一部分。\n\
  \n`sprintf` 命令创建一个字符串，允许程序员对输出进行格式化。它与 C 语言中用于格式化输出的 `printf` 函数有许多相似之处。无论在哪种语言中，格式化字符串都包含一个百分号（%%），后面跟着零或多个选项，并以一个类型说明符结束。你可能会奇怪，为什么\
  \ MATLAB 在格式化输出时使用百分号，而在注释中使用它。C 语言在 20 世纪 70 年代已经成熟，事实上，MATLAB 的早期版本是在 1984 年 MathWorks\
  \ 成立不久前用 C 语言编写的 [5]。\n\n格式化字符串可以简单如 `%d`（表示整数）。例如，我们可以像这样创建一个包含数字的字符串：\n\n```matlab\n\
  n = 3;\nstr = sprintf('The value is %d for n.', n);\ndisp(str);\n```\n\n计算机将输出“The\
  \ value is 3 for n.”。我们可以将 `%d` 放在字符串的任何位置，`sprintf` 命令将其替换为参数列表中的第一个数字。\n\n我们使用\
  \ `%f` 表示浮点值，使用 `%c` 表示字符，使用 `%s` 表示字符串。表 2.1 显示了一些可能的类型说明符及其示例。这些示例在打印的项目前后使用了连字符号，用以显示格式化时何时留白填充。在下一个示例中，我们创建了一个嵌入了另一个字符串、一个浮点值和一个字符的字符串。\n\
  \n```matlab\nc = '!';\ns = 'float value';\nf = 12.345;\nstr = sprintf('The %s is\
  \ %f for f%c', ...\n    s, f, c);\ndisp(str);\n```\n\n计算机返回的内容如下：\n\nThe float value\
  \ is 12.345000 for f!\n\n`sprintf` 命令接受任意数量的参数，尽管第一个参数应该是指定文本和格式的字符串。随后的参数应该与字符串中的类型说明符对应。换句话说，混乱变量\
  \ `s`、`f` 和 `c` 的顺序将产生奇怪的结果。在接下来的几行中，我们使用浮点值 `f` 配合整数值 `n`。在内部，计算机将 `n` 存储为双精度（double）值，尽管在这个例子中它没有小数部分，但我们将其显示为整数。\n\
  \n```matlab\n>> sprintf('%d and %f', n, f)\nans =\n3 and 12.345000\n\n>> sprintf('%d\
  \ and %f', f, n)\nans =\n1.234500e+01 and 3.000000\n```\n\n在第一种情况下，我们将一个具有整数值的变量作为第一个参数，并将浮点值作为第二个参数。第二种情况反转了两个参数，导致浮点数出现在预期整数的位置，而整数出现在预期浮点数的位置。\n\
  \n早些，我们看到字符串中应该包含两个单引号，以便在 `disp` 的输出中显示一个。同样，如果我们想在字符串中显示百分号，我们需要连续使用两个百分号。反斜杠也必须双倍才能显示，如下一个示例所示。\n\
  \n```matlab\n>> sprintf('Percents %% and backslashes \\\\ and '' quotes.')\nans\
  \ =\nPercents % and backslashes \\ and ' quotes.\n```\n\n实际上，`disp` 命令可以处理单个百分号或单个反斜杠。`sprintf`\
  \ 将这些字符作为*转义*字符，即指示其后字符具有特殊含义的特殊字符。下一个命令说明了这一点。\n\n**表 2.1** `sprintf` 命令的常用类型说明符。\n\
  \n![Image](img/tab2_1.jpg)\n\n```matlab\n>> sprintf('tab \\t newline \\n characters')\n\
  ans =\ntab    newline\ncharacters\n```\n\n输出显示制表符跳过了几个空格，就像打字机上的“tab”键一样。换行符将移动到下一行。由于在换行符之后、单词“characters”之前出现了一个空格，它将该单词向右推了一个空格。\n\
  \n类型说明符还有其他可能性。MATLAB 文档（即 `doc sprintf`）包含了大量细节。顺带一提，它将 `%f` 称为定点；虽然要打印的值存储为浮点数（双精度）值，但我们指定的格式是整数部分的数字，以及用于小数部分的数字。例如，“%5.2f”表示格式化该数字，总位为\
  \ 5 位，其中小数点后占 2 位。让我们重新查看带有整数和浮点值的示例。\n\n```matlab\n>> sprintf('n=%4d and f=%5.2f',\
  \ n, f)\nans =\nn   3 and f=12.35\n```\n\n注意等号和数字 3 之间的空格。这来自于 `%4d` 说明符，我们指定打印一个整数值，而\
  \ 4 表示该数字应该占据四个空间。由于该数字只占用一个位，函数在其左侧进行留白填充。对于值 `f`，说明符 `%5.2f` 表示为数字预留 5 个空间，其中小数点后占两位。因此，我们在小数点前有两个数字，小数点后有两个数字。\n\
  \n如果我们想打印小数点后保留三位数的浮点数呢？下一个示例展示了这一点。\n\n```matlab\n>> sprintf('f=%7.3f', f)\nans\
  \ =\nf= 12.345\n```\n\n我们将数字的总空间数改为 7 位，这解释了为什么等号后面会出现一个空格。如果我们保持 5 位，它仍然可以工作，只是因为\
  \ `sprintf` 函数在数字不符合规格时会覆盖该规范。\n\nMATLAB 将打印数字的整个整数部分，即使它超过了指定的空间。当它占据的空间小于指定的位数时，其他位置将用空格填充。请考虑以下示例。\n\
  \n```matlab\nfor k=-2:4\n    disp(sprintf('%6.2f', pi*(10^k)));\nend\n```\n\n当我们运行此代码时，我们得到如下结果：\n\
  \n```\n     0.03\n     0.31\n    3.14\n   31.42\n  314.16\n31415.93\n```\n\n\n\n\
  \n## 2.3.2 条件语句\n\n### “if” 语句\n\n现在我们有了一个更复杂的例子。假设我们想知道值 `a` 是否为负数。我们将（重新）定义 `a`，然后使用\
  \ `if` 语句来检查它是否小于零。注意，我们不需要在 `if` 语句直接的前的一行定义 `a`，但它应该在此 `if` 语句之前的某个地方被定义。如果条件\
  \ `(a < 0)` 结果为真（即 `a` 的值小于零），那么计算机将执行 `if` 之后的代码块。如果该条件结果为假，则计算机将执行 `else` 之后的代码块。\n\
  \n```matlab\na = -2;\nif (a < 0)\ndisp('negative');\nelse\ndisp('positive');\nend\n\
  ```\n\n当我们运行上面的代码时，计算机显示 negative。再次尝试一次，只需将第一行中的 −2 替换为 2。现在计算机应该显示 positive。\n\
  \n这里有关于 `if` 命令的第二个例子。\n\n```matlab\na = -2;\nif (a < 0)\ndisp('negative');\nend\n\
  ```\n\n这个例子的行为与第一个例子有何不同？区别在于我们这里没有 `else` 块。计算机要么显示 negative，要么什么都不显示。\n\n现在是第三个例子，考虑以下代码。\n\
  \n```matlab\na = -2;\nif (a >= 0)\ndisp('positive');\nelse\ndisp('negative');\n\
  end\n```\n\n这个例子的作用与第一个 `if` 示例相同。主要的区别在于比较；我们不是在检查 `a` 是否小于零，而是检查它是否大于等于零。`if`\
  \ 和 `else` 块也相应地进行了交换。\n\n这里是另一个例子，在这种情况下它会打印“zero”。\n\n```matlab\na = 0;\nif (a\
  \ > 0)\ndisp('positive');\nelse if (a < 0)\n    disp('negative');\nelse\n    disp('zero');\n\
  end\nend\n```\n\n我们在 `else` 块内部使用了一个 `if` 语句，并将它们写在同一行，尽管它们可以出现在不同的行上。以这种方式编写时，它们是两个不同的关键字。该语言还包含一个特殊的\
  \ `elseif` 语句，它的作用相当于 `else` 和 `if` 语句的。通过它，我们可以节省一个 `end` 语句，并避免为这第二个 `if` 额外缩进。\n\
  \n```matlab\na = 0;\nif (a > 0)\ndisp('positive');\nelseif (a < 0)\ndisp('negative');\n\
  else\ndisp('zero');\nend\n```\n\n与之前的例子一样，`if` 语句检查 `a` 的值，并根据情况打印“positive”、“negative”或“zero”。虽然两者实现了相同的目标，但后者的版本看起来更有序。\n\
  \n### “switch” 语句\n\n`if` 语句允许我们根据条件执行不同的代码块。但在某些情况下，我们需要反复评估同一个变量，将行为与特定值进行匹配。对于这种情况，MATLAB\
  \ 提供了 `switch` 语句。然后我们根据哪个 `case` 匹配了变量来指定不同的代码块。\n\n例如，下面的代码演示了如何使用 `switch` 语句作为一种根据输入打印不同响应的方法。`input`\
  \ 函数显示一条消息，并等待用户在键盘上输入内容。一旦用户按下回车键（或回车键，取决于键盘），程序就会继续执行。`input` 的第一个参数指定了要显示的消息，以便用户知道该做什么。第二个参数\
  \ `'s'` 表示我们预期的响应是一个字符串。\n\n```matlab\n% 从用户获取输入。\n% 注意 \"input\" 的第二个参数是 's'，\n\
  % 它指定了一个字符串。否则，input 将\n% 无法处理字符串。\nacronym = input('Enter an acronym: ', 's');\n\
  \n% 现在根据输入打印响应。\nswitch acronym\ncase 'html'\ncase 'HTML'\ndisp('Hyper Text Markup\
  \ Language');\ncase {'MATLAB', 'matlab'}\ndisp('Matrix LABoratory, by MathWorks');\n\
  otherwise\ndisp('I do not know that one.');\nend\n```\n\n如果你熟悉其他编程语言，你可能会注意到这里没有出现\
  \ `break` 关键字。MATLAB 的 `cases` 不是贯穿执行的（fall-through），这意味着它只执行代码到下一个 `case` 关键字为止。还要注意\
  \ `otherwise` 关键字，它允许我们指定一个运行的默认代码块。\n\n下面，我们看到了此代码的几次运行示例。代码根据我们输入的内容做出不同的响应。\n\
  \n```text\n>> demonstrate_switch\nEnter an acronym: html\n>> demonstrate_switch\n\
  Enter an acronym: HTML\nHyper Text Markup Language\n>> demonstrate_switch\nEnter\
  \ an acronym: MATLAB\nMatrix LABoratory, by MathWorks\n\n>> demonstrate_switch\n\
  Enter an acronym: matlab\nMatrix LABoratory, by MathWorks\n\n>> demonstrate_switch\n\
  Enter an acronym: CGI\nI do not know that one.\n```\n\n注意它对 HTML 和 html 的响应是不同的。在\
  \ `case 'html'` 之后除了下一个 case 语句外什么都没有，所以尽管程序将文本与模式匹配，但它从字面上什么都没做，因为在下一个 case 语句之前没有指定任何内容。下方的几行显示了代码块如何被多个\
  \ case 模式共享。\n\n### “if” 语句与 “switch” 语句\n\n`if` 语句允许我们根据条件执行不同的代码块。当我们需要从多个操作中选择一个时，`switch`\
  \ 语句非常方便。但 `if` 语句也实现了相同的目标，你可以根据判断来使用。考虑这个例子。我们提示用户输入，然后根据他们的响应执行几种可能的操作。为了提供一些上下文，假设这是一个扫雷游戏。首先，我们可以用嵌套的\
  \ `if` 语句来实现：\n\n```matlab\nuserSays = input('Enter f, s, or q: ', 's');\nif (userSays\
  \ == 'f')\ndisp(' flag');\nelse if (userSays == 's')\ndisp(' step');\nelse if (userSays\
  \ == 'q')\ndisp(' quit');\nend\nend\n```\n\n缩进可能会误导，因为这些显示语句具有相同的重要性。如果我们增加了更多选项，这些将会进一步缩进。我们可以使用带有\
  \ `elseif` 的语句来重做这个例子。\n\n```matlab\nuserSays = input('Enter f, s, or q: ', 's');\n\
  if (userSays == 'f')\ndisp(' flag');\nelseif (userSays == 's')\ndisp(' step');\n\
  elseif (userSays == 'q')\ndisp(' quit');\nelse\ndisp('not valid');\nend\n```\n\n\
  上面的例子代码看起来更整洁，但我们在重复比较。由于我们每次都使用同一个变量，也可以用 `switch` 语句来表达。\n\n```matlab\nuserSays\
  \ = input('Enter f, s, or q: ', 's');\nswitch userSays\ncase ('f')\ndisp(' flag');\n\
  case ('s')\ndisp(' step');\ncase ('q')\ndisp(' quit');\notherwise\ndisp('not valid');\n\
  end\n```\n\n`switch` 语句提供了一种在多个可能值之间进行选择的好方法。何时使用它何时使用 `if` 语句实际上取决于个人偏好以及有多少种选择。\n\
  \n### 2.3.3 循环\n\n### “for” 语句\n\n接下来是 `for` 语句。它允许按照指定的次数重复命令块。\n\n```matlab\n\
  for k=1:10\ndisp('This is repeated ten times.');\nend\n```\n\n代码首先设置变量 `k` 并赋予其初始值\
  \ 1。计算机显示“This is repeated ten times.”，由于后面有 `end` 关键字，计算机会将注意力回到循环开头。由于 `k` 是循环的索引，计算机将\
  \ `k` 的值加 1。接下来，它将 `k` 的值与 10 进行比较。如果 `k` 超过此值，则计算机将退出循环，并执行 `end` 之后的任何语句。如果 `k`\
  \ 的值小于或等于 10，则代码块将再次执行，重复该过程。\n\n这里是第二个例子。\n\n```matlab\nfor k=1:2:10\ndisp('This\
  \ is repeated five times.');\nend\n```\n\n\n\n\n此示例与上一个示例的主要区别在于第一行出现的 `:2:`。它告诉计算机每当我们通过循环时，将\
  \ `k` 的值增加 2。由于 `k` 的值将变为 1, 3, 5, 7, 9, (11)，该循环将只执行五次。\n\n虽然我们通常看到针对数字范围的 `for`\
  \ 循环，但 MATLAB 实际上允许基于其他范围的循环，例如字符范围，甚至是构成字符串的字符范围。\n\n## “parfor” 语句\n\n对于具有并行处理能力的计算机，存在一种\
  \ `for` 循环的特殊版本。`parfor` 语句并行运行一个 `for` 循环，其中不同的计算节点处理任务的部分内容。如今，计算机不需要是巨大的、专门构建的研究平台就可以利用这一特性了。多核处理器已经进入了我们的台式电脑、笔记本电脑，甚至是手机。\n\
  \n并行处理可以极大地加快任务速度。想象一下你和你另外三位家庭成员一起带着一份长长的购物清单去超市。大家聚在一起，花费的时间可能和一个人单独购物一样。如果你将购物清单分成四份较小的列表，每个人都可以购买其中一份列表中的物品。像这样并行工作，你可能只需要\
  \ 1/4 的时间就能完成。由于某些复杂性，并行处理并不保证这种速度提升。超市的例子之所以有效，是因为它不包含依赖关系（即一个任务取决于另一个任务的结果）。想象一下，在超市里，你的清单上有一行写着“如果我们买了火腿，就买切达奶酪”，而另一个人的清单上写着只有当商店没有萨米肠时才买火腿。要继续进行，你需要你尚未获得的信息。在编程示例中，我们可能会有一行代码计算变量\
  \ `a` 的值，而另一个命令使用 `a` 来寻找 `b`。显然，在知道 `a` 之前，我们无法找到 `b`。我们把这种称为*依赖*。\n\n`parfor`\
  \ 命令并不总是可以替代 `for` 循环。“并行计算工具箱”（Parallel Computing Toolbox）提供了并行处理命令，这意味着你的 MATLAB\
  \ 版本必须包含此工具箱才能使用它们。Mathworks 将 MATLAB 工具箱作为独立的功能出售，因此你的版本可能包含也可能不包含。使用 `ver` 命令查看你拥有什么版本的\
  \ MATLAB 以及它包含了哪些工具箱。此外，`parfor` 对循环索引有限制。它必须是整数，范围值必须递增，且不能跳过序列中的值。接下来的几行演示了 `parfor`\
  \ 命令。注意，此示例仅说明了用法，并不代表一个良好的案例。\n\n```\nparfor k=1:10\np(k) = k² + 3;\nend\n```\n\
  \n当我们在当前的 MATLAB 会话中首次运行此代码时，会收到如下所示的消息。\n\nStarting parallel pool (parpool) using\
  \ the 'local' profile ... connected to 4 workers.\n\n然后它会拆分任务并将其发送给处理器，由它们进行计算，最后合并这些结果。注意，这包含了拆分工作、与其他处理器通信以及合并结果的开销任务。对于像这样的小示例来说，这些开销可能会抵消任何速度提升。\n\
  \n## “while” 循环\n\n我们可以使用 `while` 循环来实现与之前的 `for` 示例相同的功能。\n\n```\nk=1;\nwhile (k\
  \ <= 10)\ndisp('This is repeated five times.');\nk = k + 2;\nend\n```\n\n我们在这里负责给\
  \ `k` 一个初始值，并更新它的值（否则，循环将永远不会！）。`for` 和 `while` 循环的区别在于，`for` 循环重复固定次数；计算机更新计数器直到达到终止值。而使用\
  \ `while` 循环，计算机执行代码块直到满足某个条件。考虑以下示例。\n\n```\nk=1;\nwhile (k < 0)\ndisp('This is\
  \ never displayed.');\nk = k + 2;\nend\n```\n\n在这里，`while` 循环的条件永远为假。因此，`while`\
  \ 之后的代码块永远不会执行。\n\n现在考虑这个示例。\n\n```\nq=0;\nwhile (q == 0)\ndisp('This is displayed\
  \ an unknown number of times.');\nq = input('Enter 0 to continue, or anything else\
  \ to quit ');\nend\n```\n\n第一条语句将变量 `q` 设置为零。`while` 语句将其零进行比较。注意这里使用了两个等号，是为了测试相等性，而不是像在\
  \ `for` 循环中那样赋值。`while` 循环将反复执行，直到用户为 `q` 输入一个非零值。这可能在循环第一次运行时就发生，也可能用户会输入几小时非零值。我们无法提前得知这个循环将执行多少次。\n\
  \n## “for”和“while”循环的示例\n\n下面是一个带有 `for` 循环的示例。\n\n```\nm = 4;\nfor k = m:-1:1\n\
  disp('hello there');\nend\n```\n\n计算机用 `m`（值 4）初始化 `k` 的值，并在每次循环迭代中通过对其加 *−* 来递减，直到达到\
  \ 1。\n\n下面是一个带有 `while` 循环的示例。\n\n```\nm = 4;\nmy_index = 1;\nwhile (my_index <\
  \ m)\ndisp('loop');\nmy_index = my_index + 1;\nend\n```\n\n在这里我们将 `my_index` 设置为\
  \ 1，然后开始循环。我们检查它是否小于 `m`，我们*递增*（给 `my_index` 加 1）直到它大于或等于 `m` 为止。\n\n在两种循环结构之间进行选择时，请考虑效率。例如，在序列中寻找第一个匹配项时，使用\
  \ `while` 循环代替 `for` 循环是有意义的。换句话说，只要未找到项目，就继续迭代循环。\n\n## 改变循环内流的方法\n\n有时我们可能需要循环的工作方式稍不同。例如，我们可能希望跳到下一次迭代。`continue`\
  \ 关键字指示计算机这样做。另一个改变循环流的关键字是 `break`，它会停止循环并继续执行后面的语句。如果循环嵌套在一个或多个循环内部，它会停止最内层的循环。`return`\
  \ 命令提供了第三种可能性，它会停止当前运行的函数或程序。虽然 `continue` 和 `break` 只在循环内有效，但 `return` 也可以在循环之外使用。它为出现问题时提供了一个实用的工具，例如，如果程序尝试读取一个不存在的文件，它可以检查文件、打印错误消息并返回到调用它的程序。\n\
  \n## 无限循环\n\n我们已经看到循环如何帮助我们重复相同的步骤，直到满足结束条件。但如果这个条件永远不发生呢？我们称之为无限循环，因为计算机将永远运行下去。通常，我们希望避免这种情况。（例外是嵌入式系统的操作系统。例如，考虑一个监控整个大楼烟雾探测器、开启门和运动传感器的计算机报警系统。该控制程序在产品寿命内将无限重复。）我们可以在程序中加入一个*看门计时器*，通过倒计时并在到达零时停止循环。设计理念是除非出现问题，否则永远不会到达零。\n\
  \n`CTRL-C` 键序列可以中断正在运行的 MATLAB 程序。我们说的 `CTRL-C` 是指按住键盘上标记为 ctrl 的键，然后按下 c 键。你自己的可能有一个包含无限循环的程序。或者你可能有一个运行时间很长的程序，而你发现在启动之前给了错误的参数。在任何情况下，都需要用\
  \ `CTRL-C` 中断程序。\n\n## 错误处理\n\n### “try” 语句\n\n\n\n\n有时候事情并不会按照计划进行。例如，我们可能想将程序的运行写入硬盘。但如果硬盘满了怎么办？在尝试之前我们对此一无所知，然后我们的程序会以非常粗鲁的方式退出。更好的做法是预见到可能的问题，并让我们的程序优雅地处理它。`try`\
  \ 和 `catch` 关键字允许我们做到这一点。在 `try` 部分中，我们放置可能失败的代码。那么如果这些代码确实失败了，就会执行 `catch` 部分。\n\
  \n通常情况下，在处理文件输入输出的命令时使用 `try..catch` 是一个好主意。在这里，我们将使用一个更简单的测试：调用一个不存在的函数。\n\n```matlab\n\
  % demonstrate the try..catch\n\ntry\n    display('Trying an unknown function.');\n\
  \    f = unknown(3);\n    disp('The unknown function worked!');\ncatch\n    disp('The\
  \ function \"unknown\" must not exist.');\nend\n```\n\n计算机将进入 `try` 部分并执行每条命令。如果出现问题，它将跳过该部分的剩余内容并开始执行\
  \ `catch` 部分。如果计算机在没有问题的情况下到达 `catch` 关键字，它将简单地忽略 `catch` 部分。当我们运行代码时，会得到：\n\nTrying\
  \ an unknown function.\nThe function \"unknown\" must not exist.\n\n如果我们在 `try..catch`\
  \ 块之后有任何代码，程序也将继续运行。这比让程序在错误处突然停止要得多。它允许我们执行任何形式的“清理”工作，并让我们的程序尽可能继续运行。\n\n## 另一个使用“try”、“catch”和“rethrow”的示例\n\
  \n下面我们有一个 `try` 和 `catch` 语句。在 `try` 部分，我们调用了 `myfuncton`，这是一个故意拼错的示例。当 MATLAB 无法找到该函数时，它产生一个异常并将控制权交给\
  \ `catch` 部分。注意，程序员可以选择出现在 `catch` 关键字后面的名称，例如 `functionNotFound`。我们可以调用任何有效的变量名。\n\
  \n```matlab\ntry\n    disp('trying myfuncton');\n    userSays = myfuncton(4);\n\
  \    disp('OK, myfuncton worked.');\ncatch functionNotFound\n    disp('Sorry, could\
  \ not find \"myfuncton\".');\nend\n```\n\n当异常发生时，发生的是我们在 `catch` 部分中指定的内容。此块后的任何代码将像什么都没发生一样继续执行。我们可以“抛出”这个异常，有效地用错误消息停止程序。\n\
  \n```matlab\ntry\n    disp('trying myfuncton');\n    userSays = myfuncton(4);\n\
  \    disp('OK, myfuncton worked.');\ncatch functionNotFound\n    disp('Sorry, could\
  \ not find \"myfuncton\".');\n    rethrow(functionNotFound);\nend\n```\n\n现在当异常发生时，我们向用户显示“sorry”消息，并让系统按照如果没有\
  \ `try` 语句的方式继续。这让我们对计算机如何处理异常有了一定的控制。在放弃之前，我们可以向用户提供额外信息。\n\n## “error”命令\n\n用\
  \ `disp` 命令向用户显示的文本是黑色的。如果我们真的想引起用户的注意呢？使用 `error` 命令代替 `disp` 会显示红色消息，前面带有问号，并且会发出声音。以下代码显示了一个示例：\n\
  \n```matlab\n>> error('You should not do that.');\nYou should not do that.\n```\n\
  \n注意它没有打印 `n` 的值，因为它没有到达那一行。\n\n你也可以使用 `errordlg` 命令（即“错误对话框”）弹出一个带有自定义错误消息的窗口。下面的示例代码执行此操作，并在显示的消息中编码\
  \ `n` 值。如果你运行它，你会看到它弹出了三个窗口，最上面的文本是“Something went wrong, code 3.”，如图图 2.1;\n  \
  \  errordlg(mystr, 'Pop-up window');end\n\n计算机不会等待用户点击“OK”按钮，“Pop-up window”作为窗口标题出现，当然我们也可以将其改为更有意义的内容。\n\
  \n## 2.3.7 MATLAB 程序结构总结\n\n这是 MATLAB 中使用的结构的简要总结。斜体单词表示条件、语句块和变量。虽然 MATLAB 不要求条件出现在括号中，但由于编程风格，本文以此方式显示条件。一个语句块指的是一个或多个命令，包括嵌套命令。例如，`if`\
  \ 语句内部的语句块可以包含更多的 `if` 语句。\n\n![Image](img/figure_1.jpg)\n\n***图 2.1*** 由“errordlg”命令生成的弹出窗口。\n\
  \n```matlab\nif *(condition)*\n    *block of statement(s)*\nend\n\nif *(condition)*\n\
  \    *block of statement(s)*\nelse\n    *block of statement(s)*\nend\n\nif *(condition)*\n\
  \    *block of statement(s)*\nelseif *(condition)*\n    *block of statement(s)*\n\
  end\n\nif *(condition)*\n    *block of statement(s)*\nelseif *(condition)*\n   \
  \ *block of statement(s)*\nelse\n    *block of statement(s)*\nend\n\nfor *variable*\
  \ = *first index* : *last index*\n    *block of statement(s)*\nend\n\nfor *variable*\
  \ = *first index* : *increment* : *last index*\n    *block of statement(s)*\nend\n\
  \nwhile *(condition)*\n    *block of statement(s)*\nend\n\nswitch *(variable)*\n\
  \    case *value1*\n        *block of statement(s)*\n    case *value2*\n       \
  \ *block of statement(s)*\n    ...\n    case *valueN*\n        *block of statement(s)*\n\
  end\n\nswitch *(variable)*\n    case *value1*\n        *block of statement(s)*\n\
  \    case *value2*\n        *block of statement(s)*\n    ...\n    case *valueN*\n\
  \        *block of statement(s)*\nend\n\nswitch *(variable)*\n    case *value1*\n\
  \        *block of statement(s)*\n    case *value2*\n        *block of statement(s)*\n\
  \    ...\n    case *valueN*\n        *block of statement(s)*\n    otherwise\n  \
  \      *block of statement(s)*\nend\n\nswitch *(variable)*\n    case {*value1*,\
  \ *value2*, ..., *valueN*}\n        *block of statement(s)*\n    case *valueN+1*\n\
  \        *block of statement(s)*\n    ...\n    case *valueM*\n        *block of\
  \ statement(s)*\nend\n```\n\n\n\n\n```matlab\nk = k + 1;\nend\ndisp(mysum)\n```\n\
  \n虽然这个解决方案是有效的，但我们在进入 `while` 循环之前就已经知道了循环体要执行多少次。为什么不使用 `for` 循环呢？下面的代码就是实现了这一点。\n\
  \n```matlab\nA = [45, 21, 33, 9, 17];\nmysum = 0;\nfor k=1:length(A)\nmysum = mysum\
  \ + A(k);\nend\ndisp(mysum)\n```\n\n使用 `for` 循环代替 `while` 循环允许我们用少两行代码来表达解决方案，这可以认为是更好的替代方案。\n\
  \nMATLAB 提供了一个 `sum` 函数，因此循环可以简单地替换为函数调用，如下代码所示。\n\n```matlab\nA = [45, 21, 33,\
  \ 9, 17];\nmysum = sum(A);\ndisp(mysum)\n```\n\n涉及 `sum` 的解决方案紧凑且清晰，因此在没有其他理由要在循环中查找结果的情况下，这个解决方案是三种中最好的。然而，这个示例的目的是展示完成任务的替代方法。给定一个像上一个\
  \ `for` 循环，你应该能够将其转换为 `while` 循环，反之亦然。\n\n接下来，我们从一个 `if` 语句开始。\n\n```matlab\nb =\
  \ input('enter a number ');\nif (b==1)\ndisp('one');\nelseif (b==2)\ndisp('two');\n\
  elseif (b==3)\ndisp('three');\nelse\ndisp('not one, two, or three');\nend\n```\n\
  \n这本可以简单地从打印“one”开始，此时 `if` 语句是自然的解决方案，稍后再添加“two”和“three”。软件不会随着时间的推移保持不变，而是随着程序员修正之前的错误和实现新功能而不断变化和增长。你可能见过这种情况，即你的电脑提示你下载并安装正在使用的软件的最新版本。随着程序员向\
  \ `if` 语句中添加更多的 `elseif` 条件，解决方案将达到一个使得 `switch` 语句看起来更合适的界点。在未来，程序员是应该继续努力添加新的\
  \ `elseif`，还是花时间重写它？有时，如何投入时间的选择可能并不明朗。\n\n将 `if` 语句转换为 `switch` 语句将产生如下内容。\n\n\
  ```matlab\nb = input('enter a number ');\nswitch b\ncase 1\ndisp('one');\ncase 2\n\
  disp('two');\ncase 3\ndisp('three');\notherwise\ndisp('not one, two, or three');\n\
  end\n```\n\n尝试将 `if` 语句转换为 `switch` 语句，然后将示例 `switch` 语句转换为 `if` 语句。\n\n## 2.5 带有用户输入的\
  \ WHILE 循环示例\n\n有时我们希望程序根据用户输入进行工作，并对每个输入重复一系列命令。`for` 循环并不适合这种模型，因为我们预不知道需要循环多少次。`while`\
  \ 循环运行良好，因为我们可以一直循环直到满足某个条件。考虑以下代码。\n\n```matlab\ndone = 0;\nwhile (~done)\nmykey\
  \ = input('press q: ', 's');\ndisp('you pressed a key');\nif ((mykey == 'q') | (mykey\
  \ == 'Q'))\ndone = 1;\nend\nend\n```\n\n首先，我们将布尔变量 `done` 设置为 `0`（假）。然后我们测试“未完成”，这在第一次执行时将为\
  \ `1`（真）。因此我们知道循环至少会执行一次。接下来，我们从用户处获取输入并显示消息。然后我们检查输入是否为小写的 `q` 或大写的 `Q`。如果其中一种情况成立，我们将\
  \ `done` 设置为 `1`。当这种情况发生时，控制将回到 `while` 语句的开头。它将求值为真，计算机将退出循环。\n\n如果在输入处输入 `qqqq`、或者退出、或其他类似的字符串，计算机实际上会继续循环！它会检查整个输入以判断它是否正好是两个可能的字符之一。任何长度超过一个字符的字符串将自动通过测试。作为一个练习，考虑你将如何修改代码，使得字母\
  \ `q` 出现在输入的第一个字符时就退出。\n\n## 2.6 常用 MATLAB 函数\n\nMATLAB 提供了许多用于各种任务函数。在这里我们简要讨论一些更常用的函数。这些命令将数据从一种类型转换为另一种类型，返回关于变量大小的信息，或者调用数学函数。\n\
  \n如果你有一个想要转换为整数的浮点数，你可以使用 `round` 函数来返回最接近它的整数。其他选项包括使用 `ceil` 将值向上取到上方的下一个整数，或使用\
  \ `floor` 获取其下方的整数值。这些函数每一个都返回一个整数，尽管它的数据类型将是 `double`。你也可以使用数据类型的名称进行转换，例如使用 `uint8(x)`\
  \ 返回 `x` 的 8 位无符号整数版本。\n\n函数 `length` 和 `size` 分别给出数组或矩阵的维度。这两个函数也适用于标量值。下面的变量定义为我们提供可以使用的数据。\n\
  \n```matlab\n>> a = 10;\n>> b = [9, 8, 7, 6];\n>> c = [5, 4; 3, 2];\n```\n\n接下来的几个命令使用显示命令（`disp`）显示\
  \ `a`、`b` 和 `c` 的长度。我们也可以直接输入 `length(a)`，尽管这样会让输出更紧凑一点。\n\n```matlab\n>> disp(length(a));\n\
  1\n>> disp(length(b));\n4\n>> disp(length(c));\n2\n```\n\n\n\n\n\n```\ni = 6;\n\
  disp(i)\n6\n```\n\n这可能会导致一些歧义，正如我们在接下来几行中看到的。\n\n```\ndisp(3 + 4i)\n3.0000 + 4.0000i\n\
  \ndisp(3 + 4*i)\n27\n\ndisp(3 + 4*j)\n3.0000 + 4.0000i\n```\n\n`parsing`（解析）意味着为了理解某物而将其拆解。在第一行中，计算机解析\
  \ `3 + 4i` 为一个复数，其中 `3` 是实部，`4` 是虚部。第二个 `disp` 语句包含一个看起来相似的参数 `3 + 4*i`，计算机将其理解为\
  \ `3` 加上变量 `i` 乘以 4 的结果。之后，`disp` 语句打印 `3 + 4*j` 的结果，结果是一个复数，其中 `3` 是实部，`4` 是虚部。换句话说，如果变量\
  \ `i` 没有被定义，这三个语句将产生相同的结果。\n\n要将数字从浮点转换为整数，选项包括 `round`、`fix`、`ceil` 和 `floor`。注意，这些函数返回的值类型为\
  \ `double`，而不是整数数据类型。这些函数之间的区别在于细节。`round` 函数返回最近的整数值。要截断小数部分，请使用 `fix`。对于 `ceil`\
  \ 和 `floor` 函数，想象一个气球浮在建筑的某一层。`ceil` 函数使其上升到下一层，而 `floor` 函数使其掉落到当前楼层的底部。现在想象这栋建筑有地下室，并将气球想象为浮在\
  \ `-3` 层。`floor` 函数将它带到 `-3`，而 `ceil` 函数将把它发送到 `-2`。\n\n函数 `mod` 和 `rem` 分别返回除法后的模和余数。主要区别在于当它们的两个参数符号不同时如何做出反应。`rem`\
  \ 函数保留第一个参数（即被除数）的符号。此外，当第二个参数（除数）为零时，`rem` 返回 `NaN`（是“not a number”，非数字的缩写）。当除数为零时，`mod`\
  \ 函数返回被除数。`mod` 函数在编程中有许多用途，可以用来防止某个值超过限制。例如，如果我们希望一个变量的值在 `0` 到 `99` 之间，可以使用 `mod`\
  \ 函数将其保持在所需的范围内。考虑以下几行。\n\n```\nx = 98;\ndisp(mod(x+1, 100))\n99\n\ndisp(mod(x+2,\
  \ 100))\n0\n\ndisp(mod(x-103, 100))\n95\n```\n\n以 `98` 为初始值，对其加 1 得到的是一个在范围内的结果。加\
  \ 2 意味着它会回绕到 `0`。如果我们从它减去一个大值，它会向另一个方向回绕。无论我们加上或减去什么值，我们得到的结果整数部分都在 `0` 到 `99` 的边界内。然而，这不能保证我们得到整数值，因为使用浮点数（如\
  \ `mod(x+1.7, 100)`）会导致结果为 `99.7`。`floor` 函数可以帮我们解决这个问题。\n\n## 2. PLOT\n\nMATLAB\
  \ 提供了几个图形化显示数据的函数。最实用的之一是 `plot` 函数。为了演示它，我们首先需要数据。接下来的几行定义了一些数组变量，包括 `y`。`conv`\
  \ 函数计算两个数组的卷积。理解卷积对于这个示例并不重要；它以一种算法将数组组合在一起，类似于我们在纸上相乘大数的方法。\n\n```pascal\npascal3\
  \ = conv([1, 1], [1, 1]);\npascal5 = conv(pascal3, pascal3);\ny = conv(pascal5,\
  \ pascal5);\nplot(y)\n```\n\n从 `plot` 命令中，我们 MATLAB 打开了一个新窗口，并显示了 `y` 中点的图表（默认用线条连接这些点）。图\
  \ 2.2](#12_chapter02.html_fig22) 显示了生成的图表。\n\n代码将两个变量命名为 `pascal3` 和 `pascal5`，因为它们持有杨辉三角形的第三行和第五行，其中第一行持有数字\
  \ 1。随后的代码以另一种方式计算杨辉三角形的行，尽管如果你检查 `pascal3` 和 `pascal5` 的值，你会发现它们持有与前一个示例中同名变量相同的值。\n\
  \n```pascal\npascal1 = 1;\npascal2 = conv(pascal1, [1, 1]);\npascal3 = conv(pascal2,\
  \ [1, 1]);\npascal4 = conv(pascal3, [1, 1]);\n```\n\n![Image](img/figure2_2.jpg)\n\
  \n***图 2.2*** 示例数组的图表。数组值来自杨辉三角形。\n\n```pascal\npascal5 = conv(pascal4, [1, 1]);\n\
  pascal6 = conv(pascal5, [1, 1]);\npascal7 = conv(pascal6, [1, 1]);\npascal8 = conv(pascal7,\
  \ [1, 1]);\ny = conv(pascal8, [1, 1]);\ndisp(pascal1);\ndisp(pascal2);\ndisp(pascal3);\n\
  disp(pascal4);\ndisp(pascal5);\ndisp(pascal6);\ndisp(pascal7);\ndisp(pascal8);\n\
  disp(y);\n```\n\n### 给图表添加文本\n\n要在图表中添加文本，我们有多种选项。`title` 命令在图表上方放置居中文本。正如你预期的那样，`xlabel`\
  \ 将文本放在 *x* 轴下方，`ylabel` 将其放在 *y* 轴左侧。还有一个 `zlabel` 命令，用于 3D 图表。另一个命令 `text` 允许我们在图表本身的任何位置放置字符字符串。如果你使用包含下划线的文本，你可能会惊讶地发现下划线没有出现，下划线后的字符将显示为下标。MATLAB\
  \ 遵循与“Latex”类似的约定，这是一个强大的文本处理工具，科学家常用于学术论文。\n\n现在让我们演示这些选项。首先，我们创建一个名为 `x` 的新数组作为\
  \ *x* 坐标。范围 `1:length(y)` 可能会让你联起 for 循环，因为我们经常使用这样的表达式来定义循环索引。对其减去 5 使其中心位于 0，至少对于这个示例而言，因为\
  \ y 包含九个值。接下来，我们发出 `figure()` 命令，它会创建一个新的图形窗口。如果已经存在图形窗口，当我们使用 `plot` 命令时它不会被覆盖。之后，我们绘制由\
  \ `x` 和 `y` 指定的点，带有属性 `r*:`：其中 `r` 代表红色，`*` 代表每个点使用的符号，`:` 表示虚线。通过这些命令，我们将完成该操作。\n\
  \n```matlab\nx = (1:length(y)) - 5;\n\nfigure();\n```\n\n\n\n\n```matlab\nplot(x,\
  \ y, 'r*:');\n```\n\n假设我们还想显示每个 y 值的平方根，这可以通过 `sqrt` 函数实现。让我们使用 `stem` 命令来实现这一点：使用绿色，用圆圈表示点，并用虚线表示线干。在调用\
  \ `stem` 函数之前，我们先调用 `hold on` 命令，该命令会更改此图形的“hold”属性，以保留已经显示的图表。默认情况下，像 `plot` 或\
  \ `stem` 这样的命令在绘制新图之前会擦除图中显示的所有内容。\n\n```matlab\ny2 = sqrt(y);\nhold on;\nstem(x,\
  \ y2, 'go--');\n```\n\n现在，图形应该同时显示原始点和 `y2` 点。接下来，我们为它添加标题、坐标轴标签，并添加一些文本。字符串“maximum\
  \ is here at y[0]”将从该图的 (0.5, 68) 点处开始出现，靠近最大值。请注意，如果我们给它像 (10, 10) 这样的坐标，在这种情况下我们将看不到它，因为那个点太靠右侧，超出了图形范围。注意，使用下划线后，零将显示为下标。\n\
  \n```matlab\nxlabel('centering at zero');\nylabel('triangle values');\ntitle('Pascal''s\
  \ Triangle');\ntext(0.5, 68, 'maximum is here at y_0');\n```\n\n图 2.4 显示了一个与你看到的类似的图形，只不过是黑白的。\n\
  \n![Image](img/figure2_4.jpg)\n\n**图 2.4** 一个带有文本的示例散点图、状状图。\n\n现在我们已经学习了绘制数据的基础知识，还有其他几个命令可以探索。首先，假设你的计算机仍然显示上一个示例的图形，我们可以使用\
  \ `clf`（即“clear figure”，清除图形）来清除它。它会擦除当前图形的内容，尽管我们可以通过传递图形编号作为参数来告诉它清除哪一个图形。如果你有多个图表显示，之前的许多命令都适用于当前窗口，用户只需点击不同的图形即可简单地切换。`figure`\
  \ 命令本身返回一个*句柄*（handle），这是一个用于识别窗口（以及其他对象）的特殊值。首先尝试单独使用 `clf` 命令，看看它对图形做了什么。\n\n\
  ```matlab\nclf;\n```\n\n你应该观察到图形窗口发生了变化。菜单项和工具栏仍然保留，尽管这些下方的区域将变为空。如果我们想去掉所有的图形呢？`close`\
  \ 命令可以做到，我们可以在不带任何参数的情况下调用它，此时会关闭当前图形；或者我们可以指定图形编号作为参数，也可以告诉它关闭所有图形。以下命令关闭了所有图形。\n\
  \n```matlab\nclose all\n```\n\n假设我们有了之前示例中的 `x` 和 `y` 数据，我们创建一个新图形并将图形句柄保存在名为 `myfigure`\
  \ 的变量中。除了在同一张图上绘制数据外，我们还可以将一个图形分解为子图，称为 `axes`。接下来的 `subplot(2,1,1)` 命令接受三个参数，并指示计算机将图形分为\
  \ 2 × 1 个较小的图形，即 2 行 1 列。第三个参数将当前轴设置为 1，意味着在本例中是顶部的子图。然后，使用 `bar` 函数以红色柱状图的形式绘制图表。另一个\
  \ `subplot` 命令将当前轴设置为第二个子图。最后，`stairs` 命令以阶梯图的形式显示相同的数据，类似于一组阶梯。\n\n```matlab\n\
  myfigure = figure(); subplot(2,1,1);\nbar(x, y, 'r');\nsubplot(2,1,2);\nstairs(x,\
  \ y, 'm');\n```\n\n你看到的图形应该和图 2.5 完全一样，只不过在你的屏幕上是彩色显示的。\n\n现在尝试 `saveas` 命令，它使用图形句柄。它告诉计算机将图形保存为\
  \ JPEG 文件，在这种情况下，文件名为“bar_and_stairs.jpg”。\n\n```matlab\nsaveas(myfigure, 'bar_and_stairs.jpg',\
  \ 'jpg');\n```\n\n实际上，在这个示例中`saveas` 命令不需要最后一个参数。它指示计算机使用什么格式，如果省略，`saveas` 命令将根据文件名来确定格式。然而，指定格式确实增加了命令的清晰度。如果文件名不包含扩展名，则应该包含。请注意，使用\
  \ `saveas` 保存的图像并不总是与使用菜单选项保存的图形一致，因此你可能想关闭 MATLAB 会话或清除变量之前查看保存的图形。补充材料中的 `compareSaveAs.m`\
  \ 提供了一个比较两种保存图像方法的演示。使用它发现，在笔记本电脑上，`saveas` 命令生成的图像大小为 900 行 1201 列，而通过菜单选项创建的图像为\
  \ 419 行 560 列。在台式计算机上测试发现了相似的结果，`saveas` 为 900 × 1200，而菜单选项为 864 × 1152。你的结果可能会有所不同。相关命令\
  \ `savefig` 将图形以 MATLAB 的“FIG”格式保存，在活动编辑时你可能更倾向于这种格式。也就是说，如果你处理一个图形，决定停止，并认为以后可能进行进一步更改，`savefig`\
  \ 将图形保留为一个对象，允许你更改文本字体和大小等细节。\n\n\n\n\n\n要定义我们自己的函数，我们使用 `function` 关键字。我们可能想反复使用我们的函数，因此应该将其存储在一个文件中。但\
  \ MATLAB 需要一种方法来定位我们的新函数，所以无论我们为它选择什么名称，都应该作为文件名。\n\n让我们创建一个平均值函数。首先，创建一个名为 `average.m`\
  \ 的新文件。我们将迭代地构建它，但在本示例结束时，它将能够工作。在 MATLAB 编辑器中输入以下内容。\n\n```matlab\n% Example function\n\
  % average\n%\n% usage:\n%      avg = average(array);\n\nfunction avg = average(x)\n\
  avg = x(1);\n```\n\n此时，该函数还没有找到平均值，尽管我们很快就会修复这个问题。这个函数指定了几个点。首先，我们在顶部有注释，记录了我们新函数的说明。其次，我们使用\
  \ `function` 关键字来指定这是一个函数，`avg` 将是我们输出的名称，而函数名称为 `average`，`x` 将是我们输入的名称。这看起来似乎是反过来的，但对用户来说是有意义的。在另一个程序中，我们可能会使用\
  \ `myavg = average(myarray);`。\n\n当你点击“保存”时，MATLAB 会提示你命名。除非你另有说明，否则会自动将其命名为 `average.m`。以该名称保存它。\n\
  \n现在我们可以尝试这个函数了。它还没有做任何实用的事情，但我们可以验证 MATLAB 是否找到了它。\n\n```matlab\n>> help average\n\
  Example function\naverage\nusage:\navg = average(array);\n```\n\n当我们使用 `help` 函数时，我们发现它会自动找到我们的新函数，并将初始注释作为帮助输出。请注意，初始块之后的任何注释将不会显示在帮助输出中。\n\
  \n让我们尝试使用我们的函数。\n\n```matlab\n>> average([1, 2, 3])\nans =\n1\n```\n\n输出在意义上是正确的，因为它执行了我们告诉它执行的操作：返回第一个值。现在，让我们让它执行平均值计算。我们需要将函数的最后一行替换为\
  \ `avg = sum(x)/length(x);`。整个函数看起来像如下。\n\n```matlab\n% Example function\n% average\n\
  %\n% usage:\n%      avg = average(array);\n\nfunction avg = average(x)\navg = sum(x)/length(x);\n\
  ```\n\n让我们尝试新版本的函数。确保在继续之前已保存它。这是一个常见的错误；当我们从命令行调用函数时，MATLAB 将使用保存为文件的任何版本的函数（或程序），而不是编辑器中的版本。新版本的\
  \ MATLAB 预料到了这一点，并且当你切换到命令行窗口时，编辑器可能会自动保存你的更改。然而，如果你使用另一个编辑器，将没有这个功能。\n\n```matlab\n\
  >> x = average([1, 2, 2])\nx =\n1.6667\n```\n\n我们看到平均值函数给我们了正确的输出。我们可以用计算器验证这一点。验证我们的结果始终是一个好主意！\n\
  \n这是一个相当简单的函数，我们可以在单行内完成。函数通常有许多行。如果我们需要提前退出函数，可以使用 `return` 关键字。你可以将 `end` 关键字放在函数的末尾，尽管\
  \ MATLAB 并不要求这样做。\n\n我们不需要告诉 MATLAB 要返回什么值，它将返回 `avg` 的最终值。我们甚至可以在函数中多次使用 `avg`，例如如果我们在系列步骤中确定它的最终值。\n\
  \n在函数执行期间创建的所有变量都是函数的局部变量。当函数结束时，这些变量将自动清除。通常情况下，这是好事，因为当函数完成时，我们的变量空间中没有额外的杂乱。然而，当函数异常退出时，这可能会令人沮丧，因为所有变量都消失了。\n\
  \n函数允许我们抽象问题。例如，在上面的 `average` 函数中，一旦它运行，我们就不需要知道它的细节。我们知道这个概念，函数有一行还是一千行对我们来说并不重要，只要它完成工作即可。当然，如果它很慢或有错误，我们就会担心。\n\
  \n## 2.8.1 多个输入和多个输出\n\n在函数中，我们可以有多个输入和多个输出。第一行指定了这一点，格式如下：\n\n`function [output1,\
  \ output2, ..., outputN] = name (input1, input2, ..., inputN)`\n\n其中 `name` 是函数名，`output1,\
  \ output2, ..., outputN` 指定输出，`input1, input2, ..., inputN` 指输入。下面的示例说明了这一思想。\n\n\
  ```matlab\n% ThreeIn3Out.m\nfunction [a, b, c] = ThreeIn3Out(x, y, z)\na = (x +\
  \ y + z)/3; % average\nb = (x + y + z); % sum\nc = sqrt(x² + y² + z²); % sqrt sum\
  \ squared\n```\n\n接下来出现一个示例运行。\n\n```matlab\n>> [f, g, h] = ThreeIn3Out(2, 3, 4)\n\
  f = 3\ng = 9\nh = 5.3852\n```\n\n当然，我们可以通过在调用函数时在行末尾添加分号来抑制这些值的打印。\n\n（注：原文此处存在大量重复的无效句子，已根据翻译要求进行过滤，仅保留核心逻辑。）\n\
  \n\n\n\n最后，我们调用它并存储一个单一返回值，这给了我们一个平均值。你可能会想，“为什么不每次都返回三个值，让用户自己丢弃不需要的值呢？”这是一个很有的观点，而且很多函数确实是这样做的。然而，用户可能更倾向于使用变数量的输出。\n\
  \n由于输出具有灵活性，你可能会想在使用较少的输入时调用函数，但这会产生错误信息。如果函数应该支持变数量的输入，`varargin` 命令提供了一种支持这种的方法。下面的示例展示了这一点。\n\
  \n### 2.8.2 可变参数输入\n\n此程序演示了 `varargin`，它是 MATLAB 中的一个特殊变量，用于将任意数量的输入参数以单元格数组（cells）的形式存储。单元格数组（`cell`）是\
  \ MATLAB 的一种构造结构，类似于数组，但它引入了灵活性，因为单元格允许存储不同类型的数据。下面的函数通过打印“hello”然后跟上一个名称（可以是零个或多个字符串）来演示这一点。它还使用了另一个名为\
  \ `nargin` 的特殊变量，表示输入参数的数量。\n\n```matlab\n% 可变参数输入\nfunction hello_varargin(varargin)\n\
  str = 'hello';\nfor k=1:nargin\n% 添加一个空格，后跟下一个参数。\nstr = sprintf('%s %s', str, varargin{k});\n\
  end\ndisp(str);\n```\n\n注意我们的字符串变量 `str` 如何从文本 hello 开始，然后我们在循环内部向其添加内容。`sprintf`\
  \ 命令根据 `str` 的之前的版本创建一个新字符串，后面跟着一个空格，以及由当前 `k` 值索引的 `varargin` 单元格。让我们多次调用此函数来展示它是如何工作的。\n\
  \n```text\n>> hello_varargin\nhello\n\n>> hello_varargin('John');\nhello John\n\n\
  >> hello_varargin('John', 'Doe');\nhello John Doe\n\n>> hello_varargin('Mr.', 'John',\
  \ 'Doe');\nhello Mr. John Doe\n```\n\n最初，我们不带任何参数调用它，然后是一个、两个、三个。它会按顺序响应“hello”并跟上这些参数。这允许我们编写能够方便地提供默认值的程序，就像\
  \ MATLAB 的 `plot` 函数处理一个、两个或三个（或更多）参数的方式一样。\n\n### 2.9 按值传递或引用传递\n\n当程序调用函数时，MATLAB\
  \ 按值传递数据。也就是说，它为函数创建了数据的一个副本，如果函数更改了它，调用它的函数/程序是看不到这些变化的。某些计算机语言使用按引用传递，这意味着数据只有一份副本，因此如果函数更改了它，调用函数/程序所访问的数据也会发生变化。MATLAB\
  \ 在特殊情况下确实使用按引用传递，特别是图形对象，例如图形（figures）及其子对象，如按钮和文本框。\n\n按引用传递可以节省计算机资源（如内存），特别是在使用大型矩阵时，因为避免了复制操作。引用必须被传递，尽管它占用了少量的内存。把网页比作类比。如果你看到一个喜欢的网页，并想通过电子邮件与他人分享，你有几种选择。你可以突出网页上的所有内容，选择复制，点击你正在撰写的封邮件正文，然后选择粘贴。那么，该页面上的所有文本将成为邮件的一部分。（是的，图像和视频等内容不会复制到邮件中，所以我们假设文本就是你想分享的所有内容。）另一种共享方法是突出通用资源定位符（URL），并将其粘贴到邮件中。第一种方法创建了文本的副本（可能是数千字节或更多），而第二种方法只发送链接，可能不超过几百个字节。如果你修改了粘贴到邮件中的文本，只有你的接收者会看到那个变化。如果你发送了\
  \ URL，而网页的维护者更改了内容，你的接收者将看到新版本。如果托管网页的服务器宕机，如果你只发送 URL，你的接收者将无法查看内容。在这个类比中，复制和粘贴文本就像按值传递，而只发送\
  \ URL 就是按引用传递。在后一种情况下，你没有发送内容，而是指向内容所在位置的指针。\n\n按值传递可能是低效的，特别是当数据没有变化时。然而，MATLAB\
  \ 背后的程序员理解这一点，并采取了通过不进行不必要的复制来提高性能。这里有几点可以总结：首先，认为 MATLAB 对函数使用按值传递，这意味着函数应该返回它所更改的任何数据。其次，如果你的代码运行性能没有达到预期，更改传递给函数的内容可能会有所帮助。\n\
  \n### 2.10 文件扩展名\n\n我们已经看到 `.m` 扩展名是包含 MATLAB 程序的文件使用的惯例。与 MATLAB 相关的其他扩展名包括 `.asv`、`.m~`、`.fig`、`.mat`\
  \ 和 `.mlx`。`.asv` 扩展名来自“自动保存”（auto save），即计算机自动为你保存的文件。`.m~` 的意思相同。区别在于你在编辑器/调试器下设置的偏好，以及\
  \ MATLAB 编辑器创建备份文件的频率。\n\nMATLAB 使用 `.fig` 扩展名表示图形（figure）。如果你绘制了一些数据，然后选择“另存为”，MATLAB\
  \ 默认使用它自己的图形格式，除非另有指定。例如，以下命令绘制了从 1 到 10 的数字。\n\n```matlab\nplot(1:10)\n```\n\n\
  在图形窗口上，你可以点击文件，“另存为...，它会打开一个让你设置文件名并选择格式的小窗口。默认可能是 `untitled.fig`。你可以在未来的会话中操作该图形。然而，如果你想让其他程序使用该图形，你应该选择另一种格式。“JPEG\
  \ ”格式会以熟悉的 `.jpg` 扩展名保存，允许你像上传图片一样上传它。`.mat` 扩展名指定 MATLAB 数据文件。考虑以下会话。首先，它定义变量 `a`\
  \ 为从 1 到 100 的数组。然后它定义 `b` 为另一个数组，值从 400 到 301。执行 `whos` 命令给了我们这些定义变量的摘要。\n\n![图像](img/c91.jpg)\n\
  \n接下来，`save mydata` 命令创建一个名为 `mydata.mat` 的新文件，包含我们定义的变量。下一个命令 `clear` 消除所有定义的变量并释放它们占用的内存。`whos`\
  \ 命令没有输出，显示此时没有定义变量。然后，`load mydata` 指令 MATLAB 读取我们创建的数据文件并恢复这些变量。随后，`whos` 命令返回关于变量\
  \ `a` 和 `b` 的信息，就像之前一样。最后，`plot(a,b)` 命令直观地展示了，随着 `a` 从 1 增加到 100，`b` 从 400 减少到\
  \ 301。因此，我们现在拥有的数据与 `save` 命令之前的数据相同。\n\n\n\n\n一项相当新的功能是“实时脚本”（live script）格式，它允许将程序和输出图表混合。此类文件使用\
  \ `.mlx` 扩展名。注意，生成的文件可能无法在 MATLAB 之外使用。虽然以 `.m` 结尾的文件可以使用任何文本编辑器查看或修改，但 `.mlx` 文件并非如此。相反，这些文件以可扩展标记语言（XML）的形式存储了一些文本，由多个文件合并并压缩（也称为“zips”）而成的。如果你知道如何“解压”具有\
  \ `.zip` 扩展的文件，就可以从 `.mlx` 文件中恢复代码，尽管最好的方法是使用 MATLAB 编辑器。\n\nMATLAB 还可以读取和写入其他程序的文件，如\
  \ `.wav`、`.jpg`、`.csv` 和 `.xls`。`.wav` 扩展表示波文件格式，这是存储数据的常用方式。图像通常以 `.jpg`（联合图像专家小组）、`.bmp`（位图）、`.png`（可便式网络图形）和\
  \ `.tif`（标记图像格式文件）扩展名的形式出现，MATLAB 支持所有这些格式（以及更多格式）。\n\n另一种受支持的文件类型 `.eps`（封装后胶器脚本）具有一个有趣的特性。它可以将文本作为单个字符存储，而不是作为字符的像素图像。换句话说，如果你在以\
  \ `.eps` 扩展名保存的文件中包含“Example plot”之类的文本，那么“Example plot”这些词实际上存储在文件中。搜索文件内部的实用程序能够找到它。这里有一个示例。以下代码生成一个图表，并在上方添加一些文本作为标题。\n\
  \n```\na = 1:100;\nb = 400:-1:301;\nplot(a,b,'k')\ntitle('Example plot.');\n```\n\
  \n假设我们使用图形下“文件”选项卡下的“导出设置...”选项将其缩小为一英寸宽、一英寸高。也许在此时，我们需要这个尺寸，并且没有预见到以后需要更大的版本。之后，我们使用“另存为...”选项将其存储为\
  \ `.jpg` 格式，并以及一个 `.eps` 文件。以后，我们可能会在文档中使用这两个文件，其中我们指定的宽度大于一英寸。图 2.8 显示了结果。这个示例说明了矢量图形的一个优势，即文件指定了如何绘制图像，而位图图形的只包含像素颜色。不过，这种优势通常是以文件大小为代价的。在这个示例中，EPS\
  \ 文件占据的大小是 JPEG 文件的 2.7 倍。\n\n![图像](img/figure2_8.jpg)\n\n**图 2.8** 将缩小后的图表保存为 JPEG\
  \ 文件在放大时看起来很模糊，而保存为 EPS 文件的看起来良好。\n\n图 2.8（左侧）中显示的 JPEG 版本看起来很模糊，而[图 2.8]（右侧）中显示的\
  \ EPS 版本看起来清晰。如上所述，JPEG 文件不存储文本；它将所有内容都存储为图像，读取文件的计算机无法知道黑色像素是线条的一部分还是字母“E”的一部分。EPS\
  \ 文件实际上包含了文本。为了证明这一点，请考虑下面的命令。注意，这在 MATLAB 中是不作用的。这些内容来自 iMac 的终端（Terminal）窗口，并使用了内置命令。\n\
  \n```\nmweeks$ grep -n \"Example plot\" example_plot.jpg\nmweeks$ grep -n \"Example\
  \ plot\" example_plot.eps\n618:(Example plot.) t\nmweeks$\n```\n\n`grep` 命令在 Unix/Linux\
  \ 机器上用于在文件中查找模式。这是一个实用的实用工具。在这里，文本 `mweeks$` 是终端窗口中的提示符，类似于 MATLAB 使用的 `>>` 提示符。第一行指示计算机在\
  \ `example_plot.jpg` 文件中查找文本“Example plot”，尽管它没有找到任何内容。第二行说在 `example_plot.eps`\
  \ 文件中查找相同的文本，计算机响应了该文件第 618 行的内容。它找到了该文本。\n\n注意映射到不同内容的文件扩展名。具有 `.m` 扩展名的文件可能是 MATLAB\
  \ 脚本/函数，也可能是 Objective-C 语言编写的程序。同样，`.fig` 扩展名可能是 MATLAB 图形，也可能是由 xfig 绘图程序使用的图形。你可能会遇到的最大问题可能是当你点击文件时，计算机打开了错误的应用程序。通过启动应用程序并通过它来调用文件，你可以轻松地避免这种情况。\n\
  \n### 2.11 检查变量是否存在\n\n`exist` 命令允许我们检查变量是否已经存在。虽然这并不是良好的编程习惯，但脚本可能会期望在用户调用程序之前某个变量已经定义。更好的方法是将脚本转换为函数，然后在函数调用中允许变数量的参数。也许我们正在调试某些代码，其中某个变量本应该被定义，但看起来并没有定义，可能是由于一个错误的\
  \ `clear` 语句。这种检查将为我们提供额外信息。它的另一种用法是了解更多关于标签的信息，例如当我们不确定某个标签是指数组还是函数时。无论出于什么原因，让我们以此作为几个示例的。。首先，定义一个变量，然后检查它是否存在。\n\
  \n```matlab\nA = 3:6;\nif (~exist('A', 'var')))\n    A = 7:10;\nend\ndisp(A)\n```\n\
  \n我们看到 `exist('A', 'var')` 返回假值，取反后变为真，计算机执行 `if` 语句体的内容。输出证实了这一点。现在我们尝试一个反例。\n\n\
  ```matlab\nclear A;\nif (~exist('A', 'var')))\n    A = 7:10;\nend\ndisp(A)\n```\n\
  \n由于变量 A 已经存在，计算机跳过了 `if` 语句体的内容。输出证实了这一点。\n\n我们看到变量生成的代码为 1，假设 A 未被清除。函数是内置的时返回\
  \ 5，当由 .m 文件定义时返回 2。注意，`exist` 无法告诉你 .m 文件对应的是函数还是脚本，因为这两个实例都使用 2 作为代码。在第三个示例中，我们看到当传递它的字符串不对应任何它能找到的内容时，它返回\
  \ 0。最后一个示例显示了 `exist` 如何根据第二个参数表现；表达式 `exist('disp', 'var')` 专门询问 disp 是否作为变量存在。\n\
  \n```matlab\n>> disp(exist('A'))\n1\n>> disp(exist('disp'))\n5\n>> disp(exist('notdefined'))\n\
  0\n>> disp(exist('disp', 'var'))\n0\n```\n\n### 2.12 编程技巧\n\n尽管可能会干扰程序的可读性，但你可以使用分号或逗号分隔命令，将多个命令放在同一行。\n\
  \n\n\n\n记住要`document your code`。你应该在程序顶部的注释中包含相关信息，包括你的姓名、日期、代码用途以及使用信息（描述输入参数）。你还应该在代码中添加注释，描述你的代码的功能。此外，如果你的代码来自其他来源，请务必标明出处、编写者以及代码开始和结束位置。\n\
  \n## 2.13A 变量命名示例\n\n此示例源于一个简单方式处理输入的程序。它应该是灵活的，以便能够处理标准输入和标准输出（在 C/C++ 语言中称为 `cin`\
  \ 和 `cout`），或者允许用户指定输入文件，或者同时允许输入和输出文件。它调用了一个名为 `Process` 的函数，但该函数的具体细节对于本次讨论并不重要。代码部分如下。\n\
  \n```\nif (fnameCount == 0)\n  Process(cin, cout);\nelseif (fnameCount == 1)\n \
  \ Process(inputfile, cout);\nelse\n  Process(inputfile, outputfile);\nend\n```\n\
  \n在计算传递给它的参数时，它假设第一个是输入文件名，第二个是输出文件名，并忽略其他任何参数。如果忽略了任何参数，它会给用户发出警告。变量 `fnameCount`\
  \ 用于计数参数，并可以像上面所示用于确定用户所需的 I/O 方式。但这段代码并不清晰。\n\n添加两个布尔变量 `inputFileSpecified` 和\
  \ `outputFileSpecified` 可以改进这一点，使得之前的代码能够以更清晰的方式表达出来，如下所示：\n\n```\nif (inputFileSpecified\
  \ && outputFileSpecified)\n  Process(inputfile, outputfile);\nelseif (inputFileSpecified)\n\
  \  Process(inputfile, cout);\nelse\n  Process(cin, cout);\nend\n```\n\n这样一来，代码看起来更具可读性。\n\
  \n### 2.14 算法思维\n\n算法思维意味着解决问题，它涉及处理问题的系统方法，即将其分解为若干步骤。当你面对一个大问题时，它可能会让你无所适从。但如果你能将其分解为更小的任务，整个问题就会变得更容易处理。这种`divide\
  \ and conquer`方法是算法思维的一部分。有效的领导者会在员工之间分配责任；有效的计算机程序员会将工作委托给函数。\n\n处理问题的方法有许多。你可能可以解决单个实例的问题，然后迭代解决方案。例如，考虑编写一个程序来处理大型公司所有人的工资单。是有\
  \ 10 个员工还是 1000 万员工其实并不重要。编写一个处理单个人工资单的程序，然后对其他人反复执行即可。通常，这意味着分别处理第一个和/或最后一个元素，并用循环处理中间的元素。\n\
  \n我们可以根据你看待问题的方式，从“自顶向下”（从全局概览到非常具体的细节）或从“自底向上”（从具体示例到后期对整体的视图）来设计程序。你是先关注森林还是先关注树木？\n\
  \n## 2.15 数据的流动性\n\n在内部，计算机将每个数据值存储为 0 和 1 的序列（`binary digits`或 `bits`）。值的 `context`\
  \ 意味着我们赋予该序列的解释。假设我们有一个值 `01000011`。它意味着什么？我们可以将其解释为十进制数字 67，因为 67 在二进制（binary）中就是这样显示的。我们是如何知道的？有方法可以转换二进制模式，例如：\n\
  \n```\n0 × 2⁸ + 1 × 2⁷ + 0 × 2⁶ + 0 × 2⁵ + 0 × 2⁴ + 0 × 2³ + 0 × 2² + 1 × 2¹ + 1\
  \ × 2⁰\n= 2⁷ + 2¹ + 2⁰\n= 64 + 2 + 1 = 67\n```\n\n或者你也可以通过顺序写下 0 和 1 的所有可能组合创建一个表格。将\
  \ `00000000` 分配十进制值 0 并从那里开始计数，`01000011` 对应于值 67。\n\n我们可能还会将模式 `01000011` 视为字母“C”。美国信息交换标准代码（ASCII）规定了数字和字母（包括大写和小写）的编码。它还包含了标点符号以及你在美国键盘上找到的大多数内容的代码。在该标准下，字母“C”对应位模式\
  \ `01000011`。\n\n解释这种二进制模式的另一种方法是二进制编码进制值 `43`。二进制编码进制将模式分为四位一组，每组四位代表一个 0 到 9 之间的数字。从技术上讲，像\
  \ `1010` 这样的模式其十进制值为 10，但在二进制编码进制中我们忽略这一点（以及任何更大的值）。前四个二进制值 `0100` 对应于 4，而后四个二进制值\
  \ `0011` 对应 3。\n\n或者 `01000011` 也可以被解释为 CPU 的指令（称为 `op-code`），在这种情况下，对于基于 Intel\
  \ 的 CPU，它表示向 `BX` 寄存器中存储的值加 1。如果这让你感到困惑，不要担心。\n\n### 2.16 十进制与二进制\n\n除了十进制，编程经常涉及二进制。计算机在内部使用二进制值，尽管单个数字只能是\
  \ 0 或 1。因此，像 5 这样的整数的二进制表示如下所示。\n\n```\n>> disp(dec2bin(5))\n101\n```\n\n正如从名称中推理的那样，`dec2bin`\
  \ 将十进制值转换为二进制字符串。考虑下面的示例，我们创建了变量 `a` 和 `b`，作为无符号位字节（`uint8`）。我们让 `a` 从零值开始，并将 `b`\
  \ 定义为 `a + 1`。然后 `while` 循环体在 `a` 不等于 `b` 的情况下为每个变量加 1。\n\n```\n>> a = uint8(0);\n\
  >> b = a + 1;\n>> while (a ~= b)\n  a = a + 1;\n  b = a + 1;\nend\n>> disp(a);\n\
  255\n>> disp(b);\n255\n```\n\n这听起来像无限循环，尽管它很快就结束了。检查这些值，我们看到 `a` 和 `b` 都变成了 255，这是\
  \ `uint8` 类型的最大值。对于不熟悉二进制值的人来说，这并不理解。然而，观察 `a` 的二进制值，我们发现 8 位每一位持有值 1。\n\n```\n\
  >> disp(dec2bin(a))\n11111111\n```\n\n换句话说，8 位无符号整数在所有位均为 1 时达到最大值。如果我们想反过来操作，从二进制序列获取十进制值呢？\n\
  \n```\n>> disp(bin2dec('1111'))\n15\n```\n\n正如 `dec2bin` 将十进制值转换为二进制字符串一样，我们可以使用\
  \ `bin2dec` 将二进制数字字符串转换为十进制。然而，MATLAB 现在支持一种新方法来实现这一点，允许你直接从二进制设置值，如下一行所示。\n\n```\n\
  >> a = 0b0110\na =\n    uint8\n         6\n```\n\n在这种情况下，它为 `a` 分配值 6，这是二进制序列 `0110`\
  \ 的十进制等值。在二进制序列前指定 `0b` 让 MATLAB 以这种方式处理该值，而不是十进制值 110。\n\n\n\n类似地，我们可以在数字序列前使用\
  \ `0x` 来表示我们指的是一个十六进制值。十六进制和十进制一样使用 `0` 到 `9` 的数字，但它还允许另外六个数字 `A` 到 `F`。因此，十六进制用单个数字表示\
  \ 16 种可能的值。每个数字对应四位（bits）。我们使用十六进制是因为它直接对应计算机使用的二进制制，而且人们发现十六进制比二进制要更容易用得多。接下来，我们给变量\
  \ `b` 赋值 `0x0f`，这是 15 的十六进制等值。\n\n```matlab\n>> b = 0x0f\nb =\nuint8\n  15\n\n>>\
  \ b = 0x0123\nb =\nuint16\n  291\n```\n\n注意，MATLAB 会根据值分配数据类型。由于第二个值无法放入 8 位中，计算机转而使用\
  \ 16 位无符号整数。你可能会好奇十六进制值 `0x0123` 是如何变成十进制值 `291` 的。每个十六进制数字对应四位，因此其二进制等值为 `0000\
  \ 0001 0010 0011`。二进制字符串可以不带空格写入，尽管空格有助于观察分组。要计算十进制等值，请从右到左将每一位乘以 `2^n`（从 `n = 0`\
  \ 开始），并将所有结果相加。同样的原理也适用于十进制数字，例如 `456 = 4 × 10² + 5 × 10¹ + 6 × 10⁰ = 400 + 50 +\
  \ 6`。因此，当我们找到 `0000 0001 0010 0011` 的十进制等值时，我们得到 `1 × 2⁸ + 0 × 2⁷ + 0 × 2⁶ + 1 ×\
  \ 2⁵ + 0 × 2⁴ + 0 × 2³ + 0 × 2² + 1 × 2¹ + 1 × 2⁰`。\n\n```matlab\n>> 1 * 2⁸ ...\n\
  + 0 * 2⁷ + 0 * 2⁶ + 1 * 2⁵ + 0 * 2⁴ ...\n+ 0 * 2³ + 0 * 2² + 1 * 2¹ + 1 * 2⁰\nans\
  \ =\n291\n```\n\n如计算所示，我们得到的值与使用 `0x` 规范时得到的值相同。\n\n## 总结\n本章介绍了开始编写自己的程序和函数所需的\
  \ MATLAB 特定命令。它涵盖了变量赋值、范围、输出格式化，以及 `plot` 命令和其他常用函数。本章解释了 `if`、`while`、`for`、`try`\
  \ 和 `switch` 等 MATLAB 语句，以及相关的关键字 `else`、`elseif`、`end`、`catch` 和 `case`。这些语句提供了让我们定义程序的结构。\n\
