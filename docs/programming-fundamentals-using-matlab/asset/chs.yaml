  \n```matlab\nfunction outArray = noUnique(inArray)\n  % 初始化输出数组\n  outArray = [];\n\
  \  for k=1:length(inArray)\n    if (isUnique(inArray(k), inArray))\n      outArray\
  \ = [outArray, inArray(k)];\n    end\n  end\nend\n\n% 该值是否出现多次\n% 数组\nfunction moreThanOnce\
  \ = isUnique(value, array)\n  % 统计 value 在 array 中出现的次数\n  EqCount = sum(value ==\
  \ array);\n  moreThanOnce = (EqCount > 1);\nend\n```\n\n5. **灰度图像数据比彩色图像更容易使用**，因为只有一个“颜色”平面，所以我们从定义一个灰度图像开始。\n\
