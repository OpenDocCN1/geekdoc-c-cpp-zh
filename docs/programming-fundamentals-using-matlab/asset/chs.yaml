  \ + 100);\nfor k=1:N\n  x(floor(s(k)), k) = 0;\nend\n```\n\n% 现在 x 是白色背景上的黑色正弦波。\n\
  % 创建新图像 y，作为沿行反转的 x\n% （列反转排序）\n% 这沿右边缘形成了一个镜像。\ny = x(1:N, N:-1:1);\n% 我们可以将这些组合在一起，形成一个宽度翻倍的新矩阵\n\
