  \ `a .* b` 有什么区别？\n10. 以下这对相似的语句 `a = b` 和 `a == b` 有什么区别？\n11. 这一行存在什么问题？`mytime\
  \ = * mytime;`\n\n\n\n\n# 12. 下面代码存在什么问题？\n\n```matlab\nx = ((18-3)*(5+2.1);\n```\n\
  \n## 项目\n\n## 文本相似性评分\n垃圾邮件者试图通过使用外观相似的字符代替原始字符来绕过电子邮件过滤规则。例如，劳力士（Rolex）公司生产高价值腕表，因此销售假表的垃圾邮件者可能会使用他们的名称。包含纯文本该名称的电子邮件很容易被过滤掉，但如果将小字母“L”替换为数字“1”呢？你能发现区别吗？将字符串“Rolex”转换为整数数组\
  \ `int('Rolex')`，然后用规则处理这些整数值，例如在中间添加空格，或将字符替换为相似字符（`r0||e><>`）。最后，打印相似性评分。编写一个近似比较函数，使得相似的单词映射到相似的分数，而不相似的则不会。\n\
  \n# 第 4 章：数组与矩阵\n我们将单个数字称为标量值（scalar），将值列表称为数组（或向量）。当值列表具有行和列时，我们称之为矩阵。矩阵也可以是多维的。可以将其看作一种抽象，其中标量值是数组的一种特例：它是一个仅有一个元素的列表。同样，数组是只有一个行（或仅一列）的矩阵。数组和矩阵可以包含其他数据类型而不是数字，尽管大部分讨论将集中在数值型数组或矩阵上。正如我们很快看到的，处理矩阵可以像处理标量值一样简单。\n\
  \n## 4.1 操作数组\n要给变量赋值数组，我们使用赋值运算符，就像之前处理标量值时一样。我们使用方括号 `[]` 来指定数组中的值组。下面的示例将一组测试分数放在名为\
  \ `testScores` 的变量中。\n\n```matlab\ntestScores = [71, 83, 71, 78, 74, 60, 80, ...\
  \ 76, 80, 82, 71, 76, 68]\n```\n\n`testScores =`\n\n第 1 到第 10 列\n`71  83  71  78\
  \  74  60  80  76  80  82`\n\n第 11 到第 13 列\n`71  76  68`\n\n注意，现在我们引用 `testScores`\
  \ 时，得到的不是一个值，而是 13 个值。每当我们有测试分数信息时，通常都想了解关于它的几点。平均分是多少？为了找到这一点，我们需要了解一些常用的数组函数 `sum`、`length`\
  \ 和 `mean`。\n\n### 4.1.1 数组函数：计算平均值\n`length` 函数返回数组中的元素个数。\n\n```matlab\nlength(testScores)\n\
  ans = 13\n```\n\n正如我们所见，上述数组中有 13 个值。接下来，我们可以使用 `sum` 函数将所有元素相加。\n\n```matlab\n\
  sum(testScores)\nans = 970\n```\n\n因此，计算平均值的一种方法是将 `sum` 除以元素个数。\n\n```matlab\n\
  sum(testScores)/length(testScores)\nans = 74.6154\n```\n\n我们看到测试分数的平均分是 74.6。你可能会惊讶地发现\
  \ MATLAB 没有提供名为“average”或“avg”的函数。如果我们愿意，可以编写自己的函数，但 MATLAB 确实提供了一个平均值函数。我们可以直接使用\
  \ `mean` 函数来找到平均值。\n\n```matlab\nmean(testScores)\nans = 74.6154\n```\n\n### 4.1.2\
  \ 更多数组函数：最小、最大和中位数\n常见问题包括“最小值是多少？”`min` 函数提供了答案。正如你预期的，类似的 `max` 函数提供了数组的最大值。\n\
  \n```matlab\nmin(testScores)\nans = 60\n\nmax(testScores)\nans = 83\n```\n\n与平均值相关的统计量是中位数（median），即中间位置的值。由于我们知道值的个数是奇数，我们通过中间值找到中位数。如果元素个数是偶数，我们则对中间的两个值取平均值。\n\
  \n在我们谈论如何找到中间值之前，我们需要讨论如何逐个访问数组的元素。假设我们想要获取数组的第一个位（第一个）值，即存储在位置 1 的值。与其直接输入变量名，我们不如在变量名后的括号中指定位置，就像为函数指定参数一样。我们将这个位置编号称为*索引*（index），复数称为*索引*（indices）。\n\
  \n```matlab\ntestScores(1)\nans = 71\n```\n\n注意，虽然许多语言使用方括号来索引数组，但 MATLAB 使用圆括号。通过回顾上面分配给数组的数字，可以看到我们成功选择了第一个值。\n\
  \n数组（和矩阵）在 MATLAB 中始终从位置（索引）1 开始。这可能会让一些计算机科学家感到沮丧，因为其他语言允许使用索引 0 来访问数组。这听起来很奇怪，但一旦你习惯了从\
  \ 0 开始索引，它就会变得自然。当然，我们可以使用特殊关键字对数组进行索引。\n\n\n\n\n\n### 4.1.3 作为行或列的数组\n\n数组可以是一个多列的单行，也可以是一个多行的单列。我们可以通过\
  \ `transpose`（转置）一个数组（或矩阵）将其从其中一种状态转换为另一种。\n\n与长度（`length`）相关的函数是 `size`，如下所示。它返回数组或矩阵的维度。\n\
  \n```\n>> size(testScores)\nans =\n1   13\n```\n\n`size` 函数表示我们有 1 行和 13 列。\n\n\
  接下来，我们使用 `transpose` 函数将数组从单行更改为单列。\n\n```\n>> transpose(testScores)\nans =\n71\n\
  83\n71\n78\n74\n60\n80\n76\n80\n82\n71\n76\n68\n```\n\n如果我们将 `transpose` 传递给 `size`\
  \ 函数，我们会发现结果与之前略有不同。\n\n```\n>> size(transpose(testScores))\nans =\n13 1\n```\n\n\
  现在，`size` 函数告诉我们该数组有 13 行和 1 列。\n\n我们也可以使用点号后跟单引号的简写符号来表示转置，如下所示 `testScores.'`。\n\
  \n```\n>> testScores.'\nans =\n71\n83\n71\n78\n74\n60\n80\n76\n80\n82\n71\n76\n\
  68\n```\n\n只要数字不包含复数，在没有点号的情况下使用单引号（即 `testScores'`）也会得到相同的结果。第 4.5 节将更详细地讨论这一点。\n\
  \n### 4.2 从数组中添加和删除元素\n\nMATLAB 允许我们在其他数组内部指定数组。在下面的示例中，我们首先创建一个名为 `myarray` 的数组，它包含元素\
  \ `4, 5, 6`。\n\n然后，我们将 `myarray` 作为一个元素包含在一个名为 `barray` 的新数组中。\n\n```\n>> myarray\
  \ = [4, 5, 6];\n>> barray = [1, 2, 3, myarray]\nbarray =\n1   2   3   4   5   6\n\
  ```\n\n如我们所见，`myarray` 的元素被包含作为 `barray` 的元素。我们也可以将这些值插入数组的中间。\n\n```\n>> [8, 9,\
  \ myarray, 10, 3]\nans =\n8   9   4   5   6   10   3\n```\n\n正如预期的，`myarray` 的元素被包含在新创建的数组中间。请注意，`myarray`\
  \ 的元素是被 `copied`（复制）到这些其他数组中的，这意味着我们之后更改 `myarray` 而不会影响 `barray`。\n\n如何从数组中删除元素？删除数组元素的一种方法是将其设置为\
  \ `null matrix`（空矩阵），也称为 `empty matrix`（空矩阵），用 `[]`（左左和右方括号）表示。\n\n```\n>> myarray\
  \ = [4, 5, 6];\n>> myarray(2) = []\nmyarray =\n4   6\n```\n\n这个示例删除了第 2 列的元素。当然，这意味着现在\
  \ `myarray` 只有两个元素。如果我们重复该命令，它将删除现在占据第 2 列的元素，如下所示。\n\n```\n>> myarray(2) = []\n\
  myarray =\n4\n```\n\n我们也可以以类似的方式从矩阵中删除元素，尽管这会删除整行或整列。现在假设我们将整个数组设置为空矩阵。\n\n```\n\
  >> myarray = []\nmyarray =\n[]\n```\n\n有趣的是，该变量仍然有定义，正如 `whos` 命令所显示的那样。\n\n![Image](img/c142.jpg)\n\
  \n这意味着将变量设置为空矩阵与使用 `clear` 命令将其删除的效果是不同的。\n\n指定空矩阵的替代方法是将变量重新赋值为你你想要保留的值。\n\n```\n\
  >> myarray = [4, 5, 6];\n>> myarray = [myarray(1), myarray(3)]\nmyarray =\n4   6\n\
  ```\n\n我们看到它得到了相同的结果。显然，如果需要逐个指定数组或矩阵应该保留的每个值，将是一项任务。通过本章稍后讨论的范围（ranges），我们将看到轻松指定子数组（或子矩阵）的方法。\n\
  \n## 4.3 矩阵\n\n正如 `size` 函数暗示的，数组仅仅是一个一维矩阵。简单的矩阵操作是 MATLAB 成功的核心。我们看到数据在 MATLAB\
  \ 中可以是非常灵活的；我们可以给一个变量分配一个值或一组值，稍后给该变量重新分配完全不同的内容。\n\n我们以类似于创建数组的方式创建矩阵。为了区分行，我们使用分号\
  \ `;`。（如果我们需要，仍然可以在行末尾使用分号来抑制输出）。在下面，我们创建了一个简单的矩阵。\n\n```\n>> mymatrix = [ 1, 2,\
  \ 3; 4, 6, 7]\nmymatrix =\n1   2   3\n4   6   7\n```\n\n让我们找到这个矩阵的长度。\n\n```\n>>\
  \ length(mymatrix)\nans = 3\n```\n\n我们看到 `length` 函数返回 3，即列数。如果我们需要总元素数，可以使用 `numel`。\n\
  \n```\n>> numel(mymatrix)\nans = 6\n```\n\n但假设我们想要找到维度。使用 `size`。\n\n```\n>> size(mymatrix)\n\
  ans =\n2   3\n```\n\n上面的示例显示行数为 2，列数为 3。\n\n### 4.4 矩阵创建函数\n\n有时程序需要创建矩阵，MATLAB\
  \ 提供了一些函数来快速完成此任务。`zeros`、`ones` 和 `eye` 函数正如其名：创建全零矩阵、全一矩阵或单位矩阵（称为 `I`）。接下来的行演示了如何创建一个\
  \ 3 × 3 矩阵。\n\n```\n>> I = eye(3)\nI =\n1   0   0\n0   1   0\n0   0   1\n```\n\n\
  我们为什么称之为“单位”矩阵？下面的示例解释了原因。首先，我们定义矩阵 `A` 为 1 到 9，分为 3 行。\n\n```matlab\n>> A = [1,\
  \ 2, 3; 4, 5, 6; 7, 8, 9];\n>> A * I\nans =\n1   2   3\n4   5   6\n7   8   9\n```\n\
  \n乘以 `I` 的结果与原始矩阵相同。因此，名称 `I` 代表单位矩阵。\n\n接下来的两个命令创建了 2 × 3 矩阵，第一个全为零，第二个全一。\n\n\
  ```\n>> zeros(2, 3)\nans =\n0   0   0\n0   0   0\n\n>> ones(2, 3)\nans =\n1   1\
  \   1\n1   1   1\n```\n\n这两个函数允许我们快速创建具有任意数量行、列和页面的矩阵。将 `ones` 矩阵乘以常数可以得到一个每个元素都是该值的矩阵。在传递类似\
  \ `'uint8'` 的参数时，这些函数定义了数据类型，这在处理图像时会用到（参见第 8 章，*图像*）。这种方式创建矩阵会一次性分配内存。下面的示例创建了一个简单的图像。\n\
  \n```matlab\nx = zeros(500, 500, 3, 'uint8');\nx(1:250, :, 1) = 255;\nx(:, 1:250,\
  \ 2) = 255;\nimshow(x)\n```\n\n\n\n\n第一行创建了一个维度为 500 × 500 × 3 的矩阵 `x`，其中每个元素都存储一个\
  \ 8 位无符号整数值，初始值为 0。每个平面代表一种颜色：红色、绿色和蓝色。第二行将红色平面的前一半行和所有列设置为 255，这是 `uint8` 的最大值。每个图像像素都是颜色的混合，这就像是将红色值完全调到最高。同样地，第三行将绿色平面的所有行和前一半列设置为\
  \ 255。`imshow` 命令将矩阵显示为图像，结果呈现为左上角的黄色正方形、右上角的红色正方形、左下角的绿色正方形以及右下角的黑色正方形。\n\n###\
  \ 4.4.1 重复“平铺”\n\n`repmat` 函数通过重复“平铺”来创建一个矩阵。通过以下示例，该术语应该应该是直观的。我们设置一个名为 `M` 的 2\
  \ × 2 矩阵，然后将其传递给 `repmat`，生成其 2 × 2 个副本。\n\n```\n>> M = [11, 12; 13, 14];\n>> repmat(M,\
  \ 2, 2)\nans =\n11   12   11   12\n13   14   13   14\n11   12   11   12\n13   14\
  \   13   14\n```\n\n如你所示，如果我们认为 `M` 是一个瓷砖（就像水槽上方的背墙），该函数会在水平方向上放置 2 个副本，垂直方向上放置\
  \ 2 个副本。另一种使用 `repmat` 的方法是复制标量值及其数据类型。\n\n![Image](img/c146.jpg)\n\n在这里，我们看到它返回了一个\
  \ 4 × 5 矩阵，每个值都是 3。关于返回矩阵的更多信息显示它具有 `double` 数据类型。\n\n另一个重定义矩阵的命令是 `reshape`。假设我们有一个\
  \ 2 × 8 矩阵，并将其转换为 4 × 4 矩阵。`reshape` 命令执行此操作，它从输入矩阵中按列向下取值。\n\n![Image](img/c147.jpg)\n\
  \n在这个示例中，我们看到 `B` 的第一列来自 `A` 的第一列，紧接着是 `A` 的第二列。`B` 的其他列也来自 `A` 的列。请注意，`reshape`\
  \ 需要输入矩阵的元素数量等于输出矩阵的元素数量（由另外参数指定）。\n\n### 4.4.2 构建矩阵与内存管理\n\nMATLAB 在创建数组和矩阵时允许极大的灵活性，我们甚至可以一个值一个地构建数组。考虑以下示例。\n\
  \n```\ntic\nfor k=1:1000000\n  myarray(k) = k;\nend\ntoc\n```\n\n命令 `tic` 设置一个计时器，就像按下秒表按钮开始计时一样。然后\
  \ `toc` 命令停止计时器，同样类似于秒表。虽然 `tic` 不输出任何内容，但 `toc` 告诉我们自执行 `tic` 命令以来经过了多久。在 2015\
  \ 年的 iMac 上运行此代码，报告如下：\n\nElapsed time is 0.071264 seconds.\n\n现在考虑这个使用 `zeros`\
  \ 分配内存的示例。\n\n```\ntic\nmyarray2 = zeros(1, 1000000);\nfor k=1:1000000\n  myarray2(k)\
  \ = k;\nend\ntoc\n```\n\n在同一机器上以相同的后台进程运行，得到以下答案：\n\nElapsed time is 0.023058 seconds.\n\
  \n这个示例也创建了一个递增值的大数组，尽管它的运行速度比前一个示例快，大约只需三分之一的时间。需要注意的是，报告的时间具有更高的精度而非准确性，因为报告的数字已经超出了我们应该信赖的范围。使用\
  \ `zeros` 命令再次运行该示例代码会产生以下结果：\n\nElapsed time is 0.019185 seconds.\n\n内存管理解释了为什么我们获得了速度提升。操作系统跟踪可用内存并根据需要将其分配给程序。在第一个示例中，`myarray`\
  \ 会不断增长。MATLAB 为其请求一些内存，随后又需要更多。每次请求都意味着操作系统必须在内存中寻找足够大的空间，并可能将内容从旧位置移动到新位置。这种额外的开销需要时间。打个比方，假设你按照别人说的内容写下列表。手里拿着笔记本，你翻到一个空白处并在可用空间内开始写，即使页面上已经有一些字了。在某一点，你可能会用完空间，于是找一个更大的笔记本并将之前的项目复制过去，然后继续写。如果你预先知道需要多少空间，就可以节省一些精力和时间。使用\
  \ `zeros` 函数（或 `ones`, `eye` 等）意味着操作系统只为 `myarray2` 分配一次内存。实际上，你是在告诉它将需要多大的空间。\n\
  \n### 4.5 标量加法与矩阵转置\n\n我们可以对矩阵进行算术操作，就像对标量值操作一样。首先，我们为标量值定义一个矩阵。\n\n![Image](img/c149.jpg)\n\
  \n`reshape` 命令获取结果数组，并返回一个具有不同行列的矩阵。这里的动机仅仅是提供可以操作的数据。\n\n![Image](img/c149.jpg)\n\
  \n接下来，我们给每个元素加上 1。\n\n![Image](img/c150.jpg)\n\n你注意到我们将矩阵传递给 `round`，它对整个矩阵进行了操作吗？\n\
  \n![Image](img/c150.jpg)\n\n转置函数让我们交换行列。顺便说一下，存在转置函数，它比使用 `.` 运算符代码更清晰。\n\n### 4.6\
  \ 矩阵算术\n\n在两个两个矩阵时，计算机遵循数学的标准定义。例如，如果 `a` 和 `b` 是两个 3 × 3 矩阵，那么结果 `c` 也将是一个 3 ×\
  \ 3 矩阵。模式如下：\n\n![Image](img/eq01.jpg)\n\n其中\n\n`c[i,j] = a[i,1] × b[1,j] + a[i,2]\
  \ × b[2,j] + a[i,3] × b[3,j]`\n\n这适用于 3 × 3 矩阵。当然，如果 `a` 或 `b` 的维度发生变化，表达式 `c[i,j]`\
  \ 需要更多或更少的项。\n\n下面展示了矩阵乘法的数值示例。注意第一个矩阵的列数是否匹配第二个矩阵的行数。如果这些“内部”维度不匹配，则无法进行矩阵乘法。\n\
  \n```\n>> [1, 2, 3; 4, 5, 6] * [1, 2; 0, 1; 1, 0]\nans =\n 4   4\n10  13\n```\n\n\
  我们看到，2 × 3 矩阵乘以 3 × 2 矩阵产生一个 2 × 2 矩阵。推广之，$M$ × $N$ 矩阵乘以 $N$ × $P$ 矩阵得到一个 $M$ ×\
  \ $P$ 矩阵。这里是第二个示例。\n\n```\n>> a = [1, 2; 3, 4; 5, 6]\na =\n1   2\n3   4\n5   6\n\
  >> b = [0, 1; 1, 0];\n>> a*b\nans =\n 2   1\n4   3\n6   5\n```\n\n\n\n注意看结果与矩阵 `a`\
  \ 具有相同的元素，只是列的顺序不同。\n\n接下来，我们有另一个矩阵乘法的示例。我们将 `c` 和 `d` 定义为两个 2 × 2 矩阵。\n\n```matlab\n\
  >> c = [5, 6; 4, 2];\n>> d = [-1, 3; 7, 9];\n>> disp(c * d)\n37   69\n10   30\n\
  ```\n\n我们看到将它们相乘得到一个 2 × 2 的结果。如果你对此不熟悉，可以看一些结果，并尝试理解它们是如何计算的。例如，`-1` × `4 + 2`\
  \ × `7` 得到结果 `10`。现在，让我们来看一个稍微修改的矩阵操作。\n\n```matlab\n>> disp(c .* d)\n-5   18\n\
  28   18\n```\n\n你看到区别了吗？我们没有使用 `*` 来指定矩阵乘法，而是使用了 `.*`，它代表逐元素相乘。在这种情况下，结果的定义变得容易理解得多。对于逐元素相乘，\n\
  \n`c[i,j] = a[i,j] × b[i,j]`，\n\n因此 `c` 的输出元素仅取决于 `a` 和 `b` 对应的元素。\n\n如果我们想将两个矩阵相加呢？它们必须具有相同的维度，除非维度恰好为\
  \ 1。该操作是逐元素进行的。将矩阵 `c` 加到矩阵 `d` 返回以下结果。\n\n```matlab\n>> disp(c + d)\n 4    9\n\
  11  11\n```\n\n减法的定义也类似。与加法一样，我们可以通过逐元素计算来找到结果。\n\n```matlab\n>> disp(c - d)\n 6\
  \    3\n-3  -7\n```\n\n也就是说，要找到结果的左上角值，从 `c` 中减去 `d` 的左上角值，`5 * (-1) = 6`。\n\n如果我们加上一个维度为\
  \ 1 的矩阵（即行数组或列数组）呢？下一个示例显示了列数组 `f` 的定义。将其与之前定义的 `c` 相加会生成一个矩阵，其中每一列都是对应的 `c` 列与\
  \ `f` 之和。\n\n```matlab\n>> f = [2; 8];\n>> disp(c + f)\n 7    8\n12  10\n```\n\n\
  正如之前所示，我们可以找到矩阵与标量值之间的加法（或减法）。对于两个矩阵或一个矩阵和一个数组，它们的大小必须兼容。\n\n使用相同的 `c` 和 `d` 矩阵，我们可以找到\
  \ `c` 除以 `d` 的结果。\n\n```matlab\n>> disp(c / d)\n-0.1000   0.7000\n-0.7333   0.4667\n\
  ```\n\n如你所示，矩阵除法也有数学定义。我们可以通过 `inv` 命令找到矩阵的“逆矩阵”，如下例所示。\n\n```matlab\n>> disp(inv(d))\n\
  -0.3000   0.1000\n 0.2333   0.0333\n```\n\n然而，并不是所有的矩阵都有逆。在这里，你可能会注意到 `d` 的逆矩阵的结果让你想起除法的结果。如果我们用\
  \ `c` 乘以 `inv(d)` 会怎样？\n\n```matlab\n>> disp(c * inv(d))\n-0.1000   0.7000\n-0.7333\
  \   0.4667\n```\n\n结果与 `c / d` 的输出匹配，展示了获取它的另一种方法。这源于数学；矩阵除法的定义通常利用矩阵逆。由于某些矩阵没有逆，并不是所有矩阵都能以这种方式除法。下一行显示了一个矩阵没有逆的简单示例。\n\
  \n```matlab\n>> disp(inv([1, 2]))\nError using inv\nMatrix must be square.\n```\n\
  \nMATLAB 使用不同的方法来计算矩阵除法；更多信息请参见命令 `mldivide` 和 `mldivide` 的帮助条。\n\n像乘法一样，我们也可以显式地将除法作为逐元素操作。下一个示例展示了使用\
  \ `./` 运算符的逐元素除法。\n\n```matlab\n>> disp(c ./ d)\n-5.0000   2.0000\n 0.5714   0.2222\n\
  ```\n\n与其他逐元素元素一样，我们只需要每个矩阵的对应元素来找到它。使用标量进行矩阵除法本质上是逐元素操作。\n\n```matlab\n>> disp(c\
  \ / 4)\n1.2500   1.5000\n1.0000   0.5000\n```\n\n当然，也可以通过将 `c` 乘以 `1./*4` 得到相同的结果。\n\
  \n最后，幂运算使用 `^` 符号对矩阵进行，并可以通过 `.^` 作为逐元素操作执行。首先，我们找到矩阵 `c` 的 2 次方。\n\n```matlab\n\
  >> disp(c ^ 2)\n49   42\n28   28\n```\n\n\n\n我们以相对的方式指定这些值。如果我们输入 `mymatrix(6:8,\
  \ 5:6)`，将得到相同的结果。\n\n```matlab\n>> mymatrix(6:8, 5:6)\n\nans =\n66   72\n77   84\n\
  88   96\n```\n\n如我们所见，结果是相同的。在与计算机交互时，显式包含索引效果良好；但在程序中，相对方式更好，特别是当矩阵可能有不同的维度时。另外请注意，使用\
  \ `maxrow - 2` 在此处是可行的，但并非对所有可能的矩阵都有效。如果矩阵只有一行或两行，则代码将产生错误。我们可以在使用 `maxrow - 2`\
  \ 作为索引之前检查是否满足该条件。\n\n### 4.6.3 行或列的所有索引\n\n指定所有行或列的简便方法是使用单独的冒号 `:`。例如，让我们获取第第\
  \ 4 列的所有行。为了做到这一点，我们使用冒号来指定行。\n\n```matlab\n>> mymatrix(:, 4)\nans =\n10\n20\n30\n\
  40\n50\n60\n70\n80\n```\n\nMATLAB 本身会将冒号理解为该维度上的所有元素。这里是另一种指定此的方法，返回第 5 行的所有列。记住我们之前已经用\
  \ `size` 函数定义了 `maxcol`。\n\n```matlab\n>> mymatrix(5, 1:maxcol)\nans =\n35   40\
  \   45   50   55   60\n```\n\n我们也可以像下面一样使用 `end` 作为指定最大行或最大列的简便方法。\n\n```matlab\n\
  >> mymatrix(5, 3:end)\nans =\n45   50   55   60\n```\n\n因此，关键字 `end` 具有取决于上下文的含义含义。在数组和矩阵中，它意味着沿相应维度的元素范围。\n\
  \n## 4.7 字符串数组\n\n多年来，字符串在编程语言中不断演变。大多数数据类型都有非常统一的表示方式，即使它们占据了多个字的计算机内存。例如，整数值 `100`\
  \ 占据的存储内存与整数 `1` 相同。字符串在本质上是不同的，因为存储字符串更像是存储数组。事实上，MATLAB 将字符串存储为字符数组，直到最近才引入了 `string`\
  \ 类作为替代方案。\n\n#### 4.7.1 字符数组与字符串之间的区别\n\n我们看到可以拥有值的数组。然而，字符数组会带来一些问题，特别是当我们想要字符数组的数组时。首先，我们必须区分字符串和字符数组。旧版本的\
  \ MATLAB 支持字符数组。它提供了像 `strcat` 和 `sprintf` 这样返回文本作为值数组的，其中每个值映射到 ASCII/Unicode 字符。例如，值\
  \ `65` 对应于大写字母“A”，而小写字母从代码 `97` 开始，因此小写的“b”对应于代码 `98`。下面的代码说明了这一点。\n\n![Image](img/c160a.jpg)\n\
  \n定义 `g`，我们看到它被视为一组字符。将 `h` 设置为数组 `g + 0` 不会改变值，但它会改变它们的类型。我们从 `whos` 信息中看到，第一个数组（`g`）使用字符类型，而第二个数组（`h`）将数据存储为\
  \ `double` 值。\n\n随着 2016b 版本的发布，出现了对 `string` 类型的支持。“字符数组”和“字符串”这两个术语有时互换，但为了这次讨论，我们必须区分它们。字符串与字符数组的区别在于\
  \ MATLAB 存储它们的方式。在下面的示例中，我们创建一个字符串 `G`，其内容具有与 `g` 相同的字母。\n\n![Image](img/c160b.jpg)\n\
  \n虽然 `g` 的大小可以揭示字符的数量，但 `G` 则不能。这意味着我们不能对字符串使用 `length` 函数，因为 MATLAB 将字符串视为一个单一的实体。`strlength`\
  \ 函数可以找到字符数组或字符串中的字符数量。\n\n```matlab\n>> disp(length(g))\n3\n>> disp(length(G))\n\
  1\n>> disp(strlength(g))\n3\n>> disp(strlength(G))\n3\n```\n\n如我们所见，使用 `length`\
  \ 对字符数组有效，但它表示的是 `G` 包含的字符串数量，而不是字符串的长度。使用 `strlength` 无论我们传递字符串还是字符数组参数，都能得到相同的结果。\n\
  \n对于其他数据类型，我们有内置的预期，例如 `+` 操作的含义。对于字符串，`+` 操作的通用解释是拼接。接下来的示例将 `k` 设置为字符数组，将 `K`\
  \ 设置为字符串。\n\n```matlab\n>> k = 'hello';\n>> K = string(k);\n>> g + k\nMatrix dimensions\
  \ must agree.\n>> G + K\nans =\nstring\n\"Abchello\"\n```\n\n当我们在字符数组上使用 `+` 操作时，会得到一个关于它们长度不等的错误。如果它们的长度相同，结果将是一个\
  \ `double` 值数组。对于字符串版本，`+` 操作会将两者拼接。我们仍然可以如下所示拼接字符数组：\n\n```matlab\n>> disp(strcat(g,\
  \ k))\nAbchello\n```\n\n当我们在字符数组上使用 `+` 操作时，会得到一个关于它们长度不等的错误。如果它们的长度相同，结果将是一个 `double`\
  \ 值数组。对于字符串版本，`+` 操作会将两者拼接。我们仍然可以如下所示拼接字符数组：\n\n```matlab\n>> disp(strcat(g, k))\n\
  Abchello\n```\n\n由于我们可以像使用字符串一样使用字符数组完成相同的事情，`strcat` 是什么意思？字符串到底意味着什么？字符串类型有它自己的方法。\n\
  \n#### 4.7.2 字符数组\n\n现在，我们专门讨论字符数组。考虑下面的几行。\n\n```matlab\nstrar1 = ['yes', 'no']\n\
  strar2 = ['yes'; 'no']\n```\n\n第一行产生了 `strar1`，它有两个元素。第二行产生了错误！它将字符数组分为两行。MATLAB\
  \ 能够预测如下：\n\n```matlab\nmyarray = [1, 2, 3]\n```\n\n我们可以如下修复字符数组：\n\n```matlab\n\
  strar = ['yes'; 'no']\n```\n\n上面的行没有产生错误，因为我们拥有相同数量的。\n\n### 4.7.3 字符串数组\n\n让我们用字符串重温之前的示例。\n\
  \n```matlab\n>> strar1 = [string('yes'), string('no')]\nstrar1 =\n1×2 string array\n\
  \"yes\"  \"no\"\n\n>> strar2 = [string('yes'); string('no')]\nstrar2 =\n2×1 string\
  \ array\n\"yes\"\n\"no\"\n```\n\n在这里，我们看到第一个命令生成了一个字符串数组，只有单行。第二个命令对不同长度的字符串没有问题，并存储为\
  \ 2 行数组。下一个示例创建了一个 2×2 的字符串矩阵。\n\n```matlab\n>> strar3 = [string('yes'), string('maybe');\
  \ ...\nstring('possibly'), string('no')]\nstrar3 =\n2×2 string array\n\"yes\"  \
  \    \"maybe\"\n\"possibly\" \"no\"\n\n>> disp(strar3(2,1))\npossibly\n```\n\n\n\
  \n\n```matlab\ng = 2*x.² + 5*x - 3;\ntoc\n```\n\n## MATLAB 中的性能分析\n\n我们通过将指数运算符（`^`）替换为逐元素指数运算符（`.^`）来实现这一点。请注意，`x`\
  \ 的第一次使用会将其创建一个从 1 开始的标量值，并在循环期间递增，直到达到 900。在第二次使用中，我们将其设置为一个范围，使其成为一个包含 900 个值的数组，这意味着在第二个示例中，我们使用了更多的内存来存储变量。\n\
  \n这些操作的运行用时间会有所不同。由于 `tic` 和 `toc` 使用系统时钟，结果并不一定能告诉我们 MATLAB 代码让计算机有多忙，它只是告诉我们计算机当时有多忙。可能有其他活动程序导致响应变慢。函数\
  \ `cputime` 返回 CPU（中央处理器）运行 MATLAB 所花费的时间。我们也可以使用它，但那时我们需要选择性地清除变量，并在停止时间中减去开始时间。为了演示起，我们将坚持使用\
  \ `tic` 和 `toc`。我们不应该基于某一次运行得出结论。相反，我们可以将上面的代码封装在一个 `for` 循环中，并在之后清除变量，因为为变量分配内存需要不容忽视的时间。回顾第一组命令，我们得到了下面的示例。\n\
  \n```matlab\nfor i=1:10\n    tic\n    for x = 1:900\n        g(x) = 2*x² + 5*x -\
  \ 3;\n    end\n    toc\n    clear\nend\n```\n\n在运行频率为 2.16 GHz 的 Intel^® Core^(TM)\
  \ 2 Duo 处理器的 Macintosh 上运行此代码会生成以下结果。你的结果会有所不同。\n\n- 运行时间为 0.000633 秒。\n- 运行时间为\
  \ 0.000617 秒。\n- 运行时间为 0.000597 秒。\n- 运行时间为 0.000742 秒。\n- 运行时间为 0.000676 秒。\n-\
  \ 运行时间为 0.000604 秒。\n- 运行时间为 0.000596 秒。\n- 运行时间为 0.000596 秒。\n- 运行时间为 0.000594\
  \ 秒。\n- 运行时间为 0.000594 秒。\n\n现在我们将第二个代码示例封装在相同的循环中，如下：生成计时测量的示例版本可以在 `loop1.m` 和\
  \ `loop2.m` 中找到。\n\n```matlab\nfor i=1:10\n    % 代码放在这里\n    clear\nend\n```\n\n\
  注意，第一行和最后两行与之前的示例相同，以尽可能保持一致。在第一个代码运行几秒后，在同一台机器上在循环运行第二个示例，会生成以下结果。\n\n- 运行时间为 0.000052\
  \ 秒。\n- 运行时间为 0.000021 秒。\n- 运行时间为 0.000019 秒。\n- 运行时间为 0.000019 秒。\n- 运行时间为 0.000018\
  \ 秒。\n- 运行时间为 0.000019 秒。\n- 运行时间为 0.000018 秒。\n- 运行时间为 0.000019 秒。\n- 运行时间为 0.000018\
  \ 秒。\n- 运行时间为 0.000019 秒。\n\n结果显示第二个示例性能优于第一个。然而，我们不应该过早下结论，但可以说，至少在这台计算机上，第二个示例花费的时间只需要第一个的十分分之一。\n\
  \n## 处理数组索引\n\n现在假设我们想将 `x` 值改为 `-90 : 0.1 : 90`。通过第二组命令，我们可以轻松地实现这一更改。修改后的代码出现在以下行中。\n\
  \n```matlab\nx2 = -90:0.1:90;\ng2 = 2*x2.² + 5*x2 - 3;\n```\n\n我们使用变量 `x2` 和 `g2`\
  \ 主要是为了强调我们有不同的代码。像这样修改代码没有问题。\n\n但是，如果我们按照原始的方法（使用 `for` 循环）来做，该如何更改范围呢？也许我们只是正尝试向现有程序中添加\
  \ `g(x) ==`，并且无法去掉 `for` 循环，例如在帮助别人更改代码时。出于某种原因，假设我们想要如下代码。\n\n```matlab\nfor x\
  \ = -90:0.1:90\n    g(x) = ...\n```\n\n我们无法为 `g(x)` 赋值，因为 `x` 将是负数、非整数、零以及正数。虽然\
  \ MATLAB 允许数组索引为双精度浮（例如 `g(1.0) = ...`），但它不允许非整数如 `g(1.1) = ....`。我们该如何处理这种情况？一个简单的解决方案如下，我们使用另一个变量作为索引。\n\
  \n```matlab\nindex = 1;\nfor x2 = -90:0.1:90\n    g2(index) = 2*x2² + 5*x2 - 3;\n\
  \    index = index + 1;\nend\n```\n\n通过 `index` 变量，我们始终可以访问数组。\n\n## 核心要点\n\n从讨论中可以得出几点结论：\n\
  1. 首先，MATLAB 处理数组和矩阵非常高效，因此尽可能用数组或矩阵代替循环。\n2. 其次，使用 `tic` 和 `toc` 测试代码是有帮助的。\n3.\
  \ 最后，创建一个变量作为索引是有意义的。\n\n## 总结\n\n本章介绍了数组和矩阵的示例。可以使用数组和矩阵作为参数。此外，矩阵元素可以通过行和列进行索引，冒号（:`）可以作为简写。我们还可以对矩阵进行数学运算。\n\
