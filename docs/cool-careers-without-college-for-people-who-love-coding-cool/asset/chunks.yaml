    ## INTRODUCTION

    With the high cost of college education, students will want to look at all options
    before having to take out a student loan. But our world is more fast-paced and
    competitive than ever before, and technology seems always to be changing. From
    tablets to computers to mobile phones, we are connected to the rest of the world.


    How connected? A 2015 study found that 64 percent of American adults own a smartphone,
    a huge leap from 35 percent in 2011. What are we doing on our phones? We are using
    them to learn and share with others. The same study found that 68 percent of smartphone
    users use their phone at least occasionally to follow news; 67 percent use their
    phones to share photos, videos, or commentary about events; and 56 percent use
    their phones to learn about activities.


    ![](images/f004-01.jpg)


    This instant mobile connection is important to us. And there are people behind
    these devices—designing, building, experimenting, and performing important jobs
    that few people think about when they download an app or take a picture.


    A career in tech often doesn’t need a college degree. While there are many colleges
    and institutions that offer coding degrees, certificates, and programs, often
    they aren’t necessary. Companies are often looking for experience, not a formal
    education. With so many resources online, it’s easy to learn without having to
    pay tuition. Online courses can provide week-by-week instruction. Nanodegrees
    are six-to-twelve month courses that teach basic coding skills at a low cost.
    Boot camps are ways to learn quickly in a short amount of time, and internships
    allow you to learn on the job. They are just some of the resources available as
    you learn not only how to code but what specific job you want to perform with
    your skills.


    Because technology is a part of so much of our lives—from paying our bills on
    our phone to talking to a friend in another country—there is a wide variety of
    jobs that suit a wide variety of people. Are you artistic? You could go into design.
    Like to keep systems up date? A system administrator job could be right for you.
    Do you have a clear vision and strong leadership skills? Product managers are
    always needed for keeping projects on course. New innovations come with new jobs,
    so the sky’s the limit.


    We can’t cover every coding job available in this resource, so use this as a tool
    to give you an idea of specific areas of coding and the technology industry that
    are possible to explore. When you read about a career that interests you, use
    the For More Information sections as well as the internet to learn more about
    that career and other careers that focus on similar aspects of coding. As you
    go through the different careers, you’ll see a common theme: networking, taking
    online courses and tutorials, and working on your own projects will take you far.
    Because of this, people with a lot of self-discipline who can work on projects
    without needing someone to manage them will be best suited for most of these careers.
    You will also see that as you progress through the resource, entry-level careers
    can lead to careers that require more experience. So while you may start as an
    iOS developer, you might use that to become a product manager one day.


    ## CHAPTER 1: UX DESIGNER

    Do you like color? Design? Art? The way an app looks when you open it? User experience
    designers, or UX designers, are the ones who concerned with how the digital product
    looks and feels to the user. Every app you use—from messaging your friends to
    checking the weather before you go out to dinner—requires a UX designer.


    UX designers focus on how the user interacts with the application or product and
    how the application is laid out on the screen. The goal is a product that not
    only performs its intended function but also feels easy to use and interact with.


    ![](images/f0008-01.jpg)


    User experience can be an artistic career. People who like being creative and
    coming up with lots of designs may enjoy creating the look of a product.


    ### THE JOURNEY OF A USER INTERFACE

    When designers first start out, they need to know what their objective is. How
    do they want to have a person interact with the product? What does this screen,
    or interface, need to look like? How does it need to function? Often this is a
    brainstorming session involving other team members, where a list of what the consumer
    needs from the product is generated.


    From there, a designer might make sketches on paper to rough out what the interface
    might look like. After a rough sketch, a designer will go to the computer and
    build a wireframe, or a digital test of the design. There may be many wireframes;
    some can be just stationary. Others will be interactive designs that can be tested
    and tweaked over and again. These wireframes are constantly tested by users, and
    their feedback allows the designer to make changes to the interface. With each
    wireframe, the complexity grows. Designers need to be open to critique and be
    able to communicate at this stage.


    The visual design comes next. Wireframes are given the final colors, typography,
    and added design elements to become mock-ups. Mock-ups should look and feel like
    they’re ready to be used, but this is another stage of testing, critique, and
    reworking. Colors may need to be altered; logos may need to go through several
    designs until the team settles on the right one.

