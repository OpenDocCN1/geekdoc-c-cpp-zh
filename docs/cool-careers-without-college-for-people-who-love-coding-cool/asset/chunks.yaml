    ## Chapter 6


    ### GAME DEVELOPER


    In 2015, gaming became a $23.5 billion industry. Console games, online games,
    and mobile games alike are all enjoyed by millions of people. More than ever,
    the industry is looking for programmers and coders who can help bring games to
    the market. And with platforms like Steam, it’s become easy to build, publish,
    and distribute your own games.


    Part of the video game industry’s popularity lies within its wide variety. Now
    games are no longer just played on a video game console or handheld gaming device,
    but on phones and tablets. There are games for Mac, Android, Facebook, and other
    online sites. With so many options, there are just as many different coding languages
    and platforms for you to learn. So make sure that you do some research before
    deciding on what type of developer you’d like to be.


    ![](images/f0058-01.jpg)


    With lots of studying and hard work, a love of video games can transform into
    a career where you help create them.


    Many different schools offer programs for game development, but these programs
    often come with high costs. Like other type of companies we’ve looked at, a game
    company is looking more for experience than a degree. There are a variety of online
    courses and tutorials available to learn various coding languages and platforms.
    Once you know what kinds of games you’d like to develop, enroll in the right course
    or courses for you. If there are other students, make sure to talk to them and
    connect. The game industry, like so many of our other careers, runs on networking.
    Friends are invaluable; you can talk through problems, help each other with projects,
    and refer one another for job openings.


    As you learn more programs, make sure to use these new skills to create new games.
    As a game developer, your portfolio will help you find work, so you want to have
    projects available to show how much you know and can do. Work on other people’s
    projects and make sure to take internships when possible.


    ### BEWARE OF CRUNCH TIME


    Video games have to be out on time, so when a game nears its release date, the
    team working on it often go into what the industry calls “crunch time.” This form
    of overtime often does not have overtime pay, but it will have one thing: long
    hours. Some days during a crunch can be over twelve hours, with six days working
    and only one day off. It’s a stressful, tiring period for a team releasing a game.


    ![](images/f0061-01.jpg)


    Crunch time can mean spending weekends at the office with your team in order to
    finish building a game on time.


    The video game industry has recently come under fire for the practice of crunch
    because of the extreme strain on workers. Always be aware that if you work in
    the video game industry, you’ll most likely have to go through a crunch time and
    that long hours paired with little sleep can and will affect your physical and
    mental health. There are numerous articles online chronicling the problem of crunch
    in the industry and the effect is has on people and their families that are worth
    reading to understand how difficult working in the video game industry can be.
    This job may not be for you if you value flexible hours and the ability to take
    time off.


    ## VIRTUAL REALITY AND OCULUS RIFT


    In 2012, the future came in the form of a Kickstarter campaign. The Oculus Rift
    was the first virtual reality headset to be affordable enough for the everyday
    gamer, and it promised a completely immersive experience for campaign backers.
    The Kickstarter was quickly funded, and the company, Oculus, became immensely
    popular. Virtual reality, a technology often remembered as an awkwardly large
    pair of goggles and gloves and crude graphics during the late 80s, was suddenly
    being explored by companies like Google.


    But while the Rift was supposed to be for gamers, virtual reality has quickly
    become considered the future for other industries. The immersive experience of
    virtual reality, or VR, makes it useful in many different ways. Designers have
    already found ways to use VR to create 3D to-scale designs of houses and various
    infrastructures that they can walk through and examine closely in VR before even
    building. Video conferencing could soon bring everyone in a meeting from different
    parts of the world all together in one place. Teachers could one day have students
    use headsets to interact with simulated events and scenarios, allowing them to
    experience a part of history or solve a complex problem. And for doctors, VR and
    scanning technologies could be a window to look inside a body before even perform
    surgery. Time will tell how we use VR in non-gaming industries.


    ### PAY AND PROSPECTS FOR GAME DEVELOPERS


    The video game industry is booming. Due to many people’s desire to work in video
    games, it may take awhile to get your foot in the door. With so many people applying
    for the same position, you have to have a portfolio and résumé that stand out.
    At many companies, it can sometimes be a matter of who you know who can recommend
    you for the job, which ties back into game developer’s need to network and make
    friends. Attending conferences like the Game Developers Conference, GDC, can also
    be beneficial as many companies have booths and are open to portfolio reviews.


    ![](images/f0063-01.jpg)


    Every year companies announce and unveil the new games they are developing to
    the public at GDC.


    The pay for a game developer is generally good and allows a developer to live
    a comfortable life. The actual amount depends on a number of factors. Some developers
    are full-time while others can be just contract-based. While contract work may
    initially seem to pay more, be aware that you have to pay your own taxes with
    freelance work and that you need to set some of your payment aside to have enough
    money to do so come tax season.


