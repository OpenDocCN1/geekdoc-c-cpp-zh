    ***Chapter 2: SYS ADMIN***


    System administrators, or `sys admins`, are in charge of making sure a computer
    system is maintained within a company. They are a vital part of any organization,
    helping it to run smoothly and stay connected with customers, partners, and employees.


    ![](images/f0018-01.jpg)


    Companies depend on `sys admins` to keep their systems running and solve any issues
    that suddenly occur. Problem-solving skills are definitely needed!


    This is a job that can have a wide range of responsibilities, depending on the
    size of the company and its needs. Some companies may be smaller and have only
    a few computers and programs to be kept updated, while much larger—even international—companies
    have hundreds of employees and computers that need to be constantly kept up to
    date. Depending on the industry the company does business in, special software
    and hardware may be needed in order for the organization to perform optimally.
    Some sys admins may need to be familiar with certain routers, networking systems,
    and enterprise communication systems.


    # BUILDING, REPAIRING, REBOOTING


    A `sys admin` may also be in charge of the organization’s hardware. Any new equipment
    purchased may have to be cataloged and added to the inventory, and given any necessary
    software installations. Broken equipment may need repair, or entirely new equipment
    may need to be built from scratch.

