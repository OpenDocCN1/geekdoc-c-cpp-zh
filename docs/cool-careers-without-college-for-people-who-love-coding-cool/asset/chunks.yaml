    ## Chapter 8: DevOps Developer


    ### Communication between IT and development doesn’t always happen. With so many
    stages in a product’s development, roles and teams can become “siloed,” or isolated
    from one another. Because of this lack of communication, the project or product
    may struggle to come together. The project’s production speed may slow and become
    inefficient. Enter development operations, or DevOps. DevOps is a culture of philosophies
    and best practices that revolves around breaking down these silos and creating
    tools that speed up the process of product development. The goals of DevOps are
    optimization, or making things run at peak efficiency; rapid delivery, or the
    ability to release new features or fix bugs quickly; reliability; scalability,
    also known as the ability for a product to take on a bigger workload; collaboration;
    and security.


    People who enter DevOps are people who are best at juggling many tasks at the
    same time. Because their goal is to increase optimization, they have to be able
    to work and address many problems a project faces. Developers build tools that
    help achieve the six goals, collaborate with others, manage data, help with testing
    and deployment, and work across team borders. DevOps engineers are focused on
    the business outcomes of the project and helping the project reach its goal quickly.
    They are problem solvers who focus on how they can make things run quickly and
    smoothly, and they can work well with multiple groups of people. They can code
    and script, and enjoy learning about new cutting-edge tools and technologies.


    ![](images/f0078-01.jpg)


    Donovan Brown is a senior development manager for Microsoft. He spoke at the Microsoft
    Developers Build Conference in San Francisco, California.


    ### How to become a DevOps Developer


    Becoming a DevOps developer is similar to becoming a QA engineer. This is a career
    that does not require a degree, but it does require previous working experience
    before you’re able to enter it. A DevOps developer needs to know many skills,
    including some IT operations, have an understanding of coding in at least one
    language, and have the ability to use and build tools. Because of this, it may
    be easier to learn another career that touches product development and expand
    your knowledge as you work within another role. There are many books, tutorials,
    and online resources for someone interested in a DevOps career and many people
    online that are available to give advice. Reading about and learning new systems
    and coding languages, as well as how to work with many tools and open-source software
    development products, are essential steps.


    Someone who wants to work in DevOps should seek out projects that others are creating
    that need someone in a DevOps role. Working with other people on projects, much
    like other engineer and developer jobs, allows you to develop the professional
    skills you need in the DevOps field. Once completed, these projects can go on
    your résumé or in your portfolio, allowing you to use them as examples of work
    you’ve done when interviewing for DevOps jobs and to explain the different processes
    you used in order to get results. This is why networking within tech, through
    online sites and in-person meetups, continues to be important. You don’t know
    if the next person you meet may be your future team member.


    ## Tools, tools, and more tools


    A DevOps developer is expected to know how to use many different types of tools.
    These tools are often free to download and use, which makes the process of learning
    and understanding multiple tools easier. Some tools can be as simple as messaging
    platforms that allow greater communication across a project, while others can
    be more complex and assist in developing, testing, and delivering software.


    Sometimes developers come across a problem they must solve where there isn’t a
    tool readily available to download, and they may find themselves creating their
    own tools. Pain points, or problems, may be specific and unique to your project
    and no one else has experienced them. Problems can even be specific to individual
    teams and the stage of the build they are working on. You’ll be called upon to
    use your problem-solving skills and creativity with code to develop tools to address
    these issues. And if you can’t create a tool yourself, you’ll need to reach out
    and collaborate with others on your project who can help you problem solve and
    create the tool you need.


    Automation tools are one of the more important tools that DevOps developers needs
    to have in their digital tool-belt. These tools allow for testing of software
    applications at any time, repeatedly, without a DevOps developer having to be
    present. These tests are rapid, with each outcome stored and compared to the last
    one. This allows developers to be able to review the data from these multiple
    tests quickly and efficiently. With this data, they can make the proper adjustments
    to the software, improving the quality and fixing bugs. Automation tools cut down
    on time and work, and companies look for DevOps developers who know how to use
    them on projects.


    ### DevOps developer pay and prospects


    DevOps is the role that originated from some of the biggest, most successful companies
    in Silicon Valley. Companies like Amazon, Google, and Facebook were the first
    companies to embrace DevOps. Because more well-known companies praise this field,
    DevOps has spread throughout the tech industry. Companies are eager to streamline
    and optimize their production process, so DevOps developers can find themselves
    in demand. Salaries for DevOps developers are competitive, and in areas like Silicon
    Valley, developers can find themselves making well above the national wage.


    Because this field is similar to QA engineering, people interested in DevOps needs
    to ask themselves if the hard work developing multiple skills and the time spent
    working in another field is worth pursuing this field. Youll need discipline,
    focus, and patience to succeed in becoming a DevOps developer, so this job may
    not be for everyone.


    ![](images/f0083-01.jpg)


    The biggest companies in tech need skilled, experienced DevOps developers working
    for them in order to keep their sites running smoothly.


