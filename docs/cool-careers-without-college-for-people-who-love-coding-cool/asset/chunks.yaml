- fmt: '

    A developer for either iOS or Android will find themselves in a large, fast-paced
    job industry with many types of projects that cater to every interest. Do you
    like working on finance applications? Messaging apps? Shopping apps? As a developer,
    you can choose what you’re drawn to and focus on that category. There is a wide
    variety of applications, so if you like exploring and trying new projects, this
    could be for you.


    Your education is easy to access as a developer. Android and Apple host their
    own courses and resources, giving developers immediate access to the tools and
    training they need to learn. Beyond the operating systems themselves, there are
    many courses, books, tutorials, nanodegrees, and blogs that provide a wealth of
    knowledge. Paying for training and education is unnecessary, but paid training
    can open up additional resources for you to use, so you may take it into consideration.
    Researching paid resources is important as they can be priced from a few dollars
    to several hundred and provide various types and amounts of training and information.


    People who develop for iOS and Android are builders. They want to take a concept
    that solves a problem and use tools to turn that concept into a working product.
    They understand that mobile devices are constantly receiving software updates
    and that their product is never truly finished; it will constantly have to have
    patches, fixes, and upgrades to meet the demands of a phone or tablet’s everchanging
    OS. As developers, they’re often one person on a team that is frequently collaborating
    and sharing ideas and critique. This might be the career for you if you enjoy
    teamwork and working closely with others.


    # APPLE OR ANDROID?


    **Some developers strive to learn both iOS and Android. Both operating systems
    account for 96.7 percent of the global market. But when you’re starting out, it
    can be hard to decide which operating system, also known as an `OS`, to learn
    first.**


    **The operating system for Apple mobile devices is iOS. This `OS` has much stricter
    criteria than Android. Because it’s only available for Apple products, you can
    work only on iOS projects on Macbooks, as the tool set `Xcode` is Mac compatible
    only. For those who can’t afford or make time to borrow a Mac, this can be a hurdle.
    Apple also requires developers to subscribe to a developer program, which allows
    them to submit apps to the app store. The subscription includes a yearly fee.**


    **Android’s development tool, `Android Studio`, is compatible with Mac, Linux,
    and Windows computers. But while Android beats iOS accessibility, `Android Studio`
    lacks some features and functionality that `Xcode` has available for developers,
    making it more difficult to create applications. While there is no subscription
    fee with Android, there is a one-time registration fee before you can submit an
    app.**


    ![](images/f0031-01.jpg)


    Choosing what operating system to learn first is up to you, just remember each
    one has its pros and cons.


    # FLEXING YOUR HACKATHON MUSCLE


    Like many other careers, you can show off your talent at a hackathon for iOS or
    Android developers. Local hackathons can be found through your local developer
    communities and online meetup groups, and they are a great way to grow as a developer
    as they all start with a problem you must address. They allow you to flex your
    problem-solving skills and challenge yourself in ways you can’t on your own. Judges
    will go over your final product, and you’ll gain valuable feedback you can apply
    to your product or future products. The products you develop can then go in your
    portfolio and résumé, giving you new material to show potential employers.


    ![](images/f0032-01.jpg)


    Meet fellow developers and practice your skills at hackathons, where you can compete
    for prizes, cash, and the ability to advance into bigger competitions.


    You may not even have to seek out employers at a hackathon. People looking for
    developers to hire may see your project and approach you. For an employer, a hackathon
    is a good place to look at developers and see how they work under pressure as
    well as how they creatively solve a problem. Carry some business cards with you
    because you never know who will want to talk to you over lunch or via email.


    If you win the hackathon, you may receive a large cash prize, hardware, and invitations
    to more prestigious hackathons. This allows you to continue to practice, earn
    money, and be visible to potential employers. The more prestigious and exclusive
    a hackathon is, the greater the prizes, exposure, and access to companies will
    be. This is why competing in hackathons and using them to improve your skills
    as a developer is an important exercise for you to use.


    # JOB OPPORTUNITIES AND PAY FOR A DEVELOPER


    With so many apps not just in the app stores but in production waiting to be launched,
    iOS/Android developers with strong portfolios are in high demand. A typical salary
    will be on the higher end of the pay scale with room for raises as you grow in
    experience. But a developer’s pay will vary wildly depending on whether or not
    the developer is a freelancer or a full-time employee. Remember, a freelancer
    does not have taxes deducted automatically, so while it may seem like a lot, be
    sure to set aside some of your earnings to pay your taxes at the beginning of
    the next year.


    ## FOR MORE INFORMATION


    ### ORGANIZATIONS


    **ACT: The App Association**

    1401 K Street NW, Suite 501

    Washington, DC 20005

    (202) 331-2130

    Website: [http://actonline.org](http://actonline.org)


    This association represents app companies and firms to fuel job creation and expand
    the application industry and mobile economy.


    **App Developers Alliance**

    1015 7th St NW

    Washington, DC 20001

    Email: [Membership@AppAlliance.org](mailto:Membership@AppAlliance.org)

    Website: [http://www.appdevelopersalliance.org](http://www.appdevelopersalliance.org)


    This international association seeks to bring together developers and companies
    and be an advocate for application developers.


    **Mobile Developers of Berkeley**

    2360 Ellsworth Street, Apt. F

    Berkeley, CA 94704

    (425) 633-4156

    Website: [http://www.mobiledevs.org](http://www.mobiledevs.org)


    This is a Berkeley-based community for mobile developers.


    ### BOOKS


    Eyal, Nir. *Hooked: How to Build Habit Products.* New York, NY: Portfolio, 2014.


    Keur, Christian. *IOS Programming: The Big Nerd Guide. 5th ed. Atlanta, GA: Big
    Nerd Guide, 2015.*


    Phillips, Bill. *Android Programming: The Big Nerd Guide.2nd ed. Atlanta, GA:
    Big Nerd Guide, 2015.*


    ### WEBSITES


    Because of the changing nature of internet links, Rosen Publishing has developed
    an online list of websites related to the subject of this book. This site is updated
    regularly. Please use this link to access the list:


    [http://www.rosenlinks.com/CCWC/coding](http://www.rosenlinks.com/CCWC/coding)


    # CHAPTER 4


    ## FULL STACK DEVELOPER


    A company needs a developer who knows the front end of a website as much as the
    back end. It needs someone who’s fluent in most of the major programming languages
    and can bridge the gap between the front end development and the back end. A full
    stack developer is adept at working in many types of frames and working between
    the front end and back end of a product. Knowing the languages of both front and
    back end allow a full stack developer to bridge the gap between the two. All front
    end developers should know some back end coding, and visa versa, but being fluent
    in both means a full stack developer can understand, create, and problem solve
    on both sides. If you have an attention to detail and you like problem solving,
    being a full stack developer might be for you.


    Developers use programming languages to communicate instructions to a machine.
    Every action must be delivered specifically through programming.


    # FRONT END VS. BACK END


    **Which is which and what do they do?**

