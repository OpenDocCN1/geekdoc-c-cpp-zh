    ## Chapter 7


    ### QA ENGINEER


    Someone has to make sure the product you’re building is up to snuff. A quality
    assurance engineer, or QA engineer, follows the product throughout all of its
    phases and has a deep understanding of programs as well as the desire to learn
    new ones. The job of a QA engineer is to oversee from start to finish that the
    product maintains the high quality the team is striving for and that it arrives
    on time and on budget.


    QA engineers are involved with many aspects of a product’s development. They will
    help write and review code, help with design and integration, and oversee management
    processes. In the end, they will test the product rigorously, searching for bugs
    and glitches, and pushing the product to its breaking point. They must make sure
    that the product meets all company and government guidelines and that in the end
    it also fits the needs of the customer. When a project is running late, a QA engineer
    often stays later with the team, making sure deadlines are met. Often, resources
    may be running short, and a QA will have to come up with creative solutions for
    the restraints the project comes up against.


    ![](images/f0068-01.jpg)


    Quality assurance engineers must pay strong attention to details as well as be
    able to multitask and juggle multiple parts of a project with ease.


    ### GOOD COMMUNICATION


    With so many different teams, stages, and goals to keep track of, communication
    is key. A good QA engineer understands that in order to make sure everything runs
    smoothly, teams need to be unified and aware of what is going on outside of their
    roles. Developing a good communication infrastructure is important, as is knowing
    how to communicate and check in on people and teams in a business environment.


    A QA engineer will want to make sure everyone understands their role within the
    project as well as make sure everyone knows how to communicate with their QA as
    well as other teams. Setting up weekly, biweekly, or monthly progress meetings
    is also key. These allow the entire team to get an overview of what stage the
    project is in and whether or not it’s hitting its goals. These progress meetings
    can be as simple as an in-office meeting or as complex as a video-call with employees
    from all over the globe.


    With so many roles and steps to keep track of, QA engineers need to be master
    planners. They need to break down everything into smaller, more manageable goals
    that can be met, giving each stage and task a different deadline. This allows
    them to keep track of the entire process and assures that the product will hit
    its final deadline. Because of the need to constantly keep track of so many details
    and stages, being a QA engineer may suit someone who is organized, has an attention
    to detail, and enjoys organizing large projects. It may not be suitable for those
    who prefer to work without any kind of schedule.


    ### HOW TO BECOME A QA ENGINEER


    Because a QA engineer has so many different responsibilities, the path to becoming
    one is less about learning through instruction and more about learning through
    experience. While you can seek out degrees in quality assurance, studying books
    and online resources allows you to develop hands-on training. QA engineers should
    already have some experience in coding languages and frameworks. Ideally, they’ve
    already worked on other projects as an engineer, so other careers in this book
    may prove to be stepping stones on the path to becoming a QA engineer.


    Working on other products also allows you to gain experience working with others
    as well as seeing all of the stages of a product’s development. As an aspiring
    QA designer, you can develop an understanding of what a product needs and how
    things should be broken up and managed. Consider becoming an iOS or Android developer,
    a UX designer, or any other one of the careers that touch products during development.
    Remember to take the time to weigh the pros and cons of each career and what type
    of products you would eventually like to be a QA engineer for.


    QA engineers may also want to study communication. When working with many different
    people, they need to be able to speak clearly and concisely, work well under pressure,
    and be able to explain what goals or issues the product may be facing. Being able
    to compose well-written, professional emails and reports is an important skill
    to have, so someone looking into becoming a QA designer may want to take the time
    to practice their writing skills.


    ![](images/f0073-01.jpg)


    You’ll never be working by yourself as a QA engineer. You need to be able to communicate
    clearly to many people working on the project.


    ### PAY AND PROSPECTS FOR QA ENGINEERS


    We’re a country that is constantly innovating and developing new products. Because
    of this, companies need QA engineers in order to keep projects running on time
    so they can be delivered to consumers. QA designers are needed wherever technology
    is being designed, so certain cities will need QA engineers more than others.
    Expect to be paid well, with the ability to earn more as you gain experience.


    Because this is a career where you need to not learn many skills but also work
    in another career before making a transition into becoming a QA engineer, take
    the time to consider if this career is right for you. You will have to have the
    patience to learn, work, and develop the skills you need, which can take several
    years.


