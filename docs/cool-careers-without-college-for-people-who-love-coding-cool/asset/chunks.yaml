    ## GLOSSARY


    - **BACK END**: The systems that power a product. Servers, databases, and applications
    that keep everything smoothly.

    - **BLEEDING EDGE**: Technology that is so new it’s still developing and considered
    risky.

    - **BLOCKCHAIN**: The decentralized security technology behind cryptocurrencies
    that operates on a network of users.

    - **CRUNCH**: A period of time when a deadline for a product is near and employees
    are expected to work overtime, often without overtime pay.

    - **CRYPTOCURRENCY**: A secure system of digital transactions protected by a security
    technology called blockchain.

    - **CUTTING EDGE**: Advanced and innovative technology.

    - **DATA ANALYST**: A person who takes data and cleans, processes, and breaks
    into small, digestible forms. Data analyzation is about the exploration of data.

    - **DATA SCIENTIST**: A person who focuses on taking data and explaining the past,
    problem solving the present, and strategizing the future.

    - **DEVELOPER/ENGINEER**: A person who creates and builds software and programs.

    - **DEVOPS**: Development operations.

    - **FRONT END**: The portion of a product that the customer interacts with.

    - **FULL STACK**: Both the front end and the back end of a product.

    - **HYPE CYCLE**: A period of rapid expansion and growth in users and popularity;
    a more extreme version of a bubble period.

    - **IOS**: Apple’s mobile operating system.

    - **MACHINE LEARNING**: The ability for a computer to learn without being programmed
    to do so.

    - **NEURAL NETWORKS**: A certain type of machine learning that is designed to
    mimic the neural network of the brain.

    - **PRODUCT LIFE CYCLE**: The stages of a product’s build from start to finish.

    - **SYS ADMIN**: System administrator.

    - **UX**: User experience.


