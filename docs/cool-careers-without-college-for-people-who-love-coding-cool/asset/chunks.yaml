    ## 第 8 章：DevOps 开发者


    IT 与开发部门之间的沟通并不总是发生的。由于产品开发过程中有许多阶段，角色和团队可能会变得“孤岛化”，即彼此孤立。由于缺乏沟通，项目或产品可能难以形成整体。项目的生产速度可能会变慢并变得低效。这就是开发运维，即
    DevOps 的使命。DevOps 是一种哲学和最佳实践的文化，核心是打破这些孤岛，并创建加速产品开发过程的工具。DevOps 的目标是优化（或让事物以最高效率运行）、快速交付（或快速发布新功能或修复漏洞的能力）、可靠性、可扩展性（也称为产品承担更大工作负载的能力）、协作以及安全性。


    进入 DevOps 领域的人是那些最擅长同时处理许多任务的人。因为他们的目标是增加优化，他们必须能够工作并解决项目面临的许多问题。开发者构建帮助实现这六个目标的工具，与他人协作，管理数据，协助测试和部署，并跨团队边界工作。DevOps
    工程师专注于项目的业务结果，并帮助项目快速实现目标。他们是问题解决者，专注于如何让事物运行得快速顺畅，并且能够与多个小组良好地合作。他们可以编写代码和脚本，并喜欢学习新的尖端工具和技术。


    ![](img/f0078-01.jpg)


    Donovan Brown 是微软高级开发经理。他曾在加利福尼亚州旧金山的微软开发者 Build 大会上发表过演讲。


    ### 如何成为 DevOps 开发者


    成为 DevOps 开发者与成为 QA 工程师类似。这是一项不需要学位的职业，但在进入该领域之前以前的工作经验。DevOps 开发者需要掌握许多技能，包括一些
    IT 运维、对至少一种语言的编码有理解，以及使用和构建工具的能力。因此，学习另一个触及产品开发的职业，并在另一个角色中工作时扩展你的知识可能会更容易。对于对
    DevOps 职业感兴趣的人来说，有很多书籍、教程和在线资源，网络上也有许多人可以提供建议。阅读和学习新系统和编码语言，以及如何使用许多工具和开源软件开发产品，是必不可少的步骤。


    想要在 DevOps 工作的人应该寻找他人正在创建的、需要 DevOps 角色的项目。与他人合作完成项目，与其他工程师和开发人员的工作一样，可以让你培养出
    DevOps 领域所需的专业技能。项目完成后，这些项目可以放入你的简历或作品集中，让你在面试 DevOps 工作时将它们作为你所做工作的示例，并解释你为了获得结果而使用的不同流程。这就是为什么在技术领域内通过在线网站和线下聚会建立人脉持续保持重要性。你不知道你遇到的下一个人是否可能是你未来的团队成员。


    ## 工具、工具以及更多工具


    DevOps 开发者被期望知道如何使用许多不同类型的工具。这些工具通常免费下载和使用，这使得学习和理解多种工具的过程变得更容易。某些工具可能简单如允许项目内部更大通信的消息平台，而另一些工具可能更复杂，协助软件的开发、测试和交付。


    有时开发者会遇到必须解决的问题，但没有可供下载的工具，他们可能会发现自己正在创建工具。痛点或问题可能是你项目特有的，其他人没有经历过。问题甚至可能针对特定的团队以及他们正在处理的构建阶段。你会被要求运用问题解决能力和代码方面的创造力来开发工具以解决这些问题。如果你不能自己创建工具，你需要与项目中的其他人协作，他们可以帮助你解决问题并创建你所需的工具。


    自动化工具是 DevOps 开发者数字工具箱中较重要的工具之一。这些工具允许随时反复对软件应用程序进行测试，而不需要 DevOps 开发者在场。这些测试是快速的，每个结果都存储并与上一次进行比较。这允许开发者能够快速高效地查看这些多次测试的数据。通过这些数据，他们对软件进行适当调整，提高质量并修复漏洞。自动化工具减少了时间和工作，公司寻找知道如何使用工具的
    DevOps 开发者。


    ### DevOps 开发者的薪资与前景


    DevOps 是源自硅谷一些最大最成功公司的角色。亚马逊、Google 和 Facebook 是最早采用 DevOps 的公司。由于更多知名公司推崇这一领域，DevOps
    已遍及整个技术行业。公司渴望简化并优化其生产流程，因此需要 DevOps 开发者。DevOps 开发者的薪资很有竞争力，在硅谷等地区，开发者的收入高于高于平均水平。


    由于该领域与 QA 工程相似，对 DevOps 感兴趣的人需要问自己开发多种技能的努力以及在另一个领域花费的时间是否值得追求。成为 DevOps 开发者需要纪律、专注和耐心，因此这份工作可能并不所有人。


    ![](img/f0083-01.jpg)


    科技领域最大的公司需要熟练、经验丰富的 DevOps 开发者为他们工作，以保持其网站顺畅运行。


