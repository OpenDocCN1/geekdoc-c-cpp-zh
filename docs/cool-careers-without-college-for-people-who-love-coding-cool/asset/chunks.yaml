    speeds, and a SAN admin needs to be able to maintain this network’s security and
    efficiency as well as trouble shoot any issues that may arise.**


    A sys admin needs to make sure this vital data is kept safe. A routine task is
    backing data up and making sure that there is enough space in a company’s system
    to capture and store that data. For many companies, that space is in a commercial
    data storage service like Amazon Web Services. But in some instances, a company
    can have its own servers. Sys admins need to be comfortable with maintaining these
    servers and understand the physical requirements of a server when companies want
    to have their storage on site rather than in the cloud.


    Data storage can go back years, allowing a company to keep detailed records of
    events for legal purposes. So the data that is stored needs to be easily searched
    and sorted. Sys admins who are highly detail-oriented will help their companies
    stay organized.


    **HOW TO BECOME A SYS ADMIN**


    Depending on the requirements being sought by a company, a sys admin can be well
    compensated. Some employers do look for a four-year degree in computer science,
    but often experience working in the field is just as valuable.


    When you are just starting out, online resources are helpful and plentiful. Windows
    allows you to receive training for free, while open source systems like Linux
    have multiple guides published. Networking with other


    system administrators and reading about enterprise-level software and hardware
    can help you learn. Becoming certified to maintain certain pieces of hardware
    and software can also make you a desirable candidate. Because there are so many
    different types of certifications for different operating systems and programs,
    it’s best to decide what you’re interested in learning before choosing any one
    certification program.


    ![](images/f0024-01.jpg)


    Free online courses are available to help you develop the skills you need in order
    to become a sys admin.


    Your first couple of jobs may be small and more focused on home repairs for people
    who need IT assistance. But the more work you do, the more your résumé and experience
    will grow. Making contacts with other system administrators will help you know
    when potential jobs open up as well as give you people who can be your references.


