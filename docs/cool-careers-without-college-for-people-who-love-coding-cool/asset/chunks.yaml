    ## Chapter 10 CRYPTOCURRENCY DEVELOPER


    When Bitcoin came onto the scene in 2008, it put cryptocurrencies on the map.
    Whether you want to work for a cryptocurrency—or build your own cryptocurrency—this
    industry will become more vital as we use more and more digital transactions.


    Cryptocurrencies are important to digital transactions because they are incredibly
    safe compared to other digital forms of currency. As we shop more and more online,
    our credit cards and banking information are increasingly vulnerable to hackers.
    Large scale hacking scandals can take the personal information of thousands of
    people, putting their money and identities at risk. This risk is minimized by
    cryptocurrencies because they are decentralized, meaning the information is spread
    out among all of the users instead of kept in one location. This decentralized
    form of financial transactions is called `blockchain`, and it’s often considered
    one of the most important technological discoveries of our time, only second to
    the internet itself.


    ![](images/f0098-01.jpg)


    Bitcoin took the tech industry by storm and is now one of the biggest cryptocurrencies
    available. Are you interested in some of the newest technology emerging today?


    The transaction information of a `blockchain` is kept on a ledger. There is not
    just one copy of the ledger but instead multiple copies that are spread out across
    a network and kept on points called `nodes`. When a transaction is made, it’s
    recorded on this ledger, meaning there are multiple identical copies of the transaction.
    When the ledger is full, it is formed into what is called a `block`, which is
    secured by an encrypted code. Each `block` is connected to the block before it,
    so your current transactions are linked to the very first transactions ever made
    on the currency. This is what creates the chain of blocks the system is known
    for.


    But what makes this form of currency so safe is the fact that the ledgers are
    accessible to users. These users constantly cross-check the ledgers, which makes
    it incredibly difficult for a hacker to alter any part of the `blockchain` because
    any changes stand out against all of the copies in the network. Each transaction
    is transparent, and with so many people constantly checking and working together,
    any attempts of hacking are quickly spotted. Because of its security, block-chain
    transactions are incredibly quick as they do not need to have long security check
    periods.


    ### THE BLEEDING EDGE


    Everyone knows what cutting-edge technology is—the latest and greatest, the most
    advanced and innovative technology. Bleeding edge is something even newer than
    `cutting edge`; it’s technology that is so new it’s still considered a risk. Bleeding-edge
    technology could change the world, or it could fail and disappear. These types
    of technologies are so radical and unique, it takes time for people to understand
    them, and education is scarce because even experts are still learning how they
    work and how they can best be utilized. It can take several years for the technology
    to improve and be utilized by the public.


    Cryptocurrency is a technology that was recently considered `bleeding edge`. Taking
    the world by storm, it experienced a bubble in 2013 where the price of `bitcoins`
    skyrocketed and were at their peak $1000 per coin. This was considered a hype
    cycle, or a short period of time when the technology was in a rapidly growing
    bubble where people were excited and taking part.


    Within the last few years, `bitcoin` has settled and is no longer growing as quickly
    as it did when it was `bleeding edge`. However, the technology is still new, and
    jobs are still being discovered in this field. Always consider the pros and cons
    of entering a field that is new and still evolving, versus a field that is more
    established.


    ### HOW TO BECOME A CRYPTOCURRENCY DEVELOPER


    Cryptocurrencies and `blockchain` is such a new and open technology that it’s
    easy to find educational resources. Videos, articles, and papers are all available
    for free for anyone to watch, read, and gain a better understanding. Books and
    online courses are also available, with some courses being sponsored by large
    companies and Ivy League colleges.


    Developers should have an understanding of how the entire `cryptocurrency` system
    works. They can do this by signing up and purchasing some `cryptocurrency` and
    using it for transactions. Cryptocurrencies like `Bitcoin` have pages that explain
    how they work, allowing anyone to learn about its cryptocurrency and its different
    uses.


    Because `blockchain` and `cryptocurrencies` are just being implemented and explored
    by larger companies, someone interested in the industry needs to have a firm grasp
    of traditional coding and software building. This is because `blockchain` is often
    integrated into existing technologies and services, and newer products will need
    to be built upon common frameworks. So people interested in `cryptocurrencies`
    aren’t just learning about `blockchain`, they’re also learning multiple coding
    languages to bring `blockchain` to the rest of the tech world.

