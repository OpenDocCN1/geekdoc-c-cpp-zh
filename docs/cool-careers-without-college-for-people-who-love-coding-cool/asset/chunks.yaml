    由于互联网链接不断变化，Rosen Publishing 开发了一个与本书主题相关的在线网站列表。该网站定期更新。请使用此链接访问列表：


    `http://www.rosenlinks.com/CCWC/coding`


    ## 第 3 章：Android/iOS 开发人员


    随着越来越多的人使用移动设备，现在任何事情都有应用程序（简称 App）。从给朋友留言到支付账单、规划假期，甚至调整家里温度或调暗房间灯光，你现在可以在移动设备上完成这一切。截至
    2016 年 6 月，苹果的 App Store 超过了 200 万应用。这意味着你可以通过移动设备组织、执行和表达你生活中发生的一切事情。我们是一个连接的社会，而且我们将以这种方式继续增长。


    ![](img/f0028-01.jpg)


    数以千计的应用需要开发者团队将它们从想法变成可以在应用商店下载的产品。


