    ABOUT THE AUTHOR


    Asher Powell is a proud nerd and former tech industry professional who has previously
    worked in Silicon Valley as a social media marketer. He has attended a hackathon
    and listened to startup pitches over coffee. Now a writer, he enjoys telling stories
    and learning about the future of technology with his very fluffy cat by his side.


