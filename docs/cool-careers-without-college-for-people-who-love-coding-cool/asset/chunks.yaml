    regularly. Please use this link to access the list:


    [http://www.rosenlinks.com/CCWC/coding](http://www.rosenlinks.com/CCWC/coding)


    ***Chapter 4***


    ***FULL STACK DEVELOPER***


    A company needs a developer who knows the front end of a website as much as the
    back end. It needs someone who’s fluent in most of the major programming languages
    and can bridge the gap between the front end development and the back end. A full
    stack developer is adept at working in many types of frames and working between
    the front end and back end of a product. Knowing the languages of both front and
    back end allow a full stack developer to bridge the gap between the two. All front
    end developers should know some back end coding, and visa versa, but being fluent
    in both means a full stack developer can understand, create, and problem solve
    on both sides. If you have an attention to detail and you like problem solving,
    being a full stack developer might be for you.


    ![](images/f0037-01.jpg)


    Developers use programming languages to communicate instructions to a machine.
    Every action must be delivered specifically through programming.


    FRONT END VS. BACK END


    **Which is which and what do they do?**'
