    ## 第 7 章


    ### 质量保证工程师 (QA ENGINEER)


    必须有人来确保你正在构建的产品符合标准。质量保证工程师（或 QA 工程师）贯穿产品的各个阶段，对程序有深入的理解，并渴望学习新程序。QA 工程师的工作是从头到尾监督产品，确保其保持团队努力实现的高质量，并按时、按预算交付。


    QA 工程师参与产品开发的许多方面。他们将帮助编写和审查代码，协助设计和集成，并监督管理流程。最后，他们将对产品进行严格的测试，寻找漏洞和故障，并将产品推向它的极限。他们必须确保产品符合所有公司和政府的准则，并且最终符合客户的需求。当项目进度落后，QA
    工程师通常会和团队一起留晚，确保满足截止日期。通常，资源可能会短缺，QA 工程师必须为项目面临的限制提出创造性的解决方案。


    ![](img/f0068-01.jpg)


    质量保证工程师必须高度关注细节，并能够同时处理多项任务，轻松地兼顾项目的多个部分。


    ### 良好的沟通 (GOOD COMMUNICATION)


    有这么多不同的团队、阶段和目标需要跟踪，沟通是关键。一名优秀的 QA 工程师明白，为了确保一切运行顺畅，团队需要统一，并意识到自己职责之外正在发生什么。建立良好的沟通基础设施至关重要，知道如何在商务环境中与个人和团队进行沟通和跟进同样重要。


    QA 工程师希望确保每个人都理解自己在项目中的角色，并确保每个人都知道如何与他们的 QA 以及其他团队进行沟通。建立每周、双周或每月的进度会议也是关键。这些会议允许整个团队了解项目处于什么阶段，以及是否实现了目标。这些进度会议可以简单如办公室会议，也可以复杂到与全球各地的员工进行视频通话。


    由于有许多角色和步骤需要跟踪，QA 工程师需要成为大师级的规划师。他们需要将一切拆解为更小、更易于管理的目标，并为每个阶段和任务设定不同的截止日期。这允许他们跟踪整个过程，并确保产品能如最终截止日期交付。由于需要不断跟踪许多细节和阶段，成为
    QA 工程师可能适合那些有条理、注重细节并喜欢组织大型项目的人。它可能不适合那些喜欢在没有任何时间安排的情况下工作的人。


    ### 如何成为 QA 工程师 (HOW TO BECOME A QA ENGINEER)


    由于 QA 工程师有许多不同的职责，成为 QA 工程师的道路与其说通过指令学习，倒不如说通过经验学习。虽然你可以寻求质量保证学位，但学习书籍和在线资源可以让你获得实操训练。QA
    工程师应该已经具有某些编程语言和框架的经验。理想情况下，他们已经作为工程师参与过其他项目，因此本书中的其他职业可能会成为成为 QA 工程师道路上的垫脚石。


    从事其他产品的工作还可以让你获得与他人合作的经验，并看到开发的所有阶段。作为一名有志的 QA 设计师，你可以对产品需求以及事物应该如何拆分和管理建立理解。考虑成为
    iOS 或 Android 开发人员、UX 设计师，或任何其他在开发过程中接触产品的职业。记住花时间衡量每种职业的优缺点，以及你最终想成为哪类产品的 QA
    工程师。


    QA 工程师可能还想学习沟通。在与许多不同的人合作时，他们需要清晰、简洁地表达，在压力下良好工作，并能够解释产品可能面临的目标或问题。撰写良好的电子邮件和报告是一项重要技能，因此考虑成为
    QA 设计师的人可能花时间练习写作能力。


    ![](img/f0073-01.jpg)


    作为 QA 工程师，你永远不会独自工作。你需要能够与项目的许多人员进行清晰沟通。


    ### QA 工程师的薪资与前景 (PAY AND PROSPECTS FOR QA ENGINEERS)


    我们是一个不断创新和开发新产品的国家。因此，公司需要 QA 工程师确保项目按时交付给消费者。在技术设计的地方都需要 QA 设计师，因此某些城市对 QA 工程师的需求更多。预计薪资优厚，并随着经验的增加而增加。


    由于这种职业不仅需要不断学习许多技能，而且在成为 QA 工程师之前还需要从事其他职业，请花时间考虑这份职业是否适合你。你必须有耐心学习、工作并开发所需的技能，这可能需要多年。


