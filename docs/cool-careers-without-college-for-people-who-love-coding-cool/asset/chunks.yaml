    Communicating these internal and external pieces of the project is essential.
    This means not only being able to communicate them but also to be able to explain
    the product’s overall impact on business. This is where the third area, business
    sense, is needed. Project managers need to have a firm grasp of the business operations
    of the company and the market the product is a part of, and they need to be able
    to discuss it to others in the company, clients, partners, and users. Their business
    experience allows them to bring all of their knowledge forward and sell the project
    to everyone else.


    Experience with working on products in teams should be supplemented with learning
    more about how to become a product manager. There are many books and online resources
    that discuss how to product manage successfully. Learning to speak in public is
    important, as a product manager has to communicate with everyone who is not working
    on the product. Someone interested in product management may want to take a class
    on public speaking or on how to write and improve communication skills. They may
    also want to take classes or read books on management, team building, and conflict
    resolution.


    ![](images/f0114-01.jpg)


    Product managers are needed everywhere. Tatsuo Nomura is the senior product manager
    for the smash-hit mobile game Pokemon GO.


    To gain experience as a project manager, look to meetups and events like hackathons.
    Leading a small team in a hackathon competition will help you grow as a product
    manager and practice the leadership and team skills you need during a very short
    time frame. You can also be the team member that stands up and sells your product
    to the judges, explaining to them what problem you wanted to solve, how you solved
    that problem with your product, and giving them a demonstration of the product.
    With every hackathon you join and compete in, the more you can add to your résumé
    to show your skills as product manager.


    ## PAY AND JOB PROSPECTS FOR PRODUCT MANAGERS


    Product managers are needed for all sorts of projects. As our technology expands
    and grows, companies create more and more products to assist us in our everyday
    lives. Behind each product is a team, and leading each team is a product manager.
    Remember that before you become product manager, you’ll need experience working
    on projects within teams as a developer or designer and learn more before becoming
    a product manager. It may take a long time before you’re able to become a product
    manager, so you need to be comfortable working that beginning job. The path to
    being product manager can be longer than other careers in this resource, so it’s
    up to you to decide if this job is worth the time and patience.


