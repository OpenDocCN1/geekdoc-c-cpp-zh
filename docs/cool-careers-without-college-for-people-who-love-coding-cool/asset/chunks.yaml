    这就是数据科学家——统计学界的巨星们大身手的地方。通过获取原始数据并使用算法和数学进行处理，数据科学家在数字中发现故事和趋势。他们帮助大型零售商降低成本并提高销售，帮助公用事业公司预测使用模式，帮助公司专注于营销活动，并协助许多其他行业。数据科学家需要用每个人都能理解的语言来讲述这些故事，所以如果你是一个喜欢将复杂的想法和信息转化为更简单术语的人，那么这份工作可能适合你。


    ## 如何成为数据科学家


    目前对数据科学的需求很大，正因如此，该领域拥有高薪。其中最高的薪资达到六位数或更高，并授予拥有博士学位（PhDs）的数据科学家。然而，你不需要上大学就可以开始数据科学家的职业。


    成为数据科学家最简单但最昂贵的路线之一是线上和线下训练营。这些训练营的范围很大，从大规模的开放式课程到学生必须申请的高竞争性项目不等。然而，训练营提供了一个完整的、循序渐进的学习计划，这是你自己了解这一复杂领域的有用途径。这些训练营通常比其他形式的教育更贵，一些高级训练营的费用可能超过一万美元。因此，在研究你的教育计划时要小心。


    ![](img/f0048-01.jpg)


    内特·席弗（Nate Silver）是一位著名的数据科学家，以他对 2008 年和 2012 年总统选举的预测而闻名。他运营着一个名为 [FiveThirtyEight](http://eight.com)
    的统计分析网站。


    如果训练营不适合你，或者如果你想在进入项目之前加强知识，还有其他学习方法。对成为数据科学家感兴趣的人需要精通数学。统计学和代数是数据科学家必修的，但还需要理解微积分和逻辑等更高级的数学。`Coursera`
    等网站以及一些提供在线课程的大学可以教授这些科目，让你可以在无需完全进入传统大学的情况下推进你的数学学习。


    学习编程语言和框架也很重要。理解 `R`、`Python` 或 `SQL` 等编码语言以及 `Hadoop` 或 `Spark` 等框架，使数据科学家能够获取大量数据并提取相关信息，并构建信息在其他场景下如何运作的模型。


    这些知识也有助于数据科学家学习和理解机器学习。机器学习是计算机在没有被专门编程的情况下进行学习的能力。对于数据科学家来说，机器学习允许他们获取一组特定的信息并让计算机深入研究，提取出深处的数据。


    ## 数据科学家 vs. 数据分析师


    数据科学家和数据分析师听起来可能相似，但它们完全不同。那么，你该如何区分它们的区别呢？


    数据分析师获取数据并进行清洗、处理，将其拆分为小小的、易于理解的形式。数据分析是关于对数据的探索。


    数据科学家侧重于获取数据并解释过去、解决现在以及制定未来战略。


    所有这些更具技术性的方面——编码语言、框架和机器学习——都可以在网上找到。对于想要自学的人，有免费的教程、练习和资源可用。对于喜欢更有结构化内容的人，还有书籍、在线课程和微学位（nanodegrees）。


