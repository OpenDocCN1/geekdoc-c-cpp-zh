    DATA SCIENTIST VS. DATA ANALYST


    **Data scientists and data analysts may sound similar, but they couldn’t be more
    different. So how can you tell the difference?**


    **A data analyst takes data and cleans, processes, and breaks it into small, digestible
    forms. Data analyzation is about the exploration of data.**


    **A data scientist focuses on taking data and explaining the past, problem solving
    the present, and strategizing the future.**


    All of these more technical aspects—coding languages, frameworks, and machine
    learning—can be found online. There are free tutorials, exercises, and resources
    available for people looking to learn on their own. For someone interested in
    more structure, books, online courses, and nanodegrees are also available but
    at a cost.


    **THE COMPETITIVE DATA SCIENTIST**


    While developers have hackathons, data scientists have competitions of their own.
    Kaggle is a website for data scientists that gives people resources to learn data
    science, access to public data sets they can practice on, a job board, and open
    competitions. Competitions expose you to a wide range of problems to solve, giving
    you working experience with many issues you will face in your field. The strict
    time set for each competition teaches you to work quickly and efficiently, and
    you’ll learn new techniques and ways to approach data.


    Even though it is a competition, Kaggle allows forums where data scientists can
    solve problems together, giving you access to more experienced data scientists
    that can help you understand and learn. And as the competition ends, you’ll gain
    instant feedback on how you did compared to the others, receiving a place and
    rank on Kaggle’s leaderboard. The more competitions aspiring data scientists compete
    in, the more experience they gain and the better they become. Rising on the leaderboard
    and allowing your work to be seen can attract the attention of people looking
    for data scientists, which in the end can lead to work. It’s an excellent resource
    for any data scientist at any experience level, giving you access to education
    as well as possible employers.


    **PAY AND JOB PROSPECTS FOR DATA SCIENTISTS**


    The demand for data scientists will not slow down anytime soon. Because they are
    so sought after, data scientists are paid high wages. However, anyone going into
    this field needs to ask themselves if the amount of studying and practice is worth
    working in this booming field. With so many different skills to master, you may
    find yourself studying and working for a long period of time before you are able
    to find a job, so finding alternative work while you learn how to become a data
    scientist should be factored in.


    ![](images/f0053-01.jpg)


    Data science jobs can allow some flexibility to work outside of the office. However,
    you have to be good at communicating with your teammates or clients.


    Once you are at the skill level where you can find work, your first jobs may not
    be full-time. Online freelance contract jobs are abundant, and some of these jobs
    can be seeking entry-level data scientists. If you’re looking for more permanent
    employment, tech-friendly locations like the San Francisco Bay Area or Austin,
    Texas, may have more opportunities for full-time positions than other places,
    or you may find a company that allows you to telecommute, or work remotely from
    home.


