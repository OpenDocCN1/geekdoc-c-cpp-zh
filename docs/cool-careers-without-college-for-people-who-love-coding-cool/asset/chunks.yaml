    ***Chapter 3***


    ***ANDROID/IOS DEVELOPER***


    W ith so many people using mobile devices, there’s now an application, or app,
    for everything. From messaging your friends to paying your bills, planning your
    vacation, and even adjusting the temperature of your house or dimming the lights
    in your room, you can now do it all on your mobile device. As of June 2016, Apple’s
    App Store surpassed two million apps. That’s two million ways to organize, execute,
    and express what’s happening in your life all from the comfort of your mobile
    device. We’re a connected society, and we’ll only continue growing this way.


    ![](images/f0028-01.jpg)


    Hundreds of apps need teams of developers to bring them from idea to product you
    can download on the app store.'
