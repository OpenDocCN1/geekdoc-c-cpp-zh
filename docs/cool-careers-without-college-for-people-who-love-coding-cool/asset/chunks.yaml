    This is where data scientists, the rock stars of statistics, come in. Taking raw
    data and processing it with algorithms and math, data scientists find the stories
    and trends in the numbers. They help major retailers reduce costs and improve
    sales, energy utility companies predict usage patterns, and companies to focus
    their marketing campaigns, as well as assist in many other industries. A data
    scientist needs to be able to communicate these stories in terms that everyone
    else can understand, so if you’re someone who enjoys taking complex ideas and
    information and translating them into simpler terms, this might be the job for
    you.


    ## HOW TO BECOME A DATA SCIENTIST


    Data scientists are in high demand right now, and because of that, the field commands
    high salaries. The highest of these salaries are six-figures or more and go to
    data scientists that have `PhDs`. However, you can begin a career as a data scientist
    without having to go to college.


    One of the easiest but expensive routes to becoming a data scientist are online
    and in-person boot camps. These boot camps can ranger from being massive open
    door programs to highly competitive programs that students must apply to. Boot
    camps do, however, offer a complete step-by-step learning plan, a useful path
    to educating yourself about such a complex field. These boot camps tend to be
    more expensive than other forms of education, and some more advanced camps can
    cost over ten thousand dollars. So be careful when researching your education.


    ![](images/f0048-01.jpg)


    Nate Silver is a data scientist famous for his 2008 and 2012 presidential election
    predictions. He runs a statistical analysis website called [fivethirtyeight.com](http://fivethirtyeight.com).


    If boot camps aren’t for you, or if you want to strengthen your knowledge before
    entering into a program, there are other ways to study. Someone interested in
    being a data scientist needs to be proficient in mathematics. Statistics and algebra
    are musts for a data scientist to study, but more advanced mathematics like calculus
    and logic need to be understood. Sites like `Coursera` and some colleges with
    online courses teach these subjects a la cart, allowing you to advance your mathematics
    learning without having to completely enroll into a traditional college.


    Learning programming languages and frameworks is also important. Understanding
    coding languages like `R`, `Python`, or `SQL` and frameworks like `Hadoop` or
    `Spark` allows a data scientist to take large amounts of data and extract the
    relevant information, as well as build models on how the information acts in other
    scenarios.


    This knowledge also helps a data scientist with learning and understanding machine
    learning. Machine learning is the ability for a computer to learn without being
    programmed to do so. For data scientists, machine learning allows them to take
    a particular set of information and have the computer dive deeply into it, extracting
    data that lies deep within.


    ## DATA SCIENTIST VS. DATA ANALYST


    Data scientists and data analysts may sound similar, but they couldn’t be more
    different. So how can you tell the difference?


    A data analyst takes data and cleans, processes, and breaks it into small, digestible
    forms. Data analyzation is about the exploration of data.


    A data scientist focuses on taking data and explaining the past, problem solving
    the present, and strategizing the future.


    All of these more technical aspects—coding languages, frameworks, and machine
    learning—can be found online. There are free tutorials, exercises, and resources
    available for people looking to learn on their own. For someone interested in
    more structure, books, online courses, and nanodegrees.


