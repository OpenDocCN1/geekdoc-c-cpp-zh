    ***Chapter 11***


    ***PRODUCT MANAGEMENT***


    P roduct management is a role that oversees every stage of the product’s life
    cycle. Product managers, sometimes called project managers, know how the developers
    are building the project, but they’re also talking to marketing, testing, and
    watching the metrics. A product manager is an experienced builder, but also a
    business savvy team leader that knows the target market of the product and how
    to sell it. A product manager can not only take critique but give it in a way
    that is constructive to others. Every team reports to the project manager from
    each department and for each stage of the product. Product managers make sure
    the deadlines are met and any problems that arise are worked on and solved. They
    are the glue that holds the entire project together, and the people that speak
    on behalf of the product and the team.


    ![](images/f0110-01.jpg)


    All of the other careers in these sections can lead you to become a product manager;
    experience is the key.


    **HOW TO BECOME A PRODUCT MANAGER**


    Product managers make a higher than average salary. This is because they often
    have a lot of experience in one field or another before being hired for this job.
    This isn’t an entry-level position, and while some companies may look for a higher
    education degree, like a master’s, you can become a product manager without going
    to college. Small companies and startups in particular tend to care less about
    degrees and more about experience.


    To be a product manager without a college degree, you need to have had experience
    elsewhere. You need to have worked on building multiple products. The jobs you
    have before you become a product manager don’t have to be specific to management,
    but they have to show that you know how to work on a team. You could start out
    as an engineer where your understanding of technology could begin, or as a designer
    and bring your knowledge of user experience. There are many parts of a team you
    could be a part of before becoming a product manager: it all depends on what interests
    you.


    TECHNOLOGY, USER EXPERIENCE, AND BUSINESS SENSE


    **There are three areas of business a product manager needs to master; technology,
    user experience, and business sense. These are all very different, and while project
    managers may know one very well, they are expected to learn the others as they
    take on more of a leadership role.**


    **For any project they manage, project managers need to have a working knowledge
    of the technology being created. They need to know some coding and understand
    the framework the product is being built on. This is so they can accurately and
    clearly communicate with the engineers working on the project. A good project
    manager knows what changes are being made and why, as well as what problems the
    team of engineers must solve.**


    **Project managers also need to understand user experience, allowing them to talk
    to UX designers and testers to improve the customer-facing side of the product.
    Project managers understand the fundamentals of testing, design, and the value
    of the product to the user. In the end, the product will be in the users’ hands,
    and the project managers should know what kind of experience the users need to
    have in order for the project to be successful. They are invested in how the users
    will interact with the product and its ease of usability.**'
