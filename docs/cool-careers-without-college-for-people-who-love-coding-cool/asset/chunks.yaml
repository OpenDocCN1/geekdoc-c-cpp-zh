    由于互联网链接具有不断变化的变性，Rosen Publishing 开发了一个与本书书主题相关的在线网站列表。该网站定期更新。请使用此链接访问列表：


    [`www.rosenlinks.com/CCWC/coding`](http://www.rosenlinks.com/CCWC/coding)


    ## 第 6 章


    ### 游戏开发者


    2015 年，游戏行业已成为一个 235 亿美元的行业。游戏机游戏、在线游戏和手机游戏都深受数百万人的喜爱。该行业比以往任何时候都更加寻找帮助游戏进入市场的程序员和代码编写员。有了
    Steam 等平台，构建、发布和分发自己的游戏已变得简单。


    视频游戏行业受欢迎的一部分在于其种类的多样。现在游戏不再仅仅在视频游戏主机或手持游戏设备上玩，而且在手机和平板电脑上。有适用于 Mac、Android、Facebook
    以及其他网站的游戏。有这么多选择，也有许多不同的编程语言和平台供你学习。因此，在决定想成为哪种类型的开发者之前，务必做一些研究。


    ![](img/f0058-01.jpg)


    通过大量的学习和努力，对视频游戏的热爱可以转化为一份帮助创建游戏的职业。


    许多不同的学校提供游戏开发课程，但这些课程通常伴随着高昂成本。正如我们看过的其他类型的公司一样，游戏公司更看重经验而非学位。有很多在线课程和教程可以用来学习各种编程语言和平台。一旦你知道你想开发什么样的游戏，就参加适合你的正确课程。如果有其他学生，务必与他们交流并建立联系。游戏行业和我们的许多其他职业一样，是靠人脉运作的。朋友是无价的；你可以一起讨论问题，互相帮助完成项目，并为职位空缺互相推荐。


    当你学习更多程序时，请确保使用这些新技能来创建新游戏。作为一名游戏开发者，你的作品集将帮助你找到工作，因此你希望有项目可以展示你知道多少以及能做什么。参与他人的项目，并确保尽可能实习。


    ### 注意加班冲刺期（CRUNCH TIME）


    视频游戏必须准时发布，因此当游戏接近发布日期时，负责它的团队通常会进入行业所谓的“冲刺期”（crunch time）。这种形式的加班通常没有加班费，但它有一点：长时间的工作。加班期间的某些天工作可能超过
    12 小时，工作六天，只休息一天。对于发布游戏的团队来说，这是一个充满压力且疲惫的时期。


    ![](img/f0061-01.jpg)


    冲刺期意味着周末和团队一起待在办公室，以便按时完成游戏的构建。


    视频游戏行业最近因“冲刺”这种做法对工人造成的极端压力而饱受指责。请始终意识到，如果你在视频游戏行业工作，你很可能必须经历冲刺期，而长时间的工作加上睡眠不足会且也将影响你的身体和心理健康。网络上有许多文章详细记录了该行业的冲刺问题以及它对人们及其家庭的影响，这些文章值得阅读，以理解在视频游戏行业工作有多困难。如果你看重灵活的工作时间和能够请假的能力，那么这份工作可能不适合你。


    ## 虚拟现实与 OCULUS RIFT


    2012 年，未来以 Kickstarter 众筹的形式到来。Oculus Rift 是第一款对普通玩家来说负担得起的虚拟现实头戴设备，它向活动活动资助者承诺了完全沉浸式的体验。Kickstarter
    迅速筹到了资金，Oculus 公司变得极其受欢迎。虚拟现实这项被人们认为是 20 世纪 80 年代后期笨重巨大的护目镜、手套以及粗糙的技术，突然被 Google
    等公司开始探索。


    但虽然 Rift 应该是为玩家准备的，虚拟现实已迅速被认为是其他行业的未来。虚拟现实（或 VR）的沉浸式体验使其在许多不同方面都非常有用。设计师已经发现了使用
    VR 创建房屋和各种基础设施的 3D 等比例设计的方法，他们可以在甚至在建造之前在 VR 中行走并仔细检查。视频会议很快就能将来自世界不同地区的参会所有人聚集在一个地方。老师有一天可以学生学生使用头戴设备与模拟事件和场景进行互动，让他们体验历史的一部分或解决复杂的问题。对于医生来说，VR
    和扫描技术可能是在进行手术之前观察身体内部的窗户。时间将证明我们如何在非游戏领域使用 VR。


    ### 开发者的薪资与前景


    视频游戏行业正蓬勃发展。由于许多人对视频游戏的向往，进入门槛可能需要一段时间。由于有许多人申请同一个职位，你必须拥有脱颖而出的作品集和简历。在很多公司，有时取决于谁可以推荐你，这回到了游戏开发者需要建立人脉的问题上。参加游戏开发者大会（GDC）等会议也大益，因为许多公司设有展位并开放作品集评审。


    ![](img/f0063-01.jpg)


    每年公司都会在 GDC 向公众发布他们开发的游戏。


    游戏开发者的收入通常很好，可以让开发者过上舒适的生活。实际金额取决于许多因素。有些开发者是全职的，而另一些可能是合同制的。虽然合同工作最初看起来收入更多，但请注意，自由职业需要自己缴纳税款，并且你需要留出部分付款以便在纳税季节有足够的资金。


