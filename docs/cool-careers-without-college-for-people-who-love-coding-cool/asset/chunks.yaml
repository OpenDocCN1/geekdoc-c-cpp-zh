    这是不断扩张的科技领域中一个蓬勃且重要的部分，它通常被认为是最令人满意的工作之一，原因在于拥有灵活的工作时间、具有竞争力的薪资以及远程办公（即广为人知的居家办公）的能力。但通往成功设计的道路可能是漫长的。竞争可能非常激烈，一旦进入该行业，UX
    设计师必须具备极大的耐心，因为他们需要不断地构建、测试并接受设计评审。一个成功的设计师必须能够理解产品的某些后端内容，还要理解更多基于艺术的概念和技能，如色彩、设计和矢量图画。由于需要利用许多不同的技能，并且创建一个成功的设计涉及许多步骤，良好的项目管理和团队协作能力是必不可少的。而且随着截止日期的临近，你可能需要在压力下工作并加班完成完成任务。


    # 如何成为一名 UX 设计师


    在开始当一名设计师时，拥有艺术的一面并无害，但请记住，你掌握的技能不仅仅是构图眼，还需要更多。你设计的是人们将与之交互的界面，而你需要培养的技能只能通过实践获得。


    为了进行数字设计，`Adobe Photoshop` 和 `Adobe Illustrator` 等程序长期以来一直是设计师数字工具箱中的黄金标准。但随着
    `Adobe` 产品现在成为需要按月订阅的昂贵云端应用程序，其他替代方案相继问世。基于 Mac 的应用程序 `Sketch` 因其结合了 `Photoshop`
    和 `Illustrator` 的多功能性以及低廉的价格而迅速变得流行。


    要学习如何使用你的数字工具，`Skill-share`、`Skillwise`、`LinkedIn` 的 `Lynda` 等网站可以提供帮助。你也可以在 `YouTube`
    等网站上找到视频。你可以根据意愿支付少量或大量的费用来获取教程、课程和学习帮助。还有关于使用这些应用程序的书籍和电子书。


    UX 设计师需要不断跟上变化的风格和技术。阅读、学习和寻找灵感至关重要。`LinkedIn` 和 `Medium` 等网站上有经验丰富的设计师编写博客，他们讨论的话题涵盖从如何进入
    UX 设计到设计历史以及新兴趋势的各个领域。`Best Designs` 和 `Dribbble` 等网站汇了其他 UX 设计师的作品，让你从中获得灵感，并洞察其他设计师如何工作以及如何展示他们的成品。


    但自学中最重要的部分是实践。为了被录用，设计师需要不断对虚构的应用和产品进行原型设计。提出你自己的想法并围绕其创建设计，可以让你在无需先找到工作的情况下展示你的技能。你可以将这些设计展示给他人并寻求批评意见，并利用它们开发用于面试
    UX 职位的作品集。


    # UX 设计师的薪资与职业前景


    UX 设计师的薪资通常是固定工资。由于大多数设计师在公司全职工作，这是一个协商确定的金额，通常包括医疗保健、假期假，有时还有差旅费等福利。薪资随州和国家而异，在生活成本较高的地区（如`Silicon
    Valley`），薪资会更高。随着你的不断成长和工作，你可能会获得加薪并协商更高的薪资。


    ![](img/f0014-01.jpg)


    `Silicon Valley` 是世界科技之都。然而，在美国其他城市和城镇也有许多编码工作。有些工作甚至可能离你很近。


    UX 设计师的需求很大，但竞争可能非常激烈。通常情况下，先以实习生的身份进入公司，在实习结束后由公司聘用全职会更容易。


