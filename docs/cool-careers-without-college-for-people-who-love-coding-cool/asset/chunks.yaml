    The front end is also known as client-side development. This is the portion of
    the product that the customer interacts with. Not to be confused with UX design,
    the front end has more to do with the structure and the coding of the product,
    and less to do with the interface design. They do, however, often work alongside
    the UX designer, assisting with building and testing wireframes and mock-ups.
    They take the designs and work of the UX designer and translates them into code
    for the program to use, allowing the UX designer to test designs and discover
    which user interfaces actually work best for the application.


    Front end developers know `HTML`, `CSS`, and `Javascript`, and are familiar with
    multiple frameworks. This is so a site can be versatile and scale to fit any device
    it’s being viewed on, making it look nice and user-friendly, whether it’s being
    accessed on a cell phone or a giant monitor.


    Back end developers develop and build the systems that power the product. They’re
    in charge of the back end: a server, database, and application that keeps everything
    running smoothly. Back end developers focus on creating clean code that is easy
    to manipulate and fulfills the needs of the project.


    Back end developers need to know multiple languages, like `Ruby on Rails`, `Python`,
    `Java`, and `PHP`, to create and maintain their back end. `PHP` frameworks, tools
    like `MySQL`, and software like `Git` are also valuable to know as a back end
    developer.


    ## DON’T BE A MASTER OF NONE


    The desire to want to learn every language, tool, and software available to full
    stack developers can be strong. But trying to learn them all runs the risk of
    being spread too thin and not being particularly good at any one thing. Limit
    yourself to only a few skills and work on being the best at them in the beginning.
    The further you go in your career as a full stack engineer, the more opportunities
    you’ll have to learn more and add to your résumé. Employers want a full stack
    developer who is fluent in the languages they know and able to create well-designed
    products with them. It’s easy to want to be a jack-of-all-trades but even easier
    to be a master of none.


    ## BECOMING A FULL STACK DEVELOPER


    Full stack tutorials, classes, and programs are extremely popular online. Sites
    like `Udacity`, `ibento`, `Fullstack Academy`, and `Fullstack. io` have created
    multiple courses to learn from that start at the beginning level and progress
    to more advanced topics. College is rarely talked about for full stack development,
    so education toward your career will be found online.


    Taking online boot camps and courses allows you to do something else that’s important:
    network. Meeting other developers who are also trying to learn the same skills
    you are and making friends expands your knowledge as a developer. Other developers
    can assist with projects and help you grow by exchanging resources and potential
    employer information. Remember that people helping you should be helped in kind;
    share your own thoughts and resources. Learning development is less of a competition
    to get the next job as it is meeting, expanding, learning from, and helping your
    network.


    ![](images/f0040-01.jpg)


    Other developers can give advice and help you solve problems that may pop up on
    a project build. But remember to also be helpful when people ask for your assistance.


    Practice makes perfect for a full stack developer. The industry is interested
    in how much experience you have, so come up with your own projects, build your
    own products, launch them, and show others what you’ve built. Work on your friends’
    projects, learning and improving your skills together. Hackathons—competitions
    where design and development teams create products—are the perfect challenge to
    full stack developers. Many people form teams with their friends and enter these
    competitions. Prizes can be as small as a gift card and as large as thousands
    of dollars and invitations to even larger competitions. Winning a hackathon is
    an excellent accomplishment to add to a résumé and shows employers you have great
    problem-solving skills and can work in a very short time frame.


    ## FULL STACK DEVELOPER PAY AND JOB PROSPECTS


    Full stack developers are in high demand. Even if you haven’t been previously
    hired, allowing potential employers to see your personal projects shows that you’re
    serious about growing and learning as a developer. Interviewing with projects
    you’ve worked on, even for free, will only help you find the right developer job
    on the right team.


    Salaries for full stack developers vary with the location where the company is
    located, but employees tend to make larger than average salaries for their work.
    You’re expected to work longer hours to get big projects done on time, so if you
    don’t mind working long hours, this might be the job for you.


    ***FOR MORE INFORMATION***


    ### ORGANIZATIONS


    **Association for Computing Machinery**

    2 Penn Plaza, Suite 701

    New York, NY 10121-0701

    (800) 342-6626

    Website: [http://www.acm.org](http://www.acm.org)

    This is the largest computing society and brings together professionals, educators,
    and students and connects them with communities and resources.


    **Software Engineering Institute**

    4500 Fifth Avenue

    Pittsburgh, PA 15213-2612

    (412) 268-5800

    Website: [https://www.sei.cmu.edu](https://www.sei.cmu.edu)

    This institute within Carnegie Mellon University focuses on the education and
    advancement of software engineers.


    **Usenix: The Advanced Computing Systems Association**

    2560 Ninth Street, Suite 215

    Berkeley, CA 94710

    (510) 528-8649

    Website: [https://www.usenix.org](https://www.usenix.org)

    This association provides a community for sys admins, engineers, computer scientists,
    and technicians.

