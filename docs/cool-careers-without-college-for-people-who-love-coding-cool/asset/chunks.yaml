- fmt: '

    One of the most important tasks sys admins perform is maintaining standards and
    practices for employees to use. When a new employee joins the company, sys admins
    set up a company computer and make sure the person has the correct programs, passwords,
    and access. They will often set up the company email and any other important applications
    on the employee’s phone. They will explain the standards and practices and make
    sure the employee understands what is expected and how to use the company equipment
    and software. They may answer any questions a new employee may have about the
    system and help him or her learn how to navigate the company’s intranet, or internal
    communications network. When an employee leaves, the sys admins in turn make sure
    all company equipment is returned and the employee’s accounts are deleted.


    Larger companies may require their own private software to manage certain tasks.
    A sys admin may help create this custom software and assist in building patches
    to fix issues.


    ## BACKING EVERYTHING UP


    Everyone knows how important it is to back up their documents. But when a company
    has hundreds of employees, how does everything get backed up?


    ### DBAS, NETWORK ADMINS, AND SAN ADMINS


    Sys admins have a lot of responsibility, but these roles can branch off into more
    specific titles within system administration. The larger the company, the more
    specific jobs within administration can be as each person focuses on one area
    of a company’s internal framework. As these roles take certain responsibilities
    from a more general system administrator, sys admins within these larger teams
    will find themselves directly in charge of the computer systems that are installed
    and operated on company hardware as these other roles focus elsewhere. To enter
    more specific roles, you may need to complete additional training and certifications.


    A database administrator, or `DBA`, is in charge of the security and performance
    of a company’s database. `DBAs` are constantly checking the efficiency of the
    database and maintain the database’s security, which can be extremely important
    for organizations that handle confidential or private information, like hospitals,
    police stations, and schools. `DBAs` also keep database systems and handling programs
    up to date, as well as design and set up new databases. A `DBA` also needs to
    be able to train employees to be able to input and extract data through the various
    systems and applications used by the company or organization.


    Network administrators are in charge of installing, configuring, and providing
    support to a company’s networks. This includes a company’s virtual private network
    (`VPN`), local area network (`LAN`), wide area network (`WAN`), and any routing
    and internet systems.


    Storage area network administrators, or `SAN` admins, are directly in charge of
    a company’s storage. A storage area network is a network dedicated specifically
    to a company’s storage, where information is broken up and stored on multiple
    devices instead of in one place. This allows for the storage to operate at high
    speeds, and a `SAN` admin needs to be able to maintain this network’s security
    and efficiency as well as troubleshoot any issues that may arise.


    A sys admin needs to make sure this vital data is kept safe. A routine task is
    backing data up and making sure there is enough space in a company’s system to
    capture and store that data. For many companies, that space is in a commercial
    data storage service like `Amazon Web Services`. But in some instances, a company
    can have its own servers. Sys admins need to be comfortable with maintaining these
    servers and understand the physical requirements of a server when companies want
    to have their storage on site rather than in the cloud.


    Data storage can go back years, allowing a company to keep detailed records of
    events for legal purposes. So the data that is stored needs to be easily searched
    and sorted. Sys admins who are highly detail-oriented will help their companies
    stay organized.


    ## HOW TO BECOME A SYS ADMIN


    Depending on the requirements being sought by a company, a sys admin can be well
    compensated. Some employers do look for a four-year degree in computer science,
    but often experience working in the field is just as valuable.


    When you are just starting out, online resources are helpful and plentiful. `Windows`
    allows you to receive training for free, while open source systems like `Linux`
    have multiple guides published. Networking with other system administrators and
    reading about enterprise-level software and hardware can help you learn. Becoming
    certified to maintain certain pieces of hardware and software can also make you
    a desirable candidate. Because there are so many different types of certifications
    for different operating systems and programs, it’s best to decide what you’re
    interested in learning before choosing any one certification program.


    ![](images/f0024-01.jpg)


    Free online courses are available to help you develop the skills you need in order
    to become a sys admin.


    Your first couple of jobs may be small and more focused on home repairs for people
    who need IT assistance. But the more work you do, the more your résumé and experience
    will grow. Making contacts with other system administrators will help you know
    when potential jobs open up as well as give you people who can be your references.


    ## FOR MORE INFORMATION


    ### ORGANIZATIONS


    League of Professional System Administrators (`LOPSA`)

    1200 Route 22 East, Suite 200

    Bridgewater, NJ 08807

    (609) 219-6787

    Website: [`https://lopsa.org](https://lopsa.org)

    This is a nonprofit group that provides resources and support to sys admins around
    the world.


    Network Professional Association (`NPA`)

    3517 Camino Del Rio S, Suite 215

    San Diego, CA 92108-4098

    (888) `NPA-NPA0`

    Website: [`http://www.npa.org](http://www.npa.org)

    This is an organization for network computing professionals.


    Usenix: The Advanced Computing Systems Association

    2560 Ninth Street, Suite 215

    Berkeley, CA 94710

    (510) 528-8649

    Website: [`https://www.usenix.org](https://www.usenix.org)

    This association provides a community for sys admins, engineers, computer scientists,
    and technicians.


    ### BOOKS


    Kralicek, Eric. *The Accidental SysAdmin Handbook: A Primer for Early Level IT
    Professionals.* New York, NY: Apress, Inc., 2016.


    Limoncelli, Thomas A., Christina J. Hogan, and Strata R. Chalup. *The Practice
    of System and Network Administration: Volume 1: DevOps and Other Best Practices
    for Enterprise IT.* 3rd ed. Boston, MA: Addison-Wesley Professional, 2016.


    White, Kevin M., and Gordon Davisson. *OS X Support Essentials 10.11: Supporting
    and Troubleshooting OS X El Capitan.* Berkeley, CA: Peach Press, 2016.


    ### WEBSITES


    Because of the changing nature of internet links, Rosen Publishing has developed
    an online list of websites related to the subject of this book. This site is updated
    regularly. Please use this link to access the list:


    `http://www.rosenlinks.com/CCWC/coding`


    ## CHAPTER 3: ANDROID/IOS DEVELOPER


    With so many people using mobile devices, there’s now an application, or app,
    for everything. From messaging your friends to paying your bills, planning your
    vacation, and even adjusting the temperature of your house or dimming the lights
    in your room, you can now do it all on your mobile device. As of June 2016, Apple’s
    App Store surpassed two million apps. That’s two million ways to organize, execute,
    and express what’s happening in your life all from the comfort of your mobile
    device. We’re a connected society, and we’ll only continue growing this way.


    ![](images/f0028-01.jpg)


    Hundreds of apps need teams of developers to bring them from idea to product you
    can download on the app store.

