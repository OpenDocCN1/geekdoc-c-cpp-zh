    ## Chapter 9


    ### ARTIFICIAL INTELLIGENCE DEVELOPER


    Artificial intelligence, or AI, has been described as the new heart of Silicon
    Valley. While we often think of the complex robots with human-like features of
    science fiction movies, current AI has a long ways to go before reaching those
    levels of complexity. Artificial intelligence currently performs functions that
    most people would consider simple but are often complex actions we take for granted
    as people, like understanding our internet surfing habits and suggesting pages.
    With each small step, though, AI gets closer to performing more complicated jobs
    like driving without a human at the steering wheel, following and assisting soldiers
    in battle, or helping the elderly. A cutting-edge, broad field, AI covers everything
    from computers translating text, to computers performing customer service, and
    Google and Tesla’s new self-driving cars.


    (image)

    ```


    Machine learning is powering the self-driving cars that Elon Musk and his company
    Tesla Motors envision as the future of transportation.


    ### MACHINE LEARNING AND NEURAL NETWORKS


    Two of the biggest areas of artificial intelligence today are machine learning
    and neural networks. Machine learning, as we’ve discussed before, is the ability
    for a computer to learn without being programmed to do so. The machine goes through
    many, many tests, and each time takes the information that was the outcome and
    analyzes it to apply and adjust its own programming. This can be something as
    simple as your phone learning slang when you text and not flagging it with autocorrect
    the next time you send a message, to Facebook suggesting new friends, to autonomous
    robots exploring the surface of an asteroid without a scientist directing them.


    ### SELF-DRIVING CARS AND THE FUTURE OF THE ROAD


    One of the most exciting and talked about technologies today is an artificial
    intelligence that will soon have a major effect on our lives and commute times.
    Self-driving cars are autonomous vehicles that can drive without the help of a
    human behind the wheel. They use `GPS`, sensors, an internal navigation system,
    and artificial intelligence to drive by themselves from one location to the next.


    (image)

    The Tesla Motors Model S car is equipped with autopilot technology that enables
    automatic lane changes and the ability to parallel park for the driver. It’s a
    step closer to self-driving cars.


    Currently self-driving cars are limited in their capabilities and can’t drive
    a person to work or the grocery store just yet. However, millions of self-driving
    cars are predicted to be on the road as soon as the year 2020. This technology
    will not only make your trips easier, but it will also provide transportation
    access for people who can’t drive themselves, like the elderly and the disabled.
    Self-driving cars also mean fewer car wrecks, as the cars won’t speed, drive too
    slow, or drive too close—common bad habits people have. With an increase in safety
    and more accessibility and mobility for people who can’t drive, automotive industry
    is one of the many possible fields someone interested in work toward. Neural network
    is a certain type of machine learning that exists in a subgroup called deep learning.
    A neural network is software or hardware system that is designed to mimic the
    neural network of the brain. It is built to have a large number of processors
    that are in a tiered structure, with each tier feeding into the next. This means
    when data is entered, it goes through each tier step by step, exiting the final
    tier with its outcome. This allows the AI to be adaptable, and it is often used
    for pattern recognition. Current uses for neural networks are predicting patterns
    in the stock market, recognizing your handwriting when you write a check, and
    performing more complex actions like having robots recognize your face.


    ### HOW TO BECOME AN ARTIFICIAL INTELLIGENCE DEVELOPER


    Some people think that in order to work in artificial intelligence, you need to
    have a PhD. However, advanced degrees or even college isn’t necessarily needed.
    You will, however, have to build upon other skills and knowledge. Understanding
    some coding languages like `Python` and `R`, and how to process and read data
    is important, as your job with AI will be building programs that can process data
    and learn by themselves. Working as a data scientist can be a smart first career
    on a person’s way toward working with artificial intelligence. Because a data
    scientist must be familiar with machine learning, you can build on your education
    as you work in that field, learning more about deep learning and neural networks
    as you discover what you may want to do within the field of artificial intelligence.


    (image)

    Artificial intelligence can be a career that is built off of other careers and
    skills you’ve gained. Microsoft’s Cortana writing team is made up of many experts
    from different fields. Artificial intelligence is a popular technology, which
    means online resources are readily available for someone to learn. Blog, videos,
    and tutorials are great ways to learn. Kaggle, a data science website listed in
    another section, is a perfect place to practice machine learning problems with
    its competitions and public datasets. Competitions allow you to not only show
    your work but also to network with other people interested in artificial intelligence
    and be exposed to potential projects and employers.


    ## PAY AND PROSPECTS FOR AN ARTIFICIAL INTELLIGENCE DEVELOPER

