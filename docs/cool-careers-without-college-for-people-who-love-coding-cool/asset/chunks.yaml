    ## 第 9 章


    ### 人工智能开发人员


    人工智能（简称 AI）被描述为硅谷的新心脏。虽然我们经常会想到科幻电影中那些具有人类特征的复杂机器人，但目前的 AI 在达到那种复杂程度之前还有很长一段路要走。人工智能目前执行的功能在大多数人看来是简单的，但这些功能通常是我们作为人类认为理所当然的复杂动作，例如理解我们的上网习惯并推荐页面。然而，随着每一步小小的进步，AI
    越来越接近于执行更复杂的工作，例如在没有人类驾驶员的情况下驾驶、在战斗中跟随并协助士兵，或帮助老年人。人工智能作为一个前沿且广泛的领域，涵盖了从计算机翻译文本到计算机提供客户服务，以及谷歌和特斯拉的新自动驾驶汽车的所有领域。


    (image)

    ```


    机器学习正在驱动着埃隆·马斯克和他的特斯拉公司设想的未来交通工具——驾驶汽车。


    ### 机器学习与神经网络


    今天人工智能中最大的两个领域是机器学习和神经网络。正如我们之前讨论过的，机器学习是计算机在无需经过专门编程的情况下学习的能力。机器会经过许多、许多测试，每次都获取结果信息并对其进行分析，以应用并调整自己的程序。这可以是非常简单的，例如你的手机在发短信时学习俚语，并在下次发送消息时不再通过自动纠错功能将其标记；再到
    Facebook 推荐新朋友；再到机器人在没有科学家指导的情况下探索小行星表面。


    ### 自动驾驶汽车与道路的未来


    今天最令人兴奋和广受讨论的技术之一是即将对我们的生活和通勤时间产生重大影响的人工智能。自动驾驶汽车可以在没有人类驾驶员的情况下行驶的自主车辆。它们使用 `GPS`、传感器、内部导航系统和人工智能来自己从一个地点行驶到另一个地点。


    (image)

    特斯拉 Model S 汽车配备了自动辅助技术，使驾驶员能够自动换道并进行平行泊车。这距离自动驾驶汽车又近了一步。


    目前，自动驾驶汽车的能力受到限制，还无法将人们送往上班或杂杂商店。然而，预计到 2020 年，将有数百万辆自动驾驶汽车上路。这项技术不仅会让你的旅程更加轻松，还将为无法自己驾驶的人们（如老年人和残障人士）提供交通便利。自动驾驶汽车还意味着更少的交通事故，因为汽车不会超速、行驶得太慢或离得太近——这些都是人类常见的坏习惯。随着安全性的提高以及无法驾驶的人员便利性和移动性的增加，汽车行业是那些致力于工作的人的许多可能领域之一。神经网络是机器学习的一种，存在于一个被称为深度学习的子集中。神经网络是旨在模仿大脑神经网络的软件或硬件系统。它的构建包含许多分层结构的处理器，每一层都向下一层提供数据。这意味着当输入数据时，它会逐层通过每一层，并在最终层输出其结果。这使得
    AI 具有适应性，并且通常用于模式识别。神经网络目前的用途包括预测股市的模式、在你写支票时识别你的手迹，以及执行更复杂的动作，如让机器人识别你的脸。


    ### 如何成为人工智能开发人员


    一些人认为，要在人工智能领域工作，你需要一个博士学位。然而，并不一定需要高级学位，甚至是大学学位。但是，你必须积累其他技能和知识。了解 `Python` 和
    `R` 等编程语言以及如何处理和读取数据是重要的，因为你对 AI 工作是构建能够自己处理数据并学习的程序。作为数据科学家可以作为通往人工智能领域工作的明智第一职业。因为数据科学家必须熟悉机器学习，所以你在该领域工作时不断完善自己的教育，随着你发现自己在人工智能领域可能想做什么，学习更多关于深度学习和神经网络的知识。


    (image)

    人工智能可以在你获得的其他职业和技能基础上建立建立。微软的 Cortana 写作团队由许多来自不同领域的专家组成。人工智能是一项热门技术，这意味着学习者可以轻松获得在线资源。博客、视频和教程都是学习的好方法。Kaggle
    是另一个章节中提到的数据科学网站，通过其竞赛和公共数据集提供了练习机器学习问题的完美场所。竞赛让你不仅能够展示自己的工作，还能与其他对人工智能感兴趣的人建立联系，并接触到潜在的项目和雇主。


