- "# Minecraft 高级建筑：惊艳作品赏\n\n\n\n![](img/9780593600061_cover.jpg)\n\n![Minecraft:\
  \ Master Builds 封面，作者, Mojang AB 以及 Minecraft 官方团队](img/9780593600061_cover.jpg)![书名，Minecraft:\
  \ Master Builds，作者, Mojang AB 以及 Minecraft 官方团队，印社，Random House Worlds](img/9780593600061_title_page.jpg)![](img/1.jpg)\n\
  \n![](img/MMB_Sayama_fullbleed_14.jpg)\n\n\n# 序言\n\n_\n\nMinecraft 最令人惊叹的事情之一，就是我们都可以分享自己的创作，互相激发灵感并共同学习。\n\
  \n我从未认为自己是一个建筑师，不像那些其他人——比如那些建造了你书中看到的这种种作品的人。我觉得他们身上拥有某种我所缺失的特殊之处。我花了许多小时观察玩家建造惊不起的作品，研究他们作品的细节，试图弄明白他们是如何让某个东西看起来如此美丽的。毕竟，我们都使用相同的方块，因此在每一个作品中都有发现新风格或新技巧的机会。\n\
  \n我继续建造，承担更大的项目并为它们制作视频，甚至加入了 Minecraft 开发团队。尽管如此，我从未在某一个时刻觉得自己变成了一个建筑师——还有有太多东西要学习了！随着时间的推移，我意识到并没有什么必须逾越的标准。我们都可以建造，凭借\
  \ Minecraft 社区无止尽的想象力，总会有新事物激发我们的灵感。\n\n无论你是在寻找纯粹为了美学而赞叹的精彩创作，还是在为你世界中的下一个项目寻找灵感，我确定你会在书中有所收获。凭借每位玩家独特的背景，总会有新的视角引向另一个惊人的项目。\n\
  \n我们都是建筑师。\n\nMikael “slicedlime” Hedberg\n\n*Minecraft 技术主管兼内容创作者*\n\n# 第一章\n\n\
  ## Aman，不朽之之地\n\n作者：Iskillia\n\n![](img/MMB_aman_fullbleed_17.jpg)![](img/MMB_aman_cutout_2.jpg)\n\
  \nIskillia 给建筑师们的主要建议是：“你必须完成它”，他认为这是他成功的秘诀。“我确实花时间，但也会完成我开始的事情。我强迫自己做到这一点。你必须完成它！”这位法国建筑师、才华横溢的渲染师以及这些不朽之地的设计师说道。\n\
  \n在经过十八个月的苦心打造后，Iskillia 通过完成宏大的奇迹 Aman 证明了他的言论，它是许多折衷影响的结晶。彼特·杰克逊《魔环王》电影中宏伟的米城（Minas\
  \ Tirith）是美术设计的一项惊人成就，它显然影响了 Aman 的雕像和堡垒看起来既威严又美丽的方式。植被灵感来自法国南部的优美葡萄园，Iskillia 幸运地住在附近。\n\
  \nISBN 9780593598993\n\n电子书 ISBN 9780593600061\n\n[randomhousebooks.com](http://randomhousebooks.com)\n\
  \nrhid_prh_6.0_142010529_c0_r0\n\n![](img/MMB_Sayama_fullbleed_14.jpg)\n\n（注：此处之后为正文内容部分，已按要求完成翻译）\n\
  \n\n\n\n在开始“不朽之地”（Immortal Lands）项目之前，Iskillia 曾过初步规划：在学校作业本的边缘画涂鸦设计图。但他更倾向于直接开始建造并随时制定计划。“这是一种非常敏捷的方法。它一直在不断变化。我一直在建造、建造、建造，最后我得到了一些东西。那些东西在开始时是完全失控的！”\n\
  \n随着时间的推移，一个结构逐渐成型，Iskillia 将其分为三个阶段。“第一阶段是开始，你在创造事物并尝试找到将它们组合在一起的方法。第二部分是规划，你选择地图的全局组织形式、结构等。最后阶段是你明确了自己想要什么，现在你全身心地投入到细节中。”\n\
  \n“这是一种非常敏捷的方法。它一直在不断变化。我一直在建造、建造、建造，最后我得到了一些东西。那些东西在开始时是完全失控的！”\n\n最后一个阶段最具挑战性。Iskillia\
  \ 认为，“你不能简单地复制粘贴。所以你被迫在整个地图上制作许多**相似又不同**的东西。我认为这是整个艺术创作中最困难的部分！”仔细观察，你会发现，惊讶的是，许多看起来相似的结构（尤其是许多房屋）确实存在细微的。很难否认这为他的城市赋予了多少个性，但这种投入程度光是想想它就让人想躺平。\n\
  \n准确处理每一个微小细节既困难又耗时，但审视阿曼（Aman）的宏观全也有它自己的挑战。“在游戏中，你的视野和距离都是有限的。”随着你的建造变得越来越宏大，这个障碍自然会变成一个更大的绊脚。“这可能是一个问题。当你在这个地图上工作了一年半后，你会非常熟悉它。你可以轻松地在周围移动并清楚每个东西在哪里。但很难看到地图的‘全局性’。”\n\
  \n![](img/3.jpg)![](img/MMB_aman_fullbleed_3.jpg)\n\n## 红天下的红帆\n\n这艘红帆美之船虽松地基于威尼斯船只，是为更宏大的建筑引入对比色的明智方法，且不会与现有建筑的美学产生冲突。此外，Iskillia\
  \ 对细节那近乎荒谬的执着让这艘船看起来不像仅仅是窗面的点缀，而是真正成为了这座城市的一部分，因为他不仅建造了船，还建造了港口并包含了准备贸易的货物。草堆和南瓜有人想要吗？\n\
  \n![](img/MMB_aman_fullbleed_No_reflection_13.jpg)\n\n⬢\n\n整个不朽之地，展示了 Iskillia 利用的多样形状语言。\n\
  \n![](img/MMB_aman_fullbleed_15.jpg)\n\n⬢\n\nIskillia 思考了建筑中的色彩平衡，确保每个元素都脱颖而出。\n\
  \n## 每栋建筑都独一无二\n\nIskillia 使用白木建造小建筑的结构（以这个建筑的标准来说是很）。为了与白木的白色形成对比，他使用杉木作为边缘，使用海棱岩作为屋顶。他觉得冰冷的蓝/绿色海棱岩与木材的暖色搭配得非常完美。非常舒适！\n\
  \nIskillia 需要大量的监督工作才能很好地了解城市的进展情况。这就是他提到的渲染技能派上用场的地方。渲染不仅仅是让 Minecraft 看起来具有荒谬真实的精细艺术。它还能让你最终看到你创作的全貌。“当你第一次在一个画面中看到整个地图时，”Iskillia\
  \ 解释道。因此，在他为期 18 个月的项目过半时，他制作了一张渲染图，让他实现了这一点。最终看到九个月的心血全貌是什么感觉？“哇。”说得好。\n\n凭借高耸入云的雕像和复杂的堡垒，人们很容易注视“不朽之地”，并想象出一个拥有丰富详尽历史的真实城市。事实上，Iskillia\
  \ 所做出的许多选择已让这座城市成为他 Minecraft 技能多年来演变的记录。“我拿了我以前的一个旧作品。那是在开始这个项目之前大约两三年前的一个非常旧的作品。它符合这张地图的风格和氛围，并且有一些有趣的想法，所以我决定把它加入地图，尽管它并不是我所能达到的巅峰水平。”\n\
  \n将你早期的、未经过精琢的建筑放在你最好的作品旁边似乎是一个奇怪的选择，但 Iskillia 坚信，隐藏你早期的创作实际上是太多的建造者会犯的错误。“不要评判过去的自己，”他建议道，“许多艺术家都有这个问题。他们的技能变得越来越精进，所以他们会评判过去的作品。当你制作一个为期\
  \ 18 个月的地图时，如果你一直在评判过去的作品，你就无法继续下去。你会一直毁掉已经做好的东西，或者转向另一个项目。”\n\nIskillia 这种不那么自我毁灭的方法本质上就是现实世界城市的样子——由松散连接的设计和想法构成的混合体，这些建造者在城市中工作时间越长就不断变化和演变。“绝对是如此。在一个文明中，不只有美丽的建筑。还有丑东西！我认为那些错误（如果我们可以称它们为错误的话）会让地图更丰富、更有趣。”很难说\
  \ Iskillia 地图上的任何东西是丑的。\n\n\n\n尽管他有制作鸭子的经验，但回到参考资料总是很有用的，因此在这次制作中，SadicalMC 在网上研究了鸭子。“我确实查了橡皮鸭的参考图，只是为了大概了解头部通常有多大。与真实的鸭子相比，橡皮鸭的头部大得多。”这非常方便，因为这为他在鸭子头上添加华丽的高大礼帽和更多的城堡尖塔留出了空间。他的鸭子看起来比你通常在浴缸里看到的要蓬松得多——这是一个刻意的选择，旨在为一个非常奇幻的作品增添一些令人惊讶的真实细节。“我也看了真鸭子的照片。我喜欢让我的作品既真实，又带有许多幻想和神话元素。我喜欢将色彩、植物、现实主义和幻想相结合。”而处理好这些真实的细节会让奇幻元素变得更加耀眼。考虑到植物并不是建筑的主体，它们本可以很容易被事后草草，但显然经过了精心制作，看起来非常真实。这证明了\
  \ SadicalMC 的水平：建筑中栩栩如生的元素与戴着大礼帽、背着城堡的鸭子并在一起完全一点不协调。\n\n![](img/MMB_DuckBuild_fullbleed_7.jpg)\n\
  \n### 设计灵感\n一个不寻常的女神，但拥有丰富的色彩供选择。SadicalMC 选择了与鸭子黄色“羽毛”形成鲜明对比的区块。\n\n![](img/11.jpg)\n\
  \n这些羽毛朋友是结合了现实和玩具参考创作而成的，它们拥有巨大的圆脑袋和流线型的身体。\n\n![](img/12.jpg)\n\n### 建筑细节\n- **顶部**：`SadicalMC`\
  \ 用无数植物和一些奇幻的灯笼装饰了池塘，玩得非常开心。\n- **底部**：仔细观察那些巧妙地平衡在鸭子背部和喙上的精细塔楼。\n\n### `SadicalMC`\
  \ 的历程\n你不会一夜之间就成为鸭子池的统治者，SadicalMC 已经在磨练他那套独特的技能多年了。“我开始玩 Minecraft 是因为在我上小学时，几个朋友向我介绍了它。它超级有趣。”最初吸引他的是红石提供的先进技术可能性，例如能够建造一个互动式的井字游戏。在青少年时期回到游戏后，他发现自己现在更喜欢\
  \ Minecraft 的建筑方面。“作为一个现在的建筑师，我会觉得：‘那些红石东西太让人压力大了。我不喜欢！’”\n\n看到 Minecraft 社区不断分享的伟大创作，了\
  \ SadicalMC 尝试自己制作一些建筑，尽管他声称自己并非一蹴成功：“我失败得惨惨。”幸运的是，SadicalMC 坚持玩 Minecraft，逐渐提高了了自己的建筑技巧。他将此很大归功于看到社区中源源不断、令人惊叹的作品。“我越投入，看到的灵感就越多。这激励我成为一名更好的建筑师，并释放我的创造力。”\n\
  \n![](img/MMB_DuckBuild_fullbleed_6.jpg)\n\n### 核心特征\n**01** 黄色玻璃的半透明性——尤其是缩小视角后——让这些鸭子看起来带有一种毛茸感。他还使用了白色羊毛、白色混凝土粉、海绵和黄金。\n\
  \n**02** “我为城堡选择这组色调是因为我非常喜欢这种黄白色搭配任何红色或橙色调的颜色。”将这些城堡做成和喙同样的颜色，也意味着这些尖塔是从鸭子身上有机生长出来的！\n\
  \n**03** `SadicalMC` 可能对细节很有眼光，但这并不意味着他愿意在不必要的制作上浪费精力。“我曾纠结要不要给它们加上小脚，但它们反正会被水淹没，所以不值得了。”\n\
  \n**04** “我绝对喜欢建造植物和花朵。我使用了各种绿色区块。”使用的区块范围让植物看起来比只使用单一的纯色区块更有生机。\n\n**05** 哪种是 SadicalMC\
  \ 最偏爱的鸟？“我认为最小的那只是我的最爱。”\n\n![](img/16.jpg)\n\n### 创作哲学\n最近，他的创造力集中在完善复杂的元素上。“我是纹理和极精细细节的坚定拥护者。这是\
  \ Minecraft 最近的一种趋势。很多人在做非常微小、简单的建筑，但带有精细的细节，他们可以成功地在一个五乘五的空间里塞进最疯狂的细节。”这显然是他内在的设计哲学，并将其带到了自己的作品中。通过关注池塘上四只鸟这样一个具有欺骗性的小场景，他能够全身投入地让每个方面都尽可能超细节。一根胡须都不乱。\n\
  \n但让我们进入最重要的问题。这些鸭子有名字吗？“没有。噢天天，我本应该给它们命名的！”他叹道。幸运的是，这远不是他的第一个鸭子建筑。事实上，这甚至不是他第一个带有戴礼帽的鸭子的建筑。之前的三只分别名为\
  \ Sir Quackles、Sir Quackles the Second 和 Sir Quackles Junior。至少这些作品比他的命名习惯更具启发性。\n\
  \n“这次建筑对我来说是一个结合我三个最喜欢的事物的机会：鸭子、城堡和植物。这就是整个项目的意义所在。”围绕这三个带给你最多快乐的主题创作出一个独特的建筑，然后让想象力自由驰骋，是世界各地创作者的梦想。即使是这些傲慢的池塘生物也应该为此致敬，尽管它们可能会冒着撞掉一两个尖塔的风险。\n\
  \n![](img/MMB_DuckBuild_fullbleed.jpg)\n\n# 第三章\n## 公主\n作者 `Varuna`\n\n![](img/aquaprincess_fullbleed_6.jpg)](images/aquaprincess_cutout_2.jpg)\n\
  \n沉没的宝箱。丰富的沉船。神秘的遗迹。Minecraft 的海洋为任何愿意潜入的人提供了大量的宝藏和奇观。诚然，那里还有眼睛会射激光的海怪和手持三叉的水僵尸，但那里有足够的奇观值得你下水。如果你仍然不信，也许专业建筑团队\
  \ Varuna 的《公主》足以让你沉迷其中。\n\n这座水下建筑充满了巧妙的细节，给人一种在海底存在很久很久的遗迹感。例如生长在公主碑和她所拥有的城堡上的植物；像这里的主人一样游荡的鱼群；以及让探索变得极其危险的鲨。深海建筑师\
  \ `BlackKing89`、`Fiksat`、`ColoradoMcoil` 和 `RenQeN` 以及 `Varuna` 的创始人 `Thomas Sulikowski`\
  \ 显然投入了大量心血。\n\n\n\n\n# 水中公主（Aqua Princess）最初只是 Varuna 较小的作品之一。客户对自己的想要相当模糊，只加了一张非常有用的雕塑参考图。“这个女人在水下，手臂伸出，我想她手里可能握着一座城堡。”这也许是客户最初想要的，但\
  \ Varuna 很快提出了更具野心的计划。“我们认为如果能找到一种方法让城堡环绕在女人周围，会更酷，这样整体看起来更统一。于是我们添加了这道通往城堡的长楼梯，塔楼延伸出来，最后环绕着她的左肩。”\n\
  \n![](img/MMB_aquaprincess_fullbleed_12.jpg)\n\n## 这座建筑必须从几个角度观察。这个视角展示了塔楼比公主高出多少。\n\
  \n“当我开始接到大量订单时，我真的决定把 Varuna 注册成立一家公司。”\n\n![](img/26.jpg)\n\n### 顶部 | 位于公主伸出的手上的城堡。\n\
  \n### 底部 | 建筑团队创作了一系列不同的海洋生物，包括小丑鱼和乌龟，填充了城堡周围的海洋。\n\n![](img/18.jpg)\n\n### 顶部 |\
  \ Thomas 和他的团队精心工作，利用方块创造了一个看起来自然的人体形状。\n\n### 底部 | 一条巨大的蓝唐从塔楼的窗户中探出来。\n\n![](img/MMB_aquaprincess_cutout_1.jpg)\n\
  \nThomas 的大部分工作是与客户沟通。“通常，当我们开始一个委托项目时，客户会非常兴奋，所以他们会向我们要截图。我会发给他们，但那只是一堆在 Minecraft\
  \ 里画的乱七八糟的线条，标出了每栋房子的位置以及街道的轮廓。他们通常看了之后会说：‘噢，这看起来一点也不好看！’” Varuna 还会向建筑的委托人跟进“频率至少每周一次”，向他们展示建筑的进展情况。“我们会确保向他们发送我们创建的第一座房子的蓝图。”如果客户不喜欢这个计划，他们可以在\
  \ Varuna “在我们基本上用三三千种不同的方式把这栋房子重新建造之前”告诉他们。每周检查一次，还是可能拆掉三千间房子？不难理解为什么 Thomas 更倾向于前者。\n\
  \n随着团队越来越多地参与建造，最初的概念也演变了。“最初城堡周围只有的一条大鱼，但我们添加了所有的鱼群。”建造者们研究了许多不同鱼的图片，“只是为了确保它们的尺寸正确”，并拒绝满足于仅一种鱼，以让建筑成为对海洋生活更广泛、更多样化的反映。精心的建筑增添和额外的鱼类是很棒的加分项，但它们与\
  \ Varuna 最伟的想法相比都显得黯然失色。“在后面，雕像后面，其实有一条鲨鱼。”事实上，那是一条巨大的锤头鲨，在原始参考图中并没有。精心地雕刻一条巨大的鲨鱼，然后把它藏在主渲染图中公主后面？嗯，当你从其他角度欣赏这座建筑时，这会是一个非常大的惊喜。他们对雕塑做的另一个改变，对于任何住在城堡里、不想被巨大的发光眼睛\
  \ 24 小时盯着的人来说都是个坏消息。“你一直被监着。没有休息！”决定给公主那那样双诡异明亮的眼睛，是因为“那是我们凸出她眼睛细节最简单的方法。”\n\n在一个充满有机生命、古老遗迹和一只潜行鲨鱼的建筑中，Varuna\
  \ 最难处理好的元素是一个令人信服的发型。“这是一个非常自然的形状，一个人类，在方块的世界里，这很难模仿。”仿佛这还不够挑战一样，团队还必须应对 Minecraft\
  \ 对重力工作的独特解读。“女人的头发垂在脖子后面，然后越过右肩膀。它看起来一直非常奇怪，因为当你试图在一个没有重力的视频游戏中制作具有重力效果的物体时，难度会呈指数级增长。由于我们太习惯于生活在一个有重力的世界里，每样东西都需要呈现特定的样子。如果你不这样做，大家很快就能发现它看起来很奇怪。”只有在\
  \ Minecraft 里，你创造鲨鱼的挫败感可能才比剪发型要少。\n\n“有句说法是，当你完成一个项目的百分之九十时，你还有百分之九十要做。这正是我对我们做的每一个项目的感受。”\n\
  \n但 Varuna 成功地搞定了，公主实际上是 Thomas 最自豪的建筑部分。“我觉得我们真的搞定那里了！”如果说他的团队有一个成功的秘诀，那就是坚持下去，并在挫折中突破自我。“你需要培养某种程度的耐心。只有当你能够花几周时间坐在它面前，一点一点完善它时，它看起来才会好。如果你期望在几天从零开始建造某样东西后它就是完美的，你就会对正在创造的作品感到沮丧。你会很容易放弃，因为看起来并不完全像你想要的样子。”\n\
  \n“培养那种耐心至关重要。我们有四个人负责这个项目，他们花了几周时间。阴影和纹理——那些是添加非常缓慢的细节。有句说法是，当你完成一个项目的百分之九十时，你还有百分之九十要做。这正是我对我们做的每一个项目的感受。所以对\
  \ Varuna 耐心一点，他们会用精湛的手艺报答你，那是一个称公主的作品。”\n\n![](img/25.jpg)\n\n⬢\n\n顶部 | 公主的眼睛为这座精美的建筑增添了阴森的基调。\n\
  \n⬢\n\n底部 | 潜伏在雕像后的鲨鱼为海洋场景带来了危险。\n\n![](img/MMB_aquaprincess_fullbleed_1.jpg)\n\n\
  ## 额外建筑\n\n## Agnoia Frieden & Vigrid\n\n![](img/27.jpg)\n\n### Agnoia Frieden\n\
  由 Chloriz 在申请加入公司时创作，Agnoia Frieden 描绘了一座宏伟的女性雕塑。她站在山谷中，周围环绕着废弃的寺庙。雕塑和建筑都被藤蔓、苔藓和杂草覆盖，仿佛自然正在收回这片圣之地。\n\
  \n### Vigrid\n在古北维语中的意思是“战斗激烈之地”。这座建筑的创作者 BlackKing 和 RenQeN 利用这一灵感打造了一个受到攻击的岛屿。Vigrid\
  \ 村庄不仅面临着三艘海盗船，还要应对愤怒的恐龙和喷发的火山。月形岛屿上布满了亮红色的建筑，与绿色、棕色和蓝色形成了鲜明的对比。\n\n# 第四章\n\n##\
  \ 帝国城\n作者 Rigolo 和 Comeon\n\n![](img/MMB_ImperialCity_fullbleed_12.jpg)![](img/MINE_MSBD_Test_SmallTower.jpg)\n\
  \nRigolo 和 Comeon 创作的帝国城是宫殿、雕塑、建筑等元素的巨大杂烩。它的灵感源自几个欧洲城市，按理说应该是一个混乱的结合体。事实上，其中一位建筑师可能真的认为它是如此。但它是拥有一切的游客陷阱，一个大得无边的城市，以至于背包游欧洲反而是更快的选择。\n\
  \n\n\n\n\n是 Rigolo 的弟弟 Comeon 向他介绍了《我的世界》（Minecraft），因为他看到 Rigolo 那么喜欢乐高，心他觉得这会吸引他。“零件永远是不够，所以这种能够用无限材料建造出任何东西的想法——我喜欢了。”在通过几个练习项目来熟悉游戏后（Rigolo\
  \ 在描述他的首次建造尝试时说，“可能是一个超级糟糕的房子之类的”），兄弟俩很快决定创建一个城市。“我们打开地图，从这个项目开始做起。这是我在《我的世界》中做过的唯一建筑。我再没做过其他任何东西。”\
  \ 那么，当一个项目的涵盖的范围如此大时，还有必要这样做吗？\n\n### 皇室城市的演变\n\n并没有前期制作阶段。Rigolo 和他的兄弟只是决定“在没有任何计划的情况下建造一些令人惊叹的东西。我们从一个正方形开始，在周围放置建筑，然后一点一点地变得越盖越大，学习了所有小技巧，以便能够建造出那种规模的建筑。”\n\
  \n许多《我的世界》建筑师建造一栋建筑就大收工了。但 Rigolo 和 Comeon，也许是因为他们从未制定过计划，所以不知道何时停止。每当他们其中一人建造东西时，Rigolo\
  \ 就会发现缺少了什么，并将其也建成。\n\n![](img/41a.jpg)\n\n⬢\n\n兄弟俩借鉴现代欧洲城市，混合了不同的建筑风格和时期，以增加他们城市的可信度。\n\
  \n![](img/41b.jpg)\n\n⬢\n\n左 | Rigolo 和 Comeon 为建筑增添了色彩，以使天然石材色调充满活力。\n\n⬢\n\n右\
  \ | 他们甚至设计了一座足以举办奥运会的体育场馆！\n\n![](img/MMB_ImperialCity_fullbleed_8.jpg)\n\n### 灵感来源\n\
  \n世博会——十九世纪和二十世纪期间对尖端技术的庆祝——对皇室城市产生了很大影响。但显然，如此宏大的建造规模不能只受一种影响；兄弟俩受到了世界各地建筑的启发。“有很多斯大林风格的建筑。那些非常高大、增层的建筑。你可以在莫斯科看到其中一些，那里融合了许多巴洛克、新古典主义时期的建筑元素。”\
  \ 其他影响则离家得多，例如巨大的圆顶法国先神庙。“我们在某种程度上重现了我们成长时的环境。我十八岁时搬到巴黎，那些大纪念碑就是周围常见的建筑。”\n\n![](img/29a.jpg)\n\
  \n⬢\n\n兄弟俩设计了许多跨越河流和运河的桥梁以及船。\n\n![](img/29b.jpg)\n\n⬢\n\n左 | 他们在城市的装饰中参考了几种不同的建筑风格，包括斯拉夫和威尼斯圆顶，以及哥特式立面。\n\
  \n⬢\n\n右 | Rigolo 让街道真实化的努力在细节中显而易见，例如路灯、装饰树木和灌木。\n\n“有一个岛屿两边都是河流，所以这意味着需要桥梁。”桥梁需要通往某处，于是他们建造了更多街道。没有建筑的看起来空旷且不真实的街道，于是他们建造了更多街道。建筑需要与相邻建筑连接…………吧，你明白我的意思。突然之间，并不难看出十二到十八个月去哪哪里了。当被问及是否从世界的特定地区汲取建筑灵感时，Rigolo\
  \ 回答道，“拉格、维也纳、巴黎、伦敦、布鲁塞尔、西班牙、意大利。” 也许问哪些城市没有给 Rigolo 灵感会更容易。这种“全欧洲加无所不包”的方法在城市拥有的多样性中显而易见。你可以在一条街上欣赏足以媲美伊丽莎白塔（通常称为大本）的钟楼，在另一条街上欣赏郁郁葱葱的花园，在下一条街看到一群看起来阴森的坦克。有着如此多样的影响和如此丰富的内容，他们是如何保持城市看起来依然统一的？\n\
  \n“当你开始观察它时，它并没有那么统一！”Rigolo 承认道，并解释他在悬崖上建造的骨架是为了部分掩盖这种现象。“这本被设计为在城市建造之前就存在于此地的某个古代文明的遗迹。这是一个人们建造各种不同风格建筑的时期。特别是作为欧洲人，我们习惯在城市的纹理中看到这种混合。这定义了一座城市。你找不到很多建筑风格完全统一的城市。它始终是不同时期、历史、品味的不断堆叠。”\n\
  \n![](img/33.jpg)\n\n⬢\n\n兄弟俩为了填充城市而创作的一些细节建筑精选。\n\n这为加入任何你想到的建筑提供了一个很好的理由，但这个过程自然缺乏一个清晰的终点。他们是如何保持动力的？“你想证明自己的价值并做得比别人更好，”诚实得惊人的\
  \ Rigolo 说，“你喜欢你正在做的事，所以你觉得有动力进一步扩大它。” 在他们仍在创作时，他们还把城市分享到了 `Planet Minecraft` 上——这是世界上最受欢迎的社区网站之一。这座城市大获成功，正面的反馈让\
  \ Rigolo 和他的兄弟“想要变得更加成功”。紧接着又是几十座宫殿……\n\nRigolo 和他的兄弟建造了现在这样“大约百分之九十”的城市，当他们向其他玩家开放时，很快就有其他《我的世界》建筑师自愿添加他们自己的作品。“他们向我们展示了做过的东西的照片，我们想：‘嗯，也许吧。’\
  \ 你会在最终的城市中看到其中一些建筑，例如一座哥特式大教堂。“但有很多东西是别人建造的，我们删除了，因为我们并不觉得合适。”\n\n![](img/MMB_ImperialCity_fullbleed_8.jpg)\n\
  \n⬢\n\n一个受德国城镇建筑启发的彩色广场。\n\n![](img/MMB_ImperialCity_isometric_1.jpg)\n\n### 观光\n\
  \n在他们的欧洲历史参考列表——法国、意大利、俄罗斯、西班牙之外，Rigolo 和 Comeon 还受到了英国设计的启发。“我们从维多利亚建筑中汲取了很多东西。那些在大城市里可以看到的十九世纪工厂。”\n\
  \n![](img/36.jpg)\n\n⬢\n\n除了复杂的建筑设计，Rigolo 和 Comeon 还关注了组成城市的其他元素，例如植物、车辆、港口、景观以及城市内部的视角。\n\
  \n这似乎有些严苛，但这是 Rigolo 为整个城市设定的日益提高的标准，特别是随着他自己建造技能的提高。“有很多建筑我们回过头来让它们比开始时华丽得多。当你开始建造时，你倾向于让立面非常平坦。没有很多细节。我们学会了添加许多元素可以让它看起来更漂亮、更真实、更有生机。所以有几栋建筑几乎完全重新装饰过。”那些重新装饰的建筑是幸运的，因为它们至少留了下来。“我删掉了一些我不喜欢的建筑。我把它们完全抹除了。”\n\
  \nRigolo 发现花费几十小时制作某东西却将其扔掉是令人沮丧的（尽管他很快提醒自己“这只是个游戏”）。但拥有如此高标准让他拥有了一座巨大的《我的世界》城市，并受到了社区的赞誉。他对此应该满意吗？嗯，当被问及如果今天重新开始这座城市是否会有任何改变时，他说“我可能会取消掉一半的建筑。\n\
  \n\n\n\n在细节、平衡和美学方面，我觉得它们还没有达到其他作品的水平。我可能会建造更多的房子，而不是更宏大的纪念碑。当你想要做一些令人印象深刻的事情时，建造宫殿比建造房子更有动力。但这在城市里实际上是完全不切实际的，那里很少有房子、街道或商店。”而大多数人看到这座城市时会被其宏伟的规模所震撼，但\
  \ Rigolo 关注的是你应该去哪里买牛奶。\n\nRigolo 是如何决定什么时候宣布城市完工并停止建造的？“我没法告诉你！我们并没有决定停止。而且，事实上，它一直处于未完成状态。在某个时刻，我们转向了其他事情。我猜每个人都喜欢有这样一个小私人项目。”在大约十八个月后，Rigolo\
  \ 停止了玩 `Minecraft` 并认为这座城市尚未完工。但没有哪座城市是真正完成的，即使在现实世界也是如此，他留下的作品证明了两个厌倦了乐高积木用完的兄弟能成就的规模和技巧。\n\
  \n# 第五章\n\n## 地球天空\n作者 `natsu3012`\n\n![](img/MMB_Earthsky_fullbleed_21.jpg)![](img/MMB_Earthsky_cutout_3.jpg)\n\
  \n任何在人口稠集的城市住过这种不幸经历的人都会把“地球天空”（Earthsky）视为另一个家，因为它如此成功地捕捉到了城市丛林的混乱。然而，这种混乱完美契合了建造者的口味。以\
  \ `natsu3012` 为名进行创作的法国建筑学生 Ambroise Guenole 无法停下，塞入更多的细节、结构、方块、野心、希望、梦想，可能自从你开始读到这里起又增加了五十种东西。\n\
  \n在他们的学习中，`natsu3012` 喜欢预测未来的城市会是什么样子。“对于一个对所有人都有益的乌托邦愿景，我们想象了一个自然城市，拥有密集的公共交通网络、高层建筑以及作为公共空间的屋顶。在我的创意和审美想象中，我希望未来的城市看起来像我的作品，即使它们在现实中是无法居住的。毕竟这是一个相当自私的梦想。取决于人类选择的道路，两种情况都是可能的：一座科技城市或一个巨大的贫民窟。”\n\
  \n这位建造者的热情极具感染力，他们实际上可以向你推销末日景象。“我非常喜欢末日未来的氛围。而 `Minecraft` 非常适合这种宇宙观的实现。”然而，对于这个未来愿景，`natsu3012`\
  \ 计划了不同的东西。“我想在一种漂浮的基座上建造一堆建筑。”这解释了建筑标题中“天空（sky）”的部分。这是一个脱离地面的逻辑跳跃——当地球上没有更多空间建造建筑时，人们将不可避免地开始向天空寻找一个放置他们房地产的地方。\n\
  \n“取决于人类选择的道路，两种情况都是可能的：一座科技城市或一个巨大的贫民窟。”\n\n![](img/MMB_Earthsky_isometric_1.jpg)\n\
  \n⬢ 一座挤满了摩天大楼的漂浮大都市——想象一下顶部的景色吧！\n\n![](img/MMB_Earthsky_fullbleed_25.jpg)![](img/43.jpg)\n\
  \n## 摩天大楼\n\n`Natsu3012` 花了大约一个半的时间建造了地球天空，感谢 `Minecraft: Java Edition` 插件 `WorldEdit`\
  \ 帮助他们节省了大量时间。至于这座城市的名字，他们“必须在主全息投影上显示一些东西”，赋予城市一种冷冷的、蓝色的未来细节。“这个名字源于项目的意图。一座天空中的城市。一片人们聚集、建筑向云霄生长的新土地。”人们聚集？也许最好只关注“建筑向云霄生长”这部分就够了！\n\
  \n`Natsu3012` 发现，他们的建筑学习对于规划这种高远的设计大很有帮助。“我知道如何构思一个项目、开发它，并想象不同比例下的空间。”当你的结构中很大一部分通向天空时，这绝对是一项有用的技能。他们还可以接触“一套丰富的[建筑]知识库，我乐于将它们翻译成‘Minecraft\
  \ 语言’。”\n\n在描述城市扩建过程的开端时，他们乐意提供建筑语言的例子。“我从定义一个‘样本’社区开始，在其中我开发我的结构原则。然后我在更全球的尺度上使用中性体量来构成整个项目。”对于我们这些听不懂建筑师语言的人来说，中性体量是指“像立方体这样的简单形状。这是一种我之后会重新处理的基本形式。我会详细地重新处理每个区域，以便它们与样本区保持一致。”这是一个聪明的办法——打造一个细小、详细的部分，这样当你提醒自己在美学上追求的是什么样的城市时，你总有可以可以回溯的东西。\n\
  \n另一个聪明的方法是 `natsu3012` 对颜色的创意运用。“我并不按照 `Mojang` 预想的方式使用方块。我根据它们的颜色或纹理来使用它们。例如，我不用泥土做地面，而是用它来做墙。我使用了许多不同的方块。`TNT`、`青金石矿`……我特别喜欢的一种方块是菌丝，我经常使用它。”这个过程创造了一个色彩悦目的城市。“目标是拆解建筑的元素。展现它的质性、它的结构，玩弄它的渐变，并模拟时间的影响——例如，稳步劣化的油漆——以强化光影的效果。亮亮应该是亮的地方，黑暗应该是黑暗的地方。”\n\
  \n![](img/44.jpg)\n\n⬢ 没有太阳光，地球天空从内部光亮。`natsu3012` 添加了灯光以增强城市氛围。\n\n“在大规模尺度上建造。我建议首先要有一个非常简单的基础。要理解简单并不是缺陷，它能提供更好的视觉效果。”\n\
  \n`Natsu3012` 在建造早期阶段还使用了一种流行的建筑技巧。他们用彩色羊毛方块制作大型结构，然后将它们替换为他们想要的方块。这是一种“更好地看到你要做什么”的聪明方法，因为使用占位方块可以组合建筑或其他结构的形状。这引出了一个问题：你更倾向于住在由羊毛还是泥土墙成的房子里？\n\
  \n在建筑设计方面，`natsu3012` 对各种风格感兴趣。“我喜欢制作没有伟大野心的小型建筑。具有多种文化灵感的小型房屋或其他[项目]，同时努力提高我的技术。在小尺度上创作非常有成就感。但地球天空代表了我最喜欢在游戏游戏中做的事情——巨大的、未来感的且带有反乌托邦色彩的城市。这是我喜欢的氛围。”\n\
  \n这座巨型城市还没有达到 `natsu3012` 理想中野心的三分之一。“今天如果我做一个类似的项目，我想建筑数量会翻倍甚至三倍，到处都是道路，以真正营造出聚集的印象。我的纹理处理技术有了提高，所以我认为在那方面会有巨大的改进。”在尝试将这座城市扩大四倍之前，快去修改\
  \ `natsu3012` 的 Minecraft 密码吧！\n\n![](img/47.jpg)\n\n⬢ 正视图提供了左上角道路的更多细节。\n\n![](img/48a.jpg)\n\
  \n⬢ `natsu3012` 为他们的城市顶部设计了一个巨大的数字广告牌。\n\n![](img/48b.jpg)\n\n⬢ 从左到右 | 屋顶花园是现代建筑中流行的特征，有助于打破这座都市的单调；`natsu3012`\
  \ 为他们的未来建筑增添了色彩墙壁。\n\n\n\n\n\n考虑到 natsu3012 对大型建筑的热爱激情，他们实际上是保持某些简单性的的大力拥护者，这让人有些意外。“要进行大规模建造，我首先建议要用非常简单的结构打下坚实的基础。要明白简单并不是缺陷，它能带来更好的视觉体验。”这就是他们成功平衡这种难度的方式：让一座城市看起来是刻意幽闭的，但又不会显得碍眼。\n\
  \n这位严谨的建造者非常强调提前规划的重要性。“你必须有一个指导方，对计划要做的事情有一个意图，使项目具有连贯性。”而且，在开始建造之前，他对这座未来城市已经有了非常明确的想法。“`Earthsky`\
  \ 的计划是在有限的表面上创建一个‘完工’的城市，建筑相互重叠，但对玩家来说又是实用的。不同层级有许多路径可以行走。”\n\n尽管这是一座悬浮城市，但 natsu3012\
  \ 的 `Earthsky` 却惊奇地符合现实主义。“我想设计一个可以步行的空间，有时像高低错落的小巷，有时则更像公共场所。”这位建筑师可能对人类的未来有两种不同的预测，但如果是由他们来规划，那么我们也许是安全的。\n\
  \n# 第六章\n\n## Gothencrow\n作者：Rajkkor\n\n![](img/MMB_Gothencrow_fullbleed_25.jpg)\n\
  \n### 纹理包\n- ◾ `Dokucraft Light` 来自 `Dokucraft`\n\n![](img/MMB_Gothencrow_cutout_4.jpg)\n\
  \n哥特式建筑 `Gothencrow` 是一个充满自豪感的阴郁城市，其特点是宏伟且极其复杂的建筑，而这些建筑实际上是一个相当快乐的设计。Gothencrow\
  \ 的建筑师 Vincent Grenfeldt（在 Minecraft 社区被称为 `Rajkkor`）刚刚加入 Minecraft 服务器和 YouTube\
  \ 频道 `FyreUK`。加入三个月后，他的第一个项目是参与他们的视频之一，但他们希望在里面加入更多的城市。“那时我想，如果那里有一个哥特世界会很好。`FyreUK`\
  \ 还没有做过哥特式主题的建造。”随后他发现这将是一个延时视频，这是他以前做过的东西。\n\nMinecraft 延时视频展示了整个建筑是如何一个方块一个方块地建造，并经过了加速。它们对于观察团队如何组合作品非常出色，而且观看起来极度上瘾。在放置任何方块之前，它们还需要回答很多问题：“房屋应该长什么样？里面的大型建筑有哪些？风格是什么？里面有哪些类型的细节？”\n\
  \nVincent 很快发现会有局限。“事实证明，显然我为建造选择的细节对于普通人在延时视频下所能完成的来说有点复杂了。因为当你做延时视频时，你必须考虑到并不是每个人都建造了超过一年多。它必须是一种简单的风格，但要看起来足够好。目的是从零开始构建地图。”他最终决定直接把\
  \ `Gothencrow` 做为一个大世界，而不是延时视频。\n\n![](img/MMB_Gothencrow_fullbleed_29.jpg)\n\n\
  ⬢\n\n虽然建筑的标题是哥特式的，但方块的选择却惊奇地丰富。Vincent 使用了棱光石（prismarine）为他的幻想小镇增添了一丝活力。\n\n“我的朋友向我介绍了\
  \ Minecraft。那是很久以前的事了！我大约十二岁。我开始玩 `Survival` 模式，过了一段时间我才开始制作地图。”\n\n![](img/MMB_Gothencrow_fullbleed_6.jpg)\n\
  \n⬢\n\n教堂的色彩在雪山的苍白背景下脱颖而出。\n\n![](img/52.jpg)\n\n⬢\n\n- **顶部**：Vincent 完美地了将宏伟的城堡隐藏在巨大的、森林茂密的山之后。\n\
  ⬢\n\n- **底部**：在这个神秘的瀑布空地中可能会发现什么秘密？\n\nVincent 从他喜欢的游戏中汲取灵感。“当时我对 `Dark Souls`（黑暗之）感兴趣。我非常喜欢游戏中那种古老的、欧洲启发的建筑，所以我觉得在这个主题上做些东西会很有趣。”对于那些从未体验过反复死亡之快乐的人来说，`Dark\
  \ Souls` 是由日本工作室 `FromSoftware` 开发的一部大型奇幻 RPG。不过 `Minecraft` 稍微友好一点，而 `Dark Souls`\
  \ 则是暗黑风视频游戏幻想中的哭泣之王。它充满了宏伟的建筑，看起来光是看着就可能被割伤到。这两者都是 `Gothencrow` 的清晰灵感，但 Vincent\
  \ 也受到了“《魔兽世界中的吉尔尼亚斯（Gilneas）”的影响。暴雪公司长期运营的 MMORPG 在某些地方也相当黑暗，但对奇幻的处理要更加丰富且更具亲和力。“氛围和环境更多来自《魔兽世界》，带有童话影响，而选择的建筑则变得更像《血源战士》和《黑暗之魂\
  \ 3》。整个城市的主题随着我兴趣的改变而演变。”\n\n当建造者着手如此庞大且耗时的项目时，这在不可避免。自然地，随着你的建筑不断扩张和时间的推移，你的品味和兴趣也会发展和改变。“人们会成熟，但他们的品味实际上并没有改变那么大。他们想要和小时候类似的东西，但更适应他们现在的年龄。”你从\
  \ Vincent 为 `Gothencrow` 构建的松散叙事中也能看到他兴趣的变化。那里有更有通俗色彩的想法，比如召唤狼人的祭司，但也有更成熟的细节，比如城市从小村庄的演变。\n\
  \n什么启发了“Gothencrow”这个名字？“Goth”部分显而易见。Vincent 诚实承认在向 `FyreUK` 推销这个建造时对哥特式建筑一无所知。“我只是想做一些像吉尔尼亚斯和《黑暗之魂》那样的东西，他们说‘好的，你要做哥特式建筑吗？’”至于“crow（鸦）”，你会在\
  \ Vincent 的城市到处发现这些黑羽朋友的标志。“我想那是受到了《权力的游戏》的启发，”他说，并指出它们是该类型的合理陈词，并提供了奇妙的幽灵氛围。“如果你有一座鬼闹别墅，你总能听到鸦叫。”但名字的第三个影响实际上是瑞典城市哥德德堡（Gothenburg），它的港口和建筑启发了\
  \ `Gothencrow` 的布局。\n\n如果他今天建造这座城市，Vincent 说他会以不同的方式处理设计。“`Gothencrow` 实际上有一个很有计划的布局。没有哪个城市是这样自然形成的，至少在欧洲不是。大多数城市都是从小村庄开始的。好的，现在我们需要教堂。好的，现在我们需要一个交易者的市场。噢，看起来我们有了新的宗教，得为那里留个角。噢，看起来科学革命刚刚发生我们需要扩展大学。”他最喜欢建造中的部分是国王城堡。“那是我做的最后一个项目。”\
  \ Vincent 认为城堡展示了他在加入 `FyreUK` 到开始制作 `Gothencrow` 之间建造技能进步了多少。Vincent 越像一个真正的城市规划者那样思考，他的建筑就越逻辑性地契合在一起。“当我设计城堡时，我尝试思考哪些部分是先建造的。哪些部分是随着王国繁荣后来出现的？这对于大多数城堡来说都是，它从一个堡垒开始，随着城堡周围村庄的发展和围墙的建立，对城堡保护的需求减少了。我觉得建筑历史的这一部分非常有趣。”\n\
  \n\n\n由于 Gothencrow 的主要灵感来自视频游戏，因此听闻 Vincent 从小就开始玩游戏并不意外为奇。“我的朋友向我介绍了了 `Minecraft`。那是很久以前的事了！我当时大约十二岁。我开始玩生存模式，过了一段时间后，我开始了地图制作。”如果不是学校突然给了他一个巨大的动力去尝试一种新方法，Vincent\
  \ 可能会一直玩生存模式模式。“当时有一次比赛，我们被要求创建一个冒险地图。’比赛的唯一规则是地图必须以水下为主题。‘我们制作了一个关于一个角色的冒险地图，这个角色与朱尔·凡尔恩《万里的海底沉踪》中的尼摩船长非常相似。故节是关于一个人发现海底城市的故事。所以这并不怎么原创！但更多在于实际的建造，即对周围世界进行实际构建。我们建造了我们对大特兰蒂斯的解读。’”\n\
  \n![](img/58a.jpg)\n\n⬢\n\nVincent 在他的哥特式建筑中创建了一些小村庄。这个宁静的小村落配有一座小教堂和一个风车，被一棵盛开的美丽树俯瞰着。\n\
  \n![](img/58b.jpg)\n\n⬢\n\n从左到右 | 日常房屋坐落在这一宏伟的建筑之中；一只巨鹰守护着瀑布林地；风车和房屋的详细剪纸图。\n\n\
  ![](img/MMB_Gothencrow_fullbleed_30.jpg)\n\n# 充满故事的历史\n\n在设计建筑时，Vincent 喜欢考虑叙事性，而港口右侧带有小塔的堡垒背后有一个非常详细的故事。“那是怪兽猎人的总部和怪物监狱所在地。我试图思考这栋建筑的历史，哪些部分是先建造的，哪些部分是后来为了建筑所有者某种目的的扩张需要而添加的。对于怪兽猎人来说，塔楼是底层建筑的延伸，那座建筑曾作为守卫的官方监狱，直到他们发现了怪物，并需要开发一座特殊的塔楼来关押怪物。’”\n\
  \n![](img/MMB_Gothencrow_cutout_3.jpg)\n\nVincent 和他的团队那难以捉摸的海底城市赢得了比赛。但现在 Vincent\
  \ 看到的只有他旧作品的缺陷。“那时的 `Minecraft` 还没有环绕方块的水，”他解释道，对于这是一个在 `The Update Aquatic` 改进\
  \ `Minecraft` 海洋很久之前建造的建筑，“如果你下去并在水下放置半块，它会在半块没有被完整方块覆盖的部分周围创建一个真空或气泡。所以它看起来并不那么好。然后我们收到了一个建造水下基地的男人的投诉，他说他的建筑比我的更酷，因此他本应该赢的。我想：‘好吧，那我最好还是改进一下。’”\n\
  \n那个输不起的家伙对 Vincent 来说是一个出意意外的良好动力。他开始寻找一个可以加入的 `Minecraft` 服务器来帮助提高他的建筑技巧，因为他显然已经迷上了地图制作。“我非常喜欢制作像《古墓丽奇兵》或《印第安纳·琼斯》风格的地图，你前往这些史诗般的地点，然后探索它们并并在那里发现古老的建筑。”\n\
  \n就在那时 Vincent 发现了他理想的服务器。“我很喜欢 FyreUK，所以觉得加入他们会很不错，做一些建造，并找到一个更集中的建筑社区，在那里人们可以与其他建筑师交流并向他们学习。”除了\
  \ Gothencrow，Vincent 还参与了其他 `FyreUK` 项目，例如 2013 年圣诞延时摄影、精灵港 2.0，以及几个延时摄影项目，如 Kirtipur。遗憾的是\
  \ `FyreUK` 已关闭了他们的数字大门，但他显然学到了很多东西，建造了一个既阴险又壮丽的哥特式盛宴。\n\n![](img/MMB_Gothencrow_fullbleed_28.jpg)\n\
  \n⬢\n\n这座如画般的小镇让人联想起巴伐利亚和东欧的城市，布满了彩色的瓷砖和木制细节。\n\n“Gothencrow 实际上有一个很有计划的布局。没有哪个城市是自然那样建造的，至少在欧洲不是。大多数城市都是从村庄开始的。”\n\
  \n# 第七章：未来城市\n\n：Zeemo\n\n![](img/MMB_FutureCity_fullbleed_17.jpg)![](img/MMB_FutureCity_cutout_5.jpg)\n\
  \n当法国建筑师 Zeemo 开始玩时，`Minecraft` 社区还处于早期阶段，但他对他所看到的景象仍印象深刻。“当我发现其他建筑师建造的作品时，我被城堡和纪念碑的美感所迷住。”但他看到的大多数社区作品都是中世纪风格的。“在我看来，现有的少数城市并没有任何未来感的东西。”所以\
  \ Zeemo 决定他要成为那个填补这一空白的人。“我看了几个具有未来感的游戏和图片，并尝试了一了一下。”\n\n这是一个聪明的方法。通常识别出你在社区中看到的作品缺少了什么，并填补那个空白，是让你的项目获得更多关注的极佳方法——毕竟，它将是独一无二的。Zeemo\
  \ 提到《光环》和《质量效应》等游戏作为影响，还有未来主义电影系列《星际迷航》和《星球大战。“我看了几张未来感的图片来寻找灵感。然后我寻找如何在 `Minecraft`\
  \ 中重建这些建筑，弄清楚选择哪些方块以及如何操作。随着时间的推移，我最终形成了了自己的风格。”\n\n当然，参与过《星球大战》和《质量效应》的艺术家们可以使用一些用于制作数字景观的最尖端技术。而\
  \ Zeemo 在 2014 年左右开始创作“未来城市”，使用的是 `Xbox 360` 版本的 `Minecraft`，比现在的版本要限制得多（彩色玻璃块的缺失尤其令人沮丧）。原生\
  \ `Minecraft` [一个没有经过模组的版本] 中的方块非常适合中世纪世界，但并不适合未来世界，这可能就是早期的社区作品大多集中在中世纪。如果 Zeemo\
  \ 想要一个新时代的城市，他将发挥创意。“尽管方块很粗糙，但有一种真实感。游戏提供的自由以及它带来的宁静，配上既励人心又放松的音乐。”\n\n![](img/61.jpg)\n\
  \n⬢\n\n在建造一座极其复杂的城市的同时，Zeemo 还花时间创作了一系列飞机来填充他的天空。\n\n![](img/MMB_FutureCity_fullbleed_2.jpg)\n\
  \n“我看了几张未来感的图片来寻找灵感。然后我寻找如何在 `Minecraft` 中重建这些建筑，弄清楚选择哪些方块以及如何操作。随着时间的推移，我最终形成了了自己的风格。”\n\
  \n幸运的是，这远不是问题。“当英理石方块出现时……它是我的完美方块。我终于可以使用英理石楼了。”他充分利用了它。对于 `Xbox 360` 上缺少彩色玻璃的问题，Zeemo\
  \ 通过冰块作为窗户找到了通办法，利用了它们的蓝色调。这证明了限制有时对创意是有益的。当你能够无限获取资源时，很容易尝试使用所有东西，导致设计看起来杂乱或过度繁忙。通过拥有如此小的调色板，Zeemo\
  \ 的未来城市处处看起来非常一致，而且经过了深思熟虑的真实。\n\nZeemo 引用了迪拜的天际大楼哈利法法塔作为影响。“我喜欢我制作的许多建筑那种未来感且整洁的设计。我通常用一个角形屋顶来完成我的建筑……以及一根经常发光的桅杆或某种天线。就像哈利法法塔一样，顶层楼是为了完成设计，增加建筑的存在感。’”\n\
  \n![](img/62.jpg)\n\n# 穹顶之下\n\n\n\n\nZeemo 的未来城看起来引人注目，但它远非乌托邦。你会发现一个拥有几个水箱的基地，甚至有更复杂的防御。“最精细也最引人注目的部分是\
  \ `Area 2-57`，一个巨大的玻璃穹顶。” `Area 2-57` 是一个实验性的军事化基地，是作为防止城市敌人攻击而建立的预防措施。“这个穹顶包含了几个非常有未来感的建筑，还有四个带有激光的圆柱模块。”它是城市中最复杂的区域之一，也是\
  \ Zeemo 最为自豪的部分。\n\n![](img/MMB_FutureCity_fullbleed_15.jpg)\n\n⬢\n\n在这样的大都市建筑中，你本以为建筑会占据主导，但\
  \ Zeemo 确保了冰冷的钢筋和玻璃与大量的绿色区域保持平衡。\n\n尽管 Zeemo 喜欢现代建筑，但他并不是建筑设计中近期趋势的粉丝。“我不属于那种全玻璃面板建造的建筑流派。我喜欢装饰着玻璃的灯光混凝土柱。今天的建筑师缺乏原创性。他们的成就往往是无名的，缺乏新意，几乎完全相同，而且看起来很无趣。我讨厌建筑的有机风格和那些通向无处的曲线。”\n\
  \nZeemo 是由他十一岁的儿子介绍这款游戏的，当时儿子大约在 2011 年左右玩 `Minecraft` 的测试版。“我觉得这个游戏非常有趣，但当时还没有\
  \ `Creative`（创造）模式。”幸运的是，他不需要等待某个遥远的未来文明发明它，因为 `Creative` 模式是 `Minecraft` 最早添加的功能之一。当他儿子宣布增加了\
  \ `Creative` 模式后，Zeemo 立即投入了其中。\n\n他喜欢这个游戏的什么呢？“第一个吸引我眼的是……那些开采时会爆炸的方块。”噢，他的意思是字面上的击中。难怪他更喜欢\
  \ `Creative` 模式。除了那些陷阱方块外，Zeemo 也也被“地图各个方向的巨大尺度，它的生物群、山脉、山谷、湖泊、河流、雨和雪”所吸引。“尽管方块很粗糙，但却有真实感。游戏提供的自由和它带来的宁静，都伴随着既振人心又放松的音乐。”\n\
  \n![](img/65.jpg)\n\n⬢\n\nZeemo 将他的未来城市景观充满了标志性的结构，让人想起 20 世纪 60 年代的太空旅行设计。\n\n\
  ![](img/MMB_FutureCity_fullbleed_16.jpg)![](img/66.jpg)\n\n## 如此艺术\n\n艺术装饰（Art Deco）是\
  \ Zeemo 城市的风格，起源于巴黎并一直到纽约。“Art Deco”是 `Arts Décoratifs` 的缩写，源自 `Exposition Internationale\
  \ des Arts Décoratifs et Industriels Modernes` —— 这是 1925 年举办的法国国际装饰艺术工业博览会，它引起了国际对这种风格的关注。20\
  \ 世纪 20 年代的纽约摩天大楼对流行文化中未来城市的观念产生了巨大影响。许多电影、电视节目和游戏在设计中使用了艺术装饰元素。一个早期的例子是弗里茨·朗 1927\
  \ 年的电影《大都市》，它将现代技术与奢华结合，创造了一个至今仍在启发好莱坞的未来主义设定。\n\n“如果我必须重新开始，我会做得不同。我会避免某些风格的建筑，只保留那些最具未来城市代表性的建筑。风格将更加统一，城市的规划也会更有计划。”\n\
  \n他是实验的大粉丝，而 `Minecraft` 中有很大的尝试空间。“有时你尝试某些东西，效果很好，而其他时候不行。当你不喜欢时，不要害怕重新开始并尝试别的东西，一种不同的风格，不同的颜色或不同的材料。”不断尝试新事物，直到你找到适合自己的东西。\n\
  \n在开始八年后，Zeemo 继续致力于未来城的工作。他从那起将该建筑从 `Xbox 360` 转换到了 `PC` 版本（“当我得知 PC 上有光影渲染时，我逐渐放弃了游戏机”），你在这里赞叹的正是\
  \ `PC` 版本。他的城市不再是所有幻想或中世纪建筑中的异类，因为 `Minecraft` 社区已经完全拥抱了科幻风。“我当时没有其他未来城市作为参考，”Zeemo\
  \ 回忆起项目开始时说。“如果我必须重新开始，我会做得不同。我会避免某些风格的建筑，只保留那些最具未来城市代表性的建筑。风格将更加统一，城市的规划也会更有计划。”\n\
  \n漫步在 Zeemo 的未来城是一种令人清新的乐观体验。巧妙地利用有限的色调来描绘未来的高效愿景、大片生机勃勃的自然，以及贯穿整个城市的便捷地铁和传送器通道。诚然，传送器的存在本该让地铁完全过时，但让我们把这种琐碎的钻牛留在过去吧。\n\
  \n# 第八章\n\n## Kythor 景观\n\n作者 qwryzu\n\n![](img/MMB_Kythor_fullbleed_2.jpg)\n\n\
  ### 纹理包\n\n- `Faithful 1.8` 来自 `Faithful`\n- `Better Terracotta Colors for Faithful`\
  \ 来自 `qwryzu`\n\n![](img/MMB_Kythor_cutout_1.jpg)\n\n`Minecraft` 是一组自豪的超现实彩色方块集合，每一个都是对复古\
  \ 2D 像素艺术的直白情书。这里并没有尝试写实主义。但在 `Kythor Landscape` 中，建筑师 `qwryzu` 打造了实际上类似于其灵感来源的世界景观。现在，这个刻意拒绝现实的游戏看起来却非常真实。\n\
  \n`Minecraft` 远非 `qwryzu` 的唯一热情所在。“（在我建筑中的）地形是我的重点，因为我来自美国西南，自然一直是我生活中非常重要的一部分。我喜欢旅行、远足、露营，以及泛泛探索我家乡地区提供的极其多样化的生物群。如果我拥有世界上所有的钱，我只想做探索。”\n\
  \n遗憾的是，`qwryzu` 并没有世界上所有的钱。由于他无法“把所有时间花在户外”，他开始寻找巧妙的方法在留在室内的同时享受户外。“我会在森林里建造舒适的小木屋，但一直对默认的山脉看起来不满意，所以我开始尝试制作自己的。”\n\
  \n木屋是舒适创作的绝佳选择。毕竟，谁不想在熊熊的火炉旁伸直脚，坐在舒适的椅子上（或者根据 Minecraft 的规则，站在舒适的椅子旁边），放松一下呢？好吧，qwryzu\
  \ 显然发现自己关注的是建筑周围的景观而非建筑本身。“每当我制作新地图时，我会在上面建造一小时，但除了看到如何用下一张地图改进地形之外，什么都不做。最后我甚至停止了在地图上建造，因为只想继续制作景观。”\n\
  \n幸运的是，他发现了一个选项无限的游戏。玩家的想象力越大，建筑就越宏。“Minecraft 是一款以无限可能为营销卖点的游戏，可能是我发现过的真正做到的游戏。我喜欢这种可以建造任何我想要东西的自由。我坐在这里制作漂亮的山脉，而其他人在游戏里制作了真正的计算机。Minecraft\
  \ 社区还创造了整个游戏界中最具活力的模组/数据包场景，这意味着当你对原版 Minecraft 缺乏主意时，永远不缺少要做的事。”\n\n![](img/MMB_Kythor_fullbleed_3.jpg)\n\
  \n⬢\n\n蜿蜒的河流穿过茂盛的丛林山谷。“我喜欢旅行、远足、露营，以及泛泛探索我家乡地区提供的极其多样化的生物群。”\n\n南部低地\n\n\n\n\n“西南大陆的灵感源自新西兰和美国太平洋西北部，这两个地方都有着壮丽的、被美森林环绕的雪山火山。东南大陆（如图所示）的灵感模糊地源于犹他州南部和亚洲中部高地平原的结合，尽管在最终版本中我很大程度上偏离了这些灵感。最难建造的部分是红色沙漠与草地之间过渡带的东南大陆。我可能尝试了二十种不同的方块选择方案，因为无论我如何努力，都无法让任何东西看起来很自然。最终，我确定了现在的外观，并对最终成品非常满意。但达到这个结果的过程确实非常令人沮丧！”\n\
  \n![](img/68b.jpg)\n\nQwryzu 是该场景的一部分，他使用模组（mods）来打造最完美的景观。但首先，他会花费最初几个小时研究“谷歌地球和\
  \ Instagram 上的风景摄影账号，以寻找激发灵感的地方”，并自己拍摄一些参考照片。然后，一旦他想好了要在自己的建筑中包含的内容，他就会为世界的整体布局画一幅草图。最后，是时候动用建筑工具了。\n\
  \n“我的地形形状几乎完全是在名为 `WorldMachine` 的软件中完成的，”他解释道。“`WorldMachine` 在地形社区中非常流行，不言而喻。它能让你创作出真实的\
  \ CG 景观，利用算法模拟地形在现实生活中的行为。单是它的侵蚀选项就名其实其实非常深奥。你是更倾向于模拟基于流的侵蚀、热侵蚀，还是将你的地形埋在雪子里，用来建造一间温馨的小木屋？`WorldMachine`\
  \ 的初始难度曲线可能像真实的被侵蚀悬崖一样崎岖，但对于那些想要将 Minecraft 地形技巧提升几个台阶的人来说，这是一个极好的工具。在 Minecraft\
  \ 之外，qwryzu 是一个有志的地质学家，他利用该软件模拟他在课程中学到的过程。”\n\n“我喜欢可以建造任何我想要的东西的自由。我坐在这里制作漂亮的山脉，而其他人正在游戏里制作真正的电脑。”\n\
  \n`WorldMachine` 也只是 qwryzu 创作过程开始。他也是 `WorldPainter` 的忠实粉丝。“`WorldPainter` 是一款用于创建\
  \ Minecraft 景观的免费软件，毫无疑问，它是建筑社区中最重要的外部工具，而不仅仅是地形师中的如此。我也必须在 `WorldPainter` 中完成大量工作，应用如树木、植物、河流层，以及一些我在\
  \ `WorldMachine` 中没有完成的方块选择。”\n\n`WorldPainter` 并不像 `WorldMachine` 那么复杂。它让你自由地绘制大区域的地形，就像许多数字绘画或照片编辑工具。原版\
  \ Minecraft 将玩家限制在第一人称视角，因此许多玩家使用 `WorldPainter` 或 `WorldMachine` 来获取他们建筑的远景。难怪\
  \ qwryzu 对两者都推崇至极。\n\n![](img/MMB_Kythor_fullbleed_15.jpg)![](img/70.jpg)\n\n⬢\n\
  \n为了营造出平缓山丘的印象，qwryzu 将较小的方块层堆叠在一起。\n\n工具已经选好，现在是最困难的部分：将所有这些地形整合在一起。正如 qwryzu 所描述的，这个“艰辛的过程”涉及到在\
  \ `WorldMachine` 和 `WorldPainter` 之间频繁切换，不断进行修改，并“一次导出小块块地图以查看它们的效果”。这远不是一种快速的方法，尤其是\
  \ qwryzu 还坚持他的景观要与 Minecraft 的风格一致。“我尝试保持我的方块选择相对简单且符合生存模式。它大部分是石头和陶土的混合，在合适的地方也有草地。石头和深色陶土或青色、棕色和黑色等混凝土非常适合喜马拉雅山或洛基山脉这样高大的山脉，但其他颜色如白色、黄色和棕色陶土可以做出很棒的沙漠，如亚特拉斯山脉。我的自定义纹理包[在此特色]也调整了陶土颜色，使其更接近美国科罗拉多高原地区发现的沉积岩颜色。许多地形师使用在渲染图中看起来很棒的方块，例如珊瑚和海绵，但它们在生存模式中毫无意义。”\n\
  \nQwryzu 对 Minecraft 的热爱源于在生存模式下玩游戏：他在 2010 年接触到了早期版本的 Minecraft。“我只记得只能挖掘石头方块和放置火炬，光是这些就足以引起我的兴趣了。”对于一个游戏来说，十多年是一个很长的时间，但他有一个个人目标，提供了无限的挑战。“我希望我所有的地图在游戏中使用也具有意义，而不仅仅是为了渲染。”能够创建一个真实的建筑，同时保持其可识别的\
  \ Minecraft 特色，是一项令人钦佩的成就。尽管他的地形建造变得如此先进，但看到没有什么能侵蚀 qwryzu 对多年前就迷上的这款生存游戏的热情，真是很好。\n\
  \n“我只记得只能挖掘石头方块和放置火炬，光是这些就足以引起我的兴趣了。”\n\n![](img/MMB_Kythor_fullbleed_8.jpg)\n\n\
  ⬢\n\n这种方法在建筑师雄心勃勃的山景在大尺度上显而易见。\n\n![](img/MMB_Kythor_fullbleed_14.jpg)\n\n### 北峰\n\
  \n“这张地图的灵感来自于观察非洲撒哈拉沙漠西北部的亚特拉斯山。作为来自美国西南部地区的人，沙漠上方高耸且积雪的山峰对我来说一直是不可思议的。但坐落在撒哈拉无尽沙丘之上的亚特拉斯山特别捕捉了我的想象力。”\n\
  \n那些西北沙漠的山脉和沙丘是 qwryzu 最自豪的建筑部分。“山脚那个可以看到沙丘、棕榈树和雪山的绿洲无疑是我整个地图中最喜欢的地方。当我脑子里有了想要包含的想法，最后能做出完全符合梦想中的产品，这真的很罕见！”\n\
  \n### 技巧与秘诀\n\n#### 1 制定计划\n\n计划是 Zeemo 在建造 Future City 时学的最重要教训，也是给建筑者的主要建议。“在开始建造建筑或纪念碑之前，你必须在大脑中有一个愿景；建筑风格、比例、方块选择、颜色、光照。在一个带有生物群的地图上，建筑的位置也很重要。”\n\
  \n#### 2 安装辅助模组\n\n`WorldEdit` —— Maggie Gondo Wardoyo 和 Arkha Satya Taruna 在创作\
  \ Moon Destruction 建筑时使用的软件是最好的 Minecraft 模组之一。它让你一次性选择并更改多个方块，而无需逐个删除并替换现有方块，还有许多实用的快捷键，让如此大规模的建造变得更容易。\n\
  \n#### 3 使用正确的工具\n\n`VoxelSniper` 是一个用于世界编辑的 Minecraft 模组，Thomas Sulikowski 是它的忠实粉丝。“这是一个非常棒的工具，允许我们向前向后推拉某些方块。在创建有机体时可能是最有用的工具之一。”\n\
  \n\n\n\nArkha 建议与其他玩家建立联系。“我认为 `Minecraft` 社区是世界上最活跃、规模最大的游戏社区之一。我们可以分享我们的地图、纹理包、皮肤以及\
  \ `Minecraft` 的技巧和技巧。我通过 `Minecraft` 结了许多人，包括我最好的朋友以及 `Minecraft` 项目的伙伴。”\n\n##\
  \ 05 选择调色板\n\n“这是为期一两周规划过程的一部分，”Thomas Sulikowski 解释道，“我们会进入一个 `Minecraft` 世界，开始放置我们认为颜色组合好看的方块。对于较小的项目，这些可以是\
  \ 20 到 25 个方块；对于较大的项目，可以达到一百多个方块。对于 `Aqua Princess`，我们真的很想添加这些点缀色彩，因为我们得到的参考图非常鲜艳。那些颜色非常强烈，视觉冲击力。我们想在\
  \ `Minecraft` 中模仿那种效果，所以我们想确保选择了正确的方块。”\n\n## 06 模组是你的好朋友\n\n`Conquest Reforged`\
  \ —— `Minecrafttalsi` 用它制作了华丽的中世纪镇 —— 是受欢迎的 `Minecraft` 模组之一，这并不难理解。它拥有超过 12,000\
  \ 个方块、额外的纹理、粒子效果等等，特别受到历史和奇幻建筑者的喜爱。可能是因为那个阴暗的中世纪时代（据传在那个时代你甚至无法下载 `Minecraft`）——通过\
  \ `Conquest Reforged` 卓越工具集提供的“玫瑰色滤镜”——看起来要迷人得多。\n\n![](img/73a.jpg)\n⬢ 这是 `Zeemo`\
  \ 拍摄的未来城市俯视图，他喜欢提前规划他的建筑。\n\n![](img/73b.jpg)\n⬢ 为了创造爆炸的月球，`Maggie Gondo Wardoyo`\
  \ 和 `Arkha Satya Taruna` 使用了 `WorldEdit`。\n\n![](img/73c.jpg)\n⬢ `Varuna` 发现 `VoxelSniper`\
  \ 帮助创建了看起来真实的有机物，例如 `Agnoia Frieden` 中美丽的雕像脸。\n\n![](img/73d.jpg)\n⬢ `Arkha` 和 `Maggie`\
  \ 的赛博城市庆祝了人类的未来，这是坚信社区的建筑师们创作的合适场景。\n\n![](img/73e.jpg)\n⬢ `Varuna` 建议在建筑前选择方块，这样你就能找到跳出的调色板，比如他们鲜艳的蓝唐。\n\
  \n![](img/73f.jpg)\n⬢ `Minecrafttalsi` 发现 `Conquest Reforged` 为他庞大的中世纪世界提供了很好的工具。\n\
  \n# 第九章：海洋日记\n\n作者：`Junghan Kim`\n\n![](img/MMB_seadiary_fullbleed_13.jpg)![](img/MMB_seadiary_cutout_3.jpg)\n\
  \n除非你在眼睛上贴两个万花筒去水族馆，否则你很难看到比《海洋日记》更色彩丰富的的水下生活描绘了。这是一个包含了丰富的水生生物、神秘神庙以及 `Minecraft`\
  \ 所提供的几乎每种色彩的集合。这足以让你怀疑自己起初何必费力住在陆地上？为了住在如此美丽的地方，呼吸空气难道不是很小的代价吗？\n\n令人惊讶的是，《海洋日记》最初根本没打算设计一个海洋建筑。它的建筑师\
  \ `Junghan Kim` 开始这个项目时是想创造一些简单东西。“我想要建造一些在过去可能存在的东西，比如阿兹特文明。”作为一个起点，阿兹特建筑非常适合 `Minecraft`，它有那种块状的金字塔和宏大的规模。`Junghan`\
  \ 的设计随后发展成了我们看到的充满活力的新古典主义定居点。\n\n“它之所以出现在海，是因为我想随着时间的推移，旧文明一定发生了地形变化。我知道海平面正在变化。”`Junghan`\
  \ 并没有去研究那些实际的地形变化，而是突然灵感采取了一种更具推测性的方法。一个完全被海洋吞噬的文明会变成什么样？\n\n最初，`Junghan` 想建造一个处于浅水中的城市，以营造出这些精美神庙正在缓慢入海的印象。这是一个有趣的假设，在\
  \ `Minecraft` 中描绘它无疑具有挑战性。但 `Junghan` 改变了主意，最终决定将整个建筑淹没。阻止他的并不是挑战——深海提供的谜团简直更令他着迷。“我对深海感兴趣，是因为我们永远不知道那里发生了什么。它很可怕但很有趣。所以我想创作一个探索这个主题的作品。”\n\
  \n![](img/80a.jpg)\n⬢ 这个俯视图引起了对 `Junghan Kim` 使用调色板的关注。海底彩虹！\n\n![](img/80b.jpg)\n\
  ⬢ `Junghan` 设计了水下植物爬在阿兹特纪念碑上。好奇的潜水员可以发现的深海生物。\n\n“我对深海感兴趣，是因为我们永远不知道那里发生了什么。它很可怕但很有趣。所以我想创作一个探索这个主题的作品。”\n\
  \n![](img/MMB_seadiary_fullbleed_14.jpg)\n⬢ 谁想住在橙色的潜水艇里？\n\n“一切主要都是通过创意而非研究产生的；我更多地思考如何让它看起来更好。”\n\
  \n那里还有什么没有发生呢？`Junghan` 似乎对空白空间过敏，他在他的建筑中塞了尽可能多的海洋生物、神庙、植物，甚至是气泡（这是一个增强水下感的绝妙之笔）。“可怕但很有趣”可能看起来不是一个显而易见的设计理念，考虑到让\
  \ `Junghan` 的海洋看起来如此迷人的华丽调色板，但你不需要探索多久就能发现更阴暗的细节，比如一只长着不幸同样巨大牙齿的巨鲨。游进它的嘴里（去吧，你可能没事的），你会发现几条鱼在变成鲨鱼晚餐的瞬间被冻结了。`Junghan`\
  \ 查询了真实鱼的形状、大小和生态系统来帮助制作这些生物，但现实主义从未是首位。\n\n现实世界的灵感会有帮助，但 `Junghan` 受其他作品的影响更大。“我见过其他艺术家的海洋作品。最令人深刻的地图是\
  \ `Blockworks` 的《深海》。”《深海》描绘了一个水下实验室，与《海洋日记》相比，它的色调明显更加暗淡、寒冷。它确实符合 `Junghan` “可怕但很有趣”的标准。在将《深海》描述为“一个非常完美的安排”时，`Junghan`\
  \ 在制作自己的地图时经常提到它。他并没有尝试重现另一个建筑团队的作品，而是钦佩它，并利用他们建造的内容作为自己处理海洋方法的基础。在这种情况下，这是一个横跨在黑暗深海中的复杂结构，充满了待探索的生命。\n\
  \n![](img/MMB_seadiary_fullbleed_7.jpg)\n⬢ 黄色和橙色的点缀让城市的深色部分脱颖而出。\n\n`Junghan` 很快赞美其他建筑师，但他对自己的建筑能力并不总是那么乐于赞美。“当我开始这项工作时，真的认为自己缺乏建筑技巧。我的很多朋友都非常擅长建筑，我真的觉得和他们相比很落后。”现在看到他完成的作品时，对这种说法很容易嗤之以鼻，但遗憾，负面地与他人比较是一个非常让你丧失建筑动力的方法。坦率地说，与其放弃，`Junghan`\
  \ 向自己做了一个承诺，坚持完成《海洋日记》。\n\n这一直不是一个容易遵守的承诺。“花费大量时间独自制作每一个高细节、高品质的作品真的很难。我实际上尝试改变过几次故事和主题。它们会根据我当时的心情和感受而改变，迫使我花费许多小时编辑建筑和地形。”\n\
  \n\n\n\n\n然而，不断调整如此规模的建筑带来的挫败感，最终为 Junghan（俊翰）提供了他想要坚持的主题和故事。“在某个时刻，我想我在构建这张地图上花费的所有时刻都可以成为故事本身，这个想法引导我创作了《海洋日记》。”\
  \ 你们知道，这个同名的日记并不是一本装满了某人掉进海里的个人秘密的书。这个建筑本身就是一本日记。Junghan 将这个水下场景的不同部分视为他在整合它们时情感状态的反映。当你穿过它并进行探索时，它是一个模糊的、开放供解读的叙事。当\
  \ Junghan 制作那条眼神狂野的鲨时，他在感受什么？\n\n当 Junghan 在网上分享《海洋日记》时——这是一个冒险的举动，因为从技术上说来说这是他的日记——社区立即对其对细节的关注以及对\
  \ Minecraft 海洋可能性的新颖方法表示赞誉。令人高兴的是，这些赞誉似乎进入了他的心里。“通过这项作品，我觉得我找回了许多自尊和自信。更重要的是，我很自豪我想要做这件事，并且通过完成它遵守了对自己的承诺。完成它是因为我想做。那是最幸福的事。”这花费了三个多年的制作，但现在\
  \ Junghan 拥有了一个卓越的建筑、焕然新的信心，以及一本必读的日记。\n\n![](img/85.jpg)\n\n⬢\n右上角和右下角 | 一条巨大的鲨冲向一群毫无防备的鱼群。\n\
  \n⬢\n左下角 | 斑鱼是 Junghan 仔细重刻的许多海洋生物类型之一。\n\n![](img/88.jpg)\n\n## 值得一看的景观\n\n在开发《海洋日记》期间，Junghan\
  \ 与两位高水平的艺术家 `LNeoX` 和 `LordKingCrown` 合作。他们对建筑的原始渲染图对于帮助他找到观众至关重要。“一张好的渲染图能赋予建筑生命，”`LNeoX`\
  \ 说，“它捕捉到了观众应该看到的特定视角。对于大型建筑，在游戏中是不可能捕捉其规模和氛围的。这正是渲染图变得非常重要的地方。”\n\n“就像任何书或电影一样，如果预告片或封面艺术看起来不有趣，人们就不会理会它，”`LordKingCrown`\
  \ 解释了良好渲染图的重要性，“有些建筑在 Minecraft 默认状态下看起来很好，但通过渲染图，你可以真正看到所有的细节。你可以帮助实现原始建造者所设愿景。”优秀的渲染图不能让糟糕的\
  \ Minecraft 建筑变得漂亮，但极出色的渲染图可以让美丽的 Minecraft 建筑达到新的高度！或者在这种情况下，是新的深度。\n\n![](img/89.jpg)\n\
  \n⬢\n除了海洋生物外，Junghan 还为他的虚构公民制作了用于旅行的水下交通工具。\n\n“我很自豪我想要做这件事，并且通过完成它遵守了对自己的承诺。完成它是因为我想做。那是最幸福的事。”\n\
  \n![](img/MMB_seadiary_isometric_1.jpg)\n\n## 有些“鱼”味（腻）（注：此处为英文双关语，既指鱼类，也指可疑/诡异的事）\n\
  \n在《海洋日记》中，你可以找到二十八种不同的鱼，包括一群基于蜜蜂块的生物，毫无疑问，它们既可爱又可吃。Junghan 使用玻璃板营造出一种逐渐消失的尾巴视觉效果。一个带有两个按钮当眼睛的蜜蜂块证明了有时最简单的想法是最有效的。Junghan\
  \ 用一个萤石块做了这条鱼的“身体”，确保他的建筑深度充满了光源，即使没有渲染图也是如此。他的建筑体现了 Minecraft 作为一种互动媒介的特性；它是截图的美好素材，但也非常好玩。在他们的家里周围游了几分钟后，你会羡慕这些奇妙的鱼！噢，也许鲨鱼嘴里的那些除外。\n\
  \n# 第十章\n\n### 月球毁灭：太空前线\n\n作者：Maggie Gondo Wardoyo & Arkha Satya Taruna\n\n![](img/MMB_Moondestruction_fullbleed_11.jpg)![](img/MMB_Moondestruction_cutout_2.jpg)\n\
  \n在 Minecraft 中，还有什么东西比高度限制被建筑社区更肆意轻视吗？当《月球毁灭》被创造时，建造者本不应该超过 256 格，但热爱太空的作者们根本不在乎这些陆地的限制。他们快乐地向星辰冲刺。毕竟，能出什么差错呢？\n\
  \n嗯，根据《月球毁灭：太空前线》中描述的灾难，出了大很多问题。它本质上是三个建筑合一：这艘船在任何太空游戏中看起来都很令人印象深刻，更不用说在一个基于坚实地面的创作游戏了；那个孤独的宇航员，虚弱地系在飞船上，他在危机中保持冷静值得受到表扬；以及一次看起来不那么友好的陨石撞击。这个建筑描绘了现实宇航员可能会为此失眠的事故，而且根据共同建造者\
  \ Maggie Gondo Wardoyo 和 Arkha Satya Taruna 的说法，建筑的那个部分实际上是一个意外。\n\n“我用 `WorldEdit`\
  \ 把月球表面的一个部分复制得太深了，”Maggie 解释道那场爆炸是如何产生的，“Arkha 在制作形状方面更擅长。他有一个想法，是把表面变成被陨石击中的损毁部分。”\n\
  \nMaggie 和 Arkha 都来自印度尼西亚，他们是一对建筑搭档，尽管在 Minecraft 领域拥有了各自的职业，尽管 Maggie 起初并没有完全被这个建筑游戏说服。“诚实说，我觉得\
  \ Minecraft 因为画质的原因不是一个好游戏——请不要觉得被冒犯——现在我完全不这么认为了！”即使有这种认知，也没有阻止她和 Arkha 建造出真正宏伟的东西。\n\
  \n抛开不谈，是游戏的潜力和多样性最终说服了她。“在这里你可以做一切，从建筑、编程、玩小游戏到仅仅生存。这就是为什么我觉得 Minecraft 不仅仅是一个游戏。它还是通过艺术传递信息的媒介。“游戏对我来说就像一块画布，”Arkha\
  \ 说，他也是 Minecraft 的大粉丝，“我可以创造现实世界中无法做到的任何事情。”确实，但在 Minecraft 中制作一整个月球也不是什么容易的事。“我们完全在游戏中制作月球，花费了大量时间，因为它太大了，”Maggie\
  \ 说。巨大的规模意味着他们在建造时甚至无法看到月球的全貌。“我们不得不猜测它看起来是否足够好！”她说。尽管有这些限制，他们精心构建的陨石坑形成了一个比“足够好”高出几个级别的月球。尽管，知道这些建造者离开太空时，把自尊留在了地上。\n\
  \n![](img/91.jpg)\n\n⬢\nMaggie 和 Arkha 希望他们的飞船充满真实的细节，如雷达天线、窗户和工业感设备。\n\n![](img/91b.jpg)\n\
  \n⬢\n左侧 | 令人印象深刻的爆炸。\n\n⬢\n右侧 | 正面视角提供了色调上的强烈对比，从火焰的暖色调到飞船的冷色调。\n\n![](img/MMB_Moondestruction_fullbleed_13.jpg)\n\
  \n## 星星故事\n\n在 Maggie Gondo Wardoyo 在 `WorldEdit` 中的意外在他们的月球上留下陨石坑后，这对组合为他们的建筑构思了一个全新的场景。“我们想到月球被陨石击中影响了地球的生活。因此，他们派遣了一些去月球观察并分析到底发生了什么。”可能在太空中由于著名的听不到尖叫声是件好事，因为他们将面临一个巨大的冲击。\n\
  \n![](img/MMB_Moondestruction_cutout_3.jpg)\n\n⬢\n一个友好的宇航员，其宇航服受到电影《星际穿越》的影响。\n\n\
  \n\n\n\n摧毁真实的月球可能比组装这个“月球毁灭”建筑容易得多。当被问及建造中最困难的部分是什么时，这对组合基本上表示是所有部分。“每一个部分都有不同的挑战，而且几乎每个地方都需要等程度的注意力，”Maggie\
  \ 说道。然而，特别关注被放在了主导场景的飞船上。“我们投入了额外的精力制作它。因为尺寸巨大，所以花了很长时间。此外，我们还需要确保细节与飞船的形状完美融合，并且构图不会因为月球和宇航员而显得过于拥挤。”因此，他们必须在建造一艘巨大飞船的同时，时刻记住它不要抢夺场景其他部分的视觉。现在，宇航员没有绝望地抱头，这显得更加令人印象深刻。\n\
  \n空间无尽的黑色背景可能会损害你的比例感。毕竟，只有当画面中出现一个微小的行星时，死星看起来才具有威胁性，这有助于彰显那艘致命飞船的恐怖威力。Maggie 和\
  \ Arkha 通过两种方式实现了这一点：一种让宇航员站在飞船外（为这个可能变得过于冰冷和机械的建筑增添了良好的人情味），另一种是在比例和细节上都下大功夫。飞船覆盖着独特的图案、技术装置、窗户、雷达天线等，一切都在一个统一的设计中。它是一艘通往星际的容器，具有极强的体量感。\n\
  \n“这是一种非常灵活的方法。它一直在变化……最后最后我得到了一些东西。一些在开始时完全失控的东西！”\n\n“我们研究了电影《星际穿越》中的场景，”Maggie\
  \ 解释道，这是这对组合为他们的飞船所做的研究。“我们寻找了火箭和空间站的图像，以便很好掌握空间环境。”至于积木，他们寻找了具有“蓝灰色调”的方块，如青色粘陶土、石块和浅灰色混凝土，并用黄色方块做条纹，黑色方块标记门。对于这样一个庞大的机器建筑来说，这个调色板可能看起来很小，但它让他们的构造看起来既整洁又内敛，就像它所代表的尖端技术一样。特别是与飞船正在运行的、刻意混乱的陨石撞击形成对比。\n\
  \n![](img/MMB_Moondestruction_fullbleed_4.jpg)\n\n⬢\n\n⬢宇航员为场景提供了比例感。\n\n你可以从火焰中最清楚地看到这种对比。陨石撞击产生的火焰是黄色和橙色的尖锐角度，在黑色的太空中格外醒目。而飞船引擎喷出的火焰使用了蓝色和白色的火焰，边缘圆润，暗示着一种在太空中受控的旅行。\n\
  \n“我们寻找纹理与我们尝试重建的对象原始材料尽可能接近方块，”Maggie 解释道。“对于宇航服，我们使用了白色羊毛、石英——因为我们的宇航服参考是白色的。我们还使用石块作为设备细节的材料。”NASA\
  \ 可能不会批准一件由石头制成的宇航服，但在这里它看起来确实像一回事。再次，小范围的颜色选择是一个刻意的决定，有助于衣服看起来像实物。隐藏宇航员脸脸的深色面罩也为建筑增添了神秘感，这意味着他们不需要担心方块化的人头重塑——这在\
  \ `Minecraft` 中总是很难复制——会破坏建筑的真实氛围。\n\n但一旦你完成了外太空的任务，你还会大胆地向何方去？在通过 `Minecraft` 发现对建筑的热爱后，Maggie\
  \ 继续学习了建筑学。毕业后，她现在任于 `Rewrite Media`，为 `Minecraft: Education Edition` 制作内容。“`Minecraft`\
  \ 造就今天的我，”她说。Arkha 也有类似的故事——他现在领导 `MIVUBI`，这是一个帮助开发印尼西亚 `Minecraft` 社区的团队。“我们成功地将\
  \ `Minecraft` 作为展示艺术品的媒介，并与印尼的艺术基金会 `Jogja Biennale` 合作，”他说。通过团队合作扩展 `Minecraft`\
  \ 功能的可能。看来，突破高度限制和探索外太空只是这对创新双人雄心的开始……\n\n## 额外建筑\n\n### 神之圣所与苦力怕仔朋克风\n\n![](img/98.jpg)\n\
  \n#### 神之圣所\n\nArchanee 和 `AutomailED` 创建了这个场景作为农历新年的庆祝。它包含了中国的四大守护神：青龙、白虎（原文误译为白白豹）、朱雀和玄武。在中国神话中，这些守护神分别守护着世界的四个方向——北、南、东、西——但\
  \ Archanee 和 `AutomailED` 将守护神放在了不同的区域，给人一种他们正在移动的印象。\n\n![](img/Rendered_by_AutomailED_Night_1_.jpg)\n\
  \n#### 苦力怕仔朋克\n\n这座赛朋克城市是 Archanee 和 `AutomailED` 尝试想象未来时设计的。正如你所预期的：摩天大楼、巨大的全息投影、传送门和甜圈店。一旦这对确定了他们想要的设计，他们花了四个月完成建造。他们巧妙地利用了城市内的灯光，因为没有大量霓虹灯的未来大都市算什么呢？夜晚观看时尤为印象深刻，因为广告牌和全息投影为城市带来了戏剧性的氛围。\n\
  \n![](img/Rendered_by_AutomailED_Daytime_2_.jpg)\n\n# 第十一章\n\n### 毅之庙\n\n作者：Sander\
  \ Poelmans\n\n![](img/MMB_TempleOfFortitude_fullbleed_4.jpg)![](img/MMB_TempleOfFortitude_cutout_2.jpg)\n\
  \n勇气（Fortitude），在逆境中表现勇敢，是你能拥最有价值的特质之一。因此，一个名为“毅之庙”的建筑引人注目。这个名字指的是什么吗？在水中建造毕竟是非常勇敢的。也许它指的是它的建造者，一个展示了壮丽勇气的人？“诚实地说，我起这个名字只是因为它听起来很酷，”毅之庙的建造者\
  \ Sander Poelmans 解释道。事实如此。\n\nSander 对建筑有一个有趣的规划阶段——在找到灵感之前，他不想在建筑上放置一个方块。“对于这座庙，我深受一位名为\
  \ Mari K 的伟大像素艺术家的启发。”这是一个有些不幸的灵感来源，因为 Sander 震撼的特定 Mari K 作品包含了蓝色圆顶屋顶和细长的矩形窗户。圆顶确实是\
  \ `Minecraft`（一个由于热爱方形且只有一种默认窗户的游戏）中最难复制的元素之一。Sander 不得放弃他的梦想建筑。或者那会是背景故事？“当我找到灵感后，我会开始放置最大的形状，以便很好掌握建筑的整体形状和构图。一旦对形状满意，我会开始放置屋顶和塔楼。最后我开始放置窗户、树和其他细节和纹理。”Sander\
  \ 让这些步骤听起来很简单，但这是一个详尽的过程，包含了一些其他的外部影响。“我并没有真的为这座庙研究过真实的寺庙，但我确实利用了其他的参考。这座建筑使用了真实和虚构风格的混合。塔楼受到拜占庭建筑的启发，而较平坦的屋顶受到地中海建筑的启发。但大部分都是根据感觉制作的！”\n\
  \n![](img/MMB_TempleOfFortitude_fullbleed_1.jpg)![](img/99.jpg)\n\n⬢\n\n⬢ 庙的不同层级像一个巨大的时尚的楼梯一样合在一起。\n\
  \n![](img/MMB_TempleOfFortitude_fullbleed_11.jpg)\n\n⬢\n\n\n\n\n这座宏伟寺庙上的圆顶屋顶是拜占庭建筑的核心特征之一。\n\
  \nSander 选择用四种关键颜色来建造他的作品，以产生强烈的对比。“对于建筑的地基，我使用了白色混凝土。使用非常素的颜色作为底色，可以让你更容易在细节处添加颜色！对于屋顶，我使用了红色砂岩和棱砂岩砖。我非常喜欢这些颜色组合在一起的效果。”但\
  \ Sander 觉得建筑中似乎缺少了什么。“这就是为什么我在后面制作了巨大的粉色树木。我混合了白色混凝土和白木木头，叶子是由游戏游戏中所有的粉色区块制成的。”幸运的是，Mojang\
  \ Studios 包含了足够多不同种类的粉色区块——如混凝土、玻璃和羊毛——帮助这些叶子脱颖而出。\n\n在 Sander 开始将建筑拟人化之前，他在大约十年前首次接触了\
  \ `Minecraft: Pocket Edition`。“我和一个朋友在刷屏幕时偶然发现了它。”这种心不在焉的浏览导致了他在 `Pocket Edition`\
  \ 中八年的点点时光，直到 Sander 的野心超越了这个版本的 `Minecraft`。“大约两年前，我切换到了 `Java Edition`，因为我想做更多大规模的建造。`Java`\
  \ 支持的工具和模组在这方面是优越的！”\n\n![](img/MMB_TempleOfFortitude_fullbleed_2.jpg)\n\n⬢\n\n\
  一个被水环绕的独特结构——寺庙看起来像是从海洋中浮现出来的。\n\n![](img/MMB_TempleOfFortitude_cutout_5.jpg)\n\n\
  ⬢\n\n巨大的粉色树是 Sander Poelmans 在坚毅神庙中最喜欢的部分之一。\n\n他离开 `Pocket Edition` 转向 `Java` 是因为他想建造更大的建筑，这完全适用于坚毅神庙。这座同名的寺庙规模巨大，但\
  \ Sander 成功地通过使用 `WorldEdit`（一个流行的 `Minecraft` 插件）加速了进程。即使是像那些盛开树木这样的“背景细节”，本身也是大规模建筑。“很难说哪部分最让我满意，但如果非要选一个的话，那就是那些巨大的粉色树。我在它们上花了至少整整两天时间。我真的很喜欢它们看起来。”Sander\
  \ 感到自豪是正确的——在一个由立方体组成的创作游戏中，处理曲线是出了名的难题，而那些花朵看起来自然地从树枝流出的样子也绝非易事。\n\n如果 Sander 再次回到坚毅神庙，他将通过添加更多区块来扩大建筑的地基。“这样在大片平坦的白色区域看起来会更有趣一些。我可能会尝试包含一些酷炫的新区块，比如方灰岩、白色混凝土粉和骨块！并添加一些小拱门、凹槽和图案！”\n\
  \n但这些是他认为建造者不应该纠结的观点。“我能给出的建造如此大型建筑的建议是不要卡在小细节上。这种规模的建筑最重要的部分是形状和你所用区块的选择，因为这些是你最容易注意到的。在尝试你想添加什么类型的窗户之前，最好花大量时间把形状做对。”Sander\
  \ 确保搞定了核心部分，然后用丰富的细节装饰结构，并通过给他的寺庙起一个戏剧性的标题来庆祝完成。\n\n# 第十二章\n\n## 浅山市\n\n由 浅山制作委员会出品\n\
  \n![](img/MMB_Sayama_fullbleed_5.jpg)![](img/MMB_Sayama_cutout_6.jpg)\n\n你在 `Minecraft`\
  \ 建造上花费的最长时间是多久？一周？一个月？还是在因为苦力哥炸了而愤怒退出前的二十分钟？所有这些令人印象深刻的时间投入在浅山市高耸入云的摩天大楼面前都显得白无力，这个项目在本书出版时，由建造团队\
  \ `浅山制作委员会` 已经建造了八年。八年，而且还在增加！但当这个想法如此雄心勃勃时——基于日本各地的真实城市来打造一整座城市——你突然就能看出九多个月的建造花在了哪里了。\n\
  \n“我在网上看到了一个 `Minecraft` 视频并留下了深刻印象。我觉得这是一个很棒的游戏，并决定玩玩，”他们的建造团队代表兼创始人说道，他选择保持匿名。这是\
  \ 2012 年的事，在 `Minecraft` 的早期，`浅山市` 项目在一年后开始。最初的概念是“建造一座日本城市”，他们并没有直接复制某一个，而是借鉴了来自日本各地的影响。尽管日本有几个真实的地方被称为“浅山”，但这个建筑并非基于真实地点——它是一个有很多现实世界影响的虚构城市。\n\
  \n最初，这座城市只是一个建造者的作品。但如果一直保持那样，它永远无法达到今天的高度和规模。“我们意识到我们需要许多人的合作来创建一个大型地图，所以我们在[首次]发布该项目时，寻找了当时可以帮助我们的人，那时团队组建了。”这是一个组建建造团队的聪明方法：向社区展示你在做什么，然后招募对此产生回应的建造者。\n\
  \n`浅山制作委员会` 成立了，这是一支“想要制作以前没有人过的东西”的团队。这个团队恰恰实现了这一点。在 2012 年，社区在 `Minecraft` 中建造的大型城市稍少见，但它们是今天许多建造者的热门选择，全球大部分已以立方体的形式描绘。然而，`浅山市`在细节和纯粹规模上仍然超过了大多数此类项目。它是那种你必须放大才能反复检查自己是否还在看\
  \ `Minecraft` 的建筑。\n\n“我们意识到我们需要许多人的合作来创建一个大型地图。”\n\n![](img/107a.jpg)\n\n⬢\n\n\
  `浅山制作委员会` 致力于建造一个真实的城市。现实中的城市规划师考虑的微小日常细节，例如停车场、高公路桥和为平民准备的居住区。\n\n![](img/107b.jpg)\n\
  \n⬢\n\n这座迷人的蓝色摩天大楼高耸屹于其他天际线之上，无疑是一个建筑师的热爱项目。汲取了不同的文化和建筑风格，包括传统的日本寺庙。\n\n![](img/MMB_Sayama_fullbleed_20.jpg)![](img/MMB_Sayama_fullbleed_21.jpg)\n\
  \n⬢\n\n描述 `浅山制作委员会` 风格最好的词是写实。他们制作了真实的城市生活细节，如行人横道和生长在路灯旁的小植物。\n\n![](img/110.jpg)\n\
  \n⬢\n\n浅山市居民的购物习惯在这里得到了很好的照顾。无论他们是想在美食大广场吃午饭、购买最后时刻的礼物还是挑选一整套新衣服，都有商店满足各种选择。\n\n\
  当你进行这种规模的建造时，显然无法负担起挑剔。“我们使用所有的区块……每个区块都有它自己的用途。”这很容易变成一个色彩斑斓、视觉色调过于混乱的灾难。相反，这支团队展现了令人令人克制，同时也利用了游戏提供的所有工具。\n\
  \n\n\n\n建造者们最令自豪的是，他们坚持了最初的理念。但随着多年推移，他们难道没有动过妥协缩小野心的念头吗？“我们尝试过让它更大，但从未尝试过让它更小，”他们说道，对任何缩减团队想法的建议都不予理会。这显然是一群相信“大即是好”的建造者。原本可能只是一堆令人印象深刻的摩天大楼，实际上却具有美感的多样性和清晰划分的区域。如果不是像摩轮这样的大地标建筑在由致力于完善每一个小细节（无论这些细节多么平凡或看似不足道）的玩家精心建造的非奢华建筑作为背景，它们绝不会如此令人印象深刻或震撼。\n\
  \n![](img/118.jpg)\n\n## 地标建筑\n\n对于一座无名的城市来说，佐山（Sayama）充满了极具戏剧性的地标建筑。佐山制作委员会从现实世界的建筑中汲取了灵感，例如京都塔。团队还对天际线的突出部分创造了自己的独特见解，例如放置在住宅区普通公寓楼顶部的这个巨大的红白相间的摩轮，就像所有普通的游乐场设施一样。\n\
  \n![](img/111a.jpg)\n\n01 除了道路外，佐山制作委员会还考虑了高速公共交通。主火站在位于体育中心正后，轨道遍布整个城市。\n\n02 这座体育中心包含一个田径场，其华丽程度足以让最顶尖的学校。他们甚至配备了泛光灯。\n\
  \n03 足球场看起来如此真实，那因为团队确保使用了准确的比例。\n\n04 如此大面积的城市建筑可能会充斥着灰色，但团队仔细地添加了一些人工绿化。这对这个社区来说是一个非常真实的笔触。\n\
  \n05 建筑内部对细节的关注令人惊叹。注意那些仔细铺设的路面标记。\n\n![](img/111b.jpg)![](img/114.jpg)\n\n⬢\n顶部\
  \ | 随着城市的增长，人口也随之增长。团队创建了几个不同的住宅区，里面满了可爱的家庭房屋。\n\n⬢\n底部 | 佐山制作委员会甚至为他们的郊区构思了一个古怪的邻居。那栋设计风格与周围其他格格不入的房屋。\n\
  \n这种多样性可能归功于有许多人在佐山城市共同工作，尽管在规划建造时存在等级之分。“我和其他关键成员一起起草了计划，”他们的代表解释道，“团队有五十多人，我们通过\
  \ Discord 进行交流。”团队通过语音聊天和消息混合的方式进行工作，由于极少面对面会议，因为参与者来自日本的不同地区。这是在与不同的建造团队交流时反复提到的一点：沟通是成功协作的关键。确保你们不断向彼此更新信息，你们就会看到更好的结果。\n\
  \n团队的计划通常可以总结为“表达日本城市的复杂性，并将其变形为 Minecraft 中可以创建的尺寸”。你能找到一种他们没能挤进这座建筑当的城市生活元素吗？电子广告牌、停车位、办公楼、似乎涵盖了你在日本能找到的每种建筑风格的摩天大楼。这仅仅是触毛一角，然而建造者仍然希望城市的范围能更广阔。如果他们今天才开始这项建造（请不要鼓励他们放弃八年的心血），他们认为这将基于“世界各地的城市，而不仅仅是日本”。想象一下看着这座建筑并认为它不够有野心，你就会开始了解那种有足够的决心从一开始就创建一个如此规模城市的心态。\n\
  \n可以理解，大多数建造者都是从小开始并循序渐进。当然，这里有很多这样的例子，较小的建筑让较大的摩天大楼感觉像是一个活着的、呼吸着的城市的一部分。但佐山制作委员会显然不是那些甘于平庸的建造者。“观察你想做什么并实现它很重要，”他们说。你可能需要八年的空闲时间来实现你的愿景，但当结果将\
  \ Minecraft 城市的标准提高到如此种程度时，八年又算什么？\n\n![](img/115.jpg)\n\n⬢\n左上角 | 这可能是大城市拥有过的最清澈的河流。宝石蓝的水流穿过佐山城市，在扩张的城市丛林中提供了一丝对自然的窥见。\n\
  \n⬢\n右上和底部 | 直升机停机坪和机械雕像。你能想象出有什么比这与现代城市景观更具代表性的吗？\n\n# 第十三章\n\n## 繁华的中世纪城镇\n\n\
  作者：Minecrafttalsi\n\n![](img/MMB_fortified_town_fullbleed_2b.jpg)\n\n### 材质包\n\n\
  ◾ Conquest Reforged（来自 Conquest）\n\n![](img/Windmill.jpg)\n\n到目前为止，Minecraft 中建造的中世纪城镇可能比现实中世纪时期还要多。这非常契合，因为\
  \ Minecraft 的世界一直有一种强烈的中世纪幻想美学，拥有木质和石质结构、略微原始的工具以及潜伏在黑暗中的可怕巨龙。难怪有许多建造者以该主题为核心并投入其中。像\
  \ Minecrafttalsi 这样的建造者，这座“繁华中世纪城镇”的设计师，他专注于创作中世纪生活的小片段，每一段都是他多年来创作的大型幻想世界的一部分。“我想中世纪幻想设定正迷着我，对于一个中世纪幻想地图来说，还有什么比城镇和城堡更具标志性的呢？”\n\
  \nMinecrafttalsi 在 2011 年早期发现了 Minecraft，当时游戏还处于测试阶段。“我当时正在浏览 YouTube，发现了一个关于一个新游戏的视频。我开始在生存模式下玩\
  \ Beta 1.6 版本（那是唯一的可用模式），并且玩得很开心。”但 Minecrafttalsi 总是对 Minecraft 的建筑部分更感兴趣。一旦加入了创造模式，他就再也没有回头。“时光一转十年后，我制作了许多地图，并在游戏中投入了无数的小时。这仍然是释放我创造力的绝佳方式。我可能短期内不会离开！”\n\
  \n在与 Minecraft 相处十年后，Minecrafttalsi 拥有了丰富的建筑作品集，包括如中海墓地和蓝鲸骨骼等各样的创作。没那么阴森的是，他制作了许多中世纪建筑，包括庄园、修道院，甚至还有马和车的设计。“从一开始开始，我的目标就是为他人创建一个可以下载和探索的某种\
  \ RPG 世界，”他解释道。目标不仅仅是建造一个视觉上舒服的东西——他想创建一个让你在其中迷失的 Minecraft 幻想世界。\n\n并不是说他有这种风险，因为在开始正式建造之前，他会细致地规划他的作品。“我总是先规划最粗略的基础要素，”他在描述自己彻底的过程时说道。\n\
  \n![](img/121.jpg)\n\n⬢\n左上和底部 | 木结构的房屋确定了城镇的时代。\n\n⬢\n右下角 | 俯视图显示了躲在教堂后面的市场位。\n\
  \n![](img/122a.jpg)![](img/122b.jpg)\n\n⬢\nMinecrafttalsi 发现了一些可以添加到他的城镇中的有趣细节，例如喷泉和木制摊位。\n\
  \n\n\n\n\n“城镇将走向何方、城堡建在哪里、哪里留农田等，我通常会先对该区域画一个简单的草图。然后我标记出所有的道路、房屋位置、围墙等等。我在游戏内使用不同颜色的羊毛块来完成这一切。”在投入建造之前，使用占位块是了解地形布局的明智方法，而且几乎没有忘记替换这些占位块的风险——因为当玩家们发现你的“中世纪教堂”是由粉色羊毛制成的时，他们往往会注意到的。对于这座特定的城镇，Minecrafttalsi\
  \ 从规划主路和城门的位置开始。“城镇的中心，也就是所有道路汇合的地方，必须是市场和教堂。”然后，他随手确定了各个小巷和房屋的布局。“为了这一点，我也经常求助于手绘草图。我的抽屉里其实还留着很多这样的草图！”\n\
  \n为 Minecrafttalsi 计划不仅仅是填满写生本。他非常相信寻找参考照片，并更多地了解你正试图在 Minecraft 中重建的那个时代。“在开始建造之前做一些研究非常重要。这真的能让你了解某些定居点是如何以及为何形成的。”这让他对中世纪历史有了更好的理解，但他并不受制于此。“我个人并不追求历史上的完全准确——一个显而易见的例子就是那座巴洛克风格的教堂——我更倾向于尝试创建一个本身具有某种可信度的世界。研究真实的中世纪城镇对此非常有帮助，特别是在涉及到小细节时。”在一个其他地方保持中世纪风格的城镇中放置一座巴洛克教堂可能看起来并不寻常，但\
  \ Minecrafttalsi 太喜欢那个设计，以至于不想在这里放弃它。\n\n![](img/MMB_fortified_town_fullbleed_3b.jpg)\n\
  \n⬢\n\n这座巴洛克教堂可能不符合历史事实，但非常契合这种风格。\n\n![](img/125a.jpg)\n\n⬢\n\n城堡具有引人注目的木框架和抹灰墙。\n\
  \n## 跨越边界\n\n尽管半木结构房屋在设计上非常有德国特色，但影响这次建造的地点实际上是罗马尼亚的城市 Râsnov 和孚日山——这是位于法德边界的一个山脉。Minecrafttalsi\
  \ 被位于孚日山范围内的城镇所启发。它们美得简直不可思议，是 Minecraft Minecraft 中重建的完美素材。*Magnifique*（完美）！\n\n\
  ![](img/125b.jpg)\n\n⬢\n\n围墙围绕着整个城镇，保护它免受可能的攻击。\n\n![](img/129.jpg)\n\n⬢\n\n城堡内部也经过了装饰，假设中的村民被赋予了种有花的如画般的庭院。\n\
  \n“我总是尽可能使用大量的参考照片。大部分是现实世界的地点或建筑，但有时是艺术品甚至是游戏。”对于这座城镇，他的灵感主要来自德国的半木结构房屋。这些房屋拥有倾斜的屋顶，深色的木梁构成了美学的一部分而非被隐藏，这在中世纪晚期很常见，甚至可能追溯到\
  \ 12 世纪。然而，斜屋顶对于完全由立方体组成的游戏来说有点难以实现。为了应对这一点，Minecrafttalsi 在屋顶上增加了外露的梁，以帮助增强那种中世纪感。\n\
  \n创建一个连贯的城镇具有挑战性，但建造城堡被证明是最困难的部分。这是一个极其复杂的设计，因为他的城堡有着“复杂且有些杂乱的布局。我必须处理许多倾斜的建筑。”Minecrafttalsi\
  \ 没有去规划一个简单的城堡设计——那可能不符合时代设定——而是采取了某些“艺术自由”来使其设计在 Minecraft 中可行，再次从现实世界的历史风格中汲取灵感，而不受制于它们。\n\
  \n“我总是尽可能使用大量的参考照片。大部分是现实世界的地点或建筑，但有时是艺术品甚至是游戏。”\n\n![](img/MMB_fortified_town_fullbleed_1b.jpg)\n\
  \n## 模组时代\n\nMinecrafttalsi 努力为他的中世纪建筑寻找最准确的纹理。他希望他的城镇拥有一种真实的氛围。“地图不仅需要一个资源包，还需要一个模组才能运行。”他找到了一个模组——适用于\
  \ Minecraft 版本 `1.12.2` 的 `Conquest Reforged`——该模组提供了丰富的区块和纹理。\n\n“我绝对想在未来改变它。实际上我目前正在制作一张更真实的底图，目标是将整个城镇复制过去。”\n\
  \n那座城堡可能是最大的建筑挑战，但并不是他作品中最喜欢的元素。事实上，“作品中没有任何一个部分是我感到最自豪的。”相反，他最自豪的是“整个地方感觉是连在一起的。那是我个人最喜欢的一点。”\n\
  \n至于他会改变什么，Minecrafttalsi 的野心可能让他自己陷入了困境。“在我建造这座城镇很久以前，我就创建了底图。城镇位于一个被群山环绕的大山谷中。这在创建真实的河流和水体时被证明是非常局限的。所有的溪流都需要流向海洋。然而，由于周围所有土地的海拔较高，我无法让它实现。相反，该地区所有的河流都通向了某种湖泊，这在现实中是完全说不通的。”这是一个许多建造者会学会与之共处的缺陷，但\
  \ Minecrafttalsi 有着修复它的重大计划。“我绝对想在未来改变它。实际上我目前正在制作一张更真实的底图，目标是将整个城镇复制过去。”仅仅为了让河流更真实就复制整个城镇？有了这样的决心，Minecrafttalsi\
  \ 甚至可以在现实中建造一座城堡。\n\n![](img/130a.jpg)\n\n⬢\n\n在山谷中建造中世纪城镇提供了背景。\n\n## 为城镇上色\n\n\
  Minecrafttalsi 并不是想要创造一个压抑的中世纪再现。他希望他的城镇拥有一种真实的氛围，并确保使用了色彩来体现这一点。“我使用了一种更暖的色调，大部分是大地色调。尤其是红色和棕色。”他甚至修改了生物群，让草地呈现棕色，以与建筑保持一致。“我认为这为我想要的效果营造了合适的氛围。”\n\
  \n![](img/130b.jpg)\n\n⬢\n\n房屋和周围植被使用的色调营造出了一种年代感。\n\n# 第十四章：反乌托邦心态\n\n作者：Jossboy\n\
  \n![](img/MMB_DystopianMindset_fullbleed_8.jpg)[](images/MMB_DystopianMindset_cutout_5.jpg)\n\
  \n这个名为 `Dystopian Mindset` 的奇异头骨内文明是由 Jossboy 打造的。\n\n\n\n\n“如果你运气好的话，最后还能得到一些在隐喻上很有趣的东西。‘反乌托邦心态’这个标题……你可以把它看作是一个人被某种想法所吞噬了。这并不是我的本意，但如果你不知道这一点，你完全可以那样设想，对吧？如果你能获得正确的想法并偶尔将它们揉合在一起，有时就能点石成金。”\n\
  \nJossieboy 有时会预先决定他的主题，而另一些时候，这些主题会在他构建的过程中自然或无意中演变出来。每当这种情况发生时，他就会装作这些设计从一开始就是他的意图。“你只需要说：‘噢耶，我是打算这么做的。’”\n\
  \nJossieboy 在 2012 年接触了 `Minecraft`，当时他还是个青少年，离“骷髅之城”的想法在他脑海中诞生还有很久了。“我哥哥展示给我看，我几乎是直接被那种能够创造出东西的想法吸引了。我当时并不怎么喜欢\
  \ `Survival` 模式，因为我一直死。”但他显然非常喜欢 `Creative` 模式。“`Minecraft` 基本上就像一个巨大的乐高盒，你可以随心所欲地做出任何东西。正是如此让变得如此特别。”\n\
  \n![](img/MMB_DystopianMindset_fullbleed_10.jpg)\n\n⬢\n\n这座风格多样的城市还有一个巨大的鸭子雕像和几块数字广告牌，因为何不可以呢？\n\
  \n“我非常喜欢抓住两个概念然后将它们撞在一起，创造出有趣的视觉效果。”\n\n![](img/136a.jpg)\n\n⬢\n\n如果没有多种交通工具选择和一个可以为它们加油的加油站，记忆宫又算完整呢？\n\
  \n![](img/136b.jpg)\n\n⬢\n\nJossieboy 使用骷髅作为城市的基底，这意味着他的建筑是堆叠在一起的，呈现出拥挤的城市居住空间，非常反乌托邦。\n\
  \nJossieboy 为 `Dystopian Mindset` 结合的两个想法是“一个巨大的石脸……但也是一座城市？”这个想法在 Jossieboy 的脑海中发酵了一段时间，直到他在看到《复仇者联盟：无限之战》后最终受到启发去追求它。“他们访问了一个名为‘无名（Knowhere）’的地方。那是一个建在古代骷髅里的开矿镇。”‘无名’并不是一个普通的骷骨头——它本质上有行星那么大。“显然，我没有规模在\
  \ `Minecraft` 中建造那样的东西，那太宏大了。但一个文明住在旧头骨里并从中开采资源的想法，就是我从中获得的灵感。”在 `Dystopian Mindset`\
  \ 中甚至还有一个小小的开矿区，这是对漫威电影的刻意致。\n\n与其规划构建过程，Jossieboy 更倾向于直接进入 3D 建模。“我倾向于在 3D 中工作得更好。对我来说，用方块雕刻某些东西容易得多。我使用\
  \ `VoxelSniper`，它可以让你非常快速创建很多方块。所以首先我塑造了形状，从脖子和下颌开始。这是一个很容易制作的形状，因为它是一种拱形。我查看了各种参考资料，看看脸是如何构造的。”Jossieboy\
  \ 讲述了他如何一个一个方块地逐渐重建骷髅的解剖结构。“好的，我大概有一个嘴的形状和鼻形状，这必须延伸到眉骨、前额等部位。我慢慢塑造它的形状，然后把眉骨拼回去。我把头做得太大了，但没关系，因为我要摧毁它的大部分，然后把它拉回来。加上一些耳朵，我慢慢得到了这个头部形状。然后我只是不断地精炼它。”谁知道创造生命可以如此复杂？\n\
  \n一旦他完成了骷髅的基础形状，Jossieboy 制作了一个备份副本，然后在他想要建造建筑的地方开始了同样的流程。“我想在他另一只眼睛的地方有一个非常大的圆东西。我觉得如果模仿建筑的形状但让它看起来更电子化，会非常酷。它几乎是眼睛的一部分，但又不是。我标记了那里，然后开始在侧面盖房子。房子从他的眼睛散开，几乎就像肿瘤一样。我敢打赌那里有某种寓言之类的什么！”\n\
  \n![](img/MMB_DystopianMindset_fullbleed_7.jpg)\n\n### 壳公司\n\n这座骷髅内部的城市可能不是 Jossieboy\
  \ 最奇特的建筑。他构思的另一个惊叹的建筑概念是“一个寄居蟹有机雕塑，但在它的背后有一家拉面馆。”因为当然有。“一只小寄居蟹在拉面。它有一个小 `Zippo`\
  \ 打火机正在加热一碗面。因为，你知道的，它很小。我不知道为什么，但把一只寄居蟹放在它自己小餐馆的主厨位置，而那家餐馆还是它的壳——这对我来说看起来太可爱了。”`Dystopian\
  \ Mindset`——虽然没有那么古怪——但展现了同样的想象力。\n\n![](img/MMB_DystopianMindset_fullbleed_9.jpg)\n\
  \n### 眼睛之光\n\nJossieboy 对建筑中眼睛的成型感到特别满意。“主要的焦点是眼睛。”这非常恰当，因为焦点会将你的注意力最吸引到那里，而在 Jossieboy\
  \ 的建筑中，它真的是一只眼睛。“它看起来就像那里有一只眼睛，或者曾经有一只。但它现在不在那里了。我认为这是一个非常酷的想法——用一个不是真正眼睛的仿义眼来取代它。”\n\
  \n\n\n你可能会花费几个小时在这一图书馆宏伟的大厅中穿梭，每个房间都挤满了书籍，而记者们曾因这些信息而遭受迫害、入狱甚至被杀。Blockworks 还为图书馆策划了几个展区，通过艺术装置讲述了镇压自由的行为如何影响世界部分地区的故事。每一个展区都是根据其描绘的国家量身定制的。例如，在俄罗斯展区你会看到一只巨大的章鱼，被称为“数据利维坦”（Data\
  \ Kraken），它的触须代表了俄罗斯政府在网络监控和间谍活动对公民生活的长远触角。\n\n“我们试图寻找那些既有高度审查制度，又有很多人在玩《Minecraft》的国家，”无国界记者（Reporters\
  \ Without Borders）媒体与公共关系官员 Kristin Bässe 解释道。这些地区打压了自由表达，但没有审查《Minecraft》。这是一种聪明的变通方法，类似于无国界记者之前使用过的策略。\n\
  \n“他们之前做过一个名为‘未审查播放列表’（The Uncensored Playlist）的项目，”Blockworks 创始人兼执行经理 James Delaney\
  \ 解释道，“通过将被审查的内容偷偷带入歌词，然后将这些歌曲上传到 `Spotify` 来绕过媒体审查法。因此，那些不审查 `Spotify` 但审查这类内容的国家，本质上可以通过在\
  \ `Spotify` 上发布这张未审查的专辑被欺骗。”\n\n![](img/139a.jpg)\n\n⬢\n\n一座令人印象深刻的建筑宏伟入口。\n\n![](img/139b.jpg)\n\
  \n⬢\n\n左侧 | 一排排的书籍，每一本都代表该建筑所提供的一件被审查的作品。\n\n⬢\n\n中间 | Blockworks 发现墨西哥展区的设计最具挑战性。\n\
  \n⬢\n\n右侧 | 代表俄罗斯政府网络监控的“数据利维坦”。\n\n![](img/Uncensored_library_fullbleed_16.jpg)![](img/Uncensored_library_cutout_4.jpg)\n\
  \n## 埃及\n\n在埃及展区，你会看到一组高耸的天平，且一侧严重倾斜。“这是对正义之平的运用（在古埃及文化中，神阿努比斯会在这些天平上称量死者的心），并反映了该国司法系统在对待追求言论自由的记者时是多么偏颇，”James\
  \ Delaney 说道，“所有的房间、其中的创作或装饰或图案，都是为了与该国家的建筑风格或历史相协调。”\n\n![](img/Uncensored_library_cutout_2.jpg)\n\
  \n## 沙特阿拉伯\n\n在沙特阿拉伯展区，你会看到一个森严的笼子，其色调与图书馆大部分的美感格格不入。“那个国家的许多记者最终都入狱了，”James 说，“我们想要一些与图书馆的宏伟感相匹配，但又能代表那里的状况。选择黑曜石——最硬的\
  \ `Minecraft` 方块之一——是一个刻意的选择，旨在展示人们摆脱那种处境是多么困难。”\n\n![](img/Uncensored_library_cutout_1.jpg)\n\
  \nJames 从青少年时期开始玩 `Minecraft`，在服务器上与其他玩家见面，并稳步地构建更宏大的项目。“这逐渐变成了一份职业。我开始收到来自 YouTuber\
  \ 和影响者的订单，然后是 `Minecraft` 服务器，最后是 `Microsoft` 本身、公司以及各种想要获得 `Minecraft` 体验的人们。”\n\
  \n当无国界记者寻找能够帮助策划图书馆的 `Minecraft` 专家时，Blockworks 是完美的合作者。“成为一座地标性建筑很重要，”James 解释道，“显然，`Minecraft`\
  \ 中有很多惊叹的建筑，所以为了引起小孩子的兴趣，它不能只是一个小型的图书馆。它必须是宏大且令人震撼的。”最终，它的规模超过了一千万个方块。\n\n“我们参考了可能在牛津和剑桥等大学里看到的哥特式图书馆，”他在谈到灵感来源时说道，“我们最终采用了新古典主义风格，这实际上是许多殖民国家、许多政府以及许多独裁政权的常用建筑风格。他们倾向于这种特定风格，因为它宣示了某种权威。”\n\
  \n从独裁设计中汲灵感难道不是背离了图书馆想要代表的自由初衷吗？“使用这种风格是一种故意的，是为了颠覆它的原始意图，”James 说，“通过内部书籍的获取来反转它扮演的角色。重新利用新古典主义风格。”\n\
  \nÉtienne-Louis Boullée 是一位 18 世纪的建筑师，对于他的时代来说野心极大，是另一个大灵感来源。“他被称为‘纸上建筑师’，”James\
  \ 说，“他从未真正建造过任何东西，因为他所有的设计都大得离谱、华丽且壮。我们认为这绝对完美。他为艾萨克·牛顿设计了一个巨大的纪念碑，像一个巨大的球体。他为巴黎国家图书馆设计了一个方案，我们非常仔细地复制了它。”Boullée\
  \ 的宏伟设计在今天会被认为是不可思议的，更不用说在 18 世纪，遗憾的是他超前于那个时代的实现水平。跨越几个世纪，Blockworks 终于从中汲取灵感并实现了了他的愿景。“它几乎有一种科幻感，”James\
  \ 评价 Boullée 的作品时说道，“对于 1700 年来说，它的规模是史诗级的，而且与游戏非常匹配，因为在游戏中你不需要担心预算和物理限制。”\n\n![](img/145.jpg)\n\
  \n⬢\n\n左上角 | 代表全球审查的作品是一项艰巨的任务，无国界记者和 Blockworks 都非常重视这项任务。\n\n⬢\n\n右侧和左下方 | 宏伟的圆顶形状和风格来自世界各地的新古典图书馆。Blockworks\
  \ 希望设计能保持一种宏伟感和权威感。\n\n“这是一个困难的问题，因为我们最终是在一个由年轻人玩的电脑游戏里。”\n\n更大的担忧是如何取得正确的语调平衡，考虑到图书馆所展示的那些震惊且往往是悲剧的故事。“这是一个困难的问题，因为我们最终是在一个由年轻人玩的电脑游戏里，而我们还在处理极其敏感和困难的话题，”James\
  \ 说道，“我认为墨西哥展区是最挑战性的，因为那里有被杀害记者的纪念碑。有些人会说这不适合 `Minecraft`。但通过与无国界记者紧密合作，并确保表现方式足够敏感，与所有相关家属交流，我们认为可以用一种尊重的方式来完成，让人们意识到世界上面临的问题。”\n\
  \n这是一次冒险但值得的尝试，因为 `Minecraft` 帮助无国界记者触达了新的受众。“这是我们可以在他们所在地触达他们的方法，”Kristin 说，“不仅是玩家能看到图书馆，还有看\
  \ YouTube 视频或从朋友那里了解它的年轻人。这是一种非常具体的方式，向年轻人展示这实际上与你有关。它与你的人权、你获取信息的权利、在一个国家投票的权利有关，因为它与民主有关。”\n\
  \n这些知识并非仅仅通过在图书馆阅读来获得。《Minecraft》的多人功能还让来自世界各地的人在图书馆的服务器上相遇。“你可以在游戏中让一个埃及人和一个英国人联系，”Kristin\
  \ 解释道，“来自英国的人可以提问，比如‘那个网站在你们国家真的封锁了吗？’很难想象他们无法访问某个网站，或者因为点赞某条推文就被捕。”\n\n![](img/Uncensored_library_fullbleed_6.jpg)\n\
  \n⬢\n\n\n\n\n\n建造团队希望进入这个世界的第一眼是强大且鼓舞人心的。这成为了 Kristin Bässe 在整个建筑作品中最喜爱的元素。\n\n\
  “我其实真的很喜欢开头的那个拳头和笔的雕像，因为这是你第一次进入岛屿时看到的景象。”\n\n![](img/Uncensored_library_cutout_7.jpg)\n\
  \n展中展示了一些精巧的透视技巧。其中一个房间看起来充满了随机的悬浮方块。然而，从某个角度看，它们实际上拼出了“TRUTH（真相）”这个词。“那个想法是，在我们所考虑的这些国家中，很多时候你必须非常努力才能通过这些国家控制的媒体、反真理和假新闻找到真相，”詹姆斯说道。它还奖励了阅读图书馆内容的玩家——你必须站在书籍旁边才能看到隐藏信息。“这是另一种吸引玩家前往该位置的方法。”\n\
  \n无国界记者组织（Reporters Without Borders）对图书馆的反响非常满意，并对来自学校和大学的请求感到惊喜地。。“他们想将图书馆用于他们的讲座、演示或论文，”克里斯汀告诉我们，“玩家的反馈非常积极，甚至父母也是如此！我们收到了很多推文，父母们写道：‘我不知道游戏也可以这么有价值！’我认为参与这次活动的记者们对于他们能够触及与他们平时不同的目标受众感到很高兴。他们的文本正以我们所选择的这种创造性方式克服了审查，再次呈现在世上。”\n\
  \n克里斯汀个人最喜欢的图书馆部分是它介绍自己的方式。“我其实真的很喜欢开头的那个拳头和笔的雕像，因为这是你第一次进入岛屿时看到的景象。我认为它真的表达了我们想要展示的内容。但随后图书馆慢慢建立起来，因为通常它需要渲染一会儿，所以有那种‘噢，它在哪儿呢？’的时刻真的很棒。”随后，方块一个接一个地，一个自由信息的避难所开启了。这是一个直到今天仍在更新的极佳资源。\n\
  \n![](img/Uncensored_library_fullbleed_17.jpg)\n\n# 第十六章\n\n## 诺瓦莱斯城 (Nova Celes\
  \ City)\n\n### 由 Quantics Build 构建\n\n![](img/MMB_NovaCeles_fullbleed_9.jpg)![](img/MMB_NovaCeles_cutout_8.jpg)\n\
  \n一年可以发生很多事情。例如，你可以老一岁。或者，举一个稍微更有野心的例子，你可以在 `Minecraft` 中建造一个规模宏大的未来主义城市，它有八个不同的区域、可进入的内部空间，并且沉浸在细节中以营造尽可能的氛围。听起来一年内完成太难了？好吧，这正是法国建筑师\
  \ Ariux 和他的 Quantics Build 团队用 Nova Celes 实现的。为了满足一个严格的截止日期，他们对这个极具细节的未来愿景进行了不懈的努力。而那个截止日期距离未来还远远不够。\n\
  \n“我们在最后一天完成了地图，”Ariux 说道。时间掐得非常紧是一回事，而在必须提交的当天完成建筑是另一回事。但那个截止日期是无法推迟的。Nova Celes\
  \ 是为 City of Swagg 制作的，那是 YouTube Aypierre 举办的一项活动。它不仅仅是一个看起来壮丽的建筑——它必须像真实的城市一样运作，让\
  \ `Minecraft` 者能够与之互动，这意味着城市的许多内部空间也必须建造。“这非常、非常有压力，因为邀请了一百个 YouTube。所以你不能推迟期限。”\n\
  \n那些 YouTube 确实有很多可以探索的内容。Nova Celes 由一个中心城市和周围的八个不同区域组成。这些包括一个唐人街区、一个对复古游戏深怀敬意的区域，甚至还有一个“生物危害（Biohazard）”区域。最初的要求是“只是一个大、大城市，我们想要设定在未来的风格，因为这是我们最喜欢的建筑风格之一。”\n\
  \n建造团队花了六个月来规划 Nova Celes。在他们分配给建造城市的总时间的一半，仅用于准备建造它。并不是说这个规划阶段没有涉及任何方块——只是许多彩色的占位符。六个月后，“整个团队被动员起来建造所有的建筑并完成内部装饰。”\n\
  \n“这非常、非常有压力，因为邀请了一百个 YouTube。所以你不能推迟期限。”\n\n![](img/148a.jpg)\n\n⬢\n\nNova Celes\
  \ 的中心由一座高耸的白色结构、大量的绿地和顶部带有树的乌托邦风格公寓楼组成。\n\n![](img/148b.jpg)\n\n⬢\n\n左侧 | 每个区域都由一个巨大的雕像守护，这位战士俯瞰着唐人街区。\n\
  \n⬢\n\n右侧 | 在城市的围墙内，Quantics Build 放置了船，你可以想象公民如何在不同区域之间穿行。\n\n![](img/MMB_NovaCeles_fullbleed_7.jpg)\n\
  \n## 极佳 (Tree-mendous)\n\n知道何时授权是领导建造团队最重要的部分之一。Ariux 是一位才华横溢的建筑师，但他什么时候最好参与放置方块，以及什么时候最好退到后后让团队处理施工。幸运的是，当你与专家合作时，授权会变得容易得多。“我们有四位负责有机形状的建筑师。他们是法国著名的有机大师。”他们还有两名成员负责地形改造，Ariux\
  \ 为城市中许多树的建筑师表示特别赞意。“我们有一位树木大师，非常有名，他是造树的专家。我们说‘我们需要一棵这样的树’，他就能做出来，而且非常完美。”这些植被的作者是法国建筑师\
  \ `Cobra63`，他在 Twitter 简介中写道：“当我无聊时造树，所以……一直如此。”\n\n![](img/152a.jpg)\n\n⬢\n\nQuantics\
  \ Build 在水生区域的底部填充了水，并在建筑顶部放置了巨大的贝壳。\n\n![](img/152b.jpg)\n\n⬢\n\n巨树建筑的底部展示了 Quantics\
  \ Build 如何为他们宏伟的塔创造出这样的有机形状。没有压力。等等，全是压力。在距离截止日期只有六个月的情况下，Quantics Build 刻苦工作。即使是建筑中心——所有其他区域环绕的城市核心——也在短短两周内完成了。“这是一个巨大的挑战。我们有十五个人，我们必须完成中心部分，那里有那座巨大的白色建筑和大量的植被。这非常复杂。”\n\
  \n Ariux 能相信他竟然能在短短十四内搞定 Nova Celes 的中心吗？“实际上，我不知道我们是如何做到的！那是一个巨大的挑战。我认为最复杂的部分是制作氛围。”\n\
  \n这种热情渗透到了他们的建筑中——没有人看一眼 Nova Celes 会认为这不是不热爱 `Minecraft` 的人所做的——但有时限制团队的热情是 Ariux\
  \ 角色中一个必要的害恶之一。“我最喜欢的区域是唐人街区。它是我们的第一个区域。我们很笨，因为在上面花了很多时间。我们制作了切切。那里非常密集。有很多建筑。有很多氛围，很多餐厅……它非常、非常、巨大！”\n\
  \n\n\n\n\n这可能是他最喜欢的一个季度，但 Ariux 知道这种方法不可持续的。“我们在这个季度上花了两个月的时间，当时我说：‘伙子们，我们不能追求这种程度的细节。’所以对于某些季度，我们只有两周时间来建造。有时候某些季度非常困难，因为我们只有三或四名建筑师。那个水下建筑，我只用了两名建筑师在两周内建好了。”Quantics\
  \ Build 由大约十五到二十名建筑师组成，人数会发生波动。“我们可没少睡觉！”\n\n![](img/MMB_NovaCeles_fullbleed_1.jpg)\n\
  \n## 羊毛世界\n\n当你要在紧迫的截止日期前建造巨大的城市时，你最不想做的就是推倒自己的心血并从头开始。Quantics Build 投入了大量时间进行规划以避免这种情况，但他们仍然无法避免不断进行修改。“对于某些季度，建筑并不多，因为建筑建造时间很长——一个人就要两天——因为有大量的修改，而且他们还必须做内部装饰。”他们使用的一种新颖方法是先做一个“柔软”的城市，用羊毛块建成很大面积。“我们用羊毛施工是为了对建筑的体积有一个整体的概念。但重要的是，对城市的密度有一个概念。所有这些在之后都能帮助我们组装城市，看看哪里可以放置公园、餐厅、地铁等……”当你和完美主义者团队合作时，修改是不可避免的，但当你想在投入精细细节之前看看城市的形状时，可以考虑使用彩色羊毛作为占位块！\n\
  \n![](img/158.jpg)\n\n- **左上角** | Quantics Build 在他们的唐街区使用了大量的红色方块。在传统文化中，红色象征着好运和快乐。\n\
  - **左下角** | 团队用冒着烟的烟囱装饰了工业区，让人联想起十九世纪的工厂。\n- **右侧** | 建造的中心是最后一个季度，特点是具有更多绿化的结构——注意那两座墙壁和屋顶长着植物的建筑。还有一个中式拱门——被称为\
  \ `paifang` 或 `pailou`。\n\n二十三岁的 Ariux 在 2019 年创立了 Quantics Build，这在他第一次开始玩 Minecraft\
  \ 六年后。“刚开始，我认为我们只是一群为了艺术而玩 Minecraft 的朋友。”但随着他们承担了越来越多雄心勃勃的项目，他们意识到自己正稳步成为一个专业的\
  \ Minecraft 建造团队。Ariux 还在学习建筑，这对于一个如此出色的虚拟建筑师来说非常合适。遗憾的是，他在制作 Nova Celes 的同时正在做这些。“最近我完成了建筑学院的业。建筑学院非常、非常困难。有很多工作，对我来说，一边建造这个项目一边学习简直是一场噩梦。”\n\
  \n尽管都涉及建造，但 Ariux 发现他的建筑学习和他的 Minecraft 工作之间存在巨大差异。正是游戏中那种不受束的潜力最初就如此地吸引了 Ariux。“建筑的问题在于你有很多限制。你不能做你想做的事。这太粗鲁了！而在\
  \ Minecraft 中，你有可能创造一切。”Ariux 也喜欢多人协作方面，享受在建筑团队中工作，“因为它是想法的熔炉。这就是我喜欢 Minecraft 的原因，因为你可以和朋友一起做你想做的事，目标是做出最令人震撼的东西。”\n\
  \n“建筑的问题在于你有很多限制。你不能做你想做的事。这太粗鲁了！”\n\n![](img/MMB_ImperialCity_fullbleed_7_1.jpg)\n\
  \n## 谢谢\n\n### 作者的话\n\n首先，非常感谢每一位为了这本书接受我采访的建筑师。你们对 Minecraft 的热情以及你们通过它取得的惊人成就，讨论起来绝对是一种享受。等我中了彩票，我期待决定向你们中的某一个人恳求为我在现实生活中设计一栋房子。感谢\
  \ Alex Wiltshire，他提供了极佳的建议，并找到了书中大部分的建筑师。说真的，Alex，你难道认识每一个在 Minecraft 中建造过惊人作品的人吗？我认识的人还没够填满一个致谢页……\n\
  \n感谢 Ellie Stores，她将我的话编辑得通俗流畅，在不加评判的情况下回答了我所有愚蠢的问题（至少我希望是这样？），并删掉了一些极其糟糕的冷笑话，那些冷笑话会让你要求再别让我碰笔了。感谢设计师\
  \ Andy Leung 和 3D 插画师 Billy Budgen，让这本书的每一页看起来都不可思议地漂亮。感谢 Jen Simpkins 是一位才华的朋友。她曾告诉过我有一个叫“Minecraft”的游戏，我应该考虑玩玩并写关于它的文章。我不情愿地承认，事实证明那是非常好的职业建议。向\
  \ Adele Major 致以无限谢意，这位不起的制作人与我合作了几乎所有的 Minecraft 项目，除了这本书（但她仍然在书中受到了致谢——她太棒了）。最后，我想感谢我室友的狗，它只尝试——并失败了——用它不断的吠叫来破坏我的其中一个建筑师采访。尝试得不错，Odin。下本书好运！\n\
