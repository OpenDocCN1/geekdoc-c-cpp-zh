- fmt: '

    “Where the town will go, where to place the castle, where to have farmland, etc.
    I usually get started by making a little sketch of the area. Then I mark out all
    the roads, places for houses, the walls, and so on. I do this in-game using different
    colored wool blocks.” Using placeholder blocks is a smart way of getting the lay
    of your land before you commit to building, and there’s little risk of forgetting
    to replace those placeholder blocks, either – players tend to notice when your
    “medieval church” is made of pink wool. For this particular town, Minecrafttalsi
    started by planning out where the main roads and gates would go. “The center of
    the town, where all the roads meet, had to be the marketplace and the church.”
    Then he figured out the layout of individual alleys and houses on the fly. “For
    this I also often resort to manual sketches. I actually have a ton of these still
    in my drawer!”


    Planning for Minecrafttalsi isn’t just filling out a sketchbook. He’s a big believer
    in finding reference photos and learning more about the era you’re trying to recreate
    in Minecraft. “Doing some research before starting to build is very important.
    It really gives you an idea of how and why certain settlements formed.” This gives
    him a better understanding of medieval history, but one he’s not beholden to.
    “I personally do not build historically accurately – an obvious example being
    the baroque-style church – I’d rather try to create a world that is somewhat believable
    in and of itself. Researching actual medieval towns helps a ton with that, especially
    when it comes to the little details.” It might seem unusual to place a baroque
    church in an otherwise consistently medieval town but Minecrafttalsi enjoyed the
    design too much not to use it here.


    ![](images/MMB_fortified_town_fullbleed_3b.jpg)


    ⬢


    The baroque church that may not be historically accurate but lends itself well
    to the style.


    ![](images/125a.jpg)


    ⬢


    The castle features striking timber framing and stucco walls.


    ## Crossing Borders


    Though the half-timbered houses are very much German in design, the locations
    that most influenced this build are actually the Romanian city of Râsnov and the
    Vosges – a range of mountains on the French-German border. Minecrafttalsi was
    inspired by the towns located within the Vosges. Borderline ridiculously picturesque,
    they’re perfect fodder for rebuilding in Minecraft. *Magnifique*!


    ![](images/125b.jpg)


    ⬢


    The wall surrounds the entire town, protecting it from possible attack.


    ![](images/129.jpg)


    ⬢


    Inside the castle walls were decorated too, the hypothetical villagers were given
    picturesque courtyards, decorated with flowers.


    “I always use as many reference photos as possible. Mostly real-life locations
    or buildings, but sometimes artworks or even video games.” For this town, he was
    mainly inspired by German half-timbered houses. These houses, with their sloped
    roofs and dark wooden beams that form part of the aesthetic rather than being
    hidden away, were common in the late medieval period, perhaps even dating back
    as far as the twelfth century. However, a sloping roof is a little beyond a game
    consisting entirely of cubes. To counteract this, Minecrafttalsi added exposed
    beams to his roofs to help enhance that medieval feel.


    Creating a coherent town was challenging, but it was crafting the castle that
    proved to be the toughest part. It was an incredibly complicated design to create
    as his castle has “a complex and somewhat messy layout. I had to work with a lot
    of angled buildings.” Instead of planning out a simpler castle design – that may
    not have suited the period setting – Minecrafttalsi took certain “artistic liberties”
    to make its design work in Minecraft, again taking inspiration from real-world
    historical styles without being beholden to them.


    “I always use as many reference photos as possible. Mostly real-life locations
    or buildings, but sometimes artworks or even video games.”


    ![](images/MMB_fortified_town_fullbleed_1b.jpg)


    ## Mod-ieval Times


    Minecrafttalsi strived to find the most accurate textures for his medieval build.
    He wanted there to be an authentic atmosphere to his town. “The map requires not
    only a resource pack, but a mod to run.” He found a mod – `Conquest Reforged`
    for Minecraft version `1.12.2` – that also provides a wealth of blocks and textures.


    “I definitely want to change it in the future. I’m actually currently working
    on a more realistic base map and the goal is to copy the entire town over.”


    That castle might have been the biggest construction challenge, but it’s not his
    favorite element of his build. In fact, “there isn’t one single part of the build
    that I am most proud of.” Instead, he takes most pride in “how the entire place
    feels connected. That’s personally what I like the most.”


    As for what he would change, Minecrafttalsi’s ambitions may have resulted in him
    crafting himself into a corner. “Long before I built this town I created the base
    map. The town is located in a large valley surrounded by mountains on all sides.
    That turned out to be very limiting when it came to creating realistic rivers
    and bodies of water. All streams need to flow into the ocean. However, due to
    the higher elevations of all the surrounding land, I just couldn’t make this work.
    Instead, all rivers in this area just lead to some sort of lake, which realistically
    would make no sense.” It’s a flaw that many builders would learn to live with
    but Minecrafttalsi has major plans to fix it. “I definitely want to change it
    in the future. I’m actually currently working on a more realistic base map and
    the goal is to copy the entire town over.” Copying over an entire town just to
    make the rivers more realistic? With determination like that, Minecrafttalsi could
    probably build a castle in real life.


    ![](images/130a.jpg)


    ⬢


    Creating the medieval town within the valley of a large mountain gives the build
    a backdrop.


    ## Painting the Town Red


    Minecrafttalsi wasn’t trying to make a brutal, depressingly recreation of medieval
    times. He was aiming for a more serene fantasy land, and made sure to use colors,
    which reflected that. “I used a warmer color palette, which consisted mostly of
    earthy tones. A lot of red and brown colors especially.” He even modded the biome
    to produce browner grass, to be more consistent with the buildings. “I think it
    creates a fitting atmosphere for what I was going for.”


    ![](images/130b.jpg)


    ⬢


    The earthy tones used in the houses and surrounding vegetation provides an older,
    historical feel.


    ## Chapter Fourteen: Dystopian Mindset


    By Jossieboy


    ![](images/MMB_DystopianMindset_fullbleed_8.jpg)![](images/MMB_DystopianMindset_cutout_5.jpg)


    This creepy cranium-dwelling civilization named `Dystopian Mindset` was crafted
    by Jossieboy. A build where a Flat Earther would probably be considered a wishful
    thinker. And, like almost all Minecraft builders, he has one regret with his build.
    If he were to build this city in a skull today, he says he’d consider “making
    it scream rather than smile.” Isn’t this morbid metropolis plenty dark enough
    already? Why swap out the smile for a scream? “It just seems like that would be
    more powerful of an image. It might seem more painful. Which I think if you’ve
    got a city living inside your head is a fair emotion to be feeling.”


    Jossieboy sets out to craft things that Minecraft players have never seen before.
    “I really like grabbing two concepts and then smashing them together to create
    interesting imagery. I had this one build with an astronaut who’s literally surfing
    through space. You take two familiar concepts and then you mash them in interesting
    ways.” It’s a process that’s inspired him in several of his other builds. He combined
    hermit crabs and restaurants to make a build that’s somehow both, and mixed together
    fish and pie to make a joyously strange slice of underwater life.

