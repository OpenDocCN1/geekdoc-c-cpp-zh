  trans: '

    在开始“不朽之地”（Immortal Lands）项目之前，Iskillia 曾过初步规划：在学校作业本的边缘画涂鸦设计图。但他更倾向于直接开始建造并随时制定计划。“这是一种非常敏捷的方法。它一直在不断变化。我一直在建造、建造、建造，最后我得到了一些东西。那些东西在开始时是完全失控的！”


    随着时间的推移，一个结构逐渐成型，Iskillia 将其分为三个阶段。“第一阶段是开始，你在创造事物并尝试找到将它们组合在一起的方法。第二部分是规划，你选择地图的全局组织形式、结构等。最后阶段是你明确了自己想要什么，现在你全身心地投入到细节中。”


    “这是一种非常敏捷的方法。它一直在不断变化。我一直在建造、建造、建造，最后我得到了一些东西。那些东西在开始时是完全失控的！”


    最后一个阶段最具挑战性。Iskillia 认为，“你不能简单地复制粘贴。所以你被迫在整个地图上制作许多**相似又不同**的东西。我认为这是整个艺术创作中最困难的部分！”仔细观察，你会发现，惊讶的是，许多看起来相似的结构（尤其是许多房屋）确实存在细微的。很难否认这为他的城市赋予了多少个性，但这种投入程度光是想想它就让人想躺平。


    准确处理每一个微小细节既困难又耗时，但审视阿曼（Aman）的宏观全也有它自己的挑战。“在游戏中，你的视野和距离都是有限的。”随着你的建造变得越来越宏大，这个障碍自然会变成一个更大的绊脚。“这可能是一个问题。当你在这个地图上工作了一年半后，你会非常熟悉它。你可以轻松地在周围移动并清楚每个东西在哪里。但很难看到地图的‘全局性’。”


    ![](img/3.jpg)![](img/MMB_aman_fullbleed_3.jpg)


    ## 红天下的红帆


    这艘红帆美之船虽松地基于威尼斯船只，是为更宏大的建筑引入对比色的明智方法，且不会与现有建筑的美学产生冲突。此外，Iskillia 对细节那近乎荒谬的执着让这艘船看起来不像仅仅是窗面的点缀，而是真正成为了这座城市的一部分，因为他不仅建造了船，还建造了港口并包含了准备贸易的货物。草堆和南瓜有人想要吗？


    ![](img/MMB_aman_fullbleed_No_reflection_13.jpg)


    ⬢


    整个不朽之地，展示了 Iskillia 利用的多样形状语言。


    ![](img/MMB_aman_fullbleed_15.jpg)


    ⬢


    Iskillia 思考了建筑中的色彩平衡，确保每个元素都脱颖而出。


    ## 每栋建筑都独一无二


    Iskillia 使用白木建造小建筑的结构（以这个建筑的标准来说是很）。为了与白木的白色形成对比，他使用杉木作为边缘，使用海棱岩作为屋顶。他觉得冰冷的蓝/绿色海棱岩与木材的暖色搭配得非常完美。非常舒适！


    Iskillia 需要大量的监督工作才能很好地了解城市的进展情况。这就是他提到的渲染技能派上用场的地方。渲染不仅仅是让 Minecraft 看起来具有荒谬真实的精细艺术。它还能让你最终看到你创作的全貌。“当你第一次在一个画面中看到整个地图时，”Iskillia
    解释道。因此，在他为期 18 个月的项目过半时，他制作了一张渲染图，让他实现了这一点。最终看到九个月的心血全貌是什么感觉？“哇。”说得好。


    凭借高耸入云的雕像和复杂的堡垒，人们很容易注视“不朽之地”，并想象出一个拥有丰富详尽历史的真实城市。事实上，Iskillia 所做出的许多选择已让这座城市成为他
    Minecraft 技能多年来演变的记录。“我拿了我以前的一个旧作品。那是在开始这个项目之前大约两三年前的一个非常旧的作品。它符合这张地图的风格和氛围，并且有一些有趣的想法，所以我决定把它加入地图，尽管它并不是我所能达到的巅峰水平。”


    将你早期的、未经过精琢的建筑放在你最好的作品旁边似乎是一个奇怪的选择，但 Iskillia 坚信，隐藏你早期的创作实际上是太多的建造者会犯的错误。“不要评判过去的自己，”他建议道，“许多艺术家都有这个问题。他们的技能变得越来越精进，所以他们会评判过去的作品。当你制作一个为期
    18 个月的地图时，如果你一直在评判过去的作品，你就无法继续下去。你会一直毁掉已经做好的东西，或者转向另一个项目。”


    Iskillia 这种不那么自我毁灭的方法本质上就是现实世界城市的样子——由松散连接的设计和想法构成的混合体，这些建造者在城市中工作时间越长就不断变化和演变。“绝对是如此。在一个文明中，不只有美丽的建筑。还有丑东西！我认为那些错误（如果我们可以称它们为错误的话）会让地图更丰富、更有趣。”很难说
    Iskillia 地图上的任何东西是丑的。

