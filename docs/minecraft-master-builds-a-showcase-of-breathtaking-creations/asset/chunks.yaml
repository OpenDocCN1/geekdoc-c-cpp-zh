- fmt: "\nDespite his experience of duck-building, it’s always useful to go back to\
    \ references, so for this build, SadicalMC researched ducks online. “I did look\
    \ up a reference image for rubber ducks, just so I could get an idea of how big\
    \ the head should usually be. Rubber duck heads are pretty massive compared to\
    \ real ducks.” Handy, as that gave him room to add fancy top hats and more castle\
    \ spires to their heads. His ducks manage to look a lot fluffier than the ones\
    \ you usually find in a bathtub – a deliberate choice to add some surprisingly\
    \ realistic details to a very fantastical build. “I also looked at pictures of\
    \ real ducks. I like making my builds realistic, but also with a lot of fantasy\
    \ and mythical aspects to them. I like combining color, plants, realism, and fantasy.”\
    \ And getting those realistic details right helps the fantastical elements shine\
    \ all the brighter. The plant life, which so easily could have been an afterthought\
    \ considering it’s not the main focus of the build, has clearly been crafted with\
    \ great care to look realistic. It’s a testament to SadicalMC that the lifelike\
    \ elements of the build don’t seem completely out of place alongside top-hatted\
    \ ducks with castles on their backs.\n\n![](images/MMB_DuckBuild_fullbleed_7.jpg)\n\
    \n### Design Inspiration\nAn unusual muse, but one with a wide color palette to\
    \ choose from. SadicalMC chose blocks with a bright contrast to the ducks’ yellow\
    \ “feathers.”\n\n![](images/11.jpg)\n\nThese feathered friends were created using\
    \ a mix of real-life and toy references, giving them giant, round heads and streamlined\
    \ bodies.\n\n![](images/12.jpg)\n\n### Build Details\n- **Top**: `SadicalMC` had\
    \ a lot of fun decorating the pond with myriad plant life plus some fantastical\
    \ lanterns.\n- **Bottom**: A closer look at the intricate towers that are artfully\
    \ balanced on the ducks’ backs and beaks.\n\n### The Journey of `SadicalMC`\n\
    You don’t become the ruler of the duck pond overnight, and SadicalMC has been\
    \ honing his particular set of skills for years. “I got into Minecraft because\
    \ I was introduced to it by a couple of friends when I was in elementary school.\
    \ It was super fun.” It was the advanced technical possibilities that redstone\
    \ offered that initially enticed him, such as being able to build an interactive\
    \ game of tic-tac-toe. Returning to the game as a teenager, he discovered he now\
    \ much preferred the building aspect of Minecraft. “As a builder now, I’m like,\
    \ ‘That redstone stuff is overwhelming. I don’t like it!’” \n\nSeeing the great\
    \ creations the Minecraft community were constantly sharing inspired SadicalMC\
    \ to try some builds himself, although he claims not to have been an overnight\
    \ success: “I failed miserably.” Luckily SadicalMC stuck with Minecraft, gradually\
    \ improving his building skills. He credits a lot of this to seeing the relentless\
    \ stream of impressive builds coming from the community. “The more I got into\
    \ it, the more inspiration I saw. It just inspired me to be better as a builder\
    \ and to appease my creativity.”\n\n![](images/MMB_DuckBuild_fullbleed_6.jpg)\n\
    \n### Key Features\n**01** The semi-transparency of yellow glass – especially\
    \ when zoomed out – gives these ducks a slightly downy look. He also used white\
    \ wool, white concrete powder, sponge, and gold.\n\n**02** “I chose this color\
    \ palette for the castle because I really liked the yellowish-white with any kind\
    \ of red or orange-toned shade.” Making those castles the same color as their\
    \ beaks also implies that those spires grew out of the ducks organically!\n\n\
    **03** `SadicalMC` may have an eye for detail, but that doesn’t mean he’s willing\
    \ to waste effort on unnecessary crafting. “I was debating whether to add the\
    \ little feet to them, but they were going to be covered in water anyway so it\
    \ wasn’t worth it.”\n\n**04** “I absolutely love building plants and flowers.\
    \ I used a variety of green blocks.” The range of blocks used makes the plant\
    \ life look more alive than if he’d just used a single, solid block of color.\n\
    \n**05** Which is SadicalMC’s preferred bird? “I think the smallest one is my\
    \ absolute favorite.”\n\n![](images/16.jpg)\n\n### Craft Philosophy\nRecently\
    \ his creativity has been focused on perfecting intricate elements. “I’m a big\
    \ advocate for texturing and very fine details. That’s been a trend with Minecraft\
    \ lately. A lot of people are doing really small, simple builds but with fine\
    \ detail, where they can manage to cram a five-by-five with the most insane details\
    \ ever.” It’s a design philosophy he’s clearly carried over to his own work. By\
    \ focusing on such a deceptively small scene of four birds on a pond, he was able\
    \ to go all-in on making every aspect as hyper-detailed as possible. Not a mustache\
    \ hair out of place.\n\nBut let’s get down to the most important question. Do\
    \ these ducks have names? “No. Oh God, I should have named them though!” he laments.\
    \ Luckily, this is far from his first duck build. In fact, it’s not even his first\
    \ build to feature fancy ducks in top hats. The previous trio were named Sir Quackles,\
    \ Sir Quackles the Second, and Sir Quackles Junior. At least the builds are more\
    \ inspiring than his naming conventions.\n\n“This build was a great opportunity\
    \ for me to combine my three favorite things: ducks, castles, and plants. That\
    \ was the whole point of the project.” Crafting a unique build around the three\
    \ subjects that bring you the most joy and then letting your imagination run wild\
    \ is a dream for creators around the world. Even these pompous pond-dwellers should\
    \ tip their hats to that, although they may risk knocking a spire or two off.\n\
    \n![](images/MMB_DuckBuild_orthographic_V2.jpg)\n\n# Chapter Three\n## Aqua Princess\n\
    By `Varuna`\n\n![](images/MMB_aquaprincess_fullbleed_6.jpg)[](images/MMB_aquaprincess_cutout_2.jpg)\n\
    \nSunken chests. Bountiful shiprecks. Mysterious monuments. Minecraft’s oceans\
    \ offer tons of treasures and wonders for anyone willing to dive in. True, they\
    \ also offer sea monsters that shoot lasers from their eyes and trident-wielding\
    \ underwater zombies, but there’s probably just enough wonder down there to make\
    \ submerging yourself worth it. If you’re still not convinced, perhaps Aqua Princess\
    \ from professional build team Varuna is enough to entice you underwater.\n\n\
    The aquatic build is covered in clever details to give the impression of ruins\
    \ that have been under the sea for a long long time. Details like the plant life\
    \ that’s slowly overgrown both the princess monument and the castle she holds;\
    \ the shoals of fish swimming around like they own the place; and the hammerhead\
    \ shark that makes exploring this ruin immensely dangerous. Deep-sea builders\
    \ `BlackKIng89`, `Fiksat`, `ColoradoMcoil`, and `RenQeN`, along `Varuna` founder\
    \ `Thomas Sulikowski`, have clearly sunk the time in.\n\n“I grew up playing Minecraft.\
    \ Every day after school, my friends and I would play for a few hours and that’s\
    \ what really grew my love for the game.” Thomas soon started playing online,\
    \ where he learned how to build even better from “other people who liked placing\
    \ creatively.” Born and raised in Boston, Massachusetts, he started out by recreating\
    \ buildings closer to home (quite literally – one of the first builds was his\
    \ own house), including famous landmarks like Boston City Hall. He saw early success\
    \ selling these builds, but more and more offers were coming in to use his talents\
    \ on client commissions. “Once I started getting a lot of orders, that’s when\
    \ I really decided to file for Varuna to become a company.” Five years later,\
    \ Varuna has dabbled in circuses, music festivals, villain bases, spaceships,\
    \ and some truly gargantuan city builds. “Those huge cities are pretty difficult\
    \ and take a long time,” says Thomas, explaining that a team will spend three\
    \ or four months getting them right.\n"
