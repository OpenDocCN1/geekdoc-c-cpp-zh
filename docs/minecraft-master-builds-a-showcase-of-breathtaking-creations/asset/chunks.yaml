  trans: '


    是 Rigolo 的弟弟 Comeon 向他介绍了《我的世界》（Minecraft），因为他看到 Rigolo 那么喜欢乐高，心他觉得这会吸引他。“零件永远是不够，所以这种能够用无限材料建造出任何东西的想法——我喜欢了。”在通过几个练习项目来熟悉游戏后（Rigolo
    在描述他的首次建造尝试时说，“可能是一个超级糟糕的房子之类的”），兄弟俩很快决定创建一个城市。“我们打开地图，从这个项目开始做起。这是我在《我的世界》中做过的唯一建筑。我再没做过其他任何东西。”
    那么，当一个项目的涵盖的范围如此大时，还有必要这样做吗？


    ### 皇室城市的演变


    并没有前期制作阶段。Rigolo 和他的兄弟只是决定“在没有任何计划的情况下建造一些令人惊叹的东西。我们从一个正方形开始，在周围放置建筑，然后一点一点地变得越盖越大，学习了所有小技巧，以便能够建造出那种规模的建筑。”


    许多《我的世界》建筑师建造一栋建筑就大收工了。但 Rigolo 和 Comeon，也许是因为他们从未制定过计划，所以不知道何时停止。每当他们其中一人建造东西时，Rigolo
    就会发现缺少了什么，并将其也建成。


    ![](img/41a.jpg)


    ⬢


    兄弟俩借鉴现代欧洲城市，混合了不同的建筑风格和时期，以增加他们城市的可信度。


    ![](img/41b.jpg)


    ⬢


    左 | Rigolo 和 Comeon 为建筑增添了色彩，以使天然石材色调充满活力。


    ⬢


    右 | 他们甚至设计了一座足以举办奥运会的体育场馆！


    ![](img/MMB_ImperialCity_fullbleed_8.jpg)


    ### 灵感来源


    世博会——十九世纪和二十世纪期间对尖端技术的庆祝——对皇室城市产生了很大影响。但显然，如此宏大的建造规模不能只受一种影响；兄弟俩受到了世界各地建筑的启发。“有很多斯大林风格的建筑。那些非常高大、增层的建筑。你可以在莫斯科看到其中一些，那里融合了许多巴洛克、新古典主义时期的建筑元素。”
    其他影响则离家得多，例如巨大的圆顶法国先神庙。“我们在某种程度上重现了我们成长时的环境。我十八岁时搬到巴黎，那些大纪念碑就是周围常见的建筑。”


    ![](img/29a.jpg)


    ⬢


    兄弟俩设计了许多跨越河流和运河的桥梁以及船。


    ![](img/29b.jpg)


    ⬢


    左 | 他们在城市的装饰中参考了几种不同的建筑风格，包括斯拉夫和威尼斯圆顶，以及哥特式立面。


    ⬢


    右 | Rigolo 让街道真实化的努力在细节中显而易见，例如路灯、装饰树木和灌木。


    “有一个岛屿两边都是河流，所以这意味着需要桥梁。”桥梁需要通往某处，于是他们建造了更多街道。没有建筑的看起来空旷且不真实的街道，于是他们建造了更多街道。建筑需要与相邻建筑连接…………吧，你明白我的意思。突然之间，并不难看出十二到十八个月去哪哪里了。当被问及是否从世界的特定地区汲取建筑灵感时，Rigolo
    回答道，“拉格、维也纳、巴黎、伦敦、布鲁塞尔、西班牙、意大利。” 也许问哪些城市没有给 Rigolo 灵感会更容易。这种“全欧洲加无所不包”的方法在城市拥有的多样性中显而易见。你可以在一条街上欣赏足以媲美伊丽莎白塔（通常称为大本）的钟楼，在另一条街上欣赏郁郁葱葱的花园，在下一条街看到一群看起来阴森的坦克。有着如此多样的影响和如此丰富的内容，他们是如何保持城市看起来依然统一的？


    “当你开始观察它时，它并没有那么统一！”Rigolo 承认道，并解释他在悬崖上建造的骨架是为了部分掩盖这种现象。“这本被设计为在城市建造之前就存在于此地的某个古代文明的遗迹。这是一个人们建造各种不同风格建筑的时期。特别是作为欧洲人，我们习惯在城市的纹理中看到这种混合。这定义了一座城市。你找不到很多建筑风格完全统一的城市。它始终是不同时期、历史、品味的不断堆叠。”


    ![](img/33.jpg)


    ⬢


    兄弟俩为了填充城市而创作的一些细节建筑精选。


    这为加入任何你想到的建筑提供了一个很好的理由，但这个过程自然缺乏一个清晰的终点。他们是如何保持动力的？“你想证明自己的价值并做得比别人更好，”诚实得惊人的
    Rigolo 说，“你喜欢你正在做的事，所以你觉得有动力进一步扩大它。” 在他们仍在创作时，他们还把城市分享到了 `Planet Minecraft` 上——这是世界上最受欢迎的社区网站之一。这座城市大获成功，正面的反馈让
    Rigolo 和他的兄弟“想要变得更加成功”。紧接着又是几十座宫殿……


    Rigolo 和他的兄弟建造了现在这样“大约百分之九十”的城市，当他们向其他玩家开放时，很快就有其他《我的世界》建筑师自愿添加他们自己的作品。“他们向我们展示了做过的东西的照片，我们想：‘嗯，也许吧。’
    你会在最终的城市中看到其中一些建筑，例如一座哥特式大教堂。“但有很多东西是别人建造的，我们删除了，因为我们并不觉得合适。”


    ![](img/MMB_ImperialCity_fullbleed_8.jpg)


    ⬢


    一个受德国城镇建筑启发的彩色广场。


    ![](img/MMB_ImperialCity_isometric_1.jpg)


    ### 观光


    在他们的欧洲历史参考列表——法国、意大利、俄罗斯、西班牙之外，Rigolo 和 Comeon 还受到了英国设计的启发。“我们从维多利亚建筑中汲取了很多东西。那些在大城市里可以看到的十九世纪工厂。”


    ![](img/36.jpg)


    ⬢


    除了复杂的建筑设计，Rigolo 和 Comeon 还关注了组成城市的其他元素，例如植物、车辆、港口、景观以及城市内部的视角。


    这似乎有些严苛，但这是 Rigolo 为整个城市设定的日益提高的标准，特别是随着他自己建造技能的提高。“有很多建筑我们回过头来让它们比开始时华丽得多。当你开始建造时，你倾向于让立面非常平坦。没有很多细节。我们学会了添加许多元素可以让它看起来更漂亮、更真实、更有生机。所以有几栋建筑几乎完全重新装饰过。”那些重新装饰的建筑是幸运的，因为它们至少留了下来。“我删掉了一些我不喜欢的建筑。我把它们完全抹除了。”


    Rigolo 发现花费几十小时制作某东西却将其扔掉是令人沮丧的（尽管他很快提醒自己“这只是个游戏”）。但拥有如此高标准让他拥有了一座巨大的《我的世界》城市，并受到了社区的赞誉。他对此应该满意吗？嗯，当被问及如果今天重新开始这座城市是否会有任何改变时，他说“我可能会取消掉一半的建筑。


