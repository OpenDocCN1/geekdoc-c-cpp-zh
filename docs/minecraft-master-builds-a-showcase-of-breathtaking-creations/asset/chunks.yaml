    You could lose hours flying through this library’s humongous halls, each room
    stuffed with books full of information that journalists have been persecuted,
    jailed, and even killed for. Blockworks has also curated several wings of the
    library with art installations that tell stories about how suppression of freedoms
    have hit parts of the world. Each one tailored to the country it is illustrating.
    You’ll find a giant octopus in the Russia wing, for example, a “Data Kraken” with
    tentacles that represent the Russian government’s long reach into its citizens’
    lives when it comes to cyber surveillance and spying.


    “We tried to find countries where we could see a high degree of censorship but
    also where lots of people play Minecraft,” explains Kristin Bässe, media and public
    relations officer for Reporters Without Borders. These are parts of the world
    that have cracked down on free expression but haven’t censored Minecraft. It’s
    a clever workaround, similar to strategies Reporters Without Borders have made
    use of before.


    “They’d previously done a project called ‘The Uncensored Playlist,’ ” explains
    James Delaney, founder and managing director of Blockworks. “Bypassing press censorship
    laws by sneaking censored material into song lyrics and then uploading those songs
    to `Spotify`. So countries that didn’t censor `Spotify` but did censor this sort
    of content could essentially be tricked by releasing this uncensored album through
    `Spotify`.”


    ![](images/139a.jpg)


    ⬢


    A grand entrance to a very impressive building.


    ![](images/139b.jpg)


    ⬢


    Left | Rows upon rows of books, each one representing a piece of censored writing
    that the build provides.


    ⬢


    Center | Blockworks found the Mexico room the most challenging to design.


    ⬢


    Right | The “Data Kraken” representing the Russian government’s cyber surveillance.


    ![](images/Uncensored_library_fullbleed_16.jpg)![](images/Uncensored_library_cutout_4.jpg)


    ## Egypt


    You’ll find a towering set of scales in the Egypt wing, heavily tipped. “That’s
    a play on the scales of justice [in ancient Egyptian culture, the god Anubis would
    weigh the hearts of the dead on these scales] and how weighted the justice system
    is in that particular country against journalists pursuing free speech. All of
    the rooms, the creations in them or the decoration or pattern, were designed to
    be attuned with that country’s architectural style or history,” says James Delaney.


    ![](images/Uncensored_library_cutout_2.jpg)


    ## Saudi Arabia


    In the Saudi Arabia wing, you’ll find an imposing cage, clashing in tone against
    the beauty of the majority of the library. “A lot of journalists in that particular
    country end up incarcerated,” says James. “We wanted something that matched the
    grandeur of the library, but also represented the situation there. The material
    choice of obsidian, one of the hardest `Minecraft` blocks, is a deliberate choice
    to show how difficult it is for people to get out of those situations.”


    ![](images/Uncensored_library_cutout_1.jpg)


    James started playing `Minecraft` as a teenager, meeting other players on servers
    and steadily building more ambitious projects. “That gradually progressed into
    doing it for a career. I started getting commissions from YouTubers and influencers,
    then `Minecraft` servers, then eventually `Microsoft` themselves, and corporations,
    and all sorts of people who wanted a `Minecraft` experience.”


    When Reporters Without Borders was looking for `Minecraft` experts who could help
    curate its library, Blockworks were the perfect collaborators. “It was important
    that it was a landmark building,” James explains. “Obviously there’s a lot of
    amazing buildings in `Minecraft`, so to get young kids interested, it couldn’t
    just be a tiny library. It had to be something big and impressive.” Over twelve
    million blocks big, eventually.


    “We were looking at the Gothic libraries that you might find in universities like
    Oxford and Cambridge,” he says, of the structures that inspired them. “We ended
    up with a neoclassical style, which is really the architectural style of choice
    for a lot of colonial powers, a lot of governments, and a lot of dictatorships
    as well. They gravitate toward that particular style because it asserts a certain
    authority.”


    Doesn’t taking inspiration from dictatorial designs miss the point of the freedom
    the library is meant to represent? “It was a deliberate choice to use that style
    in a way that subverted the original intentions of it,” James says. “Reversing
    the role that it’s playing through the access of books inside it. Re-appropriating
    the neoclassical style.”


    Étienne-Louis Boullée, an eighteenth-century architect who was wildly overambitious
    for his time, was another big inspiration. “He was called ‘the Paper Architect,’ ”
    says James. “He never actually built anything, because all his designs were stupidly
    large and splendid and magnificent. We thought that was absolutely perfect. He
    designed a giant cenotaph for Sir Isaac Newton, which was like an enormous sphere.
    He did a potential design for the National Library of Paris, which we quite closely
    copied.” Boullée’s grand designs would be considered incredible today, let alone
    in the eighteenth century, when he was unfortunately far too ahead of his time
    for what could be achieved. Fast forward a few centuries and Blockworks can draw
    inspiration and finally realize his vision. “It’s almost got a sci-fi feel,” says
    James of Boullée’s work. “For the 1700s, it’s epic in scale and matches really
    well with what you can do with video games, where you don’t have a budget and
    physics to worry about.”


    ![](images/145.jpg)


    ⬢


    Top Left | Representing the globe’s censored works was a weighty task, and one
    that Reporters Without Borders and Blockworks took very seriously.


    ⬢


    Right and Bottom Left | The grand dome takes its shape and style from neo-classical
    libraries across the world. Blockworks wanted the design to maintain a level of
    grandeur and authority.


    “It’s a difficult one because ultimately we’re inside a computer game played by
    young people.”


    A bigger concern was striking the right tonal balance, given the shocking, often
    tragic stories the library is showcasing. “It’s a difficult one because ultimately
    we’re inside a computer game played by young people, and we’re also dealing with
    incredibly sensitive and difficult topics,” says James. “I think the Mexico room
    was the most challenging because there we’ve got the memorials of murdered journalists.
    Some people would say that’s just not appropriate for `Minecraft`. But working
    very closely with Reporters Without Borders and making sure it’s represented sensitively,
    talking to the families of all involved, we felt there was a way to do it respectfully
    and in a way that makes people aware of the issues faced around the world.”


    A risky endeavor that was worth pursuing, as `Minecraft` helped Reporters Without
    Borders target a new audience. “This is how we can reach people where they actually
    are,” says Kristin. “It’s not only gamers that see the library but young people
    that look at YouTube videos or that find out about it from their friends. This
    is a very specific way to show young people that this is actually something that
    concerns you. It’s connected to your human rights, your right to get information,
    to vote in a country because it’s connected to democracy.”


    This knowledge isn’t simply gained by reading in the library either. The multiplayer
    aspects of `Minecraft` helped people from different parts of the world meet each
    other on the library’s server. “You could connect someone from Egypt with someone
    from the UK in the game,” explains Kristin. “The person from the UK can ask questions,
    like ‘is it really true that this website is blocked in your country?’ It’s hard
    to imagine that they can’t access a website, or they can’t like a certain tweet
    because they would get arrested.”


    ![](images/Uncensored_library_fullbleed_6.jpg)


    ⬢

