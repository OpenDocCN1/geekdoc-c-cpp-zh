    Chapter Fourteen


    Dystopian Mindset


    By Jossieboy


    ![](images/MMB_DystopianMindset_fullbleed_8.jpg)![](images/MMB_DystopianMindset_cutout_5.jpg)


    This creepy cranium-dwelling civilization named Dystopian Mindset was crafted
    by Jossieboy. A build where a Flat Earther would probably be considered a wishful
    thinker. And, like almost all Minecraft builders, he has one regret with his build.
    If he were to build this city in a skull today, he says he’d consider “making
    it scream rather than smile.” Isn’t this somewhat morbid metropolis plenty dark
    enough already? Why swap out the smile for a scream? “It just seems like that
    would be more powerful of an image. It might seem more painful. Which I think
    if you’ve got a city living inside your head is a fair emotion to be feeling.”


    Jossieboy sets out to craft things that Minecraft players have never seen before.
    “I really like grabbing two concepts and then smashing them together to create
    interesting imagery. I had this one build with an astronaut who’s literally surfing
    through space. You take two familiar concepts and then you mash them together
    in interesting ways.” It’s a process that’s inspired him in several of his other
    builds. He combined hermit crabs and restaurants to make a build that’s somehow
    both, and mixed together fish and pie to make a joyously strange slice of underwater
    life.'
