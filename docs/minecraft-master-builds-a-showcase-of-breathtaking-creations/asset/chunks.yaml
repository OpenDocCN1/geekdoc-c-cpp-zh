    Jossieboy 有时会预先决定他的主题，而另一些时候，这些主题会在他构建的过程中自然或无意中演变出来。每当这种情况发生时，他就会装作这些设计从一开始就是他的意图。“你只需要说：‘噢耶，我是打算这么做的。’”


    Jossieboy 在 2012 年接触了 `Minecraft`，当时他还是个青少年，离“骷髅之城”的想法在他脑海中诞生还有很久了。“我哥哥展示给我看，我几乎是直接被那种能够创造出东西的想法吸引了。我当时并不怎么喜欢
    `Survival` 模式，因为我一直死。”但他显然非常喜欢 `Creative` 模式。“`Minecraft` 基本上就像一个巨大的乐高盒，你可以随心所欲地做出任何东西。正是如此让变得如此特别。”


    ![](img/MMB_DystopianMindset_fullbleed_10.jpg)


    ⬢


    这座风格多样的城市还有一个巨大的鸭子雕像和几块数字广告牌，因为何不可以呢？


    “我非常喜欢抓住两个概念然后将它们撞在一起，创造出有趣的视觉效果。”


    ![](img/136a.jpg)


    ⬢


    如果没有多种交通工具选择和一个可以为它们加油的加油站，记忆宫又算完整呢？


    ![](img/136b.jpg)


    ⬢


    Jossieboy 使用骷髅作为城市的基底，这意味着他的建筑是堆叠在一起的，呈现出拥挤的城市居住空间，非常反乌托邦。


    Jossieboy 为 `Dystopian Mindset` 结合的两个想法是“一个巨大的石脸……但也是一座城市？”这个想法在 Jossieboy 的脑海中发酵了一段时间，直到他在看到《复仇者联盟：无限之战》后最终受到启发去追求它。“他们访问了一个名为‘无名（Knowhere）’的地方。那是一个建在古代骷髅里的开矿镇。”‘无名’并不是一个普通的骷骨头——它本质上有行星那么大。“显然，我没有规模在
    `Minecraft` 中建造那样的东西，那太宏大了。但一个文明住在旧头骨里并从中开采资源的想法，就是我从中获得的灵感。”在 `Dystopian Mindset`
    中甚至还有一个小小的开矿区，这是对漫威电影的刻意致。


    与其规划构建过程，Jossieboy 更倾向于直接进入 3D 建模。“我倾向于在 3D 中工作得更好。对我来说，用方块雕刻某些东西容易得多。我使用 `VoxelSniper`，它可以让你非常快速创建很多方块。所以首先我塑造了形状，从脖子和下颌开始。这是一个很容易制作的形状，因为它是一种拱形。我查看了各种参考资料，看看脸是如何构造的。”Jossieboy
    讲述了他如何一个一个方块地逐渐重建骷髅的解剖结构。“好的，我大概有一个嘴的形状和鼻形状，这必须延伸到眉骨、前额等部位。我慢慢塑造它的形状，然后把眉骨拼回去。我把头做得太大了，但没关系，因为我要摧毁它的大部分，然后把它拉回来。加上一些耳朵，我慢慢得到了这个头部形状。然后我只是不断地精炼它。”谁知道创造生命可以如此复杂？


    一旦他完成了骷髅的基础形状，Jossieboy 制作了一个备份副本，然后在他想要建造建筑的地方开始了同样的流程。“我想在他另一只眼睛的地方有一个非常大的圆东西。我觉得如果模仿建筑的形状但让它看起来更电子化，会非常酷。它几乎是眼睛的一部分，但又不是。我标记了那里，然后开始在侧面盖房子。房子从他的眼睛散开，几乎就像肿瘤一样。我敢打赌那里有某种寓言之类的什么！”


    ![](img/MMB_DystopianMindset_fullbleed_7.jpg)


    ### 壳公司


    这座骷髅内部的城市可能不是 Jossieboy 最奇特的建筑。他构思的另一个惊叹的建筑概念是“一个寄居蟹有机雕塑，但在它的背后有一家拉面馆。”因为当然有。“一只小寄居蟹在拉面。它有一个小
    `Zippo` 打火机正在加热一碗面。因为，你知道的，它很小。我不知道为什么，但把一只寄居蟹放在它自己小餐馆的主厨位置，而那家餐馆还是它的壳——这对我来说看起来太可爱了。”`Dystopian
    Mindset`——虽然没有那么古怪——但展现了同样的想象力。


    ![](img/MMB_DystopianMindset_fullbleed_9.jpg)


    ### 眼睛之光


    Jossieboy 对建筑中眼睛的成型感到特别满意。“主要的焦点是眼睛。”这非常恰当，因为焦点会将你的注意力最吸引到那里，而在 Jossieboy 的建筑中，它真的是一只眼睛。“它看起来就像那里有一只眼睛，或者曾经有一只。但它现在不在那里了。我认为这是一个非常酷的想法——用一个不是真正眼睛的仿义眼来取代它。”

