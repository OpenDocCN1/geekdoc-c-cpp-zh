- fmt: '

    The domed roofs on this sprawling temple are one of the core characteristics of
    Byzantine architecture.


    Sander chose to construct his build with four key colors, to provide an impactful
    contrast. “For the base of the building I used white concrete. Having a very plain
    color as a base makes it so you can more easily add color in the details! For
    the roofs I used red sandstone and prismarine bricks. I really like how these
    colors work together.” But Sander felt like there was something missing in the
    build. “That’s why I made the large pink trees in the back. I used a mix of white
    concrete and birch log, and the leaves are made from all of the pink blocks in
    the game.” Luckily, Mojang Studios included just enough different kinds of pink
    block – like concrete, glass, and wool – to help make those leaves pop.


    Long before Sander was personifying buildings, he first encountered `Minecraft:
    Pocket Edition`, about ten years ago. “A friend and I just found it while scrolling.”
    Absent-minded browsing led to eight years of tapping away in `Pocket Edition`,
    until Sander’s ambitions outgrew this version of `Minecraft`. “About two years
    ago, I switched to `Java Edition`, because I wanted to do more large-scale builds.
    The tools and mods `Java` supports are just superior for that!”


    ![](images/MMB_TempleOfFortitude_fullbleed_2.jpg)


    ⬢


    A striking structure surrounded by water – the temple looks like it’s emerging
    from the ocean.


    ![](images/MMB_TempleOfFortitude_cutout_5.jpg)


    ⬢


    The giant pink trees are one of Sander Poelmans’s favorite aspects in the Temple
    of Fortitude.


    He left `Pocket Edition` for `Java` because he wanted to make bigger builds, and
    that certainly applies to the Temple of Fortitude. The titular temple is humongous
    but Sander managed to speed up the process to using `WorldEdit`, a popular `Minecraft`
    plugin. Even the “background details” like those blossoming trees are large-scale
    builds in themselves. “It’s quite hard to say which part I’m most pleased with,
    but if I had to choose one thing, it would be the large pink trees. I worked on
    those for at least two full days. I just really love how they look.” Sander’s
    right to be proud – curves are notoriously difficult to pull off in a crafting
    game that’s made up of all things cube-shaped, and the way the blossoms look like
    they’re naturally flowing off the branches is no small feat either.


    Were Sander to revisit the Temple of Fortitude, he would expand the base of the
    building by adding more blocks. “This way it will look a bit more interesting
    in the large flat white areas. I would probably try to include some of the cool
    new blocks, like calcite, white concrete powder, and bone blocks! And add some
    smaller arches, indentations, and patterns!”


    But these are ideas he believes builders shouldn’t get hung up on. “The advice
    I can give for building this large is to not get stuck on small details. The most
    important part of builds of this size is the shape and choice of blocks you use,
    because those are the things you will notice the most. It’s better to spend a
    long time on getting the shape right before trying to figure out what type of
    window you want to add.” Sander made sure to nail the core, then decorated the
    structure with rich details, and celebrated by giving his temple a dramatic title.


    # Chapter Twelve


    ## Sayama City


    By Sayama Production Committee


    ![](images/MMB_Sayama_fullbleed_5.jpg)![](images/MMB_Sayama_cutout_6.jpg)


    What’s the longest you’ve spent on a `Minecraft` build? A week? A month? Twenty
    minutes before rage-quitting because a creeper blew it up? All those somewhat
    impressive levels of time commitment pale in the shadows of the towering skyscrapers
    of Sayama City, a project that – when this book comes out – will have been under
    construction by build team `Sayama Production Committee` for eight years. Eight
    years and counting! But when the idea is as ambitious as this – to craft an entire
    city, based on real cities from all over Japan – suddenly you can start to see
    where over ninety months of building went.


    “I saw a `Minecraft` video on the internet and was impressed. I thought it was
    a great game and decided to play it,” says their build team representative and
    founder, who prefers to remain anonymous. This was in 2012, back in `Minecraft`’s
    early days, with the `Sayama City` project starting a year later. The original
    concept was to “build a Japanese city” and instead of copying one directly, they’ve
    helped themselves to influences from all over the country. Though several real
    places in Japan are named “Sayama,” this build is not based on a real place –
    it’s a fictional city with a lot of real-world influences.


    Originally this city was the work of just one builder. But it never would have
    reached the heights and scale it has today if it had stayed that way. “We realized
    that we needed the cooperation of many people to create a large map, so we looked
    for people who could help us at the time we [first] published the project, which
    is when the team was formed.” It’s a clever way to put a build team together:
    show the community what you’re working on, then recruit builders who respond to
    it.


    `Sayama Production Committee` was formed, a team that “wanted to make something
    that no one had made before.” This team has achieved exactly that. Vast cities
    being built by the community in `Minecraft` were slightly rarer in 2012, but they’re
    a popular choice for lots of builders today, with most of the globe having been
    depicted in cube form. However, `Sayama City` still has most of them beat in terms
    of detail and sheer scope. It’s the kind of build you have to zoom in on to double
    check you’re still looking at Minecraft.


    “We realized that we needed the cooperation of many people to create a large map.”


    ![](images/107a.jpg)


    ⬢


    `Sayama Production Committee` was dedicated to building a realistic city. Small,
    everyday details that a real-life city planner would contemplate such as parking
    lots, highway bridges, and residential districts for their civilians.


    ![](images/107b.jpg)


    ⬢


    This stunning blue skyscraper towers over the rest of the skyline, certainly an
    architect’s passion project. draws from different cultures and architecture styles,
    including traditional Japanese temples.


    ![](images/MMB_Sayama_fullbleed_20.jpg)![](images/MMB_Sayama_fullbleed_21.jpg)


    ⬢


    The best word to describe `Sayama Production Committee`’s style is realistic.
    They craft authentic city-living details, like pedestrian crossings and small
    plants growing near street lamps.


    ![](images/110.jpg)


    ⬢


    The Sayama City residents’ shopping habits are well catered for here. Whether
    they want to grab lunch in the food court, buy last-minute gifts, or pick up a
    whole new wardrobe, there’s a shop for every option.


    When you’re building on this scale, you apparently can’t afford to be picky. “We
    use all the blocks…every block has its own use.” That could so easily have ended
    up a multicolored disaster with an overly busy visual palette. Instead, this team
    has shown admirable restraint while also using every tool the game offers.

