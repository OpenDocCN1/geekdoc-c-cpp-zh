    “The southwest continent was inspired by New Zealand and the Pacific Northwest
    of the US, both of which have awesome, snow-capped volcanoes surrounded by beautiful
    forests. The southeast continent (pictured here) was vaguely inspired by a mix
    of southern Utah and the high steppes of central Asia, though I deviated a lot
    from those inspirations in the final build. The toughest part to build was the
    southeast continent in the transition zone between the red deserts and the grassy
    plains. I probably went through twenty different iterations of block choice because
    I couldn’t make anything look natural, no matter how hard I tried. Eventually,
    I settled on the current look and I’m happy with the final product. But it was
    certainly frustrating to get there!”


    ![](images/68b.jpg)


    Qwryzu is a part of that scene, using mods to make the best landscapes possible.
    But first he spends some initial hours researching “Google Earth and landscape
    photography accounts on Instagram to find locations that strike inspiration,”
    and also snapping some reference photos of his own. Then he draws a sketch of
    the general layout of the world once he has an idea of what he wants to include
    in his build. Finally, it’s time to break out the building tools.


    “The shape of my terrain is done almost entirely in software called `WorldMachine,”
    he explains. `WorldMachine` is very popular with the terraforming community and
    it’s easy to see why. It lets you craft realistic CG landscapes, using algorithms
    to simulate how terrain should behave in real life. Its erosion options alone
    are, appropriately enough, wonderfully deep. Would you rather simulate flow-based
    erosion, thermal erosion, or bury your terrain in snow, perfect for a nice cozy
    cabin? `WorldMachine`’s initial difficulty curve can feel as jagged as an actual
    eroded cliff, but it’s a great tool for those wanting to take their Minecraft
    terraforming skills up a few peaks. Outside of Minecraft, qwryzu is an aspiring
    geologist, one who uses the software to simulate processes that he learns about
    in his classes.


    “I love the freedom to be able to build whatever I want. I’m sitting here making
    pretty mountains while there’s other people out there making actual computers
    in the game.”


    `WorldMachine` is also only the start of qwryzu’s crafting process. He’s also
    a big fan of `WorldPainter`. “WorldPainter` is free software for creating Minecraft
    landscapes that is, without a doubt, the most important external tool in the building
    community, not just amongst terraformers. I have to do a lot of work in `WorldPainter`
    too, to apply layers like trees, plants, rivers, and some block selections that
    I didn’t do with `WorldMachine`.”


    `WorldPainter` isn’t quite as complex as `WorldMachine`. It lets you freely paint
    large sections of terrain, much like many digital painting or photo-editing tools.
    Vanilla Minecraft locks players into a first-person perspective, so a lot of players
    use `WorldPainter` or `WorldMachine` to get a wide overview of their builds. No
    wonder qwryzu holds them both in such high esteem.


    ![](images/MMB_Kythor_fullbleed_15.jpg)![](images/70.jpg)


    ⬢


    To create the impression of a gentle hillside, qwryzu stacked smaller layers of
    blocks on top of each other.


    His tools selected, now comes the hard part: putting all that terrain together.
    This “arduous process,” as qwryzu describes it, involves a lot of jumping between
    `WorldMachine` and `WorldPainter`, making constant changes, and “exporting small
    chunks of the map at a time to see how they look.” It’s far from a fast approach,
    especially as qwryzu’s also adamant that his landscapes are consistent with Minecraft’s
    style. “I try to keep my block choices relatively simple and Survival-friendly.
    It’s mostly a mix of stone and terracotta, with grass too, where appropriate.
    Stone and darker terracottas or concrete like cyan, brown, and black are great
    for big, tall mountains like the Himalaya or Rockies, but other colors like white,
    yellow, and brown terracotta can make awesome desert mountains, like the Atlas
    Mountains. My custom texture pack [featured here] also adjusts terracotta colors
    to more closely represent the colors of sedimentary rocks found in the Colorado
    Plateau region of the United States. A lot of terraformers use blocks of a certain
    color that look awesome in renders, such as coral and sponges, but they don’t
    make any sense for Survival.”


    Qwryzu’s love of Minecraft was born from playing the game in Survival: he was
    introduced to an early version of Minecraft in 2010. “I recall only being able
    to mine stone blocks and place torches and that alone was enough to catch my interest.”
    Over a decade is a long time to spend with a game, but he had a personal directive
    that provided limitless challenges. “I want all my maps to make sense for in-game
    use as well, not just renders.” Being able to create a realistic build, while
    still keeping it recognizably Minecraft, is an admirable achievement. Advanced
    as his terrain builds have become, it’s nice to see nothing’s eroded qwryzu’s
    enthusiasm for the Survival game he fell for all those years ago.


    “I recall only being able to mine stone blocks and place torches and that alone
    was enough to catch my interest.”


    ![](images/MMB_Kythor_fullbleed_8.jpg)


    ⬢


    This method is evident on a much grander scale in the builder’s ambitious mountainscapes.


    ![](images/MMB_Kythor_fullbleed_14.jpg)


    ### Northern Peaks


    “The inspiration for this map came from looking at the Atlas Mountains in the
    northwest Sahara Desert of Africa. Being from the American Southwest, tall, snow-capped
    peaks above deserts have always been incredible to me. But the Atlas Mountains
    sitting above the endless dunes of the Sahara particularly captured my imagination.”


    Those northwest desert mountains and dunes are the part of the build qwryzu’s
    the most proud of. “The oasis at the base of the mountains where you can see dunes,
    palm trees, and snow-capped peaks is without a doubt my favorite area on the whole
    map. It’s a rare thing that I have an idea in my head and end up with a product
    that looks exactly how I dreamed!”


    ### Tips & Tricks


    #### 1 Make a Plan


    Planning is the most important lesson Zeemo learned while building Future City,
    and his main advice to builders. “Before starting to build a building or a monument,
    you have to have in mind a certain vision of how you are going to proceed; architectural
    style, scale, choice of blocks, colors, lighting. On a map with a biome, the location
    of buildings is also important.”


    #### 2 Install Helpful Mods


    `WorldEdit` – the software that Maggie Gondo Wardoyo and Arkha Satya Taruna utilized
    when crafting their Moon Destruction build – is one of the best Minecraft mods.
    It lets you select and change several blocks at once, replace existing blocks
    without having to individually remove them and replace them one by one, and lots
    of other handy shortcuts that make building on such a large scale easier. Some
    players don’t like using mods but it’s similar to how you’ll only find a beautiful
    render of a build if the build itself looked good in the first place. Using tools
    like this can be a great way to save time and encourage you to experiment more.


    #### 3 Use the Right Tools


    `VoxelSniper` is a Minecraft mod for world editing that Thomas Sulikowski, of
    Varuna, is a big fan of. “It’s a great tool that allows us to push and pull certain
    blocks forward and backward. Probably one of the most useful tools when creating
    organics.” Organics such as giant dinosaurs or human faces. It allowed them to
    move blocks around – “like how a sculptor creates a sculpture in the real world”
    – an enormous help for getting the trickier parts of a human face right. “Being
    able to push and pull blocks allows us to mold the shape of the jawline, for example.”


    #### 4 Meet the Community

