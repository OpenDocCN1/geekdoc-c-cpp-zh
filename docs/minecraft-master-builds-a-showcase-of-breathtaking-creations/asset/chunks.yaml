    Chapter Three


    Aqua Princess


    By Varuna


    ![](images/MMB_aquaprincess_fullbleed_6.jpg)![](images/MMB_aquaprincess_cutout_2.jpg)


    Sunken chests. Bountiful shipwrecks. Mysterious monuments. Minecraft’s oceans
    offer tons of treasures and wonders for anyone willing to dive in. True, they
    also offer sea monsters that shoot lasers from their eyes and trident-wielding
    underwater zombies, but there’s probably just enough wonder down there to make
    submerging yourself worth it. If you’re still not convinced, perhaps Aqua Princess
    from professional Minecraft build team Varuna is enough to entice you underwater.


    The aquatic build is covered in clever details to give the impression of ruins
    that have been under the sea for a long, long time. Details like the plant life
    that’s slowly overgrown both the princess monument and the castle she holds; the
    shoals of fish swimming around like they own the place; and the hammerhead shark
    that makes exploring this royal ruin immensely dangerous. Deep-sea builders BlackKIng89,
    Fiksat, ColoradoMcoil, and RenQeN, along with Varuna founder Thomas Sulikowski,
    have clearly sunk the time in.


    “I grew up playing Minecraft. Every day after school, my friends and I would play
    for a few hours and that’s what really grew my love for the game.” Thomas soon
    started playing online, where he learned how to build even better from “other
    people who liked placing blocks creatively.” Born and raised in Boston, Massachusetts,
    he started out by recreating buildings closer to home (quite literally – one of
    the first builds was his own house), including famous landmarks like Boston City
    Hall. He saw early success selling these builds, but more and more offers were
    coming in to use his talents on client commissions. “Once I started getting a
    lot of orders, that’s when I really decided to file for Varuna to become a company.”
    Five years later, Varuna has dabbled in circuses, music festivals, villain bases,
    spaceships, and some truly gargantuan city builds. “Those huge cities are pretty
    difficult and take a long time,” says Thomas, explaining that a team will spend
    three or four months getting them right.'
