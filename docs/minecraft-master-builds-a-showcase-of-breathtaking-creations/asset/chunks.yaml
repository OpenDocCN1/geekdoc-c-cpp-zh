    # 水中公主（Aqua Princess）最初只是 Varuna 较小的作品之一。客户对自己的想要相当模糊，只加了一张非常有用的雕塑参考图。“这个女人在水下，手臂伸出，我想她手里可能握着一座城堡。”这也许是客户最初想要的，但
    Varuna 很快提出了更具野心的计划。“我们认为如果能找到一种方法让城堡环绕在女人周围，会更酷，这样整体看起来更统一。于是我们添加了这道通往城堡的长楼梯，塔楼延伸出来，最后环绕着她的左肩。”


    ![](img/MMB_aquaprincess_fullbleed_12.jpg)


    ## 这座建筑必须从几个角度观察。这个视角展示了塔楼比公主高出多少。


    “当我开始接到大量订单时，我真的决定把 Varuna 注册成立一家公司。”


    ![](img/26.jpg)


    ### 顶部 | 位于公主伸出的手上的城堡。


    ### 底部 | 建筑团队创作了一系列不同的海洋生物，包括小丑鱼和乌龟，填充了城堡周围的海洋。


    ![](img/18.jpg)


    ### 顶部 | Thomas 和他的团队精心工作，利用方块创造了一个看起来自然的人体形状。


    ### 底部 | 一条巨大的蓝唐从塔楼的窗户中探出来。


    ![](img/MMB_aquaprincess_cutout_1.jpg)


    Thomas 的大部分工作是与客户沟通。“通常，当我们开始一个委托项目时，客户会非常兴奋，所以他们会向我们要截图。我会发给他们，但那只是一堆在 Minecraft
    里画的乱七八糟的线条，标出了每栋房子的位置以及街道的轮廓。他们通常看了之后会说：‘噢，这看起来一点也不好看！’” Varuna 还会向建筑的委托人跟进“频率至少每周一次”，向他们展示建筑的进展情况。“我们会确保向他们发送我们创建的第一座房子的蓝图。”如果客户不喜欢这个计划，他们可以在
    Varuna “在我们基本上用三三千种不同的方式把这栋房子重新建造之前”告诉他们。每周检查一次，还是可能拆掉三千间房子？不难理解为什么 Thomas 更倾向于前者。


    随着团队越来越多地参与建造，最初的概念也演变了。“最初城堡周围只有的一条大鱼，但我们添加了所有的鱼群。”建造者们研究了许多不同鱼的图片，“只是为了确保它们的尺寸正确”，并拒绝满足于仅一种鱼，以让建筑成为对海洋生活更广泛、更多样化的反映。精心的建筑增添和额外的鱼类是很棒的加分项，但它们与
    Varuna 最伟的想法相比都显得黯然失色。“在后面，雕像后面，其实有一条鲨鱼。”事实上，那是一条巨大的锤头鲨，在原始参考图中并没有。精心地雕刻一条巨大的鲨鱼，然后把它藏在主渲染图中公主后面？嗯，当你从其他角度欣赏这座建筑时，这会是一个非常大的惊喜。他们对雕塑做的另一个改变，对于任何住在城堡里、不想被巨大的发光眼睛
    24 小时盯着的人来说都是个坏消息。“你一直被监着。没有休息！”决定给公主那那样双诡异明亮的眼睛，是因为“那是我们凸出她眼睛细节最简单的方法。”


    在一个充满有机生命、古老遗迹和一只潜行鲨鱼的建筑中，Varuna 最难处理好的元素是一个令人信服的发型。“这是一个非常自然的形状，一个人类，在方块的世界里，这很难模仿。”仿佛这还不够挑战一样，团队还必须应对
    Minecraft 对重力工作的独特解读。“女人的头发垂在脖子后面，然后越过右肩膀。它看起来一直非常奇怪，因为当你试图在一个没有重力的视频游戏中制作具有重力效果的物体时，难度会呈指数级增长。由于我们太习惯于生活在一个有重力的世界里，每样东西都需要呈现特定的样子。如果你不这样做，大家很快就能发现它看起来很奇怪。”只有在
    Minecraft 里，你创造鲨鱼的挫败感可能才比剪发型要少。


    “有句说法是，当你完成一个项目的百分之九十时，你还有百分之九十要做。这正是我对我们做的每一个项目的感受。”


    但 Varuna 成功地搞定了，公主实际上是 Thomas 最自豪的建筑部分。“我觉得我们真的搞定那里了！”如果说他的团队有一个成功的秘诀，那就是坚持下去，并在挫折中突破自我。“你需要培养某种程度的耐心。只有当你能够花几周时间坐在它面前，一点一点完善它时，它看起来才会好。如果你期望在几天从零开始建造某样东西后它就是完美的，你就会对正在创造的作品感到沮丧。你会很容易放弃，因为看起来并不完全像你想要的样子。”


    “培养那种耐心至关重要。我们有四个人负责这个项目，他们花了几周时间。阴影和纹理——那些是添加非常缓慢的细节。有句说法是，当你完成一个项目的百分之九十时，你还有百分之九十要做。这正是我对我们做的每一个项目的感受。所以对
    Varuna 耐心一点，他们会用精湛的手艺报答你，那是一个称公主的作品。”


    ![](img/25.jpg)


    ⬢


    顶部 | 公主的眼睛为这座精美的建筑增添了阴森的基调。


    ⬢


    底部 | 潜伏在雕像后的鲨鱼为海洋场景带来了危险。


    ![](img/MMB_aquaprincess_fullbleed_1.jpg)


    # 额外建筑


    ## Agnoia Frieden & Vigrid


    ![](img/27.jpg)


    ### Agnoia Frieden

    由 Chloriz 在申请加入公司时创作，Agnoia Frieden 描绘了一座宏伟的女性雕塑。她站在山谷中，周围环绕着废弃的寺庙。雕塑和建筑都被藤蔓、苔藓和杂草覆盖，仿佛自然正在收回这片圣之地。


    ### Vigrid

    在古北维语中的意思是“战斗激烈之地”。这座建筑的创作者 BlackKing 和 RenQeN 利用这一灵感打造了一个受到攻击的岛屿。Vigrid 村庄不仅面临着三艘海盗船，还要应对愤怒的恐龙和喷发的火山。月形岛屿上布满了亮红色的建筑，与绿色、棕色和蓝色形成了鲜明的对比。


    # 第四章


    ## 帝国城

    作者 Rigolo 和 Comeon


    ![](img/MMB_ImperialCity_fullbleed_12.jpg)![](img/MINE_MSBD_Test_SmallTower.jpg)


    Rigolo 和 Comeon 创作的帝国城是宫殿、雕塑、建筑等元素的巨大杂烩。它的灵感源自几个欧洲城市，按理说应该是一个混乱的结合体。事实上，其中一位建筑师可能真的认为它是如此。但它是拥有一切的游客陷阱，一个大得无边的城市，以至于背包游欧洲反而是更快的选择。


