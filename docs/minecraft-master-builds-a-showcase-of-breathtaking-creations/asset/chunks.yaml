    这可能是他最喜欢的一个季度，但 Ariux 知道这种方法不可持续的。“我们在这个季度上花了两个月的时间，当时我说：‘伙子们，我们不能追求这种程度的细节。’所以对于某些季度，我们只有两周时间来建造。有时候某些季度非常困难，因为我们只有三或四名建筑师。那个水下建筑，我只用了两名建筑师在两周内建好了。”Quantics
    Build 由大约十五到二十名建筑师组成，人数会发生波动。“我们可没少睡觉！”


    ![](img/MMB_NovaCeles_fullbleed_1.jpg)


    ## 羊毛世界


    当你要在紧迫的截止日期前建造巨大的城市时，你最不想做的就是推倒自己的心血并从头开始。Quantics Build 投入了大量时间进行规划以避免这种情况，但他们仍然无法避免不断进行修改。“对于某些季度，建筑并不多，因为建筑建造时间很长——一个人就要两天——因为有大量的修改，而且他们还必须做内部装饰。”他们使用的一种新颖方法是先做一个“柔软”的城市，用羊毛块建成很大面积。“我们用羊毛施工是为了对建筑的体积有一个整体的概念。但重要的是，对城市的密度有一个概念。所有这些在之后都能帮助我们组装城市，看看哪里可以放置公园、餐厅、地铁等……”当你和完美主义者团队合作时，修改是不可避免的，但当你想在投入精细细节之前看看城市的形状时，可以考虑使用彩色羊毛作为占位块！


    ![](img/158.jpg)


    - **左上角** | Quantics Build 在他们的唐街区使用了大量的红色方块。在传统文化中，红色象征着好运和快乐。

    - **左下角** | 团队用冒着烟的烟囱装饰了工业区，让人联想起十九世纪的工厂。

    - **右侧** | 建造的中心是最后一个季度，特点是具有更多绿化的结构——注意那两座墙壁和屋顶长着植物的建筑。还有一个中式拱门——被称为 `paifang`
    或 `pailou`。


    二十三岁的 Ariux 在 2019 年创立了 Quantics Build，这在他第一次开始玩 Minecraft 六年后。“刚开始，我认为我们只是一群为了艺术而玩
    Minecraft 的朋友。”但随着他们承担了越来越多雄心勃勃的项目，他们意识到自己正稳步成为一个专业的 Minecraft 建造团队。Ariux 还在学习建筑，这对于一个如此出色的虚拟建筑师来说非常合适。遗憾的是，他在制作
    Nova Celes 的同时正在做这些。“最近我完成了建筑学院的业。建筑学院非常、非常困难。有很多工作，对我来说，一边建造这个项目一边学习简直是一场噩梦。”


    尽管都涉及建造，但 Ariux 发现他的建筑学习和他的 Minecraft 工作之间存在巨大差异。正是游戏中那种不受束的潜力最初就如此地吸引了 Ariux。“建筑的问题在于你有很多限制。你不能做你想做的事。这太粗鲁了！而在
    Minecraft 中，你有可能创造一切。”Ariux 也喜欢多人协作方面，享受在建筑团队中工作，“因为它是想法的熔炉。这就是我喜欢 Minecraft 的原因，因为你可以和朋友一起做你想做的事，目标是做出最令人震撼的东西。”


    “建筑的问题在于你有很多限制。你不能做你想做的事。这太粗鲁了！”


    ![](img/MMB_ImperialCity_fullbleed_7_1.jpg)


    ## 谢谢


    ### 作者的话


    首先，非常感谢每一位为了这本书接受我采访的建筑师。你们对 Minecraft 的热情以及你们通过它取得的惊人成就，讨论起来绝对是一种享受。等我中了彩票，我期待决定向你们中的某一个人恳求为我在现实生活中设计一栋房子。感谢
    Alex Wiltshire，他提供了极佳的建议，并找到了书中大部分的建筑师。说真的，Alex，你难道认识每一个在 Minecraft 中建造过惊人作品的人吗？我认识的人还没够填满一个致谢页……


    感谢 Ellie Stores，她将我的话编辑得通俗流畅，在不加评判的情况下回答了我所有愚蠢的问题（至少我希望是这样？），并删掉了一些极其糟糕的冷笑话，那些冷笑话会让你要求再别让我碰笔了。感谢设计师
    Andy Leung 和 3D 插画师 Billy Budgen，让这本书的每一页看起来都不可思议地漂亮。感谢 Jen Simpkins 是一位才华的朋友。她曾告诉过我有一个叫“Minecraft”的游戏，我应该考虑玩玩并写关于它的文章。我不情愿地承认，事实证明那是非常好的职业建议。向
    Adele Major 致以无限谢意，这位不起的制作人与我合作了几乎所有的 Minecraft 项目，除了这本书（但她仍然在书中受到了致谢——她太棒了）。最后，我想感谢我室友的狗，它只尝试——并失败了——用它不断的吠叫来破坏我的其中一个建筑师采访。尝试得不错，Odin。下本书好运！


    ### 出版方的话


    Expanse 感谢所有建造了如此令人印象深刻结构的建筑师，并在之后花时间与我们谈论这些内容。特别感谢 Iskillia、SadicalMC、Thomas
    Sulikowski 和 Varuna Builds、Rigolo 和 Comeon、natsu3012、Rajkkor、Zeemo、qwryzu、Junghan
    Kim、Maggie Gondo Wardoyo、Arkha Satya Taruna、Sander Poelmans、Sayama Production
    Committee、Minecrafttalsi、Jossieboy、Blockworks 以及 Quantics Build。感谢 Kristin Bässe、LNeoX、LordKingCrown
    和 Craig Jelley。


    特别感谢 Mojang 的所有人为将这本书变为现实提供的指导。感谢 Alex Wiltshire 和 Sherin Kwan，感谢 Cookiie 和 Yutaka
    Noma。感谢 Mikael Hedberg 提供的真知灼见。


