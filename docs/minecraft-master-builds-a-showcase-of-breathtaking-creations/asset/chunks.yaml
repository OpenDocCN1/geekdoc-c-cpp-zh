    考虑到 natsu3012 对大型建筑的热爱激情，他们实际上是保持某些简单性的的大力拥护者，这让人有些意外。“要进行大规模建造，我首先建议要用非常简单的结构打下坚实的基础。要明白简单并不是缺陷，它能带来更好的视觉体验。”这就是他们成功平衡这种难度的方式：让一座城市看起来是刻意幽闭的，但又不会显得碍眼。


    这位严谨的建造者非常强调提前规划的重要性。“你必须有一个指导方，对计划要做的事情有一个意图，使项目具有连贯性。”而且，在开始建造之前，他对这座未来城市已经有了非常明确的想法。“`Earthsky`
    的计划是在有限的表面上创建一个‘完工’的城市，建筑相互重叠，但对玩家来说又是实用的。不同层级有许多路径可以行走。”


    尽管这是一座悬浮城市，但 natsu3012 的 `Earthsky` 却惊奇地符合现实主义。“我想设计一个可以步行的空间，有时像高低错落的小巷，有时则更像公共场所。”这位建筑师可能对人类的未来有两种不同的预测，但如果是由他们来规划，那么我们也许是安全的。


    # 第六章


    ## Gothencrow

    作者：Rajkkor


    ![](img/MMB_Gothencrow_fullbleed_25.jpg)


    ### 纹理包

    - ◾ `Dokucraft Light` 来自 `Dokucraft`


    ![](img/MMB_Gothencrow_cutout_4.jpg)


    哥特式建筑 `Gothencrow` 是一个充满自豪感的阴郁城市，其特点是宏伟且极其复杂的建筑，而这些建筑实际上是一个相当快乐的设计。Gothencrow
    的建筑师 Vincent Grenfeldt（在 Minecraft 社区被称为 `Rajkkor`）刚刚加入 Minecraft 服务器和 YouTube
    频道 `FyreUK`。加入三个月后，他的第一个项目是参与他们的视频之一，但他们希望在里面加入更多的城市。“那时我想，如果那里有一个哥特世界会很好。`FyreUK`
    还没有做过哥特式主题的建造。”随后他发现这将是一个延时视频，这是他以前做过的东西。


    Minecraft 延时视频展示了整个建筑是如何一个方块一个方块地建造，并经过了加速。它们对于观察团队如何组合作品非常出色，而且观看起来极度上瘾。在放置任何方块之前，它们还需要回答很多问题：“房屋应该长什么样？里面的大型建筑有哪些？风格是什么？里面有哪些类型的细节？”


    Vincent 很快发现会有局限。“事实证明，显然我为建造选择的细节对于普通人在延时视频下所能完成的来说有点复杂了。因为当你做延时视频时，你必须考虑到并不是每个人都建造了超过一年多。它必须是一种简单的风格，但要看起来足够好。目的是从零开始构建地图。”他最终决定直接把
    `Gothencrow` 做为一个大世界，而不是延时视频。


    ![](img/MMB_Gothencrow_fullbleed_29.jpg)


    ⬢


    虽然建筑的标题是哥特式的，但方块的选择却惊奇地丰富。Vincent 使用了棱光石（prismarine）为他的幻想小镇增添了一丝活力。


    “我的朋友向我介绍了 Minecraft。那是很久以前的事了！我大约十二岁。我开始玩 `Survival` 模式，过了一段时间我才开始制作地图。”


    ![](img/MMB_Gothencrow_fullbleed_6.jpg)


    ⬢


    教堂的色彩在雪山的苍白背景下脱颖而出。


    ![](img/52.jpg)


    ⬢


    - **顶部**：Vincent 完美地了将宏伟的城堡隐藏在巨大的、森林茂密的山之后。

    ⬢


    - **底部**：在这个神秘的瀑布空地中可能会发现什么秘密？


    Vincent 从他喜欢的游戏中汲取灵感。“当时我对 `Dark Souls`（黑暗之）感兴趣。我非常喜欢游戏中那种古老的、欧洲启发的建筑，所以我觉得在这个主题上做些东西会很有趣。”对于那些从未体验过反复死亡之快乐的人来说，`Dark
    Souls` 是由日本工作室 `FromSoftware` 开发的一部大型奇幻 RPG。不过 `Minecraft` 稍微友好一点，而 `Dark Souls`
    则是暗黑风视频游戏幻想中的哭泣之王。它充满了宏伟的建筑，看起来光是看着就可能被割伤到。这两者都是 `Gothencrow` 的清晰灵感，但 Vincent
    也受到了“《魔兽世界中的吉尔尼亚斯（Gilneas）”的影响。暴雪公司长期运营的 MMORPG 在某些地方也相当黑暗，但对奇幻的处理要更加丰富且更具亲和力。“氛围和环境更多来自《魔兽世界》，带有童话影响，而选择的建筑则变得更像《血源战士》和《黑暗之魂
    3》。整个城市的主题随着我兴趣的改变而演变。”


    当建造者着手如此庞大且耗时的项目时，这在不可避免。自然地，随着你的建筑不断扩张和时间的推移，你的品味和兴趣也会发展和改变。“人们会成熟，但他们的品味实际上并没有改变那么大。他们想要和小时候类似的东西，但更适应他们现在的年龄。”你从
    Vincent 为 `Gothencrow` 构建的松散叙事中也能看到他兴趣的变化。那里有更有通俗色彩的想法，比如召唤狼人的祭司，但也有更成熟的细节，比如城市从小村庄的演变。


    什么启发了“Gothencrow”这个名字？“Goth”部分显而易见。Vincent 诚实承认在向 `FyreUK` 推销这个建造时对哥特式建筑一无所知。“我只是想做一些像吉尔尼亚斯和《黑暗之魂》那样的东西，他们说‘好的，你要做哥特式建筑吗？’”至于“crow（鸦）”，你会在
    Vincent 的城市到处发现这些黑羽朋友的标志。“我想那是受到了《权力的游戏》的启发，”他说，并指出它们是该类型的合理陈词，并提供了奇妙的幽灵氛围。“如果你有一座鬼闹别墅，你总能听到鸦叫。”但名字的第三个影响实际上是瑞典城市哥德德堡（Gothenburg），它的港口和建筑启发了
    `Gothencrow` 的布局。


    如果他今天建造这座城市，Vincent 说他会以不同的方式处理设计。“`Gothencrow` 实际上有一个很有计划的布局。没有哪个城市是这样自然形成的，至少在欧洲不是。大多数城市都是从小村庄开始的。好的，现在我们需要教堂。好的，现在我们需要一个交易者的市场。噢，看起来我们有了新的宗教，得为那里留个角。噢，看起来科学革命刚刚发生我们需要扩展大学。”他最喜欢建造中的部分是国王城堡。“那是我做的最后一个项目。”
    Vincent 认为城堡展示了他在加入 `FyreUK` 到开始制作 `Gothencrow` 之间建造技能进步了多少。Vincent 越像一个真正的城市规划者那样思考，他的建筑就越逻辑性地契合在一起。“当我设计城堡时，我尝试思考哪些部分是先建造的。哪些部分是随着王国繁荣后来出现的？这对于大多数城堡来说都是，它从一个堡垒开始，随着城堡周围村庄的发展和围墙的建立，对城堡保护的需求减少了。我觉得建筑历史的这一部分非常有趣。”'
- fmt: '

    As the main inspirations for Gothencrow were video games, it’s not surprising
    to hear Vincent has been gaming since he was young. “My friend introduced me to
    `Minecraft`. It was a long time ago! I was around twelve. I started playing Survival
    mode and it was some time later that I got into map-making.” Vincent might have
    stuck with Survival, had his school not suddenly given him a great incentive to
    try a new approach. “There was this competition where we were tasked with creating
    an adventure map.” The only rule of the competition was that the map had to have
    an underwater theme. “We made an adventure map about a character that’s very similar
    to Captain Nemo from Twenty Thousand Leagues Under the Sea by Jules Verne. The
    storyline was about a guy finding an underwater city. So it wasn’t very original!
    But it was more about the actual building, of actually constructing the world
    around it. We built our interpretation of Atlantis.”


    ![](images/58a.jpg)


    ⬢


    Vincent has created small villages within his Gothic build. Equipped with a small
    church and windmill, this cozy hamlet is overlooked by a beautiful tree in bloom.


    ![](images/58b.jpg)


    ⬢


    Left to Right | Everyday houses sit among this regal build; a giant eagle watches
    over the waterfall glade; a detailed cutout of the windmill and house.


    ![](images/MMB_Gothencrow_fullbleed_30.jpg)


    # A Storied History


    When designing a build, Vincent likes to think about the narrative, and the fortress
    with the small tower – to the right of the harbor – has a very detailed story
    behind it. “That is where the monster hunters have their headquarters and monster
    prison. I try to think about the history of the building, what part of it was
    built first, what parts of it were added later as a need for expansion for whatever
    purpose the owner of the building would have. In the case of the monster hunters,
    the tower is an extension of the lower building, which served as the guards’ official
    prison until they discovered the monsters and needed to develop a special tower
    to hold the monsters in it.”


    ![](images/MMB_Gothencrow_cutout_3.jpg)


    Vincent and his team’s elusive underwater city won the competition. But all Vincent
    can see now is his old build’s flaws. “Minecraft` at the time didn’t have water
    that wraps around the blocks,” he explains, of a build constructed long before
    `The Update Aquatic` improved `Minecraft`s oceans. “If you went down and put slabs
    underwater, it would create a vacuum or air pocket around the parts of the slab
    that weren’t covered by the full block. So it didn’t look that good. Then we got
    complaints from one guy who built an underwater base who said his build was cooler
    and therefore he should’ve won. I was like ‘OK, well, I better improve.’”


    That sore loser was a surprisingly good motivator for Vincent. He started looking
    for a `Minecraft` server to join that would help improve his building skills,
    as he’d definitely caught the map-making bug. “I really liked to make Tomb Raider-
    or Indiana Jones-style maps, where you go to these epic locations and then you
    explore them and discover old architecture there.”


    That’s when Vincent discovered his ideal server. “I liked FyreUK a lot so thought
    it’d be nice to join them, do some building, and find a more concentrated building
    community, where one could talk with other builders and and learn from them.”
    As well as Gothencrow, Vincent worked on other `FyreUK` projects, such as Christmas
    Timelapse 2013, Elven Port 2.0, plus several time-lapse projects, such as Kirtipur.
    `FyreUK` have sadly since closed their digital doors, but he clearly learned a
    lot, constructing a Gothic delight that’s as sinister as it is spectacular.


    ![](images/MMB_Gothencrow_fullbleed_28.jpg)


    ⬢


    This picturesque town is reminiscent of Bavarian and Eastern European cities,
    packed with colorful tiles and wooden detailing.


    “Gothencrow actually had a pretty planned layout. There is no city that is built
    like that naturally, at least not in Europe. Most cities start out as a village.”


    # Chapter Seven: Future City


    By Zeemo


    ![](images/MMB_FutureCity_fullbleed_17.jpg)![](images/MMB_FutureCity_cutout_5.jpg)


    It was early days for the `Minecraft` community when French builder Zeemo started
    playing, but he was still impressed by what he saw. “When I discovered the constructions
    of the other builders, I was fascinated by the beauty of the castles and monuments.”
    But most of the community builds he saw were medieval-style. “The few existing
    cities did not have anything futuristic in my eyes.” So Zeemo decided he’d be
    the one to fill that gap. “I looked at several futuristic-looking games and images
    and gave it a go.”


    It’s a clever approach. Often identifying what’s missing from the builds you’re
    seeing in the community and filling that gap can be a great way to get more attention
    on your project – after all, there will be nothing else like it. Zeemo cites games
    like `Halo` and `Mass Effect` as influences, along with the futuristic movie franchises
    `Star Trek` and `Star Wars`. “I looked at several futuristic images for inspiration.
    Then I looked for how I could recreate these buildings in `Minecraft`, figured
    out what blocks to choose and how to do it. Over time, I ended up developing my
    own style.”


    Of course, the artists who worked on `Star Wars` and `Mass Effect` had access
    to some of the most cutting-edge technology for making digital landscapes. Whereas
    Zeemo started `Future City` around 2014, and was using the `Xbox 360` version
    of `Minecraft`, significantly more limited than the versions available today (the
    lack of colored glass blocks was particularly frustrating). “The blocks in vanilla
    `Minecraft` [a version that’t been modded] were a good match for a medieval world,
    but not really a futuristic world,” which is likely why many early community builds
    were so focused on the medieval era. If Zeemo wanted a new-age city, he was going
    to get creative. “There’s realism despite the coarseness of the blocks. The freedom
    offered by the game and the calm it brings, all accompanied by music that is both
    motivating and relaxing.”


    ![](images/61.jpg)


    ⬢


    As well as building an incredibly detailed city, Zeemo spent time creating a selection
    of aircraft to populate his sky.


    ![](images/MMB_FutureCity_fullbleed_2.jpg)


    “I looked at several futuristic images for inspiration. Then I looked for how
    I could recreate these buildings in Minecraft, figured out what blocks to choose
    and how to do it. Over time, I ended up developing my own style.”


    Luckily, that was far from a problem. “I started by using the clay and snow blocks,
    arranged with blocks of wool of all colors. To vary the shades of gray, I even
    had to use the cobblestone block.” Which means this city of tomorrow’s foundations
    are some of `Minecraft`s earliest, most primitive cubes.


    “When the quartz block arrived…it was my block par excellence. I finally had access
    to the quartz stairs.” And he made great use of it. As for the lack of colored
    glass on `Xbox 360`, Zeemo found a workaround by using ice blocks as windows,
    making use of their blue shade. It’s proof that sometimes restrictions can be
    good for creativity. When you’ve got unlimited access to resources, it can be
    tempting to try to use everything, leading to a design that looks cluttered or
    overly busy. By having such a small color palette, Zeemo’s Future City looks strikingly
    consistent throughout as well as thoughtfully realistic.


    Zeemo cites the `Burj Khalifa`, a skyscraper in Dubai, as an influence. “I love
    the futuristic and uncluttered design of many of the buildings I’ve made. I often
    finished my buildings with an angular roof…an often-luminous mast or some kind
    of antenna. Like the `Burj Khalifa`, the top floors are there to complete the
    design, to increase the presence of the building.”


    ![](images/62.jpg)


    # Under the Dome

