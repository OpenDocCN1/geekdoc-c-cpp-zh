    然而，不断调整如此规模的建筑带来的挫败感，最终为 Junghan（俊翰）提供了他想要坚持的主题和故事。“在某个时刻，我想我在构建这张地图上花费的所有时刻都可以成为故事本身，这个想法引导我创作了《海洋日记》。”
    你们知道，这个同名的日记并不是一本装满了某人掉进海里的个人秘密的书。这个建筑本身就是一本日记。Junghan 将这个水下场景的不同部分视为他在整合它们时情感状态的反映。当你穿过它并进行探索时，它是一个模糊的、开放供解读的叙事。当
    Junghan 制作那条眼神狂野的鲨时，他在感受什么？


    当 Junghan 在网上分享《海洋日记》时——这是一个冒险的举动，因为从技术上说来说这是他的日记——社区立即对其对细节的关注以及对 Minecraft 海洋可能性的新颖方法表示赞誉。令人高兴的是，这些赞誉似乎进入了他的心里。“通过这项作品，我觉得我找回了许多自尊和自信。更重要的是，我很自豪我想要做这件事，并且通过完成它遵守了对自己的承诺。完成它是因为我想做。那是最幸福的事。”这花费了三个多年的制作，但现在
    Junghan 拥有了一个卓越的建筑、焕然新的信心，以及一本必读的日记。


    ![](img/85.jpg)


    ⬢

    右上角和右下角 | 一条巨大的鲨冲向一群毫无防备的鱼群。


    ⬢

    左下角 | 斑鱼是 Junghan 仔细重刻的许多海洋生物类型之一。


    ![](img/88.jpg)


    ## 值得一看的景观


    在开发《海洋日记》期间，Junghan 与两位高水平的艺术家 `LNeoX` 和 `LordKingCrown` 合作。他们对建筑的原始渲染图对于帮助他找到观众至关重要。“一张好的渲染图能赋予建筑生命，”`LNeoX`
    说，“它捕捉到了观众应该看到的特定视角。对于大型建筑，在游戏中是不可能捕捉其规模和氛围的。这正是渲染图变得非常重要的地方。”


    “就像任何书或电影一样，如果预告片或封面艺术看起来不有趣，人们就不会理会它，”`LordKingCrown` 解释了良好渲染图的重要性，“有些建筑在 Minecraft
    默认状态下看起来很好，但通过渲染图，你可以真正看到所有的细节。你可以帮助实现原始建造者所设愿景。”优秀的渲染图不能让糟糕的 Minecraft 建筑变得漂亮，但极出色的渲染图可以让美丽的
    Minecraft 建筑达到新的高度！或者在这种情况下，是新的深度。


    ![](img/89.jpg)


    ⬢

    除了海洋生物外，Junghan 还为他的虚构公民制作了用于旅行的水下交通工具。


    “我很自豪我想要做这件事，并且通过完成它遵守了对自己的承诺。完成它是因为我想做。那是最幸福的事。”


    ![](img/MMB_seadiary_isometric_1.jpg)


    ## 有些“鱼”味（腻）（注：此处为英文双关语，既指鱼类，也指可疑/诡异的事）


    在《海洋日记》中，你可以找到二十八种不同的鱼，包括一群基于蜜蜂块的生物，毫无疑问，它们既可爱又可吃。Junghan 使用玻璃板营造出一种逐渐消失的尾巴视觉效果。一个带有两个按钮当眼睛的蜜蜂块证明了有时最简单的想法是最有效的。Junghan
    用一个萤石块做了这条鱼的“身体”，确保他的建筑深度充满了光源，即使没有渲染图也是如此。他的建筑体现了 Minecraft 作为一种互动媒介的特性；它是截图的美好素材，但也非常好玩。在他们的家里周围游了几分钟后，你会羡慕这些奇妙的鱼！噢，也许鲨鱼嘴里的那些除外。


    ## 第十章


    ### 月球毁灭：太空前线


    作者：Maggie Gondo Wardoyo & Arkha Satya Taruna


    ![](img/MMB_Moondestruction_fullbleed_11.jpg)![](img/MMB_Moondestruction_cutout_2.jpg)


    在 Minecraft 中，还有什么东西比高度限制被建筑社区更肆意轻视吗？当《月球毁灭》被创造时，建造者本不应该超过 256 格，但热爱太空的作者们根本不在乎这些陆地的限制。他们快乐地向星辰冲刺。毕竟，能出什么差错呢？


    嗯，根据《月球毁灭：太空前线》中描述的灾难，出了大很多问题。它本质上是三个建筑合一：这艘船在任何太空游戏中看起来都很令人印象深刻，更不用说在一个基于坚实地面的创作游戏了；那个孤独的宇航员，虚弱地系在飞船上，他在危机中保持冷静值得受到表扬；以及一次看起来不那么友好的陨石撞击。这个建筑描绘了现实宇航员可能会为此失眠的事故，而且根据共同建造者
    Maggie Gondo Wardoyo 和 Arkha Satya Taruna 的说法，建筑的那个部分实际上是一个意外。


    “我用 `WorldEdit` 把月球表面的一个部分复制得太深了，”Maggie 解释道那场爆炸是如何产生的，“Arkha 在制作形状方面更擅长。他有一个想法，是把表面变成被陨石击中的损毁部分。”


    Maggie 和 Arkha 都来自印度尼西亚，他们是一对建筑搭档，尽管在 Minecraft 领域拥有了各自的职业，尽管 Maggie 起初并没有完全被这个建筑游戏说服。“诚实说，我觉得
    Minecraft 因为画质的原因不是一个好游戏——请不要觉得被冒犯——现在我完全不这么认为了！”即使有这种认知，也没有阻止她和 Arkha 建造出真正宏伟的东西。


    抛开不谈，是游戏的潜力和多样性最终说服了她。“在这里你可以做一切，从建筑、编程、玩小游戏到仅仅生存。这就是为什么我觉得 Minecraft 不仅仅是一个游戏。它还是通过艺术传递信息的媒介。“游戏对我来说就像一块画布，”Arkha
    说，他也是 Minecraft 的大粉丝，“我可以创造现实世界中无法做到的任何事情。”确实，但在 Minecraft 中制作一整个月球也不是什么容易的事。“我们完全在游戏中制作月球，花费了大量时间，因为它太大了，”Maggie
    说。巨大的规模意味着他们在建造时甚至无法看到月球的全貌。“我们不得不猜测它看起来是否足够好！”她说。尽管有这些限制，他们精心构建的陨石坑形成了一个比“足够好”高出几个级别的月球。尽管，知道这些建造者离开太空时，把自尊留在了地上。


    ![](img/91.jpg)


    ⬢

    Maggie 和 Arkha 希望他们的飞船充满真实的细节，如雷达天线、窗户和工业感设备。


    ![](img/91b.jpg)


    ⬢

    左侧 | 令人印象深刻的爆炸。


    ⬢

    右侧 | 正面视角提供了色调上的强烈对比，从火焰的暖色调到飞船的冷色调。


    ![](img/MMB_Moondestruction_fullbleed_13.jpg)


    ## 星星故事


    在 Maggie Gondo Wardoyo 在 `WorldEdit` 中的意外在他们的月球上留下陨石坑后，这对组合为他们的建筑构思了一个全新的场景。“我们想到月球被陨石击中影响了地球的生活。因此，他们派遣了一些去月球观察并分析到底发生了什么。”可能在太空中由于著名的听不到尖叫声是件好事，因为他们将面临一个巨大的冲击。


    ![](img/MMB_Moondestruction_cutout_3.jpg)


    ⬢

    一个友好的宇航员，其宇航服受到电影《星际穿越》的影响。


