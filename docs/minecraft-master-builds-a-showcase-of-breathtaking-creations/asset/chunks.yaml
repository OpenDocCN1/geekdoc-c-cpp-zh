  raw: 'Arkha recommends reaching out to other players. “I think the Minecraft community
    is one of the most active and largest gaming communities in the world. We can
    share our maps, texture packs, skins, and Minecraft tips and tricks. I’ve met
    many people through Minecraft, including my best friend and partners on Minecraft
    projects.”


    05


    Pick a Palette


    “This is part of the one- or two-week planning process,” Thomas Sulikowski explains.
    “We’ll go into a Minecraft world and start placing blocks that we think are nice
    color combinations. For a smaller project these can be twenty to twenty-five blocks.
    For a bigger project it can run to over a hundred blocks. For Aqua Princess, we
    really wanted to add these pops of color, because the reference image we got was
    super colorful. The colors were very punchy, very in your face. We wanted to mimic
    that in Minecraft, so we wanted to make sure that we picked the right blocks.”


    06


    Mods Are Your Friends


    Conquest Reforged – used by Minecrafttalsi to make the Rich Medieval Town – is
    one of the most popular Minecraft mods and it’s not hard to see why. Boasting
    over 12,000 blocks, extra textures, particle effects, and much more, it’s particularly
    popular with historical and fantasy builders. Likely because the bleak medieval
    age – where rumor has it you couldn’t even download Minecraft then – looks a lot
    more inviting through the rose-tinted glasses that Conquest Reforged’s terrific
    toolset offers.


    ![](images/73a.jpg)


    ⬢ An aerial shot of Future City by Zeemo, who likes to plan out his builds in
    advance.


    ![](images/73b.jpg)


    ⬢ To create their explosive moon, Maggie Gondo Wardoyo and Arkha Satya Taruna
    used WorldEdit.


    ![](images/73c.jpg)


    ⬢ Varuna found VoxelSniper helped create realistic-looking organic matter, such
    as the beautiful statue’s face in Agnoia Frieden.


    ![](images/73d.jpg)


    ⬢ Arkha and Maggie’s Cyber City celebrates the future of humanity, a fitting scene
    from builders who believe in community.


    ![](images/73e.jpg)


    ⬢ Varuna recommend choosing your blocks ahead of the build so you can find a palette
    that pops, like their vibrant blue tang.


    ![](images/73f.jpg)


    ⬢ Minecrafttalsi finds Conquest Reforged provides excellent tools for his vast
    medieval world.


