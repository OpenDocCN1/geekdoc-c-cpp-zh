- fmt: '

    # Aqua Princess started out as one of Varuna’s smaller builds. The client had
    a loose idea of what he wanted, plus a helpful reference image of a statue. “This
    woman underwater with her arm extended, and I think she was holding the castle.”
    That may have been what the client originally wanted, but Varuna soon countered
    with more ambitious plans. “We thought it would be even cooler if we found a way
    to wrap the castle around the woman, so it was all more unified. That’s when we
    added this long staircase going up to the castle with towers leading up to it
    that then wrap around her left shoulder.”


    ![](images/MMB_aquaprincess_fullbleed_12.jpg)


    ## This build is one that must be seen from several angles. This view displays
    how much higher the tower is than the princess.


    “Once I started getting a lot of orders, that’s when I really decided to file
    for Varuna to become a company.”


    ![](images/26.jpg)


    ### Top | The castle atop the princess’s outstretched hand.


    ### Bottom | The build team created a selection of different sealife, including
    clownfish and turtles, to populate the ocean around the castle.


    ![](images/18.jpg)


    ### Top | Thomas and his team worked meticulously to create an organic-looking
    human shape using the blocks.


    ### Bottom | A gigantic blue tang peeks through the windows of the tower.


    ![](images/MMB_aquaprincess_cutout_1.jpg)


    A large part of Thomas’s job is communicating with the clients. “Normally, when
    we start a commission, clients will be really excited and so they’ll be asking
    us for screenshots. I’ll send them, but they’re just a bunch of crazy lines drawn
    in Minecraft of where every single house is going to go and outlines for where
    the streets are going to go. They normally look at them and go ‘Oh, this doesn’t
    look nice at all!’” Varuna also checks in with the commissioner of the build “at
    least once a week” to show how their build is progressing. “We’ll make sure to
    send them the blueprint of the first house we create.” If the client doesn’t like
    the plan, they can let Varuna know “before we basically recreate the house in
    three thousand different ways.” A weekly check-in or potentially demolishing three
    thousand houses? Not hard to see why Thomas prefers the former.


    As the team became more involved in the build, the initial concept evolved. “Originally
    there was just one big fish around the castle, but we added all these schools
    of fish.” The builders researched images of lots of different fish “just to make
    sure they got the right dimensions” and refused to settle for just one species
    of fish, to make the build a wider, more varied reflection of ocean life. Smart
    architectural additions and bonus fish are nice extras, but they both pale in
    comparison to Varuna’s biggest idea. “In the back, behind the statue, there’s
    actually a shark.” It’s a giant hammerhead, in fact, that wasn’t in the original
    reference image. Meticulously crafting a massive shark and then tucking it behind
    the princess in your main render? Well, it makes for one heck of a surprise when
    you enjoy the build from other angles. Another alteration they made for the statue
    was bad news for anyone living in the castle who doesn’t want giant glowing eyes
    staring at them 24/7. “You’re watched all the time. No break!” The decision to
    give the princess such eerily bright peepers was made because “that was the easiest
    way we could bring out the details in her eyes.”


    In a build full of organic life, ancient monuments, and a stealthy shark, the
    toughest element for Varuna to get right was a convincing haircut. “It’s a very
    organic shape, a human being, and in a blocky world, it’s hard to mimic.” As if
    that wasn’t challenging enough, the team also had to contend with Minecraft’s
    unique interpretation of how gravity works. “The woman’s hair drops behind her
    neck and then curves over the right shoulder. It kept looking very weird because
    when you try and make something with gravity in a videogame that doesn’t have
    any gravity, it becomes exponentially more difficult. Since we’re so used to living
    in a world with gravity, there’s one specific way everything needs to look. If
    you don’t do it that way, everyone can recognize pretty quickly that it looks
    weird.” Only in Minecraft could you find less frustration in creating a shark
    than in giving a haircut.


    “There’s that saying that when you finish ninety percent of a project, you have
    ninety percent to go. That’s exactly how I feel with every project that we work
    on.”


    But Varuna managed to pull it off, and the princess is actually the part of the
    build that Thomas is most proud of. “I think we really nailed that!” If there’s
    a secret to his team’s success, it’s to keep going and push yourself through the
    frustrations. “You need to develop some level of patience. It only looks good
    if you are able to sit down with it over several weeks, perfecting it little by
    little. If you expect it to be perfect after you’ve built something from scratch
    after a few days, you’re going to get frustrated with the work that you’re creating.
    You’re just going to give up pretty easily, because it doesn’t look exactly the
    way that you want it.”


    “Developing that patience is extremely crucial. We had four people working on
    this project, and it took them several weeks. The shading and the texturing –
    those are details that are really slow to add. There’s that saying that when you
    finish ninety percent of a project, you have ninety percent to go. That’s exactly
    how I feel with every project that we work on. So be a little patient with Varuna,
    and they’ll reward you with a craft fit for a princess.”


    ![](images/25.jpg)


    ⬢


    **Top | The princess’s all-seeing eyes give this beautiful build an ominous tone.**


    ⬢


    **Bottom | The hammerhead shark that lurks behind the statue provides some peril
    to the ocean scene.**


    ![](images/MMB_aquaprincess_fullbleed_1.jpg)


    # BONUS BUILDS


    ## Agnoia Frieden & Vigrid


    ![](images/27.jpg)


    ### Agnoia Frieden

    Created by Chloriz as part of his application to work at the studio, Agnoia Frieden
    depicts a majestic statue of a woman. She stands within a valley and is surrounded
    by derelict temples. Both the statue and the buildings are covered in vines, moss,
    and weeds, as if nature is taking back the sacred space. Chloriz got the job,
    little surprise when you consider how well it matches Varuna’s skills as a studio
    in imitating organic


    ### Vigrid

    The word Vigrid means “a place where battle surges” in Old Norse. The creators
    of this build, BlackKing and RenQeN, have used this inspiration to craft an island
    under attack. Not only is the village of Vigrid facing three pirate ships, it
    also has an angry T-rex and an erupting volcano to contend with. The crescent
    island is peppered with bright red buildings, which contrast against the greens,
    browns, and blues dramatically.


    # Chapter Four


    ## Imperial City

    By Rigolo and Comeon


    ![](images/MMB_ImperialCity_fullbleed_12.jpg)![](images/MINE_MSBD_Test_SmallTower.jpg)


    The Imperial City by Rigolo and Comeon is a massive mish-mash of palaces, statues,
    buildings, and so much more. Inspired by several European cities, it should, by
    rights, be an incoherent mess. In fact, one of its architects might just argue
    that it is. But it’s a tourist trap that truly has everything, a seemingly never-ending
    city so vast that backpacking through Europe might even be the faster option.

