  trans: '

    Zeemo 的未来城看起来引人注目，但它远非乌托邦。你会发现一个拥有几个水箱的基地，甚至有更复杂的防御。“最精细也最引人注目的部分是 `Area 2-57`，一个巨大的玻璃穹顶。”
    `Area 2-57` 是一个实验性的军事化基地，是作为防止城市敌人攻击而建立的预防措施。“这个穹顶包含了几个非常有未来感的建筑，还有四个带有激光的圆柱模块。”它是城市中最复杂的区域之一，也是
    Zeemo 最为自豪的部分。


    ![](img/MMB_FutureCity_fullbleed_15.jpg)


    ⬢


    在这样的大都市建筑中，你本以为建筑会占据主导，但 Zeemo 确保了冰冷的钢筋和玻璃与大量的绿色区域保持平衡。


    尽管 Zeemo 喜欢现代建筑，但他并不是建筑设计中近期趋势的粉丝。“我不属于那种全玻璃面板建造的建筑流派。我喜欢装饰着玻璃的灯光混凝土柱。今天的建筑师缺乏原创性。他们的成就往往是无名的，缺乏新意，几乎完全相同，而且看起来很无趣。我讨厌建筑的有机风格和那些通向无处的曲线。”


    Zeemo 是由他十一岁的儿子介绍这款游戏的，当时儿子大约在 2011 年左右玩 `Minecraft` 的测试版。“我觉得这个游戏非常有趣，但当时还没有
    `Creative`（创造）模式。”幸运的是，他不需要等待某个遥远的未来文明发明它，因为 `Creative` 模式是 `Minecraft` 最早添加的功能之一。当他儿子宣布增加了
    `Creative` 模式后，Zeemo 立即投入了其中。


    他喜欢这个游戏的什么呢？“第一个吸引我眼的是……那些开采时会爆炸的方块。”噢，他的意思是字面上的击中。难怪他更喜欢 `Creative` 模式。除了那些陷阱方块外，Zeemo
    也也被“地图各个方向的巨大尺度，它的生物群、山脉、山谷、湖泊、河流、雨和雪”所吸引。“尽管方块很粗糙，但却有真实感。游戏提供的自由和它带来的宁静，都伴随着既振人心又放松的音乐。”


    ![](img/65.jpg)


    ⬢


    Zeemo 将他的未来城市景观充满了标志性的结构，让人想起 20 世纪 60 年代的太空旅行设计。


    ![](img/MMB_FutureCity_fullbleed_16.jpg)![](img/66.jpg)


    ## 如此艺术


    艺术装饰（Art Deco）是 Zeemo 城市的风格，起源于巴黎并一直到纽约。“Art Deco”是 `Arts Décoratifs` 的缩写，源自 `Exposition
    Internationale des Arts Décoratifs et Industriels Modernes` —— 这是 1925 年举办的法国国际装饰艺术工业博览会，它引起了国际对这种风格的关注。20
    世纪 20 年代的纽约摩天大楼对流行文化中未来城市的观念产生了巨大影响。许多电影、电视节目和游戏在设计中使用了艺术装饰元素。一个早期的例子是弗里茨·朗 1927
    年的电影《大都市》，它将现代技术与奢华结合，创造了一个至今仍在启发好莱坞的未来主义设定。


    “如果我必须重新开始，我会做得不同。我会避免某些风格的建筑，只保留那些最具未来城市代表性的建筑。风格将更加统一，城市的规划也会更有计划。”


    他是实验的大粉丝，而 `Minecraft` 中有很大的尝试空间。“有时你尝试某些东西，效果很好，而其他时候不行。当你不喜欢时，不要害怕重新开始并尝试别的东西，一种不同的风格，不同的颜色或不同的材料。”不断尝试新事物，直到你找到适合自己的东西。


    在开始八年后，Zeemo 继续致力于未来城的工作。他从那起将该建筑从 `Xbox 360` 转换到了 `PC` 版本（“当我得知 PC 上有光影渲染时，我逐渐放弃了游戏机”），你在这里赞叹的正是
    `PC` 版本。他的城市不再是所有幻想或中世纪建筑中的异类，因为 `Minecraft` 社区已经完全拥抱了科幻风。“我当时没有其他未来城市作为参考，”Zeemo
    回忆起项目开始时说。“如果我必须重新开始，我会做得不同。我会避免某些风格的建筑，只保留那些最具未来城市代表性的建筑。风格将更加统一，城市的规划也会更有计划。”


    漫步在 Zeemo 的未来城是一种令人清新的乐观体验。巧妙地利用有限的色调来描绘未来的高效愿景、大片生机勃勃的自然，以及贯穿整个城市的便捷地铁和传送器通道。诚然，传送器的存在本该让地铁完全过时，但让我们把这种琐碎的钻牛留在过去吧。


    ## 第八章


    ## Kythor 景观


    作者 qwryzu


    ![](img/MMB_Kythor_fullbleed_2.jpg)


    ### 纹理包


    - `Faithful 1.8` 来自 `Faithful`

    - `Better Terracotta Colors for Faithful` 来自 `qwryzu`


    ![](img/MMB_Kythor_cutout_1.jpg)


    `Minecraft` 是一组自豪的超现实彩色方块集合，每一个都是对复古 2D 像素艺术的直白情书。这里并没有尝试写实主义。但在 `Kythor Landscape`
    中，建筑师 `qwryzu` 打造了实际上类似于其灵感来源的世界景观。现在，这个刻意拒绝现实的游戏看起来却非常真实。


    `Minecraft` 远非 `qwryzu` 的唯一热情所在。“（在我建筑中的）地形是我的重点，因为我来自美国西南，自然一直是我生活中非常重要的一部分。我喜欢旅行、远足、露营，以及泛泛探索我家乡地区提供的极其多样化的生物群。如果我拥有世界上所有的钱，我只想做探索。”


    遗憾的是，`qwryzu` 并没有世界上所有的钱。由于他无法“把所有时间花在户外”，他开始寻找巧妙的方法在留在室内的同时享受户外。“我会在森林里建造舒适的小木屋，但一直对默认的山脉看起来不满意，所以我开始尝试制作自己的。”


    木屋是舒适创作的绝佳选择。毕竟，谁不想在熊熊的火炉旁伸直脚，坐在舒适的椅子上（或者根据 Minecraft 的规则，站在舒适的椅子旁边），放松一下呢？好吧，qwryzu
    显然发现自己关注的是建筑周围的景观而非建筑本身。“每当我制作新地图时，我会在上面建造一小时，但除了看到如何用下一张地图改进地形之外，什么都不做。最后我甚至停止了在地图上建造，因为只想继续制作景观。”


    幸运的是，他发现了一个选项无限的游戏。玩家的想象力越大，建筑就越宏。“Minecraft 是一款以无限可能为营销卖点的游戏，可能是我发现过的真正做到的游戏。我喜欢这种可以建造任何我想要东西的自由。我坐在这里制作漂亮的山脉，而其他人在游戏里制作了真正的计算机。Minecraft
    社区还创造了整个游戏界中最具活力的模组/数据包场景，这意味着当你对原版 Minecraft 缺乏主意时，永远不缺少要做的事。”


    ![](img/MMB_Kythor_fullbleed_3.jpg)


    ⬢


    蜿蜒的河流穿过茂盛的丛林山谷。“我喜欢旅行、远足、露营，以及泛泛探索我家乡地区提供的极其多样化的生物群。”


    南部低地


