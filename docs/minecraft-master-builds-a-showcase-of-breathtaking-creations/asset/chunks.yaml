    Considering natsu3012’s strong passion for large builds, it’s somewhat surprising
    that they’re actually a big advocate for the merits of keeping some things simple.
    “To build on a large scale, I would advise first of all to have a solid foundation
    with very simple constructions. Understand that simplicity is not a defect, it
    allows a better reading.” It’s how they’ve managed the tricky balance of making
    a city look deliberately claustrophobic without being an eyesore.


    This meticulous builder likes to stress the importance of planning ahead. “You
    must have a guideline, an intention for what you plan to do will allow for a coherent
    project.” And, of course, they had a strong idea for their futuristic city ahead
    of beginning the building. “The plan for `Earthsky` was to make a ‘finished’ city
    on a limited surface, with buildings that are superimposed, but practical for
    the players. There’s a multitude of paths at different levels that it is possible
    to take.”


    Although it’s a floating city, natsu3012’s `Earthsky` is surprisingly grounded
    in realism. “I wanted to design a walkable space, sometimes looking like alleys
    that go up and down, sometimes more like public places.” This architect may have
    two different predictions for the future of humanity, but if they’re the one planning
    it, we may be in safe hands.


    # Chapter Six


    ## Gothencrow

    By Rajkkor


    ![](images/MMB_Gothencrow_fullbleed_25.jpg)


    ### Texture pack

    - ◾ `Dokucraft Light` by `Dokucraft`


    ![](images/MMB_Gothencrow_cutout_4.jpg)


    Gothic build `Gothencrow` is a proudly gloomy city of dark lore, featuring imposing,
    immensely detailed architecture that actually started as something significantly
    merrier. Gothencrow’s architect Vincent Grenfeldt (known in the Minecraft community
    as `Rajkkor`) had just joined the Minecraft server and YouTube channel `FyreUK`.
    Three months into joining, his first project was to participate in one of their
    videos, but they wanted to populate it with more cities.  “That’s when I thought
    it would be nice to have a Gothic world in there. `FyreUK` hadn’t done a Gothic-themed
    build yet.” He then found out it was going to be a time-lapse video, something
    he hadn’t worked on before.


    Minecraft time-lapse videos show an entire build being constructed block-by-block,
    super sped up. They’re excellent for seeing how teams put their builds together
    and incredibly addictive to watch. They also require a lot of answers before even
    placing a block. “What are the houses supposed to look like? What are the big
    builds in it? What is the style? What types of details are in there?”


    Vincent soon discovered there would be limitations. “It turned out that apparently
    the details that I’d chosen for the build were a bit too complex for what the
    average person can do under a time-lapse. Because when you do a time-lapse, you
    have to take into consideration that not everybody has built for more than a year
    or so. It has to be a simple style, but look good enough. The purpose is to construct
    the map from the ground up.” He eventually decided to just make `Gothencrow` a
    big world instead of a time-lapse.


    ![](images/MMB_Gothencrow_fullbleed_29.jpg)


    ⬢


    Although the title of the build is Gothic, the choice of blocks is surprisingly
    colorful. Vincent used prismarine to add a little vibrancy to his fantasy town.


    “My friend introduced me to Minecraft. It was a long time ago! I was around twelve.
    I started playing `Survival` mode and it was some time later that I got into map-making.”


    ![](images/MMB_Gothencrow_fullbleed_6.jpg)


    ⬢


    The colors of the church stand out against the pale backdrop of the snowy mountains.


    ![](images/52.jpg)


    ⬢


    - **Top**: Vincent has perfected hiding majestic castles behind giant, wooded
    mountains.

    ⬢


    - **Bottom**: What secrets might be discovered in this mysterious waterfall clearing?


    Vincent took inspiration from the games he enjoyed playing. “At the time I was
    interested in `Dark Souls`. I really liked the old, European-inspired architecture
    in that game, so I thought it would be interesting to do something on that theme.”
    For those who have never had the pleasure of dying over and over again, `Dark
    Souls` is a huge fantasy RPG by Japanese studio `FromSoftware`. `Minecraft` is
    slightly friendlier though, whereas `Dark Souls` is the weeping king of grimdark
    video game fantasy. It’s full of imposing architecture that looks like you could
    cut yourself on it just from looking at it. Both clear inspirations for `Gothencrow`,
    but Vincent was also influenced by “Gilneas, a city in `World of Warcraft`.” Blizzard’s
    long-running MMORPG is pretty dark in places too, but has a far more colorful
    and welcoming approach to fantasy. “The ambience and the environment came more
    from `World of Warcraft`, with the fairy-tale influences, and the architecture
    of choice became more like `Bloodborne` and `Dark Souls 3`. The entire theme of
    the city evolved as my interests changed.”


    This is somewhat inevitable when builders take on projects as large and time-consuming
    as this one. Naturally, as your build expands and time passes, your tastes and
    interests are going to develop and change too. “People mature, but their tastes
    don’t actually change that much. They want something similar to what they had
    as a kid, but more adapted for their current age.” You can see the change in his
    interests in the loose narrative that Vincent constructed for `Gothencrow` too.
    There are pulpier ideas, like werewolf-summoning priests, but also more mature
    details, like the evolution of the city from a small village, and how that growth
    affected the building styles.


    What inspired the name “Gothencrow”? The “Goth” part is pretty obvious. Vincent
    happily admits he had no knowledge of Gothic architecture when he pitched the
    build to `FyreUK`. “I just wanted to make something like `Gilneas` and `Dark Souls`
    and they said ‘OK, you’re going for Gothic architecture?’” As for the “crow,”
    you’ll find insignias of these inky-feathered friends all over Vincent’s city.
    “I think that was inspired by `Game of Thrones`,” he says, pointing out they’re
    a rightful cliché of the genre and provide a wonderfully spooky atmosphere. “If
    you ever have a haunted mansion, you’ll always hear crow sounds.” But the third
    influence on the name was actually `Gothenburg`, the Swedish city, with its harbors
    and architecture inspiring a lot of `Gothencrow`’s layout.


    If he was building the city today, Vincent says he’d approach the design differently.
    “Gothencrow actually had a pretty planned layout. There is no city that is built
    like that naturally, at least not in Europe. Most cities start out as a village.
    OK, now we need a church. OK, now we need a market for the traders. Oh, it looks
    like we’ve got a new religion, going to have to make a corner for that. Oh, looks
    like the scientific revolution just happened, we’re going to have to extend the
    university.” His favorite part of the build is the king’s castle. “That was the
    last build I did.” Vincent sees the castle as a showcase of just how much his
    building skills had improved between joining `FyreUK` and starting `Gothencrow`.
    The more Vincent thought like an actual city planner, the more his build logically
    snapped together. “When I designed the castle, I tried to think about what parts
    would have been built first. What parts would have come later as the kingdom prospered?
    This is especially true for castles in general, where it will start as a fort,
    and as the village around the castle grows and walls are built, the need for the
    castle to be protected is diminished. I find that part of building history exciting.”

