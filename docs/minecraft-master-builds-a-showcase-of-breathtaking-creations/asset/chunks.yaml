- fmt: '

    “You can also, if you’re lucky, end up with something that is metaphorically interesting
    as well. The title ‘Dystopian Mindset’…you could look at it as someone being consumed
    by an idea. That’s not how I intended it, but if you didn’t know that, you very
    well could assume it, right? If you get the right ideas and you mash them together
    sometimes you strike gold.”


    Sometimes Jossieboy decides his themes in advance, and other times they naturally
    or accidentally develop as he’s working on a build. When that happens, he bluffs
    that they were his intention all along. “You just go ‘oh yeah, I meant to do that.’”


    Jossieboy got into `Minecraft` in 2012 when he was in his early teens, long before
    the idea for a skull city started living in his head. “My older brother showed
    it to me and I was pretty much directly hooked on the idea of being able to make
    stuff. I didn’t care much for the `Survival` aspect as I kept dying.” But he clearly
    loves `Creative` mode. “Minecraft` is basically a big ol’ box of Lego and you
    can make whatever you want. That’s what makes it so special.”


    ![](images/MMB_DystopianMindset_fullbleed_10.jpg)


    ⬢


    This eclectic city also features a giant duck statue and several digital billboards,
    because why not?


    “I really like grabbing two concepts and then smashing them together to create
    interesting imagery.”


    ![](images/136a.jpg)


    ⬢


    What mind palace is complete without multiple vehicle options and a gas station
    to fill them up?


    ![](images/136b.jpg)


    ⬢


    Jossieboy used the skull as a base for the city, which means his buildings are
    stacked on top of each other, giving the appearance of a packed urban living space,
    very dystopian.


    The two ideas Jossieboy combined for `Dystopian Mindset` were “big stone face…but
    also city?” This idea was fermenting in Jossieboy’s mind for some time, until
    he was eventually inspired to pursue it when he saw `Avengers: Infinity War`.
    “They visit a place called Knowhere. A mining town built into an ancient skull.”
    Knowhere isn’t just any old skeleton head – it’s essentially the size of a planet.
    “Obviously, I don’t have the scale to build that in `Minecraft`, that’s way too
    massive. But the idea of a civilization living inside of an old head and mining
    it for resources is what I went with from that.” There’s even a small mining district
    in `Dystopian Mindset`, a deliberate nod to Marvel’s film.


    Rather than planning out a build, Jossieboy prefers to jump straight into 3D modeling.
    “I tend to work better in 3D. It’s a lot easier for me to sculpt something with
    blocks. I use `VoxelSniper`, which allows you to create a lot of blocks really
    quickly. So first I shaped it, I started with the neck and jaw. That’s an easy
    shape to make because it’s a kind of arch. I looked at all kinds of references
    to see how a face is constructed.” Jossieboy talks through how he gradually reconstructed
    the anatomy of a skull, block by block. “OK, I kind of have a mouth shape and
    a nose shape, and that has to go up into a brow, forehead, stuff like that. I
    slowly shape it and then piece the brow back in. I’ve made the head too big, but
    that’s OK, because I’m going to destroy most of it and then pull it back in. Add
    some ears and slowly I get this head shape. Then I just refine that more and more.”
    Who knew creating life could be so complicated?


    Once he’d finished the base shape of the skull, Jossieboy made a backup copy,
    then started the same process for where he wanted the buildings. “I wanted a very
    big round thing where his other eye was. I think it’s really cool if you mimic
    the shape of architecture but it looks a lot more electronic. It’s almost part
    of the eye, but still not. I marked that out and then started building houses
    on the side. Houses spreading out from his eye, almost like a tumor. I’m willing
    to bet there’s some allegory or something there!”


    ![](images/MMB_DystopianMindset_fullbleed_7.jpg)


    ### Shell Company


    This city within a skull might not even be Jossieboy’s strangest build. Another
    astounding construction concept he put together was “a hermit crab organic sculpture,
    but in the back of it it’s got a ramen noodle restaurant.” Because of course it
    does. “A little hermit crab making ramen noodles. It’s got a little `Zippo` lighter
    that’s heating up a bowl. Because, y’know, he’s tiny. I don’t know why, but the
    idea of taking a hermit crab and putting it in the position of being head chef
    of its own little restaurant that’s also its shell – it just seemed adorable to
    me.” `Dystopian Mindset` – although not as quirky – exhibits the same freedom
    of imagination.


    ![](images/MMB_DystopianMindset_fullbleed_9.jpg)


    ### H-eye-light


    Jossieboy is particularly pleased with how the eye of the build came together.
    “The main focal point is the eye.” Which is rather apt as a focal point draws
    your eye to it the most, and in Jossieboy’s build, it’s literally an eye. “It
    just looks like there’s an eye there or that there was one. But it’s not there
    anymore. Which I think is a really cool idea – replacing it with a bionic eye
    that’s not really an eye.” Jossieboy’s wish that the head is screaming instead
    of smiling makes more sense with every word.


    Jossieboy used color-coded blocks, which he intended to later replace, for the
    different districts. “I know that I want contrasting stuff. If all my buildings
    are the same color it’s not going to look good. That doesn’t mean all the buildings
    in these blocks of color are going to be the same, just that they’re going to
    contrast with whatever’s next to it.” To help that contrast, he gave the city
    distinct districts: the mining town, a more residential area, and a scientific
    research district. “That’s how I went to work – base shape, color, and then details.
    I wanted a lot of colorful buildings to contrast with the gray and green head.
    I ended up using a lot of the `glazed terracotta`. Mostly just vibrant, colorful
    things to contrast the face.”


    A rainbow of colors was important to Jossieboy, but so was ensuring that people
    would immediately recognize what they were looking at, which is one of the motivations
    for the build’s sinister smile. “The main reason he’s smiling, more than anything,
    was because I wanted to make it a bit creepy. But also because making closed lips
    would have required more shading and I wanted it to be fairly simple on the actual
    skull. The left side is pretty much decimated, and at one point I was planning
    to do that for the whole side. But if the mouth was closed, there might not have
    been enough of the face to make out it was a face.”


    ![](images/MMB_DystopianMindset_cutout_10.jpg)


    ⬢


    Fancy staying in a hotel built within a skull?


    ![](images/MMB_DystopianMindset_fullbleed_1.jpg)


    ⬢


    A top-down view shows how the vehicles are able to float above the city, making
    it easier to get to high levels.


    Chapter Fifteen


    The Uncensored Library


    By Blockworks


    ![](images/Uncensored_library_fullbleed_19.jpg)


    Texture pack


    ◾ Custom-made by Blockworks


    ![](images/Uncensored_library_cutout_6.jpg)


    Libraries are one of the greatest achievements of human civilization. Sanctuaries
    of shared knowledge, free and open to all, and a great way to enjoy this book
    without having to pay for it. But sadly, free information for all is far from
    a universal human right. It’s shocking to learn how much censorship and curbs
    on press freedom have impacted the world. That’s why Reporters Without Borders,
    an international nonprofit organization specializing in media freedom, collaborated
    with Minecraft build team Blockworks to construct The Uncensored Library. It’s
    such an ambitious, sprawling build that “library” may even be a misnomer – Blockworks
    has actually crafted an entire island to explore. One that’s an ingenious way
    of sneaking past censorship laws to get free information to everyone.

