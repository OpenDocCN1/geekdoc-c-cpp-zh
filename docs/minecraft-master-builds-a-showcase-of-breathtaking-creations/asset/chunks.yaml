  trans: '


    由于 Gothencrow 的主要灵感来自视频游戏，因此听闻 Vincent 从小就开始玩游戏并不意外为奇。“我的朋友向我介绍了了 `Minecraft`。那是很久以前的事了！我当时大约十二岁。我开始玩生存模式，过了一段时间后，我开始了地图制作。”如果不是学校突然给了他一个巨大的动力去尝试一种新方法，Vincent
    可能会一直玩生存模式模式。“当时有一次比赛，我们被要求创建一个冒险地图。’比赛的唯一规则是地图必须以水下为主题。‘我们制作了一个关于一个角色的冒险地图，这个角色与朱尔·凡尔恩《万里的海底沉踪》中的尼摩船长非常相似。故节是关于一个人发现海底城市的故事。所以这并不怎么原创！但更多在于实际的建造，即对周围世界进行实际构建。我们建造了我们对大特兰蒂斯的解读。’”


    ![](img/58a.jpg)


    ⬢


    Vincent 在他的哥特式建筑中创建了一些小村庄。这个宁静的小村落配有一座小教堂和一个风车，被一棵盛开的美丽树俯瞰着。


    ![](img/58b.jpg)


    ⬢


    从左到右 | 日常房屋坐落在这一宏伟的建筑之中；一只巨鹰守护着瀑布林地；风车和房屋的详细剪纸图。


    ![](img/MMB_Gothencrow_fullbleed_30.jpg)


    # 充满故事的历史


    在设计建筑时，Vincent 喜欢考虑叙事性，而港口右侧带有小塔的堡垒背后有一个非常详细的故事。“那是怪兽猎人的总部和怪物监狱所在地。我试图思考这栋建筑的历史，哪些部分是先建造的，哪些部分是后来为了建筑所有者某种目的的扩张需要而添加的。对于怪兽猎人来说，塔楼是底层建筑的延伸，那座建筑曾作为守卫的官方监狱，直到他们发现了怪物，并需要开发一座特殊的塔楼来关押怪物。’”


    ![](img/MMB_Gothencrow_cutout_3.jpg)


    Vincent 和他的团队那难以捉摸的海底城市赢得了比赛。但现在 Vincent 看到的只有他旧作品的缺陷。“那时的 `Minecraft` 还没有环绕方块的水，”他解释道，对于这是一个在
    `The Update Aquatic` 改进 `Minecraft` 海洋很久之前建造的建筑，“如果你下去并在水下放置半块，它会在半块没有被完整方块覆盖的部分周围创建一个真空或气泡。所以它看起来并不那么好。然后我们收到了一个建造水下基地的男人的投诉，他说他的建筑比我的更酷，因此他本应该赢的。我想：‘好吧，那我最好还是改进一下。’”


    那个输不起的家伙对 Vincent 来说是一个出意意外的良好动力。他开始寻找一个可以加入的 `Minecraft` 服务器来帮助提高他的建筑技巧，因为他显然已经迷上了地图制作。“我非常喜欢制作像《古墓丽奇兵》或《印第安纳·琼斯》风格的地图，你前往这些史诗般的地点，然后探索它们并并在那里发现古老的建筑。”


    就在那时 Vincent 发现了他理想的服务器。“我很喜欢 FyreUK，所以觉得加入他们会很不错，做一些建造，并找到一个更集中的建筑社区，在那里人们可以与其他建筑师交流并向他们学习。”除了
    Gothencrow，Vincent 还参与了其他 `FyreUK` 项目，例如 2013 年圣诞延时摄影、精灵港 2.0，以及几个延时摄影项目，如 Kirtipur。遗憾的是
    `FyreUK` 已关闭了他们的数字大门，但他显然学到了很多东西，建造了一个既阴险又壮丽的哥特式盛宴。


    ![](img/MMB_Gothencrow_fullbleed_28.jpg)


    ⬢


    这座如画般的小镇让人联想起巴伐利亚和东欧的城市，布满了彩色的瓷砖和木制细节。


    “Gothencrow 实际上有一个很有计划的布局。没有哪个城市是自然那样建造的，至少在欧洲不是。大多数城市都是从村庄开始的。”


    # 第七章：未来城市


    ：Zeemo


    ![](img/MMB_FutureCity_fullbleed_17.jpg)![](img/MMB_FutureCity_cutout_5.jpg)


    当法国建筑师 Zeemo 开始玩时，`Minecraft` 社区还处于早期阶段，但他对他所看到的景象仍印象深刻。“当我发现其他建筑师建造的作品时，我被城堡和纪念碑的美感所迷住。”但他看到的大多数社区作品都是中世纪风格的。“在我看来，现有的少数城市并没有任何未来感的东西。”所以
    Zeemo 决定他要成为那个填补这一空白的人。“我看了几个具有未来感的游戏和图片，并尝试了一了一下。”


    这是一个聪明的方法。通常识别出你在社区中看到的作品缺少了什么，并填补那个空白，是让你的项目获得更多关注的极佳方法——毕竟，它将是独一无二的。Zeemo 提到《光环》和《质量效应》等游戏作为影响，还有未来主义电影系列《星际迷航》和《星球大战。“我看了几张未来感的图片来寻找灵感。然后我寻找如何在
    `Minecraft` 中重建这些建筑，弄清楚选择哪些方块以及如何操作。随着时间的推移，我最终形成了了自己的风格。”


    当然，参与过《星球大战》和《质量效应》的艺术家们可以使用一些用于制作数字景观的最尖端技术。而 Zeemo 在 2014 年左右开始创作“未来城市”，使用的是
    `Xbox 360` 版本的 `Minecraft`，比现在的版本要限制得多（彩色玻璃块的缺失尤其令人沮丧）。原生 `Minecraft` [一个没有经过模组的版本]
    中的方块非常适合中世纪世界，但并不适合未来世界，这可能就是早期的社区作品大多集中在中世纪。如果 Zeemo 想要一个新时代的城市，他将发挥创意。“尽管方块很粗糙，但有一种真实感。游戏提供的自由以及它带来的宁静，配上既励人心又放松的音乐。”


    ![](img/61.jpg)


    ⬢


    在建造一座极其复杂的城市的同时，Zeemo 还花时间创作了一系列飞机来填充他的天空。


    ![](img/MMB_FutureCity_fullbleed_2.jpg)


    “我看了几张未来感的图片来寻找灵感。然后我寻找如何在 `Minecraft` 中重建这些建筑，弄清楚选择哪些方块以及如何操作。随着时间的推移，我最终形成了了自己的风格。”


    幸运的是，这远不是问题。“当英理石方块出现时……它是我的完美方块。我终于可以使用英理石楼了。”他充分利用了它。对于 `Xbox 360` 上缺少彩色玻璃的问题，Zeemo
    通过冰块作为窗户找到了通办法，利用了它们的蓝色调。这证明了限制有时对创意是有益的。当你能够无限获取资源时，很容易尝试使用所有东西，导致设计看起来杂乱或过度繁忙。通过拥有如此小的调色板，Zeemo
    的未来城市处处看起来非常一致，而且经过了深思熟虑的真实。


    Zeemo 引用了迪拜的天际大楼哈利法法塔作为影响。“我喜欢我制作的许多建筑那种未来感且整洁的设计。我通常用一个角形屋顶来完成我的建筑……以及一根经常发光的桅杆或某种天线。就像哈利法法塔一样，顶层楼是为了完成设计，增加建筑的存在感。’”


    ![](img/62.jpg)


    # 穹顶之下


    '
- fmt: '

    Zeemo’s Future City looks inviting, but it’s far from a utopia. You’ll find a
    base with several tanks, and even more sophisticated defenses. “The most elaborate
    and also the most striking section is `Area 2-57`, a gigantic glass dome.” `Area
    2-57` is an experimental, militarized base, created as a precaution in the event
    of attack from the city’s enemies. “This dome contains several very futuristic
    buildings, but also four cylindrical modules with lasers.” It’s one of the most
    complex areas of the city, and the part that Zeemo is most proud of.


    ![](images/MMB_FutureCity_fullbleed_15.jpg)


    ⬢


    In such a metropolitan build, you would expect the buildings to dominate, but
    Zeemo has made sure to balance the cold steel and glass with plenty of green areas.


    Although Zeemo enjoys modern architecture, he’s not a fan of more recent design
    trends in building design. “I am not from the school of building entirely in glass
    panels. I love an illuminated concrete column decked out in glass. Architects
    today lack originality. Their achievements are often anonymous, without novelties,
    practically all identical, and boring to look at. I hate the organic style of
    buildings and the curves that lead nowhere.”


    Zeemo was introduced to the game by his eleven-year-old son, who was playing the
    beta version of `Minecraft` around 2011. “I found the game to be really fun, but
    there was no `Creative` mode at the time.” Luckily, he wouldn’t have to wait for
    some long-distant future civilization to invent one, as `Creative` mode was one
    of the earliest `Minecraft` additions. As soon as his son announced that `Creative`
    mode had been added, Zeemo dived back in.


    What was it he liked about the game? “The first thing that struck me…were the
    blocks that exploded when they’re mined.” Ah, he means literally struck him. No
    wonder he prefers `Creative` mode. Traitorous blocks aside, Zeemo was also taken
    by “the immensity of the map in all directions, with its biomes, mountains, valleys,
    lakes, rivers, rain, and snow. There’s realism despite the coarseness of the blocks.
    The freedom offered by the game and the calm it brings, all accompanied by music
    that is both motivating and relaxing.”


    ![](images/65.jpg)


    ⬢


    Zeemo has filled his futuristic cityscape with iconic structures, reminiscent
    of 1960s spacefaring designs.


    ![](images/MMB_FutureCity_fullbleed_16.jpg)![](images/66.jpg)


    ## Oh So Arty


    Art Deco, the style that inspired Zeemo’s city, originated in Paris and spread
    all the way to New York. “Art Deco” is short for `Arts Décoratifs`, which comes
    from `Exposition Internationale des Arts Décoratifs et Industriels Modernes` –
    a French World’s Fair held in 1925 that brought international attention to the
    style. Those 1920s New York skyscrapers had a huge influence on pop culture’s
    idea of a futuristic city. A lot of movies, TV shows, and games use Art Deco motifs
    in their designs. One early example is Fritz Lang’s 1927 movie `Metropolis`, which
    merged modern technology with opulence to create a futurist setting that still
    inspires Hollywood today.


    “If I had to start over I would do it differently. I would avoid certain styles
    of buildings to keep only those that are the most representative of a futuristic
    city. The style would be much more homogenous and the development of the city
    better planned.”


    He’s a big fan of experimentation and there’s a lot of room for that in `Minecraft`.
    “Sometimes you try something, and the effect works and other times it doesn’t.
    When you don’t like it, don’t be afraid to start over and try something else,
    a different style, a different color, or a different material.” Keep trying new
    things until you find what works for you.


    Eight years after starting, Zeemo continues to work on Future City. He’s since
    converted the build from `Xbox 360` to the `PC` version (“When I learned of the
    existence of shaders on a PC, I gradually abandoned the game console”) and it’s
    the `PC` version you’re admiring here. His city is no longer an outlier amongst
    all the fantasy or medieval builds, as the `Minecraft` community has fully embraced
    science fiction. “I had no other futuristic city as reference,” Zeemo remembers
    from when he started the project. “If I had to start over I would do it differently.
    I would avoid certain styles of buildings to keep only those that are the most
    representative of a futuristic city. The style would be much more homogenous and
    the development of the city better planned.”


    It’s refreshingly optimistic to take a stroll through Zeemo’s Future City. The
    clever use of a limited color palette to depict an efficient vision of tomorrow,
    vast swathes of thriving nature, and easy access to both subways and teleporters
    throughout the city. True, the presence of teleporters should make that subway
    completely obsolete, but let’s leave such petty pedantics in the past.


    ## Chapter Eight


    ## Kythor Landscape


    By qwryzu


    ![](images/MMB_Kythor_fullbleed_2.jpg)


    ### Texture pack


    - `Faithful 1.8` by `Faithful`

    - `Better Terracotta Colors for Faithful` by `qwryzu`


    ![](images/MMB_Kythor_cutout_1.jpg)


    `Minecraft` is a proudly surreal collection of colorful cubes, each one an unabashed
    love letter to retro 2D pixel art. There’s no attempt at photorealism here. But
    in `Kythor Landscape`, builder `qwryzu` has crafted terrains that actually resemble
    the real-world landscapes that inspired them. Now a game that deliberately rejected
    realism looks realistic.


    `Minecraft` is far from `qwryzu`’s only passion. “Terrain [in my builds] is my
    main focus because I’m from the American Southwest and nature has always been
    a huge part of my life. I love traveling, hiking, camping, and just generally
    exploring the huge diversity of biomes that my home region has to offer. If I
    had all the money in the world, I would do nothing but explore.”


    Unfortunately, `qwryzu` doesn’t have all the money in the world. Since he couldn’t
    “spend all my time the outdoors” he started finding clever ways to enjoy the outside
    while staying indoors. “I would build cozy cabins in the woods but was never happy
    with how the default mountains looked, so I began trying to make my own.”


    A cabin is a great choice of cozy craft. After all, who doesn’t want to put their
    feet up by a roaring fire, sit back in a comfy chair (or, by Minecraft rules,
    stand next to a comfy chair), and relax? Well, qwryzu, apparently, who found himself
    focusing on the landscapes surrounding his constructions rather than the builds
    themselves. “Every I made a new map, I would build on it for an hour, but could
    do nothing except see every way I wanted to improve the terrain with my next one.
    Eventually I stopped even building on my maps because just wanted to keep making
    the landscapes.”


    Luckily, he’d found a game with unlimited options. The bigger a player’s imagination,
    the bigger the build. “Minecraft is a game that markets itself with endless possibilities,
    and might be the only game I’ve ever found that truly means it. I love the freedom
    to be able to build whatever I want. I’m sitting here making pretty mountains
    while there’s other people out there making actual computers in the game. Minecraft’s
    community has also created one of the most vibrant modding/data pack scenes in
    the entire gaming world, which means that there’s never really any shortage of
    things to do even when you’re out of ideas for vanilla Minecraft.”


    ![](images/MMB_Kythor_fullbleed_3.jpg)


    ⬢


    The serpentine river winds its way through the luscious jungle valley.


    “I love traveling, hiking, camping, and just generally exploring the huge diversity
    of biomes that my home region has to offer.”


    ![](images/68a.jpg)


    ⬢


    An aerial view captures the scale and majesty of this vibrant landscape.


