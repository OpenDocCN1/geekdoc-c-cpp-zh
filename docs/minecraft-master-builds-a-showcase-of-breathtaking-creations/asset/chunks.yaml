    # 序言


    _


    Minecraft 最令人惊叹的事情之一，就是我们都可以分享自己的创作，互相激发灵感并共同学习。


    我从未认为自己是一个建筑师，不像那些其他人——比如那些建造了你书中看到的这种种作品的人。我觉得他们身上拥有某种我所缺失的特殊之处。我花了许多小时观察玩家建造惊不起的作品，研究他们作品的细节，试图弄明白他们是如何让某个东西看起来如此美丽的。毕竟，我们都使用相同的方块，因此在每一个作品中都有发现新风格或新技巧的机会。


    我继续建造，承担更大的项目并为它们制作视频，甚至加入了 Minecraft 开发团队。尽管如此，我从未在某一个时刻觉得自己变成了一个建筑师——还有有太多东西要学习了！随着时间的推移，我意识到并没有什么必须逾越的标准。我们都可以建造，凭借
    Minecraft 社区无止尽的想象力，总会有新事物激发我们的灵感。


    无论你是在寻找纯粹为了美学而赞叹的精彩创作，还是在为你世界中的下一个项目寻找灵感，我确定你会在书中有所收获。凭借每位玩家独特的背景，总会有新的视角引向另一个惊人的项目。


    我们都是建筑师。


    Mikael “slicedlime” Hedberg


    *Minecraft 技术主管兼内容创作者*


    # 第一章


    ## Aman，不朽之之地


    作者：Iskillia


    ![](img/MMB_aman_fullbleed_17.jpg)![](img/MMB_aman_cutout_2.jpg)


    Iskillia 给建筑师们的主要建议是：“你必须完成它”，他认为这是他成功的秘诀。“我确实花时间，但也会完成我开始的事情。我强迫自己做到这一点。你必须完成它！”这位法国建筑师、才华横溢的渲染师以及这些不朽之地的设计师说道。


    在经过十八个月的苦心打造后，Iskillia 通过完成宏大的奇迹 Aman 证明了他的言论，它是许多折衷影响的结晶。彼特·杰克逊《魔环王》电影中宏伟的米城（Minas
    Tirith）是美术设计的一项惊人成就，它显然影响了 Aman 的雕像和堡垒看起来既威严又美丽的方式。植被灵感来自法国南部的优美葡萄园，Iskillia 幸运地住在附近。


    ISBN 9780593598993


    电子书 ISBN 9780593600061


    [randomhousebooks.com](http://randomhousebooks.com)


