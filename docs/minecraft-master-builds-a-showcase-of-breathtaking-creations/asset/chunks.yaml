- fmt: '

    It was Rigolo’s younger brother, Comeon, who introduced him to Minecraft, thinking
    it would appeal because of how much Rigolo enjoyed Lego. “There were never enough
    pieces, so the idea of being able to build something with unlimited material –
    I liked it.” After a few practice projects to get acquainted with the game (“probably
    a horrible house or something,” says Rigolo of his first build attempts), the
    brothers quickly decided to create a city. “We opened the map and we started with
    this project. The only build I ever made in Minecraft. I’ve never worked on anything
    else.” Well, when the project covers this much ground, is there any need to?


    ### The Evolution of the Imperial City


    There was no pre-production. Rigolo and his brother simply decided “to build something
    impressive without any plans. We started with a square, started to put buildings
    around it, and bit-by-bit we started building bigger and bigger, learning all
    the little tricks to be able to build things that are that big.”


    Plenty of Minecraft architects craft a building and call it a day. But Rigolo
    and Comeon, perhaps because they’d never made a plan, didn’t know when to stop.
    Whenever one of them would build something, Rigolo would identify what it was
    missing, and construct that too.


    ![](images/41a.jpg)


    ⬢


    Taking a lead from modern European cities, the brothers mixed architecture styles
    and periods to give credibility to their city.


    ![](images/41b.jpg)


    ⬢


    Left | Rigolo and Comeon added splashes of color to the buildings to invigorate
    the natural stone palette.


    ⬢


    Right | They even designed a sports arena fit for the Olympics!


    ![](images/MMB_ImperialCity_fullbleed_8.jpg)


    ### Fairly Inspired


    World’s fairs – celebrations of cutting-edge technology during the nineteenth
    and twentieth centuries – were a big influence on the Imperial City. But it’s
    obviously too big a build to have just one influence; the brothers were inspired
    by architecture from all over the world. “There’s a lot of Stalinist architecture.
    These very high, augmented buildings. You can see some of them in Moscow, where
    they mixed a lot of architectural elements from the baroque, neoclassical period.”
    Other influences were a lot closer to home, such as the large domed French Pantheon.
    “We reproduced, a little bit, the environment we grew up in. I moved to Paris
    when I was eighteen and those big monuments are the kind of architecture you have
    around.”


    ![](images/29a.jpg)


    ⬢


    The brothers designed many bridges to cross the rivers and canals, as well as
    boats.


    ![](images/29b.jpg)


    ⬢


    Left | They referenced several different architectual styles in the decor of the
    city, including Slavic and Venetian domes, plus Gothic facades.


    ⬢


    Right | Rigolo’s efforts to make realistic streets are evident in the details,
    such as the street lamps, decorative trees and shrubs.


    “There was an island with two rivers on either side, so that implied bridges.”
    Bridges that needed to lead somewhere, so they built more streets. Streets that
    looked empty and unrealistic without buildings, so they built more of those. Buildings
    that needed neighboring buildings to connect to and…well, you get the idea. Suddenly
    it’s not hard to see where twelve to eighteen months disappeared to. When asked
    if there’s any particular part of the world they drew architectural inspiration
    from, Rigolo answers, “Prague, Vienna, Paris, London, Brussels, Spain, Italy.”
    Perhaps it would have been easier to ask which cities didn’t inspire Rigolo. That
    all-of-Europe-and-the-kitchen-sink approach is evident in the variety the city
    boasts. You can enjoy clock towers worthy of Elizabeth Tower (commonly known as
    Big Ben) on one street, lush green gardens on another, and a fleet of sinister-looking
    tanks on the next. With so many varied influences and so much going on, how did
    they keep the city looking coherent?


    “When you start looking at it, it’s not that coherent!” admits Rigolo, explaining
    that the skeletons he built on the cliffs were an attempt to partially disguise
    that. “It was intended to be the remains of some ancient civilization that would
    have existed in this location before the city was even built. This was a period
    when people built all kinds of buildings with different styles. Especially as
    Europeans, we are used to seeing this kind of mix-up in the fabric of our cities.
    That’s what defines a city. You don’t find many cities with completely uniform
    architecture. It’s always layers of periods, history, taste, that have been accumulating.”


    ![](images/33.jpg)


    ⬢


    A selection of some of the detailed buildings that the brothers created to fill
    their city.


    It’s a good argument for throwing in any building you can think of, but this process
    naturally lacks a clear finish line. How did they stay motivated? “You want to
    prove your worth and do better than others,” says the wonderfully honest Rigolo.
    “You like what you’ve been doing so you feel motivated to expand it even more.”
    While they were still working on it, they also shared the city on `Planet Minecraft`
    – one of the most popular community websites. The city was a huge hit, with the
    positive feedback leaving Rigolo and his brother “wanting to be even more successful.”
    Cue another few dozen palaces…


    Rigolo and his brother built “about ninety percent” of the city as it is now,
    but when they opened it up to other players, they soon had other Minecraft architects
    volunteering to add builds of their own. “They showed us pictures of things they
    had done and we thought, ‘Well, maybe. ” You’ll see a few of those builds, such
    as a Gothic cathedral, in the final city. “But there’s a lot of things that were
    built by others that we deleted because we didn’t find them.”


    ![](images/MMB_ImperialCity_fullbleed_8.jpg)


    ⬢


    A colorful market square that was inspired by German town architecture.


    ![](images/MMB_ImperialCity_isometric_1.jpg)


    ### Sightseeing


    Adding to their list of historical European references – French, Italian, Russian,
    Spanish – Rigolo and Comeon were also inspired by British designs. “We took a
    lot of things from Victorian architecture. Factories that are very much inspired
    by nineteenth-century factories you can find in big cities.”


    ![](images/36.jpg)


    ⬢


    As well as intricate building designs, Rigolo and Comeon also focused on other
    elements that make up a city, such as the vegetation, vehicles, harbors, landscapes,
    and the view from within the city.


    That may seem a little harsh, but these were the increasingly high standards Rigolo
    set for all of the city, especially as his own building skills improved. “There’s
    a lot of buildings we came back to, to make them much more ornate than they were
    at the beginning. When you get started with building, you tend to make your facades
    very flat. There’s not a lot of detail. We learned that you could add a lot of
    elements that would make it look more beautiful, more realistic, and more lively.
    So there are several buildings that were almost entirely redecorated.” Those redesigned
    buildings were the lucky ones, as at least they got to stay. “I started several
    buildings that I didn’t like. I erased them entirely.”


    Rigolo found it frustrating to spend tens of hours working on something only to
    throw it away (though he’s quick to remind himself “it’s just a game”). But having
    such a high bar has left him with a huge Minecraft city, acclaimed by the community.
    Surely he’s happy with that? Well, when asked if he would change anything if he
    started the city today, he says “I would probably eliminate half of the buildings.

