    enough, and you’ll start to get an insight into the kind of mind determined enough
    to create a city of this scale in the first place.


    Most builders, understandably, start small and work their way up. There’s plenty
    of that here, of course, with smaller buildings helping the larger skyscrapers
    feel like part of a living, breathing city. But the Sayama Production Committee
    are clearly not builders who are capable of settling for less. “It’s important
    to observe what you want to make and make it,” they say. You might need eight
    years free to realize your vision, but when the results raise the bar this high
    for what a Minecraft city can be, what’s eight years?


    ![](images/115.jpg)


    ⬢


    Top Left | This must be the cleanest river a large city has ever contained. The
    royal blue water snakes through Sayama City, providing a little glimpse of nature
    in a sprawling urban jungle.


    ⬢


    Top Right and Bottom | Helipads and mecha statues. Can you imagine anything more
    synonymous with a modern cityscape?


    Chapter Thirteen


    Rich Medieval Town


    By Minecrafttalsi


    ![](images/MMB_fortified_town_fullbleed_2b.jpg)


    Texture pack


    ◾ Conquest Reforged by Conquest


    ![](images/Windmill.jpg)


    At this point, there have probably been more medieval towns built in Minecraft
    than there were in actual medieval times. It’s a great fit, as there’s always
    been a strong medieval fantasy aesthetic to Minecraft’s world, with its wood-and-stone
    structures, slightly primitive tools, and terrifying dragon lurking in the darkness.
    No wonder so many builders have taken that theme and run with it. Builders like
    Minecrafttalsi, designer of this Rich Medieval Town, who likes to focus on creating
    small slices of medieval life, each one part of a larger fantasy world he’s been
    working on for years. “I guess the medieval fantasy setting just fascinates me
    and what could be more iconic for a medieval fantasy map than a town and a castle?”


    Minecrafttalsi discovered Minecraft early in 2011, when the game was still in
    beta. “I was browsing YouTube and found a video about a new game. I started playing
    the Beta 1.6 version in Survival mode, the only available mode at the time, and
    had an absolute blast.” But Minecrafttalsi was always more interested in the building
    parts of Minecraft. Once Creative mode was added, he never looked back. “Fast
    forward ten years later, and I’ve worked on quite a few different maps and invested
    countless hours into the game. It’s still a great way to channel my creativity.
    I probably won’t quit for quite some time!”


    Minecrafttalsi’s got quite a build portfolio after over a decade with Minecraft,
    including creations as varied as a Mediterranean cemetery and a blue whale skeleton.
    Rather less morbidly, he’s crafted many medieval builds, including estates, a
    monastery, and even a design for a horse and carriage. “Since the very beginning
    I always had the goal to create some sort of RPG world for other people to download
    and explore,” he explains. The aim isn’t just to build something easy on the eye
    – he wants to create a Minecraft fantasy world you can get lost in.


    Not that he’s at any risk of that, as he meticulously maps out his creations before
    starting to build properly. “I always plan out the very rough essentials first,”
    he says of his thorough process.


    ![](images/121.jpg)


    ⬢


    Top and Bottom Left | Timber-fronted houses establish the time period of the town.


    ⬢


    Bottom Right | An aerial perspective shows market stalls tucked behind the church.


    ![](images/122a.jpg)![](images/122b.jpg)


    ⬢


    Minecrafttalsi found interesting details that could be added to his town, such
    as fountains and wooden market stalls.'
