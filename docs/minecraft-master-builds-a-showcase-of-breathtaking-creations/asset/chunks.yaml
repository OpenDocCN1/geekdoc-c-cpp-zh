  trans: "\n\n建造团队希望进入这个世界的第一眼是强大且鼓舞人心的。这成为了 Kristin Bässe 在整个建筑作品中最喜爱的元素。\n\n“我其实真的很喜欢开头的那个拳头和笔的雕像，因为这是你第一次进入岛屿时看到的景象。”\n\
    \n![](img/Uncensored_library_cutout_7.jpg)\n\n展中展示了一些精巧的透视技巧。其中一个房间看起来充满了随机的悬浮方块。然而，从某个角度看，它们实际上拼出了“TRUTH（真相）”这个词。“那个想法是，在我们所考虑的这些国家中，很多时候你必须非常努力才能通过这些国家控制的媒体、反真理和假新闻找到真相，”詹姆斯说道。它还奖励了阅读图书馆内容的玩家——你必须站在书籍旁边才能看到隐藏信息。“这是另一种吸引玩家前往该位置的方法。”\n\
    \n无国界记者组织（Reporters Without Borders）对图书馆的反响非常满意，并对来自学校和大学的请求感到惊喜地。。“他们想将图书馆用于他们的讲座、演示或论文，”克里斯汀告诉我们，“玩家的反馈非常积极，甚至父母也是如此！我们收到了很多推文，父母们写道：‘我不知道游戏也可以这么有价值！’我认为参与这次活动的记者们对于他们能够触及与他们平时不同的目标受众感到很高兴。他们的文本正以我们所选择的这种创造性方式克服了审查，再次呈现在世上。”\n\
    \n克里斯汀个人最喜欢的图书馆部分是它介绍自己的方式。“我其实真的很喜欢开头的那个拳头和笔的雕像，因为这是你第一次进入岛屿时看到的景象。我认为它真的表达了我们想要展示的内容。但随后图书馆慢慢建立起来，因为通常它需要渲染一会儿，所以有那种‘噢，它在哪儿呢？’的时刻真的很棒。”随后，方块一个接一个地，一个自由信息的避难所开启了。这是一个直到今天仍在更新的极佳资源。\n\
    \n![](img/Uncensored_library_fullbleed_17.jpg)\n\n# 第十六章\n\n## 诺瓦莱斯城 (Nova Celes\
    \ City)\n\n### 由 Quantics Build 构建\n\n![](img/MMB_NovaCeles_fullbleed_9.jpg)![](img/MMB_NovaCeles_cutout_8.jpg)\n\
    \n一年可以发生很多事情。例如，你可以老一岁。或者，举一个稍微更有野心的例子，你可以在 `Minecraft` 中建造一个规模宏大的未来主义城市，它有八个不同的区域、可进入的内部空间，并且沉浸在细节中以营造尽可能的氛围。听起来一年内完成太难了？好吧，这正是法国建筑师\
    \ Ariux 和他的 Quantics Build 团队用 Nova Celes 实现的。为了满足一个严格的截止日期，他们对这个极具细节的未来愿景进行了不懈的努力。而那个截止日期距离未来还远远不够。\n\
    \n“我们在最后一天完成了地图，”Ariux 说道。时间掐得非常紧是一回事，而在必须提交的当天完成建筑是另一回事。但那个截止日期是无法推迟的。Nova Celes\
    \ 是为 City of Swagg 制作的，那是 YouTube Aypierre 举办的一项活动。它不仅仅是一个看起来壮丽的建筑——它必须像真实的城市一样运作，让\
    \ `Minecraft` 者能够与之互动，这意味着城市的许多内部空间也必须建造。“这非常、非常有压力，因为邀请了一百个 YouTube。所以你不能推迟期限。”\n\
    \n那些 YouTube 确实有很多可以探索的内容。Nova Celes 由一个中心城市和周围的八个不同区域组成。这些包括一个唐人街区、一个对复古游戏深怀敬意的区域，甚至还有一个“生物危害（Biohazard）”区域。最初的要求是“只是一个大、大城市，我们想要设定在未来的风格，因为这是我们最喜欢的建筑风格之一。”\n\
    \n建造团队花了六个月来规划 Nova Celes。在他们分配给建造城市的总时间的一半，仅用于准备建造它。并不是说这个规划阶段没有涉及任何方块——只是许多彩色的占位符。六个月后，“整个团队被动员起来建造所有的建筑并完成内部装饰。”\n\
    \n“这非常、非常有压力，因为邀请了一百个 YouTube。所以你不能推迟期限。”\n\n![](img/148a.jpg)\n\n⬢\n\nNova Celes\
    \ 的中心由一座高耸的白色结构、大量的绿地和顶部带有树的乌托邦风格公寓楼组成。\n\n![](img/148b.jpg)\n\n⬢\n\n左侧 | 每个区域都由一个巨大的雕像守护，这位战士俯瞰着唐人街区。\n\
    \n⬢\n\n右侧 | 在城市的围墙内，Quantics Build 放置了船，你可以想象公民如何在不同区域之间穿行。\n\n![](img/MMB_NovaCeles_fullbleed_7.jpg)\n\
    \n## 极佳 (Tree-mendous)\n\n知道何时授权是领导建造团队最重要的部分之一。Ariux 是一位才华横溢的建筑师，但他什么时候最好参与放置方块，以及什么时候最好退到后后让团队处理施工。幸运的是，当你与专家合作时，授权会变得容易得多。“我们有四位负责有机形状的建筑师。他们是法国著名的有机大师。”他们还有两名成员负责地形改造，Ariux\
    \ 为城市中许多树的建筑师表示特别赞意。“我们有一位树木大师，非常有名，他是造树的专家。我们说‘我们需要一棵这样的树’，他就能做出来，而且非常完美。”这些植被的作者是法国建筑师\
    \ `Cobra63`，他在 Twitter 简介中写道：“当我无聊时造树，所以……一直如此。”\n\n![](img/152a.jpg)\n\n⬢\n\n\
    Quantics Build 在水生区域的底部填充了水，并在建筑顶部放置了巨大的贝壳。\n\n![](img/152b.jpg)\n\n⬢\n\n巨树建筑的底部展示了\
    \ Quantics Build 如何为他们宏伟的塔创造出这样的有机形状。没有压力。等等，全是压力。在距离截止日期只有六个月的情况下，Quantics Build\
    \ 刻苦工作。即使是建筑中心——所有其他区域环绕的城市核心——也在短短两周内完成了。“这是一个巨大的挑战。我们有十五个人，我们必须完成中心部分，那里有那座巨大的白色建筑和大量的植被。这非常复杂。”\n\
    \n Ariux 能相信他竟然能在短短十四内搞定 Nova Celes 的中心吗？“实际上，我不知道我们是如何做到的！那是一个巨大的挑战。我认为最复杂的部分是制作氛围。”\n\
    \n这种热情渗透到了他们的建筑中——没有人看一眼 Nova Celes 会认为这不是不热爱 `Minecraft` 的人所做的——但有时限制团队的热情是 Ariux\
    \ 角色中一个必要的害恶之一。“我最喜欢的区域是唐人街区。它是我们的第一个区域。我们很笨，因为在上面花了很多时间。我们制作了切切。那里非常密集。有很多建筑。有很多氛围，很多餐厅……它非常、非常、巨大！”\n\
    \n"
- fmt: '

    It may be his favorite quarter, but Ariux knew this approach wasn’t sustainable.
    “We spent two months on this quarter, and I was like ‘guys, we can’t have this
    level of detail.’ So for some quarters, we only had two weeks to build them. Sometimes
    it was hard for some quarters because we were only three or four builders. The
    aquatic one, I built with only two builders in two weeks.” Quantics Build is made
    up of about fifteen to twenty builders, a number that fluctuates. “We didn’t sleep
    a lot!”


    ![](images/MMB_NovaCeles_fullbleed_1.jpg)


    ## Woolly World


    When you’re building a giant city to a tight deadline, the last thing you want
    to be doing is knocking down your hard work and starting again. Quantics Build
    sank a lot of time into planning to avoid this, but they still couldn’t help making
    constant revisions. “For some quarters, there aren’t a lot of buildings, because
    buildings take very long to build – two days for one person – because of all the
    revisions and them having to do the interior as well.” One novel method they used
    was initially making a much softer city, building a large amount of it out of
    wool blocks. “We work in wool in order to have a general idea of the volumetry
    of the buildings. But above all, to have an idea of the density of the city. All
    of this helps us later to put together the city, see where we can put a park,
    a restaurant, a metro, etc…” Revisions are inevitable when you’re working with
    a team of perfectionists, but consider using colorful wool as placeholder blocks
    when you want to see the shape of your city before you commit to its finer details!


    ![](images/158.jpg)


    - **Top Left** | Quantics Build used a lot of red blocks in their Chinatown quarter.
    Traditionally, the color red symbolizes luck and happiness in Chinese culture.

    - **Bottom Left** | The team decorated the industrial quarter with smoke-topped
    chimneys, reminiscent of nineteenth-century factories.

    - **Right** | The center of the build was the last quarter and featured structures
    with more greenery – note the two buildings with plants growing out of the walls
    and roof. Plus a Chinese archway – known as a `paifang` or a `pailou`.


    Twenty-three-year-old Ariux founded Quantics Build in 2019, six years after he
    first started playing Minecraft. “At the beginning I considered us just a group
    of friends who played Minecraft for art.” But as they took on more and more ambitious
    projects, they realized they were steadily becoming a professional Minecraft build
    team. Ariux was also studying to be an architect, fitting for such an accomplished
    virtual builder. Unfortunately, he was doing this while working on Nova Celes.
    “Recently I finished architecture school. Architecture school is very, very hard.
    There’s a lot of work, and it was a nightmare for me to build this and do my studies.”


    Although both involve building, Ariux finds there are huge differences between
    his architectural studies and his Minecraft work. It’s the unrestrained potential
    of the game that appealed to Ariux so much in the first place. “The problem with
    architecture is you have a lot of constraints. You can’t do what you want. It’s
    very rude! And in Minecraft you have the possibility to make everything.” Ariux
    also likes the multiplayer aspect, enjoying working on a build team “because it’s
    a melting pot of ideas. That’s what I like about Minecraft, because you can do
    what you want with friends and the objective is to make the most impressive things.”


    “The problem with architecture is you have a lot of constraints. You can’t do
    what you want. It’s very rude!”


    ![](images/MMB_ImperialCity_fullbleed_7_1.jpg)


    ## Acknowledgments


    ### From the Author


    First off, a massive thanks to every builder who spoke to me for this book. Your
    passion for Minecraft and the amazing things you’ve achieved with it were an absolute
    delight to discuss. Soon as I win the lottery, I look forward to deciding which
    one of you I’m going to beg to design me a house in real life. Thanks to Alex
    Wiltshire, who gave great advice and tracked down the majority of the builders
    in this book. Seriously, Alex, do you know everyone who’s built something amazing
    in Minecraft? I barely know enough people to fill out an acknowledgments page…


    Thanks to Ellie Stores, who edited my words into coherency, answered all my dumb
    questions without judgment (at least I hope so?), and cut some truly awful puns
    that would have you demanding I never be let near a pen again. Thanks to the designer
    Andy Leung and the 3D illustrator Billy Budgen, for making every page of this
    book look so absurdly pretty. Thanks to Jen Simpkins for being a brilliant friend.
    One who once told me there was some game called “Minecraft” that I should consider
    playing and writing about. I’ll begrudgingly concede that turned out to be good
    career advice. Endless thanks to Adele Major, the amazing producer who collaborates
    with me on almost all my Minecraft projects, with the exception of this book (but
    she’s still getting thanked in it anyway – she’s that good). Finally, I’d like
    to thank my housemate’s dog for only trying – and failing – to ruin one of my
    builder interviews with his incessant barking. Nice try, Odin. Better luck next
    book!


    ### From the Publisher


    Expanse would like to thank all the builders who constructed such impressive structures,
    and then took the time to talk to us about it afterward. In particular, thanks
    to Iskillia, SadicalMC, Thomas Sulikowski and Varuna Builds, Rigolo and Comeon,
    natsu3012, Rajkkor, Zeemo, qwryzu, Junghan Kim, Maggie Gondo Wardoyo, Arkha Satya
    Taruna, Sander Poelmans, Sayama Production Committee, Minecrafttalsi, Jossieboy,
    Blockworks, and Quantics Build. Thanks, also, to Kristin Bässe, LNeoX, LordKingCrown,
    and Craig Jelley.


    A special thank you to all the people at Mojang for the guidance in bringing this
    book to reality. To Alex Wiltshire and Sherin Kwan, and to Cookiie and Yutaka
    Noma. Thank you to Mikael Hedberg for your insightful words.


    ![](images/159.jpg)


    ![Penguin Random House publisher logo.](images/next_reads_logo.jpg)


