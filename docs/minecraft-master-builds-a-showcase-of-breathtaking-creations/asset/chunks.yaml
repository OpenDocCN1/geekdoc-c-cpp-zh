- fmt: "\nThe builders are most proud of the fact that they have stuck to that original\
    \ concept. But as the years went by have they never been tempted to settle for\
    \ reduced ambitions? “We’ve tried to make it bigger, but never tried to make it\
    \ smaller,” they say, giving short shrift to any suggestion of scaling down the\
    \ team’s ideas. This is clearly a group of builders that believe bigger is better.\
    \ What could so easily have just been an impressive collection of skyscrapers\
    \ actually has a nice sense of variety and clearly distinct districts. Larger\
    \ landmarks like the Ferris wheel wouldn’t be nearly as impressive or striking\
    \ if they weren’t against a backdrop of less extravagant buildings, carefully\
    \ constructed by players determined to get all the little details right, no matter\
    \ how mundane or seemingly insignificant.\n\n![](images/118.jpg)\n\n## Landmarks\n\
    \nFor an anonymous city, Sayama is packed full of incredibly dramatic landmark\
    \ structures. The Sayama Production Committee took inspiration from real-world\
    \ buildings, for instance, Kyoto Tower. The team also created their own take on\
    \ a skyline stand-out, such as this bold red and white Ferris wheel placed on\
    \ top of an average apartment block in a residential area, like all normal fairground\
    \ rides.\n\n![](images/111a.jpg)\n\n01 As well as roads, Sayama Production Committee\
    \ has thought out high-speed public transport. The main train station sits just\
    \ behind the sports center, with tracks that branch throughout the city.\n\n02\
    \ This sports center includes a track and field arena fancy enough for the most\
    \ elite of schools. They’ve even included floodlights.\n\n03 The soccer pitch\
    \ looks so lifelike, that’s because the team made sure to use accurate scale.\n\
    \n04 An urban build this big could become awash with gray, but the team was careful\
    \ to add some man-made greenery. A very realistic touch for the neighborhood.\n\
    \n05 The attention to detail within the build is stunning. Note the road markings,\
    \ diligently laid down.\n\n![](images/111b.jpg)![](images/114.jpg)\n\n⬢\nTop |\
    \ As cities grow, so does their population. The team has created several different\
    \ residential districts filled with cute family houses. \n\n⬢\nBottom | Sayama\
    \ Production Committee even imagined a kooky neighbor for their suburb. That one\
    \ house whose design style stands out against the rest.\n\nThat variety can likely\
    \ be credited to having so many people working together on Sayama City, though\
    \ there is a hierarchy when it comes to planning out the build. “Myself and other\
    \ key members put together the plans,” explains their representative. “There are\
    \ over fifty people on the team and we communicate via Discord.” The team works\
    \ through a mixture of voice chat and messages, and with very few in-person meetings,\
    \ since participants come from various regions across Japan. It’s something that’s\
    \ come up again and again when speaking to different build teams: communication\
    \ is the key to a successful collaboration. Make sure you’re constantly keeping\
    \ each other updated and you’ll see better results.\n\nThe team’s plan can generally\
    \ be summed up as “to express the complexity of a Japanese city, and to deform\
    \ it to a size that can be created in Minecraft.” Can you find an element of city\
    \ life that they haven’t managed to squeeze down into this build? Electronic billboards,\
    \ parking spaces, office blocks, skyscrapers seemingly in every building style\
    \ you’ll find in Japan. That barely scratches the surface, and yet the builders\
    \ still wish the city was even wider in scope. Were they starting this build today\
    \ (please don’t encourage them to scrap eight years of work) they think it would\
    \ be based on “cities from all over the world, not just Japan.” Imagine looking\
    \ upon this build and deeming it not ambitious enough, and you’ll start to get\
    \ an insight into the kind of mind determined enough to create a city of this\
    \ scale in the first place.\n\nMost builders, understandably, start small and\
    \ work their way up. There’s plenty of that here, of course, with smaller buildings\
    \ helping the larger skyscrapers feel like part of a living, breathing city. But\
    \ the Sayama Production Committee are clearly not builders who are capable of\
    \ settling for less. “It’s important to observe what you want to make and make\
    \ it,” they say. You might need eight years free to realize your vision, but when\
    \ the results raise the bar this high for what a Minecraft city can be, what’s\
    \ eight years?\n\n![](images/115.jpg)\n\n⬢\nTop Left | This must be the cleanest\
    \ river a large city has ever contained. The royal blue water snakes through Sayama\
    \ City, providing a little glimpse of nature in a sprawling urban jungle. \n\n\
    ⬢\nTop Right and Bottom | Helipads and mecha statues. Can you imagine anything\
    \ more synonymous with a modern cityscape?\n\n# Chapter Thirteen\n\n## Rich Medieval\
    \ Town\n\nBy Minecrafttalsi\n\n![](images/MMB_fortified_town_fullbleed_2b.jpg)\n\
    \n### Texture pack\n\n◾ Conquest Reforged by Conquest\n\n![](images/Windmill.jpg)\n\
    \nAt this point, there have probably been more medieval towns built in Minecraft\
    \ than there were in actual medieval times. It’s a great fit, as there’s always\
    \ been a strong medieval fantasy aesthetic to Minecraft’s world, with its wood-and-stone\
    \ structures, slightly primitive tools, and terrifying dragon lurking in the darkness.\
    \ No wonder so many builders have taken that theme and run with it. Builders like\
    \ Minecrafttalsi, designer of this Rich Medieval Town, who likes to focus on creating\
    \ small slices of medieval life, each one part of a larger fantasy world he’s\
    \ been working on for years. “I guess the medieval fantasy setting just fascinates\
    \ me and what could be more iconic for a medieval fantasy map than a town and\
    \ a castle?”\n\nMinecrafttalsi discovered Minecraft early in 2011, when the game\
    \ was still in beta. “I was browsing YouTube and found a video about a new game.\
    \ I started playing the Beta 1.6 version in Survival mode, the only available\
    \ mode at the time, and had an absolute blast.” But Minecrafttalsi was always\
    \ more interested in the building parts of Minecraft. Once Creative mode was added,\
    \ he never looked back. “Fast forward ten years later, and I’ve worked on quite\
    \ a few maps and invested countless hours into the game. It’s still a great way\
    \ to channel my creativity. I probably won’t quit for quite some time!”\n\nMinecrafttalsi’s\
    \ got quite a build portfolio after over a decade with Minecraft, including creations\
    \ as varied as a Mediterranean cemetery and a blue whale skeleton. Rather less\
    \ morbidly, he’s crafted many medieval builds, including estates, a monastery,\
    \ and even a design for a horse and carriage. “Since the very beginning I always\
    \ had the goal to create some sort of RPG world for other people to download and\
    \ explore,” he explains. The aim isn’t just to build something easy on the eye\
    \ – he wants to create a Minecraft fantasy world you can get lost.\n\nNot that\
    \ he’s at any risk of that, as he meticulously maps out his creations before starting\
    \ to build properly. “I always plan out the very rough essentials first,” he says\
    \ of his thorough process.\n\n![](images/121.jpg)\n\n⬢\nTop and Bottom Left |\
    \ Timber-fronted houses establish the time period of the town. \n\n⬢\nBottom Right\
    \ | An aerial perspective shows market stalls tucked behind the church.\n\n![](images/122a.jpg)![](images/122b.jpg)\n\
    \n⬢\nMinecrafttalsi found interesting details that could be added to his town,\
    \ such as fountains and wooden market stalls.\n"
