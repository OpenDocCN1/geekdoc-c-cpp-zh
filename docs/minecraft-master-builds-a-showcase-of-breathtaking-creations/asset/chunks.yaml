    这座宏伟寺庙上的圆顶屋顶是拜占庭建筑的核心特征之一。


    Sander 选择用四种关键颜色来建造他的作品，以产生强烈的对比。“对于建筑的地基，我使用了白色混凝土。使用非常素的颜色作为底色，可以让你更容易在细节处添加颜色！对于屋顶，我使用了红色砂岩和棱砂岩砖。我非常喜欢这些颜色组合在一起的效果。”但
    Sander 觉得建筑中似乎缺少了什么。“这就是为什么我在后面制作了巨大的粉色树木。我混合了白色混凝土和白木木头，叶子是由游戏游戏中所有的粉色区块制成的。”幸运的是，Mojang
    Studios 包含了足够多不同种类的粉色区块——如混凝土、玻璃和羊毛——帮助这些叶子脱颖而出。


    在 Sander 开始将建筑拟人化之前，他在大约十年前首次接触了 `Minecraft: Pocket Edition`。“我和一个朋友在刷屏幕时偶然发现了它。”这种心不在焉的浏览导致了他在
    `Pocket Edition` 中八年的点点时光，直到 Sander 的野心超越了这个版本的 `Minecraft`。“大约两年前，我切换到了 `Java
    Edition`，因为我想做更多大规模的建造。`Java` 支持的工具和模组在这方面是优越的！”


    ![](img/MMB_TempleOfFortitude_fullbleed_2.jpg)


    ⬢


    一个被水环绕的独特结构——寺庙看起来像是从海洋中浮现出来的。


    ![](img/MMB_TempleOfFortitude_cutout_5.jpg)


    ⬢


    巨大的粉色树是 Sander Poelmans 在坚毅神庙中最喜欢的部分之一。


    他离开 `Pocket Edition` 转向 `Java` 是因为他想建造更大的建筑，这完全适用于坚毅神庙。这座同名的寺庙规模巨大，但 Sander 成功地通过使用
    `WorldEdit`（一个流行的 `Minecraft` 插件）加速了进程。即使是像那些盛开树木这样的“背景细节”，本身也是大规模建筑。“很难说哪部分最让我满意，但如果非要选一个的话，那就是那些巨大的粉色树。我在它们上花了至少整整两天时间。我真的很喜欢它们看起来。”Sander
    感到自豪是正确的——在一个由立方体组成的创作游戏中，处理曲线是出了名的难题，而那些花朵看起来自然地从树枝流出的样子也绝非易事。


    如果 Sander 再次回到坚毅神庙，他将通过添加更多区块来扩大建筑的地基。“这样在大片平坦的白色区域看起来会更有趣一些。我可能会尝试包含一些酷炫的新区块，比如方灰岩、白色混凝土粉和骨块！并添加一些小拱门、凹槽和图案！”


    但这些是他认为建造者不应该纠结的观点。“我能给出的建造如此大型建筑的建议是不要卡在小细节上。这种规模的建筑最重要的部分是形状和你所用区块的选择，因为这些是你最容易注意到的。在尝试你想添加什么类型的窗户之前，最好花大量时间把形状做对。”Sander
    确保搞定了核心部分，然后用丰富的细节装饰结构，并通过给他的寺庙起一个戏剧性的标题来庆祝完成。


    # 第十二章


    ## 浅山市


    由 浅山制作委员会出品


    ![](img/MMB_Sayama_fullbleed_5.jpg)![](img/MMB_Sayama_cutout_6.jpg)


    你在 `Minecraft` 建造上花费的最长时间是多久？一周？一个月？还是在因为苦力哥炸了而愤怒退出前的二十分钟？所有这些令人印象深刻的时间投入在浅山市高耸入云的摩天大楼面前都显得白无力，这个项目在本书出版时，由建造团队
    `浅山制作委员会` 已经建造了八年。八年，而且还在增加！但当这个想法如此雄心勃勃时——基于日本各地的真实城市来打造一整座城市——你突然就能看出九多个月的建造花在了哪里了。


    “我在网上看到了一个 `Minecraft` 视频并留下了深刻印象。我觉得这是一个很棒的游戏，并决定玩玩，”他们的建造团队代表兼创始人说道，他选择保持匿名。这是
    2012 年的事，在 `Minecraft` 的早期，`浅山市` 项目在一年后开始。最初的概念是“建造一座日本城市”，他们并没有直接复制某一个，而是借鉴了来自日本各地的影响。尽管日本有几个真实的地方被称为“浅山”，但这个建筑并非基于真实地点——它是一个有很多现实世界影响的虚构城市。


    最初，这座城市只是一个建造者的作品。但如果一直保持那样，它永远无法达到今天的高度和规模。“我们意识到我们需要许多人的合作来创建一个大型地图，所以我们在[首次]发布该项目时，寻找了当时可以帮助我们的人，那时团队组建了。”这是一个组建建造团队的聪明方法：向社区展示你在做什么，然后招募对此产生回应的建造者。


    `浅山制作委员会` 成立了，这是一支“想要制作以前没有人过的东西”的团队。这个团队恰恰实现了这一点。在 2012 年，社区在 `Minecraft` 中建造的大型城市稍少见，但它们是今天许多建造者的热门选择，全球大部分已以立方体的形式描绘。然而，`浅山市`在细节和纯粹规模上仍然超过了大多数此类项目。它是那种你必须放大才能反复检查自己是否还在看
    `Minecraft` 的建筑。


    “我们意识到我们需要许多人的合作来创建一个大型地图。”


    ![](img/107a.jpg)


    ⬢


    `浅山制作委员会` 致力于建造一个真实的城市。现实中的城市规划师考虑的微小日常细节，例如停车场、高公路桥和为平民准备的居住区。


    ![](img/107b.jpg)


    ⬢


    这座迷人的蓝色摩天大楼高耸屹于其他天际线之上，无疑是一个建筑师的热爱项目。汲取了不同的文化和建筑风格，包括传统的日本寺庙。


    ![](img/MMB_Sayama_fullbleed_20.jpg)![](img/MMB_Sayama_fullbleed_21.jpg)


    ⬢


    描述 `浅山制作委员会` 风格最好的词是写实。他们制作了真实的城市生活细节，如行人横道和生长在路灯旁的小植物。


    ![](img/110.jpg)


    ⬢


    浅山市居民的购物习惯在这里得到了很好的照顾。无论他们是想在美食大广场吃午饭、购买最后时刻的礼物还是挑选一整套新衣服，都有商店满足各种选择。


    当你进行这种规模的建造时，显然无法负担起挑剔。“我们使用所有的区块……每个区块都有它自己的用途。”这很容易变成一个色彩斑斓、视觉色调过于混乱的灾难。相反，这支团队展现了令人令人克制，同时也利用了游戏提供的所有工具。

