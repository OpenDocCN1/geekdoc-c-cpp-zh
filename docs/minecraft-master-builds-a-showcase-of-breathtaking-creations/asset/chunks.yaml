    I don’t find them up to par with the rest in terms of detailing, balance, and
    aesthetics. I would probably put in more houses and less big monuments. It’s more
    motivating to build a palace than a house when you want to do something impressive.
    But that’s actually something completely unrealistic in the city, that there are
    very few houses, streets, or shops.” Whereas most would look upon this city and
    be blown away by its epic scope, Rigolo is more concerned with where you’re supposed
    to buy your milk.


    How did Rigolo decide when it was time to declare the city finished and stop building?
    “I couldn’t tell you! We didn’t decide to stop. And, actually, it remained unfinished.
    At some point we moved on to other things. I guess everyone likes to have a little
    pet project like this.” After about eighteen months, Rigolo stopped playing `Minecraft`
    and deemed the city unfinished. But no city is ever really finished, even in the
    real world, and what he leaves behind is a testament to the scale and skill that
    two brothers, tired of running out of Lego bricks, can achieve.


    # Chapter Five


    ## Earthsky

    By `natsu3012`


    ![](images/MMB_Earthsky_fullbleed_21.jpg)![](images/MMB_Earthsky_cutout_3.jpg)


    Anyone who’s had the dubious pleasure of living in a densely populated city will
    see Earthsky as a home away from home, because it so successfully captures the
    chaos of an urban jungle. Yet this chaos suits the tastes of the builder perfectly.
    Ambroise Guenole, a French architecture student who crafts under the name `natsu3012`,
    can’t get enough of packing in more details, structures, blocks, ambitions, hopes,
    dreams, and probably another fifty things since you started reading this.


    In their studies, `natsu3012` likes to predict what cities will look like in the
    future. “For a utopian vision that would be beneficial for all, we imagine a natural
    city with a densified public transportation network, tall buildings, and rooftops
    that serve as public spaces. In my creative and aesthetic imagination, I would
    like the cities of tomorrow to look like my work, even if it would be unlivable
    in reality. It’s a rather selfish dream after all. Depending on the path humanity
    takes, two scenarios are surely possible: a city of technology or a gigantic slum.”


    This builder’s passion is so infectious that they might actually be able to sell
    you on the apocalypse. “I really like the atmosphere of an apocalyptic future.
    And `Minecraft` lends itself quite well to the realization of this kind of universe.”
    However, for this vision of the future, `natsu3012` planned something different.
    “I wanted to create a heap of buildings on top of a kind of floating base.” That
    explains the “sky” part of the build title. It’s a logical leap off the ground
    – when there’s no more room on Earth for buildings, people are going to inevitably
    start looking skyward for somewhere to put their real estate.


    “Depending on the path humanity takes, two scenarios are surely possible: a city
    of technology or a gigantic slum.”


    ![](images/MMB_Earthsky_isometric_1.jpg)


    ⬢ A floating metropolis packed full of skyscrapers – imagine the view from the
    top!


    ![](images/MMB_Earthsky_fullbleed_25.jpg)![](images/43.jpg)


    ## Sky Scraping


    `Natsu3012` spent about a month and a half constructing Earthsky, crediting the
    `Minecraft: Java Edition` plugin `WorldEdit` with helping save them a lot of time.
    As for the name of the city, they “had to display something on the main hologram”
    that gives the city a cold, blue slice of futuristic detail. “The name resulted
    from the intentions of the project. A city in the sky. A new land where people
    pile up and buildings rise to the sky.” People pile up? Maybe best just to focus
    on the “buildings rise to the sky” part!


    `Natsu3012` finds that their architecture studies help when planning such a lofty
    design. “I know how to conceive a project, develop it, and imagine the spaces
    at different scales.” Definitely a helpful skill to have when a significant part
    of your structure is sky-bound. They also have access to “a repertoire of [architectural]
    knowledge that I have fun translating into the ‘Minecraft language.’”


    They’re happy to give examples of architectural language when describing the beginnings
    of the city-building process. “I start by defining a ‘sample’ neighborhood, in
    which I develop my structural principles. Then I work on a more global scale with
    neutral volumes to compose the whole project.” Neutral volumes, for those of us
    who don’t speak architect, are “simple volumes like cubes. It is a basic form
    that I come to rework afterward. I come to rework each zone in detail, so they
    are in coherence with the sample district.” It’s a smart approach – crafting a
    small, detailed portion so you always have something to go back to when reminding
    yourself what kind of city you’re aesthetically aiming for.


    Another smart method is `natsu3012`’s creative use of color. “I don’t use the
    blocks in the way `Mojang` intended. I use them for their color or texture. For
    example, I don’t use dirt to make ground, I use it to make walls. I used a lot
    of different blocks. `TNT`, `lapis lazuli ore`…a block that I particularly like
    is mycelium, which I use very often.” This process makes a pleasingly colorful
    city. “The goal is to break down the elements of a building. To bring out its
    materiality, its structure, to play with its gradations, and to simulate the effects
    of time – for example, paint that’s steadily deteriorated – to reinforce the effects
    of light. Lighten the areas that are supposed to be light and darken the areas
    that are supposed to be.”


    ![](images/44.jpg)


    ⬢ Without the light from the sun, Earthsky is lit from within. `natsu3012` added
    different lights to enhance the city vibe.


    “To build on a large scale. I would advise first of all to have a solid foundation
    with very simple constructions. Understand that simplicity is not a defect, it
    allows a better reading.”


    `Natsu3012` also uses a popular building trick during the early stages of construction.
    They craft large structures out of colored wool blocks, then later replace them
    with the blocks they actually want. A smart way of getting “a better view on what
    you are going to do,” as using placeholder blocks means you can put together shapes
    for buildings or other structures. Which begs the question: Would you prefer to
    live in a house with walls made of wool or dirt?


    When it comes to building designs, `natsu3012` is interested in a wide variety
    of styles. “I enjoy making small constructions without great ambition. Small houses
    or other [projects] with multiple cultural inspirations while trying to improve
    my technique. Creating on a small scale is very rewarding. But Earthsky is quite
    representative of what I like to do most in this game – big, futuristic, and rather
    dystopian cities. It’s an atmosphere I like.”


    This colossal city isn’t even a third as ambitious as `natsu3012` would like it
    to be. “Today if I was doing a similar project, I think the number of buildings
    would be doubled or even tripled, with paths everywhere, to really give the impression
    of a pileup. My texturing skills have improved so I think it would have big improvements
    on that side.” Somebody change `natsu3012`’s Minecraft password before they try
    to quadruple this city in size!


    ![](images/47.jpg)


    ⬢ The front-on perspective provides additional detail of the paths in the top
    left.


    ![](images/48a.jpg)


    ⬢ `natsu3012` designed a giant digital billboard to sit atop their city.


    ![](images/48b.jpg)


    ⬢ Left to Right | Rooftop gardens are a popular feature in modern builds that
    help to break up this metropolis; `natsu3012` added colorful walls to their futuristic
    buildings.

