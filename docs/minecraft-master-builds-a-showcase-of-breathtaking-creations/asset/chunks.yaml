- fmt: '

    Destroying the actual moon might have been an easier project than putting this
    Moon Destruction build together. When asked what the hardest part to build was,
    the duo essentially said all of it. “Every part had different challenges and almost
    everything required the same level of attention,” says Maggie. Special attention,
    however, went to the spaceship that dominates the scene. “We made it with extra
    effort. It took a really long time because of its size. Plus, we needed to make
    sure the details went well with the ship’s shape and that the composition wouldn’t
    be too crowded with the moon and astronaut there.” So they had to juggle building
    a vast spaceship and keep in mind that it shouldn’t take away from the rest of
    the scene. It’s now all the more impressive that the astronaut doesn’t have their
    head in their hands in despair.


    One thing the endless black backdrop of space can hurt is your sense of scale.
    After all, the Death Star only looks threatening when you have a puny planet in
    the frame, which helps to showcase that deadly ship’s terrifying might. Maggie
    and Arkha achieve this both with the astronaut outside the ship (also giving a
    nice human touch to a build that could risk being too cold and clinical) and by
    going big on both the scale and the details. The spaceship is covered in unique
    patterns, tech, windows, a radar dish, and more, all in a coherent design. It’s
    a star-bound vessel with a great sense of sheer bulk.


    “It’s a very agile method. It changed all the time…and at the end I have something.
    Something that was absolutely out of control at the beginning!”


    “We looked at scenes in the movie `Interstellar` explains Maggie, of the research
    the duo did for their spaceship. “We looked for images of rockets and space stations
    to get a good grasp of the space environment.” As for building blocks, they looked
    for ones with a “blue-grayish hue” like cyan terracotta, stone, and light gray
    concrete, with yellow blocks for stripes and black blocks to mark the doors. That
    might seem like a small color palette for such a vast machine build, but it keeps
    their construction looking clean and muted, like the cutting-edge tech it’s meant
    to represent. Especially in contrast to the deliberately chaotic meteor impact
    that the ship is orbiting.


    ![](images/MMB_Moondestruction_fullbleed_4.jpg)


    ⬢


    The astronaut gives the scene a sense of scale.


    You can see this contrast best in the flames. The fire of the meteor’s impact
    are sharp angles of yellow and orange, striking against the black of space. Whereas
    the flames from the engines of the ship use blue and white fire with rounded edges,
    implying a controlled journey through space.


    “We look for blocks with a texture that’s as close as possible to the original
    material of the object we’re trying to recreate,” explains Maggie. “For the spacesuit,
    we used white wool, quartz – because our spacesuit reference was white. And we
    used stone as material for making the equipment details.” NASA might not sign
    off on a spacesuit made of stones, but it certainly looks the part here. Once
    again, a small selection of colors is a deliberate choice that helps the suit
    resemble the real thing. The dark visor hiding the astronaut’s face also gives
    the build a sense of mystery and means they don’t have to worry about a blocky
    recreation of a human head – always tricky to replicate in `Minecraft` – ruining
    the build’s realistic vibe.


    But where do you boldly go once you’ve checked off outer space? After discovering
    a passion for building through `Minecraft`, Maggie went on to study architecture.
    Having graduated, she now works for `Rewrite Media`, making content for `Minecraft:
    Education Edition`. “`Minecraft` made me the person I am today,” she says. Arkha
    has a similar story – he now leads `MIVUBI`, a team helping to develop the `Minecraft`
    community in Indonesia. “We managed to use `Minecraft` as a medium for presenting
    works of art, in collaboration with `Jogja Biennale`, an art foundation in Indonesia,”
    he says. Working in teams to expand the possibilities of what `Minecraft` can
    do. Seems that defying the height limit and exploring outer space was just the
    beginning of this innovative duo’s ambitions…


    ## BONUS BUILDS


    ### Sanctuary of the Gods & Creeperppunk


    ![](images/98.jpg)


    #### Sanctuary of the Gods


    Archanee and `AutomailED` created this scene as a celebration of Lunar New Year.
    It features the four Guardians of China: the Azure Dragon, the White Leopard,
    the Vermillion Bird, and the Black Tortoise. In Chinese mythology, these guardians
    each protect one direction of the world – north, south, east, and west – but Archanee
    and `AutomailED` have placed the guardians in different areas to give the impression
    that they are moving.


    ![](images/Rendered_by_AutomailED_Night_1_.jpg)


    #### Creeperpunk


    This cyber city was designed when Archanee and `AutomailED` tried to imagine the
    future of humanity. Just what you would expect: skyscrapers, giant holograms,
    teleport gate, and donut shops. Once the pair had set on the design they wanted,
    it took them four months to finish the build. They made smart use of lights within
    their city, because what is a futuristic metropolis without a lot of neon? It’s
    especially impressive when viewed at night, as the billboards and holograms give
    the city a dramatic vibe.


    ![](images/Rendered_by_AutomailED_Daytime_2_.jpg)


    ## Chapter Eleven


    ### Temple of Fortitude


    By Sander Poelmans


    ![](images/MMB_TempleOfFortitude_fullbleed_4.jpg)![](images/MMB_TempleOfFortitude_cutout_2.jpg)


    Fortitude, showing courage in adversity, is one of the most valuable traits you
    can have. So a build called Temple of Fortitude can’t help but intrigue. Could
    the name refer to the temple? It’s pretty brave to build in the middle of water,
    after all. Perhaps it’s a reference to its own builder, who showed great courage
    building something spectacular? “I came up with the name just because it sounded
    cool, to be honest,” explains Sander Poelmans, builder of the Fortitude. And he’s
    not wrong.


    Sander has an interesting planning stage for his builds – he doesn’t like to place
    a single block on a build of this size until he’s found some inspiration. “For
    the temple, I was heavily inspired by a great voxel artist called Mari K.” It
    was a somewhat unfortunate source of inspiration, because the specific Mari K
    piece Sander was struck by contained details like blue-domed roofs and thin rectangular
    windows. Domes are truly one of the hardest elements to recreate in `Minecraft`,
    a game with an aforementioned love of squares and only one type of default window.
    Sander had no choice but to give up on his dream build. Or would that be the backstory
    for?


    “After I find my inspiration, I start placing the largest shapes so I can get
    a feel for the general shape and composition of the build.”


    Sander’s actual approach was to take this building challenge head on, one step
    at a time. “After I find my inspiration, I start placing the largest shapes so
    I can get a feel for the general shape and composition of the build. Once I’m
    happy with the shape, I’ll start placing the roofs and towers. Lastly I start
    placing windows, trees, and other details and textures.” Sander makes these steps
    sound simple, but this was a thorough process, which included a few more outside
    influences. “I didn’t really research real-life temples for this, but I did make
    use of other references. This build uses a mix of real and made-up styles. The
    towers are loosely inspired by Byzantine architecture and the flatter roofs are
    inspired by Mediterranean buildings. But most of the build is just made by doing
    what feels right!”


    ![](images/MMB_TempleOfFortitude_fullbleed_1.jpg)![](images/99.jpg)


    ⬢


    The different levels of the temple fit together like a huge, stylish staircase.


    ![](images/MMB_TempleOfFortitude_fullbleed_11.jpg)


    ⬢

