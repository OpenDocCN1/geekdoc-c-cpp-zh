  trans: '

    尽管他有制作鸭子的经验，但回到参考资料总是很有用的，因此在这次制作中，SadicalMC 在网上研究了鸭子。“我确实查了橡皮鸭的参考图，只是为了大概了解头部通常有多大。与真实的鸭子相比，橡皮鸭的头部大得多。”这非常方便，因为这为他在鸭子头上添加华丽的高大礼帽和更多的城堡尖塔留出了空间。他的鸭子看起来比你通常在浴缸里看到的要蓬松得多——这是一个刻意的选择，旨在为一个非常奇幻的作品增添一些令人惊讶的真实细节。“我也看了真鸭子的照片。我喜欢让我的作品既真实，又带有许多幻想和神话元素。我喜欢将色彩、植物、现实主义和幻想相结合。”而处理好这些真实的细节会让奇幻元素变得更加耀眼。考虑到植物并不是建筑的主体，它们本可以很容易被事后草草，但显然经过了精心制作，看起来非常真实。这证明了
    SadicalMC 的水平：建筑中栩栩如生的元素与戴着大礼帽、背着城堡的鸭子并在一起完全一点不协调。


    ![](img/MMB_DuckBuild_fullbleed_7.jpg)


    ### 设计灵感

    一个不寻常的女神，但拥有丰富的色彩供选择。SadicalMC 选择了与鸭子黄色“羽毛”形成鲜明对比的区块。


    ![](img/11.jpg)


    这些羽毛朋友是结合了现实和玩具参考创作而成的，它们拥有巨大的圆脑袋和流线型的身体。


    ![](img/12.jpg)


    ### 建筑细节

    - **顶部**：`SadicalMC` 用无数植物和一些奇幻的灯笼装饰了池塘，玩得非常开心。

    - **底部**：仔细观察那些巧妙地平衡在鸭子背部和喙上的精细塔楼。


    ### `SadicalMC` 的历程

    你不会一夜之间就成为鸭子池的统治者，SadicalMC 已经在磨练他那套独特的技能多年了。“我开始玩 Minecraft 是因为在我上小学时，几个朋友向我介绍了它。它超级有趣。”最初吸引他的是红石提供的先进技术可能性，例如能够建造一个互动式的井字游戏。在青少年时期回到游戏后，他发现自己现在更喜欢
    Minecraft 的建筑方面。“作为一个现在的建筑师，我会觉得：‘那些红石东西太让人压力大了。我不喜欢！’”


    看到 Minecraft 社区不断分享的伟大创作，了 SadicalMC 尝试自己制作一些建筑，尽管他声称自己并非一蹴成功：“我失败得惨惨。”幸运的是，SadicalMC
    坚持玩 Minecraft，逐渐提高了了自己的建筑技巧。他将此很大归功于看到社区中源源不断、令人惊叹的作品。“我越投入，看到的灵感就越多。这激励我成为一名更好的建筑师，并释放我的创造力。”


    ![](img/MMB_DuckBuild_fullbleed_6.jpg)


    ### 核心特征

    **01** 黄色玻璃的半透明性——尤其是缩小视角后——让这些鸭子看起来带有一种毛茸感。他还使用了白色羊毛、白色混凝土粉、海绵和黄金。


    **02** “我为城堡选择这组色调是因为我非常喜欢这种黄白色搭配任何红色或橙色调的颜色。”将这些城堡做成和喙同样的颜色，也意味着这些尖塔是从鸭子身上有机生长出来的！


    **03** `SadicalMC` 可能对细节很有眼光，但这并不意味着他愿意在不必要的制作上浪费精力。“我曾纠结要不要给它们加上小脚，但它们反正会被水淹没，所以不值得了。”


    **04** “我绝对喜欢建造植物和花朵。我使用了各种绿色区块。”使用的区块范围让植物看起来比只使用单一的纯色区块更有生机。


    **05** 哪种是 SadicalMC 最偏爱的鸟？“我认为最小的那只是我的最爱。”


    ![](img/16.jpg)


    ### 创作哲学

    最近，他的创造力集中在完善复杂的元素上。“我是纹理和极精细细节的坚定拥护者。这是 Minecraft 最近的一种趋势。很多人在做非常微小、简单的建筑，但带有精细的细节，他们可以成功地在一个五乘五的空间里塞进最疯狂的细节。”这显然是他内在的设计哲学，并将其带到了自己的作品中。通过关注池塘上四只鸟这样一个具有欺骗性的小场景，他能够全身投入地让每个方面都尽可能超细节。一根胡须都不乱。


    但让我们进入最重要的问题。这些鸭子有名字吗？“没有。噢天天，我本应该给它们命名的！”他叹道。幸运的是，这远不是他的第一个鸭子建筑。事实上，这甚至不是他第一个带有戴礼帽的鸭子的建筑。之前的三只分别名为
    Sir Quackles、Sir Quackles the Second 和 Sir Quackles Junior。至少这些作品比他的命名习惯更具启发性。


    “这次建筑对我来说是一个结合我三个最喜欢的事物的机会：鸭子、城堡和植物。这就是整个项目的意义所在。”围绕这三个带给你最多快乐的主题创作出一个独特的建筑，然后让想象力自由驰骋，是世界各地创作者的梦想。即使是这些傲慢的池塘生物也应该为此致敬，尽管它们可能会冒着撞掉一两个尖塔的风险。


    ![](img/MMB_DuckBuild_fullbleed.jpg)


    # 第三章

    ## 公主

    作者 `Varuna`


    ![](img/aquaprincess_fullbleed_6.jpg)](images/aquaprincess_cutout_2.jpg)


    沉没的宝箱。丰富的沉船。神秘的遗迹。Minecraft 的海洋为任何愿意潜入的人提供了大量的宝藏和奇观。诚然，那里还有眼睛会射激光的海怪和手持三叉的水僵尸，但那里有足够的奇观值得你下水。如果你仍然不信，也许专业建筑团队
    Varuna 的《公主》足以让你沉迷其中。


    这座水下建筑充满了巧妙的细节，给人一种在海底存在很久很久的遗迹感。例如生长在公主碑和她所拥有的城堡上的植物；像这里的主人一样游荡的鱼群；以及让探索变得极其危险的鲨。深海建筑师
    `BlackKing89`、`Fiksat`、`ColoradoMcoil` 和 `RenQeN` 以及 `Varuna` 的创始人 `Thomas Sulikowski`
    显然投入了大量心血。

