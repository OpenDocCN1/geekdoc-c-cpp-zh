    你可能会花费几个小时在这一图书馆宏伟的大厅中穿梭，每个房间都挤满了书籍，而记者们曾因这些信息而遭受迫害、入狱甚至被杀。Blockworks 还为图书馆策划了几个展区，通过艺术装置讲述了镇压自由的行为如何影响世界部分地区的故事。每一个展区都是根据其描绘的国家量身定制的。例如，在俄罗斯展区你会看到一只巨大的章鱼，被称为“数据利维坦”（Data
    Kraken），它的触须代表了俄罗斯政府在网络监控和间谍活动对公民生活的长远触角。


    “我们试图寻找那些既有高度审查制度，又有很多人在玩《Minecraft》的国家，”无国界记者（Reporters Without Borders）媒体与公共关系官员
    Kristin Bässe 解释道。这些地区打压了自由表达，但没有审查《Minecraft》。这是一种聪明的变通方法，类似于无国界记者之前使用过的策略。


    “他们之前做过一个名为‘未审查播放列表’（The Uncensored Playlist）的项目，”Blockworks 创始人兼执行经理 James Delaney
    解释道，“通过将被审查的内容偷偷带入歌词，然后将这些歌曲上传到 `Spotify` 来绕过媒体审查法。因此，那些不审查 `Spotify` 但审查这类内容的国家，本质上可以通过在
    `Spotify` 上发布这张未审查的专辑被欺骗。”


    ![](img/139a.jpg)


    ⬢


    一座令人印象深刻的建筑宏伟入口。


    ![](img/139b.jpg)


    ⬢


    左侧 | 一排排的书籍，每一本都代表该建筑所提供的一件被审查的作品。


    ⬢


    中间 | Blockworks 发现墨西哥展区的设计最具挑战性。


    ⬢


    右侧 | 代表俄罗斯政府网络监控的“数据利维坦”。


    ![](img/Uncensored_library_fullbleed_16.jpg)![](img/Uncensored_library_cutout_4.jpg)


    ## 埃及


    在埃及展区，你会看到一组高耸的天平，且一侧严重倾斜。“这是对正义之平的运用（在古埃及文化中，神阿努比斯会在这些天平上称量死者的心），并反映了该国司法系统在对待追求言论自由的记者时是多么偏颇，”James
    Delaney 说道，“所有的房间、其中的创作或装饰或图案，都是为了与该国家的建筑风格或历史相协调。”


    ![](img/Uncensored_library_cutout_2.jpg)


    ## 沙特阿拉伯


    在沙特阿拉伯展区，你会看到一个森严的笼子，其色调与图书馆大部分的美感格格不入。“那个国家的许多记者最终都入狱了，”James 说，“我们想要一些与图书馆的宏伟感相匹配，但又能代表那里的状况。选择黑曜石——最硬的
    `Minecraft` 方块之一——是一个刻意的选择，旨在展示人们摆脱那种处境是多么困难。”


    ![](img/Uncensored_library_cutout_1.jpg)


    James 从青少年时期开始玩 `Minecraft`，在服务器上与其他玩家见面，并稳步地构建更宏大的项目。“这逐渐变成了一份职业。我开始收到来自 YouTuber
    和影响者的订单，然后是 `Minecraft` 服务器，最后是 `Microsoft` 本身、公司以及各种想要获得 `Minecraft` 体验的人们。”


    当无国界记者寻找能够帮助策划图书馆的 `Minecraft` 专家时，Blockworks 是完美的合作者。“成为一座地标性建筑很重要，”James 解释道，“显然，`Minecraft`
    中有很多惊叹的建筑，所以为了引起小孩子的兴趣，它不能只是一个小型的图书馆。它必须是宏大且令人震撼的。”最终，它的规模超过了一千万个方块。


    “我们参考了可能在牛津和剑桥等大学里看到的哥特式图书馆，”他在谈到灵感来源时说道，“我们最终采用了新古典主义风格，这实际上是许多殖民国家、许多政府以及许多独裁政权的常用建筑风格。他们倾向于这种特定风格，因为它宣示了某种权威。”


    从独裁设计中汲灵感难道不是背离了图书馆想要代表的自由初衷吗？“使用这种风格是一种故意的，是为了颠覆它的原始意图，”James 说，“通过内部书籍的获取来反转它扮演的角色。重新利用新古典主义风格。”


    Étienne-Louis Boullée 是一位 18 世纪的建筑师，对于他的时代来说野心极大，是另一个大灵感来源。“他被称为‘纸上建筑师’，”James
    说，“他从未真正建造过任何东西，因为他所有的设计都大得离谱、华丽且壮。我们认为这绝对完美。他为艾萨克·牛顿设计了一个巨大的纪念碑，像一个巨大的球体。他为巴黎国家图书馆设计了一个方案，我们非常仔细地复制了它。”Boullée
    的宏伟设计在今天会被认为是不可思议的，更不用说在 18 世纪，遗憾的是他超前于那个时代的实现水平。跨越几个世纪，Blockworks 终于从中汲取灵感并实现了了他的愿景。“它几乎有一种科幻感，”James
    评价 Boullée 的作品时说道，“对于 1700 年来说，它的规模是史诗级的，而且与游戏非常匹配，因为在游戏中你不需要担心预算和物理限制。”


    ![](img/145.jpg)


    ⬢


    左上角 | 代表全球审查的作品是一项艰巨的任务，无国界记者和 Blockworks 都非常重视这项任务。


    ⬢


    右侧和左下方 | 宏伟的圆顶形状和风格来自世界各地的新古典图书馆。Blockworks 希望设计能保持一种宏伟感和权威感。


    “这是一个困难的问题，因为我们最终是在一个由年轻人玩的电脑游戏里。”


    更大的担忧是如何取得正确的语调平衡，考虑到图书馆所展示的那些震惊且往往是悲剧的故事。“这是一个困难的问题，因为我们最终是在一个由年轻人玩的电脑游戏里，而我们还在处理极其敏感和困难的话题，”James
    说道，“我认为墨西哥展区是最挑战性的，因为那里有被杀害记者的纪念碑。有些人会说这不适合 `Minecraft`。但通过与无国界记者紧密合作，并确保表现方式足够敏感，与所有相关家属交流，我们认为可以用一种尊重的方式来完成，让人们意识到世界上面临的问题。”


    这是一次冒险但值得的尝试，因为 `Minecraft` 帮助无国界记者触达了新的受众。“这是我们可以在他们所在地触达他们的方法，”Kristin 说，“不仅是玩家能看到图书馆，还有看
    YouTube 视频或从朋友那里了解它的年轻人。这是一种非常具体的方式，向年轻人展示这实际上与你有关。它与你的人权、你获取信息的权利、在一个国家投票的权利有关，因为它与民主有关。”


    这些知识并非仅仅通过在图书馆阅读来获得。《Minecraft》的多人功能还让来自世界各地的人在图书馆的服务器上相遇。“你可以在游戏中让一个埃及人和一个英国人联系，”Kristin
    解释道，“来自英国的人可以提问，比如‘那个网站在你们国家真的封锁了吗？’很难想象他们无法访问某个网站，或者因为点赞某条推文就被捕。”


    ![](img/Uncensored_library_fullbleed_6.jpg)


    ⬢


