  trans: '

    “西南大陆的灵感源自新西兰和美国太平洋西北部，这两个地方都有着壮丽的、被美森林环绕的雪山火山。东南大陆（如图所示）的灵感模糊地源于犹他州南部和亚洲中部高地平原的结合，尽管在最终版本中我很大程度上偏离了这些灵感。最难建造的部分是红色沙漠与草地之间过渡带的东南大陆。我可能尝试了二十种不同的方块选择方案，因为无论我如何努力，都无法让任何东西看起来很自然。最终，我确定了现在的外观，并对最终成品非常满意。但达到这个结果的过程确实非常令人沮丧！”


    ![](img/68b.jpg)


    Qwryzu 是该场景的一部分，他使用模组（mods）来打造最完美的景观。但首先，他会花费最初几个小时研究“谷歌地球和 Instagram 上的风景摄影账号，以寻找激发灵感的地方”，并自己拍摄一些参考照片。然后，一旦他想好了要在自己的建筑中包含的内容，他就会为世界的整体布局画一幅草图。最后，是时候动用建筑工具了。


    “我的地形形状几乎完全是在名为 `WorldMachine` 的软件中完成的，”他解释道。“`WorldMachine` 在地形社区中非常流行，不言而喻。它能让你创作出真实的
    CG 景观，利用算法模拟地形在现实生活中的行为。单是它的侵蚀选项就名其实其实非常深奥。你是更倾向于模拟基于流的侵蚀、热侵蚀，还是将你的地形埋在雪子里，用来建造一间温馨的小木屋？`WorldMachine`
    的初始难度曲线可能像真实的被侵蚀悬崖一样崎岖，但对于那些想要将 Minecraft 地形技巧提升几个台阶的人来说，这是一个极好的工具。在 Minecraft
    之外，qwryzu 是一个有志的地质学家，他利用该软件模拟他在课程中学到的过程。”


    “我喜欢可以建造任何我想要的东西的自由。我坐在这里制作漂亮的山脉，而其他人正在游戏里制作真正的电脑。”


    `WorldMachine` 也只是 qwryzu 创作过程开始。他也是 `WorldPainter` 的忠实粉丝。“`WorldPainter` 是一款用于创建
    Minecraft 景观的免费软件，毫无疑问，它是建筑社区中最重要的外部工具，而不仅仅是地形师中的如此。我也必须在 `WorldPainter` 中完成大量工作，应用如树木、植物、河流层，以及一些我在
    `WorldMachine` 中没有完成的方块选择。”


    `WorldPainter` 并不像 `WorldMachine` 那么复杂。它让你自由地绘制大区域的地形，就像许多数字绘画或照片编辑工具。原版 Minecraft
    将玩家限制在第一人称视角，因此许多玩家使用 `WorldPainter` 或 `WorldMachine` 来获取他们建筑的远景。难怪 qwryzu 对两者都推崇至极。


    ![](img/MMB_Kythor_fullbleed_15.jpg)![](img/70.jpg)


    ⬢


    为了营造出平缓山丘的印象，qwryzu 将较小的方块层堆叠在一起。


    工具已经选好，现在是最困难的部分：将所有这些地形整合在一起。正如 qwryzu 所描述的，这个“艰辛的过程”涉及到在 `WorldMachine` 和 `WorldPainter`
    之间频繁切换，不断进行修改，并“一次导出小块块地图以查看它们的效果”。这远不是一种快速的方法，尤其是 qwryzu 还坚持他的景观要与 Minecraft
    的风格一致。“我尝试保持我的方块选择相对简单且符合生存模式。它大部分是石头和陶土的混合，在合适的地方也有草地。石头和深色陶土或青色、棕色和黑色等混凝土非常适合喜马拉雅山或洛基山脉这样高大的山脉，但其他颜色如白色、黄色和棕色陶土可以做出很棒的沙漠，如亚特拉斯山脉。我的自定义纹理包[在此特色]也调整了陶土颜色，使其更接近美国科罗拉多高原地区发现的沉积岩颜色。许多地形师使用在渲染图中看起来很棒的方块，例如珊瑚和海绵，但它们在生存模式中毫无意义。”


    Qwryzu 对 Minecraft 的热爱源于在生存模式下玩游戏：他在 2010 年接触到了早期版本的 Minecraft。“我只记得只能挖掘石头方块和放置火炬，光是这些就足以引起我的兴趣了。”对于一个游戏来说，十多年是一个很长的时间，但他有一个个人目标，提供了无限的挑战。“我希望我所有的地图在游戏中使用也具有意义，而不仅仅是为了渲染。”能够创建一个真实的建筑，同时保持其可识别的
    Minecraft 特色，是一项令人钦佩的成就。尽管他的地形建造变得如此先进，但看到没有什么能侵蚀 qwryzu 对多年前就迷上的这款生存游戏的热情，真是很好。


    “我只记得只能挖掘石头方块和放置火炬，光是这些就足以引起我的兴趣了。”


    ![](img/MMB_Kythor_fullbleed_8.jpg)


    ⬢


    这种方法在建筑师雄心勃勃的山景在大尺度上显而易见。


    ![](img/MMB_Kythor_fullbleed_14.jpg)


    ### 北峰


    “这张地图的灵感来自于观察非洲撒哈拉沙漠西北部的亚特拉斯山。作为来自美国西南部地区的人，沙漠上方高耸且积雪的山峰对我来说一直是不可思议的。但坐落在撒哈拉无尽沙丘之上的亚特拉斯山特别捕捉了我的想象力。”


    那些西北沙漠的山脉和沙丘是 qwryzu 最自豪的建筑部分。“山脚那个可以看到沙丘、棕榈树和雪山的绿洲无疑是我整个地图中最喜欢的地方。当我脑子里有了想要包含的想法，最后能做出完全符合梦想中的产品，这真的很罕见！”


    ### 技巧与秘诀


    #### 1 制定计划


    计划是 Zeemo 在建造 Future City 时学的最重要教训，也是给建筑者的主要建议。“在开始建造建筑或纪念碑之前，你必须在大脑中有一个愿景；建筑风格、比例、方块选择、颜色、光照。在一个带有生物群的地图上，建筑的位置也很重要。”


    #### 2 安装辅助模组


    `WorldEdit` —— Maggie Gondo Wardoyo 和 Arkha Satya Taruna 在创作 Moon Destruction
    建筑时使用的软件是最好的 Minecraft 模组之一。它让你一次性选择并更改多个方块，而无需逐个删除并替换现有方块，还有许多实用的快捷键，让如此大规模的建造变得更容易。


    #### 3 使用正确的工具


    `VoxelSniper` 是一个用于世界编辑的 Minecraft 模组，Thomas Sulikowski 是它的忠实粉丝。“这是一个非常棒的工具，允许我们向前向后推拉某些方块。在创建有机体时可能是最有用的工具之一。”

    '
- fmt: '

    Arkha recommends reaching out to other players. “I think the `Minecraft` community
    is one of the most active and largest gaming communities in the world. We can
    share our maps, texture packs, skins, and `Minecraft` tips and tricks. I’ve met
    many people through `Minecraft`, including my best friend and partners on Minecraft
    projects.”


    ## 05 Pick a Palette


    “This is part of the one- or two-week planning process,” Thomas Sulikowski explains.
    “We’ll go into a `Minecraft` world and start placing blocks that we think are
    nice color combinations. For a smaller project these can be twenty to twenty-five
    blocks. For a bigger project it can run to over a hundred blocks. For `Aqua Princess`,
    we really wanted to add these pops of color, because the reference image we got
    was super colorful. The colors were very punchy, very in your face. We wanted
    to mimic that in `Minecraft`, so we wanted to make sure that we picked the right
    blocks.”


    ## 06 Mods Are Your Friends


    `Conquest Reforged` – used by `Minecrafttalsi` to make the Rich Medieval Town
    – is one of the most popular `Minecraft` mods and it’s not hard to see why. Boasting
    over 12,000 blocks, extra textures, particle effects, and much more, it’s particularly
    popular with historical and fantasy builders. Likely because the bleak medieval
    age – where rumor has it you couldn’t even download `Minecraft` then – looks a
    lot more inviting through the rose-tinted glasses that `Conquest Reforged`’s terrific
    toolset offers.


    ![](images/73a.jpg)

    ⬢ An aerial shot of Future City by `Zeemo`, who likes to plan out his builds in
    advance.


    ![](images/73b.jpg)

    ⬢ To create their explosive moon, `Maggie Gondo Wardoyo` and `Arkha Satya Taruna`
    used `WorldEdit`.


    ![](images/73c.jpg)

    ⬢ `Varuna` found `VoxelSniper` helped create realistic-looking organic matter,
    such as the beautiful statue’s face in `Agnoia Frieden`.


    ![](images/73d.jpg)

    ⬢ `Arkha` and `Maggie`’s Cyber City celebrates the future of humanity, a fitting
    scene from builders who believe in community.


    ![](images/73e.jpg)

    ⬢ `Varuna` recommend choosing your blocks ahead of the build so you can find a
    palette that pops, like their vibrant blue tang.


    ![](images/73f.jpg)

    ⬢ `Minecrafttalsi` finds `Conquest Reforged` provides excellent tools for his
    vast medieval world.


    # Chapter Nine: The Sea Diary


    By `Junghan Kim`


    ![](images/MMB_seadiary_fullbleed_13.jpg)![](images/MMB_seadiary_cutout_3.jpg)


    Short of visiting an aquarium with two kaleidoscopes glued to your eyes, you’re
    unlikely to see a more colorful depiction of underwater life than `The Sea Diary`.
    A lush collection of aquatic creatures, mysterious temples, and almost every hue
    that `Minecraft` has to offer. It’s enough to make you wonder why you even bother
    living on land in the first place. Surely breathable air is a small price to pay
    to live somewhere this pretty?


    Remarkably, `The Sea Diary` wasn’t even intended to be a sea build at all. Its
    architect, `Junghan Kim`, began this project desiring to create something simple.
    “I wanted to build something that could have existed in the past, like Aztec civilization.”
    As a starting point, Aztec architecture lends itself nicely to `Minecraft`, with
    its chunky pyramids and grand scale. `Junghan`’s design then developed into the
    vibrant neoclassical settlement that’s seen here.


    “How it came to be in the sea is that I thought there must have been topographical
    changes to the old civilization over time. I knew that the sea level was changing.”
    Instead of researching those actual topographical changes, `Junghan` was suddenly
    inspired to take a more speculative approach. What would a civilization that had
    been completely consumed by the ocean look like?


    Initially, `Junghan` wanted to build a city that was subjected to shallow waters,
    to give the impression that these elaborate temples were slowly sinking into the
    sea. An interesting premise, one that would certainly be challenging to depict
    in `Minecraft`. But `Junghan` had a change of heart and eventually decided to
    submerge the entire build. It wasn’t the challenge that stopped him – the mysteries
    a deeper ocean offered simply enthralled him more. “I became interested in the
    deep sea because we never know what’s happening down there. It’s scary but interesting.
    So I wanted to make a work that explored this subject.”


    ![](images/80a.jpg)

    ⬢ This top-down view draws attention to the color palette used by `Junghan Kim`.
    An underwater rainbow!


    ![](images/80b.jpg)

    ⬢ `Junghan` designed underwater plant life to climb the Aztec monuments. A deep-sea
    creature that curious divers can discover.


    “I became interested in the deep sea because we never know what’s happening down
    there. It’s scary but interesting. So I wanted to make a work that explored this
    subject.”


    ![](images/MMB_seadiary_fullbleed_14.jpg)

    ⬢ Who wants to live in an orange submarine?


    “Everything was produced mainly using creativity rather than research; I thought
    more about how to make it look better.”


    What isn’t happening down there? `Junghan` seems to have had an allergy to dead
    space, cramming his build with as many sea creatures, temples, plants, and even
    bubbles (a lovely touch that enhances the underwater feel) as possible. “Scary
    but interesting” may not seem an immediately obvious design philosophy, given
    the luscious color palette that makes `Junghan`’s ocean look so welcoming, but
    you don’t have to explore for long to uncover more sinister details, like a gigantic
    shark with unfortunately-also-gigantic teeth. Swim inside its mouth (go for it,
    you’ll probably be fine), and you’ll discover several fish, frozen in the moment
    they become shark lunch. `Junghan` looked up real fish shapes, sizes, and ecosystems
    to help craft these creatures, but realism was never the priority.


    Real-world inspirations can be helpful, but `Junghan` was more influenced by other
    builds. “I’ve seen sea works by other artists. The most impressive map was `Deep
    Sea` by `Blockworks`.” `Deep Sea` depicts an underwater laboratory, with a significantly
    more muted, colder color palette than `The Sea Diary`. It certainly meets `Junghan`’s
    “scary but interesting” criteria. Describing `Deep Sea` as a “really amazing arrangement,”
    `Junghan` referred to it a lot when crafting his own map. He didn’t try to recreate
    another build team’s work, but admired it and used what they’d built as the foundation
    for his own approach to the ocean. In this case, a complex structure that sprawls
    across the dark depths of the ocean, teeming with life to be explored.


    ![](images/MMB_seadiary_fullbleed_7.jpg)

    ⬢ Pops of yellow and orange help the darker parts of the city stand out.


    `Junghan` is quick to praise other builders, but it’s his own building abilities
    that he hasn’t always been so quick to praise. “I started this work when I really
    thought I lacked architectural skills. Many of my friends were really good at
    architecture and I really thought that I was lacking compared to them.” It’s easy
    to scoff at that claim now, when you see his finished build, but negatively comparing
    yourself to others is sadly a very effective way to demotivate yourself out of
    building anything at all. Frankly, instead of giving up, `Junghan` made a promise
    to himself to stick with `The Sea Diary`.


    That wasn always an easy promise to keep. “It was really hard to spend so much
    time alone making everything in high detail and quality. I actually tried to change
    the story and the theme several times. They’d change based on my mood and feelings
    in the moment, forcing me to spend many hours editing the buildings and the terrain.
    To be honest, it was stressful to build sometimes.”

