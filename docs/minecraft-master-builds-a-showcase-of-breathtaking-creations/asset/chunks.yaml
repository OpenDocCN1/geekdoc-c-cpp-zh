    “城镇将走向何方、城堡建在哪里、哪里留农田等，我通常会先对该区域画一个简单的草图。然后我标记出所有的道路、房屋位置、围墙等等。我在游戏内使用不同颜色的羊毛块来完成这一切。”在投入建造之前，使用占位块是了解地形布局的明智方法，而且几乎没有忘记替换这些占位块的风险——因为当玩家们发现你的“中世纪教堂”是由粉色羊毛制成的时，他们往往会注意到的。对于这座特定的城镇，Minecrafttalsi
    从规划主路和城门的位置开始。“城镇的中心，也就是所有道路汇合的地方，必须是市场和教堂。”然后，他随手确定了各个小巷和房屋的布局。“为了这一点，我也经常求助于手绘草图。我的抽屉里其实还留着很多这样的草图！”


    为 Minecrafttalsi 计划不仅仅是填满写生本。他非常相信寻找参考照片，并更多地了解你正试图在 Minecraft 中重建的那个时代。“在开始建造之前做一些研究非常重要。这真的能让你了解某些定居点是如何以及为何形成的。”这让他对中世纪历史有了更好的理解，但他并不受制于此。“我个人并不追求历史上的完全准确——一个显而易见的例子就是那座巴洛克风格的教堂——我更倾向于尝试创建一个本身具有某种可信度的世界。研究真实的中世纪城镇对此非常有帮助，特别是在涉及到小细节时。”在一个其他地方保持中世纪风格的城镇中放置一座巴洛克教堂可能看起来并不寻常，但
    Minecrafttalsi 太喜欢那个设计，以至于不想在这里放弃它。


    ![](img/MMB_fortified_town_fullbleed_3b.jpg)


    ⬢


    这座巴洛克教堂可能不符合历史事实，但非常契合这种风格。


    ![](img/125a.jpg)


    ⬢


    城堡具有引人注目的木框架和抹灰墙。


    ## 跨越边界


    尽管半木结构房屋在设计上非常有德国特色，但影响这次建造的地点实际上是罗马尼亚的城市 Râsnov 和孚日山——这是位于法德边界的一个山脉。Minecrafttalsi
    被位于孚日山范围内的城镇所启发。它们美得简直不可思议，是 Minecraft Minecraft 中重建的完美素材。*Magnifique*（完美）！


    ![](img/125b.jpg)


    ⬢


    围墙围绕着整个城镇，保护它免受可能的攻击。


    ![](img/129.jpg)


    ⬢


    城堡内部也经过了装饰，假设中的村民被赋予了种有花的如画般的庭院。


    “我总是尽可能使用大量的参考照片。大部分是现实世界的地点或建筑，但有时是艺术品甚至是游戏。”对于这座城镇，他的灵感主要来自德国的半木结构房屋。这些房屋拥有倾斜的屋顶，深色的木梁构成了美学的一部分而非被隐藏，这在中世纪晚期很常见，甚至可能追溯到
    12 世纪。然而，斜屋顶对于完全由立方体组成的游戏来说有点难以实现。为了应对这一点，Minecrafttalsi 在屋顶上增加了外露的梁，以帮助增强那种中世纪感。


    创建一个连贯的城镇具有挑战性，但建造城堡被证明是最困难的部分。这是一个极其复杂的设计，因为他的城堡有着“复杂且有些杂乱的布局。我必须处理许多倾斜的建筑。”Minecrafttalsi
    没有去规划一个简单的城堡设计——那可能不符合时代设定——而是采取了某些“艺术自由”来使其设计在 Minecraft 中可行，再次从现实世界的历史风格中汲取灵感，而不受制于它们。


    “我总是尽可能使用大量的参考照片。大部分是现实世界的地点或建筑，但有时是艺术品甚至是游戏。”


    ![](img/MMB_fortified_town_fullbleed_1b.jpg)


    ## 模组时代


    Minecrafttalsi 努力为他的中世纪建筑寻找最准确的纹理。他希望他的城镇拥有一种真实的氛围。“地图不仅需要一个资源包，还需要一个模组才能运行。”他找到了一个模组——适用于
    Minecraft 版本 `1.12.2` 的 `Conquest Reforged`——该模组提供了丰富的区块和纹理。


    “我绝对想在未来改变它。实际上我目前正在制作一张更真实的底图，目标是将整个城镇复制过去。”


    那座城堡可能是最大的建筑挑战，但并不是他作品中最喜欢的元素。事实上，“作品中没有任何一个部分是我感到最自豪的。”相反，他最自豪的是“整个地方感觉是连在一起的。那是我个人最喜欢的一点。”


    至于他会改变什么，Minecrafttalsi 的野心可能让他自己陷入了困境。“在我建造这座城镇很久以前，我就创建了底图。城镇位于一个被群山环绕的大山谷中。这在创建真实的河流和水体时被证明是非常局限的。所有的溪流都需要流向海洋。然而，由于周围所有土地的海拔较高，我无法让它实现。相反，该地区所有的河流都通向了某种湖泊，这在现实中是完全说不通的。”这是一个许多建造者会学会与之共处的缺陷，但
    Minecrafttalsi 有着修复它的重大计划。“我绝对想在未来改变它。实际上我目前正在制作一张更真实的底图，目标是将整个城镇复制过去。”仅仅为了让河流更真实就复制整个城镇？有了这样的决心，Minecrafttalsi
    甚至可以在现实中建造一座城堡。


    ![](img/130a.jpg)


    ⬢


    在山谷中建造中世纪城镇提供了背景。


    ## 为城镇上色


    Minecrafttalsi 并不是想要创造一个压抑的中世纪再现。他希望他的城镇拥有一种真实的氛围，并确保使用了色彩来体现这一点。“我使用了一种更暖的色调，大部分是大地色调。尤其是红色和棕色。”他甚至修改了生物群，让草地呈现棕色，以与建筑保持一致。“我认为这为我想要的效果营造了合适的氛围。”


    ![](img/130b.jpg)


    ⬢


    房屋和周围植被使用的色调营造出了一种年代感。


    ## 第十四章：反乌托邦心态


    作者：Jossboy


    ![](img/MMB_DystopianMindset_fullbleed_8.jpg)[](images/MMB_DystopianMindset_cutout_5.jpg)


    这个名为 `Dystopian Mindset` 的奇异头骨内文明是由 Jossboy 打造的。


