  raw: 'Before starting the Immortal Lands, Iskillia did some initial planning: doodling
    designs in the margins of his school papers. But he mainly preferred to dive straight
    into building and develop a plan on the fly. “It’s a very agile method. It changed
    all the time. I’m building and building and building and at the end I have something.
    Something that was absolutely out of control at the beginning!”


    Over time a structure did develop, one Iskillia breaks down into three stages.
    “There’s the beginning, when you’re just creating things and trying to find a
    way to assemble them together. The second part is where you’re planning and you
    choose a global organization of the map, the structures, etc. The final part is
    when you know what you want. Now you’re all in on the details.”


    “It’s a very agile method. It changed all the time. I’m building and building
    and building and at the end I have something. Something that was absolutely out
    of control at the beginning!”


    This final stage was the most challenging. “You can’t copy-and-paste things,”
    believes Iskillia. “So you’re forced to craft things that are very similar-but-different
    all over your map. I think it’s the hardest part in art in general!” Look closely
    and you’ll see that, remarkably, a lot of the similar-looking structures, particularly
    the many houses, do have subtle differences. It’s hard to argue with how much
    character it gives his city, but it’s a level of commitment that instills a need
    to lie down just from thinking about it.


    Getting the minor details exactly right was tough and time-consuming, but seeing
    the bigger picture of Aman presented its own challenges. “When you are in-game
    you have a limited view and a limited view distance.” It’s an obstacle that naturally
    becomes a bigger stumbling block as your build becomes more vast. “That can be
    a problem. When you’re working for a year and a half on the map, you get to know
    it really well. You can move around it easily and really know where everything
    is. But it can be difficult to see the ‘globality’ of the map.”


    ![](images/3.jpg)![](images/MMB_aman_fullbleed_3.jpg)


    Red Sails Under Red Skies


    Loosely based on Venetian ships, this red-sailed beauty of a boat is a smart way
    to introduce a contrasting color to the wider build without clashing with the
    aesthetic of the existing architecture. Plus, Iskillia’s typically absurd eye
    for detail stops the ship from feeling like mere window dressing and actually
    makes it part of this city because he’s not just built the ship, he’s built the
    ports and included the goods, ready for trading. Hay bales and pumpkins anyone?


    ![](images/MMB_aman_fullbleed_No_reflection_13.jpg)


    ⬢


    The Immortal Lands in their entirety, showing the varied shape language that Iskillia
    utilized.


    ![](images/MMB_aman_fullbleed_15.jpg)


    ⬢


    Iskillia thought out the balance of color in his build, ensuring each element
    stood out.


    Every Building Unique


    Iskillia used birch wood for the structures of the small buildings (well, small
    by this build’s standards). To contrast with the paleness of birch blocks, he
    used spruce wood for the borders and prismarine for the roofs. He felt that the
    cold blue/green prismarine was a color that would work nicely with the warmer
    colors from the wood. Wonderfully cozy!


    What Iskillia needed was a huge amount of oversight to get a good idea of how
    his city was progressing. That’s where his aforementioned rendering skills came
    in. Rendering isn’t just the fine art of making Minecraft look absurdly realistic.
    It can also let you see the full scope of your creation at last. “The first time
    you see the whole map in one frame,” explains Iskillia. So, halfway into his eighteen-month
    project, he made a render that let him do just that. How did it feel to finally
    see nine months of his hard work in its entirety? “Whoa.” Well put.


    With its towering statues and intricate citadels, it’s easy to look upon The Immortal
    Lands and imagine a real city with a rich and detailed history. In fact, many
    of the choices Iskillia made have turned the city into something of a record of
    his Minecraft skills as they evolved over the years. “I took an old build of mine.
    A very old build from maybe two or three years before starting this project. It
    was in the style and atmosphere of this map and it had interesting ideas, so I
    decided to add it to the map, even though it was not at the peak of what I can
    do.”


    It may seem like a strange choice to place your earlier, less-polished builds
    besides your best work but Iskillia is adamant that hiding your earlier creations
    is actually a mistake that too many builders make. “Don’t judge your past self,”
    he advises. “Many artists have this problem. They are getting better at their
    skill and so they judge their past work. When you’re making a map over eighteen
    months, if you’re judging your past work all the time, you won’t be able to continue.
    You will always destroy what you’ve already made or move on to another project.”


    Iskillia’s less self-destructive approach is essentially what real-world cities
    are – a hodgepodge of loosely connected designs and ideas, crafted during different
    times by builders who change and evolve the longer they work within their cities.
    “Absolutely. In a civilization, there aren’t only beautiful buildings. There are
    ugly things! I think those errors, if we can even call them errors, make the map
    richer and more interesting.” It would be hard to call anything on Iskillia’s
    map ugly. Instead, it’s much easier to admire the sheer scale of his city and
    enjoy discovering more delightful details upon every view.


    Chapter Two


    A Duck Build


    By SadicalMC


    ![](images/MMB_DuckBuild_fullbleed_1.jpg)![](images/MMB_DuckBuild_cutout_12.jpg)


    A Duck Build is a celebration of the poshest, most pompous flock of ducks ever.
    These wealthy waterfowl boast monocles, top hats, mustaches on the brims of their
    beaks, and even elaborate castles protruding from their bright yellow backs (because
    of course they’re landlords). But just because these avian gents have a stiff
    upper beak doesn’t mean they’re not interesting. Perhaps, as its architect SadicalMC
    believes, that’s because “you can just make anything funny because of a duck.”


    For this particular build, SadicalMC’s plan was, “a line of ducks in a pond with
    castles on their backs, wearing top hats,” which is a tough elevator pitch to
    beat. It certainly didn’t hurt that his chosen subject was one he felt strongly
    about. “I love ducks. They’re just so simple and so cute. I’ve met some people
    through the building community that were big duck advocates. When I was a Build
    Battle player on Hypixel [a popular Minecraft server] for a bit, I used to just
    build ducks out of everything. Ducks everywhere!” Good luck to anyone thinking
    of a better Minecraft building philosophy than “ducks everywhere!”'
