  trans: '


    建造者们最令自豪的是，他们坚持了最初的理念。但随着多年推移，他们难道没有动过妥协缩小野心的念头吗？“我们尝试过让它更大，但从未尝试过让它更小，”他们说道，对任何缩减团队想法的建议都不予理会。这显然是一群相信“大即是好”的建造者。原本可能只是一堆令人印象深刻的摩天大楼，实际上却具有美感的多样性和清晰划分的区域。如果不是像摩轮这样的大地标建筑在由致力于完善每一个小细节（无论这些细节多么平凡或看似不足道）的玩家精心建造的非奢华建筑作为背景，它们绝不会如此令人印象深刻或震撼。


    ![](img/118.jpg)


    ## 地标建筑


    对于一座无名的城市来说，佐山（Sayama）充满了极具戏剧性的地标建筑。佐山制作委员会从现实世界的建筑中汲取了灵感，例如京都塔。团队还对天际线的突出部分创造了自己的独特见解，例如放置在住宅区普通公寓楼顶部的这个巨大的红白相间的摩轮，就像所有普通的游乐场设施一样。


    ![](img/111a.jpg)


    01 除了道路外，佐山制作委员会还考虑了高速公共交通。主火站在位于体育中心正后，轨道遍布整个城市。


    02 这座体育中心包含一个田径场，其华丽程度足以让最顶尖的学校。他们甚至配备了泛光灯。


    03 足球场看起来如此真实，那因为团队确保使用了准确的比例。


    04 如此大面积的城市建筑可能会充斥着灰色，但团队仔细地添加了一些人工绿化。这对这个社区来说是一个非常真实的笔触。


    05 建筑内部对细节的关注令人惊叹。注意那些仔细铺设的路面标记。


    ![](img/111b.jpg)![](img/114.jpg)


    ⬢

    顶部 | 随着城市的增长，人口也随之增长。团队创建了几个不同的住宅区，里面满了可爱的家庭房屋。


    ⬢

    底部 | 佐山制作委员会甚至为他们的郊区构思了一个古怪的邻居。那栋设计风格与周围其他格格不入的房屋。


    这种多样性可能归功于有许多人在佐山城市共同工作，尽管在规划建造时存在等级之分。“我和其他关键成员一起起草了计划，”他们的代表解释道，“团队有五十多人，我们通过
    Discord 进行交流。”团队通过语音聊天和消息混合的方式进行工作，由于极少面对面会议，因为参与者来自日本的不同地区。这是在与不同的建造团队交流时反复提到的一点：沟通是成功协作的关键。确保你们不断向彼此更新信息，你们就会看到更好的结果。


    团队的计划通常可以总结为“表达日本城市的复杂性，并将其变形为 Minecraft 中可以创建的尺寸”。你能找到一种他们没能挤进这座建筑当的城市生活元素吗？电子广告牌、停车位、办公楼、似乎涵盖了你在日本能找到的每种建筑风格的摩天大楼。这仅仅是触毛一角，然而建造者仍然希望城市的范围能更广阔。如果他们今天才开始这项建造（请不要鼓励他们放弃八年的心血），他们认为这将基于“世界各地的城市，而不仅仅是日本”。想象一下看着这座建筑并认为它不够有野心，你就会开始了解那种有足够的决心从一开始就创建一个如此规模城市的心态。


    可以理解，大多数建造者都是从小开始并循序渐进。当然，这里有很多这样的例子，较小的建筑让较大的摩天大楼感觉像是一个活着的、呼吸着的城市的一部分。但佐山制作委员会显然不是那些甘于平庸的建造者。“观察你想做什么并实现它很重要，”他们说。你可能需要八年的空闲时间来实现你的愿景，但当结果将
    Minecraft 城市的标准提高到如此种程度时，八年又算什么？


    ![](img/115.jpg)


    ⬢

    左上角 | 这可能是大城市拥有过的最清澈的河流。宝石蓝的水流穿过佐山城市，在扩张的城市丛林中提供了一丝对自然的窥见。


    ⬢

    右上和底部 | 直升机停机坪和机械雕像。你能想象出有什么比这与现代城市景观更具代表性的吗？


    # 第十三章


    ## 繁华的中世纪城镇


    作者：Minecrafttalsi


    ![](img/MMB_fortified_town_fullbleed_2b.jpg)


    ### 材质包


    ◾ Conquest Reforged（来自 Conquest）


    ![](img/Windmill.jpg)


    到目前为止，Minecraft 中建造的中世纪城镇可能比现实中世纪时期还要多。这非常契合，因为 Minecraft 的世界一直有一种强烈的中世纪幻想美学，拥有木质和石质结构、略微原始的工具以及潜伏在黑暗中的可怕巨龙。难怪有许多建造者以该主题为核心并投入其中。像
    Minecrafttalsi 这样的建造者，这座“繁华中世纪城镇”的设计师，他专注于创作中世纪生活的小片段，每一段都是他多年来创作的大型幻想世界的一部分。“我想中世纪幻想设定正迷着我，对于一个中世纪幻想地图来说，还有什么比城镇和城堡更具标志性的呢？”


    Minecrafttalsi 在 2011 年早期发现了 Minecraft，当时游戏还处于测试阶段。“我当时正在浏览 YouTube，发现了一个关于一个新游戏的视频。我开始在生存模式下玩
    Beta 1.6 版本（那是唯一的可用模式），并且玩得很开心。”但 Minecrafttalsi 总是对 Minecraft 的建筑部分更感兴趣。一旦加入了创造模式，他就再也没有回头。“时光一转十年后，我制作了许多地图，并在游戏中投入了无数的小时。这仍然是释放我创造力的绝佳方式。我可能短期内不会离开！”


    在与 Minecraft 相处十年后，Minecrafttalsi 拥有了丰富的建筑作品集，包括如中海墓地和蓝鲸骨骼等各样的创作。没那么阴森的是，他制作了许多中世纪建筑，包括庄园、修道院，甚至还有马和车的设计。“从一开始开始，我的目标就是为他人创建一个可以下载和探索的某种
    RPG 世界，”他解释道。目标不仅仅是建造一个视觉上舒服的东西——他想创建一个让你在其中迷失的 Minecraft 幻想世界。


    并不是说他有这种风险，因为在开始正式建造之前，他会细致地规划他的作品。“我总是先规划最粗略的基础要素，”他在描述自己彻底的过程时说道。


    ![](img/121.jpg)


    ⬢

    左上和底部 | 木结构的房屋确定了城镇的时代。


    ⬢

    右下角 | 俯视图显示了躲在教堂后面的市场位。


    ![](img/122a.jpg)![](img/122b.jpg)


    ⬢

    Minecrafttalsi 发现了一些可以添加到他的城镇中的有趣细节，例如喷泉和木制摊位。


