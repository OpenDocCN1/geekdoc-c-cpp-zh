- fmt: '

    The build team wanted the first sight on entering the world to be one that was
    strong and inspiring. It became Kristin Bässe’s favorite element within the build.


    “I actually really love the statue of the fist and the pen at the beginning because
    this is what you see when you enter the island for the first time.”


    ![](images/Uncensored_library_cutout_7.jpg)


    There are some clever perspective tricks on display. One room appears to be full
    of random floating blocks. However, from a certain angle, it actually spells out
    the word “TRUTH.” “The idea with that was that a lot of the time in the countries
    that we’re considering here, you have to really work hard to find the truth through
    this state-controlled media, anti-truth, and fake news,” says James. It also rewards
    the player for engaging with the material in the library – you have to be standing
    next to the books to see the hidden message. “It was another way to draw the player
    to that location.”


    Reporters Without Borders has been pleased with the response to the library, and
    pleasantly surprised to get requests from schools and universities. “They wanted
    to use the library for their lectures or in their presentations or essays,” Kristin
    tells us. “The response from gamers was really positive, and even parents! We
    had a lot of tweets where parents wrote things like ‘I didn’t know that gaming
    could also be so valuable!’ The journalists that were involved in the campaign,
    I think, are happy that they can reach a different target audience than they usually
    do. That their texts are out there again, in this creative way that we chose to
    overcome censorship.”


    Kristin’s personal favorite part of the library is how it introduces itself. “I
    actually really love the statue of the fist and the pen at the beginning because
    this is what you see when you enter the island for the first time. I think it
    really expresses what we want to show. But then the library slowly builds up,
    because usually it has to render a little bit, so it’s really nice to have that
    moment of ‘oh, where is it?’ ” Then steadily, block by block, a sanctuary of free
    information opens up. A terrific resource that’s still being updated today.


    ![](images/Uncensored_library_fullbleed_17.jpg)


    # Chapter Sixteen


    ## Nova Celes City


    ### By Quantics Build


    ![](images/MMB_NovaCeles_fullbleed_9.jpg)![](images/MMB_NovaCeles_cutout_8.jpg)


    A lot can happen in a year. You can become one year older, for example. Or, to
    give a slightly more ambitious example, you can construct a futuristic city in
    `Minecraft` that’s gigantic in scope, has eight distinct districts, accessible
    interiors, and is drenched in detail to give it as much atmosphere as possible.
    Sounds like too much for one year? Well, that’s exactly what French builder Ariux
    and his team Quantics Build achieved with Nova Celes. They worked relentlessly
    on their hyper-detailed vision of the future to meet a strict deadline. One that
    wasn’t nearly far enough in the future.


    “We finished the map on the last day,” says Ariux. There’s cutting it fine and
    then there’s finishing a build on the very day you have to submit it. But that
    deadline couldn’t be moved. Nova Celes was made for City of Swagg, an event being
    hosted by YouTuber Aypierre. It couldn’t just be a spectacular-looking build –
    it had to function like a real city that `Minecraft` builders would be able to
    interact with, which meant a lot of the interiors of the city also had to be built.
    “It was very, very stressful because a hundred YouTubers were invited. So you
    couldn’t push the deadline.”


    Those YouTubers certainly had plenty to explore. Nova Celes is made up of a central
    city, surrounded by eight distinct quarters. These include a Chinatown quarter,
    one that’s a loving tribute to retro games, and even a “Biohazard” quarter. The
    original request had been for “just a big, big city, and we wanted to go for something
    set in the future because it’s one of our favorite styles of build.”


    The build team spent six months planning out Nova Celes. That’s half of their
    total allocated time to construct the city just preparing to build it. Not that
    this planning stage didn’t involve any blocks – just a lot of colorful placeholders.
    Then six months later “the whole team was mobilized to build all the buildings
    and do the interiors.”


    “It was very, very stressful because a hundred YouTubers were invited. So you
    couldn’t push the deadline.”


    ![](images/148a.jpg)


    ⬢


    The centerpiece of Nova Celes is made up of a towering white structure, plenty
    of green spaces and utopia-style apartment blocks topped with trees.


    ![](images/148b.jpg)


    ⬢


    Left | Each quarter is guarded by a giant statue and this warrior is over looking
    the Chinatown district.


    ⬢


    Right | Within the outer walls of their city, Quantics Build placed boats so you
    can imagine how citizens would travel from quarter to quarter.


    ![](images/MMB_NovaCeles_fullbleed_7.jpg)


    ## Tree-mendous


    Knowing when to delegate is one of the most important parts of leading a build
    team. Ariux is a talented builder, but knew when it was best to get involved in
    placing blocks and when it was best to take a backseat and let his team handle
    construction. Luckily, delegation gets a lot easier when you’re working with experts.
    “We had four builders who do the organic forms. They’re famous organic makers
    in France.” They also had two members who took care of the terraforming, and Ariux
    gives a special shout-out to the builder of the city’s many trees. “We have one
    tree maker, very famous, he’s a professional at building trees. We say ‘we want
    a tree like this’ and he makes it and it’s perfect.” The crafter of this foliage
    is French builder `Cobra63`, who includes in his Twitter bio “Make trees when
    I’m bored, so…all the time.”


    ![](images/152a.jpg)


    ⬢


    Quantics Build filled the base of the aquatic quarter with water and placed huge
    shells atop buildings.


    ![](images/152b.jpg)


    ⬢


    The base of the giant tree building demonstrates how Quantics Build created such
    an organic shape for their imposing tower. No pressure. Wait, hang on – all the
    pressure. With that deadline just six months away, Quantics Build crunched hard.
    Even the center of the build, the heart of the city that all other quarters surround,
    was finished in just two weeks. “It was a huge challenge. We were fifteen people
    and we had to make the center, the middle part, with that big white building and
    lots of vegetation. It was very complicated.”


    Can Ariux believe he managed to pull off Nova Celes’s centerpiece in a mere fourteen
    days? “Actually, I don’t know how we made it! That was a huge challenge. I think
    the most complicated part to make is the ambience.”


    That enthusiasm bleeds into their builds – no one could look at Nova Celes and
    consider it the work of people who don’t care for `Minecraft` – but sometimes
    reining in the team’s enthusiasm is one of the most necessary evils of Ariux’s
    role. “My favorite quarter is the Chinatown quarter. It was our first one. We
    were stupid because we took a lot of time on it. We made everything. It’s very
    dense. Lots of buildings. A lot of ambience, a lot of restaurants…it’s very, very,
    very huge!”

