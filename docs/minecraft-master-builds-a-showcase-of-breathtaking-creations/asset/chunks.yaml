    在细节、平衡和美学方面，我觉得它们还没有达到其他作品的水平。我可能会建造更多的房子，而不是更宏大的纪念碑。当你想要做一些令人印象深刻的事情时，建造宫殿比建造房子更有动力。但这在城市里实际上是完全不切实际的，那里很少有房子、街道或商店。”而大多数人看到这座城市时会被其宏伟的规模所震撼，但
    Rigolo 关注的是你应该去哪里买牛奶。


    Rigolo 是如何决定什么时候宣布城市完工并停止建造的？“我没法告诉你！我们并没有决定停止。而且，事实上，它一直处于未完成状态。在某个时刻，我们转向了其他事情。我猜每个人都喜欢有这样一个小私人项目。”在大约十八个月后，Rigolo
    停止了玩 `Minecraft` 并认为这座城市尚未完工。但没有哪座城市是真正完成的，即使在现实世界也是如此，他留下的作品证明了两个厌倦了乐高积木用完的兄弟能成就的规模和技巧。


    # 第五章


    ## 地球天空

    作者 `natsu3012`


    ![](img/MMB_Earthsky_fullbleed_21.jpg)![](img/MMB_Earthsky_cutout_3.jpg)


    任何在人口稠集的城市住过这种不幸经历的人都会把“地球天空”（Earthsky）视为另一个家，因为它如此成功地捕捉到了城市丛林的混乱。然而，这种混乱完美契合了建造者的口味。以
    `natsu3012` 为名进行创作的法国建筑学生 Ambroise Guenole 无法停下，塞入更多的细节、结构、方块、野心、希望、梦想，可能自从你开始读到这里起又增加了五十种东西。


    在他们的学习中，`natsu3012` 喜欢预测未来的城市会是什么样子。“对于一个对所有人都有益的乌托邦愿景，我们想象了一个自然城市，拥有密集的公共交通网络、高层建筑以及作为公共空间的屋顶。在我的创意和审美想象中，我希望未来的城市看起来像我的作品，即使它们在现实中是无法居住的。毕竟这是一个相当自私的梦想。取决于人类选择的道路，两种情况都是可能的：一座科技城市或一个巨大的贫民窟。”


    这位建造者的热情极具感染力，他们实际上可以向你推销末日景象。“我非常喜欢末日未来的氛围。而 `Minecraft` 非常适合这种宇宙观的实现。”然而，对于这个未来愿景，`natsu3012`
    计划了不同的东西。“我想在一种漂浮的基座上建造一堆建筑。”这解释了建筑标题中“天空（sky）”的部分。这是一个脱离地面的逻辑跳跃——当地球上没有更多空间建造建筑时，人们将不可避免地开始向天空寻找一个放置他们房地产的地方。


    “取决于人类选择的道路，两种情况都是可能的：一座科技城市或一个巨大的贫民窟。”


    ![](img/MMB_Earthsky_isometric_1.jpg)


    ⬢ 一座挤满了摩天大楼的漂浮大都市——想象一下顶部的景色吧！


    ![](img/MMB_Earthsky_fullbleed_25.jpg)![](img/43.jpg)


    ## 摩天大楼


    `Natsu3012` 花了大约一个半的时间建造了地球天空，感谢 `Minecraft: Java Edition` 插件 `WorldEdit` 帮助他们节省了大量时间。至于这座城市的名字，他们“必须在主全息投影上显示一些东西”，赋予城市一种冷冷的、蓝色的未来细节。“这个名字源于项目的意图。一座天空中的城市。一片人们聚集、建筑向云霄生长的新土地。”人们聚集？也许最好只关注“建筑向云霄生长”这部分就够了！


    `Natsu3012` 发现，他们的建筑学习对于规划这种高远的设计大很有帮助。“我知道如何构思一个项目、开发它，并想象不同比例下的空间。”当你的结构中很大一部分通向天空时，这绝对是一项有用的技能。他们还可以接触“一套丰富的[建筑]知识库，我乐于将它们翻译成‘Minecraft
    语言’。”


    在描述城市扩建过程的开端时，他们乐意提供建筑语言的例子。“我从定义一个‘样本’社区开始，在其中我开发我的结构原则。然后我在更全球的尺度上使用中性体量来构成整个项目。”对于我们这些听不懂建筑师语言的人来说，中性体量是指“像立方体这样的简单形状。这是一种我之后会重新处理的基本形式。我会详细地重新处理每个区域，以便它们与样本区保持一致。”这是一个聪明的办法——打造一个细小、详细的部分，这样当你提醒自己在美学上追求的是什么样的城市时，你总有可以可以回溯的东西。


    另一个聪明的方法是 `natsu3012` 对颜色的创意运用。“我并不按照 `Mojang` 预想的方式使用方块。我根据它们的颜色或纹理来使用它们。例如，我不用泥土做地面，而是用它来做墙。我使用了许多不同的方块。`TNT`、`青金石矿`……我特别喜欢的一种方块是菌丝，我经常使用它。”这个过程创造了一个色彩悦目的城市。“目标是拆解建筑的元素。展现它的质性、它的结构，玩弄它的渐变，并模拟时间的影响——例如，稳步劣化的油漆——以强化光影的效果。亮亮应该是亮的地方，黑暗应该是黑暗的地方。”


    ![](img/44.jpg)


    ⬢ 没有太阳光，地球天空从内部光亮。`natsu3012` 添加了灯光以增强城市氛围。


    “在大规模尺度上建造。我建议首先要有一个非常简单的基础。要理解简单并不是缺陷，它能提供更好的视觉效果。”


    `Natsu3012` 在建造早期阶段还使用了一种流行的建筑技巧。他们用彩色羊毛方块制作大型结构，然后将它们替换为他们想要的方块。这是一种“更好地看到你要做什么”的聪明方法，因为使用占位方块可以组合建筑或其他结构的形状。这引出了一个问题：你更倾向于住在由羊毛还是泥土墙成的房子里？


    在建筑设计方面，`natsu3012` 对各种风格感兴趣。“我喜欢制作没有伟大野心的小型建筑。具有多种文化灵感的小型房屋或其他[项目]，同时努力提高我的技术。在小尺度上创作非常有成就感。但地球天空代表了我最喜欢在游戏游戏中做的事情——巨大的、未来感的且带有反乌托邦色彩的城市。这是我喜欢的氛围。”


    这座巨型城市还没有达到 `natsu3012` 理想中野心的三分之一。“今天如果我做一个类似的项目，我想建筑数量会翻倍甚至三倍，到处都是道路，以真正营造出聚集的印象。我的纹理处理技术有了提高，所以我认为在那方面会有巨大的改进。”在尝试将这座城市扩大四倍之前，快去修改
    `natsu3012` 的 Minecraft 密码吧！


    ![](img/47.jpg)


    ⬢ 正视图提供了左上角道路的更多细节。


    ![](img/48a.jpg)


    ⬢ `natsu3012` 为他们的城市顶部设计了一个巨大的数字广告牌。


    ![](img/48b.jpg)


    ⬢ 从左到右 | 屋顶花园是现代建筑中流行的特征，有助于打破这座都市的单调；`natsu3012` 为他们的未来建筑增添了色彩墙壁。


