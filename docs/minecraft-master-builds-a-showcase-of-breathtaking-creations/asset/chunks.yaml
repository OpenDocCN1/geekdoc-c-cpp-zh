    摧毁真实的月球可能比组装这个“月球毁灭”建筑容易得多。当被问及建造中最困难的部分是什么时，这对组合基本上表示是所有部分。“每一个部分都有不同的挑战，而且几乎每个地方都需要等程度的注意力，”Maggie
    说道。然而，特别关注被放在了主导场景的飞船上。“我们投入了额外的精力制作它。因为尺寸巨大，所以花了很长时间。此外，我们还需要确保细节与飞船的形状完美融合，并且构图不会因为月球和宇航员而显得过于拥挤。”因此，他们必须在建造一艘巨大飞船的同时，时刻记住它不要抢夺场景其他部分的视觉。现在，宇航员没有绝望地抱头，这显得更加令人印象深刻。


    空间无尽的黑色背景可能会损害你的比例感。毕竟，只有当画面中出现一个微小的行星时，死星看起来才具有威胁性，这有助于彰显那艘致命飞船的恐怖威力。Maggie 和
    Arkha 通过两种方式实现了这一点：一种让宇航员站在飞船外（为这个可能变得过于冰冷和机械的建筑增添了良好的人情味），另一种是在比例和细节上都下大功夫。飞船覆盖着独特的图案、技术装置、窗户、雷达天线等，一切都在一个统一的设计中。它是一艘通往星际的容器，具有极强的体量感。


    “这是一种非常灵活的方法。它一直在变化……最后最后我得到了一些东西。一些在开始时完全失控的东西！”


    “我们研究了电影《星际穿越》中的场景，”Maggie 解释道，这是这对组合为他们的飞船所做的研究。“我们寻找了火箭和空间站的图像，以便很好掌握空间环境。”至于积木，他们寻找了具有“蓝灰色调”的方块，如青色粘陶土、石块和浅灰色混凝土，并用黄色方块做条纹，黑色方块标记门。对于这样一个庞大的机器建筑来说，这个调色板可能看起来很小，但它让他们的构造看起来既整洁又内敛，就像它所代表的尖端技术一样。特别是与飞船正在运行的、刻意混乱的陨石撞击形成对比。


    ![](img/MMB_Moondestruction_fullbleed_4.jpg)


    ⬢


    ⬢宇航员为场景提供了比例感。


    你可以从火焰中最清楚地看到这种对比。陨石撞击产生的火焰是黄色和橙色的尖锐角度，在黑色的太空中格外醒目。而飞船引擎喷出的火焰使用了蓝色和白色的火焰，边缘圆润，暗示着一种在太空中受控的旅行。


    “我们寻找纹理与我们尝试重建的对象原始材料尽可能接近方块，”Maggie 解释道。“对于宇航服，我们使用了白色羊毛、石英——因为我们的宇航服参考是白色的。我们还使用石块作为设备细节的材料。”NASA
    可能不会批准一件由石头制成的宇航服，但在这里它看起来确实像一回事。再次，小范围的颜色选择是一个刻意的决定，有助于衣服看起来像实物。隐藏宇航员脸脸的深色面罩也为建筑增添了神秘感，这意味着他们不需要担心方块化的人头重塑——这在
    `Minecraft` 中总是很难复制——会破坏建筑的真实氛围。


    但一旦你完成了外太空的任务，你还会大胆地向何方去？在通过 `Minecraft` 发现对建筑的热爱后，Maggie 继续学习了建筑学。毕业后，她现在任于 `Rewrite
    Media`，为 `Minecraft: Education Edition` 制作内容。“`Minecraft` 造就今天的我，”她说。Arkha 也有类似的故事——他现在领导
    `MIVUBI`，这是一个帮助开发印尼西亚 `Minecraft` 社区的团队。“我们成功地将 `Minecraft` 作为展示艺术品的媒介，并与印尼的艺术基金会
    `Jogja Biennale` 合作，”他说。通过团队合作扩展 `Minecraft` 功能的可能。看来，突破高度限制和探索外太空只是这对创新双人雄心的开始……


    ## 额外建筑


    ### 神之圣所与苦力怕仔朋克风


    ![](img/98.jpg)


    #### 神之圣所


    Archanee 和 `AutomailED` 创建了这个场景作为农历新年的庆祝。它包含了中国的四大守护神：青龙、白虎（原文误译为白白豹）、朱雀和玄武。在中国神话中，这些守护神分别守护着世界的四个方向——北、南、东、西——但
    Archanee 和 `AutomailED` 将守护神放在了不同的区域，给人一种他们正在移动的印象。


    ![](img/Rendered_by_AutomailED_Night_1_.jpg)


    #### 苦力怕仔朋克


    这座赛朋克城市是 Archanee 和 `AutomailED` 尝试想象未来时设计的。正如你所预期的：摩天大楼、巨大的全息投影、传送门和甜圈店。一旦这对确定了他们想要的设计，他们花了四个月完成建造。他们巧妙地利用了城市内的灯光，因为没有大量霓虹灯的未来大都市算什么呢？夜晚观看时尤为印象深刻，因为广告牌和全息投影为城市带来了戏剧性的氛围。


    ![](img/Rendered_by_AutomailED_Daytime_2_.jpg)


    ## 第十一章


    ### 毅之庙


    作者：Sander Poelmans


    ![](img/MMB_TempleOfFortitude_fullbleed_4.jpg)![](img/MMB_TempleOfFortitude_cutout_2.jpg)


    勇气（Fortitude），在逆境中表现勇敢，是你能拥最有价值的特质之一。因此，一个名为“毅之庙”的建筑引人注目。这个名字指的是什么吗？在水中建造毕竟是非常勇敢的。也许它指的是它的建造者，一个展示了壮丽勇气的人？“诚实地说，我起这个名字只是因为它听起来很酷，”毅之庙的建造者
    Sander Poelmans 解释道。事实如此。


    Sander 对建筑有一个有趣的规划阶段——在找到灵感之前，他不想在建筑上放置一个方块。“对于这座庙，我深受一位名为 Mari K 的伟大像素艺术家的启发。”这是一个有些不幸的灵感来源，因为
    Sander 震撼的特定 Mari K 作品包含了蓝色圆顶屋顶和细长的矩形窗户。圆顶确实是 `Minecraft`（一个由于热爱方形且只有一种默认窗户的游戏）中最难复制的元素之一。Sander
    不得放弃他的梦想建筑。或者那会是背景故事？“当我找到灵感后，我会开始放置最大的形状，以便很好掌握建筑的整体形状和构图。一旦对形状满意，我会开始放置屋顶和塔楼。最后我开始放置窗户、树和其他细节和纹理。”Sander
    让这些步骤听起来很简单，但这是一个详尽的过程，包含了一些其他的外部影响。“我并没有真的为这座庙研究过真实的寺庙，但我确实利用了其他的参考。这座建筑使用了真实和虚构风格的混合。塔楼受到拜占庭建筑的启发，而较平坦的屋顶受到地中海建筑的启发。但大部分都是根据感觉制作的！”


    ![](img/MMB_TempleOfFortitude_fullbleed_1.jpg)![](img/99.jpg)


    ⬢


    ⬢ 庙的不同层级像一个巨大的时尚的楼梯一样合在一起。


    ![](img/MMB_TempleOfFortitude_fullbleed_11.jpg)


    ⬢


