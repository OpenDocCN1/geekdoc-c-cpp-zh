    # Foreword


    _


    One of the most amazing things about Minecraft is how we can all share our creations,
    be inspired by each other, and learn.


    I never considered myself a builder, not like those other people – like the people
    who build the kind of creations you will find in this book. I felt like they had
    something special that I was missing. I’ve spent many hours watching players build
    amazing things and looking at the details of their creations to figure out just
    how they could make something look so good. After all, we all use the same blocks,
    so in every creation there is an opportunity to discover a new style or technique.


    I kept building, taking on larger projects and making videos about them, even
    joining the Minecraft development team. Despite this, there was never a single
    point where I felt like I had become a builder – there was always so much left
    to learn! Over time I’ve come to realize that there is no bar to clear. We can
    all build and with the boundless imagination of the Minecraft community there
    is always something new to be inspired by.


    Whether you are looking for amazing creations to marvel at purely for their aesthetics
    or inspiration for the next project in your world, I am sure you will find something
    in this book. With every player’s unique background there is always a new perspective
    leading to another amazing project.


    We are all builders.


    Mikael “slicedlime” Hedberg


    *Minecraft tech lead and content creator*


    # Chapter One


    ## Aman, The Immortal Lands


    By Iskillia


    ![](images/MMB_aman_fullbleed_17.jpg)![](images/MMB_aman_cutout_2.jpg)


    Iskillia’s main piece of advice to builders is, “You have to finish it,” and he
    believes it’s the secret to his success. “I really take the time but I also finish
    the things I begin. That’s something I force myself to do. You have to finish
    it!” says the French builder, talented renderer, and architect of these Immortal
    Lands.


    After eighteen months of painstaking crafting, Iskillia proved his word by finishing
    the vast wonder Aman, the sum of many eclectic influences. Minas Tirith, the imposing
    city from Peter Jackson’s *Lord of the Rings* movies is a staggering feat of production
    design that clearly influenced the way Aman’s statue and citadel manage to look
    as intimidating as they do beautiful. The vegetation is inspired by the gorgeous
    green vineyards of the south of France, which Iskillia is lucky enough to live
    near. The influence of the slightly soggy (but magnificent) city of Atlantis can
    be seen in the use of aquatic colors and grand scale, while the eighth-century
    Round City of Baghdad, with its unique circular design, inspired the shape of
    the citadel.


    “When I found Minecraft, I was like ‘OK, this is incredible.’ I was always a creative
    person…I liked the game because of the possibilities, the freedom that it offered.”


    Considering the wide variety of influences – not to mention all the other games,
    architects, fellow Minecraft builders, and much more that inspired Iskillia –
    it’s amazing that his city of Aman (the name is another Tolkien nod: a reference
    to the continent to the west of Middle Earth) isn’t an incoherent mess. Instead,
    its disparate parts flow flawlessly into a whole. From the red spires – designed
    to resemble flames – that twist around its landscapes to the enormous white-and-gold
    statue, worryingly close to slamming its horned head against the `256`-block height
    limit of version `1.12`.


    Iskillia discovered the game nine years ago when he was still in high school.
    “When I found Minecraft, I was like ‘OK, this is incredible.’ I was always a creative
    person. I always played with things.” The imaginative young builder loved to spend
    his time creating something new, whether an environment or a universe. So, even
    before Minecraft, he desired to build something big. He just needed to find the
    right tool to let him realize his ambitions. “I liked the game because of the
    possibilities, the freedom that it offered.”


    ![](images/7a.jpg)


    ⬢


    Iskillia’s central sculpture was inspired by eighth-century Baghdad.


    ![](images/7b.jpg)


    ⬢


    Left | The lush green of the vegetation and the flaming red spires are a dramatic
    backdrop for the pale buildings.


    ⬢


    Right | The green serpentine bridge borrows its design from mythical creatures
    like a sea dragon or the Loch Ness Monster.


    ![](images/MMB_aman_fullbleed_9.jpg)![](images/MMB_aman_fullbleed_11.jpg)


    ### Golden God


    You’ll find this striking statue towering over the sanctuary part of the city.
    Iskill was inspired by Egyptian gods, which often have an animal head and a human
    body, but he crafted an imaginary deity to make the connection less explicit.
    Though it looks like a stone statue, it’s actually mainly made from birch wood
    blocks, which Iskillia realized would have a `sandstone or limestone` appearance
    at this scale. “The goal was to resemble an old stone monument, like the pyramids
    of Giza.”


    As for that outfit, Iskillia turned to the ancient divinities from Greece and
    Egypt – who weren’t known for wearing a lot of clothes – for his fashion research.
    “I also added the flags in the back because it was interesting in terms of design
    shapes and composition.”


    After spending some time playing with friends, Iskillia entered the online Minecraft
    community, joining several French build teams. “I ended up in NewHeaven, where
    I’m a manager now.” Looking at NewHeaven’s portfolio, the grand cities and imaginative
    statues have a familiar flavor. Iskillia is also well-known in the Minecraft community
    for his rendering skills, a service he’s offered to many builders. These rendering
    skills would be vital for getting an overview of his own city midway through its
    construction, but that’s jumping ahead of the story.

