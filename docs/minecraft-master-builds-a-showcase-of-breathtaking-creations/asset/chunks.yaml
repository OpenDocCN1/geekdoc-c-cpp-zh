    Arkha 建议与其他玩家建立联系。“我认为 `Minecraft` 社区是世界上最活跃、规模最大的游戏社区之一。我们可以分享我们的地图、纹理包、皮肤以及
    `Minecraft` 的技巧和技巧。我通过 `Minecraft` 结了许多人，包括我最好的朋友以及 `Minecraft` 项目的伙伴。”


    ## 05 选择调色板


    “这是为期一两周规划过程的一部分，”Thomas Sulikowski 解释道，“我们会进入一个 `Minecraft` 世界，开始放置我们认为颜色组合好看的方块。对于较小的项目，这些可以是
    20 到 25 个方块；对于较大的项目，可以达到一百多个方块。对于 `Aqua Princess`，我们真的很想添加这些点缀色彩，因为我们得到的参考图非常鲜艳。那些颜色非常强烈，视觉冲击力。我们想在
    `Minecraft` 中模仿那种效果，所以我们想确保选择了正确的方块。”


    ## 06 模组是你的好朋友


    `Conquest Reforged` —— `Minecrafttalsi` 用它制作了华丽的中世纪镇 —— 是受欢迎的 `Minecraft` 模组之一，这并不难理解。它拥有超过
    12,000 个方块、额外的纹理、粒子效果等等，特别受到历史和奇幻建筑者的喜爱。可能是因为那个阴暗的中世纪时代（据传在那个时代你甚至无法下载 `Minecraft`）——通过
    `Conquest Reforged` 卓越工具集提供的“玫瑰色滤镜”——看起来要迷人得多。


    ![](img/73a.jpg)

    ⬢ 这是 `Zeemo` 拍摄的未来城市俯视图，他喜欢提前规划他的建筑。


    ![](img/73b.jpg)

    ⬢ 为了创造爆炸的月球，`Maggie Gondo Wardoyo` 和 `Arkha Satya Taruna` 使用了 `WorldEdit`。


    ![](img/73c.jpg)

    ⬢ `Varuna` 发现 `VoxelSniper` 帮助创建了看起来真实的有机物，例如 `Agnoia Frieden` 中美丽的雕像脸。


    ![](img/73d.jpg)

    ⬢ `Arkha` 和 `Maggie` 的赛博城市庆祝了人类的未来，这是坚信社区的建筑师们创作的合适场景。


    ![](img/73e.jpg)

    ⬢ `Varuna` 建议在建筑前选择方块，这样你就能找到跳出的调色板，比如他们鲜艳的蓝唐。


    ![](img/73f.jpg)

    ⬢ `Minecrafttalsi` 发现 `Conquest Reforged` 为他庞大的中世纪世界提供了很好的工具。


    # 第九章：海洋日记


    作者：`Junghan Kim`


    ![](img/MMB_seadiary_fullbleed_13.jpg)![](img/MMB_seadiary_cutout_3.jpg)


    除非你在眼睛上贴两个万花筒去水族馆，否则你很难看到比《海洋日记》更色彩丰富的的水下生活描绘了。这是一个包含了丰富的水生生物、神秘神庙以及 `Minecraft`
    所提供的几乎每种色彩的集合。这足以让你怀疑自己起初何必费力住在陆地上？为了住在如此美丽的地方，呼吸空气难道不是很小的代价吗？


    令人惊讶的是，《海洋日记》最初根本没打算设计一个海洋建筑。它的建筑师 `Junghan Kim` 开始这个项目时是想创造一些简单东西。“我想要建造一些在过去可能存在的东西，比如阿兹特文明。”作为一个起点，阿兹特建筑非常适合
    `Minecraft`，它有那种块状的金字塔和宏大的规模。`Junghan` 的设计随后发展成了我们看到的充满活力的新古典主义定居点。


    “它之所以出现在海，是因为我想随着时间的推移，旧文明一定发生了地形变化。我知道海平面正在变化。”`Junghan` 并没有去研究那些实际的地形变化，而是突然灵感采取了一种更具推测性的方法。一个完全被海洋吞噬的文明会变成什么样？


    最初，`Junghan` 想建造一个处于浅水中的城市，以营造出这些精美神庙正在缓慢入海的印象。这是一个有趣的假设，在 `Minecraft` 中描绘它无疑具有挑战性。但
    `Junghan` 改变了主意，最终决定将整个建筑淹没。阻止他的并不是挑战——深海提供的谜团简直更令他着迷。“我对深海感兴趣，是因为我们永远不知道那里发生了什么。它很可怕但很有趣。所以我想创作一个探索这个主题的作品。”


    ![](img/80a.jpg)

    ⬢ 这个俯视图引起了对 `Junghan Kim` 使用调色板的关注。海底彩虹！


    ![](img/80b.jpg)

    ⬢ `Junghan` 设计了水下植物爬在阿兹特纪念碑上。好奇的潜水员可以发现的深海生物。


    “我对深海感兴趣，是因为我们永远不知道那里发生了什么。它很可怕但很有趣。所以我想创作一个探索这个主题的作品。”


    ![](img/MMB_seadiary_fullbleed_14.jpg)

    ⬢ 谁想住在橙色的潜水艇里？


    “一切主要都是通过创意而非研究产生的；我更多地思考如何让它看起来更好。”


    那里还有什么没有发生呢？`Junghan` 似乎对空白空间过敏，他在他的建筑中塞了尽可能多的海洋生物、神庙、植物，甚至是气泡（这是一个增强水下感的绝妙之笔）。“可怕但很有趣”可能看起来不是一个显而易见的设计理念，考虑到让
    `Junghan` 的海洋看起来如此迷人的华丽调色板，但你不需要探索多久就能发现更阴暗的细节，比如一只长着不幸同样巨大牙齿的巨鲨。游进它的嘴里（去吧，你可能没事的），你会发现几条鱼在变成鲨鱼晚餐的瞬间被冻结了。`Junghan`
    查询了真实鱼的形状、大小和生态系统来帮助制作这些生物，但现实主义从未是首位。


    现实世界的灵感会有帮助，但 `Junghan` 受其他作品的影响更大。“我见过其他艺术家的海洋作品。最令人深刻的地图是 `Blockworks` 的《深海》。”《深海》描绘了一个水下实验室，与《海洋日记》相比，它的色调明显更加暗淡、寒冷。它确实符合
    `Junghan` “可怕但很有趣”的标准。在将《深海》描述为“一个非常完美的安排”时，`Junghan` 在制作自己的地图时经常提到它。他并没有尝试重现另一个建筑团队的作品，而是钦佩它，并利用他们建造的内容作为自己处理海洋方法的基础。在这种情况下，这是一个横跨在黑暗深海中的复杂结构，充满了待探索的生命。


    ![](img/MMB_seadiary_fullbleed_7.jpg)

    ⬢ 黄色和橙色的点缀让城市的深色部分脱颖而出。


    `Junghan` 很快赞美其他建筑师，但他对自己的建筑能力并不总是那么乐于赞美。“当我开始这项工作时，真的认为自己缺乏建筑技巧。我的很多朋友都非常擅长建筑，我真的觉得和他们相比很落后。”现在看到他完成的作品时，对这种说法很容易嗤之以鼻，但遗憾，负面地与他人比较是一个非常让你丧失建筑动力的方法。坦率地说，与其放弃，`Junghan`
    向自己做了一个承诺，坚持完成《海洋日记》。


    这一直不是一个容易遵守的承诺。“花费大量时间独自制作每一个高细节、高品质的作品真的很难。我实际上尝试改变过几次故事和主题。它们会根据我当时的心情和感受而改变，迫使我花费许多小时编辑建筑和地形。”


    '
- fmt: '

    The frustrations of endlessly adjusting a build of this scale, however, eventually
    gave Junghan the theme and story he’d stick to. “At some point I thought all of
    the moments I spent building this map could be the story itself, and this thought
    led me to create the ‘sea diary.’” See, the titular diary isn’t a book full of
    personal secrets that someone’s unfortunately dropped in the ocean. The build
    actually is a diary. Junghan considers different parts of this underwater scene
    to be reflections of where he was emotionally when putting them together. It’s
    an ambiguous narrative open to interpretation as you swim through it and explore.
    What was Junghan feeling when he crafted that wild-eyed shark?


    When Junghan shared The Sea Diary online – a risky move, as it was technically
    his diary – the community immediately praised it for the attention to detail and
    fresh approach to what a Minecraft ocean could be. Delightfully, it’s praise that
    seems to have sunk in. “Through this work, I think I recovered my self-esteem
    and confidence a lot. More importantly, I’m proud that I wanted to do this and
    I kept my promise with myself by completing it. I completed this because I wanted
    to do it. That’s the happiest thing.” It took over three years of crafting, but
    now Junghan is left with an outstanding build, renewed confidence, and a diary
    that’s essential reading.


    ![](images/85.jpg)


    ⬢

    Top and Bottom Right | An enormous shark swoops down on the unsuspecting school
    of fish.


    ⬢

    Bottom Left | Zebra fish are one of the many types of sea creature that Junghan
    has carefully recreated.


    ![](images/88.jpg)


    ## Worth Sea-ing


    When he was developing The Sea Diary, Junghan worked with two skilled artists,
    `LNeoX` and `LordKingCrown`. Their original renders of the build were essential
    in helping him find an audience. “A good render brings the build to life,” `LNeoX`
    says. “It captures a certain perspective that should be seen by the viewer. With
    big builds it is impossible to catch the size and atmosphere in-game. This is
    where renders become really important.”


    “Just like with any book or movie, if the trailer or cover art does not look interesting,
    people will not care about it,” explains `LordKingCrown`, on the importance of
    a good render. “Some builds look really good in default Minecraft, but with a
    render, you can really see all of the details. You can help create the vision
    the original builder had.” A good render can’t make a bad Minecraft build look
    pretty, but a great render can make a beautiful Minecraft build reach new heights!
    Or in this case, new depths.


    ![](images/89.jpg)


    ⬢

    As well as sea creatures, Junghan crafted underwater vehicles for his imaginary
    citizens to travel in.


    “I’m proud that I wanted to do this and I kept my promise with myself by completing
    it. I completed this because I wanted to do it. That’s the happiest thing.”


    ![](images/MMB_seadiary_isometric_1.jpg)


    ## Something Fishy


    You’ll find twenty-eight different types of fish in The Sea Diary, including a
    school of honey block-based creatures that are no doubt as delicious as they are
    adorable. Junghan used glass panes to create the impression of a tail that gradually
    fades out. A honey block with two buttons for eyes proves that sometimes the simplest
    ideas are the most effective. Junghan has made a glowstone block the “body” of
    this fish, ensuring the depths of his build are full of light sources, even without
    renders. His build embodies Minecraft as an interactive medium; it’s a beautiful
    subject for screenshots but is also fun to explore. After a few minutes of swimming
    around their home, you’ll envy these fantastic fish! Well, except maybe the ones
    in the shark’s jaws.


    ## Chapter Ten


    ### Moon Destruction, Front-Line in Space


    By Maggie Gondo Wardoyo & Arkha Satya Taruna


    ![](images/MMB_Moondestruction_fullbleed_11.jpg)![](images/MMB_Moondestruction_cutout_2.jpg)


    Is there anything in Minecraft more gleefully disrespected by the building community
    than the height limit? When Moon Destruction was created, builders weren’t supposed
    to exceed 256 blocks, but space-loving crafters couldn’t care less about such
    earthbound limitations. They’ve happily shot for the stars. After all, what could
    possibly go wrong?


    Well, quite a lot, according to the disaster depicted in Moon Destruction, Front-Line
    in Space. It’s essentially three builds in one: the ship would look impressive
    in any space game, never mind a crafting one that is mostly based on firm ground;
    the lone astronaut, tenuously tethered to the spaceship, who deserves a commendation
    for staying cool in a crisis; and a not-so-friendly-looking meteor strike. The
    build depicts the kind of accident that actual astronauts probably lose sleep
    about, and according to co-builders Maggie Gondo Wardoyo and Arkha Satya Taruna,
    that part of the build actually was an accident.


    “I copied a part of the moon’s surface a bit too deep with `WorldEdit`,” explains
    Maggie, on how that explosion came to be. “Arkha was better at making shapes.
    He had an idea to change the surface into a destroyed part with meteors hitting
    it.”


    Both hailing from Indonesia, Maggie and Arkha are a building duo that have gone
    on to have separate careers with Minecraft, even though Maggie wasn’t completely
    sold on the building game at first. “To be honest, I thought Minecraft wasn’t
    a good game because of the graphics – please don’t feel offended – now I don’t
    think so at all!” Even with that perception, it didn’t stop her and Arkha from
    building something truly magnificent.


    Looks aside, it was the game’s potential and variety that sold her on eventually.
    “You can do anything here, from building, programming, playing minigames, or just
    surviving. This is why I think Minecraft is more than just a game. It’s also a
    medium to deliver messages through art.” “The game is like a canvas for me,” says
    Arkha, also a big fan of Minecraft. “I can do anything and create anything that
    I can’t do in the real world.” True, but crafting an entire moon isn’t an easy
    thing to create in Minecraft either. “We made the moon entirely in-game and it
    took a lot of time because it’s so big,” says Maggie. The sheer scale meant they
    couldn’t even get a full view of the moon while they were building it. “We had
    to keep guessing when building it looked decent enough!” she says. Despite those
    limitations, their final sphere of carefully constructed craters culminated in
    a moon that ranks a few higher than “decent enough.” Still, it’s nice to know
    that when these builders left for space, they kept their egos on the ground.


    ![](images/91.jpg)


    ⬢

    Maggie and Arkha wanted their ship to be packed with realistic details, such as
    radar dishes, windows, and industrial-looking tech.


    ![](images/91b.jpg)


    ⬢

    Left | An impressive explosion.


    ⬢

    Right | The front perspective provides a stark contrast in color palettes, from
    the warm hues of the fire to the cold shades of the ship.


    ![](images/MMB_Moondestruction_fullbleed_13.jpg)


    ## Star Stories


    After Maggie Gondo Wardoyo’s accident in `WorldEdit` left a crater in their moon,
    the duo needed to come up with a new scenario for their build. “We got the idea
    that the moon was hit by a meteorite and it affected life on Earth. Therefore,
    they sent some people to the moon to see and analyze what was really happening.”
    Probably a good thing that you famously can’t hear screaming in space, as they’re
    in for one hell of a shock.


    ![](images/MMB_Moondestruction_cutout_3.jpg)


    ⬢

    A friendly astronaut, whose space suit was influenced by the movie *Interstellar*.


    ![](images/MMB_Moondestruction_fullbleed_9.jpg)


    ⬢

    Maggie and Arkha utilized shape language in their flame designs to help distinguish
    between the controlled thrust of the ship and the chaotic fires of the moon explosion.

