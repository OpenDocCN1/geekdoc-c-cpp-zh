    that replacing FP with FP-($\Delta$) in MIP solvers could be beneficial, for solvers
    that use FP only for a few iterations.


    # 7.3. Final embedded setting


    In the embedded setting with mREENS and the alternative objective scaling provide
    a significant performance improvement, we incorporate both in FP and make a final
    comparison. We observe in an offline experiment that multiple reference vectors
    are not beneficial in this scenario. As we will see in the following subsection,
    multiple reference vectors tend to increase the iteration count, which is inferior
    in a setup with a strict iteration limit.


    In Table 3 we compare FP-($s3$) with the combination of FP-($\Delta$,$\Delta$)
    and FP-($mREENS,$s3$). Here FP-($\Delta$,$\Delta$)-($mREENS,$s3$) undoubtedly
    outperforms FP-($s3$). It provides a 29.3% gap decrease over instances solved
    by at least one of the algorithms, and a 4.0% decrease in running time requires
    16.0 fewer iterations.


    # 7.4. Standalone results


    As has been shown in the thesis of Mexi [10], the new scaling and the use of multiple
    reference vectors in Stages 1 and 2 enhance the performance of a standalone FP
    implementation in a complementary way. In particular, the new scaling mostly lead
    to an improvement in running time and iterations, whereas using multiple reference
    vectors in the projection step improves the solution quality. Based on this, it
    seems natural to compare combinations of different FP variants in a standalone
    setting.'
