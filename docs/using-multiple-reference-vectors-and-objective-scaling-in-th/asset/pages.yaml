  md: "# 7. Computational results\n\nFor our comparisons, we used the so-called geometric\
    \ mean [26], with a shift of 1. All FP variants are extended over the whole set\
    \ with the same random seeds. In our tables, we always report the number of instances\
    \ for which an FP variant finds a solution with all, some, and none of the seeds.\
    \ Further, we compute the primal gap (gap()), running time (time(s)), and number\
    \ of iterations (iter) as the shifted mean over all instances solved by at least\
    \ one of the FP variants that we compare. Here, the primal gap is a number between\
    \ 0% and 100% defined as follows:\n\n**Definition 7.1.** Let $\\tilde{x}$ be a\
    \ solution for a MIP, and $\\tilde{x}_{opt}$ an optimal (or best) solution for\
    \ our MIP. We define the primal gap $\\gamma \\in [0, 1]$ w.r.t. $\\tilde{x}$\
    \ as:\n\n```\n$$\\gamma_{\tilde{x}}(\tilde{x}) := \\begin{cases} 0, & \\text{if\
    \ } |c^T\\tilde{x}_{opt}| = |c^T\\tilde{x}| = 0, \\ 1, & \\text{if } c^T\\tilde{x}_{opt}\
    \ \\cdot c^T\\tilde{x} < 0, \\\\frac{|c^T\\tilde{x}_{opt} - c^T\\tilde{x}|}{\\\
    max\\{|c^T\\tilde{x}_{opt}|, |c^T\\tilde{x}|}}, & \\text{otherwise.} \\end{cases}$\n\
    ```\n\nIn all tables, we highlight values in blue and bold that are at least 10%\
    \ better than the values obtained by the reference runs, which are the first row\
    \ of each table. Values that are at least 10% worse than the reference are highlighted\
    \ in red and italics. Over all 89 instance-seed combinations, we count the number\
    \ of wins, i.e., the number of instances of an FP variant provides at least a\
    \ 10% improvement, for the primal gap, running time, and the number of iterations.\
    \ As before, if the number of wins exceeds the number of losses by more than 10%,\
    \ the number of wins is highlighted in blue and bold. If it is the other way around,\
    \ the number of losses is highlighted in red and italics.\n\nIn Sections 7.1 to\
    \ 7.3 we examine the performance of different FP variants in an embedded setting\
    \ and in Section 7.4 in a standalone setting. For the complete results, we refer\
    \ to our online supplement https://github.com/GioniMexi/online-supplement-feaspump3.\
    \ Note that for all variants, we use OPF2 as a baseline and hence FP in setting\
    \ abbreviations will always mean a variant of OFP2 was used. We present our results\
    \ in the order of the paper outline.\n\n# 7.1. Applying mRENS\n\nFirst, we illustrate\
    \ the benefits of using (m)RENS before Stage 3. To this end, we compare FP with\
    \ active Stage 3 (FP-s3) to the variant which applies RENS or mRENS, called FP-(RENS,s3)\
    \ and FP-(mRENS,s3), respectively. In this setting, if (m)RE finds a feasible\
    \ solution, we terminate. Otherwise, we use the original Stage 3 for the remaining\
    \ available time. Our experiment is conducted over the 153 instances (out of 283)\
    \ where FP fails to find a feasible solution within the limit of 20 iterations."
