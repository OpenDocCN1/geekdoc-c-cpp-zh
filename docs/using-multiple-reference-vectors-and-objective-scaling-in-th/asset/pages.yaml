    \ the set of possible distance functions to $3^n$. We enlarge this set by considering\
    \ a conic combination of multiple distance functions (w.r.t. multiple integer\
    \ vectors in (2)). Using directions “in-between”, may also lead to feasible MIP\
    \ solutions or other LP solutions from the projection step that can be easily\
    \ rounded to such. Further, they might serve as a “tie-breaker” in dimensions\
    \ where the current distance function would have a zero coefficient.\n\nLet $\\\
    mathcal{L} = \\{1, \\dots, k\\}$ be the set of integer vectors obtained during\
    \ the pumping loop. By $\\Delta(x, \tilde{X}, \\Lambda_{\\mathcal{L}})$, we denote\
    \ a conic combination of the $L_1$-distances to the integer vectors $\tilde{x}^i,\
