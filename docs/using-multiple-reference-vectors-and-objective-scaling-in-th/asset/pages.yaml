    \ constraints.\n\nBy design, using multiple reference vectors in Stages 1 and\
    \ 2 leads to smaller changes of the distance function in the projection step objective,\
    \ which can be seen as taking smaller \"steps\" towards convergence at staying\
    \ close to good feasible solutions. This is expected to come with a slightly increased\
    \ number of iterations that are traded for better solution quality. Note that\
    \ this might not necessarily be desired when running FP with strict iteration\
    \ limits.\n\nConsidering information from previous iterations in the projection\
    \ step may increase the probability of cycling, since the distance function in\
    \ the objective may not change during the pumping loop. Therefore, it is essential\
    \ to provide different ways to escape cycles, since an increased number of random\
    \ perturbations, and especially restarts, may drastically reduce the success rate\
    \ of FP [6]. For instance, if a cycle of length one is detected, i.e., $\\tilde{x}^k\
