    \ Since $x_r^*$ is a minimizer of $f_r$, it holds that\n\n> $f_r(x_r^*) \\leq\
    \ f_r(x_r) \\quad \\text{for all } x_r \\in \\mathbb{R}. \\quad (*)$\n\nConsider\
    \ the sets $L_r, U_r \\subseteq \\mathcal{L}$ defined as\n\n$L_r := \\{i \\in\
    \ \\mathcal{L} : \\tilde{x}_i^* < x_i^*, i \\in \\mathcal{J}\\},$\n\nand\n\n$U_r\
    \ := \\{i \\in \\mathcal{L} : \\tilde{x}_i^* > x_i^*, i \\in \\mathcal{J}\\}.$\n\
    \nSince $x_r^* \\notin \\mathbb{Z}$, it holds that $L_r \\cup U_r = \\mathcal{L}$.\
    \ Then,\n\n> $f_r(x_r^*) = \\sum_{i \\in \\mathcal{L}} \\lambda_i |x_r^* - \\\
    tilde{x}_i^*| \\n = \\sum_{i \\in L_r} \\lambda_i |x_r^* - \\tilde{x}_i^*| + \\\
    sum_{i \\in U_r} \\lambda_i |x_r^* - \\tilde{x}_i^*| \\n = \\sum_{i \\in L_r}\
    \ \\lambda_i (x_r^* - \\tilde{x}_i^*) + \\sum_{i \\in U_r} \\lambda_i (\\tilde{x}_i^*\
    \ - x_r^*) \\n = (\\left( \\sum_{i \\in L_r} \\lambda_i - \\sum_{i \\in U_r} \\\
