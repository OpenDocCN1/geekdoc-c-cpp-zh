    \ variants of FP.\n\n# ## 3. Multiple reference vectors in Stage 3\n\nWhen embedded\
    \ in MIP solvers, primal heuristics are usually run only for a short amount of\
    \ time. Therefore, the computationally demanding Stage 3 of FP is deactivated\
    \ or only used under certain circumstances, e.g., the distance of the closest\
    \ integer vector to the LP-polyhedron $P$ is below a certain threshold. Therefore,\
    \ we design an alternative Stage 3 that uses multiple reference vectors obtained\
    \ from FP and large neighborhood search heuristic RENS [8,9]. Notably, while the\
    \ traditional Stage 3 solves an auxiliary MIP of the same dimensions as the original,\
    \ our alternative approach will solve a sub-MIP, which can be significantly smaller\
    \ and hence much faster to solve in practice.\n\n# ### 3.1. Multi-reference RENS\n\
    \nThe principle idea of RENS is to search for solutions for a MIP in the proximity\
    \ of the optimal solution of its LP relaxation $\bar{x}^0$. More specifically,\
    \ RENS solves a sub-MIP of the original MIP with tighter bounds on the integer\
    \ variables based on their value in $\bar{x}^0$. To that end, for each $j \\in\
    \ Z$, if $\bar{x}^0$ is an integer, $x_j$ is fixed at that value. Otherwise, the\
    \ bounds of $x_j$ are tightened to the nearest integer values of $\bar{x}^0$,\
    \ $L_j$ is set to $[L_j^0]$, and $u_j$ to $[U_j^0]$. To summarize, RENS solves\
    \ the sub-MIP\n\n```\n$\\min \\min x \\in \\mathbb{R}^n\\nAx \\leq b\\ns.t.\\\
    nL_j \\leq x_j \\leq u_j \\ntext{for all } j \\notin \\mathcal{I}.\\n[L_j^0] \\\
    leq x_j \\leq [U_j^0] \\ntext{for all } j \\in \\mathcal{I}.\\nx_j \\in \\mathbb{Z}\
    \ \\ntext{for all } j \\in \\mathcal{I}$.\n```"
