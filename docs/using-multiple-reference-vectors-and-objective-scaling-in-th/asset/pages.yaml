    # Appendix A. Proof of Theorem 4.1


    Proof. If $\lambda_i=0$ for all $i \in \mathcal{L}$, the claim clearly holds.
    Assume there exists an $i \in \mathcal{L}$ $\lambda_i>0$. The distance function
    $\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ can be rewritten as


    ```

    $$\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}}) = \sum_{i \in \mathcal{L}}
    \lambda_i \Delta(x, \tilde{x}^i)\n=\sum_{i \in \mathcal{L}} \lambda_i ||x - \tilde{x}^i||_1\n=\sum_{i
    \in \mathcal{L}} \sum_{j \in J} \lambda_i |x_j - \tilde{x}_j^i|

    =\sum_{j \in J} \sum_{i \in \mathcal{L}} \lambda_i |x_j - \tilde{x}_j^i| \n= f_j(x_j)$

    ```


    Thus, $\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ is the sum of
    $|\mathcal{J}|$ terms $f_j(x_j)$, where each term depends only on the variable
    $x_j$. Here, the set of minimizers


    ```

    $S := \arg min (x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}}) \n x \in \mathbb{R}^n$

    ```


    is the Cartesian product over the $|\mathcal{J}|$ sets


    ```

    $\arg min f_j(x_j), j \in \mathcal{J}. \n x_j \in \mathbb{R}$

    ```


    Note that $f_j(x_j) > f_j(\min_{i \in \mathcal{L}} \tilde{x}_j^i)$ for all $x_j
    < \tilde{x}_j^i$, and $f_j(x_j) > f_j(\max_{i \in \mathcal{L}} \tilde{x}_j^i)$
    for all $x_j > \max_{i \in \mathcal{L}} \tilde{x}_j^i$. Therefore, $f_j$ attains
    its minimum in $[min_{i \in \mathcal{L}} \tilde{x}_j^i, \max_{i \in \mathcal{L}}
    \tilde{x}_j^i]$.'
