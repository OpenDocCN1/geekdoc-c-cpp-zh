    3, lead to both solution quality and running improvement.


    # 8. Conclusion


    In this paper, we have presented a new version of the Objective Feasibility Program
    heuristic that works in all stages of the algorithm. In particular, we introduced
    a modified version of RENS, which can mRENS that uses LP-feasible reference vectors
    obtained in the main loop of FP to tighten the bounds before the computationally
    expensive Stage 3. We extended the idea to Stage 1 and 2. This is achieved by
    using a conic combination of distance functions in the projection step objective.
    Moreover, we introduced alternative objective scaling to balance the contributions
    of the distance functions and the original MIP objective $c^Tx$. In addition,
    we provide a solver interface for the non-commercial solver SCIP via Soplex [21]
    for solving LPs. To the best of our knowledge, this is the first state-of-the-art
    FP implementation that only uses open'
