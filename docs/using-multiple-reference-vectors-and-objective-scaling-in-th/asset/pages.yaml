  md: 'to achieve better solutions with comparable or faster performance w.r.t. OP2.
    Other suggested improvements, e.g., [15], are based on older FP implementations,
    and we found that they do not combine with OP2 or achieved almost identical performance,
    e.g., [16,17].


    In our implementation, FP communicates with LP/MIP solvers through an abstract
    interface, which is implemented for two-of-the-art commercial solvers, namely,
    the FICO Xpress Optimizer [18] and IBM LOG CPLEX [19]. In addition, we provide
    a solver interface for the non-commercial SCIP [20] using SoPlex [21] for LPs.
    The best of our knowledge, this is the first state-of-the-art OP2 implementation
    that only uses open-source software. Our version of the code is freely available
    and can be downloaded from https://github.com/GioniMex/feasump3.


    Similar to [7] we compare variants of FP in an embedded and a standalone scenario.
    In the first case, we evaluate FP as a primitive heuristic in a general-purpose
    MIP solver. Typically, in this scenario, we set a limit of 20 iterations in Stages
    1 and 2. In the second scenario, we evaluate the performance of each variant as
    a standalone heuristic. Here the limit is 2000 iterations. A detailed description
    of the parameter settings that we use for our standalone experiment can be found
    in [5,6]. The chosen iteration limits align with those in earlier implementations,
    we also tried different limits (e.g., 50 or 100 iterations in Stages 1 and 2)
    and found that this does not change the performance by much.


    In both scenarios, embedded and standalone, we evaluate the performance of mRENS
    and Stage 3, we limit the number of MIP solvers to 500. With typical node limits
    used for sub-MIP solvers in SCIP, see, e.g., [8,22,23], and is marked in difference
    to previous implementations of FP heuristics which avoided a sub-MIP stage altogether
    (when used in an embedded setting) or did not limit any resources by time (when
    used in a standalone setting).


    Our test sets of the official benchmark set MIPLIB 2017 [24] and all instances
    used in [7] are not part of MIPLIB 2017. We excluded decomp2,ex9, and ex10, since
    they were solved to optimality during,, and standalonecase9, since its LP relaxation
    exceeded one hour of computation. In our total, main test set consists of 283
    instances, for see our online supplement https://github.com/GioniMexi/online-supplement-feasump3.


    All results were obtained on a cluster of Intel Xeon E-2690 @ 2.6 GHz machines
    with 128 GB of RAM, using exclusive runs for each job. In all experiments, we
    used the FICO Xpress Optimizer as LP and MIP solver. To mitigate the impact of
    performance variability, each FP variant is used on the complete test set with
    three different seeds. Therefore, we decided to average results over all three
    seeds to compare FP variants. For details about performance variability in mixed-integer
    programming, we refer to Lodi and Tramontani [25].'
