  md: "In practice, solving (3) may be computationally expensive if only a small percentage\
    \ of integer variables are assigned tighter bounds. On the contrary, a considerable\
    \ amount of cases, RENS tightens too many variable bounds, which leads to the\
    \ infeasibility of (3) [8]. In the following, we propose to combine RENS with\
    \ information obtained from Stages 1 and 2 of FP. By the loop, FP generates a\
    \ sequence $\tilde{x}^0, \\dots, \tilde{x}^k$ of LP-feasible vectors which can\
    \ be used as reference vectors for RENS. Let $\tilde{X}$ be a subset of $\\{\t\
    ilde{x}^0, \\dots, \tilde{x}^k\\}$. We propose a modified version of RENS, in\
    \ which the variable bounds are tightened based on the values they take from vectors\
    \ in $\tilde{X}$. More precisely, we call multi-reference RENS (mRENS), in which\
    \ for each $j \\in \\mathcal{I}$, we set $l_j$ to $[\\min_{x \\in \tilde{X}} x_j]$,\
    \ and $u_j$ to $[\\max_{x \\in \tilde{X}} x_j]$. To summarize, mRENS solves the\
    \ sub-MIP\n\n```\n$$\\begin{aligned} \\min_{x \\in \\mathbb{R}^n} & c^\top x \\\
    \ \\text{s.t.} & Ax \\leq b \\ & l_j \\leq x_j \\leq u_j & \\text{for all } j\
    \ \notin \\mathcal{I}. \\ & [\\min_{x \\in \tilde{X}} \tilde{x}_j] \\leq x_j \\\
    leq [\\max_{x \\in \tilde{X}} \tilde{x}_j] & \\text{for all } j \\in \\mathcal{I}.\
    \ \\ & x_j \\in Z & \\text{for all } j \\in \\mathcal{I}. \\end{aligned}$ (4)$\n\
    ```\n\nNote that $\tilde{x}^0 \\in \tilde{X}$, then the RENS sub-MIP is itself\
