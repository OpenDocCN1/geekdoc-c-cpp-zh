    The results in Table 1 show that both new variants find feasible solutions for
    slightly more instances than FP-(s3). In addition, FP-(mRENS,s3) significantly
    outperforms FP-(s3) w.r.t. solution quality. More precisely, it is a 41.8% gap
    decrease over instances solved by at least one FP variant, with a slight increase
    of computational time in many cases two sub-MIPs are solved. The geometric mean
    of the time spent in the sub-MIP stages of FP is shown in the parentheses in the
    last column of the table. In particular, RENS and mRENS are able to find a solution
    with all three seeds for 42% and 54% of the instances and hence Stage 3. Both
    RENS and mRENS are significantly faster than the original Stage 3. Namely, in
    terms of geometric means RENS requires 0.24 seconds, and mRENS 0.67 seconds.


    As already mentioned, many implementations of FP in MIP solvers solve the demanding
    Stage 3. We suggest that mRENS is a good alternative for Stage 3 in embedded implementations
    of FP, as it require 62.8% less computational time. However, similar to the RENS
    heuristic, there is no guarantee that the defined sub-MIP is going to be feasible.
    Fortunately, in many cases-of-the-art MIP solvers are able to detect infeasibility
    in a short amount of time, which “fail fast” design concept primal heuristics
    [1]. It is worth pointing out that the time spent in the sub-MIP heuristics (s3)(RENS,s3)/(mRENS,s3)
    was less than the time spent in Stages 1 and 2 over all three cases, supporting
    the claim that we can afford Stage 3, with appropriate limits, even in the embedded
    setting.


    # 7.2. Applying the new scaling


    Next, we compare FP with configurations that use the alternative scaling terms
    introduced in Section 5. Here, we deactivate Stage 3 to better compare the gains
    in Stage 1 and Table 2 summarizes the results of three runs: (1) FP, (2) FP using
    the alternative scaling for $||c||_2$ (FP-($c$)), and (3) FP using the alternative
    scaling for both $||c||_2$ and $||\Delta||_2$ (FP-($\Delta$)).


    Both FP-(c) and FP-($\Delta$) lead to a significant performance improvement. Especially
    FP-($\Delta$) to a 33.6% gap decrease over instances solved by at least one FP
    variant and requires 15.8% fewer iterations than FP to find a feasible solution.'
