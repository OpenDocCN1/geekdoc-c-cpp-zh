    # ARTICLE INFO ABSTRACT


    Keywords:

    Mixed-integer programming

    Primal heuristics


    The Feasibility Pump (FP) is one of the best-known primal heuristics for mixed-integer
    programming (MIP): more than 15 papers suggested various modifications of all
    its steps. So far, no variant considered information across multiple iterations,
    but all maintained the principle to optimize towards a single reference point.
    In this we evaluate the use of multiple reference vectors in all stages of the
    FP algorithm. In particular, we use LP-feasible vectors obtained during the main
    loop to tighten the variable domains before entering the computational core, a
    procedure we refer to as mRENS. We consider multiple reference vectors to mrens
    to explore further optimizing directions and introduce alternative objective scaling
    terms to balance the contributions of the distance functions and the original
    MIP objective.


    Our computational experiments demonstrate that the new method can improve performance
    on general MIP test sets. In detail, our modifications provide a 29.3% solution
    improvement and 4.0% running improvement in an embedded setting, meeting 16.0%
    fewer iterations over a large set of MIP instances. In addition, the method''s
    success rate increases consistently within the first few iterations. We also observe
    a moderate performance


