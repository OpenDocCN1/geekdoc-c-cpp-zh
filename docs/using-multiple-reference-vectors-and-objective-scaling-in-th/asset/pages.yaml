  md: "# 5. Alternative objective scaling\n\nAfter experimenting with the problem\
    \ instance misc07, Pragnac et al. [11] observed that for this the fixed scaling\
    \ terms $||\\Delta||_2$ and $||c||_2$ do not provide a balanced contribution of\
    \ $\\Delta(x, \\tilde{x})$ and $c^\top x$ in (2). Therefore, they proposed to\
    \ replace $||c||_2$ with $|c^\top \\tilde{x}|$, where $\\tilde{x}$ is the LP-feasible\
    \ vector obtained in the projection step of the previous iteration. This modification\
    \ resulted in a more balanced contribution of the two objective terms for this\
    \ specific problem instance. However, no comparison over a large test set was\
    \ presented.\n\nInspired by this idea, we propose to replace the scaling term\
    \ $||\\Delta||_2$ by the dynamically changing term $|\\Delta(\\tilde{x}^{k-1},\
    \ x)|$ in addition to the scaling suggested above. In the spirit of this work,\
    \ one of of these modifications as considering information from previous iterations\
    \ in the projection step.\n\nRecall that FP aims at minimizing the distance of\
    \ the vectors $\\tilde{x}$ and $\\tilde{x}$, and reach convergence. Thus, it is\
    \ expected that the components of $\\tilde{x}$ and $\\tilde{x}$ do not differ\
    \ much from the corresponding components of $\\tilde{x}^{k-1}$ and $\\tilde{x}^{k-1}$.\
    \ In, in the projection step we also observe that $\\Delta(x, \\tilde{x})$ and\
    \ $c^\top x$ will acquire close values to $\\Delta(\\tilde{x}^{k-1}, \\tilde{x})$\
    \ and $c^\top \\tilde{x}^{k-1}$, respectively. Therefore, the suggested scaling\
    \ should provide a more balanced contribution of the two objective terms. To summarize,\
    \ we proposed the modified projection step objective by\n\n```\n$$\\Delta_{\\\
    alpha_k}(x,\\tilde{x}) := (1 -\\alpha_k)\\Delta(x,\\tilde{x}) + \\frac{|\\Delta(\\\
    \tilde{x}^{k-1},\\tilde{x})|}{|c^\top \\tilde{x}^{k-1}|}c^\top x,$\n```\n\nwhere\
    \ $\\alpha_k \\in [0,1]$. That a small value for $|\\Delta(\\\tilde{x}^{k-1},\\\
    tilde{x})|$ might also be an indicator of convergence in subsequent iterations.\
    \ Whenever $|\\Delta(\\\tilde{x}^{k-1},\\tilde{x})|$ decreases, the contribution\
    \ of $c^\top x$ in the objective also decreases, which turns the priority of the\
    \ projection step more towards feasibility and less towards solution quality.\
    \ Therefore, dynamically adjusting the two scaling terms may also accelerate the\
    \ feasible solution.\n\n# 6. Setup\n\nAs a baseline for our C++ implementation\
    \ we use the FP code from [7], that incorporates the WALKSALT perturbation procedure\
    \ described in Dey et al. [12].\n\nWe carefully examined the literature to decide\
    \ which FP variants should include in our implementation. We also (re-)implemented\
    \ some variants that did not end up in our final experiments, on the test set\
    \ used, they would have deteriorated the baseline w.r.t. the measures we concentrated\
    \ on.\n\nSome suggested amendments had a different scope, e.g., [13] or [14],\
    \ which present an approach that can find better quality solutions than OFP2,\
    \ however, at the cost of increased computational time, often by orders of magnitude.\
    \ This is out of our scope"
