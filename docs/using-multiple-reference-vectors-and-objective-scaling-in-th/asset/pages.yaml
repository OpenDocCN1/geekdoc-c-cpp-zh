    # Using multiple reference vectors and objective scaling in the Feasibility Pump


    ![](img/ce617cbf3f63b50f5e5f3c3ddb99fec4_0_2.png)


    Gioni Mei<sup>a</sup> Timo Berthold<sup>b,*</sup> Domenico Salvagnin<sup>c</sup>


    +   *a Zuse Institute, Takstraße 7, 14195, Berlin, Germany

