    # 1. Introduction


    Mixed-integer programming is widely used for modeling and solving challenging
    op-

    tization problems that arise from real-world applications. We define a mixed-integer

    program (MIP) in matrix and vector notation as follows:


    **Definition 1.1.** (mixed-integer program) Let $m, n \in \mathbb{Z}_{\ge0}$.
    Given some matrix $A \in \mathbb{Q}^{m\times n}$,

    vectors $b \in \mathbb{Q}^{m}, c \in \mathbb{Q}^{n}, u \in \mathbb{Q}^{n} \cup
    \{\pm\infty\}$, and a set of indices $I \in \mathbb{N} :=\{1,\dots,n\}$, a

    problem in the form


    ```

    \begin{aligned} \min_{x\in X} & & c^T x \ \text{s.t.} & & Ax \le b \ & & l \le
    x \le u \ & & x_j \in \mathbb{Z} \quad \text{for all } j\in I, \end{aligned} (1)

    ```


    is called a mixed integer program (MIP).


    Finding a feasible solution to a given mixed integer programming (MIP) model is

    very important, $NP$-complete problem that can be extremely hard in practice and
    is

    often approached via primal heuristics [1,2]. The most successful schemes

    for finding initial feasible solutions for MIPs is the Feasibility Pump, originally
    proposed

    of Fischetti, Glover, and Lodi [3].


    The fundamental idea of all FP algorithms is to construct two sequences of\points
    that hopefully converge to a feasible solution to a given optimization problem;
    in

    a MIP. One sequence consists of points that are feasible for a continuous relaxation

    (typically the LP relaxation), but possibly integer infeasible. The other sequence

    of points that are integral but might violate some of the imposed (linear) constraints.

    net next of each sequence is always generated by minimizing the distance to the

    last point of the sequence, using different measures in either case (e.g.,

    $\ell_{1}$ and the $\ell_{2}$ norm). For an overview of FP variants, we refer
    to [4].


    The outline of this paper is as follows. In Section 2 we describe the core idea
    of

    FP, concentrating on the Objective Feasibility Pump 2.0 (OFP2), which is the baseline

    alg of our work. In Sections 3 and 4, we describe one of our two contri-

    butions, namely variations of all three stages of the FP algorithm to consider
