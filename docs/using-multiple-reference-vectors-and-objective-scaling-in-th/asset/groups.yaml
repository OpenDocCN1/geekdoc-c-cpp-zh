    ## 3. Multiple reference vectors in Stage 3


    When embedded in MIP solvers, primal heuristics are usually run only for a short
    amount of time. Therefore, the computationally demanding Stage 3 of FP is deactivated
    or only used under certain circumstances, e.g., the distance of the closest integer
    vector to the LP-polyhedron $P$ is below a certain threshold. Therefore, we design
    an alternative Stage 3 that uses multiple reference vectors obtained from FP and
    large neighborhood search heuristic RENS [8,9]. Notably, while the traditional
    Stage 3 solves an auxiliary MIP of the same dimensions as the original, our alternative
    approach will solve a sub-MIP, which can be significantly smaller and hence much
    faster to solve in practice.


    ### 3.1. Multi-reference RENS


    The principle idea of RENS is to search for solutions for a MIP in the proximity
    of the optimal solution of its LP relaxation $\bar{x}^0$. More specifically, RENS
    solves a sub-MIP of the original MIP with tighter bounds on the integer variables
    based on their value in $\bar{x}^0$. To that end, for each $j \in Z$, if $\bar{x}^0$
    is an integer, $x_j$ is fixed at that value. Otherwise, the bounds of $x_j$ are
    tightened to the nearest integer values of $\bar{x}^0$, $L_j$ is set to $[L_j^0]$,
    and $u_j$ to $[U_j^0]$. To summarize, RENS solves the sub-MIP


    ```

    $\min \min x \in \mathbb{R}^n

    Ax \leq b

    ns.t.

    L_j \leq x_j \leq u_j \text{for all } j \notin \mathcal{I}.

    [L_j^0] \leq x_j \leq [U_j^0] \text{for all } j \in \mathcal{I}.

    x_j \in \mathbb{Z} \text{for all } j \in \mathcal{I}$.

    ```


    In practice, solving (3) may be computationally expensive if only a small percentage
    of integer variables are assigned tighter bounds. On the contrary, a considerable
    amount of cases, RENS tightens too many variable bounds, which leads to the infeasibility
    of (3) [8]. In the following, we propose to combine RENS with information obtained
    from Stages 1 and 2 of FP. By the loop, FP generates a sequence $\tilde{x}^0,
    \dots, \tilde{x}^k$ of LP-feasible vectors which can be used as reference vectors
    for RENS. Let $\tilde{X}$ be a subset of $\{\tilde{x}^0, \dots, \tilde{x}^k\}$.
    We propose a modified version of RENS, in which the variable bounds are tightened
    based on the values they take from vectors in $\tilde{X}$. More precisely, we
    call multi-reference RENS (mRENS), in which for each $j \in \mathcal{I}$, we set
    $l_j$ to $[\min_{x \in \tilde{X}} x_j]$, and $u_j$ to $[\max_{x \in \tilde{X}}
    x_j]$. To summarize, mRENS solves the sub-MIP


    ```

    $$\begin{aligned} \min_{x \in \mathbb{R}^n} & c^T x \ \text{s.t.} & Ax \leq b
    \\ l_j \leq x_j \leq u_j & \text{for all } j \notin \mathcal{I}. \\ [\min_{x \in
    \tilde{X}} \tilde{x}_j] \leq x_j \leq [\max_{x \in \tilde{X}} \tilde{x}_j] & \text{for
    all } j \in \mathcal{I}. \\ x_j \in Z & \text{for all } j \in \mathcal{I}. \end{aligned}$
    (4)

    ```


    Note that $\tilde{x}^0 \in \tilde{X}$, then the RENS sub-MIP is itself a sub-MIP
    of the mRENS sub-MIP.


