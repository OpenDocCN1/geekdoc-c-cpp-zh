    # 8. 结论


    在本文中，我们提出了一种新版本的目标可行性程序（Objective Feasibility Program）启发式算法，它适用于算法的所有阶段。特别是，我们引入了
    RENS 的修改版本，即 mRENS，它使用 FP 主循环中获得的 LP 可行参考向量在计算开销较大的阶段 3 之前收紧边界。我们将该思想扩展到了阶段 1
    和 2。这是通过在投影步骤的目标函数中使用距离函数的锥锥组合实现的。此外，我们引入了替代目标缩放，以平衡距离函数与原始 MIP 目标 $c^Tx$ 的贡献。此外，我们还通过
    Soplex [21] 为非商业求解器 SCIP 提供了一个求解器接口以求解 LP。据我们所知，这是第一个仅使用开源软件的最先进 FP 实现。我们的最终版本代码免费提供，可以从
    https://github.com/GoniMexi/feasump3 下载。


    我们的计算实验表明，新方法可以提高通用 MIP 测试集上的性能。具体而言，在嵌入设置中，我们的修改在大量 MIP 实例上提供了 29.3% 的解质量改进和
    4.0% 的运行时间改进，所需的迭代次数减少了 16.0%。此外，该方法在前几次迭代中的成功率显著增加。在独立设置下，我们还观察到差距、运行时间迭代迭代次数有中等程度的性能改进。


