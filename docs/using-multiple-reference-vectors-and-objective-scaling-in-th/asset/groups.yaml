    source software. Our final version of the code is freely available and can be
    downloaded from https://github.com/GoniMexi/feasump3.


    Our computational experiments demonstrate that the new method can improve the
    performance on general MIP test sets. In detail, our modifications provide in
    an embedded setting 29.3% solution quality improvement and 4.0% running time improvement,
    needing 16.0% fewer iterations over a large set of MIP instances. In addition,
    the success rate of the method within the first few iterations increases considerably.
    In a standalone setting, we observed also a moderate performance improvement for
    the gap, running time, and iterations.


