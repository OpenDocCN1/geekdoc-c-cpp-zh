    **推论 4.3.** 令 $\mathcal{L}=\{1, \dots, k\}$ 为 $k \in \mathbb{N}$ 个整数向量 $ \tilde{x}^1,
    \dots, \tilde{x}^k \in \mathbb{Z}^n$ 的索引集。对于所有 $i \in \mathcal{L}$，有 $\lambda_i
    \ge 0$，且定义 $\Delta(x, X_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ 为 (5)。如果对于任意两个不交的集
    $U, V \subseteq \mathcal{L}$ 且 $U \cup V=\mathcal{L}$ 使得


    $$\sum_{i \in U} \lambda_i \neq \sum_{i \in V} \lambda_i. (8)$$


    则 $\Delta(x, X_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ 在 $\mathbb{R}^n$ 上的最小化集包含整数向量。


    推论 4.3 对权重 $\Lambda_{\mathcal{L}}$ 引入了一个条件，该条件确保了 (5) 最小值的整数性。然而，这并不意味着任何满足该条件的权重都是投影步骤
    FP 的合适选择。例如，如果任意迭代 $k$ 满足 $\lambda_i = \lambda_j = \dots = \lambda_{k-1} > \lambda_k$，则
    (8) 显然成立的。但随着 $k$ 的增大，距离函数的变化会越来越小，导致 FP 算法出现停滞。因此，我们建议仅考虑少数整数向量和 $\Lambda_{\mathcal{L}}$
    以实现上述行为。根据 Melo [10] 的结果，我们在迭代 $k$ 中考虑了三个具有几何属性 (0.5, 0.25, 0.125) 的参考向量。第一个是
    $\tilde{x}$，其余两个是获取的在所有约束条件下变异之和最小的整数向量。


    根据设计，在阶段 1 和 阶段 2 中使用多个参考向量会导致投影步骤目标中的距离函数变化较小，这可以看作是在保持接近良好可行解的同时，向收敛迈出更小的“步”。预计这将以迭代次数的略微增加为代价，换取更好的解质量。请注意，在带有严格迭代限制的运行
    FP 时，这并不一定是有需要的。


    在投影步骤中考虑来自之前迭代的信息可能会增加循环的概率，因为目标中的距离函数在泵循环（pumping loop）期间可能不会改变。因此，提供不同的跳循环方法至关重要，因为增加随机扰动的次数（特别是重启）可能会大幅降低
    FP 的成功率 [6]。例如，如果检测到长度为一的循环，即 $\tilde{x}^k = \tilde{x}^{k-1}$，通常会将 $\tilde{x}^k$
    的少数整数组件设置为不同的整数值。打破这种循环的一种有效方法是重置权重 $\Lambda_{\mathcal{L}}$ 并重复迭代 $k-1$。直观上，由于我们减少了
    $\lambda_{k-1}$ 的值，即减少了 (5) 中 $\Delta(x, x^{k-1})$ 的贡献。在这种情况下，如果检测到长度大于一的循环（即
    $\tilde{x}^k = \tilde{x}^l$，$l \in \{1, \dots, k-2\}$），可以通过类似的方法避免重启机制。例如，如果 $l
    \in \mathcal{L}_{active}$，我们决定通过设置 $\lambda_k = 1, \lambda_i = 0, i \in \mathcal{L}\setminus\{k\}$
    来忽略所有来自之前迭代的信息，使用一次 FP 的原始投影步骤。最后，如果循环持续或检测到新循环，我们应用 FP 的常规重启。


    ## 5. 替代目标缩放


    在对问题实例 misc07 进行实验后，Pragnac 等人 [11] 观察到对于该实例，固定缩放项 $||\Delta||_2$ 和 $||c||_2$
    在 (2) 中没有为 $\Delta(x, \tilde{x})$ 和 $c^T x$ 提供平衡的贡献。因此，他们建议将 $||c||_2$ 替换为 $|c^T
    \tilde{x}|$，其中 $\tilde{x}$ 是在上一次迭代投影步骤中获得的 LP 可行向量。这种修改使得该特定问题实例的两个目标项的贡献更加平衡。然而，文中并未提供在大型测试集上的比较。


    受这一想法的启发，我们建议在上述建议缩放的基础上，额外引入动态变化的项 $|\Delta(\tilde{x}^{k-1}, x)|$ 来替换缩放项 $||\Delta||_2$。本本工作的精神，这些修改之一是在投影步骤中考虑来自之前迭代的信息。


    回想 FP 旨在最小化向量 $\tilde{x}$ 和 $\tilde{x}$ 之间的距离并达到收敛。因此，预计 $\tilde{x}$ 和 $\tilde{x}$
