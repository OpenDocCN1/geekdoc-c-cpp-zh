    16.0 fewer iterations.


    # 7.4. Standalone results


    As has been shown in the thesis of Mexi [10], the new scaling and the use of multiple
    reference vectors in Stages 1 and 2 enhance the performance of a standalone FP
    implementation in a complementary way. In particular, the new scaling mostly lead
    to an improvement in running time and iterations, whereas using multiple reference
    vectors in the projection step improves the solution quality. Based on this, it
    seems natural to compare combinations of different FP variants in a standalone
    setting.'
