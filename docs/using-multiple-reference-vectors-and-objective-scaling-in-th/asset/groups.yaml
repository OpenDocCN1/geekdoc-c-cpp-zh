    # 附录 A. 定理 4.1 的证明


    证明。对于所有 $i \in \mathcal{L}$，如果 $\lambda_i=0$，结论显然成立。假设存在 $i \in \mathcal{L}$ 使得
    $\lambda_i>0$。距离函数 $\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$
    可以重写为：


    $$\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}}) = \sum_{i \in \mathcal{L}}
    \lambda_i \Delta(x, \tilde{x}^i) = \sum_{i \in \mathcal{L}} \lambda_i \|x - \tilde{x}^i\|_1
    = \sum_{i \in \mathcal{L}} \sum_{j \in \mathcal{J}} \lambda_i |x_j - \tilde{x}_i|
    = f_j(x_j)$$


    因此，$\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ 是 $|\mathcal{J}|$
    项 $f_j(x_j)$ 之和，其中每项仅取决于变量 $x_j$。在这里，最小值集 $S := \arg \min (x, \tilde{X}_{\mathcal{L}},
    \Lambda_{\mathcal{L}}) x \in \mathbb{R}^n$ 是 $|\mathcal{J}|$ 个集合 $\arg \min f_j(x_j),
    j \in \mathcal{J}$ 的笛卡尔积。注意，对于所有 $x_j < \tilde{x}_i^i$, $f_j(x_j) > f_j(\min_{i
    \in \mathcal{L}} \tilde{x}_j^i)$，且对于所有 $x_j > \tilde{x}_i^i$, $f_j(x_j) > f_j(\max_{i
    \in \mathcal{L}} \tilde{x}_j^i)$。因此，$f_j$ 在 $[\min_{i \in \mathcal{L}} \tilde{x}_j^i,
    \max_{i \in \mathcal{L}} \tilde{x}_j^i]$ 中取得最小值。


    现在假设 $S$ 中有一个非整数最小值 $x^* \in \mathbb{R}^n$，则存在 $r \in \mathcal{J}$ 使得 $x_r^* \notin
    \mathbb{Z}$。由于 $x^*$ 是 $f_r$ 的最小值，对于所有 $x_r \in \mathbb{R}$ 有 $f_r(x_r^*) \leq
    f_r(x_r)$。考虑集合 $L_r, U_r \subseteq \mathcal{L}$，定义为：

    $L_r := \{i \in \mathcal{L} : \tilde{x}_i^* < x_r^*, i \in \mathcal{J}\}$, 以及
    $U_r := \{i \in \mathcal{L} : \tilde{x}_i^* > x_r^*, i \in \mathcal{J}\}$。


    由于 $x_r^* \notin \mathbb{Z}$，有 $L_r \cup U_r = \mathcal{L}$。那么


    $$f_r(x_r^*) = \sum_{i \in \mathcal{L}} \lambda_i |x_r^* - \tilde{x}_i^*| = \sum_{i
    \in L_r} \lambda_i |x_r^* - \tilde{x}_i^*| + \sum_{i \in U_r} \lambda_i |x_r^*
    - \tilde{x}_i^*| = \sum_{i \in L_r} \lambda_i (x_r^* - \tilde{x}_i^*) + \sum_{i
    \in U_r} \lambda_i (\tilde{x}_i^* - x_r^*) = \left( \sum_{i \in L_r} \lambda_i
    - \sum_{i \in U_r} \lambda_i \right) = \Delta L_r x_r^* + \sum_{i \in L_r} \lambda_i
    \tilde{x}_i^* - \sum_{i \in U_r} \lambda_i \tilde{x}_i^* = \tau_r$$


    根据 $L_r$ 和 $U_r$ 的选择，对于所有 $x_r \in [[x_r^*], [[x_r^*]]$，$f_r(x_r) = \Delta L_r
    x_r + \tau_r$。


    我们区分以下情况：

    - $\Delta L_r < 0$：如果 $x_r^* > 0$，说明 $\Delta L_r = 0$，且 $[x_r^*]$ 是 $f_r$ 的最小值。因此，对于任何
    $j \in \mathcal{J}$，存在 $f_j$ 的整数最小值，这表明 $S$ 中存在整数向量。


