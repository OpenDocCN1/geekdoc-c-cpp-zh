    在对问题实例 misc07 进行实验后，Pragnac 等人 [11] 观察到对于该实例，固定缩放项 $||\Delta||_2$ 和 $||c||_2$
    在 (2) 中没有为 $\Delta(x, \tilde{x})$ 和 $c^T x$ 提供平衡的贡献。因此，他们建议将 $||c||_2$ 替换为 $|c^T
