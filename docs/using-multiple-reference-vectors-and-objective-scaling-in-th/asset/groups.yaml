    ## 7. 计算结果


    为了进行比较，我们使用了所谓的几何平均值 [26]，位移为 1。所有的 FP 变体都使用相同的随机种子扩展到整个集合上。在我们的表格中，我们始终报告 FP
    变体通过所有、部分或无种子找到解的实例数量。此外，我们计算了原始对间隙（gap()）、运行时间（time(s)）和迭代次数（iter），它们是对于由至少一个我们比较的
    FP 变体求解的所有实例的位移平均值。这里，原始对间隙是一个 0% 到 100% 之间的数值，定义如下：


    **定义 7.1.** 设 $\tilde{x}$ 为 MIP 的解，$\tilde{x}_{opt}$ 为该 MIP 的最优（或最佳）解。我们相对于 $\tilde{x}$
    将原始对间隙 $\gamma \in [0, 1]$ 定义为：


    ```latex

    $$\gamma_{\tilde{x}}(\tilde{x}) := \begin{cases} 0, & \text{if } |c^T\tilde{x}_{opt}|
    = |c^T\tilde{x}| = 0, \\ 1, & \text{if } c^T\tilde{x}_{opt} \cdot c^T\tilde{x}
    < 0, \\ \frac{|c^T\tilde{x}_{opt} - c^T\tilde{x}|}{\max\{|c^T\tilde{x}_{opt}|,
    |c^T\tilde{x}|}}, & \text{otherwise.} \end{cases}$$

    ```


    在所有表格中，我们用蓝色和**粗体**突出显示比参考运行（每个表格的第一行）至少好 10% 的值。比参考值至少差 10% 的值则用红色和*斜体*标记。在所有
    89 种实例-种子组合中，我们统计了获胜次数，即 FP 变体在原始对间隙、运行时间和迭代次数方面提供至少 10% 改进的实例数量。和之前一样，如果获胜次数超过失败次数超过
