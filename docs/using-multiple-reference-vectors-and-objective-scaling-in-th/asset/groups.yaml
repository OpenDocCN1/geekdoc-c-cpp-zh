    # Appendix A. Proof of Theorem 4.1


    Proof. If $\lambda_i=0$ for all $i \in \mathcal{L}$, the claim clearly holds.
    Assume there exists an $i \in \mathcal{L}$ $\lambda_i>0$. The distance function
    $\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ can be rewritten as:


    $$\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}}) = \sum_{i \in \mathcal{L}}
    \lambda_i \Delta(x, \tilde{x}^i) = \sum_{i \in \mathcal{L}} \lambda_i \|x - \tilde{x}^i\|_1
    = \sum_{i \in \mathcal{L}} \sum_{j \in \mathcal{J}} \lambda_i |x_j - \tilde{x}_j^i|
    = \sum_{j \in \mathcal{J}} \sum_{i \in \mathcal{L}} \lambda_i |x_j - \tilde{x}_j^i|
    = f_j(x_j)$$


    Thus, $\Delta(x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})$ is the sum of
    $|\mathcal{J}|$ terms $f_j(x_j)$, where each term depends only on variable $x_j$.
    Here, the set of minimizers $S := \arg \min (x, \tilde{X}_{\mathcal{L}}, \Lambda_{\mathcal{L}})
    x \in \mathbb{R}^n$ is the Cartesian product over the $|\mathcal{J}|$ sets $\arg
    \min f_j(x_j), j \in \mathcal{J}. x_j \in \mathbb{R}$.


    Note that $f_j(x_j) > f_j(\min_{i \in \mathcal{L}} \tilde{x}_j^i)$ for all $x_j
    < \tilde{x}_j^i$, and $f_j(x_j) > f_j(\max_{i \in \mathcal{L}} \tilde{x}_j^i)$
    for all $x_j > \tilde{x}_j^i$. Therefore, $f_j$ attains its minimum in $[\min_{i
    \in \mathcal{L}} \tilde{x}_j^i, \max_{i \in \mathcal{L}} \tilde{x}_j^i]$.


    Now, assume there was a non-integer minimizer $x^* \in \mathbb{R}^n$ of $S$. Then
    there exists $r \in \mathcal{J}$ such that $x_r^* \notin \mathbb{Z}$. Since $x^*$
    is a minimizer of $f_r$, it holds that $f_r(x_r^*) \leq f_r(x_r)$ for all $x_r
    \in \mathbb{R}$. (*)$


    Consider the sets $L_r, U_r \subseteq \mathcal{L}$ defined as

    $L_r := \{i \in \mathcal{L} : \tilde{x}_i^* < x_r^*, i \in \mathcal{J}\},$ and
    $U_r := \{i \in \mathcal{L} : \tilde{x}_i^* > x_r^*, i \in \mathcal{J}\}$.


    Since $x_r^* \notin \mathbb{Z}$, it holds that $L_r \cup U_r = \mathcal{L}$. Then,


    $$f_r(x_r^*) = \sum_{i \in \mathcal{L}} \lambda_i |x_r^* - \tilde{x}_i^*| = \sum_{i
    \in L_r} \lambda_i |x_r^* - \tilde{x}_i^*| + \sum_{i \in U_r} \lambda_i |x_r^*
    - \tilde{x}_i^*| = \sum_{i \in L_r} \lambda_i (x_r^* - \tilde{x}_i^*) + \sum_{i
    \in U_r} \lambda_i (\tilde{x}_i^* - x_r^*) = \left( \sum_{i \in L_r} \lambda_i
    - \sum_{i \in U_r} \lambda_i \right) = \Delta L_r x_r^* + \sum_{i \in L_r} \lambda_i
    \tilde{x}_i^* - \sum_{i \in U_r} \lambda_i \tilde{x}_i^* = \tau_r$$


    From the choice of $L_r$ and $U_r$, it follows that for all $x_r \in [[x_r^*],
    [[x_r^*]]$, $f_r(x_r) = \Delta L_r x_r + \tau_r$.


    We distinguish the following cases:

    - $\Delta L_r < 0$: If $x_r^* > 0$ which shows that $\Delta L_r = 0$, and $[x_r^*]$
    are minimizers of $f_r$. Therefore, for any $j \in \mathcal{J}$ there exists an
    integer minimizer of $f_j$, which shows the existence of an integer vector in
    $S$.


