    \ (EURO). This is an open access article under the CC BY-NC-ND license (http://creativecommons.org/licenses/by-nc-nd/4.0/).\n\
    \n# 1. Introduction\n\nMixed-integer programming is widely used for modeling and\
    \ solving challenging optimization problems that arise from real-world applications.\
    \ We define a mixed-integer program (MIP) in matrix and vector notation as follows:\n\
    \n**Definition 1.1.** (mixed-integer program) Let $m, n \\in \\mathbb{Z}_{\\ge0}$.\
    \ Given some matrix $A \\in \\mathbb{Q}^{m\\times n}$, vectors $b \\in \\mathbb{Q}^{m},\
    \ c \\in \\mathbb{Q}^{n}, u \\in \\mathbb{Q}^{n} \\cup \\{\\pm\\infty\\}$, and\
    \ a set of indices $I \\in \\mathbb{N} :=\\{1,\\dots,n\\}$, a problem in the form\n\
    \n```\n\\begin{aligned} \\min_{x\\in X} & & c^T x \\ \\text{s.t.} & & Ax \\le\
    \ b \\ & & l \\le x \\le u \\ & & x_j \\in \\mathbb{Z} \\quad \\text{for all }\
    \ j\\in I, \\end{aligned} (1)\n```\n\nis called a mixed integer program (MIP).\n\
    \nFinding a feasible solution to a given mixed integer programming (MIP) model\
    \ is very important, $NP$-complete problem that can be extremely hard in practice\
    \ and is often approached via primal heuristics [1,2]. The most successful schemes\
    \ for finding initial feasible solutions for MIPs is the Feasibility Pump, originally\
    \ proposed of Fischetti, Glover, and Lodi [3].\n\nThe fundamental idea of all\
    \ FP algorithms is to construct two sequences of points that hopefully converge\
    \ to a feasible solution to a given optimization problem; in a MIP. One sequence\
    \ consists of points that are feasible for a continuous relaxation (typically\
    \ the LP relaxation), but possibly integer infeasible. The other sequence of points\
    \ are an integral but might violate some of the imposed (linear) constraints.\
    \ The next point of each sequence is always generated by minimizing the distance\
    \ to the last point of the sequence, using different measures in either case (e.g.,\
    \ $\\ell_{1}$ and the $\\ell_{2}$ norm). For an overview of FP variants, we refer\
    \ to [4].\n\nThe outline of this paper is as follows. In Section 2 we describe\
    \ the core idea of FP, concentrating on the Feasibility Pump 2.0 (OFP), which\
    \ is the baseline of our work. In Sections 3 and 4, we describe one of our two\
    \ contributions, namely variations of all stages of the FP algorithm to consider\
    \ multiple reference vectors in each. Stage 5 describes our second contribution,\
    \ namely the application of an alternative objective scaling method, to better\
    \ balance optimality and feasibility considerations. Finally, in Sections 6 and\
    \ 7 we present computational results with a detailed comparison in both an embedded\
    \ and a standalone setting.\n\n# 2. The Feasibility Pump 2.0\n\nThe Feasibility\
    \ Pump (FP) was originally introduced by Fischetti et al. [3]. In Algorithm 1,\
    \ we outline the principle of FP. In the main loop (pumping loop) the algorithm\
    \ constructs two sequences of vectors $\\{\\tilde{x}^k\\}_{k=1}^K$ and $\\{\\\
    hat{x}^k\\}_{k=1}^K$ for a finite $K$. These sequences satisfy the feasibility\
    \ requirements of the MIP, e.e., more precisely, the first sequence contains LP-feasible\
    \ vectors, $P = \\{x \\in \\mathbb{R}^n | Ax \\le b, l \\le x \\le u\\}$, and\
    \ the second contains integer vectors, e.e., that satisfy integrity constraints\
    \ but are not LP-feasible. The goal of FP is to iteratively reduce the distance\
    \ between the two sequences and converge to a feasible solution. The distance\
    \ between two vectors $\\tilde{x}^k$ and $\\hat{x}^k$ is defined as\n\n$$\\Delta(\\\
    tilde{x}^k, \\hat{x}^k) := \\sum_{j \\in I} |\\tilde{x}^k_j - \\hat{x}^k_j|$$\n\
    \nIn every iteration $k$, the vector $\\tilde{x}^k$ is obtained in the rounding\
    \ step (line 5), by rounding all values $\\tilde{x}^{k-1}_j \\notin \\mathbb{Z}$\
    \ with $j \\in I$ to integer values. The vector $\\tilde{x}^k$ is obtained in\
    \ the projection step (line 8) by solving the optimization $\\min(\\Delta(x, \\\
    hat{x}^k) : x \\in P)$.\n\n$\\Delta(x, \\hat{x}^k)$ requires the addition of auxiliary\
    \ variables and constraints for every $\\hat{x}^k, j \\in I$ with $l_j < \\hat{x}^k_j\
    \ < u_j$. More specifically $\\Delta(x, \\hat{x}^k)$ can be written as\n\n$$\\\
    Delta(x, \\hat{x}^k) = \\sum_{j \\in I: \\hat{x}^k=l_j} (x_j - l_j) + \\sum_{j\
    \ \\in I: \\hat{x}^k=u_j} (u_j - x_j) d_j$$\n\nwhere the auxiliary variables $d_j$\
    \ satisfies the constraints $d_j \\ge \\tilde{x}^k_j - x_j$ and $d_j \\ge x_j\
    \ - \\tilde{x}^k_j$. For binary MIPs, no auxiliary variables and constraints are\
    \ required.\n\nOne major issue of FP is cycling. During the pumping loop, it can\
    \ happen that the current integer vector $\\tilde{x}^k$ is the same as a previous\
    \ integer vector $\\tilde{x}^r$. If the cycle has length one, hence $r = k-1$,\
    \ a \"slight\" perturbation is applied to $\\hat{x}^k$, which means that a small\
    \ number of its integer components are chosen and their value is flipped. In the\
    \ case of a cycle with a length greater than one, a \"strong\" perturbation, also\
    \ known as a restart, is applied. In general, frequent use of perturbations and\
    \ restarts is considered not desirable, since they often counteract the progress\
    \ on reducing the distance of the two sequences.\n\n**Algorithm 1**: Feasibility\
    \ Pump (core idea).\n**Input**: A MIP in the form (1), $k$\n**Initialization**:\
    \ $\\tilde{x}^0 \\leftarrow \\arg\\min\\{c^T x : x \\in P\\}$, $k \\leftarrow\
    \ 0$\n**Output**: A feasible solution of the MIP or $\\tilde{x}$ if no found\n\
    **while** not (termination condition) do\n  $k \\leftarrow k+1$\n  **if** $\\\
    tilde{x}^{k-1}$ is integer then\n    **return** $\\tilde{x}^{k-1}$\n  $\\tilde{x}^k\
    \ \\leftarrow \\text{round}(\\tilde{x}^{k-1})$ // Rounding step *\n  **if** cycle\
    \ detected then\n    $\\tilde{x}^k \\leftarrow \\text{perturb}(\\tilde{x}^k)$\
    \ // Perturbation step *\n  $\\tilde{x}^k \\leftarrow \\arg\\min{\\Delta(x, \\\
    hat{x}^k) : x \\in P\\}$ // Projection step *\n**return** $\\emptyset$\n\nThe\
    \ computational experiments in [3] show that FP has a satisfactory success rate\
    \ for finding feasible solutions for binary MIPs. However, for MIPs with both\
    \ binary and integer variables, the success rate of FP is lower, and the algorithm\
    \ is more likely to cycle.\n\nBertacco et al. [5] proposed to split FP in three\
    \ stages. In Stage 1, the integrality constraints on the general integer variables\
    \ are relaxed before the execution of the pumping loop. Hence, Stage 1 searches\
    \ for a \"binary\" feasible solution, i.e., an LP-feasible vector satisfying the\
    \ integrality constraints on binary variables. Then, in Stage 2 the integrality\
    \ constraints on general integers are restored and the pumping loop proceeds.\
    \ The main idea of Stage 3 is to search for feasible solutions in the proximity\
    \ of an \"almost\" feasible integer vector. Therefore, the original MIP is solved\
    \ by replacing the objective function by the distance $\\Delta(x, \\tilde{x}^*)$,\
    \ where $\\tilde{x}^*$ is the vector closest to the polyhedron $P$ obtained in\
    \ the previous stages.\n\nA major drawback of FP is that it considers the original\
    \ objective of the MIP only in the initialization phase. Thus, the objective value\
    \ of the final solution is of low quality.\n"
