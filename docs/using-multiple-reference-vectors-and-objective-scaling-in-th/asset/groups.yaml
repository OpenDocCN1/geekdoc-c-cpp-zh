    **Corollary 4.3.** Let $\mathcal{L}=\{1, \dots, k\}$ be the set of indices of
    $k \in \mathbb{N}$ integer vectors $\tilde{x}^1, \dots, \tilde{x}^k \in \mathbb{Z}^n$.
    Further, $\lambda_i \ge 0$ for all $i \in \mathcal{L}$, and $\Delta(x, X_{\mathcal{L}},
    \Lambda_{\mathcal{L}})$ be defined as (5). If for any two disjoint sets $U, V
    \subseteq \mathcal{L}$ with $U \cup V=\mathcal{L}$ it holds that


    $$\sum_{i \in U} \lambda_i \neq \sum_{i \in V} \lambda_i. (8)$$


    then the set of minimizers of $\Delta(x, X_{\mathcal{L}}, \Lambda_{\mathcal{L}})$
    over $\mathbb{R}^n$ contains integer vectors.


    Corollary 4.3 introduces a condition on the weights $\Lambda_{\mathcal{L}}$, which
    ensures the integrality of the minimizers of (5). However, this does not imply
    that any set of weights fulfilling this condition is an appropriate choice for
    the projection step FP. For instance, if any iteration $k$ holds that $\lambda_i
    = \lambda_j = \dots = \lambda_{k-1} > \lambda_k$, then (8) is obviously fulfilled.
    But as $k$ gets larger, the distance function changes less and less, leading to
    stalling in the FP algorithm. Therefore, we suggest considering only a few integer
    vectors and $\Lambda_{\mathcal{L}}$ to achieve the above behavior. Based on the
    results of Melo [10] we consider three reference vectors in iteration $k$ with
    geometric properties (0.5, 0.25, 0.125). The first one is $\tilde{x}$ and the
    remaining two are obtained integer vectors with the smallest sum of variation
    over all constraints.


    By design, using multiple reference vectors in Stages 1 and 2 leads to smaller
    changes of the distance function in the projection step objective, which can be
    seen as taking smaller "steps" towards convergence at staying close to good feasible
    solutions. This is expected to come with a slightly increased number of iterations
    that are traded for better solution quality. Note that this might not necessarily
    be desired when running FP with strict iteration limits.


    Considering information from previous iterations in the projection step may increase
    the probability of cycling, since the distance function in the objective may not
    change during the pumping loop. Therefore, it is essential to provide different
    ways to escape cycles, since an increased number of random perturbations, and
    especially restarts, may drastically reduce the success rate of FP [6]. For instance,
    if a cycle of length one is detected, i.e., $\tilde{x}^k = \tilde{x}^{k-1}$, normally
    a small number of integer components of $\tilde{x}^k$ set to a different integer
    value. One effective way of breaking this cycle is to reset the weights $\Lambda_{\mathcal{L}}$
    and repeat the iteration $k-1$. Intuitively, since we reduce the value of $\lambda_{k-1}$,
    i.e., reduce the contribution of $\Delta(x, x^{k-1})$ in (5). In that case a cycle
    of length greater than one is detected, i.e., $\tilde{x}^k = \tilde{x}^l$ for
    some $l \in \{1, \dots, k-2\}$, the restart mechanism can be avoided in a similar
    way. For instance, if $l \in \mathcal{L}_{active}$, we decided to use the original
    projection step of FP for one iteration by setting $\lambda_k = 1$, $\lambda_i
    = 0, i \in \mathcal{L}\setminus\{k\}$ to ignore all information from previous
    iterations. Lastly, if the cycle persists or a new cycle is detected, we apply
    the usual restart of FP.


    ## 5. Alternative objective scaling


    After experimenting with the problem instance misc07, Pragnac et al. [11] observed
    that for this the fixed scaling terms $||\Delta||_2$ and $||c||_2$ do not provide
    a balanced contribution of $\Delta(x, \tilde{x})$ and $c^T x$ in (2). Therefore,
    they proposed to replace $||c||_2$ with $|c^T \tilde{x}|$, where $\tilde{x}$ is
    the LP-feasible vector obtained in the projection step of the previous iteration.
    This modification resulted in a more balanced contribution of the two objective
    terms for this specific problem instance. However, no comparison over a large
    test set was presented.


    Inspired by this idea, we propose to replace the scaling term $||\Delta||_2$ by
    the dynamically changing term $|\Delta(\tilde{x}^{k-1}, x)|$ in addition to the
    scaling suggested above. In the spirit of this work, one of these modifications
    as considering information from previous iterations in the projection step.


    Recall that FP aims at minimizing the distance of the vectors $\tilde{x}$ and
    $\tilde{x}$, and reach convergence. Thus, it is expected that the components of
    $\tilde{x}$ and $\tilde{x}$ do not differ much from the corresponding components
    of $\tilde{x}^{k-1}$ and $\tilde{x}^{k-1}$. In, the projection step we also observe
    that $\Delta(x, \tilde{x})$ and $c^T x$ will acquire close values to $\Delta(\tilde{x}^{k-1},
    \tilde{x})$ and $c^T \tilde{x}^{k-1}$, respectively. Therefore, the suggested
    scaling should provide a more balanced contribution of the two objective.


    $$\Delta_{\alpha_k}(x, \tilde{x}) = (1-\alpha_k)\Delta(x, \tilde{x}) + \alpha_k
    \frac{|\Delta(\tilde{x}^{k-1}, x)|}{|c^T \tilde{x}^{k-1}|}c^T x$$


    ## 6. Setup


    After experimenting with the problem instance misc07, Pragnac et al. [11] observed
    that for this the fixed scaling terms $||\Delta||_2$ and $||c||_2$ do not provide
    a balanced contribution of $\Delta(x, \tilde{x})$ and $c^T x$ in (2). Therefore,
    they proposed to replace $||c||_2$ with $|c^T \tilde{x}|$, where $\tilde{x}$ is
    the LP-feasible vector obtained in the projection step of the previous iteration.
    This modification resulted in a more balanced contribution of the two objective
    terms for this specific problem instance. However, no comparison over a large
    test set was presented.

