    中的值，对原始 MIP 求解一个整数变量边界更紧凑的子 MIP。为此，对于每个 $j \in Z$，如果 $\bar{x}^0$ 是整数，则 $x_j$ 固定在该值；否则，$x_j$
    的边界被收紧到 $\bar{x}^0$ 最近的整数值，$L_j$ 设置为 $[L_j^0]$，$u_j$ 设置为 $[U_j^0]$。总结来说，RENS 求解子
    MIP


    ```

    $\min \min x \in \mathbb{R}^n

    Ax \leq b

    ns.t.

    L_j \leq x_j \leq u_j \text{for all } j \notin \mathcal{I}.

    [L_j^0] \leq x_j \leq [U_j^0] \text{for all } j \in \mathcal{I}.

    x_j \in \mathbb{Z} \text{for all } j \in \mathcal{I}$.

    ```


    在实践中，如果只有一小比例的整数变量被分配了更紧的边界，求解 (3) 可能会产生计算开销。相反，在许多情况下，RENS 收紧了过多的变量边界，导致 (3)
    不可行 [8]。在接下来，我们建议将 RENS 与从 FP 阶段 1 和阶段 2 获取的信息结合。通过循环，FP 生成了一系列 LP 可行的向量 $\tilde{x}^0,
