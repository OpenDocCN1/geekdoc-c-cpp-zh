    \n# Using multiple reference vectors and objective scaling in the Feasibility\
    \ Pump\n\n![](img/ce617cbf3f63b50f5e5f3c3ddb99fec4_0_2.png)\n\nGioni Mei<sup>a</sup>\
    \ Timo Berthold<sup>b,*</sup> Domenico Salvagnin<sup>c</sup>\n\n* *a Zuse Institute,\
