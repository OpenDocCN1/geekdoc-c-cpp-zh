    # 在可行性泵算法中使用多个参考向量和目标函数缩放


    ![](img/ce617cbf3f63b50f5e5f3c3ddb99fec4_0_2.png)


    Gioni Mei<sup>a</sup> Timo Berthold<sup>b,*</sup> Domenico Salvagnin<sup>c</sup>


    * *a 德国柏林 Zuse 研究所, Takstraße 7, 14195

    * *b 德国法兰克福 Fair Isac Deutschland GmbH, An der Weise 10, 60322

    * *c 意大利帕多瓦大学, Via Gradenigo 6/B, 35131, Padova


    ## 文章摘要


    关键词：

    混合整数规划

    原始启发式算法


    可行性泵（Feasibility Pump, FP）是混合整数规划（MIP）中最为人知的原始启发式算法之一：超过 15 篇论文对其所有步骤提出了各种修改。到为止，还没有变体考虑跨多次迭代的信息，但它们都保持了朝着单一参考点优化的原则。在本文中我们评估了在
    FP 算法所有阶段中使用多个参考向量的效果。特别是，我们使用主循环期间获得的 LP 可行向量在进入计算核心之前收紧变量域，我们将该过程称为 mRENS。我们考虑在
    mRENS 中引入多个参考向量以进一步探索优化方向，并引入替代性的目标缩放项，以平衡距离函数与原始 MIP 目标之间的贡献。


    我们的计算实验表明，新方法可以提高在广义 MIP 测试集上的性能。具体而言，我们的改进在嵌入式设置中提供了 29.3% 的解改进和 4.0% 的运行改进，在大型
    MIP 实例集上的迭代次数减少了 16.0%。此外，该方法的成功率在前几次迭代中持续增加。我们还观察到适中的性能，这使得我们版本的 FP 适用于该算法的两个主要用例。


    > * 通讯作者。

    邮箱：timoberthold@fico.com (T. Berthold)。


    https://doi.org/10.1016/j.ejco.2023.100066

    2192-4400 © 2023 作者。由 Elsevier Ltd 代表欧洲运筹学协会 (EURO) 出版。这是一篇基于 CC BY-NC-ND 许可的开放访问文章（http://creativecommons.org/licenses/by-nc-nd/4.0/）。


    # 1. 引言


    混合整数规划广泛用于建模和解决源于现实世界应用的挑战性优化问题。我们用矩阵和向量符号将混合整数规划（MIP）定义如下：


    **定义 1.1.**（混合整数规划）设 $m, n \in \mathbb{Z}_{\ge0}$。给定矩阵 $A \in \mathbb{Q}^{m\times
    n}$，向量 $b \in \mathbb{Q}^{m}, c \in \mathbb{Q}^{n}, u \in \mathbb{Q}^{n} \cup
    \{\pm\infty\}$ 以及索引集 $I \in \mathbb{N} :=\{1,\dots,n\}$，形式如下的问题：


    ```

    \begin{aligned} \min_{x\in X} & & c^T x \ \text{s.t.} & & Ax \le b \ & & l \le
    x \le u \ & & x_j \in \mathbb{Z} \quad \text{for all } j\in I, \end{aligned} (1)

    ```


    被称为混合整数规划（MIP）。


    为给定的混合整数规划（MIP）模型寻找可行解是非常重要的，这是一个 $NP$-完全问题，在实践中可能极其困难，且通常通过原始启发式算法来处理 [1,2]。寻找
    MIP 初始可行解的最成功方案是可行性泵，它最初由 Fischetti, Glover 和 Lodi 提出 [3]。


    所有 FP 算法的核心思想是构造两个点序列，希望它们收敛到给定优化问题（即 MIP）的可行解。其中一个序列的点对于连续松弛（通常是 LP 松弛）是可行的，但在整数上可能是不可行的。另一个点序列是整数的，但可能会违反某些施加的（线性）约束。每个序列的下一个点总是通过最小化与该序列上上点的距离来生成的，在两种情况下都使用不同的度量（例如
    $\ell_{1}$ 和 $\ell_{2}$ 范数）。关于 FP 变体的概述，请参考 [4]。


    本文的结构如下：在第 2 节中，我们描述了 FP 的核心思想，专注于可行性泵 2.0 (OFP)，这是我们工作的基础。在第 3 和 4 节中，我们描述了两个贡献之一，即
    FP 算法所有阶段的变体，在每个阶段考虑多个参考向量。第 5 节介绍了我们的第二个贡献，即应用替代的目标缩放方法，以更好地平衡最优性和可行性的考虑。最后，在第
    6 和 7 节中，我们展示了计算结果，并在嵌入式和独立设置下进行了详细比较。


    # 2. 可行性泵 2.0


    可行性泵（FP）最初由 Fischetti 等人引入 [3]。在算法（Algorithm 1）中，我们概述了 FP 的原理。在主循环（泵循环）中，算法构造了两个向量序列
    $\{\tilde{x}^k\}_{k=1}^K$ 和 $\{\hat{x}^k\}_{k=1}^K$，其中 $K$ 有限。这些序列满足 MIP 的可行性要求，更准确地说，第一个序列包含
    LP 可行向量 $P = \{x \in \mathbb{R}^n | Ax \le b, l \le x \le u\}$，第二个序列包含整数向量，即满足完整性约束但不是
    LP 可行的。FP 的目标是迭代减少两个序列之间的距离并收敛到可行解。两个向量 $\tilde{x}^k$ 和 $\hat{x}^k$ 之间的距离定义为：


    $$\Delta(\tilde{x}^k, \hat{x}^k) := \sum_{j \in I} |\tilde{x}^k - \hat{x}^k|$$


    在每次迭代中，$\hat{x}^k$ 都通过最小化与序列上上一个点的距离来生成，在两种情况下都使用不同的度量（例如 $\ell_{1}$ 和 $\ell_{2}$
    范数）（注：此处原文公式似乎有缺失，此处根据上下文补全逻辑）。（注：原文此处可能存在排版中断，译文根据逻辑处理）


