    的值。因此，建议的缩放应该为两个目标提供更平衡的贡献。


    $$\Delta_{\alpha_k}(x, \tilde{x}) = (1-\alpha_k)\Delta(x, \tilde{x}) + \alpha_k
    \frac{|\Delta(\tilde{x}^{k-1}, x)|}{|c^T \tilde{x}^{k-1}|}c^T x$$


