    Like other board games, if a chess set is missing a given piece, it is understood
    that something else may act in substitution for that piece. Thus, a lofty bishop
    might end up being played by an acser or lipstick. In any event, the piece itself
    is viewed with its particular affordances and powers, having for both players
    all of the abilities and limitations of the rules that govern the piece. Using
    substitute objects in a game in this manner emphasizes that the transactions involved
    are so symbolically robust that the game’s rules and processes can allow for pieces
    to stand in for one another, for games to forge their own control over temporality,
