    # **Questions of Empowerment**


    As the work of Augusto Boal, the Situationists, and others have shown, subtle
    changes in art and game play may have larger ramifications when it comes to social
    change and activism. $ ^{49} $  Historical evidence proves these techniques can
    work. The resurgence in Situationist rhetoric in locative play projects is infused
    with a critique of consumerism, and offers the promise of locative play that leads
    to a form of empowerment for participants. Some proponents note, “Locative media
    strives, at least rhetorically, to reach a mass audience by attempting to engage
    consumer technologies and redirect their power. $ ^{50} $


    Yet there are reasons to tread carefully through the space of locative games.
    It is useful to recall Brian Sutton-Smith’s assertion that “play is never innocent.”
    $ ^{51} $ While play has long functioned as a tool for cultural transmission,
    and as a forum for empowerment and cultural change, it has also been ascribed
    a number of other functions. Ideas about the cultural role of play are at times
    conflicting. $ ^{52} $  Scholars frequently use terms involving choice, need,
    practice, and the like. To consider the idea of possibilities of liberation inherent
