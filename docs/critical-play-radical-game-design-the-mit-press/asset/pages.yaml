    gambling, children''s play, festival, sport, creative activities, and nonsense.
    Some of these have already been explored at length. ${}^{55}$ But the question
    remains: Can locative play reflect the contested nature of lived space? If technology
    is used, can it too reflect the realities bound to space? Is locative media work
    mistakenly aligned with the principles of psycho geography, which, by its very
    nature, is distinctly political? Few of the projects in this medium address key
    concerns like biotechnology, consumption, war, identity, militarization, or terrorism.
