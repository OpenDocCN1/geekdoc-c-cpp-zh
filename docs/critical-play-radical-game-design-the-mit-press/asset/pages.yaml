  md: 'abstract version of critical play, types of “allegories of philosophical systems”
    or in some interesting sense, an evolution of language.


    The work of Edgar Allan Poe is more successful as a form of critique. In his 1837
    story, “A Fable,” Poe’s obsession with repetition and palindromes is clear:


    > It was night, and the rain fell; and falling, it was rain, but, having fallen,
    it was blood. And I stood in the morass among the tall and the rain fell upon
    my head—and the lilies sighed one unto the other in the solemnity of their desolation.
    . . . And mine eyes fell upon a huge gray rock which stood by the shore of the
    river, and was lighted by the light of the moon. And the rock was gray, and ghastly,
    and tall,—and the rock was gray. Upon its front were characters engraved in the
    stone. . . . I turned and looked again upon the rock, and upon the characters;—and
    the characters were DESOLATION.


    Poe’s allegorical means for critical wordplay takes the human condition as its
    project. By creating transcendent linguistic expressions that also speak to the
    structure of expression itself, Poe’s language resembles secret, or nearly computational,
    codes whose rules of construction and operations are consistent and pervasive.


    # # Puns


    Known as the lowest form of humor, the pun is also one of the oldest and most
    typical modes of critical wordplay. Early writing systems, or protowriting, often
    contained a small number of signs in comparison to spoken communication. When
    a small number needs to be interpreted broadly, one sign can denote a range of
    possible meanings. Ancient literature in Mesopotamia, Egypt, Israel, and Greece
    demonstrate the importance of puns through historic examples. There is a transcription
    of a poem to a pharaoh’s chariot, which is in some way translatable:


    > The *wheels* of thy chariot—

    Thou *wieldest* thy battle-axe.

    The *scythe* of thy chariot—

    Draws *sighs* from all nations


    Nineteenth-century Egyptologist Adolph Erman was puzzled by the apparently significant
    amount of time spent on puns in the ancient world. More recent work by Scott Noegel,
    a specialist in ancient language play, notes that ancient cultures were fascinated
    by puns, but for reasons other than humor or rhetoric. Like early board games,
    most early examples of wordplay were used as a guide to divine questions.'
