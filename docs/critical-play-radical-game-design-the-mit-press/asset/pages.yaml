  md: 'or instruction cards to create situations that are indeed artworks is said
    to have originated with John Cage in the courses he taught at The New School for
    Social Research in New York City from 1956 to 1960. Cage, in his focus on creating
    everyday actions as art actions, draws Huiizinga’s magic circle around the activity,
    making it a game, placing it into fantasy. ${}^{70}$ Philosopher Herbert Spencer
    notes that in actions like these “play and art are the same activity because neither
    suberves, in any direct way, the processes conducive to life and neither refers
    to ulterior benefits, the proximate ends are the only ends.” ${}^{71}$


    The work of these artists demonstrates a particular potency in subversive acts
    through participatory play. Several Fluxus artists engaged with language games,
    but these often relied on performance to be realized. Nevertheless, some should
    be included here. Ono’s series of *Instruction Paintings* are among the most important
    art artifacts from the twentieth century, for they take conceptual art to a new
    level by refusing the evidence of the art object itself. Often distributed on
    throwaway cards in the gallery, Ono gave participants instructions on how to create
    the artwork themselves. Investigating the medium of painting and the act of image
    making, Ono’s ultimate goal was participatory art. Her work *Painting to Be Stepped
    On* (1960) includes instructions that makers should “Leave a piece of canvas or
    finished painting on the floor or in the street.” In 1961, Ono exhibited the *Instruction
    Painting* at George Maciunas’s AG gallery in New York City, inviting visitors
    to drip water on the *Waterdrop Painting*, or walk by the *Shadow Painting*, a
    blank canvas hung on a gallery wall, its fleeting images merely created by the
    shadows of the visitors. ${}^{72}$


    *Painting to See the Skies* (1961) is one of Ono’s many *Instruction Paintings*.
    These paintings may be read in the tradition of Fluxus works, or scores, that
    position the viewer as the “fuser” or creator of the work merely by putting an
    image, thought, or sound together in the viewer’s head. In *Painting to See the
    Skies*, Ono enc encourages the visitor to merely view the sky. Ono’s model of
    instruction making was later used by other conceptual artists such as Allan Kaprow
    and George Shaw in their performance and performance documentation work. ${}^{73}$
    The instruction poems read as little “programs” directing the viewer to more consciously
    become a participant:


    SUN PIECE

    Watch the sun until it becomes square.

    1962 winter


    TOUCH POEM FOR A GROUP OF PEOPLE

    Touch each other.

    1963 winter ${}^{74}$'
