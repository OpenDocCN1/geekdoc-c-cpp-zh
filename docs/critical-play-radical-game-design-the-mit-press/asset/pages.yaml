  md: 'something new, beautiful, puzzling, or surprising, or to touch on an artifact
    or process that helps one experience the artistic process or the mysterious mind.
    At other times, performance is pure amusement. As Breton reflected in the 1950s:


    > If there is one activity in Surrealism which has most invited the derision of
    imbeciles, it is our persistent playing of games, which can be found throughout
    most of our publications over the last thirty-five years... right from the start
    it proved useful for strengthening the bonds that united us, and for encouraging
    sudden awareresses of our desires whenever these were held in common. Furthermore,
    the urgent need we felt to do away with the old antinomies that dominate work
    and leisure, “wisdom” and “folly,” etc.—such as action and dream, past and future,
    sanity and madness, high and low, and so on—disposed us not to spare that of the
    serious and the non-serious (games).³⁰


    Performance can also be of use to push through expected cultural norms. Dali adopted
    the methodological approach of “paranoia criticism” in 1929 with a proposal to
    discredit reality and break with the external world so that “irrational knowledge
    based on the interpretive critical association of delirious phenomena” could result.³¹
    After deciding to be one of the enlightened “confusionists,” Dali supported anything
    that could question, even ruin, the core ideas of family, homeland, and religion
    through “systematized confusion.”³² To Dali and others, the paranoiac mind perceives
    signs, but creates extra, new, unexpected, or deluded instantaneous links, making
    new relationships of meaning by playing with the signifier-signified relationship.
    This procedure, along with the other gaming methods described earlier, may be
    considered one of Surrealism’s central contributions to modern art.


    Writer and photographer Claude Cahun (1894–1954) worked along similar lines. Cahun
    met André Breton in 1932. Like other women artists, she was an outsider to a movement
    that had problems negotiating the complex state of gender and, as a lesbian, she
    had little chance to be defined in relationship to other men, issues not unknown
    to other women in the Surrealist movement.³³ In her practice, Cahun investigated
    power and personal/social identity, applying Dali’s strategy of “the paranoiac-critical
    method” to photography and mixed-media object collages. In her writing, Cahun
    was political, espousing a “theory/practice” approach to equalize and integrate
    the making of things and the research about them; Cahun sought to understand how
    objects functioned, and how worker relations functioned in systems such as capitalism
    or communism. Of Objet (1938), a table-top-sized assembly of design elements set
    into wood, Harris notes the investigating, gesturing hand motioning toward an
    open eye, set on its edge, referencing female genitalia.³⁴ Gender and sexuality
    were significant themes in Cahun''s'
