    # The Spiritual Side of Board Games


    While the focus of much humanities research in the late twentieth and early twenty-first
    centuries has shifted to popular culture and, in particular, the struggle to legitimize
    a study of everyday life—here de Certeau, Lefebvre, and, more recently, Highmore
    should be noted—the study of games has lagged behind. But games are legitimate
    forms of media, human expression, and cultural importance, and the ways games
    reflect the norms and beliefs of their surrounding cultures is essential to understanding
    both games themselves and the insights they may provide into human experience.
    In this playculture approach to media, board games become one of several artifacts
    of material culture used to trace social practices and beliefs. Game actions and
    rules can be characterized as principal play features, and these foci are not
    unique to games but are also shared across language systems, social orders, and
    ties of kinship, law, and ritual.


    Scholars of game history, including Murray, Brumbaugh, and Austin, have researched
    some of the lineage of particular games. For example, backgammon could have been
    influenced by both the ancient Egyptian game Senet and Mesopotamian Ur. For those
    trying to record how these games functioned, the rules are traced, the game pieces
    are codified, and the documents that reference game play are collected. What tends
    to be overlooked by many current scholars of games is their purpose beyond the
    pastime; in some cases, scholars may lose sight of the fact that certain games
    were not intended as pastimes at all. Even Murray, the noted and prolific twentieth-century
    game scholar, avoids, and even at times disparages, games'' spiritual connections,
