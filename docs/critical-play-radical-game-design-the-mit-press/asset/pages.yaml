    Readers may notice that many of the projects discussed in this chapter that appear
    most sensitive to issues of space, location, and place *also* happen to be those
    that involve minimal technologies or remove technologies altogether. Here, I would
    like to suggest that it is not due to some inherent bias against technologies,
    but rather, that the design of locative play and games might evolve to take into
    account the lived experience of those spaces, and the mediated experience of such
    spaces as a secondary issue. While inhabitants of cities often experience these
    phenomena as one and the same thing, this is not typically the central or unifying
    feature of the locative media projects previously critiqued. These “low-tech”
    experiences also closely match the ethos of Situationist exploration, spending
    less time on the technological means for creating a project and choosing instead
    to interrogate the conceptual concerns surrounding their staging.


    This type of interrogation is key to developing ethical media projects that can
    also challenge, inquire, and empower. As geographer Don Mitchell notes, social
    change continues to entail a street-centered reclamation of public space by creating
    disorder where there was once order, or by challenging a particular way a space
    has in the past been experienced.74 While there is opportunity for protest and
    empowerment through play, play also must be carefully organized to have a lasting
    and meaningful impact. Space must be understood, ordered, and reexamined, and,
    where technology is used in a project design, that technology must begin to reflect
    the contested nature of the lived reality of such spaces.


    # Hybrid Play?


    What happens when game makers and players begin to blend spaces such as public
    urban space and online game space? These instances of play bounded by space offer
    yet another social critique of the influence of electronic games. Computer games
    especially can be seen as critical frameworks that engage space and, when used
    in the context of artistic practice, become environments in which player-participants
    can make meaning that directly relates to urban spaces. There are additional deep
    ties to interventionist art practices in viewing the fluidity of performance,
    the city, and the simultaneous reading and authoring of social interaction in
    electronic game worlds. In turn, artists’ appropriation of games in large-scale,
    public spaces presents a potent approach to social change.


    Here, the projects of game designer Katie Salen are useful for thinking about
    performance and games. Her *Big Urban Game*, mentioned earlier in this chapter,
    was designed by Salen, Nick Fortuono, and Frank Lantz to call attention to urban
    planning'
