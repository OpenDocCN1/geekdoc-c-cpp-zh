  md: 'and in the formation of new stylistic formulae—for instance, a game dealing
    with the constructed nature of architecture, or the expressive compositional nature
    of other forms of art.


    # Performative Objects


    How did a broad range of artist-performers create a context for critical play
    in their painting, photography, installation, and scenarios? As with technological
    change, shifts in playculture parallel the upheaval of world events like economic
    depression, world war, or cultural and social movements. Cinema had a great effect
    on twentieth-century art movements, though historical accounts of art history
    generally downplay film’s contributions as “low art.” Nevertheless, while Marcel
    Duchamp was asking his audience to make its own decisions about the nature of
    art, American cinema fans were doing just that through the development of fan
    culture.⁷ Film fans, usually avid consumers of popular culture as well as members
    of the working class, were more than passive viewers, even in the early years
    of Hollywood. Women were a major creative force from the 1910s on.¹⁰ During the
    1930s, in what is now a clear illustration of fans interacting with larger cinema
    culture, Louis B. Mayer, MGM studio head, initiated a fan-magazine contest to
    rename actress Lucille LeSueur. One fan submitted the name “Joan Crawford.”¹¹
    Popular magazines like Look (1937–1971) offered many opportunities for fans to
    interact with each other and with cinematic culture. Games, contests, and fabulous
    giveaway schemes were routinely planted in the popular press to excite the discussion
    surrounding movie stars. After all, audience participation, from viewing the artistic
    productions (the film), to gathering about red carpet showcases or forming audience-created
    fan clubs, helped create the media spectacle that has become integral to the entertainment
    industry.¹² This popular blend of spectator and media object, and of mediated
    and cultural participation, is not only facilitated by games, today it is also
    a hallmark of games themselves.


    The themes Hollywood relied on to launch a new movie or the latest star personalities
    were also reflected in the twentieth-century works of art, though perhaps for
    different reasons. Here, it is important to note the very divergent approaches
    to “art” and art practice at the start of the twentieth century. The fine arts
    had become a profitable business with collectors acting as “buyers” and artists
    playing the role of “independent contractors” who provided “products”—generally
    in the form of paintings. This business necessitated, and still necessitates,
    a set of narratives about what that product might represent. While political art
    groups such as the Futurists and Dadaists were shocking the adherents to the status
    quo by shouting “Down with art!,” part of their motivation was a desire to counteract
    the mainstream artists, such as Henri'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Matisse. Matisse and other traditional artists had long promoted the self-absorbed
    and now classic positionality of the “great artist.” Matisse wrote that his goal
    was “an art of balance, of purity and serenity, devoid of troubling or depressing”
    subjects; an art that possessed a “soothing quality, a calming influence.” These
    “classic” artists established the notion of aesthetic purity and beauty and the
    artist’s obligation to these expressions. They also promoted the belief that an
    artist’s style of expression always will emerge from the artist’s temperament.


    # Painting and Performance


    Other artists rejected the idea that art existed merely for self-expression and
    longed for larger truths. Painter Wassily Kandinsky’s (1866–1944) theoretical
    treatise *Über das Geistige in der Kunst* (*Concerning the Spiritual in Art*)
    (1912) moved away from a self-absorbed idea of purity and balance. Instead, Kandinsky
    discussed the idea of “inner necessity,” and searched for ways of revealing the
    spirit in a utopian, transcendent, automatic process.


    With these ideas in mind, radical artists of the twentieth century subverted art
    practices and the art world itself in both the forms and delivery of their works.
    Photography and film, for example, had altered the way Western twentieth-century
    artists conceived the world. In France, George Braque and Pablo Picasso developed
    Cubism as the logical next step in visual art representation. Their experiment
    was due to in part to notions of play and what it could produce in response to
    industrialization, war, and emerging technology. Manifestations of this media-rich
    world view can be found in Giacomo Balla’s *Dynamism of Dog on a Leash* (1912)
    and Duchamp’s famous Cubist painting, *Nude Descending a Staircase* (1919). These
    works built on other avant-garde practices—notably, those of the Futurists—who
    rallied around F. T. Marinetti’s *Futurist Manifesto* (1909). The mechanization
    of the image in Duchamp and Balla’s paintings demonstrates the effect new paradigms
    of time, consciousness, and production had on artists’ perception. Old methods
    of representations had been mastered and were sometimes judged inadequate by artists
    looking to express concerns of the day. This thinking set the stage for a series
    of radical shifts in creative work. The particular pieces by Duchamp and Balla
    also mark a significant shift toward abstraction and help lay the groundwork for
    conceptual art. It is the way play, rules, and motion are inextricably intertwined
    in their creation that sets these images apart from others as they are establishing
    a new symbiosis between technological change and play. When World War I unleashed
    terrible examples of the destructive powers of technology, the everyday perceptual
    and social disruptions caused by new technologies in art were just as profound.'
