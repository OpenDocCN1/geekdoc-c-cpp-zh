    events organized by Lithuanian born George Maciunas, Fluxus artists bypassed the
    museum and gallery circuit in favor of flexible performances, films, readymade-style
    kits, and publishing. Like the postwar groups Gutai, Cobra, and the Situationist
    International, Fluxus was a reactionary group, combining historical aspects of
    Futurist and absurdist theater, Dada irrationality, and the interest in chance
