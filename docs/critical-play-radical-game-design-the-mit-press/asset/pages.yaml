  md: 'In his essay "What Is Becoming?" Gilles Deleuze describes a state of event-centered
    being that is a fundamental way of experiencing play and interactive artworks.
    ⁶⁷ Most important, these works create a context for the production and reception
    of radical versions of social order through their emphasis on shifting the authority
    of the artist.


    Historical foundations for playculture—creative social networks and the combination
    of art, play, and subversion, must be examined for histories of play within "analog"
    twentieth-century art movements, especially histories demonstrating a significant
    interrogation of authority in artistic systems, an ability to empower users through
    participation, and dedicated questioning of normative behavior.


    Dada''s subversive practices in its rewoking of authority and authorship were
    one way social norms were pushed and literally "at play." The Dadaist critiques
    discussed here used participatory play, gaming as practice research, and interactivity
    to reflect everyday concerns and to unplay, reskin, rewrite, and, in some cases,
    actively redefine culture. The artistic experiments with games described in this
    chapter should serve as a provocative look at how artists can challenge objects,
    behaviors, and ideas and subsequently transform them.


    # Fluxus Language Play


    As noted earlier, like the Dadaists and Surrealists, Fluxus artists relied on
    humor, instructions, impermanence, and interactivity in a practice where the permanence
    of the object is trumped by the moment of experience. Created by a group of artists
    in the 1960s, Fluxus and its related magazine of the same name revolved around
    the artist-organizer George Maciunas (1931–1978), its name emphasizing both change
    and flow in the artists'' play, games, and "disposable" work. Fluxus broke from
    its Dada origins, shifting focus from the importance of the individual artist
    toward celebrating collective identities and alternate venues for artwork.⁶⁸ For
    many of the Fluxus artists, play and "the joke" evolved as a methodology, moving
    interaction and audience participation away from galleries and traditional theater
    environments and creating for the first time a kind of multiplayer artistic play
    space and environment. The approach of Fluxus artists seems much like the best
    creative works functioning on the Internet in the twenty-first century, or the
    work of emerging twenty-first century media collectives in that "Fluxus objectives
    are social (not aestheticic). They are connected to the group . . . Fluxus is
    definitely against art-objects . . . Fluxus therefore should tend towards collective
    spirit, anonymity and ANTI-INDIVIDUALISM.⁶⁹


    Several Fluxus artists created games as interventions that could work to open
    everyday life to more careful examination, rendering social moments as acts of
    exchange or opportunities to critique larger political situations. The Fluxus
    practice of making games'
