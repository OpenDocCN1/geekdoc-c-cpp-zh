  md: 'experts at appropriating spaces, objects, and the language of sociocultural
    production. They achieved results through specific methods and procedures, many
    of their own invention. Dada techniques included juxtaposition and fragmentation,
    the incorporation of a play with materials, and a play with language.


    Like Surrealism, Dada was also influenced by successful research processes of
    the past, especially *vers libre* and *Simultanism*, as well as by the intellectual
    upheavals initiated by Freudian psychology. In his wartime work at Nantes, André
    Breton attempted to use Freudian methods to psychoanalyze his patients. Many suffered
    from shell shock, and carried home the remarkable though disturbing images of
    war that captivated artists. Jacques Vaché, a wounded artist and soldier Breton
    met in the neurological ward, was one of many who concluded that war, culture,
    and art were all futile.[^1] It is no wonder that many twentieth-century practices
    of the avant-garde signaled a belief that places outside conscious human decision—for
    example, chance or the unconscious—were of primary importance for a society recovering
    from the events and alleged rationality of a terrible and incomprehensible war.
    It is also worth noting that most Dadaists and Surrealists were directly involved
    in the world wars. Writers Apollinaire and Vaché and artist Max Ernst (1891–1976)
    all served in the armed regiments during World War I.


    However, throughout Dada, what is prominent is a focus on language and the subversive
    powers of word games, randomness, and a sense of “natural order” acting in some
    ways as the “final frontier” and antidote to political prescriptions and announcements.
    In the fifth of his *Seven Dada Manifestos* (1916–1920), Tristan Tzara invited
    irrational and chaotic elements into his working process:


    ```

    To make a dadaist poem

    Take a newspaper.

    Take a pair of scissors.

    Choose an article as long as you are planning to make your poem.

    Cut out the article.


    Then cut out each of the words that make up this article and put them in a bag.

    Shake it gently.


    Then take out the scraps one after the other in the order in which they left the
    bag.


    Copy conscientiously.


    The poem will be like you.

    ```'
