  md: 'One of the most famous participatory Surrealist art activities is known by
    the French name cadavre exquis, or "exquisite corpse," after the first sentence
    it produced: "Le cadavre exquis boira le vin nouveau" ("The exquisite corpse shall
    drink the new wine"). Exquisite corpse is a multiplayer game in which players
    decide to create an image or text together. Each player either creates words along
    a pattern (such as the example of the corpse consuming the new wine) or draws
    on a folded section of a paper, so that when other players receive their section
    of the paper, it is folded so that the other players cannot see what has been
    drawn before. Some variations are to leave small link lines from one section to
    the next, so a drawing can continue, or give one word to the next player, so that
    the composition becomes seamless. Figure 5.2 offers an example of such a collaborative
    drawing from leading artists of the 1930s. Some scholars offer an analysis of
    exquisite corpse through a feminist lens, examining the constructed and mysterious
    nature of the "body" (or the artwork) of the exquisite corpse as a location of
    distress, both physically and psychologically. As collaborative works, these images
    might be interpreted as a manifestation of Jungian "collective unconscious."


    # Fumage


    In this technique, impressions are made by the smoke of a lamp or candle on paper
    or canvas. Fumage is similar to fortune-telling activities such as the reading
    of tea leaves and Hermann Rorschach''s inkblot tests developed for psychological
    research in 1921.


    # Movement of Liquid Down a Vertical Surface


    This is an abstract technique that creates images by allowing liquid to flow down
    a surface. While drip-paintings were not yet imaginable themselves as "art" products
    in fine arts circles even during the rebellious Dada and Surrealist periods, they
    could be valuable process works to tap the unconscious.


    # Would You Open the Door


    If there were a knock at the door, and you saw . . . a famous historical figure—an
    artist, for example, or a politician—would you let him or her in? Would You Open
    the Door was a Surrealist parlor game of question posing. If Guillaume Apollinaire
    came to the door, would you let him in? How about Joan of Arc? Instant-decision
    activities such as this prompted discussion in the group about politics, aesthetics,
    and ethics, and revealed the inner workings of the participants. The Would You
    Open the Door game is nearly identical to a popular French parlor game of the
    time, but it is focused on personalities of interest to the group of Surrealist
    artists, or those visitors deemed especially absurd.'
