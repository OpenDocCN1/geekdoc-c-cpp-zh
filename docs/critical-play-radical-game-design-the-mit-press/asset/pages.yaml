- pgno: 126
  md: 'All are important sources for activist game designers.² Artists have used wordplay
    on various levels, from including text in paintings to affronting language performances.
    The absurdist theatrical work of Alfred Jarry (1873–1907), the poetry of Dada
    artists, and the “code” of Fluxus artists each provide critical exploration through
    play with words. Artists and writers aim for subversion of romanticized norms,
    of existing systems of power, of authority, and of aesthetic associations in each
    of these categories.


    Even without representing text or pictographs, much ancient visual art incorporates
    subtle wordplay. Take, for example, a small Qing Dynasty sculpture of two carp,
    most likely a wedding gift, discussed by Chinese art historian Terese Tse Bartholomew
    in her 2006 book, *Hidden Meanings in Chinese Art*.³ In Chinese tradition, such
    fish are believed to swim in pairs, and can symbolize marital commitment. Yet
    they also embody the type of linguistic pun quite common in Chinese: the characters
    for *fish* and for *abundance* are both pronounced the same way, “yu.” There are
    multiple examples of double entendre produced through imagery and the significance
    of these fish in visual representation. The same linguistic device of the visual
    pun is also demonstrated in classic painting. Images of the Dutch masters are
    rife with humorous allusions to slipshoes. The Dutch *slipierte* can be used to
    denote a love affair into which a spouse falls, or “slips.”⁴ Here, and in other
    scenes, noticing the ways language plays with culture, especially language as
    used by artists, can help designers find methods of consciousness raising, or
    tools for social commentary.


    # Play, Form, and Theater


    In the nineteenth century, writers like Rimbaud, Verlaine, Sand, Mallarmé, Baudelaire,
    and Poe experimented with language to voice criticisms about larger societal issues.
    The U.S. writer Edgar Allan Poe (1809–1849) and the French writer and playwright
    Alfred Jarry both pushed the boundaries of language use. It is likely that this
    obsession with wordplay was an international nineteenth-century phenomenon. In
    English, all types of wordplay appeared in the early nineteenth-century work of
    Emily Dickinson, Nathaniel Hawthorne, Washington Irving, and Henry David Thoreau.⁵
    Perhaps inspired by the twisty passages of other writers, or the mind-bending
    changes in French, and international, literature, especially poetry, writers accelerated
    their use of puns and palindromes at the turn of the nineteenth century. This
    is true particularly in France, where one could speculate that the roots of the
    avant-garde were possibly an accumulation of changes in the arts since Rousseau’s
    innovative painting. Alfred Jarry made his mark in language circles with radical
    writing and theater projects. In his first publication (1893), Jarry used a near-pun
    to change “magnificent gesture” into “magnificent imposture” (in French, of course).⁶
    Afterward, Alfred Jarry “popularized” the'
