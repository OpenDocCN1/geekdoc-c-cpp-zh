- pgno: 215
  md: 'practices, for example, perceived space, routes, and patterns of interaction.
    Divided in terms of representations, space can be a cultural and social order
    organized by scientists, planners, and so on. Space can furthermore be tied to
    maintaining the public good, or to knowledge. Lived space and lived experiences
    constitute the space of everyday life. Such space is not cohesive or consistent,
    but is embedded in a history of a group of people, or a history of a site. Lefebvre
    argues that much of urban space is dominated by the powerful through architecture
    and urban or town planning, while representational space is a living, emergent
    practice, linked to encounter, art, or community. Representational spaces “need
    obey no rules of consistency or cohesiveness.”⁶² Therefore, while many locative
    media games are designed around particular representations of space, a public
    square, or a pattern of streets, the games designed for these spaces often omit
    the emergent qualities of lived representational space.


    This distinction is essential to understanding both the strengths and the shortcomings
    of the social and political power of locative games. If Lefebvre is correct in
    his belief that the creation of new spaces has the ability to change social relations,
    locative games must address history, lived experience, and site in order for both
    participant and designers to learn how to produce something better — another city,
    another space, a space for and of social equity and change.


    Revisiting Huizinga and play’s signification function, if play is local, then
    play within those spaces cannot help but refer to, rework, or, conversely, avoid
    history, social relationships, and customs of a play site. Inventing new and conscientious
    forms of play requires also inventing a context for that play, one that inclusively
    examines empowerment, location, and the specificity of culture at that location.
    This does not mean that the games cannot be fun, but rather, that this type of
    design practice be reflective and sensitive in its design.


    While art must indeed break borders, there are many instances where the borders
    broken are misguided and actually reinforce existing class, ethnic, and other
    power structures. Australian writer Danny Butt, for one, calls for a “new media’
    in which the technologically augmented experience of location is inseparable from
    a philosophy of land and belonging.⁶⁴ Critiquing what he calls new media’s overly
    abstract, modernist stance,⁶⁴ Butt asks artists to reground their work with sensitivity
    so that novelty is not the only motivating force behind the work.


