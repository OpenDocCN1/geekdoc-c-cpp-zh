  md: '# ## SET FOUR


    **Noticing what you see and don’t see, create your own set of lead and release
    objects and follow your own rules. If you want to keep going after set four you
    may return to set one and repeat the process.**


    +   2. Beginning near a subway stop, stand on any Manhattan street corner.

    3. Wait until you see someone pass with any of the lead objects. Once you see
    the first lead object, begin that set.

    4. Each time you see someone with one of the lead objects, begin walking in that
    direction. Continue only in that direction until you see another lead object.
    At that point, continue in the direction of the new lead object.*

    5. When you see one of your set of release objects, you may stop and do whatever
    you like until you see one of the other sets’ lead objects.

    6. Once you see one of the remaining sets’ lead objects, return to step three
    and repeat the process with the new set of objects.

    7. Keep a tally of the lead and release objects you see and the times you spend
    in each phase.

    8. At each release moment, stop to document your walk thus far. Map where you
    walked, and note what you saw. You may also want to document the lead and release
    objects as you go.

    9. If time is an issue, you may shorten the process by releasing yourself from
    any one step after fifteen minutes should you have not progressed to the next
    set in that time.


    **\*Participants do not have to follow the lead objects, just begin walking in
    the direction they are being carried. They may only change direction with each
    new lead object that passes in a new direction or upon seeing the release objects.
    For example, is the first person you see carrying a Gap bag and walking east?
    Then you must keep walking east until you see another of the lead objects or a
    release object in that set.**'
