    The bars were primarily used in performances. Cadere would take these spindles,
    which looked like traditional staffs or even wands, to events and art galleries,
    documenting every occurrence that unfolded. His typewritten records include time,
    date, and place of appearance. Performance was integral to Cadere’s work and as
    he wandered from event to event his interventions were carefully planned. He announced
    his walks in advance, and even conducted disruptive visits to other artists’ openings.
    There is evidence that occasionally Cadere’s staffs were confiscated. To guard
    against repeated impediments to his work, he took to carrying miniature rods in
    his pocket. At times, these “parasites” would mysteriously appear on gallery floors.79
    When interviewed, Cadere deflected economic or political critique: “I am not interested
    in the reaction of people and I do not need their reactions.” In this way, his
    work effaced the actual performance or intervention to focus instead on the process
    of the work “becoming visible.”80 It is as though Cadere brought the game goal,
    or the safe zone, and interactors had to figure out the game from there. There
    are then several levels of critical play demonstrated here. Cadere’s intention
    was to encourage viewers to choose approaches to interact with him, the artist
    whose opening he disrupted, and with others. Surprise appearances of a staff,
    and the conversations that ensued, created game-like interactions in public spaces
    with the general public and the arts establishment.


    Other performative works are more closely tied to the role games play in popular
    culture. One example is based on the Japanese game *shogi* (shogi), a version
    of chess. The board, or *shogi ban*, is made up of a nine-by-nine grid and includes
