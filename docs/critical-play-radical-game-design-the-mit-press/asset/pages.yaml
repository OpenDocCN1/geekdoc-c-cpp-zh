  md: 'Rather than a celebration of the brothers’ fraternity, or an inscription of
    a "cult of masculinity, " a growing feeling of helplessness engulfs players of
    *The Intruder*. The narrative is dark, brutal, and compelling, but Juliana, so
    important to the story, is rife with mystery. She cannot speak. Who is she? What
    does she look like? Bookchin removes the character''s last name to further impersonalize
    her in the telling.


    In another mini-game in the same story collection, Juliana emerges as a silent,
    pixilated figure. Players immediately know this figure to be Juliana, yet she
    is never given dialogue or a voice. As the story unfolds around her, the Juliana
    character becomes a mere blocky shadow produced by the men''s desire. The game’s
    aesthetic further supports this narrative evolution. While the background graphic
    is somewhat detailed, in a high-contrast photograph of a rustic street, the closer
    human figure is obliteratered in chunky pixels. Game players maneuver Juliana
    down the street, causing her to run or jump, and eventually advancing the narrative
    when the character falls into the traps set for her. These are inevitable. Juliana''s
    possible actions and the meaningful choices that players make along with this
    character are irrelevant. Participants must oblige this framework to continue
    the narrative.


    The story and the interaction in *The Intruder* may appear at odds with each other
    until the players understand the futility of Juliana''s agency. The set of games
    are designed to establish a gap between successfully advancing the story and compromising
    the safety and well-being of the character. The disjunction between interaction
    and narrative is deliberate, a gap that could be a site for critique or irony.
    To activist designers, *irony* is one of many strategies of critical play.


    In *The Intruder*, Bookchin''s low-tech graphic style and her narrator''s solemn
    reading ironically subvert the arcade-game art concept. While the story itself
    is written by a Latino, the pieces excerpted into the games are narrated, when
    there is voice at all, by a Latina. Since the narrative involves the control of
    a Latina character, having a Latina both participate in the narrative and refute,
    or at least cause us to reflect upon the issue of voice by reading the text aloud,
    is an important aspect of the artwork. Here, Bookchin not only unplays game conventions—for
    example, the narrative advances when Juliana falls into the hole, which, in other
    games, would represent failure or restarting—she also rewrites questions of authority,
    identity, and representation in games through the confusion of narrative voice.
    This rewriting is particularly evident in the position of a game player versus
    that of a reader. Game players participate in the construction and evolution of
    narrative in different ways than in traditional textual forms. *The Intruder*
    narrative grows to become particularly effective and poignant because players,
    the once-"innocent" (perhaps) readers of text, now'
