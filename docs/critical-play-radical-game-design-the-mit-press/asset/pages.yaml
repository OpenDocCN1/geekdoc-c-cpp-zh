    and 1970s.


    Happenings also were a precursor to other art movements that featured the dissolution
    of the active and passive dichotomy of the art world, as well as an aestheticization
    of the everyday. The importance of the everyday object continued to grow with
    this new emphasis on play. German sculptor and performer Joseph Beuys (1921–1986)
