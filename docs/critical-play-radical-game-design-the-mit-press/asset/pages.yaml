  md: 'believable, but are by all intents and purposes much like the playhouses created
    by his craft-inspired contemporaries—that is, a window onto domestic space as
    a place for the reflection on the norms and behaviors in that space. There are
    many examples of artistic styles that reflect the influence of their social and
    political times. The artistic directives of Egyptian Pharaoh Akhenaten (1369–1332
    BC), for example, altered Egyptian representational practices based on a dramatic
    shift in religious belief. The radical graphic style represented by Russian Constructivism
    embodied a fluid, changing model of visual culture. Historians who see representational
    practices as mirrors of culture can also look to play for cultural clues, paying
    special attention to the intersection of play and art.


    # A New Focus on Play


    While artists had long referenced games in their scenes, the whimsical artists
    of the Rococo (1725–1775) were the first to use play as a central subject; the
    artists Chardin, Boucher, and Fragonard are of note for their exploration of play
    in lavish everyday settings. In exploring the eighteenth-century paintings of
    Jean-Honoré Fragonard (1732–1806), Jennifer Milam notes a playful, almost gaudy,
    style.¹¹ Enlightenment developments spurred social and political developments
    and industrialization, but fostered a creative outercy for the irrational, the
    merry, and the epigrammatic, themes most of the esteemed thinkers of the time
    resisted.


    François Boucher (1703–1770) recorded eighteenth-century life by painting the
    pastoral and the common scene. In his work *Le Déjeuner* (1739), a domestic moment
    unfolds in the soft lines of household women tending to children (figure 2.2).
    The girl seated on the floor holds her doll and the doll’s horse. In other examples
    from the period—namely, several by Fragonard—female subjects are depicted seated
    on outdoor garden swings; Milam notes that swinging was a game sanctioned by doctors
    of the ruling class, who diagnosed exercises such as swinging or strolling as
    those worthy of a certain sense of propriety and sensitivity to station.


    Sutton-Smith has argued that a group’s preference for specific activities is one
    important way values emerge in a culture.¹² The leisure habits of the rich are
    framed as activities to see and to be seen at. They provide exercise, but not
    exertion; they are a courtly site of sociality and pleasure. In Fragonard’s day,
    swinging was a play activity that liberated men and women to touch each other,
    view each other, and rendezvous. Milam notes that in Rococo painting “swinging
    alludes to the fickleness of women in the emblematic tradition, but also, with
    its rhythmic motion, to the act of lovemaking.”¹³ Milam goes on to describe the
    details found in Fragonard’s “swing” paintings (such as figure 2.3, *The Swing*,
    from 1767) more specifically: a tossed shoe'
