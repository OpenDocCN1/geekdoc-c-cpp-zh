    # **A New Way to Play**


    An earlier and influential precursor to performance and play is the New Games
    Move- ment of the 1970s. Founders included Stewart Brand, creator of the Whole
    Earth Cat- alog (a late 1960s countercultural resource guide), and many designers,
    writers, and theorists who based their practice on an ethos inherited from the
    counterculture of 1960s California. These activists investigated ecological issues,
    sustainable design, and approaches to peace during the tumultuous Vietnam War
    era. No matter how carefree their pose and demeanor, members of the Whole Earth
    movement were quite serious in their belief that the types of games people play,
    as well as the way they play them, was culturally significant and could produce
    real behavioral and philosophical change.


    In 1974, Brand and his collaborators organized a "New Games Tournament" where
    people could play large-scale, physical games. Play hard, play fair, nobody hurt
    —those were the three principles central to the design of any New Games specta-
    cle. ${ }^{94}$ The games were intended to alter the way people interacted with
    each other, especially in interactions that crossed perceived limitations of age,
    ethnicity, gender, and economic background. The New Games Foundation also published
    The New Games Book (1976), which became an influential text in experiential education
    and utop- ian thinking. In his introduction to the book, Andrew Flugelzman positions
    games as'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'a way of getting people such as war protestors and activists to engage in new
    types of play. Here, Fluegelman also noted a concept from Stewart Brand termed
    the softwar, or the idea that “people could design their conflict forms to suit
    everyone’s needs,” as “conflict which is regionalized (to prevent injury to the
    uninterested), refereed (to permit fairness and certainty of a win-lose outcome),
    and cushioned (weaponry regulated for maximum contact and minimum permanent disability).”5
    In his “Theory of Game Change,” Brand himself argued that one cannot alter a game
    by winning it, judging it, or watching it: “You change a game by leaving it, going
    somewhere else and starting a new game. If it works, it will in time alter or
    replace the old game.”6 As an example, the New Games organizers held a physical
    game called “Slaughter,” whereby forty players competed for four balls and moving
    baskets. Instead of fighting people off the territory from within, in this case,
    pushing players from the mat, players pulled each other from one area to another.
    Part of the New Games Movement, then, was a shift away from game content to a
    new focus on game actions. Designers did not make games specifically based on
    the war in Vietnam, for example, or games about gentrification or racism, but
    turned instead to an emphasis on what players were actually doing in a game as
    the vehicle for change.


    This focus on the player’s action as a translational of political and social intent
    was far ahead of its time. The idea that player actions have real meaning will
    be explored more fully, but suffice to say that such subtle changes in game play,
    or game goals, can have larger ramifications when it comes to activist design.
    Designers might ask: what themes from the New Games Foundation have stuck? But
    to shift design concerns from content to mechanics reveals a fundamental epistemological
    change behind the idea of games. Knowledge in games is typically generated through
    doing. In this way, games are fundamentally experiential.


    # Critical “Doing”


    By acting through a game’s given “verbs,” players are at work with two fundamental
    aspects of play: limits and agency. One cannot overestimate the effectiveness
    of what is actually done during game play, the expressive actions of a player.
    Janet Murray aptly describes agency as “the satisfying power to take meaningful
    action and see the results of our decisions and choices.” Agency is fundamental
    to critical play precisely because doing and action, essential to performance,
    constitute knowledge.7 Along similar lines, French theorist Jean-François Lyotard
    focused on the idea of the event and the use of performativity as a working principle
    of knowledge. According to Lyotard, performance can be seen to represent a form
    of knowledge: “No single instance of narrative can exert a claim to dominate narratives
    standing beyond it.”8'
