    played with contemporary literary conventions. Poe was particularly interested
    in the palindrome, perhaps due to his fascination with the arcane. Here, ancient
    word puzzles such as the Sator-Rotas rebus come to mind. Also known as the Templar
    Magic Square, the Sator-Rotas (an example of which is shown in figure 4.2) is
    one of the oldest unsolved word puzzles in the world. Some believe it was a secret
    code; others take it for a mark of the early Christians; still others believe
    the square is an ancient charm of great power and mystery.<sup>13</sup> When written
    out in the square, Sator-Rotas forms a palindrome that has been scrawled across
    five continents, including on a wall in the buried city of Pompeii, and among
    ruins discovered from Italy to the United Kingdom.<sup>14</sup>'
