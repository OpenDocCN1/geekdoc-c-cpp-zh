- pgno: 263
  md: '+   * *Revise.* Revising or elaborating on the goal, the players offer feedback,
    and the designers revamp the game system to improve it.

    * *Repeat.* The preceding steps in the process are repeated to make sure the game
    is engrossing and playable before it “ships” or is posted to a website.


    The traditional model contains concrete steps toward realizing a particular design
    by iterating it until core elements and concepts have been adequately matched
    by game elements and mechanics. Generally, a designer or a design team may choose
    to iterate one small design goal, a subset of a particular game, or they may choose
    to iterate the entire game system in some skeletal form (see figure 8.1). The
    model is scalable to many types of play and development.


    I wish to appraise this process in light of the myriad critical approaches to
    projects included in this book. Part of this process is a constant reflection
    on the humanistic themes, or values, during design. At least one designer, Donald
    Schön, refers to a “reflective practice” as a methodology and encourages makers
    to step outside their processes to “see the big picture.” For Schön, it is important
    that the experiments do


