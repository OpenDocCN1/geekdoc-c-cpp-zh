  md: 'the interdependency we all have with one another. Using everyday items like
    chess pieces, game boards, or scissors, Ono allows participants in the work to
    consider the marvelous nature of the everyday and engage with game-like concepts
    and processes in an endless queue of provocative situations. *Play It by Trust*
    emphasizes the ways in which serious issues might be tackled through games, and
    how multiple participants in games have equal opportunities and face equal stakes.
    Reskinning, or painting the work all white, eliminates the element of competition
    from the traditional form of the game.


    One of the few Fluxus artists who used her whimsy and game-like constructions
    in the pursuit of political aims rather than merely challenging the predictable
    patterns of the art world, the stakes for Ono were clearly activist. Ono plays
    critically, using rules, symbolic meaning systems, the sociocultural context,
    and the inherent sense one has of game “time” to present pacifist aims.1⁹ This
    work goes beyond game to envision a “world-playground” and a wish for utopian
    solutions to social and political concerns.


