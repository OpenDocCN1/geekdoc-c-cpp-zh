  md: '*Inscription Device* (*RVID*) (2002) is particularly important (figure 7.6).
    In this installation, which consists of a computer-controlled separation gel and
    DNA and displays, Vanouse runs a live scientific experiment wherein four separate
    DNA samples from each member of his multiracial Jamaican American family are literally
    raced in a portable lab. The family members’ DNA samples travel slowly, and in
    addition to the race action, viewers can read a eugenics treatise that explores
    the historic positioning of racial identification practices. Vanouse posits, “In
    1960, my ‘brown’ mother emigrated to the US from Jamaica, and met my ‘white’ father.
    Why is my skin color lighter than my sister’s?”²⁶ With this simple demonstration,
    Vanouse’s project critically examines the genetics behind even small variations
    in skin color and the ways in which those variations are transmitted.²⁷ Vanouse’s
    intention is not to literalize the genetic variations among mother, father, sister
    and brother, but to question the validity of such choice in what he calls “scientific
    spectacles.” The project also brings forward our unease as spectators with regard
    to our own genetic and racial identity.


    ![](img/33f54fd00e53b9c7e7d108e9fb170e94_242_0.png)


