- pgno: 195
  md: 'As a cautionary note, however, it must be admitted that political and social
    climates make critical play, especially in the form of performance, unavailable
    to a significant percentage of the population. What would happen if The Yes Men
    were, say, immigrant women, or African American men? We can only speculate. But
    in the first part of the twenty-first century, minority artists would likely have
    difficulty entering venues and staking their claims. This is why radical groups
    such as the Guerrilla Girls use costume, or artists such as Keith and Mendi Obadive
    use online venues as an arena. If artists of color did manage to infiltrate certain
    places of power, the result might be deportation or prison rather than acclaim.
    What does this say about critical play''s efficacy regarding real-world issues?
    How probable is it that everyday people may playfully intervene? In the final
    analysis, a critique of performance practices must ask: Who gets to play? For
    all its delights and wonders, twentieth-century art includes very few documented
    examples from women and people of color and despite the age of global communication
    it remains difficult to survey trends particular to marginalized artists. The
    history of art has not reflected these artists'' accomplishments, and until the
    latter half of the twentieth century, most were simply ignored. Only a few writers,
    such as Linda Nochlin (1971), incorporate a critique of the elitism of the "high
    art" arena into their analysis of political and social movements.¹⁰⁵


    Another area of concern is the artistic use of technology. Alone this might lead
    to an inherent bias toward the status quo. This is noted in various research projects
    on emerging media technologies in developing areas. Leslie Shade Regan, for example,
    notes that those corporate interests that introduce new technologies foster consumption,
    rather than production or critical analysis.¹⁰⁶ This critique can easily extend
    to the play and consumption of even the most radical situations. The tight link
    between new technology and consumer culture is a major cause of concern. Shade
    Regan is quick to analyze ways the Internet can be said to be “feminized” as a
    site for popular content and consumption.¹⁰⁷


    Each of the art movements discussed in this book used participatory play, gaming
    as research method, art experience, and social tool to reflect upon everyday culture,
    often with the aim of actively redefining it. From Dadaist culture jammers and
    Surrealist gamers to Fluxus and beyond, each offered new perspectives on how to
    subvert and inform the creative process. Finally, as a form of critical play,
    performance elevates the role of the player and the aura of artworks shifts to
    the public.¹⁰⁸'
