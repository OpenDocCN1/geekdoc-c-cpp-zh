    # 8 Designing for Critical Play


    +   1. Csikszenmihalyi and Bennett, “An Exploratory Model of Play.”


    +   2. McLuhan, Underst anding Media, 242.


    +   3. Bhabha, The Location of Culture, 1994.


    +   4. Schleiner, “Operation Velvet Strike,” par. 11.


    +   5. Here, I should note I have taken on socially engaged design projects since
    the 1990s, particular in designing for girls and underrepresented groups. I also
    create artwork that has elements of play. At the moment I’m also working with
    Dr. Helen Nissenbaum on Values at Play, a research project to broaden these themes
    and see how game designers might design for human values. See http://www.valuesatplay.org.


    +   6. The theme of critical play emerged be my dissertation work 2001–2005, and
    comes from my considerable work in activist design and a creative practice aligned
    with the avant-garde. My collaborator, Helen Nissenbaum, and I have more recently
    developed a method for taking human values into account, called the Values at
    Play method. The Critical Play Method is definitely informed by this work; appreciation
    and credit must go to Helen for introducing the term values and all it implies
    to the process. I hope I can adequately summarize by saying that Helen is interested
    in how values are embedded in various technologies, and I am more interested in
    the array of values brought forward in a game; how the system, the conditions
    of play, and the participants each bring values that are constantly “at play”
    with one another. This idea is both the name of our project, and a continual source
    of inspiration.


    +   7. I have discussed contemporary computer games before in terms of the problematic
    representation of female characters, epistemological concerns, spacial concerns,
    etc. See: Flanagan, “The ‘Nature’ of Networks”; “My Profile, Myself in Playculture”;
