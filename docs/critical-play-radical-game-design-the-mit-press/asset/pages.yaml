  md: 'not “confirm” an “answer” to a challenge, but affirm that challenge instead.
    Schön’s approach avoids the traditional goal of a final, or definitive, resolution
    and involves shaping and altering priorities as a result of findings. Schön notes,
    “It is the logic of affirmation which sets the boundaries of experimental rigor.”
    Other reflective frameworks, such as the “critical technical practice,” which
    is advanced primarily by computer science practitioners working on artificial
    intelligence, have similar aims. A growing number of designers are committing
    to the notion of a continuing dialogue between values and practice.10 In sum,
    reflective practice encourages designers and technologists to verify that both
    their design goals and their values goals are supported.


    Any game design heuristic, however, would be ill conceived without either accompanying
    an existing creative process or being able to conceivably work in an existing
    design context. If many game designers practice an iterative model of design,
    then these ideas must integrate. The critical play process might therefore look
    like this:


    The iterative cycle would do better to become more open, more reflective at this
    point in the evolution of playculture, given the long history of the technical
    benefits, increases in inclusion, and widening of social discourse achieved by
    alternate design methods. For example, in my own research into play systems, I
    have noted a number of ways in which girls participating in play environments,
    such as their long history of doll play, worked against these systems, and how
    players in popular computer culture use intervention or subversion in games as
    a play method. Feminist criticism and practice has played an important role in
    informing such disruptions with technology, as well as examining how power relationships
    are upheld and how intervention is orchestrated. Leading technologist and game
    designer Brenda Laurel has noted, “Culture workers at their best make just such
    conscious interventions—mindfully creating technologies that cause us to produce
    new myths, and mindfully making art that influences the shape of technology.”11
    The disruption of contemporary games, whether through play, or preferably, through
    original designs that eschew the embedded interaction styles of current computer
    games may offer models for other emerging practices in playculture. Designer actions
    are powerful sites of empowerment for giving a voice to marginalized groups.


    But a critical design methodology requires the shifting of authority and power
    relations more toward a nonhierarchical, participatory exchange. While the games
    made might disrupt the existing social realities offered by most popular games,
    they also disrupt the design process itself. Instead of compliance to a pattern
    whereby the usual designers develop the usual ideas through the usual stages for
    the usual players, what is needed now is a model that will augment these practical
    but limited stages of the design process in a way that addresses intervention,
    disruption, and social issues'
