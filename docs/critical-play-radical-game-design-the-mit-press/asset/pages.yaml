    experimented continually with “gag” events. For example, he composed a musical
    score that called for hammering nails into each key of a piano.⁵⁹ In 1961, he
    began organizing makeshift performances and concerts at an important New York
    gallery— his studio. These quickly developed into larger-scale international art
    festivals of absurdist performance. At one of the festivals, Korean-born artist
    Nam June Paik (1932–2006) performed another artist’s score, by dipping his hair
    in a bowl of ink and painting with his hair until the performance was complete:


    Draw a straight line and follow it.⁶⁰


    Takehisa Kosugi (b. 1938), a Tokyo-born composer, used daily materials in his
    event pieces; in 1969, he cofounded the musical group Taj Mahal Travellers, which
