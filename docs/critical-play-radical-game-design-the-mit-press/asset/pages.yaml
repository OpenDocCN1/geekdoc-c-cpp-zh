  md: '# Looking at Games


    In the Middle Ages and Early Renaissance, engravers and painters relied on scenes
    of play to charm and illuminate. Examples include the Ghent-Bruges calendar *Hore*
    (1520–1525 AD) as well as the miniatures found in the Dutch manuscripts of Antwerp
    and the Venetian Grimani Breviaries (1490–1510 AD). In these contexts, games were
    reminiscent of the seasons, depicting summer games of celebration or games of
    abundance for harvest, and play reinforced the significance of the cycle of the
    year. Pieter Bruegel’s painting *Khinder spil*, or *Children’s Games* (1560, Vienna
    Kunsthistorisches Museum) includes depictions of over ninety games common to his
    time. Art historian Sandra Hindman has read the symbolic associations in this
    work as a means of conveying a range of human experience: ill fortune in marriage,
    luck’s sometime triumph over skill, and the ways in which traditional holidays
    marked by the Catholic Church may, in fact, have been days of folly rather than
    introspection.¹ Bruegel’s incorporation of a mask, of blue cloaks for blind man’s
    bluff, and of fools sporting whirligigs are said to connote human fallibility
    and self-deception as well as standard phases of adult life such as marriage and
    childbirth. Through his depiction of a courtship, a baptismal procession, a true-to-the-time
    bridal party, and the doll play that acted as a model for motherhood, Bruegel
    uses play to critique norms of sixteenth-century Dutch life, capturing in a single
    moment not only the notions of youth but also a foreshadowing of the most profound
    events the children portrayed would come to experience as their lives unfolded.²
    Bruegel also documents the unpleasant through the nasty play he saw among those
    same children, giving us an even more damning critique. The performance of myriad
    children’s games like knucklebones and its more violent counterparts, tug-of-war
    or plain fighting and pulling hair, signal that children’s activities may be more
    than folly and, in fact, represent the darker aspects of the human experience.


    # Shifts in Perspective


    No matter how revealing, after the Renaissance, games and artworks concerning
    play continued to be marginalized as irrational, whimsical parts of culture, unworthy
    of the advanced scholarship of the day.³ Ever reasonable, scholars and philosophers
    of the European Enlightenment (1650–1800) emphasized scientific and technological
    solutions to problems and, in general, banished ritual, superstition, and folk
    knowledge in favor of developments in logic. Nevertheless, games of the period
    began to proliferate beyond their “serious” use in warfare and military training
    across Europe as the Enlightenment’s cold rationality was countered by the playfulness
    of artists, performers, and others who continued to find themselves preoccupied
    with domestic space.'
