  md: '(Hoffman 1993, 96). In fact, both the Japanese form of the game ( pachinko)
    and the U.S. form ( pinball) developed from these simpler wooden parlor games,
    aided by the 1870 patent awarded to Montague Redgrave for a spring-loading plunger
    to launch the ball in Bagatelle. Such an invention set the stage for development
    of the game (Howell 1986, 94).


    The aura of “seediness” with pachinko parlors and pinball arcades, mostly male
    environments, has been an artifact of the early development of public game spaces.
    Pachinko parlors in Japan were historically located in *doya-gai* (flophouse)
    neighborhoods and historically these parlors attracted primarily male customers
    for gambling. Because women in both the West and the East rarely went unescorted
    to entertainment establishments like arcades or theaters, available subject matter
    followed this trend, and even the earliest kinetoscope film arcades depicted the
    working of machines, bawdy humorous skits, or dancing women (Musser 1991). Bally
    founder Ray Moloney distributed his pin-based ball game in the early 1930s, spawning
    a group of pinball manufacturing companies to fill burgeoning arcades.


    Cited as the most popular activity among mid-century poor urban Japanese men,
    “Pachinko is therefore genuine gambling and is the preferred activity of laborers
    on rainy days when they cannot work and do not have any other hope of getting
    hold of money except by chance” (Caldarola 1968, 521). Contemporary game parlors
    are more similar to casinos, with attendance in the tens of millions, some offering
    childcare facilities and restaurants as well (Fawcett 1983, 41).


