    Jersey in 1970, featured physical games like soccer on stilts, balloon javelin,
    and table tennis played with paddles that featured large holes at their centers.⁶¹
    The Handicap Run game encouraged players to run while drinking vodka, eating oatmeal
    and ice cream, grinding coffee, shouting, counting, writing, and playing instruments.⁶²
    Such absurd events are aligned with the perennial Fluxus emphasis on insignificant
