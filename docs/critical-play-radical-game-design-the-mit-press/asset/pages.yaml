- pgno: 233
  md: 'fields. Artists and activists tend to be the ones who uncover such realities
    experientially, sometimes by playfully making work that comments on technology
    itself.


    At the same time, within the culture of computer games, race, ethnicity, language,
    and identity relations including gender emerge as complex and contradictory. According
    to a recent Pew Research study, game playing is universal among young people.
    Women also do play games, yet this play emerges differently than the play of their
    male counterparts. Women are perceived to be the primary audience for casual games,
    for example. In Western countries, computer games are still perceived as an arena
    created by and for white men, with women comprising approximately 10 percent of
    the game development workforce in the United States. Current trends indicate that
    those who label themselves as gamers are moving out of the PC game market and
    onto consoles, while female players and those new to gaming, such as older age
    groups, may be migrating to the PC for casual games, to cell phones, Wii-style
    systems, and handheld devices for play across mobile technologies. An entirely
    new group of adult female gamers emerged to play online social games such as *The
    Sims Online*, *EverQuest*, *Uru*, and *World of Warcraft*. Games that depict everyday
    activities such as communication, social negotiation, caring for elements or characters
    that are part of a game world, or stabilizing precarious situations have become
    extremely popular with female players. In 2003, for example, it was a novelty
    to have more than one hundred thousand simultaneous players in an online game,
    but this happened in the game *EverQuest*; subsequently, the massive multiplayer
    *World of Warcraft* claimed a total of ten million users signed on in 2008 and
    broke *EverQuest''s* simultaneous player records. Despite contradictions in data,
    there is evidence that women constitute either the largest, or second-largest,
    group of online gamers. The largest group has been cited as women aged thirty-five
    to forty-nine. Games journalist Kris Oser notes that women players, however, are
    still almost an invisible constituency to advertisers and game designers. While
    the statistics show us that women are increasingly playing games, few are envisioning
    and constructing these software environments. On top of these industry figures,
    few contemporary artists engaged with games are women.


    Despite the probable social benefits that could result, game designers have yet
    to grapple with the full range of inequities ingrained in the player categories
    and game models exhibited in most of today''s games. Possible overcategorization
    or reductionism from such classifications—for example, that designers are included
    under the rubric of "activist games"—is worth risking should such research provide
    for useful discussions, the design of alternate subject positions, new possibilities
    of agency, a revitalization of authorship, the promotion of equity, or other redefinitions
    of the cultural constructs currently embodied in digital environments.'
