    # Subversive Play


    Just as in the physical world, players of *The Sims* often encounter uncanny conditions
    or playfully create them by designing disturbing circumstances to intentionally
    undo the “expected” *Sims* play.$^{106}$ While players are instated into traditionally
    feminine roles when first playing, they are also encouraged to be critical players,
    creating miniature rebellions within these confines. In many games, this is possible
