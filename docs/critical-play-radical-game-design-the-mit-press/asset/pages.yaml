  md: '+   Notes to pages 200-204


    +   36. As the author of this book, I’ve avoided discussion of my own work for
    the most part. It is the case, however, that much of my work parallels the various
    concerns in this book, which developed in parallel to my own creative practice.


    +   37. Kwon, One Place After Another.


    +   38. One of the key characteristics of modernist and postmodernist art is the
    premise of interrogation, or of calling into question the role of art, the role
    of the artist, and how artwork fits into economic and political issues. Many artists
    have challenged institutions, of course, but many also challenge the very media
    in which they work. From painters as diverse as “image makers” Monet, Picasso,
    and Cézanne, to “sculptor” Duchamp, to “poet” Gertrude Stein, a formalist deconstruction
    of the medium is historically an inherent principle behind much work in any medium
    in the last century. It is this key attribute that joins the artist and the activist,
    the person who plays with the very notion of the medium in which they work, and
    the person challenging or disrupting social and institutional norms. It is a very
    different task, however, for artist/activists, or those outside various media
    industries, to infiltrate and critique the medium for artistic concerns, and subsequently,
    use that medium for larger social critique. The most potent artistic/activist
    projects bring an awareness of the medium to the project, and an awareness of
    context. In fact, historically speaking, the less transparent the artist’s role,
    the better, so there can be no mistaking critique with mainstream media production;
    think of Paper Tiger TV and early video art, which used rough hand-me-down cameras
    and less-than-ideal conditions to disrupt the mainstream consumption of video.
    For many years artists strove to achieve more professional results, with the bottom
    line being that they couldn’t without the technology, team, time, or funding.
    In contemporary media art circles, however, this oppositional low-tech mode of
    working is not necessarily central to current practices. Many video artists shoot
    beautiful images in high definition, and produce high-quality media for consumption.
    Also, even “home-brew” game makers can mod existing games, using the textures
    and models by others or creating these themselves, and many such mods could in
    fact model the real game spaces quite closely.


