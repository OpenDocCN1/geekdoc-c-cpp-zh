  md: 'technology-driven garment. Her outfit, known as The Electric Dress (1956),
    was composed from flashing neon tubes. From objects to installation to drawing,
    her work was influenced by technology and includes schematic drawings and electric
    cables as a comment on the rapid industrialization of postwar Japan. Bell (1955)
    was a sound installation that defined architectural boundaries through a row of
    progressively ringing bells. Tanaka also engaged consumer culture through the
    use of fashion and clothing, especially her “clothing that evolved.” Evolving
    clothing is an interactive and open-ended game structured within “boundaries”
    of infinite change. As the garments change over time, they suggest the everyday
    as a new play arrangement, one that critiques the fashion industry, its attitudes
    toward women’s bodies, the top-down nature of its designs, and its drive for ever-increasing
    sales, not necessarily to the benefit of the consumer. 32 Tanaka’s oeuvre included
    paintings, sculptures, performances, and installations. Tanaka’s paintings often
    were created by painting as the canvas lay on the floor with gestural movements
    typical of Gutai artists (Gutai means “embodiment”). Her interest in the ring
    shapes (see figure 5.5) is said to be a continuation of her interest manifest
    in Electric Dress. These bulbs were covered in primary colors, and the paintings
    also typify colorful, concentric circles, as though bulbs are hanging down to
    the canvas.


    Gutai’s play with materials, location, and embodiment, as well as concerns about
    the appropriate role of formal exhibitions, took the Surrealist concept of process-based
    exploration into the actual product of the work itself. Rather than use games
    behind the scenes to develop fixed artworks, the Gutai artists created events
    and objects that were games in their entirety. Neither high art nor costume, nor
    merely invention, Gutai artists pushed the critical capacity of the arts through
    an investment in performance and performative objects in a global context, where
    war on an immense scale had echoed earlier wars.


    Again, their motivation was lived experience. The Japanese role in World War II
    left Gutai with a specific set of questions. Rather than investigate the unconscious,
    the Gutai were closer to Dada artists in that the horrors of war brought traditional
    authority and an entire way of living into question. In Japan, social organization
    and cultural norms had been shaken to the ground by fascism, war, and modernization.
    Gutai artists felt a particular conviction to recovering or instilling childlike
    wonder and openness to equitable social structures. These artists commented on
    emerging commercialism and capitalism and allowed themselves to be obsessed with
    innovation and newness. According to one writer: “Gutai was not just an art-world
    strategy, but a way to be reborn.” 43 Viewed this way, Tanaka’s light dress was
    “a symbol of the modern Asian city.” 44 In the tradition of critical play, it
    was also a site of transformation. 45'
