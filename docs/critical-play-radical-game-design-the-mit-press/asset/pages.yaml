  md: 'Doll play scholar Frances Armstrong notes that historic documents demonstrate
    that the events occurring within the dolls’ homes were a faithful mirror of what
    hap-pened in real homes. Such repetition was similar to record keeping or cultural
    docu-mentation disguised as play. Armstrong relays an anonymous account written
    in 1888 that gives a detailed example of the rules enacted in this style of doll
    play as occurred over an entire day: the girl of the household would get her dolls
    out of bed in the morning, dress them, and give them breakfast before their “school
    lessons.” These fol-lowed immediately, using small textbooks the child had designed.
    The dolls studied at the same time the girl did, and, like her, had dinner, did
    more homework, bathed, and went to bed. The doll parents played cards, and eventually,
    all of the dolls and their owner retired for the night. Afterwards, the girl might
    expect her mother to commend her “for doing the duty of this toy house.”<sup>30</sup>


    With this example, the complex relationship between play and daily life that the
    idea of playculture encapsulates develops, as players intertwine play and domestic
    life well over a century ago.<sup>31</sup> Through the exploration of the rules
    of domestic life, those playing house through scrapbooking maintained traditions
    of cultural, material, and symbolic importance that reinstated traditional roles
    within the home, which in turn becomes the site of instantiation of traditional
    gender roles surrounding work, play, and consumption. Flat, paper model houses
    “were an ideal medium to introduce girls to their future roles as wives, mothers,
    and homemakers” since a house, as play scholar Roth has noted, “in a scrapbook,
    just as much as an actual one, had to be run and main-tained properly.”<sup>32</sup>
    Paper dollhouse makers even seemed to try to capture some of the spatial complexity
    of real houses through their inset layers, cutouts, and outlines (such as figure
    2.6). Play housekeeping thus acted as a continuous symbolic reinforcement of Western
    household tradition, and the practical and ritualistic function of housekeep-ing
