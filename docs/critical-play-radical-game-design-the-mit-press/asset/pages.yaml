- pgno: 20
  md: 'had the shared goal of bringing about private and public transformation through
    creative acts.$^{35}$ Thus some artistic intervention takes the form of performance,
    parody, simulation, game, activist, and "hacktivist" strategies. Intervention
    has been a popular strategy with street performance and activism: feminist theater
    groups reworked performance practices, for example, and turned to street theater
    for intervention.$^{36}$ Guerrilla street theater of the 1960s and 1970s by El
    Teatro Campesino, the Farmworkers'' theater, The Black Revolutionary Theatre (BRT)
    led by Amiri Baraka, or the media interventions of Nikki Craft, Martha Rosler,
    or Joan Braderman were able to disrupt everyday activities when the "street,"
    not the computer, was the gateway to cultural intervention.$^{37}$


    A number of artists have invested in interventionist strategies, and they are
    documented in this book. These artists, and many more, intervened in contemporary
    art venues, took over traditional art styles to change them, or depicted narratives
    that operated against social norms. Since the 1960s, numerous artists have furthered
    these interests without a particular art movement identity, such as Jenny Holzer
    and Rachel Whiteread, but who reflect an international current in art that subverts
    everyday lived experience by exposing negative or unexpected visions of the everyday.$^{38}$


    Finally, contemporary electronic artists negotiate between traditional, institutionalized
    aesthetic discourses and emergent, organic forms of social communication. If electronic
    art has become an experimental laboratory, not so much for new technology as for
    new social relations of communication, then perhaps electronic games might operate
    in an interventionist way within electronic spaces and discourses.$^{39}$


    The definition of the term *disruption* lies somewhere in between the concepts
    of intervention and subversion. A useful term derived from "Disruption-Innovation"
    theory in the IT business innovation field, a disruption is a creative act that
    shifts the way a particular logic or paradigm is operating.$^{40}$ In the high-tech
    arena, disruptive innovators are those who introduce relatively simple yet "paradigm-shifting"
    solutions to a particular market. Examples in business include Dell computer''s
    direct-to-customer sales model or its "song per song" online music sales, which
    are examples of low-end disruption.$^{41}$ Other disruptive innovations create
    entirely new markets. By creating need and new venues for products, the disruption
    effectively competes against very little. Businesses spawned from such an approach
    include Starbucks and eBay (which Harvard innovation theorist Clayton Christensen
    and his collaborators, Erik Roth and Scott Anthony, argue "democratized" the auction
    process). Disruption-Innovation theory influences game design, for if it is intervention
    and subversion that artists seek, they create this within the confines of a new
    kind of game design.'
