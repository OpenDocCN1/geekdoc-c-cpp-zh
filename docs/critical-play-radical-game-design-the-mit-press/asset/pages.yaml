  md: 'are influenced by ideology as well: technologies such as search engines, medical
    systems, and file-sharing software are designed with different models of human
    behavior, motivation, privacy of information, and the like. Perhaps even more
    than these “tools,” games are simultaneously systems of information, cultural
    products, and manifestations of cultural practice. On some level, systems such
    as games must, due to the conditions of their creation, represent cultural norms
    and biases in their realization. These results can go, and have gone, completely
    unacknowledged. Game makers and artists work in a certain time, place, and situation.
    Many work in a particular medium and genre. Others must contend with definite
    pressures and practical realities. In a further complication of these realities,
    what is distinctive about play is that one cannot always easily see that a clear
    boundary exists between it and social reality, or rather, see that play uses the
    tools of everyday reality in its construction.


    Although artists’ play continues to create new meaning, to challenge existing
    power relations, and to align with activist/interventionist strategies, postmodern
    culture and the technological revolution may have changed histories, social relations,
    markets, and home life in deep and profound ways. Globalization and its effects
    may produce or reinscribe problematic ideologies into technological artifacts
    such as computer games.  Given these conditions, along with the fact that any
    creative act is complex and usually generates unintended consequences, the game
    creation process must mature to allow constant review and much more “reflection.”


    # The Critical Play Method


    Based on the needs of game design and the importance of iteration, the ideas from
    over a century of artists’ games can prove useful to making radically different
    games. But first, it is important to see how designers are making games today.
    Here are the rough steps in the cyclical development process called “iterative”
    design:


    +   - *Set a design goal (also known as a mission statement).*  The designer sets
    the goals necessary for the project.

    - *Develop the minimum rules and assets necessary for the goal.*  The game designers
    rough out a framework for play, including the types of tokens, characters, props,
    and so on.

    - *Develop a playable prototype.*  The game idea is mocked up. This is most efficiently
    done on paper or by acting it out during the early stages of design.

    - *Play test.*  Various players try the game and evaluate it, finding dead ends
    and boring sections, and exploring the types of difficulty associated with the
    various tasks.'
