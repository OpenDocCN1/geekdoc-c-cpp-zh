- pgno: 127
  md: 'use of nonsensical, rude, and abstract language in order to shock, creating
    scenes of monstrosity and controversy and focusing on language and performance
    as a means to achieve those effects. When Jarry staged his famous political satire,
    *Ubu Roi*, in Paris in 1896, it was met with almost violent protest and disdain.


    *Ubu Roi* was conceived when Jarry was still in school, and was developed as an
    obsession over a number of years. The play uses farce, rudeness, and scatological
    jokes to rework the *Macbeth* narrative in a critique of art, politics, power,
    and the class sys-tem. In the plot, Mère Ubu lures an army officer into a plot
    to kill the “Polish King” Wencelas, and supplant the royal throne with her abusive
    husband Père Ubu. Trans-lated as “King Turd,” Ubu Roi is a gluttonous man, whose
    buffoonery, greed, and lack of conscience make him an atrocious spectacle of power.
    The *Ubu* play faced a great deal of criticism, first and foremost for its language,
    which was described as compa-rable to an anarchist bomb. During the political
    turmoil of the 1890s, Paris railroad stations, cafés, and the national stock exchange
    were actual bombing targets.


    PAPA TURD: Psht !

    MAMA TURD: Oh ! that''s a fine thing. What a pig you are, Papa Turd !

    PAPA TURD: Watch out I don''t kill you, Mama Turd

    MAMA TURD: It isn''t me you ought to kill, Papa Turd, it''s someone else.

    PAPA TURD: Now by my green candle, I don''t understand.⁷


    The play''s obscenity and its outlandish performances, centering on characters
    played by actors wearing massive, puppet-like outfits (these were sketched out
    on the original program; see figure 4.1) that brought the grotesque to life, have
    been seen more as a hoax than an important artistic work.⁸ In fact, in the preface
    Jarry used on stage to introduce the play to his 1896 audience, the author emphasized
    the point that the script was not written for puppets, but for actors pretending
    to be puppets.⁹


    Jarry''s *Ubu Roi*, *Ubu Rex*, *Ubu Cuckbolded*, and *Ubu Enchained* are now counted
    among the earliest examples of “theater of the absurd,”¹⁰ and Jarry''s additions
    to critical play are several. First, he toyed with propriety in performance and
    in language, calling attention to social conventions, and consumerism, and making
    these points to the very group who might be the target of such criticism: the
    self-satisfied French theatergoers of the 1890s. In addition, Jarry wrote word
    puzzles at every turn, inviting audiences to piece together further criticism
    during his relentless assault on their good taste. Even the name of his most famous
    and abhorrent character, Ubu, is a palindrome, a word that reads the same forward
    as backward. Most of vulgar sayings that emerge from Ubu are palindromes, for
    example, MERDRE MERDRE MERDRE M.¹¹'
