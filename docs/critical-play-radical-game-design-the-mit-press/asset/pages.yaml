  md: 'Fluxus games stemmed from performative event-like happenings, or took the form
    of Fluxkits and boxes with play items enclosed within.


    In her work *Finger Book of Ancient Languages* (1982), Alison Knowles created
    a hybrid board game/pop-up book/sculpture featuring “tactile” languages (figure
    4.10). The work, which consists of seven eleven-inch-high pages, is in part written
    in Braille. The work also contains a message in Kifu, a bead language. Carved
    Chinese glyphs expressing a Tang dynasty battle crys are inscribed in the standing
    “pages.”


    Stitched into a length of cloth are twenty-six objects that represent each letter
    of the English alphabet. A sewn-in pin might stand for the letter *p*, a feather,
    for *f* (figure 4.11). To discern the alphabet, “readers” touch each alphabetic
    zone and can, in effect, spell out words through touching objects. The consequence
    of Knowles’s treatment of objects-as-letters is that the everyday objects transition
    from being insubstantial objects to becoming monumental sign systems. This “book”
    was shown at the Lighthouse for the Blind in New York among other venues. “Because
    the books engage a person in exploration without awareness of time or place, their
    performativity is simultaneously conceptual and Event-like.”⁷⁵ *Finger Book of
    Ancient Languages* offers “a sensory alternative to the purely cerebral, or disembodied,
    definition of language in the idealist sense.”⁷⁶


    # Making Words Material


    Artists using text during the 1960s and 1970s had a great impact on contemporary
    art practices. Especially relevant are those artists who either used technology
    in their own projects or who critiqued technology amid larger cultural analyses.
    Women artists of the late 1960s and early 1970s faced a hostile and male-centered
    art world, and some turned to nontraditional media such as posters, video, and
    performance to work against art steeped in the traditions and themes of masculine-focused
    modernism.


    Other artists of the 1970s were simultaneously involved in the political actions
    of the time. Jenny Holzer, with her pro-woman, political poster brigades, stickers,
    and electronic LED messaging displays, is a noteworthy example of an activist
    artist using various forms of technology to confront pedestrians, techniques common
    to Situationist intervention in the decade before. Aiming to jar the public to
    reflect on the conditions of the consumer culture in which they lived, Holzer
    began creating language-based works in 1977 as a student. From 1978 through 1987,
    she distributed one-line phrases, or “truisms,” as posters or stickers. Taking
    this work to public venues, she produced *The Survival Series* in 1983, which
    incorporated these aphorisms (such as, “a strong sense of duty imprisons you;
    absolute submission can be a form of freedom; abstraction is a type of decadence;
    abuse of power comes as no surprise” in various delivery forms, including signage
    and park benches (see figure 4.12).'
