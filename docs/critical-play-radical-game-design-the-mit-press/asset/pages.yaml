- pgno: 156
  md: 'particular, such language games become as political acts from the very top
    of “high culture” circles, down to the trenches of everyday experience. As Félix
    Guattari has noted, “The only acceptable finality of human activity is the production
    of a subjectivity that is auto-enriching its relation to the world in a continuous
    fashion. The productive apparatuses of subjectivity can exist at the level of
    megapoles as easily as at the level of an individual’s language games.” ${ }^{184}$
    Artists’ language games are thus frameworks for an opening up of subject positions,
    a liberation of what it means to make rules, share them, and play.


    The artists mentioned in this chapter who engaged in language play have demonstrated
    innovation through obnoxious position, such as Jarry’s assault on taste, and through
    palindromes and puns, such as those so favored by Duchamp. Apollinaire’s ontology
    of Simultanism provides another example of the powers of language, the unconscious,
    chance, and invention. Automatism, long explored under various terms, including
    Mallarmé’s vers libre, shifted notions of subjectivity, form, and function, and
    invoked play methods that allowed significant shifts in authorship. Together these
    artists present a form of practical, location-specific critique in physical space.
    Such artists’ critiques can be traced to the rough categories of reskinning, unplaying,
    and rewriting, as can Holzer’s challenge to contemporary information systems and
    advertising. Holzer’s turn toward performative texts, social awareness, and possible
    activism continues in the Guerrilla Girls, who literally reskin themselves as
    jungle creatures to desexualize or oversexualize and complicate their female identities.
    Utterback reintroduces the body to language, and in the space in between offers
    something to be learned. As the connection between art and critical play continues,
    artists will further explore embodied play and situations in and efforts to “unplay”
    preconceived notions of the body, computers, and everyday living, and rework them
    into radical maps and written documents. While these works are not necessarily
    games in a strict sense, they are heavily engaged with the theme of participatory
    play and are part of the lineage of the contemporary playculture forms, subverting
    dominant notions in popular culture and media, as well as the “traditions” ensconced
    in the contemporary art institutions.'
