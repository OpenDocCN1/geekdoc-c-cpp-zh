  md: '# LANGUAGE GAMES


    The only acceptable finality of human activity is the production of a subjectivity
    that is auto-enriching its relation to the world in a continuous fashion. The
    productive apparatuses of subjectivity can exist at the level of megapoles as
    easily as at the level of an individual''s language games.


    > —Félix Guattari, *Chaosmosis: An Ethico-Aesthetic Paradigm*


    Wordplay is fundamentally expressive and rich in critical play. Games involving
    language span across global linguistic systems, geographies, and cultures, and
    are vital for designers. Linguist David Crystal states that language games “cut
    across regional, social and professional background, age, sex, ethnicity, personality,
    intelligence and culture.”¹ Rather than provide a comprehensive analysis of all
    language games, this survey is meant to uncover techniques of language play invoked
    by artists. What is most interesting for game designers is how certain forms of
    language invention can constitute a play space through the use of words themselves
    as a medium, placing critical language close by its own noncritical context. How
    are language games signaled? How do they subvert language itself? Exactly what
    kinds of language play can be unearthed from artists’ practices?


    Some subsets of linguistics refer specifically to language games as secret languages.
    These have been concocted around the world, passed down verbally in forms for
    use in ritual and everyday practices. These examples of transforming speech include
    at least some language play likely to be familiar to readers: pig latin, “formal”
    gibberish, the French Verlan, and hundreds of other invented language forms. Wordplay
    takes on many shapes: poetry, in word meaning and metric and shape; in symbolic
    and metaphoric language; in exchanges in fiction as practiced by Lewis Carroll
    or Dr. Seuss, word puzzles, word games, puns, limericks, riddles, and the unexpected
    use of language.'
