  md: 'The American composer John Cage had been investigating the dialogue between
    rules and aesthetics since the 1930s. On August 29, 1952, Cage continued this
    investigation by initiating a now-famous dialogue between the audience and the
    rules that guide aesthetic experience. For the premiere performance of *4’33’’*
    (*4 minutes, 33 seconds*), David Tudor sat at the piano and, when the piece began,
    played nothing, closing the keyboard lid at the proper moment to signal each of
    the “silent” movements in *4’33’’*. In the act of depriving the audience of “music,”
    the works asks the audience to listen, transforming the listening experience to
    one in which listeners actively create their own composition through the live
    sounds and noises around them. This work, like other Cage compositions, involves
    chance operations and redirects the authority of the creative process to the participant,
    completely altering the social roles of composer and listener. In a keynote address,
    Cage said: “My *Music of Changes*, composed by means of *I Ching* chance operations,
    I was to move from structure to process, from music as an object having parts,
    to music without beginning, middle, or end, music as weather . . . choreographies
    are not supported by my musical accompaniments. Music and dance are independent
    but coexistent.”⁶⁴


    The openness of Cage’s process surfaced in many Fluxus artists’ philosophies.
    “I don’t ever want the art to be still, finished,” states Alison Knowles. “I want
    it to be available for somebody to do something else with it . . . [something]
    that I wouldn’t have thought of.”⁶⁵ The use of scores or instructions emphasizes
    the profoundly boring activities in Fluxus games. But merely drawing a Huizingian
    magic circle around an everyday action transforms it into an art action, a game,
    and places it in an area of fantasy.⁶⁶ Knowles’s performances involving ordinary
    activities became a hallmark of 1960s and 1970s performance art. One of her most
    well known works, *Identical Lunch* (1971), is a performance of eating a sandwich.
    Documented in the *Journal of the Identical Lunch* (figure 5.7), the work consisted
    of a series of performances that actually constitute the piece. The identical
    lunch was a tunafish sandwich on wheat toast with lettuce and butter (no mayo)
    and a large glass of buttermilk or a cup of soup. The lunch was eaten many days
    of the week, by different people but at the same place and around the same time
    (lunchtime). Documentation of each lunch was provided in a variety of formats.
    This work succeeds in breaking down the distinctions between audience, artist,
    artwork, and everyday life.


    Spencer noted that “play and art are the same activity because neither subverses,
    in any direct way, the processes conducive to life and neither refers to ulterior
    benefits, the proximate ends are the only ends.”⁶⁷ The work of these artists demonstrates
