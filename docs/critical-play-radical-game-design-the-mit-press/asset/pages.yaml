    While games in the United States were focused on morality and behavior, many European
    board games recounted folktales and historical events. Encounters with Car-thephius
    or Ahasuerus, the mythological “Wandering Jew,” were purported by Chris-tians
    throughout the Middle Ages and beyond. According to a folk tale, this Ancient
    Mariner figure insulted Jesus on his way to the cross, and became an immortal
    due to a curse from Jesus. Sightings used to occur across Europe, particularly
    in the Middle Ages, with documented visits from Moscow and every Western European
    city, including London. 64 By the nineteenth century, most sightings of the Wandering
    Jew were associated with the mentally ill, but the legend became celebrated in
    cultural forms. Author Eugène Sue wrote his own version of the anti-Semitic tale,
    *Le Juif Errant*, which was serialized in 1844–1845. In his narrative, the Wandering
    Jew (whose name to Medieval Jews was a reference to a fool) and his sister are
    bound to protect the Rennepont family, for if this family leaves the earth, both
    the Wanderer and his sister will lose their immortality. The Jesuits have persecuted
    the family, which has grown and its members dispersed to become generals, an Indian
    prince, a workman, and even a Jesuit missionary in the Americas. Meanwhile, there
    is a large fortune to be gained by the remaining members of the family, and the
    Jesuits and their henchmen are hid-ing all around, attempting to acquire the funds.
    The immortal Wandering Jew and his sister help the family at crucial moments such
    as when they are about to be “scalped” by the Native Americans, or have been sentenced
    to prison. The serialized narrative has plenty of obstacles and adventure while
    reinforcing cultural biases.


