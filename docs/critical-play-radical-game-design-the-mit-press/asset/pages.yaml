    # Suburban Life


    If the classic American player’s physical home is a cul-de-sac “castle,” then
    the player’s *Sims* house and the surrounding *Sims* suburb can easily become
    a vision of utopia where each player’s house is constructed as a world unto its
    own. While there are varying notions about spatial practices and particular urbanization
    models, suburbanization as phenomenon is central to the design of *Sims* experiences.
    Silverstone attributes the first suburb to London, where crowded conditions in
    the nineteenth-century city drove the middle class outside the city center.⁸⁵
    Populations in London suburbs doubled in the second half of the nineteenth century,
    and other cities worldwide soon followed suit as transit systems such as commuter
    trains, freeways, and automobiles fostered suburban growth. The play environment
    of *The Sims* recreates these particular aspects of suburban design, especially
    those elements focusing on control over the environment and the idea of “safety.”
    As architect Lars Lerup notes, the suburban dream extends even to the vehicles
    used by its inhabitants to go to work. More than transportation, the SUV is a
    now-classic icon that, at least metaphorically, extends the safety and shelter
    of the suburbs throughout the commute into the dangerous city. The larger the
    SUV, the better the control over one’s environment. As players strive for consumer
    sardom by expanding their homes, accumulating luxury goods, and hosting unique
    social events, *The Sims* explores an almost infinite set of grandiose suburban
    control fantasies.


    *Sims* homes are set in generic, suburban tracts outside the area where characters
