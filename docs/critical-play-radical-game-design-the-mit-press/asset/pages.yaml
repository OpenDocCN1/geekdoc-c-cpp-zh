    decide that Juliana is getting in the way of their close relationship, they have
    her pack up her meager belongings in a bucket and sell her to a whorehouse.


    This part of *The Intruder* may help game designers explore levels of abstraction
    and narrative that become a part of any critical game. Rather than set the game
    in the whorehouse, or depict the two brothers with Juliana’s belongings, the image
    onscreen is abstracted in space and situation to feature simple elements of the
    narrative like the text, the belongings of the character, the props from the story,
    and the upfront images of a nude woman.


    As *The Intruder* begins, players are presented with the image of a woman’s bare
    underside situated over a bucket (figure 7.2). In this game, it is the woman’s
    body that literally produces the story, as though the story was a kind of birth.
    The female body also produces trinkets the player must catch while maneuvering
    the bucket. This loaded image represents several narrative layers: Juliana’s meager
    possessions, her own status as a possession of men, and the value of the woman’s
    body as replaceable in the narrative, to be exchanged for her sales price to the
    whorehouse.'
