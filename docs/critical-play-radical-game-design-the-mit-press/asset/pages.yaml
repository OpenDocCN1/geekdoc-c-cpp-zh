    # Types of Critical Play


    At this point then, I would propose terms for the types of critical play enacted
    by Victorian girls, acknowledging that the space in play for reworking cultural
    conventions reflects Turner’s notion that play creates “liminal” periods for the
    community of play participants. $^{40}$ Furthermore, the enactment of critical
    play exhibits at least three kinds of action: unplaying, re-dressing or reskinning,
    and rewriting.'
