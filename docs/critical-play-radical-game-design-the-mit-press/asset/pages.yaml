  md: 'bodies, but also the reproducible nature of the work''s fundamental basis and
    its novel technological form contribute to the confusing between-world-wars status
    of both female artists and the representation of female bodies. This type of collage
    became an important means of expression in Dada and continues to function as a
    critical medium. Given the era and the Dada movement''s limited access to institutions,
    this type of critical play demanded a complete break with political and cultural
    concerns.


    # ## Surrealists and Performance


    As we have seen, the trend for artists and game makers involved in critical play
    is to start with the workings of the human mind, the same human mind that had
    conceived and enacted the monstrosity of war. Most Surrealist games were based
    on activities as familiar as Victorian-era parlor games—group games played indoors
    to amuse the members of the upper and middle classes during their newfound leisure
    time.²⁴ But the Surrealists pushed activity into an exploration. Max Ernst''s
    writings show one element of his investigation of everyday space during leisure
    time:


    > The 10th of August 1925

    Raining day in a seaside inn found me gazing at the floorboards of my room. My
    gaze became excited, then obsessed by the sight of the boards. There were 1000
    rubbings set deep into the grooves. I decided to then investigate the meaning
    of this obsession, and to have my meditative and hallucinatory faculties; I made
    a series of drawings by placing on the boards sheets of paper which I rubbed with
    black lead. I gazed at the drawings and surprisingly a hallucinatory series of
    contradictory images rose before my eyes. Superposing themselves one upon the
    other.²⁵


    Like Ernst, the writer André Breton searched for procedures and methods to match
    his process techniques. Breton''s 1921 meeting with Freud in Vienna solidified
    his commitment to exploring theories of the unconscious, and through time Breton
    continued to develop methods inspired by psychoanalysis.


    But whether examining the mind or the machine, the Surrealist definition of a
    game, and the route to the discovery of a game, differs significantly from the
    rigorous frameworks put forth by recent games scholars, particularly the frameworks
    offered by the study of computer games. Surrealists were, above all, sensitive
    to method, to technique, to a process that is as fundamental to an art practice
    as its outcome. Games generated from Surrealist experiments were themselves cultural
    methods that brought meaning to the everyday by altering participant relationships
    to the world through rule-based systems. Surrealists believed that as the seat
    of imagination, the'
