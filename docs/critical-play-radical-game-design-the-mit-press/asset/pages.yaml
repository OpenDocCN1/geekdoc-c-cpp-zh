    # The Most Popular Games Mirroring Conflict and War


    The metaphor of war, of captured territory, and abstract personal combat, has
    served as a foundation for many of the most well-known board games from the Chinese
    game of Go to chess and checkers. Go, or Wéiqí, was noted earlier as a game having
    possible roots in divination practices. Wéiqí was exported to Japan sometime during
    the fifth through eighth centuries. One sandalwood game was discovered dating
    from the time of the Japanese Emperor Shomu (701–756 AD). The game became very
    popular within the court culture of Japan''s Heian Period (794–1195 AD), and it
    is said that samurai appreciated the ancient game for its ability to shape strategic
    thinking. Military in its overall metaphor, the game involves the elements of
    defense, seizure, and capture. In the Japanese manifestation, Go was given as
    a special gift at weddings and was a documented pastime of Zen monks, shoguns,
    and tea ceremony masters. In its entanglement with ritual, the game itself reflects
    cultural and social characteristics of the times in which it developed and changed.


    Go is played on a nineteen-by-nineteen square grid. Two players, black and white,
    take turns placing pieces on the empty starting board in an attempt to “capture”
    territory. The two players use their respective stones to capture points, or intersections
    of lines, and to lay out a continuous area for ownership. The opponent invariably
    tries to invade the free area to capture territory. Players who start the game
    at different skill levels can handicap the game by shrinking the board and by
    allowing the weaker player more moves or more pieces.


    The Chinese poet Po Chü-i (772–846 AD) describes the special qualities of playing
    Wéiqí:


    > Mountain monks sit at the Wéiqí board

    under the bamboo''s semi-lucent shade.

    No one sees them through the glittering leaves—

    but now and then the click of a stone is heard.¹⁰⁰


    Here, a rare aesthetic is celebrated, and the game is identifiable through its
    noble sounds, its beautiful surroundings, and the engagement of ascetic men.


    In a move toward critical play, several contemporary artists have used the game
    of Go to raise political and social questions. The artist Lilian Ball used the
    game as a template of sorts in order to foster collaboration and dialogue. Her
