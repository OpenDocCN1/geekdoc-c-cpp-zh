    fair, and cater to a variety of play styles. Computer games, especially networked
    computer games, have become often-used and “public” social spaces. As such, they
    must be seen as spaces of translation, already transformed by game designers and
    the growing numbers of game players: international, transbordered, fluid. However,
    this international significance brings ever more importance to what those games
    are designed to be, what one does in them, and how play is constructed within
    them. Political change once occurred in the public space of the street, town square,
    and the plaza. Many games, some of the type geographer Gillian Rose labels “non-real,”
    are significant because now, more than ever, electronic games constitute cultural
    spaces.


    Furthermore, as a site for production and consumption of culture, community, language,
    commerce, work, and leisure, playculture is what can be termed a “thirdspace,”
    which Homi Bhabha in *The Location of Culture* calls the space of subversion,
    hybridity, and blasphemy. In fact, Bhabha argues that hybridity and cultural translation
    are in themselves subversive ideas, and therefore must be the place where binary
    divisions are challenged. ³ Urban planner Edward Soja argues that all spaces are
    “thirdspaces” which are lived and imagined spaces in between empirical or the
    previously understood geographies and physical forms of “firstspace” and the conceptual,
    ideological, or semiotic spaces of representation and mental forms of “secondspace.”
    Thirdspace is the site for play and struggle. Players may eschew binary oppositions
    and allow for the possibility of a subject to be simultaneously in several spatialities.
    As Soja points out, spaces are socially produced (1996) and thirdspaces are the
    only sites that contain the possibility for social and political transformation
    (1999). As Anne-Marie Schleiner notes, “Instead of replicating the binary logic
    of the shooter genre, of Cowboys and Indians, of the football game, if the US
    government borrowed tactics from real time strategy gamers or RPGers, we might
    be looking at a different global response.” ⁴


    If we think of games as presenting the possibility of the thirdspace, a social
    space with its own social relations, struggles, and symbolic boundaries, it is
    within this third-space that we must envision the more diverse and equity-promoting
    style of activity I call critical play. Following the line of work inspired by
    Langdon Winner’s well-known assertion that artifacts “have” politics, and building
    on my own theory-practice research in this area, I’ve come to realize that the
    methods followed by practitioners, whether consciously evaluated or not, are key
