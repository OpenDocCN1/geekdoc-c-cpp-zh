  md: '# Unplaying


    In this play action, players specifically enact “forbidden” or secret scenes,
    unfortunate scenarios, or other unanticipated conclusions often in opposition
    to an acceptable or expected adult-play script. In doll play, *unplaying* manifests
    in children abusing their dolls, “killing” them, or some other revision of the
    “care giving” framework of expected play. This critical kind of play reverses
    traditional expectations regarding care-giving behaviors and allows players to
    rethink the conventions involved in these social roles. While at first the gruesome
    act of killing dolls was seen as subversive, parents eventually encouraged doll
    death ceremonies in order to instruct girls on family funeral etiquette. ⁴¹


    # *Re-dressing or Reskinning*


    Players make alternative arrangements and disguise their dolls for subversive
    roles, altering the appearance or the presentation of dolls in a way that allows
    dolls to enter the forbidden scene. Dolls could merely change costumes, or they
    could be reskinned with makeup or masks to literally efface the surface of the
    body. For instance, girls who enacted doll funerals might construct clothing ensembles
    appropriate for death scenes. Parents eventually addressed these preferences by
    providing girls with doll caskets and doll manufacturers began packaging their
    fashion dolls to appeal to such subversion by creating new doll products that
    catered to critical types of play. Some dolls, for example, were sold together
    with elaborate black mourning outfits. ⁴²


    # *Rewriting*


    While many scenarios document “normal” kinds of play, in American fiction publications
    for children in the later half of the nineteenth century, short stories about
    death, dying dolls, and mourning proliferated in books and magazines. In fact,
    many books and essays were marketed to the dolls themselves, with titles such
    as *The Dolls’ Own Book* or *Playday Stories* (figure 2.8); both had narratives
    purportedly written by doll authors. ⁴³ In this way, those involved in the manufacture
    of dolls and doll culture (including children, as they wrote letters to such publications)
    could constantly revise or rewrite the narratives surrounding dolls. This fiction
    surrounding a burgeoning doll culture was powerful for a number of reasons. First,
