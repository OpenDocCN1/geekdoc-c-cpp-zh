    # Further Enactments


    Working primarily in Paris, Polish artist Andrè Cadere (1934–1978) used game meth-
    ods to create one hundred and eighty “performative” sculptures, or wood staffs,
    called “Barres de Bois.” From a distance, these hand-painted individual spindles,
    sitting on a pole, appear to be striped. The bars reference games, in part, as
    they were produced mathematically and constitute a type of language in their manipulation
    and arrange- ment of color. Their special, coded instructions seem to invoke strategy.
    James Hyde, a scholar of Cadere’s work, notes: “Cadere valued his works as conversation
    starters— props for opening dialogue.”76 This intention is aligned with the formal
    patterns of the bars: As Daniel Birnbaum has noted, the “color schemes of his
    signature barres de bois rond (bars of round wood) are based on a code derived
    from mathematical permuta- tions, into which Cadere introduced a single error
    in each case.77


    Cadere not only made rules for his work but also included in them subversion and
    deviation from his own system. Playing a game of mismatch and error, Cadere tempted
    participants to notice, recognize, and either subvert or disrupt the system'
