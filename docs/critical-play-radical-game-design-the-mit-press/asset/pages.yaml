  md: 'intervention had significant impact on contemporary art and on social changes,
    such as the May 1968 movement in France and the antiwar protests in the United
    States during the conflict in Vietnam. These artists again turned to nontraditional
    media, using posters, video, and performance to unplay traditional art and its
    traditions, the themes of “highbrow” modernism, and the power and politics of
    the state. Games demonstrate particular reflections on technology, and as new
    technologies swept the globe the widescale effects of war—especially the Holocaust
    in Europe and the dropping of the atomic bomb in Japan—the promises of science
    and the possibilities (and dangers) of machines gripped those in the art world
    and beyond. Artists searching for meaningful relationships between lived experience
    and culture once again turned to extreme situations and the performance of artistic
    interventions or “art actions” that took artworks out of the gallery and into
    untraditional territory.


    Japanese artists were particular proponents of such actions. The Gutai movement,
    assembled in post-Hiroshima Japan, originated a particularly intimate set of responses
    to twentieth-century concerns about technology and the “new society” it heralded.
    Gutai were conceptual artists, incorporating novel materials and media of the
    day as a way to break the boundaries between the artistic forms of sculpture or
    painting and the forms of events. With events culminating in art actions, scenes
    and tableaux of performance, creative outdoor events and camping, or interruptions
    of popular culture, the artists were interested in creating difficult-to-categorize
    phenomenon. In 1955, Gutai''s founders conducted a two-week performative event
    in the suburbs outside Osaka. This rigorous artistic experiment was designed to
    take art out of the hallowed hall and expose artworks to the outside elements—in
    this case, literally. Young artists took over a pine grove and staged a thirteen-day
    exhibition of paintings, gigantic sculptures created from abandoned machinery
    and other unusual objects, and performances, in the face of sun and rain. Atsuko
    Tanaka (1932–2005), one of Japan''s most important avant-garde figures, put out
    a large pink-bubble-gumcolored vinyl sheet to ripple in the wind. 40 Another Gutai
    member, Saburo Murakami, took a ball, dipped it in ink, and tossed it against
    a wall repeatedly, trying to invent a “new painting” using the “feel” of velocity
    through chance operations and random play. According to Alexandra Munroe, Gutai
    means “tool and body”—thus elements of performance and technology are intertwined
    in many of the works. 41


    In fact, Gutai produced a very early strain of conceptualism, one specifically
    influenced by both the shock of the annihilated Hiroshima and Nagasaki and by
    the 1950s utopian visions of technological change and science. Atsuko Tanaka is
    known for creating playful clothing works. Inspired by a drugstore sign in the
    Osaka train station, Tanaka appropriated the medium of electricity to create a
