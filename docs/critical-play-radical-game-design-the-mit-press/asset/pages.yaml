  md: 'and involves massive, local participation. The *B.U.G.* project served as an
    innovative way to investigate social change through urban space and participatory
    play. The game was a race between three teams — red, yellow, and blue — each composed
    of Twin Cities residents, who try to move their own twenty-five-foot-high, inflatable
    colored game piece through different neighborhood checkpoints in the shortest
    time with the common goal of reaching the Lake Street Bridge. The progress of
    the three teams was tracked electronically each day, and shown in the local newspapers
    and on TV news. The public could participate with the players to choose the fastest
    route to the next point by voting online or calling the *B.U.G.* 800 number. The
    players, volunteers from the community, raced their pieces through the city following
    the path that earned the most votes.


    The most interesting part of *B.U.G.* is the emphasis on watching the game pieces
    crossing neighborhoods, sometimes quite disparate neighborhoods, and the resulting
    tendency groups of residents had to mingle and play together. *Big Urban Game*,
    which not only took the city of Minneapolis by storm but represented an adventurous
    experiment in urban design research, led to *Karaoke Ice*, a project that also
    explores the realm of the participatory public work (figure 6.12). Like an earlier
