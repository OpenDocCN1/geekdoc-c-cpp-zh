    # # Games and Hard Times


    While Giacometti was developing his game boards, and the Surrealist artists were
    honing their play performances, the popularity of games continued to rise around
    the world. Part of what makes play meaningful is the social and cultural context
    in which a play takes place. In *Rules of Play*, Katie Salen and Eric Zimmerman
    state, “*Meaningful play* occurs when the relationships between actions and outcomes
    in a game are both *discernable* and *integrated* into the larger context of the
    game.”⁸¹ Therefore, changes in any larger social situation, such as a severe economic
    depression, may signal profound changes in games. Sales of board games such as
    *Monopoly* increased dramatically during the Great Depression in the United States,
    while the game pachinko was a favorite abroad in countries such as Japan during
    those same hard economic times. It seems the more that economies struggled, the
    more the sales of games increased.⁸²


    Pinball gained widespread popularity in the United States, United Kingdom, and
    France, mass-produced as a popular pastime for military men. Writes Roger C. Sharpe:
    “Pinball is like making love: It demands the complete concentration and total
    emotional involvement of the player. Nothing else will do.”⁸³ The game was invented
    in the United Kingdom in 1871 by Montegue Redgrave, who added a coiled spring,
    plunger, and inclined play board to a game previously known as Bagatelle. After
    1942, manufacturers such as Bally, Gottlieb, Genco, Exhit, Keeney, and Stoner
    equipped their factories to create gun parts, communications technologies, and
    other defense products instead of producing pinball games. Existing game machines,
    however, were updated with paint and new graphics that reflected wartime themes.
