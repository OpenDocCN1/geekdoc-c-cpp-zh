  md: 'their general life conditions, then the hidden transcript played by those who
    are far from empowered can perhaps communicate to game designers important strategies
    through which games can expose, validate, or celebrate these equally valid modes
    of discourse.¹⁹ In turn, players may use this information and their experiences
    to alter the social institutions we live by. Using the critical play method, the
    role of the designer can widen to include an analytical framework for comprehension
    or analysis, characterized by a careful examination of social, cultural, political,
    or even personal themes that function as alternates to popular play spaces.


    The challenge, then, is to find ways to make interesting, complex play environments
    using the intricacies of critical thinking and to encourage designers to offer
    many possibilities in games, for a wide range of players, with a wide range of
    interests and social roles. We can manifest a different future. It is not enough
    to simply call for change and then hope for the best; we need interventions at
    the level of popular culture.²⁰


    Too often social challenges are presented in overwhelming or depressing ways.
    Most players are not attracted to overly didactic communication. After all, play
    occurs only when players feel comfortable. Play is, by definition, a safety space.
    If a designer or artist can make safe spaces that allow the negotiation of real-world
    concepts, issues, and ideas, then a game can be successful in facilitating the
    exploration of innovative solutions for apparently intractable problems. Play
    offers a way to capture player interest without sacrificing the process of thinking
    through problems that are organized subjectively. Games engineer subjectivity
    because they create, or rather they are, both affective and relational systems,
    both for the designer and for the player. Critical play is not about making experts,
    but about designing spaces where diverse minds feel comfortable enough to take
    part in the discovery of solutions. Derived from artists'' creative processes,
    investigations, and practical work, critical play is to popular computer games
    what performance art once was to the traditional, well-made stage play. As in
    that earlier shift, critical play demands a new awareness of design values and
    power relations, a recognition of audience and player diversities, a refocusing
    on the relational and performative as opposed to the object, and a continued and
    sustained appreciation of the subversive. Critical play is also a new discipline
    of theory and practice that embodies a set of methods and actions. The critical
    play method is intended as a tool for future game makers, play designers, and
    scholars. The desired results are new games that innovate due to their critical
    approach, games that instill the ability to think critically during and after
