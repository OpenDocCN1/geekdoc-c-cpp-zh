  md: 'Marxist ideology, serving to critique a commodity-driven culture and a growing
    bourgeoisie that allowed the consumption of both space and objects by a voracious
    cultural and economic machine. Inspiration was sought elsewhere with situations
    and experience elevated through playful, intuitive methods. The participant became
    the artist, constructing the art experience and using urban walking as a reflective,
    and critical, tool. On the surface, locative projects like Symons''s Aura seem
    to be a type of sonic dérive created to both offer a heightened sense of space
    and forge social instances of cooperation and community. If it is indeed a site-specific
    work, the issue of locality, of the embedded meaning of space, is an aspect of
    the work that appears far less relevant to the intention of the piece than the
    facilitation of social interaction.


    # **“Locative Media”**


    Play''s ability to empower, build community, and foster collaboration and cultural
    change has been cited as a significant motivating factor in many location-based
    media projects. Intel researchers of ubiquitous computing recently helped organize
    the Inter-Society for Electronic Arts festival in 2006, noting that “the contemporary
    city is weighted down. We can no longer technologically or socially be constrained
    by something planned and canned, like another confectionary spectacle. We dream
    of something more, something that can respond to our dreams. Something that will
    transform with us.” ${}^{20}$


    As a genre of projects and set of tools and technologies involving computing,
    mobile technologies, physicality, and location, locative media is asked to speak
    to those dreams through playful scenarios, interactive events, or actual games
    with rules and win states. Artists in this field are repurposing GIS/GPS, communications,
    and mapping technologies to create experiences labeled as diversely as “Urban
    Games,” “Locative Art/Games,” “Massive Games,” “Flashmob Art,” “Ubiquitous Games,”
    “Hybrid Games,” “Alternate Reality Games,” and “Pervasive Games.” Locative games
    offer an ambiguous or ambient game experience. Players explore ideas of participation
    and space, particularly the space of the city, by combining physical and technological
    play. ${}^{21}$ In most locative games, players also experience the game as belonging
    to the realm of ordinary life, since the events or play sessions often occur in
    recognizable places and situations. In many of these projects, themes of mobility
    and play are touted as liberatory, opportunities for interactions of scale and
    in environments where play has not been experienced. Here, play emerges as fabricated
    or designed phenomena in various locations. Commercial games, which already exploit
    locative media technology or pervasive play styles, include The Beast, La Fuga,
    I Love Bees, Mogi, ConQuest, Numb3rs, and Crossroads. ${}^{22}$ Locative games
    can have fixed play lengths or offer a scenario for play until a winner, or winning
    team, emerges.'
