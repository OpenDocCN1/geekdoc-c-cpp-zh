  img_proc: true
- pgno: 23
  md: 'I turn to language games in chapter 4. Puns and jokes, sound games, the historic
    methods of Simultanism and automatisim, and the use of textual instructions and
    rules (including public disruptions) and embodiment are explored.


    In chapter 5, I look at performative objects and games, including sculpture and
    photography, and study how critical game makers are approaching their games as
    physical interventions. Examining play that uses the body or the object in compelling
    ways, this chapter emphasizes collage, surrealist game methods, artists taking
    to the street with performative games, and the New Games Movement.


    I explore locative games in chapter 6 as artistic practices expand to take play
    into environments in which player-participants can make meaning in public spaces.
    This chapter refers to play that is generally outside or in unusual locations,
    and examines the work of the Situationists and their method of the drift.


    Chapter 7 focuses on artists'' alternative computer-based games, including online
    and offline games. I provide an analysis of projects from Persuasive Games and
    those of Gonzalo Frasca, as well as other games created through the use of interventionist
    strategies in the design process.


    To conclude, in chapter 8, I explore games for change, considering the ways in
    which activist concerns can be incorporated into game design. If a hypothesis
    for activist gaming is that a well-crafted approach to embedding certain ideologies
    (interventionist strategies) in design will have the capacity to alter the practices
    on both the part of conscientious designers and artists as well as the players,
    the goal of this chapter is to support makers who make real the systems that support
    an array of such choices. I conclude by discussing several methodologies for designing
    critical play as revealed in prior examples and analysis.


    Rather than provide a comprehensive analysis of all games, this book aims to uncover
    some of the more interesting instances of artists'' works where play and criticality
    manifest. Along the way, historical innovations in game play as they reflect social
    mores will be highlighted. The goal of Critical Play is to examine the ways in
    which individuals and groups involved in creating and playing games have worked,
    and are working within, social, political, and cultural systems. Their critical,
    radical play can be considered the avant-garde of the game as a medium.'
