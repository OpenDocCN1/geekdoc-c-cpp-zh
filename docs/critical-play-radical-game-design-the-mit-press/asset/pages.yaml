    # Artists and Surreal Games


    Let’s get back to the early twentieth century. With the mass production of graphic
    materials, board games continued to grow in popularity. In the early part of the
    twentieth century, World War I, scientific developments, and the increasing influence
    of the writings of Sigmund Freud brought new interest in the unconscious and new
    experiments with play. Games became an important part of this exploration of the
    internal life, as games consistently reflect both the culture in which they were
    created and, through play, the present context as well. Artists have used game
    as a medium of exploration and expression for over one hundred years. Like art,
    games tend to reinforce larger cultural influences. Artists, especially those
    who followed the Surrealist and Fluxus movements, also tend to play games as a
    form of recreation and research. Furthermore, artists tend to be especially critical
    of the ways games are tied to social structures, economies, and ideas of their
    times.


    In his mid-century study Man, Play and Games, the French theorist Roger Caillois
    lays the groundwork for the study of a range of play behaviors. Caillois argues
    that various play forms that emerged in the West here incorporated play qualities
    he describes as “a taste for gratuitous difficulty.”71 Here, Caillois addresses
    games designed for the mastery of a special skill or activity, typically leading
    to the discovery of some sort of satisfactory conclusion. Even when fictional
    or abstract, puzzles, math problems, wordplay, board games, and particularly games
    of strategy seem to point to the satisfaction inherent in successful completion
    of challenges. The more radical and political twentieth-century artists, such
    as the well-known Dada and Surrealist groups, balked at these challenges. Though
    only a few board games were formulated, Dada artists, brought together by the
    upheaval of the world war in Europe, were playful and absurd in their questioning
    of tradition, culture, and the role of art.'
