    # Surrealist Writing


    Other writers also followed the systematic, automatic writing approach favored
    by figures such as Freytag-Loringhoven. Automatism, whether emerging from beyond-conscious
    levels of the mind or from a physical process in which the artist is not in complete
    control, is based on the absence of “conscious” design. Chance operations organize
    automatism into particular events or sequences. As noted historians of Surrealist
    processes, Broochie and Gooding describe automatism as follows: “Sit at a table
    with pen and paper, put yourself in a ‘receptive’ frame of mind, and start writing.
    Continue writing without thinking about what is appearing beneath your pen. Write
    as fast as you can. If, for some reason, the flow stops, leave a space and immediately
    begin again by writing down the first letter of the next sentence. Choose this
    letter at random before you begin, for instance, a ‘t,’ and always begin this
    new sentence with a ‘t.’”$^{50}$ Broochie and Gooding also describe the work of
    the Surrealists in the vocabulary of gaming:'
