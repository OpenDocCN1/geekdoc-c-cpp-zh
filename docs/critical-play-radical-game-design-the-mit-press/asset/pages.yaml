    Play patterns themselves reflect cultural change. While Fragonard''s Enlightenment
    high society seems to flirt and swing far from the concerns of the Enlightenment
    and the establishment of scientific thinking, its very ability to play hinted
    at the promises offered by industrialization and the coming leisure class. In
    the West, play became organized and structured around objects at the onset of
    industrialization. Henri Lefebvre (1901–1991), noted twentieth-century Marxist
    critic and philosopher, whose influential writings connect social systems to space,
    noted that the construction of the concept of “leisure” was key to contemporary
    notions of the everyday and that it took the development of a bourgeois culture
    to create the idea of leisure for all. While the ruling class enjoyed free time,
    changing class relations and a growing desire for leisure combined among the masses,
    creating a “culture of the consumer.” In turn, the commodities and goods developed
    to satisfy the masses'' desires for leisure time came to reflect the power structure
    of a developing elite. Play cannot erase these distinctions, but play may often
    reinforce established power or challenge it.¹⁵ In many cases, the activities of
    play carry nostalgic and class-informed notions of free time, leisure, and access—a
    tendency still inadequately addressed by most theorists of play; studies of play
    have been relegated to the nursery, with a significant body of scholarship in
    the field of play research emerging from developmental theories emphasizing childhood
    play.¹⁶ From this perspective, play becomes “a primary vehicle for and indicator
    of [childrens''] mental growth. Play enables children to progress along the developmental
    sequence from the sensorimotor intelligence of infancy to preoperational thought
    in the preschool years to the concrete operational thinking exhibited by primary
    children . . . play also serves important functions in children''s physical, emotional,
    and social development.”¹⁷


