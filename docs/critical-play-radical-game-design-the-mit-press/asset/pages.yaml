  md: 'other cases, performances may be constructed around particular objects that
    are typically used in games—for example, a chess piece or a shoe both denote other
    specific uses and other contexts when they became elements of a game.


    Performance and play are intrinsically linked to the artist''s intervention.3
    In her book Bodies that Matter (1993), philosopher Judith Butler puts forward
    a theory of performativity, noting that the identity of the performing subject
    is a creation not of a body per se, but of a type of performance. Butler has observed
    that social norms such as gender are sites of negotiation for subjects who must
    choose from unrealistic or exaggerated binaries of gender identity. According
    to Butler, performance locates a point of resistance for those wishing to oppose
    narrow social categorizations. Some 1990s technology theorists like Sandy Stone,
    who saw a need to separate bodies from personae as Internet technologies entered
    the culture, also adopted this form of resistance.4 Butler''s break between the
    biology of sex and the performative nature of the gendered self resulted in the
    opening up of new ways gender and other social realities could be embodied and
    interpreted.


    Performance can also incorporate improvisation or “flow,” a common studio-art
    methodology. Flow is the state of consciousness in which one is so completely
    absorbed in an activity that even the ego falls away, letting creative urges shape
    direction.5 Similar to Butler''s alternate performances, practice researchers
    Cole and Knowles suggest that “whether it is through poetry, prose, movement,
    drama, mime, meditation, painting, drawing, sculpture or any other non-traditional
    linguistic or non-linguistic form, the important thing is to find a way or ways
    that will allow us to follow the natural internal flow of our inquiry. In a sense
    this is an essential element for researching through artistic expression.”6 Marcel
    Duchamp''s “laboratory work” is another example of practice-based artistic research
    that incorporates multiple methods and concepts similar to flow.7


    If historic avant-garde practices are consistently focused on decentering authority,
    game projects based on performance have created critical alternatives not only
    to other games, but to street culture as well. Important to this exploration is
    the role of rules in games and in art. Glimcher has argued that in helping to
    establish Russian Constructivism, Alexander Rodchenko founded one of the first
    “systematized” approaches to art making. In Constructivism, elements of an artwork
    would be assembled and then followed by a “laboratory” where the work was analyzed
    and perhaps iterated.8 Others might argue that art has a long history of composition
    by some type of principle or schema. Commissioned portraits of the Renaissance,
    for example, contained rules that might have been seen as just as prohibitive
    in the composition of works. The difference, however, may be in the choice of
    content matter'
