- pgno: 194
  md: 'Fluxus aimed “for the monosctructural and non-theatrical qualities of a simple
    natural event, a game or a gag.”¹⁰¹ Artists with Fluxus tendencies called attention
    to social rules of buying, selling, collecting, and canonizing in their own rule
    making. They also questioned the practices of the art world and of society through
    illogic, repetition, humor, and irony. Fluxus games culminate as complexities
    that, when taken to their end, unplay their own apparently simple themes and rules.
    Participant players become artists themselves, and formulate the opportunity for
    others to set individual goals during a Fluxus activity. Even at its most abstract,
    playful level, for the player-participant-artist, this activity is transformed
    into a game.


    The philosophy behind much of conceptual art, then, is closely aligned with fundamental
    aspects of play. Game theorist Roger Caillois, who consistently argues that “unproductivity”
    is an essential aspect of play, reinforces this: “Property is exchanged, but no
    goods are produced.”¹⁰² Caillois goes on to argue that: “characteristic of play,
    in fact, is that it creates no wealth or goods, thus differing from work or art.
    . . . Nothing has been harvested or manufactured, no masterpiece has been created,
    no capital has accrued. Play is an occasion of pure waste; waste of time, energy,
    ingenuity, skill, and often money.”¹⁰³ If in its noncommercial form conceptual
    art has historically been bound with behavior, patterns, and the processes of
    product, the works of conceptual artists are far more like play than anything
    else. Viewed this way, conceptual art and games are parallel worlds and perhaps
    it is due to this parallelism that they are able to offer alternate cultural theories,
    even utopian promises for living.


    At the same time, while gaming and play function in particular roles in the work
    of contemporary artists, the participatory nature of certain gaming methods, such
    as those of the Surrealists and Fluxus artists, undermine how games are traditionally
    defined.¹⁰⁴ Dada activities, Surrealist games and play, and Fluxus antics all
    incorporate play, and sometimes these activities constitute games, especially
    in the case of certain Surrealist procedures. Such games encourage game scholars
    Salen and Zimmerman, Crawford, and others to point to these activities as play,
    for games, they would argue, must at the very least have a winner or loser. Critical
    artist’s games, however, tend to be abstract or open. There are abstract games
    that incorporate “quantifiable outcomes,” if one takes into account the prose
    of an automatic writing exercise, the Fluxus experience of art as *action*, or
    the finished “product” of a multiperson exquisite cadaver exercise. Yet games,
    even when played within particular economies and ideologies, capitalism or communism,
    for example, can embody their own system of exchange and function from a potent
    critical distance. The critical procedures and strategies of performative player-artists
    is a significant aspect of innovative, critical gaming practice.'
