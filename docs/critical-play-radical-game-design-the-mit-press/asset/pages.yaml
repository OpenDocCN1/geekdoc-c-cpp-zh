  md: '# ## CRITICAL COMPUTER GAMES


    Since the 1990s, the extraordinary impact of individuals affiliated with the arts
    starting “grassroots wildfires” and “building guerilla technologies” in their
    quest for creative intervention has flourished onscreen. That context is important
    for this phenomenon is obvious. Computer games are more profitable and popular
    than ever before and have become a major cultural medium crossing a wide range
    of social, economic, age, and gender categories. Indeed, from casual games played
    on the Internet to large-scale stand-alone games like *The Sims*, *Metal Gear*,
    *BioShock*, or *Grand Theft Auto*, or the millions of players in massively multiplayer
    online role-playing games (MMORPGS), the popularity of computer games suggests
    a “revolution” measurable in terms of financial, social, and cultural impact.¹
    As a cultural medium, games carry embedded beliefs within their systems of representation
    and their structures, whether game designers intend these ideologies or not. In
    media effects research, this is referred to as “incidental learning” from media
    messages. For example, *The Sims* computer game is said to teach consumer consumption,
    a fundamental value of capitalism. *Sims* players are encouraged, even required,
    to earn money so they can spend and acquire goods. *Grand Theft Auto* was not
    created as an educational game, but nonetheless does impart a world view, and
    while the game portrays its world as *physically similar to our own*—setting one
    of its stories and action in the city of Miami, for example, and presenting humanoid
    avatars as characters—the game world''s value system is put forward as one of
    success achieved through violence, rewarding criminal behavior and reinforcing
    racial and gender stereotypes. Many scholars, game makers, and consumers observe
    that computer games can embody antagonistic and antisocial themes including theft,
    violence and gore, cruelty, problematic representations of the body in terms of
    gender and race, and even viciously competitive approaches to winning as a primary
    game goal.² While these practices are, of course, not the case for all games,
    related issues arise in a significant number of popular games and frequently overwhelm
    other,'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'subtler interactions and representations. At the same time, artists continue
    to use games to take on social and cultural issues. Although much of contemporary
    play takes place online and onscreen in commercial environments, an exploration
    of computer-based artists’ games is essential to understanding the complete picture
    of contemporary critical play.


    As mentioned earlier, the popularity of online networks, peer-to-peer exchange,
    and games have made playculture itself into a type of revolution. However, as
    formative cultural artifacts, games and game cultures are problematic. First,
    the computer games industry around the world is not inherently diverse. In the
    United States, for instance, the statistics in the game industry mirror those
    in other computer-related fields, and the demographic of the games workforce—the
    people who make the games—reflects the overall, limited expertise of the general
    public in computer languages and technologies. The number of women enrolled in
    computer science degrees has, surprisingly, declined considerably in the last
    twenty years.³ Black and Hispanic Americans represent a small percentage of all
    computer systems analysts and computer scientists working in the field, and well
    under 10 percent of programmers.⁴ The inequities that result are troubling, especially
    at a time when computers have become central to most disciplines and when computer
    games are emerging as a dominant medium. Researchers have described the dearth
    of diversity in technology professions as a social justice issue.⁵ As noted by
    many industry insiders, the vast majority of technology companies that produce
    games do not target women or people of color as players.⁶ Therefore, as gaming
    drives the development of new technology, and new technologies are made by a consistently
    similar demographic, the cycle of technological innovation and games entertainment
    remains fairly consistent. This has the unfortunate affect of keeping high-tech
    domains primarily white, primarily male, and primarily profit driven.


    Therefore, commercial, masculine computer artifacts have taken pride of place
    in contemporary culture, whereas noncommercial technology tools, including artistic
    games, are relatively rare. Artist Martha Rosler argues, “Art with a political
    face typically gains visibility during periods of social upheaval.” The information
    revolution continues to be a disruption of older, more traditional modes of production
    and labor. With this change have come both an inscription of new technologies
    across more traditional roles, and also a significant movement towards the monitoring
    and control of the individual. This technological adoption and adaptation creates
    a continued disparity in working conditions, privacy, privileges, and wages, even
    in Western high tech arenas.⁸ The computer is a portal to digital culture; however,
    it is more than a tool. Technological literacy and competence are essential to
    disadvantaged groups, which are once again in an unequal position in terms of
    experience and ranking in key'
