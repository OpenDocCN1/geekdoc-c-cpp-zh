  md: 'more actions, that are adaptable to present concerns. The critical play method
    I propose here should provide an effective model for designers and artists to
    use to engage in, and encourage, critical play in both game making and game playing.
    Critical play can and should be included in the traditional game design process.
    By proposing this design model and creating games with this set of strategies,
    it is hoped that other practitioners, artists, designers, scientists, and researchers
    will be able to question and elucidate many of the so-called “norms” embedded
    in our current play frameworks and technology practices, ultimately including
    a more diverse set of voices in the game design community and a wider spectrum
    of game experiences.


    # Why Care about Methods?


    On first glance, it can be difficult to see how artists working in a very different
    place and time would have significant manners, modes, and processes that inform
    game making today. Computer games are often discussed as an exciting new medium,
    but its ties to prior forms of play are not automatic. To the typical gamer, computer
    games are not obviously aligned with such concerns as ancient divination, psychoanalysis,
    utopian tax laws, environmentalism, or social protest. In the case of activist
    gaming, perhaps it is thought that the goals of the designer are “real,” and therefore
    can be best achieved with more direct approaches to the making. For example, a
    designer may wish to make a project concerning a local food bank. Typical disciplinary
    research would encounter particular truths and strands of information, rather
    than an artistic aesthetic.


    However, if we look to the fundamental reasons for *why we play*, the connection
    between artistic methods, activism, and game design becomes clear. There is something
    about designing play, especially the process of conceptualizing and making games,
    that requires an attention to possibility. As in art, the creation of play and
    games necessitates rule making at a fundamental level. Even simple role-playing
    activities, or playing house, both seemingly limitless open-play scenarios, include
    implicit or explicit rules that establish behavior, possible actions, environments,
    and the safe zone for play itself. Due to the systemic nature of both the product
    and the process, game makers use particular repeatable processes, or methods.
    Like activists, game designers also follow an overall scheme of investigation
    or research, creating processes to address specific concerns and ideas. In addition,
    the creation of rules of operation makes interesting constraints to provoke innovation
    in both the designer’s process and the player’s role.


    As game design matures, and as games themselves become more ubiquitous and more
    meaningful to culture, there is a growing need for designers to approach the'
