    # The Unconscious and Simultanism


    Among other wordplay techniques that the West must credit to the French avant-garde
    is the free verse (*vers libre*) of Jules Laforgue (1860–1887), the symbolist
    poet and master of lyrical irony. Laforgue argued for the link between writing
    and the subconscious mind. The free-verse approach also influenced Mallarmé and
    his poem "Un coup des Dés jamais n''abolira le Hasard," or "One Toss of the Dice
    Never Will Abolish Chance" (1897). These lines were purposely unpunctuated and
    were spaced on the page in an expressive fashion. 30


    Avant-garde writer Guillaume Apollinaire (1880–1918) published innovative graphic
    poems in his books *Alcools* (1913) and *Calligrammes* (1918). Both contained
    unusual wordplay and served as inspiration to the Dada artists and Surrealists.
    Called the "impresario of the avant-garde," Apollinaire was committed to the discovery
    of the roots of narrative, or rather, "the opposite of narration," a way to work
    with language that reflected the author''s notions in a kind of Cubist fragmentation.
    Apollinaire named this quality "Simultanism." 31 The technique represents "an
    effort to retain a moment of experience without sacrificing its logically unrelated
    variety. In poetry it also means an effort to neutralize the passage of time involved
    in the act of reading." 32 Apollinaire described his investigation of time as
    otological, saying Simultanism means a telescoping of time. This led Apollinaire
    to practice "découpage poetique." 33


    "Surprise," the category Apollinaire employed in his lectures to express all of
    the artistic innovations he advocated, describes only the surface aspect of his
    poems. "It is a secondary principle of a total freedom of invention, or plasticity,
    one that should lead to arbitrary constructions in no way imitating nature." 34


    # The Rise of Automatism


    Dada artifacts held by major museums or included in important books tend to be
    paintings, but the majority of Dada artwork took the form of reknning or rewriting.
    Dada moved between the performance of, say, Duchamp costumed as his female alter
    ego Rose Sélavy, to the production of texts that could fall anywhere within the
    range of demonstration, manifesto, declaration, or pamphleteering. Dada artists
    were'
