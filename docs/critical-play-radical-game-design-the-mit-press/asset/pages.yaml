  md: '# Time-Travelers'' Potlatch


    Related to Would You Open the Door, in Time-Travelers'' Potlatch players collectively
    come up with historical figures to discuss and think of gifts that they would
    offer these historical figures if given the chance.


    # Dessin Successif


    Dessin successif translates into “chain drawing.” In this game, each player studies
    the previous player’s drawing for five seconds, then redraws it from memory, with
    the point of the game being to see the metamorphoses from the first, middle, and
    last drawings in the chains as it passes through many hands.


    These and numerous other games developed by the Surrealists are collective methods,
    each of which provides a glimpse, however unscientific, into the unconscious processes
    of the participants. The games are intended to critique rationalism, possibly
    in recognition of the horrors of war and the frailty of human understanding. Again,
    unconscious motivations and dreams were areas of deep engagement for the Surrealists,
    and their fascination with psychiatry and psychoanalysis helped focus the artists''
    play on the abstract, the sudden, the intuitive, and the instinctual.²⁸


    # Opportunities from Performance


    How are these processes performative, exactly? And what can game designers learn
    from these examples of performative games? Unlike other creative methodologies,
    the specific use of games in the process of creativity represents a significant
    shift. The Surrealists made games in order to make art. Games were a process—an
    integral part of their research—not merely an outcome. Games such as exquisite
    corpse (see the example of Exquisite Cadaver from 1931, figure 5.3) harnessed
    the notions of chance and automatism, a set of unconscious acts that emerged possessing
    the unusual “possibility of thought, which is that of its pooling.”²⁹ This pooling
    of thought, its collective distribution among artists and intellectuals of the
    day, in turn created an effort that went beyond the perceptions of one individual
    author, transcending ego and self-interest to create an artifact of group research.


    In critical play, the performance of games can foster creativity, and further,
    produce new art forms, styles, and genres. Performance might reveal particular
    connections between subjects or shapes previously unknown. It might help the designer,
    for example, explore questions of permutation, repetition, and repeatability.
    The sense of subjectivity and the role of the player are additionally questioned
    and repositioned in these games. And, furthermore, “winning” might mean to experience
    or make'
