  md: 'Drawing inspiration from Dada and Surrealism, the Situationists were interested
    in the banal, everyday acts of urban life that could be subverted in a radical
    redefinition of everyday experience. The first issue of the journal *Internationale
    Situationniste* (1959) defined “situationist” as “having to do with the theory
    or practical activity of constructing situations. One who engages in the construction
    of situations.” Henri Lefebvre was closely involved in the group’s early activities.
    Guy Debord (1931–1994), also known as the founder of the Letterist movement, and
    famed for his later ideas that society has now become a society based entirely
    on shock and grandiose display, called for the practice of “psychogeography” to
    consciously document the experience of environment and geography on emotions,
    thinking processes, and behavior. One of the significant intentions behind psychogeography,
    as Debord described it, was to be *mindful* of space in the method’s open-ended,
    deliberately vague mission of encouraging people to explore their environment,
    usually the streets of the city. Psychogeography provided a means for participants
    to open themselves up to play and chance in context. It was a method of studying
    the world, combining compelling, inventive proposals with “the long-term aim of
    transforming ‘the whole of life into an exciting game’—the play principle before
    the work principle.”$^{16}$


    Through their manifestos, publications, and other writings, the Situationist International
    members detailed specific strategies to help achieve their critical purpose: to
    examine the psychological ramifications of the urban landscape: “We now have to
    undertake an organized collective work aimed at a unitary use of all the means
    of revolutionizing everyday life.”$^{17}$ This revolution would occur through
    the creation of temporary *situations* that would offer a brief moment of transcendence
    from boredom, thought to be a counter-revolutionary state. Using what they referred
    to as the *dérive* (derive), or “drift,” Situationists explored the urban terrain
    by enacting derives or drifts—migrations undertaken with the intention of discovering
    new perspectives on city life$^{18}$—and practiced an active type of *flânerie*
    whereby the formerly aristocratic walker was transformed into a conscious, political
    actor. According to Debord: “Our central idea is that of the construction of situations,
    that is to say, the concrete construction of momentary ambiences of life and their
    transformations into a superior passionate quality. We must develop a methodical
    intervention based on the complex factors of two components in perpetual interaction:
    the material environment of life and the components which it gives rise to and
    which radically transform it.”$^{19}$


    Obviously, this view was based on particular assumptions about statehood and human
    rights. As theorists, Situationists were bound by their time, place, class, language,
    and ethnicity, and may have failed to understand the *dérive* as an activity with'
