  md: 'Chapter 3 |


    Janet Murray defines agency as “the satisfying power to take meaningful action
    and see the results of our decisions and choices.”$^{21,24}$ Artist-created board
    games use this theory to its fullest, providing table-based mini laboratories
    for the examination of choice, chance, and social interaction. Some works, such
    as Giacometti’s board games, offer a critique of even the possibility of agency,
    implying that playing or enacting the sculptural game boards would be futile,
    cyclical, a trap. Games, such as Catlow’s chess game, expose the possibilities
    of player agency in other ways: first, by empowering the pawns, thus imbuing traditionally
    conceived pieces/roles with new power; second, by opening up the possible outcomes
    of the game in terms of widening the possible win states, thus rewriting the original
    in visionary ways. Metaphorical or actual, the game design must embody action,
    and depending on how active a game feels, its critique may be more or less apparent.
    Artists may invoke game metaphors, as Giacometti did in his game boards, and as
    Ono did in *Play It by Trust*, or artists can produce contexts for play, empathy,
    and learning, as Ono does in *Cut Piece* and Catlow does in *Rethinking Wargames*.
    These are different types of experiences but all foster a critical type of play.'
