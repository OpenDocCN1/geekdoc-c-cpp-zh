- pgno: 171
  md: 'work. In many projects she questioned binary categorization, playing with the
    notions of sexual difference, high and low art, and the mind/body separation.
    Like many Surrealists, Cahun used photography to “render the surface of the world
    palpable and render it marvelous.”35 Later recognized for their resistance to
    the Nazis, both she and her partner, Marcel Moore (Suzanne Malherbe), shared a
    commitment to identity play through the act of role-playing. Their related use
    of pseudonyms further demonstrated how representation in the “true eye” of the
    photograph could be problematized.


    Cahun used costumes ranging from monsters and vampires to sailors and masked,
    alien figures to foreground female transgression and desire, for her various self-portraits.
    These images do not merely present a play-act, however, or “portray” something.
    “They look back.”36 They have the indexical qualities of a photograph, the connection
    to the subject through light, the real “writing itself,” and the iconic reference
    to a problematically gendered body, providing surreal “counter archives” of the
    female body.37 Cahun’s interest in gender and power led to her investigation of
    opposites—Budah, to a school girl, geisha to weightlifter, Cahun’s exploration
    pushed at the edges of these opposites, exposing them as ineffective and artificial
    through her shifts in costume (see figure 5.4). On her photographic self-portrait
    collage titled “Claude Cahun and Marcel Moore,” an illustration for her book Avenux
    non Avenux (Cancelled for Unavowed] Confessions, 1930), Cahun wrote, “Under this
    mask another mask. I shall never finish stripping away all these faces. And underneath
    all these masks, there is no ‘real’ identity.”


    These complex images explore social codes and mimic standard tropes of identity.
    They reveal less a desire to become “other” and more a movement toward dissolving
    distinctions by presenting oppositions, by erasing boundaries between genders.
    By mixing the costume that might typically comprise a gendered performance, she
    merges opposites and renders them nonoppositional.38 Cahun’s combining, juxtaposing,
    and blurring of male/female form exhibit an unsettling voice of the double, the
    uncanny, and raise questions about the conscious performance of sexuality that
    other Surrealist work misses.39 Importantly, Cahun demonstrates through her “charades-like”
    guessing game of self-portraits the ways in which gender identity itself is constructed
    much like a performative game, a sentiment mirrored in Judith Butler’s later texts
    on performativity, and also in the work of Félix Guattari.


    # ## Postwar Artists and Play


