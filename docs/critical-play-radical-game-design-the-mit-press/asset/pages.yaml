- pgno: 161
  md: '# Performing Dada


    While several scholars and curators have noted the Dada movement''s influence
    on interactive art, its influence on *gaming*, especially in relation to the notion
    of performance, needs further exploration.¹⁵ First, and foremost, Dada concerns
    and interests do not appear intrinsically “fun.” From the point of view of European
    artist-refugees escaping the turmoil of World War I, Dada was not only a creative
    approach but also a *reaction* that valued creativity over violence and social
    upheaval. Jean Arp, one of the central Dada practitioners, noted, “In Zurich in
    1915, lacking interest in the slaught- erhouses of the war, we devoted ourselves
    to the fine arts.”¹⁶ Dada arose in the midst of war-torn Europe, which was still
    reeling from the shock of combat methods that had grown more horrifying from new
    technologies such as the first machine gun and the first military bombing run.
    Dada artists formed a belief, and a dread: A culture that had produced the horrors
    of a world war could not appreciate, indeed, did not deserve, art. Therefore,
    a complete break with tradition was necessary—a break that had to extend beyond
    art itself to the myths surrounding the artist. Only then would it be possible
    to create art without continuing political evils like fascism. The result was
    a blunt rejection of hierarchy, craft, and aesthetics.


    Dada artists in New York City gathered at Gallery 291 run by Alfred Stieglitz.
    Man Ray and Marcel Duchamp participated there. Francis Picabia moved between groups
    in Barcelona, New York, Zürich, and Paris. This was the time Duchamp was concocting
    his readymade sculptures, and Elsa von Freytag-Loringhoven was taking the streets
    of New York by storm.¹⁷ Other artists of the time also manifested concerns regarding
    aesthetics, taste, form, and other art styles co-opted by totalitarianism. As
    noted in the previous chapter, automatism was popular, as was the use of chance
    to compose images. Chance helped artists avoid the lure of the aesthetic formation
    of images and their resulting romantic expressions.


    Arp''s *Collage Arranged According to the Laws of Chance* (1916–1917) is one example
    of a Dada work that was created through automatism. In his automatic processes,
    Arp would draw, rip the drawings into pieces, allow the pieces to fall where they
    may, and then affix them where they lay as a memento of the operation. Arp, and
    artists like him, viewed chance not merely as accident, but as a *systematic approach*,
    and a means of access through the unconscious to the basic ordering processes
    of the natural world.¹⁸ By 1915, Arp was creating chance works that avoided the
    artistic ego to claim a place closer to nature. Hence, he declared that “these
    works, like nature, were ordered ‘according to the law of chance,’” “removing
    the artist''s will from the creative act, ‘by arranging the pieces automatically,
    without will.’”¹⁹'
