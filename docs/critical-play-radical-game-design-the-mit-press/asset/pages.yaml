    Like Go, the game of chess has influenced artists for centuries. Though historians
    disagree on the original details of the invention of the game, several well-regarded
    chess scholars have argued that texts in Pahlavi and Sanskrit support the idea
    that India was the site of development no later than the sixth century AD. ${
    ^ { 103} }$ In Sanskrit, the game was called *Four Members* (*Chaturanga*), which
    referred to the four regiments of the Indian army (chariots, cavalry, elephants,
    and foot soldiers). The Indian version of the game was played with realistically
    rendered pieces meant to resemble human participants. The game was introduced
    to Europe around 1000 AD by Arabs, who had played since the seventh century. ${
    ^ { 104} }$


    Arab scholars noted that the benefits of chess included diligence, thrift, and
    knowledge, one example of how the game has faithfully reflected cultural practices
    in the locations in which it has been played. For example, after death of the
    Muhammad in 642 AD, chess followed an edict of the Koran that forbids realistic
    human depiction. Game makers avoided representational models, opting instead for
    abstract pieces. ${ ^ { 105} }$


    Artists have depicted chess from its beginnings in drawings, paintings, and tapestries,
    including work in the influential document *Book of Chess*, written by King Alphonso
    in 1283 AD. The book served as both a textual and visual record of many chess-playing
    scenes in Europe. ${ ^ { 106} }$ Chess and backgammon dominated board-game pursuits
    in Europe until the Renaissance. There are numerous depictions of chess in artwork.
    Paintings such as Lucas van Leyden’s *Chess Players* (ca. 1510 AD) or *A Game
    of Chess* (1906) by Bernard Louis Borione demonstrate that the game has frequently
    captivated artists in many everyday scenarios. Earlier, the Romanesque mosaic
    found in the choir of San Savino in Piacenza, Italy (dating from 1107 AD), included
    a floor mosaic that depicted both the playing of a dice game and a game of chess.
    Scholars now believe that the artist juxtaposed the two games to represent a polarity
    of two paths in life: man can either commit himself to the chance and the unstable
    forces of the world, allowing his life to become lawless, chaotic, and evil; or
    man may choose to live with virtue and intelligence, so that he may imbue to the
    world intelligence, law, and harmony. ${ ^ { 107} }$ The conflict between fortune
    and virtue was one that the medieval Catholic Church was ready to promote in favor
