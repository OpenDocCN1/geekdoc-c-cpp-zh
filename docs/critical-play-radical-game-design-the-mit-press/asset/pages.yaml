    # Play Actions vs. Spaces


    Though historically artists have carefully involved the site in prior work, there
    are numerous examples of recent media-rich experiences, which refer to and appropriate
    space while divorcing it from its meaning, history, and significance. In September
    2006, Eyebeam in New York City hosted Come Out and Play, a festival dedicated
    to street games. The festival offered three days of talks, parties, and events,
    all focused on “new types of games and play.”40 Some games did not refer to specific
    spaces, preferring to imply the use of space. In one example, Frank Lantz’s *Identity
    Game* could have been played in a large house, conference center, or school instead
    of the urban street. Other games specifically took on street themes in their design.


    In the locative media game *Cruel 2 B Kind* (C2BK), initial teams of two players
    act as assassins, stalking other teams and “killing” them with acts of kindness.
