    # The Rise of Serious Games


    Artistic interventions in the form of games arise from a number of intentions,
    including social critique, a need for solidarity and action among participants,
    and the impulse to stage large-scale games in order to disrupt political scenarios
    or daily life. Some of those making video games, as we have seen, can be identified
    as artists. Bookchin, Stern, Vanouse, Bilal, and Schleiner have provided compelling
    activist models. Bookchin reskins games in light of critique by using existing
    narrative. Stern rewrites how games work and adds to their complexity. Vanouse
    brings in a critique of larger epistemological concerns through a look at scientific
    discourse and classically styled games. Bilal changes the stakes of a game, crossing
    lines not only in representation but also in national and international comfort
    levels, ethnic stereotyps, and the power of institutions and the state. Even earlier
    examples such as Schleiner offer historical precedents for projects that move
    primarily into the realm of activism. In all cases, digital worlds are enormous
    sites for the import of content from the real world. These can include social
    interactions and social constructions like racism and sexism, which can prevail
    inside particular types of game frameworks.


    The examples discussed in the rest of this chapter are described by the terms
    serious games, games for change, or social impact games. The debate regarding
    the general use of these terms must be noted. Different groups favor different
    categorical labels. Games scholar Woods argues that serious games are the goal
    of those within the game industry for the future of games, noting that many developers
    wish to create “serious” content or experiences that are typically represented
    within traditional narrative forms such as books or film. $ ^{45} $ Though these
    lines are not fixed and easily definable, most in the community understand serious
    games to be those primarily within the domain of education or military applications.
    Such games might focus on training for service, disaster relief, hazardous occupations,
    crime, the redesign of public spaces such as transit systems and parks, or the
    creation of frameworks for team building.


    On the other hand, games for change or social impact games are understood as those
    that address social concerns more broadly. These might include poverty, racism,
    bias and discrimination, war and peace, or human rights through education and
    outreach. There is a fast-growing collection of computer-based games designed
