- pgno: 9
  md: '# 1


    INTRODUCTION TO CRITICAL PLAY


    > By the madness which interrupts it, a work of art opens a void, a moment of
    silence, a question without answer, provokes a breach without reconciliation where
    the world is forced to question itself.


    —Michel Foucault, *Politics, Philosophy and Culture: Interviews and Other Writings,
    1977–1984*


    For many game players, games exist for entertainment, for passing the time, for
    fun. They are a diversionary activity, meant for relaxation or distraction—a “not-work”
    space where players are free to engage in fantasy narratives, amazing feats, and
    rewarding tasks. But what if certain games have become something *more*? What
    if some games, and the more general concept of “play,” not only provide outlets
    for entertainment but also function as means for creative expression, as instruments
    for conceptual thinking, or as tools to help examine or work through social issues?


    Each day, computer users check email, search for movie trailers or the news, and
    perhaps blog, balance a budget, or download digital camera images. They also play
    computer games—simultaneously during these other tasks, as in casual games, or
    in more comprehensive games both on- and offline, such as the multiplayer PC game
    *World of Warcraft* or a console game such as *Katamari Damashii*. Computer and
    console games have become a significant cultural medium across a wide range of
    social, economic, age, and gender categories.¹ As the game industry involves an
    increasing number of educators, designers, and scientists, there is considerable
    need for games that take on, and challenge, the accepted norms embedded in the
    gaming industry. There is a need for a critical approach not only in examining
    such games but also in creating them.


    *Critical Play* is the first book to examine alternative games and use such games
    as models to propose a theory of avant-garde game design—that is, like alternative'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'theories of narrative texts, poetry, and film, a theory that focuses on the
    reworking of contemporary, popular game practices to propose an alternative, or
    “radical,” game design. Specifically, this book investigates games designed for
    artistic, political, and social critique or intervention, in order to propose
    ways of understanding larger cul-tural issues as well as the games themselves.


    The research for *Critical Play* grew out of an avid interest in popular computer
    games technology, history, and cultural studies, as well as my own creative work:
    I use play and game fundamentals in projects as diverse as activist software design,
    class-room teaching, and drawings, installation, and sculpture that appear in
    more tradi-tional art venues. The games and other works I discovered while investigating
    my interests in social issues are collected in this book. In the course of so
    much play, I became fascinated with observing how ideas about politics, play,
    and games were most interesting in those projects operating outside the software,
    board-game, or theme park industries—not only among those who are independent
    game developers but also those who thought of making play scenarios or games within
    the context of being artists. Art has long been intertwined with politics; the
    twentieth century has wit-nessed provocative materials produced during the Mexican
    Revolution of 1910, the Constructivist political design used in the Russian Revolution
    of 1917, the theatri-cal protests in World Wars I and II, the 1968 student poster
    campaigns, and the U.S. civil rights campaigns that used mixed media. *Critical
    Play* outlines how play has influenced the history of creative exploration of
    the social and the political. The book’s arrival is well timed, for this is a
    significant era in which to learn how to play in ways that break the mold and
    open up what play can be, and at the same time possibly benefit someone or something.


    Prior to this project, few researchers had advanced gaming scholarship from the
    point of view of art history. Numerous scholarly studies have focused on the early
    forms of computer gaming as a field, in topics such as early console games or
    the his-tory of gaming at Atari. In this book, I have studiously avoided these
    too-common examples, for several reasons. First, typical histories of computer
    games have not examined the practice of play outside the realm of computers. Second,
    these historical studies do not generally involve artists and their social and
    cultural roles, either in the making or the playing capacity. Third, few of these
    studies have made any serious attempt to ground contemporary gaming in creative
    and aesthetic origins rather than a primarily technological context; and fourth,
    few have made the connection between games and art.


    On first glance, it may seem a stretch to perceive how artists working in a very
    different place and during very different eras would be able to significantly
    contribute'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'to the manners, modes, and processes for making games today. Computer games
    are often seen as a new medium, and not necessarily aligned with other forms of
    play. Few would imagine that such play could also be related to ancient divination,
    psychoanalysis, utopian tax laws, social protest, or environmentalism. While recognizing
    certain distinctions, *Critical Play* looks to the commonalities among play activities,
    game genres, and important historical contexts to discover thematic ways in which
    play can continue to manifest critical thinking.


    As Marcel Duchamp said in 1946,


    The great trouble with art in this country [the United States] at present, and
    apparently in France also, is that there is no spirit of revolt—no new ideas appearing
    among the younger artists. They are following along the paths beaten out by their
    predecessors, trying to do better what their predecessors have already done. In
    art there is no such thing as perfection. And a creative lull occurs always when
    artists of a period are satisfied to pick up a predecessor’s work where he dropped
    it and attempt to continue what he was doing. When on the other hand you pick
    up something from an earlier period and adapt it to your own work an approach
    can be creative. The result is not new; but it is new insomuch as it is a different
    approach.²


    Whether one believes Duchamp’s criticism could apply today, his call for innovation
    is one that can speak to many. In this book, I will explore historic instances
    of artists using play in their work. I consider given projects amid the shifting
    historical context for play, the political use of play, and look also to contemporary
    artists using physical, locative, and computer games in their work. In the spirit
    of activist art, *Critical Play* primarily focuses on individual artists or collectives
    of artists making work because they have something to say.³ The creative experiments
    with games described in this book help provide a provocative look at how artists
    can challenge ideas, beliefs, and social expectations and subsequently transform
    them in their work. These experiments are particularly worthy of note in an era
    of increasing financial stakes in the games industry, the decline in “street protest”
    and civil actions, and citizens’ overall lack of time and sense of agency. Taking
    wild chances to provoke, disrupt, and change even in play appears to be risky
    business.


    Using the term *artist* to describe anyone making creative work can be off-putting
    to some readers, particularly readers in the various professional fields who might
    find the term exclusionary. The term *artist* is used here with a particular meaning
    in mind, to refer to those who are creating outside commercial establishments,
    and often, those'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'who are “making” for “making’s sake.” Therefore, while a short section on social
    impact games is included in the book, these may tend to be more focused in scope
    and scale and work with more traditional “industry-style” methods instead of the
    more avant-garde practices that have become many artists’ focus. The voices of
    the alternative social impact game makers, however, represent a voice of critical
    play that needs to be explored.


    Critical Play is built on the premise that, as with other media, games carry beliefs
    within their representation systems and mechanics. Artists using games as a *medium
    of expression*, then, manipulate elements common to games—representation systems
    and styles, rules of progress, codes of conduct, context of reception, winning
    and losing paradigms, ways of interacting in a game—for they are the material
    properties of games, much like marble and chisel or pen and ink bring with them
    their own intended possibilities, limitations, and conventions. Artists have indeed
    “revolted” effectively before, transforming popular culture around the globe for
    the last century and a half. *Critical Play* documents this promise of large-scale
    transformation.


    # Defining Some Key Terms


    What is, for the purposes of this study, the first key term, *play*? And what
    does it mean to play *critically*? Play is a notoriously difficult concept to
    define; it is a culturally and socially specific idea. Anthropologist Brian Sutton-Smith,
    a leader in twentieth-century research in play, and one of the core play theorists
    used in this book, has defined play consistently through the years as an activity
    that is fun, voluntary, intrinsically motivated, incorporates free choices/free
    will, offers escape, and is fundamentally exciting.⁴ He has argued that play activities
    can be grouped in four categories: play as learning, play as power, play as fantasy,
    and play as self.⁵ While quick to recognize the dark side of play, including bullying,
    abusive situations, and frightening circumstances, Sutton-Smith also notes that
    play can be defined as a variety of activities: as exchanges of power, or “power
    plays” that prioritize competition and traditionally aggressive play styles; as
    the act of bonding and belonging; as a practice of real-life functions; and as
    “fun,” being with friends, and choosing freely.⁶ Play is recognized as one of
    the most fundamental aspects of the human condition.⁷ While play spaces are generally
    fantasy spaces, players often experience real stakes when inside them. One might
    easily find examples of the “serious” aspects of play in sport and gambling.


    Play is an integral and vital part of mental development and learning, and playful
    activities are essential aspects of learning and creative acts. Historically,
    there have been two “camps” in the study of play: those who see play as voluntary,
    intrinsic, and'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'important to class structure (leisure) and socialization (members of this camp
    Sutton-Smidt calls “the idealizers”), such as Huizinga and Caillois; and those
    who look more to ritual, to communication, and who study play in natural settings,
    such as Bateson, Turner, and Sutton-Smith himself. In this look at critical play,
    I use the strengths of both camps. In *The Ambiguity of Play*, Sutton-Smith suggests
    that play provides a working model of species variability by incorporating mental
    feedback that keeps a species flexible in evolution. He particularly focuses on
    play’s potential to help define social norms and identity, noting that the “use
    of play forms as forms of bonding, including the exhibition and validation or
    parody of membership and traditions in a community” is essential to cultural formation.
    $ ^{8} $ By playing together, people form close communities and develop a group
    identity and a sense of belonging. Play can also function as a tool to understand
    the self. Many anthropologists like Sutton-Smith have argued that play is the
    way children work out social and cultural norms. “Play can cure children of the
    hypocrisies of adult life,” notes Sutton-Smith, arguing that children’s play spanning
    from early childhood to teenage years offers narratives that negate the risks
    of the real world: “These stories exhibit anger, fear, shock, sadness, and disgust.”
    $ ^{9} $


    Johan Huizinga, in his 1938 book *Homo Ludens: A Study of the Play Element in
    Culture*, defines play in an extraordinarily loose way: play is a “function of
    the living, but is not susceptible of exact definition either logically, biologically,
    or aesthetically.” $ ^{10} $ Huizinga rather defines the formal characteristics
    of play as “a free activity standing quite consciously outside “ordinary” life.”
    $ ^{11} $ Other aspects include play as a voluntary activity, executed within
    certain fixed limits of time and place, having rules freely accepted but absolutely
    binding. $ ^{12} $ In Play, the aim is play itself, not success or interaction
    in ordinary life. Unlike Sutton-Smith, Huizinga focuses on adult play, and he
    argues that play activities tend not to be serious in and of themselves but shape
    culture nonetheless through ritual and social custom. At the same time, they absorb
    the player utterly in a special time and place set aside for play: “a closed space
    is marked out for it, either materially or ideally, hedged off from the everyday
    surroundings” that he later famously refers to as “the magic circle.” $ ^{13}
    $


    Distinct themes emerge in scholarship attempting to define play. Most anthropologists
    and historians agree that play is central to human and animal life; is generally
    a voluntary act; offers pleasure in its own right (and by its own rules); is mentally
    or physically challenging; and is separated from reality, either through a sanctioned
    play space or through an agreed upon fantasy or rule set. $ ^{14} $ Because play
    and the ordinary world are intermingled amid the increasing popularity of games
    (specifically, at present, computer games and sports), games are becoming the
    “sacred spots” Huizinga identifies in his anthropological writing. $ ^{15} $'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Critical Play


    Games ultimately create cognitive and epistemological environments that position
    the player or participant with the experiences previously described in meaningful
    ways. So what does it mean to “play critically”? Critical play means to create
    or occupy play environments and activities that represent one or more questions
    about aspects of human life. These questions can be abstract, such as rethinking
    cooperation, or winning, or losing; or concrete, involved with content issues
    such as looking at the U.S. military actions in Cambodia in the early 1970s. Criticality
    in play can be fostered in order to question an aspect of a game’s “content,”
    or an aspect of a play scenario’s function that might otherwise be considered
    a given or necessary. Criticality can provide an essential viewpoint or an analytical
    framework. Those using critical play as an approach might create a platform of
    rules by which to examine a specific issue—rules that would be somehow relevant
    to the issue itself. Critical play is characterized by a careful examination of
    social, cultural, political, or even personal themes that function as alternates
    to popular play spaces.


    The challenge, then, is to find ways to make compelling, complex play environments
    using the intricacies of critical thinking to offer novel possibilities in games,
    and for a wide range of players. Thus the goal in theorizing a critical game-design
    paradigm is as much about the creative person’s interest in critiquing the status
    quo as it is about using play for such a phase change.


    # Games


    Another key term used throughout this text is games, to refer to those instances
    of more-or-less constructed play scenarios. Katie Salen and Eric Zimmerman (2004),
    among other games scholars, note the wide variety of definitions of the term “game.”
    Historically speaking, the challenge of defining games has occurred throughout
    150 years of game scholarship and research, with the most recent turn in computer
    games studies yielding related questions. In his 1984 book *The Art of Computer
    Game Design*, one of the first books detailing the intricacies of thinking about
    computers as gaming platforms, Chris Crawford contrasts what he calls “games”
    with “puzzles.” Puzzles are static; they present the player with a logical puzzle
    to be solved with the assistance of clues. Games, however, can evolve, and rules
    may shift at certain points in a game and can change with the player’s actions.


    Greg Costikyan (1994) also has a concrete definition of what constitutes a game,
    which he describes as “a form of art in which participants, termed players, make
    decisions in order to manage resources through game tokens in the pursuit of a
    goal.”¹⁶ In much of game scholarship, it has been argued that games are by their
    definition'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'competitive in that they always have an end point—a winning or losing state.
    But Kostikyan avoids the “win/lose” dichotomy as the only possible goal for players.
    He additionally details how the structure of games compares to other kinds of
    experiences, such as stories:


    Stories are inherently linear. However much characters may agonize over the decisions
    they make, they make them the same way every time we reread the story, and the
    outcome is always the same. . . . Games are inherently non-linear. They depend
    on decision-making. Decisions have to pose real, plausible alternatives, or they
    aren’t real decisions. It must be entirely reasonable for a player to make a decision
    one way in one game, and a different way in the next. To the degree that you make
    a game more like a story—more linear, fewer real options—you make it less like
    a game.$^{17}$


    While Kostikyan believes that stories are linear but games are not, the key to
    the preceding text is his attention to “real options” for players to pursue. Generally,
    this is referred to as player agency, or the player’s ability to make choices
    that mean something to him or her.$^{18}$ Salen and Zimmerman (2003) also discuss
    the designer’s ability to create situations for “meaningful play.” They have provided
    students of game design perhaps the most codified definition of a game: “a system
    in which players engage in an artificial conflict, defined by rules, that results
    in a quantifiable outcome.”$^{19}$ Salen and Zimmerman offer six key game concepts
    in their influential game creation book, *Rules of Play*:


    +   1. a game is a system

    2. it is artificial

    3. it has players

    4. it has conflict

    5. it has rules

    6. it contains a quantifiable outcome/goal, an ending state in which players can
    either be considered the “winners” or the “losers.”$^{20}$


    Each of these canonical authors in the field of digital game design—Crawford,
    Kostikyan, and Salen and Zimmerman—not es the importance of rules in constructing
    games, with varying degrees of storytelling, conflict, and competition added into
    the (often, technology driven) system. In this book, I choose not to follow such
    strict definitions. Games can be thought of more productively as situations with
    guidelines and procedures. Perhaps games are *themselves* a technology.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Technology


    In organized play and games, rules have a mechanical rigor and are followed as
    pro-

    cedures. These take on a kind of algorithmic specificity as players enact meaning

    through following rule sets. In this way, technological change has been interlinked

    with changes in play and gaming practices. “All art derives from play,” noted
    Johan

    Huizinga in *Homo Ludens*, his famous book exploring the human interest in play.
    This

    sentiment inspires one to examine both the notion of “art” and the notion of “play”

    within twentieth-century creative practices.


    Shifts in play have historically mirrored shifts in technologies. This is evident
    in

    the invention of organized doll play and “playing house” during the U.S. industrial

    revolution, when gender roles needed to be reasserted due to changing labor condi-

    tions.²¹ The link among the reorganization of banking, financial systems, and
    property

    ownership in twentieth-century U.S. culture mirrored the rise of financially focused

    board games such as *Monopoly*.²² Later chapters will examine inventions such
    as Edi-

    son’s mechanical doll and other, literal “play” technologies. But play shifts
    have done

    more than utilize such new inventions. Even play that does not involve gadgets
    or

    devices might be considered a technology. Games and play activities themselves,
    with

    their emphasis on order and conventions, act as technologies that produce sets
    of

    relationships, governed by time and rules, played out in behavioral patterns.
    Even a

    simple game of hopscotch (figure 1.1), in the hands of an artist, could become
    a kind

    of technology.


    In the age-old playground game of hopscotch, a play space is drawn on the ground

    and shared among players. Each takes a turn tossing the potsy, hoping the length
    of

    the “map,” and returning to the beginning. Hopscotch is one of those universal
    games

    that many people seem to recognize. As respected twentieth-century media theorist

    Marshall McLuhan noted, such “games as popular art forms offer to all an immedi-

    ate means of participation in the full life of a society, such as no single role
    or job can

    offer to any man.”²³


    If the hopscotch map contained numbers, the sequence would likely take on mean-

    ing for players (marking spaces toward the end of the map, or representing points
    to

    add or subtract) but this very simple game could also affect or create social
    relations.

    What if the numbers were a collection of points, and the person who had the high-

    est (or fewest) won, regardless of order? If the map size is scaled much larger
    than is

    typical, some players would have unfair advantage to win over others (by having
    lon-

    ger legs, for example). If two hopscotch maps are laid side-by-side, players might
    play

    for speed, one racing against another. Players waiting in line might try to distract
    the

    hopping player, waving arms or mocking to make the hopper miss the target square;'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/33f54fd00e53b9c7e7d108e9fb170e94_17_0.png)


    **Figure 1.1**


    *[mapscotch], 2007, artist’s reworking of hopscotch, by the author.*


    this type of activity would not be explicitly forbidden by the rules and would
    thus fall into the realm of peer sanctioned or accepted play. In other words,
    how the game is designed and presented carries implications for the social group.
    Some players might opt not to play (and become perhaps an onlooker, witness, or
    referee); some players might choose to compete. Other players might choose to
    break the explicit game rules by skipping ahead in line or by jumping on the wrong
    spaces in order to get ahead. Games, functioning as an ordering logic—a machine,
    or a technology—for creating social relations, work to distill or abstract the
    everyday actions of the players into easy-to-understand instruments where context
    is defamiliarized just enough to allow Huizinga’s magic circle of play to manifest.
    From this one example, it is possible to see how games in and of themselves function
    as *social technologies*.


    If games themselves act as types of technologies, then technological games are
    twofold in their capacity for meaning making. Most students of the evolution of
    digital gaming begin their studies among the technological milestones of computing:
    Vannevar Bush’s technological fantasies, the ENIAC computer, the 1961 *SpaceWars!*
    game'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'at MIT, the release of Pong by Atari in 1972, or the success of Pac-Man when
    the Buckner and Garcia song "Pac-Man Fever" hit the charts in 1982. Those studying
    contemporary game design, especially in programs highlighting the role of technology,
    rarely tap links to the seemingly distant domain of the arts. Likewise, those
    studying popular culture rarely cross into the realm of institutions such as galleries,
    museums, and private collections. One of the most important reasons to make such
    a crossing is that shifts in art movements, like technologies, also indicate (and
    mirror) world events; these specifically include international events such as
    the world wars, as well as the cultural and social movements affecting everyday
    citizens and arts practitioners. For example, at the same time in the early twentieth
    century that Marcel Duchamp was engaging "high art" audiences to make their own
    decisions about the nature of art—his famous quote "The spectator makes the picture,"
    is an example of this philosophy—through his multitemporal paintings and "readymade"
    found art objects, American cinema fans were participating similarly in early
    "low art" media culture through newly created fan discourse. Meanwhile, still
    other avant-garde artists were adopting and reconfiguring themes from culture
    altogether in their work—take, for example, the board games critical of war by
    Alberto Giacometti and compare them to the origins of Monopoly, the famous Parker
    Brothers game originally created by a social activist to protest landlords and
    tax policies. These are examples of the interesting juxtapositions and discoveries
    the reader will make in this book.


    # Subversion


    Notions of subversion, disruption, and intervention are bandied about along with
    notions of the critical by artists and activists, and need further articulation.
    Artists have long reused, worked against, or invented new media forms and conventions:
    early twentieth-century innovator Marcel Duchamp turned urinals into scandalous
    "readymade" sculpture. ${ }^{24}$ Photographer Claude Cahun, cross-dressing and
    infantilizing herself, performed over-the-top gender stereotypes in her self-portrait
    photographs dating from the 1930s to the 1940s. ${ }^{25}$ Surrealists fashioned
    experimental films, inverting trends in cinematic narrative and visual conventions,
    even "cutting the eye" (such as in the famed Surrealist film Un chien andalou
    of 1929) for both shock value and as a statement against overly controlling aesthetics.
    ${ }^{26}$ These are only a few examples from myriad artistic practices that survive
    in significance because they broke the rules.


    According to the Oxford English Dictionary, subversion is "the turning (of a thing)
    upside down or uprooting it from its position; overturning, upsetting; overthrow
