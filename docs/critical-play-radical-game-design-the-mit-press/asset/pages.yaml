    # Play in the United States


    In the United States, conceptual artists of the 1960s were, on several levels,
    engaged with the idea of process as a way to rethink issues of authority, politics,
    and the notion of a cultural status quo. Artists created "situations" and performed
    art actions complete with instructions. Like games, many of these events featured
    precise and unalterable rules players had to accept in order to engage work.52
    Alan Kaprow (1927–2006) made rules into Happening scores (or instructions), while
    artist Sol Lewitt (1928–2007) created "plans" for works that in fact constituted
    those works.53 Lewitt''s plans were often a basic rule set for an artwork such
    as a wall drawing. As noted in my writings, while conceptual art uses its own
    logical strategies for execution, "conceptual art is not necessarily logical";54
    "To work with a plan that is preset is one way of avoiding subjectivity. It also
    obviates the necessity of designing each work in turn. The plan would design the
    work. Some plans would require millions of variations, and some a limited number,
    but both are finite."


    For Lewitt, art making-as-instruction was a performative game with concrete rules
    and outcomes. While Lewitt did not call his work games, his rule sets, processes,
    and rewards played out much as a game might. Like the other methods discussed
    for critical play, Lewitt''s plans for various projects worked against ideas of
    subjectivity and manipulation, running to their own logical conclusion as the
    work manifested. The constant drive to eliminate the subjective is interesting
    because in many ways, games thrive by creating subjectivities. There is also the
    reminder of Félix Guattari''s call for a "refoundation of the problematic of subjectivity"
    and even a collection of "partial" subjectivities. Whatever their persuasion,
    those interested in critical play began to create subjectivities that are "pre-personal,
    polyphonic, collective, and machinic."55 By doing so they also commented on larger
    ideologies and political situations. As technology became a more and more integral
    and bombastic element of contemporary life in postwar U.S. culture, artists tested
    the new boundaries through their playful interest in writing new rules for everyday
    living.


