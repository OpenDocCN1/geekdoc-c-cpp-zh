  md: 'and torture during the last Iraq regime because he himself had made anti-Hussein
    art-works, would conceivably be the last person to face U.S. censorship due to
    questions of political loyalty. But this was not the case. In 2007, Bilal decided
    to recreate the 2003 game *Quest for Saddam* as a way to voice a critique of U.S.
    policies in the Middle East. The original game, using the *Duke Nukem 3D* game
    engine, asked players to fight generic “Iraqi” soldiers, and to find and kill
    Saddam Hussein, Iraq’s leader from 1979 to 2003. The game was created by United
    American Committee Chairman Jesse Petrilla. This first *Quest for Saddam* was
    re-skinned as a “hunt” for George H. W. Bush by the Global Islamic Media Front,
    a group said to be related to Al Qaeda.31 Their game, *The Night of Bush Capturing*
    was hacked by Bilal so that the artist could put his own, more nuanced spin on
    this epic conflict, in terms of both the actual war and the video game battle.


    In *The Night of Bush Capturing: A Virtual Jihad*, Bilal places himself as a character
    in the hacked Al Qaeda version of the Petrilla game. The Bilal game narrative
    is part autobiographical and part fiction: after learning of the real-life death
    of his brother in the Iraq war, Bilal is recruited by Al Qaeda to join the hunt
    for Bush. Bilal intends for the work to communicate both the racism and hatred
    embedded in U.S. games such as *Quest for Saddam* or *America’s Army*. He also
    aims to demonstrate the difficulty Iraqi citizens face and their vulnerability
    during recruitment for violent groups such as Al Qaeda, maintaining that ordinary
    Iraqis have little to show for their “freedom” but incredible loss and violence.
