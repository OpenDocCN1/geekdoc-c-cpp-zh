  md: '![](img/33f54fd00e53b9c7e7d108e9fb170e94_235_0.png)


    # | Figure 7.1 |


    Natalie Bookchin, *The Intruder*, 1998–1999.


    game projects, California artist Natalie Bookchin uses humor, low-tech graphics,
    and juxtaposition to place the player in various difficult, challenging, or paradoxical
    situations. Bookchin’s use of both political and personal stories emphasizes ideas
    about the exterior and interior worlds of a game.


    Best known of Bookchin’s gaming works is her influential narrative project *The
    Intruder* (1998–1999).$^{19}$ Working from a short story by Jorge Luis Borges,
    “La intrusa,” the game takes the participant through ten arcade-style games as
    a means of interactively conveying the narrative. Readers or “players” interact
    with the simple arcade puzzles to advance the plot. Text and spoken-word narration,
    of a sort, emerge as players engage in what presents itself as a classic arcade
    system.


    “La intrusa” was first printed in the third edition of *El Aleph* (1966) and was
    later included the volume *El informe de Brodie* (1970). As in the original Borges
    story, the game too is set in the 1890s. Cristián and Eduardo Nilsen, two close
    brothers known for their fierce behavior, both fall in love with the same woman,
    and decide to share their intimate relationship with her. The woman, named Juliana,
    is later perceived to come between the violent brothers, causing emotional conflict.
    The narrative is distributed across a series of mini-games. Encountering and defeating,
    or outthinking, the small games that lie along the narrative path enables the
    player to move the story forward (figure 7.1). With each game move, the player
    earns a sentence or phrase. Players learn about the brothers’ relationship, their
    history, and their fights over Juliana. As the narrative progresses, things become
    more complicated. When the brothers'
