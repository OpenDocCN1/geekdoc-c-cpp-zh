    Surrealist word games also included the famous cadavre exquis (“exquisite corpse”
    in English). The classic example that gave this activity its name is the first
    sentence ever derived from the game: “Le cadavre—exquis—boira—le vin—nouveau.”
    This simple language game can either be played by knowing only what the last person
    in a group work contributed, or by following a language pattern rule (such as
    adjective-noun-adverb-verb-adjective-noun). The order must be respected to produce
    grammatically correct sentences. The exercise, invented through inspiration from
    an existing parlor game at a gathering at a house shared by a group of Surrealists
    in Paris, was one of several language games and spontaneous group games created
    by the Surrealist artists. 57 In fact, Durozoi argued that Surrealism itself should
    be equated to pure psychic automatism in all actions—art, the spoken or written
    word, or any other act—and that these actions should be not subject to the dictation
    of thought or controlled by reason, outside factors, or aesthetic or moral concerns.
    58 But here a criticism of the approach needs to enter into the picture.


    Radical Surrealist writer Djuna Barnes (1892–1982) followed many of the game-like
    Surrealist research/creation methods put forward by the group. Barnes’s avantgarde
    images and writing, including journalistic essays, were widely published from
    1913 through the 1930s. Her works *The Book of Repulsive Women* (1915) and *Ryder*
    (1928) are destabilizing texts, which, much like the later work of Kathy Acker,
    incorporated visual components to express feminist concerns. As scholar Irene
    Martyniuk has noted, “Just as in a patriarchal system women are conventionally
    perceived as ‘handmaidens’ to the male, so the visual component of a text has
    traditionally been viewed as an adjunct to the verbal component.” 59 It is therefore
    an interesting feminist approach to take on male-female power relations through
    the struggle between image and text. Barnes created both the images and the text
    of her books (see her drawing in figure 4.9). As Irgaray noted, “Female sexuality
    has always been conceptualized on the basis of masculine parameters,” and it is
    this construction Barnes examines in her intricate juxtapositions of image and
    text. 60


    *The Book of Repulsive Women* consists of eight poems about women in New York
    City, beginning with a woman who must expose her lesbian identity, one form of
    what some would term the “repulsive,” and ending with a suicide, of a woman whose
    “exquisite corpse” is examined from two competing points of view, creating yet
    another instance of what some might deem a “repulsive” woman. 61'
