    BOARD GAMES


    > Chess is hand-to-hand combat between two labyrinths.

    —André Breton, Free Rein (La Clé des champs)


    Some of the earliest evidence of human play can be found in the board games uncovered
    in ancient burial grounds or depicted in ancient drawings and carvings. Initially,
    these games were simple folk objects made as needed out of earth, wood, or stone.
    But as play became a larger part of culture, the ruling classes joined in play
    as well, and extraordinary game sets for kings and pharaohs evolved. These boards
    were made of ivory, faience, and other precious materials. Later, the mass printing
    techniques of the industrial revolution enabled the huge variety of board games
    we know today.


    Early game boards remain important to critical designers not only because they
    reflect cultural notions of a given time but also because their play patterns
    continue to influence contemporary design. Csikszentmihalyi and Bennett argue
    that play works because the magic circle of a game defines its space and makes
    participation in the action of a game voluntary. By convention, a game must limit
    the range of stimuli players need to take in. Play fields or boards establish
    what space and what relevant objects will be involved. “Within this limited spatio-temporal
    unit the player can abandon himself to the process, acting without self-consciousness.”1
    From the earliest times, board games have incorporated Huizinga’s “magic circle”
    as well as elements of both strategy and chance in their design.


    Yet board games embody fundamental differences in philosophy. Go and chess, for
    example, are abstract strategy games that feature “perfect information”—that is,
    all the information constituting the system of the game is visible on the game
    board at all times. Play in an abstract strategy game often unfolds as players
    move pieces on the board, creating a set of ongoing puzzles for other players
    to thwart. The earliest'
