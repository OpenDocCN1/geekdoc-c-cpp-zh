  md: 'In a further complication, the lack of diversity in the creative documentation
    by those at work in these movements makes it challenging to trace any historical
    practices that lie on the fringes of the accepted art world. Other than Alison
    Knowles''s House of Dust (1967), for example, there may be no earlier accounts
    of the development of full-blown computer games by women until Mystery House,
    an interactive narrative game by Roberta and Ken Williams and the first computer
    game to incorporate graphics of any kind (1980).16 In addition, there is poor
    representation of artists of color in these art movements, and a lack of designers,
    scientists, and others of color in contemporary gaming culture.17 Female artists
    and scientists, as well as artists and scientists of color, have certainly been
    involved in the major art and technology movements in the twentieth century—or
    have worked in parallel to them. More documentation and inspection is needed to
    broaden the way in which their recorded histories are shaped. The dearth of women
    and people of color represented in art history needs to become part of the investigation
    in critical practice.


    Given the limitations outlined, the artists'' work explored here, historic and
    contemporary, responds to the commercial ubiquity of play. At the moment, computer
    and locative games are especially prominent aspects of playculture. From war simulations
    to Bulletin Board System style chess to 3D computer games, digital technology
    has been inherently bound with interactivity and diversion, and artists who engage
    in computer-based creation and critique represent the majority of contemporary
    examples of critical play. Questions surrounding participatory play and multiuser
    participation within the creation and reception of artistic, game-related works
    should, therefore, at least be introduced. Players of popular games may reskin,
    redesign, and indeed, reissue scenarios in online game environments such as Second
    Life. Music fans may download, upload, mix, and remix popular and independent
    music. The web can continue to provide a unique space where mainstream meets cult
    interests, creating subspecializations and massively multiplayer envrionrs numbering
    in the millions of players. But, are artist-produced computer games, as systems,
    reinventing how these practices and their artifacts, how the culture, are constituted?
    What are the social ramifications of artist-produced computer games? How are these
    ramifications playing out? Above all, by what means do such works achieve in terms
    of critical discussion, dialogue, or interaction?


    First, artists'' games by definition take an “outsider” stance in relation to
    a popular, commercial games culture. This position itself suggests alternate readings
    of contemporary issues in electronic media and offers the possibility of commentary
    on social experiences such as discrimination, violence, and aging that traditional
    gaming culture either avoids or unabashedly marks with stereotypes.18 With her
