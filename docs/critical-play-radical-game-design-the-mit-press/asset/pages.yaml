    provided a definition of what games are and how they should be designed. He identifies
    four elements common to all games: representation, interaction, conflict, and
    safety. Of the four, the ideas of conflict and safety are the most useful in distinguishing
    a game from a simulation or other interactive media forms. To Crawford and other
    game designers, even a social impact game would require conflict:


    Conflict arises naturally from the interaction in a game. The player is actively
    pursuing some goal. Obstacles prevent him from easily achieving this goal. If
    the obstacles are passive or static, the challenge is a puzzle or athletic challenge.
    If they are active or dynamic, if they purposefully respond to the player, the
