- pgno: 123
  md: 'decisions by royalty are more aggressive and swift, and far less strategic,
    than in the usual version. The pawn player, knowing the pawns are relatively powerless
    except in sheer mass or numbers, intervenes by putting them on the line in the
    middle of violence, much as many protesters have done historically. The pawns
    act as “blocks,” and after five turns, if neither royal side has taken a piece,
    a period of nonviolence is counted and a piece of metaphoric “grass” grows on
    the game board. After five turns of nonviolence, grass will have taken over the
    fighting field. By staving off the aggression and overcoming the “hoteaded” part
    of the conflict, the pawns win. The idea is to allow more time for negotiation,
    rather than immediate reactions and attacks.


    It is important to remind ourselves that while pacifism and nonviolence in this
    game may emerge as a larger game goal, Rethinking Wargames itself is quite dependent
    on the premise that chess itself is founded on: conflict and the taking of pieces;
    in other words, violence. The viciousness of the royals is matched by the passion
    for peace from the pawns. For all sides, play implies action, and even if one
    is trying to accomplish an activist aim or a societal critique, the idea is that
    one takes action, as opposed to nonaction, even if the action results in a block.
    The game demonstrates that negotiation takes slowing down, that peace can only
    come with negotiation, not reaction and rhetoric. To rethink the current solution,
    one cannot be on the defense or the attack, but rather in a meta-state.


    Chess is interesting precisely because it represents many ideologies, the first
    of which is an easy duality between opposing forces. This is apparent as early
    as Huizinga’s critique of the political philosophy of Carl Schmitt, in Homo Ludens
    (1938, in Dutch). Huizinga notes that philosophies such as those purported by
    Schmitt provide a dangerous rationale for the oversimplified intellectual culture
    of fascism, in which social life is easily divided between “good” and “evil,”
    “us” and “them,” where nuance is dismissed and competition encouraged. Indeed,
    Huizinga argues this oversimplified line of thinking undermines the ethical workings,
    or “fair play” foundation of international law. Walter Benjamin also notes that
    competitive scenarios tended to oversimplify complex issues. This critique is
    mirrored in Catlow’s work, as she seeks to add nuance and multiple kinds of outcomes
    to the game. Thus the aims of Catlow’s project have much in common with many of
    the experiential chess games discussed in this chapter. Rethinking Wargames engages
    with the idea of choosing strategies. It interrogates the linear trajectory of
    time intrinsic to games, even with their interactive structure. It enhances the
    benefits of repetitive performance, mobility, and empowerment to make decisions
    through play. In these war games, players are empowered to make metaphorically
    large decisions through play.'
