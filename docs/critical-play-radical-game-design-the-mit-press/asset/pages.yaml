  img_proc: true
- pgno: 200
  md: 'in real time, becoming, in effect, a sonic encounter. In this way, Symons compares
    the work to a multiplayer computer game, in which such collisions can create a
    cooperative sonic game.


    As much as the project creatively engages with participants as they encounter
    space, and each other, in the field of listening, the use of various latitudinal
    and longitudinal coordinates is not assigned particular meaning in the work. That
    is, the emphasis is on a music-like soundtrack, mixed live, and based on the relative
    positions of participants rather than on the space of encounter. On the one hand,
    this means that a public space, such as a square, is an entirely appropriate site
    to experience the work, for these are indeed sites for engagement and congregation.
    The work can be shifted to nearly any location and stay relatively the same in
    terms of audio location, proximity. On the other hand, the emphasis on the mix
    over the place infers that this work, like games to be discussed later in this
    chapter, is “location free,” even though it has tended to take place in urban
    locations of historic and social relevance. Here, the issue of locality, of the
    embedded meaning of space, is a strategy calling for further development, even
    though Symons notes that Aura “is site specific work.”¹¹²


    It is useful to reflect on location and its relationship to play. Play, in its
    Huizingian magic circle, is not an activity that stays purely in the realm of
    the physical, but is also a *mental* construct, one in which participants might
    experience human values like beauty, goodness, justice, fairness. Even when crossing
    into taboo subjects, or resorting to extreme physical actions such as tackling
    in field sport, play possesses for Huizinga that “well-defined quality of action
    which is different from ‘ordinary life.’”¹¹³ Play is possible only when players
    *decide* it is possible. This involves permission, an agreement between players,
    and also between spectators or passersby.


    On the first page of Homo Ludens, Huizinga asserts that play—whether it is among
    dogs, lions, or people—always has *meaning*. It is more than a mere physiological
    or psychological phenomenon, but a process of *signification*. Regardless of the
    specific definitions of play offered earlier in this chapter, one commonality
    figures into most scholarly interpretations of both games and play: the *significance*
    of signification. As a process of signification, play traverses ordinary life
    and allows players to take on difficult issues from an insulated position. From
    games to humor, from role-playing to the arts, from wordplay and poetry to gambling
    to festival, these activities are only *play* in context. What is play in one
    location, in one language, in one public space, may or may not be recognized as
    play in an entirely different context. With only a few exceptions, one can conclude
    that the phenomenon of play is *local*: that is, while the phenomenon of play
    is universal, the experience of play is intrinsically tied to location and culture.¹¹⁴
    Therefore, when examining locative media projects, one must interrogate'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'the role of the *site*. Spaces have histories, social relationships, associated
    languages, customs, flora, and fauna. The importance of the site in terms of one
    or more cultural aspects is a frequent consideration in site-specific work. It
    is useful to ground the issue of locality and mobile artworks within earlier practices,
    such as that of urban engagement through the figure of the *flâneur*—that European
    detached pedestrian, the stroller/observer among city streets.


    Much recent cultural studies scholarship has focused on *flânerie*, from its historical
    origins in early nineteenth-century Paris, to its promotion by Western thinkers
    such as Charles Baudelaire, Walter Benjamin, and a host of critics throughout
    the twentieth century.$^{15}$ Eighteenth-century flâneurs across Europe walked
    both to see and to be seen, committing to an urban engagement for social and aesthetic
    reasons (see an eighteenth-century painting depicting such strolling along a Venetian
    promenade in figure 6.1, and a nineteenth-century depiction of a Belgian promenade
    in figure 6.2).


    In the twentieth century, *flânerie* slowly but surely transformed into the far
    more psychically grounded experiments of psychogeography, a discipline or method
    to study and experience the effects of environment and geography on emotions,
