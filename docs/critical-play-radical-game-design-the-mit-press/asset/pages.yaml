    also gathered at “Fluxus-Festivals,” or Fluxfests, initiated by Maciunas in 1962,
    beginning with concerts at the Wiesbaden state museum, six concerts in Copenhagen,
    seven in Paris. These performances were primarily musical compositions, some scored
    by animals. There was Fluxus music for lips, mud, bottles, pebbles, balloons,
