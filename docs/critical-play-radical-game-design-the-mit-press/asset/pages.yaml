  md: 'time with specific needs and goals: the idea of “childhood” itself is a cultural
    invention, existing in Europe and North America for about four hundred years.
    The concept gained influence during the industrial revolution, as debates raged
    over child labor in factories.18 The new awareness of childhood as a category
    of experience was emphasized in the nineteenth century by the burgeoning areas
    of educational theory and the corresponding establishment of the Montessori, Catholic,
    and Steiner schools. One theorist who has considered the effects of a cultural
    split between childhood and adulthood is the developmental psychologist Bruno
