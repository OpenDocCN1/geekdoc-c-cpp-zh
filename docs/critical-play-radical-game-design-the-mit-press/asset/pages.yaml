  md: '# 8


    DESIGNING FOR CRITICAL PLAY


    Play is grounded in the concept of possibility.


    —Mihaly Csikszentmihalyi and Stith Bennett, “An Exploratory Model of Play”


    Whether it is their capacity to stimulate participation in an Internet-connected
    age or their role as a platform for entertainment, intervention, authorship, and
    subversion, computer games—indeed, all games—are highly relevant to the twenty-first-century
    imagination. Games have also constituted a significant component of arts practice
    for almost a century. While the central parts of this book engaged with historical
    questions surrounding critical play and artistic approaches to play and game design,
    an investigation of the design methodologies informing critical play should begin
    by defining the context in which many games are now made.


    If, as according to Bennett and Csikszentmihaly, “Play is grounded in the concept
    of possibility,”¹ then critical play is the avant-garde of games as a medium.
    But where is play critical? When assessed in terms of criticality, a wealth of
    questions arises concerning the way games actually function. The last chapters
    have provided theories, approaches, and examples to help address some important
    questions: Can games be activist? Does play raise critical awareness or does it
    minimize its effects? What is the role of the arts in games, and can methods derived
    from artists make a difference? Can the various methods of creation followed by
    the artists discussed in prior chapters offer novel approaches to actively reshaping
    everyday playculture?


    Marshall McLuhan was ahead of his time in understanding that “Art, like games
    or popular arts, and like media of communication, has the power to impose its
    own assumptions by setting the human community into new relationships and postures.”²
    From doll play to wordplay, from Simulanism to various Surrealist games, there
    is a good deal of evidence that the processes of artists in pursuit of critical
    play can offer research methods, actions, and play situations, whether sites or
    collections of one of'
