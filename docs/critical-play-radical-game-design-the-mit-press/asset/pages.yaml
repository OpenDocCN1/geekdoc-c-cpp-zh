    Of significance is the study conducted by Marily Yalom (2004), who detailed the
    generational—even epochal—changes in chess. Yalom’s study of the queen piece in
    the game revealed that chess did not include a female figure on the board until
    the tenth century. $^{109}$ Even then, the queen was the weakest member of the
    cast, only able to move one square at a time. Yalom argues that the queen gained
    influence to become the most powerful piece on the board as cultural power for
    women gradually increased. A string of powerful queens in Europe during Medieval
    times, for example, influenced not only the piece’s representation and gender
    (in earlier manifestations, the queen had been the king’s vizier, a male figure)
    but also the piece’s actions. Parallel ing the rise of powerful female leaders
    in Europe, namely Eleanor of Aquitaine, Queen Ingeborg of Norway, and Queen Isabella
    of Castile, the piece moved from vizier to queen and was freed from the slow,
    one-square-at-a-time rule of movement to become the most powerful piece on the
    board. By the time of the famous Norwegian set, the Lewis chess set (1150 AD-1200
    AD) (figure 3.25), the queen piece had an established place on the board.


    While writing his treatise “The Morals of Chess,” Benjamin Franklin notes that
