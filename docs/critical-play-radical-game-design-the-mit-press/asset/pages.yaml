    # Located Media: Organizing Tactics and Resistance


    While international arts organizations and artists are beginning to explore the
    use of game-like projects in terms of space, this is still largely an emerging
    field outside wealthy Western nations. Therefore, the ways in which critical play
    manifests itself outside games and game scenarios in larger critical networks
    should also be noted here. In other words, there is another point of focus here,
    and having noted the popular new methods of locative media, it is instructive
    to turn to the everyday realities of “*located media.*” This fledgling field,
    commendable for its plurality and transnational reach, as well as for its ability
    to build on both intellectual and grassroots contributions, crosses into powerful
    new territories. In doing so, located media provide a unique way to link institutions,
    such as galleries and universities, to the social and cultural organizations working
    with the ordinary issues of embodiment, play, and social interconnectedness. What
    is recognized in this practice is the need for further experimentation with play
    embodied in a location and the possible benefits of newer and more inclusive models
    of collaboration and social change.


    For example, one way to access larger societal issues is via [*mapscotch*] (2007),
    a locative game that focuses on play and the interpretation of the environment
    in terms of mapping (figure 6.4). 36 Players are asked through small provocative
