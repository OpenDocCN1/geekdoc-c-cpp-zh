    # ## From Art to Play


    As the play anthropologist Brian Sutton-Smith notes, early twentieth-century art
    brought ideas from child''s play and art together with ideas about the importance
    of imagination. Here, a child-like state is valued as primitive, innocent, original,
    and ultimately fresh and untouched.⁶⁴ However, Sutton-Smith argues that this view
    is simplistic and romantic, and leaves out other important aspects of play. For
    instance, play and art may share invention and personification, but not sensuality.
    Also, play constitutes a system of symbolic forms that may carry their own objective
    codes.


    Howard Gardner sees play as a way to master anxiety, the self, and the world,
    while art might be more about the mastery of symbolic systems.⁶⁵ Whatever the
    subtle and not so subtle differences between art and play may be, the examples
    presented here conceptually engage with economies of exchange and social order,
    the nature of art and play as conceptual and fluid spaces, and the role of chance
    and intervention in creative events and works.⁶⁶ The fluctuating social networks
    produced in these interactive art forms can be described in Deleuzian terms as
    sites of becoming.'
