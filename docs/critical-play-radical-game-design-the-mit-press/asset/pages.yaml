- pgno: 25
  md: '# # PLAYING HOUSE


    Play customs are wide-reaching forces that can be mapped through a society''s
    art, media, and institutionalized forms of leisure. From the Olympic games of
    Hellenic Greece to the public spectacles of the Roman Empire to the chivalries
    of medieval tournaments and jousts, sports and sporting events have traditionally
    fostered public involvement. In addition, cockfights, fistfights, boxing, horse
    racing, and similar types of spectator sports encouraged interaction with risk
    via wagering, especially during the cultural shifts accompanying the British industrial
    revolution. ${ }^{1}$ However, while sports, athletics, and other contests of
    skill offer familiar opportunities for social analysis, it is less well documented
    that these presentations are also examples of critical play. Instead, in an early
    and continuous line of intervention, the site of recreation where activities reach
    the value of critical play is the home. In eighteenth-century Europe, French artists
    developed an elaborate and incisive art style known as Rococo, infusing a pointedly
    domestic materiality into what was traditionally accepted as “high” art. ${ }^{2}$
    In nineteenth-century England, children “hacked” the household norms of the Victorian
    period through their own critical forms of doll play. Early in the twentieth century,
    the artists of the Dada movement created toys and puppet shows that mocked, among
    other things, familial conventions. The impulse to examine through play remains
    alive in our own era as participants in virtual worlds and computer games simultaneously
    feed, heal, and maintain their virtual characters while also posing amusing challenges
    or problems for them. In this way, gamers still “play house,” reworking paradigms
    of the status quo by experimenting with artificial identities, self-expressive
    environments, and humorous scenarios. Today, artists frequently position themselves
    at the margins of computer culture using play as critical intervention. By examining
    historical instances of arts culture and how popular culture practices can become
    a vehicle for larger concerns, new parameters for understanding mischievous, even
    rebellious play begin to emerge.'
