  md: '# ARTISTS'' LOCATIVE GAMES


    > The study of everyday life would be a completely absurd undertaking, unable
    even to grasp anything of its object, if this study was not explicitly for the
    purpose of transforming everyday life.


    —Guy Debord, “Perspectives for Conscious Alterations in Everyday Life”


    # Introducing Contemporary Game Interventions


    In earlier chapters,¹ forms of player subversion were observed in games ranging
    from Victorian era girls’ play to board-game play to Sims play. Reskinning, unplaying,
    and rewriting formed the basis of some of this interventionist play. Physical
    movement, however, and the active use of space are frequently used as interventionist
    tactics as well, and location-based games are also often designed to unplay the
    dominant systems of control.


    As early as World War I, Dada artists staged a number of interventionist street
    events, moving performance into public locations and engaging a mass public audience.
    Public game projects create critical alternatives not only to other games, but
    to street culture as well. Artists of the 1960s and 1970s, facing an art world
    still ensconced in tradition, specifically and playfully disrupted public space,
    often using nontraditional media like posters, video, and performance in reaction
    to a culture steeped in the themes of modernism and focused on masculinity.


    Today, artists borrow freely from mapping and location technologies for creative
    purposes.² Groups like Blast Theory and Glowlab bring a new physicality to play.
    Many performative projects require mass participation, occur in cities, and are
    designed more or less as games. There is much contemporary interest in locative
    media and in particular, locative games that occur in forms of the public sphere
    such as news broadcasts, movies, parks, street corners, and in any form of advertising
    including graffiti,'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'clothing, game characters, and music. At the same time, the use of certain
    technologies, some of which may be overly reliant on a compromised communication
    model or a Cartesian worldview can, by extension, reinscribe a power structure''s
    implicit mechanisms of social control.³ There have been several recent papers
    focused on the critique of a locative media that lies perilously close to industry
    and the military. Network theorists like Andreas Broekmann note projects that
    might be the "avant-garde of the ''society of control.''" ¹ Others ask whether,
    given the ubiquity of media and messages, and the collective privatization of
    the public sphere, play and games are emerging as instruments of protest, or as
    misguided specters of agency. Some investigators question the role of city space
    in these activities. Here, and with respect to historical movements, the work
    of the Situationists is particularly relevant.


    Therefore, while examining locative games and spatial interventions, further questions
    arise, including: How might location-based play environments be presumed to hold
    problemmatic assumptions about space and the city? Why are urban locative media
    games emerging at this particular point in history? In what ways are the works
    emerging as political artifacts? Who is left out of these games? Finally, if technology
    is used, what are its effects? Can industrial systems reflect the contested nature
    of lived reality, space, and place? As will be shown, the current social and technological
    landscape presents certain peculiar characteristics and challenges to locative
    media works.


    # Toward an Interventionist Space


    In discussing the uses of space and the tactics ordinary people deploy as a means
    of resistance, the transdisciplinary work of French historian and philosopher
    Michel de Certeau offers significant insight. As de Certeau noted, "Many everyday
    practices (talking, reading, moving about, shopping, cooking, etc.) are tactical
    in character if they become independent from the rhetoric of power. And so are,
    more generally, many ''ways of operating.''"⁹ In other words, one''s daily decisions
    can affect the hegemonic power structures that oppress. De Certeau wrote primarily
    in a historiographic mode, describing how gestures of resistance among the "disenfranchised"
    or "the other" give the powerless a way to survive and, at times, even thrive
    within or against dominant cultures. In particular, he examines the act of consumption,
    noting that consumers, instead of being passive and malleable, are in fact deploying
    "tactics" that operate within and against power systems such as capitalism.⁶ Going
    further, de Certeau then describes his rescuation of historical accounts as interventionist
    and, like Foucault, works to outline the dynamics of power that lie hidden in
    the very act of recording such marginalized histories. In turn, the attention
    de Certeau pays to everyday acts'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'of resistance provides the evidence needed to question the prior, totalizing
    narratives fashioned by historians.


    With his emphasis on the ordinary tactics of workers and artists who are “making
    do” with the fragments collected from power to support the individual, de Certeau''s
    ideas can be used to argue for the effectiveness of subtle interventionist tactics
    on small, everyday levels. 7 For example, his observations on resistance tactics
    in consumer culture are well matched to behavior in games, especially when one
    examines the ways players determine their behavior. Player actions in video games
    frequently include tricking authority figures such as game administrators, using
    codes to comment upon, alter, or invert game play, and renaming characters to
    introduce humor or absurdist readings in a game. In the online environments of
    the “digital vernacular,” these tactics become de Certeau''s “art of the weak.”
    8


    # ## Mobile Media


    Within this breadth of thinking about play on location, we should now move to
    an example of a work that has been described by its maker as a communicative game.
    Steve Symons''s *Aura* (2004) is an interactive sound installation based on GPS,
    augmenting a particular participant''s experience of a real space with three-dimensional
    sound environments. To engage with the work, participants wear backpacks containing
    small computers or PDAs (personal digital assistants) and walk around an outdoor
    space whose coordinates have been preprogrammed with sound clips—specifically,
    musical sounds and beats. As participants move to various positions, a particular
    sound mix is created based on the location and direction of movement, providing
    “full spatial listening that blurs the real world and artistic intervention. Sound
    takes on a physical quality in *Aura*, thereby encouraging the creation of ‘sculptures
    of the mind.” 9” The sounds stay fixed in terms of location, but the participants
    move from sound node to sound node. Therefore, space can be “mapped” by participants
    in terms of the sound they hear in a particular location.


    Symons''s project has been staged throughout various public squares in Europe
    and North America. 10 Noting that interaction between participants becomes “a
    communicative game based on aesthetic cooperation,” the intention is for participants
    to somehow communicate and engage with each other to enhance or alter their own
    sonic experience of the space. 11 In *Aura*, sounds are assigned not only to spatial
    coordinates but also to interactors. Each participant, and his or her movement
    in relationship to other participants, creates sounds shared by several in the
    vicinity. When in proximity to each other, participants listen to the “collision”
    of sound as it is processed'
