    # Tactics and Intervention


    Anne-Marie Schleiner’s computer-based projects allow users to see that the design
    of computer-based communities and games are of political consequence. Schleiner
    reveals how the structures imposed by systems, and what users are allowed to do
    within these systems, are significant conceptual constructions that require critique.
    In her creative pieces she spends much of her energies exploring online characters,
    reworking first-person shooter-style games such as *Counter Strike*, and responding
    to or undermining networked computer gaming experiences such as *America’s Army*.'
