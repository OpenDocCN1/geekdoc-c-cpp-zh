    2002, which displays a closeup of the live video image of the electrophoresis
    gel holding the individual DNA samples, with graphical overlays.


    Citing the ambitious Human Genome project in his work, as well as past research
    artifacts like the 1929 tract “Race Crossing in Jamaica,” a three-year study exploring
    the “problem of race crossing” during a time of racial separatist doctrines, Vanouse
    is keen to problematize the scientific process on a fundamental level. Vanouse’s
    work then embodies critiques of science first launched by the Austrian philosopher
    Ludwig Wittgenstein in his depiction of language as a game capable of representing
    a system of knowledge, which was later more specifically developed by the American
    Thomas Kuhn, whose ideas about the nature of the social knowledge produced by
    science, including the theory that science is inherently political, are well documented.
    Kuhn’s belief is that science is a game, or is at least modeled on a game metaphor,
    and that this game, like other social practices, constitutes primarily a language
    game of power, legibility, and control in the Wittgensteinian sense.²⁸ If the
    very working of society is a network of language games, science, with its hyperspecialized
    language, its particular knowledge, and specific community of authority, must
    therefore be a subset of such a game, where truth is relative, and where what
    constitutes fact is instead relative to'
