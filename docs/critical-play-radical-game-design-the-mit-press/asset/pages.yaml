- pgno: 21
  md: 'As detailed later, a great deal of pleasure for players can be derived from
    subverting set interaction norms in both simple play environments and highly complex
    games. Players will consistently explore what is permissible and what pushes at
    that boundary between rules and expectations, and a player’s own agency, within
    any given play environment—no matter how structured that play is. From hockey,
    to chess, to playing dolls or “house,” player subversion—as cheating, as open
    play, as social critique—is an intrinsic part of play. ${}^{42}$ If digital artifacts
    have truly become a magic circle in which players enter a sanctioned play space,
    then this culture of play, or playculture, as it is commonly termed, is one in
    which participants find a space for permission, experimentation, and subversion.
    In the following chapters, I will postulate the possible historic reasons for
    the necessity of this stance.


    # What Are Activist Games?


    In this book I use the terms activist game and activist game design. Activist
    games can be characterized by their emphasis on social issues, education, and,
    occasionally, intervention. In other words, they are not purely conceptual exercises,
    but rather, games that engage in a social issue through, most commonly, themes,
    narratives, roles, settings, goals, and characters; and less commonly, through
    game mechanics, play paradigms, interactions, or win states to benefit an intended
    outcome beyond a game’s entertainment or experiential value alone. This is not
    to say that activist games cannot, or should not, be “fun,” though this has been
    a critique of many activist games to date. The term “activist game,” however,
    is meant to specify the game theme and sometimes desired outcomes for playing
    the game, and only one of the desired outcomes would be entertainment.


    Activist approaches to media are important to the study of digital culture precisely
    because of media’s inherent imbalances. Indeed, issues of gender, racial, ethnic,
    language, and class inequities and imbalances are also manifest in the historic
    imbalances with technology production and use. Take, for example, the fact that
    women constitute only 10 percent of the computer-game industry workforce, or that
    less than 10 percent of all programmers in the United States are women. These
    imbalances extend in a sometimes subtle fashion to who uses these tools and spaces
    on a daily basis. Even renowned media scholar Henry Jenkins, among others, noted
    over a decade ago that video game spaces are gendered spaces. ${}^{43}$ Gender
    imbalance in technical and visual culture triggered one of the most significant
    critiques of film and visual representation: Laura Mulvey, in her 1970s analysis
    of the visual representation of woman in cinema, inspired myriad progressive experiments
    calling attention to the representation'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'of women in commercial imagery and film.44 In the area of video games, significant
    essays critiquing the continued problematic representation of gender in video
    games (Flanagan, Anne-Marie Schleiner) and race (Jennifer González, Lisa Nakamura)
    con-tinue to call these issues into question.


    # ## Design Actions and Design Methods


    One of the most important things *Critical Play* provides is a range of examples
    demon-strating what artists have done in their creation of games and play. These
    can inspire other artists, designers, and innovators. Some artists make instructions
    for actions, and even paintings; some playful disruptors use obnoxious language
    and make humans into puppets; while others write computer programs that write
    poems. Some even project their games onto bridges or have players dress up as
    chickens. Artists make words touchable, create palindromes, do street intervention,
    and even skywrite from airplanes to disrupt the everyday actions in the city.
    These activities are spurred on by the methods developed over the last century,
    including Simultanism, which means a telescoping of time; free verse/free visual
    verse; automatism and automatic writing; exquisite corpse; and the drift of psychogeography
    fame (all explained more fully in later chapters).


    # ## The Chapters


    The games explored in the following chapters range from playing doll and playing
    house to board games, performative games, locative media games, and computer games.
    Each chapter explores historic instances of a particular game genre, as well as
    how art and social movements have engaged with it.


    In chapter 2, I review the history of domestic play as particularly relevant to
    game design, especially given that the majority of contemporary computer-based
    games are experienced in domestic environments. I look at the resurgence of popular
    domes-tic play in games such as *The Sims* and artists’ projects that function
    as critical play in domestic space, and I present a variety of forms of doll play,
    proposing the subversive methods of reskinning, rewriting, and unplaying.


    In chapter 3, I examine the various ways in which board games have worked as critical
    documents and experiences, and discuss several artists’ board games. I look at
    the spiritual practices of play and chance and how board games developed. I will
    also look at how board games reflect changes in society, for they also provide
    a window on the values, hopes, and beliefs of a given culture. The *Lanlord* and
    *Anti-Monopoly* games, for example, showed how designers could invite player modifications
    to the games for mass-distributed, alternative game hacks.'
