  md: 'allowed to climb the corporate ladder. As a tongue-in-cheek critique, this
    game allows users to examine worker roles within corporate hierarchies. The game
    also touches on the constant presence of the network, and the addiction to maintenance
    brought forth by email, online dating, blogging, social networks, instant messages,
    voicemail, news feeds, and games like The Sims. Activities in Metapet include
    the workers’ constant checking, tweaking, and maintenance tasks as they care for
    workplace systems. These matters reflect the themes of networked culture inherited
    from both domestic practices and from the daily grind among the lower echelons
    of the information technology workplace. In Metapet, players are constantly reminded
    of the ubiquitous presence of the network and of the constant upkeep they themselves
    do at terminals throughout the day.


    Manuel Castells, in his book The Rise of the Network Society (1996), notes that
    the change in the ways technological processes have become organized originates
    at the shift from surplus value and economic growth to data and knowledge economies.
    Bookchin’s work makes apparent this economic flow, and goes on to ask, “But at
    what cost?” The workers at STAR DNA are themselves products of genetic manipulation,
    optimized for multitasking performance. The network as a conceptual structure
    plays a vital role in the formation of Bookchin’s work and in many other kinds
    of Internet art, engaging with systems of information and communication and allowing
    us to examine links and structures that shape our experience of computer-mediated
    culture.


    In other examples of critical play, computer-based gaming projects may delve into
    the meaning of identity in culture or more concrete subthemes, such as “woman
    in games” or “human versus machine.” The issues brought forth by the duality between
    body and mind are in some ways celebrated by games, where the agency of the physical
    body only now is beginning to approximate the agency of the virtual. Human computer-interface
    designer Joy Mountford observed that as “the computer stares back at you, it sees
    you as one eye and one finger.” In other words, computer interfaces are still
    designed as if players and users themselves are only partly bodied, or even disembodied.
    The relationship of the body to the mind, and now to the network, must be better
    articulated beyond various forms of utopian rhetoric, particularly in the era
    of the “social networks” frenzy, where ranges of intimacy and knowledge are set
    computationally, and often by systems designers, rather than by participants.
    Here, it is worthwhile to remind ourselves that, as architect Karen Franch notes,
    we “construct what we know, and these constructions are deeply influenced by our
    earlyexperiences and by the nature of our underlying relationship to the world.”
    This is true for purely digital experiences as well as for hybrid or physical
    manifestations of play.'
