  md: 'Baroque-era Dutch painter Samuel Dirksz van Hoogstraten (1627–1678) is an excellent
    example of these countercultural artists. A student of Rembrandt, van Hoogstraten
    was a phenomenal painter adept in many styles, and he used his gift to create
    a portfolio of illusionist visual experiments. These feature everyday objects—desks,
    quills, and furniture—showcasing his mastery of perspective and light. Van Hoogstraten
    painted perspective boxes and amusing trompe l''œil, experimenting with craft
    and playing with the conventions reflected by Europe''s dominant worldview.6 For
    example, humorous touches such as a pet dog painted into a corner of a scene speak
    to the everyday focus of his gaze. The jocular inventiveness of his style traversed
    the rift between popular culture and the high-art world in compelling and meaningful
    ways while critiquing lofty Enlightenment values.


    What is extraordinary about van Hoogstraten''s works is the sense of quickness,
    cleverness, and creative perspective with which he pictured domestic space and
    activities. In *View of an Interior* or *The Slippers* (1654–1662), the artist
    painted a marital scene that evidences a recent change in an everyday environment.
    There is a marked absence of people in these rooms; the painting seems to mimic
    a playhouse. The artist devoted himself to an accurate depiction of spatiality
    with nesting wall pictures, shadows of upper- or middle-class furnishings, and
    doorframes in an attempt to emphasize depth from the point of view of the painting''s
    observer until van Hoogstraten approaches the point where the absence of figure
    itself implies movement. As in the artist''s other trompe l''œil paintings, his
    careful illusion marks everyday space with the potential for a subject, a space
    waiting to be “played out.” One analysis of the painting could be that the evidence
    in the house—for example, the slippers and the broom left behind in the room—show
    that the mistress of the house may be neglecting her household duties and has
    left the scene to carry out an affair. Is she at home, in another room? With whom?
    The slippers as a symbol were often used to connote romantic liaisons. In these
    configurations, van Hoogstraten plays a guessing game with viewers to tease out
    questions concerning domestic norms and their rituals.


    In another, even more striking series, van Hoogstraten went so far as to make
    paintings into viewing-boxes. These were called “peepshow boxes” by fans and collectors,7
    building on the work of Filippo Brunelleschi (1377–1446) and Carel Fabritius (1622–1654)
    and their experiments with perspective. Van Hoogstraten''s examples are desktop-sized
    wooden containers inset with paintings cleverly positioned to create the illusion
    of real, three-dimensional space.8 In Brunelleschi''s work, Italian piazzas conjure
    distance, but in van Hoogstraten''s *Perspective Box of a Dutch Interior* (ca.
    1660), a domestic scene unfolds (figure 2.1). There are no separate physical objects
    placed within the house; rather, all elements of the house are painted into the
    scene with just'
