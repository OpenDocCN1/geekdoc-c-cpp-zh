  md: 'find themselves actually participating in the abuse of Juliana in the interactive
    format of the game.


    What is most striking about The Intruder as an interactive work is not the as-sembly
    of cute, fun games and their blatant, funny sound effects, but rather how those
    cute, fun games implicate the participant within what is actually a very dark
    narrative.


    The full implications of game interaction style in relation to the narrative become
    stronger when one takes an actual player into account. The Intruder positions
    users in a precarious and uncomfortable place, rather than the typical “command
    post” position of power most computer gaming examples provide for players. Software
    theorist Chris Chesser (2003) explores this unquestioned positioning of power
    in his work on game interfaces: “The cursor is not telling me something, but indicating
    that it is listening for my command.”20 Players are almost always constructed
    as powerful agents, super-heroes, or even gods. Additional implications of this
    positioning for the male player or, at least, a male gaze come to the fore given
    the current focus of much of the games industry. “Control,” Chesser notes, “undermines
    the liberal notions of privacy based on the inviolability of the subject. It changes
    what a subject is.”21


    The complication of Borges’s text and the critique of woman’s position emerge
    from the “overpowering” control a player must enact to win in this system. The
    final game in the set transforms the implications of all of the previous games
    into an indict-ment. The player takes part in a “fugitive”-style scenario in which
    he or she guides crosshairs over a pixilated, natural landscape graphic (figure
    7.3). The point of view from the crosshairs and the sound of a helicopter let
    us know we are indeed the hunt-ers and that there is also someone or something
    to be hunted, in other words, a victim. To complete The Intruder’s disturbing
    narrative, we must aim and “shoot at” a figu-rive figure below who, metaphorically
    at least, must be Juliana. In return, players earn their “reward,” the story’s
    end. Bookchin’s Intruder design invokes violence against the lone female character.22
    Perhaps this paradoxical involvement is a stronger indictment of violence in computer
    games, or perhaps it should be read as a metaphorical critique of the larger technologically
    influenced culture to which women do not yet substan-tially contribute.


    Bookchin’s next game, Metapet (2002), is an online simulation game that exam-ines
    the line between work and play (figure 7.4). In the Metapet simulation, players
    create virtual workers of the future in biotech corporations, specifically one
    fictional company called STAR DNA. The player’s task is to try to help employee
    charac-ters, who are seated at their desks in a work environment no doubt familiar
    to many of the game’s players. Employees who can be trained to work more efficiently
    are'
