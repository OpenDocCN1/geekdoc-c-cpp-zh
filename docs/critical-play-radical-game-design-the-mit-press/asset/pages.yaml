  md: 'Akira Kanayama, Tanaka''s partner, is often credited as the leader of Gutai.
    Kanayama created a robot, "the remote control painting machine," which automatically
    discharged paint so that he could make artwork even while absent, on the busy
    days he spent outside his studio organizing Gutai. The artist wittily recounts
    the first experiment the machine produced, a gooey mess turned black from hours
    of labor. Created while Kanayama-slept, it was the highest-selling work he had
    created at the time.⁴⁶ As the 1950s promised an automated domestic lifestyle complete
    with washing machines, automobiles, and the new, self-cleaning range, Kanayama''s
    painting machine playfully reduced the act of creating "high art" to a task for
    an appliance.⁴⁷ Kanayama moved beyond the concerns of Abstract Expressionism and
    even beyond Jackson Pollack''s dependence on bodily gesture by replacing the body
    entirely with a machine. As an automated work bound by rules, Kanayama in effect
    set up a game space for producing art.


    Among Japanese creative movements, those of manga and anime continue to affect
    international art and culture. These forms emerged in 1945, when Dr. Osamu Tezuka
    was inspired by the influx of Western—particularly American—films such as those
    produced by Walt Disney Productions. Tezuka adopted a Disney-like art style, creating
    character faces that had exaggerated eyes, small mouths, and tiny noses. The only
    text in Tezuka''s comics appeared as character dialogue, giving his pages a "cinematic"
    quality. The style became incredibly popular. Today, anime films, using the same
    style, are incredibly popular internationally; and the manga market in Japan grosses
    approximately $4.7 billion each year, with advertising and games following the
    successful style.⁴⁸ Artist Takashi Murakami (b. 1963), who creates sculptures,
    comics, and inflatables, holds this view of popular playful cultural icons and
    manga: "When I consider what Japanese culture is like, the answer is that it all
    is subculture. Therefore, art is unnecessary.⁴⁹ In acknowledging games and popular
    culture, Murakami admits the much of the work becomes static, objectified. He
    notes, "I express hopelessness . . . if my art looks positive and cheerful, I
    would doubt my art was accepted in the contemporary art scene." Also: "My art
    is not Pop art. It is a record of the struggle of the discriminated people.⁵⁰
    In this way, Murakami, like many contemporary artists emerging from tumultuous
