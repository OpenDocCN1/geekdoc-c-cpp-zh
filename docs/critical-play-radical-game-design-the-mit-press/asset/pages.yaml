- pgno: 193
  md: 'The acts of navigating a game space, picking up items, reaching goals, interacting,
    or evading are distinctly linked to the concerns of performance. Game designers
    enact conflict and larger human themes, but what one is doing in a game matters
    signifi-cantly not only to the meaning of the game but also to players'' understanding
    of their own actions. As Félix Guattari might say, game actions are machines of
    materiality, expression, desire, and politics.99 In this way, a game''s mechanic
    is its message.


    The experiments by 1960s and 1970s video artists are also related to participa-tory
    history. Drawing from the work of the cinematic avant-garde, video artists used
    the popular, almost “crass” material of television to invoke a critique on consumption.
    Joan Jonas''s *Vertical Roll* (1972) used out-of-sync video frequencies to produce
    optical illusions instead of understandable television narratives. Paper Tiger
    TV, an activist video art collective, expanded the reception of lesser-known video
    artwork through the development of an artists'' television network. Like the New
    Games Foundation, a new kind of video art aimed to subvert the mass media format,
    playing “pranks” with the very medium of video itself.


    # # Criticism of Game Methods


    As shown, artists have long questioned many aspects of institutionalized art practice,
    as well as the role of the object. Through methods of critical play, they have
    problem-ized the product or outcome of artistic processes. Happenings and other
    instruction-based performances along with the rule-driven visual works of artists
    like Sol LeWitt now invest in the script or score as much as, or perhaps even
    more than, the traditional artifact or art performance. In fact, the goal of many
    conceptual artists was the elimi-nation of a product altogether in favor of the
    system of creation itself.


    But while artists critique others, they are also a self-critical group. Some Surreal-ists
    believed that paranoia-criticism (recall the method espoused by Salvador Dalí
    and utilized by Claude Cahun and others) could help intervene in the physical
    world, yet earlier artists cautioned against the overuse of gaming methods. Tristan
    Tzara became disillusioned with automatism, saying it resided too close to fascism’s
    “cultivation of unreason” to continue to work with it.100


    The impossibilities within most Fluxus games hint at an inherent dichotomy: an
    art object is only useful if it invokes action. For Fluxus artists, a foundational
    truth is that art is found *in the action*. This makes games a sound strategy,
    for Fluxus rules invite action. But the rules of a game call attention to the
    process of creating that action in the first place. The impossibility of realizing
    many of the Fluxus games eas-ily moves beyond the strategy of the joke, even if
    Maciunas distinguished on a 1965 Fluxus broadside between “ART” and “FLUXUS ART-AMUSEMENT,”
    stating that'
