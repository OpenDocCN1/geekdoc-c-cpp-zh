    # The New Rules


    Game designers might be familiar with Salen and Zimmerman’s theory of explicit
    and implicit rules of play. ${}^{21}$ In much of the Fluxus artists’ work, we
    can derive a critical version of these two concepts. Explicit rules are those
    given by exposition in the instructions or scores—for instance, “Make a Sandwich.”
    Explicit rules are obvious, or written down, in the rule set. The explicit rule
    “Follow a Line” is a direct command: an explicit rule. The beauty of a Fluxus
    work, however, lies in the implicit rules surrounding the explicit. The player
    might ask: “Follow a line to where? Whose line is it? Where did it come from?
    Why should I follow that line?” Or even: “That line is ugly” or “I don’t like
    where that line goes.” The resolution of these questions requires implicit rule
    making. Implicit rules take into account how the game is really played: do players
    shake hands after a game? Does the winner refrain from gloating, or revealing
    that he or she had been bluffing? Implicit rules arise at those points where the
    player of a Fluxus game must negotiate the jump from an everyday action into play,
    into the magic circle where, hopefully, the player will go along with the joke
    and truly have a new, unusual, or delightful “sense-heightening” experience. Fluxus
    embodies the shift in consciousness that defines the magic circle so central to
    Huizinga’s *Homo Ludens*, particularly because it incorporates so much of the
    everyday.


    One of the masters of the implicit rule set, Yoko Ono set up her magic circles
    very carefully, playing with danger and risk in her many of her performances.
    Like her *Instruction Paintings* discussed in chapter 4, Ono’s performances were
    well-staged and required audience participation.


    Her work *Cut Piece* was originally performed in 1964 in Japan. Ono performed
    it again at New York’s Carnegie Hall in 1965. In the work, Ono sits still on the
    stage with scissors nearby. The members of the audience approach the artist, one
    by one, and snip off a piece of her clothing. Here, we might recall Gutai artist
    Tanaka’s reconfigured clothing work. The degree of audience participation in Ono’s
    *Cut Piece* varied widely. Some audiences mobbed the artist in a frenzy of cutting.
    Others were hesitant'
