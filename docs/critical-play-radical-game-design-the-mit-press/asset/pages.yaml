  md: 'In major cities such as New York, London, Sydney, Amsterdam, Minneapolis, and
    Tokyo, urban games and locative media have steadily increased in popularity. New
    York has hosted Noderunner (2002), a game in which players race to particular
    location nodes defined by the urban Wi-Fi grid.23 Another game, called PacManhattan,
    led by Frank Lantz and a team of New York University students, enacted a locative
    performance of the Pac-Man game in Washington Square Park and its environs.24
    Asphalt Games used street corners as territory for players to capture.25


    Outside New York, the Design Institute of the University of Minnesota commissioned
    Big Urban Game (2003), also known as the B.U.G. project, as a part of its Twin
    Cities Design Celebration. In this game, participants moved large-scale game pieces
    around the city in coordination with online voting on city maps.26 Megan Heyward’s
    traces (2005) explored locations in Sydney, Australia, and the relationships of
    these locations to people, place, and narrative. Australian based Snap-Shot-City
    (2006) is an ongoing international locative photography game. Blast Theory’s Can
    You See Me Now? (CYSMN) (2001), Uncle Roy All Around You (2003), and I Like Frank
    (2004) enacted tag-like play patterns to merge offline and online play.27


    Internationally, there have been a significant number of location-based media
    events held in the twenty-first century media arts arena. These share an acclaimed
    history with other city-based research initiatives.28 In 2006, the Inter-Society
    of Electronic Arts held a conference in San Jose, California, centering on the
    theme of an “Interactive City.” The conference focused on interactive systems
    and games based in urban terrains for “passers-by participants.” Some of these
    games add participants until they are quite large play groups, potentially approaching
    the size of social smart mobs.29 The Come Out and Play event, held annually in
    New York City, is another instance of the convergence of game design, art, and
    the use of technology. The appeal of urban play events and festivals demonstrates
    the increasing interest in urban play through locative media. In fact, media scholars
    have long linked psychogeography to games: “Psychogeography provided a means for
    participants to open themselves up to play and chance in context. It was a method
    of studying the world, combining compelling, off-the-wall proposals with the long-term
    aim of transforming, as film theorist Peter Wollen has suggested, ‘the whole of
    life into an exciting game’—the play principle before the work principle.30


    With aims similar to, though perhaps not as far-reaching as, this particular claim,
    the UK arts group Blast Theory’s work is among the best-known collections of locative
    gaming projects in the world. Blast Theory makes interactive performances, installations,
    video, and urban-based mixed reality projects. Based in Manchester, England, the
    group combines research and development with games, narrative, and new'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'technologies. The group''s project *Can You See Me Now?* is a locative media
    game that has been performed in Sheffield, Rotterdam, Oldenburg, Köln, Brighton,
    and Tokyo. In this game, players around the world can challenge the members of
    the Blast Theory group online in a virtual city. Blast Theory runners, mapped
    via satellite, appear on a city map. Carrying handheld computers that track and
    transmit their location, the runners can also communicate with each other via
    walkie-talkie interaction, which in turn is broadcast to online users via streaming
    audio on the web. Allowing for up to twenty players at any given time, the game
    explores the ubiquity of handheld communications technology in the city. Noting
    that “some research has suggested that there is a higher usage of mobile phones
    among the homeless than among the general population,” the group explores the
    mobile device as a common denominator for urban experience.


    In Blast Theory''s work, technology is thought to be normative.³¹ According to
    Kate Richards, the stance is significant, and Blast Theory projects “extend user
    and audience affect outside the game—rather than delimiting our consciousness
    to the stereotypical and virtual, the game play pushes us to understand aspects
    of communities, our social responsibility and ourselves. This is partially achieved
    by the very visceral game play—in *CUSMN?* the players and gameplay self-generate
    affects of pursuers and pursued. . . . It was encouraging to see Blast Theory
    awarded the Prix Ars Electronica Golden Nica, which has in the past lauded some
    commercial, apolitical projects.”³²


    Here, with the acquiescence of the participants, the city is transformed to playscape
    and city landmarks and streets become mere spaces on an existing game board, without
    meaning or history in their own right. An appropriation of the city as enacted
    by Blast Theory and other locative media groups means that space has been abstracted
    and decontextualized, in part because, as theorists such as Lefebvre have pointed
    out, the abstraction of space is in certain ways a capitalist strategy of power.
    According to Lefebvre, it is through everyday habits, and through the body, that
    people experience urban space.³³ One''s personal preferences, identity, language,
    and social group or status all have a significant effect on urban experience.
    As Lefebvre notes in *The Production of Space* (1991), spaces that are defined
    in the abstract—that is, those aspects of space that can be installed anywhere,
    can be configured and reconfigured—become manifestations of a way of thinking
    produced entirely by capitalism. This is significant since capitalist spaces,
    to Lefebvre, are systems of property relations, surveillance, and consumption.
    Certainly most of the urban games discussed here, and the type of space these
    games typically produce, rely on an abstracted, loose relationship to the location
    in which they are played, thereby commodifying the urban landscape.


    In this sense, urban critic Dennis Judd might be close to the heart of the matter
    when he argues that major urban centers have become spectacles of tourism and'
