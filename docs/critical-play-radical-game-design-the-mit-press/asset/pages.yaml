  md: '# **Games that Play Themselves**


    The computer game is the paradigm for the critical play of other artists as well.
    Eddo Stern’s work flourishes at the intersection of game-related art and technology
    works. Dealing with system-on-system interactions and game-related interactions,
    Stern’s remarkable range of projects has helped define the field of new media
    art, and larger art and technology practices. His *Dark Game* (2006) is a videogame
    prototype in which two rivals are deprived of their sight. Like his *Tekken Torture
    Tournament* (2001), where the injuries of the virtual characters are translated
    to the physical players, *Dark Game* demonstrates the link between virtual actions
    and the players’ own bodies. *Cockfight Arena* (2001), perhaps the most whimsical
    of Stern’s works, consisted of a performance in which players work to control
    their avatar on the screen while wearing feathered chicken suits embedded with
    sensors. When Stern’s work borders, or crosses into, the absurd, the resulting
    players’ actions are most pleasing. The work unabashedly explores masculinity
    and power issues within commercial games, taking the manifestation of machismo
    posturing and “the fight” among players to their extremes.


    In *Best … Flame War … Ever* (2007), Stern documented and interpreted heated online
    arguments as animated collaged characters speaking the dialog. In *RUNNERS: Wölflenstein*
    (2002), Stern inverted the destruction of World War II by allowing Israeli players
    to invade Nazi Germany. In addition to large-scale political issues, Stern investigates
    the mundane everyday experiences of his players. *Fort Paladin: America’s Army*
    (2003) is a Fisher Price–styled castle that houses the game *America’s Army* (figure
    7.5). Robotic “fingers” play the game maniacally and repeatedly, like a human
    player might have to do to stay on top of the game. The game’s play features a
    repetitive scene: the same character launches the same grenade attack on the same
    nonplayer characters, or NPCs, and then spawns the same new NPC soldiers to kill
    again, in an endless loop.23 By letting the game play itself, Stern’s theories
    on play and his practice highlight the futility of agency in closed systems. Stern
    also exposes the iconography of games as fetish items and as forms of cultural
    shorthand. Demonstrating technical, conceptual, and aesthetic aspects of the work
    at all times, Stern questions what it means to play critically, opting at times
    for a system to play itself, as it understands its own rules best.


