    # ## Design Actions and Design Methods


    Deleuze argues that as people, we "normally perceive only clichés. But, if our
    sensory-motor schemata jam or break, then a different type of image can appear:
    a pure optical-sound image, the whole image without metaphor, brings out the thing
    in itself, literally, in its excess of horror or beauty, in its radical or unjustifiable
    character."¹⁴ For art to move beyond cliché, Deleuze believes it must engage with
    a set of strategies "to show how and in what sense" an image means *x* or *y*
    to wrest the image away from the danger of cliché.¹⁵ Therefore, one of the most
    important frameworks critical play can provide is a range of examples that show
    what artists have done in their creation of games and play. Throughout this book,
    I''ve examined the ways artists have used doll play, instructions, obnoxious language,
    tactile letters, street text, and maps in their games to pose questions. Other
    practices, like Boal''s "Theater of the Oppressed," offer further insights on
    ways to move both the game developer and the game player beyond "normalcy." Each
    chapter of this book can be used to generate strategies meant to inspire other
    artists, designers, and innovators. From chapter 4 alone, the tactics include:


    +   *   writing commands or instructions

    *   using obnoxious language

    *   making humans into puppets

    *   making computer programs that write poems

    *   making words tactile

    *   creating instruction paintings

