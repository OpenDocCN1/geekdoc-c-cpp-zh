  md: 'Hanna Höch (1879–1978), an imaging pioneer from Berlin, engaged in both social
    interregation and rethinking of materials, composition, and cultural investigation
    to create the “reordered reality” of her series of found-object and photo collages.
    ${ }^{20}$ Inspired by folk practices popular during World War I, lithographs
    were distributed to Germans of a soldier at a barracks, and family members would
    supplant the generic face of the soldier with a print of their own relative''s
    face. Höch and her partner, Raoul Hausmann, developed a technique now called “photo
    collage.” Höch and Hausmann often created compositions that featured human figures
    or bodies in fragments along with machine parts and recognizable brands as mechanization
    and advertising endlessly reproduced across the global landscape. ${ }^{21}$


    These artists also examined the expansion of traditional gender roles in relationship
    to technology in works of a reordered reality that the collages create. ${ }^{22}$
    The early collages are visual works that demonstrate critical play through their
    spatial relationships and the quirky engagement with the body. The photo collages
    of Höch, like the performances or cut-up poetry of Freytag-Loringuehom, are products
    of deconstructive processes that reveal that systems of representation of the
    body, specifically of women''s bodies, are not only problematic but also are as
    equally constructed, as is collage. Found object collages like Höch''s *Das Schone
    Mädchen (Pretty Girl)* (1920) and *Dada-Ernst* (1920–1921) (figure 5.1) eschew
    the traditional representation of woman and the body, and the authority of the
    artist, and ideas of originality. Höch''s collage provided “another way of refusing
    the image of woman as a transcendent object of art and the male gaze, generator
    of a string of similarly depoliticized art objects.” ${ }^{23}$


    Like other performative objects, such as the Surrealist Meret Oppenheim''s *Breakfast
    in Fur* (1936), photo collage possesses two qualities. The first is a sense of
    “liveness”—a “wanted to be acted with” visually or tactilly. These performative
    objects show evidence of collision, evidence of particular rules that govern how
    an artwork functions. The second quality is its “intended use,” or how the object''s
    affordance is displayed through its shape and texture. This invitation to act,
    joined with shape, forms the rules that govern the object, how it can be played
    with, how it can function in the imagination.


    Photo collage can also be read as a technique mirroring the political interrogation
    of gender stereotypes and imaging of the body, reinforcing the uncomfortable relationships
    between commercialization, machinery, and the physical self. In her use of juxtaposition
    and body image, Höch''s work has been compared to that of feminist media artists
    Cindy Sherman and Barbara Kruger. But it is also worth noting the role of technology
    in Höch''s work. Not only are machines depicted alongside, with, or as'
