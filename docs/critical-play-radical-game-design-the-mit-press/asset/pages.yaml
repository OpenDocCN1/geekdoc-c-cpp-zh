    # Situationists


    Perhaps most well known of the activist-artists were the members of the Situationist
    International movement, a movement that described both a philosophy of space as
    well as political action. Formed in Italy (1957) by thinkers and artists of diverse
    practices, the various factions of the group were a force in political art until
    the 1970s. Whether it was the writing of philosophers Guy Debord, Michel de Certeau,
    and Henri Lefebvre that stimulated artists and students to carry out protests,
    actions, and art works in urban city centers, or whether these philosophers were
    inspired by students and artists already taking the streets by storm, the Situationist
    group emerged in the 1950s and grew to become influential for over a decade with
    projects aimed at everyday consciousness. 1968, members of the SI were involved
    in the May student revolution in France and in the occupation of French universities.'
