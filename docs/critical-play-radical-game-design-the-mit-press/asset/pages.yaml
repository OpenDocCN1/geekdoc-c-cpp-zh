    In a world increasingly framed by borders, immigration, and migration, critical
    play has taken on an important role in performance and performative media in general.
    The strong political and utopian aspects of event-based, performative, and rule-based
    works are well suited for addressing the concerns of marginalized groups.$^{87}$
    Critical play strategies also figure prominently in the methods of tactical media
