    Old Norse term taff denotes a family of games usually played on a checkered or
    cross-shaped board. Taff features teams of uneven strength and themes of surrounding,
    or seizing, the king and his army. Often thought of as precursors to chess, some
    examples of Taff are the tenth-century Ballinderry game and the Brandub games
    of Ireland. The game Tawlbwrrd, from Wales is documented in law as game play requires
    eight pieces on the king’s team, but sixteen on the aggressor’s. Tablut from Lapsland^{29}
    and Hnefatafl in Iceland were played across much of Northern Europe until chess
    supplanted them during the twelfth century. ${}^{30}$ Halatafl dates from the
    fourteenth century and is mentioned in the Icelandic poem the Grettis Saga. ${}^{31}$
    The game is related to Fidchell in Ireland, Gwyddbwyll in Wales, Fox and Geese
    in Britain, Germany, and France, and Sheep and Wolf in Sweden. Believed to have
    been a game invented by the Celtic god Lugh, certain students of Celtic culture
    explain Fidchell as a demonstration of how one negotiates the wall between the
