  md: 'Surrealists, however, emerging under the leadership of writer, artist, and
    organizer André Breton and others during the 1920s, explored games through two
    prominent lines of inquiriy. First, the Surrealists emphasized the playfulness
    of Dada through the use of chance and juxtaposition. But Surrealists were also
    concerned with the internal workings of the mind and encouraged a deep focus on
    the subconscious. Relying on the work of Sigmund Freud, and recognizing the importance
    of human perceptions of things and events, Breton, who had studied psychology
    and worked during part of World War I in a neurological ward, wrote the *Manifesto
    of Surrealism* (1924) and within four years published an unofficial case study
    of a mentally ill woman, titled *Nadja* (1928). After the now-famous inagural
    manifestos of the early 1920s, several of the artists associated with Dada, among
    them the German-French sculptor Jean "Hans" Arp, moved on to participate in the
    Surrealist movement. ^{72}


    In addition to writing *Nadja*, Breton worked with Philippe Soupault to coauthor
    the book *The Magnetic Fields* (1919), which some believe launched the Surrealist
    movement. With Louis Aragon, Breton and Soupault founded *Literature* (1919),
    the review that would become the standard forum for disillusioned intellectuals
    of the day. Within the pages of *Literature*, the Surrealists blamed the culture
    of the bourgeois as the primary cause of World War I.


    Practices of automatic composition, game operations, and chance or aleatoric methods
    may have been used by artists before the 1920s; the Surrealists were aware of
    new trends in art and aesthetics like Futurism and Constructivism, but their focus
    on themes of the unconscious was novel, intense, and rooted in the budding field
    of psychoanalysis. In actuality, as organized civil society increases its "high"
    culture and sophisticated pleasures, the availability and intensity of daily pleasure
    appears to diminish. To twentieth-century critic Walter Benjamin, it is only through
    the intensification of everyday experiences that social change can occur. Play,
    in this case, could function not only to attract players from across the social
    spectrum but also to revolutionize culture by expressing what might otherwise
    manifest as dangerously repressed desires. It is precisely such psychic needs
    that were explored by the Surrealists through gaming operations and game methods.
    Surrealist art and literature stressed unconscious and irrational methods for
    creating art through processes of automatism, chance, and interruption. "Surrealism
    is not a poetic form," wrote the Surrealists in their manifesto. "It is a stream
    of the mind finding itself again and it intends to desperately crush its shackles
    with artificial hammers, if need be." ^{73} A fascination with play and how play
    invoked and evoked unconscious processes was the focus of much of Surrealist practice.
    In fact, members of the "Bureau of Surrealist Research" believed they could'
