    The oldest games are found at sites of the world''s ancient civilizations, Mesopotamia
    and Egypt, and in areas now known as Cyprus, Palestine, Iraq, Iran, and Jordan.
    These areas are the origin of a group of games known as *mancala*, or counting,
    sowing, and capture games. Other names for these kinds of games are awari, oware,
    warri, gebeta, qarqis, bao, and matara. Pallanguli, ² or “many holes,” is a South
    Indian version of the game.³


    “Mancala” comes from the Arabic word *naqala*, literally “to move.” The common
    Ghianian game *oware* comes from a Twi legend that describes a man and woman playing
    the game together endlessly. To someday end all of their various games they married,
    hence “oware,” which means he or she marries or has a lifelong affair.⁴ Originally,
    an oware or mancala “board” could be created from depressions in the earth. Later,
    stone benches and tablets were carved out. Moves in mancala are created as the
    player selects an indentation between the two rows of indentations, and, one by
    one, distributes a collection of beads, stones, or “seeds.”⁵ While mancala seems
    simple, there are many global and regional variations, and different mancala traditions
    feature different rules for movement, capture, and objective.


    Game play in mancala is usually symmetric, meaning that players use the same strategy
    and play by the same rules in order to win. H. J. R. Murray (1952) and Russ (2000)
    categorize these mancala types by describing the board, the number of rows used
    in the game, and the particular rules for capture; for instance, one may continue
    around the board, or stop in the storehouse. The oldest Neolithic versions of
