    In major cities throughout the world, the homeless, prostitutes, and domestic
    workers possess the streets in a way that speaks to economic and social *disempowerment*.
    Their “drift” is not one of exploration or privilege, but a search for a place
    to sleep or for labor. In the digital age, with economic, intellectual, and cultural
    divides both effective and prevalent, some artists and theorists may have grave
    doubts about following in the footsteps of creators of an urban game or locative
    media event whose premise of “interventionist” work actually manifests as an entertainment
    spectacle for an advantaged audience. While individual freedom and rights can
    construct subjectivity from looking and experience, some participants still emerge
    more empowered than others. Few location-based art projects are nuanced enough
    to address these kinds of issues.


    When artists and designers set about to create an environment for play, the rhetoric
    surrounding the role of play, and the rhetoric of power, are consistently intertwined.
    Players have abilities. In games, players are agents of action and change. In
    the mere act of deciding to play, an understanding of the shift in potential occurs
    among players, for in games, rules set up novel frameworks for action and agency.
    Artists have long been critical users and consumers of play systems, and in addition
    to its role in entertainment culture, play has long been used as a tool for practice,
    education, and therapy. From war games, in which troops sharpen their skills before
    battle, to games involving learning about science, to games that help one tease
    out reactions to phobic scenarios, these “uses” of play are thought to lead to
    a kind of rehearsal, a practice, a type of empowerment. When taken to the streets,
    this empowerment can be transformed into a reengagement with the city and thus
    reclamation of that space. But if this is a goal, it must be integrated into the
