  md: 'Surrealist games and procedures are intended to free words and images from
    the constraints of rational and discursive order, substituting chance and indeterminacy
    for premeditation and deliberation. . . . In one particular and important respect
    Surrealist play is more like a kind of provocative magic. This is in its irrepressible
    propensity to the transformation of objects, behaviors and ideas. In this aspect
    of its proceedings Surrealism makes manifest its underlying political program,
    its revolutionary intent.⁵¹


    Many authors were acquainted with Apollinaire, who coined the term surrealism
    in the spring of 1917, as a subtitle to his play Les Mamelles de Tirésias, or
    The Breasts of Tirésias: A Surrealist Drama. The play shocked conventional Paris
    by proposing that men and women switch gender roles and men bear the children.


    The work was an influence on fellow writers Breton and Soupault, who followed
    the path of other French literary investigators Rimbaud, Lautréamont, and Vaché,
    though without the assistance of the opium and absinthe available to the writers
    of that area. Their work, The Magnetic Fields (1920), was an early Surrealist
    text collaboratively created in 1919, just after the end of World War I. During
    1919, Breton and Soupault would meet, sometimes for ten or twelve hours: “Soupault
    and I formed the intention of deliberately reproducing in ourselves the state
    out of which such (sentences) emerged. In order to do this all that was necessary
    was to disregard the context of the external world, and it was thus that they
    made their way to us, during a period of two months, soon following each other
    without interruption so rapidly that we had to resort to abbreviations in order
    to note them down.”⁵²


    Automated drawing and writing were among several methods of automation derived
    from, among other things, the Spiritualist movement in the United States. Spiritualists
    believed they contacted the dead with automatic writing. The late nineteenth-century
    Swiss psychic Hélène Smith, through automatic writing, claimed to have spoken
    with Martians and detailed her life as a fifteenth-century Indian princess.⁵³
    Her story was a strong influence on the Surrealist movement members, and was especially
    appreciated by Breton. She and others such as the American Spiritualists used
    automatic processes to connect with the spirit world, but Breton and other Surrealist
    artists used the technique to understand the workings of the unconscious.


    The Surrealists did not launch manifestos until five years later, but early on,
    participants still valued the objective nature of chance, automatic writing, and
    black humor.⁵⁴ Automatic processes proved to be essential to the Surrealist mission:
    “Beloved imagination,” Breton wrote, “what I most like in you is your unsparing
    quality.”⁵⁵ The discipline involved in automatic writing is to “vigorantly resist
    the temptation to interrupt'
