  md: '# | 5 |


    ## PERFORMATIVE GAMES AND OBJECTS


    > Playful procedures and systematic stratagems provided keys to unlock the door
    to the unconscious and to release the visual and verbal poetry of collective creativity.


    —Alastair Brotchie and Mel Gooding, *A Book of Surrealist Games*


    To Johan Huizinga, play incorporates a myriad of games: “games of strength and
    skill, inventing games, guessing games, games of chance, exhibitions and performances
    of all kinds.”¹ In this chapter, we explore the last type of games Huizinga describes:
    *performative games*, or games that achieve critical play through a significant
    sense of performance in their attempt to influence society, or to provide utopian
    and playful visions and revisions of the world. Their history is as rich and deep
    as that of the game forms already noted. Throughout the past century, various
    art and social movements have engaged in staging forms of participation and creating
    interactive events, playful subversions, disruptions, and interventions. In the
    broadest sense, the performance of critical play includes historic games and performative
    objects, performances themselves, and mediated performance.²


    In some sense, all games are performative, requiring some negotiation of action—thinking,
    guessing, running, or tossing—for play. Performance, when understood as context,
    constitutes a spectrum of cultural practices including theater, dance, music,
    event making, ritual, and spectacle, and could just as easily be studied by anthropologists
    as art historians. By calling attention to intercultural relationships, social
    inequity, cultural processes, the role of the body, and the use of language, performance
    comes with a particular history, and a set of strategies, some of which automatically
    infer *play*. Theater, for example, presents actors, or players, who invoke make-believe
    and imaginative worlds just as children do when playing with a playhouse or dollhouse.
    Such actions may or may not use props or follow instructions or scripts. In'
