    The Surrealists followed, bringing the doll further into the realm of the unconscious.
    Sharla Hutchinson notes that several of these artists used the creative method
    of “convulsive beauty,” including depictions of violence, pornography, hysteria,
    and transgressive behavior to explore the psychological impact of restrictive
    social norms. $^{64}$ Man Ray’s famous photograph *Coat Stand* (1920) showed a
    nude woman with a missing leg—in actuality, a hidden leg disguised with a dark
    sock—perched behind a doll-like cutout of a head and arms. Using both doll and
    dressmaker dummy as indexes, as well as a hand-drawn mask, the doll-as-woman-as-coat-rack
    stares ahead in silent shock, an expression of the horrors of war. Deleuze links
    artistic, fantasy worlds and the reality that generates such fantasy by noting,
    “A frightened countenance is the expression of a frightening possible world, or
    of something frightening in the world—something I do not yet see. Let it be understood
    that the possible is not here an abstract category designating something which
    does not exist: the expressed possible world certainly exists, but it does not
    exist (actually) outside of that which expresses it.”$^{65}$


    From marionettes to life-sized artificial bodies, artists’ dolls became more grotesque
    in the Surrealist period. Perhaps the best-known examples of this work were the
    headless, mutilated female dolls that emerged from German-born artist Hans Bellmer
    (1902–1975). Bellmer began working with dolls in Berlin in 1933. His papier-mâché,
    plaster, and tissue-paper bodies quickly became some of the most controversial
    artifacts of the entire Surrealist movement.$^{66}$ In a large portfolio of photographs,
    Bellmer staged scenes featuring these disturbing figures in both indoor and outdoor
    settings, sometimes with household props like carpet beaters (figure 2.13).$^{67}$


    The image of the doll is a complex site for the generation of meaning and, while
    problematic for reasons discussed later, Freud’s useful description of the interesting
    tension between agency and pleasure his 1919 essay, “The Uncanny,” helps ground
    an investigation into the human fascination with automata and life-like figurines.
    Using the term *unheimlich*, which translates literally to “unhomelike,” Freud
    described how the sense of the uncanny manifests when an otherwise normal situation
    reveals hidden abnormalities exposed by small shifts or derivations from normal,
    “lifelike” behavior. Linking the uncanny to desires repressed from infancy, and
    noting that this return to repressed desire is based on a desire for control,
    a viewer’s or player’s reaction to uncanny situations can create dread, fear,
    or fascination out of what on the surface appears to be an everyday circumstance.$^{68}$
