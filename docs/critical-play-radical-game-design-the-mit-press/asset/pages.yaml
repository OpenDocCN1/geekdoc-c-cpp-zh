  md: '# **4 Language Games**


    +   1. Crystal, *Language Play*.


    +   2. As mentioned, each of these categories could be theorized in book-length
    volumes. Several forms will not be explored much at all, including the categories
    of riddles. But I do wish to note that the riddle may have been used historically
    as a critical form of play, though there are many examples of simple whimsy. For
    instance, a riddle appears in an ancient Babylonian text: "Who becomes pregnant
    without conceiving, who becomes fat without eating?" (a rain cloud). See Augarde,
    *The Oxford Guide to Word Games*, 1. Anagrams, riddles, palindromes, acrostics,
    chronograms, spoonerisms, and pangrams each emerged in the earliest of languages,
    and flourished among Greek and Latin scholars. J. W. Shoemaker in his treatise
    *Practical Elocution* even elevated tongue twisters as "recreations in articulation."


    +   3. Tse Bartholomew. *Hidden Meanings in Chinese Art*.


    +   4. Picture-based puns are well documented. A decorative painting showing goldfish
    in a pond depicts the characters "gold fish fill the pond." But in the spoken
    language, this can also sound exactly like "may god and jade fill your home,"
    a proper good-luck wish. See Rudolph, "Notes on the Riddle in China," 68.


    +   5. West, *Transcendental Wordplay*.


