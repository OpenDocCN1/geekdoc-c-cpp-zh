  md: 'Holzer’s text interventions addressed consumerism, gender roles at work, and
    media representations of women and rape. Many were likely to appear in public
    spaces, disrupting the traditional space of the gallery, though Holzer is shown
    frequently in traditional venues as well. Holzer’s older works harbor an accusatory
    tone, provoking the reader to react. “YOU ARE A VICTIM OF THE RULES YOU LIVE BY”
    claims one of her lines from her 1989 show at the Guggenheim Museum. The interventionist
    nature of her work means Holzer’s texts can surprise, often catching the reader
    unaware. Her pieces range in size from ephemera as small as stickers to large
    electronic spectacles, and take both analog and digital forms. For example, during
    Creative Time’s 42nd Street Art Project (1993–1994), Holzer used city marquees
    displaying selections from her series *Truisms* and *Survival* that seeped into
    the viewer’s reality. Holzer’s artistic intervention into place also spread to
    the emerging public domain of the Internet. In the late 1990s, she produced the
    web-based work, *Please Change Beliefs* (1999). *PCB* is a site where Internet
    users can participate in the artist’s “statement making” by uploading their own
    new “truisms” to a list of truisms already databased in the program. $^{77}$ Texts
    pass at timed intervals, but are open to change by users. Though not explicitly
    a game, participation by the audience and a sense of social concern relate to
    protest art and intervention. Here, a connection with the public is not a mere
    preference of the artist, but essential to the practice. $^{78}$ Her texts foreshadow
    techniques used by locative game designs (see chapter 6).


    For the last decade, Holzer has been undertaking interventions with light projections.
    Early street-based interventionist practices are clearly linked to this new interrogation
    of media and tactics, the approaches of advertising, and news broadcasting. These
    texts are projected, interrupting the lives of passersby to form a community of
    ephemeral experience in public. Her work *For the City* (2005), in figure 4.13,
    illuminated New York with both political poetry and declassified documents that
    were projected across city landmarks. Her texts are serious, but coming upon one
    creates a temporary magic circle, a play space for reading, thinking, and conversation
    in the community.


    Using the terminology of subversion, Holzer both rewrites advertising slogans
    for political ends and reskins public surfaces through signage and stickers. The
    contemporary art practices of Holzer represent merely a few of many examples of
    artists working against dominant norms using subversive tactics (figure 4.14).


    A final example to establish context for exploring linguistic artistic intervention
    is the work of the group known as the Guerrilla Girls, formed in the mid-1980s
    to critique cultural institutions such as the Metropolitan Museum of Art (see
    figure 4.15), the Whitney Museum of American Art and the Museum of Modern Art
    in New York. $^{79}$'
