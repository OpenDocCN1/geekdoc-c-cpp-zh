  md: 'Critical play that takes on cultural patterns, such as gender roles in domestic
    space, functions within large cultural systems that are difficult to examine,
    and slow to change. The manipulation of characters and environments that many
    games offer is a complex means for negotiating player desire within game worlds.
    Care-giving games, from playing “house” to playing The Sims, maintain a tantalizing,
    rhythmic suspense related to the fundamental human desire to satisfy needs and
    connect with others. ${ }^{113}$ This is not to say that this is the only motivating
    factor in domestic game play, but it is certainly a factor in the complex system
    a house game represents. Who we are when we play games and how we relate to the
    game world are important questions, for the pleasures of gaming derive from the
    structures of rules that define the game environments, and the rules range from
    specific internal game rules to more abstract social mores, commercial patterns,
    and gendered subject positions. ${ }^{114}$


    A great deal of pleasure is derived from subverting online culture’s norms of
    interaction and exploring the boundaries of what is permissible, and games are
    where people push these limits. By moving and playing within the structures of
    work and play systems, users interact and experience the pleasure of creating
    playculture. The digital “magic circle” that players enter is an open environment
    focused on experimentation and subversion. ${ }^{115}$ Thus, such games reveal
    anxieties and uncertainties about domestic roles—uncertainties that manifest through
    the critical playing of games.


    As Chris Crawford notes in The Art of Computer Game Design, games are closed systems,
    safe spaces in which one can enter into various kinds of conflict without risking
    comfort, enjoyment, or physical well-being. A good game must be safe and engaging,
    its elements must be cohesive and well integrated, and its interaction scenarios
    meaningful. Doll play, and computer games that take on characteristics of doll
    play, encourage critical play by providing environments for context perversion
    and emergent community formation, altering subjective lived experiences, the “hypocrisies
    of adult life,” as noted by Sutton-Smith, who has argued that children’s play
    offers narratives that negotiate the risks of the real world. ${ }^{116}$ The
    relationship between dolls or avatars and players takes on a self-aware perversity
    that materializes in the interface. Victorian doll play, representations of the
    body, and political awareness in Bellmer’s work demonstrate how voyeuristic transgressions
    can be used to draw awareness to normative social behavior.


    Game makers, like any media makers, cannot simply step outside current contemporary
    social systems to write and think in ways completely “free of the rules.” Rather,
