    values and ideas about access, but more importantly, create a way of life that
    is the product of a set of cultural beliefs, economic forces, and expectations.


    Around 2002, the year the first Sims game peaked in popularity, a significant
    shift in U.S. culture affected the balance between the physical and the virtual.
    Since the 1980s, there has been a growing U.S. trend to move to controllable spaces.
    The house has shifted from being a place of comfort to a site for defense. Unsurprisingly
    then, amid 1990s dot-com culture, The Sims embodied a period of great optimism,
    when a robust economy and low crime rates contributed to the utopian appeal of
    a new era. Software and hardware industries provided an almost mythic promise
    of a new, technology-infused lifestyle. Americans actively participated in both
    the consumption of household goods and virtual technologies.⁸⁸


    The collapse of the dot-com bubble was followed by a period of unusual economic
    decline and instability due to fears generated by the idea of impending terrorist
    threats. In the United States, old city neighborhoods are growing at the suburbs’
    expense.⁸⁹ With cities touted as terrorist targets, and U.S. Department of Homeland
    Security bulletins encouraging citizens to fortify their homes with plastic sheeting,
    stored water, and duct tape, digital entertainment sales simultaneously boomed.
    These practical everyday trends, combined with the increase in games’ (especially
