  md: 'And here you are a writer, infinitely original and endowed with a sensibility
    that is charming though beyond the understanding of the vulgar.36


    Dadaists were also influenced by the artists of the Futurist and Russian Constructivist
    movements, who opposed tradition and the state and who were adamant in taking
    an antiauthoritarian stance against preconceived notions of art. Artists like
    Tristan Tzara, Francis Picabia, Jean Arp, Hugo Ball, Marcel Duchamp, and Max Ernst
    were war resisters. They developed the idea that artistic groups could become
    social and political forces. They sought “the real” through the abolition of traditional
    culture and form. Dada involvement with play and chance was accompanied by a willingness
    to explore episodes of momentary madness through the use of found objects, abstract
    painting, sculpture, and drawing. They believed their social role was to balk
    and protest against trite narratives of “noble” polities and traditional art aesthetics,
    standing against the use of art for establishing propaganda. Instead, Dada wished
    art to speak for itself, connecting elements of the real world to the context
    of art and responding to war, technology, and shifts in social culture. Picabia''s
    *L’Oeil cacodylate* (1921) (figure 4.6) is one visual example of collaging artifacts
    from culture with the fragmented images and language of the time. Many Dadaists
    intended to deconstruct all, *destroy everything*, especially the bourgeoisie
    that enabled and supported the war.


    In many paintings and performances, Dadaist wordplay favored audience *interaction*
    and *chance*, new concepts in the arena of fine arts, and sought the brusque everyday
    quality of ordinary items. Tzara constructed cut-up poetry and manifestos from
    the newspaper. Picabia and others would create collage paintings that incorporated
    handwriting techniques alongside cut-ups and found materials painted onto the
    canvas. As Apollinaire said: “Psychologically it is of no importance that this
    visible image be composed of fragments of spoken language, for the bond between
    these fragments is no longer the logic of grammar but an ideographic logic culminating
    in an order of spatial disposition totally opposed to discursive juxtaposition
    . . . it is the opposite of narration, narration is of all literary forms the
    one which most requires discursive logic.”37


    German Dada artist Raoul Hausmann, co-inventor of the photo collage with Hannah
    Höch, wrote phonetic poetry during the year 1918, calling language “transactions
    within the mouth’s chaotic cave” that guaranteed unique events and therefore a
    reassuring certainty in change. Hausmann, obsessed with the mechanized quality
    of contemporary living, chanted his poems, an attempt to embody popular notions
