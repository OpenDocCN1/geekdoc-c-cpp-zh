- pgno: 19
  md: 'to know what system or phenomenon in particular one is working against, be
    it political, social, legal, or cultural. In this book I extend the term subversion
    from the definitions provided by Raymond Williams and Antonio Gramsci,²⁸ Michel
    Foucault,²⁹ Judith Butler,³⁰ and others.³¹ The core ideas regarding this term
    evolved from Antonio Negri’s work on subversion (2001) as well as themes of disruption
    and intervention from decades of art practices. Subversion has been identified
    by several theorists and practitioners as a powerful means for marginalized groups
    to have a voice.³² Likely this focus is due to the activist call to examine how
    power relationships play out and how social change is actually orchestrated. Much
    of Negri’s writing emerged during his long house arrest in Italy for his political
    acts, and his ideas are a culmination of much contemplation on how contemporary
    culture operates. Negri’s is a dual view; he writes of both the difficulty of
    “breaking out” against power, and the inherent encapsulation and control by those
    in power of subversive acts. When working against pervasive systems of power,
    he notes that subversive practices still have the power to trigger social change
    when used on the right scale and with the right tools. Perhaps games are such
    a tool: Negri notes that subversion is necessary within a multitude of organizations
    in myriad types of forms, and not merely for the functioning of such organizations
    but for individual and collective well-being.³³ Negri and others use the term
    subversion to mean a creative act rather than a destructive act.


    Because they primarily exist as rule systems, games are particularly ripe for
    subversive practices. A hallmark of games is that they are structured by their
    rule sets, and every game has its “cheats”—even play itself, pushing at the boundaries
    of a game system, could be said to involve a kind of subversion. This idea is
    supported by games scholarship; to scholars of play such as Brian Sutton-Smith,
    play is associated, at least in part, with transgressive and subversive actions.


    “Interventions” are specific types of subversions that rely upon direct action
    and engage with political or social issues—a “stepping in”, or interfering in
    any affair, so as to affect its course or issue.³⁴ Rather than reducing these
    actions to limiting categories, it is more fitting to situate the actions of artists
    among a loose set of principles that guide interventions. The introduction of
    art objects and performance into public spaces, for example, is a way that artists
    appropriate the cognitive space of public space, of everyday space, and functions
    in an interventionist fashion. Artists practicing intervention often have social
    or political goals, and may seek to open up dialogue by transgressing the boundaries
    between art and everyday life. With the exception of purely aesthetic movements
    (abstract expressionism comes to mind), most twentieth-century art movements fostered
    interventionist activities and strategies, particularly those identified as the
    avant-garde. Numerous twentieth-century avant-garde artists'
