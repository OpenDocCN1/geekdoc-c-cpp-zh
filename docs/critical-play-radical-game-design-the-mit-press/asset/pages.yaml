    # ## Games of the Epic and the Everyday


    At different stages of human history, then, games have played varying roles. From
    assisting in the development of conceptual processes, to invoking ritual, to forging
    a connection with time and the future, players throughout history have struggled
    to gain agency and understand uncertainty through game play. As the popularity
    of the Taff board receded, European games other than chess evolved and flourished,
    some growing out of the most commonplace sort of play.


    Successful post-Renaissance games built on *Goose*, an Italian chase or race-themed
    game that was invented in Florence under Francesco dei Medici in the sixteenth
    century. Under the Medici recommendation, *Goose* was adopted by Philip II of
    Spain and rapidly spread to other parts of Europe. Later, *Goose* became a model
    for early board games in the United States as well as other European games such
    as *Snakes and Ladders*. *Fox and Geese*—mentioned earlier as a game related to
    the *Taff* games and their Celtic counterpart, *Fidchell*—was known to be a favorite
    of Edward IV of England (1461–1483) as well as the nineteenth century''s Queen
    Victoria and Prince Albert. In a category called “fox games,” a group of board
    games featuring unequal opponents, one player is the fox, or aggressor. Other
    players control or play the numerous geese, sheep, or prey the fox tries to eat
    while the fox attempts to avoid the traps his opponents set all around him. Fox
    games are characterized by an unbalanced set of game goals and a rather abstract
    board. These “unbalanced games” paralleled the popularity of chess, Go, and backgammon,
    and their rules of play were relatively stable. Abstraction provided a universal
    quality to these play experiences while allowing the games to spread throughout
    various regions, religions, and cultures. Other board games evolved in specificity
    and content through the addition of detail. Some examined depicted large social
    concerns, others quite mundane events.


    In China, games took on many forms. Printing was invented in Asia and mass-printed
    board games originated in China and Japan. Chinese playing cards, for example,
    are recorded from the year 1294 AD. Yet historian Andrew Lo has argued that card
    games as we know them actually emerged from the West, for they overwhelmingly
    share Western rule sets.37 Cards used in conjunction with game boards, however,
    arose far earlier in Asia. Lo examines the game of “leaves” and has determined
    that early board games of the Tang and early Song periods incorporated both cards
    and dice into the play experience.38 Some games, such as that depicted in figure
    3.5, used more unusual elements than would a game today, such as incense.'
