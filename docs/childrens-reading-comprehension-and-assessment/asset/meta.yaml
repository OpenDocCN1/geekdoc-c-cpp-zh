  - 信度的重要性在于确保在不同设置、评分者和管理条件下获得一致的分数，评估越性，对能力的估计就越准确。信度通常通过四种技术进行测量：(a) 测试重测信度(b)
    等价形式信度(c) 内部一致性和 (d) 评分者间信度。在本研究中，我们通过在短的时间内（2-6 周）对儿童实施相同的任务来测量重测信度。这种方法通常适用于只有一种形式的测试可用，或者研究者对衡量测试题者对分数的影响感兴趣。随时间的变化在个体间存在差异，或者成熟对分数产生了差异化影响，那么信度将会降低。通常，某些个体比其他个体能从测试中回想起更多信息，或者暴露于有利于所测结果的学习情境中（Aiken,
    1997）。测试重测信度的优势是使用了相同的题目和形式，且信度的衡量标准是个体一致性而非题目一致性。其缺点是可能存在迁移效应，通过高估或低估信度系数来影响结果。
