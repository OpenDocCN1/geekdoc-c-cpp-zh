  \ 7\n\n## 关于作者\n\nJohn Mueller 是一位自由作家和技术编辑。他血液里流淌着写作的基因——他编写了 100 多本书和 600 多篇文章，主题涵盖了从网络到人工智能，从数据库管理到潜心编程的各个领域。John\
  \ 为多家杂志提供技术编辑服务，他的技术编辑技能帮助了 70 多位作者完善手稿。他还从事各种类型的咨询并编写认证考试题。访问 `www.johnmuellerbooks.com`\
  \ 了解更多关于 John 的信息。\n\n## 关于编辑\n\nRonald Mak 在加州硅谷的圣何何塞州立大学教授计算机科学和数据科学。他写过关于软件设计、编译器构建和数值计算的书籍。他曾是\
  \ NASA 和 JPL 的高级科学家、IBM 研究的研究人员，以及劳伦斯·利弗莫国家实验室的企业级软件专家。在职业生涯早期，他曾在惠尔、太阳系统和苹果公司担任高级软件工程师职位。访问\
  \ `www.cs.sjsu.edu/~mak` 了解更多关于 Ron 的信息。\n\n## 出版商致谢\n\n**执行编：** Lindsay Berg\n\
