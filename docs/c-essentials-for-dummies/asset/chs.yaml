  \ (ebk)\n\n## 介绍\n\n欢迎阅读 *C++ Essentials For Dummies*。本书包含了你开始学习 C++ 编程所需的的基础信息。你将学习如何安装和运行编译器、编写程序，并使用数组、类和指针等重要的\
  \ C++ 特性来良好的面向对象编程。\n\nC++ 是一门庞大且复杂的语言。但无论你只是开始学习编程，还是其他编程语言的专家，本书包含了该语言的精要，能让你快速成为一名\
  \ C++ 程序员。\n\n## 关于本书\n\n*C++ Essentials For Dummies* 包含了你开始编写 C++ 程序所需的信息。你可以使用最新的\
  \ C++ 20 版本编译器编译并运行示例程序，也可以使用较早的 C++ 14 和 C++ 17 版本。\n\n本书并不是 C++ 的全面参考书。若想超出本书涵盖的内容，你的下一本书应该是\
  \ John Paul Mueller 编写的 *C++ All-in-One For Dummies* 第 4 版（本书正是源自该书）。然而，本书将通过其易于遵循的\
  \ *For Dummies* 格式让你快速上手。\n\n## 愚人假设\n\n我们对你（即读者）做了一些基本的假设：\n\n* **你拥有或可以访问一台相当现代的计算机。**\
  \ C++ 示例程序在 Windows 电脑上测试过，但本书展示了如何在 Mac 或 Linux 电脑上同样轻松地编译和运行它们。\n* **你是一位丰富的电脑用户。**\
  \ 换说，我们假设你了解使用电脑的基础知识，例如启动程序和处理文件系统。\n* **你对学习如何用 C++ 语言编写程序感兴趣。** 这是本书的主题，所以这是一个合理的假设。\n\
  \n我们**并不**假设你具有任何 C++ 或任何其他编程语言的先验经验。\n\n## 书中使用的图标\n\n与任何 *For Dummies* 系列书籍一样，本书充满了实用的图标，用于引导你注意特别重要的内容。你可以在书中各找到以下图标：\n\
  \n![Warning](img/warning.png) 危险！此图标突出了可能帮助你规避灾难的信息。\n\n![Remember](img/remember.png)\
  \ 我们告诉过你我们上过的那个内存课程吗？\n\n![Tip](img/tip.png) 特别注意此图标；它让你知道这里有一些特别实用的窍门。\n\n## 接下来的路\n\
  \n如果你是编程初学者，从头到尾阅读本书将让你受益匪浅。但如果你熟悉 Java 等其他编程语言，你可以挑选阅读某些章节，以学习 C++ 的独特之处。\n\n#\
  \ 第 1 章：编译并运行你的 C++ 应用\n\n## 介绍\n\nC++ 编译器会将你的源文件（包含用 C++ 编写的程序代码文本）翻译成计算机可以理解并运行的机器码。不同的\
  \ C++ 编译器运行在 Microsoft Windows、macOS 和 Linux 操作系统上，但它们都遵循 C++ 国际标准，因此如果你用 C++ 编写程序代码，你应该能够在任何平台上编译并运行你的应用程序。\n\
  \n本章提供了在 Windows、macOS 和 Linux 平台上下载和安装 C++ 编译器的链接。它演示了如何在各个平台的命令行中编辑、编译和运行一个简单的\
  \ C++ 应用程序。然后简要查看了集成开发环境 (IDE) 的使用，并展示了 IDE 为 C++ 开发者提供的优势。有很多 IDE 可用，因此本章仅介绍了如何使用其中一个。本书的其余部分假设你在命令行上编译和运行程序。\n\
  \n## 查看一个简单的 C++ 程序\n\n使用任何文本编辑器（如 Windows 记事本、macOS 文本或 Linux vi）创建一个名为 `hello.cpp`\
  \ 的纯文本文件，包含以下 C++ 代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
  \ main()\n{\n    for (int i = 1; i <= 5; i++)\n    {\n        cout << i << \" Hello,\
  \ world!\" << endl;\n    }\n}\n```\n\n## 在 Microsoft Windows 上使用 C++\n\n在 Windows\
  \ 平台上，C++ 编译器是一个名为 `CL` 的实用程序，你可以在特殊命令窗口的命令行中运行它。\n\n要安装 `CL`，请遵循以下步骤：\n\n1. 进入\
  \ [`https://visualstudio.microsoft.com/downloads/#build-tools-for-visual-studio-2022`](https://visualstudio.microsoft.com/downloads/#build-tools-for-visual-studio-2022)。\n\
  2. 向下滚动到 Build Tools for Visual Studio 并点击 Download 按钮。\n   安装程序将下载到你的计算机上。\n3.\
  \ 运行安装程序以安装 `CL` 及其工具。\n\n\n\n\n\n你必须在特殊的命令窗口中运行 `CL`。左点击屏幕底部的“开始”按钮。向下滚动到 `Visual\
  \ Studio 2022` 文件夹，点击文件夹右侧的向下箭头展开文件夹内容。左点击 `Developer Command Prompt for VS 2022`\
  \ 以打开一个专门为运行 `CL` 设置的命令窗口。在该窗口的命令行中，单行输入以下命令：\n\n```bash\ncl /EHsc /std:c++20 hello.cpp\
  \ /link /out:hello.exe\n```\n\n该命令编译源文件并生成可执行文件 `hello.exe`。要运行该可执行文件，请输入以下命令：\n\
  \n```bash\nhello\n```\n\n在随后的章节中，应用程序可能由多个源文件组成。这时，你不再指定像 `hello.cpp` 这样的单个源文件，而是告诉\
  \ `CL` 编译目录中所有以 `.cpp` 结尾的源文件。例如：\n\n```bash\ncl /EHsc /std:c++20 *.cpp /link /out:books.exe\n\
  ```\n\n这些示例命令包含了 `/std:c++20` 参数，用于指定使用 2020 版本的 C++ 标准。你应该可以通过指定 `/std:c++14` 或\
  \ `/std:c++17` 使用较早版本的 C++ 来编译本书的示例。\n\n`/link` 选项表示下一个选项是用于`链接器`（linkage editor）的，这是一个将编译器的输出合并为可执行程序的工具。`/out`\
  \ 参数告诉链接器可执行程序的名称。\n\n`/EHsc` 告诉编译器如何生成处理异常（即运行时错误）的代码。异常处理将在第 9 章中简要介绍。\n\n![Tip](img/tip.png)\
  \ 如需了解如何在命令行中编译和运行 C++ 程序的步骤，请访问 [`https://learn.microsoft.com/en-us/cpp/build/walkthrough-compiling-a-native-cpp-program-on-the-command-line`](https://learn.microsoft.com/en-us/cpp/build/walkthrough-compiling-a-native-cpp-program-on-the-command-line)。有关\
  \ `CL` 编译器选项的描述，请访问 [`https://learn.microsoft.com/en-us/cpp/build/reference/compiler-options-listed-alphabetically`](https://learn.microsoft.com/en-us/cpp/build/reference/compiler-options-listed-alphabetically)。\n\
  \n## 在 Apple macOS 上使用 C++\n\n在 macOS 上，你可以使用 `Clang` C++ 编译器。有关如何安装编译器的说明，请访问 [`https://osxdaily.com/2023/05/02/how-install-gcc-mac`](https://osxdaily.com/2023/05/02/how-install-gcc-mac)。\n\
  \n安装编译器后，进入你存储源文件 `hello.cpp` 的文件夹，并在 Terminal 窗口中输入以下命令：\n\n```bash\ng++ -std=c++0x\
  \ -o hello hello.cpp\n```\n\n该命令运行 C++ 编译器编译源文件并生成可执行文件 `hello`。要运行该可执行文件，请输入以下命令：\n\
  \n```bash\n./hello\n```\n\n在随后的章节中，应用程序可能由多个源文件组成。这时，你不再指定像 `hello.cpp` 这样的单个源文件，而是告诉\
  \ `g++` 编译目录中所有以 `.cpp` 结尾的源文件。例如：\n\n```bash\ng++ -std=c++20 -o books *.cpp\n```\n\
  \n这些示例命令包含了 `-std:c++20` 参数，用于指定使用 2020 版本的 C++ 标准。你应该可以通过指定 `-std=c++11` 或 `-std=c++0x`\
  \ 使用早于 2011 年的版本编译本书的示例。`-o` 参数指定可执行程序的名称。\n\n## 在 Linux 上使用 C++\n\n在 Linux 上，你可以使用\
  \ `GNU` C++ 编译器。有关如何安装编译器的说明，请访问 [`www.cherryservers.com/blog/how-to-install-gcc-on-ubuntu`](https://www.cherryservers.com/blog/how-to-install-gcc-on-ubuntu)。\n\
  \n安装编译器后，进入你存储源文件 `hello.cpp` 的文件夹。在 Terminal 窗口中输入以下命令：\n\n```bash\ng++ -std=c++20\
  \ -o hello hello.cpp\n```\n\n该命令运行 C++ 编译器编译源文件并生成应用程序 `hello`。要运行该可执行文件，请输入以下命令：\n\
  \n```bash\n./hello\n```\n\n在随后的章节中，应用程序可能由多个源文件组成。这时，你不再指定像 `hello.cpp` 这样的单个源文件，而是告诉\
  \ `g++` 编译目录中所有以 `.cpp` 结尾的源文件。例如：\n\n```bash\ng++ -std=c++20 -o books *.cpp\n```\n\
  \n这些示例命令包含了 `-std=c++20` 或 `-std=c++2a` 参数，用于指定使用 2020 版本的 C++ 标准。你应该可以通过指定 `-std=c++11`\
  \ 或 `-std=c++0x` 使用早于 2011 年的版本编译本书的示例。`-o` 参数指定可执行程序的名称。\n\n## 使用集成开发环境\n\n`IDE`\
  \ 是一种结合了语法感知代码编辑器、编译器、调试器以及其他其他工具的应用程序。许多 `IDE` 是跨平台的——它们有不同的版本。\n\n\n\n\n\n当你编写应用程序时，你需要指定你想要使用一个或多个称为\
  \ `variables`（变量）的存储桶。每个计算机存储桶同时只能存放一个值。变量简单来说就是一个带有关联名称的存储桶。\n\n你可以向你的 `variables`\
  \ 中放入许多不同类型的值。例如，你可以向存储桶中放入数字，也可以向存储桶中放入一个字符串。（然而，每个存储桶包含一种特定类型的数据——你不能将数字放入一个专为字符串设计的存储桶中。）至于数字，它们可以是\
  \ `integers`（整数，即正整数、负整数和 0），也可以是带有小数点的数字，例如 3.11 或 10.0，这些数字（由于各种原因）被称为 `floating-point\
  \ numbers`（浮点数）。\n\n![记住这一点](img/remember.png) `floating-point number` 一词是指带有小数点且小数点右侧有内容的数字（即使右侧只是一个\
  \ 0）。当你看到 `floating point`（浮点）这个词时，可以通过关注名称中的 `point`（点）这个词来记住它的含义——当你看到 `point`\
  \ 时，就想小数点。\n\n### 创建整数变量\n\n在你的 C++ 应用程序中，你可以轻松地编写一行代码创建一个变量。虽然变量在运行应用程序之前实际上并没有被创建，但人们通常将这个过程称为\
  \ `creating a variable`。变量有三个方面：\n\n*   **Name（名称）：** 每个变量都必须有一个名称。在你的应用程序中，你通过这个名称引用变量。例如，你可能有一个名为\
  \ `count` 的变量，可能有一个名为 `LastName` 的变量。\n*   **Type（类型）：** 创建变量时，你必须指定该变量可以包含的值类型。例如，一个变量可以包含一个整数，另一个变量可以包含一个字符。在你的应用程序为变量选择好类型后，你只能向变量中放入该类型的值。\n\
  *   **Value（值）：** 在任何时刻，一个简单的变量都包含单个值。（第 8 章 描述了可以包含多个值的 `array`（数组）变量。）例如，整数变量可以包含数字\
  \ `10`，字符变量可以包含字符 `a`。\n\n当你指定变量的类型和名称时，你就是在 `declare`（声明）一个变量。这被称为 `variable declaration`（变量声明）。\n\
  \n这里显示的 `SimpleVariable` 示例代码演示了如何创建一个变量：\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main()\n{\nint mynumber;\nmynumber = 10;\ncout << mynumber\
  \ << endl;\nreturn 0;\n}\n```\n\n这是一个你可以运行的完整应用程序。\n\n仔细观察这段代码。记住，计算机从 `main()`\
  \ 之后的大括号内的代码开始，并逐行执行代码。\n\n`main` 内部的第一行看起来这样：\n\n```cpp\nint mynumber;\n```\n\n\
  当你声明变量时，你指定的第一个变量可以包含的内容的类型。在这里，你使用了 `int` 这个词。这个词是 C++ 中 `integer`（整数）的单词。因此，你声明的变量可以包含一个整数。接下来是变量的名称。这个变量名为\
  \ `mynumber`。然后用分号结束变量声明。\n\n下一行看起来这样：\n\n```cpp\nmynumber = 10;\n```\n\n这一行将值 `10`\
  \ 放入变量中。因为你已经知道该变量可以包含整数，所以你被放入 `10`，因为它是一个整数。如果你尝试向变量中放入整数以外的值，编译器将给你一条错误消息。编译器确保你只向变量中放入相同类型的值。当然，你注意到该语句以分号结束。在\
  \ C++ 中，每条语句都以分号结束。\n\n![记住这一点](img/remember.png) 要向变量放入值，你输入变量的名称、等号（周围是可选空格）和值。用分号结束行。这行代码是一个\
  \ `assignment statement`（赋值语句）。或者你可以说你正在 `setting`（设置）变量的值。\n\n下一行是这一句：\n\n```cpp\n\
  cout << mynumber << endl;\n```\n\n这是一个 `cout` 语句，意味着它在控制台上写入某些内容。这段代码告诉计算机在控制台上写入\
  \ `mynumber` 的值。上一行代码在存储桶中放入了 `10`，所以这一行在控制台上打印了 `10`。`endl` 的意思是“end line”（换行），所以\
  \ `10` 独占一行打印。当你运行应用程序时，你会看到这个：\n\n```\n10\n```\n\n![提示](img/tip.png) 可以可以这样想：当你输入变量名称时，你是在访问该变量。例外情况是变量名称出现在等号左侧。在这种情况下，你是在设置变量。你可以对变量做两件事：\n\
  \n*   **Setting the variable（设置变量）：** 你可以设置一个变量，这意味着你可以向存储桶放入一个值。\n*   **Retrieving\
  \ the value（获取值）：** 你可以获取变量内部的值。当你这样做时，该值仍然留在变量内部。\n\n![记住这一点](img/remember.png)\
  \ 当你获取变量中的值时，你并没有将其从变量中移除。该值仍在变量内部。\n\n### 声明多个变量\n\n如果你想声明多个变量，可以在一个语句中完成。例如，如果你想声明名为\
  \ `monica`、`rachel` 和 `phoebe` 的整数变量，可以使用以下代码：\n\n```cpp\nint monica, rachel, phoebe;\n\
  ```\n\n然后你可以为它们单独赋值：\n\n```cpp\nmonica = 10;\nrachel = 20;\nphoebe = 30;\n```\n\n\
  ![记住这一点](img/remember.png) 当你运行应用程序时，计算机按照它们出现的顺序执行语句。因此，在前面的代码中，计算机首先创建存储桶。然后将\
  \ `10` 放入 `monica`。接下来，`rachel` 得到 `20`。最后，`phoebe` 得到 `30`。\n\n### 修改值\n\n虽然变量一次只能包含一个值，但你仍然可以改变它的内容。向变量放入另一个值后，它会忘记之前的值。\n\
  \n你像最初放入值一样向变量放入另一个值。仔细观察 `ChangeVariable` 示例的代码：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main()\n{\nint mynumber;\nmynumber = 10;\ncout << mynumber\
  \ << endl;\nmynumber = 20;\ncout << mynumber << endl;\nreturn 0;\n}\n```\n\n![记住这一点](img/remember.png)\
  \ 当你看到单独的等号时，左侧是接收右侧值的变量。\n\n### 将一个变量赋值给另一个\n\n因为你对变量只能直接做两件事——放入内容和获取值——将一个变量赋值给另一个是获取一个变量的值并将其放入另一个的简单过程。这个过程通常被称为从一个变量到另一个变量的\
  \ `copying`（复制）。例如，如果你有两个整数变量——假设为 `start` 和 `finish`——你想将 `start` 的值复制到 `finish`，你将使用如下代码：\n\
  \n```cpp\nfinish = start;\n```\n\n![警告](img/warning.png) 不要让语言误导你。尽管你想将 `start`\
  \ 的值复制到 `finish`，但注意你首先输入的是 `finish`，然后是等号，最后是 `start`。等号左侧是*接收*值的变量。\n\n![记住这一点](img/remember.png)\
  \ 当你将一个变量的值复制到另一个变量时，这两个变量必须类型相同。例如，你不能将字符串变量的值复制到整数变量中。如果你尝试这样做，编译器会发出错误消息。\n\n\
  \n\n\n\n在计算机运行这条复制语句后，两个变量将持有相同的值。这里显示的 `CopyVariable` 代码是一个将值从一个变量拷贝到另一个变量的示例：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int start\
  \ = 50;\n    int finish;\n    finish = start;\n    cout << finish << endl;\n   \
  \ return 0;\n}\n```\n\n### 初始化变量\n\n当你创建一个变量时，它起初是一个空的存储桶。但在它能够发挥太大用处之前，你需要向其中放入一个值。\n\
  \n![Warning](img/warning.png) 如果你尝试在实际放入一个值之前检索变量的内容，你最终将得到计算机人员亲切地称为“不可预测的结果”。因此，在尝试检索变量内容之前，请务必确保你已经在变量内部放置了值，这个过程被称为`初始化变量`。\n\
  \n你可以通过两种方式初始化变量。第一种是声明变量然后给它赋一个值，这需要两行代码：\n\n```cpp\nint mynumber;\nmynumber =\
  \ 153;\n```\n\n但另一种方法要快一点。它看起来像这样：\n\n```cpp\nint mynumber = 153;\n```\n\n这种方法将两种策略合并成一个整洁的小包，供你随地需要使用。你在书中会看到这两种方式初始化的变量。\n\
  \n### 为自己起一个很棒的名字\n\n每个变量都需要一个名字。但你可以使用哪些名字？虽然你可以自由使用如 `Fred`、`Zanzibar` 或 `Supercount1000M`\
  \ 等名称，但 C++ 对允许使用的名称是有限制的。\n\n![Warning](img/warning.png) 虽然大多数 C++ 代码都是小写的，但你可以自由在变量名中使用大写字母。然而，C++\
  \ 区分这两种形式。编译器会将这两个名称视为两个不同的变量，这使得 C++ 是区分大小写的。\n\n以下是你在创建变量名时需要遵循的规则：\n\n- **字符：**\
  \ 你可以在变量名中使用任何大写字母、小写字母、数字或下划线。变量名中不允许出现符号（如空格或键盘数字键上方的符号）。唯一的限制是：\n    - 第一个字符不能是数字。\n\
  \    - 变量名不能完全由数字组成。\n- **长度：** 如今大多数编译器都允许你在变量名中使用任意数量的字符。选择足够长以具有意义但又足够短以方便你输入的变量名。大多数人倾向于五到十个字符左右。\n\
  \n允许变量名的示例有 `Count`、`current_name`、`address_1000` 和 `LookupAmount`。\n\n### 操作整数变量\n\
  \n你可以`操作`变量，这意味着你可以对它们的值进行算术运算。你可以轻松地进行加、减、乘、除。你用于算术运算的字符如下：\n\n| 字符 | 算术运算 |\n\
  | --- | --- |\n| `+` | 加法 |\n| `–` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n\n然而，你还可以对整数进行另一种操作，这与余数和除有关。例如，如果你将\
  \ 16 除以 3，整数结果是 `5 余 1`。这个余数有时被称为`模`（模）。\n\n![Remember](img/remember.png) 在处理整数变量时，记住你可以对变量做的两件基本事情：你可以向变量中放入一个值，也可以从变量中检索一个值。因此，在处理整数变量时，核心思想是：你可以检索它的值，对其进行算术运算，然后打印答案或将其存回同一个变量或另一个变量中。\n\
  \n### 相加整数变量\n\n如果你想两个两个整数变量，请使用 `+` 符号。你可以打印结果，也可以将其放回变量。\n\n`AddInteger` 示例相加两个变量（`start`\
  \ 和 `time`），然后答案打印到控制台。加法运算已加粗显示。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main()\n{\n    int start;\n    int time;\n    start = 37;\n    time\
  \ = 22;\n    cout << start + time << endl;\n    return 0;\n}\n```\n\n![Remember](img/remember.png)\
  \ 这段代码从两个名为 `start` 和 `time` 的整数变量开始。它将 `start` 设置为 `37` 并将 `time` 设置为 `22`。最后，它相加这两个变量（得到\
  \ `59`）并打印结果。当你看到 `start + time` 时，`+` 是告诉要执行什么动作的`operator`（运算符），而 `start` 和 `time`\
  \ 是运算符作用的`operand`（操作数）。\n\n你也可以将数字本身加上变量。以下行向 `start` 增加了 `5` 并打印结果：\n\n```cpp\n\
  cout << start + 5 << endl;\n```\n\n或者你可以将值存回另一个变量，如下片段所示：\n\n```cpp\ntotal = start\
  \ + 5;\ncout << total << endl;\n```\n\n这个示例将 `5` 加到 `start` 并新值保存在 `total` 中。\n\n\
  ![Warning](img/warning.png) 当你使用如 `total = start + 5` 的代码时，你并没有改变 `start` 的值。`start`\
  \ 变量保持与之前相同。\n\n当你使用如 `total = start + 5` 的代码时，你并没有改变 `start` 的值。`start` 变量保持与之前相同。\n\
  \nC++ 提供了一个快捷方法来为变量增加一个值并将其存回 total 中：\n\n```cpp\ntotal += 5;\n```\n\n这意味着 `total`\
  \ 现在比之前的增加了 `5`。行 `total = total + 5` 与 `total += 5;` 相同。对于这一行，我们会说：“Total 加等于五”。\n\
  \n![Tip](img/tip.png) 将 `total += 5` 仅仅视为 `total = total + 5` 的快捷方式。\n\n你也可以对其他变量使用\
  \ `+=` 符号。例如，如果你想将 `time` 中的值加上 `total` 中的值并将结果存回 `total`，你可以这样做：\n\n```cpp\ntotal\
  \ = total + time;\n```\n\n或者你可以使用这个快捷方式：\n\n```cpp\ntotal += time;\n```\n\n如果你只是给变量加\
  \ 1，这被称为`变量递增`，你可以使用更短的快捷方式：\n\n```cpp\ntotal++;\n```\n\n这等同于 `total = total + 1;`\
  \ 或 `total += 1`。\n\n### 减去整数变量\n\n任何涉及整数变量加法的操作你都可以用减法完成。例如，你可以减两个变量，如 `SubtractVariable`\
  \ 示例所示：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n  \
  \  int final;\n    int time;\n    final = 28;\n    time = 18;\n    cout << final\
  \ - time << endl;\n    return 0;\n}\n```\n\n当此程序运行时，控制台显示数字 `10`，即 `28 – 18`。记住，和加法一样，`final`\
  \ 或 `time` 的值实际上都没有改变。计算机只是计算出差并打印在控制台上。\n\n你也可以从变量中减去一个数字，像之前一样，你仍然没有改变变量的值，如下例：\n\
  \n```cpp\ncout << final - 5 << endl;\n```\n\n你可以从一个变量减去另一个变量并将结果保存在第三个变量中：\n\n```cpp\n\
  start = final - time;\n```\n\n你可以通过减法改变变量中的值，如下行代码所示，它从 `final` 中减去 `time`并将结果存回\
  \ `final`：\n\n```cpp\nfinal -= time;\n```\n\n\n\n\n\n`final = final - time;`\n\n\
  或者你可以使用快捷符号来完成相同的操作：\n\n`final -= time;`\n\n最后，与加法一样，你有一个快捷操作的快捷方式。如果你只想减去 1，可以简单使用两个减号，如下所示：\n\
  \n`Final—  —;`\n\n这一行读作 \"minus minus\"。`--` 是递减运算符。当应用于变量时，它被称为变量递减。\n\n### 整数变量相乘\n\
  \n在 C++ 中执行乘法时，使用星号（`*`）。与加法和减法一样，你可以乘以两个变量，也可以将一个变量乘以一个数字。你可以打印结果，也可以将其保存在变量中。例如，你可以将两个变量相乘的结果打印到控制台：\n\
  \n```\ncout << length * width << endl;\n```\n\n或者你可以将一个变量乘以一个数字，如下行所示：\n\n```\n\
  cout << length * 5 << endl;\n```\n\n正如加法和减法一样，你可以将两个变量相乘的结果保存在第三个变量中：\n\n```\narea\
  \ = length * width;\n```\n\n你还可以使用乘法来修改变量的值，如下：\n\n```\ntotal = total * multiplier;\n\
  ```\n\n或者使用快捷符号：\n\n```\ntotal *= multiplier;\n```\n\n并且（和之前一样）你也可以对一个数字执行相同的操作：\n\
  \n```\ntotal = total * 25;\n```\n\n或者这个：\n\n```\ntotal *= 25;\n```\n\n![Warning](img/warning.png)\
  \ 注意，没有使用 `*` 运算符将一个值乘以 1 或其本身。因此，如果你输入 `total;`，编译器将报错。\n\n### 整数变量除法\n\n虽然整数变量的加法、减法和乘法非常直观，但除法要复杂一些。主要原因是对于整数值，有时你无法进行整除。\n\
  \n从纯整数的角度来看，21 除以 5 的结果是 4 余 1。这就是计算机处理整数算术的方式。它会得到两个不同的答案：商和余数。剩余的部分就是余数。\n\n因为一个除法问题可能两个不同的答案，C++\
  \ 使用两个不同的运算符来计算这两个答案。\n\n要找到商，请使用斜杠（`/`）。将此字符看作普通的除法运算符，因为当你处理可以整除的整数值时，这个运算符会给你正确的答案。因此，`10\
  \ / 2` 得到 `5`，正如你预期的那样。大多数人直接将其称为除法运算符。\n\n要找到余数，请使用百分号（`%`）。这通常被称为模运算符。\n\n接下来显示的\
  \ `DivideInteger` 接收两个数字并打印它们的商和余数。然后它对另一对数字再次执行此操作。第一对没有余数，但第二对有。\n\n```cpp\n#include\
  \ <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int first, second;\n\
  \    cout << \"Dividing 28 by 14.\" << endl;\n    first = 28;\n    second = 14;\n\
  \    cout << \"Quotient \" << first / second\n    << endl;\n    cout << \"Remainder\
  \ \" << first % second\n    << endl;\n    cout << \"Dividing 32 by 6.\" << endl;\n\
  \    first = 32;\n    second = 6;\n    cout << \"Quotient \" << first / second\n\
  \    << endl;\n    cout << \"Remainder \" << first % second\n    << endl;\n    return\
  \ 0;\n}\n```\n\n当你运行此应用程序时，你会看到以下输出：\n\n```\nDividing 28 by 14.\nQuotient 2\nRemainder\
  \ 0\nDividing 32 by 6.\nQuotient 5\nRemainder 2\n```\n\n![Tip](img/tip.png) 这代码除了除法技巧外，还使用了几个新技巧。你可以将字符串和数字的输出合并到一个\
  \ `cout` 语句中。你在四个 `cout` 语句中这样做了。这是可以的，只要在它们之间使用 `<<` 符号将它们连接起来。\n\n```\nmyRemainder\
  \ = first % second;\n```\n\n![Tip](img/tip.png) 可用以下快捷符号：\n\n```cpp\nint first =\
  \ 30;\nint second = 33;\nfirst /= 5;\nsecond %= 5;\ncout << first << \" \" << second\
  \ << endl;\n```\n\n## 使用字符变量\n\n你可以拥有的另一种类型的变量是字符变量。字符变量可以存储单个——只有一个字符，C++ 将其存储为数字。它存储\
  \ –127 到 128 之间（`char` 或 `signed char`）或 0 到 255 之间（`unsigned char`）的值。通常，字符是任何可以输入的内容，例如字母表、数字或你在计算机键盘上看到的其他符号，但字符也可以存储\
  \ ASCII 表中的不可打印值（参见 [`https://en.cppreference.com/w/cpp/language/ascii`](https://en.cppreference.com/w/cpp/language/ascii)）。这些不可打印字符中，是一些控制字符（之所以这样命名是因为它们控制屏幕上文本的显示），例如制表符、回车等。\n\
