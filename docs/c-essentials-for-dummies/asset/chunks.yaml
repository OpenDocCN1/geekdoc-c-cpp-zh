    ```\n\n现在考虑这种情况：如果你在堆上有一个对象，它没有名称。你通过指向它的指针变量来访问它。但如果代码当前正在某个对象的成员函数内部执行，该如何引用对象本身？\n\
    \n### 定义 this 指针\n\n`this` 包含四个主要部分。首先是 `Cheese` 类的定义。该类包含几个成员函数。\n\n接下来是 `OneMoreCheeseGone()`\
    \ 以及它修改的全局变量。\n\n接下来是 `Cheese` 的实际成员函数。（你必须将这些函数放在 `OneMoreCheeseGone()` 之后，因为它们调用了它。如果你为\
    \ `OneMoreCheeseGone()` 使用函数原型，则顺序无关。）\n\n最后，`main()` 创建了两个 `Cheese` 实例。当你运行 列表\
    \ 7-6 中的应用程序时，你会看到以下输出：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nclass Cheese {\npublic:\n    string status;\n    void eat();\n    void rot();\n\
    };\n\nint CheeseCount;\n\nvoid OneMoreCheeseGone(Cheese *Block) {\n    CheeseCount--;\n\
    \    Block->status = \"Gone\";\n}\n\nvoid Cheese::eat() {\n    cout << \"Eaten\
    \ up! Yummy\" << endl;\n    OneMoreCheeseGone(this);\n}\n\nvoid Cheese::rot()\
    \ {\n    cout << \"Rotted away! Yuck\" << endl;\n    OneMoreCheeseGone(this);\n\
    }\n\nint main() {\n    Cheese *asiago = new Cheese();\n    Cheese *limburger =\
    \ new Cheese();\n    CheeseCount = 2;\n    asiago->eat();\n    limburger->rot();\n\
    \    cout << endl;\n    cout << \"Cheese count: \" << CheeseCount << endl;\n \
    \   cout << \"asiago: \" << asiago->status << endl;\n    cout << \"limburger:\
    \ \" << limburger->status << endl;\n    return 0;\n}\n```\n\n`this` 变量始终指向当前对象。因此，如果代码执行发生在某个对象的成员函数内部，并且你想调用\
    \ `OneMoreCheeseGone()`，则使用 `this` 传递当前对象。\n\n"
- fmt: "\nWhen you create a new instance of a class, you may want to do some basic\
    \ object setup. Suppose you have a class called `Apartment`, with a private property\
    \ called `NumberOfOccupants`.\n\nWhen you create a new instance of `Apartment`,\
    \ you probably want to start `NumberOfOccupants` at `0`. The best way to do this\
    \ is by adding a special member function, a `constructor`, to your class. This\
    \ function has a line of code such as the following:\n\n```\nNumberOfOccupants\
    \ = 0;\n```\n\nWhenever you create a new instance of the class `Apartment`, the\
    \ computer first calls this constructor for your new object, thereby setting `NumberOfOccupants`\
    \ to `0`. Think of the constructor as an `initialization function:` The computer\
    \ calls it when you create a new object.\n\nTo write a constructor, you add it\
    \ as another member function to your class, and make it public. You name the constructor\
    \ the same as your class. For the class `Apartment`, you name the constructor\
    \ `Apartment()`. The constructor has no return type, not even `void`. You can\
    \ have parameters in a constructor (see \"[Adding parameters to constructors](#c07.xhtml_c07-sec-0026),\"\
    \ later in this chapter).\n\n### Ending with destructors\n\nWhen you delete an\
    \ instance of a class, you may want some `cleanup` code to straighten things out\
    \ before the object memory is released. For example, your object may have properties\
    \ that are pointers to other objects. It's essential to delete those other objects.\
    \ You put cleanup code in a special member function called a destructor. A `destructor`\
    \ is a finalization function that the computer calls before it deletes your object.\n\
    \nThe destructor gets the same name as the class, except it has a tilde (`~`)\
    \ at the beginning of it. (The tilde is usually in the upper-left corner of the\
    \ keyboard.) For a class called `Squirrel`, the destructor would be `~Squirrel()`.\
    \ The destructor doesn't have a return type, not even `void`, because you can’t\
    \ return anything from a destructor (the object is gone, after all). You just\
    \ start with the function name and no parameters. The next section, \"[Sampling\
    \ constructors and destructors](#c07.xhtml_c07-sec-0024),” shows an example that\
    \ uses both constructors and destructors.\n\n![Tip](images/tip.png) Constructors\
    \ and destructors are a way of life for C++ programmers. Nearly every class has\
    \ a constructor, and many also have a destructor.\n\n### Sampling constructors\
    \ and destructors\n\nThe `WalnutClass` example, shown in [Listing 7-7](#c07.xhtml_c07-fea-0007),\
    \ uses a constructor and a destructor. This application involves two classes,\
    \ the main one called `Squirrel`, which demonstrates the constructor and destructor,\
    \ and one called `Walnut`, which is used by the `Squirrel` class.\n\n[LISTING\
    \ 7-7](#c07.xhtml_rc07-fea-0007) Initializing and Finalizing with Constructors\
    \ and Destructors\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass\
    \ Walnut {\npublic:\n    int Size;\n};\n\nclass Squirrel {\nprivate:\n    Walnut\
    \ *MyDinner;\npublic:\n    Squirrel();\n    ~Squirrel();\n};\n\nSquirrel::Squirrel()\
    \ {\n    cout << \"Starting!\" << endl;\n    MyDinner = new Walnut;\n    MyDinner->Size\
    \ = 30;\n}\n\nSquirrel::~Squirrel() {\n    cout << \"Cleaning up my mess!\" <<\
    \ endl;\n    delete MyDinner;\n}\n\nint main() {\n    Squirrel *Sam = new Squirrel;\n\
    \    Squirrel *Sally = new Squirrel;\n    delete Sam;\n    delete Sally;\n   \
    \ return 0;\n}\n```\n\nThe `Squirrel` class has a property called `MyDinner` that\
    \ is a pointer to a `Walnut` instance. The `Squirrel` constructor creates an instance\
    \ of `Walnut` and stores it in `MyDinner`. The destructor deletes the instance\
    \ of `Walnut`. In `main()`, the code creates two instances of `Squirrel`. Each\
    \ instance gets its own `Walnut` to eat. Each `Squirrel` creates its `Walnut`\
    \ when it starts and deletes the `Walnut` when the `Squirrel` is deleted.\n\n\
    When you run this application, you can see the following lines, which were spit\
    \ up by the `Squirrel` in its constructor and destructor. (You see two lines of\
    \ each because `main()` creates two squirrels.)\n\n```\nStarting!\nStarting!\n\
    Cleaning up my mess!\nCleaning up my mess!\n```\n\n### Adding parameters to constructors\n\
    \nA constructor that has no parameters is called the `default constructor`. But\
    \ like other member functions, constructors allow you to include parameters. When\
    \ you do, you can use these parameters in the initialization process. To use them,\
    \ you list the arguments inside parentheses when you create the object. Because\
    \ constructors have parameters, you can create multiple overloaded constructors\
    \ for a class by varying the number and type of parameters.\n\nSuppose you want\
    \ the `Squirrel` class to have a `name` property. Although you could create an\
    \ instance of `Squirrel` and then set its `name` property, you can specify the\
    \ `name` directly by using a constructor. The constructor's prototype looks like\
    \ this:\n\n```\nSquirrel(string StartName);\n```\n\nThen, you create a new instance\
    \ like so:\n\n```\nSquirrel *Sam = new Squirrel(\"Sam\");\n```\n\nThe constructor\
    \ is expecting a `string`, so you pass a `string` when you create the object.\n\
    \nThe `SquirrelClass` example, shown in [Listing 7-8](#c07.xhtml_c07-fea-0008),\
    \ presents an application that includes parameters.\n\n[LISTING 7-8](#c07.xhtml_rc07-fea-0008)\
    \ Placing Parameters in Constructors\n\n```\n#include <iostream>\n\nusing namespace\
    \ std;\n\nclass Squirrel {\nprivate:\n    string Name;\npublic:\n    Squirrel(string\
    \ StartName);\n    void IsMyName();\n};\n\nSquirrel::Squirrel(string StartName)\
    \ {\n    cout << \"Starting!\" << endl;\n    Name = StartName;\n}\n\nvoid Squirrel::IsMyName()\
    \ {\n    cout << \"My name is \" << Name << endl;\n}\n\nint main() {\n    Squirrel\
    \ *Sam = new Squirrel(\"Sam\");\n    Squirrel *Sally = new Squirrel(\"Sally\"\
    );\n    Sam->IsMyName();\n    Sally->IsMyName();\n    delete Sam;\n    delete\
    \ Sally;\n    return 0;\n}\n```\n\nIn `main()`, you pass a string into the constructors.\
    \ The constructor code takes the `StartName` parameter and copies it to the `Name`\
    \ property. The `IsMyName()` member function writes `Name` to the console.\n\n\
    You can use a special syntax in a constructor to initialize member variables.\
    \ For example, you could have written the constructor for `Squirrel`:\n\n```\n\
    Squirrel::Squirrel(string StartName)\n: Name(StartName)\n{\n    cout << \"Starting!\"\
    \ << endl;\n}\n```\n\n### Building Hierarchies of Classes\n\nWhen you start describing\
    \ classes, you usually discover *hierarchies* of classes. For example, you could\
    \ divide `Vehicle` into car brands, such as `Ford`, `Honda`, and `Toyota`. Then\
    \ you could divide the class `Toyota` into models, such as `Prius`, `Avalon`,\
    \ `Camry`, and `Corolla`. You can create similar groupings of objects for the\
    \ other class hierarchies; your decision depends on how you categorize things\
    \ and how the hierarchy is used. In the hierarchy, `Vehicle` is at the top. This\
    \ class has properties you find in every brand or model of vehicle. For example,\
    \ all vehicles have wheels. How many they have varies, but it doesn't matter at\
    \ this point, because classes don’t have specific values for the properties.\n\
    \nEach brand has certain characteristics that may be unique to it, but each has\
    \ all the characteristics of class `Vehicle`. That’s called *inheritance.* The\
    \ class `Toyota`, for example, has all the properties found in `Vehicle`. And\
    \ the class `Prius` has all the properties found in `Toyota`, which includes those\
    \ inherited from `Vehicle`.\n"
  raw: 'When you create a new instance of a class, you may want to do some basic object
    setup. Suppose you have a class called `Apartment`, with a private property called
    `NumberOfOccupants`.


    When you create a new instance of `Apartment`, you probably want to start `NumberOfOccupants`
    at `0`. The best way to do this is by adding a special member function, a *constructor,*
    to your class*.* This function has a line of code such as the following:


    `NumberOfOccupants = 0;`


    Whenever you create a new instance of the class `Apartment`, the computer first
    calls this constructor for your new object, thereby setting `NumberOfOccupants`
    to `0`. Think of the constructor as an *initialization function:* The computer
    calls it when you create a new object.


    To write a constructor, you add it as another member function to your class, and
    make it public. You name the constructor the same as your class. For the class
    `Apartment`, you name the constructor `Apartment()`. The constructor has no return
    type, not even `void`. You can have parameters in a constructor (see “[Adding
    parameters to constructors](#c07.xhtml_c07-sec-0026),” later in this chapter).


    ### Ending with destructors


    When you delete an instance of a class, you may want some *cleanup* code to straighten
    things out before the object memory is released. For example, your object may
    have properties that are pointers to other objects. It''s essential to delete
    those other objects. You put cleanup code in a special member function called
    a destructor. A *destructor* is a finalization function that the computer calls
    before it deletes your object.


    The destructor gets the same name as the class, except it has a tilde (`~`) at
    the beginning of it. (The tilde is usually in the upper-left corner of the keyboard.)
    For a class called `Squirrel`, the destructor would be `~Squirrel()`. The destructor
    doesn''t have a return type, not even `void`, because you can’t return anything
    from a destructor (the object is gone, after all). You just start with the function
    name and no parameters. The next section, “[Sampling constructors and destructors](#c07.xhtml_c07-sec-0024),”
    shows an example that uses both constructors and destructors.


    ![Tip](images/tip.png) Constructors and destructors are a way of life for C++
    programmers. Nearly every class has a constructor, and many also have a destructor.


    ### Sampling constructors and destructors


    The `WalnutClass` example, shown in [Listing 7-7](#c07.xhtml_c07-fea-0007), uses
    a constructor and a destructor. This application involves two classes, the main
    one called `Squirrel`, which demonstrates the constructor and destructor, and
    one called `Walnut`, which is used by the `Squirrel` class.


    [LISTING 7-7](#c07.xhtml_rc07-fea-0007) Initializing and Finalizing with Constructors
    and Destructors


    `#include <iostream>`


    `using namespace std;`


    `class Walnut {`


    `public:`


    `int Size;`


    `};`


    `class Squirrel {`


    `private:`


    `Walnut *MyDinner;`


    `public:`


    `Squirrel();`


    `~Squirrel();`


    `};`


    `Squirrel::Squirrel() {`


    `cout << "Starting!" << endl;`


    `MyDinner = new Walnut;`


    `MyDinner->Size = 30;`


    `}`


    `Squirrel::~Squirrel() {`


    `cout << "Cleaning up my mess!" << endl;`


    `delete MyDinner;`


    `}`


    `int main() {`


    `Squirrel *Sam = new Squirrel;`


    `Squirrel *Sally = new Squirrel;`


    `delete Sam;`


    `delete Sally;`


    `return 0;`


    `}`


    The `Squirrel` class has a property called `MyDinner` that is a pointer to a `Walnut`
    instance. The `Squirrel` constructor creates an instance of `Walnut` and stores
    it in `MyDinner`. The destructor deletes the instance of `Walnut`. In `main()`,
    the code creates two instances of `Squirrel`. Each instance gets its own `Walnut`
    to eat. Each `Squirrel` creates its `Walnut` when it starts and deletes the `Walnut`
    when the `Squirrel` is deleted.


    When you run this application, you can see the following lines, which were spit
    up by the `Squirrel` in its constructor and destructor. (You see two lines of
    each because `main()` creates two squirrels.)


    `Starting!`


    `Starting!`


    `Cleaning up my mess!`


    `Cleaning up my mess!`


    ### Adding parameters to constructors


    A constructor that has no parameters is called the *default constructor*. But
    like other member functions, constructors allow you to include parameters. When
    you do, you can use these parameters in the initialization process. To use them,
    you list the arguments inside parentheses when you create the object. Because
    constructors have parameters, you can create multiple overloaded constructors
    for a class by varying the number and type of parameters.


    Suppose you want the `Squirrel` class to have a `name` property. Although you
    could create an instance of `Squirrel` and then set its `name` property, you can
    specify the `name` directly by using a constructor. The constructor''s prototype
    looks like this:


    `Squirrel(string StartName);`


    Then, you create a new instance like so:


    `Squirrel *Sam = new Squirrel("Sam");`


    The constructor is expecting a `string`, so you pass a `string` when you create
    the object.


    The `SquirrelClass` example, shown in [Listing 7-8](#c07.xhtml_c07-fea-0008),
    presents an application that includes all the basic elements of a class with a
    constructor that accepts parameters.


    [LISTING 7-8](#c07.xhtml_rc07-fea-0008) Placing Parameters in Constructors


    `#include <iostream>`


    `using namespace std;`


    `class Squirrel {`


    `private:`


    `string Name;`


    `public:`


    `Squirrel(string StartName);`


    `void WhatIsMyName();`


    `};`


    `Squirrel::Squirrel(string StartName) {`


    `cout << "Starting!" << endl;`


    `Name = StartName;`


    `}`


    `void Squirrel::WhatIsMyName() {`


    `cout << "My name is " << Name << endl;`


    `}`


    `int main()`


    `{`


    `Squirrel *Sam = new Squirrel("Sam");`


    `Squirrel *Sally = new Squirrel("Sally");`


    `Sam->WhatIsMyName();`


    `Sally->WhatIsMyName();`


    `delete Sam;`


    `delete Sally;`


    `return 0;`


    `}`


    In `main()`, you pass a string into the constructors. The constructor code takes
    the `StartName` parameter and copies it to the `Name` property. The `WhatIsMyName()`
    member function writes `Name` to the console.


    You can use a special syntax in a constructor to initialize member variables.
    For example, you could have written the constructor for class `Squirrel`:


    `Squirrel::Squirrel(string StartName)`


    `: Name(StartName)`


    `{`


    `cout << "Starting!" << endl;`


    `}`


    In the constructor header, append a list of the initializations after a colon.
    Each initialization consists of the member variable name followed by its initial
    value enclosed in parentheses. If there is more than one initialization, separate
    them with commas. In the preceding code, by initializing member variable `Name`
    with the value of parameter `StartName`, you no longer need the assignment statement
    for `Name`.


    ## Building Hierarchies of Classes


    When you start describing classes, you usually discover *hierarchies* of classes.
    For example, you could divide `Vehicle` into car brands, such as `Ford`, `Honda`,
    and `Toyota`. Then you could divide the class `Toyota` into models, such as `Prius`,
    `Avalon`, `Camry`, and `Corolla`. You can create similar groupings of objects
    for the other class hierarchies; your decision depends on how you categorize things
    and how the hierarchy is used. In the hierarchy, class `Vehicle` is at the top.
    This class has properties you find in every brand or model of vehicle. For example,
    all vehicles have wheels. How many they have varies, but it doesn''t matter at
    this point, because classes don’t have specific values for the properties.


    Each brand has certain characteristics that may be unique to it, but each has
    all the characteristics of class `Vehicle`. That’s called *inheritance.* The class
    `Toyota`, for example, has all the properties found in `Vehicle`. And the class
    `Prius` has all the properties found in `Toyota`, which includes those inherited
    from `Vehicle`.'
