    \ `*` 重载了乘法运算符，允许你使用 `*` 乘以两个 `Fraction` 对象，例如 `two_thirds*three_fourths`。该函数返回一个表示乘积的\
    \ `Fraction` 对象。运算符函数 `<<` 允许你在 `cout` 语句中以所需的格式输出 `Fraction` 对象。`<<` 运算符函数始终返回输出流的引用。这允许在单个\
    \ `cout` 语句中链用运算符以输出多个值。\n\n输出是\n`two thirds is 2/3 = 0.666667`\n`three fourths\
    \ is 3/4 = 0.75`\n`their product is 6/12 = 0.5`\n\n## STL Vectors\n\n标准模板库 (STL)\
