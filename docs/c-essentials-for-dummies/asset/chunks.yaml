    Chapter 7


    # Working with Classes


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Seeing how objects and classes work**


    ![Bullet](images/check.png) **Using a class**


    ![Bullet](images/check.png) **Handling constructors and destructors**


    ![Bullet](images/check.png) **Creating class hierarchies**


    Back in the early 1990s, the big buzzword in the computer world was *object-oriented.*
    For anything to sell, it had to be object-oriented. Programming languages were
    object-oriented. Software applications were object-oriented. Computers were object-oriented.
    Unfortunately, object-oriented was simply a cool catchphrase at the time that
    meant little in real terms. Often, ideas begin poorly formed and gain resolution
    as people work to implement the idea in the real world.


    Now it’s possible to explore what object-oriented *really* means and how you can
    use it to organize your C++ applications. In this chapter, you discover object-oriented
    programming and see how you can do it in C++. Although people disagree on the
    strict definition of *object-oriented,* in this book it means “programming with
    objects and classes.”


    ## Understanding Objects and Classes


    When describing what objects can do, you carefully write it from the perspective
    of the object itself, not from the perspective of the person *using* the object.
    A good way to name the capability is to test it by preceding it with the words
    *I can* and see if it makes sense. Thus, because “I can *write on paper*” works
    from the perspective of a pen, the list contains *write on paper* for one of the
    pen’s capabilities.


    But is seeing all the objects in the universe possible, or are some objects hidden?
    Certainly, some objects are physical, like atoms or the dark side of the moon,
    and you can’t see them. But other objects are abstract. For example, you may have
    a credit card account. What is a credit card account, exactly? A credit card account
    is abstract because you can’t touch it — it has no physical presence. The following
    sections examine various kinds of objects.


    ### Classifying classes and objects


    When you see a pen, you may ask what *class* this *object* belongs to. If you
    then pick up another pen, you see another example of the same class. One class;
    several examples.


    So, when you organize things, you specify a *class,* which is the type of object.
    You can start picking out examples (or *instances*) of the class. Each class may
    have several instances.


    ### Describing properties and behaviors


    If you choose a class, you can describe its characteristics. You’re listing only
    general characteristics for all instances of the class `Pen`. That is, every pen
    has these properties. But the actual values for these properties may vary from
    instance to instance. One pen may have a different ink color from another, but
    both may have the same brand. Nevertheless, they''re both separate instances of
    the class `Pen`.


    All the pens in the class share properties. But the values for these properties
    may differ from pen to pen. When you *instantiate* (build or create) a new `Pen`,
    you follow the list of properties, giving the new pen instance its own values.


    But all these pens have the same *behaviors:*


    *   **Behavior #1:** Write on paper


    *   **Behavior #2:** Break in half


    *   **Behavior #3:** Run out of ink


    Unlike properties, behaviors don''t change from instance to instance. They’re
    the same for each class.


    ![Tip](images/tip.png) When you describe classes to build a computer application
    using a class, you’re modeling. In the preceding examples, you modeled a class
    called `Pen`.


    ### Implementing a class


    To implement a class in C++, you use the keyword `class`. And then you add the
    name of the class, such as `Pen`. You then add an open brace, list your properties
    and behaviors, and end with a closing brace.


    ![Tip](images/tip.png) Most people capitalize the first letter of a class name
    in C++, and if their class name is a word, they don''t capitalize the remaining
    letters. Although you don’t have to follow this rule, many people do. You can
    choose any name for a C++ class provided it isn’t a C++ keyword; it consists only
    of letters, digits, and underscores; and it doesn’t start with a number.


    The `PenClass` example, shown in [Listing 7-1](#c07.xhtml_c07-fea-0001), contains
    a C++ class description that appears inside the `Pen.h` header file. The “[Accessing
    members](#c07.xhtml_c07-sec-0012)” section later in this chapter explains the
    word `public`.


    ![Remember](images/remember.png) You can create several *objects* (also called
    *instances*) of a single class. Each object gets its own properties, which you
    declare in the class. To access the members of an object, you use a period (or
    dot).


    ### Separating member function code


    When you work with functions, you can either make sure that the code to your function
    is positioned before any calls to the function, or you can use a *forward reference,*
    also called a *function prototype* (see [Chapter 4](#c04.xhtml)).'
