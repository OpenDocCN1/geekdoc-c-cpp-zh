    ## Passing Pointer Variables to Functions


    One of the most important uses for pointers is this: If a pointer points to a
    variable, you can pass the pointer to a function, and the function can modify
    the original variable. This functionality lets you write functions that can actually
    modify the variables passed to them. Even though this section discusses raw pointers,
    the same techniques work with smart pointers.


    Normally, when you call a function and you pass a few variables to the function,
    the computer just grabs the values out of the variables and passes those values.
    Take a close look at the `VariablePointer` example, shown in [Listing 6-10](#c06.xhtml_c06-fea-0010).


    [LISTING 6-10](#c06.xhtml_rc06-fea-0010) A Function Cannot Change the Original
    Variables Passed into It


    `#include <iostream>`


    `using namespace std;`


    `void ChangesAreGood(int myparam) {`


    `myparam += 10;`


    `cout << "Inside the function:" << endl;`


    `cout << myparam << endl;`


    `}`


    `int main() {`


    `int mynumber = 30;`


    `cout << "Before the function:" << endl;`


    `cout << mynumber << endl;`


    `ChangesAreGood(mynumber);`


    `cout << "After the function:" << endl;`


    `cout << mynumber << endl;`


    `return 0;`


    `}`


    [Listing 6-10](#c06.xhtml_c06-fea-0010) includes a function called `ChangesAreGood()`
    that modifies the parameter it receives. (It adds `10` to its parameter called
    `myparam`.) It then prints the new value of the parameter.


    The `main()` function initializes an integer variable, `mynumber`, to `30` and
    prints its value. It then calls the `ChangesAreGood()` function, which changes
    its parameter. After coming back from the `ChangesAreGood()` function, `main()`
    prints the value again. When you run this application, you see the following output:


    `Before the function:`


    `30`


    `Inside the function:`


    `40`


    `After the function:`


    `30`


    Before the function call, `mynumber` is `30`. And after the function call, it''s
    still `30`. But the function added `10` to its parameter. This means that when
    the function modified its parameter, the original variable remained untouched.
    The two are separate entities. Only the value `30` went into the function. The
    actual variable did not. It stayed in `main()`. But what if you write a function
    that you *want* to modify the original variable?


    A pointer contains a number, which represents the address of a variable. If you
    pass this address into a function and the function stores that address into one
    of its own variables, its own variable also points to the same variable that the
    original pointer did. The pointer variable in `main()` and the pointer variable
    in the function both point to the same variable because both pointers hold the
    same address.


    That''s how you let a function modify data in a variable: You pass a pointer.
    But when you call a function, the process is easy because you don’t need to make
    a pointer variable. Instead, you can just call the function, putting an ampersand
    (`&`) in front of the variable. Then you’re not passing the variable or its value
    — instead, you’re passing the address of the variable.


    The `VariablePointer2` example, shown in [Listing 6-11](#c06.xhtml_c06-fea-0011),
    is a modified form of [Listing 6-10](#c06.xhtml_c06-fea-0010); this time, the
    function actually manages to modify the original variable.


    [LISTING 6-11](#c06.xhtml_rc06-fea-0011) Using Pointers to Modify a Variable Passed
    into a Function


    `#include <iostream>`


    `using namespace std;`


    `void ChangesAreGood(int *myparam) {`


    `*myparam += 10;`


    `cout << "Inside the function:" << endl;`


    `cout << *myparam << endl;`


    `}`


    `int main() {`


    `int mynumber = 30;`


    `cout << "Before the function:" << endl;`


    `cout << mynumber << endl;`


    `ChangesAreGood(&mynumber);`


    `cout << "After the function:" << endl;`


    `cout << mynumber << endl;`


    `return 0;`


    `}`


    When you run this application, you see the following output:


    `Before the function:`


    `30`


    `Inside the function:`


    `40`


    `After the function:`


    `40`


    Notice the important difference between this and the output from [Listing 6-10](#c06.xhtml_c06-fea-0010):
    The final line of output is `40`, not `30`. The variable was modified by the function!


    To understand how this happened, first look at `main()`. The only difference in
    `main()` is that it has an ampersand (`&`) in front of the `mynumber` argument
    in the call to `ChangesAreGood()`. `ChangesAreGood()` receives the address of
    `mynumber`.


    Now the function has some major changes. The function header takes a pointer rather
    than a number. You perform this task by adding an asterisk (`*`) so that the parameter
    is a pointer variable. This pointer receives the address being passed into it.
    Thus, it points to the variable `mynumber`. Therefore, any modifications made
    by dereferencing the pointer will change the original variable. The following
    line changes the original variable.


    `(*myparam) += 10;`'
