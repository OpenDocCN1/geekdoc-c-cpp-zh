  trans: "\n\n```cpp\nint hello = 10;\nint goodbye = 20;\n```\n\n它里面全部只有这两行代码。（当然，真实的\
    \ `iostream` 文件要复杂得多。）假设你自己的的源文件 `MyProgram.cpp` 包含以下内容（如 `Preprocessor` 示例所示）：\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    std::cout << \"Hello world!\"\
    \ << std::endl;\n    return 0;\n}\n```\n\n那么，在预处理器完成预处理后，它会创建一个临时的修复文件（将 `iostream`\
    \ 文件中的行插入到 `MyProgram.cpp` 文件中 `#include` 行所在的位置），看起来如下：\n\n```cpp\nint hello\
    \ = 10;\nint goodbye = 20;\nint main()\n{\n    std::cout << \"Hello world!\" <<\
    \ std::endl;\n    return 0;\n}\n```\n\n换句话说，预处理器用该文件的内容替换了 `#include` 行。\n\n##\
    \ 使用 #define 创建常量\n\n预处理器除了 `#include` 之外，还为你提供了许多其他指令。其中最有用的指令之一是 `#define` 指令。这里有一个\
    \ `#define` 示例行：\n\n```cpp\n#define MYSPECIALNUMBER 42\n```\n\n预处理器看到这一行后，每当它遇到单词\
    \ `MYSPECIALNUMBER` 时，就会将其替换为单词 `42`（即定义之后跟随任何字母、数字和其他字符序列）。\n\n![Warning](img/warning.png)\
    \ 尽管在 C++ 中仍然可以使用 `#define` 语句，但通常情况下你应该直接使用常量而不是符号。\n\n# 第 6 章\n\n# 通过指针引用你的数据\n\
    \n### 本章内容\n\n* ![Bullet](img/check.png) **使用两种类型的内存：栈和堆**\n* ![Bullet](img/check.png)\
    \ **通过指针访问变量地址**\n* ![Bullet](img/check.png) **使用 `new` 关键字在堆上创建变量**\n* ![Bullet](img/check.png)\
    \ **将指针作为参数并返回指针**\n\n计算机内存的每一个微小部分都与一个表示其位置的数字（或*地址*）相关。在本章中，你将看到在确定存储在内存中的变量地址后，你可以对它进行强大的操作，从而赋予你创建强大程序的工具。\n\
    \n![Tip](img/tip.png) 如果 C++ 编程中任何一个主题是最重要的，那就是指针的概念。\n\n## 考虑指针的问题\n\n*指针*简单来说就是内存中的一个地址。它包含的值是地址，通过*解引用*指针（查看它所指向的地址），你可以看到指针所引用的值。这就像你房子的地址一样。你向该地址寄信，但地址并不是你的房子——它只是一个指向你房子的指针。\n\
    \n起初使用指针的原因是为了避免在代码中传递大型对象。早期的应用程序必须高效地利用每一比特内存和 CPU 周期周期，否则就会面临性能问题。指针允许早期应用程序通过仅指向内存中的大型对象而不是传递它们，就能获得良好的性能。\n\
    \n应用程序可能拥有无效指针，当代码尝试处理此无效地址时，它通常会导致应用程序崩溃。当然，最糟糕的问题是空指针 `0x000000`，你期望它指向某些东西——但空指针指向无。\n\
    \n指针的另一个问题是你花费大量时间来管理它们。每当你处理指针时，你都面临着风险：\n\n*   **产生内存泄漏：** 如果没有释放指针以便重用内存，则内存将对应用程序不可访问。尽管有可用内存，你实际上可能会耗尽内存。在应用程序终止、操作系统释放它之后，内存才会再次可用。\n\
    *   **使用未初始化的内存：** 内存位置可能包含任何内容，如果你对该内存位置中的数据进行操作，你的应用程序将运行异常或直接崩溃。\n*   **获取错误的数据：**\
    \ 应用程序可能指向错误的位置，而你可能并不知道。这意味着应用程序正在使用错误的数据，可能导致意外之外的输出或数据损坏。\n\n## 变量的堆与栈\n\n\
    C++ 应用程序使用两种内存：\n\n*   **栈 (Stack)：** 每次调用函数时，计算机都会在称为*栈*的内存区域内为函数局部变量的值分配内存。这部分内会在函数返回时自动释放。\n\
    *   **堆 (Heap)：** 程序程序共享的内存区域，计算机在其中存储程序*动态*创建和销毁的值。这些值通过指针访问。\n\n### 获取变量的地址\n\
    \n由于每个变量都位于内存的某处，因此每个变量都有地址。如果你有一个声明了名为 `NumberOfPotholes` 的整数变量的函数，那么当应用程序调用此函数时，计算机会在内存中的某处为\
    \ `NumberOfPotholes` 分配空间。\n\n![Remember](img/remember.png) 如果你想找到变量 `NumberOfPotholes`\
    \ 的地址，只需在它前面加上取地址符 (`&`) 即可。列表 6-1 显示了 `VariableAddress`示例，它获取了变量的地址并将其打印。\n\n\
    列表 6-1 使用 & 获取变量的地址\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    int NumberOfPotholes = 5;\n    cout << &NumberOfPotholes << endl;\n\
    \    return 0;\n}\n```\n\n当你运行此应用程序时，控制台上会显示一个十六进制数字。这个数字每次可能与与我们的匹配：`0x2ff74`。知道变量的地址并不能告诉你内容，但\
    \ C++ 程序员以其他方式使用地址：\n\n*   **使用所谓的指针变量直接修改变量：** *指针变量*与任何其他变量一样，只是它存储的是另一个变量的*地址*。\n\
    *   **使用任何数学技术修改地址所指向的值。**\n*   **根据指针比较实体（如对象）。**\n\n要声明一个指针变量，你需要指定它所指向的变量类型。然后在变量名前面加一个星号，如下所示：\n\
    \n```cpp\nint *ptr;\n```\n\n这一行声明了一个*指向*整数的变量。换句话说，它可以包含一个整数变量的*地址*。那么你如何获取整数变量的地址呢？通过使用\
    \ `&` 符号。因此，你可以这样做：\n\n```cpp\nptr = &NumberOfPotholes;\n```\n\n这一行将 `NumberOfPotholes`\
    \ 的地址放入 `ptr` 变量中。记住，`ptr` 并不持有坑的数量；相反它持有名为 `NumberOfPotholes` 的变量的地址。\n\n![Tip](img/tip.png)\
    \ 你通过指针指向的项目类型来指定指针的类型。如果指针变量指向整数，它的类型就是*指向整数的指针*。在 C++ 表示中，它的类型是 `int *`（中间有空格）或\
    \ `int*`（没有空格）。如果指针变量指向字符串，它的类型就是*指向字符串的指针*，该类型的表示法是 `string *`。\n\n![Remember](img/remember.png)\
    \ `ptr` 变量持有一个地址，但那个地址上有什么？那个地址是被称为 `NumberOfPotholes` 的存储单元在内存中的位置。在内存的那个位置就是存储在\
    \ `NumberOfPotholes` 中的数据。\n\n### 使用指针修改变量\n\n当你有一个持有另一个变量地址的指针变量后，你就可以使用该指针访问另一个变量中的信息。这意味着你有两种方法获取变量中的信息：使用变量名本身（如\
    \ `NumberOfPotholes`），或使用指向它的指针变量。\n\n"
- fmt: "\nIf you want to store the number `6087` in `NumberOfPotholes`, you can do\
    \ this:\n\n```\nNumberOfPotholes = 6087;\n```\n\nOr you can use the pointer. To\
    \ use the pointer, you first declare it as follows:\n\n```cpp\nptr = &NumberOfPotholes;\n\
    ```\n\nThen, to change `NumberOfPotholes`, you don't just assign a value to it.\
    \ Instead, you throw an asterisk in front of it, like so:\n\n```cpp\n*ptr = 6087;\n\
    ```\n\nIf `ptr` points to `NumberOfPotholes`, these two lines of code will have\
    \ the same effect: Both will change the value to `6087`. This process of sticking\
    \ the asterisk before a pointer variable is called *dereferencing* the pointer.\
    \ Look at the `DereferencePointer` example, shown in [Listing 6-2](#c06.xhtml_c06-fea-0002),\
    \ which demonstrates all this.\n\n[LISTING 6-2](#c06.xhtml_rc06-fea-0002) Modifying\
    \ the Original Variable with a Pointer Variable\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int NumberOfPotholes;\n    int *ptr;\n\
    \    ptr = &NumberOfPotholes;\n    *ptr = 6087;\n    cout << NumberOfPotholes\
    \ << endl;\n    return 0;\n}\n```\n\nIn [Listing 6-2](#c06.xhtml_c06-fea-0002),\
    \ the first line of `main()` declares an integer variable, and the second line\
    \ declares a pointer to an integer. The next line takes the address of the integer\
    \ variable and stores it in the pointer. Then the fourth line modifies the original\
    \ integer by dereferencing the pointer. And just to make sure that the process\
    \ worked, the next line prints the value of `NumberOfPotholes`. When you run the\
    \ application, you see the following output:\n\n```\n6087\n```\n\nYou can also\
    \ read the value of the original variable through the pointer. Look at the `ReadPointer`\
    \ example, shown in [Listing 6-3](#c06.xhtml_c06-fea-0003). This code accesses\
    \ the value of `NumberOfPotholes` through the pointer variable, `ptr`. When the\
    \ code gets the value, it saves it in another variable called `SaveForLater`.\n\
    \n[LISTING 6-3](#c06.xhtml_rc06-fea-0003) Accessing a Value through a Pointer\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int NumberOfPotholes;\n\
    \    int *ptr = &NumberOfPotholes;\n    int SaveForLater;\n    *ptr = 6087;\n\
    \    SaveForLater = *ptr;\n    cout << SaveForLater << endl;\n    *ptr = 7000;\n\
    \    cout << *ptr << endl;\n    cout << SaveForLater << endl;\n    return 0;\n\
    }\n```\n\nWhen you run this application, you see the following output:\n\n```\n\
    6087\n7000\n6087\n```\n\nNotice that the code changes the value through `ptr`\
    \ again — this time to `7000`. When you run the application, you can see that\
    \ the value did, indeed change, but the value in `SaveForLater` remained the same.\
