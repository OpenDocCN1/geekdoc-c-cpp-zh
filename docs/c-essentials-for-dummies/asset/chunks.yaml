- fmt: "\nA `string` is simply a set of characters strung together. The compiler knows\
    \ the start and end of a string in your code based on the location of the double\
    \ quotes.\n\nYou can create a variable that can hold a string. The type you use\
    \ is `string`. The `CreateString` example, shown here, demonstrates how to use\
    \ a `string` variable.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main()\n{\n  string mystring;\n  mystring = \"Hello there\";\n  cout << mystring\
    \ << endl;\n  return 0;\n}\n```\n\nWhen you run this application, the string `Hello\
    \ there` appears on the console. The first line inside `main()` creates a string\
    \ variable called `mystring`. The second line initializes it to `\"Hello there\"\
    `. The third line prints the string to the console.\n\n## Getting a part of a\
    \ string\n\nAccessing the individual characters within a string is easy. Take\
    \ a look at the following `IndividualCharacter` example:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n  string mystring;\n  mystring = \"abcdef\"\
    ;\n  cout << mystring[2] << endl;\n  return 0;\n}\n```\n\nNotice that the ninth\
    \ line, the `cout` line, has the word `mystring` followed by a `2` inside brackets\
    \ (`[2]`). When you run this application, here's what you see:\n\n`c`\n\nThat’s\
    \ it, just a letter `c`. The `2` inside brackets means that you want to access\
    \ the third character of the string and only that character.\n\n![Remember](images/remember.png)\
    \ C++ starts numbering the positions inside the string at 0. So for this string,\
    \ `mystring[0]` is the first character, which happens to be `a`. Therefore, `mystring[2]`\
    \ gets the third character. In general, this book uses fourth position to mean\
    \ the fourth position, which you access through `mystring[3]`. (The number inside\
    \ brackets is called an index.)\n\nA string is made of characters. So, a single\
    \ character within a string has the type `char`. This means that you can do something\
    \ like this (as shown in the `IndividualCharacter2` example):\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n  string mystring;\n  mystring\
    \ = \"abcdef\";\n  char mychar = mystring[2];\n  cout << mychar << endl;\n}\n\
    ```\n\nIn this example, `mychar` is a variable of type `char`. The `mystring[2]`\
    \ expression evaluates to a value of type `char`. So, the assignment is valid.\
    \ When you run this, you once again see the single character in the third position:\n\
    \n`c`\n\n## Changing part of a string\n\nUsing the bracket notation, you can also\
    \ change a character inside a string. The following code, for example, changes\
    \ the second character in the string (that is, the one with index `1`) from a\
    \ `b` to a `q`:\n\n```cpp\nstring x = \"abcdef\";\nx[1] = 'q';\ncout << x << endl;\n\
    ```\n\nThis code writes the string `aqcdef` to the console.\n\n## Adding onto\
    \ a string\n\nYou can easily add to a string variable. The following lines of\
    \ code use the `+=` operator, which was also used in adding numbers:\n\n```cpp\n\
    string mystring;\nmystring = \"Hi \";\nmystring += \"there\";\ncout << mystring\
    \ << endl;\n```\n\nThe first line declares the string `mystring`. The second line\
    \ initializes it to `\"Hi \"`. The third line uses the `+=` operator, which appends\
    \ something to the string — in this case, `\"there\"`. So, after this line runs,\
    \ the string called `mystring` contains the string `\"Hi there\"`, and that's\
    \ what appears on the console when the `cout` line runs. The programmer term for\
    \ adding something to a string is concatenation.\n\nYou can also do something\
    \ similar with characters. The following code snippet adds a single character\
    \ to a string:\n\n```cpp\nstring mystring;\nmystring = \"abcdef\";\nmystring +=\
    \ 'g';\ncout << mystring << endl;\n```\n\nThis code creates a string with `\"\
    abcdef\"` and then adds a `'g'` character to the end to get `\"abcdefg\"`. Then\
    \ it writes the full `\"abcdefg\"` to the console.\n\n## Adding two strings\n\n\
    You can take two strings and add them together by using a plus sign (`+`), just\
    \ as you can do with integers. The final result is a new string that has copies\
    \ of the values of the two strings pushed together, side-by-side. For example,\
    \ the following code adds `first` to `second` to get a new string called `third`:\n\
    \n```cpp\nstring first = \"hello \";\nstring second = \"there\";\nstring third\
    \ = first + second;\ncout << third << endl;\n```\n\nThis code prints the value\
    \ of `third`, which is `\"hello there\"`. (Notice that the string called `first`\
    \ has a space at its end, which is inside quotes and, therefore, part of the string.)\
    \ You can also add a string constant (that is, an actual string in your application\
    \ surrounded by quotes) to an existing string variable, as shown here:\n\n```cpp\n\
    string first = \"hello \";\nstring third = first + \"there\";\ncout << third <<\
    \ endl;\n```\n\n![Warning](images/warning.png) You may be tempted to add two strings\
    \ like this:\n\n```cpp\nstring first = \"hello\";\nstring second = \"there\";\n\
    string third = first + second;\n```\n\nThis will not work because C++ cannot add\
    \ two string literals.\n\n## Telling the Truth with Boolean\n\nIn addition to\
    \ integers, another type is `bool`. A `bool` variable can hold either `true` or\
    \ `false`. You can initialize a `bool` variable like this:\n\n```cpp\nbool a =\
    \ true;\nbool b = false;\n```\n\nYou can use a `bool` variable in a conditional\
    \ statement like this:\n\n```cpp\nif (a)\n{\n  cout << \"a is true\" << endl;\n\
    }\n```\n\n## Using Floating-Point Values\n\nUsing the `float` type, you can represent\
    \ numbers with fractional parts. You can initialize a `float` variable like this:\n\
    \n```cpp\nfloat x = 3.14;\n```\n\nYou can also use the `double` type for more\
    \ precision:\n\n```cpp\ndouble y = 3.141592653589793;\n```\n\nA `float` has less\
    \ precision than a `double`. A `float` typically has about 7 digits of precision,\
    \ while a `double` has about 15 to 17.\n\n## Printing Float and Double Values\n\
    \nBy default, `cout` prints a few significant digits of a floating-point value,\
    \ whether it's a `float` or a `double`, and it prints large or small floating-point\
    \ values in scientific notation. But you can use the `set_precision()` function\
    \ to tell `cout` how many digits to print after the decimal point, and the `fixed`\
    \ flag to tell it not to use scientific notation, as demonstrated by the following\
    \ example program, `Floats.cpp`:\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\
    \nusing namespace std;\n\nint main()\n{\n  float temperature = 98.7;\n  double\
    \ sqrt2 = 1.4142135623731;\n  \n  cout << temperature << \" \" << sqrt2 << endl;\n\
    \  cout << setprecision(12) << sqrt2 << endl;\n  cout << setprecision(7) << proton_mass;\n\
    }\n```\n"
