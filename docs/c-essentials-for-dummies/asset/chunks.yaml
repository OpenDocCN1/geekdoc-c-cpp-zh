    ## Exception Handling


    An *exception* represents a runtime error that your program can throw when the
    error occurs. If your program throws an exception, it must be caught, otherwise
    the program *aborts* (abruptly terminates). You write exception handlers with
    `try catch` statements to catch particular exceptions.


    The file `nonexistent.txt` doesn''t exist, so the following example program throws
    an exception when it tries to open the file. The program then catches and handles
    the exception.


    `#include <iostream>`


    `#include <fstream>`


    `#include <string>`


    `using namespace std;`


    `int main()`


    `{`


    `string filename = "nonexistent.txt";`


    `ifstream ins;`


    `try`


    `{`


    `ins.open(filename);`


    `if (!ins.is_open())`


    `{`


    `throw "Failed to open " + filename;`


    `}`


    `cout << "Successfully opened "`


    `+ filename << endl;`


    `ins.close();`


    `}`


    `catch (string msg)`


    `{`


    `cout << "FILE ERROR: " << msg << endl;`


    `}`


    `return 0;`


    `}`


    The output is


    `FILE ERROR: Failed to open nonexistent.txt`


    The code is easier to read if it isn’t cluttered with error handlers. So, you
    can consolidate the error handling statements in `catch` blocks.


    When a program throws an exception, it immediately jumps to the `catch` block.
    Therefore, in the preceding example, the `Successfully opened` message is not
    printed.


    If the program doesn''t catch an exception after it was thrown, it will abort
    with an error message about an uncaught exception.


    ![Remember](images/remember.png) An important feature when throwing an exception
    in a function is that if the exception isn’t caught in that function, the exception
    propagates up the call chain until a function on the chain, or the main program
    itself, catches it. If the exception is never caught, the program aborts.


    ## Operator Overloading


    C++ allows you to *overload* an operator by giving it an additional capability.
    For example, you can overload the `+` operator to define what it means to add
    two objects of a certain class, and you can overload the `<<` operator to define
    how to print such an object.


    The following example demonstrates overloading the `*` operator to multiply two
    fractions and overloading the `<<` operator to print a fraction:


    `#include <iostream>`


    `using namespace std;`


    `class Fraction`


    `{`


    `public:`


    `Fraction(int n, int d)`


    `: numerator(n), denominator(d) {}`


    `int numerator, denominator;`


    `};`


    `Fraction operator *(Fraction& f1, Fraction& f2)`


    `{`


    `int n = f1.numerator*f2.numerator;`


    `int d = f1.denominator*f2.denominator;`


    `return Fraction(n, d);`


    `}`


    `ostream& operator <<(ostream& outs,`


    `const Fraction& f)`


    `{`


    `float decimal = ((float) f.numerator)`


    `/ ((float) f.denominator);`


    `outs << f.numerator << "/" << f.denominator`


    `<< " = " << decimal;`


    `return outs;`


    `}`


    `int main()`


    `{`


    `Fraction two_thirds(2, 3);`


    `Fraction three_fourths(3, 4);`


    `cout << " two thirds is "`


    `<< two_thirds << endl;`


    `cout << "three fourths is "`


    `<< three_fourths << endl;`


    `cout << "their product is "`


    `<< two_thirds*three_fourths << endl;`


    `return 0;`


    **`}`**


    Operator function `*` overloads the multiplication operator to allow you to multiply
    two `Fraction` objects using `*`, as in `two_thirds*three_fourths`. The function
    returns a `Fraction` object representing the product. Operator function `<<` allows
    you to output a `Fraction` object in a desired format in a `cout` statement. A
    `<<` operator function always returns a reference to the output stream. That allows
    chaining the operator in a single `cout` statement to output multiple values.


    The output is


    `two thirds is 2/3 = 0.666667`


    `three fourths is 3/4 = 0.75`


    `their product is 6/12 = 0.5`


    ## STL Vectors


    The Standard Template Library (STL) is a powerful C++ library of *template classes*
    that implement data structures such as vectors, hash tables, and iterators. Template
    classes are models for creating regular classes based on the datatypes that you
    give them.


    For example, `vector` is a template class, and `vector<int>` generates a class
    the implements a sequence of integer values. Similarly, `vector<float>` generates
    a class that implements a sequence of float values.


    ![Tip](images/tip.png) Vectors are similar to arrays but much more flexible and
    convenient to use. You can append values to a vector and insert and remove values
    anywhere in a vector. A vector automatically grows and shrinks its sequence of
    values.


    The following statements demonstrate some of a vector''s capabilities. You create
    a `vector<int>` object named `values`, which you initialize to a sequence of integer
    values `10`, `20`, and `30`.


    `#include <string>`


    `#include <vector>`


    `using namespace std;`


    `…`


    `vector<int> values{10, 20, 30};`


    `// Append a value at the end.`


    `values.push_back(40);`


    `// Insert a value two positions`


    `// from the beginning.`


    `values.insert(values.begin(), 2);`


    ## STL Maps


    A map is an *associative container* that stores key–value pairs. You use a key
    to access the value associated with the key. A map can''t have duplicate keys.
    You create map classes with the STL map template. For each map, you specify the
    datatype of the keys and the datatype of the values.


    The following statements demonstrate some of a map’s capabilities.


    `#include <string>`


    `#include <map>`


    `using namespace std;`


    `…`


    `map<string, int> numbers;`


    `// Add some key-value pairs.`


    `numbers["one"] = 1;`


    `numbers["twenty-one"] = 21;`


    `// Update a pair.`


    `numbers["twenty-one"]++;`


    Variable `numbers` is a map whose keys are strings, and the associated values
    are integers. You access each element by using a key like a subscript. So, `numbers["one"]
    = 1` enters the first key–value pair with key `"one"` and associated value `1`.
    The expression `numbers["twenty-one"]++` accesses the element with key `"twenty-one"`
    and increments its associated value from `21` to `22`.


    ## STL Iterators


    An *iterator* is a template class that accesses and iterates through the elements
    of a sequential template class, such as a vector. A common use is to loop over
    the elements of the sequence to process each element in turn.


    The following statements demonstrate a vector''s iterator. The vector of integer
    values is `v`, and its iterator is `itr`. Because the vector''s datatype is `vector<int>`,
    the iterator’s datatype is `vector<int>::iterator`.


    `#include <vector>`


    `#include <iterator>`


    `using namespace std;`


    `…`


    `vector<int> v{10, 20, 30, 40, 50};`


    `vector<int>::iterator itr;`


    `for (itr = v.begin(); itr != v.end(); itr++)`


    `{`


    `cout << setw(3) << *iter;`


    `}`


    `cout << endl;`


    `for (int n : v)`


    `{`


    `cout << setw(3) << n;`


    `}`


    `cout << endl;`


    The first `for` loop initializes `itr` to the beginning of the vector, and the
    loop exits when `itr` reaches the end of `v`. The iterator behaves like a pointer.
    The expression `itr++` advances the iterator to the next position of `v`, and
    `*itr` retrieves the element of `v` at the iterator''s current position.


    The second `for` loop implicitly uses the vector’s iterator. The first time through
    the loop, variable `n` is assigned the value at the first position of `v`. During
    each subsequent time through the loop, `n` is assigned the value at the next position.


    There are iterators for the other sequential STL containers and iterators that
    iterate backward through a sequence.


