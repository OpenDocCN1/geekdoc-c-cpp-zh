  trans: "\n因此，如果变量 `words` 包含字符串 `\"Something seriously interesting and bizarre\"\
    `，在运行此行后，它将包含 `\"Something seriously bizarre\"`。\n\n### 替换字符串的部分\n\n另一个有函数是 `replace()`。此函数将字符串的某部分替换为另一个字符串。要使用\
    \ `replace`，你需要指定从字符串的哪个位置开始替换以及你想替换多少个字符。然后指定替换后的字符串。\n\n例如，如果你的字符串是 `\"Something\
    \ seriously bizarre\"`，且你想将 `\"thing\"` 替换为字符串 `\"body\"`，你告诉 `replace()` 从索引\
    \ `4` 开始替换 `5` 个字符为单词 `\"body\"`。要实现此操作，你输入：\n\n```\nwords.replace(4, 5, \"body\"\
    );\n```\n\n![Tip](img/tip.png) 注意，你替换的字符数不必与新字符串的长度相同。如果字符串初始为 `\"Something seriously\
    \ bizarre\"`，在调用此 `replace()` 后，字符串将包含 `\"Somebody seriously bizarre\"`。\n\n##\
    \ 理解 main()\n\n本章到目前为止所有的应用程序都有一个 `main()`，这是一个函数。注意它的头部，后面跟着大括号内的代码：\n\n```\n\
    int main()\n```\n\n你可以看到这显然是一个函数头部：它以返回类型开头，然后是函数名 `main()`。这只是 `main()` 的形式之一。然而，你可能决定想让用户在控制台输入你的应用程序名称时提供输入的能力。在这种情况下，你使用这种\
    \ `main()` 函数的另一种替代形式，它包含两个参数：\n\n```\nint main(int argc, char *argv[])\n```\n\
    \n注意 `main()` 的第二形式有两个参数：\n\n* `int argc`：告诉你在命令行出现了多少个参数。\n* `char *argv[]`：以数组形式提供命令行参数列表。\n\
    \n*命令行参数*是你在 Windows 命令提示符或 macOS 或 Linux 终端窗口中，输入应用程序名称（你想要执行的*命令*）之后输入的的内容。当你运行一个应用程序时（特别是从命令提示符运行时），你输入应用程序名称并按回车键。但在按回车之前，你可以在应用程序名称后面加上其他通常由空格分隔的单词。\n\
    \n为了让这些切换及其关联参数生效，`main()` 函数必须处理输入。你使用 `argc` 来确定用户提供了多少个命令行参数，然后使用 `argv` 访问它们。*数组*是存储在一个名称下的值序列。`argv`\
    \ 变量就是这样一种。要访问存储在名为 `argv` 的单一伞下的各个变量，你可以进行如下操作：\n\n```\ncout << argv[0] << endl;\n\
    ```\n\n在这个示例中，你使用方括号就像访问字符串中的单个字符时那样做。你可以使用 *for* 循环来访问命令行参数。下面的 `CommandLineParameters`\
    \ 示例演示了这种技术。\n\n```\n#include <iostream>\n#include <stdlib.h>\nusing namespace\
    \ std;\n\nint main(int argc, char *argv[])\n{\n  for (int index=1; index < argc;\
    \ index++)\n  {\n    cout << argv[index] << endl;\n  }\n  return 0;\n}\n```\n\n\
    第 5 章\n\n# 分拆源代码文件\n\n本章内容\n\n![Bullet](img/check.png) **创建多个源代码文件**\n\n![Bullet](img/check.png)\
    \ **创建头文件**\n\n![Bullet](img/check.png) **在源文件之间共享变量**\n\n![Bullet](img/check.png)\
    \ **利用神秘的头文件封装器**\n\n正如你可以将工作划分为函数一样，你可以将工作划分为多个源代码文件。这样做的主要原因是帮助保持你的项目具有可维护性。此外，通过多个源代码文件，你可以让几个人同时处理一个项目，每个人同时处理不同的源代码文件。\n\
    \n在本章中，你将发现如何将你的源代码划分为多个文件（并放在所有正确的位置）。\n\n## 创建多个源文件\n\n如果你将应用程序代码拆分为多个源文件，请将应用程序的所有文件放在单独的目录或文件夹中。然后，你的编译命令中，指定\
    \ `*.cpp` 以告诉编译器编译所有名称以 `.cpp` 结尾的文件。必须且仅有一个源文件包含 `main()` 函数。如果你添加或删除源文件，或者修改了其中任何一个文件，你都需要重新编译以构建你的应用程序。\n\
    \n你可以将函数放在单独的源代码文件中，它们可以相互调用。通过这种方式，它们在单个应用程序中共同工作。本章稍后的“与头文件共享”部分展示了你如何让一个函数调用另一个源文件中的函数。\n\
    \n![Remember](img/remember.png) 你不能将一个函数拆分并将其放入两个源文件中。编译器要求你的函数必须保持在单个源文件中的完整性。\n\
    \n当你项目中有多个文件后，你可以将部分源码放在一个文件中，另部分放在另一个文件中。但在在此之前，你可能想阅读本章的其他一些章节，因为它们解释了如何正确地划分你的源代码。\n\
    \n在两个源文件协同工作之前，它们必须以某种方式相互发现。你需要告诉它们每一个关于另一个文件的内容。\n\n当你写一个函数时，通常该函数必须出现在同一源文件中任何对它的调用之前。这是因为编译器解析代码的方式：如果编译器遇到一个函数调用但尚未听说过它，它就会发出错误。但绕过此问题的方法是使用函数声明。*函数声明*简单来说就是函数的头部行，以分号结尾，如下所示：\n\
    \n```\nvoid BigDog(int KibblesCount);\n```\n\n在源文件的后面是实际函数。函数将不是分号，而是将有一个左括号、函数代码和一个右括号，如下所示：\n\
    \n```\nvoid BigDog(int KibblesCount)\n{\n  cout << \"I'm a lucky dog\" << endl;\n\
    \  cout << \"I have \" << KibblesCount\n  << \" pieces of food\"\n  << endl;\n\
    }\n```\n\n因此，在函数声明之后，无论函数代码是在调用之前还是之后，都可以调用该函数。\n\n![Remember](img/remember.png)\
    \ 为了让编译器理解函数调用，它在代码进行调用的点只需要一个函数*声明*。\n\n由于函数调用只需要一个函数声明，你可以将函数*本身*放在另一个文件中。因此，你可以拥有两个独立的源文件，如\
    \ `MultipleSourceFiles` 示例所示，它在列表 5-1 和 5-2 中显示。（第一个源代码文件——`main.cpp` 显示在列表 5-1\
    \ 中，第二个源代码文件——`mystuff.cpp` 显示在列表 5-2 中。）\n\n列表 5-1 仅用声明调用函数\n\n```\nvoid BigDog(int\
    \ KibblesCount);\n\nint main() {\n  BigDog(3);\n  return 0;\n}\n```\n\n列表 5-2\
    \ 使用单独文件中的函数\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid BigDog(int\
    \ KibblesCount) {\n  cout << \"I'm a lucky dog\" << endl;\n  cout << \"I have\
    \ \" << KibblesCount\n  << \" pieces of food\"\n  << endl;\n}\n```\n\n列表 5-1 和\
    \ 5-2 将函数与声明分离开。当你将这两个文件一起编译成单个应用程序时，它们会完美地结合在一起。然后你就可以运行应用程序，看到这个有点有趣的输出：\n\n\
    `I'm a lucky dog`\n\n`I have 3 pieces of food`\n\n"
- fmt: "\n![Remember](images/remember.png) Notice that `main.cpp` doesn't contain\
    \ either `#include <iostream>` or `using namespace std;` because it doesn't have\
    \ any calls to `cout`, just the call to `BigDog()`. You do have to put the `#include\
    \ <iostream>` and `using namespace std;` lines at the start of the `mystuff.cpp`\
    \ file because `mystuff.cpp` does use `cout`.\n\n## Sharing with Header Files\n\
    \nBreaking apart source code into multiple files is easy, but soon you may run\
    \ into a problem. If you have a function, you would need a prototype for `SafeCracker()`\
    \ in every file that calls it. The prototype may look like this:\n\n`string SafeCracker(int\
    \ SafeID);`\n\nBut there is an easier way of adding the prototype instead of adding\
    \ it to every file that uses the function. Simply put this line inside its own\
    \ file, called a `header file`, and give the filename an `.h` or `.hpp` extension.\
    \ (Most developers use `.h`.) For this example, you place the line `string SafeCracker\
    \ (int SafeID);` in a file called `safestuff.h`.\n\nThen, instead of typing the\
    \ header line at the start of each file that needs the function, you type the\
    \ following:\n\n`#include \"safestuff.h\"`\n\nYou would then have the three source\
    \ code files used for the `MultipleSourceFiles2` example, shown in [Listings 5-3](#c05.xhtml_c05-fea-0003),\
    \ [5-4](#c05.xhtml_c05-fea-0004), and [5-5](#c05.xhtml_c05-fea-0005):\n\n*   `main.cpp`:\
    \ Calls the function\n*   `safestuff.h`: Contains the function prototype\n*  \
    \ `safestuff.cpp`: Contains the actual code for the function whose prototype appears\
    \ in the header file\n\nLots of files, but now the code is broken into manageable\
    \ pieces. Also, make sure that you save all three of these files in the same directory\
    \ or folder.\n\n[LISTING 5-3](#c05.xhtml_rc05-fea-0003) Including the Header File\
    \ in the main File\n\n```\n#include <iostream>\n#include \"safestuff.h\"\nusing\
    \ namespace std;\n\nint main()\n{\n    cout << \"Surprise, surprise!\" << endl;\n\
    \    cout << \"The combination for Safe 12 is: \" << endl;\n    cout << SafeCracker(12)\
    \ << endl;\n    cout << \"Let's check on Safe 11 too: \" << endl;\n    cout <<\
    \ SafeCracker(11) << endl;\n    return 0;\n}\n```\n\n[LISTING 5-4](#c05.xhtml_rc05-fea-0004)\
    \ Containing the Function Prototype in the Header File\n\n```\n#ifndef SAFESTUFF_H_INCLUDED\n\
    #define SAFESTUFF_H_INCLUDED\nusing namespace std;\nstring SafeCracker(int SafeID);\n\
    #endif // SAFESTUFF_H_INCLUDED\n```\n\n[LISTING 5-5](#c05.xhtml_rc05-fea-0005)\
    \ Containing the Actual Function Code\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nstring SafeCracker(int SafeID)\n{\n    if (SafeID == 12)\n        return\
    \ \"13-26-16\";\n    else\n        return \"Safe Combination Unknown\";\n}\n```\n\
    \nBefore you compile this application, you need to know a few things about how\
    \ the compilation process works:\n\n*   When you compile a `.cpp` file, the compiler\
    \ outputs a `.o` (for object) file that is then linked by the linker with all\
    \ the other `.o` files to create an executable (Windows will automatically name\
    \ this with a `.exe` extension) file. In addition to the `.o` files from your\
    \ project, the linker also links in any library files or external code that your\
    \ application accesses.\n*   The compiler doesn't compile the header file into\
    \ a separate `.o` file. With the application in [Listings 5-3](#c05.xhtml_c05-fea-0003)\
    \ through [5-5](#c05.xhtml_c05-fea-0005), the compiler creates only two output\
    \ files: `main.o` and `safestuff.o`.\n*   When the compiler reads the `main.cpp`\
    \ file and reaches the `#include \"safestuff.h\"` line for the header file, it\
    \ verifies that it hasn't read the `safestuff.h` file before and included it within\
    \ the `.o` file.\n*   If the `safestuff.h` file hasn't been read before, the compiler\
    \ temporarily switches over and reads the header file, pretending that it’s still\
    \ reading the same `main.cpp` file. As it continues, it compiles everything as\
    \ if it’s all part of the `main.cpp` file.\n\n![Remember](images/remember.png)\
    \ If you include the `safestuff.h` header file in other source code files, the\
    \ compiler adds the content to those source files as well. Compile and run the\
    \ code in [Listings 5-3](#c05.xhtml_c05-fea-0003) through [5-5](#c05.xhtml_c05-fea-0005).\n\
    \n`Surprise, surprise!`\n`The combination for Safe 12 is: `\n`13-26-16`\n`Let's\
    \ check on Safe 11 too: `\n`Safe Combination Unknown`\n\n![Remember](images/remember.png)\
    \ If you include the `safestuff.h` header file in other source code files, the\
    \ compiler adds the content to those source files as well. Compile and run the\
    \ code in [Listings 5-3](#c05.xhtml_c05-fea-0003) through [5-5](#c05.xhtml_c05-fea-0005).\n\
    \n### Adding the header once\n\nIf you include the `safestuff.h` header file in\
