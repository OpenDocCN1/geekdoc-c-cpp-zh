    Chapter 4


    # Dividing Your Work with Functions


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Working with functions**


    ![Bullet](images/check.png) **Writing your own great functions**


    ![Bullet](images/check.png) **Having fun with strings**


    ![Bullet](images/check.png) **Manipulating `main()`**


    People generally agree that most projects throughout life are easier when you
    divide them into smaller, more manageable tasks. That''s also the case with computer
    programming — if you break your code into smaller pieces, it becomes more manageable.


    C++ provides many ways to divide code into smaller portions. One way is through
    the use of functions. A *function* is a set of lines of code that performs a particular
    job. In this chapter, you discover what functions are and how you can use them
    to make your programming job easier.


    ## Dividing Your Work


    When you write a computer application, after you divide your job into smaller
    pieces called *objects,* you eventually start giving these objects behaviors.
    And to code these behaviors, you break them into manageable parts called *functions.*
    Think of a function as a machine. You can put one or more values into the machine;
    it processes them, and then it spits out a single answer, if anything at all.


    This machine (or function) has three main parts:


    *   **Inputs:** The function can receive data through its inputs. These data elements
    can be numbers, strings, or any other type. When you create such a machine, you
    can have as many inputs as you want (or even none).


    *   **Processor:** The processor is the function itself. In terms of C++, this
    is actually a set of code lines.


    *   **Output:** A function can *return* something when it has finished doing its
    thing. In C++, this output is in the form of numbers, strings, or any other type.


    To make all this clear, try out the following `FirstFunction` code. (Don’t forget
    the second line, `#include<math.h>`, which gives you some math capabilities.)


    `#include <iostream>`


    `#include <math.h>`


    `using namespace std;`


    `int main()`


    `{`


    `cout << fabs(-10.5) << endl;`


    `cout << fabs(10.5) << endl;`


    `return 0;`


    `}`


    When you run this application, you see the following output:


    `10.5`


    `10.5`


    In this code, you use a function or machine called `fabs()`. This function takes
    a number as input and returns as output the absolute value of the number.


    ![Remember](images/remember.png) The reason for the `f` before the name `abs`
    is that it uses floating-point numbers, which are simply numbers with decimal
    points.


    So, the first line inside `main()`*calls*`fabs()` for the value `–10.5`. The `cout`
    then takes the output of this function (that is, the *result*) and prints it to
    the console.


    Then the second line does the same thing again, except that it takes the absolute
    value of the number `10.5`.


    And where is the processor for this function? It''s not in your code; it’s in
    another file, and the following line ensures that your application can use this
    function:


    `#include <math.h>`


    You’ve seen functions in many places. If you use a calculator and enter a number
    and press the square root button, the calculator runs a function that calculates
    the square root.


    ## Calling a Function


    When you run the code in a function, you’re *calling* the function. When you call
    a function, you do so by name.


    To call a function, you type its name and then a set of parentheses. Inside the
    parentheses, you list the items you want to send to the inputs of the function.
    The term used here is *pass,* as in “You pass the values to the function.”


    For example, if you want to call the `fabs()` function, you type **fabs**, an
    open parenthesis, the number you want to pass to it, and then a closed parenthesis,
    as in the following example:


    `fabs(-10.5)`


    The `fabs()` function returns a value — the absolute value of `–10.5`, and you
    probably want to do something with that value. You could, for example, print it
    to the console:


    `cout << fabs(-10.5) << endl;`


    Or you could store it away in another variable. Before you can do that, you need
    to know the *type* that the function returns. Just as with a variable, a function
    return value has a type. In this case, the type is `double`. To save the result
    of `fabs()`, you need to have a variable of type `double`. The following `Fabs2`
    example does this:


    `#include <iostream>`


    `#include <math.h>`


    `using namespace std;`


    `int main()`


    `{`


    `double mynumber = fabs(-23.87);`


    `cout << mynumber << endl;`


    `return 0;`


    `}`


    This code declares a `double` variable called `mynumber`. Then it calls `fabs()`,
    passing it `–23.87` and returning the value into `mynumber`. Next, it prints the
    value in `mynumber` to the console.


    When you run this application, you see the following, which is the absolute value
    of `–23.87`:


    `23.87`


    ### Passing a variable


    You can also pass the value of a variable into a function. The following `Fabs3`
    example creates two variables: One is passed into the function, and the other
    receives the result of the function.


    `#include <iostream>`


    `#include <math.h>`


    `using namespace std;`


    `int main()`


    `{`


    `double start = -253.895;`


    `double finish = fabs(start);`


    `cout << finish << endl;`


    `return 0;`


    `}`


    This code creates two variables; the first is called `start`, and the second is
    called `finish`. It initializes `start` with a value of `–253.895`. Next, it calls
    `fabs()`, passing it the value of `start`. It saves the return value in `finish`,
    and prints the value in `finish`. When `Fabs3` runs, you see the following appear
    on the console:


    `253.895`


    ![Tip](images/tip.png) Saving a function result to a variable is useful if you
    need to use the result several times over.


    ### Passing multiple variables


    Some functions have multiple parameters. As with functions that take a single
    value, you put the values inside a single set of parentheses. Because you have
    multiple values, you separate them with commas. The following `Pow1` example uses
    a function called `pow()` to calculate the third power of 10\. Make sure that
    you include the `math.h` line in the `include` section so that you can use the
    `pow()` function.


    `#include <iostream>`


    `#include <math.h>`


    `using namespace std;`


    `int main()`


    `{`


    `double number = 10.0;`


    `double exponent = 3.0;`


    `cout << pow(number, exponent) << endl;`


    `return 0;`


    `}`


    When you run the application, you see 10 to the third power, which is 1,000:


    `1000`


    You can also pass a mixture of variables and numbers in expressions, or just numbers.
    The following code snippet also calculates the third power of 10 but passes an
    actual number, 3.0, for the power:


    `double number = 10.0;`


    `cout << pow(number, 3.0) << endl;`


    Or you can pass only numbers:


    `cout << pow(10.0, 3.0) << endl;`'
