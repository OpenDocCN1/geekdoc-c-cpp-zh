    ## 释放指针


    当你通过调用`new`运算符在堆上分配内存并结束使用内存时，你需要通知计算机，无论内存多少。计算机不会查看你的代码以判断你是否在使用该内存。因此，在你的代码中，当你完成内存的使用时，要*释放*内存。


    释放内存的方法是调用`delete`运算符并传递指针的名字：


    ```

    delete MyPointer;

    ```


    这行代码将出现在你完成使用通过`new`分配的指针之后。


