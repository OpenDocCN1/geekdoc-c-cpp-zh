    Next, the code points the pointer to `ExpensiveComputer` and uses the pointer
    to put `2000` inside `ExpensiveComputer`. Then the code changes what the pointer
    points to.


    ![Warning](images/warning.png) Be careful if you use one pointer to bounce around
    several different variables. You can easily lose track of which variable the pointer
    is pointing to.


    ### Getting tips on pointer variables


    ![Tip](images/tip.png) You can declare two pointer variables of the same type
    by putting them together in a single statement, as you can with regular variables.
    However, you must precede *each one* with an asterisk, as in the following line:


    ```

    int *ptrOne, *ptrTwo;

    ```


    ![Warning](images/warning.png) If you try to declare multiple pointers on a single
    line but put an asterisk only before the first pointer, only that one will be
    a pointer. The rest will not be. This can cause serious headaches later because
    this line compiles fine:


    ```

    int *ptrOne, Confused;

    ```


    Here, `Confused` is not a pointer to an integer; instead, it''s just an integer.
    Beware!


    ![Tip](images/tip.png) Some people like to put the asterisk immediately after
    the type, as in the following example, to emphasize the fact that the type is
    *pointer to integer:*


    ```

    int* ptrOne;

    ```


    But this approach makes it easy to leave out the asterisks for any pointer variables
    that follow.


    ## Creating New Pointers


    It isn’t possible to predict some kinds of memory use in your application, but
    the requirements aren’t known when you write the code. For example, streaming
    data from the internet or creating new records in a database are both examples
    of unpredictable memory use. When working with unpredictable memory requirements,
    you *allocate* (request memory) and *deallocate* (release the memory you requested)
    as needed in a process called *dynamic memory management.* You use the *heap,*
    an area of unallocated memory, to perform dynamic memory management.


    ### Using new


    To declare a value on the heap using existing methods, first you need to set up
    a variable that will help you keep track of the storage bin. This variable must
    be a pointer variable.


    To allocate memory on the heap, you need to do two things: First, declare a pointer
    variable. Second, use the *new* operator by specifying the type of value you want
    to create. For example, the following line creates a new integer value:


    ```

    int *somewhere = new int;

    ```


    After the computer creates the new integer value on the heap, it stores the address
    of the integer value in `somewhere`. And that makes sense: `somewhere` is a pointer
    to an integer, so it''s prefaced by the `*` (pointer) operator. Thus, `somewhere`
    holds the address of an integer value. The `UseNew` example, shown in [Listing
    6-7](#c06.xhtml_c06-fea-0007), demonstrates how pointers work when using `new`.


    [LISTING 6-7](#c06.xhtml_rc06-fea-0007) Allocating Memory by Using new


    ```cpp

    #include <iostream>

    using namespace std;


    int main() {

    int *ptr = new int;

    *ptr = 10;

    cout << *ptr << endl;

    cout << ptr << endl;

    return 0;

    }

    ```


    When you run this application, you see this output (the second value will change
    each time you run the example):


    ```

    10

    0x73af10

    ```


    In this application, you first allocate a pointer variable, which you call `ptr`.
    Then you call `new` with an `int` type, which returns a pointer to an integer.
    You save that return value in the `ptr` variable.


    You save a `10` in the memory that `ptr` points to. And then you print the value
    stored in the memory that `ptr` points to.


    To see for yourself that `ptr` is pointing to a memory location and not the actual
    value of `10`, the code also prints `ptr` without *dereferencing* it (using the
    `*` operator). The output is a hexadecimal value such as `0x9caef0`, but this
    output will change each time because the memory allocation occurs in a different
    location on the heap each time.


    As you can see, `ptr` contains the address of the value allocated by the `new`
    operator. The only way you can access it is through the pointer.


    ![Remember](images/remember.png) When you call `new`, you get back a pointer.
    This pointer is of the type that you specify in your call to `new`. You can then
    store the pointer only in a pointer variable of the same type.


    ![Tip](images/tip.png) When you use the `new` operator, the usual terminology
    is that you are *allocating memory on the heap.*


    By using pointers to access memory on the heap, you can take advantage of many
    interesting C++ features. For example, you can use pointers along with something
    called an array. An *array* is simply a large storage bin that has multiple slots,
    each of which holds one item. ([Chapter 8](#c08.xhtml) discusses arrays.) If you
    set up an array that holds pointers, you can store all these pointers without
    having to name them individually. And these pointers can point to complex things,
    called *objects.* You could then pass all these variables (which could be quite
    large, if they''re strings) to a function by passing only the array, not the strings
    themselves. That step saves memory on the stack.


    In addition to objects and arrays, you can have a function allocate memory and
    return a pointer. (Wait, the source text seems to have jumbled here, but the core
    logic remains: you use pointers to manage heap memory).


    ### Using an initializer


    When you call `new`, you can provide an initial value for the memory. For example,
    when allocating an integer, you can also store the number `10` initially. The
    `Initializer` example shown in [Listing 6-8](#c06.xhtml_c06-fea-0008) demonstrates
    how to do this.


    [LISTING 6-8](#c06.xhtml_rc06-fea-0008) Putting a Value in Parentheses to Initialize
    Memory


    ```cpp

    #include <iostream>

    using namespace std;


    int main() {

    int *ptr = new int(10);

    cout << *ptr << endl;

    return 0;

    }

    ```


    This code calls `new`, but it also provides a number in parentheses. That number
    is put in the memory initially, instead of assigned to it later. This line of
    code is equivalent to the following two lines of code:


    ```cpp

    int *ptr = new int;

    *ptr = 10;

    ```


    ## Freeing Pointers


    When you allocate memory on the heap by calling the `new` operator and you''re
    finished using the memory, you need to let the computer know, regardless of whether
    it’s just a little bit of memory or a lot. The computer doesn’t look ahead into
    your code to find out whether you’re still use the memory. So, in your code, when
    you’re finished with the memory, you *free* the memory.


    The way you free the memory is by calling the `delete` operator and passing the
    name of the pointer:


    ```

    delete MyPointer;

    ```


    This line would appear after you’re finished using a pointer that you allocated
    by using `new`.


    The `FreePointer` example, shown in [Listing 6-9](#c06.xhtml_c06-fea-0009), provides
    a complete demonstration of allocating a pointer, using it, and then freeing it.
    Note the use of the `replace()` method, which first appears in the “[Replacing
    parts of a string](#c04.xhtml_c04-sec-0016)” section of [Chapter 4](#c04.xhtml).
    You use the arrow operator (`->`) to access this `string` method of `phrase`.
    For now, consider the following:


    ```

    phrase->(22, 4, "oked")

    ```


    To be shorthand for


    ```

    (*phrase).(22, 4, "oked")

    ```


    The “[Using classes and pointers](#c07.xhtml_c07-sec-0014)” section of [Chapter
    7](#c07.xhtml) describes the arrow operator in more detail.


    [LISTING 6-9](#c06.xhtml_rc06-fea-0009) Using delete to Clean Up Your Pointers


    ```cpp

    #include <iostream>

    #include <string>

    using namespace std;


    int main() {

    string *phrase = new string("All presidents are cool!!!");

    cout << *phrase << endl;

    (*phrase)[20] = ''r'';

    delete phrase;

    return 0;

    }

    ```

