    \ 的 `string` 指针。`GetSecretCode()` 返回一个指向 `string` 的指针，因此 `newcode` 与函数的返回值匹配。当你使用\
    \ `newcode` 时，必须对其进行解引用。\n\n当你运行此应用程序时，你会看到类似如下的输出：\n\n```\nCR41NQ\nCR18467NQ\n\
    CR6334NQ\nCR26500NQ\nCR19169NQ\n```\n\n![Warning](img/warning.png) 永远不要从函数返回内部局部变量的地址。局部变量存储在为函数栈空间中，而不是堆中。当函数结束时，计算机会释放函数使用的栈空间，为下一次函数调用留出空间。如果你尝试这样做，变量在一段时间内是安全的，但在随后的足够函数调用之后，变量的数据将被覆盖。\n\
    \n正如函数的参数通常是值一样，函数通常也返回一个值。在返回指针的情况下，函数返回的仍然只是值——它返回的是指针的值，即代表地址的数字。\n\n第 7 章\n\
    \n# 类的操作\n\n## 本章内容\n\n![Bullet](img/check.png) 查看对象和类的工作原理\n![Bullet](img/check.png)\
    \ 使用类\n![Bullet](img/check.png) 处理构造函数和析构函数\n![Bullet](img/check.png) 创建类层次结构\n\
    \n回到 20 世纪 90 年代初，计算机世界最热门的流行词是“面向对象”。任何东西想要畅销，就必须是面向对象的。编程语言是面向对象的。软件应用程序是面向对象的。计算机也是面向对象的。遗憾的是，“面向对象”在当时只是一个酷酷的口号，在实际意义上并不大。通常，想法的开始并不完善，随着人们努力在现实世界中实现该想法，它会变得清晰。\n\
    \n现在，可以探索面向对象的真正含义，以及你如何使用它来组织你的 C++ 应用程序。在本章中，你将发现面向对象编程，并看到如何在 C++ 中实现它。尽管人们对面向对象的严格定义存在分歧，但在本书中它指的是“使用对象和类进行编程”。\n\
    \n## 理解对象和类\n\n在描述对象可以做什么时，要仔细地从对象自身的角度来编写，而不是从使用对象的人的角度出发。命名这种能力的一种好方法是在其前面加上\
    \ `I can`（我可以）来测试它，看它是否通顺。因此，因为“我可以在纸上写字”从笔的角度来看是通的，所以列表包含“在纸上写字”作为笔的能力之一。\n\n\
    看到宇宙中所有的对象是可能的吗？还是有些对象是隐藏的？无疑，某些对象是物理的，比如原子或月球的背面，你视不到它们。但其他对象是抽象的。例如，你可能有一个信用卡账户。信用卡账户到底是什么？信用卡账户是抽象的，因为你无法触摸它——它没有物理实体。接下来的章节将检查各种类型的对象。\n\
    \n### 分类类和对象\n\n当你看到一支笔时，你可能会问这个对象属于哪个类。如果你又拿起另一支笔，你就看到了同一个类的类的另一个示例。一个类；多个示例。\n\
    \n所以，当你组织事物时，你指定一个类，类即对象的类型。你可以开始挑选该类的示例（或实例）。每个类可以有多个实例。\n\n### 描述属性和行为\n\n如果你选择了一个类，就可以描述它的特征。你只是在列出该类所有实例的通用特征。也就是说，每支笔都有这些属性。但这些属性的实际值在不同实例之间是不同的。一支笔可能有不同的墨水颜色，但两者可能具有相同的品牌。尽管如此，它们都是\
    \ `Pen` 类的实例。\n\n类中的所有笔共享属性。但这些属性的值在笔与笔之间不同。当你实例化（构建或创建）一个新的 `Pen` 时，你遵循属性列表，为新的笔实例赋予它自己的值。\n\
    \n但所有的笔都有相同的行为：\n\n- 行为 #1：在纸上写字\n- 行为 #2：折断\n- 行为 #3：墨水用尽\n\n与属性不同，行为不会随实例而改变。它们对于每个类都是相同的。\n\
    \n![Tip](img/tip.png) 当你为了构建计算机应用程序描述类时，你正在建模。在之前的示例中，你建模了一个 `Pen` 类。\n\n### 实现类\n\
    \n在 C++ 中实现一个类，你使用 `class` 关键字。然后添加类的名称，例如 `Pen`。接着你添加一个左括号，列出你的属性和行为，并用右括号结束。\n\
    \n![Tip](img/tip.png) 大多数人在 C++ 中会将类名的首字母大写，如果他们的类名是一个单词，他们不会大写剩余字母。尽管你不必遵循这条规则，但许多人确实这样做。你可以为\
    \ C++ 类选择任何名称，只要它不是 C++ 关键字；仅由字母、数字和下划线组成；并且不以数字开头。\n\nListing 7-1 所示的 `PenClass`\
    \ 示例包含了 `Pen.h` 头文件中的 C++ 类描述。本章稍后的访问成员节解释了 `public` 一词。\n\n![Remember](img/remember.png)\
    \ 你可以为一个类创建多个对象（也称为实例）。每个对象都有自己的属性，这些属性是在类中声明的。要访问对象的成员，使用句号（或点）。\n\n### 分离成员函数代码\n\
    \n当你处理函数时，既可以确保函数的代码位于任何调用该调用之前，也可以使用前向引用，也称为函数原型（参见第 4 章）。\n\n"
- fmt: "\nWhen you work with classes and member functions, you have a similar option.\
    \ Most C++ programmers prefer to keep the code for their member functions outside\
    \ the class definition. The reason for placing them outside is to make the code\
    \ easier to read; you don't end up with a single, huge block of code that’s incredibly\
    \ difficult to follow. In addition, someone using the class may not care about\
    \ how the member functions are coded, so keeping their implementations separate\
    \ is the best option. The class definition contains member function prototypes.\
    \ If the function is one or two lines of code, people may leave it in the class\
    \ definition.\n\nA member function prototype would look like this:\n\n```\nvoid\
    \ break_in_half();\n```\n\n[Listing 7-1](#c07.xhtml_c07-fea-0001) shows the header\
    \ file `Pen.h` for class `Pen`.\n\n[LISTING 7-1](#c07.xhtml_rc07-fea-0001) Using\
    \ Member Function Prototypes within Header File Pen.h\n\n```cpp\n#ifndef PEN_H_INCLUDED\n\
    #define PEN_H_INCLUDED\n\nusing namespace std;\n\nenum Color {\n    blue,\n  \
    \  red,\n    black,\n    clear,\n    grey\n};\n\nenum PenStyle {\n    ballpoint,\n\
    \    felt_tip,\n    fountain_pen\n};\n\nclass Pen {\npublic:\n    Color InkColor;\n\
    \    Color ShellColor;\n    Color CapColor;\n    PenStyle Style;\n    float Length;\n\
    \    string Brand;\n    int InkLevelPercent;\n    void write_on_paper(string words);\n\
    \    void break_in_half();\n    void run_out_of_ink();\n};\n\n#endif // PEN_H_INCLUDED\n\
    ```\n\nAfter you write a class’s member function prototype in the header file,\
    \ you write the member function code outside the class definition in a separate\
    \ implementation file. However, you need to throw in the name of the class, so\
    \ that the compiler knows which class this function goes with. You separate the\
    \ class name and function name with a scope resolution operator (`::`) that links\
    \ the functions to the class:\n\n```cpp\nvoid Pen::break_in_half() {\n    InkLevelPercent\
    \ = InkLevelPercent / 2;\n    Length = Length / 2.0;\n}\n```\n\n![Tip](images/tip.png)\
    \ You can use the same member function name in different classes. As are variables\
    \ in different functions, member function names are associated with a particular\
    \ class using the scope resolution operator. Although you don't want to go overboard\
    \ on duplicating function names, if you feel the need to, you can certainly do\
    \ it without a problem. For example, `toString()` is a common function name, and\
    \ you often see it provided with a wide range of classes in your application.\n\
    \n[Listings 7-2](#c07.xhtml_c07-fea-0002) shows the implementation file `Pen.cpp`,\
    \ which has the code that implements each member function of class `Pen`.\n\n\
    [LISTING 7-2](#c07.xhtml_rc07-fea-0002) Implementing the Member Functions of Class\
    \ Pen in Pen.cpp\n\n```cpp\n#include <iostream>\n#include \"Pen.h\"\nusing namespace\
    \ std;\n\nvoid Pen::write_on_paper(string words) {\n    if (InkLevelPercent <=\
    \ 0) {\n        cout << \"Oops! Out of ink!\" << endl;\n    } else {\n       \
    \ cout << words << endl;\n        InkLevelPercent = InkLevelPercent - words.length();\n\
    \    }\n}\n\nvoid Pen::break_in_half() {\n    InkLevelPercent = InkLevelPercent\
    \ / 2;\n    Length = Length / 2.0;\n}\n\nvoid Pen::run_out_of_ink() {\n    InkLevelPercent\
    \ = 0;\n}\n```\n\nMember function `Pen::write_on_paper()` uses member variable\
    \ `InkLevelPercent`, which was declared in header file `Pen.h`. Suppose you call\
    \ this member function for two different objects, as in the following:\n\n```cpp\n\
    FavoritePen.write_on_paper(\"Hello I am a pen\");\nWorstPen.write_on_paper(\"\
    Hello I am another pen\");\n```\n\nThe first of these lines calls `write_on_paper()`\
    \ for the `FavoritePen` object; thus, inside the code for `write_on_paper()`,\
    \ the `InkLevelPercent` refers to `InkLevelPercent` for the `FavoritePen` object.\
    \ But `WorstPen` has its own `InkLevelPercent` property, separate from that of\
    \ `FavoritePen`. So in the second of these two lines, `write_on_paper()` accesses\
    \ the `InkLevelPercent` that lives inside `WorstPen`. In other words, each object\
    \ has its own `InkLevelPercent`. When you call `write_on_paper()`, the member\
    \ function modifies the member variable based on which object you're calling it\
    \ with. The first line calls it with `FavoritePen`. The second line calls it with\
    \ `WorstPen`.\n\nWe've implemented all the member functions from the class in\
    \ a separate source (`.cpp`) file. The header file now just lists prototypes and\
    \ is easier to read. The source file includes the header file at the top. That’s\
    \ required; otherwise, the compiler won’t know that `Pen` is a class name.\n\n\
    [Listing 7-3](#c07.xhtml_c07-fea-0003) source file main.cpp that uses class\n\n\
    ```cpp\n#include <iostream>\n#include \"Pen.h\"\nusing namespace std;\n\nint main()\
    \ {\n    Pen FavoritePen;\n    Pen WorstPen;\n\n    FavoritePen.write_on_paper(\"\
    Hello I am a pen\");\n    WorstPen.write_on_paper(\"Hello I am another pen\");\n\
    \n    FavoritePen.break_in_half();\n    WorstPen.break_in_half();\n\n    return\
    \ 0;\n}\n```\n"
  raw: 'When you work with classes and member functions, you have a similar option.
    Most C++ programmers prefer to keep the code for their member functions outside
    the class definition. The reason for placing them outside is to make the code
    easier to read; you don''t end up with a single, huge block of code that’s incredibly
    difficult to follow. In addition, someone using the class may not care about how
    the member functions are coded, so keeping their implementations separate is the
    best option. The class definition contains member function prototypes. If the
    function is one or two lines of code, people may leave it in the class definition.


    A member function prototype would look like this:


    `void break_in_half();`


    [Listing 7-1](#c07.xhtml_c07-fea-0001) shows the header file `Pen.h` for class
    `Pen`.


    [LISTING 7-1](#c07.xhtml_rc07-fea-0001) Using Member Function Prototypes within
    Header File Pen.h


    `#ifndef PEN_H_INCLUDED`


    `#define PEN_H_INCLUDED`


    `using namespace std;`


    `enum Color {`


    `blue,`


    `red,`


    `black,`


    `clear,`


    `grey`


    `};`


    `enum PenStyle {`


    `ballpoint,`


    `felt_tip,`


    `fountain_pen`


    `};`


    `class Pen {`


    `public:`


    `Color InkColor;`


    `Color ShellColor;`


    `Color CapColor;`


    `PenStyle Style;`


    `float Length;`


    `string Brand;`


    `int InkLevelPercent;`


    `void write_on_paper(string words);`


    `void break_in_half();`


    `void run_out_of_ink();`


    `};`


    `#endif // PEN_H_INCLUDED`


    After you write a class’s member function prototype in the header file, you write
    the member function code outside the class definition in a separate *implementation
    file.* However, you need to throw in the name of the class, so that the compiler
    knows which class this function goes with. You separate the class name and function
    name with a *scope resolution operator* (`::`) that links the functions to the
    class:


    `void Pen::break_in_half() {`


    `InkLevelPercent = InkLevelPercent / 2;`


    `Length = Length / 2.0;`


    `}`


    ![Tip](images/tip.png) You can use the same member function name in different
    classes. As are variables in different functions, member function names are associated
    with a particular class using the scope resolution operator. Although you don''t
    want to go overboard on duplicating function names, if you feel the need to, you
    can certainly do it without a problem. For example, `toString()` is a common function
    name, and you often see it provided with a wide range of classes in your application.


    [Listings 7-2](#c07.xhtml_c07-fea-0002) shows the implementation file `Pen.cpp`,
    which has the code that implements each member function of class `Pen`.


    [LISTING 7-2](#c07.xhtml_rc07-fea-0002) Implementing the Member Functions of Class
    Pen in Pen.cpp


    `#include <iostream>`


    `#include "Pen.h"`


    `using namespace std;`


    `void Pen::write_on_paper(string words) {`


    `if (InkLevelPercent <= 0) {`


    `cout << "Oops! Out of ink!" << endl;`


    `}`


    `else {`


    `cout << words << endl;`


    `InkLevelPercent = InkLevelPercent`


    `- words.length();`


    `}`


    `}`


    `void Pen::break_in_half() {`


    `InkLevelPercent = InkLevelPercent / 2;`


    `Length = Length / 2.0;`


    `}`


    `void Pen::run_out_of_ink() {`


    `InkLevelPercent = 0;`


    `}`


    Member function `Pen::write_on_paper()` uses member variable `InkLevelPercent`,
    which was declared in header file `Pen.h`. Suppose you call this member function
    for two different objects, as in the following:


    `FavoritePen.write_on_paper("Hello I am a pen");`


    `WorstPen.write_on_paper(`


    `"Hello I am another pen");`


    The first of these lines calls `write_on_paper()` for the `FavoritePen` object;
    thus, inside the code for `write_on_paper()`, the `InkLevelPercent` refers to
    `InkLevelPercent` for the `FavoritePen` object. But `WorstPen` has its *own*`InkLevelPercent`
    property, separate from that of `FavoritePen`. So in the second of these two lines,
    `write_on_paper()` accesses the `InkLevelPercent` that lives inside `WorstPen`.
    In other words, each object has its own `InkLevelPercent`. When you call `write_on_paper()`,
    the member function modifies the member variable based on which object you''re
    calling it with. The first line calls it with `FavoritePen`. The second line calls
    it with `WorstPen.`


    We''ve implemented all the member functions from the class in a separate source
    (`.cpp`) file. The header file now just lists prototypes and is easier to read.
    The source file includes the header file at the top. That’s required; otherwise,
    the compiler won’t know that `Pen` is a class name.


    [Listing 7-3](#c07.xhtml_c07-fea-0003) is source file `main.cpp` that uses class
    Pen.


    [LISTING 7-3](#c07.xhtml_rc07-fea-0003) main.cpp Contains Code That Uses the Class
    Pen


    `#include <iostream>`


    `#include "Pen.h"`


    `using namespace std;`


    `int main() {`


    `Pen FavoritePen;`


    `FavoritePen.InkColor = blue;`


    `FavoritePen.ShellColor = grey;`


    `FavoritePen.CapColor = blue;`


    `FavoritePen.Style = ballpoint;`


    `FavoritePen.Length = 5.5;`


    `FavoritePen.Brand = "Office Depot";`


    `FavoritePen.InkLevelPercent = 30;`


    `Pen WorstPen;`


    `WorstPen.InkColor = red;`


    `WorstPen.ShellColor = red;`


    `WorstPen.CapColor = black;`


    `WorstPen.Style = fountain_pen;`


    `WorstPen.Length = 5.0;`


    `WorstPen.Brand = "Parker";`


    `WorstPen.InkLevelPercent = 60;`


    `cout << "This is my favorite pen" << endl;`


    `cout << "Color: " << FavoritePen.InkColor`


    `<< endl;`


    `cout << "Brand: " << FavoritePen.Brand << endl;`


    `cout << "Ink Level: "`


    `<< FavoritePen.InkLevelPercent`


    `<< "%" << endl;`


    `FavoritePen.write_on_paper("Hello I am a pen");`


    `cout << "Ink Level: "`


    `<< FavoritePen.InkLevelPercent`


    `<< "%" << endl;`


    `return 0;`


    `}`


    There are two variables of class `Pen: FavoritePen` and `WorstPen`. To access
    the properties of these objects, you type the name of the variable holding the
    object, a dot, and then the member variable. For example, to access the `InkLevelPercent`
    member of `WorstPen`, you type the following:


    `WorstPen.InkLevelPercent = 60;`


    You can also run some of the member functions that are in these objects. This
    code calls:


    `FavoritePen.write_on_paper("Hello I am a pen");`


    This called the function `write_on_paper()` for the object `FavoritePen`.


    The output of the program is


    `This is my favorite pen`


    `Color: 0`


    `Brand: Office Depot`


    `Ink Level: 30%`


    `Hello I am a pen`


    `Ink Level: 14%`


    You should notice something about the color line. Here''s the line of code that
    writes it:


    `cout << "Color: " << FavoritePen.InkColor << endl;`


    This line outputs the `InkColor` member for `FavoritePen`. But what type is `InkColor`?
    It''s the new `Color` enumerated type. The property’s value was set by the assignment
    statement:


    `FavoritePen.InkColor = blue;`


    As explained in [Chapter 2](#c02.xhtml), the enumeration value `blue` is stored
    as integer `0`, so the `cout` statement prints `"Color: 0"`.


    ![Remember](images/remember.png) You can create several *objects* (also called
    *instances*) of a single class. Each object gets its own properties, which you
    declare in the class. To access the members of an object, you use a period (or
    dot).


    ### Identifying the parts of a class


    Here''s a summary of the parts of a class and the different ways classes can work
    together:


    *   **Class:** A *class* is a type. It includes member variables to specify its
    properties and member functions to define its behaviors.


    *   **Object:** An *object* is an instance of a class.


    *   **Class definition:** The *class definition* describes the class. It starts
    with the word `class` and then has the name of the class, followed by an open
    brace and closing brace. Inside the braces are the members of the class.


    *   **Property:** A *property* is a characteristic of a class, such as a color,
    style, or other descriptive element. You use member variables to specify the properties.
    Each instance of the class gets its own copy of each property.'
