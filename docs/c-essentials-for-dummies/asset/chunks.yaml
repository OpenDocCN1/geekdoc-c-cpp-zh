    \ << endl;\n}\n```\n\n注意函数头出现在 `main()` 之上并以分号结束。接下来是 `main()`。最后，你看到了 `PrintName()`\
    \ 函数本身（再次带有函数头，但这次没有分号）。因此，函数位于 `main()` 之后。\n\n如果你有一个包含（例如）20 个函数的源文件，而这些函数又都在相互调用，那么要仔细安排它们的顺序，使得每个函数*仅*调用其在源文件中位于上方的函数，可能是困难的。相反，大多数程序员会按照逻辑顺序放置函数，而不会太担心调用顺序。然后，他们将所有函数原型都放在源文件的顶部，如最后一个代码块所示。\n\
    \n![Tip](img/tip.png) 当你输入一个函数原型时，许多人说你正在指定一个 `forward reference`（前向引用）。这个术语简单意味着你正在为稍后发生的内容提供引用。\n\
    \n## 编写同一个函数的两个版本\n\n有时你可能想编写同一个函数的两个版本，区别在于它们接受不同的参数类型。例如，你可能想要一个名为 `Combine()`\
    \ 的函数。一个版本接受两个字符串并将它们合并，但在中间留有一个空格。然后它将结果字符串打印到控制台。另一个版本相加两个数字并将三个数字——前两个和和——写入控制台。第一个版本看起来如下所示：\n\
    \n```cpp\nvoid Combine(string first, string second)\n{\n    cout << first << \"\
    \ \" << second << endl;\n}\n```\n\n该函数的代码打印了两个中间带有空格的字符串。另一个版本相加两个数字并将三个数字——前两个和和——写入控制台：\n\
    \n```cpp\nvoid Combine(int first, int second)\n{\n    int sum = first + second;\n\
    \    cout << first << \" \" << second << \" \" << sum << endl;\n}\n```\n\n## 调用所有字符串函数\n\
    \n为了充分利用字符串，你需要使用一些特殊函数。然而，使用这些函数与迄为止的函数稍有不同。你不再是直接调用函数，而是先输入持有字符串的变量名，然后是一个点，紧接着是函数名以及任何参数。\n\
    \n### 将字符串插入到字符串中\n\n你可以使用的函数之一是 `insert()`。如果你想在另一个字符串中插入更多字符，就可以使用这个函数。例如，如果你有一个字符串\
    \ `\"Something interesting and bizarre\"`，并且你从索引 10 开始在其中间插入字符串 `\"seriously \"\
    `（末尾带空格），你将得到字符串 `\"Something seriously interesting and bizarre\"`。\n\n![Tip](img/tip.png)\
    \ 当你处理字符串时，第一个字符是索引 0，第二个字符是索引 1，依此类推。接下来的几行代码使用 `insert()` 函数在索引 `10` 处执行插入，尽管你是在第\
    \ 11 个字母处进行插入：\n\n```cpp\nstring words = \"Something interesting and bizarre\"\
    ;\nwords.insert(10, \"seriously \");\n```\n\n第一行仅仅是创建一个名为 `words` 的字符串，并将其填充为短语\
