    Then you call `new` with an `int` type, which returns a pointer to an integer.
    You save that return value in the `ptr` variable.


    You save a `10` in the memory that `ptr` points to. And then you print the value
    stored in the memory that `ptr` points to.


    To see for yourself that `ptr` is pointing to a memory location and not the actual
    value of `10`, the code also prints `ptr` without *dereferencing* it (using the
    `*` operator). The output is a hexadecimal value such as `0x9caef0`, but this
    output will change each time because the memory allocation occurs in a different
    location on the heap each time.


    As you can see, `ptr` contains the address of the value allocated by the `new`
    operator. The only way you can access it is through the pointer.


    ![Remember](images/remember.png) When you call `new`, you get back a pointer.
    This pointer is of the type that you specify in your call to `new`. You can then
    store the pointer only in a pointer variable of the same type.


    ![Tip](images/tip.png) When you use the `new` operator, the usual terminology
    is that you are *allocating memory on the heap.*


    By using pointers to access memory on the heap, you can take advantage of many
    interesting C++ features. For example, you can use pointers along with something
    called an array. An *array* is simply a large storage bin that has multiple slots,
    each of which holds one item. ([Chapter 8](#c08.xhtml) discusses arrays.) If you
    set up an array that holds pointers, you can store all these pointers without
    having to name them individually. And these pointers can point to complex things,
    called *objects.* You could then pass all these variables (which could be quite
    large, if they''re strings) to a function by passing only the array, not the strings
    themselves. That step saves memory on the stack.


    In addition to objects and arrays, you can have a function allocate memory and
    return a variable pointing to that memory. Then, when you get the variable back
    from the function, you can use it, and when you finish with the variable, delete
    it (freeing the memory). Finally, you can pass a pointer into a function. When
    you do so, the function can actually modify the data the pointer references for
    you. (See “[Passing Pointer Variables to Functions](#c06.xhtml_c06-sec-0022)”
    and “[Returning Pointer Variables from Functions](#c06.xhtml_c06-sec-0025),” later
    in this chapter for details.)


    ### Using an initializer


    When you call `new`, you can provide an initial value for the memory you’re allocating.
    For example, when allocating a new integer, you can also store the number `10`
    in the integer. The `Initializer` example shown in [Listing 6-8](#c06.xhtml_c06-fea-0008)
    demonstrates how to do this.


