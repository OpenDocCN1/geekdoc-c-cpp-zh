    [LISTING 5-5](#c05.xhtml_rc05-fea-0005) Containing the Actual Function Code


    `#include <iostream>`


    `using namespace std;`


    `string SafeCracker(int SafeID)`


    `{`


    `if (SafeID == 12)`


    `return "13-26-16";`


    `else`


    `return "Safe Combination Unknown";`


    `}`


    Before you compile this application, you need to know a few things about how the
    compilation process works:


    *   When you compile a `.cpp` file, the compiler outputs a `.o` (for object) file
    that is then linked by the linker with all the other `.o` files to create an executable
    (Windows will automatically name this with a `.exe` extension) file. In addition
    to the `.o` files from your project, the linker also links in any library files
    or external code that your application accesses.


    *   The compiler doesn''t compile the header file into a separate `.o` file. With
    the application in [Listings 5-3](#c05.xhtml_c05-fea-0003) through [5-5](#c05.xhtml_c05-fea-0005),
    the compiler creates only two output files: `main.o` and `safestuff.o`.


    *   When the compiler reads the `main.cpp` file and reaches the `#include "safestuff.h"`
    line for the header file, it verifies that it hasn''t read the `safestuff.h` file
    before and included it within the `.o` file.


    *   If the `safestuff.h` file hasn''t been read before, the compiler temporarily
    switches over and reads the header file, pretending that it’s still reading the
    same `main.cpp` file. As it continues, it compiles everything as if it’s all part
    of the `main.cpp` file.


    ![Remember](images/remember.png) If you include the `safestuff.h` header file
    in other source code files, the compiler adds the content to those source files
    as well. Compile and run the code in [Listings 5-3](#c05.xhtml_c05-fea-0003) through
    [5-5](#c05.xhtml_c05-fea-0005). When you run the application, you see the following
    output:


    `Surprise, surprise!`


    `The combination for Safe 12 is:`


    `13-26-16`


    `Let''s check on Safe 11 too:`


    `Safe Combination Unknown`


    ![Tip](images/tip.png) If you have a source file containing some functions, creating
    a header file that contains the associated function prototypes is generally a
    good practice. Then you can name the header file the same as the source file,
    except with a different extension. In this example, you use the `safestuff.h`
    file to hold the prototype for the `safestuff.cpp` file.


    ### Adding the header only once


    Adding a header twice is an error because then you''d define the forward reference
    for a function twice. The section “[Using the Mysterious Header Wrappers](#c05.xhtml_c05-sec-0015),”
    later in this chapter, describes how to ensure a header is added only once.


    ### Using angle brackets or quotes


    You may have noticed something about the code in [Listing 5-3](#c05.xhtml_c05-fea-0003).
    When including the `safestuff.h` file, you don’t put it inside angle brackets,
    as with the `#include <iostream>` line. Instead, you put it inside quotes:


    `#include "safestuff.h"`


    That''s because programmers for years have been fighting over the rules of *where*
    exactly on the hard drive to put the header files. The question is whether to
    put them in the same directory or folder as your project or to place them in a
    directory all by themselves.


    ![Remember](images/remember.png) Regardless of where you put your header files,
    here is the rule for when to use quotes and when to use brackets: The compiler
    looks in several directories or folders to find header files. And it can, possibly,
    look in the same directory as the source file. If you use angle brackets (that
    is, less-than and greater-than signs), as in `#include <string>`, the compiler
    doesn’t look in the same directory as the source file. But if you use double quotes,
    as in `#include "safestuff.h"`, the compiler *first* looks in the same directory
    or folder as the source file. And if the compiler doesn''t find the header file
    there, it looks in the remaining directories or folders, as it would with angle
    brackets.


    If you start working on a large C++ project, you’ll probably find that project
    managers use the rule of always using angle brackets. For large projects, this
    is typically the best policy.


    ![Tip](images/tip.png) If you try to compile and you get a `No such file or directory`
    error on the `#include` line, it''s probably because you put the header file in
    a source file directory or folder but used angle brackets instead of double quotes.
    Try switching that line to double quotes.


    ## Sharing Variables among Source Files


    When you declare a variable inside a function, it remains local to the function.
    But you may want functions to share a single *global* variable: One function may
    store something, and another may read its contents and write it to the console.
    To do this, declare the global variable outside a function. Declaring the global
    variable inside a source file works until you try to share it among multiple source
    files. If you’re not careful, the source files end up with a separate copy of
    the global variable.


    There’s a trick to making this work. Declare the variable inside one and only
    one of the source files. Then you declare it *again* inside one (and only one)
    header file, but you precede it with the word `extern`, as in `extern int DoubleCheeseburgers;`.


    The `GlobalVariable` example (shown in [Listings 5-6](#c05.xhtml_c05-fea-0006),
    [5-7](#c05.xhtml_c05-fea-0007), and [5-8](#c05.xhtml_c05-fea-0008)) demonstrates
    the use of a single global variable that is shared among multiple source files.


    [LISTING 5-6](#c05.xhtml_rc05-fea-0006) Making Use of a Global Variable


