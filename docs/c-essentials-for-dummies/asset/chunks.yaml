    当你编写应用程序时，你需要指定你想要使用一个或多个称为 `variables`（变量）的存储桶。每个计算机存储桶同时只能存放一个值。变量简单来说就是一个带有关联名称的存储桶。


    你可以向你的 `variables` 中放入许多不同类型的值。例如，你可以向存储桶中放入数字，也可以向存储桶中放入一个字符串。（然而，每个存储桶包含一种特定类型的数据——你不能将数字放入一个专为字符串设计的存储桶中。）至于数字，它们可以是
    `integers`（整数，即正整数、负整数和 0），也可以是带有小数点的数字，例如 3.11 或 10.0，这些数字（由于各种原因）被称为 `floating-point
    numbers`（浮点数）。


    ![记住这一点](img/remember.png) `floating-point number` 一词是指带有小数点且小数点右侧有内容的数字（即使右侧只是一个
    0）。当你看到 `floating point`（浮点）这个词时，可以通过关注名称中的 `point`（点）这个词来记住它的含义——当你看到 `point`
    时，就想小数点。


    ### 创建整数变量


    在你的 C++ 应用程序中，你可以轻松地编写一行代码创建一个变量。虽然变量在运行应用程序之前实际上并没有被创建，但人们通常将这个过程称为 `creating
    a variable`。变量有三个方面：


    *   **Name（名称）：** 每个变量都必须有一个名称。在你的应用程序中，你通过这个名称引用变量。例如，你可能有一个名为 `count` 的变量，可能有一个名为
    `LastName` 的变量。

    *   **Type（类型）：** 创建变量时，你必须指定该变量可以包含的值类型。例如，一个变量可以包含一个整数，另一个变量可以包含一个字符。在你的应用程序为变量选择好类型后，你只能向变量中放入该类型的值。

    *   **Value（值）：** 在任何时刻，一个简单的变量都包含单个值。（第 8 章 描述了可以包含多个值的 `array`（数组）变量。）例如，整数变量可以包含数字
    `10`，字符变量可以包含字符 `a`。


    当你指定变量的类型和名称时，你就是在 `declare`（声明）一个变量。这被称为 `variable declaration`（变量声明）。


    这里显示的 `SimpleVariable` 示例代码演示了如何创建一个变量：


    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    int mynumber;

    mynumber = 10;

    cout << mynumber << endl;

    return 0;

    }

    ```


    这是一个你可以运行的完整应用程序。


    仔细观察这段代码。记住，计算机从 `main()` 之后的大括号内的代码开始，并逐行执行代码。


    `main` 内部的第一行看起来这样：


    ```cpp

    int mynumber;

    ```


    当你声明变量时，你指定的第一个变量可以包含的内容的类型。在这里，你使用了 `int` 这个词。这个词是 C++ 中 `integer`（整数）的单词。因此，你声明的变量可以包含一个整数。接下来是变量的名称。这个变量名为
    `mynumber`。然后用分号结束变量声明。


    下一行看起来这样：


    ```cpp

    mynumber = 10;

    ```


    这一行将值 `10` 放入变量中。因为你已经知道该变量可以包含整数，所以你被放入 `10`，因为它是一个整数。如果你尝试向变量中放入整数以外的值，编译器将给你一条错误消息。编译器确保你只向变量中放入相同类型的值。当然，你注意到该语句以分号结束。在
    C++ 中，每条语句都以分号结束。


    ![记住这一点](img/remember.png) 要向变量放入值，你输入变量的名称、等号（周围是可选空格）和值。用分号结束行。这行代码是一个 `assignment
    statement`（赋值语句）。或者你可以说你正在 `setting`（设置）变量的值。


    下一行是这一句：


    ```cpp

    cout << mynumber << endl;

    ```


    这是一个 `cout` 语句，意味着它在控制台上写入某些内容。这段代码告诉计算机在控制台上写入 `mynumber` 的值。上一行代码在存储桶中放入了 `10`，所以这一行在控制台上打印了
    `10`。`endl` 的意思是“end line”（换行），所以 `10` 独占一行打印。当你运行应用程序时，你会看到这个：


    ```

    10

    ```


    ![提示](img/tip.png) 可以可以这样想：当你输入变量名称时，你是在访问该变量。例外情况是变量名称出现在等号左侧。在这种情况下，你是在设置变量。你可以对变量做两件事：


    *   **Setting the variable（设置变量）：** 你可以设置一个变量，这意味着你可以向存储桶放入一个值。

    *   **Retrieving the value（获取值）：** 你可以获取变量内部的值。当你这样做时，该值仍然留在变量内部。


    ![记住这一点](img/remember.png) 当你获取变量中的值时，你并没有将其从变量中移除。该值仍在变量内部。


    ### 声明多个变量


    如果你想声明多个变量，可以在一个语句中完成。例如，如果你想声明名为 `monica`、`rachel` 和 `phoebe` 的整数变量，可以使用以下代码：


    ```cpp

    int monica, rachel, phoebe;

    ```


    然后你可以为它们单独赋值：


    ```cpp

    monica = 10;

    rachel = 20;

    phoebe = 30;

    ```


    ![记住这一点](img/remember.png) 当你运行应用程序时，计算机按照它们出现的顺序执行语句。因此，在前面的代码中，计算机首先创建存储桶。然后将
    `10` 放入 `monica`。接下来，`rachel` 得到 `20`。最后，`phoebe` 得到 `30`。


    ### 修改值


    虽然变量一次只能包含一个值，但你仍然可以改变它的内容。向变量放入另一个值后，它会忘记之前的值。


    你像最初放入值一样向变量放入另一个值。仔细观察 `ChangeVariable` 示例的代码：


    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    int mynumber;

    mynumber = 10;

    cout << mynumber << endl;

    mynumber = 20;

    cout << mynumber << endl;

    return 0;

    }

    ```


    ![记住这一点](img/remember.png) 当你看到单独的等号时，左侧是接收右侧值的变量。


    ### 将一个变量赋值给另一个


    因为你对变量只能直接做两件事——放入内容和获取值——将一个变量赋值给另一个是获取一个变量的值并将其放入另一个的简单过程。这个过程通常被称为从一个变量到另一个变量的
    `copying`（复制）。例如，如果你有两个整数变量——假设为 `start` 和 `finish`——你想将 `start` 的值复制到 `finish`，你将使用如下代码：


    ```cpp

    finish = start;

    ```


    ![警告](img/warning.png) 不要让语言误导你。尽管你想将 `start` 的值复制到 `finish`，但注意你首先输入的是 `finish`，然后是等号，最后是
    `start`。等号左侧是*接收*值的变量。


    ![记住这一点](img/remember.png) 当你将一个变量的值复制到另一个变量时，这两个变量必须类型相同。例如，你不能将字符串变量的值复制到整数变量中。如果你尝试这样做，编译器会发出错误消息。


