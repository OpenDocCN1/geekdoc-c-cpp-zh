    \ 或 DVD 等媒体，您可以在 [`http://booksupport.wiley.com`](http://booksupport.wiley.com)\
    \ 下载这些材料。有关 Wiley 产品的更多信息，请访问 [`www.wiley.com`](http://www.wiley.com)。\n\n美国国会图书号可从出版处获取。\n\
    \nISBN 978-1-394-30788-3 (pbk); ISBN 978-1-394-30790-6 (ebk); ISBN 978-1-394-30789-0\
    \ (ebk)\n\n# 介绍\n\n欢迎阅读 *C++ Essentials For Dummies*。本书包含了你开始学习 C++ 编程所需的的基础信息。你将学习如何安装和运行编译器、编写程序，并使用数组、类和指针等重要的\
    \ C++ 特性来良好的面向对象编程。\n\nC++ 是一门庞大且复杂的语言。但无论你只是开始学习编程，还是其他编程语言的专家，本书包含了该语言的精要，能让你快速成为一名\
    \ C++ 程序员。\n\n## 关于本书\n\n*C++ Essentials For Dummies* 包含了你开始编写 C++ 程序所需的信息。你可以使用最新的\
    \ C++ 20 版本编译器编译并运行示例程序，也可以使用较早的 C++ 14 和 C++ 17 版本。\n\n本书并不是 C++ 的全面参考书。若想超出本书涵盖的内容，你的下一本书应该是\
    \ John Paul Mueller 编写的 *C++ All-in-One For Dummies* 第 4 版（本书正是源自该书）。然而，本书将通过其易于遵循的\
    \ *For Dummies* 格式让你快速上手。\n\n## 愚人假设\n\n我们对你（即读者）做了一些基本的假设：\n\n* **你拥有或可以访问一台相当现代的计算机。**\
    \ C++ 示例程序在 Windows 电脑上测试过，但本书展示了如何在 Mac 或 Linux 电脑上同样轻松地编译和运行它们。\n* **你是一位丰富的电脑用户。**\
    \ 换说，我们假设你了解使用电脑的基础知识，例如启动程序和处理文件系统。\n* **你对学习如何用 C++ 语言编写程序感兴趣。** 这是本书的主题，所以这是一个合理的假设。\n\
    \n我们**并不**假设你具有任何 C++ 或任何其他编程语言的先验经验。\n\n## 书中使用的图标\n\n与任何 *For Dummies* 系列书籍一样，本书充满了实用的图标，用于引导你注意特别重要的内容。你可以在书中各找到以下图标：\n\
    \n![Warning](img/warning.png) 危险！此图标突出了可能帮助你规避灾难的信息。\n\n![Remember](img/remember.png)\
    \ 我们告诉过你我们上过的那个内存课程吗？\n\n![Tip](img/tip.png) 特别注意此图标；它让你知道这里有一些特别实用的窍门。\n\n##\
