  trans: "\n在 C++ 中，你可以创建类的层级结构。当你取一个类并在其下方创建一个新类时（例如从 `Vehicle` 创建 `Toyota`），你正在派生（deriving）一个新类，这意味着在层级结构中\
    \ `Toyota` 是 `Vehicle` 的子类（child）。\n\n要从现有类派生一个类，你可以像编写任何其他类一样编写新类，但在类名后使用冒号（:`）扩展头文件，加上\
    \ `public` 关键字以及你要派生的类，如下类头行所示：\n\n```cpp\nclass Toyota : public Vehicle {\n```\n\
    \n当你这样做时，你创建的类（`Toyota`）会继承（inherits）来自父类（`Vehicle`）的成员变量和成员函数。例如，如果 `Vehicle`\
    \ 有一个名为 `NumberOfWheels` 的公共成员变量和一个名为 `Drive()` 的公共成员函数，那么 `Toyota` 类拥有这些成员，尽管你没有在\
    \ `Toyota` 中编写这些成员。\n\nListing 7-9 显示的 `VehicleClass` 示例演示了类的继承。它从一个名为 `Vehicle`\
    \ 的类和一个名为 `Toyota` 的派生类开始。你在 `main()` 中创建了 `Toyota` 的实例并并该实例调用了两个成员函数：`MeAndMyToyota()`\
    \ 和 `Drive()`。`Toyota` 类定义并没有显示 `Drive()` 函数。`Drive()` 函数是从 `Vehicle` 类继承的。你可以像调用\
    \ `Toyota` 类的成员一样调用此函数，因为在许多方面它确实就是。\n\n### LISTING 7-9 从一个类派生另一个类\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nclass Vehicle {\npublic:\n  int\
    \ NumberOfWheels;\n  void Drive() {\n    cout << \"Driving, driving, driving…\"\
    \n    << endl;\n  }\n};\n\nclass Toyota : public Vehicle {\npublic:\n  void MeAndMyToyota()\
    \ {\n    cout << \"Just me and my Toyota!\" << endl;\n  }\n};\n\nint main() {\n\
    \  Toyota MyCar;\n  MyCar.MeAndMyToyota();\n  MyCar.Drive();\n  return 0;\n}\n\
    ```\n\n当你运行此程序时，你会看到来自两个函数的输出：\n\n`Just me and my Toyota!`\n`Driving, driving,\
    \ driving…`\n\n### 覆盖成员函数（Overriding member functions）\n\n函数的签名（signature）包括它的函数名以及参数的数量、数据类型和顺序。（参数名称不是签名的一部分。）子类可以通过定义一个具有相同签名的成员函数来覆盖（override）父类的成员函数。这允许子类取代其父类的某种行为。\n\
    \n在 Listing 7-10 中，`Item` 类定义了一个 `print_cost()` 成员函数，该函数打印普通商品的价格（price）乘以数量（quantity）。你必须将该函数指定为虚函数（virtual），以便允许该类的子类对其进行覆盖。当一个类具有虚函数时，它也必须具有虚析构函数，即使它只有一个空块：\n\
    \n```cpp\nvirtual ~Item() {}\n```\n\n子类 `DiscountedItem` 有一个私有成员 `discount`。它的\
    \ `print_cost()` 成员函数与 `Item` 的签名相同，因此它覆盖了它。它的行为是不同的，因为它的成本包含了折扣。注意函数头中指定的 `override`。同样，子类\
    \ `DonatedItem` 的 `print_cost()` 成员函数覆盖了 `Item` 的成员函数。它只是打印 0。\n\n### LISTING\
    \ 7-10 覆盖函数\n\n```cpp\n#include <iostream>\n#include <string>\n\nusing namespace\
    \ std;\n\nclass Item {\npublic:\n  virtual ~Item() {}\n  virtual void print_cost(double\
    \ price, int quantity) {\n    cout << \"Regular cost = \" << price*quantity <<\
    \ endl;\n  }\n};\n\nclass DiscountedItem: public Item {\npublic:\n  DiscountedItem(double\
    \ d) : discount(d) {}\n  virtual ~DiscountedItem() {}\n  void print_cost(double\
    \ price, int quantity) override {\n    cout << \"Discounted cost = \" << price*(1\
    \ - discount) << endl;\n  }\nprivate:\n  double discount;\n};\n\nclass DonatedItem:\
    \ public Item {\npublic:\n  virtual ~DonatedItem() {}\n  void print_cost(double\
    \ price, int quantity) override {\n    cout << \"Donated cost = \" << 0 << endl;\n\
    \  }\n};\n\nint main() {\n  Item regular_item;\n  DiscountedItem discounted_item(0.25);\n\
    \  DonatedItem donated_item;\n  regular_item.print_cost(2.99, 3);\n  discounted_item.print_cost(2.99,\
    \ 3);\n  donated_item.print_cost(2.99, 3);\n  return 0;\n}\n```\n\n程序的输出为：\n`Regular\
    \ cost = 8.97`\n`Discounted cost = 6.7275`\n`Donated cost = 0`\n\n### 生成随机数\n\n\
    C++ 的 `rand()` 函数使用一种算法来生成伪随机（pseudo-random）正整数值。调用 `rand()` 的程序在每次运行时都会获得相同的伪随机值序列。然而，你可以调用函数\
    \ `srand()` 为算法设置一个不同的种子值以获得不同的序列。常见的种子值是调用函数 `time(0)` 的结果，它返回当前的秒数时间。然后每当你运行程序时，种子值都是不同的，因此你将得到不同的序列。\n\
    \nListing 7-11 显示了获取伪随机值的两种不同方法。注意你必须包含 `cstdlib` 和 `ctime`。\n\n### LISTING 7-11\
    \ 伪随机数\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n#include <ctime>\n\n\
    using namespace std;\n\nint main() {\n  srand(time(0));\n  for (int i = 0; i <\
    \ 4; i++) {\n    cout << \" \" << rand();\n  }\n  cout << endl;\n  for (int i\
    \ = 0; i < 4; i++) {\n    cout << \" \" << rand()%3;\n  }\n  cout << endl;\n \
    \ return 0;\n}\n```\n\n每个 `for` 循环通过调用 `rand()` 生成并打印四个伪随机值。第二个 `for` 循环使用 `%`\
    \ 运算符将值限制在 0、1 或 2 内。示例输出如下：\n\n`1794106847 735890002 744940541 386010577`（仅示例）\n\
    \n对 `srand()` 的调用使得每次运行程序时的输出都不同。\n\n### 使用多态（Using polymorphism）\n\n多态（Polymorphism）是一项重要的面向对象特性。当程序在运行时对对象的成员函数进行调用时，多态会根据实例化对象的类动态地决定调用哪个函数。\n\
    \nListing 7-12 显示了 Listing 7-10 中程序的修改版本。超类类 `Item` 及其子类 `DiscountedItem` 和 `DonatedItem`\
    \ 保持不变。\n\n### LISTING 7-12 多态\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n\
    #include <ctime>\n\nusing namespace std;\n\nclass Item …;\nclass DiscountedItem:\
    \ public Item …;\nclass DonatedItem: public Item …;\n\nint main() {\n  Item *regular_ptr\
    \ = new Item;\n  DiscountedItem *discounted_ptr = new DiscountedItem(0.25);\n\
    \  DonatedItem *donated_ptr = new DonatedItem;\n  srand(time(0));\n  for (int\
    \ i = 0; i < 10; i++) {\n    int r = rand()%3;\n    Item *item_ptr;\n    switch\
    \ (r) {\n      case 0: item_ptr = regular_ptr; break;\n      case 1: item_ptr\
    \ = discounted_ptr; break;\n      case 2: item_ptr = donated_ptr; break;\n   \
    \ }\n    item_ptr->print_cost(2.99, 3);\n  }\n  return 0;\n}\n```\n"
