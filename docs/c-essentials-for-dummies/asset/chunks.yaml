    ## Making Your Code More Readable with Enumerations


    Suppose you want to create a variable that holds the color `green`. Using the
    standard types of integers, floating-point numbers, characters, and letters, you
    don''t have a lot of choices. You could just pick a number to represent each color
    and store that number in a variable. Or, you could have saved a string, as in
    `"green"`. But C++ presents a better alternative. It’s called an *enumeration,*
    which mates a human-understandable name like `green` to a computer-friendly value
    like `2`*.*


    ![Remember](images/remember.png) For each type, there''s a list of possible values.
    An integer, for example, can be a whole number within a particular range. Strings
    can be any characters, all strung together. But what if you want a value called
    `blue`? Or `red`? Or even `beige`? Then you need an *enumeration type.*


