  trans: "\n有时候，你可能会编写一个包含循环的应用，该循环的功能不仅仅是简单的数字相加。你可能会发现，你希望循环根据循环声明之外的条件结束。或者，你可能希望当正在处理的项目在某些方面出错时，循环突然跳出当前循环并继续处理循环中的下一个项目。当你停止循环并继续执行循环后的代码时，你使用\
    \ `break` 语句。当你退出循环的当前周期并继续下一个周期时，你使用 `continue` 语句。接两个部分将向你展示如何。\n\n![记住](img/remember.png)\
    \ 尽管后续章节中的示例依赖于 `for` 循环，但 `break` 和 `continue` 语句适用于 `while` 和 `do-while` 循环。\n\
    \n### 跳出 (Breaking)\n\n假设你正在编写一个通过互联网读取数据的应用程序，循环运行次数取决于预期的数据量。但在处理过程中间，你遇到了一些带有错误的数据，并且你想立即退出\
    \ `for` 循环。\n\nC++ 包含了一个实用的短语句，可以在这种情况下救你。该语句被称为 `break`。它能让你跳出循环。\n\n接下来的 `ForLoop3`\
    \ 示例演示了这种技术。此示例检查了 `i` 等于 `5` 的特殊情况。你可以通过更改 `for` 循环的结束条件来实现相同的结果，但至少它向你展示了 `break`\
    \ 语句是如何工作的。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n  for (int i=0; i<10; i++)\n  {\n    cout << i << \" \";\n    if (i == 5)\n\
    \    {\n      break;\n    }\n    cout << i * 2 << endl;\n  }\n  cout << \"All\
    \ Finished!\" << endl;\n  return 0;\n}\n```\n\n在前面的代码中，`for` 循环内部的第一行 `cout <<\
    \ i << \" \";` 在 `i` 为 `5` 时运行。但 `for` 循环的最后一行 `cout << i * 2 << endl;` 在 `i`\
    \ 为 `5` 时不会运行，因为你告诉它在两个 `cout` 语句之间跳出循环。\n\n还要注意，当你跳出循环时，应用程序并没有退出。它会继续执行循环之后的语句。在这种情况下，它仍然会打印消息\
    \ `\"All Finished!\"`。\n\n### 继续 (Continuing)\n\n除了可能需要因为特殊情况跳出循环的情况外，你还可以让循环结束当前的迭代；但不是跳出循环，而是从下一次迭代恢复。\n\
    \n要实现这个技巧，你使用一种名为 `continue` 的 C++ 语句。`continue` 语句表示：“结束当前迭代，但通过下次迭代继续运行循环。”\n\
    \n接 `ForLoop4` 示例显示了 跳出 部分中之前示例的稍修改版本。当循环到达 `5` 时，它不会执行第二行 `cout`。但它并没有跳出循环，而是继续执行\
    \ `6`，然后是 `7`，依此类推，直到循环自行完成：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main()\n{\n  int i;\n  for (i=0; i<10; i++)\n  {\n    cout << i << \" \";\n\
    \    if (i == 5)\n    {\n      cout << endl;\n      continue;\n    }\n    cout\
    \ << i * 2 << endl;\n  }\n  cout << \"All Finished!\" << endl;\n  return 0;\n\
    }\n```\n\n### 嵌套循环 (Nesting Loops)\n\n`嵌套循环` 简单就是循环内部的循环。假设你想将 1 到 10 的每个数字乘以\
    \ 1，并打印每次乘法的答案，然后你想将 1 到 10 的每个数字乘以 2 并打印每次乘法的答案，依此类推，直到乘数达到 10。你的 C++ 代码看起来就像\
    \ `ForLoop5` 示例所示：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n  for (int x = 1; x <= 10; x++)\n  {\n    cout << \"Products of \" << x <<\
    \ endl;\n    for (int y = 1; y <= 10; y++)\n    {\n      cout << x * y << endl;\n\
    \    }\n    cout << endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，你有一个循环内部包含一个循环。内层循环可以使用外部循环的\
    \ `x`。是的，你可以实现循环套循环套循环套循环。你也可以将任何循环放在任何其他循环内部，例如在 `for` 循环内部嵌套 `while` 循环。\n\n\
    注意你在内层循环之前之后都调用了 `cout`。你可以这样做；内层循环不必是外部循环内部的唯一语句。\n\n![警告](img/warning.png) 虽然你确实可以在循环套循环套循环套循环，但嵌套得越深，你的代码越可能令人困惑。\n\
    \n### 使用 switch 语句 (Using Switch Statements)\n\n在编程中很多时候，你可能想将一个变量与多个值进行比较。如果你有复杂的比较，你应该使用复合\
    \ `if` 语句。`switch` 语句将单个变量与多个项进行比较。要使用 `switch` 语句，你输入 `switch`，然后是你想要测试的变量或表达式。\n\
    \n![记住](img/remember.png) `switch` 语句将单个变量与多个项进行比较。如果你有复杂的比较，你应该使用复合 `if` 语句。这是一个完整的\
    \ `switch`：\n\n```cpp\nint x;\ncin >> x;\nswitch (x)\n{\n  case 1:\n    cout <<\
    \ \"It's 1!\" << endl;\n    break;\n  case 2:\n    cout << \"It's 2!\" << endl;\n\
    \    break;\n  default:\n    cout << \"It's something else!\" << endl;\n    break;\n\
    }\n```\n\n在 `switch` 语句的头部行之后，你列出想要与表达式比较的值。每个项目以单词 `case` 开头，后面跟着与表达式比较的值，然后是一个冒号。接下来是在表达式匹配此情况时运行的代码。为了完成一个特定的\
    \ `case`，你添加单词 `break`。`switch` 语句中的每个 `case` 通常都有一个 `break` 行，它结束 `case`。如果你漏掉了\
    \ `break` 语句（无论是故意还是无意），当计算机运行此 `case` 时，执行将继续执行下一个 `case` 语句的代码。\n\n![提示](img/tip.png)\
    \ 注意示例 `switch` 块的结尾有一个最后的 `default` 情况。它适用于之前的所有情况都不成立的情况。`default` 情况不是强制的；如果你不需要它，可以省略它。但是，如果你确实包含了它，你应该把它放在\
    \ `switch` 块的末尾，因为它是捕获所有情况的情况。\n\n"
- fmt: "\nThe following `SwitchStatement` example is a complete application that demonstrates\
    \ a `switch` statement. It also shows you how you can make a simple, antiquated-looking\
    \ menu application on the console. You don't need to press Enter after you choose\
    \ the menu item; you just press the key for your menu selection. That’s thanks\
    \ to the use of `getch()` rather than `cin`. The comments help explain the program’s\
    \ logic.\n\n```cpp\n#include <iostream>\n#include <conio.h>\nusing namespace std;\n\
    \nint main() {\n    // Display a list of options.\n    cout << \"Choose your favorite:\"\
    \ << endl;\n    cout << \"1\\. Apples \" << endl;\n    cout << \"2\\. Bananas\
    \ \" << endl;\n    cout << \"3\\. Lobster \" << endl;\n    // Obtain the user's\
    \ selection.\n    char ch = getch();\n    // Continue getting user selections\
    \ until the\n    // user enters a valid number.\n    while (ch < '1' || ch > '3')\
    \ {\n        ch = getch();\n    }\n    // Use a switch to display the user's\n\
    \    // selection.\n    cout << \"You chose \" << ch << endl;\n    switch (ch)\
    \ {\n        case '1':\n            cout << \"Apples are good for you!\" << endl;\n\
    \            break;\n        case '2':\n            cout << \"Bananas have plenty\
    \ of potassium!\"\n            << endl;\n            break;\n        case '3':\n\
    \            cout << \"Expensive, but you have good taste!\"\n            << endl;\n\
    \            break;\n    }\n    return 0;\n}\n```\n\n# Chapter 4\n\n# Dividing\
    \ Your Work with Functions\n\nIN THIS CHAPTER\n\n- Working with functions\n- Writing\
    \ your own great functions\n- Having fun with strings\n- Manipulating `main()`\n\
    \nPeople generally agree that most projects throughout life are easier when you\
    \ divide them into smaller, more manageable tasks. That's also the case with computer\
    \ programming — if you break your code into smaller pieces, it becomes more manageable.\n\
    \nC++ provides many ways to divide code into smaller portions. One way is through\
    \ the use of functions. A `function` is a set of lines of code that performs a\
    \ particular job. In this chapter, you discover what functions are and how you\
    \ can use them to make your programming job easier.\n\n## Dividing Your Work\n\
    \nWhen you write a computer application, after you divide your job into smaller\
    \ pieces called `objects`, you eventually start giving these objects behaviors.\
    \ And to code these behaviors, you break them into manageable parts called `functions`.\
    \ Think of a function as a machine. You can put one or more values into the machine;\
    \ it processes them, and then it spits out a single answer, if anything at all.\n\
    \nThis machine (or function) has three main parts:\n\n- **Inputs:** The function\
    \ can receive data through its inputs. These data elements can be numbers, strings,\
    \ or any other type. When you create such a machine, you can have as many inputs\
    \ as you want (or even none).\n- **Processor:** The processor is the function\
    \ itself. In terms of C++, this is actually a set of code lines.\n- **Output:**\
    \ A function can `return` something when it has finished doing its thing. In C++,\
    \ this output is in the form of numbers, strings, or any other type.\n\nTo make\
    \ all this clear, try out the following `FirstFunction` code. (Don’t forget the\
    \ second line, `#include<math.h>`, which gives you some math capabilities.)\n\n\
    ```cpp\n#include <iostream>\n#include <math.h>\nusing namespace std;\n\nint main()\
    \ {\n    cout << fabs(-10.5) << endl;\n    cout << fabs(10.5) << endl;\n    return\
    \ 0;\n}\n```\n\nWhen you run this application, you see the following output:\n\
    \n```\n10.5\n10.5\n```\n\nIn this code, you use a function or machine called `fabs()`.\
    \ This function takes a number as input and returns as output the absolute value\
    \ of the number.\n\nThe reason for the `f` before the name `abs` is that it uses\
    \ floating-point numbers, which are simply numbers with decimal points.\n\nSo,\
    \ the first line inside `main()` calls `fabs()` for the value `–10.5`. The `cout`\
    \ then takes the output of this function (that is, the `result`) and prints it\
    \ to the console.\n\nThen the second line does the same thing again, except that\
    \ it takes the absolute value of the number `10.5`.\n\nAnd where is the processor\
    \ for this function? It's not in your code; it’s in another file, and the following\
    \ line ensures that your application can use this function: `#include <math.h>`.\n\
    \nYou’ve seen functions in many places. If you use a calculator and enter a number\
    \ and press the square root button, the calculator runs a function that calculates\
    \ the square root.\n\n## Calling a Function\n\nWhen you run the code in a function,\
    \ you’re calling the function. When you call a function, you do so by name.\n\n\
    To call a function, you type its name and then a set of parentheses. Inside the\
    \ parentheses, you list the items you want to send to the inputs of the function.\
    \ The term used here is `pass`.\n\nWait, the provided source text seems to have\
    \ some garbled repetitions in the \"Calling a Function\" section (e.g., \"you\
    \ call a function... function...\"). I have cleaned up the logical flow while\
    \ maintaining the core technical instructions:\n\nTo call a function, you type\
    \ its name and then a set of parentheses. Inside the parentheses, you list the\
    \ items you want to send to the inputs of the function. The term used here is\
    \ `pass`.\n\nFor example, if you call `fabs()` for the value `–10.5`, the `cout`\
    \ then takes the output of this function (that is, the `result`) and prints it\
    \ to the console.\n\nThen the second line does the same thing again, except that\
    \ it takes the absolute value of the number `10.5`.\n\nAnd where is the processor\
    \ for this function? It's not in your code; it’s in another file, and the following\
    \ line ensures that your application can use this function: `#include <math.h>`.\n\
    \n## Passing a Variable\n\nWhen you pass a value to a function, it's called an\
