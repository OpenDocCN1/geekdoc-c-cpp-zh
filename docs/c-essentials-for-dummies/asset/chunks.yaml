    \ the function:\n30\nInside the function:\n40\nAfter the function:\n30\n```\n\n\
    在函数调用之前，`mynumber` 是 `30`。在函数调用之后，它仍然是 `30`。但函数在其参数上加了 `10`。这意味着当你按值传递变量时，变量保持不变。\n\
    \n## 使用指针修改变量\n\n要修改传递给函数的变量，你可以传递变量的地址而不是它的值。函数随后接收一个指向该变量的指针，可以使用它可以来修改原始变量。列表\
    \ 6-11 所示的 `VariablePointer2` 示例是列表 6-10 的修改形式。\n\n列表 6-11 使用指针修改变量\n\n```cpp\n\
