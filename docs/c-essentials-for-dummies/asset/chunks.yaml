    Chapter 5


    # Splitting Up Source Code Files


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Creating multiple source code files**


    ![Bullet](images/check.png) **Creating header files**


    ![Bullet](images/check.png) **Sharing variables among source files**


    ![Bullet](images/check.png) **Making use of the mysterious header wrappers**


    Just as you can divide your work into functions, you can divide your work into
    multiple source code files. The main reason to do so is to help keep your project
    manageable. Also, with multiple source code files, you can have several people
    working on a single project, each working on a different source code file at the
    same time.


    In this chapter, you discover how to divide your source code into multiple files
    (and in all the right places).


    ## Creating Multiple Source Files


    If you break the code of your application into multiple source files, put all
    the files of your application in a separate directory or folder. Then in your
    command to compile, specify `*.cpp` to tell the compiler to compile together all
    the files whose names have the `.cpp` suffix. One and only one of the source files
    must contain the `main()` function. If you add or remove source files, or modify
    any of them, you''ll need to recompile to rebuild your application.


    You can put your functions in separate source code files, and they can call each
    other. In this way, they all work together in the single application. The section
    “[Sharing with Header Files](#c05.xhtml_c05-sec-0005),” later in this chapter,
    shows how you can have a function call another function in a different source
    file.


    ![Remember](images/remember.png) You can’t break up a single function and put
    it into two source files. The compiler requires that your functions stay in one
    piece in a single source file.


    After you have multiple files in your project, you can put some of your source
    in one file and some in another. But before you do, you may want to read some
    of the other sections in this chapter because they explain how to properly divide
    your source code.


    Before two source files can work together, they must somehow find out about each
    other. You need to tell each of them about what’s in the other file.


    When you write a function, normally the function must appear before any calls
    to it appear within the same source file. That’s because of the way the compiler
    parses the code: If the compiler encounters a call to a function but has not yet
    heard of that function, it issues an error. But the way around this is to use
    a function prototype. A *function prototype* is simply the header line from a
    function, ending with a semicolon, as in the following:


    `void BigDog(int KibblesCount);`


    Later in the source file is the actual function, with this header line duplicated.
    But instead of a semicolon, the function would have an open brace, the function
    code, and a closing brace, as in the following:


    `void BigDog(int KibblesCount)`


    `{`


    `cout << "I''m a lucky dog" << endl;`


    `cout << "I have " << KibblesCount`


    `<< " pieces of food"`


    `<< endl;`


    `}`


    So, after the function prototype, you can call the function whether the function
    code itself is before or after the call.


    ![Remember](images/remember.png) For the compiler to understand a function call,
    all it needs at the point that the code makes the call is a function *prototype.*


    Because the function call needs only a function prototype, you can put the function
    *itself* in another source code file. You could, therefore, have two separate
    source code files, as in the `MultipleSourceFiles` example, shown in [Listings
    5-1](#c05.xhtml_c05-fea-0001) and [5-2](#c05.xhtml_c05-fea-0002). (The first source
    code file — `main.cpp` — is shown in [Listing 5-1](#c05.xhtml_c05-fea-0001), and
    the second source code file — `mystuff.cpp` — is shown in [Listing 5-2](#c05.xhtml_c05-fea-0002).)


    [LISTING 5-1](#c05.xhtml_rc05-fea-0001) Calling a Function with Only a Prototype


    `void BigDog(int KibblesCount);`


    `int main() {`


    `BigDog(3);`


    `return 0;`


    `}`


    [LISTING 5-2](#c05.xhtml_rc05-fea-0002) Using a Function from a Separate File


    `#include <iostream>`


    `using namespace std;`


    `void BigDog(int KibblesCount) {`


    `cout << "I''m a lucky dog" << endl;`


    `cout << "I have " << KibblesCount`


    `<< " pieces of food"`


    `<< endl;`


    `}`


    [Listings 5-1](#c05.xhtml_c05-fea-0001) and [5-2](#c05.xhtml_c05-fea-0002) break
    the function away from the prototype. When you compile these two files together
    as a single application, they all fit together nicely. You can then run the application,
    and you see this somewhat interesting output:


    `I''m a lucky dog`


    `I have 3 pieces of food`'
