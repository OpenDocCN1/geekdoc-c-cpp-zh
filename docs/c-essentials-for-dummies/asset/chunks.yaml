    \ [7](#c01.xhtml_Page_7)\n\n## About the Author\n\nJohn Mueller was a freelance\
    \ author and technical editor. He had writing in his blood — he produced more\
    \ than 100 books and more than 600 articles, on topics ranging from networking\
    \ to artificial intelligence and from database management to heads-down programming.\
    \ John provided technical editing services to various magazines and his technical\
    \ editing skills helped more than 70 authors refine their manuscripts. He also\
    \ performed various kinds of consulting and wrote certification exams. Read more\
    \ about John at `www.johnmuellerbooks.com`.\n\n## About the Editor\n\nRonald Mak\
    \ teaches computer science and data science at San Jose State University in California’s\
    \ Silicon Valley. He has written books on software design, compiler construction,\
    \ and numerical computing. He was formerly a senior scientist at NASA and JPL,\
    \ a research staff member of IBM Research, and an enterprise software specialist\
    \ at the Lawrence Livermore National Laboratory. Earlier in his career, he held\
    \ senior software engineering positions at Hewlett-Packard, Sun Microsystems,\
    \ and Apple. Read more about Ron at `www.cs.sjsu.edu/~mak`.\n\n## Publisher’s\
