  trans: "\n\n在计算机运行这条复制语句后，两个变量将持有相同的值。这里显示的 `CopyVariable` 代码是一个将值从一个变量拷贝到另一个变量的示例：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int start\
    \ = 50;\n    int finish;\n    finish = start;\n    cout << finish << endl;\n \
    \   return 0;\n}\n```\n\n### 初始化变量\n\n当你创建一个变量时，它起初是一个空的存储桶。但在它能够发挥太大用处之前，你需要向其中放入一个值。\n\
    \n![Warning](img/warning.png) 如果你尝试在实际放入一个值之前检索变量的内容，你最终将得到计算机人员亲切地称为“不可预测的结果”。因此，在尝试检索变量内容之前，请务必确保你已经在变量内部放置了值，这个过程被称为`初始化变量`。\n\
    \n你可以通过两种方式初始化变量。第一种是声明变量然后给它赋一个值，这需要两行代码：\n\n```cpp\nint mynumber;\nmynumber\
    \ = 153;\n```\n\n但另一种方法要快一点。它看起来像这样：\n\n```cpp\nint mynumber = 153;\n```\n\n这种方法将两种策略合并成一个整洁的小包，供你随地需要使用。你在书中会看到这两种方式初始化的变量。\n\
    \n### 为自己起一个很棒的名字\n\n每个变量都需要一个名字。但你可以使用哪些名字？虽然你可以自由使用如 `Fred`、`Zanzibar` 或 `Supercount1000M`\
    \ 等名称，但 C++ 对允许使用的名称是有限制的。\n\n![Warning](img/warning.png) 虽然大多数 C++ 代码都是小写的，但你可以自由在变量名中使用大写字母。然而，C++\
    \ 区分这两种形式。编译器会将这两个名称视为两个不同的变量，这使得 C++ 是区分大小写的。\n\n以下是你在创建变量名时需要遵循的规则：\n\n- **字符：**\
    \ 你可以在变量名中使用任何大写字母、小写字母、数字或下划线。变量名中不允许出现符号（如空格或键盘数字键上方的符号）。唯一的限制是：\n    - 第一个字符不能是数字。\n\
    \    - 变量名不能完全由数字组成。\n- **长度：** 如今大多数编译器都允许你在变量名中使用任意数量的字符。选择足够长以具有意义但又足够短以方便你输入的变量名。大多数人倾向于五到十个字符左右。\n\
    \n允许变量名的示例有 `Count`、`current_name`、`address_1000` 和 `LookupAmount`。\n\n### 操作整数变量\n\
    \n你可以`操作`变量，这意味着你可以对它们的值进行算术运算。你可以轻松地进行加、减、乘、除。你用于算术运算的字符如下：\n\n| 字符 | 算术运算 |\n\
    | --- | --- |\n| `+` | 加法 |\n| `–` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n\n然而，你还可以对整数进行另一种操作，这与余数和除有关。例如，如果你将\
    \ 16 除以 3，整数结果是 `5 余 1`。这个余数有时被称为`模`（模）。\n\n![Remember](img/remember.png) 在处理整数变量时，记住你可以对变量做的两件基本事情：你可以向变量中放入一个值，也可以从变量中检索一个值。因此，在处理整数变量时，核心思想是：你可以检索它的值，对其进行算术运算，然后打印答案或将其存回同一个变量或另一个变量中。\n\
    \n### 相加整数变量\n\n如果你想两个两个整数变量，请使用 `+` 符号。你可以打印结果，也可以将其放回变量。\n\n`AddInteger` 示例相加两个变量（`start`\
    \ 和 `time`），然后答案打印到控制台。加法运算已加粗显示。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main()\n{\n    int start;\n    int time;\n    start = 37;\n    time\
    \ = 22;\n    cout << start + time << endl;\n    return 0;\n}\n```\n\n![Remember](img/remember.png)\
    \ 这段代码从两个名为 `start` 和 `time` 的整数变量开始。它将 `start` 设置为 `37` 并将 `time` 设置为 `22`。最后，它相加这两个变量（得到\
    \ `59`）并打印结果。当你看到 `start + time` 时，`+` 是告诉要执行什么动作的`operator`（运算符），而 `start` 和\
    \ `time` 是运算符作用的`operand`（操作数）。\n\n你也可以将数字本身加上变量。以下行向 `start` 增加了 `5` 并打印结果：\n\
    \n```cpp\ncout << start + 5 << endl;\n```\n\n或者你可以将值存回另一个变量，如下片段所示：\n\n```cpp\n\
    total = start + 5;\ncout << total << endl;\n```\n\n这个示例将 `5` 加到 `start` 并新值保存在\
    \ `total` 中。\n\n![Warning](img/warning.png) 当你使用如 `total = start + 5` 的代码时，你并没有改变\
    \ `start` 的值。`start` 变量保持与之前相同。\n\n当你使用如 `total = start + 5` 的代码时，你并没有改变 `start`\
    \ 的值。`start` 变量保持与之前相同。\n\nC++ 提供了一个快捷方法来为变量增加一个值并将其存回 total 中：\n\n```cpp\ntotal\
    \ += 5;\n```\n\n这意味着 `total` 现在比之前的增加了 `5`。行 `total = total + 5` 与 `total += 5;`\
    \ 相同。对于这一行，我们会说：“Total 加等于五”。\n\n![Tip](img/tip.png) 将 `total += 5` 仅仅视为 `total\
    \ = total + 5` 的快捷方式。\n\n你也可以对其他变量使用 `+=` 符号。例如，如果你想将 `time` 中的值加上 `total` 中的值并将结果存回\
    \ `total`，你可以这样做：\n\n```cpp\ntotal = total + time;\n```\n\n或者你可以使用这个快捷方式：\n\n\
    ```cpp\ntotal += time;\n```\n\n如果你只是给变量加 1，这被称为`变量递增`，你可以使用更短的快捷方式：\n\n```cpp\n\
    total++;\n```\n\n这等同于 `total = total + 1;` 或 `total += 1`。\n\n### 减去整数变量\n\n任何涉及整数变量加法的操作你都可以用减法完成。例如，你可以减两个变量，如\
    \ `SubtractVariable` 示例所示：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main()\n{\n    int final;\n    int time;\n    final = 28;\n    time = 18;\n\
    \    cout << final - time << endl;\n    return 0;\n}\n```\n\n当此程序运行时，控制台显示数字 `10`，即\
    \ `28 – 18`。记住，和加法一样，`final` 或 `time` 的值实际上都没有改变。计算机只是计算出差并打印在控制台上。\n\n你也可以从变量中减去一个数字，像之前一样，你仍然没有改变变量的值，如下例：\n\
    \n```cpp\ncout << final - 5 << endl;\n```\n\n你可以从一个变量减去另一个变量并将结果保存在第三个变量中：\n\n\
    ```cpp\nstart = final - time;\n```\n\n你可以通过减法改变变量中的值，如下行代码所示，它从 `final` 中减去 `time`并将结果存回\
    \ `final`：\n\n```cpp\nfinal -= time;\n```\n\n"
- fmt: "\n`final = final - time;`\n\nOr you can do the same thing by using the shortcut\
    \ notation:\n\n`final -= time;`\n\nFinally, as with addition, you have a shortcut\
    \ to a shortcut. If you want only to subtract 1, you can simply use two minus\
    \ signs, as in the following:\n\n`Final—  —;`\n\nThis line is pronounced minus\
    \ minus. `--` is the decrement operator. When applied to a variable, it's called\
    \ decrementing the variable.\n\n### Multiplying integer variables\n\nTo do multiplication\
    \ in C++, you use the asterisk (`*`) symbol. As with addition and subtraction,\
    \ you can multiply two variables, or you can multiply a variable by a number.\
    \ You can either print the result or save it in a variable. For example, you can\
    \ multiply two variables and print the results to the console with the following\
    \ line:\n\n```\ncout << length * width << endl;\n```\n\nOr you can multiply a\
    \ variable by a number, as in this line:\n\n```\ncout << length * 5 << endl;\n\
    ```\n\nAnd as with addition and subtraction, you can multiply two variables and\
    \ save the result in a third variable:\n\n```\narea = length * width;\n```\n\n\
    You can also use multiplication to modify a variable’s value, as in\n\n```\ntotal\
    \ = total * multiplier;\n```\n\nOr, to use the shortcut:\n\n```\ntotal *= multiplier;\n\
    ```\n\nAnd (as before) you can do the same with just a number:\n\n```\ntotal =\
    \ total * 25;\n```\n\nOr this:\n\n```\ntotal *= 25;\n```\n\n![Warning](images/warning.png)\
    \ Note that there is no `*` operator used to multiply a value by 1 or by itself.\
    \ Consequently, the compiler will raise an error if you type `total;`.\n\n###\
    \ Dividing integer variables\n\nAlthough addition, subtraction, and multiplication\
    \ are straightforward with integer variables, division is a bit trickier. The\
    \ chief reason is that, with integer values, sometimes you just can't divide evenly.\n\
    \nIn terms of strictly whole numbers, the answer to 21 divided by 5 is 4 remainder\
    \ 1. And that’s how the computer does arithmetic with integers. It gets two different\
    \ answers: the quotient and the remainder. What’s left over is the remainder.\n\
    \nBecause two different answers to a division problem may occur, C++ uses two\
    \ different operators for figuring these two different answers.\n\nTo find the\
    \ quotient, use the slash (`/`). Think of this character as the usual division\
    \ operator, because when you deal with integer values that divide evenly, this\
    \ operator gives you the correct answer. Thus, `10 / 2` gives you `5`, as you\
    \ would expect. Most people just call this the division operator.\n\nTo find the\
    \ remainder, use the percent sign (`%`). This is often called the modulus operator.\n\
    \nThe `DivideInteger` example, shown next, takes two numbers and prints their\
    \ quotient and remainder. Then it does it again for another pair of numbers. The\
    \ first pair has no remainder, but the second pair does.\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main()\n{\n    int first, second;\n    cout << \"\
    Dividing 28 by 14.\" << endl;\n    first = 28;\n    second = 14;\n    cout <<\
    \ \"Quotient \" << first / second\n    << endl;\n    cout << \"Remainder \" <<\
    \ first % second\n    << endl;\n    cout << \"Dividing 32 by 6.\" << endl;\n \
    \   first = 32;\n    second = 6;\n    cout << \"Quotient \" << first / second\n\
    \    << endl;\n    cout << \"Remainder \" << first % second\n    << endl;\n  \
    \  return 0;\n}\n```\n\nWhen you run this application, you see the following output:\n\
    \n```\nDividing 28 by 14.\nQuotient 2\nRemainder 0\nDividing 32 by 6.\nQuotient\
    \ 5\nRemainder 2\n```\n\n![Tip](images/tip.png) This code uses a couple new tricks\
    \ in addition to the division tricks. You can combine the output of strings and\
    \ numbers into a single `cout` statement. You did this for four of the `cout`\
    \ statements. That's acceptable, as long as you string them together with the\
    \ `<<` signs between each of them.\n\n```\nmyRemainder = first % second;\n```\n\
    \n![Tip](images/tip.png) The following shortcuts are available:\n\n```cpp\nint\
    \ first = 30;\nint second = 33;\nfirst /= 5;\nsecond %= 5;\ncout << first << \"\
    \ \" << second << endl;\n```\n\n## Working with Character Variables\n\nAnother\
    \ type of variable you can have is a character variable. A character variable\
