    \ (ebk)\n\n# Introduction\n\nWelcome to *C++ Essentials For Dummies.* This book\
    \ contains the basic information you need to know to get going with C++ programming.\
    \ You’ll learn how to install and run the compiler, write programs, and use important\
    \ C++ features like arrays, classes, and pointers to do good object-oriented programming.\n\
    \nC++ is a large and complex language. But whether you’re just learning to program\
    \ or you’re an expert in other programming languages, this book contains the essentials\
    \ of the language for you to quickly become a C++ programmer.\n\n## About This\
    \ Book\n\n*C++ Essentials For Dummies* contains the information you need to start\
    \ writing C++ programs. You can compile and run the example programs with the\
    \ latest C++ 20 version of the compiler, but you can also use the earlier C++\
    \ 14 and C++ 17 versions.\n\nThis book is not a comprehensive reference for C++.\
    \ To go beyond what this book covers, your next book should be *C++ All-in-One\
    \ For Dummies,* 4th Edition by John Paul Mueller, from which this book is derived.\
    \ However, this book will get you up and running fast with its easy-to-follow\
    \ *For Dummies* format.\n\n## Foolish Assumptions\n\nWe made a few basic assumptions\
    \ about you, the reader:\n\n* **You own or have access to a relatively modern\
    \ computer.** The C++ example programs were tested on a Windows computer, but\
    \ the book shows how to compile and run them just as easily on a Mac or Linux\
    \ computer.\n* **You’re an experienced computer user.** In other words, we assume\
    \ that you know the basics of using your computer, such as starting programs and\
    \ working with the file system.\n* **You’re interested in learning how to write\
    \ programs in the C++ language.** That’s what this book is about, so it’s a fair\
    \ assumption.\n\nWe do *not* assume you have any previous programming experience\
    \ in C++ or in any other programming language.\n\n## Icons Used in This Book\n\
    \nLike any *For Dummies* book, this book is chock-full of helpful icons that draw\
    \ your attention to items of particular importance. You find the following icons\
    \ throughout this book:\n\n![Warning](images/warning.png) Danger! This icon highlights\
    \ information that may help you avert disaster.\n\n![Remember](images/remember.png)\
    \ Did we tell you about the memory course we took?\n\n![Tip](images/tip.png) Pay\
    \ special attention to this icon; it lets you know that some particularly useful\
    \ tidbit is at hand.\n\n## Where to Go from Here\n\nIf you’re new to programming,\
    \ you’ll benefit most from this book by reading it from start to end. But if you’re\
    \ familiar with programming another language like Java, you can pick and choose\
    \ which chapters to read to learn what’s unique about C++.\n\n# Chapter 1: Compiling\
    \ and Running Your C++ Application\n\n## Introduction\n\nA C++ compiler translates\
    \ your source files (which contain the text of your program code written in C++)\
    \ into machine code that your computer can understand and run. Different C++ compilers\
    \ run on the Microsoft Windows, macOS, and Linux operating systems, but they all\
    \ adhere to the international standard for C++, so if you write your program code\
    \ in C++, you should be able to compile and run your application on any of the\
    \ platforms.\n\nThis chapter has links to download and install the C++ compiler\
    \ on the Windows, macOS, and Linux platforms. It demonstrates how to edit, compile,\
    \ and run a simple C++ application on the command line in each of the platforms.\
    \ Then it briefly looks at using an integrated development environment (IDE) and\
    \ shows you the advantages an IDE offers to C++ developers. Many IDEs are available,\
    \ so this chapter only gives an introduction to using one. The rest of this book\
    \ assumes you’re compiling and running programs on the command line.\n\n## Looking\
    \ at a Simple C++ Program\n\nUse any text editor (such as Windows Notepad, macOS\
    \ TextEdit, or Linux vi) to create a plain-text file named `hello.cpp` containing\
    \ the following C++ code:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    for (int i = 1; i <= 5; i++)\n    {\n        cout << i <<\
    \ \" Hello, world!\" << endl;\n    }\n}\n```\n\n## Using C++ on Microsoft Windows\n\
    \nOn the Windows platform, the C++ compiler is a utility program called `CL` that\
    \ you run on the command line in a special command window.\n\nTo install `CL`,\
    \ follow these steps:\n\n1. Go to [`https://visualstudio.microsoft.com/downloads/#build-tools-for-visual-studio-2022`](https://visualstudio.microsoft.com/downloads/#build-tools-for-visual-studio-2022)..\n\
    2. Scroll down to Build Tools for Visual Studio and click the Download button.\n\
    \   An installer downloads onto your computer.\n3. Run the installer to install\
    \ `CL` and its tools.\n"
