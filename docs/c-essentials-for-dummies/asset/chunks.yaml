    ## Sharing with Header Files


    Breaking apart source code into multiple files is easy, but soon you may run into
    a problem. If you have a function, you would need a prototype for `SafeCracker()`
    in every file that calls it. The prototype may look like this:


    `string SafeCracker(int SafeID);`


    But there is an easier way of adding the prototype instead of adding it to every
    file that uses the function. Simply put this line inside its own file, called
    a *header file,* and give the filename an `.h` or `.hpp` extension. (Most developers
    use `.h`.) For this example, you place the line `string SafeCracker (int SafeID);`
    in a file called `safestuff.h`.


    Then, instead of typing the header line at the start of each file that needs the
    function, you type the following:


    `#include "safestuff.h"`


    You would then have the three source code files used for the `MultipleSourceFiles2`
    example, shown in [Listings 5-3](#c05.xhtml_c05-fea-0003), [5-4](#c05.xhtml_c05-fea-0004),
    and [5-5](#c05.xhtml_c05-fea-0005):


    *   `main.cpp`**:** Calls the function


    *   `safestuff.h`**:** Contains the function prototype


    *   `safestuff.cpp`**:** Contains the actual code for the function whose prototype
    appears in the header file


    Lots of files, but now the code is broken into manageable pieces. Also, make sure
    that you save all three of these files in the same directory or folder.


