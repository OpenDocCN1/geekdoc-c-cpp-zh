    `CrayonColor fill_color = blue;`


    The variable `line_color` is of type `CrayonColor`, and its value is `black`.
    The variable `fill_color` is also of `type CrayonColor`, and its value is `blue`.


    Suppose you print the value of a `CrayonColor` variable, such as


    `cout << line_color;`


    You would see the value `4` printed. You can use enumeration values in your code,
    but C++ stores each value as an integer, and it''s the integer value that’s printed.
