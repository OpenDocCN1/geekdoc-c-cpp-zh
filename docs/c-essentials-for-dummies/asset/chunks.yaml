    r`)，24\n*   `catch` 语句，162\n*   `ChangesAre()` 函数，113\n*   更改\n    *   字符串部分，27–28\n\
    \    *   值，13\n    *   使用指针变量，98–101\n*   字符变量\n    *   关于，23–24\n    *   声明，24\n\
    \    *   不可打印的，24\n    *   空字符，24\n    *   与之工作，23–25\n*   变量名中的字符，15\n*   子类，141\n\
    *   `cin` 对象，34, 36\n*   类\n    *   关于，117–125\n    *   访问成员，126–128\n    *  \
    \ 添加构造函数的参数，138–140\n    *   行为，118–119\n    *   构建层次结构，141–150\n    *   分类，118\n\
    \    *   定义的，125\n    *   定义标准的 `this` 指针用法，134–135\n    *   以析构函数结束，136–137\n\
