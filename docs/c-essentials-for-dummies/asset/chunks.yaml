  trans: "\n\n-   **行为：** 类的 `behavior`（行为）是类实例可以执行的任务。你通过成员函数来定义每个行为。当你为特定实例调用成员函数时，该成员函数会访问该实例的成员变量。\n\
    \n当你拆分类时，将部分内容放在头文件中，部分放在源文件中。以下列表描述了内容的存放位置：\n\n-   **头文件：** 将类定义放在头文件中。成员变量作为头文件中内类定义的一部分出现。如果一个成员函数很短，你可以将该成员函数的代码包含在类定义内部，但大多数人倾向于只保留成员函数的原型。你可能希望将头文件命名为与类同名，但使用\
    \ `.h` 或 `.hpp` 扩展名。\n\n-   **源文件：** 如果你的类定义包含成员函数原型，则需要将函数代码放在源文件中。这样做时，在函数名前加上类名和作用域解析符（`::`）。如果你将头文件命名为与类相同，你可能也想将源文件命名为与类相同，但使用\
    \ `.cpp` 扩展名。\n\n## 使用类\n\n在本节中，你将探索处理类的几种巧妙方法，从如何向其他访问这些类的函数隐藏类的某些部分开始。\n\n###\
    \ 访问成员\n\n在现实生活中操作一个对象时，对象通常会有部分你与之交互，另一些部分不是。例如，当你使用电脑时，你在键盘上打字，但不会打开机箱并用连接电池的电线到处乱弄。大多数情况下，除非你在升级，否则内部是禁止访问的。\n\
    \n在对象术语中，`public` 和 `private` 词指的是类的成员。当你设计一个类时，你可能希望某些成员变量和函数可以供类用户自由访问。你可能希望将其他成员隐藏起来。`class\
    \ user`（类用户）是应用程序中创建类实例并调用其某个成员函数的部分。\n\n在设计类时，你可能只允许特定的用户调用某些成员函数。你可能希望隐藏其他成员函数，使其仅供类内部的其它成员函数调用。\n\
    \n![Remember](img/remember.png) 你通过将成员函数设置为 `private` 来禁止用户调用它们。对于你允许访问的成员函数，将其设置为\
    \ `public`。在你设计完一个类后，如果你编写了一个实例化该类对象的函数，并尝试调用该对象的私有成员函数，当你尝试编译它时会得到编译器错误。\n\n\
    `OvenClass` 示例显示 Listing 7-4 中，定义了一个示例 `Oven` 类和一个使用它的 `main()` 函数。查看类定义。它有两个部分：一个是私有的，另一个是公有的。成员函数的代码出现在类定义之后。两个私有成员函数除了打印消息外没做什么，尽管它们也可以自由调用类中的其他私有函数。公共成员函数\
    \ `Bake()` 被允许调用每个私有函数。\n\nLISTING 7-4 使用 Public 和 Private 关键字隐藏类的某些部分\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nclass Oven {\nprivate:\n    void\
    \ TurnOnHeatingElement();\n    void TurnOffHeatingElement();\npublic:\n    void\
    \ Bake(int Temperature);\n};\n\nvoid Oven::TurnOnHeatingElement() {\n    cout\
    \ << \"Heating element is now ON!\n    Be careful!\" << endl;\n}\n\nvoid Oven::TurnOffHeatingElement()\
    \ {\n    cout << \"Heating element is now off. Relax!\" << endl;\n}\n\nvoid Oven::Bake(int\
    \ Temperature) {\n    TurnOnHeatingElement();\n    cout << \"Baking!\" << endl;\n\
    \    TurnOffHeatingElement();\n}\n\nint main() {\n    Oven fred;\n    fred.Bake(875);\n\
    \    return 0;\n}\n```\n\n当你运行此应用程序时，你会看到一些消息：\n\n`Heating element is now ON!\
    \ Be careful!`\n`Baking!`\n`Heating element is now off. Relax!`\n\n如果你在 `main()`\
    \ 中包含了下面这行尝试调用私有成员函数的代码：\n\n`fred.TurnOnHeatingElement();`\n\n你将得到一条错误消息，告诉你不能这样做，因为该函数是私有的。\n\
    \n![Tip](img/tip.png) 在设计类时，考虑默认将所有成员都设为私有，然后将你希望用户访问的成员设置为公有。这种方法允许你“隐藏”其他应用程序不需要访问的成员。\n\
    \n### 使用类和指针\n\n和任何变量一样，你可以拥有一个指向对象的指针变量。按照惯例，指针变量的类型必须与类的类型匹配。这创建了一个指向 `Pen`\
    \ 实例的指针变量：\n\n`Pen *MyPen;`\n\n变量 `MyPen` 是一个指针，它可以指向类型为 `Pen` 的对象。变量自身的类型是指向\
    \ `Pen`，或者在 C++ 表示法中为 `Pen *`。\n\n![Remember](img/remember.png) 像 `Pen *MyPen;`\
    \ 这样的代码创建一个作为对象指针的变量。要创建一个实例，你必须调用 `new`。\n\n在创建变量 `MyPen` 后，你可以使用 `new` 关键字创建一个\
    \ `Pen` 类实例并将 `MyPen` 指向它，如下：\n\n`MyPen = new Pen;`\n\n或者你可以将 `Pen *MyPen;` 和前一行结合起来：\n\
    \n`Pen *MyPen = new Pen;`\n\n现在你在堆中有了该对象。（关于指针和堆的更多信息，请参阅 Chapter 6）。你还拥有指向对象的指针变量。由于对象在堆中，访问它的唯一方法是通过指针。要通过指针访问成员，你使用箭头运算符：\n\
    \n`MyPen->InkColor = red;`\n\n这是通过 `MyPen` 指针设置对象的 `InkColor` 属性为 `red`。箭头运算符是以下内容的简写：\n\
    \n`(*MyPen).InkColor = red;`\n\n大多数程序员倾向于使用箭头运算符。\n\n和你通过 `new` 创建的其他值一样，在使用完一个对象后，你应该调用\
    \ `delete` 来释放所指向的对象所使用的内存。这样做，从 `delete` 单词开始，然后是指针名 `MyPen`，如下：\n\n`delete MyPen;`\n\
    \n![Remember](img/remember.png) 在删除对象后，在指针中存储 `nullptr`。如果你不在指针中存储 `nullptr`，它仍然指向对象*曾经所在的地方。\n\
    \n`PenClass3` 示例显示 Listing 7-5 中，演示了声明指针、创建对象并指向它、通过指针访问对象的成员、删除对象并将指针置回 `0` 的过程。\n\
    \nLISTING 7-5 管理对象的生命\n\n```cpp\n#include <iostream>\n#include \"../PenClass2/Pen.h\"\
    \n\nusing namespace std;\n\nint main() {\n    Pen *MyPen;\n    MyPen = new Pen;\n\
    \    MyPen->InkColor = red;\n    cout << MyPen->InkColor << endl;\n    delete\
    \ MyPen;\n    MyPen = nullptr;\n    return 0;\n}\n```\n\n以下步骤精确地描述了如何处理指针和对象：\n\
    \n1. **声明指针。**\n   指针必须与你意图处理的对象类型匹配，不同的是 C++ 中指针的类型名后面跟着星号（`*`）。\n\n2. **调用 `new`\
    \ 并传递类名，将 `new` 的结果存储在指针中。**\n   你可以将步骤 1 和步骤 2 合并为一个步骤。\n\n3. **使用箭头运算符（`->`）通过指针访问对象的成员。**\n\
    \n4. **当你完成对象后，调用 `delete`。**\n   此步骤从堆中释放对象。记住，这不会删除指针本身——它只是释放了对象内存。*\n\n"
- fmt: "\n## **Clear the pointer by setting it to `nullptr`.**\n\n### Passing objects\
    \ to functions\n\nWhen you write a function, normally you base your decision about\
    \ using pointers on whether you want to change the original variables passed into\
    \ the function. Suppose you have a function called `AddOne()`, and it takes an\
    \ integer as a parameter. If you want to modify the original variable, you can\
    \ use a pointer (or you can use a reference). If you don't want to modify the\
    \ variable, just pass the variable *by value*.\n\nThe following prototype represents\
    \ a function that can modify the variable passed into it:\n\n```cpp\nvoid AddOne(int\
    \ *number);\n```\n\nAnd this prototype represents a function that cannot modify\
    \ the variable passed into it:\n\n```cpp\nvoid AddOne(int number);\n```\n\nWith\
    \ objects, you can do something similar. For example, this function takes a pointer\
    \ to an object and can, therefore, modify the object:\n\n```cpp\nvoid FixFlatTire(Car\
    \ *mycar); own```\n\nThis version doesn’t allow modification of the original object:\n\
    \n```cpp\nvoid FixFlatTire(Car mycar);\n```\n\nEvery time you call this function,\
    \ it creates an entirely new instance of class `Car`. This instance would be a\
    \ duplicate copy of the `myCar` object that is an instance of class `Car` — it\
    \ wouldn't be the same instance.\n\n![Tip](images/tip.png) The smart move with\
    \ objects is to always pass objects as pointers. Don’t pass objects directly into\
    \ functions. Yes, it risks bad code changing the object, but careful C++ programmers\
    \ want the actual object, not a copy. Having access to the original outweighs\
    \ the risk of an accidental change. This chapter explains how to prevent accidental\
    \ changes by using the `const` parameters in the next section.\n\nBecause your\
    \ function receives its objects as pointers, you continue accessing them by using\
    \ the arrow operator. For example, the function `FixFlatTire()` may do this:\n\
    \n```cpp\nvoid FixFlatTire(Car *mycar) {\n    mycar->RemoveTire();\n    mycar->AddNewTire();\n\
    }\n```\n\nOr, if you prefer references, you would do this:\n\n```cpp\nvoid FixFlatTire2(Car\
    \ &mycar) {\n    mycar.RemoveTire();\n    mycar.AddNewTire();\n}\n```\n\n![Remember](images/remember.png)\
    \ Pointers contain the address of an object, while a reference is simply another\
    \ name (or an *alias*) for an object. Even though the reference is still an address,\
    \ it's the actual address of the object, rather than a pointer to the object.\
    \ ([Chapter 6](#c06.xhtml) discusses pointers in more detail.) In this code, because\
    \ you’re dealing with a reference, you access the object’s members using the dot\
    \ operator (`.`) rather than the arrow operator (`->`).\n\n![Tip](images/tip.png)\
    \ Another reason to use only pointers and references as parameters for objects\
    \ is that a function that takes an object as a parameter usually wants to change\
    \ the object. Such changes require pointers or references.\n\n### Using const\
    \ parameters in functions\n\nA *constant* is a variable or object that another\
    \ function can't change even when you pass a reference to it to another function.\
    \ To define a variable or an object as constant, unchangeable, you use the `const`\
    \ keyword. For example, to define a variable as constant, you use:\n\n```cpp\n\
    const int MyInt = 3;\n```\n\nIf someone were to come along and try to use the\
    \ following code:\n\n```cpp\nMyInt = 4;\n```\n\nThe compiler would display an\
    \ error message saying:\n\n`error: assignment of read-only variable 'MyInt'`\n\
    \nThe same holds true for a function using a `const` primitive like this one:\n\
    \n```cpp\nvoid DisplayInt(const int Value) {\n    cout << Value << endl;\n}\n\
    ```\n\nIt’s possible to display `Value` or interact with it in other ways, but\
    \ trying to change `Value` will raise an error. This version will raise an error\
    \ because `Value` is being changed:\n\n```cpp\nvoid DisplayInt(const int Value)\
    \ {\n    Value += 1;\n    cout << Value << endl;\n}\n```\n\nThe `const` keyword\
    \ is useful when working with objects because you generally don't want to pass\
    \ an object directly. That involves copying the object, which is messy. Instead,\
    \ you normally pass by using a pointer or reference, which would allow you to\
    \ change the object. If you put the word `const` before the parameter, the compiler\
    \ won’t allow you to change the value of the parameter.\n\n![Remember](images/remember.png)\
    \ If you have multiple parameters, you can mix `const` and non-`const`. If you\
    \ go overboard, this can be confusing. The following line shows two parameters\
    \ that are `const` and another that is not. The function can modify only the members\
    \ of the object called `one`.\n\n```cpp\nvoid Inspect(const Pen *Checkitout, Spy\
    \ *one, const Spy *two);\n```\n\n### Using the this pointer\n\nConsider a function\
    \ called `OneMoreCheeseGone()`. It's not a member function, but it takes an object\
    \ of instance `Cheese` as a parameter. Its prototype looks like this:\n\n```cpp\n\
    void OneMoreCheeseGone(Cheese *Block);\n```\n\nThis is just a simple function\
    \ with no return type. It takes an object pointer as a parameter. For example,\
    \ after you eat a block of cheese, you can call:\n\n```cpp\nOneMoreCheeseGone(MyBlock);\n\
    ```\n\nNow consider this: If you have an object on the heap, it has no name. You\
    \ access it through a pointer variable that points to it. But what if the code\
    \ is currently executing inside a member function of an object? How do you refer\
    \ to the object itself?\n\n### Defining this pointer\n\nThe `this` listing has\
    \ four main parts. First is the definition for the class `Cheese`. The class contains\
    \ a couple of member functions.\n\nNext is the function `OneMoreCheeseGone()`\
    \ along with a global variable that it modifies.\n\nNext come the actual member\
    \ functions for `Cheese`. (You must put these functions after `OneMoreCheeseGone()`\
    \ because they call it. If you use a function prototype as a forward reference\
    \ for `OneMoreCheeseGone()`, the order doesn't matter.)\n\nFinally, `main()` creates\
    \ two new instances of `Cheese`. When you run the application in [Listing 7-6](#c07.xhtml_c07-fea-006),\
    \ you see this output:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    class Cheese {\npublic:\n    string status;\n    void eat();\n    void rot();\n\
    };\n\nint CheeseCount;\n\nvoid OneMoreCheeseGone(Cheese *Block) {\n    CheeseCount--;\n\
    \    Block->status = \"Gone\";\n}\n\nvoid Cheese::eat() {\n    cout << \"Eaten\
    \ up! Yummy\" << endl;\n    OneMoreCheeseGone(this);\n}\n\nvoid Cheese::rot()\
    \ {\n    cout << \"Rotted away! Yuck\" << endl;\n    OneMoreCheeseGone(this);\n\
    }\n\nint main() {\n    Cheese *asiago = new Cheese();\n    Cheese *limburger =\
    \ new Cheese();\n    CheeseCount = 2;\n    asiago->eat();\n    limburger->rot();\n\
    \    cout << endl;\n    cout << \"Cheese count: \" << CheeseCount << endl;\n \
    \   cout << \"asiago: \" << asiago->status << endl;\n    cout << \"limburger:\
    \ \" << limburger->status << endl;\n    return 0;\n}\n```\n\nThe `this` variable\
    \ always points to the current object. So, if code execution is occurring inside\
    \ a member function and you want to call `OneMoreCheeseGone()`, passing the current\
    \ object using `this`.\n"
  raw: '5.  **Clear the pointer by setting it to** `nullptr`**.**


    ### Passing objects to functions


    When you write a function, normally you base your decision about using pointers
    on whether you want to change the original variables passed into the function.
    Suppose you have a function called `AddOne()`, and it takes an integer as a parameter.
    If you want to modify the original variable, you can use a pointer (or you can
    use a reference). If you don''t want to modify the variable, just pass the variable
    *by value.*


    The following prototype represents a function that can modify the variable passed
    into it:


    `void AddOne(int *number);`


    And this prototype represents a function that cannot modify the variable passed
    into it:


    `void AddOne(int number);`


    With objects, you can do something similar. For example, this function takes a
    pointer to an object and can, therefore, modify the object:


    `void FixFlatTire(Car *mycar);`


    This version doesn’t allow modification of the original object:


    `void FixFlatTire(Car mycar);`


    Every time you call this function, it creates an entirely new instance of class
    `Car`. This instance would be a duplicate copy of the `myCar` object that is an
    instance of class `Car` — it wouldn''t be the same instance.


    ![Tip](images/tip.png) The smart move with objects is to always pass objects as
    pointers*.* Don’t pass objects directly into functions. Yes, it risks bad code
    changing the object, but careful C++ programmers want the actual object, not a
    copy. Having access to the original outweighs the risk of an accidental change.
    This chapter explains how to prevent accidental changes by using the `const` parameters
    in the next section.


    Because your function receives its objects as pointers, you continue accessing
    them by using the arrow operator. For example, the function `FixFlatTire()` may
    do this:


    `void FixFlatTire(Car *mycar) {`


    `mycar->RemoveTire();`


    `mycar->AddNewTire();`


    `}`


    Or, if you prefer references, you would do this:


    `void FixFlatTire2(Car &mycar) {`


    `mycar.RemoveTire();`


    `mycar.AddNewTire();`


    `}`


    ![Remember](images/remember.png) Pointers contain the address of an object, while
    a reference is simply another name (or an *alias*) for an object. Even though
    the reference is still an address, it''s the actual address of the object, rather
    than a pointer to the object. ([Chapter 6](#c06.xhtml) discusses pointers in more
    detail.) In this code, because you’re dealing with a reference, you access the
    object’s members using the dot operator (`.`) rather than the arrow operator (`->`).


    ![Tip](images/tip.png) Another reason to use only pointers and references as parameters
    for objects is that a function that takes an object as a parameter usually wants
    to change the object. Such changes require pointers or references.


    ### Using const parameters in functions


    A *constant* is a variable or object that another function can''t change even
    when you pass a reference to it to another function. To define a variable or an
    object as constant, unchangeable, you use the `const` keyword. For example, to
    define a variable as constant, you use:


    `const int MyInt = 3;`


    If someone were to come along and try to use the following code:


    `MyInt = 4;`


    The compiler would display an error message saying:


    `error: assignment of read-only variable ''MyInt''`


    The same holds true for a function using a `const` primitive like this one:


    `void DisplayInt(const int Value) {`


    `cout << Value << endl;`


    `}`


    It’s possible to display `Value` or interact with it in other ways, but trying
    to change `Value` will raise an error. This version will raise an error because
    `Value` is being changed:


    `void DisplayInt(const int Value) {`


    `Value += 1;`


    `cout << Value << endl;`


    `}`


    The `const` keyword is useful when working with objects because you generally
    don''t want to pass an object directly. That involves copying the object, which
    is messy. Instead, you normally pass by using a pointer or reference, which would
    allow you to change the object. If you put the word `const` before the parameter,
    the compiler won’t allow you to change the value of the parameter.


    ![Remember](images/remember.png) If you have multiple parameters, you can mix
    `const` and non-`const`. If you go overboard, this can be confusing. The following
    line shows two parameters that are `const` and another that is not. The function
    can modify only the members of the object called `one`.


    `void Inspect(const Pen *Checkitout, Spy *one,`


    `const Spy *two);`


    ### Using the this pointer


    Consider a function called `OneMoreCheeseGone()`. It''s not a member function,
    but it takes an object of instance `Cheese` as a parameter. Its prototype looks
    like this:


    `void OneMoreCheeseGone(Cheese *Block);`


    This is just a simple function with no return type. It takes an object pointer
    as a parameter. For example, after you eat a block of cheese, you can call:


    `OneMoreCheeseGone(MyBlock);`


    Now consider this: If you have an object on the heap, it has no name. You access
    it through a pointer variable that points to it. But what if the code is currently
    executing inside a member function of an object? How do you refer to the object
    itself?


    C++ has a member variable that exists inside every class: `this`. It''s a pointer
    variable. The `this` variable always points to the current object. So, if code
    execution is occurring inside a member function and you want to call `OneMoreCheeseGone()`,
    passing in the current object, you would pass `this`.


    ### Defining standard this pointer usage


    This section tells you how `this` is used for application development in most
    applications today. The `CheeseClass` example, shown in [Listing 7-6](#c07.xhtml_c07-fea-0006),
    demonstrates `this`.


    [LISTING 7-6](#c07.xhtml_rc07-fea-0006) Passing an Object from Inside Its Member
    Functions by Using the this Variable


    `#include <iostream>`


    `using namespace std;`


    `class Cheese {`


    `public:`


    `string status;`


    `void eat();`


    `void rot();`


    `};`


    `int CheeseCount;`


    `void OneMoreCheeseGone(Cheese *Block) {`


    `CheeseCount--;`


    `Block->status = "Gone";`


    `};`


    `void Cheese::eat() {`


    `cout << "Eaten up! Yummy" << endl;`


    `OneMoreCheeseGone(this);`


    `}`


    `void Cheese::rot() {`


    `cout << "Rotted away! Yuck" << endl;`


    `OneMoreCheeseGone(this);`


    `}`


    `int main() {`


    `Cheese *asiago = new Cheese();`


    `Cheese *limburger = new Cheese();`


    `CheeseCount = 2;`


    `asiago->eat();`


    `limburger->rot();`


    `cout << endl;`


    `cout << "Cheese count: " << CheeseCount`


    `<< endl;`


    `cout << "asiago: " << asiago->status << endl;`


    `cout << "limburger: " << limburger->status`


    `<< endl;`


    `return 0;`


    `}`


    The `this` listing has four main parts. First is the definition for the class
    called `Cheese`. The class contains a couple of member functions.


    Next is the function `OneMoreCheeseGone()` along with a global variable that it
    modifies.


    Next come the actual member functions for class `Cheese`. (You must put these
    functions after `OneMoreCheeseGone()` because they call it. If you use a function
    prototype as a forward reference for `OneMoreCheeseGone()`, the order doesn''t
    matter.)


    Finally, `main()` creates two new instances of `Cheese`. When you run the application
    in [Listing 7-6](#c07.xhtml_c07-fea-0006), you see this output:


    `Eaten up! Yummy`


    `Rotted away! Yuck`


    `Cheese count: 0`


    `asiago: Gone`


    `limburger: Gone`


    Take a careful look at the `OneMoreCheeseGone()` function. It operates on the
    current object provided as a parameter by setting its status variable to the string
    `Gone`. The `eat()` member function calls it, passing the current object using
    `this`. The `rot()` member function also calls it, again passing the current object
    via `this`.


    ## Starting and Ending with Constructors and Destructors


    You can add two special member functions to your class that let you provide special
    startup and shutdown functionality: a *constructor* and a *destructor.* The following
    sections provide details about these functions.


    ### Starting with constructors'
