    Or you can use the pointer. To use the pointer, you first declare it as follows:


    `ptr = &NumberOfPotholes;`


    Then, to change `NumberOfPotholes`, you don''t just assign a value to it. Instead,
    you throw an asterisk in front of it, like so:


    `*ptr = 6087;`


    If `ptr` points to `NumberOfPotholes`, these two lines of code will have the same
    effect: Both will change the value to `6087`. This process of sticking the asterisk
    before a pointer variable is called *dereferencing* the pointer. Look at the `DereferencePointer`
    example, shown in [Listing 6-2](#c06.xhtml_c06-fea-0002), which demonstrates all
    this.


    [LISTING 6-2](#c06.xhtml_rc06-fea-0002) Modifying the Original Variable with a
    Pointer Variable


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `int NumberOfPotholes;`


    `int *ptr;`


    `ptr = &NumberOfPotholes;`


    `*ptr = 6087;`


    `cout << NumberOfPotholes << endl;`


    `return 0;`


    `}`


    In [Listing 6-2](#c06.xhtml_c06-fea-0002), the first line of `main()` declares
    an integer variable, and the second line declares a pointer to an integer. The
    next line takes the address of the integer variable and stores it in the pointer.
    Then the fourth line modifies the original integer by dereferencing the pointer.
    And just to make sure that the process worked, the next line prints the value
    of `NumberOfPotholes`. When you run the application, you see the following output:


    `6087`


    You can also read the value of the original variable through the pointer. Look
    at the `ReadPointer` example, shown in [Listing 6-3](#c06.xhtml_c06-fea-0003).
    This code accesses the value of `NumberOfPotholes` through the pointer variable,
    `ptr`. When the code gets the value, it saves it in another variable called `SaveForLater`.


    [LISTING 6-3](#c06.xhtml_rc06-fea-0003) Accessing a Value through a Pointer


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `int NumberOfPotholes;`


    `int *ptr = &NumberOfPotholes;`


    `int SaveForLater;`


    `*ptr = 6087;`


    `SaveForLater = *ptr;`


    `cout << SaveForLater << endl;`


    `*ptr = 7000;`


    `cout << *ptr << endl;`


    `cout << SaveForLater << endl;`


    `return 0;`


    `}`


    When you run this application, you see the following output:


    `6087`


    `7000`


    `6087`


    Notice that the code changes the value through `ptr` again — this time to `7000`.
    When you run the application, you can see that the value did, indeed, change,
    but the value in `SaveForLater` remained the same. That''s because `SaveForLater`
    is a separate variable, not connected to the other two. The other two, however,
    are connected to each other.


    ### Pointing at a string


    Pointer variables can point to any type, including strings. However, after you
    say that a variable points to a certain type, it can point to only that type.
    That is, as with any variable, you can’t change its type. The compiler won’t let
    you do it.


    To create a pointer to a string, you simply make the type of the variable `string
    *`. You can then set it equal to the address of a string variable. The `StringPointer`
    example, shown in [Listing 6-4](#c06.xhtml_c06-fea-0004), demonstrates this idea.


    [LISTING 6-4](#c06.xhtml_rc06-fea-0004) Pointing to a String with Pointers


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `string GoodMovie;`


    `string *ptrToString;`


    `GoodMovie = "Best in Show";`


    `ptrToString = &GoodMovie;`


    `cout << *ptrToString << endl;`


    `return 0;`


    `}`


    In [Listing 6-4](#c06.xhtml_c06-fea-0004), you see that the pointer named `ptrToString`
    points to the variable named `GoodMovie`. But when you want to use the pointer
    to access the string, you need to dereference the pointer by putting an asterisk
    (`*`) in front of it. When you run this code, you see the results of the dereferenced
    pointer, which is the value of the `GoodMovie` variable:


    `Best in Show`


    You can change the value of the string through the pointer, again by dereferencing
    it, as in the following code:


    `*ptrToString = "Galaxy Quest";`


    `cout << GoodMovie << endl;`


    The code dereferences the pointer to set it equal to the string `"GalaxyQuest"`.
    Then, to show that it truly changed, the code prints the `GoodMovie` variable.
    The result of this code, when added at the end of [Listing 6-4](#c06.xhtml_c06-fea-0004)
    (but prior to the `return 0`), is


    `Galaxy Quest`


    You can also use the pointer to access the individual parts of the string, as
    shown in the `StringPointer2` example in [Listing 6-5](#c06.xhtml_c06-fea-0005).


    [LISTING 6-5](#c06.xhtml_rc06-fea-0005) Using Pointers to Point to a String


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `string AMovie;`


    `string *ptrToString;`


    `AMovie = "L.A. Confidential";`


    `ptrToString = &AMovie;`


    `for (unsigned i = 0; i < AMovie.length(); i++)`


    `{`


    `cout << (*ptrToString)[i] << " ";`


    `}`


    `cout << endl;`


    `return 0;`


    `}`


    When you run this application, you see the letters of the movie appear with spaces
    between them, as in


    `L . A . C o n f i d e n t i a l`


    ![Warning](images/warning.png) When you access the characters of the string through
    a pointer, you need to put parentheses around the asterisk and the pointer variable.


    This application loops through the entire string, character by character. The
    string''s `length()` function tells how many characters are in the string. The
    code inside the loop grabs the individual characters and prints them with a space
    after each.


    Notice that `i` is of type `unsigned` rather than `int`. The `length()` function
    returns an `unsigned` value rather than an `int` value, which makes sense because
    a string can''t have a negative length. If you try to use an `int` for `i`, the
    compiler displays the following warning:


    `warning: comparison between signed and unsigned integer`


    The application still runs, but you need to use the correct data types for loop
    variables. Otherwise, when the loop value increases over the amount that the loop
    variable can support, the application will fail. Trying to find such an error
    can prove frustrating even for the best developers. Don''t ignore warnings, even
    if they appear harmless.


    ![Tip](images/tip.png) You can also change the individual characters in a string
    through a pointer. You can do this by using a line like `(*ptrToString)[5] = ''X'';`.
    Notice you still need to put parentheses around the variable name along with the
    dereferencing character.


    ![Tip](images/tip.png) The length of a string is also available through the pointer.
    You can call the `length()` function by dereferencing the pointer, again with
    the carefully placed parentheses, such as in the following:


    `for (unsigned i = 0; i < (*ptrToString).length();`


    `i++)`


    `{`


    `cout << (*ptrToString)[i] << " ";`


    `}`


    ### Pointing to something else


    When you create a pointer variable, you must specify the type of data it points
    to. After that, you can''t change the type of data it points to, but you can change
    *what* it points to. For example, if you have a pointer to an integer, you can
    make it point to the integer variable called `ExpensiveComputer`. Then, later,
    in the same application, you can make it point to the integer variable called
    `CheapComputer`. [Listing 6-6](#c06.xhtml_c06-fea-0006) demonstrates this technique
    in the `ChangePointer` example.


    [LISTING 6-6](#c06.xhtml_rc06-fea-0006) Using Pointers to Point to Something Else
    and Back Again


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `int ExpensiveComputer;`


    `int CheapComputer;`


    `int *ptrToComp;`


    `ptrToComp = &ExpensiveComputer;`


    `*ptrToComp = 2000;`


    `cout << *ptrToComp << endl;`


    `ptrToComp = &CheapComputer;`


    `*ptrToComp = 500;`


    `cout << *ptrToComp << endl;`


    `ptrToComp = &ExpensiveComputer;`


    `cout << *ptrToComp << endl;`


    `return 0;`


    `}`


