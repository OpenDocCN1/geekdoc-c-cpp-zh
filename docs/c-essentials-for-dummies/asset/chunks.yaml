    \    void break_in_half();\n    void run_out_of_ink();\n};\n\n#endif // PEN_H_INCLUDED\n\
    ```\n\n在头文件中写完类的成员函数原型后，你需要在单独的实现文件中在类定义之外编写成员函数代码。然而，你需要加上类名，以便编译器知道该函数属于哪个类。你使用作用域运算符（`::`）分隔类名和函数名，从而将函数与类关联：\n\
