    0x73af10

    ```


    在这个应用程序中，你首先分配了一个指针变量并将其命名为 `ptr`。然后你调用了 `int` 类型的 `new`，它返回一个指向整数的指针。你将该返回值保存在
    `ptr` 变量中。


    你在 `ptr` 指向的内存中保存了 `10`。然后你打印 `ptr` 指向的内存中存储的值。


    为了亲眼确认 `ptr` 指向内存位置而不是 `10` 的实际值，代码还打印了未经过*解引用*（使用 `*` 运算符）的 `ptr`。输出是一个十六进制值，如
    `0x9caef0`，但此输出每次都会变化，因为内存分配每次发生在堆上的不同位置。


    如你所见，`ptr` 包含了由`new`运算符分配的值的地址。你访问它的唯一方法是通过指针。


    ![Remember](img/remember.png) 当你调用`new` 时，你会得到一个指针。该指针的类型是你在调用`new` 时指定的类型。然后你只能将该指针存储在相同类型的指针变量中。


    ![Tip](img/tip.png) 当你使用`new`运算符时，通常的术语是你正在*堆上分配内存*。


