    \    }\n    catch (string msg)\n    {\n        cout << \"FILE ERROR: \" << msg\
    \ << endl;\n    }\n    return 0;\n}\n```\n\n输出是\n`-. is`\n\n如果代码不被错误处理程序填充，它会更易读。因此，你可以在\
    \ `catch` 块中使用错误处理语句。\n\n当程序抛出异常时，它会立即跳转到 `catch` 块。因此，在前面的示例中，不会打印 `Successfully\
    \ opened` 消息。\n\n如果程序在抛出异常后没有捕获它，它将带有关于未捕获异常的错误信息并终止。\n\n![Remember](img/remember.png)\
    \ 在函数中抛出异常的一个重要特性是：如果异常在该函数内未被捕获，异常将沿着调用链传播，直到链上的某个函数或主程序本身捕获它。如果异常从未被捕获，程序将终止。\n\
    \n## 运算符重载\n\nC++ 允许你通过赋予运算符额外的功能来对其进行`overload`。例如，你可以重载 `+` 运算符来定义两个特定类对象相含义，并重载\
    \ `<<` 运算符来定义如何打印此类对象。\n\n下面的示例演示了重载 `*` 运算符来乘以两个分数，以及重载 `<<` 运算符来打印分数：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass Fraction\n{\npublic:\n    Fraction(int\
    \ n, int d)\n    : numerator(n), denominator(d) {}\n    int numerator, denominator;\n\
    };\n\nFraction operator *(Fraction& f1, Fraction& f2)\n{\n    int n = f1.numerator*f2.numerator;\n\
