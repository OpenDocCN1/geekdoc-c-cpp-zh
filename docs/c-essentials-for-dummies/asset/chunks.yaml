    ### Creating constants with #define


    The preprocessor also provides you with a lot of other directives besides `#include`.
    One of the more useful ones is the `#define` directive. Here''s a sample `#define`
    line:


    `#define MYSPECIALNUMBER 42`


    After the preprocessor sees this line, every time it encounters the word `MYSPECIALNUMBER`,
    it replaces it with the word `42` (that is, whatever sequence of letters, numbers,
    and other characters follow the definition).


    ![Warning](images/warning.png) Although you can still use `#define` statements
    in C++, in general you should simply use a constant instead of a symbol.


    Chapter 6


    # Referring to Your Data through Pointers


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Using two types of memory: The stack and the heap**


    ![Bullet](images/check.png) **Accessing variable addresses through pointers**


    ![Bullet](images/check.png) **Creating variables on the heap by using the `new`
    keyword**


    ![Bullet](images/check.png) **Taking pointers as parameters and returning pointers**


    Every little part of the computer’s memory is associated with a number that represents
    its location, or *address.* In this chapter, you see that after you determine
    the address of a variable stored in memory, you can do powerful things with it,
    which gives you the tools to create powerful applications.


    ![Tip](images/tip.png) If any single topic in C++ programming is most important,
    it is the notion of pointers.


    ## Considering the Issues with Pointers


    A *pointer* is simply an address in memory. The value it contains is the address,
    and by *dereferencing* the pointer (looking at the address to which it points),
    you see the value that the pointer references. It’s just like the address for
    your house. You send mail to the address, but the address isn’t your house — it’s
    simply a pointer to your house.


    The reason for using pointers in the first place is to avoid carrying large objects
    around in your code. Early applications had to use every tiny bit of memory and
    CPU processing cycles efficiently or face performance issues. Pointers allowed
    early applications to perform well simply by pointing at big objects in memory
    instead of passing them around.


    Applications can have invalid pointers, and when the code tries to process this
    invalid address, it often crashes the application. Of course, the worst problem
    is the null pointer, `0x000000`, which you expect to point to something — but
    a null pointer points to nothing.


    Another problem with pointers is that you spend a lot of time managing them. Every
    time you work with pointers, you risk:


    *   **Creating a memory leak:** By not deallocating the pointer so you can reuse
    the memory, the memory becomes inaccessible to the application. You could actually
    run out of memory despite having memory available. The memory becomes available
    again after the operating system frees it after the application terminates.


    *   **Using memory that hasn''t been initialized:** The memory location could
    contain anything and if you act on the data in that memory location, your application
    will act oddly or simply crash.


    *   **Obtaining the wrong data:** The application could point to the wrong location
    and you may not know it. This means that the application is using the wrong data,
    which could result in unanticipated output or data damage.


    ## Heaping and Stacking the Variables


    C++ applications use two kinds of memory:


    *   **Stack:** Each time a function is called, the computer allocates memory for
    the values of the function’s local variables in an area of memory called the *stack.*
    This memory is automatically deallocated when the function returns.


    *   **Heap:** The area in memory shared by the entire program where the computer
    stores values that the program *dynamically* creates and destroys.These values
    are accessed via pointers.


    ### Getting a variable’s address


    Because every variable lives somewhere in memory, every variable has an address.
    If you have a function that declares an integer variable called `NumberOfPotholes`,
    then when your application calls this function, the computer will allocate space
    for `NumberOfPotholes` somewhere in memory.


    ![Remember](images/remember.png) If you want to find the address of the variable
    `NumberOfPotholes`, you simply throw an ampersand (`&`) in front of it. [Listing
    6-1](#c06.xhtml_c06-fea-0001) shows the `VariableAddress` example, which obtains
    the address of a variable and prints it.


    [LISTING 6-1](#c06.xhtml_rc06-fea-0001) Using the & Character to Obtain the Address
    of a Variable


    `#include <iostream>`


    `using namespace std;`


    `int main() {`


    `int NumberOfPotholes = 532587;`


    `cout << &NumberOfPotholes << endl;`


    `return 0;`


    `}`


    When you run this application, a hexadecimal number appears on the console. This
    number may or may not match ours, and it may or may not be the same each time
    you run the application. When you run [Listing 6-1](#c06.xhtml_c06-fea-0001),
    you see something like the following (it varies with each run):


    `0x22ff74`


    Knowing the address of a variable doesn''t tell you about the variable content,
    but C++ programmers use addresses in other ways:


    *   **Modifying the variable content directly using what are called pointer variables:**
    A *pointer variable* is just like any other variable except that it stores the
    *address of* another variable.


    *   **Modifying values pointed at by the address indirectly using any of a number
    of math techniques.**


    *   **Comparing entities such as objects based on their pointers.**


    To declare a pointer variable, you need to specify the type of variable it will
    point to. Then you precede the variable’s name with an asterisk, as in the following:


    `int *ptr;`


    This line declares a variable that *points to* an integer. In other words, it
    can contain the *address* of an integer variable. And how do you grab the address
    of an integer variable? By using the `&` notation! Thus, you can do something
    like this:


    `ptr = &NumberOfPotholes;`


    This line puts the address of the variable `NumberOfPotholes` in the `ptr` variable.
    Remember that `ptr` doesn''t hold the number of potholes; instead, it holds the
    address of the variable called `NumberOfPotholes`.


    ![Tip](images/tip.png) You specify the type of pointer by the type of item it
    points to. If a pointer variable points to an integer, its type is *pointer to
    integer.* In C++ notation, its type is `int *` (with a space between them) or
    `int*` (no space). If a pointer variable points to a string, its type is *pointer
    to string,* and notation for this type is `string *`.


    ![Remember](images/remember.png) The `ptr` variable holds an address, but what''s
    at that address? That address is the location in memory of the storage bin known
    as `NumberOfPotholes`. Right at that spot in memory is the data stored in `NumberOfPotholes`.


    ### Changing a variable by using a pointer


    After you have a pointer variable holding another variable''s address, you can
    use the pointer to access the information in the other variable. That means you
    have two ways to get to the information in a variable: Use the variable name itself
    (such as `NumberOfPotholes`), or use the pointer variable that points to it.'
