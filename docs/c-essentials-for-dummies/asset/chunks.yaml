- fmt: '

    When you write an application, you specify that you want to make use of one or
    more storage bins called `variables`. Each computer storage bin can hold only
    one value at a time. A variable is simply a storage bin with an associated name.


    You can put many different types of values into your `variables`. For example,
    you can put numbers in a storage bin, or you can put a string in a storage bin.
    (However, each storage bin contains a unique kind of data — you can''t put a number
    into a storage bin designed for a string.) As for numbers, they can be either
    `integers` (which are positive whole numbers, negative whole numbers, and 0) or
    numbers with a decimal point, such as 3.11 or 10.0, which (for various reasons)
    are called `floating-point numbers`.


    ![Remember](images/remember.png) The term `floating-point number` refers to a
    number that has a decimal point and something to the right of the decimal point
    (even if it’s just a 0). When you see the term `floating point`, you can remember
    what it means by focusing on the word `point` in its name — when you see `point`,
    think of decimal point.


    ### Creating an integer variable


    In your C++ application, you can easily write a line of code that creates a variable.
    Although the variable doesn’t actually get created until you run the application,
    people often refer to this process as `creating a variable`. A variable has three
    aspects:


    *   **Name:** Every variable must have a name. In your application, you refer
    to the variable by this name. For example, you may have a variable called `count`,
    and you may have a variable called `LastName`.

    *   **Type:** When you create a variable, you must specify the type of value the
    variable can hold. For example, one variable may hold an integer, and another
    variable may hold a single character. After you pick a type for the variable in
    your application, you can put only values of that type into the variable.

    *   **Value:** At any given moment, a simple variable holds a single value. ([Chapter
    8](#c08.xhtml) describes `array` variables that can hold multiple values.) For
    example, an integer variable may hold the number `10`, and a character variable
    might hold the character `a`.


    You `declare` a variable when you specify its type and name. That is known as
    a `variable declaration`.


    The code for the `SimpleVariable` example, shown here, demonstrates how to create
    a variable:


    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    int mynumber;

    mynumber = 10;

    cout << mynumber << endl;

    return 0;

    }

    ```


    This is a full application that you can run.


    Take a careful look at this code. Remember that the computer starts with the code
    inside the braces that follow `main()`, and it performs the code line by line.


    The first line inside `main` looks like this:


    ```cpp

    int mynumber;

    ```


    When you declare a variable, the first thing you specify is the type of thing
    the variable can hold. Here, you use the word `int`. This word is the C++ word
    for `integer`. Thus, the variable that you''re declaring can hold an integer.
    Next is the name of the variable. This variable is named `mynumber`. Then a semicolon
    ends the variable declaration.


    The next line looks like this:


    ```cpp

    mynumber = 10;

    ```


    This line puts the value `10` in the variable. Because you already know that the
    variable can hold an integer, you''re allowed to put in a `10` because it’s an
    integer. If you’d tried to put a value other than an integer in the variable,
    the compiler would’ve given you an error message. The compiler makes sure that
    you put into a variable only the same type of value. And, of course, you noticed
    that the statement ends with a semicolon. In C++, every statement ends with a
    semicolon.


    ![Remember](images/remember.png) To put a value in a variable, you type the variable’s
    name, an equal sign (surrounded by optional spaces), and the value. You end the
    line with a semicolon. This line of code is an `assignment statement`. Or you
    can say that you’re `setting` the variable to the value.


    The next line is this:


    ```cpp

    cout << mynumber << endl;

    ```


    This is a `cout` statement, which means that it writes something on the console.
    This code tells the computer to write the value of `mynumber` on the console.
    The previous line of code put a `10` in the storage bin, so this line prints a
    `10` on the console. The `endl` means “end line”, so the `10` is printed on a
    line by itself. When you run the application, you see this:


    ```

    10

    ```


    ![Tip](images/tip.png) Think of it like this: When you type the variable''s name,
    you’re accessing the variable. The exception to this is when the variable’s name
    appears to the left of an equal sign. In that case, you’re setting the variable.
    You can do two things with a variable:


    *   **Setting the variable:** You can set a variable, which means that you can
    put a value inside the storage bin.

    *   **Retrieving the value:** You can get back the value that is inside the variable.
    When you do so, the value stays inside it.


    ![Remember](images/remember.png) When you retrieve the value that’s in a variable,
    you aren’t removing it from the variable. The value is still inside the variable.


    ### Declaring multiple variables


    If you want to declare multiple variables, you can do it in a single statement.
    For example, if you want to declare three integer variables named `monica`, `rachel`,
    and `phoebe`, you can use this code:


    ```cpp

    int monica, rachel, phoebe;

    ```


    Then you can assign values to each of them individually:


    ```cpp

    monica = 10;

    rachel = 20;

    phoebe = 30;

    ```


    ![Remember](images/remember.png) When you run the applications, the computer executes
    the statements in the order in which they appear. Therefore, in the preceding
    code, the computer first creates the storage bins. Then it puts the value `10`
    inside `monica`. Next, `rachel` gets `20`. And finally, `phoebe` gets `30`.


    ### Changing values


    Although a variable can hold one value at a time, you can still change what it
    holds. After you put another value in a variable, it forgets what it had.


    You put another value in the variable in the same way you originally put value
    in it. Look closely at the code for the `ChangeVariable` example:


    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    int mynumber;

    mynumber = 10;

    cout << mynumber << endl;

    mynumber = 20;

    cout << mynumber << endl;

    return 0;

    }

    ```


    ![Remember](images/remember.png) When you see a single equal sign by itself, the
    item on the left side is the variable that receives the value that is on the right
    side.


    ### Setting one variable equal to another


    Because you can do only two direct things with variables — put something in and
    retrieve the value — setting one variable equal to another is a simple process
    of retrieving the value of one variable and putting it in the other. This process
    is often referred to as `copying` the variable from one to another. For example,
    if you have two integer variables — say, `start` and `finish` — and you want to
    copy the value of `start` into `finish`, you would use a line of code like the
    following:


    ```cpp

    finish = start;

    ```


    ![Warning](images/warning.png) Don''t let the language confuse you. Although you
    want to copy the value of `start` into `finish`, notice that the first thing you
    type is `finish`, and then the equal sign, and then `start`. The left side of
    the equal sign is what *receives* the value.


    ![Remember](images/remember.png) When you copy the value of one variable to another,
    the two variables must be the same type. For instance, you can''t copy the value
    from a string variable into an integer variable. If you try, the compiler issues
    an error message.

