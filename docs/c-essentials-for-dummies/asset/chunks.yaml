    the start and end of a string in your code based on the location of the double
    quotes.


    You can create a variable that can hold a string. The type you use is `string`.
    The `CreateString` example, shown here, demonstrates how to use a `string` variable.


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `string mystring;`


    `mystring = "Hello there";`


    `cout << mystring << endl;`


    `return 0;`


    `}`


    When you run this application, the string `Hello there` appears on the console.
    The first line inside `main()` creates a string variable called `mystring`. The
    second line initializes it to `"Hello there"`. The third line prints the string
    to the console.


    ### Getting a part of a string


    Accessing the individual characters within a string is easy. Take a look at the
    following `IndividualCharacter` example:


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `string mystring;`


    `mystring = "abcdef";`


    `cout << mystring[2] << endl;`


    `return 0;`


    `}`


    Notice that the ninth line, the `cout` line, has the word `mystring` followed
    by a `2` inside brackets (`[2]`). When you run this application, here''s what
    you see:


    `c`


    That’s it, just a letter `c`. The `2` inside brackets means that you want to access
    the *third* character of the string and only that character.


    ![Remember](images/remember.png) C++ starts numbering the positions inside the
    string at 0\. So for this string, `mystring[0]` is the first character, which
    happens to be `a`. Therefore, `mystring[2]` gets the *third* character. In general,
    this book uses *fourth position* to mean the fourth position, which you access
    through `mystring[3]`. (The number inside brackets is called an *index.*)


    A string is made of characters. So, a single character within a string has the
    type `char`. This means that you can do something like this (as shown in the `IndividualCharacter2`
    example):


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `string mystring;`


    `mystring = "abcdef";`


    `char mychar = mystring[2];`


    `cout << mychar << endl;`


    `}`


    In this example, `mychar` is a variable of type `char`. The `mystring[2]` expression
    *evaluates* to a value of type `char`. So, the assignment is valid. When you run
    this, you once again see the single character in the third position:


    `c`


    ### Changing part of a string


    Using the bracket notation, you can also change a character inside a string. The
    following code, for example, changes the second character in the string (that
    is, the one with index `1`) from a `b` to a `q`:


    `string x = "abcdef";`


    `x[1] = ''q'';`


    `cout << x << endl;`


    This code writes the string `aqcdef` to the console.


    ### Adding onto a string


    You can easily add to a string variable. The following lines of code use the `+=`
    operator, which was also used in adding numbers:


    `string mystring;`


    `mystring = "Hi ";`


    `mystring += "there";`


    `cout << mystring << endl;`


    The first line declares the string `mystring`. The second line initializes it
    to `"Hi "`. The third line uses the `+=` operator, which appends something to
    the string — in this case, `"there"`. So, after this line runs, the string called
    `mystring` contains the string `"Hi there"`, and that''s what appears on the console
    when the `cout` line runs. The programmer term for adding something to a string
    is *concatenation.*


    You can also do something similar with characters. The following code snippet
    adds a single character to a string:


    `string mystring;`


    `mystring = "abcdef";`


    `mystring += ''g'';`


    `cout << mystring << endl;`


    This code creates a string with `"abcdef"` and then adds a `''g''` character to
    the end to get `"abcdefg"`. Then it writes the full `"abcdefg"` to the console.


    ### Adding two strings


    You can take two strings and add them together by using a plus sign (`+`), just
    as you can do with integers. The final result is a new string that has copies
    of the values of the two strings pushed together, side-by-side. For example, the
    following code adds `first` to `second` to get a new string called `third`:


    `string first = "hello ";`


    `string second = "there";`


    `string third = first + second;`


    `cout << third << endl;`


    This code prints the value of `third`, which is `"hello there"`. (Notice that
    the string called `first` has a space at its end, which is inside quotes and,
    therefore, part of the string.) You can also add a *string constant* (that is,
    an actual string in your application surrounded by quotes) to an existing string
    variable, as shown here:


    `string first = "hello ";`


    `string third = first + "there";`


    `cout << third << endl;`


    ![Warning](images/warning.png) You may be tempted to try to add two string constants
    together, like this:


    `string bigstring = "hello " + "there";`


    `cout << bigstring << endl;`


    Unfortunately, this won''t work. In C++, a string constant and a string are fundamentally
    different.


    ## Telling the Truth with Boolean Variables


    In addition to integers and strings, another type in C++ can be pretty useful:
    a *Boolean variable.* Whereas an integer variable is a storage bin that can hold
    any integer value, a Boolean variable can hold only one of two different values:
    a `true` or a `false`.


    The type name for a Boolean variable is `bool`. Therefore, to declare a Boolean
    variable, you use a statement like this:


    `bool finished;`


    This line declares a Boolean variable called `finished`. Then you can put either
    a `true` or a `false` in this variable, as in the following:


    `finished = true;`


    Or:


    `finished = false;`


    When you print the value of a Boolean variable by using code like this:


    `cout << finished << endl;`


    You see either a `1` for `true` or a `0` for `false`. The reason is that the computer
    stores a `1` to represent `true` and a `0` to represent `false`.


    ## Using Floating-Point Values in a Variable


    You can declare and initialize a variable to hold a floating-point value like
    this:


    `float temperature = 98.7;`


    A `float` variable can have a floating-point value with a limited precision and
    magnitude:


    *   **Precision:** The maximum number of *significant digits* (the digits that
    don''t include leading and trailing zeros) that the value can have. Typically,
    it’s around seven digits.


    *   **Magnitude:** How small or how large the value can be. Typically, it’s between
    10^(–38) and 10^(+38).


    Therefore, you can set the values of `float` variables `proton_mass` (in kilograms)
    and `grains_of_sand` (on Earth):


    `float proton_mass =`


    `0.000000000000000000000000001672622;`


    `float grains_of_sand = 7500000000000000000;`


    You can use *scientific notation* where you include the *exponent* (a power of
    10) to write very large or very small floating-point values. Write the positive
    or negative exponent after a small `e` or a capital `E`:


    `float proton_mass = 1.672622e-27;`


    `float grains_of_sand = 7.5e+18;`


    A `double` variable can have a floating-point value with as many as around 15
    significant digits and a magnitude typically between 10^(–308) and 10^(+308).
    Therefore, you can write:


    `double sqrt2 = 1.4142135623731;`


    ## Printing Float and Double Values


    By default, `cout` prints a few significant digits of a floating-point value,
    whether it''s a `float` or a `double`, and it prints large or small floating-point
    values in scientific notation. But you can use the `set_precision()` function
    to tell `cout` how many digits to print after the decimal point, and the `fixed`
    flag to tell it not to use scientific notation, as demonstrated by the following
    example program, `Floats.cpp`:


    `#include <iostream>`


    `#include <iomanip>`


    `using namespace std;`


    `int main()`


    `{`


    `float temperature = 98.7;`


    `double sqrt2 = 1.4142135623731;`


    `float proton_mass =`


    `0.000000000000000000000000001672622;`


    `float grains_of_sand = 7500000000000000000;`


    `cout << temperature << " " << sqrt2 << endl;`


    `cout << setprecision(12) << sqrt2 << endl;`


    `cout << setprecision(7) << proton_mass`'
