  trans: "\n\n算法库包含了执行有用操作的函数，例如排序和搜索。以下示例演示了在字符串向量上使用 `reverse()` 和 `sort()` 函数。以下语句演示了如何反转字符串向量内容的顺序，以及将字符串按字母顺序进行排序。\n\
    \n```cpp\n#include <vector>\n#include <string>\n#include <algorithm>\n\nusing\
    \ namespace std;\n…\nvector<string> week{\"Sunday\", \"Monday\",\n\"Tuesday\"\
    , \"Wednesday\",\n\"Thursday\", \"Friday\",\n\"Saturday\"};\nreverse(week.begin(),\
    \ week.end());\nsort(week.begin(), week.end());\n```\n\n## 智能指针\n\n使用 `raw`（原始）指针时，常见的运行时错误是忘记删除指针所指向的动态创建的对象。这可能导致堆中充满了程序不再使用的对象。另一个常见错误是尝试多次删除同一个对象。\n\
    \n![Warning](img/warning.png) 即使堆中的一个对象已经通过对指针变量执行 `delete` 语句被删除了，该变量也不会自动设置为\
    \ `nullptr`，它仍然指向该对象曾经所在的内存位置。这会导致难以检测的逻辑错误。\n\nC++ 现在拥有“智能”指针，缓解了原始指针引起的问题。智能指针有两种类型：`unique\
    \ pointers`（唯一指针）和 `shared pointers`（共享指针）。\n\n唯一指针对其指向的对象具有独占所有权。没有其他智能指针可以指向该对象，但可以使用\
    \ `std::move()` 将所有权转移给另一个唯一指针。在转移之后，原始所有者指针会自动设置为 `nullptr`。当唯一指针超出作用范围时（例如从声明该唯一指针的函数返回时），它所指向的对象将被自动删除。\n\
    \n以下语句演示了唯一指针。在声明唯一指针时，可以使用原始指针或 `nullptr` 初始化它。你可以使用唯一指针的 `reset()` 方法来更改它的值。你可以像使用普通指针一样通过\
    \ `*` 和 `->` 访问智能指针所指向的值。\n\n```cpp\nusing namespace std;\n…\nunique_ptr<Item>\
    \ uniq_ptr1(new Item(101));\nunique_ptr<Item> uniq_ptr2(nullptr);\nuniq_ptr2 =\
    \ std::move(uniq_ptr1);\nuniq_ptr2.reset(new Item(888));\ncout << uniq_ptr2->id;\n\
    ```\n\n堆中的对象可以被多个共享指针指向；这些指针对该对象共享所有权。当最后一个指向该对象的共享指针不再指向它时，该对象会被删除。因此，对象只会被删除一次。\n\
    \n以下语句创建共享指针：\n\n```cpp\nshared_ptr<Item> shar_ptr1(new Item(101));\nshared_ptr<Item>\
    \ shar_ptr2(shar_ptr1);\n```\n\n## 索引\n\n* * *\n\n## A\n\n*   访问成员，126–128\n*\
    \   添加\n    *   头文件，85\n    *   整数变量，16–19\n    *   到字符串上，28\n    *   构造函数的参数，138–140\n\
