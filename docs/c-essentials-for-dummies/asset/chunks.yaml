    \ 循环中使用了它），保持大小一致通常是一个好主意。不要在一个函数中使用 `count`，而在另一个函数中使用 `Count`。虽然你完全可以这样做，但当你需要使用该变量时，你可能会发现自己写错了名称。不过这不会导致你访问到另一个变量（你无法访问，因为它在不同的函数中）。相反，你会收到一条错误消息，然后必须回去修复它。保持一致性可以节省时间。\n\
    \n## 前向引用与函数原型\n\n本章中的所有示例都将函数代码放在了 `main()` 代码的上方。这是因为编译器是从头到尾扫描代码的。如果它还没有遇到某个函数但看到了对它的调用，它就不知道自己看到了什么，并会发出错误消息。\n\
    \n然而，你也可以将函数放在 `main()` 之后；你甚至可以使用函数原型将函数放在其他的源文件中。\n\n`function prototype`（函数原型）无非是函数头的副本。但你不是在函数头后面跟着大括号和函数代码，而是在函数头后面加一个分号，就完成了。一个函数原型看起来像这样：\n\
    \n`void PrintName(string first, string last);`\n\n然后你之后再编写完整的函数（头、代码及所有内容）。完整函数甚至比\
