  raw: "The algorithms library contains functions that perform useful operations,\
    \ such as sorting and searching. The following example demonstrates functions\
    \ `reverse()` and `sort()` on a vector of strings. The following statements demonstrate\
    \ reversing the order of the contents of a vector of strings and sorting the strings\
    \ into alphabetical order.\n\n`#include <vector>`\n\n`#include <string>`\n\n`#include\
    \ <algorithm>`\n\n`using namespace std;`\n\n`…`\n\n`vector<string> week{\"Sunday\"\
    , \"Monday\",`\n\n`\"Tuesday\", \"Wednesday\",`\n\n`\"Thursday\", \"Friday\",`\n\
    \n`\"Saturday\"};`\n\n`reverse(week.begin(), week.end());`\n\n`sort(week.begin(),\
    \ week.end());`\n\n## Smart Pointers\n\nA common runtime error when using *raw*\
    \ (regular) pointers is forgetting to delete dynamically created objects that\
    \ the pointers are pointing to. That can cause the heap to become filled with\
    \ objects that the program no longer uses. Another common error is to attempt\
    \ to delete an object more than once.\n\n![Warning](images/warning.png) Even if\
    \ an object in the heap has been deleted by executing a `delete` statement with\
    \ the pointer variable, the variable is not automatically set to `nullptr`, and\
    \ it still points to the memory where the object used to be. That can cause hard-to-detect\
    \ logic errors.\n\nC++ now has “smart” pointers that alleviate the problems caused\
    \ by raw pointers. There are two kinds of smart pointers: *unique pointers* and\
    \ *shared pointers.*\n\nA unique pointer has exclusive ownership of the object\
    \ it points to. No other smart pointer can also point to that object, but the\
    \ ownership can be transferred to another unique pointer by using `std::move()`.\
    \ After such a transfer, the original owner pointer is automatically set to `nullptr`.\
    \ The object pointed to by a unique pointer is automatically deleted when the\
    \ unique pointer goes out of scope, such as upon return from a function where\
    \ the unique pointer was declared.\n\nThe following statements demonstrate unique\
    \ pointers. When declaring a unique pointer, you can initialize it with a raw\
    \ pointer or with `nullptr`. You can use the unique pointer's `reset()` method\
    \ to change its value. You can access the value pointed to by a smart pointer\
    \ with `*` and `->` as you would with a regular pointer.\n\n`using namespace std;`\n\
    \n`…`\n\n`unique_ptr<Item> uniq_ptr1(new Item(101));`\n\n`unique_ptr<Item> uniq_ptr2(nullptr);`\n\
    \n`uniq_ptr2 = std::move(uniq_ptr1);`\n\n`uniq_ptr2.reset(new Item(888));`\n\n\
    `cout << uniq_ptr2->id;`\n\nAn object in the heap can be pointed to by multiple\
    \ shared pointers; these pointers have shared ownership of the object. The object\
    \ is automatically deleted when the last of its shared pointers no longer points\
    \ to the object. So, the object is deleted only once.\n\nThe following statements\
    \ create shared pointers:\n\n`shared_ptr<Item> shar_ptr1(new Item(101));`\n\n\
    `shared_ptr<Item> shar_ptr2(shar_ptr1);`\n\n# Index\n\n* * *\n\n## A\n\n*   accessing\
