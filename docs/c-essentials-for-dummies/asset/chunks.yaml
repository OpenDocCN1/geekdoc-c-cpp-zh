  raw: '`final = final - time;`


    Or you can do the same thing by using the shortcut notation:


    `final -= time;`


    Finally, as with addition, you have a shortcut to a shortcut. If you want only
    to subtract 1, you can simply use two minus signs, as in the following:


    `Final—  —;`


    This line is pronounced *minus minus.* The `--` is the *decrement operator.* When
    applied to a variable, it''s called *decrementing the variable.*


    ### Multiplying integer variables


    To do multiplication in C++, you use the asterisk (`*`) symbol. As with addition
    and subtraction, you can multiply two variables, or you can multiply a variable
    by a number. You can either print the result or save it in a variable. For example,
    you can multiply two variables and print the results to the console with the following
    line:


    `cout << length * width << endl;`


    Or you can multiply a variable by a number, as in this line:


    `cout << length * 5 << endl;`


    And as with addition and subtraction, you can multiply two variables and save
    the result in a third variable:


    `area = length * width;`


    You can also use multiplication to modify a variable’s value, as in


    `total = total * multiplier;`


    Or, to use the shortcut:


    `total *= multiplier;`


    And (as before) you can do the same with just a number:


    `total = total * 25;`


    Or this:


    `total *= 25;`


    ![Warning](images/warning.png) Note that there is no `**` operator used to multiply
    a value by 1 or by itself. Consequently, the compiler will raise an error if you
    type **total**;**.


    ### Dividing integer variables


    Although addition, subtraction, and multiplication are straightforward with integer
    variables, division is a bit trickier. The chief reason is that, with integer
    values, sometimes you just can''t divide evenly.


    In terms of strictly whole numbers, the answer to 21 divided by 5 is *4 remainder
    1.* And that’s how the computer does arithmetic with integers. It gets two different
    answers: the *quotient* and the *remainder.* What’s left over is the *remainder.*


    Because two different answers to a division problem may occur, C++ uses two different
    operators for figuring these two different answers.


    To find the quotient, use the slash (`/`). Think of this character as the usual
    division operator, because when you deal with integer values that divide evenly,
    this operator gives you the correct answer. Thus, `10 / 2` gives you `5`, as you
    would expect. Most people just call this the division operator.


    To find the remainder, use the percent sign (`%`). This is often called the *modulus
    operator.*


    The `DivideInteger` example, shown next, takes two numbers and prints their quotient
    and remainder. Then it does it again for another pair of numbers. The first pair
    has no remainder, but the second pair does.


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `int first, second;`


    `cout << "Dividing 28 by 14." << endl;`


    `first = 28;`


    `second = 14;`


    `cout << "Quotient " << first / second`


    `<< endl;`


    `cout << "Remainder " << first % second`


    `<< endl;`


    `cout << "Dividing 32 by 6." << endl;`


    `first = 32;`


    `second = 6;`


    `cout << "Quotient " << first / second`


    `<< endl;`


    `cout << "Remainder " << first % second`


    `<< endl;`


    `return 0;`


    `}`


    When you run this application, you see the following output:


    `Dividing 28 by 14.`


    `Quotient 2`


    `Remainder 0`


    `Dividing 32 by 6.`


    `Quotient 5`


    `Remainder 2`


    ![Tip](images/tip.png) This code uses a couple new tricks in addition to the division
    tricks. You can combine the output of strings and numbers into a single `cout`
    statement. You did this for four of the `cout` statements. That''s acceptable,
    as long as you string them together with the `<<` signs between each of them.


    `myRemainder = first % second;`


    ![Tip](images/tip.png) The following shortcuts are available:


    `int first = 30;`


    `int second = 33;`


    `first /= 5;`


    `second %= 5;`


    `cout << first << " " second << endl;`


    ## Working with Character Variables


    Another type of variable you can have is a character variable. A *character variable*
    can hold a single — *just one* — character that C++ stores as a number. It holds
    a value between –127 and 128 (`char` or `signed char`) or between 0 and 255 (`unsigned
    char`). Normally, a *character* is anything that can be typed, such as a letter
    of the alphabet, a digit, or another symbol you see on the computer keyboard,
    but a character can also hold nonprintable values found in an ASCII table (see
    [`https://en.cppreference.com/w/cpp/language/ascii`](https://en.cppreference.com/w/cpp/language/ascii)).
    Some of these unprintable characters are *control characters* (so called because
    they control the appearance of text on the screen), such as the tab, carriage
    return, and newline character.


    To declare a character variable, you use the type name `char`. To initialize a
    character variable, you put the character inside *single* quotes. The following
    is an example of a character:


    `char ch;`


    `ch = ''a'';`


    `cout << ch << endl;`


    The character variable here is called `ch`, which is initialized to the character
    `a`. It''s surrounded by single quotes. The code then prints it by using `cout`.


    ### Null character


    One important character in the programming world is the *null character.* The
    computer stores each character by using a number, and the null character’s number
    is 0.


    To notate the null character in C++, use `\0`, as in the following:


    `char mychar = ''\0'';`


    ### Nonprintable and other characters


    The null character is an example of a *nonprintable character.* You can try to
    print one, but you get either a blank space or nothing at all, depending on the
    compiler.


    But some characters are special in that they do something when you print, though
    you can''t type them directly. One example is the newline character. The *newline
    character* (`\n`) symbolizes the start of a new line of text. In all cases, the
    computer places the *insertion point* (the place where it adds new characters)
    on the next line. If you’re printing some text to the console and then you print
    a newline character, any text that follows will be on the next line.


    The *carriage return* character (`\r`) places the insertion point at the start
    of the line, but not on a new line (which means that if you use just a carriage
    return on a computer expecting both a carriage return and a newline, you overwrite
    what''s already on the line). That’s true with pretty much every C++ compiler.


    The tab character (`\t`) and other characters start with a backslash. These are
    individual characters, and you can have them inside a character variable, as in
    the following example, which prints the letter *a,* and then a tab, and then the
    letter *b.* Notice that, to get the tab character to go into the character variable,
    you have to use the backslash (`\`) and then a `t`:


    `char ch = ''\t'';`


    `cout << "a" << ch << "b" << endl;`


    To put a double quote inside a string, you need to precede the double quote with
    a backslash so the computer won''t think that the double quote is the end of the
    string. But because a character is surrounded by single quotes, you don’t need
    to do this. You can just put a double quote inside the character, as in the following:


    `char ch = ''"'';`


    Of course, that raises an important question now: What about single quotes? This
    time, you *do* have to use the backslash:


    `char ch = ''\'''';`


    And finally, to put a backslash inside a character, you use two backslashes:


    `char ch = ''\\'';`


    ![Remember](images/remember.png) When the compiler sees a backslash inside a string
    or a character, it treats the backslash as special and looks at whatever follows
    it. If you have something like `''\''` with no other character inside the single
    quotes following it, the compiler thinks the final quote is to be combined with
    the backslash. And then it moves forward, expecting a single quote to follow,
    representing the end. Because a single quote doesn’t appear, the compiler issues
    an error message.


