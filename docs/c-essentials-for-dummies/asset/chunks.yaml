  trans: "\n\n当你创建一个类的新实例时，你可能想要进行一些基础的对象设置。假设你有一个名为 `Apartment` 的类，它有一个名为 `NumberOfOccupants`\
    \ 的私有属性。\n\n当你创建一个 `Apartment` 的新实例时，你可能希望将 `NumberOfOccupants` 初始化为 `0`。实现此点的最佳方法是向你的类添加一个特殊的成员函数，即`构造函数`（constructor）。该函数包含行如下所示的代码：\n\
    \n```\nNumberOfOccupants = 0;\n```\n\n每当你创建一个 `Apartment` 类的新实例时，计算机都会为你的新对象调用此构造函数，从而将\
    \ `NumberOfOccupants` 设置为 `0`。可以将构造函数视为一个`初始化函数`（initialization function）：计算机会在你创建新对象时调用它。\n\
    \n要编写一个构造函数，你将其作为另一个成员函数添加到类中，并将其设置为公有（public）。你将构造函数的命名与类名相同。对于 `Apartment` 类，你将构造函数命名为\
    \ `Apartment()`。构造函数没有返回值，甚至连 `void` 没有。你可以在构造函数中包含参数（参见本章稍后的“为构造函数添加参数”）。\n\n\
    ### 析构函数（Ending with destructors）\n\n当你删除一个类的实例时，你可能希望在释放对象内存之前运行一些`清理`（cleanup）代码来处理。例如，你的对象可能拥有指向其他对象的指针。删除这些其他对象是非常关重要的。你将清理代码放在一个名为析构函数（destructor）的特殊成员函数中。`析构`是计算机在删除你的对象之前调用的终结函数。\n\
    \n析构函数的名称与类名相同，但开头有一个波浪号（`~`）（波浪号通常位于键盘的左上角）。对于名为 `Squirrel` 的类，析构函数为 `~Squirrel()`。析构函数没有返回值，甚至\
    \ `void` 没有，因为你无法从析构中返回任何内容（毕竟对象已经消失了）。你只需要从函数名开始且不带参数。下一节“采样构造函数和析构函数”将展示一个同时使用构造函数和析构函数的示例。\n\
    \n![Tip](img/tip.png) 构造函数和析构函数是 C++ 程序员的常态。几乎每个类都有构造函数，许多类也有析构函数。\n\n### 采样构造函数和析构函数\n\
    \nListing 7-7 所示的 `WalnutClass` 示例使用了构造函数和析构函数。该应用程序涉及两个类：主类名为 `Squirrel`，它演示了构造函数和析构函数；另一个名为\
    \ `Walnut`，它被 `Squirrel` 类使用。\n\nListing 7-7 使用构造函数和析构函数进行初始化和终结\n\n```\n#include\
    \ <iostream>\n\nusing namespace std;\n\nclass Walnut {\npublic:\n    int Size;\n\
    };\n\nclass Squirrel {\nprivate:\n    Walnut *MyDinner;\npublic:\n    Squirrel();\n\
    \    ~Squirrel();\n};\n\nSquirrel::Squirrel() {\n    cout << \"Starting!\" <<\
    \ endl;\n    MyDinner = new Walnut;\n    MyDinner->Size = 30;\n}\n\nSquirrel::~Squirrel()\
    \ {\n    cout << \"Cleaning up my mess!\" << endl;\n    delete MyDinner;\n}\n\n\
    int main() {\n    Squirrel *Sam = new Squirrel;\n    Squirrel *Sally = new Squirrel;\n\
    \    delete Sam;\n    delete Sally;\n    return 0;\n}\n```\n\n`Squirrel` 类有一个名为\
    \ `MyDinner` 的属性，它是指向 `Walnut` 实例的指针。`Squirrel` 构造函数创建一个 `Walnut` 实例并存储在 `MyDinner`\
    \ 中。析构函数删除 `Walnut` 实例。在 `main()` 中，代码创建了两个 `Squirrel` 实例。每个实例都有自己的 `Walnut` 来吃。每个\
    \ `Squirrel` 在启动时创建它的 `Walnut`，并在 `Squirrel` 被删除时删除 `Walnut`。\n\n当你运行此应用程序时，你可以看到以下行，它们是由\
    \ `Squirrel` 在其构造函数和析构函数输出的。（你看到各两行是因为 `main()` 创建了两个 squirrel。）\n\n```\nStarting!\n\
    Starting!\nCleaning up my mess!\nCleaning up my mess!\n```\n\n### 为构造函数添加参数\n\n\
    没有参数的构造函数称为`默认构造函数`（default constructor）。但与其他成员函数一样，构造函数允许你包含参数。当你这样做时，可以在初始化过程中使用这些参数。要使用它们，你可以在创建对象时在括号内列出参数。由于构造函数有参数，你可以通过改变参数的数量和类型为类创建多个重载构造函数。\n\
    \n假设你希望 `Squirrel` 类拥有一个 `name` 属性。尽管你可以创建一个 `Squirrel` 实例然后设置它的 `name` 属性，但你可以通过使用构造函数直接指定\
    \ `name`。构造函数的原型看起来如下：\n\n```\nSquirrel(string StartName);\n```\n\n然后，你像这样创建一个新实例：\n\
    \n```\nSquirrel *Sam = new Squirrel(\"Sam\");\n```\n\n构造函数期望一个 `string`，所以你在创建对象时传递一个\
    \ `string`。\n\nListing 7-8 所示的 `SquirrelClass` 示例展示了一个包含参数的应用程序。\n\nListing 7-8\
    \ 在构造函数中放置参数\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass Squirrel\
    \ {\nprivate:\n    string Name;\npublic:\n    Squirrel(string StartName);\n  \
    \  void IsMyName();\n};\n\nSquirrel::Squirrel(string StartName) {\n    cout <<\
    \ \"Starting!\" << endl;\n    Name = StartName;\n}\n\nvoid Squirrel::IsMyName()\
    \ {\n    cout << \"My name is \" << Name << endl;\n}\n\nint main() {\n    Squirrel\
    \ *Sam = new Squirrel(\"Sam\");\n    Squirrel *Sally = new Squirrel(\"Sally\"\
    );\n    Sam->IsMyName();\n    Sally->IsMyName();\n    delete Sam;\n    delete\
    \ Sally;\n    return 0;\n}\n```\n\n在 `main()` 中，你向构造函数传递字符串。构造函数获取 `StartName`\
    \ 参数并将其赋值给 `Name` 属性。`IsMyName()` 成员函数将 `Name` 输出到控制台。\n\n你可以在构造中使用特殊语法初始化成员变量。例如，你可以这样编写\
    \ `Squirrel` 的构造函数：\n\n```\nSquirrel::Squirrel(string StartName)\n: Name(StartName)\n\
    {\n    cout << \"Starting!\" << endl;\n}\n```\n\n### 构建类的层次结构\n\n当你开始描述类时，你通常会发现类的`层次结构`（hierarchies）。例如，你可以将\
    \ `Vehicle` 分为汽车品牌，如 `Ford`、`Honda` 和 `Toyota`。然后你可以将 `Toyota` 类分为模型，如 `Prius`、`Avalon`、`Camry`\
    \ 和 `Corolla`。你可以为其他的类层次结构创建类似的分组；这取决于你如何分类以及如何使用该层次结构。在层次结构中，`Vehicle` 位于顶部。这个类包含了每种品牌或型号车辆的属性。例如，所有车辆都有轮子。轮子的数量不同，但在这一点并不重要，因为类还没有属性的具体值。\n\
    \n每个品牌都有某些其独特的特征，但每个品牌都拥有 `Vehicle` 类的所有特征。这被称为*继承*（inheritance）。例如，`Toyota` 类拥有\
    \ `Vehicle` 类的所有属性。而 `Prius` 类拥有 `Toyota` 类的所有属性，其中包括继承自 `Vehicle` 的属性。\n\n"
- fmt: "\nIn C++, you can create a hierarchy of classes. When you take one class and\
    \ create a new one under it, such as creating `Toyota` from `Vehicle`, you're\
    \ `deriving` a new class, which means `Toyota` is a `child` of `Vehicle` in the\
    \ hierarchy.\n\nTo derive a class from an existing class, you write the new class\
    \ as you would any other class, but you extend the header after the class name\
    \ with a colon (`:`) the word `public`, and then the class you're deriving from,\
    \ as in the following class header line:\n\n```cpp\nclass Toyota : public Vehicle\
    \ {\n```\n\nWhen you do so, the class you create (`Toyota`) `inherits` the member\
    \ variables and member functions from the `parent` class (`Vehicle`). For example,\
    \ if `Vehicle` has a public member variable called `NumberOfWheels` and a public\
    \ member function called `Drive()`, the class `Toyota` has these members, although\
    \ you didn't write the members in `Toyota`.\n\nThe `VehicleClass` example, shown\
    \ in [Listing 7-9](#c07.xhtml_c07-fea-0009), demonstrates class inheritance. It\
    \ starts with a class called `Vehicle`, and a derived class called `Toyota`. You\
    \ create an instance of `Toyota` in `main()` and call two member functions for\
    \ the instance, `MeAndMyToyota()` and `Drive()`. The definition of the `Toyota`\
    \ class doesn't show a `Drive()` function. The `Drive()` function is inherited\
    \ from the `Vehicle` class. You can call this function like a member of the `Toyota`\
    \ class because in many ways it `is.*\n\n### [LISTING 7-9](#c07.xhtml_rc07-fea-0009)\
    \ Deriving One Class from Another\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nclass Vehicle {\npublic:\n  int NumberOfWheels;\n  void Drive() {\n\
    \    cout << \"Driving, driving, driving…\"\n    << endl;\n  }\n};\n\nclass Toyota\
    \ : public Vehicle {\npublic:\n  void MeAndMyToyota() {\n    cout << \"Just me\
    \ and my Toyota!\" << endl;\n  }\n};\n\nint main() {\n  Toyota MyCar;\n  MyCar.MeAndMyToyota();\n\
    \  MyCar.Drive();\n  return 0;\n}\n```\n\nWhen you run this application, you see\
    \ the output from two functions:\n\n`Just me and my Toyota!`\n`Driving, driving,\
    \ driving…`\n\n### Overriding member functions\n\nThe `signature` of a function\
    \ includes its function name and the number, datatypes, and order of its parameters.\
    \ (The names of the parameters are not part of the signature.) A subclass can\
    \ `override` a superclass's member function by defining a member function with\
    \ the same signature. This allows the subclass to supersede a behavior of its\
    \ superclass.\n\nIn [Listing 7-10](#c07.xhtml_c07-fea-0010), class `Item` defines\
    \ a `print_cost()` member function that prints a regular item's `price` times\
    \ the `quantity`. You must specify the function to be `virtual` to allow the class's\
    \ subclasses to override it. When a class has virtual functions, it must also\
    \ have virtual destructor, even if it only has empty block:\n\n```cpp\nvirtual\
    \ ~Item() {}\n```\n\nSubclass `DiscountedItem` has a private `discount`. Its `print_cost()`\
    \ member function has the same signature as `Item`'s, so it overrides it. Its\
    \ behavior is different because its cost includes a discount. Note the `override`\
    \ specified in the function header. Similarly, subclass `DonatedItem`'s `print_cost()`\
    \ member function overrides `Item`'s member function. It simply prints 0.\n\n\
    ### [LISTING 7-10](#c07.xhtml_rc07-fea-0010) Overriding Functions\n\n```cpp\n\
    #include <iostream>\n#include <string>\n\nusing namespace std;\n\nclass Item {\n\
    public:\n  virtual ~Item() {}\n  virtual void print_cost(double price, int quantity)\
    \ {\n    cout << \"Regular cost = \" << price*quantity << endl;\n  }\n};\n\nclass\
    \ DiscountedItem: public Item {\npublic:\n  DiscountedItem(double d) : discount(d)\
    \ {}\n  virtual ~DiscountedItem() {}\n  void print_cost(double price, int quantity)\
    \ override {\n    cout << \"Discounted cost = \" << price*(1 - discount) << endl;\n\
    \  }\nprivate:\n  double discount;\n};\n\nclass DonatedItem: public Item {\npublic:\n\
    \  virtual ~DonatedItem() {}\n  void print_cost(double price, int quantity) override\
    \ {\n    cout << \"Donated cost = \" << 0 << endl;\n  }\n};\n\nint main() {\n\
    \  Item regular_item;\n  DiscountedItem discounted_item(0.25);\n  DonatedItem\
    \ donated_item;\n  regular_item.print_cost(2.99, 3);\n  discounted_item.print_cost(2.99,\
    \ 3);\n  donated_item.print_cost(2.99, 3);\n  return 0;\n}\n```\n\nOutput from\
    \ the progam is\n`Regular cost = 8.97`\n`Discounted cost = 6.7275`\n`Donated cost\
    \ = 0`\n\n### Generating random numbers\n\nThe C++ `rand()` function uses an algorithm\
    \ to generate `pseudo-random` positive integer values. A program that calls `rand()`\
    \ would get the same sequence of pseudo-random values each time it's run. However,\
    \ you can call function `srand()` to set a different seed value for the algorithm\
    \ to get a different sequence. A common seed value is the result of calling the\
    \ function `time(0)`, which returns the current time in seconds. Then each time\
    \ you run the program, the seed value is different, so you'll get a different\
    \ sequence.\n\n[Listing 7-11](#c07.xhtml_c07-fea-0011) shows two different ways\
    \ to get pseudo-random values. Note that you must include `cstdlib` and `ctime`.\n\
    \n### [LISTING 7-11](#c07.xhtml_rc07-fea-0011) Pseudo-Random Numbers\n\n```cpp\n\
    #include <iostream>\n#include <cstdlib>\n#include <ctime>\n\nusing namespace std;\n\
    \nint main() {\n  srand(time(0));\n  for (int i = 0; i < 4; i++) {\n    cout <<\
    \ \" \" << rand();\n  }\n  cout << endl;\n  for (int i = 0; i < 4; i++) {\n  \
    \  cout << \" \" << rand()%3;\n  }\n  cout << endl;\n  return 0;\n}\n```\n\nEach\
    \ `for` loop generates and prints four pseudo-random values by calling `rand()`.\
    \ The second `for` loop uses the `%` operator to constrain the values to 0, 1,\
    \ or 2. Example output is as follows:\n\n`1794106847 735890002 744940541 386010577`\
    \ (example only)\n\nThe call to `srand()` makes the output different each time\
    \ you run the program.\n\n### Using polymorphism\n\n`Polymorphism` is an important\
    \ object-oriented programming feature. When a program makes a call on an object's\
    \ member function at run time, polymorphism dynamically determines which function\
    \ to call based on which class instantiated the object.\n\n[Listing 7-12](#c07.xhtml_c07-fea-0012)\
    \ shows a modified version of the program in [Listing 7-10](#c07.xhtml_c07-fea-0010).\
    \ Superclass `Item` and its subclasses `DiscountedItem` and `DonatedItem` are\
    \ unchanged.\n\n### [LISTING 7-12](#c07.xhtml_rc07-fea-0012) Polymorphism\n\n\
    ```cpp\n#include <iostream>\n#include <cstdlib>\n#include <ctime>\n\nusing namespace\
    \ std;\n\nclass Item …;\nclass DiscountedItem: public Item …;\nclass DonatedItem:\
    \ public Item …;\n\nint main() {\n  Item *regular_ptr = new Item;\n  DiscountedItem\
    \ *discounted_ptr = new DiscountedItem(0.25);\n  DonatedItem *donated_ptr = new\
    \ DonatedItem;\n  srand(time(0));\n  for (int i = 0; i < 10; i++) {\n    int r\
    \ = rand()%3;\n    Item *item_ptr;\n    switch (r) {\n      case 0: item_ptr =\
    \ regular_ptr; break;\n      case 1: item_ptr = discounted_ptr; break;\n     \
    \ case 2: item_ptr = donated_ptr; break;\n    }\n    item_ptr->print_cost(2.99,\
    \ 3);\n  }\n  return 0;\n}\n```\n\nDuring each iteration of the `for` loop, the\
    \ value of `r` can be 0, 1, or 2. Depending on the value of `r`, the `Item` pointer\
    \ variable `item_ptr` is set to point to an `Item`, a `DiscountedItem`, or a `DonatedItem`\
    \ object. The pointer variable is able to point to the different objects because\
    \ `DiscountedItem` and `DonatedItem` objects are instantiated from subclasses\
    \ of `Item`.\n\nDuring run time, when the program executes the following statement:\n\
    \n`item_ptr->print_cost(2.99, 3);`\n\nThe program uses polymorphism to determine\
    \ which class's `print_cost()` member function to call based on which object `item_ptr`\
    \ is currently pointing to.\n"
  raw: 'In C++, you can create a hierarchy of classes. When you take one class and
    create a new one under it, such as creating `Toyota` from `Vehicle`, you''re *deriving*
    a new class, which means `Toyota` is a *child* of `Vehicle` in the hierarchy.


    To derive a class from an existing class, you write the new class as you would
    any other class, but you extend the header after the class name with a colon (`:`)
    the word `public`, and then the class you''re deriving from, as in the following
    class header line:


    `class Toyota : public Vehicle {`


    When you do so, the class you create (`Toyota`) *inherits* the member variables
    and member functions from the *parent* class (`Vehicle`). For example, if `Vehicle`
    has a public member variable called `NumberOfWheels` and a public member function
    called `Drive()`, the class `Toyota` has these members, although you didn''t write
    the members in `Toyota`.


    The `VehicleClass` example, shown in [Listing 7-9](#c07.xhtml_c07-fea-0009), demonstrates
    class inheritance. It starts with a class called `Vehicle`, and a derived class
    called `Toyota`. You create an instance of `Toyota` in `main()` and call two member
    functions for the instance, `MeAndMyToyota()` and `Drive()`. The definition of
    the `Toyota` class doesn''t show a `Drive()` function. The `Drive()` function
    is inherited from the `Vehicle` class. You can call this function like a member
    of the `Toyota` class because in many ways it *is.*


    [LISTING 7-9](#c07.xhtml_rc07-fea-0009) Deriving One Class from Another


    `#include <iostream>`


    `using namespace std;`


    `class Vehicle {`


    `public:`


    `int NumberOfWheels;`


    `void Drive() {`


    `cout << "Driving, driving, driving…"`


    `<< endl;`


    `}`


    `};`


    `class Toyota : public Vehicle {`


    `public:`


    `void MeAndMyToyota() {`


    `cout << "Just me and my Toyota!" << endl;`


    `}`


    `};`


    `int main() {`


    `Toyota MyCar;`


    `MyCar.MeAndMyToyota();`


    `MyCar.Drive();`


    `return 0;`


    `}`


    When you run this application, you see the output from two functions:


    `Just me and my Toyota!`


    `Driving, driving, driving…`


    ### Overriding member functions


    The *signature* of a function includes its function name and the number, datatypes,
    and order of its parameters. (The names of the parameters are not part of the
    signature.) A subclass can *override* a superclass''s member function by defining
    a member function with the same signature. This allows the subclass to supersede
    a behavior of its superclass.


    In [Listing 7-10](#c07.xhtml_c07-fea-0010), class `Item` defines a `print_cost()`
    member function that prints a regular item''s `price` times the `quantity`. You
    must specify the function to be `virtual` to allow the class''s subclasses to
    override it. When a class has virtual functions, it must also have virtual destructor,
    even if it only has an empty block:


    `virtual ~Item() {}`


    Subclass `DiscountedItem` has a private `discount`. Its `print_cost()` member
    function has the same signature, so it overrides `Item`''s function. Its behavior
    is different because its cost calculation includes a discount. Note the `override`
    specified in the function header — it must also have a virtual destructor.


    Similarly, subclass `DonatedItem`''s `print_cost()` member function overrides
    `Item`''s member function. It simply prints a 0 cost.


    [LISTING 7-10](#c07.xhtml_rc07-fea-0010) Overriding Functions


    `#include <iostream>`


    `#include <string>`


    `using namespace` `std``;`


    `class Item`


    `{`


    `public:`


    `virtual ~Item() {}`


    `virtual void print_cost(double price,`


    `int quantity)`


    `{`


    `cout` `<< "Regular cost = "`


    `<< price*quantity <<` `endl``;`


    `}`


    `};`


    `class DiscountedItem: public Item`


    `{`


    `public:`


    `DiscountedItem(double d)`


    `: discount(d) {}`


    `virtual ~DiscountedItem() {}`


    `void print_cost(double price,`


    `int quantity) override`


    `{`


    `cout` `<< "Discounted cost = "`


    `<< price*quantity*(1 - discount)`


    `<<` `endl``;`


    `}`


    `private:`


    `double discount;`


    `};`


    `class DonatedItem: public Item`


    `{`


    `public:`


    `virtual ~DonatedItem() {}`


    `void print_cost(double price,`


    `int quantity) override`


    `{`


    `cout` `<< "Donated cost = " << 0 <<` `endl``;`


    `}`


    `};`


    `int main()`


    `{`


    `Item regular_item;`


    `DiscountedItem discounted_item(0.25);`


    `DonatedItem donated_item;`


    `regular_item.print_cost(2.99, 3);`


    `discounted_item.print_cost(2.99, 3);`


    `donated_item.print_cost(2.99, 3);`


    `return 0;`


    `}`


    Output from the progam is


    `Regular cost = 8.97`


    `Discounted cost = 6.7275`


    `Donated cost = 0`


    ### Generating random numbers


    The C++ `rand()` function uses an algorithm to generate *pseudo-random* positive
    integer values. A program that calls `rand()` would get the same sequence of pseudo-random
    values each time it''s run. However, you can call function `srand()` to set a
    different seed value for the algorithm to get a different sequence. A common seed
    value is the result of calling the function `time(0)`, which returns the current
    time in seconds. Then each time you run the program, the seed value is different,
    so you''ll get a different sequence.


    [Listing 7-11](#c07.xhtml_c07-fea-0011) shows two different ways to get pseudo-random
    values. Note that you must include `cstdlib` and `ctime`.


    [LISTING 7-11](#c07.xhtml_rc07-fea-0011) Pseudo-Random Numbers


    `#include <iostream>`


    `#include <cstdlib>`


    `#include <ctime>`


    `using namespace std;`


    `int main()`


    `{`


    `srand(time(0));`


    `for (int i = 0; i < 4; i++)`


    `{`


    `cout << " " << rand();`


    `}`


    `cout << endl;`


    `for (int i = 0; i < 4; i++)`


    `{`


    `cout << " " << rand()%3;`


    `}`


    `cout << endl;`


    `return 0;`


    `}`


    Each `for` loop generates and prints four pseudo-random values by calling `rand()`.
    The second `for` loop uses the `%` operator to constrain the values to 0, 1, or
    2\. Example output is as follows:


    `1794106847 735890002 744940541 386010577`


    `1 0 2 0`


    The call to `srand()` makes the output different each time you run the program.


    ### Using polymorphism


    *Polymorphism* is an important object-oriented programming feature. When a program
    makes a call on an object''s member function at run time, polymorphism dynamically
    determines which function to call based on which class instantiated the object.


    [Listing 7-12](#c07.xhtml_c07-fea-0012) shows a modified version of the program
    in [Listing 7-10](#c07.xhtml_c07-fea-0010). Superclass `Item` and its subclasses
    `DiscountedItem` and `DonatedItem` are unchanged.


    [LISTING 7-12](#c07.xhtml_rc07-fea-0012) Polymorphism


    `#include <iostream>`


    `#include <cstdlib>`


    `#include <ctime>`


    `using namespace` `std``;`


    `class Item …`


    `class DiscountedItem: public Item …`


    `class DonatedItem: public Item …`


    `int main()`


    `{`


    `Item *regular_ptr = new Item;`


    `DiscountedItem *discounted_ptr =`


    `new DiscountedItem(0.25);`


    `DonatedItem *donated_ptr = new DonatedItem;`


    `srand``(``time``(0));`


    `for (int i = 0; i < 10; i++)`


    `{`


    `int r =` `rand``()%3;`


    `cout` `<< r << " ";`


    `Item *item_ptr;`


    `switch (r)`


    `{`


    `case 0: item_ptr = regular_ptr;`


    `break;`


    `case 1: item_ptr = discounted_ptr;`


    `break;`


    `case 2: item_ptr = donated_ptr;`


    `break;`


    `}`


    `item_ptr->print_cost(2.99, 3);`


    `}`


    `return 0;`


    `}`


    During each iteration of the `for` loop, the value of variable `r` can be 0, 1,
    or 2\. Depending on the value of `r`, the `Item` pointer variable `item_ptr` is
    set to point to an `Item`, a `DiscountedItem`, or a `DonatedItem` object. The
    pointer variable is able to point to the different objects because `DiscountedItem`
    and `DonatedItem` objects are instantiated from subclasses of `Item`.


    During run time, when the program executes the following statement:


    `item_ptr->print_cost(2.99, 3);`


    The program uses polymorphism to determine which class''s `print_cost()` member
    function to call based on which object `item_ptr` is currently pointing to.


    Example output from the program, which will be different during each run, is as
    follows:


    `0 Regular cost = 8.97`


    `2 Donated cost = 0`


    `0 Regular cost = 8.97`


    `2 Donated cost = 0`


    `1 Discounted cost = 6.7275`'
