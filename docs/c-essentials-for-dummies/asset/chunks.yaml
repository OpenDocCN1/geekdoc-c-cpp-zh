- fmt: "\n```cpp\n#include <fstream>\n#include <string>\n\nusing namespace std;\n\n\
    int id;\nstring last, first;\nifstream students_ins;\nstudents_ins.open(\"students.txt\"\
    );\nstudents_ins >> id >> last >> first;\nstudents_ins.close();\n```\n\nThe following\
    \ statements create the output file stream `prices_outs`, which it opens to write\
    \ to the text file `prices.txt`:\n\n```cpp\n#include <iostream>\n#include <fstream>\n\
    #include <string>\nusing namespace std;\n…\nofstream prices_outs;\nprices_outs.open(\"\
    prices.txt\");\n…\nprices_outs << cereal_name << cereal_price\n<< endl;\n…\nprices_outs.close();\n\
    ```\n\n## Exception Handling\n\nAn `exception` represents a runtime error that\
    \ your program can throw when the error occurs. If your program throws an exception,\
    \ it must be caught, otherwise the program `aborts` (abruptly terminates). You\
    \ write exception handlers with `try catch` statements to catch particular exceptions.\n\
    \nThe file `nonexistent.txt` doesn't exist, so the following example program throws\
    \ an exception when it tries to open the file. The program then catches and handles\
    \ the exception.\n\n```cpp\n#include <iostream>\n#include <fstream>\n#include\
    \ <string>\n\nusing namespace std;\n\nint main()\n{\n    string filename = \"\
    nonexistent.txt\";\n    ifstream ins;\n    try\n    {\n        ins.open(filename);\n\
    \        if (!ins.is_open())\n        {\n            throw \"Failed to open \"\
    \ + filename;\n        }\n        cout << \"Successfully opened \"\n        +\
    \ filename << endl;\n        ins.close();\n    }\n    catch (string msg)\n   \
    \ {\n        cout << \"FILE ERROR: \" << msg << endl;\n    }\n    return 0;\n\
    }\n```\n\nThe output is\n`-. is`\n\nThe code is easier to read if it isn’t cluttered\
    \ with error handlers. So, you can with the error handling statements in `catch`\
    \ blocks.\n\nWhen a program throws an exception, it immediately jumps to the `catch`\
    \ block. Therefore, in the preceding example, the `Successfully opened` message\
    \ is not printed.\n\nIf the program doesn't catch an exception after it was thrown,\
    \ it will abort with an error message about an uncaught exception.\n\n![Remember](images/remember.png)\
    \ An important feature when throwing an exception in a function is that if the\
    \ exception isn’t caught in that function, the exception propagates up the call\
    \ chain until a function on the chain, or the main program itself, catches it.\
    \ If the exception is never caught, the program aborts.\n\n## Operator Overloading\n\
    \nC++ allows you to `overload` an operator by giving it an additional capability.\
    \ For example, you can overload the `+` operator to define what it means to add\
    \ two objects of a certain class, and you can overload the `<<` operator to define\
    \ how to print such an object.\n\nThe following example demonstrates overloading\
    \ the `*` operator to multiply two fractions and overloading the `<<` operator\
    \ to print a fraction:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    class Fraction\n{\npublic:\n    Fraction(int n, int d)\n    : numerator(n), denominator(d)\
    \ {}\n    int numerator, denominator;\n};\n\nFraction operator *(Fraction& f1,\
    \ Fraction& f2)\n{\n    int n = f1.numerator*f2.numerator;\n    int d = f1.denominator*f2.denominator;\n\
    \    return Fraction(n, d);\n}\n\nostream& operator <<(ostream& outs,\nconst Fraction&\
    \ f)\n{\n    float decimal = ((float) f.numerator)\n    / ((float) f.denominator);\n\
    \    outs << f.numerator << \"/\" << f.denominator\n    << \" = \" << decimal;\n\
