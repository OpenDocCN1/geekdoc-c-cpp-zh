    you need to decide what to name your new type. For example, you can choose `CrayonColor`
    or `CrayonColors`. It''s best to make the term singular, as in `CrayonColor`,
    because you use only one color at a time. When you declare a variable, it makes
    more sense: `CrayonColor fill_color;` would mean that `fill_color` is a *color*
    — not a group of *colors.*


    ## Reading from the Console


    Throughout this chapter and the preceding chapter, you see many examples of how
    to write information to the console. Writing to the console involves the use of
    `cout`, like this:


    `cout << "hi there" << endl;`


    Reading from the console (that is, getting a response from the user of your application,
    who is typing on the keyboard) uses the `cin` object (pronounced “see-in”). Next,
    instead of using the `<<` operator, you use the `>>` operator.


    The `<<` operator is often called an *insertion operator* because you''re writing
    to (or *inserting into*) a *stream,* which is nothing more than a bunch of characters
    going out somewhere. In the case of `cout`, those characters are going out to
    the console. The `>>` operator, on the other hand, is often called the *extraction
    operator.* The idea here is that you''re extracting stuff from the stream. In
    the case of `cin`, you’re extracting letters from the stream that the user is,
    in a sense, sending from the console into your application.


    The `ReadString` example, shown here, demonstrates how you can read a string from
    the console:


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `string name;`


    `cout << "Type your name: ";`


    `cin >> name;`


    `cout << "Your name is " << name << endl;`


    `return 0;`


    `}`


    When you run this code, you see the console ask you to type your name, and then
    it stops. That''s because it’s waiting for your input. Notice that the insertion
    point appears immediately after the text `"Type your name:"`. That’s because the
    first `cout` statement lacks the usual `endl`. It''s normal to leave the insertion
    point, or cursor, on the same line as the question to avoid confusing the user.
    Type a name, such as `Fred`, without spaces and press Enter. The console then
    looks like this:


    `Type your name: Fred`


    `Your name is Fred`


    The first line includes the name you typed, and the second line is whatever appears
    after you press Enter. Notice what happens: When you type a word and press Enter,
    the computer places that word in the `name` variable, which is a string. Then
    you can print `name` to the console by using `cout`.


    You can also read integers, as in the following code (in the `ReadInt` example):


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `int x;`


    `cout << "Type your favorite number: ";`


    `cin >> x;`


    `cout << "Your favorite number is " << x`


    `<< endl;`


    `return 0;`


    `}`


    This sample code reads a single integer into the variable `x` and then prints
    its value to the console.


    ![Remember](images/remember.png) By default, `cin` reads words or numbers from
    the console separated by spaces. If you put spaces in your entry, only the first
    word gets read. `cin` reads the second word the next time the application encounters
    a `cin >>`.


