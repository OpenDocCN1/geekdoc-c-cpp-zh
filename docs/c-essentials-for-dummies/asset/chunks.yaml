    \ `phrase` 的指针变量中。代码输出了短语，对其进行了处理，然后再次写入。最后，代码释放了 `phrase` 使用的内存。\n\n![Tip](img/tip.png)\
    \ 虽然人们通常说你是在*删除指针*或*释放指针*，但你实际上是在释放指针所指向的*内存*。该指针仍然可以用于后续的新操作。\n\n![Warning](img/warning.png)\
    \ 当你释放内存时，该内存对其他任务可用。然而，在调用 `delete` 之后，指针仍然指向那个特定的内存位置，即使该内存已空闲。在不将指针指向其他地方的情况下使用指针会导致错误。因此，在释放指针所指向的内存后，不要尝试使用该指针，直到你通过调用\
    \ `new` 或将其设置为另一个变量来让指针指向其他地方。\n\n每当你释放一个指针时，一个习惯是将指针设置为 `nullptr`。然后，每当你使用指针时，首先检查它是否等于\
    \ `nullptr`，并且仅在它不是 `nullptr` 时才使用它。\n\n下面的代码示例了如何使用这种策略。首先，这段代码释放了指针；然后通过将其设置为\
    \ 0 来清空指针：\n\n```cpp\ndelete ptrToSomething;\nptrToSomething = nullptr;\n```\n\
    \n这段代码在使用指针之前检查它是否不为 `nullptr`：\n\n```cpp\nptrToComp = new int;\n*ptrToComp =\
    \ 10;\nif (ptrToComp != nullptr) {\n    cout << *ptrToComp << endl;\n}\n```\n\n\
    ![Warning](img/warning.png) 仅对你通过 `new` 分配的内存调用 `delete`。你只能释放堆上的内存，而不能释放栈上的局部变量。此外，你应该避免多次释放同一个指针，因为这样做会导致难以发现的错误；应用程序可能已经为了其他目的重新分配了该内存。\n\
    \n![Warning](img/warning.png) 释放指针的旧方法涉及将指针设置为 `NULL`。你可能有很多使用 `NULL` 的旧代码。在这种情况下，你必须在代码中添加\
    \ `#include <cstddef>` 以允许其编译。然而，更新代码使用 `nullptr` 会更好。\n\n![Warning](img/warning.png)\
    \ 关于复制指针需要记住的重要点是，复制指针只复制指针地址，而不是底层的引用。所以，如果你复制一个指向数组的指针，仍然只有一个数组，但现在有两个对该数组的引用。要创建一个数组的副本，你需要创建一个相同大小的数组，并逐索引将数据从第一个数组拷贝到第二个数组。\n\
    \n## 将指针变量传递给函数\n\n指针最重要的用途之一：如果指针指向一个变量，你可以将指针传递给函数，函数可以修改原始变量。此功能允许你编写能够实际修改传递给它们的变量的函数。尽管本节讨论的是原始指针，相同的技术也适用于智能指针。\n\
    \n通常，当你调用函数并向其传递几个变量时，计算机只是从变量中提取值并传递这些值。仔细查看列表 6-10 所示的 `VariablePointer` 示例。\n\
    \n列表 6-10 函数无法更改传递给它的原始变量\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nvoid ChangesAreGood(int myparam) {\n    myparam += 10;\n    cout << \"Inside\
    \ the function:\" << endl;\n    cout << myparam << endl;\n}\n\nint main() {\n\
    \    int mynumber = 30;\n    cout << \"Before the function:\" << endl;\n    cout\
    \ << mynumber << endl;\n    ChangesAreGood(mynumber);\n    cout << \"After the\
