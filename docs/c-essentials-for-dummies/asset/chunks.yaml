    \ I am a pen\");\nWorstPen.write_on_paper(\"Hello I am another pen\");\n```\n\n\
    这两行中的第一行为 `FavoritePen` 对象调用 `write_on_paper()`；因此，在 `write_on_paper()` 的代码内部，`InkLevelPercent`\
    \ 指的是 `FavoritePen` 对象的 `InkLevelPercent`。但 `WorstPen` 有它自己的 `InkLevelPercent`\
    \ 属性，与 `FavoritePen` 是独立的。所以在这两行中的第二行中，`write_on_paper()` 访问的是位于 `WorstPen` 内部\
    \ `InkLevelPercent`。换句话说，每个对象都有自己的 `InkLevelPercent`。当你调用 `write_on_paper()` 时，成员函数会根据你调用它的哪个对象来修改成员变量。第一行使用\
    \ `FavoritePen` 调用。第二行使用 `WorstPen` 调用。\n\n我们已经类中的所有成员函数实现在单独的源文件（`.cpp`）中。头文件现在只列出原型，并且更易读。源文件在顶部包含了头文件。这是必要的；否则编译器将不知道\
    \ `Pen` 是一个类名。\n\n列表 7-3 使用类的源文件 main.cpp\n\n```cpp\n#include <iostream>\n#include\
    \ \"Pen.h\"\nusing namespace std;\n\nint main() {\n    Pen FavoritePen;\n    Pen\
    \ WorstPen;\n\n    FavoritePen.write_on_paper(\"Hello I am a pen\");\n    WorstPen.write_on_paper(\"\
    Hello I am another pen\");\n\n    FavoritePen.break_in_half();\n    WorstPen.break_in_half();\n\
    \n    return 0;\n}\n```\n\n"
- fmt: "\n- **Behavior:** A `behavior` of a class is a task that an instance of the\
    \ class can perform. You define each behavior with a member function. When you\
    \ call a member function for a particular instance, the member function accesses\
    \ the member variables for the instance.\n\nWhen you divide the class, you put\
    \ part in the header file and part in the source code file. The following list\
    \ describes what goes where:\n\n- **Header file:** Put the class definition in\
    \ the header file. Member variables appear as part of the class definition within\
    \ the header. You can include the code for a member function inside the class\
    \ definition if it’s a short function, but most people prefer to have only prototypes\
    \ of the member functions. You may want to name the header file the same as the\
    \ class but with an `.h` or `.hpp` extension.\n\n- **Source file:** If your class\
    \ definition contained member function prototypes you need to put the function\
    \ code in a source file. When you do, precede the function name with the class\
    \ name and the scope resolution operator (`::`). If you named the header file\
    \ the same as the class, you probably want to name the source file the same as\
    \ the class as well but with a `.cpp` extension.\n\n## Working with a Class\n\n\
    In this section, you explore several clever ways of working with classes, starting\
    \ with the way you can hide certain parts of your class from other functions that\
    \ are accessing them.\n\n### Accessing members\n\nWhen you work with an object\
    \ in real life, there are often parts of the object that you interact with and\
    \ other parts that you don't. For example, when you use the computer, you type\
    \ on the keyboard but don’t open the box and poke around with a wire attached\
    \ to a battery. For the most part, the stuff inside is off-limits except when\
    \ you’re upgrading it.\n\nIn object terminology, the words `public` and `private`\
    \ refer to members of a class. When you design a class, you may want to make some\
    \ member variables and functions freely accessible by class users. You may want\
    \ to keep other members tucked away. A `class user` is the part of an application\
    \ that creates an instance of a class and calls one of its member functions.\n\
    \nWhen designing a class, you may want only specific users calling certain member\
    \ functions. You may want to keep other member functions hidden away, to be called\
    \ only by other member functions within the class.\n\n![Remember](images/remember.png)\
    \ You bar users from calling member functions by making them `private`. Member\
    \ functions that you want to allow access to you make `public`. After you design\
    \ a class, if you write a function that instantiates an object of that class and\
    \ try to call one of an object’s private member functions, you get a compiler\
    \ error when you try to compile it.\n\nThe `OvenClass` example, shown in [Listing\
    \ 7-4](#c07.xhtml_c07-fea-0004), defines a sample `Oven` class and a `main()`\
    \ that uses it. Look at the class definition. It has two sections: one private\
    \ and the other public. The code for the member functions appears after the class\
    \ definition. The two private member functions don't do much other than print\
    \ a message, although they’re also free to call other private functions in the\
    \ class. The public member function, `Bake()` is allowed to call each of the private\
    \ functions.\n\n[LISTING 7-4](#c07.xhtml_rc07-fea-0004) Using the Public and Private\
    \ Words to Hide Parts of Your Class\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nclass Oven {\nprivate:\n    void TurnOnHeatingElement();\n    void TurnOffHeatingElement();\n\
    public:\n    void Bake(int Temperature);\n};\n\nvoid Oven::TurnOnHeatingElement()\
    \ {\n    cout << \"Heating element is now ON!\n    Be careful!\" << endl;\n}\n\
    \nvoid Oven::TurnOffHeatingElement() {\n    cout << \"Heating element is now off.\
    \ Relax!\" << endl;\n}\n\nvoid Oven::Bake(int Temperature) {\n    TurnOnHeatingElement();\n\
    \    cout << \"Baking!\" << endl;\n    TurnOffHeatingElement();\n}\n\nint main()\
    \ {\n    Oven fred;\n    fred.Bake(875);\n    return 0;\n}\n```\n\nWhen you run\
    \ this application, you see some messages:\n\n`Heating element is now ON! Be careful!`\n\
    `Baking!`\n`Heating element is now off. Relax!`\n\nIf you included the following\
    \ line in your `main()` that tries to call a private member function:\n\n`fred.TurnOnHeatingElement();`\n\
    \nYou would get an error message telling you that you can't do it because the\
    \ function is private.\n\n![Tip](images/tip.png) When you design your classes,\
    \ consider making all its members private by default, and then only make those\
    \ public that you want users to access. This approach allows you to “hide” members\
    \ that other applications don’t need to access.\n\n### Using classes and pointers\n\
    \nAs with any variable, you can have a pointer variable that points to an object.\
    \ As usual, the pointer variable’s type must match the type of the class. This\
    \ creates a pointer variable that points to a `Pen` instance:\n\n`Pen *MyPen;`\n\
    \nThe variable `MyPen` is a pointer, and it can point to an object of type `Pen`.\
    \ The variable's own type is pointer to `Pen`, or in C++ notation, `Pen *`.\n\n\
    ![Remember](images/remember.png) A line of code like `Pen *MyPen;` creates a variable\
    \ that serves as a pointer to an object. To create an instance, you have to call\
    \ `new`.\n\nAfter you create the variable `MyPen`, you can create an instance\
    \ of class `Pen` and point `MyPen` to it using the `new` keyword, like so:\n\n\
    `MyPen = new Pen;`\n\nOr you can combine both `Pen *MyPen;` and the preceding\
    \ line:\n\n`Pen *MyPen = new Pen;`\n\nNow you have the object in the heap. (See\
    \ [Chapter 6](#c06.xhtml) for more information on pointers and heaps.) You also\
    \ have the pointer variable, which points to the object. Because the object is\
    \ in the heap, the only way to access it is through the pointer. To access the\
    \ members through the pointer, you use the arrow operator:\n\n`MyPen->InkColor\
    \ = red;`\n\nThis goes through the `MyPen` pointer to set the `InkColor` property\
    \ of the object to `red`. The arrow operator is shorthand for the following:\n\
    \n`(*MyPen).InkColor = red;`\n\nMost programmers prefer to use the arrow operator.\n\
    \nAs with other values you created with `new`, after you're finished using an\
    \ object, you should call `delete` to free the memory used by the object pointed\
    \ to. To do so, start with the word `delete` and then the name of the pointer,\
    \ `MyPen`, as in the following:\n\n`delete MyPen;`\n\n![Remember](images/remember.png)\
    \ Store `nullptr` in the pointer after you delete the object. If you don’t store\
    \ `nullptr` in the pointer, it still points to where the object *used to be.*\n\
    \nThe `PenClass3` example, shown in [Listing 7-5](#c07.xhtml_c07-fea-0004), demonstrates\
    \ the process of declaring a pointer, creating an object and pointing to it, accessing\
    \ the object's members through the pointer, deleting the object, and clearing\
    \ the pointer back to `0`.\n\n[LISTING 7-5](#c07.xhtml_rc07-fea-0005) Managing\
    \ an Object's Life\n\n```cpp\n#include <iostream>\n#include \"../PenClass2/Pen.h\"\
    \n\nusing namespace std;\n\nint main() {\n    Pen *MyPen;\n    MyPen = new Pen;\n\
    \    MyPen->InkColor = red;\n    cout << MyPen->InkColor << endl;\n    delete\
    \ MyPen;\n    MyPen = nullptr;\n    return 0;\n}\n```\n\nThe following steps describe\
    \ precisely how to work with pointers and objects:\n\n1. **Declare the pointer.**\n\
    \   The pointer must match the type of object you intend to work with, except\
    \ that the pointer’s type name in C++ is followed by an asterisk (`*`).\n\n2.\
    \ **Call `new`, passing the class name, and store the results of `new` in the\
    \ pointer.**\n   You can combine Steps 1 and 2 into a single step.\n\n3. **Access\
    \ the object's members through the pointer with the arrow operator (`->`).** \n\
    \n4. **When you’re finished with the object, call `delete`.**\n   This step frees\
    \ the object from the heap. Remember that this doesn't delete the pointer itself\
    \ — it just frees the object memory.*\n"
