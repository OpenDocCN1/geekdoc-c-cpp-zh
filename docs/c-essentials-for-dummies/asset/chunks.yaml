    你无法预测应用程序中某些内存用法，但在编写代码时并不知道需求。例如，从互联网流数据或在数据库中创建新记录都是不可预测内存使用的示例。在处理不可预测的内存需求时，根据需要*分配*（请求内存）和*释放*（释放你请求的内存），这个过程被称为*动态内存管理*。你使用*堆*（未分配内存区域）来执行动态内存管理。


    ### 使用 new


    要使用现有方法在堆上声明值，首先你需要设置一个帮助跟踪存储桶的变量。该变量必须是一个指针变量。


    要在堆上分配内存，你需要做两件事：首先，声明一个指针变量。其次，通过指定你想创建的值的类型来使用`new`运算符。例如，下一行创建了一个新的整数值：


    ```

    int *somewhere = new int;

    ```


    当计算机在堆上创建了新的整数值后，它会将该整数值的地址存储在 `somewhere` 中。这是合理的：`somewhere` 是一个指向整数的指针，所以它前面带有
    `*`（指针）运算符。因此，`somewhere` 持有一个整数值的地址。列表 6-7 中显示的 `UseNew`示例演示了在使用`new` 时指针是如何工作的。


    LISTING 6-7 使用 new 分配内存


    ```cpp

    #include <iostream>

    using namespace std;


    int main() {

    int *ptr = new int;

    *ptr = 10;

    cout << *ptr << endl;

    cout << ptr << endl;

    return 0;

    }

    ```


    当你运行此应用程序时，你会看到此输出（第二个值会在每次运行示例时发生变化）：


    ```

