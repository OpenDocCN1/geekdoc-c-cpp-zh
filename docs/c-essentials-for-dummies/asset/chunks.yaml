  trans: "\n\n`string` 简单来说就是一组连接在一起的字符。编译器根据代码中双引号的位置来确定字符串的开始和结束。\n\n你可以创建一个可以存储字符串的变量。你使用的类型是\
    \ `string`。这里显示的 `CreateString` 示例演示了如何使用 `string` 变量。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n  string mystring;\n  mystring = \"Hello\
    \ there\";\n  cout << mystring << endl;\n  return 0;\n}\n```\n\n当运行此此程序时，控制台上会显示字符串\
    \ `Hello there`。`main()` 内部的第一行创建了一个名为 `mystring` 的字符串变量。第二行将其初始化为 `\"Hello there\"\
    `。第三行将字符串打印到控制台。\n\n## 获取字符串的局部\n\n访问字符串中的单个字符非常简单。看看下面的 `IndividualCharacter`\
    \ 示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\
    \  string mystring;\n  mystring = \"abcdef\";\n  cout << mystring[2] << endl;\n\
    \  return 0;\n}\n```\n\n注意第九行，即 `cout` 行，单词 `mystring` 后面跟着一个方括号内的 `2` (`[2]`)。当你运行此程序时，你会看到：\n\
    \n`c`\n\n就这样，只有一个字母 `c`。括号内的 `2` 意味着你想访问字符串的第三个字符，且仅访问该字符。\n\n![Remember](img/remember.png)\
    \ C++ 字符串内部位置的计数从 0 开始。因此对于这个字符串，`mystring[0]` 是第一个字符，恰好是 `a`。因此，`mystring[2]`\
    \ 获取的是第三个字符。通常情况下，本书使用“第四位置”来表示第四个位置，你通过 `mystring[3]` 访问它。（括号内的数字被称为索引。）\n\n\
    字符串是由字符组成的。因此，字符串中的单个字符的类型是 `char`。这意味着你可以执行类似下面的操作（如 `IndividualCharacter2` 示例所示）：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n  string\
    \ mystring;\n  mystring = \"abcdef\";\n  char mychar = mystring[2];\n  cout <<\
    \ mychar << endl;\n}\n```\n\n在这个示例中，`mychar` 是一个 `char` 类型的变量。`mystring[2]` 表达式的值为\
    \ `char` 类型。因此，该赋值是有效的。当你运行它时，再次看到第三位置上的单个字符：\n\n`c`\n\n## 修改字符串的一部分\n\n使用方括号法你也可以修改字符串内部的字符。例如，下面的代码将字符串中的第二个字符（即索引为\
    \ `1` 的字符）从 `b` 改为 `q`：\n\n```cpp\nstring x = \"abcdef\";\nx[1] = 'q';\ncout <<\
    \ x << endl;\n```\n\n这段代码将字符串 `aqcdef` 写入控制台。\n\n## 给字符串添加内容\n\n你可以轻松地向字符串变量添加内容。以下代码使用了\
    \ `+=` 运算符，该运算符在相加数字时也被使用：\n\n```cpp\nstring mystring;\nmystring = \"Hi \";\n\
    mystring += \"there\";\ncout << mystring << endl;\n```\n\n第一行声明了字符串 `mystring`。第二行将其初始化为\
    \ `\"Hi \"`。第三行使用 `+=` 运算符向字符串追加内容——在这种情况下是 `\"there\"`。所以，在这一行运行后，名为 `mystring`\
    \ 的字符串包含了字符串 `\"Hi there\"`，当 `cout` 运行运行时，控制台上就会显示该内容。程序员向字符串添加内容的术语称为拼接（concatenation）。\n\
    \n你也可以对字符进行类似的操作。下面的代码段向字符串添加了一个单个字符：\n\n```cpp\nstring mystring;\nmystring =\
    \ \"abcdef\";\nmystring += 'g';\ncout << mystring << endl;\n```\n\n这段代码创建了一个字符串为\
    \ `\"abcdef\"`，然后在末尾添加一个字符 `'g'` 以得到 `\"abcdefg\"`。然后它将完整的 `\"abcdefg\"` 写入控制台。\n\
    \n## 合并两个字符串\n\n你可以使用加号 (`+`) 将两个字符串相加，就像处理整数时一样。最终结果是一个新字符串，它将两个字符串的值并排拼接在一起。例如，下面的代码将\
    \ `first` 加到 `second` 得到名为 `third` 的新字符串：\n\n```cpp\nstring first = \"hello \"\
    ;\nstring second = \"there\";\nstring third = first + second;\ncout << third <<\
