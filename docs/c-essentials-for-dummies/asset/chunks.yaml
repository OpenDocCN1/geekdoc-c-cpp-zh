  trans: "\n\n本章将考虑在应用程序中评估条件的不同方法，并根据这些条件运行不同的代码段。它将帮助你理解如何使用称为 `if statements` 的\
    \ C++ 命令，这些命令类似于现实生活中的“假设”情况。你还将看到如何使用其他 C++ 语句（如 `do-while`）来执行 `loops`（重复执行某些应用程序部分）。但在之前，我们先从注释开始。\n\
    \n## 在代码中添加注释\n\n`comment` 只是代码中会被编译器忽略的文字，你包含它们是为了方便阅读代码的人。注释对于良好的编码至关重要。在 C++\
    \ 中，你通过以双斜杠开头来表示注释，例如：\n\n```cpp\n// 初始化 total 为涉及的\n// 项目数量。\ntotal = 10;\n//\
    \ 现在又增加了 3 个项目。\ntotal += 3;\n```\n\n现在，任何工作该项目的人都能理解代码的作用。请注意两组代码之间的空行。使用空行可以帮助查看代码的人看出一个思路结束而另一个思路开始的地方。编译器会忽略注释和空行；它们是为了阅读代码的程序员服务的。你可以编写任何想要的内容作为注释，编译器会假装这些注释根本不存在。\n\
    \n![Tip](img/tip.png) 注释以 `//` 开始，可以从该行的任何位置开始。你甚至可以将注释放在包含 C++ 代码的行末尾，而不是另起一行。在代码行上使用注释让你可以将注释集中在某一行，如下所示：\n\
    \n```cpp\nint subtotal = 10; // 初始化 subtotal 为 10。\n```\n\n此注释对该行的作用提供了稍更多的解释。当你想要告诉其他变量存储了什么类型的信息或解释复杂的任务时，通常会使用这种行注释。通常情况下，你会像在本节早些时候解释代码块。\n\
    \n![Tip](img/tip.png) 你在 C++ 中可以使用两种注释。一种是双斜杠（//`）。另一种注释以斜杠-星号 `/*` 开头，并星号-斜杠\
    \ `*/` 结束。注释位于这些分隔符之间，可以跨越多行，如下例所示：\n\n```cpp\n/* 此应用程序将明治的部分\n分成各个独立的部分。这个\n\
    过程通常被称为“部件拆分”。\n(c) 2020 Sandwich Parts Separators, Inc.\n*/\n```\n\n这都是同一条注释，并且跨越了多行。你通常使用这种注释来提供任务的概述或描述函数的用途。这种注释也适用于某些大型公司应用程序所需的说明性标题。与其他注释一样，你可以将它们放在代码的任何地方，只要你不会通过在中间插入注释将字符串或单词断开即可。\n\
    \n![Warning](img/warning.png) 一些初学者会误认为当应用程序运行时，注释会出现在应用程序窗口中。事实并非如此。注释不会向控制台写入任何内容。要向控制台写入内容，请使用\
    \ `cout`（参见第 2 章）。\n\n## 在 C++ 中评估条件\n\n计算机做的多数决策都是基于比较两个数字或两个字符来评估条件。对于数值比较，你可以将变量与数字进行比较，如下所示：\n\
    \n```cpp\nx > 10\n```\n\n此比较评估变量 `x` 是否持有大于数字 `10` 的值。如果 `x` 确实大于 `10`，计算机将此条件视为\
    \ `true`。如果 `x` 不大于 `10`，计算机将该条件视为不真（`false`）。\n\n![Tip](img/tip.png) 开发者经常在使用条件时使用\
    \ `satisfied` 一词。对于条件 `x > 10`，如果 `x` 大于 `10`，开发者说该条件被满足（satisfied）。\n\n对于字符比较，你可以比较两个字符是否相等，如下所示：\n\
    \n```cpp\nmychar == 'A'\n```\n\n此比较评估 `mychar` 是否包含字母 `A`。注意你使用了两个等号，而不是一个。使用单个等号将把值\
    \ `A` 赋值给 `mychar`。\n\n要测试字符是否不等于某个值，你使用看起来有些晦涩的 `!=` 运算符。将 `!` 认为意味着 *not*（不），例如：\n\
    \n```cpp\nmychar != 'X'\n```\n\n### 寻找正确的 C++ 关系运算符\n\n上一节中的每个语句都使用 `relational\
    \ operator` 来指定数字或字符串之间进行的比较。表 3-1 向你展示了 C++ 中可用的关系运算符类型以及它们帮助你在应用程序中进行的比较。\n\n\
    | **运算符** | **含义** |\n| --- | --- |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` | 大于\
    \ |\n| `>=` | 大于等于 |\n| `==` | 等于 |\n| `!=` | 不等于 |\n\n表 3-1 评估数值条件\n\n以下列表提供了运算符运行的示例：\n\
    \n*   测试相等性的运算符是*两个*等号。它看起来像：\n\n    ```cpp\n    x == 10\n    ```\n\n    当计算机找到此语句时，它会检查\
    \ `x` 是否等于 `10`。\n\n    ![Warning](img/images.png) 如果你在语句中只放一个等号，大多数 C++ 编译器不会给你报错——尽管\
    \ `x = 10` 是一个*assignment*，将变量 `x` 设置为 `10`。在这种情况下，评估的结果始终是相同的。\n\n    ![Remember](img/images.png)\
    \ 要测试所有大于或等于 10 的整数，条件 `x > 9` 仅在你处理整数时有效。数字 9.1 大于 9，但它并不大于或等于 10。所以如果你想要大于等于且你没有处理整数，请使用\
    \ `>=` 运算符。\n\n*   测试不等等的运算符是感叹号后跟一个等号。对于条件 `x != 10`，只有当 `x` 等于 `10` 时，该条件才评估为真。\n\
    \n*   当你测试大于或小于条件时，如果 `x` 的值等于 `10`，条件 `x > 10` 为假。条件 `x > 10` 仅当 `x` 实际上大于（但不等于）`10`\
    \ 时才为真。要同时测试 `x` 等于 `10`，你有两个选择：\n\n    *   如果你处理的是整数，可以测试 `x > 9`。在这种情况下，如果 `x`\
    \ 等于 `10`、`11` 或 `12` 等，则条件为真。\n    *   你可以使用大于等于运算符来判断相等性：`x >= 10`。此条件在 `x`\
    \ 等于 `10`、`11` 等时也为真。\n\n    ![Remember](img/images.png) 要测试所有大于或等于 10 的整数，条件\
    \ `x > 9` 仅在你处理整数时有效。如果你处理的是浮点数（参见第 2 章），语句 `x > 9` 将不会按你想要运行。数字 9.1 大于 9，但它并不大于或等于\
    \ 10。\n\n### 组合多个条件\n\n当你为应用程序决策进行评估时，可能有多个需要评估的条件。你可能有一个包含两个条件的表达式，为了使表达式为真，*一个或两个*条件必须为真。换句话说，只有当*两个*条件都假时，表达式才为假。这样组合条件是一个\
    \ *or*（或）表达式：如果这个是真的，或者那个是真的，或者两者都为真，就会发生某些事情。\n\n"
- fmt: "\nTo evaluate two conditions together in C++, you write them in the same expression\
    \ and separate them with the `or` operator (`||`), which looks like two vertical\
    \ bars, as shown in the following expression:\n\n```\n(i < 10) || (i > 100)\n\
    ```\n\n![Tip](images/tip.png) The optional parentheses help you to see the two\
    \ conditions better. They aren't required by the expression.\n\nIn addition to\
    \ an or condition, you can have an expression containing two conditions, and for\
    \ the expression to be true, `both conditions` must be true. In other words, the\
    \ expression is false if `either` condition is false. Combining conditions like\
    \ this is an `and` expression: Only if both conditions are true, then something\
    \ happens. An `and` expression in C++ uses the `&&` operator, such as:\n\n```\n\
    (i > 10) && (i < 100)\n```\n\nThis expression checks to see whether a number is\
    \ more than 10 `and` and less than 100. The expression is true only if the number\
    \ is in the range 11 through 99.\n\nCombining conditions by using the `&&` and\
    \ `||` operators is a use of `logical operators.`\n\n## Using If Statements and\
    \ Conditions\n\nIn C++, decisions usually take the form of an `if` statement,\
    \ which is code that starts with the `if` keyword followed by a condition, which\
    \ is often a numerical condition wherein two numbers are compared and then two\
    \ blocks of code appear: one that runs if the condition is satisfied and one that\
    \ runs if it is not.\n\nComputers, like humans, evaluate conditions and use the\
    \ results of the evaluations as input for making a decision. To decide on a plan\
    \ of action based on a condition that your application evaluates, you use an `if`\
    \ statement, which looks like this:\n\n```\nif (x > 10)\n{\n  cout << \"Yuppers,\
    \ it's greater than 10!\"\n  << endl;\n}\n```\n\nThis example translates into\
    \ English: If `x` is greater than 10, write the message `\"Yuppers, it's greater\
    \ than 10!\"`.\n\nIn an `if` statement, the part inside the parentheses is called\
    \ either the `test` or the `condition`. You usually apply `condition` to this\
    \ part of the `if` statement and use the word `test` as a verb, as in “I will\
    \ test whether `x` is greater than 10.”\n\n![Remember](images/remember.png) In\
    \ C++, the condition for an `if` statement always goes inside parentheses. If\
    \ you forget the parentheses, you'll get an error message.\n\n### Deciding what\
    \ if and also what else\n\nWhen you write code for a comparison, usually you want\
    \ to tell the computer to do something if the condition is true and to do something\
    \ else if the condition is not true. In the English language, you often see this\
    \ kind of logic with the word `otherwise:` If such-and-such is true, I will do\
    \ this; otherwise, I will do that.\n\nIn C++, you use the `else` keyword for the\
    \ `otherwise` situation. The `IfElse` example demonstrates how to use the `else`\
    \ keyword, as shown in the following code:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main()\n{\n  int i;\n  cout << \"Type any number: \";\n\
    \  cin >> i;\n  if (i > 10)\n  {\n    cout << \"It's greater than 10.\" << endl;\n\
    \  }\n  else\n  {\n    cout << \"It's not greater than 10.\" << endl;\n  }\n \
    \ return 0;\n}\n```\n\nIn this code, you test whether a number is greater than\
    \ 10. If it is, you print one message. If it is not, you print a different message.\
    \ Notice how the two blocks of code are distinct. The first block immediately\
    \ follows the `if` statement; it's the code that runs if the condition is `true`.\
    \ The next block is preceded by the `else` keyword, and this block runs if the\
    \ condition is `false`.\n\n### Going further with the else and if\n\nThe `IfElse2`\
    \ example shown in the following code demonstrates how to combine the `if` and\
    \ `else` keywords to check for multiple alternatives:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n  int i;\n  cout << \"Type any number:\
    \ \";\n  cin >> i;\n  if (i > 10)\n  {\n    cout << \"It's greater than 10.\"\
    \ << endl;\n  }\n  else if (i == 10)\n  {\n    cout << \"It's equal to 10\" <<\
    \ endl;\n  }\n  else\n  {\n    cout << \"It's less than 10.\" << endl;\n  }\n\
    \  return 0;\n}\n```\n\n## Making Decisions Using a Conditional Operator\n\nBesides\
    \ using an `if` statement, a C++ application can make decisions by using a `conditional\
    \ operator.`\n\nThink about this process: If two integer variables are equal,\
    \ set a string variable to the string `\"equal\"`. Otherwise, set it to the string\
    \ `\"not equal\"`. In other words, suppose that you have two `integer` variables,\
    \ called `first` and `second`. `first` has the value `10` in it, and `second`\
    \ has the value `20` in it. You also have a `string` variable called `result`.\
    \ Now, to follow this:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main()\n{\n  int first = 10;\n  int second = 20;\n  string result;\n\n  result\
    \ = (first == second) ? \"equal\" : \"not equal\";\n  cout << result << endl;\n\
    \n  return 0;\n}\n```\n\n## Repeating Actions with Statements That Loop\n\nApplications\
    \ often have loops.\n\n[Table 3-2](#c03.xhtml_c03-0002) shows the types of loops.\
    \ As the chapter progresses, you see examples of using three types.\n\n| Type\
    \ of Loop | Appearance |\n| --- | --- |\n| *for* | `for (x=0; x<10; x++) { }`\
    \ |\n| *while* | `while (x < 10) { }` |\n| *do-while* | `do { } while (x < 10)`\
    \ |\n\n### Choosing Your Loops\n\nYou may want to use these loops in the following\
    \ situations:\n\n*   ***for* loop:** Use a *for* loop when you have a counter\
    \ variable and you want it to loop while the counter variable increases or decreases\
    \ over a range. The *for* loop is a good choice if you know how many times you\
    \ want the loop to execute.\n*   ***while* loop:** Use the *while* loop when you\
    \ have a condition under which you want your loop code to run. It's a good choice\
    \ when you want to perform the test at the beginning of the loop. The test may\
    \ fail immediately, so the loop may not execute even once.\n*   ***do-while* loop:**\
    \ Use the *do-while* loop when you have a condition under which you want your\
    \ loop code to run and you want to ensure that the loop always runs at least once,\
    \ even if the condition isn’t satisfied. It’s a good choice when the code inside\
    \ the loop prepares the variables that the test uses, so the loop must execute\
    \ at least once.\n\n### Looping for\n\nUsing the *for* loop provides precise control\
    \ over how many times the code performs a task. In addition, it’s extremely flexible\
    \ because you also have control over how the counter variable updates.\n\n###\
    \ Performing a simple for loop\n\nTo use a *for* loop, you use the `for` keyword\
    \ and follow it with a set of parentheses that contains information regarding\
    \ the number of times the *for* loop executes.\n"
  raw: 'To evaluate two conditions together in C++, you write them in the same expression
    and separate them with the *or* operator (`||`), which looks like two vertical
    bars, as shown in the following expression:


    `(i < 10) || (i > 100)`


    ![Tip](images/tip.png) The optional parentheses help you to see the two conditions
    better. They aren''t required by the expression.


    In addition to an or condition, you can have an expression containing two conditions,
    and for the expression to be true, *both conditions* must be true. In other words,
    the expression is false if *either* condition is false. Combining conditions like
    this is an *and* expression: Only if both conditions are true, then something
    happens. An *and* expression in C++ uses the `&&` operator, such as:


    `(i > 10) && (i < 100)`


    This expression checks to see whether a number is more than 10 *and* less than
    100\. The expression is true only if the number is in the range 11 through 99.


    Combining conditions by using the `&&` and `||` operators is a use of *logical
    operators.*


    ## Using If Statements and Conditions


    In C++, decisions usually take the form of an *if* statement, which is code that
    starts with the `if` keyword followed by a condition, which is often a numerical
    condition wherein two numbers are compared and then two blocks of code appear:
    one that runs if the condition is satisfied and one that runs if it is not.


    Computers, like humans, evaluate conditions and use the results of the evaluations
    as input for making a decision. To decide on a plan of action based on a condition
    that your application evaluates, you use an *if* statement, which looks like this:


    `if (x > 10)`


    `{`


    `cout << "Yuppers, it''s greater than 10!"`


    `<< endl;`


    `}`


    This example translates into English as: If *x* is greater than 10, write the
    message


    `"Yuppers, it''s greater than 10!"`


    In an *if* statement, the part inside the parentheses is called either the *test*
    or the *condition.* You usually apply *condition* to this part of the `if` statement
    and use the word *test* as a verb, as in “I will test whether *x* is greater than
    10.”


    ![Remember](images/remember.png) In C++, the condition for an *if* statement always
    goes inside parentheses. If you forget the parentheses, you''ll get an error message.


    ### Deciding what if and also what else


    When you write code for a comparison, usually you want to tell the computer to
    do something if the condition is true and to do something else if the condition
    is not true. In the English language, you often see this kind of logic with the
    word *otherwise:* If such-and-such is true, I will do this; otherwise, I will
    do that.


    In C++, you use the `else` keyword for the *otherwise* situation. The `IfElse`
    example demonstrates how to use the `else` keyword, as shown in the following
    code:


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `int i;`


    `cout << "Type any number: ";`


    `cin >> i;`


    `if (i > 10)`


    `{`


    `cout << "It''s greater than 10." << endl;`


    `}`


    `else`


    `{`


    `cout << "It''s not greater than 10." << endl;`


    `}`


    `return 0;`


    `}`


    In this code, you test whether a number is greater than 10\. If it is, you print
    one message. If it is not, you print a different message. Notice how the two blocks
    of code are distinct. The first block immediately follows the *if* statement;
    it''s the code that runs if the condition is `true`. The next block is preceded
    by the `else` keyword, and this block runs if the condition is `false`.


    ### Going further with the else and if


    The `IfElse2` example shown in the following code demonstrates how to combine
    the `if` and `else` keywords to check for multiple alternatives:


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `int i;`


    `cout << "Type any number: ";`


    `cin >> i;`


    `if (i > 10)`


    `{`


    `cout << "It''s greater than 10." << endl;`


    `}`


    `else if (i == 10)`


    `{`


    `cout << "It''s equal to 10" << endl;`


    `}`


    `else`


    `{`


    `cout << "It''s less than 10." << endl;`


    `}`


    `return 0;`


    `}`


    ## Making Decisions Using a Conditional Operator


    Besides using an *if* statement, a C++ application can make decisions by using
    a *conditional operator.*


    Think about this process: If two integer variables are equal, set a string variable
    to the string `"equal"`. Otherwise, set it to the string `"not equal"`. In other
    words, suppose that you have two `integer` variables, called `first` and `second`.
    `first` has the value `10` in it, and `second` has the value `20` in it. You also
    have a `string` variable called `result`. Now, to follow the little process just
    described: Are the two variables equal? No, they are not, so you set `result`
    to the string `"not equal"`.


    Now do this in C++. First, you declare the variables `first`, `second`, and `result`:


    `int first = 10;`


    `int second = 20;`


    `string result;`


    Notice that you didn''t yet initialize the string variable `result`. But now you’re
    going to write a single line of code that performs the process just described:


    `result = (first == second) ? "equal" : "not equal";`


    In English, this means `result` gets `"equal"` if `first` is equal to `second`;
    otherwise, it gets `"not equal"`.


    The colon separates two results, one of which will be assigned to the `result`
    variable. If `first` is equal to `second`, `result` gets the string `"equal"`.
    Otherwise, it gets the string `"not equal"`.


    Remember that the variable on the left side of the single equal sign receives
    the value of the expression on the right side of the equal sign, which evaluates
    to be a string of either `"equal"` or `"not equal"`, depending on the result of
    the condition. The whole `EqualityCheck` example is shown here:


    `#include <iostream>`


    `using namespace std;`


    `int main()`


    `{`


    `int first = 10;`


    `int second = 20;`


    `string result;`


    `result = first == second ? "equal" :`


    `"not equal";`


    `cout << result << endl;`


    `return 0;`


    `}`


    ## Repeating Actions with Statements That Loop


    Applications often have loops.


    [Table 3-2](#c03.xhtml_c03-tbl-0002) shows the types of loops. As the chapter
    progresses, you see examples of using all three loop types.


    | **Type of Loop** | **Appearance** |


    | --- | --- |


    | *for* | `for (x=0; x<10; x++) { }` |


    | *while* | `while (x < 10) { }` |


    | *do-while* | `do { } while (x < 10)` |


    [TABLE 3-2](#c03.xhtml_rc03-tbl-0002) Choosing Your Loops


    You may want to use these loops in the following situations:


    *   ***for* loop:** Use a *for* loop when you have a counter variable and you
    want it to loop while the counter variable increases or decreases over a range.
    The *for* loop is a good choice if you know how many times you want the loop to
    execute.


    *   ***while* loop:** Use the *while* loop when you have a condition under which
    you want your loop code to run. It''s a good choice when you want to perform the
    test at the beginning of the loop. The test may fail immediately, so the loop
    may not execute even once.


    *   ***do-while* loop:** Use the *do-while* loop when you have a condition under
    which you want your loop code to run and you want to ensure that the loop always
    runs at least once, even if the condition isn’t satisfied. It’s a good choice
    when the code inside the loop prepares the variables that the test uses, so the
    loop must execute at least once.


    ## Looping for


    Using the *for* loop provides precise control over how many times the code performs
    a task. In addition, it’s extremely flexible because you also have control over
    how the counter variable updates.


    ### Performing a simple for loop


    To use a *for* loop, you use the `for` keyword and follow it with a set of parentheses
    that contains information regarding the number of times the *for* loop executes.'
