  trans: "\n\n以下 `SwitchStatement` 示例是一个演示 `switch` 语句的完整应用程序。它还向你展示了如何在控制台上创建一个简单的、看起来老旧的菜单应用程序。你选择选择菜单项后不需要按回车键；只需按下你选择菜单对应的键即可。这得益于使用了\
    \ `getch()` 而不是 `cin`。注释有助于解释程序的逻辑。\n\n```cpp\n#include <iostream>\n#include <conio.h>\n\
    using namespace std;\n\nint main() {\n    // 显示选项列表。\n    cout << \"Choose your\
    \ favorite:\" << endl;\n    cout << \"1\\. Apples \" << endl;\n    cout << \"\
    2\\. Bananas \" << endl;\n    cout << \"3\\. Lobster \" << endl;\n    // 获取用户的选择。\n\
    \    char ch = getch();\n    // 继续获取用户选择，直到\n    // 用户输入有效的数字。\n    while (ch\
    \ < '1' || ch > '3') {\n        ch = getch();\n    }\n    // 使用 switch 显示用户的\n\
    \    // 选择。\n    cout << \"You chose \" << ch << endl;\n    switch (ch) {\n  \
    \      case '1':\n            cout << \"Apples are good for you!\" << endl;\n\
    \            break;\n        case '2':\n            cout << \"Bananas have plenty\
    \ of potassium!\"\n            << endl;\n            break;\n        case '3':\n\
    \            cout << \"Expensive, but you have good taste!\"\n            << endl;\n\
    \            break;\n    }\n    return 0;\n}\n```\n\n# 第 4 章\n\n# 使用函数分分工作\n\n\
    在本章中\n\n- 使用函数\n- 编写你自己的优秀函数\n- 玩转字符串\n- 操控 `main()`\n\n人们通常认为，生活中的大多数项目如果能将它们拆分成更小、更易管理的任务，就会变得更容易。计算机编程也是如此——如果你将代码拆分成更小的部分，它就会变得更易于管理。\n\
    \nC++ 提供了许多将代码拆分成较小部分的方法。其中一种方法是使用函数。`function` 是执行特定任务的代码行。在本章中，你将发现函数是什么，以及你如何使用它们来让你的编程工作变得更容易。\n\
    \n## 分分工作\n\n当你编写计算机应用程序时，在你将工作拆分为称为 `objects` 的较小部分之后，你最终开始赋予这些对象行为。为了这些这些行为，你将它们拆分为称为\
    \ `functions` 的易管理部分。把函数想象成一台机器。你可以将一个或多个值放入机器中；它处理它们，然后吐出一个单一答案（如果有的话）。\n\n这台机器（或函数）有三个主要部分：\n\
    \n- **输入（Inputs）：** 函数可以通过它的输入接收数据。这些数据元素可以是数字、字符串或任何其他类型。当你创建这样的机器时，你可以拥有任意数量的输入（甚至可以什么都没有）。\n\
    - **处理器（Processor）：** 处理器是函数本身。从 C++ 的角度来看，这实际上是一组代码行。\n- **输出（Output）：** 函数在完成它的工作后可以\
    \ `return` 某些东西。在 C++ 中，这种输出以数字、字符串或任何其他类型的形式存在。\n\n为了清楚说明这一切，请尝试以下 `FirstFunction`\
    \ 代码。（不要忘记第二行 `#include<math.h>`，它为你提供了一些数学功能。）\n\n```cpp\n#include <iostream>\n\
    #include <math.h>\nusing namespace std;\n\nint main() {\n    cout << fabs(-10.5)\
    \ << endl;\n    cout << fabs(10.5) << endl;\n    return 0;\n}\n```\n\n当你运行此应用程序时，你会看到以下输出：\n\
    \n```\n10.5\n10.5\n```\n\n在这段代码中，你使用了一个名为 `fabs()` 的函数或机器。该函数接受数字作为输入，并返回该数字的绝对值作为输出。\n\
    \n名称 `abs` 之前加上 `f` 的原因是因为它使用了浮点数，即简单的、带有小数点的数字。\n\n所以，`main()` 内部的第一行对值 `–10.5`\
    \ 调用了 `fabs()`。然后 `cout` 获取该函数的输出（即 `result`）并将其打印到控制台上。\n\n然后，第二行再次执行相同的操作，只是它获取的是数字\
    \ `10.5` 的绝对值。\n\n那么这个函数的处理器在哪里？它不在你的代码中；而在另一个文件中，接下来的行确保了你的应用程序可以使用此函数：`#include\
    \ <math.h>`。\n\n你已经在很多地方见过函数了。如果你使用计算器并输入一个数字然后按下平方根按钮，计算器就会运行一个计算平方根的函数。\n\n\
    ## 调用函数\n\n当你运行函数中的代码时，你正在调用该函数。当你调用函数时，你是通过名称调用的。\n\n要调用函数，你输入它的名称然后跟一组括号。在括号内部，你列出想要发送到函数输入的项。这里使用的术语是\
    \ `pass`（传递）。\n\n例如，如果对值 `–10.5` 调用 `fabs()`，`cout` 然后获取该函数的输出（即 `result`）并将其打印到控制台上。\n\
    \n然后第二行再次执行相同的操作，只是它获取的是数字 `10.5` 的绝对值。\n\n那么这个函数的处理器在哪里？它不在你的代码中；而在另一个文件中，接下来的行确保了你的应用程序可以使用此函数：`#include\
    \ <math.h>`。\n\n## 传递变量\n\n当你向函数传递一个值时，被称为参数（argument）。但如果你传递变量作为参数，你就是在传递变量。\n\
    \n例如：\n\n```cpp\n#include <iostream>\n#include <math.h>\nusing namespace std;\n\
    \nint main() {\n    double start = -10.5;\n    double finish = fabs(start);\n\
    \    cout << finish << endl;\n    return 0;\n}\n```\n\n当你运行此应用程序时，你会看到以下输出：\n\n\
    ```\n10.5\n```\n\n## 传递多个变量\n\n某些函数有多个参数。与接受单个值的函数一样，将值放在一组括号内。因为你有多个值，所以用逗号将它们分隔。下面的\
    \ `Pow1` 示例使用了名为 `pow()` 的函数来计算 10 的次方。确保你在 `include` 部分包含了 `math.h` 行，以便你能够使用\
    \ `pow()` 函数。\n\n```cpp\n#include <iostream>\n#include <math.h>\nusing namespace\
    \ std;\n\nint main() {\n    double number = 10.0;\n    double exponent = 3.0;\n\
    \    cout << pow(number, exponent) << endl;\n    return 0;\n}\n```\n\n当你运行应用程序时，你会看到\
    \ 10 的次方，即 1000：\n\n```\n1000\n```\n\n你还可以在表达式中混合传递变量和数字，或者只传递数字。以下代码段也计算 10 的次方，但为次方传递了一个实际数字\
    \ `3.0`：\n\n```cpp\ndouble number = 10.0;\ncout << pow(number, 3.0) << endl;\n\
    ```\n\n或者你可以只传递数字：\n\n```cpp\ncout << pow(10.0, 3.0) << endl;\n```\n\n"
- fmt: "\n# Writing Your Own Functions\n\nCalling functions is great, but you get\
    \ real power when you write your own, specialized functions. Before writing a\
    \ function, remember the parts: the inputs, the main code or processor, and the\
    \ single output (or no output). The inputs, however, are called `parameters,`\
    \ and the output is called a `return value.`\n\nThe following `AddOne` example\
    \ provides both a custom function and code in `main()` that calls the custom function.\
    \ (The function is placed outside `main()` — before it, in fact.)\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint AddOne(int start)\n{\n    int\
    \ newnumber = start + 1;\n    return newnumber;\n}\n\nint main()\n{\n    int testnumber\
    \ = 20;\n    int result = AddOne(testnumber);\n    cout << result << endl;\n \
    \   return 0;\n}\n```\n\n![Remember](images/remember.png) Notice that this example\
    \ lacks the `#include <math.h>` entry found in earlier examples. You need to add\
    \ an entry to the `include` section of your code only when you use a feature of\
    \ that include file. In this case, the example relies on standard math features\
    \ that are part of the basic C++ language, so you don't need any additional code.\n\
    \nAfter you run the example, you see:\n\n`21`\n\n![Tip](images/tip.png) When you\
    \ write your own functions, try to choose a name that makes sense and describes\
    \ what the function does.\n\n# Improving On the Basic Function\n\nNot all functions\
    \ work precisely the same way. You can create functions that have multiple parameters\
    \ or no parameters. There is no law that says that a function must absolutely\
    \ provide a return value. The following sections discuss variations on the basic\
    \ function theme discussed in the previous section.\n\n### Using multiple parameters\
    \ or no parameters\n\nYou don’t need to write your functions with only one parameter\
    \ each. You can have several parameters, or you can have none. Here are some ideas\
    \ for functions:\n\n* **Day:** Determines the day and returns it as a string,\
    \ as in `\"Monday\"` or `\"Tuesday\"`\n* **Number-of-users:** Figures out the\
    \ current number of users logged in to a web-server computer\n* **Current font:**\
    \ In a text editor application (such as Notepad), returns a string containing\
    \ the current font name, such as `\"Arial\"`\n* **Editing time:** Returns the\
    \ amount of time you've been using the word processor application\n* **Username:**\
    \ If you’re logged on to a computer, gives back your username as a string, such\
    \ as `\"Elisha\"`\n\nAll functions in this list have something in common: They\
    \ look up information.\n\nIf a function takes no parameters, you write the function\
    \ header as you would for one that takes parameters, and you include the parentheses;\
    \ you just don’t put anything `in` the parentheses, as the following `UserName`\
    \ example shows:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nstring\
    \ Username()\n{\n    return \"Elisha\";\n}\n\nint main()\n{\n    cout << Username()\
    \ << endl;\n    return 0;\n}\n```\n\nWhen you run this code, you see the following\
    \ output:\n\n`Elisha`\n\nYour function can also take multiple parameters. The\
    \ following `ConnectNames` example demonstrates the use of multiple parameters.\
    \ Notice that the function, `ConnectNames()`, takes the two strings as parameters\
    \ and combines them, along with a space in the middle. Notice also that the function\
    \ uses the two strings as variables.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nstring ConnectNames(string first, string last)\n{\n    return first\
    \ + \" \" + last;\n}\n\nint main()\n{\n    cout << ConnectNames(\"Richard\", \"\
    Nixon\")\n    << endl;\n    return 0;\n}\n```\n\nIn the function header, you see\
    \ the type name `string` for each parameter. Each parameter requires its own type\
    \ entry or the compiler displays an error. Here are some points about this code:\n\
    \n* You didn't create variables for the two names in `main()`. Instead, you just\
    \ typed them as string constants (that is, as actual strings surrounded by quotes).\n\
    * You can do calculations and figuring right inside the `return` statement. That\
    \ saves the extra work of creating a variable. In the function, you could create\
    \ a return variable of type `string`, set it to `first + \" \" + last`, and then\
    \ return that variable, as in the following code:\n    ```cpp\n    string result\
    \ = first + \" \" + last;\n    return result;\n    ```\n    But instead, the example\
    \ shows how to do it all on one line, as in this line:\n    `return first + \"\
    \ \" + last;`\n\n### Returning nothing\n\nLook at the case in which a function\
    \ doesn't return anything. In C++, the way you state that the function doesn’t\
    \ return anything is by using the keyword `void` as the return type in the function\
    \ header. The following `SetUserName` example demonstrates this approach.\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nvoid SetUsername(string newname)\n\
    {\n    cout << \"New user is \" << newname << endl;\n}\n\nint main()\n{\n    SetUsername(\"\
    Harold\");\n    return 0;\n}\n```\n\nWhen you run the application, you see\n\n\
    `New user is Harold`\n\nNotice the `SetUsername()` function header: It starts\
    \ with the word `void`. ![Warning](images/warning.png) Don't try to return something\
    \ in a function that has a return type of `void`. `Void` means that it returns\
    \ nothing.\n\n### Keeping your variables local\n\nWhen you create a variable inside\
    \ a function, that variable will be known only to that function. To see local\
    \ variable at work, consider the code in `PrintName` example:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nvoid PrintName(string first, string last)\n\
    {\n    string fullname = first + \" \" + last;\n    cout << fullname << endl;\n\
    }\n```\n\nNotice in the `PrintName()` function that you declare a variable called\
    \ `fullname`. You then use that variable in the second line in that function,\
    \ the one starting with `cout`. But you can't use the variable inside `main()`.\
    \ If you try to, as in the following code, you get a compile error:\n\n```cpp\n\
    int main()\n{\n    PrintName(\"Thomas\", \"Jefferson\");\n    cout << fullname\
    \ << endl;\n    return 0;\n}\n```\n\nHowever, you can declare a variable called\
    \ `fullname` inside `main()`, as in the `PrintName2` example. But, if you do that,\
    \ this `fullname` is local only to `main()`, whereas the other variable, also\
    \ called `fullname`, is local only to the `PrintName()` function. In other words,\
    \ each function has its own variable; they just happen to share the same name.\
    \ But they are two separate variables:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nvoid PrintName(string first, string last)\n{\n    string fullname =\
    \ first + \" \" + last;\n    cout << fullname << endl;\n}\n\nint main()\n{\n \
    \   string fullname = \"Abraham Lincoln\";\n    PrintName(\"Thomas\", \"Jefferson\"\
    );\n    cout << fullname << endl;\n    return 0;\n}\n```\n\n![Remember](images/remember.png)\
    \ When two functions declare variables by the same name, they're two separate\
    \ variables. If you store a value inside one of them, the other function doesn’t\
    \ know about it. The other function only knows about its own variable by that\
    \ name. As a result, the output from this example is:\n\n`Thomas Jefferson`\n\n\
    `Abraham Lincoln`\n\n![Warning](images/warning.png) If you use the same variable\
    \ name in two different functions, forgetting that you’re working with two different\
    \ variables is very easy. Do this only if you’re sure that no confusion can occur.\n"
  raw: "## Writing Your Own Functions\n\nCalling functions is great, but you get real\
    \ power when you write your own, specialized functions. Before writing a function,\
    \ remember the parts: the inputs, the main code or processor, and the single output\
    \ (or no output). The inputs, however, are called *parameters,* and the output\
    \ is called a *return value.*\n\nThe following `AddOne` example provides both\
    \ a custom function and code in `main()` that calls the custom function. (The\
    \ function is placed outside `main()` — before it, in fact.)\n\n`#include <iostream>`\n\
    \n`using namespace std;`\n\n`int AddOne(int start)`\n\n`{`\n\n`int newnumber =\
    \ start + 1;`\n\n`return newnumber;`\n\n`}`\n\n`int main()`\n\n`{`\n\n`int testnumber\
    \ = 20;`\n\n`int result = AddOne(testnumber);`\n\n`cout << result << endl;`\n\n\
    `return 0;`\n\n`}`\n\n![Remember](images/remember.png) Notice that this example\
    \ lacks the `#include <math.h>` entry found in earlier examples. You need to add\
    \ an entry to the `include` section of your code only when you use a feature of\
    \ that include file. In this case, the example relies on standard math features\
    \ that are part of the basic C++ language, so you don't need any additional code.\n\
    \nAfter you run the example, you see:\n\n`21`\n\n![Tip](images/tip.png) When you\
    \ write your own functions, try to choose a name that makes sense and describes\
    \ what the function does.\n\n## Improving On the Basic Function\n\nNot all functions\
    \ work precisely the same way. You can create functions that have multiple parameters\
    \ or no parameters. There is no law that says that a function must absolutely\
    \ provide a return value. The following sections discuss variations on the basic\
    \ function theme discussed in the previous section.\n\n### Using multiple parameters\
    \ or no parameters\n\nYou don’t need to write your functions with only one parameter\
    \ each. You can have several parameters, or you can have none. Here are some ideas\
    \ for functions:\n\n*   **Day:** Determines the day and returns it as a string,\
    \ as in `\"Monday\"` or `\"Tuesday\"`\n\n*   **Number-of-users:** Figures out\
    \ the current number of users logged in to a web-server computer\n\n*   **Current\
    \ font:** In a text editor application (such as Notepad), returns a string containing\
    \ the current font name, such as `\"Arial\"`\n\n*   **Editing time:** Returns\
    \ the amount of time you've been using the word processor application\n\n*   **Username:**\
    \ If you’re logged on to a computer, gives back your username as a string, such\
    \ as `\"Elisha\"`\n\nAll functions in this list have something in common: They\
    \ look up information.\n\nIf a function takes no parameters, you write the function\
    \ header as you would for one that takes parameters, and you include the parentheses;\
    \ you just don’t put anything *in* the parentheses, as the following `UserName`\
    \ example shows:\n\n`#include <iostream>`\n\n`using namespace std;`\n\n`string\
    \ Username()`\n\n`{`\n\n`return \"Elisha\";`\n\n`}`\n\n`int main()`\n\n`{`\n\n\
    `cout << Username() << endl;`\n\n`return 0;`\n\n`}`\n\nWhen you run this code,\
    \ you see the following output:\n\n`Elisha`\n\nYour function can also take multiple\
    \ parameters. The following `ConnectNames` example demonstrates the use of multiple\
    \ parameters. Notice that the function, `ConnectNames()`, takes the two strings\
    \ as parameters and combines them, along with a space in the middle. Notice also\
    \ that the function uses the two strings as variables.\n\n`#include <iostream>`\n\
    \n`using namespace std;`\n\n`string ConnectNames(string first, string last)`\n\
    \n`{`\n\n`return first + \" \" + last;`\n\n`}`\n\n`int main()`\n\n`{`\n\n`cout\
    \ << ConnectNames(\"Richard\", \"Nixon\")`\n\n`<< endl;`\n\n`return 0;`\n\n`}`\n\
    \nIn the function header, you see the type name `string` for each parameter. Each\
    \ parameter requires its own type entry or the compiler displays an error. Here\
    \ are some points about this code:\n\n*   **You didn't create variables for the\
    \ two names in** `main()`**.** Instead, you just typed them as string constants\
    \ (that is, as actual strings surrounded by quotes).\n\n*   **You can do calculations\
    \ and figuring right inside the** `return`**statement.** That saves the extra\
    \ work of creating a variable. In the function, you could create a return variable\
    \ of type `string`, set it to `first + \" \" + last`, and then return that variable,\
    \ as in the following code:\n\n    `string result = first + \" \" + last;`\n\n\
    \    `return result;`\n\n    But instead, the example shows how to do it all on\
    \ one line, as in this line:\n\n    `return first + \" \" + last;`\n\n### Returning\
    \ nothing\n\nLook at the case in which a function doesn't return anything. In\
    \ C++, the way you state that the function doesn’t return anything is by using\
    \ the keyword `void` as the return type in the function header. The following\
    \ `SetUserName` example demonstrates this approach.\n\n`#include <iostream>`\n\
    \n`using namespace std;`\n\n`void SetUsername(string newname)`\n\n`{`\n\n`cout\
    \ << \"New user is \" << newname << endl;`\n\n`}`\n\n`int main()`\n\n`{`\n\n`SetUsername(\"\
    Harold\");`\n\n`return 0;`\n\n`}`\n\nWhen you run the application, you see\n\n\
    `New user is Harold`\n\nNotice the `SetUsername()` function header: It starts\
    \ with the word `void`, which means that it returns nothing at all.\n\n![Warning](images/warning.png)\
    \ Don't try to return something in a function that has a return type of `void`.\
    \ *Void* means that the function returns nothing at all. If you try to put a *return*\
    \ statement in your function, you get a compile error.\n\n### Keeping your variables\
    \ local\n\nWhen you create a variable inside the code for a function, that variable\
    \ will be known only to that particular function. When you create such variables,\
    \ they’re called *local variables,* and people say that they’re “local” to that\
    \ particular function.\n\nTo see a local variable at work, consider the code in\
    \ the `PrintName` example:\n\n`#include <iostream>`\n\n`using namespace std;`\n\
    \n`void PrintName(string first, string last)`\n\n`{`\n\n`string fullname = first\
    \ + \" \" + last;`\n\n`cout << fullname << endl;`\n\n`}`\n\n`int main()`\n\n`{`\n\
    \n`PrintName(\"Thomas\", \"Jefferson\");`\n\n`return 0;`\n\n`}`\n\nNotice in the\
    \ `PrintName()` function that you declare a variable called `fullname`. You then\
    \ use that variable in the second line in that function, the one starting with\
    \ `cout`. But you can't use the variable inside `main()`. If you try to, as in\
    \ the following code, you get a compile error:\n\n`int main()`\n\n`{`\n\n`PrintName(\"\
    Thomas\", \"Jefferson\");`\n\n`cout << fullname << endl;`\n\n`return 0;`\n\n`}`\n\
    \nHowever, you can *declare* a variable called `fullname` inside `main()`, as\
    \ in the `PrintName2` example. But, if you do that, this `fullname` is local only\
    \ to `main()`, whereas the other variable, also called `fullname`, is local only\
    \ to the `PrintName()` function. In other words, each function has its own variable;\
    \ they just happen to share the same name. But they are *two separate variables:*\n\
    \n`#include <iostream>`\n\n`using namespace std;`\n\n`void PrintName(string first,\
    \ string last)`\n\n`{`\n\n`string fullname = first + \" \" + last;`\n\n`cout <<\
    \ fullname << endl;`\n\n`}`\n\n`int main()`\n\n`{`\n\n`string fullname = \"Abraham\
    \ Lincoln\";`\n\n`PrintName(\"Thomas\", \"Jefferson\");`\n\n`cout << fullname\
    \ << endl;`\n\n`return 0;`\n\n`}`\n\n![Remember](images/remember.png) When two\
    \ functions declare variables by the same name, they're two separate variables.\
    \ If you store a value inside one of them, the other function doesn’t know about\
    \ it. The other function only knows about its own variable by that name. As a\
    \ result, the output from this example is:\n\n`Thomas Jefferson`\n\n`Abraham Lincoln`\n\
    \n![Warning](images/warning.png) If you use the same variable name in two different\
    \ functions, forgetting that you’re working with two different variables is very\
    \ easy. Do this only if you’re sure that no confusion can occur."
