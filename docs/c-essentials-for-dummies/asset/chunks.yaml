  trans: "\n\n当你处理类和成员函数时，你也有类似的选项。大多数 C++ 程序员倾向于将成员函数的代码放在类定义之外。将它们放在类之外是为了让代码更易于读；这样你就不会面对一个巨大的、极其难以追踪的单体代码块。此外，使用该类的人可能并不关心成员函数是如何编写的，因此将它们的实现分开存放是最佳选择。类定义包含了成员函数的原型。如果函数只有一或两行代码，人们可能会将其留在类定义中。\n\
    \n成员函数的原型看起来如下所示：\n\n```\nvoid break_in_half();\n```\n\n列表 7-1 显示了类 `Pen` 的头文件\
    \ `Pen.h`。\n\n列表 7-1 在头文件 Pen.h 中使用成员函数原型\n\n```cpp\n#ifndef PEN_H_INCLUDED\n\
    #define PEN_H_INCLUDED\n\nusing namespace std;\n\nenum Color {\n    blue,\n  \
    \  red,\n    black,\n    clear,\n    grey\n};\n\nenum PenStyle {\n    ballpoint,\n\
    \    felt_tip,\n    fountain_pen\n};\n\nclass Pen {\npublic:\n    Color InkColor;\n\
