    yet encountered a function but sees a call to it, it doesn’t know what it’s seeing,
    and it issues an error message.


    You can, however, place your functions after `main()`; or you can even use function
    prototypes to put your functions in other source code files.


    A *function prototype* is nothing more than a copy of the function header. But
    rather than follow it with an open brace and then the code for the function, you
    follow the function header with a semicolon and you''re finished. A function prototype
    looks like this:


    `void PrintName(string first, string last);`


    Then you actually write the full function (header, code, and all) later. The full
    function can even be later than `main()` or later than any place that makes calls
    to it.


    Notice that this example looks just like the first line of a function. To write
    it, you simply copy the first line of the original function you write and add
    a semicolon. The following `PrintName3` example shows how to use this technique:


    `#include <iostream>`


    `using namespace std;`


    `void PrintName(string first, string last);`


    `int main()`


    `{`


    `PrintName("Thomas", "Jefferson");`


    `return 0;`


    `}`


    `void PrintName(string first, string last)`


    `{`


    `string fullname = first + " " + last;`


    `cout << fullname << endl;`


    `}`


    Notice that the function header appears above `main()` and ends with a semicolon.
    Next comes `main()`. Finally, you see the `PrintName()` function itself (again,
    with the header but no semicolon this time). Thus, the function comes after `main()`.


    If you have a source code file with, say, 20 functions, and these functions all
    make various calls to each other, it could be difficult to carefully order them
    so that each function calls *only* functions that are above it in the source code
    file. Instead, most programmers put the functions in some logical order, and they
    don''t worry much about the calling order. Then they have all the function prototypes
    toward the top of the source code file, as shown in the last code block.


    ![Tip](images/tip.png) When you type a function prototype, many people say that
    you’re specifying a *forward reference.* This term simply means that you’re providing
    a reference to something that happens later.


    ### Writing two versions of the same function


    Sometimes you may want to write two versions of the same function, with the only
    difference being that they take different parameter types. For example, you may
    want a function called `Combine()`. One version takes two strings and puts the
    two strings together, but with a space in the middle. It then prints the resulting
    string to the console. Another version adds two numbers and writes all three numbers
    — the first two and the sum — to the console. The first version would look like
    this:


    `void Combine(string first, string second)`


    `{`


    `cout << first << " " << second << endl;`


    `}`


    The code for the function prints the two strings with a space between them. Now
    the second version looks like this:


    `void Combine(int first, int second)`


    `{`


    `int sum = first + second;`


    `cout << first << " " << second << " " << sum`


    `<< endl;`


    `}`


    The function name is `Combine()`, and it doesn''t return anything. But this version
    takes two integers, not two strings, as parameters. The code is also different
    from the previous code in that it first computes the sum of the inputs and then
    prints the different numbers.


    ![Remember](images/remember.png) *Overloading* (using one name for multiple functions)
    is somewhat common in C++. The following `Combine` example contains the entire
    code. Both functions are present in the code.


    `#include <iostream>`


    `using namespace std;`


    `void Combine(string first, string second)`


    `{`


    `cout << first << " " << second << endl;`


    `}`


    `void Combine(int first, int second)`


    `{`


    `int sum = first + second;`


    `cout << first << " " << second << " "`


    `<< sum << endl;`


    `}`


    `int main()`


    `{`


    `Combine("David","Letterman");`


    `Combine(15,20);`


    `return 0;`


    `}`


    You see each function called in `main()`. The compiler chooses which function
    to call based on the arguments you provide. For example, when viewing this call,
    you see two strings:


    `Combine("David","Letterman");`


    The compiler knows to use the first version, which takes two strings. Now look
    at the second function call:


    `Combine(15,20);`


    This call takes two integers, so the compiler knows to use the second version
    of the function.


    ![Remember](images/remember.png) When you overload a function, the parameters
    must differ (or must appear in a different order). For example, the functions
    can take the same type of information but use a different number of parameters.
    Of course, the previous example shows that the parameters can also vary by type.
    You can also have different return types, though they must differ by more than
    just the return type, and varying the parameter names doesn''t count. The compiler
    will see `Combine(string A, string B)` and `Combine(string First, string Second)`
    as the same function.


    ## Calling All String Functions


    To get the most out of strings, you need to make use of some special functions
    that cater to the strings. However, using these functions is a little different
    from the other functions used so far in this chapter. Instead of just calling
    the function, you first type the variable name that holds the string, and then
    a period (or *dot*), and then the function name along with any arguments.


    ### Inserting a string into a string


    One function that you can use is `insert()`. You can use this function if you
    want to insert more characters into another string. For example, if you have the
    string `"Something interesting and bizarre"` and you insert the string `"seriously
    "` (with a space at the end) into the middle of it starting at index 10, you get
    the string `"Something seriously interesting and bizarre"`.


    ![Remember](images/remember.png) When you work with strings, the first character
    is the 0th index, the second character is the 1st index, and so on. The following
    lines of code perform an insert by using the `insert()` function at index `10`,
    even though you perform the insertion at letter 11:


    `string words = "Something interesting and`


    `bizarre";`


    `words.insert(10, "seriously ");`


    The first of these lines simply creates a string called `words` and stuffs it
    full with the phrase `"Something interesting and bizarre"`. The second line does
    the insert. Notice the strange way of calling the function: You first specify
    the variable name, `words`, and then a dot, and then the function name, `insert`.
    Next, you follow it with the parameters in parentheses, as usual. For this function,
    the first parameter is the index where you want to insert the string. The second
    parameter is the actual string you''re going to insert. After these two lines
    run, the string variable called `words` contains the string `"Something seriously
    interesting and bizarre"`.


    ### Removing parts of a string


    You can also erase parts of a string by using a similar function called `erase()`.
    The following line of code erases `16` characters from the `words` string starting
    at index `19`:


    `words.erase(19,16);`'
