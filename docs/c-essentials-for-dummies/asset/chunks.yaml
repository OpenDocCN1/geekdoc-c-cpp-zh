    You must run `CL` in a special command window. Left-click the Start button at
    the bottom of the screen. Scroll down to the `Visual Studio 2022` folder, and
    click the down arrow to the right of the folder to reveal the folder''s contents.
    Left-click `Developer Command Prompt for VS 2022` to open a command window especially
    set up to run `CL`. On the command line of that window, enter the following command
    on one line:


    ```bash

    cl /EHsc /std:c++20 hello.cpp /link /out:hello.exe

    ```


    This command compiles the source file and generates the executable file `hello.exe`.
    To run the executable file, enter the following command:


    ```bash

    hello

    ```


    In later chapters, an application may consist of multiple source files. Then,
    instead of specifying a single source file like `hello.cpp`, you would tell `CL`
    to compile all the source files in the directory whose names end with `.cpp`.
    For example:


    ```bash

    cl /EHsc /std:c++20 *.cpp /link /out:books.exe

    ```


    These example commands include the `/std:c++20` parameter to specify using the
    standard 2020 version of C++. You should be able to compile this book''s examples
    with earlier versions of C++ by specifying `/std:c++14` or `/std:c++17`.


    The `/link` option says that the next option is meant for the `linkage editor`,
    a tool that combines the output of the compiler into an executable program. The
    `/out` parameter tells the linkage editor what to name the executable program.


    `/EHsc` tells the compiler how to generate code to handle exceptions, which are
    runtime errors. Exception handling is briefly covered in [Chapter 9](#c09.xhtml).


    ![Tip](images/tip.png) For a walk-through on compiling and running a C++ program
    on the command line, go to [`https://learn.microsoft.com/en-us/cpp/build/walkthrough-compiling-a-native-cpp-program-on-the-command-line`](https://learn.microsoft.com/en-us/cpp/build/walkthrough-compiling-a-native-cpp-program-on-the-command-line).
    For descriptions of the `CL` compiler options, go to [`https://learn.microsoft.com/en-us/cpp/build/reference/compiler-options-listed-alphabetically`](https://learn.microsoft.com/en-us/cpp/build/reference/compiler-options-listed-alphabetically).


