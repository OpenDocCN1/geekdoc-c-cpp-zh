    ## Working with an Integrated Development Environment


    An IDE is an application that combines a syntax-aware code editor, a compiler,
    a debugger, and often other tools. Many IDEs are cross-platform — they have versions
    that run on different platforms. Others only run on particular platforms. Some
    IDEs for C++ include the following:


    *   CLion (cross-platform; [`www.jetbrains.com/clion`](https://www.jetbrains.com/clion))


    *   Code::Blocks (cross-platform; [`www.codeblocks.org`](https://www.codeblocks.org/))


    *   Eclipse CDT (cross-platform; [`https://projects.eclipse.org/projects/tools.cdt`](https://projects.eclipse.org/projects/tools.cdt))


    *   Microsoft Visual C++ ([`https://visualstudio.microsoft.com/downloads`](https://visualstudio.microsoft.com/downloads/))


    *   Visual Studio (cross-platform; [`https://visualstudio.microsoft.com`](https://visualstudio.microsoft.com/))


    *   Xcode (Apple macOS; [`https://developer.apple.com/xcode`](https://developer.apple.com/xcode))


    An IDE''s syntax-aware code editor makes it easy to edit C++ code. It can use
    color-coding to highlight different source code components, such as keywords,
    and flag syntax errors as you type the code.


    The debugger has features to help you get your code to run correctly. You can
    set breakpoints at statements to cause your program to temporarily pause at those
    statements during execution. When your program is paused at a breakpoint, you
    can examine the current values of variables. You can *single-step* (execute one
    statement at a time while you monitor the values of variables), or you can resume
    normal program execution.


    [Figure 1-1](#c01.xhtml_c01-fig-0001) shows debugging `hello.cpp` in Eclipse CDT.
    The program is paused at the `cout` statement. You can see that the current value
    of variable `i` is `4`.


    ![“Screenshot of the Eclipse IDE showing a C++ program in debug mode. The program
    is a ''Hello, world!'' example that prints the message five times using a for
    loop. A breakpoint is set at line 9, and the variable ''i'' currently has a value
    of 4.](images/9781394307883-fg0101.png)


    [FIGURE 1-1:](#c01.xhtml_rc01-fig-0001) Using the Eclipse CDT integrated development
    environment (IDE).


    Using an IDE greatly simplifies C++ application development, but how to use an
    IDE is beyond the scope of this book. If you’re interested in learning more, you
    can find online tutorials for any IDE you want to use.


    Chapter 2


    # Storing Data in C++


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Using storage bins called variables**


    ![Bullet](images/check.png) **Working with integer and character variables**


    ![Bullet](images/check.png) **Manipulating strings**


    ![Bullet](images/check.png) **Using Boolean variables and conditional operators**


    ![Bullet](images/check.png) **Declaring and initializing a variable to hold a
    floating-point value**


    ![Bullet](images/check.png) **Telling `cout` how many digits to print after the
    decimal point**


    ![Bullet](images/check.png) **Using enumerations to make your code easier to read**


    ![Bullet](images/check.png) **Reading from the console**


    The best way to think of memory is as a set of storage bins. When you write a
    computer application, you reserve some storage bins, and you give each storage
    bin a name. You also say what type of thing can be stored in the storage bin.
    The technical term for such a storage bin is a *variable.*


    In this chapter, you discover how you can use these storage bins in your applications.


