    \ `cout`，这些字符输出到控制台。而 `>>` 运算符通常被称为提取运算符。这里的想法是你正在从流中提取内容。对于 `cin`，你正在从流中提取内容。\n\
    \n这里显示的 `ReadString` 示例演示了如何从控制台读取字符串：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main()\n{\n    string name;\n    cout << \"Type your name: \";\n\
    \    cin >> name;\n    cout << \"Your name is \" << name << endl;\n    return\
    \ 0;\n}\n```\n\n当你运行这段代码时，你会看到控制台要求输入名字，然后它停止。那是因为它正在等待你的输入。注意插入点立即出现在文本 `\"Type\
    \ your name:\"` 之后。这是因为第一个 `cout` 语句缺少了通常的 `endl`。输入一个名字（如 `Fred`），不带空格并按回车。控制台看起来像这样：\n\
    \n```\nType your name: Fred\nYour name is Fred\n```\n\n你也可以读取整数，如下代码所示（在 `ReadInt`\
    \ 示例中）：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\
    \    int x;\n    cout << \"Type your favorite number: \";\n    cin >> x;\n   \
    \ cout << \"Your favorite number is \" << x << endl;\n    return 0;\n}\n```\n\n\
    这段示例代码将单个整数读入变量 `x`，然后将其值打印到控制台。\n\n![Remember](img/remember.png) 默认情况下，`cin`\
    \ 从控制台读取由空格分隔的单词或数字。如果你在输入中放入空格，只有第一个单词会被读取。当应用程序下一次遇到 `cin >>` 时，`cin` 会读取第二个单词。\n\
    \n"
- fmt: "\nThis chapter considers different ways to evaluate conditions within your\
    \ applications and cause different sections of code to run based on those conditions.\
    \ It helps you understand how you can use C++ commands called `if statements`,\
    \ which are similar to what-if situations in real life. You also see how to use\
    \ other C++ statements (such as `do-while`) to perform `loops` (repeating the\
    \ same application sections a number of times). But first we start by explaining\
    \ comments.\n\n## Filling Your Code with Comments\n\nA `comment` is simply some\
    \ words in the code that the compiler ignores and that you include for the benefit\
    \ of the humans reading the code. Comments are essential to good coding. You denote\
    \ a comment in C++ by starting a line with two slashes, like this:\n\n```cpp\n\
    // Initialize total to the number\n// of items involved.\ntotal = 10;\n// Now\
    \ there are 3 more items.\ntotal += 3;\n```\n\nNow anyone working on the project\
    \ can understand what the code does. Note the blank line between the two groups\
    \ of code. Using blank lines helps someone looking at the code see where one thought\
    \ ends and another begins. The compiler ignores comments and blank lines; they’re\
    \ for the benefit of programmers reading the code. You can write whatever you\
    \ want as comments, and the compiler pretends that the comments aren’t even there.\n\
    \n![Tip](images/tip.png) A comment begins with `//`, and it can begin anywhere\
    \ on the line. You can even put comments at the end of a line containing C++ code,\
    \ instead of on a separate line. Using comments on a code line lets you focus\
    \ a comment on just that line, like this:\n\n```cpp\nint subtotal = 10; // Initialize\
    \ subtotal to 10.\n```\n\nThis comment gives a little more explanation of what\
    \ the line does. You usually use line comments like this when you want to tell\
    \ others what kind of information a variable holds or explain a complex task.\
    \ Normally, you explain blocks of code as shown earlier in this section.\n\n![Tip](images/tip.png)\
    \ You can use two kinds of comments in C++. One is the double slash (`//`). The\
    \ other kind of comment begins with a slash-asterisk, `/*`, and ends with an asterisk-slash,\
    \ `*/`. The comments go between these delimiters and can span several lines, as\
    \ in the following example:\n\n```cpp\n/* This application separates the parts\
    \ of the\nsandwich into its separate parts. This\nprocess is often called \"separation\
    \ of\nparts.\"\n(c) 2020 Sandwich Parts Separators, Inc.\n*/\n```\n\nThis is all\
    \ one comment, and it spans multiple lines. You normally use this kind of comment\
    \ to provide an overview of a task or describe the purpose of a function. This\
    \ kind of comment also works well for the informational headings that some large\
    \ company applications require. As with other comments, you can put them anywhere\
    \ in your code, as long as you don't break a string or word in two by putting\
    \ a comment in the middle.\n\n![Warning](images/warning.png) Some beginning programmers\
    \ get the mistaken idea that comments appear in the application window when the\
    \ application runs. That isn’t the case. A comment does not write anything to\
    \ the console. To write things to the console, use `cout` (see [Chapter 2](#c02.xhtml)).\n\
    \n## Evaluating Conditions in C++\n\nMost decisions that the computer makes are\
    \ based on conditions evaluated by comparing either two numbers or two characters.\
    \ For numerical comparisons, you may compare a variable to a number, as in the\
    \ following statement:\n\n```cpp\nx > 10\n```\n\nThis comparison evaluates whether\
    \ the variable `x` holds a value greater than the number `10`. If `x` is, indeed,\
    \ greater than `10`, the computer sees this condition as `true`. If `x` is not\
    \ greater than `10`, the computer sees the condition as not true (`false`).\n\n\
    ![Tip](images/tip.png) Developers often use the word `satisfied` with conditions.\
    \ For the condition `x > 10`, if `x` is greater than `10`, developers say the\
    \ condition is satisfied.\n\nFor character comparisons, you may compare whether\
    \ two characters are equal, as in the following statement:\n\n```cpp\nmychar ==\
    \ 'A'\n```\n\nThis comparison evaluates whether `mychar` contains the letter `A`.\
    \ Notice that you use two equal signs, not just one. Using a single equal sign\
    \ would assign the value `A` to `mychar`.\n\nTo test whether the character is\
    \ not equal to something, you use the somewhat cryptic-looking `!=` operator.\
    \ Think of the `!` as meaning *not,* as in:\n\n```cpp\nmychar != 'X'\n```\n\n\
    ### Finding the right C++ relational operators\n\nEach statement in the previous\
    \ section uses a `relational operator` to specify the comparison to make between\
    \ the numbers or the strings. [Table 3-1](#c03.xhtml_c03-tbl-0001) shows you the\
    \ types of relational operators available in C++ and the comparisons that they\
    \ help you make in your applications.\n\n| **Operator** | **What It Means** |\n\
    | --- | --- |\n| `<` | Less than |\n| `<=` | Less than or equal to |\n| `>` |\
    \ Greater than |\n| `>=` | Greater than or equal to |\n| `==` | Equal to |\n|\
    \ `!=` | Not equal to |\n\n[TABLE 3-1](#c03.xhtml_rc03-tbl-0001) Evaluating Numerical\
    \ Conditions\n\nThe following list gives examples of the operators in action:\n\
    \n*   The operator that tests for equality is *two* equal signs. It looks like\
    \ this:\n\n    ```cpp\n    x == 10\n    ```\n\n    When the computer finds this\
    \ statement, it checks to see whether `x` equals `10`.\n\n    ![Warning](images.png)\
    \ If you put just one equal sign in your statements, most C++ compilers will not\
    \ give you an error — though `x = 10` is an *assignment,* setting the variable\
    \ `x` to `10`. In that case, the result of the evaluation is always the same.\n\
    \n    ![Remember](images.png) To test for all whole numbers greater than or equal\
    \ to 10, the condition `x > 9` works only if you're working with integers. The\
    \ number 9.1 is greater than 9, and it’s not greater than or equal to 10. So if\
    \ you want greater than or equal to and you’re not working with integers, use\
    \ the `>=` operator.\n\n*   The operator that tests for inequality is an exclamation\
    \ mark followed by an equal sign. For the condition `x != 10`, the condition evaluates\
    \ as true only if `x` is equal to `10`.\n\n*   When you're testing for greater-than\
    \ or less-than conditions, the condition `x > 10` is not true if the value of\
    \ `x` is equal to `10`. The condition `x > 10` is true only if `x` is actually\
    \ greater than, but equal to, `10`. To also test for `x` being equal to `10`,\
    \ you have two choices:\n\n    *   If you're working with integers, you can test\
    \ whether `x > 9`. In that case, the condition is true if `x` equals `10`, or\
    \ `11`, or `12`, and so on.\n    *   You can use the greater-than-or-equal-to\
    \ operator to determine equality: `x >= 10`. This condition also is true if `x`\
    \ equals `10`, `11`, and so on.\n\n    ![Remember](images.png) To test for all\
    \ whole numbers greater than or equal to 10, the condition `x > 9` works only\
    \ if you're working with integers. If you’re working with floating-point numbers\
    \ (see [Chapter 2](#c02.xhtml)), the statement `x > 9` won’t work the way you\
    \ want. The number 9.1 is greater than 9, and it’s not greater than or equal to\
    \ 10.\n\n### Combining multiple conditions\n\nWhen you make evaluations for application\
    \ decisions, you may have more than one condition to evaluate. You may have an\
    \ expression with two conditions, and for the expression to be true, *either or\
    \ both* conditions must be true. In other words, the expression is false only\
    \ if *both* conditions are false. Combining conditions like this is an *or* expression:\
    \ If this is true, or if that is true, or if both are true, then something happens.\n"
