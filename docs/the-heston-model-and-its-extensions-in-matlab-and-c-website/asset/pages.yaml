  md: '# Trapezoidal Rule


    This rule is slightly more complicated as it approximates the integral in Equation
    (5.1) as sum of trapezoids, each with equal width $x_{i+1}-x_i$, but with height
    defined by the value of $f(x)$ at the endpoints. The trapezoids are constructed
    by joining the line segments at $f(x_i)$ and $f(x_{i+1})$. Define the abscissas
    as the mid-point rule in the previous section. The trapezoidal rule uses $w_i
    = w_N = b/2$ and $w_j = h$ for $j=2, \dots, N-1$. Hence the approximation in (5.1)
    is


    ```

    $$\int_a^b f(x)dx = \frac{b}{2}f(x_i) + \sum_{j=2}^{N-1} f(x_j) + \frac{b}{2}f(x_N)$$

    ```


    The Matlab code for implementing the trapezoidal rule is straightforward forward.
    It appears in the Matlab function HestonPriceNewtonCotes.m.


    ```

    wt = h.*[1/2 ones(1,N-2) 1/2];

    for k=1:N;

    int1(k) = wt(k)*HestonProb(phi(k),...,1);

    int2(k) = wt(k)*HestonProb(phi(k),...,2);

    end

    ```


    # Trapezoidal Rule for Double Integrals


    In Chapter 8, we will encounter the model of Chiara and Ziogas (2006) for pricing
    American calls in the Heston (1993) model. Their method requires a routine for
    the numerical evaluation of a double integral. One of the simplest methods for
    double integration is the composite trapezoidal rule described by Burden and Faires
    (2010). We wish to evaluate a double integral on the domain $[a,b] \times [c,d]$.
    The composite trapezoidal rule approximates the integral as


    ```

    $$\int_a^b\int_c^d f(x,y)dy = \frac{(b-a)(d-c)}{16} \times [f(a,c)+f(a,d)+f(b,c)+f(b,d)
    + 2\left(f(\frac{a+b}{2},c) + f(\frac{a+b}{2},d)\right) + 2\left(f(a,\frac{c+d}{2})
    + f(b,\frac{c+d}{2})\right) + 4f(\frac{a+b}{2},\frac{c+d}{2})\)].$$

    ```


    The Matlab function DoubleTrap.m implements the composite trapezoidal rule, in
    accordance with Equation (5.5).


    ```

    function y = DoubleTrap(f,X,Y)

    Nx = length(X);

    Ny = length(Y);

    for y=2:Ny

