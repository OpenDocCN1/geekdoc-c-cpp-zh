  md: '# Integration Issues, Parameter Effects, and Variance Modeling


    The in-the-money probability $P_2$ is the complement of (2.6), evaluated at ln
    K


    ```

    $P_2 = Q(x_T > \ln K) = \frac{1}{2} - \frac{1}{\pi}\int_0^{\infty} \text{Re} \left[
    \frac{e^{-i\phi \ln K} f(\phi)}{i\phi} \right] d\phi \quad (2.7)$

    ```


    which is identical to Equation (2.3). To obtain $P_1$, invoke a change of numera.
    Recall the Radon-Nikodym derivative from Chapter 1


    ```

    $$\frac{dQ^S}{dQ} = \frac{S_T}{S_0} = \frac{e^{rT}}{\mathbb{E}^Q[e^{rT}]} \quad
    \ (2.8)$

    ```


    We can write $S_t e^{r(T-t)} = \mathbb{E}^Q[S_t]$, under the risk-neutral measure
    $\mathbb{Q}$, the stock price grows at the risk-free rate, r. (2.8) suggests that
    a new density $q^s(x)$ should be defined from $q(x)$ via the Radon-Nikodym derivative
    as


    ```

    $q^s(x)dx = \frac{e^x}{\mathbb{E}^Q[e^{x}]}q(x)dx.$

    ```


    The characteristic function for $q^s(x)$ is, therefore


    ```

    $$\mathbb{E}^Q[e^{i\phi XT}] = \int_{-\infty}^{\infty} e^{i\phi x} q^s(x)dx =
    \frac{1}{\mathbb{E}^Q[e^{i\phi XT}]} \int_{-\infty}^{\infty} e^{i\phi x} q(x)dx.
    \quad (2.9)$

    ```


    Note that $\mathbb{E}^Q[e^{i\phi XT}]$ is a constant and can be taken out of the
    integral. Note also that, since the characteristic function for $x_t$ is $(\phi)
    = \mathbb{E}^Q[e^{i\phi XT}]$,


    ```

    $$\mathbb{E}^Q[e^{i\phi XT}] = f(-i) = S_0 e^{r(T-t)}.$

    ```


    Finally, the integral in the right-hand side of Equation (2.9) can be evaluated
    at $\phi - i$.


    ```

    $$\int_{-\infty}^{\infty} e^{i(\phi-i)x} q(x)dx = \mathbb{E}^Q[e^{i(\phi-i)x_T}].$

    ```


    This last expression is the characteristic function for $x_T$ evaluated at $\phi
    - i$. Hence, the characteristic function for the density $q^s(x)$ can be expressed
    in terms of the characteristic function for $q(x)$ at the points $\phi -i$ and
    $\phi - ia$


    ```

    $$\mathbb{E}^Q[e^{i\phi XT}] = \frac{f(-i)}{f(-i)} \frac{f(-i)}{S_0 e^{r(T-t)}}.
    \quad (2.10)$

    ```


    When the stock pays a continuous dividend yield $q$, the denominator of (2.10)
    becomes $e^{rt-q(T-t)}S_0$. It was shown in Chapter 1


    ```

    $e^{rt} \mathbb{E}^Q[S_t 1_{S_T>K}] = S_0 Q^S(S_T > K).$

    ```


    To show that $Q^S(x_T > \ln K)$ can be expressed in form of Equation (2.2), apply
    the inversion theorem to the characteristic function in (2.10)


    ```

    $P_1 = Q^S(x_T > \ln K) = \frac{1}{2} - \frac{1}{\pi}\int_0^{\infty} \text{Re}
    \left[ \frac{e^{-i\phi \ln K} f(\phi)}{i\phi f(-i)} \right] d\phi \quad (2.11)$

    ```'
