- pgno: 36
  md: "# Integration Issues, Parameter Effects, and Variance Modeling\n\nAbstract\n\
    \nIn this chapter, we investigate several issues around the Heston model. First,\
    \ following Bakshi and Madan (2000), we show that the Heston call price can be\
    \ expressed in terms of a single characteristic function. It is well-known that\
    \ the integrand for the call price can sometimes show high oscillation, dampen\
    \ very slowly along the integration axis, and can show discontinuities. All of\
    \ these problems can introduce inaccuracies in numerical integration. The \"Little\
    \ Trap\" formulation of Albrecher et al. (2007) provides an easy fix to many of\
    \ these problems. Next, we examine the effects of the Heston parameters on implied\
    \ volatilities extracted from option prices generated with the Heston model. Borrowing\
    \ from Gatheral (2006), we examine how the fair strike of a variance swap can\
    \ be derived under the model and present approximations to local volatility and\
    \ implied volatility from the model. Finally we examine moment explosions derived\
    \ by Andersen and Piterberg (2007) and bounds on implied volatility of Lee (2004b).\n\
    \n# REMARKS ON THE CHARACTERISTIC FUNCTIONS\n\nIn Chapter 1, it was shown that\
    \ the in-the-money probabilities $P_1$ and $P_2$ are obtained by the inverse Fourier\
    \ transform of the characteristic functions $f_1$ and $f_2$\n\n```\n$P_j = Pr(\\\
    ln S_t > \\ln K) = \\frac{1}{2} + \\frac{1}{\\pi} \\text{Re} \\int_0^{\\infty}\
    \ \\left[ \\frac{e^{-i\\phi \\ln K} f_j(\\phi; x, v)}{i\\phi} \\right] d\\phi.\
    \ \\quad (2.1)$\n```\n\n form of inversion is due to Gil-Pelaz (1951) and will\
    \ be derived in Chapter 3. It makes sense that two characteristic functions $f_1$\
    \ and $f_2$ are associated with the Heston model, where $P_1$ and $P_2$ are obtained\
    \ under different measures. On the other hand, it also seems that only a single\
    \ characteristic function ought to exist, because there is only one underlying\
    \ price of the model. Indeed, some authors write the probabilities $P_1$ and $P_2$\
    \ in terms of a single characteristic function $f(\\phi) = f(\\phi; x, v)$,\n\n\
    ```\n$P_1 = \\frac{1}{2} + \\frac{1}{\\pi} \\text{Re} \\int_0^{\\infty} \\left[\
    \ \\frac{e^{-i\\phi \\ln K} f(\\phi - i)}{i\\phi f(-i)} \\right] d\\phi \\quad\
    \ (2.2)$\n```\n\nThe Heston Model and Its Extensions in Matlab and C#. Fabrice\
    \ Douglas Rouah.\n© 2013 Fabrice Douglas Rouah. Published 2013 John Wiley & Sons,\
    \ Inc. 25"
