  md: "# American Options\n\nexpressions resulting from this collection are cut and\
    \ paste into the solve.m function. The solve.m functions are used to solve the\
    \ expressions for $\\pi_{41}^s$ and $\\pi_{42}^s$, and $p_{41}^s$ is formed as\
    \ $p_{41}^s(\theta, v) = \\pi_{41}^2 + \\pi_{42}^2$, in accordance with Equation\
    \ (8.67).\n\n```\nCn_1 = C23;\nCn_2 = C2l;\nCvn_1 = diff(Cn_1,v);\nCvn_2 = diff(Cn_2,v);\n\
    Cvnn_2 = diff(Cn_2,v);\nsyms pi41 pi42\nPDE1 = d2plin+ theta*dplin- n*plin+1/sqrt(v)*(v-2*mu);\n\
    collect (subs (PDE1), theta)\npi41 = solve('(3/(v-2)*(2*cdf2*y*mu2 ...',pi41)\n\
    pi42 = solve('(2*pi41*rho*sigma*v (1/2) ...',pi42)\np14 = pi41*theta^2 + pi42;\n\
    ```\n\nSimilarly, the next part of the code defines the second PDE and extends\
    \ common to of $\theta$. The expressions are cut and pasted to solve for $x_{41}^s$,\
    \ $x_{42}^s$, $x_{43}^s$, and the polynomial $q_{41}^s$ is formed as $q_{41}^s(\t\
    heta, v) = x_{41}^7+x_{42}^5+x_{43}^3+x_{44}^0$, in accordance with Equation (8.68).\n\
    \n```\nsyms q41 q42 q43 q44\nPDE2 = -(n+1)*dqlin- theta*dqlin+ d2qin+2*dplin ...;\n\
    collect (subs (PDE2), theta)\nq41 = solve('(12*q41l1/32*rho*3*sigma^3 ...',q41);\n\
    q42 = solve('(rho*sigma/v (1/2) ...',q42);\nq43 = solve('(rho*sigma/v (1/4*y*\
    \ ...',q43);\nq44 = solve('(6*q44+3/4*sigma^2/v ...',q44);\nq14 = q41*theta^7+q42*theta^5+q43*theta^3+q44*theta;\n\
    ```\n\nThe last part of the code for $n=4$ uses $p_0^s$, $p_4^s$ and $q_4^s$ to\
    \ obtain the coefficient $C_4$, in accordance with Equation (8.69). Note the code\
    \ substitutes for $\theta$, using the subs.m function.\n\n```\nsyms C4\nPut4 =\
    \ C4*(p04*cdf+ q04*cdf) + p14*cdf+ q14*cdf;\nExp4 = -v*(4/2)*y*4/24;\nC4 = solve(Put4\
    \ - Exp4)\nC4 = subs(C4, theta, y);\n```\n\nThe code in the GenerateQHeston.m\
    \ file, generates polynomials and coefficients up to n=5. The expressions for\
    \ these quantities are cut"
