  md: "# 104\tTHE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nfunction for\
    \ $s_T = \\ln S_T$. By an application of Parseval's identity in Equation (4.22),\n\
    we have\n\n```\n$U(S_0) = e^{-rT} E^0[w(x)] = e^{-rT} \\int_{-\\infty}^{\\infty}\
    \ q(s_0)w(x)dx\\n= \\frac{e^{-rT}}{2\\pi} \\int_{ik_0}^{ik_{\\infty}} \\hat{q}(-ks_0)\\\
    hat{w}(k) dk\\n= \\frac{e^{-rT}}{2\\pi} \\int_{ik_0}^{ik_{\\infty}} e^{-ikY}\\\
    varphi(-k)\\hat{w}(k) dk.$ (4.30)\n```\n\nSubstituting for payoff transforms $\\\
    hat{u}(x)$ produces valuation formulas-\nspponding to those payoffs. The call\
    \ option has payoff transform $\\hat{u}(x)$ given in\nEquation (4.2). Here, the\
    \ call price $C(S_0)$ is found by substituting for\ninto (4.30)\n\n```\n$C(S_0)\
    \ = \\frac{e^{-rT}}{2\\pi} \\int_{ik_0}^{ik_{\\infty}} e^{-ikY}\\varphi(-k) \\\
    frac{K^{k-1}}{k^2-ik} dk\\n= \\frac{Ke^{-rT}}{2\\pi} \\int_{ik_0}^{ik_{\\infty}}\
    \ e^{-ikW}\\varphi(-k)}{k^2-ik} dk.$ (4.31)\n```\n\nfor $1 < k_i < k_\\beta$ and\
    \ where $W = \\ln(S/K)+(r-q)T$, which we denoted by X\nthis chapter. The second\
    \ line of (4.31) is Equation (3.9) of Lewis (2001). Recall\nthat the condition\
    \ $k_i > 1$ must hold in order for the call option payoff transform\nbe defined\
    \ (where $k_i = \\text{Im}[{k\\]$). Note the identical forms of the call price\
    \ in Equation\n(4.31) and the call price $C_t(K)$ in (4.17), which shows that\n\
    \n$$\\hat{H}(k, \\nu, \\tau) = \\varphi(-k).$\n\n# Contour Variations and the\
    \ Call Price\n\nThe residue of a complex-valued function $f(k)$ at a simple pole\
    \ $c$ is defined as\n\n```\n$$\\text{Res}(c) = \\lim_{k\\to c} f(k)(k-c).$\n```\n\
    \nThe residue theorem states a complex integral evaluated along a contour\nis\
    \ equal to $2\\pi$ times the sum of the residues at all poles contained within\
    \ the contour.\nThis greatly simplifies the evaluation of a complex integral,\
    \ since we only need to\nknow value of the residues at the poles. The integral\
    \ in Equation (4.31) is not\ndefined at the poles $k=0$ and $k=i$, since both\
    \ of these values produce zero in the\ndominator. The residue at $k=0$ for the\
    \ integrand in (4.31) is\n\n```\n$$\\text{Res}(0) = \\lim_{k\\to0} \\frac{Ke^{-rT-ikW}\\\
    varphi(-k)}{2\\pi(k-i)}k = -\\frac{Ke^{-rT-Ti}}{2\\pi}.$\n```\n\nsince $\\varphi(0)=0$\
    \ and $1/i = -i$. Similarly, the residue at $k=i$ is\n\n```\n$$\\text{Res}(i)\
    \ = \\lim_{k\\to i} \\frac{Ke^{-rT-ikW}\\varphi(-k)}{2\\pi(k^2-ik)}k = \\frac{S_0e^{-qT}}{2\\\
    pi}.$\n```"
