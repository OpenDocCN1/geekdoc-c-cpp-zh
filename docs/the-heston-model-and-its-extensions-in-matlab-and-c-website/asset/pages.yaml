  md: '# # Quadratic Exponential Scheme


    The last simulation scheme we cover in this chapter is the Quadratic Exponential
    (QE) scheme developed by Andersen (2008) and adapted to the double Heston scheme
    by Guthier and Possamai (2010). It is implemented in the same manner as the univariate
    case described in Chapter 7. Denote the conditional means $m_j = E[v_{i,j+dt}|v_{i,j}]$
    and the conditional variances by $s_j^2 = Var[v_{i,j+dt}|v_{i,j}]$. Also, denote
    the ratio by $\psi_j =$


    ```

    $b_j = \frac{2}{\psi_j} - 1 + \sqrt{\frac{2}{\psi_j}\left(\(\frac{2}{\psi_j}-1\right)},
    \quad a_j = \frac{m_j}{1+b_j^2}, \quad (12.34)\n$$p_j = \frac{\psi_j-1}{\psi_j+1},
    \quad \beta_j = \frac{1-p_j}{m_j}$$

    ```


    and


    ```

    $$\psi_j^{-1}(u) = \begin{cases} 0 & \text{for } 0 \le u \le p_j \ \beta_j \ln(\frac{1-p_j}{1-u})
    & \text{for } p_j \le u \le 1. \end{cases} \quad (12.35)$

    ```


    The scheme proceeds as


    +   * Given $m_j$ and $s_j^2$, and define $\psi_j = s_j^2/m_j^2$.

    * Draw a random number $U_V \in [0,1]$.

    * If $\psi_j < \psi_j$, define $Z_V = \Phi^{-1}(U_V)$ and define $v_{i,j+dt} =
    a_j(b_j+Z_V)^2$.

    * If $\psi_j > \psi_j$, define $v_{i,j+dt} = \psi_j^{-1}(U_V)$.


    As in the univariate case, use the value of $\psi_j=1.5$ recommended by Andersen
    (2008). The QE simulation scheme for the double Heston model is implemented using
    the DHQExpSim Matlab function. This function calls the normICDFm function for
    inversion of the standard normal distribution function, which applies the algorithm
    of Wichura (1984) and leads to a considerable reduction in simulation time.


    ```

    function {S Price} = DHQExpSim(params,...)

    for i=1:N

    for t=2:T

    ml = theta + (V1(t-1,i) - theta)*exp(-kapkal*dt);

    s1 = V1(t-1,i)*square*2*exp(-kapkal*dt); ...

    phil = s1/(ml^2);

    pil = (phil-1)/(phil+1);

    und = rand(1);

    if phil < 1/2

    bl = sqrt(2/phil) - 1 + sqrt(2/phil*(phil/2-1));

    al = ml/(1+bl^2);

    Zv1 = normICDF(U1);

    ```'
