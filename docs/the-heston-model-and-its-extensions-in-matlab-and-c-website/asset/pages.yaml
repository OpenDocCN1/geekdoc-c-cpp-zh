    \ We define by $U_{ij}^k=U(S,v,t)$ the value of a European call at time $t$, when\
    \ the stock price is $S$, and the volatility is $v$. We use $N_S+1$ points for\
    \ the stock price, $N_v+1$ points for the volatility, and $N_t+1$ points for the\
    \ maturity. For concisen, sometimes we simply write $U(S,v)$ as $U_{ij}^k$.\n\n\
