    \ = Vanna1 / (2*sqrt(v01));\nVanna2p = Vanna2 / (2*sqrt(v02));\nVolgalp = Volgalp/2/sqrt(v01)\
    \ /sqrt(v01);\n      (1/4/sqrt(v01))*Volgalp\nVolga2p = (1/4/sqrt(v02))*Volga2\
    \ - Volgal2p/2/sqrt(v02)) /sqrt(v02);\n* The Double Heston PDE\nA = (rf-q)*S*Delta\n\
    + kappa1*(theta1-v01)*Vega1\n+ kappa2*(theta2-v02)*Vega2\n+ 0.5*sigma1^2*v01^2*Gamma\n\
    rho1*sigma1*v01*Vanna1\nrho2*sigma2*v02*Vanna2\n+ 0.5*sigma1^2*v1*Volgalp\n+ 0.5*sigma2^2*v2*Volga2;\\\
    PDE = Theta + A - rf*;\n```\n\nNote that we express the derivatives of the PDE\
    \ (12.20) in terms of $v_0$ rather than $v_1$, before substituting these derivatives\
    \ into the Heston PDE, as we did in Chapter 11. With the settings used to generate\
    \ Table 12.2, the code returns $1.1 \times 10^{-7}$ for the value of the PDE.\n\
    \n# PARAMETER ESTIMATION\n\nChristoffen et al. (2009) estimates the volatility\
    \ parameters $v_{01}$ and $v_{02}$ as well as spot volatilities $v_{01,t}, v_{02,t}$,\
    \ and the remaining parameters $\\Omega = \\{\\kappa_i, \theta_i, \\sigma_i, \r\
    ho_i\\}_{i=1,2}$ on a yearly basis. Their estimation work proceeds in two steps.\
    \ In the first step, a value of the fixed parameters $\\Omega = \\{\\kappa_i,\
    \ \theta_i, \\sigma_i, \rho_i\\}_{i=1,2}$ is used in their loss function on day\
    \ $t$ to obtain estimates $v_{01,t}, v_{02,t}$. This is repeated until a time\
    \ series $\\{v_{01,t}\\}$ and $\\{v_{02,t}\\}$ of spot volatilities are obtained.\
    \ In the second step, these time series are fed into the same objective function,\
    \ using options across the entire year, to obtain an estimate of $\\Omega$. The\
    \ two steps are repeated until there is no longer significant change in the value\
    \ of the objective function at the second step. This approach requires a longitudinal\
    \ set of option prices.\n\nIn this section, we employ the approach of treating\
    \ $v_{01}$ and $v_{02}$ as parameters, analog to what is done in Chapter 6 for\
    \ the univariate Heston model. Recall from that chapter that there are many possible\
    \ loss functions that can be used in the estimation, but if the intent is to minimize\
    \ the function of the market to market implied volatilities, then one example\
    \ is the IVMSE loss function\n\n> $$\\frac{1}{N}\\sum_{t,k} w_{tk} \\frac{(IV_{tk}\
    \ - IV_{ik})^2}{IV_{ik}} = (12.11)$$\n\nwhere $IV_{tk}$ and $IV_{ik}$ are the\
    \ market and implied volatilities respectively, $w_{tk}$ is an optional weight,\
    \ and $N$ is the total number of observations used in the estimation."
