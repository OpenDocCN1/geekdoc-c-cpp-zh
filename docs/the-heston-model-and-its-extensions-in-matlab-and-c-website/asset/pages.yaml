- pgno: 254
  md: "# THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nmodel. The Matlab\
    \ function PQHeston creates the polynomials $p_n, q_n, p_a, q_a$ in the same way\
    \ that was done with the PQ.m function for the Black-Scholes model in the previous\
    \ section. It is nearly identical to PQ.m, and similarly requires the coefficients\
    \ for $p_0$ and $q_0$ from Tables 8.1 and 8.2, as inputs.\n\n```\nfunction [p0\
    \ q0 pn qn ...] = PQHeston(n,N,p0,q0)\nsyms theta\nthet = [theta^7 theta^6 theta^5\
    \ theta^4 theta^3 theta^2 theta^1];\n% Generate the coefficients p0 and q0\nfor\
    \ i=1:N\npp(i,:) = sym(p0(i,:));\nqq(i,:) = sym(q0(i,:));\nend\n% Generate the\
    \ polynomials pn and qn\npn = dot(pp(n),theta);\nqn = dot(qq(n),theta);\n```\n\
    \nThe PQHeston.m function is used in the GeneratePQHeston.m Matlab file. This\
    \ file is analogous to the GeneratePQ.m file for the Black-Scholes model presented\
    \ in the previous section. The code generates symbolic representations of the\
    \ polynomials $p_n^a$ and $q_n^a$, by solving Equations (8.65) and (8.66), and\
    \ the coefficients $C_n$, by solving (8.69). For each $n$, the code works in the\
    \ same manner as in the Black-Scholes case: by generating symbolic representations\
    \ of the polynomials using the PQHeston.m function, forming two PDEs, collecting\
    \ terms common to powers of $\theta$, and solving for $p_n^*, q_n^*,$ and $C_n$.\
    \ This requires output from the collect.m function to be cut and pasted into the\
    \ Matlab file GeneratePQHeston.m itself.\n\nThe portion of the GeneratePQHeston\
    \ for $n=4$ is presented for illustration. The first part of the code uses the\
    \ PQHeston.m function to generate symbolic representations of the polynomials\
    \ $p_n^a$ and $q_n^a$, and also generates the required first-second-order derivatives\
    \ of the polynomials.\n\n```\nn = 4;\n[p0 q0 pn qn p1 q1_n1_q1 ...] = PQHeston(n,N,p0,q0);\n\
    p04 = pn;\nq04 = qn;\ndpl1_1 = diff(p1_theta,theta); % Der of p(n-1) wrt theta\n\
    qin_1 = diff(q1_theta,theta); % Der of q(n-1) wrt theta\nd2plivt_1 = diff(dp1_1,v);\n\
    ```\n\nThe second part of the code sets $C_{n-1} = C_1$ and $C_{n-2} = C_2$, takes\
    \ the volatility derivatives of both, and creates the first PDE in (8.65). Terms\
    \ common to powers of $\theta$ (namely $\theta^2$ and $\theta^0$ for $n=4$) are\
    \ collected using the collect.m function, and"
