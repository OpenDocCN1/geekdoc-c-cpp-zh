- pgno: 333
  md: '# CHAPTER 11


    # The Heston Greeks


    Abstract

    In this chapter, we present the option sensitivities—the Greeks—from the Heston
    model. We first derive analytic expressions for the most popular Greeks. We illustrate
    the Heston Greeks by comparing them to Greeks from Black-Scholes prices that are
    close to the Heston prices. We show that finite differences produce very good
    approximations to analytic Greeks, at the expense of increased computation time.
    We do this with Greeks obtained from the original Heston (1993) model, but also
    with Greeks from the Attari (2004), Lewis (2000, 2001), and Carr and Madan (1999)
    formulations. We show that fast Fourier transform (FFT) of Carr and Madan (1999)
    and that the fractional FFT of Chourdakis (2005), both covered in Chapter 5, are
    able to quickly produce a set of Greeks across a wide range of strikes, in the
    same way that these methods produce prices. Finally, we show that Greeks of American
    options can be obtained from simulation methods presented in Chapter 7, by the
    Medvedev and Scaillet (2010) expansion covered in Chapter 8, and from the explicit
    method covered in Chapter 10.


    # ANALYTIC EXPRESSIONS FOR EUROPEAN GREEKS


    The prices of European calls and puts in the Heston model are available in closed
    form. It is, therefore, possible to differentiate the call or put price and obtain
    expressions for the most of Greeks in closed form all. Recall that the call and
    put price, respectively,


    ```

    $C(K) = S_0e^{-rt}P_1 - Ke^{-rt}P_2, \quad P(K) = C(K) + Ke^{-rt} - S_0e^{-rt}
    \quad (11.1)$

    ```


    where


    ```

    $P_j = \frac{1}{2} + \frac{1}{\pi} \int_0^{\infty} \text{Re} \left[ \frac{e^{-i\phi
    \ln K} f_j(\phi; x_t, v_t)}{i\phi} \right] d\phi. \quad (11.2)$

    ```


    Hence, the sensitivity of calls and puts to a parameter or order usually involves
    first- and second-order derivatives of the in-money probabilities $P_j$


    ```

    $$\frac{\partial P_j}{\partial y} = \frac{1}{\pi} \int_0^{\infty} \text{Re} \left[
    \frac{\partial f_j}{\partial y} e^{-i\phi \ln K}}{i\phi} \right] d\phi, \quad
    \frac{\partial^2 P_j}{\partial y^2} = \frac{1}{\pi} \int_0^{\infty} \text{Re}
    \left[ \frac{\partial^2 f_j}{\partial y^2} e^{-i\phi \ln K}}{i\phi} \right] d\phi.
    \quad (11.3)$

    ```'
