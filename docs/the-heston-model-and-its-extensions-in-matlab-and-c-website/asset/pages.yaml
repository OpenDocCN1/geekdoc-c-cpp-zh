  md: "# 14\n\n# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhere\n\n\
    ```\n$g_i = -K = \\frac{\beta}{\\alpha} \\frac{b_i - \\rho\\sigma\\phi + d_i}{b_i\
    \ - \\rho\\sigma\\phi - d_i} \\frac{Q_i - d_i}{Q_i + d_i}. \\quad (1.57)$\n```\n\
    \nThe solution for $D_i$, can be written, as\n\n```\n$D_i(\\tau, \\phi) = \\frac{b_i\
    \ - \\rho\\sigma\\phi + d_i}{\\sigma^2} \\left( \\frac{1 - e^{d_i\\tau}}{1 - g_i\
    \ e^{d_i\\tau}} \\right). \\quad (1.58)$\n```\n\nThe solution for $C_i$ is found\
    \ by integrating the second equation in (1.47)\n\n```\n$C_i = \\int_0^\\tau ri\\\
    phi d\\tau + a \\left( \\frac{Q_i + d_i}{\\sigma^2} \\right) \\int_0^\\tau \\\
    left( \\frac{1 - e^{d_i\\tau}}{1 - g_i e^{d_i\\tau}} \\right) d\\tau + K_1 \\\
    quad (1.59)$\n```\n\nwhere $K_1$ is a constant, the first integral is $ri\\phi$\
    \ and the second integral can be found by substitution, using $x = exp(d_i\\tau)$,\
    \ where $dx = d_i, exp(d_i\\tau)dy$ and $dy = dx/(x)$. Equation (1.59) becomes\n\
    \n```\n$C_i = ri\\phi\\tau + a \\left( \\frac{Q_i + d_i}{\\sigma^2} \\right)_1^{\\\
    exp(d_i\\tau)} \\left( \\frac{1 - x}{1 - g_ix} \\right)_1^{\\exp(d_i\\tau)} dx\
    \ + K_1. \\quad (1.60)$\n```\n\nThe integral in (1.60) can be evaluated by partial\
    \ fractions\n\n```\n$\\int_0^{\\exp(d_i\\tau)} \\frac{1 - x}{x(1 - g_ix)} dx =\
    \ \\int_1^{\\exp(d_i\\tau)} \\frac{1 - g_i}{x - g_ix} dx \\\\n [\\ln x + \\frac{1}{g_i}\
    \ \\ln(1 - g_ix)]_1^{\\exp(d_i\\tau)} \\\\n [d_i\\tau + \\frac{1}{g_i} \\ln(1\
    \ - g_i e^{d_i\\tau})]_1^{\\exp(d_i\\tau)}. \\quad (1.61)$\n```\n\nSubstituting\
    \ the back back into (1.60), and substituting for $d_i, Q_i$, and $g_i$, produces\
    \ the solution for $C_i$\n\n```\n$C_i(\\tau, \\phi) = ri\\phi\\tau + \\frac{a}{\\\
    sigma^2} (b_i - \\rho\\sigma\\phi + d_i)\\tau - 2 \\ln \\left( \\frac{1 - g_i\
    \ e^{d_i\\tau}}{1 - g_i} \\right). \\quad (1.62)$\n```\n\nwhere $a = \\kappa\\\
    theta$. Note that we used the initial condition $C_i(0, \\phi) = 0$, which results\
    \ in $K_i = 0$. This completes the original derivation of the Heston model.\n\n\
    We use two functions to implement the model in Matlab, HestonProb.m and returns\
    \ the real part of the integrand. The function allows for the Albrecher et al.\
    \ (2007) “Little Trap” formulation for the characteristic function, which is introduced\
    \ in Chapter 2. The functions allow to price calls or puts, and allow for a dividend\
    \ yield, as explained in the following section. To conserve space parts of the\
    \ functions have been omitted."
