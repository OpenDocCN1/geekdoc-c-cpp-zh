  img_proc: true
- pgno: 74
  md: 'where i = \sqrt{-1} is the imaginary unit. See, for example, Shephard (1991).
    The original function $f$ can be recovered from $f$ via the inverse Fourier transform


    ```

    $f(x) = \frac{1}{2\pi} \int_{-\infty}^{\infty} e^{-iux}\hat{f}(u) du. \quad (3.2)

    ```


    Differentiation in the Fourier transform is an easy operation, because it is converted
    into multiplication. The Fourier transform of the derivative of $f$ is


    ```

    $f''(u) = \int_{-\infty}^{\infty} e^{iux}f''(x) dx. \quad (3.3)

    ```


    Perform integration by parts to obtain


    ```

    $\hat{f}(u) = e^{iux}f(x)|_{-\infty}^{\infty} - iu \int_{-\infty}^{\infty} e^{iux}f(x)
    dx = -iu\tilde{f}(u). \quad (3.4)

    ```


    Applying integration by parts once more that $\hat{f}''(u) = (-iu)^2\hat{f}(u)$,
    while a repeated application shows that the Fourier transform of the derivative
    of order $n$ is $(-iu)^n\hat{f}(u)$.nThe derivative of the Fourier transform is
    obtained by differentiating inside the integral of Equation (3.1)


    ```

    $\frac{df(u)}{du} = \frac{d}{du}(e^{iux}f(x))dx = \int_{-\infty}^{\infty} ix^{iux}f(x)dx
    = i\tilde{g}(u). \quad (3.5)

    ```


    where $g(x) = xf(x)$.nThe representation in (3.1) is convenient when $f(x)$ represents
    the density of a random variable $X$. In that case, the Fourier transform is the
    characteristic function for X


    ```

    $\hat{f}(u) = E[e^{iux}].

    ```


    Using Euler''s identity, $e^{ix} = \cos(ux) + i\sin(ux)$, the characteristic function
    $\varphi(u)$ can be


    ```

    $\varphi(u) = E[e^{iux}] \quad (3.6)

    ```


    The following property of the characteristic function is useful. Since $\cos(x)$
    is an even function, while $\sin(x)$ is odd, we can write


    ```

    $\varphi(-u) = E[\cos(-ux)] + iE[\sin(-ux)]\n= E[\cos ux] - iE[\sin ux] = \varphi(u)
    \quad (3.7)

    ```


    where $\bar z$ denotes the complex conjugate of $z$.'
