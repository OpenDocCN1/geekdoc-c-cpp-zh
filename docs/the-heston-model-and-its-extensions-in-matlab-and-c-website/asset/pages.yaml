    heta}^1 + q_{n-1,\theta}^2]$\n```\n\n```\n$+\\kappa(\\theta-v) \\left[2[C_{n-2}q_{n-2}^0\
    \ + q_{n-2}^1] - \\frac{1}{v}\\theta\\left[p_{n-2}^1 + 2q_{n-2,\theta}^0 - q_{n-2,\t\
    heta}^1\\right]\\right]$\n```\n\n```\n$C_{n-2}[p_{n-2}^0 + q_{n-2}^1] - \\frac{1}{v}\\\
    theta\\left[p_{n-2}^1 + q_{n-2,\theta}^0 - q_{n-2,\theta}^1]\\right]$\n```\n\n\
    ```\n$+\\sigma^2\\sqrt{v} \\left[\\frac{\theta^2}{4}C_{n-2}[2p_{n-2}^0 - p_{n-2}^1\
    \ - 2q_{n-2,\theta} - q_{n-2,\theta}^1 + q_{n-2,\theta}^2] + 2p_{n-2}^0 - p_{n-2}^1\
    \ + q_{n-2,\theta}^0 - 2q_{n-2,\theta}^0 - q_{n-2,\theta}^1 + q_{n-2,\theta}^2]\\\
    right]$\n```\n\n```\n$+\\frac{3\\theta}{4v}[2p_{n-2}^0 - p_{n-2}^1 - q_{n-2,\t\
    heta}^0 - 2q_{n-2,\theta}^0 - q_{n-2,\theta}^1 + q_{n-2,\theta}^2]$\n```\n\n(8.66)"
