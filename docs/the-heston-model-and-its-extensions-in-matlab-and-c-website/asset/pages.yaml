  md: "# 88 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe following\
    \ Matlab functions implement, respectively, the OTM Carr-Madan integrand in the\
    \ OTM price of Equation (3.56), and its damped version in (3.58). These functions\
    \ are for general values of $S_t$, so they use (3.60) for $\\zeta(v)$.\n\n```\n\
    function z = CarrMadanIntegrandOTM(u,....)\n% Calculate the integrand\nphi = HestonCF(u-i,kappa,theta,lambda,rho,sigma,tau,K,S,r,v0,Trap);\n\
    I = exp(-i*log(K)) - exp(-tau*u)\n (S*(i*u)/(1+i*u) - exp(tau)*S*(i*u+1)/(i*u))\n\
    \ phi/(u*2-i);\n% Return the real part\nz = real(i);\n```\n\n```\nfunction y =\
    \ CarrMadanDampedIntegrandOTM(v, alpha,....)\n% Calculate z(v-ia)\nu = v-alpha;\n\
    phi = HestonCF(u-i,....)\nzi = exp(-i*tau)*(S*(i*u+1)/(1+i*u)) - ...;\n% Calculate\
    \ z(v+ia)\nclear u phi\nu = v+alpha;\nphi = HestonCF(u,....)\nz2 = exp(-r*tau)*(S*(i*u+1)/(1+i*u))\
    \ - ...;\n% Calculate the Fourier transform of y\ny = exp(-i*u*log(K)) * (zl -\
    \ z2)/2;\n% Return the real part only\ny = real(y);\n```\n\nThese functions are\
    \ passed to the pricing function HestonPriceLaguerre.m, in which this version\
    \ accepts the OTM integrand. Only the relevant portion of the function is presented\
    \ here.\n\n```\nfunction y = HestonGaussLaguerre(Integrand,....)\nelif strcmp(Integrand,'Carr'Madan')\
    \ % Carr-Madan\nfor k=1:length(x)\nint1(k) = w(k)*CarrMadanIntegrandOTM(x(k),....);\n\
    end\n% The Option Price\ny = sum(int1)/pi;\nelif strcmp(Integrand,'CarrMadanDamped')\n\
    % Carr-Madan damped\nfor k=1:length(x)\nint1(k) = w(k)*CarrMadanDampedIntegrandOTM(x(k),....);\n\
    end\n% The Option Price\ny = 1/sinh(alpha*log(K)) * sum(int1)/pi;\nend\n```"
