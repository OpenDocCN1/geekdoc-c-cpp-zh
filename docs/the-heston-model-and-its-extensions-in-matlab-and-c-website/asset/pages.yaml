  md: "# CHAPTER 6\n\n# Parameter Estimation\n\n# Abstract\n\nAll of the pricing methodologies\
    \ we have covered have assumed the Heston model parameters to be given. In this\
    \ chapter, we describe how to estimate these parameters. We first present the\
    \ most common estimation method, the loss function approach, in which parameters\
    \ are selected so that the quoted option prices are as close as possible to the\
    \ model option prices. Alternatively, quoted and implied volatilities can be used\
    \ instead of prices. Next, we summarize the Nelder and Meander (1965) minimization\
    \ algorithm and show how to code it in C#. Then we describe the “Smart Parameter”\
    \ method of Gauthier and Rivalle (2009) to select starting values and the Strike-Vector\
    \ Computation of Kilin (2007), which constructs the loss function in a way that\
    \ greatly speeds up the estimation. We then present the Differential Evolution\
    \ algorithm, which has been shown by Vollrath and Wendland (2009) Finally, we\
    \ present a method due to Atiya and Wall (2009) to obtain maximum likelihood estimates\
    \ of the Heston parameters. Throughout this chapter, the Heston parameters are\
    \ represented as the vector $\\Theta = (k, \theta, \\sigma, v_0, \rho)$, and their\
    \ corresponding estimates, as $\\Theta$.\n\n# ESTIMATION USING LOSS FUNCTIONS\n\
    \nThe most popular way to estimate the parameters of the Heston model is with\
    \ loss functions. This method use the error over quoted market prices and model\
    \ functions, or between market and implied volatilities. The parameter estimates\
    \ $\\Theta$ are those values which minimize the value of the loss function, so\
    \ that the model prices or implied volatilities are as close as possible to their\
    \ market counterparts. A constrained minimization algorithm must be used in this\
    \ regard so that the constraints on the parameters\n\n```\n$\\kappa > 0, \\ \\\
    theta > 0, \\ \\sigma > 0, \\ v_0 > 0, \\ \\rho \\in [-1, +1] \\eqno (6.1)\n```\n\
    \nare respected. Since loss functions use option prices (or implied volatility\
    \ derived from these prices) as inputs, they produce estimates of the risk-neutral\
    \ parameters of the Heston model.\n\nSuppose we have a set of $N_T$ maturities\
    \ $\tau_t (t = 1, \\dots, N_T)$ and a set of $N_K$ strikes $K_k (k = 1, \\dots,\
    \ N_K)$. For each maturity-strike combination $(\tau_t, K_k)$, we have a market\n\
    \nThe Heston Model and Its Extensions in Matlab and C#. Gabriel Rouah.\n©2013\
    \ Facebook Rouah. Published by John Wiley & Sons, Inc.\n\n147"
