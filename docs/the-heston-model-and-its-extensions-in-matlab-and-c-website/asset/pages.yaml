    function y = HestonGaussLaguerre(Integrand,...)

    if strcmp(Integrand, ''Heston'') % Heston formulation

    for k=1:length(x)

    int1(k) = w(k)*HestonIntegrand(x(k),...,1)

    int2(k) = w(k)*HestonIntegrand(x(k),...,2)

    end

    % The in-moneyness probabilities P1 and P2

    P1 = 1/2 + 1/pi*sum(int1)

    P2 = 1/2 - 1/pi*sum(int2)

    % The Call Price

    Y = S*exp(-q*T) - K*exp(-r*T)*P2

    elif strcmp(Integrand,''CarrMadan'') % Carr-Madan

    for k=1:length(x)

    int1(k) = w(k)*CarrMadanIntegrand(x(k),...)

    end

    % The Call Price

    y = exp(-alpha*log(K))*sum(int1)/pi;

    ```


