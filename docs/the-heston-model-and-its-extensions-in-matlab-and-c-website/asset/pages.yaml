  md: "# 20 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nget $E[v_t|v_0]=v_0$,\
    \ which is time independent. This will produce volatility that is constant. However,\
    \ setting $\\sigma=0$ and $\theta=v_0$ in the Heston model leads us to expect\
    \ the same price as that produced by the Black Scholes model, with $\\sigma_{BS}=\\\
    sqrt{v_0}$, as the Black Scholes implied volatility. Indeed, substituting $\\\
    sigma=0$ and $\theta=v_0$ into the Heston PDE (1.24) with $\\lambda=0$ produces\
    \ the Black-Scholes PDE in (1.75) with $\\sigma_{BS}=\\sqrt{v_0}$. Consequently,\
    \ the Heston price under these parameter values will be the Black-Scholes model.\n\
    \nTo implement the Black-Scholes model as a special case of the Heston model,\
    \ we cannot simply substitute $\\sigma=0$ into the pricing functions, which will\
