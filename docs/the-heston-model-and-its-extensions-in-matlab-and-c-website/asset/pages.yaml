    # THE REPRESENTATION FOR OTM OPTIONS


    Carr and Madan (1999) emphasize the fact that, for short maturities, the call
    value approaches its intrinsic value $(S_t - K)^+$, and this causes the integrand
    in the Fourier inversion in Equation (3.44) to be highly oscillatory and, therefore,
    difficult to integrate. This was illustrated with figures in Chapters 1 and 2.
    Carr and Madan (1999) define $z(k)$ as the $t-t$ price of out-of-the-money (OTM)
    calls and puts with strike $K = e^k$. For convenience, they assume that $S_t =
    1$, but their argument can be easily generalized to other values of $S_t$, as
    shown in the following section. The regions $K < S_t, $ and $K > S_t$ correspond
    to OTM puts and calls, respectively. Hence, the price is


    ```

    $z(k) = \begin{cases} \text{OTM Put Price when } k < 0 \ \text{OTM Call Price
    when } k > 0 \end{cases} \n= e^{-r\tau} \int_{-\infty}^{\infty} [(e^k - e^x)^+
    + (e^x - e^k)^+] q(x) dx \quad (3.51) \n= e^{-r\tau} \int_{-\infty}^{0} (e^k -
    e^x)\mathbf{1}_{k<0} q(x) dx + e^{-r\tau} \int_{0}^{\infty} (e^x - e^k)\mathbf{1}_{k>0}
    q(x) dx$

    ```


    with Fourier transform


    ```

    $$\hat{z}(v) = e^{-r\tau} \int_{-\infty}^{\infty} e^{ivk} z(k) dk \n= e^{-r\tau}
    \int_{-\infty}^{0} e^{ivk} (e^k - e^x)\mathbf{1}_{k<0} q(x) dxdk \n+ e^{-r\tau}
    \int_{0}^{\infty} e^{ivk} (e^x - e^k)\mathbf{1}_{k>0} q(x) dxdk \n= e^{-r\tau}
    \int_{-\infty}^{0} e^{ivk} (e^k - e^x)q(x)dx + e^{-r\tau} \int_{0}^{\infty} e^{ivk}
    (e^x - e^k)q(x)dx. (3.52)$

    ```


    Now, reverse the order of integration in (3.52) to obtain


    ```

    $$\hat{z}(v) = e^{-r\tau} \int_{-\infty}^{\infty} q(x) \int_{-\infty}^{x} e^{iv(k+x)}
    dkdx \n++ e^{-r\tau} \int_{0}^{\infty} q(x) \int_{x}^{\infty} e^{iv(k+x)} dkdx.
    (3.53)$

    ```


    It is evident that the two integrals in (3.53), for which $k$ is the integration
    variable, are identical except for opposite signs. Indeed, we can reverse the
    limits of'
