    # AMERICAN GREE USING THE EXPLICIT METHOD


    Recall from Chapter 10 that when the Heston PDE is solved with finite differences,
    a matrix in the stock price and volatility dimensions contains a complete set
    of option prices. Hence, the matrix shifted values of the call in price and volatility,
    and finite differences can be readily obtained to obtain the Greeks. This requires
    two-dimensional interpolation using the Matlab function interp2m to obtain the
    call prices with shifted values. In this manner, all the Greeks representing sensitivities
    to S and v can be obtained, namely delta, gamma, vega1, vanna, and volga. The
    following code shows how this is done in Matlab for European options, using the
    explicit method on a non-uniform grid. The code uses the HestonExplicitNonUniformGrid.m
    presented in Chapter 10 to approximate the Heston PDE over the two-dimensional
    grid.


    ```

    PutCall = ''P'';

    EuroAmer = ''E'';

    [u] = HestonExplicitNonUniformGrid(...,PutCall,EuroAmer);

    PDEPrice = interp2(V,S,U,V0,SO);

    % Delta and Gamma

    dS = 1;

    ```'
