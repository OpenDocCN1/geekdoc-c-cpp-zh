    **FIGURE 4.1** Real Part of the Put Payoff Transform


    method Lewis derives the fundamental transform for a general class of stochastic
    volatility models, but we restrict his derivation to the Hester model.

    Theeston part partial differential equation (PDE) for the value of the derivative,
    $U=U(x,t)$, was derived in Chapter 1, reproduced here with a continuous dividend
    yield, $q$, and is re-arranged as


    ```

    $$\frac{\partial U}{\partial t} -rU+\left(r-q-\frac{1}{2}v\right)\frac{\partial
    U}{\partial x\|+\frac{1}{2}v\frac{\partial^{2} U}{\partial x^{2}}\\n+\left[\kappa(\theta-v)-\lambda
    v\right]\frac{\partial U}{\partial v}-\sigma^{2}v\frac{\partial^{2} U}{\partial
    v^{2}}+\rho\sigma v\frac{\partial^{2} U}{\partial v\partial x}\right]$ (4.4)

    ```


    To express this PDE in terms of the Fourier transform $\hat{U}$, differentiate
    (4.1) with respect to $t$ and apply (4.4). This produces


    ```

    $$\frac{\partial \hat{U}}{\partial t}=\int_{-\infty}^{\infty}e^{ikx}\left\{\frac{\partial
    \hat{U}}{\partial t}\right\\}dx=\int_{-\infty}^{\infty}e^{ikx}\left\{-rU+\left(r-q-\frac{1}{2}v\right)\frac{\partial
    \hat{U}}{\partial x}\right\\}dx$

    ```


    ```

    $+\frac{v}{2}\frac{\partial^{2} U}{\partial x^{2}}+\left[\kappa(\theta-v)-\lambda
    v\right]\frac{\partial U}{\partial v}-\sigma^{2}v\frac{\partial^{2} U}{\partial
    v^{2}}+\rho\sigma v\frac{\partial^{2} U}{\partial v\partial x}\right]dx.$ (4.5)

    ```'
