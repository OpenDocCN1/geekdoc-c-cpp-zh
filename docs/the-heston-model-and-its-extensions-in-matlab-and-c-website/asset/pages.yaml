  md: "# 362 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwith the original\
    \ formulation or the “Little Trap” formulation, the characteristic\nfunction is\n\
    \n$f(\\phi; x_s, v_{1,j}, v_{2,j}) = \\exp(A(\\tau, \\phi) + i\\phi x_s + B_1(\\\
    tau, \\phi)v_{1,j} + B_2(\\tau, \\phi)v_{2,j}) \\quad (12.12)$\n\nwhere $x$, is\
    \ the log price of the underlying, and $v_{1,j}$ and $v_{2,j}$ are the initial\n\
    variances, which are estimated as parameters $v_{0,1}$ and $v_{0,2}$, as in the\
    \ univariate\ncase. The call price is obtained in the usual function\n\n$C(K)\
    \ = Se^{-q\\tau}P_1 - Ke^{-r\\tau}P_2 \\quad (12.13)$\n\nwhere\n\n$P_1 = \\frac{1}{2}\
    \ + \\frac{1}{\\pi} \\int_0^{\\infty} Re \\left[ \\frac{\\e^{-i\\phi\\tau} K(\\\
    phi - i; x_s, v_{1,j}, v_{2,j})}{i\\phi S\\e^{-i\\phi\\tau}} \\right] d\\phi,\
    \ \\quad \\quad (12.14)\\n$P_2 = \\frac{1}{2} + \\frac{1}{\\pi} \\int_0^{\\infty}\
    \ Re \\left[ \\frac{\\e^{-i\\phi\\tau} K(\\phi; x_s, v_{1,j}, v_{2,j})}{i\\phi}\
    \ \\right] d\\phi.$\n\nNote that to allow for the stock to pay a continuous dividend\
    \ $q$, in the first\nterm of the expression for $A(\\tau, \\phi)$ we use $r-q$\
    \ rather than $r$ alone. Similarly, the\first term of the call price in Equation\
    \ (12.13) is $Se^{-q\\tau}P_1$, and in the denominator of\nP_1$ in (12.14), we\
    \ use $e^{(r-q)\\tau}$ rather than $e^{r\\tau}$.\nP_2$ uses $e^{-r\\tau}$.\nImplementing\
    \ the Heston model is only slightly more complicated\nimplementing its univariate\
    \ counterpart. In the computer code, we order the\nparameters as\n\n$\\Theta =\
    \ (K_1, \\theta_1, \\kappa_1, v_1, \\rho_1, K_2, \\theta_2, \\sigma_2, v_2, \\\
    rho_2) \\ \\quad (12.15)$\n\nThe Matlab file DoubleHestonCF.m returns the characteristic\
    \ function for the\ndouble Heston model.\n\n```\nfunction y = DoubleHestonCF(phi,...);\n\
    if trap==1\n  d1 = sqrt((kappa-rho1*sigma1*i*phi)+phi)*2 + ...);\n  d2 = sqrt((kappa-rho2*sigma2*i*phi)+phi)*2\
    \ + ...);\n  G1 = (kappa-rho1*sigma1*i*phi) - ...;\n  G2 = (kappa-rho2*sigma2*i*phi)\
    \ - ...;\n  B1 = (kappa-rho1*sigma1*i*phi)*(1-exp(-d1*tau)) - ...;\n  B2 = (kappa-rho2*sigma2*i*phi)*(1-exp(-d2*tau))\
    \ - ...;\n  X1 = (1-G1)*exp(-d1*tau)/(1-G1);\n  X2 = (1-G2)*exp(-d2*tau)/(1-G2);\n\
    \  A = (rf-q)*phi*i*tau + ...;\nelse\n  ...;\ny = exp(A + i*phi*x0 + B1*v01 +\
    \ B2*v02);\n```\n\nThe following function calculates the call price using trapezoidal\n\
    rule, and returns either the call price, or by put-call parity."
