  md: "# The Heston Model for European Options\n\nThe consolidated form produces exactly\
    \ the prices for the call and the put, but requires roughly one-half of the computation\
    \ time only.\n\n# BLACK-SCHOLES AS A SPECIAL CASE\n\nWith a little manipulation,\
    \ it is straightforward to show that the Black-Scholes model is nested inside\
    \ the Heston model. The Black-Scholes model assumes the dynamics for the underlying\
    \ price $S$, under the risk-neutral measure Q\n\n```\n$dS_t = rS_t + \\sigma_{BS}S_t\
    \ dW_t,$$\n```\n\nIt is shown in many textbooks, such as by Hull (1996) or Chriss\
    \ (1996) that (1.72) can be solved for the spot price $S_t$. This is in two steps.\
    \ First, apply Ito’s lemma to obtain the process for $d\\ln S_t$, which produces\
    \ a stochastic process that is no longer an SDE since its drift and volatility\
    \ no longer depend on $S_t$. Second, integrate the stochastic process to produce\n\
    \n```\n$S_t = S_0 \\exp((r - \\frac{1}{2}\\sigma_{BS}^2)t + \\sigma_{BS}W_t)$.\n\
    ```\n\nThis implies that, at time $t$, the natural logarithm of the stock price\
    \ at expiry $S_T$ is distributed as a normal variable with mean $\\ln S_t + (r\
    \ - \\frac{1}{2}\\sigma_{BS}^2)\\tau$ and variance $\\sigma_{BS}^2\\tau$, where\
    \ $\tautau T-t$ is the time to expiry. Consequently, the characteristic function\
    \ of $\\ln S_T$ in the Black-Scholes model\n\n```\n$E[e^{i\\phi\\ln S_T}] = \\\
    exp\\left(i\\phi[\\ln S_t + (r - \\frac{1}{2}\\sigma_{BS}^2)\\tau] - \\frac{1}{2}\\\
    phi^2\\sigma_{BS}^2\\tau\\right).$$\n```\n\nThe Black-Scholes price is given by\n\
    \n```\n$$\\frac{\\partial U}{\\partial t} + \\frac{1}{2}\\sigma_{BS}^2S^2\\frac{\\\
    partial^2 U}{\\partial S^2} + rS\\frac{\\partial U}{\\partial S} - rU = 0.$\n\
    ```\n\nThe Black-Scholes call price is given by\n\n```\n$C_{BS}(S,t) = S\\Phi(d_1)\
    \ - Ke^{-r\\tau}\\Phi(d_2)$\n```\n\nwith\n\n```\n$d_1 = \\frac{\\ln(S/K) + (r\
    \ + \\frac{1}{2}\\sigma_{BS}^2)\\tau}{\\sigma_{BS}\\sqrt{\\tau}}, d_2 = \\frac{\\\
    ln(S/K) + (r - \\frac{1}{2}\\sigma_{BS}^2)\\tau}{\\sigma_{BS}\\sqrt{\\tau}} =\
    \ d_1 - \\sigma_{BS}\\sqrt{\\tau}$\n```\n\nwhere $\\Phi(X)$ is the standard normal\
    \ cumulative distribution function. The volatility $\\sigma_{BS}$ is assumed to\
    \ be constant.\n\nIf we set $\\sigma = 0$, the volatility of variance parameter\
    \ in the Heston model, then the Brownian component of the variance process in\
    \ Equation (1.11) drops out. Consequently, from (1.11) we obtain volatility that\
    \ is time-varying, but deterministic. If we further set $\\theta = v_0$, then\
    \ from (1.11)"
