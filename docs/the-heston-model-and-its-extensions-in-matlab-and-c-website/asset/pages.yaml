  md: "# The Double Heston Model\n\nCase 1, $v_t > K_2$\nUpdating to $v_{t+dt}$ requires\
    \ two steps. In the first step, we simulate a discrete random variable $Y \\in\
    \ \\{0, \\sqrt{3}, -\\sqrt{3}\\}$ with probabilities 2/3, 1/6, and 1/6, respectively.\
    \ In the second step, we update to $v_{t+dt}$\n\n```\n$v_{t+dt} = \\exp(-\\kappa\
    \ \\, dt/2) \\left( \\kappa \\theta - \\frac{\\sigma^2}{4} \\right) \\Psi + e^{-\\\
    kappa \\, dt/2} v_t + \\frac{\\sigma}{2} \\sqrt{dt} Y^2\\n + \\left( \\kappa \\\
    theta - \\frac{\\sigma^2}{4} \\right) \\Psi. \\quad (12.30)$\n```\n\nCase 2, $v_t\
    \ \\le K_2$\nDenote the first two moments of $v_{t+dt}$ conditional on $v_t$,\
    \ by\n\n```\n$u_1 = E[v_{t+dt}|v_t]\\nu u_2 = E[v_{t+dt}^2|v_t].$\n```\n\nDenote\
    \ the quantity $\\pi$\n\n```\n$\\pi = \\frac{1}{2} - \\frac{1}{2} \\sqrt{1 - \\\
    frac{u_1^2}{u_2}}$\n```\n\nIn the first step, we simulate a uniform random variable\
    \ $U$ on (0, 1). In the second step, we update to $v_{t+dt}$ by comparing $U$\
    \ to $\\pi$ that\n\n```\n$v_{t+dt} = \\frac{u_1}{2\\pi} \\quad \\text{if } U \\\
    le \\pi\\nu v_{t+dt} = \\frac{u_1}{2(1-\\pi)} \\quad \\text{if } U > \\pi. \\\
    quad (12.31)$\n```\n\nThe CIRM function calculates the moments $u_1$ and $u_3$.\
    \ The algorithm to update $v_i$ is implemented with the Matlab function AlfonsivSim.m.\
    \ These functions are identical to those presented in Chapter 7. Please refer\
    \ to chapter for details.\nThe Alfonsiv function is used in the DHEEulerSim.m\
    \ function, which simulates the stock price in accordance with the Predictor-Corrector\
    \ scheme in Equation (12.26), simulates the variance using the Euler scheme under\
    \ full truncation in (12.27) or (12.31), and returns the simulated value of the\
    \ call or put. To conserve space, parts of the function are omitted.\n\n```\n\
    function [S ... Price] = DHEEulerAlfonsiSim(scheme,...)\nS(1,:) = S0\nV1(1,:)\
    \ = v01\nV2(1,:) = v02\nL1=1\nfor t=2:T\n  t=2*dt;\n  if strcmp(scheme, 'Euler')\n\
    \    % Generate two independent N(0,1) variables\nG1 = randn(1);\nG2 = randn(1);\n\
    ```"
