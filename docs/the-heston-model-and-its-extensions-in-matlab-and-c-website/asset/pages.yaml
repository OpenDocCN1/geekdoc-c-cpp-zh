  md: "# The Heston Model for European Options\n\nwhere M and N are constants. The\
    \ solution to the Riccati equation is therefore\n\n$y(t) = \\frac{M\\alpha e^{\\\
    alpha t} + N\\beta e^{\beta t}}{M e^{\\alpha t} + N e^{\beta t}} R(t)$\n\n# Solution\
    \ of the Heston Riccati Equation\n\nFrom Equation (1.47), the Heston Riccati equation\
    \ can be written\n\n```\n$$\\frac{\\partial D_i}{\\partial \\tau} = P_i - Q_jD_i\
    \ + RD_j^2$ (1.51)\n```\n\nwhere\n\n```\n$P_i = u_i\\phi - \\frac{1}{2}\\phi^2,\
    \ \\quad Q_i = b_i - \\rho\\phi_i, \\quad R = \\frac{1}{2}\\sigma^2.$ (1.52)\n\
    ```\n\nThe corresponding second-order ODE is\n\n```\n$w' + Q_jw' + P_iRw = 0$\
    \ (1.53)\n```\n\nso that $D_i = -\\frac{1}{R}\\frac{w'}{w}$. The auxiliary equation\
    \ is $r^2 + Q_jr + PR = 0$, which has roots\n\n```\n$$\\alpha_j = \\frac{-Q_j\
    \ + \\sqrt{Q_j^2 - 4PR_j}}{2} = \\frac{-Q_j + d_j}{2}$\n$\\beta_j = \\frac{-Q_j\
    \ - \\sqrt{Q_j^2 - 4PR_j}}{2} = \\frac{-Q_j - d_j}{2}$\n```\n\nwhere\n\n```\n\
    $d_j = \\alpha_j - \\beta_j = \\sqrt{(\rho\\phi_i - b_i)^2 - \\sigma^2(2u_i\\\
    phi - \\phi^2)}$$ (1.54)\n```\n\nFor notational simplicity, we sometimes omit\
    \ the '$j$’ subscript on some of the variables. The solution to the Heston Riccati\
    \ equation is\n\n```\n$D_i = -\\frac{1}{R}\\frac{w'}{w} = -\\frac{1}{R}(\\frac{M\\\
    alpha e^{\\alpha t} + N\\beta e^{\beta t}}{Me^{\\alpha t} + Ne^{\beta t}}) = -\\\
    frac{1}{R}(\\frac{Kae^{\\alpha t} + \\beta e^{\beta t}}{Ke^{\\alpha t} + e^{\b\
    eta t}})$ (1.55)\n```\n\nwhere $K=M/N$. The initial condition $D_i(0,\\phi)$ implies\
    \ that when $\\tau=0$ is substituted in (1.55), the numerator $K\\alpha + \\beta\
    \ = 0$, from which $K=-\beta/\\alpha$.\n\nThe solution for $D_j$ becomes\n\n```\n\
    $D_j = -\\frac{\\beta}{R}(\\frac{-e^{d_j\\tau}}{-g_je^{d_j\\tau}+e^{\\tau}}) =\
    \ \\frac{\\beta}{R}(\\frac{1-e^{d_j\\tau}}{1-ge^{d_j\\tau}})\\n= \\frac{Q_j+d_j}{2R}(\\\
    frac{1-e^{d_j\\tau}}{1-g_je^{d_j\\tau}})$ (1.56)\n```"
