- pgno: 252
  md: "# 244 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nNote that the\
    \ homogeneous parts of Equations (8.65) and (8.66) are identical to that for the\
    \ Black-Scholes case, combining these two parts produces (8.48) from the previous\
    \ section.\n\nEquations (8.65) and (8.66) form the system of equations to be solved,\
    \ done in a manner analogous to that used to solve the two equations in (8.50)\
    \ for the Black-Scholes American put. For each $\\pi_n$, the PDE in (8.65) is\
    \ solved for $p_n^a$ as all other quantities known. Similarly, the PDE in (8.66)\
    \ is solved for $q_n^a$ as all other quantities are known. The polynomials $p_n^a$\
    \ and $q_n^a$ are obtained by recursion and are identical to those in Tables 8.1\
    \ and 8.2, respectively. The polynomials $p_n^*$ are identical to those in (8.46),\
    \ reconstructed here for convenience\n\n```\n$p_n^\theta(\\theta, v) = \\pi_n^\t\
    heta + \\pi_n^{\theta-2} + \\pi_n^{\theta-4} + \\dots \\quad (8.67)$\n```\n\n\
    The polynomials $q_n^\theta$, on the other hand, now take the form\n\n```\n$q_n^\t\
    heta(\\theta, v) = x_{n1}^1\\theta^{3n-5} + x_{n2}^2\\theta^{3n-7} + x_{n3}^3\\\
    theta^{3n-9} + x_{n4}^4\\theta^{3n-11} + \\dots \\quad (0.68)$\n```\n\nFor example\n\
    \n```\n$q_4^a = x_{41}^1\\theta^{10} + x_{42}^2\\theta^8 + x_{43}^3\\theta^6 +\
    \ x_{44}^4\\theta^4, \\nq_5^a = x_{51}^1\\theta^{12} + x_{52}^2\\theta^{10} +\
    \ x_{53}^3\\theta^8 + x_{54}^4\\theta^6 + x_{55}^5\\theta^2.$\n```\n\nOnce the\
    \ polynomials $p_n^a$, $q_n^a$, and $q_n^\theta$ have been obtained, the coefficients\
    \ $C_n(v)$ are constructed by evaluating Equation (8.55) at $\theta = y$ and substituting\
    \ a Taylor series expansion for $\\exp(\\sqrt{v}y)$. After canceling $\tau^{n/2}$\
    \ from both sides, this produces the equation, which is readily solved for $C_n$\n\
    \n```\n$C_n(v)[p_n^a(y)\\Phi_0 + q_n^a(y)\\Phi_0] + p_n^\theta(y,v)\\Phi_0 + q_n^\t\
    heta(y,v)\\Phi_0 = \\frac{(-1)^{n+1}K}{n!}\\tau^{n/2}y^n. \\quad (8.69)$\n```\n\
    \nIn the Black-Scholes case the coefficients $C_n$ are evaluated at $\theta =\
    \ y$. To obtain the American put price $P(\\theta, \\tau, v)$, we first find the\
    \ polynomials $p_n^0$, $q_n^0$, $p_n^*$ and $q_n^*$ and the coefficients $C_n(v)$.\
    \ We then find the barrier $\\tilde{y}$\n\n```\n$\\tilde{y} = \\arg\\max_{y\\\
    geq 0} P(\\theta, \\tau, v, y) \\quad (8.70)$\n```\n\nwhere $P(\\theta, \\tau,\
    \ v)$ is $P(\\theta, \\tau, v) $ in Equation (8.54) but with the extra argument\
    \ to emphasize the dependence of $P(\\theta, \\tau, v)$ on $y$ through $C_n(v)$.\
    \ The first approximation of Medvey and Scailier (2010) for the price of an American\
    \ put, $P(\\theta, \\tau, v)$, given by $p_n^0$, $q_n^0$, $p_n^*$, $q_n^*$, and\
    \ $C_n$ is analogous to that in the Black-Scholes case.\n\nApproximation 1:\n\n\
    Construct $P(\\theta, \\tau, v)$ using (8.54) with $C_n = C_n(v, y)$.\n\nFind\
    \ $\\tilde{y}$ using (8.70), under the constraint $\\tilde{y} \\geq \\theta$.\n\
    \nUse $C_n = C_n(v, \\tilde{y})$ in $P(\\theta, \\tau, v)$ to find the price."
  merge: -1
  img_proc: true
- pgno: 253
  md: "Medvedev and Scaillet (2010) point out that the case of an infinite barrier,\n\
    tilde{y} = \\infty$, corresponds to a European put. They recommend obtaining the\
    \ price of\nan American put as the European put obtained using a closed-form,\
    \ such as those\ncovered in Chapters 1, 3, or 4, plus the early exercise premium.\
    \ Their second\napproximation for the American put is, therefore, the control\
    \ variate price.\n\n# Approximation 2:\n\nFind the price of the European put $P(K)$\
    \ using a closed-form solution.\nFind $\tilde{y}$ as in the first approximation.\n\
    \nObtain the early exercise premium as $\\varepsilon = P(\theta, \tau, v, \tilde{y})\
    \ - P(\theta, \tau, v, \\infty)$.\nObtain the American put price as $P_A(K) =\
    \ P(K) + \\varepsilon$.\n\nWe illustrate the maximization problem in Equation\
    \ (8.70) in Figure 8.3 by\nplotting $P(\theta, \tau, v, y)$ over various values\
    \ of $y$, using the settings of Clarke and Parrot\n(1999) for the spot prices\
