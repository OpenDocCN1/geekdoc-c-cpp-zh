  md: "$\tau = T - t$ is the time remaining until expiry. Moreover, the coefficients\
    \ of the characteristic function can be obtained by solving the system of Riccati\
    \ equations\n\n```\n$\\frac{\\partial A}{\\partial t} = -K_0^T\\beta - \\frac{1}{2}\\\
    beta^T H_0\\beta$\\n$\\frac{\\partial B}{\\partial t} = -K_1^T\\beta - \\frac{1}{2}\\\
    beta^T H_1\\beta \\quad (9.16)\\n$\\frac{\\partial C}{\\partial t} = -K_2^T\\\
    beta - \\frac{1}{2}\\beta^T H_2\\beta$\n```\n\nsubject to the boundary conditions\
    \ $B(0) = i\\phi_1$, $C(0) = i\\phi_2$, and $A(0) = 0$, where $\beta^T = (B, C)$.\
    \ After substituting, we produce the set of differential equations\n\n```\n$\\\
    frac{\\partial A}{\\partial t} = -rB - \\kappa C$\\n$\\frac{\\partial B}{\\partial\
    \ t} = 0 \\quad (9.17)\\n$\\frac{\\partial C}{\\partial t} = -\\frac{1}{2}\\sigma^2\
    \ C - (\\rho\\sigma B - \\kappa)C - \\frac{1}{2}B^2 + \\frac{1}{2}B$\n```\n\n\
    For the Honest model, it is straightforward to find the equations in (9.17) and\
    \ their boundary conditions directly, without using of Duffie, Pan, and Singleton\
    \ (2000). First, note that, in the univariate case, at expiry $(\\tau=0)$ the\
    \ expected value in Equation (9.11) appears, since $(x_T, v_T)$ is known. Hence,\
    \ at expiry, $f(\\phi_1, \\phi_2; x, v)$ in (9.15) must be equal to\n\n```\n$f(\\\
    phi_1, \\phi_2; x, v) = \\exp(i\\phi_1 x_T + i\\phi_2 v_T). \\quad (9.18)\n```\n\
    \nThis implies the following initial conditions\n\n```\n$A(0, \\phi_1, \\phi_2)\
    \ = 0, B(0, \\phi_1, \\phi_2) = i\\phi_1, C(0, \\phi_1, \\phi_2) = i\\phi_2. \\\
    quad (9.19)\n```\n\nRecall from Chapter 1 the partial differential equation (PDE)\
    \ for the second characteristic function $f_2$, which we denote simply by f\n\n\
    ```\n$\\frac{\\partial f}{\\partial \\tau}+\\rho\\sigma v\\frac{\\partial f}{\\\
    partial x}+\\frac{1}{2}\\frac{\\partial^2 f}{\\partial x^2}+\\frac{1}{2}\\sigma^2\
    \ v^2\\frac{\\partial^2 f}{\\partial v^2}\\n+( (\r-\\frac{1}{2}v)\\frac{\\partial\
    \ f}{\\partial x}+\\kappa(\\theta-v)\\frac{\\partial f}{\\partial v} = 0. \\quad\
    \ (9.20)\n```\n\nNote that we have substituted for $u_2 = -\\frac{1}{2}, a = \\\
    kappa\\theta$, and $b_2 = \\kappa + \\lambda$ with $\\lambda = 0$. The PDE in\
    \ (9.20) holds for the bivariate characteristic function. We proceed exactly as\
    \ in Chapter 1, by obtaining the derivatives of $f(\\phi_1, \\phi_2; x, v)$ in\
    \ (9.15)"
