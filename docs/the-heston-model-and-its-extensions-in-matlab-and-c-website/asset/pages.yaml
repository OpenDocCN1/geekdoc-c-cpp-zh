- pgno: 158
  md: "# Parameter Estimation\n\nThe main disadvantage of Equation (6.4) is that it\
    \ is numerically intensive. Indeed, at each iteration of the optimization, we\
    \ must first obtain Heston $C_{ik}$ and then apply a root-finding algorithm such\
    \ as the bisection algorithm to extract the implied volatility $IV_{ik}$ from\
    \ $C_{ik}$ so that the quantity $(IV_{ik} - IV_{ik})^2$ can be constructed. Another\
    \ remedy is to use the approximated implied volatility Lewis (2000) Series II\
    \ expansion described in Chapter 4, and instead of $IV_{ik}$ This allows us to\
    \ bypass the bisection algorithm entirely. Another remedy is to use the loss function\
    \ described in Christoffersen et al. (2009), which serves as an approximation\
    \ to the IVMSE in (6.4). It uses the reciprocal of the squared Black-Scholes vega\
    \ as the weight in (6.2). The parameter estimates from their method are therefore,\
    \ based on the loss function\n\n```\n$$\\sum_{i,k} \\frac{(C_{ik} - C_{ik}^*)^2}{BSVega_{ik}^2}\
    \ = (6.5)$\n```\n\nwhere BSVega is the Black-Scholes sensitivity of the option\
    \ price with respect to the market implied volatility $IV_{ik}$, evaluated at\
    \ the maturity $\tau$, and the strike $K$\n\nwith\n\n```\n$d_{ik} = \\frac{\\\
    log(S/K_k) + (r - q + IV_{ik}^2/2)\\tau}{IV_{ik}\\sqrt{\tau}}$\n```\n\nand $n(x)\
    \ = \\exp(-x^2/2)/sqrt{2\\pi}$ is the standard normal density. The chief advantage\
    \ of loss functions based on the approximations of Lewis (2000) or Christoffersen\
    \ et al. (2009) is that a considerable amount of computation time is saved, albeit\
    \ at the expense of precision in the parameter estimates.\nEstimation of the Heston\
    \ parameters by loss functions has been used by Bakshi, Cao, and Chen (1997),\
    \ Bams et al. (2009), Christoffersen and Jacobs (2004), Mikhailov and Nogel (2003),\
    \ and many others. There is no consensus on which loss function is the best, but\
    \ Christoffersen and Jacobs (2004) point out that the same loss function is used\
    \ for parameter estimation and evaluating model fit.\nThe Matlab function HestonObjFun.m\
    \ implements the loss functions covered in this section. If we set Method=2, then\
    \ we obtain the implied volatility directly from the Lewis (2000) approximation,\
    \ so we do not need to calculate the volatility with the bisection algorithm.\
    \ The function can be easily modified to add more functions.\n\n```\nfunction\
    \ y = HestonObjFun(ObjFun,...);\nfor k=1:NK\n    for t=1:NT\n        % Select\
    \ the method for obtaining the price\n        if Method=1\n            CallPrice\
    \ = HestonPriceGaussLaguerre\n            (K(k),T(t),...);\n```"
