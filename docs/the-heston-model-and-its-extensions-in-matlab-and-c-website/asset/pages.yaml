- pgno: 97
  md: "# Derivations using the Fourier Transform\n\nThe damped integrand is represented\
    \ by the flat green surface in Figure 3.4, and the un-damped integrand by the\
    \ colored surface. Clearly, adding a damping factor leads to an integrand that\
    \ is much less oscillatory and on which it is easier to apply a numerical integration\
    \ scheme.\n\nThe prices of OTM options in Equations (3.56) and (3.58) are designed\
    \ for $S_i = 1$ only. It is desirable to obtain these formulas for any value of\
    \ $S_i > 0$. This is the subject of the following section.\n\n# Generalization\
    \ of the OTM Representation\n\nIt is straightforward to generalize the OTM representation\
    \ for any value of $S_i > 0$ because that only involves changing the limits in\
    \ the required integrals. For $S_i > 0$, the indicator function in Equation (3.51)\
    \ is based on the OTM cutoff $x_i = \\ln S_i$ so that $z(k)$ is\n\n```\n$z(k)\
    \ = e^{-rt k} \\int_{-\\infty}^{\\infty} (e^x - e^k)1_{k<x_i} q(x) dx + e^{-rt\
    \ k} \\int_{-\\infty}^{\\infty} (e^x - e^k)1_{k>x_i} q(x) dx. $$\n```\n\nUsing\
    \ (3.52), the Fourier transform of $z(k)$ takes the form\n\n```\n$$\\tilde{z}(v)\
    \ = e^{-rt v} \\int_{-\\infty}^{\\infty} e^{ivk} \\int_{-\\infty}^{k} (e^x - e^k)q(x)dxk\
    \ + e^{rt v} \\int_{x_i}^{\\infty} \\int_{k}^{\\infty} (e^x - e^k)q(x)dxdk. $$\n\
    ```\n\nWe proceed exactly in the same fashion: by regrouping the order of integration,\
    \ by noting that the inner integrals are identical, and by regrouping the two\
    \ outer integrals. The result is a generalization of Equation (3.54)\n\n```\n\
    $$\\tilde{z}(v) = e^{-rt v} \\int_{-\\infty}^{\\infty} (\\int_{-\\infty}^{x_i}\
    \ e^{i(v+1)k} dk - \\int_{x_i}^{\\infty} e^{i(v-1)k} dk) q(x) dx. \\quad (3.59)\
    \ $$\n```\n\nThe only thing changed is the upper limit in the inner integral,\
    \ which becomes $k=x_i$, instead of $k=0$. The inner integral is\n\n```\n$$\\\
    frac{e^{i(v+1)x_i}}{iv+1} - \\frac{e^{i(v-1)x_i}}{iv-1} $$\n```\n\nAgain, we express\
    \ $\tilde{z}(v)$ in terms of the characteristic function\n\n```\n$$\\tilde{z}(v)\
    \ = e^{-rt v} (\\frac{S_i+1}{iv+1} - \\frac{e^{rt S_i+1}}{iv}) \\frac{\\varphi(v-i)}{v^2-iv}\
    \ \\quad (3.60) $$\n```\n\nTo obtain the OTM option price for general $S_*$, we\
    \ substitute the Fourier transform (3.60) into Equation (3.56) and apply a numerical\
    \ integration technique. For the damped version, we substitute (3.60) into Equations\
    \ (3.57) and (3.58)."
