    sometimes a combination of returns data and option prices is employed, as in Eraker
    (2004). In this chapter, however, we bypass these methods altogether and focus
    mostly on estimation with loss functions.


    All of the pricing methods covered in this book far have used the closed-form
    approach to obtain the value of the call in the Heston model. Another popular
    method of option valuation is through simulation of the stock price and volatility
    processes of the model. One advantage of this approach is that these simulated
    quantities can be used in the algorithm of Longstaff and Schwartz (2001) to obtain
    the prices of American options. In response, a number of researchers have adapted
    existing simulation schemes to the Heston model, and have created new schemes
    designed exclusively for the model. We deal with some of these schemes in the
