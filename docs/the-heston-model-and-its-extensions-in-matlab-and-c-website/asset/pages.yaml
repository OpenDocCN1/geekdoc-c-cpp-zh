  md: "# Simulation in the Heston Model\n\nwhen $\\sigma^2 > 4\\kappa\theta$, and\
    \ $K_2 = 0$ when $\\sigma^2 \\leq 4\\kappa\theta$. At each simulation step, we\
    \ compare $v_t$ to $K_2$, and we have a different updated value $v_{t,dt}$ depending\
    \ on the results of the comparison.\n\nCase 1, $v_t > K_2$ Updating to $v_{t,dt}$\
    \ requires two steps. In the first step we need to simulate a random variable\
    \ $Y \\in \\{0, \\sqrt{3}, -\\sqrt{3}\\}$ with probabilities $2/3, 1/6$, and $1/6$,\
    \ respectively. This can be done by simulating a random variable $U$ on $(0,1)$,\
    \ and then assigning a value of $Y$ depending on the realized value of $U$. In\
    \ the second step we update to $v_{t,dt}$\n\n```\n$v_{t,dt} = \\exp(-\\kappa dt/2)\
    \ \\left((\\sqrt{\\kappa\\theta - \\frac{\\sigma^2}{4}} \\Psi + e^{-xdt}v_t +\
    \ \\frac{\\sigma}{2}\\sqrt{dt}Y\\right)^2\\n+ \\left(\\kappa\\theta - \\frac{\\\
    sigma^2}{4})\\Psi\\right)$\n```\n\nCase 2, $v_t \\leq K_2$ The first two moments\
    \ of $v_{t,dt}$ conditional on $v_t$ by\n\n```\n$u_1 = E[v_{t,dt}|v_t], u_2 =\
    \ E[v_{t,dt}^2|v_t]$\n```\n\nThe first moment, $u_1$ is presented in Chapter 1,\
    \ where it was denoted $m$. The second moment, $u_2$ can be obtained as $u^2 =\
    \ s^2 + u_2^2$, where $s^2 = Var[v_{t,dt}|v_t]$ is the conditional variance, also\
    \ presented in Chapter 1. Define the quantity $\\pi$ as\n\n```\n$\\pi = \\frac{1}{2}\
    \ - \\frac{1}{2}\\sqrt{1 - \\frac{u_1^2}{u_2}}$\n```\n\nIn the first step, we\
    \ simulate a uniform random variable $U$ on $(0,1)$. In the second step, we update\
    \ to $v_{t,dt}$ by comparing $U$ to $\\pi$ so that\n\n```\n$v_{t,dt} = \\frac{u_1}{2\\\
    pi} \\quad \\text{if } U \\leq \\pi\\nv_{t,dt} = \\frac{u_1^2}{2(1-\\\\pi)} \\\
    quad \\text{if } U > \\pi.$\n```\n\nThe function moments.m calculates the moments\
    \ $u_1$ and $u_2$.\n\n```\nfunction [ul u2] = CIRmoments(param,Vs,dt)\nu1 = theta\
    \ + (Vs - theta)*exp (-kappa*dt);\ns2 = Vs*sigma^2*exp (-kappa*dt)/kappa*(1-exp\
    \ (-kappa*dt)) + ...;\nu2 = s2 + ul*ul;\n```\n\nThe algorithm to update $v_t$\
    \ is implemented with the Matlab function AlfonsiV.m."
