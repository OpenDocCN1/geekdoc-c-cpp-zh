  md: "Numerical Integration Schemes\n\n# FRACTAL FAST FOURRIER TRANSFORM\n\nThe fractional\
    \ Fourier transform (FRFT) was applied to option pricing by Chourdakis (2005).\
    \ The FRFT is a refinement of the FFT that relaxes the restrictive constraint\
    \ $\\lambda\\eta = 2\\pi/N$ on the grid parameters, so that the term $1/N$ in\
    \ the exponent of the Fast Fourier transform is replaced with a general term $\b\
    eta$. Hence, Equation (5,27)\n\n```\n$$\\hat{x}_u = \\frac{e^{-i\\alpha u}}{\\\
    pi} \\sum_{j=1}^{N} Re [e^{-i2\\pi\\beta(j-1)(u-1)} x_j] \\quad \\text{for } u=1,\
    \ \\dots, N. \\quad (5,28)$\n```\n\nThe relationship between the grid size parameters\
    \ $\\lambda$ and $\\eta$ means $\\lambda\\eta = 2\\pi\\beta$. Then we, can choose\
    \ this grid parameters freely, and then set\n\n```\n$$\\beta = \\frac{\\lambda\\\
    eta}{2\\pi}.$\n```\n\nThe FFT arises as the special case $\\beta=1/N$. To implement\
    \ the FRFT on a set of points $x_1, \\dots, x_N$, first define the vectors $y$\
    \ and $z$, each of dimension 2N\n\n```\n$y = \\left[e^{-i\\pi(j-1)^2\\beta} x_j\\\
    right]_{j=1}^{N}, \\quad \\0\\}_{j=1}^{N}\\nz = \\left[e^{i\\pi(j-1)^2\\beta}\
    \ x_j\\right]_{j=1}^{N}, \\quad \\left\\{e^{i\\pi(N-j)^2\\beta}\\right\\}_{j=1}^{N}.$\n\
    ```\n\nNext, take the FFT of $y$ and $z$ to obtain the vectors $\\hat{y}=D(y)$\
    \ and $\\hat{z}=D(z)$, which produce the vector $\\hat{h}$ of dimension 2N defined\
    \ as\n\n```\n$$\\hat{h} = \\hat{y} \\odot \\hat{z} = [y_j, z_j]_{j=1}^{N}.$\n\
    ```\n\nNow take the inverse FFT of $\\hat{h}$ to produce the vector $\\mathbf{h}=D^{-1}(\\\
    hat{h})$ of dimension 2N. Finally, by multiplying element the resulting vector\
    \ with the vector $\\mathbf{e}$ of dimension 2N defined as\n\n```\n$$\\mathbf{e}\
    \ = \\left[e^{-i\\pi(j-1)^2\\beta}\\right]_{j=1}^{N}, \\0\\}_{j=1}^{N}.$\n```\n\
    \nHence, we can write the fractional FFT in compact form as\n\n```\n$$\\hat{x}\
    \ = e \\odot D^{-1}(\\hat{h}) = e \\odot D^{-1}(\\hat{y} \\odot \\hat{z})\\n\\\
    n\\quad = e \\odot D^{-1}(D(y) \\odot D(z)).\\$\n```\n\nThe first $N$ elements\
    \ of $\\hat{x}$ are retained and the remaining $N$ elements are discarded, as\
    \ these are zeros. Note that similar to the FFT, the FRFT takes the 2N-vectors\
    \ $y$ and $z$, and requires that two FFTs be computed in the intermediate steps.\
    \ Nevertheless, the increase in computational time required by the two intermediate"
