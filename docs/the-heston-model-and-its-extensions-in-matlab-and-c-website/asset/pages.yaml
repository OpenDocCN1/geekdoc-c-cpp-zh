  md: "# 270 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nreplacing $\\\
    phi_2$. Similarly, using (9.31) we can write $A(\tau, \\phi_1, \\phi_2)$ as\n\n\
    ```\nA(\\tau, \\phi_1, \\phi_2) = (r - q)i\\phi_1 + \\tau \\frac{\\kappa\\theta}{\\\
    sigma^2} \\left[ (\\kappa - \\rho\\sigma\\phi_1 - d_2) \\tau - 2 \\ln\\left(\\\
    frac{1 - \\tilde{c}_2 e^{-d_2\\tau}}{1 - \\tilde{c}_2}\\right) \\right] (9.37)\n\
    ```\n\nwhich is Equation (2.11) of Kahl (2008).\nThe bivariate characteristic\
    \ function is implemented using the HestonBivari-ateCF.m Matlab function.\n\n\
    ```\nfunction y = HestonBivariateCF(phil,phi2,...,trap)\nx0 = log(S);\nb = lambda\
    \ + kappa;\nd = sqrt(rho*sigma*i*phil + b)^2 - sigma^2*);\ng = (b - rho*sigma*i*phil\
    \ + d + - sigma*2*iphi2); ...\nc = 1/g;\nb = i*phil;\nif trap=1\n% Little Trap\
    \ formulation in Kahl (2008)\nG = (c*exp(-d*tau)-1)/(c-1);\nA = (r-q)*i*phil*tau\
    \ + a/sigma^2 ...\nnelseif trap=0\n% Original Heston formulation.\nG = (1-g*exp(d*tau))/(1-g);\n\
    A = (r-q)*i*phil*tau + a/sigma^2 ...\nC = ((b - rho*sigma*i*phil + d) ...);\n\
    end\n% The characteristic function.\ny = exp(A + B*x0 + C*y0);\n```\n\nThis function\
    \ can be passed to the HestonGaussLaguerre.m function, which illustrates that\
    \ the call price can be identically obtained with either the univariate or bivariate\
    \ characteristic function. This is accomplished by setting the argument to the\
    \ HestonBivariateCF.m function.\n\n```\nfunction y = HestonPriceGaussLaguerre(...,x);\n\
    for k=1:length(x)\nphi = x(k);\nweight = w(k);\nif CF=1\n%' CF\nf2(k) = HestonCF(phi,kappa,...);\n\
    f1(k) = HestonCF(phi-i,kappa,...)/(S*exp((r-q)*T));\nelseif CF=2\n% Bivariate\
    \ CF\nf2(k) = HestonBivariateCF(phi ,0,kappa,...);\nf1(k) = HestonBivariateCF(phi-i,0,kappa,...)/(S*exp((r-q)*T));\n\
    end\n```"
