  md: "# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhere $\\eta$ is\
    \ the increment. The trapezoidal rule approximates the call price $C(k)$ as\n\n\
    ```\n$C(k) \\approx \\frac{e^{-vk}}{\\pi} \text{Re} \\left[ \\frac{1}{2}e^{-iw_1k}\\\
    psi(v_1) + e^{-iw_2k}\\psi(v_2) + \\\\dots + \\frac{1}{2}e^{-iw_Nk}\\psi(v_N)\
    \ \right] \\\\ \\frac{e^{-\\eta_ak}}{\\pi} \\sum_{j=1}^{N} e^{-iw_jk}\\psi(v_j)w'_j$\
    \ (5.22)\n```\n\nwhere the weights are $w_1 = w_N = \\frac{1}{2}$ and $w_j = 1$\
    \ for $j=2, \\dots, N-1$. If Simpson's rule is used instead of the trapezoidal\
    \ rule, we set $w_1 = w_N = \\frac{1}{3}$ and $w_j = \\frac{4}{3}$ when $j$ is\
    \ even, and $w_j = \\frac{2}{3}$ when $j$ is odd.\n\nWe are interested in strikes\
    \ near the money, we need to define the discretization range of the strikes so\
    \ that it is centered around the log price $\\log S_0$. Carr and Madan (1999)\
    \ assume that the spot price is $S_0=1$, but it is straightforward to generalize\
    \ the discretization of general values of $S$. The strike range is, discretized\
    \ using the N equidistant points\n\n```\n$k_u = -b + (u-1)\\lambda + \\ln S_0$\
    \ for $u=1, \\dots, N$ (5.23)\n```\n\nwhere $\\lambda$ is the increment and $b\
    \ = N\\lambda/2$. This produces log strikes over the range $[\\ln S_0 - b, \\\
    ln S_0 + b - \\lambda]$. For a log strike value $k_u$ on the grid, we can write\
    \ Equation (5.22) for the price of the call as\n\n```\n$C(k) \\approx \\frac{e^{-\\\
    eta_ak}}{\\pi} \\sum_{j=1}^{N} e^{-iw_jk}\\psi(v_j)w_j$ (5.24)\n```\n\nSubstitute\
    \ for $v_j$ and $k_u$\n\n```\n$C(k) \\approx \\frac{e^{-\\eta_ak}}{\\pi} \\sum_{j=1}^{N}\
    \ e^{-i(j-1)\\eta[-b+(u-1)\\lambda+\\ln S_0]}\\psi(v_j)w_j \\\\ \\frac{e^{-\\\
    eta_ak}}{\\pi} \\sum_{j=1}^{N} e^{-i(j-1)\\eta(u-1)}e^{i(b-j\\lambda+\\ln S_0)}\\\
    psi(v_j)w_j$ (5.25)\n```\n\nIn order to express Equation (5.25) in terms of the\
    \ discrete FFT in (5.18), we must have the following constraint on the increments\
    \ $\\eta$ and $\\lambda$\n\n```\n$\\lambda\\eta = \\frac{2\\pi}{N}$\n```\n\nThis\
    \ is an important limitation of the FFT, since it entails a trade-off between\
    \ the grid sizes. For a fixed $N$, choosing a fine grid for the integration range\
    \ will produce a coarse grid for the log strikes, and vice-versa. The only way\
    \ to increase the granularity of both grids is to increase $N$, and consequently,\
    \ the computation time."
