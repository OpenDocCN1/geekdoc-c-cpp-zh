  md: '# 332 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    with


    ```

    $$\frac{\partial P_i}{\partial \xi}=\frac{1}{\pi}\int_{0}^{\infty} \text{Re} \left[
    \frac{\partial f_i}{\partial \xi} \times \frac{e^{-i\phi \ln K}}{\phi} \right]
    d\phi.\quad (11.25)$

    ```


    and


    ```

    $$\frac{\partial f_i}{\partial \xi}=\exp(C_i+D_nu_i+i\phi x_i) \left(\frac{\partial
    C_i}{\partial \xi}+\frac{\partial D_i}{\partial \xi}\right).\quad (11.26)$

    ```


    for $\xi \in (\rho, \sigma, \kappa)$. Obtaining derivatives of $C_i$ and $D_i$
    in Equation (11.26) is complicated, but can be easily handled with a symbolic
    calculator such as Matlab. By examination of (11.1) it is easy to verify that
    the sensitivities of the put to $\rho, \sigma,$ and $\kappa$ are the same as for
    the call.


    Finally, recall from Chapter 1 that we can consolidate the integrals for $P_1$
    and $P_2$ into a single integral, and from Chapter 2 that we can express the first
    characteristic function, $f_1(\phi)$, in terms of the second, $f_2(\phi)$, as
    $f_1(\phi)=f_2(\phi-i)/(S e^{-r t})$. This implies that we can write the call
    as


    ```

    $C(K)=\frac{1}{2}Se^{-rt}-\frac{1}{2}Ke^{-rt\|+\frac{1}{\pi}\int_{0}^{\infty}
    \text{Re} \left[ \frac{e^{-i\phi \ln K}}{\phi} (f_2(\phi-i)-K_2(\phi)) \right]
    d\phi.\quad (11.27)$

    ```


    The Greeks can be obtained by straightforward differentiation of $C(K)$, in the
    same manner as described earlier in this section.


    # FINITE DIFFERENCES FOR THE GREEKS


    In the previous section, we derived analytic expressions for the Greeks from the
    Heston call or put price. In the last chapter, we used finite differences to approximate
    the derivatives that appear in the Heston PDE. We can apply finite differences
    to find the Greeks and other option sensitivities. While this approach is used
    to calculate Greeks, the computation time is increased because the option price
    must be calculated more than once, multiple times for the second-order Greeks.
    Delta ($\Delta$), theta ($\Theta$), rho ($\rho$), vega1 ($V_1$), and vega2 ($V_2$),
    the first-order sensitivities $\partial U/\partial \xi$, for $\xi \in (\rho, \sigma,
    \kappa)$, or variable can be approximated with first-order central differences.
    For example, for the call $C(S,v,t)$ is approximated as


    ```

    $$\Delta_c \approx\frac{C(S+dv,v,t)-C(S-dv,v,t)}{2dv}$

    ```


    As another example, to approximate the first vega in Equation (11.10) we approximate
    the derivative with respect to $v$, by a central difference and multiply the result
    by $2\sqrt{v}$


    ```

    $V_i \approx\frac{C(S,v,t;v_0+dv)-C(S,v,t;v_0-dv)}{2dv} \times 2\sqrt{v_0}.quad
    (11.28)$

    ```'
