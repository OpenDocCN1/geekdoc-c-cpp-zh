  md: "# 110 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe second expansion\
    \ (Series II) produces the implied variance\n\n```\n$v_{imp} \\approx \\sqrt{\\\
    bar{v} + \\sigma_J \\frac{R^{1,1}+}{T}}$\n$$\\sigma_J^2 \\left[ \\frac{J_2}{T}\
    \ + \\frac{J_{2,0}^2}{T^2} + \\frac{J_4 R^{1,2}}{T} - \\frac{(J_1)^2}{T^2} (R^{2,2}\
    \ - (R^{1,1})^2 R^{2,0}) \\right]$ (4.43)\n```\n\nwhich is then fed into the Black-Scholes\
    \ formula in (4.35) to produce $C_{II}(S_0, v_0, T)$, the call price under Series\
    \ II. In other words, we use (4.35) to obtain the call price, but replace $\\\
    bar{v}$ with $v_{imp}$ from (4.43)\n\n```\n$C_{II}(S_0, v_0, T) = C_{BS}(S_0,\
    \ v_{imp}, T).$ (4.44)\n```\n\nFinally, in the expressions for the call price\
    \ in (4.42) and (4.44) the integrals $J_1, J_3,$ and $J_4$ are all evaluated at\
    \ the initial variance $v_0$, so that $v$ is replaced by Heston parameter $v_0$\
    \ everywhere in (4.38), (4.39), and (4.40). The deterministic variance in Equation\
    \ (4.36) and Black-Scholes price in (4.35) are easy to implement in Matlab, using\
    \ user-defined functions. This is illustrated with the following code:\n\n```\n\
    v = theta + (v0-theta)*(1-exp(-kappa*T))/(kappa*T);\nBSC = @(S,K,rf,q,T) (S*exp(-q*T)*normcdf((log(S/K)\
    \ + ...));\nBSPrice = BSC(S,K,rf,q,T);\n```\n\nThe functions $J_1(v,T)$ and $J_4(v,T)$\
    \ in Equations (4.38) through (4.40) are implemented in a single Matlab function\
    \ J.m.\n\n```\nfunction y = J(rho,theta,T,v0,Number)\nif Number=-1\n    y = (theta*T\
    \ + (1-exp(-k*T))*(v0/k) - ...;\n    y = y*rho/k;\nelsif Number=3\n    y = theta*T\
    \ + theta/2/k*(1-exp(-2*k*T)) - ...;\n    y = y/2/k;\nelseif Number=4\n    y =\
    \ theta/k*(T*(1+exp(-k*T)) - 2/k*(1-exp(-k*T)) + ...;\n    y = y*rho^2/k;\nend\n\
    ```\n\nThe functions $R^{pd}$ in Equation (4.41) are also implemented in a single\
    \ function, R.m."
