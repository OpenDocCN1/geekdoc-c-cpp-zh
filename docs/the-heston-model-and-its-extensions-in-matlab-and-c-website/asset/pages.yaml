    \ of Andersen and Brotherton-Ratcliffe (2005). The only difference is that the\
    \ correlated random variables $Z_s$ and $Z_v$ are outside the function and passed\
    \ to the function in its argument.\n\n```\nfunction [S V] = MMSim(params,...,Zv,\
    \ Zs)\n% Generate the stock and volatility paths\nfor i=1:N\n  for t=2:T\n   \
    \   dw = sqrt(dt)*V(t,i);\n      num = .5*sigma^2V(t-1,i)*(1-exp(-2*kappa*dt));\n\
    \      den = (exp(-kappa*dt)*V(t-1,i) + (1-exp(-kappa ...\n      Gam = log(1 +\
    \ num/den);\n      V(t,i) = (exp(-kappa*dt)*V(t-1,i) + (1-exp ...\n      % Euler/Milstein\
    \ discretization log stock prices\n      S(t,i) = S(t-1,i)*exp((r-q-V(t-1,i)/2\
    \ + ...\n  end\nend\nend\n```\n\nTo calculate the Greeks, we generate matrices\
    \ of correlated random variables, and we generate a set of stock price paths using\
    \ the same random variables but shifted values of the inputs. Hence, if we need\
