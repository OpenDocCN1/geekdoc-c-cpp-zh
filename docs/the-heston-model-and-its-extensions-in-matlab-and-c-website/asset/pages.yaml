  md: "# Integration Issues, Parameter Effects, and Variance Modeling\n\nVarianceSwap()\
    \ function does need, however, a C# function for linear interpolation. This is\
    \ achieved with the interp1() function.\n\n```\nstatic double interp1(double[]\
    \ X, double[] Y, double xi) {\n  int x1 = 0;\n  int x2 = 0;\n  double yi = 0.0;\n\
    \  // Look for xi on the end points\n  if(xi <= X[0]) yi = Y[0];\n  else if (xi\
    \ <= X[N-1]) yi = Y[N-1];\n  else\n    for (int i=0; i<N-1; i++) {\n      if((xi\
    \ <= X[i]) && (xi < X[i+1])) {\n        x1 = i;\n        x2 = i+1;\n        double\
    \ p = (xi - Convert.ToDouble(X[x1])) / ...;\n        yi = (1-p)*Y[x1] + p*Y[x2];\n\
    \      }\n    }\n  return yi;\n}\n```\n\nTo illustrate, we use a strip of options\
    \ from the Dow Jones Average ETF (ticker DIA) with 15 days to maturity, and obtain\
    \ the parameter estimates $\\kappa=3.000$, $\\theta=0.063$, $\\sigma=0.502$, $v_0=0.104$,\
    \ and $\\rho=-0.901$. Parameter estimation will be covered in Chapter 6. Using\
    \ Equation (2.23), we obtain $K_{var}^2=0.101$; using the replication algorithm\
    \ on market option quotes, we obtain $K_{var}^2=0.085$.\n\n# Dupire Local Volatility\n\
    \nDupire’s (1994) formula for local volatility is\n\n> $$\\sigma_t(K,T) = \\sqrt{\\\
    frac{\\frac{\\partial C}{\\partial T}}{\\frac{1}{2}\\frac{\\partial^2 C}{\\partial\
    \ K^2}}}$\n\nC=C(K) is the time- call price with strike K and maturity $T$ when\
    \ the price is $S$.\\nEquation (2.24) stipulates that given a set of options,\
    \ the local volatility for a strike $K$ and maturity $T$ is obtained with first-\
    \ and second-order derivatives of the call price. These derivatives can be obtained\
    \ by finite differences, which can be computationally extensive and numerically\
    \ unstable. In the Heston model, we present in the next section. Finite differences,\
    \ the derivatives required to evaluate (2.24) can be obtained analytically by\
    \ straightforward differentiation.^2\\nRecall that the Heston price is\n\n$C(K)\
    \ = S_tP_1 - Ke^{-rT}P_2$.\n\n^2See Chapter 11, “The Heston Greeks,” for more\
    \ on these are derivatives."
