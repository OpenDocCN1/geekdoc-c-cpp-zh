  md: "# 240 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nand Scaillet\
    \ (2010) expansion with five terms. The results in Table 8.3 are nearly identical\
    \ to those obtained by the authors in Table 2.\n\nThe entries in the last row\
    \ of Table 8.3 are calculated with the Matlab function TrinomialTree.\n\n```\n\
    function y = TrinomialTree(Spot,K,r,q,v,T,N,PutCall,EuroAmer)\n% Trinomial tree\
    \ parameters and probabilities\ndt = T/N;\nu = exp(sqrt(2*dt));\nd = 1/u;\npu\
    \ = (exp((r-q)*dt/2) - exp(-v*sqrt(dt/2)))/2;\npmu = exp(v*sqrt(dt/2));\npd =\
    \ (exp(v*sqrt(dt/2)) - exp((r-q)*dt/2)))/2;\npmm = 1 - pu - pd;\n% Calculate all\
    \ the stock prices.\nS = zeros(N+1,1);\nS(1,1) = Spot;\nfor j=2:N-1\n    for i=N-j+2:N\n\
    \        S(i,j) = Spot*u^(N+1-i);\n    end\n% Calculate terminal option prices.\n\
    V = zeros(N+1,1);\nV(:,N+1) = max(K - S(:,N+1), 0);\n% Calculate remaining entries\n\
    for j=N-1:1\n    for i=N-j+2:N\n        V(i,j) = max(K - S(i,j), exp(-r*dt)*(pu*V(i,j+1)\
    \ + pm*V(i,j+1) + ...));\n    end\n% Option price is at the first node.\ny = V(1,1);\n\
    ```\n\nThe C# code for the trinomial tree is similar and not presented here.\n\
    \n# Medvedev-Scaillet for Heston\n\nThe Medvedev-Scaillet (2010) approximation\
    \ for the American put price under the Heston (1993) model is identical in form\
    \ to that for the Black-Scholes model in Equation (8.40)\n\n> $P(\\theta, \\tau,\
    \ v) = \\sum_{n=1}^{\\infty} P_n(\\theta, v)r^{n/2}. \\quad (8.54)$"
