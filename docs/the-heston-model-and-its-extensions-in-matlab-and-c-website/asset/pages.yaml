    # CHIARELLA AND ZOGAS AMERICAN CALL


    In this section, the last of this chapter, we present the method of Chiarella
    and Ziogas (2006) for pricing American calls in the Heston (1993) model. Their
    method requires an animate of the early exercise boundary. The early exercise
    boundary and other features of American options are discussed in Kwok (2008),
    for example.


    # **Early Exercise Boundary Approximation**


    Recall from Chapter 1 that the price $U(S,v,\tau)$ a European option satisfies
    the Heston (1993) PDE, subject to certain boundary conditions. We saw in the previous
    sections that an American option satisfies the same PDE, but with different boundaries.
    For an American call option $C(S,v,\tau)$, we can then write


    ```

    $$\frac{\partial C_A}{\partial \tau} = \frac{1}{2}v^2S\frac{\partial^2 C_A}{\partial
    S^2} + \rho vS\frac{\partial^2 C_A}{\partial v\partial S} + \frac{1}{2}\sigma^2
