- pgno: 202
  md: "# Simulation in the Heston Model\n\nWe continue with the example in earlier\
    \ sections that use 5,000 simulation paths with 100 time steps. Recall that the\
    \ closed-form price is 11.2087. The IJK scheme produces 11.2833 (an error of 0.7\
    \ percent), the Pathwise scheme produces 11.2192 (error of 0.1 percent), and the\
    \ Balanced scheme produces 11.2841 (error of 0.7 percent). These errors are small,\
    \ and none of the schemes generated negative variances.\n\n# QUADRATIC-EXPONENTIAL\
    \ SCHEME\n\nRecall from Chapter 1 that the value of $v_{t+dt}$ conditional on\
    \ a realized value $v_t$ follows the non-central chi-square distribution. Andersen\
    \ (2008) suggests sampling from an approximation to the distribution, depending\
    \ on whether the non-central parameter, $2c_t v_t e^{dt}$, is large or small.\
    \ Since the non-central parameter is proportional to $v_t$, large or small values\
    \ of the parameter correspond to large or small values of $v_t$, the algorithm\
    \ switches back and forth between two approximations to the non-central chi-square\
    \ distribution; the choice of approximation depends on the magnitude of $v_t$.\
    \ The reasoning is as follows:\n\nFor moderate or high values of $v_t$, a non-central\
    \ chi-square random variable can be approximated by a power function applied to\
    \ a standard normal variable $Z_V$\n\n```\n$v_{t+dt} = a(b + Z_v)^2$$\n```\n\n\
    where $a$ and $b$ are determined by moment-matching using the mean $m$ and variance\
    \ $s^2$ of the Cox, Ingersoll, and CIR (1985) process presented in Chapter 1.\
    \ For small values of $v_t$, the non-central chi-square density can be approximated\
    \ by a weighted average of a term involving the Dirac delta function $\\delta$\
    \ and another term involving $e^{-bx}$\n\n```\n$Pr(v_{t+dt} \\in [x, x+dx]) =\
    \ (p\\delta(0) + (1-p)e^{-\beta x})dx$$\n```\n\nwhere $p$ and $\beta$ are determined\
    \ by moment-matching also. Note that $0 \\le p \\le 1$. Integrating (7.38) and\
    \ inverting the inverse distribution function\n\n```\n$$\\Psi^{-1}(u) = \\begin{cases}\
    \ 0 & \\text{for } 0 \\le u \\le p \\ \\frac{1}{\\beta}\\ln\\frac{1-p}{1-u} &\
    \ \\text{for } p \\le u \\le 1. \\end{cases}$$\n```\n\nThe sampling scheme for\
    \ small values of $v_t$ is, therefore,\n\n```\n$v_{t+dt} = \\Psi^{-1}(U_v)$$$\n\
    ```\n\nwhere $U_v$ is a uniform random number.\nThe Quadratic Exponential (QE)\
    \ sampling scheme is defined by Equations (7.37) and (7.40). From these equations\
    \ it is clear that the QE scheme guarantees that only positive values of $v_{t+dt}$\
    \ will be generated. Duffy and Kienitz (2009) present a nice explanation of the\
    \ QE scheme."
  merge: -1
