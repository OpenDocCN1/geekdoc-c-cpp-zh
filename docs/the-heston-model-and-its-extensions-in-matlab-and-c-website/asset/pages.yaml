- pgno: 92
  md: '# THE CARR-MADAN REPRESENTATION FOR PUTS


    We can always use put-call parity to find the value of the put, or we can apply
    a damping factor to the put price and find a representation for the put itself.
    The put price $P(k)$ is


    ```

    $P(k) = e^{-rt}\mathbb{E}^q[(K - S_{\tau})^+]$\n$$= e^{-rt}\int_{-\infty}^{k}
    (e^k - e^x)q(x) \ dx\quad (3.49)$

    ```


    which does not have a Fourier transform since it is not $L^1$. Indeed,


    ```

    $\lim_{k\to+\infty} P(k) = \lim_{k\to+\infty} e^{-rt}\int_{-\infty}^{k} (e^k -
    e^x)q(x) \ dx = \infty.$

    ```


    Note that, since the upper limit is $+\infty$, we will need a damping factor with
    a negative exponent. Schmelze (2010) uses the modified price by


    ```

    $p(k) = e^{-ak}P(k)$

    ```


    which is $L^1$ because


    ```

    $\lim_{k\to+\infty} p(k) = \lim_{k\to+\infty} e^{-rt}\int_{-\infty}^{k} (e^{-(a+1)k}
    - e^{-ak+x}) q(x) \ dx = 0.$

    ```


    The Fourier transform of the modified price is


    ```

    $\hat{p}(v) = \int_{-\infty}^{\infty} e^{-ivk}p(k) dk = \int_{-\infty}^{\infty}
    e^{-ivk}e^{-ak}P(k) dk$\n$$= e^{-rt}\int_{-\infty}^{\infty} e^{-(a+iv)k} [\int_{-\infty}^{k}
    (e^k - e^x) q(x) \ dx] dk.$

    ```


    The area of integration $-\alpha < k < \infty$ and $-\alpha < x < \infty$ is equivalent
    to $-\infty < x < \infty$ and $x < k < \infty$, so we can write


    ```

    $\hat{p}(v) = e^{-rt}\int_{-\infty}^{\infty} q(x) [\int_{x}^{\infty} e^{-(a+iv)k}
    - e^{-(a+iv+1)k} dk] dx$\n$$= e^{-rt}\int_{-\infty}^{\infty} q(x) [\frac{e^{-(a+iv+1)x}}{\alpha^2-v^2+iv(1-2\alpha)}]
    dx$\n$$= e^{-rt}\varphi(v + (\alpha - 1)i)\n$$\frac{1}{\alpha^2-\alpha v^2+iv(1-2\alpha)}$

    ```


    provided that the damping factor is such that $-\alpha < 1$, or $\alpha > 1$,
    in order for the upper limit of the inner integral to vanish. The put price is,
    therefore, obtained'
