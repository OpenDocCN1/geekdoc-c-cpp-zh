    \ state variables (the stock price and the variance), and a discretization grid\
    \ for the maturity. These grids can have equal or equally spaced increments. Second,\
    \ we need discrete approximations to the continuous derivatives that appear in\
    \ the PDE. Finally, we need a finite difference methodology to solve the PDE.\n\
    \n# BUILD GRIDS\n\nUniform grids are those that have equally spaced increments\
    \ for the two state variables. These grids have two advantages: first, they are\
    \ easy to construct, and second, since the increments are equal, the finite difference\
    \ approximations to the derivatives in the PDE take a simple form. Non-uniform\
    \ grids are more complicated to construct, and they can be made finer around certain\
    \ points, in particular, the region $(S,v)=(K,0)$ where option prices are often\
    \ required. Hence, non-uniform grids provide more accurate approximations with\
    \ fewer grid points, and consequently, with less computation time.\n\nWe denote\
    \ the maximum values of $S$, $v$ and $t$ as $S_{max}$, $v_{max}$ and $t_{max}=\t\
