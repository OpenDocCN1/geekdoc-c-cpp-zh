    The effect of increasing $\sigma$ is to increase kurtosis. This makes sense, since
    high volatility of vanilla will increase the range of stock price values. This
    is illustrated in Figure 2.7, which compares the difference between the Heston
    and Black-Scholes calls with $\rho = 0$, and when $\sigma = 0.1$ and $\sigma =
    0.2$. It indicates that Heston prices are higher than Black-Scholes prices in
    ITM and OTM regions but lower in the at-the-money region. These two observations
