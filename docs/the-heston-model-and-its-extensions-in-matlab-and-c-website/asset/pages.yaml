    Instead of expressing the derivatives of Equation (2.24) analytically, we can
    use approximate these derivatives using finite differences. This is the approach
    used to obtain local volatility in the next section.


    # Local Volatility With Finite Differences


    The analytic expressions for the derivatives required of the Dupire (1994) local
    volatility formula require extensive coding, as illustrated in the previous section.
    From a coding point of view, it is simpler to approximate the derivatives using
    finite differences. Write C(K) = C(K,T) to emphasize the dependence of the European
    call price on the maturity T. We use a small time increment dt and approximate
    the time derivative as the central difference


    Similarly, we can use a small strike increment dK and approximate the second-order
    derivative as the central difference


    > $$\frac{\partial C}{\partial T} \approx \frac{C(K,T+dt)-C(K,T-dt)}{2dt}$


    > $$\frac{\partial^2 C}{\partial K^2} \approx \frac{C(K-dK,T)-2C(K,T)+C(K+dK,T)}{(dK)^2}$


    The function HestonLVFD.m obtains local volatility σ_t(K,T) in the Heston model
    using the central difference approximation to the.


    ```

    function y = HestonLVFD(...,dt,dK);

    % dC/dT by central finite difference

    CT_1 = HestonCallGaussLaguerre(S,K,T-dt,...,x,w);

    CTL = HestonCallGaussLaguerre(S,K,T+dt,...,x,w);

    dCdT = (CTL - CT) / (2*dt);

    ```'
