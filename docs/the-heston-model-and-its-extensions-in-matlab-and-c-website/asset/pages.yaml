    \ + a \\int_0^{\\tau} \\frac{(u\\phi - \\phi^2)(1 - e^{-b_i\\tau'})}{b_i} d\\\
    tau' + K_1\\n=\rho\\tau\\phi + a \\frac{(u\\phi - \\phi^2)}{b_i} \\left[ \\tau\
    \ - \\frac{(1 - e^{-b_i\\tau})}{b_i} \\right] \\quad (1.79)$\n```\n\nwhere the\
    \ initial condition $C_t(0,\\phi)=0$ has applied, which produces $K_1=0$ for the\
    \ integration constant. Substitute $C_t$ and $D_t$, from Equations (1.79) and\
