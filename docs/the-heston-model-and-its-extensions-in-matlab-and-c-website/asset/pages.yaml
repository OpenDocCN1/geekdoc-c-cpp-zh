  md: 'Analogous to the univariate case, the generator $\mathcal{A}$ of the process
    is defined as the operator


    ```

    $$\mathcal{A} = \sum_{i=1}^n \mu_i\frac{\partial}{\partial x_i} + \frac{1}{2}\sum_{i=1}^n\sum_{j=1}^n
    (\sigma\sigma^T)_{ij}\frac{\partial^2}{\partial x_i\partial x_j}$ (12.3)

    ```


    where, for notational convenience, $\mu = \mu(x,t)$, $\sigma = \sigma(x,t)$, and
    $(\sigma\sigma^T)_{ij}$ is element $(i,j)$ of the matrix $\sigma\sigma^T$ of size
    $n \times n$. The multi-dimensional version of the Feynman-Kac theorem states
    that the partial differential equation of a function $f(x,t)$ by


    ```

    $$\frac{\partial f}{\partial t} + \mathcal{A}f(x,t) - r(x,t)f(x,t) = 0$ (12.4)

    ```


    and with boundary condition $f(x_T, T)$, has the solution


    ```

    $f(x,t) = \mathbb{E}^Q\left[exp\left(-\int_t^T r(x_u,\mu) du\right) f(x_T, T)
    |\mathcal{F}_t\right]$

    ```


    In the following section, we use this result to obtain the PDE and characteristic
    function of the double Heston model, and the double Heston call price is


    # DOUBLE HESTON CALL PRICE


    The double Heston model proposed by Christoffersen et al. (2009) introduces a
    second factor for the variance, driven by its own S


    ```

    $dS = (r-q)Sdt + \sqrt{v_1}SdW_1 + \sqrt{v_2}SdW_2\ndv_1 = \kappa_1(\theta_1-v_1)dt
    + \sigma_1\sqrt{v_1}dZ_1\ndv_2 = \kappa_2(\theta_2-v_2)dt + \sigma_2\sqrt{v_2}dZ_2.$
    (12.5)

    ```


    The following correlation structure is specified


    ```

    $E[dW_1dZ_1] = \rho_{11}dt\nE[dW_2dZ_2] = \rho_{22}dt\nE[dW_1dZ_2] = E[dZ_1dW_2]
    = E[dW_2dZ_1] = 0.$ (12.6)

    ```


    Note that we have suppressed the term subscript for notational simplicity. The
    idea behind the multi-factor model is that the additional volatility factor provides
    more flexibility in modeling the volatility surface. Recall from Chapter 2 that
    the correlation between the returns and their variance $(\rho)$ controls the smile
    of the implied volatility. When $\rho\approx0$, the smile is symmetric, but as
    it moves towards $\pm1$ the smile becomes highly asymmetric, with $\rho\approx-1$
    corresponding to a negative slope and $\rho\approx+1$ to a positive slope. In
    the single-factor Heston model, $\rho$ is constant over maturities, which means
    that model has trouble providing an adequate fit to market implied volatilities
    when the slope of the smile varies substantially across maturities, although it
    does a good'
