  md: "# The Fundamental Transform for Pricing Options\n\nmax(0,\\alpha) < k_t < min(1,\b\
    eta). Equation (4.19) for the call price is easier to deal with than (4.17), because\
    \ in (4.19), we can simply select $k_t = 1/2$. Equation (4.19) is Equation (2.2.10)\
    \ in Lewis (2000).\n\nThe integral for the call price $C_1(K)$ in (4.17) or for\
    \ $C_2(K)$ in (4.19) can be simplified by noting that the integrand is also even\
    \ in its real part, and odd in its imaginary part. Hence, the expressions for\
    \ the call price can be\n\n```\n$C_1(K) = -\\frac{K^{-rt}}{\\pi} \\int_0^{\\infty}\
    \ \\text{Re}\\left[frac{e^{-ikX}}{k^2 - ik} \\hat{H}(k, v, \\tau)\\right] dk \\\
    eqno(4.20)$\n```\n\nwhere $1 < k_t < \\beta$, and\n\n```\n$C_2(K) = S_0 e^{-rt}\
    \ \\frac{1}{\\pi} \\int_0^{\\infty} \\text{Re}\\left[frac{e^{-ikX}}{k^2 - ik}\
    \ \\hat{H}(k, v, \\tau)\\right] dk \\eqno(4.21)$\n```\n\nwhere max(0,\\alpha)\
    \ < k < min(1,\\beta) and where $X=ln(S/K)+(r-q)$. The solutions in Equations\
    \ (4.20) and (4.21) are identical, except that the expression for $C_2(K)$ includes\
    \ the term $S_0 e^{-rt}$ while for $C_1(K)$ does not. Hence, it is unintuitive\
    \ that both would produce the same call value. Remember, that the integration\
    \ strips are different. In $C_2(K)$, we can take $k_t=1/2$, but in $C_1(K)$ we\
    \ must take $k_t > 1$. This means that the integrals have different values; the\
    \ net effect is that $C_1(K)=C_2(K)$.\n\nWhen a numerical integration scheme is\
    \ applied to the integrals in Equations (4.20) and (4.21), they are often truncated\
    \ and replaced by a large number. Lewis uses the range $(0, k_{max})$ where $k_{max}=max(1000,\
    \ 10/\\sqrt{\\tau})$. We return this issue in Chapter 5.\n\nThe Matlab function\
    \ LewisIntegrand(k,X,...) implements the fundamental transform $\\hat{H}(k,v,\\\
    tau)$ from Equation (4.15).\n\n```\nfunction y = LewisIntegrand(k,X,...)\nkappa\
    \ = 2*(kappa + 1*k*rho/sigma)/sigma^2;\ntheta = sigma^2/(kappa + 1*k*rho/sigma);\n\
    t = tau*sigma^2/2;\nc = (k^2-i*k)/sigma^2;\nd = sqrt(kappa^2 + 4*c);\nalpha =\
    \ (-kappa + d) / 2;\nbeta = (-kappa - d) / 2;\ng = beta/alpha;\nB = (kappa+d)*(1-exp(d*t))/t;\n\
    A = kappa*(kappa+d)*t/2 - log((1-exp(d*t))/t);\nH = exp(A + B*t);\ny = real(exp(-i*k*t)/(k^2\
    \ - i*k)*H);\n```\n\nThis function is then used to call the function HestonLewisCallPrice,\
    \ which calculates either $C_1(K)$ or $C_2(K)$ from (4.21). The function can use\
    \ either the trapezoidal integration rule, or Gauss Laguerre integration."
