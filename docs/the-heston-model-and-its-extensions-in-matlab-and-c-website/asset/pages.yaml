- pgno: 227
  md: "# Case 2. If $x_i = 0$, the move $x_i^{v+dt}$ is defined identically to that\
    \ in Equation (8.22), the down move is $x_{i+dt}^d = 0$, and the middle move $x_{i+dt}^m$\
    \ is not used. \nThe probabilities in this case are\n\n```\n$p_v^u = \\frac{k\\\
    theta dt}{v_{i+dt}^u}, \\quad p_v^m = 0, \\quad p_v^d = 1 - p_v^u \\quad (8.24)$\n\
    ```\n\nwhere $v_{i+dt}^u$ is obtained by substituting $x_{i+dt}^u$ in Equation\
    \ (8.20).\n\nThe preceding equations $j$ and $b$ defined by\n\n```\n$j = \\text{floor}\
    \ \\left( \\frac{\\mu \\(x_i, t)}{b} + \\frac{\\sqrt{dt}}{b^2} \\right) \\quad\
    \ (8.25)$\n```\n\nand\n\n```\n$b = \\begin{cases} b_c & \\text{if } |b_c - \\\
    sqrt{1.5}| < |b_e - \\sqrt{1.5}| \\ b_e & \\text{otherwise} \\end{cases} \\quad\
    \ (8.26)$\n```\n\nwhere\n\n```\n$b_e = \\frac{x_0\\sqrt{dt}}{floor(x_0/\\sqrt{1.5})},\
    \ \\quad b_c = \\frac{x_0\\sqrt{dt}}{floor(x_0/\\sqrt{1.5} + 1)} \\quad (8.27)$\n\
    ```\n\nThe trinomial tree for $x_i$, and $v_i$ are each truncated below zero (they\
    \ can be truncated above an arbitrary value also, to reduce computation time).\
    \ The $b$ parameter is defined within the range $1 \\le b \\le \\sqrt{2}$ and\
    \ serves to contract or expand the tree to ensure that the last row of the tree\
    \ for $x_i$, is exactly zero. The trinomial tree for $v_i$ is obtained by substituting\
    \ the value of $x_i$, at each node into Equation (8.20).\n\n# Trinomial Tree for\
    \ the Stock Price\n\nIn the trinomial tree for the transformed stock price $Y_i$,\
    \ defined in Equation (8.13), jumps across multiple nodes are allowed. High values\
    \ of $v_i$, cause $Y_i$ to jump up and down multiple nodes while low values of\
    \ $v_i$ allow for jumps across single nodes only. Beliaeva and Nawalka (2010)\
    \ define the node span as $k\\sigma_v(0)\\sqrt{dt}$, which represents the distance\
    \ between nodes for values of $Y_{i+dt}$, given that the process is at the node\
    \ $Y_i$. The $k_i = 1$ represents a jump across a single node, while $k_i > 1$\
    \ represents a jump across multiple nodes. This parameter is defined as\n\n```\n\
    $k_i = \\begin{cases} \\text{Ceiling}(\\sqrt{v_i/v_0}) & \\text{if } v_i > 0 \\\
    \ 1 & \\text{otherwise.} \\end{cases} \\quad (8.28)$\n```\n\nMultiple jumps in\
    \ $Y_i$ are illustrated in Figure 8.2, which reproduces Exhibit 3 of Beliaeva\
    \ and Nawalka (2010). The left panel is for the case $k_i = 1$ is analogous"
