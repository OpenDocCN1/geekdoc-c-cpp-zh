  md: "# American Options\n\n```\n// Inverse of an upper triangular matrix\nstatic\
    \ double[,] MatUpTriangleInv(double[,], U)\n{\n int N = U.GetLength(0);\ndouble[,]\
    \ V = new double[N,N];\nfor(int j=N-1;j>=0; j--){\n    V[j,j] = 1.0/U[j,j];\n\
    \    for(int i=j-1;i>=0; i--){\n        for(int k=i;k<=j; k++){\n            V[i,j]\
    \ = -1.0/U[i,k] * V[k,j];\n        }\n    }\n return V;\n}\n// Inverse of a lower\
    \ triangular matrix\nstatic double[,] MatLowTriangleInv(double[,], L)\n{\n int\
    \ N = L.GetLength(0);\ndouble[,] V = new double[N,N];\nfor(int i=0;i<N-1; i++){\n\
    \    V[i,i] = 1.0/L[i,i];\n    for(int j=i+1;j<N; j++){\n        for(int k=i;k<j;\
    \ k++){\n            V[i,j] = -1.0/L[k,k] * V[i,k];\n        }\n    }\n} return\
    \ V;\n}\n```\n\nThe inverse of a matrix is found by straightforward multiplication\
    \ of the inverses of the upper and lower triangular matrices. This is accomplished\
    \ using the MinVLU() function.\n\n```\n// Inverse of a matrix through LU decomposition\n\
    static double[,] MinVLU(double[,], A)\n{\n LUStruct Mats;\n Mats = LU(A);\ndouble[,],\
    \ L = Mats.LM;\ndouble[,], U = Mats.UM;\ndouble[,], Uinv = MatUpTriangleInv(U);\n\
    double[,], Linv = MatLowTriangleInv(L);\ndouble[,], Ainv = MMMUlt(Uinv, Linv);\n\
    \ return Ainv;\n```\n\nFinally, the estimates of the regression coefficients in\
    \ Equation (8.5) are obtained using the C# function Beta().\n\n```\n// Regression\
    \ parameters\nstatic double[] Beta(double[,], double[,], y)\n{\ndouble[,], Xt\
    \ = MTrans(X);\ndouble[,], XtX1 = MinVLU(MMMUlt(Xt,X));\ndouble[,], Xty = MMMUlt(Xt,y);\n\
    \ return MMMUlt(XtX1,Xty);\n}\n```"
