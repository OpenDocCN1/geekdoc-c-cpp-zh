    The closed form European price is 17.6244, and the American prices obtained under
    the simulation schemes covered in this chapter are in Table 12.5.

    The schemes all point to an early exercise premium of roughly $0.20 and a price
    of roughly $17.82 for the American option using the control variate technique.


    # CONCLUSION


    The double Heston model is a convenient way to introduce flexibility in the model
    by allowing for additional parameters. The characteristic function of the double
    Heston model is a natural extension of the univariate counterpart. As such, obtaining
    the call price and Greeks in the double Heston model is only slightly more complicated
    than the original Heston (1993) model. Moreover, simulation schemes specifically
    designed for the original model translate easily to the double version. With these
    simulation schemes, it is straightforward to obtain American option prices with
    the LSM algorithm of Longstaff and Schwartz (2001).


    Other investigations of the double Heston model, or multifactor volatility versions
    of the model, include the double-lattice approach of Costabile et al. (2012),
    the multifactor volatility Wishart process de da Fonseca et al. (2008), and the
    variance curve approach of Buehler (2006).'
