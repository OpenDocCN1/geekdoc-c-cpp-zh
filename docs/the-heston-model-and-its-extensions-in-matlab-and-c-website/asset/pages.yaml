  md: "# Simulation of the Heston Model\n\nThe disadvantage of the reflection scheme\
    \ is that it reflects a large negative variance to a positive variance. Hence,\
    \ it transforms realizations of low volatility into high volatility.\n\nAnother\
    \ way to deal with negative simulated values of $v_i$ is to devise simulation\
    \ schemes for $v_i$ that do not produce negative values in the first place. Much\
    \ of the research on simulating the CIR variance in the Heston model is devoted\
    \ to this approach. Another way is to simulate $ln v_i$ or $\\sqrt{v_i}$, and\
    \ then exponentiate and square the result. For the stock price, we can simulate\
    \ $S_t$ itself, but we will see in this chapter that a better approach is to simulate\
    \ the log price $x_t = ln S_t$, instead, and then exponentiate.\n\nAll of the\
    \ simulation schemes for the Heston model contain the same basic steps. First,\
    \ two standard normal variables are generated, and made dependent using Cholesky\
    \ decomposition. These are multiplied by $\\sqrt{v_t}$ to make proxy Brownian\
    \ motion increments. Second, we obtain the updated value $v_{t+dt}$. Third, we\
    \ obtain the updated value $S_{t+dt}$ (or $x_{t+dt}$).\n\n+   **Step 0.** Initialize\
    \ $S_0$ to the spot price (or $x_0$, to the log price), and initialize $v_0$ to\
    \ the current variance parameter.\n\n+   **Step 1.** Generate two independent\
    \ normal variables $Z_1$ and $Z_2$, and define $Z_v = Z_1$ and $\bar{Z}_s = \r\
    ho Z_v + \\sqrt{1-\rho^2}Z_2$. The proxy Brownian motion by $dW_{s,t} = \\sqrt{v_t}Z_s$\
    \ and $dW_{v,t} = \\sqrt{v_t}Z_v$.\n\n+   **Step 2.** Obtain the updated value\
    \ $v_{t+dt}$.\n\n+   **Step 3.** Using $v_{t+dt}$, obtain the updated value $S_{t+dt}$\
    \ (or $x_{t+dt}$) and return to Step 1.\n\nNote that $Z_v$ and $\bar{Z}_s$ are\
    \ constructed so that $E[Z_v] = 0$, and $E[Z_v\bar{Z}_s] = \rho E[Z_1^2] + \\\
    sqrt{1-\rho^2}E[Z_12] = \rho$, as required.\n\nIn this chapter, we discuss some\
    \ discretization schemes for $(S_t, v_t)$. We assume that the time grid is discretized\
    \ using time increments that are equally spaced with $dt$.\n\n# EULER SCHEME\n\
    \nThe simplest way to discretize the process in Equation (7.3) is to use Euler\
    \ discretization. This is equivalent to approximating the integrals using the\
