  md: "# 12 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThese are Equations\
    \ (A7) in Heston (1993). The first equation in (1.47) is a Riccati equation in\
    \ $D_t$, while the second is an ordinary derivative for $C_t$ that can be solved\
    \ using straightforward integration once $D_t$ is obtained. Solving these equations\
    \ requires two initial conditions. Recall from (1, $\\phi$) the characteristic\
    \ function is\n\n```\n$f(\\phi; x_t, v_t) = E[e^{i\\phi x_t}] = \\exp(C(\\tau,\
    \ \\phi) + D(\\tau, \\phi)v_t + i\\phi x_t)$.$\n```\n\nAt maturity ($\tau = 0$),\
    \ the value of $x_t = InS_t$ is known, so the right-hand side will reduce to simply\
    \ $\\exp(i\\phi x_t)$. This implies that the initial conditions at maturity are\
    \ $D_t(0, \\phi) = 0$ and $C_t(0, \\phi) = 0$.\n\nFinally, when we compute the\
    \ characteristic function, we use $x_t$ as the log price of the underlying asset,\
    \ and $v_t$ as its unobserved initial variance. This last quantity is the parameter\
    \ $(x_0, v_0)$ described earlier in this chapter, and must be estimated. We sometimes\
    \ write $(x_t, v_t)$, or simply $(x, v)$.\n\n# 2. SOLVING THE HESTON RICCATI EQUATION\n\
    \nIn this section, we explain how the expressions in Equation (1.47) can be solved\
    \ to yield the called price. First, we introduce the Riccati equation and explain\
    \ how its solution is obtained. The solution can be found in many textbooks of\
    \ differential equations, such as that by Zwillinger (1997).\n\n# 2 The Riccati\
    \ Equation in a General Setting\n\nThe Riccati equation for $y(t)$ with coefficients\
    \ $P(t)$, $Q(t)$, and $R(t)$ is defined as\n\n```\n$$\\frac{dy(t)}{dt} = P(t)\
    \ + Q(t)y(t) + R(t)y(t)^2$.\n```\n\nThe equation can be solved by considering\
    \ the second-order ordinary differential equation (ODE) for $w(t)$\n\n```\n$w''\
    \ - [$\\frac{P'}{P} + Q]w' + PRw = 0$\n```\n\nwhich can be written as $w'' + bw'\
    \ + cw = 0$. The solution to Equation (1.49) is then\n\n```\n$y(t) = \\frac{w'(t)}{w(t)R(t)}$.\n\
    ```\n\nThe ODE in (1.50) can be solved via the auxiliary equation $r^2 + br +\
    \ c = 0$, which has two solutions $\\alpha$ and $\beta$ given by\n\n```\n$\\alpha\
    \ = \\frac{-b + \\sqrt{b^2 - 4c}}{2}, \\beta = \\frac{-b - \\sqrt{b^2 - 4c}}{2}$\n\
    ```\n\nThe solution to the second-order ODE in (1.50) is\n\n```\n$w(t) = Me^{\\\
    alpha t} + Ne^{\\beta t}$\n```"
  merge: -1
  img_proc: true
