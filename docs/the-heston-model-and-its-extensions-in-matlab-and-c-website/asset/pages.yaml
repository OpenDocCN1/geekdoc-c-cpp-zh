- pgno: 73
  md: '# Derivations Using the Fourier Transform


    Abstract


    The Heston model laid the foundation for the popularity of Fourier transforms
    in mathematical finance. Fourier transforms have now earned their place as crucial
    tools in pricing models for equity derivatives. This owes to the fact, in most
    cases, the terminal price density has no analytic structure. The characteristic
    function, on the other hand, is often readily available for many models, including
    the Heston model. The Heston model is a perfect illustration of why Fourier transforms
    are useful. Indeed, if the characteristic function is available to extract the
    probabilities from the characteristic function and obtain the call price using
    the Black-Scholes-style representation described in Chapter 2.


    The application of Fourier transforms to option pricing is not limited to obtaining
    probabilities, as is done in Heston''s 1993 original derivation. As explained
    by Wu (2008), the literature approaches Fourier transforms in option pricing in
    two broad ways. The first approach considers option prices to be analogous to
    cumulative distribution functions. This approach is adopted by Heston (1993),
    Carr and Madan (1999), Bakshi and Madan (2000), and others. The second approach
    considers option prices to be analogous to probability density functions. This
    is the approach of Lewis (2000) that we cover in Chapter 4.


    In this chapter, we show how to derive the call price using the Fourier transform.
    We follow the derivations described by Gatheral (2006) and Attari (2004). Next,
    we present the Carr and Madan (1999) representation of the Heston call price,
    a method in which the Fourier transform plays a key role. We also discuss the
    optimal choice of the damping factor that is required of their method.


    # THE FOURIER TRANSFORM


    There are several definition of the Fourier transform $\hat{f}$ of a function
    $f$. The one usually encountered in the mathematical finance literature and used
    by Carr and Madan (1999), Duffie, Pan, and Singleton (2000), and Zhu (2010), among
    others, is


    ```

    $\hat{f}(u) = \int_{-\}^{\infty} e^{iux} f(x) dx$ (3.1)

    ```'
