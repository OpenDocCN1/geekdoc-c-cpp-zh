- pgno: 386
  md: '# The Double Heston Model


    schemes along with the Least-Squares Monte-Carlo (LSM) algorithm of Longstaff
    and Schwartz (2001) to obtain the prices of American options, in the same way
    that the LSM algorithm was applied to the univariate Heston (1993) model in Chapter
    8. We can also apply the control variate technique by Hull and White (1988) and
    used by Beliaeva and Nawalka (2010) in their bivariate tree, which we encountered
    in Chapter 8. The control variate price of the American put is


    $Put_{True} = European Put_{True} + (American Put_{LSM} - European Put_{LSM})$


    We use the closed form of the double Heston model to calculate the true price
    of the European put.


    To implement the pricing of American puts with the LSM algorithm and the double
    Heston model, we first choose a simulation scheme among those covered in this
    chapter to generate a set of stock price paths. We then feed these stock paths
    into the LSM functions... Finally, we apply the control variate technique to obtain
    the price of the American put. The required Matlab and C# functions for the LSM
    algorithm are those described earlier in this chapter and in Chapter 8, and are
    not presented here.


    For example, suppose we use $N_s = 50000$ simulations along with $N_t = 1000$
    time steps per simulation to obtain the price of an American price, using the
    same settings used to create Table 12.2. This is accomplished with the following
    C# code.


    ```

    // Simulation settings

    string PutCall = "p";nint NS = 50000;

    int NT = 1000;

