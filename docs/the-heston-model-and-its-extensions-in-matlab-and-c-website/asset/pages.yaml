- pgno: 95
  md: '# Derivations Using the Fourier Transform


    integration in the second inner integral and its change, which will produce the
    first inner integral. We can define, regroup the two outer integrals to arrive
    at


    ```

    $$\hat{z}(v) = e^{-rt} \int_{-\infty}^{\infty} \left( e^{iw(v+1)k} - e^{ik+x}
    \right) dk \ q(x) dx. \quad (3.54)$

    ```


    The inner integral in (3.54) evaluates to


    ```

    $$\frac{e^{iw(v+1)}}{iw(v+1)} - \frac{e^{iv}}{iv} + \frac{1}{iv+1}$

    ```


    The Fourier transform in (3.54) can, therefore, be expressed in terms of expectations
    under the risk-neutral density $q(x)$


    ```

    $$\hat{z}(v) = e^{-rt} \left( \frac{E[e^{iw(v+1)}]}{iw(v+1)} - \frac{E[e^{iv}]}{iv}
    + \frac{1}{iv+1} \right)$

    ```


    Since the characteristic function is $\psi(v) = E[e^{iv}]$, we have $E[e^{iw(v+1)}]
    = \psi(v-i)$. Moreover, $q(x)$ is the risk-neutral density for $x = \ln S_T$,
    so we have $E[e^x] = S_0 e^{rt} = e^{rt}$, since we have assumed that $S_0 = 1$.
    This implies that the Fourier transform of $\hat{z}(k)$ can be written


    ```

    $$\hat{z}(v) = e^{-rt} \left( \frac{1}{iv+1} + \frac{\psi(v-i)}{v^2-iv} \right).
    \quad (3.55)$

    ```


    Finally, the price $z(k)$ of an OTM option with strike $K = e^k$ is obtained with
    the inverse Fourier transform, in a manner analogous to what what was done for
    the call in Equation (3.44) and for the put in Equation (3.50)


    ```

    $z(k) = \frac{1}{2\pi} \int_{-\infty}^{\infty} e^{-ikv}\hat{z}(v)dv = \frac{1}{\pi}
    \int_{-\infty}^{\infty} Re[e^{-ikv}\hat{z}(v)] dv. \quad (3.56)$

    ```


    Carr and Madan (1999) found out the integrand $\hat{z}(v)$ can become highly oscillatory
    for short maturities and for $k \approx 0$. Instead of basing their derivation
    on $z(k)$, Carr and Madan basing it on $y(k)=z(k)\sinh(\alpha k)$, which makes
    use of the damping factor $\alpha$, through the hyperbolic sin function $\sinh(x)=\frac{1}{2}(e^x-e^{-x})$.
    The Fourier transform of $y(k)$ is


    ```

    $$\hat{y}(v) = \int_{-\infty}^{\infty} e^{ivk}y(k)dk = \int_{-\infty}^{\infty}
    e^{ivk} \left( \frac{e^{\alpha k}-e^{-\alpha k}}{2} \right) z(k) dk$

    ```


    ```

    $$\frac{1}{2}\int_{-\infty}^{\infty} e^{i(v+\alpha)k}z(k)dk-\frac{1}{2}\int_{-\infty}^{\infty}
    e^{i(v-\\alpha)k}z(k)dk.$

    ```


    Recall that


    ```

    $$\hat{z}(v) = \int_{-\infty}^{\infty} e^{ivk}z(k)dk.$

    ```'
