- pgno: 168
  md: "Parameter Estimation\n\nKiln (2007) notes that the characteristic function\
    \ f(phi) does not depend on the strike K, but it does depend on the maturity t.\
    \ This implies that, in the optimization, the values of f1(phi) and f2(phi) can\
    \ be calculated once for each maturity, cached, and used repeatedly for the different\
    \ strikes. This is important because the term f(phi) is by far the one that requires\
    \ the most computation in the integrand, as it contains a number of complex operations,\
    \ logarithms, exponents, and square roots. Zhu (2010) refers to Kiln's Strike\
    \ Vector Computation, and Schmezele (2010) calls it the caching technique. Kiln\
    \ (2007) points out that, in order to work, the loop of the optimization must\
    \ be for the maturities and the inner loop for strikes. While coupled with a pricing\
    \ formula that requires a single integral, such as that by Atari (2004) or others\
    \ (2001), or by consolidating the integrals into a single integral, as did in\
    \ chapter 1, the caching technique leads to an estimation that is considerably\
    \ reduced.\n\nThe Matlab file HestonObjFunSVC implements the method of Kiln (2007)\
    \ using Gauss-Laguerre integration. Parts of the function have been removed to\
    \ conserve space. The function allows for original Heston (1993) and Attari (2004)\
    \ formulation of the characteristic function. The outer loop is for maturities\
    \ and the inner loop for strikes. At the beginning of each strike loop, we calculate\
    \ the value of the characteristic functions f1 and f2 at the Gauss-Laguerre abscissae\
    \ phi. We then retain these values, integrate the integrand at each of the strikes,\
    \ and calculate the call out put prices.\n\n```\nfunction y = HestonObjFunSVC(param,...,x,w,CF)\n\
    for t=1:NT\n  for j=1:length(x)\n% Store the c.f. at each time step\n    phi =\
    \ x(j);\n    if strcmp(CF, 'Heston')\n      f2(j) = HestonCF(phi, ...);\n    \
    \  f1(j) = HestonCF(phi-i,...) / (S*exp((rf-q)*T(T)));\n    elseif strcmp(CF,\
    \ 'Attari')\n      end = AttariCF(phi,...);\n  end\nfor k=1:NK\n  L = log(exp(-rf*T(k))*K(k)/S);\n\
    \  for j=1:length(x)\n    phi = x(j);\n    if strcmp(CF, 'Heston')\n      int1(j)\
    \ = w(j) * real(\n        (exp(-i*phi*log(K(k))*f1(j)/i);\n      int2(j) = w(j)\
    \ * real(\n        (exp(-i*phi*log(K(k))*f2(j)/i);\n    elseif strcmp(CF, 'Attari')\n\
    \      int1(j) = w(j) * ((real(f(j)) + imag(f(j)))/phi)\n        *cos(L*phi);\n\
    \  end\nend\n% The call price\nif strcmp(CF, 'Heston')\n  P1 = 1/2 + 1/pi*sum(int1)\n\
    \  P2 = 1/2 + 1/pi*sum(int2);\n```"
