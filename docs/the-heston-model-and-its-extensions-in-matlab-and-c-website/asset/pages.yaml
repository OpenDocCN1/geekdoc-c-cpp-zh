  md: "# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_49_0.png)\n\
    \n**Figure 2.7** Effect of Volatility of Variance on Heston Prices Relative to\
    \ Black-Scholes\n\n# Heston Implied Volatility\n\nAnother feature of the Heston\
    \ model is that implied volatilities extracted from option prices will show a\
    \ smile or skew. The shape of the skew is driven by the values of the parameters.\
    \ The correlation parameter $\\rho$, $\\rho > 0$ corresponding to a positive slope,\
    \ and $\\rho < 0$ to a negative slope. This is illustrated in the first panel\
    \ of Figure 2.8 by generating implied volatilities using $S=100$, $r=0.05$, $\t\
    au=0.25$, $\\kappa=2$, $\theta=0.01$, $\\sigma=0$, and $v_0=0.01$ over the strike\
    \ range $95$ to $105$.\n\nEquity options usually show a negative slope in their\
    \ implied volatilities. Not surprisingly, when other data are used to estimate\
    \ the parameters of the Heston model, the correlation will in most cases out to\
    \ be negative.\n\nIncreasing values of volatility $\\sigma$ increases the curvature\
    \ of the smile. This is illustrated in the second panel of Figure 2.8, which uses\
    \ the same settings with $\\rho=0$. Finally, the parameters $\\kappa$, $\\theta$\
    \ and $v_0$ control the level of the smile, as illustrated in the remaining panels\
    \ of Figure 2.8. The mean reversion speed $\\kappa$ also controls the curvature,\
    \ to a certain extent, with higher values of $\\kappa$ flattening the implied\
    \ volatility.\n\nTo generate the implied volatilities, we first create Heston\
    \ prices using the Matlab function HestonPriceGaussLaguerre over a range of strikes\
    \ $K$. This function uses the Gauss-Laguerre quadrature for numerical integration,\
    \ which we cover in Chapter 5."
