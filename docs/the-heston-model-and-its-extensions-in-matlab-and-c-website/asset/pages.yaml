  md: "# TABLE 6.4 Comparison of Estimation Methods\n\n| Estimation Method | IVMSE\
    \ | $k$ | $\\hat{\theta}$ | $\\hat{\\alpha}$ | $\\hat{\nu}_0$ | $\\hat{\rho}$\
    \ | Estimation Time (sec) |\n|---|---|---|---|---|---|---|\n| FRFT | $9.57 \\\
    times 10^{-6}$ | 1.6691 | 0.0932 | 0.9076 | 0.0339 | -0.8013 | 1.88 |\n| DE |\
    \ $5.95 \\times 10^{-6}$ | 1.6167 | 0.0969 | 0.9665 | 0.0345 | -0.7734 | 120.36\
    \ |\n\nThe Differential Evolution algorithm is particularly useful when we have\
    \ poor starting values. However, with even values, the algorithm will converge\
    \ to the global optimum, albeit at the requirement of many iterations. We run\
    \ the HestonDem function on the S&P500 data used to create Table 6.1, and using\
    \ the MSE loss function. Following Vollrath and Wendland (2009), we set the number\
    \ of population parameters 15 times the number of parameters so that $N_p = 75$,\
    \ we set the crossover ratio to $CR = 0.5$, the mutation factor to $F = 0.8$,\
    \ and the number of generations as $N_g = 200$. We use starting values equal to\
    \ 1 for all parameters. We compare the DE parameter estimates to those obtained\
    \ using Table 6.4.\n\nAs expected, the DE method is much slower than estimation\
    \ using the FRFT. The DE parameter estimates, however, are more accurate since\
    \ their IVMSE is smaller. Moreover, they are consistent with the estimates in\
    \ Table 6.1.\n\n# MAXIMUM LIKELIHOOD ESTIMATION\n\nWhen there exists a set of\
    \ liquid and reliable market quotes of option prices or implied volatilities,\
    \ estimation through loss functions is feasible. If there are no such quotes,\
    \ however, alternate likelihood methods must be used. Atiya and Wall (2009) show\
    \ how to obtain the maximum likelihood estimates of the financial parameters of\
    \ the Heston model using a series of historical stock prices. Recall that, under\
    \ risk-neutral, the log-stock price $x_t = \\ln S_t$ and variance $v_t$ follow\
    \ the bivariate stochastic differential equation\n\n```\n$dx_t = (r - q - \\frac{1}{2}v_t)dt\
    \ + \\sqrt{v_t}dW_{1,t}$\ndv_t = \\kappa(\\theta - v_t)dt + \\sigma\\sqrt{v_t}dW_{2,t}$$\n\
    ```\n\nWith $E[dW_{1,t}dW_{2,t}] = \\rho dt$, the transition probability density\
    \ for the joint log-stock price/variance process from time $t$ to $t+1$ is a bivariate\n\
    \n```\n$p(x_{t+1}, v_{t+1}|x_t, v_t) = \\Phi_2(\\mu_{t+1}, \\Sigma_{t+1})$\n```\n\
    \nwhere $\\Phi_2(\\mu_{t+1}, \\Sigma_{t+1})$ is the bivariate normal distribution\
    \ with mean vector\n\n```\n$\\mu_{t+1} = \\begin{bmatrix} x_t + (r - q - \\frac{1}{2}v_t)dt\
    \ \\ v_t + \\kappa(\\theta - v_t)dt \\end{bmatrix}$\n```"
