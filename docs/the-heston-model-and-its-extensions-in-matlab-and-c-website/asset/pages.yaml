  md: "# 268 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nis different.\
    \ Hence, to solve for the $v_t$ coefficient in the bivariate characteristic function,\
    \ first we we set $\tau=0$ along with $C(0,\\phi_1,\\phi_2) = i\\phi_2$ in the\
    \ general solution of Equation (9.1) to obtain\n\n```\n$i\\phi_2 = -\\frac{2}{\\\
    sigma^2} \\left( \\frac{K_2\\alpha_2+\beta_2}{K_2+1} \right). (9.26)$\n```\n\n\
    We then solve for $K_2$\n\n```\n$\\widetilde{K}_2 = -\\frac{2\beta_2+i\\phi_2\\\
    sigma^2}{2\\alpha_2+i\\phi_2\\sigma^2} = -\\frac{b_2-\rho\\sigma\\phi_1+d_2-i\\\
    phi_2\\sigma^2}{b_2-\rho\\sigma\\phi_1-d_2-i\\phi_2\\sigma^2}. (9.27)$\n```\n\n\
    Since $\\alpha_2$ and $\beta_2$ are constructed from the quantities in (9.25),\
    \ which are functions of $\\phi_1$ but not of $\\phi_2$,\n\n```\n$\\alpha_2 =\
    \ \\frac{-b_2+\rho\\sigma\\phi_1+d_2}{2}, \\beta_2 = \\frac{-b_2-\rho\\sigma\\\
    phi_1-d_2}{2}. (9.28)$\n```\n\nNote that $\\widetilde{K}_2$ in Equation (9.27)\
    \ is identical to $\\widetilde{K}_2$ in (9.7) for $j=2$, with $D_j^i$ replaced\
    \ by $i\\phi_2$. By setting $\tilde{g}_2=-\\widetilde{K}_2$ and substituting in\
    \ the general solution of Equation (9.1) produces the solution for $C(\tau,\\\
    phi_1,\\phi_2)$, in which we have $\\lambda=0$ in $b_2$,\n\n```\n$C(\tau,\\phi_1,\\\
    phi_2) = \\frac{(\\kappa-\rho\\sigma\\phi_1+d_2)(\\kappa-\rho\\sigma\\phi_1-d_2)\t\
    ilde{g}_2e^{d_2\tau}}{\\sigma^2(1-\tilde{g}_2e^{d_2\tau})}. (9.29)$\n```\n\nIn\
    \ this expression, $C(\tau,\\phi_1,\\phi_2)$ is identical to $\\widetilde{D}(\\\
    phi,\tau)$ defined in (9.8) for $j=2$, but again, with $D_j^i$ replaced by $i\\\
    phi_2$. We obtain $A(\tau,\\phi_1,\\phi_2)$ by integrating the first equation\
    \ in (9.23), and by using the initial condition $A(0,\\phi_1,\\phi_2)=0$, exactly\
    \ as in Chapter 1\n\n```\n$A(\tau,\\phi_1,\\phi_2) = (r-q)i\\phi_1\tau+\\kappa\\\
    left[ \\frac{Q_2+d_2}{\\sigma^2}\\int_0^\tau \\frac{1}{1-\tilde{g}_2e^{d_2y}}dy\
    \ - \\ \\frac{Q_2-d_2}{\\sigma^2}\\int_0^\tau \\frac{\tilde{g}_2e^{d_2y}}{1-\t\
    ilde{g}_2e^{d_2y}}dy+k_1 \right]. (9.30)$\n```\n\nBoth integrals in (9.30) can\
    \ be evaluated by substitution of $x=\\exp(d_2y)$ and partial fractions, exactly\
    \ as in Chapter 1. After substituting the integrals and for $d_2$ and $Q_2$, and\
    \ applying the initial condition $A(0, \\phi_1, \\phi_2)=0$ to produce $k_1=0$\
    \ we end up with the solution for $A(\tau,\\phi_1,\\phi_2)$\n\n```\n$A(\tau,\\\
    phi_1,\\phi_2) = (r-q)i\\phi_1\tau+\\frac{\\kappa\theta}{\\sigma^2}\\left[(\\\
    kappa-\rho\\sigma\\phi_1+d_2)\tau-2\\ln\\left(\\frac{1-\tilde{g}_2e^{d_2\tau}}{1-\t\
    ilde{g}_2}\right)\right]. (9.31)$\n```\n\nFinally, we note that $A(\tau,\\phi_1,\\\
    phi_2)$ is equivalent to $\\widetilde{C}_1(\\phi,\tau)$ in Equation (9.9), but\
    \ with $C_0^i=0$ and $D_0^i=i\\phi_2$."
