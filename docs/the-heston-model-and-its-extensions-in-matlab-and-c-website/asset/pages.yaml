  md: "# Time-Dependent Heston Models\n\nThese are used in the Matlab function ElicesCF.m,\
    \ which calculates the characteristic function in Equation (9.45). The parameters\
    \ for the current maturity are passed in the vector parameter, while the parameters\
    \ of the prior priorities are passed in the matrix paramfixed. The initial variance\
    \ parameter estimate is passed as an argument to the function. The maturity increments\
    \ are passed in the vector tau, the increment for the shortest maturity in the\
    \ top position of the vector. The first portion of the function calculates the\
    \ coefficients $\\phi_t^i$ recursively, going backwards from the last maturity\
    \ value $\\phi_T^i=0$.\n\n```\nfunction y = ElicesCF(phil,param, paramfixed,v0,tau,...)\n\
    % Maturity increments\nN = length(tau);\n% phi2 coefficients vector.\nphi2(N)\
    \ = 0;\nif N>=2\nphi2(N-1) = -i*C(phil,phi2(N),param,tau(N),S,trap);\nif N>=3\n\
    for t=N-2:-1:1\nphi2(t) = -i*C(phil,phi2(t+1),paramfixed(t+1,:),tau(t),...);\n\
    if N>=2\nphi20 = -i*C(phil,1),paramfixed(1,:),tau(1),...);\nelse\nphi20 = -i*C(phil,1),param,tau(1)...);\n\
    end\n```\n\nThe next part of the function calculates the coefficients $A(\tau_r,\
    \ \\phi_i, \\phi_2^i; \\Theta_j)$ and $C(\tau_r, \\phi_i, \\phi_2^i; \\Theta_j)$,\
    \ and returns the characteristic function.\n\n```\n% A coefficients. % Current\
    \ params\nAh(N) = A(phil,0,param,tau(N),r,q,trap);\nif N>=2\nfor t=N-1:-1:1\n\
    Ah(t) = A(phil,phi2(t),paramfixed(t,:),tau(t),r,q,trap);\n% C coefficient\nif\
    \ N>=2\nCh = C(phil,phi20,paramfixed(1,:),tau(1),...);\nelse\nCh = C(phil,phi20,param,tau(1),...);\n\
    end\n% Characteristic function\ny = exp(sum(Ah) + i*phil*x0 + Ch*v0);\n```"
