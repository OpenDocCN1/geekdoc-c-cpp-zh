  md: "# 44 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nWe use a strip\
    \ of market prices for options with identical maturities to estimate the Heston\
    \ parameters and obtain the fair strike variance from Equation (2.23). If the\
    \ replication algorithm described in Demeterfi (1999) and others is applied to\
    \ the same set of options, we should obtain a fair strike that is identical, in\
    \ principle at least. The level of agreement between both strikes will depend\
    \ on how well the Heston model fits them, and on the interpolation and extrapolation\
    \ methods used in the replication algorithm.\n\nThe matlab file VarianceSwap.m\
    \ implements the replication algorithm of Demeterfi (1999). The function requires\
    \ vectors of ATM calls and puts with implied volatilities.\n\n```\nfunction y\
    \ = VarianceSwap(KCI, CallVI, PutVI,S,T,rf,q)\nSb = S % Take ATM as the boundary\
    \ point\nf = @(S, Sb, 2/T*((Sb - Sb) / log(S/Sb)));\n% Calls\nfor i=1:n-1\n  Temp(i)\
    \ = f(KCI(i+1),Sb,T) - f(KCI(i),Sb,T) - ...;\n  if i=1\n    CallWeight(i) = Temp(i)\n\
    \  end\n  CallValue(i) = BSC(S,KCI(i),rf,0,CallVI(i);\n  if i>1\n    CallValue(i)\
    \ = Temp(i) - Temp(i-1);\n  end\n  CallContrib(i) = CallValue(i)*CallWeight(i);\n\
    end\nPi1 = sum(CallContrib);\n% Puts\nn = length(PutVI);\nKPI = fliplr(KPI);\n\
    PutVI = fliplr(PutVI);\nfor i=1:n-1\n  Temp(i) = f(KPI(i+1),Sb,T) - f(KPI(i),Sb,T)\
    \ - ...;\n  if i=1\n    PutWeight(i) = Temp(2);\n  end\n  PutValue(i) = BPS(S,KPI(i),rf,0,PutVI(i);\n\
    \  if i>1\n    PutWeight(i) = Temp(i) - Temp(i-1);\n  end\n  PutContrib(i) = PutValue(i)\
    \ * PutWeight(i);\nend\nPi2 = sum(PutContrib);\nPi_CP = Pi1 + Pi2;\nKvar = 2/T*(rf*T\
    \ - (S/Sb*exp(rf*T) - 1) + ...);\ny = Kvar;\n```\n\nThe replication algorithm\
    \ of Demeterfi et al. (1999) is coded in the C# function VarianceSwap().). The\
    \ code is very similar to this, but not presented here. The\n\n> We thank Jim\
    \ Gather for pointing this out."
