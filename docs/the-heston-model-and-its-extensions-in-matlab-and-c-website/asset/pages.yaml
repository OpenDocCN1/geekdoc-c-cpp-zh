  md: "# Time-Dependent Heston Models\n\nas inputs a vector of parameter estimates\
    \ obtained in the prior time steps, stored in the matrix param0, with the parameter\
    \ estimates arranged in rows. The estimates from the most recent time step are\
    \ in the top row, and the oldest estimates are in the bottom row. It also accepts\
    \ vector of prior maturities (tau0), with the most recent maturity on tau, and\
    \ the oldest at the bottom. The function returns the integrand for the probabilities\
    \ $P_1$ and $P_2$.\n\n```\nfunction y = MNPrf(phi,param,param0,tau,tau0,...)\n\
    N = length(tau0);\nC = 0;\n% Create the past Cj and Dj values for the old maturities\n\
    for t=1:N\nkappa = param0(t,1);\ntheta = param0(t,2);\nsigma = param0(t,3);\n\
    v0 = param0(t,4);\nrho = param0(t,5);\nT = tau0(t);\nif t==1\nD0 = 0; C0 = 0;\n\
    else\nD0 = D; C0 = C;\nend\nC = Ct(phi,...,C0,D0);\nD = Dt(phi,...,C0,D0);\nend\n\
    % Cj and Dj values for a single maturity\nif N=0\nD0 = 0; C0 = 0;\nelse\nD0 =\
    \ D; C0 = C;\nend\nC = Ct(phi,...,C0,D0);\nD = Dt(phi,...,C0,D0);\nf = exp(C +\
    \ D*v0 + i*phi*x);\ny = real(exp(-i*phi*log(K))*f/i);\n```\n\nThe function used\
    \ of the Matlab functions Cr.m and Dr.m, which construct $\bar{C}(\\phi_i, \t\
    au_i)$ and $\bar{D}(\\phi_i, \tau_i)$, respectively, from (9.38).\n\n```\nfunction\
    \ C = Ct(phi,...,C0,D0)\nd = sqrt(rho*sigma*i*phi + d)^2 - sigma^2); ...\ng =\
    \ (b - rho*sigma*i*phi + d - D*sigma^2); ...\nG = (1 - g*exp(d*T))/(1-g); ...\n\
    C = (rf-q)*i*phi*T - kappa*theta*sigma^2; ...\nfunction D = Dt(phi,...,C0,D0)\n\
    d = sqrt(rho*sigma*i*phi + d)^2 - sigma^2); ...\ng = (b - rho*sigma*i*phi + d\
    \ - D*sigma^2); ...\nG = (1 - g*exp(d*T))/(1-g); ...\nD = ((b - rho*sigma*i*phi)*(1-g*exp(d*T))\
    \ + ...;\n```"
