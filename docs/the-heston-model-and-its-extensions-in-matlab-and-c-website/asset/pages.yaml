  md: "# Derivations using the Fourier Transform\n\nLee (2004b) also suggests selecting\
    \ the damping factor with a minimization procedure. In his approach, $\\alpha$\
    \ is chosen by simultaneously minimizing two errors that occur when the integral\
    \ in Equation (3.44) is evaluated numerically: truncation error, which arises\
    \ because the upper limit of the numerical integral is finite, and sampling error,\
    \ which arises because the integrand is evaluated only the grid points of any\
    \ numerical integration scheme. Readers are referred to the paper for details.\n\
    \nFinally, the C# code to find $A_X = (a_-, a_+)$ and $\\alpha^*$ is similar to\
    \ the Matlab code. We invoke the Nelder-Mead algorithm twice, with an objective\
    \ function based on Equation (3.45) to find $a_-$ and $a_+$, and again with the\
    \ objective function in (3.48) to find $\\alpha^*$. In C#, we need the following\
    \ code to select the objective function which we subsequently passed to the Nelder-Mead\
    \ function), which is presented in Chapter 6.\n\n```\n// Objective function is\
    \ Roger's G*exp(d*Tau) function\n// Lord and Kahl's optimal alpha function\nstatic\
    \ double f(double[] x, double[] param) {\n    if (GlobalVars.ObjFunction == \"\
    RogerLee\") {\n        return RogerLeeGexp(x[0], kappa, rho, sigma, tau);\n  \
    \  } else if (GlobalVars.ObjFunction == \"LordKahl\") {\n        return LordKahlFindalpha(x[0],...);\n\
    \    }\n}\n```\n\nWe select Lee's (2004a) as the objective function and $A_X =\
    \ (a_-, a_+)$ with the following code.\n\n```\n// Select the Lee function as the\
    \ obj fun\nGlobalVars.ObjFunction = \"RogerLee\"\n// Calculate lower limit of\
    \ the range Ax\ndouble[] AxLo = NelderMead(f,s1,...);\n// Calculate uper limit\
    \ of the range Ax\ndouble[] AxHi = NelderMead(f,s2,...);\n```\n\nNext, we select\
    \ Lord and Kahl's (2007) as the objective function and find $\\alpha^*$ with the\
    \ following code.\n\n```\n// Select the KahlLord function as the obj fun\nGlobalVars.ObjFunction\
    \ = \"LordKahl\"\n// Lord and Kahl optimal alpha\ndouble[] AlphaOptimal = NelderMead(f,s3,...);\n\
    ```\n\nWith the settings used at the beginning of this section, the C# returns\
    \ the same optimal value of $\\alpha^* = 6.6233."
