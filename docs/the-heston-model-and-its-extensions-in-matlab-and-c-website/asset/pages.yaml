    ight] du. \\quad (3.37)$\n```\n\nWe have substituted $l = Ke^{-rt}/S$ and thus\
    \ we only need to consider the real part of the integrals. In the bracket term\
    \ of the last integral in (3.37), multiply the second fraction by $u-i$ in the\
    \ numerator and denominator. The integrand becomes\n\n```\n$\\Re \\left[ \\varphi_2(u)\
    \ \\frac{e^{-int}}{u^2+1} \right]. \\quad (3.38)$\n```\n\nNow expand $\\varphi_2(u)\
    \ = R_2(u) + il_2(u)$ where $R_2(u)$ and $l_2(u)$ are the real and imaginary parts\
    \ of $\\varphi_2(u)$, respectively, and $e^{-int} = \\cos(ul) - i\\sin(ul)$. Substitute\
    \ this into the integrand (3.38) and regroup the terms. The integrand becomes\n\
    \n```\n$A(u) = \\frac{R_2(u) + l_2(u)}{u} \\cos(ul) + \\left( l_2(u) - \\frac{R_2(u)}{u}\
    \ \\right) \\sin(ul)}{1+u^2} \\quad (3.39)$\n```\n\n```\n$C(K) = S_t - \\frac{1}{2}Ke^{-rt}\
    \ - \\int_0^{\\infty} \\pi A(u) du. \\quad (3.40)$\n```\n\nRecall that in Attari\
    \ (2004), the logarithm of the terminal stock price in $\\ln S_t = \\ln S_0 +\
    \ rt + x(t,T)$ and the characteristic function $\\varphi_2(u)$ is for $x = x(t,T)$\
    \ and not for $\\ln S_t$. Consequently, to express the integrand in Equation (3.39)\
    \ in terms of the Heston (1993) characteristic function for $\\ln S_t$, we see\
    \ the fact that\n\n```\n$E[e^{iu\text{x}(t,T)}] = E^{iu\\ln S_t}] \\exp[-iu(\\\
    ln S_t + rt)]$.\n```\n\nHence, in (3.39) we set\n\n```\n$\\varphi_2(\tau,u) =\
    \ f_2(\tau,u) \times \\exp[-iu(C_2(\tau,u) + D_2(\tau,u)u_0 - iurt)]$\n```\n\n\
    where $f_2(u)$ is the Heston (1993) characteristic function defined in Chapter\
    \ 1, with $j=2$. Note that Attari is identical to $f_2(u)$, except that the term\
    \ $\\ln S_t$ in $f_2(u)$ is replaced with $-iurt$. This means that $\\varphi_2(u)$\
    \ is independent of the spot price $S_t$. The main advantage of Attari’s representation\
    \ is that a single numerical integration only is required to produce the call\
    \ price. Moreover, the $u^2$ term in the denominator of $A(u)$ causes the integrand\
    \ in the integral to dampen quickly, so that truncation of the upper limit in\
    \ the integral for the purposes of numerical integration causes less of precision.\
