    \ The pole $k=0$ lies at the origin, and the pole $k=i$ lies at the point $(k_i,\
    \ k) = (0, 1)$.\n\nLewis (2001) shows how variations on the call price arise by\
    \ modifying the contour. If we move the integration contour in Equation (4.31)\
    \ to another value $v_i\\in(0,1)$, say, instead of $\beta>1$, then we include\
