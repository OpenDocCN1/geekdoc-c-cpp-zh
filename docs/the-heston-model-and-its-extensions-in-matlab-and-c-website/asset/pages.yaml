  md: "# 278 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhere N is the\
    \ number of quoted volatilities used in the estimation, $IV_{it}$ is the quoted\
    \ implied volatility at the k-th strike and t-maturity, and $IV_{it}$ is the implied\
    \ volatility using the piecewise constant parameter estimates.\nThe MSE parameter\
    \ estimates obtained from the time-dependent model, and those obtained from the\
    \ static model, are presented in Table 9.2, along with the estimation error. For\
    \ each maturity, we fit Heston call prices under both models, and we obtained\
    \ volatilities from each set of prices. These are plotted in Figure 9.1, along\
    \ with the implied quality. The table and figure both show that the time-dependent\
    \ model provides a closer fit to the market volatilities than the static model,\
    \ especially at short maturities.\n\n# ELICES MODEL\n\nThe time-dependent models\
    \ of Elices (2009) and Mikhailov and Nogel (2003) both use of a recursive calculation\
    \ on the bivariate characteristic function, presented in Afshani (2010) and Kahl\
    \ and Lord (2010), however, this calculation is more clearly illustrated. Recall\
    \ from Equations $(x_t, \nu_t)$\n\n```\n$f(\\phi_1, \\phi_2, \\tau, x_t, \\nu_t)\
    \ = E[\\exp(i\\phi_1x_t + i\\phi_2\\nu_t)|F_{\tau}] = \\exp(A(\\tau, \\phi_1,\
    \ \\phi_2) + i\\phi_1x_t + C(\\tau, \\phi_1, \\phi_2)\\nu_t)$ \\(9.42)\n```\n\n\
    where $\tau = T - t$ is the maturity. As before, we are given that the N maturities\
    \ $0 < T_1 < T_2 < ... < T_N < \\infty$ and that the time axis $[0, T_N]$ is divided\
    \ into the increments $\tau_1, \\tau_2, ..., \\tau_N$ where $\tau_k = T_k - T_{k-1}$\
    \ for $k = 2, ..., N$ and with $\tau_1 = T_1$. Define $x_t, \\nu_t$ and $F_t$\
    \ to represent $x_t, \\nu_t$, and each evaluated at $T_k$. Kahl and Lord (2010)\
    \ apply the law of expectations by conditioning on the information at $T_{N-1}$\
    \ to obtain the characteristic function for $x_N$\n\n```\n$E[exp(i\\phi_Nx_N)]\
    \ = E[exp(i\\phi_Nx_N)|F_{N-1}] = E[(\\phi_1, \\tau_{N-1}, x_{N-1}, \\nu_{N-1})]\
    \ = E[A(\\tau_{N-1}, \\phi_N, 0) + i\\phi_Nx_{N-1} + C(\\tau_{N-1}, \\phi_N, 0)\\\
    nu_{N-1}] = E[A(\\tau_{N-1}, \\phi_N, 0)]E[exp(i\\phi_Nx_{N-1} + i\\phi_N^2\\\
    nu_{N-1})]$ \\(9.43)\n```\n\n$\\phi_{N-1}^2 = -iC(\\tau_{N-1}, \\tau_{N-1}, 0)$.\
    \ Recognizing the second argument of the bivariate characteristic can be written\
    \ in this form is the trick that makes the recursive calculation possible. Now\
    \ apply the law of expectations to get the last term of the equation in (9.43),\
    \ for $F_{N-2}$. We obtain\n\n```\n$E[exp(i\\phi_Nx_N)] = exp(A(\\tau_{N-1}, \\\
    phi_N, 0))E[E[exp(i\\phi_Nx_{N-1} + i\\phi_N^2\\nu_{N-1})|F_{N-2}]]$\n```"
