  md: "# Time-Dependent Heston Models\n\n# 267\n\nrespect $x, v,$ and $\tau$, substituting\
    \ them into the PDE (9.20), and eliminating $f$ from both sides of the resulting\
    \ equation, which produces\n\n```\n$$\\left(-\\frac{\\partial A}{\\partial \\\
    tau} + \\frac{\\partial B}{\\partial \\tau}x - \\frac{\\partial C}{\\partial \\\
    tau}\\right) + \\rho vBC + \\frac{1}{2}vB^2 + \\frac{1}{2}\\sigma^2v^2\\\\\\+\\\
    left(r-\\frac{1}{2}v\\right)B+\\kappa(\\theta-v)C=0.\\quad (9.21)$\n```\n\nGrouping\
    \ terms to $x$ and common to $v$, and equating each set of terms in zero results\
    \ in the equations\n\n```\n$$\\frac{\\partial A}{\\partial \\tau}=rB+\\kappa\\\
    theta C$\\nn$\\frac{\\partial B}{\\partial \\tau}=0\\quad (9.22)$\\\n$\\frac{\\\
    partial C}{\\partial \\tau}=\\frac{1}{2}\\sigma^2C^2+(\rho\\sigma B-\\kappa)C+\\\
    frac{1}{2}B^2-\\frac{1}{2}B.$\n```\n\nThese equations are identical to those given\
    \ by the result of Duffie, Pan, and Singleton (2000) in Equation (9.17), except\
    \ for the sign which has been reversed. This is because, in (9.22), we are differentiating\
    \ with respect to the time of maturity $T=T-t$, in (9.17), the derivative is respect\
    \ with respect to $t$.\n\nTo solve the system of equations in (9.22), first note\
    \ that the second equation along the boundary condition $B(0,\\phi_1,\\phi_2)=\\\
    phi_1$ implies $B(T,\\phi_1,\\phi_2)=\\phi_1$. After substituting for $B$, this\
    \ leaves us the\n\n```\n$$\\frac{\\partial A}{\\partial \\tau}=rt\\phi_1+\\kappa\\\
    theta C$\\quad (9.23)$\n```\n\n```\n$$\\frac{\\partial C}{\\partial \\tau}=-\\\
    frac{1}{2}\\phi_1(\\phi_1+t)-(\\kappa-\\rho\\sigma\\phi_1)C+\\frac{1}{2}\\sigma^2C^2.$\n\
    ```\n\nThe second equation in Equation (9.23) is a Riccati equation that can be\
    \ solved using the method described in Chapter 1. We can write this equation as\n\
    \n```\n$$\\frac{\\partial C}{\\partial \\tau}=P_2-Q_2C+RC^2\\quad (9.24)$\n```\n\
    \nwhere\n\n```\n$$\\P_2=-\\frac{1}{2}\\phi_1(\\phi_1+t),Q_2=\\kappa-\\rho\\sigma\\\
    phi_1,R=\\frac{1}{2}\\sigma^2.\\quad (9.25)$\n```\n\nThe coefficients in (9.25)\
    \ are exactly those of the Riccati coefficients $P_j, Q_j,$ and $R_j$ for $j=2$\
