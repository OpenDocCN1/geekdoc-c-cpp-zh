  md: "# Parameter Estimation\n\n**Step 2.** Expansion Rule. If $f(\\mathbf{x}_k)\
    \ \\le f(\\mathbf{x}_0)$, calculate the expansion point\n\n$\\mathbf{x}_e = \b\
    ar{x} + \\gamma(\\mathbf{x}_n - \bar{x})$\n\nIf $f(\\mathbf{x}_e) \\le f(\\mathbf{x}_n)$,\
    \ replace $\\mathbf{x}_n$ with $\\mathbf{x}_e$ and proceed to the next iteration\
    \ in Step 0. If $f(\\mathbf{x}_e) > f(\\mathbf{x}_n)$, replace with the reflection\
    \ point $\\mathbf{x}_r$, and proceed to the next iteration.\nIf $f(\\mathbf{x}_r)\
    \ > f(\\mathbf{x}_0)$, continue to Step 3.\n\n**Step 3.** Outside Contraction\
    \ Rule. Calculate the outside contraction point\n\n$\\mathbf{x}_{ic} = \bar{x}\
    \ + \\gamma(\\mathbf{x}_n - \bar{x})$\n\nIf $f(\\mathbf{x}_{n-1}) \\le f(\\mathbf{x}_n)$\
    \ and $f(\\mathbf{x}_{ic}) < f(\\mathbf{x}_n)$, replace $\\mathbf{x}_n$ with $\\\
    mathbf{x}_{ic}$ and proceed to the next iteration in Step 0. Otherwise, continue\
    \ to Step 4.\n\n**Step 4.** Inside Contraction Rule. Calculate the inside contraction\
    \ point\n\n$\\mathbf{x}_{ic} = \bar{x} + \\gamma(\\mathbf{x}_n - \bar{x})$\n\n\
    If $f(\\mathbf{x}_n) \\le f(\\mathbf{x}_i)$ and $f(\\mathbf{x}_{ic}) < f(\\mathbf{x}_{n-1})$,\
    \ replace $\\mathbf{x}_n$ with $\\mathbf{x}_{ic}$ and proceed to the next iteration\
    \ in Step 0. Otherwise, continue to Step 5.\n\n**Step 5.** Shrinkage. Replace\
    \ $\\mathbf{x}_n$ with $\\mathbf{x}_n + \\sigma(\\mathbf{x}_i - \\mathbf{x}_n)$\
    \ for $i = 1, \\dots, n$. Note that the best point $\\mathbf{x}_n$ does not undergo\
    \ shrinkage.\n\nStandard values for the coefficients in the steps described are\
    \ $\rho = 2$ for reflection, $\\gamma = 1/2$ for contraction, and $\\sigma = 1/2$\
    \ for shrinkage.\nThe Nelder-Mead algorithm runs when the number of iterations\
