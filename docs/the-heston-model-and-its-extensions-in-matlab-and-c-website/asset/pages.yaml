- pgno: 101
  md: '# The Fundamental Transform for Pricing Options


    Abstract


    In his excellent book, Option Valuation Under Stochastic Volatility: With Mathematica
    Code, Alan Lewis (2000) offers a powerful valuation approach that is applicable
    to a wide range of European options. His method requires that the fundamental
    transform, a generalization of the characteristic function that allows complex
    arguments, be available. It also requires the Fourier transform of the option
    payoff. Since payoff transforms are available for a wide set of options, however,
    Lewis'' approach is readily applicable to path independent European options of
    various sorts. The advantage of this approach over other approaches that use Fourier
    transforms is that, the fundamental transform of a given model is obtained, it
    can be repeated to price European options for which the payoff transform is much
    easier to obtain than the Fourier transform of the option price itself.


    In this chapter, we explain Lewis'' fundamental transform approach for option
    valuation, and we also present his paper (Lewis, 2001) that uses Parseval''s identity
    to obtain option prices. In that paper, simple variations in the contours of integrations
    give rise to different forms of the call price encountered in the literature.
    Finally, we present Lewis (2000) volatility of volatility series expansion, an
    approximation that allows the Heston price of European options to be calculated
    quickly and without the need for numerical integration.


    # THE PAYOFF TRANSFORM


    In the following sections, we present the fundamental transform approach of Lewis
    (2000) for pricing options. In his approach, the Fourier transform of the option
    value is not required, only the Fourier transform of the option payoff. This simplification
    allows for the pricing of options under a general setting. The approach, however,
    does require the fundamental transform. The Lewis (2000) recipe for pricing options
    requires two transforms


    +   1. The payoff transform for a given option, which is model independent and
    does not depend on the fundamental transform.

    2. The fundamental transform for a given model, which is model dependent and analogous
    to the characteristic function.'
