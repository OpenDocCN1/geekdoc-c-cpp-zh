    # ACCESS TO THE CODE AND FILE FORMATS


    To access the code, go to www.wiley.com/go/hestonmodel/password: rouah13).

    The code files are arranged in directories that correspond to the chapters in
    which the code is used. The files are then arranged in subdirectories that correspond
    to the type of analysis for which the files are used. Some files are used in several
    chapters, so these are included multiple times in the directories.


    To access Matlab files, navigate towards the subdirectory that contains the files
    you are seeking, and download them to a subdirectory on your local machine.

    To access C# files, navigate towards the subdirectory that contains the files
    you are seeking, and proceed in one of two ways:


    +   1. Download only the source code files, including the solution files (.sln
    extension), project files (.csproj extension), source files (.cs extension), as
    well as text files (.txt extension) where applicable, to your machine. Create
    a new project in C# and paste the content of these files into your project.

    2. Download the entire subdirectory including the \bin, \obj, and \Properties
    subdirectories, and copy the entire subdirectory onto your local machine. Double-click
    on the solution file to open and run the code in C#.'
