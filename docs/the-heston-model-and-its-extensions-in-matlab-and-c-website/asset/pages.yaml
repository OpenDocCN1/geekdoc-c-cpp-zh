  md: '# 236 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    From Equation (8.46)


    ```

    % Solve the first C3 C4

    syms qi51

    PDE1 = d2pln + theta*dpln - n*pln + sigma_*C4*dp0n_1 + ...;

    PDE1 = subs(PDE1,theta);

    collect(PDE1,theta);

    qi51 = solve(''-2*pi51+2*C3+C4*(sigma-2*mu) ...'', ''pi51'');

    qi52 = solve(''pi51-4*pi52+2*r*(-C2*sigma^2 ...'', ''pi52'');

    qi52 = simplify(qi52);

    qi51 = simplify(qi51*theta^3+theta);

    ```


    Finding $q_1^1$ is done in the same fashion. We know from Equation (8.46) that
    $q_1^1 = x_1^1\theta + x_1^2$. We substitute all values of the coefficients in
    the second PDE in (8.50) using the subsm function and regroup terms using the
    collect.m function, cut and paste into the code, solve the resulting equations
    for $q_1^1$ and $q_1^2$.


    ```

    % Solve the second PDE for qi51

    syms qi51

    PDE2 = -(n+1)*qln* theta*dqln + d2qln + 2*dpln + sigma_*C4*p0n_1 + ...;

    PDE2 = subs(PDE2,theta);

    collect(PDE2,theta);

    qi51 = solve(''1/48*sigma-2-1/24*mu)/sigma*4 ...'', ''qi51'');

    qi52 = solve(''-6*C3*sigma^2-12*C4 ...'', ''qi52'');

    qi51 = simplify(qi51);

    qi52 = simplify(qi52);

    qi15 = qi51*theta^2 + qi52;

    ```


    Finally, the last part of the GeneratePQ.m function finds the $C_n$ coefficients
    in (8.51). For example, with $n=2$ is the code


    ```

    Exp2 = -sigma^2*y*K/2;

    C2 = (Exp2 - p12*cdf - q12*pdf)/(p02*cdf + q02*pdf);

    C2 = subs(C2,theta,y);

    C2 = simplify(C2);

    ```'
