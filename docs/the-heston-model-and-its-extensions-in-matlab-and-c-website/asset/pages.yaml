  md: "# Parameter Estimation\n\n# 171\n\nstrikes and maturities. The absence of arbitrage\
    \ across strikes is reflected in prices of butterfly spreads that are non-negative.\
    \ A butterfly spread is a portfolio with three positions: long one call at strike\
    \ $K-dK$, long another at strike $K+dK$, and two short calls each at $K$. It is\
    \ easy to show that as $dK\rightarrow0$ the value of $1/dK^2$ units of the portfolio\
    \ converges to the discounted risk-neutral density (RND) of Breeden and Litzenberger\
    \ (1978).\n\n```\n$e^{-\tau r}f_{\tau}(S) = \\frac{\\partial^2 C(K)}{\\partial\
    \ K^2}|_{K=S} \\quad (6.20)$\n```\n\nwhere $C(K)$ is the price of a call at $K$\
    \ generated from implied volatility, and $f_{\tau}(S)$ is the RND. If we let the\
    \ maturity expire, $\tau\rightarrow0$, the portfolio values converge to the Dirac\
    \ delta function, as expected, that corresponds to a degenerate density at maturity.^1\
    \ One convenient way to check for the absence of arbitrage strikes is to obtain\
    \ $f_{\tau}(S)$ across a wide domain, and ensure that the following property hold:\n\
    \n+   - Non-negativity property. The RND must be such that $f_{\tau}(S)\\geq0$\
    \ for all $S\\geq0$.\n- Integrability property. The RND must integrate to unity\n\
    \n```\n$$\\int_{0}^{\\infty} f_{\tau}(S)dS = 1.$\n```\n\nMartingale property.\
    \ The RND must be able to recover the prices of calls.\n\n```\n$$\\int_{0}^{\\\
    infty}max(S-K,0)f_{\tau}(S)dS = e^{-\\tau r}C(K,\\tau)$\n```\n\nwhere $C(K,\\\
    tau)$ is the price of a call at strike $K$ with maturity $\tau=T-t$. See Brunner\
    \ and Hafner (2003) and Carr (2004). The first two properties ensure that the\
    \ RND is a density function. The third property is sometimes expressed with $K=0$,\
    \ where the left-hand side becomes $E[S^{(T-t)}]=Se^{(T-t)}F_{t,T}$ is the forward\
    \ price. Here, the property is sometimes verified in the ability of the RND to\
    \ recover forward prices rather than calls, and as such, it is sometimes called\
    \ forward property.\n\nTo verify whether a set of estimated parameters $\\Theta$\
    \ produces prices that are free of arbitrage crosses for a given maturity, we\
    \ use these estimates as of Heston (1999) call finely spaced grid of strikes.\
    \ We use then finite differences to approximate the second derivative in Equation\
    \ (6.20), generate the RND, and verify whether the earlier properties hold. Jondeau\
    \ et al. (2006), however that the RND estimated with finite differences can be\
    \ inaccurate and unstable, since even small pricing errors are amplified when\
    \ finite differences are applied twice. To ensure that the prices are very accurate,\
    \ it is preferable to use an integration method that uses many abscissas, such\
    \ as the Gauss-Legendre\n\n^1If we use $1/dK$ units of the portfolio, then convergence\
    \ is an Arrow-Debreu security rather than to the Dirac delta function."
