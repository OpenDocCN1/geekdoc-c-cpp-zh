    ```

    function y = DoubleHestonPriceTrapezoidal(... , a, b, N)

    h = (b-a)/(N-1);

    phi = [a:b];

    w = h.*[1/2 ones(1,N-2) 2];

    for k=1:length(phi)

    nu = phi(k);

    f2(k) = DoubleHestonCF(u, ...);

    f1(k) = DoubleHestonCF(u-i, ...);

    int2(k) = w(k)*real(exp(-i*u*log(K))*f2(k)/i);

    int1(k) = w(k)*real(exp(-i*u*log(K))*f1(k)/i);

    end

    P1 = 1/2 + 1/pi*sum(int1);

    P2 = 1/2 + 1/pi*sum(int2);

    HestonC = S*exp(-rf*T)*P1 - K*P2;

    ```


    The C code to implement the double Heston model is very similar and is not presented
    here.

    To illustrate the double heston model, use Matlab to reproduce Table 3 of Gauthier
    and Possamai (2010). The call prices using the trapezoidal rule are presented
    in Table 12.1 and are almost identical to those of Gauthier and Possamai.

    In practice, we use Gauss-Laguerre quadrature, which this is as accurate as the
    trapezoidal rule, but much faster.


    # DOUBLE HESTON GREEKS


    In this section we derive analytic expressions for the Greeks in the double Heston
    model. We saw in Chapter 11 that many of the Greeks for the Heston (1993) model
    are available analytically, by straightforward differentiation of the call price.
    We also saw that using finite difference approximations to the Greeks, it is easy
    to verify the accuracy of the analytic Greeks. This approach can be used as well,
    by differentiation of the call price in (12.13). The Greeks in the double Heston
    model are straightforward generalizations of their univariate counterparts. For
    example, we have


