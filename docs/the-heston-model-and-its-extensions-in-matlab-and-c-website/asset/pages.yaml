  md: "# THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nmulti-domain integration\
    \ rule, which was covered in Chapter 5. Finite difference approximations to first-\
    \ and second-order derivatives will be covered in Chapter 10. The Matlab ExtractRND\
    \ applies center differences to find the RND. It accepts as inputs a vector of\
    \ finely spaced strikes and call prices, and returns the same value of strikes\
    \ with four endpoints removed and the value of the RND at each strike.\n\n```\n\
    function [RND, K2] = ExtractRND(K,CallPrice)\n  % Calculate the first derivatives\
    \ of calls w.r.t. strike K.\n  for i=2:length(K)-1\n    dk = K(i) - K(i-1)\n \
    \   dc = CallPrice(i+1) - CallPrice(i)\n    dcdK(i-1) = dc/dk;\n  end\n  % Calculate\
    \ the risk neutral density by using finite\n  % differences.\n  for i=2:length(dcdK)-1\n\
    \    dk = K(i) - K(i-1)\n    dcK = dcdK(i+1) - dcdK(i-1)\n    RND(i-1) = dcK/dk;\n\
    \  end\nK2 = K(3:end);\n```\n\nThe following RMSE parameter estimates in the second\
    \ row of Table 6.1 to illustrate risk neutral density estimation in the Heston\
    \ (1993) model. The following code is used to generate the RNDs for the four maturities.\
    \ The call prices are obtained using multi-domain integration using a domain of\
    \ A = (0,500) divided into 50 subdomains along a strike increment of dA = 0.5.\
    \ The strike range increases with increasing maturity, to allow for more dispersion\
    \ in the RND at higher maturities. The code also uses the Matlab trapz() to integrate\
    \ each RND, and calculates the number of negative values of each RND, providing\
    \ a check of the first two properties. The code make of Matlab codes, to allow\
    \ for varying strike ranges in each maturity.\n\n```\nT = [45 98 261 348]./365;\n\
    NT = length(T);\n% RMSE parameters\nkappa = 0.931;\ntheta = 0.0571;\nsigma = 2.0000;\n\
    v0 = 0.0405;\nrho = -0.6038;\n% Multi-domain: integration rules\nlo = 1e-10; hi\
    \ = 500;\nNdomains = 50;\ndA = (hi - lo)/Ndomains;\nA = [lo:dA:hi];\ntol = 1e-8;\n\
    dK = 0.5;\n```"
