- pgno: 308
  md: '# CHAPTER 10


    # # Methods for Finite Differences


    #  Abstract


    In this chapter, we present methods to obtain the European call price by solving
    the Heston PDE along a two-dimensional grid representing the stock price and the
    volatility. We first show how to construct uniform and non-uniform grids for the
    discretization of the stock price and the volatility, and present formulas for
    finite difference approximations to the derivatives in the Heston PDE. We then
    present the weighted method, a popular method which includes the implicit scheme,
    explicit scheme, and Crank-Nicolson scheme as special cases. We encountered the
    explicit scheme briefly in Chapter 8, when we applied this method to the pricing
    of American options. Next, we explain the boundary conditions of the PDE for a
    European call. Finally, we explain the Alternating Direction Implicit (ADI) method,
    which produces accurate results with few time points.


    The methods can easily be modified to allow for the pricing of European puts,
    which requires a reformulation of the boundary conditions. In many cases, however,
    it is simpler to use put-call parity to obtain the put price.


    # # THE PDE IN TERMS OF AN OPERATOR


    Recall from Chapter 1 the Heston PDE for the value $U(S,v,t)$ of an option on
    a dividend-paying stock, with $\lambda = 0$, when the spot price is $S$ and the
    volatility is $v$, and when the maturity is $t


    ```

    $$\frac{\partial U}{\partial t} = \frac{1}{2}vS^2\frac{\partial^2 U}{\partial
    S^2} + \rho vS\frac{\partial^2 U}{\partial S\partial v} + \frac{1}{2}\sigma^2
    v^2\frac{\partial^2 U}{\partial v^2} \quad (10.1)$

    $$-rU + (r-q)S\frac{\partial U}{\partial S} + \kappa(\theta - v)\frac{\partial
    U}{\partial v}$

    ```


    Recall all that, since we are using $t$ represents maturity, the sign of the derivative
    $\partial U/\partial t$ is the opposite of what it would be if $t$ represented
    time. Using $U(t)=U(S,v,t)$ as compact notation we can express the PDE as


    ```

    $$\frac{\partial U}{\partial t} = LU(t) \quad (10.2)$

    ```'
