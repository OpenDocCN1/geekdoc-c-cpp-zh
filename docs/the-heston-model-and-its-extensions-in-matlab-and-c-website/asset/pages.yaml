  md: "# The Fundamental Transform for Pricing Options\n\ncharacteristic function\
    \ is known, including the Heston model. In this section, we describe and implement\
    \ its approach. First, we present Parseval's identity for Fourier transforms.\n\
    \n# Parseval's Identity\n\nThis is a key identity for the application of Fourier\
    \ transforms to option pricing. It is described in textbooks such as Rudin (1986).\
    \ Define the scalar product of $f$ and $g$ integrable on $(-\\infty, \\infty)$\
    \ as\n\n```\n$$\\langle f, g \\rangle = \\int_{-\\infty}^{\\infty} f(x)g(x) dx$\n\
    ```\n\nwhen $g(x)$ is the complex conjugate of $g(x)$. Parseval's identity states\
    \ that the scalar product is preserved under Fourier transforms, so that $\\langle\
    \ f, \tilde{g} \rangle = \\frac{1}{2\\pi}(\tilde{f}, \tilde{g})$. Hence Parseval's\
    \ identity is\n\n```\n$$\\int_{-\\infty}^{\\infty} f(x)g(x) dx = \\frac{1}{2\\\
    pi} \\int_{-\\infty}^{\\infty} \\tilde{f}(k)\\tilde{g}(k) dk$\n```\n\nIf we consider\
    \ $\\langle f, \\tilde{g} \\rangle$, then we have\n\n```\n$$\\int_{-\\infty}^{\\\
    infty} f(x)g(x) dx = \\frac{1}{2\\pi} \\int_{-\\infty}^{\\infty} \\tilde{f}(k)\\\
    tilde{g}(-k) dk.$ (4.22)$\n```\n\nThe fact that $\\tilde{g}(-k)$ rather than $\\\
    tilde{g}(k)$ appears in the integral on the right-hand side of (4.22) is a consequence\
    \ of the convolution theorem for Fourier transforms. See, for example, Section\
    \ 7.2.5 of Beerends et al. (2003).\n\nIf we need the generalized transform, which\
    \ allows complex values for $k$ so that $k = k_r + ik_i$, Parseval's identity\
    \ in Equation (4.22) becomes\n\n```\n$$\\int_{-\\infty}^{\\infty} f(x)g(x) dx\
    \ = \\frac{1}{2\\pi} \\int_{-ik_i}^{ik_i} \\tilde{f}(k)\\tilde{g}(-k) dk.$ (4.23)$\n\
    ```\n\n# The Option Price Using Parseval's Identity\n\nWriting $x = \\ln S_t$,\
    \ the time-t value $f(x,t)$ of a derivative with payoff $w(x_t)$ can be written\n\
    \n```\n$$\\f(x,t) = e^{-rt} E^Q[w(x_t)] = e^{-rt} \\int_{-\\infty}^{\\infty w(x)q(x)\
    \ dx = \\frac{e^{-rt}}{2\\pi} \\int_{-\\infty}^{\\infty \\tilde{w}(k)\\tilde{q}(-k)\
    \ dk$\n```\n\nwhere the last equality follows from Equation (4.22). Since $\\\
    tilde{q}(k)$ is the Fourier transform of the density in $\\ln S_t$, it is also\
    \ the characteristic function, $\\varphi(k)$. Hence, the derivative value can\
    \ be expressed in terms of the characteristic function and the Fourier transform\
    \ of the payoff. When $k$ is a complex number the option value is, using Parseval's\
    \ identity in Equation (4.23)\n\n```\n$$\\f(x,t) = \\frac{e^{-rt}}{2\\pi} \\int_{-ik_i}^{ik_i}\
    \ \\tilde{w}(k)\\tilde{q}(-k) dk = \\frac{e^{-rt}}{2\\pi} \\int_{-ik_i}^{ik_i}\
    \ \\tilde{w}(k)\\varphi(k) dk.$ (4.24)$\n```"
  merge: -1
  img_proc: true
