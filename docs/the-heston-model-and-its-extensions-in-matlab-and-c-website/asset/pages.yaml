    Recall that the Heston model is specified by the bivariate process given in Equation
    (7.1). In the processes for $S_t$ and $v_t$, the drift and volatility coefficients
    do not depend on $t$ directly. Thus Equation (7.19) can be applied to both processes,
    and to the process for $\ln S_t$ also.'
