  md: "# 132    THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nfor some integer\
    \ $M$, $\\varepsilon$ is a tolerance level. The integration domain is $(0,a_M]$\
    \ so that $\\phi_{\\max}=a_M$. Zhu (2010) explains that this method has the advantage\
    \ of assigning the upper limit optimally, with the ability to adapt to different\
    \ strikes, and maturity values. The method will automatically assign a wider domain\
    \ to shorter maturity options, which the integrand tends to oscillate, and a narrower\
    \ domain to longer maturity options, where the integrand is better behaved. The\
    \ method is able to reduce computation time by avoiding domains that are needlessly\
    \ needed. It also increases accuracy by assigning a wide domain to those that\
    \ require it.\n\nGauss-Legendre or Gauss-Lobatto is particularly well-suited for\
    \ this method, since both can accommodate integrals on any domain, by using the\
    \ transformation in Equation (5.8). However, to apply the multi-domain integration\
    \ method of Zhu (2010), we can generate absciss and weights once to obtain the\
    \ integrals on the subdomains, applying the transformation each time. When the\
    \ condition in (5.13) is satisfied. The Matlab function HPriceGaussLegendreMD.m\
    \ implements the multi-domain integration.\n\n```\nfunction [Price D N] = HPriceGaussLegendreMD(xLE,wLE)\n\
    for j=2:length(A)\n  for k=1:length(xGE)\n    % Lower and upper limits\n    a\
    \ = A(j);\n    b = B(j);\n    X = (a+b)/2 + (b-a)/2*xGE(k);\n    % The integrals\n\
    \    int1(j,k) = wLE(k)*HestonProb(X,...,1)*(b-a)/2;\n    int2(j,k) = wLE(k)*HestonProb(X,...,2)*(b-a)/2;\n\
    \    % Sum the integrals over each subdomain\n    sum1(j) = sum(int1(j));\n  \
    \  sum2(j) = sum(int2(j));\n    % Stopping criterion\n    if abs(sum1(j))<tol\
    \ && abs(sum2(j))<tol\n      break;\n    end\n  end\nnP1 = 1/2 + 1/pi*sum(sum1);\n\
    nP2 = 1/2 + 1/pi*sum(sum2);\nHestonc = S*exp(-q*T)*P1 - K*exp(-r*T)*P2;\n% Integration\
    \ domain and points\nD = [A(1); A(j)];\nN = length(A(1:j));\n```\n\nThe function\
    \ accepts input as a set of points defining the subdomains. It returns the call\
    \ price, or put price by put-call. It also outputs the resulting domain of integration\
    \ and the number of points used. The C# function to implement this method is very\
    \ similar to the Matlab code and is not presented here.\n\nTo illustrate the multi-domain\
    \ integration of Zhu (2010), we use the settings for the example that illustrates\
    \ Gaussian quadrature throughout this chapter."
