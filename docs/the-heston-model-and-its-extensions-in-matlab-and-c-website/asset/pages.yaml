  md: '# 78 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    The Matlab function RogerLeeGExpD. defines an objective function as the squared
    difference from both sides of Equation (3.45).


    ```

    y = RogerLeeGExpD(phi,kappa,rho,sigma,tau)

    A = (rho*sigma*phi*i - kappa)

    B = sigma^2*(phi*i + phi^2)

    d = sqrt(A^2 + B)

    g = (kappa - rho*sigma*phi*i + d) / ...

    E = real(g*exp(d*tau))

    y = (E - 1)*2;

    ```


    The fminsearch.function in Matlab is to find y_ = -2.3069 and y+ = 10.6000.


    ```

    Find y-

    [yneg feval] = fminsearch(@a RogerLeeGExpD(-i-a...), start)

    Find y+

    [ypos feval] = fminsearch(@a RogerLeeGExpD(-i-a...), start)

    % The range for Ax

    Ax = [yneg ypos]

    AlphaMax = ypos; 1;

    AlphaMin = yneg - 1;

    ```


    The average of the returned values α_min = -3.3060 and α_max = 9.0600 as starting
    values to find α*, the optimal damping factor.


    ```

    start = (AlphaMin + AlphaMax)/2

    [aopt eval] = fminsearch(@alpha) LordKahlFindAlpha(alpha,...), ...

    ```


    The above snippet of code uses the objective function in the minimization in Equation
    (3.48).


    ```

    y = LordKahlFindAlpha(alpha,...)

    PSI = HestonPsi(0,alpha,...)

    y = -alpha*log(K) + (1/2)*log(PSI^2);

    ```


