- pgno: 323
  md: "# 316 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nWe can use central\
    \ differences for $\\partial U/\\partial S$\n\n```\n$\\frac{\\partial U}{\\partial\
    \ S}(S_i, 0, t_n) = \\frac{U_{i+1,0}^n - U_{i-1,0}^n}{S_{i+1} - S_{i-1}}$\n```\n\
    \nbut for $\\partial U/\\partial v$, we must use forward differences, for example,\
    \ the simple form\n\n```\n$\\frac{\\partial U}{\\partial v}(S_i, 0, t_n) = \\\
    frac{U_{i,1}^n - U_{i,0}^n}{v_1 - 0}$\n```\n\nsince $v_0 = 0$. Remember that in\
    \ this context we are using $v_0$ to denote the first point on the grid for the\
    \ variance, and not the Heston parameter for the spot variance. The sub-matrices\
    \ $L_{S,S}, L_{S,v}$ and $L_{v,v}$ take on zero value at the boundary points.\n\
    \n# EXPLICIT SCHEME\n\nThe explicit scheme produces an expression for the PDE\
    \ that is very simple when the grids are uniform. It is a special case of the\
    \ weighted method that arises by setting $\theta=0$ in Equation (10.11)\n\n```\n\
    $U^{n+1} = (I + dtL)U^n$.\n```\n\nGiven, hence the matrix $L_i$, we can obtain\
    \ $U^{n+1}$ directly from $U^n$, without requiring matrix inversion. The element\
    \ of $U^{n+1}$ corresponding to $U_{i,j}^n$ is\n\n```\n$U_{i,j}^{n+1} = U_{i,j}^n\
    \ + dt \\left[ \\frac{1}{2}S_i^2 \\frac{\\partial^2 U}{\\partial S^2} + \\frac{1}{2}\\\
    sigma_j^2 \\frac{\\partial^2 U}{\\partial v^2} + \rho v_j S_i \\frac{\\partial^2\
    \ U}{\\partial S \\partial v} + (r-q)S_i \\frac{\\partial U}{\\partial S} + \\\
    kappa(\theta - v_j) \\frac{\\partial U}{\\partial v} \right] U_{i,j}^n$\n```\n\
    \nThis is the example for the explicit scheme to price American options. We encountered\
    \ in Chapter 8, when we used the explicit scheme, to implement this, we must substitute\
    \ finite difference approximations of the derivatives. The simplest implementation\
    \ arises when we use a uniform grid for $(S_j, v_j)$. In that case, the expression\
    \ for $U_{i,j}^n$ can be reduced to a simple expression that involves only the\
    \ parameters, the index values, points adjacent to $U_{i,j}^n$, and the increments.\
    \ We substitute the approximations to the derivatives under a uniform grid to\
    \ obtain\n\n```\n$U_{i,j}^{n+1} = U_{i,j}^n + dt \\left[ \\frac{1}{2}S_i^2 \\\
    frac{U_{i+1,j}^n - 2U_{i,j}^n + U_{i-1,j}^n}{(dS)^2} + \\frac{1}{2}\\sigma_j^2\
    \ \\frac{U_{i,j+1}^n - 2U_{i,j}^n + U_{i,j-1}^n}{(dv)^2} + \rho v_j S_i \\frac{U_{i+1,j+1}^n\
    \ - U_{i+1,j-1}^n - U_{i-1,j+1}^n + U_{i-1,j-1}^n}{4 ds dv} \right] \\ + \rho\
    \ v_j S_i \\frac{U_{i,j+1}^n - U_{i,j-1}^n}{2 dv} + \\frac{1}{2}\\sigma^2 v_j\
    \ \\frac{U_{i+1,j}^n - U_{i-1,j}^n}{2 ds} + \\kappa(\theta - v_j) \\frac{U_{i,j+1}^n\
    \ - U_{i,j-1}^n}{2 dv} ] U_{i,j}^n$\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Methods for Finite Differences\n\nGrouping common terms and simplifying,\
    \ noting that $S_i = i \times ds$ and $v_j = j \times dv$ produces\n\n```\n$U_{i,j}^{n+1}\
    \ = \\left[ 1 - dt (\\r jdv + \\frac{\\sigma_j^2}{dv} + r) \\right] U_{i,j}^n\
    \ \\nn+ \\left[ \\frac{dt}{2} (ijdv - r + q) \\right] U_{i-1,j}^n + \\left[ \\\
    frac{dt}{2} (ijdv + r - q) \\right] U_{i+1,j}^n \\n+ \\left[ \\frac{dt}{2dv} (\\\
    sigma_j^2 - \\kappa(\\theta - idv)) \\right] U_{i,j-1}^n + \\left[ \\frac{dt}{2dv}\
    \ (\\sigma_j^2 + \\kappa(\\theta - idv)) \\right] U_{i,j+1}^n \\n+ \\frac{ijdtsigma}{4}\
    \ (U_{i-1,j+1}^n + U_{i+1,j-1}^n - U_{i-1,j-1}^n - U_{i+1,j+1}^n). (10.20)\n```\n\
    \nThe Matlab function HestonExplicitPDE(...) returns the matrix that contains\
    \ all the elements $U_{i,j}'$. All intermediate time values $U_{i,j}'$ for $t\
    \ < N_t$ are discarded. The function requires as inputs the grids for $S, v$,\
    \ and $t$. To conserve some steps of the function have been removed.\n\n```\n\
    function U = HestonExplicitPDE(params,...)\nfor s=1:NS\n  for v=1:NV\n    U(s,v)\
    \ = max(S) - K, 0);\nend\nfor t=1:NT-1\n  for v=1:NV\n    U(s,v) = 0;\n    U(NS,v)\
    \ = max(0, Smax - K);\n  end\n  for s=1:NS\n    U(s,v) = max(0, S(s) - K);\n \
    \ end\n  u = U % Update the temporary grid u(s,t)\n  for s=2:NS\n    DerV = (u(s,2)\
    \ - u(s,1)) / dv;\n    DeS = (u(s,1) - u(s-1,1))/ds;\n    U(s,1) = u(s,1)*(1 -\
    \ r*dt - kappa*theta*dt/dv); ...\n  end\n  u = U;\n  for v=2:NV-1\n    A = (1/2*(dt*(s-1)^2*(v-1)*dv\
    \ - sigma^2*dv); ...\n    B = (1/2*(dt*(s+1)^2*(v-1)*dv - 1/2*dt*(r-q)*(s-1));\
    \ ...\n    C = (1/2*(dt*(s+1)^2*(v-1)*dv + 1/2*dt*(r-q)*(s+1)); ...\n    D = (1/2*dt*sigma^2*(v-1)/dv\
    \ - 1/2*dt*kappa ...);\n    E = (1/2*dt*sigma^2*(v-1)/dv + 1/2*dt*kappa ...);\n\
    \    F = 1/4*dt*sigma*(s-1)*(v-1);\n    U(s,v) = A*u(s,v) + B*u(s-1,v) + C*u(s+1,v);\
    \ ...\n  end\nend\n```"
