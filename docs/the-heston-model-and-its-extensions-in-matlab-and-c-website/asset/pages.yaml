  md: "# 342 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nrho are slightly\
    \ more complicated, because we need to apply the product rule to erf2 in (11.37).\
    \ Theta, for example, is observed as\n\n```\n$$\\Theta_C = \\frac{e^{-uk}}{\\\
    pi} \\int_0^{\\infty} e^{-uk} \\text{Re} \\left[frac{-e^{-it}(-rf_2 + \\partial\
    \ f_2/\\partial t)}{\\alpha^2 + \\alpha v - v^2 + iv(2\\alpha + 1)}\right] dv\
    \ \\quad (11.38)$\n```\n\nwhere f2 and $\\partial f_2/\\partial t$ are both evaluated\
    \ at $v-(\\alpha+1)i$. To calculate volga for $v=\\sqrt{v0}$, note that an application\
    \ of the chain rule produces $\\partial^2f_2/\\partial v^2=2D_2f_0$, where $D_2$\
    \ the coefficient for the Heston characteristic function.\n\nThe function HestonGreek\
    \ returns the derivative of f2, which is required to obtain the Greeks for the\
    \ Carr and Madan (1999) call price. The function also returns the call price,\
    \ if desired, by returning f2 itself rather than a derivative. It is similar to\
    \ the HestonGreeksProb.function defined earlier in this chapter.\n\n```\nfunction\
    \ df = HestonCFGreek(phi,...,Greek)\n% The characteristic function.\nf = exp(C\
    \ + D.*v + i.*phi.*X*0)\n% Derivatives of f2 required for the Greeks\nif strcmp(Greek,\
    \ 'Price')\n    df = f;\nelseif strcmp(Greek, 'Delta')\n    df = f1*phi/S;\nelseif\
    \ strcmp(Greek, 'Gamma')\n    df = f1*phi*(i*phi-1)/S^2;\nelseif strcmp(Greek,\
    \ 'Theta')\n    dddT = d*exp(d*tau)*(b-rho*sigma*phi*i+d)...\n    dCTOT = f*phi*i+kappa*theta/sigma^2*;\n\
    elseif strcmp(Greek, 'Rho')\n    df = i*phi*tau;\n    cdcr = f*dCdr*tau;\nelseif\
    \ strcmp(Greek, 'Vega')\n    df = f0;\nelseif strcmp(Greek, 'Vanna')\n    df =\
    \ f*i*phi*D;\nelseif strcmp(Greek, 'Volga')\n    df = 2*D*f*(2*D*v+1);\nend\n\
    ```\n\nThe derivatives are then passed to the CarrMadanGreeks.function, which\
    \ uses numerical integration and returns delta, gamma, theta, rho, vega1, vanna,\
    \ and volga, or the call price. Both functions can be easily modified to return\
    \ additional option sensitivities."
