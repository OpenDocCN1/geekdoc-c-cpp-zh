  md: "# The Heston Model for European Options\n\n# DIVIDEND YIELD AND THE PUT PRICE\n\
    \nIt is straightforward to include dividends into the model if it can be assumed\
    \ that the dividend payment is a continuous yield, $q$. In that case, $r$ is replaced\
    \ by $r-q$ in Equation (1.4) for the stock price process\n\n```\n$dS_t = (r-q)S_tdt\
    \ + \\sqrt{v_t}S_td\\tilde{W}_{1,t},$\n```\n\nThe solution for $C$, in Equation\
    \ (1.62) becomes\n\n```\n$C_i = (r-q)i\\phi + \\frac{K\theta}{\\sigma^2} \\left[(b_i\
    \ - \rho\\sigma i\\phi + d_i)\tau - 2\\ln\\left(\\frac{1-g_e^{d_i\tau}}{1-g_i}\r\
    ight)\right].$\n```\n\nTo obtain the $P(K)$ of a European put, first obtain the\
    \ $C(K)$ of a European call, with a slight modification of Equation (1.12) to\
    \ include the term $e^{-q\tau}$ for the dividend yield, as explained by Walehee\
    \ (2006)\n\n```\n$C(K) = S_e e^{-q\\tau}P_1 - e^{-r\\tau}P_2$.\n```\n\nThe put\
    \ price is found by put-call parity\n\n```\n$P(K) = C(K)e^{r\\tau} - S_e e^{-q\\\
    tau}$.\n```\n\nAlternatively, as in Zhu (2010) the put price can be obtained explicitly\
    \ as\n\n```\n$P(K) = Ke^{-r\\tau}P_2 - S_e e^{-q\\tau}P_1$.\n```\n\nThe put expires-in-the-money\
    \ if $S_T < K$. The in-the-money probabilities in (1.68) are, the complement of\
    \ those in (1.41)\n\n```\n$P_t = \\text{Pr}(S_t < K) = \\frac{1}{2} - \\frac{1}{\\\
    pi}\\int_0^{\\infty}\\text{Re}\\left[\\frac{e^{-i\\phi}K_t(\\phi;x,v)}{i\\phi}\r\
    ight]d\\phi$.\n```\n\nIt is straightforward to show the equivalence of Equations\
    \ (1.67) and (1.68). By an application of the Feynman-Kac theorem, the PDE for\
    \ $x = \\ln S$ will be introduced in Chapter 12,\n\n```\n$\\frac{\\partial U}{\\\
    partial t} + \\frac{1}{2}\\frac{\\partial^2 U}{\\partial x^2} + (r-q-\\frac{1}{2}v)\\\
    frac{\\partial U}{\\partial x} + \\rho\\sigma v\\frac{\\partial^2 U}{\\partial\
    \ x\\partial v} + \\frac{1}{2}\\sigma^2 v\\frac{\\partial^2 U}{\\partial v^2}\
    \ - rU + [\\kappa(\\theta-v)-\\lambda v]\\frac{\\partial U}{\\partial v} = 0$.\n\
    ```\n\nEquation (1.70) is simply (1.29), but with $(r-v/2)$ in the third term\
    \ replaced by $(r-q-v/2)$."
