  md: '# Numerical Integration Schemes


    # FAST FOURIER TRANSFORM


    The fast Fourier transform (FFT) was applied by Carr and Madan (1999) to speed
    up the computation of option prices. The discrete Fourier transform maps a vector
    of points $\mathbf{x} = (x_1, \dots, x_N)$ to another vector of points $\hat{\mathbf{x}}
    = (\hat{x}_1, \dots, \hat{x}_N)$ via the relation


    ```

    $$\hat{x}_k = \sum_{j=1}^N e^{-i\frac{\pi}{N}(j-1)(k-1)}x_j$ for $k=1, \dots,
    N.$ \quad (5.18)$

    ```


    Computing these sums independently of one another would require $N^2$ steps. Fast
    Fourier transform computes these simultaneously, which require $N\log N$ steps.
    Recall from Chapter 3 that the Carr and Madan (1999) representation for the call
    price for a value of the log strike $k = \ln K$


    ```

    $C(k) = \frac{e^{-uk}}{\pi} \int_0^\infty e^{-itkv}\psi(v)dv$ \quad (5.19)$

    ```


    where


    ```

    $$\psi(v) = \frac{e^{-iv}f_2(v-\alpha+1)i)}{\alpha^2+\alpha-v^2+iv(2\alpha+1)}$

    ```


    and where $f_2$ is the Heston characteristic function. The objective of the FFT
    is to discretize the call price $C(k)$ in Equation (5.19) and express it in terms
    of (5.18).


    Note that the inverse FFT of $\hat{\mathbf{x}} = (\hat{x}_1, \dots, \hat{x}_N)$
    is the vector $\mathbf{x} = (x_1, \dots, x_N)$ defined as


    ```

    $$\x_k = \frac{1}{N} \sum_{j=1}^N e^{i\frac{\pi}{N}(j-1)(k-1)}\hat{x}_j$ for $k=1,
    \dots, N.$ \quad (5.20)$

    ```


    The FFT and inverse FFT are intuitive discrete analogues of their continuous counterparts.
    We note that the FFT maps $\mathbf{x}$ to $\hat{\mathbf{x}}$ as the function $\hat{\mathbf{x}}=D(\mathbf{x})$
    and the inverse FFT maps $\hat{\mathbf{x}}$ back to $\mathbf{x}$ by $\mathbf{x}=D^{-1}(\hat{\mathbf{x}})$.
    We will use this notation when we describe the fractional Fourier transform (FRFT)
    later in this chapter.


