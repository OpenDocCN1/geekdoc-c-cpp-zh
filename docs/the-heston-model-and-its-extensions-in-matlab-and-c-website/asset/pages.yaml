- pgno: 72
  md: '# CONCLUSION


    In this chapter, we showed that the Heston call price can be expressed in terms
    of a single characteristic function and that the Heston model fits into the framework
    described by Bakshi and Madan (2000). Next, we presented the “Little Trap” formulation
    of Albrecher et al. (2007) that can remedy many of the problems with the numerical
    integration that arise when the integrand is discontinuous. We then showed that
    varying these parameters can induce substantial changes in the pattern of implied
    volatility smiles and skews. We also presented Gatheral''s (2006) fair strike
    of a variance swap under the Heston model, his approximation to local and implied
    volatility in the model, and formulas for analytical local volatility and finite
    difference approximations to local volatility. Finally, we showed how the moment
    explosion times of Andersen and Piterberg (2007) can be used to find the bounds
    on implied volatility due to Lee (2004b) and illustrated the value of these bounds
    on extreme strikes in an implied volatility smile.


    The formulas for the Heston call price have so far involved inversion of the characteristic
    function to obtain the probabilities $P_1$ and $P_2$. In the next chapter, we
    present a popular method to obtain the call price due to Carr and Madan (1999)
    that uses the Fourier transform of the call price itself. We also present an alternate
    derivation of the Heston call price due to Gatheral (2006) that makes use of Fourier
    transforms of $P_1$ and $P_2$. Finally, we present a call price formula due to
    Atari (2004) that makes use of a single integral that decays very quickly and,
    therefore, requires a short integration domain.'
