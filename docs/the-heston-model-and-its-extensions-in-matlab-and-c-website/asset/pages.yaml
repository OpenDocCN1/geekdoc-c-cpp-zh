- pgno: 8
  md: '# Foreword


    I am pleased to introduce The Heston Model and Its Extensions in Matlab and C#
    by Fabrice Rouah. Although I was already familiar with his previous book entitled
    Option Pricing Models Using Excel/VBA, I was pleasantly surprised to discover
    he had written a book devoted exclusively to the model that I developed in 1993
    and to many enhancements that have been brought to the original model in the twenty
    years since its introduction. Obviously, this focus makes the book more specialized
    than his previous work. Indeed, it contains detailed analyses and extensive computer
    implementations that will appeal to careful, interested readers. This book should
    interest a broad audience of practitioners and academics, including graduate students,
    quanta on trading desks and in risk management, researchers in option pricing
    and financial engineering.


    There are existing programs for calculating option prices, such as those in Rouah''s
    prior book or those available on Bloomberg systems. But this book offers more.
    In particular, it contains detailed theoretical analyses in addition to practical
    Matlab and C# code for implementing not only the original model, but also the
    many extensions that academics and practitioners have developed specifically for
    the model. The book analyzes numerical integration, the calculation of Greeks,
    American options, many simulation-based methods for pricing, finite difference
    numerical schemes, and recent developments such as the introduction of time-dependent
    parameters and the double version of the model. The breadth of methods covered
    in this book provides comprehensive support for implementation by practitioners
    and empirical researchers who need fast and reliable computations.


    The methods covered in this book are not limited to the specific application of
    option pricing. The techniques apply to many option and financial engineering
    models. The book also illustrates how implementation of seemingly straightforward
    mathematical models can raise many questions. For example, one colleague noted
    that common question with the Wilmot forms was how to calculate a complex logarithm
    while guaranteeing that the option model produces real values. Obviously, an imaginary
    option value will cause problems in practice! This book resolves many difficulties
    and will reward the dedicated reader with clear answers and practical solutions.
    I hope you enjoy reading it as much as I did.


    Professor Steven L. Heston

    Robert H. Smith School of Business

    University of Maryland

    January 3, 2013'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Preface


    In the twenty years since its introduction in 1993, the Heston model has become
    one of the most important models, if not the single most important model, in a
    then-revolutionary approach to pricing options known as stochastic volatility
    modeling. To understand why this model has become so important, we must revisit
    an event that shook financial markets around the world: the stock market crash
    of October 1987 and its subsequent impact on mathematical models to price options.


    The exacerbation of smiles and skews in the implied volatility surface that resulted
    from the crash brought into question the ability of the Black-Soles model to provide
    adequate prices in a new regime of volatility skews, and served to highlight the
    unrealistic assumptions that continuously compounded stocks returns being normally
    distributed with constant volatility. An abundance of empirical studies since
    the 1987 crash have shown that this assumption hold in equities markets is now
    a stylized fact in these markets that returns distributions are not normal. Returns
    exhibit skewness, and kurtosis—fat tails—that normality cannot account for. Volatility
    is not constant in time, but to be inversely related to price, with high stock
    prices usually showing lower volatility than low stock prices. A number of researchers
    have to eliminate this assumption in their models, allowing volatility to time-varying.


    One popular approach for allowing time-varying volatility is to specify that volatility
    be driven by its stochastic process. The models that use this approach, including
    the Heston (1993) model, are known as stochastic volatility models. The models
    of Hull and White (1987), Scott (1987), Wiggins (1987), Cheney and Scott (1989),
    and Stein and Stein (1991) are among the most significant stochastic volatility
    models that provide de-ste Heston model. The Heston model was not the first stochastic
    volatility model to be introduced to the problem of pricing options, but it has
    emerged as the most important and now serves as a benchmark against which many
    other volatility models are compared.


    Allowing for nonnormality can be done by increasing skewness and kurtosis in the
    option price, as done by, Jarrow and Rudd (1982), Corrado and Su (1997), Bakakas,
    Forest, and Wu (2004). In these models, skewness and kurtosis are specified in
    Edgeworth expansions or Gram-Charlier expansions. In stochastic volatility models,
    skewness can be induced by allowing correlation between the processes driving
    the stock price and the process driving its volatility. Alternatively, skewness
    can be induced by introducing jumps into the stock process driving the asset price.


    The parameters of the Heston model are able to induce skewness and kurtosis, and
    produce a smile or skew in implied volatilities extracted from option prices generated
    by the model. The model easily allows for the inverse relationship between price
    level and volatility in a manner that is intuitive and easy to understand. Moreover,
    the call price in the Heston model is available in closed form, up to an'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'integral that must be evaluated numerically. For these reasons, the Heston
    model has become the most popular stochastic volatility model for pricing equity
    options.


    Another reason the Heston model is so important is that it is the first to exploit
    characteristic functions in option pricing, recognizing that the terminal price
    need not be known, only its characteristic function. This crucial line of reasoning
    was the genesis for a new approach for pricing options, known as by characteristic
    functions. See Zhu (2010) for a discussion.


    In this book, we present a treatment of the classical Heston model, but also of
    the extensions that other researchers and practitioners have contributed to this
    model since its inception. In Chapter 1, we derive the characteristic function
    and call price of Heston''s (1993) original derivation. Chapter 2 deals with some
    of the issues around the model such as integrand discontinuities, and Chapter
    3 presents how to model implied and local volatility in the model. Several Fourier
    transform methods for the model, and Chapter 4 deals exclusively with Alan Lewis''
    (2000, 2001) approach to stochastic volatility modeling, as it applies to the
    Heston model. Chapter 5 presents a variety of numerical integration schemes and
    explains how integration can be sped up. Chapter 6 deals with parameter estimation,
    and Chapter 7 presents classical simulation schemes applied to the model and several
    simulation schemes designed specifically for the model. Chapter 8 deals with pricing
    American options in the Heston model. Chapter 9 presents models in which the parameters
    of the original Heston model are allowed to be piecewise constant. Chapter 10
    presents methods for obtaining the call price that rely on solving the Heston
    partial differential equation with finite differences. Chapter 11 presents the
    Greeks in the Heston model. Finally, Chapter 12 presents the double Heston model,
    which introduces an additional stochastic process for variance and thus allows
    the model to provide a better fit to the volatility surface.


    All of the models presented in this book have been coded in Matlab and C#.'
