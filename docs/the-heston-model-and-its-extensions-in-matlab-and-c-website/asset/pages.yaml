    \nAndersen and Piterburg (2007) derive conditions under which the moments of the\
    \ terminal stock price, $E[S_T^\\omega]$, explode (become infinite) within a finite\
    \ amount of time. The results of their paper can be used to find values of $\\\
    omega > 1$ for which $E[S_T^\\omega]$ remains finite for all $T$, using their\
    \ analytic expressions for the time to moment explosion $T^* = \\sup\\{t: E[S_t^\\\
    omega] < \\infty\\}$. The moment will be finite for $T < T^*$ and will explode\
    \ to infinity for $T > T^*$. Define the quantities\n\n$k = \\frac{\\lambda_l^2}{2}\\\
