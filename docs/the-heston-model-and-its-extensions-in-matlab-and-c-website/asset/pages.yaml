    \ Boundary\n\nThe European call in Equation (8.87) requires no new quantities\
    \ beyond those of\noriginal Heston (1993) model, but the early exercise premium\
    \ V($x_0,v_0,\tau$) requires\nestimates of the two unknowns $b_0(\tau)$ and $b_1(\t\
    au)$ in 8.72). Using two distinct values\nv_0=v_0(\tau)$ and $v_1=v_1(\tau)$ of\
    \ the variance, along with the boundary condition for\nthe call at b($v,\tau$),\
    \ Chiarella and Ziogas (2006) obtain the following system of two\nequations\n\n\
    ```\n$C_A(v_0(\tau), v, \tau) = \\exp(b_0(\tau) + b_1(\tau)v_0(\tau)) - K$\n$C_A(v_1(\t\
    au), v, \tau) = \\exp(b_0(\tau) + b_1(\tau)v_1(\tau)) - K$\n```\n\nand suggest\
    \ an iterative method to solve this system. The method works by dividing\ntime\
    \ interval (0,T) into N subintervals of increasing length $\tau_1,\\dots,\\tau_N$,\
    \ where\n$\\tau_n=n\\cdot dt$, $n=1,\\dots,N$ and $dt=\tau/N$ is the time interval.\
    \ Denote $b_0^n=b_0(\tau_n)$,\nb_1^n=b_1(\tau_n)$, $v_0^n=v_0(\tau_n)$, and $v_1^n=v_1(\t\
    au_n)$. The starting values for $b_0^0$ and $b_1^0$ at time\nare are\n\n```\n\
    $b_0^0 = \\max(\\ln\\frac{rK}{q}, \\ln K) \\quad \\text{and} \\quad b_1^0 = 0$\n\
    ```\n\nand the starting values for $v_0^0$ and $v_1^0$ are\n\n```\n$v_0^0 = E[v_0|v_0]\
    \ + \\frac{\\sigma}{\\sqrt{2}}$\n$v_1^0 = E[v_1|v_0] - \\frac{\\sigma}{\\sqrt{2}}$\n\
    ```\n\nThe conditional expectation for the variance was presented in Chapter 2\n\
    \n```\n$E[v|v_0] = \\theta + (v_0-\\theta)e^{-(t-\tau)}$\n```\n\nAt each time\
    \ step $n$, the variances $v_0^n$ and $v_1^n$ are updated using Equation (8.83)\n\
    with $v_r=v_0$, and $t=\tau$ and $t=\tau_n$ in (8.84). This specification ensures\
    \ that\nvv_0^n$ and $v_1^n$ will be distinct, as indicated in Figure 8.5, which\
    \ reproduces Figure 1 of\nChiarella and Ziogas (2006).\n\nThe coefficients $b_0^n$\
    \ and $b_1^n$ are updated iteratively, by obtaining a successful set\nof coefficients\
    \ $b_{0,k}^n$ and $b_{1,k}^n$ that are the roots of the non-linear equations $g_1$\
    \ and $g_0$\ndeined as\n\n```\n$g_1(b_{1,k}^n) = \\frac{1}{k}[ln C_A(exp(b_{0,k}^{n-1}+b_{1,k}^{n-1}v_0^{n-1}),v_0^{n-1},\\\
