- pgno: 52
  md: "# Integration Issues, Parameter Effects, and Variance Modeling\n\nWe use the\
    \ approximation to the standard normal distribution function $\\Phi(x)$ due to\
    \ Baggy (1995). The approximation to the integral\n\n$P(x) = \\frac{1}{\\sqrt{2\\\
    pi}} \\int_{0}^{x} e^{-t^2/2} dt$$\n\nfor $x > 0$, is based on\n\n$Q(x) = \\frac{1}{2}\
    \ \\left| 1 - \\frac{1}{30} \\left[ 7e^{-x^2/2} + 16e^{-x^2(2-\\sqrt{2})} \\right]\
    \ + \\left(7 + \\frac{\\pi x^2}{4}\\right)e^{-x^2} \\right] \\right.$\n\nHence,\
    \ Baggy (1995) approximation is\n\n$$\\Phi(x) \\approx \\begin{cases} 0.5 + Q(x)\
    \ & x > 0 \\ 0.5 - Q(x) & x < 0. \\end{cases}$\n\n```\nstatic double NormCDF(double\
    \ x) {\ndouble x1 = 7.0*Math.Exp(-0.5*x*x);\ndouble x2 = 16.0*Math.Exp(-x*x*(2.0\
    \ - Math.Sqrt(2.0)/sqrt(2.0)));\ndouble x3 = (7.0 + 0.25*Math.PI*x*x)*Math.Exp(-x*x);\n\
    double Q = 0.5*Math.Sqrt(1.0 - (x1 + x2 + x3)/30.0);\nif(x > 0) {\n    return\
    \ 0.5 + Q;\nelse\n    return 0.5 - Q;\n}\n```\n\nThis function is fed into the\
    \ C function BlackScholes(), which calculates the Black-Scholes price of a European\
    \ vanilla option. The price is used in the BisecBSIV() function.\n\n```\nstatic\
    \ double BlackScholes(double S,double K,...) {\ndouble d1 = Math.Log(S/K) + (rf-q*v/2.0)*T)\
    \ / v / Math.Sqrt(T);\ndouble d2 = v*Math.Sqrt(T);\ndouble BSCall = S*Math.Exp(-q*T)*NormCDF(d1);\n\
    K*Math.Exp(-rf*T)*NormCDF(d2);\ndouble Price = 0.0;\nif (PutCall == \"call\")\
    \ {\n    Price = BSCall;\nelelse if (PutCall == \"put\") {\n    Price = BSCall\
    \ - S*Math.Exp(-q*T) + K*Math.Exp(-rf*T);\nreturn Price;\n}\n```\n\nAll the figures\
    \ in this section can be generated by the earlier snippets of Matlab code. Figure\
    \ 2.9, example, presents a surface of implied volatilities and local volatilities\
    \ extracted from Heston call prices. It is generated using the following Matlab\
    \ code."
  merge: -1
