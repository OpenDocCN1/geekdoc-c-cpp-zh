  md: "# 34 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n# EFFECT OF THE\
    \ HESTON PARAMETERS\n\n# Heston Terminal Stop Price\n\nUnder the Heston model,\
    \ the distribution of the log stock price at maturity, $ln S_T$, is able to exhibit\
    \ skewness and the excess kurtosis, depending on the parameter settings. In the\
    \ following section, the effect of the correlation $\rho$ and the volatility of\
    \ variance $\\sigma$ on the distribution of $ln S_T$ are investigated.\n\n# Effect\
    \ of Correlation and Volatility of Variance\n\nThe correlation parameter $\rho$\
    \ controls the skewness of the density of $ln S_T$ and of the continuously returned\
    \ In $ln(S_T/S_0)$ over $[0, T]$. When $\rho > 0$, the probability densities will\
    \ be positively skewed, and when $\rho < 0$, the densities will be negatively\
    \ skewed. The figures in this section use the parameter settings from Table 1\
    \ of Heston (1993) to demonstrate this. $v_0 = 0.01, \\kappa = 2, \theta = 0$,\
    \ and $\\sigma = 0.1$. The density of $ln S_T$ can be recovered by inverting its\
    \ characteristic function $f_t(\\phi)$, as in Equation (2.5), and applying a numerical\
    \ integration scheme. The densities in Figure 2 use $\rho = -0.8$, $\rho = 0$,\
    \ and $\rho = 0.8$. The figure is similar to Figure 1 of Heston (1993) and clearly\
    \ indicates the relationship between correlation and skewness.\n\nAs explained\
    \ by Heston (1993), positive correlation implies a rise in variance when the stock\
    \ price rises. This has the effect of fattening the right tail of the\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_45_0.png)\n\
    \n**FIGURE 2.4** Effect of Correlation on Density"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Integration Issues, Parameter Effects, Variance Modeling\n\ndistribution,\
    \ and thinning the left tail. When the correlation is negative, the opposite happens.\
    \ It will be shown in the next section that a negative correlation results in\
    \ deep-of-the-money calls being priced higher in the Heston model than in the\
    \ Black-Scholes model.\n\nThe volatility of variance parameter $\\sigma$ controls\
    \ the kurtosis. When $\\sigma$ is high, the variance process is highly dispersed,\
    \ so we expect the distribution of returns to have higher kurtosis and fatter\
    \ tails when $\\sigma$ is small. This is illustrated in Figure 2.5 for $\\sigma\
    \ \\approx 0$, $\\sigma = 0.2$, and $\\sigma = 0.4$. The figure is illustrated\
    \ in Figure 3 of Heston (1993).\n\n# Comparison With Black-Scholes Prices\n\n\
    The results illustrated in Figures 2.4 and 2.5 suggest that, because of the skew\
    \ in returns produced by the Heston model, option prices generated by the Black-Scholes\
    \ model in a way that is sensible. In this sense, we investigate the effect of\
    \ the correlation parameter $\rho$ and the volatility of variance parameter $\\\
    sigma$ on call prices in this regard.\n\nWhen $\rho > 0$, the skew in the distribution\
    \ of $S_T$ is positive, so more weight is assigned to the right tail of the distribution.\
    \ Out-of-the-money (OTM) calls have a strike price that lies in the right tail.\
    \ This implies that, when $\rho > 0$, deep OTM calls produced by the Heston model\
    \ should be more expensive than those produced by the Black-Scholes model. In-the-money\
    \ (ITM) calls have a strike price that lies in the left tail. Since less weight\
    \ is assigned to the left tail, ITM calls from the Heston model should be less\
    \ expensive than those produced by Black-Scholes. Similarly,\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_46_0.png)\n\
    \n**FIGURE 2.5** Effect of Volatility of Variance on Density"
