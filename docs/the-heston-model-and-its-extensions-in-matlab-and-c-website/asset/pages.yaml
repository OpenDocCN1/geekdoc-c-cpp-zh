- pgno: 14
  md: "# 2 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n$\rho \\in [-1,\
    \ 1]$ the correlation between the two Brownian motions $W_1$ and $W_2$; and $\\\
    lambda$ the volatility risk parameter. We define this parameter in the next section\
    \ and explain why we set this parameter to zero.\n\nWe will see in Chapter 2 that\
    \ these parameters affect the distribution of the terminal stock price in a manner\
    \ that is intuitive. Some authors refer to $v_0$ as an unobserved initial state\
    \ variable, rather than a parameter. Because volatility cannot be observed, only\
    \ estimated, and because $v_0$ represents this variable at time zero, this characterization\
    \ is sensible. For the purposes of estimation, however, many authors treat $v_0$\
    \ as parameter like any other. Parameter estimation is covered in Chapter 6.\n\
    \nIt is important to note that the volatility $\\sqrt{v_t}$ is not modeled directly\
    \ in the Heston model, but rather through the variance $v_t$. The process for\
    \ the variances arises from the Ornstein-Ulenbeck process for the volatility $b_t\
    \ = \\sqrt{v_t}$, given by\n\n```\n$db_t = -\beta b_t dt + \\delta dW_{2,t}$.\
    \ \\quad (1.2)$\n```\n\nApplying Itô’s lemma, $v_t$ follows the process\n\n```\n\
    $dv_t = (\\delta^2 - 2\beta v_t)dt + 2\\delta\\sqrt{v_t}dW_{2,t}$. \\quad (1.3)$\n\
    ```\n\nDefining $\\kappa = 2\beta$, $\theta = \\delta^2/(2\beta)$, and $\\sigma\
    \ = 2\\delta$ expresses $dv_t$ from Equation (1.1) as (1.3).\n\nThe stock price\
    \ and volatility follow the process in Equation (1.1) under the historical measure\
    \ $\\mathbb{P}$, also the physical measure. For pricing purposes, however, we\
    \ need the processes for $(S_t, v_t)$ under the risk-neutral measure $\\mathbb{Q}$.\
    \ In the Heston model, this is done by modifying each SDE in Equation (1.1) separately\
    \ by an application of Girsanov’s theorem. The risk-neutral process for the stock\
    \ price is\n\n```\n$dS_t = rS_t dt + \\sqrt{v_t}S_t d\\widetilde{W}_{1,t}$. \\\
    quad (1.4)$\n```\n\nwhere\n\n```\n$\\widetilde{W}_{1,t} = \\left(W_{1,t} + \\\
    frac{\\mu-r}{\\sqrt{v_t}}t\right)$\n```\n\nIt is sometimes convenient to express\
    \ the price process in terms of the log price instead of the itself. By an application\
    \ of Itô’s lemma, the log price process is\n\n```\n$dln S_t = \\left(\\mu - \\\
    frac{1}{2}\right)dt + \\sqrt{v_t}dW_{1,t}$.\n```\n\nThe risk-neutral process for\
    \ the log price is\n\n```\n$dln S_t = \\left(r - \\frac{1}{2}\right)dt + \\sqrt{v_t}d\\\
    widetilde{W}_{1,t}$. \\quad (1.5)$\n```\n\nIf the stock pays a continuous dividend\
    \ yield, $q$, then in Equations (1.4) and (1.5) we replace $r$ by $r-q$."
