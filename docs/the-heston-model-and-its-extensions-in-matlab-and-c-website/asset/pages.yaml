  md: "# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhere\n\n```\n$K_0\
    \ = \\frac{\\kappa\\theta}{\\sigma}dt, \\quad K_1 = \\left(\\frac{\\kappa\\rho}{\\\
    sigma} - \\frac{1}{2}\\right)y_1dt - \\frac{\\rho}{\\sigma}, \\quad K_2 = \\left(\\\
    frac{\\kappa\\rho}{\\sigma} - \\frac{1}{2}\\right)y_2dt + \\frac{\\rho}{\\sigma}$$\n\
    $K_3 = (1 - \\rho^2)y_1dt, \\quad K_4 = (1 - \\rho^2)y_2dt.$\n```\n\nThe constants\
    \ $\\gamma_1$ and $\\gamma_2$ in these expressions are arbitrary. When $\\gamma_1=1$\
    \ and $\\gamma_2=0$ produces an Euler-type scheme, when $\\gamma_1=\\gamma_2=1/2$\
    \ produces a central discretization. With these values, the algorithm to generate\
    \ a value of $S_{t+dt}$, $v_t$, and $v_{t+dt}$ is evident\n\n# Martingale Correction\n\
    \nUnder the risk-neutral measure $\\mathbb{Q}$, the discounted asset price will\
    \ be a martingale in continuous time. On the other hand, the discretized stock\
    \ price\n\n```\n$S_{t+dt} = S_t \\exp\\left((r-q)dt + K_0 + K_1v_t + K_2v_{t+dt}\
    \ + \\sqrt{K_3v_t + K_4v_{t+dt}}Z_v\\right)$ (7.48)\n```\n\nwill not be a martingale.\
    \ The unbiased bias is minor, since the drift away from the martingale can be\
    \ corrected by reducing the size of the time increment, $dt$. Nonetheless, Andersen\
    \ (2008) shows that the martingale property can be satisfied simply by replacing\
    \ $K_0$ with $K_0^*$ given\n\n```\n$K_0^* = -ln M - \\left(K_1 + \\frac{1}{2}K_3\\\
    right)v_t.$ (7.49)\n```\n\nThe martingale correction makes use of the term $A\
    \ = K_2 + \\frac{1}{2}K_4$, along with $a$ and $b$ defined in Equation (7.42)\
    \ and $\beta$ defined in (7.43). When $\\psi \\leq \\psi_c$, we can implement\
    \ the martingale correction provided that $A < 1/(2a)$, and the expression for\
    \ M\n\n```\n$M = \\left(\\\\frac{Ab^2a}{1-2Aa}\\sqrt{1-2Aa}}\\right)$ (7.50)\n\
    ```\n\nWhen $\\psi > \\psi_c$, we can implement the martingale correction provided\
    \ that $A < \\beta$, and the expression for M\n\n```\n$M = p + \\frac{\\beta(1-p)}{\\\
    beta-A}.$ (7.51)\n```\n\nThe simulation of stock price paths through Quadratic\
    \ Exponential scheme is implemented with the QESim.m function. Parts of the function\
    \ have been removed to conserve space."
