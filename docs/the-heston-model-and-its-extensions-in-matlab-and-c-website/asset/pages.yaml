    \ readonly object sync = new object();\npublic static double RandomNum(double\
    \ a,double b) {\n    int divisor = 1000000000;\n    lock(sync) { return a = (b-a)*U.Next(0,divisor)/divisor;\
    \ }\n    n Random integer in (a,b) }\nprivate static readonly Random U1 = new\
    \ Random();\nprivate static readonly object sync1 = new object();\npublic static\
    \ int RandomInt(int a,int b) {\n    lock(sync1) { return U1.Next(a,b); }\n```\n\
    \nThe RandomPerm() function generates a random permutation of a vector of integers.\n\
    \n```\npublic static int RandomPerm(int[] a {\n    int N = a.Length;\n    int[]\
    \ F = new int[N];\n    for(int i=0;i<=N-1;i++) F[i] = new int[2] { 0 , 0 };\n\
    \    for(int j=0;j<N-1;j++) {\n        for(int i=0;i<=N-1;i++) {\n           \
    \ F[j][0] = RandomInt(0,100);\n            F[j][1] = j;\n        }\n        //\
    \ Sort the F array w.r.t column 0\n        int column = 0;\n        Array.Sort(F,\
    \ delegate(int[] w1, int[] w2) {\n            return (w1[column] as IComparable).CompareTo(w2[column]);\n\
    \        });\n        int[] b = new int[N];\n    for(int j=0;j<N-1;j++) b[j] =\
    \ F[j][1];\n    return b;}\n```\n\nFinally, the RemoveIndex() function creates\
    \ vectors of integers with one of the indices removed.\n\n```\npublic static int\
    \ RemoveIndex(int[] a,int position) {\n    int N = a.Length;\n    int[] b = new\
    \ int[N-1];\n    if(position == 0) {\n        for(int i=1;i<=N-1;i++) b[i-1] =\
    \ a[i];\n    else if(position == N-1) {\n        for(int i=0;i<=N-2;i++) b[i]\
    \ = a[i];\n    else {\n        for(int i=0;i<=position-1;i++) b[i] = a[i];\n \
    \       for(int i=position;i<=N-2;i++) b[i] = a[i+1];\n    }\n    return b;}\n\
    ```"
