  md: '# Time-Dependent Heston Models


    # BLACK-SCHOLES DERIVATIVES


    To obtain the approximated put price of Benhamou et al. (2010) in Equation (9.48),
    we need high-order derivatives of the Black-Scholes put. The derivative of the
    standard normal density $\phi(x) = e^{-x^2}/\sqrt{2\pi}$ is $\phi''(x) = -x\phi(x)$.
    It is easy to verify the derivatives $f_x = g_x = -y^{-1/2}$, $g_y = \frac{1}{2}y^{-1}f$
    and $f_y = -\frac{1}{2}y^{-1}g$.


    For the derivatives of $\Phi(f)$ and $\phi(f)$ we have $\Phi(f)_x = -\phi(f)y^{-1/2}$,
    $\phi(f)_x = y^{-1/2}f(f)\phi(f)$, $\Phi(f)_y = \frac{1}{2}y^{-3/2}\phi(f)(1-fg)$,


    ```

    $\Phi(f)_{x,y} = \frac{1}{2}y^{-2}\Phi(2f+g-f^2g)$,

    ```


    ```

    $\Phi(f)_{y,y} = \frac{1}{2}y^{-2}\Phi(g+\frac{1}{2}f-\frac{1}{2}g^2)$,

    ```


    ```

    $\Phi(f)_{x,x} = \frac{1}{2}[y^{-2}\phi_y-2y^{-3}\phi(2f+g-f^2)+y^{-2}\Phi(2f_x+g_x-2f_xf_x-f^2g_x)]$,

    ```


    Similarly, for derivatives involving $\Phi(g)$ and $\phi(g)$, we have $\Phi(g)_x
    = -\phi(g)y^{-1/2}$, $\Phi(g)_y = -\frac{1}{2}\phi(g)y^{-1}$, $\Phi(g)_x = y^{-1/2}f(g)\phi(g)$,
    $\Phi(g)_y = y^{-3/2}\phi(g)(1-fg)$,


    ```

    $\Phi(g)_{x,y} = \frac{1}{2}y^{-2}\Phi(2g+f-g^2f)$,

    ```


    ```

    $\Phi(g)_{y,y} = \frac{1}{2}y^{-2}\Phi(f+\frac{1}{2}g-\frac{1}{2}f^2)$,

    ```


    ```

    $\Phi(g)_{x,x} = \frac{1}{4}y^{-2}\phi(g)(2g+f-g^2)+\Phi(g)(2g_x+f_x-2g_xf_x-g^2f_x)$,

    ```


    ```

    $\Phi(g)_{y,y} = \frac{1}{2}[y^{-2}\phi_y-2y^{-3}\phi(2g+f-g^2)+y^{-2}\Phi(2g_y+f_y-2gg_y-g^2f_y)$,

    ```


    The required derivatives of the Black-Scholes put are, therefore,


    ```

    $\frac{\partial^2 P_{BS}}{\partial x\partial y} = Ke^{-rt}\Phi(g)_x-e^{-rt}e^x[\Phi(g)_y+\Phi(g)_{xy}]$,

    ```


    ```

    $\frac{\partial^3 P_{BS}}{\partial x^2\partial y} = Ke^{-rt}\Phi(f)_{xy}-e^{-rt}e^x[\Phi(g)_{yy}+2\Phi(g)_{xy}+\Phi(g)]$,

    ```


    ```

    $\frac{\partial^2 P_{BS}}{\partial y^2} = Ke^{-rt}\Phi(f)_{yy}-e^{-rt}e^x\Phi(g)_y$,

    ```


    ```

    $\frac{\partial^4 P_{BS}}{\partial x^2\partial y^2} = Ke^{-rt}\Phi(f)_{x^2y^2}$

    ```


    ```

    -e^{-rt}e^x[\Phi(g)_y+2\Phi(g)_{xy}+\Phi(g)_{y^2}+2\Phi(g)_{xy^2}+\Phi(g)+\\Phi(g)_{x^2y^2}].

    ```'
