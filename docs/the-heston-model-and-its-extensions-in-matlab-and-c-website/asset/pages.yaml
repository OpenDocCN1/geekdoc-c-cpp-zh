    The probabilities for $v_t$ are calculated using the Matlab function probV.m.
    The function applies Equation (8.23) for the case $x_t > 0$ and (8.24) for the
    case $x_t = 0$.


    ```

    function [pu pm pd] = probV(X,X0,dt,kappa,theta,sigma)

    muX = 1/X*(0.5*kappa*(4/theta*sigma^2 - X^2) - 0.5);

    J = floor(muX*sqrt(dt)/b + 1/b^2);

    if X > 0

    % Probabilities where X > 0 (Equation 28)

    pu = 1/2/b^2 - J/2 + 1/2/b*muX*sqrt(dt);

    pm = 1 - 1/b^2;

    pd = 1/2/b^2 + J/2/b*muX*sqrt(dt);

    else

    % Probabilities where X = 0 (Equation 33)

    Xu = X + b*(J+1)*sqrt(dt);

    Vu = Xu^2*sigma^2/4;

    pu = kappa*theta*dt/Vu;

    pm = 0;

    pd = 1 - pu;

