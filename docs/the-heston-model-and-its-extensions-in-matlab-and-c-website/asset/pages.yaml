  md: "The function BGMAApproxPriceTD.m calculates the approximate put value\nunder\
    \ piecewise maturities. We illustrate the function with the code for\nt coefficient\
    \ $a_{i,T_1}$ in (9.66). The code for the other coefficients is similar.\neginning\
    \ of the function parameters in the order specified by (9.65) and\ncalculates\
    \ the first component of the coefficients, corresponding to the first time step.\n\
    The first component is the term $a_{1,T}$ in (9.66), obtained using (9.55).\n\n\
    ```\nfunction y = BGMAApproxPriceTD(param,T,S,K,rf,q,PutCall)\nNT = length(T);\n\
    Nparam = 2 + 3*NT;\nkappa = param(1);\nv0 = param(2);\nfor i=1:3:Nparam\nj = floor(i/3);\n\
    theta(j) = param(i);\nsigma(j) = param(i+1);\nrho(j) = param(i+2);\nend\n% First\
    \ set of coefficients\nal1(1) = -rho(1)*sigma(1)*(2*theta(1)*exp(kappa*T(1))+2-)\
    \ + ...\na2T(1) = -1/2*rho(1)^2*sigma(1)^2*(kappa^2*v0*T(1)+2-) + ...;\nb0T(1)\
    \ = -1/4*sigma(1)^2*(5+theta(1)*exp(kappa*T(1))*2-) + ...;\nb2T(1) = al1(1)^2;\n\
    ```\n\nThe second part calculates the remaining portion of the coefficients. The\
    \ terms\nA1 correspond to the integrals in (9.66), in the same order.\n\n```\n\
    % Remaining sets of coefficients\nAl = 0;\nif NT>=2\nfor t=1:NT-1\n  % Coefficients\
    \ for alT(T+1)\n  for j=1\n    Al = Al + rho(j)*sigma(j)*(-exp(-kappa*T(t))) +\
    \ ...;\n  for j=2:t\n    Al = Al - rho(j)*sigma(j)*(-exp(-kappa*T(t))) + ...;\n\
    \  for j=t+1\n    Al = Al - rho(j)*sigma(j)*(-v0*exp(kappa*T(t+1)) + ...;\n  alT(t+1)\
    \ = alT(t) + Al;\nend\n```\n\nThe third and final part retains the last element\
    \ of the arrays for the coefficients,\ncalculates the required derivatives, and\
    \ calculates the put price in Equation (9.48).\nThe function returns the call\
    \ price by put-call parity."
