    \ is not possible, and we work with (10.19) directly. This is illustrated with\
    \ the Matlab function HestonExplicitPDENonUniformGrid. Again, only the terminal\
    \ values of Un are retained.\n\n```\nfunction U = HestonExplicitPDENonUniformGrid(params,....)\n\
    for s=1:NS\n    for v=1:NV\n        U(s,v) = max(S) - K, 0);\n    end\nfor t=1:NT-1\n\
