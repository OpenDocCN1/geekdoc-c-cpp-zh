  md: "# 76      THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nprice to the\
    \ function. When Whaley (2006) for an explanation. Finally, the C# code to implement\
    \ the Carr and Madan (2009) method is similar to the Matlab code and is not presented\
    \ here.\n\n# BOUNDS ON THE CARR-MADAN DAMPING FACTOR AND OPTIMAL VALUE\n\nCarr\
    \ and Madan (1999) demonstrate that a sufficient condition for $c(k)$ to be integrable\
    \ is that $c'(0)$ in Equation (3,43) is finite. By setting $v=0$ in (3,43), we\
    \ can see that this is guaranteed when the characteristic function $\\varphi-(\\\
    alpha+1)$ is finite, namely when $\\psi(-(\\alpha+1)) < \\infty$. Since $\\psi(v)\
    \ = \\ln E[e^{ivS_t}]$, the condition $\\varphi(-(\\alpha+1)) < \\\\infty$ is\
    \ equivalent to the existence of the $(\\alpha+1)$-st moment of $S_t$, $E[S_t^\\\
    alpha] < \\infty$. For some, it is possible to find $\\alpha_{\\max}$ the maximum\
    \ value for $\\alpha$, by setting the condition $E[S_t^\\alpha]$ in the characteristic\
    \ function and solving for $\\alpha$ analytically. Carr and Madan (1999) suggest\
    \ using $\\alpha_{\\max}/4$ and illustrate this that for the Variance Gamma model,\
    \ for which they chose $\\alpha=5$ (see also Carr, Madan, and Chang, 1998). Other\
    \ values, such as those by Rumble (2000), Schoutens et al. (2011) have used ad-hoc\
    \ values of $0.75$ to $\\alpha=25$.\n\nWhile ad-hoc values of the damping factor\
    \ $\\alpha$ serve as a general guide, it is more useful to have a range of admissible\
    \ values for $\\alpha$. To this end, Lee (2004a) shows how minimum and maximum\
    \ values for $\\alpha$ can be obtained. Denote by $A_X=(a-, a_+)$ the interval\
    \ of allowable values for $\\alpha+1$, where $a_- < 0$ and $a_+ > 1$, so that\
    \ $\\alpha$ can be selected from any member in the interval $(a_--1, a_+-1) =\
    \ (\\alpha_{\\min}-1, \\alpha_{\\max}-1)$. The values of $a_-$ and $a_+$ can be\
    \ found by solving the following equality for\n\n> $g(-ia)e^{d(-ia)u} = 1 \\quad\
    \ (3.45)\n\nwhere $g(\\phi)$ and $d(\\phi)$ are $g_2$ and $d_2$, of the Heston\
    \ characteristic function $(j=2)$, with $\\lambda=0$, that is\n\n> $g(\\phi) =\
    \ \\frac{\\kappa-\\rho\\sigma\\phi}{\\kappa-\\rho\\sigma\\phi-d(\\phi)}, \\quad\
    \ d(\\phi) = \\sqrt{(\\kappa-\\rho\\sigma\\phi)^2+\\sigma^2\\phi^2}$\n\nSolving\
    \ Equation (3.45) requires a non-linear search algorithm and will generate multiple\
    \ solutions, but we need only $a_-<0$ and $a_+>1$. When $\\kappa-\rho\\sigma>0$,\
    \ we define $a_-$ to be the largest solution in $(-\\infty, y_-)$ and $a_+$ to\
    \ be the smallest solution in $(y_+, \\infty)$, where\n\n> $y_{\\pm} = \\frac{\\\
    sigma-2\\kappa\\rho\\pm\\sqrt{\\sigma^2-4\\kappa\\rho\\sigma+4\\kappa^2}}{2(1-\\\
    rho^2)} \\quad (3.46)\n\nThis means that, given multiple solutions to (3,45),\
    \ we select $a_-<0$ to be the closest to $y_-$, and with multiple solutions greater\
    \ than, we select $a_+1$ to be the closest to $y_+$. The interval of allowable\
    \ values for $\\alpha$ is then $\\alpha \\in (a_--1, a_+-1)$. These $y_{\\pm}$\
    \ arise as the roots of $d(-i\\phi)^2$\n\n> $d(-i\\phi)^2 = (\\kappa-\\rho\\sigma\\\
    phi)^2+\\sigma^2\\phi^2\\n= \\phi^2(\\rho^2\\sigma^2+\\sigma^2)+\\phi(\\sigma^2-2\\\
    kappa\\rho\\sigma)+\\kappa^2$"
