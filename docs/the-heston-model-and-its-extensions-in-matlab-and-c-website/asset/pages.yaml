  md: "# American Options\n\nthe early exercise premium. The built-in Matlab function\
    \ fminbd.m for bounded optimization in a single variable is used to find $\\hat{y}$\
    \ from Equation (8.70), using max($\\theta,2,3) as the bounds.\n\n```\nfunction\
    \ [EuroPutClosed AmerPutMS AmerPut EEP the y] = MSPrice(...);\n// Closed-form\
    \ European put\nEuroPutClosed = HestonPriceNewtonCoates('P',...);\n// Find the\
    \ barrier level, y\ntheta = max(2,theta);\nlo = max(Strike(S)/sqrt(v0)/sqrt(T));\n\
    fminbd(@p MSHeston(p,...,NumTerms),lo,3);\n// Euro and Amer put by MS expansion,\
    \ and early ex. premium\nEuroPutMS = MSPutHeston(y,...,NumTerms);\nAmerPutMS =\
    \ MSPutHeston(y, ...NumTerms);\nEEP = AmerPutMS EuroPutMS;\n// American put terms\
    \ using Approximation 2\nAmerPut = EuroPutClosed + EEP;\n```\n\nWith these functions,\
    \ generating American put prices using the second approximation of Medvedev and\
    \ Scaillet (2010) is straightforward. The C# code to generate the American put\
    \ price is similar and not presented. In C#, however, we use the bisection algorithm\
    \ to find $\\hat{y}$. We, therefore, the following C# function for the derivative\
    \ of the put price.\n\n```\nstatic double MSPutDiff(y,...,dy)\n{\n    return MSPutHeston(y+dy,...)\
    \ - MSPutHeston(y-dy,...)/2.0/dy;\n}\n```\n\nThe MSPrice() function uses MSPutHeston()\
    \ function, which contains the expansion terms, to generate the American put price\
    \ as the closed-form European, plus the early exercise premium.\n\n```\nstatic\
    \ double[] MSPrice(HParam param,...,int NumTerms double yinf)\n// Closed-form\
    \ European put\ndouble EuroPutClosed = HestonPriceNewtonCoates(param,opset,\n\
    method,A,B,N);\n// Moneyyness\ndouble theta = Math.Log(K/S)/Math.Sqrt(v0)/Math.Sqrt(T);\n\
    // Lower point for the bisection algorithm\ndouble a = Math.Max(2.0,theta);\n\
    // Find the barrier level\n```"
