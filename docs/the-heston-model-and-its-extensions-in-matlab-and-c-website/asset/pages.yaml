    \ It does not oscillate, is not steep anywhere, and rapidly decays to zero, starting\
    \ at around $\\phi = 10$. High oscillation of the integrand is usually associated\
    \ with short-maturity options.\n\n# THE LITTLE HESTON TRAP\n\nAlbrecher et al.\
    \ (2007) explain that the academic literature on the Heston model embodies two\
    \ different formulations of the Heston characteristic function. The first is the\
    \ original formulation of Heston (1993), while the second has a slightly different\
    \ form. Albrecher et al. (2007) show that these two formulations are equivalent,\
    \ but the second leads to a characteristic function that is much better behaved\
    \ and, better suited for numerical integration.\n\nThe original formulation of\
    \ the Heston characteristic function was derived in Chapter 1. To derive the second\
    \ formulation, first note that the solution to $D$ in Chapter 1 can be multiplied\
    \ by $\\exp(-d,\tau)$ in the numerator and denominator, which leads to the equivalent\n\
    \n```\n$D_j = \\frac{b_j - \\rho\\sigma\\varphi + d_j}{g_j\\sigma^2} \\left( \\\
    frac{1 - e^{-d_j,\\tau}}{1 - e^{-d_j,\\tau}/g_j} \\right) - \\frac{b_j - \\rho\\\
    sigma\\varphi - d_j}{\\sigma^2} \\left( \\frac{1 - e^{-d_j,\\tau}}{1 - c_j e^{-d_j,\\\
    tau}} \\right)$ (2.14)\n```\n\nwhere\n\n```\n$c_j = \\frac{1}{g_j} \\frac{b_j\
    \ - \\rho\\sigma\\varphi - d_j}{b_j - \\rho\\sigma\\varphi + d_j}$ (2.15)\n```\n\
    \nThe logarithm in the solution to C, can be written\n\n```\n$d_j\\tau - 2\\ln\
    \ \\left[ \\frac{1 - g^{d_j,\\tau}}{1 - g_j} \\right] = d_j\\tau - 2\\ln \\left[\
    \ \\frac{e^{d_j,\\tau}}{1 - g_j} \\right]$\\n= d_j\\tau - 2d_j\\tau - 2\\ln \\\
    left[ \\frac{e^{-d_j,\\tau}}{1 - g_j} \\right]$\\n= -d_j\\tau - 2\\ln \\left[\
    \ \\frac{1 - c_j e^{-d_j,\\tau}}{1 - c_j} \\right]$ (2.16)\n```\n\nThis implies\
    \ that $C_j$ can be written in the equivalent form\n\n```\n$C_j = ri\\varphi\\\
    tau + \\frac{K\\theta}{\\sigma^2} \\left((b_j - \\rho\\sigma\\varphi - d_j), \\\
    tau - 2\\ln \\left( \\frac{1 - c_j e^{-d_j,\\tau}}{1 - c_j} \\right) \\right)$\
    \ (2.17)\n```"
  merge: -1
