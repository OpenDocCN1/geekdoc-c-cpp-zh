- pgno: 16
  md: '# THE HESTON MODEL reversion AND ITS EXTENSIONS IN MATLAB AND C#


    The effect of the mean reversion $\kappa$ on the moments is intuitive and explained
    in Cox, Ingersoll, and Ross (1985). As $\kappa \to \infty$ the mean $m$ approaches
    the mean reversion rate $\theta$ and the variance $S_t^2$ approaches zero. As
    $\kappa \to 0$ the mean approaches the current level of variance, $v_t$, and the
    variance approaches $\sigma^2v_t(t-s)$.


    If the condition $2\kappa\theta > \sigma^2$ holds, the drift is sufficiently large
    for the variance process to be guaranteed positive and not reach zero. This condition
    is known as the Feller condition.


    # THE EUROPEAN CALL PRICE


    In this section, we show that the call price in the Heston model can be expressed
    in a manner which resembles the call price in the Black-Scholes model, which we
    present in Equation (1.76). Authors sometimes refer to this characterization of
    the call price as "Black-Scholes-like" or "à la Black-Scholes". The time-$t$ price
    of a European call on a non-dividend paying stock with spot price $S_t$, where
    the strike is $K$ and the time to maturity is $\tau$ is the discounted expected
    value of payoff under the risk-neutral measure


    ```

    $C(K) = e^{-r\tau}E^Q[(S_\tau - K)^+\n= e^{-r\tau}E^Q[(S_\tau - K)1_{S_\tau>K}]

    = e^{-r\tau}E^Q[S_\tau1_{S_\tau>K} - Ke1_{S_\tau>K}]

    = S_nP_1 - Ke^{-r\tau}P_2 \quad (1.12)$

    ```


    where 1 is the indicator function. The last line of (1.12) is the "Black-Scholes-like"
    call price formula, with $P_1$ replacing $\Phi(d_1)$, and $P_2$ replacing $\Phi(d_2)$
    in the Black-Scholes call price (1.76). In this section, we explain how the last
