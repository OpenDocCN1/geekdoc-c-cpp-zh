  md: "# 228 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n```\nVt = V(M+J(j),t);\n\
    if Y(n,t) > 0\n St = exp(Y(n,t) + rho/sigma*Vt + ht);\n P = cellmat(Prob(n,t));\n\
    \ B = cellmat(Branch(n,t));\nEuro(n,t) = P(1)*Euro(B,1),t+1) + ...;\nEuro(n,t)\
    \ = exp(-rf*dt)*Euro(n,t);\nAmer(n,t) = P(1)*Amer(B,1),t+1) + ...;\nAmer(n,t)\
    \ = exp(-rf*dt)*Amer(n,t);\nend\nif strcmp(PutCall,'C')\nAmer(n,t) = max(St -\
    \ Strike, Amer(n,t));\nelse strcmp(PutCall,'P')\nAmer(n,t) = max(Strike - St,\
    \ Amer(n,t));\nend\nend\nend\n```\n\nEuroPrice = Euro(1,1);\nAmerPrice = Amer(1,1);\n\
    \nWe use three possible versions of the BivariateTree.m functions, each of which\
    \ are identical except for the branch indices and nine joint probabilities are\
    \ stored. The function presented in the earlier snippets uses Matlab cells for\
    \ the probabilities and the ranges. This simplifies the coding in Matlab, but\
    \ it increases the computation time. The function BivariateTree2.m uses Matlab\
    \ cells or arrays for the probabilities and the branches. BivariateTree3.m uses\
    \ arrays which runs faster than the other two. Moreover, since it does not employ\
    \ Matlab cells, it is more easily translated into C#. The disadvantage is that\
    \ for the purposes of building the bivariate tree, arrays are more difficult to\
    \ work with cells. The C# code to calculate American option prices using the method\
    \ of Beliaeva and Nawalkha (2010) is similar to the Matlab code and BivariateTree3.m\
    \ function and is not presented here.\n\nTo illustrate, we reproduce the American\
    \ prices of Clarke and Parrot (1999) and Ikonen and Toivaren (2008). Using 50\
    \ time steps and the control variable technique, we obtain 1.96724, 1.105853,\
    \ 0.519488, 0.213408, and 0.081948, of which are accurate to within less than\
    \ one penny.\n\n# MEDVEDEV-SCAIL EXPANSION\n\nMedvedev and Scaillet (2010) developed\
    \ a method in which the American put price can be expressed analytically, as an\
    \ asymptotic expansion. Their method is applicable to a wide class of stochastic\
    \ volatility models. In this section, we first introduce their method for American\
    \ puts under the Black-Scholes model, and then present their expansion for the\
    \ Heston model. The advantage of their method is that the American put price is\
    \ available in an expansion which involves analytic terms only. Hence, the method\
    \ is able to generate Black-Scholes and Heston option prices very quickly."
