    # CONCLUSION


    In this chapter, we have presented several methods to value American options in
    the Heston model. The Least-Squares Monte Carlo (LSM) algorithm can be applied
    to the model in this regard, and will be shown in Chapter 12, to the double Heston
    model of Christoffersen et. (2009) as well. The explicit method, which will be
    covered in Chapter 10 when we present finite difference methods, can easily be
    adapted to handle American options also.


    In this chapter, we have reviewed the bivariate tree of Beliaeva and Nalwalkha
    (2010). Other multivariate trees for pricing American options in a stochastic
    volatility framework are from Ruckdeschel et al. (2013) and Vellekoop and Nieuwenhuis
    (2009), which are designed for the Heston model, and Leisen (2000) which can handle
    more general models. Finally, Zhylevsksky (2010) extends the approximation of
    Medvedev and Scaillet (2010), which is able to produce option prices very quickly,
    and the method of Chiarella and Ziogas (2006), which is designed for American
    calls and borrows from the method of Tzvailis and Wang (2003). In a recent paper,
    Arshabhia et al. (2012) adapt the method of Chiarella and Ziogas (2006) to American
    puts.


    All of the methods presented so far have assumed the Heston parameters to be static,
    as in the original formulation of Heston (1993). As shown in Chapter 6, the Heston
    model with static parameters is sometimes unable to provide a good fit to the
    volatility surface at short maturities. A number of researchers have modified
    the original Heston (1993) model to allow for parameters to be time-dependent.
    This enrichment of the model makes it more flexible and better able to fit the
    volatility surface at all maturities. We introduce the Heston model with time-dependent
    parameters in the next chapter.'
