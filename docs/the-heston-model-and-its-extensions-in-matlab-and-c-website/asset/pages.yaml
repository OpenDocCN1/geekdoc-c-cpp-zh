    \ at time $t$ and the integration domain dt\n\n```\n$\\mu(X_{t,u}, u)du \\approx\
    \ \\mu(X_t, t) \\int_t^{t+dt} du = \\mu(X_t, t)dt.$\n```\n\nWe use the left-point\
    \ rule since time $t$ the value $\\mu(X_t, t)$ is known. The right-point rule\
