    # THE HEST PDE


    In this section, we explain how to derive the PDE for the Heston model. This derivation
    is a special case of a PDE for general stochastic volatility models, described
    in books by Gatheral (2006), Lewis (2000), Musiela and Rutkowski (2011), Joshi
    (2008) and the others. The argument is similar to the hedging argument that uses
    a single derivative to derive the Black-Scholes PDE. In the Black-Scholes model,
    a portfolio is formed with the underlying stock, plus a single derivative which
    is used to hedge the stock and render the portfolio riskless. In the Heston model,
    however, an additional derivative is required in the portfolio, to hedge the volatility.
    Here, we form a portfolio consisting of one option $V(S,v,t)$, $\Delta$ units
    of the stock, and $\varphi$ units of another unit $U(S,v,t)$ for the volatility
    hedge. The portfolio has value


    ```

    $\Pi = V + \Delta S + \varphi U$

    ```


    ```

    $d\Pi = dV + \Delta dS + \varphi dU$.

    ```


    The strategy is similar to that for the Black-Scholes case. We apply Itô’s lemma
    to obtain the processes for $U$ and $V$, which allows us to find the process for
    $\Pi$. We then find the values of $\Delta$ and $\varphi$ that makes the portfolio
    riskless, and we use the result to derive the Heston PDE.'
