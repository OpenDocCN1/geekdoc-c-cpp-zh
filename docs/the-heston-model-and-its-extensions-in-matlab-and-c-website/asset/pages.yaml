    # Computer Implementation


    The Matlab function BuildVolTree.m builds the trees for the transformed variance

    x_t$ and the variance $v_t$. The first part of the function computes the $b$ parameter
    from

    Equation (8.26), finds the number of rows (NR) and the middle row (M)

    where the first node $x_0$ is placed, and initializes the first columns of the
    tree,

    corresponding to zero time and one time, respectively. To conserve portions

    of the function have been merged


    ```

    function X [V RBound] BuildVolTree(...)

