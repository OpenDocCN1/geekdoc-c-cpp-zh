  md: "```\nfunction y = MomentExplode(w, lambda, sigma, kappa, rho)\nif D>=0 & a>0\n\
    \    T = inf;\nelif D=0 & a>0\n    g = sqrt(D/2);\n    T = log((a/2+g)/(a/g))/g/sigma^2;\n\
    elif D<0\n    beta = sqrt (-D)/2);\n    if a<0 PI = pi;\n    else PI = 0;\n  \
    \  end\n    T = 2*(PI + atan(2*beta)/beta)/beta/sigma^2;\nend\ny = T;\n```\n\n\
    The C code is very similar to the Matlab code and, therefore, not presented here.\
    \ To illustrate, suppose that $\\kappa = 0.1$ and $\\sigma = 0.3$. If $\rho =\
    \ -0.7$, the second moment $(\\omega = 2)$ will explode after $T^* = 5.14$ years;\
    \ if $\rho = 0.7$, the moment will never explode.\n\n# BOUNDS ON IMPLIED VOLATILITY\
    \ SLOPE\n\nOne problem arises in modeling the volatility surface is that extrapolation\
    \ of the surface beyond observable strikes is often arbitrary. Lee (2004b) provides\
    \ guidance on this issue, by deriving the slopes of the implicit volatility at\
    \ extreme strikes. These slopes were subsequently refined by Benaim and Friz (2008).\n\
    \nDefine the log-money to $k = \\ln(K/F)$ where $F = E[S_T]$ is the forward price,\
    \ and let $\\sigma(k, T)$ denote implicit volatility at log-money $k$ and at maturity\
    \ $T$. The extreme tail of the implicit variance can be written as a linear function\
    \ of $|k|$ for some value of the slope coefficient\n\n> $$\\sigma^2(k, T) = \\\
    text{Coefficient} \\times \\frac{|k|}{T}$. \\quad (2.46)\n\nThe first moment is\
    \ implied for variance on extreme strikes on the right-hand side of the tail,\
    \ as $k \\to \\infty$. In this case, the tail slope is bounded above by 2, by\
    \ $\\sigma^2(k, T) < 2|k|$. The actual value of the slope coefficient is found\
    \ in the limit as\n\n> $$\\beta_R = \\lim_{k\\to\\infty} \\frac{\\sigma^2(k, T)}{T}$.\
    \ \\quad (2.47)\n\n$0 \\le \\beta_R \\le 2$. Here, as $k \\to \\infty$, we have\
    \ that $\\sigma^2(k, T) \\to \\beta_R|k|/T$. The result of Lee (2004b) is that\
    \ $\\beta_R$ is obtained as\n\n> $$\\beta_R = 2 - 4(\\sqrt{\\tilde{p}^2 + \\tilde{p}})$\
    \ \\quad (2.48)"
