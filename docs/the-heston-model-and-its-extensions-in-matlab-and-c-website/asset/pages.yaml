  md: "# Simulation in the Heston Model\n\n# Process for the Log-Stock Price\n\nAndersen\
    \ (2008) proposes a discretization scheme for lnS, that overcomes the problem\
    \ of \"leaky\" correlation brought on Euler discretization. Recall from Chapter\
    \ 3 that we use Cholesky decomposition to replace the correlated Brownian motions\
    \ $W_{1,t}$ and $W_{2,t}$ in the Heston bivariate system of SDEs with independent\
    \ Brownian motions $B_{1,t}$ and $B_{2,t}$, by defining $W_{1,t} = \rho B_{2,t}\
    \ + \\sqrt{1-\rho^2}B_{1,t}$ and $W_{2,t} = B_{2,t}$. The integral form of the\
    \ process for $v$, is, therefore\n\n```\n$v_{t+dt} = v_t + \\kappa dt - \\kappa\
    \ \\int_{t}^{t+dt} v_u du + \\sigma \\int_{t}^{t+dt} \\sqrt{v_u} dB_{2,\\mu}$\n\
    ```\n\nRearranging terms produces\n\n```\n$$\\int_{t}^{t+dt} \\sqrt{v_u} dB_{2,\\\
    mu} = \\frac{1}{\\sigma} (v_{t+dt} - v_t - \\kappa dt + \\kappa \\int_{t}^{t+dt}\
    \ v_u du)$ (7.44)\n```\n\nApplying Cholesky decomposition to Equation (7.10),\
    \ the integral form of the SDE for $lnS_t$, produces\n\n```\n$lnS_{t+dt} = lnS_t\
    \ + (r-q)dt - \\frac{1}{2}\\int_{t}^{t+dt} v_u du \\nn + \\int_{t}^{t+dt} \\sqrt{v_u}(dB_{2,\\\
    mu} + \\sqrt{1-\\rho^2}dB_{1,\\mu})$$ (7.45)\n```\n\nNow substituting equation\
    \ (7.44) into (7.45) to obtain\n\n```\n$lnS_{t+dt} = lnS_t + (r-q)dt + \\frac{\\\
    rho}{\\sigma}(v_{t+dt} - v_t - \\kappa dt) \\nn +(\\frac{\\kappa\\rho}{\\sigma})^2\
    \ \\int_{t}^{t+dt} v_u du + \\sqrt{1-\\\rho^2}\\int_{t}^{t+dt} \\sqrt{v_u}dB_{1,\\\
    mu}$$ (7.46)\n```\n\nAndersen (2008) uses the approximations\n\n```\n$v_{t+dt}\
    \ \\approx dt(\\gamma_1 v_t + \\gamma_2 v_{t+dt})$ \\nn $\\sqrt{v_u}dB_{1,\\mu}\
    \ \\approx Z_v \\sqrt{v_t}(\\gamma_1 v_t + \\gamma_2 v_{t+dt})$\n```\n\nwhere\
    \ $Z_v$ is standard normal. Substituting these approximations into produces\n\n\
    ```\n$lnS_{t+dt} = lnS_t + (r-q)dt + K_0 + K_1 v_t + K_2 v_{t+dt} + \\sqrt{K_3\
    \ v_t} + K_4 v_{t+dt}}Z_v$ (7.47)\n```"
