    \ since we do not have a symbolic calculator in C#, the code uses only the second\
    \ method to find (ρ,σ), via the objective function (6.9).\n\n# SPEEDING UP THE\
    \ ESTIMATION\n\nOne drawback of loss function estimation is that it can be very\
    \ time consuming, especially if many maturities and strikes are used. Kilin (2007)\
    \ suggests a very simple trick for speeding up the optimization routines of loss\
