  md: '# 18


    # THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    # CONSOLIDATING THE INTEGRALS


    It is possible to regroup the integrals for the probabilities $P_1$ and $P_2$
    into a single integral, which will speed up the numerical integration required
    in the call price calculation. Substituting the expressions for $P$, from Equation
    (1.41) into the call price in (1.66) and re-arranging produces


    ```

    $C(K) = \frac{1}{2}S_e^{-qt} - \frac{1}{2}Ke^{-rt} + \int_{0}^{\infty} Re \left[
    e^{\frac{-i\phi \ln K}{i\phi}} (S_e^{-qt} f_1(\phi; x, v) - Ke^{-rt} f_2(\phi;
    x, v)) \right] d\phi. \quad (1.71)$

    ```


    The advantage of this consolidation is that only a numerical integration is required
    instead of two, the so time will be reduced by almost one-half. The put price
    can be obtained using put-call, with the call price calculated using (1.71).


    The integrand of the consolidated form is in the function HestonProbCons.m.


    This function is found in the HestonPriceCons.m function, which calculates the
    call price in accordance with Equation (1.71).


    ```

    function y = HestonPriceCons(CallPut..., Trap, Lphi, Uphi);

    % Build the integration grid

    phi = [Lphi:dphi:Uphi];

    n = length(phi);

    for k=1:N

    inte(k) = HestonProbCons(phi(k),..., 1,trap);

    end

    I = trap(inte)*dphi;

    % The call price

    HestonC = (1/2)*S*exp(-q*T) - (1/2)*K*exp(-r*T) + I/phi;

    % The put price by put-call parity

    HestonP = HestonC - S*exp(-q*T) + K*exp(-r*T);

    ```'
