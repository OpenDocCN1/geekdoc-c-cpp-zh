  md: "# The Heston Greeks\n\n```\nfunction y = CarrMadanGreeks(alpha,...,Greek)\n\
    % Perform the numerical integration\nfor j=1:length(x)\n  u = x\n  I(j) = exp(-i*u*log(K))*HestonGreeks(u-alpha+1)*i,...,Greek);\n\
    \  I(j) = w(j)*real(I(j));\nend\n% Calculate the desired Greek\nif strcmp(Greek,\
    \ 'Delta') || strcmp(Greek, 'Gamma')\n  y = exp(-alpha*log(K))*sum(I)/pi;\nelif\
    \ strcmp(Greek, 'Vegas') || strcmp(Greek, 'Vanna')\n  y = exp(-alpha*log(K))*sum(I)/pi\
    \ * 2*sqrt(v0);\nend\n```\n\nIt is straightforward to verify that the Greeks we\
    \ calculated produce values that are close to their finite difference approximations.\
    \ The C# code to implement the Greeks under the Carr and Madan (1999) formulation\
    \ is similar to the Matlab code and not presented here.\n\n# GREEKS UNDER THE\
    \ LEWIS FORMULATIONS\n\nRecall from Chapter 4 that the Lewis (2000) expressions\
    \ for the call price can be written in terms of the fundamental transformation\
    \ $\\hat{H}(k,v,\\tau)$ as\n\n$C_1(K) = \\frac{Ke^{-rt}}{\\pi} \\int_0^{\\infty}\
    \ Re\\left\\frac{e^{-ikX}}{k^2-ik}\\right] \\hat{H}(k,v,\\tau) dk \\quad (11.39)$\n\
    \nfor $k_i < \\beta$, and as\n\n$C_2(K) = S_t e^{-qt} \\int_0^{\\infty} Re\\left\\\
    frac{e^{-ikX}}{k^2-ik}\\right] \\hat{H}(k,v,\\tau) dk \\quad (11.40)$\n\nfor $\\\
    max(0,\\alpha) < k_i < \\min(1,\\beta)$ and where $X = ln(S/K) + (r-q)\\tau$.\
    \ We can easily differentiate the integrands for $C_1(K)$ and $C_2(K)$ to obtain\
    \ analytical examples for the Greeks, as we did in the previous sections. Gamma,\
    \ for example, is given by\n\n$$\\Gamma = \\frac{Ke^{-rt}}{\\pi S^2} \\int_0^{\\\
    infty} Re[e^{-ikX}\\hat{H}(k,v,\\tau)] dk. \\quad (11.41)$\n\nThe Matlab function\
    \ LewisIntegrandGreek.m is a modification of the function LewisIntegrand.m from\
    \ Chapter 4 and returns the integrand required for the calculation of Greeks using\
    \ either $C_1(K)$ or $C_2(K)$. It also returns the integrand for the price itself."
