- pgno: 213
  md: '# CHAPTER 8


    # American Options


    # Abstract


    In this chapter, we present methods to value American options in the Heston model.
    We first present the simulation-based algorithm of Longstaff and Schwartz (2001).
    Next, we present a finite difference method, the explicit method, for American
    options. This method will be presented in its entirety in Chapter 10. We present
    the bivariate tree of Beliaeva and Nawalkha (2010), an adaptation of the trinomial
    tree in which the stock price and the volatility evolve along separate trees.
    We also cover the method of Medvedev and Scaillet (2010), which approximates the
    American option price using an analytic expansion and is thus able to produce
    option prices very quickly. Finally, we present the method of Chiarella and Ziogas
    (2006) for the valuation of American calls.


    # LEAST-SQUARES MONTE CARLO


    The Least-Squares Monte Carlo (LSM) algorithm was developed by Longstaff and Schwartz
    (2001) as a way to price American options using simulation. The algorithm can
    be applied to any stock price stochastic process and is especially useful for
    multi-dimensional processes for which high-dimension trees are difficult to construct.
    In this section, we implement the method for the Heston model


    Denote $C(\omega, s; t)$ the set of cash flows generated by the option along the
    stock price path $\omega$, conditional on the option not being exercised at time
    $t$, and on the holder following the optimal strategy at all times $s \leq T$.
    Longstaff and Schwartz (2001) assume that the American option can be exercised
    only at $K$ discrete times $0 < t_1 \leq \dots \leq t_K = T$, where $T$ is the
    time to maturity. At $t_s$, the value $F(\omega, t_s)$ of continuing to hold the
    option, as opposed to immediate exercise, is the discounted expectation of the
    remaining cash flows, under all stock price paths and risk-neutral measure, $Q$.
    Assuming a constant rate of interest $r$, the value of continuation, is,


    ```

    $F(\omega, t_k) = e^{-r(T-t_k)} \mathbb{E}^Q \left[ \sum_{j=k+1}^K C(\omega, t_j;
    t_k, T) | \mathcal{F}_k \right] \quad (8.1)

    ```


    The Heston Model and Its Extensions in Matlab and C#. Fabrice Douglas Roughah.

    © 2013 Fabrice Douglas Roughah. Published 2013 by John Wiley & Sons, Inc.


