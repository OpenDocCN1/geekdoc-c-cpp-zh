    The time-dependent parameters are stored in the matrix ParamTD, with the parameters
    obtained from the shortest maturity in the first row. To obtain the time-dependent
    prices for a given strike K, we loop through the maturities, and construct a matrix
    of previous parameter values (oldparam) and previous maturities (oldtau) at each
    step. The parameter estimates are appended at the bottom of the ParamTD matrix,
    so that the shortest maturity appears in the top row, and the time-dependent prices
    are stored in the matrix PriceTD, again with the top row corresponding to the
    shortest maturity. The prices with static parameters are in the matrix PriceTI.


    ```

    oldparam = [];

    oldtau = [];

    for t=1:NT

    PriceTI(t) = MNPriceGaussLaguerre(ParamTI,[],T(t),[],...);

    if t=1

    PriceTD(t) = MNPriceGaussLaguerre(ParamTD(t,:),tau(t),[],...);

    else

    oldparam = [oldparam,ParamTD(t-1)];

    oldtau = [oldtau,tau(t-1)];

    PriceTD(t) = MNPriceGaussLaguerre(ParamTD(t,:),oldparam,

    tau(t),...);

    ```


