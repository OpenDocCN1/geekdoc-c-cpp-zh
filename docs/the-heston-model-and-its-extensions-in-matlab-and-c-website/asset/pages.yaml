  md: "# Time-Dependent Heston Models\n\n```\nint2(k) = weight * real(exp(-i*phi*log(K))\
    \ * f2(k)/i/phi);\nint1(k) = weight * real(exp(-i*phi*log(K)) * f1(k)/i/phi);\n\
    end\nP1 = 1/2 + 1/pi*sum(int1);\nP2 = 1/2 + 1/pi*sum(int2);\n```\n\n# MIKHAILOV\
    \ AND NÖGEL MODEL\n\nThis model introduces dependency in the Heston model by allowing\
    \ the parameters in the model to be piecewise constant. The model makes use of\
    \ the general Riccati equation defined earlier in this chapter. We denote the\
    \ coefficients of the characteristic function by $\tilde{C}_i(\\phi, \tau_i; \\\
    Theta)$ and $\tilde{D}_i(\\phi, \tau_i; \\Theta)$ to emphasize their dependence\
    \ on $\\Theta = (\\kappa, \theta, \\sigma, \rho)$. Suppose we have N parameters\
    \ $0 < T_1 < T_2 < \\dots < T_N < \\infty$. Divide the time axis $[0, T_N]$ into\
    \ the maturity increments $\tau_1, \tau_2, \\dots, \tau_N$, where $\tau_k = T_k\
    \ - T_{k-1}$ for $k=2, \\dots, N$, and $\tau_1 = T_1$. The idea is to obtain expressions\
    \ for $\tilde{C}_i, \tilde{D}_i$. In first estimation, we obtain $\tilde{C}_1(\\\
    phi, \tau_1; \\Theta)$ and $\tilde{D}_1(\\phi, \tau_1; \\Theta)$ for the first\
    \ maturity $\tau_1$, using the initial conditions $C^0 = 0$ and $D^0 = 0$, as\
    \ in the ordinary Heston model. We then construct the characteristic functions\
    \ and Heston model option prices, and estimate $\\Theta$. This produces the first\
    \ set of estimates $\\Theta_1 = (\\kappa^{(1)}, \theta^{(1)}, \\sigma^{(1)}, \r\
    ho^{(1)})$ corresponding to the first maturity $\tau_1$. In the subsequent steps,\
    \ the estimation is modified by using $C^i \neq 0$ and $D^i \neq 0$. Further,\
    \ in the second estimation, substitute $\\Theta_1$ into the expressions for $\t\
    ilde{C}_i, \tilde{D}_i$ to produce the second set of initial conditions $C^1$\
    \ and $D^1$. Then construct $\tilde{C}_i(\\phi, \tau_i; \\Theta)$ and $\tilde{D}_i(\\\
    phi, \tau_i; \\Theta)$ for the second maturity $\tau_2$, construct the characteristic\
    \ functions and the Heston model option prices, and produce the parameter estimate\
    \ $\\Theta_2 = (\\kappa^{(2)}, \theta^{(2)}, \\sigma^{(2)}, \rho^{(2)})$. We continue\
    \ this recursive fashion until the last maturity, $\tau_N$. The following steps\
    \ summarize this recursive method.\n\n**Step 1.** $\tilde{C}_1(\\phi, \tau_1;\
    \ \\Theta) = (r - q)\\phi\tau_1 + \\frac{a}{\\sigma^2} \\left[ (b - \rho\\sigma\\\
    phi + d_1) \tau_1 - 2 \\ln \\left( \\frac{1 - g_1^{e^{d_1\tau_1}}}{1 - g_1} \r\
    ight) \right]$\n\n$\tilde{D}_1(\\phi, \tau_1; \\Theta) = \\frac{b - \rho\\sigma\\\
    phi + d_1}{\\sigma^2} \\left( \\frac{1 - e^{d_1\tau_1}}{1 - g_1^{e^{d_1\tau_1}}}\
    \ \right)$\n\nwhere $d$ is from Equation (9.3). Obtain the characteristic functions\
    \ $f_j, (j=1)$ at time $\tau_1$\n\n$f_j(\\phi; x, \\Theta) = \\exp(\tilde{C}_j(\\\
    phi, \tau_j; \\Theta) + \tilde{D}_j(\\phi, \tau_j; \\Theta)v_0 + i\\phi x)$\n\n\
    where $x = \\ln S_0$, the log spot price. Form the Heston option prices, and use\
    \ them or the Heston implied volatilities to obtain $\\Theta_1 = (\\kappa^{(1)},\
    \ \theta^{(1)}, \\sigma^{(1)})$"
