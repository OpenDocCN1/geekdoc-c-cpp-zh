  md: '# Numerical Integration Schemes 131


    the upper limit. How large a number depends on how fast the integrand, which typically
    oscillates, decays to zero. In general, the oscillation and the speed of decay
    vary immensely with maturity, so that short maturities oscillate substantially
    and require a large number for the upper limit. This is illustrated in Figure
    5.2 for typical values of Heston parameters and option settings.


    In general, it is not to use ad-hoc choices for the upper integration limit, but
    rather, a choice that takes into consideration the speed of decay of the integrand,
    as illustrated in Figure 5.2. For example, in his Mathematica, Lewis (2000) uses
    $w_{max}=[1000, 10/\sqrt{T}].


    We can also use the multi-domain integration approach described by Zhu (2010)
    in this method, the domain of integration is separated into subdomains $[a_0,
    a_1], [a_1, a_2], [a_2, a_3]$ and so on, where $a_0 = 0$ and $a_0 < a_1 < a_2
    < \dots$. The integral for the probability $\hat{P}$ is constructed by aggregating
    the integrals over each subdomain,


    ```

    $$\sum_{k=0}^{a_{k+1}} Re \left[ \frac{e^{-i\phi} \ln f_{l}(\phi; x, v)}{i\phi}
    \right] d\phi$.

    ```


    The summation stops when the subdomains integrals cease to contribute to the sum.
    In other words, when we


    ```

    $$\int_{a_M}^{a_{M+1}} Re \left[ \frac{e^{-i\phi} \ln K_{l}(\phi; x, v)}{i\phi}
    \right] d\phi < \varepsilon \quad \ (5.13)$

    ```


