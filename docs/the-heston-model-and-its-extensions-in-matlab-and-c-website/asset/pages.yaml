- pgno: 105
  md: "# The Fundamental Transform for Pricing Options\n\nwhere $c(k) = \\frac{1}{2}(k^2\
    \ - ik)$. Equation (4.9) is Equation (2.2.7) of Lewis (2000), for the Heston model.\
    \ Lewis explains that only the special case of a payoff of 1, namely $\\hat{H}(k,v,0)=1$,\
    \ is needed. All other payoffs can be handled by multiplying $\\hat{H}(k,v,0)$\
    \ by the appropriate payoff transform. A solution $H(k,v,\tau)$ to the PDE in\
    \ Equation (4.9) that satisfies the initial condition $\\hat{H}(k,v,0)=1$ is called\
    \ a fundamental transform. The fundamental transform is called regular if it is\
    \ regular in $k$ within the strip $\\alpha < k < \beta$, where $k_i = Im[k]$,\
    \ the imaginary part of $k$. Once the fundamental transform has been found by\
    \ solving Equation (4.9), Lewis (2000) recipe to calculate option prices is straightforward.\
    \ All that is required is that the payoff transform be known, such as for the\
    \ European call in (4.2). The example is as follows:\n\n+   - Multiply the fundamental\
    \ transform $\\hat{H}(k,v,\tau)$ by the payoff transform $\\hat{f}(k,T)$. The\
    \ payoff transform depends on the order consideration, but the fundamental transform\
    \ does not.\n- Multiply the result by the term $\\exp(-r(T-\tau)-q\tau)$.\n- Pass\
    \ the expression through the inversion formula in Equation (4.3) and evaluate\
    \ the integral, taking care to respect the strip of regularity.\n\nRecall that\
    \ in the Carr and Madan (1999) approach, which was covered in Chapter 3, the Fourier\
    \ transform of the derivative is required. For each type of option for which we\
    \ need a price. To further aggravate matters, Fourier transforms of prices can\
    \ be complicated. The advantage of the Lewis (2000) recipe is that once the fundamental\
    \ transform is obtained. Since the fundamental transform is model dependent, but\
    \ not payoff dependent, the same fundamental transform can be applied to value\
    \ many different European options; all that is required is that payoff transforms\
    \ be available analytically. Moreover, since payoffs are specified in options\
    \ contracts and therefore known explicitly, their Fourier transforms are much\
    \ easier to obtain than the Fourier transforms of the option prices themselves.\n\
    \nIn the next sections, we illustrate the Lewis recipe for a European call. First,\
    \ we present the fundamental transform for the Heston model.\n\n# THE FUNDAMENTAL\
    \ TRANSFORM FOR THE HSTON MODEL\n\nFrom Equation (4.9), the PDE for $\\hat{H}(k,v,\t\
    au)$ using $\\lambda = 0$ is\n\n```\n$\\frac{\\partial\\hat{H}}{\\partial\tau}\
    \ = \\frac{1}{2}\\sigma^2 v \\frac{\\partial^2\\hat{H}}{\\partial v^2} + [k(\t\
    heta-v) - ik\rho\\sigma v]\\frac{\\partial\\hat{H}}{\\partial v} - c(k)v\\hat{H}(k,v,\t\
    au). \\quad (4.10)$\n```\n\nThis PDE must be converted into a form similar to\
    \ the Ricci equation for which the solution is known. Following Chapter 11 of\
    \ Lewis (2000), define $t=\\sigma^2\tau/2$ so that\n\n```\n$\\frac{\\partial\\\
    hat{H}}{\\partial\tau} = \\frac{2}{\\sigma^2} \\frac{\\partial\\hat{H}}{\\partial\
    \ t}$\n```"
