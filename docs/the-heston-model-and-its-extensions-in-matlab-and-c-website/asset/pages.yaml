- pgno: 270
  md: '# Time-Dependent Heston Models


    # Abstract


    The Heston model is sometimes unable to provide a good fit to short-maturity market
    implied volatilities. One common remedy to this problem is to enrich the model
    with additional parameters by specifying a more realistic volatility process,
    which is the approach of the double Heston model covered in Chapter 12. Another
    approach is to allow the parameters to be time-dependent. This latter approach
    is the one adopted by Mikhailov and Nogel (2003), Elices (2009), Benhamous, Gobet,
    and Miri (2010) and others. In this chapter, we present these time-dependent models.
    First, we introduce a generalization of the Riccati equation from Chapter 1 that
    allows for non-zero initial conditions. Then we show that the generalization of
    the bivariate Riccati equation arises as a special case. We then present the models
    with time-dependent parameters and show how to estimate these parameters using
    loss functions


    # GENERALIZATION OF THE RICCATI EQUATION


    Recall from Chapter 1 that the general solution to the Riccati equation for $D(\phi,
    \tau)$ is


    ```

    $D(\phi, \tau) = \frac{2}{\sigma^2}\frac{K_ie^{\phi_i\tau} + \beta_ie^{\tau}}{K_i
    + e^{\phi_i\tau}}$$

    ```


    Recall also that the initial condition $D_i(\phi,0)=0$ is at expiry $\tau=0$ produced
    $K_i=-\beta_i/\alpha_i$, and the solution for $D_j$ given by


    ```

    $D_j(\phi, \tau) = \frac{1}{\sigma^2}\frac{b_j - \rho_j\phi + d_j}{1 - e^{\\phi_j\tau}}$

    ```


    This expression uses the quantities


    ```

    $d_i = \sqrt{(\rho_i\phi - b_i)^2 - \sigma^2(2u_i\phi - \phi^2)}, \quad g_i =
    \frac{b_i - \rho_i\phi + d_i}{b_i - \rho_i\phi - d_i} = \frac{\beta_i}{\alpha_i}$

    ```


    with $u_1 = \frac{1}{2}, u_2 = -\frac{1}{2}, a = \kappa\theta, b_1 = \kappa +
    \lambda - \rho\theta,$ and $b_2 = \kappa + \lambda$.'
