    +   Step 2. $Y_k = [I - \theta dtA_k]^{-1}[Y_{k-1} - \theta dtA_k U_{r-1}]$ for\
    \ $k = 1, 2$.\n\n+   Step 3. $\\hat{Y}_0 = Y_0 + \\frac{1}{2}dt[A_0Y_2 - A_0U_{r-1}]$.\n\
    \n+   Step 4. $\\hat{Y}_k = [I - \theta dtA_k]^{-1}[\\hat{Y}_{k-1} - \theta dtA_k\
    \ U_{r-1}]$.\n\n+   Step 5. Set $U_t = Y_2$.\n\nModified Craig-Sneyd Scheme\n\n\
    +   Step 1. $Y_0 = [I + dtL]U_{r-1}$.\n\n+   Step 2. $Y_k = [I - \theta dtA_k]^{-1}[Y_{k-1}\
