  md: "# 40 HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe earlier code invokes\
    \ the Matlab function BsecBSIV.m that uses the bisection algorithm to find implied\
    \ volatilities once the prices are generated. The first part of the function defines\
    \ a function handle for calculating the price of calls under the Black-Scholes\
    \ model. The main part of function calculates the Black-Scholes call at the midpoint\
    \ of the two endpoints, and the difference between this call price and the market\
    \ price. If the difference is greater than the user-specified tolerance, the function\
    \ updates one of the endpoints and passes through the iteration. It can create\
    \ space, parts of the function have been omitted.\n\n```\nfunction y = BsecBSIVMktPrice,Tol,Maxiter...\n\
    \  % Black Scholes call\n  BSC = (S,K,rf,q,T) *normcdf((log(S/K) + ...n  lowDiff\
    \ = MktPrice - BSC(S,K,rf,q,T)\n  highDiff = MktPrice - BSC(S,K,rf,b,T)\n  if\
    \ lowDiff+highDiff > 0 y = -1;\n    for x=1:Maxiter\n      midP = (a+b)/2;\n \
    \     midDiff = MktPrice - BSC(S,K,rf,q,midP,T)\n      if abs(midDiff)<Tol\n \
    \       break;\n        if midDiff>0 a = midP;\n        else b = midP;\n     \
    \ end\n    end\n  end\n  y = midP;\n```\n\nThe bisection algorithm in C# is very\
    \ similar and is coded in the function Bsec-SIV(). The difference is that we must\
    \ create a separate C# function, NormCDF(), to calculate the standard normal distribution\
    \ function.\n\n```\nstatic double BsecBSIV(string PutCall,...)\\ {\n  double lowDiff\
    \ = MktPrice - BlackScholes(a,...);\n  double highDiff = MktPrice - BlackScholes(b,...);\n\
    \  double BSIV = 0.0;\n  double midP;\n  if (lowDiff+highDiff > 0.0)\n    BSIV\
    \ = -1.0;\n  } else {\n    for (int x=0; x<=MaxIter; x++) {\n      midP = (a+b)/2.0;\n\
    \      double midDiff = MktPrice - BlackScholes(midP,...);\n      if (Math.Abs(midDiff)\
    \ < Tol) {\n        break;\n        if (midDiff > 0.0) a = midP;\n        else\
    \ b = midP;\n      }\n    BSIV = midP;\n  }\n  return BSIV;\n}\n```"
