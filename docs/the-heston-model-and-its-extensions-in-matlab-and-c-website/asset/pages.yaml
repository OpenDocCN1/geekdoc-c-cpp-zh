  md: "# Payoff vectors\n\n```\n% Payoff vectors\nif strcmp(PutCall,'C')\n    Payoff\
    \ = max(S - K,0);\nelseif strcmp(PutCall,'p')\n    Payoff = max(K - S,0);\nend\n\
    SimPrice = exp(-r*T)*mean(Payoff);\n```\n\nThe C code to option price schemes\
    \ is very similar to the Euler, Milstein, implicit Milstein and weighted Milstein\
    \ schemes stated above. In C#, however, we need to create functions to generate\
    \ random draws from the standard normal density. We use the RandomNum() and RandomInt()\
    \ functions that were presented in the Differential Algorithm of Chapter 6 to\
    \ generate uniform random numbers and random integers. We use the Box-Muller transformation\
    \ to convert uniform random numbers into random draws from the standard normal\
    \ density. This involves using the RandomNum() function to generate two random\
    \ numbers $u_1$ and $u_2$ uniformly distributed on $[0,1]$, and then defining\n\
    \n$z = \\sqrt{-2\\ln u_1} \\times \\sin(2\\pi u_2);$ (7.28)\n\n```\npublic static\
    \ double RandomNorm()(\n    double U1 = RandomNum(0.0,1.0);\n    double U2 = RandomNum(0.0,1.0);\n\
    \    return Math.Sqrt(-2.0*Math.Log(U1)) * Math.Sin(2.0*Math.PI*U2);\n```\n\n\
    To illustrate, the price of a 3-month European call struck at a dividend-paying\
    \ stock with spot $S=100$ and yield $q=0.02$ is $11.2087$ when $r=0.03, k=6.2,\
    \ \\theta=0.06, \\sigma=0.5, \\rho=-0.7$, and $v_t=0.03$. We use 5000 stock paths\
    \ and 100 time steps for each path, and apply the reflection scheme. The price\
    \ of the call with the Euler scheme is $11.3855$ (an error of 1.6 percent) and\
    \ requires negative variances to be overridden. The Milstein scheme produces a\
    \ price of $11.1413$ (an error of -0.6 percent), the implicit Milstein scheme\
    \ a price of $11.0692$ (an error of -1.2 percent), and the weighted implicit-explicit\
    \ Milstein scheme a price of $11.1566$ (an error of -0.5 percent). None of the\
    \ three Milstein schemes generated negative variances.\n\n# TRANSFORMED VOLATILITY\
    \ SCHEME\n\nOne simple way to avoid negative variances is to simulate the volatility\
    \ rather than the variance, and then square the result. By Ito’s lemma, the volatility\
    \ $\\omega_t = \\sqrt{V_t}$ follows this process\n\n$d\\omega_t = \\frac{\\kappa}{2}\\\
    left[ (\\theta - \\frac{\\sigma^2}{4\\kappa})\\omega_t \\right] dt + \\frac{1}{2}\\\
    sigma dW_{1,t};;$ (7.29)"
