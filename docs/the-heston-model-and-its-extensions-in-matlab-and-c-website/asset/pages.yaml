    \ sets $\\Theta_1, \\Theta_2, \\dots, \\Theta_N$\n\n```\n$f(\\phi_1, X_0) = \\\
    exp\\left(\\sum_{k=0}^{N-1} A(\\tau_{N-k}, \\phi_1, \\phi_{N-k}^2; \\Theta_{N-k})\\\
    right)\\times \\exp(i\\phi_1X_0 + C(\\tau_1, \\phi_1, \\phi_1^2; \\Theta_1)v_0).\
    \ \\quad (9.45)\n```\n\nThe coefficients $A(\\tau_k, \\phi_1, \\phi_k^2; \\Theta_k)$\
    \ and $C(\\tau_k, \\phi_1, \\phi_k^2; \\Theta_k)$ are implemented with the Matlab\
    \ functions A.m and C. respect.\n\n```\nfunction y = A(phil1,phi2,param,tau,q,trap)\n\
    if trap=1\n    % Little Trap formulation\n    G = (c*(exp(-d*tau)-1)/(c-1));\n\
    \    AA = (r-q)*i*phil*tau + a/sigma^2 ...;\nelsif trap=0\n    % Original Heston\
    \ formulation.\n    G = (1-g*exp(d*tau))/(1-g);\n    AA = (r - rho*sigma*i*phil\
    \ + a/sigma^2 ...);\nend\nny = AA;\n```\n\n```\nfunction y = C(phil1,phi2,param,tau,S,trap)\n\
    if trap=1\n    % Little Trap formulation\n    G = (c*(exp(-d*tau)-1)/(c-1));\n\
    \    CC = (b - rho*sigma*i*phil + d) ...;\nelsif trap=0\n    % Original Heston\
    \ formulation.\n    G = (1-g*exp(d*tau))/(1-g);\n    CC = (b - rho*sigma*i*phil\
    \ + d) ...;\nend\ny = CC;\n```"
