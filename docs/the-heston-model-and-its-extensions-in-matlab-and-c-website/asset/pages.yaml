  md: "# CONCLUSION\n\nIn this chapter, we have shown that the univariate characteristic\
    \ function for $x_\tau$ and the bivariate characteristic function for $(x_\tau,\
    \ v_\tau)$ are identical in form except for the coefficients in each function.\
    \ What differentiates the coefficients is solely the initial condition for the\
    \ Riccati equation which is solved to them. We have also shown that the univariate\
    \ characteristic function is a special of the bivariate characteristic function\
    \ that arises by setting the argument for $v_\tau$ to zero. Next, we have presented\
    \ the time-dependent models of Mikhailov and Elices (2009). Both of these models\
    \ rely on a recursive relation on the bivariate characteristic function illustrated\
    \ by Sahbi and Lord (2010). Finally, we have presented the model of Bahadorzadeh\
    \ et al. (2010) which relies on an analytic expansion to obtain option prices\
    \ under time-dependent parameters. As such, it produces option prices much faster\
    \ than either of the other two time-dependent models covered in this chapter.\
    \ All the models with time-dependent parameters that we have examined, however,\
    \ provide a better fit to quoted volatilities than the models with constant parameters\
    \ covered up to now.\n\nIn Chapter 8, we introduced the explicit method and we\
