    \ exercise boundary. Essentially, this means as long as the stock price is below\
    \ the early exercise boundary, the American call option behaves like its European\
    \ counterpart and the PDE in Equation (8.71).\n\nBuilding on the work of Tzazalis\
    \ and Wang (2003), Chiarella and Ziogas (2006) approximate the early exercise\
    \ boundary $b(v,\tau)$ with the log-linear function\n\n```\n$b(v,\tau) \\approx\
    \ \\exp(b_0(\tau) + b_1(\tau)v_0).$\n```\n\nIn the following section we explain\
    \ how $b(v,\tau)$ is estimated, and how the American call price is obtained.\n\
    \n# The American Call Price\n\nTo implement the method of Chiarella and Ziogas\
    \ (2006), we need to introduce an additional variable $t$ into the characteristic\
    \ function, by replacing $\tau$ with $\tau-t$, and an additional integration variable\
    \ $\\psi$. We write the characteristic function $f_2$ as\n\n```\n$f_2(\\psi, x_0,\
    \ v_0, \\tau-t) = \\exp(C_2(\\tau-t, t, \\psi) + D_2(\\tau-t, t, \\psi) + i\\\
    psi x_0) \\quad (8.73)$\n```\n\nwhere the coefficients are\n\n```\n$C_2(\\tau-t,\
    \ tpsi, \\psi) = (r-q)i\\psi + \\frac{a}{\\sigma^2} \\left[ \\frac{b_2 - \\rho\\\
    sigma i\\psi + d_2}{\\sigma^2}(\\tau-t) - 2 \\ln \\left( \\frac{1-e^{d_2(\\tau-t)}}{1-g_2}\
    \ \\right) \\right], \\quad (8.74)$\n```\n\n```\n$D_2(\\tau-t, t, \\psi) = i\\\
    psi + \\frac{b_2 - \\rho\\sigma i\\psi + d_2}{\\sigma^2} \\left( \\frac{1-e^{d_2(\\\
    tau-t)}}{1-g_2 e^{d_2(\\tau-t)}} \\right).\n```\n\nThe required quantities are\n\
    \n```\n$g_2 = \\frac{b_2 - \\rho\\sigma i\\psi + d_2}{b_2 - \\rho\\sigma i\\psi\
