  md: "# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_195_0.png)\n\
    \nFIGURE **7.2** Stock Price and Variance under Positive Correlation\n\n$\\mu_{t+dt}\
    \ = \\mu(X_{t+dt})$. See Kloeden and Platen (1992) for details. It is also possible\
    \ to interpolate between explicit and implicit Milstein schemes by taking a weighted\
    \ average of $\\mu_i$ and $\\mu_{t+dt}$, and the implicit-explicit Milstein scheme\
    \ is therefore\n\n```\n$X_{t+dt} = X_t + [\\alpha\\mu_t + (1 - \\alpha)\\mu_{t+dt}]dt\
    \ + \\sigma_t\\sqrt{dt}dZ + \\frac{1}{2}\\sigma_t\\sigma_t(dt^2 - 1)$ (7.25)\n\
    ```\n\nwhere $\\alpha \\in (0,1)$ is the weight. The explicit Milstein scheme\
    \ corresponds to $\\alpha = 1$, and the implicit Milstein scheme to $\\alpha =\
    \ 0$.\n\nTo apply the implicit Milstein scheme to the Heston model, in Equation\
    \ (7.20) we replace the term $\\kappa(\theta-\nu_t)dt$ with $\\kappa(\nu_{t+dt})dt$.\
    \ We bring $\\kappa\nu_{t+dt}dt$ over to the left-hand side of the solving equation,\
    \ and divide by $1+\\kappa dt$ to obtain\n\n```\n$$\\nu_{t+dt} = \\frac{\nu_t\
    \ + \\kappa\theta dt + \\sigma_t\\sqrt{dt}dZ_v + \\frac{1}{2}\\sigma_t^2(dZ_v^2\
    \ - dt)}{1 + \\kappa dt}$ $$ (7.26)\n```\n\nIf we apply the same steps to the\
    \ weighted scheme in Equation (7.25) we obtain\n\n```\n$$\\nu_{t+dt} = \\frac{\\\
    nu_t + \\kappa(\theta-\\alpha\nu_t)dt + \\sigma_t\\sqrt{dt}dZ_v + \\frac{1}{2}\\\
    sigma_t^2(dZ_v^2 - dt)}{1 + (1-\\alpha)\\kappa dt}$ $$ (7.27)\n```\n\nThe Matlab\
    \ function EulerMilsteinSim.m applies Euler (7.8), Milstein (7.20), implicit Milstein\
    \ (7.26), or weighted Milstein (7.27) discretization of the variance,"
