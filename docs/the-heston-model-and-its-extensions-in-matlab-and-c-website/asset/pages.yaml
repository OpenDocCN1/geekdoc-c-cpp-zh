  md: "# Numerical Integration Schemes\n\n# Summary of the FFT\n\nRecall that the\
    \ Carr and Madan (1999) price of the call at the log strike $k = \\ln K$ is\n\n\
    ```\n$C(k) = \\frac{e^{-ak}}{\\pi} \\int_{0}^{\\infty} Re[e^{-ivk}\\psi(v)]dv$.\n\
    ```\n\nTo implement the FFT on the call price, first create the integration grid\
    \ $\\{v_j\\}_{j=1}^{N}$ and the log-strike grid $\\{k_j\\}_{j=1}^{N}$. Define\
    \ the points $x_j$, for $j=1,\\dots,N$ as\n\n```\n$x_j = e^{(b-\\ln S_0)+iv_j}\\\
    psi(v_j), \\quad (5.26)\n```\n\nwith $b = N\\lambda/2$. In $(5.29)$, $\\psi$ is\
    \ the function evaluated at the grid point $v_j$\n\n```\n$\\psi(v) = \\frac{e^{-f_j(v)-(\\\
    alpha+1)}}{\\alpha^2-v^2+iv(2\\alpha+1)}$\n```\n\nwhere $f_j(v)$ is the Heston\
    \ characteristic function evaluated at $v_j-(\\alpha+1)$. Define $\\hat{x}_j =\
    \ C(k_j)$, the call price evaluated at the log-strike point $k_j$. Each call price\
    \ can be obtained from the set $\\{\\hat{x}_j\\}_{j=1}^N$ via the Fourier transform\
    \ as the sum\n\n```\n$$\\hat{x}_u = \\frac{e^{-ak_u}}{\\pi} \\sum_{j=1}^{N} Re[e^{-\\\
    frac{i}{2}(j-1)(u-1)}x_j] \\quad$ for $u=1,\\dots,N. \\quad (5.27)\n```\n\nCall\
    \ prices are obtained from (5.27). Directly, $C(k_u) = \\hat{x}_u$ is the price\
    \ of the call at strike $(k_u)$.\n\nThe fast Fourier transform for the Heston\
    \ call is implemented using the Matlab function HestonCallFFT.m. The function\
    \ calls the Heston characteristic function $f_j(\\phi;x,v)$. The function implements\
    \ FFT in two ways: a fast version which makes use of variance and a slow version\
    \ which uses loops. To conserve space, the main part of the function\n\n```\n\
    function [CallFFT k lambdaitca] = HestonCallFFT(...);\nif fast==true\n  % Implement\
    \ the FFT - fast algorithm\n  U = [0:N-1];\n  J = [0:N-1];\n  psi = HestonCF(v-(alpha+1).*i,...,Trap);\n\
    \  phi = exp(-r*tau).*psi ./ (alpha^2 + v.*2 + ...);\n  x = exp(i*(b-s0).*v).*phi.*w;\n\
    \  e = exp(-i*2*pi/N.(U*j)).*x;\n  CallFFT = eta.*exp(-alpha.*k)./pi .*real(e);\n\
    else fast==0\n  % Implement the FFT - slow algorithm\n  for u=1:N\n    psi(j)\
    \ = HestonCF(v(j)-(alpha+1)*i,...,Trap);\n    phi(j) = exp(-r*tau).*psi(j)/(alpha^2\
    \ + alpha - ...);\n```"
