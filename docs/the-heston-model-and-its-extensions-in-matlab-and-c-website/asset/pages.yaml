- pgno: 341
  md: "# The Heston Greeks\n\nThe derivatives in (11.26) were evaluated symbolically\
    \ using the Matlab file SymbolicDerivatives.m and into the HestonGreeksProb.m\
    \ function described above.\n\nTo calculate the Greeks, the HestonGreeksProb.m\
    \ function is passed to the HestonGreeks.m function, which performs the required\
    \ integration using Gauss-Laguerre integration, and returns the desired Greek.\
    \ To conserve space, parts of the function have been removed.\n\n```\nfunction\
    \ y = HestonGreeks(PutCall,...,Greek)\nif strcmp(Greek, 'Delta')\n  for k=1:length(x)\n\
    \    int1(k) = w(k)*HestonGreeksProb(x(k),...,1,'Delta');\n  end\n  P1 = 1/2 +\
    \ 1/pi*sum(int1)\n  y = exp(-Q)*P1\nelif strcmp(Greek, 'Volga')\n  for k=1:length(x)\n\
    \    int1(k) = w(k)*HestonGreeksProb(x(k),...,1,'Volga')\n    int2(k) = w(k)*HestonGreeksProb(x(k),...,2,'Volga')\n\
    \  end\n  dp1 = 1/pi*sum(int1)\n  dp2 = 2/pi*sum(int2)\n  V = S*exp(-Q)*T*dp1\
    \ - K*exp(-r*T)*dp2\n  for k=1:length(x)\n    int1(k) = w(k)*HestonGreeksProb(x(k),...,1,'Volga')\n\
    \    int2(k) = w(k)*HestonGreeksProb(x(k),...,2,'Volga')\n  end\n  dp1 = 1/pi*sum(int1)\n\
    \  dp2 = 2/pi*sum(int2)\n  dc2 = S*exp(-Q)*T*dp1 - K*exp(-r*T)*dp2\n  y = 4*sqrt(v0)*(dc2+2*sqrt(v0)+Volga/4)\n\
    elif strcmp(Greek, 'Corr')...\n  for k=1:length(x)\n    int1(k) = w(k)*HestonGreeksProb(x(k),...,1,'Greek')\n\
    \    int2(k) = w(k)*HestonGreeksProb(x(k),...,2,'Greek')\n  end\n  dp1 = 1/pi*sum(int1)\n\
    \  dp2 = 2/pi*sum(int2)\n  y = S*exp(-Q)*T*dp1 - K*exp(-r*T)*dp2\n```\n\nThe code\
    \ for Heston Greeks is similar but not presented here. The only difference is\
    \ that in $C$, we do not calculate the sensitivity with respect to $\rho$, $\\\
    kappa$, and $\\sigma$ in closed form, but using finite differences.\n\nTo illustrate\
    \ the calculation of the Greeks, recall from Chapter 1 when we set $\\sigma=0$\
    \ and $\theta=v_0$ in the Heston model, we retrieve the Black-Scholes model exactly.\
    \ We also say in that chapter we cannot simply set $\\sigma=v_0$ in the characteristic\
    \ function, since that will entail division by zero. We, however, set $\\sigma$\
    \ to be small, and $\theta=v_0$. We will then obtain Heston prices that are close\
    \ to Black-Scholes prices, Greeks, which are all available in closed form, in\
    \ Haug (2006), for example."
