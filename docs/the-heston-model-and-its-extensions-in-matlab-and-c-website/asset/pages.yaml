- pgno: 117
  md: '# The Fundamental Transform for Pricing Options


    The following Matlab code implements the call price in Equation (4.33). The Matlab
    function LewisIntegrand311.m calculates $\varphi(u)$ using $f_2(u)$, in accordance
    with (4.34). The only part of this function is presented later. Since we are using
    $i/2$ for this function, in the last part, we need to remove $i/2$ from $u$ in
    order to calculate $e^{iuW}$ and $u^2$ properly in the last line of the function.


    ```

    function y = LewisIntegrand311(u,...)

    % Heston characteristic function for ln S(T)

    ClnInst = exp(C + D*v + i*u*x);

    % The cf for XT

    Y = log(S) + (r-q)*tau;

    CFXT = exp(i*u*Y)*ClnInst;

    % The integrand

    u = u + i/2;

    W = Y - log(K);

    y = exp(i*u*W)*CFXT/(u^2 + 1/4);

    ```


    The function LewisPrice311.m calculates the call price using the integration weights
    $w$ x passed to the function. It is similar to the HestonLewisCallPrice.m presented
    earlier in this chapter, except that it passes the integration points $u_i = x_i
    - i/2$ to the integrator.


    ```

    function y = LewisPrice311(...)

    lambda = 0;

    Y = log(S) + (r-q)*T;

    W = Y - log(K);

    % Compute the integral.

    for j=1:length(x)

    u = x(j) - (1/2)*i;

    int(j) = w(j)*LewisIntegrand311(u,...);

    end

    Integral = sum(int);

    % Equation (3.11) in Lewis (2001)

    y = S*exp(-q*T) - (1/pi)*sqrt(K*S)*exp-(r+q)*T/2)*Integral;

    ```


    The C# code to implement the call price in Equation (4.33) is similar and not
    presented here.


    To illustrate, we use the same settings as those to generate Table 4.1 to generate
    call prices using (4.33) for strikes ranging from K=95 to K= 105. We use 32-point
    Gauss Laguerre integration to obtain the call prices using the original Heston
    (1993) formulation and Equation (3.11) of Lewis (2001). The results in Table 4.2
    indicate high agreement between both sets of prices.'
