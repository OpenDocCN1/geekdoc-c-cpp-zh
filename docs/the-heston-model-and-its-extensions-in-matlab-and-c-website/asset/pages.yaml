  md: '# Time-Dependent Heston Models


    The coefficients in Equation (9.48) are obtained using the integral operators
    defined by Benhamou et al. (2010). The coefficients are defined in their Equation
    (2.13)


    ```

    $a_{1,T} = \int_0^T e^{t} \rho_{\sigma}v_{0,j} \left(\int_0^t e^{-u} du\right)
    dt, \quad (9.51)$

    ```


    ```

    $a_{2,T} = \int_0^T e^{t} \rho_{\sigma}v_{0,j} \left(\int_0^t \rho_{\sigma} \left(e^{-u}
    du\right)\right) ds, \quad (9.52)$

    ```


    ```

    $b_{0,T} = \int_0^T e^{2t}\sigma_s^2v_{0,j} \left(\int_0^t e^{-k_s} \left(e^{-u}
    du\right)\right) ds, \quad (9.53)$

    ```


    ```

    $b_{2,T} = \frac{a_{1,T}^2}{2}. \quad (9.54)$

    ```


    Note that all parameters $\theta$, $\sigma$, and $\rho$ are allowed to vary; $\kappa$
    is assumed constant, and $v_0$ is an unobserved state variable.


    # Constant Parameters


    If the parameters are assumed constant, then $\theta=\theta$, $\sigma=\sigma$,
    and $\rho=\rho$. Moving these parameters outside the integrals and evaluating
    the integrals in (9.51) through (9.53) produces the following expressions, which
    are appearing in Proposition 2.4 of Benhamou et al. (2010)


    ```

    $a_{1,T} = \frac{\rho\sigma e^{-\kappa T}}{\kappa^2} [V_0 (\kappa T + e^{\kappa
    T} - 1) + (\kappa T + e^{\kappa T})(\kappa T - 2)]\na_{2,T} = \frac{\rho^2\sigma
    e^{-\kappa T}}{\kappa^3} V_0 (-4\kappa T e^{\kappa T} + 2e^{\kappa T} - 2)\nb_{0,T}
    = \frac{\sigma^2 e^{-\kappa T}}{4\kappa^3} [V_0 (-4\kappa T e^{\kappa T} + 2e^{\kappa
    T} - 2) + \theta (2e^{\kappa T}(\kappa T - 3) + \kappa T (\kappa T + 4))]\nb_{2,T}
    = \frac{a_{1,T}^2}{2}. \quad (9.55)$

    ```


    Note that under constant parameters we have


    ```

    $v_{0,T} = \theta + (\theta - v_0)e^{-\kappa T}, \quad \hat{w}_T = (v_0 - \theta)
    \frac{1 - e^{-\kappa T}}{\kappa} + \theta T. \quad (9.56)$

    ```


    so that $\hat{w}_T$ reduces to the form we encounter in Chapter 2. To obtain the
    put price, substitute the coefficients from Equation (9.55) into (9.48), using
    the Black-Scholes derivatives presented at the end of this chapter. The call price
    is obtained by put-call parity.


    As noted by Benhamou et al. (2010), the price expansion under constant parameters
    is identical to the volatility of variance expansion of Lewis (2000) covered in
    Chapter 4. Indeed, it is straightforward to verify that'
