- pgno: 15
  md: '# The Heston Model for European Options


    The risk-neutral process for the variance is addressed by introducing a function
    $\lambda(S, v_t, t)$ into the drift of $v_t$, in Equation (1.1), as follows


    ```

    $dv_t = [\kappa(\theta - v_t) - \lambda(S, v_t, t)]dt + \sigma\sqrt{v_t}d\widetilde{W}_{2,t}$

    ```


    where


    ```

    $\widetilde{W}_{2,t} = \left(W_{2,t} + \frac{\lambda(S, v_t, t)}{\sigma\sqrt{v_t}}t\right)$

    ```


    The function $\lambda(S,v,t)$ is called the volatility risk premium. As explained
    in Heston (1993), Breeden''s (1979) consumption model yields a premium proportional
    to the variance, so that $\lambda(S,v_t) = \lambda v_t$, where $\lambda$ is a
    constant. Substituting for $\lambda v_t$ in Equation (1.6), the risk-neutral version
    of the variance process


    ```

    $dv_t = \kappa^*(\theta^* - v_t) + \sigma\sqrt{v_t}d\widetilde{W}_{2,t}$

    ```


    where $\kappa^* = \kappa + \lambda$ and $\theta^* = \kappa\theta/(\kappa + \lambda)$
    are the risk-neutral parameters of the variance process.


    To summarize, the risk-neutral process is


    ```

    $dS_t = rS_dt + \sigma\sqrt{S_t}d\widetilde{W}_{1,t}\ndv_t = \kappa^*(\theta^*
    - v_t) + \sigma\sqrt{v_t}d\widetilde{W}_{2,t}$

    ```


    Where $\mathbb{E}[d\widetilde{W}_{1,t}d\widetilde{W}_{2,t}] = \rho dt$ is the
    risk-neutral measure.

    Note, when $\lambda=0$, we have $\kappa^* = \kappa$ and $\theta^* = \theta$ as
    these parameters under the physical and risk-neutral measures are equal. Throughout
    this book, we will set $\lambda=0$, but this is not always needed. Indeed, $\lambda$
    is embedded in the risk-neutral parameters $\kappa^*$ and $\theta^*$. Hence, we
    estimate the risk-neutral parameters to price options is subject of its research,
    such as by Bollers et al. (2011). For notation simplicity, throughout this book
    we will drop the asterisk on the parameters and the tilde on the Brownian motion
    when it is obvious that we are dealing with the risk-neutral measure.


    # Properties of the Variance Process


    The properties of $v_t$ are described by Cox, Ingersoll, and Ross (1985) and Brigo
    and Mercurio (2006), among others. It is well-known that conditional on a realized
    value of $v_s$, the process $v_t$ follows a non-chi-square distribution with $d=4\kappa\theta/\sigma^2$
    degrees of freedom and non-centrality parameter $2c_s,v_se^{-\kappa(t-s)}$, where


    ```

    $c_t = \frac{2\kappa}{1 - e^{-\kappa(t-s)}}$

    ```


    and with $t > s$. The mean and variance of $v_t$, conditional on the value $v_s$,
    are respectively


    ```

    $m = E[v_t|v_s] = \theta + (v_s - \theta)e^{-\kappa(t-s)},

    S^2 = Var[v_t|v_s] = \frac{\sigma^2 e^{-\kappa(t-s)}}{\kappa}(1 - e^{-\kappa(t-s)})
    + \frac{\theta\sigma^2}{2\kappa}(1 - e^{-2\kappa(t-s)})^2$.

    ```'
  merge: -1
