    \  end\n    for s=1:NS\n        U(s,v) = max(0, S(s) - K);\n    end\nU = U;\n\
    for s=2:NS-1\n    derV = (u(s,2) - u(s,1)) / (V(2)-V(1));\n    derS = (u(s+1,s)\
    \ - u(s-1,s-1)) / (S(s+1)-S(s-1));\n    LHS = r*u(s,1) + (r-q)*S(s)*derS + kappa*theta*derV;\n\
    U(s,1) = LHS*dt + u(s,1);\nend\nU = U;\nfor v=2:NV-1\n    derS = (u(s+1,v) - u(s-1,v))\
    \ / (S(s+1)-S(s-1));\n    derV = (u(s,v+1) - u(s,v-1)) / (V(v+1)-V(v-1));\n  \
    \  derSS = (u(s+1,v) - u(s,v)) / (S(s+1)-S(s));\n    derVV = (u(s,v+1) - u(s,v-1))\
    \ / (V(v+1)-V(v-1));\n    derSV = (u(s+1,v) - u(s-1,v-1)) - U(s+1,v-1);\n    U(s,v)\
    \ = 0.5*V(v)*S(s)*2*derSS + rho*sigma*V(v)*S(s) - ...;\nend\n```\n\nWe can use\
    \ the non-uniform grid with a uniform grid, the function made for a uniform grid\
    \ is slightly faster. The HExplicitPDENonUniformGrid both return the Un of terminal\
    \ values, corresponding to values S and vi along the grids. To obtain a value\
    \ of Un, we apply the Matlab function interp2.m for two-dimensional interpolation.\n\
    \nThe C# code to implement the explicit method using uniform and non-uniform grids\
    \ is similar to the Matlab code and is not presented here. As explained in this\
