  md: "# 374\n\n# THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhere the\
    \ constants are, for $j = 1, 2$\n\n```\n$K_0 = \\frac{\rho_j\\kappa_j}{\\sigma_j}dt,\
    \ \\quad K'_0 = \\frac{dt}{2}(\\frac{\\kappa_j}{\\sigma_j} - \\frac{1}{2}) - \\\
    frac{\rho_j}{\\sigma_j} \\nK_j = \\frac{dt}{2}(\\frac{\\kappa_j}{\\sigma_j} -\
    \ \\frac{1}{2}) + \\frac{\rho_j}{\\sigma_j}, \\quad K'_j = \\frac{dt}{2}(1-\r\
    ho_j^2)$.$\n```\n\nNote that the Brownian $W_{1,j}$ and $W_{2,j}$ are independent,\
    \ but the discretization scheme preserves correlation through the constants $K_j$.\
    \ The stock price is then found by exponentiating $\\ln e^{r^{(t+d)}}S_{t+d}$\
    \ and multiplying the result by $e^{r^{(t+d)}}$.\n\n# Euler Scheme for the Variance\n\
    \nThis is a straightforward extension of the univariate case. Under the full truncation\
    \ scheme, for example each variance $v_{i+dt}$ is generated independently of the\
    \ other using the current value $v_{i,j}$ as\n\n```\n$v_{i+dt} = v_{i,j} + \\\
    kappa_j(\theta_j - v_{i,j}^2)dt + \\sigma_j\\sqrt{v_{i,j}}\\sqrt{dt}dZ_{i,V} \\\
    quad (12.27)$\n```\n\nfor $j=1$ and where $Z_{i,j}$ and $Z_{i,V}$ are independent\
    \ Brownian motion. The current and updated values $v_{i,j}$ and $v_{i+dt}$ are\
    \ fed into the system of Equation (12.26), and the process is repeated. Note that\
    \ $v_{i,j}^*=\\max(0, v_{i,j})$ so that in (12.27), negative variances are avoided.\
    \ It is also possible to use the reflective scheme instead, by replacing $v_{i,j}^*$\
    \ in (12.27) with $|v_{i,j}|$.\n\n# Alfonsi Scheme for the Variance\n\nGautier\
    \ and Possamaï (2010) adapt the second-order discretization scheme of Alfonsi\
    \ (2010) to the double Heston model. For notational simplicity, we drop the “j”\
    \ subscript from all parameters and variances. As in Chapter 7, define\n\n```\n\
    $$\\Psi = \\frac{1-\\exp(-\\kappa dt)}{\\kappa}$\n```\n\nand define the constant\
    \ $K_2$ as\n\n```\n$K_2 = \\exp(\\kappa dt/2)(\\frac{\\sigma^2}{4}-\theta K)\\\
    Psi + (\\sqrt{e^{\\kappa dt/2}}(\\frac{\\sigma^2}{4}-\theta K)\\Psi + \\frac{\\\
    sigma}{2}\\sqrt{3dt})^2 \\quad (12.28)$\n```\n\nwhen $\\sigma^2 > 4\\kappa$, and\
    \ as\n\n```\n$K_2 = 0 \\quad (12.29)$\n```\n\nwhen $\\sigma^2 \\le 4\\kappa$.\
    \ At each simulation step, we compare $v_i$ to $K_2$, and we have a different\
    \ updated value $v_{i+dt}$, depending on the result of the comparison. Hence,\
    \ in this scheme, two cases are considered separately, exactly as in Chapter 7."
  merge: -1
