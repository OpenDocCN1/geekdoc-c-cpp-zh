  md: "# 28\n\n# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nwhich is\
    \ Equation (2.2). What remains to be demonstrated is that $q^s(x)$ can serve as\
    \ a density function, which requires $q^s(x) \\geq 0$ and that $q^s(x)$ integrate\
    \ to unity. To show the first requirement, note from Equation (2.8) that\n\n```\n\
    $q^s(x) = \\frac{S_t}{B_t}q(x) > 0.$\n```\n\nNow consider the integral of $q^s(x)$\
    \ over $(0, \\infty)$\n\n```\n$\\int_0^{\\infty} q^s(x)dx = \\frac{\\int_0^{\\\
    infty} e^{x_T}dx}{E[e^{x_T}]} = \\frac{E[e^{x_T}]}{E[e^{x_T}]} = 1.$\n```\n\n\
    The result is that the call price can be written as\n\n```\n$C(K) = S_tP_1 - e^{-r(T-t)}KP_2$\n\
    ```\n\nwith $P_1$ in Equation (2.11) and $P_2$ in Equation (2.7) each obtained\
    \ from the characteristic function for $x_T = \\ln S_T$. This is a general setup\
    \ that is valid for many models, not only the Heston model, as in Bakshi and Madan\
    \ (2000). It is commonly referred to as the characteristic function approach for\
    \ option pricing.\n\nTo illustrate, in the Black-Scholes model, $x_T$ is normally\
    \ distributed with mean $\\ln(S_t) + (r - \\frac{\\sigma_{BS}^2}{2})\tau$ and\
    \ variance $\\sigma_{BS}^2\tau$, so that the characteristic function for $x_T$\
    \ is\n\n```\n$f(\\phi) = \\exp\\left(i\\phi [\\ln S_t + (r - \\frac{1}{2}\\sigma_{BS}^2)\\\
    tau] - \\frac{1}{2}\\phi^2\\sigma_{BS}^2\\tau\\right).$\n```\n\nSubstituting $f(\\\
    phi)$ into the expressions for $P_1$ and $P_2$ and evaluating the integrals numerically\
    \ will produce the same call price as the closed form solution for the Black-Scholes\
    \ call price, up to approximation error.\n\nThe relationship between the characteristic\
    \ functions can be easily illustrated by showing that\n\n```\n$f_1(\\phi) = \\\
    frac{f_1(\\phi - i)}{f_1(-i)}.$\n```\n\nBecause of the log-linear form of the\
    \ characteristic function, this is equivalent to showing that\n\n```\n$C_1(\\\
    tau, \\phi) = C_2(\\tau, \\phi - i) - C_2(\\tau, -i)$\n```\n\n```\n$D_1(\\tau,\
    \ \\phi) = D_2(\\tau, \\phi - i) - D_2(\\tau, -i).$\n```\n\nWith these identities,\
