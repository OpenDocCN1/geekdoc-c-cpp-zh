    **Figure 11.2** Theta from the Heston Model


    # GREEKS UNDER THE ATTARI AND CARR-MADAN FORMULATIONS


    In the previous sections, we derived and implemented the Greeks under the original
    Heston (1993) formulation of the call price. It is also possible to derive analytic
    expressions for the Greeks under alternate formulations, such as those encountered
    in previous chapters. It is straightforward to obtain delta and gamma using the
    Attari (2004) expression for the call price, as derived by Zhu (2010). Recall
    from Chapter 3 that the call price in this model is given by


    ```

    $C(K) = S_t - \frac{1}{2}Ke^{-rt} - \frac{Ke^{-rt}}{\pi} \int_{0}^{\infty} A(u)du.$

    ```


    The integrand is


    ```

    $A(u) = \frac{R_2 + \frac{I_2}{u}}\cos(\ell u) + \left(I_2 - \frac{R_2}{u}\right)\sin(\ell
    u)}{1+u^2} \\frac{F(u)\cos(\ell u) + G(u)\sin(\ell u)}{1+u^2} \quad (11.31)$

    ```'
