  md: "# Simulation of the Heston Model\n\nEuler discretization of (7.29) is simply\n\
    \n```\n\\omega_{t+dt} = \\omega_t + \\frac{\\kappa}{2} \\left[ (\\theta - \\frac{\\\
    sigma^2}{4\\kappa}) \\omega_t \\right] dt + \\frac{1}{2}\\sqrt{dt}Z_V \\quad (7.30)\n\
    ```\n\nWhile Euler discretization of the log stock prices\n\n```\nS_{t+dt} = S_t\
    \ \\exp \\left( r - \\frac{1}{2}\\omega_t^2 \\right) dt + \\omega_t\\sqrt{dt}Z_S\
    \ \\quad (7.31)\n```\n\nZhu (2010) points out that, while Euler discretization\
    \ of the volatility $\\omega_t$ avoids negative variance, the drawback is that\
    \ the mean level $\\theta_{\\omega_t} = (\\theta - \\frac{\\sigma^2}{4\\kappa})\
    \ /\\omega_t$, in (7.29) is stochastic because of $1/\\omega_t$. This will cause\
    \ the simulation to be poorly behaved. The transformed volatility scheme by Zhu\
    \ (2010) applies a robust approximation of $\\theta_{\\omega_t}$ to rectify this\
    \ problem. His transformed volatility process is\n\n```\nd\\omega_t = \\frac{\\\
    kappa}{2}[\\theta^* - \\omega_t]dt + \\frac{\\sigma}{2}dW_{\\omega,t} \\quad (7.32)\n\
    ```\n\nwhich has the mean reversion speed $\\kappa/2$ and volatility of variance\
    \ $\\sigma/2$, respectively. The mean reversion level $\\theta_t^*$ is\n\n```\n\
    \\theta_t^* = \\frac{\\beta - \\omega_t\\exp(-\\kappa dt)}{1 - \\exp(-\\kappa\
    \ dt)}\n```\n\nwhere\n\n```\n\\beta = \\sqrt{(E[\\nu_{t+dt}] - Var[\\nu_{t+dt}])^+}\
    \ = \\sqrt{(\\theta + (\\nu_t - \\theta)e^{-\\kappa dt}) - \\frac{\\sigma^2}{4\\\
    kappa}(1 - e^{-\\kappa dt})^+}$\n```\n\nNote that the $\\beta$ parameter is set\
    \ to zero when $E[\\nu_{t+dt}] < Var[\\nu_{t+dt}]$, while the mean reversion level\
    \ $\\theta_t^*$ depends on the value of $\\omega_t$. Euler discretization of $d\\\
    omega_t$ in (7.32)\n\n```\n\\omega_{t+dt} = \\omega_t + \\frac{\\kappa}{2}[\\\
    theta^* - \\omega_t]dt + \\frac{\\sigma}{2}\\sqrt{dt}Z_V. \\quad (7.33)\n```\n\
    \nThe TransVolSim. Matlab function simulates the stock price in Equation (7.30)\
    \ or (7.33). The functions use the parameters $\\kappa$, $\\theta$, $\\sigma$,\
    \ and $\\rho_t$, as in the other simulations, but the parameter for the initial\
    \ volatility is $\\sqrt{V_0}$.\n\n```\nfunction [S v] = TransVolSim(scheme,...)\n\
    v(1,:) = v0;               % Heston initial variance\nw(1,:) = sqrt(v0);     \
    \ % Heston initial volatility\nfor i=1:N\n    t=2:T\n    % Generate two dependent\
    \ N(0,1) variables\n    2v = randn(i);\n```"
