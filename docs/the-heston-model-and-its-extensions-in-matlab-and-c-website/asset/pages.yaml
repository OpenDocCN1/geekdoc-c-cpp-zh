    xat = e*ih\nxhat = xhat(1:N)\n```\n\nThis function is used in the HestonCallFRFT.m,\
    \ which implements the FRFT.\n\n```\nfunction [CallFRFT K lambdinc eta] = HestonCallFRFT(...)\n\
    b = N*lambdinc/2\nv = -b + lambdinc.*0:N-1]\nk = -b + lambdinc.*0:N-1'] + s0\n\
    k = exp(k)\nCallFRFT = zeros(N,1)\nbeta = lambdinc*alpha/2\npsi = HestonCF(v-(alpha-1).*i..,Trap)\n\
    psi = conj(psi)\nphi = exp(-r*tau).*i./conj(alpha^2 + alpha - v.^2 + ...)\nx =\
    \ conj(exp(i.*(b-s0).*v)).*phi;*\ny = real(FRFT(x,beta))\nCallFRFT = eta.*exp(-alpha.*k).**y'./pi.\n\
    ```\n\nThe C# function to implement the FRFT is using the FRFT() function, which\
