    # THE EXPLICIT METHOD


    In Chapter 10 we will encounter methods to the Heston price of European options
    by approximating with finite differences the PDE that these options satisfy. It
    is straightforward to adapt one of these methods, the explicit method, and price
    American options. Recall from Chapter 1 that the value $U(S,v,t)$ of a derivative
    with maturity $t$ satisfies the PDE


    ```

    $\frac{\partial U}{\partial t} = -\frac{1}{2}\frac{\partial^2 U}{\partial S^2}
    + \rho v S\frac{\partial U}{\partial S\partial v} + \frac{1}{2}\sigma^2\frac{\partial^2
    U}{\partial v^2} - rU\\n+ (r-q)S\frac{\partial U}{\partial S} + \kappa(\theta-v)\frac{\partial
    U}{\partial v} \quad (8.8)$

    ```


    where we have $\lambda=0$. Recall also, since we are using $t$ to represent maturity,
    the sign of the derivative $\partial U/\partial t$ is the opposite of what it
    would be if $t$ represented time. We see in Chapter 10 that the first step in
    solving the PDE with finite differences is to use discrete grids for the stock
    price, volatility, and maturity. By $U_{ij}^n = U(S_i, v_j, t_n)$ the value of
    the European derivative when the stock price and volatility are at points $i$
    and $j$ respectively of grids, and when the maturity is at the point $n_i$, for
    $i=0,\dotsdots,N_s$, for $j=0,\dotsdots,N_v$, and for $n=0,\dotsdots,N_t$. The
    explicit method defines the value of the derivative at maturity point $n+1$ as


    ```

    $U_{ij}^{n+1} = U_{ij}^n + dt \left[ \frac{1}{2}v_j^2\frac{\Delta^2 U}{\Delta
    S^2} + \frac{1}{2}\sigma^2\frac{\Delta^2 U}{\Delta v^2} \\ + (r-q)S_i\frac{\Delta
    U}{\Delta S} + \kappa(\theta-v_j)\frac{\Delta U}{\Delta v} \right] U_{ij}^n, \quad
    (8.9)$

    ```


    To evaluate $U_{ij}^{n+1}$ we need to substitute finite difference approximations
    of the derivatives. We see in Chapter 10 that when a uniform grid is constructed,
    one that uses equidistant between successive values of the stock price and volatility,
    the expression for $U_{ij}^{n+1}$ in (8.9) reduces to a very simple form. A non-uniform
    grid, however, leads to greater accuracy with fewer grid points, but also to an
    expression of $U_{ij}^{n+1}$ that is slightly more complicated.


    Since the explicit method works backward in time, we start with the value of $U_{ij}^n$,
    namely the value of the derivative at maturity. For put option, we use


    ```

    $U_{ij}^n = \max(K-S_i, 0) \quad (8.10)$

    ```'
