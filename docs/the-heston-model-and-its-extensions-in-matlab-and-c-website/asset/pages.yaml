  md: "In the non-homogenous part of Equation (8.47), which involves only the last\n\
    two terms on the left-hand side of (8.47), substitute $C_n p_m^n(\theta) + P_m^n(\t\
    heta)$ and apply the\nchain rule to obtain\n\n```\n$(\\overline{C}_{n-1}p_{n-\\\
    theta}^{n-1} + \\overline{\\sigma}_{n-1}p_{n-\\theta}^{n-1} - 2rc_{n-2}p_{n-\\\
    theta}^{n-2} - 2rp_{n-2}^{n-2}) \\Phi(\\theta)\\n+(\\overline{C}_{n-1}q_{n-\\\
    theta}^{n-1} - \\overline{\\sigma}_{n-1}q_{n-\\theta}^{n-1} - \\overline{C}_{n-2}q_{n-\\\
    theta}^{n-2} + \\overline{\\sigma}_{n-1}q_{n-1}^{n-1})\\n+\\overline{q}_{n-1,\\\
    theta} - \\overline{\\sigma}_{n-1}q_{n-1,\\theta}^{n-1} - 2rc_{n-2}q_{n-\\theta}^{n-2}\
    \ - 2rq_{n-2}^{n-2}) \\Phi(\\theta) = 0$\n```\n\nRegroup (8.48) and (8.49) into\
    \ common terms $\\Phi(\theta)$ and $\\phi(\theta)$, which produces\nthe system\
    \ of two equations\n\n```\n$p_{n-\\theta}^n + \\theta^n p_{n-\\theta}^{n-1} +\
    \ \\overline{\\sigma}_{n-1}p_{n-\\theta}^{n-1} + \\overline{C}_{n-1}p_{n-\\theta}^{n-2}\
    \ - 2r(C_{n-2}^{n-2} + p_{n-2}^{n-2}) = 0,\\n- (n+1)q_{n-\\theta}^n + q_{n-\\\
    theta}^{n-1} + 2p_1^n \\overline{C}_{n-1}(p_{n-\\theta}^{n-1} + q_{n-\\theta}^{n-2})\
    \ - \\theta q_{n-1}^{n-1}\\n+ (\\overline{p}_{n-1,\\theta} - \\overline{\\sigma}_{n-1}q_{n-1,\\\
    theta}^{n-1} - 2rc_{n-2}q_{n-\\theta}^{n-2} + 2rq_{n-2}^{n-2}) = (8.50)\n```\n\
    \nFor each $n$, the first PDE in (8.50) is solved for $q_n^n$; all other quantities\n\
    are considered similar, the second PDE in (8.50) is solved for $p_n^n$. At the\
    \ end of this\nsection, we can then use the symbolic method in Matlab.\nOnce the\
    \ polynomials $q_n^n$ are obtained, and $p_n^n$ obtained\ntrough the set of two\
    \ PDEs in (8.50), the coefficients $C_n$ can be obtained\nevaluating (8.40) at\
    \ $\\theta = \\theta$, substituting the Taylor expansion for $e^{-\\gamma y^2}$\
    \ in\n(8.39), and equating the two equations for successive powers of $\\tau^{n/2}$.\
    \ After cancelling\n\\tau^{n/2}$ from both sides, this produces the following,\
    \ which is readily solved\nt $C_n$.\n\n```\n$C_n[p_n^n(\\Phi) + q_n^n(\\phi) +\
    \ p_n^n(\\widetilde{\theta}) + q_n^n(\\widetilde{\theta})] = (-1)^{n+1}\\sigma^ny^n/n!\
    \ (8.51)\n```\n\nWhen $\\Phi(\\theta) = \\Phi(\\widetilde{\theta})$ and $\\phi(\\\
    theta) = \\phi(\\widetilde{\theta})$ are the standard normal distribution and\
    \ density,\nrespectively, evaluated at $\\theta = \\widetilde{\theta}$, the optimized\
    \ value is obtained from (8.42). For example, when\nn=1$ we see that $p_1^1 =\
    \ \\theta$, $q_1^1 = 1$, and $p__1^1 = 0$. Here $C_1$ is obtained\n\n```\n$C_1\
    \ = \\frac{K\\sigma}{\\Phi(\\theta) + \\phi(\\theta)} (8.52)\n```\n\nThe first\
    \ step in implementing the Medveev and Seillet (2010) expansion to\nthe Black-Scholes\
    \ price of an American put is to generate the coefficients for the\npynomials\
    \ $p_n^n$ and $q_n^n$. This is done with the following code, from the Matlab\n\
