    To form the hedging portfolio, first apply Itô’s lemma to the value of the first
    derivative, $V(S,v,t)$. We must differentiate $V$ with respect to the variables
    $t, S$, and $v$, and follow a second-order Taylor series expansion. The result
    is that $dV$ follows the process


    ```

    $dV = \frac{\partial V}{\partial t}dt+\frac{\partial V}{\partial S}dS+\frac{\partial
    V}{\partial v}dv+\frac{1}{2}\frac{\partial^2 V}{\partial S^2}dS^2+\frac{1}{2}\frac{\partial^2
    V}{\partial v^2}dv^2+\rho sv\frac{\partial^2 V}{\partial S\partial v}dt$.

    ```


    We have used that $(dS)^2 = (dW_t)^2 = S^2dt$, and $\langle dS, dv \rangle = \sigma^2dt$,
    and $dsv = \sigma v dW_t, dW_2 = \rho svdt$. We also have $(dt)^2 = 0$ and $dW_t^2
    = dt$. Applying Itô’s lemma to the second derivative, $U(S,v,t)$, produces an
    expression identical to (1.18). By substituting these expressions into (1.17),
    the portfolio value can be


