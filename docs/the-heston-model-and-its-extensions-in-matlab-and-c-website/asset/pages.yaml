- pgno: 172
  md: '# Parameter Estimation


    $F \in [0, 2]$ is a constant factor. The elements of the donor $y_i$ are used
    to construct a candidate member that may or not replace $x_i$, based on the results
    of Steps 3 and 4.


    **Step 3.** Recombination of donor members. The candidate member $u_i$ is constructed
    element-by-element from the elements $y_{ij}$ of the donor and the elements of
    the member $x_i (j = 1, \dots, 5)$ according to the following rule. For each element
    $j$, we generate a uniform random number $U_{ij}$ and we form the candidate element
    as


    ```

    $u_{ij} = \begin{cases} y_{ij} & U_{ij} \leq CR \text{ or } j = R \ x_{ij} & \text{otherwise}
    \end{cases} \quad (6.14)

    ```


    $R$ is a randomly chosen integer from 1 to $S$ and $CR$ is a probability called
    the crossover ratio. The use of $R$ guarantees that the candidate is not the same
    as the member, that is, it guarantees that $u_i \neq x_i$. This is because, even
    if all the $U_{ij}$ are very small that the condition $U_{ij} \leq CR$ is not
    satisfied for any $j = 1, \dots, S$, the condition $j = R$ will be met and the
    corresponding element $y_{ij}$ will become the element of $u_i$.


    **Step 4.** Selection of the candidate. The member $x_i$ and its candidate $u_i$
    are fed into the objective function $f(x)$. If the candidate''s value is lower
    than that of the member, the candidate replaces $x_i$, as the $i$-th member of
    the population $P$ in (6.11). The rule is follows


    ```

    $P = \begin{cases} (x_1, \dots, u_i, \dots, x_{Np}) & \text{if } f(u_i) < f(x_i)
    \ (x_1, \dots, x_i, \dots, x_{Np}) & \text{otherwise.} \end{cases} \quad (6.14)

    ```


    When all members have received the treatment, the population is updated and the
    next generation starts again at Step 2. The algorithm then runs over all $N_G$
    generations. The parameter estimate is chosen as the member with the lowest value
    of $f(x)$ from the population of the final generation.


    The Differential Evolution algorithm is implemented with the HestonDE.mem. The
    first part of the function creates the population of members and generates random
    uniform numbers under the loop. In the mutation and recombination steps, the function
    verifies that the candidate (Pnew) falls within the range of acceptable parameter
    values. If not, a new candidate is created. The population is updated with the
    candidate, if applicable. At the last, the member with the lowest value of the
    FRFT objective function is returned as the parameter estimate. Note that, at the
    beginning of each loop, the candidate Pnew is set to it that violates values ensures
    that the whole loop is executed at least once.


    ```

    function y = HestonDE(NG, NP, CR, F, Hi, Lo, S, ...)

    % Step1. Generate the population of random parameters

    P = [kappaL + (kappa-kappaAL)*rand(1,NP); ...

    thetaL = (theta-UTheta)*rand(1,NP); ...

    ```'
