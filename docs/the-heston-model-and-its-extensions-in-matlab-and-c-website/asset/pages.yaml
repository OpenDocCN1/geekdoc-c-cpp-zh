  md: "# 32 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nImplementing this\
    \ function is very simple and involves only replacing C, and D, with the slightly\
    \ different forms in Equations (2.17) and (2.14). The function HestonIntegrand.m,\
    \ which follows, computes the characteristic function using the original Heston\
    \ (1993) formulation, and Albrecher et al. (2007) “Little Trap”. To conserve,\
    \ parts of the function are almost.\n\n```\nfunction y = HestonIntegrand(phi,...,\
    \ Trap)\nd = sqrt(rho*sigma*i*phi + i)^2 - a ...\ng = (b - rho*sigma*i*phi + d)\
    \ / ...;\nif Trap=1\n    % \"Little Heston Trap\" formulation\n    c = 1/g;\n\
    \    D = (b - rho*sigma*i*phi - d)/sigma^2 * ...;\n    C = (1 - c*exp(-d*tau))/(1-c);\n\
    \    r*i*phi*tau + a/sigma^2 * (b- rho*sigma*i*phi - d) * ...;\nelif Trap=0\n\
    \    % Original characteristic function.\n    G = (1 - g*exp(d*tau))/(1-g);\n\
    \    C = r*i*phi*tau + a/sigma^2 * ...;\n    D = (b - rho*sigma*i*phi + d)/sigma^2\
    \ * ...;\nend\nf = exp(C + D*v0 + i*phi*X);\nreturn the real part of the integrand.\n\
    y = real(-i*phi+log(K))*f/i/phi);\n```\n\nThe implementation in C# is done using\
    \ the HestonProb() function and is very similar. The C# code is therefore not\
