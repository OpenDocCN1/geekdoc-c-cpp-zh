    \ |\n| 104 | 3.1173 | 3.1216 | 0.138 |\n| 105 | 2.7477 | 2.7521 | 0.158 |\n\n\
    # VOLATILITY OF VOLATILITY SERIES EXPANSION\n\nLewis (2000) derives a volatility\
    \ series expansion for the call price and the implied volatility that are valid\
    \ under a general class of stochastic volatility models. In this section, we present\
    \ this expansion for the Heston model only. Obtaining the Heston call price with\
    \ this method is very fast, because numerical integration is not required. The\
    \ name is derived from the fact that both expansions are in powers of the volatility\
    \ of variance parameter, $\\sigma$. The first series is based on an expansion\
    \ about the Black-Scholes price evaluated at the average variance $\bar{v}$\n\n\
    > $C_{BS}(S_0, \\bar{v}, T) = S_0e^{-qT}\\Phi(d_1) - Ke^{-rT}\\Phi(d_2) \\quad\
    \ (4.35)$\n\nwhere\n\n```\n$d_1 = \\frac{\\log(S_0/K) + (r - q + \\frac{\\bar{v}}{2})T}{\\\
    sqrt{\bar{v}T}}$\n```\n\nand with $d_2 = d_1 - \\sqrt{\bar{v}}$. The quantity\
    \ $\\bar{v}$ denotes the average expected variance over $(0, T)$ of the CIR process\
    \ we encountered in Chapter 2\n\n```\n$$\\bar{v} = \\frac{1}{T} \\int_0^T v_t\
    \ dt = \\frac{1}{T} \\int_0^T E[v_t|v_0]dt \\quad (4.36)$$\\n$= \\frac{1}{T} \\\
    int_0^T [\\theta + (v_0 - \\theta)e^{-\\kappa t}]dt = (v_0 - \\theta) \\frac{1\
    \ - e^{-\\kappa T}}{\\kappa T} + \\theta.$\n```\n\nThe expected variance $\\bar{v}$\
    \ is the fair strike of a variance swap in the Heston model, as demonstrated by\
    \ Gatheral (2006), who denoted $K_{var}^2 = \\hat{w}/T$ in Chapter 2. The first\
    \ series expansion uses the derivation of the Black-Scholes price with respect\
    \ to the variance $v$, again evaluated at $\\bar{v}$\n\n```\n$C_v(S_0, \\bar{v},\
    \ T) = \\sqrt{\\frac{T}{8\\pi\\bar{v}}} S_0e^{-qT} \\exp\\left(-\\frac{1}{2}d_1^2\\\
    right) \\quad (4.37)$\n```"
