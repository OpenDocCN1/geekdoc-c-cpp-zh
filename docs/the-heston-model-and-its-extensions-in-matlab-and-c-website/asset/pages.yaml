  md: "# Kahl-Jäckel IJK Scheme\n\nThis was also proposed by Kahl and Jäckel (2006).\
    \ It involves simulating $v_t$, with the implicit Milstein scheme from Equation\
    \ (7.26), and simulating $S_t$ with their IJK discretization given by\n\n```\n\
    $$\\ln S_{t+dt} = \\ln S_t + \\left(r - q - \\frac{v_t + v_{t+dt}}{4}\\right)dt\
    \ + \\rho\\sqrt{v_t}dtZ_V$$\n$$\n+ \\frac{1}{2}(\\sqrt{v_t} + \\sqrt{v_{t+dt}})\\\
    sqrt{dt} + \\frac{\\rho\\sigma}{2}(Z_V^2 - 1)$. (7.36)\n```\n\nSince this scheme\
    \ can also produce negative variances, in (7.36) the truncation scheme or the\
    \ reflection scheme should be used. We see their paper for details of the derivation.\n\
    \nThe Matlab function KahlSim implements the Balanced (7.34), Pathwise (7.35),\
    \ and IJK (7.36) schemes. Parts of the function have been omitted to conserve\
    \ space\n\n```\nfunction { S V F } = KahlJackelSim(scheme,...)\n  for i=1:T\n\
    \    if strcmp(scheme, 'IJK')\n      % Milstein Method for the variance\n    \
    \  V(t,i) = (V(t-1,i) + kappa*theta*dt + ...\n      % IJK discretization log stock\
    \ prices\n      S(t,i) = S(t-1,i)*exp((r-q-V(t,i)+V(t-1,i))/4) + ...\n      %\
    \ Pathwise Adaptive Linearization for variance.\n      theta2 = theta - sigma2/4/kappa;\n\
    \      Bn = 2*sqrt(dt);\n      V(t,i) = (V(t-1,i) + kappa(theta2-V(t-1,i))) +\
    \ ...\n      % Euler/Milstein discretization log stock prices\n      S(t,i) =\
    \ S(t-1,i)*exp((r-q-V(t-1,i)/2)*dt + ...)\n    elseif strcmp(scheme, 'B')\n  \
    \    % Balanced Implicit scheme for the variance\n      abdw = sqrt(abs(Zv));\n\
    \      C = kappa*dt + sigma/sqrt(V(t-1,i)) + ...\n      V(t,i) = (V(t-1,i)*(1+C)\
    \ + kappa*(theta-V(t-1,i)) / ...) / ...\n      % Euler/Milstein discretization\
    \ log stock prices\n      S(t,i) = S(t-1,i)*exp((r-q-V(t-1,i)/2)*dt + ...)\n \
    \ end\nend\n```\n\nThe KahlJackelPrice.m function calculates the price of a European\
    \ call or put, based on paths simulated using the KahlJackelSim.m function. The\
    \ C# code to implement these methods is very similar to the Matlab code and is\
    \ not presented here."
