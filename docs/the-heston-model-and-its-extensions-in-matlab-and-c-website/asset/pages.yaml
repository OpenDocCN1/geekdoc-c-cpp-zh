  md: '# Parameter Estimation


    Formulas for these derivatives are presented in Chapter 9. The other quantities
    we need for the coefficients in (6.7), namely $m_0, p_0, p_1, q_0, q_1, r_0$ and
    $r_1$ can be found in Gauthier and Rivaille (2009) or in Benhamou et al. (2010).


    The method of Gauthier and Rivaille is built on the idea that given quoted puts
    with the same maturity $r$, namely $P(K_1)$ with strike $K_1$ and $P(K_2)$ with
    strike $K_2$, we can form the system of these two equations in


    ```

    $P(K_1) = A(K_1) + B(K_1)\sigma^2 + C(K_1)\rho\sigma + D(K_1)\rho^2\sigma^2$\nnP(K_2)
    = A(K_2) + B(K_2)\sigma^2 + C(K_2)\rho\sigma + D(K_2)\rho^2\sigma^2$

    ```


    and for $(\rho, \sigma)$. In order to do this, we fix values of $\kappa$, $\theta$,
    and $v_0$ in the coefficients. We can solve for $(\rho, \sigma)$ by the symbolic
    toolbox in Matlab. In general, all solutions will be produced, but only one will
    be admissible, with both $|\rho| \le 1$ and $\sigma > 0$.


    Alternatively, we can fix the values of $\rho$ that minimize the objective function


    ```

    $f(\rho, \sigma) = (A(K_1) + B(K_1)\sigma^2 + C(K_1)\rho\sigma + D(K_1)\rho^2\sigma^2
    - P(K_1))^2$\n+(A(K_2) + B(K_2)\sigma^2 + C(K_2)\rho\sigma + D(K_2)\rho^2\sigma^2
    - P(K_2))^2$

    ```


    Implementing this in Matlab is straightforward. The Matlab file BlackSchDerivatives.m
    contains the derivatives for the coefficients in Equation (6.7). This function
    is passed to Gauthierefficients.m, which calculates the coefficients in (6.7).


    ```

    function [A B C D] = Gauthierefficients(...);

    % Generate the Black-Scholes derivatives

    % [P1 P2 P01 P02] = BlackScholesDerivatives(...);

    % Black Stocks Put Price

    BSPut = K*exp(-r*T)*normcdf(-q-T)*normcdf(g);

    % Return the coefficients

    A = BSPut;

    B = (v0 + theta*rt1)*P02;

    C = (v0 + theta*rt1)*P21 + 0.5*(v0*g0 + theta*rt1)^2*P22;

    D = ...;

    ```


    Finally, these coefficients are passed to the GetGauthierValues.function, which
    calculates sigma and rho in two ways: using closed-form values obtained with Matlab''s
    symbolic calculator, or using the objective function in Equation (6.9).


    ```

    function [sigma rho] = GetGauthierValues(K1,K2,Put1,Put2,...,method);

    % Find the Gauthier coefficients for each strike

    [A1 B1 C1 D1] = GauthierCoefficients(K1,...);

    [A2 B2 C2 D2] = GauthierCoefficients(K2,...

    ```'
