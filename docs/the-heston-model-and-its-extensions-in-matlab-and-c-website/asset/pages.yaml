  md: "# Numerical Integration Schemes\n\nTo illustrate, suppose that $S = K = 100,\
    \ T = 1.5, r = 0.05, q = 0.01, \\kappa = 2$, $\\sigma = 0.3, \\theta = 0.05,$\
    \ and $\rho = 0.45$. The Matlab code\n\n```\n[x w] = GenerateGaussLaguerre(32);\n\
    HestonPriceGaussLaguerre('C',100,100,1.5,0.05,0.01,2,0.05,0.3,\n0.05,0.45,1,w)\n\
    ```\n\nreturns a call of 13.2561.\n\n# Gauss-Legendre Quadrature\n\nGauss-Legendre\
    \ quadrature is designed for integrals over the integration domain $[-1, b]$,\
    \ but this can be modified to accept any finite domain $[a, b]$ through the transformation\n\
    \n> $$\\int_{a}^{b} f(x)dx = \\frac{b-a}{2} \\int_{-1}^{1} \\left(\\frac{b-a}{2}x\
    \ + \\frac{a+b}{2}\\right)dx. \\quad (5.8)$\n\nSince the endpoints $a$ and $b$\
    \ are not included in the absciss, to implement Gauss-Legendre quadrature for\
    \ the Heston model, we can select $a=0$. We must, still set $b=\\phi_{max}$ a\
    \ large number. In Gauss-Legendre quadrature with $N$ points, the abscissae $(x_1,\
    \ \\dots, x_N)$ are the roots of the Legendre polynomial $P_N(x)$ defined as\n\
    \n> $P_N(x) = \\frac{1}{2^N} \\sum_{k=0}^{[N/2]} (-1)^k \\binom{N}{k} \\binom{2N-2k}{N-k}\
    \ x^{N-2k} \\quad (5.9)$\n\nwhere $\\lfloor \\rfloor$ is the floor function. The\
    \ weights $(w_i, \\dots, w_N)$ are obtained with the derivative of $P_N(x)$ evaluated\
    \ at the abscissae. Similar to what is done for Gauss-Legendre quadrature, we\
    \ evaluate the derivative at each of the abscissae\n\n> $P_N'(x) = \\frac{1}{2^N}\
    \ \\sum_{k=0}^{[N/2]} (-1)^k \\binom{N}{k} \\binom{2N-2k}{N-k} (N-2k)x^{N-2k-1}.\
    \ \\quad (5.10)$\n\nWe define each weight as\n\n> $w_j = \\frac{2}{(1-x_j^2)}[P_N(x_j)]^2\
    \ \\quad \\text{for } j=1, \\dots, N.$\n\nThe binomial coefficients grow very\
    \ quickly, so for numerical implementation, it is best to replace Equations (5.9)\
    \ and (5.10) with respectively\n\n> $P_N(x) = \\frac{1}{2^N} \\sum_{k=0}^{[N/2]}\
    \ (-1)^k \\frac{(2N-2k)!}{k!(N-k)!(N-2k)!} x^{N-2k}$"
