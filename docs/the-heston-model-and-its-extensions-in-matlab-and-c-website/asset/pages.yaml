  md: "# American Options 251\n\ncompared to the explicit method or the bivariate\
    \ tree, but it is able to produce prices much faster than the other methods.\n\
    \n# Parameter Estimation\n\nThe fact that the Medvedev and Scailot (2010) expansion\
    \ produces American put prices with little computation time makes it feasible\
    \ to estimate Heston parameters for pricing American options. We illustrate this\
    \ with American puts written on IBM on May 7, 2010. The closing price of IBM was\
    \ $122.20. We use the Medvedev and Scailot (2010) method to obtain Black-Scholes\
    \ implied volatilities for American puts. This is proficient with the Matlab function\
    \ BisecMSIV.m function, which is similar to the BisecMSIV.m function presented\
    \ in Chapter 2. The difference is that model prices are obtained using the MSPriceBS.m\
    \ function for the Medvedev Scaillet-Black-Scholes pricing of American puts, rather\
    \ than using the Black-Scholes closed form.\n\n```\nfunction y = BisecMSIV(S,K,rf,q,a,b,MktPrice,Tol,MaxIter)\n\
    lowCif = MktPrice - MSPriceBS(S,K,T,a,rf,q)\nhighCif = MktPrice - MSPriceBS(S,K,T,b,rf,q)\n\
    if lowCif*highCif > 0\n    y = -\nelse\n    for x=1:MaxIter\n        midP = (a+b)/2\n\
    \        midCif = MktPrice - MSPriceBS(S,K,T,midP,rf,q)\n        ;\n    end\n\
    end\ny = midP;\n```\n\nThe following code snippet extracts volatilities from the\
    \ IBM American put prices.\n\n```\n% Settings for the bisection algorithm\na =\
    \ 0.01;\nb = 0.0;\nTol = 1e-5;\nMaxIter = 1000;\n% American implied volatilities\n\
    for t=1:NT\n    for k=1:NK\n        MktIV(k,t) = BisecMSIV(K(k),T(t),MktPrice(k,t),...);\n\
    \    end\nend\n```"
