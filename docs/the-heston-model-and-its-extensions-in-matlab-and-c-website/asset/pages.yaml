- pgno: 104
  md: 'To evaluate (4.5), perform integration by parts and ignore the boundary terms.

    For example


    ```

    $$\int_{-\infty}^{\infty} e^{ikx}\frac{\partial\tilde{U}}{\partial x}dx=^{ikx}U(x,t)|_{x=-\infty}^{x=\infty}
    - ik\int_{-\infty}^{\infty} e^{ikx}U(x,t)dx = -ik\tilde{U}(x,t)$ (4.6)

    ```


    where the boundary term $e^{ikx}U(x,t)$ has been set to zero. Lewis (2000) explains

    why this can be. The other terms in Equation (4.5) are evaluated in a similar

    fashion. We end up with


    ```

    $$\int_{-\infty}^{\infty} e^{ikx}\frac{\partial^2\tilde{U}}{\partial x^2}=-k^2\tilde{U}(x,t),$

    ```


    and obviously


    ```

    $$\int_{-\infty}^{\infty} e^{ikx}\frac{\partial\tilde{U}}{\partial v}dx=\frac{\partial\tilde{U}}{\partial
    v}, \int_{-\infty}^{\infty} e^{ikx}\frac{\partial^2\tilde{U}}{\partial v^2}dx=\frac{\partial^2\tilde{U}}{\partial
    v^2}$

    ```


    Substituting these derivatives into (4.5) produces the PDE for $\tilde{U}$


    ```

    $$\frac{\partial\tilde{U}}{\partial t}=[-r-ik(r-q)]\tilde{U}-\frac{1}{2}v(k^2-ik)\tilde{U}$\n+[\kappa(\theta-\v)-\lambda
    v-ik\rho\sigma v]\frac{\partial\tilde{U}}{\partial v}-\frac{1}{2}\frac{\partial^2\tilde{U}}{\partial
    v^2}$ (4.7)

    ```


    In Equation (2.2.6) of Lewis (2000), the transform in (4.1) is written in the
    form


    ```

    $$\tilde{U}(k,t)=exp([-r-ik(r-q)]\tau) \times \tilde{H}(k,v,\tau)$ (4.8)

    ```


    where $\tau=T-t$ is the time to maturity. The function $\tilde{H}$ is obtained
    as the solution

    of a PDE that is constructed by differentiating Equation (4.8). Thus we need the

    following derivatives


    ```

    $$\frac{\partial\tilde{U}}{\partial t}=\{\partial\tilde{U}}{\partial \tau}=[-r-ik(r-q)]e^{[-r-ik(r-q)]\tau}\tilde{H}(k,v,\tau)+e^{[-r-ik(r-q)]\tau}\frac{\partial\tilde{H}}{\partial
    \tau}$

    ```


    and


    ```

    $$\frac{\partial\tilde{U}}{\partial v}=e^{[-r-ik(r-q)]\tau}\frac{\partial\tilde{H}}{\partial
    v},e^{[-r-ik(r-q)]\tau}\frac{\partial^2\tilde{H}}{\partial v^2}$

    ```


    Substituting these derivatives of $\tilde{U}$ expressed in terms of $\tilde{H}$
    into Equation (4.7)

    and canceling terms produces the PDE for $\tilde{H}$


    ```

    $$\frac{\partial\tilde{H}}{\partial \tau}=-\frac{1}{2}\sigma^2v\frac{\partial^2\tilde{H}}{\partial
    v^2}+[\kappa(\theta-\v)-\lambda v-ik\rho\sigma v}\frac{\partial\tilde{H}}{\partial
    v}-vc\tilde{H}(k,v,\tau)$ (4.9)

    ```'
