  md: "# The Fundamental Transform for Pricing Options\n\nWith the parameter values\
    \ used in Table 3.3.1 of Lewis (2000), namely $\rho = -0.5$, $v_0 = 0.0225$, $\\\
    kappa = 4$, $\theta = 0.09/4$, $\\sigma = 0.1$, as well as $T = 0.25$ and $S =\
    \ K = 100$, we obtain from (3.6) the average variance $\\overline{v} = 0.0225$.\
    \ The Matlab program Lewis\\_Table.m reproduces the entries in Table 3.3.1 on\
    \ page 81 of Lewis (2000), and Figure 3.3.1 on page 80. His figure is reproduced\
    \ in Figure 4.4, with the additional maturity of 18 months.\n\nAs indicated in\
    \ Lewis (2000), for the 3-month maturity, the Series II expansion implied volatility\
    \ (dashed line) is more accurate than the Series I expansion implied volatility\
    \ (dotted line), since it is closer to the implied volatility extracted from the\
    \ exact price (solid line). For the 18-month maturity, however, both series are\
    \ accurate.\n\n# CONCLUSION\n\nIn this chapter, we have presented several powerful\
    \ and novel approaches developed by Alan Lewis (2000, 2001) for pricing options\
    \ under stochastic volatility. The fundamental transform is extremely convenient,\
    \ because once the fundamental transform for a given stochastic volatility model\
    \ is obtained, European option prices under the model are readily obtained via\
    \ their payoff transform. Moreover, in Lewis (2000), the fundamental transform\
    \ is available for a wide range of models, and not restricted to the Heston model.\
    \ We also examine the approach of Lewis (2001) for pricing options using Parseval's\
    \ identity. Finally, we present the volatility of volatility series expansion\
    \ of Lewis (2001), which approximates the Heston (1993) call price with a sum\
    \ of analytic terms. The chief advantage of this expansion is that numerical integration\
    \ is not required, so option prices can be calculated very quickly.\n\nMost models\
    \ encountered in this book, however, require numerical integration. This poses\
    \ challenges along several fronts, among the integration domain $[0, \\infty)$\
    \ which must be reduced to a more manageable domain and possible extreme oscillations\
    \ in the integrand. A desirable numerical integration scheme is one that both\
    \ overcomes these difficulties and requires little computational time. This is\
    \ the subject of the next chapter."
