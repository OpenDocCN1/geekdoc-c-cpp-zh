  md: '# 74 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    invert the Fourier transform to yield c(k) and remove the damping factor to recover
    C(k). The Fourier transform of c(k) is, using Equation (3.41)


    ```

    $$\tilde{c}(v) = \int_{-\infty}^{\infty} e^{ik} c(k) dk = \int_{-\infty}^{\infty}
    e^{ik} C(k) dk \\= e^{-\ r} \int_{-\infty}^{\infty} e^{(a+iv)k} (e^x - e^{-x})
    q(x) dk.\$ (3.42)

    ```


    The area of integration $-\infty < k < \infty$ and $k < x < \infty$ is equivalent
    to $-\infty < x < \infty$ and $-\infty < k < x$, so (3.42) can be written as


    ```

    $$\tilde{c}(v) = e^{-\ r} \int_{-\infty}^{\infty} q(x) \left[ \int_{-\infty}^{\x}
    e^{(a+iv)k} e^{(a+iv)k)} dk \right] dx \\= e^{-\ r} \int_{-\infty}^{\infty} q(x)
    \left[ \frac{e^{(a+iv)k}}{\alpha + iv} - \frac{1}{\alpha + iv} \right]_{k=-\infty}^{x}
    dx \\= e^{-\ r} \int_{-\infty}^{\infty} q(x) \left[ \frac{e^{(a+iv)x}}{\alpha^2
    + \alpha - v^2 + iv(2\alpha+1)} \right] dx \\\frac{e^{-\ r} \varphi(v)(\alpha+1)i}{\alpha^2
    + \alpha - v^2 + iv(2\alpha+1)}.\$ (3.43)

    ```


    The last equality holds


    ```

    $$\varphi(u) = E[e^{iux}] = \int_{-\infty}^{\infty} e^{iux} q(x) dx.\$

    ```


    is the characteristic function of $x = \ln S_T$, which we have defined $f_2(\phi)$
    in previous chapters. The call price is found through the inverse Fourier transform
    of the modified call


    ```

    $C(k) = e^{-uk} c(k) = \frac{1}{2\pi} \int_{-\infty}^{\infty} e^{-ikv} \tilde{c}(v)
    dv.\$ (3.44)

    ```


    The last equality holds, because while the integrand $e^{-ik}\tilde{c}(v)$ is
    a complex number, the call price $C(k)$ in Equation (3.44) is a real number. This
    implies that we can ignore the imaginary part of the integrand, and work only
    with the real part, which is even-valued. Lord and Kohl (2007) point out at least
    three advantages to the representation of the call price in (3.44). First, only
    a single numerical integration scheme is required, instead of two. Second, the
    denominator in the integrand function of the integration variable, $v$, is a quadratic
    and thus decays faster than the integrands in the original Heston formulation,
    in which the denominators are linear functions of the integration variable. This
    implies that the truncation of the integration domain from $(0, \infty)$ to some
    finite range $(0, M)$, where $M < \infty$, is less problematic in (3.44). Finally,
    there is computational accuracy to be gained from'
