    # SIMULATION IN THE DOUBLE HSTON MODEL


    In Chapter 7, we presented a set of discretization and simulation schemes for
    the Heston (1993) model, many of which are designed specifically for the model.
    Gauthier and Possamai (2010) adapt many of these schemes to the double Heston
    model. In this section, we present a few of these simulation schemes. In most
    cases, the generalization of the scheme from the Heston model to the double Heston
    model is straightforward and intuitive. In each scheme, it is possible to apply
    a martingale correction to improve the accuracy of the scheme, but these are not
    covered.


    # Simulation of the Stock Price


    Rather than simulating the log stock price in $S_t$, Gauthier and Possamai (2010)
    suggest simulating the discounted log price $ln(e^{-rt}S_t)$ and applying the
    Predictor-Corrector scheme. This scheme is given in terms of two Brownian motion
    $W_{1,t}$ and $W_{2,t}$ as


    $ln(e^{-(t+dt)}S_{t+dt}) = ln(e^{-rt}S_t)$


    ```

    $+ K_0^1 + K_1^1 V_{1,t} + K_2^1 V_{1,t+dt} + \sqrt{K_3^1(v_{1,t} + v_{1,t+dt})}W_{1,t}
    \quad \quad (12.26)\n+ K_0^2 + K_1^2 V_{2,t} + K_2^2 V_{2,t+dt} + \sqrt{K_3^2(v_{2,t}
    + v_{2,t+dt})}W_{2,t}$

    ```'
