    \ the stock process. The call price is, as in Chapter 1\n\n```\n$C(K) = e^{r^*T}\
    \ \\mathbb{E}^q[S_T>K] - Ke^{-r^*T} \\mathbb{E}^q[1_{S_T>K}] \\n= S_T \\mathbb{E}^q[x>\\\
    ell] - Ke^{-r^*T} \\mathbb{E}^q[1_{x>\\ell}] \\n= S_T \\Pi_1 - Ke^{-r^*T} \\Pi_2\
