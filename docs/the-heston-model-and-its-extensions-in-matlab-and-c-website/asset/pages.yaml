    \nMaturity 348 days\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_161_3.png)\n\n\
    FIGURE 6.1 S&P500 Market and Implied Volatilities Estimated Using MSE\n\ninmissible\
    \ parameter values. The Nelder-Mead algorithm is the method of choice for the\
    \ built-in Matlab function fminsearch Nelder-Mead algorithm is designed to find\
    \ the global minimum of an objective function $f(x) \\in \\mathbb{R}^n \to \\\
    mathbb{R}$. The algorithm requires a set of $n+1$ values, each of which is a vector\
    \ of dimension $n$. At each iteration, the algorithm replaces the vector that\
    \ produces the worst value of $f$ (namely, the largest value) by a vector that\
    \ produces a smaller value of $f$. The Nelder-Mead algorithm is explained in Nelder\
    \ and Mead (1965) and in many other sources, such as Déo, Nunes, and Siarry (2009),\
    \ for example. The algorithm consists of the following steps.\n\nStep 0. Initialization.\
    \ Define the $n+1$ vertices $x_0, \\dots, x_n$ in terms of ranked values of the\
    \ function\n\n$f(x_0) \\leq f(x_1) \\leq \\dots \\leq f(x_{n-1}) \\leq f(x_n)$.\n\
    \nHence, $x_0$ is the best point, since it is the lowest value of the objective\
    \ function, and $x_n$ is the worst. Calculate the mean $\bar{x} = (x_0 + x_1 +\
    \ \\dots + x_{n-1})/n$. Note that $x$ excludes the worst point $x_n$.\n\nStep\
    \ 1. Reflection Rule. Calculate the reflection point $x_r$, as\n\n$x_r = \bar{x}\
    \ - \rho(\bar{x} - x_n)$.\n\nIf $f(x_1) \\leq f(x_s) \\leq f(x_n)$, replace $x_n$\
    \ with the reflection point $x_r$ and proceed to the next iteration in Step 0.\
    \ Otherwise, continue to Step 2."
