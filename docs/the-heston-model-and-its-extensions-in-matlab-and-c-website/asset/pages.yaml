- pgno: 337
  md: 'The Heston Greeks


    331


    we can substitute the Greeks into the PDE and show that it is satisfied. Hence,

    we obtain


    $$\Theta = \frac{1}{2}v_0^2S_0\Gamma + (r-q)S_0\Delta - rU$$


    $$\rho v_0 S_0 \text{Vanna} + \frac{1}{2}\sigma^2 v_0 \text{Volga} + \kappa(\theta
    - v_0)\text{Vega} = 0 \quad$ (11.23)$


    where we have $\lambda(S,v,t)=0$ and $S_0$ is the spot price. The first line in

    (11.23) is the Black-Scholes PDE, and the second line adds correction terms for

    stochastic volatility, as specified in the Heston model. It is easy to verify
    that

    t PDE with Greeks holds for both the Black-Scholes and Heston models, provided

    that vega, vanna, and volga are constructed in terms of variance rather than

    t terms of volatility. This is accomplished with the following snippet of code.

    that makes use of the Hestonreeks.m function, which we introduce later in

    this chapter.


    ```

    %mat

    Price = HestonPriceGaussLaguerre(...);

    Delta = HestonGreeks(..., ''Delta'');

    Gamma = HestonGreeks(..., ''Gamma'');

    Theta = HestonGreeks(..., ''Theta'');

    Vega = HestonGreeks(..., ''Vega'') / (2*sqrt(v0));

    Vanna = HestonGreeks(..., ''Vanna'') / (2*sqrt(v0));

    Volga = HestonGreeks(..., ''Volga'');

    Volga = (1/4)/sqrt(v0) * Vega/2/sqrt(v0)/sqrt(v0);

    Theta = Theta + 0.5*v0^2*Gamma + (r-q)*S0*Delta...;

    % Black Greeks

    Theta = BSGreeks(PutCall,S0,K,r,q,sigma, ''Theta'');

    Gamma = BSGreeks(PutCall,S0,K,r,q,sigma, ''Gamma'');

    Delta = BSGreeks(PutCall,S0,K,r,q,sigma, ''Delta'');

    Price = BSPrice(PutCall,S0,K,r,q,sigma);

    BS = Theta + 0.5*sigma^2*Gamma + (r-q)*S0*Delta...

    ```


    In the above snippet, we invert Equations (11.10), (11.16), and (11.18)

    to express the derivatives in terms of $v$ rather than substituting these

    dererivatives into the Heston PDE. See Zhu (2010) for a further discussion of

    the Heston PDE with Greeks.


    As mentioned in Chapter 2, the correlation $\rho$ and the volatility of variance
    $\sigma$

    control the slope and curvature, respectively, of the implied volatility out

    from Heston model prices, where $\kappa$ controls the speed of reversion to the
    mean level

    $\theta$ of volatility. When $\rho<0$, the slope of the implied curvature is negative,
    and

    when $\rho>0$, it is positive. The curvature increases as $\sigma$ increases.
    The sensitivity of

    the call price to this is


    $$\frac{\partial C}{\partial \xi} = Se^{-q\xi}\frac{\partial P_1}{\partial \xi}
    - Ke^{-r\xi}\frac{\partial P_2}{\partial \xi} \quad$ (11.24)$


    ![](img/bc3df3b6c26c2272307f56b6cf75ef87_337_0.png)'
