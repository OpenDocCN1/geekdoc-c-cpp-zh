  md: '# American Options


    The PQ.m function is used in the GeneratePQ.m Matlab file, which generates symbolic
    representations of the polynomials $p_i^n$ and $q_i^n$ by solving Equation (8.50),
    and representations of the coefficients $C_n$ by using (8.51). The polynomials
    for $n=1$ are generated by calling the PQ.m function.


    ```

    n = 1;

    [p0n q0n ... dq0n_1 dqln_1] = PQ(n,N,p0,q0);

    p01 = p0n;

    p11 = p0n;

    q01 = q0n;

    q11 = q0n;

    ```


    This generates $p_i^n = \theta, q_i^n = 1$ and $p_i^n = q_i^n = 0$. The code becomes
    complicated for higher powers. For $n=2$, we obtain $p_i^n = \theta^2+1$ directly
    from the PQ.m function, and from Equation (8.46), we know that $q_i^2=0$. To obtain
    the unknown coefficient $\pi_{21}$, we create a symbolic object for the first
    PDE in (8.50) and solve the PDE using the Matlab built-function solve. This produces
    $\pi_{21} = C_1(\sigma^1-2_\mu)/(2\sigma)$, where $\mu=r-q$. We define $p_2^n
    = \pi_{21}$.


    ```

    n = 2;

    [p0n q0n ... dq0n_1 dqln_1] = PQ(n,N,p0,q0);

    p02 = p0n;

    q02 = q0n;

    % Solve the first PDE for p12

    syms sigma mu Cl_C0 r p12 sigma_

    sigma_ = (sigma^2-2*mu)/sigma;

    PDE1 = dp2ln + theta*dpn_1

    n*plan + sigma*C1*dp0n_1 + sigma*dp1n_1 ...;

    pi21 = solve(PDE1,p21);

    p12 = p21;

    % Set q12 to known value of 0

    q12 = 0;

    ```


    For higher powers of $n$, the code involves cutting and pasting from the Matlab
    output window. The polynomials $p_i^n$ and $q_i^n$ are generated by the PQ.m function,
    as shown below for $n=5$.


    ```

    n = 5;

    [p0n q0n ... dq0n_1 dqln_1] = PQ(n,N,p0,q0);

    p05 = p0n;

    q05 = q0n;

    ```'
