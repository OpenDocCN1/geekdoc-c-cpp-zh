  md: "# Methods for Finite Differences\n\n```\nif the=0\n    U = B*u; % Explicit\
    \ Method\nelsif the=1\n    U = invA*u; % Implicit Method\nelse\n    U = A*B*u;\
    \ % Weighted Method\nend\n```\n\nU = reshape(U,NS,NV)\nWPrice = interp2(V,S,U,V0,S0);\n\
    \nTo illustrate the weighted method we use the parameter values defined in Case\
    \ 1 of InT Hout and Foulon (2010), κ = 1.5, θ = 0.04, σ = 0.3, ρ = -0.9, r = 0.02,\
    \ λ = 0.05, and a strike price of K = 100. In addition, we use v0 = 0.05, and\
    \ a maturity of τ = 0.15 years. We wish to obtain the price at the spot S = 101.52\
    \ when the volatility v = 0.05412. following Matlab code builds a uniform grid\
    \ of size 40 × 40 and uses 20 time steps. It obtains prices from the explicit,\
    \ implicit, and Crank-Nicolson schemes, all from the same WeightedMethod.m function,\
    \ but with different settings for the parameter θ.\n\n```\nnS = 39; % Stock price\n\
    V = 39; % Volatility\nnT = 19; % Maturity\n[derS derV1 derV2 derVV derSV] = BuildDerivatives(S,V,T);\n\
    L = (r-q).*derS + kappa.*theta.derV1 - kappa.*derV2 + ...\nI = q*(NS*NV);\nS0\
    \ = 101.52;\nV0 = 0.05412;\nthet = 0;\nA = (I - .thet.*dt.*L);\nB = (I + (1-.thet).*dt.*L);\n\
    inVA = inv(A);\nPrice = WeightedMethod(the,S0,V0,K,S,V,T,A,invA,B);\n```\n\nIn\
    \ this example, the exact price using the Heston closed-form solution is 4.1086.\
    \ The explicit scheme price is 4.1679, as expected, is a poor approximation because\
    \ of the small number of steps. The implicit and Crank-Nicolson schemes produce\
    \ 4.1023 and 4.1350, respectively, which are both more accurate.\n\nThe Matlab\
    \ function BuildDerivativesNonUniform.m is a version of the function BuildDerivatives.m\
    \ that accepts a non-uniform grid and returns the sub-matrices of L. For each\
    \ of the sub-matrices, the ds and dv are specified in accordance with the values\
    \ of (S,v), and must respect the non-adjacent positions of successive values in\
    \ the vector that stores the volatilities."
