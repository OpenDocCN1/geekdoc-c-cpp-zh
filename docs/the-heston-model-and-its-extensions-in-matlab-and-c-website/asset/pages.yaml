    | Vanna | -0.1257 | | -0.1257 | 0.0516 | -0.1257 |\n| Volga | 15.5081 | | 15.4273\
    \ | 15.7285 | 15.4054 |\n\n# GREEKS USING FFT AND FRFT\n\nWe saw in Chapter 5\
    \ that the fast Fourier transform (FFT) and fractional Fourier transform (FRFT)\
    \ are both able to produce prices very quickly and for a wide range of strike\
    \ samples. It is straightforward to adapt these methods to produce the Greeks\
    \ in the same manner. Recall from Chapter 5 to implement the call price, we construct\
    \ the integration grid $\\{v_j\\}_{j=1}^N$ and the log-strike $\\{k_j\\}_{j=1}^N$,\
    \ and calculate the points $x_j = \\exp[(b - \\ln S_0)\\psi(v_j)]$ for $j = 1,\
    \ \\dots, N$. We obtain $\\hat{x}_u = C(k_u)$, the call price evaluated at the\
    \ log-strike point $k_u$, for the sum\n\n```\n$\\hat{x}_u = \\frac{e^{-u a k_u}}{\\\
    pi} \\sum_{j=1}^N \\left[ e^{-\\frac{i}{2}(j-1)(u-1)} X_j \\right] \\text{ for\
    \ } u = 1, \\dots, N. \\quad (11.42)$\n```\n\nTo obtain a set of Greeks with the\
    \ FFT, in $x$, we simply replace the term\n\n```\n$\\psi(v_j) = \\frac{e^{-v_j^2}\
    \ f_2(v_j) - $(\\alpha + i)}{\\alpha^2 + v_j^2(2\\alpha + 1)} \\quad (11.43)$\n\
    ```\n\nwith a modified version that uses the derivative of $f_2$, of $f_2$, as\
    \ such that for theta in Equation (11.38), for example. We use this modification\
    \ to obtain the Greeks from the fractional fast Fourier transform.\n\nImplementing\
    \ the Greeks with the FFT requires a slight modification of the code presented\
    \ in Chapter 5. The Matlab function HestonCallFFTGreek.m is nearly identical to\
    \ the HestonCallFFT.m function from that chapter, except that it uses the Matlab\
    \ function HestonCFGreeks.m for the characteristic function. This function returns\
    \ either the characteristic function or its derivatives through an extra argument.\n\
    \n```\nfunction [CallFFT lambda inc] = HestonCallFFTGreek(..., Greek)\n  if fast=1\n\
    \    % Implement the FFT - fast algorithm\n    U = [0:N-1];\n    J = [0:N-1];\n\
    ```"
