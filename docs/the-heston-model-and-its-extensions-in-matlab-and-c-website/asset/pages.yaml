- pgno: 54
  md: 'In Figure 2.9, implied volatility is represented by the transparent mesh, and
    local volatility is represented by the solid surface underneath the mesh. The
    figure reflects the observation of Derman et al. (1995) that local volatility
    tends to show more variability than implied volatility. Local volatility is covered
    in the next section.


    # VARIANCE IN THE HESTON MODEL


    # Variance Swap


    Recall from Chapter 1 that the volatility of the Heston model is driven by the
    CIR process


    ```

    $dv_t = \kappa(\theta - v_t)dt + \alpha\sqrt{v_t}dW_{2,t}$

    ```


    and consequently, that the expected value of $v_t$, conditional on $v_s$ ($s <
    t$) is


    ```

    $E[v_t|v_s] = v_s e^{-\kappa(t-s)} + \theta(1 - e^{-\kappa(t-s)}) = (v_s - \theta)e^{-\kappa(t-s)}
    + \theta., \quad (2.19)$

    ```


    In the following section, we will use of $E[v_t|v_s]$ with $s = 0$. It is useful
    to denote this as $\hat{v}_t$


    ```

    $\hat{v}_t = E[v_t|v_s] = (v_0 - \theta)e^{-\kappa t}.$

    ```


    It is also useful to define the (integrated) variance $\hat{w}_t$, as


    ```

    $\hat{w}_t = \int_0^t \hat{v}_s ds = \int_0^t (v_0 - \theta)\frac{1 - e^{-\kappa
    s}}{\kappa} + \theta t., \quad (2.21)$

    ```


    As explained by Gatheral (2006), a variance swap requires an estimate of the future
    variance over the $(0,T)$ time period. This can be obtained as the conditional
    expectation of the variance. A fair estimate of the total variance is therefore


    ```

    $E[\int_0^T v_t dt|v_0] = \int_0^T E[v_t|v_0] dt = \int_0^T [\theta + (v_0 - \theta)e^{-\kappa
    t}] dt \n (v_0 - \theta)\frac{1 - e^{-\kappa T}}{\kappa} + \theta T, \quad (2.22)$

    ```


    which is simply $\hat{w}_T$. Since represents the total variance over $(0,T)$,
    it must be scaled by $T$ in order to represent a fair estimate of annual variance
    (assuming that $T$ is expressed in years.) Hence, the strike variance $K_{var}^2$
    for a variance swap is obtained by dividing this last expression by $T$


    ```

    $K_{var}^2 = \frac{\hat{w}_T}{T} = (v_0 - \theta)\frac{1 - e^{-\kappa T}}{\kappa}
    + \theta., \quad (2.23)$

    ```


    This is the expression on page 138 of Gatheral (2006).'
  merge: -1
  img_proc: true
