  md: "# Simulation in the Heston Model\n\n# 185\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_194_0.png)\n\
    \n**FIGURE 7.1** Stock Price and Variance under Negative Correlation\n\ndriving\
    \ the stock price and the variance. The following figures each contain a single\
    \ simulated stock price path and variance over 1 year (250 days), starting with\
    \ initial values $(S_0, v_0) = (100, 0.05)$ and using typical values of the parameters.\
    \ Figure 7.1 uses $\rho = -0.9$ and clearly illustrates the negative relationship\
    \ between price and variance. Indeed, increases in variance are associated with\
    \ a decreasing stock price, while the opposite is true for increases in variance.\n\
    \nFigure 7.2, on the other hand, uses $\rho = +0.9$ and shows the opposite effect,\
    \ increases in variance are associated with increasing prices, and vice-versa.\
    \ Simulation can also be used to illustrate the effect of the Heston parameters\
    \ on the stock price and the variance.\n\n# IMPLICIT MILSTEIN SCHEME\n\nRecall\
    \ that, in Equation (7.19) for Milstein discretization of $dX$, the coefficients\
    \ $\\mu_t = \\mu(X_t)$ and $\\sigma_t = \\sigma(X_t)$ are the drift and volatility\
    \ of the process for $X_t$ and are functions of $X_t$ itself. In the Milstein\
    \ drift-implicit scheme, or simply implicit scheme, the drift coefficient $\\\
    mu_t$ is specified to be a function of $X_{t+dt}$. Hence, under this scheme, the\
    \ drift coefficient is known only implicitly, and not explicitly, as is the case\
    \ when it depends on $X_t$. Under the Itô version of this equation (7.19) becomes\n\
    \n```\n$X_{t+dt} = X_t + \\mu_{t+dt}dt + \\sigma_t\\sqrt{dt}dZ + \\frac{1}{2}\\\
    sigma_t'\\sigma_dt(Z^2 - 1) \\quad (7.24)$\n```"
