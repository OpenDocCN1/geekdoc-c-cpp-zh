- pgno: 35
  md: '# CONCLUSION


    In this chapter, we have presented the original derivation of the Heston (1993)
    model, including the PDEs from the model, the characteristic functions, and the
    European call and put prices. We have also shown how the Black-Scholes model arises
    as a special case of the Heston model.


    The Heston model has become the most popular stochastic volatility model for pricing
    equity options. This is in part due to the fact that the call price in the model
    is available in closed form. Some authors refer to the call price as being in
    "semi-closed" form because of the numerical integration required to obtain $P_1$
    and $P_2$. But the Black-Scholes model also requires numerical integration, to
    obtain $\Phi(d_1)$ and $\Phi(d_2)$. In this sense the Heston model produces call
    prices that are no less than those produced by the Black-Scholes model. The difference
    is that programming languages often have built-in routines for calculating the
    standard normal cumulative distribution function, $\Phi(\cdot)$ (usually by employing
    a polynomial approximation), whereas the Heston probabilities are not built-in
    and must be obtained using numerical integration. In the next chapter, we investigate
    some of the problems that can arise in numerical integration when the integrand


    ```

    Re \left[ \frac{e^{-\phi \ln K} f_t(\phi; x, v)}{i\phi} \right]$

    ```


    is not well-behaved. We encountered an example of such an integrand in Figure
    1.1.'
