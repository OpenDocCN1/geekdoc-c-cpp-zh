    \ B in Figure 4.3. The residue theorem, $C(S_0)$ will be equal to the integral\
    \ evaluated along the new contour, $2\\pi i$ times the residue at $i$, which has\
    \ been excluded. Equation, (4.31)\n\n```\n$C(S_0) = -\\frac{Ke^{-rT}}{2\\pi} \\\
    int_{iv_{-\\infty}}^{iv_{-\\infty}+2\\pi i} e^{-ik}\\varphi(-k) \\frac{1}{k^2-ik}\
    \ dk - 2\\pi i \\left(\\frac{S_0e^{-qT}}{2\\pi}\\right)$$\\n$$= S_0e^{-qT}-\\\
    frac{Ke^{-rT}}{2\\pi} \\int_{iv_{-\\infty}}^{iv_{-\\infty}+2\\pi i} e^{-ik}\\\
    varphi(-k) \\frac{1}{k^2-ik} dk$\\n$$(4.32)\n```\n\n$v_2\\in(0,1)$. The second\
    \ line of (4.32) is Equation (3.10) of Lewis (2001)."
