  md: '(6.17). We continue until time T, at which we have L_T(v_T) or l(v_T), to which
    we apply an optimization routine to find the maximum. The initial value suggested
    by Atiya and Wall (2009) is L_0(v_0) = e^{-v_0}, where v_0 is the initial variance
    parameter from the Heston model.


    The likelihood function is implemented using the Matlab function LikelihoodAW.
    The function returns the negative of the likelihood or log-likelihood, since fmincon
    is designed for minimization.


    ```

    function [y v] = LikelihoodAW(param,x,r,q,dt,method)

    alpha = kappa*theta;

    beta = kappa;

    v(1) = v0;

    if method==1

    L(1) = exp(-v(1));           % Construct Likelihood

    elif method==2

    L(1) = -v(1);                % Construct log-likelihood

    end

    % Construct the likelihood for time t = 1 through t = T

    for t=1:T-1

    dx = x(t+1) - x(t);

    % Equations (31), (32), and (30)

    B = -alpha*dt + rho*sigma*(dx-mu*dt);

    C = alpha^2*dt + 2*rho*sigma*alpha*dt*(dx-mu*dt) + ...;

    % (30) to update the variance

    if C > 0

    v(t+1) = sqrt(B^2 - C) - B;

    else

    % If v(t-1) is using inaccurate Equation (33)

    bt = (v(t-1)-alpha*dt)^2 - 2*rho*sigma* ...;

    if bt > 0

    v(t+1) = sqrt(bt/a);

    else

    end

    % Equations (15) and (16)

    bt = (v(t+1)-alpha*dt)^2 - 2*rho*sigma* ...;

    x1 = (1*(beta+rho*sigma*dt))*(v(t+1)-alpha*dt); ...;

    x2 = -2*sqrt(a*bt);

    % Combined exponent for Equation (34)

    E = exp(x1 + x2) / D;

    if method==1

    % Equation (34) for the likelihood L(t+1)

    L(t+1) = (a*bt)^(-1/4) * E * L(t);

    elif method==2

    % Alternately, use the log-likelihood

    L(t+1) = -1/4*log(a*bt) + x1 + x2 -log(D) + L(t);

    end

    end

    % Negative likelihood is the last term.

    y = -real(L(T));

    ```'
