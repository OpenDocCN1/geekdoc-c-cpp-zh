    The OTM option price is then obtained by Fourier inversion, analogous to Equation
    (3.56)


    ```

    $z(k) = \frac{1}{\sinh(\alpha k)} y(k) = \frac{1}{2\pi\sin(\alpha k)} \int_{-\infty}^{\infty}
    e^{-ikv} \tilde{y}(v) dv \nn = \frac{1}{2\pi\sin(\alpha k)} \int_{-\infty}^{\infty}
    e^{-ikv} \tilde{y}(v) dv. \quad (3.58)$

