    partial\\hat{P}_j}{\\partial\\tau} = 0. \\quad (3.21)$\n```\n\nRearranging, we\
    \ obtain\n\n```\n$v\\left[ \\alpha_i\\frac{\\partial\\hat{P}_i}{\\partial\\v}\
    \ - \\beta_i\\frac{\\partial\\hat{P}_i}{\\partial\\tau} + \\gamma\\frac{\\partial^2\\\
    hat{P}_i}{\\partial\\v^2} \\right] + a\\frac{\\partial\\hat{P}_i}{\\partial\\\
    v} - \\frac{\\partial\\hat{P}_i}{\\partial\\tau} = 0. \\quad (3.22)$\n```\n\n\
    where\n\n```\n$\\alpha_i = ik - \\frac{k^2}{2}, \\quad \\beta_i = b_i - \\rho\\\
    sigma ik, \\quad \\gamma = \\frac{\\sigma^2}{2}.$\n```\n\nNote that these coefficients\
    \ are identical to the coefficients $P, Q,$ and $R$ for the Riccati equation in\
    \ Chapter 1, except that $k$ replaces $\\phi$. The ansatz is that $\\hat{P}_i$\
    \ are of the form\n\n```\n$$\\hat{P}_i(k,v,\\tau) = \\exp[C_i(k,\\tau)\\theta\
    \ + D_i(k,\\tau)v]\\hat{P}_i(k,v,0)$$\\n= \\frac{1}{ik}[C_i(k,\\tau)\\theta +\
    \ D_i(k,\\tau)v]. \\quad (3.23)$\n```\n\nTaking the following derivatives of (3.23)\n\
    \n```\n$$\\frac{\\partial\\hat{P}_i}{\\partial\\tau} = [\\frac{\\partialC_i}{\\\
    partial\\tau}\\theta + \\frac{\\partialD_i}{\\partial\\tau}v]\\hat{P}_i, \\frac{\\\
    partial\\hat{P}_i}{\\partial\\v} = D_i\\hat{P}_i, \\frac{\\partial^2\\hat{P}_i}{\\\
    partial\\v^2} = D_i^2\\hat{P}_i.$\n```\n\nSubstituting these derivatives back\
    \ into the PDE in (3.22) and dropping the $\\hat{P}_i$ terms\n\n```\n$v(\\alpha_i\
    \ - \\beta_iD_i + \\gamma D_i^2) + aD_i - [\\frac{\\partialC_i}{\\partial\\tau}\\\
    theta + \\frac{\\partialD_i}{\\partial\\tau}v] = 0. \\quad (3.24)$\n```\n\nThis\
    \ implies that these two equations must be satisfied, which appear as Equation\
    \ (2.11) in Gather (2006)\n\n```\n$$\\frac{\\partialC_i}{\\partial\\tau} = \\\
    kappa D_i$\\n$\\frac{\\partialD_i}{\\partial\\tau} = \\alpha_i - \\beta_iD_i +\
    \ \\gamma D_i^2. \\quad (3.25)$\n```\n\nThe first equation holds since $\\alpha\
    \ = \\kappa$ so that $\theta$ cancels out. The second equation is identical to\
    \ the Riccati equation in Chapter 1. The two roots $r_l^i$ and $r_r^i$ of this\
    \ quadratic equation are\n\n```\n$$\\r_l^i = \\frac{\\beta_i \\pm \\sqrt{\\beta_i^2\
    \ - 4\\alpha_i\\gamma}}{2\\alpha_i} = \\frac{b_i - \\rho\\sigma ik \\pm d}{\\\
    sigma^2}$\n```"
