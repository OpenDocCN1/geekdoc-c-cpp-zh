  md: '# American Options


    where


    ```

    $e_u = Y_{t+dt}^u - Y_t - \mu_y(t)dt = (I+1) \cdot k\sigma_y(0)\sqrt{dt} - \mu_y(t)dt$,$

    e_m = Y_{t+dt}^m - Y_t - \mu_y(t)dt = I \cdot k\sigma_y(0)\sqrt{dt} - \mu_y(t)dt$,$

    e_d = Y_{t+dt}^d - Y_t - \mu_y(t)dt = (I-1) \cdot k\sigma_y(0)\sqrt{dt} - \mu_y(t)dt$.  (8.31)

    ```


    When the number of steps is large, $I$ approaches zero and the expressions in
    simpler form in Equation (18) of Beliaeva and Nawalka (2010). The tree for the
    stock price $S_t$ is obtained by applying the inverse transformation of (18) at
    every node of the tree Note that since $Y_i$ depends on $k_i$, and since $k_i$
    depends on $v_i$, the tree for the variance must be constructed before the stock
    price.


    # Combining the Trinomial Trees


    The final step in approach of Beliaeva and Nawalka (2010) is to mesh the trinomial
    trees for $v_t$ and $S$ into a single tree. At zero there is a single node for
    $(S_0, v_0)$. At each subsequent node $(S_t, v_t)$ of the tree $S$ and $v_t$ each
    evolve to one of three possible values (up, middle, or down). Hence, each node
    branches into $3 \times 3 = 9$ new nodes. These nodes recombine however the actual
    number of nodes does not increase by a factor of nine at each time step. Rather,
    the number of nodes depends on the values of $k_i$ at the nodes; higher values
    of $k_i$ require more nodes. The number of nodes can increase very rapidly but
    the fact that the tree for $Y_t$ recombines mitigates this substantially. In Exhibit
    11 of Beliaeva and Nawalka (2010), for example, there are 35 nodes at the end
    time step.


    Each node $(S_t, v_t)$ branches out to nine nodes. The trees for $Y_t$ and $v_t$
    are uncorrelated the joint probabilities of these branches are the product of
    the three marginal probabilities from each tree, defined in Equations (8.23) and
    (8.30).


    ```

    $p_{uu} = p_S^u \times p_v^u$, $\quad p_{um} = p_S^u \times p_v^m$, $\quad p_{du}
    = p_S^u \times p_v^d$,$

    $p_{um} = p_S^m \times p_v^u$, $\quad p_{mm} = p_S^m \times p_v^m$, $\quad p_{dm}
    = p_S^m \times p_v^d$,$

    $p_{ud} = p_S^d \times p_v^u$, $\quad p_{md} = p_S^d \times p_v^m$, $\quad p_{dd}
    = p_S^d \times p_v^d$. (8.32)

    ```


    With the tree for the stock price $S_t$ and the joint probabilities, pricing American
    options is done exactly as in an ordinary trinomial tree, by working backward
    in time from the maturity where the payoff is known, and at each node comparing
    the value of the American option with the value of immediate exercise. Hence,
    the price of the American option at time t is


    ```

    $U(S_t, v_t) = e^{-r dt} \max (K - S_t)$,$

    $p_{uu} U(S_{t+dt}^u v_{t+dt}^u) + p_{um} U(S_{t+dt}^m v_{t+dt}^m) + \dots + p_{dd}
    U(S_{t+dt}^d v_{t+dt}^d)$. (8.33)

    ```'
