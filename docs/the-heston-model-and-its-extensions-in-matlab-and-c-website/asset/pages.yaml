    # Implied Volatility


    We noted earlier in this chapter that option prices obtained with the Heston model
    have implied volatility that is built in, in the sense that implied volatilities
    extracted from those prices will exhibit an implied volatility. Moreover, the
    parameters $\rho$ and $\sigma$ extracted from them have an effect on the steepness
    and smoothness of the model. In practice, volatilities extracted from Heston model
    sometimes show a poor fit to match implied volatilities for short maturities.
    For longer maturities, the fit is better. We illustrate this by using putting
    options on the Dow Jones Industrial Average ETF (ticker DIA) with four maturities
    (37, 72, 135, and 226 days). The closing price for DIA was \$129.14. We outlined
    the parameter estimates $\kappa = 0.8799, \sigma = 3.6706, v_{0} = 0.0435,$ and
    $\rho = -0.4171$. Parameter estimation methods for the Heston model are well dealt
    in Chapter 6. For'
