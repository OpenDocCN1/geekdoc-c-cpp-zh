    # CARR AND MADAN (1999) REPRESENTATION


    Carr and Madan (1999) present a derivation of the call price based on the Fourier
    transform. It offers advantages of reduced computation time and it decays faster
    than the original Heston (1993) formulation. Their method requires a modification
    of the call price that incorporates a damping factor. The Fourier transform of
    the modified call price is obtained, and inverted. The call price can be recovered
    by removing the damping factor from the modified call price.


    Define $k = \ln K + x = \ln S_T$, and let $q(x)$ denote the density function for
    $S_T$. We saw in Chapter 1 that the call price can be written


    ```

    $C(k) = e^{-rt}E[(S_T - K)^+\n$$= e^{-rt}\int_{-\infty}^{\infty}(e^x - e^k)q(x)dx

    $$= e^{-rt}\mathbb{Q}(S_T > e^k) - Ke^{-rt}\mathbb{Q}(S_T > e^k)$

    ```


    In (3.41), $\mathbb{Q}^+(S_T > e^k)$ and $\mathbb{Q}(S_T > e^k)$ are found using
    an inverted characteristic function. This inversion requires that the characteristic
    function be integrable.


    ```

    $$\lim_{k\to-\infty}C(k) = \lim_{k\to-\infty}\int_{-\infty}^{\infty}(e^x - e^k)q(x)dx

    $$= e^{-rt}E[e^x] - 0

    $$= S_t$

    ```


    which is not zero, $C(k)$ is not integrable $L^1$, and its Fourier transform will
    not exist. Carr and Madan (1999) rectify this by defining the modified call price
    $c(k)$ as


    ```

    $c(k) = e^{rt}C(k)$

    ```


    which includes the damping factor $e^{rt}$ on $c(k)$.


    ```

    $$\lim_{k\to-\infty}c(k) = \lim_{k\to-\infty}\int_{-\infty}^{\infty}(e^{ok+x}-e^{(a+1)k})q(x)dx

    $$= \lim_{k\to-\infty}\int_{-\infty}^{\infty}e^{ok+x}q(x)dx - \lim_{k\to-\infty}\int_{-\infty}^{\infty}e^{-rt+(a+1)k}q(x)dx

    $$= e^{-rt}[0]-0$

    ```


    which is zero, $c(k)$ is integrable $L^1$ and the Fourier transform for $c(k)$
    can be found. The idea of Carr and Madan (1999) is to first find the Fourier transform
    $\tilde{c}(v)$ of $c(k)$,'
