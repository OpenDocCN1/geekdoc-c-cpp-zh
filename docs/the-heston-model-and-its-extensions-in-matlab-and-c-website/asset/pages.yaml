- pgno: 225
  md: "# BELIAEVA-NAWALKHA BIVARIATE TREE\n\nBeliaeva and Nawalkha (2010) have developed\
    \ a path-independent two-dimensional tree for the Heston model. In their approach,\
    \ separate trees for the stock price and the variance are constructed independently\
    \ of one another, and then recombined. This requires a transformation $Y_t$ of\
    \ $S_t$, that renders $Y_t$ and $v_t$ independent. Recall that the Heston model\
    \ is defined by the bivariate system of stochastic differential equations (SDEs)\n\
    \n```\n$dS_t = rS_tdt + \\sqrt{v_t}S_dW_{t,1}$,$\\dv_t = \\kappa(\\theta - v_t)dt\
    \ + \\sigma\\sqrt{v_t}dW_{t,2}.$ (8.12)\n```\n\n$E^Q[dW_{t,1}dW_{t,2}] = \\rho$\
    \ is the correlation between the SDEs. The transformation of $S_t$ is defined\
    \ by\n\n```\n$Y_t = \\ln S_t - \\frac{\\rho}{\\sigma}v_t - h_t$ (8.13)\n```\n\n\
    where\n\n```\n$h_t = (r - \\frac{\\rho\\theta}{\\sigma})t.$$ (8.14)\n```\n\nApplying\
    \ Ito’s lemma produces the SDE for $Y_t$\n\n```\n$dY_t = \\mu_y(t)dt + \\sigma_y(t)dW_{t,1}^*$\
    \ (8.15)\n```\n\nwhere the drift and volatility are given\n\n```\n$\\mu_y(t) =\
    \ (\\frac{\\rho}{\\sigma} - \\frac{1}{2})v_t$, $\\sigma_y(t) = \\sqrt{1-\\\rho^2}\\\
    sqrt{v_t}.$ (8.16)\n```\n\nThe stochastic term of the SDE in (8.15) is\n\n```\n\
    $dW_{t,1}^* = \\frac{dW_{t,1}-dW_{t,2}}{\\sqrt{1-\\rho^2}}$ (8.17)\n```\n\nSince\
    \ $E^Q[dW_{t,1}dW_{t,2}] = 0$ the bivariate process $(Y_t, v_t)$ is uncorrelated.\
    \ This implies that the probabilities for $Y_t$ and $v_t$ each can be approximated\
    \ with trinomial trees that are constructed independently of one another. The\
    \ joint-probabilities in the two-dimensional tree for $(Y_t, v_t)$ are the product\
    \ of the marginal probabilities for $Y_t$ and $v_t$.\n\nGiven a value $Y_t^*$,\
    \ the stock price can be recovered by inverting (8.13)\n\n```\n$S_t = \\exp(Y_t\
    \ + \\frac{2}{\\sigma}v_t + h_t).$ (8.18)\n```"
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 218 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    Beliaeva and Nawalkha (2010) build a trinomial tree for the transformed variance
    $x_t$, defined as


    ```

    $x_t = \frac{2\sqrt{v_t}}{\sigma} (8.19)$

    ```


    They recover the variance $v_t$ through the inverse transformation


    ```

    $v_t = \frac{1}{4}x_t^2\sigma^2. (8.20)$

    ```


    A trinomial tree for the transformed variance $x_t$ is constructed first, and
    transformed into a tree for the variances $v_t$ through (8.20). Next, for the
    tree for the transformed stock price $Y_t$ is constructed, and transformed into
    a tree for the stock price $S_t$ through (8.18). Finally, the trees are combined
    to form a bariate tree on which American options can be priced. In the following
    sections we explain how this is done.


    # Trinomial Tree for the Variance


    By Ito''s lemma the transformed variance $x_t$, follows an SDE with drift


    ```

    $$\mu(x_t, t) = \frac{1}{2}(\frac{2\kappa\theta}{\sigma^2} - \frac{\kappa x_t^2}{2}).
    (8.21)$

    ```


    The time-zero of the trinomial tree for $x_t$ is $x_0$, obtained by substituting
    the initial variance parameter $v_0$ into Equation (8.19). At time $t > 0$, given
    that the process is at $x_t$, there are two sets of moves, depending on whether
    $x_t > 0$ or $x_t = 0$.


    Case 1. If $x_t > 0$, the upper, middle, and down moves at time $t+dt$ are


    ```

    $x_{t+dt}^ = x_t + b(j+1)\sqrt{dt},\nx_{t+dt}^m = x_t + bj\sqrt{dt},\nx_{t+dt}^-
    = x_t + b(j-1)\sqrt{dt} (8.22)$

    ```


    where $j$ and $b$ are defined in Equations (8.25) and (8.26) Later. The probability
    of each move is


    ```

    $P_v^u = \frac{1}{2b^2} - \frac{j}{2} + \frac{1}{2b}\mu(x_t, t)\sqrt{dt},\nP_v^m
    = 1 - \frac{1}{b^2},\nP_v^d = \frac{1}{2b^2} + \frac{j}{2b}\mu(x_t, t)\sqrt{dt}.
    (8.23)$

    ```'
