    \ terms drops out, the generator in (12.8) reduces to that of the univariate Heston\
    \ model presented in Chapter 1.\nThe double Heston system of equations in $(x,\
    \ v_1, v_2)$ can be written in affine form\n\n```\n$\\mu(\\mathbf{x}) = \\mathbf{K}_0\
    \ + \\mathbf{K}_1\\mathbf{x} + \\mathbf{K}_2\\nu_1 + \\mathbf{K}_1\\nu_2$\n\\\
    sigma(\\mathbf{x})\\sigma(\\mathbf{x})^T = \\mathbf{H}_0 + \\mathbf{H}_1\\mathbf{x}\
    \ + \\mathbf{H}_2\\nu_1 + \\mathbf{H}_1\\nu_2$\n```\n\nwith\n\n```\n$\\mathbf{K}_0\
    \ = \\begin{pmatrix} \\frac{\\tau-q}{\\kappa_{\theta_1}} \\ \\kappa_{\theta_2}\
    \ \\end{pmatrix}, \\mathbf{K}_1 = \\begin{pmatrix} 0 \\ 0 \\ 0 \\end{pmatrix},\
    \ \\mathbf{K}_2 = \\begin{pmatrix} -\\frac{1}{2} \\ -\\kappa_{v_1} \\ 0 \\end{pmatrix},\
    \ \\mathbf{K}_1 = \\begin{pmatrix} \\frac{1}{2} \\ 0 \\ -\\kappa_{v_2} \\end{pmatrix}$\n\
    ```\n\nand\n\n```\n$\\mathbf{H}_0 = \\mathbf{H}_1 = \\begin{pmatrix} 0 & 0 & 0\
    \ \\ 0 & 0 & 0 \\ 0 & 0 & 0 \\end{pmatrix}, \\mathbf{H}_2 = \\begin{pmatrix} 1\
    \ & \\sigma_{\rho_1} & 0 \\ \\sigma_{\rho_1} & \\sigma_{v_1}^2 & 0 \\ 0 & 0 &\
    \ 0 \\end{pmatrix}, \\mathbf{H}_3 = \\begin{pmatrix} 1 & 0 & \\sigma_{\rho_2}\
    \ \\ 0 & 0 & 0 \\ \\sigma_{\rho_2} & 0 & \\sigma_{v_2}^2 \\end{pmatrix}$\n```\n\
    \nWe can use the result of Duffie et al. (2000) that the characteristic function\
