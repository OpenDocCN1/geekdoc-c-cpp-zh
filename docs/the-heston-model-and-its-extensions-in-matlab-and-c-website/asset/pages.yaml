  md: "# Derivations from the Fourier Transform\n\nwhich is a second-order polynomial\
    \ in $\\phi$. For example, the settings in Lord and Kahl (2007), namely $S=1,\
    \ \\tau=0, K=1.2, \\rho=-0.7, v_0=0.1, \\kappa=\\sigma=1$ and $\tau=1$ produces\
    \ $(y, y_{\tau})=(-0.3852, 5.0910)$. By repeated application of a nonlinear search\
    \ algorithm, and visual inspection, we find the function in (3.45) to have the\
    \ negative solutions $-0.3852, -2.3068, -9.4823$, etc., and the positive solutions\
    \ $5.0910, 10.0600, 18.2763$, etc. Hence, we find $A_{\\chi}=(-2.3068, 10.0600)$,\
    \ since the lower limit of $A_{\\chi}$ should be less than $y_{\tau}=-0.3852$,\
    \ while the upper limit of $A_{\\chi}$ should be greater than $y_{\tau}=5.0910$.\
    \ The range of admissible values for $\\alpha$ is, therefore, $(\\alpha_{min},\
    \ \\alpha_{max})=(-3.3068, 9.0600)$.\n\n# Optimal Damping Factor\n\nWhile $(\\\
    alpha_{min}, \\alpha_{max})$ forms a range of admissible values for the damping\
    \ factor $\\alpha$, it does not indicate which value of $\\alpha$ in the region\
    \ is optimal, in the sense that an optimal value produces an integrand in (3.44)\
    \ that oscillates as little as possible. Recall that the Carr and Madan (1999)\
    \ representation of the call price is\n\n```\n$C(k) = \\int_{0}^{\\infty} e^{-\\\
    alpha k} \\psi(v, \\alpha)dv$$\n```\n\nwhere the integrand is\n\n```\n$$\\psi(v,\
    \ \\alpha) = Re[e^{-i v k} \\tilde{\\psi}(v)]$\\n$$= Re[\\frac{e^{-i v k} e^{-\\\
    tau v} \\varphi(v-(\\alpha+1)i)}{\\alpha^2 + \\alpha v - v^2 + iv(2\\alpha+1)}]\
    \ . (3.47)$\n```\n\nLord and Kahl (2007) argue that the optimal $\\alpha^*$ is\
    \ which reduces the variance of the integrand $\\psi(v, \\alpha)$ over the integration\
    \ domain $[0, \\infty)$. Under the assumption that $\\psi(v, \\alpha)$ is monotone\
    \ in $v$ on $[0, \\infty)$, they show that the optimal $\\alpha$ is given by\n\
    \n```\n$$\\alpha^* = \\arg_{min\\alpha_{min} \\le \\alpha \\le \\alpha_{max}}}\
    \ [-\\alpha k + \\frac{1}{2}\\ln(\\psi(v, \\alpha)^2)]$ (3.48)$\n```\n\nwhich\
    \ they define as the function $\\Psi(k)$. Using the examples from the previous\
    \ section and running the optimization in Equation (3.48) produces $\\alpha^*=6.6233$.\
    \ Note that this optimal value is within the range of admissible values $(\\alpha_{min},\
    \ \\alpha_{max})=(-3.3068, 9.0600)$ obtained in the previous section.\n\n# Numerical\
    \ Implementation and illustration\n\nWe continue to illustrate the bounds on $\\\
    alpha$ and the optimal $\\alpha^*$ using the settings for the previous example,\
    \ namely $S=1, \\tau=0, K=1.2, \\rho=-0.7, v_0=0.1, \\kappa=\\sigma=1$, and $\\\
    tau=1$."
