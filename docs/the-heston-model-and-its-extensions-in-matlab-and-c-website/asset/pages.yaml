  md: "# Numerical Integration Schemes\n\nBurden and Faires (2010) show that Gauss-Legendre\
    \ approximation to the double integral over the domain [a,b] \\times [c,d] is\n\
    \n```\n$$\\int_{a}^{b}\\int_{c}^{d} f(x,y) \\dx dy \\approx \\sum_{i=1}^{N_1}\\\
    sum_{j=1}^{N_2} h_1 w_{i,1} w_{j,2} \\cdot f(h_{i,1},x_{i,1}+b_2,x_{j,2}+k_2).\
    \ (5.11)$\n```\n\nThe approximation uses two sets of Gauss-Legendre absciss and\
    \ weights, of sizes $N_1$ and $N_2$. In (5.11), $w_{i,1}$ and $w_{j,2}$ are the\
    \ weights, $x_{i,1}$ and $x_{j,2}$ are the absciss, and $b_1 = (b-a)/2, b_2 =\
    \ (b+a)/2, k_1 = (d-c)/2,$ and $k_2 = (d+c)/2$. The approximation in 5.11 is implemented\
    \ using the DoubleGaussendre.m function.\n\n```\nfunction y = DoubleGaussLegendre(f,a,b,c,d,x1,w1,x2,w2)\n\
    h1 = (b-a)/2;      h2 = (b+a)/2;\nk1 = (d-c)/2;      k2 = (d+c)/2;\nfor i=1:N1\n\
    \  for j=1:N2\n    Int(i,j) = h1*w1(i)*w2(j) * f(h1*x1(i)+h2,k1*x2(j)+k2);\n \
    \ end\nend\ny = sum(sum(Int));\n```\n\nWe use the following code to implement\
    \ the same example of the standard bivariate distribution to illustrate the composite\
    \ trapezoidal rule.\n\n```\nf = @(x,y) (0.5/pi*exp(-(x^2+y^2)/2));\n[x1 w1] =\
    \ GenerateGaussLegendre(12);\n[x2 w2] = GenerateGaussLegendre(14);\na = -5;\n\
    b = -0.515;\nc = -5;\nd = 0.243;\nGLValue = DoubleGaussLegendre(f,a,b,c,d,x1,w1,x2,w2);\n\
    ```\n\nThe code returns a value of 0.18075, which is very close to the true value.\n\
