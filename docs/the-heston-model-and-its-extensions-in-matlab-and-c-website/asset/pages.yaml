- pgno: 334
  md: '# 328


    # THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    In the following subsections, we use (11.3) to derive analytic expressions for
    most of the popular-first- and second-order Greeks.


    # Delta, Gamma, Rho, Theta, and Vega


    Delta, gamma, rho and theta are obtained by differentiating Equation (11.1) and
    applying (11.3) when required. Vega is more arbitrary, since there are several
    parameters that affect the volatility smile in the Heston model. The second-order
    volatility vanna and volga will be covered in the next section.


    As explained by Bakshi, Cao, and Chen (1997), Reiss and Wystup (2000), and Bakshi
    and Madan (2000), and others, for the delta and puts can be given by, respectively


    ```

    $$\Delta_{C} = \frac{\partial C}{\partial S}=e^{-q\tau}P_{1}$ and $\Delta_{P}
    = \frac{\partial P}{\partial S}=e^{-q\tau}(P_{1}-1). \quad (11.4)$

    ```


    Gamma is found by differentiating delta. By definition, it is the same for calls
    and puts. Using $\partial f_{1}/\partial S=i\phi f_{1}/S$, in Equation (11.3)
    to obtain $\partial P_{1}/\partial S$, we can recover gamma as


    ```

    $$\Gamma = \frac{\partial^{2}C}{\partial S^{2}}=e^{-2q\tau}\frac{\partial^{2}P_{1}}{\partial
    S^{2}}-\pi P_{1,0}Re[e^{-i\phi \ln K}f_{1}(\phi; x, v_{\tau})]. \quad (11.5)$

    ```


    Rho is found by differentiating (11.1) with respect to the risk-free rate, $r$.
    For calls and puts rho is, respectively


    ```

    $$\rho_{C} = \frac{\partial C}{\partial r}=Ke^{-q\tau}P_{2}$ and $\rho_{P} = \frac{\partial
    P}{\partial r}=Ke^{-q\tau}(P_{2}-1). \quad (11.6)$

    ```


    Theta is the negative of the derivative with respect to maturity, $\tau$. For
    calls and puts, theta is, respectively


    ```

    $$\Theta_{C} = \frac{\partial C}{\partial \tau}=-S_{1}e^{-q\tau}(-qP_{1}+\frac{\partial
    P_{1}}{\partial \tau})+Ke^{-q\tau}(-rP_{2}+\frac{\partial P_{2}}{\partial \tau})
    \quad (11.7)$$\n$$$\Theta_{P} = \frac{\partial P}{\partial \tau}=\Theta_{C}+Cre^{-q\tau}-qS_{1}e^{-q\tau}$

    ```


    where


    ```

    $$\frac{\partial f_{i}}{\partial \tau}=exp(C+D\nu_{i}+i\phi x_{i})(\frac{\partial
    C_{i}}{\partial \tau\|+\frac{\partial D_{i}}{\partial \tau}}\nu_{i}) \quad (11.8)$

    ```


    and


    ```

    $$\frac{\partial C_{i}}{\partial \tau}=(r-q)\phi_{i}+\frac{k\theta}{\sigma^{2}}[b_{i}-\rho\sigma\phi_{i}+d_{i}+\frac{2g_{i}e^{d\tau}}{1-g_{i}e^{d\tau}}]
    \quad (11.9)$$\n$$$\frac{\partial D_{i}}{\partial \tau}=\frac{b_{i}-\rho\sigma\phi_{i}+d_{i}}{\sigma^{2}}\times\frac{(g_{i}-1)d_{i}e^{d\tau}}{(1-g_{i}e^{d\tau})^{2}}$

    ```'
