    # GAUSSIAN QUADRATURE


    In Newton-Cotes formulas, the abscissas are fixed and usually spaced equally.
    Gaussian quadrature uses unequally spaced abscissas, and weights which can easily
    be computed in Matlab. Gaussian quadrature is more accurate than Newton-Cotes
    quadrature and requires fewer abscissas. Moreover, since the abscissas are specified
    for us in advance, we need not worry about setting the upper and lower limits
    $\phi_{min}$ and $\phi_{max}$ for the integration range $(0, \infty)$.


    Gaussian quadrature approximates the integral over the range $[a, b]$ by the weighted
    sum of the integrand evaluated at the abscissa, as in Equation (5.1), reproduced
    here for


    ```

    $$\int_a^b f(x)dx \approx \sum_{k=1}^N w_k f(x_k).$$

    ```


    Similar to Newton-Cotes formulas, Gaussian quadrature requires a set of abscissas
    $(x_1, \dots, x_N)$ along with a set of weights $(w_1, \dots, w_N)$. The values
    of the abscissas and weights depends on the choice of quadrature and on the choice
    of N. For our purposes, the choice of method depends largely on the integration
    range for which the quadrature is designed. Quadratures are described in many
    textbooks on the subject, such as by Cohen (2011), Stroud and Secrest (1966),
    or on the Wolfram website (www.mathworld.wolfram.com). In the following sections,
    we describe Gauss-Laguerre, Gauss-Legendre, and Gauss-Lobatto quadratures, and
    present algorithms for finding the weights and abscissas of each method.


    # Gauss-Laguerre Quadrature


    Gauss-Laguerre quadrature is especially relevant for purposes of evaluating the
    integral for the Heston model, because it is designed for integrals over the domain
    $(0, \infty)$. We propose to use Gauss-Laguerre quadrature with N points. The
    abscissas $(x_1, \dots, x_N)$ are the roots of the Laguerre polynomial $L_N(x)$
    of order N defined as


    ```

    $L_N(x) = \sum_{k=0}^N \frac{(-1)^k}{k!} \binom{N}{k} x^k.$

    ```


    $\binom{N}{k}$ is the binomial coefficient. There are N roots in all. The weights
    $(w''_1, \dots, w''_N)$ are obtained with the derivative of $L_N(x)$ evaluated
    at each of the N abscissas


    ```

    $L_N''(x_j) = \sum_{k=1}^N \frac{(-1)^k}{(k-1)!} \binom{N}{k} x_j^{k-1} \text{
    for } j = 1, \dots, N.$

    ```'
