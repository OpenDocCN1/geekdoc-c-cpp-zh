    The Matlab function BiscBIV.m and the C function BiscBIV() for this algorithm
    were presented earlier in this chapter. The algorithm finds the implied volatility
    by finding the zero of the difference between the market price and the Black-Scholes
    price. The advantage of using this algorithm is that a solution will always be
    found, provided that the function is continuous, and the two initial endpoints
    of the interval are selected so that one value produces a negative difference,
    and the other produces a positive difference, which— the presence of a root within
    the interval. Since option prices are monotone increasing in volatility, we can
    always use a small value for the first endpoint (say 0.1 percent), and a very
    large value for the second endpoint (say 500 percent).


