  md: '# 312 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    The final section loops through the identified points, and attributes the coefficients
    for central, forward, or backward differences to each of the first- and second-order
    matrices. To conserve space, only the central differences of the interior are
    shown.


    ```

    I = find(Cs=1)

    for k=1:length(I)

    % Create the matrix for S-derivatives

    ders1(I(k),I(k)-1) = -1/2/ds * Si(I(k))

    ders1(I(k),I(k)) = 0

    ders1(I(k),I(k)+1) = 1/2/ds * Si(I(k))

    ders2(I(k),I(k)-1) = -1/2/ds * Vi(I(k))*Si(I(k))^2

    ders2(I(k),I(k)) = -2/ds * Vi(I(k))*Si(I(k))^2

    ders2(I(k),I(k)+1) = 1/2/ds * Vi(I(k))*Si(I(k))^2


    I = find(Cv=1)

    for k=1:length(I)

    % Create the matrix for V-derivatives

    dver1(I(k),I(k)-NS) = -1/2/dv

    dver1(I(k),I(k)) = 0

    dver1(I(k),I(k)+NS) = 1/2/dv

    dver2(I(k),I(k)-NS) = -1/2/dv * Vi(I(k))

    dver2(I(k),I(k)) = 0

    dver2(I(k),I(k)+NS) = 1/2/dv * Vi(I(k))

    dver3(I(k),I(k)-NS) = -2/dv^2 * Vi(I(k))

    dver3(I(k),I(k)+NS) = 1/dv^2 * Vi(I(k))

    ```


    ```

    I = find(Sv=1)

    for k=1:length(I)

    % Create the matrix for SV-derivatives

    dsv1(I(k),I(k)+NS-1) = 1/4*(4*ds*dv)*Vi(I(k))*Si(I(k))

    dsv1(I(k),I(k)-NS-1) = -1/(4*ds*dv)*Vi(I(k))*Si(I(k))

    dsv2(I(k),I(k)-NS-1) = 1/(4*ds*dv)*Vi(I(k))*Si(I(k))

    dsv2(I(k),I(k)+NS-1) = -1/(4*ds*dv)*Vi(I(k))*Si(I(k))

    ```


