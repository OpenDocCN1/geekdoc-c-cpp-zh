  md: "# 16 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nSome applications\
    \ require Matlab code for the Heston characteristic function. The HestonProb.m\
    \ function can be modified to return the characteristic function itself, instead\
    \ of the integrand. In certain instances, the integrand for $P_l$\n\n```\n$Re\
    \ = \\frac{e^{-i\\phi \\ln K} f_l(\\phi; \\mathbf{x}, v)}{i\\phi} \\quad (1.63)$\n\
    ```\n\nis well-behaved in that it does not oscillate much in numerical integration.\
    \ This corresponds to an integrand that dampens quickly so that a larger upper\
    \ limit in the numerical integration is not required, and that does not contain\
    \ portions that are excessively steep. In other instances, the integrand is not\
    \ well-behaved, and numerical integration loses precision. To illustrate, we plot\
    \ the second integrand ($j=2$) in Equation (1.63), using the settings $S=7, K=10$,\
    \ and $r=q=0$, with parameter values $\\kappa=10, v_0=0.07, \\sigma=0.3$, and\
    \ $\rho=-0.9$. The plot uses $-\\phi<50$ over maturities running from 1 week to\
    \ 3 months. This plot appears in Figure 1.1. The integrand has a discontinuity\
    \ at $\\phi=0$, but this does not show up in the figure.\n\nThe plot indicates\
    \ an integrand that has a fair amount of oscillation, especially at short maturities,\
    \ and that is steep near the origin. In Chapter 2, we investigate other problems\
    \ that can arise with the Heston integrand.\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_28_0.png)\n\
    \n**FIGURE 1.1** Heston Integrand and Maturity"
