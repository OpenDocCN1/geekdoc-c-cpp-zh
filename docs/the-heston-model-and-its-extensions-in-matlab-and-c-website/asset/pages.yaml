    # Zhu Scheme for the Transformed Variance


    We saw in Chapter 7 how to avoid negative variances is to simulate the volatility
    instead of variance, and then square the volatility before using it as an input
    to the stock price process. It is straightforward to apply this approach to the
    double Heston model also. Recall from Chapter 7 that a remain of Itô’s lemma produces
    the process for the volatility $\omega_{i,j} = \sqrt{V_{i,j}}$ and Euler discretization
    of the volatility


    > $\omega_{i,j+dt} = \omega_{i,j} + \frac{\kappa_i}{2} \left[ \left( 0 - \frac{\sigma_i^2}{4\kappa_i}
    \right) - \omega_{i,j} \right] dt + \frac{1}{2} \sigma_i \sqrt{dtZ_{i,V}} \quad
    (12.32)$


    for $j=1, 2$, we first simulate $(\omega_{i,j}, \theta_{i,j})$ and obtain the
    variances $v_{i,j} = \omega_{i,j}^2$ and $u_{i,j} = \theta_{i,j}^2$. We then use
    the Predictor-Corrector of Equation (12.26) to obtain. Note that this method suffers
    from the same problem of numerical instability in the univariate case, due to
    the fact that the mean levels $\theta_{\omega_i} = [0 - \sigma_i^2/(4\kappa_i)]\omega_i$
    are stochastic.


    We saw in Chapter 7 that the method proposed by Zhu (2010) to handle this numerical
    instability show how to apply this scheme to the double Heston model also. The
    transformed volatilities are developed analogously to that in Chapter 7


    > $\omega_{i,j+dt} = \omega_{i,j} + \frac{\kappa_i}{2} [\theta_i^* - \omega_{i,j}]
    dt + \frac{1}{2} \sigma_i \sqrt{dtZ_{i,V}} \quad (12.33)$'
