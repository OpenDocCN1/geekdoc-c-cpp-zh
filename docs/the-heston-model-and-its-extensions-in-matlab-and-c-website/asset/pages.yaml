- pgno: 339
  md: "# The Heston Greeks\n\nFor the second-order Greeks, gamma (Γ) and volga, we\
    \ can use the second-order differences for a single variable. Hence, for example,\
    \ gamma is approximated as\n\n```\n\\Gamma \\approx C(S+dS, v, t) - 2C(S, v, t)\
    \ + C(S-dS, v, t) / (dS)^2\n```\n\nFor volga, which we express in terms of $v\
    \ = \\sqrt{v_0}$, we first approximate the following second-order derivative in\
    \ $v_0$\n\n```\n\\frac{\\partial^2 C}{\\partial v_0^2} \\approx \\frac{C(S, v,\
    \ v_0+dv) - 2C(S, v, v_0) + C(S, v, v_0-dv)}{(dv)^2} (11.29)\n```\n\nWe then approximate\
    \ $\\mathcal{V}_1$ using Equation (11.28) and substitute it along with (11.29)\
    \ into (11.20). Finally, for vanna, we use the second-order central difference\
    \ in two variables. We first approximate the second-order derivative in (11.16),\
    \ and then multiply by $2\\sqrt{v_0}$. Hence, vanna is approximated as\n\n```\n\
    Vanna \\approx 2\\sqrt{v_0} [C(S+dS, v, v_0+dv) - C(S-dS, v, v_0+dv) - C(S+dS,\
    \ v, v_0-dv) + C(S-dS, v, v_0-dv)]/[dSdv] (11.30)\n```\n\n# NUMERICAL IMPLEMENTATION\
    \ OF THE HESTONGREEKS\n\nThe Matlab function HestonGreeksProb.m contains the integrands\
    \ to compute the Greeks in closed form. The first part of the function calculates\
    \ the coefficients $C_j(\tau,\\phi)$ and $D_j(\\tau,\\phi)$, and calculates the\
    \ characteristic functions $f_j(\\phi)$ in the usual way. The second part of the\
    \ function returns the integrands $f_j$ of Equation (11.4) and rho in (11.6) require\
    \ $P_j$, so the function returns the integrand for $P_j$,\n\n```\nfunction y =\
    \ HestonGreeksProb(phi,...,Greek);\nf = exp(C + D*v * i*phi*x);\nif strcmp(Greek,\
    \ 'Delta') | strcmp(Greek, 'Rho')\ny = real(exp(-i*phi*log(K))*f/phi);\n```\n\n\
    Gamma requires the integrand specified in (11.5.\n\n```\nelseif strcmp(Greek,\
    \ 'Gamma')\ny = real(exp(-i*phi*log(K))*f);\n```\n\nTheta is slightly more complicated\
    \ because the derivatives for $C_j(\\tau,\\phi)$ and $D_j(\\tau,\\phi)$ in (11.9)\
    \ need to be obtained."
