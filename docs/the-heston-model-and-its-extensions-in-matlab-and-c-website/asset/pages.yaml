  md: "# Vanna, Volga, and Other Greeks\n\nThe most popular second-order Greeks are\
    \ vanna, the derivative of ve with respect to the spot price, and the derivative\
    \ of ve with respect to volatility. In this subsection, we focus only the first\
    \ derivative, $\nu_1$ in Equation (11.11). Hence, vanna and volga\n\n```\n$Vanna\
    \ = \\frac{\\partial^2 C}{\\partial v\\partial S} \\frac{\\partial^2 C}{\\partial\
    \ v^2} 2\\sqrt{v_0}$ and $Volga = \\frac{\\partial^2 C}{\\partial v^2}$ (11.16)\n\
    ```\n\nwhere $\nu = \\sqrt{v_0}$. Again, it is easy to verify that vanna and the\
    \ volga are identical. Vanna can be obtained from delta as\n\n```\n$Vanna = \\\
    frac{\\partial}{\\partial v}\\frac{\\partial (C)}{\\partial S} = 2e^{-r\\tau}\\\
    sqrt{v_0}\\frac{\\partial P_1}{\\partial v_0}$ (11.17)\n```\n\nwhere we use the\
    \ derivative in (11.12). Volga can be obtained from vega, by using (11.10)\n\n\
    ```\n$Volga = \\frac{\\partial \\nu_1}{\\partial v} = Se^{-r\\tau}\\frac{\\partial^2\
    \ P_1}{\\partial v^2} - Ke^{-r\\tau}\\frac{\\partial^2 P_2}{\\partial v^2}$ (11.18)\n\
    ```\n\nwhere\n\n```\n$\\frac{\\partial^2 P_j}{\\partial v^2} = 4(\\frac{\\partial^2\
    \ P_j}{\\partial v_0^2} + \\frac{1}{2}\\frac{\\partial P_j}{\\partial v_0})$ (11.19)\n\
    $\\frac{1}{\\pi}\\int_{-\\infty}^{\\infty} Re \\left[ \\frac{e^{-i\\phi}\\ln K}}{i\\\
    phi} 2D_j(\\tau, \\phi; x_t, v_t)(2D_j(\\tau, \\phi)v_0 + 1)\\right] d\\phi$.\n\
    ```\n\nEquivalently\n\n```\n$Volga = \\frac{\\partial \\nu_1}{\\partial v_0}\\\
    sqrt{v_0} = 4\\sqrt{v_0}(\frac{\\partial^2 C}{\\partial v_0^2} + \\frac{\\nu_1}{4v_0})\
    \ = 4(\\frac{\\partial^2 C}{\\partial v_0^2} + \\frac{1}{2}\\frac{\\partial C}{\\\
    partial v_0})$ (11.20).\n```\n\nWe need the second derivative\n\n```\n$\\frac{\\\
    partial^2 C}{\\partial v_0^2} = Se^{-r\\tau}\\frac{\\partial^2 P_1}{\\partial\
    \ v_0^2} - Ke^{-r\\tau}\\frac{\\partial^2 P_2}{\\partial v_0^2}$ (11.21).\n```\n\
    \nwith, from Equation (11.12)\n\n```\n$\\frac{\\partial^2 P_j}{\\partial v_0^2}\
    \ = \\frac{1}{\\pi}\\int_{-\\infty}^{\\infty} Re \\left[ \\frac{e^{-i\\phi}\\\
    ln K}{i\\phi} D_j(\\tau, \\phi; x_t, v_t)^2\\right] d\\phi$. (11.22)\n```\n\n\
    We have defined vega $(\\nu_1$), vanna, and volga all in terms of the spot volatility,\
    \ $v = \\sqrt{v_0}$. On the other hand, the Heston PDE for the option price $U(S_t,\
    \ v_t, t)$, which we encountered in Chapter 1, contains derivatives expressed\
    \ in terms of the variance, $v_0$. If we redefine vega, vanna, and volga in terms\
