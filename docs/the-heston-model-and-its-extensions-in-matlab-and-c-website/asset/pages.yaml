  md: "# Parameter Estimation\n\nand covariance matrix\n\n$$\\Sigma_{t+1} = v_t dt\
    \ \\left( \begin{array}{cc} \\frac{1}{4}\rho\\sigma \\ \rho & \\sigma^2 \\end{array}\
    \ \right)$\n\nand $dt$ is the time increment between $t$ and $t+1$. Suppose we\
    \ are given a time series of log-stock prices $x_1, x_2, \\dots, x_n$, observed\
    \ at equal time increments $dt$. If the observations are daily, for example, then\
    \ $dt=1/252$. Atiya and Wall (2009) apply a filtering algorithm to show that the\
    \ likelihood for the observed variances can be approximated by the likelihood\
    \ of stock prices. The likelihood at $t+1$, given a value $v_t$ at time $t_i$,\n\
    \n$L_{t+1}(v_{t+1}) \\propto d_t(ab_t)^{-1/4} e^{-2\\sqrt{ab_t}} L_t \\left( \\\
    sqrt{\\frac{b_t}{a}} \\right). \\quad (6.16)$\n\nThe log-likelihood is therefore\n\
    \n$$\\ell_{t+1}(v_{t+1}) \\propto \\ln d_t-\\frac{1}{4}\\ln(ab_t)-2\\sqrt{ab_t}\
    \ + \\ell_t \\left( \\sqrt{\\frac{b}{a}} \\right). \\quad (6.17)$\n\nThese expressions\
    \ use the following quantities, defined as Equations (14) through\n\n(16) in Atiya\
    \ and Wall (2009)\n\n$a = \\frac{(\\kappa')^2+\\rho\\kappa'dt+\\sigma^2dt}{2\\\
    sigma^2(1-\\rho^2)dt}$\n\n$b_t = \\frac{(v_{t+1}-\\mu dt)^2-2\\rho v_t(\\mu dt)+\\\
    sigma^2(\\Delta x_{t+1}-\\mu dt)}{2\\sigma^2(1-\\rho^2)dt}$\n\n$d_t = \\frac{1}{D}\
    \ \\exp \\left( \\frac{(2\\kappa'+\\rho dt)(v_{t+1}-\\mu dt)-(2\\rho\\kappa'+\\\
    sigma dt)(\\Delta x_{t+1}-\\mu dt)}{2\\sigma^2(1-\\rho^2)dt} \\right). \\quad\
    \ (6.18)$\n\nwith $\\mu=\\r-q dt$, $\\Delta x_{t+1}=x_{t+1}-x_t$, the increment\
    \ between log-stock prices, $\\kappa'=1-\\kappa dt$, $\\kappa=\\kappa\\theta$,\
    \ and $D=2\\pi\\sqrt{1-\\\rho^2}$.\n\nThe likelihood Equation (6.16) depends also\
    \ on $v_{t+1}$. Atiya and Wall (2009) note the terms $b_t$ and $d_t$, to evaluate\
    \ $v_{t+1}=\\sqrt{b_t/a_t}$. Inverting $v_{t+1}$ from $v_t$, this expression and\
    \ applying the quadratic formula produces the solution\n\n$v_{t+1}=\\sqrt{B^2-C-B}\
    \ \\quad (6.19)$\n\nwhere\n\n$B=-\\alpha dt-\\\rho\\sigma(\\\\Delta x_{t+1}-\\\
    mu dt)$,\n\n$C=(\\alpha dt)^2+2\\rho\\alpha dt(\\\\Delta x_{t+1}-\\mu dt)+\\sigma^2(\\\
    \\Delta x_{t+1}-\\mu dt)^2-2v_t^2\\sigma^2(1-\\rho^2)dt$.\n\nHence, to evaluate\
    \ the likelihood Equation (6.16) or the log-likelihood (6.17), we start with initial\
    \ values $L_0(v_0)$ or $\\ell_0(v_0)$. To evaluate $L_{t+1}(v_{t+1})$ or $\\ell_{t+1}(v_{t+1})$\
    \ given $L_t(v_t)$ or $\\ell_t(v_t)$, we first obtain $v_{t+1}$ from (6.19). Then\
    \ we apply Equation (6.16) or"
