  md: '# # The Double Heston Model


    job when the slopes are all relatively flat or all relatively steep. Incorporating
    a second volatility factor allows for two correlations and, hence, for two different
    regimes of volatility.


    To derive the PDE for the double Heston model, first apply Ito’s lemma to obtain
    the SDE for $x_t = \ln S_t$,


    ```

    $dx = (r - q - \frac{1}{2}(v_1 + v_2))dt + \sqrt{v_1}dW_1 + \sqrt{v_2}dW_2.$

    ```


    In Equation (12.5), if we set


    ```

    $W_1 = B_1\nW_2 = B_2\nZ_1 = \rho_1 B_1 + \sqrt{1 - \rho_1^2}B_3\nZ_2 = \rho_2
    B_2 + \sqrt{1 - \rho_2^2}B_4 \quad (12.7)$

    ```


    where $B_i$ are independent Brownian motion, then we can write the system of SDEs
    for $x_t=(x_t, v_1, v_2)$ corresponds to the volatility matrix of size $n \times
    m = 3 \times 4$ To do this, we note that the correlation structure in (12.6) is


    ```

    $\sigma(x_t, t) = \begin{pmatrix} \sqrt{v_1} & \sqrt{v_2} & 0 & 0 \ \sigma_1\sqrt{v_1}\rho_1
    & 0 & \sigma_1\sqrt{v_1}(1-\rho_1^2) & 0 \ 0 & \sigma_2\sqrt{v_2} & 0 & \sigma_2\sqrt{v_2}(1-\rho_2^2)
    \end{pmatrix}$

    ```


    and drift


    ```

    $\mu = \begin{pmatrix} r - q - \frac{1}{2}(v_1 + v_2) \ \kappa_1(\theta_1 - v_1)
    \ \kappa_2(\theta_2 - v_2) \end{pmatrix}..$

    ```


    We have


    ```

    $\sigma\sigma^T = \begin{pmatrix} v_1+v_2 & \sigma_1v_1 & \sigma_2v_2 \ \sigma_1v_1\rho_1
    & \sigma_1^2v_1 & 0 \ \sigma_2v_2\rho_2 & 0 & \sigma_2^2v_2 \end{pmatrix}$

    ```


    so the generator for the double Heston model is, from Equation (12.3)


    ```

    $\mathcal{A} = [r - q - \frac{1}{2}(v_1 + v_2)]\frac{\partial}{\ x} + \kappa_1(\theta_1
    - v_1)\frac{\partial}{\ v_1} + \kappa_2(\theta_2 - v_2)\frac{\partial}{\ v_2}\n\frac{1}{2}(v_1+v_2)\frac{\partial^2}{\
    x^2} + \rho_1\sigma_1v_1\frac{\partial^2}{\ x\partial v_1} + \rho_2\sigma_2v_2\frac{\partial^2}{\
    x\partial v_2}\n\frac{1}{2}\sigma_1^2v_1\frac{\partial^2}{\ v_1^2} + \frac{1}{2}\sigma_2^2v_2\frac{\partial^2}{\
    v_2^2} \quad (12.8)$

    ```'
