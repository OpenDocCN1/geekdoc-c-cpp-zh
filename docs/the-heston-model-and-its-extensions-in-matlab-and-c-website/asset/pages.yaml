    # FINITE DIFFERENCE APPROXIMATION OF DERIVATIVES


    Recall that we use the notation $U_{ij}^n$, $U(S,v,t_n)$ to represent the value
    of a European call at time $t_n$, when the stock price is $S$ and the volatility
    is $v$. The finite difference approximations to the derivatives are simple when
    the grids are uniform. The generalization to non-uniform grids is straightforward,
    but the approximations are a little more complicated. Whenever possible throughout
    this book, we use central difference approximations to the first- and second-order
    derivatives in the $S$ and $v$ directions in the PDE for $U$, in Equation (10.1).
    In general, first- and second-order derivatives of $U_t$, at a point $(S,v)$ on
    the grid can be expressed in terms of sums of values of $U$ at points adjacent
    to $(S,v)$.


    In the following paragraphs, we express the central difference approximation to
    the derivatives assuming a non-uniform grid. The approximations under a uniform
    grid arise as a special case and reduce the expressions to much simpler forms.
    The remainder of this section, we treat the approximations for the interior and
    boundary points of the PDE separately.'
