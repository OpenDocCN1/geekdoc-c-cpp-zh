  md: "In this section, we describe three schemes proposed by Kahl and Jäckel (2006).\
    \ The Balanced Implicit method of Milstein et al. (1998) introduces implicitness\
    \ in the diffusion term. The Pathwise Adapted Linearization Quadratic method retains\
    \ terms up to $(dt)^2$ in a more general expansion for pathwise approximation.\
    \ Finally, the IJK scheme uses the implicit Milstein scheme for the variance,\
    \ along with an alternative discretization for the log stock price.\n\n# BALANCED,\
    \ PATHWISE, AND IJK SCHEMES\n\n# Balanced Implicit Scheme\n\nThis scheme is able\
    \ to preserve positivity of the variance process. It is defined in Platen and\
    \ Heath (2009) and Kahl and Jäckel (2006) as\n\n```\n$v_{t+dt} = v_t + \\mu_t\
    \ dt + \\sigma_t \\Delta W_t + (v_t - v_{t-dt})C(v_t)$\n```\n\nwhere\n\n```\n\
    $C(v_t) = c^0(v_t)dt + c^1(v_t)|\\Delta W_t|$\n```\n\nwith $c^0$ and $c^1$ suitably\
    \ chosen positive valued and bounded functions defined as $c^0(v_t) = \\kappa$\
    \ and $c^1(v_t) = \\sigma/\\sqrt{v_t}$. The Balanced Implicit scheme for the Heston\
    \ model is,,\n\n```\n$v_{t+dt} = v_t + \\kappa(\\theta - v_t)dt + \\sigma\\sqrt{v_t}dtZ_v\
    \ + (v_t - v_{t-dt})C(v_t)\\n= \\frac{v_t(1 + C(v_t)) + \\kappa(\\theta - v_t)dt\
    \ + \\sigma\\sqrt{v_t}dtZ_v}{1 + C(v_t)}$$ (7.34)\n```\n\nwith\n\n```\n$C(v_t)\
    \ = \\kappa dt + \\frac{\\sigma \\sqrt{dt}|Z_v|}{\\sqrt{v_t}}$\n```\n\nSince the\
    \ variance is always guaranteed to be positive, reflection and truncation are\
    \ not needed. Unfortunately, as shown by Kahl and Jäckel (2006), the convergence\
    \ of this scheme can be very poor. For details please refer to Equations (6.25)\
    \ through (6.28) in their paper.\n\n# Pathwise Adapted Linearization Quadratic\n\
    \nAnother scheme for discretization of the variance is the Pathwise Adapted Linearization\
    \ Quadratic scheme presented in Kahl and Jäckel (2006). Its convergence is fast,\
    \ especially for small values of $\\sigma$. This scheme is given by\n\n```\n$v_{t+dt}\
    \ = v_t + (\\kappa(\\widetilde{\theta} - v_t) + \\sigma\\beta_n\\sqrt{v_t}) (1\
    \ + \\frac{\\sigma \\beta_n - 2\\kappa\\sqrt{v_t}}{4\\sqrt{v_t}} dt)$$ (7.35)\n\
    ```\n\nwhere $\\widetilde{\theta} = \\theta - \\sigma^2/(4\\kappa)$ and where\
    \ $\beta_n = Z_v/\\sqrt{dt}$. This scheme must be implemented with care, as it\
    \ can lead to numerical instability for large values of $\\sigma$."
  merge: -1
  img_proc: true
