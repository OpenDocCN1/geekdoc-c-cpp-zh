  md: '# 70 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    Since $e^{q(x)} > 0$ and $0 \le \Pi_1 \le 1$, $e^{q(x)} = p(x)$ can be treated
    as a density function. The characteristic function for $q(x)$ is denoted $\varphi_q(u)$,
    and that for $p(x)$ is denoted $\varphi_p(u)$. Using the definition of the characteristic
    function and performing the required integrations, $\varphi_p(u) = \varphi_q(u
    - i)$.


    ```

    $$\varphi_p(u) = \int_{-\infty}^{\infty} e^{iux} p(x) dx = \int_{-\infty}^{\infty}
    e^{iux} e^{q(x)} dx = \int_{-\infty}^{\infty} e^{(iu-i)x} q(x) dx = \varphi_q(u
    - i). \quad (3.30)$

    ```


    Now, write $\Pi_1$ using the representation in Equation (3.31)


    ```

    $$\Pi_1 = \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_q(v) \left( \int_{-\ell}^{\infty}
    e^{-ivx} dx \right) dv = \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_q(v -
    i) \left( \int_{\ell}^{\infty} e^{-itux} dx \right) dv. \quad (3.31)$

    ```


    Perform the change of variable $u = v - i$ so that (3.31) becomes


    ```

    $$\Pi_1 = \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_2(u) \left( \int_{\ell}^{\infty}
    e^{-iu(u+i)} dx \right) du. \quad (3.32)$

    ```


    which is Equation (8) of Attari (2004). Now evaluate the inner integral in Equation
    (3.32), as we do in (3.14).


    ```

    $$\Pi_1 = \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_2(u) \frac{e^{-iu(u+i)}}{i(u+i)}
    du - \frac{1}{2\pi} \lim_{R\to\infty} \int_{-\R}^{\infty} \varphi_2(u) \frac{e^{-iu(u+i)}}{i(u+i)}
    du \quad (3.33)$ \n$I_1 = I_1 - I_2.$

    ```


    The second integral is a complex integral with a pole at $u = -i$. The residue
    is, therefore, $\varphi_2(-i)/i$. Applying the Residue Theorem, we obtain


    ```

    $$\I_2 = \lim_{R\to\infty} \frac{1}{2\pi} \left[ -2\pi i \times \frac{\varphi_2(-i)}{i}
    \right] = -\varphi_2(0) = -1. \quad (3.34)$

    ```


    Substituting the result Equation (3.34) into (3.33) produces


    ```

    $$\Pi_1 = \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_2(u) \frac{e^{-iu}}{i(u+i)}
    du + 1 \quad (3.35)$

    ```


    which is Equation (12) of Attari (2002). For $\Pi_2$, we use the Gil-Pelaez (1951)
    formula in (3.17)


    ```

    $$\Pi_2 = \frac{1}{2} + \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi_2(u) \frac{e^{-iu}}{iu}
    du. \quad (3.36)$

    ```


    > ¹The Residue Theorem will be introduced in Chapter 4.'
