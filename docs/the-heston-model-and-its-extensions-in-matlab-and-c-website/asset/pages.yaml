  md: '# Time-Dependent Heston Models


    # 275


    # TABLE 8.1 Replication of Table 1 of Mikhailov and Nogel (2003)


    | Strike | Matlab Price | Mikhailov-Nögel Price |

    | --- | --- | --- |

    | 0.50 | 0.5429 | 0.5430 |

    | 0.75 | 0.3852 | 0.3851 |

    | 1.00 | 0.2737 | 0.2733 |

    | 1.25 | 0.1960 | 0.1954 |

    | 1.50 | 0.1420 | 0.1412 |


    allows for piecewise constant parameters, and also accommodates three types of
    loss functions, MSE, RMSE, and the proxy IVMSE of Christoffersen, Heston, and
    Jacobs (2009).


    ```

    function y = MNObjFun(param,param0,tau,tau0,...)

    [NK, NT] = size(MktPrice);

    for k=1:NK

    MktPrice(k) = MNObjFunGaussLauerre(param,param0,tau,tau0,...);

    switch MNObjFun

    case 1 % MSE

    error(k) = (MktPrice(k) - MktPrice(k))^2;

    case 2 % RMSE

    error(k) = (MktPrice(k) - MktPrice(k))^2 / MktPrice(k);

    case 3 % CHJ (2009)

    Vega(k) = BSV(S,K,rf,MktIV(k),tau);

    error(k) = sqrt(MktPrice(k) - MktPrice(k))^2 / Vega(k);

    end

    end

    y = sum(error) / (*NK);

    ```


    The loss function allows for past values of parameters and maturities to be used
    as inputs, stored in the matrix param0 and in the vector tau0, respectively. To
    initialize time-dependent parameter estimation, we use the MNObjFun.m function
    with empty matrices [] in the place of param0 and tau0. This produces the first
    set of estimates at the first maturity.


    ```

    paramTD = fmincon(@p) MNObjFun(p, [], tau(1), [], MktPrice(:,1),...);

    oldparam = [];

    oldtau = [];

    ```


    We then loop through the remaining maturities, using the previous maturity’s parameter
    estimates as starting for the next estimation.'
