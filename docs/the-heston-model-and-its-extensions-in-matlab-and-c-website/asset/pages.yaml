  md: "# The Heston Greeks\n\nIn Equation (11.8), $x_t = \\ln S_t$ is the log stock\
    \ price, and $v_t$ is the initial variance, which is observed and estimated as\
    \ the $v_0$. The quantities $b_j, g_j$, and $d_j$ are given in Chapter 1 for $j=1,\
    \ 2$.\n\nVega is the derivative of the call and put price with respect to the\
    \ implied volatility. In the Black-Scholes model, the implied volatility is represented\
    \ by the volatility parameter $\\sigma_{BS}$, so vega for the call is readily\
    \ obtained as $\\partial C_{BS}/\\partial \\sigma_{BS}$, where $C_{BS}$ is the\
    \ Black-Scholes call price. Recall from Chapter 1 that in the Heston model, the\
    \ shape of the implied volatility surface is determined by the parameters driving\
    \ the variance, namely the mean reversion speed $\\kappa$, the mean reversion\
    \ level $\theta$, the initial level of variance $v_0$ and the correlation $\\\
    rho$, which are parameters for the initial and long-term level of the variance.\
    \ Zhu (2010) recommends basing vega on these two parameters. Both parameters represent\
    \ variance, so we create measures of sensitivity to volatility, Zhu (2010) defines\
    \ two, one on $\\sqrt{v_0}$ and the other based on $\\omega = \\theta$. The vegas\
    \ for the call, are, the derivatives\n\n```\n$$\\mathcal{V}_1 = \\frac{\\partial\
    \ C}{\\partial v} \\frac{\\partial C}{\\partial v_0}2\\sqrt{v_0} \\text{ and}\
    \ \\\\mathcal{V}_2 = \\frac{\\partial C}{\\partial \\omega} \\frac{\\partial C}{\\\
    partial \\theta}2\\sqrt{\\theta}$. (11.10)\n```\n\nThe first vega\n\n```\n$$\\\
    mathcal{V}_1 = e^{-qr\\tau} \\frac{\\partial P_1}{\\partial v_0}2\\sqrt{v_0} -\
    \ Ke^{-r\\tau} \\frac{\\partial P_2}{\\partial v_0}2\\sqrt{v_0}$. (11.11)\n```\n\
    \nwhere\n\n```\n$$\\frac{\\partial P_1}{\\partial v_0} = \\frac{1}{\\pi} \\int_0^{\\\
    infty} Re \\left[ \\frac{e^{-i\\phi\\ln k_f}(\\phi; x_t, v_t)} D_j(\\tau, \\phi)}{i\\\
    phi} \\right] d\\phi$. (11.12)\n```\n\nThe second vega\n\n```\n$$\\mathcal{V}_2\
    \ = e^{-qr\\tau} \\frac{\\partial P_1}{\\partial \\theta}2\\sqrt{\\theta} - Ke^{-r\\\
    tau} \\frac{\\partial P_2}{\\partial \\theta}2\\sqrt{\\theta}$. (11.13)\n```\n\
    \nwhere\n\n```\n$$\\frac{\\partial P_1}{\\partial \\theta} = \\frac{1}{\\pi} \\\
    int_0^{\\infty} Re \\left[ \\frac{e^{-i\\phi\\ln k_f}(\\phi; x_t, v_t)}{i\\phi}\
    \ \\frac{\\partial C_l}{\\partial \\theta} \\right] d\\phi$. (11.14)\n```\n\n\
    and\n\n```\n$$\\frac{\\partial C_l}{\\partial \\theta} = \\frac{\\kappa}{\\sigma^2}\
    \ \\left( (b_j - \\rho\\sigma\\phi + d_j) \\tau - 2\\ln \\left( \\frac{1-g_je^{d_j\\\
    tau}}{1-g_j} \\right) \\right)$. (11.15)\n```\n\nBy examination of Equation (11.1),\
    \ it is easy to verify that $\\mathcal{V}_1$ and $\\mathcal{V}_2$ for the put\
    \ are the same as those for the call."
