    \ FRTI. Finally the integration grid $[v_n]$ and log-strike grid $[k_n]_{n=1}$\
    \ are built exactly as in (5.21) and (5.23), with $b = N\\lambda/2$, as\n\nThe\
    \ Matlab function fratt takes an input vector $x$ and an increment parameter $\b\
    eta$ and returns the FRFT $\\hat{x}$ from (5.300), using the built-in Matlab functions\
    \ fft.m for the inverse Fourier transform.\n\n```\nfunction xhat = FRFT(x,beta)\n\
    N = length(x)\ny = [exp(-i.*pi.*(0:N-1).^2.*beta).*x, zeros(1,N)]\nz = [exp(i.*pi.*(0:N-1).^2.*beta)\n\
