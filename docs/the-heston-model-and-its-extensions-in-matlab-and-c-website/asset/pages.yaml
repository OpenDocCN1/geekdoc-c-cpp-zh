  md: '# Integration Issues, Parameter Effects, and Variance Modeling


    Moreover, he assumes that the following ansatz, loosely defined as an educated
    guess, holds


    E[x_t|x_T] = \frac{\hat{x}_T}{\hat{w}_T}.


    Taking the conditional expectation of (2.39) and applying the ansatz produces


    du_t = \kappa(\theta - u_t)dt + \rho(\frac{\hat{x}_T}{\hat{w}_T}\hat{v}_dt + \frac{1}{2}u_tdt)


    since according to the ansatz, E[dx_t|x_T] = (x_T/w_T)d\hat{w}_t$, and from Equation
    (2.21),

    \hat{u}_t = \hat{v}_t,dt. Rearranging terms produces


    du_t = \kappa''(\theta'' - u_t)dt + \rho\frac{\hat{x}_T}{\hat{w}_T}\hat{v}_dt,
    (2.40)


    where \kappa'' = \kappa - \rho/2$ and \theta'' = \theta/\kappa''. We can write
    (2.40)


    \frac{du_t}{dt} + \kappa''u_t = \rho\frac{\hat{x}_T}{\hat{w}_T}\hat{v}_t + \kappa''\theta''.


    We recognize this as a first-order differential equation of the form du_t/dt +
    u_t = Q_t, whose solution u_t at T is given


    u_T \exp(\int_0^T P_s ds) = \int_0^T Q_t \exp(\int_t^T P_s ds) dt + C_1


    where C_1 is a constant.

    Substituting for P_t = \kappa'' and Q_t = \rho v_tx_T/\hat{w}_T + \kappa''\theta'',
    multiplying both sides by

    e^{-\kappa''T} and performing the integration productions


    u_T = \rho\frac{\hat{x}_T}{\hat{w}_T}\hat{v}_te^{-\kappa''(T-t)}dt + \theta''(1
    - e^{-\kappa''T}) + C_1e^{-\kappa''T}. (2.41)


    The initial condition is u_0 E[v_0|x_0] = v_0, the initial variance. Setting

    T=0 in Equation (2.41) implies that u_0 = v_0. The approximation to local

    variance when \rho = \pm1, u_T is therefore


    u_T = \hat{v}_T + \rho\frac{\hat{x}_T}{\hat{w}_T}\int_0^T \hat{v}_te^{-\kappa''(T-t)}dt
    (2.42)


    where


    u_T = \hat{v}_T + (\theta - \theta'')e^{-\kappa''T} (2.43)


    analogous to (2.20). Equation (2.42) is Equation (3.15) of Gatheral (2006), and
    can

    be further integrated produce


    u_T = \hat{v}_T + \rho\frac{\hat{x}_T}{\hat{w}_T}[\frac{\theta - \theta''}{\kappa''
    - \kappa}(e^{(\kappa''-\\kappa)T} - 1) + \frac{\theta}{\kappa''}(e^{\kappa''T}
    - 1)]. (2.44)'
