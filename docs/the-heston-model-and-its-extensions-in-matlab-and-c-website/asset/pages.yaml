  md: "# 52 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe Matlab function\
    \ HestonLVAppro.m implements Gatheral's (2006)\napproximation to local volatility\
    \ $\\sigma_l(K, T)$ in the Heston model, in accordance with\n(2.44).\n\n```\n\
    function y = HestonLVAppro(...);\n% Modified parameters kappa' and theta'\nkappa_\
    \ = kappa - rho*sigma/2;\ntheta_ = theta+kappa/kappa_;\n% wt and vt\nxt = log(K/S);\n\
    wt = (v-theta)*(1-exp(-kappa*T))/kappa + theta*T;\nvt = (v-theta)*exp(-kappa*T)\
    \ + theta_;\n% Integral\nF1 = (v-theta)/(kappa-kappa_);\nE1 = exp((kappa-kappa_)*T)\
    \ - 1;\nF2 = theta/kappa;\nE2 = exp(-kappa*T) -1;\nIntegral = exp(-kappa*T)*(F1*E1\
    \ + F2*E2);\n% Local Variance and Local Volatility\nut = vt + rho*sigma*xt/wt*Integral;\n\
    y = sqrt(ut);\n```\n\nThe C code is very similar and therefore not presented here.\n\
    \n# Numerical Illustration of Local Volatility\n\nWe illustrate local volatility\
    \ in the Heston model using a set of put options with 222\ndays to expiry, when\
    \ the spot price is $S = 30.67$. The Heston parameters associated\nwith this set\
    \ of options were estimated as $\theta = 0.007$, $\\kappa = 6.45 \times 10^{-6}$,\
    \ $\\sigma = 0.639$,\nv_0 = 0.579$, and $\rho = -0.085$. We obtain local volatility\
    \ $\\sigma_l(K, T)$ in (2.24)\nusing analytic derivatives and finite difference\
    \ approximations and we also obtain\nGatheral's (2006) approximate local volatility\
    \ in (2,44), for $T = 222/365$ and\nstrikes from $K = 15$ to $K = 65$. We have\
    \ also added the implied volatility\nfrom Heston put prices generated with the\
    \ parameter estimates. The results are\nillustrated in Figure 2.10.\n\nFigure\
    \ 2.10 illustrates the observation of Gatheral (2006) that the approximate\nform\
    \ of local volatility (solid red line) tends to be less curved than the exact\
    \ form.\nThe figure shows that the exact form using the analytic formula (solid\
    \ black\nline) and finite difference approximation [black circles] produce local\
    \ volatilities\nhat are nearly identical. Finally, the slope of local volatility\
    \ is roughly 1.9 times\nthat of implied, on average, which is consistent with\
    \ the rule of thumb\nof Derman et al. (1995) that local volatility is roughly\
    \ twice as steep as implied\nvolatility. Figure 2.10 is generated using the following\
