  md: "# The Heston Model for European Options\n\n```\nfunction y = HestonProb(phi,...,Trap);\n\
    x = log(S);\na = kappa+theta;\nd = sqrt((rho*sigma*i*phi - b)^2 - sigma^2*(2*u*i*phi\
    \ - phi^2));\ng = (b - rho*sigma*i*phi + d) / (b + rho*sigma*i*phi - d);\nif Trap=i\n\
    c = 1/g;\nD = (b - rho*sigma*i*phi + d)/sigma^2*(1-exp(-d*tau))\n = (1-exp(-d*tau))/(1-c);\n\
    G = (G-rho*i*phi+a)/a^2*(b-rho*sigma*i*phi-d)...\nelif Trap=0\ng = (G*exp(d*tau))/(1-g);\n\
    C = (r-g)*i*phi+a)/a^2*((b-rho*sigma*i*phi+d)...\nD = (b)\n\nf = exp(C+D*v0+i*phi)\n\
    y = real(exp(i*phi*log(K)+f/i));\n```\n\nThe second function calculates the price\
    \ of a European call C(K), or European put P(K), by put-call parity in Equation\
    \ (1.67). The function calls the HestonProb.m at every point of the integration\
    \ grid and uses the trapezoidal rule for integration when all integration points\
    \ have been calculated, using the built-in Matlab function trap.Chapter 5 presents\
    \ alternate numerical integration schemes that do not rely on Matlab functions\n\
    \n```\nfunction y = HestonPrice(PutCall,,..,trap,Lphi,Uphi,dphi)\nphi = [Lphi:Uphi];\n\
    \ = length(phi)\nfor k=1:N\nint1(k) = HestonProb(k),...,1;\nint2(k) = HestonProb(k),...,2;\n\
    I1 = trap(int1)*dphi;\nI2 = trap(int2)*dphi;\nP1 = 1/2 +1*pi/I1;\nP2 = 1/2 +1*pi/I2;\n\
    Hestonc = S*exp(-q*T)*P1 - K*exp(-r*T)*P2;\nHestonp = Hestonc -S*exp(-q*T)+ K*exp(-r*T)\n\
    ```\n\nPricing European calls and puts is straightforward. For example, the price\
    \ of a 6-month European put with strike K=100 on a dividend-paying stock with\
    \ S=100 and q=0.02, when the risk-free rate is r=0.03 and using the parameters\
    \ kappa=5, sigma=0.5, rho=-0.8, theta=v0=0.05, and lambda=0, along with the integration\
    \ grid phi=[0.000051] in increments of 0.001 is 5.7590. The price of the call\
    \ with identical features is 6.2528. If there is no dividend yield that q=0, as\
    \ expected, the put price decreases, to 5.3790, and the call price increases,\
    \ to 6.8678."
