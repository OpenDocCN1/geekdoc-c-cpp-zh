    nThe time-zero value of the tree at the initial node is given by $Y_0$, obtained
    by setting $t = 0$ in Equations (8.13) and (8.14). Conditional on $Y_t$, the up,
    middle, and down values of $Y_{i+dt}$ are


    ```

    $Y_{t+dt}^{u} = Y_t + (I + 1) \cdot k_t\sigma_y(0)\sqrt{dt}$,

    Y_{t+dt}^{m} = Y_t + I \cdot k_t\sigma_y(0)\sqrt{dt}$,

    Y_{t+dt}^{d} = Y_t + (I - 1) \cdot k_t\sigma_y(0)\sqrt{dt} \quad (8.29)

    ```


    where $I$ is the integer closest in absolute value


    ```

    $\frac{\mu_y(t)\sqrt{dt}}{k_t\sigma_y(0)}$

    ```


    In these expressions, $\sigma_y(0)$ is obtained by setting $t = 0$ in $\sigma_y(t)$
    by Equation (8.16). The probabilities of up, middle, and down are given by


    ```

    $P_y^u = \frac{1 \sigma_y^2(t)dt + e_u e_d}{2(k_t\sigma_y(0))^2dt},\nP_y^m = \frac{\sigma_y^2(t)dt
    + e_u e_d}{2(k_t\sigma_y(0))^2dt},\nP_y^d = \frac{1 \sigma_y^2(t)dt + e_d e_m}{2(k_t\sigma_y(0))^2dt}
    \quad (8.30)

    ```'
