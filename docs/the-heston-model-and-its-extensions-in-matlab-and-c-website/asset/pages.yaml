    \ and we obtain $S_{t+dt}$ from either (7.22) or by exponentiating (7.23), as\
    \ in (7.12).\n\nSimulation schemes can serve as a powerful illustrator of how\
    \ the Heston (1993) parameters affect the behavior of the stock price and the\
    \ volatility. In Chapter 2, for example, we saw that the parameter $\rho$ drives\
