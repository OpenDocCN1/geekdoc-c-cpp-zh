  md: '# Derivations Using the Fourier Transform


    # RECOVERY OF PROBABILITIES WITH GIL-PELAEZ FURIER INVERSION


    Recall from Chapters 1 and 2 that the in-the-money probabilities are


    Pr(\ln S_t > k) = \frac{1}{2} + \frac{1}{\pi} \int_{-\infty}^{\infty} \text{Re}\left\frac{e^{-iu\varphi(u)}}{iu}\right]
    du (3.8)


    where $k = \ln K$.


    We have supposed the $j$ index, and we have denoted $\varphi(u)$ to be the characteristic
    function for $\ln S_t$ evaluated at $u$. The probabilities expressed in the form
    of Equation (3.8) were derived by Gil-Pelez (1951) using the inversion theorem
    for Fourier transforms. The sign function $\sin \alpha$ plays in an important
    role in this derivation. It is defined as


    \sin \alpha = \begin{cases} |\alpha/\alpha| & \alpha \neq 0 \ 0 & \alpha = 0 \end{cases}
    (3.9)


    so that $\alpha = 1$ for $\alpha > 0$, $\alpha = -1$ for $\alpha < 0$, and $\alpha
    = 0$ for $\alpha = 0$. The sign function has its integral representation


    \sin \alpha = \frac{1}{\pi} \int_{-\infty}^{\infty} \frac{\sin \alpha x}{x} dx.
    (3.10)


    See, for example, Stuart (2010) for a derivation or Chacon (1991) for an introduction.
    Note $f(x)$ to be the density of $\ln S_t$ and $F(x)$ to be its distribution.
    Using the definition of the sign function in $y$, we can write for a fixed $y$


    \int_{-\infty}^{\infty} \sgn(x-y)f(x)dx = \int_{-\infty}^{\infty} \sgn(x-y)f(x)dx
    - \int_{-\infty}^{\infty} \sgn(y-x)f(x)dx\n= [1-F(y)] - F(y) = 1-2F(y). (3.11)


    To evaluate (3.11), we have broken up the integration range at $y$ and we have
    exploited the sign of $x-y$ over each region.\nTo begin the derivation of Equation
    (3.8), note that $f(x)$ can be recovered from $\varphi(u)$ by inversion, as in
    (3.2)


    f(x) = \frac{1}{2\pi} \int_{-\infty}^{\infty} e^{-ixu}\varphi(u) du. (3.12)


    We can express Pr($\ln S_t > k$) using the density, and substitute Equation (3.12)
    to obtain


    Pr(\ln S_t > k) = \int_{-\infty}^{\infty} f(x)dx = \frac{1}{2\pi} \int_{-\infty}^{\infty}
    (e^{-ixu}\varphi(u)) dx\n= \frac{1}{2\pi} \int_{-\infty}^{\infty} \varphi(u) \left(
    \int_{-\infty}^{\infty} e^{-ixu} dx \right) (3.13)'
