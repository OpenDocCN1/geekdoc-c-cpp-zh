- pgno: 203
  md: '# 194 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    # Moment-Matching


    The parameters $a, b, p, \beta$ are obtained by matching the first two moments
    of the non-central chi-square distribution to those of the approximate distributions.
    From recall Chapter 1 that the mean and variance of the CIR process are, respectively,


    ```

    $m = E[v_{t-dt}|v_t] = \theta + (v_t - \theta)e^{-\theta dt}\n$$s^2 = Var[v_{t-dt}|v_t]
    = \frac{\sigma^2 e^{-2\theta dt}}{\kappa}(1 - e^{-\theta dt}) + \frac{\theta\sigma^2}{2\kappa}(1
    - e^{-\theta dt})^2.(7.41)

    ```


    For moderate or high values of $v_t$, since $v_{t-dt} = a(b+Z_v^2)$ from (7.37),
    and since $Z_v^2$ is distributed chi-squared with two degrees of freedom, we have
    $E[v_{t-dt}] = a(1+b^2)$ and $Var[v_{t-dt}] = 2a^2(1+2b^2)$. Equating these to
    $a$ and $s^2$ and solving for $a$ and $b$ produces


    ```

    $b = \frac{2}{\psi} - 1 + \sqrt{\frac{2}{\psi}(\frac{2}{\psi} - 1)}, \quad a =
    \frac{m}{1+b^2}.7.42)

    ```


    where $\psi = s^2/m$ is only defined when $\psi \le 2$.

    For low values of $v_t$ the mean and variance of $v_{t-dt}$ are found by integrating
    Equation (7.38), which produces $E[v_{t-dt}] = (1-p)/\beta$ and $Var[v_{t-dt}]
    = (1-p^2)/\beta^2$. equating these to $a$ and solving for $p$ and $\beta$ produces


    ```

    $p = \frac{\psi-1}{\psi+1} \quad and \quad \beta = \frac{1-p}{m}.7.43)

    ```


    Note that the condition $p \ge 0$ requires that $\psi \ge 1$. We thus have the
    restriction that $1 \le \psi \le 2$. The value of $\psi$ stipulates which approximation
    to use. In fact, the first approximation requires $\psi \le 2$, while the second
    requires $\psi \ge 1$. This implies that a critical level $\psi_c \in [1,2]$ ought
    be defined as a threshold to switch between the two approximations. Andersen (2008)
    uses $\psi_c = 1.5$.

    The scheme can be summarized as:


    Given $v_t$, obtain $m$ and $s^2$ from Equation (7.41) using estimates of $\theta$
    and $\kappa$, and define $\psi = s^2/m \in [0,1].


    Draw a uniform random $U_v \in [0,1]$.

    If $\psi \le \psi$, compute $a$ and $b$ from (7.42), and compute $Z_v = \Phi^{-1}(U_v)$.
    Define $v_{t-dt} = a(b+Z_v^2)$ from (7.37).

    If $\psi > \psi$, compute $\beta$ and from (7.43). $v_{t-dt} = \Psi^{-1}(U_v)$
    from (7.39).


    In the same paper, Andersen (2008) presents the Truncated Gaussian (TG) scheme
    which uses the approximation $v_{t-dt} = (\mu+\sigma Z_v^2)$ for $\mu$ and $\sigma$
    constants.nThe performance of the TG scheme is inferior to that of the QE scheme,
    and Andersen recommends that the QE scheme be the default choice.'
  merge: -1
  img_proc: true
