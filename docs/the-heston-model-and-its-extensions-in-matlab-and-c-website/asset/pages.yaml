- pgno: 260
  md: "# 252 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe BisecMSIV.m\
    \ function can easily be modified to allow for an alternate pricing model for\
    \ Black-Scholes American puts, such as the trinomial tree or the approximation\
    \ of Barone-Adesi and Whaley (1987).\nThe function HestonObjFunMS.m performs the\
    \ RMSE loss function discussed in Chapter 6. Prices and implied volatilities are\
    \ obtained with the MSPrice.m and BisecMSIV.m functions, respectively.\n\n```\n\
    function y = HestonObjFunMSIV(param,MktIV,...)\nfor k=1:NK\n for t=1:NT\n ModelPrice(k,t)\
    \ = MSPrice(K(k),T(t),...,yinf);\n ModelIV(k,t) = BisecMSIV(k,T(t),\n ModelPrice(k,t),\
    \ ...);\n error(k,t) = (ModelIV(k,t) - MktIV(k,t)) ^ 2 /\n MktIV(k,t);\n\nend\n\
    % MSE loss function\ny = sum(sum(error));\n```\n\nParameter estimation is done\
    \ by passing the HestonObjMS function to the built-in Matlab function fmincon.m\
    \ for constrained minimization.\n\n```\n% kappa theta sigma v0 rho\nstart = [1.0,\
    \ 0.01, 3.2, 0.12, -0.05];\n% Estimation bounds\ne = 1e-3;\nlb = [e, e e e e e,\
    \ ..99];\nub = [20 25 5 2 .99];\n% Constrained minimization\n[param feval] = fmincon(p,\
    \ HestonObjFunMSIV(p, MktIV,...),\nstart,...,lb,ub);\n```\n\nThe C# code to obtain\
    \ the parameter estimates is similar to the Matlab code and not presented here.\n\
    We estimate parameters using IBM American put prices on the first maturity, 14\
    \ days. We test it Medvedev and Scaillet (2010) using four terms in the expansion,\
    \ and extract implied volatilities from these prices. Both sets of implied volatilities\
    \ appear in Figure 8.4. The mean square error between both sets of implied volatilities\
    \ is 3.13 × 10⁻⁴."
