    # CONCLUSION


    In this chapter, we have presented some of the finite difference methods that
    are commonly used to obtain European prices in the Heston model. These methods
    have been extended to obtain the prices of American options also. As we saw in
    Chapter 8, the explicit method is particularly simple to adapt for American options.
    Pricing methods that employ finite differences are varied and have been applied
    in a stochastic volatility framework by Clarke and Parrott (1999), In''T Hout
    and Foulon (2010), and Ikonen and Toivoanen (2008), among many others. Please
    see Tavalla and Randall (2000) and Duffy (2006) for an overview of finite differences
    for pricing European and American options.


    All of the methods we have encountered up to this chapter have dealt with either
    the European or American price. Central to option pricing theory, however, are
    the option price sensitivities to the inputs used in the price: the Greeks. This
    is the subject of the next chapter.'
