    \ by Ikonen and Toivanen (2008) for 2.0000, 1.107641, 0.213668, and 0.082036.\
    \ The following C# code is used to implement the LSM algorithm with the Moment-matching\
    \ method of Chapter 7 to simulate a set of stock price paths. The values of the\
    \ correlated random variables are generated once, and the same values are fed\
    \ into Moment Matching and LSM algorithms to obtain each American price. We use\
    \ 5000 stock paths and 1000 steps per path. We also calculate the variate prices,\
    \ using the closed-form European price obtained with 32-point Gauss-Laguerre quadrature.\n\
    \n```\n// Simulation settings\nint NS = 50000;\nint NT = 1000;\n// Generate the\
    \ correlated random variables\nfor(int t=0; t<NT-1; t++)\n{\n    for(int s=0;\
    \ s<NS-1; s++)\n    {\n        Zv[t,s] = RandomNorm();\n        Zs[t,s] = rho*Zv[t,s]\
    \ + Math.Sqrt(1-rho*rho)*RandomNorm();\n    }\n}\n// LSM Euro and American prices\n\
    settings.S = Spot[k];\nLSMPrice = HestonLSM(MMSim(param, settings, NT, NS, Zv,\
    \ Zs)));\nLSEuro[k] = LSMPrice[0];\nLSMAmerker[k] = LSMPrice[1];\n// Closed Euro\
    \ price\nClosedEuro[k] = HestonPriceGaussLaguerre(param, settings, X, W);\n//\
    \ Control variate price\nCAver[k] = ClosedEuro[k] + (LSMAmerker[k] - LSEuro[k]);\n\
    ```\n\nThe RandomNorm() function defined in Chapter 7 is used to generate independent\
    \ standard normal random variables. The MMSim() function generates the stock price\
    \ paths, using a different spot price at each \"k\" iteration. The matrix of paths\
    \ is first transposed using the MTrans() function before being passed to the HestonLSM()\
