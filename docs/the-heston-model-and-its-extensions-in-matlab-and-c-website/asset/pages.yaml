    \ of equations in (1.47). With $\\sigma=0$, the Riccati equation in (1.51) reduces\
    \ to the ordinary first-order differential\n\n```\n$$\\frac{\\partial D_i}{\\\
    partial \\tau} = P_i - Q_i D_i$\n```\n\nwhere $P_i = u_i\\phi - \\phi^2$ and $Q_i\
    \ = b_i$. The solution of $D_i$ is\n\n```\n$D(\\tau\n```\n\nAs for the general\
    \ case $\\sigma > 0$, (1.78) into the expression for $C_t$ in the second equation\
