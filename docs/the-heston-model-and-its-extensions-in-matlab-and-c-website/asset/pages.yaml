  md: "# The Fundamental Transform for Pricing Options\n\nwhere $g = -K = (\tilde{k}\
    \ + d)/(\tilde{k} - d)$ and $\\alpha - \beta = d$. The solution for $C(t)$ is\
    \ found by integration. The integral of $D(t)$ is\n\n```\n$$\\int_0^t D(y)dy =\
    \ \\frac{\tilde{k}+d}{2}\\int_0^t \\left( \\frac{1-e^{dy}}{1-ge^{dy}} \\right)dy\
    \ + K_1$\\n$$\\frac{\\tilde{k}+d}{2d}[dt + \\frac{1}{g}\\ln\\left( \\frac{1-ge^{dy}}{1-g}\
    \ \\right)] + K_1$\\n\\\\\\left[ \\frac{\\tilde{k}+d}{2}t - \\ln\\left( \\frac{1-ge^{dt}}{1-g}\
    \ \\right) \\right] + K_1$$\n```\n\nwhere $K_1$ is an integration constant. Hence,\n\
    \n```\n$C(t) = k\\hat{u}\\left[ \\frac{\\tilde{k}+d}{2}t - \\ln\\left( \\frac{1-ge^{dt}}{1-g}\
    \ \\right) \\right] (4.14)$\n```\n\nwe have applied the initial condition C(0)\
    \ so that $K_1 = 0$. The fundamental transform of the Heston model is therefore,\n\
    \n```\n$$\\hat{H}(k,v,\\tau) = \\exp(C(t) + D(t)v)$ (4.15)$\n```\n\nwhere $D(t)$\
    \ is given by Equation (4.13), and by (4.14). The initial condition at $t=0$ implies\
    \ that we set $v=v_0$, the parameter for the initial variance, in (4.15).\nThe\
    \ fundamental transform in (4.15) is identical to the characteristic function\
    \ derived in Chapter 1, with the notation $C(t)$ and $D(t)$ denoting $C(\\tau,\\\
    phi)$ and $D(\\tau,\\phi)$. Lewis (2020, Section 2.4) describes the conditions\
    \ under which $\\hat{H}(k,v,\\tau)$ is an analytic characteristic function.\n\n\
    # The Call Price using the Fundamental Transform\n\nRecall that the Lewis recipe\
    \ requires the payoff transform for the option being priced. To apply the Lewis\
    \ recipe to the European call price, we use the payoff transform obtained in Equation\
    \ (4.2). The integral to solve, is,\n\n```\n$C_t(K) = \\frac{1}{2\\pi}\\int_{i\\\
    infty}^{i\\infty} e^{-ikx} e^{-l(r-ik)^2t} \\hat{H}(k,v,\\tau) \\times \\frac{-K^{ik+1}}{k^2-ik}\
    \ dk$ (4.16)$\n```\n\nwhere $x$ is in $S_t$. Defining $X = \\ln(S_t/K) + (r-q)\\\
    tau$, the call price can be written in the form of Equation (2.2.8) in Lewis (2020),\n\
    \n```\n$C_t(K) = -\\frac{Ke^{-rt}}{2\\pi}\\int_{i\\infty}^{i\\infty} e^{-ikX}\
    \ \\frac{\\hat{H}(k,v,\\tau)}{k^2-ik} dk$ (4.17)$\n```\n\nwhere the integral is\
    \ defined for $1 < k < \\beta$. The strip of regularity for $\\hat{H}(k,v,\\tau)$\
    \ is $\\alpha < k < \\beta$, and the strip of regularity for the payoff transform\
    \ is $k_i > 1$. Hence, $C_t(K)$ is defined on the intersection of these two strips,\
    \ namely $1 < k_i < \\beta$."
