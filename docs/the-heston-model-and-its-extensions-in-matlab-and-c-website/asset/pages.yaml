  md: "# Time-Dependent Heston Models\n\n$C(\tau, \\phi)$ and $D_i(\tau, \\phi)$ for\
    \ notational convenience)\n\n$f(\\tau, x_t, v_t) = \\text{E}[exp(i\\phi x_t)]\
    \ = \\exp(C(\\tau, \\phi) + D(\\tau, \\phi)v_t + i\\phi x_t). \\quad (9.10)\n\n\
    Recall the initial conditions $C(0, \\phi) = D(0, \\phi) = 0$ were used to find\
    \ analytic expressions for $C(\\tau, \\phi)$ and $D(\\tau, \\phi)$, based on a\
    \ Riccati equation and an ordinary differential equation.\n\nIn this section,\
    \ the bivariate characteristic function of the joint process $(x_t, v_t)$ is derived.\
    \ This function is defined as\n\n$f(\\phi_1, \\phi_2; x_t, v_t) = \\text{E}[exp(i\\\
    phi_1 x_t + i\\phi_2 v_t)]. \\quad (9.11)\n\nDuffie, Pan, and Singleton (2000)\
    \ show that the characteristic function of a wide class of multivariate affine\
    \ models (of which the Heston model is a special case) has a log linear form and\
    \ can be obtained as a solution of matrix Riccati equations. Singleton (??) illustrates\
    \ this with the Heston model, which shows to be affine in $(x, v_t)$. The Heston\
    \ model can be written in terms of two independent Brownian motions $B_{1,t}$\
    \ and $B_{2,t}$,\n\n$dx_t = \\mu(x_t)dt + \\sigma(x_t)dB_t. \\quad (9.12)\n\n\
    where\n\n$\\mu_t = \\begin{pmatrix} r - \\frac{r}{2}v_t \\ \\kappa(\\theta - v_t)\
    \ \\end{pmatrix}, \\quad \\sigma(x_t) = \\begin{pmatrix} \\sqrt{v_t} & 0 \\ \\\
    rho\\sigma\\sqrt{v_t} & \\sigma\\sqrt{1-\\rho^2v_t} \\end{pmatrix}, \\quad dB_t\
    \ = \\begin{pmatrix} dB_{1,t} \\ dB_{2,t} \\end{pmatrix}. \\quad (9.13)\n\nThe\
    \ drift $\\mu$ and the matrix $\\sigma\\sigma^T$ in the Heston model can both\
    \ be written in the affine form\n\n$\\mu(x_t) = K_0 + K_1x_t + K_2v_t \\ \\sigma(x_t)\\\
    sigma(x_t)^T = H_0 + H_1x_t + H_2v_t. \\quad (9.14)\n\nwith\n\n$K_0 = \\begin{pmatrix}\
    \ 0 \\ K\\theta \\end{pmatrix}, \\quad K_1 = \\begin{pmatrix} 0 \\ 0 \\end{pmatrix},\
    \ \\quad K_2 = \\begin{pmatrix} 1 \\ -K \\end{pmatrix},\n\n$H_0 = H_1 = \\begin{pmatrix}\
    \ 0 & 0 \\ 0 & 0 \\end{pmatrix}, \\quad H_2 = \\begin{pmatrix} 1 & \\rho\\sigma\
    \ \\ \\rho\\sigma & \\sigma^2 \\end{pmatrix}$.\n\nThe result of Duffie, Pan, and\
    \ Singleton (2000) is that the characteristic function has the log-linear form\n\
    \n$f(\\phi_1, \\phi_2; x_t, v_t) = \\exp(A(\\tau, \\phi_1, \\phi_2) + B(\\tau,\
    \ \\phi_1, \\phi_2)x_t + C(\\tau, \\phi_1, \\phi_2)v_t) \\quad (9.15)"
