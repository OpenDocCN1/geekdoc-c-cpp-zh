  md: "# 264 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nSimilarly, the\
    \ general solution for $C_i(\\phi, \tau)$ was\n\n```\n$C_i(\\phi, \tau) = (r-q)\\\
    phi\tau + \\frac{a}{d_i} \\left( \\frac{O_i+d_i}{\\sigma_i^2} \\right)^{\\exp(d_i,\
    \ \tau)} \\left( \\frac{1-x}{1-g_ix} \\right)^{\\frac{1}{x}}dx + k_i$ \\quad (9.4)\n\
    ```\n\nfor a constant $k_i$. The initial condition $C_i(\\phi, 0) = 0$ produced\
    \ $k_i = 0$ and the solution for $C_i(\\phi, \tau)$ given by\n\n```\n$C_i(\\phi,\
    \ \\tau) = (r-q)\\phi\\tau + \\frac{a}{\\sigma_i^2} \\left[ (b_i - \\rho\\sigma\\\
    phi + d_i)\\tau - 2\\ln \\left( \\frac{1-g_ie^{d_i\\tau}}{1-g_i} \\right) \\right]$\
    \ \\quad (9.5)\n```\n\nSuppose that instead of the initial conditions $C_i(\\\
    phi, 0) = D_i(\\phi, 0) = 0$, we use the general non-zero initial conditions\n\
    \n```\n$C_i(\\phi, 0) = C_i^0, \\quad D_i(\\phi, 0) = D_i^0.$ \\quad (9.6)\n```\n\
    \nThis generalization is illustrated by Mikhailov and Nögel (2003) and letting\
    \ $\tau=0$ in Equation (9.1), equating the result to the initial condition $D_i^0$,\
    \ and solving for $K_i$,\n\n```\n$\\tilde{K}_i = -\\hat{K}_i = \\begin{cases}\
    \ \\frac{2b_i + D_i\\sigma^2}{2\\alpha_i + D_i^2} \\ \\frac{b_i - \\rho\\sigma\\\
    phi + d_i - D_i^0\\sigma^2}{b_i - \\rho\\sigma\\phi - d_i} \\end{cases}$ \\quad\
    \ (9.7)\n```\n\nNow define $\\hat{g}_i$. Substituting $\\hat{K}_i$ back into (9.1),\
    \ it is easy to see that the solution for $D_i(\\phi, \tau)$, the non-zero initial\
    \ condition in (9.6) holds\n\n```\n$\\tilde{D}_i(\\phi, \\tau) = \\frac{(b_i -\
    \ \\rho\\sigma\\phi + d_i) - (b_i - \\rho\\sigma\\phi - d_i)\\hat{g}_ie^{\\d_i\\\
    tau}}{\\sigma^2(1-\\hat{g}_ie^{\\d_i\\tau})}$ \\quad (9.8)\n```\n\nThe notation\
    \ $\tilde{D}_i(\\phi, \tau)$ is meant to distinguish it from its time-static counterpart\
    \ $D_i(\\phi, \tau)$. The general condition $C_i(\\phi, 0) = C_i^0$ produces $k_i\
    \ = C_i^0$ and the solution for $C_i(\\phi, \tau)$ given by\n\n```\n$\\tilde{C}_i(\\\
    phi, \\tau) = (r-q)\\phi\\tau + \\frac{a}{\\sigma_i^2} \\left[ (b_i - \\rho\\\
    sigma\\phi + d_i)\\tau - 2\\ln \\left( \\frac{1-\\hat{g}_ie^{\\d_i\\tau}}{1-\\\
    g_i} \\right) \\right] + C_i^0.$ \\quad (9.9)\n```\n\nNote that the solution for\
    \ $\tilde{C}_i(\\phi, \tau)$ is identical to $C_i(\\phi, \tau)$, except that $g_i$\
    \ is replaced by $\\hat{g}_i$, and $k_i=0$ is replaced by $C_i^0$. Note also that\
    \ setting $C_i^0=D_i^0$ in Equations (9.8) and (9.9) reduces $\tilde{C}_i(\\phi,\
    \ \tau)$ and $\tilde{D}_i(\\phi, \tau)$ to their original Heston (1993) forms\
    \ $C_i(\\phi, \tau)$ and $D_i(\\phi, \tau)$, respectively.\n\n# BIVARIATE CHARACTERISTIC\
    \ FUNCTION\n\nIn Chapter 1, it was shown that the characteristic function of the\
    \ log asset price at maturity, $x_T = \\ln S_T$, is of the following form (dropping\
    \ the $j$ subscripts on $f_j$,"
