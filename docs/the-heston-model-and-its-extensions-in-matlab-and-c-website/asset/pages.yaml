  md: "# 174 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_183_0.png)\n\
    \nFIGURE 6.3 RNDs for the S&P500 Data\n\nlonger maturities are better behaved.\
    \ To verify the third property, we note that the RND is also able to recover the\
    \ market prices of the calls fairly well, but these are not shown here to conserve\
    \ space.\n\nThe RNDs of the four maturities are plotted in Figure 6.3. These RNDs\
    \ behave as expected. In particular, the RNDs for the longer maturities are more\
    \ spread out than those for the short maturities, reflecting increasing market\
    \ uncertainty about prices with increasing maturity. Also note the negative skew\
    \ in each density, induced by the negative correlation used to generate them.\n\
    \nThe parameter estimates de-listed in Figure 6.3 were those of the RMSE loss\
    \ function from the second row of Table 6.1. The RNDs generated using the MSE\
    \ and IVMSE parameters from Table 6.1 will produce similar results. The Christoffersen\
    \ et al. (2009) parameters, however, will produce RNDs with a pronounced skew,\
    \ owing to the extreme level of the correlation parameter, $\rho = -0.9921$.\n\
    \nThe RND is a convenient tool for verifying the absence of arbitrage strikes,\
    \ since it is designed for a single maturity, it cannot verify the absence of\
    \ arbitrage across maturities. As explained by Carr and Madan (2005), ensuring\
    \ the absence of calendar arbitrage usually involves verifying that calendars\
    \ have a non-negative price. Kah (2004) and Fengler (2009) show that a test of\
    \ calendar arbitrage can be formulated in terms of the total implied variance\
    \ $\nu^2(K, \tau_i) = IV^2(K, \tau_i) \times \tau_i$, where $IV(K, \tau_i)$ is\
    \ the implied volatility corresponding to strike $K$ and maturity $\tau_i = T_i\
    \ - t$. The test stipulates that there is no calendar arbitrage if $\nu^2(K, \t\
    au_i)$ is a strictly increasing function of $\tau_i$."
