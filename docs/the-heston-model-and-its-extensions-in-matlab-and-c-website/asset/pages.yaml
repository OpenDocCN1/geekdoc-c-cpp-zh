    U = max(0, Si, K);\n```\n\nFinally, the last part of the function loops through\
    \ time and applies the ADI scheme. It re-arranges the vector U^ into a matrix,\
    \ and interpolates the matrix to find the European call price at the desired values\
    \ of S0 and V0.\n\n```\nfor t=2:NT\nu = U;\nY0 = (I + dt.*(A0+A1+A2)).*u;\nY1\
