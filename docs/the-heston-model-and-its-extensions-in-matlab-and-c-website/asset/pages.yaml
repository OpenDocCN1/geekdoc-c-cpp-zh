- pgno: 214
  md: '# 206 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    The American option is valued by comparing the value of immediate exercise, which
    is known, with $F(\omega, t_k)$, which is unknown. Longstaff and Schwartz (2001)
    estimate $F(\omega, t_k)$ using least squares on a set of basis functions, which
    select to the weighted Laguerre polynomials we encountered in Chapter 5


    ```

    $L_0(x) = e^{-x^2/2},$

    $L_1(x) = e^{-x^2/2}(1 - x),$

    $L_2(x) = e^{-x^2/2}(1 - 2x + x^2/2), \dots$

    $L_M(x) = e^{-x^2/2} \frac{(-1)^M}{r!} \left( M \right)^r x''.$hfill (8.2)

    ```


    Using the first M basis functions, $F(\omega, t_k)$ can be approximated by


    ```

    $F(\omega, t_k) = \sum_{j=0}^M a_j L_j(S_k)$ \hfill (8.3)

    ```


    where $S_k = S_k(\omega)$ is the value of the underlying stock price at time $t_k$
    along the price path $\omega$. The coefficients $a_j$ are estimated using least
    squares. Equation (8.3) can be written in matrix form, as $F = \mathbf{La}$,


    ```

    $$\mathbf{F}_{K+1} = \begin{pmatrix} F(\omega, t_1) \ F(\omega, t_2) \ \vdots
    \ F(\omega, t_K) \end{pmatrix}, \mathbf{L}_{K:N} = \begin{pmatrix} L_0(S_1) &
    L_1(S_1) & \dots & L_M(S_1) \ L_0(S_2) & L_1(S_2) & \dots & L_M(S_2) \ \vdots
    & \vdots & \ddots & \vdots \ L_0(S_K) & L_1(S_K) & \dots & L_M(S_K) \end{pmatrix},
    \mathbf{a} = \begin{pmatrix} a_0 \ a_1 \ \vdots \ a_M \end{pmatrix}$ \hfill (8.4)

    ```


    With $N+1$. Longstaff and Schwartz (2001) emphasize that other basis functions
    are possible, and even simple powers of $S_k$ will yield accurate approximations
    to the American option price.

    The cash flows at time $t_k$ depend on whether or not exercise occurs at $t_{k+1}$.
    If exercise occurs, the cash flows going forward will change. Hence, it is not
    possible to determine the cash flows at $t_k$ by going forward. Consequently,
    Longstaff and Schwartz (2001) apply the LSM algorithm to approximate the cash
    flows backward, from $t_{T-1}$ to $t_1$. At time $t=T$, the cash flow is the simple
    payoff. At each time $t_k$ ($2 \le k \le K-1$), we find all stock price paths
    that are in-the-money and discount by one the cash flows at $t_{k+1}$. We then
    estimate the $M+1$ coefficients $a_0, \dots, a_M$ of Equation (8.3) by regression,
    using the basis functions in a design matrix, and the single-perioded regression
    estimates are, therefore,


    ```

    $\hat{\mathbfmathbfa}} = (L^T L)^{-1} L^T F.$ \hfill (8.5)

    ```


    For, example, Kutner et al. (2004). Next, we frame the predicted continuation
    value $F(\omega, t_{k-1})$ by the fitted regressions from


    ```

    $\hat{F}(\omega, t_{k-1}) = \hat{a}_0 L_0(S_{k-1}) + \hat{a}_1 L_1(S_{k-1}) +
    \dots + \hat{a}_M L_M(S_{k-1})$ \hfill (8.6)

    ```'
