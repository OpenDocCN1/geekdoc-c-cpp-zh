    function y = dp2p1k2_2(phi...)

    % Original Heston formulation.

    G = (1 - g*exp(d*T))/(1-g);

    C = rf+i*phi*T + kappa*sigma/sigma^2 * ...

    D = (b - rho*sigma+i*phi + d)/sigma * ...

    % The real part of the integrand

    f2 = exp(C + D*Dv0 + i*phi) * *

    y = real(i*phi-1) + K*(-i*phi-1) * f2;

    ```


