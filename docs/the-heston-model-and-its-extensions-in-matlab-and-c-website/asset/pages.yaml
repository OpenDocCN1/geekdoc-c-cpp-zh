  md: '# CHAPTER 12


    # # The Double Heston Model


    Abstract


    The original Heston (1993) model is not always able to fit the implied volatility
    smile very well, especially at short maturities. One remedy is to add additional
    parameters, which allows the model to be more flexible. This can be accomplished
    by allowing the parameters to be time dependent, as illustrated by the methods
    covered in Chapter 9. Another approach is to enrich the variance process. One
    simple way to do this is to specify a two-factor structure for the volatility.
    This is the approach of Christoffersen et al. (2009) in their double Heston model,
    which we present in this chapter.


    In this chapter, we first present the multi-dimensional Feynman-Kac theorem, and
    we show that the double Heston model is affine in the sense of Duffie et. (2000).
    These results are used to obtain the characteristic function of the double Heston
    model. We then show how the double Heston model is a simple extension of its univariate
    counterpart, and how its extra parameters allow for a better fit of the implied
    volatility smile at multiple maturities. We also show that the “Little Trap” formulation
    of the characteristic function of Albrecher et al. (2007) can be applied to the
    double Heston model. Finally, we present different simulation schemes that can
    be applied to the double Heston model. Most of these schemes are extensions of
    univariate schemes presented in Chapter 7.


    # MULTI-DIMENSIONAL FEYMAN-KAC THEOREM


    The bivariate version of this theorem was presented in Chapters 2 and 9. In this
    section, we state the multi-dimensional version. Suppose that the vector $x$,
    follows the $n$-dimensional stochastic process


    ```

    dx_t = \mu(x_t,t) + \sigma(x_t,t)dB_t \quad (12.1)

    ```


    where $x$ and $\mu(x_t,t)$ are each vectors of dimension $n$, $B_t$ is a vector
    of $m$-dimensional independent-Brownian motion, and $\sigma(x_t,t)$ is a volatility
    matrix of size $n \times m$. We can write Equation (12.1) as


    ```

    $$\begin{aligned} dx_{(t)}(t) & = \begin{pmatrix} \mu_1(x_t,t) \ \vdots \ \mu_n(x_t,t)
    \end{pmatrix} dt + \begin{pmatrix} \sigma_{11}(x_t,t) & \dots & \sigma_{1m}(x_t,t)
    \ \vdots & & \vdots \ \sigma_{n1}(x_t,t) & \dots & \sigma_{nm}(x_t,t) \end{pmatrix}
    \begin{pmatrix} dB_{(1)}(t) \ \vdots \ dB_{(m)}(t) \end{pmatrix} \end{aligned}
    \quad (12.2)$

    ```'
