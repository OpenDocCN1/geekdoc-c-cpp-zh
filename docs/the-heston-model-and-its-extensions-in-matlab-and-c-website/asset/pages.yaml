- pgno: 249
  md: "# American Options\n\n# 241\n\nThe terms inside the sum are defined as\n\n\
    ```\n$P_n(\theta, v) = C_n(v)[p_n^\theta(\theta)\\Phi(v) + q_n^\theta(\theta)\\\
    phi(\theta)] + p_n^v(\theta, v)\\Phi(v) + q_n^v(\theta, v)\\phi(v)$$\n$= C_n(v)P_n^\t\
    heta(\theta) + P_n^v(\theta, v)$. (8.55)\n```\n\nNote that the polynomials superscripts\
    \ with 1 depend on $v$ as well as $\theta$, and that $C_n$ coefficients depend\
    \ on $v$. To simplify the notation, we write $p_n'^\theta = p_n^\theta(v)$, $q_n'^\t\
    heta = q_n^\theta(v)$, $p_n'^v = p_n^v(v)$, $q_n'^v = q_n^v(v)$, and $C_n' = C_n(v)$.\n\
    \nRecall the Heston PDE from Chapter 1, written here using the notation of Medvedev\
    \ and Schweizer (2010) and using $\theta$ to define the mean reversion of the\
    \ variance process\n\n```\n$P_t + (r-q)SP_S + \\frac{1}{2}vS^2P_{SS} - rP + \\\
    mu vSP_{sv} + \\frac{1}{2}\\sigma^2vP_{vv} + \\kappa(\\bar{\theta}-v)P_v = 0$.\
    \ (8.56)\n```\n\nRedefine the normalized money as\n\n```\n$$\\theta = \\frac{\\\
    ln(K/S)}{\\sqrt{v}}$ (8.57)\n```\n\nand consider the transformation from $P(S,v,t)$\
    \ to $P(\\theta,v,t)$. We need the following derivatives, obtained as total derivatives\
    \ and by applying the chain rule\n\n```\n$P_t = \\frac{\\theta}{2\\tau}P_\\theta\
    \ - P_\tau$,$\n$P_S = P_\\theta = \\frac{-1}{S\\sqrt{v}}P_\\theta$,$\n$P_{SS}\
    \ = P_{\\theta\\theta}\\theta^2 + P_{\\theta v}S = \\frac{1}{S^2v}P_{\\theta\\\
    theta} + \\frac{1}{\\sqrt{v}}P_{\\theta v}$,$\n$P_v = P_v + P_{\thetatheta v =\
    \ P_v - \\frac{\\theta}{v}P_\\theta$,$\n$P_{vs} = P_{\theta v} - \\frac{2\\theta}{v}(P_{\\\
    theta\\theta}\\theta + P_{\\theta v}) = \\frac{-1}{S\\sqrt{v}}P_{\\theta v} +\
    \ \\frac{2\\theta}{2v^{3/2}}\\sqrt{\\theta}P_{\\thetatheta}$,$\n$P_{vv} = P_{vv}\
    \ - \\frac{\\theta}{v^2}P_v + \\frac{\\theta^2}{4v^2}P_\\theta$. (8.58)\n```\n\
    \nWe have used the following derivatives of $\theta$,\n\n```\n$$\\theta_S = \\\
    frac{-1}{S\\sqrt{v}}$, $\\theta_{SS} = \\frac{1}{S^2v\\sqrt{v}}$,$\n$\\theta_{Sv}\
    \ = \\frac{1}{2v^{3/2}}$,$\n$\\theta_v = \\frac{-\\theta}{2v}$, $\\theta_{vv}\
    \ = \\frac{-\\theta-\\theta_v}{v^2}$. (8.59)\n```"
