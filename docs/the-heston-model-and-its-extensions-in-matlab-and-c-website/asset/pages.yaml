- pgno: 77
  md: "# Derivations from the Fourier Transform\n\n# DERIVATION OF GATHERAL (2006)\n\
    \nGatheral (2006) delivers the Albrecher et al. (2007) formulation of Heston (1993)\
    \ characteristic function by working with the log-moneyness of the forward price,\
    \ $x_i = \\ln(F_{i,T}/K)$, where $K$ is the strike price of the option and where\
    \ $F_{i,T} = S_i e^{r(T-t)}$ is the forward price of the stock. His derivation\
    \ is sleightly different than that of Heston (1993) since Gatheral works with\
    \ the Fourier transforms of the in-moneyness probabilities $P_1$ and $P_2$ directly.\n\
    \nConsider again SDE for the variance $v_i$, defined in Chapter 1\n\n```\n$dv_i\
    \ = \\kappa(\\theta - v_i)dt + \\sigma\\sqrt{v_i}dW_{2,t}.$\n```\n\nApplying Itô's\
    \ lemma shows that x, follows the stochastic process\n\n```\n$dx_i = -\\frac{1}{2}v_idt\
    \ + \\sqrt{v_i}dW_{2,t}.$\n```\n\nGatheral (2006) assumes the market price of\
    \ volatility risk to be zero, so that $\\lambda(S,v,t)=0$. With x, defined $x_i\
    \ = \\ln(F_{i,T}/K)$ instead of $x_i = \\ln S_t$, the terminal condition for the\
    \ in-moneyness probabilities defined in Chapter 1 becomes\n\n```\n$P_i(x,v,0)\
    \ = \\mathbf{1}_{x>0} \\quad (3.19)$\n```\n\nfor $i=1,2$. With these modifications,\
    \ the partial differential equation (PDE) for $P_i$\n\n```\n$$\\frac{\\partial\
    \ P_i}{\\partial t} + \\rho\\sigma v\\frac{\\partial P_i}{\\partial x\\partial\
    \ v} + \\frac{1}{2}v^2\\frac{\\partial^2 P_i}{\\partial x^2} + 2\\rho\\sigma v\\\
    frac{\\partial^2 P_i}{\\partial v^2} + \\mu v\\frac{\\partial P_i}{\\partial x}\
    \ + (a-b_v)\\frac{\\partial P_i}{\\partial v} = 0 \\quad (3.20)$\n```\n\nwhere\
    \ $u_1 = \\frac{1}{2}, u_2 = -\\frac{1}{2}$ and $a = \\kappa\\theta$. The parameters\
    \ $u_1, u_2$ and $a$ remain the same as in Chapter 1, but $b_1 = \\kappa-\\rho$,\
    \ and $b_v$ are refined if it is assumed that $\\lambda=0$. The transformation\
    \ of the $PDE$ from $t$ to the time to maturity $\tau=T-t$ explains the minus\
    \ sign in front of the first derivative in Equation (3.20).\n\nIn this section,\
    \ it is more convenient to define the integration by $k$ rather than $u$. The\
    \ form of the Fourier transform used by Gatheral (2006) is slightly different\
    \ than that in Equation (3.1). It replaces $e^{ix}$ with $e^{-iks}$ in the inverse\
    \ Fourier transform (3.2). The derivative in (3.4) is thus $f'(k)=ikf(k)$.\n\n\
    Consider the Fourier transform $\\hat{P}_i$ of the probabilities $P_i = P_i(x,v,\\\
    tau)$\n\n```\n$$\\hat{P}_i(k,v,\\tau) = \\int_{-\\infty}^{\\infty} e^{-iks}P_i(x,v,\\\
    tau)dx$\n```\n\nUsing the terminal condition (3.19) we have\n\n```\n$$\\hat{P}_i(k,v,0)\
    \ = \\int_{-\\infty}^{\\infty} e^{-iks}\\mathbf{1}_{x>0}dx = -\\frac{e^{-iks}}{ik}|_{x=0}\
    \ = \\frac{1}{ik}$\n```"
