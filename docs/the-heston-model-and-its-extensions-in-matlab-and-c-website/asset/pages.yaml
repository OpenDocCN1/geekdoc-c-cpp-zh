    \ = \\infty$.$\nCase 2. $D \\ge 0$ and $a > 0$\n$T^* = \\frac{1}{\\gamma\\sigma^2}\\\
    ln(\\frac{a+\\gamma}{a-\\gamma})$, where $\\gamma = \\frac{\\sqrt{D}}{2}$.$\n\
    Case 3. $D < 0$\n$T^* = \\frac{2}{\\beta\\sigma}(\\pi1_{a} + \\arctan(2\\beta/\\\
