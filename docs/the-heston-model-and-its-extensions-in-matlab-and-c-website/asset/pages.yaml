  md: "# The Double Heston Model 369\n\nAs first mentioned in Chapter 6, the problem\
    \ with IVRMSE and other objective functions that use implied volatility is that\
    \ the model implied volatility IV_ik must be obtained at every iteration of the\
    \ optimization, which is computationally intensive. To address this issue, in\
    \ Chapter 6 we introduced the Christoffersen et al. (2009) function of (2.12)\n\
    \n```\n$$\\frac{1}{N} \\sum_{i,k} w_{ik} \\frac{C_{ik} - C_{ik}^{BS}}{Vega_{ik}^2}\
    \ = (12.22)$\n```\n\nwhere $C_{ik}$ and $C_{ik}^{BS}$ are the market and call\
    \ prices, respectively, and $Vega_{ik}$ is the Black-Scholes ve evaluated at the\
    \ strike $K_i$, at the maturity $\tau_k$, using the market implied volatility\
    \ $IV_{ik}$ as the volatility input. The Black-Scholes vegas is given by\n\n```\n\
    $Vega_{ik} = S \\exp(-q\\tau_k)(d_{ik})\\sqrt{\\tau_k} = (12.23)$\n```\n\nwhere\n\
    \n```\n$d_{ik} = \\frac{\\ln(S/K_k) + (r-q+IV_{ik}^2/2)\\tau_k}{IV_{ik}\\sqrt{\\\
    tau_k}} = (12.24)$\n```\n\nand $n(x) = \\exp(-x^2/2)/\\sqrt{2\\pi}$ is the standard\
    \ normal density. The loss function in Equation (12.22) is implemented with the\
    \ Matlab function DoubleHestonObjFun.\n\n```\nfunction y = DoubleHestonObjFun(...)\n\
    for t=1:NT\nfor k=1:NK\nMP(k,t) = DoubleHestonPriceGaussLaguerre(K(k),T(t),...)\n\
    BSVega(k,t) = BSV(K(k),MktIV(k,t),T(t),...)\nerror(k,t) = (MP(k,t) - MktPrice(k,t))^2\
    \ ...;\nend\nny = sum(error));\n```\n\nThe function allows for MSE and RMSE loss\
    \ functions, and can be easily modified to add additional loss functions. The\
    \ BSV function is a Matlab function that computes vega.\n\nWe can also use the\
    \ Strike Vector Computation method of Kilin (2007) described in Chapter 6 to estimate\
    \ the parameters of the double Heston model, which reduces the estimation time\
    \ dramatically. This is accomplished with the Matlab function DoubleHestonObjFunSVC.\n\
    \n```\nfunction y = DoubleHestonObjFunSVC(param,...)\nfor t=1:NT\nfor j=1:length(x)\n\
    phi = x(j);\n```"
