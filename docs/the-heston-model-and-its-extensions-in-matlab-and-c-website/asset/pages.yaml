  md: "The ordinary objective function produces exactly the same parameter estimates\n\
    as in the first row of Table 6.1, as expected. The SVC objective function using\n\
    either the Heston or the Attari characteristic functions are comparable in terms\
    \ of\ncomputation time. Finally, the FRFT returns the parameter estimates very\
    \ quickly,\nrequiring less than 10 percent of the time than the ordinary objective\
    \ function.\nThe parameter estimates from the different estimation methods, as\
    \ well as the values of\nIMMSE, are very close.\n\nThe conclusion is evident:\
    \ when possible, the SVC method or the FRFT should\nbe used to estimate the Heston\
    \ parameters. Note however, that the FRFT settings\nbe used with care. Setting\
    \ the number of points too high in the FRFT function\nwill slow down the FRFT\
    \ estimation, with little or no gain in precision.\n\n# DIFFERENTIAL EVOLUTION\n\
    \nThe Differential Algorithm of Storn and Price (1997) has been applied to option\n\
    pricing by Nykvist (2009) and Gilli and Schumann (2011). Vollrath and Wendland\n\
    2009 have applied the algorithm to the Heston model and have found the\nalgo effective\
    \ in identifying the global minimum in the parameter space,\nalbeit the expense\
    \ of high computation time. The algorithm updates a randomly\nchosen population\
    \ of parameter values by creating a new candidate from\neach existing member,\
    \ and the candidate replaces the member in the population if the candidate's\n\
    objective function is smaller than the member's. A new population is then created,\n\
    and the process is repeated over successive iterations, or generations. In the\
    \ final\ngeneration, the member with the smallest value of the objective function\
    \ is chosen\nas the solution.\n\nThe DE algorithm can then be implemented in the\
    \ following steps.\n\n+   Step 1. Initial selection of the population. Form a\
    \ matrix of size $5 \\times N_p$ of\nrandomly chosen parameter values, where $N_p$\
    \ is the number of population\nmembers. The matrix must be constructed so that\
    \ each respects the\\constraints on the parameters. Lower and upper bounds can\
    \ be chosen so\nthe random values for the parameters are reasonable, for example,\n\
    $0 < \\kappa < 20, \theta_i v_{0,i}, \\sigma < 2$, and $-1 < \rho < 4$. In order\
    \ for Step 2 to work,\nwe must have $N_p$ we have the population\n\n```\n$P =\
    \ (mathbf{x}_1 \\quad \\mathbf{x}_2 \\quad \\dots \\quad \\mathbf{x}_{N_p})_{(5\
    \ \\times N_p)}$ \\(6.11)\n```\n\neach member of $P$ is a vector of parameters,\
    \ namely\n$\\mathbf{x}_i = (\\kappa_i, \theta_i, \\sigma_i, v_{0,i}, \rho_i)^T$.\n\
    \n+   Step 2. Mutation of the population members. For each member $\\mathbf{x}_i$\
    \ of the\npopulation $(i = 1, \\dots, N_p)$, randomly select three members $\\\
    mathbfmathbf{x}_{r_1}, \\mathbf{x}_{r_2},$\nand $\\mathbf{x}_{r_3}$ distinct from\
    \ each other and from $\\mathbf{x}_i$. This implies that\nwe must select the indices\
    \ $r_1, r_2$, and $r_3$ so that $i \\neq r_1 \\neq r_2 \\neq r_3$. For each\n\
    member, we define a donomer member defined by\n\n```\n$\\mathbf{y}_i = \\mathbf{x}_{r_1}\
    \ + F(\\mathbf{x}_{r_2} - \\mathbf{x}_{r_3})$ \\(6.12)\n```"
