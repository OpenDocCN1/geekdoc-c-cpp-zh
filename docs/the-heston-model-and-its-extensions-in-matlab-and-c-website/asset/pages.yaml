    # # CONCLUSION


    In this chapter, we have presented formulas for the Greeks of the Heston (1993)

    model. All of the closed-form pricing formulas can be differentiated analytically
    to

    yield Greeks. The fast Fourier transform and its fractional counterpart can both\produce
    a large set of Greeks quickly. In addition, it is straightforward to obtain

    Greeks from American options with the explicit finite difference method, the expansion
    of Medvedev and Scaillet (2010), and the LSM algorithm. However, however,autions
    cautions that obtaining Greeks with simulation can cause difficulties for

    but the simplest derivatives. Other methods to compute Greeks include the stepwise

    method and likelihood ratio method of Broadie and Glassmann (1996) described

    in Glasmann (2003) and Chan and Joshi (2010b). Broadie and Kaya (2004)

    obobtain pathwise and likelihood ratio Greeks under their exact simulation scheme

    (Broadie and Kaya, 2006). Benhamoum (2002) and Davis and Johansson (2005),

    among others, apply Malliavin calculus to obtain simulation-based Greeks in the

    Heston model.'
