    Evaluation of the call price in Equation (5.19) requires the discretization of
    the range of strikes and of the integration domain. We can approximate the call
    price by the trapezoidal rule over the truncated integration domain $[0,b]$ using
    N equidistant points


    ```

    $$\nu_j = (j-1)\eta$ for $j=1, \dots, N$ \quad (5.21)$

    ```'
