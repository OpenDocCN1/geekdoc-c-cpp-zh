  md: '# # Simulation of the Heston Model


    Apply Euler discretization to the last term in (7.15) to obtain


    ```

    $$\int_t^{t+dt} (\sigma_u \sigma_v) dW_u dW_s \approx \sigma''_u \sigma''_v \int_t^{t+dt}
    W_u dW_s = \sigma''_u \sigma''_v (W_s - W_t) \n = \sigma''_u \sigma''_v (\int_t^{t+dt}
    W_u dW_s - W_{t+dt} + W_t^2) \quad (7.16)$

    ```


    To solve the remaining integral in (7.16), $dY_t = Y_t dW_t$. Using Ito’s lemma,
    it is to show that $Y_t$ has the solution $Y_t = \frac{1}{2}W_t^2 - \frac{1}{2}t$.
    Indeed, we have $\partial Y/\partial \bar{t} = -\frac{1}{2}$, $\partial Y/\partial
    W = W$ and $\partial^2 Y/\partial W^2 = 1$, so


    ```

    $dY_t = (-\frac{1}{2} + 0 \times 1 \times 1) dt + (W_t \times 1) dW_t = W_t dW_t.$

    ```


    Applying this result, we can write


    ```

    $$\int_t^{t+dt} W_s dW_s = Y_{t+dt} - \frac{1}{2}W_{t+dt}^2 - \frac{1}{2}W_t^2.
    \quad (7.17)$

    ```


    Substitute back into (7.16) to obtain


    ```

    $$\int_t^{t+dt} (\sigma_u \sigma_v) dW_u dW_s \approx \frac{1}{2}\sigma''_u\sigma''_v[(W_{t+dt}
    - W_t)^2 - dt] \n = \frac{1}{2}\sigma''_u\sigma''_v[(\(\Delta W_t)^2 - dt] \quad
    (7.18)$

    ```


    $\Delta W_t = W_{t+dt} - W_t$, which is equal in distribution to $\sqrt{dt}Z$
    with $Z$ distributed as standard normal. Combining Equations (7.15) and (7.18),
    and the general form of Milstein discretization, is


    ```

    $X_{t+dt} = X_t + \mu_t dt + \sigma_t \sqrt{dt}Z + \frac{1}{2}\sigma_t\sigma''_t
    dt(Z^2 - 1). \quad (7.19)$

    ```


    Hence, Milstein discretization of $dX$ in Equation (7.19) is identical to Euler
    discretization in (7.5), except for the extra term $\frac{1}{2}\sigma_t\sigma''_t(Z^2
    - 1)$ that appears in (7.19). This extra term improves the accuracy of Milstein
    discretization over Euler discretization.


