  md: "# 282 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe function Ellices.m\
    \ uses the characteristic function to produce the Heston call or put price with\
    \ time-dependent parameters. The current parameters are in the vector param, with\
    \ the fixed parameters from the previous periods are in the matrix paramfixed.\n\
    \n```\nfunction y = ElicesPrice(...,param,paramfixed)\nMat = T(end);\n% Numerical\
    \ integration\nfor k=1:length(x)\n  phi = x(k);\n  weight = w(k);\n  f2(k) = ElicesCF(phi\
    \ ,param,paramfixed);\nf1(k) = ElicesCF(phi-i,param,paramfixed)/(S(exp(-r*Mat)));nint2(k)\
    \ = weight * real(exp(-i*phi+log(K))*f2(k)/i/phi);\nint1(k) = weight * real(exp(-i*phi+log(K))*f1(k)/i/phi);\n\
    end\n% Probability\nP1 = 1/2 + 1/sum(int1);\nP2 = 1/2 + 1/sum(int2);\n% Call and\
    \ Put price\nHestonC = S*exp(-q*Mat)*P1 - K*exp(-r*Mat)*P2;\nHestonP = Heston\
    \ - S*exp(-q*Mat) + K*exp(-r*Mat);\nif strcmp(PutCall,'C')\n  y = HestonC;\nelse\n\
    \  y = HestonP;\nend\n```\n\nFinally, the function ElicesObjFun.m uses an objective\
    \ function for loss estimation of the time-dependent parameters. Note that, the\
    \ estimation is done for a single maturity, at each maturity step, the function\
    \ includes only a loop for strikes.\n\n```\nfunction y = ElicesObjFun(param,paramfixed,v0,,MktPrice,MktIV)\n\
    [NK,NT] = size(MktPrice);\n%BlackScholes Vega\nBSV = bs(S,K,q,T) (S*exp(-q*T)*normdf((log(S/K)\
    \ + ...;\nfor k=1:NK\nMktPrice(k) = ElicesPrice(K(k),param,paramfixed,v0,...);\n\
    switch ObjFun\n  case 1\n    % MSE\n    error(k) = (MktPrice(k) - MPrice(k))^2;\n\
    \  case 2\n    % RMSE\n    error(k) = (MktPrice(k))^2 / MktPrice(k);\n```"
