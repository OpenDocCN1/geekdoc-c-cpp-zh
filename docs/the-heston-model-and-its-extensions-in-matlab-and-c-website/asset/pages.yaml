  md: '# The Heston Model for European Options


    with Equation (1.16). If a random variable Y is distributed lognormal with mean
    $\mu$ and variance $\sigma^2$, its cumulative density function is


    $F_Y(y) = \Phi\left( \frac{\ln y - \mu}{\sigma}\right) \quad (1.81)


    The expectation of Y, conditional on Y > y is


    $L_Y(y|Y > y) = \exp\left( \mu + \frac{\sigma^2}{2} \right) \Phi\left( \frac{-\ln
    y + \mu + \sigma^2}{\sigma}\right). \quad (1.82)


    See, for example, Hogg and Klugman (1994) for a derivation of these formulas,
    which are straightforward. Using the risk-neutral measure $\mathbb{Q}_S$ is distributed
    as lognormal with mean $\ln S_T + (r - \frac{1}{2}\sigma_S^2)\tau$ and as described
    earlier in this section. Substituting this mean and variance into (1.81)


    $Q^S(S_T > K) = \Phi\left( \frac{\ln\left(\frac{S_T}{K}\right) + (r - \frac{1}{2}\sigma_S^2)\tau}{\sigma_S\sqrt{\tau}}
    \right) = \Phi(d_2). \quad (1.83)


    where $1 - \Phi(X) = \Phi(-X)$ has been exploited. To obtain the other probability,
    especially the Radon-Nikodym derivative (1.14)


    $Q^S(S_T > K) = \int_K^{\infty} dQ^S = \int_K^{\infty} \frac{dQ^S}{d\mathbb{Q}}
    d\mathbb{Q} = \frac{e^{-r\tau}}{S_0} \int_K^{\infty} x q_T(x)dx \quad (1.84)


    where $q_T(x)$ is the probability density function of $S_T$. Substitute the mean
    and variance of $S_T$ into Equation (1.82), and substitute the resulting expression
    in the last line of (1.84) to obtain


    $Q^S(S_T > K) = \Phi\left( \frac{\ln\left(\frac{S_T}{K}\right) + (r + \frac{1}{2}\sigma_S^2)\tau}{\sigma_S\sqrt{\tau}}
    \right) = \Phi(d_1). \quad (1.85)


    The Black-Scholes call price can therefore be written in the form in Equation
    (1.16)


    $C(K) = S_0Q^S(S_T > K) - Ke^{-r\tau}Q^S(S_T > K).


    To obtain the result with a continuous dividend yield, replace $r$ by $r-q$ in
    all the required expressions and the result follows.


    The fact that $f_2(\phi)$ in Equation (1.80) is the Black-Scholes characteristic
    function, and not $f_1$, is desired. We will see in Chapter 2 that $f_2(\phi)$
    is the \"true\" characteristic function in the Heston model, because it is the
    one obtained under the risk-neutral measure $\mathbb{Q}$. As shown by Bakshi and
    Madan (2000) and others, $f_1(\phi)$ can be expressed in terms of $f_2(\phi)$,
    so a separate expression for $f_1(\phi)$ is not required.


    The function HestonProbSigma.sigma is used to implement the Black-Scholes model
    as a special case of the Heston model (when $\sigma=0$). To conserve space, the
    crucial portions of the function are presented.'
