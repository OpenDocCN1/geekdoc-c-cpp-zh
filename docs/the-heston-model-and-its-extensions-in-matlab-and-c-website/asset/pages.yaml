  md: "# 242 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nSubstitute the\
    \ derivatives in Equation (8.58) into the Heston PDE of (8.56), multiply by $2\\\
    tau$, and group common terms to $\\sqrt{\tau}$ and $\tau$ to obtain\n\n```\n$P_{\\\
    theta\\theta} + \\theta P_theta - 2\\tau P_r$\\n+ \\sqrt{\\tau} \\left[ \\frac{1}{v}(v+2(q-r))P_v\
    \ + \\sigma\\sqrt{v}(-2P_v - \\frac{\theta}{v}P_theta + \\frac{1}{v^2}P_{\\theta\\\
    theta}) \\right]\\n+ \\tau \\left[ \\kappa(\\theta-v)(2P_v-\\\\frac{\theta}{v}P_theta)\
    \ + \\sigma^2v(P_{vv} - \\frac{\\theta^2}{v^2} + \\frac{3\\theta^2}{4v^2}P_{\\\
    theta\\theta}) - 2rP_r \\right]\\n= 0. (8.60)\n```\n\nAs before, the PDE of Equation\
    \ (8.60) is in $P_{(\theta,v)$. Terms that are multiplied by $\\sqrt{\tau}$ get\
    \ shifted back in $n$, while those multiplied by $\\tau$ get shifted twice in\
    \ $n$. After re-arranging this produces\n\n```\n$P_{n\\theta\\theta} + \\theta\
    \ P_{n\\theta} - nP_n$\\n+ \\frac{1}{v}(v+2(q-r))P_{n,v} + \\sigma\\sqrt{v}(-2P_{n-1,v}\
    \ + \\frac{\\theta}{v}P_{n-1,\\theta} - \\frac{1}{v^2}P_{n-1,\\theta\\theta})\\\
    n+ \\kappa(\\theta-v)(2P_{n-2,v} -\\\\frac{\\theta}{v}P_{n-2,\\theta})\\n+ \\\
    sigma^2v(P_{n-2,vv} - \\frac{\\theta^2}{v^2}P_{n-2,\\theta} + \\frac{3\\theta^2}{4v^2}P_{n-2,\\\
    theta\\theta}) - 2rP_{n-2} = 0. (8.61)\n```\n\nThe solution to the PDE in Equation\
    \ (8.61) is found using the same reasoning that was applied to the Black-Scholes\
    \ PDE in (8.47), by considering the homogeneous and non-homogeneous portions of\
    \ the PDE separately. Hence, the first three terms of (8.61) comprise the homogeneous\
    \ part, and the remaining terms comprise the non-homogeneous part. As in the Black-Scholes\
    \ case the homogeneous assumes a solution of\n\n```\n$P_n^k(\\theta,v) = p_n^p(\\\
    theta,v)\\Phi(\\theta) + q_n^q(\\theta,v)\\Phi(\\theta) (8.62)\n```\n\nwhile the\
    \ non-homogeneous part assumes a solution of\n\n```\n$P_n(\\theta,v) = C_n(v)p_n^p(\\\
    theta)\\Phi(\\theta) + q_n^q(\\theta,v)\\n= C_n(v)[p_n^p(\\theta)\\Phi(\\theta)\
    \ + q_n^q(\\theta,v)] + p_n^p(\\theta,v)\\phi(\\theta) + q_n^q(\\theta,v)\\phi(\\\
    theta). (8.63)\n```\n\nWe will need the following derivatives of $P_n(\\theta,v)$,\
    \ by applying the chain rule\n\n```\n$P_{n\\theta} = C_n[p_{n\\theta}^p + p_n^p\\\
    theta^theta + q_{n\\theta}^q - q_n^q\\theta^theta] + p_n^p\\theta^theta\\Phi'(\\\
    theta) + q_n^q\\theta^theta\\phi(\theta)\\n$P_{n\\theta\\theta} = C_n[p_{n\\theta\\\
    theta}^p + 2p_{n\\theta}^p\\theta^theta + p_n^p\\theta^theta\\theta^theta + 2q_{n\\\
    theta}^q\\theta^theta + q_n^q\\theta^theta\\theta^theta] - 2q_{n\\theta}^q\\theta^theta\
    \ + q_n^q\\theta^theta\\theta^theta$\\n$P_{nv} = C_n[p_{nv}^p + p_n^pv] + p_{nv}^p\\\
    phi + q_{nv}^q$\n```"
