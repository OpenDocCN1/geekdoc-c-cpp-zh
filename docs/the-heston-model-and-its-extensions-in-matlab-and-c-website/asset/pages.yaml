  md: '# Parseval''s Identity for the Heston Model


    Lewis (2001) derives an option pricing formula under a general setup for the stock
    price. Suppose that the stock price $S_T$ at time $T$ evolves from $S_0$ at time
    $t=0$ as


    ```

    $S_T = S_0 e^{(r-q)T+X_T} \quad (4.25)$

    ```


    where $T$ is the exercise time of the option, $r$ is the risk-free rate, $q$ is
    the dividend yield, and $X_T$ is a Lévy process for which $E[e^{ikX_T}]=1$. Under
    certain regularity conditions, the option price $U(S_0)$ at time $t=0$ is


    ```

    $U(S_0) = \frac{e^{-rT}}{2\pi} \int_{-\infty}^{+\infty} e^{-ikY}\varphi(-k)\hat{w}(k)
    dk \quad (4.26)$

    ```


    where $Y = \ln S_0+(r-q)T$, where $\hat{w}(k)$ is the Fourier transform of the
    payoff $w(x_T)$, and $\varphi(k)$ is the characteristic function of the Lévy process
    $X_T$ evaluated at the complex number $k=k+ik_i$. Lewis assumes that $\varphi(k)$
    is regular in the strip $S_X=\{k: a < k_i < b\}$ such that $a<-1$ and $b=0$. To
    show how Equation (4.26) is derived, the inverse transform of the payoff in (4.3),
    $w(x,t)$ and $\hat{w}(k)$ for $f(x,t)$


    ```

    $w(x) = \frac{1}{2\pi} \int_{-\infty}^{+\infty} e^{-ikx}\hat{w}(k) dk = \frac{1}{2\pi}
    \int_{-\infty}^{+\infty} S_T^{-ik} \hat{w}(k) dk \quad (4.27)$

    ```


    since $x=\ln S_T$. The no-arbitrage price of the option is


    ```

    $U(S_0) = \frac{e^{-rT}}{2\pi} \int_{-\infty}^{+\infty} E^{ikY}(S_0e^{(r-q)T+X_T})^{-ik}\hat{w}(k)
    dk \\

    = \frac{e^{-rT}}{2\pi} \int_{-\infty}^{+\infty} e^{-ikY}E[e^{-ikX_T}]\hat{w}(k)
    dk \\n= \frac{e^{-rT}}{2\pi} \int_{-\infty}^{+\infty} e^{-ikY}\varphi(-k)\hat{w}(k)
    dk \quad\quad (4.28)$

    ```


    where $\varphi(-k)=E[e^{-ikX_T}]$ is the characteristic function for $X_T$, evaluated
    at $-k$. Note that, in the line of (4.28), the term $e^{-ikY}E[e^{-ik\ln S_T}]
    = f_2(-k)$


    which is the Heston (1993) characteristic function for $\ln S_T$, evaluated at
    $-k$.


    ```

    $e^{-ikY}\varphi(-k) = E[e^{-ik(Y+\ln S_T)}] = f_2(-k) \quad\quad (4.29)$

    ```


    The valuation formula (4.28) is Equation (3.5) in Lewis (2001) and the main result
    of that paper. Lewis (2000) explains that (4.28) is applicable to a wide range
    of models, including the Variance Gamma model, the Heston model, and many others.
    All that is needed is the characteristic function and its strip of regularity.


    The transform $\hat{w}(k)$ is defined in the region $S_w$ so that for the call
    option we have $S_w^{call}=\{k: k_i > 1\}$ and for the put we have $S_w^{put}=\{k:
    k_i < 0\}$, as explained'
