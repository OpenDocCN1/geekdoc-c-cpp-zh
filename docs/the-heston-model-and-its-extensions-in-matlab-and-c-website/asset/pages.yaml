- pgno: 116
  md: '# 106 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    Finally, Lewis (2001) shows that, if the integration contour is moved to $v_t
    \in (\alpha,0)$, with $\alpha<0$, then both poles are included, as shown by the
    black semi-circle $\mathcal{C}$ in Figure 4.3. Applying the residue theorem again,
    $C(S_0)$ will be equal to the integral along this new contour, minus $2\pi i$
    times the sum of residues. Recall that the payoff is


    ```

    $$\hat{u}(k) = \frac{K^{k+1}}{k^2-ik}$

    ```


    which is identical to that for the call, except that the admissible region is
    $k<0$. Hence, when we take the contour at $v_t$ in Equation (4.31), we end up
    with $P(S_0)$, the value of put. By the residue theorem, the call option is the
    integral in (4.31) along the new contour, $2\pi i$ times the sum of the two residues


    ```

    $C(S_0) = P(S_0) - 2\pi \frac{S_0 e^{-rT}}{2\pi} \frac{Ke^{-rT}}{2\pi} = P(S_0)
    + S_0 e^{-rT} - Ke^{-rT}$

    ```


    which is the price of the call by-put parity.


    If we choose $v_t = \frac{i}{2}$ in Equation (4.32), then we are integrating along
    the line $k_i$ between the two poles in Figure 4.3. Writing $k=u+\frac{i}{2}$
    so that $k^2-ik=u^2+\frac{1}{4}$, we can express (4.32) as


    ```

    $C(S_0) = S_0 e^{-rT} - \frac{Ke^{-rT}}{2\pi} \int_{1/2}^{\infty} e^{-(u+\frac{i}{2})\varphi
    W} \varphi(-u-\\frac{i}{2}) \frac{du}{u^2+\frac{1}{4}}$$\n$$\= S_0 e^{-rT} - \frac{\sqrt{KS_0}
    e^{-(r-q)T/2}}{2\pi} \int_{1/2}^{\infty} e^{iu\varphi W} \varphi(-u+\frac{i}{2})
    \frac{du}{u^2+\frac{1}{4}}$$\n$$\= S_0 e^{-rT} - \frac{\sqrt{KS_0} e^{-(r-q)T/2}}{\pi}
    \int_{0}^{\infty} \text{Re} \left[ e^{iu\varphi (u-\\frac{i}{2})} \frac{1}{u^2+\frac{1}{4}}
    \right] (4.33)$

    ```


    The first line uses $u$ and $W$ substituted for $k$, and $W=\ln(S_0/K)+(r-q)T$,
    while the last line uses that


    ```

    $$\text{Re}[e^{-iu\varphi W} \varphi(-u-\\frac{i}{2})] = \text{Re}[e^{iu\varphi
    W} \varphi(-u+\frac{i}{2})].$

    ```


    Recall from Equation (4.25) that $\ln S_T=\ln S_0+(r-q)T+X_T=Y+X_T$. To implement
    the call price in (4.33), it is useful to write the function for $X_T$, as we
    did in (4.29), namely


    ```

    $$\varphi(u) = E[e^{iuX_T}] = f_2(u)e^{-iuY}$ (4.34)$

    ```


    where $f_2(u)$ is the Heston characteristic function evaluated at $u$.'
