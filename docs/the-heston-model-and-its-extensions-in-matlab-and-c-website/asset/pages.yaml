  md: "# Numerical Integration Schemes\n\nThe definition of the absciss depends on\
    \ the formula being used. We consider four types of Newton-Cotes formulas: the\
    \ mid-point rule, the trapezoidal rule, Simpson's rule, and Simpson's three-eighths\
    \ rule. We consider because the endpoints $a$ and $b$ are used as absciss, so-called\
    \ the closed version of these rules\n\nIn the Heston model, we usually require\
    \ an integral evaluated over the domain $(0, \\infty)$. This means that, when\
    \ we use Newton-Cotes formulas, we must select the domain $[\\phi_{\\min}, \\\
    phi_{\\max}]$ where $\\phi_{\\min}$ is a small number and $\\phi_{\\max}$ is a\
    \ large number. We saw in Chapter 1 that the Heston integrand can be highly oscillatory.\
    \ When we select $\\phi_{\\max}$ we ensure that it is large enough so that the\
    \ integral is sufficiently damped to prevent a loss of accuracy in the approximation\
    \ in (2.1).\n\nOne exception to the requirement of the integration domain $(0,\
    \ \\infty)$ is due to Kahl and Jackel (2005). They transform the domain $(0, \\\
    infty)$ to the closed interval $[0, 1]$. In their approach, we need not worry\
    \ about choosing $\\phi_{\\min}$ or $\\phi_{\\max}$. We will see in this chapter\
    \ that their transformation is particularly well-suited to Gauss-Lobatto quadrature,\
    \ rather than Newton-Cotes formulas.\n\n# Mid-point rule\n\nThis is the simplest\
    \ of the Newton-Cotes formulas we present. It approximates the integral in Equation\
    \ (5.1) as the sum of rectangles, each with equal width $x_{j+1}-x_j$, and with\
    \ height given by the integrand $f(x)$ evaluated at the mid-point of the interval\
    \ $(x_j, x_{j+1})$. Define the absciss $x_j = a+(j-1)b$ for $j=1, \\dots, N$,\
    \ where $b=(b-a)/(N-1)$ so that $x_1=a$ and $x_N=b$. Since there are $N-1$ subintervals,\
    \ the approximation involves\n\n> $f(x)dx \\approx \\sum_{j=1}^{N} \\frac{x_j+x_{j+1}}{2}$$\n\
    \nThe mid-point rule uses the weights $w_j=b$ for $j=1, \\dots, N-1$, and $w_0=0$.\
    \ The following code implements the mid-point rule HestonPriceNewtonCotes in Matlab.\n\
    \n```\nh = (b-a)/(N-1);\nphi = [a:h:b];\nwt = h*ones(1,N);\nfor k=1:N-1\n  mid\
    \ = mid(k);\n  int1(k) = wt(k)*HestonProb(mid(k),...,2);\n  int2(k) = wt(k)*HestonProb(mid(k),...,2);\n\
    end\nI1 = sum(int1);\nI2 = sum(int2);\nP1 = 1/2 + 1/pi*I1;\nP2 = 1/2 + 1/pi*I2;\n\
    ```"
