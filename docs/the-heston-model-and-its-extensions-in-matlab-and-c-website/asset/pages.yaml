  md: "# Time-Dependent Heston Models\n\n279\n\n$= exp(A(\tau_N, \\phi_1, 0) + A(\t\
    au_{N-1}, \\phi_1, \\phi_{N-1}^2))$\n$\\times E[exp(i\\phi_1 x_{N-2} + C(\tau_{N-1},\
    \ \\phi_1, \\phi_{N-1}^2)v_{N-2})]$$\n$= exp(A(\tau_N, \\phi_1, 0) + A(\tau_{N-1},\
    \ \\phi_1, \\phi_{N-1}^2))E[exp(i\\phi_1 x_{N-2} + i\\phi_{N-2}^2 v_{N-2})]$\n\
    \nwhere $\\phi_{N-2}^2 = -iC(\tau_{N-1}, \\phi_1, \\phi_{N-1}^2)$. Continuing\
    \ in this manner, the repeated application of the law of iterated expectations\
    \ and the trick, the characteristic function for $x_N = x_{T_N}$ can be written\n\
    \n```\n$f(\\phi_1, x_0, v_0) = E[exp(\\phi_1 x_0)]$,\n```\n\n```\n$= \\exp(\\\
    sum_{k=0}^{N-1} A(\\tau_{N-k}, \\phi_1, \\phi_k^2)\\exp(i\\phi_1 x_0 + C(\\tau_{N-k},\
    \ \\phi_1, \\phi_k^2)v_0)) (9.44)\n```\n\nwith $\\phi_k^2 = -iC(\tau_{k+1}, \\\
    phi_1, \\phi_{k+1}^2)$ and $\\phi_0^2 = 0$.$\\nAs explained in Chapter 2, we use\
    \ $f(\\phi, x_0, v_0)$ in (9,44) directly for the characteristic function, but\
    \ for the first characteristic function we use $f(\\phi - it_0, x_0/v_0)).$\\\
    nElices (2009) uses $v_0$ at the first maturity, and restricts this to remain\
    \ constant throughout the remaining maturities. The other parameters are piecewise\
    \ constant and change their value at the maturities. Denote by $\\Theta_k = (\\\
    kappa^{(k)}, g^{(k)}, \\sigma^{(k)}, \\rho^{(k)})$ the parameter set estimated\
    \ in the time increment $(T_{k-1}, T_k)$. The model of Elices (2009) is implemented\
    \ from the first maturity to the last, using the following steps\n\nStep 1. Construct\
    \ the characteristic function at the first maturity, which depends on the parameter\
    \ set $\\Theta_1$, as\n\n$exp(A(\\tau_1, \\phi_1, 0; \\Theta_1)) \\times exp(i\\\
    phi_1 x_0 + C(\\tau_1, \\phi_1, 0; \\Theta_1)v_0)$\n\nObtain the parameter estimates\
    \ $v_0$ and $\\Theta_1$ by minimizing the loss using market prices or implied\
    \ volatilities at the first maturity.\n\nStep 2. Construct the characteristic\
    \ function at the second maturity, which depends on the parameter sets $\\Theta_1$\
    \ and $\\Theta_2$,\n\n$exp(A(\\tau_2, \\phi_1, 0; \\Theta_2)) \\times exp(i\\\
    phi_1 x_0 + C(\\tau_2, \\phi_1, \\phi_2^2; \\Theta_2)v_0)$\n\nwhere $\\phi_1^2\
    \ = -iC(\\tau_2, \\phi_1, 0; \\Theta_2)$ and $\\phi_0^2 = -iC(\\tau_1, \\phi_1,\
    \ \\phi_1^2; \\Theta_1)$. Obtain the parameter estimates $\\Theta_2$ by minimizing\
    \ the loss function using prices or volatilities at the second maturity, keeping\
    \ $\\Theta_1$ and $v_0$ fixed.\n\nStep k. Construct the characteristic function\
    \ at maturity $k$, which depends on the parameter sets $\\Theta_1, \\Theta_2,\
    \ \\dots, \\Theta_k$, as\n\n$exp(A(\\tau_k, \\phi_1, 0; \\Theta_k)) + A(\\tau_{k-1},\
    \ \\phi_1, \\phi_{k-1}^2; \\Theta_{k-1}) + \\dots + A(\\tau_1, \\phi_1, \\phi_1^2;\
    \ \\Theta_1))$$\\n$\\times exp(i\\phi_1 x_0 + C(\\tau_1, \\phi_1, \\phi_1^2; \\\
    Theta_1)v_0)$"
