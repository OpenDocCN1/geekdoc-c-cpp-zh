  md: "# THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n```\nList<double>\
    \ X = new List<double>();\nList<int> Xi = new List<int>();\nfor(int i=0;i<=NS-1;i++)\
    \ {\n  if (i[s] == 1) {\n    X.Add(i[j],t);\n    Xi.Add(s);\n    NI += 1;\n  }\n\
    }\n```\n\nEstimating the coefficients in (8.5) with C# requires a method for matrix\
    \ inversion. One popular method is LU decomposition, as described in Burden and\
    \ Faires (2010) and Press et al. (2007), among others. Suppose that we wish to\
    \ obtain the inverse of a square matrix A. The LU decomposition requires that\
    \ A be factored into the product of a lower triangular L and an upper triangular\
    \ U, so that A = LU. The inverse of A is then A⁻¹ = U⁻¹L⁻¹. The method requires\
    \ little computation because the inverse of a triangular matrix can be obtained\
    \ quickly. The C# function LU() performs LU decomposition and returns the upper\
    \ and lower triangular matrices into the LUStruct.\n\n```\nstatic LUStruct LU(double[,]\
    \ A) {\n  int N = A.GetLength(0);\ndouble[,] B = new double[N,N];\n  for(int i=0;i<N-1;i++)\
    \ {\n    for(int j=0;j<N-1;j++) B[i,j] = A[i,j];\n    for(int k=0;k<N-1;k++) {\n\
    \      for(int i=k+1;i<N-1;i++) B[i,k] = B[i,k] / B[k,k];\n      for(int j=k+1;j<N-1;j++)\
    \ B[i,j] = B[i,j] - B[i,k]*B[k,k];\n    }\n  }\n  double[,] L = new double[N,N];\n\
    double[,] U = new double[N,N];\n  for(int i=0;i<N-1;i++) {\n    L[i,i] = 1.0;\n\
    \    for(int j=0;j<N-1;j++) {\n      if (i<j) L[i,j] = B[i,j];\n      else U[i,j]\
    \ = B[i,j];\n    }\n  }\n  LUStruct Mats;\n  Mats.L = L;\nMats.UM = U;\n  return\
    \ Mats;\n}\n```\n\nThe C# functions MatUpTriangleInv() and MatLowTriangleInv()\
    \ return the inverse of an upper and lower triangular matrix, respectively. These\
    \ algorithms are described in Burden and Faires (2010)."
