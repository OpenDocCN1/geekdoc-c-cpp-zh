  md: '# 208 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    least-squares estimates in Equation (8.5) are thus obtained using these three
    values of the stock price in the design matrix, L. Paths 3 and 6 both have a value
    of immediate exercise that is greater than that of the predicted cash flows from
    the regression, so early exercise is optimal in two paths. Consequently, the cash
    flows from these paths are updated with the value of immediate exercise. The remaining
    path 4 has a predicted cash flow greater than immediate exercise, indicating that
    continuation is optimal for that path. Its cash flow is not updated. At the next
    time step t=5 there are four in-the-money paths, so four stock points for L, early
    exercise is optimal only for path 3, and only the third card is updated. At t=4,
    there are four in-the-money paths all updated. The regressions for the final two
    time steps are based on 4 and 3 in-the-money stock prices, respectively, but all
    of the predicted cash flows are greater than that value of immediate exercise.
    Early exercise is therefore not optimal in any of the paths in these final time
    steps, and consequently none of the cash flows are updated.


    The accuracy of the American option price can be improved by using the controlate
    technique. The idea behind this is that, if we assume the error in LSM pricing
    of an American option from its true value is the same as the error in LSM pricing
    of a European option from its true value, then we can write


    American Error = European Error

    American Price_{True} - American Price_{LSM} = European Price_{True}

    — European Price_{LSM}.


    The control vari price of the American option is, therefore,


    American Put_{CV} = European Price_{True} + (American Price_{LSM} – European Price_{LSM}).
    (8.7)


    In Equation (8.7), we use the American and European prices obtained from the LSM
    algorithm, and we use the closed form using the original Heston (1993) formulation
    obtained with 32-point Gauss-Laguerre quadrature. Note that (8.7) amounts to adding
    the early premium estimated by the LSM algorithm to the closed form European price.
    Hull and White (1998) for a discussion of the control technique for pricing American
    options.

    The Matlab function LSM.M implements the Longstaff-Schwartz (2001) algorithm and
    returns American and European prices. The function requires a matrix of simulated
    Heston stock prices as input along a function handle for the regression design
    matrix. In the example later in this subsection, we use the moment-matching algorithm
    presented in Chapter 7 to store the stock prices. The following code snippet presents
    a stripped-down version of the LSM.function, for puts only.


    ```

    function [EuroPrice Amer] = LSM(...,PutCall,XmatrixHandle)

    % Initialize the Cash Flows and set the last CF to the

