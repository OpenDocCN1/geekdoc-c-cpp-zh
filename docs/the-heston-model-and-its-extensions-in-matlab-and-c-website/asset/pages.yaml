  md: "# The Fundamental Transform for Pricing Options\n\n![](img/bc3df3b6c26c2272307f56b6cf75ef87_115_0.png)\n\
    \n# FIGURE 4.3Contours of Integration\n\nsince $\\varphi(-i) = E[e^{X_r}]$, and\
