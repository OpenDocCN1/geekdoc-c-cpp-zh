  md: '# THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    We define each weight as


    ```

    $w_j = \frac{(nt)^2e^n}{x_j[L_n(x_j)]^2} \text{ for } j = 1, \dots, N.$

    ```


    Note that the Laguerre polynomial in Equation (5.6) has N+1 terms, but its derivative
    (5.7) has N terms, which is the correct number of terms required for the approximation
    in (5.1).


    It is straightforward to use Matlab to calculate the abscissas and weights for
    any N. This is accomplished with the GenerateGaussLaguerre.m function, which returns
    the abscissas and weights in the vectors x and w, respectively.


    ```

    function [x w] = GenerateGaussLaguerre(n)

    for k=0:n

    L(k+1) = (-1)^k/factorial(k)*nhoosek(n, k);

    end

    L = flipud(L);

    x = zeros(n,1);

    for k=1:n

    dL(k,j) = (-1)^k/factorial(k)*nhoosek(n, k)*...;

    end

    w(j) = 1/x(j)/sum(dL(:,j))^2;

    w(j) = w(j)*exp(x(j));

    end

    ```


    To numerically evaluate the Heston integrals for $P_1$ and $P_2$ using Gauss-Laguerre
    integration, we first generate abscissas and weights, evaluate the integrand at
    each abscissa, apply the weight, and take the sum. This is implemented as part
    of the Matlab function HestonPriceGaussLaguerre.m, which returns the call price,
    or the put price by call parity. To conserve space, parts of the function are
    omitted.


    ```

    function y = HestonPriceGaussLaguerre(PutCall,...)

    for k=1:length(x)

    int1(k) = w(k)*HestonProb(x(k),...,1);

    int2(k) = w(k)*HestonProb(x(k),...,2);

    end

    P1 = 1/2 + 1/pi*sum(int1);

    P2 = 1/2 + 1/pi*sum(int2);

    HestonC = S*exp(-q*T)*P1 - K*exp(-r*T)*P2;

    ```'
