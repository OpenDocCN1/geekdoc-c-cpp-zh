  md: "# 224\nTHE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe probabilities\
    \ for $S_t$ are calculated using the Matlab function probY.m, which applies Equation\
    \ (8.30).\n\n```\nfunction [pu pm pd] = probY(Vt,V0,Yt,dt,rho,sigma,kappa)\n%\
    \ Equation 11\n  if Vt > 0\n    k = ceil(sqrt(Vt/V0));\n  else\n    k = 1;\n \
    \ end\n% Equations 9 and 6\nmuY = (rho/sigma*kappa - 0.5)*Vt;\nsigymat = sqrt((1-rho)^2)*sqrt(Vt);\n\
    sigym0 = sqrt((1-rho)^2)*sqrt(V0);\n% Calculate the Yu, Ym, Yd from Equation 13\n\
    I = (round(muY/k)/sigym0*sqrt(dt));\nY = Yt + (I+1)*k*sigym0(dt);\nYm = Yt + (I-0)*k*sigym0(dt);\n\
    Yd = Yt + (I-1)*k*sigym0(dt);\n% Equations 17 and 16\neu = k*Vt - muY*dt;\nem\
    \ = Ym - Yt - muY*dt;\ned = Yd - Yt + muY*dt;\npu = 0.5*(sigma^2*dt + eu*ed)/k^2/sigma^2/dt;\n\
    pm = 0.5*(sigma^2*dt + eu*em)/k^2/sigma^2/dt;\npd = 0.5*(sigma^2*dt + eu*ed)/k^2/sigma^2/dt;\n\
    ```\n\nThe transformed price tree $Y_t$, the stock prices $S_t$ and the American\
    \ and European prices are all built using the BuildBivariateTree.m function. The\
    \ structure of $Y_t$ is upper triangular and by placing $Y_0$ in the top-left\
    \ corner of the matrix for $Y_t$. The values at the first time step are placed\
    \ in the first nine rows of the second column, the values at the second time step\
    \ are placed in the third column from the top, and so on.\n\nThe first part of\
    \ the function generates the tree for the variance, finds the value of $k_i$ at\
    \ each node of $v_i$, and finds the number of rows needed at each time step based\
    \ on the maximum value of $k_i$ and the number of variance nodes at that step.\
    \ The value of $k_i$, at each node is obtained from Equation (8.28).\n\n```\n\
    function [EuroAmer Amer... Branch] = BuildBivariateTree(...)\ndt = T/NT;\nsigym0\
    \ = sqrt(1-rho^2)*sqrt(V0);\n% Generate the volatility tree\n[X RBound M] = BuildVolTree(...);\n\
    ColChange = RBound M + 2;\n% The values of k(t) from Equation (11) and I(t) from\
    \ (14)\nk = zeros(2*NT-1,NT);\nfor t=1:NT\n  for n=M-(t-1):M+(t-1);\n```"
