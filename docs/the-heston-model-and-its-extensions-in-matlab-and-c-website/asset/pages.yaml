  md: '# 286 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#


    Denote the time-t log forward price by $X_t = \ln(Se^{(r-d)t})$, where $\tau =
    T - t$ is the time to maturity. Applying Ito''s lemma, the bivariate process for
    the time-dependent Heston model of Benham et al. (2010)


    ```

    $dX_t = -\frac{v_t}{2}dt + \sqrt{v_t}dW_{1,t}$

    $dv_t = \kappa(\theta - v_t)dt + \sigma_t\sqrt{v_t}dW_{2,t}$ \quad (9.46)

    ```


    $v_0$ is the initial variance. Using a perturbed version of the model and Malliavin
    calculus, we show that the put price in the Heston model can be expressed as a
    sum of the Black-Scholes put price and correction terms involving derivatives
    of the Black-Scholes put price. Assuming a constant rate of interest and dividend
    yield, the Black-Scholes put price can be expressed in terms of the total variance
    $y = \sigma^2\tau$ and the log-spot price $x = \ln S^* $


    ```

    $P_{BS}(x,y) = Ke^{-rt}\Phi(f(x,y)) - Se^{-rt}\Phi(g(x,y))$ \quad (9.47)

    ```


    where


    ```

    $f(x,y) = \frac{1}{\sqrt{y}}[-x + \ln K - (r-q)T] + \frac{\sqrt{y}}{2}$

    $g(x,y) = \frac{1}{\sqrt{y}}[-x + \ln K - (r-q)T] - \frac{\sqrt{y}}{2}$

    ```


    Note that $f = g+\sqrt{y}$ and $g = f-\\sqrt{y}$. The put price in the model appears
    in Theorem 2.2 of Benhamou et al. (2010) as


    ```

    $e^{-rt}E^Q[(K-e^{rt+X_t})^+] = P_{BS}(x,\hat{w}_t) + a_{1,t}\frac{\partial^2
    P_{BS}}{\partial x\partial\hat{w}_t} + a_{2,t}\frac{\partial^3 P_{BS}}{\partial
    x^2\partial\hat{w}_t}(x,\hat{w}_t)\n$+ b_{0,t}\frac{\partial^2 P_{BS}}{\partial\hat{w}_t^2}
    + b_{2,t}\frac{\partial^4 P_{BS}}{\partial x^2\partial\hat{w}_t^2}(x,\hat{w}_t)$
    \quad (9.48)

    ```


    where


    and


    ```

    $$\hat{w}_t = \int_0^t v_{0,s}ds$ \quad (9.49)

    ```


    ```

    $v_{0,t} = e^{-rt}(v_0 + \int_0^t \theta_s e^{rs}ds)$ \quad (9.50)

    ```


    Benhamou et al. (2010) use a time-varying interest rate and dividend yield, but
    we assume these are constant for notational simplicity. The generalization to
    the time-varying versions are straightforward.'
