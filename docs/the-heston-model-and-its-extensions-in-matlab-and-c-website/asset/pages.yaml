- pgno: 106
  md: "# THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nEquation (4.10) becomes\n\
    \n```\n$$\\frac{\\partial\\hat{H}}{\\partial t} = v\\frac{\\partial^2\\hat{H}}{\\\
    partial v^2} + \\frac{2}{\\sigma^2}[kappa(\\tilde{v}) - ik\\rho\\sigma]\\frac{\\\
    partial\\hat{H}}{\\partial v} - \\frac{2c(k)}{\\sigma^2}vH(k,v,\\tau)$$\\n$$ =\
    \ v\\frac{\\partial^2\\hat{H}}{\\partial v^2} + \\hat{\\kappa}(\\tilde{v})\\frac{\\\
    partial\\hat{H}}{\\partial v} - \\tilde{c}(k)vH(k,v,\\tau)$$ (4.11)\n```\n\nwhere\n\
    \n```\n$$\\tilde{\\kappa} = \\frac{2(kappa + ik\\rho\\sigma)}{\\sigma^2}, \\quad\
    \ \\tilde{v} = \\frac{kappa\\theta}{\\kappa + ik\\rho\\sigma}$\n```\n\nand $\t\
    ilde{c}(k) = 2c(k)/\\sigma^2 = (k^2 - ik)/\\sigma^2$. The second equation in (4.11)\
    \ is a parabolic equation in $v$, and has a solution of the form\n\n```\n$f(v,t)\
    \ = \\exp(C(t) + D(t)v)$\n```\n\nwith initial condition $C(0) = D(0) = 0$. Take\
    \ the derivatives of $f(v,t)$, substitute into (4.11), and cancel $f$ on these\
    \ sides. This produces\n\n```\n$$\\frac{\\partial D}{\\partial t} + \\frac{\\\
    partial C}{\\partial t}v = vD^2 + \\tilde{\\kappa}(\\tilde{v}-v)D - \\tilde{c}v.$\n\
    ```\n\nNow equate terms in $v$, which produces the set of equations\n\n```\n$$\\\
    frac{\\partial D}{\\partial t} = D^2 - \\tilde{\\kappa}D - \\tilde{c}, \\quad\
    \ \\frac{\\partial C}{\\partial t} = \\tilde{\\kappa}D.$$ (4.12)\n```\n\nSolving\
    \ these equations is exactly the same manner as done in the original Heston (1993)\
    \ derivation covered in Chapter 1. The first equation in (4.12) is the Riccati\
    \ equation with $P(t)=-\tilde{c}, Q(t)=-\\tilde{\\kappa},$ and $R(t)=1$. To solve\
    \ it, we apply the same procedure. We set up the second-order ODE\n\n```\n$$\\\
    omega'' + \\tilde{\\kappa}w' - \\tilde{c}w = 0$$\n```\n\nand define\n\n```\n$$\\\
    alpha = \\frac{\\tilde{\\kappa}+d}{2}, \\quad \\beta = \\frac{\\tilde{\\kappa}-d}{2}$\n\
    ```\n\nwhere $d = \\sqrt{\\tilde{\\kappa} + 4\\tilde{c}}$. The solution to the\
    \ Riccati equation in (4.12) is, therefore,\n\n```\n$$\\D = \\frac{1}{R}\\frac{\\\
    alpha e^{\\alpha t} + \\beta e^{\\beta t}}{e^{\\alpha t} + e^{\\beta t}}$\n```\n\
    \nThe initial condition $D(0)=0$ implies that, by setting $t=0$ in the numerator,\
    \ we obtain $K=-\\beta/\\alpha = (\\tilde{\\kappa}+d)/(-\\tilde{\\kappa}+d)$.\
    \ This produces\n\n```\n$D(t) = \\frac{\\tilde{\\kappa}+d}{2} \\left( \\frac{1-e^{\\\
    beta t}}{1-e^{\\alpha t}} \\right)$$ (4.13)\n```"
