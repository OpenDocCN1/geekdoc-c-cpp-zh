  md: 'The first element required for Lewis'' (2000) fundamental transform approach
    to option value is the generalized Fourier transform f(k,t) of the derivative
    value f(x,t) at time t


    ```

    $$\hat{f}(k,t) = \int_{-\infty}^{\infty} e^{kx} f(x,t) \, dx \quad (4.1)$

    ```


    where x = \ln S$, since we are at time t. Equation (4.1) is identical to the Fourier
    transform, except that the argument k is allowed to be complex, so that $k = k
    + i_k$ where $k$ and $i_k$ are real numbers. The simplest solution for $f(k,t)$
    is for European payoffs at expiry time $T_t$, for which the payoff $f(x,T)$ is
    known explicitly.


    For example, the payoff of a call option is $f(x,T) = (S_T - K)^+$ so its payoff
    is


    ```

    $$\hat{f}(k,T) = \int_{-\infty}^{\infty} e^{kx}(e^x - K)^+ \,dx = \frac{e^{(k+1)x}}{k+1}
    \Big|_{x=\ln K} = \frac{K^{k+1}}{k-2} \quad (4.2)$

    ```


    where the equality holds if $k_r > 1$. In Equation (4.2), the condition $k_r >
    1$ is required because order for the integration in Equation (4.2) to not explode
    at the upper limit $x = \infty$, we must have $e^{kx}$ decaying faster than $e^x$
    as $x \to \infty$. To see why, we can write the term $e^{(k+1)x}$ in (4.2) as
    $exp[(ik-k+1)x]$. This term is then well-defined. It is straightforward to show
    that $f(k,T)$ for the put option is identical to that for the call, except that
    the admissible region is $k_r < 0$. Payoff transforms for other options are in
    Table 2.2.1 of Lewis (2000).


    To illustrate in Figure 4.1, we reproduce Figure 4 of Schmelzle (2010) and plot
    the real payoff for the put, over the integration range $-1 < k_r < 0$ and $-4
    < k_r < 0$.


    Since $f(k,t)$ in Equation (4.1) is the generalized Fourier transform, its inverse
    transform is


    ```

    $$\f(x,t) = \frac{1}{2\pi} \int_{-\infty}^{\infty} e^{ikx} \hat{f}(k,t) \, dk
    \quad (4.3)$

    ```


    The generalized Fourier transform is slightly different from the regular Fourier
    transform, which assumes $k$ is real only. The generalized Fourier transform is
    obtained by integrating Equation (4.3) along the strip of regularity. For most
    derivative payoffs, this strip of regularity is defined as $\alpha < k_r < \beta$,
    as in Table 2.2.1 of Lewis (2000). For the payoff of the European call, the strip
    is $k_r > 1$, and for the put it is $k_r < 0$.


    # THE FUNDAMENTAL TRANSFORM AND THE OPTION PRICE


    The second element required for Lewis'' (2000) approach is the fundamental transform
    itself. In this section, we illustrate how Lewis derives the fundamental transform,
    and we present his recipe for obtaining option prices under his in'
