- pgno: 13
  md: '# The Heston Model for European Options


    Abstract


    In this chapter, we present a complete derivation of the European call price under
    the Heston model. We first present the model and obtain the various partial differential
    equations (PDEs) that arise in the derivation. We show that the call price in
    the Heston model, and can be expressed as the sum of two terms that each contains
    an in-money probability, but obtained under a separate measure, a result demonstrated
    by Bakshi and Madan (2000). We show how to obtain the characteristic function
    for the Heston model, and how to solve the Riccati equation from which the characteristic
    function is derived. We then show how to incorporate a continuous dividend yield
    and how to compute the price of a European put, and demonstrate that the numerical
    integration can be sped up by consolidating the two integrals into a single integral.
    Finally, we derive the Black-Scholes model as a special case of the Heston model.


    # MODEL DYNAMICS


    The Heston model assumes that the underlying stock price, $S_t$, follows a Black-Scholes-type
    stochastic process, but with a stochastic variance $v_t$ that follows a Cox, Ingersoll,
    and Ross (1985) process. Hence, the Heston model is represented by the bivariate
    system of stochastic differential equations (SDEs)


    ```

    $dS_t = \mu S_t dt + \sqrt{v_t} S_t dW_{1,t} \quad (1.1)$

    ```


    $E^0[dW_{1,t}dW_{2,t}] = \rho dt$.

    We will sometimes omit the time index and write $S = S_t, v = v_t, W_1 = W_{1,t}$
    and $W_2 = W_{2,t}$ for not convenience. The parameters of the model are


    +   $\mu$ the drift of the process for the stock;

    $\kappa > 0$ the mean reversion speed for the variance;

    $\theta > 0$ the mean reversion level for the variance;

    $\sigma > 0$ the volatility of the variance;

    $v_0 > 0$ the initial (time zero) level of the variance;


    The Heston Model and Its Extensions in Matlab and C#. Fabrice Douglas Rouah.

    © 2013 Fabrice Douglas Rouah. Published 2013 by John Wiley & Sons, Inc.'
