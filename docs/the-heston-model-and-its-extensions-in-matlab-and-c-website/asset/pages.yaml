- pgno: 124
  md: '# CHAPTER 5


    # Numerical Integration Schemes


    Abstract


    The calculation of the call price in the Heston model often requires the evaluation
    of an integral. This is true for most of the formulations of the call price we
    have encountered, that by Heston (1993), Lewis (2000, 2001), Carr and Madan (1999),
    or Attari (2004) usually involves finding the anti-derivative of the integrand,
    and applying the Fundamental Theorem of Calculus, according to which the value
    of the integral can be expressed in terms of the anti-derivative evaluated at
    the endpoints of the integration domain. Unfortunately, in the Heston model, the
    anti-derivative of the integrals for the probabilities $P$ cannot be found and
    the integrals must be approximated numerically.


    Quadratures approximate an integral on $[a, b]$ as the sum of functional values
    evaluated at discrete points along the integration domain, and multiplied by a
    weight


    ```

    $$\int_{a}^{b} f(x)dx \approx \sum_{l=1}^{N} w_l f(x_l)$.

    ```


    The points $(x_1, \dots, x_N)$ are nodes, points, or abscissae, and the points
    $(w_1, \dots, w_N)$ are called weights or coefficients. In this chapter, we present
    general classes of quadratures, Newton-Cotes formulas and Gaussian quadrature.
    Newton-Cotes formulas are easy to implement, but they assume equally spaced abscissae.
    This means many abscissae are required in order for the approximation in Equation
    (5.1) to be accurate, especially if there are regions in the integration range
    where the function is steep or oscillatory. The consequence is that the computing
    time required to evaluate the sum (5.1) can be dramatically increased. Gaussian
    quadrature requires fewer abscissae sometimes as little as 10, but they are more
    difficult to understand, and weights are not easy to obtain. Once these are obtained,
    however, they can be stored and used when needed. In this chapter, we present
    Newton-Cotes formulas and Gaussian quadrature, and we also show how to use them
    to approximate double integrals.


    The probabilities $P_i$ in the Heston (1993) model require the integration domain
    $(0, \infty)$ so that $a=0$ and $b=\infty$ are required limits of the integral
    in (5.1). When we use Newton-Cotes formulas, we must truncate the upper limit.
    This chapter shows how this can be done sensibly with multi-domain integration
    described by Zhu (2010). Alternatively, Kahl and Jäck (2005) transform the domain
    of integration to $[0,1]$, which eliminates the need for truncation altogether.
    Finally, in the last two sections of this chapter, we present the fast Fourier
    transform'
  merge: -1
  img_proc: true
- pgno: 125
  md: '(FFT) pioneered by Carr and Madan (1999) and the fractional FFT of Chourdakis
    (2005), a refinement to the FFT that is more flexible than its predecessor. These
    methods are both very fast because they are able to produce a set of option prices
    along a grid of strikes in a single calculation.


    # THE INTEGRAND IN NUMERICAL INTEGRATION


    Authors often denote by $x_0$ the first abscissa in the numerical approximation
    of Equation (5.1). To make our notation consistent with that for Gaussian quadratures,
    we sometimes denote the first abscissa $x_i$. Furthermore, since array indexing
    in Matlab starts with 1, it can be convenient for the abscissas to start at 1.
    The literature on numerical integration method is rich and extensive, and there
    are many excellent textbooks on the subject, such as those by Burden and Faires
    (2010) and Cohen (2011).


    In (5.1), the abscissas are denoted $x$, but in the formulas for the integrals
    of the Heston model, the integration variable is denoted $\phi$, so the abscissas
    should be denoted $\phi_i$. The form of the integrand depends on which formula
    we are using to obtain the Heston call price. If we are using the original Heston
    (1993) formulation, the integrand in (5.1) for $P_i$ is


    ```

    $f(\phi_i) = \text{Re} \left[ \frac{e^{-i\phi_i} \ln K_f(\phi_i; X, v)}{\phi_i}
    \right] \quad \text{for } k=1, 2. \quad (5.2)

    ```


    If we are using the functional transform of Lewis (2000) covered in Chapter 4,
    the integrand is


    ```

    $f(\phi_i) = \text{Re} \left[ \frac{e^{-i\phi_i X}}{\phi_i^2 - i\phi_i} \hat{H}(\phi_i,
    v, \tau) \right] \quad (5.3)

    ```


    Finally, if we are using the Carr and Madan (1999) formulation covered in Chapter
    3, the integrand in (5.1) becomes


    ```

    $f(\phi_i) = \text{Re}[e^{-i\phi_i} \ln K(\phi_i)] \quad (5.4)

    ```


    where


    ```

    $$\psi(\phi_i) = \frac{e^{-rT} f_2(\phi_i) - (\alpha + i); x, v)}{\alpha^2 + \alpha
    - \phi_i^2 + i(2\alpha + 1)\phi_i}$

    ```


    and where $f_2$ is the characteristic function of the Heston model.


    # NEWTON-COTES FORMULAS


    Newton-Cotes are the simplest integration rules, but also the ones that require
    the most computing power. Closed Newton-Cotes formulas partition the domain of
    integration $[a, b]$ into equally spaced subintervals using the abscissas $x_1,
    x_2, \dots, x_N$.'
