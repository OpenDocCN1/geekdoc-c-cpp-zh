- pgno: 237
  md: "# American Options\n\n# Medvedev-Scaillet for Black-Scholes\n\nUnder the assumptions\
    \ of the Black-Scholes model the price $P(S(t), t)$ at time $t$ of an American\
    \ put option with time to maturity $\tau = T - t$ follows the PDE\n\n```\n$P_t\
    \ + (r - q)SP_S + \\frac{1}{2}\\sigma^2S^2P_{SS} - rP = 0 \\quad (8.35)$\n```\n\
    \nwith boundary conditions\n\n```\n$P(\\infty, t) = 0\\nP(S(T), T) = \\max(K -\
    \ S(T), 0)\\nP(\\tilde{S}(t), t) = \\max(K - \\tilde{S}(t), 0)\\nP_S(\\tilde{S}(t),\
    \ t) = -1 \\quad (8.36)$\n```\n\nwhere $\\tilde{S}(t)$ is the early exercise price,\
    \ for example, Albanese and Compolieti (2006). In Equations (8.35) and (8.36),\
    \ the subscripts denote differentiation, $r$ and $q$ are the risk-free rate and\
    \ dividend yield, and $\\sigma$ is the stock volatility.\nMedvedev and Scaillet\
    \ (2010) construct a modified version of the PDE in (8.35) in terms of the modified\
    \ price $P(\\theta, \\tau) = P(Ke^{-\\theta\\sqrt{\\tau}}, \\tau)$, where $\\\
    theta$ is the normalized moneyness\n\n```\n$$\\theta = \\frac{\\ln(K/S)}{\\sigma\\\
    sqrt{\\tau}}.$ \\quad (8.37)$\n```\n\nThe modified version of the PDE still follows\
    \ Equation (8.35) but replaces the last condition in (8.36) with the early exercise\
    \ price $\\tilde{S}(\tau) = Ke^{-\\theta\\sqrt{\\tau}}$. The unique solution to\
    \ this modified problem is the price of a barrier option that is executed immediately\
    \ as $\\theta$ reaches the barrier level $y$, where $y \\approx 2$.\n\nBy applying\
    \ the chain rule and using the PDE (8.35), it is straightforward to obtain the\
    \ modified PDE, (8.35) expressed in terms of $P(\\theta, \\tau)$\n\n```\n$$\\\
    theta P_\\theta + P_{\\theta\\theta} + \\frac{1}{\\sigma}[a^2 + 2(q - r)]P_\\\
    theta\\sqrt{\\tau} - 2(P + rP)\\tautau = 0.$ \\quad (8.38)$\n```\n\nAgain, subscripts\
    \ denote differentiation. The boundary conditions to the modified PDE are\n\n\
    ```\n$P(-\\infty, \\tau) = 0,\\nP(y, \\tau) = K(1 - e^{-y\\sqrt{\\tau}}). \\quad\
    \ (8.39)$\n```\n\nThe main result of Medvedev and Scaillet (2010) is that the\
    \ solution to the modified PDE (8.38) is the expansion\n\n```\n$P(\\theta, \\\
    tau) = \\sum_{n=1}^{\\infty} P_n(\\theta)\\tau^{n/2}. \\quad (8.40)$\n```"
