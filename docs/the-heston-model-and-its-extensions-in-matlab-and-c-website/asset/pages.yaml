    # **Approximate Volatility**


    In his excellent book, The Volatility Surface: A Practitioner''s Guide, Gather
    (2006) derives an approximation to local volatility in the Heston model that is
    valid when $\rho \approx 1$. In this section, we present his results and the details
    of his derivation.

    Recall that in the bivariate system of SDEs that characterize the Heston model,
    $W_{1,t}$ and $W_{2,t}$ are dependent Brownian motions with correlation $\rho$.
    It is well-known that $W_{1,t}$ and $W_{2,t}$, can be replaced by a Cholesky decomposition
    of two independent Brownian motions $Z_t$ and $B_t$, by defining $W_{1,t}=B_t+\sqrt{1-\rho^2}Z_t$.

    Gather (2006) derives approximate local volatility in terms of log-moneyness,
    $x_t=\ln(S/K)$, using a zero drift, so that $\mu=0$. The process for $x_t$, can
    be obtained using Ito''s lemma. Together with the Cholesky decomposition, we can
    write the Heston SDEs


    ```

    $dx_t = v_t dt + \sqrt{v_t}dB_t\ndv_t = \kappa(\theta - v_t)dt + \sigma\sqrt{v_t}(\rho
    dB_t + \sqrt{1-\rho^2}dZ_t)$

    ```


    where $E[dB_t,dZ_t]=0$. In the process for $v_t$ in (2.38), replace the term involving
    $\sqrt{v_t}dB_t$, with the process for $x_t$, and assume that $\rho \pm 1$ is
    so that the term $1-\rho^2$ vanishes. This produces


    ```

    $dv_t = \kappa(\theta - v_t)dt + \rho\sigma(dx_t+\frac{1}{2}v_td)$

    ```


    Gatheral defines $u_t=E[v_t|x_t]$ to denote the expected value of the time-instantaneous
    variance conditional on the log-moneyness at time T.'
