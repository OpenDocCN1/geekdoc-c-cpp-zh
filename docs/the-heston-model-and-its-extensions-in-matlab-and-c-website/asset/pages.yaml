  md: "# 212 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nThe C# functions\
    \ MTrans(), MMMult(), and MVMult() are used to find the transpose of a matrix,\
    \ to multiply a matrix with another matrix, and multiply a matrix with a vector,\
    \ respectively. These three functions are not presented.\nTo illustrate, we implement\
    \ the example of Clarke and Parrot (1999), which uses the settings K=10, r=0.1,\
    \ and T=0.2 years, with parameter values=5, θ=0.16, σ=0.9, ρ=0.1, and v₀=0.0625,\
