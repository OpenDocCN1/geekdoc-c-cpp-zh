- pgno: 395
  md: '# About the Website


    The website that accompanies this book contains extensive libraries of Matlab
    and C# code. The code includes dozens of functions for implementing all the methods
    covered in the book. It also includes scripts and market data to reproduce examples
    in the book. The code assumes intermediate-level familiarity with Matlab and C#
    as well as an understanding of basic programming principles.


    File names have chosen in an intuitive fashion, so that, for example, the file
    "BisectionBSIV" implements the algorithm for finding Black-Scholes implied volatilities,
    while "GenerateGaussLaguerre" generates abscissas and weights for Gauss-Laguerre
    quadrature. Whenever possible, the filenames are identical with Matlab and for
    the file extension.


    # CODE FUNCTIONALITY BY CHAPTER


    All of the functions and examples in the book have been coded in both Matlab and
    C#. The following table describes the functionality of the code, chapter-by-chapter.
    Please note that some functions, such as linear regression or interpolation, are
    not built into C#, and are included with the C# code. In Matlab, however, these
    are available as built-in functions and are not coded. In some cases, usually
    to speed up computations, built-in Matlab functions are not used and separate
    functions are used instead. The code also includes scripts to generate most of
    the figures in the book, but in Matlab only.


    | Chapter | Code Functionality |

    | --- | --- |

    | 1. The Heston Model for European Options | Obtaining the original Heston characteristic
    function

    Obtaining the original Heston price using

    Newton-Codes integration

    Consolidating the integrals into a single integral

    Obtaining the Black-Scholes price as a special case of the Heston model

    Generating the figure for the Heston integrand (Matlab only) |

    | 2. Integration Issues, Parameter Effects, and Variance Modeling | Calculating
    the Heston characteristic function under the "Little Trap" formulation of Brecher
    et al.

    Obtaining the Heston price using one or two characteristic functions and Gauss-Laguerre
    quadrature |


    (continues)


    The Heston Model and Its Extensions in Matlab and C.. Fabrice Douglas Rouah.

    © 2013 Fabric Douglas Rouah. Published 2013 by John Wiley & Sons, Inc.


    391'
  merge: -1
  img_proc: true
