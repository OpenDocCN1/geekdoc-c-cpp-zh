  md: "# 238 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\n```\nC1 = sigma*Y/(y*cdf+pdf);\n\
    C2 = -1/2*(C1*cdf*sigma^2-2*C1*cdf+mu+sigma*y^2*K) ...;\n// Set 1 polynomials\n\
    p01 = theta;\np11 = 0;\nq01 = 1;\nq11 = 0;\n// Set 2 polynomials\np02 = theta^2+1;\n\
    p12 = -1/2*C1-(sigma*2+mu)/sigma;\nq02 = theta;\nq12 = 0;\n// The Black-Scholes\
    \ American put approximation\ncdf = normpdf(theta);\npdf = normpdf(theta);\nPrice\
    \ = (C1*p01+q01*pdf) + p11*cdf+q11*pdf)*T^(1/2) ...\n+ (C2*p02+q02*pdf) + p12*cdf+q12*pdf)*T^(2/2);\n\
    ```\n\nWe do not need C# code to obtain the polynomials and their derivatives\
    \ in Equation (8.53), because C# does not have a symbolic calculator that allows\
    \ us to solve the PDEs. We do, however, create the C# function MSPutBS(), which\
    \ is very similar to the MSPutBS.m function presented in the earlier code snippet.\
    \ This C# function is not presented here.\n\nFinally, obtaining accurate prices\
    \ is done in two steps. In the first step, we find the barrier γ using Equation\
    \ (8.42). In the second step, we find yŷ into P(θ,τ,y) in (8.40). In Matlab, this\
    \ is accomplished with the MSPriceBS.m function which uses the built-in function\
    \ fmincon for the first step. The moneyness θ is used for the lower bound for\
    \ yŷ in the fmincon.function.\n\n```\nfunction [Price y theta] = MSPriceBS(S,K,T,sigma,r,q)\n\
    // Moneyness and optimization settings\ntheta = log(S)/sigma/sqrt(T);\nstart =\
    \ 2;\noptions = optset('LargeScale','off');\n// Find the barrier\n[yval] = fmincon(@p)-MSPutBS(p,...),start,...,theta);\n\
    Price = MSPutBS(y,theta,K,sigma,r,q);\n```\n\nWe can use the bisection algorithm\
    \ to find the barrier yŷ in C#, by setting the objective function to be the derivative\
    \ of (8.42) and finding its zero. The following function creates the derivative.\n\
    \n```\nstatic double MSPutBSdiff(double y,MSset mssettings,double dy) {\n  return\
    \ (MSPutBS(y+dy,mssettings)) - MSPutBS(\n  (y-dy,mssettings))/2.0/dy;\n}\n```"
