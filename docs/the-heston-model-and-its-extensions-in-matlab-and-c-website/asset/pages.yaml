  md: "# 98 THE HESTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nEquations (4.17)\
    \ and (4.19) for the call price depend on the analytical form of the fundamental\
    \ transform $H(k, v, \tau)$ and are, therefore, valid for a wide set of models,\
    \ including the Heston model. Lewis (2000) derives analytical expressions for\
    \ $H(k, v, \tau)$ for several models, including the Heston model, which we covered\
    \ in the previous section.\n\nLewis (2000) also finds an alternative solution\
    \ to the call price in (4.17), based on put-call parity and a covered call, which\
    \ has the payoff $\\min(S_T, K)$. This solution is valid under the simpler restriction\
    \ $0 < k_j < 1$. The payoff of the covered call is\n\n```\n$$\\min(S_T, K) = K\
    \ - (K - S_T)^+$$\n```\n\nTaking expectations on both sides and discounting, the\
    \ time $t$ price of the covered call is\n\n```\n$e^{-r\tau} E[\\min(S_T, K)] =\
    \ Ke^{-r\tau} - P(K)$\n```\n\nwhere $P(K)$ is the time $t$ value of a European\
    \ put struck at $K$. Put-call parity\n\n```\n$C(K, T) = S_t e^{rt} - [Ke^{-r\t\
    au} - P(K)] \\quad (4.18)\n```\n\nimplies that the call price can be expressed\
    \ in terms of the spot price and the covered call. Hence, the second solution,\
    \ we need to apply Alan Lewis's recipe to the covered call, which has payoff transform\n\
    \n```\n$$\\hat{f}(k, T) = \\int_{-\\infty}^{\\ln K} e^{ikx}[K - (K - e^x)^+]dx\
    \ = \\int_{-\\infty}^{\\ln K} e^{ikx}dx - \\int_{\\ln K}^{\\infty} e^{i(k+1)x}dx\\\
    n= K\\left(\\int_{-\\infty}^{\\ln K} e^{ikx}dx + \\int_{\\ln K}^{\\infty} e^{i(k+1)x}dx\\\
    right) = \\frac{Ke^{ikK}}{ik} + \\frac{Ke^{i(k+1)K}}{i+1} = \\frac{K^{k+1}}{k^2-ik}$$\n\
    ```\n\nwhere the strip is $0 < k_j < 1$ because the first integral requires $k_j\
    \ > 0$, while the second does. The payoff transform for the covered call is identical\
    \ to that for the call, except for the absence of a minus sign, and $0 < k < 1$,\
    \ is easier to derive with the restriction $k_j > 1$ for the call. Applying the\
    \ Lewis (2000) recipe to the covered call and using put-call parity in Equation\
    \ (4.18), the solution is,\n\n```\n$C_2(K) = S_t e^{-r\tau} - \\frac{Ke^{-r\t\
    au}}{2\\pi} \\int_{k_j}^{\\infty} \\frac{e^{ikx}}{k^2-ik} H(k, v, \tau) dk \\\
    quad (4.19)\n```\n\nwhere $\\max(0,\\alpha) < k < \\min(1,\beta)$. The value $C_2(K)$\
    \ is identical to $C_1(K)$ in (4.17) except for the presence of the term $S_t\
    \ e^{-r\tau}$ and a different strip. Indeed, the strip for the transform $\\hat{f}(k,T)$\
    \ of the covered call is $0 < k_j < 1$ and the strip for $\\hat{H}(k,v,\tau)$\
    \ is $\\alpha < k_j < \beta$. Hence, $C_2(K)$ is defined on the intersection of\
    \ these two strips,"
