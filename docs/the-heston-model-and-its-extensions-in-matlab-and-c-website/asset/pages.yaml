- pgno: 256
  md: 'and from the Matlab output screen into the function MSputHeston.m, which is
    similar to the MSputBS.m function defined in the pricing section for pricing American
    puts under the Black-Scholes model. The function can accommodate an expansion
    up to including fifth order, which can be reduced to three or fourth orders to
    reduce computational time.


    ```

    function Price = MSputHeston(y,theta, K,params, r, q, T,NumTerms)

    cdf = normcdf(y)

    pdf = normpdf(y)

    % First set of polynomials

    p11 = 0;

    q11 = 0;

    p01 = theta;

    q01 = -1;

    1 = v^(1/2)*y*K*(cdf+pdf)

    % Second set of polynomials

    p12 = 1/2*(v-2*mu)*cdf

    q12 = 1/4*rho*sigma*theta*y*K*(cdf+pdf)

    p02 = theta^2;

    q02 = theta;

    c2 = -1/4*(theta+2)*(2*cdf-4*mu*y*sigma*pdf)

    % Third set of polynomials

    if NumTerms >= 5

    p15 = -1/192*v*y^3/(3/2)*(-16*v*y^2*sigma^3...

    q15 = 1/6144*rho^4*sigma^4/v*(3/2)*y*K...

    p05 = theta^5+10*theta^3*15*theta

    q05 = theta^4+9*theta^2+8

    c5 = -1/645120*(-4030+y^13)*cdf^2*v^6...

    end

    % The Heston American put approximation

    cdf = normcdf(theta)

    pdf = normpdf(theta)

    Price = (C1*(p01*cdf+q01*pdf)+p11*cdf+q11*pdf)*T^(1/2)...

    + (C2*(p02*cdf+q02*pdf)+p12*cdf+q12*pdf)*T^(2/2)...

    + (C3*(p03*cdf+q03*pdf)+p13*cdf+q13*pdf)*T^(3/2)...

    if NumTerms == 4

    Price = Price + (C4*(p04*cdf+q04*pdf)+p14*cdf

    + q14*pdf)*T^(4/2).

    elif NumTerms == 5

    Price = Price + (C4*(p04*cdf+q04*pdf)+p14*cdf

    + q14*pdf)*T^(4/2)...

    + (C5*(p05*cdf+q05*pdf)+p15*cdf

    + q15*pdf)*T^(5/2));

    ```


    The Matlab function MSPrice.m returns the second approximation of Medvedev and
    Scaillet (2010) of the American put recall. This approximation uses the expansion
    to find the early exercise premium, and obtains the price of American as the price
    of the put obtained under a closed-form solution'
