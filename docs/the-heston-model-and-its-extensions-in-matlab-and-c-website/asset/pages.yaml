    \n| | Heston (1993) | Attari (2004) | Carr and Madan (1999) | Lewis (2000) | Lewis\
    \ (2001) |\n|---|---|---|---|---|--|\n| Price Delta | 0.5836 | 0.5836 | 0.5083\
