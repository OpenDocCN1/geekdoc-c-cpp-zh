    \ | 0.0464 | | | -0.7670 | S&P500, |\n| SST (2004)$^e$ | 0.0607 | 0.0770 | 0.0298\
    \ | 0.0654 | -0.7571 | Eurostock 50, 10/2003 |\n| BCC (1997)$^f$ | 1.15 | 0.04\
    \ | | 0.0348 | -0.6 | S&P500, 1988-1991 |\n\n> $^a$Guillaumes and Schutens (2012)\n\
    $^b$Christoffersen, Jacobs, and Heston (2009)\n$^c$Schutens, Simons, and Tistaert\
    \ (2004)\n$^d$Bakshi, Cao, and Chen (1997)\n$^e/f$ not applicable\n\nThe functions\
    \ fmincon.m and fminsearch.m require a set of starting values for the parameters.\
    \ With any optimization, it is important that these starting values lie too far\
    \ away from the true values. We can look to estimates from the empirical literature,\
    \ such as in Table 6.2, for clues on appropriate starting values.\n\nWe must apply\
    \ good judgment when selecting starting values. For example, volatility and price\
    \ are generally negatively correlated, so we may specify the starting value for\
    \ the correlation lie in $(-1,0)$. Ait-Sahalia and Kimmel (2007) use 30-day-at-the-money\
    \ volatility as a proxy for instantaneous unobserved volatility, so we can use\
    \ that value as a starting estimate for $v_0$.\n\nTo find starting values of $\r\
    ho$ and $\\sigma_i$, we can use the \"Smart Parameter\" method of Gautier and\
    \ Rivaille (2009), which is described in the remainder of this section. Their\
    \ method is based on the approximation of the option price by expansion developed\
    \ by Benhamau et al. (2010). Gautier and Rivaille (2009) express the approximation\
    \ in terms of the call price, but it can also be expressed in terms of the put\
    \ price, which is consistent with the original development of Benhamau et al.\
    \ that we cover in Chapter 9. Gautier and Rivaille rewriter the Heston put price\
    \ as\n\n```\n$$Put = A + B\\sigma^2 + C\\rho\\sigma + D\\rho^2\\sigma^2$$$\n```\n\
    \nwhere\n\n```\n$$A = P_{BS}(x, \\hat{w}_r), \\quad B = (r_0 + \\theta_1)\\frac{\\\
    partial^2 P_{BS}}{\\partial\\hat{w}_r^2}, \\quad C = (v_0 + \\theta_1)\\frac{\\\
    partial^2 P_{BS}}{\\partial x\\partial\\hat{w}_r}$$$\n```\n\n```\n$$D = \\left[v_0\
    \ + \\theta_1 + \\frac{1}{2}(r_0 + \\theta_1)\\frac{\\partial^3 P_{BS}}{\\partial\
    \ x^2\\partial\\hat{w}_r}\\right]\\frac{\\partial^4 P_{BS}}{\\partial x^2\\partial\\\
    hat{w}_r^2}$$$\n```\n\nIn Equation (6.7), the derivatives of the Black-Scholes\
    \ $P_{BS}(x, \\hat{w}_r)$ are in terms of the log-stock price $x = \\ln S$ and\
    \ the total initial variance $\\hat{w}$, we encountered in Chapter 2\n\n```\n\
    $$$\\hat{w}_r = (v_0 - \\theta)\\left(\\frac{1 - e^{-\\kappa t}}{\\kappa}\\right)\
    \ + \\theta$$\n```"
