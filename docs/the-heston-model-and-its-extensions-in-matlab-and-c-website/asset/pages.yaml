  md: "# 128 THE HSTON MODEL AND ITS EXTENSIONS IN MATLAB AND C#\n\nthe number of\
    \ sign changes decreases. This will identify the regions in x over L_N(x) changes\
    \ sign, and consequently, the roots are located. This approach to finding roots\
    \ of polynomials is demonstrated in textbooks such as by McNameee (2007).\n\n\
    To implement this method in C#, we first need the polyrem() function for obtaining\
    \ the remainder of polynomial division, adapted from the C++ code in Press et\
    \ al. (2007).\n\n```\nstatic double[] polyrem(double[] P, double[] Q) {\nint np\
    \ = P.Length - 1;\nint nq = Q.Length - 1;\nwhile (nq >= 0 && Q[nq] == 0) nq--;\n\
    double[] rem = new double[np+1];\nArray.Copy(P, rem, np+1);\nfor(int k=np-nq;\
    \ k>=0; k--) {\n    quo[k] = rem[k]/Q[nq];\n    for(int j=nq+k;j>k; j--) {\n \
    \       rem[j] -= quo[k]*Q[j-k];\n    }\n}\nfor(int j=nq; j<np; j++) {\n    rem[j]\
    \ = 0.0;\n}\nreturn rem;\n}\n```\n\nThe Sturm C# function generates the Sturm\
    \ sequence of polynomials. It uses the polydiff(), which returns the first-order\
    \ derivative of a polynomial. Since the Sturm sequence is comprised of polynomials\
    \ of different degrees, the sequence is stored in a jagged array in C#.\n\n```\n\
    static double[] sturm(double[] p) {\nint N = p.Length;\ndouble[] P = new double[N];\n\
    P[0] = p;\nP[1] = polydiff(p);\nfor(int j=2; j<N-1; j++) {\n    P[j] = polyrem(P[j-2],\
    \ P[j-1]);\n    for(int k=0; k<P[j].Length; k++) {\n        P[j][k] = -P[j][k];\n\
    \    }\n}\nreturn P;\n}\n```\n\nFinally, the findroot returns a vector of roots\
    \ of a polynomial. The function uses the C# function findintervals(), which returns\
    \ the intervals on which the polynomial changes sign, in the two vectors: one\
    \ for the left and right endpoints of each interval. These endpoints are points\
    \ in the Start[] and End[], respectively, which are returned as part of the C#\
    \ structure SturmRoots. The left and right endpoints produce values of the polynomial\
    \ that are opposite in sign, so the root is contained within the interval defined\
    \ by the endpoints. These endpoints are used as inputs to the Bisection() function,\
    \ which uses the bisection algorithm to find the root."
