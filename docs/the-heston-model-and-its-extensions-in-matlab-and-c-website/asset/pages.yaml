- pgno: 119
  md: "# The Fundamental Transform for Pricing Options\n\nBoth expansions make use\
    \ of the integrals $J_1, J_3$, and $J_4$, which in the Heston model take the following\
    \ form, using $\\psi = \\frac{1}{2}$ in Equations (3.3.7), (3.3.8), and (3.3.9)\
    \ on page 86 of Lewis (2000).\n\n```\n$J_1(v, T) = \\int_0^T \\frac{\rho}{K} (1\
    \ - e^{-K(T-\\tau)})(\\theta + e^{-K(v-\\theta)})d\\tau$\n```\n\n```\n$\\frac{\r\
    ho}{K} \\left[ \\theta + (1 - e^{-KT}) \\left( \\frac{v - 2\\theta}{K} \\right)\
    \ - e^{-KT}(v - \\theta) \\right] \\quad (4.38)$\n```\n\n```\n$J_3(v, T) = \\\
    frac{1}{2K^2} \\int_0^T (1 - e^{-K(T-\\tau)})^2(\\theta + e^{-K(v-\\theta)})d\\\
    tau$\\n\\\\frac{1}{2K^2} \\left[ T + \\frac{1}{2K}(1 - e^{-2KT}) - \\frac{2}{K}(1\
    \ - e^{-KT}) \\right]$\n```\n\n```\n$\\frac{(v-\\\theta)}{2K^2} \\left[ 1 - e^{-2KT}\
    \ - 2Te^{-KT} \\right] \\quad (4.39)$\n```\n\n```\n$J_4(v, T) = \\int_0^T \\frac{\r\
    ho^2}{K^2} (\\theta + e^{-K(T-\\tau)})(\\left(1 - e^{-K\\tau}\\right)se^{-K\\\
    tau})d\\tau$\\n\\\\frac{\rho^2}{K^3} \\left[ T(1 + e^{-KT}) - \\frac{2}{K}(1 -\
    \ e^{-KT}) \\right]\\n\\\\\\frac{\\rho^2}{2K^2} T^2e^{-KT}(v-\\\theta) + \\frac{\\\
    rho^2(v-\\\theta)}{K^3} \\left[1 - e^{-KT} - Te^{-KT} \\right] \\quad (4.40)$\n\
    ```\n\nFinally, the following ratios of Black-Scholes derivatives are needed\n\
    \n```\n$R^{1,2} = \\frac{1}{2}-W, \\quad R^{1,2} = \\left[ W^2 - W - \\frac{4-Z}{Z}\
    \ \\right]$\n```\n\n```\n$R^{2,0} = T \\left[ W - \\frac{W}{2}\\frac{1}{2Z} -\
    \ \\frac{1}{8} \\right] \\quad (4.41)$\n```\n\n```\n$R^{2,2} = T \\left[ \\frac{W^4}{2}\
    \ - \\frac{W^3}{2}\\frac{3X^2}{Z^3} + \\frac{X(12+Z)}{8Z^3} - \\frac{48-Z^2}{32Z^2}\
    \ \\right]$\n```\n\nIn recent years, Lewis (2000) define $W=X/Z, X=\\log(S_0/Q)\
    \ + (r-q)T$ in the previous sections of this chapter, and $V=\\overline{V}$. The\
    \ first series expansion produces Heston calls directly, while the second series\
    \ produces an implied variance that is then fed into the Black-Scholes model to\
    \ produce the Heston call. The first expansion (Series I) produces the call price\
    \ $C_I(S_0, v_0, T)$ directly\n\n```\n$C_I(S_0, v_0, T) \\approx C_{BS}(S_0, \\\
    overline{V}, T) + \\sigma\\frac{1}{2}R^{1,1}C_S(S_0, \\overline{V}, T) +$\n```\n\
    \n```\n$$\\sigma^2C_v(S_0, \\overline{V}, T) + \\left[ \\frac{J_2}{T}\\frac{J_3R^{2,0}}{T^2}\
    \ + \\frac{J_4R^{1,2}}{T} - \\frac{(J_1)^2}{2T^2} \\right] \\quad (4.42)$\n```"
  merge: -1
