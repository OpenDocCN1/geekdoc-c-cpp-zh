    $N = 2^n$.


    Another advantage of the FRFT is that we can restrict the range of strikes on
    which the algorithm is applied. Suppose we want range of strikes to begin at $K''$.
    From Equation (5.23), selecting the log-strike increment $\lambda$ as


    ```

    $\lambda = \frac{2}{N}\log(S/K'')$ (5.31)

    ```


    will guarantee that the first strike will be $k_1 = \log S/K''$ and the last strike
    will be approximately $k_n \approx S''/K''$. By choosing $K''$ close to $S$, we
    can make $\lambda$ as small as we wish, and obtain a very narrow discretization
    range for the strike price. We then select an arbitrary value for the integration
    grid size $\eta$. This is illustrated in Table 5.6, where we have used $K=20$
    (recall that $\hat{S}=30$). The FRFT constructs the strike grid in increments
    of approximately $0.02$ in the near-the-money region.


    We could also apply Equation (5.31) to construct a narrow range of strikes for
    the FFT itself, but since we are constrained in the relationship between $\lambda$
    and $\eta$, this would result in a large value for $\eta$, and a very coarse integration
    grid.


    # CONCLUSION


    In this chapter, we have presented a variety of numerical integration methods,
    all of which work reasonably well. Newton-Cotes formulas are easy to understand
    and implement, but require more abscissas and, therefore, more computing time,
    than Gaussian quadrature. Among these methods, Gauss-Laguerre quadrature is well-suited
    to the Heston model, however works well for the Kahl and Jackel (2005) transformation
    of the integration domain. Implementing Gaussian quadrature in $C\#$ is more involved
    than in Matlab because we must create $C\#$ functions in polynomial roots. We
    also showed that it is straightforward to adapt Newton-Cotes formulas and Gaussian
    quadrature for the approximation of double integrals. Finally, we presented the
    Fourier transform'
