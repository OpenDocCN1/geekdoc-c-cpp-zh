  md: "# Time-Dependent Heston Models\n\n# LINKING THE BIVARIATE CF AND THE GENERAL\n\
    RICCATI EQUATION\n\nThe univariate characteristic function for $x_\tau$ in the\
    \ Heston model is Equation (9.10)\n\n```\n$f(\\phi, \tau, x_\tau, \nu_\tau) =\
    \ \\exp(C(\\tau, \\phi) + i\\phi x_\tau + D(\\tau, \\phi)\\nu_\tau)$ \\quad (9.32)$\n\
    ```\n\nWith $C(\tau, \nu_\tau)$ given by (9.5) and $D(\tau, \\phi)$ given by (9.2).\
    \ The bivariate characteristic\nfunction for $(x_\tau, \nu_\tau)$, on the other\
    \ hand, is (9.15)\n\n```\n$f(\\phi_1, \\phi_2: x, \\nu) = \\exp(A(\\tau, \\phi_1,\
    \ \\phi_2) + i\\phi_j x + C(\\tau, \\phi_1, \\phi_2)\\nu_j)$ \\quad (9.33)$\n\
    ```\n\nWith $A(\\tau, \\phi_1, \\phi_2)$ given by (9.31) and $C(\\tau, \\phi_1,\
    \ \\phi_2)$ given by (9.29). The two char-\nacteristic functions are clearly similar\
    \ in form. We showed in the previous section\nthe coefficients arise from the\
    \ choice of\ninitial conditions for the general solution of the Riccati equation\
    \ presented-\nby. To obtain the univariate characteristic function, we set $C_1^j\
    \ = 0$ and $D_1^j = 0$ in\nEquation (9.6), but to obtain the bivariate characteristic\
    \ function we set $C_2^j = 0\nand $D_2^j = i\\phi_2$\n\nIf we set $\\phi_2 = 0$\
    \ and $\\phi = \\phi_1$ in the bivariate characteristic function (9.11)\nwe obtain\
    \ $f(\\phi, 0: x, \\nu) = E[exp(i\\phi x_\tau)]$, which is the univariate characteristic\
    \ function\ncoefficients of the bivariate characteristic function, we also obtain\
    \ $D_2^j = 0$. Hence, when we set $\\phi_2 = 0$ in\ntwe recover the coefficients\n\
    of the univariate characteristic function $f_2(\\phi, x, \\nu)$. In other words,\
    \ we\nobtain\n\n```\n$A(\\tau, \\phi, 0) = C_2(\\tau, \\phi), \\quad C(\\tau,\
    \ \\phi, 0) = D_2(\\tau, \\phi)$ \\quad (9.34)$\n```\n\nIt is easy to verify that\
    \ setting $\\phi_2 = 0$ in Equation (9.27) produces $g_2 = (Q_2 + d_2)/(Q_2 -\
    \ d_2)$, as shown in Chapter 1, and consequently, that $C(\\tau, \\phi, 0)$ in\
    \ (9.9)\ncomes\n\n```\n$C(\\tau, \\phi, 0) = \\frac{\\kappa - \\rho\\sigma\\phi\
    \ + d_2}{\\sigma^2} (1 - \\frac{1 - e^{-d_2\\tau}}{1 - ge^{-d_2\\tau}})$ \\quad\
    \ (9.35)$\n```\n\nwhich is exactly $D_2(\\tau, \\phi)$ from Chapter 1. Furthermore,\
    \ with $g_2 = (Q + d_2)/(Q_2 - d_2)$, $A(\\tau, \\phi)$ in (9.31) becomes $C_1(\\\
    tau, \\phi)$.\n\nFinally, the coefficients of the bivariate characteristic function\
    \ can be written\nin an equivalent form that is consistent with the \"Little Trap\"\
    \ of\nAlbrecher et al. (2006), as in Kahl (2008). Indeed, by setting $\\tilde{c}_2\
    \ = 1/g_2$ we\nwrite $C(\\tau, \\phi_1, \\phi_2)$ in Equation (9.29) as\n\n```\n\
    $C(\\tau, \\phi_1, \\phi_2) = \\frac{(\\kappa - \\rho\\sigma\\phi_1 - d_2)(\\\
    kappa - \\rho\\sigma\\phi_1 + d_2)\\tilde{c}_2e^{-d_2\\tau}}{\\sigma^2(1 - \\\
    tilde{c}_2e^{-d_2\\tau})}. \\quad (9.36)$\n```\n\nThis is the definition of Kahl\
    \ (2008) with $c = G(\\tau)$ from his Equation (2.119),\nD($\\tau$) in his Equation\
    \ (2.120) equivalent to $d_2$, and with $u_1$ replacing $\\phi_1$ and $u_2$"
