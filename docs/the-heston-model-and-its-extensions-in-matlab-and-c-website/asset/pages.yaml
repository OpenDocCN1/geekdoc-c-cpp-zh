- pgno: 157
  md: 'price $C(\tau_k, K_k) = C_{ik}$ and a corresponding model price $C(\tau_k,
    K_k; \Theta) = C_{ik}^{\Theta}$ generated by the Heston model. Attached to each
    option is an optional weight $w_{ik}$. There are many possible ways to define
    a loss function, which usually fall into one of two categories: those based on
    prices, and those based on implied volatilities.


    The first category of loss functions are those that minimize the error between
    quoted and model prices. The error is usually defined as the squared difference
    between the quoted and model prices, the absolute value of the difference; relative
    errors can also be used. For example, parameter estimates obtained using minimizing


    ```

    $$\frac{1}{N} \sum_{t,k} w_{ik}(C_{ik} - C_{ik}^{\Theta})^2 \quad (6.2)$

    ```


    with respect to $\Theta$, where $N$ is the number of quotes. The relative mean
    sum of squares (RMSE) parameter estimates are obtained using the loss function


    ```

    $$\frac{1}{N} \sum_{t,k} w_{ik}\frac{(C_{ik} - C_{ik}^{\Theta})^2}{C_{ik}} \quad
    (6.3)$

    ```


    Alternatively, we can define the error in terms of the absolute value, so that
    $|C_{ik} - C_{ik}^{\Theta}|$, and set up a loss function as in (6.2) and (6.3).
    One well-known disadvantage of the MSE loss function is that short market, out-of-the-money
    options with very little value contribute to the sum in (6.2). Hence, the estimates
    will tend to fit more reality, in-the-money options, with the detriment of the
    other options. One remedy is to use in-the-money options only, so that in (6.2),
    call options are used for strikes less than the spot price, and put options are
    used for strikes greater than the spot price. The other remedy is to use the RMSE
    loss in (6.3). The problem with RMSE, however, is that the opposite effect occurs.
    Indeed, because the presence of $C_{ik}$ in the denominator, options with low
    market value will over-contribute to the sum in (6.3). The over- and undercontribution,
    however, can be mitigated by assigning weights $w_{ik}$ to the choice of weights
    which is usually subjective.


    The second category of loss functions are those that minimize the error between
    quoted and model implied volatilities. Again, the error is usually defined as
    the squared difference, absolute difference, or relative difference, between quoted
    and implied volatilities. This category of loss function is sensitive, since options
    are often quoted in terms of implied volatility, and the fit of the model is often
    assessed by comparing quoted and model implied volatilities. For example, the
    implied volatility mean error of squares (IVMSE) parameter estimates are based
    on the loss function


    ```

    $$\frac{1}{N} \sum_{t,k} w_{ik}(IV_{ik} - IV_{ik}^{\Theta})^2 \quad (6.4)$

    ```


    $IV_{ik} = IV(\tau_k, K_k)$ and $IV_{ik}^{\Theta} = IV(\tau_k, K_k; \Theta)$ are
    the quoted and model implied volatilities, respectively. The relative and absolute
    versions can also be used.'
