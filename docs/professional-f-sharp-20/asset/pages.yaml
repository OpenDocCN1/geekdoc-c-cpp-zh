  md: "# Consuming Services | 389\n\n```\nmaxArrayLength=\"16384\"\nmaxBytesPerRead=\"\
    4096\" maxNameTableCharCount=\"16384\" />\n<security mode=\"None\">\n  <transport\
    \ clientCredentialType=\"None\" proxyCredentialType=\"None\"\n  realms=\"\">\n\
    \    <extendedProtectionPolicy policyEnforcement=\"Never\" />\n  </transport>\n\
    \  <message clientCredentialType=\"Username\" algorithmSuite=\"Default\" />\n\
    \  </security>\n</binding>\n<basicHttpBinding>\n<client>\n  <endpoint address=\"\
    http://localhost:8000/WeatherService/WeatherService\"\n        binding=\"basicHttpBinding\"\
    \ bindingConfiguration=\"basicHttp\"\n        contract=\"WeatherService\" name=\"\
    basicHttp\" />\n</client>\n</basicHttpBinding>\n</system.serviceModel>\n</configuration>\n\
    ```\n\nCode snippet App.config\n\nThe preceding example provides a means for the\
    \ code that will create a WeatherServiceClient to know how to make calls to, as\
    \ well as parameters around these times like timeouts and the like <endpoint>\
    \ configuration is of particular note and should match the <endpoint> that was\
    \ specified on the host configuration. Many good WCF books will provide adequate\
    \ detail on how to use all the provided settings. Frankly, the default settings\
    \ are good enough for us to see how F# code will work when using a WeatherServiceClient:\n\
    \n```\nopen ProFSharp.Services\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_394_0.png)\n\
    \n```\nlet getWeatherFor place =\n  use weatherService = new WeatherServiceClient()\n\
    \  let theWeather = |> weatherService.GetForecast\n\n  printf \"The weather in\
    \ %s average %f degrees with %s, we %s!\"\n  theWeather.City\n  theWeather.AverageExpectedTemperature\n\
    \  theWeather.Humidity\n  theWeather.RecommendedAttire\n  printf \"%s any key\
    \ to continue\"\n  System.Console.ReadKey() |> ignore\n\ngetWeatherFor \"Romeville,\
    \ IL\"\n```\n\nCode snippet Program.Fs\n\nThe client is an IDisposable resource,\
    \ so it is important to make sure to use the binding when retrieving it. Outside\
    \ of that, the mechanics of using the service are much more idiomatic F# code."
