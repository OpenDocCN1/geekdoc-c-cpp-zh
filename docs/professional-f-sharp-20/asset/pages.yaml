  md: "Because the legitimacy of this cast cannot be known until runtime, F# programmers\
    \ should put the same kind of defensiveness around this operation as C# and Visual\
    \ Basic developers do around any casts performed. In the event the downcast fails,\
    \ the usual .NET ClassCastException is thrown.\n\nTo avoid the potential ClassCastException,\
    \ an object can be tested to see if it is successfully casting using the ? operator.\
    \ It works the same way as the downcast operator, except that it returns a boolean\
    \ value indicating whether the cast is successful.\n\nLike upcasting, downcasts\
    \ can also be written in a keyword-like form using downcast:\n\n```\nlet p2 :\
    \ Person = upcast Student(\"Ken\", \"Sipe\", 40)\nlet s2 : Student = downcast\
    \ p\n```\n\nAgain, as with upcast, the use of downcast is relatively rare and\
    \ is only useful in situations where the type to which cast is easily inferred\
    \ from the left side of the expression, which usually acts enough of a restriction\
    \ to make the ? operator preferable.\n\n# Flexible Types\n\nBecause upcasting\
    \ is automatic in most of the other languages running on the .NET platform, the\
    \ .NET Framework makes use of base-type parameters in its methods. In many cases,\
    \ F# developers will create classes and methods that allow for similar kinds of\
    \ functionality, but the need to explicitly perform the upcast will feel tedious\
    \ and annoying after a short while.\n\nFortunately, F# supports a special kind\
    \ of type designation known as the flexible type constraint. In code, it is abbreviated\
    \ as #Person and indicates that any type that inherits from Person is acceptable\
    \ as a:\n\n```\ntype Printer() =\n    member this.txtName(p : #Person) =\n   \
    \ System.Console.WriteLine(\"{0}\", p.FirstName)\n```\n\nThis allows the use of\
    \ any object that has the type in its pedigree or of the exact type type specified:\n\
    \n```\n// using \"p\" and \"s\" from earlier...\nlet printer = new Printer()\n\
    printer.txtName(p)\nprinter.txtName(s)\n```\n\n(Formally, when declaring the reference,\
    \ the F# language is actually declaring the reference as a generic parameter with\
    \ a type constraint using the upcast operator, a la:\n\n```\ntype Printer() =\n\
    \    member this.txtName(p : #Person) =\n    System.Console.WriteLine(\"{0}\"\
    , p.FirstName)\n    member this.GenerictxtName(p : 'a when a > Person) =\n   \
    \ System.Console.WriteLine(\"{0}\", p.FirstName)\n```\n\nGenerics are covered\
    \ in more detail in Chapter 10."
