    \nIn design patterns, a Strategy is a setup where an object that implements an\
    \ algorithm can be passed in for execution without knowing the actual details\
    \ of the algorithm. More important, an appropriate Strategy can be selected at\
    \ runtime, rather than being decided (some might say hard-coded) at compile-time.\
