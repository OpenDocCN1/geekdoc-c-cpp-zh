    Pattern-matching is a fundamental part of the F# language, and of functional languages
    in general, that it should be considered to be absolutely critical to understanding
    any code written in F#. It provides well beyond the basic switch/case multi-if
    capabilities that C# or Visual Basic provide, to give developers the ability to
    do data decomposition and break complex data structures down into smaller parts
    for analysis and extraction.'
