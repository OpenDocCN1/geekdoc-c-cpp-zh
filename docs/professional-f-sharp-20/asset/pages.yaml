  md: '# 23


    # # Services


    WHAT''S IN THIS CHAPTER?


    +   * Defining service contracts

    * Hosting F# services

    * Implementing contracts

    * Consuming services


    It is amazing to see that,, even at the time of publication in 2010, most applications
    currently in production trend to interface with other systems through mechanisms
    that create extraneous coupling. It is still common to see mechanisms such as
    file polling (system A polls an FTP server until B drops a file in the right place)
    and shared databases. The former is wasteful, and the latter presents all sorts
    of pain as systems grow and evolve. Shared databases are particularly bad because
    they present what is often an "unprotected door" through which data can enter
    any sort of validation or business rules applied. They also effectively become
    a giant API, with every table, every column, and every row adding to the surface
    area of what must be tested when changes are made.


    # OVERVIEW


    To avoid this and provide a better alternative for interoperation, Service Oriented
    Architecture (SOA) was invented. Services are developed that provide interfaces
    between platforms so that we can open the functionality of a system to other systems,
    while preserving the integrity of those systems. Services can take the form of
    web services, but they do not need to be served via the web, also data that has
    deep support in the Microsoft Windows Communication Foundation. The form of the
    service is less important than what it does, and making sure it is written in
    the right way to be relevant (meet a business need), reusable, scalable, and secure.'
  merge: -1
