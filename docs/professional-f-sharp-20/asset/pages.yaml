  md: "Of top of all this, the language can start to make the explicit \"generic\"\
    \ declarations of the earlier\nC# operations even less necessary, but now the\
    \ compiler will have the ability to infer the actual types\nof the parameters,\
    \ and with it, the ability to infer them as generic type parameters:\n\n```\n\
    var swap = delegate (l, r) {\n  var temp = r; r = l; l = temp;\n};\n```\n\nHere,\
    \ the compiler can infer that l and r are of the same type, but that actual type\
    \ is entirely irrele-\nvant, because any type (class or struct, user-defined or\
    \ BCL) can satisfy the inferred type parameters\nfor l and r.\n\nThis would make\
    \ much of the earlier code around running so much, easier to write and\nunderstand.\n\
    \n# IMMUTABILITY\n\nAs an old joke, a man walks into a doctor's office and says,\
    \ \"Doctor, it hurts every time I do\nthis\" and rubs his thumb into his eye.\
    \ The doctor, without missing a beat, says \"Well, don't do that,\nand you'll\
    \ be fine.\" Concurrency experts have long had a similar joke: If it hurts to\
    \ write the locking\ncode around every time the program changes state, then don't\
    \ change state and you'll be fine. After\nall, if variable never changes state,\
    \ then no operation is possible and no locking\ncode around is necessary.\n\n\
    Although the proponents of fully-immutable variable state (also known as the \"\
    functional\nlanguage\") continue to wage loud and codious arguments against those\
    \ who favor the merits of\npartially variable state (the \"impure language\"),\
    \ too many systems and libraries in the\n.NET ecosystem rely on the capability\
    \ to change variable state in a running program to abandon\nthe idea of mutable\
    \ state entity. That is, many objects in a .NET program remain immutable\ninitialized,\
    \ and many others could do so with little concern or change to their use:\n\n\
    ```\nPerson tabloid = new Person \"Tallbot\", \"Crowell\", 29\";\nPerson tabloid\
    \ = new Person FirstName, LastName,\ntallbot. LastName. Age + 1;\n```\n\nEnforcing\
    \ this, requires the developer writing the class type to ensure there's no way\
    \ to\nmodify the contents of those instances. This means fields must be marked\
    \ as read-only and\nproperties with a \"get\" handler\n\nIf, however, the presumption\
    \ is that most objects will remain unchanged when created, then rather\nassuming\
    \ the objects should be mutable by default, the language can make the opposite\n\
    assumption and require the use of a key to indicate mutability.\n\nThanks to the\
    \ power of inference, the programmer no longer has to stress over the low-level\
    \ physical\ndetails of how the code projects itself onto the underlying CLR. Perhaps,\
    \ surprisingly, none of\nthe earlier syntax needs to change the compiler simply\
    \ chooses to generate the code differently, to\nbe immutable by default instead\
    \ of murable."
