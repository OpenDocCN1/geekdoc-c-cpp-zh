    \nAs developers with C# and Visual Basic will already know, interfaces define\
    \ a set of behaviors (methods, properties, and so on) that any implementing class\
    \ must provide or be abstract and therefore unantiable. Within the .NET environment,\
    \ interfaces are used to allow a type to belong to a group of related types without\
    \ having to use the (single) implementation because a type may inherit from any\
