  md: '# UNIT


    The Unit type in F# is a special type, one that has no direct equivalent in traditional
    object-oriented or imperative programming languages. In practice, to the C# and
    Visual Basic developer, Unit is a combination of null and System.Void. In essence,
    unit is the type that represents no type (similar to System.Void) and has one
    value (given by the literal (), similar to null). It is used in situations where
    the value returned from an expression needs to represent the case where there
    is no value to return.


    Developers with C# and Visual Basic may find the general disdain for null and
    void to be confusing at first; a staple resource for those languages to indicate
    a response in a return value. F# provides alternative ways to represent the lack
    of a response — the option type — is described in more detail in Chapter 5.


    > Note that F# supports the keywords null and void, and they are used as one might
    expect — the first as a value and the second as a type, the principle for these
    two centers around the area of .NET interoperability. More on null and void can
    be found on Chapter 18.


    # UNITS OF MEASURE TYPES


    In addition to the primitive types provided here, F# provides a feature, colloquially
    known as units-of-measure, which allows an F# programmer to annotate an instance
    of a primitive type with some "units" for this value. This is intended to better
    support the real-world, in which calculations are frequently done with a unit
    either explicitly or implicitly applied to the calculation.


    For example, consider a function in a physics simulation program that calculates
    the trajectory of an shell fired from a gun. The shell will have an initial velocity,
    but this velocity will decrease over time, based on its angle and the path of
    flight.


    Without getting into the mathematics too deeply, different "units" are being expressed
    here, and if the programmer is not careful, mistakes in the code can appear if
    the right values are not converted to the appropriate "units" during calculations.
    This is less trivial than it might seem at first — both space programs (NASA and
    the European Space Agency, to name a few) and financial institutions have suffered
    losses in millions of USD because of failed unit-based calculations.


    *Obviously this is a confusing statement and isn''t necessary for the practicing
    programmer to spend a lot of time worrying about — simply know that void or null
    might have applied in C#, or Nothing in VB, use unit and instead.


    **The full source for this program is found on Chris Smith''s blog, under the
    name "Burning Land."'
