  md: "# Fields and Constructors\n\nFrequently, a derived type introduces not only\
    \ new methods and properties, but also new data elements to be stored within the\
    \ object instance. In F#, because the data elements are often introduced via the\
    \ primary constructor, the syntax for introducing new elements to the derived\
    \ type is remarkably fine, as shown here:\n\n```\n<Class>\ntype Person(fn, ln,\
    \ a) =\n    member p.FirstName = fn\n    member p.LastName = ln\n    member p.Age\
    \ = a\n    member p.Greet(other : Person) =\n        System.Console.WriteLine(\"\
    Howdy, \" + (from (1)!, p.FirstName)\n\n<Class>\ntype Student(fn, ln, a, sub,\
    \ sch) =\n    inherit Person(fn, ln, a)\n    member p.Subject = sub\n    member\
    \ p.School = sch\n```\n\nJust as the primary constructor in the base class introduces\
    \ fields to hold those constructor values throughout the lifetime of the object\
    \ instance, the primary constructor in the derived class also introduces fields.\
    \ However, for those elements that are passed up to the base class constructor\
    \ through the inherit clause, the F# compiler is smart enough not to re-introduce\
    \ the same fields twice; in other words, the preceding example, the F# compiler\
    \ knows that the first three parameters are destined for the base class, and as\
    \ the student type has two fields defined within it, rather than fine.\n\nHowever,\
    \ if the derived type references any of the parameters defined in the constructor,\
    \ the story changes:\n\n```\n<Class>\ntype Student(fn, ln, a, sub, sch) =\n  \
    \  inherit Person(fn, ln, a)\n    member p.FormalName = fn + \" \" + ln + \" \"\
    \ + a\n    member p.Subject = sub\n    member p.School = sch\n```\n\nHere, because\
    \ a data element defined in the primary constructor is directly referenced within\
    \ the definition of the derived class, the F# compiler creates a new field in\
    \ the derived class to hold that data. This means that now the data is being duplicated—once\
    \ in a field in the base part of the object, and once in a field in the derived\
    \ part of the object."
