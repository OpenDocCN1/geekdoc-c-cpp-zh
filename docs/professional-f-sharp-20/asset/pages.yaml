    # APPLYING PIPELINING AND COMPOSITION


    This is done in exactly the same way as with forward composition. The input functions
    on the left and right are partially applied to the operator''s internal function,
    which is then returned. When evaluated, the input into a round hole will be first
    applied to the function taken from the right and then the result of that will
    be applied to the function from the left.


    The most important thing to keep in mind when building data pipelines is the input
    and output types of the functions involved. When data is pipelined into a function,
    data must have the same signature as that function expects. Similarly, when composing
    two functions, the output type of the first must match the input type of the second.


    If you understand C# or VB.NET type system, this should make perfect sense to
    you. You can''t fit a square peg into round hole, as they say. Unlike in .NET
    languages, F# will never automatically convert your data to a different type.
    This applies even to classes written in other languages. Both the upcasting and
    downcasting of class instances must always be explicitly stated. In addition,
    the different numeric types such as int and float must be explicitly converted
    to each other. Keeping this in mind is useful when writing any programs in F#
    particularly important when using composition and pipelining.'
