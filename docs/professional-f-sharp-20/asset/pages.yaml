  md: "# Programmatic Data Binding\n\nTo add a series programmatically at runtime\
    \ to the chart, assign the data (the ObjectCollection) to the LineSeries.ItemSource\
    \ property. The following code defines a helper function to bind the DependentValueBinding\
    \ to the \"Value\" property and the IndependentValueBinding to the \"Index\" property.\
    \ Note that this helper function takes the data as a parameter:\n\n```\nnamespace\
    \ ProSharp.ChartHelper\n\nopen System.Controls.DataVisualization.Charting\nopen\
    \ System.Windows.DataConverter = //for data binding\n\ntype DataConverter =\n\
    \    static member CreateLineSeries data =\n        let series = new LineSeries()\n\
    \        series.ItemSource <- data\n        series.DependentValueBinding <- new\
    \ Binding(\"Value\")\n        series.IndependentValueBinding <- new Binding(\"\
    Index\")n        series.Title <- title\n        series\n```\n\nFollowing is an\
    \ example of adding another event handler and wiring a button to add a second\
    \ line from a static sample series using the helper function previously defined:\n\
    \n```\nbuttonLoadSampleClick.Add(Fun()\n    let data = SampleDataSeries2\n   \
    \ let series = DataConverter.CreateLineSeries \"Series 2\" data\n    chart.Series.Add(series))\n\
    ```\n\nAdding a series to a chart automatically updates the Silverlight display.\
    \ The problem with using this approach to update an existing chart is that it\
    \ requires the series be cleared and a new series created and added to the chart.\
    \ This approach causes the new series to appear in a different color, because\
    \ the chart assumes it is a new series. To modify in a series, use Silverlight\
    \ Toolkit chart animate, the SeriesDataPoint must implement the INotifyPropertyChanged\
    \ interface:\n\n```\nnamespace ProSharp.ChartHelper\n\ntype SeriesDataPoint(index:\
    \ int, value: float) =\n    let mutable v = value\n    let property Index = =\n\
    \        member this.Index\n            with get() = index\n            and set(value)\
    \ = index\n        member this.Value\n            with get() = v\n           \
    \ and set(value) = =\n                v <- value\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_376_0.png)"
