    \ can we do? Customers don't demand the data that is expected.\n\nThe partial-case\
    \ active pattern requires a function for each \"thing\" the XML might be extracted,\
    \ with a wildcard at the end of the name to indicate that this might not always\
    \ succeed, and that the partial-match will be of better benefit. Because the partial-match\
    \ pattern doesn't assume it has all the possible cases the source (the XML node)\
    \ can extract it, it will neatly and efficiently bypass any source that it doesn't\
    \ understand.\n\nTo start, create the partial-match active pattern rules for the\
    \ two types we know about, Person and Ship:\n\n```\nlet {|Person, _ |} (node :\
    \ #System.XmlNode) =\n  if Node Name = \"person\" then\n    let pGender = node.Attributes.ItemOf(\"\
    gender\").Value\n    let pName = node.Item(\"name\").InnerText\n    let pAge =\
    \ node.Item(\"age\").InnerText\n    let pLangNode = node.Item(\"languages\")\n\
    \    let pLangs =\n      seq(1 for l in pLangNode ChildNodes -> l.InnerText)\n\
    \    new Person(pName, pGender, pAge, pLangs)\n  else\n    None\n```\n\n```\n\
    let {|Ship, _} (node : #System.XmlNode) =\n  if Node Name = \"ship\" then\n  \
    \  let sName = node.Item(\"name\").InnerText\n    let sJump = node.Attributes.ItemOf(\"\
    jump\").Value\n    new Ship(sName)\n  else\n    if sJump = \"true\" then true\
    \ else false)\n  None\n```\n\nCode snippet XMLActivePatternDemo.fs\n\nBear in\
    \ mind, again, that the partial-match must yield an Option type, either Some<T>\
    \ or None, from each rule. Other than that, the partial-match rules for extracting\
    \ the data objects of the XML document are remarkably similar to the ones used\
    \ for the multi-case match. This is actually comforting—it means that refactoring\
    \ from one style to the other will be relatively trivial.\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_344_0.png)"
