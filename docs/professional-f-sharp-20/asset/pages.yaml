  md: "# Writing\n\nIn the .NET framework, writing XML uses similar techniques, nearly\
    \ all of which involve having a method that does XML serialization using the XmlWriter\
    \ class. The simplest way to write out an XML file would be to do the following,\
    \ given an XmlDocument named ownDoc:\n\n```\nlet writeToXml(doc:XmlDocument, file:string)\
    \ =\n    use XmlWriter = file | XmlWriter.Create\ndo writeToXml ownDoc(\"output.xml\"\
    );\n```\n\nRunning this will serialize the contents of yourOutput.xml in the current\
    \ directory, overwriting the file if it already exists. One particularly important\
    \ step here is to use the bind with the XmlWriter so that the XmlWriter object\
    \ will be closed when writeToXml completes, thereby flushing the underlying buffer.\n\
    \n> Note that none of these worry about handling exceptions. Because these examples\
    \ have nothing they can do in response to any thrown exception (such as a file\
    \ being locked that we want to write), it is assumed that the exceptions will\
    \ be handled by something further the call stack.\n\n# Writing XML to Memory or\
    \ Other Stream-Based Resources\n\nFrequently, the need arises to serialize to\
    \ something other than a file. The following code will serialize a document to\
    \ a MemoryStream:\n\n```\nlet writeToMemory(doc:XmlDocument) =\n    use stream\
    \ = new MemoryStream()\n    use XmlWriter = stream | XmlWriter.Create\ndo writeToMemory\
    \ doc\n    // do something with the memory stream\n```\n\nIn the preceding case\
    \ where we are writing to memory, we can create a stream (not using binding),\
    \ again create an XmlWriter using the stream, and use the same writeTo method\
    \ with the resulting XmlWriter. The only difference here compared to writing XML\
    \ to a file is that we explicitly create the kind of stream we want to write to.\
    \ Most other types of XML output will work in a similar fashion.\n\n# F# and XML\
