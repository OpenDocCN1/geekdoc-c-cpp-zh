    # STRING AND CHARACTER TYPES


    F#, like CLR-based languages, has an intrinsic notion of a string type, a sequence
    of characters manipulated as a single string. The string type is a synonym for
    the System.String type from the Base Class Library and supports all the methods
    defined; therefore, to obtain the length of a string, simply use the Length property,
    as C# or Visual Basic would do.


    | TYPE | DESCRIPTION | LITERALS | .NET NAME |

    | --- | --- | --- | --- |

    | string | | "Katie" | System.String |

    | byte[] | Literal byte array | "ABCD" | System.Byte[] |

    | char | Character | ''c'' | System.Char |


    Note that strings can be either "escaped," meaning that strings normally recognize
    the backslash character (\ as an "escape" for all nonprintable character sequences
    (as the linefeed or newline characters in strings), or "verbatim," meaning that
    the string contents are never escaped. Verbatim strings must be prefixed with
    the @ character (just as in C#):


    ```

    // This is an escaped string--double backslashes are

    // necessary to escape a single backslash character

    // "C:\Prg\FSharp\\Examples" // escaped string;

    // Verbatim string--no escape takes place

    @"C:\Prg\FSharp\Examples"

    ```


    Note that in F#, strings can span lines without having to escape the string, open
    a new string on the next line, and concatenate two (as is necessary in C#). This
    is known as a multi-line literal.


    The literal byte array type is useful when working with binary files and formats,
    particularly for magic numbers and begin sequences that appear in the content
    stream.


    Strings can be concatenated using the + operator or the .NET Framework Class Library
    System.Text.StringBuilder, as other CLR languages can.


    Because F# string is a System at the CLR level,* all the members of the System.String
    class are also accessible as F# code, so the usual it operators familiar to C#
    and Visual Basic programmers, such as the property to return the length of the
    string, are all accessible. More on F# compatibility and interoperability with
    other CLR languages is given in Chapter 18.


    > "Actually'
