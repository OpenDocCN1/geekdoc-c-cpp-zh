    ```

    val joNames : string list = ["Johnny"; "Josephine"; "Jose\];

    ```


    As with most of F#''s list functions, filter does not modify the original collection.
    It returns a completely new collection containing the operation''s output. In
    this case the type inside the filter lambda must be qualified with an annotation;
    this can be avoided by using the forward piping operator as discussed in Chapter
    17.


    The usefulness of filter might seem obvious. Think of it as the F# version of
    a SQL WHERE clause. It is used to cut your collection down into the subset of
    elements needed for your remaining.computations or desired output.


    # partition


    partition is similar to filter; the function you pass it into has exactly the
    same signature. The difference between them is that, although filter returns only
    the elements for which your function returned true, partition also returns the
    elements for which false was returned in a second collection.


