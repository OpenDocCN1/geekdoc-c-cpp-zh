  md: "# CHAPTER 5 COMPOSITE TYPES\n\n(listed next). This also has other implications;\
    \ for example, calling Add() on the dict-returned object modifies the internal\
    \ collection rather than returning a new one.\n\nFor the most part, prefer to\
