  md: '# Upcasting


    Normally, in an object-oriented language, casting an object to a base type reference
    is not necessary, because the language can do that kind of conversion automatically,
    just as it does with ints to longs, for example. And, normally, in a type-inferred
    language, the compiler can be trusted to infer the right kind of reference when
    an object is created or used.


    Occasionally, it''s necessary to work with a reference of a base type, and because
    F# doesn''t allow any implicit conversion, problems can emerge. simply trying
    to create a reference to a base type and point it to a derived object type will
    fail:


    ```

    // This will NOT compile

    let p = new Student("Ken", "Sipe", 40)

    ```


    Despite Student inherits from Person, F# will not allow this to compile. Technically,
    this is an illegal statement in any language — because Person and Student are
    not the same type, it shouldn''t compile. For the most part, developers have never
    seen this as an error not only because C# and Visual Basic allow an implicit conversion
    — the cast from Student to Person.


    Because F# doesn''t allow any implicit conversion, an upcast is necessary. Doing
    this in F# uses an operator (=>) to convert it to type, like:


    ```

    let p = new Student("Ken", "Sipe", 40) => Person

    ```


    Like all other language bits in F#, use the => is an expression — it returns a
    reference of the type described on the right side. The left operand is the object
    or reference upon which to perform the cast, and the right operand is the type
    to cast to. The correctness of this cast is checked at compile-time, because the
    compiler should have all the information by which to ensure whether this is a
    legal operation, or this cast will either succeed or fail.


    Although not commonly used, the => operator can be replaced by upcast, whose syntax
    looks somewhat similar to that of the operator:


    ```

    let p2 : Person = upcast new Student("Ken", "Sipe", 40)

    ```


    In this case, the type to which the reference is being converted from the left
    side of the expression, making upcast slightly more terse than the operator equivalent.
    However, in practice, => shows up more often in F# code, the type often cannot
    be inferred correctly when using upcast.


    # Downcasting


    The opposite of upcast, is the familiar downcast, (loved and hated) by millions
    of developers, where the language attempts to take an object of a derived type
    being referenced by a base type and produce a reference to the derived type. In
    F#, this is done again with an operator, :?:


    ```

    let p : Person = new Student("Ken", "Sipe", 40) => Person

    let s : Student = p :? Student

    ```'
