  md: '# NUMERIC TYPES


    F# supports a range of numeric types, 8 bits in size to 64, in both signed and
    unsigned versions, as shown here:


    | TYPE | DESCRIPTION | .NAME | LITERALS |

    | --- | --- | --- | --- |

    | Byte | 8-bit unsigned integer | System.Byte | 3y, 0xFuy |

    | Sbyte | 8-bit signed integer | System.SByte | 3y, 0xFPy |

    | int16 | 16-bit signed integer | System.Int16 | 3s, 0xFs |

    | uint16 | 16-bit unsigned integer | System.UInt16 | 3us, 0xFus |

    | int, int32 | 32-bit signed integer | System.Int32 | 3, 0xF |

    | uint32 | 32-bit unsigned integer | System.UInt32 | 3u, 0xFu |

    | int64 | 64-bit signed integer | System.Int64 | 3L, 0FXL |

    | uint64 | 64-bit unsigned integer | System.UInt64 | 3UL, 0FXUL |

    | nativeint | | System.IntPtr | 3n, 0xB8000n |

    | unint | Machine-sized unsigned integer | System.UIntPtr | 0xB8000n |

    | bigint | Arbitrarily large integer | System.Numerics.BigInteger | 3I |


    Each of these types can be initialized to decimal, hexadecimal, octal, or binary
    constants. Decimal constants are represented simply with the numeric value itself,
    whereas with a flag indicating whether it should be hexadecimal (0x), octal (0o),
    or binary (0b or OB). This means that the following literals, 0xF, 0x0F, 15 are
    all the same value (15)


    For each of these, with the exception of the bigint type, the traditional algebraic
    operations are supported, providing unchecked (that is, wrapped if the value exceeds
    the representation size) operations for addition, subtraction, multiplication,
    division, and modulo. Operations that should throw an exception if they overflow
    (of type `OverflowException`) are defined in the Microsoft.FSharp.Core.Operators
    module; opening modules and using operations defined there is discussed in more
    detail in Chapter 11. Any sort of division by zero raises a `DivideByZeroException`.


    Because of the dangers of overflow, even with the largest-precision types, the
    bigint type is the preferred type for handling exceptionally large values, such
    as the total of the U.S. budget or the royalty checks for programming book authors.
    (Technically, the bigint type isn''t a primitive type, according to the language
    specification, given its syntax and role, it''s helpful to think of it as for
    all practical purposes.)'
