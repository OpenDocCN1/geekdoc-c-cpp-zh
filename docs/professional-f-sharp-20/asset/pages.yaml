  md: "# Writing\n\nWriting XML out to a file, or a stream, using XML DOM is as simple,\
    \ if not simpler, than LINQ-\nto-XML. To save a file, it is as simple as calling\
    \ the Save method, passing it a filename or a fully\nqualified path:\n\n```\n\
    weatherDom.Save(\"yourOutput.xml\")\n```\n\nShould you want to save to a stream,\
    \ be it a MemoryStream or any other object that inherits from\nStream, pass the\
    \ Stream object as well:\n\n```\nweatherDom.Save\n```\n\nIt is notable that writing\
    \ XML largely builds on .NET IO capabilities, nicely making sure\nt XML processing\
    \ concerns are separated from concerns related to how such XML is persisted.\n\
    This general feature make sure any code you write with XML is very much\nfocused\
    \ on XML processing and not IO concerns.\n\n# F#, XML, AND ACTIVE PATTERNS\n\n\
    If we remove the fascination with angle-brackets and structure and look carefully\
    \ at an XML docu-\\ment, a curious things emerges: XML looks very much like name-value\
    \ pairs, name-value-attribute triplets (where attributes are a list of name-value\
    \ pairs themselves), name-value-children trip-\\lets (where children are another\
    \ list), or name-value-children quads. In other words,\nfrom a point of view,\
    \ XML documents are basically lists of tuples, nested in a hierarchical\nrelationship.\n\
    \nGiven this perspective, and the fact that active patterns (described in detail\
    \ in Chapter 6) are used\nin F# to do \"data decomposition\", it seems reasonable\
    \ to expect that active patterns can help break\nXML trees down into more palatable\
    \ data structures that F# can process more easily. And as it\nt out, it requires\
    \ a significantly different approach to querying and processing what the\nimperative\
    \ programmer is used to.\n\nLet's work with a slightly different model, one that's\
    \ a bit simpler than the XML returned by\nthe weather service (arguably, more\
    \ like the XML that flies around inside a corporate intranet),\nthat describes\
    \ various (and infamous) fashions:\n\n```\n<data>\n  <person gender=\"male\">\n\
    \    <name>Ted Ward</name>\n    <languages>\n      <language>English</language>\n\
    \      <language>French</language>\n      <language>C#</language>\n      <language>Java</language>\n\
    \      <language>F#</language>\n      <language>Scala</language>\n    </languages>\n\
    \  </person>\n</data>\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_336_0.png)"
