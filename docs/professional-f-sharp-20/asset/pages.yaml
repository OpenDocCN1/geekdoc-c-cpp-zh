  md: "# 378 | CHAPTER 21 | SERVICES\n\nAn important aspect of many services is that,\
    \ all things being equal, stateless services are preferred overful ones. As has\
    \ been emphasized many times in this book, F# is a great fit for applications\
    \ that do not require state. In the world of services, there is almost never a\
    \ need for state. Even in the case of stateful services, state is usually persisted\
    \ in either an application database, or some sort of state store, so that a different\
    \ server can pick up the count and continue work. This makes F# programs particularly\
    \ well oriented toward service-oriented applications, as was pointed out in Chapter\
    \ 21, where a comparison is made between services that serve HTML over HTTP, and\
    \ services that serve other stuff (be it is XML, JSON, or something else) on some\
    \ protocol focus over service application boundaries.\n\nThis chapter focuses\
    \ on implementation of services in F#. Particular attention is paid toward using\
    \ F# to define services in WCF, implementing contracts, and fulfilling contracts\
    \ through an F#-based domain model. It goes into how to configure and host services.\
    \ Finally, it presents an example of F#-based service consumption.\n\n# AN F#-BASED\
    \ WEATHER SERVICE\n\nHaving a basic service that provides a forecast may be of\
    \ utility, it would not be inconvenient that there would be other uses of weather\
    \ data in other systems. Say, for example, there is a need for a service that\
    \ alerts farmers in Florida about the weather to protect their citrus crop. Such\
    \ a system may call out to a weather service that alerts the expected temperature\
    \ over a short-term period, so that the crops can be protected with reasonable\
    \ lead time.\n\n# The Service Contract\n\nJust like it is good practice to use\
    \ tests to make sure development \"begins with the end in mind\" (apologies to\
    \ Stephen Coney), it also makes sense to do so when writing services. In other\
    \ words, it is helpful to ask the question, before writing implementation code,\
    \ what is it that this service should do?\n\nTo start, with an assumption that\
    \ the service should provide the user with information about a weather forecast,\
    \ including such items as expected temperature, recommended attire, and weather.\
    \ To consider the general shape of what is required, the next step is to start\
    \ writing a data contract to define the shape of:\n\n```\nnamespace ProSharp.Services\n\
    open System\nopen System.ServiceModel\nopen System.Runtime.Serialization\n\n[DataContract]\n\
    ype Forecast(\n    let mutable _city : string = String.Empty\n    let mutable\
    \ _averageExpectedTemperature : double = 0.0\n    let mutable _recommendedAttire\
    \ : string = String.Empty\n    let mutable _weather : string = String.Empty\n\
    \    [DataMember]\n    public f.City\n    with get() = _city and set(v) = _city\
    \ <- v)\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_383_0.png)"
