    # Passing Functions to F# Functions


    As understood from previous chapters where function composition is discussed,
    it is common for F# programs to accept functions as parameters. Consider the following
    F# member:


    ```

    member this.MemberThatTakesFunction a func =

    func a b

    ```


    This member is a simplistic member that applies a function as a and b. Simple
    enough in F#, but this kind of thing becomes painful to use from C#:


    ```

    //calling a member that takes a function as parameter

    var uglyFunc = FuncConv.ToSharpFunc<int, int, int>(FSharpFunc<int, int, int> a
    => FuncConv.ToInt((a, b) => a + b));nvar operationResult = someSharpObject.MemberThatTakesFunction(2,
    2, uglyFunc);

    ```


    In the preceding example, we would disagree that the uglyFunc is misnamed. Not
    only does it require a reference to FSharp to make the code readable at all (almost
    always a bad sign), but it also forces construction of function in an unintuitive
    manner. Although it does reveal how the F composes functions, there is no simple
    mapping to a more intuitive Func<...>... without writing a lot of idiomatic and
    confusing C# code in the process.


    A better way to pass functions to F# code is to use the Func<> or Action<> types,
    as appropriate:


    ```

    member this.BetterForFSharpInterop(a, b, func:Func<int, int, int>) =

    func.Invoke(a, b);

    ```


    which can be called from C# and other .NET languages more idiomatically:


    ```

    var betterResult =

    someSharpObject.IsBetterForFSharpInterop(2, 2, (a, b) => a + b);

    ```


    As a general rule, you should use natural F# functions when operating with other
    F# code, but when designing an API that will likely be called from other CLR languages,
    use Func<> or Action<> with outside APIs.


