    # SUMMARY


    This chapter began with a litany of the flaws of the object-oriented mindset and
    detailed what a new language might look like — one in which functions and methods
    were given first-class citizen status, the compiler could infer static type information
    from more of the language constructs, variable and field immutability serves as
    the default, and expressions formed the core of the language instead of imperative
    statements.


