  md: "# 156 | CHAPTER 8 CLASSES\n\nF# permits access modifiers on a variety of different\
    \ parts of the type, including methods, properties (both get and set clauses,\
    \ which may not be set at the same level of accessibility), constructors (except\
    \ the primary constructor), or fields. F# requires that let bindings inside the\
    \ class must always be internal, so no access modifier is ever allowed on these.\n\
    \nThere are a few syntactic restrictions in certain places. In the case of constructors,\
    \ the access modifier appears before the new keyword. When in use of a val-declared\
    \ field, the access modifier must appear after the \"mutable\" keyword (if present).\n\
    \nF# also permits types to be decorated with access modifiers, in much the same\
    \ way that individual members of a type can be decorated. In the case of a type,\
    \ the access modifier appears after the type before its name:\n\n```\n<Class=\n\
    type Internal Sport (name)\n  member p.Rules\n  with get () = =\n```\n\nIn the\
    \ case of a \"private\" type, the type will not be visible outside of the file\
    \ in which it is declared; the reason for this will be made clearer in Chapter\
    \ 11 when we talk about modules and namespaces. In addition, the primary constructor\
    \ of a type will be granted the same visibility as that of the type itself, it's\
    \ exceedingly rare that one would want a primary constructor's accessibility to\
    \ be different than the type's.\n\nThe default accessibility of declared elements\
    \ in an F# class is as follows:\n\n```\n<Class=\ntype (*) ExampleClass(field1\
    \ : string) =\n [-DefaultValue-]\nval mutable (* private *) valField : string\n\
    \n// Always private\nlet mutable mutField2 = \"Changeable\"\nlet helper = field1\
    \ + \", \"helper\"\n\n(* public *)\nnew ()\n  ExampleClass(**)\n\nmember (* public\
    \ *) e.Property\n  with (* public *) get () = field1\nmember (* public *) e.ReadOnly\n\
    \  with (* public *) get () = mutField2\n  and (* public *) set(value) = mutField2\
    \ - value\n```\n\nCode snippet Class.fs\n\nIn general, as mentioned, given that\
    \ member-declared elements are marked public by default and let bindings as internal,\
    \ assemblies by default, most F# developers find that will not be reaching for\
    \ access modifiers often often as C# or Visual Basic brethren.\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_174_0.png)"
