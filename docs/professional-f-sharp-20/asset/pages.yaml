    ```


    +   Documentation comments using the // delimiter, which signals a special form
    of comment (similar to the C# comment of the same form) that can be used to extract
    documentation for the element that follows.


    Of the three, the multi-line comment form isn''t seen much in general F# usage,
    and for the most part is present solely to support F# cross-compiling OCaml.


    The documentation comment supports if, not all, of the same kinds of documentation
    "hints" that the C# documentation syntax supports, such as:


    ```

    /// <summary>This is a cool function</summary>

    /// <remarks>Use it wisely</remarks>

    ```


    Note that if developers stick primarily to the single-line and documentation comment
    forms for usage, switches of code can be temporarily removed from use via the
    multi-line comment form, which can be particularly useful given the nesting of
    multi-line comments.


    # IDENTIFIERS


    Identifiers in F# generally follow the same rules as C# or C++, in any combination
    of Unicode characters defined as letters (uppercase or lowercase), digits, and
    the underscore are allowed, provided that the first character is a letter. For
    the C# developer, this is identical to how C# operates.


    Like most, F# reserves certain combinations for its own use, typically as keywords
    in the language. F# defines these as unacceptable identifiers, either they are
    keywords, or because the F team want to reserve them for future use (meaning they
    might become backwards in a future release of the F# language);


    ```

    abstract and as assert atomic begin checked class component

    constraint constructor from default do not download

    downouter eager ele elif end event extern extern false finally

    fixed for fun function global if in inherit unless

    interface land lay let lsr is lsr lxor method mixin

    module mutable namespace open or override parallel

    private process protected public pure rec sealed sig static

    tailcall them to trait true try upcast use val virtual void volatile

    when with yield

    ```


    Not all these identifiers are currently used, and some may never be used, depending
    on future directions the language takes. Even should the language permit using
    them, none of the preceding words should ever be used as an identifier, for developer
    sanity if nothing else.'
