  md: "To avoid this, the derived class can use the property defined on the base class:\n\
    \n```\n<Class++>\ntype Student(fn, ln, a, sub, sch) =\n    Inherit(Person(fn,\
    \ ln, a))\n    member s.FormalName = s.FirstName + \" * \" + \" of sch\n    member\
    \ s.Subject = sub\n    member s.School = sch\n```\n\nThis will also have a nice\
    \ relationship in .NET, the derived class must invoke a base class constructor,\
    \ or the property-get clause is being invoked, such as any calculation, lazy-resolution,\
    \ or caching behavior.\n\nAs with any inheritance relationship, ensuring that\
    \ any base class constructor by any such constructor is fair\n\n```\n<Class++>\n\
    type Person(fn, ln, a) =\n    new(Person(\"\", \"\", 0))\n    member p.FirstName\
    \ = fn\n    member p.LastName = ln\n    member p.Age = a\n    member p.Greet(other\
    \ : Person) =\n        System.Console.WriteLine(\"Howdy, {0}, from {1}!\",\n \
    \       other.FirstName, p.FirstName)\n```\n\nCode snippet Inheritance.fs\n\n\
    And of course, the derived type is free to define its own constructors beyond\
    \ the primary constructor, delegating to the constructor of the derived type which\
    \ then defers to the base type, and so on up the inheritance chain:\n\n```\n<Class++>\n\
    type Student(fn, ln, a, sub, sch) =\n    Inherit Person()\n    new(Student(fn,\
    \ ln, a, sub, sch))\n    member s.FormalName = s.FirstName + \" * \" + \" of sch\n\
    \    member s.Subject = sub\n    member s.School = sch\n```\n\nIf the derived\
    \ type wants any private let-bindings or expressions, they appear after the inherit\
    \ clause before any member declarations:\n\nCode snippet Inheritance.fs\n\n```\n\
    <Class++>\ntype Student(fn, ln, a, sub, sch) =\n    Inherit Person()\n    - --\
    \ -- ()\n```"
