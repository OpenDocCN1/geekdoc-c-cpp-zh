    http://where.yahooapis.com/places.q('New Jersey')?appid=YourAppID\n```\n\nIn this\
    \ example, replace YourAppID with your ID provided by the Yahoo Geoplanet service.\n\
    When returned is XML that has a lot of information about New Jersey. The requirement,\
    \ however, is to ignore most of this information and return a set of integers\
    \ to the \"Where On Earth ID\"s. The file contains a set of elements with the\
    \ local name weird, each of which contains the integer of interest. After filtering\
    \ by the LocalName, and then parsing into Int32, a sequence of \"Where On Earth\
    \ ID\"s related to the location is returned.\n\n# From \"Where On Earth ID\"s\
    \ to Weather Content\n\nThe next four lines of code filter the specific document\
