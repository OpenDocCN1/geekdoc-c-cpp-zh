    \ the type annotation is necessary in the declaration of this statement.\n\nIt's\
    \ also important to note that no new functionality has been introduced to the\
    \ system, only a new name for types that are already present. The type is \"erased\"\
    \ during compilation, so any attempt to find the type abbreviation at runtime\
    \ (via Reflection) will fail. The type abbreviation simply adds a degree of readability\
    \ to the source code.\n\nType abbreviations can also work on other types than\
    \ tuples; if, for example, experience yields a better name for unassigned 32-bit\
    \ integers, they can be named as such:\n\n```\ntype u32 = System.UInt32\n```\n\
    \nHowever, blatantly renaming existing types should be done with care — mindlessly\
    \ renaming can render code less readable, rather than the opposite.\n\n# ENUM\
    \ TYPES\n\nTo create the C# or Visual Basic equivalent of the enumerated type,\
    \ F# uses some different syntax than what this code introduces a new type into\
    \ the program, the keyword is used, and the various possibilities of the enumerated\
    \ type are then listed in a format reminiscent of the pattern-match syntax (exposed\
    \ in Chapter 6):\n\n```\ntype Soda =\n    | Coke = 1\n    | DietCoke = 2\n   \
    \ | SevenUp = 3\n```\n\nUnlike the C# or Visual Basic equivalent to create an\
