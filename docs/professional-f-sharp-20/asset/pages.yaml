    \ It ends working up quite a lot like dominos. When one is correctly identified,\
    \ many others fall into place as well. Once the types around it are resolved,\
    \ incorrect code will stand out like a sore thumb.\n\n# Generics and Type Constraints\n\
    \n#'s type system isn't limited to basic types. It supports the full range of\
    \ generics and type constraints as other .NET languages. In fact, its type system\
    \ can infer most of these automatically.\n\nFor example if you were to write a\
    \ function that compares two arguments with the equals operator, the arguments\
    \ automatically generalize to a generic type with the equality comparison constraint.\n\
    \n+   > letEqual arg1 arg2 =\n  arg1 = arg2;\n\nval isEqual : 'a' -> 'a' bool\
    \ when 'a : equality\n\nHowever, it is also possible to explicitly annotate these\
    \ constraints when making type annotations. This can be done through another application\
    \ of the keyword.\n\n+   > letEqual<'a' when 'a : equality> (arg1: 'a) (arg2:\
    \ 'a')nn  arg1 =2;\n\nval isEqual : 'a' -> 'a' bool when 'a : equality\n\nIn some\
    \ cases you may want to have multiple constraints on a type. To do this, separate\
    \ each constraint with the and keyword.\n\n+   > isHull<'a' when 'a : equality\
    \ and 'a : null> (arg: 'a)\n  arg = null;\n\nval isHull : 'a' -> bool when 'a\
    \ : equality and 'a : null\n\nA list of commonly used generic type constraints.\n\
    \n| CONSTRAINT | EXAMPLE |\n|---|-|\n| Type (Parent) | <'a when 'a : Object> |\n\
    | Nullable | <'a when 'a : null> |\n| New() | <'a when 'a : ( new: unit - 'a )\
    \ |\n| Value Type | <'a when 'a : struct> |\n| Reference Type | <'a when 'a :\
    \ not struct> |\n| Comparison | <'a when 'a : comparison> |\n| Equality | <'a\
    \ when 'a : equality> |"
