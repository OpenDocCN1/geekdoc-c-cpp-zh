  md: "However, each function call takes additional stack memory, and the stack is\
    \ only a finite size. If n is too large, eventually your program will run out\
    \ of stack memory and throw a StackOverflowException.\n\n```\n> pow 2.0 100000;\n\
    > Process is terminated due to StackOverflowException.\n```\n\nThis, combined\
    \ with the overhead of each additional function call, makes for a convincing argument\
    \ against recursion in .NET languages. F# supports two features that are very\
    \ good at recursion. First, F# has been heavily optimized to allow for deep recursion.\n\
    \n```\n> pow 2.0 100000;\nval it : float = 1.07150867e+31\n```\n\nSecond, it has\
    \ a feature tail call optimization that allows the compiler to turn some recursive\
    \ calls into fast loops under the hood. The caveat to this is that it only applies\
    \ to recursive functions whose final call leaves no work to be done. If after\
    \ calling the function you have to do anything other than return, it can't be\
    \ optimized. This might sound like it makes tail recursion all but useless, but\
    \ as you'll see here and in following chapters, it is profoundly important for\
    \ speed and safety.\n\nTo make the above tail recursion, you need to define the\
    \ same problem in a way that does not cause any work after the recursive call\
    \ is made. This is most easily done by introducing a new argument to hold whatever\
    \ you were relying on the the stack to hold previously. A function argument used\
    \ to pass itself data while performing recursion is called an accumulator.\n\n\
    ```\nlet rec tailpow x n r = if n < 0\n    then tailpow (r * x) (n - 1) r\n  \
    \  else r\n```\n\nIn this example r acts as the accumulator. It holds the result\
    \ of the previous computation. Instead of performing computation lazily as the\
    \ recursive calls return, they are performed at each step and the result is passed\
    \ into r. Finally, when n is equal to zero, the result is returned.\n\nIt might\
    \ seem as though the additional parameter is a big problem. However, it's a simple\
    \ matter to embed this function inside another and hide the accumulator.\n\n```\n\
    let pow n =\n    let tailpow (x:float) r = if n < 0\n        then tailpow x (n\
    \ - 1) (r * x)\n        else r\ntailpow x 1.0\n```\n\nIn fact, using techniques\
    \ mentioned in the \"Creating Functions at Runtime\" section make this easier\
    \ and opens up even more possibilities for recursion.\n\n# Higher Order Functions\n\
    \nHigher order functions are functions that use one particular property of first\
    \ class class. They are, they take and/return other functions. For example, take\
    \ a look at a simple function that takes another function of no arguments."
