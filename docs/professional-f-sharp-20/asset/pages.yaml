  md: "# F#, XML, and Active Patterns | 335\n\nThe pattern-match rule has to change\
    \ slightly; if the Ship clause is simply inserted into the pattern-match, the\
    \ compiler complains:\n\n```\nlet extract node =\n    let rec extract node =\n\
    \    match node with\n    | Person (p) ->\n        Seq.seointlet p\n    | Ship\
    \ (s) ->\n        Seq.seointlet s\n    | Node (nodes) ->\n        Seq.collect\
    \ (fun n) -> extract n\n    node\nlet results = extract xmlDoc\nfor r in results\
    \ do\n    Console.WriteLine(\"Result: %0\", r)\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_342_0.png)\n\
    \nCode snippet XMLActivePatternDemo.fs\n\nspecifically, that the Ship clause doesn't\
    \ return a Person object. This is because the type-inferencer in F# has assumed\
    \ that the extract function will take in an XmlNode and return a sequence of Person\
    \ objects, which obviously the Ship object isn't. If Ship inherits from Person,\
    \ then obviously the compiler will be OK with this, but as written right now,\
    \ Ship doesn't.\n\nFortunately, Ship and Person do inherit from a common base\
    \ class, System.Object, so it's a matter of telling the F# compiler, this casting\
    \ from the domain object to System Object during the pattern-match, and asking\
    \ the compiler to see the result as a sequence of Object rather than a sequence\
    \ of Person:\n\n```\nlet extract node : seqobj = =\n    let rec extract node :\
    \ seqobj =\n    match node with\n    | Ship (s) ->\n        Seq.seointlet (s =>\
    \ obj)\n    | Person (p) ->\n        Seq.seointlet (p => obj)\n    | Node (nodes)\
    \ ->\n        Seq.collect (fun n) -> extract n\n    node\nlet results = extract\
    \ xmlDoc\nfor r in results do\n    Console.WriteLine(\"Result: %0\", r)\n```\n\
    \n![](img/3b6b83f504d0e46470b40dafe9ce1960_342_1.png)\n\nCode snippet XMLActivePatternDemo.fs\n\
    \nAnd now, any number of domain types can be added to the pattern rule and returned\
    \ from the extract function.\n\nUnfortunately, the drawback of the multi-solution\
    \ comes when the upstream source of the XML document throws something \"new\"\
    \ into the XML stream. Not that clients would ever do to that, of course, but\
    \ a more robust solution would allow for a certain amount of foriveness."
