  md: '# Software Runtime and Developer Requirements


    As mentioned earlier, Silverlight is a web browser plug-in environment for executing
    .NET code. It uses a special CLR that is portable on both Windows and Macintosh
    computers. Also, through the Mono project called Moonlight, Silverlight is also
    unavailable on Linux. Officially, Silverlight 3 and 4 are supported on Windows
    XP through Windows 7 in IE 7, IE 8, and Google Chrome. For the Mac, Silverlight
    3 is supported in Safari on Intel hardware. The following table shows official
    support for Silverlight versions:


    | IE 6 SP2 | IE 7 & 8 | Firefox 3 | Safari | Google Chrome |

    |---|---|---|---|--|

    | Windows Vista/7 | Silverlight 1, 2, and 4 | | | Silverlight 1 and 2 | Silverlight
    2, 3, and 4 |

    | Windows XP/2003 | Silverlight 1, 2, 3, and 4 | Silverlight 1, 2, 3, and 4 |
    Silverlight 1 and 2 | Silverlight 2, 3, and 4 |

