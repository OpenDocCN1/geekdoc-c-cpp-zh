  md: "# Statically Resolved Type Parameters\n\nAs mentioned in the previous section\
    \ on the inline keyword, F# also supports a much richer set of compile-time-only\
    \ type constraints. To use them you must trade in generic type parameters for\
    \ something called statically resolved type parameters. Parameters defined in\
    \ this way are only available to F# functions marked as inline.\n\nOne particularly\
    \ useful example is the member restriction type constraint. This constraint allows\
    \ you to generalize a type on methods, properties, and events.\n\n```\ntype PresentFromGods(isGood)\
    \ =\n  member x.IsGood : bool = 'a' : (member IsGood : bool) (container: a) =\n\
    \  let isGood = 'a' : (member IsGood : bool) container\n  isGood = true\n```\n\
    \nIn this example IsGood function may take any object that has a IsGood property\
    \ that returns a bool. When passed an argument of type defined by the member restriction\
    \ statically type parameter, some syntax syntax must be used to extract the value\
    \ of that member. Here the value of the container's member is extracted into the\
    \ isGood variable and returned.\n\n```\n> IsGood (PresentFromGods(true));\nval\
    \ it = true\n```\n\nAt compile time inline will be generated in place of the function\
    \ call. This allows for shared code that is fast and has literal constraints.\n\
    \nHowever, as you can see from this example, statically resolved type parameters\
    \ have syntax that is quite esoteric. In most cases it's best to stick with a\
    \ combination of inline inference and CLR supported type constraints. This way,\
    \ you can be sure that they will hold at runtime and your functions will be available\
    \ when calling F# assemblies from other languages.\n\n# PARTIAL APPLICATION\n\n\
    In this example one of add's arguments is passed in. When the value 1 is applied,\
    \ the x argument is fixed to 1. The result of this is a new function which adds\
    \ one to integer passed.\n\nPartial application is the passing of only some arguments\
    \ to a function. This allows the arguments to be stored within the function and\
    \ passed later implicitly. The remaining arguments can be applied when they are\
    \ available or when you want the function to be executed.\n\n```\n> let add x\
    \ y = x + y\nlet errno = add 1;\n\nval add : int -> int -> int\nval errno : (int\
    \ -> int) int\n\n> errno 5;\nval it : int = 6\n```"
