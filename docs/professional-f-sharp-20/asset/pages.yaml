  md: 'combining F# and Silverlight, this chapter demonstrates how to manipulate the
    chart by running the data through a moving average algorithm implemented in an
    F# function in just three lines of code. Moving average is often used in financial
    applications to visualize trends when the data series is volatile and erratic.
    F# provides not only a great way to express and manipulate data but also to analyze
    data. Combined with Silverlight, F# can be a powerful tool for manipulating and
    visualizing data.


    # # The Silverlight Application


    A Silverlight application is a special Visual Studio project template that compiles
    and builds into a package designed to run in the browser in the Silverlight runtime.
    The project includes XAML (XML for describing the UI), .NET assemblies and other
    resources such as images that are packaged into a XAP file to be deployed to a
    web server. The XAP file is downloaded by a browser using HTML tags referencing
    the XAP on the web server. When the XAP file has been loaded by the browser, it
    executes the XAP in a special .NET CLR designed for portable operating systems
    like Macintosh and Linux. This model is similar to other browser-plugins such
    as the JVM (Java Virtual Machine) and Adobe Flash.


    > > One advantage for F# programmers that Silverlight has over Flash is it allows
    an F# developer to use a single language for both browser client logic and server
    side logic. This reduces the need for JavaScript, AJAX, and client-side scripting
    languages and frameworks. It also allows for better usage of client-side resources
    such as Memory and CPU.


    # # Creating the Silverlight Application


    For both C and VB there are three Visual Studio project templates in the Silverlight
    category:


    +   * Silverlight Application

    * Silverlight Class Library

    * Silverlight Navigation Application


    The first template is the simplest template to get a full Silverlight application
    on the page. It includes XAML files (for the application in general and one for
    the.) The second template, the C#/VB Silverlight Class Library, is equivalent
    to the F# Silverlight library. The third template is used for applications that
    require multiple screens by providing a navigation framework using the Visual
    State Manager from the namespace in Silverlight 3 and .NET 4. The navigation application
    is useful when building multiple page navigation without the overhead of browser
    post backs and full-page reloads.


    The Silverlight Application Template Wizard prompts for the version of Silverlight.
    Visual Studio 2010 includes only Silverlight 3.4 Tools for Visual Studio 2010
    is required for Silverlight 4 development. With Visual Studio 2008, the Visual
    Studio Tools can be installed to support Silverlight 3 (not 4). The examples in
    this book use Silverlight 3 but will work with Silverlight 4 without any changes.
    The'
