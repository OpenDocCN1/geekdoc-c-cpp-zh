  md: "# CHAPTER 21 ASP.NET MVC\n\n| Coat |\n| Raincoat |\n| Parka |\n| BodyArmor\
    \ |\n\nThe definition for Attire is a discriminated union, much like the definition\
    \ for SkyType. Given the above attire, it would be useful to add behavior to specify\
