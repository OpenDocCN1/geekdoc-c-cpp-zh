    Note that "attach" the attribute to something not at a type or function level


    These attributes (AssemblyVersion, AssemblyDescription, AssemblyTitle, AssemblyCopyright,
    AssemblyTrademark, AssemblyCompany, AssemblyKeyFile, and so on) are described
    in more detail in the MSDN documentation in the System.Reflection namespace —
    aside from the F# syntax, they are exactly identical in C# or Visual Basic.


    # DefaultMember


    This attribute, used on a type, indicates the default member of that type, which
    is often used in .NET languages as a shorthand way of accessing an indexer property.


    # Serializable,NonSerialized


    The Serializable attribute used to mark a type as being eligible for serialization,
    a process by which an object can be reduced to a stream of bytes, then brought
    back into existence from that stream of bytes, contains the same field data as
    it contained at the time of serialization. NonSerialized attribute is used to
    mark a field as being exempt from this serialization process in a Serializable-marked
    type.


    For details on Serializable and NonSerialized, the MSDN documentation and the
    namespace System.Runtime.Serialization.


    # AutoOpen


    This is F#-only attribute at the assembly level. When used, it takes a string
    as a parameter, indicating a namespace or module name. When this assembly is referenced,
    the namespace or module specified in this attribute is automatically opened, as
    if the F# programmer had typed <namespace> in the script or source file referencing
    the assembly.


    It has no meaning outside of F#.


    # Other Attributes


    The .NET BCL is chock-full of other attributes used in a variety of tech-specific
    settings, such as the custom attributes used in Windows Communication Foundation
    (WCF) code to indicate communication bindings for services and clients. Use of
    these attributes follows the same patterns as the previous attributes, and deeper
    coverage of those attributes accompanies the appropriate text in Part IV, "Applications."'
