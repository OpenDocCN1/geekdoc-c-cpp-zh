  md: "Although certainly an acceptable style of programming, using enumerated types\
    \ in F# pale in comparison to discriminated union types, and as a result, enumerated\
    \ types are usually related to those situations where F# needs to interoperate\
    \ against the remainder of the .NET framework.\n\nIn general, F# developers will\
    \ not write many of these 'old-school' enumerated types except for scenarios where\
    \ the F# code needs to be easily accessible from other .NET languages; for most\
    \ purposes, the discriminated union, is vastly powerful and flexible.\n\n# DISCRIMINATED\
    \ UNION TYPES\n\nDiscriminated unions are a particular kind of type whose possible\
    \ values are limited to a bound set of possible values, similar to an enumerated\
    \ type in C# or Visual Basic, but with greatly enhanced functionality. Unlike\
    \ an enumerated type in C# or Visual Basic, a discriminated union can define only\
    \ a bound set of values, but set of types, as acceptable values.\n\nConsider,\
    \ for the notion of \"color.\" Color values can be seen in a variety of different\
    \ formats: red/green/blue (RGB) tuples, cyan/yellow/magenta/black (CMYK) quadruplets,\
    \ of sixteen possible basic positions (red, blue, dark blue, and so, and on. Trying\
    \ to capture all these different positions is difficult because each of the different\
    \ kinds of representations must be modeled as a separate class, all inheriting\
    \ from a base Color class whose only purpose is to act as a placeholder for the\
    \ various derived types.\n\nIn F#, however such type naturally fits within the\
    \ discriminated union's capabilities. To begin with, it is fairly easy to capture\
    \ the ideal of a Color being one of several predefined values:\n\n```\ntype Color\
    \ =\n    Black\n    Blue\n    Cyan\n    Gray\n    Green\n    Magenta\n    DarkBlue\n\
    \    Red\n    White\n    Yellow\n```\n\nAnd as might expect it's relatively easy\
    \ to use, particularly because the F# type inferencer can be a bit more about\
    \ how discriminated union values are used, compared to enumerated types:\n\n```\n\
    let c = =\nSystem.Console.WriteLine(c)\n```\n\nUnfortunately, this produces rather\
    \ disappointing output (CompositeComplexTypes+Color, assuming this code is compiled\
    \ from \"CompositeComplexTypes.fs\" and not run from the interactive F# REPL),\
