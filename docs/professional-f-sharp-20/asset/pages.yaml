  md: "# Creating the Controller\n\nWhen a domain is set up and a repository has been\
    \ written that is capable of populating a domain, the next step is to implement\
    \ a means to connect the domain to something more interesting. In the ASP.NET\
    \ MVC framework that takes the form of a controller. The controller is, to put\
    \ it simply, a means for a domain to be exposed to the outside world, typically\
    \ with a View somewhere.\n\nA good way to think about a controller is to think\
    \ about how a user might interact, logically, with the application. A simple site\
    \ for viewing a forecast will definitely need an Index page, which likely has\
    \ instructions on it, and perhaps a box where someone can enter a query. Certainly\
    \ something will be needed to handle the query. It would probably also be a wise\
    \ idea to have a page that shows a result somewhere — one that is preferable from\
    \ the aforementioned query.\n\n# Setting Up the Controller\n\nStart a controller\
    \ by adding a file, named controllers.cs, and adding the following code:\n\n```\n\
    namespace FSharpBook.Controllers\nopen System.Web.Mvc\nopen FSharpBook.Models\n\
