    # # MAPS\n\nMaps, or dictionaries as .NET FCL tends to call them, are collections\
    \ of object-to-object pairings, often used as name-value key-value pairs, where\
    \ the key is typically a string and the value is any particular type. Although\
    \ not officially supported as an F# language construct, maps are commonly used\
    \ that we can think of them as such, and have a number of interesting library\
    \ supporting functions that make them trivial to use.\n\n# # Map Construction\n\
    \nCreating a new map is relatively easy. If we visualize a map as a list of pairs,\
    \ then the Map.ofList makes it easy to transform a list of two-element tuples\
    \ into a Map:\n\n```\nlet nicknames = Map.ofList [\n    \"Ted\", new Person(\"\
    Ted\", \"Ward\", 38);\n    \"ieie\", new Person(\"Eie\", \"Ellison\", 30);\n \
    \   \"Mike\", new Person(\"Michael\", \"Neward\", 16)\n]\n```\n\nOfficially, the\
    \ returned by this function is a Map<string, string>, and the returned object\
    \ is fully compatible with the rest of the .NET FCL — it implements the IDictionary<Key,TValue>\
    \ interface and the ICollection<KeyValuePair<Key,Value>> interface in which this\
    \ is also a sequence of System.Collections.Generic.KeyValuePair<string,string>-items.\n\
    \nMaps can also be constructed from arrays (using Map.ofArray) or using sequences\
    \ (Map.ofSeq); where the syntax is identical to the previous code, using array\
    \ notation as appropriate.\n\nLike arrays and lists, maps are type-safe, parameterized\
    \ constructs that refuse to accept something (either the key or value) that is\
    \ not type-compatible, a Map<string, string> will not accept anything other than\
    \ a string for the key or value. Also, when constructed, maps are immutable, so\
    \ any \"modification\" operation (Add or Remove) on the map doesn't modify the\
    \ contents of the map but returns a new map with the modification in it:\n\n```\n\
    let moreNicknames = dict [\n    (\"Add\", Person(\"William\", \"Richards\", 45))\n\
    ]\n```\n\nAn IDictionary<Key,Value> can also be constructed explicitly from a\
    \ sequence of two-element tuples using the dict function:\n\n```\nlet numberMappings\
    \ = dict [\n    (\"One\", \"Two\"); (\"Three\", \"Four\")\n]\n```\n\nHowever,\
    \ despite the surface similarities, dict doesn't return an F# map, so se — the\
    \ returned object doesn't implement all the APIs as the returned object from Map.ofList,\
    \ and as a result, the dict-returned object won't be acceptable as a parameter\
    \ to the various Map functions"
