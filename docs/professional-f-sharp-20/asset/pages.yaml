  md: "# Putting It All Together | 373\n\nThe result is a moving average based on\
    \ the period applied. The average of the first four points is (1 + 2 + 3 + 4)\
    \ / 4 = 2.5, which is the first value of the series result. The second set is\
    \ (2 + 3 + 4 + 5) / 4 = 3.5 and so on through the sequence. The Seq.windowed function\
    \ returns a sequence that sliding windows of the input elements as arrays of the\
    \ size specified.\n\nIf the testdata contains ten elements (the floating point\
    \ numbers 1 through 10) then Seq.windowed 4 returns arrays containing four elements:\n\
    \n```\n> Seq.windowed 4 testdata;\n> val seq = seqfloat\n// [1.0; 2.0; 3.0; 4.0];\
    \ [2.0; 3.0; 4.0; 5.0];\n// [3.0; 4.0; 5.0; 6.0]; [4.0; 5.0; 7.0]; ...\n```\n\n\
    Take care of sequence of windows and using the pipe forward operator, pipe it\
    \ into the Seq.map function to apply the average of each array.\n\n```\n> Seq.windowed\
    \ average data\n> Seq.map Array.average\n```\n\nOverlaying the moving average\
    \ on the chart provides an augmented view of the original data. Using a slider\
    \ control or other input control, the user interface can provide input for the\
    \ moving average period function and a parameter to animate the chart.\n\n# PUTTING\
