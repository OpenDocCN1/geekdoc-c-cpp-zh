    # Updating Data


    Update, like create, uses a convention-based minimalist approach:


    ```

    do context.Update(Id=3;FirstName="Adriana";LastName="Erickson";Age=13)

    |> ignore

    ```


    Update uses a convention that the first property that ends in Id is expected to
    be, for database purposes, the identity which the update will be based. It would
    roughly translate to the following SQL code:


    ```

    update person set firstname=''Adriana'', lastname=''Erickson'', age=13 id=3

    ```


    If the Id column in the database was personid, rather than id, so long as personid
    is the first field that ends in id in the record, the following would work:


    ```

    do context.Update(PersonId=3;FirstName="Adriana";LastName="Erickson";Age=13)

    |> ignore

    ```


    # Deleting Data


    As you might expect, deletion does not stray from our simplistic formula:


    ```

    do context.Delete(Id=4;FirstName="Matthew";LastName="Erickson";Age=8)

    |> ignore

    ```'
