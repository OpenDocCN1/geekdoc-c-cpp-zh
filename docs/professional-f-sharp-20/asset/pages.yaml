  md: '# SUMMARY


    Services, among other things, are a way that programmers can provide outside systems
    a window into a domain model. They are a key to making interoperability happen
    in a more predictable manner. Without reliable services, experience demonstrates
    interoperability will happen — through the database, which for anyone who has
    maintained a legacy “integration database” knows, is far more error prone than
    it is through services. If you doubt that, ask yourself what happens when you
    start to have programs that read data that is frequently modified in hard-to-predict
    ways by other programs, and what the testing load on programs like that is is
    like.'
