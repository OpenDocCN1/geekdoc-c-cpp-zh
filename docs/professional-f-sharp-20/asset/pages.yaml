  md: "The foundation of your reasoning about these programs is unsound. As the number\
    \ of possible state changes per class increases, so does the number of potential\
    \ bugs. A single change to a class can cause bugs to appear in a completely different\
    \ part of the program. This problem is compounded to a large degree by asynchronous,\
    \ parallel, or event-driven programming.\n\nIf you have attempted to build a test\
    \ harness for a legacy class, you have likely experienced this firsthand. A precise\
    \ model of behavior can be difficult to nail down when behavior is defined by\
    \ a large number of stateful constructs. Modern testing and design methodologies\
    \ have been invented to handle some of these problems to combat the scare.\n\n\
    The good news is that by taking a functional approach you can eliminate the vast\
    \ majority of these errors. By changing your thinking to be in terms of immutable\
    \ data and transformations of that data, you can ensure that calls are parallel,\
    \ exactly what you expect. Intermediate program states are not exposed because\
    \ data is immutable and changes are made primarily through atomic reference swapping.\n\
    \n# STATE SAFETY\n\nBar none, the biggest problem with object-oriented languages\
    \ is that they make it impossible to guarantee any kind of state safety. This\
    \ single problem is responsible for everything from modern concurrency nightmare\
    \ to the epidemic of difficult-to-test code. Many sets of practices have risen\
    \ to help. However, they come, at a heavy cost in terms of both performance and\
    \ code size because they lack language support.\n\n# Programwise State Safety\n\
    \nWhen data and operations on data are inextricably intertwined, several problems\
    \ arise. First, object graphs are subject to simultaneous and conflicting state\
    \ changes. Second, it cannot be ensured that data is in the correct state for\
    \ a call to complete successfully. Third, changes in unrelated objects may affect\
    \ the output of a call. To understand these problems, it is necessary to examine\
    \ them in detail and see how immutable data prevents these types of errors from\
    \ occurring.\n\nErrors arising from simultaneous operations on a stateful object\
    \ are one of the primary reasons for interest in functional programming. An unfortunate\
    \ side effect of classes being considered black boxes is that without examining\
    \ the content of the class you can never be sure it was written in a thread-safe\
    \ way.\n\n```\ntype UnsafeAccessClass {\n    mutable var i = 0;\n    member this.IncrementAndGetResult()\
    \ = {\n        i++;\n        return i;\n    }\n}\n```\n\nAs you can see when multiple\
    \ calls make to UnsafeAccessClass.IncrementTen() occur in separate threads, the\
    \ output will vary depending on the order of thread execution. To explore what\
    \ can happen, take a look at this small framework that views the possible outputs\
    \ based on discrete timings by breaking this class into calls for each call."
