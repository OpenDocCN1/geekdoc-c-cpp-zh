  md: "# Modules | 193\n\nThis defines two types, formally named Examples.Person,\
    \ and the other formally named MoreExamples.Student. Nesting of namespaces is\
    \ not allowed in F#; to create a \"nested\" namespace, such as Examples.Cool,\
    \ the full \"nested\" name must be given in the namespace declaration.\n\nNote\
    \ that F# will not permit any code before the first namespace declaration in an\
    \ F# file, so general F# coding idiom will have the first line denote the namespace\
    \ used, or else no namespace is used throughout the file.\n\n# MODULES\n\nModules\
    \ come to F# from its functional roots, through its inheritance of the OCam programming\
    \ language. Traditionally, functional languages have needed a way to partition\
    \ functions away from potentially similarly named functions but haven't wanted\
    \ to \"lose\" name-container prefix the .NET developers have casually aside namespaces.\
    \ For example, add could mean of many different things, using List added clarified.\n\
    \nFurther complicating the F# story is, as previously mentioned, namespaces in\
    \ the CLR are essentially an abstraction of the languages on the platform and\
    \ not something the CLR recognizes to be a formal structure. Thus, the functional\
    \ style of a namespace \"owning\" top-level constructs could prove to be problematic\
    \ when cooperating with other .NET languages. As a result, F# chose to incorporate\
    \ another mechanism, the module, which on the surface of things seems to clash\
    \ directly with namespaces. However, modules and namespaces have significantly\
    \ different behavior and serve different purposes.\n\n# Referencing a Module\n\
    \nTo use a module, F# reuses the open keyword again make the same effect — opening\
    \ a module makes the functions and types declared inside that module available\
    \ without requiring the fully qualified name. At this level, there is little difference\
    \ between a namespace and a module, and most F# programmers will not even know\
    \ the difference when they using them.\n\n# Defining a Module\n\nDefining a module\
    \ is relatively straightforward, just as the namespace is: The module keyword\
    \ followed by a legitimate name begins a module definition, and that module declaration\
    \ is in scope until it is replaced by a new one:\n\n```\nmodule Examples\n\nmodule\
    \ Examples =\n\nopen System\n\ntype Person (fn : string, ln : string, a : int)\
    \ = =\n    member this.FirstName = fn\n    member this.LastName = ln\n    member\
    \ this.Age = a\n    override this.ToString() =\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_209_0.png)"
