  md: "Periodically, code written in a constructor wants to reference the object being\
    \ instantiated. F# does not define a pre-existing \"special name\" identifying\
    \ the object upon which methods, properties, or constructors are operating, like\
    \ the this or Me from C# or Visual Basic. Instead, F# uses a self-identifier declaration\
    \ made explicitly on the constructor or member. In the case of a constructor,\
    \ the self-identifier is done using an as clause after the constructor's declaration\
    \ before its body:\n\n```\n<Class>\ntype Person =\n    val firstName : string\n\
    \    val mutable lastName : string\n    new () as this = Person(*, **) then\n\
    \        System.Console.WriteLine(this)\n    new (fn, ln) = { firstName = fn;\
    \ lastName = ln }\n```\n\nCode snippet Class.fs\n\nThe compiler will emit a warning\
    \ if the as clause is present and the introduced name is never used (as is the\
    \ case with the clause in the preceding example). The names used are scoped to\
    \ the constructor or class body, as appropriate, and not be the same:\n\n```\n\
    <Class>\ntype Person =\n    val firstName : string\n    val mutable lastName :\
    \ string\n    new () as this = Person(*, **) then\n        System.Console.WriteLine(this)\n\
    \    new (fn, ln) as p = Person(fn, **) then\n        System.Console.WriteLine(p)\n\
    \    new (fn, ln) = { firstName = fn; lastName = ln }\n```\n\nIn general, most\
    \ classes be defined in terms of one principal constructor to which all others\
    \ defer, such as the two-argument version in the preceding example. To reflect\
    \ this, F# encourages the definition of a primary constructor, which signature\
    \ appears on the type-definition line, above all the other members in the class:\n\
    \n```\n// NOTE: This will not compile as-is\n<Class>\ntype Person(fn, ln) =\n\
    \    val firstName : string\n    val mutable lastName : string\n    new () as\
