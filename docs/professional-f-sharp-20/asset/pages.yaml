    \ =\n        let other = other ?: Person\n        let tln = string : this.LastName\n\
    \        let ln = tln.CompareTo(other.LastName)\n        if ln < 0 then\n    \
    \        let tfn = string : this.FirstName\n            let fn = tfn.CompareTo(other.FirstName)\n\
    \            if fn < 0 then\n                let ta = int : this.Age\n       \
