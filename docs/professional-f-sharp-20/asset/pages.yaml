    Code snippet PatternMatching.fs


    Pattern-matching to sift through a collection of data (such as the Preceding Persons
    list) is a common idiom in F#, as pattern-matching using the Option type to avoid
    null dereferences (and the subsequent exception) when searching through a collection
    of data. All of the syntactic in the F# language, pattern-matching is the most
    valuable — and thus the most to learn.


    # PATTERN TYPES


    A variety of different match constructs are available for use in the match expression.
    Any one of these can be combined with any of the pattern types, allowing F# developers
    to "mix and match" as the match suits them. This can sometimes create surprising
    effects and can potentially lead to some surprising results — remember that matches
    are evaluated in a top-down fashion, and to help the F# compiler will assist it
    in finding matches that will never allow any further match to succeed, or when
    the pattern-le matches particular value or range of values. The compiler isn''t
    perfect, and when it detects an unmatched construct at runtime, a MatchFailure
    exception is generated and thrown.


    # Constant Patterns


    As demonstrated, a pattern-match can match against values in a manner entirely
    similar to that of the switch/case construct from C-family language:


    ![](img/3b6b83f504d0e46470b40dafe9ce1960_108_0.png)


    ```

    let x = (new Random()).Next(6)

    let message = match x with

    0 -> "zero"

    1 -> "one"

    2 -> "two"

    3 -> "three"

    4 -> "four"

    5 -> "five"

    | _ -> "Unknown: " + x.ToString()

    ```


