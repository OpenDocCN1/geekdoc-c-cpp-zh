    # RULES OF THUMB FOR WRITING F# APIS


    In this chapter, so far, ways we C# programmers might call "F# oddities" have
    been covered. Over time, it is likely that many of these concepts from F# that
    are not easily expressed in CLR will find their way in, like Tuple<T> have become
    a core part of the .NET framework. However, whatever is in that, it is safer to
    write APIs that conform to things that map easily to other languages as they are
    currently defined.


    To help APIs that will operate nicely with other languages, consider the following
    rules of thumb:


    +   - Avoid Tuple as return types from APIs. Even though the concepts are supported
    in C# and other CLR languages in .NET 4.0, code that works with Tuple<T> is hard
    to read outside the context where the Tuple is defined.

    - Avoid FSharpOption unless you are sure your API consumer can take a dependency
    on FSharp.Core. The FSharpOption is arguably, a better Nullable than Nullable,
    something that can help C# programmers avoid using null as a sentinel value meaning
    None. However, the drawback of forcing the dependency to FSharp.Core is an important
    concern, as is the complexity of dealing with a large codebase where Nullable
    and FSharpOption might end getting mixed together, creating even more confusion
    than you started.

    - Record types are all good—use them at will. For F# Record types allow a programmer
    to do in one line of F# what often takes many lines of C#, expressing the content
    of an immutable-holder of data (that is, for transfer between systems) very cleanly.

    - Avoid use of discriminated unions in public APIs. These are great for internal
    F# code, but for C# code, the language constructs for dealing with them in a way
    idiomatic to good C# simply are not present.'
