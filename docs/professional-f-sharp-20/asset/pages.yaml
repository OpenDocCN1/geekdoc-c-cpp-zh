  md: '# Arithmetic Conversions


    | TYPE | DESCRIPTION | .NET NAME | LITERALS |

    |---|---|---|---|n| decimal | High-precision decimal | System.Decimal | 19M, 3.2M
    |

    | bignum | Arbitrary-precision rationals | Microsoft.CSharp.Math.bignum | 19N,
    3.2N |


    Like all CLR-based languages that use the System.Single and System.Double-based
    types, floating-point arithmetic is inherently inaccurate — adding the values
    1.0 and 1.0 does not necessarily produce 2.0, but could produce 2.0; any operations
    that require high accuracy should use the decimal or bignum types instead of single/float32
    or double.


    The bignum type, unlike decimal or single or double, does not store its representation
    in a decimal format, instead preferring as fraction, tracking both numerator and
    denominator. This guarantees the highest degree of precision, but at the cost
    of having to do the fractional mathematics directly when looking to convert it
    to a floating-point representation. Fortunately, F# supports all the major mathematical
    operations on bignum types, performing the appropriate fraction.


    > With the release of Visual Studio 2010, Microsoft moved the definition to the
    F# PowerPack, which is a useful and near-mandatory set of supplemental material
    available for free download at http://fsharppowerpack.com.


    Note that F# understands two special floating-point constants, (positive) Infinity
    and (negative)-Infinity, which will be the result of any floating-point division
    by zero.


    # ARITHMETIC CONVERSIONS


    Unlike the C-family of languages


    ```

    int x = 1;

    float y = 2.0;

    var result = x / y; // returns 0

    ```


    when translated to F#, has to be explicitly converted, like this:


    ```

    let i = 4 // int constant

    let f = 4.0 // float32 constant

    // let result = i * f fail; i and not the same type

    let result = (float32 i) / f

    ```


    The conversion is by explicitly naming the type to convert to, in much the same
    way that a downcast is written in C#, without the parentheses. However, note that
    the parentheses around'
