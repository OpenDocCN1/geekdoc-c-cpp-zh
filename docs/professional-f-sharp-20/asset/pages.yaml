  md: 'Summary | 295


    +   - Do not use F# native functions as parameter types in public APIs. Prefer
    Func<...> and Action<...> over native F# functions in APIs that pass functions
    around, as there is a great deal of pain involved for languages other than F#
    to create proper F# functional constructs.


    +   - Use each language for its purpose. For the same reason C# is likely better
    than F# for expressing hardcore OO concepts, F# is better than C# for doing things
    like functional composition. Within those areas of strength, it is best to stick
    with the language at hand. Don''t try to use F# to compose functions in C#, and
    don''t try to use F# in some elaborate C# inheritance. In an API where one interoperates
    with the other, select concepts that are cleanly expressed in both languages working
    over the seam.


    # # SUMMARY


    There are great reasons for being a polyglot—that is, proficient in multiple languages
    in a manner that allows the programmer to use each language where it is best suited.
    Many enterprise solutions have aspects that are best expressed in functions, such
    as business intelligence and complex calculations, where other aspects are best
    expressed in objects. By knowing not only how to use both languages, but also
    how to use them together, the .NET programmer is well suited to not only get the
    best of both worlds, but also to do so in a way that does not make both F# and
    C# bases difficult to maintain.'
