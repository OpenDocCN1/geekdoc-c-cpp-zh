  md: "# Array Patterns\n\nJust as pattern-matching can match against lists, pattern-matching\
    \ can also match against arrays:\n\n```\nlet numbers = [[1; 2; 3; 4; 5]];\nlet\
    \ match = match numbers with\n  | [ ] -> \"Array is empty!\"\n  | [ one ] ->\n\
    \      \"Array has one item: \" + one.ToString()\n  | [ one; two ] ->\n      \"\
    Array has two items: \" + one.ToString() + \" * \" + two.ToString()\n  | _ _ *\
    \ -> \"Array has more than two items\"\nSystem.Console.WriteLine(message);\n```\n\
    \nHowever, because arrays lack an easy way to \"tear off\" a piece of the array\
    \ and recursively process the remainder, as lists do, are rarely used as a source\
    \ or target of pattern-matching.\n\n# Discriminated Union Patterns\n\nPattern-matching\
    \ against discriminated unions (described in Chapter 7) is not much different\
    \ than pattern-matching against other types, with the exception that the compiler\
    \ sanity-checks to ensure that a discriminated union value only has matches that\
    \ could be remotely possible.\n\n```\ntype Color =\n  | Black\n  | Blue\n  | Cyan\n\
    \  | Gray\n  | Green\n  | Magenta\n  | DarkBlue\n  | Red\n  | White\n  | Yellow\n\
    ```\n\n```\nlet color = Black\nlet message = match color with\n  | Black -> \"\
    Black!\"\n  | Blue -> \"Blue!\"\n  | _ -> \"Something other than black or blue\"\
    \nSystem.Console.WriteLine(message);\n```\n\nDiscriminated unions are a powerful\
    \ companion to pattern-matching, just as tuples are.\n\n# Record Patterns\n\n\
    Record types, described more in Chapter 7, can also be pattern-matched (and values\
    \ extracted) in the same way that tuples are. In fact, since a record type is,\
    \ in many ways, \"just\" like a tuple, matching with record is just an extension\
    \ of doing it against a tuple:\n\n```\ntype Author =\n  | Author of string * string\
    \ * int\n```"
