    # ## VISUAL STUDIO PROJECT TEMPLATES


    The key project in Visual Studio template hosts the XAML files and builds the
    XAP file is called the Silverlight Application project template. The template
    for a Silverlight application creates two projects, one for building the Silverlight
    XAP file and another for building a web site that will host the Silverlight binaries
    and any services needed for communicating back to the server from the client application.


    The C# or VB Silverlight application includes XAML files for laying out the user
    interface. Silverlight and WPF (Windows Presentation Framework) use XAML for user
    interface development. There are only minor differences between Silverlight and
    WPF, it is possible to write applications that can be compiled in both Silverlight
    and WPF. The similarities between them are so; the original for Silverlight was
    WPF/ Windows Presentation Framework. So skills gained from one framework easily
    translate to the other.


    The web site uses ASP.NET for testing the Silverlight application, even though
    Silverlight does not require ASP.NET for mostly HTML. This project template is
    handy for rapid application development, it facilitates building and running a
    Silverlight application and automatically connecting the debugger to the web server
    in the Visual Studio "Cassini" service and the Silverlight process on the browser.
    It also deploys the XAP file to a ClientBin folder that holds the HTML references.


    When the build environment is set up, creating some data in F# and binding it
    to a chart provides a basic understanding of the chart tools. To demonstrate the
    ease and power of'
