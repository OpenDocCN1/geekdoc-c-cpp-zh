    The common pattern for nonquery operations where a parse tree need not be analyzed
    is simply to do some reflection over the generic type, read the values from the
    provided record in simple manner that matches a convention, construct a SQL command,
    and execute it. The implementations of delete and update differ only by the SQL
    that is generated; nearly everything else is the same.


    # The Use Case for F# Active Record


    FAR, as a library, is meant to be a simple, minimalist, and illustrative implementation
    that covers a large, but not exhaustive, set of cases for how F# applications
    access data. It does so in a manner that allows the library to be independent
    of the domain, avoiding inheritance or any other special "things" that need to
    be done to make a record work with FAR. If you have a record, and you have a table
    and columns that match up, FAR can work.


    # SUMMARY


    In this chapter, we covered ways for F# programs to interact with data, particular
    in ways that feel idiomatic to F# developers. You may choose to use raw ADO.NET,
    use F# Active Record, or use one of the more object-oriented frameworks. What
    is important, across all of these, is to minimize the amount of plumbing code
    you write, so you can focus on doing something with data, rather than simply gathering
    it.'
