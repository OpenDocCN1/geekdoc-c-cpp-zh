  md: '# ACKNOWLEDGMENTS


    **FIRST AND FOREMOST.** I would like to thank Aaron, Rick, and Talbott for swooping
    in at the last second, carving off chunks of the vastly-overwhelming “TODO” list
    remaining to me, and knocking them off with a manly complaint or challenge. You
    guys have been a delight to work with. A tip of the hat must also go to Don Syme,
    Luke Hoban, Chris Smith, and the others on the F# team, who answered stupid question
    after stupid question. Thanks must also go out to the various subject as I as
    well as those who know less-than if you have been extremely helpful in honing
    the delivery of the answer to the question "Why is F# and why do I care, and how
    do I use it?" Matt Podwysocki in particular gets a hearty kudo for helping me
    understand some of the thornier functional concepts, and Kevin Hazrard gets one
    just for being himself.


    Lastly, no book gets written without a support structure, and in this case, that
    structure consists principally of my wife, Charlotte, who patiently endured night
    after night of “I promise I''ll be home by midnight” and wound up waiting for
    ''til 3 or 4 AM, just to hear how my day (er... night) went. Hon, you deserved
    much better than me, but I''ll never tell, off the chance that you haven''t figured
    it out.


    TED NEWARD


    **I WOULD LIKE TO** thank, my wife, my kids, and my professional colleagues for
    their support through this process. Of course, a hearty thanks goes to the folks
    at Wrox who have been very patient along the way, especially during those times
    where billable consulting time conflicted with book writing time. Of course, without
    all the great people in the F# community, this book would not have happened. Particular
    thanks goes to Alex Pedenko, who helped me met the Relational Record Mapper concept,
    nearly extending the work I started in the data chapter.


    ARON C. ERICKSON'
  merge: -1
  pgno: 8
