  md: '# COMING FROM C#


    If you are deeply familiar with C# lambda expressions, you are way ahead of the
    game. C# lambda expressions are arguably first-class language citizens. They capture
    in-scope variables. They even grant some limited type inference. F# functions
    (and lambda expressions) support all these features and more.


    First, have may have better type inference. Rarely will you find yourself needing
    to define the input and outputs of an F# function. This is because the F# compiler
    uses the powerful Hindley-Milner inference algorithm (http://www.codecommit.com/blog/what-is-hindley-milner-and-why-is-it-cool).
    This alone greatly reduces code size.


    This means there is no need build intermediate objects to move data between functions.
    That is, you can have arguments passed in one time and return results of multiple
    data types. There is no need to define classes used to move data between functions.


    Third, F# functions support tail recursion. This means that, if written so the
    recursive calls all as the final step before returning, F# functions will not
    overflow the stack. This allows you to leverage recursion in many cases and be
    confident that your recursive functions will execute effectively.


    Perhaps the best feature over F# lambda expressions is that F functions do not
    need to be contained within an explicit class. Using F#''s interactive window,
    you can compose your program at one time, playing with different ideas. This makes
    development much faster because a stiff object-oriented design doesn''t need to
    be in order to simply try a new idea. Object-oriented architecture can be applied
    at a later time, once the underlying ideas of the program have solidified. One
    of the biggest benefits in this style of writing software is that tests ends up
    being function level and don''t need to be constantly rewritten for architecture
    changes.


    # FUNCTION ARGUMENTS AND RETURN VALUES


    Function arguments and return values are a bit different in F# than other .NET
    languages. They have a different syntax and type inference by default. Both of
    these features can come directly from F#''s ML heritage.


    However, as F# compiles to just like C# or VB, it is ultimately limited to the
    underlying type representations. More than in any other .NET platform language,
    it is important to understand this system and the limits of its capability to
    both generalize and restrict. Similarly, leveraging F#''s inline keyword to enhance
    type generalization and restriction can be a great boon.


    # Automatic Generalization and Restriction


    In F the type of each function argument is automatically resolved for you through
    context whenever possible. The compiler examines how the arguments are used and
    attempts to provide a type that satisfies the most general case allowed by the
    underlying CLR type system. This process is called automatic generalization.'
