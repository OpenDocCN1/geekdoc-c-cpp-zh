    # Tuples


    Per second only to tuples, tuples are one of the most used data structures in
    F#. Frequently, they are used to conveniently bind sets of function inputs and
    outputs and make for much more readable functional code. In .NET 4.0 and later,
    F# tuples are .NET types in the System namespace.


    Although some were concerned with the design decision to implement tuples as reference
    types, after testing it was found that this made little or no difference for the
    vast majority of applications and broadly increased tuple interoperability.* In
    cases where performance is paramount, as crunching in a tight loop, using a predefined
    struct in the place of a tuple may grant a performance improvement.


    # Records


    Records are similar to C# anonymous types and are used in the same way. They allow
    you to quickly generate data-only classes with named fields for data processing.
    Similarly to tuples, the fact that records are immutable reference types may cause
    a small amount of additional overhead. In some cases you may find using a struct
    in its place grant a performance improvement.


