  md: '# Closures


    Lexical closures are by far the easiest way to create new functions at runtime.
    Simply put, when a function is defined within another, it binds the values that
    are defined before it in the parent function''s scope. This can be done with any
    first-class language construct: values, objects, and functions.


    Think back to school and the approximate derivative of a function. You might recall
    that it can be expressed in terms of $f(x + dx) - f(x - dx) / ( 2 * dx)$ where
    $dx$ is a number close to zero. Without higher order functions, it is quite difficult
    to calculate in a nonspecific way. Given higher order functions, it''s possible
    to calculate the derivative of a single value of x in the following way:


    ```

    let approximateDerivative f dx = (f(x + dx) - f(x - dx)) / 2 * dx;

    ```


    However, with a way to create a function, this can only find values of the derivative
    at certain points. With closures you can create the approximate derivative function
    of a given function.


    ```

    let derivative x = (f(x + dx) - f(x - dx)) / 2.0 * dx in derivative

    ```


    In this example the function and dx are passed into the parent function and captured
    by the derivative function. This new function can now be returned containing these
    bound values.


    The simplest implication is that, when repeatedly calling the same function, you
    no longer need to pass the same arguments again and again. Instead, you can simply
    create an embedded function that closures over the unchanging variables and call
    it. This is quite a boo, especially when dealing with mutable variables. You no
    longer need to consider that they might change the function''s behavior. Once
    bound, values will never change unless by reference.


    # Lambda Expressions


    A lambda expression is simply syntax for a function without a name. It can still
    be closed and carried over variables just like any other function. It can be assigned
    to a variable, however it may not be.


    Lambda expression syntax is simple, just use the keyword followed by a list of
    arguments and the function contents. Going back again to the derivative example,
    we can make the return much cleaner if we use a lambda expression:


    ```

    let lambdaDerivative f dx = fun x -> (f(x + dx) - f(x - dx)) / 2.0 * dx

    ```


    In this example the function is returned directly without any need for intermediate
    constructs. The syntax is clean and easy to understand, ideal for passing to or
    returning from other functions.


    This feature is particularly useful when calling the F# functions that take another
    function as a parameter. The resulting code reads much more easily than a separate
    definition when written in this way.


    However, be careful when using multiline lambda expressions. They can easily get
    out of hand and be difficult to differentiate from their surrounding context.
    They are also difficult to write tests'
