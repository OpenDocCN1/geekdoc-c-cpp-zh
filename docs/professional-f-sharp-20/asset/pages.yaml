    The goal is to use active patterns to break this document down into the repetitive
    person structure that appears repeatedly and transforms it into a more easily
    used within an F# program.


    Recall from the discussion on active patterns three basic forms of active patterns
    are available: the single-case active pattern, which converts data from one to
    another; the partial-case active pattern, which helps to match when data conversion
    failures are possible or likely; and the multi-case active pattern, which can
    take the input data and break it into one of several different groups. Although
    only one structure appears in the preceding example (the person structure), it
    remains a reasonable assumption to imagine that other structures can, or will
    appear in the document later. This implies that either the partial-case or the
    multi-case active pattern will be suited for the F programmer to know the full
    set of data types that the document contains.


    This is not a discarded decision — XML documents are often used when a certain
    amount of ambiguity is expected or desired. Yet, much of the XML sent back and
    forth between organizations is intended to be a closed-set of data types nestled
    in angle-brackets, with unrecoverable errors when an unknown XML document is received.
    If ambiguity is expected or desired, then the partial-case should be considered,
    and if not, then the multi-case active pattern becomes the weapon of choice.


    For pedagogical purposes, both approaches are considered.


