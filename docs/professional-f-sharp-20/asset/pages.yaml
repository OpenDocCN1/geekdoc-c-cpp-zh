    Code snippet ServiceContract.cs


    Note the presence of a couple things that are not normal in indent F# code: First,
    in the world of Microsoft WCF Services, things that are (strings, ints, doubles,
    and the like) need to be described in a DataContract as [DataContract], and each
    member to be passed over the wire is marked with the [DataMember] attribute.


    It is also worth noting that these contracts take the form of mutable types. The
    chief reason this is needed for serialization, it is expected that the client
    using the service will need to use serialization to reproduce the object it received.
    WCF, as of this writing, does not hydrate objects means F# would require typical
    (that is, the way you might populate a record), and therefore to allow for the
    client to set the properties, the data contract has to define mutable properties.


    A data contract can also be defined as an interface, which would allow us to build
    a nonurtable version on the F# side for the concrete implementation of the data
    contract. Although it would be slightly more idiomatic for F#, the added code
    in such a case for an object that acts as a simple DTO is typically not the worth.


    Of course, a DataContract is never useless. It is needed to retrieve an or objects
    that match the DataContract. These are defined using ServiceContract and OperationContract.


    ```

    [ServiceContract]

    type WeatherService =

    [OperationContract]

    abstract member GetForecastFor:string -> Forecast

    ```


    Generally, a service will implement something that turns into a Forecast that
    matches the DataContract definition. On the surface, OperationContract is pretty
    straightforward. However, it is important to note that, as a consequence of the
    way WCF works, any parameters in an OperationContract must be named, or else exceptions
    will be raised when the service is hosted.


    When a ServiceContract is place, the next step is to think about how to fill the
    conditions of the ServiceContract. A good place to start is to use any domain
    models that might have been developed previously.'
