  md: "# Loops to Pipelining\n\nComing from the imperative programming world, it takes\
    \ some change in perspective to move from thinking in terms of mutations in a\
    \ loop to transformations in a function pipeline. The shift in perspective is\
    \ focusing on what you want to do discrete instead of how you want to do it all\
    \ at the same time.\n\nTake a look at this simple example where you are trying\
    \ to decide among several vacation spots.\n\n```\ntype VacationLocation = {\n\
    \    Name: string; Pop: int; Density: int; Nightlife: int\n}\n```\n\n```\nlet\
    \ destinations = {\n    { Name = 'New York'; Pop = 900000; Density = 27000; Nightlife\
    \ = 9 }\n    { Name = 'Munich'; Pop = 1300000; Density = 4300; Nightlife = 7 }\n\
    \    { Name = 'Rome'; Pop = 1300000; Density = 15000; Nightlife = 3 }\n}\n```\n\
    \n```\nlet findVacationImperative data = {\n    let mutable output = []\n    for\
    \ i = List.length - 1 downto 0 do\n        let current = data[i]\n        let\
    \ size = current.Pop / current.Density\n        if current.Nightlife >= 200 &&\
    \ size < 8000 then\n            output <- List.Cons(current.Name, output)\noutput\n\
    }\n```\n\n> > findVacationImperative destinations:;\n> val : string list = [\"\
    Munich\"; \"Rome\"]\n\nIn this imperative way, the data is passed in, and if it\
    \ passes a set of predicates, the name of the value is added to a list. There's\
    \ a lot going on here that you shouldn't need to think about. First, you need\
    \ to explicitly build and maintain a data structure to store data. Second, program\
    \ flow must be explicitly controlled via a backward loop and an if statement.\
    \ Third, all this logic is tangled and difficult to extract in a meaningful way.\
    \ If all you want to find the name of a city that meets criteria, why the movement\
    \ of every chunk of data is explicitly stated? It ends up a tangled mess.\n\n\
    This example is clearer when pipelining is used. To convert to pipelining, each\
    \ of the predicates in the statement is changed into a filter statement. After\
    \ being filtered we perform the conversion to just the city name with a map. Everything\
    \ in the example can be thrown away.\n\n```\nlet findVacationPipeline data = =\n\
    \    data\n>\n```\n\n```\n|> List.filter (fun x -> x.Nightlife >= 5)\n|> List.filter\
    \ (fun x -> x.Pop / x.Density >= 200)\n```"
