    \n# # CALCULATING MOVING AVERAGE\n\nData by itself is statements to be visualized,\
    \ but trends or patterns can be useful. In finance the moving average is a common\
    \ model applied to time series data to understand trends and help predict future\
    \ directions of series. But looking for patterns in data can be useful for a range\
    \ of solutions including security attack detection or business intelligence. An\
    \ algorithm for calculating moving average in F# takes the data chunks into windows\
    \ and calculates the average of each window:\n\n+   * let MovingAverage period\
    \ data =\n    Seq.windowed period data\n    |> map Array.average\nlet testdata\
    \ = [1.0 .. 10.0]\nlet result = MovingAverage 4 testdata\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_377_0.png)\n\
    \n// Code Snippet Economics.fs\n\nThe output of these three statements to the\
    \ F# Interpreter is:\n\nViewing the result in FSI displays the first few in the\
    \ sequence:\n\n```\n; result;\nval it : seq<float> = seq [2.5; 3.5; 4.5; 5.5;\
    \ ...]\n;\n```"
