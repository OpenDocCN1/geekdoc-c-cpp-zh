  md: "# Type Extensions | 157\n\nAlthough unusual, it is possible to define private\
    \ constructors on types, even the primary constructor, using the following syntax:\n\
    \n```\n<Class>\ntype PrivatePerson private(fn, ln, a) =\n    private new() = PrivatePerson(\"\
    \\*\", \"\", 0)\n    static member Create(fn, ln, a) = new PrivatePerson(fn, ln,\
    \ a)\n    static member Create() = new PrivatePerson()\n```\n\nTypically, the\
    \ private constructor is used to prevent direct construction and instead defer\
    \ construction through a \"factory method,\" as that defined in the preceding\
    \ example.\n\n# TYPE EXTENSIONS\n\nHistorically, object-oriented developers have\
    \ found themselves caught on the horns of dilemma: To make it easy to maintain\
    \ code, it's best to encapsulate details about the class, but frequently that\
    \ maintenance requires extending a class in ways the author never intended and\
    \ never providing easy access to. As a result, some developers have taken to drastic\
    \ (and counter-intuitive) actions such as declaring all fields and methods as\
    \ \"protected\" at the least, so as to allow maintenance to extend a class and\
    \ have full access to the internals of that class. Unfortunately, such actions\
    \ have historically led to fragile code over time, because the guarantee that\
    \ encapsulation was supposed to provide (assurance that all the code that modifies\
    \ a field inside one class) is never broken.\n\nWith the introduction of C# 3.0,\
    \ Microsoft changed the game somewhat, introducing extension methods, static methods\
    \ defined on a third-party class that can appear as if they were declared on the\
    \ original class, without requiring an inheritance relationship. F# has a similar\
    \ feature, known as type extensions, to do the same kind of thing, but in a slightly\
    \ simpler manner and with greater capability.\n\nAssume an F# developer has no\
    \ reason to extend a class like this:\n\n```\n<Class>\ntype Student(name : string,\
    \ subject : string) =\n    member s.name = name\n    member s.subject = subject\n\
    ```\n\nIf the code is extended within the same namespace or module as the original\
    \ definition, then the extension is considered an intrinsic (because the code\
    \ extension is intrinsic to the same unit where it is being defined), and basically\
    \ the compiler will stitch together the definitions into a single type in the\
    \ same way it does for partial definitions in C# or Visual Basic. Otherwise, the\
    \ extension code must be in a module (so it is called an extension member). See\
    \ Chapter 11 for a discussion on the differences between namespaces and modules),\
    \ and when the module containing an extension member is opened, that member becomes\
    \ available as if it were an instance or static method defined on the type originally,\
    \ again much like the C# 3.0 extension facility."
