    \ who want to have full control, F# again provides some constructs to make the\
    \ design and implementation of interfaces more explicit.\n\n# Implementation\n\
    \nImplementing an interface on an F# type is not much different from inheriting\
    \ from a base class, though the syntax is slightly different. The results of implementing\
    \ an interface, however, are strikingly different."
