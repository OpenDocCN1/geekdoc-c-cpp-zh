    # BITWISE OPERATIONS


    All the previous integer types support bitwise operations — operations that take
    into account the underlying bitwise representation — such as AND, OR, Exclusive
    OR. The operators to carry out these operations are defined nontrivial, compared
    to the C family of languages, which aren''t difficult to understand or follow.
    Consider the following:


    | OPERATOR | DESCRIPTION | EXAMPLE (WITH RESULTS) |

    |---|---|---|

    | && | bitwise AND | 0b1111 &&&& 0b1100 -> 0b1111 |

    | || | bitwise OR | 0b1111 |||| 0b1100 -> 0b1111 |

    | ^^ | bitwise exclusive OR | 0b1111 ^^ 0b1100 -> 0b0011 |

    | --- | bitwise NOT | 0b11110000uy = 0b00001111uy |

    | << | bitwise shift left | 0b0110 << 1 -> 0b1100 |

    | >>> | bitwise shift right | 0b0110 >>> 1 -> 0b0011 |


    Generally, bitwise operations are not necessary in F# because their principal
    in traditional C/C++ code take a variety of "flag"style information or concise
    values packed into a single variable to save space; "flags" are typically better
    represented in other ways in F# (see Chapter 5 for details), and the CLR will
    do its own packaging of values to save space, such measures are often counter.


    # FLOATING-POINT TYPES


    Floating-point types in the F# language hold values that should not be rounded
    up to numbers.


    | TYPE | DESCRIPTION | LITERAL |

    |---|---|---|

    | single, float32 | 32-bit IEEE floating-point | System.Single 3.2f, 1.3e4 |

    | double, float64 | 64-bit IEEE floating-point | System.Double 2.3, 1.3e-4 |'
