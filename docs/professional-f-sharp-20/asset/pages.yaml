  md: '# INTRODUCTION


    book that “we just didn''t have time to cover;” the book you will be written entirely
    differently than this one, in a different style than this, and probably by entirely
    different authors.


    This book assumes you are comfortable with object-orientation and want to start
    down the path of learning not only how to program with functional concepts, but
    that you want to work with both functions and objects, in some kind of pleasant
    harmony, on top of the CLR.


    If you''re not sure if you''re the right reader for this book, take this little:
    read Chapter 1, Primer, and see if that makes sense to you. If it seems too simple,
    you''re probably functionally-minded as Silverlight databases will never meet;
    you will find the book useful as a reference, perhaps as a skimmable guide to
    the syntax, but you won''t find mind-popping concepts in here. If it seems too
    difficult, don''t despair—that chapter is intended as a microcosm of what you
    want to end up.


    If that seems “just right,” though, head over to the register.


    # WHAT THIS BOOK COVERS


    This book takes a four-part approach to the F# language (officially, the F# 2.0
    version of language): basics, objects, functions, and “integration” (meaning F#
    interacts with various .NET technologies like Silverlight or relational databases).
    We go over 90% of the F# programming language that you think are going to need.


    Note that we''re not a complete reference on the language. We ignore the 10% of
    the language that we might think need. NET developers will never run into, or
    the grounds that if you do run into one of the edge-case constructs, you''ll have
    enough familiarity with the F# syntax to figure it out, or you''ll look it up
    in the F# 2.0 Language Reference (or ask somebody in forums or on a mailing list)
    for the exact details. (Ours guess is it''ll be at least a year or so as a practising
    F# developer before you run into one of these constructs.)


    # HOW THIS BOOK IS STRUCTURED


    The book is arranged in we think, the order a programming .NET (which means, “object-oriented”)
    developer will find most useful.


    Part 0 is the Primer, a gentle up-introduction to the concepts that the F# language
    incorporates as first-class citizens and as a hint of the ways in which functional
    programming can be useful within the .NET environment.


    Part I covers Basics. Here, you''ll find definitions of the primitive types, flow
    control, syntax rules, and other things that have to be defined before anything
    else can be discussed.


    Part II covers Objects. F# permits the creation of new classes, interfaces and
    other object-oriented types, as well as the traditional set of object-oriented
    features as inheritance, and they''re all covered here. In keeping with the tone
    of the book, we don''t spend a lot of time'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# INTRODUCTION


    teaching you what "IS-A" means; as a practising .NET developer, you already know
    that. So this chapter focuses primarily on the syntax, and how F# "does objects"
    both similarly to, and differ-ently from, its sibling languages C# and Visual
    Basic.


    Part III takes on an entirely different tone, that of Functions, and will be the
    new material and concepts for most readers. Instead of using Visual Studio, you
    use the REPL (Read-Evaluate-Print-) for writing snippets of code and seeing them
    immediately. Instead of building up objects, you create functions. And so on.
    Readers stop after the end of Part II and F# as "a better C#," but doing so would
    be missing out on some of the very things that F# has more interesting than C#.


    Part IV, then, shows how to use F# with a variety of different technologies (XML,
    Silverlight, and so on), and tries to show one way—not to use F# beyond straight
    console-mode applications. As tempting as it might be to jump right here and copy-paste
    into your own applications, resist the urge until you''ve read through the first
    three parts. It''s vastly satisfying to be able to predict what the code will
    look like after you read along, just than to see the code execute and have no
    idea why.


    # WHAT YOU NEED TO USE THIS BOOK


    We assume that you have Visual Studio 2010 installed on your system. As of this
    writing, unfortunately, no "Visual 2010 F# Express" download exists from Microsoft,
    so you''ll need to use Visual Studio 2010 Professional, with (obviously) the Visual
    F# feature installed with it.


    If you have a Visual Studio 2008 installation, you can still play in the F# playground,
    but it''s a bit harder. You must find and download the Visual F# installs for
    Visual Studio 2008 (it''s a Visual Studio package), and install them. Technically,
    this is "F# 2.0 for Windows + Visual Studio 2008 (April 2010 release)" version.


    If you don''t have a version of Visual Studio and are unable to acquire one, another
    option is available to you: a self-constructed version of "F# Express." By installing
    the Visual Studio 2008 and the aforementioned—you will have a version of Visual
    Studio 2008 that contains only the F# language compiler and nothing else—no .NET,
    nor Silverlight. (As of this writing, the F# team was exploring whether the Visual
    Studio 2010 would work as a host for the F 2.0 bits, and it''s likely that such
    a combination will work, none of the authors here can verify for a fact)


    If you are looking to use F# on Mono, you will want to download the "F# 2.0 for
    Mono/Mac/Linux (compile binaries)" and install according to the instructions there.


    As of this writing, the "F# Downloads" page on Microsoft Research (research.microsoft.com)
    has links to all of the different favors discussed here.


    Our assumption is that the vast majority of our readership will be using Visual
    Studio 2010 or Visual Studio 2008, so if you are one of the readers outside of
    that population set, we apologize'
