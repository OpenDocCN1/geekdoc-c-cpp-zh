    # LISTS


    Lists are an ordered collection of a single type, like tuples, form a major backbone
    of functional programming. Internally, lists are singly linked lists, making construction
    and extraction is extremely fast and space-efficient. However, random access to
    the list will be far slower than arrays; fortunately, most functional programming
    prefers recursion over iteration, and recursion works to extract elements one
    at a time out of the list for processing.'
