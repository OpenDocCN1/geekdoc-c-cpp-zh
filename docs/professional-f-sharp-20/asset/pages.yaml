  md: "Partial Application | 217\n\n# # Restrictions on Functions and Methods\n\n\
    As useful as they are, for the sake of efficiency and interoperability F# has\
    \ imposed a few restrictions on functions and curried methods. Not knowing about\
    \ these beforehand can cause quite a bit of difficulty because they are somewhat\
    \ nonintitive.\n\nFirst, functions defined outside the scope of a class cannot\
    \ be overloaded. This makes sense because potentially a free floating function\
    \ is bound to a name that does not include its full type signature.\n\n```\n>\
    \ let square x: int * x * x;\nlet square x: double = x * x;\nerror F00037: Duplicate\
    \ definition of value 'square'\n```\n\nWith just data values, you cannot have\
    \ multiple instances that have the same name within the same scope. However, as\
    \ long as the type signature is exactly the same, None of these restrictions apply\
    \ to class methods. In other .NET languages, class methods can be overloaded.\n\
    \n```\n> Type SquareHelper;\nstatic member square (x: int) = x * x\nstatic member\
    \ square (x: double) = x * x;\n```\n\n```\ntype SquareHelper =\nclass\n    static\
    \ member square : x:int -> int\n    static member square : x:double -> double\n\
    end\n```\n\nHowever, curved class methods cannot be overloaded. And any member\
    \ of more than a single argument will be curved by default.\n\n```\n> type BadMathHelper;\n\
    static member multiply (x: int) (y: int) = x * y\nstatic member multiply (x: double)\
    \ (y: double) = x * y;\n```\n\n```\nstatic member multiply (x: int) (y: int) =\
    \ x * y;\n```\n\nThe method 'multiply' has curved arguments but has the same name\
    \ as another method in this type. Methods with curved arguments cannot be overloaded.\
    \ Consider using a method taking tuples.\n\nThe curving of class methods can be\
    \ prevented by using tuple syntax for function arguments.\n\n```\n> type GoodMathHelper;\n\
    static member multiply (x: int) (y: int) = x * y\nstatic member multiply (x: double)\
    \ (y: double) = x * y;\n```\n\n```\ntype GoodMathHelper =\nclass\n    static member\
    \ multiply : x:int * y:int -> int\n    static member multiply : x:double * y:double\
    \ -> double\nend\n```"
