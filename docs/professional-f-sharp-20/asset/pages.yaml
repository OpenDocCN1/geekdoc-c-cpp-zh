- img_proc: true
  md: '# 210 | CHAPTER 13 FUNCTIONS


    Unfortunately, this approach makes it difficult to build reusable components.
    Without the ability to pass functions, it is difficult to compose new structures
    at runtime, swap components for testing or have a subcomponent communicate back
    to its parent. Over the years various techniques have emerged to mitigate this.


    One of the ways was to use function pointers (Function pointers allow you to pass
    the location of functions in memory so that they can be called later. However,
    these are cumbersome to define and often lack type safety. Also, languages that
    use this technique have only compile time checking, ad-hoc runtime type systems
    often need to be constructed.


    Another common technique is to use inheritance. The general concept of this technique
    is that you define an abstract class that requires certain member functions are
    filled in. You then pass your function in terms of a concrete implementation of
    this abstract class. However, this approach requires a lot of additional code,
    and the inheritance having private variables, dependencies on unexpected behavior.


    Yet another is Events. Events allow us to easily inject callbacks into our existing
    code via a special mechanism for calling function pointers. In addition to the
    runtime problems when in using functions, it has a whole of other issues due to
    the dependence on subscribers. How can subscribers be called? How can we be sure
    our subscribers are unsubscribing correctly? Also, ordering cannot be guaranteed,
    especially when many asynchronous calls are being made. The combination of these
    factors can make event-driven programming a mess of dependencies.


    As you''ll find out in Chapter 14, many of the problems in using these constructs
    from complete time-only systems or the use of shared state. However, even ignoring
    these, we find that additional code must be written even for a single additional
    composable to be used. For this reason, imperative programmers often avoid these
    language features as they can add a significant amount of bulk to their program.
    Instead they try to write right code and use and paste as their primary form of
    code reuse.


    # MATHEMATICAL FUNCTIONS


    In functional programming, functions are considered first-class language constructs.
    Like mathematics, functions can be partially filled and assigned to variables.
    Functions can be passed into or returned from other functions. They can even be
    written inside of other functions sharing parents'' input variables.


    This makes writing code in F# more like math than other languages. Frequently
    compose functions out of other functions at runtime. You can push your data through
    the resulting function to obtain your result.


    Imagine designing in terms of the behavior of your object, which has been composed
    of other objects, you design in terms of the behavior of your function that has
    been composed of other functions. These ideas are fundamentally quite similar,
    but without constantly having to define objects, you generate much less structural
    code. Unlike objects, functions have immutable internal state. Given the same
    set of arguments, they always have the same behavior. This makes them much easier
    to test and significantly more likely to do exactly what you intended.'
