  md: '# Functions as First Class | 221


    Without some of the more advanced constructs like recursion, higher order functions
    provide little value other than syntactic sugar. Truly, it is the whole of the
    ideas presented in this part of the book that when used together make functions
    in the same way as other data types grants make functional programming so useful.


    One important idea to take away from this is that, like many functional programming
    constructs, higher order functions enable language-oriented programming. By leveraging
    them you can now accomplish much of what you would have previously needed a new
    compiler to.


    # Storing Functions


    Although it is possible to do a great deal with the ability to pass and return
    functions from other functions, storing functions in the same way gives more power.
    For example, this technique is often leveraged to reuse a partially applied function
    over and within the same scope.


    ```

    let processEach(data1, data2, data3) = =

    let transform = getData()

    let newData1 = transform data1

    let newData2 = transform data2

    let newData3 = transform data3

    (newData1, newData2, newData3);

    ```


    ```

    val processEachDataset(data: ''a'' * ''a'' -> ''a'' * ''a'')

    ```


    It is also possible to perform work with a set of functions that you have previously
    accumulated.


    ```

    let processDatasetWithCurrentTransforms data = =

    let transforms = getDataTransforms()

    let rec applyTransforms data transforms = =

    | [] -> data

    | thisTransform : otherTransforms ->

    applyTransforms(thisTransform data) otherTransforms

    applyTransforms data transforms;

    ```


    ```

    val processDatasetWithCurrentTransforms : ''a'' -> ''a''

    ```


    One particularly example of this is F#''s asynchronous workflows. With the Async
    module you can take a collection of functions and send them off to threads to
    execute with little code. Without the ability to pass into collections, powerful
    constructs like this would be impossible.


    # Creating Functions at Runtime


    The ability to pass and return functions from other functions is powerful alone.
    Generally enhancing this is the ability to create new functions at runtime.


    In F# this can be achieved in a number of ways that are useful for a wide range
    of practical applications. Closures provide the ability to bind variables out
    of the scope in which a function is defined. First-class functional composition
    is used to build new functions out of others.'
