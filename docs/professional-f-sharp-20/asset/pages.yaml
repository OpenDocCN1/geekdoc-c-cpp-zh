    \ list. When the Update method is called as a result of a mouse event, a new moving\
    \ average is calculated and the data value is updated.\n\n```\ntype internal MovingAverageModel(Chart\
    \ chart, slider slider)\n    // for animated data\n    let mutable List<SeriesDataPoint>\
    \ _sections = \n        new List<SeriesDataPoint>();\n    // stores the original\
    \ data\n    let mutable double _data = \n\\        // stores the moving average\
    \ range (window size)\n    let mutable _range = 1\n\n    member private this.MovingAverageSeries\
    \ movingAverage =\n        let title = String.Format(\"{0} Moving Average\", _range)\n\
    \        DataContext.ConvertSequenceToArea title movingAverage\n\n    member private\
    \ this.InitSeries =\n        chart.Series.Clear();\n        // generate moving\
    \ average using range and data\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_378_0.png)"
