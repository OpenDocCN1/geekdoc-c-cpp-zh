  md: "Partial application has many benefits. As you'll see in Chapter 17, it allows\
    \ functions to be composed much more readily. Also, you no longer need to pass\
    \ around a separate set of arguments along with your function. You can bake the\
    \ repeatedly used arguments right inside and just pass the partially applied function\
    \ around. This reduces the size of your code by making it unnecessary to build\
    \ container classes that contain only the repeatedly used inputs of a function\
    \ or class.\n\n# Currying\n\nIn F#, partial application is done through a process\
    \ called currying. A curried function is one that has been broken down into a\
    \ series of one parameter functions. When a parameter is passed in, another function\
    \ is returned the next parameter. When all parameters are filled in and the function\
    \ is executed. This occurs automatically for you in F#, but let's take a look\
    \ at what it looks like conceptually.\n\n```\n> explicitCurryTwoNumbers x =\n\
    \ function y = x + y\n```\n\n```\nval explicitCurryTwoNumbers : int -> int ->\
    \ int\n```\n\nHere we have a function that takes a single argument, x, and returns\
    \ another function of a different argument, y. This returned function has x captured\
    \ inside of it, for use later. The capturing of variables bound in a part is a\
    \ closure.\n\n```\n> plusOne = explicitCurryTwoNumbers 1;\n val plusOne : (int\
    \ -> int)\n > plusOne 2;\n val it : int = 3\n```\n\nAfter passing a value into\
    \ the function, the internal function is returned with x bound. This function\
    \ can then have another argument applied to it. This is done functionally equivalent\
    \ to the implicit curry in F#.\n\n```\n> addNumbers x y = x + y\n plusOne = addNumbers\
    \ 1;\n```\n\n```\nval addNumbers : int -> int -> int\n val plusOne : (int -> int)\n\
    \ > plusOne 2;\n val it : int = 3\n```\n\nAs you can see from the two examples\
    \ above, explicit currying requires an additional function for each parameter.\
    \ For example, three arguments would require two nested functions.\n\n```\n> explicitCurryThreeNumbers\
    \ x =\n function y = function z -> (x + y + z);\n```\n\n```\nval explicitCurryThreeNumbers\
    \ : int -> int -> int -> (Int -> int)\n```\n\nAlthough this is possible to do\
    \ in languages that don't support currying, simulating it with closures becomes\
    \ tedious quickly. You need to explicitly nest each function, and each time a\
    \ function is called, you are restricted to passing only a single argument at\
    \ a time. F# supports currying by default, so none of these steps are necessary."
