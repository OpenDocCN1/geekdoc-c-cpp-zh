  md: "F# does not provide for any sort of default parameter value, such as we find\
    \ in languages such as\n++, but much the same effect can be had via the use of\
    \ a defaultArg function defined somewhere\nwhere the member method can find it:\n\
    \n```\nmember p.OtherAlibi(?what : string, ?where : string,\n    ?when : System.DateTime,\n\
    \    ?why : string)\nlet defaultArg x = match with None -> y Some(v) -> v\nlet\
    \ wht = defaultArg what \"nothing\"\nlet whr = defaultArg where \"replace\"\n\
    let whn = defaultArg when System.DateTime.Now\nlet why = defaultArg \"of no reason\"\
    \nSystem.String.Format(\"{0} did {1} {2} because {3}\",\np.FullName, why, whr,\
    \ whn);\n```\n\nCode snippet Class.fs\n\nWhen invoking optional argument names,\
    \ the Option value (Some x or None) can be explicitly\nby prefixing the named\
    \ argument with a a, just as it is declared:\n\n```\nlet alibi = p.Alibi(\"relaxing\"\
    , in the sitting room,\n?why=Some(\"I'm tired\"),n?when=System.DateTime.Now);\n\
    ```\n\nNote that, of course, method parameters can also be explicitly declared\
    \ as Option types, without\nresorting to the supposed syntax. In F# developers\
    \ will again want to choose one of\ntwo syntaxes and be consistent, least within\
    \ a single class, module, or assembly.\n\n# STATIC MEMBERS\n\nDeclaring a member\
    \ to be static (that is, a member that is not associated with any particular instance\
    \ of\ntype is strikingly similar to how it is done in other languages: a modifier,\
    \ static, appears before\nthe member definition. Non-self prefix is placed on\
    \ the member, because the member\nis not associated with any instance of the type\
    \ and therefore needs no identification.\n\nProperties can be declared as static,\
    \ as in can methods:\n\n```\n<Class>\ntype Skynet() =\n    static member CreateTerminator()\
    \ =\n        new Person(\"T\", \"800\", 0)\n    static member AfterJudgmentDay\n\
    \    get() =\n        let jd = new System.DateTime(1997, 8, 29)\n        System.DateTime.Now.ToBinary()\
    \ > jd.ToBinary()\n```\n\nAccessing a static property is just as easy as it is\
    \ for other .NET languages, prefixing the method or\nproperty with the type name:\n\
    \n```\nlet T800 =\n```"
