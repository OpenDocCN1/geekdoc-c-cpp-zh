  md: "# # Modeling the Domain\n\nIf we are going to have a weather forecasting site,\
    \ it will probably we need to have a model that covers different types of possible\
    \ weather. Such a model might start as follows:\n\n```\nnamespace FSharpBook.Models\n\
    type SkyType =\n    Sunny\n    Overcast\n    PartlyCloudy\n    Snow\n    Rain\n\
    \    Hurricane\n    Zombies\n```\n\nSkyType is a discriminated union that represents\
    \ different types of weather that are possible. Others may be added, but this\
    \ is a good initial list that allows a developer to know whether a parka is needed.\
    \ Others could be added (that is, PartlySunny, Showers, and so on), but the current\
    \ set should be enough for a relatively simple site.\n\nOf course, it is not enough\
    \ to give an indication of temperature, knowing just because it is sunny, it does\
    \ not mean that a coat isn't needed. Without a temperature, it could be sunny,\
    \ but bone chilling -30 degrees outside. It would also be useful to know the location\
    \ of our forecast, in the same file. ForecastLocation\n\n```\ntype Forecast =\
    \ { (Location:string; AverageTemperature:double; Skies:SkyType )\n```\n\nTo implement\
    \ a simple forecast as asked for in the user story, a simple record type with\
    \ Location, AverageTemperature, and Skies will determine whether it will be and\
    \ how hot or cold it will be.\n\nOf course, something is needed that will provide\
    \ a means to get a forecast, for a repository to be created from which forecast\
    \ can be obtained.\n\nIt's not just what the model does, but it is also what the\
    \ model does not. It is not doing any work to retrieve forecast data from outside\
    \ sources - that is a concern for the repository. Nor does it care about how anything\
    \ is rendered - that is a concern for the view - not the model. The only things\
    \ that belong in the model are considerations about how it is going to internally\
    \ represent weather, and any behavior that might be added. For example, behavior\
    \ can be added to Forecast which allows it to return something that specifies\
    \ what kind of attire the fol- user might be interested in wearing:\n\n```\ntype\
    \ Attire =\n    Bikini\n    Normal\n    LightJacket\n```"
