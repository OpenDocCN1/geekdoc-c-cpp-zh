  md: "# # Abstract Members\n\nFrequently, a base type want to ensure that derived\
    \ types create behavior specific to them — in F#, this is done via the abstract\
    \ keyword, and requires a slightly different syntax than has been seen so far.\
    \ Specifically, designating a member as abstract requires the type of descriptor\
    \ to be provided, in which the case of a method is its method signature:\n\n```\n\
    <Class>\ntype Person(fn, ln, a) =\n    Inherit System.Object()\n    new() = Person(\"\
    *\", 0)\n    member p.FirstName = fn\n    member p.LastName = ln\n    member p.Age\
    \ = a\n    member p.Greet(other : Person) =\n        Console.WriteLine(\"Howdy,\
    \ {0}, from {1}!\",\n        other.FirstName, p)\n    override p.ToString() =\n\
    \        let typename = base.ToString()\n        System.Format(\"{3}: {0} ({1})\"\
    ,\n        fn, ln, \"*\")\nabstract work : -> unit\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_185_0.png)\n\
    \nThe syntax for a member is slightly different than might be expected — as with\
    \ most languages, it describes the parameters and return type of the member, but\
    \ instead, comma-separated lists of parameters wrapped by parentheses (as is seen\
    \ in C#), F# uses an arrow-based notation, with each parameter separated by a\
    \ right-arrow and the type appearing at the end of the notation.\n\n> This arrow-based\
    \ notation is keeping in F#'s historical roots, namely that of the ML language.\
    \ Interested readers can either read Ullman's ML Programming Language for why\
    \ this syntax makes sense, flip forward to the discussion on methods in Chapter\
    \ 3.\n\nIf the type defines a method, such as the previous example, then this\
    \ type must be marked with the AbstractClass attribute instead of the Class attribute.\
    \ In addition to marking the class with an abstract member at the CLR level, the\
    \ F# compiler and .NET prevent runtime instantiation of all abstract methods before\
    \ they are overridden method implementation can be instantiated.\n\n```\n<AbstractClass>\n\
    type Person(fn, ln, a) =\n    Inherit System.Object()\n    new() = Person(\"*\"\
    , 0)\n    member p.FirstName = fn\n    member p.LastName = ln\n    member p.Age\
    \ = a\n    member p.Greet other : Person =\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_185_1.png)"
