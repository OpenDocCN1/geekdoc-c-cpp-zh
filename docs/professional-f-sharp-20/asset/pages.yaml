  md: "Sequences have broad application just beyond the computation of numbers, particularly\
    \ anywhere a stream of data instances from outside the program itself is the principal\
    \ data item. For example, developers frequently iterate through a directory or\
    \ series of directories looking for files of a particular type for processing.\
    \ If we consider the file itself to be the data item in question, then the directory\
    \ or set of directories becomes the scaffolding for the sequence:\n\n```\n```fsharp\n\
    let di = new System.IO.DirectoryInfo(dir)\nseq ( for fi in di.GetFilesInfo() ->\
    \ fi )\n```\n```\n\nThis makes easy to get to all the files in the root directory\
    \ on the system:\n\n```\n```fsharp\nlet rootFiles = dir \"C:\\\"\n```\n```\n\n\
    Now, course, given the sequence, it becomes trivial to walk through these files\
    \ and display their names:\n\n```\n```fsharp\nlet printInfo (fi : System.FileSystemInfo)\
    \ =\n    System.Console.WriteLine(\"{0}\", fi.FullName)\nfor fi in rootFiles do\
    \ printInfo fi\n```\n```\n\nBut the real power of the sequence comes again in\
    \ its laziness; normally to build a list of all the files on the system requires\
    \ to do a burst of I/O gathering all the data required, but if a sequence is instead\
    \ of an ordinary list, no I/O is performed until the developer starts to look\
    \ through them:\n\n```\n```fsharp\nlet recursive di = new System.IO.DirectoryInfo(dir)\n\
    {\n    for fi in di.GetFiles() do yield fi\n    for sd in di.GetDirectories()\
    \ do\n        yield! recursive(sd.FullName)\n}\nlet allFiles = recursive \"C:\\\
    \"\nfor fi in allFiles do printInfo fi\n```\n```\n\nA couple things are happening\
    \ simultaneously: the sequence is being built from two sources, rather than using\
    \ the single source expression that has been demonstrated so far, and two, we\
    \ use the yield keyword to yield back a sequence into the sequence, essentially\
    \ appending the results of that (recursive) obtained sequence to the one being\
    \ generated. This second sequence, the one generating an additional sequence,\
    \ must be the last expression in the sequence block. Any number of item-generating\
    \ expressions can be used prior to that, however,\n\nLike the array and list types,\
    \ the sequence has a large number of functions defined in the Seq module and can\
    \ be thought of in a few grouped categories which are described next:\n\n# Seq\
    \ \"Meta\" Functions\n\nThese functions, like those listed for the Array module,\
    \ manipulate lists rather than the contents within them. In general, these functions\
    \ create or sequences, or do something to the sequence as a whole, in the same\
    \ way that the functions described in the Array section do. There is a great deal\
    \ of duplication here so that the F# programmer familiar with how operation works\
    \ on an array knows how operation will work on a sequence, and"
