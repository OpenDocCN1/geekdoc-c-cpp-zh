    \n+   - The arrow (->), separating the match class from the expression to execute\
    \ if the match class succeeds\n\nAs is consistent with F#'s syntax, the underscore\
    \ (_) character acts as a wildcard when used: anything that doesn't match preceding\
    \ clauses will match against this one.\n\nNote that unlike the switch/case imperative,\
    \ the pattern-match is an expression, meaning that it, yields a value when evaluated:\n\
    \n```\nlet y = match x\n| _ > 24\n| _ -> 36\n```\n\nThis means that the various\
    \ classes in the pattern-match must all compatibly typed values, just as the if/then\
