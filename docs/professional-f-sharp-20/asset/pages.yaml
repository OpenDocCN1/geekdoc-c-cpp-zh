  md: "# Constructors\n\nRecall from the object-oriented world that a constructor\
    \ is a method invoked at the time that the object instance is being created, with\
    \ the intent of initializing the object instance with the necessary data it requires\
    \ to function properly. A good object-oriented citizen, F# naturally provides\
    \ for the definition of constructors, using the new keyword and a parameter list\
    \ of type-infused parameters.\n\n```\n<Class>\ntype Person =\nval firstName :\
    \ string\nval lastName : string\nnew (fn, ln) = { firstName = fn; lastName = ln\
    \ }\n```\n\nFrequently, a class wants more than one constructor, and so as the\
    \ constructor signatures are differentiated from one another in number or type\
    \ from one another, the class can have as many constructors as it wants:\n\n```\n\
    <Class>\ntype Person =\nval firstName : string\nval lastName : string\nnew ()\
    \ = { firstName = ''; lastName = '' }\nnew (fn, ln) = { firstName = fn; lastName\
    \ = ln }\n```\n\nAs is often the case, one constructor will want to \"chain\"\
    \ into another one, reducing the potential for duplicated logic within constructors.\
    \ In F#, this is done like this:\n\n```\n<Class>\ntype Person =\nval firstName\
    \ : string\nval lastName : string\nnew () = Person('', '')\nnew (fn, ln) = { Person();\
    \ firstName = fn; lastName = ln }\n```\n\nIf a constructor (like the no-argument\
    \ constructor previously defined) wants to do some additional logic after the\
    \ chained-constructor call, this is done by appending the keyword then and defining\
    \ a properly indented block of code:\n\n```\n<Class>\ntype Person =\nval firstName\
    \ : string\nval lastName : string\nnew () = Person('', '') then\n    System.Console.WriteLine(\"\
    In Example ctor\")\nnew (fn, ln) = { Person(); firstName = fn; lastName = ln }\n\
    ```"
