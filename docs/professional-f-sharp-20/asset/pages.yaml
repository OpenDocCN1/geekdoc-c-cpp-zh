    To turn it off, simply type the command again.


    ```

    > time;

    ```


    ```

    -- Timing now off

    ```


    However, as not optimizations are available for F# interactive, it is always best
    to ultimately use a profiler on Release generated assemblies to find areas of
    slow performance. At best, the #time feature can give you a general idea.


    As testing every line of code written in this way would be tedious and time-consuming,
    it is important to understand the underlying implementation and performance characteristics
    of each of the basic F# data structures. For the sake of convenience, I will expand
    upon what was previously stated in Chapter 7.


    # Lists


    F# lists are immutable linked lists and are designed for left-to-right access.
    Head and iterative access are always O(1). However, indexing to a particular element
    is O(n), where n is the number of the node in the list. For this reason, F# Lists
    are best used with iterative iterative operations only. Frankly, functional programming
    is largely oriented toward the iterative processing of data and, due to their
    immutability and data sharing, lists are often your best choice.'
