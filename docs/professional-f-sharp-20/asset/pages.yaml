    # SUMMARY


    F# has a similar set of basic types to that of other CLR-based languages, with
    some slight differences in syntax and semantics, and some extended types that
    the traditional CLR languages (C#, Visual Basic) don''t have directly. Many of
    these additional types were originally created to support “math/science” language
    but turn out to be useful in the general programming space as well; for example,
    bigint will be useful in accounting applications, and both decimal and bigum will
    have particular application for monetary calculations and high-precision mathematics.


    F# developers can also find the units-of-measure capabilities within the language
    to be helpful anywhere real-world calculations are done — obviously mathematical
    calculations, such as those routinely done in physics (either simulators or guidance-control
