  md: 'The preceding code dictates that the Index is asked for, provide a default
    view for that index. Note that the member must always have the () attached to
    indicate the framework that will call the routine that there are zero parameters
    — as it is common to leave off the parents in pure F# programs, the framework
    expects the signature to be a proper zero parameter member and will not map properly
    without the parents.


    # The DoQuery Action


    Of course, it would be useful to actually use some code that does something. The
    Submit action, the second written in this example, will perform that role.


    When the form is submitted, by the Index page, or in theory, any page that has
    a form that posts to the Submit action of the Forecast controller, there are couple
    of options. One naive approach many use is to simply do the work right on the
    submit action, returning a View that renders the forecast. Although this approach
    is simple, it causes the great annoyance of the type message shown in Figure 21-1.


    ![](img/3b6b83f504d0e46470b40dafe9ce1960_356_0.png)


    FIGURE 21-1


    To get around this, the form processor is going to implement what is often called
    the PRG Pattern. PRG stands for Post, Redirect, and Get. This has a couple of
    advantages — one is that it gets away from having the browser complaining that
    it is going need to re-post the form. Another which, probably more compelling
    than that, is that it allows separation of form processing from the view rendering
    is the result of that processing. To implement a PRG pattern is actually quite
    simple:


    ```

    member ForecastController Submit(locationQuery:string) =

    var rd = new RouteValueDictionary()

    rd.Add("locationQuery", locationQuery)

    return RedirectToAction("for", "forecast", rd);

    ```


    A controller always takes a locationQuery as a parameter. This may be a field
    from some form that posted to this page, but how it looked on such a form does
    not really matter to the controller — the controller needs to know that by the
    time it is called, mapped in properly. What is needed is to create a redirect
    to the controller and action that is actually going to render the result.


    One unique to do that is to create a RouteValueDictionary object that has the
    parameter. The first two lines of the method will create the dictionary and add
    the item that accomplish that goal. The third line is to RedirectToAction, a method
    on the Controller base class that knows how to redirect a new GET request based
    on an action, a controller name, and optionally, a RouteValueDictionary that holds
    the parameters.'
