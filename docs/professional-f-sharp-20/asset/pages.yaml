  md: 'At the lowest level there is the humble JMP instruction from which you must
    construct your list from scratch; at higher level languages this is analogous
    to the goto statement. At a slightly higher level of abstraction there is the
    while statement which, in exchange for some flexibility where you jump to, over
    until something is met much clearer than this concept which is built behind iteration.
    Furthering this exchange of flexibility for clarity is the for statement that
    gives a direct way to express iteration.


    Then, at the highest level of imperative iteration, there is the foreach statement.
    The foreach statement is clear and concise but lacks much of what for can do.
    In fact, the difficulty in using foreach for things other than explicit iteration
    is what makes it so clearer. You sacrifice the ability to determine ordering and
    skip elements to glance at small chunk of very expressive code and immediately
    understand what it.


    So, imperative languages offer a one-dimensional and increasingly restrictive
    set of options for controlling execution flow. On one side of the spectrum, there
    is the goto statement, and on the other the restrictive foreach statement.


    On the other hand, functional programming offers a much richer set of tools. And
    on the other a profession of higher order functions project outward. These functions
    have names filter, map, reduce, and fold. Although similar to foreach in clarity
    of expression, each is used to elegantly express ideas.


    # MODULE FUNCTIONS


    Unlike the .NET libraries, where modification of data structures is most performed
    by calling class methods on a specific data structure, FB provides static methods
    for each data structure. In the vast majority of cases these module functions
    do not modify their parameters; instead, they return a fresh data structure to
    which the modification has been performed.


    In this chapter, the many of the collection functions will be discussed. It is
    important to note that not every construct discussed here applies and works exactly
    the same way with every data structure. For example, the select will work with
    List and Array will perform operations immediately.


    The goal is to give you a comprehensive guide to module functions and more to
    give you the knowledge necessary for understanding the classes of problems they
    solve, how to use them to solve these problems, and an understanding of the jargon
    used in the language documentation.


    # COLLECTION SUBSETS


    Subset functions are used to find the parts of an existing collection that satisfy
    some predicate. A predicate is a simple function that takes an instance of some
    type and returns true or false based on some criteria. In these cases, the predicate
    function must take the same type as elements of the collection. Because of their
    simplicity, they are an ideal place to start when learning about list processing
    with higher order functions.'
