    # What Isn''t Supported


    One of the reasons the library can be as simple as it is that it is explicitly
    stateless. There is no change tracking, no concept of detach, and no pretense
    that the library is something other than a means to act as a producer or consumer
    of F# record types. Other things that make traditional ORM systems complex, such
    as configuration files, mappings, and base classes to inherit from, are avoided
    in favor of simplicity and predictability in terms of how it works.


    # Coming Soon


    At the time of this writing, there are some features that have yet to be implemented
    but should be complete by the time of publication. Support for stored procedures,
    inner joins, and a broader set of predicate types are in the works. Progress on
    this project can be found at http://github.com/ericks/far.


    # HOW FAR WORKS


    One of the principles of being a good software developer is to have at least some
    level of understanding about how the libraries work. As such, this section explores
    the internals of the FAR library.


