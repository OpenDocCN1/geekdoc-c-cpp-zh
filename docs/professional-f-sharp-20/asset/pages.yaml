  md: 'against. For these reasons, if your lambda expression is longer than one or
    two lines, it is often bet-

    ter to define it in a separate function instead.


    # Composition with Partial Application


    As previously discussed, currying allows you to partially compose functions by
    applying some

    of the parameters a function requires. In the case of the derivative example,
    you can use partial

    application to build a derivative function without closures. Consider the following
    example:


    ```

    let calcApproxDerivative f dx x = (f(x + dx) - f(x - dx)) / 2.0 * dx

    let square (x: float) = x * x

    let derivativeOfSquare = calcApproxDerivative square 0.001;

    ```


    So, while not quite as flexible as closures, in many cases it is possible to leverage
    partial application

    to do the same thing.

    Given this function already exists, we can use partial application to build a
    specific derivative

    function quite easily.


    # SUMMARY


    Your first task in getting accustomed to F# is to get a handle on the type inference
    system. It''s not

    difficult; you just have to learn how the type inference system makes the decisions
    it does. When

    things go wrong, use Visual Studio to mouse over your value and check out its
    inferred type. It will

    soon obvious where type annotations are needed.


    Next, try playing with closures, partial application, and lambda expressions.
    Although entirely

    avoidable in C# and VB.NET, one of the most important steps in getting familiar
    with F# is becom-

    used to treating functions as first-class citizens.


    These ideas are much different than what you have been used to use in idiomatic
    C#. Becoming adept at

    leveraging these constructs primarily requires practice. Don''t be afraid to try
    out in the inter-

    active window and see what happens.'
