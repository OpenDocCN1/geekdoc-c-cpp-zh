  md: "You can use the open statement at a variety of scopes, because because the\
    \ effects of the statement are felt only after its point of use, some idiomatic\
    \ F# use that all such open statements should appear at the top of the F# source\
    \ file or script.\n\nAs with most .NET languages, when a namespace has been referenced\
    \ via the open statement, the namespace prefix can be left off the typenames when\
    \ used:\n\n```\nConsole.WriteLine(\"Much shorter, thank you\");\n```\n\nLike many\
    \ other .NET languages, F# auto-opens use a number of different namespaces on\
    \ behalf of the F# programmer, because the types in namespaces are considered\
    \ to be so common requiring F# programmers to open them manually would be a nuisance.\
    \ As a result, F# has a \"silent\" list of opens at the top of the file, as the\
    \ developer has written:\n\n```\nopen Microsoft.FSharp\nopen Microsoft.FSharp.Core\n\
    open Microsoft.FSharp.Core.LanguagePrimitives\nopen Microsoft.FSharp.Core.Operators\n\
    open Microsoft.FSharp.Text\nopen Microsoft.FSharp.Collections\nopen Microsoft.FSharp.Core.ExtraTopLevelOperators\n\
    ```\n\nMost obviously missing from this list are any of the common .NET Framework\
    \ Class Library namespaces, such as System.\n\n# Defining a Namespace\n\nBecause\
    \ namespaces serve as a mechanism for partitioning similarly named classes away\
    \ from one another and preventing name conflicts, it's important for the F# developer\
    \ to also define namespaces in which to define their own types. Doing so in F#\
    \ is surprisingly easy — namespace followed by namespace opens a new namespace,\
    \ and that namespace remains open until replaced by a new namespace declaration.\
    \ The lack of a namespace declaration does not imply that the code is defined\
    \ in an \"empty\" namespace — more on this in a moment.)\n\nThus, defining a Person\
    \ in the namespace Examples would look like:\n\n```\nopen System\n\ntype Person(fn\
    \ : string, ln : string, a : int) =\n    member this.FirstName = fn\n    member\
    \ this.LastName = ln\n    member this.Age = a\n    override this.ToString() =\n\
    \        String.Format(\"{0} {1} is ({2} years old\",\n            this.FirstName,\
    \ this.LastName, this.Age)\n\nnamespace Examples\n\ntype Student() =\n    override\
    \ this.ToString() = \"Student\"\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_208_0.png)"
