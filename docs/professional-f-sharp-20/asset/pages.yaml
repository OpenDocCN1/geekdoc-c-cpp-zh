  md: '# FOREWORD


    There''s Left, Right, and there''s Center. There''s peanut butter, chocolate,
    and then there''s peanut butter cups. C#, Visual Basic...and now there''s F#.
    There have always been effectively only two choices for programmers that target
    .NET, and for many there''s no object-at all. Take a look at F#. It''s a functional
    language, to be clear, but it''s also object-oriented and a bridge between two
    worlds. It''s the goodness of a peanut butter cup, and more.


    When the get-er-done programmer hears names like Scheme, OCaml, Haskell, Erlang,
    and F#, these languages conjure visions of crazy-eyed computer scientists and
    bearded hermits. You can''t expect to really sell software written in these languages
    more than John Grisham can sell a legal mystery written in Latin, right? That''s
    madness.


    Actually not F# needs to be a tool in your toolbox. Imagine not thinking about
    variables changing their value. Imagine no global state and no side effects. Imagine
    not worrying about deadlocks and race conditions because you aren''t using any
    locks. Consider not just testing your application but proving that it works and
    is able to count on it.


    F# reminds us that writing state code in a procedural language for a machine that
    has 12 cores is, well, freaking hard to get right. F# reminds the .NET programmer
    that there is life beyond the procedural. F# gives you this, and the familiarity
    of the .NET runtime and Base Class Library that you already know how to use on
    Windows, but also on Xbox 360, Silverlight, and Mono Linux.


    There''s another way of thinking out there and it''s functional. This today''s
    book is about F#. It''s clear, code-focused, realistic, and pragmatic. This is
    a real language that you can solve problems with. Hope you enjoy reading this
    book as much as I did.


    > — SCOTT HANSELEN

    Principal Manager Lead

    —Server and Tools Online - Microsoft'
  merge: -1
