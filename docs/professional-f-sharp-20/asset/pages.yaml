  md: "# 9\n\n# Inheritance\n\nWHAT'S IN THIS CHAPTER?\n\n+   - Understanding inheritance\
    \ in F#\n- Understanding field and constructor invocation\n- Using casts\n- Defining\
    \ and using interfaces\n- Applying object expressions\n\nWithin the object-oriented\
    \ parlance, inheritance is frequently used to mean inheritance, where a given\
    \ type can express a relationship to another type, effectively importing all the\
    \ data and behavior of parent type. Originally thought (in Smalltalk and C++)\
    \ to be a staple of the object-oriented design process, then later criticized\
    \ and revamped to split into implementation and interface inheritance in languages\
    \ such as Java and C#, inheritance nonetheless represents a powerful and useful\
    \ technique for not only expressing relationships between types, but also in ensuring\
    \ that behavior relating to a group of types remains defined in precisely one\
    \ place. As a full-fledged member of the object-oriented family of languages,\
    \ F# offers full support for inheritance between types, with the additional \"\
    twists\" that come with a new language.\n\n# BASICS\n\nAssume that there is a\
    \ base type in F# (or, if wanted, in another .NET language), something along the\
    \ lines of:\n\n```\n<Class>\ntype Person(fn, in, ai) =\n  member p.FirstName =\
    \ fn\n  member p.LastName = in\n  member p.Age = a\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_178_0.png)"
  merge: -1
  pgno: 178
- img_proc: true
  md: "We can define a new type that inherits from this base type by referencing it\
    \ in the opening lines of\nthe derived type:\n\n```\n<Class>\ntype Student(fn,\
    \ ln, a, sub, sch) =\n  :inherit Person(fn, ln, a)\n  member p.Subject = sub\n\
    \  member p.School = sch\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_179_0.png)\n\
    \nCode snippet Inheritance.fs\n\nThis establishes an IS-A relationship between\
    \ the derived type and the base type, such that any\nmembers defined on the base\
    \ type are also accessible in the derived type, in addition to those mem-\\ders\
    \ defined on the derived type, as expected:\n\n```\nlet s = new Student(\"Ted\"\
    , \"Pattison\", 50, \"Beer\",\n  \"DevelopMentor\"\n  System.Console.WriteLine(\"\
    \ (0) attends (2) and studies (3)\");\ns.FirstName, s.LastName, s.School, s.Subject\n\
    ```\n\nBy default, as is the norm for any language running on the .NET framework,\
    \ if a class does\nnot explicitly define an inheritance relationship, it inherits\
    \ from the ultimate base class, System.\nObject. This means that every type in\
    \ F#, every type defined in C# or Visual Basic, ultimately\nextends its base type,\
    \ either directly or indirectly through its parent type.\n\nAny type that derives\
    \ from a base type can be used where a base type is expected, and this serves\n\
    as basis for classic object-oriented polymorphism. Normally, F# inference can\
    \ make this\nless obvious than what is seen in other object-oriented languages,\
    \ but type descriptors can make this\nrelationship more obvious:\n\n```\n<Class>\n\
    type Person(fn, ln, a) =\n  member p.FirstName = fn\n  member p.LastName = ln\n\
    \  member p.Age = a\n  :inherit (Person) =\n  System.Console.WriteLine(\"Howdy\"\
    , (0), from (1)\");\n  other.FirstName, p.FirstName)\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_179_1.png)\n\
    \nCode snippet Inheritance.fs\n\nAdding a Student in for the expected Person works\
    \ as:\n\n```\nlet s = new Student(\"Ted\", \"Pattison\", 50, \"Beer\",\n  \"DevelopMentor\"\
    )\nlet p = new Person(\"Ted\", \"Neward\", 38)\n  p.Greet(s)\n```\n\nNote that,\
    \ previously mentioned, the base type could easily be defined in C# or Visual\
    \ Basic\nand the derived type in F#, or versa. With little restriction, inheritance\
    \ is free to operate across\nanguage lines in the CLR."
