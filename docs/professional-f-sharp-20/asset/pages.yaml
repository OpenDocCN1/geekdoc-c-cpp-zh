  md: '# Visual Studio Project Templates | 363


    The XAML file includes a code-bind in a similar fashion to Web Forms. The XML
    is used to declare the graphical components such as buttons and charts and important
    attributes including name and type.


    Examining the XAML for MainPage.xaml created in the previous section reveals:


    ```

