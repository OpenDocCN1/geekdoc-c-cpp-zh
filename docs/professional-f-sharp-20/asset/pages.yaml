  md: '# Basic Composition and Pipelining | 273


    some delegate, and then add them to a generic collection defined to take their
    shared underlying type. You could then loop over this collection, applying each
    of these transformations to the result of the previous in turn.


    The great benefit of this approach is that a series of operations can be defined
    dynamically at runtime. However, this methodology has a severe limitation. With
    this approach, each transformation must take and return the same type. A single
    change in type means that the processing class or delegate can''t be added to
    your collection.


    Another might be to perform operations as you previously saw with pipelining.
    The result of each function call passed directly into the next, which eventually
    ends providing you with the result you need. The equivalent to this in object-oriented
    languages would be chaining the result of many static methods.


    With this approach, you''ve solved the problem of composing operations of different
    types. However, as pipelining step or static method is compiled into place and
    can''t be changed, you''ve given the ability to define which operations are used
    at runtime.


    In F#, you have both of these properties through a feature known as function composition.
    The composition operators allow you to combine any two functions with compatible
    type signatures into one without executing either. Among many other things, this
    allows you to build a large collection of data transformation functions at runtime
    and use many different intermediate-types.


    # Forward Composition (>>)


    The forward composition operator takes two functions and composes them into a
    single function in which the left is applied to the input and the right is applied
    to the result of that. Although simple conceptually, this operator can profoundly
    change what your code can do.


    Take a look at how composition can be used in the example from forward pipelining.


    ```

    > findNamesOfPlacesOverMillionInUppercase =

    > List.filter (fun p -> p.Population > 5000000)

    > List.map (fun p -> p.Name.ToUpper());


    val findNamesOfPlacesOverMillionInUppercase : (Place list -> string list) = string
    list


    val it : string list = {"NEW YORK", "TOKYO"}

    ```


    Taking a deeper look at the actual composition, you see the partially applied
    filter and map functions combined into a single function that takes the type of
    the first function as input and returns the type of the second.


    ```

    > List.filter (fun p -> p.Population > 5000000));


    val it : (Place list -> Place list) = <fun:it@16-8>


    > List.map (fun p -> p.Name.ToUpper());


    val it : (Place list -> string list) = <fun:it@17-10>

    ```'
