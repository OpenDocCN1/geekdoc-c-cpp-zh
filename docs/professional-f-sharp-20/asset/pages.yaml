    This is just one example of many things you can do to process XML. The following
    methods can also be called to provide various means of processing the XML tree.


    | Method | Purpose |

    | --- | --- |

    | Add | Adds the specified content as a child |

    | AddAfterSelf | Adds the specified content immediately before this node |

    | AddAnnotation | Adds an object to the annotation list |

    | AddBeforeSelf | Adds the specified content immediately before this node |

    | AddFirst | Adds the specified content as the first child |

    | Remove | Removes this node from its parent |

    | RemoveAll | Removes all nodes and attributes |

    | RemoveAnnotations | Removes all annotations |

    | RemoveAttributes | Removes all attributes |

    | RemoveNodes | Removes all nodes |

    | ReplaceAll | Replaces the child nodes and the attributes of this element with
    the specified content |

    | ReplaceAttributes | Replaces the attributes of this element with the specified
    content |

    | ReplaceNodes | Replaces the children nodes with the specified content |

    | ReplaceWith | Removes this node with the specified content |

    | SetAttributeValue | Sets the value of an attribute, adds an attribute, or removes
    an attribute |

    | SetElementValue | Sets the value of a child element, adds a child element, or
    removes a child element |

    | SetValue | Sets the value of this element |


    http://msdn.microsoft.com/


    Of course, the standard warning about programming with side effects is true for
    any code you are mutating the XML document using these methods. Using these methods
    with async flows or any other technology like PLInq that do the operations in
    a different order can result in bugs that are hard to re-create.'
