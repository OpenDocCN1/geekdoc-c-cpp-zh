  md: "# LEVERAGING THE DOMAIN MODEL\n\nOne of the nice things about domain models\
    \ is that they can easily be reused in different contexts. The forecast domain\
    \ model was previously used in the context of an ASP.NET MVC website in Chapter\
    \ 21. The domain model was expressed as follows:\n\n```\nnamespace FSharpBook.Models\n\
    type SkyType =\n    Sunny\n    Overcast\n    PartlyCloudy\n    Snow\n    Rain\n\
    \    Hurricane\n    Zombies\n\ntype Forecast = ( Location:string; AverageTemperature:double;\
    \ Skies:SkyType)\n\ntype Attire =\n    Bikini\n    Normal\n    LightJacket\n \
    \   Coat\n    Raincoat\n    BodyArmor\n\ntype Forecast with\n    member ToAttire()\
    \ =\n        match forecast.AverageTemperature,forecast.Skies with\n        |\
    \ temp,sky when temp > 75.0 && sky = Sunny | sky = PartlyCloud -> Bikini\n   \
    \     | temp,sky when temp > 65.0 && sky = Sunny | sky = PartlyCloud -> Normal\n\
    \        | temp > 45.0 && sky = Sunny | sky = PartlyCloud -> LightJacket\n   \
    \     | _ -> Raincoat\n        | temp when temp < 20.0 -> Parka\n        | _ ->\
    \ Coat\n        | _ -> Parks\n        | _ -> BodyArmor\n        | _ // in doubt,\
    \ the updates would be to wear a coat...\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_385_0.png)\n\
    \n> Code snippet ForecastModel.fs\n\nThe preceding model constitutes the recommendation\
    \ engine that the service will provide an interface to. In a sense, all that is\
    \ doing is replacing the user interface in the context of an ASP.NET MVC website\
    \ with a system interface that will provide the same information.\n\nIt is worth\
    \ noting that the ability to reuse a model from the previous example in the MVC\
    \ context is a big reason why wishing true to the principle of separation of concerns\
    \ is so important. Had things like HttpRequest objects slipped into the model,\
    \ or worse, tied the model to specific types of presentation logic, it would have\
    \ required significant rework to reuse the model. Moreover, if someone wanted\
    \ to update the model, the updates would have to be done in two places. Very bad\
    \ indeed!"
