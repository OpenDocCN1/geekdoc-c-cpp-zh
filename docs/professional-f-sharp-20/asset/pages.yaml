    PartlyCloudy -> "Partly Cloudy"

    Snow -> "Snow"

    Rain -> "Rain"

    HHurricane -> "Hurricane"

    Zombies -> "OH NO! ZOMBIES!!!"

    ```


    ```

    let Attire attire =

    match with

    Bikini -> "Bikini"

    Normal -> "Normal"

    LightJacket -> "Light Jacket"

    Coat -> "Coat"

    Raincoat -> "Raincoat"

    Parka -> "Parka"

    BodyArmor -> "Body Armor"

    ```


    The preceding code converts types into strings for ease of consumption on the
    client. Of course, it is conceivable that future versions of the service could
    specify a preferred culture for results to be rendered in. Where that happen,
    it would simply mean that these methods take a parameter, and likely, look up
    the appropriate string in a resource file.


