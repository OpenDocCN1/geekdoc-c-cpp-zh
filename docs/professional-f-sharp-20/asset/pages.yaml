    # SUMMARY


    This chapter leverages the powerful capabilities of F# to build rich, dynamic,
    and responsive Silverlight applications. Currently the tools are limited for F#
    Silverlight Application templates, but a C# or VB Silverlight Application template
    can be used to delegate all the important code to a F# Silverlight Library. Because
    Microsoft has implemented the FSharp.Core.dll (the F# runtime) for Silverlight,
    F# code can run in a multitude of browsers on multiple operating systems including
    Macintosh OS, Firefox, and Google Chrome browsers. Silverlight is a flexible application
    framework for both Public Web and Enterprise applications. Because Silverlight
    is a client-side technology, it can be easily deployed on any web server, including
    Linux and UNIX-based systems. As long as the users have installed the Silverlight
    plug-in in their browser, they can take advantage of all the power it offers.
    That is why Silverlight has been used for everything from the broadcast of the
    Olympics to real-time dashboards for financial advisors. Together F# and Silverlight
    make a powerful pair.'
