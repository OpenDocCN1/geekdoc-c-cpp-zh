  md: "# Subscribing\n\nThe easiest way to interact with an event is to register with\
    \ an existing event, such as those exposed by various parts of the .NET Framework\
    \ Class Library — one such event is the ProcessExit event, on the AppDomain type,\
    \ which is fired whenever the process in which the AppDomain is being hosted exits.\
    \ For more on AppDomains and their relationship to processes, see http://msdn.microsoft.com/en-us/library/system.appdomain.aspx.\n\
    \nObtaining the AppDomain is no more difficult than calling the appropriate static\
    \ property on the AppDomain class:\n\n```\nlet ad = System.AppDomain.CurrentDomain\n\
    ```\n\nWhen the AppDomain has been retrieved, however, registering with the ProcessExit\
    \ requires a delegate instance — which wraps a method that takes an object and\
    \ an event as parameters and returns nothing, F# has to wrap it into a delegate\
    \ instance.\n\nNormally, the F# developer will not need explicit delegates, for\
    \ two reasons. First, because the F# language functions as first-class citizens\
    \ (as shown in Chapter 13), less need arises to wrap a method in a delegate instance\
    \ to pass it as argument, as is common in idiomatic C# and Visual Basic. Second\
    \ and more important, however, because the F# language was created to have full\
    \ fidelity and awareness of the underlying CLR platform, the F# compiler will\
    \ automatically handle the conversion from an F# function to a method. A delegate\
    \ silent and without explicit modification satisfies the requirements of the ProcessExit\
    \ event, it can be passed directly to the event without any further modification\n\
    \n```\ntype Watcher() =\nstatic member GoingAway(args : System.EventArgs) =\n\
    \    System.Console.WriteLine(\"Going away now...\")\")\n```\n\n```\nlet ad =\
    \ System.AppDomain.CurrentDomain\nad.ProcessExit.Add(Watcher.GoingAway)\n```\n\
    \nIn truth, many additional things are happening “under the hood” in the preceding\
    \ code, but for the vast majority of .NET CLR events, this will be sufficient.\
    \ Deeper understanding, however, requires a deeper exploration of delegates before\
    \ the F# support around delegates and events can be appreciated.\n\n# Delegates\n\
    \nFormally, a delegate instance is an instance of type System.Delegate, or as\
    \ is most the case, of its subtype System.MulticastDelegate. Delegate instances\
    \ are most often constructed by the C# or Visual Basic compiler “behind the scenes,”\
    \ in response to the developer using a language keyword (such as delegate) indicating\
    \ that a delegate is wanted. Delegates must be created to be"
