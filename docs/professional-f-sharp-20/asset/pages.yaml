  md: '# Introducing F# Active Record (FAR) | 303


    In either case there are problems. Most ORM systems depend on mutability. The
    internal mechanism of ORM systems for object construction tends to be something
    like:


    +   1. Create object, usually through a parameterless constructor.

    2. Set properties based on a configuration file — perhaps a fluent convention
    mapping to a FluentHibernate.

    3. Use a dynamic proxy mechanism that will intercept access to lazy loaded properties,
    submitting additional queries to load properties.


    As has covered before, F# programs generally avoid mutability. This is especially
    true if the reason that mutability is allowed to support an ORM. If one of the
    reasons we consider F# is to move away from mutability, having to introduce it
    to make an ORM work is actually a step backward. Generally speaking, unless there
    is an externally requirement to use an ORM, we recommend that software developers
    avoid using ORM technologies with F#.


    # INTRODUCING F# ACTIVE RECORD (FAR)


    F# Active Record (FAR) is an Open Source Project I founded that it is possible
    to get ORM-like features, but in a way that uses convention over configuration,
    embracing an approach idiomatic to F#.


    The idea with FAR is to mapping rows from a database to records in F# drop-dead,
    maintaining a functional style of programming. It is designed to cover everything
    that we might want to do with a database. In fact, it is biased toward simplicity,
    leaving out edge case features in favor of making the included functionality very
    robust and predictable.


    # Reading Data


    For example, consider the following F# record definition:


    ```

    type Person = (Id:int; Name:string; LastName:string; Age:int)

    ```


    Code for sequencing of Person objects should look something like this:


    ```

    use context = new SqlContext("SomeConnectionString")

    let people = context.SequenceOfPerson()

    ```


    In this case, people is now all the further F# code can do with. It is assumed
    that there is a table name in the targeted database that matches the name of Person,
    and there are columns in said table that correspond to the record properties of
    Id, FirstName, LastName, and Age. This approach works so long as a convention
    that type name matches table names, and properties match column names, holds true.
    Although this obviously can''t work in all situations, there are a great number
    of cases where it does. It is those situations where the convention can be maintained
    where this kind of approach can result in a drastic drop in the amount of mapping
    code in the system.


    For more on convention over configuration, please see http://en.wikipedia.org/wiki/Convention_over_configuration.'
