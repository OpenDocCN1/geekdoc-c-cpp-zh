    \ type, such as individual elements made of other types.\n\n# TYPE ABBREVIATIONS\n\
    \nOne of the drawbacks to tuples is the tuple, in its basic form, remains unnamed\
    \ — lexically speaking, it's harder to talk about passing string * string * int\
    \ * float types around than it is to talk about passing instances of Employee.\n\
    \nFortunately, F# alleviates this problem (for more than just tuples) by allowing\
    \ for type abbreviations, which are actually nothing more than name declarations\
    \ for existing type names:\n\n```\ntype MenuItem =\n  string * string * float\n\
    \ntype RestaurantMenu =\n  MenuItem list\n```"
