    \ may look like this:\n\n```\ntype ForecastWith\n  member forecast Attire() =\n\
    \    match forecast AverageTemperature, forecast Skies with\n      temp,sky when\
    \ temp > 75.0 && sky = Sunny || sky = PartlyCloud -> Bikini\n      temp,sky when\
    \ temp > 65.0 && sky = Sunny || sky = PartlyCloud -> Normal\n      temp,sky when\n\
    \        temp > 20.0 && sky = Sunny || sky = PartlyCloud -> LightJacket\n    \
    \    Rain -> Raincoat\n        temp when -> Parka\n        Hurricanes -> Cost\n\
    \        Snow -> Parka\n        Zombies -> BodyArmor\n        Cost -> when in\
    \ doubt, wear a coat ...\n  endn;\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_350_0.png)\n\
    \nCode snippet ForecastModel.fs\n\nA conversion from a Forecast to Attire is based\
