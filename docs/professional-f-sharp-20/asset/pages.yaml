  md: '# INTRODUCTION


    This is a book on the F# programming language.

    On the surface of things, that is a nonsensical and/or intuitively obvious statement,
    given the title of this book. However, despite the apparent redundancy in saying
    it aloud, the sentence above elegantly describes what this book is about: We are
    not attempting to teach developers how to accomplish tasks from other languages
    in this one, nor are we attempting to evangelize the language or its feature set
    or use "over" other languages. We assume that you are reading this book because
    you have an interest in learning the F# language: its syntax, semantics, pros
    and cons, and its use in concert with other parts of the .NET ecosystem.


    # WHO THIS IS FOR


    In order to keep the core focus of the book, we assume that you, the reader, are
    a journeyman .NET developer, familiar with at least one of the programming languages
    in the .NET community: C# or Visual Basic is the most common language of choice
    for those — but if you''ve learned C++/CLI or one of the lesser-known .NET languages
    (IronPython or IronRuby, perhaps one of the dozens or so of "alternative" languages
    for the CLR), you''ll still be able to follow along without too much trouble.

    In particular, we assume that you''re already comfortable with concepts like assemblies,
    managed code, and executing on top of a virtual machine, so no need of that "“.NET
    101" topical material appears here, as we would like to remind you what you are
    already reading in a beginner or intermediate C# or Visual Basic. You have probably
    used Reflection at some point in your career, and/or XML, Windows Presentation
    Foundation (or its web-based successor, Silverlight), Windows Communication Foundation,
    with might be a little database access in for for you.


    In short, we assume you''ve been developing in the .NET environment for the past
    couple of years. If that''s not you, you may want to start with one of the introductory
    .NET titles, such as Beginning C# 3.0 or Visual Basic 2008. For that reason, there
    are no "hand-holding" steps in a variety of other books when it comes to Visual
    Studio Solution files or creating new projects; not only would those be useless
    to the journeyman .NET developer (not to mention somewhat insulting), but they
    are also useless to the F# developer who wants to use MonoDev and the Mono implementation
    of the Common Language Runtime for writing and executing F#. Considering that
    it has held full compatibility with Mono as a goal since its inception, ignoring
    that crowd tide.


    If you are of the handful of functional programmers who''ve been working in Haskell,
    Ocaml, ML, or some Lisp-based derivative, you''re probably not going to like this
    book. We spend no time consuming monads, monoids, or caramorphisms, nor do we
    consider that a missing part of the'
  merge: -1
