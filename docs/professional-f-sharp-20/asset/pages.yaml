  md: '# CHAPTER 19 DATABASES


    In a case where the Person has a smaller number of rows, this works particularly
    well. Filtering on a small set is a matter of applying Seq.filter with an appropriate
    predicate to the following result.


    A predicate is a function that returns true or false. Filtering a predicate in
    this context needs to start with one parameter of the type we are filtering and
    resolve to a Boolean value:


    ```

    let me = people | Seq.filter(fun p -> p.FirstName = "Aaron")

    ```


    This, however, is not an approach that will scale. If people is something like
    the list of people in the United States Social Security database, rather than
    the list of employees in a small company, querying out of the database and into
    memory is it not the most scalable approach.


    # Querying Data


    To not have to bring all the records into memory, a need will exist for a way
    to easily tell the system that the predicate — which is specified p -> p.FirstName
    = "Aaron" — should be analyzed in database. Using F, the technique for doing this
    could look like:


    ```

    use context = new For("ConnectionString")

    let me = context.SequenceFromPerson(fun p -> p.FirstName = "Aaron")

    ```


    Notice two difference in this version compared to the previous one. The first
    one is that the predicate is being passed to the SequenceFrom method of the object
    context. Its method''s purpose is to analyze the predicate passed in, convert
    that predicate to the raw SQL code that will be used for the query on the database
    management system, and retrieve the result in a manner similar to the version
    of SequenceFrom which has no parameters and returns everything.


    The other difference is that the predicate was quoted (using < @ syntax). Quoting
    it is necessary in this case, as the SequenceFrom method needs to analyze the
    predicate and generate a query against the database. Remember, one of the key
    reasons for quotation is to execute code "other means." In a case like this, the
    desire is to execute the predicate against the database. For that to happen, the
    predicate has to be converted to a form that is used where the query will occur,
    which happens to be in the database, not in F#.


    # Adding Data


    Creating new records in the database is nearly as simple as reading them:


    ```

    type Person = (Id:int;FirstName:string;LastName:string;Age:int)

    type Cat = (Name:string;Color:string;IsCute:bool;IsMean:bool)

    ```


    static member test ReadPersonAndPets =


    ```

    use context = new For("ConnectionString")

    do context.Create(Id:1;FirstName:"Aaron";LastName:"Erickson";Age:37) | ignore

    do context.Create(Id:2;FirstName:"Erin";LastName:"Erickson";Age:34) | ignore

    do context.Create(Id:3;FirstName:"Adriana";LastName:"Erickson";Age:13) | ignore

    do context.Create(Id:4;FirstName:"Matthew";LastName:"Erickson";Age:8) | ignore

    ```


