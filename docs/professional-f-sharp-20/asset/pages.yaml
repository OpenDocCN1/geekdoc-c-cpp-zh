  md: "# SEQUENCES\n\nA sequence, according to the formal definition of the F# language,\
    \ is simply a synonym for the IEnumerable type defined in the .NET platform. As\
    \ such, anytime an F# function produces an iterator across a collection, it is\
    \ typically a sequence. However, because functional languages have a rich history\
    \ of using generators (that produce values, functions that appear to be infinitely\
    \ large or computed) as the source of values to other functions, F# has a wider\
    \ suite of functions for sequence types (seq) than the .NET developer might expect.\n\
    \nBy default, the sequence type is a producer of values; in other words, when\
    \ a sequence is obtained, it has no sense of what it holds and will hold back\
    \ — instead, it has internal code that knows how to produce the next-expected\
    \ value. For this reason, sequences are frequently thought of as lazy, meaning\
    \ they do not initialize all the values they eventually produce.\n\nBy far, the\
    \ easiest way yields a value each time the sequence is asked to produce one, as:\n\
    \n```\nlet x = seq ( for i = 1 to 10 do yield i )\n```\n\nIt's important to note\
    \ that the sequence will not have produced any values — simply a generator of\
    \ values, and each time it is asked to generate the value, it will execute the\
    \ next branch of the construct. This means that the loop inside the sequence isn't\
    \ running at all, but a sequence of executable statements — contrary to what might\
    \ seem obvious, isn't a collection of 10 integers waiting to be handled.\n\nThis\
    \ becomes more obvious when we put some side effect into the sequence, such as:\n\
    \n```\nlet y = seq ( for i = 1 to 10 do\n    System.Console.WriteLine(\"Generating\
    \ (0)\", i)\n    yield i )\n```\n\nWhen no, so \"Generating\" lines appear on\
    \ the screen, because as of this point, the sequence has only been created, not\
    \ asked to produce a value. The Console.WriteLine action won't work until the\
    \ sequence is asked to produce a value, as when we convert the sequence into an\
    \ IEnumerable and ask for its current value.\n\n```\nlet yenum = y.GetEnumerator()\n\
    if yenum.MoveNext() then\n    System.Console.WriteLine(yenum.Current)\n```\n\n\
    This will produce \"Generating 1\" to the screen soon as MoveNext() is called,\
    \ because it is at that point that the sequence is asked to produce its first\
    \ value. No other value is generated, because only that particular value is needed\
    \ — any future values will be waiting to be generated on demand.\n\nNote that\
    \ sequences can be \"reset\" at any time by obtaining a new IEnumerable from the\
    \ GetEnumerator() method or by simply using the sequence in a different Seq\n\n\
    > * This is not what functional programmers think when they use the term lazy,\
    \ but it is a concept and will feel pretty lazy to programmers not using the functional\
    \ link."
