    Name="button1"

    VerticalAlignment="Top"

    Width="75" />

    </Grid>

    </UserControl>

    ```


    The XAML for this control includes several namespaces that need to be added in
    order to support additional controls and libraries. The Grid element is the root
    XAML document element with name assigned value LayoutRoot that is used in examples
    later in this chapter to pass to F# a handle on the UI. Inside the grid is the
    button added in the previous section. The button contains attributes to describe
    its size and position, but most important has a name attribute that is used for
    F# when acquiring a handler to this component to register events on the Click
    event.


    After the Silverlight build environment is prepared, it is easy to start an F#
    Silverlight library and get instant feedback verifying that the Silverlight Library
    is functioning properly in the Silverlight CLR.


    # The F# Silverlight Library


    The F# Silverlight library is similar to an F# Library except that the build script
    carries the Silverlight CLR, which has more limitations than .NET CLR. Because
    it is targeted at the Silverlight CLR, this project cannot be referenced from
    other-Silverlight projects.


    The library project can include Silverlight event handling code, application logic,
    service calls to the host server, and all the Silverlight application code. It
    is possible to build the entire Silverlight UI in F# as well, although because
    Silverlight utilizes XAML for presentation separation to enable designer tools
    such as Microsoft Expression that enable parallel graphic design and development
    of separate teams, it is wise to refrain from UI code as much as possible by implementing
    declaratively in XAML.'
