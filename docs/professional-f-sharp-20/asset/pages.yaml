  md: 'Of course, at any point, F# developers are free to create their own custom
    attributes, as described in the next section. For the most part, however, unless
    F# developers will find a library or tool such as something similar to the Entity
    Framework, WCF, or some other infrastructure-oriented idea, most custom attributes
    will simply be used, rather than created.


    # CREATION AND CONSUMPTION


    As a CLI Producer (meaning the language can produce types suitable for consumption
    by other CLR languages, F# is just as capable of producing custom attributes as
    C# or Visual Basic.


    # Creation


    Any C# or Visual Basic developer versed in either of those languages will find
    the process of creating a custom attribute in F# to be strikingly similar. This
    is not an accident, thanks to F# as both a functional and object-oriented language.


    Fundamentally, creating a custom attribute in F# consists of defining a new type
    that inherits from System.Attribute base class and adorning the new type with
    (AttributeUsage) that describes where the new type can be used as an attribute,
    and ensuring that the new type can be found by .NET (F# or otherwise) assemblies.
    Then, one can use F# or other languages to reflect the assembly containing the
    custom attribute and use the attribute when wanted. This means compile, time,
    or runtime environment—will Reflection in some way discover the attribute, which
    we in the next section.


    For example, imagine it: If an exception is thrown, a customer demands that the
    programmer or group responsible for the exception-generating code be identified
    (probably so that they can fire or least to threaten their video-game privileges).
    Because the Exception base class defines members that provide Reflective Access
    to the member that generated the exception (TargetSite), when the exception is
    caught, we can interrogate the source of the exception to see if it has our custom
    attribute, and if it does, display the miscreant who wrote the code and pitiful
    justification.


    First, the custom attribute needs to be defined. A custom attribute is, at, just
    a class that inherits from the System.Attribute base class:


    ```

    Type BlameAttribute() Inherit System.Attribute

    ```


    At this point, it is a fully flagged member of the attribute family and can be
    used in code:


    ```

    [Blame] let faultyMethod() null.ToString()

    ```


    Sharp-eyed readers will note that the class is defined as BlameAttribute, but
    used as Blame; this is a .NET convention dating back to the early days of .NET,
    and one that is honored across all .NET languages to date. It is entirely syntactically
    possible to define a custom attribute without the "Attribute" suffix, but doing
    so is likely to be frowned upon in code reviews and earn the odious "Donut Purchaser"
    responsibilities at the next team meeting.'
