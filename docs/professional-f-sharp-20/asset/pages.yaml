    # PERFORMANCE CONSIDERATIONS


    As you saw in the Data Safety section, the mutable nature of .NET constructs can
    make it difficult to reason about them. This can be alleviated by judicious copying,
    but this practice has significant performance implications. This is why F#''s
    immutable data structures are designed in such a way as to minimize the number
    of objects that must be collected.


    For example, when changes to a list are made, only the parts of it are affected
    by the change are replaced in the new instance. In practice, use of intelligent
    implementations under the hood largely mitigates the performance cost of immutability.
    These, and other optimizations, are it it always important to avoid making assumptions
    about performance when using F#?


    One important trick to know is that you can enable in the F# interactive window.
    This is a fast way to check the performance of new code without the need for a
    profiler or timing harness.


    ```

    > time;

    ```


    ```

    -- Timing now

    > let 1 = [ 00000000; ];

    Real: 00:00:00.390, CPU: 00:00:00.390, gen0: 5, gen1: 2, gen2: 0

