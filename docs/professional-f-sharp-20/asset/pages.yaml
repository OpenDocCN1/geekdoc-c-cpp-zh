    \ parameters. And this body of work came to be known as the lambda calculus, after\
    \ the Greek word that served as the placeholder for function name.\n\n# LAMBDA\
    \ CALCULUS (BRIEFLY)\n\nWithout getting too deeply into the actual details, Church\
    \ observed that if the actual function could be passed around, various operations\
    \ that normally seem distinct and could be collapsed into a single higher-order\
    \ function.\n\nConsider the following two math operations and their C# equivalents:\n\
    \n```\nstatic int Add(int x, int y) { return x + y; }\nstatic int Mult(int x,\
    \ int y) { return x * y; }\n{\n    int x = 2;\n    int y = 3;\n    int added =\
    \ x + y;\n    int multiplied = x * y;\n    int addedagain = Add(x, y);\n    int\
    \ multipliedagain = Mult(x, y);\n}\n```\n\nWhat Church realized is if the actual\
    \ operation — adding, multiplying, whatever — is abstracted away as a parameter,\
    \ then both of these operations can be described using a single function:\n\n\
    ```\ndelegate int BinaryOp(int lhs, int rhs);\nstatic int Operate(int lhs, int\
    \ rhs, BinaryOp op)\n```"
