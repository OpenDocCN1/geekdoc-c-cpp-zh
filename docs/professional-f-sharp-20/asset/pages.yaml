  md: "of a particular declared delegate type, again typically declared using a keyword\
    \ and a syntax that looks much like a method or procedure declaration.\n\nAt first\
    \ glance, F#'s delegate support is not much different than its sister languages'\
    \ support. Declaring an explicit delegate type, for example, uses the delegate\
    \ keyword and an explicit function signature:\n\n```\ntype Notify = delegate of\
    \ string -> string\n```\n\nIn .NET, this creates a class that inherits from System.MulticastDelegate,\
    \ just as if it had been declared in C# or Visual Basic. This means, among other\
    \ things, that it has the implicit Invoke/BeginInvoke/EndInvoke methods present\
    \ on delegates and can be used just as any other delegate instance.\n\nAnd, keeping\
    \ with the delegate spirit, creating an instance of this delegate type occurs\
    \ just as it does in .NET languages—the object is passed to the method or function\
    \ to wrap when the delegate is invoked:\n\n```\ntype Child() =\n    member this.Respond(msg\
    \ : string) =\n    System.Console.WriteLine(\"You want me to (O)? No!\", msg)\n\
    \    \"No\"\n\nlet c = new Child()\nlet np = new Notify(c.Respond)\nlet response\
    \ = np.Invoke(\"clean your room!\")\nSystem.Console.WriteLine(response)\n```\n\
    \nCode snippet Class.fs\n\nNotice, however, that C# or Visual Basic makes the\
    \ invocation of the delegate occur \"just as if\" were a method or function, F#\
    \ requires the explicit method call to Invoke to invoke the delegate's wrapped\
    \ method.\n\nBecause this is an instance of MulticastDelegate, all the operations\
    \ and behaviors familiar to .NET—ining them via the Combine method, invoking them\
    \ asynchronously via the BeginInvoke/EndInvoke, and so on—are equally supported.\
    \ The C#-declared delegate can do, the F#-delegate can also do.\n\nIt is important\
    \ to note, however, that if the F#-delegate is intended to be used from other\
    \ languages, the declaration of the delegate is crucial. In particular, F# developers\
    \ must pay attention to the different arrangement and tuple-argument forms of\
    \ delegates:\n\n```\ntype CurriedDelegate = delegate of int * int -> int\ntype\
    \ TupledDelegate = delegate of (int * int) -> int\ntype DelegateTarget() =\n \
    \   member this.Curried(x : int) (y : int) = x + y\n    member this.TupledAdd(x\
    \ : int, y : int) = x + y\n```\n\nCode snippet Class.fs"
