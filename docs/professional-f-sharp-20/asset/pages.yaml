  md: '# Casting | 175


    At the heart of this discussion is whether the type being defined should be treated
    as an object — meaning it has an sense of identity, and whether one will differentiate
    between two objects even if they have the same contents — or as a value — meaning
    only the contents of the instance matters. If they have same contents, are they
    equivalent if they are separate objects? Normally, developers use overrides of
    Object.Equals to define some kind of structural equality/or comparison and rely
    on the default behavior of Object.Equals (the static method Object.ReferenceEquals)
    to provide identity equality tests. But F#''s introduction of tuple types and
    discriminated unions throws that something akin — if developers create a discriminated
    instance, for example, they may want more control over how the F# language treats
    it for comparison and/or equality purposes.


    The first two Equals() methods that will provide equality implementations to match
    what .NET developers use for reference types (those that inherit from System.Object
    directly) and value types (those that inherit from System.ValueType, such as using
    struct in C# or Structure in Basic), respectively.


    In other words, ReferenceEquals generates an Equals method that will return true
    only if the two references point to the same object (In fact, ReferenceEquality
    generates no new methods for Equals or GetHashCode, defaulting to inherit from
    System.Object).


    Using StructuralEquality will force the F# compiler to generate an Equals method
    that compares each of the fields in the type, which implies that each of these
    fields must also have StructuralEquality semantics. If StructuralEquality is placed
    on a nonvalue type, the F# compiler will reject it.


    If CustomEquality is used, the compiler will force the presence of an Equals method
    on that type. If the F developer provides a custom Equals method, it implements
    the System.IEquatable<T> interfaces, and the F# compiler will insist on having
    the CustomEquality defined on that type.


    NoEquality, as inferred, but the compiler also takes note of this and fails to
    describe in more detail in Chapter 10. (Type constraints are the type of use where
    an "equality" type constraint is required.)


    StructuralComparison, as its name implies, generates an implementation of System.IComparable
    that compares "the right thing", it compares each of the fields and returns -1,
    0 or 1 based on the greater-or-less comparison of each of those fields, so that
    (for example) two tuples, when compared, behave as follows:


    ```

    let t1 = (1, 1)

    let t2 = (1, 1)

    let t3 = (1, 0)

    System.Console.WriteLine("*", (t1 = t2)) // true

    System.Console.WriteLine("0", (t1 < t2)) // false

    System.Console.WriteLine("*", (t3 < t1)) // false

    ```


    NoComparison generates nothing, and CustomComparison assumes (and enforces) a
    custom implementation of the System.IComparable interface will be defined on the
    type.'
