    # SUMMARY


    F#s support for parameterized types is rich and powerful, particularly when combined
    with constraints and statically resolved type parameters, and makes writing reusable
    code just that much more powerful. But just writing reusable code is only part
    of the reusability story; the code must be packaged into a form that promotes
