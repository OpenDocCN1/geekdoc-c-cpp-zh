    \ overloading in C++. For example, if Persons are frequently compared against\
    \ one another using the IComparable.CompareTo() interface method, we can define\
    \ an operator that performs comparison naturally:\n\n```\nstatic member (==) (lhs\
    \ : Person, rhs : Person)\nmatch (lhs.FullName.CompareTo(rhs.FullName)) with\n\
    \    | x > 0 || x < 0 -> x\n    | -> lhs.Age.CompareTo(rhs.Age)\n```\n\nThis allows\
    \ us to compareTo() in comparisons in infix-style notation:\n\n```\nlet compare\
    \ = p1 == p2\n```\n\nSome developers claim that this is too cryptic, because there\
    \ is no predefined definition of an == operator, which then meets the principal\
    \ traditional criticism of operator overloading (such as confused semantics).\
    \ In any event, with all features of the language, F# developers are not required\
    \ to use this, but much of the language is defined using these constructs, and\
    \ it will likely be necessary to at least understand this syntax.\n\n# DELEGATES\
    \ AND EVENTS\n\nDelegates — in essence, manage function pointers — trace a history\
    \ back to the earliest days of programming, with C programmers would use pointers-to-rout\
    \ to other routines like those called \"call back\" without having predetermined\
    \ knowledge of what procedures to call. This technique was used for a number of\
    \ years to allow for a primitive form of higher-order programming (such is discussed\
    \ in Chapter 13) and to provide a notification mechanism while still maintaining\
    \ a decoupling between components. The latter is how most delegates are used in\
    \ .NET, typically in close coupling, though this is changing as functional classes\
    \ begin to penetrate the ecosystem.\n\nEvents in F# have two flavors. The first\
    \ is the basic favor as expressed in other .NET languages, the delegate-centric\
    \ event, in which clients interested in receiving notifications about an event\
    \ register a delegate instance (obeying all the traditions of delegates, of clause)\
    \ into a language-managed list of delegates via the implicit add and remove methods\
    \ generated by a language keyword. The other approach, however, is a more powerful\
    \ mechanism that F# programs can take advantage of some of the core capabilities\
    \ of the F language, such as event filtering and lambda expressions, while offering\
    \ the same delegate-based functionality to other NET languages."
