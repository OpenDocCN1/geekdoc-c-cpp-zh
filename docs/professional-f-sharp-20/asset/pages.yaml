    \ of the .NET ecosystem. (See Chapter 18 for details on F#/.NET interoperability.)\n\
    \n# Map Access\n\nAccessing the values in a map can be done in two ways, and just\
    \ as with list and array types, one of them is .NET-like, and the other is F#-like.\
    \ Both rely conceptually on using the \"key\" of the pair to find the \"value\"\
    \ of the pair\n\nAccessing values in the .NET style involves using the built-in\
    \ Item property in the traditional manner, as if the collection were an array\
    \ taking the key type as a parameter:\n\n```\nlet ted = nicknames(\"Ted\")\nSystem.Console.WriteLine(ted)\n\
    ```\n\nThe other approach, preferred by functional programmers, involves the function\
    \ defined on the Map module:\n\n```\nlet ted = Map.find(\"Ted\") nicknames\nSystem.Console.WriteLine(ted)\n\
    ```\n\nThe reason for the two different approaches will become more clear in Part\
    \ 3, \"Functional Programming,\" when functions and function composition is introduced\
    \ and explained; for now, recognize that each style yields the same result, the\
