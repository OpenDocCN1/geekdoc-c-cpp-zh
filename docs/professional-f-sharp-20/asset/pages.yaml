  md: "# Function Arguments and Return Values | 213\n\nin the overall bucket. Also,\
    \ modern compilers are much better at optimization and will often do automatic\
    \ inlining when appropriate. For these reasons the C# and VB.NET languages opted\
    \ to include this feature.\n\nIn F#, inline is mainly used for its effect on type\
    \ inference. An inlined function supports much robust type inference as it is\
    \ not bound to the rules of the CLR as tightly. It can infer arguments in terms\
    \ of statically resolved type parameters.\n\nSo, whereas in the previous section\
    \ we saw that our add function was automatically restricted to only accept a single\
    \ type of input parameter, if we define the same function as inline it can now\
    \ accept either. \n\n```\n> let inline a b = + b;\n```\n\nval inline add\n\n```\n\
    > \"a -> \"b -> \"\ndown ( \"a or \"b\") : (static member (+) : ^a * ^b -> ^c)\n\
    ```\n\n```\n> add 2.0 3.0;\nval it : float = 5.0\n```\n\n```\n> add 2 3;\nval\
    \ it : int = 5\n```\n\nIn this case the compiler is generalizing on the plus operator\
    \ even though it is not generic. As long as the passed arguments support a plus\
    \ operator that takes the other, it will resolve correctly. The only caveat is\
    \ that this type of inference can only happen at compile-time. Functions defined\
    \ as inline will not be usable from other .NET languages.\n\n# Type Annotations\n\
    \nIt is sometimes necessary to describe your type parameters in F#. Often type\
    \ inference works correctly due to a bug in your program. However, occasionally\
    \ the compiler cannot determine the type of your parameter or you will infer a\
    \ type you don't expect. Whatever the case may be, type annotations is essential\
    \ to writing F# effectively.\n\nBasic type annotation syntax is simple; you just\
    \ wrap the argument in parentheses, and a colon after the name and the type after\
    \ it.\n\n```\n> let plusOne (x : int) = x + 1;\n```\n\nval plusOne : int ->\n\n\
    In this example we are annotating the argument but the return type is still inferred.\
    \ To annotate the return type, place a colon after the argument list and follow\
    \ it with the to-be-returned type.\n\n```\n> let plusOne x : int = x + 1;\n```\n\
    \nval plusOne : int -> int\n\nThe return type, as well as each argument, may or\
    \ may not be annotated individually.\n\n```\n> let plus x (y : double) = x + y;\n\
    ```"
