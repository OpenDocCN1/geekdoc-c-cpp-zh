  md: "Regardless of whether the partial-case or multi-case approach is used, the\
    \ net result is a relatively easy, scalable way to parse XML documents and extract\
    \ the data into strongly typed domain objects for further processing.\n\n```\n\
    let results = extract xmlDoc\nfor r in results do\n    Console.WriteLine('Result:\
    \ (0)', r)\n\nAnd because the results of extracting are a sequence of strongly\
    \ typed objects, we could use pattern-matching to walk through the sequence and\
    \ do something more meaningful with the objects obtained:\nlet results = extract\
    \ xmlDoc\nfor r in results do\n    Console.WriteLine('Result: (0)', r)\n    match\
    \ s with\n        ? Ship as s ->\n            Console.WriteLine('The ship (0)',\
    \ (1))\n            if s.Jump is true\n                then 'is jump-capable'\n\
    \                else 'is slower-than-light'\n        | ? Person as p ->\n   \
    \         Console.WriteLine('Found (0)', p.Name)\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_346_0.png)\n\
    \n```\nCode snippet XMLActivePatternDemo.fs\n```\n\nRegardless of what work needs\
    \ to be done, the active patterns feature of F# allows for some easily read and\
    \ easily maintained code.\n\n# SUMMARY\n\nIn this chapter, we have covered how\
    \ to use XML with F# following common methods that F# programmers use, LINQ-to-XML\
    \ and XML DOM. Approaches that eschew XPath can certainly work; however, XPath,\
    \ especially if you are working with understand XPath, tends to produce more concise\
    \ queries. Which use is a matter of choice that is made most commonly by the group\
    \ you are working with, any any organizational standards you might have, or lacking\
    \ any of those constraints, personal preference."
