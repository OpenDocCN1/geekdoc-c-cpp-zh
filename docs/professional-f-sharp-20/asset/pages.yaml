  md: "# Summary | 83\n\nLike the map, sets can also be constructed using the set\
    \ function that takes a list and converts it to a sct:\n\n```\nlet setOfNicknames\
    \ = set [ \"Ted\"; \"Theo\"; \"Tio\";\n\"Ted\"; \"Ted\"; \"Teddy\" ]\nfor p in\
    \ setOfNicknames do\n  System.Console.WriteLine(p)\n```\n\nIn the case of set,\
    \ the returned object is the exact type as that returned from Set.ListOf(or Set.OfSeq),\
    \ used to construct sets from arrays or sequences, respectively; there is no practical\
    \ difference between the two.\n\nOne thing that differs from other collections\
    \ is that the set can determine if the object is already present inside the set.\
    \ In F#, this means the type in question must implement the IComparable interface\
    \ (as described in Chapter 9), and as a result any type which does not support\
    \ comparison such as the base type Object, will not go into a set; attempts to\
    \ do so will generate an error, either at compile-time or at runtime.\n\nGiven\
    \ that objects in a set are comparable, the set can provide some additional functionality,\
    \ such as finding the maximum and minimum value of all the items inside the set.\
    \ These are available either instance methods on the Set<object> or as library\
    \ methods from the Set module.\n\nAgain like its cousin, the map is an immutable\
    \ collection, meaning that any attempt to modify it will result in a new set being\
    \ created and returned. More interestingly, however, beyond the simple add and\
    \ remove from the set, it also supports various \"set theory\" operations, such\
    \ as intersection, union, difference, and testing for superset and subset comparison\
    \ operations, all of which are possible because of the \"comparison requirement\"\
    \ sets impose on their contents.\n\nIn general, sets are good for domain objects,\
    \ because domain objects frequently want or need to be unique within the domain,\
    \ and the set operations can reduce the code developers write.\n\n# SUMMARY\n\n\
    F# provides a number of composite types for the F# programmer, and beyond those\
    \ provided by the underlying .NET CL. Lists are first-class citizens and provide\
    \ a way to collect a homogeneous group of values together, but are fully supported\
    \ as well. Option types provide a safe means of dealing with the \"no value\"\
    \ possibility, and tuple types provide a stronger method of working with a tightly\
