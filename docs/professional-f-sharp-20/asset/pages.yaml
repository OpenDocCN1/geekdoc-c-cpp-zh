  md: "# Type Parameters\n\nCreating a generic type is remarkably easy, and syntactically\
    \ similar to what the C# developer already uses. To create the classic \"stack\"\
    \ (LIFO) using generics, the type parameter is placed inside brackets after the\
    \ type name declaration, and that parameter name can be used as a type throughout\
    \ the remainder:\n\n```\ntype Stack<T> =\n    let mutable data = []\n    member.Push(elem\
    \ : 'T') =\n        data <- elem := data\n    member.Pop() =\n        let temp\
    \ = data.Head\n        data <- data.Tail\n        temp\n    member.Length() =\n\
    \        data.Length\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_201_0.png)\n\
    \nCode snippet MeasurementLog.xaml\n\n> Note this is hardly the most efficient\
    \ implementation, but it serves for a demonstration.\n\nNotice that the type parameter\
    \ is prefixed with a single-quote; this is a non-negotiable part of the type parameter.\
    \ Historically (dating back to OCaml days), as C# prefers type parameters named\
    \ \"T\" and \"U\", and so on, F# prefers type parameters named 'a' and 'b', idiomatically,\
    \ the preceding code could be rewritten as:\n\n```\ntype Stack<'a> =\n    let\
    \ mutable data = []\n    member.Push(elem : 'a) =\n        data <- elem := data\n\
    \    member.Pop() =\n        let temp = data.Head\n        data <- data.Tail\n\
    \        temp\n    member.Length() =\n        data.Length\n```\n\nMore than one\
    \ parameter can appear in the type declaration, as long as they are separated\
    \ by a comma:\n\n```\ntype TwoArgGeneric<'a, 'b>(a : 'a, b : 'b) =\n    let vA\
    \ = a\n    let vB = b\n    override tag ToString() =\n        System.String.Format(\"\
    TwoArgGeneric({0}, {1})\", a, b)\n```"
