  md: '# 3


    # Primitive Types


    WHAT''S IN THIS CHAPTER?


    +   - Understanding primitive types

    - Declaring primitive type instances

    - Applying operators


    Like all languages that run on top of the CLR, the F# language provides a core
    set of primitive types that offer basic integer and floating-point arithmetic
    capabilities, character string support, Boolean types, and so on. In general,
    these map to the corresponding CLS types (System.Int16, System.Int32, and so on),
    as described next, but a few types are new to F# and come from the F# libraries.
    These types are fully accessible to other languages, such as C# and Visual Basic
    but obviously have no native language support there need to be used as any other
    .NET type is (that is, fully qualified type names).


    # BOOLEAN


    Probably the simplest primitive type in F# is the bool type, which corresponds
    to the CLR''s underlying System.Boolean type, and has two possible values, true
    and false.


    Booleans support the usual range of logical operations, including && (logical
    AND) and || (logical OR), and otherwise behave just as Boolean values in any other
    .NET language.'
