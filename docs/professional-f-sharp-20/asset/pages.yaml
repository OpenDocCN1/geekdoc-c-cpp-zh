  md: '# 17


    # Pipelining and Composition


    WHAT''S IN THIS CHAPTER?


    +   - Understanding pipelining operators

    - Understanding composition operators

    - Getting started with pipelining function composition

    - Using advanced function composition


    What is it about functional languages that make them so powerful for data processing?
    One answer to this is composability. Instead of being a built-in language construct
    such as for or foreach, functional abstractions like map and reduce are themselves
    functions. They are first-class language citizens, no different than any function
    you might write yourself. This they are much more flexible because they can be
    built one argument at a time, passed around, and even combined with other functions.


    Out of this composability comes a data-oriented programming technique called pipelining.
    In pipelining, functions are combined or chained together with special operators.
    This allows you to pass the results of one function directly and unambiguously
    into the next. In this way, programs can be produced as a series of discrete data
    transformations. As you will see, this approach short and expressive data processing
    programs.


    # BASIC COMPOSITION AND PIPELINING


    When writing code using composition and pipelining, there are four primary operators.
    Each of these is a combination of two ideas, performing an operation to the left
    or right and either pipelining data or composing functions. When combined, they
    provide a powerful set of tools that allow you to write concise and visually appealing
    code.'
