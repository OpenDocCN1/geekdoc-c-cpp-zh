  md: "# 310 | CHAPTER 16 | DATABASES\n\nWithin this type, members are created to\
    \ depend on this common context. The first is the routine\that generates the parse\
    \ tree:\n\n```\n// takes a predicate and generates a tuple composed of\n// parameterized\
    \ sql * parameters\nstatic private Private ParseCriteria<'a> (criteria:Expr<'a\
    \ -> bool>) = =\n    let rec predicateParser exprs =\n        match exprs {\n\
    \        | SpecificCall (< | |) -> (optionParser, types, exprs)\n            ->\
    \ Some (ExprNode(types.exprs))\n        | AndNode (| |) -> (optionParser, types,\
    \ exprs)\n            -> Some (AndNode(predicateParser(exprs[1]))\n        | SpecificCall\
    \ (< | |) -> (optionParser, types, exprs)\n            -> Some (OrNode(predicateParser(exprs[0]),\
    \ predicateParser(exprs[1]))\n        | Patterns.IfElse (let =\n            match\
    \ expr {\n            | Patterns.Call (optionExpr, types, exprs)\n           \
    \     -> Some (predicateParser(left), predicateParser(middle))\n            |\
    \ Patterns.Value (value, valueType)\n                -> Some (OrNode(predicateParser(left),\
    \ predicateParser(right)))\n            | -> None\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_318_0.png)\n\
    \nCode snippet FSharp_DAL.fs\n\nOur overall goal with ParseCriteria is to quote\
    \ a predicate and generate a SQL string and a series\nof parameters that will\
    \ be used to perform a query. This parsing is made\nsimpler by inclusion of the\
    \ Microsoft.FSharp.Quotations and Microsoft.FSharp.Quotations.DerivedNames. Most\
    \ of the work is done by the recursive predicateParser routine, which recursively\
    \ walks the provided mapping, making the expression tree to something we\ne easily\
    \ execute.\n\nSpecificCall is an active pattern that matches a given quoted expression\
    \ (as < { | | } >)\nagainst the tree contains. In F#, this works well for the\
    \ EqualNode type, when\nmatched, an EqualNode that contains a pair of expressions\
    \ and types that can be used for\ngendering an SQL expression.\n\nThe other instances\
    \ of SpecificCall occur in circumstances where one would expect\nthem, and if\
    \ they are, will emit the AndNode or OrNode. AndNode and\nOrNode take two arguments,\
    \ from their left and right side, which will be provided by recursive\nccalls\
    \ to predicateParser on the left and right sides of the expression tree.\n\nOf\
    \ course, there is a case which is that matters optimizations get applied to the\
    \ tree.\ntif the quoted or or get converted from some IfThenElse calls in the\
    \ predi-\ncate, those need to be handled as well. IfThenElse is another active\
    \ pattern that can be used to\nmatch against that case. And and or both get converted\
    \ to IfThenElse in ways that\nare recognizable. If the middle node in IfThenElse\
    \ is a Call, it can be deduced that it was con-\nverted from (&&), and handled\
    \ accordingly. If it is a Value, it can be deduced it was converted\nfrom { |\
    \ } .\n\n*"
