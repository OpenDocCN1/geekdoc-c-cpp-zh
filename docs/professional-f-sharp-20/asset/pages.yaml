    Web. The abstraction of a window with click events breaks down very quickly!


    ASP.NET MVC grew from a premise that developers are better off admitting that
    web apps are

    bought of as the HTTP-based services they actually are, rather than as an abstraction
    of

    programming model for a very different set of assumptions. It does not hurt the

    framework is designed in mind. However, moving from a static model to a

    service-based model has other ramifications to the F# programmer.


    As covered in Chapter 23, F# is a great language for service development. ASP.NET
    MVC is

    more a complex type of service, rather than serving up JSON or XML, serves up
    HTML

    based on an HTTP request. In this chapter, we demonstrate writing a completely
    stateless application

    using F# and the ASP.NET MVC Framework.


    # FORECAST — THE SIMPEST WEATHER

    FORECAST SITE


    To demonstrate this, this chapter builds on the weather started with Chapter 20
    to build

    our website that implements the following user story:


    > As a human, to quickly determine whether I should wear a light jacket, a parka,

    a raincoat, a a bikini, or in the case of a forecasted Zombie takeover, body armor.

    I want to know what weather to expect.


    To build this, the following steps apply:


    +   - Build a domain that models a weather forecast.

    - Create a repository that can contain the domain.

    - Build a controller that provides a means for an outside service to access the
    domain.

    - Add an ASP.NET MVC view that leverages the controller and makes the system usable
    by humans.


    To get started, I encourage you to become familiar with the project setup steps
    described by Tomas

    Petrick on his blog: http://tomasp.net/blog/fsharp-mvc-web.aspx. This setup explains
