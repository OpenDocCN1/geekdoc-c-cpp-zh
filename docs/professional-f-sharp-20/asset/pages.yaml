  md: '# WRITING THE SERVICE CONTROLLER


    Just as one developer a controller for MVC applications so that requests in http
    are going to be similar to things that were needed on the appropriate calls into
    the domain model, when developing services, controllers are used that can take
    external requests and route them appropriately. Although it is tempting to reuse
    the same MVC controller, chances it likely in more complexity than we need, because
    the needs in MVC to make a complex set of parameters from an http request into
    routes is not present. As such, a much less complex controller model for a service
    controller shall be used.


