    \ evArgs => evArgs ?: ConcertEventArgs\n  let cea = evArgs\n  System Console.WriteLine(\\\
    '[0] is rockin' (1)',\n  rb.Name, cea.City))\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_173_0.png)\n\
    \nThis can create powerful event-handling effects, particularly given the functions\
    \ found in the Event module. F# developers-handling would be well-advised to experiment\
    \ with the functions they found before writing significant amounts of event-handler\
    \ code.\n\nEvents can also be exposed to F#-only code by constructing an instance\
    \ of the Event<> type and registering functions to be called when the event is\
    \ triggered (via the Trigger method) by calling Event.add, in the same way that\
    \ DelegateEvent operates. The Event object has the advantage that it is a simply\
    \ object, and not a keyword or special language element, but has the disadvantage\
    \ that it works with other F# code.\n\n# ACCESS MODIFIERS\n\nAccess modifiers\
    \ are used to control the visibility of members within a type, ranging from \"\
    accessible to any element in the CLR process (public), to \"accessible to elements\
    \ within this same type (private). As has already been seen, however, normally\
    \ the F# compiler infers an appropriate default access modifier for most members,\
    \ making the need for an explicit modifier necessary.\n\nWhen more control over\
    \ the access of a particular member is wanted, an access modifier can appear on\
    \ the member declaration, after the member keyword but before the member name\
    \ (and selfidentifier, if this is an instance):\n\n```\n<Class>\n  type Type\n\
    \    member private p.Rules\n    with get() = **\n```\n\nThe available access\
    \ modifiers are more or less synonymous with the list of modifiers found in the\
    \ C# and Visual Basic languages:\n\n+   - public: No restrictions on access; other\
    \ .NET program element can find and use this element.\n- private: Access is permitted\
    \ only from the enclosing type (or module or namespace).\n- internal: Access is\
    \ permitted only from the assembly in which it is defined.\n\nIn addition, the\
    \ F# language implementers have already earmarked the keyword protected, presumably\
    \ to introduce it into a future version of F# to serve as an access modifier similar\
    \ to its C#\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_173_1.png)"
