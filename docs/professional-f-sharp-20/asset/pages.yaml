  md: "To be straightforward about it, any case where a traditional object-oriented\
    \ developer would consider using a Composite pattern (from Design Patterns: Elements\
    \ of Reusable Object-Oriented Software by Erich Gamma, Richard, Helm, Ralph Johnson,\
    \ and John Vlissides, also known as the Gang-of-Four book) can most likely be\
    \ replaced by a discriminated union and result in a much smaller code base:\n\n\
    Discriminated unions also make the State pattern (again, from the Gang-of-Four\
    \ book) trivial to code and implement:\n\n```\ntype State =\n| New\n| Opened\n\
    | Closed\nmember s.Open() =\nmatch s with\n| New -> Opened\n| Opened ->\n failwith\
    \ \"Error to Open an Opened state\"\n| Closed -> Opened\nmember s.Close() =\n\
