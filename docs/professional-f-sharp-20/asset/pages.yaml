  md: '# ACKNOWLEDGMENTS


    I WOULD LIKE TO thank my family, especially my wife Pradeepa and two sons, Tristan
    and William, for their support and patience while I worked on this book. I would
    also like to thank my parents and siblings who have also been major supporting
    factors in my life. I would like to extend my gratitude toward my co-authors,
    Ted Nward, Aaron Erickson, and Rick Minerich for their dedication to getting this
    book published, Michael de la Maza for spearheading the F# User Group, Don Syme
    and Microsoft Research for their brilliant work F#, plus Luke Hoban and the Microsoft
    product team for bringing F# into Visual Studio as part of the product.


    TALBOTT CROWELL


    NO AMOUNT OF THANKS to my co-authors would be enough. Ted, for bringing vision
    and leadership to this project. Aaron, for his frequent advice on dealing with
    the many small dramas of the author and consulting world. Talbott, for recommending
    me for this project and for being my New England F# brother-in-arms. I''d also
    like to thank Michael de la Maza who came up with the idea to start a New England
    F# User Group, everyone at Atalasof for supporting me in this and my parents for
    cheering me up when the pressures seemed worst. Finally, I''d like to thank the
    F# community; each of you proves the superiority of statically-typed functional
    programming on a daily basis.


    RICHARD MINERICH'
