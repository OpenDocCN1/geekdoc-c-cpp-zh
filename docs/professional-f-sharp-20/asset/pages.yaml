    \ incorporate an interface as part of its definition, and interface definition,\
    \ meaning F# can define new types. The syntax for doing so is remarkably consistent\
    \ with the definition of types, to the point where the F# developer often ignore\
    \ the details between classes and defining them. Again, this is in keeping with\
    \ F#'s design to let developers focus on the problem rather than the physical\
