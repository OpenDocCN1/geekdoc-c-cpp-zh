    \    var getForecastDoc =\n        sprintf(\"http://weather.yahooapis.com/forecastrss?w=%d&id\"\
    , id weatherWeatherRSS) | XDocument.Load\n    let weatherDoc = yahoWhereOnEarthIds\
    \ | Sql head | getForecastDoc\n```\n\nCode snippet ForecastRepository.fs\n\nThe\
    \ first step is to implement a function to GetForecastByLocation called getForecast-Doc.\
    \ It refers to a \"Where On Earth ID\". The next step is to compose a URL by combining\
