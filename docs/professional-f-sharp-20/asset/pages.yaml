    work to an F# library.


    # XAP


    When the Silverlight project is compiled, the build process packages it into a
    XAP file. As mentioned previously, the XAP file is a zip file with a .xap extension.
    Changing the extension to .zip facilitates the ability to examine the contents.
    This technique is handy when debugging deployment issues.


    # Silverlight Testing in the Browser


    The web project includes two Pages in the Solution Explorer, one ASPX TestPage
    (.NET) and the other HTML. It doesnt matter which one is used, initially the ASPX
    page is set as the default setup. The Set As Start Page in the context-sensitive
    menu can be used to switch between the two. After the project is built, the web
    project includes a folder called ClientBin where the build process copies the
    XAP file created by building the Silverlight project.


    With Visual Studio 2010, the designer window for the MainPage.xaml starts with
    a blank rectangular area, 300 pixels by 400 pixels, for the UI components. One
    way to confirm that the build process is working and the Silverlight prerequisites
    are installed and configured properly is to drag a Button from the toolbox onto
    the surface, place it in the top-left corner, and hit F5 to run the application.
    If everything is working properly and the build is successful, a browser window
    pops up with a single button on the page.


    Visual Studio 2008 may require manipulation of the XML directly or designer tool
    such as Microsoft Expression to lay out the components. To add the button to the
    XML, place a Button element inside the Grid element (between the <Grid x:Name="LayoutRoot">
    tag and the </Grid> tag).


    ```

    <Button Content="Button" Height="23" HorizontalAlignment="Left" Margin="14,14.0,0"
    Name="button" VerticalAlignment="Top" Width="75" />

    ```


    # XAML


    XAML is an XML implementation that stands for Extensible Markup Language and is
    used in Silverlight applications to describe the UI elements, layout, and behavior
    as animation.'
