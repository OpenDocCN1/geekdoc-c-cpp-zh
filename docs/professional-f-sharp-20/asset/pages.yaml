  md: '# ABOUT THE AUTHORS


    **TED NEWARD** is the Principal with Neward & Associates, a consulting firm that
    works with clients of all sizes, for Fortune 500 to small startups. He is fascinated
    with programming languages, virtual machines, and enterprise-class systems, spends
    a lot of his time in the Java and .NET ecosystems, and has recently begun to explore
    the world of mobile devices and games. He resides with his wife, two sons, and
    eight laptops in the Pacific Northwest.


    **AARON C ERICKSON** is a Principal Consultant with ThoughtM. His life''s work
    is helping organizations better leverage technology by contributing to solutions
    that have substantial positive economic impact for his clients. He is an enthusiast
    of agile techniques for delivery functional software, and has a special interest
    in helping companies understand how to leverage functional programming techniques
    to perform meaningful business analytics, particularly using natural language
    programming and Monte Carlo.


    **TALBOT CROWELL** is a Solution Architect and founder of ThirdM responsible for
    designing and building enterprise applications with a focus on Microsoft technologies
    including SharePoint, BizTalk Server, and the .NET framework. His company delivers
    solutions and services to large and small companies, including Finance. ThirdM
    also assists companies with the development process by using a blend of Agile
    and traditional methodologies, Team Foundation Server and Visual Studio Team System,
    Scrum, Test Driven Development (TDD), performance testing, and other proven tools
    and practices. Involved in the developer community, Talbott co-founded the F#
    User Group, http://faug.org, and serves as a leader for other community events
    and groups such as SharePoint Saturday and the Boston Area SharePoint User Group.
    You can follow him on twitter, @talbott, or http://twitter.com/talbott.


    **RICHARD MINERIC** began to notice a problem in the software industry only a
    few years after graduating from UM Amherst. He saw a deep divide between the remarkable
    advancements made in computer science and the aged tools still in use by software
    engineers and domain experts. Through writing, speaking, and consulting, Richard
    hopes to bring these advances to a broader audience, to facilitate the creation
    of intelligent software, and to bring disruptive change to stagnant industries.
    Richard is currently a Microsoft MVP for the F# programming language and is one
    of three leaders of the New England F# User Group.'
