  md: '# 1


    # Primer


    WHAT''S IN THIS CHAPTER?


    +   - Understanding strategies

    - Reviewing Lambda calculus

    - Inferring types

    - Understanding bindings

    - Creating your own bindings


    Object-oriented programming has been with us for close to two decades, if not
    longer; its expressions of those concepts via the languages C# and Visual Basic,
    and the platform on which they run, the CLR, have been more recent, only since
    2002. The community and system around the object-oriented paradigm is vast, and
    the traps and pitfalls around an object-oriented way of thinking has seen copious
    discussion and experience, and where disagreements occur, reasoned and heated
    debate. From its inception more than 40 years ago, through its exploration in
    languages invented yesterday, an object-oriented approach to languages has received
    the benefit of the attention of some of the smartest language and tool designers
    in the industry, and has generational approach to ancillary features of the language,
    such as garbage collection, strong semantics typing, compilation-versus-interpretation,
    and various hybrids thereof, full-identity metadata, parameterized types, and
    more; no stone, it remains unturned.


    One of the primary goals of an object-oriented language is the establishment of
    user-defined types (UDTs) that not only serve to capture the abstractions around
    the users'' domain, but also the capability to reuse those types in a variety
    of different scenarios within the same domain without modification. Sometimes
    this domain is a business-flavored one — at the start of the 21st century these
    kinds of types were called business objects and later domain types. Sometimes
    the domain is an infrastructural one, such as presentation or communication,'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'and these types are frequently collected together in a large bundle known as
    a framework or class library. Despite the relatively slow start that C++ class
    libraries saw during C++s heyday, the combination of fast, cheap network access
    and volunteers willing to share their efforts has led to the proliferation of
    these infrastructural bundles that dwarfs anything the has seen before.


    Unfortunately, despite the huge success of C+, Java, and .NET, the original premise
    of the objectoriented, that developers could take objects "off the shelf" and
    reuse without modification, has yet to occur for anything but the infrastructural
    domain. Even in that domain, debate and duplication over safety points can only
    be changed by changing the underlying source code making such infrastructures
    typical.


    More important, as the 20th century came to close and the 21st loomed on the horizon,
    developers began to find "edges," limitations to the object-oriented paradigm
    to amend its approach slightly, placing these objects pushed the object-oriented
    community into containers and relying on the container to provide a set of services
    that could not be captured by object-oriented methodology. These components containers,
    exemplified by the Enterprise Java standard (and COM+Enterprise Services) found
    some traction that were never widely adored by the developers who used them.


    In time, those were amended to take a more coarse-grained approach, seeking a
    certain degree of simplicity to enable for a more interpreable approach, and these
    new bundles received a new name: services. Although Service-Oriented Architecture
    (SOA) sought an entirely new style of programming, developers seeking to take
    their traditional object-oriented concepts into the service-oriented realm found
    themselves struggling with even the simplest of designs.


    Despite the guidance of well-intentioned discours around object-oriented design
    (called design patterns at first, then later patterns), the more developers sought
    to model their software after the reality of the business around them, the more
    they struggled to achieve the reachability promised. Coupled with such inadequate
    tools, the object languages had not only failed to produce that of "Tinkertoys"


    the hardware steady march began to respond to the beat of a different dream, that
    of multicore. Suddenly, when programmers faced problems in a single- or multi-threaded
    environment, now the hardware-oriented performance could only be gained by greater
    and greater parallelization of code. Where the object-oriented developers of the
    20th century could assume that only a single logical thread of execution would
    operate against their objects, the developers of the 21st century have to assume
    that many logical threads of execution will all be hammering on their objects
    simultaneously. The implication, that developers must now consider all possible
    interactions of multiple threads on every operation available on the types they
    define, continuing like a swarm of Docks over the heads of object-oriented programmers
    even as the first decade of the new century came to a close.


    This chapter attempts to demonstrate some of the technical challenges C# and Visual
    Basic developers (and a logical extent, their cousins and predecessors in Java
    and C++) have faced when using the object-oriented paradigm exclusively. In the
    beginning, challenges will be addressed with'
  merge: -1
