  md: "# Query Processing\n\nThe real useful part of this library is the conversion\
    \ of idiomatic F# code to SQL. However, for this\nto work, the following is needed:\n\
    \n```\nlet makeSimpleSelect table fields =\nlet commaSeparatedFields = fields\
    \ |> ConvertToCommaSeparatedString\nprintf(\"select * from %s\", commaSeparatedFields\
    \ table\n```\n\nThis first routine takes a table name and a seq-string= represents\
    \ database fields. It then gen-\nerates a typical SQL query that we would use\
    \ against a single table. For example, passing Person\\and [FirstName, LastName]\
    \ would generate\n\n```\nselect firstName, lastName from person\n```\n\nThis is\
    \ a good start, but far more needs to be done if you want the ability for more\
    \ complex predic-\\ates to be passed along a record type. More complex queries\
    \ require an parsed\ntree structure be built so that it can be converted to SQL.\
    \ Start by defining\nthe following tree structure in the format of a discriminated\
    \ union:\n\n```\ntype ParseNode =\n  EqualNode of Type list * Expr list\n  | AndNode\
    \ of ParseNode option * ParseNode option\n  | OrNode of ParseNode option * ParseNode\
    \ option\n  // other nodes as needed\n```\n\nThe preceding example is a simplistic\
    \ version of what can represent a parse tree. It will start with\neality terms\
    \ and or or. For example p.FirstName = \"Aaron\" and (p.LastName = \"Erickson\"\
    \ or\np.LastName=\" might look like:\n\n```\n-------------------------------------------------------------\n\
    -------------------------------------------------------------\nEqualNode     \
    \                    | OrNode\np.FirstName = \"Aaron\" | p.LastName = \"Erickson\"\
    \ | p.LastName = \"Burr\"\n```\n\nTwo routines will use this tree. One will take\
    \ an F# quoted predicate and generate the tree; the\nother will recursively walk\
    \ the tree to generate equivalent SQL code.\n\n# Generating the Parse Tree\n\n\
    Start by declaring a context from which we will run queries that have the connection\
    \ object:\n\n```\ntype DataContext =\nval connection = SqlConnection\nnew(ConnectionString)\
    \ = { connection = connection |> MakeConnection }\nwith\n  interface IDisposable\
    \ with\n    member disposable.Dispose() =\n      disposable.connection.Close()\n\
    ```"
