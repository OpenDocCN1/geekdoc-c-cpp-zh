  md: 'Syntactically, defining a type extension looks something like a type definition,
    with some restrictions:


    ```

    type Student with

    member s.FullDescription = s.Name + " " + s.Subject

    ```


    Because the compiler is playing syntactic games here, and not changing the basic
    definition of the type''s internals, no new fields may be added to the type, whether
    val declarations or let declarations.


    Type extensions can add constructors:


    ```

    type Student with

    new() = Student(*, *)

    member s.FullDescription = s.Name + " " + s.Subject

    ```


    And although it doesn''t make sense to do so without the ability to define fields,
    it''s possible to introduce constructors that take additional parameters before
    the constructors defined in the original type:


    ```

    type Student with

    new() = Student(*, *)

    new(name, subject, school)

    Student(name, subject)

    member s.FullDescription = s.Name + " " + s.Subject

    ```


    Code snippet Class.fs


    Static members (and, "operators") are also fair game, as are instance and static
    methods.


    Because type extensions are not part of the type, the type extension has no additional
    access to private members or any other method or function of any other type have
    — that is to say, it has no name and attempts to reference private members will
    generate a compile-time error.


    Because this functionality is effectively a product of the compiler, type extensions
    can operate on any type defined in the .NET environment, including those defined
    in the Base Class Library:


    ```

    type String with

    member s IsUpper

    s.ToUpper() = s

    ```


    However, in general, type extensions should be treated with care, because now
    functionality relating to a class is being "spread out" over different locations,
    which contradicts the basic point of object-oriented development, spread to gather
    all the concerns relating to a given idea into a single location (the class).
    As with many features, when used judiciously, type extensions can simplify code
    significantly, but when flagantly tossed around, type extensions can render otherwise
    written code into a mess that not even a mother would love (or read).


    ![](img/3b6b83f504d0e46470b40dafe9ce1960_176_0.png)'
