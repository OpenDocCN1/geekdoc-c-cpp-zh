  md: '# Boxing and Unboxing


    One of the novel features of the CLR was its use of a unified type system tree,
    meaning all types through the CLR inherit from a single base class (System.Object,
    also known as obj in F#), including all primitive types. Given that Object has
    a number of methods on it, requiring some kind of method dispatch table and "sync
    lock," implying overhead per object, and types don''t carry any additional overhead,
    the CLR had to come up with particular magic to make the unified type system work
    well in the majority of cases.


    The solution, as well as C# and Visual Basic developers already know, was to create
    instructions in the CLR, box and unbox, which convert a value type (the CLR term
    for types that act as primitive types — see Chapter 3 for details) into an object
    reference when necessary and vice versa. Normally these are automatically inserted
    into the compiled code by the C# or Visual Basic compilers, because both of languages
    support automatic implicit conversions. F# developers will sometimes find the
    need to do the boxing or unboxing "by hand," which is done using the F# language
    words box and unbox, respectively:


    ```

    let oi = box 42

    System.Console.WriteLine("oi type is {0}", oi.GetType())

    let i = unbox oi

    System.Console.WriteLine("i type is {0}", i.GetType())

    ```


    Like the download instruction, the unbox call infers the type to which to unbox
    from the left side of the expression, in case an int32.


    # Equality, Hashing, and Comparison


    Because all types in the CLR ultimately inherit from the System.Object base type,
    and because two of the methods on that type deal with object comparison (Equals
    and GetHashCode), .NET programmer frequently presented with the requirement to
    define appropriate implementations of these methods on their custom type definitions.
    Because of the ubiquity of defining these methods, F# provides some additional
    support to make it easier to define them.


    Naturally, the F# developer is always free to override implementations of the
    two methods directly (with some restrictions, as described here), but F# also
    provides several custom attributes to the F# developer to tell the compiler exactly
    what kind of equality and comparison semantics this type is to have:


    +   - Microsoft.CSharp.Core.ReferenceEquality

    - Microsoft.FSharp.Core.StructuralEquality

    - Microsoft.FSharp.Core.CustomEquality

    - Microsoft.FSharp.Core.NoEquality

    - Microsoft.FSharp.Core.StructuralComparison

    - Microsoft.FSharp.Core.CustomComparison

    - Microsoft.FSharp.Core.NoComparison'
