  md: "# 2\n\n# Lexical Structure\n\nWHAT'S IN THIS CHAPTER?\n\n+   - Understanding\
    \ basic syntax\n- Defining values and identifiers\n\nIn any language, some basic\
    \ lexical ideas have to be laid down before programmers can begin to understand\
    \ the concepts behind the language — questions such as \"What makes a comment?”\
    \ or \"What is allowed in identifier names?\" although intrinsically boring in\
    \ many ways, have to be defined before any further progress into the language's\
    \ structure and form. F#'s lexical structure derives strongly from its immediate\
    \ ancestor, OCaml, which is itself a derivative of the pure functional language\
    \ ML. This means that for the most part, although F# strives to be defined in\
    \ terms of its syntax, the C# and Visual Basic developer can find a number of\
    \ new and interesting syntactic ideas, some of which will be surprising. Fortunately,\
    \ most of those will be pleasant surprises because much of the syntax is less\
    \ restrictive than the other. .NET languages offered from Microsoft.\n\n# COMMENTS\n\
    \nThe easiest place to begin with any language is a simple definition of what\
    \ makes a comment (meaning, syntax that the compiler will ignore during processing).\
    \ F# supports three different styles of comments:\n\n+   - Multi-line comments\
    \ using the (* and *) delimiters, as:\n  (* This is\n  a multi-line\n  comment\
    \ *)"
