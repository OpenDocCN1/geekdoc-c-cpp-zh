  md: '# Calling C# Libraries from F# | 285


    The semantics of dealing with C# objects in F# is not all that different from
    how you would deal with C# objects in C#. The last two lines in C# barely look
    any different at:


    ```

    var newCSharpObject = new CSharpLibraryUsedWithFSharp()

    var result = new CSharpObject.SomeFunction(42, 69);

    ```


    At this level, moving from C# to F# is a simple matter of replacing var with let
    and removing the semicolons. You might wonder what all the fuss is about! As might
    expected, there is much more just a little bit before the mess. This gets into
    sharp relief when attempting to call C# objects using F# syntax:


    ```

    // this works

    let result = (42, 69) | newCSharpObject.SomeFunction

    // but you can''t do this stuff

    let work = newCSharpObject.SomeFunction 42 69

    let alsoNotWork = 69 |> SomeFunction

    let neitherThisWillAttemptedExample = 69 |>CSharpObject.SomeFunction

    ```


    > Code snippet FSharpCallingCSharp.fs


    What becomes more clear when looking at this in inline form is that from F#, a
    method with multiple parameters is actually with a single parameter that is presented
    from F# in the form of a tuple. As a result of this, when using C# functions in
    F#, the same options around function composition will generally not be available.
    Consider the following F# curry-example:


    ```

    let someSharpFunction a b = a * b

    let curriedFunction = 42 |> someSharpFunction

    let actualResult = 69 |> curriedFunction

    ```


    Although the proceeding is a simple exercise in F#, doing so with methods defined
    in C# is not possible in a way that most people would consider elegant, if it
    is possible at all.


    # C# Object Construction


    Constructing C# objects in F# is mostly trivial:


    ```

    var newCSharpObject = new CSharpLibraryUsedWithFSharp()

    ```


    The new facility in F# works just how a C# developer would expect it. Construction
    with arguments takes the familiar format as:


    ```

    let paramsOnly = new CSharpLibraryUsedWithFSharp(11, 22)

    ```


    In C# 3.0, a new feature, object initializers, were introduced, which allow for
    provision of the initial property values of (usually) mutable properties. Property
    initialization in F# is not all different:


    ```

    let initializersOnly

    let newCSharpLibraryUsedWithFSharp(

    SomeMutableProperty = 55,

    AnotherMutableProperty = 56)

    ```'
