  md: '# # Pattern Matching


    WHAT''S IN THIS CHAPTER?


    +   - Understanding patterns and pattern-matching

    - Using pattern matching constructs

    - Applying pattern guards

    - Using active patterns


    More than any other construct thus far explored, pattern matching is what distinguishes
    F# from the other languages in the .NET family. Pattern-matching is a hallmark
    of the functional language, and its power is something that is rapidly finding
    its way (in various guises) into other languages.


    #  Basics


    Fundamentally, pattern-matching looks, on the surface, like a variation on the
    switch/case construct from the C-family of languages: A value is tested, and depending
    on its contents, one of different "branches" of code is evaluated:


    ```

    let x = 12

    match x with

    | 12 -> System.Console.WriteLine("It''s 12")

    | _ -> System.Console.WriteLine("It''s not 12")

    ```


    The syntax is somewhat similar to the switch/case of C#; broken down, a pattern-matching
    construct consists of the following:


    +   - The match keyword, preceding the expression to be evaluated

    - The with keyword, indicating the start of one or more various values to compare
    against'
