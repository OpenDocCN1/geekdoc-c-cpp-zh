    Katie\")\n    System.Console.WriteLine(noone)\nwith\n    | ex -> System.Console.WriteLine(\"\
    Katie not found\")\ntry\n    let noone = Map.find(\"Katie\") nicknames\n    System.Console.WriteLine(noone)\n\
    with\n    | ex -> System.Console.WriteLine(\"Katie not found\")\n```\n\nException-handling\
