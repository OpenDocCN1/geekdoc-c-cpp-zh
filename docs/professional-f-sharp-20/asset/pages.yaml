    \ =\nnew CSharpLibraryUsedWithFSharp(\n    11,\n    22,\n    SomeMutableProperty\
    \ = 55,\n    AnotherMutableProperty = 56);\n```\n\n# # F#, C#, and null\n\nIdiomatic\
    \ F# code avoids use as much as possible, in favor of option types where the goal\
    \ is to express lack of value. However, there are situations where you may be\
    \ calling C# code that does, in fact, to provide a proper C# null parameter:\n\
    \n```\n// this works\nlet shouldBeTrue = String.IsNullOrEmpty(null)\n// this does\
    \ not work\nlet notCompile = String.IsNullOrEmpty(None)\n```\n\nIt is important\
    \ to note that in the world of F#, nulls are to be avoided at most. When calling\
    \ C# code that might return null, it is often safer to check for that condition\
    \ and contain it at the source of the issue, like:\n\n```\n// this is your normal\
    \ null spelling C# function\nlet someRandomStrangeFunctionThatMightReturnNull\
    \ =\nmatch DateTime.Now.Day with\n    31 -> // This is a 31st day in a 31 Day\
    \ Month, Yipe!\n    _ -> null\n// how you would protect against such functions\
    \ in your F# code\nlet wontNull = match someRandomStrangeFunctionThatMightReturnNull\n\
    \    null -> None\n    v -> Some(v)\n```\n\nCode snippet FSharpLibraryReturningCSharp.fs\n\
    \nIn the following example, somesomeRandomStrangeFunctionThatMightReturnNull represents\
    \ a prototype-C# function that breaks out F# rules about nulling. This function\
    \ is not idiomatic F# but helps us understand what C# programs sometimes return\
    \ to null. The vontNull value calls that function but does so in a match statement,\
    \ which converts the null to a None if null is returned, otherwise, producing\
    \ a Some with the embedded value if such a value exists. This pattern should be\
    \ used around calls to non F# libraries, including C# programs, that either:\n\
    \n+   a. Known to return null in certain cases\n\n+   b. From an outside API that\
    \ might return null — or is unknown about its status as whether null is returned"
