  md: "# Data Binding | 369\n\ndesign time, one approach is to provide a series of\
    \ points that can be loaded by Visual Studio 2010's designer. A series data point\
    \ can be defined using a type with object-oriented members. Note that it is possible\
    \ to make these data points immutable. The following sample F# code defines a\
    \ data type to store each data point:\n\n```\ntype SeriesDataPoint(int index,\
    \ value) =\n    member this Index with get() = index\n    member this Value with\
    \ get() = value;\n```\n\nA sample data set modeled after the CR samples provided\
    \ in the following Silverlight Toolkit example shows a static member that can\
    \ be loaded by the XAML designer. With 10 data points using the SeriesDataPoint\
    \ type defined earlier, a reference to the System.Windows.Controls Toolkit assembly\
    \ is required to access the ObjectCollection type.\n\n```\nopen System.Windows.Controls\n\
    static SampleSeries =\n    let data = new ObjectCollection()\n    data.Add(new\
    \ SeriesDataPoint(1, 124.1))\n    data.Add(new SeriesDataPoint(2, 124.3))\n  \
    \  data.Add(new SeriesDataPoint(3, 125.7))\n    data.Add(new SeriesDataPoint(4,\
    \ 115.9))\n    data.Add(new SeriesDataPoint(5, 125.0))\n    data.Add(new SeriesDataPoint(6,\
    \ 133.6))\n    data.Add(new SeriesDataPoint(7, 131.9))\n    data.Add(new SeriesDataPoint(8,\
    \ 127.3))\n    data.Add(new SeriesDataPoint(9, 137.3))\n```\n\nCode Snippet SilverlightDataSet.cs\n\
    \nFor the XAML designer to load this ObjectCollection, declare the SampleDataSet\
    \ class as a resource in the App.xaml file.\n\n# Adding a Resource to the Application\
    \ XAML Element\n\nTo provide time binding, the Application.Resource element must\
    \ be added to the Silverlight application using XAML. Modifying the App.xaml file,\
    \ which is provided by the following XAML:\n\n```\n<Application\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n     x:Class=\"FSharpSilverlightDemo.App\"\
    >\n\n    <Application.Resources>\n        <!-- put resources here -->\n    </Application.Resources>\n\
    </Application>\n```\n\nCode Snippet et A .xaml"
