    \ Closed\n| Closed -> Closed\n```\n\nAnd again, thanks to the compiler checking\
    \ the F# compiler can do in the pattern-matching structs, if a new state is added\
    \ to the discriminated union, any pattern-matching code that fails to incorporate\
    \ that state immediately triggers a compiler error.\n\n# STRUCTS\n\nStructs, also\
    \ known within the .NET lexicon as \"value types,\" are not objects in the traditional\
    \ sense. Instead, value types are types that intend to be hosted inside other\
    \ objects, or simple enough that they represent a real, tangible value, a number.\
    \ All the .NET primitive types are value types—this is a deliberate decision on\
    \ the part of the .NET team, specifically so that the .NET environment avoids\
    \ the bifurcated type system that Java has, yet still avoid the overhead (as garbage\
    \ collection) that accompanies full objects.\n\n> For .NET value types, see https://mdn.microsoft.com/en-us/library/34dyytws\
