  md: "# 338 | CHAPTER 2C XML\n\nStill present is the problem of the nodes that code\
    \ will hit before the person or ship elements and the unrecognized elements like\
    \ fairyTalePrincess. These are covered in the pattern-match itself:\n\n```\nlet\
    \ extract node : seq<obj> =\nrec extract node : seq<obj> =\nmatch node with\n\
    \  Ship (s) ->\n    Seq.singleton (s : obj)\n  Person (p) ->\n    Seq.singleton\
    \ (p : obj)\n  when node.HasChildNodes ->\n    let children = seqi for n in node.ChildNodes\n\
    \    Seq.collect (fun (n) -> extract n) children\n  | ->\n    Seq.empty\nextract\
    \ node\n```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_345_0.png)\n\nCode snippet\
    \ XMLActivePatternDemo.fs\n\nAgain, we have to help the FP compiler just a little\
    \ bit by defining the returned sequence to be a sequence of objects. And than\
    \ rather an explicit match-rule for Node objects, which really isn't a data type\
    \ we're trying to work with, it's easier in case to use a pattern to determine\
    \ if the node has any children, and if so, walk through each of them and recursively\
    \ call extract on them. And, the coup de grace, if the node doesn't match any\
    \ of these three conditions, an empty sequence can be returned.\n\nLater, if there\
    \ is an element that is known to be ignorable—that is, one for which it can be\
    \ stated with certainty that it has nothing of interest to us, the parser can\
    \ recognize that element and use it as a signal to prune the XML hierarchy; this\
    \ is parsed:\n\n```\nlet extract node : seq<obj> =\nrec extract node : seq<obj>\
    \ =\nmatch node with\n  Ship (s) ->\n    Seq.singleton (s : obj)\n  Person (p)\
    \ ->\n    Seq.singleton (p : obj)\n  when node.HasChildNodes ->\n    let children\
    \ = seqi for n in node.ChildNodes\n    Seq.collect (fun (n) -> extract n) children\n\
    \  when node.Name = \"fairyTalePrincess\"\n  | ->\n    Seq.empty\nextract node\n\
    ```\n\n![](img/3b6b83f504d0e46470b40dafe9ce1960_345_1.png)\n\nCode snippet XMLActivePatternDemo.fs\n\
    \nThis will prevent the traversal of the nodes underneath the fairyTalePrincess\
    \ element and save a few matches and recursive calls. For a small element fairyTalePrincess,\
    \ it won't make a huge difference; in a multi-megabyte XML document consisting\
    \ of hundreds of elements long, it will."
