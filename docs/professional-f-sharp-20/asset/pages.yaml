- img_proc: true
  md: "# Comparison Constraint\n\nThe comparison constraint insists that the type\
    \ has support for doing comparison operations:\n```fsharp\ntype MustComparable<'a\
    \ when 'a : comparison>(data : 'a) =\n    member it.Greater(other : 'a) =\n  \
    \      data > other\n    member it.Lesser(other : 'a) =\n        data < other\n\
    ```\n\nHow the type implements its less-than or greater-than support is, of course,\
    \ entirely up to the type in question, so long as it satisfies the basic signature\
    \ of the two operations.\n\n# Null Constraint\n\nA null constraint simply lists\
    \ null in the constraint clause:\n```fsharp\ntype MustNullable<'a when 'a : null>(data\
    \ : 'a) =\n    class\n    end\n```\n\nWhen used, this tells the compiler that\
    \ the type parameter must be \"nullable,\" meaning the constant value null is\
    \ an acceptable value for. In .NET 4.0, this means every type (thanks to nullable\
    \ types introduced in .NET 2.0) is acceptable; the only exceptions are the F#\
    \ list, tuple, function, class, record, or union types.\n\n# Constructor Constraint\n\
    \nA constructor constraint, as its name implies, requires that a given constructor\
    \ member be present and accessible:\n```fsharp\ntype MustConstructible<'a when\
    \ 'a : (new (unit) -> 'a) =\n    member it.New() =\n        new 'a()\n```\n\n\
    This will be particularly useful in situations where a given component needs to\
    \ be instantiated within a particular context — rather than using Reflection to\
    \ invoke a constructor, the constructor can be directly called with confidence\
    \ (and better performance), as the compiler ensures it is present.\n\n# Value\
    \ Type and Reference Type Constraints\n\nAt times, it will be necessary to restrict\
    \ acceptable types to either the set of value types or reference types:\n```fsharp\n\
    type MustStruct<'a when 'a : struct() =\n    class\n    end\ntype MustClass<'a\
    \ when 'a : not struct() =\n    class\n    end\n```"
  merge: -1
