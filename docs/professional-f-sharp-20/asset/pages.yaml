    \ service is not too difficult. However, to use this, there is the matter of configuring\
    \ the client with a mapping so it can know where to make the call to:\n\n```\n\
    <configuration version=\"1.0\" encoding=\"utf-8\">\n<system.serviceModel>\n<binding>\n\
    <binding name=\"basicHttp\" timeout=\"00:01:00\" openTimeout=\"00:01:00\"\nreceiveTimeout=\"\
    00:00:00\" sendTimeout=\"00:01:00\" allowCookies=\"false\"\nbypassProxyOnLocal=\"\
    false\" hostComparisonMode=\"StrongWildcard\"\nmaxBufferSize=\"65536\" maxBufferSize=\"\
    524288\"\nmaxMessageSize=\"65536\"\nmaxReceivedMessageSize=\"messageEncoding=\"\
    Text\" textEncoding=\"utf-8\" transferMode=\"Buffered\"\n    useDefaultWebProxy=\"\
    true\">\n    <readerQuotas maxDepth=\"32\" maxStringLength=\"8192\">\n```\n\n\
    ![](img/3b6b83f504d0e46470b40dafe9ce1960_393_0.png)"
