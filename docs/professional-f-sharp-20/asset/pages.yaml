  md: '# Seq "Application" Operations


    These functions operate on the contents of the sequence, typically by taking a
    function as a parameter and invoking it once for each of the elements, passing
    that element as a parameter (also known as "applying") the function to each of
    the elements), to produce a result, either a single value or with all the results
    grouped into another.


    | | |

    |---|---|

    | choose fn seq | Applies fn to each element in seq, and if fn returns Some (x)
    for that element, includes it in the returned sequence |

    | compareWith fn sql1 sq2 | Compares each element of seq to sq using the comparison
    f (which is expected to take two parameters, one for each element, and return
    an int) |

    | exists fn seq | Returns true if any of the elements in seq, when passed to fn
    |

    | filter fn seq | Returns a sequence consisting of the elements in seq that, when
    passed to fn, cause it to return true |

    | find fn seq | Returns the first element in seq that returns true when passed
    to fn; if no such element exists in seq, throws an exception |

    | findIndex fn seq | Returns the index of the first element in seq that returns
    true when passed to; if no such element exists, throws an exception |

    | fold fn s seq | Applies fn to each element in seq, passing s in the element,
    allowing s to act as an accumulator for all the calls |

    | forall fn seq | Returns true if all of the elements in seq, when passed to fn,
    return true |

    | iter fn seq | Applies fn to each element in seq; if fn is expected to return
    unit |

    | iteri fn seq | Applies fn to each element in seq; fn receives both the element
    and its index, and is expected to return unit |

    | map fn seq | Applies fn to each element in seq; if fn is expected to yield a
    value, which is put into a sequence and returned |

    | mapi fn seq | Applies fn to each element in seq; fn receives both the element
    and its index, and is expected to yield a value, which is put into a sequence
    and returned |

    | reduce fn seq | Applies fn to each element in seq; fn receives both the element
    and its next element |

    | tryFind fn seq | Returns the first element of seq for which fn returns true,
    or None if no such element exists |

    | tryFindIndex seq | Returns the index of the first element in seq for which fn
    returns true, or None if no such element exists |


    There are some additional functions in the Seq module, but many of these are just
    additionally versions of the preceding functions (iter2, for example, is just
    a form of iter that can operate'
