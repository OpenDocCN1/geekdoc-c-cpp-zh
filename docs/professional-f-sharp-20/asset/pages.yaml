    # PATTERN GUARDS


    Despite all the power inherent in the various pattern types, F# developers will
    still periodically find

    situations where a pattern-match is clearly the best construct to use, yet the
    match criteria

    just isn''t quite a-to-one match with any of the existing pattern types. For those
    situations, the

    # language provides the capability to use a when clause on the pattern, effectively
    a Boolean check

    that must pass for the clause to be fired:


    ```

    let p = new Person(''Rick'', ''Minerich'', 35)

    let message = match (p FirstName) with

    | when p.Age > 30 ->

    | ''Never found''

    | ''Minerich'' when p.FirstName == ''Rick'' ->

    | ''Also never found''

    | ''Minerich'' ->

    | ''Hiya, Rick!'' ->

    | ''Who are you?'' ->

    System.Console.WriteLine(''We got {0}'', message);

    ```


    In essence, when the clause gives the F# developer the ability to attach any arbitrary
    criteria to the

    pattern-match, above and beyond those criteria defined by the various pattern-match
    rules already

    described. This can be easily abused, because any number of clauses can string

    together using the Boolean operators, like:


    ```

    let p = new Person(''Rick'', ''Minerich'', 35)

    let oldFogey (person : Person) = =

    match person with

    | person.Age >= 35 ->

    (person.FirstName == ''Ted'' ||

    person.LastName == ''Neward'' ||

    person.FirstName == ''Aaron'' ||

    person.LastName == ''Erickson'') ->

    true

    | false

    System.Console.WriteLine(''{0} is an old fogey.'', 1);

    p, isOldFogey p

    ```


    In these cases, it''s better to restructure the code to be more intentional about
    what the restrict-

    tions are, either by breaking the pattern-match into multiple matches, using active
    patterns, or out

    into separate functions entirely.


    A refactoring of the preceding code might produce:


    ```

    let isOldFogey (person : Person) =

    | .. (b) =

    ```'
