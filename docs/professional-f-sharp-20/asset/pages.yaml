    \ prefer one or the other, depending on the aesthetics of the syntax.\n\n# RECORD\
    \ TYPES\n\nThe record type sits itself halfway between a tuple and a \"class\"\
    \ type, as defined in classical\nobject-oriented languages. The tuple is a lightweight\
