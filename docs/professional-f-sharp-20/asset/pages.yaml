    LastName : string

    mutable Age : int

    mutable Spouse : NutPerson )


    But, as with other discussions around (im)mutability, the general preference is
    to prefer immutable until the need for mutability has been proven.


    # Record Type Implicit Members


    Like the value type, F# provides some implementation of common members "for free."
    Specifically, like the value type, F# compiler includes an implementation of Equals()
    and GetHashCode() based on structural equality — that is, if two record instances
    are of the same record type and contain the same contents on a field-for-field
    basis, then they are considered equal and have the same hash code. In addition,
    with value type, a certain amount of relational comparison code can be inferred,
    making it possible for simple record types to be compared against one another:


    ```

    let a = { FirstName="Ted", LastName="Newward"; Age=38 }

    let b = { FirstName="Ted", LastName="Newward"; Age=38 }

    System.Console.WriteLine("a.Equals(b)?")

    if a = b then "yes" else "no"

    System.Console.WriteLine("a <> b?")

    if a <> b then "yes" else "no"

    if a < b then "yes" else "no"

    ```


    As with value type, the comparisons are done on a field-for-field basis; if more
    control over the various operations are needed, declare and implement those members
    on the record type directly.


    # SUMMARY


    F# defines a number of constructs that act as a kind of "run-up" to full-fledged
    class types, and these are often used only as supplements or replacements to a
    class hierarchy. Enumerated types are generally useful only in interop scenarios
    against other .NET languages, with the exception of those cases where flags and
    multiple-case values are used. Discriminated unions are an exceptionally powerful
    way to represent a bound of set types and values that define each of those bound
    set cases. Record types provide a "classes light" ability that can be used as
    a "named tuple" type that also have built-in behavior.


    But when the .NET developer needs nothing less than a full-fledged class type,
    F# supports such definitions, as described in the next chapter.'
