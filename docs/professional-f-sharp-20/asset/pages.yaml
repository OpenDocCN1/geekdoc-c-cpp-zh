- img_proc: true
  md: "Languages like C# and Visual Basic, writing genericized code for anything but\
    \ the simplest of cases becomes frustrating and difficult, because those languages\
    \ require explicit type descriptors that must be used anywhere a type is used.\
    \ For example, a generic \"queue\" class, a first-in-first-out (FIFO) data structure\
    \ that maintains an order of items pushed into it, would look something like this\
    \ in C:\n\n```\npublic class Queue<T>\n{\n    public void Clear();\n    public\
    \ bool Contains(T t);\n    public int Count { get; }\n    public T Dequeue();\n\
    \    public void Enqueue(T o);\n    public T Peek();\n}\n```\n\nIts cousin in\
    \ Visual Basic would look much simpler, but with different punctuation marks:\n\
    \n```\nClass Queue(Of T)\n    Public Overridden Sub Clear()\n    Public Overridden\
    \ Function Contains(t As T) As Boolean\n    Public Overridden ReadOnly Property\
    \ Count As Integer\n    Public Overridden Sub Dequeue() As T\n    Public Overridden\
    \ Sub Enqueue(o As T)\n    Public Overridden Function Peek() As T\n```\n\nLater,\
    \ the developer may want to take that Queue and put a bunch of Person objects\
    \ into it, which, because the Queue is instantiated with a Person type at its\
    \ construction, the compiler can ensure that only Person objects are put into\
    \ the Queue. Any attempt to put a non-Person object into Queue will fail at compile-time\
    \ and thus prevent a bug from occurring.\n\nFor C# and VB developers, the story\
    \ gets around more or less ends here: Parameterized types provide type-safe collections,\
    \ and beyond that, they get awkward and hard to use and rarely show up. For example,\
    \ any attempt to put a student (which derives from Person) into a Person-only\
    \ queue would work, but attempts to pass a Queue of Students where a Queue of\
    \ Persons was expected not, would drive O-O developers mad.\n\nParameterized types\
    \ have a long, rich history in functional programming languages, and to influence\
    \ often, they far exceed the O-O community in their usage. Because the compiler\
    \ can infer generic types in some cases, sometimes the only thing to say about\
    \ parameterized types is that they're there, and the developer need not worry\
    \ about it beyond that.\n\nIn many cases, F# code will want or need to make the\
    \ parameterization more explicit, and the F# language provides some simple rules\
    \ to do so."
