- img_proc: true
  md: "Note that the not is not a general “reverse” of the type constraint but is\
    \ a formal part of the reference type constraint. That is, we cannot write “not\
    \ null” to create a “not-nullable” type constraint.\n\n# # Other Constraints\n\
    \nOther type constraints (enumeration type constraints, delegate constraints,\
    \ and unmanaged constraints) are available, but are marked by the F# documentation\
    \ as Not Intended for Common Use. The explicit member constraint is also labeled\
    \ as such, but its use has shown up enough in F# code and samples that knowing\
    \ how to read it is a good idea, even if it's not recommended for casual use.\n\
    \n# # STATICALLY RESOLVED TYPE PARAMETERS\n\nIn cases, the F# compiler can eliminate\
    \ the generic type parameter entirely replace the type parameter with the actual\
    \ type at compile time. These kinds of type parameters are indicated with the\
    \ caret symbol (^) instead of the single-quote when declaring the generic type,\
    \ as they are most commonly used with the type constraints listed in the previous\
    \ section. In particular, they are used frequently with the F# library and for\
    \ reason reason least be readable by F# developers.\n\nAs the names imply, the\
    \ difference between statically resolved type parameters and “regular” type parameters\
    \ is statically resolved type parameters are replaced at compile time (as C++\
    \ generics are, rather than at runtime to instantiate the generic type, as “classic”\
    \ generics). As a result, there are a few differences between “regular” generics\
    \ and statically resolved type parameters.\n\nFor starters, statically resolved\
    \ type parameters cannot be used—only methods and functions (described in Part\
    \ III, “Functional Programming”) can have statically resolved type parameters.\
    \ For so, it is possible to write a generic function that does some odd or highly\
    \ specialized math:\n\n```\nlet inline (+) (x : a) (y : a) =\n    x * y\n\nlet\
    \ result = 1 + 2\nConsole.WriteLine(\"result = (0)\", result)\n```\n\nIn addition,\
    \ the following example demonstrates, statically resolved type parameters can\
    \ be used on inline functions, where “regular” generic parameters cannot. (Functions\
    \ and inline functions are described more in Chapter “13”.)\n\nBecause statically\
    \ resolved type parameters are compile-time resolved, they allow for an additional\
    \ generic constraint type.\n\n# # Explicit Member Constraint\n\nAn explicit member\
    \ constraint tells the compiler to ensure that a member is present on the type,\
    \ such as a method or property:\n\n```\ntype MustBeDoable<'a when 'a : (member\
    \ DoIt : unit -> unit)() = =\n    class\n    end\n```"
