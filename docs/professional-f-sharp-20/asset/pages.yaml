  md: '# Discriminated Union Types


    having all these details in mind distracts the F# developer. Mentioning this serves
    two purposes: One, because seeing how the language construct matches up against
    the CLR sometimes offers insight into its use, and two, because it''s an example
    of how the F# language wants to "hide" the physical details of things from the
    developer to reduce the amount of complexity the developer must keep in.


    In will probably be viewed by some object-oriented purists as a heret assertion,
    some of the simpler hierarchical-based trees traditionally represented in object-oriented
    languages using inheritance-based trees of classes can be more easily modeled
    using a discriminated union:


    ```

    type Employee =

    | Grunt of string

    | Manager of string * Employee list

    member Name =

    | match e with

    | Grunt(n) -> n

    | Manager(n, _) -> n

    ```


    Because this is a discriminated union makes it trivial to determine how many employees
    a given Employee is working for, with Grunts returning an empty list (because,
    after all, if one is a grunt, has no direct reports):


    ```

    type Employee =

    | Grunt of string

    | Manager of string * Employee list

    member Name =

    | match e with

    | Grunt(n) -> n

    | Manager(n, _) -> n

    ```


    This can be simpler using a judicious application of higher-order functions, and
    pattern-matching to make it absolutely trivial to calculate the size of a given
    Employee''s empire:


    ```

    type Employee =

    | Grunt of string

    | Manager of string * Employee list

    member Name =

    | match e with

    | Grunt(n) -> n

    | Manager(n, _) -> n

    member e.Subordinates =

    | match e with

    | Grunt() -> []

    | Manager(_, es) -> es

    member e.Empire =

    | match e with

    | Grunt() -> []

    | Manager(_, es) -> es

    | List.collect (fun (e : Employee) -> e.Empire)

    ```'
