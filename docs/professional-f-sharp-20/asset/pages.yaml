  md: "Creation and Consumption | 205\n\nThis gives the compiler the necessary support\
    \ to ensure that Blame can only be placed on assemblies, modules, classes, enums,\
    \ interfaces, structs, constructors, fields, or methods.\n\nAt this point, the\
    \ attribute is good for use; actually digging it out at runtime, however, requires\
    \ a bit more code, not within the attribute itself but within the code that wants\
    \ to use the attribute.\n\n# Consumption\n\nConsuming the custom attribute requires\
    \ the use of .NET Reflection API, which provides access to the full-fidelity metadata\
    \ contained within a .NET assembly. A full discussion of .NET Reflection API is\
    \ beyond the scope of this particular problem, but fortunately, the Exception\
    \ class provides an escape: Because the TargetSite of the Exception object provides\
    \ the Reflective element that generated the exception, it is relatively trivial\
    \ to find the offending party, if a Blame attribute is attached to it.\n\nOf course,\
    \ the exception must be caught:\n\n```\ntry\n  faultyMethod() | ignore\n  with\n\
    \    ex ->\n      Console.WriteLine(\"Bam!\")\n```\n\nEach object (whether it\
    \ represents a method, class, or some other Reflective element) has a method defined\
    \ on, GetCustomAttributes(), that returns an array of objects containing any custom\
    \ attributes defined on that Reflective element. So, for example, when the preceding\
    \ call is invoked, the Exception object's TargetSite will point to a System.Reflection.MethodInfo\
    \ object that represents the faultyMethod method. When GetCustomAttributes() is\
    \ called on, it will return any custom attributes defined on faultyMethod, of\
    \ which there is currently only one.\n\nHowever, because a Reflective element\
    \ can have zero-many custom attributes on it, GetCustomAttributes() is an easy\
    \ way to filter out all the custom attributes except the one that holds interest,\
    \ by passing the Type of the attribute.\n\nGetCustomAttributes also takes a Boolean\
    \ parameter, indicating whether the search for a custom attribute should take\
    \ into account-defined versions of the element; for example, if the method in\
    \ question is an overridden member of a defined class, it should search on base-class\
    \ defined versions of that method to see if custom attribute appears.\n\nThus,\
    \ digging out the Blame attribute looks like this:\n\n```\ntry\n  faultyMethod()\
    \ | ignore\n  with\n    ex ->\n      let tgt = ex.TargetSite\n      let customAttr\
    \ = =\n        tgt.GetCustomAttributes(typeof<BlameAttribute>(), true)\n     \
    \ if customAttr.Length > 0\n        Console.WriteLine(\"Aha! \",\" + customAttr[0])\n\
    \      else\n        Console.WriteLine(\"Nobody to blame, sorry!\")\n```"
