    operator inside the min function and inferred that the arguments to min must have
    the same restrictions as the arguments to less-than. That is, both must be the
    same type and have the comparison context. The less-than operator could just well
    be another function. In that case the argument types would be inferred from the
    return of that function.


    There are a few important caveats to. The first is that numerical operators are
    resolved to int not observed being used in another context. For example, if you
    define a simple add function without context you might expect it to generalize
    to all of the potential inputs of the plus operator. This is not the case; instead
    it will take and return integers by default.


    +   > let add a b = a + b;


