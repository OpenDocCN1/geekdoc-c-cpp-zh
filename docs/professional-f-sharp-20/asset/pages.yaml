  md: "Active patterns can be thought of in three general forms: a single-case active\
    \ pattern, which is used to convert data from one type to another for use in a\
    \ pattern-match; a partial-case active pattern, which helps to match when data-conversion\
    \ failures are possible or likely; and a multi-case active pattern, which can\
    \ take the input data and break it into one of several different groups.\n\n#\
    \ Single Case\n\nThe single-case active pattern is conceptually the easiest to\
    \ understand: It allows the F# developer to specify a function that is called\
    \ from inside the pattern-match — rather than the match — so as to allow for processing\
    \ or conversion of the data.\n\nFor example, when a developer starts to use pattern-matching,\
    \ it is fairly common to use it to handle all sorts of multi-case logic, such\
    \ as situations where we want to determine if it matches a particular input pattern.\
    \ It is not too difficult to imagine validations in a web application where a\
    \ developer determines whether a text contains \"dangerous\" input, such as embedded\
    \ HTML tags of some form:\n\n```\ninputData = \"This is some <script>alert(1)</script>\"\
    \ data\nlet contains istr = contains \"script\"\n  instr.Contains schstr\nSystem.Console.WriteLine(\"\
    Does the text contain bad data?\" + \\\n  (contains inputData).ToString())\n```\n\
    \nObviously a real implementation would be screening for much more before dealing\
    \ <script> tags, so as refinement is necessary:\n\n```\ninputData = \"This is\
    \ some <script>alert(1)</script>\" data\nlet contains schstr = contains (instr:\
    \ string; string) =\n  instr.Contains schstr\nSystem.Console.WriteLine(\"Does\
    \ the text contain bad data?\" + \\\n  (contains \"script\" inputData).ToString())\n\
