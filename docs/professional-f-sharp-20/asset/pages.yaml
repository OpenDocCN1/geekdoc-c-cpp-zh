  md: "Do not be concerned about the possible performance impact in potentially creating\
    \ a tuple just to pass in. In actuality, F# tuples argued turn into normal .NET\
    \ calls with discrete arguments under the hood. Both types of functions will look\
    \ the same from other .NET languages. The only real difference is how they are\
    \ used in the F# language syntax.\n\n# FUNCTIONS AS FIRST CLASS\n\nAccording to\
    \ Structure and Interpretation of Computer Programs (http://mitpress.mit.edu/sip/full-text/book/book.html),\
    \ a language construct is considered to be first class if it has no restrictions\
    \ than other constructs of that language. In particular, the following properties\
    \ are listed:\n\n+   - It can be passed as a parameter.\n- It can be returned\
    \ as a result.\n- It can be stored in variables and data structures.\n\nIf you\
    \ consider function pointers, then you might say even however C inherit from it,\
    \ C lacks the capability to create new functions at runtime. Functions cannot\
    \ be composed or partially applied. In this way they are clearly inferior to use\
    \ a `struct` data type.\n\nWith the introduction of anonymous delegates in 2.0,\
    \ C# functions also have all the properties listed and like somewhat cumbersome\
    \ to use, may be considered first-class language constructs. The main difference\
    \ with F# is that treating functions as simple to do requires little syntax, and\
    \ is leveraged everywhere when writing in the idiomatic language style.\n\n# Recursive\
    \ Functions\n\nMuch as a data type can have a reference to itself, a true first\
    \ class function should be able to as. In fact, it should be able to call itself\
    \ using that reference as it might any other function. A function that does this\
    \ is called a recursive function and the process of using recursive functions\
    \ is recursion.\n\nTo write recursive in F#, you must define the function with\
    \ the `rec` keyword. The keyword binds the function in such a way as to be visible\
    \ to itself.\n\n```\nrec pow x n = if n < 0\n                then x * pow x (n\
    \ - 1)\n                else 1.0\n```\n\nThis function raises its x to the nth\
    \ power. It does this by calling itself repeatedly, each time reducing the value\
    \ of its parameter n by multiplying x by the result of the last call to pow. In\
    \ F#, this is a poor implementation of pow.\n\nTo understand why, you need to\
    \ understand how this function will execute at runtime. Each time pow calls itself,\
    \ another stack frame is generated. In the ideal case, n eventually becomes zero\
    \ and pow will return 1 instead of calling itself again. Each layered call will\
    \ then return, and the result will be multiplied by x. Finally, the result of\
    \ all those multiplications will be returned."
