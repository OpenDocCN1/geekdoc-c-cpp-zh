    As previously mentioned, when a type inherits from a base type, it picks up all\
    \ the behavior of that base type. For example, every type defined in F# will automatically\
    \ inherit the ToString() method (among others) from the System.Object base type,\
    \ because every class in the .NET ecosystem inherits from System.Object. However,\
    \ the default behavior of ToString() leaves much to be desired for most types,\
    \ as it usually just prints the type name:\n\n```\nlet p = new Person(\"Ken\"\
    , \"Sipe\", 40)\nlet p_str = p.ToString()\nSystem.Console.WriteLine(p_str)\n//\
    \ prints \"Inheritance+Person\"\n```\n\nThis behavior, although nice to have picked\
    \ up without requiring any additional work on our part, is not enough to make\
    \ clear.\n\nFortunately, most C# or Visual Basic developers already know, the\
    \ .NET environment allows derived classes to override (replace) the behavior of\
    \ a base type by defining the same method on the derived type, and F# is no different:\n\
    \n![](img/3b6b83f504d0e46470b40dafe9ce1960_183_0.png)\n\n```\n<Class>\ntype Person(fn,\
    \ ln, a) =\n    new(Person(\"\", \"\", 0))\n    member.FirstName = fn\n    member.LastName\
    \ = ln\n    member.Age = a\n    override member p (other : Person) =\n       \
    \ System.Console.WriteLine(\"Howdy\", (0), from \"1!\")\n        other.FirstName,\
    \ p.FirstName)\n    override member ToString() =\n        System.String.Format(\"\
    [Person: {0} ({1}) ({2})\",\n        fn, ln, a)\n```\n\nCode snippet Inheritance.fs\n\
    \nThe key difference to a method attempting to override a base type method and\
    \ defining a new method is the use of the keyword override in place of member.\
    \ The compiler ensures"
