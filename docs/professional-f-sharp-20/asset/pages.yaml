    val numbers : int list = [2; 4; 5; 6; 7; 8; 9; 10];

    ```


    ```

    let even, odd = List.partition (fun x -> x % 2 = 0) numbers;

    ```


    ```

    val odd : int list = [1; 3; 5; 9];

    val even : int list = [2; 4; 6; 8];

    ```


