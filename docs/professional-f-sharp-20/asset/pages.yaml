    # Backward Composition (&<)


    The backward composition operator takes two functions and composes them into a
    single function in which the first is applied to the input and then the left is
    applied to the result of that. As you might have expected, this is exactly the
    same as forward composition except with reversed arguments.


    Take a look at how the backward composition operator can be used to make a functionally
    equivalent example to one shown in forward piping.


    +   > findNamesOfPlacesOver5MilInUppercase =

    List.map (fun p: Place) -> p.Name.ToUpper ()

    << List.filter (fun p: Place) -> p.Population > 5000000);


