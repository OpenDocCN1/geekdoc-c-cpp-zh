  md: "Creating an instance of the generic type is straightforward, using similar\
    \ syntax as creating a nonge-ric instance, but passing a type argument in brackets:\n\
    \n```\nlet sl = new Stack<System.String>()\n```\n\n(almost) any expression where\
    \ a type is expected, a type parameter can be used. Thus, for example, the type\
    \ parameter can be used in a typeof expression to obtain the Type object for the\
    \ type it represents:\n\n```\ntype Reflector<a> =\n    member r.GetMembers() =\n\
    \        let ty = typeof<<a>\n    ty.GetMembers()\n```\n\nOf course, genericizing\
    \ the entire type here is a bit unnecessary, because the type is itself inside\
    \ the GetMembers() method. In this case, the type parameter can be localized to\
    \ the method itself, making it a type parameter.\n\n# Member Type Parameters\n\
    \nMember type parameters are localized using generics, limiting the scope of the\
    \ type parameter use to the method on which it is declared:\n\n```\ntype Reflector2()\
    \ =\n    static member GetMembers<<a>() =\n        typeof<<a>.GetMembers()\n```\n\
    \nTypical use of generic methods often require no special syntax, because type\
    \ inference can often pick up the type to use from its context, but in cases when\
    \ an explicit type needs to be given (such as in the preceding code), the bracketed\
    \ type parameter between the method name and the argument list (if any):\n\n```\n\
    let stringMembers = Reflector2.GetMembers<System.String>()\n```\n\nOf course,\
    \ a type can have (different) type parameters at both the type scope and method\
    \ scope, if wanted.\n\n# TYPE CONSTRAINTS\n\nOne thing the compiler has to be\
    \ careful about making promises it can't keep. For example, the following code\
    \ (which will not compile), the compiler can be sure that this will work:\n\n\
    ```\ntype InterestingType<a>(data : 'a') =\n    member it.DoIt() =\n        data.DoSomething()\n\
    ```\n\nSpecifically, because DoSomething() isn't a method that is guaranteed to\
    \ appear on whatever type happens to be passed in for 'a' when the InterestingType\
    \ instance is created, the compiler can be"
  merge: -1
  pgno: 202
- img_proc: true
  md: "certain that the call will work. As a result, it fails to compile this code,\
    \ complaining that “Lookup on Object of Indeterminate Type Based on Information\
    \ Prior to This Program Point.\"\n\nSeveral solutions present themselves. One\
    \ is to eliminate the generic entirely and use traditional O-O techniques to handle\
    \ this, by creating an interface that declares the DoSomething method, and for\
    \ types that are passed in the InterestingType constructor to be instances of\
    \ interface:\n\n```\n<Interface>\ntype IDoSomething\n    abstract DoSomething\
    \ : unit -> unit\n\ntype InterestingType(data : IDoSomething) =\n    member it.DoIt()\
    \ =\n        data.DoSomething()\n```\n\nDoing this has some drawbacks, stemming\
    \ from the fact that the type is not known at compile-time—only a part of the\
    \ type is known (it inherits from the DoSomething interface). Although this is\
    \ sufficient in this simple demo, it won't always do.\n\nThe second approach is\
    \ to use a type constraint, which is a declaration, enforceable by the compiler,\
    \ that must be met when:\n\n```\n<Interface>\ntype IDoSomething\n    abstract\
    \ DoSomething : unit -> unit\n\ntype InterestingType<'a when 'a : IDoSomething>(data\
    \ : 'a) =\n    member it.DoIt() =\n        data.DoSomething()\n```\n\nThe when\
    \ clause in the type parameter declaration tells the compiler that whatever type\
    \ is passed in for this parameter must meet the requirement, which in this case,\
    \ the -> syntax, means that the 'a type must inherit from the named type (IDoSomething).\n\
    \nThe following sections explore the many other kinds of type constraints that\
    \ are enforced by the F# compiler.\n\n# Type Constraint\n\nA constraint, shown\
    \ in the previous text, requires that the type argument inherit from the type\
    \ specified, or if the type specified is an interface, that the type implement\
    \ interface.\n\n# Equality Constraint\n\nThe equality constraint insists that\
    \ the type has the capability to be compared against other values of its type:\n\
    \n```\ntype MustBeEquatable<'a when 'a : equality>(data : 'a) =\n    member it.Equal(other\
    \ : 'a) =\n        data = other\n```\n\nThis is a commonly used constraint, along\
    \ with the comparison constraint, next."
  merge: -1
