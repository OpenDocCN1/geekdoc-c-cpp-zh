  md: '# 22


    # Silverlight


    WHAT''S IN THIS CHAPTER?


    +   - Working with Visual Studio Project Templates

    - Using the Silverlight Toolkit

    - Working with data binding


    Silverlight is one of the most popular new facets of .NET and is used to broadcast
    the Olympic Games, Netflix HD streaming, and financial analyst dashboards and
    is quickly gaining popularity as a principal enterprise application platform.
    Silverlight is a web browser plug-in runtime environment for executing .NET code.
    Originally dubbed WPF/E for Windows Presentation Framework Everywhere, Silverlight
    offers a powerful vector-based presentation for creating dynamic content. Most
    development in Silverlight is done in C# or VB.NET. But because the underlying
    runtime environment is a special CLR that is compatible with F#, a few tweaks
    can unleash the full power of F# in Silverlight applications.


    # OVERVIEW


    Silverlight is a Rich Internet Application (RIA) platform for developing both
    enterprise and public Web-based applications. Silverlight 3 and later versions
    include support for out-of-browser applications and network status awareness for
    enabling offline mode. Silverlight 4 supports printing, local fonts, webcam, microphone,
    group policy object support, and many other features that make it an excellent
    platform for both Web and enterprise development.


    The recommended architecture for Silverlight development separates the application
    into two tiers not including the database tier. The client tier includes presentation
    logic, for example client-side validation and animation, plus potentially some
    client-side business logic needed for'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'lightweight calculations to reduce round trips to the server. See Figure 22-1.
    The application server tier includes side validation, business logic, and database
    interaction. The client tier is implemented in Silverlight and deployed as a XAP
    file that is executed in the Silverlight runtime in the browser. The application
    server can be implemented using RIA Services or any number of service forms including
    XML, JSON, and OData. Intellectual property is one consideration when determining
    where to place the business logic. Also, data that requires secure access should
    be filtered on the server. For example, it would not be wise to cache project
    names on the client if the user is not allowed to access them. The business logic
    to differ the project names would run on the application server.


    ![](img/3b6b83f504d0e46470b40dafe9ce1960_363_0.png)


    **Figure 22-1** By leveraging the processing power of the user''s computer to
    handle any quick response of presentation data, Silverlight has an advantage over
    other web development platforms such as ASP.NET. Because the CLR is multithreaded
    and GPU-accelerated, it offers a richer development platform than Flash. Built-in
    constructs for asynchronous workflows, F# can easily take full advantage of Silverlight''s
    multithreading capability on the client, exploiting the increasing number of cores
    per system produced by the many-core era of computing.


    Using Isolated Storage, a Silverlight application can cache data and user preferences
    on the client machine for offline use or responsiveness when the application connects
    to the backend systems. Be aware, it is wise to keep sensitive data, sensitive
    logic, and intellectual property behind the firewall. A XAP file is just a ZIP
    file with a different name, and the contents can be reverse engineered. Enterprise
    applications built on Silverlight may present less concern regarding reverse engineering
    since customers can download the Silverlight application as opposed to a publicly
    accessible application hosted on the Web open to anyone with an Internet connection.
    During the system design phase, it is important to plan how and where the code
    executes a Silverlight application. Proper planning and architecture account for
    security, scalability, and performance.'
