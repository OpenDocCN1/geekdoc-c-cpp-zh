  md: "# 5.5 Introduction to String\n\n+   - A string is an array of characters stored\
    \ in consecutive memory locations.\n- In strings, the ending character is always\
    \ the null character '\\0'. The null character acts as a string terminator.\n\
    - **A string is a collection of characters.** Strings are always enclosed in double\
    \ quotes \"string_constant\"\n- Strings are used in string handling operations\
    \ such as,\n  - Counting the length of a string.\n  - Comparing two strings.\n\
    \  - Copying one string to another.\n  - Converting lower case string to upper\
    \ case.\n  - Converting upper case string to lower case.\n  - Joining two strings.\n\
    \  - Reversing string.\n\n# 5.5.1 Definition\n\n+   - Array of character are called\
    \ strings.\n- String is nothing but an array of characters ended with null character\
    \ ('\\0').\n- The sequence of characters that is treated as a single data item.\
    \ In general, the character array is called as string.\n- A string is an array\
    \ of characters terminated by a special character called NULL character (i.e.\
    \ '\\0'). Strings are always enclosed in double quotes.\n\n**Example: Suppose\
    \ the string \"INDIA\" is called string and it is stored in memory as:\n\n| I\
    \ | N | D | I | A | \\0 |\n| 2000 | 2002 | 2004 | 2006 | 2008 | 2010 |\n\n+  \
    \ - Each character is stored in 1 byte as its ASCII code. Since the string is\
    \ stored as an array, it is possible to manipulate individual characters using\
    \ each subscript or pointer notation.\n- \"INDIA\" is a string containing 5 characters.\
    \ So the array will be a 6-element array because last character of a string is\
    \ \"\\0\". The representation can be shown as:\n\n| Element No. | | No. | Array\
    \ Element | Corresponding data |\n| 1 | 0 | word [0] | I |\n| 2 | 1 | word [1]\
    \ | N |\n| 3 | 2 | word [2] | D |\n| 4 | 3 | word [3] | I |\n| 5 | 4 | word [4]\
    \ | A |\n| 6 | 5 | word [5] | \\0 |"
