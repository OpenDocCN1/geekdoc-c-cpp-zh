  md: '# Procedure Oriented Programming using C 8.2 File Handling


    +   - The sequence of bytes of data flowing into a program is an input stream
    and the flowing out into output stream.


    +   - C provides following streams:

    1. stdin: This is a standard input stream, (opened for input).

    2. stdout: This is a standard output stream, (opened for output).

    3. stderr: This is a standard error stream, (opened for output).


    # 8.2 Defining and Opening a File


    # 8.2.1 Defining a File [April 15, Oct. 16]


    +   - File is a collection of information stored in the secondary memory, having
    some filename, which is stored in the directory.


    OR


    +   - File is a set of instructions.


    +   - File is not opening, before opening a file we need to establish a file pointer.


    ```

    FILE * fptr;

    ```


    +   - FILE is a structure defined in the header file, "stdio.h".

    - This header file stores all the information regarding the file i.e. name of
    the file, in what mode it is opened, starting buffer address, a character pointer
    which points to the character being read. The above statement establishes a buffer
    area. Each file opening has its own stream. Before processing any file, it must
    be opened.


    # 8.2.2 Opening a File


    +   - On opening a file link is established between the program and the operating
    system through the FILE structure, since operating system returns a pointer to
    the structure FILE.

    - Opening associates the file name with buffer area. The fopen () opens a file
    whose name is pointed to by ''filename'' and returns the stream that is associated
    with it.

    - The file opening function is written as:


    ```

    fopen (file-name, file-type);

    ```


    where,

    file-name = Name of data file to be opened

    file-type = Mode or manner in which data will be used

    (i.e. whether for reading, writing etc.)'
