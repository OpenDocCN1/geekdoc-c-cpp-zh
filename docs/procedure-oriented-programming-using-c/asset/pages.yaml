  md: "Here, is an example of initialize product structure:\n\n```\nstruct product\n\
    {\n  char name[50];\n  double price;\n} book = (\"C programming language\", 40.5);\n\
    ```\n\nIn example, we define product structure, then we declare and initialize.\n\
    \n# How to Declare Structure Variables:\n\nWe are already seen how to declare\
    \ structure. But we cannot use it in the program, since it is not a variable name.\
    \ Hence, we cannot assign any values, cannot perform arithmetic and logical operations.\n\
    \nTo perform all such actions, we need to associate structure variable with the\
    \ structure type.\n\nThere are three methods of associating structure variables\
    \ with the structure-type.\n(a) Structure-variable names in structure declaration.\n\
    (b) Structure-variables as data declarations.\n(c) Array of structure-variables.\n\
    \n# Structure-variable Names in Structure Declaration:\n\nThe structure declaration\
    \ may contain structure variable names for structure-variables.\n\n# Syntax:\n\
    \n```\nstruct structure-name\n{\n  data-type1 element 1;\n  data-type2 element\
    \ 2;\n  :\n  :\n  data-type element n\n} var 1, var 2, ...... var n;\n```\n\n\
    For example:\n\n```\nstruct employee\n{\n  char empname[20];\n  char empcode[6];\n\
    \  float basic;\n} empl1, emp2, emp3;\n```\n\nHere, emp 1, emp 2, emp 3 are three\
    \ variables of structure type employee."
