  md: '# Procedure Oriented Programming using C


    # File Handling


    +   The fgets() function reads up to num-1character from stream and store them
    into a character array pointed to str. Characters are read until either a newline
    or an EOF is received or until the specified limit is reached. After the character
    has been read, a null is stored in the array immediately after the last character
    read. A newline character will be retained and be part of the array pointed to
    str.


    +   If successful, gets() returns str; a null pointer is returned upon failure.
    If a read error occurs, the content of the array pointed to str is indeterminate.


    +   The standard format for gets() is:


    ```


    The fputs() function writes the content of the string pointed to str by the specified
    stream. The null terminator is not written. The fputs() function returns negative
    on success and EOF on failure.

    ```


    +   The format for gets() is:


    ```

