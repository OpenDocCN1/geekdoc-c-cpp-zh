  md: "# Procedure Oriented Programming using C\n\n# 6.2 Structures and Union\n\n\
    +   The structure tag is optional and each member definition is a normal variable\
    \ definition, such as int; or float f; or any other valid variable definition.\
    \ At the end of the structure's definition, before the final semicolon, you can\
    \ specify one or more structure variables but it is optional. Here is the way\
    \ you would declare the Book structure:\n\n```\nstruct Books\n{\n  char title[50];\n\
    \  char author[50];\n  char subject[100];\n  int book_id;\n} book;\n```\n\n# 6.1.2\
    \ Declaration and Initializing Structure\n\nOct. 16, April 16\n\n+   1. Declaration\
    \ of Structure:\n\n+   To define or declare a structure you can use struct keyword.\n\
    \n```\nSyntax:\nstruct structure_name\n{\n  <data-type> element 1;\n  <data-type>\
    \ element 2;\n  :\n  :\n  <data-type> element n;\n} struct_var;\n```\n\nExample:\n\
    \n```\nstruct emp_info\n{\n  char emp_id[10];\n  char name[100];\n  float sal;\n\
    }emp;\n```\n\n> Note:\n- Structure is always terminated with semicolon (;).\n\
    - Structure name as emp_info can be later used to declare structure variables\
    \ of type in a program.\n\n+   2. Initializing Structure:\n\n+   C programming\
    \ language treats a structure as a custom data type therefore you can initialize\
    \ a structure like a variable."
