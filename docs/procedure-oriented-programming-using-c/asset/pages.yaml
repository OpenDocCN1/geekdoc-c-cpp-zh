- img_proc: true
  md: '![](img/5327b00803aba629c47a0e51c7948002_51_0.png)


    +   * C programming language assumes any non-zero and non-null values as true
    and if it is

    either or null then it is assumed as false value.


    +   * C programming language provides following types of decision making statements.


    | Statement | Description |

    | --- | --- |

    | 1. if statement | An if statement consists of a boolean expression followed
    by one or more statements. |

    | 2. if...else statement | An if statement can be followed by an optional else
    statement, which executes when the boolean expression is false. |

    | 3. nested if statements | You can use one if or else if statement inside another
    or else statements. |

    | 4. switch statement | A switch statement allows a variable to be tested for
    equality against a list of values. |

    | 5. nested switch statements | You can use one switch statement inside another
    switch statements. |


    +   * There may be a situation when you need to execute a block of code several
    number of times. In general statements are executed sequentially: The first statement
    in function is executed first, followed by the second, and so on.


    +   * A loop statement allows us to execute a statement or group of statements
    multiple times. Fig. 3.2 shows the general from of a loop statement in most of
    the programming languages.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Procedure Oriented Programming using C

    3.3

    Decision Making and Looping


    ![](img/5327b00803aba629c47a0e51c7948002_52_0.png)


    Fig. 3.2


    +   C programming language provides following types of loop to handle looping
    requirements.

    | Type of Loop | Description |

    |---|---|

    | 1. while loop | Repeats a statement or group of statements while a given condition
    is true. It tests the condition before executing the loop body. |

    | 2. for loop | Execute a sequence of statements multiple times and abbreviates
    the code that manages the loop variable. |

    | 3. do...while loop | Like a statement, except that it tests the condition at
    the end of the loop body |


    +   C provides following types of statements:

    **1. Expression statement**: Number of expression statements are assignments or
    function calls.

    **2. Compound statement**: Number than two statements grouped together in { }
    forms a compound statement.

    **3. Selection statement**: These statements involve condition checking and choose
    one of several controls. if ... else, switch are the examples of selection statement.

    **4. Null statement**: These statements does not perform any action. A semicolon
    ; on the line of code is a null statement.

    **5. Iteration statement**: These statement specify looping, where a statement
    has to be repeatedly executed a specific number of times as the test expression
    is satisfied. for, do while and while loop are the examples of iteration statement.

    **6. jump statement**: These statements transfer control unconditionality goto,
    break, continue are the examples of jump statements.'
