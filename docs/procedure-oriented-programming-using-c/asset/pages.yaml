  md: "# # Chapter 6...\n\n# # Structures and Union\n\n# ## Contents ...\n\n+   -\
    \ 6.1 Introduction to Structure\n  - 6.1.1 Definition\n  - 6.1.2 Declaration and\
    \ Initializing Structure\n  - 6.1.3 Accessing Members of Structure\n- 6.2 Operations\
