  md: "# Procedure Oriented Programming using C 7.5 C Preprocessor\n\n+   The file\
    \ inclusion statement can be written in two ways:\n\n+   1. #include \"file-name\"\
    \nOR\n2. #include <file-name>\n\n+   If we use the first way, 'C' would search\
    \ for file: filename in the current working directory as well as the specified\
    \ list of directories.\n\n+   If we use the second way, file: filename will be\
    \ searched only in the specified list of directories.\n\nFor example: #include<stdio.h>\n\
    #include<string.h>\n#include<conio.h>\n\n+   The extension of the inclusion file\
    \ need not be always '.h' or 'C'. Also, main() should be in the program and not\
    \ in the included file.\n\n# 7.5 Conditional Compilation Directives\n\n+   Several\
    \ directives allows you to selectively compile portions of your program's source\
    \ code, this process is known as conditional compilation.\n\n+   The preprocessor\
    \ provides directives such as #ifdef, #if, #elif, #undef, #ifdef and on which\
    \ you can write code which can be compiled depending on the conditions stated.\n\
    \n+   1. #if and #elif:\n\nThe directive tests the expression following it and\
    \ depending upon the result of the expression decides whether to compile statements.\n\
    \n```\nSyntax:\n#if <conditional-expression>\nstatement 1\n...\nstatement n\n\
