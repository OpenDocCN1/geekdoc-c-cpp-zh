  md: '# Procedure Oriented Programming using C


    1.4


    Introduction to C Language


    # 1.2 History of C


    +   * The development of C was a cause of evolution of programming languages like
    ALGOL 60, CPL (Combined Programming Language), BCPL (Basic Combined Programming
    Language) and B.

    * Fig. 1.1 shows history of C language.

    * C was developed by Dennis Ritchie at Bell Laboratories in 1972. Most of its
    principles and ideas were taken from the earlier language B, BCPL and CPL.

    * CPL was developed jointly between the Mathematical Laboratory at the University
    of Cambridge and the University of London Computer Unit in 1960s.

    * CPL (Combined Programming Language) was developed with the purpose of creating
    a language that was capable of both independent programming and would the programmer
    to control the behavior of individual bits of information. But the CPL was too
    large for many applications.

    * In 1967, BCPL (Basic Combined Programming Language) was created as a scaled
    version of C while still retaining its features. This process was continued by
    Ken Thompson.

    * B Language was a scaled down version of BCPL. B Language was written for the
    systems programming.

    * In 1972, a co-worker of Ken Thompson, Dennis Ritchie developed C Language by
    taking some of the generality found in BCPL to the B language.

    * The original PDP-11 version of the Unix system was developed in assembly language.

    * In 1973, C language had become powerful enough that most of the Unix kernel
    was rewritten in C. This was we one of the first operating system kernels implemented
    in a language other than assembly.

    * In 1978, Dennis Ritchie and Brian Kernigh published the first edition "The C
    Programming Language" and commonly known as K&C.

    * The 1989 standard for C is commonly referred as C89.

    * During 1990s the development of C++ language consumed most programmers attention
    but work on C continued quietly along with a new standard for C being developed
    and the result was the 1999 standard for C, usually referred as C99. It retained
    all features of C89.'
