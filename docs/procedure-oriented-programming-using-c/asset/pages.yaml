  md: "Procedure Oriented Programming using C 1.6 Introduction to C Language\n\n#\
    \ 1.3 Basic Structure of C Programming [April 16]\n\n+   - Following blocks shows\
    \ structure of a C programming.\n\n| Library File Access | |\n| --- | |\n| Definitions\
    \ | |\n| Declarations | |\n| Functions | |\n| main() { |\n| Declarations |\n|\
    \ Statements |\n } |\n| User-defined functions | |\n| funct1() { |\n| |\n } |\n\
    | funct2() { |\n| |\n } |\n\n+   - The C program beginning executing at main().\
    \ In the above declaration library file are used to give instructions to compiler\
    \ for linking purpose.\n\n+   - All constants and global variables declarations\
    \ is done here. In second box consists of main(). Local variable declarations\
    \ and statements define main(). These functions are called in main(). function.\n\
    \n+   - The last and third part consists of all user defined functions. These\
