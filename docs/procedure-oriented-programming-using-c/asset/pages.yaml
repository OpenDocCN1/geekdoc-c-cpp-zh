  md: '# Procedure Oriented Programming using C 8.3 File Handling


    +   The different modes in which the file can be opened are:


    | Mode | Meaning |

    |---||

    | "r" | Open a text file for reading |

    | "w" | Create a text file for writing |

    | "a" | Append to a text file |

    | "rb" | Open a binary file for reading |

    | "wb" | Create a binary file for writing |

    | "ab" | Append to a binary file |

    | "rt" | Open a text file for read/write |

    | "wt" | Create a text file for read/write |

    | "at" | Open or create a text file for read/write |

    | "r + b" | Open a binary file for read/write |

    | "w + b" | Create a binary file for read/write |

    | "a + b" | Open or create binary file for read/write |

    | "rt" | Open a text file for reading |

    | "wt" | Create a text file for writing |

    | "at" | Append to a text file |

    | "r + t" | Open a text file for read/write |

    | "w + t" | Create a text file for read/write |

    | "a + t" | Open or create a text file for read/write |


    +   Important points to remember while selecting modes:

    1. When the mode is "writing"w a with the specified name is created if the file
    does not exist. If the file already exists, the contents are deleted and the file
    is opened a fresh.

    2. When the purpose is ‘appending’, the file is opened with the current contents
    safe. A file with the specified name is created if the file does not exist.

    3. If the purpose is “reading”, and if it exists then the file is opened with
    the current contents safe. If the file does not exist, it creates an error.

    4. r + the existing file is opened to the beginning for reading and writing.

    5. w + Same as w except both reading and writing.

    6. a + Same as a except both for reading and writing.


    +   From the above explanations, it is expected the above table would be clear.


    Examples:


    ```

    file *f1, *f2;

    f1 = fopen("data", "w");

    f2 = fopen("input", "r");

    ```


    We can open any number of files at a time.'
