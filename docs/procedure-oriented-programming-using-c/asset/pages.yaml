  md: "![](img/5327b00803aba629c47a0e51c7948002_247_0.png)\n\n# Fig. 7.1: 'C' program\
    \ processing\n\n+   - From 'C' source program, the preprocessor removes all the\
    \ directives i.e. the statements that start with '#' after taking actions. This\
    \ code without directives is passed to the 'C' compiler.\n- The compiler converts\
    \ 'C' source program which is without preprocessor directive to the object code.\
    \ The linker links the object code with the standard library files to get the\
    \ executable code.\n- Preprocessor directives can be placed anywhere in the 'C'\
    \ program. But, they are generally placed at the beginning of the program before\
    \ main(). They can be recognised as 'C' program statements starting with '#'.\n\
    \n> Note: Preprocessor directives are not terminated with a semicolon ().\n\n\
    # 7.3 Macro Substitution Directives [Oct. 14, 16, Nov. 15]\n\n+   - A micro is\
    \ a small subgroup which contains executable code.\n- A micro is also similar\
    \ to a function.\n- An augmented macro is also called a function macro and the\
    \ macroname can have arguments.\n- A macro can be nested within another macro\
    \ this is called as nesting of macros.\n- Micro substitution replaces every occurrence\
    \ of a simple macro in the program.\n- Micro substitution is obtained using `#define\
    \ directive`.\n- `#define` defines constant value and can be any of the basic\
    \ data types.\n- It is used to assign names to different constants or statements\
    \ which are to be used repeatedly in a program. These defined values or statement\
    \ can be used by main or in the user defined functions as well. They are used\
    \ for:\n  1. defining a constant,\n  2. defining a statement, and\n  3. defining\
    \ a mathematical expression."
