  md: '# Procedure Oriented Programming using C


    # Introduction to C Language


    In C language, the user defined data types are created using:


    +   **Enum Data Type:** This is an user defined data type having finite set of
    enumeration constants. The keyword ''enum'' is used to create enumerated data
    type.


    Syntax: `enum [data_type] {const1, const2, ..., const n};`

    Example: `enum mca(software, web, seo);`


    +   **typedef:** It is used to create new data type. But it is commonly used to
    change existing data type with another name.


    Syntax: `typedef [data_type] synonym;`

    or

    `typedef [data_type] new_data_type;`

    Example: `typedef int integer; rno;`


    +   **Structure:** A structure is composed of one or more built-in and/or derived
    types (excluding function). Every element of the structure has separate storage
    space. So the size of a variable of structure will have the memory space equal
    to the sum of memory spaces of all individual elements. Keyword struct is used
    to define a structure.


    +   **Union:** A union is also composed of one or more built-in and/or derived
    data types (excluding function). Keyword union is used to define a unions.


    # 1.5 Operators [Oct. 14, 16, April 16]


    +   Operators are the symbol which operates a value or a variable.

    Operators represent an operation.

    Operators symbols which are used to perform logical and mathematical operations
    are called operators.


    C is rich in built-in operations. Operators instruct the compiler to perform some
    actions on operands.


    An operator can be unary (one operand), binary (two operands) or ternary (three
    operand).

    nExample: `unary -5`, `binary 3 + 2`, `ternary conditional operators (a > b) ?
    a:b`


    # 1.5.1 Types of Operators


    +   1. Arithmetic Operators:


    +   It is also called as ''binary operators''. It is used to perform arithmetical
    operations. These operators operate on two operands.'
