  md: "# Procedure Oriented Programming using C 7.3 C Preprocessor\n\n#define directive\
    \ defines an identifier and a character that will be substituted for the identifier\
    \ each time it is encountered in the source file.\n\n| Syntax: | #define | macro-name\
    \ | value |\n| --- | --- | --- | --- |\n| | ↓ | ↓ | ↓ |\n| | Macro | Macro | Macro\
    \ |\n| | definition | template | expansion |\n\n**Program 7.1: Program for macro\
    \ processor directory.**\n\n```\n#include <stdio.h>\n#define height 100\n#define\
    \ number 3.14\n#define letter 'A'\n#define letter_sequence \"ABC\"\n#define backslash_char\
    \ '\\?'\n\nvoid main() {\n    printf(\"value of height: %d \\n\", height);\n \
    \   printf(\"value of number: %f \\n\", number);\n    printf(\"value of letter:\
    \ %c \\n\", letter);\n    printf(\"value of letter_sequence: %s \\n\", letter_sequence);\n\
    \    printf(\"value of backslash_char: %c \\n\", backslash_char);\n    getch();\n\
    }\n```\n\n**Output:**\n\n```\nvalue of height: 100\nvalue of number: 3.140000\n\
    value of letter: A\nvalue of letter_sequence: ABC\nvalue of backslash_char: ?\n\
    ```\n\n+   * Macro substitution statement replaces the macro-name with the given\
    \ value wherever it appears from the first blank after the macro-name to the end\
    \ of the file."
