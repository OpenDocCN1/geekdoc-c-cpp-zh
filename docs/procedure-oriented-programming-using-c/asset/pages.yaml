  md: 'In the program function fgetc() reads characters from data file and putchar()
    will display them on the screen. Individual data characters can also be processed
    as they are read.


    Thus, fputc is a function used to write data character in a file.


    ```

    int fputc (int ch, FILE *ptvar)

    ch = character to be written

    ptvar = File pointer

    ```


    fgetc() is the counterpart of the function fputc, and it is used to read a character
    from the file.It returns the character to the calling program.


    ```

    int fgetc (FILE * ptvar)

    ```


    # 1. getc() and putc():


    These are the simplest input/output functions used for files. With these we can
    put in and get a single character from a file.


    To use putc it is necessary that the file must be opened in writing mode. It is
    similar to puts () function. The fopen () opens a file whose name is pointed to
    by ''filename'' and returns the stream that is associated with it.


    The difference is that putc can only put a single character. The similarity is
    puts a string on screen and putc() puts a character in file.


    # The general format of putc() is,


    ```

    putc (c, fpl)

    where c is a character and

    fp1 is a file pointer.

    ```


    The fgetc function returns the next character from the specified input stream
    and increments the file position indicator. The character is read as an unsigned
    char that is converted to an integer. If the end-of-file is reached, fgetc() returns
    EOF. If fget() encounters an error, EOF is also returned.


    # The general format of getc(),


    ```

    getc (fp2)

    where, fp2 is a file pointer which is already opened in reading mode.

    ```


    When a file is opened the file pointer set to the beginning of the file - when
    we perform certain operation in the file pointer to some variable address.


    Whereas, when a file is closed the compiler automatically puts a EOF mark. This
    determines the end of file. Again if the file is opened the pointer marks to the
    beginning of file.


    To stop inputting data or to close the file we can use ^z [control z] at the end
    of input. This will close the file.'
