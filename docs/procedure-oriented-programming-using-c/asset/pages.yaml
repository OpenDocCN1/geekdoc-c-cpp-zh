  md: 'Procedure Oriented Programming using C


    # 1.4.6.1 Declaring and Initializing Variables


    +   - Variables should be declared in the C program before to use. Memory space
    is not allocated for a variable while declaration. It happens only on variable
    definition.


    +   - Variable initialization means assigning a value to the variable.


    | Type | Syntax | Example |

    | --- | --- | --- |

    | 1. Variable declaration | data_type variable_name; | int x, y, z; char flat,
    ch; |

    | 2. Variable initialization | data_type variable_name = value; | int x = 50,
    y = 30; char flag = ''x'', ch=''1''; |


    Difference between Variable Declaration and Definition:


    | Variable declaration | Variable definition |

    | --- | --- |

    | 1. Declaration tells the compiler about data type and size of the variable.
    | 1. Definition allocates memory for the variable. |

    | 2. Variable can be declared many times in a program. | 2. It can happen only
    one time for a variable in a program. |

    | 3. The assignment of properties and identification to a variable. | 3. Assignments
    of storage space to a variable. |


    # 1.4.6.2 Types of Variables


    +   - There are two types of variables i.e., local and global variables.


    1. Local Variables:


    +   - Variables that are declared inside a function are called local variables.


    +   - Local variables can be used only by the statement which is inside the block
    and in which variables are declared.


    +   - Local variables cannot be used outside the block. Lifetime of the local
    variable is till the end of the block i.e. a local variable is created when block
    enters and destroyed when block exit.


    +   - We can declare same variable name within two different blocks. However,
    we cannot have same variable name within one block.'
