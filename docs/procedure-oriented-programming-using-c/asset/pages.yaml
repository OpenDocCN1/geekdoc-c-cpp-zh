    \ loop.\n\n![](img/5327b00803aba629c47a0e51c7948002_76_0.png)\n\n# 3.3.1 for Loop\n\
    \n+   * This is an entry controlled loop statement.\n* In loop structure, more\
    \ than one variable can be initialized.\n* One of the most important feature of\
    \ this loop is that the three actions can be taken at time like variable intilization,\
    \ condition checking and increment/decrement.\n* For the loop can be more concise\
    \ and flexible than that of while and do-while loops.\n\nSyntax:\n\n```\nfor(initialization;\
    \ test-condition; increment/decrement)\n{\n    statements;\n}\n```\n\n+   * In\
    \ above syntax, the given three expressions are seperated ; (Semicolon).\n\n#\
    \ How for loop works in C programming?\n\n+   * The initial expression is initialized\
    \ only once at the beginning of the for loop. Then, the test expression is checked\
    \ by the program. If the test expression is false, loop is terminated.\n* But,\
    \ if test expression is true, then the codes are executed and update expression\
    \ is updated. Again, the test expression is checked. If it is false, loop is terminated\
    \ and if it is true, the same process repeats until test expression is false.\
    \ Fig 3.9 (b) shows flowchart for the working of loop in C programming."
