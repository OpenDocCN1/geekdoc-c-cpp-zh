  md: "# Procedure Oriented Programming using C\n\n# Program 3.27: Program to print\
    \ \"Hello!\",\n\n```\n#include<stdio.h>\nvoid main()\n{\n    int i, j;\n    for(i=1;i<=3;i++)\
    \ /* Outer for Loop */\n    {\n        for(j=1;j<=2; j++) /* Inner for Loop */\n\
    \        {\n            printf(\"Hello!\\n\");\n        }\n    }\n}\n```\n\nOutput:\n\
    Hello!\nHello!\nHello!\nHello!\nHello!\nHello!\n\n+   Here, there are two for\
    \ loops. The first (outer) for loop has condition i<=3 and the second (inner)\
    \ for loop condition i<=2. The inner loop will get executed completely for every\
    \ iteration of the outer for loop.\n| i | j | |\n|---|---||\n| i=1 | j=1, j=2\
    \ |\n| i=2 | j=1, j=2 |\n| i=3 | j=1, j=2 |\nHence, when in all there will be\
    \ 3x2 = 6 iterations\n\nThus, 'Hello' will get displayed 6 times.\n\n# Program\
