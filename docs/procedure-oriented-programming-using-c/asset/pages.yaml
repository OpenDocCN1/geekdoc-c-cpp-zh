  md: "# Procedure Oriented Programming using C\n\nThe first line function_type function_name(parameters\
    \ list) is known as function header and the statements enclosing the curly braces\
    \ are known as function body.\n\n+   1. Function Header: It includes three parts:\n\
    \    (i) Function type: It specifies type of value that the function is expected\
    \ to return to the program calling the function. It is also called as return type.\
    \ If function is not returning any values we have to specify it as.\n    (ii)\
    \ Function name: It is any valid C identifier and therefore must follow the rules\
    \ for creation of variable names in C.\n    (iii) Parameters list: It declares\
    \ variables that will receive the data sent by the calling program. They serve\
    \ as input data to the function to carry out specific task. Since, they represent\
    \ the actual input values they are referred as formal parameters or arguments.\n\
    \nFor example:\n\n```\nint float_average(int x, int y int x)\n{\n}\ndouble square(double\
    \ x, int n)\n{\n}\nfloat volume(int a, int b, int c)\n{\n}\nvoid print_area()\n\
    {\n}\n```\n\n+   2. Function Body: It contains the declarations and statements\
    \ necessary for performing required task. It contains three parts:\n    (i) Local\
    \ variables declaration: It specifies the variables needed by the function locally.\n\
    \    (ii) Function statement: That actually performs task of function.\n    (iii)\
    \ The return statement: It returns the value specified by the function.\n\n+ \
    \  For example:\nfloat mul(float x, float y)\n{\nfloat result; /* local variable\
    \ */\nresult = x * y; /* find the result */\nreturn(result); /* return the result\
    \ */\n}\nvoid display(void)\n{\nprintf(\"Hello World!\"); /* only print the value\
    \ */\n}"
