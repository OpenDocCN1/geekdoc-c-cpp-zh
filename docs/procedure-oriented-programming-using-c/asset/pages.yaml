  md: 'Procedure Oriented Programming using C


    Functions and Pointers


    # 4.6 Introduction to Pointers [Oct. 14, Nov. 15]


    +   - A pointer is a variable that holds a memory address. This memory address
    is the location of another object in memory.

    - For example, if one variable contains the address of another variable, the first
    variable is said to point to the second variable.

    - Pointers are used in C program to access the memory and manipulate the address.
    Fig. 4.3 shows the above situation.


    ![](img/5327b00803aba629c47a0e51c7948002_144_0.png)


    +   - A pointer is a variable that represents the address (location) of a data
    item in the computer''s memory.

    - Every data item is stored in memory, occupies a space somewhere in memory.

    - Pointer is a variable which holds the memory address of another variable.

    - Pointers are represented by ''*''. It is a derive data type in C.

    - Pointer returns the value of stored address.


    Syntax: <data_type> * pointer_name;


    # 4.6.1 Definition of Pinter


    +   - A pointer is a variable that stores the memory address of another variable.


    OR


    +   - A pointer is a variable that represents the location (rather than the value)
    of a data item such as a variable or an array element.


    OR


    +   - Pointers are the variables that contain the address of another variable
    within the memory.


    # 4.6.2 Features of Pointer


    +   - Features of pointer are listed below:

    - 1. Pointer variable should have prefix ''*''.

    - 2. Combination of data types is not allowed.

    - 3. Pointers are more effective and useful in handling arrays.'
