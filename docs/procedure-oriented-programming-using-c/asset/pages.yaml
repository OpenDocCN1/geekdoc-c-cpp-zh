  md: 'Procedure Oriented Programming using C


    4.2 Functions and Pointers


    # # 4.1 Introduction [Oct. 14]


    +   - Functions are the building blocks of C language.

    - A number of statements grouped into a single logical unit are called a function.

    - A function is a group of statements that perform a particular task. Every C
    program has at least one function which is main(), and all the most trivial programs
    can define additional functions.

    - The use of functions programming earlier since repeated statements can be grouped
    into functions. Splitting the program into separate function may make the program
    more readable and maintainable.

    - C functions can be classified into two types:


    +   1. Library functions/Built in functions,

    2. User-defined functions.


    +   - The library functions are the functions which are already defined in C''s
    library i.e. header files.

    - For example, the functions scanf() and printf() are the library functions defined
    in stdio.h as functions scanf() is defined in math.h and get() is defined in conio.h.

    - User defined function is the function defined by the programmer who has written
    the program. The task is performed by the user.

    - For example, the main() function is an user-defined function. We decide what
    it is written in this function.


    # ## 4.1.1 Definition of Function


    +   - Function is a set of instructions in a logical sequence, which performs
    specified task.


    OR


    +   - A function is a module or block of program code which deals with a particular
    task. Making functions is a way of isolating one block of code from other independent
    blocks of code.


    OR


    +   - The function is a self contained block of statements that performs a coherent
    task of the same kind.


    # ## 4.1.2 Purpose of Function


    +   - Functions serve two purposes:


    +   1. They allow a programmer to say: ''this piece of code does a specific job
    which stands by itself and not be mixed with anything else'',

    2. Second they make a block of code reusable since a a function can be reused
    in many different contexts without repeating parts of the program text.


    # ### Need Functions:


    +   - The functional program facilitates top-down modular programming approach
    as shown in Fig. 4.1.'
