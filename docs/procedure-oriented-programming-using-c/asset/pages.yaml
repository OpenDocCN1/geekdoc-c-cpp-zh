  md: '# 8.2.3 Closing a File


    +   - It is necessary that when the program a file is opened it should be closed
    as soon as the work with the file is over or atleast at the end of program.


    +   - This ensures that all outstanding information associated with the file is
    flushed out from the buffers and all links to the file are broken. It also prevents
    any accidental misuse of the file. Also we have to close the file if we want to
    open the same file in a different mode.


    Syntax:


    ```

    fclose(file-pointer);


    OR

    fclose all();

    ```


    For example:


    ```

    FILE *p1, *p2;

    p1 = fopen("input", "r");

    p2 = fopen("output", "w");




    fclose(p1);

    fclose(p2);

    ```


    +   - The syntax for closing the file is the same, irrespective of the mode in
    which it is opened.


    # End of File (eof))


    +   - Sometimes, we do not know how big the file is. To detect end of file we
    use eof();


    +   - In files, a special character EOF denotes the end of file. End-of-File can
    be detected, as soon as this character is read. In binary files, the EOF is not
    there.


    Syntax:


    For example:


    ```

    while (! eof (fptr))

    {



    }

    ```'
