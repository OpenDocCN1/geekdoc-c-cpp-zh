  md: "# Procedure Oriented Programming using C\n\n# Introduction to C Language\n\n\
    +   The program prints out \"Hello World\" to the standard output, which is usually\
    \ a terminal or screen display.\n\n```\n#include <stdio.h>\nint main(void) {\n\
    \    printf(\"Hello World\\n\");\n    return 0;\n}\n```\n\nExplanation of 'C'\
    \ program are given below:\n**#include<stdio.h>**nThis first line of the program\
    \ is a preprocessing directive, #include. This causes the preprocessor — first\
    \ tool to examine source code as it is compiled — substitute the line with the\
    \ entire text of the stdio.h file. stdio.h contains declarations for standard\
    \ input and output functions as printf.\n\n**int main(void)**nThis line indicates\
    \ a function named main is being defined. The main function serves a special purpose\
    \ in C programs. The run-time environment calls the function to begin execution.\
    \ The type specifier indicates that the return value, the value of evaluating\
    \ the main function is returned to its invoker (in this case the run-time environment),\
    \ is an integer. The keyword void as a parameter list indicates that the main\
    \ function takes no arguments.\n\n{\nThis opening curly brace indicates the beginning\
    \ of the main function.\n\n**printf(\"Hello World\\n\")**\nThis line calls (executes\
    \ the code for) a function named printf, which is declared in the included header\
    \ stdio.h and supplied from a system library. In this case, the printf function\
    \ is passed (provided) with a single argument, the address of the first character\
    \ in the string literal \"Hello World\\n\". The semicolon (;) terminates the statement.\n\
    \n**return 0**\nThis line terminates the execution of the main function and returns\
    \ it to the integer value 0, which is interpreted by the run-time system as an\
    \ exit code,(indicating successful execution).\n\n}\nThis closing curly brace\
    \ indicates the end of code for the main function.\n\n# **Compile and execute\
    \ C program:**\n\n+   Compilation is the process of converting a C program which\
    \ is user readable code into machine readable code which is '0' and '1'.\nThis\
    \ compilation process is done by a compiler which is inbuilt program in C.\nAs\
    \ a result of compilation, we get another file called executable file. This is\
    \ also called binary file.\nThis binary file is executed to get the output of\
    \ the program based on the logic written into it."
