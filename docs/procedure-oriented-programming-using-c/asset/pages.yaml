    string2 are two string variables.


    | Function | Purpose |

    | --- | --- |

    | strcpy(string1, string2) | It copies/assigns the content of string2 into string1
    |

    | strncpy( string1, string2, n) | It copies only leftmost n characters from string1
    into string2 |

    | strcat(string1, string2) | Concatenates (joins) the string2 to end of string1.
    String2 is appended to string1 by removing null character of string1, placing
    string2 from there and placing null character at the end. |

    | strncat(string1, string2, n) | Concatenates (joins) the left n characters of
    string2 to the end of string1 |

    | strcmp(string1, string2) | Compares two strings Returns = 0 if they are equal
    >0 if string1 > string2 <0 if string1 < string2 The numeric difference of first
    non-matching characters of the strings is returned if they are not equal. |

    | stricmp(string1, string2) | Compares two strings, ignoring the case For example:
    "Nirati" and "nirali" shows equal. |

    | strncmp(string1, string2, n) | Similar to strmp(), with difference is that,
    it compares only left n characters of string1 to string2 |

    | strlen(string1) | Finds the length of specified string i.e. number of characters
    in the string. |

    | strstr(string1, string2) | It searches whether string2 is contained in string1
    If found, returns the position (pointer) of the first occurrence of string2, otherwise
    it returns NULL pointer. |


