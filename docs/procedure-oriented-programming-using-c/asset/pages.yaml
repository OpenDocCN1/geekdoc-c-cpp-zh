    \ the variable cannot be initialized as all it does point the variable name at\
    \ a storage location that has been previously defined.\n- Extern storage class\
    \ defines a global variable that is accessible by any function in the program.\
    \ This class are declared outside functions.\n\nSyntax: `extern {data_type} {variable_name};`;nExample:\
    \ `extern int a;`\n\n+   - The variable access time is very fast as compared to\
    \ other storage classes. But few registers are available for user programs.\n\
    - The variables of this class can be referred to as 'global' or external variables.'\
    \ They are declared outside the functions and can be invoked anywhere in a program.\n\
    - External variables: Variables that are both active and throughout the entire\
    \ program are known as external variables. They are also known as Global variables.\
    \ These variables can be accessed by any function in the program. The keyword\
    \ 'extern' can be used to declare a variable inside the main function.\n- In some\
    \ cases, the same global variable defined in file X is used again in file Y. Then\
    \ how the compiler know that the variable used in file Y is actually the same\
    \ variable declared in file X.\n- The answer is, use the extern specifier to the\
    \ global variable defined elsewhere. In this condition, we declare a global variable\
    \ in file X, and then declare the variable using the extern specifier in file\
    \ Y.\n\n```\nint a = 0;          /* a is a global variable */\nextern int b; \
    \         /* an allusion to a global variable y */\nint main()\n{\n    extern\
    \ int c;      /* an allusion to a global variable z */\n    int I;           \
    \    /* I is a local variable */\n\n    return 0;\n}\n```\n\nFeatures of Extern\
    \ – storage class are listed below:\n\n+   - 1. Scope : Global\n- 2. Storage :\
