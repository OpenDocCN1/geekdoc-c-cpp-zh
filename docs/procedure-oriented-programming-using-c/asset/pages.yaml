  md: '# Procedure Oriented Programming using C


    # Comparison between break and continue statements:


    | Sr. No. | break Statement | continue Statement |

    | 1. | break statement causes loop termination. | continue statement does not
    causes loop termination. |

    | 2. | Syntax: break; break statement takes control to the first statement outside
    the control statement. | Syntax: continue; continue statement takes control to
    the beginning of the loop. |

    | 3. | It is used in switch and loops statements. | It is only used in loop. |

    | 4. | Example: init i = 4; while(i) { i--; if (i = 2) break; printf("%d", i);
    } | Example: init i = 4; while(i) { i--; if (i = 2) continue; printf("%d", i);
    } |


    # ### 3.4.4 exit() Function


    +   - The function terminates the program totally. Such forced program termination
    is required when an error condition is detected by the program.


    +   - As we know the program is automatically terminated when the last statement
    in the main() function is executed. But, to forcibly terminate the program, the
    exit() function is employed.


    Syntax:


    ```

    exit(n);

    ```


    +   - The parameter n is an integer value, which decides the exit status.


    +   - We can use the exit() function without ''n'' also as,


    +   - In cases, the value of n is considered as 0 by default. Any non-zero of
    n stands for different error conditions in program.


