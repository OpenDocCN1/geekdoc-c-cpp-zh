  md: '# Procedure Oriented Programming using C 1.5 Introduction to C Language


    | Year of establishment | Language name | Description |

    | --- | --- | --- |

    | 1960 | ALGOL-60 ↓ | ALGOL is an acronym for Algorithmic Language developed by
    Cambridge University. It was the first structured procedural programming language,
    developed in the late 1950s and once widely used in Europe. But it was too abstract
    and too general structured language. |

    | 1963 | CPL (Combined Programming Language) ↓ | CPL is an acronym for Combined
    Programming Language. It was developed at Cambridge University. |

    | 1967 | BCPL (Basic Combined Programming Language) ↓ | BCPL is an acronym for
    Basic Combined Programming Language. It was developed by Martin Richards at Cambridge
    University in 1967. BCPL was not powerful enough. So, it failed. |

    | 1970 | B ↓ | B language was developed by Ken Thompson at AT & T Bell Laboratories
    in 1970. It was machine dependent. So, it leads to specific problems. |

    | 1972 | C ↓ | ''C'' Programming Language was developed by Dennis Ritchie at AT
    & T Bell Laboratories in 1972. This is general purpose, compiled, structured programming
    language. Dennis Ritchie studied the BCPL, then improved and named it ''C'' which
    is the second letter of bcpl. |

    | 1978 | K&R C ↓ | Dennis Ritchie and Brian Kernigh published the first edition
    "The C Programming Language" and commonly known as K&R. |

    | 1989 | C89/C90 standard ↓ | First standardized specification for C language
    was developed by American National Standards Institute in 1989. C89 and C90 standards
    refer to the same programming language. |

    | 1999 | C99 standard | Next revision was published in 1999 that introduced new
    features like advanced data types and other changes.It retained nearly all of
    the features of C89, thus C is still C. |


    Fig. 1.1: Brief History of C language'
