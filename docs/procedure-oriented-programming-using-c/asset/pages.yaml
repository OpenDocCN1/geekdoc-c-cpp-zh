  md: '# Procedure Oriented Programming using C 4.8 Functions and Pointers


    # Return Values:


    +   - A function may or not send back any value to the calling function. If it
    does, it is done by return statement.


    +   - The return statement also sends the program control back to the calling
    function.


    +   - It is possible to pass a calling function any number of values but called
    function can only return one value per call, at most.


    +   - The return statement can take one of the following forms (syntax):

    ```

    return;

    OR

    return(value);

    OR

    return(variable);

    OR

    return(expression);

    ```


    +   - The first plain return does not return any value; it acts much as closing
    brace of the function. The remaining three statements control eliminates the brackets
    also. When the return is executed, the program control immediately transfers back
    to the calling function. None of the statements written after return are executed
    afterwards.


    +   - For example:

    ```

    return(x);

    printf("Bye..Bye");

    ```


    +   - In this case the print statement will not be executed in any case. Because
    the return statement will transfer program control immediately back to the calling
    function.


    +   - Some examples of return:

    ```

    int div(int x, int y)

    {

    int z;

    z = x / y;

    return z;

    }

    ```


    +   - Here, instead of writing three statements inside the function div(), we
    can write a single statement as:

    ```

    return(x*y);

    OR

    return x*y;

    ```'
