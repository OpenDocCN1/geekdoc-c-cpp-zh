  md: '# Chapter 7...


    # C Preprocessor


    # Contents ...


    +   7.1 Introduction

    7.2 Definition of Preprocessor

    7.3 Macro Substitution Directives

    7.4 File Inclusion Directives

    7.5 Conditional Compilation Directives

    * Questions


    # 7.1 Introduction


    +   * Preprocessor is a macro processor program that processes the code before
    it passes through the compiler. It operates under the control of preprocessor
    command lines and directives.

    * Preprocessor directives are placed in the source program before the main line
    before the source code passes through the compiler it is examined by the preprocessor
    for any preprocessor directives. If there is any appropriate actions are taken
    then the source program is handed over to the compiler.

    * It is called a macro processor because it allows you to define macros, which
    are brief abbreviations for longer constructs.

    * Preprocessor directives follow the special syntax rules and begin with the symbol
    #


    # 7.2 Definition of Preprocessor [April 16]


    +   * A preprocessor is a program that processes our program before it is passed
    to the compiler for compilation.


    OR

    * Preprocessor directives are actually the instructions to the compiler itself.
    They are not translated but operated directly by the compiler.

    * The commands of a preprocessor are called preprocessor directives. Each preprocessor
    directive begins with a # symbol.

    * These statements are called as ''directives'' because they give direction to
    the preprocessor to take a certain action after reading these directives.

    * The block diagram of preprocessor is shown in Fig. 7.1.


    (7.1)'
