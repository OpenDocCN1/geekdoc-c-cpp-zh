    \ Definition\n  - 6.4.2 Declaration and Initialization\n  - 6.4.3 Accessing Members\
    \ of Union\n- 6.5 Difference between Structure and Union\n- Questions\n\n# ##\
    \ 6.1 Introduction to Structure [April 16]\n\n+   - Structure is analogous to\
    \ records. A structure is a user defined data type. A structure is a convenient\
    \ tool for handling a group of logically related data items.\n- Structure is a\
    \ collection of logically related data items of different data types grouped together\
    \ under a single name.\n\n# ## 6.1.1 Definition [Nov. 15, April 15]\n\n+   - Structure\
    \ is user defined data type which is used to store heterogeneous data under unique\
    \ name.\n\n Structure is a collection of different data types which are grouped\
    \ together and each element in a structure is called member.\n- To define a structure,\
    \ you must use the struct statement. The struct statement defines a new data type,\
    \ with more than one member for your program. The format of the struct statement\
    \ is this:\n\n```\nstruct [structure tag]\n{\n  member definition;\n  member definition;\n\
    \  ...\n  member definition;\n} [one or more structure variables];\n```"
