  md: '# Procedure Oriented Programming using C


    +   In structures, each member has its own storage location, whereas all the members
    of union use the same, location. Union contains many members of different types,
    it can handle only one member at a time.


    # 6.4.1 Definition


    +   A union is a special data type that enables in C that enables you to store
    different data types in the same memory location.


    OR


    +   Union is a data type with two or more member similar to structure but in this
    case all the members share a common memory location. The size of the union corresponds
    to the length of the longest member. Since the member share a common location
    they have the same starting address.


    +   To define a union, you must use the union statement in very similar as as
    you did defining structure. The union statement defines a new data type, with
    more than one member for your program. The format of the union statement is as
    follows:


    ```

    union [union tag]

    {

    member definition;

    member definition;

    ...

    member definition;

    }[one or more union variables];

    ```


    +   The tag is optional and each member definition is a normal variable definition,
    such as int i; or float f; or other valid variable definition. At the end of the
    union''s definition, before the final semicolon, you can specify one or more union
    variables but it is optional. Here is the way you would define a union type named
    Data which has the three members i, f, and str.


    ```

    union Data

    {

    int;

    float f;

    char str[20];

    data};

    ```


    # 6.4.2 Declaration and Initialization


    +   To declare union data type, ''union'' keyword is used.

    Union holds for one data type which requires larger storage among their members.


    Syntax:


    ```

    union union_name

    {

    <data-type> element 1;

    <data-type> element 2;

    <data-type> element 3;

    } union_variable;

    ```'
