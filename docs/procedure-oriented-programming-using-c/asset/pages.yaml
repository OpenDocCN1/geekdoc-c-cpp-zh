    The array which is used to represent and store in a tabular form is called ''two
    dimensional array''; Such type of array specially used to represent data in a
    matrix format.


    # 5.3.1 Definition


    +   Two-dimensional Array is a simple form of multi-dimensional array that stores
    the array elements in a row, column matrix format.

    OR

    Two-dimensional array are those type of array, which has finite number of rows
    and finite number of columns.'
