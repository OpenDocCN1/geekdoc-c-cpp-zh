    #  8.4 Random Access to Files


    +   * In the beginning we had considered some functions. Now, we try to study
    and understand those ones by one.

    * 1. ftell() Function:

    * This function tells us the relative position of pointer (in bytes) i.e. number
    of bytes written in the file.

    * This function tells where the pointer is right now. It returns the pointer as
    a long integer which is an offset from the beginning of the file. returns – 1L
    on error

    ```c\long n = ftell (FILE *fp);

    ```

    **For example:** fp is a file pointer and the value of bytes will be set in n.n
    should be an integer.

    * 2. rewind() Function:

    * This function is used when the file is opened in append mode. This will again
    reset the pointer to the beginning of the file.

    * This function places the pointer to the beginning of the file, irrespective
    of where it is right now.

    ```c

    void rewind(FILE *fp);

    ```

    **For example:** rewind (fp)

    where fp is a file pointer. So pointer will be set to beginning of file.

    **For example:** rewind (fp);

    ```c

    n = ftell (fp);

    ```'
