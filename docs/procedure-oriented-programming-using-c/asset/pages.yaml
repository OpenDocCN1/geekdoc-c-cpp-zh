  md: '# Procedure Oriented Programming using C


    # Introduction to C Language


    +   - A structured programming language offers a variety of programming possibilities
    and capabilities. It support different control loops, different statements etc.


    +   - C language combines the best elements of high-level language with control
    and flexibility of assembly language so it is a middle level language.


    +   - C language is also called as ''Procedure oriented programming language.''


    +   - C is a Middle level language that do not provide all built-in functions
    in high level languages, but provides all building blocks that we need to produce
    the result want.


    +   - C allows the programmer to write low level programs as well as high level
    programs so it is called middle level language.


    +   - C has become a widely used professional language for following reasons:


    +   1. C language is easy to learn.


    +   2. C language is structured language.


    +   3. C language produces efficient programs.


    +   4. C language can handle low-level activities.


    +   5. C language can be compiled on a variety of computers.


    # 1.1.1 Features of C


    +   - C language consist of following features:


    +   1. Middle Language: C is a middle level language as it combines elements of
    high-level language with the functional of assembly language. C allows direct
    manipulation of bits, bytes, and pointers.


    +   2. Structured Language: C is referred as a structured language because it
    is similar in many ways to other structured languages like ALGOL, Pascal and the
    likes. C allows compartmentalization of code and data. This is a distinguishing
    feature of any structured language.


    +   3. Code Policy: The code written in C is machine independent which means,
    there is no change in ''C'' instructions, when you change the Operating System
    or Hardware. There is hardly any change required to compile when you move the
    program from one environment to another.


    +   4. Recursion: A function may call itself again and this feature is called
    as recursion, is supported by C.


    +   5. Efficiency: C provides fast program execution.


    +   6. High level language feature: This feature allows the programmer to concentrate
    on the logic flow of the code.


    +   7. Low level features: C has a close relationship with assembly languages.
    So it is easy to make assembly language in C.


    +   8. Powerful: C is very powerful language since low level commands have been
    access like assembly language.


    +   9. Flexibility: In C language programmer has many ways to accomplish the same
    task.


    +   10. Small size: C language provides no input output facilities. This helps
    to keep program small.


    +   11. One important feature of C program, its ability to extend itself.'
