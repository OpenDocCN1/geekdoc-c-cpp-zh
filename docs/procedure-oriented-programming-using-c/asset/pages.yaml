    \ and memory allocated by compiler to store that variable.\n\n+   - Scope of a\
    \ variable is the boundary within which a variable can be used.\n\n+   - Storage\
    \ class defines the scope and lifetime of a variable.\n\n+   - We can define scope\
    \ of a variable, the region of the program in which the variable is valid or visible.\n\
    \n+   - Storage class refers to the manner in which memory is allocated by the\
    \ compile to variables.\n\n+   - A storage class defines the scope (visibility)\
    \ and life time of variables and/or functions within a C Program.\n\n+   - It\
    \ determines the scope and lifetime of a variable. There are two types of locations\
    \ in a computer where such a variable stored is Memory and any CPU registers.\n\
    \n+   - There are four types of storage classes:\n  1. Automatic,\n  2. Register,\n\
    \  3. Static, and\n  4. External.\n\n+   - The storage class of a variable answers\
    \ the following questions:\n  1. Where the variable would be stored?\n  2. What\
    \ will be the default initial value?\n  3. What is the scope of the variable?\n\
    \  4. How long would the variable exist?\n\n# 4.4.1 Auto Storage Class\n\n+  \
    \ - These classes are created when the function is called and destroyed automatically\
    \ when the function is exited.\n\n+   - Auto storage class is the default for\
    \ local variables.\n\nSyntax: auto [data_type] [variable_name];\n\nExample:\n\n\
    ```\nint num(int n)\n{\n    int count;\n    auto int Employee;\n}\n```\n\n+  \
    \ - Above example defines two variables with the same storage class auto class\
    \ can only be used within functions, i.e. local variables."
