  md: "# Procedure Oriented Programming using C\n\nThere are following Bitwise operators\
    \ supported by C language.\n\n| Operator | Description | Example |\n| --- | ---\
    \ | --- |\n| & (Binary AND Operator) | Copies a bit to the result if it exists\
    \ both operands. | (A & B) will give 12 which is 0000 1100 |\n| | (Binary OR Operator)\
    \ | Copies a bit if it exists in either operand. | (A | B) will give 61 which\
    \ is 0011 1101 |\n| ^ (Binary XOR Operator) | Copies the bit if it is set in one\
    \ operand but not. | (A ^ B) will give 49 which is 0011 0001 |\n| ~ (Binary Complement\
    \ Operator) | Is unary and has the effect of 'flipping' bits. | ~(A) will give\
    \ -60 which is 1100 0100 |\n| << (Binary Left Shift Operator) | The left operands\
    \ value is moved by the number of bits specified by the right operand. | A <<\
    \ 2 will give 240 which is 1111 0000 |\n| >> (Binary Right Shift Operator) | The\
    \ left operands moved by the number of bits specified by the right operand. |\
    \ A >> 2 will give 15 which is 0000 1111 |\n\nProgram 1.7: Program for bitwise\
    \ operators.\n\n```\n#include <stdio.h>\nvoid main() {\n    unsigned int a = 60;\
    \ /* 60 = 0011 1100 */\n    unsigned int b = 13; /* 13 = 0000 1101 */\n    int\
    \ c = 0;\n    c = a & b; /* / 12 = 0000 1100 */\n    printf(\"Value of c is %d\\\
    n\", c);\n    c = a | b; /* / 61 = 0011 1101 */\n    printf(\"Value of c is %d\\\
    n\", c);\n    c = a ^ b; /* / 49 = 0011 0001 */\n    printf(\"Value of c is %d\\\
    n\", c);\n    c = ~a; /* / -61 = 1100 0011 */\n    printf(\"Value of c is %d\\\
    n\", c);\n    c = a << 2; /* / 240 = 1111 0000 */\n    printf(\"Value of c is\
