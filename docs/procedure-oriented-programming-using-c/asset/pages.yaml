  md: "Procedure Oriented Programming using C\n\n# 1.1.2 Advantages\n\n+   - Various\
    \ advantages of C language are:\n  1. C is a building block for many other currently\
    \ know languages.\n  2. It is Portable Programming Language. This means a program\
    \ written for one computer may run successfully on other computer also.\n  3.\
    \ It is fast for executing. This means the executable program obtained after compiling\
    \ and linking runs very fast.\n  4. It is compact Programming Language. The statements\
    \ in C Language are generally short but very powerful.\n  5. It is simple/easy.\
    \ The C has both the simplicity of High Level Language and the speed of Low Level\
    \ Language. So it is also known as Middle Level Language.\n  6. It has only 32\
    \ keyword so that are easy to remember.\n  7. Its is easily available.\n  8. It\
    \ has ability to extend itself. Users can add their own functions to the C Library.\n\
    \  9. It can use to design middle type of software.\n\n# 1.1.3 Disadvantages\n\
    \n+   - Various disadvantages of C language are:\n  1. There is no run-time checking.\n\
    \  2. There is no strict type checking, (for example: We can pass an integer value\
    \ for floating data type).\n  3. As the program extends it is very difficult to\
    \ fix the bugs.\n  4. It may be compile time overhead over the misplacing and\
    \ excessive use of pointers.\n  5. It does not use to develop complex type of\
    \ software now a day.\n\n# 1.1.4 Algorithm [Oct. 14]\n\n+   - A sequential solution\
    \ of any program that written in human language, called algorithm.\n- In programming,\
    \ algorithm is the set of well defined instruction in sequence to solve a program.\
    \ Algorithm is first step of the solution process. After the analysis of problem,\
    \ programmer writes the algorithm of that problem.\n- Example: Algorithm to find\
    \ out number is odd or even?\n  Step 1 : Start\n  Step 2 : input number\n  Step\
    \ 3 : rem=number mod 2\n  Step 4 : if rem=0 then\n    print \"number even\"\n\
    \    else\n    print \"number odd\"\n    endif\n  Step 5 : Stop"
