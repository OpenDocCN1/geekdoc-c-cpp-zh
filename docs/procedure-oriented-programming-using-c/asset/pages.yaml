    # Function Pointer


    +   * A pointer points to the address of a function is known as function pointer.


    # Declaration


    ```

    function_return_type(*Pointer_name) (function argument list)

    ```


    For example:


    ```

    double (*p2f) (double, char)

    ```


    Here double is return type of function, p2f is name of the function pointer and
    (double, char) is an argument list of this function. Which means the first argument
    of function is of double type and the second argument is char.


    Some points about function pointers:


    +   1. Unlike normal pointers, a function pointer points to code, not data. Typically
    a function pointer stores the start of executable code, you can declare a function
    pointer and assign a function to it in a single statement like this:

    void (*fun_ptr)(int) = &fun;


    +   2. Unlike normal pointers, we do not allocate-deallocate memory using function
    because a function represents the function address.


    +   3. You can remove the ampersand from this statement because a function represents
    the function address.

    Example: void(*fun_ptr)(int) = fun;


