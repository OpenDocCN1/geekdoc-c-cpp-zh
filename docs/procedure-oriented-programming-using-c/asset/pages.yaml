  md: "# Procedure Oriented Programming using C\n\n# 4.4.4 Register Storage Class\n\
    \n+   - Register storage class is used to define local variables that should be\
    \ stored in a CPU register instead of memory ie. the variable has a maximum equal\
    \ to the register size and can't have the unary '&' applied to it.\n- Syntax:\
    \ `register [data_type] [variable_name];`\n- Register is used to define local\
    \ variables that should be stored in a register instead of RAM.\n- Register variables:\
    \ We can tell the compiler that a variable should be kept in one of the machine's\
    \ register, instead of keeping in memory. Since a register access is much faster\
    \ than a memory access, keeping the frequently accessed variables in the register\
    \ will lead to faster execution of programs. These variables can be declared as,\
    \ register int count;\n- Since, only a few variables can be placed in the register,\
    \ it is important to carefully select the variables for this purpose otherwise\
    \ C will automatically convert register variables into non-register variables,\
    \ once limit is reached.\n\nFor example:\n```\nregister int items;\n```\n\n+ \
    \  Features of Register-storage class are given below:\n1. Scope : Local to the\
    \ block in which it is defined\n2. Storage : CPU registers\n3. Life : Till the\
    \ control remains within the block where it is defined\n4. Default initial value\
    \ : Garbage value.\n\nProgram 4.22: Program to demonstrate register storage class.\n\
    ```\n#include <stdio.h>\n#include <conio.h>\nvoid main() {\n{\n  register int\
