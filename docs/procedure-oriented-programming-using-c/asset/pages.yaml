  md: '# Procedure Oriented Programming using C 5.14 Arrays and Strings


    Where,


    +   - data_type : The type of the data stored in the array

    - array_name : Name of the array

    - rows : Maximum number of rows in the array

    - columns : Maximum number of columns in the array


    Example : int value[3]; // implies 3 rows and 3 columns


    # 2. Initialization of Two-Dimensional Array:


    int table[2][3] = (2, 11, 3, 5, 10);


    +   - Above initialized two-dimensional array can be stored in the memory in any
    of the three forms mentioned below:

    1. Two-dimensional array as follows:


    | col 0 | col 1 | col 2 |

    |---|---|--|

    | row | 2 | 11 | 3 |

    | row1 | 5 | 1 | 10 |


    +   2. Row-wise linear: Elements of row0 are stored first and then row1 is stored.


    | table[0][0] | table[0][1] | table[0][2] | table[1][0] | table[1][1] | table[1][2]
    |

    |---|---|---|---|---|--|

    | 2 | 11 | 3 | 5 | 1 | 10 |


    +   3. Column-wise linear: Elements of col0 are stored first, next col1 and next
    col2.


    | table[0][0] | table[0][1] | table[0][2] | table[1][0] | table[1][1] | table[1][2]
    |

    |---|---|---|---|---|--|

    | 2 | 5 | 11 | 1 | 3 | 10 |


    Example:


    ```

    int a[3][3];

    ```


    In above example, a is an array of integer type with storage size of 3 * 3 matrix.
    The total size will be 3 * 3 * 2 = 18 bytes. It is also called as ''multidimensional
    array.''


    +   - Memory Allocation:


    ![](img/5327b00803aba629c47a0e51c7948002_175_0.png)


    Fig. 5.6: Memory allocation for two dimensional array'
