    # 5.1 Introduction to Arrays [Oct. 14, 16, April 16, 17]


    +   * An array is a collection of variables of the same type and it is referenced
    by a common name.

    * An array is a linear and homogeneous data structure.

    * Linear data structure stores its individual data elements in a sequential order
    in the memory. Homogeneous means all individual data elements are of the same
    data type.

    * An array is a group of data items of the same type that share a common name.

    * An array should be of single type, comprising of integers or strings.

    * All arrays consist of contiguous memory locations. The lowest address corresponds
    to the first element and the highest address to the element.


    | First element | Last element |

    |---|---|

    | Numbers[0] | Numbers[1] | Numbers[2] | Numbers[3] |


