  md: '# Procedure Oriented Programming using C


    # Functions and Pointers


    # 2. Adding a number to a pointer:


    A number can be added to a pointer.

    For example:


    ```

    int i = 3, * j;

    j = & i;

    j = j + 1;

    j = j + 9;

    ```


    In line no. 4, j points to 9 integer locations after current location.


    # 3. Subtracting a number from a pointer:


    A number can be subtracted from a pointer.

    For example:


    ```

    int i = 3, * j;

    j = & i;

    j = j - 2;

    j = j - 6;

    ```


    In line no. 4, j points to 6 integer locations before current location.


    # 4. Subtraction of one pointer from another:


    One pointer can be subtracted from another, provided both point to elements of
    same array. The result is the number of elements between corresponding array elements.


    # Program 4.32: Program to subtract one pointer from another pointer.


    ```

    #include<stdio.h>

    main ()

    {

    int arr [] = {10, 20, 30, 45, 67, 56, 74};

    int * i, * j;

    i = & arr [1];nj = & arr [5];

    printf("%d %d", j - i, * j - i inreturn 0;

    }

    ```


    Output:


    504/36


    (j - 1) gives the difference between addresses.

    (*j - i) gives the difference between values contained in addresses at j and i.


    # 5. Comparison of two pointer variables:


    Comparison of two pointer variables is possible provided both point to one array

    (i.e both pointers point to objects of same data type).

    Pointers can also be compared with zero (NULL).'
