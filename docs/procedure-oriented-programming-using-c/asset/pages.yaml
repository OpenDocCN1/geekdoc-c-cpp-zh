  md: "# Procedure Oriented Programming using C\n\n# 3.14 Decision Making and Looping\n\
    \n+   The syntax of else if ladder is as follows:\n```c\nif (condition_1)\n{\n\
    \    statement_1;\n}\\else if (condition_2)\n{\n    statement_2;\n}\\else if (condition_n)\n\
    {\n    statement_n;\n}else\n{\n    default statement;\n}\nstatement-x;\n```\n\n\
    +   Above construct is known as the else if ladder. The conditions are evaluated\
    \ from the top of the ladder to downwards.\nAs soon as a true condition is found,\
    \ the statement associated with it is executed and the control is transferred\
    \ to the statement-x (skipping the rest of the ladder). When all the n conditions\
    \ become false, then the final false containing the default statement will be\
    \ executed.\nFig. 3.7 shows flowchart for if-else ladder.\n\n![](img/5327b00803aba629c47a0e51c7948002_63_0.png)\n\
