  md: "# Procedure Oriented Programming using C 4.3 Functions and Pointers\n\n+  \
    \ * The length of source program can be reduced by using functions at appropriate\
    \ places.\n* It is easy to locate and isolate a faulty function for further investigations.\n\
    \n![](img/5327b00803aba629c47a0e51c7948002_108_0.png)\n\nFig. 4.1\n\n+   * A function\
    \ may be used by many other programs. This means that a C programmer can build\
    \ on what others have already done. That is we can reuse the functions already\
    \ defined in program files.\n\n# 4.1.3 What is a Function? / Meaning of Function\n\
    \n+   * A function is a self contained program structure.\n* A program module\
    \ or C function has following characteristics:\n  1. It has unique name used to\
    \ identify and invoke by function.\n  2. List of parameters called arguments are\
    \ passed to a function.\n  3. Function body has program logic.\n\n+   * Function\
    \ returns some value in terms of some data type.\n\n+   * If a program has many\
    \ (multiple) functions, their definition may appear in any order. Because each\
    \ function is independent of one another.\n* A function will carry the specific\
    \ action when we access it. The same function can be accessed from many places\
    \ into the program. When the function is finished, a program control will returned\
    \ back to the next statement of a function call.\n\n# 4.1.4 How Function Works?\n\
    \n+   * A C language program does not execute the statements in a function until\
    \ the function is invoked or called.\n* When a C program is called, control passes\
    \ to the function and returns back to the calling part after the execution of\
    \ function is over.\n* Fig. 4.2 shows function calls and their returns.\n* The\
    \ calling program can send information to the function in the form of argument.\n\
    * An argument sends information or data needed by the function to perform its\
    \ task.\n* In C programming functions can send back information to the program\
    \ in the form of a return value, (See Fig. 4.2)."
