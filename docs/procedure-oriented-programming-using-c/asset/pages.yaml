  md: "Procedure Oriented Programming using C 4.6 Functions and Pointers\n\n```\n\
    void sub(int a, int b)\n{\n    printf(\"Subtraction: %d\", a - b); /* no variables\
    \ */\n    return; /* optional */\n}\n```\n\n# 4.1.7 Function Declaration\n\n+\
    \   - Like variables, all functions in C program must be declared, before they\
    \ are used in calling function. This declaration of function is known as function\
    \ prototype.\n- It has the following syntax:\n  function_type function_name (parameter\
    \ list);\n  this is very similar to function header except the terminating semicolon.\n\
    - For example, the function mul() will be declared as,\n  float mul(float, float);\n\
    - Generally, prototype declarations are not necessary, if the function have been\
    \ declared before it is used. A prototype declaration may be placed in two places\
    \ in the program.\n  1. Above all the functions, and\n  2. Inside function definition.\n\
    - We place declaration above all the functions this prototype is known as global\
    \ prototype. That is, we can use this function in any part of the program.\n-\
    \ When we place the function definition in the local declaration section of another\
    \ function it is referred as local prototype.\n\nComparison between Function Definition\
    \ and Declaration:\n\n| Sr. No. | Function Definition | Function Declaration |\n\
    |---|---||\n| 1 | There is no semicolon at the end of the header. | There is a\
