  md: 'Procedure Oriented Programming using C 4.44 Functions and Pointers


    # # 4.8 Pointer Arithmetic


    +   * Number of operations can be performed on pointers since they are variables.
    Here, see the following operations perform on a pointers.

    1. Increment-decrement.

    2. Adding a number from a pointer.

    3. Subtracting a number from a pointer.

    4. Subtraction of one pointer from another.

    5. Comparison of two pointer variables.

    * But some operations seem absurd and would give unpredictable results if performed.

    * **Increment-decrement:**

    * Suppose pt is a pointer pointing to integer type of data. i.e.

    ```c

    int *pt;

    ```nIf we get pt++ it increments pt to point to next location of same type. What
    do we mean by same type? If pt is a pointer to integer, integers occupy 2 bytes.
    So if pt=4001, pt++=4003 chars data then it will move 1 bytes ahead. pt-- decrements
    pt to previous element of the same type.

    * Suppose char data type need 1 byte and int data need 2 bytes. So when a char
    is incremented its value increase by 1 and when a int pointer incremented its
    by 2 the increment will take according to the base type points. One can even add
    or subtract integers from商业 values.

    **For example:**

    ```c

    int *a;

    a = a + a;

    ```

    is also valid.

    * Also subtraction of one pointer from another only makes sense when both pointers
    point to a common object, such as an array. The subtraction then yield number
    of elements of the base type separating two pointers values.

    * Apart from this operation no other arithmetic operation is valid on pointers.
    We cannot multiply or divide pointers.

    **For example:**

    ```c

    char *ch = 3000;

    int *i = 3001;

    ```


    | | | |

    |---|---||

    | ch | 3000 | i |

    | ch + 2 | 3002 | i + 1 |

    | ch + 3 | 3003 | |

    | ch + 4 | 3004 | i + 2 |

    | ch + 5 | 3005 | |

    | | memory | |'
