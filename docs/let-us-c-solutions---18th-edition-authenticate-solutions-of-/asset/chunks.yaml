    Periodic Tests - I, II, III, IVIntroduction The first requests for a book like
    ‘Let Us C Solutions’ started coming when the third edition of Let Us C was released.
    I answered them by writing this book. Since then I have met so many readers who
    said that every new edition of Let Us C should be accompanied with two books—a
    new edition of ‘Let Us C Solutions’ and a new edition of ‘Let Us C Workbook’.
    I decided to accede to this request and from fifth edition onwards started releasing
    all these three books simultaneously. The success of last 13 editions of this
    book has validated my belief that if you have a book which lets a reader cross-check
    the solutions/programs that he creates, then it boosts his confidence and improves
    the overall language learning process. Through all the editions of this book one
    person who never got tired of helping me was Manish Jain of BPB. No matter what
    request I made, he always acceded to it. Amol Tambat, Ajay Daga, Prachi Garaye,
    Amit Mendhe, Vikrant Sahoo, Shoeb Parvez, Monali Nikhare and Devshree Satpute
    were instrumental in checking all the solutions of several editions of this book.
    Many thanks to all of them! I have reorganized and rationalized exercises of Let
    Us C edition. The solutions to all these exercises have been included in this
    edition of Let Us C Solutions.CHAPTER Before We Begin To understand C language
    and gain confidence in working with it you would be required to type programs
    in this book and then instruct the machine to execute them. To type any program
    you need another program called Editor. Once the program has been typed it needs
    to be converted to machine language (0s and 1s) before the machine can execute
    it. To carry out this conversion we need another program called Compiler. Compiler
    vendors provide an Integrated Development Environment (IDE) which consists of
    an Editor as well as the Compiler. These IDEs are discussed in this appendix. IDEs There
    are several such IDEs available, each targeted towards different processor and
    operating system combinations. Given below is a brief description of the popular
    IDEs along with the links from where they can be downloaded. Turbo C/C++ under
    Windows If you wish to use Turbo C/C++ it is available at: https://www.developerinsider.in/download-turbo-c-for-windows-7-8-8-1-and-windows-10-32-64-bit-full-screen/ It
    is very easy to install and it works for Windows 7, 8, 8.1 and Windows 10 (32
    bit or 64 bit) with full/window screen mode. NetBeans under Windows NetBeans is
    not a compiler. It is merely an IDE. It''s Windows version can be downloaded from http://www.netbeans.org For
    developing C programs using NetBeans under Windows, you would also have to install
    Cygwin software. Cygwin comes with GCC compiler. It is available at https://www.cygwin.com/ There
    are nice tutorials available at the following links should you face any difficulty
    in setting up Cygwin and NetBeans: https://netbeans.org/community/releases/80/cpp-setup-instructions.html https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows NetBeans
    under Linux If you propose to use NetBeans under Linux you won''t need Cygwin
    as with most Linux installations (like say, Ubuntu) GCC compiler comes preinstalled.
    So you need to just download and install NetBeans for Linux environment. Visual
    Studio under Windows If you wish to use VisualStudio Express it is available at
    https://www.visualstudio.com/vs/express/ You are free to use any of the IDEs mentioned
    above for compiling programs in this book. If you wish to know my personal choice,
    I would prefer NetBeans + Cygwin or Visual Studio Express Edition. All the IDEs
    are easy to use and are available free of cost. Compilation and Execution Steps The
    compilation and execution process with each of the IDEs mentioned in the previous
    section are a bit different. So for your benefit I am giving below these steps
    for each IDE. Compilation and Execution using Turbo C++ Carry out the following
    steps to compile and execute programs using Turbo C++: (a) Start NetBeans from
    Start | All Programs | Turbo C++. (b) Click ‘Start Turbo C++’ from the dialog
    that appears. (c) Select File | New from menu. (d) Type the program. (e) Save
    the program using F2 under a proper name (say Program1.c). (f) Use Ctrl + F9 to
    compile and execute the program. (g) Use Alt + F5 to view the output. Compilation
    and Execution using NetBeans Carry out the following steps to compile and execute
    programs using NetBeans: (a) Start NetBeans from Start | All Programs | NetBeans. (b)
    Select File | New Project… from the File menu. Select Project Category as C/C++
    and Project Type as C/C++ Application from the dialog that pops up. Click Next
    button. (c) Type a suitable project name (say Program1) in Project Name TextBox.
    Click Finish. (d) Type the program. (e) Save the program using Ctrl + (f) Use
    F6 to compile and execute the program. Compilation and Execution using Visual
    Studio Express Carry out the following steps to compile and execute programs using
    Visual Studio Express: (a) Start Visual Studio Express from Start | All Programs
    | Microsoft Visual C++ Express. (b) Select File | New Project… from the File menu.
    Select Project Type as Visual C++ | Win32 Console Application from the dialog
    that pops up. Type a suitable project name (say Program1) in Name TextBox. Click
    OK and Finish. (c) Type the program. (d) Save the program using (e) Use Ctrl+F5
    to compile and execute the program. When you use Visual Studio to create a Win32
    Console Application for the above program the wizard would insert the following
    code by default: #include “stdafx.h”int _tmain (int argc, _TCHAR* argv[]){return
    0;} You can delete this code and type your program in its place. If you now compile
    the program using Ctrl+F5 you would get the following error: Fatal error C1010:unexpected
    end of file while looking for precompiled header. Did you forget to add ‘#include
    “stdafx.h”’ to your source? If you add #include “stdafx.h” at the top of your
    program then it would compile and run successfully. However, including this file
    makes the program Visual Studio-centric and would not get compiled with other
    compilers. This is not good, as the program no longer remains portable. To eliminate
    this error, you need to make a setting in Visual Studio. To make this setting
    carry out the following steps: (a) Go to ‘Solution Explorer’. (b) Right click
    on the project name and select ‘Properties’ from the menu that pops up. On doing
    so, a dialog box called ‘Property Pages’ would appear. (c) From the left pane
    of this dialog first select ‘Configuration Properties’ followed by ‘C/C++’. (d)
    Select ‘Precompiled Headers’. (e) From the right pane of the dialog click on ‘Create/Use
    Precompiled Header’. On doing so in the value for this option a triangle would
    appear. (f) Click on this triangle and a drop-down list box would appear. (g)
    From the list box select ‘Not using Precompiled Header’. (h) Click on OK button
    to make the setting effective. In addition to this, you need to make one more
    setting. By default Visual Studio believes that your program is a C++ program
    and not a C program. So by making a setting you need to tell it that your program
    is a C program and not a C++ program. Carry out the following steps to make this
    setting: (a) Go to ‘Solution Explorer’ window. (b) Right click on the project
    name and select ‘Properties’ from the menu that pops up. On doing so, a ‘Property
    Pages’ dialog box would appear. (c) From the left pane of this dialog box first
    select ‘Configuration Properties’ followed by ‘C/C++’. (d) In C/C++ options select
    ‘Advanced’. (e) Change the ‘Compile As’ option to ‘Compile as C code (/TC)’. Once
    this setting is made you can now compile the program using Ctrl+F5\. This time
    no error would be flagged, and the program would compile and execute successfully. Compilation
    and Execution at Linux Command-line C programs can be compiled and executed even
    at command-line, i.e. without using any IDE. Many programmers prefer this mode.
    In such cases we need to use an editor to type the program and a compiler to compile
    it. For example, if you wish to compile and execute programs at Linux command
    prompt, then you may use an editor like vi or Vim and a compiler like GCC. In
    such as case you need to follow the following steps to compile and execute your
    program. (a) Type the program and save it under a suitable name, ‘hello.c’. (b)
    At the command prompt switch to the directory containing ‘hello.c’ using the cd
    command. (c) Compile the program using GCC compiler as shown below. $ gcc hello.c (d)
    On successful compilation, GCC produces a file named ‘a.out’. This file contains
    the machine language code of the program which can now be executed. (e) Execute
    the program using the following command: $ ./a.outCHAPTER Getting Started [A]
