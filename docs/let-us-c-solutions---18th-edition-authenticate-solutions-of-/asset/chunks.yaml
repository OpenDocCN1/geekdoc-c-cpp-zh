    \n## About the Author\nThrough his books and online courses on C, Data Structures,\
    \ VC++, Embedded Systems, etc., Yashavant Kanetkar has created, moulded and groomed\
    \ lacs of IT careers in India and abroad. Yashavant's books are globally recognized\
    \ and millions of students professionals have benefitted from them. His books\
    \ have been translated into Hindi, Gujarati, Japanese and Chinese. Yashavant is\
    \ a much sought after speaker in the IT field and has conducted seminars/workshops\
    \ at IITs, NITs, IIITs. He was honored with the prestigious “Distinguished Alumnus\
    \ Award” by IIT Kanpur in recognition of his immense contribution to IT education\
    \ in India. He has been awarded “Best .NET Contributor” and “Most Valuable Professional”\
    \ by Microsoft for five successive years. Yashavant holds BE from VJTI Mumbai\
    \ and M.Tech. from IIT Kanpur. His current affiliations include being Director\
    \ of KIC Pvt. Ltd. He can be reached at `kanetkar@kicit.com`.\n\n## Table of Contents\n\
    1. Introduction\n2. Instructions\n3. Decision Control Instruction\n4. More Complex\
    \ Decision Making\n5. Loop Control Instruction\n6. More Complex Repetitions\n\
    7. Case Control Instruction\n8. Functions\n9. Pointers\n10. Recursion\n11. Data\
    \ Types Revisited\n12. The C Preprocessor\n13. Arrays ... (and so on)\n\n## Introduction\n\
    The first requests for a book like `Let Us Solutions` started coming when the\
    \ third edition of `Let Us C` was released. I answered them by writing this book.\
    \ Since then I have met many readers who said that every new edition of `Let Us\
    \ C` should be accompanied with two books—a new edition of `Let Us Solutions`\
    \ and a new edition of `Let Us C Workbook`. I decided to accede to this request\
    \ and from fifth edition onwards started releasing all three books simultaneously.\n\
    \nThe success of last 13 editions of this book has validated my belief that if\
    \ you have a book which lets a reader cross-check the solutions/programs he creates,\
    \ then it boosts his confidence and improves the overall language learning process.\
    \ Through all the editions of this book one person who never got tired of helping\
    \ me was Manish Jain of BPB. No matter what request I made, he always acceded\
    \ to it. Amol Tambat, Ajay Daga, Prachi Garaye, Amit Mendhe, Vikrant Sahoo, Shoeb\
    \ Parvez, Monali Nikhare and Devshree Satpute were instrumental in checking all\
    \ the solutions of several editions of this book. Many thanks!\n\nTo understand\
    \ C language and gain confidence in working with it you would be required to type\
    \ programs in this book and then instruct the machine to execute them. To type\
    \ any program you need another program called `Editor`. Once the program has been\
    \ typed it needs to be converted to machine language (0s and 1s) before the machine\
    \ can execute it. To carry out this conversion we need another program called\
    \ `Compiler`. Compiler vendors provide an Integrated Development Environment (IDE)\
    \ which consists of an `Editor` as well as the `Compiler`. These IDEs are discussed\
    \ in this appendix.\n\n### IDEs\nThere are several such IDEs available, each targeted\
    \ towards different processor and operating system combinations. Given below is\
    \ a brief description of the popular IDEs along with the links from where they\
    \ can be downloaded.\n\n#### Turbo C/C++ under Windows\nIf you wish to use `Turbo\
    \ C/C++` it is available at: https://www.developerinsider.in/download-turbo-c-for-windows-7-8-8-1-and-windows-10-32-64-bit-full-screen/\n\
    \ It is very easy to install and it works for Windows 7, 8, 8.1 and Windows 10\
    \ (32 bit or 64 bit) with full/window screen mode.\n\n#### NetBeans under Windows\n\
    `NetBeans` is not a compiler. It is merely an `IDE`. Its Windows version can be\
    \ downloaded from `http://www.netbeans.org`. For developing C programs using `NetBeans`\
    \ under Windows, you would also have to install `Cygwin` software. `Cygwin` comes\
    \ with `GCC` compiler. It is available at https://www.cygwin.com/. There are nice\
    \ tutorials available at the following links should you face any difficulty in\
    \ setting up `Cygwin` and `NetBeans`: https://netbeans.org/community/releases/80/cpp-setup.html\n\
    \n#### NetBeans under Linux\nIf you propose to use `NetBeans` under Linux you\
    \ won't need `Cygwin` as most Linux installations (like say, Ubuntu) `GCC` compiler\
    \ comes preinstalled. So you need to just download and install `NetBeans` for\
    \ environment.\n\n#### Visual Studio under Windows\nIf you wish to use `VisualStudio`\
    \ it is available at https://www.studio.com/vs/express/. You are free to use any\
    \ of the IDEs mentioned above for compiling programs in this book. If you wish\
    \ to know my personal choice, I would prefer `Cygwin` or `VisualStudio Express`.\n\
    \n## Compilation and Execution Steps\nThe compilation and execution process with\
    \ each of the IDEs mentioned in the previous section are bit different. So for\
    \ your benefit I am giving below these steps for each IDE.\n\n### Compilation\
    \ and Execution using Turbo C++\n(a) Start `NetBeans` from All Programs | Turbo\
    \ C++.\n(b) Click `Start Turbo++` from the dialog that appears.\n(c) Select `File\
    \ | New` from menu.\n(d) Type the program.\n(e) Save the program using `F2` under\
    \ a proper name (say `Program1.c`).\n(f) Use `Ctrl+9` to compile and execute the\
    \ program.\n(g) Use `Alt+F5` to view the output.\n\n### Compilation and Execution\
    \ using NetBeans\n(a) Start `NetBeans` from All Programs | NetBeans.\n(b) Select\
    \ `File | New Project…` from the menu.\n(c) Select Project Category as C/C++ and\
    \ Project Type as Application from the dialog pops up.\n(d) Type a suitable project\
    \ name (say Program1) in Name TextBox. Click Finish.\n(e) Type the program.\n\
    (f) Use `Ctrl+F6` to compile and execute.\n\n### Compilation and Execution using\
    \ Visual Studio Express\n(a) Start `Visual Studio Express` from All Programs |\
    \ Microsoft Visual C++.\n(b) Select `File | New Project…` from the menu.\n(c)\
    \ Select Project Category as C/C++ and Project Type as Application from the dialog\
    \ pops up.\n(d) Type a suitable project name (say Program1) in Name TextBox. Click\
    \ Finish.\n(e) Type the program.\n(f) Use `Ctrl+F5` to compile and execute.\n\n\
    ### Compilation and Execution at Linux Command-line\n(a) Type the program and\
    \ save it under a suitable name, `hello.c`.\n(b) At the command prompt switch\
    \ to the directory containing `hello.c` using the `cd` command.\n(c) Compile the\
    \ program using `GCC` compiler as shown below:\n```\ngcc hello.c\n```\n(d) On\
    \ successful compilation, `GCC` produces a file named `a.out`. This file contains\
    \ the machine language code of the program which can now be executed.\n(e) Execute\
    \ the program using the following command:\n```bash\n./a.out\n```\n\n*(Note: Due\
    \ to the extreme length of the provided text containing repetitive placeholder/junk\
    \ content, this output focuses on structural de-duplication and key formatting\
    \ as requested. The repetitive \"why?\" questions in the source text were omitted\
    \ as they contain no semantic value.)*\n"
