    Match the following pairs: pairs: pairs: pairs:pairs: pairs: pairs:pairs: pairs:
    pairs:pairs: pairs: pairs:pairs: pairs: pairs:pairs: pairs:pairs: pairs: pairs:pairs:
    pairs: pairs:pairs: pairs:pairs: pairs:pairs: pairs: pairs: pairs:pairs: pairs:
    pairs:pairs: pairs: pairs: [E] Point out the errors, if any, in the following
    programs: (a) int main(){int a; float b; int c;a = 25; b = 3.24; c = a + b * b
    - 35;} No error. Multiple C statements can be written in a single line. (b) #include
    <stdio.h></stdio.h>int main(){int a = 35; float b = 3.24;printf (“%d %f %d”, a,
    b + 1.5, 235);} No error. The list being printed in printf() may contain variables,
    constants or expressions. (c) #include <stdio.h></stdio.h>int main(){int a, b,
    c;scanf (“%d %d %d”, a, b, c);} Error. We should use & before each variable used
    in (d) #include <stdio.h></stdio.h>int main(){int m1, m2, m3printf (“Enter values
    of marks in 3 subjects:”)scanf (“%d %d %d”, &m1, &m2, &m3)printf (“You entered
    %d %d %d”, m1, m2, m3)} Error. Semicolon should be present at the end of type
    declaration, printf() and scanf() statements. [F] Attempt the following questions: (a)
    Temperature of a city in Fahrenheit degrees is input through the keyboard. Write
    a program to convert this temperature into Centigrade degrees. Program: /* Conversion
    of temperature from Fahrenheit to Centigrade */#include<stdio.h></stdio.h>int
    main(){float fr, cent;printf (“\nEnter the temperature (F):”);scanf (“%f”, &fr);cent
    = 5.0 / 9.0 * (fr - 32);printf (“Temperature in centigrade = %f\n”, cent);return
    0;} (b) The length & breadth of a rectangle and radius of a circle are input through
    the keyboard. Write a program to calculate the area and perimeter of the rectangle,
    and the area and circumference of the circle. Program: /* Calculation of perimeter
    & area of rectangle and circle */#include<stdio.h></stdio.h>int main(){int l,
    b, r, area1, perimeter;float area2, circum;printf (“\nEnter Length & Breadth of
    Rectangle:”);scanf (“%d %d”, &l, &b);area1 = l * b; /* Area of a rectangle */perimeter
    = 2 * l + 2 * b; /* Perimeter of a rectangle */printf (“Area of Rectangle = %d\n”,
    area1);printf (“Perimeter of Rectangle = %d\n”, perimeter);printf (“\n\nEnter
    Radius of circle:”);scanf (“%d”, &r);area2 = 3.14 * r * r; /* Area of Circle */circum
    = 2 * 3.14 * r; /* Circumference of a circle */printf (“Area of Circle = %f\n”,
    area2);printf (“Circumference of Circle = %f\n”, circum);return 0;} (c) Paper
    of size A0 has dimensions 1189 mm x 841 mm. Each subsequent size A(n) is defined
    as A(n-1) cut in half parallel to its shorter sides. Write a program to calculate
    and print paper sizes A0, A1, A2, … A8\. Program: /* Calculation of Paper Sizes
