    are True or False: (a) C language has been developed by Dennis Ritchie. Answer:
    True (b) Operating systems like Windows, Unix, Linux and Android are written in
    C. Answer: True (c) C language programs can easily interact with hardware of a
    PC / Laptop. Answer: True (d) A real constant in C can be expressed in both Fractional
    and Exponential forms Answer: True (e) A character variable can at a time store
    only one character. Answer: True (f) The maximum value that an integer constant
    can have varies from one compiler to another. Answer: True (g) Usually all C statements
    are entered in small case letters. Answer: True (h) Spaces may be inserted between
    two words in a C statement. Answer: True (i) Spaces cannot be present within a
    variable name. Answer: True (j) C programs are converted into machine language
    with the help of a program called Editor. Answer: False (k) Most development environments
    provide an Editor to type a C program and a Compiler to convert it into machine
