    of series = %f\n”, s);return 0;} (2) Write a program to enter the numbers till
    the user wants and at the end it should display the count of positive, negative
    and zeros entered. #include<stdio.h></stdio.h>int main(){int neg, pos, zero, n;char
    ch = ‘y’;pos = neg = zero = 0;while (ch == ‘y’ || ch == ‘Y’){printf (“Enter a
    number: \n”);scanf (“%d”, &n);if (n > 0)pos++;if (n < 0)neg++;if (n == 0)zero++;printf
    (“Do you want to continue y/n”);fflush (stdin);scanf (“%c”, &ch);}printf (“Positive
    = %d\n”, pos);printf (“Negative = %d\n”, neg);printf (“Zeros = %d\n”, zero);return
    0;} (3) Write a program to find the range of a set of numbers that are input through
    the keyboard. Range is the difference between the smallest and biggest number
    in the list. #include<stdio.h></stdio.h>int main(){int n, no, flag, small, big;flag
    = 0;printf (“Enter the number of elements in the range:\n”);scanf (“%d”, &n);while
    (n > 0){printf (“Enter a number:\n”);scanf (“%d”, &no);if (flag == 0){small =
    big = no;flag = 1;}else{if (no > big)big = no;if (no < small)small = no;}n--;}printf
    (“Range: %d”, big - small);return 0;} (4) If three integers are entered through
    the keyboard, write a program to determine whether they form a Pythogorean triplet
    or not. #include<stdio.h></stdio.h>int main(){int i, j, k;printf (“Enter three
    integers: \n”);scanf (“%d%d%d”, &i, &j, &k);if ((i * i + j * j == k * k) || (j
    * j + k * k == i * i) || (k * k + i * i == j * j))printf (“Numbers form pythogorean
    triplet \n”);elseprintf (“Numbers do not form pythogorean triplet \n”);return
    0;} Periodic Test II [A] Fill in the blanks: [5 Marks, 1 Mark each] (1) system()
    function is used to clear the screen. (2) Pointers are variables, which hold addresses
    of other variables. (3) & is called an ‘address of’ operator. (4) The preprocessor
    directive that is used to give convenient names to difficult formulae is called
    macro (5) For a call by reference we should pass addresses of variables to the
    called function. [B] State True or False: [5 Marks, 1 Mark each] (1) A function
    can return more than one value at a time. False (2) A fresh set of variables are
    created every time a function gets called. True (3) All types of pointers are
    4 bytes long. True (4) Any function can be made a recursive function. False (5)
    The correct build order is Preprocessing - Compilation - Assembling - Linking.
    True [C] Answer the following questions: [10 Marks, 2 Marks each] (1) Why are
    addresses of functions stored on the stack? So that it would be possible to return
    to the same place from where the function was called, once the called function''s
    execution is over. (2) How do we decide whether a variable should be passed by
    value or by reference? If we want that the passed variable''s value should not
    change in the function being called use a call by value. If we want that the passed
    variable''s value should change in the function being called use a call by reference. (3)
    Size of a pointer is not dependent on whose address is stored in it. Justify. A
    pointer contains address. Any address is 4 byte long. So it does not matter, whose
    address is held in a pointer, the pointer remains 4 bytes long. (4) At times there
    may be holes in a structure? Why do they exist? How can they be avoided? In many
    OSs it is easier to access an entity if it placed at an address which is a multiple
    of 4. So while creating a structure variable in memory, each structure element
    is placed at an address that is a multiple of 4. This leads to creation of holes
    in memory. They can be avoided using a #pragma pack preprocessor directive. (5)
    A recursive call should always be subjected to an Why? Explain with an example. If
    the recursive call is not subjected to an the function would fall in an infinite
    loop. void fun(){static int count = 0;count++;if (count <= 5){printf (“%d\n”,
    count);fun();}elsereturn;} [D] Attempt the following questions: [20 Marks, 5 Marks
    each] (1) Define a function that receives 4 integers and returns sum, product
    and average of these integers. #include<stdio.h></stdio.h>void calc (int *, int
    *, float *);int main(){int sum, prod;float avg;calc (&sum, &prod, &avg);printf
    (“%d %d %f\n”, sum, prod, avg);return 0;}void calc (int *sum, int *prod, float
    *avg){int n1, n2, n3, n4;printf (“\n Enter four numbers :”);scanf (“%d%d%d%d”,
    &n1, &n2, &n3, &n4);*sum = n1 + n2 + n3 + n4;*prod = n1 * n2 * n3 * n4;*avg =
    *sum / 4.0f;} (2) Write a recursive function which prints the prime factors of
    the number that it receives when called from #include<stdio.h></stdio.h>void factor
    (int);int main(){int num;printf (“\nEnter a number:”);scanf (“%d”, &num);printf
    (“\nPrime Factors are:”);factor (num);return 0;}void factor (int n){static int
    i = 2;if (i <= n){if (n % i == 0){printf (“%d”, i);n = n / i;}elsei++;factor (n);}return;} (3)
    Write macros for calculating area of circle, circumference of circle, volume of
    a cone and volume of sphere. #include<stdio.h></stdio.h>#define PI 3.14f#define
    ACI(r) (PI * r * r)#define CCI(r) (2 * PI * r)#define VCO(r) ((1.0f / 3) * PI
    * r * r * r)#define VCYL(r) ((4.0f / 3) * PI * r * r * r)int main(){float r, a_ci,
    c_ci, v_co, v_cyl;printf (“\n Enter the value of r :\n”);scanf (“%f”, &r);a_ci
    = ACI (r);c_ci = CCI (r);printf (“\nArea of circle : %f”, a_ci);printf (“\nCircumference
    of circle : %f”, c_ci);v_co = VCO (r);v_cyl = VCYL (r);printf (“\n Volume of cone
    : %f”,v_co);printf (“\n Volume of cylinder : %f”, v_cyl);return 0;} (4) Write
    a program that prints sizes of all types of chars, ints and reals. #include<stdio.h></stdio.h>int
    main(){char ch;unsigned char dh;printf (“character = %d\n”, sizeof (ch));printf
    (“unsigned character = %d\n”, sizeof (dh));short int a;short unsigned int b;int
    c;long int d;long unsigned int e;printf (“short signed integer = %d\n”, sizeof
    (a));printf (“short unsigned integer = %d\n”, sizeof (b));printf (“integer = %d\n”,
    sizeof (c));printf (“long signed integer = %d\n”, sizeof (d));printf (“long unsigned
    integer = %d\n”, sizeof (e));float f;double g;long double h;printf (“float = %d\n”,
    sizeof (f));printf (“double = %d\n”, sizeof (g));printf (“long double = %d\n”,
    sizeof (h));return 0;} Periodic Test III [A] Fill in the blanks: [5 Marks, 1 Mark
    each] (1) Mentioning name of the array yields base address of the array. (2) C
    permits us to exceed lower and upper bounds of an array. (3) Size of an array
    is sum of sizes of individual elements of an array. (4) Array elements are always
    counted from zero onwards. (5) A structure is usually a collection of dissimilar
    elements. [B] State True or False: [5 Marks, 1 Mark each] (1) If the array is
    big its elements may get stored in non-adjacent locations. False (2) All strings
    end with a ‘\0’. True (3) Using #pragma pack you can control the layout of structure
    elements in memory. True (4) Elements of 2D array are stored in the form of rows
    and columns in memory. False (5) 3D array is a collection of several 1D arrays.
    False [C] Answer the following questions: [10 Marks, 2 Marks each] (1) What is
    likely to happen if the bounds of an array are exceeded? If bounds of an array
    are exceeded while reading, nothing will go wrong. However, if bounds are exceed
    while writing to an array, something important that is already present beyond
    the bounds would get overwritten. Sometimes this may even hang the program. If
    the bounds of array are exceeded the compiler does not report an error “Subscript
    out of range”. Bounds checking is always programmers responsibility (2) When you
    prefer a structure over an array to store similar elements? Explain with an example. A
    structure is preferred over an array when a set of similar elements are to be
    returned from a function, because on attempting to return an array only its base
    address would get returned. For example, if we are to return a complex number
    containing a real part and imaginary part (both floats) it is more convenient
    to put them into a structure rather than in an array. (3) What is the limitation
    of an array of pointers to strings? How can it be overcome? An array of pointers
    to strings is not very convenient if we are to receive strings into this array
    by reading them from keyboard. It can be overcome by first allocating space for
    strings using malloc () and then storing the addresses of strings into the array
    of pointers. (4) In a two-dimensional array why do expressions a and *a give base
    address? a is supposed to give base address because the name of the array, acts
    as a pointer to the element of the array. A 2D array is a collection of several
    1D arrays. So when we use we are referring to the 1D array. And referring to 1D
    array always yields its base address, hence *a also gives the base address. (5)
    How can we receive multi-word strings as input using scanf() and using gets()
    ? char str[30];scanf (“%[^\n]s”, str);gets (str); [D] Attempt the following questions:
    [20 Marks, 5 Marks each] (1) Write a function that receives as parameters, a 1D
    array, its size and an integer and returns number of times the integer occurs
    in the array. #include<stdio.h></stdio.h>int countnum (int*, int, int);int main(){int
    arr[100], size, num, i, count;printf (“Enter the size of array:\n”);scanf (“%d”,
    &size);printf (“Enter the elements of an array:\n”);for (i = 0; i < size; i++)scanf
    (“%d”, &arr[i]);printf (“Enter the number you want to count:\n”);scanf (“%d”,
    &num);count = countnum (arr, size, num);printf (“count = %d”, count);return 0;}int
    countnum (int *a, int sz, int n){int j, cnt = 0;for (j = 0; j < sz; j++){if (*a
    == n)cnt++;a++;}return cnt;} (2) Create an array of pointers containing names
    of 10 cities. Write a program that sorts the cities in reverse alphabetical order
    and prints this reversed list. #include<stdio.h></stdio.h>#includeint main(){char
    *cities[] = {“Nagpur”, “Kanpur”, “Delhi”,“Sikandarabad”, “Akola”, “Ghatanji”,“Jabalpur”,
    “Ziri”, “Shegaon”, “Bombay”};char *t;int i, j;for (i = 0; i < 9; i++){for (j =
    i + 1; j < 10; j++){if (strcmp (cities[i], cities[j]) < 0){t = cities[i];cities[i]
    = cities[j];cities[j] = t;}}}for (i = 0; i < 10; i++)printf (“%s\n”, cities[i]);return
    0;} (3) Declare a structure called student containing his name, age and address.
    Create and initialize three structure variables. Define a function to which these
    variables are passed. The function should convert the names into uppercase. Print
    the resultant structure variables. #include<stdio.h></stdio.h>#includevoid upper
    (struct stud*);struct stud{char name[20];int age;char addr[40];};struct stud s1
    = {“akshay”, 20, “Ravinagar”};struct stud s2 = {“shubham”, 21, “Civil Lines”};struct
    stud s3 = {“nilesh”, 22, “Khamla”};int main(){upper (&s1);upper (&s2);upper (&s3);return
    0;}void upper (struct stud *s){printf (“Before conversion:\n”);printf (“%s %d
    %s\n”, s->name, s->age, s->addr);strupr (s->name);printf (“After conversion:\n”);printf
    (“%s %d %s\n”, s->name, s->age, s->addr);} (4) Write a program that checks and
    reports whether sum of elements in the row of a 5 x 5 array is equal to sum of
    elements in column. #include<stdio.h></stdio.h>int main(){int a[5][5], i, j, sumr
    = 0, sumc = 0;printf (“Enter elements of a 5 x 5 array\n”);for (i = 0; i < 5;
    i++)for (j = 0; j < 5; j++)scanf (“%d”, &a[i][j]);printf (“Enter row and column
    you wish to check\n”);scanf (“%d”, &i);for (j = 0; j < 5; j++)sumr = sumr + a[i
    - 1][j];for (j = 0; j < 5; j++)sumc = sumc + a[j][i - 1];if (sumr == sumc)printf
    (“Sums are equal”);elseprintf (“Sums are not equal”);return 0;} Periodic Test
    IV [A] Fill in the blanks: [5 Marks, 1 Mark each] (1) 0xAABB | 0xBBAA evaluates
    to (2) The values of an enum are stored as (3) An existing data type can be given
    a new name using the typedef keyword. (4) The >> operator can be used to eliminate
    3 least significant bits from a character. (5) The ~ operator is used to invert
    the bits in a byte. [B] State True or False: [5 Marks, 1 Mark each] (1) To check
    whether a particular bit in a byte is on or off, the bitwise | operator is useful.
    False (2) It is possible to create a union of structures. True (3) The callback
    mechanism can be implemented using function pointers. True (4) On evaluating the
    expression a ^ 5 value of a would change. False (5) Bitwise operators can work
    on and False [C] Answer the following questions: [10 Marks, 2 Marks each] (1)
    What is the utility of <<, >>, & and | bitwise operators? >> operators are useful
    to shift out bits in a number from left or right. & is used to check whether a
    bit is on or off, and to set a particular bit to 0\. | operator is used to put
    on a bit. (2) Define the _BV macro. How would the following expressions involving
    the _BV macro be expanded by the preprocessor? int a = _BV (5);int b = ~ _BV (5); #define
    _BV(x) 1 << xint a = _BV(5) is expanded to int a = 1 << 5int b = ~ _BV(5) is expanded
    to int b = ~ (1 << 5) (3) What does the following expression signify? long (*p[3])
    (int, float); In this declaration p is an array of three function pointers, each
    pointer pointing to a function that receives and a float and returns a long (4)
    Suggest a suitable printf() that can be used to print the grocery items and their
    prices in the following format: ![](image-x6g3h40n.jpg) (5) When it is useful
    to make use of a union? What is the size of a union variable? How can the elements
    of a union variable be accessed? We should use a union when we wish to access
    same memory locations in multiple ways. Size of a union variable is size of the
    biggest element in the union. Elements of a union variable can be accessed using
    the . and -> operators. [D] Attempt the following questions: [20 Marks, 5 Marks
    each] (1) Write a program to multiply two integers using bitwise operators. #include<stdio.h></stdio.h>int
    add (int, int);int main(){int a, b, result;printf (“\nEnter the numbers to be
    multiplied :”);scanf (“%d%d”, &a, &b);result = 0;while (b != 0){if (b & 1)result
    = add (result, a);a <<= 1;b >>= 1;}printf (“Result:%d”, result);}int add (int
    x, int y){while (y != 0){int carry = x & y;x = x ^ y;y = carry << 1;}return x;} (2)
    Write a program to count number of words in a given text file. #include<stdio.h></stdio.h>#include<stdlib.h></stdlib.h>int
    main(){char ch; FILE *fp;char fname[67];int count = 0;printf (“Enter File name:”);gets
    (fname);fp = fopen (fname, “r”);if (fp == NULL){printf (“Unable to open file\n”);exit
    (1);}while ((ch = getc (fp)) != EOF){if (ch == ‘ ‘)count++;}printf (“No of words
    = %d”, count + 1);fclose (fp);} (3) Write a program that receives a set of numbers
    as command-line arguments and prints their average. #include<stdio.h></stdio.h>#include<stdlib.h></stdlib.h>int
    main (int argc, char* argv[]){int sum, i, avg;sum = 0;for (i = 1; i < argc; i++)sum
    = sum + atoi (argv[i]);avg = sum / (argc - 1);printf (“Average = %d”, avg);return
    0;} Write a program to check whether contents of the two files are same by comparing
    them on a byte-by-byte basis. #include<stdio.h></stdio.h>#include<stdlib.h></stdlib.h>int
    main(){char ch1,ch2;FILE *fp,*fq;char fname1[67], fname2[67];printf (“Enter File1
    name:”);gets (fname1);printf (“Enter File2 name:”);gets (fname2);fp = fopen (fname1,
    “rb”);if (fp == NULL){printf (“Unable to open file1\n”);exit (1);}fq = fopen (fname2,
    “rb”);if (fq == NULL){printf (“Unable to open file2\n”);exit (1);}while (1){ch1
    = getc (fp);ch2 = getc (fq);if (ch1 == EOF && ch2 == EOF){printf (“File contents
    match”);break;}if (ch1 != ch2 || ch1 == EOF && ch2 != EOF || ch1 != EOF && ch2
    == EOF){printf (“File contents do not match”);break;}}fclose (fp);fclose (fq);}'
