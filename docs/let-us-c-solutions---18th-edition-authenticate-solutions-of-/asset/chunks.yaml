    j < n; j++)fwrite (&emp[j], sizeof (s), 1, ft);fclose (fs);fclose (ft);printf
    (“Records arranged in ascending order\n”);return 0;}int isgreater (struct date
    d1, struct date d2){if (d1.y > d2.y)return (1);else{if (d1.y == d2.y){if (d1.m
    > d2.m)return (1);else{if ((d1.m == d2.m) && (d1.d >= d2.d))return (1);}}}return
