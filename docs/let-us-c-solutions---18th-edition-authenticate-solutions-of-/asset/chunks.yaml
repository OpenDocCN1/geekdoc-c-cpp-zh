    main(){int j, k, z;printf (“\nEnter two numbers:”);scanf (“%d%d”, &j, &k);z =
    fun (j, k);printf (“GCD of two numbers is %d\n”, z);return 0;}/* Function to calculate
    GCD */int fun (int j, int k){int r = 1, m, n = 0, t;if (k > j) /* Interchange
