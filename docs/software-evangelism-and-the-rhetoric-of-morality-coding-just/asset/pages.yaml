  md: '# Encoding and Decoding 3


    founder of the Internet, has served as Google''s “Chief Evangelist” since 2005.


    With the corporate embrace of evangelism, it is certainly tempting to singularly
    equate software evangelism with traditional marketing or advocacy. With the desire
    to encourage development and visibility, corporations can use evangelism not only
    to increase third-party developer buy-in but also to sell the innate good of their
    technological advancements. But evangelism, even when identified as marketing
    or advocacy, often denotes the communication of belief that is never simply economic
    or technical, even when explicitly about the economic or technical. In the Macintosh
    Way, published in 1990 as the first extensive testimonial to the power of software
    evangelism, former Apple software evangelist Kawasaki described the argumentative
    appeals to persuade developers to convert to the Macintosh platform. These appeals
    emphasized a “dream” in which developers could make “history, the world,” and
    ensure David’s defeat of Goliath by “help[ing] Apple succeed after “IBM” (100).
    Motivated by fervor and zeal (but money)” (2), evangelists aimed to induce conversion
    through the sharing of beliefs that transcended the technical specifications and
    applications of the Macintosh platform.


    In a telling description of software evangelism seventeen years later,“IBM Web
    2.0 evangelist” David Barnes distinguished his own evangelical work from more
    traditional types of workplace advocacy: “I’m not part of marketing and I’m not
    part of sales.” Instead, his role with IBM’s Emerging Internet Technologies Group
    was to bear witness to the ongoing digital ethos: “to show what we’re doing within
    IBM to help bring [new technologies] to the world.” In contrast, Microsoft’s description
    of its Developer and Evangelism Division seemingly appears to downplay, if not
    contradict, the importance of passion rather than profit in evangelical work,
    especially in light of Platforms Vice President Jim Allchin’s comment that the
    company’s Evangelism Division “will create and deliver support to the millions
    of software developers around the globe who share a commitment to providing customers
    with high-performance, affordable and cutting-edge technologies—any time, anywhere
    and on any device.” But, as Bill Gates’ 2002 testimony in the antitrust case *State
    of New York v. Microsoft Corporation* revealed, “passion and commitment” served
    as the primary motivations for Microsoft evangelists, including those who years
    before “spread the word of the benefit of MS-DOS.


    In spite of the distancing of evangelism from monetary motivations, commitment
    and passion for profit are still undoubtedly important, if not to evangelists,
    then surely to companies that employ them; to suggest otherwise in the context
    of corporations such as Apple, IBM, Google, and Microsoft would ignore the very
    real motivations, influences, and effects of capitalism. However, economic and
    technical motives alone do not adequately account for the arguments constructed
    in software evangelism, especially given that good news, in its various manifestations,
    is often'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 4 Encoding and Decoding


    spread by those not employed as evangelists. Whether directed at developers, or
    as later became the case, to consumers, evangelism is much more than a strategy
    to support or sell a product, Kawasaki''s description of evangelism reveals "When
    you sell your product, people use it. When you evangelize people, they get infected,
    carry the torch for you heartbeat, and defend you against your enemies" (1990,
    99). Although dismissed as the hyperbole of a zealous technophile or naked capitalist,
    Kawasaki''s description can also be understood as offering a way of imagining
    software evangelism as the creative rhetorical engineering of moral and political
    ends that are purposeful in words seldom attributed to scientific and technological
    pursuits. Let me say again, however, that I am not so bold as to say that software
    evangelism, when explicitly framed in the rhetorics of morality and justice that
    I examine throughout this book, do not ultimately serve and, in many cases, aim
    to serve capitalism. Yet, to limit the passion that motivates software evangelism
    solely to corporate maximization of utility or accumulation of profit would ignore
    the extent to which appeals to moral good and a sense of justice circulate in
    and compete among the various kinds of evangelism spread within and beyond the
    software development culture.


    # THE POLITICS OF THE SOFTWARE ECOSYSTEM


    Software today exists as an ecosystem, composed of a mix of proprietary, free,
    and open source software (Merschmitt und Szyperski). Unlike proprietary software,
    with its strict limitations regarding use and copying, free and open source software
    (F/OSS) confers the right to use and copy code freely. Where proprietary software
    restricts access to its source code (the human-readable instructions written in
    computing languages) and thereby prevents modification to its code, F/OSS makes
    its source code transparent and typically allows for not modification but also
    redistribution of the subsequently modified software. Although essentially identical
    in practice, free and open source software differ philosophically. For free software
    evangelist Richard Stallman, the motivation for starting the GNU Project in 1983
    resulted from a "stark moral choice" between the freedom to share and the denial
    of freedom in the form of proprietary software and non-disclosure agreements.
    For open-source evangelist Linus Torvalds, his project that eventually became
    the Linux kernel (i.e., the heart of an operating system) began because "I just
    wanted something that would run on my 386," as he explained in the collection
    Open Sources: Voices from the Revolution. Describing his reasons for making his
    code available to others, Torval wrote in 1991 to the MINIX operating system Usenet
    group, "I''ve enjoyed [sic] doing it, and somebody might enjoy looking at it and
    even modifying it for their own needs. It is still small enough to understand,
    use and modify, and I''m looking forward to any comments you'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Encoding and Decoding 5


    might have.” These philosophical differences between the Free and Open Source
    communities have led to much heated debate. For instance, Stallman argued in 1998
    that the “rhetoric of Open Source” focuses on the potential to make high quality,
    powerful software, but shuns the ideals of freedom, community, and principle.”
    But those in the Open Source community, the evangelical focus on the technical
    merits of open source, which, according to Torvalds in a 2007 address to Google,
    “is the only right way to do software,” provided the appeal that eventually to
    the mainstream acceptance of not open source but also free software. Yet, in spite
    of competing philosophies, freely shareable, modifiable, and redistributable software
    works together practically, though evangelically constructed as free or open.
    In fact, together the respective projects initiated by Stallman and Torvalds formed
    the popular operating system Linux, also sometimes referred to in the Free software
    community as GNU/Linux.


    Describing the significance of F/OSS production and regulation, socioeconomic
    examination of F/OSS has highlighted this kind of development poses to traditional
    labor relations and notions of work embodied in the production of proprietary
    software development (e.g., DiBona, Eckman and Stone; Lakhani and Wolf; O’Reilly
    2006; Raymond 2001; Soderberg). Because F/OSS development does not treat code
    itself as proprietary software, this approach seeks stark alternative to the traditional
    framework of Fordist capitalism, constructs software as a commodity to be exchanged
    between producer and consumer. Important to the identification of the PostFord
    implications of F/OSS as an unintended consequence rather than a primary objective
    of freely shareable software development are examinations of why F/OSS development
    communities approach code so differently.


    Seminal to these examinations is the concept of *hacking*. David Levy explains,
    the practice of hacking arising out of the Massachusetts Institute of Technology’s
    Tech Model Railroad Club (TMRC), a student organization that created elaborate
    miniature railroad displays. In this context, a *hack* was a “project undertaken
    or built not solely to fulfill some constructive goal, with some pleasure taken
    in more involvement ... [T]o qualify as a hack, the feat must be imbued with innovation,
    style, and technical virtuosity” (23). For members of the TMRC, many of whom were
    involved in the early incarnation of software programming, “technology was their
    playground.” As “resident ethnographer” and software hacker, Eric Raymond later
    described in *The New Hacker’s Dictionary*, a hacker is a “person who enjoys exploring
    the details of programmable systems and how to stretch their capabilities, as
    to most users, who prefer to learn only the minimum necessary (1996, 223).” For
    such exploratory practice to occur necessitated that the instruments of play be
    freely available for whomever might want to use them.


    Because, in the case of a programmer, the instrument is code and because code
    is information, the sharing of information is of paramount importance to coding
    play, but not simply for practical reasons. The *hacker ethics*, is'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 6 Encoding and Decoding


    defined in The New Hacker''s Dictionary, is “the belief that information-sharing
    is a powerful good, and that it is an ethical duty of hackers to share their expertise
    by writing free software and facilitating access to information and to computing
    resources wherever” (1996, 234). When the freedoms to copy a program and to read,
    modify, and redistribute its source code are ensured, players have at their disposal
    an bottomless chest from which to gather instruments of play for any myriad of
    purposes. Anyone with interest, need, or wants free to play, to participate, and
    to contribute to the contents of the chest. Furthermore, because everyone has
    access to and can utilize these instruments, the hacker ethic is often seen as
    inherently democratic, acting to nothing less than the right to free speech. As
    Levy notes, hacking functions as “the act of creation, the benevolent power of
    logic in the local, unambiguous world of computers, where truth, openness, and
    democracy exist in pure form than one could find else” (191). So the notion of
    play and its resulting metaphors might create the appearance of frivolity, the
    significance of hacking, specifically, and play, generally, should not be underestimated,
    either from a practical or philosophical standpoint.


    With the challenge that FOSS offered to what had become in the 1980s normalized
    approach to code as commodity, it is not uncommon to read of FOSS, or more specifically,
    an “open source revolution.” Shopping at Amazon, haggling at eBay, browsing with
    Firefox—all are made possible through FOSS. To use the Internet at invariably
    freely shareable, modifiable, and redistributable software, as 57% of websites
    are hosted, as of July 2013, through the open-source webserver Apache (Netcraft).
    In the era of adoption, mandates catalyzed FOSS implementation in governmental
    agencies in Brazil, Venezuela, and Ecuador, whereas preference for FOSS has been
    expressed by nations such as South Korea, Italy, and South Africa; China, Spain,
    and Thailand have invested government funds in FOSS development; and promotion
    of FOSS has been undertaken by the likes of Russia, Poland, and the European Union
    (Moon and Baker). Because of the hacker emphasis on sharing, it would be easy
    to assume that increased non-commodified software usage itself represent a democrat
    impulse on the part of adopters. In resisting what had in many ways became the
    default development of proprietary software, the move from “closed” proprietary
    software to free and open software is temptingly translated as a move from authoritarianism
    to democracy. With the Chinese government’s development of Red Flag Linux, a distribution
    of the FOSS operating system Linux, some might right China’s official embrace
    of freely shareable, modifiable, and redistributable software as a step toward
    speech. To assume that disruptive technology automatically leads to a disruptive
    politics is not without problems.


    The metonymic association of free and open with democratic often obfuscates practical
    reasons for FOSS adoption. In their technological analysis, David Berry and Giles
    Moss argued that economic and technical'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Encoding and Decoding 7


    efficiencies are often the motivations for government adoption. Instead of transforming
    ‘existing power relations and asymmetries significantly,’FOSS typically results
    in ‘politics as usual’ rather than democratization (22). As a result of this finding,
    not altogether surprising the nature of governmental bureaucracy, it is perhaps
    even less surprising to discover that software hacking may offer little resistance
    to capitalism, if such a challenge was desired. If, indeed, a challenge to capitalism
    was ever an intended aim of the F/OSS communities (an assumption for which there
    is great potential for doubt), then the ramifications of commodity displacement
    that occurs in the development and regulation of F/OSS are quite limited. As Johan
    Soderberg explains, hacking software does not translate into hacking capitalism.


    the demodification of labor and information in this type of code development ‘sets
    the contours of the capitalist relation in relief’ (187) but by no means destroys
    them. With F/OSS development, play is often privileged over work, profite over
    profit, and gift giving over/selling. But because of the continued dominance of
    the proprietary software model in computing generally, Soderberg warns, ‘If we
    are to abide to the pledge of proportionality, we better make too much out of
    hacking.’ In fact, the politics of the software ecosystem do not include more
    traditional politics of resistance. Technological politics must just exist in
    a state where democratic practice, if it occurs, is always on the cusp of collapse,
    so any tension between authoritarianism and democracy is merely an effect of freedom’s
    death rattle, perhaps, unlike politics generally (Mumford 1964).


    If, however, we hold to the possibility for a liberating challenge to scientific
    and technological authoritarianism, the freedoms embodied in F/OSS through the
    hacker ethic appear to offer very real resistance to the restrictiveness of proprietary
    software. So pervasive has this reading of software development culture that it
