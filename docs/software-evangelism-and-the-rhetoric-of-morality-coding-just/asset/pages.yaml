    agreements, because the GPL, as well as the other FLOSS licenses, depend upon
    the protection insured by copyright law, as litigation against those charged with
    violating the terms of the GPL illustrate. Problematically, a recent survey of
    international use of FLOSS reveals that 80.3% of Chinese respondents surveyed;
    the primary reason for their use was the absence of licensing costs, access to
    source code was also mentioned by 72.6% of respondents (Actuate, 2009). If these
    percentages are to be believed, and they have been questioned (Dean, 2009), Frederick
    Muller, an open source evangelist in China, has argued that although “China is
    about Linux and open source,” Chinese software companies have been slow to embrace
    FLOSS development practices (2010).


    The Chinese government, on the other hand, heavily invested in the development
    of a new brand of Linux, entrusted Red Flag, as part of a plan to foster technology
    advancement. But the Chinese government''s investment in Red Flag should not be
    mistaken for a nascent alliance with the morality or politics of the Free Software
    community or the Open Source community. Red Flag Linux most likely pointed to
    an authoritarian copy of FLOSS, one that divorced freely sharable code from the
    moralities and politics of freedom. To support what, at this point, is still supposition,
    a report on Red Flag Asia and evangelist online hub Slashdot showed that officials
    in the city of Nanchang were forced Internet cafes to replace their current operating
    systems with Red Flag (Montagne and Inskeep). Although piracy crackdown was cited
    as the impetus for these replacements, the report claimed that officials demanded
    that even legal copies of Microsoft software and non-Red Flag Linux distribution
    be replaced. The Nanchang incident appeared to be isolated, if it occurred, and
    even less of a potential threat now given that development of the Red Flag Linux
    distribution was abandoned in 2014. This example illustrates how a national culture
    of authoritarianism may complicate, possibly even strip, FLOSS evangelisms of
    their encodings freedom and re-encode in conflicting ways.


    As we have seen in the case of the software development culture, the technical
    functioning of code is incredibly important, as it essentially constitutes the
    digital world. However, the desire for technical execution is by no means the
    only execution work in the software development culture. For the Free Software
    community, as well as in the proprietary software industry, the different evangelical
    models by which to develop efficient and effective code are not always utilitarian.
    In asserting their moral powers to conceive of good and to have a sense of justice
    (Rawls), programmers evangelically encode code as moral and political objects
    that go out into a complex assemblage of meaning that is not merely technical.
    Of course programmers and code constitute a technical ecology'
