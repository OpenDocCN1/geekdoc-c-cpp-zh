  md: '# 182 Embracing Rhetoric


    of software development is today more symbiotic than ever before.

    However, this technological ecology is assembled as part of much more complex
    moral and political ecologies that extend well beyond the boundaries of software
    development. Encoded with very traditional, albeit secular, moralities and politics,
    code is no mere means. The symbolism of play in rhetorical encodings and decoding
    constructs code as a technological artifact that speaks in ways often so unlikely,
    the dominant understanding of science and technology, that software development
    seems to have just as much to do with the phonetic agility as technology.


    Because we live in a world constituted by code, the complexity of the encodings
    and decoding of code in software evangelism signals the need to cultivate a much-needed
    rhetorical literacy. Although the need to increase STEM education currently dominates
    literacy discussions, the importance of rhetorical education must not be overlooked.
    For some, artificial intelligence has very much disrupted, if not displaced, natural
    language. Manovich contends, with tools texts that as hyperlinking, the “new rhetoric
    of interactivity” displays, inspired, convinced, and seduced its readers to adopt
    new ideas, new ways of interpreting the world, new ideologies” (77). But as we
    see from the multiple kinds of work in which software evangelists engage, code
    is developed and assembled in complex moral and political ecologies constituted
    by natural languages, programming languages, and machine language. Therefore,
    to make sense of this complexity demands not only coding literacy but also rhetorical
    literacy. In her examination of computer programming, Annette Vee explains, literacy
    is “a human facility with a symbolic and infrastructural technology—such as a
    writing system—that can be used for creative, communicative and rhetorical purposes”
    (45). What is particularly interesting about software evangelism is the fact that
    it occurs at the intersection of two systems: writing and coding. This intersection
    makes decoding rhetorical effect more challenging, as human and non-humans delegate
    to one another functions and values in unprecedented volume and speed. In light
    of this complexity, it may be tempting to minimize the effect of rhetoric in any
    traditional sense. But as software evangelism illustrates, rhetoric by word in
    the digitized world remains just as salient as the rhetoric by code. In the case
    of moral and political ecologies, in particular, we can see the ways in which
    these rhetors recursively strengthen or weaken one another and their competing
    notions of what is good and what is just. So than assign a diminishing role to
    rhetoric in the age of computing, we must instead recognize the rhetorical imperative
    that compels software evangelism, specifically, and scientific and technological
    evangelism, generally, and what do we must to foster rhetorical literacies that
    allows us to see the power of persuasion in both word and code.'
