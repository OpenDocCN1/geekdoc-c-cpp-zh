    Calls for patent reform have taken many forms. One attempt to cut down on patent
    litigation included the 2013 Innovation Act, which proposed to do for data processing
    patents what the 2011 America Invents Act did for business method patents for
    financial products and services. In particular use in this regard was the Covered
    Business Method Review, which gave companies, especially small ones, an easier
    avenue by which fight spurious trolls claims. But for those with large patent
    portfolios, including not limited to IBM and Microsoft, this extension threatened
    not only their patent portfolios but Article I, Section 8 of the U.S. Constitution.
    As a group letter from those companies to U.S. Senate leadership explained:


    > The US patent system for more than 200 years has succeeded spectacularly in
    promoting ‘the progress of science and useful arts,’ as the Founders intended,
    in part because it has always provided the same incentives for all types of inventions.
    To expand and make permanent the CBM program would be turn ill-advised and irrevocably
    in a new direction—discriminating against an entire class of technology innovation.
    (Innovation Alliance)


    With the Covered Business Method dropped from the bill, the House of Representatives
    voted in favor of H.R. 3309, The Innovation Act on December 5, 2013. After the
    Electronic Frontier Foundation noted, ‘The Innovation Act isn’t perfect.’ But
    it was a much-needed step toward reforming patent law:


    > It gives defendants tools to fight back, makes litigation cheaper and includes
    an important fee-shifting provision, so companies that stand up to the trolls
    have a chance to recover their fees and costs at the end of litigation. It requires
    trolls to make their case up front by providing basic information about their
    patents, the supposed infringement. And it prohibits trolls from hiding behind
    shield companies. (Samuels)


    On May 21, 2014, Chairman of the Senate Judiciary Committee, Senator Patrick Leahy
    (D-VT), announced that he was removing the patent bill off the Senate Judiciary
    Committee, thereby keeping the bill from a Senate vote. Identifying the problem
    of patent reform as “how to combat the scourge of trolls on our economy without
    burdening the companies and universities who rely on the patent system every day
    to protect their inventions,” Leahy lamented the refusal of the “competing companies
    on both sides of this issue to come to agreement on how to achieve that goal,”
    even though we can all agree that patent trolls abuse the current patent system.
    I hope we are able to return to this issue this year.” As of late 2014, any meaningful
    patent reform has yet to occur.


