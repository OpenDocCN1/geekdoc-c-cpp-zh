  md: '# 70 Moral Code


    The problem with it is twofold. First, it’s confusing; the term “free” is very
    ambiguous (something the Free Software Foundation’s propaganda has to wrestle
    with constantly). Does “free” mean “no money charged?” or does it mean “free to
    be modified by anyone”, or something else?


    Second, the term makes a lot of corporate types nervous. While this does not intrinsically
    bother me in the least, we now have a pragmatic interest in converting these people
    rather than thumbing our noses at them. There''s now a chance we can make serious
    gains in the mainstream world without compromising our ideals and commitment to
    technical excellence—so it’s time to reposition. We need a new and better label.


    I brainstormed with some Silicon Valley fans of Linux (including Larry Augustin
    of the Linux International board of directors) the day after my meeting with Netscape
    (Feb 5th). We kicked around and discarded several alternatives, and we came up
    with a replacement label we all liked: “open source”.


    We suggest that everywhere we as a culture have previously talked about “free
    software”, the label should be changed to “open source”. Open software. The open
    source model. The open source culture. The Debian Open Source Guidelines. (Pitching
    this to the corporate world I’m also going to be invoking the idea of “peer review”
    a lot.)


    And we should explain publicly the reason for the change. Linus Torvalds has been
    saying in “World Domain 101” that the open source culture needs to make a serious
    effort to take the desktop and engage the corporate mainstream. Of course he’s
    right—and this relabeling, as Linux agrees, is part of the process. It says we’re
    willing to work with and co-opt the idea for our own purposes, rather than remaining
    stuck in a marginal, adversarial position.


    This re-labeling has since attracted a lot of support (and some opposition) in
    the hacker culture. Supporters include Linus himself, John “maddog” Hall, Larry
    Augustin, Bruce Perez of Debian, Phil Hughes of Linux Journal. Others include
    Richard Stallman, who initially flirted with the idea but now thinks the “open
    source” isn’t pure enough. (1998)


    Following his own advice, Raymond refined the text that had helped to catalyze
    Netscape’s conversion and replaced every use of free software in his seminal “The
    Cathedral and the Bazaar” with open source. The orchestrated campaign to convert
    others from the good news of free software to that of open source also included
    the founding, by Perens and Raymond, of the nonprofit OSI, a “non-profit corporation”
    which was the alternative to the Free Software Foundation. The purpose of the
    OSI was to announce the existence of open source, as the title of the OSI homepage
    illustrated: “Open Source: The Future Is Here.” But more generally, OSI was to
    function as a source of evangelism, to continue to make the case for open source


