    or science, remains the same: Unlike salvation that, in the Christian tradition,
    promises a good afterlife, scientific salvation promises that "we shall bring
    ourselves and our group nearer to the good life" on earth (81). Whereas Burke''s
    conception of this new kind of evangelism is cast in many ways as a corrupted
    news spread in order to obfuscate the power of science and technology, it need
