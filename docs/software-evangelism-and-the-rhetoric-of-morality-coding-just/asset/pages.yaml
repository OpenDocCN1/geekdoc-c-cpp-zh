    As Adam Smith says, "The reward of labour ... is the effect of increasing wealth"
    (2003, 55). But the individual wealth to be accumulated from the "real rights"
    of both property and "exclusive privileges [sic]" (400) naturally serves the "greatest
    public property" (55). The justice inherent in the issuance of copyright is, in
    contrast, to a system in which the legislature sets a specific amount to reward
    works of authorship, limited monopolies encourage reward "precisely positioned
    to the merit of the invention" (83). If the invention be good and such as it is
    profitable to mankind," Smith says, "he will probably make a fortune by it; but
    if it is of no value he will reap no benefit" (83). Only through the recognition
    of rights as property and exclusive privilege can the "perfect liberty and perfect
    justice" needed for a nation to prosper be truly realized (472).


