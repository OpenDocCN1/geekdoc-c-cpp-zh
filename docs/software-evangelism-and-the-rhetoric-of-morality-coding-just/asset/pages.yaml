    To combat the myth of technological and liberal neutrality that pervades software,
    as well as to decode its moral and political constitution, I seek to illustrate
    how software evangelism often encodes code morally and politically. In the software
    development culture, the functional understanding of encode denotes the conversion
    of one symbol or format to another. I type hello on my keyboard and the characters
    are converted through a character-encoding system into the machine language of
    binary code. Through this functional combination and recombining of ones and zeros,
    binary code instructs the computer to function, and the h in hello is encoded
    as 01001000. However, this functional understanding of the encoding of code does
    not account for the ways in which this most fundamental meaning represents only
    one layer of meaning that can be assigned to encode. A symbolic understanding
    of encode instead highlights the importance of rhetoric, the persuasive use of
    natural language, constructing reality and, in the case of software evangelism,
    the ways in which code acts beyond the black box of input/output. The Oxford English
    Dictionary defines to execute as “to follow, carry into effect (an intention,
    purpose, plan, instruction or command).” There is a difference in the ways code
    and rhetoric execute, this is better understood as a difference in degree rather
    than in kind. The persuasive use of natural language does not enjoy pure correspondence
    between input and output that code often, but not always, does. Nevertheless,
    this difference in degree does not negate the fact that rhetoric functions with
    the same kind of invisible force on the world and that code itself is rhetorical
    through its very engaging.


    Although rhetoric does not enjoy Kenneth Burke’s “pure identification” of one-to-one
    correspondence, neither code, at least not always. For, if it did, there “would
    be no strife” (1969, 145) among others, errors that the non-technical end user
    most commonly experience in the forming of spinning wheels, frozen screens, and
    script errors. Conceding, however, that machine strife can often be more easily
    worked out through debugging, this is not necessarily true in rhetorical encoding
    and decoding, and not least with the same degree. Consequently, rhetoric’s ephemerality
    and buggy nature make it the perfect reason to embrace code’s promise of the logic
    of control. Summarizing the position unfaily ascribed to rhetoric, Stanley Finch
    writes: “Rhetoric’s opposite is the Real, or the Substantial, or the Essential,
    and accordingly, rhetoric usually stands for the inauthentic, the ephemeral, and
    the superfluous. This is encapsulated in the adjective ‘mere’ which one almost
    always hears preceding ‘rhetoric’” (228). In the case of F/OSS studies, an emphasis
    on the rhetoric of the F/OSS communities has led to a situation in which, in the
