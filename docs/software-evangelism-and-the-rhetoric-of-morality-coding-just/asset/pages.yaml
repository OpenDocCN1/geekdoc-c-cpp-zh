  md: '# 1 Encoding and Decoding


    Software evangelism—the joining of these two terms might create charitable readers
    as a clever metaphor that figuratively creates a relationship one would not otherwise
    exist. Software, after all, belongs to the realm of science and technology. Founded
    upon the principle of the algorithm, software programming endeavors to calculate
    and organize the world through computation. Just as with an ordinary cooking recipe,
    this programming occurs through finite, step-by-step instructions that result
    in an executable effect. Evangelism, on the other hand, exists in the realm of
    religion as an activity through which those of faith aim to spread divinely inspired
    “Good News” in an effort to convert and thereby save the souls of non-believers.
    In the Christian tradition, the duty to evangelize arises from the apostolic Gospels
    of the New Testament: “Go therefore and make disciples of all the nations, baptizing
    them in the name of the Father and of the Son, and of the Holy Spirit, teaching
    them to observe all things that I commanded” (Matthew 28: 19–20). So whereas these
    two terms might readily be seen to crystallize a divide between reason and faith,
    the use of evangelism in relation to software is neither uncommon among the software
    development culture nor unrelated to those moral concerns once seemingly the purview
    of religion. In fact, I argue throughout this book that software evangelism constitutes
    algorithmic science and technological programming both morally and politically,
    so much, in fact, software evangelism serves to explain a fundamental conundrum
    of liberal democracy: how, if at all, a shared conception of what is just exist
    among free and equal persons with competing, incommensurable, moral beliefs?


    My contention is that an analysis of software evangelism has the potential to
    reveal not only the moral (and also immoral) effects rhetorically engineered in
    code but also the struggle to create a just system that reaffirms the right of
    programmers to choose how their code is used, modified, and distributed is no
    small claim, I realize. In many ways, this claim initially appears completely
    counter to what is generally understood in development culture as software evangelism:
    the encouragement of third-party development for a particular platform so as to
    increase the number of tools and applications available on that platform. In one
    of the earliest public invocations of evangelist in the context of software, David
    Needle, in a brief'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 2 Encoding and Decoding


    article in the August 6, 1984 edition of InfoWorld: The Newsweekly for the Microcomputing
    Community, reported on the rollout of new software at the National Computer Conference
    in Las Vegas, Nevada. In the course of his reporting, Needle relayed an exchange
    with Apple employee Guy Kawasaki, whose title Needle demarcated with scare quotes
    to signify its strange appropriation to the world of software development:


    Apple expects 50 software packages to be available for the Mac by the end of this
    summer and approximately 150 by the end of the year, says Guy Kawasaki, Apple’s
    “software evangelist,” who works with companies other than Apple that are involved
    in product development for the Macintosh and Lisa Systems. “You will without a
    doubt see the most imaginative software on any personal computer at the fastest
    rate of introduction on the Macintosh,” Kawasaki says. (12)


    Like many of his contemporaries at the time, the Macintosh computer suffered from
    a dearth of development tools, programming languages, and software applications.
    As an evangelist, Kawasaki’s aim was to spread the good news of the company’s
    upcoming releases, and as to encourage third-party developers to create for the
    Macintosh platform. Born out of competition among software start-ups and the desire
    to dethrone the computing giant IBM, the “software evangelist,” a term coined
    by Apple manager Mike Murray, encapsulated the importance of winning over support
    of third-party developers rhetorically, in short, to convert them to the Macintosh
    platform. Almost a year after Needle’s article, “angelists Aid Developers,” written
    by Tom Maemaa in the July 20, 1985 issue of InfoWorld, identified the spreading
    of the “gospel according to Macintosh” as the primary reason for the astonishing
    growth of the company’s software from a few dozen products over hundred in less
    than a year, a feat so remarkable that even the “Goliath” IBM had taken notice
    of David (39).


    Although obviously important to this particular period in the early history of
    the personal computer, software evangelism should not be mistaken as a strategy
    of struggling start-ups desperate to establish themselves. Microsoft went so far
    as to formally institutionalize evangelism in 2001 with its Developer and Platform
    Evangelism Division, the purpose of which, according to the company’s announcement,
    was “to integrate developer tools and evangelism across Microsoft and enhance
    the tools and technologies available to millions of developers, partners, information
    technology professionals and ends.” In addition to Apple and Microsoft, Adobe,
    Amazon, eBay, Hewlett-Packard, Google, IBM, Intel, Oracle, Red Hat, Samsung, and
    Yahoo all currently employ evangelists, whose titles range from “Developer Evangelist”
    and “Principle Technical Evangelist” to “Cloud Evangelist” and “User Experience
    Evangelist” in a reflection of the wide scope that evangelism now takes in software
    development. In perhaps the broadest evangelical role to date, Vinton G. Cerf,
    a'
