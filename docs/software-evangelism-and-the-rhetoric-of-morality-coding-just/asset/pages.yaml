  md: '# COPYRIGHT LICENSING''S HARMONY

    ROUGH DISHARMONY


    Unlike patents, copyright protection for code has long enjoyed consensus in the
    software development community. In the first edition of BYTE in 1976, Calvin Moers
    asked, “How can your new software be sold and still be protected from ‘soft-lifting’
    (equivalent to ‘shopplifting’ in another context)?” The answer, Moers wrote, was
    to be found in the “magic” of copyright: “The best tool we have is copyright,
    which is the same legal tool used by all authors—authors of novels, plays, and
    other kinds of creative works. Although it would be more than four years until
    the Copyright Act amendments, recommended by CONTU, cemented code in its various
    layers as a legally legitimized work of authorship, hobbyists had already become
    accustomed to thinking of them as authors. Especially because of proprietary authorship
    for the microcomputer, copyright afforded authors, whether an individual, a group
    of hobbyists, or a corporation, the ability to regulate software in ways that
    not only controlled how others used their property but also allowed authors to
    constitute a moral sought as a legal. Although the approach to copyright by Microsoft,
    the Free Software community, and the Open Source community parallels in many ways
    the patents commons often aligning through praxis in support of their respective
    moral beliefs, the political ecology created by copyrightable source and object
    code functions relatively harmoniously in comparison to arguments center on whether
    copyright works fairly as a software regulatory device but instead on what kind
    of copyright application is the most fruitful.


    Mostly commonly, the conventions of a software licensing agreement set the terms
    and limitations of the rights that copyright holder gives to the user. In order
    to legally use the software, a user must abide by the terms stipulated in the
    agreement. At a minimum, the conventions of a licensing agreement explain what
    rights are given to the user in regard to copying and distributing a program.
    The End User Licensing Agreement (EULA), a licensing agreement of the proprietary
    software industry, limits the use and number of copies a licensee may have in
    order to artificially create scarcity. As explained in the Microsoft EULA for
    the individual consumer of Windows 2000, “You [the licensee] may install, use,
    access, display and run one copy of the SOFTWARE on the COMPUTER.”— which a business,
    governmental organization, or academic institution has the right to install a
    copy of the software on multiple computers—the Microsoft EULA limits the copying
    and use of software independently purchased by an individual for personal use
    to one computer. As explained in the EULA, a licensee is allowed to make one back-up
    copy of the software in cases where the software comes preinstalled on a computer
    by an original equipment manufacturer (OEM):


    YOU MAY MAKE A SINGLE BACK-UP COPY OF THE SOFTWARE.

