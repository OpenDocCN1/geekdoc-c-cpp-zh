  md: '# Fair Regulation 147


    licensee and the licensee only, the sharing of that copy with other users is not
    a right granted to the licensee, and is, in fact, infringement under the conditions
    outlined in the EULA. With proprietary software, the economic value of the software
    is located in the commodity of software itself, specifically in its sale value.
    EULA legally constructs the sale value of the product as a “final good” (Raymond
    2001, 48). The limitation on distribution, as specified in the EULA, maximizes
    the opportunities to capitalize on commodified software’s sale value, just as
    the copying feature does.


    While evangelized as sharing or stealing, distributing Microsoft’s intellectual
    property to others denies Microsoft its exclusive privileges and is therefore
    infringement. Ignoring or acting contrary to Microsoft’s specified limitation
    is under copyright an infringement upon Microsoft’s exclusionary right to copy
    and distribute copies of its intellectual property.


    In contrast to the EULA, the GNU General Public License (GPL), which regulates
    the GNU Project and the Linux kernel, is a constitution that creatively adapts
    copyright to the respective moral freedoms evangelized by the F/OSS communities.
    The GNU GPL, although also structured by the generic features of copying and distribution
    specifications as the EULA, is significantly different from those values forwarded
    by the EULA and is comprised upon the Kantian notion of the “waiver.” As stated
    in Section 3 of the GPL, “You [the licensee] may copy and distribute the Program
    ... in object code or executable form.” In giving licensees the rights to copy
    and distribute software, the GPL legally constructs software as free and invites.
    Whereas the EULA denies licensees the right to copy and distribute proprietary
    software for the sake of protecting the monopolistic rights of the author, the
    GPL essentially waives the owner’s exclusive right of property and gives to licensees
    the same rights awarded to the lessor, a process that became as copyleft. In his
    1983 announcement of the GNU Project, Stallman originally told programmers they
    could contribute “by writing a compatible duplicate of some Unix utility and giving
    it to me.” Not an uncommon practice, giving away one’s software had actually been
    described by Moors when he first addressed the issue of authorship in BYTE in
    1976: “The easiest way is to give your software away, thereby forfeiting ownership.
    You won’t have any problems as an owner. For some kinds of hobby software, this
    is the preferred course. After all, a hobby is mainly for the fun of the thing,
