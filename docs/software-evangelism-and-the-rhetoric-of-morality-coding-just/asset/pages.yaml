  md: '# Acknowledgments


    In 1985 I was an eighth-grader at Santa Maria del Popolo in Mundelein, Illinois.
    By some miracle the school had acquired a classroom of computers upon which my
    classmates and I set about learning BASIC with the help of Sister Mary Alice.
    With careful coding, "Hello World!" ran across my computer screen numbers calculated
    before me and a city skyline that defied popped up in the formerly blackish-green
    void. Then the year was over. And except for the rare storytelling Mao I really
    thought about code many years later how my grade of a ''C'' in Computers kept
    me off the High Honor Roll in the 8th grade, I never really thought until many
    later when a programmer friend happened to mention passing one day that programmers
    talk about something really ''interesting stuff''. After 14 years of studying
    what it is that programmers talk and write about, I can confirm that this is certainly
    the case.


    I am grateful to the many people who helped me make this book happen in one way
    or another at Miami University, Susan Jarratt, Fran Dolan, Kate Ronald, Morris
    Young, and LuMing Mao; Northern Illinois University, Doris McDonald, Michael Day,
    Bradley Peters, Deb Holdstein, and John Schaeffer; and at University of Maryland,
    Baltimore County, Jodi Crandall, Lucie McCarthy, Beckel, and Christine Mallinson.
    To PhilsetBounds, you are the Duke of Rhetoric and I thank you for your kindness
    over the years. To the great group of friends who cheered me on when this book
    seemed like an insurmountable obstacle I thank you, especially Aimee Reissenbauer,
    Heather Linville, Eric Savage, Cori Diggins, Donna Kain, Catherine Fox, Noki Shanga,
    and Elizabeth Wardle. To my comrades in arms—Jody Shipka and Helen Burgess—thank
