    the front seats. But to combat this ongoing scenario, he purchases for the very
    purpose that his arm has been serving the-made product of a reinforced, padded
    steel bar that attaches to the head-rests and protects small children from flying
    away in the case of an accident. In “delegating” both the continuous conjunction
    of my voice and extension of my right arm” (1992, 249) to the technology of the
