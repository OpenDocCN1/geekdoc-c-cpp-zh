    # CONSTRUCTING MORALITY FROM THE BOTTOM UP


    Conceptions of good and ill have long been intricately entwined with constructions
    of character (ethos). As Aristotle explained, “The origin of action is choice,
    and of that is desire and reasoning with a view to an end. This is why choice
    cannot exist without thought and intellect or without a moral state; for good
    action and its opposite cannot exist without a combination of intellect and character”
    (1984b, 1139a 32–35). Aristotle offered a nearly bound list of virtues for understanding
    how character leads to moral judgments that, in turn, leads to deliberate action
    to achieve a good that leads to human flourishing (eudaimonia), his discussion
    of character allows for none of the variables involved in modern politics, including
    the denial of their relevance, even their existence. Furthermore, Aristotle’s
    configuration of virtuous character as existing in the emotional mean between
    “excess and deficiency” (e.g., courage is the mean between feelings of fear and
    confidence) often appears to offer more confusion than clarity in thinking about
    choice (1105b 19–1109b 26), especially given the absence of a unified value set
    in today’s modern pluralist society.


    However, the limitations of Aristotelian virtue ethics should not overshadow the
    heuristic he offers for thinking about how morality, choice, good, and ill are
    all tangled together in praxis as reflexive action. In fact, when this heuristic
    is contextualized in Aristotle’s discussion of character as a “mode of persuasion,”
    appeal in the narrative praxis of evangelism is refocused as the construction
