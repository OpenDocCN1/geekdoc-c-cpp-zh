    \ | Probit: $\\Phi^{-1}(\\pi_j) = \\mathbf{x}\beta$ | Normal: $\\pi_j = \\Phi(\\\
    mathbf{x}\beta)$ |\n| Poisson($\\lambda_j$) | Logarithm: $\\ln(\\lambda_j) = \\\
