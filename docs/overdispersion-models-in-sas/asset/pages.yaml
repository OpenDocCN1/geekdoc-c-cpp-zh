    \n# 6.6 An Example of Urinary Tract Infections (UTI) in Men Infected with HIV\n\
    \nVan den Brooks (1995) proposed a score test for testing the Zero-inflation probability\
    \ parameter $\\omega$ in the case of the Zero-inflated Poisson distribution (6.10),\
    \ which permits us to test whether the number of zeroes is too large to fit the\
    \ Poisson distribution. Van den Brooks's test is illustrated using data from a\
    \ study conducted in the Department of Internal Medicine at the Utrecht Hospital,\
    \ the Netherlands, where $n=98$ human immunodeficiency virus-infected (HIV)-infected\
    \ men were followed up for two years. Urinary cultures were obtained during the\
    \ first visit and every six months when signs and symptoms of urinary tract infections\
    \ (UTI) occurred, or when patients had fever of unknown origin. CD4+ cell counts\
    \ were also measured. CD4+ count is a blood test to determine how well the immune\
    \ system is working in people who have been diagnosed with immunodeficiency (HIV).\
    \ CD4+ counts are reported as the number of cells in a milliliter of blood. A\
