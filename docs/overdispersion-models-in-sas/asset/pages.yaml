  md: "# Overdispersion Models in SAS\n\nProgram 10.1 provides the programming statements\
    \ for fitting the previously described Logistic GLMM. We fit this model by means\
    \ of GLIMMMIX procedure, using the Quadratic Estimation method (model option 'method=quad').\
    \ Output 10.1 shows selected portions of the output generated by GLIMMMIX.\n\n\
    # Program 10.1: Logistic GLMM–Multicenter Randomized Clinical Trial\n\n```\n/*\n\
    Beitler and Landis (1985)\nMulticenter Randomized Clinical Trial Example\n*/\n\
    data multi_center;\n  input clinic trt $ t m;\ndatallines;\n1 Drug      11 36\n\
    1 Control    10 37\n2 Drug      16 20\n2 Control    22 32\n3 Drug      14 19\n\
    3 Control     7 19\n4 Drug       2 16\n4 Control     1 17\n5 Drug       6 17\n\
    5 Control     0 12\n6 Drug       1 11\n6 Control     0 10\n7 Drug       1 5\n\
    7 Control     1 9\n8 Drug       4 6\n8 Control     6 7\n;\n\\ods html;\ntitle\
    \ \"**Multicenter Randomized Clinical Trial -- maxitler and Landis (1985) ****\"\
    ;\nproc glimmix data=multi_center method=quad order=data;\n  class clinic trt;\n\
    \  model t/m = trt + link=logit dist=binomial s;\n  random int / subject=clinic;\n\
    \  lmeans trt / ilink;\n  estimate \"Drug Vs Control\" trt 1 -1 / or cl;\nrun;\\\
    ods html close;\n```\n\nMorel, Jorge, and Nagaraj Neerchal. Overdispersion Models\
    \ in SAS. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA: ALL\
    \ RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
