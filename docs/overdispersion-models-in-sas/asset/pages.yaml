    # 2.3 A Simple Linear Regression Example


    Consider the data in Table 2.1 containing the initial weights and gains in weight
    (grams) of 15 female rats on high protein diet from 24 to 84 days of age. These
    data were taken from Snedecor and Cochran (1980, 7th Ed., pp. 156–157).


