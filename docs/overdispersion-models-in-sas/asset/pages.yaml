  md: "# 44 Overdispersion Models in SAS\n\n# ## Program 2.5: Analysis of Ille-Vileain\
    \ Study of Oesophageal Cancer Data Using GENMOD\n\n```\n/*\n  Ille-Vileain Study\
    \ of oesophageal cancer, Tuyns et al. (1977)\n*/\ndata one;\n    input_stratum\
    \ stratum $ count x1 x2;\n    format alcohol $5;\n    alcohol = 'High'; count\
    \ = x1; output;\n    alcohol = 'Low'; count = x2; output;\n    drop x1 x2;\n \
    \ datalines;\n  25-34 Case 1 0\n  25-34 Control 9 106\n  35-44 Case 4 5\n  35-44\
    \ Control 26 164\n  45-54 Case 25 21\n  45-54 Control 29 138\n  55-64 Case 42\
    \ 34\n  55-64 Control 27 139\n  65-74 Case 19 36\n  65-74 Control 18 88\n  75+\
    \ Case 5 8\n  75+ Control 0 31\n;\n;\n```\n\n```\nproc sort data=one;\n    by\
    \ age_stratum alcohol;\nrun;\n\nproc transpose data=one out=oesophageal_cancer;\n\
    \    by age_stratum alcohol;\n    var count;\n    id cancer;\nrun;\n```\n\n```\n\
    data oesophageal_cancer;\nset oesophageal_cancer;\n    m = Case + Control;\ndrop\
    \ name_;\nrun;\n\\ods html;\nproc genmod data=oesophageal_cancer;\n    class age_stratum\
    \ alcohol;\n    model case/m = age_stratum alcohol / dist=binomial link=logit\
    \ type3;\n    estimate 'Ln(OR) High Vs Low' alcohol 1-1 / exp;\nrun;\nods html\
    \ close;\n```"
