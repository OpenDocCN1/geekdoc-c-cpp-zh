  md: '# 6 Overdispersion Models in SAS


    and


    Var(Y) = \mu + \kappa\mu^2 = \mu(1+\kappa\mu), \kappa > 0.


    The parameter \kappa is known as the dispersion parameter. Observe that when \kappa
    = 0, variance in equation (1.6) becomes that of the Poisson model. Dean (1992)
    provides an additional form of overdispersion by considering (1.6) as Var(Y) =
    \mu(1+\kappa).


    The consequences of ignoring overdispersion are well known. For all, the standard
    estimates of error (naive in the sense of ignoring the clustered nature of the
    data) are smaller than they should be. Using them in testing of hypotheses resulted
    in Type I Error Rates, i.e., false positive rates are larger than nominal ones.
    Hence, erroneous inferences ensue.


    # 1.4 An Extended Definition of Overdispersion


    There are many cases of overdispersion. In the case of the Binomial/Multinomial
    distribution, overdispersion results when either the assumption of independence
    (within elemental units) or common probability of success is violated. In the
    case of the Poisson distribution, overdispersion is observed when the rate of
    the events varies subject to subject; such rates are assumed to be distributed
    as a Gamma variable. Overdispersion arises in a natural way of clustered data.
    It is found in case of longitudinal data with repeated measurements. Observed
    counts on subjects usually exhibit overdispersion. For instance, think of a clinical
    study of osteoporotic patients at high risk for vertebral fractures. The number
    of incidents is measured over a given period. The same patient may suffer multiple
    occurrences and thereafter make several contributions to the count, which leads
    to the violation of the "independent occurrences" assuming the Poisson distribution.
    Therefore, the cases are not truly arising from a Poisson distribution and thus
    exhibit overdispersion.


    The developments in the last 20 years or so on mixture distributions and Generalized
    Linear Mixed Models (GLMM) have brought overdispersion to full. Overdispersion
    has surpassed its boundaries; it is a broader topic than the common characterization
    provided in Section 1.2. Mixtures of Multinomial distributions, such as the Dirichlet-multinomial
    (Mosimann, 1962) and the Random-clumping distribution proposed by Morel and Nagaraj
    (1993) and Neerchal and Morel (1998), have overdispersion relative to the multinomial
    distribution with the mean vector and variance-covariance matrix, as in (1.3)
    and (1.4). The Negative-binomial distribution with mean and variance, as depicted
    in equations (1.5) and (1.6), exhibits overdispersion relative to the Poisson
    distribution. A Binomial distribution with random effects properly defined has
    overdispersion relative to the Binomial model. Additionally, a Beta-binomial distribution
    with random effects has overdispersion relative to the Beta-binomial, and the
    Beta-binomial itself has overdispersion relative to the Binomial distribution.
    The list goes on and on. Appendix 1.1 in this chapter shows some hierarchical
    diagrams of overdispersion that we intend to cover in this book.'
