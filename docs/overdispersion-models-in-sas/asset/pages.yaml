  md: "specified directly without conditioning on subjects. Inferences, as previously\
    \ stated, are at the population-average level. R-side effects are also called\
    \ \"residual\" effects. Models in practice might have several G-side and/or R-side\
    \ effects. Linear Normal models containing both effects can be handled by the\
    \ MIXED procedure. The concept of a mixed model can be extended to any distribution\
    \ in the exponential family. This extended family of models is known as Generalized\
    \ Linear Mixed Models (GLMM) and can be handled by the GLIMMIX procedure. Other\
    \ procedures in SAS, such as NLMIXED, permit the use of GLMMs. For more information\
    \ on mixed models, GLMMs, and non-linear models with random effects, we refer\
    \ the reader to Littell et al. (2006). We now present a simple simulated example,\
    \ in the same structure as the hair growth application described above, to illustrate\
    \ the G-side and R-side random effects. The programming statements of the data\
    \ generation as well as the fitted programs are included in Program 9.1.\n\n#\
    \ Program 9.1: Generating Continuous and Binary Data from a Random Effects Model\n\
    \n```\ndata hair;\n    seed = 1999;\n    beta = 1.386294;   *--- P is approximately\
    \ 0.8;\n    do Subj_id=1 to 1000;\n    s1 = 2*normal(seed);\n    s2 = sqrt(1.5)*normal(seed);\n\
    \        do week=1 to 8;\n            score = round(s1 + normal(seed), 0.01);\n\
    \            p     = 1/(1+exp(-beta - s2));\n            y     = 0;\n        \
    \    u     = uniform(seed);\n            if u < p then y = 1;\n            output;\n\
    \        end;\n    end;\nkeep subj_id score y;\nrun;\n\nods html;\ntitle \"***\
    \ Linear Mixed Model with G-side Random Effects ***\";\nproc glimmix data=hair;\n\
    \    class subj_id;\n    model score = / s;\n    random int / subject=subj_id;\n\
    run;\n\ntitle \"*** Linear Mixed Model with R-side Random Effects ***\";\nproc\
    \ glimmix data=hair;\n    class subj_id;\n    model score = / s;\n    random _residual_\
    \ / subject=subj_id type=cs;\nrun;\n```"
