- pgno: 113
  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses\n\n**Plot\
    \ 4.3:** Probability Functions of the Beta-binomial and Random-clumped Binomial\
    \ Distributions When $\\pi=0.5$, $\rho=0.8$ and $m=20$\n\n![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_113_0.png)\n\
    \n# 4.8 Generalized Linear Overdispersion Models for Binomial Responses\n\nIn\
    \ this chapter, we have considered overdispersion models with a common probability\
    \ of success $\\pi$ and a common overdispersion parameter $\rho$. Analogous to\
    \ the Binomial distribution, we introduce link functions to model the probability\
    \ of success $\\pi$. In addition to the parameter, we also have the overdispersion\
    \ parameter $\rho$, which potentially can be different from cluster to cluster.\
    \ We will have two link functions: one for the probability of success and one\
    \ for the overdispersion parameter. This class of models will be referred as **Generalized\
    \ Linear Overdispersion Models (GLOM)**. They combine the modeling features of\
    \ GLM with the distributional features of the overdispersed models presented here.\
    \ Cluster-specific covariates can be used on both link functions. For example,\
    \ on a study with two treatments, a treatment indicator variable can be used to\
    \ fit a model that allows for different probabilities of success and different\
    \ degrees of overdispersion. An illustrative example will be given in section\
    \ 4.9.\n\nMorel, Jorge and Nagaraj Neeraj. Overdispersion Models in SAS®. Copyright\
    \ © 2011, SAS Institute Inc., North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 114
  md: "# 102 Overdispersion Models in SAS\n\nSuppose that $T_j, j=1,2,...,n$ are independent\
    \ and independently distributed overdispersed binomial random variables with parameters\
    \ $(\\pi,\rho;m)$. This is the case in the chromosome example discussed in Section\
    \ 4.6. The log-likelihood function can be expressed as\n\n```\n$L(\\hat{\\theta};t)\
    \ = \\sum_{j=1}\\ln[Pr(T =t_j)], \\quad (4.29)$\n```\n\nwhere $\theta = (\\pi,\\\
    rho)^T$ represents the parameter vector and $t = (t_1,t_2,...,t_n)^T$ the observed\
    \ data. The MLE of $\theta$, say $\\hat{\\theta} = (\\hat{\\pi},\\hat{\\rho})^T$,\
    \ can be found iteratively as\n\n```\n$$\\hat{\\theta}^{(S+1)} = \\hat{\\theta}^{(S)}\
    \ + I(\\hat{\\theta}^{(S)})^{-1}u(\\hat{\\theta}^{(S)}), \\quad (4.30)$\n```\n\
    \nwhere $u(\\hat{\\theta}^{(S)})$ is the two-dimensional column vector of first\
    \ derivatives of the log-likelihood function $u(\\theta) = \\frac{\\partial L(\\\
    theta;t)}{\\partial\\theta}$ evaluated at $\\hat{\\theta}^{(S)}$, and $I(\\hat{\\\
    theta}^{(S)})$ is the 2x2 Fisher information\n\n```\n$matrix = -E \\left[ \\begin{matrix}\
    \ \\frac{\\partial^2 L(\\theta;t)}{\\partial\\theta_1^2} & \\frac{\\partial^2\
    \ L(\\theta;t)}{\\partial\\theta_1\\partial\\theta_2} \\ \\frac{\\partial^2 L(\\\
    theta;t)}{\\partial\\theta_2\\partial\\theta_1} & \\frac{\\partial^2 L(\\theta;t)}{\\\
    partial\\theta_2^2} \\end{matrix} \\right]$ evaluated at $\\hat{\\theta}^{(S)}.$\
    \ The iterative\n```\n\nprocedure (4.30) corresponds to the Fisher Scoring Method.\
    \ The subscript \"s\" refers to the step or iteration. The actual numerical method\
    \ used may vary.\n\nLike GLMs, the $T_j$'s are independent and belong to the same\
    \ distribution, but they are not identically distributed. In other words, $T_j,\
    \ j=1,2,...,n$ are distributed according to an overdispersed Binomial distribution\
    \ with parameters $(\\pi_j,\\rho_j;m_j)$. The mean parameter $\\pi_j$ is assumed\
    \ to depend on a k-dimensional row vector of known covariates $x_j$ and a k-dimensional\
    \ column vector of unknown parameters $\\beta$, through a twice differentiable\
    \ smooth function $g(\\cdot)$, so that\n\n```\n$g(\\pi_j) = x_j\\beta = \\sum_{i=1}^k\
    \ x_{ji}\\beta_i. \\quad (4.31)$\n```\n\nSimilarly, the overdispersion parameter\
    \ $\\rho_j$ might depend on an h-dimensional row vector of known covariates $z_j$,\
    \ and an h-dimensional column vector of unknown parameters $\\alpha$, through\
    \ a twice differentiable smooth function $f(\\cdot)$, so that\n\n```\n$f(\\rho_j)\
    \ = z_j\\alpha = \\sum_{i=1}^h z_{ji}\\alpha_i. \\quad (4.32)$\n```\n\nMorel,\
    \ Jorge, and Nagaraj Necheral. Overdispersion Models in SAS®. Copyright © 2011,\
    \ SAS Institute Inc.. Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses 103\n\n\
    The function g(.) is the **link function** associated with the “mean” parameter.\
    \ This link function has $\\eta_{ij} = \\mathbf{x}\beta$ as its **linear predictor**.\
    \ Similarly, $f(\\cdot)$ is the **link function** related with the **“overdispersion”**\
    \ parameter and has $\\eta_{2j} = \\mathbf{z}\\alpha$ as its linear predictor.\
    \ The parameter vector is\n\n(k+h)-dimensional column vector $\\mathbf{\theta}\
    \ = (\\beta', \\alpha')^T$. Its MLE $\\hat{\\mathbf{\theta}} = (\\hat{\beta}',\
    \ \\hat{\\alpha}')^T$ can be obtained iteratively using appropriate numerical\
    \ methods. In Chapter 8 a more extensive discussion on computational issues related\
    \ to the multivariate extensions of the Beta-Binomial and the Random-clumped binomial\
    \ distributions will be addressed.\n\n# 4.9 A Teratology Example about Ossification\
    \ on the Phalanges\n\nConsider the ossification data of Table 4.6, which has been\
    \ previously analyzed by Hartsfield et al. (1990), and Neerchel (1997). When we\
    \ introduced the concept of overdispersion, come from a two-way design with 81\
    \ pregnant phenytoin (PHT) and trichloropropene oxide (TCCO). The purpose of the\
    \ experiment was to investigate the synergistic effect of phenytoin and TCCO.\
    \ The presence or absence of ossification on the phalanges is considered a measure\
    \ of the teratogenic effect of the substances under study. In some ossification\
    \ did not occur at all; in others the ossification was almost complete. The middle\
    \ third phalanges were selected to provide about 20% chance of ossification in\
    \ the control groups. In the experiment each pregnant mouse received dosages of\
    \ water, a sham control group (Sham) three treated groups received daily, by gastric\
    \ gavages, 60 mg/kg of phenytoin (PHT), 100 mg/kg of trichloropropene oxide (TCCO),\
    \ or 60 mg/kg phenytoin and TCCO. For illustrative purposes, the controls were\
    \ combined and referred to as combined controls. We present here the analysis\
    \ of the middle third phalanges. The fetus then be seen as a 2 x 2 factor, with\
    \ PHT and TCCO as the two factors. The levels of PHT are 60 mg/kg and 60 mg/kg,\
    \ and the levels of TCCO are 100 mg/kg and 0 mg/kg. On day 18 of gestation, fetures\
    \ were recovered, stained, and cleaned. Then, by visual inspection, the presence\
    \ or absence of ossification was determined for the different joints of the right\
    \ and left forceps. The data on the middle third phalanges are shown in Table\
    \ 4.6. The example discussed in Section 1.1 corresponds to the 11 mice that were\
    \ treated with both substances PHT and TCCO.\n\n| Table 4.6: Ossification Data\
    \ |\n| Group | Observations |\n|---|---|\n| Control | 8/8, 9/9, 7/0, 3/5, 3/8,\
    \ 9/0, 5/8, 1/6, 0/5, 8/8, 10/5, 4/7, 9/0, 6/3 |\n| Sham | 8/9, 10/10, 1/6, 6/6,\
    \ 1/9, 8/9, 6/7, 5/7, 5/9, 2/6, 2/8, 0/2, 7/8, 5/7 |\n| PHT | 1/9, 4/9, 3/7, 4/7,\
    \ 0/4, 1/8, 2/7, 0/2, 3/10, 3/7, 0/8, 10/1 |\n| TCCO | 0/5, 7/10, 4/8, 11/11,\
    \ 6/9, 3/4, 2/8, 0/9, 3/6, 2/9, 10/1, 8/9 |\n| PHT+TCCO | 2/2, 0/7, 1/8, 7/8,\
    \ 0/10, 0/4, 0/6, 0/7, 6/6, 1/7 |\n\n*Number of fetuses showing ossification /\
    \ litter size.\n* PHT: phenytoin; TCCO: trichloropropene oxide."
  merge: -1
