  md: '# Overdispersion Models in SAS


    $O_s = \sum_{j=1}^{n_s} I\left(\frac{t_j}{m_j} \in A_s\right) \quad (5.5)$


    and


    $E_s = \sum_{j=1}^{n_s} \text{Pr}(T_j = t) I\left(\frac{t}{m_j} \in A_s\right),
    \quad (5.6)$


    where $I(.)$ represents an indicator function and $\text{Pr}(T=t)$ is evaluated
    by the maximum likelihood estimates of $\pi$ and $\rho$. Note that $\sum_{s=1}
    O_s = \sum_{s=1} E_s = n$. If the clusters are all of the same


    size, it can be shown that the expression (5.6) for frequentist reduces to


    $E = m \text{Pr}\left(\frac{T}{m} \in A_s\right)$ and that the Chi-square statistic
    will bicome the usual Pearson''s GOF


    statistic.


    This omnis testing with varying ''m''s is found in Neerchel and Morel (1998).
    They fit the Beta-binomial and Random-clumped Binomial distributions to three
    data sets (referred as Datasets I, II and III) on induced mutagenic damage, previously
    analyzed by Haseman and Soares (1976). A group of male mice were first treated
    with a suspected mutagen and later with one or more untreated females. The female
    mice became pregnant, and after a certain time they were sacrificed and then examined
    the fréquente of living and dead implantations (an implantation is an early stage
    of fetus). Since implantations or fetuses from the same mother need to respond
    similarly, it is reasonable to treat them as a natural cluster. Table 5.2 details
    Dataset III, which is based on n=554 DBA/23 females x CD-1 male mating. The table
    provides the number of female mice with "d" implantation of those frequencies
    is the number of female mice n=554. Note that the total number of implantations
    (cluster sizes in the pregnant mice varies between 1 and 18. The value of dead
    implantations "" varies between zero and nine. As reported in Neerchel and Morel
    (1998), it turned out that both the Beta-binomial and Random-clumped Binomial
    models fit Dataset I. On the other hand, the Random-clumped Binomial distribution
    fit Dataset II marginally and Dataset III adequately. The Beta-binomial model
    did not fit either Dataset II or Dataset III.


