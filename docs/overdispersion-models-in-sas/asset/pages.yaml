    # 7.1 Introduction


    This chapter provides a gentle introduction to the analysis of multinomial count
    data exhibiting

    overdispersion. We begin with a brief discussion of Multinomial models and provide
    a basic

    introduction to two most commonly used link functions. A brief example gives the
    reader the

    flavor of some the issues arising in multinomial data which were not present in
    the binomial

    data. We then introduce the concept of multinomial overdispersion as well as the
    scale adjustment


