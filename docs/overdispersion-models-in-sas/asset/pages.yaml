- pgno: 71
  md: '# Chapter 3 Quasi-likelihood Functions 59


    Efron explained that a genuine random sampling was infeasible, the subjects may
    have been sampled in clumps. Efron states that


    > "Clumped sampling is just one of possible causes of overdispersion, a habitual
    source of concern to users of the binomial and Poisson models."


    We use the toxoplasmosis data in Table 3.2 to illustrate two methods for fitting
    Quasi-likelihood models. The first method, which consists of inflating the covariance
    matrix of the MLEs by a suitable constant, is available in both the GENMOD and
    GLIMMIX procedures. The second method linearizes the GLM and an estimation technique
    known as Pseudo-likelihood (PL). The PL method is available only in the GLIMMIX
    procedure. We will discuss the PL method in more detail later in Chapter 9.


    Program 3.2 presents programming statements for fitting a Quasi-likelihood regression
    model by first obtaining the MLEs and inflating the covariance matrix by a moment
    estimator of the scale parameter $\phi$, as indicated in (3.6). We first compute
    the $z_i$, the standardized values of frankly. The statement "random_residual"
    produces the previously discussed Quasi-likelihood procedure. The results are
    provided in the Output 3.2. The estimated value of the scale parameter, the Pearson''s
    Chi-square statistic, normalized by its degrees of freedom, is $\phi=1.94$. The
    results of this analysis indicates that the linear and cubic terms of the standardized
    rainfall are statistically significant (P<0.05). The option "s" in the model statement
    stands for "solution" and provides the parameter estimates.


