    run;\ndata outl;\n  set kupper-haseman;\n  pi = &Pi;\n  pic = 1 - pi;\n  pipic\
    \ = pi * pic;\n  mpi = m * pi;\n  t_mpi = t - mpi;\n  pit_mpi = pi * t_mpi;\n\
    \  tpic = t * pic;\n  mm_1 = m * (m-1);\n  aux = (t_mpi*t_mpi + pit_mpi - tpic)\
    \ / pipic;\nkeep aux mm_1;\nrun;\nproc means data=out1 sum noprint;\n  var aux\
    \ mm_1;\n  output out=out2 sum=mm_1;\nrun;\ndata out2;\n  set out2;\n  label X2\
    \ = \"GOF Test\";\n  label PVal = \"P-Value\";\n  format X2 = au8.2 Pval pvalue.6;\n\
    \  x2 = aux / sqrt(2*mm_1);\n  x2 = x2 * x2;\n  pval = 1 - probchi(x2,1,0);\n\
    run;\\ods html;\ntitle Tarone (1979) GOF Test;\nproc print data=out2 noobs label;\n\
    \  var x2 pval;\nrun;\nhtml close;\n```\n\nThe results of this GOF are given below.\
