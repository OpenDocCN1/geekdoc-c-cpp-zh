  md: '# 4 Overdispersion Models in SAS


    toxicity experiments where chemicals are administered to litres and responses
    are measured on individuals fetches; (c) in experiments where individuals receiving
    treatments are allowed to interact with each other via support groups, as in stop-smoking
    programs or stop-drinking programs; (d) in household surveys where respondents
    within a household (or a neighborhood) may be strongly influenced by one or two
    individuals.


    There are many papers that contain examples which discuss and illustrate the overdispersion
    phenomenon and its consequences on erroneous inferences due to inflated Type I
    error rates. Some relevant examples in the areas of teratology and toxicology
    are given in Williams (1975, 1982), Williams et al. (1988), Kupper and Hashem
    (1978), Hhasem and Kupper (1979), Kupper et al. (1986), Shirley and Hickling (1981),
    Paul (1982), Park (1986), Lefkopoulou et al. (1989), Ryan (1992), Liang and McCullough
    (1993), Carr and Porter (1993), Donner et al. (1994), Morel and Koehler (1995),
    and Morel and Neerchal (1997). Important examples of overdispersion are found
    in Rosner (1984) and Donner (1989) in ophthalmmology, Altham (1977) and Cohen
    (1976) in studies of hospitalized siblings pairs, Crowter (in the analysis of
    seed germination, Heckman and Wills (1977) in connection with a panel study, Efron
    (1986) in an epidemiology example involving toxoplasmosis in 34 cities of El Salvador,
    and Moore (1987) in the modeling of chromosome aberration in survivors of the
    atomic bomb of Hiroshima.


    Early remarks regarding overdispersion under the Poisson model can be found in
    Student (1919). Examples of Poisson with overdispersion can be found (a) in the
    analysis of counts and rates of longitudinal studies, and (b) in behavioral studies
    and in studies of numbers where there is inter-subject variability. Real examples
    of overdispersion under the Poisson model are found in the analysis of number
    of tumors in rats, Gail et al. (1980) and Lawless (1987); in a longitudinal clinical
    trial to study the number of epileptic seizures, Breslow and Clayton (1993); and
    on the frequency of recurrence of bladder cancer, Dean and Banshaw (1997). An
    example with archaeological data was used by Efron (1992) to discuss the various
    patterns of overdispersion relative to Poisson variability; in another study,
    Zeger and Edelstein (1989) assess the efficacy of Vitamin C in reducing mortality
    in Indonesia.


    # 1.3 A Common Characterization of Overdispersion


    The phenomenon of binomial counts with overdispersion can be characterized in
    terms of the first two moments. Suppose that T is a Binomial variable representing
    the number of successes out of m trials. Then,


    ```

    E(T) = m\pi,

    ```


    where \pi represents the probability of success of each Bernoulli trial. Furthermore,
    if the Bernoulli trials Y_1, Y_2,...,Y_m that satisfy the assumptions of the Binomial
    model, Var(T) = m\pi(1-\pi). On the other hand, if they are positively correlated,
    the usual assumption of independence in the Binomial model is violated. Let denote
    the correlation between Bernoulli trials by \rho^2, 0 ≤\rho^2 ≤ 1. We use \rho^2
    to indicate that the correlation is nonnegative. Then, it can be shown that


    ```

    Var(T) = m\pi(1-\pi){1+\rho^2(m-1)}.

    ```'
