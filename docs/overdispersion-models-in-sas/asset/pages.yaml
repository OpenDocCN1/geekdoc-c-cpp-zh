  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses 95\n\nLet\
    \ $\\mu_i(T)$ be the i-th central moment of a random variable $T$, $\\mu_i(T)\
    \ = E\\{T-E(T)\\}^i$.\n\nRecall that the coefficients of skewness and kurtosis\
    \ are defined as $\\mu_3(T)/\\{\\mu_2(T)\\}^{3/2}$ and $\\mu_4(T)/\\{\\mu_3(T)\\\
    }^2$, respectively. Bokossa (1999) showed the coefficients of skewness and kurtosis\
    \ for the Beta-binomial, and the Random-clumped distributions\n\n```\nSkewness(Beta-binomial)\
    \ = \\frac{(1-2\\pi)[1+(2m-1)\\rho^2]}{[m\\pi(1-\\pi)[1+(m-1)\\rho^2]]^2}(1+\\\
    rho^2) (4.23)\n```\n\n```\nSkewness(Random-clumped) = \\frac{(1-2\\pi)[3+(m-1)\\\
    rho^2+m(m-2)\\rho^3]}{[m\\pi(1-\\pi)[1+(m-1)\\rho^2]]^2}(1+\\rho^2) (4.24)\n```\n\
    \n```\nKurtosis(Beta-binomial) = \\frac{1}{m\\pi(1-\\pi)[1+(m-1)\\rho^2]]^2}(1+\\\
    rho^2)\\{1+2(3-m)\\rho^2 \\\\n+3(m-2)\\pi(1-\\\\pi)\\rho^3+6m^2\\rho^4+3m(m-6)\\\
    pi(1-\\\\pi)\\rho^5 \\\\n-18m^2\\pi^2(1-\\pi)\\rho^4\\} (4.25)\n```\n\nand\n\n\
    ```\nKurtosis(Random-clumped) = \\frac{1}{m\\pi(1-\\pi)[1+(m-1)\\rho^2]]^2}\\\
    frac{1}{\\pi(1-\\\\pi)}\\{1+7(m-1)\\rho^2+6m(m-1)(m-2)\\rho^3 \\\\n-(m-1)(2m-3)\\\
    rho^4+3(m-2)+2(m-1)(m-6)\\rho^2 \\\\n-8(m-1)m(m-3)\\rho^3\\-(m-1)(m-2)(m-3)\\\
    rho^4\\} (4.26)\n```\n\nAs expected, for the boundary case $\\rho=0$, the coefficients\
    \ of skewness (4.23) and (4.24) yield $(1-2\\pi)/[m\\pi(1-\\\\pi)]^2$, which is\
    \ the coefficient of skewness of the Binomial distribution. For the other extreme\
    \ case of $\\rho=1$, where a Bernoulli zero-outcome is clamped m, the Beta-binomial\
    \ and Random-clumped Binomial distribution have $(1-2\\pi)$ as their coefficient\
    \ of skewness. For $\\pi=0.5$ the coefficients of skewness are always zero. If\r\
    ho<0.5$, the Beta-binomial is less skewed than the Random-clumped. For $0.5<\\\
    pi<1$, the skewness of the Random-clumped Binomial is less than that of the Beta-binomial.\
    \ In general, for $\\pi\\neq0.5$, the Random-clumped Binomial distribution has\
    \ longer tails, because it has, in absolute value, a greater coefficient of skewness.\
    \ Table 4.4 lists the values of the coefficients of skewness (4.23) and (4.24)\
    \ for $\\pi=0.3$, $\\rho=0.2,0.7$, and $m=20$. The coefficients of skewness for\
    \ both distributions are almost the same when $m=4$. When the cluster size m increases,\
    \ the difference between them becomes pronounced. Note that as $\\rho$ approaches\
    \ unit,\n\nMorel, Jorge, and Nagaraj Overdispersion Models in SAS*. Copyright\
    \ © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESER. For\
    \ additional resources visit support.sas.com/publishing."
