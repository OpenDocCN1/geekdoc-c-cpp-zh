  md: "# Chapter 2 Generalized Linear Models 17\n\nTo find the $\beta$ that minimizes\
    \ (2.4), one needs to find the vector of first derivatives of (2.4) with respect\
    \ to $\beta$, and equate it to zero,\n\n```\n$\\frac{\\partial S(\\beta)}{\\partial\\\
    beta} = -2X'y+2X'X\\beta = 0.$\\quad (2.5)\n```\n\nThe solution to (2.5) is the\
    \ familiar least squares estimator\n\n```\n$\\hat{\beta} = (X'X)^{-1}X'y.$\\quad\
    \ (2.6)\n```\n\nObviously, in this simplified approach the matrix $X'X$ is of\
    \ full rank.\n\nIt can be demonstrated that $\\hat{\beta}$, the least squares\
    \ estimator of $\beta$, is unbiased. Its covariance matrix is\n\n```\n$Var(\\\
    hat{\beta}) = \\sigma^2(X'X)^{-1}.$\n```\n\nThe estimator $\\hat{\beta}$ is a\
    \ Best Unbiased Estimator (BLUE) in the sense that it is an unbiased estimator\
    \ with minimum variance among all estimators that are linear functions of the\
    \ observations, that is, among estimators of the form $\\hat{\beta}=Ry$ where\
    \ $R$ is an knx matrix of real numbers. The minimum value of the sum of squared\
    \ residuals, $(y_j-\\hat{y}_j)^2$, provides a natural estimator of $\\sigma^2$.\
    \ It can be shown that the estimator\n\n```\n$\\hat{\\sigma}^2 = \\frac{\\sum_{j=1}^n(y_j-\\\
    hat{y}_j)^2}{n-k}.$\\quad (2.7)\n```\n\nis unbiased for $\\sigma^2$.\n\nThe reader\
    \ may have noticed that the OLS method does not require the $\\varepsilon_j$'s\
    \ in equation (2.1) to be normally distributed. The BLUE property holds as far\
    \ as they are correlated with $E(\\varepsilon_j) = 0$ and $Var(\\varepsilon_j)\
    \ = \\sigma^2$. The Maximum Likelihood Estimator (MLE) of $\\theta = (\\beta',\
    \ \\sigma^2)$, say $\\hat{\theta} = (\\hat{\beta}', \\hat{\\sigma}^2)$, can be\
    \ found when the $\\varepsilon_j$'s are independent and identically distributed"
