  md: '![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_206_0.png)


    We conclude this with some final remarks regarding the Hurdle models in relation
    to the other zero-inflated distributions. In the ZIP or ZINB, the focus is on
    modeling the extra zeros observed in the data relative to the underlying Poisson
    or NB models, This is achieved by mixing the underlying Poisson or NB model with
    a degenerate distribution at zero. The weight for the generator is adjusted in
    such that it picks up the "shortfall" of zeros in the ZIP or NB model. As noted
    earlier in the definition of ZIP, the weight can be negative to accommodate situations
    where there is a shortage of zeros in the data. Thus, zero-inflated models are
    naturally ample for interpreting the zeros contributed from two different sources,
    as explained in the Trematode Data example. A Hurdle model is obtained by combining
    a given probability of zero counts with either Poisson or NB truncated at zero.
    Therefore, the probability of zeros under the terminal may be either greater than
    or equal to, or less than the probability of zeros under the terminal Poisson
    of NB, as the case may be. This is depicted in the pairs of plots obtained in
    Output 6.5. The Hurdle model will accommodate a shortage of zeros as well as extra
    zeros without the hassle of negative weights. It can be shown that the ZIP or
    ZINB can be reparameterized as a Hurdle model. A Hurdle model allows with excess
    zeros


    More, Jorge, and Nagaraj Neerchel. Overdispersion Models in SAS®. Copyright ©
