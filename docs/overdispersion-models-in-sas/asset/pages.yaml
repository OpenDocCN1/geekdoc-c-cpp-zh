    The MBN has the desirable property of recovering rank when number of sampling
    units is small. If m < k, the ''meat'' of the classical sandwich estimator is
    essentially a sum of rank matrices. A small number of subjects relative to the
    rank of X can result in a loss of rank and subsequent loss of degrees of freedom
    to test hypotheses. As stated in GLIMMIX documentation, ''the additive MBN adjustment
    counts the rank exhaustion.''


    Let us now consider again the ossification discussed in Sections 4.9 and 9.5.
    We will illustrate the use of some of the sample bias corrections available in
    the GLIMMIX procedure. We first use Ferratino in GLIMMIX to the variance option
    TYPE=VC; working matrix, which corresponds in GLIMMIX to Then, we compute the
    empirical variance estimator under options FIRORES, FIROEQ and MBN. The programming
    statements are provided in "Program 9.2: Continuation."


    # Program 9.2: Continuation


    ```

    ods html;

    title *** Ossification Data -- GEE using GLIMMIX with EMPIRICAL-CLASS ***

    proc glimmix data=ossification_b_empirical=classical;

    class litters pht;

    model y(ref=''0'') = tcpo pht tcpo*pha / dist=binary link=logit s;

    random_residual / subject=litters type=vc;

    run;

    ```


    ```

    ntitle *** Ossification Data -- GEE using GLIMMIX with EMPIRICAL-FIRORES ***

    proc glimmix data=ossification_b_empirical=firores;

    class litters pht;

    model y(ref=''0'') = tcpo pht tcpo*pha / dist=binary link=logit s;

    random_residual / subject=litters type=vc;

    run;

