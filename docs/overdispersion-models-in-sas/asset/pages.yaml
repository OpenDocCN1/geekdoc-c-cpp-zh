- pgno: 327
  md: "# Chapter 9 Generalized Estimating Equations Techniques for Marginal Models\
    \ 315\n\nHowever, the rate ratio results cannot be obtained using the options\
    \ dist=binomial and link=log, since the offset variables produce mean parameters\
    \ that are either invalid or at a limit of its for some observations. Incidentally,\
    \ the methodology described in this section is also applicable to repeated measures\
    \ in the Proagide example discussed in Section 9.6. The interpretation of the\
    \ regression parameters of model (9.9) is as follows:\n\n| Treatment | Visit |\
    \ Expected Number of Seizures per Week |\n| --- | --- | --- |\n| Placebo | Baseline\
    \ | exp(β₁) |\n| | Treatment Phase | exp(β₀ + β₁) |\n| Proagide | Baseline | exp(β₀\
    \ + β₂) |\n| | Treatment Phase | exp(β₀ + β₂ + β₃) |\n\nThe ratio of the baseline\
    \ rates to Proagide is exp(-β₂), and the ratio of the treatment phase rates Placebo\
    \ to Proagide is Note that β₁ is the effect of randomization. Furthermore, the\
    \ Placebo rate Treatment Phase to Baseline is R₁ = exp(β₁), which captures the\
    \ Placebo effect, and the Proagide rate Treatment Phase to Baseline is R₂ = exp(β₂\
    \ + β₃). \nFinally, R₃ = exp(-β₁) represents the ratio of R₁ to R₂. This ratio\
    \ R₃, can be viewed as the ratio of the treatment rates Placebo to Proagide after\
    \ normalizing each rate by its associated baseline. The rates, their logarithms,\
    \ and their standard errors can be estimated from the GLIMMIX procedure by using\
    \ the methodology explained in the previous example. The programming statements\
    \ are shown in the continuation of Program 9.3.\n\n# Program 9.3: Continuation\n\
    \n```\nods html;\n*** Rates Proagide Trial ***\nproc glimmix data=seizures;\n\
    class id;\nmodel cnt = xl trt xl1*trt dist=poison offset=time\ndffm=none covb\
    \ s;\nrandom_residual / subject=type vcorr;\nestimate 'Rate Placebo Baseline'\
    \ int 1 / ilink;\nestimate 'Rate Placebo Treatment Phase' int 1 / ilink;\nestimate\
    \ 'Rate Proagide Baseline' int 1 / ilink;\nestimate 'Placebo TRT Phase' trt-1\
    \ 1 xl1*trt 1 / ilink;\nestimate 'Placebo Proagide Baseline' trt-1 1 xl1*trt -1\
    \ / ilink;\nestimate '(R1) Baseline TRT Phase / Placebo Baseline' xl1 1 / ilink;\n\
    estimate '(R2) Proagide TRT Phase / Proagide Baseline' xl1 1*trt 1 / ilink;\n\
    estimate '(R3) = (R1) / (R2) xl1*trt -1 / ilink;\nrun;\\ods html close;\n```\n\
    \nThe estimates of interest are shown in the continuation of Output 9.3.\n\nMore,\
    \ Jorge, and Nagaraj. Overdispersion Models in SAS®. Copyright ©2011, SAS Institute\
    \ Inc., Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/publishing."
