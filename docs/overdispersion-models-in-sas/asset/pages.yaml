  md: "If the $y_i$'s are zero-one responses (Bernoulli outcomes) and the $z_i$'s\
    \ are all identical to one, the estimator in equation (9.14) reduces to the logarithm\
    \ of a proportion (or logarithm of a risk), that is,\n\n```\n$$\\hat{\beta}_i\
    \ = \\ln(\\hat{P}_i), \\quad (9.17)$\n```\n\nwhere $\\hat{P}_i = \\frac{\\sum_{j=1}^{n_i}\
    \ y_{ij}}{n_i}$, by equation (9.15), the estimated variance of (9.17) is\n\n```\n\
    $\\hat{Var}(\\hat{\beta}_i) = \\frac{\\sum_{j=1}^{n_i} (y_{ij}-\\hat{P}_i)^2}{n_i\\\
    hat{P}_i^2} + \\frac{(1-\\\\hat{P}_i)}{n_i\\hat{P}_i}, \\quad i=1, 2, \\dots,\
    \ k. \\quad (9.18)$\n```\n\nThen, the estimated logarithm of the relative risk\
    \ based on two independent groups\n\n```\n$$\\hat{\beta}_i - \\hat{\beta}_j =\
    \ \\ln\\left(\\frac{\\hat{P}_i}{\\hat{P}_j}\\right), \\quad (9.19)$\n```\n\nThe\
    \ estimated variance of (9.19) reduces to the familiar expression\n\n```\n$$\\\
    hat{Var}(\\hat{\beta}_i - \\hat{\beta}_j) = Var(\\ln(\\frac{\\hat{P}_i}{\\hat{P}_j}))\
    \ = \\frac{(1-\\hat{P}_i)}{n_i\\hat{P}_i} + \\frac{(1-\\hat{P}_j)}{n_j\\hat{P}_j}.\
    \ \\quad (9.20)$\n```\n\nThe case of a rate ratio, where the $y_{ij}$ are zero-one\
    \ responses representing the presence or absence of a certain disease (or adverse\
    \ event) and the $z_i$ are the time to the event, is derived easily from equations\
    \ (9.14) and (9.15). To illustrate the estimation of Relative Risk and Risk Ratio,\
    \ consider the following illustrative example from Morel and Neerchal (2008).\
    \ Table 9.4 shows a hypothetical dataset from a clinical trial with two treatment\
    \ groups coded as \"1\" for Active and \"2\" for Placebo, where the rate ratio\
    \ is four. Subjects were randomized to each treatment group. Subjects were followed\
    \ for 52 weeks, and the occurrence of a Adverse Event (AE) and the dropout at\
    \ risk in weeks to the AE were recorded. Note that subjects 1, 2, 3, 11 and 12\
    \ dropouts and the occurrence of the AE was recorded as zero. On the other hand,\
    \ subjects 4 and 13 through 17 completed the study without experiencing the AE\
    \ under consideration. Their time to AE is censored and was recorded as simply\
    \ as 52 weeks. The remaining subjects experienced the AE under consideration at\
    \ some time during the study.\n\nMorel, Jorge, and Nagaraj Neerchal. Overdispersion\
    \ Models in SAS®. Copyright ©2011, SAS Institute Inc., Cary, North Carolina, USA:\
    \ ALL RIGHTS RESERVED. For additional SAS results, visit support.sas.com/publishing."
