  md: '# Chapter 2 Generalized Linear Models 43


    To illustrate the use of logistic regression in case-control studies we consider
    the Ille-et-Vaine study of oesophacheal cancer. Ille-et-Vaine is a French department
    created from part of the province of Brittany during the French Revolution. Mortality
    from cancer concerning the oesophagus was known to be high in Brittany and Normandy.
    Tuyns et al. (1977) collected data in the department of Ille-et-Vaine where 200
    males (cases) were diagnosed with oesophacheal cancer. A sample of 778 subjects
    (free of cancer) was drawn from electoral lists in each commune. Of those, 775
    subjects provided sufficient information for analysis purposes. Breslow and Day
    (1980) used this example to illustrate different statistical methodologies for
    cancer research. We refer to the readers to Chapters 4 and 5 of their book. The
    data of the Ille-et-Vaine case-control study are shown in Table 2.6.


