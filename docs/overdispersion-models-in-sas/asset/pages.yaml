  md: "# Program 4.2: Goodness-of-fit Tests—Chromosome Data\n\n| title |\n|------------------------------------------------------------|\n\
    | This Macro performs a Pearson's GOF Test |\n| Skellam's (1948) Chromosome Data\
    \ Example |\n| data = data set containing the variables Obs and Pred |\n| df =\
    \ degree of freedom |\n| title = Distribution being fit |\n\n```\n%macro gof(data,df,title);\n\
    proc imml;\n  use &data;\n  read all(freq) into Observed;\n  read all(Pred) into\
    \ Predicted;\n\n  gof = sum(Observed # Predicted) - &n;\n  pvalue = 1 - probchi(gof,df,0);\n\
    \n  Summary = j(3,1,0);\n  Summary[1,1] = gof;\n  Summary[2,1] = &df;\n  Summary[3,1]\
    \ = pvalue;\n\n  label = { 'Pearson's GOF Test',\n  'Degrees of Freedom',\n  't-value'};\n\
    \  print &title;\n  print Observed Predicted[format=10.4];\n  print Summary[label=rowname\
    \ format=10.4];\nquit;\n%mend gof;\n\nods html;\n%gof(pred1,1,'Binomial Distribution');\n\
    %gof(pred2,1,'Beta-binomial Distribution');\n%gof(pred3,1,'Random-connected Binomial\
    \ Distribution');\n%gof(pred4,1,'Zero-correlated Binomial Distribution');\n%gof(pred5,1,'Generalized-Binomial\
    \ Distribution -- Additive Interaction');\nods html close;\n```\n\nOutput 4.2\
    \ shows the GOF results only for the Beta-binomial distribution."
