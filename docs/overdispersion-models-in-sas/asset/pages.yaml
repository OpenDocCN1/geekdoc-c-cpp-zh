    of the beta parameters and the variance component using a GLMM model where subjects
    are treated as random. This is obtained using the GLIMMIX procedure. The Random-clumped
    GLOMM is then fit via the NLMIXED procedure with initial values defined by a grid
    based on the GLMM beta estimates. Selected results from Program 1.5 are shown
    in Output 10.5.'
