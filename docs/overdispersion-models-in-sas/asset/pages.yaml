    | z*z*z | 1 | 30 | 5.79 | 0.0225 |\n\nWe now turn to the Pseudo-likelihood (PL)\
    \ method available in the GLIMMIX procedure. The PL method linearizes the model,\
    \ and the scale parameter ϕ turns into a residual scale parameter in a weighted\
