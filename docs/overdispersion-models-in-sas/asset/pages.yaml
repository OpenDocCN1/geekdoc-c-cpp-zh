    n = 8000;\npl = 0.4;\nmu = 10;\nseed = 1979;\n--= Underlying True Mean and Variance;\n\
    p2 = exp(-mu);\nplc = 1 - pl;\np2c = 1 - p2;\nPhi = plc / p2c;\nMean = Phi*mu;\n\
    Var = Phi*mu*(mu+1)- Mean*Mean;\ndo j=1 to n;\nu = uniform(seed);\nif u <= pl\
    \ then do;\ny = 0;\n\toutput;\nend;\nelelse do;\n--= Crossing the hurdle;\n--\
    \ Get Truncated Poisson using Rejection Method;\ndountil (y<0)\ny = ranpoi(seed,mu);\n\
    \toutput;\nend;\nend;\nrun;\ntitle2 \"Underlying True Mean and Variance\";\nproc\
    \ print data=Poisson_Hurdle_Data noobs;\nwhere j=1;\nvar Mean Var;\nformat _all_\
    \ 8.4;\nrun;\ntitle2 \"Estimated Mean and Variance\";\nproc means data=Poisson_Hurdle_Data\
    \ n mean var maxdec=4;\nvar y;\nrun;\ntitle2 \"Negative-binomial Hurdle Model\
    \ with Pi_1=0.4, Mu=10 and\";\ndata NB_Hurdle_Data;\nn = 8000;\n```\n\nMorel,\
