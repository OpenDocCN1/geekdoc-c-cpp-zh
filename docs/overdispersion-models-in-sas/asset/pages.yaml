  md: '# Overdispersion Models in SAS


    Monte Carlo Error {SE(ρ)} = Maximum 5,000 Replications of $\frac{SE(ρ)}{SE(ρρ)}$
    (8.9)


    Here, SE() denotes the estimated standard error from either the approximate or
    the exact method, as appropriate. Algorithms for data generation under the DM
    and RCM models are given in Appendix 7.1, Chapter 7. The results of this Monte
    Carlo study are very good, as demonstrated in Tables 8.2 through 8.5. Tables 8.2
    and 8.3 display the results for the estimates of the parameters of the models,
    and Tables 8.4 and 8.5 show the results for the estimates of the estimated standard
    errors. In all cases we have tried, the estimates obtained by this Two-stage procedure
    are indistinguishable from the exact maximum likelihood estimates. The relative
    errors in the corresponding standard error estimates are of the order $10^{-5}$.
    For all practical purposes the Two-stage procedure, which involves the computation
    of the FIM matrix only once (if a final update is called), gives nearly the same
    results as using the FIM in each iteration. The approximation results for the
    FIMs of the overdispersion models make a very interesting comparative study. While
    time-saving may not be a motivation for them to use it in a one-time analysis
    of a single data set, it is entirely worthwhile to consider their use in a simulation
    setup, or even in parametric bootstrapping for obtaining p-values, the FIM needs
    to be evaluated thousands of times. This is just one example of simulation studies
    we have performed and feel well confident about our recommendation.


