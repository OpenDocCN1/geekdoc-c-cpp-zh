- pgno: 116
  md: "# 104 Overdispersion Models in SAS\n\nLet $\\pi_{tp}$, represent the unconditional\
    \ probability of omission on the left middle third phalanx of any fetus in the\
    \ (t,p)-treatment group of the 2x2 factorial experiment, where\n\n```\nt=\begin{cases}\
    \ 0 & \\text{if TCPO is absent} \\ 1 & \\text{if TCPO is present} \\end{cases}\
    \ \\text{ and } p = \\begin{cases} 0 & \\text{if PHT is absent} \\ 1 & \\text{if\
    \ PHT is present} \\end{cases}\n```\n\nFor the j-litter on the (t\n\n```\n$T_{tp}\
    \ \\sim \\text{Binomial}(\\pi_{tp},m_{tp})\\nT_{tp} \\sim \\text{Beta-binomial}(\\\
    pi_{tp},\\rho_{{tp},m_{tp})\\nT_{tp} \\sim \\text{Random-clumped}(\\pi_{tp},\\\
    rho_{tp},m_{tp}) \\quad (4.33)\n```\n\nThe case where the $T_{tp}$ are believed\
    \ to be binomially distributed ignores completely the litter effect and assumes\
    \ litters are inside. To explain possible differences in $\\pi_{tp}$ among the\
    \ treatment groups, we will consider the following logit\n\n```\n$\\ln\\left(\\\
    frac{\\pi_{tp}}{1-\\pi_{tp}}\\right) = \\beta_0+\\beta_1I(t=1)+\\beta_2I(p=1)+\\\
    beta_3I(t=1,p=1), \\quad (4.34)\n```\n\nwhere $I(.)$ represents an indicator function.\
    \ The link function in (4.34) provides estimates of the teratogenic effects of\
    \ the substances being used in the experiment and possibly its synergistic effect.\
    \ It is common with teratological data to have varying degrees of intra-litter\
    \ correlation. This problem has been properly addressed by Kupper et al. (1986)\
    \ and Williams (1988). To account for possible different intra-litter effects,\
    \ we will consider the following logit links\n\n```\n$\\ln\\left(\\frac{\\rho_{tp}}{1-\\\
    rho_{tp}}\\right) = \\alpha_0\\nTln\\left(\\frac{\\rho_{tp}}{1-\\rho_{tp}}\\right)\
    \ = \\alpha_0+\\alpha_1I(t=1)+\\alpha_2I(p=1)+\\alpha_3I(t=1,p=1) \\quad (4.35)\n\
    ```\n\nMore, Jorge, and Nagaraj Neerchal. Overdispersion Models in SAS®. Copyright\
    \ 2011, SAS Inc., Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses 105\n\n\
    The first link function in (4.35) assumes a common intra-litter correlation, i.e.,\\\
    n$\\rho_\\equiv(\\rho)=\\exp(\\alpha_\rho)/\\{1+\\exp(\\alpha_\rho)\\}$. The other\
    \ link function expresses the logs of the p's as\\nof the main effects and its\
    \ interaction (full model). Note that the overdispersed models\\ndefined in (4.33),\
    \ (4.34) and (4.35) fall all into the category of the Generalized\\nOverdispersion\
    \ Models previously defined in (4.31) and (4.32). We will now consider maximum\\\
    nlelihood estimation under the three distributions in (4.31) and (4.32) with three\
    \ functions\n\n```\n$$\\ln\\left(\\frac{\\pi_{ip}}{1-\\pi_{ip}}\\right)=\\beta_0+\\\
    beta,1(t=1)+\\beta,1(p=1)-\\beta,1(t=1,p=1)\\n$\\ln\\left(\\frac{\\rho_{ip}}{1-\\\
    rho_{ip}}\\right)=\\alpha_0$(4.36)\n```\n\n4.4 contains the programming statements\
    \ for fitting model (4.36) under the three\\ndistributions in (4.33) using the\
    \ NLMIXED procedure.\n\n# 4.4: Fitting of Three Models to the Ossification Data\
    \ Using NLMIXED\n\n```\n/*\\nOssification Example from Morel and Neerchal (1997),\\\
    nStatistics in Medicine, 16, 2843-2853\\n*/\\ndata ossification;\\nlength tx @@;\\\
    ninput tx @@ n @@;\\ndo i=1 to n;\\ninput t m @@;\\nm = m - t;\\noutput;\\nend;\\\
    ndrop n;\\nControl 8 8 10 9 9 7 0 0 5 3 3 5 9 10 5 8 5 1 6 0 5\\nControl 16 7\
    \ 8 9 7 10 10 6 6 1 9 8 6 7 5 5 7 9\\n5 2 5 6 2 8 1 0 2 8 7 7 5\\nPHT 1 9 9 1\
    \ 4 3 7 4 0 7 0 4 8 1 7 2 2 8 1 7\\n0 2 3 10 3 7 2 7 0 8 0 1 0 1 1\\nTCPO 16 0\
    \ 5 7 1 4 11 10 6 9 3 4 2 6 0 8 0 9\\n5 6 2 9 7 3 1 0 8 8 6 9\\nPHT+TCPO 11 2\
    \ 2 0 1 8 7 1 0 0 4 0 6 0 7 6 6 6 1 6 7\n```\n\n```\nods html;ntitle \"Binomial\
    \ Distribution, Full Model on the Betas\",\\nproc mixed ossification;\\nparms\
    \ b0=0, b1=0, b2=0;\\nif (tx=`Control')\\nthen linp = b0;\\nelse if (tx=`TCPO')\\\
    nthen linp = b0+b1;\\nelse if (tx=`PHT')\\nthen linp = b0+b2;\\nelse if (tx=`PHT+TCPO')\\\
    nthen linp = b0+b1+b2+b3;\\npi = 1/(1+exp(-linp));\\nmodel t = -\n```\n\nMorel,\
    \ Jorge, and Nagaraj Neerchal. Overdispersion Models in SAS. Copyright © 2017,\
    \ SAS Institute Inc., Cary,\nNorth Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ resources, visit support.sas.com/support."
  merge: -1
  img_proc: true
- pgno: 118
  md: "# 106 Overdispersion Models in SAS\n\n```\nestimate 'Pi Control' 1/(1+exp(-b0));\n\
    estimate 'Pi TCPO' 1/(1+exp(-b1));\nestimate 'Pi PHT' 1/(1+exp(-b2));\nestimate\
    \ 'Pi PHT+TCPO' 1/(1+exp(-b0-b1-b2));\nestimate 'Logarithm Odds-Ratio PHT When\
    \ TCPO Absent ' b2;\n  estimate 'Logarithm Odds-Ratio PHT When TCPO Present '\
    \ b2+b3;\n```\n\nrun;\n\n```\ntitle \"Beta-binomial Distribution, Full Model on\
    \ the Betas, Common Rho\";\nproc nmlimed data=assignment;\n  params b0=0, b1=0,\
    \ b2=0, b3=0, a0=0;\n  lin = 1/(1+exp(-lr));\n  rho = 1/(1/lr - 1);\n  c = if\
    \ ('Control') then lr = b0;\n      else if ('TCPO') then lr = b0+b1;\n      else\
    \ if ('PHT') then lr = b0+b2;\n      else if ('PHT+TCPO') then lr = b0+b1+b2+b3;\n\
    \  pi = 1/(1+exp(-ln));\n  pi = 1 - pi;\n  z = lgamma(m-1) + lgamma(t+1) - lgamma(m+t);\n\
    \  z = lgamma(c) + lgamma(t+c*pi) + lgamma(m+c*pi) - lgamma(c*pi);\n  model =\
    \ general(1);\n  estimate 'Pi Control' 1/(1+exp(-b0));\n  estimate 'Pi TCPO' 1/(1+exp(-b1));\n\
    \  estimate 'Pi PHT' 1/(1+exp(-b2));\n  estimate 'Pi PHT+TCPO' 1/(1+exp(-b0-b1-b2));\n\
    \  estimate 'Logarithm Odds-Ratio PHT When TCPO Absent ' b2;\n  estimate 'Logarithm\
    \ Odds-Ratio PHT When TCPO Present ' b2+b3;\n  estimate 'Common Rho*Rho' 1/(1+exp(-a0))/(1+exp(-a0));\n\
    ```\n\nrun;\n\n```\ntitle \"Rho-Clumped Binomial Distribution, Full Model on the\
    \ Betas, Common Rho\";\nproc nmlimed data=assignment;\n  params b0=0, b1=0, b2=0,\
    \ b3=0, a0=0;\n  wh = 1/(1+exp(-lr));\n  rho = 1/(1/lr - 1);\n  if ('Control')\
    \ then lr = b0;\n      else if ('TCPO') then lr = b0+b1;\n      else if ('PHT')\
    \ then lr = b0+b2;\n      else if ('PHT+TCPO') then lr = b0+b1+b2+b3;\n  pi =\
    \ 1/(1+exp(-ln));\n  pi = 1 - pi * rho;\n  pi = 1 - rho;\n  z = lgamma(m-1) +\
    \ lgamma(t+1) - lgamma(m+t);\n  z = lgamma(pi) + lgamma(t+c*pi) + pi*p2*t+p2c*m_t;\n\
    \  model = general(1);\n  estimate 'Pi Control' 1/(1+exp(-b0));\n  estimate 'Pi\
    \ TCPO' 1/(1+exp(-b1));\n  estimate 'Pi PHT' 1/(1+exp(-b2));\n  estimate 'Pi PHT+TCPO'\
    \ 1/(1+exp(-b0-b1-b2));\n  estimate 'Logarithm Odds-Ratio PHT When TCPO Absent\
    \ ' b2;\n  estimate 'Logarithm Odds-Ratio PHT When TCPO Present ' b2+b3;\n  estimate\
    \ 'Common Rho*Rho' 1/(1+exp(-a0))/(1+exp(-a0));\n```\n\nrun;\n\n```\nods html;\n\
    ```\n\n> Morel, Jorge and Nagaraj Neeraj. Overdispersion Models in SAS®. Copyright\
    \ 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional resources, visit support.sas.com/publishing."
  merge: -1
