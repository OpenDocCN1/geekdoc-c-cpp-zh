- pgno: 387
  md: '# End of Journey


    We end this journey by recalling McCullagh and Nelder''s comment “. . overdispersion
    [phenomenon] is the norm in practice and nominal dispersion the exception. The
    ubiquity of overdispersion in practice demands that every practising statistician
    be very familiar with it and be equipped with tools to model this significant
    departure from the assumption of independence. The variety of models available
    to explain overdispersion, its close connection to mixed models, and its numerous
    theoretically and computationally intriguing aspects make overdispersion a very
    fertile area of research. In the preface, we promised to bring a “sampler platter”
    of overdispersion topics to the reader. We hope we fulfilled our promise. For
    any comments, suggestions, recommendations, or criticisms, please feel free to
    contact either author of this book. The first author, Jorge G. Morel, can be reached
    at statistics@gmail.com, and the second author, Nagaraj K. Neerajal, can be reached
    at inference@gmail.com. Thanks for your support.


