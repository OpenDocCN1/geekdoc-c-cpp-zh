    | (m_j) | 5 | 5 | 7 | 8 | 8 | 9 | 9 | 10 | 10 |


    The programs for computing a GOF test (5.2) are given in Program 5.1. Under the
    Binomial model several SAS procedures can provide the MLE of $\pi$, which turns
    out to be the ratio estimator $\hat{\pi} = \sum_{j=1}^{n} \frac{t_j}{m_j}$. For
    this example, we make use of the SURVEYMEANS procedure to compute $\hat{\pi}$.
    The reader should aware that the standard error provided by SURVEYMEANS this estimator
    $\hat{\pi}$, is unbiased regardless of the distributional assumptions of $t_j$.
    Under the overdispersion assumption, as seen in equation (4.5), the estimate of
    the variance provided by SURVEYMEANS is consistent.


    # Program 5.1: Computation of Tarone (1979) GOF Test Statistic (5.2)


    ```

    * Tarone (1979) Two-sided GOF test

    H0:Binomial Distribution Variance

    HI:Generalized Binomial Distribution with Additive Interaction (Altham, 1978)

    Altham''s model was simultaneously proposed by Kupper and Haseman (1978)

    and termed "Correlated Binomial Model"

    Data below were taken from Kupper and Haseman (1978, page 75)

    /*

