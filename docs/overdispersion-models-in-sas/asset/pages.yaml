    Binomial distributions.


    An important aspect of these models is the clear connections with GLMs. The likelihood
    models discussed in this chapter allow for link functions (logit, probit, etc)
    in the probability of success and the overdispersion parameter. In principle,
    two linear predictors are possible: the customary one with the mean of the model,
    and the one associated with the overdispersion parameter. We will first convert
    the main concepts by using simple examples to show the functions. The estimation
    methods employed here are highly similar to those used in GLMs. The maximum likelihood
    equations of these models are highly non-linear in the parameters; therefore,
    we will have to rely on iterative methods for computing the MLEs. Although the
    simplifications discussed in equations (2.23) and (2.24) of Chapter 2 for distributions
    in the exponential family with canonical links is not known to hold for the overdispersed
    models discussed in this chapter, both estimation methods, the Newton-Raphson
    and Fisher Scoring methods, can be implemented for the MLE of the parameters of
    the model.


    # 4.2 The Beta-binomial distribution


    Modeling overdispersion with binomial responses can be approached hierarchically
    by setting a prior on the probability of success of the Binomial, and then examining
    the variability in the count marginally. Let T represent the total of successes
    in a cluster of size m. It is assumed that T |P ~ Binomial(P,m). The probability
    of success P, 0 < P < 1, be distributed according to an arbitrary distribution
    with density f (P) (or probability function if the distribution of P is discrete)
    in the (0,1) interval such that


    > E_f(P) = π (4.1)


    and


    > V_f(P) = σ² (4.2)


    Since P² < P for any P between zero and one, it follows that E_f(P²) < E_f(P).
    Then σ² + π² < π, which implies σ² < π(1-π). Thus, there exists a real number
    ρ², 0 < ρ² < 1 such that σ² = ρ²π(1-π). Then, (4.2) can be written as


    > V_f(P) = ρ²π(1-π). (4.3)


    Using standard based on conditional expectations, E(T) = E_f{E(T|P)} and Var(T)
    = E_f{V(T|P)} + V_f{E(T|P)}, we can show that the unconditional mean and variance
    of T are


    > E(T) = mπ (4.4)'
