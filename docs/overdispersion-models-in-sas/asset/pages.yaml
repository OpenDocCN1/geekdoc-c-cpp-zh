- pgno: 274
  md: "# 262 Overdispersion Models in SAS\n\nthe approximate information matrix provides\
    \ adequate accuracy for the standard errors, greater can be gained through taking\
    \ an additional step.\n\nTwo examples, previously discussed in Chapter 7, namely,\
    \ the Forest Poll Count and the Housing Satisfaction examples, will be revisited.\
    \ The former example is ideal for illustrating the Two-stage procedure cluster\
    \ sizes are fairly large, i.e., m=100. In the latter, the cluster sizes are relatively\
    \ small, i.e., m=5. We will show that under these circumstances, the Two-stage\
    \ procedure produces estimates almost identical to those obtained under the standard\
    \ Fisher scoring method. We conclude this chapter by reporting the results on\
    \ a simulation designed to analyze the performance of the Two-stage procedure.\n\
    \n# 8.2 A Two-stage Estimation Procedure\n\nThe main computational burden in obtaining\
    \ the MLE is due to the need to compute FIM at every iteration. Our approximation\
    \ to FIM, stated later in this chapter, addresses this issue and provides excellent\
    \ accuracy. The idea of a Two-stage procedure is to use this approximation to\
    \ the FIM in the Fisher scoring algorithm until convergence is achieved, and then\
    \ perform an extra iteration with the exact FIM. The additional iteration with\
    \ the exact FIM leads to better accuracy for the estimated errors. Throughout\
    \ this section we will refer to the equations of Chapter 7 frequently. We will\
    \ refer the reader specifically to section 7.3 to review the notations. As discussed\
    \ in the previous chapter (see 7.3), the MLE of $\\theta$, say $\\hat{\theta}\
    \ =(\\hat{\\pi}_1, \\hat{\\pi}_2, \\dots, \\hat{\\pi}_k, \\hat{\nho})$, can be\
    \ found iteratively by the Fisher scoring method. This algorithm can be as\n\n\
    ```\n$$\\hat{\theta}_{(s+1)} = \\hat{\theta}_{(s)} + \\left\\{ n \\mathbf{I}(\\\
    hat{\theta}_{(s)}) \\right\\}^{-1} \\frac{\\partial L(\\\\hat{\theta}_{(s)})}{\\\
    partial \\hat{\theta}_{(s)}}$\n```\n\n$$\\hat{\theta}_{(s)}$ and $\\hat{\theta}_{(s+1)}$\
    \ denote the s-th and the (s+1)-th iterates respectively, and $I(\\\\hat{\theta}_{(s)})$\
    \ is the FIM for a single observation evaluated at the s-th iteration. The initial\
    \ values for starting the iteration can be obtained by applying the method of\
    \ methods.\n\nRecall, once that the FIM is defined as\n\n```\n$$\\mathbf{I}(\\\
    mathbf{t}) = E \\frac{\\partial^2 \\log P(\\mathbf{t})}{\\partial \\mathbf{t}\
    \ \\partial \\mathbf{t}'} = \\sum_{\\mathbf{t}} \\frac{\\partial^2 \\log P(\\\
    mathbf{t})}{\\partial \\mathbf{t} \\partial \\mathbf{t}'} \\mathbf{P}(\\mathbf{t})$.\n\
    ```\n\nThe FIM given in Equation (8.2) is a summation over the multinomial sample\
    \ space, denoted by $\\Omega$, of all possible values of the vector $\\mathbf{t}$.\
    \ As the cluster size m and the number of categories $(d+1)$ increase, the multinomial\
    \ sample space $\\Omega$ becomes larger rapidly, and hence the computation of\
    \ (8.2) can be very slow. We will now state that the approximations to the Fisher\
    \ information matrices of the overdispersed distributions DM and RM. This approximation\
    \ to the FIM leads to essentially no loss of accuracy in the maximum likelihood\
    \ estimates when the Fisher scoring method (8.1) is implemented. This suggests\
    \ a Two-stage estimation procedure\n\nMorel, J. and Nagaraj Neecharel. Overdispersion\
    \ Models in SAS®. Copyright ©2011, SAS Institute Inc., Cary, North Carolina, USA.\
    \ ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
