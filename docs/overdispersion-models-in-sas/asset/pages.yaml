- pgno: 305
  md: "# Chapter 9 Generalized Estimating Equations Techniques for Marginal Models\
    \ 293\n\nIt is important that the GENMOD procedure does not handle random effects\
    \ of any type. Terms as G-side or R-side are not present in the theoretical discussion\
    \ of the GENMOD procedure (\"Details: GENMOD Procedure\" of the SAS Documentation).\
    \ Readers may recall that the GENMOD procedure is essentially devoted to regression\
    \ in the exponential family. It can also accommodate the Zero-inflated Poisson\
    \ and the Zero-inflated Negative-binomial models, neither of which is a member\
    \ of the exponential family. In GENMOD, repeated measurements can be analyzed\
    \ in conjunction with the GEE methodology following the original guidelines in\
    \ Liang and Zeger (1986), and Zeger and Liang (1986). The distinction, as we will\
    \ see later, between GENMOD and GLIMMIX is more evident in the two procedures\
    \ practically implement using the GEE methodology. The procedure relies on Quasi-likelihood\
    \ and moment estimation, where the latter relies upon the Pseudo Likelihood estimation\
    \ based on linearization. However from some minor variations, both procedures\
    \ basically incurred in the computation of the \"sandwich\" estimator.\n\nThe\
    \ GEE methodology is a two-step estimation process. To begin, with a type of Quasi-likelihood\
    \ model is stated when one assumes correlation or variance structure on the repeated\
    \ measurements. The parameters of this initial model (working model) are estimated.\
    \ Once the working model is fit, the \"robust,\" \"empirical,\" or \"sandwich\"\
    \ variance-covariance matrix is then estimated. To understand how the \"sandwich\"\
    \ variance arises, consider for a moment the set-up of Generalized Linear Models\
    \ discussed in Chapter 2. We know the beta estimates are estimated iteratively\
    \ around $\beta$ in equation (2.22), that is,\n\n```\n$$\\hat{\beta}_{(s+1)} =\
    \ \\hat{\beta}_{(s)} + (\\mathbf{D}^{\\top}\\mathbf{D})^{-1}\\mathbf{D}^{\\top}\\\
    mathbf{V}^{-1}(\\mathbf{y}-\\boldsymbol{\\mu})$\n```\n\nThen, the Taylor expansion\
    \ of $\\hat{\beta}$ around $\\beta$ yields\n\n```\n$$\\hat{\beta}-\\beta \\triangleq\
    \ (\\mathbf{D}^{\\top}\\mathbf{D})^{-1}\\mathbf{D}^{\\top}\\mathbf{V}^{-1}(\\\
    mathbf{y}-\\boldsymbol{\\mu})$\n```\n\nThe variance-covariance matrix of $\\hat{\b\
    eta}$ from the Taylor's expansion, would be\n\n```\n$Var(\\hat{\beta}-\\beta)\
    \ \\triangleq Var(\\hat{\beta}) \\triangleq (\\mathbf{D}^{\\top}\\mathbf{D})^{-1}\\\
    mathbf{D}^{\\top}\\mathbf{V}^{-1}(\\mathbf{y}-\\boldsymbol{\\mu})(\\mathbf{y}-\\\
    boldsymbol{\\mu})^{\\top}\\mathbf{V}^{-1}\\mathbf{D}(\\mathbf{D}^{\\top}\\mathbf{D})^{-1}$.\n\
    ```\n\nIf we define $\\mathbf{D}^{\\top}\\mathbf{D}$ by $\\mathbf{H}$, and $\\\
    mathbf{D}^{\\top}\\mathbf{V}^{-1}(\\mathbf{y}-\\boldsymbol{\\mu})^{\\top}\\mathbf{V}^{-1}\\\
    mathbf{D}$ by $\\mathbf{G}$, the above variance-covariance matrix can be written\
    \ as\n\n```\n$Var(\\hat{\beta}) \\triangleq \\mathbf{H}^{-1}\\mathbf{G}\\mathbf{H}^{-1}$.\n\
    ```"
