    | Description | TYPE=covariance-structure | Structure | Example |

    | --- | --- | --- | --- |

    | | CHOL | Specifies an unstructured variance-covariance matrix parameterized
    through its Cholesky root. This parameterization ensures the resulting variance-covariance
    matrix is at least positive semidefinite. If diagonal values are nonzero, it is
    positive definite. The GLIMMIX procedure constrains the diagonal elements of the
    Cholesky root to be positive. This guarantees a unique solution when the matrix
    is positive definite. In general, the Cholesky root parameterization is recommended
    over a completely unstructured covariance matrix (TYPE=UN). If A is a positive
    definite matrix, its Cholesky root is a lower triangular matrix C such that CCᵀ=A.
    The option CHOL(q) determines how many bands below the diagonal are modeled. Elements
    in the lower triangular portion of C in bands higher than "q" are set to zero.
    If you consider the resulting covariance matrix A=CC'', then the order parameter
    has the effect of zeroing all off-diagonal elements that are at least "q" positions
    away from the diagonal. Bear in mind, the Cholesky decomposition is computationally
    slightly more involved. | | |


    # 9.5 An Example with Binomial/Binary responses


    In this section, we will illustrate the use of GEE for responses are either Binomial
    or Binary (Bernoulli) outcomes, using the Teratology example about ossification
    of the phalanges discussed in Section 4.9. Recall that the purpose of the experiment
    was to investigate the synergistic effect of phenytoin (PHT) and trichlorophene
    (TCPO), and that the presence or absence of ossification at the phalanges was
    considered as a 2×2 factorial, with PHT and TCPO as'
