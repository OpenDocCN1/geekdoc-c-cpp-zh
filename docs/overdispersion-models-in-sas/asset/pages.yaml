- pgno: 82
  md: "# Overdispersion Models in SAS\n\nmodels for overdispersion. When appropriate,\
    \ we will denote the intra-cluster correlation by $\rho^2$ to indicate overdispersion.\n\
    \nWilliams modified the iterative least-squares procedure in equation (2.23) of\
    \ Chapter 2 to allow the weights (inflation factors) $w_j^{-1} = [1 + (m_j - 1)\t\
    heta]$ to be used in conjunction with the variance function $v_j = m_j\\pi_j(1\
    \ - \\pi_j)$. Note that the variance of $T_j$ is $v_jw_j^{-1}$. For known $\t\
    heta$, the Quasi-likelihood estimator of $\beta$ can be solved iteratively\n\n\
    ```\n$\\hat{\beta}_{(s+1)} = \\hat{\beta}_{(s)} +(\\mathbf{X}'\\mathbf{W}\\mathbf{X})^{-1}\\\
    mathbf{X}'\\mathbf{W}(\\mathbf{y}-\boldsymbol{\\mu}),\\quad$ (3.10)\n```\n\nwhere\
    \ $\\mathbf{V} = \\text{Diag} [m_1\\pi_1(1-\\pi_1), m_2\\pi_2(1-\\pi_2), ...,\
    \ m_n\\pi_n(1-\\pi_n)] = (v_1, v_2, ..., v_n)$ and\n\n```\n$\\mathbf{W} = \\text{Diag}\
    \ [\\frac{1}{1+(m_1-1)\\theta}, \\frac{1}{1+(m_2-1)\\theta}, ..., \\frac{1}{1+(m_n-1)\\\
    theta}] = \\text{Diag}(w_1, w_2, ..., w_n).$ The case $\theta=0$ makes $\\mathbf{W}\
    \ = \\mathbf{I}$, the identity matrix. Then, the above iterative procedure becomes\
    \ the one for finding the MLE of $\beta$.\n```\n\nWhen a $w_j$ is associated with\
    \ the $j$-th subject (cluster), the usual Pearson-square statistic\n\n```\n$\\\
    chi^2 = \\sum_{j=1}^n \\frac{w_j(t_j-m_j\\hat{\\pi}_j)^2}{m_j\\hat{\\pi}_j(1-\\\
    hat{\\pi}_j)},\\quad$ (3.11)\n```\n\nWilliams performed Taylor's series expansion\
    \ on $E(X^2)$ to derive the moment estimator\n\n```\n$\\hat{\theta} = \\frac{\\\
    sum_{j=1}^n w_j(1-w_jv_j)}{\\sum_{j=1}^n w_j(m_j-1)(1-w_jv_j)},\\quad$ (3.12)\n\
    ```\n\nwhere $h_j$ is the variance of the linear predictor $\\hat{\\eta}_j = \\\
    mathbf{x}'\\boldsymbol{\beta}$.\n\nThe algorithm proposed by Williams to estimate\
    \ $\beta$ and $\theta$ simultaneously is as follows.\n\n+   Step 1: Assume $\t\
    heta=0$ ($w_j=1$) and obtain $\\hat{\beta}$, the MLE of $\beta$ using the algorithm\
    \ in equation (2.23) of Chapter 2. Evaluate the Pearson's chi-square statistic\
    \ $X^2$ using equation (3.11)."
  merge: -1
  img_proc: true
- pgno: 83
  md: "# Chapter 3 Quasi-likelihood Functions 71\n\nStep 2: Compare the value of X$^2$\
    \ with that of a Chi-square distribution with (n–k) degrees of freedom. If the\
    \ statistic X$^2$ is unacceptably large, conclude that the intra-cluster correlation\
    \ is greater than zero, (\\theta > 0$) and obtain $\\hat{\theta}$ as\n\n```\n\
    $$\\hat{\\theta} = \\frac{X^2 - (n-k)}{\\sum(m_j-1)(1-v_j^2)}$\n```\n\nStep 3:\
    \ Using the new weights $w_j = [1+(m_j-1)\\hat{\theta}^2]^{-1}$, estimate $\\\
    hat{\beta}$ using the iterative procedure in (3.10). Recalculate the Pearson’s\
    \ Chi-square statistic X^2$ using equation (3.11).\n\nStep 4: If the X$^2$ is\
    \ close to (n – k), then conclude that $\\hat{\theta}$ is satisfactory and stop\
    \ the procedure, re-estimate $\\hat{\theta}$ using equation (3.12), and go back\
    \ to Step 3.\n\nAs in Williams (1982), we revisit Crowder’s (1978) example to\
    \ illustrate this methodology. Crowder’s example consisted of a 2x2 factorial\
    \ experiment with two types of seeds (O. aegyptiaca 75 and 73) and two types of\
    \ root extracts (bean and cucumber). The outcome is “t”, the number of Seeds that\
    \ germinated out of “m” seeds. The data are reported in Table 3.7.\n\n# Table\
