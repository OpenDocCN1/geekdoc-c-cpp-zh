    In dosage mortality studies, the quantity of interest is the LD50, the dosage
    that is lethal for 50% of the population. This quantity can also be thought of
    as the median tolerance level for the population. Under the logistic regression
    model, LD50 is readily available as the solution to


    > $\beta_0 + \beta_1 LD50 = \ln\left(\frac{\pi}{1-\pi}\right)$


    by taking $\pi=\frac{1}{2}$. In this case $\frac{\pi}{1-\pi}=1$ and therefore,
    LD50=\frac{\beta_0}{\beta_1}$. In Murray’s example,


    an estimate of LD50 is $\frac{10.3279}{2.4582}=4.2014$. This dosage in the natural
