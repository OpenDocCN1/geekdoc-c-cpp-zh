    other group are not. Subjects from both groups are then followed, and at the end
    of the study they are classified according to whether or not they developed a
    certain disease. The underlying true and unknown conditional probabilities of
    disease giving the status of a subject with respect to exposure for a prospective
    study are given.


    | Exposure Factor | Yes | No | Total |

    | --- | --- | --- | --- |

    | Present | $\pi_{11} / \pi_{1+}$ | $\pi_{12} / \pi_{1+}$ | 1 |

    | Absent | $\pi_{21} / \pi_{2+}$ | $\pi_{22} / \pi_{2+}$ | 1 |


    A common risk measure is the **Odds-ratio (OR)**, which is based on the ratio
    of two odds, namely, the odds of having the disease when the exposure factor is
    present, and the odds of having the disease when the exposure factor is absent.
    These odds are defined as


    > $\text{Odds(Having the disease when the Exposure Factor is Present)} = \frac{\pi_{11}
    / \pi_{12}}{\pi_{21} / \pi_{22}}$


    and


    > $\text{Odds(Having the disease when the Exposure Factor is Absent)} = \frac{\pi_{21}
    / \pi_{22}}{\pi_{11} / \pi_{12}}$


    Thus, the odds-ratio is


    > $OR = \frac{\text{Odds(Having the disease when the Exposure Factor is Present)}}{\text{Odds(Having
    the disease when the Exposure Factor is Absent)}} = \frac{\pi_{11} / \pi_{12}}{\pi_{21}
    / \pi_{22}}$'
