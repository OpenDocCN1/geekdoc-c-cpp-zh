- pgno: 53
  md: '# Chapter 2 Generalized Linear Models 41


    Consider now a classification variable X that takes the value 1 if the exposure
    factor is present, but takes 0 otherwise. Let $\pi(X)$ represent the probability
    of having the disease, given the exposure factor X. Now, we posit a logistic regression
    model for $\pi(X)$ as follows:


    ```

    logit(\pi(X)) = \ln\left(\frac{\pi(X)}{1-\\pi(X)}\right) = \beta_0 + \beta_1 X
    .

    ```


    When the exposure factor is present, the probability of having the disease is


    ```

    \pi(X=1) = \frac{e^{\beta_0+\beta_1}}{1+e^{\beta_0+\beta_1}} .

    ```


    Similarly, the probability of having the disease when the exposure factor is absent


    ```

    \pi(X=0) = \frac{e^{\beta_0}}{1+e^{\beta_0}} .

    ```


    Therefore, it can be shown that the odds-ratio is


    ```

    OR = \frac{\pi(X=1)}{1-\\pi(X=1)}}{\frac{\pi(X=0)}{1-\\pi(X=0)}} = e^{\beta_1}
    .

    ```


    The result is fundamental: the slope parameter of a logistic regression model
    can be interpreted in terms of the logarithm of odds-ratios. In the previous setup,
    $\beta_1=\ln(OR)$. The topic of logistic regression has been covered by many authors.
    We refer the reader to Hosner and Lemhow (2000) for an all-inclusive text on logistic
    regression.


    In general, if the exposure factor is present, the classification variables take
    $X=x_1$, and $X=x_2$ if the exposure factor is absent. The odds-ratio is given
    by $OR=e^{(x_1-x_2)\beta_1}$. In particular, if a $\pm1$ coding is used $OR=e^{\pm\beta_1}$.
    The coding provides flexibility to the analysts to directly estimate the quantity
    of impact in a given study.


    Consider now a case-control study where two independent groups of subjects are:
    one where subjects have a disease (Cases), and the other subjects are disease
    free (Controls). Each subject is somehow investigated to see retrospectively he/she
    was exposed or not to a certain risk factor. The truly and unknown conditional
    probabilities of a subject being in given exposure factor for each of the disease
    and the healthy groups are given in the table below.'
