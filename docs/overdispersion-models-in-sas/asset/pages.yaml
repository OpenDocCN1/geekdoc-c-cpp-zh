- pgno: 307
  md: '# Chapter 9 Generalized Estimating Equations Techniques for Marginal Models
    295


    where $\gamma \sim \text{Normal}(0, G)$, $g(\cdot)$ is a link function, $g^{-1}(\cdot)$
    its inverse, and $\eta = X\beta + Z\gamma$ the linear predictor. The variance
    of $Y$ on the random effect $\gamma$


    $$\text{Var}(Y|\gamma) = A^{1/2}RA^{1/2}$, (9.7)


    where $A$ is a diagonal matrix that contains the variance functions of the model.
    As GLM, the variance function expresses the variance of a response as a function
    of the mean. namely, from the DIST= option in the MODEL statement, or from the
    user-supplied variance function (see the included Variance Functions in the GLIMMIX
    documentation). The matrix $R$ is a variance matrix specified by the user through
    the RANDOM statement. This matrix must not be confused with the R-side matrix
    previously described. If the conditional distribution of the data contains an
    additional scale parameter, it is either part of the variance functions or part
    of the $R$ matrix. This will not be the case in the models discussed here since
    they all have $\phi=1$. The method of Pseudo-likelihood estimation based on linearization
    to estimate the parameters of the GLMM in (9.6) was proposed by Wolfgang and O’Connell
    (1993) based on a first-order Taylor linearization of $\mu$ around some initial
    estimators $\hat{\beta}$ and $\hat{\gamma}$. This will be discussed in the next
    chapter with more details. Since marginal models do not have a random term $\gamma$,
    Wolfgang and O’Connell’s (1993) linearization boils down


    $P = X\beta + \varepsilon^*$, (9.8)


    where $P = \Delta^{-1}(\mu-g^{-1}(\eta)) + X\beta$, $\Delta = \frac{\partial g^{-1}(\eta)}{\partial
    \eta} = \hat{\Delta}$, \varepsilon^* \sim \text{Normal}(0, \Sigma)$ and


    $$\text{Var}(P) = \Sigma^* = \hat{\Delta}^{-1}A^{1/2}RA^{1/2}\hat{\Delta}^{-1}$
    corresponds to a mixed model. The reader can see this mixed with the G-side $Z\gamma$.
    As a result of Wolfgang and O’Connell’s (1993) terminology, the variance-covariance
    matrix $\Sigma^*$ represents the R-side of (9.8). As previously stated, the matrix
    $R$ in $\Sigma^*$ is specified by the user through the RANDOM statement. For marginal
    models, this specification is stated by RANDOM_RESIDUAL, and it is followed by
    the options SUBJECTS=effect, which identifies the structure of $G$ for G-side
    effects and the covariance structure of $R$ for R-side effects. Here we focus
    on R-side effects. The GLIMMIX procedure provides a wide variety of covariance
    structures. Many applications call for either diagonal (TYPE=VC) or unstructured
    covariance matrices. The TYPE=VC (variance components) option is the default for
    each random effect. It is recommended to model unstructured covariance matrices
    in terms of their Cholesky parameterization (TYPE=CHOL) rather than TYPE=UN (unspecified).
    Below are common covariance matrix structures available in GLIMMIX.


    More, Jorge, and Nagaraj. Overdispersion Models in SAS®. Copyright ©2011, SAS
    Institute Inc., Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional
    SAS procedures, visit support.sas.com/publishing.'
