- pgno: 275
  md: "# Chapter 8 A Two-stage Maximum Likelihood Estimation Procedure 263\n\nfor\
    \ maximum likelihood estimations of the parameters of the overdispersed multinomial\
    \ models under discussion. For details, we refer to Neerchal and Morel (1998).\n\
    \nFirst, let us denote the FIM of the Dirichlet-multinomial distribution by $\\\
    mathbf{F}_{DM}(\\mathbf{0})$. Individual elements of the FIM, a $(d+1)\times(d+1)$\
    \ symmetric matrix, will be denoted by $F_{DM}(\\pi_i, \\pi_j)$ for $i,j=1,2,...,d$;\
    \ $F_{DM}(\\pi_i, \nho)$, which is also equal to $F_{DM}(\nho, \\pi_i)$ for symmetry,\
    \ for $i=1,2,...,d$; and $F_{DM}(\nho, \nho)$. Similarly, the FIM of the Random-clamped\
    \ Multinomial distribution is denoted by $F_{RCM}(\\mathbf{0})$. Individual elements\
    \ of the FIM of the Random-clamped\n\nMultinomial distribution are denoted by\
    \ $F_{RCM}(\\pi_i, \\pi_j)$ for $i=1,2,...,d; i \neq j$; which is also equal to\
    \ $F_{RCM}(\\pi_i, \nho)$ due to symmetry, for $i=1,2,...,d$; and $F_{RCM}(\n\
    ho, \nho)$.\n\nUnder the Dirichlet-multinomial distribution, as the cluster size\
    \ increases, as $m \to \\infty$, we have that\n\n```\n$$\\begin{aligned} F_{DM}(\\\
    pi_i, \\pi_j) & \\to c^2\\Psi'((\\pi_i) + \\Psi'((\\pi_{d+1})) & i=1,2,...,d \\\
    \ F_{DM}(\\pi_i, \\pi_{i'}) & \\to c^2\\Psi'((\\pi_{d+1})) & i=1',2,...,d, i \\\
    neq i' \\ F_{DM}(\\pi_i, \\rho) & \\to c[\\pi_{d+1}'\\Psi'((\\pi_{d+1})) - \\\
    pi_i\\Psi'((\\pi_i))] & i=1,2,...,d & \\frac{2}{\\rho^4} \\ F_{DM}(\\rho, \\rho)\
    \ & \\to c\\sum_{i=1}^{d+1} \\Psi'((\\pi_i)) + \\Psi'((\\c)) & \\frac{4}{\\rho^6}\
    \ \\end{aligned}$ (8.3)\n```\n\nwhere $c = \\rho^2(1-\\rho^2)$, $\\Psi'(x)$ is\
    \ the trigamma function given by $\\Psi'(x) = \\frac{\\partial}{\\partial x}\\\
    Psi(x)$,\n\nand $\\Psi''(x) = \\frac{\\partial^2}{\\partial x^2}\\log(x)$ is the\
    \ usual digamma function. Interestingly, the limiting FIM of the DM distribution\
    \ connects to that of the Dirichlet distribution. As indicated in Chapter 7, the\
    \ Dirichlet distribution is the conjugate prior of the Multinomial distribution.\
    \ Note\n\npointed out by Jordan and Kote (1969, Section 13.1) and as shown in\
    \ Neerchal and Morel (1998, Equations (A.8) and (A.9)), the computation of the\
    \ individual elements of the FIM of the DM distribution can be performed in terms\
    \ of its marginal distributions, i.e., the Beta-binomial distribution. This observation\
    \ provides significant relief in the computational effort needed computing the\
    \ FIM of the DM distribution. However, similar simplification does not occur for\
    \ the RCM distribution, and expectations of the elements of the associated FIM\
    \ must be computed by summing over the entire multinomial sample space of $\\\
    Omega$; we have\n\nMore, Jorge, and Nagaraj Neelder. Overdispersion Models in\
    \ SAS.. Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA: ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/publishing."
  merge: -1
