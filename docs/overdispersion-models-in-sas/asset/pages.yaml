    # 7.12 Modeling the Coefficient of Agreement Kappa via the Dirichlet-multinomial
    and the Random-clumped Multinomial Distributions


    Cohen’s Kappa coefficient (Cohen, 1960) is a statistical measure of inter-rater
    agreement. It measures the agreement between two raters (or judges) who rate (or
    classify) n subjects (or items) into C mutually categories. Cohen’s Kappa is also
    used in the so-called calibration studies, where two rate n subjects regarding
    some variable of interest—one representing the “gold standard” and the other acting
    as the “novice.” The aim of these studies is to qualify the trainee by showing
    that the Kappa coefficient is “large enough” so that the trainee is in agreement
    with the trainer.


    Let π_{ij</sub> represent the joint probability that a subject is classified into
    the i-th category by the first rater and the j-th category by the second rater,
    i=1,2,...,C, j=1,2,...,C. Then,


    ```

    π_{0</sub> = ∑π_{ij</sub> represents the probability that the two graders agree
    on the classification of a subject.

    ```


    Under the assumption that the two graders judge independently of each other, the
    probability of agreement by chance alone is π_{c</sub> = ∑_{i=1}^C π_{*i</sub>
    where π_{*i</sub> = ∑_{j=1}^C π_{ij</sub> and π_{*j</sub> = ∑_{i=1}^C π_{ij} cdot
    Cohen’s


