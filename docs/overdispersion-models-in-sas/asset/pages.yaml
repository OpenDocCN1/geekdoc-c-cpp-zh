  md: '# Chapter 6 Likelihood Models for Overdispersed Count Responses 189


    ```

    ods html;

    title2 "Poisson Hurdle Model";nproc nlmixed data=Milk Consumption;

    parms alpha=0 beta=0;

    p1 = 1/(1+exp(-alpha));

    mu = exp(beta);

    p2 = exp(-mu);

    if y=0

    elelse ll = log((1-p1)/(1-p2)) + y * log (mu)

    ll -= gamma(y+1)

    ll -= freq*ll;

    model y = general(1);

    predict 1/(1+exp(-alpha)) out=PredMilk_1;

    estimate "Mu" = 1/(1+exp(-alpha));

    estimate "Mean" = exp(beta);

    estimate "Variance" = 1/(1+exp(-alpha))/(1/(1+exp(-alpha)))*exp(beta)*exp(beta);

    run;

    ```


    ```

    title2 "Negative-Binomial Hurdle Model";nproc nlmixed data=Milk Consumption;

    parms alpha=0 beta=0 kappa=0.5;

    bounds kappa > 0;

    p1 = 1/(1+exp(-alpha));

    mu = exp(beta);

    a = 1/kappa;

    p = 1 / (1 + kappa*mu);

    p2 = p^a;

    if y=0

    else ll = log((1-p1)/(1-p2)) + a * log (p) + y * log (1-p)

    ll -= gamma(y+a) - gamma(a)

    ll -= freq*ll;

    model y = general(1);

    predict 1/(1+exp(-alpha)) out=PredMilk_2;

    estimate ''Pl'' = 1/(1+exp(-alpha));

    estimate ''Mu'' = exp(beta);

    estimate ''Kappa'' = 1/(1+exp(-alpha))/(1/(1+exp(-alpha)))**(kappa))*exp(beta)*exp(beta);

    estimate ''Variance'' = 1/(1+exp(-alpha))/(1/(1+exp(-alpha)))**(kappa))*exp(beta)
    * (1+exp(beta)+kappa*exp(beta);

    1/(1+exp(-alpha))/(1/(1+exp(-alpha))**(kappa))*exp(beta)*exp(beta);

    1/(1+exp(-alpha))/(1/(1+exp(-alpha))**(kappa))*exp(beta);

    run;

    ```


    ```

    title "Milk Consumption Example - Mullahy (1986)";

    titoc means data=Milk Consumption n mean maxdec=4;

    var y;

    freq freq;

    run;

    ods html close;

    ```'
