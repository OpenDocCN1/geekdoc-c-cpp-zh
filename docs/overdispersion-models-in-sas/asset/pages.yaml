    There seems to be no clear-cut criteria for choosing between these two analyses
    (Probit versus Logit). They may be thought of as modeling the event triggered
    by a latent variable distributed as to Normal or Logistic distribution, respectively.
    Cox and Snell (1989, pp. 21-22) point out that for most purposes the Logistic
    and the Normal distributions agree closely, except when interest is in extreme
    values, where the probability of success is either very small or very close. The
    cumulative normal curve approaches its limit more rapidly than the cumulative
    logistic curve, indicating that the latter has longer than the former. The programming
    statements in Program 2.4 provide the plots of the estimated probability functions
    versus the observed proportions. (More than 70 years ago, Bliss and Berkinson
    much


    have to make these plots by hand! The observed proportions $\hat{P}_j = \frac{t_j}{m},
    j=1,2,...,11$ are m.,


    overlaid with the estimated functions. We first generate the data set "temp,"
    dosage values in the 38-to-301 range, by increments of ten. The variable "$x"
    is the natural log of dose. This data is concatenated with the data "pyrethrins."
    Then, two GLM''s are fit: one with Probit link and the other one with Logit. The
    data set "temp" is not used in any of the computation of the MLE for the variables
    "$t" and "$m" are missing. However, like many other procedures, GLIMMIX provides
    probability estimates for the missing data. They are used to construct the smooth
    cumulative probability functions.


