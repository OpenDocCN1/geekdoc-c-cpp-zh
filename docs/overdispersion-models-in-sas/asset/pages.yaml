    # 9.1 Introduction


    "Generalized Estimating Equations," better known simply by its acronym GEE, is
    a methodology adopted by Liang and Zeger (1986), and Zeger and Liang (1988) for
    Generalized Linear Models in a longitudinal setting. The methodology is related
    to Quasi-likelihood models Woodburn (1974) and McCulloch (1983) and Generalized
    Linear Models [McCullagh and Nelder (1983)]. Although the GEE methodology was
    originally proposed for longitudinal data analysis, it has been applied to a wide
    variety of models for cluster data. There are three essential elements of GEE:
    correct specification of the mean of the model via a link function, the proposed
    structure of the correlation that encompass the clusters (subjects in


    ![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_295_0.png)'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'longitudinal studies) referred to as the working correlation matrix, and an
    application of the Taylor series expansion to obtain the variance estimation which
    provides the variance-covariance matrix of the estimates, usually known as "robust,"
    "empirical," or "sandwich". This is a consistent estimator of the true underlying
    variance-covariance matrix, even when the correlation of the repeated measurements
    is mismeasured, and hence the name "robust." The use of "sandwich" estimators
    is well-known to sampling practitioners. Binder (1983) and Liang and Zeger (1986)
    discuss the estimation of the variance-covariance matrix of the parameters with
    non-linear link functions, such as the log function, to model the mean of a categorical
    response variable. The "sandwich" estimator is justified by a Taylor series expansion
    (or the Delta method) as discussed by Binder (1983). Liang and Zeger obtain the
    "sandwich" estimator under the GEE set. Their approach justifies applying the
    GEE to the exponential family of response variables and expands the robustness
    argument to include a wide range of models. Hence, the estimator is called the
    "Delta method estimator" in the sampling literature; the estimator is denoted
    as "GEE methodology" in the biostatistical literature.


    As originally presented, GEE methodology is derived under a very general set up
    for the exponential family of distributions. Explicit distributional assumptions
    do not play a direct role in the implementation of GEE other than in the computation
    of the first moments. Since overdispersion data are characterized by the specification
    of the first moments, and the overdispersion parameter captures the within-cluster
    correlation, GEE may be used naturally to obtain estimates of the mean, variance
    and the overdispersion parameters. Of course, it also opens up further research
    questions for incorporating higher moments to obtain a better fit, as explored
    in Newcomer (2007). Thus, we devote a chapter in this book for explaining GEE
    and its application to overdispersion data.


    Models to be covered in this chapter are depicted in the diagram below. For a
    complete depiction of all the models in this book see Appendix 1.1.'
