- pgno: 200
  md: 'When $Y_2 \sim \text{Negative-binomial}(\mu, \kappa)$ equation (6.23) becomes


    ```

    $Pr(Y = y) = \begin{cases} (1-\pi_1)^y \ \Gamma(y+\frac{1}{\kappa}) & \text{if
    } y=0 \ \(1-\pi_1)^{\frac{1}{1+\kappa}}(\frac{\kappa\mu}{1+\kappa})^y & \text{if
    } y\ge1 \ \(1-\pi_1)^{\frac{1}{1+\kappa}}\frac{\Gamma(y+1)}{\Gamma(y+1/\kappa)}
    ... \end{cases}$

    ```


    Thus, the mean and variance of a Negative-binomial based hurdle model are, respectively,


    ```

    $E(Y) = \frac{1-\\pi_1}{1-\\pi_2}\mu \quad (6.31)$

    ```


    and


    ```

    $Var(Y) = \frac{1-\\pi_1}{1-\\pi_2}^2\mu(1+\mu+\kappa)-\frac{1-\\pi_1}{1-\\pi_2}\mu^2
    \quad (6.32)$

    ```


    A program for generating random counts under a Poisson Hurdle and a Negative-binomial
    Hurdle model is provided in Appendix 6.2.


    Program 6.6 provides the programming statements for fitting a Poisson Hurdle and
    a Negative-binomial Hurdle models to the daily milk consumption data of Table
    6.4 using NLMIXED


    # Program 6.6: Fitting a Poisson Hurdle and a Negative-binomial Hurdle Model to
    the Daily Milk Consumption Data of Table 6.4


    ```

    /*

    Milk Consumption Example -- Mullahy (1986)

    */

    data Milk_Consumption;

    input Y freq;

    abel * (Number of Glasses of Milk);

    sum * freq;

    call symput(''n'',cats(sum));

    drop sum;

    datalines;

    0 767

    1 557

    2 538

    3 142

    4 62

    5 23

    6 16

    ;

    ```'
