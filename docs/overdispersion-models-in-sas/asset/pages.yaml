  md: "# Chapter 10 Generalized Linear Overdispersion Mixed Models 367\n\n# Program\
    \ 10.6: A Zero-inflated Poisson GLOMM\n\n```\n/*\nGeneration of data under a Zero-inflated\
    \ Poisson GLOMM\nwith parameters Beta0, Betal, W, and Sigma**\n*/\ndata zip_glomm;\n\
    \  beta0 = 0.70;\n  betal = 0.40;\n  w = 0.20;\n  sigma2 = 1.2;\n  m = 200;\n\
    \  seed = 1917;\n  nl = n+1;\n  n2 = n+n;\n  sigma = sqrt(sigma2);\ndo id=1 to\
    \ m;\n  u = uniform(seed);\n  if u > w then\n    Group = 1;\n    mu = exp(Beta0+Betal+z);\n\
    \    Y = ranpoi(seed,mu);\n    output;\n  else do\n    Group = 0;\n    Y = 0;\n\
    \    output;\n  end;\nend;\ndo id=nl to n2;\n  z = Sigma*normal(seed);\n  do id=1\
    \ to m;\n    u = uniform(seed);\n    if u > w then\n      Group = 0;\n      mu\
    \ = exp(Beta0 + +z);\n      Y = ranpoi(seed,mu);\n      output;\n    else do\n\
    \      Group = 0;\n      Y = 0;\n      output;\n    end;\nend;\nkeep it t group;\n\
    run;\nods html;\ntitle \"Initial estimates of Beta0, Betal and Sigma**2 using\
    \ PROC GLIMMIX\";\nproc glimmix data=zip_glomm method=quad-order=data;\n  class\
    \ group;\n  model Y = group / link=dist=poisson;\n  random int / subject=id;\n\
    run;\n```"
