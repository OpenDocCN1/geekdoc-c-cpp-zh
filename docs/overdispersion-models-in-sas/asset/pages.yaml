    \ Kappa, W, and Sigma**2\n*/\ndata zbind_glomm;\n    beta0 = 0.70;\n    betal\
    \ = 0.40;\n    kappa = 0.15;\n    w = 0.20;\n    sigma2 = 1.2;\n    m =\n    n\
    \ = 200;\n    seed = 1917;\n    nl = n+1;\n    n2 = n+n;\n    alpha = 1 / kappa;\n\
    \    sigma = sqrt(sigma2);\n    do i=1 to n;\n        u = uniform(seed);\n   \
