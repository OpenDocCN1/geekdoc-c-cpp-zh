    # 10.6 Zero-inflated Poisson and Zero-inflated Negative-binomial GLOMMs


    For count data, we considered several variations of the Poisson model in Chapter
    6. In principle, random effects may be incorporated into each of those models
    in a natural way. The estimation of those models with random effects can be approached
    in SAS in a similar way. As illustrative examples, in this section we consider
    the Zero-inflated Poisson (ZIP) and the Zero-inflated Negative-binomial (ZINB)
    discussed in Section 6.3 of Chapter 6 in the context of GLOMM, is, the ZIP and
    ZINB models with random effects embedded in the linear predictors. Let us first
    take up a ZIP GLOMM.


