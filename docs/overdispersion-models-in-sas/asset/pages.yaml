    # 5.3 An Omnibus Goodness-of-fit Test


    Note that the tests in Section 5.2 focus on testing for the presence of overdispersion
    against specific alternatives which model overdispersion. Tarcone (1979) and Dean
    (1992) described a variety of tests testing the “No overdispersion” null hypothesis
    against specific alternatives such as the Beta-binomial model. Paul and Placket
    (1978) and Collings and Margolin (1985) proposed similar types of tests for detecting,
    for instance, when the Negative-Shapiro-Wilk test of normality is an example of
    an omnibus test. In this section we will present tests for the model adequacy,
    which referred to as Omnibus tests.


    Omnibus tests are designed to test if a specific distribution fits the data. The
    null hypothesis is that the data come from a population with a specific distribution,
    while the alternative hypothesis states that the data do not come from that distribution.
    Since there is no model specified in the alternative hypothesis, we obtain maximum
    likelihood estimates under the alternative. The other wellknown omnibus test is
    the Pearson Goodness-of-fit test. In the case of the chromosome element in 4.6
    (see Table 4.3), the Pearson’s test given in Rao (1965, p. 391) and Cramer (1968,
    pp. 477-506) is applicable. However, when the m''s are different, the construction
    of a Pearson’s Goodness-of-fit statistic is not straightforward because the observed
    expected frequencies are not associated with any value of m. Meer and Morel (1998)
    proposed an extension of the traditional Pearson’s Chi-square statistic


    ```

    $X^2 = \sum (O_i - E_i)^2 / E_i ,$

    ```


    when the cluster size m, m''s are allowed to be different. Asymptotic properties
    of this test have been investigated by Sutradhar et al. (2008).


    Let $t_1, t_2, ..., t_n$ represent a represent of $n$ independent random variables
    $T_1, T_2, ..., T_n$, when these variables are allowed to have overdispersion
    relative to the Binomial distribution, i.e., the first two moments are as in equations
    (4.4) and (4.5). It is hypothesized that each $T_i$ has a certain probability
    function depending on the parameters $\pi$, $\rho$ and the cluster size $m_j$,
    where the m''s are allowed to be distinct. One way of extending the traditional
    Pearson’s test is by pooling the data across all clusters and comparing the observed
    distribution of $t_j/m_j$ to the corresponding expected frequencies. To end this,
    first divide the unit interval into $k$ mutually exclusive $A_s$, $s=1, 2, ...,
    R$. Then, compute the observed and expected frequencies as


