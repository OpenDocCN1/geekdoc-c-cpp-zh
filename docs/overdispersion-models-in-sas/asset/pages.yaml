  md: "# Chapter 2 Generalized Linear Models\n\nWe fit a Probit model for Murray’s\
    \ data. In a Probit model, the mean function is defined as\n\n$\\pi_j = \\Phi(\\\
    mathbf{x}_j\boldsymbol{\beta})$\n\nwhere $\\Phi(\\cdot)$ is the cumulative distribution\
    \ function of a standard Normal distribution. Thus, the Probit link is\n\n$\\\
    Phi^{-1}(\\pi_j) = \\mathbf{\beta}_0 + \beta_1\\mathbf{x}_j$\n\nNote that with\
    \ a Probit link the estimated linear predictors $\\hat{\\eta}_j = \\hat{\beta}_0\
    \ + \\hat{\beta}_1x_j$ are Z-scores. A subject with a predicted score of zero\
    \ has 50% probability of “success”, with a predicted score of 1.64 has a 95% probability,\
    \ etc. The programming statements for fitting a Probit model using GLIMMIX procedure\
    \ including the diagnostic residual plots are\n\n```\nods html;\nods graphics\
