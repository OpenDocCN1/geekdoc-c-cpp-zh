  md: "# Chapter 3 Quasi-likelihood Functions 67\n\nIn a clinical study of osteoporotic\
    \ patients at high risk for vertebral fractures, subjects were randomly assigned\
    \ to either a group receiving (bisphosphonate) active therapy (n1 = 28) or to\
    \ a placebo group (n2 = 25). The number of vertebral fractures (new or worsening)\
    \ was measured during a period of time that lasted approximately 14 and 39 months.\
    \ The data are presented in 3.6. This has has been discussed in Morel and Neerlich\
    \ (2010).\n\nLet Yj and Zj represent the number of vertebral fractures and the\
    \ years of follow-up for the j-th subject in the i-th treatment group, j = 1,\
    \ 2,...,n, i = 1. Conditioning on Zi, E(Yj) = μj/Zj,\n\nVar(Yj) = μj/Zj², ϕ >\
    \ 1, and link ln(μj/Zj) = α + τ, where α is an overall mean and τ\n\nthe effect\
    \ of the i-th treatment group. (duration of follow-up) is an offset, Zi > 0. The\
    \ link function can be written as ln(μj) = α + τ + ln(Zi). Including the offset\
    \ variable in the model leads to estimation of rate of vertebral fractures normalized\
    \ by the number of years of follow up. In this example we will use the GENMOD.\
    \ The estimate of the scale parameter will be based on Pearson’s Chi-square statistic.\
    \ The programming statements are provided in Program 3.5. There are three estimates.\
    \ They provide the logarithm of the rates of the two groups and their difference,\
    \ along with the associated ratios and rate ratios. The results are reported in\
    \ Program 3.5. The estimate of the scale parameter turns out to be 1.7311, indicating\
