    \ all var(cd4) into x;\nuse outl;\nread all var(episode) into y;\n\n  -- Compute\
    \ Jan van der Broek (1995) Score Test;\nn = nrow(x);\nif (df = 1) then x = j(n,1,1)\
    \ || x;\naux1 = y;\naux2 = exp(-lambdas);\naux3 = x*inv(x'*diag(lambdas)*x)*x*lambdas;\n\
    chisq = (sum(aux1/aux2) - n)*2 / (sum(1/aux2) - n) - aux3);\npval = 1 - probchisq(chisq,df,0);\n\
