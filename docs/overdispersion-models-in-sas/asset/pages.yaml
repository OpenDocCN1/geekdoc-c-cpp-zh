  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses 91\n\nmodels\
    \ to be true. Since all the overdisp considered here reduce to the Binomial distribution\
    \ under the null hypothesis, the likelihood ratio statistic can be computed by\
    \ subtracting the maximum value of the likelihood under an overdispersed model\
    \ from the maximum likelihood value under the Binomial distribution. While computing\
    \ this test statistic poses no difficulty at all, properties of the likelihood\
    \ ratio test cannot be on the boundary of the parameter space. Self and Liang\
    \ (1987) have shown in this case (Case 5 in their paper), the asymptotic distribution\
    \ of the likelihood ratio test is a 5:50 mixture of a point mass at zero and a\
    \ Chi-square distribution with 1 degree of freedom. The likelihood ratio test\
    \ statistic is 880.8–873.6–7.2 under the Beta-binomial, 7.0 under the Random-clumped\
    \ Binomial, 3.2 under the ZIB, and 7.3 under the Generalized Binomial with Additive\
    \ Interaction. Their appropriate P-values are 0.004, 0.004, 0.037, and 0.003,\
    \ and strongly support the hypothesis of overdispersion under either model.\n\n\
    **Table 4.2:** MLE Results from Fitting the Binomial, Beta-binomial, Random-clumped\
    \ Binomial, Zero-inflated Binomial, and the Generalized Binomial with Additive\
    \ Interaction to the Chromosome\n\n| Distribution | $\\hat{\\chi}$ | $se(\\hat{\\\
    chi})$ | $\\hat{\rho}$ | $se(\\hat{\rho})$ | -2 Log Likelihood |\n|---|---|---|---|---||\n\
    | Binomial | 0.5806 | 0.0155 | | -- | 880.0 |\n| Beta-binomial | 0.5807 | 0.0168\
    \ | 0.2944 | 0.0577 | 873.6 |\n| Random-clumped Binomial | 0.5805 | 0.0168 | 0.2930\
    \ | 0.0581 | 873.8 |\n| Zero-inflated Binomial | 0.5806 | 0.0163 | 0.2188 | 0.0649\
    \ | 877.6 |\n| Generalized Binomial | 0.5809 | 0.0168 | 0.2972 | 0.0575 | 873.5\
    \ |\n\nWhile the presence of overdispersion is easily accepted under any of the\
    \ four models, observe all four overdispersion models compete violently for being\
    \ chosen as the model to describe these data. In order to further examine the\
    \ quality of fit of these distributions to these data, we consider this example\
    \ by computing the traditional Pearson's Goodness-of-fit chi-square statistic\n\
    \n> $$\\chi^2 = \\sum_{i}\\frac{(O_i - E_i)^2}{E_i}$\n\nIn this example, the computation\
    \ of the Pearson's Chi-of-fit GOF is straightforward since all the clusters are\
