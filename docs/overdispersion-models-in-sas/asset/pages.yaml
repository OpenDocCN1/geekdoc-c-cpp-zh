  md: "# Program 9.4: Ratio Estimation for 49 Largest U.S. Cities in 1920 and 1930\n\
    \n```\n/*\n    Ratio Estimation\n    Sizes of 49 Large United States Cities (in\
    \ 1000's) in 1920 and 1930\n    Cochran (1977, page 152)\n*/\n\ndata cities;\n\
