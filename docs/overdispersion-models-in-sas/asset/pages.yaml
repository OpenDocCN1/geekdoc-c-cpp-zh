  md: '# 224 Overdispersion Models in SAS


    and


    $$V(T) = m\{\text{Diag}(\pi) - \pi\pi^T\1+\rho^2(m-1)}, \quad (7.29)$


    where $\pi = (\pi_1, \pi_2, ..., \pi_d)$ is the vector of probabilities, $0 <
    \pi_i < 1$, $\sum_{i=1}^d \pi_i < 1$, and $\rho$ is the overdispersion parameter.
    Note that the probability associated with the gamma is


    $$\pi_{d+1} = 1 - \sum_{i=1}^d \pi_i$. The moment structure given by equations
    (7.28) and (7.29) can be realized by


    number of distributions with support in the usual multinomial space. We will refer
    to such distributions as overdispersed multinomial distributions (or models).
    We consider the Maximum Likelihood Estimation for two overdispersed Multinomial
    models, namely the Dirichlet-multinomial distribution, and the Random-clumped
    Multinomial distribution proposed by the authors of this paper.


    If $t$ is a realization of $T$, $t = (t_1, t_2, ..., t_d)$ with $t_{d+1} = m -
    \sum_{i=1}^d t_i$, the probability function of the Dirichlet-multinomial (DM)
    distribution, due to Mosimann (1962), is by


    $$P_{DM}(t; \pi, \rho) = \frac{m!}{t_1!t_2!...t_d!} \frac{\Gamma(c)}{\Gamma(m+c)}
    \frac{\prod_{i=1}^{d+1}\Gamma(t_i+c_i)}{\prod_{i=1}^{d+1}\Gamma(c_i)}, \quad (7.30)$


    where $c = \rho^2(1-\rho)$, $0 < \rho < 1$, and $\Gamma(.)$ denotes the gamma
    function. Mean and variance of the Dirichlet-multinomial distribution are the
    same as those given by equations (7.28) and (7.29). The Dirichlet-multinomial
    distribution is a multivariate extension of the Beta-binomial distribution discussed
    in Section 4.2. If the conditional probability of $T|P$ is


    Multinomial($P;m$) and if $P$ is a Dirichlet distribution with probability density


    $$f_D(P; \pi, \rho) = \frac{\Gamma(c)}{\prod_{i=1}^{d+1}\Gamma(c_i)} \prod_{i=1}^{d+1}P_i^{c_i-1}},
    \quad (7.31)$


    then the unconditional distribution of $T$ is Dirichlet-multinomial. Mosimann
    (1962) refers to this distribution as the Compound Multinomial Distribution. This
    generalizes the Beta-binomial distribution to the multivariate case. The DM distribution
    possesses a number of interesting properties. For example, their margins are again
    DM, and in particular, the one-dimensional marginal is the Beta-binomial distribution.
    This observation turns out to be important in the computation of maximum likelihood
    estimates, as we shall see later.


