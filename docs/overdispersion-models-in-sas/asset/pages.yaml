- pgno: 336
  md: '# 9.10 Small Sample Bias Corrections for Sandwich Estimators


    It is well-known that in small samples, the GEE estimator of the variance-covariance
    matrix of the parameter estimates leads to inflated Type I error rates. To cope
    with this problem, resampling methods such as the jackknife and the bootstrap
    have been suggested to estimate robust covariance matrix. As pointed out by Mancel
    and DeRouten (2001), these methods fail for binary responses and for small numbers
    of subjects (clusters). If $\hat{H}^{-1}\hat{G}\hat{H}^{-1}$ denotes the “sandwich”
    estimator using GEE with $\hat{H}^{-1}$ as the “model-based” covariance matrix,
    Mancel and DeRouten argue that the residuals used to estimate $\hat{H}$ tend to
    be too small. Thus, the “sandwich” covariance matrix would be expected to underestimate
    the covariance matrix of the parameters, and its bias towards underestimation
    when the bias of the residuals is large (i., when the number of clusters is small).
    Thus, to reduce the small sample bias by using a first-order Taylor series approximation
    on the residuals in the computation of $\hat{G}$, Fay and Graraud (2001) propose
    two sample corrections. The first of these corrections is similar to that of Mancel
    and DeRouten (2001) but has the advantage that it may be applied to more general
    frameworks than GEE, such as the Cox proportional hazard and logistic regression.
    The second correction by Fay and Graraud (2001) consists of using f (or t) distribution
    instead of Chi-square (or normal) distribution, with an adjustment on the degrees
    of freedom. Kaumarni and Karoll (2001) propose an adjustment to ensure the use
    of the sandwich estimates combined with the distribution quantities provides coverage
    with probability below the nominal value. Pan and Wall (2002) propose an estimator
    and allows for f-test (or t test) that takes into account the bias of the “sandwich”
    estimator and allows for testing more one parameter simultaneously. Morel (1989),
    inspired by similar work in the survey sampling literature, propose a small sample
    correction to the GEE estimator and implemented it with the generalized link function
    with nominal-type data. The correction not only reduces the small sample bias
    in the Type I error rates but also guarantees that the estimated variance-covariance
    matrix is positive. It can be applied for testing one or more parameters, but
    differs from other corrections in the adjustment to the residuals of $\hat{G}$.
    That is, the correction is additive and not multiplicative, with the added term
    varying as the number of clusters (primary sampling units) increases. Morel, Bokossa
    and Neerhaal (2003) consider this additive correction to the GLM and GLMM frameworks,
    which are applicable to univariate and multivariate-type responses. The GLIMMIX
    procedure provides a variety of multiplicative small sample bias corrections,
    which are de-facto found in their documentation under the heading “Residual-based
    Estimators.” The de-facto by Morel, Bokossa and Neerhaal (2003) correction, MBN
    for short, is under the heading “Design-adjusted MBN Estimator.”. THE SURVEYLOGISTIC
    procedure provides the option of adjusting the sandwich variance estimator with
    the Morel (1989) correction.


    Following the documentation of PROC GLIMMIX, the general form of the empirical
    covariance estimator with the current multiplicative small sample bias corrections
    can be written as


    ```

    $Var(\hat{\beta}) = c \times \Omega \sum_{i=1}^{n} A_{i}'' \hat{D}_{i}'' \Sigma_{i}^{-1}
    e_{i} e_{i}'' \hat{D}_{i} A_{i}, \quad (9.26)

    ```


    Morel, Jorge, and Nagaraj Neerhaal. Overdispersion Models in SAS®. Copyright 2011,
    SAS Institute Inc., Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
