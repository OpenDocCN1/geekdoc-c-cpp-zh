  md: "# Chapter 4 Likelihood Models for Overdispersed Binomial Responses 109\n\n\
    interval for the odds-ratio of PHT versus the combined controls with TCPO = 100\
    \ mg/kg is given by exp$(\\hat{\beta}_2 + \\hat{\beta}_3 \\pm 1.96, \\sqrt{\\\
    hat{\beta}_2^2 + \\hat{\beta}_3^2}$). Table 4.8 shows the approximate 95% confidence\n\
    \nintervals for the two levels of TCPO based on the Binomial, Beta-binomial and\
    \ Random-clumped Binomial models. Using the GENMOD and GLIMMIX procedures, NLMIXED\
    \ does not produce confidence intervals using the method previously described.\
    \ Therefore, the results in Table 4.2 required an additional computation not in\
    \ the NLMIXED output. The confidence intervals under the Binomial model are much\
    \ shorter than those the overdispersed models. This outcome suggests that the\
    \ level of confidence obtained under the Binomial model is only nominal. The remaining\
    \ two models, which incorporate the latter effect, show that in the presence of\
    \ TCPO, the chances of omission may be the same for both PHT and the combined\
    \ control.\n\n# Table 4.8: Approximate 95% Confidence Intervals for Odds-ratio\
    \ for the Ossification for the Full Factor Logistic Regression with common $\r\
    ho$\n\n| Model | Odds-Ratio | 0 mg/kg Lower Bound | 0 mg/kg Upper Bound | 100\
    \ mg/kg Lower Bound | 100 mg/kg Upper Bound |\n|---|---|---|---|---||\n| Binomial\
    \ | 0.12 | 0.07 | 0.20 | 0.35 | 0.18 | 0.66 |\n| Beta-binomial | 0.18 | 0.08 |\
    \ 0.41 | 0.36 | 0.12 | 1.13 |\n| Random-clumped | 0.22 | 0.10 | 0.40 | 0.40 |\
    \ 0.13 | 1.23 |\n PHT: phenytoin; TCPO: trichlorophenole.\n\nThe NLMIXED procedure,\
    \ like other SAS procedures, provides the Akaike Information Criterion (AIC),\
    \ the Schwarz Bayesian Information Criteria (BIC). If \"L\" is the likelihood\
    \ function evaluated at the parameter estimates, \"n\" is the number of observations\
    \ (number of clusters), and \"u\" is the number of parameters being estimated,\
    \ then AIC, AIC, and BIC are defined as\n\n> AIC = -2 ln(L) + 2u\nAICC = -2 ln(L)\
    \ + \\frac{2u}{n-u-1}, and\nBIC = -2 ln(L) + u\\ln(n).\n\nThese statistics help\
    \ to find the model that best explains the data with a minimum number of parameters.\
    \ The preferred model is the one with the lowest value. We re-analyze the ossification\
    \ data under the overdispersed Binomial distributions, the Beta-binomial, and\
