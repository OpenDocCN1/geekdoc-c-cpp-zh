    \ xbeta ) );\n  theta = 1 / rho - 1;\n  c = lgamma(m-1) * lgamma(m-theta) + lgamma(theta*pi)\
    \ + lgamma(m-t*theta*(1-pi)) - lgamma(m-theta*pi) - lgamma(theta*(1-pi));\n  model\
