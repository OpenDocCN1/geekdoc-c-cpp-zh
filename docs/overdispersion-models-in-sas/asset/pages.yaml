    Table 9.1 shows the GEE results corresponding to two working correlation structures
    along with the estimates obtained under the Beta-binomial and the Random-clumped
    Binomial distributions. GEE is similar to Quasi-likelihood in the sense that neither
    approach is based on a likelihood function. While Quasi-likelihood adjusts the
    standard errors by a scale, GEE standard errors are obtained from the sandwich
    estimator of variance-covariance matrix. It will be instructive to the reader
    to obtain the Quasi-likelihood estimates for these data sets using codes similar
    to those given in Chapter 3, and likelihood based models are substantially different
    from the GEE. Finally, it is important to note that while we can perform goodness-of-fit
    tests described in Chapter 5 for the likelihood based models, we cannot test the
    validity of GEE model in the same way.'
