    # 9.2 Marginal and Conditional Models


    GEE can be applied to the so-called Marginal and Conditional Models. Marginal
    Models or Population-average Models are used to make inferences about population
    averages. On the other hand, Conditional Models are used when the focus is on
    subject-specific inference. The procedures MIXED and GLIMMIX distinguish between
    two different ways in which random effects affect a GLM, G-side and R-side. To
    distinguish these two types of random effects, consider a parallel study for evaluating
    the efficacy of a cream for hair growth where subjects were randomized to either
    apply the cream that supposedly grows hair, or to use a cream lotion placebo with
    nothing but inert ingredients. Subjects applied the lotions to their heads for
    a total of eight weeks, and a dermatologist observed hair growth on a weekly basis.
    Data are collected at weekly intervals to quantify the possible hair growth. Note
    that a string of measurements are obtained for each subject. We can account for
    the correlation of each subject by modeling it in different ways. One way is to
    model hierarchically, with subjects within the subject treated as random, i.e.,
    normally distributed with zero mean and variance². This approach introduces a
    variance-covariance structure to the string of measurements from the subject.
    This specification is referred to as "G-side." The model is said to be conditional,
    perhaps as a reference to the fact that it is specified using a conditional argument.
    Inferences, previously stated, are subject-specific. On the other hand, the string
    of measurements associated with each subject can be treated as a multivariate
    random vector having certain correlation structure. This explicit specification
    of a variance-covariance matrix is called "R-side." The model is said to be marginal,
    as a reference to the fact that the correlation structure is


