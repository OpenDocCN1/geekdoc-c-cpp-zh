    ```\n\nwhere $\\hat{\\lambda}_j = g^{-1}(x_j\\hat{\beta}_j)$.\n\nNelder and Wedderburn\
    \ went further and proposed a generalized analysis of variance for sequential\
    \ fitting of models using differences of deviances analogous to the classical\
