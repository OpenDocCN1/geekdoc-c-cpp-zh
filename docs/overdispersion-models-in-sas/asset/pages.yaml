  md: 'Selected parts of the results of Program 6 are given in Output 6. Under both
    models, the estimated values of $\pi_i = Pr(Y, 0)$ are the same, i.e., $\pi_i
    = 0.4037$. Once the hurdle is crossed,


    the estimated mean of the positive counts is $(1-\hat{\pi}_1) \frac{\hat{\mu}}{(1-\hat{\pi}_2)}$
    where $\pi_2 = Pr(Y_2, 0)$. In this


    example, both hurdle models provided the value: 1.1095. Not the true Akaike Information
    Criterion (AIC), the corrected information (AICC), and the Schwarz Bayesian Information
    Criterion (BIC) are smaller under the Negative-binomial hurdle model, suggesting
    that this model might be preferred over the Poisson hurdle model. We will corroborate
    this observation by performing a Pearson''s Goodness-of-fit test, similar to the
    one computed in Program 6.2. The estimated means under the two models (see equations
    (6.27) and (6.30)) turned out to be 1.1095, which coincides with the arithmetic
    mean attained from the MEANS procedure. That is not the case for the variance.
    The estimated variance under the Poisson hurdle model is 2.28, while that obtained
    under the Negative-Binomial hurdle model (see equation (6.31)) is 1.568. The latter
    variance is much closer to 1.564—the usual variance reported by the MEANS procedure.
    Note that the variances of the two hurdle models under discussion are larger than
    their mean. Thus, these models exhibit overdispersion. Furthermore, the estimated
    mean of a Poisson model is in this case 1.1095, the two hurdle models also exhibit
    overdispersion relative to the Poisson distribution.


