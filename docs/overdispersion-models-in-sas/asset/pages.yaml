  md: "the two factors. The levels of PHT were 60 mg/kg and 0 mg/kg, and the levels\
    \ of TCPO were 100 mg/kg and 0 mg/kg. The ossification data can be found in Table\
    \ 4.6. We first obtain GEE estimates using an independent working correlation\
    \ matrix. Program 9.2 provides the programming statements for fitting a GEE model\
    \ to the Teratology data using a log link and an independent working correlation\
    \ matrix. In the DATA step, data are rearranged so that we use the CLASS statement\
    \ and specify a factorial model with interaction. The REPEATED statement requests\
    \ the GEE estimates and passes on the litter identification to SAS. Excerpts of\
    \ the results are provided in Output 9.2.\n\n# Program 9.2: Fitting a GEE Model\
    \ with Independent Working Correlation Matrix to the Ossification Data using GENMOD\n\
    \n```\nOssification Example from Morel and Neerchal (1997),\nStatistics in Medicine,\
