    # 7.6 A Birth Defects Study


    Hartsfield et al. (1992) studied the effects of prenatal exposure to cadmium and
    on death and malformation of hamster fetuses. Data were obtained from a completely
    randomized experiment with pregnant female hamsters (litters) as the primary experimental
    units. Nine days after the hamsters became pregnant they intravenously received
    a solution containing one of the following substances: 2 mg kg⁻¹ of zinc, 2 mg
    kg⁻¹ of cadmium, 3 mg kg⁻¹ of cadmium, 2 mg kg⁻¹ of zinc and 2 mg kg⁻¹ of cadmium
    and 3 mg kg⁻¹ of cadmium. In addition to these five groups, there was a control
    group consisting of 10 pregnant females and 10 pregnant females injected a saline
    solution (injected controls). Each female was sacrificed five days later and each
    fetus into one of three categories: “dead,” “alive with malformation,” and “alive
    without any malformation.” The data are reported in Table 7.2. Morel and Koehler
    (1995) analyzed these data using a one-step Gauss-Newton estimator that accounts
    for overdispersion in the model. One-step Gauss-Newton estimators have a long
    history among econometricians, for example, Chapter 5.5 of Fuller, 1976). For
    illustrative purposes we will use the customary cumulative link and the variance
    structure (7.20) with Φ = Diag(ϕ₁, ϕ₂, ..., ϕ₄). Following Morel and Koehler (1995),
    the untreated and injected controls were combined into a single control group.


