    The logarithm of the Relative Risk as in interval (9,19) is 0.6931. Its estimated
    standard error, as obtained from (9,20), is 0.5477. An approximate 95% confidence
    interval is (-0.3804, 1.7667). The estimated Relative Risk is exp [0.6931]= 2.0
    and an approximate 95% confidence interval is (0.638, 5.8513). If the aim of the
    analysis is to estimate the Rate Ratio and not the Relative Risk, the logarithm
    of time to AE is an offset variable. In this case, the main results are as follows:
    The logarithm of the estimated incidence rates for the Active and Placebo groups
    are -3.5066 and -4.8929, respectively (9.14). Using equation (9,15), their associated
    standard errors obtained from the sandwich variance estimate estimate are 0.3332
    and 0.5266, respectively. The estimated rates for the Active and Placebo groups
    are 0.0300 and 0.0075, respectively. In the Placebo group, the expected occurrence
    of 52(0.0075)=0.39 AE per subject year. On the other hand, the rate is higher
    in the Active group, which is exp(0.0300)=1.03 AE per subject year. The estimated
    Rate Ratio is 4.00. An approximate 95% confidence interval is (1.1794, 35.863).
    Note that the above approach is a computational trick which gives the correct
    relative risk and rate ratio with their appropriate standard errors, and therefore
    the other parts of the output may not be relevant. An alternative way of obtaining
    the results associated with the relative risk is the following:


    ```

    title "Relative Risk Results";nproc genmod data=average_events descending;

    class id treat;

    model y = dist=binomial link=log;

    repeated subject=id / type=ind;

    ismeans treat;

    estimate ''Active Vs Placebo'' treat 1 -1;

    run;

    ```


