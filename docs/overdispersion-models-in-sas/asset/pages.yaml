    \ does not always provide an adequate adjustment for handling overdispersion on\
    \ multivariate vectors of counts. Morel and Koehler (1995) proposed a methodology\
    \ that allows for different levels of overdispersion (or underdispersion) in the\
    \ components of multinomial responses. This approach can be viewed as a generalization\
    \ of the single scale inflation based on the Pearson's Chi-square statistic. They\
    \ introduce category-specific scaling factors by replacing (7.16)\n\n```\n$Var\
    \ ((\\mathbf{T}_j) = m_j \\mathbf{C}(\\boldsymbol{\\pi}_j) \\mathbf{C}^T(\\boldsymbol{\\\
    pi}_j), \\quad (7.20)$\n```\n\nwhere $\\mathbf{\\Phi}$ is a diagonal matrix $\\\
    mathbf{\\Phi} = \\text{Diag}(\\phi_1, \\dots, \\phi_k)$ and $\\Delta(\\boldsymbol{\\\
    pi}_j) = \\mathbf{C}(\\boldsymbol{\\pi}_j)\\mathbf{C}^T(\\boldsymbol{\\pi}_j)$.\
    \ The case when $\\Phi$ is an unknown $d \\times d$ covariance could also be considered.\
    \ However, we will focus only on the case where $\\mathbf{\\Phi}$ is a diagonal\
    \ matrix and $\\mathbf{C}(\\boldsymbol{\\pi}_j)$ is the Cholesky decomposition\
    \ of $\\Delta(\\boldsymbol{\\pi}_j)$. This has a straightforward interpretation,\
    \ as we will see here. In the context of quasi-likelihoods, variance structure\
    \ (7.20) is a meaningful extension of the single scale inflation based on the\
