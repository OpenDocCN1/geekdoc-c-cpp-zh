  md: "# 218 Overdispersion Models in SAS\n\n```\nread all var(IP_1 IP_2) into pred_probs;\n\
    use birth_defects;\nread all var(zn2 cd2 cd3 zn2_cd3 zn2_cd2) into x_matrix;\n\
    use beta;\nread all var(estimate) into beta;\n\nm = obs_ts[,];\nn = nrow(obs_ts);\n\
    d = ncol(obs_ts) -- 1;\nk = ncol(x_matrix) ---\ndf = n - (d + k) -- Recall model\
    \ being fit is Cumulative\nLogits;\n\na = j(d,d,0);\n```\n\nGiven a vector of\
    \ probabilities p, p=p(1),p(2),...p(d)\nthis module computes the inverse of the\
    \ matrix C(p), say\nA(p)*C(p)' = Diag(p) - p*p'\nwhere C(p) is obtained using\
    \ Cholesky decomposition.\n\nThe matrix A(i,j) is given by\n\n```\nA(i,j) = {\
    \ q(i-1) / ( p(i) * q(i) ) * 0.5 if i=j\n          = p(i) / ( q(i-1) * q(i) )\
    \ * 0.5 if i>j\n          = 0 if i<j\n```\n\nSee: Tanabe and Sagae (1992)\n\n\
    ```\nstart_inv_cp(p,a,d);\nq = q(1) // {1 - cumsum(p));\n i=1 to d;\n  do il=i+1;\n\
    \    a[i,il] = sqrt(q[i]) / p[i] / q[il,1]);\n    if d > 1 then do;\n      do\
    \ j=1 to i-1;\n        a[i,j] = sqrt(p[i]) / q[i] / q[il,1]);\n      end;\n  \
    \  end;\n  end;\nfinish_inv_cp;\n```\n\nPart 1 Compute Phi;\n\n```\nScale = 0;\n\
    Phi = j(d,1,0);\nz1 = z1;\nz2 = z2;\ndo j=1 to n;\n  p = t(pred_probs[j]);\n \
    \ t = t(obs_ts[j,1:d]);\n  call inv_cp(p,a,d);\n  z = a * (t - m[j,1] * p) / sqrt(m[j,1]);\n\
    \  scale = scale + z * z;\n  phi = phi + z # z;\n  zl = zl || z[1,1];\n```\n\n\
