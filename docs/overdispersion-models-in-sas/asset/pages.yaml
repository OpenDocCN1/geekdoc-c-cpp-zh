  md: "# 206 Overdispersion Models in SAS\n\n```\n$L(\\\theta; t_1, t_2, \\dots, t_n)\
    \ = \\sum_{j=1}^{n} \\ln\\{Pr(T_j = t_j)\\}, \\quad (7.12)$\n```\n\nwhere $t_i$\
    \ is a realization of $T_i$. In Section 2.6 of Chapter 2 and Section 4.8 of Chapter\
    \ 4, the MLE of $\\theta$, say $\\hat{\\theta}$, can be found iteratively as\n\
    \n```\n$\\hat{\\theta}_{(S+1)} = \\hat{\\theta}_{(S)} + \\left[I(\\hat{\\theta}_{(S)})\\\
    right]^{-1} u(\\hat{\\theta}_{(S)}), \\quad (7.13)$\n```\n\nwhere $u(\\hat{\\\
    theta}_{(S)})$ is the r-dimensional column vector of first derivatives of the\
    \ log-likelihood function $u(\\\theta) = \\frac{\\partial L(\\\theta;t)}{\\partial\
    \ \\theta}$ evaluated at $\\theta=\\hat{\\theta}$, and $I(\\hat{\\theta}_{(S)})$\
    \ is the rxr Fisher information matrix $I = -E\\left[\\frac{\\partial^2 L(\\\t\
    heta;t)}{\\partial \\theta \\partial \\theta}, \\frac{\\partial^2 L(\\\theta;t)}{\\\
    partial \\theta \\'}\\right]$ evaluated at $\\theta=\\hat{\\theta}_{(S)}$. As\
    \ in previous chapters, $I(\\hat{\\theta}_{(S)})$ can be replaced by the Hessian\
    \ $H(\\hat{\\theta}_{(S)})$.\n\n# 7.4 An Example of a Generalized Logit Model\n\
    \nThe example is taken from Stokes, Davis, and Koch (2000) and is used in the\
    \ LOGISTIC and CATMOD to illustrate the fitting of a Generalized Logit Model.\n\
    \nThe background of this data set is given in the SAS documentation. We are using\
    \ this example from the SAS documentation, already familiar to many readers, as\
    \ an introduction to Generalized Logit Model estimation. Discussion of overdispersion\
    \ in this context will be introduced in subsequent sections. Over the course of\
    \ one school year, third-graders were exposed to three different styles of mathematics:\
    \ a self-paced computer-learning style, an approach, and a traditional class approach.\
    \ The students were asked which they prefer, and their preferences, classified\
    \ by the type of program they are in, a regular school day versus a regular day\
    \ supplemented with an afternoon school program. The data are displayed in Table\
    \ 7.1.\n\nTable 7.1: School Program Data\n\n| School | Program | Self | Team |\
    \ Class |\n|---|---|---|---|--|\n| 1 | Regular | 10 | 17 | 26 |\n| 1 | Afternoon\
    \ | 5 | 12 | 50 |\n| 2 | Regular | 21 | 17 | 26 |\n| 2 | Afternoon | 16 | 12 |\
    \ 36 |\n| 3 | Regular | 15 | 15 | 16 |\n| 3 | Afternoon | 12 | 12 | 20 |\n\nMorel,\
    \ Jorge, and Nagaraj Neeraj. Overdispersion Models in SAS®. Copyright ©2011, SAS\
    \ Institute Inc., Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional\
    \ SAS results, visit support.sas.com/publishing."
