  md: '# 184 Overdispersion Models in SAS


    ```

    $$Pr(Y_1 = y) \quad \text{if } y=0$$

    $$Pr(Y = y) = \begin{cases} \{1-Pr(Y_1 = 0)\} \frac{Pr(Y_2 = y)}{\{1-Pr(Y_2 =
    0)\}} & \text{if } y \ge 1 \end{cases} \quad (6.24)$

    ```


    Note that


    ```

    $\$\frac{Pr(Y_2 = y)}{\{1-Pr(Y_2 = 0)\}}, y=1, 2, ...$$

    ```


    represents the probability function of a zero-truncated $Y_2$ random variable
    which is denoted by $Y''_2$. Because $Y_i$ is essentially used to establish the
    event of crossing the hurdle, we can assume without loss of generality $Y_i \sim
    \text{Bernoulli}(1-\pi_i)$ so that $\pi_i = Pr(Y_i = 0)$. Some authors denote
    $\{1-Pr(Y_i = 0)\}$ as $(1-\pi_i)$. It is useful to rewrite the probability function
    as follows:


    ```

    $$Pr(Y = y) = Pr(Y = y | Y_i = 0)Pr(Y_i = 0) + Pr(Y = y | Y_i > 0)Pr(Y_i > 0)$$$

    ```


    The mean and variance of the random variable $Y$ with probability function (6.23)
    can be obtained by conditioning on $Y_i$ and noting that


    ```

    $$E(Y_i^*) = \frac{1}{1-\pi_i}E(Y_i) \text{ and } E(Y_i^{*2}) = \frac{1}{1-\pi_i}E(Y_i^2)$$

    ```


    Thus, the mean and variance of the random variable $Y$ with probability function


    ```

    $$E(Y) = \frac{1-\pi_i}{1-\pi_i}E(Y_i) \quad (6.25)$$

    ```


    and


    ```

    $$Var(Y) = E(Y^2)-\{E(Y)\}^2 = \left(\frac{1-\pi_i}{1-\pi_i}\right)E(Y_i^{*2})
    - \left(\frac{1-\pi_i}{1-\pi_i}\right)^2\{E(Y_i^*)\}^2$ \quad (6.26)$$

    ```'
