  md: "# Program 5.2: Computation of Dean (1979) GOF Score Statistic for the Toxoplasmosis\
    \ Example of Table 3.2\n\n```\n/*/*\nScore Test Statistic, Dean (1992)\nH0:Binomial\
    \ Distribution Versus\nH1:Beta-binomial or similar distribution such as\nRandom-clumped\
