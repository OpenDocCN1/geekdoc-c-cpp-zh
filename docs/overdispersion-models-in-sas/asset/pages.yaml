  md: "# Chapter 5 Goodness-of-fit Tests for Overdispersed Binomial Models 135\n\n\
    The results of the GOF tests are reported in Output 5.4. The GOF statistic under\
    \ the Beta-binomial model turned out to be 19.396. As pointed out earlier, the\
    \ degrees of freedom of our proposed GOF test between $\nu_1=(24-1)-(3+3)=17$\
    \ and $\nu_2=(24-1)=23$. The corresponding P-values under the Chi-square distributions\
    \ with 17 and 23 degrees of freedom are respectively, 0.31 for the lower bound\
    \ and 0.68 for the upper bound. We then conclude the Beta-binomial model with\
    \ linear predictors (5.8) and (5.9) provide an adequate fit to the Hiroshima chromosome\
    \ aberration data. On the other hand, the GOF Chi-square statistic turned out\
    \ to be 96.88 on (19-1)+(3+3)=12 degrees of freedom for the lower bound and (19-1)=18\
    \ degrees of freedom for the upper bound, indicating that the Random-clumped Binomial\
    \ distribution does not fit these data. The QQ-plots 5.2 corroborate\nthese\n\
