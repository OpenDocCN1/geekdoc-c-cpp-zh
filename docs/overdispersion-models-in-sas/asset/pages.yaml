- pgno: 318
  md: "# Overdispersion Models in SAS\n\nNote that incorporating overdispersion in\
    \ the model has had substantial impact on the standard errors; the P-values corresponding\
    \ to all terms in the model (except for the intercept) are above 5%. We will pick\
    \ this example again in the next section and perform a treatment placebo vis-a-vis\
    \ the average responses relative to the baseline.\n\n# 9.7 Ratio Estimation through\
    \ Poisson Regression and GEE\n\nRatios are estimators of the form $\\hat{R} =\
    \ \\frac{\tilde{Y}}{\tilde{Z}}$, where $\tilde{Y}$ and $\tilde{Z}$ are the sample\
    \ means of two random variables Y and Z. Since both numerator and denominator\
    \ are random variables, the asymptotic variance of the ratio estimator is usually\
    \ estimated by the Delta method (or Taylor expansion). Other variance estimation,\
    \ such as bootstrapping or jackknife, are also used in epidemiological studies,\
    \ special cases of ratio estimators when $Y_i$ are zero-one responses, and the\
    \ $Z$, measure the amount of time subjects are exposed to risk. It is well known\
    \ that the coefficients of a properly coded indicator variable in a logistic regression\
    \ model correspond to logarithms of odds. In this section, we make a similar observation\
    \ with respect to the logarithm of the ratio of the risks (relative risk) or the\
    \ ratio in the context of Poisson regression with logarithm link function. Unlike\
    \ the case of the logistic regression model, the inverse of the Fisher information\
    \ matrix of the Poisson model does not necessarily provide proper standard errors\
    \ for the estimated logarithms of risks or ratios. However, appropriate variance\
    \ estimates can be obtained by using the sandwich or empirical variance estimator\
    \ estimated from the GEE methodology. Morel and Neerchal (2008) have shown that\
    \ the expressions for the sandwich estimator for the GEE methodology correspond\
    \ to the usual variance estimates obtained by applying a Taylor expansion. We\
    \ will provide some examples using the GENMOD and GLIMMIX procedures.\n\nSuppose\
    \ $Y_1,Y_2,...,Y_n$ are distributed as independent Poisson random variables such\
    \ that $E(y_j) = \\mu_j = \\exp\\{\boldsymbol{\beta}^T x_j + \\ln(z_j)\\}, j=1,..,n$,\
    \ where $x_j$ and $\boldsymbol{\beta}$ are $k$-dimensional vectors of covariates\
    \ and unknown parameters, respectively, and $\\ln(z_j)$ is an offset variable.\
    \ We are assuming the logarithmic link function, the canonical link for the Poisson\
    \ distribution. The GEE estimator of $\boldsymbol{\beta}$, can be obtained by\
    \ solving the estimating equations\n\n```\n$$\\sum_{j=1}^{n} D_j^{-1}(y_j - \\\
    mu_j) = \\mathbf{0}$$\n```\n\nwhere $D_j$, represents the $k$ dimensional column\
    \ vector of first partial derivatives of $\\mu_j$ with respect to $\boldsymbol{\b\
    eta}$, and $\text{Var}(y_j) = \\mathbf{v}_j$. Under canonical link, the estimating\
    \ equations can be written as\n\n```\n$$\\sum_{j=1}^{n} x_j x_j^T \\sum_{j=1}^{n}\
    \ (y_j - \\mu_j) = \\mathbf{0}. \\quad (9.10)$$\n```\n\nMorel, Jorge, and Nagaraj\
    \ Neerchal. Overdispersion Models in SAS®. Copyright ©2011, SAS Institute Inc.,\
    \ Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 319
  md: "If the Poisson model holds equations (9.10) provide the maximum likelihood\
    \ estimator of $\\hat{\beta}$, say\nhat{\beta}$, with the variance estimate of\
    \ $\\hat{\beta}$ being\n\n```\n$$\\widehat{Var}(\\hat{\beta}) = \\left(\\sum_{j=1}^{n}\
    \ \\mathbf{x}_j \\hat{x}_j^T\\right)^{-1} = \\hat{\\mathbf{I}}_0^{-1}, \\quad\
    \ (9.11)$\n```\n\nwhere $\\hat{v}_j = \\mu_j = \\exp\\{\\mathbf{x}_j^T \\hat{\b\
    eta} + \\ln(z_j)\\}$. Furthermore, when the Poisson model assumption is not\n\
    satisfied, an estimator of the asymptotic variance of $\\hat{\beta}$ can be obtained\
    \ using the GEE\nmethodology, which is given by\n\n```\n$$\\widehat{Var}(\\hat{\b\
    eta}) = \\hat{\\mathbf{I}}_0^{-1} \\hat{\\mathbf{I}}_0^{-1}, \\quad (9.12)$\n\
    ```\n\nwhere $\\hat{\\mathbf{I}}_i = \\sum_{j=1}^{n_i} (y_j - \\mu_j)(y_j - \\\
    mu_j) \\mathbf{x}_j^T$.\n\nConsider now the following Poisson model for k independent\
    \ groups\n\n```\n$$E(y_{ij}) = \\exp\\{\\hat{\beta} + \\ln(z_{ij})\\}, i=1, 2,...,k,\
    \ j=1, 2,...,n_i. \\ \\quad (9.13)$\n```\n\nIt can be shown that the maximum likelihood\
    \ estimator of $\\beta_i$ is given by\n\n```\n$$\\hat{\\beta}_i = \\ln\\left(\\\
    frac{\\sum_{j=1}^{n_i} y_{ij}}{\\sum_{j=1}^{n_i} z_{ij}}\\right) = \\ln(\\hat{R}_i),\
    \ i=1, 2,...,k. \\ \\quad (9.14)$\n```\n\nFor the i-th group, it can be shown\
    \ that equation (9.10) becomes\n\n```\n$$\\exp(\\hat{\\beta}_i) \\left(\\sum_{j=1}^{n_i}\
    \ z_{ij}^{-1}\\right) \\left[\\sum_{j=1}^{n_i} (y_{ij}-z_{ij}) \\exp(\\hat{\\\
    beta}_i)\\right] = 0,$\n```\n\nwhere $\\exp(\\hat{\\beta}_i) = R_i$. Therefore,\
    \ the solution to this equation yields the explicit representation\ngiven above\
    \ in equation (9.14). Similarly, the sandwich estimator in equation (9.12) provides\
    \ the\nlarge sample size estimator of asymptotic variance of the logarithm of\
    \ the ratio of the means,\nnnamely,\n\n```\n$$\\widehat{Var}(\\hat{\\beta}_i)\
    \ = \\left(\\\\sum_{j=1}^{n_i} (y_{ij}/\\hat{R}_i z_{ij})^{-2}\\right)^2, \\quad\
    \ i=1, 2,...,k. \\ \\quad (9.15)$\n```\n\nMorel, Jorge, and Nagaraj Neerchal.\
    \ Overdispersion Models in SAS®. Copyright 2011, SAS Institute Inc., Cary,\nNorth\
    \ Carolina, USA: ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
