  md: "# Table 4.4: Skewness of the Beta-binomial and Random-clumped Binomial Distributions\
    \ for $\\pi=0.3$, $\rho=0.2,0.7$, and $m=4,20$\n\n| $\rho$ | m | Beta-binomial\
    \ | Random-clumped Binomial |\n|---|---|---|--|\n| 0.2 | 4 | 0.5076 | 0.5184 |\n\
    | | 20 | 0.3621 | 0.5029 |\n| 0.7 | 4 | 0.8256 | 0.8396 |\n| | 20 | 0.8204 | 0.8622\
    \ |\n\nThe coefficients of kurtosis (4.25) and (4.26) of the two distributions\
    \ become $\\{1+6r(1-\\pi)\\}/m\\pi(1-\\pi)+3$ when $\rho=0$, which is the coefficient\
    \ of kurtosis of the Binomial distribution. For the degenerate case $\rho=1$,\
    \ the coefficient of kurtosis of the Beta-binomial and the Random-clumped Binomial\
    \ distribution is $1/{\\pi(1-\\pi)\\}$. To meaningfully compare the kurtosis of\
    \ the Beta-binomial and Random-clumped Binomial distributions, we consider the\
    \ case $\\pi=0.5$, for which both distributions are symmetric. That is, the coefficient\
    \ of skewness is zero. For $\\pi=0.5$, the coefficients of kurtosis of the Beta-binomial\
    \ and Random-clumped distributions become\n\n```\nKurtosis(Beta-binomial when\
