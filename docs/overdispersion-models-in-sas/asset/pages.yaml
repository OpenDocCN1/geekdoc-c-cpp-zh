    The results of the omnibus GOF test under the Beta-binomial and Random-clumped
    Binomial distributions are reported in Table 5.4. The expected frequencies were
    rounded to the second decimal for simplicity. The algorithm discussed earlier
    started with 18 intervals. It ended with 10 intervals around the Random-clumped
    Binomial model and 9 intervals we combined the last two under the Random-clumped
    Binomial model so that Chi-square tests had the same degrees of freedom. The P-values
    of the GOF test under the Beta-binomial and Random-clumped Binomial distributions
    are 0.0014 and 0.2205. These tests are based on six degrees of freedom (number
    of intervals minus one, minus the number of parameters being estimated). The Random-clumped
    Binomial distribution fits the data well, while the Beta-binomial does not. The
    P-values were also estimated by bootstrapping the data parametrically with 20,000
    replications. They turned out to be 0.0012 and 0.2124, those obtained by using
    the Chi-square distribution with six degrees of freedom. The QQ-plots 5.1 are
    for the residuals obtained observed minus expected frequencies. It is clear from
    the plots that the fit for the Random-clumped Binomial distribution is better
    than the Beta-binomial distribution.


