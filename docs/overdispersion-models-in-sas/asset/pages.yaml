    # 10.5 Beta-binomial and Random-clumped Binomial GLOMMs


    In this section we present two GLOMMs, namely, the Beta-binomial and the Random-clumped
    Binomial with random effects. Recall the discussion on R-side and G-side models
    from Section 10.1. In a GLOMM, the overdispersion distributions are used in the
    R-side, while the random effects operate in the G-side. Intuitively, overdispersion
    models will try to capture the inherent lack of fit in the data relative to the
    Binomial (or Poisson in the case of counts data), while the random effects are
    used to capture the heterogeneity from subject to subject. Of course, in practice
    these two artifacts manifest as excess variance; therefore, the R-side and G-side
    effects end up competing with each other to grab parts of the excess variability
    observed in the data.


    The data used for the illustrative example here correspond to a 2x2 cross-over
    design with sequences AB and BA. Within each period, subjects provide repeated
    correlated Bernoulli outcomes following either the BB or the RCB distribution.
    We first address the Beta-binomial GLOMM. Applications of this GLOMM might be
    found in baby care studies where mothers are asked to use a particular type of
    diaper on their babies for one whole week. For the next week, they switch over
    to a different diaper product. The outcome of interest is whether or not leakage
    was observed for each diaper use. For simplicity, we will assume no period effect.


    Let y_{sijk} represent the k-th correlated Bernoulli outcome of the j-th subject
    using the i-th product in the s-th sequence, s = 1,2, i = 1,2, j = 1,2,...,n,
    k = 1,2,...,m_{sij}. Typical assignment of subjects in each sequence can be represented
    by'
