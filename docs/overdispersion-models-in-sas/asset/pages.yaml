  md: '# 4.6 An Example with Secondary Association of Chromosomes


    Skellam (1948) analyzed a data set on the secondary association of chromosomes
    in Brassica, a group of Old World temperate herbs of the mustard family with bearded
    cylindrical poles (similar to cabbage). To the best of our knowledge, this is
    the first example in the literature where the Beta-binomial distribution was formally
    used to model overdispersion. At meiosis, the special process of cell division,
    there are three pairs of bivalents. A bivalent is a structure consisting of two
    paired homologous chromosomes. The paired chromosomes in each bivalent may or
    not show association. For a nucleus $j=1,2,...,n$, let $T_j$ represent the total
    number of pairs of bivalents showing association. Each $T_j$ takes one of the
    values $\{0,1,2,3\}$. If the probability of association is constant for all nuclei
    and is the same for all pairs of bivalents, and they act independently of each
    other, the Binomial distribution would be appropriate for this problem. We will
    see that Binomial distribution does not fit the data and that overdispersion is
    present. Only the Beta-binomial, the Random-clumped Binomial and the Generalized
    Binomial with Additive Interaction provide reasonable fits to the chromosome data.


    Table 4.1: We fit five distributions to these data, namely, the Binomial, the
    Beta-binomial, the Random-clumped Binomial, the Zero-inflated Binomial, and the
    Generalized Binomial with Additive Interaction.


    # Table 4.1: Chromosome Data


    | Number of Associations | 0 | 1 | 2 | 3 |

    |---|---|---|---||

    | Frequency | 32 | 103 | 122 | 80 |


    Maximum likelihood estimates and their asymptotic estimated standard errors were
    obtained using the NLMIXED procedure. The programming statements are given in
    Program 4.1. Note that in this steps the SYMPUT function has assigned the total
    number of clusters "n" to a macro variable. The NLMIXED procedure requires the
    specification of log-likelihood function. A a "parms" statement, each call to
    the NLMIXED procedure is used for fitting each distribution. In this case, the
    user might specify initial values for the parameters being estimated. In this
    case, several points in grid within the parameter space are given the initial
    values. NLMIXED chooses the best values by evaluating the log-likelihood function
    over this grid. In anticipation of the computation of a Goodness-of-fit for each
    of the five distributions considered here, we have requested the estimated probabilities
    for t=0,1,2,3. These estimated probabilities have been multiplied by the total
    number of clusters n=337 in order to obtain the predicted (expected) frequencies.
    These results have been put out in the temporary SAS files "pred1" through "pred5".'
