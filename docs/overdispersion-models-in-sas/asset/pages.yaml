  md: "# Chapter 3 Quasi-likelihood Functions 69\n\nThe estimated fractures-per-year\
    \ rates are $e^{-0.0449} = 0.9561$ for the placebo group and\nne^{-0.0449-0.9000}\
    \ = 0.3887$ for the bisphosphonate group, indicating a highly significant\n\n\
    (P-value = 0.0025) reduction in the number of vertebral fractures in the bisphosphonate\
    \ group as compared with the placebo. The it estimated fractures per-year are\
    \ of the form\n\n```\n$$\\left(\\sum_{j=1}^{n_i} y_{ij} / \\sum_{j=1}^{n_i} z_{ij}\\\
    right), i = 1, 2.$\n```\n\nThe Rate Ratio is\n\n```\n$RR = \\left(\\sum_{j=1}^{n_i}\
    \ y_{ij} / \\sum_{j=1}^{n_i} z_{ij}\\right) \\cdot \\left(\\sum_{j=1}^{n_i} y_{2j}\
    \ / \\sum_{j=1}^{n_i} z_{2j}\\right)$\n```\n\nwhich in this example turns out\
    \ to be 0.4066. This result indicates that there is approximately 41% reduction\
    \ in the estimated fractures-per-year in the bisphosphonate group relative to\
    \ the placebo group. An approximate 95% confidence interval for the Rate Ratio\
    \ is (0.2270, 0.7283). This confidence interval was obtained by applying the inverse\
    \ link function, which is the exponential function to the bounds of the model\
    \ scale confidence interval ($-1.4829, -0.3170$). The square root of the inflation\
    \ factor, as estimated by the Pearson’s Chi-square statistic overid its degrees\
    \ of freedom, was 1.3157. All standard errors obtained from the maximum likelihood\
    \ estimation were inflated by this factor.\n\n# Table 3.6: Estimates, Standard\
    \ Errors, Chi-squares, and P-values for Poisson Extra Variation Model of Vertebral\
    \ Fracture Data\n\n| Parameter | Estimate | Standard Error | Chi-square | P-value\
    \ |\n|---| Intercept | -0.0449 | 0.1632 | 0.08 | 0.7833 |\n| Bisphosphonate |\
    \ -0.9000 | 0.2974 | 9.16 | 0.0025 |\n| Scale ($\\sqrt{\\}$) | 1.3157 | | | |\n\
    \n# 3.7 Williams’ Quasi-likelihood Model\n\nConsider the following logistic regression\
    \ model with overdispersion\n\n```\n$E(T) = \\mu_i, \\text{Var}(T) = \\mu_i\\\
    pi_i\\{1+(1-\\pi_i)\\theta\\},$ and $\\log(\\frac{\\pi_i}{1-\\pi_i}) = x_i\\beta.$\n\
    ```\n\nWilliams (1982) proposed an iterative weighted least-squares procedure\
    \ similar to that in equation (2.23) of Chapter 2 in order to estimate $\beta$\
    \ and $\theta$ simultaneously. In Williams’ paper the intra-cluster correlation\
    \ is denoted by $\\phi$. To avoid confusion with the scale (dispersion) parameter"
