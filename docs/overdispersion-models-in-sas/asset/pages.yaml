- pgno: 174
  md: "The Negative-binomial corresponds to a Poisson-gamma mixture model where the\
    \ mixing distribution is the Gamma, the conjugate prior for the Poisson distribution.\
    \ There is an analogy between this model and the Beta-binomial in the sense that\
    \ the latter arises by a similar mechanism, by obtaining the unconditional distribution\
    \ of a Binomial when the probability of success varies according to a Beta distribution.\n\
    \nUnder the parameterization $\\mu = \\alpha\beta$ and $\\kappa = \\frac{1}{\\\
    alpha}$, the unconditional probability function of $Y_j$ is given by\n\n```\n\
    Pr(Y_j = y) = \\frac{\\Gamma(y+\\frac{1}{\\kappa})}{\\Gamma(\\frac{1}{\\kappa})\\\
    Gamma(y+1)} (\\frac{\\kappa\\mu}{1+\\kappa\\mu})^y, y=0,1,... (6.6)\n```\n\nThis\
    \ parameterization yields the following well-known representation of the first\
    \ two moments\n\n```\nE(Y_j) = \\mu (6.7)\n```\n\nand\n\n```\nVar(Y_j) = \\mu\
    \ + \\kappa\\mu^2 = \\mu(1+\\kappa\\mu) (6.8)\n```\n\nCameron and Treiped (1986)\
    \ consider a general class of NB models with mean as in (6.7) and variance function\
    \ $\\mu+\\kappa\\mu^p$, $-\\infty < p < \\infty$. The case $p=2$, which corresponds\
    \ to a quadratic function on the mean $\\mu$, provides the standard formulation\
    \ (6.8) of the NB model and corresponds to the common characterization of overdispersion\
    \ relative to the Poisson distribution variance function described in equation\
    \ (1.6) of Section 1.3. The case $p=1$ provides the variance function of overdispersion\
    \ for Poisson-like counts considered by Dean (1992). The GENMOD, GLIMMIX, and\
    \ CONTREG provide maximum likelihood estimators of $\\mu$ and $\\kappa$ for the\
    \ case of $p=2$. CONTREG also provides the Negative-binomial model with a linear\
    \ variance function $\\mu(1+\\kappa)$. The parameter $\\kappa$ is known as the\
    \ \"dispersion parameter\". Program 6 provides the programming statements for\
    \ generating the probability functions of the Poisson and NB distributions with\
    \ the same mean $\\mu$, and associated variances $\\mu$ and $\\mu(1+\\kappa\\\
    mu)$, respectively. In the example, the values of $\\mu$ and $\\kappa$ are, 10\
    \ and 0.2. Thus, for both the variance is 10, and the variance of Negative-binomial\
    \ is 30, which is three times the variance of the Poisson distribution. The plots\
    \ of the two distributions are depicted in Output 6.1. A program for the generation\
    \ of Negative-binomial numbers is provided in Appendix 6.\n\nJoe and Zhou (2005)\
    \ proposed a Generalized Poisson distribution which provides an alternative to\
