    # 1.1 A Simple Introductory phenoin


    The anticonvulsant is known to be teratogenic on the prenatal development of inbred
    mice. Hartfields et al. (1990) conducted a completely randomized experiment with
    81 pregnant mice to investigate the potential synergistic effect of phenytoin
    (PHT) and trichloropropene oxide (TCPO). The study was set up as a 2x2 factorial:
    PHT and TCPO were the main factors. PHT was administered at the levels 0 mg/kg
    and 60 mg/kg, and TCPO was administered at 0 mg/kg and 100 mg/kg. The presence
    or absence of ossification in the phalanges on the right and left forepaws of
    the fetuses is a measure of the teratogenic effect of the substances under study.
    In some phalanges the ossification did not occur at all; in others, the ossification
    was almost complete. We selected the middle phalanges because they yield around
    a 50% chance of ossification in the control groups. To simplify this part of our
    study further, we have analyzed only the response on the left third phalanx. Table
    1.1 depicts the number of fetuses showing ossification in the middle third phalanx
    of the left paw out of the total number of fetuses in 11 mice that had been treated
    with both PHT and TCPO. This example is used here in a simple form to introduce
    the concept of overdispersion and will be revisited in greater depth in subsequent
    chapters.


