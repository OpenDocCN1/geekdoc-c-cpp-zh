- pgno: 64
  md: "chapters. We look at five examples which increase in complexity. We introduce\
    \ the Quasi-likelihood methodology using these illustrative examples rather than\
    \ focusing on the theory.\n\n# 3.2 Quasi-likelihood functions\n\nThere are several\
    \ approaches for modeling data exhibiting overdispersion. A widely used method\
    \ is the one known as Quasi-likelihood. A quasi-likelihood function is defined\
    \ without the knowledge of the likelihood function but the relation between the\
    \ mean and the variance of each observation for which the quasi-likelihood function\
    \ is being constructed. It can be seen that for a typical member of the exponential\
    \ family, the first derivative of the log-likelihood function with respect to\
    \ the mean and variance of the distribution. Quasi-likelihood function is specified\
    \ in terms of its derivatives conforming to structure which is specified by the\
    \ overdispersion model. Parameter estimates are obtained by solving the score\
    \ function, the most iteratively by methods such as Newton-Raphson. We will see\
    \ other estimation methods available in the GLIMMIX procedure. Cox and Snell (1989)\
    \ pointed out that Quasi-likelihood estimation is used when the interest is on\
    \ regression likelihood model where overdispersion occurs by inflation or deflation\
    \ of variance by a constant factor. It can be viewed as a two-step procedure:\
    \ first, estimate the systematic structure of the model then inflate deflate the\
    \ variances by a suitable constant. It is interesting to note that for a one-parameter\
    \ exponential family, the log likelihood is the same as the quasi-likelihood.\n\
    \nLet $Y_j, j=1,...,n$ be independent random variables such that $E(Y_j) = \\\
    mu_j$ and $V(Y_j) = \\phi v(\\mu_j)$, where $\\phi$ may be unknown and $v(\\mu_j)$\
    \ is a known function of $\\mu_j$. As with GLMs, the mean $\\mu_j$ depends on\
    \ a k-dimensional row of covariates $x_j$ and a k-dimensional vector of parameters\
    \ $\beta$, through a twice differentiable smooth function $g(\\mu_j)$ so that\n\
    \n```\n$g(\\mu_j) = \\mathbf{x}_j\\beta = \\sum_{i=1}^{k} x_{ji}\\beta_i.$\n```\n\
    \nThe function $g(\\cdot)$, is the link function. Define $Q(Y_j, \\mu_j)$ as\n\
    \n```\n$$\\frac{\\partial Q(Y_j,\\mu_j)}{\\partial \\mu_j} = \\frac{Y_j - \\mu_j}{\\\
    phi v(\\mu_j)}$\n```\n\nNote that in (3.2), $Q(y,\\mu)$ is such that its first\
    \ derivative resembles the log-likelihood function of distributions in the exponential\
    \ family. $Q(y,\\mu) = \\int^{\\frac{y-t}{\\phi v(t)}}_{\\mu} t dt + C$. The quantity\n\
    \n```\n$Q(\\mu) = \\sum_{j=1}^{n} Q(Y_j,\\mu_j).$\n```\n\nMorel, Jorge, and Nagaraj\
    \ Neeraj. Overdispersion Models in SAS*. Copyright © 2011, SAS Institute Inc.,\
    \ Cary, North Carolina, USA: ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Chapter 3 Quasi-likelihood Functions 53\n\nis known as the **quasi-likelihood**\
    \ (or more precisely the **log-quasi likelihood**) based on the data $y = (Y_1,\
    \ Y_2, \\dots, Y_n)'$ and the mean vector $\\mu = (\\mu_1, \\mu, \\dots, \\mu_n)'$.\
    \ The quasi-likelihood estimate of $\\beta$, say $\\hat{\beta}$, is obtained by\
    \ solving (3.3) with respect to $\\beta$, that is,\n\n```\nU(\\\beta) = \\frac{\\\
    hat{Q}(y, \\mu)}{\\hat{\\beta}} = 0. (3.4)\n```\n\nThe function **U(\\\beta)**\
    \ in (3.4) is the **quasi-score function**. By (3.2) equation (3.4) can be written\
    \ as\n\n```\n\\sum_{j=1}^n \\frac{Y_j - \\mu_j}{\\phi(\\mu_j)}} \\frac{\\hat{\\\
    mu}_j}{\\hat{\\beta}} = 0. (3.5)\n```\n\nThe solution of (3.5) with respect to\
    \ $\\beta$ does not require knowledge of $\\phi$ since $\\phi$ is a scale parameter\
    \ and cancels out. Therefore, these equations reduce to\n\n```\n\\sum_{j=1}^n\
    \ \\frac{Y_j - \\mu_j}{\\phi(\\mu_j)}} \\frac{\\hat{\\mu}_j}{\\hat{\\beta}} =\
    \ 0,\n```\n\nwhich are, from a computational point of view, if the $Y_j$'s belonged\
    \ to one of the members of the exponential family for which $\\phi=1$. As in the\
    \ case with GLMs, the solution to (3.5) is equivalent to the iterative weighted\
    \ least-squares procedure in Section 2.6. With $\\hat{\beta}$ in hand, a moment\
    \ estimator of the dispersion parameter $\\phi$ can be computed. Two commonly\
    \ used estimates of $\\phi$ are obtained by normalizing the Pearson $X^2$ or the\
    \ Deviance, by dividing its degrees of freedom. Other moment estimators are also\
    \ possible.\n\nUnder mild regularity conditions, the asymptotic variance of the\
    \ vector of parameter estimates is given by\n\n```\nVar(\\\\hat{\\beta}) \\equiv\
    \ \\phi(\\mathbfmathbf{D}'\\mathbf{V}^{-1}\\mathbf{D})^{-1}. (3.6)\n```\n\nwhere\
    \ **\\mathbf{D}** is the nx matrix of first derivatives\n\n```\n\\mathbf{D} =\
    \ (\\frac{\\hat{\\mu}_1}{\\hat{\\beta}}, \\frac{\\hat{\\mu}_2}{\\hat{\\beta}},\
    \ \\dots, \\frac{\\hat{\\mu}_n}{\\hat{\\beta}})^' \\equiv (\\mathbf{d}_1, \\mathbf{d}_2,\
    \ \\dots, \\mathbf{d}_n)'\n```\n\nand **\\V** is the nxn diagonal matrix of variance\
    \ functions\n\n```\n\\mathbf{V} = \\mathbf{Diag}(v(\\mu_1), v(\\mu_2), \\dots,\
    \ v(\\mu_n)) \\equiv \\mathbf{Diag}(v_1, v_2, \\dots, v_n).\n```"
