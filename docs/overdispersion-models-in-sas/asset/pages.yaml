    lambda_j$) | Identity: $\\lambda_j = \\mathbf{x}\beta$ | Identity: $\\lambda_j\
    \ = \\mathbf{x}\beta$ |\n\nHere, $\\Phi(\\cdot)$, represents the cumulative probability\
    \ function of a standard Normal distribution,\n\ngiven by, $\\Phi(x) = \\frac{1}{\\\
    sqrt{2\\pi}} \\int \\exp\\left(-\\frac{Z^2}{2}\right) dZ$.\n\n# 2.5 The Deviance\
    \ and the Pearson Chi-Square Statistic\n\nIn linear regression models, goodness-of-fit\
    \ is usually measured by the sum of squared residuals. Nested models are obtained\
    \ by taking a subset of the predictor variables from a larger (full) model. Reduced\
    \ models can be compared to full models using the sum of squared residuals, and\
    \ F-tests can be constructed using the sum of squared residuals from the full\
    \ and reduced models. In GLM, the sum of squared residuals may not always be meaningful,\
    \ especially when the response variables are discrete. Therefore, alternative\
    \ ways of examining the goodness-of-fit are desired. By computing the statistic\
    \ known as Deviance, which was originally proposed by Nelder and Woodburn (1971).\
    \ They noted that for any set of two extreme models are conceivable: namely, the\
    \ minimal model and the saturated model. The minimal model contains one single\
    \ parameter (the mean), whereas the saturated model has a parameter for each observation.\
    \ The minimal model is too simple. On the other hand, the saturated model is uninformative\
    \ in the sense that it provides a perfect fit estimating the maximum allowable\
    \ number of parameters. Although saturated models do not summarize the data, they\
    \ are useful in practice. The most desirable model is likely to be between the\
    \ minimal and saturated models. The deviance is in essence measure of the distance\
    \ between the model and the saturated model, measured in terms of the log-likelihood\
    \ function. McCullagh and Nelder (1989) point out that differences in deviances\
    \ for nested models can be approximated by Chi-square distributions with degrees\
    \ of freedom by the parameters in which two models are compared.\n\nFor a independent\
    \ binomial random variables $T_j, j=1,2,...,n, T \\sim \\text{Binomial}(\\pi_j,\
    \ m_j)$, consider $t_j$ as a Binomial of $T_j$. Note the slight departure from\
    \ earlier notation by denoting the response variable with the letter $T$ that\
    \ is Binomial. We will denote Poisson and"
