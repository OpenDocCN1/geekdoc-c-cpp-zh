  md: "# Chapter 7 Likelihood Models for Overdispersed Multinomial Responses 203\n\
    \nthe general case, $\\sum_{i=1}^{d+1} T_i = m$ and $\\sum_{i=1}^{d+1} \\pi_i\
    \ = 1$, can safely reduce the dimensionality of $\\mathbf{T}$ and $\boldsymbol{\\\
    pi}$\n\nby deleting their respective elements. Then, $\\mathbf{T} = (T_1, T_2,\
    \ \\dots, T_d)$, $\boldsymbol{\\pi} = (\\pi_1, \\pi_2, \\dots, \\pi_d)$ and a\
    \ realization of $\\mathbf{T}$ as $\\mathbf{t} = (t_1, t_2, \\dots, t_d)$. Thus,\
    \ without loss of generality, we say that $\\mathbf{T}$ has a Multinomial distribution\
    \ with parameters $(\boldsymbol{\\pi}; m)$ with joint probability function as\
    \ equation\n\n(7.1) $t_d = m - \\sum_{i=1}^d t_i$, and $\\pi_d = 1 - \\sum_{i=1}^d\
    \ \\pi_i$. In subsequent applications of the Multinomial distribution, we will\
    \ use the form $\\mathbf{t}$ and $\\mathbf{m}$ where the categories were already\
    \ removed. We will write $\\mathbf{T} \\sim \text{Multinomial}(\boldsymbol{\\\
    pi}; m)$ to denote that the vector of counts $\\mathbf{T}$ is distributed as a\
    \ Multinomial distribution with $m$ trials and the probability of success $\b\
    oldsymbol{\\pi}$. The mean and variance (variance-covariance matrix) of $\\mathbf{T}$\
    \ are, respectively\n\n$E(\\mathbf{T}) = m\boldsymbol{\\pi} \\quad (7.2)$\n\n\
    and\n\n$Var(\\mathbf{T}) = m\boldsymbol{\\Delta}(\boldsymbol{\\pi}), \\quad (7.3)$\n\
    \nwhere $\boldsymbol{\\Delta}(\boldsymbol{\\pi}) = \text{Diag}(\boldsymbol{\\\
    pi}) - \boldsymbol{\\pi}\boldsymbol{\\pi}'$. Note that $\boldsymbol{\\Delta}(\b\
    oldsymbol{\\pi})$ is a $d \times d$ variance-covariance matrix of full rank where\
    \ its $i$-th diagonal element is $\\pi_i(1-\\pi_i)$ and off-diagonal elements\
    \ are $-\\pi_i\\pi_j$, for $i \neq j$. The Multinomial distribution enjoys numerous\
    \ properties. For example, all its marginals and conditionals are distributed\
    \ as Multinomial distributions of appropriate dimensions. In particular, one-dimensional\
    \ marginals and conditionals are distributed as Binomial. A complete discussion\
    \ of the Multinomial distribution and its properties, the reader is referred to\
    \ Johnson, Kotz, and Balakrishnan (1997).\n\n# 7.3 Link Functions and Maximum\
    \ Likelihood Estimation\n\nSuppose that $\\mathbf{T}_1, \\mathbf{T}_2, \\dots,\
    \ \\mathbf{T}_n$ represent a sequence of $d$-dimensional independent Multinomial\
    \ random vectors, for each $j=1, 2, \\dots, n$,\n\n$E(\\mathbf{T}_j) = m_j\boldsymbol{\\\
    pi}_j \\quad (7.4)$\n\nand\n\n$Var(\\mathbf{T}_j) = m_j\boldsymbol{\\Delta}(\b\
    oldsymbol{\\pi}_j) \\quad (7.5)$\n\nwhere $\boldsymbol{\\Delta}(\boldsymbol{\\\
    pi}) = \text{Diag}(\boldsymbol{\\pi}) - \boldsymbol{\\pi}\boldsymbol{\\pi}'$.\
    \ Associated with each $\boldsymbol{\\pi}_j$ is a $k$-dimensional known vector\
    \ of explanatory variables $\\mathbf{x}_j$ such that the mean $\boldsymbol{\\\
    pi}_j$ depends on an $r$-dimensional unknown vector $\boldsymbol{\theta}$ through\
    \ a smooth function $\\mathbf{g}^{-1}(\\mathbf{x}_j, \boldsymbol{\theta})$ defined\
    \ as"
