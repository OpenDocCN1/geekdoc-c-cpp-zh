    Appendix 6.2: Generation of Data under the Poisson Hurdle and Negative-

    Hurdle Models...............................................................................................................197


    # 6.1 Introduction


    Historically, the standard model for count data is the Poisson distribution. There
    are several characterizations of the Poisson distribution. Cameron and Trivedi
    (1998, pp. 4-8) provide four of those characterizations: the law of rare events,
    the Poisson counting process with waiting times between events, and the Poisson-stopped
    binomial. Since some of the assumptions behind these characterizations can be
    violated easily in practice, it is difficult to find real-life Poisson sets. Hilbert
    (2007, pp. 8-13) describes several possible violations of distributional assumptions.
    The violation of these assumptions may lead to the presence of overdispersion.
    Thus, overdispersion seems to be in the vast majority of Poisson data. In this
    chapter we will cover widely used likelihood models for overdispersion in count
    responses, namely, the Negative-binomial, the Zero-inflated Poisson (ZIP), the
    Zero-inflated Negative-binomial (ZINB), and a few Hurdle models. Several'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'are available in SAS to handle these models. Among them the SAS/STAT procedures
    GENMOD, GLIMMIX, and NLMIXED, as well as the COUNTREG procedure available in SAS/ETS
    software. The reader may recall that the overdispersion models for binomial data
    can be thought of as generalizations of the Binomial distribution. Similarly,
    for overdispersed count data are hierarchical, relative to the Poisson distribution.
    The diagram below provides a view of the distributions covered in Chapter 4, and
    the ones to be covered in this chapter (see Chapter 1, Appendix 1.1 for a complete
    depiction).


    # 1) Binomial Distribution


    ![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_172_0.png)


    # 2) Poisson Distribution


    # 6.2 The Negative-binomial Distribution


    The benchmark model to account for overdispersion on count responses is the Negative-binomial
    (NB) distribution. This distribution can be derived in several different ways
    and has been studied extensively over several centuries (Johnson, Kotz, and Kemp
    1992, Section 3, Chapter 5). The most well-known interpretation of the NB is that
    it is the distribution of the number of failures before a pre-determined number
    of success occur in a sequence of Bernoulli trials. However, in the context of
    overdispersion, its ability to account for the lack of equidispersion (equality
    of the conditional mean and variance) in clustered data with count responses is
    of primary interest. We now present a derivation of the Negative-binomial distribution
    which more directly relates to overdispersion. We first assume that for a given
    cluster, the conditional distribution of the number of counts (on the rate parameter)
    is Poisson. Further, hierarchically, the rates vary according to a Gamma distribution.
    Then, it turns that'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Chapter 6 Likelihood Models for Overdispersed Count Responses 161


    the unconditional distribution of counts is Nb. Toward that end, Y$_j$, j=1,2,...,n
    be independently distributed random variables such that Y$_j$ \sim \text{Poisson}(u_j)$.
    The probability function of Y$_j$ is


    ```

    $$\Pr(Y_j|u_j) = \frac{e^{-u_j} u_j^{Y_j}}{\Gamma(Y_j+1)}$$\quad (6.1)

    ```


    where $\Gamma(\cdot)$ is the gamma function, for integer arguments $y+1$ becomes
    $y!$. Let us assume that the rate-parameters $u_j$, $j=1,2,...,n$, are independent
    and identically distributed as Gamma($\alpha$,$\beta$). That is, the density function
    of each $u_j$ is


    ```

    $f(u) = \frac{u^{\alpha-1}}{\Gamma(\alpha)\beta^\alpha}} e^{-\frac{u}{\beta}},
    u > 0$\quad (6.2)

    ```


    where $\alpha$ is the shape parameter and $\beta$ the scale parameter.

    The mean and the variance of the gamma distribution under the above parameterization
    are


    ```

    $E(U) = \alpha\beta$$

    ```


    and


    ```

    $$\text{Var}(U) = \alpha\beta^2.$

    ```


    It can be shown (Johnson, Kotz, and Kemp 1992, p. 204) that the unconditional
    distribution of Y$_j$ is given by


    ```

    $$\Pr(Y_j=y) = \frac{\Gamma(y+\alpha)}{\Gamma(\alpha)\Gamma(y+1)} \left(\frac{1}{1+\beta}\right)^\alpha
    \left(\frac{\beta}{1+\beta}\right)^y, y=0,1,...$\quad (6.3)

    ```


    which can be easily recognized as Negative-binomial($\alpha$,$\beta$) with probability
    of success $\frac{\beta}{1+\beta}$.


    It follows that the unconditional mean and variance of Y$_j$ are given by


    ```

    $E(Y_j) = \alpha\beta$$\quad (6.4)

    ```


    and


    ```

    $$\text{Var}(Y_j) = \alpha\beta(1+\beta).$\quad (6.5)

    ```'
