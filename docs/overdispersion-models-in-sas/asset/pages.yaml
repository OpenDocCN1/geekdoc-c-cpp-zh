- pgno: 177
  md: '# Chapter 6 Likelihood Models for Overdispersed Count Responses 165


    $0 \le \omega \le 1$ and $f(y;alpha_1, \alpha_2, \dots, \alpha_s)$ may be any
    discrete distribution defined over the domain $y=0, 1, \dots,$ with parameters
    $(\alpha_1, \alpha_2, \dots, \alpha_s)$. While comparing the presentation here
    with Cohen''s original work, it is important to note a crucial change in notation.
    Note that from equation (6.9) the probability of $y=0$ is $\omega(1-\omega)f(0)$,
    whereas in Cohen''s notation, the same probability is given by $(1-\omega)+\omega
    f(0)$. We follow the parameterization in Section 2.2, Chapter 8 of Johnson et
    al. (1992), which is consistent with the notations used in GENMOD and COUNTREG.
    In Cohen''s paper, $\omega$ represented "the proportion of the infected or susceptible
    group in the population," which was associated with the probability function $f(.)$.
    Our parameterization permits us to interpret $\omega$ as the Zero-inflation Probability
    measure. This family of distributions allows one to model an excess of zeros and
    is readily applicable to both the Poisson and the Negative-binomial distributions.
    It is possible to take $\omega$ negative, provided that


    ```

    $$\omega \ge \frac{-f(0)}{1-f(0)}$ \quad (6.10)$

    ```


    In such a case the proportion of zeros associated with $f(y;alpha_1, \alpha_2,
    \dots, \alpha_s)$ are reduced.


    If $f(y;mu)$ corresponds to the probability function of a Poisson distribution
    with parameter $\mu$, it follows from (6.9) that $Y$ is a Zero-inflated Poisson
    distribution (ZIP) with parameters $(\mu, \omega)$, its probability function is


    ```

    $Pr(Y=y) = \omega I(y=0)+(1-\omega)\frac{e^{-\mu y}}{\Gamma(y+1)}, y=0,1,\dots$
    \quad (6.11)$

    ```


    $I(.)$ is an indicator function. The reader should note that there are two sources
    of zeros in (6.10), arising from a zero-degeneration distribution with probability
    $\omega$, and the other one from a Poisson($\mu$) with probability $(1-\omega)$.
    Note that, $Pr(Y=0)=\omega+(1-\\omega)e^{-\mu}$, which is always greater than
    or equal to $e^{-\mu}$ for $\omega>0$. Similarly, for $\mu<0$, as in (6.10), with
    probability of observing zero under the ZIP model will be smaller than the probability
    of zero under the Poisson distribution. The mean and variance of the ZIP distribution
    can be shown to be


    ```

    $E(Y) = (1-\omega)(\mu+\mu^2)$ \quad (6.12)$

    ```


    and


    ```

    $Var(Y) = (1-\omega)(\mu+\mu^2)$ \quad (6.13)$

    ```


    Recall that the standard deviation for count data is the Poisson distribution,
    and that overdispersion is present when the variance of the Poisson-type random
    variable is larger than that. From $Var(Y)=(1-\omega)(\mu+\mu^2) > (1-\omega)E(Y)$,
    there is an excess of zeros in the Poisson'
