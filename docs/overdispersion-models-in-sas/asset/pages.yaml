    The results of the ESTIMATE statements are shown in the second half of Output
    9.8. Table 9.9 provides the estimated rates along with their standard errors for
    the probabilities associated with the responses "Medium" and "High". Recall that
    the first category was established as the reference. Note that the overall hypothesis
    of homogeneity is highly significant (P-value=0.0048). The results of test (9.34),
    in Output 9.8 as P12 vs P22, is 0.4015 with a standard error of 0.0163. This result
    is statistically significant (P-value=0.0408). Thus, we conclude $\pi_{12} > \pi_{23}$.
    The corresponding odds-ratio is 1.49. The result of second test (9.35), as listed
    "P13 vs P23," is -1.1838. Its standard error is 0.4771. The resulting P-value
    is 0.0131, which is statistically significant. Thus, we conclude $\pi_{13} < \pi_{23}$.
    The corresponding odds-ratio is 0.31. One final comment regarding Generalized
    Logistic model (9.36); the test of homogeneity as well as the estimated rates
    and odds-ratios can be adjusted by adjuster factors such as gender, age, etc.
    We have opted to illustrate the test of homogeneity without any adjustments. For
    a one-way table, the test of homogeneity reduces to the test of the hypothesis
    that the probabilities are all equal


    # Table 9.9: Estimated (and Standard Errors) of the Product Rates for Responses
    "Medium" and "High."


    | Product | Medium | High |

    |---|---||}{

    | 1 | 0.1036 (0.01167) | 0.0064 (0.0023) |

    | 2 | 0.0707 (0.0099) | 0.0214 (0.0064) |


    Rao and Scott (1981) proposed a test of homogeneity where the usual Chi-square
    statistic is defeated (overdispersion) by an estimate of the design effect. In
    contingency tables the test of homogeneity is the same as that for test if there
    is any association between the row and column variables. This test is available
    in the SURVEYFREQ procedure. The programming statements in the continuation of
    Program 9.7 show how to request Rao and Scott''s Chi-square test. Note that subjects
    are treated as Primary Sampling Units (clusters). Excerpts of output SURVEYFREQ
    are shown in the continuation of Output 9.7. The value of the naive Chi-square
    statistic is 20.2281. The estimate of the design effect is 1.765. Thus, the value
    of $20.2281/1.769=11.4313$. Under the null hypothesis, this statistic is asymptotically
    distributed as a Chi-square with two degrees of freedom. The corresponding P-value
    is 0.003. Thus, we conclude that the distributions of the two products are different.


    # Program 9.7: Continuation


