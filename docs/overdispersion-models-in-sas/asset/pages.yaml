- pgno: 386
  md: 'to understand. The extension essentially consists of properly embedding random
    effects into the Generalized Linear Overdispersion Models (GLOM) discussed in
    Chapters 4, 6, and 7. We also discussed four examples with generated data to cover
    the Beta-binomial, Random-clumped Binomial, Zero-inflated Poisson, and Zero-inflated
    Negative-binomial GLOMMs. Examples of a Poisson and a Negative-


    binomial GLMM, and a Zero-inflated Poisson and a Poisson Hurdle GLOM, are all
    found in Chapter 15 of Littell et al. (2006). An example of a Generalized Poisson
    GLOM is discussed in the SAS documentation for the GLMMIX procedure. The Generalized
    Poisson can be motivated as a Poisson mixture and hence provides an alternative
    to the Negative-binomial distribution (see Joe and Zhu, 2005). Further, fitting
    a Dirichlet-multinomial or a Random-clumped Multinomial GLOM might pose complex
    computational issues. We expect to provide guidance on these Multinomial GLOMMs
    in a future edition.'
