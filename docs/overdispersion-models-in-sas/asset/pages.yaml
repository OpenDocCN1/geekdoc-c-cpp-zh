    ```\n\nand\n\n```\nKurtosis(Random-clumped when $\\pi=0.5$) = \\frac{(3m-2)+\\\
    {2(m-1)(3m-4)\\rho^2+(m-1)(m-2)(m-4)\\rho^4}{m[1+(m-1)\\rho^2]\\^2}$ (4.28)\n\
    ```\n\nIt can be shown that for $\\pi=0.5$, the coefficient of kurtosis of the\
    \ Random-clumped Binomial is less than that of the Beta-binomial $\rho<1$. The\
