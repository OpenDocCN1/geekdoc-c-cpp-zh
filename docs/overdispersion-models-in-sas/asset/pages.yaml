- pgno: 329
  md: "# 9.8 The GEE Methodology for Multinomial Responses\n\nConsider a situation\
    \ where n are clusters. As pointed out earlier chapters, these clusters can be,\
    \ for example, households, where members of a household are the elemental units;\
    \ pregnant rates, which will the fetuses within a single rate are the elemental\
    \ units; where members of a support group are the elemental units; and so on.\
    \ In a longitudinal study involving repeated measures, each individual constitutes\
    \ a cluster, and the repeated measurements are the elemental units. Let $m_j$\
    \ represent the number of elemental units in the $j^{th}$ cluster, $j=1,2,...,m_j$.\
    \ Let $y_j$ denote a $(d+1)$-dimensional column vectors,\n\n```\n$y_j^* = (y_{j1}^*,\
    \ \\dots, y_{jd}, y_{j,d+1})$. The vector $y_j^*$ consists entirely of zeros except\
    \ for position s, which will contain one of the $l$-th unit in the $j$-th cluster\
    \ falls in the $s$-th category. Let\n```\n\n```\n$\\pi_{j}^* = (\\pi_{js1}^*,\
    \ \\dots, \\pi_{jsd})$ denote the expected value of $y_{js}^*$. Then, we $0 <\
    \ \\pi_{js} < 1$ and\n```\n\n```\n$\\sum_{s=1}^{d+1}\\pi_{js} = 1$. Due to this\
    \ linear dependency the last category of $y_{j}^*$ will be dropped. Let $y_j$\
    \ and\n```\n\n$\\pi_j$, represent, the vectors $y_j^*$ and $\\pi_j^*$ without\
    \ the last category. Associated with each $y_j$ is a $k$-dimensional known row\
    \ vector of explanatory variables $\\mathbf{x}_j$ such that the mean $\\pi_j$\
    \ depends on a $r$-dimensional vector of unknown parameters $\boldsymbol{\theta}$\
    \ and the vector of explanatory variables $\\mathbf{x}_j$ through a smooth link\
    \ function $g(\boldsymbol{\theta},\\mathbf{x}_j)$ such that\n\n```\n$\\pi_j =\
    \ g^{-1}(\\boldsymbol{\theta},\\mathbf{x}_j)$\n```\n\n```\n$= \\begin{pmatrix}\
    \ g_1^{-1}(\\boldsymbol{\theta},\\mathbf{x}_{j1}) \\ \\vdots \\ g_d^{-1}(\\boldsymbol{\t\
    heta},\\mathbf{x}_{jd}) \\end{pmatrix}$ (9.21)\n```\n\nExamples of link functions\
    \ (9.21) were given in Section 7.3. The GEE methodology can now be implemented\
    \ using the mean-structure given above and a variance-covariance structure $\\\
    mathbf{V}_j$ for the observations vectors $y_{ji}$, $l=1,2,...,m_j$, where\n\n\
    ```\n$Var = \\begin{pmatrix} y_{j1} \\ y_{j2} \\ \\vdots \\ y_{j,m_j} \\end{pmatrix}\
    \ = \\mathbf{V}_j$ (9.22)\n```\n\nMorel, Jorge, and Nagaraj Neeraj. Overdispersion\
    \ Models in SAS®. Copyright © 2011, SAS Institute Inc., Cary, North Carolina,\
    \ USA: ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
  merge: -1
  img_proc: true
- pgno: 330
  md: "# 318 Overdispersion Models in SAS\n\nNote that $\\mathbf{V}_j$ is a $(\text{dm})_j\
    \ \times (\text{dm})_j$ matrix and it reflects one's beliefs regarding the relation\n\
    structure of $\\mathbf{V}_j$ is a function of the mean vector $\boldsymbol{\\\
    mu}_j$,\n$\boldsymbol{\\mu}_j = (\boldsymbol{\\mu}_1^j, \boldsymbol{\\mu}_2^j,\
    \ ..., \boldsymbol{\\mu}_{m_j}^j)^\top$, an additional set of parameters $\\alpha$,\
    \ and an overdispersion (scale)\nparameter $\\phi$. Currently, the GENMOD and\
    \ SURVEYLOGISTIC support only the\nindependent working correlation matrix, that\
    \ is, $\\mathbf{V}_j = \text{BlockDiag}(\boldsymbol{\\Delta}_{j,1}, \boldsymbol{\\\
    Delta}_{j,2}, ..., \boldsymbol{\\Delta}_{j,m_j})$ with\n$\boldsymbol{\\Lambda}_j\
    \ = \text{Diag}(\boldsymbol{\\pi}_1^j, ..., \boldsymbol{\\pi}_{m_j}^j)$. The GLIMMIX\
    \ procedure, as we will discuss in the next chapter,\nallows for the computation\
    \ of the sandwich variance estimator in conjunction with a small sample\nbias\
    \ when the model contains G-random effects. Extensions of GEE for\ninomial outcomes\
    \ can be found in Lipschitz, Kim, and Zhao (1994) and Miller, Davis, and\nLandis\
    \ (1993).\n\nLet $\\mathbf{D}(0,\\mathbf{x}_j)=\\mathbf{D}_j$ represent the $d\
    \ \times r$ matrix of first partial derivatives of $\\mathbf{g}(0,\\mathbf{x}_j)$\
    \ with respect\nto $\theta_0$, and let $\\mathbf{D}_j = (\\mathbf{D}_{j,1}, \\\
    mathbf{D}_{j,2}, ..., \\mathbf{D}_{j,m_j})^\top$ represent the $(\text{dm})_j\
    \ \times r$ matrix of first partial\nderivatives associated with mean vector $\b\
    oldsymbol{\\mu}_j$. The GEE estimator of $\theta$ can be obtained as a\nconsistent\
    \ solution, $\\hat{\theta}$, of the generalized estimating equations\n\n```\n\
    $\\sum_{j=1}^n \\mathbf{D}_j^\top \\mathbf{V}_j^{-1} (\\mathbf{y}_j - \boldsymbol{\\\
    mu}_j) = \\mathbf{0}. \\quad (9.23)$\n```\n\nA solution to the generalized estimating\
    \ equations (9.23) is obtained in most of the\napplicatively iterated. A consistent\
    \ estimate of the asymptotic variance-covariance matrix of\nthe parameter estimates,\
    \ the so-called \"sandwich\" variance is given by\n\n```\n$\\widehat{Var}(\\hat{\t\
    heta}) = \\hat{\\mathbf{H}}^{-1} \\hat{\\mathbf{G}} \\hat{\\mathbf{H}}^{-1}, \\\
    \ \\quad (9.24)$\n```\n\n$\\hat{\\mathbf{H}} = \\sum_{j=1}^n \\mathbf{D}_j^\t\
    op (\\hat{\\mathbf{V}}_j^{-1}) \\mathbf{D}_j (\\hat{\boldsymbol{\theta}})$, $\\\
    hat{\\mathbf{G}} = \\sum_{j=1}^n (\\mathbf{d}_j - \bar{\\mathbf{d}})(\\mathbf{d}_j\
