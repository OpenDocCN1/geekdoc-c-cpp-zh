- pgno: 128
  md: "Binomial and the ZIB distributions do not. In this chapter, we will describe\
    \ both types of GOF tests and provide illustrative examples.\n\n# 5.2 Testing\
    \ “No Overdispersion” against an Overdispersed Binomial Alternative\n\nIn this\
    \ section we consider the tests for the null hypothesis of “No Overdispersion”\
    \ under several specific Overdispersed Binomial Distributions. One such was tested\
    \ by Tarone (1979) under the Beta-binomial model. Suppose that $t_1, t_2, \\dots,\
    \ t_n$ are realizations of $T_1, T_2, \\dots, T_n$, where the $T_j$ are independent\
    \ random variables such that each $j$, $j=1, 2, \\dots, n$, $T_j \\sim \text{Binomial}(\\\
    pi, \rho; m_j)$. Under the Beta-binomial model, for $H_0: \rho = 0$ versus the\
    \ one-sided alternative $H_1: \rho > 0$ is obtained as follows. If $\\hat{\\pi}$\
    \ is the maximum likelihood estimator of $\\pi$ when $T_j$ are assumed to be distributed\
    \ Binomial, then Tarone’s GOF one-sided statistic\n\n```\n$Z = \\sqrt{\\sum_{j=1}^n\
    \ \\frac{(t_j - \\hat{m}_j)^2}{\\hat{\\pi}(1 - \\hat{\\pi}) - \\sum_{j=1}^n m_j(m_j\
    \ - 1)}}$ (5.1)\n```\n\nwhich under the null hypothesis is asymptotically distributed\
    \ as a standard Normal distribution.\n\nTarone also drew a two-sided GOF test\
    \ of the Binomial distribution against the Generalized Binomial with Additive\
    \ Interaction element of Altham (1978). This model was simultaneously proposed\
    \ by Kupper and Hasek (1978) and is termed “Correlated Binomial Model.” The GOF\
    \ test is\n\n```\n$X^2 = \\frac{\\sum_{j=1}^n \\frac{(t_j - \\hat{m}_j)^2}{\\\
    hat{\\pi}(1 - \\hat{\\pi})}}{\\sum_{j=1}^n m_j(m_j - 1)}$ (5.2)\n```\n\nwhich\
    \ under the null hypothesis is asymptotically distributed as a Chi-square distribution\
    \ with one degree of freedom. Clearly, the statistic in equation (5,2) is the\
    \ square of the statistic given in equation (5.1). Also note that these are not\
    \ GOF statistics in the sense that they are not testing the adequacy of the distribution\
    \ under the null hypothesis, but indicate the significance of the overdispersion\
    \ parameter in the model under the alternative hypothesis.\n\nPrentice (1986)\
    \ extended the Beta-binomial distribution to allow for some degree of negative\
    \ correlations among the binary variables within experimental units. In the context\
    \ of the extended Beta-binomial model Prentice provided a two-sided Z-statistic\
    \ by (5,1), allowing tests for either overdispersion or underdispersion. These\
    \ tests are locally most powerful with specific attributes."
