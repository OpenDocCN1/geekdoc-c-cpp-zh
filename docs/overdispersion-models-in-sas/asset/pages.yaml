  md: "# Overdispersion Models in SAS\n\nNormal$(0, \\sigma^2)$. Towards that, the\
    \ likelihood function $\\prod_{i=1}^n f(\\epsilon_i; \\sigma)$ is needed, where\n\
    \n```\n$f(\\epsilon_i; 0) = \\frac{1}{2\\pi\\sigma^2}} \\exp\\left(\\frac{(y_i\
    \ - x_i\\mathbf{\beta})^2}{2\\sigma^2}\\right)$\n```\n\nThe MLE $\\hat{\\theta}\
    \ = (\\hat{\\beta}, \\hat{\\sigma}^2)$ is obtained by maximizing the logarithm\
    \ of the likelihood function, that is, first taking partial derivatives of the\
    \ log-likelihood with respect to $\\beta$ and with respect to $\\sigma^2$, and\
    \ then equating those derivatives to zero to obtain solutions for $\\beta$ and\
    \ $\\sigma^2$, respectively. The derivative of the log-likelihood is known as\
    \ the **score function**. It can be shown that the MLE of $\\hat{\\beta}$ is\n\
    \n```\n$$\\hat{\\beta} = (\\mathbf{X}^T\\mathbf{X})^{-1}\\mathbf{X}^T\\mathbf{y}$\
    \ (2.8)\n```\n\nwhich is precisely the OLS estimator $\\hat{\\beta}$ in equation\
    \ (2.6). The MLE of $\\sigma^2$ turns out to be\n\n```\n$$\\hat{\\sigma}^2 = \\\
    frac{\\sum_{i=1}^n (y_i - x_i\\mathbf{\beta})^2}{n}$ (2.9)\n```\n\nNote that $\\\
    hat{\\sigma}^2 = \\frac{n-k}{n}\\sigma^2$, so $\\hat{\\sigma}^2$ is asymptotically\
    \ unbiased (consistent). That is, $\\hat{\\sigma}^2$ is biased, but its bias tends\
    \ to zero as $n$ increases.\n\nOne way to assess the model quality of a linear\
    \ model is by examining the estimated residuals $\\hat{\\epsilon}_i = y_i - \\\
    sum_{j=1}^k x_{ij}\\hat{\\beta}_j$. A nice property of the residuals is that they\
    \ are uncorrelated with the predicted value (linear predictor) $\\hat{\\y}_i =\
    \ \\sum_{j=1}^k x_{ij}\\hat{\\beta}_j$. So, a plot (diagnostic plot) of the estimated\
    \ residuals $\\hat{\\epsilon}_i$ versus the linear predictors $\\hat{\\y}_i$ should\
    \ be randomly scattered without exhibiting any pattern. Persistent patterns in\
    \ the diagnostic plot suggest an inadequacy or **Lack-of-Fit (LOF)** of the model.\
    \ Normality of residuals can be visually evaluated via a **Normal Probability\
    \ Plot**. The normality plot is a graphical technique for assessing whether or\
    \ not the residuals, and consequently the data, are approximately normally distributed.\
    \ In a Normal Probability Plot, the\n\nMorel, Jorge, and Nagaraj Neerchal. Overdispersion\
