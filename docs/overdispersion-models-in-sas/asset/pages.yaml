    \ (=1.20)$ | 1.1223 | 0.0883 | 1.3144 | 0.1035 |\n\n# 10.7 Concluding Remarks\n\
    \nIn this chapter, we presented some fundamental concepts regarding Generalized\
    \ Linear Mixed Models (GLMM). We highlighted the estimation method known as Maximum\
    \ Likelihood, based on adaptive Gauss-Hermite quadrature, which is the estimation\
    \ method used in all the examples discussed in this chapter. This is one of the\
    \ methods used in the GLIMMIX procedure. The other method, the Pseudo-likelihood\
    \ method based on linearization, was discussed in Chapter 9. Examples, the Multicenter\
    \ Randomized Trial of Section 10.2 and the Pump Reliability at a Pressured Water\
    \ Reactor Nuclear Power Plant of Section 10.3, were used to illustrate the fitting\
    \ of a Binomial and a Poisson GLMM. A third example, the Shoulder Study discussed\
    \ in Section 9.9, was revisited in the context of a Multinomial GLMM. The fundamental\
    \ concepts of GLMM can be extended to wider family of models, the family of Generalized\
    \ Linear Overdispersion Mixed Models (GLOMM); this particular feature is\n\nMore,\
    \ and Nagaraj Neeraraj, Overdispersion Models in SAS*. Copyright 2011, SAS Institute\
    \ Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional resources,\
    \ visit support.sas.com/publishing."
