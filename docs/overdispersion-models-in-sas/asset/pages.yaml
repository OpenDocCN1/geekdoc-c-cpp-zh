    # 10.1 Generalities and Fundamental Concepts of GLMMs


    In this chapter, we pick up the discussion of Generalized Linear Mixed Models
    (GLMM) again and provide a more comprehensive view of how overdispersion models
    interact with GLMM. Several advanced examples given here illustrate how likelihood-based
    overdispersion models presented in this book can augment the estimation methodology
    provided in SAS procedures GLMIX and GENMOD. The diagram below depicts one of
    the models discussed in this chapter. We will provide Binomial, Poisson, and Multinomial
    GLMMs as examples. These are conditional models. We will also include four examples
    of Generalized Linear Overdispersion Mixed Models (GLOMM). They correspond to
    the Binomial, Random-clumped Binomial, Zero-inflated Poisson, and Zero-inflated
    Negative models with random effects. By studying these models, we complete all
    the hierarchical models we promised to cover in this book (see Appendix 1.1 of
    Chapter 1). We first start with a discussion of few fundamental concepts.


    ![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_349_0.png)'
