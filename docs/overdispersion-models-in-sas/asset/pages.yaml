    with respect to the distribution of the random effects


    ```

    $V(y_{ij}) = E[V(y_{ij}|y_j)] + V E[y_{ij}|y_j] = \int \phi\{g_j^{-1}(x_{ij}''\beta
    + z_{ij}''y_j)\}^2 f(g_j) + z_{ij}''G_j''y_j \quad (10.11)$

    ```


    Covariances can also be represented in the same way. For more details, see Morel
    and Noreahl (2010). In case of LMMs ((10.6) and (10.7)), the model given by equation
    (10.9) is called Population Average (PA) as stated earlier. Similarly, the conditional
    specification in Equations (10.10) and (10.11) is known as Subject Specific (SS).
    Such models are most suitable when the response for an individual (rather description
    of the population as a whole) is the focus of the study, as in studies of growth
    curves. Population averages are most useful in epidemiological studies. Here,
    the focus is in studying the difference between responses of groups. A salient
    example given by Zeger, Liang, and Albert (1988) is as follows: Suppose $x_i$
    indicates whether or not the subject $j$ at time $t$ smokes, and represents the
    presence or absence of a respiratory infection. The PA model would then describe
    the difference in infection rates between smokers and non-smokers, whereas the
    SS model estimates the expected change in the probability of infection of a given
    subject in changing behavior. The G-side and R-side distinction plays a much more
    important role in GLMM. (2019) provides a conditional model or G-side random effects
    specification for a GLMM. In LMM, the G-side random effect enters the mean function;
    therefore, it is amenable to specific interpretation. Note that does not contain
    an error term. So, the R-side random effects are incorporated by using a working
    correlation matrix for the marginal distribution of the response. It is worth
    noting that assuming an overdispersion model, such as DM or RC for the response
    vector, will be like specifying an R-side random effect. As commented earlier,
    this could be referred to as D-side specification to emphasize the advantage of
    a likelihood.


    An estimation of GLMM can be done, in principle, by obtaining (by integration)
    the marginal (unconditional) likelihood of the data and then proceeding with likelihood
    maximization. In the case of LMMs, closed form for likelihood estimates may not
    be available. Havville (1977) implements this approach by assuming a normal distribution
    for the random effects and a normal distribution for the conditional data on the
    random effects. Anderson and Aiken (1985) and Gianola (1998) use maximum likelihood
    estimation in logistic and binomial models, where response is binomial. By general,
    being able to obtain estimates for GLMM depends on whether or not the model (unconditional)
    distribution of $y_j$ can be obtained by integrating with a justifiable distribution
    of the random effects. Zeger and Karim (1991) use the connection between GLMM
    and the Bayesian network to give a method of estimation that overcomes the computational
    computations of these integrals is to approximate the integrals by simple expansions
    or by Laplace''s method of approximating integrals. This approach has been explored
    by Siratelli et al. (1994) and Breslow and Clayton (1993), Zeger, Liang, and Albert
    (1988) use the generalized equations approach to estimate GLMM. Shall (1991) gives
    an algorithm for estimation in GLMM which is easy to program. This algorithm also
    accommodates the specification of just the first two moments of the random effect.
    Drum and McCulloch (1993) adapt the residual maximum likelihood (REML), a method


