    # 2.9 A Poisson Example of Failures of Electronic Equipment


    From the examples in the previous sections we move to a Poisson example, which
    is the next most commonly used GLM. We will illustrate the comparison of the estimates
    and interpret the diagnostic plots. Jorgensen (1961) and Lomer et al. (1971) analyze
    data consisting of a poisson of electronic cycles under operation (weeks) in which
    each cycle was divided into two operating regimes. The data are provided in Table
    2.7. The response variable is y_j, j=1,2,...,9, representing the number of failures
    in the j-th cycle. The components of the vector x_j = (x_{j1}, x_{j2}) are the
    times spent in regimes one and two during the j-th cycle of operation.


    **Table 2.7: Number of Failures of Electronic Equipment Under Two Operating Regimes**


    | Number of Failures y_j | 15 | 9 | 14 | 24 | 27 | 27 | 23 | 18 | 22 |

    |---|---|---|---|---|---|---|---|---||}{

    | Time first regime x_{j1} | 33.3 | 52.2 | 64.7 | 137.0 | 125.9 | 116.3 | 131.7
    | 85.0 | 91.9 |

    | Time second regime x_{j2} | 25.3 | 14.4 | 32.5 | 20.5 | 97.6 | 53.6 | 56.6 |
    87.3 | 47.8 |


    As in From et al. (1971), we fit a Poisson model with λ_j = β_0 +x_{j1} + β_2x_{j2}.
    Note that this model does not have any interaction and the link function is the
    identity function. Since this is the canonical link, by default the GLIMMIX procedure
    uses the Newton-Raphson algorithm with the Hessian matrix. GLIMMIX allows the
    use of the Fisher scoring method up to a specific iteration with the option SCORING=number.
    If the algorithm converges within the number of iterations specified in the SCORING
    option, the covariance matrix of the parameter estimates will be the inverse of
    the Fisher Information Matrix and not the inverse of the Hessian. To replicate
    the results of From et al. (1971) we use the identity link and the Fisher Scoring
    Method.


