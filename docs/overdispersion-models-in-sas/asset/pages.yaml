- pgno: 9
  md: '# Preface


    This book focuses on the modeling and analysis of data exhibiting overdispersion
    using a variety of SAS procedures. Overdispersion, also known as extra variation,
    arises in Binomial, Multinomial, and count types of data when variances are larger
    than those allowed by the Binomial, Multinomial, or Poisson models. This phenomenon
    is caused by clustering of the data and lack of independence. As pointed out by
    McCullagh and Nelder (1989),''Overdispersion is not uncommon in practice. In fact,
    some would maintain that overdispersion is the norm in practice and nominal dispersion
    the exception." The problem of overdispersion is encountered every day by practitioners
    from pharmaceutical departments, biostatistics and biometrics departments, universities,
    government agencies, health research organizations, and sampling survey organizations.
    The intent of this book is to provide the techniques necessary for the proper
    analysis and modeling of such problems. These techniques include Likelihood and
    Likelihood models, as well as Generalized Estimating Equations (GEE), Generalized
    Linear Overdispersion Models (GLOM), Generalized Linear Mixed Models (GLMM), and
    Generalized Linear Overdispersion Mixed Models (GLOMM).


    Theory, methods, and implementation (in SAS) using illustrative examples will
    be integrated throughout the text. Thus, readers will be provided with a pathway
    from theoretical model to interpretation of the results in the context of a concrete
    application. Presentation of material the book is mainly example driven. Theoretical
    discussions are minimal; theoretical concepts are presented with real examples
    and data sets. We provide a clear pathway from the model to the formulation to
    the final interpretation of results.


    The book is written for an audience at the level of an applications-oriented master''s
    degree who has experience with the use of the SAS DATA step and familiarity with
    few basic PROCs. It will be accessible to those with a bachelor''s degree and
    adequate work experience. This book might be used as a supplementary text for
    a graduate-level course of Generalized Linear Models (GLM), GEE, or GLMM; or as
    an applied introduction to GLM overdispersion models as illustrative examples.
    GENMOD, GLMIX, and NLMIXED are the procedures used most in this book. It will
    be helpful if readers familiarize themselves with the syntax of these procedures
    as they are reading the corresponding sections. In particular, knowing how to
    perform Binomial and Poisson regression in the context of clustered/correlated
    data and being familiar with the repeated and random statements in GENMOD and
    GLMIX will help. Since some examples in this book bring together biostatistics
    and survey methodology through the concept of overdispersion, readers should also
    be prepared to use the SURVEIGISTIC procedure in conjunction with their cluster
    statement.


    The Random-clumped Multinomial, one of the distributions discussed in this book,
    originated from an insightful comment made by Distinguished Professor Wayne A.
    Fuller from Iowa State University in 1986. One of the authors of this book, Jorge
    G. Morel, was running a simulation as part of his dissertation work and needed
    a method to generate overdispersed multinomial data. The natural choice at that
    time was Fuller left left our desks with a ''Please see me – WAF,'' he suggested
    an elegant and deft way of generating correlated multinomial responses in a manner
    that the first two of the generated data matched those of the Binomial. The proposed
    method introduces the clustering of responses within a cluster, providing a clear
    interpretation of the observed overdispersion. This seed, planted by Professor
    Fuller, has grown to be a large research tree with numerous branches. The ensuing
    research has led us to several significant results, and are many presented in
    this book: This year, we are


    Morel, Jorge, and Nagaraj Neeraj. Overdispersion Models in SAS. Copyright ©2011,
    SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
