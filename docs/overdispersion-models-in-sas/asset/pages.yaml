    \ of $\\pi$ has, in this case, an explicit solution and is\n\n$$\\hat{\\pi} =\
    \ \\frac{\\sum_{j=1}^n t_j}{nm}$$\n\nA moment estimator of $\\phi$ can be obtained\
    \ by computing the deviance by its degrees of freedom, that is,\n\n$$\\hat{\\\
    phi} = 2\\sum_{j=1}^n \\left\\{ t_j \\log\\left(\\frac{t_j}{m\\hat{\\pi}}\\right)\
    \ + (m-t_j)\\log\\left(\\frac{m-t_j}{m-\\hat{\\pi}}\\right) \\right\\}$\n\nProgram\
