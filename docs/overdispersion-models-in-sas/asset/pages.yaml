    if tx = 'TCPO' then TCPO = 0;\nif tx = 'PHT+TCPO' then do;\nPHT = 0;\nTCPO = 0;\n\
    end;\noutput;\nend;\ndrop n;\ndatalines;\nControl 18 8 8 9 9 7 9 0 5 5 3 8 9 8\
