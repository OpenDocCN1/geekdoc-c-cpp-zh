  md: "# 132 Overdispersion Models in SAS\n\n```\n$Z_j = \\frac{\\sqrt{648}(d_j -\
    \ \\tilde{d})}{\\sqrt{\\sum_{i=1}^{}(d_i - \\tilde{d})^2}}$\n```\n\nThe two overdispersed\
    \ models to be fit will have linear predictors\n\n```\nlogit(\\pi_i) = \\beta_0\
    \ + \\beta_1 z_i + \\beta_2 z_i^2$ (5.8)\n```\n\nand\n\n```\nlogit(\\pi_j) = \\\
    alpha_0 + \\alpha_1 z_j + \\alpha_2 z_j^2$ (5.9)\n```\n\nTherefore, the logit\
    \ of the probability of success $\\pi$ and the logit of the overdispersion $\\\
    rho$ are quadratic functions of the standardized dose $z$. We refer the reader\
    \ to Section 4.8 where we introduced the concept of link functions in the context\
    \ of Generalized Linear Overdispersion Models. The underlying models we fit are\
    \ the Beta-binomial and the Random-clamped Binomial. The programming statements\
    \ can be found in Program 5.4. We first compute the MLEs using the NMIXED procedure.\
    \ The estimated frequencies of $\\pi_i^*$ and $\\rho_i^*$ are then output into\
    \ the data sets $\\pi_{bb}$, $\\rho_{bb}$, $\\pi_{rcb}$ and $\\rho_{rcb}$. These\
    \ data sets are needed in order to compute the expected (5.7) and GOF test (5.4)\
    \ using the macro GOF_RCB_Distribution. This macro is provided in Appendix 5.3.\n\
    \n# Program 5.4: MLE Analysis and GOF Test of Hiroshima Chromosome Aberration\
    \ Example\n\n```\n/*\nHiroshima Chromosome Aberration Example\n*/\ndata hiroshima;\n\
    input m t t65d_gamma t65d_neutron;\n  label m = \"Number of cells examined\"\n\
    \        t = \"Total aberrations\"\n        t65d_gamma = \"T-65-D gamma\"\n  \
    \      t65d_neutron = \"T-65-D neutron\";n  z = t65d_gamma + t65d_neutron;\ndatalines;\n\
    100 0 0 0\n100 0 0 0\n30 0 0 0\n69 12 324 84\n100 8 221 82\n100 1 0 0\n36 0 0\
    \ 0\n100 0 96 18\n... more lines\n100 1 0 0\n80 2 79 41\n65 0 0 0\n40 1 0 0\n\
    ;\n```\n\nMore, Jorge, and Nagaraj Neerchal. Overdispersion Models in SAS®. Copyright\
    \ ©2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional SAS resources, visit support.sas.com/publishing."
