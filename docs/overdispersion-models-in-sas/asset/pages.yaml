    # Program 6.2: GOF Tests for the Trematode Schistosoma Mansoni Counts under the
    Negative-binomial and the Zero-inflated Negative-binomial Models


    ```

    /*

    Trematode Schistosoma Mansoni Example, Cohen (1966)

    GOF tests under the Negative-binomial and Zero-inflated Negative-binomial

    */

    data eggs:

    input y freq;

    sum + freq;

    call output(''n'',cats(sum));

    datalines

    0 603

    1 112

    2 93

    3 53

    4 19

    5 21

    6 7

    7 6

    8 5

    9 2

    10 1

    11 2

    14 2

    /

    ods html;

    title "Negative-binomial Model using COUNTERREG";

    output ParameterEstimates=Parms_NB;

    proc countreg data=eggs;

    model y = / dist=negbin;

    output out=exp_nb prob=prob_nb;

    freq freq;

    run;

    ntitle "Zero-inflated Negative-binomial Model using COUNTERREG";

    output ParameterEstimates=Parms_ZINB;

    proc countreg data=eggs method=qn;

    model y = / dist=zinb;

    zeromodel y - / link=logistic;

    output out=exp_zinb prob=prob_zinb;

    freq freq;

    run;

    data exp_nb;

    set exp_nb;

    exp_nb = &n * prob_nb;

    run;

    proc print data=exp_nb noobs;

    run;

    ```'
