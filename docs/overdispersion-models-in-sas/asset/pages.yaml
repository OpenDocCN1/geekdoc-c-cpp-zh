    # 9.11 Testing for Homogeneity


    GLM for Multinomial models feature a separate regression equation for the probability
    of each category. Thus, a natural topic of interest is to examine the covariates
    affect the differences in the same way, or if specific covariates tend to impact
    a specific category. This is examined using the hypothesis of homogeneity. The
    following example is intended to illustrate the use of a Generalized Logistic
    Model for testing of homogeneity with Multinomial correlated outcomes. The data
    will be analyzed using the GEE methodology since the Multinomial outcomes exhibit
    overdispersion. For simplicity, we restrict ourselves to the case of two products
    and nominal responses, that is, the 2x3 contingency table. However, the methodology
    discussed in this Section can be extended to cover the case of RxC contingency
    tables. Let $\pi_{11}$, $\pi_{12}$ and $\pi_{13}$, respectively, the underlying
    true and unknown probabilities (rates) of Product 1 with observing three events
    that were treated as "Low," "Medium," and "High.". Similarly we define $\pi_{21}$,
    $\pi_{22}$ and $\pi_{23}$ as the corresponding probabilities for Product 2. The
    hypothesis of homogeneity can be stated as


    > $H_0 : \pi_{11} = \pi_{21}$ and $\pi_{12} = \pi_{22}$ and $\pi_{13} = \pi_{23}$
    $H_1 : \pi_{11} \neq \pi_{21}$ or $\pi_{12} \neq \pi_{22}$ or $\pi_{13} \neq \pi_{23}$
    (9.30)


    Because of the linear dependency among the $\pi_{i0}$, we have that $\pi_{i1}
    = 1 - \sum_{j=1}^2 \pi_{ij} = 1, i=1,2$ . The reader might notice we are expressing
    the probability of "Low" as a combination of the other two products. While any
    of the three categories may be chosen, we choose to


