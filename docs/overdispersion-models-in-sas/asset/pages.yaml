    # 7.11 Generalized Linear Overdispersed Models for Multinomial Responses–the Births
    Study Revisited


    As in the case of Multinomial distribution, both DM and RCM can also be used in
    conjunction with covariates to obtain GLMs for the multinomial vector of probabilities.
    We restrict ourselves to the two most commonly used link functions, cumulative
    logit and generalized logit. The reader may also recall our discussion from Section
    4.8, where we considered Generalized Linear Models (GLOM) for binary responses
    with appropriate link functions for the probability of success and the overdispersion
    parameter. These concepts can be extended to the Dirichlet-multinomial and Random-clumped
    Multinomial distributions in a natural way. First of all, note that the overdispersion
    parameter is constrained to the zero-one interval if so. The typical link functions
