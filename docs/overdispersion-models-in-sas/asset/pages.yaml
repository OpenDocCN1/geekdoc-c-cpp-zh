  md: "# Chapter 5 Goodness-of-fit Tests for Overdispersed Binomial Models 141\n\n\
    ```\ngrad = j(2,1,0);\n\n************************************************************************************************\n\
    do j = 1 to n;      * Looping for all observations 1-n\n************************************************************************************************\n\
    \nml = m[j];\nkl = t[j];\n\nmct = exp(lgamma(ml+1)-lgamma(kl+1)-lgamma(ml-kl+1));\n\
    \npart1 = exp(lgamma(c)-lgamma(ml+c));\npart2 = exp(lgamma(kl+c*pi)-lgamma(c*pi));\n\
    part3 = exp(lgamma(ml-kl*(1-pi))-lgamma(c*(1-pi)));\n\nlogb = logb + log(c*part1*part2*part3);\n\
    logl = -2*logb;\n\n************************************************************************************************\n\
    * Compute gradient under Beta Binomial distribution:\n************************************************************************************************\n\
    \nsum3 = 0;\nsum2 = 0;\nsum1 = 0;\n\\nsum3 = sum(1/(c:(c+m[j])));\nif (kl > 0)\
    \ then sum1 = sum(1/(cpi:(wpi+kl-1)));\nif (kl < ml) then sum2 = sum(1/(cpic:(cpic-ml-kl-1)));\n\
    \ngrad[1] = grad[1]+c*(sum2);\ngrad[2] = grad[2]+(pi*sum1+pic*sum2-sum3)*b;\n\n\
    ************************************************************************************************\n\
    end;\n    * Of looping for observations;\n************************************************************************************************\n\
    \n************************************************************************************************\n\
    * Compute Fisher information under Beta Binomial distribution:\n************************************************************************************************\n\
    \nFIMB = j(2,2,0);\nRUN FISHERB;\nINVBB = inv(FIMB);\nlogl_old = logb;\nadd =\
    \ INVVB*grad;\n\nstop2 = 0;\nsplit = 1;\n\n****************************************************************************************************************\n\
    * To check if the likelihood is improved with the new estimates\nOtherwise modify\
