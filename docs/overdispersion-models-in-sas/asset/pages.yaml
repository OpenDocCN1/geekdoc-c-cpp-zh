  md: '# 1.5 A Simulated Example


    A simple way of simulating correlated Bernoulli trials is as follows. Let Y, Y_i^0,
    ..., Y_m^0 be independent and identically distributed Bernoulli ( ) random variables.
    For each i,i=1,...,m, define Y_i as Y with probability ρ, or as Y_i^0 with probability
    (1-ρ),0ρ≤1. In other words, each Y_i can be represented by the


    ```

    Y_i = Y I(U_i ≤ ρ) + Y_i^0 I(U_i > ρ),                               (1.7)

    ```


    where the U_i are independent uniform (0,1) random variables, and I() denotes
    an indicator function. in for clustered data,


    E(Y) = ρ, Var(Y) = ρ(1-ρ) and Corr(Y_1, Y_2) = ρ².


    The programming statements for generating data under model (1.7) are provided
    next for m=5, ρ=0.6 and ρ²=0.3. Note that n=2000 clusters are being generated,
    each consisting of a string of m=5 correlated binary outcomes.


    # Program 1.1: Correlated Bernoulli Outcomes


    ```

    /*

    Generation of correlated Bernoulli outcomes

    For Y(1),Y(2),...,Y(m)

    E(Y)

    Pi

    Var(Y)

    Pi*(1-Pi)

    Corr(Y(i), Y(j))

    Rho*Rho

    */

    data correlated bernoulli;

    n = 20000; --- Number of clusters;

    m = 5; --- Number of elemental units within the cluster;

    pi = 0.6; --- Probability of success of each elemental unit;

    rho2 = 0.3; --- Intra-cluster correlation;

    seed = 16670;

    rho = sqrt(rho2);

    do subid = 1 to nr; --- Variable yj plays the role of y of eq. (1.7)

    y = 0;

    u = uniform(seed);

    if u < pi then y = 1;

    if i=1 to m;

    y = 0;

    u = uniform(seed);

    if u < rho then y = y;

    else do;

    uu = uniform(seed);

    if u < pi then y = 1;

    end;

    output;

    end;



    keep subid i;

    run;

    ```'
  merge: -1
  img_proc: true
