  md: "# Chapter 6 Likelihood Models for Overdispersed Count Responses 195\n\nbe-written\
    \ as ZIP (ZINB) with $\\omega > 0$, whereas a Hurdle model with a shortage of\
    \ zeros can only be written as ZIP (ZINB) if we allow negative weights. Because\
    \ of the equivalency, the practitioner has the flexibility of using either the\
    \ Hurdle model or the Zero-inflated model for any given application. It can be\
    \ verified that the maximum values of likelihood under the two models are identical.\
    \ In the case of data sets with less than expected, we would recommend Hurdle\
    \ models, due to the convenience of not dealing with negative weights. As an illustration\
    \ of this consider the previously discussed Mullally's (1986) example. The computed\
    \ value of negative two times the log-likelihood function under a Hurdle Poisson\
    \ and a ZINB models are identical and equal to 5470.5. Similarly, for the Hurdle-binomial\
    \ and ZINB models the corresponding values are 5449.9 due to the equivalency of\
    \ these two pairs of models. The programming statements for fitting a ZIP and\
    \ ZINB using the GENMOD procedure are given below.\n\n| ZIP Model -- Milk Consumption\
    \ Example -- Mullally (1986) |\n| :--- |\n\n```\n```nproc genmod data=Milk_Consumption;\n\
    \  model y = / dist=zip;\n  zeromodel / link=logit;\n  freq req;\n```\n```\n\n\
    | ZINB Model -- Milk Consumption Example -- Mullally (1986) |\n| :--- |\n\n```\n\
    ```nproc genmod data=Milk_Consumption;\n  model y = / dist=zinb;\n  zeromodel\
    \ / link=logit;\n  freq req;\n```\n```\n\n# Appendix 6.1: Generation of Data under\
    \ the Negative-binomial Distribution\n\nTo generate a random sample $Y_j, j=1,2,...,n.\
    \ Y_j \\sim \\text{Negative-binomial}(\\mu,\\kappa)$ where the mean of the distribution\
    \ is $\\mu$ and the dispersion parameter $\\kappa$ proceeds as follows:\n\n+ \
    \  - Define $\\alpha$ and $\beta = \\kappa\\mu$ as $\\alpha = \\frac{1}{\\kappa}$\
    \ and $\\beta = \\kappa\\mu$.\n- Generate a sample $U_j, j=1,2,...,n$ such that\
    \ $U_j \\sim \\text{Gamma}(\\alpha, \\beta)$.\n- Then, for each $j, j=1,2,...,n$,\
    \ generate $Y_j \\sim \\text{Poisson}(U_j)$.\n\nRecall the mean and variance of\
    \ a Negative-binomial distribution are, respectively, $\\mu$ and $\\mu + \\kappa\\\
    mu^2$.\n\n| Generation of data under a Negative-binomial distribution\nwith mean\
    \ Mu and dispersion parameter Kappa\nMean of Y's is Mu\nVariance of Y's is Mu\
    \ + Kappa*Mu = Mu*(1 + Kappa*Mu)\nRecall Alpha = 1/Kappa and Mu = Alpha*Beta |"
