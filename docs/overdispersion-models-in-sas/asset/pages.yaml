    \ assumed to be $\\kappa=0.15$. As before, the expected number of counts for the\
    \ first group is $(1-\\omega)e^{\beta_0+\beta_1}=0.80(e^{1.10})\\approx2.4033$.\n\
    For the second group, the expected number of counts is $(1-\\omega)e^{\beta_0}=0.80(e^{0.70})\\\
    approx1.6110$. Thus, the ratio of the expected number of counts is thus\n\n# Program\
