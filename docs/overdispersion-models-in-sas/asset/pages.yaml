    \ found the use of a cumulative Logistic distribution function (Logit model) more\
    \ appropriate. The term \"probit\" is attributed to Bliss, whereas the term \"\
    logistic\" is attributed to Pearl and Reed (1920) and embraced by Berkson in his\
    \ 1944 paper. The probit and logistic analyses of dosage-mortality data are early\
    \ examples of GLMs. These types of models are also known as Quantal Response Models.\n\
    \nPyrethrins are a class of insecticidal chemicals found in many insecticides.\
    \ Murray (1938) outlined a method of simultaneous evaluation of different insecticides,\
    \ known as Peet-Greedy method, and the possible range of accuracy. Eleven different\
    \ concentrations of total pyrethrins were tested on copies of flies. The dosage-mortality\
    \ data on male flies are reported in Table 2.3.\n\n# Table 2.3: Dosage-Mortality\
    \ Data of Pyrethrins on Male Flies\n\n| Concentration Total Pyrethrins mg/100\
