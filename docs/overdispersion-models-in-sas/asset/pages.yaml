    # 3.6 An Osteopor Example of Patients at High Risk for Vertebral Fractures


    We now turn to Quasi-likelihood estimation in Poisson models using offsets. An
    offset is technically defined as the linear predictor with a coefficient of one.
    Offsets are useful especially in Poisson models since they normalize the mean.
    A typical example of offset is "duration of exposure". Occurrences of counts of
    a certain event typically depend on duration of exposure: the longer the exposure,
    the more likely we observe larger counts. In this example we assume the form of
    overdispersion defined as $E(Y)=\mu$ and $Var(Y)=\mu\Phi, \Phi > 1$. Note that
    this variance structure can be written as


    $Var(Y)=\mu(1+\kappa), \kappa>0$, which is one form of overdispersion for the
    Poisson model discussed in Dean (1992).


