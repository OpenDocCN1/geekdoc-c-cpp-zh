  md: "# 192 Overdispersion Models in SAS\n\n# Program 6.7: Goodness-of-fit Tests\
    \ for the Hurdle Models—Daily Milk Consumption Data\n\n```\n/*\n   Milk Consumption\
    \ Example -- Mullahy (1986)\n*/\n%macro gof_test(File,Distribution,DF);\nproc\
    \ iml;\n/* Input:    File = File Containing Observed and Expected Frequencies\n\
    \               Distribution = Distribution being fitted\n               DF =\
    \ Degrees of Freedom for GOF Test\n   Output:   Pearson's GOF and Associated P-value\
    \ */\n--- Get observed and expected frequencies;\nuse &File var (freq);\nread\
    \ all into obs;\nuse &File var (pred);\nread all into exp_f;\nsum1       = obs[,1];\n\
    sum2       = exp_f[,1];\nexp_f[7,1] = exp_f[7,1] + sum1 - sum2;\nsum2       =\
    \ exp_f[,1];\n--- Compute Chi-square GOF statistics and P-values;\nchi = 0;\n\
    do j = 1 to 7;\n  chi = chi + obs[j] * obs[j] / exp_f[j];\nend;\nchi = round(chi\
    \ &n, 0.01);\ndf = &DF;\nnpval = 1 - probchi(chi,df,0);\n--- Print results;\n\
    x0 = ('0', '1', '2', '3', '4', '5');\ndistribution = ({&Distribution};};\nx1 =\
    \ obs / sum;\nx2 = exp / sum;\nmattrib x0   label=Value of Y';      format=8.0;\n\
    mattrib x1   label='Observed Frequencies'; format=10.4;\nmattrib x2   label='Expected\
    \ Frequencies'; format=10.4;\nmattrib chi label='Chi-square';        format=8.2;\n\
    mattrib df   label='DF';                format=8.0;\nmattrib pval label='P-Value';\
    \          format=pvalue6;\n\nprint 'Goodness-of-fit Tests Results';\nprint x0\
    \ x1 x2;\nprint Distribution chi df pval;\nquit;\n%end gof_test;\\ods html;\n\
    title1 \"Milk Consumption Example -- Mullahy (1986)\"\ntitle2 \"Poisson Hurdle\
    \ Model\";\n```\n\nMorel, Jorge, and Nagaraj Neel. Overdispersion Models in SAS®.\
    \ Copyright ©2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/publishing."
