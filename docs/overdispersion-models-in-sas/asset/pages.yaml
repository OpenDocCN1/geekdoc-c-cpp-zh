  md: '# 352 Overdispersion Models in SAS


    # 10.4 Example Multinomial Model with Random Effects


    In this section we will demonstrate the fitting of a Multinomial model with random
    effects using the shoulder pain study example of Section 9.9. In the study, there
    were 22 subjects in the active group (with abdominal suction) and 19 subjects
    in the control group (without abdominal suction). Recall that after laparoscopic
    surgery, patients were asked to rate their pain on a visual analog scale, morning
    and afternoon, for three days after the operation (for a total of six different
    times). The response was ordinal with a five category group, where the value “1”
    indicated “low pain,” and “5” indicated “high pain.” There were covariates, namely
    Gender, Age, and Time, with all time being subject-specific. Let $y_{ij}$ represent
    the response of the j-th subject in the i-th treatment group at the i-th time,
    $i=1, 2, j=1, 2, \dots,$ ($n_i=22, n_j=19, t=1, 2, \dots, 6$), with


    ```

    $E(y_{ij}) = \frac{\pi_{1ij}}{\pi_{1ij} + \pi_{2ij} + \pi_{3ij} + \pi_{4ij}}$

    ```


    Note that a subject with his/her repeated measures constitutes a cluster. We consider
    the following Logit GLMM as


    $$\ln(\pi_{1ij} / (\pi_{2ij} + \pi_{3ij} + \pi_{4ij})) = \alpha_1 + \beta_1X_{ij}
    + \beta_2X_{2ij} + \beta_3X_{3ij} + \beta_4t + u_{ij}$$

    $\$\ln(\pi_{2ij} / (\pi_{1ij} + \pi_{3ij} + \pi_{4ij})) = \alpha_2 + \beta_2X_{ij}
    + \beta_2X_{2ij} + \beta_3X_{3ij} + \beta_4t + u_{ij}$$

    $\$\ln(\pi_{3ij} / (\pi_{1ij} + \pi_{2ij} + \pi_{4ij})) = \alpha_3 + \beta_1X_{ij}
    + \beta_2X_{2ij} + \beta_3X_{3ij} + \beta_4t + u_{ij}$$

    $\$\ln(\pi_{4ij} / (\pi_{1ij} + \pi_{2ij} + \pi_{3ij})) = \alpha_4 + \beta_1X_{ij}
    + \beta_2X_{2ij} + \beta_3X_{3ij} + \beta_4t + u_{ij}$ (10.14)


    where the $u_{ij}$ are independent and identically distributed $N(0, \sigma^2)$,
    $X_{ij}$ and $X_{12}$ are classification variables, respectively, representing
    the treatment group and the gender; $X_{13}$ represents the subject''s age, and
    “t” is the linear value of Time. Conditionally on the random effect $u_{ij}$,
    the pain scores in the j-th treatment are considered independent. The random effect
    in equation (10.4) is the one known as “random intercepts.” It is possible to
    have a more general structure $Z_{ij}$, in place of $u_{ij}$. We refer to the
    chapter in Kuo and Kuo (2001) for a discussion on this and for example of a Generalized
    GLMM effect on consumer preference. We will fit the GLMM using the GLMIX procedure.
    The programming statements are shown in Program 10.3. We exemplify the use of
    GLMIX by considering the classical empirical covariance matrix of the fixed effect,
    and by additionally requesting the small sample bias correction of Morel, Bokossa,
    and Neeraj (2003). This approach is invoked with the PROC option “empirical=mbn”.
    The three models (GLMM, GLMM with empirical variance estimates, and GLMM with
    empirical variance and small sample bias variance correction) were all fit using
    the Maximum Likelihood method based on Adaptive Quadrature. The shoulder pain
    study data can be found in Program 9.6 of 9.9.


    Morel, Jorge, and Nagaraj Neeraj. Overdispersion Models in SAS®. Copyright 2011,
    SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For all permissions,
    visit www.sas.com/publishing.'
