  md: "# Chapter 9 Generalized Estimating Equations Techniques for Marginal Models\
    \ 291\n\nto the variance-covariance matrix of $\\mathbf{y}_j$, if $\\mathbf{R}(\\\
    {\\alpha})$ were the true correlation matrix for the $\\mathbf{y}_j$'s. Then,\
    \ define the generalized estimating equations as\n\n```\n$$\\sum_{j=1}^n \\mathbf{D}_j^T\
    \ \\mathbf{V}_j^{-1} [\\mathbf{y}_j - \\boldsymbol{\\mu}_j(\\boldsymbol{\beta})]\
    \ = \\mathbf{0}$, \\quad (9.2)$\n```\n\nWhere $\\boldsymbol{\\mu}_j = (\\mu_{j,1},\
    \ \\mu_{j,2}, ..., \\mu_{j,m_j})^T$, $\\mathbf{D}_j$ represents the $m_j \\times\
    \ k$ matrix of first derivatives of $\\boldsymbol{\\mu}_j$ with respect to $\\\
    boldsymbol{\beta}$, that is $\\mathbf{D}_j = \\frac{\\partial\\boldsymbol{\\mu}_j}{\\\
    partial\\boldsymbol{\beta}}$, and $\\mathbf{V}_j$ is defined as in equation (9.1).\
    \ Both procedures,\n\nGENMOD and GLIMMIX, handle a general form of (9.1) by allowing\
    \ each element of $\\mathbf{Y}_j = (Y_{j,1}, Y_{j,2}, ..., Y_{j,m_j})^T$ to have\
    \ its own weight. Though with each $\\mathbf{y}_j$ there is an $m_j \\times m_j$\
    \ diagonal matrix of weights $\\mathbf{W}_j$ so that\n\n```\n$$\\mathbf{V}_j =\
    \ \\mathbf{W}_j^{1/2} \\mathbf{R}(\\{\\alpha\\}) \\mathbf{W}_j^{1/2} \\phi{\\\
    phi}$.$, \\quad (9.3)$\n```\n\nThe reader should be aware that numerically solving\
    \ the generalized estimating equations (9.2) for $\\boldsymbol{\beta}$ does not\
    \ yield a maximum likelihood estimator of $\\boldsymbol{\beta}$ but it yields\
    \ a Quasi-likelihood type of estimator. As mentioned in the introduction, GEE\
    \ does not assume a probability distribution for the data; therefore, it does\
    \ not accommodate likelihood-based inferences.\n\n# 9.4 Estimation Methods\n\n\
    In SAS there are two methods for computing the model-estimators that are used\
    \ in the calculation of the empirical variance estimate. The GENMOD procedure\
    \ uses a moment-based methodology based on seminal papers by Liang and Zeger (1986),\
    \ and Zeger and Liang (1986). On the other hand, one of the two used in GLIMMIX\
    \ is a pseudo-likelihood estimation based on linearization (with Wolfinger and\
    \ O'Connell, 1993). We begin with the following algorithm used by GENMOD for fitting\
    \ the specified model by GEEs. Note that this is not general in a likelihood-based\
    \ method of estimation, so inferences based on likelihoods are not possible for\
    \ GEE methods. The algorithm used by GENMOD can be summarized as follows:\n\n\
    +   1. Compute an initial estimate of $\\boldsymbol{\beta}$ with an ordinary generalized\
    \ linear model assuming independence among the repeated measurements, i.e., $\\\
    mathbf{R}(\\{\\alpha\\})$ is an identity $m_j \\times m_j$ matrix.\n\n+   2. Compute\
    \ the working correlations $\\mathbf{R}(\\{\\alpha\\})$ on the standardized residuals,\
    \ which current $\\boldsymbol{\beta}$, and the assumed structure of $\\mathbf{R}(\\\
    {\\alpha\\})$.\n\n+   3. Compute the estimate of the covariance in equation (9.3).\n\
    \n+   4. Update $\\boldsymbol{\beta}_{(s+1)} = \\boldsymbol{\beta}_{(s)} + (\\\
    mathbf{D}^T \\mathbf{V}^{-1} \\mathbf{D})^{-1} \\mathbf{D}^T \\mathbf{V}^{-1}\
    \ (\\hat{\\mathbf{y}} - \\hat{\boldsymbol{\\mu}})$.\n\n+   5. Repeat 2-4 until\
    \ convergence is achieved.\n\nMorel, Jorge, and Nagaraj Rees. Overdispersion Models\
    \ in SAS®. © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/publishing."
