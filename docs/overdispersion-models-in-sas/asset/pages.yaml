  md: "# Overdispersion Models in SAS\n\nlikelihood and consequently to the same estimates\
    \ and inferences. Our approach to overdispersion model specification is based\
    \ on a variety of probability distributions capable of accounting for intra-cluster\
    \ correlations, and may be referred to as a D-side specification. LMM are also\
    \ known in the statistical literature as variance components models. They are\
    \ often used to model repeated measures data, longitudinal data and clustered\
    \ data. They may also be applicable to time series and spatial data. See McCulloch\
    \ and Searle (2001) for historical developments of the mixed model. The reader\
    \ is also referred to Littell et al. (2006) for more recent developments.\n\n\
    The next step in describing a GLMM is now clear. GLMM is obtained by including\
    \ random effects in the linear predictor we subscript the random effects by \"\
    j\" so that they act the same on all elemental units within the cluster. Note\
    \ that $\\gamma_j$ is still vector of appropriate dimension to accommodate possibly\
    \ different random effects for the beta-parameters. The model equation for the\
    \ Generalized Linear Mixed Model then becomes\n\n```\n\\mu_{ji} = \\mathbf{E}(\\\
    mathbf{y}_{ji})\\= \\mathbf{g}^{-1}(\\boldsymbol{\beta}, \\mathbf{x}_{ji}, \\\
    gamma_j) \\\\left( \\begin{array}{c} \\mathbf{g}_j^{-1}(\\mathbf{x}_{ji} + \\\
    mathbf{z}_{ji}\\gamma_j) \\ \\vdots \\ \\mathbf{g}_d^{-1}(\\mathbf{x}_{ji}\\boldsymbol{\b\
    eta} + \\mathbf{z}_{ji}\\gamma_j) \\end{array} \\right)\n```\n\nwhere $\\mathbf{z}_{ji}$\
    \ are usually variables and $\\gamma = (\\gamma_1', \\gamma_2', ..., \\gamma_n')^T$\
    \ is assumed to be a zero-mean multivariate Normal random vector. We can re-write\
    \ the model equations for the mean more succinctly as\n\n```\n\\left[ \\mathbf{E}(\\\
    mathbf{y}|\\gamma) \\right] = \\mathbf{g}(\\gamma) = \\mathbf{X}\\boldsymbol{\b\
    eta} + \\mathbf{Z}\\gamma \\\\ \\left[ \\mathbf{Var}(\\mathbf{y}|\\gamma) = \\\
    mathbf{V}(\\mu, \\alpha) \\right] = \\mathbf{V}\\left[ \\mathbf{X}\\boldsymbol{\\\
    beta} + \\mathbf{Z}\\gamma \\right] \\right]\n```\n\nso that we can see the correspondence\
    \ between LMM and GLMM. The unconditional mean can be obtained by integrating\
    \ the random effects out. This can be symbolically represented as\n\n```\n\\mu_{ji}\
    \ = \\int \\mathbf{g}_j^{-1}(\\mathbf{x}_{ji}\\boldsymbol{\beta} + \\mathbf{z}_{ji}\\\
    gamma_j) d\\mathcal{F}(\\gamma_j).\n```"
