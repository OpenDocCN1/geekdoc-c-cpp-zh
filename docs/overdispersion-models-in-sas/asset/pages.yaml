    In the 1978 publication, Efron analyzed these data by fitting a series of nested
    logistic regression models with linear predictors


    > $$\begin{aligned} \eta_i &= \beta_0 \ \eta_i &= \beta_0 + \beta_1z_i \ \eta_i
    &= \beta_0 + \beta_1z_i + \beta_2z_i^2 \ \eta_i &= \beta_0 + \beta_1z_i + \beta_2z_i^2
    + \beta_3z_i^3 \end{aligned} (3.9)$


    $z_j$ is the standardized value of rainfall ($x_j$),


    ```

    $z_j = \frac{\sqrt{33}(x_j - \bar{x})}{\sqrt{\sum_{j=1}^{34}(x_j - \bar{x})^2}}$

    ```


    In the 1986 publication, Efron introduced the concept of the double exponential
    family with a second parameter to control the variance independently of the mean
    in the member of the one-parameter exponential family, such as Binomial or Poisson.
