- pgno: 39
  md: "In order to obtain $\\hat{\beta}$, the MLE of $\\beta$, one needs to solve\
    \ the estimating equations\n\n```\n$$\\frac{\\partial L(\\\beta;\\phi;\\mathbf{y})}{\\\
    partial \\beta} = \\mathbf{0}.$\\quad (2.19)$\n```\n\nThese equations are known\
    \ as the maximum likelihood score equations. More often than not, the solution\
    \ of (2.19) does not have an explicit form and is thus solved iteratively. Several\
    \ numerical methods are available. The iterative procedure for the Newton-Raphson\
    \ Method is given by\n\n```\n$$\\hat{\\beta}_{(S+1)} = \\hat{\\beta}_{(S)} + {\\\
    hat{H}(\\hat{\\beta}_{(S)})\\}^{-1}\\mathbf{u}(\\hat{\\beta}_{(S)}).\\quad (2.20)$\n\
    ```\n\nand the widely used Fisher Scoring Method is implemented as follows\n\n\
    ```\n$$\\hat{\\beta}_{(S+1)} = \\hat{\\beta}_{(S)} + {\\hat{I}(\\hat{\\beta}_{(S)})\\\
    }^{-1}\\mathbf{u}(\\hat{\\beta}_{(S)}).\\quad (2.21)$\n```\n\nwhere $\\mathbf{u}(\\\
    hat{\\beta}_{(S)})$ is the k-dimensional vector of first derivatives of the log-likelihood\
