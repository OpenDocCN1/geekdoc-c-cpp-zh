  md: "# Overdispersion Models in SAS\n\n$R_{CM}(\\pi_i, \\pi_i) \\quad m(1-\nho)^2(\b\
    eta_i + \beta_d) + (\\pi_i^{-1} + \\pi_d^{-1}) \nightarrow 0 \\quad i=1,2,...,d$\n\
    $R_{CM}(\\pi_i, \\pi_i') \\quad m(1-\nho)\beta_{d+1} + \\pi_{d+1}^{-1} \nightarrow\
    \ 0 \\quad i=1,2,...,d, \\ i \neq i'$\n$R_{CM}(\\pi_i, \nho) \\quad m(1-\nho)(\\\
    gamma_i - \\gamma_{d+1}) \nightarrow 0 \\quad (8.4)$\n$R_{CM}(\nho, \nho) \\quad\
    \ \\frac{m}{1-\nho}\\frac{\\pi_i}{(1-\nho)\\pi_i}\\frac{\\pi_i}{\nho} \nightarrow\
    \ 0$\n\nwhere $\beta_i = \\frac{\\pi_i}{(1-\nho)\\pi_i} + \\frac{1-\\pi_i}{(1-\n\
    ho)\\pi_i}, \text{ and } \\gamma_i = \\frac{\\pi_i(1-\\pi_i)}{(1-\nho)\\pi_i}\
    \ + \\frac{1}{1-\nho}, \text{ for } i=1,2,...,(d+1).\n\nComparing the limiting\
    \ results for the two distributions by (8.3) and (8.4), interesting observations\
    \ emerge. First of all, note that the expression of the limiting expressions in\
    \ (8.4) is simple to compute, whereas the limiting expressions in (8.3) involve\
    \ digamma and trigamma functions. Furthermore, it can be shown that the error\
    \ of approximation for the FIM of the DM is of order $m^{-1}$, whereas the corresponding\
    \ error of approximation for the RCM is of order m. Thus, we can conclude that\
    \ while approximations will perform well for large m, the approximation will work\
    \ much better for the RCM model than the DM model. These observations are corroborated\
    \ in a large scale simulation study, the results of which are reported in Appendix\
    \ 8.1.\n\nThe limiting expressions in equations (8.3) and (8.4) are simple to\
    \ compare to the elements of the associated Fisher information matrices. So, for\
    \ large m, one may consider using them as approximations in the Fisher scoring\
    \ algorithm of equation (8.1). Using the approximations we recommend the following\
    \ Two-stage procedure:\n\n**Stage 1.** An estimator $\\hat{\boldsymbol{\theta}}\
    \ = (\\hat{\\pi}', \\hat{\nho})$ is first obtained by using the previously described\
    \ Fisher scoring procedure (8.1), where the Fisher information matrix is replaced\
    \ with its limiting information matrix given in equations (8.3) and (8.4).\n\n\
    More, Jorge, and Nagaraj Neerchal. Overdispersion Models in SAS. Copyright © 2011,\
    \ SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/publishing."
