    The difference of the logarithm of the two baseline rates, which makes the randomization
    effect as noted earlier, is 0.1080 with an estimated standard error of 0.1937.
    The result, as stated, is not statistically significant (P=0.5770). The ratio
    of these two rates is 1.1141. The difference of the logarithm of the two treatment
    phases is 0.4096 with an estimated standard error of 0.2466. This result is marginally
    significant (P=0.0967). The ratio of these two rates is 1.5063, indicating that
    Probagrade reduces the number of seizures by about 50%. The estimate of the ratio
    R1, of the two placebo rates (Treatment Phase to Baseline) is 1.1172. Its logarithm
    is 0.1108 with an estimated standard error of 0.1161. This corresponds to a P-value
    of 0.3399 indicating that there is no placebo effect. The estimate of the ratio
    R2, of the two Probagrade rates (Treatment Phase to Baseline) is 0.8263. On the
    model scale, its logarithm turned out to be -0.1908. Finally, the estimated ratio
    of treatment phase rates Placebo to Probagrade (normalized by its corresponding
    baseline rates) is 1.3540, indicating an approximate 35% reduction on the number
    of seizures to the efficacy of Probagrade. The logarithm of this ratio, as provided
    by the Log-Linear model, is 0.3016. Its estimated standard error is 0.1712 with
    an associated P-value of 0.0781.


