    | Estimated Mean and Variance\nData generated from the Beta-binomial and Random-clumped\
    \ Binomial distributions with parameters Pi=0.4, Rho=0.7 and m=12 |\n| The MEANS\
    \ Procedure |\n| Analysis Variable : t |\n| Dist | N Obs | Mean | Variance |\n\
    |---|---|---|--|\n| BB | 20000 | 4.8602 | 18.3861 |\n| RCB | 20000 | 4.7947 |\
    \ 18.3707 |\n\nProgram 4.6: Generating Data under the Beta-binomial and Random-clumped\
    \ Binomial Distributions\n\n```\n/*\nGeneration of data under the Beta-binomial\
    \ and Random-clumped Binomial distributions with parameters Pi, Rho and m\n*/\n\
    #macro bb_rcb_data(pi,rho,m,n,seed);\n---\nGeneration of data under the Beta-binomial\
    \ distribution;\ndata bb;;\n  format Dist S3;\n  Dist = \"BB\";\n  seed = &seed;\n\
    \  c = 1/rho - 1;\n  a = c *pi;\n  b = c - a;\n  do cluster=1 to n;\n    y1 =\
    \ rangam(seed, a);\n    y2 = rangam(seed, b);\n    p = y1/(y1+y2);\n    t = ranbin(seed,m,p);\n\
    \    output;\n  end;\nkeep Dist;\nrun;\n---\nGeneration data under the Random-clumped\
    \ Binomial distribution;\ndata rcb;\n  Dist = \"RCB\";\n  seed = &seed;\n  do\
    \ cluster=1 to n;\n    y = ranbin(seed, 1,pi);\n    nn = ranbin(seed,m,rho);\n\
    \    t = y * nn; -- Random clumping of the data;\n    if nn < m then t = t + ranbin(seed,nn,pi);\n\
    \    output;\n  end;\n```\n\nMorel, Jorge, and Nagaraj Neeraj. Overdispersed Models\
