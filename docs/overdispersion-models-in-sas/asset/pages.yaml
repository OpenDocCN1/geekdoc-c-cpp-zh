  md: "# 2.2 Linear Regression Models\n\nLet $Y_j, j=1,2,...,n$, independent random\
    \ variables, and let $y_j$ represent a realization of $Y_j$. Associated with each\
    \ observation $y_j$ are a $k$-dimensional row vector of known covariates\n\n$mathbf{x}_j\
    \ = (x_{1j},x_{2j},...,x_{kj})$ and a $k$-dimensional column vector of unknown\
    \ parameters\n$\boldsymbol{\beta} = (\beta_1,\beta_2,...,\beta_k)^T$ such that\
    \ the mean of $y_j$, with $\\mathbf{x}_j$ and $\boldsymbol{\beta}$ is\n\n```\n\
    $y_j = \\mathbf{x}_j\\boldsymbol{\beta} + \\varepsilon_j = \\sum_{i=1}^k x_{ij}\\\
    beta_i + \\varepsilon_j \\quad (2.1)\n```\n\nwhere the $\\varepsilon_i$'s are\
    \ uncorrelated random variables such that $E(\\varepsilon_i)=0$ and $Var(\\varepsilon_i)=\\\
    sigma^2$. This is the classical linear regression model. The linear model (2.1)\
    \ in matrix form is written as\n\n```\n$\\mathbf{y} = \\mathbf{X}\\boldsymbol{\b\
    eta} + \\boldsymbol{\\varepsilon} \\quad (2.2)\n```\n\nwhere $y$ is an $n$1 vector,\
    \ $y=(y_1,y_2,...,y_n)^T$, $X$ is an $n \\times k$ matrix of known covariates,\n\
    $\\mathbf{X} = (\\mathbf{x}_1,\\mathbf{x}_2,...,\\mathbf{x}_n)^T$, $\boldsymbol{\b\
    eta}$ a $k$-dimensional column vector of unknown parameters\n$\boldsymbol{\beta}\
    \ = (\beta_1,\beta_2,...,\beta_k)^T$, and $\\varepsilon$ is an $n \\times 1$ vector\
    \ of disturbances, $\\varepsilon = (\\varepsilon_1,\\varepsilon_2,...,\\varepsilon_n)^T$.\
    \ It is assumed that $n > k$.\n\nThe usual method for estimating $\boldsymbol{\b\
    eta}$ is the well-known method of Least Squares (LS), also referred to the method\
    \ of Ordinary Least Squares (OLS). The OLS estimate of $\boldsymbol{\beta}$ minimizes\
    \ the sum of squares\n\n```\n$S(\\boldsymbol{\beta}) = \\sum_{j=1}^n \\varepsilon_j^2\
    \ = \\sum_{j=1}^n (y_j - \\sum_{i=1}^k x_{ij}\\beta_i)^2 \\quad (2.3)\n```\n\n\
    In matrix form, equation (2.3) can be written as\n\n```\n$S(\\boldsymbol{\beta})\
    \ = \\boldsymbol{\\varepsilon}^T\\boldsymbol{\\varepsilon} = (\\mathbf{y}-\\mathbf{X}\\\
    boldsymbol{\beta})^T(\\mathbf{y}-\\mathbf{X}\\boldsymbol{\beta}) \\quad (2.4)\n\
    ```"
