- pgno: 214
  md: "# 202 Overdispersion Models in SAS\n\napproach used in the Quasi-likelihood\
    \ Estimation method for multinomial data. While most of the QLE literature focuses\
    \ on a single scale factor for all categories, we illustrate a method of accommodating\
    \ a different scale factor for each category. Analogous to Chapter 4, we give\
    \ the two likelihood-based models, Dirichlet-multinomial and Random-clustered\
    \ Multinomial distributions, for modeling binomial overdispersion. The latter\
    \ is a multivariate generalization of the Random-clustered binomial distribution\
    \ described in Chapter 4. A brief description of their construction and properties\
    \ are followed by examples. In the case of binomial data, we use a Generalized\
    \ Linear Overdispersion Model (GLOM) which accommodates link functions to both\
    \ the vector of probabilities as well as the overdispersion parameters. The models\
    \ described in this chapter may be implemented in a variety of ways. In some cases,\
    \ we use the procedures and provide the codes we have developed. In addition to\
    \ using PROC LOGISTIC, we also illustrate the use of the UNMIXED procedure to\
    \ estimate some of the models described in this chapter.\n\n# 7.2 The Multinomial\
    \ Distribution\n\nThe Multinomial distribution is a generalization of the Binomial\
    \ distribution. Recall that the Binomial distribution arises as the number of\
    \ \"successes\" in m independent Bernoulli trials, with the same probability of\
    \ success $\\pi$ in each trial. We will write T $\\sim(\\pi;m)$ to denote the\
    \ count T is distributed as a Multinomial distribution with m trials and the probability\
    \ of success $\\pi$.\n\nThe Multinomial distribution arises as a natural extension\
    \ of the Binomial distribution when each independent trial has more than two mutually\
    \ exclusive outcomes. Consider a case of m independent repetitions (or trials)\
    \ of an experiment, each resulting in one of the (d+1) mutually exclusive events\
    \ $E_1,E_2,...,E_{d+1}$. In each repetition of the experiment, the probability\
    \ of occurrence of event $E_i$ is $\\pi_i$, with $\\sum\\pi_i=1$. Let $\\bf T}=(T_1,T_2,...,T_{d+1})$\
    \ denote the random vector of the number of occurrences of events $E_1,E_2,...,E_{d+1}$\
    \ out of m trials, with\n\n$\\sum_{i=1}^{d+1}T_i=m$. Let $\\bf t}=(t_1,t_2,...,t_{d+1})$\
    \ represent a representation of $\\bf T^*$. $\\sum_{i=1}^{d+1}t_i=m$. Then, the\n\
    \nvector $\\bf T$ is said to have a Multinomial distribution with parameters $(\\\
    pi';m)$, with $\\pi'=(\\pi_1,\\pi_2,...,\\pi_{d+1})$. The joint probability function\
    \ of $\\bf T^*$ is\n\n```\n$Pr(\\\bf T^*=\\bf t) = \\frac{m!}{t_1!t_2!...t_{d+1}!}\
    \ \\prod_{i=1}^{d+1} \\pi_i'^{t_i}$\n```\n\nThe special case of $d=1$, with two\
    \ mutually exclusive outcomes for each trial, corresponds to the Binomial distribution.\
    \ We then have a 2-dimensional random vector $\\bf T=(T,m-T)$ where $m-T$ is also\
    \ distributed as Binomial$(1-\\pi;m)$. Since m is known, the random variable $T$\
    \ does not provide additional information; therefore, one might reduce the dimensionality\
    \ of $\\bf T^*$ and conduct analyses, as we have shown in previous chapters, based\
    \ entirely on $T$. Similarly, in\n\nMorel, Jorge, and Nagaraj Neerajal. Overdispersion\
    \ Models in SAS®. Copyright ©2011, SAS Institute Inc., Cary, North Carolina, USA.\
    \ ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
  merge: -1
  img_proc: true
