  md: "# Chapter 10 Generalized Linear Overdispersion Mixed Models 349\n\n# Program\
    \ 10.2: Fitting a Poisson GLMM—Pump Reliability Data of Unit 1 of the Farley Nuclear\
    \ Plant\n\n```\n/*\nPump Reliability at a Pressured Water Reactor Nuclear Power\
    \ Plant\nGaver and O'Muirchheartaigh (1987)\nDraper (1996) */\n\ndata pump;\n\
    \  pump = _n t;\n  input group y;\n  logstd = log(t) - 2.5469400;\n  datalines;\n\
    \  1 1 94.320\n  1 5 62.880\n  1 14 127.560\n  1 19 31.440\n  2 1 15.720\n  2\
    \ 3 3.240\n  2 1 1.048\n  2 2 1.048\n  2 4 2.096\n  2 22 10.480;\n```\n\n```\n\
    ods html;\ntitle \"Pump Reliability at a Pressured Water Reactor Nuclear Power\
    \ Plant\";\nproc glimmix data=pump method=quad;\n  class group;\n  model y = group\
    \ logstd*group / noint dist=poisson link=log\n    solution ddfm=residual;\n  random\
    \ it / subject=pump;\n  estimate \"Difference Y-intercepts\" group 1 -1;\n  estimate\
    \ \"Difference Slopes\" group 1 -1;\nrun;\nods html close;\n```\n\nIn Analysis\
