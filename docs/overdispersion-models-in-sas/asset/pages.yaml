  md: "# Chapter 7 Likelihood Models for Overdispersed Multinomial Responses 241\n\
    \nKappa coefficient (κ), which compares the degree of observed agreement to the\
    \ agreement one would expect purely out of chance, is defined as\n\n```\n$$\\\
    kappa = \\frac{\\pi_0 - \\pi_c}{1 - \\pi_c}$ (7.39)$\n```\n\nIf the raters are\
    \ in complete agreement, κ = 1. If observed agreement is greater than or equal\
    \ to chance agreement, then κ ≥ 0. If observed agreement is less than chance agreement,\
