    # 2.4 Generalized Linear Models (GLM)


    Generalized Linear Models (GLM) is an extension of the linear regression model
    to accommodate non-normal response variables which are possibly even discrete.
    GLM formulation captures the essential commonality in the computation of MLE when
    responses are distributed according to a member of the exponential family of distributions,
    and the mean of the response variable is related to an unknown linear combination
    of the predictor variables via a known nonlinear function. Thus, GLM provides
    a unified approach to a large class of commonly used models such as linear regression,
    logistic and Poisson regression models, etc. In order to understand GLMs, three
    fundamental concepts are needed: the random component (response variable), the
    systematic component (predictor variables), and the link function.


    $Y_j, j=1,2,...,n$, represent $n$ independent random variables belonging to a
    specific distribution in the exponential family. We have $E(Y_j)=\mu_j$ and since
    the $Y_j$ belong to the exponential family.


    $Var(Y_j)=\phi v(\mu_j)$.


