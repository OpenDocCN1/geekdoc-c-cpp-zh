  md: '# Chapter 5 Goodness-of-fit Tests for Overdispersed Binomial Models 131


    Then, proceed to compute the GOF test in equation (5.4) with observed frequencies
    (5.5) and expected frequencies (5.7).


    The issue of degrees of freedom of the GOF warrants some discussion. Note that
    Gof test statistic is computed based on the maximum likelihood estimates, which
    are obtained from the raw data. On the other hand, the distributional result that
    the degrees of freedom of the GOF is $\nu=R-3$ is based on the assumption that
    the statistic is computed using the estimates from the grouped data. As illustrated
    in Chernoff and Lehmann (1954) and as discussed in Chapter 30 of Kendall, Stuart,
    and Ord (1991) and in Satradhar et al. (2008), there seems to be a recovery of
    degrees of freedom due to using the more efficient maximum likelihood estimator.
    Recommended degrees of freedom of our proposed GOF test lies between $\nu_l=(R-1)-(k+h)$
    and $

    u_u=(R-1)$. The lower bound $

    u_l$ corresponds to the case where the parameters are estimated, whereas the upper
    $

    u_u$ corresponds to the case when all the parameters are known. The results of
    the Simulation 5.4 support the use of $\nu=(R-1)-2$ degrees of freedom when the
    probability of success $\pi$ and the overdispersion parameter $\rho$ are common
    among the clusters.


    We illustrate the use of GOF test when using the present data from the epidemiological
    study conducted by Awa et al. (1971, 1978) on chromosome aberrations in survivors
    of the atomic bombs exploded in Hiroshima and Nagasaki. The study was conducted
    from January 1968 to November 1969 in Hiroshima and from January 1968 to March
    1971 in Nagasaki. The cases were selected from the A-bomb survivors who were resident
    in Hiroshima and Nagasaki for whom tentative radiation dose estimates were available.
    The controls consisted of two groups: those who were not in the cities at the
    time of bombing and those who were exposed to the bombs but estimated doses were
    less than 1 rad. Blood samples were taken and cytogenetic examinations were made
    on n=668 subjects from Hiroshima and n=403 from Nagasaki. We will focus on the
    Hiroshima data only; we would like to thank Prof. D. Moore for providing the data
    for this example. A total of 30 to 100 lymphocytes were examined from each subject
    and the number of chromosome aberrations (j-th subject) were recorded. Let $d$,
    denote, in rad, the radiation dose received by the unit of exposure in this study
    is believed to require more than one hit to cause an aberration, whereas a single
    hit is sufficiently to detect it. The total radiation dose considered here is
    the sum of the gamma and neutron components. Dose estimates exceeding 600 rad
    were reduced to 600. Prentice (1986) analyzed the chromosome aberrations data
    using an extended Beta-binomial model that allows for some degree of overdispersion.
    Moore (1987) extended the maximum likelihood estimation method for the Beta-binomial
    and a method based on the mean and variance to allow the modeling of the extra-binomial
    component as a function of the mean. In Prentice'' estimates of the radiation
    dose received were grouped, whereas in Moore'' these estimates were used without
    doing any grouping of the data. We will fill both the Beta-binomial and Random-clumped
    Binomial models using the Moore (1987) data set. As in the Effort (1986) example
    of Toxoplasmosis in El Salvador conducted in Section 3.4, we will standardize
    the radiation dose $d_j$


    More, Jorge, and Nagaraj Neeraraj. Overdispersion Models in SAS®. Copyright 2011,
    SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
