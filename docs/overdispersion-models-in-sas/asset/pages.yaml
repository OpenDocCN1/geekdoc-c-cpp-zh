  md: "# 10 Overdispersion Models in SAS\n\n```\nods html;\n\nproc means data=out\
    \ mean var maxdec=2;\n    var t;\n\nrun;\nods html close;\n```\n\nRecall that\
    \ one of the consequences of overdispersion in the data is inflated Type Errors.\
    \ Program 1.1 can be easily extended to a simulation to demonstrate this undesirable\
    \ effect. To this end, consider a sample of n=20 clusters each size m=5. The elemental\
    \ units within the clusters are treated as independent, then we will have a total\
    \ of 120 Bernoulli trials with the same probability of success π. We need to test\
    \ the null H₀:π=0.6 versus the alternative hypothesis H₁π>0.6. For the binomial\
    \ distribution, the Z-test at α=0.05 is to reject the null when\n\n$Z = \\frac{\\\
    pi-0.6}{\\sqrt{\\pi(1-\\pi)}}} > 1.644$. An estimate of the true Type I Error\
    \ can be obtained by\n\nperforming this on a series of overdispersed data sets\
    \ generated to be 0.160, and then by computing the number of rejections. Program\
    \ 1.2 provides the necessary statements to perform this simulation.\n\n# Program\
    \ 1.2: Estimating Type I Error Rate for Data Created in Program 1.1\n\n```\n*\
    \ Estimating actual Type I Error rate for overdispersed data;\ndata correlated_bernoulli;\
    \ --- This data was created in Program 1.1;\n    set correlated_bernoulli;\n \
    \   reps = ceil(id / 20); --- Creates 1000 reps of n=20 clusters of size m=5 each;\n\
    run;\nproc means data=correlated_bernoulli mean noprint;\n    class reps;\n  \
    \  var yr;\n    output=test mean=Pi_hat;\nrun;\ndata test;\nset test;\n    if\
    \ _type_ = 1;\n    z = (Pi_hat - 0.6) / sqrt(Pi_hat*(1-Pi_hat) / 100);\n    p\
    \ Val = 0;\n    if z > 1.644 then p Val = 1;\nrun;\ntitle \"Monte Carlo Estimate\
    \ of Type I Error Rate\";\nproc means data=test mean maxdec=3;\n    var P_val;\n\
    run;\n```\n\n$\\rho^2=0.3$, the estimated Type I Error runs out 0.160, about three\
    \ times the nominal level of 0.05. We can now rerun Programs 1.1 and Program 1.2,\
    \ appropriately concatenated for other values of $\\rho^2$. The following table\
    \ provides a summary for three runs using the same seed above convenience."
