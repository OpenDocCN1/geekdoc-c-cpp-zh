    # 4.1 Introduction


    In this chapter we will discuss several overdispersion models using the proper
    likelihood

    functions for binomial data. These models, applicable to binomial responses (i.e.,
    number of

    uccesses “T” out of “m trials”), are obtained by postulating different sets of
    assumptions

    corresponding to different mechanisms of underlying overdispersion. One family
    of the models

    is obtained by assuming that the probabilities of success of responses from one
    respondent to

    another, according to a certain distribution with domain in the zero-one interval.
    The

    unconditional distribution of T is then an overdispersed distribution with a likelihood
    function

    that allows for the joint estimation of probability of success and the overdispersion
    parameter.

