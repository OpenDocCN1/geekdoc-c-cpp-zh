    \ Example\");\nods graphics off;\n html close;\n```\n\nTable 5.6 provides the\
    \ MLEs under the Beta-binomial and Random-clumped Binomial models. All the terms\
    \ in each are highly significant (P-value < 0.0001). We found (not reported here)\
    \ that cubic of the beta estimates were not statistically significant. The corresponding\
    \ P-values were 0.17 under the Beta-binomial model and 0.8 under the Random-clumped\
    \ Binomial. This seems reasonable to assume that the probability of observing\
    \ a chromosome aberration is a quadratic function (through the logistic mean)\
    \ of the standardized radiation dose received, and the degree of overdispersion\
    \ varies (via the logistic function) as a linear function of the standardized\
    \ radiation dose received. Higher order combinations can be tried by simple modification\
