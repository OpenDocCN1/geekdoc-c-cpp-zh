- pgno: 277
  md: "# Chapter 8 A Two-stage Maximum Likelihood Estimation Procedure 265\n\n**Stage\
    \ 2.** Once convergence is achieved for the computation of $\\hat{\theta}$, the\
    \ estimator $\tilde{\theta} = (\\hat{\\pi}', \\hat{\nho}')$ is obtained by performing\
    \ the extra step\n\n```\n$$\\tilde{\theta} = \\hat{\theta} + \\left\\{n \\mathbf{1}(\\\
    hat{\theta})\\right\\\\}^{-\\frac{1}{2}} \\frac{\\partial L}(\\hat{\theta})}{\\\
    partial \\theta} \\quad (8.5)$\n```\n\nHere, $\\hat{\theta}$ is the FIM for a\
    \ single observation evaluated at $\\theta = \\hat{\theta}$. For this final step,\
    \ the updated variance-covariance matrix of $\\tilde{\theta}$ is $\\{n \\mathbf\
    \ 1}(\\hat{\theta})\\}^{-1/2}$. The resulting estimator will be denoted\n\nby\
    \ $\\tilde{\theta} = (\\hat{\\pi}', \\hat{\nho}')$.\n\nBefore proceeding, let\
    \ us review the impact of the approximations in the computation of maximum likelihood\
    \ estimators. We first note that there are $(d+1)(d+2)$ unique elements in each\
    \ of these Fisher information matrices. Each element of $I_{RCM}$ is a\n\nsummation\
    \ over the multinomial space $\\Omega$ containing $\\frac{(m+d)!}{md!}$ terms.\
    \ Thus, it will take $(d+1)(d+2)$ times $\\frac{(m+d)!}{md!}$ operations to compute\
    \ all the elements of the RCM distribution. For $m=100$ and $d=3$, which turns\
    \ out to be 176,851, each term in the summation involves computing several multinomial\
    \ probabilities. On the other hand, the approximations of summations create huge\
    \ computational savings. Since multinomial probabilities do not appear in the\
    \ limiting expressions, further computational savings will be realized. In the\
    \ case of DM, as mentioned earlier, each element of the FIM can be actually computed\
    \ as an expectation respect to a Beta-binomial distribution. Therefore, the summation\
    \ for each element of DM contains only $m$ terms. Thus, the savings due to ‘not\
    \ having to loop’ is $\\frac{(d+1)(d+2)}{2}$ times $m$, and is not as significant\
    \ as it is in the case of the RCM distribution.\n\n# 8.4 The Forest Pollen Count\
    \ Revisited\n\nIn Section 70 we discussed Mossmann's (1962) classic example with\
    \ types of forest pollen (pine, fir, and alder) under a total of $m=100$ forest\
    \ pollen grains was reached. This was the first example in the literature where\
    \ the DM distribution was used to model overdispersion. The data which can be\
    \ found in Table 7.5, were used to illustrate the maximum likelihood estimation\
    \ under the DM and RCM models. The programming statements for reading the forest\
    \ count can be found in Program 7 of Chapter 7. The maximum likelihood results\
    \ obtained by invoking the macro DirMult_RCM were reported in Table 7.6. The algorithm\
    \ uses FIM $\\hat{\theta}_{(s)}$. Mossmann (1962) is an interesting example for"
