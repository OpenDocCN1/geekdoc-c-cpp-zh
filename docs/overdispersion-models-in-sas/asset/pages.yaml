    \ and common correlation.\n\n# 4.5 A Generalization of the Binomial Distribution\n\
    \nAltham (1978) proposed two generalizations of the Binomial distribution which\
    \ the Bernoulli outcomes are identically distributed but not independent. The\
    \ proposed generalizations led to a two-parameter distribution where m variables\
    \ are assumed to have a symmetric joint distribution with no second or higher\
    \ 'order' interactions. Different generalizations are obtained depending on whether\
    \ the 'additive' or 'multiplicative' definition of 'interaction' for discrete\
    \ variables is used. These two generalizations allow the variance to be greater\
    \ or less than the variance under the Binomial distribution. In other words, Altham's\
    \ generalizations allow for either overdispersion or undersdispersion. We will\
    \ focus only on the 'additive' generalization. This additive model was published\
