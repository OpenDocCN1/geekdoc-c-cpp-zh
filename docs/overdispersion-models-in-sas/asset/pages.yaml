    We consider the ZINB GLOMM


    ```

    $y_{ij} \text{ given } (x_{ij}; u_{ij}) \sim \text{Zero-inflated Negative-binomial}(\lambda_{ij},
    \kappa, \omega),\

    \log(\lambda_{ij}) = \beta_0 + \beta_1 x_{ij} + u_{ij}$

    ```


    where $\kappa$ is the overdispersion parameter, $\omega$ is the additional proportion
    of zeros relative to the Negative-binomial distribution, $u_{ij}$ are independent
    and identically distributed Normal$(0, \sigma^2)$, and


    ```

    $x_{ij} = \begin{cases} 1 & \text{if subject is in group 1} \ 0 & \text{otherwise}.
    \end{cases}$

    ```'
