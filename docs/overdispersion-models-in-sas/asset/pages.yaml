    \ 954.35 | 1 | 0.0007 |\n\n# 3.5 A Carcinogenesis Pre-clinical Experiment\n\n\
    The aim of this example is to provide a simple application of an overdispersed\
    \ Poisson model. Similar to Binomial models, overdispersed Poisson models are\
    \ used to accommodate higher variability in the data permitted by the Poisson\
    \ model. In a clinical experiment analyzed by Gail (1980) and by Lawless (1987),\
    \ a total of 76 female rats were injected with a carcinogen for mammary cancer.\
    \ Then, all animals were given Retinol Acetate to prevent mammary cancer for 60\
    \ days. After this phase, the 48 animals that remained tumor-free were randomly\
    \ assigned to continue the Retinoid prophylaxis (n=23) or Control (n=25). Rats\
    \ were then pelted for tumors twice weekly, and observations ended 182 days after\
    \ the initial carcinogen injections. The main objective of analysis was to assess\
    \ the difference in the development of tumors between the Retinoid and Control\
    \ groups. The times of occurrences to mammary tumors as well as the number of\
    \ tumors during the 182-day phase can be found in Gail et al. (1980). Table 3.4\
    \ contains only the number of tumors of the 48 rats."
