  md: "Negative-binomial model does not fit the data, since the Chi-square statistic\
    \ turned out to be 23.22 with an associated P-value of 0.0016. On the other hand,\
    \ the Zero-inflated Negative Binomial model seems to fit the data reasonably well.\
    \ Under the ZINB distribution, the value of the Chi-square statistic turned out\
    \ to 10.58 with an associated P-value of 0.1023. Recall that degrees of freedom\
    \ are calculated as (Number of Categories minus one) (Number of Parameters in\
    \ the Model). The reported Chi-square statistics under the NB and ZINB models\
    \ by Cohen’s (1966) were 24.53 and 10.60, respectively. These data are also amenable\
    \ to being modeled by Poisson and Zip, however do not fit the data. We will provide\
    \ an illustrative example of ZIP in the next section.\n\nNow, we discuss the parameter\
    \ estimates of the ZINB model. Assuming that the n=926 inhabitants exclaimed to\
    \ a “representative” sample of the inhabitants of the village, under the ZINB\
    \ model, then the estimated proportion of non-infected inhabitants in the village\
    \ is $\\omega=0.4680(46.8\\%)$, whereas the estimated proportion of infected inhabitants\
    \ in the village is $(1-\\hat{\\omega}) = (1-0.4680) = 0.5320(53.2\\%)$. Note\
    \ that there is a proportion of zeros coming from the NB. The contribution of\
    \ zeros by NB, representing the individuals who are falsely deemed to be de-free\
    \ by the medical test, is\n\n$(1-\\hat{\\omega})\\frac{1}{1+\\hat{\\kappa}} =\
    \ (0.5320)\\frac{1}{1+(0.8213)(1.7052)} = (0.5320)(0.3443) \\approx 0.1832$.\n\
    \nNote that $0.4680+0.1832=0.6512$, which is equal to, all the zeros observed\
    \ in the data. Thus, out of the n=926 inhabitants exclaimed, $926(\\hat{\\omega})=926(0.4680)=433$\
    \ were infected and $926(1-\\hat{\\omega})=926(1-0.4680)=493$ were infected. The\
    \ estimated standard errors of these estimated totals turned out to be $926(0.0546)=50.56$.\
    \ Cohen pointed out in his 1966 paper that $(926-603)=323$ of those were infected\
    \ by the presence of at least one trematode in their slides. There were approximately\
    \ $(493-323)=170$ additional subjects of the group unidentified. The mean of eggs\
    \ in a single sample is estimated under the ZINB to be $(1-\\hat{\\omega})\\mu=(0.5320)(1.7052)=0.9072$,\
    \ which agrees with the estimated mean under NB model; it is equal to the average\
    \ number of eggs per sample from data table. The models account for the variance\
    \ in different variables. The programming statements for fitting the ZINB model\
    \ using NLMIXED, along with the resulting parameter estimates, are provided below.\
    \ This is in order to help the reader have a better understanding of the ZINB\
    \ models.\n\n```\nods html;\ntitle \"zero-inflated-Negative-Binomial model using\
    \ NLMIXED\";\nproc nlmixed data=df_6;\nparams Intercept=0_Inf_Intercept=0_Alpha=0.5;\n\
    w = 1 / (1 + exp(-Inf_Intercept));\nmu = exp(Intercept);\na = 1 / Alpha;\np =\
    \ 1 / (1 + Alpha*mu);\nz = gamma(y+a) - gamma(a) - gamma(y+1);\nif y< 0\n 11 =\
    \ log(w + (1-w)*p**a);\n```"
