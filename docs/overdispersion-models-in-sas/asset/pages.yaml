  img_proc: true
- pgno: 350
  md: '# 338 Overdispersion Models in SAS


    ![](img/fa69b648c17ad451eb7eb4ad8d92f5fb_350_0.png)


    The Generalized Linear Models (GLM) framework provided by McCull and Nelder (1989)
    unifies the analysis of continuous and discrete response variables when the responses
    can be assumed to be independent. The GLM framework was extended by Zeger, Liang,
    and Albert (1998) to include random effects. The resulting models, Generalized
    Linear Mixed Models (GLMM), can accommodate the analysis of longitudinal data
    where subjects are monitored over a period of time. GLMM can also be used to analyze
    observations obtained on different subjects from a cluster, like those usually
    in cluster sampling. As indicated earlier, overdispersed Binomial (or Multinomial)
    data are usually a result of natural association among observations from the same
    cluster. Thus we provide a brief review of GLM in this chapter.


    Morel, and Nagaraj Neeraj. Overdispersion Models in SAS®. Copyright © 2011, SAS
    Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional
    SAS resources, visit support.sas.com/publishing.'
