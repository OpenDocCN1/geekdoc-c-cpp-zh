    where $e_i = y_i - \hat{\mu}_i, \Omega = (\mathbf{D}'' \Sigma^{-1} \mathbf{D})$
    and $m$ is the number of clusters (also referred to as Primary Sampling Units
    in the survey sampling terminology). Note that $\Omega$ is a generalized inverse
    of $(\mathbf{D}'' \Sigma^{-1} \mathbf{D})$. Formula (9.26) incorporates a variety
    of small sample corrections into the variance of the covariance estimator


    ```

    $$\widehat{Var}(\hat{\beta}) = \hat{\Omega} \sum_{i=1}^m \hat{\mathbf{D}}_i''
    \Sigma_i^{-1} e_i e_i'' \Sigma_i^{-1} \hat{\mathbf{D}}_i. \eqno(9.27)$

    ```


    Definition of the constant $c$ and the matrices $\mathbf{A}_i$ and $\mathbf{F}_i$
    in (9.26) for various options can be found in the PROC GLIMMIX documentation.
    Table 9.6 provides the multiplicative corrections currently available in GLIMMIX.
    The example presented in PROC with the option EMPIRICAL-options. The default option
    is the CLASSICAL option which computes the variance estimate (9.27).


    # Table 9.6: Multiplicative Small Sample Bias Corrections in GLIMMIX


    | EMPIRICAL- | c | A_i | F_i | Reference |

    |---|---|---|---|---|

    | CLASSICAL | 1 | I | I | Liang and Zeger (1986) Zeger and Liang (1986) |

    | DF | $m-k$ m > k | I | I | |

    | | 1 otherwise | | | |

    | ROOT | | I | $(I-H_i)^{-1/2}$ | Kauermann and Carroll (2001) |

    | FIRORES | 1 | I | $(I-H_i)^{-1}$ | Mancl and DeRouen (2001) |

    | FIROEEQ(r) | 1 | $Diag\{1-\min[r_i,[Q_i]]\}^{-1/2}\}$ | I | Fay and Grubard
    (2001) |


    The Morel, Bokossa and Neerhaal (2003) small sample bias corrections, which can
    be invoked with the option EMPIRICAL-MBN, is defined as


    ```

    $$\widehat{Var}(\hat{\beta}) = c \times \hat{\Omega} \sum_{i=1}^m \hat{\mathbf{D}}_i''
    \Sigma_i^{-1} e_i e_i'' \Sigma_i^{-1} \hat{\mathbf{D}}_i + \delta_i \phi_i \hat{\Omega}.
    \eqno(9.28)$

    ```


    where


    $c = \frac{m^*-1}{m*-k} \frac{m^*}{m-1}$ $m^*$ number of observations and $m$
    number of "subjects",


