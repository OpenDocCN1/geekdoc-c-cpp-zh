  md: '# Chapter 2 Generalized Linear Models 35


    # Program 2.3: Fitting a Binomial Model with Probit and Logit Links to the Dosage-

    Mortality Data of Pyrethins Using PROC PROBIT


    ```

    ods html;

    title1 "Dosage-Mortality of Pyrethins on Male Flies, Murray (1938)"

    title2 "GLM with Binomial Distribution and Logit Link using PROC PROBIT";nproct
    probit data=pyrethins log;

    model t/m = dose / dlogistic inversecl;

    run;

    title "Dosage-Mortality of Pyrethins on Male Flies, Murray (1938)"

    title2 "GLM with Binomial Distribution and Probit Link using PROC PROBIT";nproct
    prob data=pyrethins log;

    model t/m = dose / inversecl;

    run;

    ods html;

    ```


    The option "log" in the PROC requests the analysis performed on the natural logarithm
    of dose. The option "inversecl" provides the Lethal Dose (LD) estimates in increments
    of 1% that kill from 1% to 99% of the population. These LDs are calculated on
    the log scale and on the dosage scale. Selected results are produced in output
    2.3.


