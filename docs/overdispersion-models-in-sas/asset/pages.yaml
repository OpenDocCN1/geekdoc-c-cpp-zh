    # 4.7 Characterization of the Beta-binomial and Random-clumped Binomial Distributions


    As we have seen earlier in this session, the Beta-binomial and the Random-clumped
    Binomial are two distributions that arise by considering different prior distributions
    on the probability of success. It can be shown for cluster size m = 2 these distributions
    are identical for any two priors with the same mean and variance. To this, consider
    Pr(T = 0). Note that


    > $Pr(T = 0) = \int_0^1 (1-P)^2 f(P) dP = 1 + E_i(P^2) + \{E_i(P)\}^2 - 2E_i(P),$$


    which is a function of the first two moments of the prior distribution f(P). Thus,
    for any two priors f(P) and g(P) with equal two moments, Pr(T=0) is the same.
    Similarly, this is true for Pr(T=1) and Pr(T=2).


    For a given $\pi$, $\rho$ and m, the Beta-binomial and Random-clumped Binomial,
    as indicated, have identical means and variances. They are given in equations
    (4.4) and (4.5). In the chromosome example previously analyzed where the cluster
    size m = 3, the Beta-binomial and the Random-clumped Binomial distributions provided
    almost identical results. For small m, these distributions are difficult to discriminate
    and will provide in practice essentially the same fit. As m increases, these two
    distributions become more and more distinguishable. In Chapter 8 we will discuss
    the properties of Beta-binomial and Random-clumped Binomial distributions when
    the cluster sizes are large. As will be illustrated in figures later in this section,
    it turns out that as m grows, the differences between them become more substantial.


    In order to provide a better characterization of those two distributions that
    overdispersion, we want to quantify their coefficients of skewness and kurtosis,
    in addition to providing their functions.'
