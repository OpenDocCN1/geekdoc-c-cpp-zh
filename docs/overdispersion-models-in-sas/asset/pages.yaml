    \ Many methods of taking overdispersion into account in commonly used models are\
    \ discussed in this book.\n\n# 1.6 The Exponential Family\n\nThe main tasks to\
    \ be covered in this book, namely Quasi-likelihood Functions, Generalized Linear\
