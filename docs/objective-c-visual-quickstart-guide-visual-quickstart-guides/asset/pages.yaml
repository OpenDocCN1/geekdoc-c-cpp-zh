  md: "Chapter 3\n\n**44**\n\n**Handling Data**\n\nYou can then refer to the value\
    \ of integer as \n\n\\*pointer like this:\n\n#include <stdio.h>\n\nint main( ){\n\
    \n  int integer, \\*pointer;\n\n  integer = 1;\n\n  pointer = &integer;   \n\n\
      \\*pointer = 2;\n\n  printf(\n\n    “The value of the integer is: %i”, \n\n\
        \\*pointer);\n\n  return 0;}\n\nPointers are very important in Objective-C\
    \ \n\nbecause you use them to create objects. For \n\nexample, text strings in\
    \ Objective-C are usu-\n\nally NSString objects (the “NS” part stands \n\nfor\
    \ NeXtStep, the name of the organization \n\nthat originally created these objects).\
    \ To \n\ncreate a text string in Objective-C, you create \n\na pointer to a NSString\
    \ object. You can pass \n\nthat object the message cString to have it \n\nreturn\
    \ a C-style string that printf( ) can print:\n\n#include <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \nint main(void){\n\n  NSString \\*helloString = \n\n    @”Hello there.”;\n\n\
      printf(“%s\\\\n”, \\[helloString cString\\]);\n\n  return 0;}\n\n** tip**\n\
    \nHere’s an important point: To create \n\nobjects of any class that begins with\
    \ \n\nNS, you must include the Objective-C \n\nFoundation header file (the #include \n\
    \n<Foundation/Foundation.h> line in the \n\ncode here). \n\n From the Library\
    \ of Wow! eBook"
