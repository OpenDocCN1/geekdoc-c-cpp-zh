  md: "Directing Program Flow\n\n**29**\n\n**Using the else Statement**\n\n**Using\
    \ the switch **\n\n**Statement**\n\nIf you have many conditions to test, you may\
    \ \n\nwant to use a switch statement instead of \n\nmultiple if-else statements.\
    \ You can test \n\ntext strings (coming up in the next chapter) \n\nor integers\
    \ with the switch statement. When \n\na case statement that matches the value\
    \ \n\nin the variable you’re testing is found in the \n\nswitch statement, the\
    \ corresponding code \n\nis executed. \n\nThe following example tests for various\
    \ tem-\n\nperatures, executing code for each temperature:\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n  int temperature = 73;\n\n  switch(temperature)\n\n\
      {\n\n    case 71:\n\n      printf(“Could be a little \n\n        warmer.\\\\\
    n”);\n\n      break;\n\n    case 72:\n\n      printf(“Perfect weather.\\\\n”);\n\
    \n      break;\n\n    case 73:\n\n      printf(“It’s a little warm.\\\\n”);\n\n\
          break;\n\n    default:\n\n      printf(“Unknown temperature.\\\\n”);\n\n\
      }\n\n  return 0;\n\n}\n\n From the Library of Wow! eBook"
