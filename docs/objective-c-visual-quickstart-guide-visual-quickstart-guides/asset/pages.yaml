  md: "Chapter 2\n\n**26**\n\n**Using the if Statement**\n\n**Using the if Statement**\n\
    \nThe if statement is the most basic of the \n\nprogram flow control statements.\
    \ This state-\n\nment lets you test a condition, and if the con-\n\ndition is\
