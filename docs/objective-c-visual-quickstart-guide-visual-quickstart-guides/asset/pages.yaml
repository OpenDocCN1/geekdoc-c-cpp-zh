  md: "Chapter 1\n\n**6**\n\n**Compiling and Running Your First Program**\n\n**Compiling\
    \ and running **\n\n**Your First Program**\n\nTo run an Objective-C program, you\
    \ first \n\nhave to compile it, which makes Objective-C \n\nconvert your code\
    \ into the machine language \n\nthat your computer can understand.\n\nWhen you\
    \ run the first program, you should \n\nsee this result:\n\nWelcome to Objective-C!\n\
    \nThe Objective-C language comes built \n\ninto Mac OX 10.6, but not Linux, UNIX,\
    \ or \n\nWindows, so you’ll have to download it. \n\nIf you’re using Linux or\
    \ UNIX, go to http:// \n\nwww.GNUstep.org/resources/sources.html \n\nand download\
    \ and install GNUstep, which \n\ngives you the Objective-C compiler.\n\nIf you’re\
    \ using Windows, go to http://www. \n\nGNUstep.org/experience/Windows.html \n\n\
    and download the Windows installer for \n\nGNUstep and run it to install GNUstep.\
    \ \n\n**to compile and run your first **\n\n**Objective-C program on the Mac:**\n\
    \n**1.** In Xcode, on the Project window toolbar, \n\nclick the Build and Run\
    \ button.\n\nYou should see this message:\n\nWelcome to Objective-C!\n\nCongratulations,\
    \ you’ve run your first \n\nObjective-C program!\n\n From the Library of Wow!\
    \ eBook"
  merge: -1
