  md: "Handling Data\n\n**51**\n\n**Using Pointers**\n\n**Using Pointers**\n\nPointers\
    \ hold the address in memory of data \n\nitems. You declare a pointer by prefacing\
    \ it \n\nwith an asterisk (\\*):\n\n  int integer, \\*pointer;\n\nThen you can\
    \ use the & operator to get the \n\naddress of a variable in memory and assign\
    \ it \n\nto the pointer:\n\n  integer = 1;\n\n  pointer = &integer;   \n\nUsing\
    \ the asterisk again, you can refer to the \n\ndata pointed to by the pointer::\n\
    \n  \\*pointer = 2;\n\n**to use pointers:**\n\n**1.** Create a new program named\
    \ \n\n**pointers.m**.\n\n**2.** In pointers.m, enter the code shown in \n\n**Listing\
    \ 3.9**. \n\nThis code creates the pointer and \n\nassigns it the address of the\
    \ variable \n\nnamed integer.\n\n**3.** Assign a new value to the memory location\
    \ \n\npointed to by the pointer and display the \n\ndata stored in that location\
    \ (**Listing 3.10**). \n\n**4.** Save pointers.m.\n\n**5.** Run the pointers.m\
    \ program. \n\nYou should see the following:\n\nThe value of the integer is: 2\n\
    \n#include <stdio.h>\n\nint main( )\n\n{\n\n  int integer, \\*pointer;\n\n  integer = 1;\n\
    \n  pointer = &integer;   \n\n        .\n\n        .\n\n        .\n\n  return 0;\n\
    \n}\n\n**Listing 3.9 **Starting pointers.m.\n\n#include <stdio.h>\n\nint main( )\n\
    \n{\n\n  int integer, \\*pointer;\n\n  integer = 1;\n\n  pointer = &integer;   \n\
    \n** \\*pointer = 2;**\n\n** printf(**\n\n** “The value of the integer is: %i”,\
    \ **\n\n** \\*pointer);**\n\n  return 0;\n\n}\n\n**Listing 3.10 **The pointers.m\
    \ program.\n\n From the Library of Wow! eBook"
