  md: "Getting Started: Essential Objective-C\n\n**21**\n\n**Changing Type with Cast\
    \ Operators**\n\n**Changing type with **\n\n**Cast Operators **\n\nSuppose you\
    \ want to find the modulus of two \n\nfloating-point numbers in a program named\
    \ \n\ncast.m. You might enter the following code:\n\n  float x = 5;\n\n  float y = 3;\n\
    \n  int result = 0;\n\n  result = x % y;\n\nWhen you run this code, however, the\
    \ \n\nObjective-C compiler returns an error \n\nmessage:\n\ncast.m: In function \\\
    `main’:\n\ncast.m:12: error: invalid operands to  \n\nbinary %\n\nThe problem\
    \ is that the modulus opera-\n\ntor needs integer operands. To solve this \n\n\
    problem, you can temporarily convert the \n\nfloating-point variables to integer\
    \ variables \n\nwith the (int) cast operator, like this:\n\n  float x = 5;\n\n\
      float y = 3;\n\n  int result = 0;\n\n** result = (int) x % (int) y;**\n\nNow\
    \ everything works fine. \n\nYou can use cast operators to convert \n\nbetween\
    \ various types: (int), (float), \n\n(long), and so on. \n\n From the Library\
    \ of Wow! eBook"
