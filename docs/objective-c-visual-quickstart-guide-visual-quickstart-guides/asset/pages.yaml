  md: "Chapter 1\n\n**8**\n\n**Using Variables**\n\n**Using Variables**\n\nIn Objective-C\
    \ programs, you can store your \n\ndata in variables, which are placeholders for\
    \ \n\nthat data. \n\nFor example, say you have $1 million in your \n\nbank account\
    \ and want to keep track of \n\nit; you can store that amount in a variable \n\
    \nnamed amount, like this:\n\n  int amount = 1000000;\n\nThis code creates a variable\
    \ that stores inte-\n\ngers (again, that’s the int part) and initializes \n\n\
    the value in the amount variable to 1000000. \n\nTo display the value in the amount\
    \ variable, \n\nyou can use printf( ):\n\n   printf (“The amount in your account is\n\
    \n     $%i\\\\n”, amount);\n\nThis code prints the string “The amount in \n\n\
    your account is “ to start. The %i code is a \n\nplaceholder that will be replaced\
    \ by the inte-\n\nger variable that follows the quoted string, \n\nwhich is the\
    \ amount variable. (The \\\\n entry is \n\nthe newline code, which makes the text\
    \ skip \n\nto a new line.)\n\nWhen this program runs, you’ll see the value \n\n\
    in the amount variable displayed like this:\n\nThe amount in your account is $1000000\n\
    \n**to use variables:**\n\n**1.** Enter the code shown in **Listing 1.2** in \n\
    \na new program, **account.m**.\n\n**2.** Create the new variable named amount\n\
    \nand initialize it to 1000000 (**Listing 1.3**).\n\n**3.** Display the value\
    \ in the amount variable \n\n(**Listing 1.4**).\n\n**4.** Build and run the account.m\
    \ program. \n\nYou should see this result:\n\nThe amount in your account is  \n\
    \n$1000000\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n        .\n\n        .\n\
    \n        .\n\n}\n\n**Listing 1.2 **Creating account.m.\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n** int amount = 1000000;**\n\n        .\n\n        .\n\
    \n        .\n\n}\n\n**Listing 1.3 **Editing account.m.\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n  int amount = 1000000;\n\n** printf (“The amount in\
    \ your account is **\n\n** $%i\\\\n”, amount);**\n\n** return 0;**\n\n}\n\n**Listing\
