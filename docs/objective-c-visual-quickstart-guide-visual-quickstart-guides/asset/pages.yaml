    \n  @”blue”, nil\\];\n\n** printf(“array\\[0\\] = %s”, \\[\\[array **\n\n** objectAtIndex:\
    \ 0\\] cString\\]);**\n\n}\n\nIn this task, you’ll see how to access individual\
    \ \n\nelements with the objectAtIndex message. \n\n**to access individual elements:**\n\
    \n**1.** Create a program named \n\n**accesselements.m**.\n\n**2.** In accesselements.m,\
