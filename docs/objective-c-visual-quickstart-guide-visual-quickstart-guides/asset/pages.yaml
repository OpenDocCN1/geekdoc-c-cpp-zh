  md: "**99**\n\n**Object-Oriented Programming**\n\n**6**\n\nIn this chapter, we take\
    \ a deeper look at \n\nobject-oriented programming in Objective-C.\n\nWe start\
    \ by using *access specifiers—*@public\n\n(the default), @private, and @protected*—*to\
    \ \n\nset the access allowed to members (both \n\nmethods and data members such\
    \ as vari-\n\nables) of an object. \n\nWe also explore how to use *class variables—\
    \ *\n\nthat is, variables that are associated with a \n\nclass, not just an object\
    \ (in fact, all objects of \n\nthat class share the class variables).\n\n*Polymorphism*\
    \ refers to using the same code \n\nfor different kinds of objects, and we see\
    \ how \n\nthat works in Objective-C, too.\n\nIn addition, we explore how to check\
    \ whether \n\nan object supports a particular method \n\nbefore trying to use\
    \ that method, how to \n\ndetermine the class of an object—and more.\n\nObject-\
