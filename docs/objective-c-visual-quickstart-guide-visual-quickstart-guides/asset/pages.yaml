  md: "Chapter 7\n\n**136**\n\n**Using Constructors with Inheritance**\n\n**Using\
    \ Constructors **\n\n**with Inheritance **\n\nWhat if the base class has a constructor?\
    \ You \n\ncan call a base class’s constructor, passing to \n\nit any arguments\
    \ you want, when you use the \n\nsuper keyword. The super keyword allows \n\n\
    you to access the base class in your code \n\nIn this task, you’ll access the\
    \ base class’s \n\nconstructor.\n\n** tip**\n\n*Super* refers to superclass,\
    \ another word \n\nfor the base class.\n\n**to use constructors with inheritance:**\n\
    \n**1.** Create a new program named \n\n**constructor.m**.\n\n**2.** In constructor.m,\
    \ enter the code shown in \n\n**Listing 7.17**. \n\nThis code creates the Class1\
    \ class that \n\nhas a constructor named init that uses \n\nthe super keyword.\n\
    \n#import <stdio.h>\n\n#import <Foundation/NSObject.h>\n\n@interface TheClass: NSObject\n\
    \nstatic int count;\n\n+(int) getCount;\n\n@end\n\n@implementation TheClass\n\n\
    \\-(TheClass\\*) init \n\n{\n\n    self = \\[super init\\];\n\n    count++;\n\n\
        return self;\n\n}\n\n+(int) getCount \n\n{\n\n    return count;\n\n}\n\n@end\n\
    \nint main(void) \n\n{\n\n  TheClass \\*tc1 = \\[TheClass new\\];\n\n  printf( “TheClass count is %i\\\
    \\n”, \n\n    \\[TheClass getCount\\] );\n\n    \n\n  TheClass \\*tc2 = \\[TheClass new\\\
    ];\n\n  printf( “TheClass count is %i\\\\n”,  \n\n    \\[TheClass getCount\\] );\n\
    \n  return 0;\n\n}\n\n        .\n\n        .\n\n        .\n\n**Listing 7.17 **Starting\
    \ constructor.m.\n\n From the Library of Wow! eBook"
