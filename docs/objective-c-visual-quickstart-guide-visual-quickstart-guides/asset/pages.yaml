  md: "**viii**\n\n**Introduction**\n\n**i**\n\nWelcome to Objective-C. This book\
    \ is your \n\nguided tour of this exciting language, and \n\nit gives you what\
    \ you need to start working \n\nwith Objective-C at once.\n\nUsing Objective-C,\
    \ you can write professional \n\nprograms that make use of many object-\n\noriented\
    \ features—from the basics up to \n\nadvanced class inheritance and exception\
    \ \n\n(run-time error) handling.\n\nObjective-C runs on many different platforms.\
    \ \n\nFor the most part, your code should work \n\nunchanged on all platforms\
    \ that Objective-C \n\nsupports, but where differences in support \n\nexist, this\
    \ book points them out to you.\n\nThis book starts with the basics and contin-\n\
    \nues on through advanced topics. You’ll begin \n\nby looking at how to get Objective-C\
    \ started \n\nand how to run basic programs. From there, \n\nyou’ll explore data\
    \ handling, again start-\n\ning with the basics and moving on through \n\nadvanced\
    \ topics.\n\nAfter looking at how to write your own \n\nfunctions, you’ll wrap\
    \ functions and data \n\ntogether into objects—the core of Objective-C \n\nprogramming.\
    \ And when you start working \n\nwith object-oriented programming, the lid is\
    \ \n\noff—and we’ll push the envelope as far as it \n\ncan go.\n\nIntroduction\n\
    \nThat’s the plan, then: to present a guided tour \n\nof Objective-C, taking you\
    \ from the beginning \n\nto the most advanced topics. Let’s get started \n\nwith\
    \ Chapter 1 now.\n\n From the Library of Wow! eBook"
  merge: -1
  pgno: 8
- img_proc: true
  md: "**1**\n\n**Getting Started: Essential Objective-C**\n\n**1**\n\nThis book takes\
    \ you on a guided tour of \n\nObjective-C, from the basics on up through \n\n\
    the cool stuff.\n\nObjective-C is a cross-platform language, so \n\nyou’ll find\
    \ it on many systems: the Mac, of \n\ncourse, but also Linux, UNIX, Windows, and\
    \ \n\nmore—and its core programming code stays \n\nthe same across all those platforms.\n\
    \nObjective-C is actually a layer built on \n\ntop of the C language, and everything\
    \ that \n\nworks in standard (that is, ANSI) C works \n\nin Objective-C. Objective-C\
    \ also adds tons \n\nof object-oriented features to the original \n\nC language.\n\
    \nThe way it uses objects is what makes \n\nObjective-C so popular, but just what\
    \ is an \n\nobject? Object-oriented programming was \n\nintroduced when programs\
    \ began to get very \n\nlarge and the structure of the code began to \n\nget in\
    \ the way. Object-oriented programming \n\nlets programmers wrap whole sections\
    \ of \n\ntheir code into easily handled, self-contained \n\n*objects* and so let\
    \ them break up their code.\n\n*continues on next page*\n\nGetting \n\nStarted:\
    \ \n\nEssential Objective-C\n\n From the Library of Wow! eBook"
  merge: -1
  pgno: 9
- img_proc: true
  md: "Chapter 1\n\n**2**\n\n**Getting Started: Essential Objective-C**\n\nFor example,\
    \ say you have a bowl of pudding \n\nthat you want to keep cold. You could set\
    \ \n\nup a system of coolant pipes, switches, and \n\ndials that cool your pudding\
    \ but which take \n\nyour constant attention: you have to watch \n\nthe temperature,\
    \ and when the pudding gets \n\ntoo warm, you have to turn on the coolant \n\n\
    compressor and pump and so on; when the \n\npudding gets cold enough, you have\
    \ switch \n\nthose things off.\n\nThat was the old way of programming, with \n\
    \nthe guts of every item in your program laid \n\nbare to the whole rest of the\
    \ program.\n\nObject-oriented programming, by contrast, \n\nlets you wrap all\
    \ that functionality into a sin-\n\ngle object: a refrigerator. The refrigerator’s\
    \ job \n\nis to keep things like pudding cold without \n\na lot of fuss on your\
    \ part. It is responsible for \n\nmaintaining its own internal state—that is,\
    \ \n\nremaining cold inside. It has thermostats and \n\nrelays and the like to\
    \ automatically handle \n\nthe jobs you previously did manually. So if \n\nyou\
    \ want your pudding kept cold, simply put \n\nit in the refrigerator. All the\
    \ details are hidden \n\nfrom view, and your kitchen becomes a much \n\neasier\
    \ place to handle conceptually.\n\nSo it is with object-oriented programming.\
    \ \n\nNow you can wrap code and data together into \n\nobjects that are self-contained,\
    \ and because all \n\nthe details are hidden, your interaction with \n\nthose\
    \ objects becomes a lot simpler.\n\nThat’s the secret behind object-oriented \n\
    \nprogramming: divide and conquer.\n\nIn this book, you’ll see what makes the\
    \ \n\nobjects in Objective-C tick. They’re different \n\nthan the objects in other\
    \ languages—they \n\ncommunicate with messages; you don’t call \n\nthe code in\
    \ them directly—but they’re just as \n\npowerful, and often more so. \n\nWe’ll\
    \ start in this chapter with the basics: \n\nhandling basic data items, printing\
    \ results \n\nfrom Objective-C programs, running your \n\nprograms, and more.\
    \ \n\n From the Library of Wow! eBook"
  merge: -1
  pgno: 10
