  md: "Chapter 4\n\n**60**\n\n**Creating Functions**\n\nthat the function can return.\
    \ Since greeter( )\n\ndoesn’t return any data, the return type is void. \n\nThen,\
    \ in parentheses following the name \n\ncomes a list of arguments; these are the\
    \ data \n\nitems you pass to the function to let it do its \n\nwork. Since the\
    \ greeter( ) function takes no \n\narguments, it uses void for the argument list\
    \ \n\nas well. Then comes the body of the function— \n\nthe actual code that runs\
    \ when you call the \n\nfunction—enclosed in curly braces: { and }. \n\nIn this\
    \ case, the greeter( ) function simply \n\ndisplays a message: “Hello there.”\n\
    \nThe whole thing—the line that gives the func-\n\ntion’s return type, name, and\
    \ argument list, as \n\nwell as the body of the function—is called the \n\nfunction’s\
    \ *definition*.\n\nYou can call the greeter( ) function by name \n\nto run it\
    \ from the code in main( )—which \n\nitself is a function:\n\n#include <stdio.h>\n\
    \nvoid greeter( )\n\n{\n\n  printf(“Hello there.”);\n\n}\n\nint main( )\n\n{\n\
    \n** greeter( );**\n\n  return 0;\n\n}\n\nNow when your program runs, it will\
    \ start \n\nautomatically by calling the main( ) function. \n\nThe code in the\
    \ main( ) function includes a \n\ncall to the greeter( ) function, which then\
    \ \n\nwill display its message. Nice.\n\nYou’ll get the full story on functions\
    \ here: how \n\nto pass data to them, how to return data from \n\nthem, how to\
    \ pass pointers to them to access \n\nthe data in the calling code directly, how\
    \ to \n\nmake them call themselves (a process called \n\nrecursion), and how to\
    \ set up pointers to \n\nthem and then call them using those pointers.\n\n From\
    \ the Library of Wow! eBook"
