  md: "**141**\n\n**Categories, Posing, and Protocols**\n\n**8**\n\nIn this chapter,\
    \ we’re going look at three \n\nfeatures of Objective-C object-oriented pro-\n\
    \ngramming: categories, posing, and protocols. \n\n*Categories* let you extend\
    \ a class by adding \n\nmethods to a class—and you don’t need \n\naccess to the\
    \ base class’s code to do it; you \n\ncan create new methods for a class without\
    \ \n\nediting the class’s definition in code. That can \n\nbe useful when you\
    \ don’t have access to the \n\nsource code for a class, or when you don’t \n\n\
    want to change the source code, or when you \n\nwant to customize a class in different\
    \ ways. \n\nTo use categories, you create a new file with \n\nthe interfaces for\
    \ the new methods, use \n\nObjective-C syntax to indicate that you’re \n\nextending\
    \ another class, and then put the \n\nimplementations of the new methods in \n\
    \nanother file. “Categories” is the actual name \n\nof the new methods you add\
    \ to the class.\n\n*Posing* involves making one class “pose” as \n\nanother. Say\
    \ that you have a class, Class1, \n\nand another class, Class2, derived from \n\
    \nClass1. You can create objects of Class1, of \n\ncourse. But you can also tell\
    \ Class2 to pose \n\nas Class1. From then on in your code, when-\n\never you create\
    \ an object of Class1, you’ll \n\nreally be creating an object of Class2. In other\
    \ \n\nwords, Class2 is posing as Class1.\n\n*continues on next page*\n\nCategories,\
    \ \n\nPosing, and \n\nProtocols\n\n From the Library of Wow! eBook"
  merge: -1
  pgno: 149
- img_proc: true
  md: "Chapter 8\n\n**142**\n\n**Categories, Posing, and Protocols**\n\nThere are\
    \ other ways of doing the same thing— \n\nyou could use polymorphism, for example\
    \ (see \n\nthe previous chapter). But using posing can be \n\ncleaner because\
    \ you don’t have to keep track of \n\nwhat kind of pointer is stored in your variables\
    \ \n\nall the way through your code.\n\n*Protocols* are much like what are called\
    \ \n\ninterfaces in Java. A protocol is a specifica-\n\ntion for a method, much\
    \ like its prototype. \n\nWhen you indicate that a certain class uses \n\nspecific\
    \ protocols, you’re indicating that that \n\nclass implements those methods. In\
    \ other \n\nwords, protocols let you declare methods; it’s \n\nup to you to define\
    \ the implementation in \n\nyour class. \n\nThis is the closest Objective-C comes\
    \ to mul-\n\ntiple inheritance, in which you inherit from \n\nmultiple classes,\
    \ because using protocols, \n\nyou can make sure all your derived classes \n\n\
    implement the same methods (although the \n\nactual implementation in each class\
    \ may \n\nbe different). That’s useful if, for example, \n\nyou have two base\
    \ classes, named Animal\n\nand Pet, and want to derive classes named \n\nCat and\
    \ Dog from them. You can make sure \n\nthat Cat and Dog implement the methods\
    \ of \n\nAnimal and Pet by using protocols. When Cat\n\nand Dog use the protocols\
    \ defined by Animal\n\nand Pet, Cat and Dog both automatically \n\nimplement a\
    \ list of methods.\n\n From the Library of Wow! eBook"
