  md: "Getting Started: Essential Objective-C\n\n**13**\n\n**Adding Comments**\n\n\
    **Adding Comments**\n\nObjective-C lets you include English-\n\nlanguage comments\
    \ to yourself or others \n\nin programs. Such comments are useful to \n\nprovide\
    \ documentation or to indicate how \n\ncode needs to be modified.\n\nObjective-C\
    \ ignores any text between the \n\nmarkers /\\* and \\*/, so you can insert com-\n\
    \nments like this in your code:\n\n/\\* Here is a comment. \\*/\n\nYou also can\
    \ change such comments into \n\nmultiline comments, like this:\n\n  /\\* Here\n\
    \n   \\* is\n\n   \\* a \n\n   \\* comment.\n\n   \\*/\n\nObjective-C also recognizes\
    \ another type of \n\ncomment that is commonly used in the C++ \n\nlanguage: one-line\
    \ comments that begin with \n\n//. Objective-C ignores everything after // on\
    \ \n\na line, so these comments are often used to \n\nannotate single lines of\
    \ code:\n\n  int i = 4; //Here is a comment. \n\nIn this task, we’ll add comments\
    \ to the \n\ndatatype.m program from the previous task.\n\n**to add comments:**\n\
    \n**1.** Open datatype.m for editing.\n\n**2.** In datatype.m, enter the two comments\
    \ \n\nshown in **Listing 1.7**.\n\n*continues on next page*\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n** /\\* Declare **\n\n** \\* the**\n\n** \\* variables.\
    \ **\n\n** \\*/**\n\n  char c = ‘a’;\n\n  int i = 4;\n\n  long l = 123454321;   \n\
    \n  float f = 3.1415926;\n\n** /\\* Display the results. \\*/**\n\n  printf (“The character is ‘%c’.\\\
    \\n”, c);\n\n  printf (“The integer is %i.\\\\n”, i);\n\n  printf (“The long is %i.\\\
    \\n”, l);\n\n  printf (“The float is %10.6f.\\\\n”, f);\n\n  return 0;\n\n}\n\n\
