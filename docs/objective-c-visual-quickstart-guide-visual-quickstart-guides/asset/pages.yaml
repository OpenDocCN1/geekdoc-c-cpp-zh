  md: "Directing Program Flow\n\n**37**\n\n**Using the while Loop**\n\n**Using the\
    \ while Loop **\n\nObjective-C offers another popular loop: the \n\nwhile loop.\
    \ This loop keeps executing its \n\nbody while a certain condition is true. The\
    \ \n\nwhile loop has this format:\n\nwhile(*condition*)\n\n{\n\n  *body *\n\n\
    }\n\nThe while loop checks the *condition* expres-\n\nsion, and it it’s true,\
    \ executes the code in \n\nthe body of the loop. When the condition \n\nis tested\
    \ and turns out to be false, the loop \n\nstops executing. \n\nHere’s an example\
    \ of a while loop that dis-\n\nplays the message “You’ll see this five times.”:\n\
    \n#include <stdio.h>\n\nint main(void)\n\n{\n\n  int loop\\_index = 0;\n\n** while\
    \ (loop\\_index < 5)**\n\n** {**\n\n** printf(“You’ll see this five **\n\n** times.\\\
    \\n”);**\n\n** loop\\_index++; **\n\n** }**\n\n  return 0;\n\n}\n\n From the Library\
    \ of Wow! eBook"
