  md: "Using Arrays and Dictionaries\n\n**169**\n\n**Creating a Mutable Array**\n\n\
    **Creating a Mutable Array **\n\nThe arrays you create with NSArray are fixed\
    \ \n\narrays—you cannot change their length at \n\nrun time. However, the length\
    \ of arrays you \n\ncreate with the NSMutableArray class can be \n\nchanged when\
    \ your program runs.\n\nIn the next task, you’ll use NSMutableArray to \n\nadd\
    \ elements to a mutable array. \n\n**to create a mutable array:**\n\n**1.** Create\
    \ a new program named \n\n**createmutablearray.m**.\n\n**2.** In createmutablearray.m,\
    \ enter the code \n\nshown in **Listing 9.7**. \n\nThis code creates the mutable\
    \ array.\n\n*continues on next page*\n\n#import <Foundation/Foundation.h>\n\n\
