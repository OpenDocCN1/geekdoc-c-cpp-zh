  md: "Chapter 4\n\n**64**\n\n**Passing Arguments to Functions**\n\n**Passing Arguments\
    \ **\n\n**to Functions**\n\nYou can pass data to functions so they can \n\nwork\
    \ on that data. For example, you can cre-\n\nate a function named adder( ) that\
    \ you want \n\nto add two integers and display the results. \n\nTo indicate which\
    \ arguments a function \n\ntakes, you include an argument list in the \n\nparentheses\
    \ following the function name \n\nwhen you define the function. For example, \n\
    \nthe adder( )function takes two arguments: \n\nthe two integers to add, which\
    \ we’ll name \n\nx and y:\n\nvoid adder(int x, int y)\n\nNow in the body of the\
    \ function, you can refer \n\nto the first argument as x and the second \n\nargument\
    \ as y.\n\nWhen you create a function prototype, on \n\nthe other hand (when you\
    \ call the function \n\nbefore defining it in your code), you omit the \n\nnames\
    \ of the arguments, instead including \n\njust the type:\n\nvoid adder(int, int);\n\
    \nNow you can write the body of the adder( )\n\nfunction to add the two integers,\
    \ which you \n\ncan refer to by name, x and y:\n\nvoid adder(int x, int y)\n\n\
    {\n\n  printf(“%i + %i = %i”, x, y, x + y);\n\n}\n\n** tip**\n\n You specify\
    \ the type (int here) of every \n\nargument in the list just before its name.\
    \ \n\n From the Library of Wow! eBook"
