  md: "Object-Oriented Programming\n\n**117**\n\n**Verifying That an Object Supports\
    \ a Method**\n\n**Verifying that an Object **\n\n**Supports a Method**\n\nIn Objective-C,\
    \ objects can support methods. \n\nBut how do you know if a particular object\
    \ \n\nsupports a particular method? To check \n\nwhether an object supports a\
    \ method, you \n\ncan use the respondsToSelector( )function. \n\n**to check whether\
    \ an object will **\n\n**respond to a specific message:**\n\n**1.** Create a new\
    \ program named \n\n**responds.m**.\n\n**2.** In responds.m, enter the code shown\
    \ in \n\n**Listing 6.17**. \n\nThis code creates the Class1 class that \n\nhas\
    \ a method named print.\n\n**3.** Enter the code to check whether an \n\nobject\
    \ of Class1 supports a method \n\nnamed print (**Listing 6.18**).\n\n**4.** Save\
    \ responds.m.\n\n**5.** Run the responds.m program. \n\nYou should see the following:\n\
    \nc1 has a print method.\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n@interface Class1: NSObject\n\n\\-(void) print;\n\n@end\n\n@implementation Class1 \n\
    \n\\-(void) print\n\n{\n\n    printf(“This is Class 1.\\\\n”);\n\n}\n\n@end\n\n\
            .\n\n        .\n\n        .\n\n**Listing 6.17 **Starting responds.m.\n\
    \n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\n@interface Class1: NSObject\n\
    \n\\-(void) print;\n\n@end\n\n@implementation Class1 \n\n\\-(void) print\n\n{\n\
    \n    printf(“This is Class 1.\\\\n”);\n\n}\n\n@end\n\n**int main(void) **\n\n\
    **{**\n\n** Class1 \\*c1 = \\[Class1 new\\];**\n\n** if (\\[c1 respondsToSelector:\
