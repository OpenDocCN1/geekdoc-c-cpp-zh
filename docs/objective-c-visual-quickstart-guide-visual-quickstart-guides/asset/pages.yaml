  md: "Chapter 4\n\n**62**\n\n**Declaring Functions Using Prototypes**\n\n**Declaring\
    \ Functions **\n\n**Using Prototypes**\n\nIn the previous example, we defined\
    \ the \n\nfunction in the code before calling it, so \n\nObjective-C knew about\
    \ the greeter( ) func-\n\ntion before it was called. But the function \n\ndefinition\
    \ can also come after the call to that \n\nfunction in your code, like this:\n\
    \n#include <stdio.h>\n\nint main( )\n\n{\n\n  greeter( );\n\n  return 0;\n\n}\n\
    \nvoid greeter( )\n\n{\n\n  printf(“Hello there.”);\n\n}\n\nIn this case, you\
    \ must tell Objective-C about \n\nthe greeter( ) function with a function \n\n\
    *prototype*:\n\n#include <stdio.h>\n\n**void greeter(void);**\n\nint main( )\n\
    \n{\n\n  greeter( );\n\n  return 0;\n\n}\n\nvoid greeter( )\n\n{\n\n  printf(“Hello there.”);\n\
    \n}\n\n From the Library of Wow! eBook"
