    [\\[NSArray alloc\\] \n\n  initWithObjects: @\"red\", @\"white\", \n\n  @\"blue\"\
    , nil\\];\n\n        .\n\n        .\n\n        .\n\n}\n\n**to create a static\
    \ array:**\n\n**1.** Create a program named **createarray.m**.\n\n**2.** In createarray.m,\
