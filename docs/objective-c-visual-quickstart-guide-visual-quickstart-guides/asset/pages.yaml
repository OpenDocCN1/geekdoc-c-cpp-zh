    \ or previous item. For \n\ninstance, the following example prints the \n\nfirst\
    \ number in an array and then the second \n\nnumber by incrementing a pointer:\n\
    \n  float values\\[4\\] = {0.0, 1.0, 2.0, \n\n    3.0};\n\n \n\n  float \\*pointer = &values\\\
    [0\\];     \n\n  printf(“\\*pointer = %2.1f\\\\n”, \\*pointer);\n\n  printf(“\\\
    *(++pointer) = %2.1f”, \n\n    \\*(++pointer));\n\n**to use pointer math:**\n\n\
    **1.** Create a new program named \n\n**pointermath.m**.\n\n**2.** In pointermath.m,\
    \ enter the code shown \n\nin **Listing 3.11**. \n\nThis code simply points to\
