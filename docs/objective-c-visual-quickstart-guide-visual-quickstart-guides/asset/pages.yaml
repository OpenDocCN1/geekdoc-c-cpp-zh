  md: "Getting Started: Essential Objective-C\n\n**9**\n\n**Displaying Values in Variables**\n\
    \n**Displaying Values **\n\n**in Variables**\n\nThe capability to display the\
    \ values stored \n\nin variables with the Objective-C built-in \n\nprintf( ) function\
    \ is very useful. In the \n\nprevious task, you saw that the code %i is \n\na\
    \ placeholder for integer variables:\n\n   printf (“The amount in your account is\n\
    \n     $%i\\\\n”, amount);\n\n**Table 1.1 **shows some of the most popular \n\n\
    printf( ) codes.\n\nFor example, if you change the amount vari-\n\nable in the\
    \ previous task from the integer \n\n(int) type to a floating-point value (float),\
    \ \n\nyou can display its value using printf( ) and \n\n%f (for float):\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n  float amount = 1000000;\n\n** printf (“The amount in\
    \ your account is**\n\n** $%f\\\\n”, amount);**\n\n** return 0;**\n\n}\n\nIn this\
    \ task, you’ll create a program named \n\ntemperature.m that will display a time\
    \ (as \n\nan integer) and a temperature (as a floating-\n\npoint number). To do\
    \ that, you’ll use commas \n\nin printf( ) to separate the variables whose \n\n\
    values you want to display:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n  int time = 4;\n\
    \n  float temperature = 73.6;\n\n   printf (“At %i o’clock, the temperature\n\n\
         is %f degrees.\\\\n”, time, \n\n     temperature);\n\n   return 0;\n\n}\n\
    \n*continues on next page*\n\n**Co d e **\n\n**D i s pl ay**\n\n%i\n\nInteger\
    \ \n\n%c\n\nCharacter \n\n%d or %i \n\nSigned decimal integer \n\n%e\n\n Scientific\
    \ notation (mantissa/ \n\nexponent) using e character\n\n%E \n\n Scientific notation\
    \ (mantissa/ \n\nexponent) using E character\n\n%f \n\nFloating-point decimal\
    \ \n\n%g \n\nThe shorter of %e or %f \n\n%G \n\nThe shorter of %E or %f \n\n%s\
