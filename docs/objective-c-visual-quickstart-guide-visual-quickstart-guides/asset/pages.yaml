  md: "Chapter 3\n\n**54**\n\n**Using Strings**\n\n**Using Strings**\n\nYou might\
    \ think that Objective-C comes \n\nwith a built-in string data type, much like\
    \ the \n\nbuilt-in types float and char, but it doesn’t. \n\nInstead, Objective-C\
    \ uses the Foundation \n\nclass NSString. \n\nYou first include the Foundation\
    \ classes \n\n(which means you have to use a makefile in \n\nWindows, Linux, and\
    \ UNIX); then you can \n\ncreate a string object of class NSString. As \n\nwith\
    \ all Objective-C objects, you get a pointer \n\nto the object and can initialize\
    \ your string \n\nlike this: \n\n#include <Foundation/Foundation.h>  \n\n  NSString \\\
    *helloString = \n\n    @”Hello there.”;\n\nThe @ sign in front of the quoted text\
    \ indi-\n\ncates that you want to use an Objective-C \n\nstyle of string, not\
    \ the default C-style of \n\nstrings (Objective-C strings have a lot more \n\n\
    power built into them than C strings do). \n\n**to use Objective-C strings:**\n\
    \n**1.** Create a new program named **string.m**.\n\n**2.** In string.m, enter\
    \ the code shown in \n\n**Listing 3.15** to create and display a string. \n\n\
    To print the string with printf( ), you’re \n\nconverting the string to a C-style\
    \ string \n\nby sending it the message cString (you \n\ncommunicate with Objective-C\
    \ objects by \n\nsending them messages in this way).\n\n#include <stdio.h>\n\n\
    #include <Foundation/Foundation.h>  \n\nint main(void)\n\n{\n\n  NSString \\*helloString = \n\
    \n    @”Hello there.”;\n\n  printf(“%s\\\\n”, \\[helloString cString\\]);\n\n\
      return 0;\n\n}\n\n**Listing 3.15 **Creating string.m.\n\n From the Library of\
