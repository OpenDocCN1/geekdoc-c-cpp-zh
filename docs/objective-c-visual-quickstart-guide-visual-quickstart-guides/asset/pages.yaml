  md: "**79**\n\n**Classes and Objects**\n\n**5**\n\nAs discussed in Chapter 1, object-oriented\
    \ \n\nprogramming was introduced to let you \n\nhandle bigger programming problems,\
    \ letting \n\nyou package programming components into \n\neasily remembered objects.\n\
    \nThe example used in Chapter 1 was a refriger-\n\nator. Instead of starting the\
    \ pumps, regulating \n\nthe temperature, and starting the compres-\n\nsor yourself\
    \ in open code, you wrap all those \n\nactions into an object containing data\
    \ (such \n\nas the temperature) and methods (that is, \n\nfunctions, such as startCompressor( ))\
    \ into \n\nan easily remembered object: a refrigerator. \n\nYou just put food\
    \ in the refrigerator, and the \n\nrefrigerator cools it for you; all the implemen-\n\
    \ntation details are hidden from view.\n\nObjective-C object-oriented programming\
    \ \n\n(OOP) lets you use classes and objects. \n\nClasses are like cookie cutters—they\
    \ specify \n\nthe cookies you can create—and those cook-\n\nies are the objects.\
    \ So you first create a class \n\nthat specifies the data and methods (that is,\
    \ \n\nbuilt-in functions) for your objects, and then \n\nyou create objects of\
    \ that class.\n\n*continues on next page*\n\nClasses \n\nand Objects\n\n From\
    \ the Library of Wow! eBook"
