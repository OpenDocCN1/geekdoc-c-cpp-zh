  md: "Chapter 7\n\n**138**\n\n**Using Polymorphism**\n\n**Using Polymorphism **\n\
    \nPolymorphism refers to using the same code \n\nwith different objects: that\
    \ is, when you use \n\npolymorphism, the actual object that is used \n\nwhen you\
    \ pass it a message is determined at \n\nrun time.\n\nFor example, in this task,\
    \ you’ll execute the \n\nsame code twice:\n\n \\[pointerToObject print\\];\n\n\
    The pointerToObject variable will hold a \n\npointer to a different object each\
    \ time the \n\ncode is executed, so the object to which the \n\nmessage is sent\
