  md: "Classes and Objects\n\n**87**\n\n**Creating Object Methods**\n\n**Creating\
    \ Object Methods**\n\nWhile you can execute a class method with \n\njust the name\
    \ of the class, you need an object \n\nto be able to execute object methods—and\
    \ \n\nobject methods are more useful because class \n\nmethods have restrictions\
    \ on how they store \n\ndata that object methods don’t. You define \n\nan object\
    \ method in a class by preceding \n\nits prototype and definition with a minus\
    \ \n\nsign, “-”, in both the @interface section and \n\n@implementation section,\
    \ as shown here, \n\nwhere we create an object method named \n\nstringValue that\
    \ returns a string:\n\n@interface ClassWithMethod : NSObject\n\n\\- (const char \\\
    *) stringValue;\n\n@end\n\n@implementation ClassWithMethod\n\n\\- (const char \\\
    *) stringValue;\n\n{\n\n  return “Hello there.”;\n\n}\n\n@end\n\n**to create an\
