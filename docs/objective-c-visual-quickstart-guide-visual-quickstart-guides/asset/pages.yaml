  md: "Directing Program Flow\n\n**41**\n\n**Using the break Statement**\n\n**Using\
    \ the break Statement **\n\nSometimes you may want to break out of a \n\nloop—that\
    \ is, terminate it. For example, say \n\nthat you’re happily printing the reciprocals\
    \ \n\nof –1/5 up to 1/5:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n  float loop\\\
    _index;\n\n  for (loop\\_index = 5; loop\\_index > -5; \n\n    loop\\_index--)\n\
    \n  {\n\n    printf(“1/%2.1f = %10.6f\\\\n”, \n\n      loop\\_index, 1.0/loop\\\
    _index);\n\n  }\n\n  return 0;\n\n}\n\nHowever, when you get to 1/0 (division\
    \ by \n\nzero), Objective-C will report an error. To \n\navoid that, you can use\
    \ a break statement to \n\nbreak the loop execution before the attempt \n\nto\
    \ divide by 0 occurs:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n  float loop\\\
    _index;\n\n  for (loop\\_index = 5; loop\\_index > -5; \n\n    loop\\_index--)\n\
    \n  {\n\n** if (loop\\_index = = 0.0) {**\n\n** break;**\n\n** }**\n\n    printf(“1/%2.1f = %10.6f\\\
    \\n”, \n\n      loop\\_index, 1.0/loop\\_index);\n\n  }\n\n  return 0;\n\n}\n\n\
    The break statement causes the loop to \n\nend—in this case, avoiding division\
    \ by zero,\n\n From the Library of Wow! eBook"
