  md: "Using Arrays and Dictionaries\n\n**165**\n\n**Creating an Array**\n\n**Creating\
    \ an Array **\n\nYou can create an array using the Foundation \n\nclass NSArray.\
    \ Such arrays are static and can-\n\nnot be changed at run time..\n\nHere’s how\
    \ you might create such an array, \n\ninitializing it to “red”, “white”, and “blue”.\
