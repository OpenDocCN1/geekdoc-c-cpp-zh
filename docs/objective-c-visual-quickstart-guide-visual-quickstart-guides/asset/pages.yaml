  md: "Chapter 4\n\n**76**\n\n**Using Recursion**\n\n**Using recursion**\n\nFunctions\
    \ can call themselves in Objective-C, \n\na process called recursion, and this\
    \ process is \n\noften useful. For example, say you’re writ-\n\ning a function\
    \ that calculates factorials: for \n\nexample, 6! =6 x 5 x 4 x 3 x 2 x 1 = 720.\
    \ Here’s a \n\nfunction that calls itself recursively to figure \n\nout factorials:\n\
    \nint factorial(int value)\n\n{\n\n  if (value = = 1) {\n\n    return value;     \n\
    \n  } else {\n\n    return value \\* factorial(value - 1);\n\n  }\n\n}\n\nLet’s\
    \ use this function to calculate 6!.\n\n**to use recursion:**\n\n**1.** Create\
    \ a new program named \n\n**functionrecursion.m**.\n\n**2.** In functionrecursion.m,\
    \ enter the code \n\nshown in **Listing 4.17**. \n\nThis code calls the factorial( )\
    \ function, \n\npassing it a value of 6.\n\n**3.** Add the code to implement the\
    \ recursive \n\nfactorial( ) function (**Listing 4.18**). \n\n**4.** Save functionrecursion.m.\n\
    \n**5.** Run the functionrecursion.m program. \n\nYou should see the following:\n\
    \n6! = 720\n\n#include <stdio.h>\n\nint main( )\n\n{\n\n    printf(“6! = %i\\\\\
    n”, factorial(6));           \n\n    return 0;\n\n}\n\n**Listing 4.17 **Starting\
    \ functionrecursion.m.\n\n#include <stdio.h>\n\n**int factorial(int value);**\n\
    \nint main( )\n\n{\n\n    printf(“6! = %i\\\\n”, factorial(6));           \n\n\
        return 0;\n\n}\n\n**int factorial(int value)**\n\n**{**\n\n** if (value =\
    \ = 1) {**\n\n** return value; **\n\n** } else {**\n\n** return value \\* factorial(value\
    \ - 1);**\n\n** }**\n\n**}**\n\n**Listing 4.18 **The functionrecursion.m program.\
    \ \n\n From the Library of Wow! eBook"
