  md: "Directing Program Flow\n\n**33**\n\n**Using the Conditional Operator**\n\n\
    **Using the Conditional **\n\n**Operator**\n\nWe’ve seen how you can make decisions\
    \ in \n\ncode using the if statement and execute other \n\ncode to match the results\
    \ of those decisions. \n\nYou can also use the conditional operator to \n\nmake\
    \ decisions. This operator lets you evalu-\n\nate an expression and execute code\
    \ depend-\n\ning on the result. The conditional operator \n\nhas this format:\n\
    \n*conditional* ? *expression1* : *expression2*;\n\nObjective-C evaluates *conditional*,\
    \ and if \n\nit’s true, executes *espression1*; if it’s false, it \n\nexecutes\
    \ *expression2*. The returned value \n\nfrom this operator is the expression that\
    \ is \n\nexecuted. For example, you may want to cap \n\nthe temperature at 72,\
    \ and if it’s greater than \n\n72, set it to 72. Here’s how to do that with a\
    \ \n\nconditional operator:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n  int temperature = 78;\n\
    \n** temperature = temperature > 72 ? **\n\n** temperature = 72 : temperature;**\n\
    \n  printf(“The temperature is %i.\\\\n”, \n\n    temperature);\n\n  return 0;\n\
    \n}\n\nHere, if the temperature is greater than 72, \n\nthe first expression,\
    \ 72, is returned from the \n\nconditional operator. If it’s less than 72, the\
    \ \n\ntemperature itself is returned. \n\n From the Library of Wow! eBook"
