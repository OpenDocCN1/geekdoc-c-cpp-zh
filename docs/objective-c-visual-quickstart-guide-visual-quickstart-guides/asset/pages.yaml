    \n#import “Class1.h”\n\n#import “Class2.h”\n\n@implementation Class2 \n\n\\-(void) print\n\
    \n{\n\n    printf(“This is Class 2.\\\\n”);\n\n}\n\n@end\n\nThen you can create\
    \ objects of Class1 and \n\nClass1 and call each of their print methods \n\nlike\
    \ this:\n\n#import <stdio.h>\n\n#import “Class1.h”\n\n#import “Class2.h”\n\nint main(void) {\n\
    \n    Class1 \\*c = \\[Class1 new\\];\n\n    \\[c print\\];\n\n    Class2 \\*c2 = \\\
    [Class2 new\\];\n\n    \\[c2 print\\];\n\n    return 0;\n\n}\n\nAnd each of these\
    \ print methods will be dif-\n\nferent, so although there was only one proto-\n\
    \ncol, there are two different implementations.\n\nProtocols let you define the\
    \ interface of a \n\nmethod in this way. Although Objective-C has \n\nno true\
    \ multiple inheritance capability, you \n\ncan use multiple protocols (not classes)\
    \ as the \n\nbasis for derived classes. The protocols say \n\nwhat methods you’re\
    \ including and specify \n\ntheir return types, but it’s up to you to imple-\n\
    \nment those methods in the derived classes. \n\nThat’s as close as Objective-C\
    \ gets to multiple \n\ninheritance (in true multiple inheritance, you \n\ncan\
    \ derive a class from multiple base classes).\n\n From the Library of Wow! eBook"
