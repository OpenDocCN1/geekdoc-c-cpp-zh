  md: "Getting Started: Essential Objective-C\n\n**19**\n\n**Using the Increment and\
    \ Decrement Operators**\n\n**Using the Increment and **\n\n**Decrement Operators\
    \ **\n\nObjective-C also supports two more operators: \n\nthe ++ increment operator\
    \ and the -- decrement \n\noperator. For instance, to increment the value \n\n\
    in the variable named temperature, you write \n\ntemperature++, which adds 1 to\
    \ the value in \n\ntemperature. To decrement the value, you \n\nenter temperature--,\
    \ which decreases the \n\nvalue in temperature by 1. \n\nYou can use ++ and --\
    \ either before or after \n\na variable, and the position makes a differ-\n\n\
    ence. The expression ++x adds 1 to x and then \n\nevaluates the rest of the line\
    \ of code, and the \n\nexpression x++ first evaluates the line of code \n\nand\
    \ then, after the current line of code has \n\nfinished executing, increments\
    \ the value in x. \n\nFor example, say you have this code:\n\n  float x = 0;\n\
    \n  float y = 5;\n\n  x = y++;\n\n  printf (\n\n    “After x = y++ x: %2.0f y: %2.0f.\\\
    \\n”,   \n\n   x, y);\n\nThis code would print x: 5 y:6, because \n\nthe increment\
    \ operation was performed \n\nafter the assignment. On the other hand, \n\nsay\
    \ you execute:\n\n  x = ++y;\n\n  printf (\n\n    “After x = ++y x: %2.0f y: %2.0f.\\\
    \\n”, \n\n    x, y);\n\nThis code would print x: 7 y: 7, because the \n\nincrement\
    \ operation was completed first and \n\nthen the assignment. \n\nLet’s test the\
    \ increment operator. \n\n** tip**\n\n The decrement operator works the same\
