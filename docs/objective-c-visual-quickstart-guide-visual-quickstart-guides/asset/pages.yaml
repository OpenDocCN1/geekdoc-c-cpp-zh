  md: "Creating Functions\n\n**63**\n\n**Declaring Functions Using Prototypes**\n\n\
    A function prototype is just like the line \n\nwhere you declare a function (the\
    \ line just \n\nbefore the function body inside curly braces), \n\nexcept that\
    \ you remove the names of any \n\nfunction arguments (leaving just their types)\
    \ \n\nand end the prototype with a semicolon.\n\nThe function prototype is also\
    \ called the \n\nfunction *declaration* (as opposed to the func-\n\ntion definition,\
    \ which includes the body of \n\nthe function).\n\nYou can also put function prototypes\
    \ in \n\nheader files, whose names end with .h, and \n\nthen include them with\
    \ stdio.h as shown in \n\nthe listings here. That include statement \n\nincludes\
    \ the stdio.h header file, which includes \n\nprototypes for functions such as\
    \ printf( ).\n\n**to create a function prototype:**\n\n**1.** Create a new program\
    \ named \n\n**functionprototype.m**.\n\n**2.** In functionprototype.m, enter the\
    \ code \n\nshown in **Listing 4.3**. \n\nThis code creates the greeter( ) func-\n\
    \ntion after the main( ) function and adds a \n\nprototype before the main( )\
    \ function so \n\nObjective-C knows about the greeter( )\n\nfunction.\n\n**3.**\
    \ Add the main( ) function to call the \n\ngreeter( ) function (**Listing 4.4**).\n\
    \n**4.** Save functionprototype.m.\n\n**5.** Run the functionprototype.m program.\
    \ \n\nYou should see the following:\n\nHello there.\n\n#include <stdio.h>\n\n\
    void greeter(void);\n\n        .\n\n        .\n\n        .\n\nvoid greeter( )\n\
    \n{\n\n  printf(“Hello there.”);\n\n}\n\n**Listing 4.3 **Starting functionprototype.m.\n\
    \n#include <stdio.h>\n\n**void greeter(void);**\n\n**int main( )**\n\n**{**\n\n\
    ** greeter( );**\n\n** return 0;**\n\n**}**\n\nvoid greeter( )\n\n{\n\n  printf(“Hello there.”);\n\
    \n}\n\n**Listing 4.4 **The functionprototype.m program.\n\n From the Library of\
