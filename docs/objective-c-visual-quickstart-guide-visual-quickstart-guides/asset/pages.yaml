  md: "Chapter 7\n\n**128**\n\n**Overloading Base-Class Methods**\n\n**Overloading\
    \ Base-Class **\n\n**Methods **\n\nYou can also *overload* methods. When you \n\
    \noverload a method, you give it multiple defi-\n\nnitions, and Objective-C chooses\
    \ the correct \n\nversion of the method based on the param-\n\neter list—the type\
    \ and number of parameters \n\nmust be different for each version of an \n\noverloaded\
    \ method.\n\n**to overload a base-class method:**\n\n**1.** Create a new program\
    \ named \n\n**overload.m**.\n\n**2.** In overload.m, enter the code shown in \n\
    \n**Listing 7.9**. \n\nThis code creates Class1 and derives \n\nClass2 from it;\
    \ Class1 has a print method \n\nwith no arguments, and Class2 has a \n\nprint\
    \ method that takes one argument.\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n@interface Class1: NSObject\n\n\\-(void) print;\n\n@end\n\n@implementation Class1 \n\
    \n\\-(void) print\n\n{\n\n    printf(“Hello there.\\\\n”);\n\n}\n\n@end\n\n@interface Class2: Class1\n\
    \n\\-(void) print: (int) x;\n\n@end\n\n@implementation Class2\n\n\\-(void) print: (int) x\n\
    \n{\n\n  printf(“Your number is %i.\\\\n”, x);\n\n}\n\n@end\n\nint main(void) \n\
    \n{\n\n  Class2 \\*c2 = \\[Class2 new\\];\n\n  \\[c2 print\\];\n\n  \\[c2 print: 5\\\
    ];\n\n  return 0;\n\n}\n\n        .\n\n        .\n\n        .\n\n**Listing 7.9\
    \ **Starting overload.m.\n\n From the Library of Wow! eBook"
