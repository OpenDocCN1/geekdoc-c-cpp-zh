  md: "Chapter 7\n\n**126**\n\n**Overriding Base-Class Methods**\n\n**Overriding Base-Class\
    \ **\n\n**Methods**\n\nSay that you have a method in a base class \n\nthat you\
    \ need to change. For example, say \n\nyou have a method named print in the base\
    \ \n\nclass Class1 that prints “This is class 1.” \n\nClearly, in the derived\
    \ class, Class2, the \n\nmessage should say, “This is class 2.”\n\nYou can *override*\
    \ the base class print method \n\njust by redefining it in the derived class.\
    \ \n\nWhen you override a method in a derived \n\nclass, the overriding method\
    \ must have the \n\nsame prototype (same return type and argu-\n\nments) as the\
    \ method you’re overriding.\n\n**to override base-class methods:**\n\n**1.** Create\
    \ a new program named \n\n**override.m**.\n\n**2.** In override.m, enter the code\
    \ shown in \n\n**Listing 7.7**. \n\nThis code creates Class1 and derives \n\n\
    Class2 from it. Each class has a method \n\nnamed print with the same prototype,\
    \ \n\nso the Class2 version will override the \n\nClass1 version.\n\n#import <stdio.h>\n\
    \n#include <Foundation/Foundation.h>  \n\n@interface Class1: NSObject\n\n\\-(void) print;\n\
    \n@end\n\n@implementation Class1 \n\n\\-(void) print\n\n{\n\n  printf(“This is Class 1.\\\
    \\n”);\n\n}\n\n@end\n\n@interface Class2: Class1\n\n\\-(void) print;\n\n@end\n\
    \n@implementation Class2\n\n\\-(void) print\n\n{\n\n  printf(“This is Class 2.\\\
    \\n”);\n\n}\n\n@end\n\n        .\n\n        .\n\n        .\n\n**Listing 7.7 **Starting\
    \ override.m.\n\n From the Library of Wow! eBook"
