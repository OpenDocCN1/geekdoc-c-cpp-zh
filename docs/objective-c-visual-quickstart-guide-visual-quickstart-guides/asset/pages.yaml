  md: "Chapter 7\n\n**132**\n\n**Limiting Access**\n\n**Limiting Access **\n\nBy default,\
    \ the data members and methods \n\nof a base class are available to code in the\
    \ \n\nderived class. That may not always be a good \n\nidea, however: for example,\
    \ if the base class \n\nhas an internal variable that keeps track of \n\nsome\
    \ count that the derived class doesn’t \n\nneed access to. In such cases, you\
    \ can use \n\nthe @private access specifier to mark such \n\na data member as\
    \ private. You saw @private\n\nin the previous chapter, but here you’ll use it\
    \ \n\nwith inheritance.\n\n**to stop inheritance:**\n\n**1.** Create a new program\
    \ named **private.m**.\n\n**2.** In private.m, enter the code shown in \n\n**Listing\
    \ 7.13**. \n\nThis code creates the classes you’ll use \n\nand marks a data member\
    \ of the base \n\nclass as private.\n\n#import <stdio.h>\n\n#import <Foundation/NSObject.h>\n\
    \n@interface Class1: NSObject {\n\n@private\n\n    int privateVariable;\n\n}\n\
    \n@end\n\n@implementation Class1\n\n@end\n\n@interface Class2: Class1 \n\n\\-(void) print;\n\
    \n@end\n\n@implementation Class2\n\n\\-(void) print\n\n{\n\n        .\n\n        .\n\
    \n        .\n\n}\n\n@end\n\n        .\n\n        .\n\n        .\n\n**Listing 7.13\
    \ **Starting private.m.\n\n From the Library of Wow! eBook"
