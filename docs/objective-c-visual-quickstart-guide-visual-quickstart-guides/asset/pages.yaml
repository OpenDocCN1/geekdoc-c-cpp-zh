  md: "Directing Program Flow\n\n**25**\n\n**Directing Program Flow**\n\nLoops provide\
    \ another tool for controlling \n\nthe flow of your programs. Loops let you \n\
    \nperform specific actions over and over, such \n\nas summing a group of numbers\
    \ or drawing \n\nlines. For example, in a for loop, the most \n\ncommon type of\
    \ loop, you initialize a variable \n\ncalled loop\\_index (usually by setting\
    \ it to \n\nzero), specify the condition that causes the \n\nloop to end, and\
    \ an operation to perform \n\nafter the body of the loop is executed. In the \n\
    \nexample here, the loop ends when the loop\\_\n\nindex variable contains a number\
    \ greater \n\nthan 5; after the body of the loop runs, the \n\nloop\\_index value\
    \ is incremented:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n** int loop\\\
    _index;**\n\n** for (loop\\_index = 0; loop\\_index < 5; **\n\n** loop\\_index++)**\n\
    \n** {**\n\n** printf(“You’ll see this five **\n\n** times.\\\\n”);**\n\n** }**\n\
    \n  return 0;\n\n}\n\nThis example displays the text “You’ll see this \n\nfive\
    \ times.” \n\nMore on the for loop and the other loops in \n\nObjective-C is coming\
    \ up in this chapter.\n\n From the Library of Wow! eBook"
