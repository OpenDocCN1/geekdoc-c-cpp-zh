  md: "**59**\n\n**Creating Functions**\n\n**4**\n\nThis chapter is all about functions,\
    \ which are \n\nchunks of code you can call to make them \n\nrun—and they won’t\
    \ run unless you call them.\n\nSo far, the code in the programs we’ve discussed\
    \ \n\nhas executed automatically when the programs \n\nstart. But functions are\
    \ different; you have to \n\nexplicitly call a function by name in your code \n\
    \nbefore its code will run. That means that using \n\nfunctions, you can divide\
    \ your code into smaller \n\nparts: the divide and conquer technique.\n\nIn Objective-C,\
    \ functions are a crucial stop on \n\nthe way to building your own objects. Objects\
    \ \n\nlet you package both data and functions— \n\ncalled methods when they’re\
    \ built into \n\nobjects—together, as you’ll soon see.\n\nHere is an example of\
    \ how you might create a \n\nfunction named greeter( ):\n\n#include <stdio.h>\n\
    \nvoid greeter(void)\n\n{\n\n  printf(“Hello there.”);\n\n}\n\n        .\n\n        .\n\
    \n        .\n\nNote the function’s structure: In front of its \n\nname (here,\
    \ greeter), you specify a return \n\ntype, which indicates the type of the data\
    \ item\n\n*continues on next page*\n\nCreating \n\nFunctions\n\n From the Library\
    \ of Wow! eBook"
