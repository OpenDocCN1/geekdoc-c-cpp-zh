    **1.** Create a new program named \n\n**isMemberOfClass.m**.\n\n**2.** In isMemberOfClass.m,\
    \ enter the code \n\nshown in **Listing 6.13**. \n\nThis code creates the Class1\
    \ class.\n\n*continues on next page*\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
