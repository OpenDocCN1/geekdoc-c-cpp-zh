  md: "Chapter 5\n\n**92**\n\n**Storing the Interface in a Header File**\n\n**Storing\
    \ the Interface in a **\n\n**Header File**\n\nIn Objective-C, it’s common to put\
    \ the \n\ninterface part of a class declaration (the \n\npart declared by the\
    \ @interface keyword) \n\nin its own header file with the extension .h. \n\nTo\
    \ keep things simple, we’ve not been doing \n\nthat here, but the process is easy.\
    \ You just \n\nstore the @implementation section of a class \n\nin a file such\
    \ as header.h:\n\n#include <Foundation/Foundation.h>  \n\n@interface Container: NSObject \n\
    \n{\n\n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\n\\-(int) intValue;\n\
    \n@end\n\nThen you include header.h in your program: \n\n#include “header.h”\n\
    \n**to store the interface in a header file:**\n\n**1.** Create a new program\
    \ named **header.m**.\n\n**2.** In header.m, enter the code shown in \n\n**Listing\
    \ 5.13**. \n\nThis code is just our example that lets \n\nyou store numbers in\
    \ an object, with the \n\ninterface section in header.h (make sure \n\nyou use\
    \ the line #include “header.h” at \n\nthe top of the code).\n\n#include “header.h”\n\
    \n#include <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\n@implementation Container \n\
    \n\\-(void) setNumber: (int) n \n\n{\n\n    number = n;\n\n}\n\n\\-(int) intValue\n\
    \n{\n\n  return number;\n\n}\n\n@end\n\nint main(void)\n\n{\n\n  Container \\\
