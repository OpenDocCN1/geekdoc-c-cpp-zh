  md: "Categories, Posing, and Protocols\n\n**157**\n\n**Protocols: Defining the Protocol/Interfaces**\n\
    \n**Protocols: Defining the **\n\n**Protocol and Interfaces **\n\nWhen you define\
    \ a protocol for a method or \n\nmethods, you usually store that protocol in \n\
    \na header file. You’ll create a protocol named \n\nPrinting for a method named\
    \ print in a file \n\nnamed printing.h:\n\n@protocol Printing\n\n\\-(void) print;\n\
    \n@end\n\nThen you’ll use that protocol for one class in \n\nan interface file\
    \ named ClassFirst.h:\n\n#include <Foundation/Foundation.h> \n\n#import “printing.h”\n\
    \n@interface Class1: NSObject\n\n\\-(void) print;\n\n@end\n\nYou’ll also use the\
    \ Printing protocol in \n\nan interface file, ClassSecond.h, for a class \n\n\
    derived from that first class:\n\n#include “Class1.h” \n\n#import “printing.h”\n\
    \n@interface Class2: Class1\n\n@end\n\nThen you’ll implement the print method\
    \ for \n\nClass1 and Class2 in different ways (in the \n\nnext task).\n\n From\
    \ the Library of Wow! eBook"
