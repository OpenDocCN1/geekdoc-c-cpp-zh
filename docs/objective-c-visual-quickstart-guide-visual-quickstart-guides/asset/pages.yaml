  md: "Categories, Posing, and Protocols\n\n**143**\n\n**About Categories**\n\n**About\
    \ Categories **\n\nCategories let you extend a class by defining \n\nnew methods,\
    \ even if you don’t have access \n\nto that class’s source code or can’t change\
    \ it.\n\nSay you have a class, Class1, with a single \n\nmethod, method1, in the\
    \ class’s header file:\n\n#include <Foundation/Foundation.h> \n\n@interface Class1: NSObject\n\
    \n\\-(*return\\_type*) *method1*;\n\n@end\n\nSuppose also that the method is defined\
    \ in \n\nthe class’s implementation file:\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n@implementation Class1 \n\n\\-(*return\\_type*) *method1*\n\n{\n\n        .\n\
    \n        .\n\n        .\n\n}\n\n@end\n\nIf you want to extend Class1 by adding\
    \ a \n\nnew method, method2, you can create a new \n\nheader file that lists the\
    \ method2 interface, \n\nlike this:\n\n@interface Class1 (*Extender*)\n\n\\-(*return\\\
    _type*) *method2; *\n\n@end\n\n*continues on next page*\n\n From the Library of\
    \ Wow! eBook"
