  md: "Handling Data\n\n**57**\n\n**Using Enumerations**\n\n**Using Enumerations**\n\
    \nObjective-C lets you define your own named \n\ntypes, called enumerations. For\
    \ example, you \n\ncan tell Objective-C that an enumeration \n\nnamed day holds\
    \ values named for the days \n\nof the week, like this:\n\n  enum day            \n\
    \n  {\n\n    Sunday,     \n\n    Monday,         \n\n    Tuesday,\n\n    Wednesday,      \n\
    \n    Thursday,\n\n    Friday,\n\n    Saturday       \n\n  };\n\nYou can then\
    \ assign a variable of that type to \n\none of those values:\n\n  enum day today = Friday;\n\
