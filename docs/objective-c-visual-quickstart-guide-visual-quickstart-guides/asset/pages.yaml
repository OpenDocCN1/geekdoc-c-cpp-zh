  md: "Exception Handling\n\n**207**\n\n**Using the End Handler**\n\n**Using the End\
    \ Handler**\n\nYou can handle exceptions in the NS\\_HANDLER\n\nblock. After the\
    \ code in the NS\\_HANDLER block \n\nruns, you can have the code in another block,\
    \ \n\nthe NS\\_ENDHANDLER block, run, giving you a \n\nchance to add cleanup code.\
    \ \n\n**to use the end handler:**\n\n**1.** Create a new program named **main.m**.\n\
    \n**2.** In main.m, enter the code shown in \n\n**Listing 11.5**. \n\nThis code\
    \ creates the NS\\_DURING and \n\nNS\\_HANDLER blocks.\n\n*continues on next page*\n\
