  md: "Chapter 4\n\n**68**\n\n**Using Function Scope**\n\n**Using Function Scope**\n\
    \nScope refers to the range of visibility of data \n\nitems. Functions define\
    \ their own scope. That \n\nis, when you define a variable in a function, it \n\
    \nbecomes a local variable for that function and \n\ntakes precedence over other\
    \ versions of the \n\nsame variable. For example, you can define an \n\ninteger\
    \ named number and set it to 1 like this:\n\nint number = 1;\n\nAnd then you can\
    \ also define an integer \n\nnamed number inside a function:\n\nint number = 1;\n\
    \nvoid function(void)\n\n{\n\n  int number = 2;\n\n  printf(\n\n    “In the function the number is %i\\\
    \\n”, \n\n    number);\n\n}\n\nThe local version of number will take prece-\n\n\
    dence in the function, so here the printf( )\n\nstatement will display a value\
    \ of 2 for number. \n\nIf number hadn’t been defined locally in the \n\nfunction,\
    \ the version from outside the func-\n\ntion would have been used, and the printf( )\n\
    \nstatement would have shown a value of 1. \n\nIn Objective-C, any code block—that\
    \ is, code \n\nenclosed in curly braces such as function \n\nbodies or the bodies\
    \ of if statements— \n\ndefines its own scope, so local variables \n\nwill always\
    \ take precedence over variables \n\ndefined outside the code block. \n\n**to\
    \ use function scope:**\n\n**1.** Create a new program named \n\n**functionscope.m**.\n\
    \n**2.** In functionscope.m, enter the code shown \n\nin **Listing 4.9**. \n\n\
    This code declares an integer named \n\nnumber displays its value in main( ),\
    \ and \n\nthen calls a function.\n\n#include <stdio.h>\n\nvoid function(void);\n\
    \nint number = 1;\n\nint main( )\n\n{\n\n  printf(“In main the number is %i\\\\\
    n”, \n\n    number);\n\n  function( );\n\n  return 0;\n\n}\n\n        .\n\n        .\n\
    \n        .\n\n**Listing 4.9 **Starting functionscope.m.\n\n From the Library\
    \ of Wow! eBook"
