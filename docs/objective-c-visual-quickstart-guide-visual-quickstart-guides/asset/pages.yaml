  md: "Getting Started: Essential Objective-C\n\n**7**\n\n**Compiling and Running\
    \ Your First Program**\n\n**to compile and run your first **\n\n**Objective-C\
    \ program in Linux or UNIX:**\n\n**1.** Open a command prompt window.\n\n**2.**\
    \ Change to the directory containing \n\nfirst.m.\n\n**3.** Enter the following\
    \ command, prefacing \n\ngcc with the path to the GNUstep gcc \n\ncompiler if\
    \ your computer can’t find the \n\ncompiler:\n\n$ gcc -o first first.m\n\n**4.**\
