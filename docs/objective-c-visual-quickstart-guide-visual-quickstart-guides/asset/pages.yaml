  md: "Classes and Objects\n\n**97**\n\n**Using Constructors**\n\n**Using Constructors\
    \ **\n\nIn Objective-C, as in many OOP languages, \n\nyou can use *constructors*,\
    \ which are spe-\n\ncial methods used to initialize the data \n\nin an object\
    \ when you create that object. \n\nConstructors can be named anything, but \n\n\
    they’re often named init. The constructor \n\nreturns a pointer to the object,\
    \ and you get \n\nthat pointer by calling the super class’s init\n\nmethod (the\
    \ super class is the class from \n\nwhich the current class is derived, typically\
    \ \n\nNSObject):\n\n\\-(Container\\*) init: (int) n\n\n{\n\n    self = \\[super init\\\
    ];\n\n    if ( self ) {\n\n        \\[self setNumber: n\\];\n\n    }\n\n    return self;\n\
    \n}\n\nIn your code, you can then pass values to the \n\nconstructor when you\
    \ create an object. For \n\nexample, the following code initializes the \n\nnumber\
    \ stored in the object to 3:\n\n  Container \\*object = \\[\\[Container new\\\
    ] \n\n    init: 3\\];\n\n**to use a constructor:**\n\n**1.** Create a new program\
    \ named \n\n**constructor.m**.\n\n**2.** In constructor.m, enter the code shown\
    \ in \n\n**Listing 5.21**. \n\nThis code starts constructor.m with the \n\ninterface\
    \ of the Container class.\n\n*continues on next page*\n\n#include <stdio.h>\n\n\
    #include <Foundation/Foundation.h>  \n\n@interface Container: NSObject \n\n{\n\
    \n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\n\\-(int) intValue;\n\n\
    \\-(Container\\*) init: (int) n;\n\n@end\n\n        .\n\n        .\n\n        .\n\
    \n**Listing 5.21 **Starting constructor.m.\n\n From the Library of Wow! eBook"
