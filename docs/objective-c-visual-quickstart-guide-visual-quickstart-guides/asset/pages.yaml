  md: "**183**\n\n**Managing Memory in Objective-C**\n\n**10**\n\nIn this chapter,\
    \ you’ll learn about memory \n\nmanagement in Objective-C. Objective-C \n\nkeeps\
    \ track of all the objects you create with a \n\nretain count, and when that count\
    \ goes down \n\nto zero, Objective-C automatically deallocates \n\nthe memory\
    \ allocated to an object.\n\nFor example, say that you create two objects:\n\n\
      Class1 \\*object1 = \\[\\[Class1 alloc\\] \n\n    init\\];\n\n  Class1 \\*object2 = \\\
    [\\[Class1 alloc\\] \n\n    init\\];\n\nNow the retain count of each object is\
    \ 1, as \n\nyou can verify by asking each object what its \n\nretain count is\
    \ and printing that result: \n\n  printf(“object1  retain count: %i\\\\n”, \n\n\
        \\[object1 retainCount\\]);\n\n  printf(“object2 retain count: %i\\\\n”, \n\
    \n    \\[object2 retainCount\\]);\n\nYou can also explicitly increment the retain\
    \ \n\ncount yourself, like this:. \n\n  \\[object1 retain\\]; \n\n  \\[object1 retain\\\
    ]; \n\n  \\[object2 retain\\]; \n\n*continues on next page*\n\nManaging \n\nMemory\
    \ in \n\nObjective-C\n\n From the Library of Wow! eBook"
