  md: "Object-Oriented Programming\n\n**107**\n\n**Using Class Variables**\n\n**Using\
    \ Class Variables **\n\nYou can create class variables for use with \n\nyour classes,\
    \ but there’s a hitch: every object \n\nof that class shares the same variable,\
    \ so \n\nif one object changes a class variable, that \n\nvariable is changed\
    \ for all objects. You create \n\nclass variables with the static keyword.\n\n\
    Class variables are often useful: for example, \n\nyou can use a class variable\
    \ to keep track of \n\nthe number of objects of a particular class cre-\n\nated\
    \ in a program. You’ll do that in this task. \n\n**to use class variables:**\n\
    \n**1.** Create a new program named \n\n**classvariables.m**.\n\n**2.** In classvariables.m,\
    \ enter the code shown \n\nin **Listing 6.7**. \n\nThis code creates a class with\
    \ a class vari-\n\nable named count.\n\n*continues on next page*\n\n#import <stdio.h>\n\
    \n#import <Foundation/NSObject.h>\n\n@interface TheClass: NSObject\n\nstatic int count;\n\
    \n+(int) getCount;\n\n@end\n\n@implementation TheClass\n\n\\-(TheClass\\*) init \n\
    \n{\n\n    self = \\[super init\\];\n\n    count++;\n\n    return self;\n\n}\n\
    \n+(int) getCount \n\n{\n\n    return count;\n\n}\n\n@end\n\n        .\n\n        .\n\
    \n        .\n\n**Listing 6.7 **Starting classvariables.m.\n\n From the Library\
    \ of Wow! eBook"
