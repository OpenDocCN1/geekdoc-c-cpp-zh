  md: "Handling Data\n\n**45**\n\n**About Creating NS-Class Objects**\n\n**About Creating\
    \ **\n\n**NS-Class Objects**\n\nTo create objects of any class that begins \n\n\
    with NS, you must include the Objective-C \n\nFoundation header file. If you’re\
    \ using Xcode \n\non the Mac, make sure that the Foundation \n\noption is selected\
    \ on the New Project page \n\nwhen you create a project. If you’re using \n\n\
    Objective-C in Windows, Linux, or UNIX, \n\nyou need a makefile named GNUmakefile\
    \ \n\nlike the following, which compiles a program \n\nnamed source.m and creates\
    \ an executable \n\napplication named app (which is app.exe \n\nin Windows):\n\
    \ninclude $(GNUSTEP\\_MAKEFILES)/common.make\n\nTOOL\\_NAME = app\n\napp\\_OBJC\\\
    _FILES = source.m\n\ninclude $(GNUSTEP\\_MAKEFILES)/tool.make\n\nIn Linux and\
    \ UNIX (not Windows), you also \n\nhave to set up the GNUstep environment \n\n\
    variables. You do that in the C shell like this:\n\nsource <GNUstep root>/System/Library/\n\
    \nMakefiles/GNUstep.csh \n\nAnd you do it like this in the Bourne shell:\n\n. <GNUstep root>/System/Library/\n\
    \nMakefiles/GNUstep.sh \n\nOn most UNIX systems, <GNUstep root> is \n\n/usr/lib/GNUstep.\
    \ To run the makefile, just \n\nchange to the directory with the makefile \n\n\
    (GNUmakefile) and type **make**, which creates \n\nthe executable application\
    \ in a subdirectory \n\nnamed obj. In this example, you can run that \n\napplication\
    \ by typing **./obj/app**.\n\n From the Library of Wow! eBook"
