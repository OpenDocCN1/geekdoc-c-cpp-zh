  md: "Handling Data\n\n**49**\n\n**Creating Two-Dimensional Arrays**\n\n**Creating\
    \ two-Dimensional **\n\n**Arrays**\n\nSo far we’ve been working with arrays in\
    \ \n\none dimension, but you can create multi-\n\ndimensional arrays as well.\
    \ While you \n\naccess an element in a one-dimensional \n\narray as array\\[*element\\\
    _number*\\], you access \n\nelements in a two-dimensional array as \n\narray\\\
    [*row*\\]\\[*column*\\]. \n\nFor example, if you have an array of student \n\n\
    scores for each of three tests and want to \n\nfind the average score for each\
    \ of the three \n\ntests, you can use a two-dimensional array. \n\nYou initialize\
    \ the two-dimensional array with \n\nnested lists in curly braces and loop over\
    \ the \n\nlists with nested for loops: \n\n  int test\\_index, student\\_index, \n\
    \n    scores\\[3\\]\\[5\\] = {\n\n    { 92 , 73 , 57 , 98 , 89 },    \n\n    { 88 , 76 , 23 , 95 , 72 },    \n\
    \n    { 94 , 82 , 63 , 99 , 94 }\n\n  };\n\n  float sum;\n\n  for (test\\_index = 0; test\\\
    _index < 3; \n\n    test\\_index++)\n\n  {   \n\n    for (student\\_index = 0, sum = 0; \n\
    \n      student\\_index \n\n      < 5; student\\_index++)\n\n    { \n\n      sum + = \n\
    \n       scores\\[test\\_index\\]\\[student\\_index\\];\n\n    }\n\n    printf(\n\
    \n      “Average for test %i is %2.1f.\\\\n”,  \n\n      test\\_index + 1, sum / 5); \n\
    \n  }\n\n From the Library of Wow! eBook"
