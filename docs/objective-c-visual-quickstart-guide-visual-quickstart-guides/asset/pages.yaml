    **4.** Save if.m.\n\n**5.** Run the if.m program. \n\nYou should see the following:\n\
    \nPerfect weather.\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n  int temperature = 72;\n\
    \n  if (temperature = = 72)\n\n  {\n\n        .\n\n        .\n\n        .\n\n\
