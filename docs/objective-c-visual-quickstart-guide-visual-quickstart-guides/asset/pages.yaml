  md: "**43**\n\n**Handling Data**\n\n**3**\n\nThis chapter is all about working with\
    \ data \n\nin Objective-C. You’ll use arrays, pointers, \n\nstrings, and more.\
    \ \n\nAn array is a set of data items, called elements, \n\nthat you can refer\
    \ to with an array index. For \n\nexample, if you store numbers in an array \n\
    \nnamed array, you can address each element \n\nwith an index number like this:\
    \ array\\[0\\], \n\nwhich refers to the first element; array\\[1\\], \n\nwhich\
    \ refers to the second element; and so \n\non. The following code creates an array\
    \ of five \n\nelements, stores a value of 51 in array\\[0\\], \n\nand then displays\
    \ that value:\n\n#include <stdio.h>\n\nint main( ){\n\n  int array\\[5\\];\n\n\
      array\\[0\\] = 51;\n\n  printf(“array\\[0\\] is %i.\\\\n”, array\\[0\\]);\n\n\
      return 0;}\n\nPointers are special variables that hold the \n\naddress in memory\
    \ of data items. You can \n\nstore the address of a variable named integer\n\n\
    in a pointer with the & operator like this:\n\n  pointer = &integer;   \n\n*continues\
    \ on next page*\n\nHandling Data\n\n From the Library of Wow! eBook"
