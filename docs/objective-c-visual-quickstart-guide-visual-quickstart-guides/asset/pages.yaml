  md: "Managing Memory in Objective-C\n\n**197**\n\n**Creating the Class**\n\n**Deallocating\
    \ Memory **\n\n**Yourself: Creating the Class**\n\nIf you create objects of your\
    \ own classes that \n\nstore other objects internally, you’re respon-\n\nsible\
    \ for releasing the internal objects when \n\nthe overall object is deallocated.\n\
    \nIn the remaining tasks in this chapter, \n\nyou’ll see how this works using\
    \ an example \n\nclass named Friend that internally stores \n\ntwo NSString objects\
    \ that correspond to \n\nthe friend’s first and last names. When the \n\nFriend\
    \ object is deallocated, you’ll manually \n\nrelease the two internal strings.\n\
    \n**to create the Friend class:**\n\n**1.** Create a file named **friends.m**.\n\
    \n**2.** In friends.m, enter the code shown in \n\n**Listing 10.15**. \n\nThis\
    \ code creates the Friend class and \n\ninternally stores the friend’s first and\
    \ \n\nlast names.\n\n**3.** Save friends.m.\n\n#import <Foundation/Foundation.h>\n\
    \n#import <stdio.h>\n\n@interface Friend: NSObject \n\n{\n\n  NSString \\*firstName;\n\
    \n  NSString \\*lastName;\n\n}\n\n\\-(Friend\\*) initWithName: (NSString\\*) \n\
    \n  first lastName: (NSString\\*) last;\n\n\\-(void) setName: (NSString\\*) first\n\
    \n  lastName: (NSString\\*) last;\n\n\\-(void) print;\n\n@end\n\n@implementation Friend\n\
    \n\\-(Friend\\*) initWithName: (NSString\\*) \n\n  first lastName: (NSString\\\
    *) last \n\n{\n\n  self = \\[super init\\];\n\n  if (self) {\n\n    \\[self setName: first lastName: last\\\
    ];\n\n  }\n\n  return self;\n\n}\n\n\\-(void) setName: (NSString\\*) first\n\n\
      lastName: (NSString\\*) last \n\n{\n\n  \\[self setFirst: first\\];\n\n  \\\
    [self setLast: last\\];\n\n}\n\n\\-(void) print \n\n{\n\n  printf(“Your friend’s name is %s %s”, \n\
    \n    \\[firstName cString\\], \\[lastName \n\n    cString\\]);\n\n}\n\n@end\n\
