  md: "Chapter 5\n\n**88**\n\n**Storing Data in Objects**\n\n**Storing Data in Objects**\n\
    \nIn the previous task, you saw how to set up a \n\nmethod in an object. But objects\
    \ can contain \n\nboth methods and data. In this task, you’ll see \n\nhow to store\
    \ data in objects. You’ll also see \n\nhow to pass arguments to object methods.\n\
    \nYou set up your data in variables in the \n\n@interface section. Then your code\
    \ can \n\naccess those variables by name in the \n\nmethods in the @implementation\
    \ section. \n\nFor example, the code here stores an integer:\n\n@interface Container: NSObject \n\
    \n{\n\n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\n\\-(int) intValue;\n\
    \n@end\n\n@implementation Container \n\n\\-(void) setNumber: (int) n \n\n{\n\n\
        number = n;\n\n}\n\n@end\n\nThen you can execute an object of this class,\
    \ \n\nsending it the value 5 to store:\n\n\\[object setNumber: 5\\];\n\n**to store\
    \ data in an object:**\n\n**1.** Create a new program named \n\n**objectdata.m**.\n\
    \n**2.** In objectdata.m, enter the code shown in \n\n**Listing 5.9**. \n\nThis\
    \ code sets up an internal integer \n\nnamed number and a method named \n\nsetNumber\
    \ to store a value in that integer.\n\n#include <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n@interface Container: NSObject \n\n{\n\n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\
    \n\\-(int) intValue;\n\n@end\n\n@implementation Container \n\n\\-(void) setNumber: (int) n \n\
    \n{\n\n    number = n;\n\n}\n\n\\-(int) intValue\n\n{\n\n  return number;\n\n\
    }\n\n@end\n\n        .\n\n        .\n\n        .\n\n**Listing 5.9 **Starting objectdata.m.\n\
