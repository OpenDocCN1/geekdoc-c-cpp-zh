  md: "Chapter 3\n\n**48**\n\n**Looping over Arrays**\n\n**Looping over Arrays**\n\
    \nArrays and loops are made for each other. \n\nArrays hold sets of data, and\
    \ loops let you \n\niterate over such data sets. Looping over \n\nlong sets of\
    \ data in arrays is one of the things \n\ncomputers are really good at.\n\nFor\
    \ example, if you have an array of student \n\nscores and want to find their average,\
    \ you can \n\nuse a for loop:.\n\n  int student\\_index, scores\\[5\\] = \n\n\
        { 92 , 73 , 57 , 98 , 89 };    \n\n  float sum = 0;\n\n  for (student\\_index = 0, sum = 0; \n\
    \n    student\\_index < 5; student\\_index++) \n\n  {\n\n    sum + = scores\\\
    [student\\_index\\];\n\n  }\n\n  printf(“Average score is %2.1f”, \n\n    sum / 5);\n\
    \n**to loop over an array:**\n\n**1.** Create a new program named \n\n**arrayloop.m**.\n\
    \n**2.** In arrayloop.m, enter the code shown in \n\n**Listing 3.5**. \n\nThis\
    \ code creates the scores array and \n\ninitializes it.\n\n**3.** Add the code\
    \ to sum all the elements \n\nin the array and find their average \n\n(**Listing\
    \ 3.6**).\n\n**4.** Save arrayloop.m.\n\n**5.** Run the arrayloop.m program. \n\
    \nYou should see the following:\n\nAverage score is 81.8\n\n#include <stdio.h>\n\
    \nint main( )\n\n{\n\n  int student\\_index, scores\\[5\\] = \n\n    { 92 , 73 , 57 , 98 , 89 };    \n\
    \n  float sum = 0;\n\n        .\n\n        .\n\n        .\n\n  return 0;\n\n}\n\
    \n**Listing 3.5 **Starting arrayloop.m.\n\n#include <stdio.h>\n\nint main( )\n\
    \n{\n\n  int student\\_index, scores\\[5\\] = \n\n    { 92 , 73 , 57 , 98 , 89 };    \n\
    \n  float sum = 0;\n\n** for (student\\_index = 0, sum = 0; **\n\n** student\\\
    _index < 5; student\\_index++) **\n\n** {**\n\n** sum + = scores\\[student\\_index\\\
    ];**\n\n** }**\n\n** printf(“Average score is %2.1f”, **\n\n** sum / 5);**\n\n\
      return 0;\n\n}\n\n**Listing 3.6 **The arrayloop.m program.\n\n From the Library\
