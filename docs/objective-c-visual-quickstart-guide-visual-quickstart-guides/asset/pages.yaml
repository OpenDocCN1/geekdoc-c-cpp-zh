  md: "**163**\n\n**Using Arrays and Dictionaries**\n\n**9**\n\nIn this chapter, we’re\
    \ going to explore two \n\nimportant features of the Objective-C \n\nFoundation\
    \ classes: arrays and dictionaries.\n\nYou saw C-style arrays in Chapter 3. Those\
    \ \n\narrays let you handle your data as a set of val-\n\nues accessible by index.\
    \ For example, here’s \n\nhow to create a standard array and display \n\nsome\
    \ information about it:\n\n#include <stdio.h>\n\nint main( )\n\n{\n\n  int scores\\\
    [5\\] = {92 , 73 , 57 , 98 , \n\n    89 };\n\n  printf(\n\n    “The array is %i elements long.”,\n\
    \n    sizeof(scores) / sizeof(int));\n\n  return 0;\n\n}\n\nIn this chapter, you’re\
    \ going to build arrays \n\nusing the Foundation classes that come with \n\nObjective-C.\
    \ Those array classes let you do \n\nmore with arrays, such as sort them, as you’ll\
    \ \n\nsee in this chapter.\n\n*continues on next page*\n\nUsing Arrays \n\nand\
    \ Dictionaries\n\n From the Library of Wow! eBook"
