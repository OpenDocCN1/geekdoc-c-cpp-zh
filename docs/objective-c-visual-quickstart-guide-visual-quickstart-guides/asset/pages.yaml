  md: "Chapter 10\n\n**194**\n\n**Using an Autorelease Pool**\n\n**Using an Autorelease\
    \ Pool **\n\n If you use alloc or new to create an object, \n\nyou’re responsible\
    \ for managing the object’s \n\nmemory yourself (if memory is a concern). \n\n\
    But for objects that you don’t create with \n\nalloc or new, you can have Objective-C\
    \ man-\n\nage them for you using an autorelease pool.\n\nJust create a pool object,\
    \ and the objects will \n\nbe placed in it automatically. At the end of \n\nthe\
    \ program, you have only to release the \n\npool to release all the objects.\n\
    \n**to use an autorelease pool:**\n\n**1.** Create a file named **pool.m**.\n\n\
    **2.** In pool.m, enter the code shown in \n\n**Listing 10.11**. \n\nThis code\
    \ creates the pool and a pool-\n\nmanaged object: string1.\n\n**3.** Add the code\
    \ to print the object’s retain \n\ncount and release the pool when the \n\nprogram\
    \ ends (**Listing 10.12**).\n\n**4.** Save pool.m.\n\n**5.** Run the pool.m program.\
    \ \n\nYou should see the following:\n\nPool-managed string’s retain count: 1\n\
