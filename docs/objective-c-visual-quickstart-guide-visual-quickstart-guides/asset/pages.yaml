  md: "Chapter 9\n\n**164**\n\n**Using Arrays and Dictionaries**\n\nYou can also create\
    \ dictionaries in Objective-C \n\nusing the Foundation classes. A dictionary \n\
    \nin Objective-C is just like an array, but it uses \n\nwords as index values,\
    \ not numerical values. \n\nSo while an array might be indexed by the \n\nnumbers\
    \ 0, 1, 2, 3, and so on, a dictionary \n\nwould use the index terms “zero,” “one,”\
    \ “two,” \n\n“three,” and so on. The index values need not \n\nbe sequential;\
    \ you could as well have used \n\n“banana,” “apple,” and “orange.”\n\nIn addition,\
    \ you can create mutable arrays \n\nand dictionaries: that is, arrays and dictionar-\n\
    \nies whose length can be changed on the fly in \n\nyour code. You’ll see how\
    \ that works here.\n\nAll that and more is coming up in this \n\nchapter, which\
    \ includes: the NSArray, \n\nNSMutableArray, NSMutableDictionary, and \n\nNSDictionary\
    \ classes, as well as some others.\n\n From the Library of Wow! eBook"
