  md: "Directing Program Flow\n\n**35**\n\n**Using the for Loop**\n\n**Using the for\
    \ Loop **\n\nLoops let computers do what they excel at: \n\nperform many operations\
    \ rapidly. Loops let \n\nyou execute a section of code over and over, \n\ntypically\
    \ operating on different data in each \n\nloop *iteration* (that is, each time\
    \ through \n\nthe loop). \n\nThe for loop has this format:\n\nfor(*initilialization*; *end\\\
    _condition*; \n\n  *after\\_loop\\_expression*)\n\n{\n\n  *body *\n\n}\n\nHere,\
    \ *initilization* is an expression evalu-\n\nated before the loop starts; you\
    \ typically set a \n\nloop\\_index variable (which keeps track of the \n\nnumber\
    \ of times the loop has executed) to \n\nzero here. The *end\\_condition* specification\
    \ \n\nis an expression (such as loop\\_index < 5) \n\nthat, when it is no longer\
    \ true, ends the loop. \n\nThe *after\\_loop\\_expression* specification \n\n\
    is executed after the body of the loop (in \n\ncurly braces following the for\
    \ statement) is \n\nexecuted; you typically increment the loop\\_\n\nindex value\
    \ here. \n\nHere’s an example that uses a for loop to dis-\n\nplay the message\
    \ “You’ll see this five times.”:\n\nint main(void)\n\n{\n\n  int loop\\_index;\n\
    \n** for (loop\\_index = 0; loop\\_index < 5; **\n\n** loop\\_index++)**\n\n**\
    \ {**\n\n** printf(**\n\n** “You’ll see this five times.\\\\n”);**\n\n** }**\n\
    \n  return 0;\n\n}\n\n From the Library of Wow! eBook"
