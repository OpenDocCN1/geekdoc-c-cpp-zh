    ];\n\n  NSEnumerator \\*enumerator = \\[array \n\n    objectEnumerator\\];\n\n\
      id obj;\n\n        .\n\n        .\n\n        .\n\n}\n\n**Listing 9.5 **Starting\
    \ enumerator.m.\n\n From the Library of Wow! eBook"
