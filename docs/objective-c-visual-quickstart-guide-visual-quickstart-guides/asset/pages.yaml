  md: "Chapter 6\n\n**100**\n\n**About Access Specifiers**\n\n**About Access Specifiers**\n\
    \nThere are three access specifiers: @public\n\n(the default), which puts no restriction\
    \ on the \n\nscope of a member; @private, which restricts \n\naccess to code that\
    \ is in the class in which \n\nthe member is declared; and @protected, \n\nwhich\
    \ restricts access to code that is in the \n\nclass in which the member is defined\
    \ and \n\nclasses derived from that class \n\nSo, for example, you can use this\
    \ code to \n\naccess an object’s public variable outside \n\nthat object:\n\n\
    #import <stdio.h>\n\n#import <Foundation/NSObject.h>\n\n@interface Access: NSObject {\n\
    \n@public\n\n    int publicVariable;\n\n}\n\n@end\n\n@implementation Access\n\n\
    @end\n\nint main(void) \n\n{\n\n  Access \\*a = \\[Access new\\];\n\n  a->publicVariable = 1;\n\
    \n  printf( “The public variable is %i\\\\n”,  \n\n  a->publicVariable );\n\n\
      return 0;\n\n}\n\n** tip**\n\nSee Chapter 7, “Working with Object-\n\nOriented\
    \ Inheritance” for a discussion of \n\nhow to derive one class from another. \n\
    \n From the Library of Wow! eBook"
