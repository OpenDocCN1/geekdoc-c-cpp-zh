  md: "Directing Program Flow\n\n**27**\n\n**Using the else Statement**\n\n**Using\
    \ the else Statement**\n\nThe if statement allows you to specify code \n\nthat\
    \ runs if a condition you specify (such as \n\ntemperature = = 72) is true. The\
    \ else state-\n\nment lets you specify alternative code that \n\nruns when an\
    \ if statement’s condition turns \n\nout to be false.\n\nFor example, as shown\
    \ here, you can modify \n\nthe previous task’s code to display the mes-\n\nsage\
    \ “Weather could be better.” if the tem-\n\nperature is not 72.\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n  int temperature = 78;\n\n  if (temperature = = 72)\n\
