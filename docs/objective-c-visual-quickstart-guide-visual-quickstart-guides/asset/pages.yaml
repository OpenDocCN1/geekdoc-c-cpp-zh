  md: "Classes and Objects\n\n**81**\n\n**Classes and Objects**\n\nBesides using this\
    \ different syntax, you \n\ncommunicate with objects by sending them \n\nmessages,\
    \ not by calling object methods \n\ndirectly. For example, to send a message to\
    \ \n\nthe setNumber method of an object named \n\nobject to set its internally\
    \ stored number \n\nto 5, you send a message like this: \\[object \n\nsetNumber: 5\\\
    ].\n\nObjective-C classes are usually based on \n\nthe Foundation class NSObject,\
    \ so if you’re \n\nusing Linux, UNIX, or Windows, you need to \n\ncreate a GNUmakefile,\
    \ make sure you’re in \n\nthe same directory as that file, and type **make**\n\
    \nin the GNUstep shell (see the introduction to \n\nChapter 3 for more information\
    \ about setting \n\nup the environment variables to use make). If \n\nyou enter\
