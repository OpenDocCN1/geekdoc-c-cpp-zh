  md: "Chapter 4\n\n**66**\n\n**Returning Values from Functions**\n\n**returning Values\
    \ from **\n\n**Functions**\n\nIn addition to passing data to functions, you \n\
    \ncan have functions return data. They can \n\nreturn a single data item—an integer,\
    \ for \n\nexample—or an array or an object.\n\nTo indicate that a function returns\
    \ a value, \n\nyou specify the type of that data value first \n\nin a function\
    \ definition or declaration. For \n\nexample, you can alter the adder( ) function\
    \ \n\nfrom the previous task to return an integer \n\nvalue holding the sum of\
    \ the two values \n\npassed to it, like this:\n\nint adder(int x, int y)\n\nTo\
    \ actually return the sum of the two values \n\npassed to the adder( ) function,\
    \ you use a \n\nreturn statement:\n\nint adder(int x, int y)\n\n{\n\n  return x + y;\n\
    \n}\n\nThat’s how it works: to return a value from \n\na function, you place the\
    \ value you want to \n\nreturn right after the keyword return. \n\nNow when you\
    \ call the adder( ) function and \n\npass data to that function, the call itself\
    \ will \n\nbe replaced by the function’s return value. So \n\nto add 5 and 10\
    \ and display the results, you \n\ncan use this code:\n\n  int value1 = 5, value2 = 10;\n\
    \n  printf(“%i + %i = %i”, value1, value2, \n\n    adder(value1, value2));\n\n\
    \ From the Library of Wow! eBook"
