  md: "**203**\n\n**Exception Handling**\n\n**11**\n\nErrors are a fact of life. Even\
    \ the most perfect \n\nprogrammer has code that creates run-time \n\nerrors at\
    \ times. This chapter is about han-\n\ndling such cases.\n\nYou’ll commonly encounter\
    \ two kinds of \n\nerrors: compile-time errors and run-time \n\nerrors. Compile-time\
    \ errors are those raised \n\nby the compiler, and you have to fix those \n\n\
    before you continue with your program. Run-\n\ntime errors happen at run-time,\
    \ even though \n\nyour code compiled fine. Run-time errors are \n\ncommonly called\
    \ exceptions.\n\nObjective-C can handle exceptions, but the way \n\nit does so\
    \ varies by platform. In this chapter, \n\nwe’ll use the GNUstep way of handling\
    \ excep-\n\ntions, which is the most common method.\n\nHere, you use macros like\
    \ NS\\_DURING and \n\nNS\\_HANDLER to handle exceptions when they \n\nhappen.\
    \ For example, this code creates a \n\ncustom exception and then reports on it:\n\
    \n#import <Foundation/Foundation.h>\n\n#import <stdio.h>\n\nint main( ) \n\n{\n\
    \n  NSAutoreleasePool \\*pool = \n\n    \\[\\[NSAutoreleasePool alloc\\] init\\\
    ];\n\n*continues on next page*\n\nException \n\nHandling\n\n From the Library\
    \ of Wow! eBook"
