  md: "Getting Started: Essential Objective-C\n\n**3**\n\n**Creating Your First Program**\n\
    \n**Creating Your First **\n\n**Program**\n\nWe’re going to jump right into Objective-C\
    \ by \n\ncreating and running a program, which we’ll \n\nname first.m.\n\nWe’ll\
    \ start by creating a function—that is, \n\na bit of code that you can call by\
    \ name— \n\nnamed main( ):\n\nint main(void)\n\n{\n\n        .\n\n        .\n\n\
            .\n\n}\n\nFunctions can be passed data, as you’ll see \n\nlater, but this\
    \ function isn’t passed any data, \n\nwhich is why we use the keyword void in\
    \ \n\nthe parentheses. Functions can also return \n\nvalues, and the main( ) function\
    \ returns \n\nan integer value to Objective-C indicating \n\nwhether the program\
    \ succeeded. The int in \n\nfront of main( ) tells Objective-C to expect an \n\
    \ninteger return value. The code for the main( )\n\nfunction goes inside curly\
    \ braces: { and }.\n\nNext, we’ll use the built-in Objective-C func-\n\ntion named\
    \ printf( ) to display some text. \n\nWe pass the text we want printf( ) to display\
    \ \n\ninside parentheses:\n\nint main(void)\n\n{\n\n** printf (“Welcome to Objective-C!”);**\n\
    \n        .\n\n        .\n\n        .\n\n}\n\n*continues on next page*\n\n**\
    \ tip**\n\n The extension for Objective-C code files \n\nis .m.\n\n From the\
    \ Library of Wow! eBook"
  merge: -1
  pgno: 11
- img_proc: true
  md: "Chapter 1\n\n**4**\n\n**Creating Your First Program**\n\nTo use the printf( )\
    \ function, we have to \n\ntell Objective-C about that function with a \n\nfunction\
    \ declaration, as you’ll see when we \n\ndiscuss how to create functions. The\
    \ decla-\n\nrations for the standard I/O functions like \n\nprintf( ) are contained\
    \ in an Objective-C file \n\nnamed stdio.h, where .h stands for “header \n\nfile”;\
    \ we include stdio.h in our program as \n\nshown here so Objective-C knows about\
    \ the \n\nprintf( ) function:\n\n**#include <stdio.h>**\n\nint main(void)\n\n\
    {\n\n  printf (“Welcome to Objective-C!”);\n\n        .\n\n        .\n\n        .\n\
    \n}\n\nWhen the program ends, Objective-C will \n\nexpect some indication of whether\
    \ the func-\n\ntion succeeded. We’ll return a value of 0 to \n\nObjective-C, which\
    \ means there were no \n\nerrors. **Listing 1.1** shows the entire program, \n\
    \nwhich you will create step by step in the \n\nfollowing tasks.\n\n** tip**\n\
    \nNote that #import and #include are the \n\nsame for our purposes. You can use\
    \ them \n\ninterchangeably and in any order.\n\n#include <stdio.h>\n\nint main(void)\n\
    \n{\n\n  printf (“Welcome to Objective-C!”);\n\n** return 0;**\n\n}\n\n**Listing\
    \ 1.1 **Your first Objective-C program.\n\n From the Library of Wow! eBook"
  merge: -1
