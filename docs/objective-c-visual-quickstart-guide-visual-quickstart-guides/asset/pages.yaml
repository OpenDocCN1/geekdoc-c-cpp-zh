  md: "Chapter 10\n\n**184**\n\n**Managing Memory in Objective-C**\n\nWhen you pass\
    \ an object the retain mes-\n\nsage, it increments its own retain count. So in\
    \ \n\nthis case, the retain count for object1 would \n\nincrease from 1 to 2 to\
    \ 3, and the retain count \n\nfor object2 would increase from 1 to 2.\n\nTo decrement\
    \ the retain count, you send an \n\nobject a release message:\n\n  \\[object1 release\\\
    ]; \n\n  \\[object2 release\\]; \n\nThese two lines of code reduce the retain\
    \ \n\ncount of object1 to 2 and the retain count \n\nof object2 to 1.\n\nWhen\
    \ you send a release message that \n\nreduces the retain count of an object to\
    \ 0, \n\nObjective-C automatically deallocates that \n\nobject. You’ll implement\
    \ the dealloc method \n\nfor objects yourself in this chapter to see how \n\n\
    Objective-C deallocates your objects.\n\n From the Library of Wow! eBook"
