  md: "Chapter 4\n\n**74**\n\n**Passing Constant Data to Functions**\n\n**Passing\
    \ Constant Data **\n\n**to Functions**\n\nAs you know, if you pass pointers to\
    \ func-\n\ntions, those functions can change the data \n\nto which the pointers\
    \ point. Since arrays \n\ncan double as pointers, if you pass an array \n\nas\
    \ a pointer in a function, the function can \n\nchange your original array. To\
    \ avoid that, \n\nwhen you pass a copy of your array to the \n\nfunction, mark\
    \ it as a constant so it can’t be \n\nchanged. You mark data as constant with\
    \ the \n\nconst keyword:\n\n  int data\\[ \\] = {1, 2, 3, 4};\n\n  int total = adder(data, \n\
    \n    sizeof(data)/sizeof(int));\n\n  printf(“The total is %i\\\\n”, total);\n\
    \n**long adder(const int array\\[ \\], int **\n\n**number\\_elements) **\n\n{\n\
    \n  long sum = 0;                   \n\n  int loop\\_index;\n\n  for (loop\\_index = 0; loop\\\
    _index < \n\n    number\\_elements; loop\\_index++)\n\n      sum = sum + array\\\
    [loop\\_index\\];\n\n  return sum;\n\n}\n\nIn this task, we’ll modify the previous\
    \ task’s \n\ncode to use constant arrays.\n\n**to pass constant arrays to functions:**\n\
    \n**1.** Create a new program named \n\n**functionpassconstarrays.m**.\n\n**2.**\
    \ In functionpassconstarrays.m, enter the \n\ncode shown in **Listing 4.15**.\
    \ \n\nThis code creates an array and passes it to \n\na function named adder( )\
    \ whose proto-\n\ntype indicates that it takes constant arrays.\n\n#include <stdio.h>\n\
    \nlong adder(const int array\\[ \\], int number\\_\n\nelements);\n\nint main( )\n\
    \n{\n\n  int data\\[ \\] = {1, 2, 3, 4};\n\n  int total = adder(data, \n\n    sizeof(data)/sizeof(int));\n\
    \n  printf(“The total is %i\\\\n”, total);\n\n  return 0;\n\n}\n\n**Listing 4.15\
    \ **Starting functionpassconstarrays.m.\n\n From the Library of Wow! eBook"
