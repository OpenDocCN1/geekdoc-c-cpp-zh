  md: "**119**\n\n**Working with Object-Oriented Inheritance**\n\n**7**\n\nThis chapter\
    \ discusses the process of deriving \n\none class from another—a process called\
    \ \n\n*inheritance*. \n\nYou can derive one class from another in \n\nObjective-C.\
    \ The class you derive from is \n\ncalled the *base class*, and the new class\
    \ you’re \n\nderiving from the base class is called the \n\n*derived class*. \n\
    \nThe derived class can inherit all the functional-\n\nity of the base class,\
    \ and it can customize that \n\nfunctionality as well. For example, you might\
    \ \n\nhave a base class named Animal that creates a \n\ngeneric animal. The Animal\
    \ class might have \n\na method to set the animal’s name, setName, \n\nand another\
    \ to get the animal’s name, getName. \n\nThen, no matter what kind of animal you\
    \ want \n\nto create, Animal can serve as a base class for \n\nit, and all the\
    \ derived animals will have built-in \n\nsetName and getName methods.\n\nYou might\
    \ use Animal as a base class for other \n\nclasses, such as Cat and Dog. If you\
    \ create \n\na class named Cat, for example, you might \n\nwant more than just\
    \ setName and getName\n\nmethods; for instance, you might also want \n\nadd your\
    \ own method, the meow method, \n\nwhich prints out “Meow.”\n\n*continues on next\
    \ page*\n\nWorking \n\nwith Object-\n\nOriented Inheritance\n\n From the Library\
    \ of Wow! eBook"
  merge: -1
  pgno: 127
- img_proc: true
  md: "Chapter 7\n\n**120**\n\n**Working with Object-Oriented Inheritance**\n\nIf\
    \ you also derive a class named Dog from the \n\nAnimal class, you might add a\
    \ method named \n\nbark to it.\n\nThe Cat class would then have the methods \n\
    \nsetName, getName, and meow. The Dog class \n\nwould have the methods setName,\
    \ getName, \n\nand bark. So as you can see, although the \n\nDog and Cat classes\
    \ share some functionality, \n\nbecause they are both classes of animals, they\
    \ \n\nalso have been customized.\n\nThat’s the idea behind inheritance: you \n\
    \nuse inheritance when you want to create \n\nclasses that share some functionality.\
    \ Using \n\ninheritance, you can save a lot of work. In \n\nthis example, in addition\
    \ to the Cat and Dog\n\nclasses, you might use the Animal class to \n\nderive\
    \ the Tiger, Leopard, Lion, Squid, and \n\nOcelot classes.\n\nYou can also have\
    \ multi-level inheritance. \n\nSo, for example, you might use the Dog class \n\
    \nas the base class for the Terrier and Collie\n\nclasses. \n\n** tip**\n\nAlthough\
    \ inheritance in Objective-C is a \n\npowerful tool, it lacks some capabilities\
    \ \n\nfound in C++ and some other object-\n\noriented programming languages. For\
    \ \n\ninstance, it lacks operator overloading \n\nand also multiple inheritance\
    \ (in which \n\na single class can inherit from multiple \n\nother classes).\n\
    \n From the Library of Wow! eBook"
