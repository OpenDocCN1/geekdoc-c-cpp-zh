  md: "Chapter 5\n\n**80**\n\n**Classes and Objects**\n\nObjective-C has its own syntax\
    \ for classes \n\nand objects, and if you haven’t programmed \n\nin Objective-C\
    \ before, this syntax will take \n\na little time to learn. Here’s an example\
    \ that \n\nwe’ll dissect in this chapter. This example \n\ndefines a class, then\
    \ creates an object of that \n\nclass, then stores an integer in that object,\
    \ \n\nand then prints the stored integer:\n\n#include <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n@interface Container: NSObject \n\n{\n\n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\
    \n\\-(int) intValue;\n\n@end\n\n@implementation Container \n\n\\-(void) setNumber: (int) n \n\
    \n{\n\n    number = n;\n\n}\n\n\\-(int) intValue\n\n{\n\n  return number;\n\n\
    }\n\n@end\n\nint main(void)\n\n{\n\n  Container \\*object = \\[Container new\\\
    ];\n\n  \\[object setNumber: 5\\];\n\n  printf(“The number is %i\\\\n”, \\[object  \n\
    \n  intValue\\]);\n\n  return 0;\n\n}\n\nThe result of this code looks like this:\n\
    \nThe number is 5\n\n From the Library of Wow! eBook"
