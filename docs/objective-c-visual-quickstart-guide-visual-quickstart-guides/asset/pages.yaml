  md: "Exception Handling\n\n**205**\n\n**Catching Exceptions**\n\n**Catching Exceptions**\n\
    \nWhenever your code may cause an exception— \n\nfor example, by dividing by zero—you\
    \ can \n\nenclose it in a NS\\_DURING macro like this:\n\nNS\\_DURING\n\n{\n\n\
    *\\[Sensitive code\\]*\n\n}\n\nThis is the first step in GNUstep exception \n\n\
    handling: any exceptions that happen inside \n\nan NS\\_DURING macro can be handled\
    \ in an \n\nNS\\_HANDLER macro, which is covered in the \n\nnext task.\n\n**to\
    \ catch exceptions:**\n\n**1.** Create a program named **main.m**.\n\n**2.** In\
    \ main.m, enter the code shown in \n\n**Listing 11.1**. \n\nThis code creates\
    \ an NS\\_DURING block.\n\n**3.** Add your exception-prone code to the \n\nNS\\\
    _DURING block (**Listing 11.2**).\n\n**4.** Save main.m.\n\n#import <Foundation/Foundation.h>\n\
    \n#import <stdio.h>\n\nint main( ) \n\n{\n\nNS\\_DURING\n\n{\n\n        .\n\n\
            .\n\n        .\n\n}\n\nreturn 0;\n\n}\n\n**Listing 11.1 **Starting main.m.\n\
    \n#import <Foundation/Foundation.h>\n\n#import <stdio.h>\n\nint main( ) \n\n{\n\
    \nNS\\_DURING\n\n{\n\n**\\[Sensitive code\\]**\n\n}\n\nreturn 0;\n\n}\n\n**Listing\
    \ 11.2 **The main.m program.\n\n From the Library of Wow! eBook"
