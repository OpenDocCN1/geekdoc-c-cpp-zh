  md: "Directing Program Flow\n\n**39**\n\n**Using the do...while Loop**\n\n**Using\
    \ the do...while Loop **\n\nOne more popular loop that Objective-C \n\noffers\
    \ is the do...while loop. Like the while\n\nloop, this loop keeps executing its\
    \ body while \n\na certain condition is true, but unlike the \n\nwhile loop, it\
    \ checks its condition *after* the \n\nloop’s body executes. The do...while loop\
    \ \n\nhas this format:\n\ndo {\n\n  *body*\n\n} while(*condition*);\n\nThe do...while\
    \ loop executes its body and \n\nthen checks the *condition* expression; it \n\
    \nit’s true, the loop executes again. When the \n\ncondition is tested and turns\
    \ out to be false, \n\nthe loop stops executing. \n\nWhy do you need the do...while\
    \ loop in \n\naddition to the while loop? You typically use \n\na do...while loop\
    \ when the loop condition \n\nis set for the first time within the loop: for \n\
    \nexample, if you’re reading from a file and ter-\n\nminating the loop at the\
    \ end of the file, you \n\nneed to try to read from the file at least once \n\n\
    to see if the file contains any data for you to \n\nread before the loop is terminated.\n\
    \nHere’s an example that displays the message \n\n“You’ll see this five times.”\
    \ This time, a \n\ndo...while loop was used:\n\n#include <stdio.h>\n\nint main(void)\n\
    \n{\n\n  int loop\\_index = 0;\n\n** do {**\n\n** printf(**\n\n** “You’ll see\
    \ this five times.\\\\n”);**\n\n** loop\\_index++; **\n\n** } while (loop\\_index\
    \ < 5);**\n\n  return 0;\n\n}\n\n From the Library of Wow! eBook"
