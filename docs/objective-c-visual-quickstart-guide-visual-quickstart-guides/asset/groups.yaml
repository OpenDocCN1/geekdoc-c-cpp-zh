- md: "\n## Chapter 7\n\n## Restricting Access\n\nYou can also restrict inheritance\
    \ if you mark class members with @protected. This access specifier is less restrictive\
    \ than @private; derived classes can still use the protected members of the base\
    \ class, but no other code can. That is, protected members are available only\
    \ to the code in the base class and any classes derived from the base class. You\
    \ learned about @protected in the previous chapter; here, you’ll use it with inheritance.\n\
    \n**to restrict inheritance:**\n\n1. Create a new program named **protected.m**.\n\
    2. In protected.m, enter the code shown in **Listing 7.15**. This code creates\
    \ the two classes you’ll use.\n\n```objectivec\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\
    \n@interface Class1 : NSObject {\n@protected\n    int protectedVariable;\n}\n\
    @end\n\n@implementation Class1\n\n@end\n\n@interface Class2 : Class1 \n\n-(void)\
    \ print;\n@end\n\n@implementation Class2\n\n-(void) print\n{\n    protectedVariable\
    \ = 5;\n    printf(\"The protected variable is %i\\n\", protectedVariable);\n\
    }\n\n@end\n```\n**Listing 7.15 Starting protected.m.**\n\n## Restricting Access\n\
    \n3. Add the code to access the protected member in the derived class (**Listing\
    \ 7.16**).\n4. Save protected.m.\n5. Run the protected.m program. You should see\
    \ the following:\nprotected variable is 5.\n\n```objectivec\n#import <stdio.h>\n\
    #import <Foundation/NSObject.h>\n\n@interface Class1 : NSObject {\n@protected\n\
    \    int protectedVariable;\n}\n@end\n\n@implementation Class1\n\n@end\n\n@interface\
    \ Class2 : Class1\n\n-(void) print;\n@end\n\n@implementation Class2\n\n-(void)\
    \ print\n{\n    protectedVariable = 5;\n    printf(\"The protected variable is\
    \ %i\\n\", protectedVariable);\n}\n\n@end\n\nint main(void)\n{\n    Class2 *c\
    \ = [Class2 new];\n    [c print];\n    return 0;\n}\n```\n**Listing 7.16 The protected.m\
    \ program.**\n\n## Using Constructors with Inheritance\n\nWhat if the base class\
    \ has a constructor? You can call a base class’s constructor, passing it any arguments\
    \ you want, when you use the super keyword. The super keyword allows you to access\
    \ the base class in your code. In this task, you’ll access the base class’s constructor.\n\
    \nTip: *Super* refers to superclass, another word for the base class.\n\n**to\
    \ use constructors with inheritance:**\n\n1. Create a new program named **constructor.m**.\n\
    2. In constructor.m, enter the code shown in **Listing 7.17**. This code creates\
    \ the Class1 that has a constructor named init that uses the super keyword.\n\n\
    ```objectivec\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface\
    \ TheClass : NSObject\nstatic int count;\n+(int) getCount;\n@end\n\n@implementation\
    \ TheClass\n\n-(TheClass*)init\n{\n    self = [super init];\n    count++;\n  \
    \  return self;\n}\n\n+(int) getCount\n{\n    return count;\n}\n@end\n\nint main(void)\n\
    {\n    TheClass *tc1 = [TheClass new];\n    printf(\"TheClass count is %i\\n\"\
    , [TheClass getCount]);\n\n    TheClass *tc2 = [TheClass new];\n    printf(\"\
    TheClass count is %i\\n\", [TheClass getCount]);\n    return 0;\n}\n```\n**Listing\
    \ 7.17 Starting constructor.m.**\n\n3. Enter the code to create an object of Class1,\
    \ which will call the constructor (**Listing 7.18**).\n4. Save constructor.m.\n\
    5. Run the constructor.m program. You should see the following:\nTheClass count\
    \ is 1\nTheClass count is 2\n\n```objectivec\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\
    \n@interface TheClass : NSObject\nstatic int count;\n+(int) getCount;\n@end\n\n\
    @implementation TheClass\n\n-(TheClass*)init\n{\n    self = [super init];\n  \
    \  count++;\n    return self;\n}\n\n+(int) getCount\n{\n    return count;\n}\n\
    @end\n\nint main(void)\n{\n    TheClass *tc1 = [TheClass new];\n    printf(\"\
    TheClass count is %i\\n\", [TheClass getCount]);\n\n    TheClass *tc2 = [TheClass\
    \ new];\n    printf(\"TheClass count is %i\\n\", [TheClass getCount]);\n    return\
    \ 0;\n}\n```\n**Listing 7.18 The constructor.m program.**\n\n## Using Polymorphism\n\
    \nPolymorphism refers to using the same code with different objects: that is,\
    \ when you use polymorphism, the actual object used when you pass it a message\
    \ is determined at run time. For example, in this task, you’ll execute the same\
    \ code twice: [pointerToObject print]; The pointerToObject variable will hold\
    \ a pointer to a different object each time the code is executed, so the object\
    \ to which message is sent is determined when the code runs.\n\n**to use polymorphism:**\n\
    \n1. Create a new program named **polymorphism.m**.\n2. In polymorphism.m, enter\
    \ the code shown in **Listing 7.19**. This code creates the two classes you’ll\
    \ use.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n-(void) print;\n@end\n\n@implementation Class1\n\
    \n-(void) print\n{\n    printf(\"This is Class 1\\n\");\n}\n@end\n\n@interface\
    \ Class2 : NSObject\n-(void) print;\n@end\n\n@implementation Class2\n\n-(void)\
    \ print\n{\n    printf(\"This is Class 2\\n\");\n}\n@end\n```\n**Listing 7.19\
    \ Starting polymorphism.m.**\n\n3. Add the code to load a variable of the id type\
    \ with pointers to the two objects, one after the other, and execute the same\
