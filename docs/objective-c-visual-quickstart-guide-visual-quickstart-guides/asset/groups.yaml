    #include \"Class1.h\"\n#import \"printing.h\"\n\n@interface Class2 : Class1\n\
    @end\n```\n**列表 8.22** `ClassSecond.h` 文件。\n\n分类、位置声明与协议\n\n159\n\n## 协议：创建类实现\n\
    \n现在你已经定义了协议，并在两个类的接口中使用了它，你需要定义协议中方法的实现，在这里方法命名为 `print`。\n\n**使用协议定义实现：**\n\n\
    1. 创建一个名为 **ClassFirst.m** 的新程序。\n2. 在 `ClassFirst.m` 中，输入**列表 8.23** 所示的代码。这段代码创建了\
    \ `Class1` 的实现。\n3. 添加创建 `print` 方法实现的代码（**列表 8.24**）。\n4. 保存 `ClassFirst.m`。\n\
    5. 创建一个名为 **ClassSecond.m** 的新程序。\n\n```objectivec\n#import <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n@implementation Class1\n\n\
    @end\n```\n**列表 8.23** 开始 `ClassFirst.m`。\n\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n@implementation Class1\n\
    -(void)print {\n    printf(\"This is Class 1\\n\");\n}\n@end\n```\n**列表 8.24**\
