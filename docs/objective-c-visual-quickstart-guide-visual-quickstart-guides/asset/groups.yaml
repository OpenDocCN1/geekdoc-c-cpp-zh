- md: "\n## Chapter 1\n\n## 18\n### Using Assignment Operators\n\n3. Add the code\
    \ to put the assignment operators to use (**Listing 1.12**).\n\n4. Save assignment.m.\n\
    \n5. Run the assignment program.\n\nYou should see the following:\n\nx = 0.\n\
    x = 5 -> x: 5.\nx + = 5 -> x: 10.\nx -= 5 -> x: 5.\nx *= 5 -> x: 25.\nx /= 5 ->\
    \ x: 5.\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    float x = 0;\n   \
    \ float y = 5;\n    printf (\"x = %2.0f.\\n\", x);\n    x = y;\n    printf (\"\
    x = %2.0f --> x: %2.0f.\\n\", y, x);\n    x += y;\n    printf (\"x + = %2.0f -->\
    \ x: %2.0f.\\n\", y, x);\n    x -= y;\n    printf (\"x -= %2.0f --> x: %2.0f.\\\
    n\", y, x);\n    x *= y;\n    printf (\"x *= %2.0f --> x: %2.0f.\\n\", y, x);\n\
    \    x /= y;\n    printf (\"x /= %2.0f --> x: %2.0f.\\n\", y, x);\n    return\
    \ 0;\n}\n```\n**Listing 1.12** The assignment.m program using assignment operators.\n\
    \n## Getting Started: Essential Objective-C\n\n## 19\n### Using the Increment\
    \ and Decrement Operators\n\nObjective-C also supports two more operators: the\
    \ ++ increment operator and the -- decrement operator. For instance, to increment\
    \ the value in the variable named temperature, you write temperature++, which\
    \ adds 1 to the value in temperature. To decrement the value, you enter temperature--,\
    \ which decreases the value in temperature by 1.\n\nYou can use ++ and -- either\
    \ before or after a variable, and the position makes a difference. The expression\
    \ ++x adds 1 to x and then evaluates the rest of the line of code, and the expression\
    \ x++ first evaluates the line of code and then, after the current line of code\
    \ has finished executing, increments the value in x.\n\nFor example, say you have\
    \ this code:\n\n```c\nfloat x = 0;\nfloat y = 5;\nx = y++;\nprintf (\"After x\
    \ = y++ x: %2.0f y: %2.0f.\\n\", x, y);\n```\nThis code would print x: 5 y: 6,\
    \ because the increment operation was performed after the assignment. On the other\
    \ hand, say you execute:\n\n```c\nx = ++y;\nprintf (\"After x = ++y x: %2.0f y:\
    \ %2.0f.\\n\", x, y);\n```\nThis code would print x: 7 y: 7, because the increment\
    \ operation was completed first and then the assignment.\n\nLet’s test the increment\
    \ operator.\n\n**tip**: The decrement operator works the same way as the increment\
    \ operator.\n\n## Chapter 1\n\n## 20\n### Using the Increment and Decrement Operators\n\
    \nTo use the Objective-C increment operator:\n\n1. Create a new program named\
    \ **increment.m**.\n2. In increment.m, enter the code shown in **Listing 1.13**.\
    \ This code declares two variables: x and y.\n3. Add the code to put the increment\
    \ operator to use (**Listing 1.14**).\n4. Save increment.m.\n5. Run the increment.m\
    \ program.\n\nYou should see the following:\n\nx: 0 y; 5.\nAfter x = y++ x: 5\
    \ y: 6.\nAfter x = ++y x: 7 y: 7.\n\n```c\n#include <stdio.h>\nint main(void)\n\
    {\n    float x = 0;\n    float y = 5;\n    \n    return 0;\n}\n```\n**Listing\
    \ 1.13** Starting increment.m.\n\n```c\n#include <stdio.h>\nint main(void)\n{\n\
    \    float x = 0;\n    float y = 5;\n    printf (\"x: %2.0f y; %2.0f.\\n\", x,\
    \ y);\n    x = y++;\n    printf (\"After x = y++ x: %2.0f y: %2.0f.\\n\", x, y);\n\
    \    x = ++y;\n    printf (\"After x = ++y x: %2.0f y: %2.0f.\\n\", x, y);\n \
    \   return 0;\n}\n```\n**Listing 1.14** The increment.m program using the increment\
    \ operator.\n\n## Getting Started: Essential Objective-C\n\n## 21\n### Changing\
    \ Type with Cast Operators\n\nSuppose you want to find the modulus of two floating-point\
    \ numbers in a program named cast.m. You might enter:\n\n```c\nfloat x = 5;\n\
    float y = 3;\nint result = 0;\nresult = x % y;\n```\nWhen you run this code, however,\
    \ the Objective-C compiler returns an error: cast.m:12: error: invalid operands\
    \ to %. The problem is that the operator needs integer operands. To solve this,\
    \ you can temporarily convert the floating-point variables to integer variables\
    \ with the (int) cast, like this:\n\n```c\nfloat x = 5;\nfloat y = 3;\nint result\
    \ = 0;\nresult = (int) x % (int) y;\n```\nNow everything works. You can use cast\
    \ to convert between types: (int), (float), and so on.\n\n## Chapter 1\n\n## 22\n\
    ### Changing Type with Cast Operators\n\nTo use a cast operator:\n\n1. Create\
    \ a new program named **cast.m**.\n2. In cast.m, enter the code shown in **Listing\
    \ 1.15**. This code declares three variables: x, y, and result.\n3. Add the code\
    \ to put the modulus operator to use (**Listing 1.16**).\n4. Save cast.m.\n5.\
    \ Run the cast.m program.\n\nYou should see the following: x: 5 y; 3. The result\
    \ of x mod y is 2.\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    float x\
    \ = 5;\n    float y = 3;\n    int result = 0;\n    \n    return 0;\n}\n```\n**Listing\
    \ 1.15** Starting cast.m.\n\n```c\n#include <stdio.h>\nint main(void)\n{\n   \
    \ float x = 5;\n    float y = 3;\n    int result = 0;\n    printf (\"x: %2.0f\
    \ y; %2.0f.\\n\", x, y);\n    result = (int) x % (int) y;\n    printf (\"The result\
    \ of x mod y is %d.\\n\", result);\n    return 0;\n}\n```\n**Listing 1.16** The\
    \ cast.m program using cast operator.\n\n## Getting Started: Essential Objective-C\n\
    \n## 23\n### Directing Program Flow\n\nThis chapter is all about taking control\
    \ of your code by making flow as you want. You’ll see how to make choices with\
    \ the if statement, loop over and with loops, and more. The primary flow statement\
    \ that allows you to make choices is the if statement. For example, say you have\
    \ a variable named temperature, which is set to 72:\n\n```c\n#include <stdio.h>\n\
    int main(void)\n{\n    int temperature = 72;\n    ...\n```\n\n## Chapter 1\n\n\
    ## 24\n### Directing Program Flow\n\nYou can use the == equality operator to test\
    \ whether the value of temperature is equal to 72 and, if so, execute specific\
    \ code:\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    int temperature =\
    \ 72;\n    if (temperature == 72)\n    {\n        printf(\"Perfect weather.\\\
    n\");\n    }\n    return 0;\n}\n```\n\nYou can also add an else statement that\
    \ executes code if the condition in the if statement turns out to be false:\n\n\
    ```c\n#include <stdio.h>\nint main(void)\n{\n    int temperature = 78;\n    if\
    \ (temperature == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n\
    \    else\n    {\n        printf(\"Weather could be better.\\n\");\n    }\n  \
    \  return 0;\n}\n```\n\n## 25\n### Directing Program Flow\n\nLoops provide another\
    \ tool for controlling the flow of your programs. Loops let you perform specific\
    \ actions over and over, such as summing a group of numbers or drawing lines.\
    \ For example, in a for loop, the most common type of loop, you initialize a variable\
    \ called loop_index (usually by setting it to zero), specify the condition that\
    \ causes the loop to end, and an operation to perform after the body of the loop\
    \ is executed. In the example here, the loop ends when the loop_index variable\
    \ contains a number greater than 5; after the body of the loop runs, the loop_index\
    \ value is incremented:\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    int\
    \ loop_index;\n    for (loop_index = 0; loop_index < 5; loop_index++)\n    {\n\
    \        printf(\"You’ll see this five times.\\n\");\n    }\n    return 0;\n}\n\
    ```\nThis example displays the text “You’ll see this five times.” More on the\
    \ for loop and the other loops in Objective-C is coming up in this chapter.\n"
