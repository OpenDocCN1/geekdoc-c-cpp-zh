  mdcn: "\n\n# 第 10 章\n\n## 使用自动释放池 (Autorelease Pool)\n\n如果你使用 `alloc` 或 `new` 来创建对象，你就负责自己管理该对象的内存（如果内存是一个问题的话）。但对于那些不是通过\
    \ `alloc` 或 `new` 创建的对象，你可以使用自动释放池让 Objective-C 为你管理它们。\n\n只需要创建一个池对象，对象就会被自动放入其中。在程序结束时，你只需要释放（release）该池即可释放所有对象。\n\
    \n### 如何使用自动释放池：\n\n1. 创建一个名为 **pool.m** 的文件。\n2. 在 `pool.m` 中，输入如**Listing 10.11**\
    \ 所示的代码。这段代码创建了池以及一个由池管理的对象：`string1`。\n3. 添加代码来打印对象的引用计数（retain count），并在程序结束时释放池（**Listing\
    \ 10.12**Listing 10.12**）。\n4. 保存 `pool.m`。\n5. 运行 `pool.m` 程序。你应该会看到以下内容：\n`Pool-managed\
    \ string’s retain count: 1`\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool\
    \ alloc];\n    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"\
    ];\n}\n```\n**Listing 10.11 pool.m.**\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool\
    \ alloc];\n    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"\
    ];\n    printf(\"%s’s retain count: %x\\n\", [string1 cString], [string1 retainCount]);\n\
    \    [pool release];\n    return 0;\n}\n```\n**Listing 10.12 The pool.m.**\n\n\
    # 在 Objective-C 中管理内存\n\n## 使用自管理的内存 (Self-Managed Memory)\n\n如果你使用 `alloc` 或\
    \ `new` 创建对象，你就负责管理它们的内存（如果内存是一个问题的话）。这意味着当你完成完一个对象并想要释放它的内存时，由你来操作，直到它的引用计数变为零，Objective-C\
    \ 才会将其销毁（dealloc）。\n\n在这个任务中，你将把一个自管理的对象添加到上一个任务的 `pool.m` 中，这样你就可以对比自管理内存和池管理内存的过程。\n\
    \n### 如何为对象使用自管理的内存：\n\n1. 打开 `pool.m`。\n2. 添加代码来创建一个自管理的字符串（**Listing 10.13****）。\n\
    \n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n\
    {\n    NSAutoreleasePool *pool = [NSAutoreleasePool alloc];\n    NSString *string1\
    \ = [NSString stringWith:@\"Pool-managed string\"];\n    NSString *string2 = [[NSString\
    \ alloc] initWithString:@\"Self-managed string\"];\n    printf(\"%s’s retain count:\
    \ %x\\n\", [string1 cString], [string1 retainCount]);\n    [pool release];\n \
    \   return 0;\n}\n```\n**Listing 10.13 Editing pool.m.**\n\n3. 添加代码来打印自管理字符串的引用计数并释放该对象（**Listing\
    \ 10.14**）。\n4. 保存 `pool.m`。\n5. 运行编辑后的 `pool.m` 程序。你应该会看到以下内容：\n`Pool-managed\
    \ string’s retain count: 1`\n`Self-managed string’s retain count: 1`\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n{\n  \
    \  NSAutoreleasePool *pool = [NSAutoreleasePool alloc];\n    NSString *string1\
    \ = [NSString stringWith:@\"Pool-managed string\"];\n    NSString *string2 = [[NSString\
    \ alloc] initWithString:@\"Self-managed string\"];\n    printf(\"%s’s retain count:\
    \ %x\\n\", [string1 cString], [string1 retainCount]);\n    printf(\"%s’s retain\
    \ count: %x\\n\", [string2 cString], [string2 retainCount]);\n    [string2 release];\n\
    \    [pool release];\n    return 0;\n}\n```\n**Listing 10.14 The edited pool.m\
    \ program.**\n\n## 创建类\n\n如果你创建的自定义类在内部存储了其他对象，那么当整个对象被销毁时，你就负责释放这些内部对象。在本章剩余的任务中，你将通过一个名为\
    \ `Friend` 的示例来了解其工作原理，它内部存储了两个 `NSString` 对象，分别对应朋友的名字和姓。当 `Friend` 对象被销毁时，你需要手动释放这两个内部字符串。\n\
    \n### 如何创建 Friend 类：\n\n1. 创建一个名为 **friends.m** 的文件。\n2. 在 `friends.m` 中，输入如**Listing\
