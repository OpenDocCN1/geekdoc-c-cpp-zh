  - "[PAGE 10]\n\nChapter 1\n\n**2**\n\n**Getting Started: Essential Objective-C**\n\
    \nFor example, say you have a bowl of pudding \n\nthat you want to keep cold.\
    \ You could set \n\nup a system of coolant pipes, switches, and \n\ndials that\
    \ cool your pudding but which take \n\nyour constant attention: you have to watch\
    \ \n\nthe temperature, and when the pudding gets \n\ntoo warm, you have to turn\
    \ on the coolant \n\ncompressor and pump and so on; when the \n\npudding gets\
    \ cold enough, you have switch \n\nthose things off.\n\nThat was the old way of\
    \ programming, with \n\nthe guts of every item in your program laid \n\nbare to\
    \ the whole rest of the program.\n\nObject-oriented programming, by contrast,\
    \ \n\nlets you wrap all that functionality into a sin-\n\ngle object: a refrigerator.\
    \ The refrigerator’s job \n\nis to keep things like pudding cold without \n\n\
    a lot of fuss on your part. It is responsible for \n\nmaintaining its own internal\
    \ state—that is, \n\nremaining cold inside. It has thermostats and \n\nrelays\
    \ and the like to automatically handle \n\nthe jobs you previously did manually.\
    \ So if \n\nyou want your pudding kept cold, simply put \n\nit in the refrigerator.\
    \ All the details are hidden \n\nfrom view, and your kitchen becomes a much \n\
    \neasier place to handle conceptually.\n\nSo it is with object-oriented programming.\
    \ \n\nNow you can wrap code and data together into \n\nobjects that are self-contained,\
    \ and because all \n\nthe details are hidden, your interaction with \n\nthose\
    \ objects becomes a lot simpler.\n\nThat’s the secret behind object-oriented \n\
    \nprogramming: divide and conquer.\n\nIn this book, you’ll see what makes the\
    \ \n\nobjects in Objective-C tick. They’re different \n\nthan the objects in other\
    \ languages—they \n\ncommunicate with messages; you don’t call \n\nthe code in\
    \ them directly—but they’re just as \n\npowerful, and often more so. \n\nWe’ll\
    \ start in this chapter with the basics: \n\nhandling basic data items, printing\
    \ results \n\nfrom Objective-C programs, running your \n\nprograms, and more.\
    \ \n\n From the Library of Wow! eBook"
- md: "\n## Getting Started: Essential Objective-C\n\n**3**\n\n### Creating Your First\
    \ Program\n\nWe’re going to jump right into Objective-C by creating and running\
    \ a program, which we’ll name first.m.\n\nWe’ll start by creating a function—that\
    \ is, a bit of code that you can call by name—named `main()`:\n\n```objective-c\n\
    int main(void)\n{\n    .\n}\n```\n\nFunctions can be passed data, as you’ll see\
    \ later, but this function isn’t passed any data, which is why we use the keyword\
    \ void in the parentheses. Functions can also return values, and the main() function\
    \ returns an integer value to Objective-C indicating whether the program succeeded.\
    \ The int in front of main() tells Objective-C to expect an integer return value.\
    \ The code for the main() function goes inside curly braces: { and }.\n\nNext,\
    \ we’ll use the built-in Objective-C function named printf() to display some text.\
    \ We pass the text we want printf() to display inside parentheses:\n\n```objective-c\n\
    int main(void)\n{\n    printf (\"Welcome to Objective-C!\");\n}\n```\n\n- **tip**:\
    \ The extension for Objective-C code files is .m.\n\nChapter 1\n**4**\n\n### Creating\
    \ Your First Program\n\nTo use the printf() function, we have to tell Objective-C\
    \ about that function with a function declaration, as you’ll see when we discuss\
    \ how to create functions. The declarations for the standard I/O functions like\
    \ printf() are contained in an Objective-C file named stdio.h, where .h stands\
    \ for “header file”; we include stdio.h in our program as shown here so Objective-C\
    \ knows about the printf() function:\n\n```objective-c\n#include <stdio.h>\n\n\
    int main(void)\n{\n    printf (\"Welcome to Objective-C!\");\n}\n```\n\nWhen the\
    \ program ends, Objective-C will expect some indication of whether the function\
    \ succeeded. We’ll return a value of 0 to Objective-C, which means there were\
    \ no errors. Listing 1.1 shows the entire program, which you will create step\
    \ by step in the following tasks.\n\n- **tip**: Note that #import and #include\
    \ are the same for our purposes. You can use them interchangeably and in any order.\n\
    \n```objective-c\n#include <stdio.h>\n\nint main(void)\n{\n    printf (\"Welcome\
    \ to Objective-C!\");\n    return 0;\n}\n```\n**Listing 1.1** Your first Objective-C\
    \ program.\n\nGetting Started: Essential Objective-C\n**5**\n\n### Creating Your\
    \ First Program\n\n**to create your first Objective-C program on the Mac:**\n\n\
    1. From http://developer.apple.com/iphone, download and install the Xcode Integrated\
    \ Development Environment.\n2. Run Xcode.\n3. Choose File > New Project.\n4. In\
    \ the New Project window, choose Application.\n5. Click the Command-Line Tool\
    \ icon to select it.\n6. From the Type drop-down menu, choose Foundation.\n7.\
    \ Click the Choose button.\n8. Enter **First** as the name of your application.\n\
    9. Select a save location and click the Save button.\n10. In the text editor window,\
    \ enter the code in Listing 1.1.\n11. Choose File > Save.\n\n**to create your\
    \ first Objective-C program in Linux, UNIX, or Windows:**\n\n1. Open a text editor.\n\
    2. Enter the code in Listing 1.1.\n3. Save the file as **first.m** in a directory\
    \ of your choice.\n\nChapter 1\n**6**\n\n### Compiling and Running Your First\
    \ Program\n\nTo run an Objective-C program, you first have to compile it, which\
    \ makes Objective-C convert your code into the machine language that your computer\
    \ can understand.\n\nWhen you run the first program, you should see this result:\n\
    \n`Welcome to Objective-C!`\n\nThe Objective-C language comes built into Mac OS\
    \ 10.6, but not Linux, UNIX, or Windows, so you’ll have to download it. If you’re\
    \ using Linux or UNIX, go to http://www.GNUstep.org/resources/sources.html and\
    \ download and install GNUstep, which gives you the Objective-C compiler.\n\n\
    If you’re using Windows, go to http://www.GNUstep.org/experience/Windows.html\
    \ and download the Windows installer for GNUstep and run it to install GNUstep.\n\
    \n**to compile and run your first Objective-C program on the Mac:**\n\n1. In Xcode,\
    \ on the Project window toolbar, click the Build and Run button.\n\nYou should\
    \ see this message:\n\n`Welcome to Objective-C!`\n\nCongratulations, you’ve run\
    \ your first Objective-C program!\n\nGetting Started: Essential Objective-C\n\
    **7**\n\n### Compiling and Running Your First Program\n\n**to compile and run\
    \ your first Objective-C program in Linux or UNIX:**\n\n1. Open a command prompt\
    \ window.\n2. Change to the directory containing first.m.\n3. Enter the following\
    \ command, prefacing gcc with the path to the GNUstep gcc compiler if your computer\
    \ can’t find the compiler:\n   `gcc -o first first.m`\n4. Run the program, like\
    \ this:\n   `./first`\n\nYou should see this message:\n\n`Welcome to Objective-C!`\n\
    \nCongratulations, you’ve run your first Objective-C program!\n\n- **tip**: This\
    \ book uses $ as a generic command prompt.\n\n**to compile and run your first\
    \ Objective-C program in Windows:**\n\n1. Choose Start > Programs > GNUstep.\n\
    2. In the shell, change to the directory containing first.m. For example, if first.m\
    \ is in C:\\ you would enter the following (where $ is a generic prompt):\n  \
    \ `cd C:\\objectivec`\n3. In the shell, enter the following command to compile\
    \ first.m into first.exe:\n   `gcc -o first first.m`\n4. Execute the first.exe,\
    \ like this:\n   `first`\nYou should see this:\n\n`Welcome to Objective-C!`\n\n\
    Chapter 1\n**8**\n\n### Using Variables\n\nIn Objective-C, you can store data\
    \ in variables, which are placeholders for data. For example, say you have $1\
    \ million in your account and want to keep track of it; you can store that in\
    \ a variable named amount, like this:\n\n```objective-c\nint amount = 1000000;\n\
    ```\n\nThis code creates a variable that stores integers (that’s the int part)\
    \ and initializes the value in amount to 1000000. To display the value in amount,\
    \ you can use printf():\n\n```objective-c\nprintf(\"The amount in your account\
    \ is %i\\n\", amount);\n```\n\nThe %i is a placeholder that will be replaced by\
    \ the integer variable that follows. The \\n code moves the text to a new line.\
    \ When this program runs, you’ll see the value in amount:\n\n`The amount in your\
    \ account is 1000000`\n\n**to use variables:**\n\n1. Enter the code from Listing\
    \ 2 in a new program, account.m.\n2. Create the variable amount and initialize\
    \ it to 1000000 (Listing 3).\n3. Display the value in amount (Listing 4).\n4.\
    \ Build and run the program.\n\n```objective-c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int amount = 1000000;\n    printf(\"The amount in your account is %i\\\
    n\", amount);\n}\n```\n**Listing 2** account.m.\n\n```objective-c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int amount = 1000000;\n}\n```\n**Listing 3** account.m.\n\
    \n```objective-c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"The amount\
    \ in your account is %i\\n\", amount);\n}\n```\n**Listing 4** account.m.\n\nGetting\
    \ Started: Essential Objective-C\n**9**\n\n### Displaying Values\n\nThe capability\
    \ to display values stored in variables with the printf() function is very useful.\
    \ In the previous task, you saw that the code %i is a placeholder for integer\
    \ variables. \n\n| Code | Description |\n| :--- | :--- |\n| `%i` | Integer |\n\
    | `%c` | Character |\n| `%d` or `%i` | Signed decimal integer |\n| `%e` | Scientific\
    \ notation (mantissa/exponent) using e character |\n| `%E` | Scientific notation\
    \ (mantissa/exponent) using E character |\n| `%f` | Floating-point decimal |\n\
    | `%g` | The shorter of %e or %f |\n| `%G` | The shorter of %E or %f |\n| `%s`\
    \ | String of characters |\n| `%u` | Unsigned decimal integer |\n\nFor example,\
    \ if you change the amount variable in the previous task from the (int) type to\
    \ a floating-point value (float), you can display its value using printf() and\
    \ %f (for float):\n\n```objective-c\n#include <stdio.h>\n\nint main(void)\n{\n\
    \    float amount = 1000000.0;\n    printf(\"The amount in your account is %f\\\
    n\", amount);\n}\n```\n\nIn this task, you’ll create a program named temperature.m\
    \ that will display a time (as an integer) and a temperature (as a floating-point\
    \ number). To do that, you’ll use commas in printf() to separate the variables\
    \ whose values you want to display:\n\n```objective-c\n#include <stdio.h>\n\n\
    int main(void)\n{\n    int time = 4;\n    float temperature = 73.6;\n    printf(\"\
    At %i o'clock, the temperature is %f degrees.\\n\", time, temperature);\n    return\
    \ 0;\n}\n```\n**Table 1.1 Common printf( ) Codes**\n"
