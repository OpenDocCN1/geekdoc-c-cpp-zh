    -(void)setLast:(NSString*)last\n{\n    [last retain];\n    [lastName release];\n\
    \    lastName = last;\n}\n\n-(void)print\n{\n    printf(\"friend’s name is %s%s\"\
    , [firstName cString], [lastName cString]);\n}\n\n@end\n```\n**Listing 10.16 Editing\
    \ friends.m.**\n\n## 创建 main 方法\n\n在这个任务中，你将为示例创建 main 方法，以便在容器对象被销毁时释放内部对象。\n\
    \n### 如何创建 main 方法：\n\n1. 打开 `friends.m`。\n2. 添加代码创建一个名为 `dan` 的 `Friend` 类对象（**Listing\
