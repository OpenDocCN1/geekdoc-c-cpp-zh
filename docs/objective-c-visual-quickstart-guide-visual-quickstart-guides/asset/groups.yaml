- md: "\n## Chapter 7\n\n## Overriding Base-Class Methods\n\nSay that you have a method\
    \ in a base class that you need to change. For example, say you have a method\
    \ named print in the base class Class1 that prints “This is class 1.” Clearly,\
    \ in the derived class, Class2, the message should say, “This is class 2.”\n\n\
    You can *override* the base class print method just by redefining it in the derived\
    \ class. When you override a method in a derived class, the overriding method\
    \ must have the same prototype (same return type and arguments) as the method\
    \ you’re overriding.\n\nto override base-class methods:\n1. Create a new program\
    \ named override.m.\n2. In override.m, enter the code shown in Listing 7.7. This\
    \ code creates Class1 and derives Class2 from it. Each class has a method named\
    \ print with the same prototype so the Class2 version will override the Class1\
    \ version.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface\
    \ Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n-(void)print\n\
    {\n    printf(\"This is class 1.\");\n}\n@end\n\n@interface Class2:Class1\n-(void)print;\n\
    @end\n\n@implementation Class2\n-(void)print\n{\n    printf(\"This is class 2.\"\
    );\n}\n@end\n```\nListing 7.7 Starting override.m.\n\n3. Add the code to create\
    \ an object of Class2 and call the overridden print method (Listing 7.8).\n4.\
    \ Save override.m.\n5. Run the override.m program. You should see: This is class\
    \ 2.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"\
    This is class 1.\");\n}\n@end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\
    \n@implementation Class2\n-(void)print\n{\n    printf(\"This is class 2.\");\n\
    }\n@end\n\nint main(void)\n{\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n\
    \    return 0;\n}\n```\nListing 7.8 The override.m program.\n\n## Overloading\
    \ Base-Class Methods\n\nYou can also *overload* methods. When you overload a method,\
    \ you give it multiple definitions, and Objective-C chooses the correct version\
    \ of the method based on the parameter list—the type and number of parameters\
    \ must be different for each version of an overloaded method.\n\nto overload a\
    \ base-class method:\n1. Create a new program named overload.m.\n2. In overload.m,\
    \ enter the code shown in Listing 7.9. This code creates Class1 and derives Class2\
    \ from it; Class1 has a print method with no arguments, and Class2 has a print\
    \ method that takes one argument.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    \n@interface Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\
    -(void)print\n{\n    printf(\"Hello there.\");\n}\n@end\n\n@interface Class2:Class1\n\
    -(void)print:(int)x;\n@end\n\n@implementation Class2\n-(void)print:(int)x\n{\n\
    \    printf(\"Your number is %i.\\n\", x);\n}\n@end\n\nint main(void)\n{\n   \
    \ Class2 *c2 = [Class2 new];\n    [c2 print];\n    [c2 print:5];\n    return 0;\n\
    }\n```\nListing 7.9 Starting overload.m.\n\n3. Add the code to create an object\
    \ of Class2 and call the two print methods: one with an argument and one without\
    \ (Listing 7.10).\n4. Save overload.m.\n5. Run the overload.m program. You should\
    \ see the following: Hello there. Your number is 5.\n\n```objc\n#import <stdio.h>\n\
    #include <Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n@end\n\n\
    @implementation Class1\n-(void)print\n{\n    printf(\"Hello there.\");\n}\n@end\n\
    \n@interface Class2:Class1\n-(void)print:(int)x;\n@end\n\n@implementation Class2\n\
    -(void)print:(int)x\n{\n    printf(\"Your number is %i.\\n\", x);\n}\n@end\n\n\
    int main(void)\n{\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n    [c2 print:5];\n\
    \    return 0;\n}\n```\nListing 7.10 The overload.m program.\n\n## Multi-level\
    \ Inheritance\n\nInheritance in Objective-C isn’t limited to a single level. Classes\
    \ can inherit as many levels of base classes as you want. The example in this\
    \ shows two-level inheritance.\n\nto use multi-level inheritance:\n1. Create a\
    \ new program named multilevel.m.\n2. In multilevel.m, enter the code shown in\
    \ Listing 7.11. This code creates the three classes you’ll use.\n\n```objc\n#import\
    \ <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n\
    @end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"This is class 1.\"\
    );\n}\n@end\n\n@interface Class2:Class1\n-(void)print2;\n@end\n\n@implementation\
    \ Class2\n-(void)print2\n{\n    printf(\"This is class 2.\");\n}\n@end\n\n@interface\
    \ Class3:Class2\n-(void)print3;\n@end\n\n@implementation Class3\n-(void)print3\n\
    {\n    printf(\"This is class 3.\");\n}\n@end\n```\nListing 7.11 Starting multilevel.m.\n\
    \n3. Add the code to create two objects of the different classes and store those\
    \ objects, one after the other, in the id variable (Listing 7.12).\n4. Save multilevel.m.\n\
    5. Run the multilevel.m program. You should see the following: This is class 1.\
    \ This is class 2. This is class 3.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    \n@interface Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\
    -(void)print\n{\n    printf(\"This is class 1.\");\n}\n@end\n\n@interface Class2:Class1\n\
    -(void)print2;\n@end\n\n@implementation Class2\n-(void)print2\n{\n    printf(\"\
    This is class 2.\");\n}\n@end\n\n@interface Class3:Class2\n-(void)print3;\n@end\n\
    \n@implementation Class3\n-(void)print3\n{\n    printf(\"This is class 3.\");\n\
    }\n@end\n\nint main(void)\n{\n    Class3 *c3 = [Class3 new];\n    [c3 print];\n\
    \    [c3 print2];\n    [c3 print3];\n    return 0;\n}\n```\nListing 7.12 The multilevel.m\
    \ program.\n\n## Limiting Access\n\nBy default, data members and methods of a\
    \ base class are available to the derived class. That may not always be a good\
    \ idea, however: for example, if the base class has an internal variable that\
    \ the derived class doesn’t need access to. In such cases, you can use the private\
    \ specifier to mark such a data member as private. You saw private in the previous\
    \ chapter, but here you’ll use it with inheritance.\n\nto stop inheritance:\n\
    1. Create a new program named private.m.\n2. In private.m, enter the code shown\
    \ in Listing 7.13. This creates the classes you’ll use and marks a data member\
    \ of the base class as private.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    \n@interface Class1:NSObject\n{\n    @private\n    int privateVariable;\n}\n@end\n\
    \n@implementation Class1\n@end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\
    \n@implementation Class2\n@end\n```\nListing 7.13 Starting private.m.\n\n3. Add\
    \ the code to try to access the private variable of the base class using code\
    \ in the derived class (Listing 7.14).\n4. Save private.m.\n5. Try to run the\
    \ private.m program. Depending on your platform, you’ll either get a hard error\
    \ (the program will not compile) or a warning with a message that, in the future,\
    \ the warning will be a hard error.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    \n@interface Class1:NSObject\n{\n    @private\n    int privateVariable;\n}\n@end\n\
    \n@implementation Class1\n@end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\
    \n@implementation Class2\n-(void)print\n{\n    privateVariable = 5;\n    printf(\"\
    The private variable is %i.\", privateVariable);\n}\n@end\n\nint main(void)\n\
    {\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n    return 0;\n}\n```\nListing\
    \ 7.14 The private.m program.\n"
  mdcn: "\n\n## 第 7 章\n\n## 方法重写（Override）\n\n假设你在基类中有一个需要更改的方法。例如，假设在基类 `Class1`\
    \ 中有一个名为 `print` 的方法，它输出“This is class 1.”。显然，在派生类 `Class2` 中，信息应该是“This is class\
    \ 2.”。\n\n你只需在派生类中重新定义该方法，就可以*覆盖*基类的 `print` 方法。当你在派生类中重写方法时，覆盖的方法必须与你正在覆盖的方法具有相同的原型（相同的返回值和参数）。\n\
    \n重写基类方法：\n1. 创建一个名为 `override.m` 的新程序。\n2. 在 `override.m` 中，输入列表 7.7 所示的代码。此代码创建了\
    \ `Class1` 并从中派生出 `Class2`。每个类都有一个名为 `print` 且具有相同的方法，因此 `Class2` 的版本将覆盖 `Class1`\
    \ 的版本。\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"\
    This is class 1.\");\n}\n@end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\
    \n@implementation Class2\n-(void)print\n{\n    printf(\"This is class 2.\");\n\
    }\n@end\n```\n列表 7.7 开始 override.m。\n\n3. 添加代码来创建 `Class2` 的对象并调用被重写的 `print`\
    \ 方法（列表 7.8）。\n4. 保存 `override.m`。\n5. 运行 `override.m` 程序。你应该会看到：This is class\
    \ 2.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"\
    This is class 1.\");\n}\n@end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\
    \n@implementation Class2\n-(void)print\n{\n    printf(\"This is class 2.\");\n\
    }\n@end\n\nint main(void)\n{\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n\
    \    return 0;\n}\n```\n列表 7.8 The override.m 程序。\n\n## 方法重载（Overloading）\n\n\
    你也可以对方法进行*重载*。当你重载一个方法时，你为它提供了多个定义，Objective-C 会根据参数列表选择正确的方法版本——对于重载方法的每个版本，参数的类型和数量必须是不同的。\n\
    \n重载基类方法：\n1. 创建一个名为 `overload.m` 的新程序。\n2. 在 `overload.m` 中，输入列表 7.9 所示的代码。此代码创建了\
    \ `Class1` 并从中派生出 `Class2`；`Class1` 有一个无参数的 `print` 方法，而 `Class2` 有一个接受一个参数的 `print`\
    \ 方法。\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"\
    Hello there.\");\n}\n@end\n\n@interface Class2:Class1\n-(void)print:(int)x;\n\
    @end\n\n@implementation Class2\n-(void)print:(int)x\n{\n    printf(\"Your number\
    \ is %i.\\n\", x);\n}\n@end\n\nint main(void)\n{\n    Class2 *c2 = [Class2 new];\n\
    \    [c2 print];\n    [c2 print:5];\n    return 0;\n}\n```\n列表 7.9 开始 overload.m。\n\
    \n3. 添加代码来创建 `Class2` 的对象并调用两个 `print` 方法：一个带参数，一个不带参数（列表 7.10）。\n4. 保存 `overload.m`。\n\
    5. 运行 `overload.m` 程序。你应该看到看到：Hello there. Your number is 5.\n\n```objc\n#import\
    \ <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n\
    @end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"Hello there.\");\n\
    }\n@end\n\n@interface Class2:Class1\n-(void)print:(int)x;\n@end\n\n@implementation\
    \ Class2\n-(void)print:(int)x\n{\n    printf(\"Your number is %i.\\n\", x);\n\
    }\n@end\n\nint main(void)\n{\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n\
    \    [c2 print:5];\n    return 0;\n}\n```\n列表 7.10 The overload.m 程序。\n\n## 多级继承\n\
    \nObjective-C 中的继承并不局限于单层。类可以继承任意数量级的基类。本例示例展示了两级继承。\n\n使用多级继承：\n1. 创建一个名为 `multilevel.m`\
    \ 的新程序。\n2. 在 `multilevel.m` 中，输入列表 7.11 所示的代码。此代码创建了你将使用的三个类。\n\n```objc\n#import\
    \ <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n\
    @end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"This is class 1.\"\
    );\n}\n@end\n\n@interface Class2:Class1\n-(void)print2;\n@end\n\n@implementation\
    \ Class2\n-(void)print2\n{\n    printf(\"This is class 2.\");\n}\n@end\n\n@interface\
    \ Class3:Class2\n-(void)print3;\n@end\n\n@implementation Class3\n-(void)print3\n\
    {\n    printf(\"This is class 3.\");\n}\n@end\n```\n列表 7.11 开始 multilevel.m。\n\
    \n3. 添加代码来创建不同类的对象并依次调用它们（列表 7.12）。\n4. 保存 `multilevel.m`。\n5. 运行 `multilevel.m`\
    \ 程序。你应该看到：This is class 1. This is class 2. This is class 3.\n\n```objc\n#import\
    \ <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n\
    @end\n\n@implementation Class1\n-(void)print\n{\n    printf(\"This is class 1.\"\
    );\n}\n@end\n\n@interface Class2:Class1\n-(void)print2;\n@end\n\n@implementation\
    \ Class2\n-(void)print2\n{\n    printf(\"This is class 2.\");\n}\n@end\n\n@interface\
    \ Class3:Class2\n-(void)print3;\n@end\n\n@implementation Class3\n-(void)print3\n\
    {\n    printf(\"This is class 3.\");\n}\n@end\n\nint main(void)\n{\n    Class3\
    \ *c3 = [Class3 new];\n    [c3 print];\n    [c3 print2];\n    [c3 print3];\n \
    \   return 0;\n}\n```\n列表 7.12 The multilevel.m 程序。\n\n## 限制访问\n\n默认情况下，基类的数据成员和方法对派生类是可见的但这并不总是个好主意：例如，如果基类有一个派生类不需要访问内部变量。在这种情况下，可以使用\
    \ `private` 修饰符将该数据成员标记为私有。你在上一章中见过 `private`，但这里我们将在继承中使用它。\n\n为了停止继承：\n1. 创建一个名为\
    \ `private.m` 的新程序。\n2. 在 `private.m` 中，输入列表 7.13 所示的代码。此代码创建了你将使用的类并将基类的数据成员标记为私有。\n\
    \n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    {\n    @private\n    int privateVariable;\n}\n@end\n\n@implementation Class1\n\
    @end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\n@implementation Class2\n\
    @end\n```\n列表 7.13 Starting private.m。\n\n3. 添加代码在派生类尝试访问基类的私有变量（列表 7.14）。\n4.\
    \ 保存 `private.m`。\n5. 尝试运行 `private.m` 程序。根据你的平台，你可能会得到一个硬错误（程序无法编译）或一个警告，提示未来该警告将变为硬错误。\n\
    \n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\n@interface Class1:NSObject\n\
    {\n    @private\n    int privateVariable;\n}\n@end\n\n@implementation Class1\n\
    @end\n\n@interface Class2:Class1\n-(void)print;\n@end\n\n@implementation Class2\n\
    -(void)print\n{\n    privateVariable = 5;\n    printf(\"The private variable is\
    \ %i.\", privateVariable);\n}\n@end\n\nint main(void)\n{\n    Class2 *c2 = [Class2\
    \ new];\n    [c2 print];\n    return 0;\n}\n```\n列表 7.14 The private.m 程序。\n\n"
