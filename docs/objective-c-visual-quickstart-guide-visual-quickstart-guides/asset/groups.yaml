- md: "\n## Chapter 9\n\n### Enumerating a Dictionary\n\nYou can use an enumerator\
    \ object to loop over a dictionary just as you can use an enumerator to loop over\
    \ an array. In this task, you’ll use an enumerator to print the keys and values\
    \ of a dictionary.\n\n**to enumerate a dictionary:**\n\n1. Create a new program\
    \ named **enumeratordictionary.m**.\n2. In **enumeratordictionary.m**, enter the\
    \ code shown in **Listing 9.16**. This code creates the dictionary you’ll use.\n\
    \n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint\
    \ main(void)\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NSDictionary *dictionary = [[NSDictionary alloc]\n    initWithWithObjects:\n\
    \        @\"banana\", @\"fruit\",\n        @\"onion\", @\"vegetable\",\n     \
    \   @\"turkey\", @\"meat\",\n        nil];\n```\n**Listing 9.16** Starting enumeratordictionary.m.\n\
    \n3. Add the code to create the enumerator and loop over the dictionary (**Listing\
    \ 9.17**).\n4. Save **enumeratordictionary.m**.\n5. Run the **enumeratordictionary.m**\
    \ program. You should see the following:\nvegetable => onion\nmeat => turkey\n\
    fruit => banana\n\n```objective-c\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSDictionary *dictionary = [[NSDictionary alloc]\n    initWithWithObjects:\n\
    \        @\"banana\", @\"fruit\",\n        @\"onion\", @\"vegetable\",\n     \
    \   @\"turkey\", @\"meat\",\n        nil];\n\n    NSEnumerator *enumerator = [dictionary\
    \ keyEnumerator];\n    id key;\n    while ((key = [enumerator nextObject]))\n\
    \    {\n        printf(\"%s => %s\\n\",\n               [[key description] cString],\n\
    \               [[[dictionary objectForKey: key] description] cString]);\n   \
    \ }\n    [dictionary release];\n    [pool release];\n    return 0;\n}\n```\n**Listing\
    \ 9.17** The enumeratordictionary.m program.\n\n### Creating a Mutable Dictionary\n\
    \nYou can extend a mutable dictionary by adding items or reduce it by removing\
    \ items. You’ll see how to create a mutable dictionary in this task, and you’ll\
    \ see how to extend it in the next task.\n\n**to create a mutable dictionary:**\n\
    \n1. Create a new program named **mutabledictionary.m**.\n2. In **mutabledictionary.m**,\
    \ enter the code shown in **Listing 9.18**. This code creates an object of the\
    \ `NSMutableDictionary` class.\n3. Add the code to display a message indicating\
    \ the creation went smoothly and to deallocate the memory used by the mutable\
    \ dictionary before ending the program (**Listing 9.19**).\n4. Save **mutabledictionary.m**.\n\
    5. Run the **mutabledictionary.m** program. You should see: Created dictionary.\n\
    \n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint\
    \ main(void)\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NSMutableDictionary *dictionary = [[NSMutableDictionary alloc] init];\n \
    \   printf(\"Created dictionary.\\n\");\n    [dictionary release];\n    [pool\
    \ release];\n    return 0;\n}\n```\n**Listing 9.18** Starting mutabledictionary.m.\n\
    \n### Adding Objects to a Mutable Dictionary\n\nIn the previous task, you created\
    \ a mutable dictionary but didn’t add any data to it. In this task, you’ll add\
    \ keys and values to the mutable dictionary.\n\n**to add objects to a mutable\
    \ dictionary:**\n\n1. Create a new program named **addkeys.m**.\n2. In **addkeys.m**,\
    \ enter the code shown in **Listing 9.20**. This code creates the mutable dictionary\
    \ and uses the `addObject` message to add key and value pairs to the dictionary.\n\
    3. Add the code to print the contents of the mutable dictionary (**Listing 9.21**).\n\
    4. Save **addkeys.m**.\n5. Run the **addkeys.m** program. You should see the following:\n\
    vegetable => onion\nmeat => turkey\nfruit => banana\n\n```objective-c\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableDictionary *dictionary\
    \ = [[NSMutableDictionary alloc] init];\n    [dictionary setObject:@\"banana\"\
    \ forKey:@\"fruit\"];\n    [dictionary setObject:@\"onion\" forKey:@\"vegetable\"\
    ];\n    [dictionary setObject:@\"turkey\" forKey:@\"meat\"];\n\n    NSEnumerator\
    \ *enumerator = [dictionary keyEnumerator];\n    id key;\n    while ((key = [enumerator\
    \ nextObject]))\n    {\n        printf(\"%s => %s\\n\",\n               [[key\
    \ description] cString],\n               [[[dictionary objectForKey: key] description]\
    \ cString]);\n    }\n    [dictionary release];\n    [pool release];\n    return\
    \ 0;\n}\n```\n**Listing 9.21** The addkeys.m program.\n\n## Chapter 10\n\n###\
    \ Managing Memory in Objective-C\n\nIn this chapter, you’ll learn about memory\
    \ management in Objective-C. Objective-C keeps track of all the objects you create\
    \ with a retain count, and when that count goes down to zero, Objective-C automatically\
    \ deallocates the memory allocated to an object.\n\nFor example, say that you\
    \ create two objects:\n```objective-c\nClass1 *object1 = [[Class1 alloc] init];\n\
    Class1 *object2 = [[Class1 alloc] init];\n```\nNow the retain count of each object\
    \ is 1, as you can verify by asking each object what its retain count is and printing\
    \ that result:\n```objective-c\nprintf(\"object1 retain count: %i\\n\", [object1\
    \ retainCount]);\nprintf(\"object2 retain count: %i\\n\", [object2 retainCount]);\n\
    ```\nYou can also explicitly increment the retain count yourself, like this:\n\
    ```objective-c\n[object1 retain];\n[object1 retain];\n[object2 retain];\n```\n\
    When you pass an object the retain message, it increments its own retain count.\
    \ So in this case, the retain count for object1 would increase from 1 to 2 to\
    \ 3, and the retain count for object2 would increase from 1 to 2. To decrement\
    \ the retain count, you send an release message:\n```objective-c\n[object1 release];\n\
    [object2 release];\n```\nThese two lines reduce the retain count of object1 to\
    \ 2 and object2 to 1. When you send a release message to 0, Objective-C automatically\
    \ deallocates that object. You’ll implement the dealloc method yourself.\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n{\n  \
    \  NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableDictionary\
    \ *dictionary = [[NSMutableDictionary alloc] init];\n    printf(\"Created dictionary.\\\
    n\");\n    [dictionary release];\n    [pool release];\n    return 0;\n}\n```\n\
    **Listing 10.2** The createobject.m program.\n"
  mdcn: "\n\n## 第 9 章\n\n### 枚举字典\n\n你可以使用枚举器对象来遍历字典，就像使用枚举器遍历数组一样。。在本次任务中，你将使用枚举器来打印字典的键和值。\n\
