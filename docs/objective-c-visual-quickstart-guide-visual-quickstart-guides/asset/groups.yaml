    NSString *helloString = @\"Hello there.\";\n```\n\n引号文本前的 `@` 符号表示你想使用 Objective-C\
    \ 风格的字符串，而不是默认的 C 风格字符串（Objective-C 字符串内置的功能比 C 字符串得多）。\n\n要使用 Objective-C 字符串：\n\
    \n1. 创建一个名为 **string.m** 的新程序。\n2. 在 string.m 中，输入**Listing 3.15** 所示的代码来创建并显示字符串。要用\
