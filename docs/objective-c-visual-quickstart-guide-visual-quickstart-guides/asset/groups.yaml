- md: "\n## Chapter 1\n\n## Displaying Values in Variables\n\nGiven the finite precision\
    \ of computers, however, you’ll actually see this instead of 73.6 degrees:\n\n\
    At 4 o’clock, the temperature is 73.599998 degrees.\n\nYou need to round the floating-point\
    \ value up, which you can do by using the code %4.1f instead of just %f. The code\
    \ %4.1f tells the program that you want your number to be four total places long\
    \ with one place after the decimal point. That gives you At 4 o’clock, the temperature\
    \ is 73.6 degrees, which is what you want.\n\n**to show values:**\n1. Create a\
    \ new program named temperature.m.\n2. In temperature.m, enter the code shown\
    \ in Listing 1.5.\n3. Save temperature.m.\n4. Run the temperature.m program. You\
    \ should see the following: At 4 o’clock, the temperature is 73.6 degrees.\n\n\
    ```c\n#include <stdio.h>\nint main(void)\n{\n    int time = 4;\n    float temperature\
    \ = 73.6;\n    printf(\"At %i o’clock, the temperature is %4.1f degrees.\\n\"\
    , time, temperature);\n    return 0;\n}\n```\nListing 1.5 Displaying an int and\
    \ a float\n\n## Working with Data Types\n\nObjective-C comes with some built-in\
    \ data types that you can use to create variables. For example, you’ve already\
    \ seen the int type you can use to create integer variables. The int type is called\
    \ a primitive because it’s built in the language and it’s a simple type. Table\
    \ 1.2 shows the primitive types in Objective-C. In this task, we’ll create a program\
    \ named datatype.m that has four variables: a character, an integer, a long, and\
    \ a float.\n\nchar c = 'a';\nint i = 4;\nlong l = 12345321;\nfloat f = 3.141526;\n\
    \nThe code will display them all: The character is 'a'. The integer is 4. The\
    \ long is 12345321. The float is 3.141526.\n\n| Type | Size |\n| :--- | :--- |\n\
    | char | 1 byte (8 bits) |\n| double | 8 bytes |\n| float | 4 bytes (Floating-point\
    \ number for example, 3.141526) |\n| int | 4 bytes (Integer numbers; for example,\
    \ -1, 34) |\n| long | 4 bytes |\n| long long | 8 bytes |\n| short | 2 bytes |\n\
    \nTable 1.2 Objective-C Primitive types\n\n**to display values:**\n1. Create a\
    \ new program named datatype.m.\n2. In datatype.m, enter the code shown in Listing\
    \ 1.6.\n3. Save datatype.m.\n4. Run the datatype.m program. You should see the\
