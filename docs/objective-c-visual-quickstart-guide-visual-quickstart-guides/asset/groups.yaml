- md: "\n## Handling Data\n\n###47\n\n### Initializing Arrays\n\nYou can initialize\
    \ the value of the elements in an array when you declare that array by enclosing\
    \ the initialization values in curly braces:\n\n```c\n#include <stdio.h>\n\nint\
    \ main()\n{\n    int scores[5] = {92, 73, 57, 98, 89};\n    printf(\"The array\
    \ is %i elements long.\", sizeof(scores) / sizeof(int));\n    return 0;\n}\n```\n\
    \n**to initialize an array:**\n\n1. Create a new program named **initializearray.m**.\n\
    2. In initializearray.m, enter the code shown in **Listing 3.3**. This code creates\
    \ the array and initializes the values of its elements.\n3. Calculate the number\
    \ of elements in the array, using the sizeof operator to get the size of the whole\
    \ array and dividing by the size of a single element (**Listing 3.4**).\n4. Save\
    \ initializearray.m.\n5. Run the initializearray.m program. You should see the\
    \ following:\n   The array is 5 elements long.\n\n**Listing 3.3** Starting initializearray.m.\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n    int scores[5] = {92, 73, 57, 98,\
    \ 89};\n    printf(\"The array is %i elements long.\", sizeof(scores) / sizeof(int));\n\
    \    return 0;\n}\n```\n\n**Listing 3.4** The initializearray.m program.\n```c\n\
    #include <stdio.h>\n\nint main()\n{\n    int scores[5] = {92, 73, 57, 98, 89};\n\
    \    printf(\"The array is %i elements long.\", sizeof(scores) / sizeof(int));\n\
    \    return 0;\n}\n```\n\n## Chapter 3\n\n###48\n\n### Looping over Arrays\n\n\
    Arrays and loops are made for each other. Arrays hold sets of data, and loops\
    \ let you iterate over such data sets. Looping over long sets of data in arrays\
    \ is one of the things computers are really good at.\n\nFor example, if you have\
    \ an array of student scores and want to find their average, you can use a for\
    \ loop:\n\n```c\nint student_index, scores[5] = {92, 73, 57, 98, 89};\nfloat sum\
    \ = 0;\nfor (student_index = 0, sum = 0; student_index < 5; student_index++)\n\
    {\n    sum += scores[student_index];\n}\nprintf(\"Average score is %2.1f\", sum\
    \ / 5);\n```\n\n**to loop over an array:**\n\n1. Create a new program named **arrayloop.m**.\n\
    2. In arrayloop.m, enter the code shown in **Listing 3.5**. This code creates\
    \ the scores array and initializes it.\n3. Add the code to sum all the elements\
    \ in the array and find their average (**Listing 3.6**).\n4. Save arrayloop.m.\n\
    5. Run the arrayloop.m program. You should see the following:\n   Average score\
    \ is 81.8\n\n**Listing 3.5** Starting arrayloop.m.\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int student_index, scores[5] = {92, 73, 57, 98, 89};\n  \
    \  float sum = 0;\n    for (student_index = 0, sum = 0; student_index < 5; student_index++)\n\
    \    {\n        sum += scores[student_index];\n    }\n    printf(\"Average score\
    \ is %2.1f\", sum / 5);\n    return 0;\n}\n```\n\n**Listing 3.6** The arrayloop.m\
    \ program.\n```c\n#include <stdio.h>\n\nint main()\n{\n    int student_index,\
    \ scores[5] = {92, 73, 57, 98, 89};\n    float sum = 0;\n    for (student_index\
    \ = 0, sum = 0; student_index < 5; student_index++)\n    {\n        sum += scores[student_index];\n\
    \    }\n    printf(\"Average score is %2.1f\", sum / 5);\n    return 0;\n}\n```\n\
    \n###49\n\n### Creating Two-Dimensional Arrays\n\nSo far we’ve been working with\
    \ arrays in one dimension, but you can create multi-dimensional arrays as well.\
    \ While you access an element in a one-dimensional array as `array[number]`, you\
    \ access elements in a two-dimensional array as `array[row][column]`.\n\nFor example,\
    \ if you have an array of student scores for each of three tests and want to find\
    \ the average score for each of the tests, you can use a two-dimensional array.\
    \ You initialize the two-dimensional array with nested lists and loop over the\
    \ lists with nested for loops:\n\n```c\nint test_index, student_index, scores[3][5]\
    \ = {\n    {92, 73, 57, 98, 89},\n    {88, 76, 23, 95, 72},\n    {94, 82, 63,\
    \ 99, 94}\n};\nfloat sum;\nfor (test_index = 0; test_index < 3; test_index++)\n\
    {\n    for (student_index = 0, sum = 0; student_index < 5; student_index++)\n\
    \    {\n        sum += scores[test_index][student_index];\n    }\n    printf(\"\
    Average for test %i is %2.1f\\n\", test_index + 1, sum / 5);\n}\n```\n\n**to create\
    \ a two-dimensional array:**\n\n1. Create a new program named **array2.m**.\n\
    2. In array2.m, enter the code in **Listing 3.7**. This code creates an array\
    \ and loops over each row.\n3. Add the code to loop over each column and display\
    \ the average for each test (**Listing 3.8**).\n4. Save array2.m.\n5. Run the\
    \ array2.m program. You should see the following:\n   Average for test 1 is 81.8\n\
    \   Average for test 2 is 70.8\n   Average for test 3 is 86.4\n\n**Listing 3.7**\
    \ Starting array2.m.\n```c\n#include <stdio.h>\n\nint main()\n{\n    int test_index,\
    \ student_index, scores[3][5] = {\n        {92, 73, 57, 98, 89},\n        {88,\
    \ 76, 23, 95, 72},\n        {94, 82, 63, 99, 94}\n    };\n    float sum;\n   \
    \ for (test_index = 0; test_index < 3; test_index++)\n    {\n    }\n    return\
    \ 0;\n}\n```\n\n**Listing 3.8** The array2.m program.\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int test_index, student_index, scores[3][5] = {\n       \
    \ {92, 73, 57, 98, 89},\n        {88, 76, 23, 95, 72},\n        {94, 82, 63, 99,\
    \ 94}\n    };\n    float sum;\n    for (test_index = 0; test_index < 3; test_index++)\n\
    \    {\n        for (student_index = 0, sum = 0; student_index < 5; student_index++)\n\
    \        {\n            sum += scores[test_index][student_index];\n        }\n\
    \        printf(\"Average for test %i is %2.1f\\n\", test_index + 1, sum / 5);\n\
    \    }\n    return 0;\n}\n```\n\n###51\n\n### Using Pointers\n\nPointers hold\
    \ the address in memory of items. You declare a pointer by prefacing it with an\
    \ asterisk (*):\n\n```c\nint integer, *pointer;\n```\n\nThen you can use the &\
    \ operator to get the address of a variable in memory and assign it to the pointer:\n\
    \n```c\ninteger = 1;\npointer = &integer;\n```\n\nUsing the asterisk, you can\
    \ refer to the data pointed to by the pointer:\n\n```c\npointer = 2;\n```\n\n\
    **to use pointers:**\n\n1. Create a new program named **pointers.m**.\n2. In pointers.m,\
    \ enter the code shown in **Listing 3.9**. This code creates the pointer and assigns\
    \ it the address of the variable named integer.\n3. Assign a new value to the\
    \ memory location pointed to by the pointer and display the data stored in that\
    \ location (**Listing 3.10**).\n4. Save pointers.m.\n5. Run the pointers.m program.\
    \ You should see the following:\n   The value of the integer: 2\n\n**Listing 3.9**\
    \ Starting pointers.m.\n```c\n#include <stdio.h>\n\nint main()\n{\n    int integer,\
    \ *pointer;\n    integer = 1;\n    pointer = &integer;\n    *pointer = 2;\n  \
    \  printf(\"The value of the integer: %i\", *pointer);\n    return 0;\n}\n```\n\
    \n**Listing 3.10** The pointers.m program.\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    int integer, *pointer;\n    integer = 1;\n    pointer = &integer;\n   \
    \ *pointer = 2;\n    printf(\"The value of the integer: %i\", *pointer);\n   \
    \ return 0;\n}\n```\n\n###52\n\n### Using Pointer Math\n\nIf you point to items\
    \ arranged after another in memory, such as in an array, you can increment or\
    \ decrement pointers to point to the next or previous item. For instance, the\
    \ following example prints the first number in an array and then the second number\
    \ by incrementing a pointer:\n\n```c\nfloat values[4] = {0.0, 1.0, 2.0, 3.0};\n\
    float *pointer = &values[0];\nprintf(\"*pointer = %2.1f\\n\", *pointer);\nprintf(\"\
    *(pointer) = %2.1f\", *(pointer));\n```\n\n**to use pointer math:**\n\n1. Create\
    \ a new program named **pointermath.m**.\n2. In pointermath.m, enter the code\
    \ shown in **Listing 3.11**. This code simply points to the first item in the\
    \ array and prints it.\n3. Add the code to increment the pointer and display the\
    \ next element in the array (**Listing 3.12**).\n4. Save pointermath.m.\n5. Run\
    \ the pointermath.m program. You should see the following:\n   *pointer = 0.0\n\
    \   *(pointer) = 1.0\n\n**Listing 3.11** Starting pointermath.m.\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    float values[4] = {0.0, 1.0, 2.0, 3.0};\n  \
    \  float *pointer = &values[0];\n    printf(\"*pointer = %2.1f\\n\", *pointer);\n\
    }\n```\n\n**Listing 3.12** The pointermath.m program.\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    float values[4] = {0.0, 1.0, 2.0, 3.0};\n    float *pointer\
    \ = &values[0];\n    printf(\"*pointer = %2.1f\\n\", *pointer);\n    printf(\"\
    *(pointer) = %2.1f\", *(pointer));\n}\n```\n"
