- md: "\n## Categories, Posing, and Protocols\n\n### 149 About Posing\n\nPosing lets\
    \ one class stand in for another. Say you have a class, Class1, with a single\
    \ method, method1, in the class’s header file:\n\n```objectivec\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n\n-(return_type)*method1;\n\n@end\n```\n\nSuppose\
    \ also that the method is defined in the class’s implementation file:\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@implementation Class1\n\
    \n-(return_type)*method1\n{\n    .\n    .\n    .\n}\n\n@end\n```\n\nNow say that\
    \ the method is redefined in another class’s implementation file, and that Class2\
    \ is based on Class1:\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@implementation Class1 : Class2\n\n-(return_type)*method1\n{\n    .\n    .\n\
    \    .\n}\n\n@end\n```\n\nYou can have Class2 pose as Class1 in your main method\
    \ like this:\n\n```objectivec\n[Class2 poseAsClass:[Class1 class]];\n```\n\nNow\
    \ when you create an object of Class1, like this:\n\n```objectivec\nClass1 *c2\
    \ = [Class1 new];\n[c2 method1];\n.\n.\n.\n```\n\nyou’re really creating an object\
    \ of Class2. The method that will be run in this code is the method1 defined in\
    \ the Class2 implementation. \n\nThis technique is useful as a shortcut way of\
    \ handling polymorphism, but you have to remember that you’re having one class\
    \ pose as another when you’re writing the code that follows the poseAsClass line.\n\
    \n### 151 Posing: Creating the Base Class\n\nWhen a class poses as another class,\
    \ it can function as a stand-in for that class. You tell Objective-C that one\
    \ class is posing for another, and from then on in your code, Objective-C uses\
    \ the class that’s posing as the original class, even when you use the original\
    \ class in your code.\n\nTo create the base class for which another class can\
    \ pose:\n\n1. Create a file named **class1.m**.\n2. In class1.m, enter the code\
    \ in **Listing 8.11**. This code creates the Class1 class.\n3. In class1.m, add\
    \ the code to create the print method (**Listing 8.12**).\n4. Save class1.m.\n\
    5. Create a file named **class1.h**.\n6. In class1.h, enter the code in **Listing\
    \ 8.13**.\n7. Save class1.h.\n\n**Listing 8.11 Starting class1.m.**\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n\
    @implementation Class1\n\n-(void) print\n{\n    printf(\"This is Class 1.\\n\"\
    );\n}\n\n@end\n```\n\n**Listing 8.12 The class1.m program.**\n```objectivec\n\
    #include <Foundation/Foundation.h>\n@interface Class1 : NSObject\n-(void) print;\n\
    \n@end\n```\n\n**Listing 8.13 The class1.h file.**\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n@implementation Class1\n\
    \    .\n    .\n    .\n@end\n```\n\n### 152 Posing: Creating the Derived Class\n\
    \nOne class can pose as another only if it’s based on the class it’s posing as\
    \ so in this task, you’ll derive a class from the base class Class1. This new\
    \ class will be called Class2, and it will redefine the print method to display\
    \ a message that this is Class2:\n\n```objectivec\n@implementation Class2\n-(void)\
    \ print\n{\n    printf(\"This is Class 2.\\n\");\n}\n```\n\nThis way, when Class2\
    \ poses as Class1 and you call the print method, you’ll see the message “This\
    \ is Class 2.” not “This is Class 1.”\n\nTo create the derived class:\n\n1. Create\
    \ a file named **class2.m**.\n2. In class2.m, enter the code in **Listing 8.14**.\
    \ This code creates the Class2 class.\n3. In class2.m, add the code to create\
    \ the print method (**Listing 8.15**).\n4. Save class2.m.\n5. Create a header\
    \ named **class2.h**.\n6. In class2.h, enter the code in **Listing 8.16**.\n7.\
    \ Save class2.h.\n\n**Listing 8.14 Starting class2.m.**\n```objectivec\n#import\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n#import\
    \ \"Class2.h\"\n\n@implementation Class2\n-(void) print\n{\n    printf(\"This\
    \ is Class 2.\\n\");\n}\n\n@end\n```\n\n**Listing 8.15 The class1.m program.**\n\
    ```objectivec\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n@interface\
    \ Class2 : Class1\n-(void) print;\n\n@end\n```\n\n**Listing 8.16 The class2.h\
    \ file.**\n\n### 153 Posing: Putting It Together\n\nTo make posing happen, you\
    \ use the poseAsClass keyword. In the example here, to make Class2 pose as Class1,\
    \ you can use this line:\n\n```objectivec\n[Class2 poseAsClass:[Class1 class]];\n\
    ```\n\nFrom then on, when you create an object of Class1, you’ll really be creating\
    \ an object of Class2, as you’ll see in this task.\n\nTo make one class pose as\
    \ another:\n\n1. Create a new program named **main.m**.\n2. In main.m, enter the\
    \ code shown in **Listing 8.17**. This code creates an object of Class1 and calls\
    \ its print method.\n3. Add the code to make Class2 pose as Class1, create an\
    \ object of Class1, and call its print method (**Listing 8.18**). This time, it’s\
    \ actually the Class2 print method that will be called.\n\n**Listing 8.17 Starting\
    \ main.m.**\n```objectivec\n#import <stdio.h>\n#import \"Class1.h\"\n#import \"\
    Class2.h\"\n\nint main(void) {\n    Class1 *c = [Class1 new];\n    [c print];\n\
    \    .\n    .\n    .\n}\n```\n\n**Listing 8.18 The main.m program.**\n```objectivec\n\
    #import <stdio.h>\n#import \"Class1.h\"\n#import \"Class2.h\"\n\nint main(void)\
    \ {\n    Class1 *c = [Class1 new];\n    [c print];\n    [Class2 poseAsClass:[Class1\
    \ class]];\n    Class1 *c2 = [Class1 new];\n    [c2 print];\n    return 0;\n}\n\
    ```\n\n4. Save main.m.\n5. If you’re using Linux, UNIX, or Windows, create a makefile\
    \ named **GNUmakefile** as shown in **Listing 8.19**.\n6. Run the main.m program.\
    \ You should see:\nThis is Class 1.\nThis is Class 2.\n\n**Listing 8.19 GNUmakefile**\n\
    ```make\nOBJS=main.o Class1.o Class2.o\nTARGET=posing\n$(TARGET): $(OBJS)\n\t\
    clang -o $(TARGET) $(OBJS)\n```\n\n### 155 About Protocols\n\nProtocols let you\
    \ specify an interface for a method that can be used in multiple classes. For\
    \ instance, if you have a method named print and want to create a protocol for\
    \ it, you can do that in a file, say, printing.h:\n\n```objectivec\n@protocol\
    \ Printing\n-(void) print;\n\n@end\n```\n\nThen you can include printing.h in\
    \ the interfaces of other classes. Doing so adds print to the interfaces of those\
    \ classes:\n\n```objectivec\n#include <Foundation/Foundation.h>\n#import \"printing.h\"\
    \n\n@interface Class1 : NSObject\n-(void) print;\n\n@end\n```\n\nAnd you can also\
    \ include printing.h in another class, Class2:\n\n```objectivec\n#import \"Class1.h\"\
    \n#import \"printing.h\"\n\n@interface Class2 : Class1\n-(void) print;\n\n@end\n\
    ```\n\nNow you can implement print one way for Class1:\n\n```objectivec\n#import\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n@implementation\
    \ Class1\n-(void) print\n{\n    printf(\"This is Class 1.\\n\");\n}\n\n@end\n\
    ```\n\nAnd you can implement print another way for Class2:\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\
    #import \"Class2.h\"\n\n@implementation Class2\n-(void) print\n{\n    printf(\"\
    This is Class 2.\\n\");\n}\n\n@end\n```\n\nThen you can create objects of Class1\
    \ and Class2 and call each of their print methods like this:\n\n```objectivec\n\
    #import <stdio.h>\n#import \"Class1.h\"\n#import \"Class2.h\"\n\nint main(void)\
    \ {\n    Class1 *c = [Class1 new];\n    [c print];\n    Class2 *c2 = [Class2 new];\n\
    \    [c2 print];\n    return 0;\n}\n```\n"
  mdcn: "\n\n## 类别、代充（Posing）与协议（Protocols）\n\n### 149 关于代充（Posing）\n\n代充允许一个类代表另一个类。假设你有一个类\
    \ `Class1`，它在类的头文件中包含一个方法 `method1`：\n\n```objectivec\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n\n-(return_type)*method1;\n\n@end\n```\n\n同样假设该方法定义在类的实现文件中：\n\
    \n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@implementation\
    \ Class1\n\n-(return_type)*method1\n{\n    .\n    .\n    .\n}\n\n@end\n```\n\n\
    现在，假设该方法在另一个类的实现文件中被重定义，且 `Class2` 是基于 `Class1` 的：\n\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n\n@implementation Class1 : Class2\n\n-(return_type)*method1\n\
    {\n    .\n    .\n    .\n}\n\n@end\n```\n\n你可以在主方法中这样让 `Class2` 代充 `Class1`：\n\n\
    ```objectivec\n[Class2 poseAsClass:[Class1 class]];\n```\n\n现在，当你像这样创建一个 `Class1`\
    \ 的对象时：\n\n```objectivec\nClass1 *c2 = [Class1 new];\n[c2 method1];\n.\n.\n.\n\
    ```\n\n你实际上是在创建一个 `Class2` 的对象。在这段代码中运行的方法将是 `Class2` 实现中定义的 `method1`。\n\n这种技术可以作为处理多态的快捷方法，但当你编写\
    \ `poseAsClass` 这一行之后的代码时，你必须记住你正在让一个类代充另一个类。\n\n### 151 代充：创建基类\n\n当一个类代充另一个类时，它可以作为该类的替身。你告诉\
    \ Objective-C 有一个类正在代充另一个类，从那以后在你的代码中，Objective-C 将使用正在代充的类作为原始类，即使你在代码中使用原始类也是如此。\n\
    \n要创建一个让其他类可以代充的基类：\n\n1. 创建一个名为 **class1.m** 的文件。\n2. 在 `class1.m` 中，输入**Listing\
    \ 8.11** 中的代码。这段代码创建了 `Class1` 类。\n3. 在 `class1.m` 中，添加创建打印方法的代码（Listing 8.12**）。\n\
    4. 保存 `class1.m`。\n5. 创建一个名为 **class1.h** 的文件。\n6. 在 `class1.h` 中，输入**Listing\
    \ 8.13** 中的代码。\n7. 保存 `class1.h`。\n\n**Listing 8.11 开始 class1.m。**\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n\
    @implementation Class1\n\n-(void) print\n{\n    printf(\"This is Class 1.\\n\"\
    );\n}\n\n@end\n```\n\n**Listing 8.12 class1.m 程序。**\n```objectivec\n#include <Foundation/Foundation.h>\n\
    @interface Class1 : NSObject\n-(void) print;\n\n@end\n```\n\n**Listing 8.13 class1.h\
    \ 文件。**\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    #import \"Class1.h\"\n\n@implementation Class1\n    .\n    .\n    .\n@end\n```\n\
    \n### 152 代充：创建派生类\n\n一个类只有在基于它所代充的类时才能进行代充，因此在这个任务中，你将从基类 `Class1` 派出一个类。这个新类将命名为\
    \ `Class2`，它将重定义 `print` 方法以显示一条这是 `Class2` 的消息：\n\n```objectivec\n@implementation\
    \ Class2\n-(void) print\n{\n    printf(\"This is Class2.\");\n}\n```\n\n通过这种方式，当\
    \ `Class2` 代充 `Class1` 并调用 `print` 方法时，你会看到“This is Class2.”而不是“This is Class1.”\n\
    \n创建派生类：\n\n1. 创建一个名为 **class2.m** 的文件。\n2. 在 `class2.m` 中，输入**Listing 8.14**\
    \ 中的代码。这段代码创建了 `Class2` 类。\n3. 在 `class2.m` 中，添加创建 `print` 方法的代码（**Listing 8.15**）。\n\
    4. 保存 `class2.m`。\n5. 创建一个名为 **class2.h** 的头文件。\n6. 在 `class2.h` 中，输入**Listing\
    \ 8.16** 中的代码。\n7. 保存 `class2.h`。\n\n**Listing 8.14 开始 class2.m。**\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\
    #import \"Class2.h\"\n\n@implementation Class2\n-(void) print\n{\n    printf(\"\
    This is Class2.\");\n}\n\n@end\n```\n\n**Listing 8.15 class1.m 程序。**\n```objectivec\n\
    #include <Foundation/Foundation.h>\n@import \"Class1.h\"\n@interface Class2 :\
    \ Class1\n-(void) print;\n\n@end\n```\n\n**Listing 8.16 class2.h 文件。**\n\n###\
    \ 153 代充：结合\n\n要实现代充，你使用 `poseAsClass` 关键字。在示例中，为了让 `Class2` 代充 `Class1`，你可以使用这一行：\n\
    \n```objectivec\n[Class2 poseAsClass:[Class1 class]];\n```\n\n从那时起，当你创建一个 `Class1`\
    \ 对象时，你实际上是在创建一个 `Class2` 对象，正如任务中所所示。\n\n让一个类代充另一个类：\n\n1. 创建一个名为 **main.m**\
    \ 的新程序。\n2. 在 `main.m` 中，输入**Listing 8.17**所示的代码。这段代码创建了 `Class1` 对象并调用其 `print`\
    \ 方法。\n3. 在 `main.m` 中添加让 `Class2` 代充 `Class1` 的代码，创建一个 `Class1` 对象并调用其 `print`\
    \ 方法（**Listing 8.18**）。这次调用的实际上 `Class2` 的 `print` 方法。\n\n**Listing 8.17 开始 main.m。**\n\
    ```objectivec\n#import <stdio.h>\n#import \"Class1.h\"\n#import \"Class2.h\"\n\
    \nint main(void) {\n    Class1 *c = [Class1 new];\n    [c print];\n    .\n   \
    \ .\n    .\n}\n```\n\n**Listing 8.18 main.m 程序。**\n```objectivec\n#import <stdio.h>\n\
    #import \"Class1.h\"\n#import \"Class2.h\"\n\nint main(void) {\n    Class1 *c\
    \ = [Class1 new];\n    [c print];\n    [Class2 poseAsClass:[Class1 class]];\n\
    \    Class1 *c2 = [Class1 new];\n    [c2 print];\n    return 0;\n}\n```\n\n4.\
    \ 保存 `main.m`。\n5. 如果你使用的是 Linux、UNIX 或 Windows，创建一个如**Listing 8.19**所示的 **GNUmakefile**。\n\
    6. 运行 `main.m` 程序。你应该看到：\nThis is Class 1.\nThis is Class 2.\n\n**Listing 8.19\
    \ GNUmakefile**\n```make\nOBJS=main.o Class1.o Class2.o\nTARGET=posing\n$(TARGET):\
    \ $(OBJS)\n\tclang -o $(TARGET) $(OBJS)\n```\n\n### 155 关于协议（Protocols）\n\n协议允许你为可以在多个类使用的方法指定接口。例如，如果你有一个名为\
    \ `print` 的方法并想为它创建一个协议，你可以在文件中文件中，例如 `printing.h`：\n\n```objectivec\n@protocol\
    \ Printing\n-(void) print;\n\n@end\n```\n\n然后你可以在其他类的接口中包含 `printing.h`。这样做会将\
    \ `print` 添加到这些类的接口中：\n\n```objectivec\n#include <Foundation/Foundation.h>\n#import\
    \ \"printing.h\"\n\n@interface Class1 : NSObject\n-(void) print;\n\n@end\n```\n\
    \n你还可以在另一个类 `Class2` 中包含 `printing.h`：\n\n```objectivec\n#import \"Class1.h\"\n\
    #import \"printing.h\"\n\n@interface Class2 : Class1\n-(void) print;\n\n@end\n\
    ```\n\n现在，你可以为 `Class1` 以一种方式实现 `print`：\n\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\n@implementation Class1\n\
    -(void) print\n{\n    printf(\"This is Class 1.\\n\");\n}\n\n@end\n```\n\n你还可以为\
    \ `Class2` 以另一种方式实现 `print`：\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    #import \"Class1.h\"\n#import \"Class2.h\"\n\n@implementation Class2\n-(void)\
    \ print\n{\n    printf(\"This is Class 2.\\n\");\n}\n\n@end\n```\n\n然后你可以像这样创建\
    \ `Class1` 和 `Class2` 的对象并调用它们的每个 `print` 方法：\n\n"
