- md: "\n## Directing Program Flow\n\n### Using the Conditional Operator\n\nWe’ve\
    \ seen how you can make decisions in code using the if statement and execute code\
    \ to match the results of those decisions. You can also use the conditional operator\
    \ to make decisions. This operator lets you evaluate an expression and execute\
    \ code depending on the result. The conditional operator has this format:\n\n\
    *conditional* ? *expression1* : *expression2*;\n\nObjective-C evaluates *conditional*,\
    \ and if it’s true, executes *expression1*; if it’s false, it executes *expression2*.\
    \ The returned value from this operator is the expression that is executed. For\
    \ example, you may want to cap the temperature at 72, and if it’s greater than\
    \ 72, set it to 72. Here’s how to do that with a conditional operator:\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n   int temperature = 78;\n   temperature\
    \ = temperature > 72 ? 72 : temperature;\n   printf(\"The temperature is %i.\\\
    n\", temperature);\n   return 0;\n}\n```\n\nHere, if the temperature is greater\
    \ than 72, the first expression, 72, is returned from the conditional operator.\
    \ If it’s less than 72, the temperature itself is returned.\n\nTo use the Objective-C\
    \ conditional operator:\n\n1. Create a new program named **conditional.m**.\n\
    2. In conditional.m, enter the code shown in **Listing 2.11**. This code creates\
    \ the temperature variable and the statement that uses the conditional operator\
    \ to make sure the temperature is capped.\n3. Add the code to display the results\
    \ (**Listing 2.12**).\n4. Save conditional.m.\n5. Run the conditional.m program.\
    \ You should see the following:\nThe temperature is 72.\n\n```c\n// Listing 2.11\
    \ Starting conditional.m\n#include <stdio.h>\n\nint main(void)\n{\n   int temperature\
    \ = 78;\n   temperature = temperature > 72 ? 72 : temperature;\n   printf(\"The\
    \ temperature is %i.\\n\", temperature);\n   return 0;\n}\n```\n\n```c\n// Listing\
    \ 2.12 The conditional.m program.\n#include <stdio.h>\n\nint main(void)\n{\n \
    \  int temperature = 78;\n   temperature = temperature > 72 ? 72 : temperature;\n\
    \   printf(\"The temperature is %i.\\n\", temperature);\n   return 0;\n}\n```\n\
    \n### Using the for Loop\n\nLoops do what they excel at: perform many operations.\
    \ Loops let you execute a section of code over and over, typically operating on\
    \ different data in each iteration (that is, each time through the loop). The\
    \ for loop has this format:\n\nfor (*initialization; end_condition; after_loop*)\n\
    {\n   body\n}\n\nHere, *initialization* is an expression evaluated before the\
    \ loop starts; you typically set a loop_index variable (which keeps track of the\
    \ number of times the loop has executed) to zero here. The *end_condition* specification\
    \ is an expression (such as loop_index < 5) that, when it is no longer true, ends\
    \ the loop. The *after_loop* specification is executed after the body of the loop\
    \ (in curly braces following the for statement) is executed; you typically increment\
    \ the loop index value here.\n\nHere’s an example that uses a for loop to display\
    \ the message “You’ll see five times.”:\n\n```c\nint main(void)\n{\n   int loop_index;\n\
    \   for (loop_index = 0; loop_index < 5; loop_index++)\n   {\n      printf(\"\
    You’ll see this five times.\\n\");\n   }\n   return 0;\n}\n```\n\nTo use the Objective-C\
    \ for loop:\n\n1. Create a new program named **for.m**.\n2. In for.m, enter the\
    \ code shown in **Listing 2.13**. This code creates a for loop that executes five\
    \ times.\n3. Add the code to display the message each time through the loop (**Listing\
    \ 2.14**).\n4. Save for.m.\n5. Run the for.m program. You should see the following:\n\
    You’ll see this five times.\nYou’ll see this five times.\nYou’ll see this five\
    \ times.\nYou’ll see this five times.\nYou’ll see this five times.\n\n```c\n//\
    \ Listing 2.13 Starting for.m.\nint main(void)\n{\n   int loop_index;\n   for\
    \ (loop_index = 0; loop_index < 5; loop_index++)\n   {\n      printf(\"You’ll\
    \ see this five times.\\n\");\n   }\n   return 0;\n}\n```\n\n```c\n// Listing\
    \ 2.14 The for.m program.\nint main(void)\n{\n   int loop_index;\n   for (loop_index\
    \ = 0; loop_index < 5; loop_index++)\n   {\n      printf(\"You’ll see this five\
    \ times.\\n\");\n   }\n   return 0;\n}\n```\n\n### Using the while Loop\n\nObjective-C\
    \ offers another popular loop: the while loop. This loop keeps executing its body\
    \ while a certain condition is true. The while loop has this format:\n\nwhile\
    \ (*condition*)\n{\n   body\n}\n\nThe while loop checks the *condition*, and if\
    \ it’s true, executes the code in the loop. When the condition is tested and turns\
    \ out to be false, the loop stops. Here’s an example of a while loop that displays\
    \ the message “You’ll see five times.”:\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n   int loop_index = 0;\n   while (loop_index < 5)\n   {\n      printf(\"You’ll\
    \ see this five times.\\n\");\n      loop_index++;\n   }\n   return 0;\n}\n```\n\
    \nTo use the Objective-C while loop:\n\n1. Create a new program named **while.m**.\n\
    2. In while.m, enter the code shown in **Listing 2.15**. This code creates a while\
    \ loop that executes five times.\n3. Add the code to display the message each\
    \ time through the loop and increment the loop_index, which is checked by the\
    \ loop before each iteration (**Listing 2.16**).\n4. Save while.m.\n5. Run the\
    \ while.m program. You should see the following:\nYou’ll see this five times.\n\
    You’ll see this five times.\nYou’ll see this five times.\nYou’ll see this five\
    \ times.\nYou’ll see this five times.\n\n```c\n// Listing 2.15 Starting while.m.\n\
    #include <stdio.h>\n\nint main(void)\n{\n   int loop_index = 0;\n   while (loop_index\
    \ < 5)\n   {\n      printf(\"You’ll see this five times.\\n\");\n      loop_index++;\n\
    \   }\n   return 0;\n}\n```\n\n```c\n// Listing 2.16 The while.m program.\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n   int loop_index = 0;\n   while (loop_index\
    \ < 5)\n   {\n      printf(\"You’ll see this five times.\\n\");\n      loop_index++;\n\
    \   }\n   return 0;\n}\n```\n\n### Using the do...while Loop\n\nOne more popular\
    \ loop that Objective-C offers is the do...while loop. Like the while loop, this\
    \ loop keeps executing its body while a certain condition is true, but unlike\
    \ the while loop, it checks its condition *after* the loop’s body executes. The\
    \ do...while loop has this format:\n\ndo\n{\n   body\n} while (*condition);\n\n\
    The do...while loop executes its body and then checks the *condition* expression;\
    \ it’s true, the loop executes again. When the condition is tested and turns out\
    \ to be false, the loop stops.\n\nWhy do you need the do...while loop in addition\
    \ to the while loop? You typically use a do...while loop when the loop condition\
    \ is set for the first time within the loop: for example, if you’re reading from\
    \ a file and terminating the loop at the end of the file, you need to try to read\
    \ from the file at least once to see if the file contains any data for you to\
    \ read before the loop is terminated.\n\nHere’s an example that displays the message\
    \ “You’ll see five times.” This time, a do...while loop was used:\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n   int loop_index = 0;\n   do {\n      printf(\"\
    You’ll see this five times.\\n\");\n      loop_index++;\n   } while (loop_index\
    \ < 5);\n   return 0;\n}\n```"
