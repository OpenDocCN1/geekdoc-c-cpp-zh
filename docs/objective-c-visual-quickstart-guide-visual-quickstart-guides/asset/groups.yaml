    \    {\n        NSException *myException = [[NSException alloc] initWithName:@\"\
    MyException\"\n            reason:@\"Meltdown!\" userInfo:nil];\n        [myException\
    \ raise];\n        [pool release];\n    }\n    NS_HANDLER\n    {\n        printf(\"\
    In error handler.\\n\");\n    }\n    NS_ENDHANDLER\n    {\n        printf(\"In\
    \ end handler.\");\n    }\n    return 0;\n}\n```\n**列表 11.10** main.m 程序。\n\n\
    ## 处理多个异常\n\n为了处理多个异常，你会在 `NS_HANDLER` 块中使用 `if/else`。\n\n1. 创建一个名为 **main.m**\
    \ 的文件。\n2. 在 main.m 中输入**列表 11.11** 所示的代码。这会检查多个异常。\n\n```objc\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main()\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NS_DURING\n    {\n        NSException *myException = [[NSException\
    \ alloc] initWithName:@\"MyException\"\n            reason:@\"Meltdown!\" userInfo:nil];\n\
    \        [myException raise];\n        [pool release];\n    }\n    NS_HANDLER\n\
    \    {\n        printf(\"In error handler.\\n\");\n    }\n    NS_ENDHANDLER\n\
    \    {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n**列表\
    \ 11.11** main.m。\n\n3. 输入代码以将未处理的异常传递回堆栈（**列表 11.12**）。\n4. 保存 main.m。\n\n```objc\n\
    NS_DURING\n{\n}\nNS_HANDLER\n{\n}\n```\n**列表 11.12** main.m。\n\n## 将异常传递回堆栈\n\n\
    有时在处理异常时，你可能希望将异常传递回堆栈中的调用代码。你可以简单通过在 `NS_HANDLER` 块中再次抛出异常来实现，正如在这个任务中所所示。\n\n\
    **将异常传递回堆栈：**\n\n1. 创建一个名为 **main.m** 的文件。\n2. 在 main.m 中输入**列表 11.13** 所示的代码。这设置了处理多个异常。\n\
    \n```objc\nNS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"\
    Exception1\"]) {\n    } else if ([localException isEqualToString:@\"Exception2\"\
    ]) {\n    } else {\n        [localException raise];\n    }\n}\n```\n**列表 11.13**\
    \ main.m。\n\n3. 输入代码将未处理的异常传递回堆栈（**列表 11.14**）。\n4. 保存 main.m。\n\n```objc\nNS_DURING\n\
    {\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"Exception1\"])\
    \ {\n    } else if ([localException isEqualToString:@\"Exception2\"]) {\n    }\
    \ else {\n        [localException raise];\n    }\n}\n```\n**列表 11.14** main.m。\n\
    \n## 从异常处理程序返回返回值\n\n如果你的异常处理程序位于函数中，你可能希望从该函数返回一个值——也就是说，即使函数发生了异常，你可能仍然想向调用代码返回一个值。然而，你不能直接在异常处理程序中使用\
    \ `return` 语句——你必须使用 `NS_RETURNVALUE`，正如在这个任务中所看到的。\n\n**从异常处理程序返回返回值：**\n\n1.\
    \ 创建一个名为 **main.m** 文件。\n2. 在 main.m 中输入**列表 11.15** 所示的代码。此输入项设置了处理多个异常的逻辑。\n\
    \n```objc\nNS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"\
    Exception1\"]) {\n    } else if ([localException isEqualToString:@\"Exception2\"\
    ]) {\n    } else {\n        [localException raise];\n    }\n}\n```\n**列表 11.15**\
    \ main.m。\n\n3. 添加代码从异常处理代码返回返回值（**列表 11.16**）。\n4. 保存 main.m。\n\n```objc\nNS_DURING\n\
    {\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"Exception1\"])\
    \ {\n        NS_RETURNVALUE(0);\n    } else if ([localException isEqualToString:@\"\
    Exception2\"]) {\n        NS_RETURNVALUE(1);\n    } else {\n        [localException\
    \ raise];\n    }\n}\n```\n**列表 11.16** main.m 程序。\n\n"
