- md: "\n## Chapter 8: Categories, Posing, and Protocols\n\nThere are other ways of\
    \ doing the same thing—you could use polymorphism, for example (see the previous\
    \ chapter). But using posing can be cleaner because you don’t have to keep track\
    \ of what kind of pointer is stored in your variables all the way through your\
    \ code.\n\n*Protocols* are much like what are called interfaces in Java. A protocol\
    \ is a specification for a method, much like its prototype. When you indicate\
    \ that a certain class uses specific protocols, you’re indicating that that class\
    \ implements those methods. In other words, protocols let you declare methods;\
    \ it’s up to you to define the implementation in your class.\n\nThis is the closest\
    \ Objective-C comes to multiple inheritance, in which you inherit from multiple\
    \ classes, because using protocols, you can make sure all your derived classes\
    \ implement the same methods (although the actual implementation in each class\
    \ may be different). That’s useful if, for example, you have two base classes,\
    \ named Animal and Pet, and want to derive classes named Cat and Dog from them.\
    \ You can make sure that Cat and Dog implement the methods of Animal and Pet by\
    \ using protocols. When Cat and Dog use the protocols defined by Animal and Pet,\
    \ Cat and Dog both implement a list of methods.\n\n### About Categories\n\nCategories\
    \ let you extend a class by defining new methods, even if you don’t have access\
    \ to that class’s source code or can’t change it. Say you have a class, Class1,\
    \ with a single method, method1, in the class’s header:\n\n```objc\n#include <Foundation.h>\n\
    @interface Class1 : NSObject\n-(return_type)method1;\n@end\n```\n\nSuppose also\
    \ that the method is defined in the class’s implementation file:\n\n```objc\n\
    #import <stdio.h>\n#include <Foundation.h>\n@implementation Class1\n-(return_type)method1\n\
    {\n\n}\n@end\n```\n\nIf you want to extend Class1 by adding a new method, method2,\
    \ you can create a new header file that lists the method like this:\n\n```objc\n\
    @interface Class1 (Extender)\n-(return_type)method2;\n@end\n```\n\nNote the term\
    \ Extender in parentheses after the class name. You can use whatever term you\
    \ want here to indicate that you’re extending the base class and give a name to\
    \ that extension. You use the same term in parentheses when you create the implementation\
    \ of method2 in its own file:\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    @implementation Class1 (Extender)\n-(return_type)method2\n{\n\n}\n@end\n```\n\n\
    In this way, Objective-C allows you to extend classes without modifying their\
    \ source code files.\n\n### Categories: Creating the Base Class\n\nIn this task,\
    \ you’ll create a base class that you’ll extend in the next task using categories.\
    \ You’ll create a class named Class1 that contains a method named print. Here’s\
    \ what the print method looks like; it just prints the message “This is Class\
    \ 1.”\n\n```objc\n-(void)print\n{\nprintf(\"This is Class 1.\\n\");\n}\n```\n\n\
    To create the base class that will be extended:\n- Create a program named class1.m.\n\
    - In class1.m, enter the code in Listing 8.1. This code creates the Class1 class.\n\
    - In class1.m, add the code to create the print method (Listing 8.2).\n- Save\
    \ class1.m.\n- Create a header file named class1.h.\n- In class1.h, enter the\
    \ code shown in Listing 8.3.\n- Save class1.h.\n\nNow you’re ready to extend the\
    \ class.\n\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n#import \"Class1.h\"\
    \n@implementation Class1\n\n\n\n@end\n```\n\n**Listing 8.1 Starting class1.m.**\n\
    ```objc\n#import <stdio.h>\n#include <Foundation.h>\n#import \"Class1.h\"\n@implementation\
    \ Class1\n-(void) print\n{\nprintf(\"This is Class 1.\\n\");\n}\n@end\n```\n**Listing\
    \ 8.2 The class1.m program.**\n```objc\n#include <Foundation.h>\n@interface Class1\
    \ : NSObject\n-(void)print;\n@end\n```\n**Listing 8.3 The class1.h file.**\n\n\
    ### Categories: Creating Categories\n\nIn the preceding task, you created Class1\
    \ with a print method. In the task here, you’ll extend Class1 to include a new\
    \ method, print2. The print2 method looks like:\n\n```objc\n-(void)print2\n{\n\
    printf(\"This is Class 1 extended.\\n\");\n}\n```\n\nAfter adding this method\
    \ to Class1, you’ll call both methods, method1 and method2, in the next task.\n\
    \nTo add categories to a class:\n- Create a program named class1ender.m.\n- In\
    \ class1ender.m, enter the code in Listing 8.4. This code indicates that you want\
    \ to extend Class1.\n- In class1ender.m, add the code to create the print method\
    \ (Listing 8.5).\n- Save class1ender.m.\n- Create a file named class1ender.h.\n\
    - In class1ender.h, enter the code in Listing 8.6.\n- Save class1ender.h.\n\n\
    ```objc\n#import <stdio.h>\n#include <Foundation.h>\n#import \"Class1.h\"\n#import\
    \ \"Class1ender.h\"\n@implementation Class1 (Extender)\n-(void)print2\n{\nprintf(\"\
    This is Class 1 extended.\\n\");\n}\n@end\n```\n**Listing 8.4 Starting class1ender.m.**\n\
    **Listing 8.5 The class1ender.m program.**\n```objc\n@interface Class1 (Extender)\n\
    -(void)print2;\n@end\n```\n**Listing 8.6 The class1ender.h file.**\n\n### Categories:\
    \ Putting It Together\n\nIn the previous two tasks, you created Class1 and extended\
    \ it using categories. In this task, you’ll put the Class1 class and its extension\
    \ category to work.\n\nTo use the base class with categories:\n- Create a new\
    \ program named main.m.\n- In main.m, enter the code shown in Listing 8.7. This\
    \ code includes the class1.h and class1ender.h header files to make sure your\
    \ code knows about Class1 and its extending categories.\n- In main.m, add the\
    \ code to create a new object of Class1 (Listing 8.8).\n\n```objc\n#import <stdio.h>\n\
    #import \"Class1.h\"\n#import \"Class1ender.h\"\nint main(void)\n{\n\n \n}\n```\n\
    **Listing 8.7 Starting main.m.**\n```objc\n#import <stdio.h>\n#import \"Class1.h\"\
    \n#import \"Class1ender.h\"\nint main(void)\n{\nClass1 *c1 = [Class1 new];\n\n\
    \ \n}\n```\n**Listing 8.8 Editing main.m.**\n- In main.m, add the code shown in\
    \ Listing 8.9. This code calls the print method built into the Class1 class and\
    \ the print2 method with which you’ve extended Class1.\n- Save main.m.\n- If you’re\
    \ using Linux, UNIX, or Windows, create a new makefile named GNUmakefile.\n- In\
    \ GNUmakefile, enter the code shown in Listing 8.10.\n- Save GNUmakefile.\n- Run\
    \ the main.m categories program. You should see the output from both the print\
    \ method and the extending print2 method:\n\n```objc\n#import <stdio.h>\n#import\
    \ \"Class1.h\"\n#import \"Class1ender.h\"\n#import \"FractionMath.h\"\nint main(void)\n\
    {\nClass1 *c1 = [Class1 new];\n[c1 print];\n[c1 print2];\nreturn 0;\n}\n```\n\
    **Listing 8.9 Calling the print and print2 methods.**\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME = categories\ncategories_OBJC_FILES = Class1.m Class1ender.m main.m\n\
    include $(GNUSTEP_MAKEFILES)/tool.make\n```\n**Listing 8.10 GNUmakefile.**\n"
  mdcn: "\n\n## 第 8 章：分类、布局（协议）与协议\n\n实现相同的功能还有其他方法——例如，你可以使用多态（参见上一章）。但使用布局（posing）可能会更整洁，因为你不需要在整个代码过程中不断跟踪变量中存储的是什么种类型的指针。\n\
    \n*协议（Protocols）* 非常像 Java 中所谓的接口（interfaces）。协议是一个方法的规范，就像它的原型（prototype）一样。当你指定某个类使用特定的协议时，你实际上是在表示该类实现了这些方法。换句话说，协议允许你声明方法；而在你的类中定义具体的实现则由你决定。\n\
    \n这是 Objective-C 最接近多重继承的地方（在多重继承中你可以从多个类继承），因为通过使用协议，你可以确保所有的派生类都实现了相同的方法（尽管每个类中的具体实现可能不同）。这非常有用，例如你有名为\
    \ `Animal` 和 `Pet` 的两个基类，并想从它们派生名为 `Cat` 和 `Dog` 的类。你可以通过协议确保 `Cat` 和 `Dog` 实现了\
    \ `Animal` 和 `Pet` 的方法。当 `Cat` 和 `Dog` 使用由 `Animal` 和 `Pet` 定义的协议时，`Cat` 和 `Dog`\
    \ 都实现了一系列方法。\n\n### 关于分类（Categories）\n\n分类允许你通过定义新方法来扩展一个类，即使你无法访问该类的源代码或无法修改它也可以。假设你有一个类\
    \ `Class1`，它在类的头文件中有一个单一的方法 `method1`：\n\n```objc\n#include <Foundation.h>\n@interface\
    \ Class1 : NSObject\n-(return_type)method1;\n@end\n```\n\n同样，假设该方法定义在类的实现文件中：\n\
    \n```objc\n#import <stdio.h>\n#include <Foundation.h>\n@implementation Class1\n\
    -(return_type)method1\n{\n\n}\n@end\n```\n\n如果你想通过添加一个新方法 `method2` 来扩展 `Class1`，你可以创建一个新的头文件，像所示列出该方法：\n\
    \n```objc\n@interface Class1 (Extender)\n-(return_type)method2;\n@end\n```\n\n\
    注意类名后面括号中的术语 `Extender`。你可以在这里使用任何术语来表示你正在扩展基类，并为该扩展命名。当你在自己的文件中创建 `method2` 的实现时，使用相同的括号内术语：\n\
    \n```objc\n#import <stdio.h>\n#include <Foundation.h>\n@implementation Class1\
    \ (Extender)\n-(return_type)method2\n{\n\n}\n@end\n```\n\n通过这种方式，Objective-C 允许你在不修改源代码文件的情况下扩展类。\n\
    \n### 分类：创建基类\n\n在此项任务中，你将创建一个基类，并在下一个任务中通过分类来扩展它。你将创建一个名为 `Class1` 的类，其中包含一个名为\
    \ `print` 的方法。以下是 `print` 方法的样子；它只是打印消息“This is Class 1.”。\n\n```objc\n-(void)print\n\
    {\nprintf(\"This is Class 1.\\n\");\n}\n```\n\n创建将被扩展的基类：\n- 创建名为 `class1.m` 的程序。\n\
    - 在 `class1.m` 中，输入列表 8.1 中的代码。这段代码创建了 `Class1` 类。\n- 在 `class1.m` 中，添加创建 `print`\
    \ 方法的代码（列表 8.2）。\n- 保存 `class1.m`。\n- 创建名为 `class1.h` 的头文件。\n- 在 `class1.h` 中，输入列表\
    \ 8.3 所示的代码。\n- 保存 `class1.h`。\n\n现在你准备好扩展该类了。\n\n```objc\n#import <stdio.h>\n\
    #include <Foundation.h>\n#import \"Class1.h\"\n@implementation Class1\n\n\n\n\
    @end\n```\n\n**列表 8.1 开始 class1.m。**\n```objc\n#import <stdio.h>\n#include <Foundation.h>\n\
    #import \"Class1.h\"\n@implementation Class1\n-(void) print\n{\nprintf(\"This\
    \ is Class 1.\\n\");\n}\n@end\n```\n**列表 8.2 class1.m 程序。**\n```objc\n#include\
    \ <Foundation.h>\n@interface Class1 : NSObject\n-(void)print;\n@end\n```\n**列表\
    \ 8.3 class1.h 文件。**\n\n### 分类：创建分类\n\n在之前的任务中，你创建了带有 `print` 方法的 `Class1`。在本文的任务中，你将扩展\
    \ `Class1` 以包含一个新方法 `print2`。`print2` 方法如下：\n\n```objc\n-(void)print2\n{\nprintf(\"\
    This is Class 1 extended.\\n\");\n}\n```\n\n在将此方法添加到 `Class1` 之后，你将在下一个任务中调用两个方法：`method1`\
    \ 和 `method2`。\n\n为类添加分类：\n- 创建一个名为 `class1ender.m` 的程序。\n- 在 `class1ender.m`\
    \ 中，输入列表 8.4 中的代码。这段代码表示你想要扩展 `Class1`。\n- 在 `class1ender.m` 中，添加创建 `print` 方法的代码（列表\
    \ 8.5）。\n- 保存 `class1ender.m`。\n- 创建名为 `class1ender.h` 的文件。\n- 在 `class1ender.h`\
    \ 中，输入列表 8.6 中的代码。\n- 保存 `class1ender.h`。\n\n```objc\n#import <stdio.h>\n#include\
    \ <Foundation.h>\n#import \"Class1.h\"\n#import \"Class1ender.h\"\n@implementation\
    \ Class1 (Extender)\n-(void)print2\n{\nprintf(\"This is Class 1 extended.\\n\"\
    );\n}\n@end\n```\n**列表 8.4 开始 class1ender.m。**\n**列表 8.5 class1ender.m 程序。**\n\
    ```objc\n@interface Class1 (Extender)\n-(void)print2;\n@end\n```\n**列表 8.6 class1ender.h。**\n\
    \n### 分类：整合\n\n在之前的两个任务中，你创建了带有 `print` 方法的 `Class1` 并扩展了它。在本次任务中，你将让 `Class1`\
    \ 类及其分类协同工作。\n\n使用分类使用基类：\n- 创建名为 `main.m` 的新程序。\n- 在 `main.m` 中，输入列表 8.7 所示的代码。这段代码包含了\
    \ `class1.h` 和 `class1ender.h` 头文件，以确保代码了解 `Class1` 及其分类。\n- 在 `main.m` 中，添加创建\
    \ `Class1` 对象的代码（列表 8.8）。\n\n```objc\n#import <stdio.h>\n#import \"Class1.h\"\n\
    #import \"Class1ender.h\"\nint main(void)\n{\n\n \n}\n```\n**列表 8.7 开始 main.m。**\n\
    ```objc\n#import <stdio.h>\n#import \"Class1.h\"\n#import \"Class1ender.h\"\n\
    int main(void)\n{\nClass1 *c1 = [Class1 new];\n\n \n}\n```\n**列表 8.8 编辑 main.m。**\n\
    - 在 `main.m` 中，添加列表 8.9 所示的代码。这段代码调用了 `Class1` 类的 `print` 方法以及你扩展 `Class1` 的 `print2`\
    \ 方法。\n- 保存 `main.m`。\n- 如果你使用的是 Linux、UNIX 或 Windows，创建一个名为 `GNUmakefile` 的新文件。\n\
    - 在 `GNUmakefile` 中，输入列表 8.10 所示的代码。\n- 保存 `GNUmakefile`。\n- 运行 `main.m` 分类程序。你应该能看到来自\
    \ `print` 方法和扩展的 `print2` 方法的输出：\n\n```objc\n#import <stdio.h>\n#import \"Class1.h\"\
    \n#import \"Class1ender.h\"\n#import \"FractionMath.h\"\nint main(void)\n{\nClass1\
    \ *c1 = [Class1 new];\n[c1 print];\n[c1 print2];\nreturn 0;\n}\n```\n**列表 8.9\
    \ 调用 print 和 print2 方法。**\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME = categories\ncategories_OBJC_FILES = Class1.m Class1ender.m main.m\n\
    include $(GNUSTEP_MAKEFILES)/tool.make\n```\n**列表 8.10 GNUmakefile。**\n\n"
