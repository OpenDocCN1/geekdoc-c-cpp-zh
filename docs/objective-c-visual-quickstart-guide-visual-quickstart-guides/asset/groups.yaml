    \nLoops provide another tool for controlling \n\nthe flow of your programs. Loops\
    \ let you \n\nperform specific actions over and over, such \n\nas summing a group\
    \ of numbers or drawing \n\nlines. For example, in a for loop, the most \n\ncommon\
    \ type of loop, you initialize a variable \n\ncalled loop\\_index (usually by\
    \ setting it to \n\nzero), specify the condition that causes the \n\nloop to end,\
    \ and an operation to perform \n\nafter the body of the loop is executed. In the\
    \ \n\nexample here, the loop ends when the loop\\_\n\nindex variable contains\
    \ a number greater \n\nthan 5; after the body of the loop runs, the \n\nloop\\\
    _index value is incremented:\n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n\
    ** int loop\\_index;**\n\n** for (loop\\_index = 0; loop\\_index < 5; **\n\n**\
    \ loop\\_index++)**\n\n** {**\n\n** printf(“You’ll see this five **\n\n** times.\\\
    \\n”);**\n\n** }**\n\n  return 0;\n\n}\n\nThis example displays the text “You’ll\
    \ see this \n\nfive times.” \n\nMore on the for loop and the other loops in \n\
    \nObjective-C is coming up in this chapter.\n\n From the Library of Wow! eBook"
- md: "\n## Chapter 2\n\n## Using the if Statement\n\nThe if statement is the most\
    \ basic of the program flow control statements. This statement lets you test a\
    \ condition, and if the condition is true, lets you execute specific code.\n\n\
    For example, if you set a variable named temperature to 72, you can use an if\
    \ statement to test to make sure that the variable does contain 72. You place\
    \ the condition you want to test, which in this case is temperature == 72, using\
    \ the == equality operator, inside parentheses, and the code you want to execute\
    \ if the condition is true in curly braces following the parentheses, like this:\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n \
    \   if (temperature == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n\
    \    }\n    return 0;\n}\n```\n\nIn this case, the temperature does equal 72,\
    \ so the code in the curly braces will be executed. Here, that code prints the\
    \ message “Perfect weather.”\n\n**to use the Objective-C if statement:**\n\n1.\
    \ Create a new program named **if.m**.\n2. In if.m, enter the code shown in **Listing\
    \ 2.1**. This code creates the temperature variable and checks to see if it equals\
    \ 72.\n3. Add the code to display the “perfect weather” message if the temperature\
    \ equals 72 (**Listing 2.2**).\n4. Save if.m.\n5. Run the if.m program.\n\nYou\
    \ should see the following:\nPerfect weather.\n\n```c\n#include <stdio.h>\n\n\
    int main(void)\n{\n    int temperature = 72;\n    if (temperature == 72)\n   \
    \ {\n    }\n    return 0;\n}\n```\nListing 2.1 Starting if.m.\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n    if (temperature\
    \ == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n    return 0;\n\
    }\n```\nListing 2.2 The if.m program.\n\n## Using the else Statement\n\nThe if\
    \ statement allows you to specify code that runs if a condition you specify (such\
    \ as temperature == 72) is true. The else statement lets you specify alternative\
    \ code that runs when an if statement turns out to be false. For example, as shown\
    \ here, you can modify the previous task to display the message “Weather could\
    \ be better.” if the temperature is not 72.\n\n```c\n#include <stdio.h>\n\nint\
    \ main(void)\n{\n    int temperature = 78;\n    if (temperature == 72)\n    {\n\
    \        printf(\"Perfect weather.\\n\");\n    }\n    else\n    {\n        printf(\"\
    Weather could be better.\\n\");\n    }\n    return 0;\n}\n```\n\n**Tip:** If you\
    \ use an else statement, it must immediately follow an if statement.\n\n**to use\
    \ the Objective-C else statement:**\n\n1. Create a new program named **else.m**.\n\
    2. In else.m, enter the code shown in **Listing 2.3**. This code creates the temperature\
    \ variable and checks to see if it equals 72.\n3. Add the else statement to display\
    \ alternative text if the temperature does not equal 72 (**Listing 2.4**).\n4.\
    \ Save else.m.\n5. Run the else.m program.\n\nYou should see:\nWeather could be\
    \ better.\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature\
    \ = 78;\n    if (temperature == 72)\n    {\n        printf(\"Perfect weather.\\\
    n\");\n    }\n    return 0;\n}\n```\nListing 2.3 Starting else.m.\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    int temperature = 78;\n    if (temperature\
    \ == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n    else\n \
    \   {\n        printf(\"Weather could be better.\\n\");\n    }\n    return 0;\n\
    }\n```\nListing 2.4 The else.m program.\n\n## Using the switch Statement\n\nIf\
    \ you have many conditions to test, you may want to use a switch statement instead\
    \ of multiple if-else statements. You can test text strings (coming up in the\
    \ next chapter) or integers with the switch statement. When a case statement that\
    \ matches the value in the variable you’re testing is found in the switch statement,\
    \ the corresponding code is executed.\n\nThe following example tests for various\
    \ temperatures, executing code for each temperature:\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int temperature = 73;\n    switch(temperature)\n    {\n\
    \        case 71:\n            printf(\"Could be a little warmer.\\n\");\n   \
    \         break;\n        case 72:\n            printf(\"Perfect weather.\\n\"\
    );\n            break;\n        case 73:\n            printf(\"It’s a little warm.\\\
    n\");\n            break;\n        default:\n            printf(\"Unknown temperature.\\\
    n\");\n    }\n    return 0;\n}\n```\n\n**to use the Objective-C switch statement:**\n\
    \n1. Create a new program named **switch.m**.\n2. In switch.m, enter the code\
    \ shown in **Listing 2.5**. This code creates the temperature variable and the\
    \ switch statement.\n3. Add the case statements to display messages corresponding\
    \ to the temperature (**Listing 2.6**).\n4. Save switch.m.\n5. Run the switch.m\
    \ program.\n\nYou should see the following:\nIt’s a little warm.\n\n**Tip:** If\
    \ no case matches the variable you’re testing, the default case is executed.\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 73;\n \
    \   switch(temperature)\n    {\n    }\n    return 0;\n}\n```\nListing 2.5 Starting\
    \ switch.m.\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature\
    \ = 73;\n    switch(temperature)\n    {\n        case 71:\n            printf(\"\
    Could be a little warmer.\\n\");\n            break;\n        case 72:\n     \
    \       printf(\"Perfect weather.\\n\");\n            break;\n        case 73:\n\
    \            printf(\"It’s a little warm.\\n\");\n            break;\n       \
    \ default:\n            printf(\"Unknown temperature.\\n\");\n    }\n    return\
    \ 0;\n}\n```\nListing 2.6 The switch.m program.\n\n## Using Comparison Operators\n\
    \nSo far we’ve compared values with the == equality operator:\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n    if (temperature\
    \ == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n    return 0;\n\
    }\n```\n\nThe equality operator is just one of the Objective-C comparison operators,\
    \ which are listed in Table 2.1.\n\n| Operator | Description |\n| :--- | :---\
    \ |\n| == | Equality |\n| != | Inequality |\n| > | Greater than |\n| < | Less\
    \ than |\n| >= | Greater than or equal to |\n| <= | Less than or equal to |\n\n\
    **to use comparison operators:**\n\n1. Create a new program named **compare.m**.\n\
    2. In compare.m, enter the code shown in **Listing 2.7**. This program compares\
    \ the temperature to 72, and if the temperature is less than 72, it executes code.\n\
    3. Add the case statements to display a messages if the temperature is below 72\
    \ (**Listing 2.8**).\n4. Save compare.m.\n5. Run the compare.m program.\n\nYou\
    \ should see the following:\nCould be a little warmer.\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int temperature = 71;\n    if (temperature < 72)\n  \
    \  {\n    }\n    return 0;\n}\n```\nListing 2.7 Starting compare.m.\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int temperature = 71;\n    if (temperature\
    \ < 72)\n    {\n        printf(\"Could be a little warmer.\\n\");\n    }\n   \
    \ return 0;\n}\n```\nListing 2.8 The compare.m program.\n\n## Using Logical Operators\n\
    \nIn the previous task, we checked to see if the temperature was less than 72:\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 71;\n \
    \   if (temperature < 72)\n    {\n        printf(\"Could be a little warmer.\\\
    n\");\n    }\n    return 0;\n}\n```\n\nWhat if you want to check whether the temperature\
    \ is between 70 and 74 degrees? For that, you can use logical operators. Logical\
    \ operators let you connect multiple clauses. Table 2.2 lists the logical operators.\n\
    \n| Operator | Description |\n| :--- | :--- |\n| ! | Reverses the true/false value\
    \ of a condition |\n| && | Both clauses have be true for the resulting expression\
    \ |\n| \\| | Either clause can be true for the resulting expression |\n\n**to\
    \ use logical operators:**\n\n1. Create a new program named **logical.m**.\n2.\
    \ In logical.m, enter the code shown in **Listing 2.9**. This code sets up the\
    \ if statement to check whether the temperature is less than 74 and greater than\
    \ 70.\n3. Display a message if the temperature is within the range (**Listing\
    \ 2.10**).\n4. Save logical.m.\n5. Run the logical.m program.\n\nYou should see\
    \ the following:\nNice weather.\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int temperature = 71;\n    if (temperature < 74 && temperature > 70)\n\
    \    {\n    }\n    return 0;\n}\n```\nListing 2.9 Starting logical.m.\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int temperature = 71;\n    if (temperature\
    \ < 74 && temperature > 70)\n    {\n        printf(\"Nice weather.\\n\");\n  \
    \  }\n    return 0;\n}\n```\nListing 2.10 The logical.m program.\n"
  mdcn: "\n\n## 第 2 章\n\n## 使用 if 语句\n\nif 语句是程序流控制语句中最基础的一种。该语句允许你测试一个条件，如果条件为真，则允许你执行特定的代码。\n\
    \n例如，如果你设置一个名为 `temperature` 的变量为 72，你可以使用 if 语句来测试并确保变量确实包含 72。你将要测试的条件（在本例中为\
    \ `temperature == 72`，使用 `==` 等于运算符）放在括号内，并将条件为真时要执行的代码放在括号后的大括号中，如下所示：\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n    if (temperature\
    \ == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n    return 0;\n\
    }\n```\n\n在这种情况下，temperature 确实等于 72，因此大括号中的代码将被执行。在这里，该代码会打印消息“Perfect weather.”\n\
    \n**使用 Objective-C if 语句：**\n\n1. 创建名为 **if.m** 的新程序。\n2. 在 if.m 中，输入**Listing\
    \ 2.1** 所示的代码。这段代码创建了温度 变量并检查它是否等于 72。\n3. 添加代码以在温度等于 72 时显示“perfect weather”消息（**Listing\
    \ 2.2**）。\n4. 保存 if.m。\n5. 运行 if.m 程序。\n\n你应该看到：\nPerfect weather.\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n    if (temperature\
    \ == 72)\n    {\n    }\n    return 0;\n}\n```\nListing 2.1 启动 if.m.\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int temperature = 72;\n    if (temperature\
    \ == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n    return 0;\n\
    }\n```\nListing 2.2 The if.m 程序。\n\n## 使用 else 语句\n\nif 语句允许你指定当某个指定的条件（如 `temperature\
    \ == 72`）为真时运行的代码。else 语句允许你指定当 if 语句结果为假时运行的备用代码。例如，所示，你可以修改之前的任务，在温度不等于 72 时显示消息“Weather\
    \ could be better.”。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int\
    \ temperature = 78;\n    if (temperature == 72)\n    {\n        printf(\"Perfect\
    \ weather.\\n\");\n    }\n    else\n    {\n        printf(\"Weather could be better.\\\
    n\");\n    }\n    return 0;\n}\n```\n\n**提示：** 如果你使用 else 语句，它必须紧跟在 if 语句之后。\n\
    \n**使用 Objective-C else 语句：**\n\n1. 创建名为 **else.m** 的新程序。\n2. 在 else.m 中，输入**Listing\
    \ 2.3** 所示的代码。这段代码创建了温度变量并检查它是否等于 72。\n3. 添加 else 语句，在温度不等于 72 时显示备用文本（**Listing\
    \ 2.4**）。\n4. 保存 else.m。\n5. 运行 else.m 程序。\n\n你应该看到：\nWeather could be better.\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 78;\n \
    \   if (temperature == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n\
    \    }\n    return 0;\n}\n```\nListing 2.3 启动 else.m.\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int temperature = 78;\n    if (temperature == 72)\n \
    \   {\n        printf(\"Perfect weather.\\n\");\n    }\n    else\n    {\n    \
    \    printf(\"Weather could be better.\\n\");\n    }\n    return 0;\n}\n```\n\
    Listing 2.4 The else.m 程序。\n\n## 使用 switch 语句\n\n如果你有很多条件需要测试，你可能想使用 switch 语句代替多个\
    \ if-else 语句。你可以使用 switch 语句测试字符串（将在后续章节出现）或整数。当 switch 语句中找到了你正在测试变量的值，就会执行相应的代码。\n\
    \n以下示例测试了各种温度，并为每个温度执行代码：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n \
    \   int temperature = 73;\n    switch(temperature)\n    {\n        case 71:\n\
    \            printf(\"Could a little warmer.\\n\");\n            break;\n    \
    \    case 72:\n            printf(\"Perfect weather.\\n\");\n            break;\n\
    \        case 73:\n            printf(\"It’s little warm.\\n\");\n           \
    \ break;\n        default:\n            printf(\"Unknown temperature.\\n\");\n\
    \    }\n    return 0;\n}\n```\n\n**使用 Objective-C switch 语句：**\n\n1. 创建名为 **switch.m**\
    \ 的新程序。\n2. 在 switch.m 中，输入**Listing 2.5** 所示的代码。这段代码创建了温度变量和 switch 语句。\n3. 添加\
    \ case 语句显示对应温度的消息（**Listing 2.6**）。\n4. 保存 switch.m。\n5. 运行 switch.m 程序。\n\n\
    你应该看到：\nIt’s little warm.\n\n**提示：** 如果没有 case 匹配你正在测试的变量，则执行 default case。\n\n\
    ```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 73;\n   \
    \ switch(temperature)\n    {\n    }\n    return 0;\n}\n```\nListing 2.5 启动 switch.m.\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 73;\n \
    \   switch(temperature)\n    {\n        case 71:\n            printf(\"Could a\
    \ little warmer.\\n\");\n            break;\n        case 72:\n            printf(\"\
    Perfect weather.\\n\");\n            break;\n        case 73:\n            printf(\"\
    It’s little warm.\\n\");\n            break;\n        default:\n            printf(\"\
    Unknown temperature.\\n\");\n    }\n    return 0;\n}\n```\nListing 2.6 The switch.m\
    \ 程序。\n\n## 使用比较运算符\n\n到目前为止，我们使用 `==` 等于运算符来比较值：\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int temperature = 72;\n    if (temperature == 72)\n \
    \   {\n        printf(\"Perfect weather.\\n\");\n    }\n    return 0;\n}\n```\n\
    \n等于运算符只是 Objective-C 比较运算符之一，列在表 2.1 中。\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| ==\
    \ | 等于 |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n\
    \n**使用比较运算符：**\n\n1. 创建名为 **compare.m** 的新程序。\n2. 在 compare.m 中，输入**Listing 2.7**\
    \ 所示的代码。该程序将温度与 72 进行比较，如果温度小于 72，则执行代码。\n3. 添加语句以在温度低于 72 时显示消息（**Listing 2.8**）。\n\
    4. 保存 compare.m。\n5. 运行 compare.m 程序。\n\n你应该看到：\nCould be a little warmer.\n\n\
    ```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 71;\n   \
    \ if (temperature < 72)\n    {\n    }\n    return 0;\n}\n```\nListing 2.7 启动 compare.m.\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int temperature = 71;\n \
    \   if (temperature < 72)\n    {\n        printf(\"Could be a little warmer.\\\
    n\");\n    }\n    return 0;\n}\n```\nListing 2.8 The compare.m 程序。\n\n## 使用逻辑运算符\n\
    \n在上一个任务中，我们检查了温度是否小于 72：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n \
    \   int temperature = 71;\n    if (temperature < 72)\n    {\n        printf(\"\
    Could be a little warmer.\\n\");\n    }\n    return 0;\n}\n```\n\n如果你想检查温度是否在\
    \ 70 到 74 度之间该呢？对于这一点，你可以使用逻辑运算符。逻辑运算符允许你连接多个语句。表 2.2 列出了逻辑运算符。\n\n| 运算符 | 描述\
    \ |\n| :--- | :--- |\n| ! | 反转条件的真/假值 |\n| && | 结果表达式的两个语句都为真 |\n| \\| | 结果表达式任一语句为真即可\
    \ |\n\n**使用逻辑运算符：**\n\n1. 创建名为 **logical.m** 的新程序。\n2. 在 logical.m 中，输入**Listing\
    \ 2.9** 所示的代码。这段代码设置了 if 语句来检查温度是否小于 74 且大于 70。\n3. 如果温度在范围内，显示一条消息（**Listing\
