  - "[PAGE 67]\n\n**59**\n\n**Creating Functions**\n\n**4**\n\nThis chapter is all\
    \ about functions, which are \n\nchunks of code you can call to make them \n\n\
    run—and they won’t run unless you call them.\n\nSo far, the code in the programs\
    \ we’ve discussed \n\nhas executed automatically when the programs \n\nstart.\
    \ But functions are different; you have to \n\nexplicitly call a function by name\
    \ in your code \n\nbefore its code will run. That means that using \n\nfunctions,\
    \ you can divide your code into smaller \n\nparts: the divide and conquer technique.\n\
    \nIn Objective-C, functions are a crucial stop on \n\nthe way to building your\
    \ own objects. Objects \n\nlet you package both data and functions— \n\ncalled\
    \ methods when they’re built into \n\nobjects—together, as you’ll soon see.\n\n\
    Here is an example of how you might create a \n\nfunction named greeter( ):\n\n\
    #include <stdio.h>\n\nvoid greeter(void)\n\n{\n\n  printf(“Hello there.”);\n\n\
    }\n\n        .\n\n        .\n\n        .\n\nNote the function’s structure: In\
    \ front of its \n\nname (here, greeter), you specify a return \n\ntype, which\
    \ indicates the type of the data item\n\n*continues on next page*\n\nCreating\
    \ \n\nFunctions\n\n From the Library of Wow! eBook"
- md: "\n## Chapter 4\n\n## Creating Functions\n\nthe function can return. Since greeter()\
    \ doesn’t return any data, the return type is void. Then, in parentheses following\
    \ the name comes a list of arguments; these are the data items you pass to the\
    \ function to let it do its work. Since the greeter() function takes no arguments,\
    \ it uses void for the argument list as well. Then comes the body of the function—the\
    \ actual code that runs when you call the function—enclosed in curly braces: {\
    \ and }. In this case, the greeter() function simply displays a message: “Hello\
    \ there.”\n\nThe whole thing—the line that gives the function’s return type, name,\
    \ and argument list, as well as the body of the function—is called the function’s\
    \ *definition*.\n\nYou can call the greeter() function by name to run it from\
    \ the code in main()—which itself is a function:\n\n```c\n#include <stdio.h>\n\
    \nvoid greeter()\n{\n    printf(\"Hello there.\");\n}\n\nint main()\n{\n    greeter();\n\
    \    return 0;\n}\n```\n\nNow when your program runs, it will start automatically\
    \ by calling the main() function. The code in the main() function includes a call\
    \ to the greeter() function, which then will display its message. Nice.\n\nYou’ll\
    \ get the full story on functions here: how to pass data to them, how to return\
    \ data from them, how to pass pointers to them to access the data in the calling\
    \ code directly, how to make them call themselves (a process called recursion),\
    \ and how to set up pointers to them and then call them using those pointers.\n\
    \n## Defining a Function\n\nIn this first task, we’ll put to work the example\
    \ introduced in the chapter opener: the greeter() function.\n\n**to create a function:**\n\
    \n1. Create a new program named **function.m**.\n2. In function.m, enter the code\
    \ shown in **Listing 4.1**. This code creates the greeter() function.\n3. Add\
    \ the code shown in **Listing 4.2**. This code adds the main() function and the\
    \ call to the greeter() function.\n4. Save function.m.\n5. Run the function.m\
    \ program. You should see the following:\n\nHello there.\n\n```c\n#include <stdio.h>\n\
    \nvoid greeter()\n{\n    printf(\"Hello there.\");\n}\n```\n**Listing 4.1** Starting\
    \ function.m.\n\n```c\n#include <stdio.h>\n\nvoid greeter()\n{\n    printf(\"\
    Hello there.\");\n}\n\nint main()\n{\n    greeter();\n    return 0;\n}\n```\n\
    **Listing 4.2** The function.m program.\n\n## Declaring Functions Using Prototypes\n\
    \nIn the previous example, we defined the function in the code before calling\
    \ it, so Objective-C knew about the greeter() function before it was called. But\
    \ the function definition can also come after the call to that function in your\
    \ code, like this:\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    greeter();\n\
    \    return 0;\n}\n\nvoid greeter()\n{\n    printf(\"Hello there.\");\n}\n```\n\
    \nIn this case, you must tell Objective-C about the greeter() function with a\
    \ function *prototype*:\n\n```c\n#include <stdio.h>\n\nvoid greeter(void);\n\n\
    int main()\n{\n    greeter();\n    return 0;\n}\n\nvoid greeter()\n{\n    printf(\"\
    Hello there.\");\n}\n```\n\nA function prototype is just like the line where you\
    \ declare a function (the line just before the function body inside curly braces),\
    \ except that you remove the names of any function arguments (leaving just their\
    \ types) and end the prototype with a semicolon.\n\nThe function prototype is\
    \ also called the function *declaration* (as opposed to the function definition,\
    \ which includes the body of the function).\n\nYou can also put function prototypes\
    \ in header files, whose names end with .h, and then include them with stdio.h\
    \ as shown in the listings here. That include statement includes the stdio.h header\
    \ file, which includes prototypes for functions such as printf().\n\n**to create\
    \ a function prototype:**\n\n1. Create a new program named **functionprototype.m**.\n\
    2. In functionprototype.m, enter the code shown in **Listing 4.3**. This code\
    \ creates the greeter() function after the main() function and adds a prototype\
    \ before the main() function so Objective-C knows about the greeter() function.\n\
    3. Add the main() function to call the greeter() function (**Listing 4.4**).\n\
    4. Save functionprototype.m.\n5. Run the functionprototype.m program. You should\
    \ see the following:\n\nHello there.\n\n```c\n#include <stdio.h>\n\nvoid greeter(void);\n\
    ```\n**Listing 4.3** Starting functionprototype.m.\n\n```c\n#include <stdio.h>\n\
    \nvoid greeter(void);\n\nint main()\n{\n    greeter();\n    return 0;\n}\n\nvoid\
    \ greeter()\n{\n    printf(\"Hello there.\");\n}\n```\n**Listing 4.4** The functionprototype.m\
    \ program.\n\n## Passing Arguments to Functions\n\nYou can pass data to functions\
    \ so they can work on that data. For example, you can create a function named\
    \ adder() that you want to add two integers and display the results. To indicate\
    \ which arguments a function takes, you include an argument list in parentheses\
    \ following the name when you define the function. For example, the adder() function\
    \ takes two arguments: the two integers to add, we’ll name x and y:\n\n```c\n\
    void adder(int x, int y)\n```\n\nIn the body of the function, you can refer to\
    \ the first argument as x and the second argument as y. When you create a function\
    \ prototype, on the other hand (when you call the function before defining it),\
    \ you omit the names of the arguments, instead including just the type:\n\n```c\n\
    void adder(int, int);\n```\n\nNow you can write the body of the adder function\
    \ to add the two integers, which you can refer by name, x and y:\n\n```c\nvoid\
    \ adder(int x, int y)\n{\n    printf(\"%i + %i = %i\", x, y, x + y);\n}\n```\n\
    Tip: You specify the type (int) of every argument in the list before its name.\n\
    \n**to pass arguments to a function:**\n\n1. Create a new program named **functionargs.m**.\n\
    2. In functionargs.m, enter the code shown in **Listing 4.5**. This code creates\
    \ the adder() function.\n3. Enter the code to specify the main() function and\
    \ the call to the adder() function to add 5 plus 10 (**Listing 4.6**).\n4. Save\
    \ functionargs.m.\n5. Run the functionargs.m program. You should see the following:\n\
    \n5 + 10 = 15.\n\n```c\n#include <stdio.h>\n\nvoid adder(int x, int y)\n{\n  \
    \  printf(\"%i + %i = %i\", x, y, x + y);\n}\n```\n**Listing 4.5** Starting functionargs.m.\n\
    \n```c\n#include <stdio.h>\n\nvoid adder(int x, int y)\n{\n    printf(\"%i + %i\
    \ = %i\", x, y, x + y);\n}\n\nint main()\n{\n    int value1 = 5, value2 = 10;\n\
    \    adder(value1, value2);\n    return 0;\n}\n```\n**Listing 4.6** The functionargs.m\
    \ program.\n\n## Returning Values from Functions\n\nIn addition to passing data\
    \ to functions, you can have functions return data. They can return a single data\
    \ item—an integer, for example—or an array or an object.\n\nTo indicate that a\
    \ function returns a value, you specify the type of that data value first in a\
    \ function definition or declaration. For example, you can alter the adder() function\
    \ from the previous task to return an integer value holding the sum of the two\
    \ values passed to it, like this:\n\n```c\nint adder(int x, int y)\n```\n\nTo\
    \ actually return the sum of the two values passed to the adder() function, you\
    \ use a return statement:\n\n```c\nint adder(int x, int y)\n{\n    return x +\
    \ y;\n}\n```\n\nThat’s how it works: to return a value from a function, you place\
    \ the value you want to return right after the keyword return. Now when you call\
    \ the adder() function and pass data to that function, the call itself will be\
    \ replaced by the function’s return value. So to add 5 and 10 and display the\
    \ results, you can use this code:\n\n```c\nint value1 = 5, value2 = 10;\nprintf(\"\
    %i + %i = %i\", value1, value2, adder(value1, value2));\n```\n"
  mdcn: "\n## 从函数返回返回值\n\n除了向函数传递数据外，你还可以让函数返回数据。它们可以返回单个数据项——例如整数，也可以返回数组或对象。\n\n\
    要明一个函数返回一个值，你需要在函数定义或声明中首先指定该数据值的类型。例如，你可以修改上一个任务中的 `adder()` 函数，使其返回一个包含传递给它的两个值的和的整数值，如下所示：\n\
    \n```c\nint adder(int x, int y)\n```\n\n为了实际返回传递给 `adder()` 函数的两个值的和，你需要使用 `return`\
    \ 语句：\n\n```c\nint adder(int x, int y)\n{\n    return x + y;\n}\n```\n\n它的原理是：要从函数返回值，你需要在\
    \ `return` 关键字之后放置你想要返回的值。现在，当你调用 `adder()` 函数并向该函数传递数据时，调用本身将用函数的返回值所替换。因此，为了将\
    \ 5 加 10 并显示结果，你可以使用以下代码：\n\n```c\nint value1 = 5, value2 = 10;\nprintf(\"%i +\
    \ %i = %i\", value1, value2, adder(value1, value2));\n```\n"
