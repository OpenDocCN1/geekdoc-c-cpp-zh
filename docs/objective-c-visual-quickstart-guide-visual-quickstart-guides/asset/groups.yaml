- md: "\n## Managing Memory in Objective-C\n\n### Performing Deallocation\n\n####\
    \ Deallocating Memory: Yourself\n\nThis task completes the examples illustrating\
    \ how to release internal memory for custom objects. Here, you actually release\
    \ the internally stored objects when the whole object is deallocated.\n\n**to\
    \ deallocate internal memory:**\n\n1. Open friends.m.\n2. Add the code to release\
    \ the internal strings when the complete Friend object is deallocated (**Listing\
    \ 10.19**).\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \n@interface Friend : NSObject\n{\n    NSString *firstName;\n    NSString *lastName;\n\
    }\n\n-(Friend*)initWithName:(NSString*)first lastName:(NSString*)last;\n-(void)setName:(NSString*)first\
    \ lastName:(NSString*)last;\n-(void)setFirst:(NSString*)first;\n-(void)setLast:(NSString*)last;\n\
    -(void)print;\n\n@end\n\n@implementation Friend\n\n-(Friend*)initWithName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    self = [super init];\n    if (self) {\n   \
    \     [self setName:first lastName:last];\n    }\n    return self;\n}\n\n-(void)setName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    [self setFirst:first];\n    [self setLast:last];\n\
    }\n\n-(void)setFirst:(NSString*)first\n{\n    [first retain];\n    [firstName\
    \ release];\n    firstName = first;\n}\n```\n\n**Listing 10.19** Editing friends.m.\n\
    \n3. Save friends.m.\n4. Run the friends.m program. You should see the following:\n\
    \nYour friend’s name is Dan Green\nThe Friends object is deallocated, and its\
    \ internally stored objects, first and last, are released.\n\n```objectivec\n\
    -(void)setLast:(NSString*)last\n{\n    [last retain];\n    [lastName release];\n\
    \    lastName = last;\n}\n\n-(void)print\n{\n    printf(\"Your friend’s name is\
    \ %s %s\", [firstName cString], [lastName cString]);\n}\n\n-(void) dealloc\n{\n\
    \    [firstName release];\n    [lastName release];\n    [super dealloc];\n}\n\n\
    @end\n\nint main(void)\n{\n    NSString *first = [NSString alloc] initWithString:@\"\
    Dan\"];\n    NSString *last = [NSString alloc] initWithString:@\"Green\"];\n \
    \   Friend *dan = [Friend alloc] initWithWithName:first lastName:last];\n    [first\
    \ release];\n    [last release];\n    [dan print];\n    [dan release];\n    return\
    \ 0;\n}\n```\n**Listing 10.19** continued\n\n## Exception Handling\n\nErrors are\
    \ a fact of life. Even the most perfect programmer has code that creates run-time\
    \ errors at times. This chapter is about handling such cases. You’ll commonly\
    \ encounter two kinds of errors: compile-time errors and run-time errors. Compile-time\
    \ errors are those raised by the compiler, and you have to fix those before you\
    \ continue with your program. Run-time errors happen at run-time, even though\
    \ your code compiled fine. Run-time errors are commonly called exceptions. Objective-C\
    \ can handle exceptions, but the way it does so varies by platform. In this chapter,\
    \ we’ll use the GNUstep way of handling exceptions, which is the most common.\
    \ Here, you use macros like NS_DURING and NS_HANDLER to handle exceptions when\
    \ they happen. For example, this code creates a custom exception and reports on\
    \ it:\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main( )\n{\n    AutoreleasePool *pool = [AutoreleasePool alloc]init];\n\
    \    NS_DURING\n    {\n        NSException *myException = [NSException alloc]\
    \ initWithName:@\"MyException\" reason:@\"Meltdown!\" userInfo:nil];\n       \
    \ [myException raise];\n        [pool release];\n    }\n    NS_HANDLER\n    {\n\
    \        printf(\"In error handler.\\n\");\n        if ([localException name]\
    \ isEqualToString:@\"MyException\"]) {\n            printf(\"Meltdown error.\\\
    n\");\n        }\n    }\n    NS_ENDHANDLER\n    {\n        printf(\"In end handler.\"\
    );\n    }\n    return 0;\n}\n```\n\n### Catching Exceptions\n\nWhenever your code\
    \ may cause an exception—for example, by dividing by zero—you can enclose it in\
    \ a NS_DURING macro like this:\n\n```objectivec\nNS_DURING\n{\n    /*Sensitive\
    \ code]*/\n}\n```\n\nThis is the first step in GNUstep exception handling: any\
    \ exceptions that happen inside an NS_DURING macro can be handled in an NS_HANDLER\
    \ macro, which is covered in the next task.\n\n**to catch exceptions:**\n\n1.\
    \ Create a program named **main.m**.\n2. In main.m, enter the code shown in **Listing\
    \ 11.1**. This code creates an NS_DURING block.\n3. Add your exception-prone code\
    \ to the NS_DURING block (**Listing 11.2**).\n4. Save main.m.\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n\
    \    {\n        .\n        .\n    }\n    return 0;\n}\n```\n**Listing 11.1** Starting\
    \ main.m.\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main( )\n{\n    NS_DURING\n    {\n        [Sensitive code]\n    }\n    return\
    \ 0;\n}\n```\n**Listing 11.2** The main.m program.\n\n### Handling Exceptions\n\
    \nWhen an exception occurs, you can handle that exception in an NS_HANDLER macro—that’s\
    \ where you place your exception-handling code, as you’ll see in this task.\n\n\
    **to handle exceptions:**\n\n1. Create a program named main.m.\n2. In main.m,\
    \ enter the code in **Listing 11.3**. This code creates the NS_DURING macro.\n\
    3. Enter the code to add the NS_HANDLER macro, which runs when an exception occurs\
    \ (**Listing 11.4**).\n4. Save main.m.\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n    {\n        .\n       \
    \ .\n    }\n    return 0;\n}\n```\n**Listing 11.3** Starting main.m.\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n\
    \    {\n        .\n        .\n        .\n    }\n    NS_HANDLER\n    {\n      \
    \  .\n        .\n        .\n    }\n    return 0;\n}\n```\n**Listing 11.4** The\
    \ main.m program.\n\n### Using the End Handler\n\nYou can handle exceptions in\
    \ the NS_HANDLER block. After the code in the NS_HANDLER runs, you can have the\
    \ code in another block, the NS_ENDHANDLER block, run, giving you a chance to\
    \ add cleanup code.\n\n**to use the end handler:**\n\n1. Create a new program\
    \ named main.m.\n2. In main.m, enter the code shown in **Listing 11.5**. This\
    \ code creates the NS_DURING and NS_HANDLER blocks.\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n\
    \    {\n        .\n        .\n        .\n    }\n    NS_HANDLER\n    {\n      \
    \  .\n        .\n        .\n    }\n    return 0;\n}\n```\n**Listing 11.5** Starting\
    \ main.m.\n\n3. Enter the code to add the NS_ENDHANDLER block for code you want\
    \ executed after the NS_HANDLER block (**Listing 11.6**).\n4. Save main.m.\n\n\
    ```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(\
    \ )\n{\n    NS_DURING\n    {\n        .\n        .\n        .\n    }\n    NS_HANDLER\n\
    \    {\n        .\n        .\n        .\n    }\n    NS_ENDHANDLER\n    {\n   \
    \     .\n        .\n        .\n    }\n    return 0;\n}\n```\n**Listing 11.6**\
    \ The main.m program.\n\n### Creating an Exception\n\nNow you’ll cause an exception\
    \ so you can handle it and confirm your code works. In this task, you’ll create\
    \ an exception object; you’ll raise that exception, which causes the exception\
    \ to actually occur. After that, you can catch and handle the exception.\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    AutoreleasePool\
    \ *pool = [AutoreleasePool alloc]init];\n    NS_DURING\n    {\n        NSException\
    \ *myException = [NSException alloc] initWithName:@\"MyException\" reason:@\"\
    Meltdown!\" userInfo:nil];\n        [myException raise];\n        [pool release];\n\
    \    }\n    NS_HANDLER\n    {\n        printf(\"In error handler.\\n\");\n   \
    \     if ([localException name] isEqualToString:@\"MyException\"]) {\n       \
    \     printf(\"Meltdown error.\\n\");\n        }\n    }\n    NS_ENDHANDLER\n \
    \   {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n**Listing\
    \ 11.7** Starting main.m.\n"
  mdcn: "\n\n## 在 Objective-C 中管理内存\n\n### 执行释放内存\n\n#### 释放内存：你自己\n\n此任务将完成说明如何释放自定义对象内部内存的示例。在这里，当整个对象被\
    \ dealloc 时，你实际上释放了内部存储的对象。\n\n**要释放内部内存：**\n\n1. 打开 friends.m。\n2. 添加代码以在完整的\
    \ Friend 对象被 dealloc 时释放内部字符串（**列表 10.19**）。\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\n@interface Friend : NSObject\n{\n    NSString *firstName;\n\
    \    NSString *lastName;\n}\n\n-(Friend*)initWithName:(NSString*)first lastName:(NSString*)last;\n\
    -(void)setName:(NSString*)first lastName:(NSString*)last;\n-(void)setFirst:(NSString*)first;\n\
    -(void)setLast:(NSString*)last;\n-(void)print;\n\n@end\n\n@implementation Friend\n\
    \n-(Friend*)initWithName:(NSString*)first lastName:(NSString*)last\n{\n    self\
    \ = [super init];\n    if (self) {\n        [self setName:first lastName:last];\n\
    \    }\n    return self;\n}\n\n-(void)setName:(NSString*)first lastName:(NSString*)last\n\
    {\n    [self setFirst:first];\n    [self setLast:last];\n}\n\n-(void)setFirst:(NSString*)first\n\
    {\n    [first retain];\n    [firstName release];\n    firstName = first;\n}\n\
    ```\n\n**列表 10.19** 编辑 friends.m。\n\n3. 保存 friends.m。\n4. 运行 friends.m 程序。你应该看到以下内容：\n\
    \n你的朋友的名字是 Dan Green\nFriends 对象已被 dealloc，其内部存储的对象 first 和 last 已被释放。\n\n```objectivec\n\
    -(void)setLast:(NSString*)last\n{\n    [last retain];\n    [lastName release];\n\
    \    lastName = last;\n}\n\n-(void)print\n{\n    printf(\"Your friend’s name is\
    \ %s %s\", [firstName cString], [lastName cString]);\n}\n\n-(void) dealloc\n{\n\
    \    [firstName release];\n    [lastName release];\n    [super dealloc];\n}\n\n\
    @end\n\nint main(void)\n{\n    NSString *first = [NSString alloc] initWithString:@\"\
    Dan\"];\n    NSString *last = [NSString alloc] initWithString:@\"Green\"];\n \
    \   Friend *dan = [Friend alloc] initWithWithName:first lastName:last];\n    [first\
    \ release];\n    [last release];\n    [dan print];\n    [dan release];\n    return\
    \ 0;\n}\n```\n**列表 10.19** 继续\n\n## 异常处理\n\n错误是生活中的常态。即使是最完美的程序员，有时也会编写产生运行时错误的代码。本章将关于处理此类情况。你通常会遇到两种错误：编译时错误和运行时错误。编译时错误是由编译器抛出的，你必须在继续运行程序之前修复它们。运行时错误发生在运行时，即使你的代码编译无误。运行时错误通常被称为异常。Objective-C\
    \ 可以处理异常，但其处理方式随平台而异。在本章中，我们将使用 GNUstep 的异常处理方式，这是最常用的方法。在这里，你使用诸如 NS_DURING 和\
    \ NS_HANDLER 等宏在异常发生时对其进行处理。例如，这段代码创建了一个自定义异常并对其进行报告：\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    AutoreleasePool\
    \ *pool = [AutoreleasePool alloc]init];\n    NS_DURING\n    {\n        NSException\
    \ *myException = [NSException alloc] initWithName:@\"MyException\" reason:@\"\
    Meltdown!\" userInfo:nil];\n        [myException raise];\n        [pool release];\n\
    \    }\n    NS_HANDLER\n    {\n        printf(\"In error handler.\\n\");\n   \
    \     if ([localException name] isEqualToString:@\"MyException\"]) {\n       \
    \     printf(\"Meltdown error.\\n\");\n        }\n    }\n    NS_ENDHANDLER\n \
    \   {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n\n\
    ### 捕获异常\n\n当你的代码可能导致异常时（例如除以零），你可以将其封装在 NS_DURING 宏中，如下所示：\n\n```objectivec\n\
    NS_DURING\n{\n    /*Sensitive code]*/\n}\n```\n\n这是 GNUstep 异常处理的第一步：在 NS_DURING\
    \ 宏内部发生的任何异常都可以在 NS_HANDLER 宏中处理，将在下一个任务中介绍。\n\n**要捕获异常：**\n\n1. 创建一个名为 **main.m**\
    \ 的程序。\n2. 在 main.m 中输入**列表 11.1** 所示的代码。这段代码创建了一个 NS_DURING 块。\n3. 将你容易异常的代码添加到\
    \ NS_DURING 块中（**列表 11.2**）。\n4. 保存 main.m。\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n    {\n        .\n       \
    \ .\n    }\n    return 0;\n}\n```\n**列表 11.1** 开始 main.m。\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n\
    \    {\n        [Sensitive code]\n    }\n    return 0;\n}\n```\n**列表 11.2** main.m。\n\
    \n### 处理异常\n\n当异常发生时，你可以在 NS_HANDLER 宏中处理它，正如你在任务中将看到的那样。\n\n**处理异常：**\n\n1. 创建一个名为\
    \ main.m 的程序。\n2. 在 main.m 中输入**列表 11.3** 所示的代码。这段代码创建了 NS_DURING 块。\n3. 添加 NS_HANDLER\
    \ 宏来处理发生的异常（**列表 11.4**）。\n4. 保存 main.m。\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n    {\n        .\n       \
    \ .\n    }\n    return 0;\n}\n```\n**列表 11.3** 开始 main.m。\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n\
    \    {\n        .\n        .\n    }\n    NS_HANDLER\n    {\n        .\n      \
    \  .\n    }\n    return 0;\n}\n```\n**列表 11.4** main.m 程序。\n\n### 使用结束处理器\n\n\
    你可以在 NS_ENDHANDLER 块中处理异常。在 NS_HANDLER 块执行后，该块会运行，让你有机会清理。\n\n**使用结束处理器：**\n\n\
    1. 创建一个新的名为 main.m 的程序。\n2. 在 main.m 中输入**列表 11.5** 所示的代码。这段代码包含了 NS_DURING 和\
    \ NS_HANDLER 块。\n3. 添加 NS_ENDHANDLER 块，用于你想在 NS_HANDLER 块执行后运行的代码（**列表 11.6**）。\n\
    4. 保存 main.m。\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main( )\n{\n    NS_DURING\n    {\n        .\n        .\n        .\n    }\n\
    \    NS_HANDLER\n    {\n        .\n        .\n        .\n    }\n    return 0;\n\
    }\n```\n**列表 11.5** 开始 main.m。\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main( )\n{\n    NS_DURING\n    {\n        .\n       \
    \ .\n        .\n    }\n    NS_HANDLER\n    {\n        .\n        .\n        .\n\
    \    }\n    NS_ENDHANDLER\n    {\n        .\n        .\n        .\n    }\n   \
    \ return 0;\n}\n```\n**列表 11.6** main.m 程序。\n\n### 创建异常\n\n现在你将引发异常以便处理它并确认你的代码正常。在此任务中，你将创建一个异常对象；你将抛出该异常，导致异常实际发生。之后，你可以捕获并处理该异常。\n\
    \n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(\
    \ )\n{\n    AutoreleasePool *pool = [AutoreleasePool alloc]init];\n    NS_DURING\n\
    \    {\n        NSException *myException = [NSException alloc] initWithName:@\"\
    MyException\" reason:@\"Meltdown!\" userInfo:nil];\n        [myException raise];\n\
    \        [pool release];\n    }\n    NS_HANDLER\n    {\n        printf(\"In error\
    \ handler.\\n\");\n        if ([localException name] isEqualToString:@\"MyException\"\
    ]) {\n            printf(\"Meltdown error.\\n\");\n        }\n    }\n    NS_ENDHANDLER\n\
    \    {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n**列表\
    \ 11.7** 开始 main.m。\n\n"
