    \ 的 break 语句：\n\n1. 创建名为 **break.m** 的新程序。\n2. 在 break.m 中，输入**列表 2.19** 所示的代码。此代码会打印从\
    \ -1/5 到 1/5 的倒数，但对 1/0 会报告错误。\n3. 添加代码在尝试除以 0 之前中断循环执行（**列表 2.20**）。\n4. 保存 break.m。\n\
    5. 运行 break.m 程序。你应该能看到以下内容：\n\n1/5.0 = 0.200000\n1/4.0 = 0.250000\n1/3.0 = 0.333333\n\
    1/2.0 = 0.500000\n1/1.0 = 1.000000\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    float loop_index;\n    for (loop_index = 5; loop_index > -5; loop_index--)\n\
    \    {\n        printf(\"1/%2.1f = %10.6f\\n\", loop_index, 1.0/loop_index);\n\
    \    }\n    return 0;\n}\n```\n**列表 2.19** 开始 break.m。\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    float loop_index;\n    for (loop_index = 5; loop_index\
    \ > -5; loop_index--)\n    {\n        if (loop_index == 0.0) {\n            break;\n\
    \        }\n        printf(\"1/%2.1f = %10.6f\\n\", loop_index, 1.0/loop_index);\n\
    \    }\n    return 0;\n}\n```\n**列表 2.20** break.m 程序。\n\n## 第 3 章\n\n### 数据处理\n\
    \n本章完全关于在 Objective-C 中处理数据。你将使用数组、指针等更多内容。\n\n数组是一组数据项（称为元素），你可以通过索引来引用它们。例如，如果你将数字存储在名为\
    \ `array` 的数组中，你可以这样使用索引访问每个元素：`array[0]` 指向第一个元素；`array[1]` 指向第二个元素；依此类推。以下代码创建了一个包含五个元素的数组，在\
    \ `array[0]` 中存储值为 5，然后显示该值：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n\
    \    int array[5];\n    array[0] = 5;\n    printf(\"array[0] is %i.\\n\", array[0]);\n\
    \    return 0;\n}\n```\n\n指针是存储数据项地址的特殊变量。你可以使用 `&` 运算符将名为 `integer` 的变量地址存储在指针中，例如：`pointer\
    \ = &integer;`。你可以像这样通过 `*pointer` 引用 `integer` 的值：\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int integer, *pointer;\n    integer = 1;\n    pointer\
    \ = &integer;\n    *pointer = 2;\n    printf(\"The value of the integer is: %i\"\
    , pointer);\n    return 0;\n}\n```\n\n指针在 Objective-C 中非常，因为你用它们来创建对象。例如，Objective-C\
    \ 中的文本字符串通常是 `NSString` 对象（“NS”部分代表 NeXT）。\n\n"
