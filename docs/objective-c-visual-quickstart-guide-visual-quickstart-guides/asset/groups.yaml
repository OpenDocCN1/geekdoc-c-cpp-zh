- md: "\n# Chapter 10\n\n## Using an Autorelease Pool\n\nIf you use alloc or new to\
    \ create an object, you’re responsible for managing the object’s memory yourself\
    \ (if memory is a concern). But for objects that you don’t create with alloc or\
    \ new, you can have Objective-C manage them for you using an autorelease pool.\n\
    \nJust create a pool object, and the objects will be placed in it automatically.\
    \ At the end of the program, you have only to release the pool to release all\
    \ the objects.\n\n### to use an autorelease pool:\n\n1. Create a file named **pool.m**.\n\
    2. In pool.m, enter the code shown in **Listing 10.11**. This code creates the\
    \ pool and a pool-managed object: string1.\n3. Add the code to print the object’s\
    \ retain count and release the pool when the program ends (**Listing 10.12**).\n\
    4. Save pool.m.\n5. Run the pool.m program. You should see the following:\n`Pool-managed\
    \ string’s retain count: 1`\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool\
    \ alloc];\n    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"\
    ];\n}\n```\n**Listing 10.11 pool.m.**\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool\
    \ alloc];\n    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"\
    ];\n    printf(\"%s’s retain count: %x\\n\", [string1 cString], [string1 retainCount]);\n\
    \    [pool release];\n    return 0;\n}\n```\n**Listing 10.12 The pool.m.**\n\n\
    # Managing Memory in Objective-C\n\n## Using Self-Managed Memory\n\nIf you create\
    \ objects using alloc or new, you’re responsible for managing their memory (if\
    \ memory is a concern). That means when you’re done with an object and want to\
    \ release its memory, it’s up to you to do so until its retain count reaches zero\
    \ and Objective-C deallocates it.\n\nIn this task, you’ll add a self-managed object\
    \ to the previous task’s pool.m so you can compare procedures for self-managed\
    \ memory and pool-managed memory.\n\n### to use self-managed memory for an object:\n\
    \n1. Open pool.m.\n2. Add the code to create a self-managed string (**Listing\
    \ 10.13**).\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool alloc];\n\
    \    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"];\n   \
    \ NSString *string2 = [[NSString alloc] initWithString:@\"Self-managed string\"\
    ];\n    printf(\"%s’s retain count: %x\\n\", [string1 cString], [string1 retainCount]);\n\
    \    [pool release];\n    return 0;\n}\n```\n**Listing 10.13 Editing pool.m.**\n\
    \n3. Add the code to print the self-managed string’s retain count and release\
    \ the object (**Listing 10.14**).\n4. Save pool.m.\n5. Run the edited pool.m program.\
    \ You should see the following:\n`Pool-managed string’s retain count: 1`\n`Self-managed\
    \ string’s retain count: 1`\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool\
    \ alloc];\n    NSString *string1 = [NSString stringWith:@\"Pool-managed string\"\
