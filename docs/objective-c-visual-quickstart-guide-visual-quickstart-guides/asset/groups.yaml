    \n*conditional* ? *expression1* : *expression2*;\n\nObjective-C 评估 *conditional*（条件），如果它为真，则执行\
    \ *expression1*；如果为假，则执行 *expression2*。该运算符返回的值是被执行的表达式的值。例如，你可能想将温度限制在 72 度，如果大于\
    \ 72 度，则将其设置为 72 度。以下是条件运算符实现的方法：\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n   int temperature = 78;\n   temperature = temperature > 72 ? 72 : temperature;\n\
    \   printf(\"The temperature is %i.\\n\", temperature);\n   return 0;\n}\n```\n\
