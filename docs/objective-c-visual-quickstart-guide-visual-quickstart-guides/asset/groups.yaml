    \n## 限制访问权限\n\n3. 添加派生类中访问受保护成员的代码（**列表 7.16**）。\n4. 保存 protected.m。\n5. 运行 protected.m\
    \ 程序。你应该看到以下内容：\nprotected variable is 5.\n\n```objectivec\n#import <stdio.h>\n\
