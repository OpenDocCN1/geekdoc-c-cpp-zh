    int adder(int x, int y)\n{\n    return x + y;\n}\n```\n**列表 4.7** 开始 functionreturn.m。\n\
    \n```c\n#include <stdio.h>\nint adder(int x, int y)\n{\n    return x + y;\n}\n\
    \nint main()\n{\n    int value1 = 5, value2 = 10;\n    printf(\"%i + %i = %i\"\
    , value1, value2, adder(value1, value2));\n    return 0;\n}\n```\n**列表 4.8** functionreturn.m\
    \ 程序。\n\n### 使用函数作用域\n\n作用域是指数据可见的范围。函数定义了它们自己的作用域。也就是说，当你在函数中定义变量时，它变成了该函数的局部变量，并优于相同变量的其他版本。例如，你可以像这样定义一个名为\
    \ `number` 的整数并将其设置为 1：\n\n```c\nint number = 1;\n```\n\n然后，你还可以在函数内部定义一个名为 `number`\
    \ 的整数：\n\n```c\nint number = 1;\nvoid function(void)\n{\n    int number = 2;\n\
    \    printf(\"In the function the number is %i\\n\", number);\n}\n```\n\n`number`\
    \ 的局部版本在函数中具有高优先级，因此这里的 `printf()` 语句将显示 `number` 的值为 2。如果 `number` 没有在函数中局部定义，则将使用来自函数外部的版本，`printf()`\
    \ 语句将显示值为 1。在 Objective-C 中，任何代码块——即包含在花括号中的代码，如函数体或 if 语句体——都定义了自己的自己的作用域，因此局部变量始终优于定义在代码块外的变量。\n\
    \n要使用函数作用域：\n\n1. 创建一个名为 **functionscope.m** 的新程序。\n2. 在 functionscope.m 中，输入**列表\
    \ 4.9** 所示的代码。此代码声明了一个名为 `number` 的整数并在 `main()` 中显示其值，然后调用了一个函数。\n\n```c\n#include\
    \ <stdio.h>\nvoid function(void);\nint number = 1;\nint main()\n{\n    printf(\"\
    In main the number is %i\\n\", number);\n    function();\n    return 0;\n}\n```\n\
    **列表 4.9** 开始 functionscope.m。\n\n3. 添加在局部以及代码块中都重新定义 `number` 的函数（**列表 4.10**）。\n\
    4. 保存 functionscope.m。\n5. 运行 functionscope.m 程序。你应该能看到以下内容：\n\nIn main the number\
    \ is 1\nIn the function the number is 2\nIn the block the number is 3\nAfter the\
    \ block the number is 2\n\n```c\n#include <stdio.h>\nvoid function(void);\nint\
    \ number = 1;\nint main()\n{\n    printf(\"In main the number is %i\\n\", number);\n\
    \    function();\n    return 0;\n}\n\nvoid function(void)\n{\n    int number =\
    \ 2;\n    printf(\"In the function number is %i\\n\", number);\n    {\n      \
    \  int number = 3;\n        printf(\"In the block number is %i\\n\", number);\n\
    \    }\n    printf(\"After the block number is %i\\n\", number);\n}\n```\n**列表\
    \ 4.10** functionscope.m 程序。\n\n### 向函数传递指针\n\n当你向函数传递指针时，该函数可以使用该指针更改调用代码中的数据。例如，这里有一个将指针传递给函数以更改变量的示例：\n\
    \n```c\nint data = 1;\nint *datapointer = &data;\nprintf(\"Before changer(), data\
    \ = %i\\n\", data);\nchanger(datapointer);\nprintf(\"After changer(), data = %i\\\
    n\", data);\n\nvoid changer(int *pointer)\n{\n    *pointer = 2;\n}\n```\n\n要向函数传递指针：\n\
    \n1. 创建一个名为 **functionpointers.m** 的新程序。\n2. 在 functionpointers.m 中，输入**列表 4.11**\
    \ 所示的代码。此代码将一个指针传递给名为 `changer()` 的函数。\n\n```c\n#include <stdio.h>\nvoid changer(int\
    \ *);\nint main()\n{\n    int data = 1;\n    int *datapointer = &data;\n    printf(\"\
    Before changer(), data = %i\\n\", data);\n    changer(datapointer);\n    printf(\"\
    After changer(), data = %i\\n\", data);\n    return 0;\n}\n```\n**列表 4.11** 开始\
    \ functionpointers.m。\n\n3. 添加 `changer()` 函数的代码，它可以更改数据（**列表 4.12**）。\n4. 保存\
    \ functionpointers.m。\n5. 运行 functionpointers.m 程序。你应该能看到以下内容：\n\nBefore changer(),\
    \ data = 1\nAfter changer(), data = 2\n\n```c\n#include <stdio.h>\nvoid changer(int\
    \ *);\nint main()\n{\n    int data = 1;\n    int *datapointer = &data;\n    printf(\"\
    Before changer(), data = %i\\n\", data);\n    changer(datapointer);\n    printf(\"\
    After changer(), data = %i\\n\", data);\n    return 0;\n}\n\nvoid changer(int\
    \ *pointer)\n{\n    *pointer = 2;\n}\n```\n**列表 4.12** functionpointers.m 程序。\n\
    \n### 向函数传递数组\n\n向函数传递数组：\n\n1. 创建一个名为 **functionarrays.m** 的新程序。\n2. 在 functionarrays.m\
    \ 中，输入**列表 4.13** 所示的代码。此代码创建了一个数组并将其传递传递给名为 `adder()` 的函数。\n\n```c\n#include\
    \ <stdio.h>\nlong adder(int array[], int number_elements);\nint main()\n{\n  \
    \  int data[] = {1, 2, 3, 4};\n    int total = adder(data, sizeof(data)/sizeof(int));\n\
    \    printf(\"The total is %i\\n\", total);\n    return 0;\n}\n```\n**列表 4.13**\
    \ 开始 functionarrays.m。\n\n3. 添加 `adder()` 函数的代码（**列表 4.14**）。\n4. 保存 functionarrays.m。\n\
    5. 运行 functionarrays.m 程序。你应该能看到以下内容：\n\nThe total is 10\n\n```c\n#include <stdio.h>\n\
    long adder(int array[], int number_elements);\nint main()\n{\n    int data[] =\
    \ {1, 2, 3, 4};\n    int total = adder(data, sizeof(data)/sizeof(int));\n    printf(\"\
    The total is %i\\n\", total);\n    return 0;\n}\n\nlong adder(int array[], int\
    \ number_elements)\n{\n    long sum = 0;\n    int loop_index;\n    for (loop_index\
    \ = 0; loop_index < number_elements; loop_index++)\n        sum = sum + array[loop_index];\n\
    \    return sum;\n}\n```\n**列表 4.14** functionarrays.m 程序。\n\n### 向函数传递常量数据\n\n\
    众所周知，如果你向函数传递指针，这些函数就可以更改指针所指向的数据。由于数组可以兼作指针，如果你在函数中作为指针传递数组，该函数就会更改你的原始数组。为了避免这种情况，当你将数组的副本传递给函数时，将其标记为常量以便其被更改。你使用\
    \ `const` 关键字将数据标记为常量：\n\n```c\nint data[] = {1, 2, 3, 4};\nint total = adder(data,\
    \ sizeof(data)/sizeof(int));\nprintf(\"The total is %i\\n\", total);\n\nlong adder(const\
    \ int array[], int number_elements)\n{\n    long sum = 0;\n    int loop_index;\n\
    \    for(loop_index = 0; loop_index < number_elements; loop_index++)\n       \
    \ sum = sum + array[loop_index];\n    return sum;\n}\n```\n\n在本任务中，我们将修改上任务的代码以使用常量数组。\n\
    \n向函数传递常量数组：\n\n1. 创建一个名为 **functionpassconstarrays.m** 的新程序。\n2. 在 functionpassconstarrays.m\
