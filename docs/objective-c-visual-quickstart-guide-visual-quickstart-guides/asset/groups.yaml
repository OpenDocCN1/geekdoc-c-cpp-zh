  - "[PAGE 217]\n\nException Handling\n\n**209**\n\n**Creating an Exception**\n\n\
    **Creating an Exception **\n\nNow you’ll cause an exception to occur so \n\nyou\
    \ can handle it and confirm that your code \n\nworks as expected.\n\nIn this task,\
    \ you’ll create an exception object; \n\nthen you’ll raise that exception, which\
    \ causes \n\nthe exception to actually occur. After that, \n\nyou can catch and\
    \ handle the exception.\n\n**to create an exception:**\n\n**1.** Create a new\
    \ program named **main.m**.\n\n**2.** In main.m, enter the code shown in \n\n\
    **Listing 11.7**. \n\nThis code creates an exception object and \n\nraises the\
    \ exception.\n\n*continues on next page*\n\n#import <Foundation/Foundation.h>\n\
    \n#import <stdio.h>\n\nint main( ) \n\n{\n\n  NSAutoreleasePool \\*pool = \n\n\
        \\[\\[NSAutoreleasePool alloc\\] init\\];\n\nNS\\_DURING\n\n{\n\n  NSException \\\
    *myException = \n\n    \\[\\[NSException \n\n    alloc\\] initWithName: @”MyException”\n\
    \n     reason: @”Meltdown!” userInfo: nil\\];\n\n  \\[myException raise\\];\n\n\
      \\[pool release\\];\n\n}\n\nNS\\_HANDLER\n\n{\n\n        .\n\n        .\n\n\
            .\n\n}\n\nNS\\_ENDHANDLER\n\n{\n\n        .\n\n        .\n\n        .\n\
    \n}\n\nreturn 0;\n\n}\n\n**Listing 11.7 **Starting main.m.\n\n From the Library\
    \ of Wow! eBook"
- md: "\n## Chapter 11\n\n## Creating an Exception\n\n3. Add the code to display a\
    \ message from the exception handler and the exception end handler (**Listing\
    \ 11.8**).\n4. Save main.m.\n5. Run the main.m program. \n\nYou should see the\
    \ following:\nIn error handler.\nIn end handler.\n\n```objc\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main()\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NS_DURING\n    {\n        NSException *myException = [[NSException\
    \ alloc] initWithName:@\"MyException\"\n            reason:@\"Meltdown!\" userInfo:nil];\n\
    \        [myException raise];\n        [pool release];\n    }\n    NS_HANDLER\n\
    \    {\n        printf(\"In error handler.\\n\");\n    }\n    NS_ENDHANDLER\n\
    \    {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n**Listing\
    \ 11.8** The main.m program.\n\n## Checking What Exception Occurred\n\nIn exception-handling\
    \ blocks, you can refer to the exception that occurred as localException, an object\
    \ built into Objective-C. Then you can find its name by sending it the name message—and\
    \ so determine what exception occurred. In this task, you’ll determine what exception\
    \ occurred and display a message to match.\n\n**to determine what exception occurred:**\n\
    \n1. Create a new program named **main.m**.\n2. In main.m, enter the code shown\
    \ in **Listing 11.9**. This entry creates the exception and the exception-handling\
    \ code.\n\n```objc\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint\
    \ main()\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NS_DURING\n    {\n        NSException *myException = [[NSException alloc]\
    \ initWithName:@\"MyException\"\n            reason:@\"Meltdown!\" userInfo:nil];\n\
    \        [myException raise];\n        [pool release];\n    }\n    NS_HANDLER\n\
    \    {\n        printf(\"In error handler.\\n\");\n    }\n    NS_ENDHANDLER\n\
    \    {\n        printf(\"In end handler.\");\n    }\n    return 0;\n}\n```\n**Listing\
    \ 11.9** Starting main.m.\n\n3. Enter the code to check the name of the exception\
    \ and display it (**Listing 11.10**).\n4. Save main.m.\n5. Run the main.m program.\
    \ \n\nYou should see the following:\nIn error handler.\nMeltdown error.\nIn end\
    \ handler.\n\n```objc\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\n\
    int main()\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NS_DURING\n    {\n        NSException *myException = [[NSException alloc]\
    \ initWithName:@\"MyException\"\n            reason:@\"Meltdown!\" userInfo:nil];\n\
    \        [myException raise];\n        [pool release];\n    }\n    NS_HANDLER\n\
    \    {\n        printf(\"In error handler.\\n\");\n        if ([localException\
    \ isEqualToString:@\"MyException\"]) {\n            printf(\"Meltdown error.\\\
    n\");\n        }\n    }\n    NS_ENDHANDLER\n    {\n        printf(\"In end handler.\"\
    );\n    }\n    return 0;\n}\n```\n**Listing 11.10** The main.m program.\n\n##\
    \ Handling Multiple Exceptions\n\nTo check for multiple exceptions, you use if/else\
    \ in the NS_HANDLER block.\n\n1. Create a file named **main.m**.\n2. In main.m,\
    \ enter the code shown in **Listing 11.11**. This checks for multiple exceptions.\n\
    \n```objc\nNS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"\
    Exception1\"]) {\n    } else if ([localException isEqualToString:@\"Exception2\"\
    ]) {\n    }\n}\nNS_ENDHANDLER\n```\n**Listing 11.11** Starting main.m.\n\n3. Enter\
    \ the code to add an else block (**Listing 11.12**). You’ll use this block in\
    \ a later task to pass any uncaught exceptions up the call stack.\n4. Save main.m.\n\
    \n```objc\nNS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"\
    Exception1\"]) {\n    } else if ([localException isEqualToString:@\"Exception2\"\
    ]) {\n    } else {\n        .\n    }\n}\nNS_ENDHANDLER\n```\n**Listing 11.12**\
    \ The main.m program.\n\n## Passing Exceptions Up the Call Stack\n\nSometimes\
    \ when you’re handling exceptions, you’ll want to pass the exceptions back up\
    \ the call stack to the exception-handling code in a calling function. You can\
    \ do that simply by raising the exception again in the NS_HANDLER block, as you’ll\
    \ do in this task.\n\n**to pass exceptions up the call stack:**\n\n1. Create a\
    \ new file named **main.m**.\n2. In main.m, enter the code shown in **Listing\
    \ 11.13**. This sets up a framework to handle multiple exceptions.\n\n```objc\n\
    NS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"Exception1\"\
    ]) {\n    } else if ([localException isEqualToString:@\"Exception2\"]) {\n   \
    \ } else {\n        [localException raise];\n    }\n}\nNS_ENDHANDLER\n```\n**Listing\
    \ 11.13** Starting main.m.\n\n3. Add the code to pass an uncaught exception back\
    \ up the call stack by raising it (**Listing 11.14**).\n4. Save main.m.\n\n```objc\n\
    NS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"Exception1\"\
    ]) {\n    } else if ([localException isEqualToString:@\"Exception2\"]) {\n   \
    \ } else {\n        [localException raise];\n    }\n}\n_ENDHANDLER\n```\n**Listing\
    \ 11.14** The main.m program.\n\n## Returning Values from Exception Handlers\n\
    \nIf your exception handler is in a function, you may want to return a value from\
    \ that function—that is, even if an exception occurs in a function, you may still\
    \ want to return a value from that function to the calling code. However, you\
    \ can’t just use the return statement in an exception handler—you have to use\
    \ NS_RETURNVALUE, as you’ll see in this task.\n\n**to return values from an exception\
    \ handler:**\n\n1. Create a file named **main.m**.\n2. In main.m, enter the code\
    \ shown in **Listing 11.15**. This entry sets up exception-handling code for multiple\
    \ exceptions.\n\n```objc\nNS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException\
    \ isEqualToString:@\"Exception1\"]) {\n    } else if ([localException isEqualToString:@\"\
    Exception2\"]) {\n    } else {\n        [localException raise];\n    }\n}\nNS_ENDHANDLER\n\
    ```\n**Listing 11.15** Starting main.m.\n\n3. Add the code to return values from\
    \ the exception handling code (**Listing 11.16**).\n4. Save main.m.\n\n```objc\n\
    NS_DURING\n{\n}\nNS_HANDLER\n{\n    if ([localException isEqualToString:@\"Exception1\"\
    ]) {\n        NS_RETURNVALUE(0);\n    } else if ([localException isEqualToString:@\"\
    Exception2\"]) {\n        NS_RETURNVALUE(1);\n    } else {\n        [localException\
    \ raise];\n    }\n}\nNS_ENDHANDLER\n```\n**Listing 11.16** The main.m program.\n"
