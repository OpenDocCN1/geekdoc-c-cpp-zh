    \ new];\n    printf(\"TheClass count is %i\\n\", [TheClass getCount]);\n    TheClass\
    \ *tc2 = [TheClass new];\n    printf(\"TheClass count is %i\\n\", [TheClass getCount]);\n\
    \    return 0;\n}\n```\n**Listing 6.10** The classvariables.m program with a pointer\
    \ to the current object.\n\n## Creating a Variable for Object Types\n\nIn Objective-C,\
    \ the id type can stand for any type of object. That’s useful when you have one\
    \ variable that you want to contain multiple types of objects. In this task, you\
    \ create objects of two different class types and place them in the same variable\
    \ of type id.\n\n**to use the id type:**\n\n1. Create a new program named id.m.\n\
    2. In id.m, enter the code shown in **Listing 6.11**. This code creates the two\
    \ classes you’ll use.\n\n```objective-c\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\
    \n-(void)print\n{\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n@interface\
    \ Class2 : NSObject\n-(void)print;\n@end\n\n@implementation Class2\n\n-(void)print\n\
    {\n    printf(\"This is Class 2.\\n\");\n}\n@end\n```\n**Listing 6.11** Starting\
    \ id.m.\n"
