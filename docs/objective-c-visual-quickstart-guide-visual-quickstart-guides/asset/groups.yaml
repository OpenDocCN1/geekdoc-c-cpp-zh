    \    printf(\"%s’s retain count: %x\\n\", [string2 cString], [string2 retainCount]);\n\
    \    [string2 release];\n    [pool release];\n    return 0;\n}\n```\n**Listing\
    \ 10.14 The edited pool.m program.**\n\n## Creating the Class\n\nIf you create\
    \ objects of your own classes that store other objects internally, you’re responsible\
    \ for releasing the internal objects when the overall object is deallocated. In\
    \ the remaining tasks in this chapter, you’ll see how this works using an example\
    \ named Friend that internally stores two NSString objects that correspond to\
    \ the friend’s first and last names. When Friend object is deallocated, you’ll\
    \ manually release the two internal strings.\n\n### to create the Friend class:\n\
    \n1. Create a file named **friends.m**.\n2. In friends.m, enter the code shown\
    \ in **Listing 10.15**. This code creates the Friend class and internally stores\
    \ the friend’s first and last names.\n3. Save friends.m.\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Friend : NSObject\n\
    {\n    NSString *firstName;\n    NSString *lastName;\n}\n\n-(id)initWithName:(NSString*)first\
    \ lastName:(NSString*)last;\n-(void)setName:(NSString*)first lastName:(NSString*)last;\n\
    -(void)print;\n@end\n\n@implementation Friend\n\n-(id)initWithName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    self = [super init];\n    if (self) {\n   \
    \     [self setName:first lastName:last];\n    }\n    return self;\n}\n\n-(void)setName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    [self setFirst:first];\n    [self setLast:last];\n\
    }\n\n-(void)print\n{\n    printf(\"friend’s name is %s%s\", [firstName cString],\
