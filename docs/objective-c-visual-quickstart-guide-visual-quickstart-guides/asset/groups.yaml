    \ 方法实现的代码（**列表 8.26**）。\n8. 保存 `ClassSecond.m`。\n\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n#import \"Class1.h\"\n#import \"Class2.h\"\
    \n\n@implementation Class2\n\n@end\n```\n**列表 8.25** 开始 `ClassSecond.m`。\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\
    #import \"Class2.h\"\n\n@implementation Class2\n-(void)print {\n    printf(\"\
    This is Class 2\\n\");\n}\n@end\n```\n**列表 8.26** `ClassSecond.m` 程序。\n\n分类、位置声明与协议\n\
    \n161\n\n## 协议：整合在一起\n\n现在你已经为 `print` 方法定义了协议并在两个类中实现了该方法，你可以创建这些类的对象并调用每个类中的\
    \ `print` 方法：\n\n```objc\nint main(void) {\n    Class1 *c = [Class1 new];\n  \
    \  [c print];\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n    return 0;\n\
    }\n```\n\n每个方法将打印不同的内容，因此虽然协议定义了一个方法的接口，但实际实现取决于使用该方法的类。\n\n**使用协议：**\n\n1. 创建一个名为\
    \ **main.m** 的新程序。\n2. 在 `main.m` 中，输入**列表 8.27** 所示的代码。这段代码创建了第一个类的对象。\n3. 添加创建第二个类对象的代码（**列表\
    \ 8.28**）。\n4. 保存 `main.m`。\n5. 如果你使用的是 Linux、UNIX 或 Windows，创建一个名为 **makefile**\
    \ 的文件。\n6. 运行 `main.m` 程序。\n\n```objc\n#import <stdio.h>\n#import \"Class1.h\"\
    \n\nint main(void) {\n    Class1 *c = [Class1 new];\n    [c print];\n    return\
    \ 0;\n}\n```\n**列表 8.27** 开始 `main.m`。\n\n```objc\n#import <stdio.h>\n#import\
    \ \"Class1.h\"\n#import \"Class2.h\"\n\nint main(void) {\n    Class1 *c = [Class1\
    \ new];\n    [c print];\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n   \
    \ return 0;\n}\n```\n**列表 8.28** `main.m` 程序。\n\n```makefile\nTOOL_NAME=main\n\
    OBJC_FILES=Class1.m ClassSecond.m main.m\n\n$(TOOL_NAME): $(OBJC_FILES)\n\t$(CC)\
    \ $(CFLAGS) -o $(TOOL_NAME) $(OBJC_FILES)\n```\n**列表 8.29** GNUmakefile\n\n分类、位置声明与协议\n\
    \n162\n\n第 9 章\n\n## 数组与字典\n\n在本章，我们将探索 Objective-C 的两个重要特性：数组和字典。你在第 3 章学过 C\
    \ 语言数组。这些数组允许你通过索引处理数据。例如，这里是如何创建一个标准数组并显示关于它的信息：\n\n```c\n#include <stdio.h>\n\
    int main(void) {\n    int scores[5] = {92, 73, 57, 98, 89};\n    printf(\"The\
    \ array is %i elements long.\", sizeof(scores) / sizeof(int));\n    return 0;\n\
    }\n```\n\n在本章中，你将使用带有的 Foundation 类来构建数组。你也可以使用 Foundation 类创建字典。Objective-C 中的字典就像数组，但它使用单词作为索引值，而不是数值。因此，虽然数组可以使用\
    \ 0, 1, 2, 3 等数字进行索引，但字典同样可以使用“banana”、“apple”和“orange”。\n\n此外，你还可以创建可变数组和字典：即可以在代码运行时更改其长度的数组和字典。你将在看到它们是如何工作的。这些以及更多内容在本章介绍，包括：NSArray、NSMutableArray、NSMutableDictionary\
    \ 和 NSDictionary 类，以及其他一些类。\n\n"
