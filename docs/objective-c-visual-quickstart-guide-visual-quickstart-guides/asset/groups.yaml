- md: "\n## Classes and Objects\n\n83\n\n### Creating Objective-C Classes and Objects\n\
    \n3. In the `main()` function, you execute the class methods by sending *class_name*\
    \ the name of the method as a message: `[*class_name class_method_name]`. You\
    \ can also create objects, handled as pointers in Objective-C, with the new message,\
    \ like this: *class_name* *object = [*class_name new]`. Then you can execute object\
    \ methods by sending the object the method name as a message, like this: `[object\
    \ object_method_name]`. Listing 5.2 shows the code.\n\n> **Tip**: Class methods\
    \ (defined with a \"+\" in front of their names) can be run using just the class\
    \ name, while object methods (defined with a \"-\" in front of their names) require\
    \ you to create an object before you run them.\n\n```objectivec\n#include <Foundation/Foundation.h>\n\
    \n@interface class_name : NSObject\n{\n    data_type variable_name;\n    data_ptype\
    \ variable_name;\n}\n\n-(return_type)object_method_name;\n+(return_type)class_method_name;\n\
    \n@end\n\n@implementation class_name\n\n-(return_type)object_method_name\n{\n\
    \    [code]\n}\n\n+(return_type)class_method_name\n{\n    [code]\n}\n\n@end\n\n\
    int main(void)\n{\n    [class_name class_method_name];\n    class_name *object\
    \ = [class_name new];\n    [object object_method_name];\n    return 0;\n}\n```\n\
    Listing 5.2 Using a class method and creating an object.\n\nChapter 5\n\n84\n\n\
    ### Using Class Methods\n\nA class method is a method you can execute using just\
    \ the class name—no object is required. You define class methods with a plus sign,\
    \ \"+\", in front of their names in both the class’s @interface section and @implementation\
    \ section, as shown here, where a class returns some text:\n\n```objectivec\n\
    #include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Container\n\
    +(const char *)classMethod;\n@end\n\n@implementation Container\n+(const char *)classMethod\n\
    {\n    return \"Hello there.\";\n}\n@end\n```\n\nNow you can execute the class\
    \ method by sending the class the name of the method as a message, like this:\n\
    \n```objectivec\nint main(void)\n{\n    printf(\"%s\\n\", [Container classMethod]);\n\
    \    return 0;\n}\n```\nYou’ll see this example at work in this task.\n\n85\n\n\
    ### Using Class Methods to create and execute a class method:\n\n1. Create a new\
    \ program named `classmethod.m`.\n2. In classmethod.m, enter the code shown in\
    \ Listing 5.3. This code creates a class named Container with one method, classMethod,\
    \ which returns a string.\n3. Add the main() function to execute classMethod and\
    \ display the returned string (Listing 5.4).\n4. Save classmethod.m.\n5. Run the\
    \ classmethod.m program. You should see the following:\n   Hello there.\n\n```objectivec\n\
    #include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Container\n\
    +(const char *)classMethod;\n@end\n\n@implementation Container\n+(const char *)classMethod\n\
    {\n    return \"Hello there.\";\n}\n@end\n...\n```\nListing 5.3 Starting classmethod.m.\n\
    \n```objectivec\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Container\n+(const char *)classMethod;\n@end\n\n@implementation Container\n\
    +(const char *)classMethod\n{\n    return \"Hello there.\";\n}\n\nint main(void)\n\
    {\n    printf(\"%s\\n\", [Container classMethod]);\n    return 0;\n}\n```\nListing\
    \ 5.4 The classmethod.m program.\n\nChapter 5\n\n86\n\n### Creating an Object\n\
    \nIn this task, you’ll start creating objects. Here, you’ll create a class with\
    \ an empty @interface (indicating that the class is derived from NSObject) and\
    \ an empty @implementation section:\n\n```objectivec\n@interface FirstClass :\
    \ NSObject\n@end\n\n@implementation FirstClass\n@end\n```\n\nYou’ll create an\
    \ object by passing the class the new message and then display the message \"\
    Object created.\" as shown here:\n\n```objectivec\nFirstClass *object = [FirstClass\
    \ new];\nprintf(\"Object created.\");\nreturn 0;\n```\n\nto create an object:\n\
    1. Create a new program named `object.m`.\n2. In object.m, enter the code shown\
    \ in Listing 5.5. This code creates the FirstClass class.\n3. Add the code to\
    \ create the new object of the FirstClass class and display a message indicating\
    \ the object has been created (Listing 5.6).\n4. Save object.m.\n5. Run the object.m\
    \ program (disregard the warning about not using the variable \"object\" when\
    \ you compile the code). You should see the following:\n   Object created.\n\n\
    ```objectivec\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ FirstClass : NSObject\n@end\n\n@implementation FirstClass\n@end.\n```\nListing\
    \ 5.5 Starting object.m.\n\n```objectivec\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface FirstClass : NSObject\n@end\n\n@implementation FirstClass\n@end\n\
    \nint main(void)\n{\n    FirstClass *object = [FirstClass new];\n    printf(\"\
    Object created.\\n\");\n    return 0;\n}\n```\nListing 5.6 The object.m program.\n\
    \n87\n\n### Creating Object Methods\n\nWhile you can execute a class method with\
    \ just the name of the class, you need an object to be able to execute object\
    \ methods—and object methods are more useful because class methods have restrictions\
    \ on how they store data that object methods don’t. You define an object method\
    \ in a class by preceding its prototype and definition with a minus sign, \"-\"\
    , in both the @interface section and @implementation section, as shown here, where\
    \ we create an object method named stringValue that returns a string:\n\n```objectivec\n\
    @interface ClassWithMethod : NSObject\n-(const char *)stringValue;\n@end\n\n@implementation\
    \ ClassWithMethod\n-(const char *)stringValue\n{\n    return \"Hello there.\"\
    ;\n}\n@end\n```\n\nto create an object method:\n1. Create a new program named\
    \ `objectmethod.m`.\n2. In objectmethod.m, enter the code shown in Listing 5.7.\
    \ This code creates the ClassWithMethod class and the stringValue method in that\
    \ class.\n3. Add the code to execute the stringValue object method from the main()\
    \ function (Listing 5.8).\n4. Save objectmethod.m.\n5. Run the objectmethod.m\
    \ program. You should see the following:\n   Hello there.\n\n```objectivec\n#include\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface ClassWithMethod\
    \ : NSObject\n-(const char *)stringValue;\n@end\n\n@implementation ClassWithMethod\n\
    -(const char *)stringValue\n{\n    return \"Hello there.\";\n}\n@end.\n```\nListing\
    \ 5.7 Starting objectmethod.m.\n\n```objectivec\n#include <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface ClassWithMethod : NSObject\n-(const\
    \ char *)stringValue;\n@end\n\n@implementation ClassWithMethod\n-(const char *)stringValue\n\
    {\n    return \"Hello there.\";\n}\n\nint main(void)\n{\n    ClassWithMethod *object\
    \ = [ClassWithMethod new];\n    printf(\"%s\\n\", [object stringValue]);\n   \
    \ return 0;\n}\n```\nListing 5.8 The objectmethod.m program.\n\nChapter 5\n\n\
    88\n\n### Storing Data in Objects\n\nIn the previous task, you saw how to set\
    \ up a method. But objects can contain both methods and data. In this task, you’ll\
    \ see how to store data in objects. You’ll also see how to pass arguments to object\
    \ methods. You set up your data in the @interface section. Then your code can\
    \ access those variables by name in the methods. For example, the code here stores\
    \ an integer:\n\n```objectivec\n@interface Container : NSObject\n{\n    int number;\n\
    }\n\n-(void)setNumber:(int n);\n-(int)intValue;\n@end\n\n@implementation Container\n\
    -(void)setNumber:(int n)\n{\n    number = n;\n}\n@end\n```\n\nThen you can execute\
    \ an object of this class, sending it the value 5 to store: `[object setNumber:5];`.\n\
    \nto store data in an object:\n1. Create a new program named `objectdata.m`.\n\
    2. In objectdata.m, enter the code shown in Listing 5.9. This code sets up an\
    \ internal integer named number and a method named setNumber to store a value\
    \ in that integer.\n\n```objectivec\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Container : NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int\
    \ n);\n-(int)intValue;\n@end\n\n@implementation Container\n-(void)setNumber:(int\
    \ n)\n{\n    number = n;\n}\n\n-(int)intValue\n{\n    return number;\n}\n\n@end\n\
    ...\n```\nListing 5.9 Starting objectdata.m.\n"
