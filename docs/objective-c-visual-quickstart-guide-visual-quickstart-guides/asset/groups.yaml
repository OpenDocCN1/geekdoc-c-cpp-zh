- md: "\n# Chapter 10\n\n## Displaying the Retain Count\n\nWhen you create objects,\
    \ Objective-C keeps track of them with a retain count. To find out what that retain\
    \ count is, you send an object a `retainCount` message.\n\nFor example, in the\
    \ previous task, you created two new objects:\n\n```objectivec\nClass1 *object1\
    \ = [[Class1 alloc] init];\nClass1 *object2 = [[Class1 alloc] init];\n```\n\n\
    You can display their retain count (which will be 1) like this:\n\n```objectivec\n\
    printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\nprintf(\"object2\
    \ retain count: %i\\n\", [object2 retainCount]);\n```\n\n**to display the retain\
    \ count:**\n\n1. Create a program named **retaincount.m**.\n2. In retaincount.m,\
    \ enter the code shown in **Listing 10.3**. This code creates the two test objects.\n\
    \n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface\
    \ Class1: NSObject\n@end\n\n@implementation Class1\n\n@end\n\nint main(void)\n\
    {\n    Class1 *object1 = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1\
    \ alloc] init];\n    return 0;\n}\n```\n**Listing 10.3** Starting retaincount.m.\n\
    \n3. Add the code to display the retain count of each new object (**Listing 10.4**).\n\
    4. Save retaincount.m.\n5. Run the retaincount.m program. You should see the following:\n\
    \n```\nobject1 retain count: 1\nobject2 retain count: 1\n```\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    return 0;\n}\n```\n\
    **Listing 10.4** The retaincount.m program.\n\n## Incrementing an Object’s Retain\
    \ Count\n\nYou can increment the retain count of an object yourself by sending\
    \ it a retain message. In this task, you’ll increment the retain counts of two\
    \ objects and then verify that the retain counts were indeed incremented.\n\n\
    **to increment the retain count:**\n\n1. Create a new program named **incrementcount.m**.\n\
    2. In incrementcount.m, enter the code shown in **Listing 10.5**. This code creates\
    \ the two test objects and displays their retain counts.\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    return 0;\n}\n```\n\
    **Listing 10.5** Starting incrementcount.m.\n\n3. Add the code to increment the\
    \ retain counts and display the results (**Listing 10.6**).\n4. Save incrementcount.m.\n\
    5. Run the incrementcount.m program. You should see the following:\n\n```\nobject1\
    \ retain count: 1\nobject2 retain count: 1\nobject1 retain count: 3\nobject2 retain\
    \ count: 2\n```\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \n@interface Class1: NSObject\n@end\n\n@implementation Class1\n\n@end\n\nint main(void)\n\
    {\n    Class1 *object1 = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1\
    \ alloc] init];\n    printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n\
    \    printf(\"object2 retain count: %i\\n\", [object2 retainCount]);\n    [object1\
    \ retain];\n    [object1 retain];\n    [object2 retain];\n    printf(\"object1\
    \ retain count: %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain\
    \ count: %i\\n\", [object2 retainCount]);\n    return 0;\n}\n```\n**Listing 10.6**\
    \ The incrementcount.m program.\n\n## Decrementing an Object’s Retain Count\n\n\
    You can decrement an object’s retain count by sending it a release message. You\
    \ do that here and confirm that the retain count has been decremented.\n\n**to\
    \ decrement the retain count:**\n\n1. Create a new program named **decrementcount.m**.\n\
    2. In decrementcount.m, enter the code shown in **Listing 10.7**. This code creates\
    \ the two test objects and increments their retain counts.\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    [object1 retain];\n\
    \    [object1 retain];\n    [object2 retain];\n    printf(\"object1 retain count:\
    \ %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain count: %i\\n\"\
    , [object2 retainCount]);\n}\n```\n**Listing 10.7** Starting decrementcount.m.\n\
    \n3. Add the code to decrement the retain count of each object by 1 and display\
    \ the resulting retain count for each object (**Listing 10.8**).\n4. Save decrementcount.m.\n\
    5. Run the decrementcount.m program. You should see the following:\n\n```\nobject1\
    \ retain count: 1\nobject2 retain count: 1\nobject1 retain count: 3\nobject2 retain\
    \ count: 2\nobject1 retain count: 2\nobject2 retain count: 1\n```\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    [object1 retain];\n\
    \    [object1 retain];\n    [object2 retain];\n    printf(\"object1 retain count:\
    \ %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain count: %i\\n\"\
    , [object2 retainCount]);\n    [object1 release];\n    [object2 release];\n  \
    \  printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    return 0;\n}\n```\n\
    **Listing 10.8** Editing decrementcount.m.\n\n## Deallocating Objects from Memory\n\
    \nWhen the retain count of an object reaches zero, Objective-C deallocates that\
    \ object from memory. You’ll see how this works by overriding your objects’ dealloc\
    \ method and displaying a message when the objects are deallocated.\n\n**to deallocate\
    \ an object:**\n\n1. Create a new program named **dealloc.m**.\n2. In dealloc.m,\
    \ enter the code shown in **Listing 10.9**. This code overrides the Class1 dealloc\
    \ method to display a message confirming the deallocation.\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    -(void)dealloc;\n@end\n\n@implementation Class1\n\n-(void)dealloc\n{\n    printf(\"\
    Deallocating the object\\n\");\n    [super dealloc];\n}\n\n@end\n```\n**Listing\
    \ 10.9** Starting dealloc.m.\n\n3. Add the code shown in **Listing 10.10**. This\
    \ code creates two Class1 objects and increments and decrements their retain counts\
    \ to zero. At that point, Objective-C deallocates the objects, as confirmed by\
    \ a message from the overridden dealloc method.\n4. Save dealloc.m.\n5. Run the\
    \ dealloc.m program. You should see the following:\n\n```\nobject1 retain count:\
    \ 1\nobject2 retain count: 1\nobject1 retain count: 3\nobject2 retain count: 2\n\
    object1 retain count: 2\nobject2 retain count: 1\nDeallocating the object\nDeallocating\
    \ the object\n```\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\n@interface Class1: NSObject\n-(void)dealloc;\n@end\n\n@implementation\
    \ Class1\n\n-(void)dealloc\n{\n    printf(\"Deallocating the object\\n\");\n \
    \   [super dealloc];\n}\n\n@end\n\nint main(void)\n{\n    Class1 *object1 = [[Class1\
    \ alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n    printf(\"object1\
    \ retain count: %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain\
    \ count: %i\\n\", [object2 retainCount]);\n    [object1 retain];\n    [object1\
    \ retain];\n    [object2 retain];\n    printf(\"object1 retain count: %i\\n\"\
    , [object1 retainCount]);\n    printf(\"object2 retain count: %i\\n\", [object2\
    \ retainCount]);\n    [object1 release];\n    [object2 release];\n    printf(\"\
    object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain\
    \ count: %i\\n\", [object2 retainCount]);\n    [object1 release];\n    [object1\
    \ release];\n    [object2 release];\n    return 0;\n}\n```\n**Listing 10.10**\
    \ Editing dealloc.m.\n"
  mdcn: "\n\n# 第10 章\n\n## 显示引用计数（Retain Count）\n\n当你创建对象时，Objective-C 使用引用计数（retain\
    \ count）来跟踪它们。要查找该引用计数，你可以向对象发送一个 `retainCount` 消息。\n\n例如，在上一个任务中，你创建了两个新对象：\n\
    \n```objectivec\nClass1 *object1 = [[Class1 alloc] init];\nClass1 *object2 = [[Class1\
    \ alloc] init];\n```\n\n你可以像下面一样显示它们的引用计数（结果为 1）：\n\n```objectivec\nprintf(\"\
    object1 retain count: %i\\n\", [object1 retainCount]);\nprintf(\"object2 retain\
    \ count: %i\\n\", [object2 retainCount]);\n```\n\n**显示引用计数：**\n\n1. 创建一个名为 **retaincount.m**\
    \ 的程序。\n2. 在 retaincount.m 中，输入**列表 10.3** 所示的代码。这段代码创建了两个测试对象。\n\n```objectivec\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ return 0;\n}\n```\n**列表 10.3** 开始编写 retaincount.m。\n\n3. 添加代码来显示每个新对象的引用计数（**列表\
    \ 10.4**）。\n4. 保存 retaincount.m。\n5. 运行 retaincount.m 程序。你应该应该看到以下内容：\n\n```\n\
    object1 retain count: 1\nobject2 retain count: 1\n```\n\n```objectivec\n#import\
    \ <Foundation/Foundation.h>\n#import <stdio.h>\n\n@interface Class1: NSObject\n\
    @end\n\n@implementation Class1\n\n@end\n\nint main(void)\n{\n    Class1 *object1\
    \ = [[Class1 alloc] init];\n    Class1 *object2 = [[Class1 alloc] init];\n   \
    \ printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n    printf(\"\
    object2 retain count: %i\\n\", [object2 retainCount]);\n    return 0;\n}\n```\n\
    **列表 10.4** retaincount.m 程序。\n\n## 增加对象的引用计数\n\n你可以通过向对象发送 `retain` 消息来手动增加其引用计数。在这个任务中，你将增加两个对象的引用计数，然后验证这些引用计数确实已经增加。\n\
    \n**增加引用计数：**\n\n1. 创建一个名为 **incrementcount.m** 的新程序。\n2. 在 incrementcount.m 中，输入**列表\
    \ 10.5** 所示的代码。这段代码创建了两个测试对象并显示它们的引用计数。\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\n@interface Class1: NSObject\n@end\n\n@implementation Class1\n\
    \n@end\n\nint main(void)\n{\n    Class1 *object1 = [[Class1 alloc] init];\n  \
    \  Class1 *object2 = [[Class1 alloc] init];\n    printf(\"object1 retain count:\
    \ %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain count: %i\\n\"\
    , [object2 retainCount]);\n    return 0;\n}\n```\n**列表 10.5** 开始编写 incrementcount.m。\n\
    \n3. 添加代码增加引用计数并显示结果（**列表 10.6**）。\n4. 保存 incrementcount.m。\n5. 运行 incrementcount.m\
    \ 程序。你应该应该看到以下内容：\n\n```\nobject1 retain count: 1\nobject2 retain count: 1\nobject1\
    \ retain count: 3\nobject2 retain count: 2\n```\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\n@interface Class1: NSObject\n@end\n\n@implementation Class1\n\
    \n@end\n\nint main(void)\n{\n    Class1 *object1 = [[Class1 alloc] init];\n  \
    \  Class1 *object2 = [[Class1 alloc] init];\n    printf(\"object1 retain count:\
    \ %i\\n\", [object1 retainCount]);\n    printf(\"object2 retain count: %i\\n\"\
    , [object2 retainCount]);\n    [object1 retain];\n    [object1 retain];\n    [object2\
    \ retain];\n    printf(\"object1 retain count: %i\\n\", [object1 retainCount]);\n\
    \    printf(\"object2 retain count: %i\\n\", [object2 retainCount]);\n    return\
    \ 0;\n}\n```\n**列表 10.6** incrementcount.m 程序。\n\n## 减少对象的引用计数\n\n你可以通过向对象发送 `release`\
    \ 消息来减少其引用计数。你在这里执行此操作并确认引用计数已经减少。\n\n**减少引用计数：**\n\n1. 创建一个名为 **decrementcount.m**\
    \ 的新程序。\n2. 在 decrementcount.m 中，输入**列表 10.7** 所示的代码。这段代码创建了两个测试对象并增加了它们的引用计数。\n\
