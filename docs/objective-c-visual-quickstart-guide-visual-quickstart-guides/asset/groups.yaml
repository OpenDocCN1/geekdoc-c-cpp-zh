    \ `printf()` 的内置 Objective-C 函数来显示一些文本。我们向括号内传递我们想要让 `printf()` 显示的文本：\n\n```objective-c\n\
    int main(void)\n{\n    printf (\"Welcome to Objective-C!\");\n}\n```\n\n- **tip**：Objective-C\
    \ 代码文件的扩展名是 `.m`。\n\n第 1 章\n**4**\n\n### 创建你的第一个程序\n\n为了使用 `printf()` 函数，我们必须通过函数声明告诉\
