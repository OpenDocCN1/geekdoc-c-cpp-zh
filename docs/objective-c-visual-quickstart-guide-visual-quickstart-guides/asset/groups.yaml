    \ 221\n\n## Index 223\n\n## Introduction\n\nWelcome to Objective-C. This book\
    \ is your guided tour of this exciting language, and it gives you what you need\
    \ to start working with Objective-C at once.\n\nUsing Objective-C, you can write\
    \ professional programs that make use of many object-oriented features—from the\
    \ basics up to advanced class inheritance and exception (run-time error) handling.\n\
    \nObjective-C runs on many different platforms. For the most part, your code should\
    \ work unchanged on all platforms that Objective-C supports, but where differences\
    \ in support exist, this book points them out to you.\n\nThis book starts with\
    \ the basics and continues on through advanced topics. You’ll begin by looking\
    \ at how to get Objective-C started and how to run basic programs. From there,\
    \ you’ll explore data handling, again starting with the basics and moving on through\
    \ advanced topics.\n\nAfter looking at how to write your own functions, you’ll\
    \ wrap functions and data together into objects—the core of Objective-C programming.\
    \ And when you start working with object-oriented programming, the lid is off—and\
    \ we’ll push the envelope as far as it can go.\n\nThat’s the plan, then: to present\
    \ a guided tour of Objective-C, taking you from the beginning to the most advanced\
    \ topics. Let’s get started with Chapter 1.\n\n## Chapter 1: Getting Started:\
    \ Objective-C\n\nThis book takes you on a guided tour of Objective-C, from the\
    \ basics up through advanced stuff. Objective-C is a cross-platform language,\
    \ so you’ll find it on many systems: the Mac, of course, but also Linux, Windows,\
    \ and more—and its core code stays the same across all platforms.\n\nObjective-C\
    \ is actually a layer built on top of the C language, and everything that works\
    \ in standard (that is, ANSI) works in Objective-C. Objective-C also adds tons\
    \ object-oriented features to the original C language. The way it uses objects\
    \ is what makes Objective-C so popular, but what is an object? Object-oriented\
    \ programming was introduced when programs began to get large and the structure\
    \ of the code began to get the way. Object-oriented programming lets programmers\
    \ wrap whole sections of code into easily self-contained objects and let them\
    \ break up.\n"
