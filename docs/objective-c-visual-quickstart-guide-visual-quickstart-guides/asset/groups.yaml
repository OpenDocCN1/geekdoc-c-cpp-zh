    \    printf (\"Welcome to Objective-C!\");\n}\n```\n\n当程序结束时，Objective-C 将期待一个关于函数是否执行成功的指示。我们将向\
    \ Objective-C 返回一个值 `0`，这意味着没有错误。代码列表 1.1 显示了整个程序，你将在接下来的任务中逐步创建它。\n\n- **tip**：注意，对于我们的目的来说，`#import`\
    \ 和 `#include` 是相同的。你可以交替使用它们，并采用任何顺序。\n\n```objective-c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    printf (\"Welcome to Objective-C!\");\n    return 0;\n\
    }\n```\n**列表 1.1** 你的第一个 Objective-C 程序。\n\n入门：核心 Objective-C\n**5**\n\n### 创建你的第一个程序\n\
    \n**在 Mac 上创建你的第一个 Objective-C 程序：**\n\n1. 从 http://developer.apple.com/iphone\
    \ 下载并安装 Xcode 集成开发环境。\n2. 运行 Xcode。\n3. 选择 File（文件） > New Project（新建项目）。\n4. 在\
    \ New Project 窗口中，选择 Application（应用程序）。\n5. 点击 Command-Line Tool（命令行工具）图标以选中它。\n\
    6. 从 Type（类型）下拉菜单中选择 Foundation。\n7. 点击 Choose（选择）按钮。\n8. 输入 **First** 作为你的应用程序名称。\n\
    9. 选择一个保存位置并点击 Save（保存）按钮。\n10. 在文本编辑器窗口中输入列表 1.1 中的代码。\n11. 选择 File（文件） > Save（保存）。\n\
    \n**在 Linux、UNIX 或 Windows 上创建你的第一个 Objective-C 程序：**\n\n1. 打开文本编辑器。\n2. 输入列表\
    \ 1.1 中的代码。\n3. 将文件保存为 **first.m** 到你选择的目录中。\n\n第 1 章\n**6**\n\n### 编译并运行你的第一个程序\n\
    \n要运行 Objective-C 程序，你首先必须对其进行编译，这会让 Objective-C 将你的代码转换为计算机可以理解的机器语言。\n\n当你运行第一个程序时，你应该看到以下结果：\n\
    \n`Welcome to Objective-C!`\n\nObjective-C 语言内置于 Mac OS 10.6 中，但 Linux、UNIX 或\
    \ Windows 没有，因此你必须下载它。如果你使用 Linux 或 UNIX，请访问 http://www.GNUstep.org/resources/sources.html\
    \ 下载并安装 GNUstep，它将提供 Objective-C 编译器。\n\n如果你使用 Windows，请访问 http://www.GNUstep.org/experience/Windows.html\
    \ 下载 GNUstep 安装程序并运行它。\n\n**在 Mac 上编译并运行你的第一个 Objective-C 程序：**\n\n1. 在 Xcode\
    \ 的 Project 工具栏上点击 Build and Run（构建并运行）按钮。\n\n你应该看到这条消息：\n\n`Welcome to Objective-C!`\n\
    \n恭喜你，运行了第一个 Objective-C 程序！\n\n入门：核心 Objective-C\n**7**\n\n### 编译并运行你的第一个程序\n\
    \n**在 Linux 或 UNIX 上编译并运行第一个 Objective-C 程序：**\n\n1. 打开命令行提示符窗口。\n2. 进入包含 `first.m`\
    \ 的目录。\n3. 如果你的电脑找不到编译器，请在 `gcc` 前加上 GNUstep 的路径：\n   `gcc -o first.m`\n4. 如下运行程序：\n\
    \   `./first`\n\n你应该看到这条消息：\n\n`Welcome to Objective-C!`\n\n恭喜你，运行了第一个 Objective-C\
    \ 程序！\n\n- **tip**：本书使用 `$` 作为通用命令提示符。\n\n**在 Windows 上编译并运行第一个 Objective-C 程序：**\n\
    \n1. 选择 Start > Programs > GNUstep。\n2. 在 shell 中进入包含 `first.m` 的目录。例如，如果 `first.m`\
    \ 在 C:\\，输入以下内容（`$` 是提示符）：\n   `cd C:\\`\n3. 在 shell 中输入以下命令将 `first.m` 编译为 `first.exe`：\n\
    \   `gcc -o first.m`\n4. 如下执行 `first.exe`：\n   `first`\n\n你应该看到这个：\n\n`Welcome\
    \ to Objective-C!`\n\n第 1 章\n**8**\n\n### 使用变量\n\n在 Objective-C 中，你可以将数据存储在变量中，变量是数据的占位符。例如，假设你有\
    \ 1 百万并想跟踪它；你可以如下将其存储在名为 `amount` 的变量中：\n\n```objective-c\nint amount = 1000000;\n\
    ```\n\n这段代码创建了一个存储整数（int 部分）的变量并将 `amount` 的初始化为 1000000。要显示 `amount` 的值，可以使用\
    \ `printf()`：\n\n```objective-c\nprintf(\"The amount in your account is %i\\n\"\
    , amount);\n```\n\n`%i` 是占位符，会被后面的整数变量替换。`\\n` 将文本移动到新行。当此程序运行时，你会看到 `amount`\
    \ 的值：\n\n`The amount in your account is 1000000`\n\n**使用变量：**\n\n1. 在新程序 `account.m`\
    \ 中输入列表 2 中的代码。\n2. 创建变量 `amount` 并将其初始化为 1000000（列表 3）。\n3. 显示 `amount` 的值（列表\
    \ 4）。\n4. 构建并运行程序。\n\n```objective-c\n#include <stdio.h>\n\nint main(void)\n{\n\
    \    int amount = 1000000;\n    printf(\"The amount in your account is %i\\n\"\
    , amount);\n}\n```\n**列表 2** account.m。\n\n```objective-c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int amount = 1000000;\n}\n```\n**列表 3** account.m。\n\n\
    ```objective-c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"The amount\
    \ in your account is %i\\n\", amount);\n}\n```\n**列表 4** account.m。\n\n入门：核心 Objective-C\n\
    **9**\n\n### 显示数值\n\n使用 `printf()` 函数显示存储在变量中的值是非常用的。在上一个任务中，你看到代码 `%i` 是整数变量的占位符。\n\
    \n| 代码 | 说明 |\n| :--- | :--- |\n| `%i` | 整数 |\n| `%c` | 字符 |\n| `%d` 或 `%i` |\
    \ 有符号十进制 |\n| `%e` | 使用 e 字符的科学计数法（系数/指数） |\n| `%E` | 使用 E 字符的科学计数法（系数/指数） |\n\
    | `%f` | 浮点小数 |\n| `%g` | %e 或 %f 中较短的 |\n| `%G` | %E 或 %f 中较短的 |\n| `%s` | 字符字符串\
    \ |\n| `%u` | 无符号十进制 |\n\n例如，如果你将上一个任务中的 `amount` 变量从 (int) 类型更改为浮点值 (float)，你可以使用\
    \ `printf()` 和 `%f`（用于 float）显示其值：\n\n```objective-c\n#include <stdio.h>\n\nint\
    \ main(void)\n{\n    float amount = 1000000.0;\n    printf(\"The amount in your\
    \ account is %f\\n\", amount);\n}\n```\n\n在这个任务中，你将创建一个名为 `temperature.m` 的程序，它将显示时间（整数）和温度（浮点数）。为了做到，你将在\
    \ `printf()` 中使用逗号分隔你想要显示的变量值：\n\n```objective-c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int time = 4;\n    float temperature = 73.6;\n    printf(\"At %i o'clock,\
    \ the temperature is %f degrees.\\n\", time, temperature);\n    return 0;\n}\n\
    ```\n\n"
