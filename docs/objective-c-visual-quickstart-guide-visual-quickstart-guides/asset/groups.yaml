- md: "\n## Creating Functions\n\n### Passing Constant Data to Functions\n\n3. Add\
    \ the code to create the adder() function, marking the array passed to this function\
    \ as a constant in the function’s argument list (**Listing 4.16**).\n4. Save function\
    \ `passconstarrays.m`.\n5. Run the function `passconstarrays.m` program.\n\nYou\
    \ should see the following:\nThe total is 10\n\n```c\n#include <stdio.h>\n\nlong\
    \ adder(const int array[], int number_elements);\n\nint main( )\n{\n    int data[]\
    \ = {1, 2, 3, 4};\n    int total = adder(data, sizeof(data)/sizeof(int));\n  \
    \  printf(\"The total is %i\\n\", total);\n    return 0;\n}\n\nlong adder(const\
    \ int array[], int number_elements)\n{\n    long sum = 0;\n    int loop_index;\n\
    \    for (loop_index = 0; loop_index < number_elements; loop_index++)\n      \
    \  sum = sum + array[loop_index];\n    return sum;\n}\n```\n**Listing 4.16** The\
    \ function `passconstarrays.m` program.\n\n## Using Recursion\n\nUsing recursion\n\
    Functions can call themselves in Objective-C, a process called recursion, and\
    \ this process is often useful. For example, say you’re writing a function that\
    \ calculates factorials: for example, 6! = 6 x 5 x 4 x 3 x 2 x 1 = 720. Here’s\
    \ a function that calls itself recursively to figure out factorials:\n\n```c\n\
    int factorial(int value)\n{\n    if (value == 1) {\n        return value;\n  \
    \  } else {\n        return value * factorial(value - 1);\n    }\n}\n```\n\nLet’s\
    \ use this function to calculate 6!. To use recursion:\n1. Create a new program\
    \ named `functionrecursion.m`.\n2. In `functionrecursion.m`, enter the code shown\
    \ in **Listing 4.17**. This code calls the `factorial()` function, passing it\
    \ a value of 6.\n3. Add the code to implement the recursive `factorial()` function\
    \ (**Listing 4.18**).\n4. Save `functionrecursion.m`.\n5. Run the `functionrecursion.m`\
    \ program.\n\nYou should see the following:\n6! = 720\n\n```c\n#include <stdio.h>\n\
    int main( )\n{\n    printf(\"6! = %i\\n\", factorial(6));\n    return 0;\n}\n\
    ```\n**Listing 4.17** Starting `functionrecursion.m`.\n\n```c\n#include <stdio.h>\n\
    \nint factorial(int value);\nint main( )\n{\n    printf(\"6! = %i\\n\", factorial(6));\n\
    \    return 0;\n}\n\nint factorial(int value)\n{\n    if (value == 1) {\n    \
    \    return value;\n    } else {\n        return value * factorial(value - 1);\n\
    \    }\n}\n```\n**Listing 4.18** The function `functionrecursion.m` program.\n\
    \n## Using Pointers to Functions\n\nUsing Pointers to Functions\nIn Objective-C,\
    \ function names are actually pointers. You can pass function names to other functions,\
    \ and in the receiving function, you can call the passed function name if you\
    \ treat it as a pointer. For example, you can pass function names to this function\
    \ `caller_function()` and it will call the passed function:\n\n```c\nvoid caller_function(void\
    \ (*pointer_to_function)())\n{\n    pointer_to_function();\n}\n```\n\nTo call\
    \ a function pointer:\n1. Create a new program named `functionpointers.m`.\n2.\
    \ In `functionpointers.m`, enter the code shown in **Listing 4.19**. This code\
    \ sets up a function named `printem()` and passes its name to `caller_function()`.\n\
    \n```#include <stdio.h>\nvoid printem(void);\nvoid caller_function(void (*pointer_to_function)());\n\
    int main( )\n{\n    caller_function(printem);\n    return 0;\n}\nvoid printem(void)\n\
    {\n    printf(\"there\");\n}\n```\n**Listing 4.19** Starting `functionpointers.m`.\n\
    \n3. Add the code to implement `caller_function()`, which will call the function\
    \ pointer you pass to it (**Listing 4.20**).\n4. Save `functionpointers.m`.\n\
    5. Run the `functionpointers.m` program.\n\nYou should see the following:\nthere\n\
    \n```c\n#include <stdio.h>\nvoid printem(void);\nvoid caller_function(void (*pointer_to_function)());\n\
    int main( )\n{\n    caller_function(printem);\n    return 0;\n}\nvoid printem(void)\n\
    {\n    printf(\"there\");\n}\nvoid caller_function(void (*pointer_to_function)())\n\
    {\n    pointer_to_function();\n}\n```\n**Listing 4.20** The `functionpointers.m`\
    \ program.\n\n## Classes and Objects\n\nAs discussed in Chapter 1, object-oriented\
    \ programming was introduced to let you handle bigger problems, letting you package\
    \ programming components into easily remembered objects. The example used in Chapter\
    \ 1 was a refrigerator. Instead of starting the pumps, regulating the temperature,\
    \ and starting the compressor in open code, you wrap all those actions into an\
    \ object containing data (such as the temperature) and methods (that is, functions,\
    \ such as startCompressor()) into an easily remembered object: a refrigerator.\
    \ You just put food in the refrigerator, and the refrigerator cools it for you;\
    \ all the implementation details are hidden from view. Objective-C object-oriented\
    \ programming (OOP) lets you use classes and objects. Classes are like cookie\
    \ cutters—they specify the cookies you can create—and those cookies are the objects.\
    \ So you first create a class that specifies the data and methods (that is, built-in\
    \ functions) for your objects, and then you create objects of that class.\n\n\
    Objective-C has its own syntax for classes and objects, and if you haven’t programmed\
    \ in Objective-C before, this syntax will take a little time to learn. Here’s\
    \ an example that we’ll dissect in this chapter. This example defines a class,\
    \ then creates an object of that class, then stores an integer in that object,\
    \ and then prints the stored integer:\n\n```objc\n#include <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface Container : NSObject\n{\n    int number;\n\
    }\n-(void)setNumber:(int)n;\n-(int)intValue;\n@end\n\n@implementation Container\n\
    \n-(void)setNumber:(int)n\n{\n    number = n;\n}\n\n-(int)intValue\n{\n    return\
    \ number;\n}\n@end\n\nint main(void)\n{\n    Container *object = [Container new];\n\
    \    [object setNumber:5];\n    printf(\"The number is %i\\n\", [object intValue]);\n\
    \    return 0;\n}\n```\nThe result of this code looks like:\nThe number is 5\n\
    \n## Creating Objective-C Classes and Objects\n\nIn this task, you’ll see how\
    \ to create classes and objects to get an overview of the Objective-C syntax.\
    \ The subsequent tasks will fill in the details.\n\nTo create a class and object:\n\
    1. Create a new program file with the extension .m.\n2. To create a class, you\
    \ create an @interface section, which lists the data in the class and the method\
    \ prototypes, and an @implementation section, which supplies the bodies of the\
    \ methods, using the syntax shown in **Listing 5.1**.\n\nBesides using this syntax,\
    \ you communicate with objects by sending messages, not by calling methods directly.\
    \ For example, to send a message to the setNumber method of an object to set its\
    \ stored number to 5, you send a message like: [object setNumber:5].\n\nObjective-C\
    \ classes are usually based on the Foundation class, so if you’re using Linux,\
    \ UNIX, or Windows, you need to create a GNUmakefile, make sure you’re in the\
    \ same directory as that file, and type make in the GNUstep shell (see the introduction\
    \ to Chapter 3 for more information about setting up environment variables to\
    \ use make). If you enter code in a file named *xxxx*.m, your GNUmakefile should\
    \ look like this:\n\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\nTOOL_NAME=xxxx\n\
    OBJC_FILES=xxxx.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n```\n\nThen to run\
    \ your code, enter this at the GNUstep command prompt:\n./obj/*xxxx\n**Listing\
    \ 5.1** Creating the class.\n"
