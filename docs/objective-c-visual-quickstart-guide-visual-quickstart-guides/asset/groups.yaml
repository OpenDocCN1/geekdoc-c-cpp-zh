    \    printf (\"x /= %2.0f --> x: %2.0f.\\n\", y, x);\n    return 0;\n}\n```\n\
    **Listing 1.12** 使用赋值运算符的 assignment.m 程序。\n\n## 入门：核心 Objective-C\n\n## 19\n\
    ### 使用自增和自减运算符\n\nObjective-C 还支持另外两个运算符：++ 自增运算符和 -- 自减运算符。例如，要增加名为 temperature\
    \ 的变量的值，你编写 temperature++，这会将该值加 1。要减少值，你输入 temperature--，这会将该值减 1。\n\n你可以在变量之前或之后使用\
    \ ++ 和 --，位置会有区别。++ 表达式会先增加 x 的值，然后执行该行代码；而 x++ 表达式则在执行当前行代码后，再增加 x 的值。\n\n例如，假设你有以下代码：\n\
    \n```c\nfloat x = 0;\nfloat y = 5;\nx = y++;\nprintf (\"After x = y++ x: %2.0f.\\\
    n\", x, y);\n```\n这段代码会打印 x: 5 并是 y: 6，因为自增操作是在赋值后进行的。另一方面，假设你执行：\n\n```c\nx =\
    \ ++y;\nprintf (\"After x = ++y x: %2.0f.\\n\", x, y);\n```\n这段代码会打印 x: 7，因为自增操作先完成了。\n\
    \n让我们测试自增运算符。\n\n## 第一章\n\n## 20\n### 使用自增和自减运算符\n\n要使用 Objective-C 自增运算符：\n\n\
    1. 创建名为 increment.m 的新程序。\n2. 在 increment.m 中输入 **Listing 1.13** 所示的代码。该代码声明了两个变量\
    \ x 和 y。\n3. 添加代码使用自增运算符（**Listing 1.14**）。\n4. 保存 increment.m。\n5. 运行 increment.m\
    \ 程序。\n\n你应该看到以下内容：\n\nx: 0 y: 5.\nAfter x = y++ x: 5 y: 6.\nAfter x = ++y x:\
    \ 7 y: 7.\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    float x = 0;\n \
    \   float y = 5;\n    \n    return 0;\n}\n```\n**Listing 1.13** increment.m 程序。\n\
    \n```c\n#include <stdio.h>\nint main(void)\n{\n    float x = 0;\n    float y =\
    \ 5;\n    printf (\"x: %2.0f y: %2.0f.\\n\", x, y);\n    x = y++;\n    printf\
    \ (\"After x = y++ x: %2.0f.\\n\", x, y);\n    x = ++y;\n    printf (\"\n x =yAfter\
    \ x = ++y: %2.0f.\\n\", x, y);\n    return 0;\n}\n```\n**Listing 1.14** 使用自增运算符的\
    \ increment.m 程序。\n\n## 入门：核心 Objective-C\n\n## 21\n### 使用类型转换运算符\n\n假设你想在一个名为\
    \ cast.m 的程序中求两个浮点数的模。你可能会输入：\n\n```c\nfloat x = 5;\nfloat y = 3;\nint result\
    \ = 0;\nresult = x % y;\n```\n\n然而，当你运行这段代码时，Objective-C 编译器会报错：cast.m:12: error:\
    \ invalid operands to %. 问题是该运算符需要整数操作数。为了解决这个问题，你可以使用 (int) 转换将浮点变量临时整数变量：\n\n\
    ```c\nfloat x = 5;\nfloat y = 3;\nint result = 0;\nresult = (int) x % (int) y;\n\
    ```\n现在一切正常了。你可以使用 cast 在类型之间转换：(int)、(float) 等。\n\n## 第一章\n\n## 22\n### 使用类型转换运算符\n\
    \n要使用转换运算符：\n\n1. 创建名为 cast.m 的新程序。\n2. 在 cast.m 中输入 **Listing 1.15** 所示的代码。该代码声明了三个变量：x、y\
    \ 和 result。\n3. 添加代码使用模运算符（**Listing 1.16**）。\n4. 保存 cast.m。\n5. 运行 cast.m 程序。\n\
    \n你应该看到以下内容：x: 5 y; 3。x mod y 的结果为 2。\n\n```c\n#include <stdio.h>\nint main(void)\n\
    {\n    float x = 5;\n    float y = 3;\n    int result = 0;\n    \n    return 0;\n\
    }\n```\n**Listing 1.15** cast.m 程序。\n\n```c\n#include <stdio.h>\nint main(void)\n\
    {\n    float x = 5;\n    float y = 3;\n    int result = 0;\n    printf (\"x: %2.0f\
    \ y; %2.0f.\\n\", x, y);\n    result = (int) x % (int) y;\n    printf (\"The result\
    \ of x mod y is %d.\\n\", result);\n    return 0;\n}\n```\n**Listing 1.16** 使用类型转换运算符的\
    \ cast.m 程序。\n\n## 入门：核心 Objective-C\n\n## 23\n### 控制程序流程\n\n本章完全关于通过按你想要的方式来控制代码。你将学习如何使用\
    \ if 语句进行选择、使用循环进行遍历。允许进行选择的主要语句是 if 语句。例如，假设你有一个名为 temperature 的变量，其设置为 72：\n\
    \n```c\n#include <stdio.h>\nint main(void)\n{\n    int temperature = 72;\n   \
    \ ...\n```\n\n## 第一章\n\n## 24\n### 控制程序流程\n\n你可以使用 == 等于运算符测试 temperature 的值是否等于\
    \ 72，如果是，则执行特定代码：\n\n```c\n#include <stdio.h>\nint main(void)\n{\n    int temperature\
    \ = 72;\n    if (temperature == 72)\n    {\n        printf(\"Perfect weather.\\\
    n\");\n    }\n    return 0;\n}\n```\n\n你还可以添加 else 语句，如果 if 语句中的条件为假，则执行代码：\n\n\
    ```c\n#include <stdio.h>\nint main(void)\n{\n    int temperature = 78;\n    if\
    \ (temperature == 72)\n    {\n        printf(\"Perfect weather.\\n\");\n    }\n\
    \    else\n    {\n        printf(\"Weather could be better.\\n\");\n    }\n  \
    \  return 0;\n}\n```\n\n## 25\n### 控制程序流程\n\n循环提供了控制程序流程的另一种工具。循环让你重复执行特定操作，例如对一组数字求和或绘制线条。例如，在\
    \ for 循环（最常见的循环类型）中，你初始化名为 loop_index 的变量（通常设置为 0），指定导致循环结束的条件以及在循环体执行后执行的操作。在示例中，循环在\
    \ loop_index 变量包含大于 5 的数字时结束；在循环体运行后，loop_index 的值递增：\n\n```c\n#include <stdio.h>\n\
    int main(void)\n{\n    int loop_index;\n    for (loop_index = 0; loop_index <\
    \ 5; loop_index++)\n    {\n        printf(\"You’ll see this five times.\\n\");\n\
    \    }\n    return 0;\n}\n```\n这个示例显示了文本“You’ll see this five times.”\n\n关于 for\
    \ 循环和 Objective-C 中其他循环的内容将在本章之后介绍。\n\n"
