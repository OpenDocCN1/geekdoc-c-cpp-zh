- md: "\n# Chapter 6\n\n## Using Private Access\n\n3. Add code to try to access the\
    \ private data member from outside the object (**Listing 6.4**).\n4. Save access.m.\n\
    5. Try to run access.m.\n\nWhen you try to compile access.m, you’ll get either\
    \ a warning or a hard error (depending on your version of Objective-C and the\
    \ platform it’s running on), because you’re trying to access a private member\
    \ from outside an object. (Note that the warnings will become hard errors in the\
    \ future.)\n\n```objective-c\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\
    \n@interface Access : NSObject {\n@public\n    int publicVariable;\n@private\n\
    \    int privateVariable;\n}\n@end\n\n@implementation Access\n\n@end\n\nint main(void)\n\
    {\n    Access *a = [Access new];\n    a->publicVariable = 1;\n    printf(\"The\
    \ public variable is %i\\n\", a->publicVariable);\n    // a->privateVariable =\
    \ 2;\n    // printf(\"The private variable is %i\\n\", a->privateVariable);\n\
    \    return 0;\n}\n```\n**Listing 6.4** The access.m program.\n\n## Using Protected\
    \ Access\n\nYou make class members protected with the @protected access specifier.\
    \ Making members protected restricts access to them to the code in the class in\
    \ which they are declared and classes based on that class.\n\n**to use protected\
    \ access:**\n\n1. Open the access.m program from the previous task for editing.\n\
    2. In access.m, enter the new code highlighted in **Listing 6.5**. This code creates\
    \ a protected data member.\n\n```objective-c\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\
    \n@interface Access : NSObject {\n@public\n    int publicVariable;\n@private\n\
    \    int privateVariable;\n@protected\n    int protectedVariable;\n}\n@end\n\n\
    @implementation Access\n\n@end\n```\n**Listing 6.5** Starting access.m.\n\n3.\
    \ Add the code shown in **Listing 6.6**, which attempts to access the protected\
    \ member from outside its containing object.\n4. Save access.m.\n5. Try to run\
    \ access.m.\n\nWhen you try to compile access.m, you’ll get either a warning or\
    \ a hard error (depending on your version of Objective-C and the platform it’s\
    \ running on), because you’re trying to access a protected member from outside\
    \ an object. (Note that the warnings will become hard errors in the future.)\n\
    \n```objective-c\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface\
    \ Access : NSObject {\n@public\n    int publicVariable;\n@private\n    int privateVariable;\n\
    @protected\n    int protectedVariable;\n}\n@end\n\n@implementation Access\n\n\
    @end\n\nint main(void)\n{\n    Access *a = [Access new];\n    a->publicVariable\
    \ = 1;\n    printf(\"The public variable is %i\\n\", a->publicVariable);\n   \
    \ //a->privateVariable = 2;\n    //printf(\"The private variable is %i\\n\", a->privateVariable);\n\
    \    a->protectedVariable = 3;\n    printf(\"The protected variable is %i\\n\"\
    , a->protectedVariable);\n    return 0;\n}\n```\n**Listing 6.6** The object.m\
    \ program.\n\n## Using Class Variables\n\nYou can create class variables for use\
    \ with your classes, but there’s a hitch: every object of that class shares the\
    \ same variable, so if one object changes a class variable that variable is changed\
    \ for all objects. You create class variables with the static keyword. Class variables\
    \ are often useful: for example, you can use a class variable to keep track of\
    \ the number of objects of a particular class in a program. You’ll do that in\
    \ this task.\n\n**to use class variables:**\n\n1. Create a new program named classvariables.m.\n\
    2. In classvariables.m, enter the code shown in **Listing 6.7**. This code creates\
    \ a class with a variable named count.\n\n```objective-c\n#import <stdio.h>\n\
    #import <Foundation/NSObject.h>\n\n@interface TheClass : NSObject\nstatic int\
    \ count;\n+(int)getCount;\n@end\n\n@implementation TheClass\n\n-(TheClass*)init\n\
    {\n    self = [super init];\n    count++;\n    return self;\n}\n\n+(int)getCount\n\
    {\n    return count;\n}\n@end\n```\n**Listing 6.7** Starting classvariables.m.\n\
    \n3. Add the code to create two objects and display the object count each time\
    \ (**Listing 6.8**).\n4. Save classvariables.m.\n5. Run the classvariables.m program.\
    \ You should see the following:\nTheClass count is 1\nTheClass count is 2\n\n\
    ```objective-c\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface\
    \ TheClass : NSObject\nstatic int count;\n+(int)getCount;\n@end\n\n@implementation\
    \ TheClass\n\n-(TheClass*)init\n{\n    self = [super init];\n    count++;\n  \
    \  return self;\n}\n\n+(int)getCount\n{\n    return count;\n}\n@end\n\nint main(void)\n\
    {\n    TheClass *tc1 = [TheClass new];\n    printf(\"TheClass count is %i\\n\"\
