- md: "\n## Using Arrays and Dictionaries\n\n### Adding Elements to a Mutable Array\n\
    \nIt’s easy to add new elements to a mutable array at run time: you just send\
    \ the `addObject` message.\n\n**to add elements to a mutable array:**\n\n1. Create\
    \ a file named **addelements.m**.\n2. In addelements.m, enter the code shown in\
    \ **Listing 9.9**. This code creates the mutable array you’ll use and initializes\
    \ it to “red”, “white”, and “blue”.\n\n```objc\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(int argc, const char *argv[]) {\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n}\n```\n\
    **Listing 9.9** *Starting addelements.m.*\n\n3. Enter the code to add the elements\
    \ “orange”, “green”, and “azure” and then loop over the array to print a list\
    \ of all the elements (**Listing 9.10**).\n4. Save addelements.m.\n5. Run the\
    \ addelements.m program. You should see the following:\nred\nwhite\nblue\norange\n\
    green\nazure\n\n```objc\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main(int argc, const char *argv[]) {\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSMutableArray *array = [[NSMutableArray alloc] initWithWithObjects:@\"\
    red\", @\"white\", @\"blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n\
    \    id obj;\n    [array addObject:@\"orange\"];\n    [array addObject:@\"green\"\
    ];\n    [array addObject:@\"azure\"];\n    while ((obj = [enumerator nextObject]))\
    \ {\n        printf(\"%s\\n\", [[obj description] cString]);\n    }\n    [pool\
    \ release];\n    return 0;\n}\n```\n**Listing 9.10** *The addelements.m program.*\n\
    \n### Sorting an Array\n\nYou can sort an array by sending it a `sortUsingSelector`\
    \ message. For example, here’s how you perform a case-insensitive sort, using\
    \ the `caseInsensitiveCompare` selector:\n\n```objc\n[array sortUsingSelector:@selector(caseInsensitiveCompare:)];\n\
    ```\n\n**to sort an array:**\n\n1. Create a file named **sortarray.m**.\n2. In\
    \ sortarray.m, enter the code in **Listing 9.11**. This code creates the array\
    \ and prints it.\n\n```objc\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main(int argc, const char *argv[]) {\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSMutableArray *array = [[NSMutableArray alloc] initWithWithObjects:@\"\
    red\", @\"white\", @\"blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n\
    \    id obj;\n    [array addObject:@\"orange\"];\n    [array addObject:@\"green\"\
    ];\n    [array addObject:@\"azure\"];\n    while ((obj = [enumerator nextObject]))\
    \ {\n        printf(\"%s\\n\", [obj description] cString);\n    }\n}\n```\n**Listing\
    \ 9.11** *Starting sortarray.m.*\n\n3. Add the code to sort the array and then\
    \ print it (**Listing 9.12**).\n4. Save sortarray.m.\n5. Run the sortarray.m program.\
    \ You should see the unsorted array followed by this:\nSorting the array.\nazure\n\
    blue\ngreen\norange\nred\nwhite\n\n```objc\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(int argc, const char *argv[]) {\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator\
    \ *enumerator = [array objectEnumerator];\n    id obj;\n    [array addObject:@\"\
    orange\"];\n    [array addObject:@\"green\"];\n    [array addObject:@\"azure\"\
    ];\n    while ((obj = [enumerator nextObject])) {\n        printf(\"%s\\n\", [[obj\
    \ description] cString]);\n    }\n    printf(\"Sorting the array.\\n\");\n   \
    \ [array sortUsingSelector:@selector(caseInsensitiveCompare:)];\n    NSEnumerator\
    \ *enumerator2 = [array objectEnumerator];\n    while ((obj = [enumerator2 nextObject]))\
    \ {\n        printf(\"%s\\n\", [[obj description] cString]);\n    }\n    [pool\
    \ release];\n    return 0;\n}\n```\n**Listing 9.12** *The sortarray.m program.*\n\
    \n### Releasing Array Memory\n\nThe memory used by a large array can be considerable.\
    \ You can release the memory for an array by sending the array a release message.\n\
    \n**to release array memory:**\n\n1. Copy sortarray.m to a program named **releasememory.m**.\n\
    2. In releasememory.m, add the code highlighted in **Listing 9.13**.\n3. Save\
    \ releasememory.m.\n4. Run releasememory.m program. You should see the following:\n\
    red\nwhite\nblue\norange\ngreen\nazure\nSorting the array.\nazure\nblue\ngreen\n\
    orange\nred\nwhite\nFreeing memory.\n\n```objc\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(int argc, const char *argv[]) {\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator\
    \ *enumerator = [array objectEnumerator];\n    id obj;\n    while ((obj = [enumerator\
    \ nextObject])) {\n        printf(\"%s\\n\", [[obj description] cString]);\n \
    \   }\n    printf(\"Sorting the array.\\n\");\n    [array sortUsingSelector:@selector(caseInsensitiveCompare)];\n\
    \    NSEnumerator *enumerator2 = [array objectEnumerator];\n    while ((obj =\
    \ [enumerator2 nextObject])) {\n        printf(\"%s\\n\", [[obj description] cString]);\n\
    \    }\n    printf(\"Freeing memory.\\n\");\n    [array release];\n    [pool release];\n\
    \    return 0;\n}\n```\n**Listing 9.13** *The releasememory.m program.*\n\n###\
    \ Creating a Dictionary\n\nA dictionary lets you use words or other objects as\
    \ keys and retrieve or store objects accessed by that key. In this task, you’ll\
    \ create a dictionary to see how it works.\n\n**to create a dictionary:**\n\n\
    1. Create a file named **createdictionary.m**.\n2. In createdictionary.m, enter\
    \ the code shown in **Listing 9.14**. This code creates the dictionary and adds\
    \ keys and values to it.\n\n```objc\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\nint main() {\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSDictionary *dictionary = [[NSDictionary alloc] initWithWithObjectsAndKeys:\n\
    \        @\"banana\", @\"fruit\",\n        @\"onion\", @\"vegetable\",\n     \
    \   @\"turkey\", @\"meat\",\n        nil];\n}\n```\n**Listing 9.14** *Starting\
    \ createdictionary.m.*\n\n3. Add the code to display the value for a particular\
    \ key (**Listing 9.15**).\n4. Save createdictionary.m.\n5. Run the createdictionary.m\
    \ program. You should see the unsorted array followed by this:\nEntry for fruit:banana\n\
    \n```objc\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main()\
    \ {\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n    NSDictionary\
    \ *dictionary = [[NSDictionary alloc] initWithWithObjectsAndKeys:\n        @\"\
    banana\", @\"fruit\",\n        @\"onion\", @\"vegetable\",\n        @\"turkey\"\
    , @\"meat\",\n        nil];\n    printf(\"Entry for fruit: %s\\n\", [[dictionary\
    \ objectForKey:@\"fruit\"] cString]);\n    [dictionary release];\n    [pool release];\n\
    \    return 0;\n}\n```\n**Listing 9.15** *The createdictionary.m program.*\n"
