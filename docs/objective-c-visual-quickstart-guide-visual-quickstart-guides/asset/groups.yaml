    ```\n\n###51\n\n### 使用指针\n\n指针存储项目在内存中的地址。你通过在前面加星号 (`*`) 来声明指针：\n\n```c\nint\
    \ integer, *pointer;\n```\n\n然后你可以使用 `&` 运算符获取内存中变量的地址并赋值给指针：\n\n```c\ninteger\
    \ = 1;\npointer = &integer;\n```\n\n使用星号，你可以引用指针指向的数据：\n\n```c\npointer = 2;\n\
    ```\n\n**使用指针：**\n\n1. 创建一个名为 **pointers.m** 的程序。\n2. 在 pointers.m 中，输入**Listing\
    \ 3.9** 所示的代码。这段代码创建了指针并赋值名为 integer 的变量地址。\n3. 给指针指向的内存位置分配一个新值并显示存储在该位置的数据（**Listing\
    \ 3.10**）。\n4. 保存 pointers.m。\n5. 运行 pointers.m 程序。你应该看到：\n   The value of the\
