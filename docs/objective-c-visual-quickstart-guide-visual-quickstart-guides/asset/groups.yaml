  - "[PAGE 163]\n\nCategories, Posing, and Protocols\n\n**155**\n\n**About Protocols**\n\
    \n**About Protocols **\n\nProtocols let you specify an interface for \n\na method\
    \ or methods that can be used in \n\nmultiple classes. For instance, if you have\
    \ \n\na method named print and want to cre-\n\nate a protocol for it, you can\
    \ do that in a file \n\nnamed, say, printing.h:\n\n@protocol Printing\n\n\\-(void) print;\n\
    \n@end\n\nThen you can include printing.h in the \n\ninterface files of other\
    \ classes. Doing so adds \n\nprint to the interfaces of those classes in the \n\
    \nheader file for Class1:\n\n#include <Foundation/Foundation.h> \n\n#import “printing.h”\n\
    \n@interface Class1: NSObject\n\n\\-(void) print;\n\n@end\n\nAnd you can also\
    \ include printing.h in \n\nanother class header, for Class2:\n\n#include “Class1.h” \n\
    \n#import “printing.h”\n\n@interface Class2: Class1\n\n@end\n\nNow you can implement\
    \ print one way for \n\nClass1:\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n#import “Class1.h”\n\n@implementation Class1 \n\n\\-(void) print\n\n{\n\n    printf(“This is Class 1.\\\
    \\n”);\n\n}\n\n@end\n\n*continues on next page*\n\n From the Library of Wow! eBook"
  - "[PAGE 164]\n\nChapter 8\n\n**156**\n\n**About Protocols**\n\nAnd you can implement\
    \ print another way \n\nfor Class2:\n\n#import <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\
    \n#import “Class1.h”\n\n#import “Class2.h”\n\n@implementation Class2 \n\n\\-(void) print\n\
    \n{\n\n    printf(“This is Class 2.\\\\n”);\n\n}\n\n@end\n\nThen you can create\
    \ objects of Class1 and \n\nClass1 and call each of their print methods \n\nlike\
    \ this:\n\n#import <stdio.h>\n\n#import “Class1.h”\n\n#import “Class2.h”\n\nint main(void) {\n\
    \n    Class1 \\*c = \\[Class1 new\\];\n\n    \\[c print\\];\n\n    Class2 \\*c2 = \\\
    [Class2 new\\];\n\n    \\[c2 print\\];\n\n    return 0;\n\n}\n\nAnd each of these\
    \ print methods will be dif-\n\nferent, so although there was only one proto-\n\
    \ncol, there are two different implementations.\n\nProtocols let you define the\
    \ interface of a \n\nmethod in this way. Although Objective-C has \n\nno true\
    \ multiple inheritance capability, you \n\ncan use multiple protocols (not classes)\
    \ as the \n\nbasis for derived classes. The protocols say \n\nwhat methods you’re\
    \ including and specify \n\ntheir return types, but it’s up to you to imple-\n\
    \nment those methods in the derived classes. \n\nThat’s as close as Objective-C\
    \ gets to multiple \n\ninheritance (in true multiple inheritance, you \n\ncan\
    \ derive a class from multiple base classes).\n\n From the Library of Wow! eBook"
- md: "\n## Categories, Posing, and Protocols\n\n157\n\n## Protocols: Defining the\
    \ Protocol/Interfaces\n\n### Protocol and Interfaces\n\nWhen you define a protocol\
    \ for a method or methods, you usually store that protocol in a header file. You’ll\
    \ create a protocol named Printing for a method named print in a file named printing.h:\n\
    \n```objectivec\n@protocol Printing\n-(void)print;\n@end\n```\n\nThen you’ll use\
    \ that protocol for one class in an interface file named ClassFirst.h:\n\n```objectivec\n\
    #include <Foundation/Foundation.h>\n#import \"printing.h\"\n\n@interface Class1\
    \ : NSObject\n-(void)print;\n@end\n```\n\nYou’ll also use the Printing protocol\
    \ in an interface file, ClassSecond.h, for a class derived from that first class:\n\
    \n```objectivec\n#include \"Class1.h\"\n#import \"printing.h\"\n\n@interface Class2\
    \ : Class1\n@end\n```\n\nThen you’ll implement the print method for Class1 and\
    \ Class2 in different ways (in the next task).\n\nChapter 8\n\n158\n\n## Protocols:\
    \ Defining the Protocol/Interfaces\n\n**to define the protocol and interfaces:**\n\
    \n1. Create a new file named **printing.h**.\n2. In printing.h, enter the code\
    \ shown in **Listing 8.20**. This code creates the protocol for the print method.\n\
    3. Save printing.h.\n4. Create a new file named **ClassFirst.h**.\n5. In ClassFirst.h,\
    \ enter the code to create the interface for the first class, which makes use\
    \ of the new protocol we’ve defined (**Listing 8.21**).\n6. Save ClassFirst.h.\n\
    7. Create a new file named **ClassSecond.h**.\n8. In ClassSecond.h, store the\
    \ code to set up the interface for the second class, which is derived from the\
    \ first class and also makes use of the new protocol for the print method (**Listing\
    \ 8.22**).\n9. Save ClassSecond.h.\n\n```objectivec\n@protocol Printing\n-(void)print;\n\
    @end\n```\n**Listing 8.20** The printing.h file.\n\n```objectivec\n#include <Foundation/Foundation.h>\n\
    #import \"printing.h\"\n\n@interface Class1 : NSObject\n-(void)print;\n@end\n\
    ```\n**Listing 8.21** The ClassFirst.h file.\n\n```objectivec\n#include \"Class1.h\"\
    \n#import \"printing.h\"\n\n@interface Class2 : Class1\n@end\n```\n**Listing 8.22**\
    \ The ClassSecond.h file.\n\nCategories, Posing, and Protocols\n\n159\n\n## Protocols:\
    \ Creating the Class Implementations\n\nNow that you’ve defined the protocol and\
    \ used it in the interfaces with two classes, you need to define the implementation\
    \ of the method in the protocol, here named print.\n\n**to define the implementation\
    \ with protocols:**\n\n1. Create a new program named **ClassFirst.m**.\n2. In\
    \ ClassFirst.m, enter the code shown in **Listing 8.23**. This code creates the\
    \ implementation of Class1.\n3. Add the code to create the implementation of the\
    \ print method (**Listing 8.24**).\n4. Save ClassFirst.m.\n5. Create a new program\
    \ named **ClassSecond.m**.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    #import \"Class1.h\"\n\n@implementation Class1\n\n@end\n```\n**Listing 8.23**\
    \ Starting ClassFirst.m.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    #import \"Class1.h\"\n\n@implementation Class1\n-(void)print {\n    printf(\"\
    This is Class 1\\n\");\n}\n@end\n```\n**Listing 8.24** The ClassFirst.m program.\n\
    \nChapter 8\n\n160\n\n## Protocols: Creating Class Implementations\n\n6. In ClassSecond.m,\
    \ enter the code shown in **Listing 8.25**. This code creates the implementation\
    \ of Class2.\n7. In ClassSecond.m, add the code to create the implementation of\
    \ the print method in Class2 (**Listing 8.26**).\n8. Save ClassSecond.m.\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n#import \"Class1.h\"\n\
    #import \"Class2.h\"\n\n@implementation Class2\n\n@end\n```\n**Listing 8.25**\
    \ Starting ClassSecond.m.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    #import \"Class1.h\"\n#import \"Class2.h\"\n\n@implementation Class2\n-(void)print\
    \ {\n    printf(\"This is Class 2\\n\");\n}\n@end\n```\n**Listing 8.26** The ClassSecond.m\
    \ program.\n\nCategories, Posing, and Protocols\n\n161\n\n## Protocols: Putting\
    \ It Together\n\nNow that you’ve defined a protocol for the print method and implemented\
    \ that method in two classes, you can create objects of those classes and call\
    \ the print method in each:\n\n```objc\nint main(void) {\n    Class1 *c = [Class1\
    \ new];\n    [c print];\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n   \
    \ return 0;\n}\n```\n\nEach method will print a different method, so although\
    \ the protocol defines an interface for one method, the actual implementation\
    \ depends on the classes that put the method to use.\n\n**to use protocols:**\n\
    \n1. Create a new program named **main.m**.\n2. In main.m, enter the code shown\
    \ in **Listing 8.27**. This code creates an object of the first class and executes\
    \ its print method.\n3. Add the code to create an object of the second class and\
    \ execute its print method as well (**Listing 8.28**).\n4. Save main.m.\n5. If\
    \ you’re using Linux, UNIX, or Windows, create a makefile named **makefile**.\n\
    6. Run the main.m program.\n\n```objc\n#import <stdio.h>\n#import \"Class1.h\"\
    \n#import \"Class2.h\"\n\nint main(void) {\n    Class1 *c = [Class1 new];\n  \
    \  [c print];\n    return 0;\n}\n```\n**Listing 8.27** Starting main.m.\n\n```objc\n\
    #import <stdio.h>\n#import \"Class1.h\"\n#import \"Class2.h\"\n\nint main(void)\
    \ {\n    Class1 *c = [Class1 new];\n    [c print];\n    Class2 *c2 = [Class2 new];\n\
    \    [c2 print];\n    return 0;\n}\n```\n**Listing 8.28** The main.m program.\n\
    \n```makefile\nTOOL_NAME=main\nOBJC_FILES=Class1.m ClassSecond.m main.m\n\n$(TOOL_NAME):\
    \ $(OBJC_FILES)\n\t$(CC) $(CFLAGS) -o $(TOOL_NAME) $(OBJC_FILES)\n```\n**Listing\
    \ 8.29** GNUmakefile.\n\nCategories, Posing, and Protocols\n\n162\n\nChapter 9\n\
    \n## Arrays and Dictionaries\n\nIn this chapter, we’re going to explore two important\
    \ features of Objective-C: arrays and dictionaries. You saw C-style arrays in\
    \ Chapter 3. Those arrays let you handle your data as a set accessible by index.\
    \ For example, here’s how to create a standard array and display some information\
    \ about it:\n\n```c\n#include <stdio.h>\nint main(void) {\n    int scores[5] =\
    \ {92, 73, 57, 98, 89};\n    printf(\"The array is %i elements long.\", sizeof(scores)\
    \ / sizeof(int));\n    return 0;\n}\n```\n\nIn this chapter, you’re going to build\
    \ arrays using the Foundation classes that come with Objective-C. You can also\
    \ create dictionaries in Objective-C using the Foundation classes. A dictionary\
    \ in Objective-C is just like an array, but it uses words as index values, not\
    \ numerical values. So while an array might be indexed by the numbers 0, 1, 2,\
    \ 3, and so on, a dictionary could as well have used “banana,” “apple,” and “orange.”\n\
    \nIn addition, you can create mutable arrays and dictionaries: that is, arrays\
    \ and dictionaries whose length can be changed on the fly in your code. You’ll\
    \ see how that works here. All that and more is coming up in this chapter, which\
    \ includes: the NSArray, NSMutableArray, NSMutableDictionary, and NSDictionary\
    \ classes, as well as some others.\n"
  mdcn: "\n\n## 分类、位置声明与协议\n\n157\n\n## 协议：定义协议/接口\n\n### 协议与接口\n\n当你为一个或多个方法定义一个协议时，你通常会将该协议存储在头文件中。你将在名为\
    \ `printing.h` 的文件中为名为 `print` 的方法创建一个名为 `Printing` 的协议：\n\n```objectivec\n@protocol\
    \ Printing\n-(void)print;\n@end\n```\n\n然后，你将在名为 `ClassFirst.h` 的接口文件中为一个类使用该协议：\n\
    \n```objectivec\n#include <Foundation/Foundation.h>\n#import \"printing.h\"\n\n\
    @interface Class1 : NSObject\n-(void)print;\n@end\n```\n\n你还会在名为 `ClassSecond.h`\
    \ 的接口文件中使用 `Printing` 协议，该类派自上述第一个类：\n\n```objectivec\n#include \"Class1.h\"\n\
    #import \"printing.h\"\n\n@interface Class2 : Class1\n@end\n```\n\n然后，你将在不同的地方（在下一个任务中）为\
    \ `Class1` 和 `Class2` 实现 `print` 方法。\n\n第 8 章\n\n158\n\n## 协议：定义协议/接口\n\n**定义协议和接口：**\n\
    \n1. 创建一个名为 **printing.h** 的新文件。\n2. 在 `printing.h` 中，输入**列表 8.20** 所示的代码。这段代码为\
    \ `print` 方法创建了协议。\n3. 保存 `printing.h`。\n4. 创建一个名为 **ClassFirst.h** 的新文件。\n5.\
    \ 在 `ClassFirst.h` 中，输入创建第一个类接口的代码，该接口使用了我们定义的这个协议（**列表 8.21**）。\n6. 保存 `ClassFirst.h`。\n\
    7. 创建一个名为 **ClassSecond.h** 的新文件。\n8. 在 `ClassSecond.h` 中，存储用于设置第二个类接口的代码，该类派自第一个类，并且同样使用了\
    \ `print` 方法的新协议（**列表 8.22**）。\n9. 保存 `ClassSecond.h`。\n\n```objectivec\n@protocol\
    \ Printing\n-(void)print;\n@end\n```\n**列表 8.20** `printing.h` 文件。\n\n```objectivec\n\
    #include <Foundation/Foundation.h>\n#import \"printing.h\"\n\n@interface Class1\
