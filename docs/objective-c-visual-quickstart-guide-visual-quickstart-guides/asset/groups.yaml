    \ = [Class2 new];\n    [c print];\n    return 0;\n}\n```\n**列表 7.16 protected.m\
    \ 程序。**\n\n## 在继承中使用构造函数\n\n如果基类有构造函数怎么办？当你使用 `super` 关键字时，可以调用基类的构造函数，并传递你想要的任何参数。`super`\
