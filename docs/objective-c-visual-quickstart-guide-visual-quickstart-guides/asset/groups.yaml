    header.h\" 行）。\n\n```objc\n#include \"header.h\"\n#include <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@implementation Container\n\n-(void)setNumber:(int)\
    \ n\n{\n    number = n;\n}\n\n-(int)intValue\n{\n    return number;\n}\n\n@end\n\
    \nint main(void)\n{\n    Container *object = [Container new];\n    [object setNumber:\
    \ 5];\n    printf(\"The number is %i\\n\", [object intValue]);\n    return 0;\n\
