    \n3. 添加创建枚举器并遍历字典的代码（**列表 9.17**）。\n4. 保存 **enumeratordictionary.m**。\n5. 运行 **enumeratordictionary.m**\
    \ 程序。你应该看到以下内容：\nvegetable => onion\nmeat => turkey\nfruit => banana\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n{\n  \
    \  NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n    NSDictionary\
    \ *dictionary = [[NSDictionary alloc]\n    initWithWithObjects:\n        @\"banana\"\
    , @\"fruit\",\n        @\"onion\", @\"vegetable\",\n        @\"turkey\", @\"meat\"\
    ,\n        nil];\n\n    NSEnumerator *enumerator = [dictionary keyEnumerator];\n\
    \    id key;\n    while ((key = [enumerator nextObject]))\n    {\n        printf(\"\
    %s => %s\\n\",\n               [[key description] cString],\n               [[[dictionary\
    \ objectForKey: key] description] cString]);\n    }\n    [dictionary release];\n\
    \    [pool release];\n    return 0;\n}\n```\n**列表 9.17** enumeratordictionary.m\
    \ 程序。\n\n### 创建可变字典\n\n你可以通过添加项来扩展可变字典，或通过移除项来缩小它。在本次任务中，你将学习如何创建一个可变字典，并在下一个任务中将学习如何扩展它。\n\
    \n**创建可变字典的步骤：**\n\n1. 创建一个名为 **mutabledictionary.m** 的新程序。\n2. 在 **mutabledictionary.m**\
    \ 中，输入**列表 9.18** 所示的代码。这段代码创建了 `NSMutableDictionary` 类的一个对象。\n3. 添加用于显示创建顺利的消息的代码，并在程序结束前释放可变字典所占用的内存（**列表\
    \ 9.19**）。\n4. 保存 **mutabledictionary.m**。\n5. 运行 **mutabledictionary.m** 程序。你应该看到：Created\
    \ dictionary.。\n\n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main(void)\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc]\
    \ init];\n    NSMutableDictionary *dictionary = [[NSMutableDictionary alloc] init];\n\
    \    printf(\"Created dictionary.\\n\");\n    [dictionary release];\n    [pool\
    \ release];\n    return 0;\n}\n```\n**列表 9.18** 开始编写 mutabledictionary.m。\n\n\
    ### 向可变字典添加对象\n\n在在上一个任务中，你创建了一个可变字典但没有向其中添加任何数据。在本次任务中，你将向可变字典添加键和值。\n\n**向可变字典添加对象的步骤：**\n\
    \n1. 创建一个名为 **addkeys.m** 的新程序。\n2. 在 **addkeys.m** 中，输入**列表 9.20** 所示的代码。这段代码创建了可变字典，并使用\
    \ `addObject` 消息向字典添加键值对。\n3. 添加打印可变字典内容的代码（**列表 9.21**）。\n4. 保存 **addkeys.m**。\n\
    5. 运行 **addkeys.m** 程序。你应该看到以下内容：\nvegetable => onion\nmeat => turkey\nfruit =>\
    \ banana\n\n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\
    \nint main(void)\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc]\
    \ init];\n    NSMutableDictionary *dictionary = [[NSMutableDictionary alloc] init];\n\
    \    [dictionary setObject:@\"banana\" forKey:@\"fruit\"];\n    [dictionary setObject:@\"\
    onion\" forKey:@\"vegetable\"];\n    [dictionary setObject:@\"turkey\" forKey:@\"\
    meat\"];\n\n    NSEnumerator *enumerator = [dictionary keyEnumerator];\n    id\
    \ key;\n    while ((key = [enumerator nextObject]))\n    {\n        printf(\"\
    %s => %s\\n\",\n               [[key description] cString],\n               [[[dictionary\
    \ objectForKey: key] description] cString]);\n    }\n    [dictionary release];\n\
    \    [pool release];\n    return 0;\n}\n```\n**列表 9.21** addkeys.m 程序。\n\n## 第\
    \ 10 章\n\n### Objective-C 中的内存管理\n\n在本章中，你将学习 Objective-C 中的内存管理。Objective-C 通过引用计数（retain\
    \ count）来跟踪你创建的所有对象，当该计数降为零时，Objective-C 会自动释放分配给对象的内存。\n\n例如，假设你创建了两个对象：\n```objective-c\n\
    Class1 *object1 = [[Class1 alloc] init];\nClass1 *object2 = [[Class1 alloc] init];\n\
    ```\n现在每个对象的引用计数均为 1，你可以通过询问每个对象的引用计数并打印结果来验证：\n```objective-c\nprintf(\"object1\
    \ retain count: %i\\n\", [object1 retainCount]);\nprintf(\"object2 retain count:\
    \ %i\\n\", [object2 retainCount]);\n```\n你也可以手动增加引用计数，如下：\n```objective-c\n[object1\
    \ retain];\n[object1 retain];\n[object2 retain];\n```\n当你向对象传递 retain 消息时，它会增加自己的引用计数。在这种情况下，object1\
    \ 的引用计数将从 1 增加到 2 再到 3，object2 的将从 1 增加到 2。要减少引用计数，你需要发送 release 消息：\n```objective-c\n\
    [object1 release];\n[object2 release];\n```\n这两行将 object1 的引用计数减为 2，object2 减为\
    \ 1。当你发送 release 消息到零时，Objective-C 会自动释放该对象。你将自己实现 dealloc 方法。\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(void)\n{\n  \
    \  NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableDictionary\
    \ *dictionary = [[NSMutableDictionary alloc] init];\n    printf(\"Created dictionary.\\\
    n\");\n    [dictionary release];\n    [pool release];\n    return 0;\n}\n```\n\
    **列表 10.2** createobject.m 程序。\n\n"
