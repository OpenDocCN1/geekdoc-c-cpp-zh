- md: "\n## Exception Handling\n\n### Returning void from an Exception Handler\n\n\
    Exception-handling code in a function can also return a value of void from the\
    \ function (if you want your function to return a value of void), but you need\
    \ a special macro, NS_VALUERETURNVOID, to make it do so.\n\n**to return a value\
    \ of void from an exception handler:**\n\n1. Create a file named **main.m**.\n\
    2. In main.m, enter the code shown in **Listing 11.17**. This entry sets up exception-handling\
    \ code for multiple exceptions.\n\n```objectivec\nNS_DURING\n{\n    .\n    .\n\
    \    .\n}\nNS_HANDLER\n{\n    if ([[localException name isEqualToString:@\"Exception1\"\
    ])\n    {\n        .\n        .\n        .\n    }\n    else if ([[localException\
    \ name isEqualToString:@\"Exception2\"])\n    {\n        .\n        .\n      \
    \  .\n    }\n    else\n    {\n        [localException raise];\n    }\n}\nNS_ENDHANDLER\n\
    \    .\n    .\n    .\n}\n```\n**Listing 11.17** Starting main.m.\n\n3. Add the\
    \ code to return void from the exception-handling code (**Listing 11.18**).\n\
    4. Save main.m.\n\n```objectivec\nNS_DURING\n{\n    .\n    .\n    .\n}\nNS_HANDLER\n\
    {\n    if ([[localException name isEqualToString:@\"Exception1\"])\n    {\n  \
    \      NS_VALUERETURNVOID;\n    }\n    else if ([[localException name isEqualToString:@\"\
    Exception2\"])\n    {\n        NS_VALUERETURNVOID;\n    }\n    else\n    {\n \
    \       [localException raise];\n    }\n}\nNS_ENDHANDLER\n    .\n    .\n    .\n\
    }\n```\n**Listing 11.18** The main.m program.\n\n### Catching Uncaught Exceptions\n\
    \nYou can set up a special function to catch all unhandled exceptions by calling\
    \ NSSetUncaughtExceptionHandler(fn_ptr), where fn_ptr is a pointer to a function\
    \ (just like a standard pointer, except that it points to a function of the form\
    \ void UncaughtExceptionHandler(NSException *exception)). So if you don’t handle\
    \ an exception anywhere else, it will be handled in the UncaughtExceptionHandler\
    \ function.\n\n**to catch uncaught exceptions:**\n\n1. Create a file named **main.m**.\n\
    2. In main.m, enter the code shown in **Listing 11.19**. This code sets up the\
    \ exception-handling function.\n\n```objectivec\nint main()\n{\n    NSSetUncaughtExceptionHandler(UncaughtExceptionHandler);\n\
    }\nvoid UncaughtExceptionHandler(NSException *exception)\n{\n    // handle exception\n\
    }\n```\n**Listing 11.19** Starting main.m.\n\n3. Add your exception-handling code\
    \ (**Listing 11.20**).\n4. Save main.m. Now your code can catch previously uncaught\
    \ exceptions.\n\n```objectivec\nint main()\n{\n    NSSetUncaughtExceptionHandler(UncaughtExceptionHandler);\n\
    }\nvoid UncaughtExceptionHandler(NSException *exception)\n{\n    if ([exception\
    \ name isEqualToString:@\"Exception1\"])\n    {\n        .\n        .\n      \
    \  .\n    }\n    else if ([exception name isEqualToString:@\"Exception2\"])\n\
    \    {\n        .\n        .\n        .\n    }\n    else\n    {\n        .\n \
    \       .\n        .\n    }\n}\n```\n**Listing 11.20** The main.m program.\n"
