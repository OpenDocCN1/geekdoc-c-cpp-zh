    \\n”, \n\n    \\[object2 retainCount\\]);\n\nYou can also explicitly increment\
    \ the retain \n\ncount yourself, like this:. \n\n  \\[object1 retain\\]; \n\n\
      \\[object1 retain\\]; \n\n  \\[object2 retain\\]; \n\n*continues on next page*\n\
