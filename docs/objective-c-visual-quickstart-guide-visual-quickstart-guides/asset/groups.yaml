    \ count is %i\\n\", [TheClass getCount]);\n    return 0;\n}\n```\n**Listing 6.8**\
    \ The classvariables.m program.\n\n## Accessing the Current Object\n\nSometimes,\
    \ you need to access the current object while executing code in that object. For\
    \ example, from constructors you need to return a pointer to the current object\
    \ after you’ve finished configuring it.\n\nTo get a pointer to the current object,\
    \ use the self keyword. You’ve seen self before, but it deserves its own task.\n\
    \n**to access the current object:**\n\n1. Open the classvariables.m program from\
    \ the previous task for editing.\n2. Assign the pointer returned by the base class’s\
    \ constructor to the self pointer (**Listing 6.9**).\n\n```objective-c\n#import\
    \ <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface TheClass : NSObject\n\
    static int count;\n+(int)getCount;\n@end\n\n@implementation TheClass\n\n-(TheClass*)init\n\
    {\n    self = [super init];\n    count++;\n    return self;\n}\n\n+(int)getCount\n\
    {\n    return count;\n}\n@end\n\nint main(void)\n{\n    TheClass *tc1 = [TheClass\
    \ new];\n    printf(\"TheClass count is %i\\n\", [TheClass getCount]);\n    TheClass\
    \ *tc2 = [TheClass new];\n    printf(\"TheClass count is %i\\n\", [TheClass getCount]);\n\
    \    return 0;\n}\n```\n**Listing 6.9** Editing classvariables.m.\n\n3. Use the\
    \ self keyword to get a pointer to the current object (**Listing 6.10**). Here,\
    \ you’re returning a pointer to the current object from the constructor.\n\n```objective-c\n\
    #import <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface TheClass : NSObject\n\
