  - "[PAGE 150]\n\nChapter 8\n\n**142**\n\n**Categories, Posing, and Protocols**\n\
    \nThere are other ways of doing the same thing— \n\nyou could use polymorphism,\
    \ for example (see \n\nthe previous chapter). But using posing can be \n\ncleaner\
    \ because you don’t have to keep track of \n\nwhat kind of pointer is stored in\
    \ your variables \n\nall the way through your code.\n\n*Protocols* are much like\
    \ what are called \n\ninterfaces in Java. A protocol is a specifica-\n\ntion for\
    \ a method, much like its prototype. \n\nWhen you indicate that a certain class\
    \ uses \n\nspecific protocols, you’re indicating that that \n\nclass implements\
    \ those methods. In other \n\nwords, protocols let you declare methods; it’s \n\
    \nup to you to define the implementation in \n\nyour class. \n\nThis is the closest\
    \ Objective-C comes to mul-\n\ntiple inheritance, in which you inherit from \n\
    \nmultiple classes, because using protocols, \n\nyou can make sure all your derived\
    \ classes \n\nimplement the same methods (although the \n\nactual implementation\
    \ in each class may \n\nbe different). That’s useful if, for example, \n\nyou\
    \ have two base classes, named Animal\n\nand Pet, and want to derive classes named\
    \ \n\nCat and Dog from them. You can make sure \n\nthat Cat and Dog implement\
    \ the methods of \n\nAnimal and Pet by using protocols. When Cat\n\nand Dog use\
    \ the protocols defined by Animal\n\nand Pet, Cat and Dog both automatically \n\
    \nimplement a list of methods.\n\n From the Library of Wow! eBook"
