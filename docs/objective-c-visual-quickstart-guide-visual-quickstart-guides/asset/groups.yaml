- md: "\n## Creating Functions\n\n### Returning Values from Functions\n\nTo return\
    \ values from functions:\n\n1. Create a new program named **functionreturn.m**.\n\
    2. In functionreturn.m, enter the code shown in **Listing 4.7**. This code creates\
    \ the adder(�) function and sets it up to return the sum of the two integers passed\
    \ to it.\n3. Add the code to call the adder(�) function and pass two integers\
    \ to it (**Listing 4.8**).\n4. Save functionreturn.m.\n5. Run the functionreturn.m\
    \ program. You should see the following:\n\n5 + 10 = 15\n\n```c\n#include <stdio.h>\n\
    int adder(int x, int y)\n{\n    return x + y;\n}\n```\n**Listing 4.7** Starting\
    \ functionreturn.m.\n\n```c\n#include <stdio.h>\nint adder(int x, int y)\n{\n\
    \    return x + y;\n}\n\nint main()\n{\n    int value1 = 5, value2 = 10;\n   \
    \ printf(\"%i + %i = %i\", value1, value2, adder(value1, value2));\n    return\
    \ 0;\n}\n```\n**Listing 4.8** The functionreturn.m program.\n\n### Using Function\
    \ Scope\n\nScope refers to the range of visibility of data items. Functions define\
    \ their own scope. That is, when you define a variable in a function, it becomes\
    \ a local variable for that function and takes precedence over other versions\
    \ of the same variable. For example, you can define an integer named number and\
    \ set it to 1 like this:\n\n```c\nint number = 1;\n```\n\nAnd then you can also\
    \ define an integer named number inside a function:\n\n```c\nint number = 1;\n\
    void function(void)\n{\n    int number = 2;\n    printf(\"In the function the\
    \ number is %i\\n\", number);\n}\n```\n\nThe local version of number will take\
    \ precedence in the function, so here the printf() statement will display a value\
    \ of 2 for number. If number hadn’t been defined locally in the function, the\
    \ version from outside the function would have been used, and the printf() statement\
    \ would have shown a value of 1. In Objective-C, any code block—that is, code\
    \ enclosed in curly braces such as function bodies or the bodies of if statements—defines\
    \ its own scope, so local variables will always take precedence over variables\
    \ defined outside the code block.\n\nTo use function scope:\n\n1. Create a new\
    \ program named **functionscope.m**.\n2. In functionscope.m, enter the code shown\
    \ in **Listing 4.9**. This code declares an integer named number displays its\
    \ value in main(), and then calls a function.\n\n```c\n#include <stdio.h>\nvoid\
    \ function(void);\nint number = 1;\nint main()\n{\n    printf(\"In main the number\
    \ is %i\\n\", number);\n    function();\n    return 0;\n}\n```\n**Listing 4.9**\
    \ Starting functionscope.m.\n\n3. Add the function that redefines number locally\
    \ as well as in a code block (**Listing 4.10**).\n4. Save functionscope.m.\n5.\
    \ Run the functionscope.m program. You should see the following:\n\nIn main the\
    \ number is 1\nIn the function the number is 2\nIn the block the number is 3\n\
    After the block the number is 2\n\n```c\n#include <stdio.h>\nvoid function(void);\n\
    int number = 1;\nint main()\n{\n    printf(\"In main the number is %i\\n\", number);\n\
    \    function();\n    return 0;\n}\n\nvoid function(void)\n{\n    int number =\
    \ 2;\n    printf(\"In the function number is %i\\n\", number);\n    {\n      \
    \  int number = 3;\n        printf(\"In the block number is %i\\n\", number);\n\
    \    }\n    printf(\"After the block number is %i\\n\", number);\n}\n```\n**Listing\
    \ 4.10** The functionscope.m program.\n\n### Passing Pointers to Functions\n\n\
    When you pass a pointer to a function, that function can use the pointer to change\
    \ data in the calling code. For instance, here’s an example that passes a pointer\
    \ to a function that changes a variable:\n\n```c\nint data = 1;\nint *datapointer\
    \ = &data;\nprintf(\"Before changer(), data = %i\\n\", data);\nchanger(datapointer);\n\
    printf(\"After changer(), data = %i\\n\", data);\n\nvoid changer(int *pointer)\n\
    {\n    *pointer = 2;\n}\n```\n\nTo pass a pointer to a function:\n\n1. Create\
    \ a new program named **functionpointers.m**.\n2. In functionpointers.m, enter\
    \ the code shown in **Listing 4.11**. This code passes a pointer to a function\
    \ named changer().\n\n```c\n#include <stdio.h>\nvoid changer(int *);\nint main()\n\
    {\n    int data = 1;\n    int *datapointer = &data;\n    printf(\"Before changer(),\
    \ data = %i\\n\", data);\n    changer(datapointer);\n    printf(\"After changer(),\
    \ data = %i\\n\", data);\n    return 0;\n}\n```\n**Listing 4.11** Starting functionpointers.m.\n\
    \n3. Add the code for the changer() function, which changes the data back in the\
    \ calling code (**Listing 4.12**).\n4. Save functionpointers.m.\n5. Run the functionpointers.m\
    \ program. You should see the following:\n\nBefore changer(), data = 1\nAfter\
    \ changer(), data = 2\n\n```c\n#include <stdio.h>\nvoid changer(int *);\nint main()\n\
    {\n    int data = 1;\n    int *datapointer = &data;\n    printf(\"Before changer(),\
    \ data = %i\\n\", data);\n    changer(datapointer);\n    printf(\"After changer(),\
    \ data = %i\\n\", data);\n    return 0;\n}\n\nvoid changer(int *pointer)\n{\n\
    \    *pointer = 2;\n}\n```\n**Listing 4.12** The functionpointers.m program.\n\
    \n### Passing Arrays to Functions\n\nTo pass arrays to functions:\n\n1. Create\
    \ a new program named **functionpassarrays.m**.\n2. In functionpassarrays.m, enter\
    \ the code shown in **Listing 4.13**. This code creates an array and passes it\
    \ to a function named adder().\n\n```c\n#include <stdio.h>\nlong adder(int array[],\
    \ int number_elements);\nint main()\n{\n    int data[] = {1, 2, 3, 4};\n    int\
    \ total = adder(data, sizeof(data)/sizeof(int));\n    printf(\"The total is %i\\\
    n\", total);\n    return 0;\n}\n```\n**Listing 4.13** Starting functionpassarrays.m.\n\
    \n3. Add the code to create the adder() function (**Listing 4.14**).\n4. Save\
    \ functionpassarrays.m.\n5. Run the functionpassarrays.m. You should see the following:\n\
    \nThe total is 10\n\n```c\n#include <stdio.h>\nlong adder(int array[], int number_elements);\n\
    int main()\n{\n    int data[] = {1, 2, 3, 4};\n    int total = adder(data, sizeof(data)/sizeof(int));\n\
    \    printf(\"The total is %i\\n\", total);\n    return 0;\n}\n\nlong adder(int\
    \ array[], int number_elements)\n{\n    long sum = 0;\n    int loop_index;\n \
    \   for (loop_index = 0; loop_index < number_elements++)\n        sum = sum +\
    \ array[loop_index];\n    return sum;\n}\n```\n**Listing 4.14** The functionpassarrays.m\
    \ program.\n\n### Passing Constant Data to Functions\n\nAs you know, if you pass\
    \ pointers to functions, those functions can change the data to which the pointers\
    \ point. Since arrays can double as pointers, if you pass an array as a pointer\
    \ in a function, the function can change your original array. To avoid that, when\
    \ you pass a copy of your array to the function, mark it as a constant so it can’t\
    \ be changed. You mark data as constant with the const keyword:\n\n```c\nint data[]\
    \ = {1, 2, 3, 4};\nint total = adder(data, sizeof(data)/sizeof(int));\nprintf(\"\
    The total is %i\\n\", total);\n\nlong adder(const int array[], int number_elements)\n\
    {\n    long sum = 0;\n    int loop_index;\n    for(loop_index = 0; loop_index\
    \ < number_elements; loop_index++)\n        sum = sum + array[loop_index];\n \
    \   return sum;\n}\n```\n\nIn this task, we’ll modify the previous task’s code\
    \ to use constant arrays.\n\nTo pass constant arrays to functions:\n\n1. Create\
    \ a new program named **functionpassconstarrays.m**.\n2. In functionpassconstarrays.m,\
    \ enter the code shown in **Listing 4.15**. This code creates an array and passes\
    \ it to a function named adder() whose prototype indicates that it takes constant\
    \ arrays.\n"
