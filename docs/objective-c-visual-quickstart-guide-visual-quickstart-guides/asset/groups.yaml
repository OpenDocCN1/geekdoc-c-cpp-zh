  - "[PAGE 9]\n\n**1**\n\n**Getting Started: Essential Objective-C**\n\n**1**\n\n\
    This book takes you on a guided tour of \n\nObjective-C, from the basics on up\
    \ through \n\nthe cool stuff.\n\nObjective-C is a cross-platform language, so\
    \ \n\nyou’ll find it on many systems: the Mac, of \n\ncourse, but also Linux,\
    \ UNIX, Windows, and \n\nmore—and its core programming code stays \n\nthe same\
    \ across all those platforms.\n\nObjective-C is actually a layer built on \n\n\
    top of the C language, and everything that \n\nworks in standard (that is, ANSI)\
    \ C works \n\nin Objective-C. Objective-C also adds tons \n\nof object-oriented\
    \ features to the original \n\nC language.\n\nThe way it uses objects is what\
    \ makes \n\nObjective-C so popular, but just what is an \n\nobject? Object-oriented\
    \ programming was \n\nintroduced when programs began to get very \n\nlarge and\
    \ the structure of the code began to \n\nget in the way. Object-oriented programming\
    \ \n\nlets programmers wrap whole sections of \n\ntheir code into easily handled,\
