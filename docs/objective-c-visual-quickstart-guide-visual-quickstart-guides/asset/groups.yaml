    \ code shown in **Listing 5.19**.\n9. Save container.m.\n10. Create a new file\
    \ named **GNUmakefile**.\n11. In GNUmakefile, enter the code shown in **Listing\
    \ 5.20**.\n12. Save GNUmakefile.\n13. Run the main.m program. You should see the\
    \ following:\n\nThe number is 5\n\n```objc\n#include \"container.h\"\n#include\
    \ <Foundation/Foundation.h>\n\n@implementation Container\n\n-(void)setNumber:(int)n\n\
    {\n    number = n;\n}\n\n-(int)intValue\n{\n    return number;\n}\n\n@end\n```\n\
    **Listing 5.19** The container.m program.\n\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME = main\nmain_OBJC_FILES = main.m container.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n\
    ```\n**Listing 5.20** The GNUmakefile file.\n\n## Classes and Objects\n\n### Using\
    \ Constructors\n\nIn Objective-C, as in many OOP languages, you can use *constructors*,\
    \ which are special methods used to initialize the data in an object when you\
    \ create that object. Constructors can be named anything, but they’re often named\
    \ init. The constructor returns a pointer to the object, and you get that pointer\
    \ by calling the super class’s init method (the super class is the class from\
    \ which the current class is derived, typically NSObject):\n\n```objc\n-(Container*)init:(int)n\n\
    {\n    self = [super init];\n    if (self) {\n        [self setNumber:n];\n  \
    \  }\n    return self;\n}\n```\n\nIn your code, you can then pass values to the\
    \ constructor when you create an object. For example, the following code initializes\
    \ the number stored in the object to 3:\n\n```objc\nContainer *object = [[Container\
    \ new] init:3];\n```\n\n**to use a constructor:**\n1. Create a new program named\
    \ **constructor.m**.\n2. In constructor.m, enter the code shown in **Listing 5.21**.\
    \ This code starts constructor.m with the interface of the Container class.\n\n\
    ```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)n;\n-(int)intValue;\n\
    -(Container*)init:(int)n;\n\n@end\n\n. . .\n```\n**Listing 5.21** Starting constructor.m.\n\
    \n3. Enter the code to add the implementation of the class methods and use the\
    \ constructor method to create a new Container object and initialize the integer\
    \ stored internally in that object to 3 (**Listing 5.22**).\n4. Save constructor.m.\n\
    5. Run the constructor.m program. You should see the following:\n\nThe number\
    \ is 3\n\n```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n\
    @interface Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)n;\n\
    -(int)intValue;\n-(Container*)init:(int)n;\n\n@end\n\n@implementation Container\n\
    \n-(void)setNumber:(int)n\n{\n    number = n;\n}\n\n-(int)intValue\n{\n    return\
    \ number;\n}\n\n-(Container*)init:(int)n\n{\n    self = [super init];\n    if\
    \ (self) {\n        [self setNumber:n];\n    }\n    return self;\n}\n\n@end\n\n\
    int main(void)\n{\n    Container *object = [[Container new] init:3];\n    printf(\"\
    The number is %i\\n\", [object intValue]);\n    return 0;\n}\n```\n**Listing 5.22**\
    \ The constructor.m program.\n\n## Chapter 6: Object-Oriented Programming\n\n\
    In this chapter, we take a deeper look at object-oriented programming in Objective-C.\
    \ We start by using *access specifiers*—@public (the default), @private, and @protected—to\
    \ set the access allowed members (both methods and data members) of an object.\
    \ We also explore how to use *class variables*—that is, variables that are associated\
    \ with a class, not just an object (in fact, all objects of that class share the\
    \ class variables). *Polymorphism* refers to using the same code for different\
    \ kinds of objects, and we see how that works in Objective-C, too. In addition,\
    \ we explore how to check whether an object supports a particular method before\
    \ trying to use it, how to determine the class of an object—and more.\n\n### Access\
    \ Specifiers\n\nThere are three access specifiers: @public (the default), which\
    \ puts no restriction on the scope of a member; @private, which restricts access\
    \ to code in the class in which the member is declared; and @protected, which\
    \ restricts access to code in the class in which the member is defined and classes\
    \ derived from that class.\n\nSo, for example, you can use this code to access\
    \ an object’s public variable outside that object:\n\n```objc\n#import <stdio.h>\n\
    #import <Foundation/NSObject.h>\n\n@interface Access:NSObject\n{\n@public\n  \
    \  int publicVariable;\n}\n\n@end\n\n@implementation Access\n@end\n\nint main(void)\n\
    {\n    Access *a = [Access new];\n    a->publicVariable = 1;\n    printf(\"The\
    \ public variable is %i\\n\", a->publicVariable);\n    return 0;\n}\n```\n**tip:**\
    \ See Chapter 7, “Working with Object-Oriented Inheritance” for a discussion of\
    \ how to derive one class from another.\n\nHere, we’re accessing the public variable\
    \ as a->publicVariable. You use the arrow notation to access members of an object,\
    \ given a pointer (a here) to the object. You’ll also need a GNUmakefile file\
    \ if you’re running in Linux, UNIX, or Windows:\n\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME = access\naccess_OBJC_FILES = access.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n\
    ```\n\nHowever, declaring a variable private restricts access to just code in\
    \ its class implementation, which means that this code won’t compile:\n\n```objc\n\
    #import <stdio.h>\n#import <Foundation/NSObject.h>\n\n@interface Access:NSObject\n\
    {\n@private\n    int privateVariable;\n}\n\n@end\n\n@implementation Access\n@end\n\
    \nint main(void)\n{\n    Access *a = [Access new];\n    a->privateVariable = 2;\n\
    \    printf(\"The private variable is %i\\n\", a->privateVariable);\n    return\
    \ 0;\n}\n```\n\n### Public Access\n\nPublic access is the default for members,\
    \ but you can also indicate that members are public with the @public specifier.\n\
    \n**to use public access:**\n1. Create a new program named **access.m**.\n2. Enter\
    \ the code to create a public member.\n3. Access the public member in the main(void)\
    \ function.\n4. Save access.m.\n5. Run the access.m program. You should see the\
    \ following:\n\nThe variable is 1\n\n```objc\n#import <stdio.h>\n#import <Foundation/NSObject.h>\n\
    \n@interface Access:NSObject\n{\n@public\n    int publicVariable;\n}\n\n@end\n\
    \n@implementation Access\n@end\n\nint main(void)\n{\n    Access *a = [Access new];\n\
    \    a->publicVariable = 1;\n    printf(\"The public variable is %i\\n\", a->publicVariable);\n\
    \    return 0;\n}\n```\n**Listing 6.1** Creating access.m.\n\n### Private Access\n\
    \nYou make class members private with the @private access specifier. Making members\
    \ private restricts access to them to the code in the class where they are declared.\n\
    \n**to use private access:**\n1. Open the access.m program from the previous task\
    \ for editing.\n2. In access.m, enter the new code highlighted in **Listing 6.3**.\
    \ This code creates a private data member.\n\n```objc\n#import <stdio.h>\n#import\
    \ <Foundation/NSObject.h>\n\n@interface Access:NSObject\n{\n@public\n    int publicVariable;\n\
    @private\n    int privateVariable;\n}\n\n@end\n\n@implementation Access\n@end\n\
    ```\n"
  mdcn: "\n\n## 第5章\n\n### 链接多个文件\n\n8. 在 `container.m` 中，输入**列表 5.19**所示的代码。\n9.\
    \ 保存 container.m。\n10. 创建名为 **GNUmakefile** 的新文件。\n11. 在 GNUmakefile 中，输入**列表\
    \ 5.20**所示的代码。\n12. 保存 GNUmakefile。\n13. 运行 main.m 程序。你应该看到以下内容：\n\n数字是 5\n\n\
    ```objc\n#include \"container.h\"\n#include <Foundation/Foundation.h>\n\n@implementation\
    \ Container\n\n-(void)setNumber:(int)n\n{\n    number = n;\n}\n\n-(int)intValue\n\
    {\n    return number;\n}\n\n@end\n```\n**列表 5.19** container.m 程序。\n\n```makefile\n\
    include $(GNUSTEP_MAKEFILES)/common.make\nTOOL_NAME = main\nmain_OBJC_FILES =\
    \ main.m container.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n```\n**列表 5.20**\
    \ GNUmakefile 文件。\n\n## 类与对象\n\n### 使用构造函数\n\n在 Objective-C 中，与许多 OOP 语言一样，你可以使用*构造函数*，它们是在创建对象时用于初始化对象中数据的特殊方法。构造函数可以命名为任何名称，但通常被命名为\
    \ `init`。构造函数返回指向对象的指针，你通过调用父类的 `init` 方法获取该指针（父类是当前类派生的类，通常是 NSObject）：\n\n```objc\n\
    -(Container*)init:(int)n\n{\n    self = [super init];\n    if (self) {\n     \
    \   [self setNumber:n];\n    }\n    return self;\n}\n```\n\n在你的代码中，你可以在创建对象时向构造函数传递值。例如，以下代码将对象中存储的数字初始化为\
    \ 3：\n\n```objc\nContainer *object = [[Container new] init:3];\n```\n\n**要使用构造函数：**\n\
    1. 创建名为 **constructor.m** 的新程序。\n2. 在 constructor.m 中，输入**列表 5.21**所示的代码。该代码带有\
    \ Container 类的接口启动 constructor.m。\n\n```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)n;\n\
    -(int)intValue;\n-(Container*)init:(int)n;\n\n@end\n\n. . .\n```\n**列表 5.21**\
    \ 启动 constructor.m。\n\n3. 输入代码以添加类方法的实现，并使用构造函数方法创建一个新的 Container 对象，并将该对象内部存储的整数初始化为\
    \ 3（**列表 5.22**）。\n4. 保存 constructor.m。\n5. 运行 constructor.m 程序。你应该看到以下内容：\n\n\
    数字是 3\n\n```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)n;\n-(int)intValue;\n\
    -(Container*)init:(int)n;\n\n@end\n\n@implementation Container\n\n-(void)setNumber:(int)n\n\
    {\n    number = n;\n}\n\n-(int)intValue\n{\n    return number;\n}\n\n-(Container*)init:(int)n\n\
    {\n    self = [super init];\n    if (self) {\n        [self setNumber:n];\n  \
    \  }\n    return self;\n}\n\n@end\n\nint main(void)\n{\n    Container *object\
    \ = [[Container new] init:3];\n    printf(\"The number is %i\\n\", [object intValue]);\n\
    \    return 0;\n}\n```\n**列表 5.22** constructor.m。\n\n## 第6章：面向对象编程\n\n在本章中，我们将深入探讨\
    \ Objective-C 中的面向对象编程。首先，我们来看访问修饰符。\n\n### 访问修饰符\n\n三种访问修饰符：`public`（默认值）、`private`（限制访问到声明该变量类的代码中）以及\
    \ `protected`（限制访问到该类及其派生类的代码）。\n\n因此，通过声明一个变量为私有，将其访问限制在类实现代码中。例如，以下代码：\n\n```objc\n\
    #include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Access:NSObject\n\
    {\n@public\n    int publicVariable;\n@private\n    int privateVariable;\n}\n\n\
    @end\n\n@implementation Access\n@end\n\nint main(void)\n{\n    Access *a = [Access\
    \ new];\n    a->privateVariable = 2;\n    printf(\"The private variable is %i\\\
    n\", a->privateVariable);\n    return 0;\n}\n```\n\n上述代码将无法编译，因为它尝试在类外部访问私有变量。为了解决这个问题，我们可以通过定义公共方法来访问私有变量：\n\
    \n```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Access:NSObject\n{\n@public\n    int publicVariable;\n@private\n    int privateVariable;\n\
    }\n\n-(int)getPrivateVariable;\n\n@end\n\n@implementation Access\n\n-(int)getPrivateVariable\n\
    {\n    return privateVariable;\n}\n\n@end\n\nint main(void)\n{\n    Access *a\
    \ = [Access new];\n    a->privateVariable = 2;\n    printf(\"The private variable\
    \ is %i\\n\", [a getPrivateVariable]);\n    return 0;\n}\n```\n**列表 6.2** 使用方法访问私有变量。\n\
    \n### 公共访问\n\n公共访问是成员的默认设置，但你也可以用 `@public` 修饰符指示成员是公有的。\n\n**要使用公共访问：**\n1. 创建名为\
    \ **access.m** 的程序。\n2. 输入代码以创建一个公共成员。\n3. 在 `main(void)` 函数中访问公共成员。\n4. 保存 access.m。\n\
    5. 运行 access.m 程序。你应该看到以下内容：\n\n变量是 1\n\n```objc\n#include <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface Access:NSObject\n{\n@public\n    int\
    \ publicVariable;\n}\n\n@end\n\n@implementation Access\n@end\n\nint main(void)\n\
    {\n    Access *a = [Access new];\n    a->publicVariable = 1;\n    printf(\"The\
    \ public variable is %i\\n\", a->publicVariable);\n    return 0;\n}\n```\n**列表\
    \ 6.1** 创建 access.m。\n\n### 私有访问\n\n你使用 `@private` 访问修饰符将类成员设为私有。将成员设为私有将其访问限制在声明这些成员的类中。\n\
    \n**要使用私有访问：**\n1. 打开上一个任务中的 access.m 程序进行编辑。\n2. 在 access.m 中输入**列表 6.3**中高亮的新代码。该代码创建了一个私有数据成员。\n\
    \n```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Access:NSObject\n{\n@public\n    int publicVariable;\n@private\n    int privateVariable;\n\
    }\n\n@end\n\n@implementation Access\n@end\n```\n\n"
