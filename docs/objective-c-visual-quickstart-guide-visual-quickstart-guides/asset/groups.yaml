  - "[PAGE 172]\n\nChapter 9\n\n**164**\n\n**Using Arrays and Dictionaries**\n\nYou\
    \ can also create dictionaries in Objective-C \n\nusing the Foundation classes.\
    \ A dictionary \n\nin Objective-C is just like an array, but it uses \n\nwords\
    \ as index values, not numerical values. \n\nSo while an array might be indexed\
    \ by the \n\nnumbers 0, 1, 2, 3, and so on, a dictionary \n\nwould use the index\
    \ terms “zero,” “one,” “two,” \n\n“three,” and so on. The index values need not\
    \ \n\nbe sequential; you could as well have used \n\n“banana,” “apple,” and “orange.”\n\
    \nIn addition, you can create mutable arrays \n\nand dictionaries: that is, arrays\
    \ and dictionar-\n\nies whose length can be changed on the fly in \n\nyour code.\
    \ You’ll see how that works here.\n\nAll that and more is coming up in this \n\
    \nchapter, which includes: the NSArray, \n\nNSMutableArray, NSMutableDictionary,\
    \ and \n\nNSDictionary classes, as well as some others.\n\n From the Library of\
    \ Wow! eBook"
- md: "\n## Using Arrays and Dictionaries\n\n### Creating an Array\n\nYou can create\
    \ an array using the Foundation class `NSArray`. Such arrays are static and cannot\
    \ be changed at run time.\n\nHere’s how you might create such an array, initializing\
    \ it to \"red\", \"white\", and \"blue\".\n\n```objective-c\n#import <Foundation/Foundation.h>\n\
    \nint main()\n{\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\"\
    , @\"white\", @\"blue\", nil];\n}\n```\n\n**to create a static array:**\n\n1.\
    \ Create a program named **createarray.m**.\n2. In createarray.m, enter the code\
    \ shown in **Listing 9.1**. This code creates the array and initializes it with\
    \ data.\n3. Add the code to display a message indicating success (**Listing 9.2**).\n\
    4. Save createarray.m.\n5. Run the createarray.m program (ignoring the warning\
    \ about the unused array variable).\n\nYou should see the following:\n`Array has\
    \ been created.`\n\n**Tips**\n- It’s a good idea to end all arrays with the `nil`\
    \ object, and as previously discussed, be sure to use the @ sign to differentiate\
    \ Objective-C strings from C-style strings.\n- You’ll need a GNUmakefile file\
    \ as detailed in previous chapters if you’re using Linux, UNIX, or Windows.\n\n\
    ```objective-c\n#import <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray\
    \ *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n\
    }\n```\n**Listing 9.1** Starting createarray.m.\n\n```objective-c\n#import <Foundation/Foundation.h>\n\
    \nint main()\n{\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\"\
    , @\"white\", @\"blue\", nil];\n    printf(\"Array has been created.\");\n   \
    \ return 0;\n}\n```\n**Listing 9.2** The createarray.m program.\n\n### Accessing\
    \ Array Elements\n\nYou created an array in the previous task. Now how do you\
    \ access individual elements in that array? For example, what if you want to access\
    \ the element at `array[0]`?\n\nTo do that, you send the array an `objectAtIndex`\
    \ message along with the index value you want to access:\n\n```objective-c\n#import\
    \ <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray *array = [[NSArray alloc]\
    \ initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    printf(\"array[0]\
    \ = %s\", [array objectAtIndex:0] cString);\n}\n```\nIn this task, you’ll see\
    \ how to access individual elements with the `objectAtIndex` message.\n\n**to\
    \ access individual elements:**\n\n1. Create a program named **accesselements.m**.\n\
    2. In accesslements.m, enter the code shown in **Listing 9.3**. This code creates\
    \ the array and initializes it with data.\n3. Add the code to access the elements\
    \ of your choice with `objectAtIndex` and turn the Objective-C string into a C-style\
    \ string before passing it to the `printf()` function (**Listing 9.4**).\n4. Save\
    \ accesslements.m.\n5. Run the accesslements.m program. You should see the following:\n\
    `array[0]=red`\n\n```objective-c\n#import <Foundation/Foundation.h>\n\nint main()\n\
    {\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\"\
    , @\"blue\", nil];\n    return 0;\n}\n```\n**Listing 9.3** Starting accesslements.m.\n\
    \n```objective-c\n#import <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray\
    \ *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n\
    \    printf(\"array[0] = %s\", [array objectAtIndex:0] cString);\n    return 0;\n\
    }\n```\n**Listing 9.4** The accesslements.m program.\n\n**Tip**\n- To insert an\
    \ object into an array, you use the `insertObjectAtIndex` message.\n\n### Using\
    \ Enumeration to Loop over an Array\n\nObjective-C provides an easy way to loop\
    \ over an array: you can use an `NSEnumerator` object. Here’s how to create an\
    \ enumerator for an array:\n\n```objective-c\nNSArray *array = [[NSArray alloc]\
    \ initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\nNSEnumerator *enumerator\
    \ = [array objectEnumerator];\n```\n\nThen you can use the enumerator’s `nextObject`\
    \ message to get the next element as you iterate the array in a loop.\n\n**to\
    \ use enumeration to loop over an array:**\n\n1. Create a new program named **enumerator.m**.\n\
    2. In enumerator.m, enter the code shown in **Listing 9.5**. This code creates\
    \ the array, an enumerator for the array, and a placeholder variable for objects\
    \ from the array.\n\n```objective-c\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\nint main(int argc, const char *argv[])\n{\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSArray *array = [[NSArray alloc]\
    \ initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator *enumerator\
    \ = [array objectEnumerator];\n    id obj;\n    // ...\n}\n```\n**Listing 9.5**\
    \ Starting enumerator.m.\n\n3. In enumerator.m, enter the code shown in **Listing\
    \ 9.6**. This code uses the `nextObject` message to get the next object from the\
    \ enumerator in a while loop. We also create an `NSAutoreleasePool` object to\
    \ keep track of memory.\n4. Save enumerator.m.\n5. If you’re using Linux, UNIX,\
    \ or Windows, create a new makefile named **GNUmakefile**.\n6. Run the enumerator.m\
    \ program. You should see the following:\n`red`\n`white`\n`blue`\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(int argc, const\
    \ char *argv[])\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\", @\"\
    blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n    id\
    \ obj;\n    while ((obj = [enumerator nextObject])) {\n        printf(\"%s\\n\"\
    , [obj description] cString);\n    }\n    [pool release];\n    return 0;\n}\n\
    ```\n**Listing 9.6** Editing enumerator.m.\n\n**Tip**\n- If you want to loop over\
    \ an array with a `for` loop, you can send the array `count` to get the number\
    \ of elements in the array.\n\n### Creating a Mutable Array\n\nThe arrays you\
    \ create with `NSArray` are fixed arrays—you cannot change their length at run\
    \ time. However, the length of arrays you create with the `NSMutableArray` class\
    \ can be changed when your program runs.\n\nIn the next task, you’ll use `NSMutableArray`\
    \ to add elements to a mutable array.\n\n**to create a mutable array:**\n\n1.\
    \ Create a new program named **createmutablearray.m**.\n2. In createmutablearray.m,\
    \ enter the code shown in **Listing 9.7**. This code creates the mutable array.\n\
    \n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint\
    \ main(int argc, const char *argv[])\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSMutableArray *array = [[NSMutableArray alloc] initWithObjects:@\"\
    red\", @\"white\", @\"blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n\
    \    id obj;\n    // ...\n}\n```\n**Listing 9.7** Starting Startingemutablearray.m.\n\
    \n3. In createmutablearray.m, enter the code shown in **Listing 9.8**. This code\
    \ uses an enumerator and the `nextObject` message to get the next object from\
    \ the enumerator in a while loop.\n4. Save createmutablearray.m.\n5. If you’re\
    \ using Linux, UNIX, or Windows, create a new makefile named **GNUmakefile**.\n\
    6. Run the createmutablearray.m program. You should see the following:\n`red`\n\
    `white`\n`blue`\n\n```objective-c\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\nint main(int argc, const char *argv[])\n{\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator\
    \ *enumerator = [array objectEnumerator];\n    id obj;\n    while ((obj = [enumerator\
    \ nextObject])) {\n        printf(\"%s\\n\", [obj description] cString);\n   \
    \ }\n    [pool release];\n    return 0;\n}\n```\n**Listing 9.8** Editing createmutablearray.m.\n"
  mdcn: "\n\n## 使用数组和字典\n\n### 创建数组\n\n你可以使用 Foundation 的 `NSArray` 类来创建一个数组。此类数组是静态的，在运行时无法更改。\n\
    \n以下是创建这样一个数组的方法，并将其初始化为“red”（红色）、“white”（白色）和“blue”（蓝色）。\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray *array = [[NSArray\
    \ alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n}\n```\n\n**创建一个静态数组：**\n\
    \n1. 创建一个名为 **createarray.m** 的程序。\n2. 在 createarray.m 中，输入**列表 9.1** 所示的代码。这段代码创建了数组并用数据对其初始化。\n\
    3. 添加代码以显示表示成功的消息（**列表 9.2**）。\n4. 这里的 createarray.m。\n5. 运行 createarray.m 程序（忽略关于未使用数组变量的警告）。\n\
    \n你应该能看到以下内容：\n`Array has been created.`\n\n**提示**\n- 所有的数组都以 `nil` 对象结尾是一个好习惯，并且正如之前讨论过的，务必使用\
    \ @ 符号来区分 Objective-C 字符串和 C 风格字符串。\n- 如果你使用的是 Linux、UNIX 或 Windows，则需要一个前面的章节详细介绍的\
    \ GNUmakefile 文件。\n\n```objective-c\n#import <Foundation/Foundation.h>\n\nint\
    \ main()\n{\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\", @\"\
    white\", @\"blue\", nil];\n}\n```\n**列表 9.1** 开始 createarray.m。\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray *array = [[NSArray\
    \ alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    printf(\"\
    Array has been created.\");\n    return 0;\n}\n```\n**列表 9.2** createarray.m 程序。\n\
    \n### 访问数组元素\n\n你已经在上一个任务中创建了一个数组。现在，你如何访问该数组中的单个元素呢？例如，如果你想访问 `array[0]` 处的元素怎么办？\n\
    \n要做到这一点，你向数组发送 `objectAtIndex` 消息，并带上你想要访问的索引值：\n\n```objective-c\n#import <Foundation/Foundation.h>\n\
    \nint main()\n{\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\"\
    , @\"white\", @\"blue\", nil];\n    printf(\"array[0] = %s\", [array objectAtIndex:0]\
    \ cString);\n}\n```\n在这个任务中，你将看到如何使用 `objectAtIndex` 消息访问单个元素。\n\n**访问单个元素：**\n\
    \n1. 创建一个名为 **accesselements.m** 的程序。\n2. 在 accesslements.m 中，输入**列表 9.3** 所示的代码。这段代码创建了数组并用数据对其初始化。\n\
    3. 添加代码通过 `objectAtIndex` 访问你选择的元素，并在将其传递给 `printf()` 函数之前将 Objective-C 字符串转换为\
    \ C 风格字符串（**列表 9.4**）。\n4. 保存 accesslements.m。\n5. 运行 accesslements.m 程序。你应该能看到以下内容：\n\
    `array[0]=red`\n\n```objective-c\n#import <Foundation/Foundation.h>\n\nint main()\n\
    {\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\"\
    , @\"blue\", nil];\n    return 0;\n}\n```\n**列表 9.3** 开始 accesslements.m。\n\n\
    ```objective-c\n#import <Foundation/Foundation.h>\n\nint main()\n{\n    NSArray\
    \ *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n\
    \    printf(\"array[0] = %s\", [array objectAtIndex:0] cString);\n    return 0;\n\
    }\n```\n**列表 9.4** accesslements.m 程序。\n\n**提示**\n- 要向数组中插入对象，你可以使用 `insertObjectAtIndex`\
    \ 消息。\n\n### 使用枚举遍历数组\n\nObjective-C 提供了一种简单的方法来遍历数组：你可以使用一个 `NSEnumerator` 对象。以下是为数组创建枚举器的方法：\n\
    \n```objective-c\nNSArray *array = [[NSArray alloc] initWithObjects:@\"red\",\
    \ @\"white\", @\"blue\", nil];\nNSEnumerator *enumerator = [array objectEnumerator];\n\
    ```\n\n然后，你可以使用枚举器的 `nextObject` 消息，在循环遍历数组时获取下一个元素。\n\n**使用枚举遍历数组：**\n\n1. 创建一个名为\
    \ **enumerator.m** 的新程序。\n2. 在 enumerator.m 中，输入**列表 9.5** 所示的代码。这段代码创建了数组、数组的枚举器以及一个用于数组对象的占位变量。\n\
    \n```objective-c\n#import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint\
    \ main(int argc, const char *argv[])\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\"\
    , @\"white\", @\"blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n\
    \    id obj;\n    // ...\n}\n```\n**列表 9.5** 开始 enumerator.m。\n\n3. 在 enumerator.m\
    \ 中，输入**列表 9.6** 所示的代码。这段代码使用 `nextObject` 消息在 while 循环从枚举器中获取下一个对象。我们还创建一个 `NSAutoreleasePool`\
    \ 对象来跟踪内存。\n4. 保存 enumerator.m。\n5. 如果你使用的是 Linux、UNIX 或 Windows，创建一个名为 **GNUmakefile**\
    \ 的文件。\n6. 运行 enumerator.m 程序。你应该看到以下内容：\n`red`\n`white`\n`blue`\n\n```objective-c\n\
    #import <Foundation/Foundation.h>\n#import <stdio.h>\n\nint main(int argc, const\
    \ char *argv[])\n{\n    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n\
    \    NSArray *array = [[NSArray alloc] initWithObjects:@\"red\", @\"white\", @\"\
    blue\", nil];\n    NSEnumerator *enumerator = [array objectEnumerator];\n    id\
    \ obj;\n    while ((obj = [enumerator nextObject])) {\n        printf(\"%s\",\
    \ [obj] cString);\n    }\n    [pool release];\n    return 0;\n}\n```\n**列表 9.6**\
    \ 编辑 enumerator.m。\n\n**提示**\n- 如果你想用 `for` 循环遍历数组，可以向数组发送 `count` 获取数组中的元素数量。\n\
    \n### 创建可变数组\n\n使用 `NSArray` 创建的数组是固定数组——你无法在运行时更改它们的长度。然而，使用 `NSMutableArray`\
    \ 类创建的数组长度在程序运行时是可以更改的。\n\n在下一个任务中，你将使用 `NSMutableArray` 向数组添加元素。\n\n**创建一个可变数组：**\n\
    \n1. 创建一个名为 **createmutablearray.m** 的新程序。\n2. 在 createmutablearray.m 中，输入**列表\
    \ 9.7** 所示的代码。这段代码创建了可变数组。\n\n```objective-c\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(int argc, const char *argv[])\n{\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator\
    \ *enumerator = [array objectEnumerator];\n    id obj;\n    // ...\n}\n```\n**列表\
    \ 9.7** 开始 createmutablearray.m。\n\n3. 在 createmutablearray.m 中，输入**列表 9.8** 所示的代码。这段代码使用枚举器和\
    \ `nextObject` 消息在 while 循环从枚举器中获取下一个对象。\n4. 保存 createmutablearray.m。\n5. 如果你使用的是\
    \ Linux、UNIX 或 Windows，创建一个名为 **GNUmakefile** 的文件。\n6. 运行 createmutablearray.m\
    \ 程序。你应该能看到以下内容：\n`red`\n`white`\n`blue`\n\n```objective-c\n#import <Foundation/Foundation.h>\n\
    #import <stdio.h>\n\nint main(int argc, const char *argv[])\n{\n    NSAutoreleasePool\
    \ *pool = [[NSAutoreleasePool alloc] init];\n    NSMutableArray *array = [[NSMutableArray\
    \ alloc] initWithObjects:@\"red\", @\"white\", @\"blue\", nil];\n    NSEnumerator\
    \ *enumerator = [array objectEnumerator];\n    id obj;\n    while ((obj = [enumerator\
    \ nextObject])) {\n        printf(\"%s\\n\", [obj description] cString);\n   \
    \ }\n    [pool release];\n    return 0;\n}\n```\n**列表 9.8** 编辑 createmutablearray.m。\n\
    \n"
