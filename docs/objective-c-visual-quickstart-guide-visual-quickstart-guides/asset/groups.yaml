    \    Class1 *c1 = [Class1 new];\n    Class2 *c2 = [Class2 new];\n    id pointerToObject;\n\
    \    int loopIndex;\n    pointerToObject = c1;\n    for(loopIndex = 0; loopIndex\
    \ < 2; loopIndex++){\n        [pointerToObject print];\n        pointerToObject\
    \ = c2;\n    }\n    return 0;\n}\n```\n**Listing 7.20 The polymorphism.m program.**\n\
    \n## Categories, Posing, and Protocols\n\nIn this chapter, we’re going look at\
    \ three features of Objective-C object-oriented programming: categories, posing,\
    \ and protocols. *Categories* let you extend a class by adding methods to a class—and\
    \ you don’t need access to the base class’s code to do it; you can create new\
    \ methods for a class without editing the class’s definition. That can be useful\
    \ when you don’t have access to the source code for a class, or when you don’t\
    \ want to change the source code, or when you want to customize a class in different\
    \ ways. *Posing* involves making one class “pose” as another. Say that you have\
    \ a class, Class1, and another class, Class2, derived from Class1. You can create\
    \ objects of Class1, of course. But you can also tell Class2 to pose as Class1.\
    \ From then on in your code, whenever you create an object of Class1, you’ll really\
    \ be creating an object of Class2.\n"
  mdcn: "\n\n## 第7 章\n\n## 限制访问权限\n\n如果你将类成员标记为 @protected，你也可以限制继承。这种访问修饰符的限制性比 @private\
