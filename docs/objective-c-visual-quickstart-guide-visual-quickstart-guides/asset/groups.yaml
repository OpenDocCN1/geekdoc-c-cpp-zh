    \ its body while \n\na certain condition is true, but unlike the \n\nwhile loop,\
    \ it checks its condition *after* the \n\nloop’s body executes. The do...while\
    \ loop \n\nhas this format:\n\ndo {\n\n  *body*\n\n} while(*condition*);\n\nThe\
    \ do...while loop executes its body and \n\nthen checks the *condition* expression;\
    \ it \n\nit’s true, the loop executes again. When the \n\ncondition is tested\
    \ and turns out to be false, \n\nthe loop stops executing. \n\nWhy do you need\
    \ the do...while loop in \n\naddition to the while loop? You typically use \n\n\
    a do...while loop when the loop condition \n\nis set for the first time within\
    \ the loop: for \n\nexample, if you’re reading from a file and ter-\n\nminating\
    \ the loop at the end of the file, you \n\nneed to try to read from the file at\
    \ least once \n\nto see if the file contains any data for you to \n\nread before\
    \ the loop is terminated.\n\nHere’s an example that displays the message \n\n\
    “You’ll see this five times.” This time, a \n\ndo...while loop was used:\n\n#include <stdio.h>\n\
    \nint main(void)\n\n{\n\n  int loop\\_index = 0;\n\n** do {**\n\n** printf(**\n\
    \n** “You’ll see this five times.\\\\n”);**\n\n** loop\\_index++; **\n\n** } while\
    \ (loop\\_index < 5);**\n\n  return 0;\n\n}\n\n From the Library of Wow! eBook"
- md: "\n## Chapter 2\n\n### Using the do...while Loop\n\nTo use the Objective-C do...while\
    \ loop:\n\n1. Create a new program named **do.m**.\n2. In do.m, enter the code\
    \ shown in **Listing 2.17**. This code creates a do...while loop that executes\
    \ five times.\n3. Add the code to display the message each time through the loop\
    \ and to increment `loop_index`, which is checked by the do...while loop after\
    \ each loop iteration (**Listing 2.18**).\n4. Save do.m.\n5. Run the do.m program.\
    \ You should see the following:\n\nYou’ll see this five times.\nYou’ll see this\
    \ five times.\nYou’ll see this five times.\nYou’ll see this five times.\nYou’ll\
    \ see this five times.\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int\
    \ loop_index = 0;\n    do {\n        .\n        .\n        .\n    } while (loop_index\
    \ < 5);\n    return 0;\n}\n```\n**Listing 2.17** Starting do.m,\n\n```c\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    int loop_index = 0;\n    do {\n        printf(\"\
    You’ll see this five times.\\n\");\n        loop_index++;\n    } while (loop_index\
    \ < 5);\n    return 0;\n}\n```\n**Listing 2.18** The do.m program.\n\n### Directing\
    \ Program Flow\n\n### Using the break Statement\n\nSometimes you may want to break\
    \ out of a loop—that is, terminate it. For example, say that you’re happily printing\
    \ the reciprocals of –1/5 up to 1/5:\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    float loop_index;\n    for (loop_index = 5; loop_index > -5; loop_index--)\n\
    \    {\n        printf(\"1/%2.1f = %10.6f\\n\", loop_index, 1.0/loop_index);\n\
    \    }\n    return 0;\n}\n```\n\nHowever, when you get to 1/0 (division by zero),\
    \ Objective-C will report an error. To avoid that, you can use a break statement\
    \ to break the loop execution before the attempt to divide by 0 occurs:\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    float loop_index;\n    for (loop_index\
    \ = 5; loop_index > -5; loop_index--)\n    {\n        if (loop_index == 0.0) {\n\
    \            break;\n        }\n        printf(\"1/%2.1f = %10.6f\\n\", loop_index,\
    \ 1.0/loop_index);\n    }\n    return 0;\n}\n```\n\nThe break statement causes\
    \ the loop to end—in this case, avoiding division by zero.\n\nTo use the Objective-C\
    \ break statement:\n\n1. Create a new program named **break.m**.\n2. In break.m,\
    \ enter the code shown in **Listing 2.19**. This code prints the reciprocals from\
    \ –1/5 to 1/5, but will report an error for 1/0.\n3. Add the code to break loop\
    \ execution before the attempt to divide by zero (**Listing 2.20**).\n4. Save\
    \ break.m.\n5. Run the break.m program. You should see the following:\n\n1/5.0\
    \ = 0.200000\n1/4.0 = 0.250000\n1/3.0 = 0.333333\n1/2.0 = 0.500000\n1/1.0 = 1.000000\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    float loop_index;\n    for\
    \ (loop_index = 5; loop_index > -5; loop_index--)\n    {\n        printf(\"1/%2.1f\
    \ = %10.6f\\n\", loop_index, 1.0/loop_index);\n    }\n    return 0;\n}\n```\n\
    **Listing 2.19** Starting break.m.\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    float loop_index;\n    for (loop_index = 5; loop_index > -5; loop_index--)\n\
    \    {\n        if (loop_index == 0.0) {\n            break;\n        }\n    \
    \    printf(\"1/%2.1f = %10.6f\\n\", loop_index, 1.0/loop_index);\n    }\n   \
    \ return 0;\n}\n```\n**Listing 2.20** The break.m program.\n\n## Chapter 3\n\n\
    ### Handling Data\n\nThis chapter is all about working with data in Objective-C.\
    \ You’ll use arrays, pointers, and more.\n\nAn array is a set of data items, called\
    \ elements, that you can refer to with an index. For example, if you store numbers\
    \ in an array named `array`, you can address each element with an index like this:\
    \ `array[0]` refers to the first element; `array[1]` refers to the second element;\
    \ and so on. The following code creates an array of five elements, stores a value\
    \ of 5 in `array[0]`, and then displays that value:\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int array[5];\n    array[0] = 5;\n    printf(\"array[0]\
    \ is %i.\\n\", array[0]);\n    return 0;\n}\n```\n\nPointers are special variables\
    \ that hold an address of data items. You can store the address of a variable\
    \ named `integer` in a pointer with the `&` operator like this: `pointer = &integer;`.\
    \ You can then refer to the value of `integer` as `*pointer` like this:\n\n```c\n\
    #include <stdio.h>\n\nint main(void)\n{\n    int integer, *pointer;\n    integer\
    \ = 1;\n    pointer = &integer;\n    *pointer = 2;\n    printf(\"The value of\
    \ the integer is: %i\", pointer);\n    return 0;\n}\n```\n\nPointers are very\
    \ important in Objective-C because you use them to create objects. For example,\
    \ text strings in Objective-C are usually `NSString` objects (the \"NS\" part\
    \ stands for NeXT, the organization that originally created these objects). To\
    \ create a text string in Objective-C, you create a pointer to a `NSString` object.\
    \ You can pass that object the message `cString` to have it return a C-style string\
    \ that `printf()` can print:\n\n```c\n#include <stdio.h>\n#include <Foundation.h>\n\
    \nint main(void){\n    NSString *helloString = @\"Hello there.\";\n    printf(\"\
    %s\\n\", helloString);\n    return 0;\n}\n```\n\n**Tip**: To create objects of\
    \ any class that begins with NS, you must include the Objective-C header file\
    \ (the `#include <Foundation.h>` line in the code here).\n\n### About NS-Class\
    \ Objects\n\nTo create objects of any class that begins with NS, you must include\
    \ the ObjectiveC header file. If you’re using Xcode on the Mac, make sure the\
    \ Foundation option is selected on the New Project page when you create a project.\
    \ If you’re using Objective-C in Windows, Linux, or UNIX, you need a makefile\
    \ named `Makefile` like the following, which compiles a program named `source.m`\
    \ and creates an executable application named `app` (which is `app.exe` in Windows):\n\
    \n```makefile\n$(GNUSTEP_MAKEFILES)/common.make\nTOOL_NAME=app\napp_OBJC_FILES=source.m\n\
    $(GNUSTEP_MAKEFILES)/tool.make\n```\n\nIn Linux and UNIX (not Windows), you also\
    \ have to set up the GNUstep environment variables. You do that in the C shell\
    \ like this: `source <GNUstep root>/System/Library/Makefiles/gnustep.csh`. And\
    \ you do it like this in the Bourne shell: `<GNUstep root>/System/Library/Makefiles/gnustep.sh`.\n\
    \nOn most UNIX systems, `<GNUstep root>` is `/usr/lib/GNUstep`. To run the makefile,\
    \ just change to the directory with the makefile (`Makefile`) and type `make`,\
    \ which creates the executable application in a subdirectory named `obj`. In this\
    \ example, you can run that application by typing `./obj/app`.\n\n### Creating\
    \ Arrays\n\nArrays are sets of elements (which can be of any Objective-C type)\
    \ that you can access using an index value. In the following task, you’ll declare\
    \ an array of five elements, assign the value 5 to the first element `array[0]`,\
    \ and then display that value.\n\nTo create an Objective-C array:\n\n1. Create\
    \ a new program named **array.m**.\n2. In array.m, enter the code shown in **Listing\
    \ 3.1**. This code creates the array named `array` and sets `array[0]` equal to\
    \ 5.\n3. Add the code to display the value in `array[0]` (**Listing 3.2**).\n\
    4. Save array.m.\n5. Run the array.m program. You should see the following:\n\n\
    array[0] is 5\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int array[5];\n\
    \    array[0] = 5;\n    // code to be added\n    .\n    .\n    .\n    return 0;\n\
    }\n```}\n```\n**Listing 3.1** Starting array.m,\n\n```c\n#include <stdio.h>\n\n\
    int main(void)\n{\n    int array[5];\n    array[0] = 5;\n    printf(\"array[0]\
    \ is %i.\\n\", array[0]);\n    return 0;\n}\n```\n**Listing 3.2** The array.m\
    \ program.\n"
  mdcn: "\n\n## 第 2 章\n\n### 使用 do...while 循环\n\n要使用 Objective-C 的 do...while 循环：\n\
    \n1. 创建名为 **do.m** 的新程序。\n2. 在 do.m 中，输入**列表 2.17** 所示的代码。此代码创建了一个执行五次的 do...while\
    \ 循环。\n3. 添加代码以在每次循环时显示消息，并递增 `loop_index`，do...while 循环会在每次循环迭代后检查该 `loop_index`（**列表\
    \ 2.18**）。\n4. 保存 do.m。\n5. 运行 do.m 程序。你应该能看到以下内容：\n\n你会看到这五次。\n你会看到这五次。\n你会看到这五次。\n\
    你会看到这五次。\n你会看到这五次。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int loop_index\
