    \ lastName:(NSString*)last;\n-(void)setName:(NSString*)first lastName:(NSString*)last;\n\
    -(void)print;\n@end\n\n@implementation Friend\n\n-(id)initWithName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    self = [super init];\n    if (self) {\n   \
    \     [self setName:first lastName:last];\n    }\n    return self;\n}\n\n-(void)setName:(NSString*)first\
    \ lastName:(NSString*)last\n{\n    [self setFirst:first];\n    [self setLast:last];\n\
    }\n\n-(void)print\n{\n    printf(\"friend’s name is %s%s\", [firstName cString],\
    \ [lastName cString]);\n}\n\n@end\n```\n**Listing 10.15 friends.m.**\n\n 存储内部对象\n\
    \n在这个任务中，你将继续使用上一个任务中的 `Friend` 类。在这里，你会将姓的名字作为 `NSString` 对象存储在内部。\n\n### 如何存储内部对象：\n\
    \n1. 打开 `friends.m`。\n2. 添加代码将姓的名字作为 `NSString` 对象存储在 `Friend` 对象中（**Listing 10.16**）。\n\
    3. 保存 `friends.m`。\n\n```objectivec\n#import <Foundation/Foundation.h>\n#import\
    \ <stdio.h>\n\n@interface Friend : NSObject\n{\n    NSString *firstName;\n   \
    \ NSString *lastName;\n}\n\n-(id)initWithName:(NSString*)first lastName:(NSString*)last;\n\
    -(void)setName:(NSString*)first lastName:(NSString*)last;\n-(void)setFirst:(NSString*)first;\n\
    -(void)setLast:(NSString*)last;\n-(void)print;\n@end\n\n@implementation Friend\n\
    \n-(id)initWithName:(NSString*)first lastName:(NSString*)last\n{\n    self = [super\
    \ init];\n    if (self) {\n        [self setName:first lastName:last];\n    }\n\
    \    return self;\n}\n\n-(void)setName:(NSString*)first lastName:(NSString*)last\n\
    {\n    [self setFirst:first];\n    [self setLast:last];\n}\n\n-(void)setFirst:(NSString*)first\n\
