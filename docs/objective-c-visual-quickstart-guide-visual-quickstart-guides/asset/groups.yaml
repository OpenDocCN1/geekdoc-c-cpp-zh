    \ if (temperature < 74 && temperature > 70)\n    {\n    }\n    return 0;\n}\n\
    ```\nListing 2.9 启动 logical.m.\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int temperature = 71;\n    if (temperature < 74 && temperature > 70)\n\
