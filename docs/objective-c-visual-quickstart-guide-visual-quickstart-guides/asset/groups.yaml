- md: "\n## Chapter 6\n\n**112\n\n### Creating a Variable for Multiple Object Types\n\
    \n3. Add the code to create two objects of different classes and store those objects,\
    \ one after the other, in the id variable (**Listing 6.12**).\n4. Save id.m.\n\
    5. Run the id.m program. You should see the following:\n\nThis is Class 1.\nThis\
    \ is Class 2.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\n\
    -(void)print\n{\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n@interface Class2:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class2\n-(void)print\n{\n    printf(\"\
    This is Class 2.\\n\");\n}\n@end\n\nint main(void)\n{\n    Class1 *c1 = [Class1\
    \ new];\n    Class2 *c2 = [Class2 new];\n    id container;\n    container = c1;\n\
    \    [container print];\n    container = c2;\n    [container print];\n    return\
    \ 0;\n}\n```\n**Listing 6.12** The id.m program.\n\n**113\n\n### Verifying That\
    \ an Object Belongs to a Class\n\n#### Verifying that an Object Belongs to a Class\n\
    \nYou can determine whether an object is a member of a certain class with the\
    \ isMemberOfClass method. You’ll put that method to use in the next task to verify\
    \ that a certain object is a member of a certain class, here called Class1. You\
    \ can get the class’s name simply by sending it the message class like this: [Class1\
    \ class].\n\n**to use isMemberOfClass:**\n\n1. Create a new program named **isMemberOfClass.m**.\n\
    2. In isMemberOfClass.m, enter the code shown in **Listing 6.13**. This code creates\
    \ the Class1 class.\n\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\n\
    -(void)print\n{\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n...\n```\n**Listing\
    \ 6.13** Starting isMemberOfClass.m.\n\n**114\n\n### Verifying That an Object\
    \ Belongs to a Class\n\n3. Add the code to create an object of the Class1 class\
    \ and verify that the object really is a member of the Class1 class (**Listing\
    \ 6.14**).\n4. Save isMemberOfClass.m.\n5. Run the isMemberOfClass.m program.\
    \ You should see the following:\n\nc1 is a member of Class1.\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n\n-(void)print\n{\n    printf(\"\
    This is Class 1.\\n\");\n}\n@end\n\nint main(void)\n{\n    Class1 *c1 = [Class1\
    \ new];\n    if ([c1 isMemberOfClass:[Class1 class]] == YES ) {\n        printf(\"\
    c1 is a member of Class1.\\n\");\n    }\n    return 0;\n}\n```\n**Listing 6.14**\
    \ The isMemberOfClass.m program.\n\n**115\n\n### Checking an Object's Class with\
    \ isKindOfClass\n\n#### Checking an Object's Class with isKindOfClass\n\nYou can\
    \ also use isKindOfClass to determine whether an object is a member of a class.\
    \ What is the difference between isMemberOfClass and isKindOfClass? You can use\
    \ isKindOfClass to determine whether an object is a member of a class—or of any\
    \ class derived from that class. For example, we’ve been deriving our classes\
    \ from the NSObject class, and while isMemberOfClass wouldn’t detect that fact\
    \ for any class we’ve based on NSObject, isKindOfClass would.\n\n> **tip**: See\
    \ Chapter 7 for all the details on deriving one class from another.\n\n**to use\
    \ isKindOfClass:**\n\n1. Create a new program named **isKind.m**.\n2. In isKindOfClass.m,\
    \ enter the code shown in **Listing 6.15**. This code creates the Class1 class,\
    \ which is based on the NSObject class.\n\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n\
    @end\n\n@implementation Class1\n\n-(void)print\n{\n    printf(\"This is Class\
    \ 1.\\n\");\n}\n@end\n\n...\n```\n**Listing 6.15** Starting isKindOfClass.m.\n\
    \n**116\n\n### Checking an Object's Class with isKindOfClass\n\n3. Add the code\
    \ to use isKindOfClass to determine whether Class1 is a kind of NSObject (**Listing\
    \ 6.16**).\n4. Save isKindOfClass.m.\n5. Run the isKindOfClass.m program. You\
    \ should see the following:\n\nc1 is a kind of NSObject.\n\n```objectivec\n#import\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n\n-(void)print\n{\n    printf(\"\
    This is Class 1.\\n\");\n}\n@end\n\nint main(void)\n{\n    Class1 *c1 = [Class1\
    \ new];\n    if ([c1 isKindOfClass:[NSObject class]] == YES ) {\n        printf(\"\
    c1 is a kind of NSObject.\\n\");\n    }\n    return 0;\n}\n```\n**Listing 6.16**\
    \ The isKindOfClass.m program.\n\n**117\n\n### Verifying That an Object Supports\
    \ a Method\n\n#### Verifying that an Object Supports a Method\n\nIn Objective-C,\
    \ objects can support methods. But do you know if an object supports a particular\
    \ method? To check whether an object supports a method, you can use the respondsToSelector\
    \ function.\n\n**to use:**\n\n1. Create a new program named **responds.m**.\n\
    2. In responds.m, enter the code shown in **Listing 6.17**. This code creates\
    \ the Class1 class that has a method.\n3. Add the code to check whether an object\
    \ responds to print (**Listing 6.18**).\n4. Save responds.m.\n5. Run the responds.m\
    \ program. You should see the following:\n\nc1 responds to print.\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n\n-(void)print\n{\n    printf(\"\
    This is Class 1.\\n\");\n}\n@end\n\n...\n```\n**Listing 6.17** Starting responds.m.\n\
    \n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Class1:NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\n-(void)print\n\
    {\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\nint main(void)\n{\n    Class1\
    \ *c1 = [Class1 new];\n    if (c1 respondsToSelector:@selector(print)]) {\n  \
    \      printf(\"c1 responds to print.\\n\");\n    }\n    return 0;\n}\n```\n**Listing\
    \ 6.18** The responds.m program.\n\n**118\n\n### Whether Objects Support a Method\n\
    \n#### Checking Whether Objects Support a Method\n\nBesides checking whether an\
    \ object supports a particular method, you can check whether a class creates objects\
    \ that support a method. To do that, you use the instancesRespondToSelector method.\n\
    \n**to use:**\n\n1. Create a new program named **instances.m**.\n2. In instances.m,\
    \ enter the code shown in **Listing 6.19**. This code creates the Class1 class\
    \ that supports the print method.\n3. Add the code to check whether objects from\
    \ the Class1 class will support the print method (**Listing 6.20**).\n4. Save\
    \ instances.m.\n5. Run the instances.m program. You should see the following:\n\
    \nClass1 objects have a print method.\n\n```objectivec\n#import <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n-(void)print;\n@end\n\
    \n@implementation Class1\n\n-(void)print\n{\n    printf(\"This is Class 1.\\n\"\
    );\n}\n@end\n\n...\n```\n**Listing 6.19** Starting instances.m.\n\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1:NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n\n-(void)print\n{\n    printf(\"\
    This is Class 1.\\n\");\n}\n@end\n\nint main(void)\n{\n    if ([Class1 instancesRespondToSelector:@selector(print)]\
    \ == YES) {\n        printf(\"Class1 objects have a print method.\\n\");\n   \
    \ }\n    return 0;\n}\n```\n**Listing 6.20** The instances.m program.\n"
