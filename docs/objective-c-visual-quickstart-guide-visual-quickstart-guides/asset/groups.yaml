    \ after division. For example, since 10 divided by 3 is 3 with a remainder of\
    \ 1, 10 % 3 = 1.\n\n| Operator | Function |\n| :--- | :--- |\n| + | Addition |\n\
    | - | Subtraction |\n| / | Division |\n| * | Multiplication |\n| % | Modulus |\n\
    \nTable 1.3 Objective-C Arithmetic Operators\n\n**to use the Objective-C arithmetic\
