    \ 5.12** multipleargs.m 程序。\n\n92\n\n### 在头文件中存储接口\n\n#### 在头文件中存储接口\n\n在 Objective-C\
    \ 中，通常将类的接口部分（由 @interface 关键字声明的部分）放在扩展名为 .h 的其自己的头文件中。为了保持简单，我们在这里没有这样做，但过程非常简单。你只需要将类的\
