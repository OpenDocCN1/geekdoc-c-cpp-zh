- md: "\n## Handling Data\n\n### Interchanging Pointers and Arrays\n\nTo use arrays\
    \ as pointers:\n\n1. Create a new program named **pointersarray.m**.\n2. In pointersarray.m,\
    \ enter the code shown in **Listing 3.13**. This code creates an array and assigns\
    \ the array name to a pointer.\n3. Add the code to display the value of the assigned\
    \ element (**Listing 3.14**).\n4. Save pointersarray.m.\n5. Run the pointersarray.m\
    \ program. You should see the following:\n\n`values[2] = 3.141590`\n\n```c\n#include\
    \ <stdio.h>\nint main()\n{\n    double values[10];\n    double *pointer = values;\n\
    \    pointer[2] = 3.14159;\n}\n```\n**Listing 3.13** Starting pointersarray.m.\n\
    \n```c\n#include <stdio.h>\nint main()\n{\n    double values[10];\n    double\
    \ *pointer = values;\n    pointer[2] = 3.14159;\n    printf(\"values[2] = %10.6f\"\
    , values[2]);\n    return 0;\n}\n```\n**Listing 3.14** The pointersarray.m program.\n\
    \n### Using Strings\n\nYou might think that Objective-C comes with a built-in\
    \ string type, much like built-in float and char, but it doesn’t. Instead, Objective-C\
    \ uses the Foundation class NSString. You first include the Foundation classes\
    \ (which means you have to use a makefile in Windows, Linux, and UNIX); then you\
    \ can create a string object class NSString. As with all Objective-C objects,\
    \ you get a pointer to the object and can initialize your string like this:\n\n\
    ```objc\n#include <Foundation.h>\nNSString *helloString = @\"Hello there.\";\n\
    ```\n\nThe @ sign in front of quoted text indicates that you want to use Objective-C\
    \ style string, not the default C-style strings (Objective-C strings have a lot\
    \ more power built into them than C strings).\n\nTo use Objective-C strings:\n\
    \n1. Create a new program named **string.m**.\n2. In string.m, enter the code\
    \ shown in **Listing 3.15** to create and display a string. To print the string\
    \ with printf(), you’re converting the string to a C-style by sending it the message\
    \ cString (you communicate with Objective-C objects by sending them messages this\
    \ way).\n\n```c\n#include <stdio.h>\n#include <Foundation.h>\nint main(void)\n\
    {\n    NSString *helloString = @\"Hello there.\";\n    printf(\"%s\\n\", [helloString\
    \ cString]);\n    return 0;\n}\n```\n**Listing 3.15** Creating string.m.\n\n3.\
    \ Save string.m.\n4. If you’re using Linux, UNIX or Windows, create a makefile\
    \ named **GNUmakefile**, as shown in **Listing 3.16**, and follow the directions\
    \ in “Creating NS-Class Objects” earlier in this chapter to compile string.m with\
    \ the makefile.\n5. Save GNUmakefile.\n6. Compile and run the string.m program\
    \ (in Linux, UNIX, and Windows, you run the program as ./obj/string). You should\
    \ see the following:\n\n`Hello there.`\n\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME=string\nstring_OBJC_FILES=string.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n\
    ```\n**Listing 3.16** The GNUmakefile file.\n\n### Passing Messages to String\
    \ Objects\n\nAs with other Objective-C objects, you communicate with NSString\
    \ objects by passing them messages. For example, passing a string the message\
    \ length returns its length, and passing it the message substringFromIndex lets\
    \ you get a substring. For example, if you want to convert a string that contains\
    \ an integer into an actual integer, you use the intValue message, which you send\
    \ like this:\n\n`printf(\"The number is %i\\n\", [numberString intValue]);`\n\n\
    To call Objective-C string methods:\n\n1. Create a new program named **stringtoint.m**.\n\
    2. In stringtoint.m, enter the code shown in **Listing 3.17**. This code creates\
    \ a string named numberString, initializes it, and then sends it the message intValue\
    \ to convert it to an integer and print that integer.\n3. Save stringtoint.m.\n\
    4. If you’re using Linux, UNIX or Windows, create a makefile named **GNUmakefile**,\
    \ as shown in **Listing 3.18**, and follow the directions in “Creating NS-Class\
    \ Objects” earlier in this chapter to compile stringtoint.m with the makefile.\n\
    5. Save GNUmakefile.\n6. Compile and run the stringtoint.m program (in Linux,\
    \ UNIX, and Windows, you run the program as ./obj/string). You should see the\
    \ following:\n\n`The number is 5`\n\n```c\n#include <stdio.h>\n#include <Foundation.h>\n\
    int main(void)\n{\n    NSString *numberString = @\"5\";\n    printf(\"The number\
    \ is %i\\n\", [numberString intValue]);\n    return 0;\n}\n```\n**Listing 3.17**\
    \ Creating stringtoint.m.\n\n```makefile\ninclude $(GNUSTEP_MAKEFILES)/common.make\n\
    TOOL_NAME=stringtoint\nstringtoint_OBJC_FILES=stringtoint.m\ninclude $(GNUSTEP_MAKEFILES)/tool.make\n\
    ```\n**Listing 3.18** The GNUmakefile file.\n\n**Tips:**\n- You can find all the\
    \ messages NSString objects can take at http://developer.apple.com/mac/library/documentation/Cocoa/Reference/Foundation/Classes/NSString_Class/Reference/NSString.html.\n\
    - A function like intValue that’s built into an object is called a *method*.\n\
    \n### Using Enumerations\n\nObjective-C lets you define your own named types,\
    \ called enumerations. For example, you can tell Objective-C an enumeration named\
    \ day holds values for the days of the week, like this:\n\n```objc\nenum day {\n\
    \    Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday\n};\n```\n\
    \nYou can then assign a variable of that type to one of those values: `enum day\
    \ today = Friday;`\n\nTo create an enumeration:\n\n1. Create a new program named\
    \ **enumeration.m**.\n2. In enumeration.m, enter the code in **Listing 3.19**.\
    \ This code creates the enumeration and assigns the variable today to one of the\
    \ allowed values.\n\n```c\n#include <stdio.h>\nint main()\n{\n    enum day {\n\
    \        Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday\n    };\n\
    \    enum day today = Friday;\n}\n```\n**Listing 3.19** Starting enumeration.m.\n\
    \n3. Add the code to test whether today is Friday (**Listing 3.20**).\n4. Save\
    \ enumeration.m.\n5. Run the enumeration.m program. You should see the following:\n\
    \n`Today is Friday.`\n\n```c\n#include <stdio.h>\nint main()\n{\n    enum day\
    \ {\n        Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday\n\
    \    };\n    enum day today = Friday;\n    if(today == Friday) {\n        printf(\"\
    Today is Friday.\");\n    }\n    return 0;\n}\n```\n**Listing 3.20** The enumeration.m\
    \ program.\n\n### Creating Functions\n\nThis chapter is all about functions, which\
    \ are chunks of code you can call to make them run—and they won’t run unless you\
    \ call them.\n\nSo far, the code in the programs we’ve discussed has executed\
    \ automatically when the programs start. But functions are different; you have\
    \ to explicitly call a function by name in your code before its code will run.\
    \ That means that using functions, you can divide your code into smaller parts:\
    \ the divide and conquer technique.\n\nIn Objective-C, functions are a crucial\
    \ stop on the way to building your own objects. Objects let you package both data\
