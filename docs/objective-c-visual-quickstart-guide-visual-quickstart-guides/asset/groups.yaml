    \ main.m 程序。\n\n### 捕获未捕的异常\n\n你可以通过调用 `NSSetUncaughtExceptionHandler(fn_ptr)`\
    \ 设置一个特殊函数来捕获所有未处理的异常，其中 `fn_ptr` 是一个函数的指针（类似于标准指针，只是它指向的是形式为 `void UncaughtExceptionHandler(NSException\
    \ *exception)` 的函数）。因此，如果你在其他地方都没有处理异常，它将在 `UncaughtExceptionHandler` 函数中被处理。\n\
