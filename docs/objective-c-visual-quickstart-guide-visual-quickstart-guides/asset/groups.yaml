  - "[PAGE 96]\n\nChapter 5\n\n**88**\n\n**Storing Data in Objects**\n\n**Storing\
    \ Data in Objects**\n\nIn the previous task, you saw how to set up a \n\nmethod\
    \ in an object. But objects can contain \n\nboth methods and data. In this task,\
    \ you’ll see \n\nhow to store data in objects. You’ll also see \n\nhow to pass\
    \ arguments to object methods.\n\nYou set up your data in variables in the \n\n\
    @interface section. Then your code can \n\naccess those variables by name in the\
    \ \n\nmethods in the @implementation section. \n\nFor example, the code here stores\
    \ an integer:\n\n@interface Container: NSObject \n\n{\n\n  int number;\n\n}\n\n\
    \\-(void) setNumber: (int) n;\n\n\\-(int) intValue;\n\n@end\n\n@implementation Container \n\
    \n\\-(void) setNumber: (int) n \n\n{\n\n    number = n;\n\n}\n\n@end\n\nThen you\
    \ can execute an object of this class, \n\nsending it the value 5 to store:\n\n\
    \\[object setNumber: 5\\];\n\n**to store data in an object:**\n\n**1.** Create\
    \ a new program named \n\n**objectdata.m**.\n\n**2.** In objectdata.m, enter the\
    \ code shown in \n\n**Listing 5.9**. \n\nThis code sets up an internal integer\
    \ \n\nnamed number and a method named \n\nsetNumber to store a value in that integer.\n\
    \n#include <stdio.h>\n\n#include <Foundation/Foundation.h>  \n\n@interface Container: NSObject \n\
    \n{\n\n  int number;\n\n}\n\n\\-(void) setNumber: (int) n;\n\n\\-(int) intValue;\n\
    \n@end\n\n@implementation Container \n\n\\-(void) setNumber: (int) n \n\n{\n\n\
        number = n;\n\n}\n\n\\-(int) intValue\n\n{\n\n  return number;\n\n}\n\n@end\n\
    \n        .\n\n        .\n\n        .\n\n**Listing 5.9 **Starting objectdata.m.\n\
    \n From the Library of Wow! eBook"
- md: "\n## Classes and Objects\n\n89\n\n### Storing Data in Objects\n\n- **3.** Create\
    \ an object, set the value of the internally stored number, and display that number\
    \ (**Listing 5.10**).\n- **4.** Save objectdata.m.\n- **5.** Run the objectdata.m\
    \ program.\n\nYou should see the following:\nThe number is 5\n\n```objc\n#include\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Container:NSObject\n\
    {\n    int number;\n}\n\n-(void)setNumber:(int) n;\n\n-(int)intValue;\n\n@end\n\
    \n@implementation Container\n\n-(void)setNumber:(int) n\n{\n    number = n;\n\
    }\n\n-(int)intValue\n{\n    return number;\n}\n\n@end\n\nint main(void)\n{\n \
    \   Container *object = [Container new];\n    [object setNumber: 5];\n    printf(\"\
    The number is %i\\n\", [object intValue]);\n    return 0;\n}\n```\n**Listing 5.10**\
    \ The objectdata.m program.\n\n90\n\n### Passing Multiple Arguments to Methods\n\
    \n#### Passing Multiple Arguments to Methods\n\nWhen you pass multiple arguments\
    \ to a method, you can name the arguments to keep them straight. For example,\
    \ you can create a method that takes two numbers and name the second argument\
    \ second (you can choose any name):\n\n```objc\n-(void)setNumbers:(int) n1 second:(int)\
    \ n2;\n```\n\nThen when you call this method, you specify the value for the second\
    \ argument by name:\n`[object setNumbers: 5 second: 10];`\n\n**to pass multiple\
    \ arguments to a method:**\n\n- **1.** Create a new program named multipleargs.m.\n\
    - **2.** In multipleargs.m, enter the code shown in **Listing 5.11**. This code\
    \ creates the setNumbers method, which can take two arguments.\n\n```objc\n#include\
    \ <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Container:NSObject\n\
    {\n    int number1;\n    int number2;\n}\n\n-(void)setNumbers:(int) n1 second:(int)\
    \ n2;\n\n-(int)intValue1;\n\n-(int)intValue2;\n\n@end\n\n@implementation Container\n\
    \n-(void)setNumbers:(int) n1 second:(int) n2\n{\n    number1 = n1;\n    number2\
    \ = n2;\n}\n\n-(int)intValue1\n{\n    return number1;\n}\n\n-(int)intValue2\n\
    {\n    return number2;\n}\n\n@end\n```\n**Listing 5.11** Starting multipleargs.m.\n\
    \n91\n\n- **3.** Add the code to call the setNumbers method (**Listing 5.12**).\n\
    - **4.** Save multipleargs.m.\n- **5.** Run the multipleargs.m program.\n\nYou\
    \ should see the following:\nThe first number is 5\nThe second number is 10\n\n\
    ```objc\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Container:NSObject\n{\n    int number1;\n    int number2;\n}\n\n-(void)setNumbers:(int)\
    \ n1 second:(int) n2;\n\n-(int)intValue1;\n\n-(int)intValue2;\n\n@end\n\n@implementation\
    \ Container\n\n-(void)setNumbers:(int) n1 second:(int) n2\n{\n    number1 = n1;\n\
    \    number2 = n2;\n}\n\n-(int)intValue1\n{\n    return number1;\n}\n\n-(int)intValue2\n\
    {\n    return number2;\n}\n\n@end\n\nint main(void)\n{\n    Container *object\
    \ = [Container new];\n    [object setNumbers: 5 second: 10];\n    printf(\"The\
    \ first number is %i\\n\", [object intValue1]);\n    printf(\"The second number\
    \ is %i\\n\", [object intValue2]);\n    return 0;\n}\n```\n**Listing 5.12** The\
    \ multipleargs.m program.\n\n92\n\n### Storing the Interface in a Header File\n\
    \n#### Storing the Interface in a Header File\n\nIn Objective-C, it’s common to\
    \ put the interface part of a class (the part declared by the @interface keyword)\
    \ in its own header file with the extension .h. To keep things simple, we’ve not\
    \ been doing that here, but the process is easy. You just store the @implementation\
    \ section of a class in a file such as header.h:\n\n```objc\n#include <Foundation/Foundation.h>\n\
    \n@interface Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)\
    \ n;\n\n-(int)intValue;\n\n@end\n```\n\nThen you include header.h in your program:\n\
    #include \"header.h\"\n\n**to store the interface in a header file:**\n\n- **1.**\
    \ Create a new program named header.m.\n- **2.** In header.m, enter the code shown\
    \ in **Listing 5.13**. This code is just our example that lets you store numbers\
    \ in an object, with the interface section in header.h (make sure you use the\
    \ line #include \"header.h\" at the top of the code).\n\n```objc\n#include \"\
    header.h\"\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n@implementation\
    \ Container\n\n-(void)setNumber:(int) n\n{\n    number = n;\n}\n\n-(int)intValue\n\
    {\n    return number;\n}\n\n@end\n\nint main(void)\n{\n    Container *object =\
    \ [Container new];\n    [object setNumber: 5];\n    printf(\"The number is %i\\\
    n\", [object intValue]);\n    return 0;\n}\n```\n**Listing 5.13** The header.m\
    \ program.\n\n93\n\n- **3.** Save header.m.\n- **4.** Create header.h in the same\
    \ directory as header.m and add the code shown in **Listing 5.14**.\n- **5.**\
    \ Save header.h.\n- **6.** Run the header.m program.\n\nYou should see the following:\n\
    The number is 5\n\n```objc\n#include <Foundation/Foundation.h>\n\n@interface Container:NSObject\n\
    {\n    int number;\n}\n\n-(void)setNumber:(int) n;\n\n-(int)intValue;\n\n@end\n\
    ```\n**Listing 5.14** The header.h file.\n\n94\n\n### Adding the Implementation\
    \ to the Header File\n\n#### Adding the Implementation to the Header File\n\n\
    Objective-C lets you store a class’s implementation (the part that follows the\
    \ @implementation keyword) in a header file in addition to its interface (see\
    \ the previous task).\n\n**to store the interface and implementation in a header\
    \ file:**\n\n- **1.** Create a new program named header2.m.\n- **2.** In header2.m,\
    \ enter the code shown in **Listing 5.15**. This code creates an object of class\
    \ declared in header2.h.\n- **3.** Save header2.m.\n- **4.** Add the code for\
    \ the interface to header2.h (**Listing 5.16**).\n- **5.** Save header2.h.\n-\
    \ **6.** Run the header2.m program.\n\nYou should see the following:\nThe number\
    \ is 5\n\n```objc\n#include \"header.h\"\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \nint main(void)\n{\n    Container *object = [Container new];\n    [object setNumber:\
    \ 5];\n    printf(\"The number is %i\\n\", [object intValue]);\n    return 0;\n\
    }\n```\n**Listing 5.15** The header2.m program.\n\n```objc\n#include <Foundation/Foundation.h>\n\
    \n@interface Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)\
    \ n;\n\n-(int)intValue;\n\n@end\n\n@implementation Container\n\n-(void)setNumber:(int)\
    \ n\n{\n    number = n;\n}\n\n-(int)intValue\n{\n    return number;\n}\n\n@end\n\
    ```\n**Listing 5.16** The header2.h file.\n\n95\n\n### Linking Multiple Files\n\
    \n#### Linking Multiple Files\n\nYou can link multiple files to create a single\
    \ executable. You simply need to modify your make file (makefile) to list all\
    \ the .m files, like this:\n\n```makefile\ninclude $(GNUSTEP)/common.make\nTOOL_NAME\
    \ = main\nmain_OBJC_FILES = main.m container.m\ninclude $(GNUSTEP)/tool.make\n\
    ```\n\nIn this task, you’ll create an executable file on three files: main.m,\
    \ container.h, and container.m.\n\n**to link multiple files:**\n\n- **1.** Create\
    \ a new program named main.m.\n- **2.** In main.m, enter the code shown in **Listing\
    \ 5.17**.\n- **3.** Save main.m.\n- **4.** Create a new file named container.h.\n\
    - **5.** In container.h, enter the code shown in **Listing 5.18**.\n- **6.** Save\
    \ container.h.\n- **7.** Create a new file named container.m.\n\n```objc\n#include\
    \ \"container.h\"\n#include <stdio.h>\n#include <Foundation/Foundation.h>\n\n\
    int main(void)\n{\n    Container *object = [Container new];\n    [object setNumber:\
    \ 5];\n    printf(\"The number is %i\\n\", [object intValue]);\n    return 0;\n\
    }\n```\n**Listing 5.17** The main.m program.\n\n```objc\n#include <Foundation/Foundation.h>\n\
    \n@interface Container:NSObject\n{\n    int number;\n}\n\n-(void)setNumber:(int)\
    \ n;\n\n-(int)intValue;\n\n@end\n```\n**Listing 5.18** The container.h file.\n"
