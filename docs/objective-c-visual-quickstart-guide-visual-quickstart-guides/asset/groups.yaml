    \    *pointer = 2;\n    printf(\"The value of the integer: %i\", *pointer);\n\
    \    return 0;\n}\n```\n\n**Listing 3.10** pointers.m 程序。\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int integer, *pointer;\n    integer = 1;\n    pointer = &integer;\n\
    \    *pointer = 2;\n    printf(\"The value of the integer: %i\", *pointer);\n\
    \    return 0;\n}\n```\n\n###52\n\n### 指运算\n\n如果你指向内存中连续排列的项（例如数组），你可以递增或减少指针以指向下一个或上一个项。下面的示例打印了数组的第一个数字，然后通过递增指针打印第二个数字：\n\
    \n```c\nfloat values[4] = {0.0, 1.0, 2.0, 3.0};\nfloat *pointer = &values[0];\n\
    printf(\"%f\\n\", *pointer);\nprintf(\"%f\\n\", ++pointer);\n```\n\n**使用指针运算：**\n\
    \n1. 创建一个名为 **pointermath.m** 的程序。\n2. 在 pointermath.m 中，输入**Listing 3.11** 中的代码。这段代码指向数组的第一个元素并打印它。\n\
    3. 添加代码递增指针并打印下一个元素（**Listing 3.12**）。\n4. 保存 pointermath.m。\n5. 运行 pointermath.m\
    \ 程序。你应该看到：\n   0.000000\n   1.000000\n\n**Listing 3.11** 开始 pointermath.m。\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n    float values[4] = {0.0, 1.0, 2.0,\
    \ 3.0};\n    float *pointer = &values[0];\n    printf(\"%f\\n\", *pointer);\n\
    \    return 0;\n}\n```\n\n**Listing 3.12** pointermath.m。\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    float values[4] = {0.0, 1.0, 2.0, 3.0};\n    float *pointer\
    \ = &values[0];\n    printf(\"%f\\n\", *pointer);\n    printf(\"%f\\n\", ++pointer);\n\
    \    return 0;\n}\n```\n\n"
