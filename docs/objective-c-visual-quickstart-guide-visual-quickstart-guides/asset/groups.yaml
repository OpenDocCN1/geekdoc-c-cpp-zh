    \    return 0;\n}\n```\n**列表 2.17** 开始 do.m，\n\n```c\n#include <stdio.h>\n\nint\
    \ main(void)\n{\n    int loop_index = 0;\n    do {\n        printf(\"You’ll see\
    \ this five times.\\n\");\n        loop_index++;\n    } while (loop_index < 5);\n\
    \    return 0;\n}\n```\n**列表 2.18** do.m 程序。\n\n### 指导程序流\n\n### 使用 break 语句\n\
    \n有时，你可能想要跳出循环——即终止它。例如，假设你正在快乐地打印从 -1/5 到 1/5 的倒数：\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    float loop_index;\n    for (loop_index = 5; loop_index\
    \ > -5; loop_index--)\n    {\n        printf(\"1/%2.1f = %10.6f\\n\", loop_index,\
    \ 1.0/loop_index);\n    }\n    return 0;\n}\n```\n\n然而，当你遇到 1/0（除以零）时，Objective-C\
