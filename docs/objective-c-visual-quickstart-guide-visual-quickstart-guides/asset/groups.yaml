- md: "\n## Working with Object-Oriented Inheritance\n\nThis chapter discusses the\
    \ process of deriving one class from another—a process called *inheritance*.\n\
    \nYou can derive one class from another in Objective-C. The class you derive from\
    \ is called the *base class*, and the new class you’re deriving from the base\
    \ class is called the *derived class*.\n\nThe derived class can inherit all the\
    \ functionality of the base class, and it can customize that functionality as\
    \ well. For example, you might have a base class named Animal that creates a generic\
    \ animal. The Animal class might have a method to set the animal’s name, `setName`,\
    \ and another to get the animal’s name, `getName`. Then, no matter what kind of\
    \ animal you want to create, Animal can serve as a base class for it, and all\
    \ the derived animals will have built-in `setName` and `getName` methods.\n\n\
    You might use Animal as a base class for other classes, such as Cat and Dog. If\
    \ you create a class named Cat, for example, you might want more than just `setName`\
    \ and `getName` methods; for instance, you might also want to add your own method,\
    \ the `meow` method, which prints out “Meow.”\n\nIf you also derive a class named\
    \ Dog from the Animal class, you might add a method named `bark` to it.\n\nThe\
    \ Cat class would then have the methods `setName`, `getName`, and `meow`. The\
    \ Dog class would have the methods `setName`, `getName`, and `bark`. So as you\
    \ can see, although the Dog and Cat classes share some functionality, because\
    \ they are both classes of animals, they also have been customized.\n\nThat’s\
    \ the idea behind inheritance: you use inheritance when you want to create classes\
    \ that share some functionality. Using inheritance, you can save a lot of work.\
    \ In this example, in addition to the Cat and Dog classes, you might use the Animal\
    \ class to derive the Tiger, Leopard, Lion, Squid, and Ocelot classes.\n\nYou\
    \ can also have multi-level inheritance. So, for example, you might use the Dog\
    \ class as the base class for the Terrier and Collie classes.\n\n- **tip**: Although\
    \ inheritance in Objective-C is a powerful tool, it lacks some capabilities found\
    \ in C++ and some other object-oriented programming languages. For instance, it\
    \ lacks operator overloading and also multiple inheritance (in which a single\
    \ class can inherit from multiple other classes).\n\n## Inheriting from a Class\n\
    \nWe’ll start by taking a look at how to inherit one class from another. In fact,\
    \ the programs you’ve been working with have already been inheriting classes from\
    \ NSObject, and extending that capability to any class is easy.\n\nHere, you’ll\
    \ create one class, Class1, based on NSObject:\n\n```objectivec\n@interface Class1\
    \ : NSObject\n@end\n```\n\nThen you’ll create another class, Class2, based on\
    \ Class1:\n\n```objectivec\n@interface Class2 : Class1\n@end\n```\n\nThese classes\
    \ won’t actually do anything—we’re just looking at the syntax of inheritance at\
    \ this point. In the subsequent tasks, you’ll add data members and methods to\
    \ base and derived classes.\n\n**to inherit from a class:**\n\n1. Create a new\
    \ program file named **inheritance.m**.\n2. In inheritance.m, enter the code shown\
    \ in **Listing 7.1** to create Class1 and base Class2 on it.\n3. Display a message\
    \ in the main() function to indicate that the inheritance worked (**Listing 7.2**).\n\
    4. Save inheritance.m.\n5. Run the inheritance.m program. You should see the following:\n\
    \   The inheritance worked.\n\n**Listing 7.1** Creating inheritance.m.\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n\
    @end\n\n@implementation Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation\
    \ Class2\n@end\n```\n\n**Listing 7.2** The inheritance worked program.\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n\
    @end\n\n@implementation Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation\
    \ Class2\n@end\n\nint main(void) {\n    printf(\"The inheritance worked.\\n\"\
    );\n    return 0;\n}\n```\n\n## Inheriting Base-Class Data Members\n\nWhen you\
    \ base one class on another, all data members not declared @private are accessible\
    \ in the derived class. In this example, you’ll declare a data member named `data`\
    \ in the base class and reference it from an object of the derived class.\n\n\
    **to inherit base-class data:**\n\n1. Create a program named **inheritdata.m**.\n\
    2. In inheritdata.m, enter the code highlighted in **Listing 7.3**. This code\
    \ creates Class1 with a data member named `data` and derives a class named Class2\
    \ based on it. Note that `data` is declared @public, which makes it accessible\
    \ from code in the base class, the derived class, and any other code in the program.\n\
    \n**Listing 7.3** Starting inheritdata.m.\n```objectivec\n#import <stdio.h>\n\
    #include <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n{\n    @public\n\
    \    int data;\n}\n@end\n\n@implementation Class1\n@end\n\n@interface Class2 :\
    \ Class1\n@end\n\n@implementation Class2\n@end\n```\n\n3. Add code to create an\
    \ object of the derived class, Class2, and access the data member using that object\
    \ (**Listing 7.4**).\n4. Save inheritdata.m.\n5. Run the inheritance.m program.\
    \ You should see the following:\n   The data is 5.\n\n**Listing 7.4** The inheritdata.m\
    \ program.\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n{\n    @public\n    int data;\n}\n@end\n\n@implementation\
    \ Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation Class2\n\
    @end\n\nint main(void) {\n    Class2 *c2 = [Class2 new];\n    c2->data = 5;\n\
    \    printf(\"The data is %i.\\n\", c2->data);\n    return 0;\n}\n```\n\n## Inheriting\
    \ Base-Class Methods\n\nWhen a derived class inherits a base class, the methods\
    \ of the base class are available to you in the derived class unless they’re marked\
    \ @private. In this task, a derived class will inherit a base class that has one\
    \ method, and the derived class will add a new method. Then you’ll call both methods\
    \ to verify that they work as they should.\n\n**to inherit base-class methods:**\n\
    \n1. Create a program named **inheritmethods.m**.\n2. In inheritmethods.m, enter\
    \ the new code highlighted in **Listing 7.5**. This code creates Class1 and Class2,\
    \ each with a built-in method.\n\n**Listing 7.5** Starting inheritmethods.m.\n\
    ```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Class1 : NSObject\n-(void)print;\n@end\n\n@implementation Class1\n-(void)print\
    \ {\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n@interface Class2 : Class1\n\
    -(void)print2;\n@end\n\n@implementation Class2\n-(void)print2 {\n    printf(\"\
    This is Class 2.\\n\");\n}\n@end\n```\n\n3. Add the code to create an object of\
    \ the derived class and call both the base class method and the derived class\
    \ method to verify that they work (**Listing 7.6**).\n4. Save inheritmethods.m.\n\
    5. Run the inheritmethods.m program. You should see the following:\n   This is\
    \ Class 1.\n   This is Class 2.\n\n**Listing 7.6** The inheritmethods.m program.\n\
    ```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface\
    \ Class1 : NSObject\n-(void)print;\n@end\n\n@implementation Class1\n-(void)print\
    \ {\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n@interface Class2 : Class1\n\
    -(void)print2;\n@end\n\n@implementation Class2\n-(void)print2 {\n    printf(\"\
    This is Class 2.\\n\");\n}\n@end\n\nint main(void) {\n    Class2 *c2 = [Class2\
    \ new];\n    [c2 print];\n    [c2 print2];\n    return 0;\n}\n```\n"
  mdcn: "\n\n## 使用面向对象的继承\n\n本章讨论了从一个类派生出另一个类的过程——这一过程被称为*继承*。\n\n在 Objective-C 中，你可以从一个类派生出另一个类。你所派生的类称为*基类*（base\
    \ class），而基于基类派生的新类称为*派生类*（derived class）。\n\n派生类可以继承基类的所有功能，也可以对这些功能进行自定义。例如，你可能有一个名为\
    \ Animal 的基类，它创建一个通用的动物。Animal 类可能有一个用于设置动物名称的方法 `setName`，以及另一个用于获取动物名称的方法 `getName`。那么，无论你想创建什么种类的动物，Animal\
    \ 都可以作为它的基类，所有派生的动物都将拥有内置的 `setName` 和 `getName` 方法。\n\n你可能会将 Animal 作为其他类（如 Cat\
    \ 和 Dog）的基类。例如，如果你创建一个名为 Cat 的类，你可能需要的不仅仅是 `setName` 和 `getName` 方法；例如，你可能还会添加你自己的方法，即\
    \ `meow` 方法，用于打印“Meow”。\n\n如果你也从 Animal 类派生出一个名为 Dog 的类，你可能会向它添加一个名为 `bark` 的方法。\n\
    \n那么，Cat 类将拥有 `setName`、`getName` 和 `meow` 方法。Dog 类将拥有 `setName`、`getName` 和 `bark`\
    \ 方法。正如你所看到的，尽管 Dog 和 Cat 类共享某些功能，但由于它们都是动物类，它们也经过了自定义。\n\n这就是继承背后的思想：当你想要创建共享某些功能的类时，就可以使用继承。通过使用继承，你可以节省大量工作。在这个示例中，除了\
    \ Cat 和 Dog 类之外，你可能还会使用 Animal 类派生出 Tiger、Leopard、Lion、Squid 和 Ocelot 类。\n\n你还可以实现多级继承。例如，你可能会使用\
    \ Dog 类作为 Terrier 和 Collie 类的基类。\n\n- **tip**：尽管 Objective-C 中的继承是一个强大的工具，但它缺乏\
    \ C++ 以及一些其他面向对象编程语言中具备的功能。例如，它缺乏运算符重载，也缺乏多重继承（即一个类可以继承自多个其他类）。\n\n## 继承类\n\n\
    我们将首先看看如何从一个类派生出另一个类。事实上，你一直编写的程序已经在从 NSObject 继承类，而将这种能力扩展到任何类都是很容易。\n\n在这里，你将基于\
    \ NSObject 创建一个类，Class1：\n\n```objectivec\n@interface Class1 : NSObject\n@end\n\
    ```\n\n然后，你将基于 Class1 创建另一个类，Class2：\n\n```objectivec\n@interface Class2 : Class1\n\
    @end\n```\n\n这些类实际上不会执行任何操作——我们只是在查看继承的语法。在后续任务中，你将向基类和派生类添加数据成员和方法。\n\n**继承一个类：**\n\
    \n1. 创建名为 **inheritance.m** 的新程序文件。\n2. 在 inheritance.m 中，输入 **Listing 7.1** 所示的代码以创建\
    \ Class1 基于其上的基类 Class2。\n3. 在 `main()` 函数中显示一条消息以表示继承成功（**Listing 7.2**）。\n4.\
    \ 保存 inheritance.m。\n5. 运行 inheritance.m 程序。你应该看到以下内容：\n   The inheritance worked.\n\
    \n**Listing 7.1** 创建 inheritance.m。\n```objectivec\n#import <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n@end\n\n@implementation\
    \ Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation Class2\n\
    @end\n```\n\n**Listing 7.2** 继承成功的程序。\n```objectivec\n#import <stdio.h>\n#include\
    \ <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n@end\n\n@implementation\
    \ Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation Class2\n\
    @end\n\nint main(void) {\n    printf(\"The inheritance worked.\\n\");\n    return\
    \ 0;\n}\n```\n\n## 继承基类数据成员\n\n当你将一个类建立在另一个类之上时，所有未声明为 @private 的成员在派生类中都是可访问的。在这个示例中，你将在基类中声明一个名为\
    \ `data` 的数据成员，并从派生类的对象引用它。\n\n**继承基类数据：**\n\n1. 创建一个名为 **inheritdata.m** 的程序。\n\
    2. 在 inheritdata.m 中，输入 **Listing 7.3** 中高亮的代码。该代码创建了带有 `data` 数据成员的 Class1，并基于它派生出一个名为\
    \ Class2 的类。注意 `data` 被声明为 @public，这使得它可以从基类、派生类以及程序中的任何其他代码访问。\n\n**Listing 7.3**\
    \ 开始 inheritdata.m。\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n{\n    @public\n    int data;\n}\n@end\n\n@implementation\
    \ Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation Class2\n\
    @end\n```\n\n3. 添加代码创建派生类 Class2 的对象，并使用该对象访问数据成员（**Listing 7.4**）。\n4. 保存 inheritdata.m。\n\
    5. 运行 inheritdata.m 程序。你应该看到以下内容：\n   The data is 5.\n\n**Listing 7.4** inheritdata.m\
    \ 程序。\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\n\
    @interface Class1 : NSObject\n{\n    @public\n    int data;\n}\n@end\n\n@implementation\
    \ Class1\n@end\n\n@interface Class2 : Class1\n@end\n\n@implementation Class2\n\
    @end\n\nint main(void) {\n    Class2 *c2 = [Class2 new];\n    c2->data = 5;\n\
    \    printf(\"The data is %d.\\n\", c2->data);\n    return 0;\n}\n```\n\n## 继承基类方法\n\
    \n当派生类继承基类时，除非标记为 @private，否则基类的方法在派生类中是可用的。在这个任务中，派生类将继承一个有一个方法的基类，并添加一个方法。然后你调用这两个方法以验证它们运行正常。\n\
    \n**继承基类方法：**\n\n1. 创建一个名为 **inheritmethods.m** 的程序。\n2. 在 inheritmethods.m 中，输入\
    \ **Listing 7.5** 中高亮的代码。该代码创建了 Class1 和 Class2，每个都有内置方法。\n\n**Listing 7.5** 开始\
    \ inheritmethods.m。\n```objectivec\n#import <stdio.h>\n#include <Foundation/Foundation.h>\n\
    \n@interface Class1 : NSObject\n-(void)print;\n@end\n\n@implementation Class1\n\
    -(void)print {\n    printf(\"This is Class 1.\\n\");\n}\n@end\n\n@interface Class2\
    \ : Class1\n-(void)print2;\n@end\n\n@implementation Class2\n-(void)print2 {\n\
    \    printf(\"This is Class 2.\\n\");\n}\n@end\n```\n\n3. 添加代码创建派生类的对象，并调用基类方法和派生类方法以验证它们工作正常（**Listing\
    \ 7.6**）。\n4. 保存 inheritmethods.m。\n5. 运行 inheritmethods.m 程序。你应该看到以下内容：\n   This\
    \ is Class 1.\n   This is Class 2.\n\n**Listing 7.6** inheritmethods.m 程序。\n```objectivec\n\
    #import <stdio.h>\n#include <Foundation/Foundation.h>\n\n@interface Class1 : NSObject\n\
    -(void)print;\n@end\n\n@implementation Class1\n-(void)print {\n    printf(\"This\
    \ is Class 1.\\n\");\n}\n@end\n\n@interface Class2 : Class1\n-(void)print2;\n\
    @end\n\n@implementation Class2\n-(void)print2 {\n    printf(\"This is Class 2.\\\
    n\");\n}\n@end\n\nint main(void) {\n    Class2 *c2 = [Class2 new];\n    [c2 print];\n\
    \    [c2 print2];\n    return 0;\n}\n```\n\n"
