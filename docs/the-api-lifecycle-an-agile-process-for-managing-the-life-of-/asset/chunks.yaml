  trans: '


    既然你的 API 已经经历了其生命中的所有阶段，它可能已经完全改变，也可能保留了大部分原始形态。现在由于我们已经充分掌握了每个阶段，在这一部分，我们将考虑采用“敏捷”思维对于开发和维护
    API 意味着什么，并提供有助于加速这一过程的有用资源。


    # 10. 什么是敏捷 API？


    ![](img/image00108.jpeg)


    敏捷。API。API。敏捷。听起来很悦耳，但它真的如此吗？“敏捷”已成为一个流行词，往往伴随着许多误解。在一次 Nordic APIs 大会上，来自 Beepsend
    SMS 解决方案的 Christian Nilsson 探讨了在 API 领域下真正敏捷的含义，并提供了 6 条建议，帮助 API 提供者确定“敏捷”对他们来说真正意味着。


    ## 10.1 什么是敏捷？


    敏捷可以定义为解决问题的方法、一种软件开发流程以及一种业务流程。正如其字面意思所暗示，敏捷是精简、灵活且充满激情的，并且快速应对变化的能力。


    对于 Nilsson 来说，敏捷有三个共同主题：


    1. 敏捷是拆解事物——但没有到让他们崩溃的地步。

    2. 敏捷意味着你可以快速转变业务策略。

    3. 敏捷不能被之前的决策负担。


    ### 敏捷 API 误解 #1：如果你不敏捷，你就不会。


    通常，服务越接近终端消费者，在响应问题时越需要敏捷。正如 Nilsson 所说：“互联网用户是反复无常的花变的。他们充满好奇心。他们会瞬间离开你的服务。”


    然而，有些业务天生就是僵化的。当这些业务增加与终端消费者的距离时，它们变得不那么敏捷而更稳定。这为业务赢得了更强的可靠性声誉，对于银行等灵活性较低的行业来说，这是一个极具市场价值的特征。


    服务应该问自己：**为什么我们需要这个 API？** “敏捷”对我们和我们的业务模型意味着什么？它对我们合适吗？对我们的客户合适吗？最后，根据 Nilsson
    的说法，“你并不会因为敏捷就自动成功，你成功是因为你对自己的核心模式充满热情。”


    ### 敏捷 API 误解 #2：只有一种完美的软件开发流程。


    很多时候，项目管理工具被抛给软件开发人员，是为了让他们在透明的环境中工作得更快。但软件开发流程随需求而异，相应的工具应该支持——而不是强制你的软件开发流程。


    API 项目经理应该从评估其开发团队的规模和构成开始，并批判性地分析团队试图共同解决的问题。考虑到这些因素，正确的开发策略自然会产生，通常直接源于对该主题的小组讨论。


    ### 敏捷 API 误解 #3：你的系统是安全的。


    安全并不始于终于智胜黑客。现如今，无论你的系统有多安全，你都在不断与无数的脚本、人为错误和隐蔽的密码作斗争。在这个不断不稳定且不安全的世界里，人们不应该放松警惕并假设一切将保持稳定。


    像 [Heartbleed](http://mashable.com/2014/04/10/heartbleed-programmer/) 这样的漏洞在互联网上游荡，系统依赖项可以随时被更改——例如
    `AWS` 最近强制的 `MySQL` 更改。克服这些障碍的方法是通过中心化配置，这确保了保持系统更新不是劳动密集型工作。你必须对技术中的任何漏洞保持警惕，并确保所有开发者都采取积极措施避免跨站脚本攻击([XSS
    漏洞](http://en.wikipedia.org/wiki/Cross-site_scripting))）。


    *关于实现 API 安全检查的深度研究，请查看：[API 安全：深度解析 OAuth 和 OpenID Connect](http://nordicapis.com/api-security-oauth-openid-connect-depth/)*


    ### 敏捷 API 误解 #4：你广泛的 SLA 和 EULA 会救你。


    Paypal 的 `SLA` 包含了 97 页内容。服务水平协议 (`SLA`) 或最终用户许可协议 (`EULA`) 的现实是，它是最理想的情况。某些用户不可避免地不当使用服务。你的团队或客户有多少次金钱和耐心为了琐事诉到法庭？你可能喜欢你的
    `SLA` 或 `EULA` 创造了一种恐惧感，但 Nilsson 认为，API 提供者应该对消费者更有吸引力，而不是用冗长的用户协议吓走他们。


    ### 敏捷 API 误解 #5：你的 API 是“特殊的”。保守好你的秘密配方。


    根据 Nilsson 的说法，代码中已经没有秘密了。业务的“秘密配方”真正在于执行。秘密配方在于你如何适应并转型波动的市场。这是你实践敏捷的方式。这也是你提供极佳客户服务的方式。


    > “如果你的秘密是没有人弄清楚你使用什么技术，那么你就完蛋了，你没完了，你无可救了。你的秘密必须是你的员工、你的 DNA、你的业务模式、你改变的能力……”


    技术只是你用以支持员工并帮助他们追求卓越的又一个渠道。此外，如果你对你的技术保密，当出现问题时，你能依靠谁？围绕开放代码和协作建立的社区可以帮助 API 的价值大幅增加；这正是[全球范围内智慧城市](http://nordicapis.com/how-apis-are-driving/)
    正在意识到的。


    ### 敏捷 API 误解 #6：NoSQL 是驱动所有 API 的未来。


    Nilsson 认为，用于存储和检索数据的 NoSQL 并不如宣传的那样。他承认 `NoSQL` 有解决许多问题的能力，但认为它不能解决所有问题。正如编程开发世界中的所有事物一样，解决方案需要是敏捷的。通常这意味着将
    `NoSQL` 与关系数据库等解决方案配合。


    ## 10.2 结论


    API 提供者必须根据其定位整合创意解决方案。在构建敏捷 API 时，你必须记住所有因素，并遵循之前章节概述的四个阶段，你应该准备好响应你的团队需求、业务需求以及终端客户的需求。


    # 11. 第三方工具


    现在，你充满信心并准备好出发，但在管理 API 方面可能仍需要一些指导。我们汇集了以下协助 API 提供者的流行第三方工具——从文档、监控到安全解决方案——我们在书中提到过或推荐使用的工具。此列表并不意味着详尽，而是我们感兴趣的精选列表。


    易于生成 API 文档的框架。


    *   [Apiary](https://apiary.io/)

    *   [API Blueprint](https://apiblueprint.org/)

    *   [Swagger](http://swagger.io/)

    *   [APIMATIC](https://apimatic.io/)

    *   [REST United](http://restunited.com/)

    *   [3Scale](http://www.3scale.net/)

    *   [Apigee](https://apigee.com)

    *   [Axway](https://www.axway.com/)

    *   [Mashery](http://www.mashery.com/)

    *   [Mulesoft](https://www.mulesoft.com)

    *   [SmartBear](http://smartbear.com/product/ready-api/overview/)


    允许提供者监控其 API 或 API 依赖活动的服务。


    *   [API Changelog](https://www.apichangelog.com/)

    *   [APIMetrics](http://apimetrics.io/)


