  trans: '


    由于您的开发者门户将是所有与 API 相关活动的核心，它应该提供轻松访问以下所有资源：


    *   **[API 文档](http://nordicapis.com/spark-api-adoption-good-documentation-practises/
    "如何通过良好的文档实践促进 API 采纳")**：这可能是最重要的资源，文档应始终保持更新，并提供快速开始使用您的 API 所需的所有信息。

    *   **应用注册**：提供任何开发者都能理解的、易于遵循的注册流程。该过程的输出应该是一个 `API Key`，或者如果您使用 OAuth，则为 `Client
    ID` 和 `Secret`。

    *   **API 控制台**：开发者通常希望在不编写任何代码的情况下测试您的 API。可以提供一个 [API 控制台](http://nordicapis.com/html-hypermedia-apis-and-adaptive-web-design/)或者提供可以复制粘贴的现成代码。这种对
    API 功能的初印象应该是简洁且强大的。

    *   **SDKs**：测试之后，您的开发者将希望在现有的应用程序内部调用 API。提供合适的 SDK，并遵循每种编程语言的打包和安装标准。例如，如果您提供
    Ruby SDK，请将其作为 Ruby gem 的形式提供。

    *   **公告**：让您的观众随时了解与您的 API 相关的任何动态。宣布所有即将进行的 API 更改和其他相关活动。

    *   **用例**：提供您的观众能够产生共鸣的全面用例。用使用您的 SDK 的示例代码进行补充。比起阅读完整的参考文档，通过故事来理解您的 API 如何工作容易得多。

    *   **支持**：直接从您的开发者门户提供简单的支持通道。当开发者有疑问时，他们应该能够在门户内部联系您的支持团队。对支持请求提供快速反馈并始终进行跟进。

    *   **外部资源链接**：链接到有助于开发者使用您的 API 的外部资源。让您的文档链接到您所遵循的标准，并提供相关的社交媒体链接，以便开发者关注您的公告。


    如果您实现了所有的建议，您将拥有一个卓越的 API 开发者门户，但您仍然需要吸引开发者加入。网站活动应与对 API 和开发者门户使用情况的永久监测相结合，这样您才能正确衡量引力。


    ### 6.3 使用不同的引流渠道


    为了获得尽可能的结果，培养 API 用户群应该通过多个不同的渠道进行。在此过程中，您应该衡量每个渠道的活动并进行相应调整。正如您将看到的，营销渠道具有不同的成本，您应该理解获取每个新开发者的平均成本是多少。


    在产品世界中，这个值通常被称为`客户获取成本`或 `CAC`，可以作为模型来确定是否应该放弃任何渠道。除此，您还应该估计从每个使用您 API 的新开发者那里获得的未来总收入。`客户生命周期价值`或
    `CLTV` 定义了每个开发者平均将产生多少收入。


    ![](img/image00101.jpeg)


    为了[盈利](http://nordicapis.com/5-ways-apis-will-increase-revenue/ "API 增加收入的五种方法)，您应该始终确保
    `CAC` 小于 `CLTV`。否则，您为开发者支付的费用将超过从他们身上获得的潜在未来收入。考虑到这一点，让我们来看一些可能的引流渠道。


    #### 推广您的 API


    推广是大多数流行 API 所使用的方法之一。推广通常通过面对面与开发者小组见面，分享关于您的 API 如何使用的故事来进行。所谓的“API 传道者”用于通过在线媒体以及通过参加面向开发者的聚会、会议和其他相关活动来线下地推广
    API。


    自然地，这种类型的推广成本范围可能几乎为零——特别是如果您自己自己在网上做这些工作——但如果您雇佣一组专门的传道者来参加每一个可能的开发者会议，成本可能会更高。要务实，，从小开始，并在过程中衡量您的结果。


    #### 黑客松、活动、会议


    ![](img/image00102.jpeg)


    另一种流行的引流方法是通过举办黑客松或面向开发者的活动来推广您的 API。黑客松可能针对特定的行业或主题，并且通常是基于位置的——这允许您针对特定的目标群体，并发现和推广可以在其他渠道上展示的新型用例。


    #### 集成与合作伙伴关系


    获得引力的一种有趣方法是将您的 API 与其他产品和 API 的增长挂钩。可以通过创建集成来实现，让使用其他产品的开发者能够轻松获取并使用您的 API。集成通常针对特定的用例，因此仔细研究哪种用例会吸引最多的开发者。某些集成可能非常简单——例如编写代码并发布指南——但在某些情况下，您可能需要参与合作伙伴关系的开发。


    在这里，成本将主要与软件开发活动相关——但不要忘记，在集成上线后您还需要对其进行维护和支持。


    ### 6.4 支持您的 API


    支持越接近您的观众，效果越好。了解您的 API 消费者通常在哪里寻求帮助，并在那些地方发声。不要强迫您的开发者使用从他们的角度来看不合理的特定工具和流程，否则您将开始看到他们在在使用不顺后开始放弃您的
    API。


    增长支持通道的一种简单方法是保持开放。让与 API 相关的活动尽可能公开透明，意味着您的支持团队将花费更少的时间回答相同的请求。


    #### 使用 GitHub


    [GitHub](https://github.com/) 被认为是最受欢迎的友好的服务，API 提供商应该认真对待它。通过使用他们的免费计划，您可以创建一个仓库来提供易于使用的支持通道。GitHub
    提供了一种管理与代码更改相关问题并与开发者开放互动的方法。遵循这种方法的的一个示例公司是 Spotify，他们一直通过 GitHub 公开他们所有与 API
    相关的 `https://github.com/spotify/web-api/issues "Spotify Web API 问题`。


    #### 其他面向开发者的支持工具


    研究您的开发者群体，了解他们最常使用哪些其他网络服务。在这些平台上拥有席之地也很重要。流行的服务包括 [Stack Overflow](http://stackoverflow.com/
    "Stack Overflow")、特定的 [subreddits](http://www.reddit.com/ "reddit")、[Twitter](https://twitter.com/
    "twitter") 或 [Facebook](https://www.facebook.com/ "Facebook")。虽然社交媒体不是特定的支持通道，但您它可以对开发者对您的
    API 可能提出的任何问题提供快速反馈。记住始终开放并提供有帮助的回复。


    ## 7. API 指标重要性


    ![](img/image00103.jpeg)


    成功和失败是相对主观的术语——对于一家企业成功的定义对另一个企业可能被认为是失败，某些性能领域成功的相对标准可能会随行业之间、部门之间而变化，甚至根据[具体情况而异](http://nordicapis.com/open-data-how-to-make-it-work-for-your-business/)。这种预期、结果和影响的波动性可能会使
    API 文档、实现和支持成为一项艰巨的任务。


