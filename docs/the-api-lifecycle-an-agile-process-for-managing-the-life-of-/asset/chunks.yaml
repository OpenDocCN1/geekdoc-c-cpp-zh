- fmt: '

    If you’re not 100% sure about how your API will be used you can always offer an
    SDK in several popular programming languages. [Algolia](https://www.algolia.com/
    "Algolia"), a search engine API, is following this approach by offering an easy
    way to use their service in languages such as Ruby, Python, Node, PHP or Objective-C.
    Be aware though that maintaining a large number of SDKs is not an easy task as
    your API evolves and methods change. [APIMATIC](https://apimatic.io/ "APIMATIC")
    and [REST United](http://restunited.com/ "REST United") are two services that
    offer automatic SDK generation. With these tools, whenever your API changes you
    can rerun the SDK generation to make fresh code versions available to your consumers.


    ### 4.2 API Management


    After you implement your API endpoints and decide how consumers will interact
    with your API, you must consider ongoing operations. The most important factors
    are controlling your API access conditions and determining how to behave in usage
    peaks. You can follow a DIY approach or use an API management service such as
    [3scale](http://www.3scale.net/ "3scale") or [Apigee](https://apigee.com/ "Apigee").


    Whatever solution you choose, remember that you’ll become tied to the way it works.
    Carefully define long term objectives as well as common scenarios you want to
    address. If you choose a solution that doesn’t offer what most of your API consumers
    use, then you’ll likely be forced to pivot in the long term.


    #### Access Control


    One of the most important aspects of API Management is defining and automating
    the process of [controlling who can access your API](http://nordicapis.com/building-a-secure-api/)
    and what measures are in place to enable access limitation, if needed.


    Most API Management platforms provide some sort of access control features, including
    API call limit rating and consumer differentiation with the help of different
    paid plans. The very first access control feature to look for is how your API
    will authenticate and authorize consumers.


    There are several options depending on what kind of consumers you’ll have and
    what kind of usage will occur:


    *   **API keys**: the most simple way to control access to your API. Usually you’ll
    have to issue one API key for each consumer and identification will be provided
    through an `HTTP` header on each and every call.

    *   **OAuth 2**: perhaps the most popular authorization standard used by Web APIs.
    OAuth 2 lets you combine token-based authentication with fine-grained access control
    based on user scopes. This is the best solution whenever API consumers are making
    calls on behalf of other users.

    *   **Origin IP address**: this can be combined with other access control methods
    or used on its own. Using it alone is done in cases where you’re providing an
    API to a very limited audience. To achieve better results you should also add
    origin information to your logs and usage analytics.


    Whatever access control strategy you choose, always remember that it must accommodate
    your API’s most popular use cases. As an example, it doesn’t make sense to use
    a simple API key based authentication if your main API usage is through a mobile
    app. In this case it would make sense to use OAuth and let the mobile app act
    on behalf of its users.


    ### 4.3 Maintenance


    While launching your API can be an exciting challenge, keeping it up and running
    is often seen as something boring. API maintenance is often delegated to a second
    plan and only considered after things start to go wrong. Don’t follow this path;
    implement a good maintenance plan from the start.


    The usual activities around maintaining your API are related to [documentation](http://nordicapis.com/using-templates-for-documentation-driven-api-design/),
    communication with consumers and proactively understanding if something is not
    working as expected. As such, a big part of maintenance is done by periodically
    testing your API to make sure that everything is working as documented.


    #### Testing


    One way to proactively understand if your API is performing according to the documentation
    you provide and following your quality-of-service is to [run periodic tests](http://nordicapis.com/api-design-testing-state-art/
    "API Design & Testing State of the Art") against individual endpoints. With monitoring
    in place, if any of the tests fail, you can hopefully fix the error before your
    consumers experience problems. These types of tests can be performed on your API:


    *   **Performance-oriented**: individual calls to each and every method your API
    provides. If a response takes longer than a specified time limit, it means that
    there’s a problem on that specific endpoint.

    *   **Functional testing**: this type of testing works by making singular calls
    to each API method to thoroughly test every API function, using different kinds
    of payloads, or even sending data that will produce errors. Responses are then
    compared to the expected behavior to locate errors.

    *   **Use case testing**: this is a more sophisticated type of test and can be
    achieved by combining calls to different endpoints into a single test. Each test
    should expect a specific response and execution time limit.


    There are several tools that can help you run API tests periodically in an automated
    fashion. [POSTMAN](http://www.getpostman.com/ "POSTMAN"), for example, is a [Chrome
    app](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop?hl=en
    "POSTMAN") that lets you run all the tests mentioned above. There is also the
    [SmartBear](http://smartbear.com/product/alertsite-uxm/capabilities/monitor-apis/)
    suite of API monitoring tools. If you’re looking for something more SaaSy you
    can try [Runscope](https://www.runscope.com/ "Runscope"), a service that periodically
    runs tests and reports on their results. Other helpful monitoring solutions include
    [APImetrics](http://apimetrics.io/) and [API Science](https://www.apiscience.com/
    "API Science").


    #### Managing Changes


    Even if everything is working as expected, sometimes you’ll need to introduce
    changes to your API. When this happens, consider the impact on your consumers
    and internal systems by:


    *   **Informing consumers about changes**: establish a clear communication channel
    between you and developers using your API to inform them of changes in a transparent
    fashion.

    *   **Keeping compatibility with previous versions**: ensure that any introduced
    change doesn’t break what was working. Remember that your API consumers may not
    be able to update their systems immediately.

    *   **Minimizing downtime**: don’t bring systems to a halt — even momentarily.
    Your build and deployment processes should guarantee that API changes won’t affect
    API calls and functionalities. API downtime might create downtime or loss of quality
    on the consumer side, so keep it to an absolute minimum.


    Downtime can be minimized by following a [Continuous Integration](http://en.wikipedia.org/wiki/Continuous_integration)
    approach and testing your code thoroughly before deploying. Making sure that there
    are no breaking changes can be achieved by following a sound API versioning strategy.
    If you offer and maintain different versions of your API, consumers won’t feel
    the changes on the version they’re using. A helpful solution that bridges the
    gap between API doc changes and the consumer is the [API Changelog](https://www.apichangelog.com/),
    a tool that automatically discovers changes to your API documentation and informs
    subscribers.


    ![](Images/image00094.jpeg)


    Check out our [Winter Collection eBook](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) as
    well - a collection of our best advice from the 2014-2015 winter season


    ## 5. 12 Design Tips


    ![](Images/image00095.jpeg)

