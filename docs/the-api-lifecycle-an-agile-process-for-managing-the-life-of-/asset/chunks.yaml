    这是最显而易见的变现方法——直接对其收费。但仅仅因为易于衡量并不意味着它会成功。Zazueta 表示，“如果你的数据具有人们愿意为其付费的价值，那么这种策略就会起作用。”在着手之前，你应该与客户交谈，看看他们是否愿意为这些服务付费，以及愿意付多少。


    直接销售可能是销售你的 `API` 最简单的方法，但 Zazueta 说，这可能也是最具挑战性的方法，因为你的开发者受众可能很难看出它的价值。他建议从 `Freemium
    Model`（免费增值模式）开始，让开发者体验一下他们可以访问的数据“滋味”，并希望这能让他们意欲未尽。


    ### 2.3 API 变现技巧 #2：将 API 访问作为溢价推销的机会


    这是 SaaS 世界中经常使用的一种小技巧，例如 POS 巨头 Salesforce。在 `Premium`（高级版）订阅中添加 `API` 访问可以为升级到更高级别的提供强有力的动力，因为它允许终端用户更轻松地定制自己的体验和工作流。`API`
    访问通常是订阅高级软件包时附带的多个额外福利之一，这使得这种变现模型更难衡量。Zazueta 提供了这些衡量此模型的尝试：


    1. 比较包含 `API` 的软件包与不包含软件包的销售情况。

    2. 让你的销售团队在销售备注中标记“对 API 的关注程度”。

    3. 衡量使用该 `Premium` 软件包用户的 `API` 调用次数。

    4. 衡量活跃 `API` 用户与非活跃用户产生的 `ARPU` 或收入。


    此外，你还可以衡量 `API` 用户与不使用该软件包功能的用户之间订阅续费率的对比。


    ### 2.4 API 变现技巧 #3：通过你的 API 驱动产生收入的活动


    这种模型跟踪起来最困难，因为它通常支持间接收入。根据情况，它可能是最符合你整体业务目标的 API 变现方法。


    例如，电子邮件营销软件通常通过发送的邮件进行变现，但 `APIs` 用于从客户关系管理软件 (`CRM`) 中自动过滤联系人。没有联系人，你就无法发送电子邮件，这就是为什么通过
    `API` 接入联系人的数量是证明其价值的极佳方法。此外，你可以对比使用 `API` 的用户与未使用 `API` 的用户是否发送更多邮件——这会影响收入。


    另一种方法是跟踪你的应用程序是否真的驱动了线索。如果你与客户签署了按线索付费 (`PPL`) 协议，你可以通过 `CRM` 跟踪该线索。对于这两种情况，如果集成了多个第三方应用程序，跟踪将变得复杂，意味着需要进行越来越细粒度的测量。


    ### 2.5 API 变现技巧 #4：通过战略合作伙伴扩大分


    在 SaaS 世界，将你的 `API` 与战略合作伙伴集成有可能让你的 `API` 进入整个预设市场。这使你能够向更广泛的受众推广品牌，吸引更多潜在客户。例如，PayPal
    和 Stripe 允许服务商和卖家使用他们的 `API`，因为它提供了一种简单的付款方式，而且，交易越多，这些热门支付服务的赚得就越多。


    这种策略也有助于用户留存。如果你的客户同时也订阅了你的战略集成伙伴，他们就不可能因为离开你们任何一方而中断工作流。对于不断提出要求的终端用户来说，这些战略合作伙伴的价值是不言而疑的，他们现在可以使用这些集成云工具构建定制化的工作流。此外，这类集成正在不断增加：


    “我们看到最佳解决方案的兴起是下一个自然演进，”[Zendesk 帮助台软件](http://zendesk.com) 产品高级副总裁 Adrian McDermott
    说道。“如果互联网是平台，那么对单一提供商集成的需求就过时了——多个最佳解决方案可以通过互联网无缝运行，而不需要由一个组织来监督。”


    对于战略合作伙伴，创建一个互利共利的共享数据协议是重要的。你想知道你的 `API` 在多大程度上帮助了他们的业务，同样，他们也想知道他们的产品对你的产品的影响。


    ### 2.6 API 变现技巧 #5：提高运营效率并缩短上市时间


    “构建良好、设计良好的 `APIs` 可以帮助你更快地构建应用程序。它帮助你更快地创新。更重要的是，它帮助你更快地失败，”Zazueta 说，“如果你构建了一个安全且管理良好的
    `API`……而且你将那些内部的受众视为你的客户，你实际上可以获得各种极好的收益。”Zazueta 说，他看到某些公司的内部流程从几个月加快到了几个小时，仅仅是因为从
    `API` 中获得的效率。


    使用内部 `API` 的一些额外收益包括：

    * 更快的客户入驻

    * 对数据的更深访问

    * 对开发的更紧密控制

    * 更快的应用程序构建

    * 更快的应用程序收入潜力的测试


    内部 `APIs` 也适用于精益创业模式，即你尽可能快地生产并将其推向市场。在这种情况下，如果 `API` 并不那么有用，你的组织就没有浪费大量的时间和资源来实现它——你能够快速转型。


    由于这是内部收益，你不需要使用 `ARPU` 来衡量它。你可以从衡量引入 `API` 之前之后构建和引入特定功能所需的时间开始。你还可以通过所需的人力将其转换为美元。当然，在采取此行动之前，你需要确保设计并开始在内部使用
    `API` 不会花费过多的精力和资源。


    ### 2.7 混合、匹配、衡量 API 变现模型


    现实是，你的 API 变现策略可能涉及这些模型的组合。可能没有模型完全适合你的情况，但可能某些 API 变现技巧有助于产生收入。


    “这里的目标是建立一个推动业务实现目标的 API 程序，”Zazueta 说，“一个无法做到点的程序不会长久。”


    ### 2.8 你的 API 变现清单


    我们创建此清单是为了让你轻松判断自己是否能够快速对 API 进行变现。“是”或“可能”都值得考虑


    1. 你能否通过直接对你的 `API` 收费获利？

    2. 提供 `API` 访问可以作为一种溢价推销的机会吗？

    3. 是否有通过你的 API 间接驱动收入的方法？

    4. 是否有战略合作伙伴合作伙伴的机会？

    5. `API` 能否提高运营效率并缩短上市时间？


    那么，在实施 API 变现策略时，有两个问题时刻记在脑中：

    * 你是否对每个可能的 API 相关收入来源衡量了用户平均收入 (`ARPU`)？

    * 你是否正在将此 `ARPU` 与未使用你 `API` 的客户的 `ARPU` 进行对比？


    ## 3. 理解你的目标 API 消费者


    ![](img/image00090.jpeg)


    消费者画像是任何业务创业的必要第一步。在本章中，我们将涵盖帮助在 API 特定背景下理解你目标用户的策略。


    ### 3.1 应对日益多样化的消费者


    '
- fmt: '

    Within any economy showing such exponential growth, the `diversity` of its players
    will naturally increase as the market evolves. It’s a fact that the `API` space
    is becoming increasingly diverse — it’s not the old days where a few independent
    developers created mashups for fun. `APIs` have entered [large business dealings](http://nordicapis.com/apis-are-evolving-the-b2b-landscape-2/),
    gained the attention of [enterprise-level product designers](http://blog.apiary.io/2015/05/03/The-Role-of-the-API-Designer/),
    led to the creation of [multi-billion dollar startups](http://www.betaboston.com/news/2014/07/03/uber-mobile-app-cloud-service-api/),
    influenced [creative marketing campaigns](http://nordicapis.com/apis-part-of-the-creative-palette/),
    and more.


    So, with all this new interest from varying audiences, `API` providers may be
    asking: **who are we selling to?**


    At Nordic APIs, we’ve tracked the explosion of this innovation, watching as new
    players step up to play ball — either connecting or striking out in deprecation.
    [With more and more consumers entering the API space](http://nordicapis.com/what-is-the-future-of-the-api-space/),
    it’s now more important than ever to consider the large breadth of `specializations`
    amongst third party developers. These factors take the form of:


    * varying technical understanding

    * different industry backgrounds

    * geographical location

    * online activity

    * `API` use cases

    * protocol preferences

    * programming language preferences

    * …and more.


    [Mike Kelly](https://twitter.com/mikekelly85) runs [Stateless.co](http://stateless.co/),
    an `API` strategy consulting firm based in London. He describes the wide breadth
    of developers currently in the space:


    > “There are of course broad categories such as system integrators, mobile, web,
    embedded systems. In reality there are innumerable forms of developers each with
    their own set of constraints and requirements, which is why developing a set of
    realistic developer personas is important.”


    ### 3.2 Why Create a Developer “Persona?”


    Traditional business models necessitate a process of consumer profiling. The same
    can be done in a way that makes sense for this niche `API` sector. Intimately
    understanding your target consumer is crucial as it will influence the following:


    * **Market Fit**: Knowing your consumer can help you discover unmet needs in the
    market your `API` could potentially satisfy.

    * **Functionality**: Understanding use cases can help design `API` functions around
    that need.

    * **Segmentation**: Knowing your user can help segment marketing efforts and decrease
    customer acquisition cost.

    * **Creative Marketing**: Knowing what your audience is interested in will help
    tailor your marketing to this audience, influencing your message, tone, appearance,
    design, style, and more to attract your target audience.


    Kelly goes on to mention the importance of establishing developer personas is
    that they establish an important `frame of reference`:


    > “If you’re unable to clearly describe your target customers and their use cases
    for your `API`, that usually indicates that the underlying proposition is not
    focused enough. Likewise, if you’re unable to clearly determine how a proposed
    feature provides immediate value to one of your personas, that is a strong indicator
    that it doesn’t belong on the roadmap yet…I’m a huge fan of any methodology that
    encourages approaching the strategy and design of an `API` by focusing on the
    client side, rather than the server side.”


    ### 3.3 The Developer Brain


    ![](Images/image00091.jpeg)


    ‘Know your demographic.’ ‘Understand the `psychology` of your consumer.’ We hear
    phrases like this frequently in general business discussion. Is it possible to
    apply the same philosophy to marketing `APIs`?


    Developers are not your average consumer. In a conversation with Nordic APIs,
    General Manager [Jason Hilton](https://twitter.com/catchyjason) of [Catcy Agency](http://catchyagency.com/),
    an international developer program management outfit, pinpointed the following
    attributes. The developer brain is naturally `analytical.` They appreciate `authenticity`.
    And in a sea of competing tools with rampant overzealous marketing, they have
    the right to be `skeptical`. A web developer especially wants to pick up and play
    with a product, expecting an `instant proof` that it behaves as advertised.


    Take these generalizations as you will, but they’re worth to consider when developing
    a marketing message and story applicable to this certain audience. Both content
    and aesthetics can either incorporate or alienate depending on their execution.
    Creating a developer portal, for example, should, in response to our brief psychological
    examination, be intuitively designed, with `transparent` information, an `attractive
    layout`, and `interactive` modules that allow one to test `API` calls.


    ### 3.4 But Plenty of Other People Are Interested in APIs, Too!


    [Andreas Krohn](http://andreaskrohn.se/) of Dopter urges us to consider a wider
    scope with `API` marketing and evangelism. Instead of focusing so heavily on developers,
    `API` providers should create more inclusionary *customer* personas.


    > “I strongly dislike how developers are worshipped in marketing”


    In his work at [Dopter](https://twitter.com/dopterse), an `API` strategy and consulting
    firm, Krohn routinely encounters providers that want to create hackathons to reach
    out to *developers* to promote their `APIs`. Though that can be an effective strategy,
    *are developers really the sole audience that may be interested in APIs?* The
    truth is that designers, entrepreneurs, marketers, and other business leads are
    just as important constituents to consider when marketing an `API`.


    Krohn believes we naturally target developers for the following reasons:


    1. `APIs` are technical.

    2. Developers relate to other developers.

    3. Influence of Silicon valley.

    4. Myth of the single developer.


    Though many people that are aware of APIs are developers, not *everyone* is a
    developer. We must remember that the world is bigger than Silicon Valley. Just
    as the average smartphone user can brainstorm innovative app ideas without needing
    to code, there is a similar low bar that allows anyone to understand the possibilities
    APIs offer. In a company, products are developed by large teams — entrepreneurs,
    project managers, designers, etc. Developers are crucial to any software process,
    but in reality a diverse array of experiences contribute to innovation.


    ### 3.5 Expanding our Portal: End User Evangelism


    If we incorporate a wider audience into our understanding of their target API
    consumer, how does that change the way an `API` is marketed?


    Krohn encourages us to remember that *real* value is only created when an **end
    user** uses the app that’s created with the `API`. And who creates that experience?
    Entrepreneurs may create the product, managers oversee production, designers envision
    the user experience, developers connect the backend, and other domain experts
    may contribute. All these stakeholders intimately understand the value of `API`
    integrations, and thus all their perspectives and **needs** should be considered.


    Think of standard web `API` portals as they are now. Can entrepreneurs immediately
    discern the **end user value** when they view `API` documentation? More often
    than not, their needs are excluded. There is a lack of high-level summary and
    sample use cases to inspire non-technical minds — this experience is often non-existent.


    Krohn believes that developer evangelism should rather be end user evangelism.
    As Krohn says, “be aware of who you are including or excluding, and make it a
    conscious decision.” Think you know your target audience? that may soon change.


    ![As the API space increases in diversity, more and more attributes make up the
    developers using them](Images/image00092.jpeg)

