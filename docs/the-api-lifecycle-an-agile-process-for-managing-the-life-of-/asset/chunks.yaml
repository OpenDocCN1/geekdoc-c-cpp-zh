    \nThe need to understand your audience is applicable throughout the entire lifecycle.\
    \ If you are updating, versioning, or performing major redesigns on an existing\
    \ API, you need to carefully respond to the `feedback` from your users to make\
    \ the new version as good as possible.\n\n[Marjukka Niinioja](http://nordicapis.com/speakers/marjukka-niinioja/),\
    \ Senior Consultant and Manager at [PlanMill](http://www.planmill.com/) shares\
    \ her experience with leveraging user feedback during a major redesign: developing\
    \ PlanMill’s new [RESTful API](http://www.planmill.com/planmill-rest-api-1-5/),\
    \ UI, and back-end architecture.\n\nPlanMill payed close attention to the feedback\
    \ they were receiving internally, noticing three main recurring points:\n\n1.\
    \ The API was too complex for the developers to use.\n2. The documentation was\
    \ not sufficient.\n3. The error handling needed work.\n\nUsing this feedback,\
    \ and by testing and consuming the API themselves, the PlanMill team was able\
    \ to hone in on important aspects to consider during redeployment. The takeaway\
    \ is that if you are redesigning an API, you are poised to release killer API\
    \ improvements — as you already have `real world data on how API functionality\
    \ is used`, which can be repurposed to improve efficiency and overall API user\
    \ experience.\n\n![](Images/image00096.jpeg)\n\n### Who pays the price for complexity?\n\
    \nNordic APIs veteran [Ronnie Mitra](https://www.linkedin.com/in/ronniemitra)\
    \ of [API Academy](https://twitter.com/mitraman) argues that complexity is necessary\
    \ — what should be avoided instead is confusion. Mitra contends “*it is a designers\
    \ job to reduce confusion and embrace complexity in their business domain*.”\n\
    \nThere has been a move toward simpler products and simpler interface designs.\
    \ Mitra, an expert in developer experience and API design, advocates for smartly\
