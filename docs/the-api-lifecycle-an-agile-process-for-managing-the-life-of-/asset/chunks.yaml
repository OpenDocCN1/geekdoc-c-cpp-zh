    ## Fedex


    At the time of this writing, [Fedex](http://images.fedex.com/us/developer/downloads/FXF_Automation_XML_Tracking_change.pdf)
    is in the process of updating its APIs to Fedex Web Services, replacing XML-based
    tracking applications with a large redesign.


    ### 8.5 Retirement Reason #4: Versioning


    Versioning is by far most common reason to retire an API. Since APIs are a relatively
    new technology for most businesses, you’ll often see `v1`, `v2`, or `v3`, still
    in use today. Similar to OS upgrades on devices, it’s often easier to scrape and
    replace an entire version when instigating large change. Versioning can arise
    when major edits to the API parameters or new usage controls are required.


    Some alarming changes that dramatically affect developers and end users may be
    quietly hidden within new API version documentation. Functionalities may be erased,
    permissions limited, classes altered, etc. As versioning is a common component
    to many API’s lifecycles, we don’t intend to create an exhaustive list of them
    all. Rather, these two examples of version updates came with them a few surprises
    for developers and end users…


    ### YouTube


    YouTube, in the process of migrating to the YouTube Data API `v3`, surprised users
    when it was found that Data `v3` would no longer support the YouTube app on expensive
    Smart TVs.


    ### Twitter v1


    Twitter’s `v1` was finally retired in 2013. Being the [3rd most popular API](http://www.programmableweb.com/news/most-popular-apis-least-one-will-surprise-you/2014/01/23)
    in use today, the announcement [sparked worry throughout the developer community](http://www.itworld.com/article/2712336/unified-communications/the-death-of-the-twitter-api-or-a-new-beginning-.html)
    that simplistic integration was a thing of the past. The update added `OAuth`,
    requiring client keys and the creation of an app with Twitter. According to [Mathew
    Mombra](https://twitter.com/mombrea), these changes were likely instigated to:


    *   enforce call rate limiting with less liberal access

    *   reduce their system load

    *   decrease API vulnerability

    *   promote their embeddable tweet program


    ### 8.6 Retirement Reason #5: Security Concern


    A consideration of many large-scale retirements, API providers may choose to discontinue
    a public API specifically because of the security concerns associated with making
    internal data and processes public.


    #### Google Earth API


    The API was shutdown because it relied on [NPAPI Framework](http://en.wikipedia.org/wiki/NPAPI),
    an outdated technology Google mentioned had become a security concern.


    #### SnapChat


    Though SnapChat never technically has released a public API, the popular app has
    spawned a variety of mashups on various platforms that all tap into their “private”
    API. This went unchecked, until early 2015 when SnapChat partnered with the Windows
    store to crack down on these rogue applications.


    ## 9. Preparing For a Deprecation


    ![](Images/image00106.jpeg


    Entire software ecosystems can quickly emerge that depend upon APIs to survive.
    And just as quickly, they can be destroyed. As these third-party developers have
    depended on your service to support their own products, complete shutdowns can
    inherently cause very negative reactions. This is why any change to your API requires
    the proper preparation and communication, whether it be small edits, versioning,
    or complete deprecation.


    ### 9.1 Rippling Effects


    Though most clients are quick to adapt, some may be unaware of API changes. This
    means they won’t respond quickly to update their system to be compatible with
    new versions. Stagnancy, freezed dependencies, forgotten forks, and inactive projects
    can be common with APIs that have been active for a while.


    Mircea F. Lungu, a computer science researcher at Bern in Switzerland, found that
    when deprecating API methods or classes, the total adaptation time within an ecosystem
    can vary tremendously. The amount of time between the first reaction and the last
    reaction can be months, or even years.


    In his study on the case of the [SmallTalk ecosystem of 2,000 consumers](http://www.slideshare.net/mircea.lungu/how-do-developers-react-to-api-deprecation-the-case-of-a-smalltalk-ecosystem),
    Lungu found that 14% of deprecated methods induced negative rippling effects within
    the ecosystem, and 7% of deprecated classes triggered ripple effects. Only 16%
    of deprecations had a systematic replacement, which meant that most edits were
    done manually. Thus, any changes to an API induces ripples that can have far-reaching
    results.


    ### 9.2 Preparing For Developer Reaction


    In order to keep good face with your community, we recommended transparency using
    the following techniques to prepare for an API’s retirement.


    *   **Schedule a retirement plan:** Offer at least a 6 month time frame for complete
    deprecation. This will hopefully give teams sufficient time to seek new integrations
    or partnerships. Consider extending this time frame if certain teams are struggling.
    [Google Maps](https://developers.google.com/maps/terms) and [Youtube](https://developers.google.com/youtube/terms#deprecation)
    follow a one year announcement to deprecation policy.

    *   **Make changes in stages:** Tier your retirement plan in a way that aligns
    with past promises. If still running, shut down older versions earlier. Twitter
    has created retirement timelines in the past.

    *   **Public announcements:** Write and promote a blog post that explicitly outlines
    API changes, when they will go into effect, who will be effected, and any other
    vital information your community needs to know. Disseminate this information to
    your dedicated social accounts.

    *   **Ease the transition:** If your API is being consolidated, versioned, or
    merged into a separate service, ease the process with a migration guide and FAQ.
    For example, when Google Maps Data transferred over, they created a [Data Liberation
    Tool](http://maps-data-liberation.appspot.com/) to offer a complete download of
    data or transfer to their new console.

    *   **Use blackout testing:** Blackout testing is a planned shutdown of all API
    functions for a short window of time. This is helpful for developers to see how
    the absence of the API is going to affect their systems, and also acts as a call
    to action for developers to update their code. The Youtube API, [Twitter API](http://www.adweek.com/socialtimes/twitter-scheduling-blackout-tests/477207),
    [Mendeley API](http://blog.mendeley.com/developer-resources/mendeley-api-blackout-testing/),
    and many others have used blackout testing in the past.

    *   **Don’t violate your own terms of service:** Review your Terms of Service
    to ensure that you have no binding contracts for continuing support before you
    pull the plug. A smart way to plan ahead is to write a deprecation policy whenever
    a new API version is created.


    # V The Agile Mindset


    ![](Images/image00107.jpeg


    Each phase of the API Lifecycle should not be considered static. Progression is
    often non-linear, meaning information garnered in a phase should simultaneously
    affect other ends. Iterative communication between stages is critical for influencing
    smart progression and arriving at a sustainable internal ecosystem.


    ![](Images/image00077.


    For example, if you receive multiple feedback complaints from customers not satisfied
    with a certain operation, alterations should be induced that only effect Development,
    but inform Analysis, and perhaps even Retirement.

