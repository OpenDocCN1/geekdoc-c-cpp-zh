  raw: 'It’s true that even traditionally non-digital companies, such as Bechtel,
    a construction and engineering firm, Dun & Bradstreet, a business information
    company, and [Marvel comics](http://developer.marvel.com/docs) have succeeded
    in creating awesome platforms. At the end of the day, [every company should consider
    how they can use APIs to excel their business](http://nordicapis.com/should-every-company-consider-providing-an-api/).


    Many organizations develop an API to extend their current functionalities. On
    the other hand, some businesses move toward API platformitization, positioning
    the API as a **core value.** Many [facial recognition](http://blog.mashape.com/list-of-10-face-detection-recognition-apis/),
    natural [language processing](http://blog.mashape.com/list-of-25-natural-language-processing-apis/),
    and [machine learning services](http://blog.mashape.com/list-of-50-machine-learning-apis/)
    do just that.


    ### 1.3 Perform Market Research


    As with any business endeavor, it’s vital to take a look at what competitors are
    doing in your sector to gauge the competition. Market research is a critical component
    of your pre-launch strategy. Use existing [API discoverability tools](https://www.apirise.com/8-api-discovery-tools/)
    to bolster your research.


    Depending on the success of other APIs in the field, it may help promote alternative
    methods or protocols within your API. Create an account and perform test calls
    with a competitor’s API, and imagine how the experience could be improved. This
    will help refine where there is room for your product in the market.


    ### 1.4 Align Your API With Business Objectives


    An API should either boost pre-existing operations or work toward overall company
    goals in some way. In our eBook [Developing the API Mindset](http://nordicapis.com/developing-the-api-mindset-private-partner-and-public-apis/)
    we defined a taxonomy of three types of APIs: Private, Partner, and Public. Each
    have their own benefits and potential drawbacks. API providers may consider using
    multiple strategies to leverage their API and justify their Return on Investment
    (ROI).


    #### The Private API Strategy


    ![](Images/image00084.jpeg)


    Types of industries that flourish using an internal API are ones that need their
    data secured, or ones that wouldn’t profit from distributing their data. These
    businesses greatly benefit from a method of streamlining internal operations.
    For example, banks commonly use internal APIs to transfer funds and achieve internal
    efficiency.


    The **benefits** of a private API may be:


    *   Streamlines internal operations


    *   Consolidates distribution channels


    *   Data is not exposed publicly, boosting security


    Potential **drawbacks** may be:


    *   Potential revenue streams are not accessible


    *   Not as many developers are aware that your API exists


    #### The Partner API Strategy


    ![](Images/image00085.jpeg)


    Many enterprise applications choose to partner their API with trusted partners
    in large data exchange dealings. Take the [ESPN sports API](http://developer.espn.com/docs),
    for example. Their public API was reigned in as it was decreasing the value of
    their primary distribution channel. Now ESPN API integrations are being done partner
    organizations.


    **Benefits** of opening up an API for B2B exchange:


    *   Data is not entirely exposed publicly, retaining security and data control


    *   B2B dealings could potentially produce large revenue and mutually beneficial
    data exchanges


    *   Spreads assets to reputable, established services with pre-existing markets


    Potential **drawbacks** of a sole partner strategy may be:


    *   Some revenue streams are not accessible via open means


    *   No open developer ecosystem is created, awareness is still limited


    #### The Public API Strategy


    ![](Images/image00086.jpeg)


    The Public API is what we often mean when we talk about web APIs. This is a service
    opened to third-party developers to integrate into their apps. Anything from social
    networks, rideshares, project management apps, data processing tools, and more
    are common areas where a service is opened for third party developers to consume
    in a mutually beneficial exchange. With this strategy, the provider may charge
    usage fees, or create a free-to-consume platform to spread brand awareness.


    **Benefits**:


    *   Extending a service’s brand to additional apps aids marketing and [awareness](http://nordicapis.com/3-steps-to-increasing-brand-awareness-with-apis/)


    *   Could produce a profitable ecosystem if developers are willing to pay for
    your service


    *   Potentially improves experience for more end users


    **Drawbacks**:


    *   Select assets are exposed for public, losing data privatization


    *   With greater awareness comes greater risk of security threat


    *   Third-party apps may not be as reputable or established


    *   Timeline for ROI is increased


    ### 1.5 Select Your API Business Plan


    Estimating financial returns from an API can be difficult to perceive. With Public
    APIs, for example, revenue generation from third-party apps can take twice the
    normal time, as you must wait for a second product’s lifecycle to reach sustainable
    operations and acquire end users. In free-to-consume scenarios, the offering may
    not directly generate revenue, but may boost brand awareness that could ultimately
    lead to growth or even help leverage deals within an acquisition.


    John Musser, founder of API Science, believes that “API business models are not
    size fits all,” having identified at least [20 variations in API business models](http://www.slideshare.net/jmusser/j-musser-apibizmodels2013)
    throughout his work in the space.


    Tiered subscription, pay as you go, freemium, unit based, revenue share - there
    are many monetization possibilities, and in the end, most APIs have a diversified
    ROI system that fits their service. In the next chapter, we’ll discuss ways to
    monetize your API.


    ![](Images/image00087.jpeg) For more on API business strategy check out [Developing
    The API Mindset](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ## 2\. Monetization Models


    ![](Images/image00088.jpeg)


    Before development, it’s crucial to consider how your API will boost overall revenue.
    This last Analysis Stage chapter guides you to doing just that. We offer you the
    top **5 API monetization models** with the hope of helping you, as an API provider,
    bring value to developers and end users, and financially gain from hosting your
    API.


    ### 2.1 How Can You Measure If Your API Is Profitable?


    [Rob Zazueta](https://twitter.com/rzazueta) is the [director of platform strategy
    at Intel](http://www.mashery.com/services/strategy-services). His team focuses
    on helping clients manage, market, and monetize APIs by identifying strategies
    to align with business objectives. At his talk last October at the 2014 Nordic
    Platform Summit in Stockholm, Zazueta focused on the third tier of Intel’s approach:
    **how to monetize your API.**


    According to Zazueta, “The success of an API program is measured by how well it
    moves a business toward its goals.” With everything your business does, you must
    keep an eye on your return on investment. To avoid an unsuccessful venture, before
    API development you need to consider common steps toward API monetization and
    if they apply to your situation.


    In order to determine if something is going to be profitable you must measure
    it. Zazueta recommends using a simple Average Revenue Per User Model (ARPU) to
    help decide how to increase revenue, whether by increasing price or attracting
    more users. With any API monetization model, you want to compare the ARPU of your
    API-using customers against the ARPU of those who don’t.


    ![](Images/image00089.jpeg)


    ### 2.2 API Monetization Trick #1: Charge Directly for an API, by Call or Subscription'
