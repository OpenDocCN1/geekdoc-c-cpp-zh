- fmt: '

    Luckily, those who work with APIs have a secret tool that can make sense of the
    hectic world of performance evaluation — `metric analysis`. Proper use of metric
    analysis can allow businesses to understand their consumers and aid in further
    development and implementation of user-friendly and effective APIs.


    In this piece, we’ll take a look at metric analysis to demonstrate how it can
    be used to amplify success within the API space. We’ll suggest types of metrics
    to analyze, demonstrate a theoretical application of metric analysis, and discuss
    two real-life examples of success and failure arising from differing metric analysis
    methodologies. By the end of this piece, you should have a firm grasp on the definition,
    application, and impact of proper API metric analysis.


    ## 7.1 What Is Metric Analysis?


    According to the Oxford Dictionary, metrics are [“method[s] of measuring something,
    or the results obtained from this”](http://www.oxdictiondictionaries.com/us/definition/american_english/metrics).
    Metrics are the way we measure the values of a targeted part of a system, measuring
    an event from inception to completion, including the effects caused by its implementation.


    So now that we know what a metric is, why is it so important to APIs? Metrics,
    and by extension `API-centric Metric Analysis`, are invaluable tools for the modern
    business. Metrics can be used to develop new processes, create a fundamental understanding
    of the product and targeted consumer, drive a holistic understanding of your manufacturing
    process and methodology of delivery, and create opportunity to [monetize and optimize
    your API](http://nordicapis.com/how-to-monotize-your-api/). Using metrics can
    bring you to a bird’s-eye view of an entire API process, following the age old
    saying — “you can’t see the forest from the trees.”


    ## 7.2 Metric Analysis Tools and Services


    There are many types of metrics that can be captured, analysed, and used to develop
    more effective API systems. Metrics can largely be grouped into two categories:
    `internal metrics` and `external metrics`.


    ### Internal Metrics


    Internal Metrics are those that are derived from data captured by internal web
    servers, user feedback forms, and trends observable through internal systems.
    These include:


    *   `User type`: Is the consumer a repeat user or new user?

    *   `Days since last session`: How long ago was the API last used by repeat users?

    *   `Traffic sources`: Are functions within the API being called through your
    own web application or a third party application?

    *   `Function grouping`: How often a user calls a certain function along with
    other functions.

    *   `Types of data requested`: Is your server serving media requests, plain text
    requests, or other types of requests more often than others?

    *   `Access speeds`: How quickly is your system responding to requests? Where
    is the bottleneck?

    *   `Service requests`: How often are some services being requested? Are there
    any services that are never requested?

    *   `Error reporting`: How often does a user report an error with the system,
    and what is the specific error?


    ### External Metrics


    These metrics are derived through the use of processes and applications that originate
    outside of the API developer. While internal metrics are concerned more with the
    functioning of the actual API and overall system, external metrics focus more
    on the community and potential user bases. These metrics may involve third-party
    systems:


    *   API and service adoption rates - [WebTrends](http://www.webtrends.com)

    *   Redirection and publicly facing data - [Google Analytics](http://www.google.com/analytics)

    *   Market trends and behaviors - [Adobe](http://www.adobe.com/solutions/digital-analytics/marketing-reports-analytics.html)


    ## 7.3 Example — The Tokyo Traffic Problem


    ![](Images/image00104.jpeg)A way to understand the importance of metric analysis
    is to show a situation in which it is applied properly against a situation where
    it is not, comparing the results of both approaches. Let’s imagine that we are
    engineers for the roadways of Tokyo, Japan, one of the largest cities in the world.
    We are tasked with solving a congestion problem in one of the most congested intersections
    in the entire city.


    Let’s first approach this problem without using Metric Analysis. We will use an
    `observational approach`. By standing on an overpass straddling the most congested
    area of the road, we mark down our observations in our notebook, noting both the
    number of cars and the number of lanes provided. Using these observations, a solution
    is designed to expand the roadway by an extra two lanes. The time budgeted for
    construction is set on a 24-hour schedule. You assume the congestion will ease
    due to your solution, and you step away. Some months later, the congestion you
    observed has only spilled into the new roadways, worsening the problem. The observational
    approach has resulted in more problems than it fixed, and is considered an abject
    failure.


    Now let us approach the problem in a `metric-based approach`. After being assigned
    the project, you first look at the city road maps. You observe that the congested
    road is likely facing issues arising from a stoplight intersection some miles
    ahead of the congested area; because the highway empties into a city thoroughfare
    before continuing onto another highway, this area functions as a `bottleneck`,
    increasing congestion by constraining the throughput of the system as a whole.
    Using this data, you decide to add a three-lane highway that bypasses the city
    thoroughfare, allowing traffic to flow both into and around the intersection,
    dependent on the driver’s needs. You also decide to implement a roundabout as
    opposed to a stoplight, thinking the flow of traffic should be eased in this manner.
    This plan is placed on a construction schedule over a handful of weeks, avoiding
    work during the rush hour. After implementing this solution, you collect data
    over an entire week, making notes of points of failure or issues at certain times
    of the day. Congestion has eased considerably, and the metric-based solution is
    considered a success.


    ## 7.4 The Traffic Problem Solution


    What was the difference between the two approaches? Both aimed to ease congestion,
    and while the first approach was different than the second, on paper they should
    have worked. The difference is the fundamental use of data in implementation.


    *   In the observational approach, the `global issue` of congestion was attacked
    by a `specific` solution. In the metric-based approach, the `global issue` of
    congestion was attacked with a `global` solution.

    *   Issues arose within the first approach from failure to understand the `end-consumer`
    (expanding the intercity thoroughfare, and using a 24-hour build schedule interfering
    with rush hour). The second approach understood the requirements of the end consumer.

    *   The observational approach eschewed data analysis, assuming a localized solution
    would fix the problem, while the metric-based solution observed the `measurable
    results` of the solution, tweaking and adjusting to any new requirements that
    arose during construction.


    ## 7.5 The Traffic Problem and APIs


    So what does Tokyo congestion issues have to do with API development? The two
    approaches above are perfect analogies for the development and implementation
    cycle of APIs, and show the measurable need for Metric Analysis. When developing
    an API, one must monitor internal and external metrics to ensure their API is
    effective in the long-term. When an API is developed and implemented, the following
    vital factors must be considered:


    *   The needs of the `end-consumer`, that is, the user who will interact with
    the API and its front-facing systems

