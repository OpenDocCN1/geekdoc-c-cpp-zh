  raw: '1.  The architect wants **control**: Accustomed to traditional methods of
    infrastructure — data storage on local servers — the architect may be opposed
    to cloud operations, desiring to ‘touch’ the software. To workaround this stigma,
    API providers can offer the ability to download and store data sets locally, or
    even offer an on premise, dedicated, managed option the API.


    2.  The architect wants **zero downtime**: To foster reliability in the service,
    having transparent developer-facing logs that communicate API uptime is critical.


    3.  The architect wants to see **responsibility**: API systems need to be designed
    as [secure systems](http://nordicapis.com/how-to-control-user-identity-within-microservices/)
    using [modern approaches](http://nordicapis.com/building-a-secure-api/).


    4.  The architect requires an integration that guarantees **longevity**


    Within a “develop for now” approach, developers are creating an API for **immediate**
    use, focusing entirely on integrating existing feature sets and supporting specific
    sets of queries. The downside of this approach, however, is that they are only
    robust at what they are designed for, and nothing more. Designing for the immediate
    needs and requirements of a service or system is all well and good, but it does
    little for long term support.


    Maintain **consistency**. If your API uses calls that don’t run in the same [environments](http://blog.8thlight.com/craig-demyanovich/2011/10/03/inconsistent-apis.html),
    bug hunting becomes a chore. If your [documentation is inconsistent](https://twittercommunity.com/t/rest-api-docs-inconsistent/31794)
    with actual functionally, you risk confusing and segmenting your userbase. If
    you have a methodology to refer to outside sources, use this methodology on *every*
    reference. If you cover a request by another multipart request, make sure there’s
    no needless redundancy.


    Data is only as valuable as it is understandable. When users receive data from
    your API, consider the methodology of how it’s delivered. Delineate data by type,
    and allow sorting within certain limitations. Powerful, dynamic services that
    allow for far more usefulness of API data is [a common requirement](http://www.computersciencezone.org/50-most-useful-apis-for-developers/)
    amongst many developers.


    Returning useless **errors** that state the obvious (something went wrong), the
    useless (ERROR), or the downright confusing (error code:9442394) is a losing proposition
    — if your users can’t find out what went wrong during basic errors, they’ll stop
    using the API entirely. Similarly, failing to return a valid JSON, and refusing
    to effectively document what error codes actually mean can make a potential API
    development partner second-guess integration with your services, further killing
    potential user base growth. **Make sure all error returns are understandable**


