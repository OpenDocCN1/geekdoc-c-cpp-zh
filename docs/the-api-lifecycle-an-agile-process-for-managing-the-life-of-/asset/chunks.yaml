    ## Fedex


    在撰本文时，[Fedex](http://images.fedex.com/us/developer/downloads/FXF_Automation_XML_Tracking_change.pdf)
    正在将其 API 更新为 Fedex Web Services，通过大规模的重新设计来取代基于 XML 的跟踪应用程序。


    ### 8.5 退役原因 #4：版本控制


    版本控制是目前为止退役 API 最常见的原因。对于大多数企业来说，API 是一项相对较的技术，你经常会看到今天仍在使用的 `v1`、`v2` 或 `v3`。类似于设备上的操作系统升级，在发起重大更改时，抓取并替换整个版本通常更为简单。当需要对
    API 参数进行重大编辑或引入新的使用控制时，就会产生版本控制。


    一些严重影响开发者和终端用户的剧烈变化可能会被悄悄隐藏在新的 API 版本文档中。功能可能会被删除、权限可能会受限、类可能会更改等。由于版本控制是许多 API
    生命周期中的一个共同组成部分，我们并不打算创建一个它们的详尽列表。相反，这两个版本更新的示例给开发者和终端用户带来了一些“惊喜”……


    ### YouTube


    YouTube 在迁移到 YouTube Data API `v3` 的过程中，令用户感到惊讶的是，发现 Data `v3` 将不再支持昂贵智能电视上的 YouTube
    应用程序。


    ### Twitter v1


    Twitter 的 `v1` 最终于 2013 年退役。作为目前使用的[第 3 流行的 API](http://www.programmableweb.com/news/most-popular-apis-least-one-will-surprise-you/2014/01/23)，这一公告[引发了整个开发者社区的担忧](http://www.itworld.com/article/2712336/unified-communications/the-death-of-the-twitter-api-or-a-new-beginning-.html)，认为简单的集成已成为过去。该更新增加了
    `OAuth`，需要客户端密钥并在 Twitter 上创建应用程序。根据 [Mathew Mombra](https://twitter.com/mombrea)
    的说法，这些更改很可能是为了：


    *   通过不那么宽松的访问强制执行调用速率限制

    *   减少他们的系统负载

    *   降低 API 漏洞

    *   推广他们的嵌入式推文计划


    ### 8.6 退役原因 #5：安全考虑


    作为许多大规模退役的考虑因素之一，API 提供者可能会选择停止某个公共 API，特别是因为与将内部数据和流程公开而相关的安全考虑。


    #### Google Earth API


    该 API 被关闭是因为它依赖于 [NPAPI Framework](http://en.wikipedia.org/wiki/NPAPI)，Google
    提到这种过时的技术已成为一个安全隐患。


    #### SnapChat


    尽管 SnapChat 在技术上从未发布过公共 API，但这个流行的应用程序在各种平台上产生了各种混合应用，这些应用都调用了他们的“私有” API。这一直没有得到制，直到
    2015 年初，SnapChat 与 Windows 商店合作，开始打击这些流氓应用程序。


    ## 9. 准备弃用


    ![](img/how-do-developers-react-to-api-deprecation-the-case-of-a-smalltalk-ecosystem)
    的研究中，Lungu 发现 14% 的弃用方法在生态系统中产生了负面连锁反应，7% 的弃用类触发了连锁反应。只有 16% 的弃用有系统的替代，这意味着大多数编辑都是手动完成的。因此，对
    API 的任何更改都会引起产生深远影响的涟漪。


    ### 9.2 准备开发者反应


    为了与你的社区保持良好关系，我们建议使用以下技术来为 API 的退役做准备：


    *   **制定退役计划：**为完全弃用提供至少 6 个月的时间范围。这有望为团队提供足够的时间寻找新的集成或合作伙伴关系。如果某些团队面临困境，请考虑延长这一时间范围。[Google
    Maps](https://developers.google.com/maps/terms) 和 [Youtube](https://developers.google.com/youtube/terms#deprecation)
    遵循提前一年公告后后弃用的政策。

    *   **分阶段进行更改：** 以符合过去承诺的方式对你的退役计划进行分层。如果仍在运行，请尽早关闭旧版本。Twitter 过去曾创建过退役时间表。

    *   **公开公告：** 编写并推广博客文章，明确列出 API 更改、何时生效、谁会受影响以及你的社区需要知道的任何其他重要信息。将这些信息发布到你的专用社交账号。

    *   **缓解过渡：** 如果你的 API 正在被整合、版本化或合并到单独的服务中，请通过迁移指南和常见问题解答（FAQ）缓解这一过程。例如，当 Google
    Maps 数据迁移时，他们创建了一个[数据解放工具](http://maps-data-liberation.appspot.com/)来提供完整下载或迁移到他们新控制台。

    *   **使用停机测试（Blackout testing）：** 停机测试是在短时间窗口内计划关闭所有 API 功能。这有助于开发者查看 API 的缺失将如何影响他们的系统，同时也作为开发者更新代码的行动号召。Youtube
    API、[Twitter API](http://www.adweek.com/socialtimes/twitter-scheduling-blackout-tests/477207)、[Mendeley
    API](http://blog.mendeley.com/developer-resources/mendeley-api-blackout-testing/)
    以及许多其他过去都使用过停机测试。

    *   **不要违反你自己的服务条款：** 检查你的服务条款，确保在拔掉电源之前没有关于持续支持的约束性合同。提前计划的一种明智方法是在创建新的 API 版本时编写弃用策略。


    # V 敏捷思维


    ![](Images/image00107.jpeg


    API 生命周期的每个阶段都不应被视为静态的。进展通常是非线性的，这意味着从一个阶段获得的信息应该同时影响其他终端。阶段之间的迭代通信对于影响明智进展并获得可持续的内部生态系统至关重要。


    ![](Images/image00077.


    例如，如果你收到客户对某项操作不满的多次投诉，应该引发只影响开发的更改，但告知分析，甚至可能影响退役。


