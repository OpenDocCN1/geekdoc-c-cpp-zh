    如果你不能 100% 确定你的 API 将被如何使用，你可以始终提供几种流行编程语言的 SDK。[Algolia](https://www.algolia.com/
    "Algolia") 作为一个搜索引擎 API，正在采用这种方法，提供了一种在 Ruby、Python、Node、PHP 或 Objective-C 等语言中使用其服务的简单方法。但请注意，随着
    API 的演变和方法的更改，维护大量的 SDK 并非一项易事。[APIMATIC](https://apimatic.io/ "APIMATIC") 和 [REST
    United](http://restunited.com/ "REST United") 是提供自动 SDK 生成的服务。通过这些工具，每当你的 API
    发生变化时，你都可以重新运行 SDK 生成，为你的消费者提供最新的代码版本。


    ### 4.2 API 管理


    在实现 API 端点并决定消费者将如何与你的 API 交互之后，你必须考虑持续运营。最重要的因素是控制你的 API 访问条件，并确定在用高峰高峰如何表现。你可以采用
    DIY 的方法，也可以使用 API 管理服务，例如 [3scale](http://www.3scale.net/ "3scale") 或 [Apigee](https://apigee.com/
    "Apigee")。


    无论你选择什么解决方案，记住你将受到其工作方式的影响。仔细定义长期目标以及你想要处理的常见场景。如果你选择的解决方案没有提供大多数 API 消费者所使用的功能，那么从长远来看，你可能会被迫进行调整。


    #### 访问控制


    API 管理中最重要的方面之一是定义并自动化 [控制谁可以访问你的 API](http://nordicapis.com/building-a-secure-api/)
    的过程，以及在需要时采取了哪些措施来启用访问限制。


    大多数 API 管理平台都提供某种形式的访问控制功能，包括 API 调用限制额分级以及通过不同的付费计划对消费者进行区分。要寻找的第一个访问控制功能是你的
    API 将如何验证身份并授权消费者。


    取决于你会有哪种消费者以及会发生什么种的使用情况，有几种选择：


    *   **API keys**：控制 API 访问最简单的方法。通常你必须为每个消费者发放一个 API 密钥，并在每次调用通过 `HTTP` 请求头提供身份标识。

    *   **OAuth 2**：这可能是 Web API 使用的最流行的授权标准。OAuth 2 让你将基于令牌的身份验证与基于用户范围（scopes）的细粒度访问控制相结合。当
    API 消费者代表其他用户进行调用时，这是最佳解决方案。

    *   **Origin IP address**：它可以与其他访问控制方法结合，也可以单独使用。单独使用适用于你向非常有限的受众提供 API 的情况。为了获得更好的效果，你还应该将源信息添加到你的日志和使用分析中。


    无论你选择哪种访问控制策略，始终记住它必须适应你 API 最常用的用例。例如，如果你的主要 API 使用是通过移动 App 进行，那么使用基于简单 API
    密钥的验证就没有意义了。在这种情况下，使用 OAuth 并让移动 App 代表其用户操作是有意义的。


    ### 4.3 维护


    虽然发布你的 API 可能是一项令人兴奋的挑战，但保持其运行通常被认为是很无聊的。API 维护通常被推到次要计划，只有在问题开始出现后才被考虑。不要遵循这条路；从开始就实施一个良好的维护计划。


    维护 API 的日常活动通常与 [文档](http://nordicapis.com/using-templates-for-documentation-driven-api-design/)、与消费者的沟通以及主动理解某些运行是否符合预期有关。因此，维护大部分工作通过定期测试你的
    API 完成，以确保一切运行都与文档一致。


    #### 测试


    主动了解你的 API 是否按照你提供的文档运行并遵循你的服务质量的一种方法，是针对单个端点[定期运行测试](http://nordicapis.com/api-design-testing-state-art/
    "API Design & Testing State of the Art")。有了监控，如果任何测试失败，你可能希望在消费者遇到问题之前修复错误。这些类型的测试可以在你的
    API 上执行：


    *   **以性能为导向的测试**：对你的 API 提供的每个方法进行单独调用。如果响应时间超过了指定的时间限制，则意味着特定端点存在问题。

    *   **功能性测试**：这种测试通过对每个 API 方法进行单次调用来彻底测试每个 API 功能，使用不同种类的有效负载（payloads），甚至发送会产生错误的数据。然后将响应与预期行为进行比较以定位错误。

    *   **用例测试**：这是一种更复杂的测试类型，可以通过将不同端点的调用组合到单个测试中来实现。每个测试都应该期望特定的响应和执行时间限制。


    有几种工具可以帮助你自动地定期运行 API 测试。例如，[POSTMAN](http://www.getpostman.com/ "POSTMAN") 是一个
    [Chrome 应用](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop?hl=en
    "POSTMAN")，让你能够运行上述所有测试。还有 [SmartBear](http://smartbear.com/product/alertsite-uxm/capabilities/monitor-apis/)
    API 监控工具包。如果你正在寻找更具 SaaS 特性的，可以尝试 [Runscope](https://www.runscope.com/ "Runscope")，这是一个定期运行测试并报告结果的服务。其他有用的监控解决方案包括
    [APImetrics](http://apimetrics.io/) 和 [API Science](https://www.apiscience.com/)。


    #### 管理


    即使一切符合预期，有时你也需要对 API 引入更改。当这种情况发生时，通过以下方式考虑对你的消费者和内部系统的影响：


    *   **通知消费者变更**：与使用你 API 的开发者建立清晰的沟通渠道，以透明的方式告知更改。

    *   **保持与旧版本的兼容**：确保引入的更改不会破坏原有功能。记住，你的 API 消费者可能无法立即更新他们的系统。

    *   **减少停机时间**：不要让系统停止——即使是瞬间。你的构建和部署流程应确保 API 更改不会影响调用和功能。API 停机可能会导致消费者端的停机或质量损失，因此要将其降至最低。


    通过遵循[持续集成](http://en.wikipedia.org/wiki/Continuous_integration) 方法并在部署前充分测试代码，可以减少停机时间。确保没有破坏性更改可以通过遵循良好的
    API 版本控制策略来实现。如果你提供并维护不同版本的 API，消费者就不会在他们正在使用的版本上受到影响。一个连接 API 文档更改与消费者之间的的解决方案是
    [API Changelog](https://www.apichangelog.com/)，它是一个自动发现你的 API 文档更改并通知订阅者的工具。


    ![](img/image0094.jpeg)


