  raw: 'During the [Nordic APIs World Tour](http://nordicapis.com/tour/nordic-apis-world-tour-2015/),
    expert API practitioners shared their insights with attendees at four international
    cities, touching on API development, security, design, operations, and more during
    intimate conference settings.


    A recurring theme in many talks was **API Design**. So, in this chapter, we’ll
    sum up important API design lessons that were conveyed by our speakers and then
    add some of our own — both practical tips on technical implementation, as well
    as more more philosophical considerations on how to hide (or not hide) complexity
    when designing an API.


    API design should not begin with technical documentation, but should rather originate
    from your fundamental goals. Knowing what your API needs to accomplish is of the
    highest importance. This is defined in the [analysis phase of the API lifecycle](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/).


    As Phillipp Schöne from [Axway](https://www.axway.com/) pointed out, API designers
    should ask “*how APIs can support the business function and not how they can support
    the needs of IT*.”


    It’s important to remember the unique characteristics of APIs. As a consumer,
    tying into a service’s underlying data or functionality is inherently a unique
    process. Though comparable to SaaS products, [Andreas Krohn](https://twitter.com/andreaskrohn)
    from [Dopter](http://dopter.se/) highlights two key differences:


    The first is that **APIs are building blocks** and not finished products: “*If
    somebody is using your API they are basically outsourcing a part of their business
    to you*”.


    His second lesson is that **machines are not flexible**. If a SaaS product changes,
    a person can adapt, but if an API changes, a machine is not as adaptable. This
    influences the design and the whole lifecycle of the API, and affects how we prepare
    for parameter changes and versioning.


    The need to understand your audience is applicable throughout the entire lifecycle.
    If you are updating, versioning, or performing major redesigns on an existing
    API, you need to carefully respond to the **feedback** from your users to make
    the new version as good as possible.


    [Marjukka Niinioja](http://nordicapis.com/speakers/marjukka-niinioja/), Senior
    Consultant and Manager at [PlanMill](http://www.planmill.com/) shares her experience
    with leveraging user feedback during a major redesign: developing PlanMill’s new
    [RESTful API](http://www.planmill.com/planmill-rest-api-1-5/), UI, and back-end
    architecture.


    PlanMill payed close attention to the feedback they were receiving internally,
    noticing three main recurring points:


    1.  The API was too complex for the developers to use.


    2.  The documentation was not sufficient.


    3.  The error handling needed work.


    Using this feedback, and by testing and consuming the API themselves, the PlanMill
    team was able to hone in on important aspects to consider during redeployment.
    The takeaway is that if you are redesigning an API, you are poised to release
    killer API improvements — as you already have **real world data on how API functionality
    is used**, which can be repurposed to improve efficiency and overall API user
    experience.


    ![](Images/image00096.jpeg)


    Who pays the price for complexity? Nordic APIs veteran [Ronnie Mitra](https://www.linkedin.com/in/ronniemitra)
    of [API Academy](https://twitter.com/mitraman) argues that complexity is necessary
    — what should be avoided instead is confusion. Mitra contends “*it is a designers
    job to reduce confusion and embrace complexity in their business domain*.”


    There has been a move toward simpler products and simpler interface designs. Mitra,
    an expert in developer experience and API design, advocates for smartly designed
    software and APIs that retain simplicity but also cater to complex requirements.
    Quoting John Maeda’s Laws of Simplicity, Mitra notes that “*Simplicity is about
    subtracting the obvious and adding the meaningful*.”


    A steering wheel in a F1 car is very complex compared to the steering wheel of
    a normal car, “*designed and optimised for its user and the situation*”. Ronnie
    makes a great point that “*every design decision is a decision of if you* [as
    an API provider] *or client app developers will pay the price of complexity*”.
    As an example, OAuth is complex to implement by the service provider but easy
    to use by the client developer. We cannot avoid complexity, but we can architect
    our APIs so that the user-facing side is deceptively simple.


    [Ross Garrett](https://twitter.com/gssor) from Axway also talks about what applying
    an API-first strategy means for enterprise organizations. In dealing with legacy
    systems, he notes that a missmash of tangled infrastructure can be masked by using
    proper API management tactics.


    > “Your old architecture [may not have] useful APIs, or may be older SOAP services
    that don’t perform well in the context of mobility or cloud integration. Some
    legacy things need to remain, but API management can extend and reuse by translating
    all old interfaces.” What’s important is having a clean business appearance for
    the end user.


    It is impossible to talk about API design without mentioning Hypermedia, a subject
    that came up in several presentations during the [Nordic APIs World Tour 2015](http://nordicapis.com/tour/nordic-apis-world-tour-2015/).
    [Pedro Felix](http://www.twitter.com/pmhsfelix) of [Lisbon Polytechnic Institute](http://www.ipl.pt/en),
    offers a deep dive into HTTP. He summarizes his presentation about API design
    this way:


    > “If you have a problem, keep calm and look for an HTTP [RFC](https://www.ietf.org/rfc.html)”


    Pedro considers [hypermedia](http://nordicapis.com/html-hypermedia-apis-and-adaptive-web-design/)
    as the key factor for evolvability, allowing API providers to react to new business
    requirements quickly without breaking client applications. Related to Mitra’s
    theory on the distribution of complexity, using hypermedia means more initial
    complexity for client app developers, but an overall reduced complexity considering
    the ease of future changes.


    ![](Images/image00097.jpeg)


    [Brian Mulloy](https://twitter.com/landlessness) from [Apigee](http://apigee.com/)
    demoes a hypermedia API for the [Internet of Things](http://nordicapis.com/apis-power-the-internet-of-things/).
    By using hypermedia it is easy to introduce new devices into the IoT since all
    possible states, actions and feeds are described in the API itself.


    Mulloy describes [API design for the Internet of Things](http://nordicapis.com/apis-power-the-internet-of-things/)
    as using information design for physical objects. He compared this to the early
    days of mass car production in his hometown Detroit. Suddenly the city had lots
    of cars, but infrastructure was not prepared for a large automobile influx. The
    resulting confusion lead to chaos and even a large number of traffic related deaths.


    The solution was to use information design that resulted in standard designs used
    all over the world today. Pedestrian crossings, traffic lights, stop signs, and
    lane markers make it clear how to behave in traffic. Akin to the early days of
    cars, we are still working on how to organize and design today’s APIs for the
    IoT.


    Having a shared vision within an organization is key for API interconnectivity
    to be accepted. To help convince API naysayers, whether they be architects or
    engineers, in his [talk](http://www.slideshare.net/duvander/the-architect-is-not-convinced),
    [Adam Duvander](https://twitter.com/adamd) of [Orchestrate](http://orchestrate.io/)
    walks through four ways API providers can frame their API product to foster confident
    adoption. These factors should be considered when designing an API in order to
    respond to common stigma associated with API integrations.'
