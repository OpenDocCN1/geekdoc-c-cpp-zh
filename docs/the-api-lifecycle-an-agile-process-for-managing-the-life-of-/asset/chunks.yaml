    \ expert API practitioners shared their insights with attendees at four international\
    \ cities, touching on API development, security, design, operations, and more\
    \ during intimate conference settings.\n\nA recurring theme in many talks was\
    \ `API Design`. So, in this chapter, we’ll sum up important API design lessons\
    \ that were conveyed by our speakers and then add some of our own — both practical\
    \ tips on technical implementation, as well as more more philosophical considerations\
