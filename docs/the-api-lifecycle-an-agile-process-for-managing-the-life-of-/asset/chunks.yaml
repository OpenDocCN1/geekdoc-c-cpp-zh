    # 1. The architect wants `control`: Accustomed to traditional methods of infrastructure
    — data storage on local servers — the architect may be opposed to cloud operations,
    desiring to ‘touch’ the software. To workaround this stigma, API providers can
    offer the ability to download and store data sets locally, or even offer an on
    premise, dedicated, managed option the API.


    # 2. The architect wants `zero downtime`: To foster reliability in the service,
    having transparent developer-facing logs that communicate API uptime is critical.


    # 3. The architect wants to see `responsibility`: API systems need to be designed
    as [secure systems](http://nordicapis.com/how-to-control-user-identity-within-microservices/)
    using [modern approaches](http://nordicapis.com/building-a-secure-api/).


    # 4. The architect requires an integration that guarantees `longevity`


    Within a “develop for now” approach, developers are creating an API for `immediate`
    use, focusing entirely on integrating existing feature sets and supporting specific
    sets of queries. The downside of this approach, however, is that they are only
    robust at what they are designed for, and nothing more. Designing for the immediate
    needs and requirements of a service or system is all well and good, but it does
    little for long term support.


    Maintain `consistency`. If your API uses calls that don’t run in the same [environments](http://blog.8thlight.com/craig-demyanovich/2011/10/03/inconsistent-apis.html),
    bug hunting becomes a chore. If your [documentation is inconsistent](https://twittercommunity.com/t/rest-api-inconsistent/31794)
    with functionally, you risk confusing and segmenting your userbase. If you have
    a methodology to refer to outside sources, use this methodology on every. If you
    cover a request by another request, make sure’s no redundancy. Data is only as
    valuable as it is understandable. When users receive data from your API, consider
    the methodology of how it’s delivered. Delineate data by type, and allow sorting
    within certain limitations. Powerful, dynamic services that allow for far more
    usefulness of API is [a common requirement](http://www.computerszone.org/50-most-useful-apis-for-developers/)
    amongst many developers.


    Returning `errors` that state the obvious (`something went wrong`), the useless
    (`ERROR`), or the downright confusing (`error code:9423`) is a losing proposition
    — if your users can’t find out what went wrong, they’ll stop using the API. Similarly,
    failing to return a valid `JSON`, and refusing to document what error codes actually
    mean can make potential API development second-guess. Make sure all error returns
    are understandable `Uptime` is our fifth and final tip as it is a wonderful metric
    by which we can holistically judge an API. It represents everything working in
    concert — if a single element of API is poorly managed, `uptime` will likely be
    influenced. At the time of this writing, Bit.ly reports [100% uptime over the
    past 24 hours](http://status.bitly/), with yearly uptime of [99.9%](http://bitly.com/post/5192365/bit-ly-1).
    Likewise, Twitter reports [100% uptime](https://dev.twitter.com/overview/status)
    with average uptime of [99.9%](http://social.downornot.com/). The proof, as they
    say, is in the pudding (or in this case `uptime`).


    ## 5.1 Summarizing API Design Tips


    Considering the development of your API is a serious endeavor. The choices made
    now will impact your future success in a big way. While these solutions can be
    implemented after the fact, it is far easier to implement them at the start. Not
    only will this deliver a more completely integrated feature set, but it will also
    give you a product with simpler end documentation and user experience. These design
    and development concepts may be simple, but the implications of their applications
    are deceptively huge — implementing them can lead to explosive growth, high user
    adoption, and long-term use. Design an API that allows an API provider to handle
    most of the complexity, and simplify processes for your client. Above all, do
    not forget that the API design should serve your overall business requirements.


    # III Operations Stage


    ![](Images/image0098.gif)


    In this part we discuss what factors make up the Stage and how they should be
    addressed. Transforming your API into something developers will want to consume,
    and learning what impact this will have on your business are things we’ll consider.
    Other critical actions involve maintaining a positive relationship with your API
    audience and offering them appropriate support channels.


    ## 6. Marketing Your API


    To start, let’s take a look at your API from a different angle — one that presents
    your API as not just a developer-oriented tool but as a full product that solves
    a real problem. In this chapter we’ll see how this angle can fine tune the promotion
    of your API to focus more on your audience’s perspective and needs.


    ### 6.1 Running Your API As a Product


    Why should you treat your API as if it were a full-fledged product? Isn’t the
    API something that supporting your existing product? Though it may sound strange,
    running an API as you would with any other product actually makes a lot of sense.


    By definition, a product is something that exists to satisfy the needs of a group
    of consumers. Usually, during product development, you research [what consumers
    need](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/)
    so that you can design your product accordingly. You also conduct research to
    understand how consumers will use the product that you’re designing. The results
    of these activities will eventually lead to the creation of your new product.


    By applying the same strategy to your API, you’ll not only have an API that developers
    really `want to use`, but you’ll also fully understand your target audience —
    a vital aspect of attracting developers to your API. The second activity is not
    any less important, as it will greatly inform the API design process. By learning
    how developers will consume your API you’ll be able to adapt the following items(http://nordicapis.com/api-lifecycle-development/
    "API Lifecycle Development Stage: Deploying Your API"), if needed:


    *   **Access Control**: Are developers building applications that act on behalf
    of several users? Does it make sense to use `API Keys`, `OAuth` or something else?

    *   **Methods and Protocols**: Do developers prefer `REST`, `SOAP`, `Thrift`,
    or something else? What makes more sense from a consumer point of view?

    *   **SDK Programming Languages**: Are developers using `Ruby`, `Python` or other
    languages? What `SDKs` should you offer and support?

    *   **Asynchronous Operations**: Is your API mostly consumed by Web browsers,
    mobile devices, or backend code? Are `API calls` made from behind firewalls? Can
    your API use `webhooks`?


    ![](Images/image00099.jpeg)


    If you don’t conduct product-oriented research then you’ll never understand how
    your API should be offered, and it will be much harder to pivot or gain traction
    in the long term. If you follow this strategy you’ll have the equivalent of product/market
    fit: API/market fit. Next, you’ll want to fuel your API usage growth by employing
    various marketing tactics to attract more and more developers over time.


    ### 6.2 Marketing Your API


    ![](Images/image00100.jpeg)


    Marketing an API is very similar in concept to any other kind of marketing. You’ll
    want to produce material that will promote your API in a variety of ways. This
    starts with launching your **developer portal**, which will act as the official
    point of contact between your API and its consumers.

