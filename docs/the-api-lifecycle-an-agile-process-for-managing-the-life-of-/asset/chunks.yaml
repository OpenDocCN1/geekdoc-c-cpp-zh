    随着 API 领域日益多样化，使用它们的开发者群体特征也变得越来越丰富。


    ### 3.6 多样的行业背景


    随着近期 B2B 和企业关注度的上升，API 提供者是否应该向个人开发者销售？还是直接寻求业务合作伙伴关系是更好的主意？API 的营销和消费方式因`industry`
    不同而存在巨大。API 提供者可能从两个人的初创公司到拥有数百员工的企业开发团队不等。消费者端也存在同样的多样性，这影响了获取 API 的方式。核心价值信息也会根据
    API 是面向初创公司、大型组织中的工程师还是为了说服高层领导而改变。我们可以首先将 API 领域的消费端分为两个不同的群体：


    *   **企业级开发者**：在大型组织内部工作的开发者。他们面临的挑战是，自己可能不是决策者。由于在内部工作，这意味着他们必须向上级汇报，涉及多个方，并可能导致更长的决策过程。

    *   **自由职业开发外坊**：这些是小型初创团队，他们正在寻找实用的 API 集成来加速其产品开发。


    根据 Catchy Agency 的 Jason Hilton 的说法，行业差异意味着“值得应用特定的技术和策略。对于任何其他产品一样，营销开发者计划也需要投入同样多的精力和考虑。”


    ### 3.7 API 用例


    API 提供者必须想象 API 在真实场景中的`use case`。为什么有人会想使用你的 API？提供者应该考虑数据提供的可能性，并脑风暴可以使用该 API
    创建的`applications`。Kelly 认为这个过程将帮助识别消费者的需求：


    > “良好的画像（persona）的关键在于建立具体的的用户场景和故事……在决定为客户提供什么之前，你必须了解他们客户的需求。”


    这个过程还涉及到考虑使用 API 创建的产品的`business model`。Hilton 指出：“API 的商业模式非常重要——我们知道严肃的开发者会通过付费应用或投放广告来变现。试图让付费应用的开发者去实现一个广告
    API 是没有意义的。”


    ### 3.8 弱化企业品牌


    营销、关系、拓展——这些典型的 B2B 销售动机、标签和战术可能会产生负面的联想。有时，企业客户可能需要弱化企业品牌以吸引技术社区。在技术社区中，“布道者（Evangelist）”这一职位现在比以往任何时候都更加常见。像“布道者”或“开发者倡导（developer
    advocate）”等替代角色有助于传达`true passion`，并且[对你所推广的内容拥有热情和坚定的信念](http://timoelliott.com/blog/2013/07/how-to-become-a-technology-evangelist.html)将会赢得胜利。根据
    Catchy 团队的说法，2015 年的教训是：“如果你有一个开发者布道者，你就有了一个开发者计划。”


    ### 3.9 开发者体验


    面向开发者的材料的呈现对于该领域的成功至关重要。API 提供者可以利用各种策略，通过迎合观众的口味和需求，来帮助获取开发者、提高上手效率并维持用户留存。创建高质量开发者体验的卓越推理可以在
    John Musser 的“[[10 个开发者为什么讨厌你的 API 的原因](http://www.slideshare.net/jmusser/ten-reasons-developershateyourapi)””中找到。追溯
    Andreas Krohn 对增加包容性的立场，API 体验还应该考虑创业者体验、经理体验和设计师体验。本着这种精神，拥抱开发者语言，但也要为你的观众定制内容、`appearance`、UI
    和 UX。根据 Kelly 的说法，“开发者体验是 API 最重要的质量指标。它至关重要。”


    ### 3.10 只要他们构建，他们就会到来


    在这个领域，仅仅在对你的消费者没有深入了解的情况下开放平台是行不通的。技术公司内部的产品团队通常认为产品会被使用，但很多时候，营销过于薄弱或效率低下，导致采用率低。


    进行必要的研究以找到你的消费者*究竟是谁*。谁是能够传递你 API 价值的关键影响者？这取决于了解该受众的需求，这需要在开发开始之前进行彻底的分析。


    # II 开发阶段


    ![](img/image00093.gif)


    API 生命周期阶段最重要的行动可能是实现 API 并赋予其生命。继续阅读了解更多关于此过程的信息，并理解哪些因素有助于为 API 选择最佳标准、设计和编程语言组合。


    ## 4. 构建你的 API


    本章涵盖了在 API `Development` 阶段需要采取的行动以及需要解决的最重要挑战。我们将考虑有哪些实现选项，并探索 API 管理及其重要性。我们将定义[API
    可用性以及为什么它很重要](http://nordicapis.com/why-api-developer-experience-matters-more-than-ever/)，并考虑
    API 部署后应采取哪些立即步骤。


    ### 4.1 实现期间需要考虑的事


    此时，你应该已经有一个[定义良好的 API 业务策略和文档](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/
    "API 生命周期分析阶段：准备你的发布前 API 策略")。这包括定义你的主要 API 利益相关者是谁，并决定 API 如何被消费。到此为止，你应该已经有了以下问题的答案：


    *   **API 提供了什么价值**？它是分发数据的手段，还是提供了可以用于构建应用的具体功能？

    *   **谁将消费** API？消费者是与 API 交互以获取数据，还是代表其他用户消费它？

    *   **有多少消费者**使用 API？它是一个内部使用的私有 API，还是将向数百万消费者开放？


    回答这些问题将帮助你在实现过程中走捷径。让我们从理解你想通过 API 实现什么开始，以便定义你将使用哪些方法和协议。


    [/content]#### 方法和协议


    定义 API 方法和端点的最佳方式是遵循你想提供的功能，并选择最合适的标准和协议。识别你的主要 API 消费者通常可以使用什么类型的数据。


    如果你的主要消费者是移动应用，请考虑提供请求和返回尽可能信息的端点，以防止大量的带宽消耗并加快涉及 API 调用的操作。相反，如果你提供一个主要供金融市场使用的
    API，请仔细研究他们使用的框架以及他们如何与外部 API 通信。


    无论你做什么，我们建议不要跟随那些被称为“未来”的最新趋势。趋势在稳定并被广泛采用之前会发生多次变化，你的 API 需要跟上这种市场波动。确定你的目标受众中
    80% 的人在使用什么，并提供那个。


    #### SDK 编程语言


    选择如何提供 API 访问与 API 如何被消费直接相关。它主要会被移动应用开发者使用吗？如果是，提供现成的移动 SDK。脑风潜在的 API 用例是选择如何打包
    SDK 的第一步。


