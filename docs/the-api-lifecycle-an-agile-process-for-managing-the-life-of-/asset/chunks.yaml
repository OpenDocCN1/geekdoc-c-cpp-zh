    # The API Lifecycle


    ## An Agile Process For Managing the Life of an API


    ### Nordic APIs

    © 2015 Nordic APIs AB


    ## Table of Contents


    ## Guide


    1. [Begin Reading](#part0002.xhtml)


    ## Preface


    Nordic APIs has been in operation for about 2 years. Within that short time we’ve
    hosted hundreds of API-specific presentations featuring international experts
    - giving us the opportunity to take a peek into the inner workings of leading
    web API-driven businesses.


    Throughout our work we’ve discovered a recurring trend: unsuccessful APIs struggle
    both in fostering interest as well as creating a sustainable service. In contrast,
    successful APIs are well-attended, treated as a product with a multi-iterative
    lifecycle. So we thought; what exactly are the key ingredients to their successes?


    Our fourth eBook, `The API Lifecycle*, presents an agile process for managing
    the life of an API - the secret sauce to help establish quality standards for
    all API and microservice providers. This handbook depicts a holistic model that
    treats a web API as a constantly evolving business and product. From conception
    through deprecation, it outlines instructions on market research, business strategy,
    development, operations, promotion, and other vital components for successfully
    creating and maintaining an API.


    Inspired by experienced API consultants [Andreas Krohn](http://andreaskrohn.se/)
    and [Travis Spencer](http://travisspencer.com/), the API Lifecycle diagram is
    composed of four distinct phases: `Analysis`, `Development`, `Operations`, and
    `Retirement`. Our eBook expands theses concepts, grounding theories in knowledge
    collected during our [2015 World Tour](http://nordicapis.com/tour/nordic-apis-world-tour-2015/),
    events which brought API industry experts together to discuss different stages
    of the API Lifecycle. We also delved deeper into these ideas within our [blog](http://nordicapis.com/what-is-the-future-of-the-api-space/),
    interviewing [leading web API figures](http://nordicapis.com/blog) to perform
    additional research, and peppered it all with a bit of our own insights to create
    a comprehensive overview of what to consider during the entire product lifecycle
    of a profitable web API.


    Please enjoy `The API Lifecycle`, and let us know how we can improve. Be sure
    to join the Nordic APIs [newsletter](http://nordicapis.com/newsletter/) for updates,
    and follow us for news on upcoming [events](http://nordicapis.com/event-calendar/).


    Thank you for reading!


    > – Bill Doerrfeld, Editor in Chief, Nordic APIs


