    # API 生命周期


    ## 一种管理 API 生命周期的敏捷流程


    ### Nordic APIs

    © 2015 Nordic APIs AB


    ## 目录


    ## 指南


    1. 开始阅读


    ## 前言


    Nordic APIs 运营了大约 2 年。在短短这么短的时间里，我们举办了数百场专门针对 API 的演讲活动，并邀请了众多国际专家参与——这让我们有机会一窥了领先的
    Web API 驱动型业务的内部运作机制。


    在工作过程中，我们发现了一个反复出现的趋势：不成功的 API 在培养兴趣和创建可持续服务方面都显得得履维艰。相比之下，成功的 API 广受关注，并被视为具有多次迭代生命周期的产品。因此我们在想：它们成功的关键要素究竟是什么？


    我们的第四本电子书《API 生命周期》（*The API Lifecycle）介绍了一种用于管理 API 生命周期的敏捷流程——这是帮助所有 API 和微服务提供者建立质量标准的“秘制配方”。本手册描绘了一个整体模型，将
    Web API 视为一个不断演变的业务和产品。从构思到弃用，它概述了市场研究、业务战略、开发、运营、推广以及其他成功创建和维护 API 的关键组件。


    受经验丰富的 API 顾问 [Andreas Krohn](http://andreaskrohn.se/) 和 [Travis Spencer](http://travisspencer.com/)
    的启发，API 生命周期图由四个不同阶段组成：`Analysis`（分析）、`Development`（开发）、`Operations`（运营）和 `Retirement`（退役）。我们的电子书扩展了这些概念，将理论根于我们在
    [2015 世界巡回](http://nordicapis.com/tour/nordic-apis-world-tour-2015/) 活动期间收集的知识，这些活动将
    API 行业专家聚集在一起，讨论 API 生命周期的不同阶段。我们还在自己的[博客](http://nordicapis.com/what-is-the-future-of-the-api-space/)中深入探讨了这些想法，采访了[领先的
    Web API 人士](http://nordicapis.com/blog) 以进行额外研究，并融入了一些我们自己的见解，为在盈利性 Web API 的整个产品周期期间需要考虑的事项创建了一个全面的概述。


    请享受《API 生命周期》，并告诉我们如何改进。请务必加入 Nordic APIs 的[通讯](http://nordicapis.com/newsletter/)
    以获取更新，并关注我们获取有关未来[活动](http://nordicapis.com/event-calendar/)的新闻。


    感谢阅读！


    > – Bill Doerrfeld，Nordic APIs 总编辑


    与 Nordic APIs 联系：


    [Facebook](http://facebook.com/nordicapis) | [Twitter](http://twitter.com/nordicapis)
    | [Linkedin](https://www.linkedin.com/company/nordic-apis) | [Google+](https://plus.google.com/u/0/+Nordicapis/posts)
    | [YouTube](https://www.youtube.com/user/nordicapis)


    [博客](http://nordicapis.com/blog/) | [首页](http://nordicapis.com) | [通讯](http://nordicapis.com/newsletter/)
    | 联系我们


    ## 构景整个 API 生命周期


    ![](img/image00077.gif)


    从构思到弃用，软件即服务（[SaaS](http://en.wikipedia.org/wiki/Software_as_a_service)）往往处于不断的演变之中。查看
    Dropbox](https://www.dropbox.com/release_notes) 等高频平台的更新日志即可证明这一点。在这些日志中，你会发现错误修复和更新，最新的更新可能是在过去几周内完成的。


    开放这些 SaaS 平台的 API 变化同样迅速。以至于创建了 [API Changelog](https://www.apichangelog.com)
    来通知用户 API 文档的变化（在本文撰写期间，[Dropbox API](https://www.apichangelog.com/api/dropbox)
    在过去 30 天内有 22 次更新）。这种持续的迭代过程不仅是敏捷的——它的演变与许多业务因素共生，这些因素共同构成了整个 API 生命周期的有机体。


    由于 Web API 的主要功能是供第三方产品消费，因此 API 是一种独特的业务产品。它兼具软件和内部资产的特殊状态使其生命周期与众不同——受到持续反馈和市场验证的高度驱动。与可能具有更改
    UI 或底层构造能力的标准 SaaS 产品相比，API 的粒度状态可能使其更加难以捉摸。


    ### 现代软件开发的现状


    [敏捷](http://nordicapis.com/what-makes-an-agile-api/)……[Scrum](http://en.wikipedia.org/wiki/Scrum_%28software_development%29）……当代软件开发正推动快速发布和流式响应。对变化的响应需要快速执行，利用用户反馈、数据和统计数据。这些特征正在成为整个软件领域的标准做法。但生产和维护
    API 是一样的吗——还是说它是完全不同的另一个物种？


    ### 作为有生有机体的 API


    API 生命周期的具体形态取决于 API 的功能以及其核心业务战略。我们在 Nordic APIs 将常见的 API 生命周期简化为四个主要阶段：`Analysis`（分析）、`Development`（开发）、`Operations`（运营）和
    `Retirement`（退役）。如上面的映射所示，这些元素共同工作并相互影响。一旦循环开始，每个阶段之间开放且同步的交换将有助于从业人员针对内部和外部因素稳定
    API。在本介绍章节中，我们将介绍主要阶段，并在后续章节中对每个阶段进行深入探讨。


    ## #1：分析阶段


    ![](img/image0078.jpeg)


    此阶段涉及定义业务目标。公司应该批判性地自问 API 是否适合自己的情况。某些行业（如社交网络）依靠 API 作为其数字生态系统的自然延伸。相反，传统的非数字公司在处理
    API 如何扩展业务方面必须发挥创意。


    API 应该能够促进现有运营，或以某种方式朝着公司总体目标。在我们的电子书[开发 API 思维](http://nordicapis.com/developing-the-api-mindset-private-and-public-apis/)中，我们定义了三种
    API：


    -   私有 API（Private APIs）简化内部运营以降低成本。

    -   合作伙伴 API（Partner APIs）与合作伙伴组织专门合作，扩大服务的市场范围以产生收入。

    -   公共 API（Public APIs）通过向公众开放服务形成新的生态系统。如果你打算公发布，请在执行分析时获取反馈，以确定[访问控制](http://nordicapis.com/should-you-control-how-your-public-api-is/)。无论选择何种
    API 战略，在开始生产之前，都应明确制定其使命声明、使用预测、[增长模型](http://nordicapis.com/achieve-accelerated-growth-apis/)、营销战略和预期的[财务回报](http://nordicapis.com/5-ways-apis-will-increase-revenue/)。


    ## #2：开发阶段


    ![](img/image0079.jpeg)


    有了业务证明和目标，下一步是定义与战略合作的技术需求和机会。开发计划需要考虑以下因素：


    -   API 执行哪些`运营`

    -   `管理`和`托管`

    -   使用的[方法和协议](http://nordicapis.com/rest-better-than-soap-yes-use-cases/)

    -   规模和`可扩展性`

    -   `访问`和安全控制

    -   `易用性`和体验

    -   开发`团队` ……以及其他因素


