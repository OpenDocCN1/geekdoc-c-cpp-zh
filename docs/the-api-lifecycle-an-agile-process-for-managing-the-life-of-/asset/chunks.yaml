    为什么 Web API 会退役？哪些业务因素促成了这一决策？在这一部分，我们将研究 API 生命周期中的“退役阶段（Retirement Stage）”，通过深入分析
    API 弃用的用例，试图尝试回答这些棘手的问题，并探讨如何在不损害开发者社区声誉的情况下，成功退役你的 API。


    ## 8. 大型公共 API 退役历史


    人老终有时，退役是生活的一部分。在 API 世界中亦然如此。[Netflix](http://apievangelist.com/2013/03/12/netflix-api-is-much-more-than-a-public-api/)、[Google
    Earth](https://developers.google.com/earth/)、LinkedIn 以及 [ESPN](http://developer.espn.com/blog/read/publicretirement)
    API 的退役就是近期一些大型公共 API 弃用的示例。每一次重大的 API 退役往往会引发开发者社区的担忧；[公共 API 命中定毁灭了吗？](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away)


    我们并不这么认为——不要忘记目前估计有 13,000 个 Web API 在运行，该领域已显示出[指数级增长](http://www.programmableweb.com/api-research)，并预计随着物联网的发展而增加（[这不仅仅是一种时尚](http://www.forbes.com/sites/groupthink/2014/10/16/the-internet-of-things-isnt-a-technology-fad/)）。然而，万物皆有终结。随着条件的改变，技术必须进化以适应新的市场状况。面向用户的
    API 对某些组织来说可能是成功的，但对其他组织来说，开放环境可能并不可行且盈利。


    ### 8.1 退役意味着什么？


    退役意味着许多含义。一个 API 版本可能被计划完全弃用，或者 API 可能仍以受限的形式存在，并增加访问控制。API 可能只是精简了其多余功能以变得更加整合和精炼，或者完全被内部技术或外部竞争对手取代。


    为了充分理解促使重大 API 变化的条件，我们将列出 `5 个导致 API 退役的常见原因`。以近几年的大型 API 弃用为例，我们将探索通过研究推测出的每种原因背后的逻辑。听起来有趣吗？我们认为从事后视眼中可以学习到的东西非常迷人……


    ### 8.2 退役原因 #1：缺乏第三方开发者创新


    导致 API 关闭的常见场景是：API 接收到的开发者和终端用户使用有限或未经请求的使用。尽管这可能是由于营销不力，但也可能证明该 API 未能为其消费者提供真正的价值。


    #### Netflix


    Netflix 在 2009 年自豪地发布了他们的 API 计划，引用第三方开发者创建新应用的可能性。最终，他们停止向开发者发放新的 API 密钥，[到 2014
    年，这已对所有用户关闭](https://gigaom.com/2014/11/14/netflix-is-shutting-down-its-public-api-today/)，除了特定的合作伙伴集成外。根据
    Netflix 工程总监 Daniel Jacobson 的说法，他们的理由是“为了更好地集中精力，并使其与全球会员库的需求保持”。


    最终，Netflix 的所有公共 API 请求相当于大约[一天](http://www.slideshare.net/danieljacobson/top-10-lessons-learned-from-the-netflix-api-oscon-2014)
    的私有 API 请求。公共 API 的用户群太小，无法维持其存在。


    结果是取消公共 API 计划以采用单一的私有/合作伙伴 Java API。现在，任何设备上的 Netflix 应用都接入 Netflix 私有 API，该
    API 为所有消费者执行数据收集、数据格式化数据交付。Netflix 还消除了 API 中的版本控制，以拥抱无性和持续的变化。


    我们从这个案例中了解到，当一个品牌和原生平台如此强大时，创建一个公共生态系统可能并非必要。此外，根据技术专家 [Andy Thurai](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away)，同时维护公共
    API 和私有/合作伙伴 API“变得非常昂贵且耗时”。


    ### 8.3 退役原因 #2：相反的财务激励、竞争


    如果接口干扰了主要业务目标，公共 API 可能会退役。通过向任何人开放数据进行消费，提供者面临着失去市场优势的风险，特别是当这从原生分发渠道转移业务时。


    #### ESPN


    在 ESPN 的情况下，他们退役其体育数据平台的理由是“为了将工程资源与在我们的 API 平台上开发核心 ESPN 产品的需求更好地对齐”。今天，如果你访问
    [ESPN 开发者中心](http://developer.espn.com/docs)，你会发现所有 API 都对像 IFTT、Pulse 和 foursquare
    等“战略合作伙伴”开放。


    [Hacker News 讨论](https://news.ycombinator.com/item?id=8149477) 认为这是因为开发者正在将其应用变现。[Andy
    Thurai](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away)
    同意，“实际原因似乎是他们获得更好的控制。”我们了解到，通过暴露内部资产，业务可能会失去分发渠道。


    #### Strava


    [Strava](https://www.strava.com/) 为可穿戴设备提供健身软件。从 Strava v3 开始，他们开始为开发者制定[新要求](https://engineering.strava.com/update-on-the-api-v3-release-and-v2-retirement/)。当开发者整合盈利技术时，会导致
    API 退役。


    ### 8.4 退役原因 #3：技术变革与服务整合


    技术领域在不断进化。因此，技术的进步可能会使 API 过时。这经常发生在内部重构、收购或行业进步中。API 退役可能源于协议的演变，例如用 REST 替换
    SOAP，或者终端用户体验的变化，例如 Netflix 从 DVD 分发转向视频流。


    #### Skype


    Skype 取消桌面 API 的理由是不支持新的移动开发。Skype 公共 API 在 [2004 年首次引入](https://andyabramson.blogs.com/voipwatch/2004/11/skype_api_now_o.html)
    后被微软收购。微软关闭桌面 API 是为了拥抱 Skype URIs 和微软客户端。这一终止让一些开发者感到[愤怒](https://aragonresearch.com/microsoft-kills-skype-desktop-apis-leaves-developers-scrambling/)，因为它消除了第三方应用的收入，并通过
    [Skype URIs](https://msdn.microsoft.com/en-us/library/office/dn74582.aspx) 减少了功能。


    #### Google Maps Data API


    Google 在发布新 API 的同时，也会弃用旧版本。2010 年，Google 宣布将停止 Google Maps Data API，这是一项用于存储地理数据的服务。主要原因是
    [Google Maps API](https://developers.google.com/maps/documentation/?csw=1) v3
    版本推出了一种改进的查询和存储方法，使得 [Google Maps Data API](http://maps-data-liberation.appspot.com/)
    过时。


    其他由于过时技术计划退役的 Google API：


