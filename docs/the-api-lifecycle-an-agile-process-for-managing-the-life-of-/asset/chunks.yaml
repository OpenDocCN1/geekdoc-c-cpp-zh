    ## Envisioning The Entire API Lifecycle


    ![](Images/image00077.gif)


    From conception to deprecation, a Software-as-a-service ([SaaS](http://en.wikipedia.org/wiki/Software_as_a_service))
    is prone to constant evolution. Check the changelog for a high-volume platform
    like [Dropbox](https://www.dropbox.com/release_notes) for proof. In such logs,
    you’ll find bug fixes and updates, with the latest likely made within the past
    couple weeks.


    The APIs that open these SaaS platforms are changing just as rapidly. So much
    so that [API Changelog](https://www.apichangelog.com) was created to notify users
    of API documentation changes (22 updates in the last 30 days in the case of the
    [Dropbox API](https://www.apichangelog.com/api/dropbox) at the time of this writing).
    This ongoing iterative process is not only agile - it’s evolution is in symbiosis
    with many business factors that make up the organism that is the entire API lifecycle.


    As the main function of web APIs are to be consumed by third party products, the
    API is a unique type of business offering. It’s peculiar condition as both a software
    and internal asset makes its lifecycle special – highly fueled by ongoing feedback
    and market validation. Compared with standard SaaS products that may have the
    power to change their UI or underlying construct, an API’s granular state can
    make it even more elusive.


    ### The State of Modern Software Development


    [Agile](http://nordicapis.com/what-makes-an-agile-api/)…[Scrum](http://en.wikipedia.org/wiki/Scrum_%28software_development%29)…contemporary
    software development pushes toward quick releases and fluid responses. Response
    to change needs to be rapidly executed, leveraging user feedback, data, and statistics.
    These traits are becoming standard practice throughout the software realm. But
    is producing and maintaining an API the same – or is it a different animal entirely?


    ### The API As a Living, Breathing Organism


    Exactly how an API lifecycle looks depends on how the API functions as well as
    the business strategy at it’s core. We at Nordic APIs have boiled down the common
    API lifecycle to four main phases: `Analysis`, `Development`, `Operations`, and
    `Retirement`. As seen mapped out above, these elements work together and influence
    each-other. Once the cycle begins, open and simultaneous exchange between each
    phase will help a practitioner stabilize the API against internal and external
    factors. In this introductory chapter we will introduce the main phases, each
    to be covered in depth in the following chapters.


    ## #1: Analysis Stage


    ![](Images/image00078.jpeg)


    This stage involves defining overall business objectives. Firms should critically
    ask themselves whether or not an API is right for their situation. Some industries,
    such as social networks, thrive off APIs as a natural extension of their digital
    ecosystem. On the other hand, traditionally non-digital companies must be creative
    in handling how APIs extend their business model.


    An API should either boost pre-existing operations or work toward overall company
    goals in some way. In our e-book [Developing the API Mindset](http://nordicapis.com/developing-the-api-mindset-private-partner-and-public-apis/)
    we defined 3 types of APIs:


    *   `Private APIs` streamline internal operations to decrease expenses.

    *   `Partner APIs` work specifically with partner organizations to expand a service’s
    reach to existing markets to generate revenue.

    *   `Public APIs` form new ecosystems by opening up a service to public access.
    If you intend to have a public release, obtain feedback while you perform analysis
    to determine `access control](http://nordicapis.com/should-you-control-how-your-public-api-is/)`.


    Whatever the chosen API strategy is, it’s mission statement, usage projections,
    [model for growth](http://nordicapis.com/achieve-accelerated-growth-apis/), marketing
    strategy, and estimated [financial return](http://nordicapis.com/5-ways-apis-will-increase-revenue/)
    should be clearly laid out before production begins.


    ## #2: Development Stage


    ![](Images/image0079.jpeg)


    With business proof and goals laid out, the next step is defining technical requirements
    and opportunities that are in cooperation with the API strategy. Development plans
    need to consider the following:


    *   what `operations` the API will execute

    *   `management` and `hosting`

    *   the [methods and protocols](http://nordicapis.com/rest-better-than-soap-yes-use-cases/)
    used

    *   size and `scalability`

    *   `access` and security control

    *   `usability` and experience

    *   the development `team` … among other factors

