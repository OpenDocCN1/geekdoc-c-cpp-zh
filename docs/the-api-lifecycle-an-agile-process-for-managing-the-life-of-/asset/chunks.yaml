  trans: '


    对 API 流程的深入理解将有助于形成技术需求。例如，了解你的 API 是将[开放公司的数据](http://nordicapis.com/open-data-how-to-make-it-work-for-your-business/)，还是作为[内容分发渠道](http://nordicapis.com/apis-as-a-content-distribution-channel/)将影响整体设计。


    通常情况下，API 开发阶段应该模拟在分析阶段中设定的业务目标。一个有规律的开发阶段会考虑 API 流程的[设计、构建和测试](http://nordicapis.com/api-design-testing-state-art/)
    以及安全性。在设计 API 时，要兼顾[人机交互可用性](http://nordicapis.com/designing-apis-humans/)和[机器标准](http://nordicapis.com/designing-apis-machines/)。在这一阶段，实施并评估
    API 版本策略也是一个好主意，这将为未来的 的更新奠定良好基础。


    在开发阶段，团队可能会选择返回**分析阶段**以进行额外的市场研究和通用准备。这可能是由于技术瓶颈，或者是由于修订 API 主要目标的冲动。如果 API 感觉已经完善、经过测试、安全且已准备好通用使用，你就可以移动到**运营阶段**了。


    ## #3：运营阶段


    ![](img/image00080.jpeg)


    如果你的团队像侧排肉一样精简，你可能会直接向大众发布最小可行性产品（MVP）。由于架构松散，运营阶段除了营销之外，涉及大量的调整和错误修复是自然的。


    为了提高知名度，API 提供者可以举办**黑客松**，改进首页和文档的 **SEO**，设立专门的 **@Dev** 频道，并使用流行的**发现性**方法和渠道。如果资源允许，公司还应该聘佣专门的
    **API 布道师（API Evangelist）**，在实体活动和整个博客圈推广 API。


    根结底，营销 API 很大程度上取决于一种从内而外的方法。拥有一个[易于使用的开发者门户](http://nordicapis.com/designing-apis-humans/)、嵌入的**帮助台**，以及[我们过去列出的其他
    DX（开发者体验）驱动的建议](http://nordicapis.com/why-api-developer-experience-matters-more-than-ever/)，将有助于提高转化率。


    生命周期的这部分可能会消耗最多的精力和时间。监控使用统计数据，并与用户互动。使用任何有用的数据辅助持续修订。特别是如果 API 程序处于闭测测试阶段，收集反馈的入站策略将对辅助这一迭代开发过程产生极大帮助。确保所有的
    API 更改在你的发布说明中都有详细的记录。


    这个令人兴奋的阶段将为 API 从业者带来真实的市场需求，并可能为业务带来全新的机会。在这里收集的统计数据和数据将影响技术需求，可能导致重新回到**开发阶段**以进行增量更改或发布新
    API 版本，或者咨询**分析阶段**以进行更大的转型。如果预测看起来不乐观，团队此时可能会考虑移动到**退役阶段**。


    ## #4：退役阶段


    ![](img/image00081.jpeg)


    老去会来，退役是生活的一部分。在 API 世界也无如此。了解哪些因素导致了微小修订，哪些因素导致了大规模废弃是有好处的。在这个阶段，供应商可能会由于使用率有限、插件过时、缺乏第三方创新、相反的财务激励等原因决定退休一个
    API。如果 API 导致原生分发渠道流量减少，业务可能会面临失去优势的风险。


    如果你的关键性能指标（KPI）显示为平线，版本化、废弃或将 API 转入更内部状态都是可以考虑的选项。此时，可以重新尝试**分析阶段**，如果可行，则重复生命周期。例如，公共
    API 作为合作伙伴方案提供可能仍然是有盈利的。当 API 不再是实现业务目标的最佳解决方案时，**退役** API 或 API 版本是最佳选择。无论解决方案是什么，我们建议发布透明的公开公告，并提供合理的时间表。


    ## 选择你的冒险：


    在本章中，我们对这种某种非传统的 API 生命周期提供了一个俯观的视角。后续章节将对生命周期中的每个阶段提供细粒度的视角，并辅以特定的行业用例，以演示针对每个阶段的有效策略。以下是我们的路线：


    1. 分析阶段

    2. 开发阶段

    3. 运营阶段

    4. 退役阶段


    # I：分析阶段


    ![](img/image00082.gif)


    API 具有一个活跃的产品生命周期，该周期连接在内部演变和第三方波动之间。在这一部分，我们将开始深入研究生命周期流程的第一步，以考虑在开发 API 之前在**分析阶段**内应该做哪些准备。


    ## 1. 准备你的 API 业务策略


    ![](img/image00083.jpeg)


    某些人忽视了，**分析阶段**应该是任何 API 生命周期的第一个站站。它涉及研究和关键决策，这些将影响你 API 的未来所有设计。其目的是验证你的组织*为什么*需要
    API 以及*谁*将要使用它。


    这一关键阶段为 API 形成了一个**业务计划**。在这一开发前的 API 阶段，你应该衡量目标受众的兴趣，进行市场研究，预测你所在行业的趋势，并做出使用预测。为了形成策略，你需要决定
    API 的业务目标以及哪些核心 API 功能可以帮助实现这一结果，然后将这些知识与适当的收益模型相结合。


    定义上述观点将有助于组织为开发、运营和营销分配资源，并有助于估计你 API 的投资回报率（ROI）。这种准备也将为未来生命周期阶段的决策提供路线图。


    ### 1.1 需要考虑的基础事项


    开发和发布 API 应该获得与新产品发布相同的准备。特别是如果 API 是主产品，或是作为整个平台的底层结构构建的，最终业务目标应该是贯穿整个生命周期的重点。


    在游戏早期，你希望对以下问题制定答案：


    * 我的组织为什么需要一个 API？

    * API 将完成哪些功能？

    * API 的价值主张是什么？

    * 我的目标受众是谁？

    * 我的受众*想要*使用我的 API 吗？

    * 如果是供公众使用，你想象会有什么样的第三方产品基于你的 API 构建？

    * API 将是核心业务产品吗？

    * 我的组织是否拥有成功开发和维护 API 所需的资源？

    * 在分析期间我应该考虑哪些类型的指标？


