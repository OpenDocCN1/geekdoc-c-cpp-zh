  trans: '


    在 [Nordic APIs World Tour](http://nordicapis.com/tour/nordic-apis-world-tour-2015/)
    期间，顶级 API 实践专家在四个国际城市中与会者分享了他们的见解，在亲密的会议环境中触及了 API 开发、安全、设计、运营等主题。


    许多演讲中一个反复出现的主题是 `API 设计`。因此，在本章中，我们将总结演讲者传达的重要 API 设计教训，并添加一些我们自己的见——包括关于技术实施的实用技巧，以及关于在设计
    API 时如何隐藏（或不隐藏）复杂性的更多哲学思考。


    API 设计不应从技术文档开始，而应源于你的基本目标。了解你的 API 需要完成什么是至关重要的。这在 [API 生命周期的分析阶段](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/)
    中有所定义。


    正如 [Axway](https://www.axway.com/) 的 Phillipp Schöne 所指出的，API 设计者应该问：“*API 如何支持业务功能，而不是它们如何支持
    IT 的需求*。”


    记住 API 的独特性很重要。作为消费者，连接到服务的底层数据或功能本质上是一个独特的过程。虽然与 SaaS 产品具有可比性，但来自 [Dopter](http://dopter.se/)
    的 [Andreas Krohn](https://twitter.com/andreaskrohn) 指出了两个关键区别：


    - 第一是 `API 是构建模块`而非成品：“*如果有人在使用你的 API，他们基本上是在把自己业务的一部分外包给你你*”。

    - 他的第二个教训是`机器不是灵活的`。如果 SaaS 产品发生变化，人可以适应；但如果 API 发生变化，机器就没有那么适应性。这影响了 API 设计和整个生命周期，并影响了我们如何准备参数更改和版本控制。


    理解受众的需求适用于整个生命周期。如果你正在对现有的 API 进行更新、版本控制或重大重构，你需要仔细响应来自用户的 `feedback`，以使新版本尽可能好。


    [Marjukka Niinioja](http://nordicapis.com/speakers/marjukka-niinioja/) 是 [PlanMill](http://www.planmill.com/)
    的高级顾问和经理，她分享了在重大重构期间利用用户反馈的经验：开发 PlanMill 的新的 [RESTful API](http://www.planmill.com/planmill-rest-api-1-5/)、UI
    和后端架构。


    PlanMill 密切关注了他们收到的内部反馈，注意到三个反复出现的要点：


    1. API 对开发者来说太复杂了，难以使用。

    2. 文档不足。

    3. 错误处理需要改进。


    通过利用这些反馈，并通过亲自测试和消费 API，PlanMill 团队能够确定在重新部署期间需要考虑的重要方面。教训是，如果你正在重新设计一个 API，你就准备好发布杀手级的
    API 改进了——因为你已经有了`关于 API 功能如何使用的真实世界数据`，这些数据可以被重新利用以提高效率和整体 API 用户体验。


    ![](img/image00096.jpeg)


    ### 谁为复杂性买单？


    Nordic APIs 资兵 [Ronnie Mitra](https://www.linkedin.com/in/ronniemitra) 来自 [API
    Academy](https://twitter.com/mitraman) 认为复杂性是必要的——相反应该避免的是困惑。Mitra 主张：“*设计师的工作是减少困惑并在他们的业务领域中拥抱复杂性*。”


    目前正向更简单的产品和更简单的界面设计发展。Mitra 作为开发者体验和 API 设计的专家，提倡明智设计的软件和 API，它们既保持简单，又能满足复杂需求。引用
    John Maeda 的《简单性法则》，Mitra 指出：“*简单在于减去显而易见的东西，并增加有意义的东西*。”


    F1 赛车的方向盘与普通汽车的方向盘相比非常复杂，“*是针对其用户和特定情况进行了设计和优化的*”。Ronnie 提出了一个非常好的观点：“*每一个设计决定都是一个关于你（作为
    API 提供者）还是客户端应用开发者将为复杂性付出代价的决策*”。例如，`OAuth` 对于服务提供者来说实现很复杂，但对于客户端开发者来说很容易用。我们无法避免复杂性，但我们可以架构我们的
    API，让面向用户的端看起来异常地简单。


    ### API 优先策略与遗留系统


    来自 Axway 的 [Ross Garrett](https://twitter.com/gssor) 也讨论了对企业组织而言应用 API 优先策略意味着什么。在处理遗留系统时，他指出，混乱的基础设施组合可以通过适当的
    API 管理策略来掩盖。


    > “你的旧架构[可能没有]有用的 API，或者可能是旧的 SOAP 服务，这些服务在移动性或云集成背景下表现不佳。某些遗留物需要保留，但 API 管理可以通过翻译所有旧接口来扩展和重用。”
    为为用户提供一个整洁的业务外观。


    ### 超媒体与可演变性


    谈论 API 设计而不提到超媒体（Hypermedia）是不可能的，这个主题在 [Nordic APIs World Tour 2015](http://nordicapis.com/tour/nordic-apis-world-tour-2015/)
    期间的多次演讲中提到。来自 [里斯本理工学院](http://www.ipl.pt/en) 的 [Pedro Felix](http://www.twitter.com/pmhsfelix)
    对 HTTP 进行了深度解析。他这样总结他关于 API 设计的演讲：


    > “如果你遇到了问题，保持冷静并寻找 HTTP [RFC](https://www.ietf.org/rfc.html)”


    Pedro 将[超媒体](http://nordicapis.com/hypermedia-apis-and-adaptive-design/)视为可演变性的关键因素，允许
    API 提供者快速响应新需求而不破坏应用程序。对于 Mitra 关于复杂性分布的理论，使用超媒体意味着客户端开发者的初始增加了，但考虑到未来的变化，整体复杂性降低了。


    ![](img/image0097.jpeg)


    来自 [Apigee](http://apigee.com/) 的 [Brian Mulloy](https://twitter.com/landlessness)
    展示了一个用于[物联网](https://en.wikipedia.org/wiki/Internet_of_things) 的超媒体 API。通过使用超媒体，所有状态、操作和数据都在
    API 内部描述。


    Mulloy 将[物联网 API 设计](http://nordicapis.com/apis-power-the-internet-of-things/)
    描述为物理对象的信息设计。他将其与家乡底特律汽车化生产的早期进行了对比。突然城市有了大量的汽车，但基础设施并未为大量汽车涌入做好准备。随之而来的困惑导致了混乱甚至大量的交通事故。


    解决方案是使用信息设计，形成了今天全球范围内使用的标准设计。人行横道、交通信号灯、停止标志和车道线明确了在交通中如何行为。类似于汽车的早期阶段，我们仍在研究如何组织和设计今天的物联网
    API。


    组织内部拥有共同愿景对于 API 互连性的接受是关键。为了说服 API 的反对者（无论是架构师还是工程师），在他的[演讲](http://www.slideshare.net/duvander/the-architect-is-not-convinced)中，来自
    [Orchestrate](http://orchestrate.io/) 的 [Adam Duvander] 介绍了 API 提供者可以构建其 API 产品的四种方式以促进自信采用。


