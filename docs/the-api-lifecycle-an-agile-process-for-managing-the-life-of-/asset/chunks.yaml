    Now that your API has travelled through all stages of it’s life, it may be entirely
    changed, or might have kept most of it’s original form. Now that we have a good
    grasp on each stage, in this part we consider what adopting an ‘agile’ mindset
    means for developing and maintaining an API, and offer helpful resources to expedite
    the process.


    # 10. What Makes an Agile API?


    ![](Images/image00108.jpeg)


    Agile. API. API. Agile. It has a nice ring to it, but is it necessarily so? Having
    become a buzzword, ‘agile’ often comes loaded with misconceptions. At a Nordic
    APIs conference, Christian Nilsson of Beepsend SMS messaging solutions explores
    the concept of what it means to be truly agile in the context of APIs, offering
    6 tips to help an API provider determine what ‘agile’ really means for them.


    ## 10.1 What is Agile?


    Agile can be defined as an approach to problems, a software development process,
    and a business process. Like it’s name literally suggests, agile is lean, nimble,
    and filled with passion, with the ability to react to change rapidly.


    To Nilsson, agile has three common themes:


    1. Agile is breaking things down—but not to the point that they break.

    2. Agile means you can quickly shift business strategy.

    3. Agile cannot be burdened by previous decisions.


    ### Agile API Misconception #1: If You’re Not Agile, You’re Not Successful.


    In general, the closer a service is to the end consumer, the more agile it needs
    to be in responding to problems. As Nilsson says, “Internet users are fickle and
    promiscuous. They’re curious. They’ll leave your service in a heartbeat.”


    However, some businesses are naturally inflexible. When these businesses increase
    their distance from the end consumer, they become less agile and more stable.
    This gives the business a stronger reputation for reliability, which is a highly
    marketable trait to less flexible industries like banking.


    Services should ask themselves: **Why do we need this API?** What does ‘agile’
    mean to us and our business model? Is it right for us? Is it right for our customers?
    In the end, according to Nilsson, “you’re not automatically successful just because
    you’re agile, you’re successful because you’re passionate about your core model.”


    ### Agile API Misconception #2: There is Only One Perfect Software Development
    Process.


    So often, project management tools are thrown at software developers in order
    to make them work faster in a more transparent environment. But software development
    processes vary by needs, and corresponding tools should support – not enforce
    – your software development process.


    Project managers for APIs should start by assessing the size and makeup of their
    development team, along with critically analyzing the problem the team is trying
    to solve together. Considering these factors, the right strategies for development
    will naturally arise, often straight from group discussion on the topic.


    ### Agile API Misconception #3: Your System Is Secure.


    Security doesn’t start and end with outsmarting hackers. Nowadays, no matter how
    secure your system is, you are constantly battling against an infinite number
    of scripts, human errors and stealthy passwords. In this constantly unstable and
    insecure world, one shouldn’t relax and assume that all will remain stable.


    Bugs such as [Heartbleed](http://mashable.com/2014/04/10/heartbleed-programmer/)
    roam the web, and system dependencies can be altered at any time— such as recent
    `MySQL` changes enforced by `AWS`. A way to overcome these obstacles is through
    centralized configurations, which make sure that keeping your systems up to date
    is not labor intensive. You must be vigilant for any holes in the technology and
    to make sure that all developers are taking active steps to avoid cross-site scripting
    ([XSS flaws](http://en.wikipedia.org/wiki/Cross-site_scripting)).


    *For an in-depth study on implementing API security check out: [API Security:
    Deep Dive into OAuth and OpenID Connect](http://nordicapis.com/api-security-oauth-openid-connect-depth/)*


    ### Agile API Misconception #4: Your Extensive SLA and EULA Will Save You.


    Paypal includes 97 pages in their `SLA`. The reality of a Service Level Agreement
    (`SLA`) or End-User License Agreement (`EULA`) is that it is a best-case scenario.
    Some users will inevitably use a service improperly. How often will your team
    or the customer have the money and patience to bring a side to court on a trivial
    matter? You may like that your `SLA` or a `EULA` creates a sense of fear, but
    Nilsson argues that API providers should be more inviting to consumers instead
    of scaring them away with lengthy user agreements.


    ### Agile API Misconception #5: Your API is ‘Special.’ Keep That Secret Sauce
    a Secret.


    According to Nilsson, there are no secrets in coding anymore. The “secret sauce”
    of a business truly lies within execution. The secret sauce is how a you can adapt
    and transform to fluctuating markets. It’s how you practice agility. And it’s
    also how you provide fantastic customer service.


    > “If your secret is that no one has figured out what technology you use, you’re
    screwed, you’re doomed, you’re beyond saving. Your secret must be your staff,
    your DNA, your business model, your ability to change…”


    Technology is just one more conduit with which you can support your employees
    and help them strive for greatness. Plus, if you keep your tech a secret, when
    things go wrong, who will you be able to lean on? Communities established around
    open code and collaboration can help APIs dramatically increase in value; that’s
    what [smart cities all over the world](http://nordicapis.com/how-apis-are-driving-/)
    are realizing.


    ### Agile API Misconception #6: NoSQL is the Future That Will Power All APIs.


    Nilsson argues that `NoSQL` for storing and retrieving data just isn’t all it’s
    hyped up to be. He concedes that `NoSQL` has the ability to solve many problems,
    but argues that it cannot solve all of them. Like with all things in the programming
    and development world, solutions need to be agile. Often times this means pairing
    `NoSQL` with other solutions like a relational database.


    ## 10.2 Conclusion


    API providers must incorporate creative solutions for development that are tailored
    to their unique position. When building an agile API, you must keep all these
    facets in mind without falling to misconceptions of what it means to be agile.
    Following these considerations, and the four stages outlined in previous chapters,
    you should be prepared to react properly to your team’s needs, your business’s
    needs, and the end consumer’s needs.


    # 11. Third Tools


    So, you’re confident and ready to hit the ground running, but still could use
    guidance in managing your API. Well, we’ve assembled the following list of popular
    third-party tools built to assist API providers - from documentation, monitoring,
    to security solutions - that we’ve mentioned throughout this e-book or otherwise
    recommend for use. This list is not meant to be exhaustive at all, but rather
    is a curated list of what we are attracted to.


    Frameworks that ease the process of generating API documentation.


    *   [Apiary](https://apiary.io/)

    *   [API Blueprint](https://apiblueprint.org/)

