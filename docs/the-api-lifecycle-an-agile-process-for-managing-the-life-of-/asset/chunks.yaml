    确实，即使是传统的非数字化公司，例如建筑与工程公司贝德哲（Bechtel）、商业信息公司邓白氏布拉德街（Dun & Bradstreet）以及[漫威漫画](http://developer.marvel.com/docs)，也成功创建了卓越的平台。根结底，[每家公司都应该考虑如何利用
    API 来提升业务](http://nordicapis.com/should-every-company-consider-providing-an-api/)。


    许多组织开发 API 是为了扩展其现有功能。另一方面，一些企业正转向 API 平台化发展，将 API 定位为`核心价值`。许多[人脸识别](http://blog.mashape.com/list-of-10-face-detection-recognition-apis/)、自然[语言处理](http://blog.mashape.com/list-of-25-natural-language-processing-apis/)以及[机器学习服务](http://blog.mashape.com/list-of-50-machine-learning-apis/)
    都在做这一点。


    ## 1.3 执行市场调研


    与任何商业活动一样，查看你所在行业内竞争对手在做什么以衡量竞争情况至关重要。市场调研是你发布前策略中的关键组成部分。利用现有的[API 发现工具](https://www.apirise.com/8-api-discovery-tools/)来加强你的研究。


    根据该领域内其他 API 的成功情况，这有助于在你的 API 中推广替代方法或协议。创建一个账户并对竞争对手的 API 进行测试调用，想象这种体验如何能够改进。这将帮助明确你的产品在市场上的生存空间。


    ## 1.4 使你的 API 与业务目标保持一致


    API 应该要么增强现有的业务，要么以某种方式助力公司的整体目标。在我们的电子书[开发 API 思维](http://nordicapis.com/developing-the-api-mindset-private-partner-and-public-apis/)中，我们定义了三种类型的
    API 分类：私有的、合作伙伴和公共的。每种类型都有自己的优点和潜在缺点。API 提供者可以考虑使用多种策略来利用其 API 并证明其投资回报率 (ROI)。


    ### 私有 API 策略


    ![](img/image00084.jpeg)


    使用内部 API 蓬勃发展的行业类型是那些需要数据安全的行业，或者那些从分发数据中无法获利的行业。这些业务从简化内部运营的方法中受益匪浅。例如，银行通常使用内部
    API 进行转账并实现内部效率。


    私有 API 的`收益`可能是：


    *   简化内部运营

    *   整合分发渠道

    *   数据不公开发，提高安全性


    潜在的`缺点`可能是：


    *   潜在的收入流无法获取

    *   没有足够的开发者知道你的 API 的存在


    ### 合作伙伴 API 策略


    ![](img/image00085.jpeg)


    许多企业应用选择在大型数据交换交易中与信誉合作伙伴建立 API 合作。以 [ESPN 体育 API](http://developer.espn.com/docs)
    为例。他们的公共 API 被收紧，因为它降低了其主要分发渠道的价值。现在，ESPN API 集成由合作伙伴组织完成。


    为 B2B 交换开放 API 的`收益`：


    *   数据并非完全公开，保留了安全性和数据控制

    *   B2B 交易可能产生巨大的收入和互利的数据交换

    *   将资产扩展到具有既有市场的声誉良好的、成熟的服务中


    单一合作伙伴策略的潜在`缺点`可能是：


    *   某些收入流无法通过开放手段获取

    *   没有建立开放的开发者生态系统，认知仍然有限


    ### 公共 API 策略


    ![](img/image00086.jpeg)


    公共 API 是我们谈论 Web API 时通常指的是。这是一种向第三方开发者开放并集成到其应用程序中的服务。从社交网络、网约车、项目管理应用、数据处理工具等，都是服务开放给第三方开发者在互利交换中进行消费的常见领域。通过这种策略，提供者可能会收取使用费，或者创建一个免费使用的平台来提高品牌知名度。


    `收益`：


    *   将服务品牌扩展到更多应用有助于营销和[认知度](http://nordicapis.com/3-steps-to-increasing-brand-awareness-with-apis/)

    *   如果开发者愿意为你的服务付费，则可能产生一个盈利的生态系统

    *   可能提高更多终端用户的体验


    `缺点`：


    *   部分资产被暴露给公众，失去了数据的私有有性

    *   随着认知度的提高，安全威胁的风险也随之增加

    *   第三方应用可能声誉良好或不够成熟

    *   投资回报率的时间周期增加


    ## 1.5 选择你的 API 业务计划


    估算 API 的财务回报可能很难察觉。例如，对于公共 API，来自第三方应用的收入产生可能比正常时间长倍，因为你必须等待第二个产品的生命周期达到可持续运营并获得终端用户。在免费使用的场景下，该产品可能直接产生收入，但可能会提高品牌认知度，这最终可能导致增长，甚至有助于在收购交易中使用杠杆。


    API Science 的创始人 John Musser 认为“API 商业模式并非通用的”，他在该领域的工作中识别出至少[20 种 API 商业模式变体](http://www.slideshare.net/jmusser/j-musser-apibizmodels2013)。


    分级订阅、按需付费、免费增值（freemium）、基于单位的、收入分成——有许多变现可能，最后，大多数 API 都拥有多样化的变现系统。在下一章中，我们将讨论如何变现你的
    API。


    ![](img/image00087.jpeg) 更多关于 API 策略的信息，请查看开发 API 思维


    ## 2. 变现模型


    ![](img/image0088.jpeg)


    在开发之前，考虑你的 API 如何增加总收入至关重要。这个最后的分析阶段将指导你完成这一目标。我们提供了 5 种 API 变现模型，希望帮助作为 API 提供者的为开发者和终端用户带来价值，并通过托管你的
    API 获得收益。


    ## 2.1 你如何衡量你的 API 是否盈利？


