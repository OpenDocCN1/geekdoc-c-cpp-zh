    should be done within the **Analysis Stage** - before developing your API.


    ## 1. Preparing Your API Business Strategy


    ![](Images/image00083.jpeg)


    Overlooked by some, the **Analysis Stage** should be the first stop on any API’s
    lifecycle. It involves research and critical decision making that will impact
    all future designs of your API. The purpose is to validate *why* your organization
    needs an API and *who* is going to use it.


    This crucial stage forms a **business plan** for an API in it’s. Within this pre-development
    API phase, you should gauge interest from your target audience, perform market
    research, forecast trends within your sector, and make usage projections. To form
    a strategy, you’ll want to decide on your API’s business objective and what core
    API functionalities can help achieve this result, and then pair this knowledge
    with appropriate revenue models.


    Defining the above points will help an organization allocate resources for development,
    operations, and marketing, and should help in estimating your API’s ROI. This
    preparation will also supply a roadmap for decision-making throughout future lifecycle
    stages.


    ### 1.1 Basic Things to Consider


    Developing and releasing an API should be given the same amount of preparation
    as a new product launch. Especially if the API is a main offering, or is being
    built as the underlying construct for an entire platform, the end business objective
    should be in the forefront throughout the entire lifecycle.


    This early in the game, you’ll want to formulate answers to the following questions:


    * Why does my organization need an API?

    * What functions will the API accomplish?

    * What is the API value proposition?

    * Who is my intended audience?

    * Does my audience *want* to consume my API?

    * If for public use, what sorts of third-party products do you imagine being built
    with your API?

    * Will the API be a core business offering?

    * Does my organization possess the resources required to successfully develop
    and maintain an API?

    * What sort of metrics should I consider during analysis?


    ### 1.2 Determine If An API Is Right For Your Specific Situation


    For many companies, providing an API is seen as an IT matter exclusive to internet
    giants like Twitter, Facebook and Google, startups like Algolia, Wit.ai and Context.io,
    or for government agencies to open data to the public. But are APIs really limited
    in that way?

