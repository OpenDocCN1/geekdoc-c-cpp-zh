    *   `implementation` 的实施方法和时间尺度，即 API 是将立即实施还是随时间推移实施

    *   实现的类型，即 API 是 `specific`（定义单一用途或目的）还是 `global`（完全对现有的结构和系统进行重构）

    *   `measurable solution`（可衡量的解决方案），或者你的 API 实现对 `end-consumer`（终端消费者）产生的影响


    ### 7.6 整个生命周期中的指标


    为了更好地理解这一概念，让我们逐点分解 [API 生命周期](http://nordicapis.com/envisioning-the-entire-api-lifecycle/)，检查指标分析在每个阶段的作用。


    在 API 生命周期的第一阶段，即 分析阶段，指标分析的使用可能是最有效且用得最广泛的。在确定 API 的实用性、对其实现性的需求，以及在私有 API、合作伙伴
    API 和公共 API 之间做出决策时（这一主题在我们的电子书[开发 API 思维](http://nordicapis.com/developing-the-api-mindset-private-partner-and-public-apis/)
    中有更详尽的介绍），指标分析的使用专门旨在帮助你理解你的客户群、他们的需求以及易访问性和扩展性的相对重要性。通过分析市场趋势、审查 Web 服务器数据以及对潜在客户和用户进行轮询，指标可以帮助有效地收窄并定义
    API 系统的目标。


    在 API 生命周期的第二阶段，即 开发阶段，指标分析从外部角色转变为内部角色。通过分析开发者可用的系统、跟踪功能的管理和实施，并使用各种严谨的测试和错误跟踪方法，可以支持质量并将产品精炼到其最佳的初始状态。未能对此阶段的各种指标进行适当分析，可能会导致大量的隐性失败、功能集的缺失以及用户群体的整体不满。


    在接近 API 生命周期的末尾时，运营阶段 在指标分析方面的权重几乎与第一阶段一样大，因为它关注的是公共使用、接收情况以及通过迭代和补丁进行的内部响应。监控用户统计数据（包括使用方法和持续时间、关于易用性和扩展性的总体反馈，以及对
    API 系统的整体印象）不仅可以帮助你进一步完善产品、建立充满信心且强大的用户群体并快速响应错误和问题，还可以帮助你为未来的开发项目做好准备，并让下一次尝试的第一阶段变得更加顺利。


    最后，API 生命周期的第四阶段是 退役阶段。这一阶段通常是之前四个阶段有效分析的直接结果。在退役和弃 API 时，有关使用率、操作系统和浏览器支持、财务响应以及用户群信心的指标都可以为退役、继续或迭代
    API 的决策提供依据。


    未能进行 API 指标分析可能导致产品经历昂贵且长时间的开发周期，发布后发现需求很小，导致 API 在财务上不可行。然而，有效的指标分析可以帮助快速且以低成本生产出出色的产品，从而获得更高的需求和更长的寿命。这就是指标分析的原始力量。


    ### 7.7 真实失败案例 - Heartbleed


    API 安全是一个大问题，随着越来越多的公司采用[以 API 为中心的设计理念](http://nordicapis.com/why-you-should-build-apps-with-an-api-backend-baas/)，它正成为一个日益关注的问题。由于指标分析不当导致安全失败的最著名例子之一是臭名昭昭的[Heartbleed
    漏洞](http://en.wikipedia.org/wiki/Heartbleed)。这个漏洞影响了实现 `OpenSSL`（一种广泛使用的安全协议）的用户，其数据输入验证算法存在漏洞，允许缓冲区溢出（一种旨在允许数据超过最大缓冲区并“溢出”到二级缓冲区注册表的系统）中的过量数据在未经过验证或检查恶意代码的情况下被完整读取。由于此漏洞，数据可以在不经过验证的情况下强制通过溢出系统，执行的命令使得内部数据、系统和服务易受到外部恶意攻击。


    此漏洞直接是指标分析不当的结果。在 `OpenSSL` 系统和 API 的初始构建期间，并没有针对缓冲区溢出进行适当的“负向测试”（即对失败场景进行测试）；如果当时做了，该问题可能在早期被发现并在被滥用之前得到修补。`end-consumers`
    对安全系统的需求没有被正确识别，因为系统本身的漏洞没有针对常见的验证失败和恶意攻击场景进行适当测试。通过在指标分析过程中没有承认缓冲区溢出事件的发生率以及此类情况下未通过验证的数据类型，导致整类漏洞基本上被忽视了，直到为时已晚。


    ### 7.8 真实成功案例 - FedEx ShipAPI


    当 FedEx 开始为他们的货运和物流系统开发 API 时，他们心中只有一个问题——效率。通过摒弃“越成熟越好”的教条并专注于[敏捷的 API 和业务开发模式](http://nordicapis.com/what-makes-an-agile-api/)，FedEx
    的 API（被称为 `ShipAPI`）堪称最令人期待的成功故事。


    曾几何时，FedEx 被他们所谓的“WISMO”（我的订单在哪里？）电话所淹没——客户面临着货运时间差异巨大、交付日期不准确以及 FedEx 未向客户提供更新等问题。为了纠正这个问题，FedEx
    分析了这些电话的频率、发生位置、发送的包裹类型以及使用的货运服务。此外，FedEx 还检查了其内部操作、在 FedEx 设施接收时扫描条码的比例，以及长距离包裹跟踪系统的有效性。


    通过使用内部指标（利用来自用户和操作者的轶性指标以及来自服务器、扫描系统和内部报告的硬性指标），FedEx 能够确定其系统的弱点，缩短了交付产品的时间，提高了客户的满意度和信心，并创建了一个比以前任何系统都能更快、更准确更新客户信息的沟通渠道。一夜之间，FedEx
    品牌成为了快速高效运输的代名词，这很大程度上归功于他们利用指标分析对 API 进行有效开发和实施。


    '
- fmt: '

    Why would a web API be retired? what business factors contribute to this decision?
    In this part we examine the `Retirement Stage` of the API lifecycle, taking an
    in-depth look at example API deprecations to attempt to answer these tough questions
    and examining how to successfully retire your API while saving face with your
    developer community.


    ## 8. A History of Major Public API Retirements


    Old age comes, and retirement is a part of life. It’s no different in the API
    world. The retirement of the [Netflix](http://apievangelist.com/2013/03/12/netflix-api-is-much-more-than-a-public-api/),
    [Google Earth](https://developers.google.com/earth/), LinkedIn, and [ESPN](http://developer.espn.com/blog/read/publicretirement)
    APIs are examples of some recent large public API deprecations. Every major API
    retirement tends to spawn worry within the developer community; [are public APIs
    doomed?](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away)


    We don’t think so — don’t forget there’s currently an estimated 13,000 web APIs
    in operation, and the sector has [shown exponential growth](http://www.programmableweb.com/api-research)
    and is slated to increase with the IoT ([which isn’t just a fad](http://www.forbes.com/sites/groupthink/2014/10/16/the-internet-of-things-isnt-a-technology-fad/)).
    However, all things come to an end. As conditions change, technologies must evolve
    to meet new market conditions. A public-facing API may prove successful for some
    organizations, whereas for others, open environments may not be viable and lucrative.


    ### 8.1 What Does Retirement Mean?


    Retirement can mean many things. An API version may be scheduled for complete
    deprecation, or the API could still exist in a limited format with increased access
    controls. An API may simply slim down it’s excess functionality to become more
    consolidated and lean, or be fully replaced by an internal technology or outside
    competitor.


    In order to fully understand the conditions that beckon major API changes, we’ll
    lay out `5 common causes that beckon API retirements`. Using large API deprecations
    from recent years as examples, we’ll explore the reasoning behind each one that
    we’ve been able to surmise through our research. Sound fun? We think it’s pretty
    fascinating what can be learned from hindsight…


    ### 8.2 Retirement Reason #1: Lack of 3rd Party Developer Innovation


    A common scenario that may cause an API shutdown is if the API is receiving limited
    or unsolicited use by developers and end users. Though this could be due to inadequate
    marketing, it could also be proof that the API is not offering a true value to
    it’s consumers.


    #### Netflix


    Netflix proudly unleashed their API program in 2009, citing the possibilities
    for new app creations by third-party developers. Eventually they stopped issuing
    new API keys to developers, and [by 2014 this was shut down to all users](https://gigaom.com/2014/11/14/netflix-is-shutting-down-its-public-api-today/)
    aside from select partner integrations. According to Daniel Jacobson, Director
    of Engineering at Netflix, their reasoning was “to better focus our efforts and
    to align them with the needs of our global member base.”


    In the end, all of Netflix’s public API requests equated to about [one day](http://www.slideshare.net/danieljacobson/top-10-lessons-learned-from-the-netflix-api-oscon-2014)
    of private API requests. The user base for the public API was too miniscule to
    warrant it’s existence.


    The result was to eliminate their Public API program to embrace a single private/partner
    Java API. Nowadays, every Netflix app on any device taps into the Netflix private
    API, which performs data gathering, data formatting, and data delivery for all
    consumers. Netflix has also eliminated versioning within their API to embrace
    impermanence and constant change.


    We learn from this case that when a brand name and native platform is so powerful,
    creating an ecosystem with a public perhaps not necessary. Also, according to
    technologist [Andy Thurai](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away),
    it “becomes very expensive and time-consuming to maintain” both a Public and a
    Private/Partner API.


    ### 8.3 Retirement Reason #2: Opposing Financial Incentive, Competition


    A Public API may be retired if the interface interferes with primary business
    objectives. In exposing their data for anyone to consume, providers run the risk
    of losing a market advantage, especially if this is taking business away from
    native distribution channels.


    #### ESPN


    In the case of ESPN, their reasoning to retire their sports data platform was
    “to better align engineering resources with the growing demand to develop core
    ESPN products on our API platform.” Today, if you visit the [ESPN Developer Center](http://developer.espn.com/docs),
    you’ll notice that all APIs are open for “strategic partners” like IFTT, Pulse,
    and foursquare.


    [Discussion on Hacker News](https://news.ycombinator.com/item?id=8149477) suggested
    that it was because developers were monetizing their apps. [Andy Thurai](https://www.linkedin.com/pulse/20140905122647-2464386-are-public-apis-going-away)
    agrees, that “the actual reason seems to be that they want better control over
    unique content.” We learn that by exposing internal assets, a business may risk
    losing native distribution channels.


    #### Strava


    [Strava](https://www.strava.com/) offers fitness software for wearables. Starting
    with Strava v3, they began to curate developer consumers with [new requirements](https://engineering.strava.com/update-on-the-api-v3-release-and-v2-retirement/).
    A large API retirement can occur when developer consumers are incorporating monetization
    techniques that break the original agreement.


    ### 8.4 Retirement Reason #3: Changes in Technology & Consolidating Internal Services


    The tech sphere is constantly evolving. As such, advancements in these technologies
    have the potential to make an API obsolete. This happens often during internal
    redesigns, acquisitions, or external industry advancements. API retirement could
    arise from evolving protocol trends, such as replacing SOAP with REST, or changes
    in end user experiences, such as Netflix shiting’s primary business model from
    DVD distribution to video streaming.


    #### Skype


    Skype’s reason to decommission their Desktop API was, according to them, that
    it didn’t support new mobile development. The Skype Public API, [first introduced
    in 2004](http://andyabramson.blogs.com/voipwatch/2004/11/skype_api_now_o.html),
    was taken over by Microsoft in the 2011 aquition. The Microsoft-owned Skype Desktop
    API was shut down in order to embrace Skype URIs and the Microsoft client. The
    termination [irritated](https://aragonresearch.com/microsoft-kills-skype-desktop-apis-leaves-developers-scrambling/)
    some developers as it erased income for third-party applications as well as lessened
    functionality through the [Skype URIs](https://msdn.microsoft.com/en-us/library/office/dn74582.aspx).


    #### Google Maps Data API


    At the same rate Google releases new APIs, it also deprecates older versions.
    In 2010 Google announced they would discontinue the Google Maps Data API, a service
    made to store geospatial data. The main reason was that a superior feature was
    launched with v3 of the [Google Maps API](https://developers.google.com/maps/documentation/?csw=1),
    offering an improved method of query and storage that made the [Google Maps Data
    API](http://maps-data-liberation.appspot.com/) obsolete.


    Other Google APIs scheduled for deprecation due to outdated technology:

