    by measuring the time it took to build and introduce a certain function before
    the API and after. You can also turn that into dollars by way of the manpower
    needed. Of course, before making this move, you need to make sure that it won’t
    take excessive effort and resources to design and start using the API within your
    internal systems. Review the existing processes before considering implementing
    this one.


    ### 2.7 Mix, Match, Measure Models of API Monetization


    The reality is that your API monetization technique may involve an assortment
    of these models. Perhaps none are perfect for your particular situation, but it’s
    very likely that a couple of these API monetization tricks will work to help generate
    revenue. As always, build what will work for you.


    “The goal here is to build a successful API program that moves the business toward
    its goals,” Zazueta says. “And a program that’s not gonna do that won’t be successful
    for long.” You might be using one or more models already, but it won’t matter
    until you measure its success.


    ### 2.8 Your API Monetization Checklist


    We created this checklist to make it easy for you to figure out if you are able
    to monetize your API quickly. A *Yes* or a *Maybe* is certainly worth considering:


    1.  Are you able to profit from charging for your API directly?


    2.  Can giving access to your API be an upsell opportunity?


    3.  Are there ways to drive revenue indirectly through your API?


    4.  Do you have opportunities to make strategic API partnership?


    5.  Can an API improve operational efficiency and decrease time to market?


    Then, as you implement an API monetization strategy there are two questions to
    constantly keep on your mind:


    *   Are you measuring Average Revenue Per User (APRU) throughout each possible
    API-related revenue source?


    *   Are you comparing this APRU with the APRU of customers who don’t use your
    API?


    As with anything, make sure that your API monetization strategy is directly in
    line with your business objectives. If it’s clearly not, don’t waste your time.


    ## 3\. Understandig Your Target API Consumer


    ![](Images/image00090.jpeg)


    Consumer profiling that is a necessary first step for any business venture. For
    this chapter we cover strategies that help understand your target user within
    the specific context of APIs.


    ### 3.1 A Response to Increased Consumer Diversity'
