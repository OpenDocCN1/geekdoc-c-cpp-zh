    # 1. 架构师想要`control`：架构师习惯于传统的基础设施方法——在本地服务器上存储数据——他们可能反对云端操作，希望能够“触碰”软件。为了消除这种刻板印象，API
    提供商可以提供下载和本地存储数据集的能力，甚至为 API 提供本地化、专用的、托管的选项。


    # 2. 架构师想要`zero downtime`：为了增强服务的可靠性，拥有面向开发者的透明日志以通信 API 的运行时间至关重要。


    # 3. 架构师想要看到`responsibility`：API 系统需要设计为[安全系统](http://nordicapis.com/how-to-control-user-identity-within-microservices/)，并使用[现代方法](http://nordicapis.com/building-a-secure-api/)。


    # 4. 架构师需要一个保证`longevity`的集成方案


    在“为现在而开发”的方法中，开发人员正在创建一个供`立即`使用的 API，完全侧重于集成现有的功能集并支持特定的查询集。然而，这种方法的缺点是，它们仅在所设计的用途上是健壮的，并无其他。为服务或系统的即时需求和要求进行设计固然很好，但对长期支持帮助不大。


    保持`consistency`。如果你的 API 使用的调用运行不在相同的[环境](http://blog.8thlight.com/craig-demyanovich/2011/10/03/inconsistent-apis.html)中，那么寻找
    bug 将变成一项苦差。如果你的[文档在功能上不一致](https://twittercommunity.com/t/rest-api-inconsistent/31794)，你可能会面临困惑并导致用户群体分裂。如果你有一套引用外部来源的方法，请在每个地方都使用这种方法。如果你用一个请求涵盖了另一个请求，请确保没有冗余。数据的价值取决于其是否易于理解。当用户从你的
    API 接收数据时，考虑其交付的方法。按类型界定数据，并在某些限制内允许排序。允许 API 具有更大实用性的强大、动态服务，是许多开发者的[共同需求](http://www.computerszone.org/50-most-useful-apis-for-developers/)。


    返回说明显而易见的错误（`something went wrong`）、无用的错误（`ERROR`）或完全令人困惑的错误（`error code:9423`）是失败的——如果你的用户无法发现出了什么，他们就会停止使用该
    API。同样，未能返回有效的 `JSON` 并拒绝记录错误代码的实际含义，会导致潜在的 API 开发产生怀疑。确保所有的错误返回都是易于理解的`Uptime`
    是我们的第五个也是最后一个建议，因为它是一个我们可以全面判断 API 的极佳指标。它代表了所有部分的协同工作——如果 API 的单个元素管理不当，`uptime`
    可能会受到影响。在编写此时，Bit.ly 报告[过去 24 小时的可用性为 100%](http://status.bitly/)，年度可用率为 [99.9%](http://bitly.com/post/5192365/bit-ly-1)。同样，Twitter
    报告[100% 的可用性](https://dev.twitter.com/overview/status)，平均可用率为 [99.9%](http://social.downornot.com/)。正如他们所说，证明就在于结果（或者在本例中是
    `uptime`）。


    ## 5.1 总结 API 设计技巧


    考虑到开发你的 API 是一项严肃的任务。现在所出的选择将极大地影响你未来的成功。虽然这些解决方案事后实施，但在开始时实施它们要容易得多。这不仅将交付更完整的集成功能集，还将带给你一个终端文档和用户体验简单的产品。这些设计和开发概念可能很简单，但其应用的影响是惊人的巨大——实施它们可以带来爆炸性的增长、高用户采用率和长期使用。设计一个允许
    API 提供者处理大多数复杂性的 API，并为客户简化流程。最，不要忘记 API 设计应该服务于你的业务需求。


    # III 运营阶段


    ![](img/image0098.gif)


    在这一部分，我们讨论哪些因素构成了阶段以及如何处理它们。我们将考虑将你的 API 转换为开发者想要的内容，并学习这将对你的业务产生什么影响。其他关键行动包括与你的
    API 受众保持良好关系并为他们提供适当的支持渠道。


    ## 6. 营销你的 API


    首先，让我们从一个不同的角度来看你的 API——将你的 API 不仅作为一个面向开发者的工具，而是一个解决实际问题的完整产品。在这一章中，我们将看到这个角度如何微调你
    API 的推广，使其更多关注受众的视角和需求。


    ### 6.1 将你的 API 作为产品运行


    为什么你应该把你的 API 视作一个成熟的产品？API 不不是支持你现有产品的某种吗？虽然这听起来很奇怪，但像运行任何其他产品一样运行 API 实际上非常有道理。


    根据定义，产品是为了满足一组消费者需求而存在的东西。通常，在产品开发期间，你会研究[消费者需要什么](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/)，以便相应设计你的产品。你还会进行研究以了解消费者将如何使用你设计的的产品。这些活动的结果最终将导致你新产品的创建。


