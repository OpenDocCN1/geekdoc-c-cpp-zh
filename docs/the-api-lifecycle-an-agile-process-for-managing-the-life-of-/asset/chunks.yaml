    As the API space increases in diversity, more and more attributes make up the
    developers using them.


    ### 3.6 Varying Industry Backgrounds


    With the recent rise of B2B and enterprise interest, should API providers be selling
    to individual developers? Or is it a better idea to seek out business partnerships
    directly? The way APIs are marketed and consumed varies tremendously on the `industry`.
    API providers may range from a two person startup to an enterprise development
    team spanning hundreds of employees. The same diversity is present on the consumer
    end, affecting the way APIs are acquired. The core value message also changes
    based on whether the API is directed toward startups, engineers in a large organization,
    or toward convincing upper leadership. We can begin by separating the consumer
    side of the API space into two distinct groups:


    *   **Enterprise Developers**: Developers working within a large organization.
    The challenge faced here is that they may not be the decision maker. Working on
    the inside, means they must make the case upwards, involving multiple parties
    and potentially creating a longer decision making process.

    *   **Freelance Dev Shop**: These are small startup teams looking for helpful
    API integrations to accell their product.


    According to Jason Hilton of Catchy Agency, industry variance mean it’s “It’s
    worth applying specific techniques and strategies. Just as much energy and consideration
    needs to be put into marketing a developer program as with any other product.”


    ### 3.7 API Use Cases


    API providers must imagine the API’s `use case` in the wild. Why would someone
    want to use your API? Providers should consider the possibilities the data offers
    and brainstorm `applications` that could be created using the API. Kelly believes
    this process will help identify consumer needs:


    > “The key to a good persona is in establishing concrete user scenarios and stories…You
    need to understand the needs of your customer before deciding what to offer them.”


    This process also involves considering the `business model` of the product that
    will be created using the API. Hilton notes that “the business model of the API
    is important — we know that serious developers will monetize either through paid
    apps, or carrying ads. Trying to get the developer of a paid app to implement
    an ad API is pointless.”


    ### 3.8 Lessen The Corporate Branding


    Marketing, relations, outreach — typical B2B sales motives, labels, and tactics
    may conjure up negative connotations. At times, enterprise clientele may need
    to lessen the corporate branding to appeal to the tech community. Within the tech
    community the Evangelist job function is now more commonplace than ever. Alternative
    roles like “evangelist” or “developer advocate” help communicate a `true passion`,
    and [having a passion, and a true conviction for what you are promoting](http://timoelliott.com/blog/2013/07/how-to-become-a-technology-evangelist.html)
    will win the day. The lesson of 2015, according to the Catchy team, is that “If
    you have a developer evangelist, you have a dev program.”


    ### 3.9 Developer Experience


    The presentation of developer facing material is paramount to success in the space.
    API providers can use tactics to help acquire developers, increase onboarding
    efficiency, and maintain user retention by appealing to the tastes and needs of
    the audience. Stellar reasoning behind creating quality developer experience can
    be found in John Musser’s “[10 Reasons Why Developers Hate Your API](http://www.slideshare.net/jmusser/ten-reasons-developershateyourapi).”
    Harking back to Andreas Krohn’s stance on the need for increased inclusion, API
    experience should also consider the entrepreneur experience, the manager experience,
    and the designer experience. In that spirit, embrace developer language, but also
    cater content, `appearance`, UI, and UX to your audience. According to Kelly,
    “developer experience is the most important metric of quality for an API. It’s
    vital.”


    ### 3.10 Build it And They Will _____


    Simply opening a platform up without having a intimate knowledge of your consumer
    will not work in this sector. Product teams within technology companies often
    assume the product will be used, but too often, marketing is either too slim or
    inefficient, leading to a low adoption.


    Perform the necessary research to find who your consumer *really is*. Who is the
    key influencer that can communicate the value of your API? It comes down to knowing
    the needs of this audience, and this requires thorough analysis before development
    should begin.


    # II Development Stage


    ![](Images/image00093.gif)


    Arguably the most important action in the API lifecycle phase is implementing
    the API and bringing it to life. Read on to learn more about this process and
    to understand what factors contribute to choosing the best combination of standards,
    designs, and programming languages for your API.


    ## 4. Constructing Your API


    This chapter covers the actions to take as well as the most important challenges
    to address during an API’s `Development` phase. We’ll consider what implementation
    options are available and explore API Management and why it matters. We’ll define
    [API Usability and why it’s important](http://nordicapis.com/why-api-developer-experience-matters-more-than-ever/),
    and we’ll consider what immediate steps to take after your API is deployed.


    ### 4.1 Things to Consider During Implementation


    At this point you should have a [well-defined API business strategy and documentation](http://nordicapis.com/api-lifecycle-analysis-stage-preparing-your-api-strategy-pre-launch/
    "API Lifecycle Analysis Stage: Preparing Your Prelaunch API Strategy"). This includes
    defining who your main API stakeholders are going to be, and deciding how the
    API will be consumed. By this point you should have answers to the following questions:


    *   **What value** is the API providing? Is it a means to distribute data or does
    it offer specific functionality that can be used to build apps?

    *   **Who will consume** the API? Are consumers interacting with your API to get
    data or are they consuming it on behalf of other users?

    *   **How many consumers** will the API have? Is it a private API consumed internally
    or is it going to be available to millions of consumers?


    Answering these questions will help you cut corners during the implementation
    process. Let’s start with understanding what you are trying to enable with your
    API so that you can define which methods and protocols you’re going to use.


    #### Methods and Protocols


    The best way to define methods and endpoints for your API is to follow the functionality
    you’d like to provide and choose the most appropriate standards and protocols.
    Identify what type of data manipulation your main API consumers usually have available.


    If your main consumers are mobile apps, consider offering endpoints that ask for
    and respond with as little information as possible. This is to prevent large bandwidth
    consumption and speed up operations that involve calls to your API. If, by contrast,
    you’re offering an API that will mostly be consumed by the financial market, carefully
    study what frameworks they’re using and how they communicate with external APIs.


    Whatever you do, we recommend not to follow the very latest trends presented as
    “the future.” Trends can and will change many times before they stabilize and
    become widely adopted, and your API will have to keep up with this market fluctuation.
    Determine what 80% of your target audience is using and offer that.


    #### SDK Programming Languages


    Choosing how you’ll offer access to your API is directly related to how your API
    will be consumed. Will it mainly be consumed by mobile app developers? Then offer
    ready-to-use mobile SDKs. Brainstorming your potential API use cases is the first
    step in choosing how your SDK will be packaged.

