    *   The method and timescale of `implementation`, i.e. whether or not the API
    will be implemented immediately or over time

    *   The type of implementation, i.e. whether or not the API is `specific` (defining
    a single use or purpose) or `global` (completely overhauling the already existent
    structures and systems)

    *   The `measurable solution`, or the effects caused by the implementation of
    your API on your `end-consumer`


    ### 7.6 Metrics Throughout the Lifecycle


    To better understand this concept, let’s break down the [API Lifecycle](http://nordicapis.com/envisioning-the-entire-api-lifecycle/)
    point by point, examining the role of metric analysis in each stage.


    In the first stage of the API Lifecycle, the [Analysis Stage](#part0004.xhtml_Analysis),
    metric analysis is perhaps most effectively and extensively used. While determining
    the usefulness of an API, the demand for its implementation, and the decisions
    between Private APIs, Partner APIs, and Public APIs ([a subject covered more fully
    in our eBook Developing the API Mindset](http://nordicapis.com/developing-the-api-mindset-private-partner-and-public-apis/)),
    the use of metric analysis is specifically designed to help you understand your
    client base, their needs, and the relative importance of ease of accessibility
    and extensibility. By analyzing market trends, reviewing web server data, and
    polling prospective clients and users, metrics can help effectively narrow and
    define the objective of an API system.


    During the second stage of the API Lifecycle, the [Development Stage](#part0008.xhtml_Development),
    metric analysis switches from an external role to an internal role. By analyzing
    the systems available to your developers, tracking the management and implementation
    of features, and using varied methods of rigorous testing and bug-tracking, quality
    is supported and the product is refined into its best possible initial state.
    Failure to perform proper analysis on the varied metrics in this stage can result
    in massive hidden failures, missing feature-sets, and an overall displeased user
    base.


    Nearing the end of the API Lifecycle, the [Operations Stage(#Operations) is nearly
    as heavy in metric analysis as the first, as it is concerned with the public usage,
    reception, and internal response through iteration and patching. Monitoring user
    statistics, including the methods and durations of use, general feedback concerning
    usability and extensibility, and the overall impression of the API system can
    not only help you further refine your product, build a confident, strong user
    base, and quickly respond to bugs and issues, it can also help you prepare for
    future development projects and make the first stage of your next endeavor that
    much smoother.


    Finally, the fourth stage of the API Lifecycle is the [Retirement Stage](#part0014.xhtml_Retirement).
    This stage is often the direct result of effective analysis throughout the previous
    four stages. When retiring and deprecating APIs, metrics concerning usage rates,
    operating system and browser support, financial response, and user base confidence
    can all inform the decision to retire, continue, or reiterate an API.


    Failure to conduct API metric analysis could result in a product undergoing an
    expensive and lengthy development cycle only to find little demand upon release,
    making the API financially impractical. Effective metric analysis, however, can
    help create a stellar product, produced quickly and with less expense, resulting
    in higher demand with a longer lifespan. This is the raw power of metric analysis.


    ### 7.7 A Real-World Failure - Heartbleed


    API security is a huge issue, and is becoming a more prominent concern as more
    companies adopt the [API-centric design concept](http://nordicapis.com/why-you-should-build-apps-with-an-api-backend-baas/).
    One of the most well-known examples of security failure arising from poor metric
    analysis is the infamous [Heartbleed bug](http://en.wikipedia.org/wiki/Heartbleed).
    This bug, which affected users implementing `OpenSSL`, a widely used security
    protocol, had a vulnerability in its data input validation algorithm, which allowed
    for excess data in its buffer overflow (a system meant to allow data exceeding
    the maximum buffer size to “overflow” into a secondary buffer registry) to be
    read in its entirety without being validated or checked for malicious code. Due
    to this bug, data could be forced through the overflow system without validation,
    executing commands that made internal data, systems, and services vulnerable to
    external, malicious attacks.


    This bug is directly a result of improper metric analysis. During the initial
    construction of the `OpenSSL` system and API, “negative testing”, or the testing
    of failure scenarios, was not properly conducted against the buffer overflow;
    if it had been, the issue would likely have been found early on and patched before
    it was abused. The needs of a secure system for `end-consumers` was not properly
    identified, as the vulnerabilities of the system itself were not properly tested
    against common validation failure and malicious attack scenarios. By not acknowledging
    the rate of buffer overflow incidents and the type of data that failed validation
    during such scenarios in the metric analysis process, an entire class of vulnerabilities
    was essentially ignored until it was too late.


    ### 7.8 A Real-World Success - The FedEx ShipAPI


    When FedEx set out to develop an API for their shipping and freight systems, they
    had one issue in mind — efficiency. By eschewing the “established is better” mantra
    and focusing on an [agile mode of API and business development](http://nordicapis.com/what-makes-an-agile-api/),
    FedEx’s API, known as `ShipAPI`, is about as impressive a success story as one
    could hope for.


    At one time, FedEx was flooded with what they call “WISMO” (Where IS My Order?)
    calls — customers dealing with extreme variations in ship times, inaccurate delivery
    dates, and a lack of updates from FedEx to the customer. To rectify this problem,
    FedEx analyzed the frequency of these calls, the locations from which they were
    made, the types of packages being sent, and the shipping services used. Additionally,
    FedEx examined their own internal practices, the rate of adherence to electronic
    scanning of barcodes upon receipt at a FedEx facility, and the effectiveness of
    their long-distance package tracking system.


    By identifying the weaknesses in their own system through the use of internal
    metrics (utilizing both anecdotal metrics from users and operators as well as
    hard metrics derived from servers, scanning systems, and internal sorting reports),
    FedEx was able to pinpoint their points of failure, decreasing the time it took
    to deliver a product, increasing customer satisfaction and confidence, and creating
    a channel of communication that could update the customer faster and more accurately
    than any system previously used by the customer. Almost overnight, the FedEx brand
    became synonymous with quick, efficient shipping, and that is greatly due to their
    effective development and implementation of an API utilizing proper metric analysis.


    ### 7.9 Security, Effectiveness, and Commerce


    Fundamentally, the process of metric analysis is not just one focused on security.
    Commerce, effectiveness of solutions, and more can all be determined through the
    proper derivation, analysis, and application of solutions deriving from metrics.
    By determining your end-consumer, their needs, the needs of your process, and
    the total result of the application of an API, you can dramatically increase revenue,
    security, and even your consumer-base.


    The lesson of it all? Understand your consumer base. Understand the API you are
    developing. And, most importantly, measure your success and learn from your failures.


    # IV Retirement Stage


