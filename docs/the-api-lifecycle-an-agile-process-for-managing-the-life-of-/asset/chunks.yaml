- fmt: '

    As your developer portal will be central to all your API-related activities, it
    should offer an easy access to all the following resources:


    *   **[API Documentation](http://nordicapis.com/spark-api-adoption-good-documentation-practises/
    "How to Spark API Adoption With Good Documentation Practices")**: Probably the
    most important resource, documentation should always be up-to-date and provide
    all information needed to quickly begin consuming your API.

    *   **Application Registration**: Offer an easy-to-follow registration process
    that any developer can understand. The output of this process should be an `API
    Key` or a `Client ID` and `Secret` if you’re using OAuth.

    *   **API Console**: Developers usually want to test your API without having to
    write any code. Either offer an [API Console](http://nordicapis.com/html-hypermedia-apis-and-adaptive-web-design/)
    or provide ready-to-use code that can be copied and pasted. This first impression
    of API functionality should be succinct and powerful.

    *   **SDKs**: After testing, your developers will want to consume the API from
    within their existing applications. Offer the appropriate SDKs and follow the
    packaging and installation standards for each programming language. For example,
    if you’re offering a Ruby SDK, offer it as a Ruby gem.

    *   **Announcements**: Keep your audience up-to-date with anything you do related
    to your API. Announce all upcoming API changes and other relevant activities.

    *   **Use Cases**: Provide comprehensive use cases that your audience can identify
    with. Complement them with sample code that uses your SDKs. It’s much easier to
    understand how your API works by reading a story than by going through the full
    reference.

    *   **Support**: Offer a simple support channel directly from your developer portal.
    Whenever developers have a question they should be able to contact your support
    team from within the portal. Provide quick feedback on support requests and always
    follow up.

    *   **Links to External Resources**: Link to external resources that could help
    developers use your API. Have your documentation link to the standards that you’re
    following and provide relevant social media links so developers can follow your
    announcements.


    If you implement all these suggestions you’ll have a superior API Developer Portal,
    but you still have to attract developers to it. Site activity should be combined
    with a permanent instrumentation of your API and Developer Portal usage so that
    you can correctly measure traction.


    ### 6.3 Using Different Traction Channels


    In order to obtain the best possible results, fostering your API user base should
    be done across a number of different channels. Along the way you should measure
    activity on each channel and adjust accordingly. As you’re about to see, marketing
    channels have different costs and you should understand how much, on average,
    each new developer is costing you to acquire.


    In the Product world, this value is often called `Customer Acquisition Cost` or
    `CAC`, and can be used as a model to determine if any of your channels should
    be abandoned. To append this, you should also estimate the total future revenue
    obtained from each new developer using your API. The `Customer Lifetime Value`
    or `CLTV` is what defines how much revenue, on average, each developer will generate.


    ![](Images/image00101.jpeg)


    To [make a profit](http://nordicapis.com/5-ways-apis-will-increase-revenue/ "5
    Ways APIs will Increase your Revenue"), you should always aim for a `CAC` smaller
    than the `CLTV`. Otherwise, you’ll end up paying more for developers than the
    potential future revenue that you’ll obtain from them. With this in mind, let’s
    look at some possible traction channels.


    #### Evangelizing Your API


    Evangelizing is one of the methods used by most of the popular APIs. Evangelizing
    is usually done by meeting developer groups in person to share stories about how
    your API can be used. So-called “API Evangelists” are used to promote APIs using
    online media, and in person by attending developer-oriented meetups, conferences,
    and other related events.


    Naturally, this type of promotion can have a cost range of nearly nothing — especially
    if you’re doing it by yourself online — but can be more costly if you employ a
    group of dedicated evangelists to attend every possible developer conference.
    Be pragmatic by starting small and measuring your results along the way.


    #### Hackathons, Events, Conferences


    ![](Images/image00102.jpeg)


    Another popular traction method is promoting your API is by hosting a hackathon
    or developer oriented event. Hackathons may be geared toward a specific industry
    or theme and are often location-based — allowing you to target specific demographics
    and discover and promote new use cases that can be showcased on other channels.


    #### Integrations and Partnerships


    An interesting way to gain traction is to attach your API to the growth of other
    products and APIs. This can be done by creating integrations that will make your
    API easily available and consumable by developers who use other products. Integrations
    often address specific use cases, so carefully study which one will attract the
    largest number of developers. Some integrations might be as easy — such as writing
    the code and publishing a guide — but in some cases you might need to engage into
    partnership development.


    Here, the cost will mostly be associated with software development activities
    — but don’t forget that you’ll also have to maintain and support the integration
    after it goes live.


    ### 6.4 Supporting Your API


    Support always works better the closer you are to your audience. Understand where
    your API consumers usually ask for help and have a saying in those places. Don’t
    force your developers to use specific tools and processes that don’t make sense
    from their point view or you’ll start to see them abandoning your API after an
    unsuccessful usage.


    A simple way to grow your support channel is to keep things open. Keeping API-related
    activities as publicly transparent as possible means your support team will spend
    less time replying to the same requests.


    #### Use GitHub


    [GitHub](https://github.com/) is considered the most popular developer-friendly
    service and API providers should take it seriously. By using their free plan you
    can create a repository to provide an easy-to-use support channel. GitHub offers
    a way to manage issues related with code changes and openly interact with developers.
    An example company following this approach is Spotify, who has been very open
    about all their API-related `https://github.com/spotify/web-api/issues "Spotify
    Web API issues` through GitHub.


    #### Other Developer-oriented Support Tools


    Research your developer audience to understand which other web services they use
    the most. It’s important to have a presence on them as well. Popular services
    include [Stack Overflow](http://stackoverflow.com/ "Stack Overflow"), specific
    [subreddits](http://www.reddit.com/ "reddit"), [Twitter](https://twitter.com/
    "twitter") or [Facebook](https://www.facebook.com/ "Facebook"). Although social
    media isn’t specifically a support channel, you can use it to quickly give feedback
    to any questions developers might have about your API. Remember to always be open
    and to provide helpful responses.


    ## 7. The Importance of API Metrics


    ![](Images/image00103.jpeg)


    Success and failure are relatively subjective terms — what defines success for
    one business might be considered a failure for another, and the relative of success
    in certain areas of performance can change from industry to industry, department
    to department, and even on a [case to case basis](http://nordicapis.com/open-data-how-to-make-it-work-for-your-business/).
    This volatility in expectations, outcomes, and impacts can make API documentation,
    implementation, and support a difficult undertaking.

