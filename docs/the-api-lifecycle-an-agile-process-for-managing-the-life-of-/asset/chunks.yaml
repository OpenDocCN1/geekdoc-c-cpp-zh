- fmt: '

    An intimate understanding of API processes will help form technical requirements.
    For example, knowing whether your API will [open your firms’ data](http://nordicapis.com/open-data-how-to-make-it-work-for-your-business/),
    or act as a [content distribution channel](http://nordicapis.com/apis-as-a-content-distribution-channel/)
    can impact overall design.


    In general, the API development stage should mimic the business objectives set
    forth within the Analysis phase. A methodical development phase considers [design,
    construction and testing](http://nordicapis.com/api-design-testing-state-art/)
    of API processes as well as security. Design your API with both [human usability](http://nordicapis.com/designing-apis-humans/)
    and [machine standards](http://nordicapis.com/designing-apis-machines/) in mind.
    It is a good idea at this point to also implement and evaluate API versioning
    strategies that will set the API in a good position for future updates.


    During the Development Stage, a team may choose to return to the **Analysis Stage**
    to perform additional market research and general preparation. This can arise
    from technical roadblocks, or the urge to revision an APIs’ primary objectives.
    If the API feels polished, tested, secure, and ready for general use, you are
    ready to move to the **Operations Stage**.


    ## #3: Operations Stage


    ![](Images/image00080.jpeg)


    If you’re team’s lean as flank steak, you may be sprinting a minimum viable product
    straight to the masses. With loose nuts and bolts, it’s natural that the Operations
    Stage will involve a lot of tweaking and bug-fixing in addition to marketing.


    To spread awareness, API providers can host **hackathons**, improve **SEO** for
    home page and documentation, have a dedicated **@Dev** channel, and use popular
    **discoverability** methods and channels. If the resources are available, companies
    should also employ a dedicated **API Evangelist** to promote the API at physical
    events and throughout the blogosphere.


    In the end, marketing an API largely depends on an inside-out approach. Having
    an [easy-to-consume development portal](http://nordicapis.com/designing-apis-humans/),
    an embedded **help desk**, along with other [DX driven suggestions we’ve laid
    out in the past](http://nordicapis.com/why-api-developer-experience-matters-more-than-ever/)
    will help boost conversion rates.


    This part of the lifecycle will likely take the most energy and time. Monitor
    usage statistics, and engage with users. Use any helpful data to aid in constant
    revising. Especially if an API program is in a closed beta, inbound tactics to
    collect feedback will help tremendously to aid in this iterative development process.
    Make sure that all API changes are well documented on your release notes.


    This exciting stage will bestow on an API practitioner real market requirements,
    and could potentially expose a business to entirely new opportunities. Statistics
    and data collected here will impact tech requirements that could result in revisiting
    the **Development Stage** to make incremental changes or new API versions, or
    consulting the **Analysis Stage** to make larger pivots. If forecasts look grim,
    a team may consider moving to the **Retirement Stage** at this point.


    ## #4: Retirement Stage


    ![](Images/image00081.jpeg)


    Old age comes, and retirement is a part of life. It’s no different in the API
    world. It’s good to know what factors contribute to small revisions as well as
    large deprecations. In this stage, a provider may decide to retire an API due
    to limited use, outdated plugins, a lack of 3rd party innovations, opposing financial
    incentives, and more. A business may risk losing an advantage if an API decreases
    traffic from native distribution channels.


    Versioning, deprecation, or lassoing in an API into a more internal state are
    options to consider if your key performance indicators are showing a flatline.
    At this point, the **Analysis Stage** can be reattempted, and the lifecycle repeated
    if viable. A Public API may still prove profitable as a Partner offering, for
    example. **Retiring** an API or API version is the best option when the API no
    longer is the best solution to reach the goals of the business. Whatever the solution
    is, we recommend a transparent public announcement that offers a reasonable timeline.


    ## Choose Your Adventure:


    In this chapter we’ve given a 30,000 foot view of the somewhat untraditional API
    lifecycle. Further chapters will offer fine-grained perspectives on each stage
    in the lifecycle, bolstered by specific industry use cases that demonstrate effective
    strategies for each. Here’s where we’re going:


    1. [Analysis Stage](#part0004.xhtml_Analysis)

    2. [Development Stage](#part0008.xhtml_Development)

    3. [Operations Stage](#part0011.xhtml_Operations)

    4. [Retirement Stage](#part0014.xhtml_Retirement)


