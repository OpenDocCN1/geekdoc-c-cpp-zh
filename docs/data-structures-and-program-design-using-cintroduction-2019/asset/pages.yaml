    # ## 10.1 Introduction


    In Chapter 6, we discussed three types of searching techniques: linear search,
    binary search, and interpolation search. Linear search has a running time complexity
    of O(n), whereas binary search has a running time proportional to O(log n), where
    n is equal to the number of elements in the array. The searching algorithms discussed
    within Chapter 6 are efficient. However, their search time is dependent on the
    number of elements in the array, and none of them can search for an element using
    the constant time equal to O(1). But it is very difficult to achieve in all the
    algorithms like linear search, binary search, and so on, as all these algorithms
    are dependent on the number of elements present in the array. Also, there are
    many comparisons involved while searching for an element using the previous searching
    algorithms. Therefore, our primary need is to search for the element in a constant
    time along with less key comparisons. Now, let us take an example. Suppose there
    is an array of size N and all the keys to be stored in the array are unique and
    also are in the range 0 to N-1. Now,'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'we will store all the records in the array based on the key array index and
    keys are same. Thus, in that case we can access the records in a constant time
    along with no key comparisons involved in it. This can be further explained by
    the following figure:


    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] | arr[5] | arr[6] | arr[7] | arr[8]
    | arr[9] |

    |---|---|---|---|---|---|---|---|---|---||

    | | 1 | | 3 | 4 | | 6 | | 8 | |


    FIGURE 10.1. An array.


    In the previous figure, there is an array containing five elements. Note that
    the keys and the index numbers are the same; that, the record with the key value
    3 can be directly accessed by array index arr[3]. Similarly, all the records can
    be accessed through key values and the array index. Thus, this can be done by
    hashing, where we will convert the key into an array index and store the records
    in the array. This can be done as follows:


    ![](img/5e3627f19c26cb38acf457f2722a0abd_451_0.png)


    FIGURE 10.2. Array index generation using hashing.


    The process of array index generation uses a hash function which is used to convert
    the keys into an array index. The array in which such records are stored is known
    as a hash table.'
