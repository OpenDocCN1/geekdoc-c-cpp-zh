  md: "# Algorithm to convert an infix expression into a postfix expression\n\n| **Step\
    \ 1**: START Add ')' parenthesis to the end of infix expression |\n| **Step 2**:\
    \ Add '(' parenthesis on the stack. |\n| **Step 3**: Push'(' parenthesis on the\
    \ stack. |\n| **Step 4**: Repeat the steps until each character in the infix expression\
    \ is scanned.\n a) If '(' parenthesis is found, push it onto the stack.\n b) If\
    \ an operand is encountered, add it to the postfix expression.\n c) If ')' parenthesis\
    \ is found, then follow these steps -\n - Continually pop from the stack and add\
    \ it to the postfix expression until '(' parenthesis is encountered.\n - Eliminate\
    \ the '(' parenthesis.\n d) If an operator is found, then follow these steps -\n\
    \ - Continually pop from the stack and add it to the postfix expression which\
    \ has same or high precedence than the current operator.\n - Push the current\
    \ operator to the stack. |\n| **Step 5**:Continually pop from the stack to the\
    \ postfix expression until the stack becomes empty. |\n| **Step 6**:EXIT |\n\n\
    **For Example** – Convert the following infix expression into a postfix expression.\n\
    \n+   a) (A + B) * C / D\nb) [((A + B) * (C - D)) + (F - G)]"
