    # 12.6.2 Kruskal''s Algorithm


    Kruskal''s algorithm is another approach for determining the minimum spanning
    tree of a graph. In this approach also, the tree is built edge by edge. The next
    edge to be included is chosen according to some criterion. The steps involved
    in Kruskal''s algorithm are:


    **Step 1:** The weights/costs assigned to the edges are sorted in ascending order.


    **Step 2:** In this step, the lowest weighted/cost edge is added to the tree.
    Remember, the edge forming a cycle must not be added.


    **Step 3:** End the process when (n-1) number of edges have been inserted into
    the tree.'
