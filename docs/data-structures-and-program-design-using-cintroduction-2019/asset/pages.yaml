    # 8.1 Introduction


    In earlier chapters we learned about various data structures such as arrays, linked
    lists, stacks, and queues. All these data structures are linear data structures.
    Although linear data structures are flexible, it is difficult to use them to organize
    data into a hierarchical representation. Hence, to overcome this problem or limitation,
    we create a new data structure which is called a tree. A tree is a data structure
    that is defined as a set of one or more nodes which allows us to associate a parent-child
    relationship. In trees, one node is designated as the root node or parent node,
    and all the remaining nodes can be partitioned into non-empty sets, each of which
    is a subtree of the root. Unlike natural trees, a tree data structure is upside
    down, having a root at the top and leaves at the bottom. Also, there is no parent
    of the root node. A root node can only have child nodes. On the'
