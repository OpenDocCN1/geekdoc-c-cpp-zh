    # 4. Bubble Sort


    Bubble sort, also known as exchange sort, is a very simple sorting method. It
    works by repeatedly moving the largest element to the highest position of the
    array. In bubble sort, we are comparing two elements at a time, and swapping is
    done if they are wrongly placed. If the element at a lower index or position is
    greater than the element at a higher index, then in case both the elements are
    interchanged so that the smaller is placed before the larger one. This process
    is repeated until the list becomes sorted. Bubble sort gets its name from the
    way that the smaller elements "bubble" to the top of the array. This sorting technique
    uses only comparisons to operate on the elements. Hence, we can also call it a
    comparison sort.


    # Bubble Sort Technique


    The basic idea applied for a bubble sort is to let us an array ARR contains n
    elements, the number of iterations to sort the array will be (n – 1).


    +   **Pass 1** – During the first iteration, the largest value in the array is
    placed at the last position.


    +   **Pass 2** – During the second iteration, the second largest value of the
    array is placed in the second last position.


    +   **Pass 3** – During the third iteration, the third largest value of the array
    is placed in the third last position and so on.'
