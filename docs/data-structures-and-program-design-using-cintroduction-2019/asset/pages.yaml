    A file is classified into two types, which are:


    +   1. Text Files – A text file, often called a flat file, is a file that stores
    all the numeric or non-numeric data using its corresponding ASCII values. The
    data can be a string of letters, numbers, or special symbols. There, it is also
    known as an ASCII file. Usually, a text file has a special marker known as the
    end of file marker which denotes the end of the file.


    +   2. Binary Files – A binary file is a file that contains all the data in the
    binary form of 1s and 0s. It stores the data in the same form as that of primary
    memory. Thus, a binary file is not readable by human beings. Binary files are
    read by computer programs, and they decode the binary files into something meaningful.
    Data is efficiently stored in binary files.


