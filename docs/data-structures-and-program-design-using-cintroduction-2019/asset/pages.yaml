    # 7.6.6 Parenthesis Balancing


    Stacks can be used to check the validity of parentheses in any arithmetic or algebraic
    expression. We are already aware that in a valid expression, the parentheses or
    the brackets occur in pairs, that, if a parenthesis is opening it must be closed
    in an expression. Otherwise, the expression would be invalid. For example, (X
    + Y - Z) is invalid. But (X + Y - Z) looks a valid expression. Here, there are
    some key points which to be kept in mind:


    +   - Each time a "(" parenthesis is encountered, it should be pushed onto the
    stack.

    - Each time a ")” parenthesis is encountered, the stack is examined.

    - If the stack is an empty stack, then the ”” parenthesis does not have a “( parenthesis,
    and hence the expression is therefore invalid.

    - If the stack is not empty, then we will pop the stack and check whether the
    popped element corresponds to the ”” parenthesis.

    - When we reach the end of the stack, the stack must be empty. Otherwise, one
    or more ““( parenthesis, does not have a corresponding ”” parenthesis and, therefore,
    the expression will become invalid.


    **For Example** – Check whether the following expressions are valid or not.


    +   **a)** ((A - B) * Y

    **b)** [(A + B) - {X + Y} * [C - D]]'
