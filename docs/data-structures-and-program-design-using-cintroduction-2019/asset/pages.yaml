  md: '# CHAPTER

    1


    # INTRODUCTION TO DATA

    STRUCTURES


    In This Chapter


    +   * Introduction

    * Types of data structures

    * Operations on data structures

    * Algorithms

    * Approaches for designing an algorithm

    * Analyzing an algorithm

    * Abstract data types

    * Big O notation

    * Summary


    # 1.1 Introduction


    A data structure is an efficient way of storing and organizing the data elements
    in the computer memory. Data means a value or a collection of values. Structure
    refers to a method of organizing the data. The mathematical or logical representation
    of data in the memory is referred as a data structure. The objective of a data
    structure is to store, retrieve, and update the data efficiently. A data structure
    can be referred to as'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 2 DATA STRUCTURES AND PROGRAM DESIGN USING C++


    elements grouped under one name. The data elements are called members, and they
    can be of different types. Data structures are used in almost every program and
    software system. There are various kinds of data structures that are suited for
    different types of applications. Data structures are the building blocks of a
    program. For a program to run efficiently, a programmer must choose appropriate
    data structures. A data structure is a crucial part of data management. As the
    name suggests, data management is a task which includes different activities like
    collection of data, organization of data into structures, and much more. Some
    examples where data structures are used are stacks, queues, arrays, binary trees,
    linked lists, hash tables, and so forth.


    A data structure helps us to understand the relationship of one element to another
    element and organize it within the memory. It is a mathematical or logical representation
    or organization of data in memory. Data structures are extensively applied in
    the following areas:


    +   * Compiler Design

    * Database Management Systems (DBMS)

    * Artificial Intelligence

    * Network and Numerical Analysis

    * Statistical Analysis Packages

    * Graphics

    * Operating Systems (OS)

    * Simulations


    As we see in the previous list, there are many applications in which different
    data structures are used for their operations. Some data structures sacrifice
    speed for efficient utilization of memory, while others sacrifice memory utilization
    for faster speed. In today''s world programmers aim not just to build a program,
    but instead to build an effective program. As previously discussed, for a program
    to be efficient, a programmer must choose appropriate data structures. Data structures
    are classified into various types. Now, let us discuss and learn about different
    types of data structures.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Frequently Asked Questions


    Q1. Define the term data structure.


    Answer.

    A data structure is an organization of data in a computer''s memory or disk storage.
    In other words, a logical or mathematical model of a particular organization of
    data is called a data structure. A data structure in computer science also allows
    a way of storing data in a computer so that it can be used efficiently. An appropriate
    data structure allows a variety of important operations to be performed using
    both resources, that is, memory space and execution time, efficiently.


    # 1.2 Types of Data Structures


    Data structures are classified into various types.


    # 1.2.1 Linear and Non-Linear Data Structures


    A linear data structure is one in which the data elements are stored in a linear;
    or, sequential; order; that is, data is stored in consecutive memory locations.
    A linear data structure can be represented in two ways; either it is represented
    by a linear relationship between various elements using consecutive memory locations
    as in the case of arrays, or it may be represented by a linear relationship between
    the elements linking from one element to another as in the case of linked lists.
    Examples of linear data structures include arrays, lists, stacks, queues, and
    so on.


    A non-linear data structure is one in which the data is not stored in any sequential
    order or consecutive memory locations. The data elements in this structure are
    represented by a hierarchical order. Examples of non-linear data structures include
    graphs, trees, and so forth.


    # 1.2.2 Static and Dynamic Data Structures


    A static data structure is a collection of data in memory which is fixed in size
    and cannot be changed during runtime. The memory size must be'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 4 DATA STRUCTURES AND PROGRAM DESIGN USING C++


    known in advance, as the memory cannot be reallocated later in a program. One
    example is an array.


    A dynamic data structure is a collection of data in which memory can be reallocated
    during execution of a program. The programmer can add or remove elements according
    to his/her need. Examples include linked lists, graphs, trees, and so on.


    # 1.2.3 Homogeneous and Non-Homogeneous Data Structures


    A homogeneous data structure is one that contains data elements of the same type,
    for example, arrays.


    A non-homogeneous data structure contains data elements of different types, for
    example, structures.


    # 1.2.4 Primitive and Non-Primitive Data Structures


    Primitive data structures are the fundamental data structures or pre-defined data
    structures which are supported by a programming language. Examples of primitive
    data structure types are integer, long, float, double, char, pointers, and so
    forth.


    Non-primitive data structures are comparatively more complicated data structures
    that are created using primitive data structures. Examples of non-primitive data
    structures are arrays, files, linked lists, stacks, queues, and so on.


    Classification of different data structures is shown in Figure 1.1.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_21_0.png)


    FIGURE 1.1 Classification of different data structures.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'We know that C++ supports various various data structures. So, we will now
    introduce all these data structures, and they will be discussed in detail in the
    upcoming chapters


    # Frequently Asked Questions


    **Q2. Write the difference between primitive data structures and non-primitive
    data structures.**


    **Answer.**

    Primitive data structures – The data structures that are typically directly operated
    upon machine-level instructions, that is, the fundamental data types as int, float,
    char, and so on, are known as primitive data structures.


    Non-primitive data structures – The data structures which are not fundamental
    are called non-primitive data structures.


    # Frequently Asked Questions


    **Q3. Explain the difference between linear and non-linear data structures.**


    **Answer.**

    The main difference between linear and non-linear data structures lies in the
    way in which elements are organized. In the linear data structure, elements are
    organized sequentially, and therefore they are easy to implement in a computer’s
    memory. In non-linear data structures, a data element can be attached to several
    other data elements to represent specific relationships among them.


    # 1.2.5 Arrays


    An array is a collection of homogeneous (similar) types of data elements in contiguous
    memory. An array is a linear data structure because all'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 6 * Data Structures and Program Design Using C++


    elements of an array are stored in linear order. The various elements of the array
    are referenced by their index value, also known as the subscript. In C++, array
    is declared using the following syntax:


    Syntax - <Data type> array name [size];


    The elements are stored in the array as shown in Figure 1.2.


    | 1st element | 2nd element | 3rd element | 4th element | 5th element | 6th element
    |

    | array [0] | array [1] | array [2] | array [3] | array [4] | array [5] |


    FIGURE 1.2 Memory representation of an array.


    Arrays are used for storing a large amount of data of similar type. They have
    various advantages and limitations.


    # Advantages of using arrays


    +   1. Elements are stored in adjacent memory locations; hence, searching is very
    fast, any element can be easily accessed.


    +   2. Arrays do not support dynamic memory allocation, so all the memory management
    is done by the compiler.


    # Limitations of using arrays


    +   1. Insertion and deletion of elements in arrays is complicated and very time-consuming,
    as it requires the shifting of elements.


    +   2. Arrays are static; hence, the size must be known in advance.


    +   3. Elements in the array are stored in consecutive memory locations which
    may or not be available.


    # 1.2.6 Queues


    A queue is a linear collection of data elements in which the element inserted
    first will be the element that is taken out first that, a queue is a FIFO (In
    First Out) data structure. A queue is a popular linear data structure in which
    the first element is inserted from one end called REAR end (also called the tail
    end), and the deletion of the element takes place from the other end called the
    FRONT end (also called the head).'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Practical Application:


    For a simple illustration of a queue, there is a line of people standing at the
    bus stop and waiting for the bus. Therefore, the first person standing in the
    line will get into the bus first.


    In a computer''s memory queues can be implemented using arrays or linked lists.
    Figure 1.3 shows the array implementation of a queue. Every queue has FRONT and
    REAR variables which point to the positions where deletion and insertion are done
    respectively.


    | 1st element | 2nd element | 3rd element | 4th element | 5th element | 6th element
    |

    | --- | --- | --- | --- | --- | --- |

    | FRONT | | | | | REAR |


    FIGURE 1.3 Memory representation of the queue.


    # 1.2.7 Stacks


    A stack is a linear collection of data elements in which insertion and deletion
    take place only at the top of the stack. A stack is a Last In First Out (LIFO)
    data structure, because the last element pushed onto the stack will be the first
    element deleted from the stack. Three operations can be performed on the stack,
    which include PUSH, POP, and PEEP operations.

