  md: '# 7.6.4 Evaluation of a Postfix Expression


    With the help of stacks, any postfix expression can easily be evaluated. Every
    character in the postfix expression is scanned from left to right. The steps involved
    in evaluating a postfix expression are given in the algorithm.


    # Algorithm for evaluating a postfix expression


    | Step | Description |

    | --- | --- |

    | Step 1 | START IF an operand is encountered, push it onto the stack. |

    | Step 2 | IF an operator “opl” is encountered, then follow these steps |

    | Step 3 | a) Pop the two topmost elements from the stack, where X is the topmost
    element and Y is the next element below X.

    b) Evaluate X opl Y.

    c) Push the result onto the stack. |

    | Step 4 | Set the result equal to the topmost element of the stack. |

    | Step 5 | EXIT |


    For Example – Evaluate the following postfix expressions.


    +   a) 2 3 4 + * 5 6 7 8 + * * +

    b) T F F T F F D F F X XOR OR AND T XOR OR AND


    Solution:


    +   a)


    | Character | Stack | Operation |

    | --- | --- | --- |

    | 2 | 2 | PUSH 2 |

    | 3 | 2, 3 | PUSH 3 |

    | 4 | 2, 3, 4 | PUSH 4 |

    | + | 2, 7 | POP 4, 3 ADD(4+3 = 7) PUSH 7 |

    | * | 14 | POP 7, 2 MUL(7*2 = 14) PUSH 14 |

    | 5 | 14, 5 | PUSH 5 |

    | 6 | 14, 5, 6 | PUSH 6 |

    | 7 | 14, 5, 6, 7 | PUSH 7 |

    | 8 | 14, 5, 6, 7, 8 | PUSH 8 |'
