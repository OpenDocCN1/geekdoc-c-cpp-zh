  md: '# 5.5.3 De-queues (Double-Ended Queues)


    A double-ended queue (de-queue, pronounced “deck”) is a special type of data structure
    in which insertion and deletion of elements is done at either end, that is, either
    at the front end or at the rear end of the queue. It is often called a head-tail
    linked list because elements are added or removed from either head (front) or
    tail (end). De-queues are implemented using circular arrays in the computer’s
    memory. The LEFT and RIGHT pointers are maintained in the de-queue, which point
    to either end of the queue.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_263_0.png)


    FIGURE 5.21 A double-ended queue.


    | Practical Application: |

    A real life example of a de-queue is that in a train station, the entry and exit
    of passengers can take place from both sides. |


    There are two types of double-ended queues, which include:


    +   1. Input Restricted De-Queue – In this, the deletion operation can be performed
    at both ends (i.e., both front and rear end) while the insertion operation can
    be performed only at one end (i.e., rear end).


    ![](img/5e3627f19c26cb38acf457f2722a0abd_263_1.png)


