  md: 'The two basic categories of sorting methods:


    +   1. Internal Sorting – It refers to the sorting of the data elements stored
    in the computer''s main memory.


    +   2. External Sorting – It refers to the sorting of the data elements stored
    in the files. It is applied when the amount of data is large and cannot be stored
    in the main memory.


    # 6.5.1 Types of Sorting Methods


    The various sorting methods are:


    +   1. Selection Sort


    +   2. Insertion Sort


    +   3. Merge Sort


    +   4. Bubble Sort


    +   5. Quick Sort


    Let us discuss all of them in detail.


    # 1. Selection Sort


    Selection sort is a sorting technique that works by finding the smallest value
    in the array and placing it in the first position. After that, it finds the second
    smallest value and places it in the second position. This process is repeated
    until the whole array is sorted. Thus, the selection sort works by finding the
    smallest unsorted element remaining in the entire array and then swapping it with
    the element in the next position to be filled. It is a very simple technique,
    and it is also easier to implement than other sorting techniques. Selection sort
    is used for sorting files with large records.


    # Selection Sort Technique


    Let us use an array ARR with N elements in it. Now, the selection sort technique
    works as follows:


    First of all, we will find the smallest value in the entire array, and we will
    place that value in the first position of the array. Then, we will find the second
    smallest value in the array, and we will place it in the second position of the
    array. Now, we will repeat this process until the whole array is sorted.'
