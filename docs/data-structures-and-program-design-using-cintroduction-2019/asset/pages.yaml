    # 1.4 Algorithms


    An algorithm is a systematic set of instructions combined to solve a complex problem.
    It is a step-by-finite-step sequence of instructions, each of which has a clear
    meaning and can be executed in a minimum amount of effort in finite time. In general,
    an algorithm is a blueprint for writing a program to solve the problem. Once we
    have a blueprint of the solution, we can easily implement it in any high-level
    language like C, C++, and so forth. An algorithm written in a programming language
    is known as a program. A computer is a machine with no brain or intelligence.
    Therefore, the computer must be instructed to perform a given task in unambiguous
    steps. Hence, a programmer must define his problem in the form of an algorithm
    written in English. Thus, such an algorithm should have following features:


    +   1. An algorithm should be simple and concise.


    +   2. It should be efficient and effective.


    +   3. It should be free of ambiguity; that is, the logic must be clear.


    Similarly, an algorithm must have following characteristics:


    +   - Input – It reads the data of the given problem.


    +   - Output – The desired result must be produced.


    +   - Process/Definiteness – Each step or instruction must be unambiguous.


    +   - Effectiveness – Each step should be accurate and concise. The desired result
    should be produced within a finite time.


    +   - Finiteness – The number of steps should be finite.'
