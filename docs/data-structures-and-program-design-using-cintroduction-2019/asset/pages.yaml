    Arithmetic operators are those operators which are used in mathematical computation
    or calculation. The valid arithmetic operators in C++ are given in the following
    table.


    Let x and y be the two variables.


    | Operator | Operation | Example |

    |---|---|---|

    | + | Addition | x + y |

    | - | Subtraction | x - y |

    | * | Multiplication | x * |

    | % | Remainder/ Modulus | x % y |

    / | Division | x / y |'
