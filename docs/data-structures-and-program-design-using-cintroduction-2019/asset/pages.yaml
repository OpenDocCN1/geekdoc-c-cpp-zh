  md: '# PREFACE


    Data structures are the building blocks of computer science. The objective of
    this text is to emphasize the fundamentals of data structures as an introductory
    subject. It is designed for beginners who would like to learn the basics of data
    structures and their implementation using the C++ programming language. With this
    focus in mind, we present various fundamentals of the subject, well supported
    with real-world analogies to enable a quick understanding of the technical concepts
    and to help in identifying appropriate data structures to solve specific practical
    problems. This book will serve the purpose of a text/reference book and will be
    of immense help especially to undergraduate or graduate students of various courses
    in information technology, engineering, computer applications, and information
    sciences.


    Key Features:


    +   - Practical Applications: Real world analogies as practical applications are
    given throughout the text to quickly understand and connect the fundamentals of
    data structures from day to day, real-world scenarios. In turn, will assist the
    reader in developing the capability to identify the most appropriate and efficient
    data structure for solving a specific, real-world problem.


    +   - Frequently Asked Questions: Frequently asked theoretical/practical questions
    are integrated throughout the content of the book, with related topics to assist
    readers in grasping the subject.


    +   - Algorithms and Programs: To better understand the fundamentals of data structures
    at a generic level-followed by its object-oriented implementation'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'in C++, syntax independent algorithms, as well as implemented programs in C++,
    are discussed throughout the book. This presentation will assist the reader in
    getting both algorithms and their corresponding implementation within a single
    book.


    +   - Numerical and Conceptual Exercises: To assist the reader in developing a
    strong foundation of the subject, various numerical and conceptual problems are
    included throughout the text.


    +   - Multiple Choice Questions: To assist students for placement-oriented exams
    in various IT fields, several exercises are suitably chosen and are given in an
    MCQ format.


    Dheeraj Malhotra

    Neha Malhotra

    November 2018'
