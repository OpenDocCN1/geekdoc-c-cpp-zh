  md: '# 1.6.1 Time-Space Trade-Off


    In computer science, time-space trade-off is a way of solving a particular problem
    either in less time and more memory space or in more time and less memory space.
    But if we talk in practical terms, designing such an algorithm in which we can
    save both space and time is a challenging task. So, we can use more than one algorithm
    to solve a problem. We may require less time, and the other may require less memory
    space to execute. Therefore, we sacrifice one for the other. Hence, there exists
    a time-space or time-memory trade-off between algorithms. Thus, this time-space
    trade-off gives the programmer rational choice from an informed point of view.
    So, if space is a big concern for a programmer, then he or she might choose a
    program which takes less or the minimum time to execute. On the other hand, if
    space is a prime concern for a programmer, then, in that case, he or she might
    choose a program that takes less memory space to execute at the cost of more time.


    # 1.7 Abstract Data Types


