    # 8.4.3 Creating a Binary Tree Using Traversal Methods


    A binary tree can be constructed if we are given at least two of the traversal
    results, provided that one traversal should always be an in-order traversal and
    the second is either a pre-order traversal or a post-order traversal. An in-order
    traversal determines the left and right child nodes of the binary tree. A Pre-order
    or post-order traversal determines the root node of the binary tree. Here, there
    are two different ways of creating a binary tree, which are:


    +   1. In-order and pre-order traversal

    2. In-order and post-order traversal


    Now, we have pre-order and in-order traversal sequences. Then, the following steps
    are followed to construct a binary tree:


    +   Step 1: The pre-order traversing sequence is used to determine the root node
    of the binary tree. The first node in the pre-order sequence will be the root
    node.


    +   Step 2: The in-order traversing sequence is used to determine the left and
    right subtrees of the binary tree. Keys toward the left side of the root node
    in the in-order sequence form the left subtree. Similarly, keys toward the right
    side of the root node in the in-order sequence form the right subtree.'
