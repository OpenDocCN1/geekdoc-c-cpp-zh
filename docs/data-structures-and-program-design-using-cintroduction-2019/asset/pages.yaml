    File handling is an important process, and one must be aware about the file handling
    process irrespective of any languages. But especially when it comes to C and C++
    file handling, it becomes a little bit tough to understand the operations and
    processes on files as both languages possess similar kinds of functions/operators.
    Hence, there are some main points to remember while working with files, which
    are discussed as follows:


    | C | C++ |

