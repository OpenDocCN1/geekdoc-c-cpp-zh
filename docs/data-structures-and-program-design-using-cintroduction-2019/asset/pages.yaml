    # 12.1 Introduction


    So far, we have studied various types of linear data structures which are widely
    used in various applications. But the only non-linear data structure which we
    have studied so far is trees. In trees, we discussed the parent-child relationship
    in which one parent can have many children. But in graphs, this parent-child relationship
    is less restricted, that is, any complex relationship can exist. Thus, a tree
    can be generalized as a special type of graph. Therefore, a graph is a non-linear
    data structure which has a wide range of real-life applications. *A graph is a
    collection of some vertices (nodes) and edges that connect these vertices.* Figure
    12.1 represents a graph.'
