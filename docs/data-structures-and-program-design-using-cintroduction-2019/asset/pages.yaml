    # 8.5 AVL Trees


    The AVL tree was invented by Adelson-Velski and Landis in 1962. The AVL tree is
    so named in honor of its inventors. The AVL tree was the first balanced binary
    search tree. It is a self-balancing binary search tree. The AVL tree is also known
    as a height-balanced binary tree because of its property that the heights of the
    two subtrees of a node can differ at most by one. AVL trees are very efficient
    in performing searching, insertion, and deletion operations, as they take O(log
    n) time to perform all these operations.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '392 • DATA STRUCTURES AND PROGRAM DESIGN USING C++


    # 8.5.1 Need of Height-Balanced Trees


    AVL trees are very similar to binary search trees but with a small difference.
    AVL trees have a special variable known as a balance factor associated with them.
    Every node in the AVL tree has a balance factor associated with it. The balance
    factor is determined by subtracting the height of the right subtree from the height
    of the left subtree. Thus, a node with a balance factor of -1, 0, or 1 is said
    to be a height-balanced tree. The primary need for the height-balanced tree is
    that the process of searching becomes very fast. This balancing condition also
    ensures that the depth of the tree is calculated as O(logn).


    Balance Factor = Height(Left sub-tree) − Height(Right sub-tree)


    +   - If the balance factor of the tree is -1, then it means that the height of
    the right subtree of that node is one than the height of the left subtree of that
    node.

    - If the balance factor of the tree is 0, then it means that the height of the
    left and right subtrees of a node are equal.

    - If the balance factor of the tree is 1, then it means that the height of the
    left subtree of that node is one more than the height of its right subtree.


    Thus, the overall benefit of the height-balanced tree is to assist in fast searching.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_409_0.png)


    FIGURE 8.21. Balanced AVL tree.'
