  md: '264 • DATA STRUCTURES AND PROGRAM DESIGN USING C++


    +   a) If the middle element is the desired element, then the search is successful.


    +   b) If the data element to be searched for is less than the middle element
    of the array, then search only the lower half of the array, that is, those elements
    which are on the left side of the middle element.


    +   c) If the data element to be searched for is greater than the middle element
    of the array, then search only the upper half of the array, that is, those elements
    which are on the right side of the middle element.


    Repeat these steps until a match is found.


    # Practical Application:


    A real-life application of a binary search is that when we search for a particular
    word in a dictionary, we first open the dictionary somewhere in the middle. Now
    we will compare the desired word with the first word on that open page, then we
    will look in the second half of the dictionary; otherwise, we will look in the
    first half. Now, we will again open a page in the second half and compare the
    desired word with the first word on that page, and the same process is repeated
    until we found the desired word.


    # Algorithm for a Binary Search


    | Binary_Search(ARR, Lower_bound, Upper_bound, VAL)

