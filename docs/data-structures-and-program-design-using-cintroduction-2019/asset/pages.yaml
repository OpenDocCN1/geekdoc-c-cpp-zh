    # 5.5.2 Priority Queue


    A priority queue is another variant of a queue in which elements are processed
    on the basis of assigned priority. Each element in a priority queue is assigned
    a special value called the priority of the element. The elements in the priority
    queue are processed based on the following rules:'
  merge: -1
  pgno: 254
- img_proc: true
  md: '+   1. An element with higher priority is processed first, then the element
    with lower priority is processed.


    +   2. If the two elements have the same priority, then the elements are processed
    by the First Come Served basis. The priority of the element is selected by its
    value the implicit priority, and the priority number given with each element is
    called the explicit priority.


    A priority queue is like a modified queue or stack data structure, but where additionally
    each element has a "priority" associated with it. In a priority queue, insertion
    and deletion operations are also done according to the assigned priority. If we
    want to delete an element from the priority queue, then the element with the highest
    priority is processed first and is deleted. The case is the same with insertion.
    The priority given to the elements in the queue is based on several factors. Priority
    queues are commonly used in operating systems for executing higher priority processes
    first. The priority assigned to these processes may be based on the time taken
    by the CPU to execute these processes completely.


    # Practical Application:


    > In an operating system, if there are four processes to be executed where the
    first process needs 3 ns to complete, the second process needs 5 ns to complete,
    the third process needs 9 ns to complete, and the fourth needs 8 ns to complete,
    then the first process will be given the highest priority and will be the first
    to be executed among all the processes.


    The priority queues are further divided into two types which are:


    +   1. Ascending Priority Queue – In this type of priority queue, elements can
    be inserted in any order, but at the time of deletion of elements from the queue,
    the smallest element is searched and deleted first.


    +   2. Descending Priority Queue – In this type of priority queue, elements can
    be inserted in any order. But at the time of deletion of elements from the queue,
    the largest element is searched and deleted first. For example – Operating systems,
    Routing.'
