  md: '# Frequently Asked Questions


    Q1. What is the difference between the base and derived class?


    **Answer.**


    When creating a class, instead of writing completely new data members and member
    functions, the programmer can designate that the new class should inherit the
    members of an existing class. This existing class is known as a base class, and
    the new class is known as a derived class. A class can be derived from more than
    one class, which means it can inherit data and functions from multiple base classes.


    +   **Encapsulation** – Encapsulation is a process of wrapping up data members
    and member functions into a single unit. It is the mechanism which keeps the code
    and the data safe from external interference. It implies that there is no direct
    access granted to the data; that is, it is hidden. So, in order to access that
    data, we must interact with the object that is responsible for the data. This
    is also known as data hiding. The process of encapsulation makes the data of the
    system more secure and reliable.


    # Practical Application:


    The most common example of encapsulation is a capsule. In a capsule, all the medicines
    are encapsulated inside a single capsule.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_45_0.png)'
