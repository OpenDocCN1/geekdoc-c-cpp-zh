  md: 'Polymorphism – The word polymorphism is derived from the word poly, which means
    many, and the word morph, which means forms. Therefore, anything that exists in
    more than one form is referred to as a polymorphism. Thus, polymorphism means
    the ability to make more one form. Polymorphism usually occurs when there is a
    hierarchy of classes and the classes are related by inheritance. Polymorphism
    is considered one of the most important features of object-oriented programming.
    Polymorphism is of two types:


    +   1. Compile Time Polymorphism (Static Polymorphism) – It is done using function
    overloading and operator overloading,


    +   2. Runtime Polymorphism (Dynamic Polymorphism) – It is done using method overriding
    or virtual functions.


