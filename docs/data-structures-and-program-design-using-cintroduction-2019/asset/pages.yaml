    Space Complexity – The space complexity of an algorithm is the amount of memory
    space required to run the program completely. The space complexity of an algorithm
    depends upon the input size.


    Time Complexity is categorized into three types:


    +   1. Best Case Running Time – The performance of the algorithm will be best
    under optimal conditions. For example, the best case for a binary search occurs
    when the desired element is the middle element of the list. Another example can
    be sorting: that, if the elements are already sorted in a list, then the algorithm
    will execute in best time.


    +   2. Average Case Running Time – It denotes the behavior of an algorithm when
    the input is randomly drawn from a collection or distribution. It is an estimate
    of the running time for “average” input. It is usually assumed that all inputs
    of a given size are likely to occur with equal probability.


    +   3. Worst Case Running Time – The behavior of the algorithm in this case concerns
    the worst possible case of input instance. The worst case running time of an algorithm
    is an upper bound on the running time for any input. For example, the worst case
    for a linear search occurs when the desired element is the last element in the
    list or the element does not exist in the list.


