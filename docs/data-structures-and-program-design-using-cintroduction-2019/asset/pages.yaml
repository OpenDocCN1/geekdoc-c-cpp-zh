  md: '# 7.7 Summary


    +   * A stack is a linear collection of data elements in which the element inserted
    last will be the element taken out first (i.e., a stack is the LIFO data structure).
    The stack is a linear data structure, in which the insertion as well as the deletion
    of an element is done only from the end called TOP.

    * In computer memory, stacks can be implemented by using either arrays or linked
    lists.

    * The overflow condition occurs when we try to insert elements in the stack, but
    the stack is already full.

    * The underflow condition occurs when we try to remove the elements from the stack,
    but the stack is already empty.

    * The three basic operations that can be performed on the stacks are push, pop,
    and peek operations.

    * A push operation is the process of adding new elements to the stack.

    * A pop operation is the process of removing elements from the stack.

    * A peek operation is the process of returning the value of the topmost element
    of the stack.

    * Polish notation refers to a notation in which the operator is placed before
    the operands.

    * Infix, prefix, and postfix notations are three different but equivalent notations
    of writing algebraic expressions.


