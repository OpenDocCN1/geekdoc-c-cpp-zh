    that define a data type along with various functions that operate on these objects.
    To understand the meaning of an abstract data type, we will simply break the term
    into two parts, that is, "data type" and "abstract." The data type of a variable
    is a collection of values which a variable can take. There are various data types
    in C++ that include integer, float, character, long, double, and so on. When we
    talk about the term "abstract" in the context of data structures, it means apart
    from detailed specification. It can be considered a description of the data in
    a structure with a list of operations to be executed on the data within the structure.
    Thus, an abstract data type is the specification of the data type that specifies
    the mathematical and logical model of the data type. For example, when we use
    stacks and queues, then at that point of time our prime concern is only with the
