  md: 'GRAPHS • 513


    +   - An adjacency matrix is usually used to represent the information of the
    nodes which are adjacent to one another. The adjacency matrix is also known as
    a bit matrix or Boolean matrix since it contains 0s and 1s.


    +   - In adjacency list representation, every node is linked to its list of all
    the other nodes which are adjacent to it.


    +   - Traversing in a graph is the process of visiting each node and edge in some
    systematic approach.


    +   - Breadth search is a traversal technique that uses the queue as an auxiliary
    data structure for traversing all member nodes of the graph. In this technique,
    first we select any node in the graph as a starting node, and then we will take
    all the nodes adjacent to the starting node. We will maintain the same approach
    for all the other nodes.


    +   - Depth first search is another traversal technique that uses the stack as
    an auxiliary data structure for traversing all member nodes of the graph. In this,
    first we will select any node in the graph as a starting node, and then we will
    travel along a path which begins from the starting node, and again we visit the
    adjacent node of the previous node, and so on.


    +   - Topological sort is a procedure to determine linear ordering of the nodes
    of an acyclic directed graph known as (DAG) in which each node comes before all
    the nodes which have zero predecessors.


    +   - A minimum spanning tree (MST) is defined as a spanning tree that has weights/costs
    associated with the edges such that the total weight/cost of the spanning tree
    is at minimum.


