    # 12.6 Minimum Spanning Tree


    A spanning tree of an undirected and connected graph G is a sub- which contains
    all the vertices and edges that connect these vertices and is a tree. The weights/costs
    can be assigned to the edges, and these weights/costs can be used to calculate
    the weight/cost of the spanning tree by calculating the sum of the weights/costs
    of each edge. A graph can have many spanning trees. Thus, a minimum spanning tree
    (MST) is defined as a spanning tree that has weights/costs associated with the
    edges such that the total weights/costs of the spanning tree is at a minimum.
    Although there are various approaches for determining an MST, the two most popular
    approaches for determining a minimum cost spanning tree of graph are:


    +   * Prim''s Algorithm


    +   * Kruskal''s Algorithm


    Now, let us discuss both of them in detail.'
