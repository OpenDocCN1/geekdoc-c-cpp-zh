    # 11.2 Terminologies


    +   **Data Field** – A data field is a unit which stores a unary fact. It is usually
    characterized by its type and size. For example, “employee’s name” is a data field
    that stores the names of employees.

    **Record** – The collection of related data fields is called a record. For example,
    an employee’s record may contain various data fields such as id, address, contact
    number, and so on.

    **File** – The collection of related records is called a file. An example is a
    file of the employees working in an organization.

    **Directory** – The collection of related files is called a directory. Every file
    in a computer system is stored in a directory.

    **File Name** – The name of a file is a string of characters.

    **Read-only** – A file named read-only cannot be modified or deleted. If we try
    to delete the file, then a particular message is displayed.

    **Hidden** – A file marked as hidden is not displayed in the directory.


