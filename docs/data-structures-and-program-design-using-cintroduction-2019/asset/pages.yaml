    # 7.3 Overflow and Underflow in Stacks


    Let us discuss both overflow and underflow in stacks in detail:


    +   1. Overflow in stacks – The overflow condition occurs when we try to

    insert elements in a stack, but the stack is already full. If an attempt

    is made to insert a value in a stack that is already full, an overflow

    message is printed. It can be checked by the following formula:


    > If TOP = MAX – 1, where MAX is the size of the stack.


    +   2. Underflow in stacks – The underflow condition occurs when we try to

    remove elements from a stack, but the stack is already empty. If an

    attempt is made to delete a value from a stack that is already empty.

    underflow message is printed. It can be checked by the following

    formula:


    > If TOP = NULL, where MAX is the size of the stack.'
