    hiding data that is not essential. Abstraction refers to the act of displaying
    only the essential features and hiding the background details and explanations
    that are not needed for the presentation. This is also known as data abstraction.
    Abstraction is one of the vital features provided by the object-oriented C++ programming
    language. Since the classes use the concept of data abstraction, they are known
    as Abstract Data Types (ADT). An abstract data type is a popular mathematical
    model of the data objects which define a data type along various functions that
