    rotation process is performed in AVL trees.


    # AVL Rotations


    Rotation is done when the balance factor of the node becomes disturbed after inserting
    a new node. We know that the new node is inserted will always have a balance factor
    of 0, as it will be a leaf node. Hence, the nodes whose balance factors will be
    disturbed the ones which lie in the path of the root node to the newly inserted
    node. So, we will perform the rotation process only on those whose balance factors
    will be disturbed. In the rotation process, our first work is to find the critical
    node in the AVL tree. The critical node is the nearest ancestor node from the
    newly inserted node to the root node which does not have a balance factor of -1,
    0, or 1. First, let us understand the concept of the critical node with the help
    of an example.'
