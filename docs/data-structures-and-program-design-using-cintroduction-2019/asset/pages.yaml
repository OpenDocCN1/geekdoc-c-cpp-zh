    # 10.1.4 Collision


    A collision is a situation which occurs when a hash function maps two keys to
    a single/same location in the hash table. Suppose we want to store a record at
    one location. Now, another record cannot be stored at the same location as it
    is obvious that two records cannot be stored at the same location. Thus, there
    are methods to solve this problem, which are called collision resolution techniques.


    # 10.1.5 Collision Resolution Techniques


    As already discussed, collision resolution techniques are used to overcome the
    problem of collision in hashing. There are two popular methods which are used
    for resolving collisions:


    +   1. Collision Resolution by Chaining Method


    +   2. Collision Resolution by Open Addressing Method


    Now, we will discuss these methods in detail.


    # 10.1.5.1 Chaining Method


    In the chaining method, a chain of elements is maintained which have the same
    hash address. The hash table here behaves like an array of pointers. Each location
    in the hash table stores a pointer to the linked list, which contains all the
    key ele-'
