    # 7.2 Definition of a Stack


    A stack is a linear connection of data elements in which the element inserted
    last will be the element taken out first (i.e., a stack is a LIFO data structure).
    The stack is an abstract data structure, somewhat similar to queues. Unlike queues,
    a stack is open only on one end. The stack is a linear data structure in which
    the insertion and deletion of elements is done only from the end called TOP. One
    end is always closed, and the other end is used to insert and remove data.


    Stacks can be implemented by using arrays or linked lists. We will discuss the
    implementation of stacks using arrays and linked lists in this section.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_323_1.png)


