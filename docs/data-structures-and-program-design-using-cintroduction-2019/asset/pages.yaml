  md: '# 11.8 Indexed Sequence File Organization


    An indexed sequential file organization is an efficient way of organizing the
    records when there is a need to access sequentially by some key values and also
    to access the records individually by the same key value. It provides the combination
    of access types that are supported by a sequential file or a relative file. The
    index has structured as a binary search tree. This index is used to serve as a
    request for access to a particular record, and the sequential data file alone
    is to support sequential access to the entire collection of records. Because of
    its capability to support both sequential and direct access, indexed sequence
    file organization is used to support applications that require both batch and
    interactive processing.


    Advantages of Indexed Sequence File Organization


    +   1. Records can be accessed sequentially and randomly.

    2. It supports batch as well as interactive oriented applications.

    3. It supports the update operation in between records in the file.


    Disadvantages of Indexed Sequence File Organization


    +   1. In this organization, files can only be stored on magnetic disks.

    2. It involves extra overhead in the form of maintenance.


    +   3. Records can be only of a fixed length, as we maintain the structure of
    each node like a linked list.


    | Position | Sequence Data File |

    |---|---|

    | 1 | key₁ |

    | 2 | key₂ |

    | 3 | key₃ |

    | 4 | key₄ |

    | | .. |

    | | .. |

    | n | keyₙ |


