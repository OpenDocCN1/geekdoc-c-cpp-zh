    # 6.5 Introduction to Sorting


    Sorting refers to the process of arranging the data elements of an array in a
    specified order, that is, either in ascending or descending order. For example,
    it will be practically impossible for us to find a name in the telephone directory
    if the name is not in alphabetical order. However, the same can be true for dictionaries,
    book indexes, bank accounts, and so on. Hence, the convenience of having sorted
    is unquestionable. Retrieval of information becomes much easier when the data
    is stored in some specified order. Therefore, sorting is a very important application
    in computer science.


    Let us take an array which is declared and initialized as:


    ```

    int array[] = (10, 25, 17, 8, 30, 3);

    ```


    Then, the array after applying the sorting technique:


    ```

    array[] = (3, 8, 10, 17, 25, 30);

    ```


    A sorting algorithm can be defined as an algorithm which puts the data elements
    of an array/ list in a certain order, that is, either numerical order or any predefined
    order. There are many sorting algorithms which are available and are widely used
    according to the different environments required by the different sorting methods.'
