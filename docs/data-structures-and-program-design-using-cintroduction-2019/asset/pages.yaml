- img_proc: true
  md: '# 12.6.1 Prim’s Algorithm


    Prim’s algorithm is the algorithm that is used to build a minimum cost spanning
    tree. This algorithm works in such a way that it builds a tree edge by edge. The
    next edge to be included is chosen according to some criterion. The steps involved
    in Prim’s algorithm are:


    +   Step 1: Select a starting vertex/node and add it to the spanning tree.


    +   Step 2: During each iteration, select a vertex/node in such a way that the
    edge connecting vertex V, to another vertex V has the minimum cost/weight assigned
    to it. Remember, the edge forming a cycle must not be added.


    +   Step 3: End the process when (n-1) number of edges have been inserted into
    the tree.


