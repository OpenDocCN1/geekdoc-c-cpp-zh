  md: '# 3.15 Sparse Matrices


    A sparse matrix is a matrix with a relatively high proportion of zero entries
    in it. A sparse matrix utilizes the memory space efficiently. Storing null elements
    in the matrix is a waste of memory, so we adopt a technique to store only not-null
    elements in the sparse matrices.


    For Example:


    ![](img/5e3627f19c26cb38acf457f2722a0abd_141_0.png)


    FIGURE 3.7. Representation of a sparse matrix.


    # 3.16 Types of Sparse Matrices


    There are three types of sparse matrices, which are:


    +   1. Lower-triangular matrix – In this type of sparse matrix, all the elements
    above the main diagonal must have a zero value, or in other words we can say that
    all the elements below the main diagonal should contain non-zero elements only.
    This type of matrix is called a lower-triangular matrix.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_141_1.png)


    FIGURE 3.8. Lower-triangular matrix.


    +   2. Upper-triangular matrix – In this type of sparse matrix, all the elements
    above the main diagonal should contain non-zero elements only, or in other words
    we can say that all the elements below the main diagonal should have a zero value.
    This type of matrix is called an upper-triangular matrix.'
