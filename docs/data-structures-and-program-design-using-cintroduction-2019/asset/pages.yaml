    # 9.4 Application of a B-Tree


    The main application of a B-tree is the organization of a large amount of data
    or a huge collection of records into a file structure. A B-tree should search
    the records very efficiently, and all the operations such as insertion, deletion,
    searching, and so on should be done very efficiently; therefore, the organization
    of records should be very good.


    # 9.5 B+ Trees


    B+ tree is a variant of a B-tree which also stores sorted data like a B-tree is
    the standard organization for indexes in database systems. Multilevel indexing
    is done in a B+ tree; that is, leaf nodes constitute a dense index, while non-leaf
    nodes constitute a sparse index.'
