  md: "# Merge Sort\n\nMerge sort is a sorting method which follows the divide and\
    \ conquer approach. The divide and conquer approach is a very good approach in\
    \ which divide means partitioning the array n elements into two sub-arrays of\
    \ n/2 elements. However, if there are no elements present in the list/or an array\
    \ contains only one element, it is already sorted. However, if an array has more\
    \ elements, then it is divided into two sub-arrays containing equal elements in\
    \ them. Conquer is the process of sorting the two sub-arrays recursively using\
    \ merge sort. Finally, the two sub-arrays are merged into one single sorted array.\n\
    \n# Merge Sort Technique\n\n+   1. If the array has zero or one element in it,\
    \ there is no need to sort that array as it is already sorted.\n\n+   2. Otherwise,\
    \ if there are more elements in the array, divide the array into two sub-arrays\
    \ containing equal elements.\n\n+   3. Each sub-array is now sorted recursively\
    \ using merge sort.\n\n+   4. Finally, the two sub-arrays are merged into a single\
    \ sorted array.\n\n# Algorithm of Merge Sort\n\n```\nMERGE SORT(ARR, BEG, END)\n\
    Step 1: START\nStep 2: IF (BEG < END) /2\nStep 3: Set MID = (BEG + END) / 2\n\
    \    Call MERGE SORT (ARR, BEG, ENDMID)\n    Call MERGE SORT (ARR, MID + 1, END\
    \ )\n    Call MERGE (ARR, BEG, MID, END)\n    [End of If]\nStep 4: EXIT\n```\n\
    \n```\nMERGE(ARR, BEG, MID, END)\nStep 1: START\nStep 2: Set I = BEG, J = MID\
    \ + 1, K = 0\nStep 3: Repeat while (I <= MID) && (J <= END)\n```"
