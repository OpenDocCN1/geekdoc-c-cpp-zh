  md: 'and division (/) operators. The precedence of these operators is given as follows:


    +   * ^, /, +, - (Lower priority)


    The order of evaluation of these operators can be changed by using parentheses.
    For example, an expression X * Y + Z can be solved, as X * Y will be done and
    then added to Z. If the same expression is written with parentheses as X (Y +
    Z), now Y + Z will be evaluated first, and then the result is multiplied by X.


    We can convert an infix expression to a postfix expression using a stack. First,
    we start to scan the expression from the left side to the right side. In an expression,
    there may be operators, operands, and parentheses. Hence, we have to keep in mind
    some of the basic rules, which are as follows:


    +   * Each time we encounter an operand, it is added directly to the postfix expression.


    +   * Each time we get an operator, we should always check the top of the stack
    to check the priority of the operators.


    +   * If the operator at the top of the stack has higher precedence or the same
    precedence as that of the current operator, then, in that case, it is repeatedly
    popped out from the stack and added to the postfix expression. Otherwise, it is
    pushed into the stack.


    +   * Each time when an opening parenthesis is encountered, it is directly pushed
    into the stack, and similarly, if a closing parenthesis is encountered, we will
    repeatedly pop it out from the stack and add the operators in the postfix expression.
    Also, the opening parenthesis is deleted from the stack.


    Now, let us understand it with the help of an algorithm in which the first step
    is to push a left parenthesis in the stack and also add a closing parenthesis
    at the end of the infix expression. The algorithm is repeated until the stack
    becomes empty.'
