  md: '# Algorithm for inserting a new element in a linked queue


    | Step 1: START |

    | Step 2: Set NEW NODE -> INFO = VAL

    IF FRONT = NULL

    Set FRONT = REAR = NEW NODE

    Set FRONT -> NEXT = REAR -> NEXT = NEW NODE

    ELSE

    Set REAR -> NEXT = NEW NODE

    Set NEW NODE -> NEXT = NULL

    Set REAR = NEW NODE

    End of If |

    | Step 3: EXIT |


    In the previous algorithm, first we are allocating the memory for the new node.
    Then we are initializing it with the information to be stored in it. Next, we
    are checking if the new node is the first node of the queue or not. If the new
    node is the first node of the queue, then we are storing NULL in the address part
    of the new node. In this case, the new node is tagged as FRONT as well as REAR.
    However, if the new node is not the first node of the queue, then in that case
    it is inserted at the REAR end of the queue.


    For Example - Consider a linked queue with five elements; a new element to be
    inserted in the queue.


