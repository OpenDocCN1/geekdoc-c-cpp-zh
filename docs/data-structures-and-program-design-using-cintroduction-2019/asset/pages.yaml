  md: '# SWITCH Statement


    As we know, if an statement is used to check the given condition and choose one
    option depending upon whether the condition is true or false. But if we have several
    options to choose from, then it will not be a good thing to use for a problem,
    as it will become very complex. Hence, to avoid such a problem, a switch statement
    is used. The switch statement is a multidirectional conditional control statement.
    It is a simplified version of if-else-if. It selects one option from the number
    of options available to us. Thus, it is also known as a selector statement. Its
    execution is faster than an if-else-if construct. a switch statement is comparatively
    easy to understand and debug. The general syntax of the switch statement is as
    follows:


    ```

    switch (choice)

    {

    case constant 1:

    Statements 1 ;

    break;


    case constant 2:

    Statements 2 ;

    break;


    case constant 3:

    Statements 3 ;

    break;


    .

    .

    case constant n:

    Statements n ;

    break;


    def:

    Statements D;

    }

    ```'
