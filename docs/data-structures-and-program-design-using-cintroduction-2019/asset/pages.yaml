  md: '# Frequently Asked Questions


    Q2. List the advantages and disadvantages of a linked list.


    Answer.


    Advantages of linked lists


    +   1. Linked lists are dynamic data structures; that is, they can grow or shrink
    during the execution of the program.


    +   2. Linked lists have efficient memory utilization. Memory is allocated whenever
    it is required, and it is de-allocated whenever it is no longer needed.


    +   3. Insertion and deletion are easier and efficient.


    +   4. Many complex applications can be easily carried out with linked lists.


    Disadvantages of linked lists


    +   1. They consume more space because every node requires an additional pointer
    to store the address of the next node.


    +   2. Searching a particular element in the list is difficult and time-consuming.


    # 4.3 Memory Allocation in a Linked List


    The process or concept of linked lists supports dynamic memory allocation. Now,
    what is meant by dynamic memory allocation? The answer to this simple question
    is the process of allocating memory during the execution of the program or the
    process of allocating memory to the variables at runtime arrays in which we declared
    the size of the array initially such as array[50]. This statement after execution
    allocates the memory for 50 integers. But there can be a problem if we use only
