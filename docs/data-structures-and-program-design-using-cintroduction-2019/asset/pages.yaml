    +   5. Quick Sort


    Quick sort, also known as partition exchange sort and developed by C. A. R. Hoare,
    is a widely used sorting algorithm which also uses the divide and conquer approach
    we have discussed in merge sort. Here also, we divide a single unsorted array
    into two smaller sub-arrays. The divide and conquer method means dividing the
    bigger problem into two smaller problems, and then two smaller problems into smaller
    problems, and so on. Like merge sort, if there are no elements in the array or
    an array contains only one element, then it is already sorted. A quick sort is
    faster than all the other sorting algorithms which have time complexity O(n logn).


    # Working of Quick Sort


    +   1. An element pivot is selected from the array elements.


    +   2. After choosing the pivot element, all the elements of the array are rearranged
    such that all the elements less than the pivot element will be on left side, and
    all the elements greater than the pivot element will be placed on the right side
    of the pivot element. After rearranging all the elements, the pivot is now placed
    in its final position. Thus, this process is known as partitioning


    +   3. Now, the two sub-arrays obtained will be recursively sorted.


    # Quick Sort Technique


    +   1. Initially set the index of the first element to LEFT and POS. Similarly,
    set the index of the last element to RIGHT. Now, LEFT = 0, POS = 0, RIGHT = N
    - 1 (assuming n elements in the array).'
