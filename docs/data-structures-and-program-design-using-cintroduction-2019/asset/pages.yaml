    # 8.4 Binary Search Tree


    A binary search tree (BST) is a variant of a binary tree. The special property
    of a binary search tree is that all the nodes in the left subtree have a value
    less than that of the root node. Similarly, all the nodes in the right subtree
    have a value more than that of the root node. Hence, the binary search tree is
    also known as an ordered binary tree, because all the nodes in a binary search
    tree are ordered. Also, the left and the right subtrees are also binary search
    trees, and thus the same property is applicable on every subtree in the binary
    search tree. Figure 8.14 represents a binary search tree in which all the keys
    are ordered.


