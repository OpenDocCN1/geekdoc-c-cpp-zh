  md: '# 11.6 File Organization


    File organization refers to the way in which records are physically arranged on
    a storage device. Further, there may be a single key or multiple keys associated
    with it. Therefore, based on its physical storage and the keys used to access
    the records, files are classified as sequential files, relative files, indexed
    sequential files, and inverted files. There are various factors which should be
    taken into consideration while choosing a particular type of file organization
    are:


    +   1. Ease of retrieval of the records.

    2. Economy of storage.

    3. Reliability, that is, whether a file organization is reliable or not.

    4. Security, that is, whether a file organization is secured or not.


    Now, we will discuss some of the techniques which are commonly used for file organization.


    # 11.7 Sequence File Organization


    Sequence file organization is the most basic way to organize collection of records
    in a file. Sequence file organization is when the file is created when the records
    are written, one after the other in order, and can be accessed only in that order
    for input. All the records are numbered from zero onward. Thus, there are N records
    in a file, then the first record is numbered as 0, and the last record will be
    numbered as N-1. In some cases, records of sequential files are sorted by the
    value of some field in each record. The field whose value is used to sort the
    records is known as a sort key. If a file is sorted by the value of a field named
    “key field,” then the record proceeds j if and only if the value of “key field”
    in record i is less than or equal to the value of “key field” in record j. Also,
    a file can be sorted in ascending or descending order by a sort key comprising
    one or more fields. As records in a sequential file can only be accessed sequentially,
    these files are used more commonly in batch processing than in interactive processing.
    For example, the records of a sequential file are used to generate the white pages
    of a telephone directory that will be sorted by the subscriber’s last name.'
