    # 3.2 Definition of an Array


    An array is a collection of homogeneous (similar) types of data elements in contiguous
    memory. An array is a linear data structure because all elements of the array
    are stored in linear order. Let us take an example in which we have ten students
    in a class, and we have been asked to store the marks of all ten students; then
    we need a data structure known as an array.


