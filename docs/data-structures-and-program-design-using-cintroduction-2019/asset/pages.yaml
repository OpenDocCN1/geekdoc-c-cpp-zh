  md: '# Frequently Asked Questions


    Q5. Which one is better—a switch case or an else-if ladder?


    **Answer.**


    +   1. The switch permits the execution of more than one alternative, whereas
    an if statement does not. Various alternatives in an if statement are mutually
    exclusive, whereas alternatives may or may not be mutually exclusive within a
    switch statement.

    2. A switch can only perform equality tests involving integer type or character
    type constants; an if statement, on the other hand, allows for a more general
    comparison involving other data types as well.


    When there are more than three or four conditions, use the switch case rather
    than a long nested if statement.


    # 2.10 Looping Statements in C++


    Looping statements, also known as iterative statements, are the sets of instructions
    which are repeatedly executed until a certain condition or expression becomes
    false. This kind of repetitive execution of the statements in a program is called
    a loop. Loops can be categorized into two categories: pre-deterministic loops
    and deterministic loops. Pre-deterministic loops are ones in which the number
    of times a loop will execute is known. On the contrary, loops in which the number
    of times they will execute is not known are called deterministic loops. C++ supports
    three types of loops, which include the following:


    +   * While Loop

    * Do-while Loop

    * For Loop


    Now, let us discuss loops in detail.'
