    overcome this problem of wastage of memory space or in other words to utilize
    the memory efficiently, dynamic memory allocation is used, which allows us to
    allocate/reserve the memory that is actually required. Hence, it will overcome
    the problem of wastage of memory space in the case of arrays. Dynamic memory allocation
    is best when we are not aware of the'
