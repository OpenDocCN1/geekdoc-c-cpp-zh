  md: '406 • DATA STRUCTURES AND PROGRAM DESIGN USING C++


    +   - The word "pre" in "pre-order" determines that the root node is accessed
    before accessing any other node in the tree. Hence, it is also known as a DLR
    traversal, that is, Data Left Right.


    +   - The word "in" in "in-order" determines that the root node is accessed between
    the left and the right subtrees. Hence, it is also known as an LDR traversal,
    that is, Data Left Right.


    +   - The word "post" in "post-order" determines that the root node will be accessed
    after the left and the right subtrees. Hence, it is also known as an LRD traversal,
    that is, Left Right Data.


    +   - A binary tree can be constructed if we are given at least two of the traversal
    results, provided that one traversal should be an in-order traversal and the second
    can be either a pre-order traversal or post-order traversal.


    +   - An AVL is a self-balancing binary search tree. Every node in the AVL tree
    has a balance factor associated with it. The balance factor is calculated by subtracting
    the height of the right subtree from the height of the left subtree. Thus, a node
    with a balance factor of -1, 0, or 1 is said to be a height-balanced tree.


