  md: '# Practical Application:


    +   1. A simple real-life example is when we search for a word in the dictionary
    and then find the definition or meaning with the help of a key and its index.

    2. Driver''s license numbers and insurance card numbers are created using hashing
    from data items that never change, that is, date of birth, name, and so on.


    # Frequently Asked Questions


    Q. Explain the term hashing.

    Answer.

    Hashing is the process of mapping keys to their appropriate locations in the hash
    table. It is the most effective technique of searching the values in an array
    or in a hash table.


    # 10.1.1 Difference between Hashing and Direct Addressing


    In direct addressing, we store the key at the same address as the key as shown
    in Figure 10.3. However, in hashing, as shown in Figure 10.4, the address of the
    key is determined by using a mathematical function known as a hash function. The
    hash function will operate on the key to determine the address of the key. Direct
    addressing may result in a more random distribution of the key throughout the
    memory, and hence times leads to more wastage of space when compared with hashing.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '![](img/5e3627f19c26cb38acf457f2722a0abd_453_0.png)


    # 10.1.2 Hash Tables


    A hash table is a data structure which supports one of the efficient searching
    techniques, that is, hashing. A hash table is an array in which the data is accessed
    through a special index called a key. In a hash table, keys are mapped to the
    array positions by a hash function. A hash function is a function or mathematical
    formula which, when applied to a key, produces an integer which is used to find
    a key in the hash table. Thus, a value stored in a hash table can be searched
    in O(1) time with the help of a hash function. The main idea behind a hash table
    is to establish direct mapping between the keys and the indices of the array.'
  merge: -1
  pgno: 453
- img_proc: true
  md: '![](img/5e3627f19c26cb38acf457f2722a0abd_454_0.png)


    # ### 10.1.3 Hash Functions


    A hash function is a mathematical formula which, when applied to a key, produces
    an integer which is used as an index to find a key in the hash table.


    # #### Characteristics of the Hash Function


    There are four main characteristics of hash functions which are:


    +   1. The hash function uses all the input data.

    2. The hash function must generate different hash values.

    3. The hash value is fully determined by the data being hashed.

    4. The hash function must distribute the keys uniformly across the entire hash
    table.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Different Types of Hash Functions


    In this section, we will discuss some of the common hash functions:


    +   1. Division Method – In the division method, a key k is mapped into one of
    the m slots by k divided by m. In simple terms, we can say that this method divides
    an integer, say x, by m and then uses the remainder as obtained. It is the simplest
    method of hashing. The hash function is given by:


    ![](img/5e3627f19c26cb38acf457f2722a0abd_455_0.png)


    For Example, if m = 5 and the key k = 10, h(k) = 2. Thus, the division method
    works very fast, as it requires only a single division operation. Although this
    method is good for any value of m, consider that if m is an even number h(k) is
    even when the value of k is even and similarly h(k) is odd when the value of k
    is odd. Therefore, if the even and odd keys are almost equal, there will be no
    problem. But if there is a larger number of even keys, then the division method
    is not good, as it will not distribute the keys uniformly in the hash table. Also,
    we avoid certain values of m; that is, m should not be a power of 2, because if
    h(k) = k mod 2n, then it will extract the lowest bits of k. The main drawback
    of the division method is that many consecutive keys map to consecutive hash values,
    which means that consecutive array locations will be occupied, and hence there
    will be an effect on the performance.


    Frequently Asked Questions


    **Q. Given a hash table of 50 memory locations, calculate the hash values of keys
    20 and 75 using the division method.**

    Answer.

    m = 50, k1 = 10, k2 = 75 hash values are calculated as:

    h(10) = 10 % 50 = 10

    h(75) = 75 % 50 = 25

    **'
