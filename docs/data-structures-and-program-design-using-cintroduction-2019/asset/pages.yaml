  md: "# 2.9 Decision Control Statements in C++\n\nWhenever we talk of a program written\
    \ in the C++ language, we know that a C++ program will always execute sequentially,\
    \ that is, by line. Initially, the first line will be executed, the second line\
    \ will execute after the execution of the first line and so on. Control statements\
    \ are those that enable a programmer to execute a particular block of code and\
    \ specify the order in which the various instructions of code are required to\
    \ be executed. They determine the flow of control. Control statements define how\
    \ the control is transferred to other parts of a program. Hence, they are also\
    \ called decision control statements. A decision control statement is one that\
    \ helps us jump from one point of a program to another. A decision control statement\
    \ is executed in C++ using the following:\n\n+   - If statement\n\n+   - If-else\
    \ statement\n\n+   - Nested if-else statement\n\n+   - Switch Case statement\n\
    \nNow, let us discuss all of them.\n\n# If Statement\n\nAn if statement is a bidirectional\
    \ control statement which is used to test the condition and take one of the possible\
    \ actions. It is the simplest decision control statement and is used very frequently\
    \ in decision making. The general syntax of an if statement is as follows:\n\n\
    ```\nif (condition)\n{\n    Statement Block of if;      //If condition is true,\
    \ execute\n    the statements of if.\n}\nStatements Block under if;\n```"
