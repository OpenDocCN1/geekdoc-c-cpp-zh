    # 4.2 Definition of a Linked List


    A linked list is a linear collection of data elements. These data elements are
    called nodes, and they point to the next node by means of pointers. A linked list
    is a data structure which can be used to implement other data structures such
    as stacks, queues, trees, and so on. A linked list is a sequence of nodes in which
    each node contains one than one data field and a pointer points to the next node.
    Also, linked lists are dynamic in nature; that, memory is allocated as and when
    required. There is no need to know the exact size or number of elements in the
    case of arrays. The following is an example of a simple linked list which contains
    five nodes:


    ![](img/5e3627f19c26cb38acf457f2722a0abd_153_0.png)


