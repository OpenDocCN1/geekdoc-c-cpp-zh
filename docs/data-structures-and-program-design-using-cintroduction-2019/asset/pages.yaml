    # 5.2 Definition of a Queue


    A queue is a linear collection of data elements in which the element inserted
    first be the element taken out first (i.e., a queue is a FIFO data structure).
    A queue is an abstract data structure, somewhat similar to stacks. Unlike stacks,
    a queue is open on both ends. A queue is a linear data structure in which the
    first element is inserted on one end called the REAR end (also called the tail
    end), and the deletion of the element takes place from the other end called the
    FRONT end (also called the head). One end is always used to insert data and the
    other end is used to remove data.


    Queues can be implemented by using arrays or linked lists. We will discuss implementation
    of queues using arrays and linked lists in this section.


    # Practical Application:


    +   - A real-life example of a queue is people moving on an escalator. The people
    who got on the escalator first will be the ones to step off of it.

    - Another illustration of a queue is a line of people standing at the bus stop
    waiting for the bus. Therefore, the first person standing in the line will get
    into the bus first.


    # 5.3 Implementation of a Queue


    Queues can be represented by two data structures:


    +   1. Representation of queues using arrays.

    2. Representation of queues using linked lists.


    Now, let us discuss both of them in detail.


