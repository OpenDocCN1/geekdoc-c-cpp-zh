    searching process.


    +   - Linear search, binary search, and interpolation search are the commonly
    used searching techniques.


    +   - Linear search works by comparing the values to be searched with every element
    of the array in a linear sequence until a match is found.


    +   - Binary search works efficiently when the list is sorted. In a binary search,
    we first compare the value VAL with the data element in the middle position of
    the array.


    +   - Interpolation search, also known as extrapolation search, is a technique
    for searching for a particular value in an ordered array. In each step of this
    searching technique, the remaining search area for the value to be searched for
    is calculated. The calculations are done on the values at the bounds of the search
    area and the value which is to be searched.'
