    # 4.8 Summary


    +   A linked list is a sequence of nodes in which each node contains one or than
    one data field and a pointer which points to the next node.


    +   The process of allocating memory during the execution of the program or the
    process of allocating memory to the variables at runtime is called dynamic memory
    allocation.


    +   A singly linked list is the simplest type of linked list, in which each node
    contains some information/data and only one pointer which points to the next node
    in the linked list.


    +   Traversing a linked list means accessing all the nodes of the linked list
    exactly once.'
