    9.1 Introduction


    We have already studied binary search trees and have discussed that every node
    in a binary search tree contains three parts, that is, an information part and
    two pointers LEFT and RIGHT which point to the left and right subtrees. The same
    concept is used for multi-way search trees. An M-way search tree is a tree which
    contains (M−1) values per node. It also has M sub. In an M-way search tree, M
    is called the degree of the node. For example, if the value of M = 3 in an M-way
    search tree, then the tree will contain two values per node and will have three
    subtrees. When an M-way search tree is not empty, it has the following properties:


    1. Each node in an M-way search tree has it of the following structure:


    | n | P0 | K0 | P1 | K1 | P2 | K2 | ... | Pn-1 | Kn-1 | Pn |'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# 416 * DATA STRUCTURES AND PROGRAM DESIGN USING C++


    where $P_0, P_1, P_2, \dots P_n$ are the pointers to the node''s subtrees and
    $K_0$, $K_1, K_2, \dots K_n$ are the key values stored in the node.


    +   2. The key values in a node are stored in ascending order, that is, $K_i <
    K_{i+1}$ where $i = 0, 1, 2, \dots, n-2$.


    +   3. All the key values stored in the left subtree are always less than the
    root node.


    +   4. All the key values stored in the right subtree are always greater than
    the root node.


    +   5. The subtrees pointed to by $P_i$ for $i = 0, 1, 2, \dots, n$ are also M-way
    search trees.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_433_0.png)


    FIGURE 9.1. M-way search tree of order 4.


    # 9.2 B–Trees


    A B-tree is a specialized multi-way tree which is widely used for disk access.
    The B-tree was developed in 1970 by Rudolf Bayer and Ed McCight. In a B-tree each
    node may contain large number of keys. A B-tree is designed to store a large number
    of keys in a single node so that the height remains relatively small. A B-tree
    of order $m$ has all the properties of a multi-way search tree. In addition, it
    has the following properties:


    +   1. All nodes are at the bottom level or at the same level.


    +   2. Every node in a B-tree can have at most $m$ children.


    +   3. The root node can have at least two children if it is not a leaf node,
    and it can obviously no children if it is a leaf node.'
