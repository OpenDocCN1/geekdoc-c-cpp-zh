  md: '# 11.10 Inverted File Organization


    One fundamental approach for providing a linkage between an index and a file is
    called inversion. A key''s inversion index contains all the values that the key
    presently has in records of the file. Each key-value entry in the inversion index
    points to all the data records that have the corresponding value. Then, the file
    is said to be inverted on that key. The inversion approach for providing multi-key
    access has been used as the basis for a physical data structure in commercially
    available DBMS such as Oracle, DB2, and so on. These systems were designed to
    provide rapid access to the records via many inversion keys as the designer cares
    to identify. They have user-friendly, natural-language-like query languages to
    assist the user in formulating inquiries. A complete file has an inverted index
    for every data field. If a file is not completely inverted but has at least one
    inversion index, then it is said to be a partially inverted file.


    # Advantages of Inverted File Organization


    +   1. The Boolean query requires only one access per record satisfying the query
    along some access to process the indexes.

    2. Records can be stored in any way, for example, sequentially ordered by primary
    key, randomly ordered by primary key, and so forth.

    3. It also results in space saving as compared with the other file structures.


    # Disadvantages of Inverted File Organization


    Since the index entries are of variable lengths, index maintenance becomes more
    complex.


    # 11.11 Summary


    +   * A file is a collection of records. It is usually stored on a secondary storage
    device.

    * The data is organized in a hierarchical order in the files. The hierarchical
    order includes items such as records, fields, and so on.

    * File creation is the first operation to be performed on the files if the file
    is not created. A file is created by specifying its name and mode.

    * A file is classified into two types, which are text files and binary files.'
