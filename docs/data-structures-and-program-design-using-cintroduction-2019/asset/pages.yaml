    # 10.2 Summary


    +   - A hash table is an array in which the data is accessed through a special
    index called a key. In a hash table, keys are mapped to the array positions by
    a hash function.

    - A hash function is a mathematical formula which when applied to a key produces
    an integer which is used as an index to find a key in the hash table.

    - There are different types of hash functions which use numeric keys. Popular
    methods are the division method, the mid square method, and the folding method.

    - In the division method, a key k is mapped into one of the m slots by taking
    the remainder of k divided by m. The main drawback is that many consecutive keys
    map to consecutive values respectively, which means that consecutive array locations
    will be occupied, and hence there will be an effect on the performance.

    - In mid square method, we will calculate the square of the given key. After getting
    the number, we will extract digits from the middle of that number as an address.

    - In the folding method, we will break the key into pieces such that each piece
    has the same number of digits except the last one, which may have lower digits
    as compared to other pieces. Now, these individual pieces are added. Hence, the
    hash value is formed.

    - A collision is a situation which occurs when a hash function maps two different
    keys to a single/same location in the hash table.

    - Collision resolution techniques are used to overcome the problem of collision
    in hashing. There are two popular methods which are used for resolving collisions,
    which are collision resolution by the chaining method and collision resolution
    by the open addressing method.

    - In the chaining method, a chain of elements is maintained that have same hash
    address. Hash tables behave like an array of pointers. Each location in the hash
    table stores a pointer to the linked list which contains all the key elements
    that were hashed to that location. The disadvantage of this method is the wastage
    of storage space as the key elements are stored in the linked list; in'
