    # 2.1 Introduction


    Programming language like C++ is a set of commands that are specifically designed
    for instructing the computer devices to perform specific tasks. There are three
    levels of programming languages, which are commonly known as high-level, middle-level,
    and low-level languages. The level determines the degree of closeness of the programming
    language with the hardware. Generally, high-level languages are portable, which
    means they can operate in different machines with fewer modifications. A high-level
    language, instead of being machine-dependent, is oriented toward problem-solving,
    whereas a low-level language is limited by the characteristics of the hardware.
    Each programming language is chosen to solve a particular class of problems depending
    on the type of program. The C++ language is a middle-level language that directly
    interacts with the hardware-with almost no limitations and can abstract lower
    layers, thus it can work as one of the powerful high-level languages.


    # 2.2 C++ and Its Characteristics


    The C++ language was created and developed by Bjarne Stroustrup, a Danish computer
    scientist at Bell Labs, in New Jersey in 1979. The C++ language supports all the
    features, flexibilities, and attributes of C language. It also introduces various
    new features that were designed to support object-oriented programming. C++ was
    initially known with the new name of “C with Classes.\ Thus, C++ is the object-oriented
    version of C. When creating C++, Stroustrup accomplished his goal of retaining
    the efficiency, flexibility, and philosophy of C while also adding new features
    for OOP (Object Oriented Programming). The following characteristics distinguish
    C++ from other programming languages:


    +   C++ is object-oriented programming that allows the program to interact with
    the help of the objects. It allows greater usability of code in a productive way.


    +   C++ is portable; that is, the code written in C++ can be compiled in any of
    the computer systems without any modifications.


