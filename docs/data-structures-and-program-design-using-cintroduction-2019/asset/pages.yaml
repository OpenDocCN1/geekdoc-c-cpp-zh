  md: '# 12.4 Graph Traversal Techniques


    In this section, we will discuss various types of techniques to traverse a graph.
    As we all know, a graph is a collection of nodes and edges. traversing in a graph
    is the process of visiting each node and edge in some systematic approach. Therefore,
    there are two types of standard graph traversal techniques, which are:


    +   1. Breadth First Search (BFS)

    2. Depth First Search (DFS)


    Now, we will discuss both of these techniques in detail.


    # 12.4.1 Breadth First Search


    Breadth first search is a traversal technique that uses the queue as an auxiliary
    data structure for traversing all member nodes of a graph. In this technique,
    first we will select any node in the graph as a starting node, and then we will
    all the nodes adjacent to the starting node. We will maintain the same approach
    for all the other nodes. Also, we will maintain the status of all the traversed/visited
    nodes in a queue so that no nodes are traversed again. Now, let us take a graph
    and apply BFS to traverse the graph.


    ![](img/5e3627f19c26cb38acf457f2722a0abd_509_0.png)


    Now, we will start the traversal of the graph by taking node A as a starting node
    of the previous sample graph. Then, we will traverse all the nodes adjacent to
    the starting node A. As we can see, B, C, and E are the adjacent nodes of A. So,
    we will traverse these nodes in any order, say E, C, B. So the traversal is:


    ```

    A, E, C, B

    ```'
