    # 4.5 Header Linked Lists


    Header linked lists are a special type of linked list which always contain a special
    node, at the beginning, called the header node, This header node usually contains
    vital information about the linked list, like the total of nodes in it, whether
    the list is sorted or not, and so on. There are two types of header linked lists,
    which include:


    1) Grounded Header Linked List – This linked list stores a unique NULL in the
    address field (next part) of the last node of the list.


