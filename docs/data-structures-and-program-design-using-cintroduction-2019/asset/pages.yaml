    # 3.18 Summary


    +   - An array is a collection of homogeneous (similar) types of data elements
    in contiguous memory. An array is a linear data structure because all elements
    of an array are stored in linear order.

    - An array must be declared before it is used.

    - The initialization of the elements of an array at compile time is done in the
    same way as we initialize the normal or ordinary variables at the time of their
    declaration.

    - Initialization of elements of an array at runtime refers to the method of inputting
    the values from the keyboard.

    - The address of the elements in a 1-D array can be calculated easily, as an array
    stores all its data elements in contiguous memory locations, storing the base
    address.

