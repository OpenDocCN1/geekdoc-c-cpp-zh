    # Advantages and Disadvantages of the Chained Method


    The main advantage of this method is that it completely resolves the problem of
    collision. It remains effective even when the key elements to be stored in the
    hash table are higher than the number of locations in the hash table. However,
    it is quite obvious that with the increase in the number of key elements, the
    performance of this method will decrease.


    The disadvantage of this method is the wastage of storage space as the key elements
    are stored in the linked list; in addition, the pointers are required for each
    element to get accessed, which in turn are consuming more space.


    # 10.1.5.2 Open Addressing Method


    In the open addressing method, all the elements are stored in the hash table itself.
    There is no need to provide the pointers in this method, which is the biggest
    advantage of this method. Once a collision takes place, open addressing computes
    new locations using the probe sequence, and the next element or record is stored
    on that location. Probing is the process of examining the memory locations in
    the hash table. When we perform probe/examine the hash table until we find an
    empty slot in which the new key can be inserted. The open addressing method can
    be implemented using the following:


    +   * Linear Probing

    * Quadratic Probing

    * Double Hashing


