  md: '# 3. Deleting an Element in an Array


    Deleting an element from an array refers to the operation of the removal of an
    element from an array. Deletion in an array can be done in three ways:


    +   - Deletion from the beginning

    - Deletion from a specified position

    - Deletion from the end


    Now let us discuss all of these cases in detail. In this case the element to be
    deleted from the beginning of the array. In order to delete an element from the
    beginning, all the stored elements must move one place backward in the array.
    For example, if an array is declared to hold 10 elements and it contains only
    seven elements, and it is also given that the element to be deleted from the beginning
    of the array, then all the stored elements must move one place back as shown in
    the following array:


    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] | arr[5] | arr[6] | arr[7] | arr[8]
    | arr[9] |

    | 23 | 15 | 47 | 9 | 33 | 90 | 77 | | |


    ![](img/5e3627f19c26cb38acf457f2722a0abd_112_0.png)


    In order to delete the first element, 23, from the array, we swap all the stored
    elements backward so that the first element gets deleted as shown. After the deletion
    of 23 from the array, the new array will be:


    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] | arr[5] | arr[6] | arr[7] | arr[8]
    | arr[9] |

    | 15 | 47 | 9 | 30 | 90 | 77 | | | |'
