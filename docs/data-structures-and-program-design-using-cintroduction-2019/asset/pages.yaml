  md: '# Frequently Asked Questions


    Q. Explain how a linear search technique is used to search for an element.


    Answer.


    Suppose that ARR is an array having N elements. ITEM is the value to be searched.
    We then have the following cases:


    +   Case 1: Unsorted List – The ITEM is compared with every element of the array.
    If the element is found, then no further comparison is required. If all the elements
    are compared and checked, then the ITEM is not found.


    +   Case 2: Sorted List – The ITEM is greater than the first element and smaller
    than the last element of the list, so searching is performed by comparing each
    element in the list with ITEM; otherwise, ITEM is reported as “Not Found.”


    # 6.3 Binary Search


    A binary search is an extremely efficient searching algorithm when it is compared
    to a linear search. A binary search works only when the array/list is already
    sorted. In a binary search, we first compare the value VAL with the data element
    in the middle position of the array. If the match is found, then the position
    POS of element is returned; otherwise, if the value is less than the middle element,
    then we begin our search in the lower half of the array and vice versa. So, we
    repeat this process on the lower and upper half of the array.


    # 6.3.1 Binary Search Algorithm


    Let us now understand how this binary search algorithm works in an array.


    +   1. Find the middle element of the array, that is, n/2 is the middle element
    of the array containing n elements.


    +   2. Now, compare the middle element of the array with the data element to be
    searched.'
