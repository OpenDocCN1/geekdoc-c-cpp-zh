  md: '# 7.6.1 Polish and Reverse Polish Notations and Their Need


    +   a. Polish Notations


    Polish notation refers to a notation in which the operator is placed before the
    operands. Polish notation was named after Polish mathematician Jan Lukasiewicz.
    We can also say that the transforming of an expression into a form is called a
    polish notation. An algebraic expression can also be represented in three forms.
    All these forms refer to the relative position of operators with respect to the
    operands.


    +   1. Prefix Form – In an expression, if the operator is placed before the operands,
    that is, +XY, then it is said to be in prefix form.


    +   2. Infix Form – In an expression, if the operator is placed in the middle
    of the operands, that is, X + Y, then it is said to be in infix form.


    +   3. Postfix Form – In an expression, if the operator is placed after the operands,
    that is, XY+, then it is said to be in postfix form.


    +   b. Reverse Polish Notation


    This notation frequently refers to the postfix notation or suffix notation. It
    refers to the notation in which the operator is placed after its two operands,
    that is, XY + AF BC*.


    +   c. Need for Polish and Reverse Polish Notation


    It is comparatively easy for a computer system to evaluate an expression in polish
    notation as the system need not check for priority-wise execution of various operators
    (like the BODMAS rule), as all the operators in prefix or postfix expressions
    will automatically occur in their order of priority.


    # 7.6.2 Conversion from Infix Expression to Postfix Expression


    In this expression, we observe that there are two types of parts/components clubbed
    together. They are operands and operators. The operators indicate the operation
    to be carried out, and the operands are ones on which the operators operate. Operators
    have their priority of execution. For simplicity of the algorithm, we will use
    only addition (+), subtraction (-), modulus (%), multiplication (*),'
