    +   1. Elements in Row Major Order


    Address(A[i][j]) = Base address(BA) + w( n(i-1) + (j-1 )


    +   2. Elements in Column Major Order


    Address(A[i][j]) = Base address(BA) + w( m(j-1) + (i-1) )


    where w is size in bytes to store each element.

    m is the total number of rows in the array,

    n is the total number of columns in the array


    # Frequently Asked X Questions


    Q. Consider a 25 X 5 two-dimensional array of students which has a base address
    500 and the size of each element is 2.

    Now calculate the address of the element student[15][3] assuming that the elements
    are stored in

    a) Row major order


    b) Column major order


    Answer.


    a) Row major order


    Here we are given w = 2, base address = 500, i = 15, j = 3.

    Address(A[i][j]) = Base address(BA) + w( n(i-1) + (j-1 ) )

    Address(student[15][3]) = 500 + 2( 15-1 ) + ( 3-1 )

    = 500 + 2( 14 ) + 2

    = 500 + 2( 72 )

    = 500 + 144


    Address(student[15][3]) = 644


    b) Column major order


    Here we are given w = 2, base address = 500, m = 25, i = 15, j = 3.

    Address(A[i][j]) = Base address(BA) + w( m(j-1) + (i-1) )

    Address(student[15][3]) = 500 + 2( 25(3-1 ) + ( 15-1 )\)

    = 500 + 2( 25( 2 ) + 14 )

    = 500 + 2( 64 )


    Address(student[15][3]) = 500 + 128 = 628'
