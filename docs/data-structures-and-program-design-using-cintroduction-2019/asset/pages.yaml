    # 5.1 Introduction


    A queue is an important data structure which is widely used in many computer applications.
    A queue can be visualized with many examples from our day-to-day life which we
    are already familiar. A very simple illustration of queue is a line of people
    standing outside to enter a movie theater. The first person standing in the line
    will enter the movie theater first. Similarly, there are many daily life examples
    in which we can see the queue being implemented. Hence, we observe that whenever
    we talk about a queue, we see that the element at the first position will be served
    first. Thus, a queue can be described as a FIFO (first in, first out) data structure;
    that is, the element which is inserted first will be the first one to be taken
    out. Now, let us discuss more about queues in detail.'
