  md: "# 7.5.2 Implementation of Stacks Using Linked Lists\n\nWe have already studied\
    \ how a stack is implemented using an array. Now let us discuss the same using\
    \ linked lists. We already know that in linked lists, dynamic memory allocation\
    \ takes place; that is, the memory is allocated at runtime. But in the case of\
    \ arrays, memory is allocated at the start of the program. If we are aware of\
    \ the maximum size of the stack in advance, then implementation of stacks using\
    \ arrays will be efficient. If the size is not known in advance, then we will\
    \ use the concept of a linked list in which dynamic memory allocation takes place;\
    \ the first part contains the information of the node, and the second part stores\
    \ the address of the next element in the linked list. Similarly, we can also implement\
    \ a linked stack. Now, the START pointer in the linked list will become the TOP\
    \ pointer in a linked stack. All insertion and deletion operations will be done\
    \ at the node pointed to by TOP.\n\n![](img/5e3627f19c26cb38acf457f2722a0abd_332_0.png)\n\
    \nFIGURE 7.7 Linked representation of a stack.\n\n# 7.5.2.1 Push Operation of\
