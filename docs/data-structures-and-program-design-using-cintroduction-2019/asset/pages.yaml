    | • In C, fopen, fclose, fwrite, fread, fseek, fprintf, fscanf, and other functions
    can be called directly without any help of an object. | • In C++, open, close,
    and other functions are called with the help of an object that is, for example,
    fstream f. Here, f is the object of the stream class, and all the functions will
    be called with the help of objects like fopen, fclose, fread, fwrite, and so on.
    |

    | • In C, the modes are r(read), w(write), and a(append), and these can be used
    directly. | • In C++, the modes are in, out, bin, and so on, these are used with
    the help of scope resolution operators like ios::in, ios::out, and so forth. |'
