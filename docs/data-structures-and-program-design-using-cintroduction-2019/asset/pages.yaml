  md: '# Searching for an Element in an Array


    Searching for an element in an array means to find whether a particular value
    exists in an array or not. If that particular value is found, then the searching
    is said to be successful and the position/location of that particular value is
    returned. If the value is not found, then searching will said to be unsuccessful.
    There are two methods for searching: linear search and binary search. In this
    chapter we will only discuss linear search in detail, and the binary search technique
    will be discussed in upcoming chapters. Now, we will learn how linear search works.


    # Linear Search


    Linear search is a very simple technique used to search a particular value in
    an array. It is also called a sequential search, as it works by comparing the
    values to be searched with every element of the array in a sequence until a match
    is found.


    For example, let us take an array of 10 elements which is declared:


    ```

    int array[10] = { 23, 15, 47, 9, 30, 33, 90, 77, 100, 11 }

    ```


    and search for 90 in the array; then every element of the array will be compared
    to 90 until 90 is found.


    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] | arr[5] | arr[6] | arr[7] | arr[8]
    | arr[9] |

    |---|---|---|---|---|---|---|---|---||}{

    | 23 | 15 | 47 | 9 | 30 | 33 | 90 | 77 | 100 | 11 |


    ![](img/5e3627f19c26cb38acf457f2722a0abd_118_0.png)


    In this way linear search is used to search for a particular value in the array.
    The following is the program for a linear search.'
