  md: '# 6.4 Interpolation Search


    An interpolation search, also known as an extrapolation search, is a technique
    for searching for a particular value in an ordered array. This searching technique
    is more efficient than a binary search if the elements in the array are sorted.
    The technique of an interpolation search is similar to when we are searching for
    "Abhishek" in the telephone directory; we don''t start in the middle, because
    we know that it will be near the extreme left, so we start from the front and
    work from there. That is the main idea of an interpolation search; that is, instead
    of dividing the list into fixed halves, we cut it by an amount that seems most
    likely to succeed.


    # Practical Application:


    If we want to search for "Ayush" in the directory, then we will always search
    in the extreme left of the directory.


    # 6.4.1 Working of the Interpolation Search Algorithm


    In each step of this searching technique, the remaining search area for the value
    to be searched is calculated. The calculations are done on the values at the bounds
    of the search area and the value which is to be searched. Therefore, the value
    found at this position will now be compared with the value to be searched. If
    both values are equal, then the search is said to be successful. If both values
    are unequal, depending upon the comparison done, the remaining search area is
    reduced to the just before or after the initial position.


    Consider an array ARR of n elements where the elements are arranged in a sorted
    manner. Initially low is set to 0 and high is set to n-1. Now we are searching
    a VAL between ARR[LOW] and ARR[HIGH]. Then, in this case, MID will be calculated
    by the following formula:


    ```

    MID = LOW + ((HIGH - LOW) X ((VAL - ARR[LOW]) / ARR[HIGH] - ARR[LOW])))

    ```


    If the VAL is found at MID, then the search is complete; otherwise, if the value
    is lower than ARR[MID], reset HIGH = MID - 1, and if'
