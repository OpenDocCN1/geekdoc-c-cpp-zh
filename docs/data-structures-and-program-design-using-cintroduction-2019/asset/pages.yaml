    # 8.6 Summary


    +   - A tree is defined as a collection of one or more nodes where one node is
    designated as a root node, and the remaining nodes can be partitioned into the
    left and the right subtrees. It is used to store hierarchical data.


    +   - The root node is the topmost node of the tree. It does not have a parent
    node. If the root node is empty, the tree is empty. A leaf node is one which does
    not have any child nodes.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '+   A path is a unique sequence of consecutive edges which is required to be
    followed to reach the destination from a given source.


    +   The degree of a node is equal to the number of children that a node has.


    +   A binary tree is a collection of nodes where each node contains three parts,
    that is, a left pointer, a right pointer, and the data item. A binary tree can
    have at most 2 children; that is, a parent can have either 0, 1, or 2 children.


    +   There are two types of binary trees, that is, complete binary trees and extended
    binary trees.


    +   In a complete binary tree, every level except the last one must be completely
    filled. Also, all the nodes in the complete binary tree must appear as much as
    possible.


    +   Extended binary trees are also known as 2T-trees. A binary tree is said to
    be an extended binary tree if and only if every node in the binary tree has either
    0 children or 2 children.


    +   Binary trees can be represented in the memory in two ways, which are array
    representation of binary trees and linked representation of binary trees. Array
    representation, also known as sequential representation, of binary trees is done
    using one-dimensional (1-D) arrays. Linked representation of binary trees is done
    using linked lists.


    +   A binary search tree (BST) is a variant of a binary tree in which all the
    nodes in the left subtree have a value less than that of a root node. Similarly,
    all the nodes in the right subtree have a value more than that of a root node.
    It is also known as an ordered binary tree.


    +   The searching operation is one of the most common operations performed in
    a binary search tree. This operation is performed to find whether a particular
    key exists in the tree or not.


    +   An insertion operation is performed to insert a new node with the given value
    in a binary search tree.


    +   The mirror image of a binary search tree means interchanging the right subtree
    with the left subtree at every node of the tree.


    +   Traversing is the process of visiting each node in the tree exactly once in
    a particular order. A tree can be traversed in various ways, which are pre-order
    traversal, in-order traversal, and post-order traversal.'
