  md: '# 8.5.2 Operations on an AVL Tree


    In this section, we will discuss various operations which are performed on AVL
    trees. These are:


    +   - Searching a node in an AVL Tree

    - Inserting a new node in an AVL Tree

    - Now, let us discuss both of them in detail.


    +   1. Searching a node in an AVL Tree

    The process of searching a node in an AVL tree is the same as for a binary search
    tree.


    +   2. Inserting a new node in an AVL Tree

    The process of inserting a new node in an AVL tree is quite similar to binary
    search trees. The new node is always inserted as a terminal/leaf node in the AVL
    tree. But the insertion of a new node can disturb the balance of the AVL tree,
    for the balance factor may be disturbed. Thus, for the tree to remain balanced,
    the insertion process is followed by a rotation process. The rotation process
    is usually done to restore the balance factor of the tree. If the balance factor
    of each node is -1, 0, or 1 after the insertion process, then the rotation is
    not required, as the tree is already balanced; otherwise, rotation is required.
    Now, let us look at the given example and how insertion is done without rotations.


    **For Example** – In the given AVL tree, insert a new node with value 60 in the
    tree.


