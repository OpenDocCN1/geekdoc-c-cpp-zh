  md: '474 • DATA STRUCTURES AND PROGRAM DESIGN USING C++


    # 11.9 Relative File Organization


    Relative file organization provides an effective way of accessing records directly.
    In relative file organization, there is a predictable relationship between the
    key and the record''s location in the file. The records do not necessarily appear
    physically in sorted order by their keys. Then how is a record found? The relationship
    that will be used to translate between key value and the physical address is designated,
    for example, R(key value → address). When a record is to be written into a relative
    file, the mapping function R is used to translate the record''s key to an address
    where the record is stored. The fundamental techniques that are used for mapping
    function R are directory lookup and address calculation (hashing).


    +   * Directory Lookup Technique It is the simplest technique for implementing
    a mapping function R. The basic idea of this technique is to keep a directory
    of key values: address pairs. To find a record in a relative file, one locates
    its key value in the directory, and then the indicated address is used to find
    the record on the storage device. The directory can be organized as a binary search
    tree.


    +   * Address Calculation Technique – Another common technique for implementing
    a mapping function R is to perform a calculation on the key value (hashing) such
    that the result is a relative address.


    # Advantages of Relative File Organization


    +   1. Records can be accessed out of sequence.

    2. It is well suited for interactive applications.

    3. It supports an update operation between the files.


    # Disadvantages of Relative File Organization


    +   1. It can be stored only on magnetic disks.

    2. It also involves extra overhead in the form of maintenance of indexes.'
