    always contain 0s on the diagonal.

    * The adjacency matrix for a weighted graph will always contain the weights of
    the edges connecting the nodes instead of 0 and 1.

    * The adjacency matrix for an undirected multi-graph will contain the number of
    edges connecting the vertices instead of 1.


    # 13.2.2 Adjacency List Representation


    The adjacency matrix representation has some major drawbacks. First, it is very
    difficult to insert and delete nodes in/from the graph as the size of the matrix
    needs to be changed accordingly, which is a very time-consuming process. Also,
    sometimes the matrix may contain many zeros (sparse matrix). Hence, it is not
    a healthy representation. Therefore, adjacency list representation is preferred
    for representing sparse graphs in the memory. In this representation, every node
    is linked to its list of all the other nodes which are adjacent to it. Adjacency
    list representation makes it easier to delete nodes. Also, it shows the adjacent
    nodes of a particular node. Now, let us take a few examples to discuss and understand
    it more clearly.'
