    # Unary Operators


    A unary operator is one which requires only a single operand to work. C++ supports
    two unary operators, which are increment (++) and decrement (--). These operators
    are used to increase or decrease the value of a variable by one respectively.
    The two variants of increment and decrement operators are postfix and prefix.
    In a postfix expression, the operator is applied after the operand. On the other
    hand, in a prefix expression, the operator is applied before the operand.


    | Operator | Postfix | Prefix |

    | --- | --- | --- |

    | Increment (++) | x++ | ++x |

    | Decrement (--) | --x | --x |


    Remember, x++ is not same as ++x; in++ the value is returned first, and then the
    value is incremented. In ++x, the value is returned after it is incremented. Similarly,
    x- is not same as --; It is true that both these operators increment or decrement
    the value by 1. For example, b = a++ is equivalent to:


    +   1. b = a


    +   2. a = a + 1.


    Similarly, b = --a is equivalent to:


    +   1. a = a - 1,


    +   2. b = a.'
