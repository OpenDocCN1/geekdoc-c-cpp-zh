    # a) Traversing a linked list


    Traversing a linked list means accessing all the nodes of the linked list exactly
    once. A linked list will always contain a START pointer, which stores the address
    of the first node of the linked list and which also represents the beginning of
    the linked list, and a NULL pointer which represents the end of the linked list.
    For traversing a linked list, we will use another pointer variable PTR which will
    point to the node which is currently being accessed. The algorithm for traversing
    a linked list is shown as follows:


    Algorithm for traversing a linked list


    | Step 1: Set PTR = START

    Step 2: Repeat Steps 3 & 4 while PTR != NULL

    Step 3: Print PTR -> INFO

    Step 4: Set PTR = PTR -> NEXT

    [End of Loop]

    Step 5: Exit |


