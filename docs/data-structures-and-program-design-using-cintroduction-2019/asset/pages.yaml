  md: '# Practical Application:


    Consider a man driving a bus. The man only knows that pressing the accelerator
    will increase the speed of the bus and that applying the brakes decreases the
    speed of the bus. The man does not know how pressing the accelerator increases
    the speed or how applying the brakes decreases the speed. Hence, he does not know
