    # A switch statement works as follows:


    +   * Initially, the value of the expression is compared with the case constants
    of the switch construct.

    * If the value of the expression and the switch statement match, then its corresponding
    block is executed until a break is encountered. Once a break is encountered, the
    control comes out of the switch statement.

    * If there is no match in the switch statements, then the set of statements of
    default is executed.

    * All the values of the case constants must be unique.

    * There can be only one default statement in the entire switch statement. A default
    statement is optional; if it is not present and there is no match with any of
    the case constants, then no action takes place. The control simply jumps out of
    the switch statement.'
