    # 5.3.2 Implementation of Queues Using Linked Lists


    We have already studied how a queue is implemented using an array. Now let us
    discuss the same using linked lists. We already know that in linked lists, dynamic
    memory allocation takes place; that is, the memory is allocated at runtime. In
    the case of arrays, memory is allocated at the start of the program. We have already
    discussed this in the chapter about linked lists. If we are aware of the maximum
    size of the queue in advance, then implementation of a queue arrays will be efficient.
    But if the size is not known in advance, then we will use the concept of a linked
    list, in which dynamic memory allocation takes place. As we know a linked list
    has two parts, in which the first part contains the information of the node and
    the second part stores the address of the next element in the linked list. Similarly,
    we can also implement a linked queue. The START pointer in the linked list will
    become the FRONT pointer in a linked queue, and the end of the queue will be denoted
    by REAR. All insertion operations will be done at the rear end only. Similarly,
    all deletion operations will be done at the front end.


