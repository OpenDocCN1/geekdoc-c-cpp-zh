    # 5.6 Applications of Queues


    +   - In real life, center phone systems use queues to hold people calling them
    in an order until a service representative is free.

    - The handling of interrupt in real-time systems use the concept of queues. The
    interrupts are handled in the same order as they arrive, that is, First Come First
    Served.

    - The round-robin technique for processor scheduling is implemented using queues.

    - Queues are often used as buffers on portable CD players, MP3 players, and in
    iPod playlists.


    # 5.7 Summary


    +   - A queue is a collection of data elements in which the element inserted first
    will be the element taken first (i.e., a queue is a FIFO data structure).

    - A queue is a linear data structure in which the first element is inserted from
    one end called the REAR end, and the deletion of the element takes place from
    the other end called the FRONT end.

    - The implementation of queues can be done in two ways, which are implementation
    through arrays and implementation through linked lists.

    - Insertion and deletion are the two basic operations which are performed on the
    queues.

    - A circular queue is a linear data structure in which the operations are based
    on a FIFO (First In First Out) principle and the first index comes after the last
    index.

    - A priority queue is a queue in which elements are processed on the basis of
    assigned priority. Each element in a priority queue is assigned a special value
    called priority of the element.

    - When a priority queue is implemented using linked lists, then every node of
    the list will have three parts, that is, a data part, priority number of the element,
    and the address of the next element.'
