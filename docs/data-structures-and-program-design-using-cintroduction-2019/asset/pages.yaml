  md: '# Advantages and Disadvantages of Linear Probing


    Linear probing is a very good technique, the algorithm provides good memory caching
    through good locality of address. The main disadvantage of this method is that
    it results in clustering. Due to clustering, there is a higher risk of collisions
    taking place. Also, the time required for searching also increases with the size
    of the clusters. Now, we can say that the higher the number of probes are required
    to find a vacant location, the performance is lessened. This is known as primary
    clustering. We can avoid this clustering by using other techniques such as quadratic
    probing and double hashing.


    # Quadratic Probing


    Quadratic probing is another approach to resolving the problem of collision in
    hashing. In this method, if a key is already stored at a location generated by
    the hash function h(k), the situation can be resolved by the following hash function:


    ```

    h''(k) = (h(k) + c1i + c2i²) mod m

    h(k) = k mod m

    ni = Probe no. = 0, 1, 2, 3........(m-1)

    c1, c2 = consonants

    (c1, c2 should not be equal to zero)

    ```


    The quadratic probing method is better than linear probing, as it ternates the
    phenomenon of primary clustering because of its searching speed; that is, it is
    doing a quadratic search. For a given k, the first location generated by h(k)
    + 0 + 0) mod m is probed, because for the first time i = 0. If the location generated
    is free, then the key is stored in it. Otherwise, subsequent positions probed
    are offset by the amounts/factors that depend in a quadratic manner on the probe
    number i. The quadratic probing method works better than linear probing, but to
    maximize the use of the hash table, the values of m, c1, and c2 are constrained.'
