  md: '# 18 DATA STRUCTURES AND PROGRAM DESIGN USING C++


    # 1.8 Big O Notation


    The performance of an algorithm, that is, time and space requirements, can be
    easily compared with other competitive algorithms using asymptotic notations such
    as the big O notation, the Omega notation, and the Theta notation. The algorithmic
    complexity can be easily approximated using asymptotic notations by simply ignoring
    the implementation-dependent factors. Here, we can compare various available algorithms
    using big O notation or any other asymptotic notation.


    Big O notation is one of the popular analysis characterization schemes, since
    it provides an upper bound on the complexity of an algorithm. In big O, O(g) is
    representative of the class of functions that grow no faster than g. Therefore,
    if $f(n)=O(g(n))$ then $f(n) < cg(n)$ for all $n > n_0$ where $n_0$ represents
    a threshold and $c$ represents a constant.


    An algorithm with O(1) complexity is referred to as a constant time algorithm.
    Similarly, an algorithm with O(n) complexity is referred to as a linear algorithm,
    $O(n^2)$ for quadratic algorithms, $O(2^n)$ for exponential time algorithms, $O(n^)$
    for polynomial time algorithms, and $O(\log n)$ for logarithmic time algorithms.


    An algorithm with complexity of the order of $O(\log n)$ is considered one of
    the best algorithms, while an algorithm with complexity of the order of $O(2^n)$
    is considered the worst algorithm. The complexity of computation or the number
    of iterations required in various types of functions may be compared as follows:


    $O(\log n) < O(n) < O(n^2) < O(n^3) < O(2^n)$


