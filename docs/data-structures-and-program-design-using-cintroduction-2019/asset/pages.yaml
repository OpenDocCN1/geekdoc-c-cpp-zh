    # Frequently Asked Questions


    # Q2. Explain the differences between abstraction and encapsulation.


    Answer.

    Data abstraction refers to providing only essential information to the outside
    world and hiding the background details, that is, representing the needed information
    in the program without presenting all the details. On the other hand, encapsulation
    is an object-oriented programming concept that binds together the data and the
    functions that manipulate the data and keeps them safe from the outside world.


    +   - Message Passing – Message passing is the process of communication between
    objects. An object-oriented program consists of objects that communicate by sending
    and receiving information from each other. A message for an object is a request
    for the execution of a procedure, and thus it will invoke a method in the receiving
    object that generates the desired results. Message passing involves three things:
    the name of the object, the name of the function, and the data/information to
    be sent.


    +   - Dynamic Binding – Dynamic binding is the process by which the code that
    has to be executed for a given procedure call is known at runtime rather than
    at the compile time. It is also known as dynamic dispatch. It is an object-oriented
    programming concept, and it is also related to inheritance and polymorphism.'
