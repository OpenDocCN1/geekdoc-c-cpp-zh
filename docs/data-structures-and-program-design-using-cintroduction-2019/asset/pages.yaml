    A doubly linked list is also called a two-way linked list; it is a special type
    of linked list which can point to the next node as well as the previous node in
    the sequence. In a doubly linked list each node is divided into three parts:


    +   1) The first part is the previous pointer, which contains the address of the
    previous node in the list.

    2) The second part is called the information part, which contains the information
    of the node.

