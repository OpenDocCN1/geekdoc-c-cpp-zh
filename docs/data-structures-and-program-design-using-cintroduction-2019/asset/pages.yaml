  md: '# 3.10 Multidimensional Arrays/ N-Dimensional Arrays


    A multidimensional array is also known as an n-dimensional array. It is an array
    of arrays. It has n indices in which it justifies its name of n-dimensional array.
    An n-dimensional array is an m1, m2, X X, ... mn array, as it contains m1, m2,
    m3, ... X mn, elements. Multidimensional arrays are declared and initialized in
    the same way as one-dimensional and two-dimensional arrays.


    # 3.11 Calculating the Address of 3-D Arrays


    Just like 2-D arrays we can store 3-D arrays in two ways, Row Major Order and
    Column Major Order.


    +   Elements in Row Major Order

    Address ([i][j][k]) = Base Address (BA) + w (L1(L2(E1) + E2) + E3)


    +   Elements in Column Major Order

    Address ([i][j][k]) = Base Address (BA) + w ((E3 L2 + E2)L1 + E1))


    Where L is length of index, L = Upper bound – Lower bound + 1, E is effective
    address, E = i – Lower bound.


    # Frequently Asked Questions


    Q. Let us take a 3-D array A(4:12, -2:1, 8:14) and calculate the address of A(5,
    4, 9) using row major order and column major order where the base address is 500
    and w = 4.


    Answer.

    Length of three dimensions of A -


    ```

    L1 = 12 - 4 + 1 = 9

    L2 = 1 - (-2) + 1 = 4

    L3 = 14 - 8 = 6

    ```'
