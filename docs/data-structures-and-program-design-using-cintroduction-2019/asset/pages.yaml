    # Advantages and Disadvantages of Quadratic Probing


    As previously discussed, one of the biggest advantages of quadratic probing is
    that it eliminates the phenomenon of primary clustering. Yet one of the major
    disadvantages of this method is that a sequence of successive probes may only
    cover some portion of the hash table, and this portion may be small. Therefore,
    if such a situation occurs, then it will be difficult for us to find an empty
    location in the hash table, despite the fact that the table is not full. Hence,
    quadratic probing encounters a problem which is known as secondary clustering.
    In this method, the chance of multiple collisions increases as the hash table
    become. This type of situation can be overcome by double hashing.


    # Double Hashing


    Double hashing is one of the best methods for open addressing. As the name suggests,
    this method uses two hash functions to operate rather than a single hash function.
    The hash function is given as follows:


    ```

    h''(k) = (h1(k) + i h2(k)) mod m,

    ```


    where h1(k) = k mod m and h2(k) = k mod m are the two hash functions, m is the
    size of the hash table, m'' is less than m (can be (m - 1) or (m - 2)), and i
    is the probe number that varies from 0 to (m - 1).'
