    \ programmers to tell them exactly what to do.\n\n# Evaluating Expressions\n\n\
    When the computer solves the expression 10 + 5 and gets the value 15, we say the\
    \ computer has evaluated the expression. Evaluating an expression reduces the\
    \ expression to a single value, just like solving a math problem reduces the problem\
