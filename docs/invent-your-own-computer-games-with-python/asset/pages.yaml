  md: '# Chapter 8 - Sonar


    Sonar is a technology that ships use to locate objects under the sea. In this
    chapter''s game, the player places sonar devices at various places in the ocean
    to locate sunken treasure chests. The sonar devices in our game can tell the player
    how far away a treasure chest is from the sonar device, but not in direction.
    By placing multiple sonar devices down, the player can figure out exactly the
    treasure chest is. There are three chests to collect, but the player has only
    sixteen sonar devices to use to find them.


    Imagine that we could not see the treasure chest (the red dot) in the following
    picture. Because each sonar device can only find the distance but not direction,
    the possible places the treasure chest could be anywhere in a ring around the
    sonar device:


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_213_0.png)


    But if we have multiple sonar devices working together, we can narrow it down
    to an exact place where all the rings intersect each other:


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_213_1.png)'
