    # Game AI


    To be clear, we will label three types of spaces on the Tic Tac Toe board: corners,
    sides, and the center. Here is a chart of what each space is:


    | Corner | Side | Corner |

    |---|---|---|n| Side | Center | Side |

    | Corner | Side | Corner |


    The AI for this game will follow a simple algorithm. An algorithm is a series
    of instructions to compute something. Our Tic Tac Toe AI''s algorithm will determine
    which is the best place to move. Our algorithm will have the following steps:


    +   - First, see if there is a move the computer can make that will win the game.
    If there is, take that move. Otherwise, go to step 2.

    - See if there is a move the player can make that will cause the computer to lose
    the game. If there is'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'is, we should move there to block the player. Otherwise, go to step 3.

    3. Check if any of the corner spaces (spaces 1, 3, 7, or 9) are free. (We always
    want to take a corner piece instead of the center or a side piece.) If no piece
    is free, then go to step 4.

    4. Check if the center is free. If it so, move there. If it isn''t, then go to
    step 5.

    5. Move on any of the side pieces (spaces 2, 4, 6, or 8). There are no more steps,
    because if we have reached step 5 the side spaces are the only places left


    This all takes place in the "Get computer''s move." box on our flow chart. We
