    shell, the IDLE program sends that source code to the Python interpreter for translation.
    The interpreter translates it into machine code, and then the CPU understands
    how to run the program.


    Whew! That was a lot of information. As computers get faster and faster, they
    also become more and more complicated. To manage all of this complexity, programmers
    started to write programs that would help them write new programs! One of these
    is the Python interpreter that you are using. It is kind like using a stone axe
    to help build a hammer, and then a hammer to help build a electric drill and other
    power tools, and then using those power tools to build a large bulldozer.


    The reason I am explaining all of this is so that you understand that when you
