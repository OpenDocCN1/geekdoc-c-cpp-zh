  md: 'Do you remember how the * operator will combine two integer values and produce
    a new integer value (the product of the two original integers)? And do you also
    remember how the + operator can combine two strings and produce a new string value
    (the concatenation of the two original strings)? The and operator combines two
    boolean values to produce a new boolean value. Here''s how the and operator works.


    Think of the sentence, "Cats with whiskers and dogs have tails." This sentence
    is true, because "cats with whiskers" is true and "dogs have tails" is also true.


    But the sentence, "Cats have whiskers and dogs have wings" would be false. Even
    though "cats have whiskers" is true, do not have wings, so "dogs have wings" is
    false. The entire sentence is only true if both parts are true because the two
    parts are connected by the word "and." If one or both parts are false, then the
    entire sentence is false.


    The and operator in Python works this way. If the boolean values on both sides
    of the and are True, the expression with the and operator evaluates to True. If
    either of the boolean values are False, or both of the boolean values are False,
    then the expression evaluates to False.


    So let''s look at line 13:


    ```

    13. while cave != ''1'' and cave != ''2'':

