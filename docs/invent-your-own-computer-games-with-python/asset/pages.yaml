    # Some Other Escape Characters


    What if you really want to display a backslash? This line of code would not work:


    ```

    print ''He flew away in a green\teal helicopter.''

    ```


    That print statement would show up as:


    ```

    He flew away in a greenal helicopter

    ```


    This is because the " in "teal" was seen as an escape character since it came
    after a backslash. The escape character t pushes the Tab key on your keyboard.
    Escape characters are there so that strings can have characters that cannot be
    typed in.


    Instead, try this line:


    ```

    print ''He flew away in a green\\teal helicopter.''

    ```


    Here is a list of escape characters in Python:


    | Escape Characters |

    | \ | Backslash (\) |

    | \'' | Single quote (\'') |

    | \" | Double quote (")") |

    | \n | Newline |

    | \t | Tab |"


