    Four differently-cased names mean four different variables.


    We call this **case-sensitivity**. In the Python language, variable and function
    names are case-sensitive. If you try to call the RAW_INPUT() function instead
    of the raw_input() function, you will get an error because the computer doesn''t
    know of a function named RAW_INPUT() . It only knows a function named `raw_input()`
    .


    So remember that even though the computer doesn''t care what name you name your
    variables or how you capitalize them, be sure to always use the same capitalization.
    It is also a convention to never use two variables with the same name but different
    capitalization. If you use the variable favoriteFOOD to store the string of your
    favorite breakfast food and the variable FAVORITEfood to store your favorite dinner
    food, it is easy to forget which is which.


