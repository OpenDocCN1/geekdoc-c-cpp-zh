    # Percentages


    Percentages are a portion of a total amount, and range from 0% to 100%. If you
    had 100% of a pie, you would have the entire pie. If you had 0% of a pie, you
    wouldn''t have any pie at all. 50% of the pie would be half of the pie. A pie
    is a common image to use for percentages. In fact, there is a kind of chart called
    a pie chart which shows how much of the full total a certain portion is. Here
    is a pie chart with 10%, 15%, 25%, and 50% portions:


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_310_0.png)


    We can calculate the percentage with division. To get a percentage, divide the
    part you have by the total, and then multiply by one hundred. For example, if
    X won 50 out of 100 games, you would'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'calculate the expression 50 / 100.0, which would evaluate to 0.5. We multiply
    this by 100 to get a percentage (in this case, 50%).


    # Integer Division


    Did you notice that we divided 50 / 100.0, not 50 / 100? The reason behind this
    is that there are two types of division in the Python language. Regular division
    is done when at least one of the numbers in the division expression is a float
    data type, that is, a number that has a decimal point and then a certain fraction
    after it. Regular division will evaluate to another float value. (For example,
    50 / 100.0 evaluates to 0.5).


    However, if both numbers in the division expression are integers (that is, whole
    numbers without a decimal point), then Python will do integer division. Integer
    division is division of two integer numbers that evaluate to a rounded-down integer.


    For example, the expression 20 / 3.0 or the expression 20.0 / 3 will evaluate
    to 6.666666666666667. However, the expression 20 / 3 evaluates to the integer
    6, with a remainder of two. This is because twenty divided by three is six, with
    a remainder of two. In integer division, the remainder part is dropped.


    We want to use regular division when we calculate our percentages, because otherwise
    instead of a float value like 0.5, integer division for percentages will always
    evaluate to 0.


    # The round() Function


    The round() function will round a float number to the nearest whole number. Try
    typing the following into the interactive shell:


    ```

    round(10.0)

    round(10.2)

    round(8.7)

    round(4.5)

    round(3.5)

    round(3.4999)

    round(2.5422, 2)

    ```'
