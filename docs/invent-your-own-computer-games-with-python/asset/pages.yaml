  md: '# Brute Force


    That''s the Caesar Cipher. However, while this cipher may fool some people who
    don''t understand cryptography, it won''t keep a message secret from someone who
    knows cryptanalysis. While cryptography is the science of making codes, cryptanalysis
    is the study of breaking codes.


    Do you wish to encrypt or decrypt a message?

    encrypt

    Enter your message:

    The door key will be hidden under the mat until the fourth

    of July.

    Enter the key number (1-26)

    8

    Your translated text is:

    Bpm lwwz smg eqtt pqllmv cvlmz bpm uib cvbqt bpm nwczbp

    w Rctg.


    The whole point of cryptography is that so if someone gets their hands on the
    encrypted message, they cannot figure out the original unencrypted message from
    it. So we pretend to be the attacker and all we have is the encrypted text:


    ```

    Bpm lwwz smg eqtt pqllmv cvlmz bpm uib cvbqt bpm nwczbp

    w Rctg.

    ```


    One method of cryptanalysis is called brute force. Brute force is the technique
    of trying every single possible key. If the cryptanalyst knows the cipher uses
    (or at least guesses), they can go through every possible key. Because there are
    only 26 possible keys, it would be easy for a cryptanalyst to write a program
    that performs the decrypted ciphertext of possible key and see if any of the outputs
    make sense. Let''s add a brute force feature to our program.


