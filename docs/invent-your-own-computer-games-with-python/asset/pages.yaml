    # # What Exactly is Programming?


    If someone asked you, "What exactly is programming anyway? what could you say
    back to them? Programming is just the action of writing the code for programs,
    that is, creating programs that can be executed by a computer.


    "But exactly is a program?" When you see someone a computer program (for example,
    playing our Guess The Number), all you see some text appearing on the screen.
    The program decides what exact text to show on the screen (which is called the
    output), based on its instructions and on the text that the player typed on the
    keyboard (which is called the input). The program has very specific instructions
    on what to show the user. A program is a collection of instructions.


    "What kind of instructions?" There are only a few kind of instructions, really.


    +   - Expressions, are made up of values connected by operators. Expressions are
    all evaluated down to a single value, like 2 + 2 evaluates to 4 or ''Hello'' +
    '' '' + ''World'' evaluates to ''Hello World''. Function calls are also part of
    expressions because they evaluate a single value themselves, and this value can
    be connected by operators to other values. When expressions are next to the if
    and while keywords, we also call them conditions.

    - Assignment statements, which simply store values in variables so we can remember
    the values in our program.

    - if, while and break are flow control statements because they decide which execution
    is executed. The normal flow of execution for a program is to the start and execute
    each execution going down by one. But these flow control statements can cause
    the flow to skip instructions, loop over instructions, or break out of loops.
    Function calls also change the flow of execution by jumping to the start of a
    function.

    - The print statement, which displays text on the screen. Also, the raw_input
    () function can get text from the user through the keyboard. This called I/O (pronounced
    like the letters, "eye-oh"), because it deals with input and output of the program.


    And that''s, just those four things. Of course, there are many details about those
    four types of instructions. In this book you will learn about new data types and
    operators, new flow control statements besides if, while and break, and several
    new functions. There are also different types of I/O (input from the mouse or
    files on the hard drive, and outputting sound and graphics and pictures just like
    text.)


    For the person using your programs, they really care about that last type, I/O.
    The users on the keyboard and then sees things on the screen or hears things from
    the speakers. But for the computer to figure out what shows and what sounds to
    play, it needs a program, and programs are just a bunch of instructions that you,
    the programmer, have written.


