  md: '# Chapter 7 - Bagels


    Bagels is a simple game you can play with a friend. Your friend thinks up a random
    3-digit number, and you try to guess the number. After each guess, your friend
    gives you clues. If the friend tells you "bagels", then means that one of the
    three digits is in the secret number. If your friend tells you "pico", then one
    of the digits is in the secret number, but your guess has the digit in the wrong
    place. If your friend tells you "Fermi", then your guess has a correct digit in
    the correct place. Of course, even if you get a pico or fermi clue, you still
    don''t know which digit in your guess is the correct one.


    You can also get multiple clues after each guess. Say the secret number is 4556,
    and your guess is 5456. The clue you get will be "Fermi pico" because one digit
    is correct and in the correct place (the digit 6), and two digits are in the secret
    number in the wrong place (the digits 4 and 5).


