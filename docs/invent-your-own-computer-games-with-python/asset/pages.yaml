  md: 'This instruction (called an **assignment statement**) stores the value 15 in
    a variable named spam. Unlike expressions, **statements** are instructions that
    do not evaluate to any value, which is why there is no value that is displayed
    on the next line in the shell. However, this statement contains an expression.
    The value 15 by itself is an expression, which evaluates to 15.


    Variables store values, not expressions. If we had the statement, `spam = 10 +
    5`, then the expression `10 + 5` would first be evaluated down to 15. Then this
    value 15 would be the value stored in the variable, spam,


    You can think of the variable like a mailbox with the value 15 inside of it. The
    variable name "spam" is the label on the mailbox (so we can tell one mailbox from
    another) and the value stored in it is like a postcard inside the mailbox.


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_17_0.png)


    If we type **spam** into the shell by itself, it will show us what value is stored
    inside the variable.


    ```

    >>> spam = 15

    >>> spam

    15

    >>> |

    ```


    If we type `spam + 5` into the shell, this is the same as `15 + 5` because the
    value inside inside spam is 15.


    ```

    >>> spam = 15

    >>> spam + 5

    20

    >>> |

    ```


    spam + 5 is also an expression, just like `15 + 5` would be an expression. When
    you see a variable'
