    # Tips for Inventing Your Own Games


    Does it for this book as far as games go. The next chapter expands on creating
    new Reversi AIs, and having AIs play against each other instead of against a human
    player. Using the programming techniques in this book, you can start building
    your own games. Here are a few pointers:


    +   - Drawing out a flow chart before you writing code might help you remember
    everything you want to happen in your game.

    - Use the interactive shell to test what an expression or function call might
    evaluate to. The shell is a great way to experiment with different functions.

    - If something strange is happening when you run your program, adding some print
    statements in the middle of the code to print the values of different variables.
    You can use print statements to check if some functions are being called when
    you expect them too, or how often a loop is iterated.

    - If you ever find yourself writing identical code in several places of the program,
    see if you can put that code in a function and call that function several times.
    This way, if you want to change the code in the function, there is only one place
    you have to make changes.


