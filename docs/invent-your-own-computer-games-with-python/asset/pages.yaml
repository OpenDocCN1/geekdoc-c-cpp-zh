    But when you play your Tic Tac game and typing ''X'' in your move, this error
    doesn''t happen. The reason is because the loop''s condition is being short-circuited.


    Short-circuiting means that is because the expression on the left side of the
    or move not in ''1 2 3 4 5 6 7 8 9''.split() evaluates to True, the Python interpreter
    knows that the entire expression will evaluate to True no matter if the expression
