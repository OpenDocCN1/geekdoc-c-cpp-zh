  md: '# # Grids and Cartesian Coordinates


    A problem in many games is how to talk about exact points on the board. A common
    way of solving this is by marking each individual row and column on a board with
    a letter and a number. Here is a chess board that has each row and each column
    marked.


    | | a b c d e f g h |

    |---|---|---|---|---|---|---|---|-|

    | 8 | | | | | | | | |

    | 7 | | | | | | | | |

    | 6 | | | | | | | | |

    | 5 | | | | | | | | |

    | 4 | | | | | | | | |

    | 3 | | | | | | | | |

    | 2 | | | | | | | | |

    | 1 | | | | | | | | |


    In chess, the knight piece looks like a horse. The white knight is located at
    the point e, the black knight is located at point a. We can also say that every
    space on row 7 or every space in column c is empty.


    A grid with labeled rows and columns like the chess board is called a Cartesian
    coordinate system. By using a row label and column label, we can give a coordinate
    that is exactly one and only one space. This can really help us describe to a
    computer the exact location we want. If you usually have numbers for both the
    rows and columns. This is handy, because otherwise after the 26th column we would
    run out of letters. That board would look like this:'
  merge: -1
  pgno: 214
- img_proc: true
  md: '![](img/0ec7b2ca84b1d9fde876176e88584c95_215_0.png)


    The numbers going right and left that describe the columns are part of the X-axis.
    The numbers going up and down that describe the rows are part of the Y-axis. When
    we describe coordinates, we always say the X coordinate first, followed by the
    Y coordinate. That the white knight in the above picture is located at the coordinate
    5, 6. The black knight is located at the coordinate 1, 4.


    Notice that for the black knight to move to the white knight''s position, the
    black knight must move up two spaces, and then to the right by four spaces. (Or
    move right four spaces and then move up two spaces.) But we don''t need to look
    at the board to figure this out. If we know the white knight is located at 5,
    6 and the black knight is located at 1, 4, then we can use subtraction to figure
    out this information.


    Subtract the black knight''s X coordinate and white knight''s X coordinate: 5
    - 1 = 4. That means the black knight has to move along the X-axis by four spaces.


    Subtract the black knight''s Y coordinate and white knight''s Y coordinate: 6
    - 4 = 2. That means the black knight has to move along the Y-axis by two spaces.


    # # Negative Numbers


    Another concept that Cartesian coordinates uses negative numbers. **Negative numbers**
    are numbers that are smaller than zero. We put a minus sign in front of a number
    to show that it is a negative number. -1 is smaller than 0. -2 is smaller than
    -1. -3 is smaller than -2. If you think of regular numbers (called **positive
    numbers**) as starting from 1 and increasing, you can think of negative numbers
    as starting from -1 and decreasing. 0 itself is not positive or negative. In this
    picture, you see the positive numbers increasing to the right and the negative
    numbers decreasing to the left:'
  merge: -1
  pgno: 215
- img_proc: true
  md: '![](img/0ec7b2ca84b1d9fde876176e88584c95_216_0.png)


    The number line is really useful for doing subtraction and addition with negative
    numbers. The expression 4 + 3 can be thought of as the white knight starting at
    position 4 and moving 3 spaces over to the right (addition means increasing, which
    is in the right direction).


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_216_1.png)


    As you can see, the white knight ends up at position 7. This makes sense, because
    4 + 3 is 7.


    Subtraction can be done by moving the white knight to the left. Subtraction decreasing,
    which is in the left direction. 4 - 6 would be the white knight starting at position
    4 and moving 6 spaces to the left:


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_216_2.png)


    The white knight ends up at position -2. That means 4 - 6 equals -2.


    If we add or subtract a negative number, the white knight would move in the opposite
    direction. If you add a negative number, the knight moves to the left. If you
    subtract a negative number, the knight moves to the right. The expression -6 -
    -4 would be equal to -2. The knight starts at -6 and moves to the right by 4 spaces.
    Notice that -6 - -4 has the same answer as -6 + 4.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '![](img/0ec7b2ca84b1d9fde876176e88584c95_217_0.png)


    The number line is the same as the X-axis. If we made the number line go up and
    down instead of right, it would model the Y-axis. Adding a positive number (or
    subtracting a negative number) would move the knight up the number line, and subtracting
    a positive number (or adding a negative number) would move the knight down. When
    we put these two number lines together, we have a Cartesian coordinate system.


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_217_1.png)


    The 0, 0 coordinate has a special name, the **origin**.


    # # Changing the Signs


    Subtracting negative numbers or adding negative numbers seems easy when you have
    a number line in front of you, but it can be easy when you only have the numbers
    too. Here are three tricks you can use to make evaluating these expressions easier
    to do.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'The first is if you are adding a negative number, for example: 4 + -2. The
    first trick is "minus eats the plus sign on its left". When you see a minus sign
    with a plus sign on the left, you can replace the plus sign with a minus sign.
    The answer is still the same, because adding a negative value is the same as subtracting
    a positive value. 4 + -2 and 4 - 2 both evaluate to 2.


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_218_0.png)


    The second trick is if you are subtracting a negative number, for example, 4 -
    -2. The second trick is "two minuses combine into a plus". When you see the minus
    signs next to each other without a number in between them, they can combine into
    a plus sign. The answer is still the same, because subtracting a negative value
    is the same as adding a positive value.


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_218_1.png)


    A third trick is to remember that when you add two numbers like 6 and 4, it doesn''t
    matter what order they are in. (This is called the commutative property of addition.)
    That means that 6 + 4 and 4 + 6 both equal the same value, 10.


    ![](img/0ec7b2ca84b1d9fde876176e88584c95_218_2.png)


    Say you are adding a negative number and a positive number, -6 + 8. Because you
    are adding numbers, you can swap the order of the minuses without changing the
    answer. -6 + 8 is the same as 8 +'
