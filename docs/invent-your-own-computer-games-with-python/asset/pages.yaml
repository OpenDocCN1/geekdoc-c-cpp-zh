    ![](img/0ec7b2ca84b1d9fde876176e88584c95_267_1.png)


    As you can see, each player can quickly grab a majority of the tiles on the board.
    But the more tiles of one color there are, the more that can be taken by the opponent:'
  merge: -1
  pgno: 267
- img_proc: true
  md: '![](img/0ec7b2ca84b1d9fde876176e88584c95_268_0.png)


    Players must always make a move that captures at least one tile. The game ends
    when a player either cannot make a move, or the board is completely full. In most
    games, the board fills up to end the game. The player with the most tiles of their
    color wins.


    The basic strategy of Reversi is to look at which move would turn over the most
    tiles. But you should also consider a move that will not let your opponent recapture
    many tiles after your move. Placing a tile on the sides or, even better, the corners
    is good because there is less chance that those tiles will end up between your
    opponent''s tiles.


    The AI we for this game will simply look for any corner moves they can take. If
    there are no corner moves available, then the computer will select the move that
    claims the most tiles.


