  md: 'inside an expression, the value that is stored inside the variable is used
    when the computer evaluate the expression. But we can change which value is stored
    in the variable by typing in another assignment statement:


    ```

    >>> spam = 15

    >>> spam + 5

    20

    >>> spam = 3

    >>> spam + 5

    8

    >>> |

    ```


    Note that the first time we typed in spam + 5, the expression evaluated to 20.
    This is because we had stored the value 15 inside the variable spam. But then
    we stored the value 3 inside of spam. In programming, the old value of 15 was
    overwritten. Then, when we typed in spam + 5, that expression evaluates to 8.
    If the variable is a mailbox and the value is a postcard the mailbox can only
    hold one postcard at a time.


    We can also have expressions on the right side of the = sign. Python will evaluate
    this expression to get the final value, and store this value inside of the variable.
    If you ever want to know what the current value is inside of a variable, just
    type the variable name into the shell.


    ```

    >>> spam = 5 + 7

