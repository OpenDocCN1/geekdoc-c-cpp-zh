    In case you don''t know, Hangman is a game two people play with paper and pencil.
    One person thinks of a word, and then draws blanks for each letter in the secret
    word. The other person guesses letters that might be in the word. If they guess
    correctly, the first person writes the letter into the blank. If they guess wrong,
    the first person draws another body part of the hangman. If the second person
