  md: '# # A Note to Parents and Fellow Programmers


    I have many thanks for your interest and more apologies for this book''s deficiencies
    than I can enumerate. My motivation for writing this book comes from a gap I saw
    in today''s literature for kids interested in learning to program. I started programming
    when I was 9 years old in the BASIC language with a book similar to this one.
    During the course of writing this, I''ve realized how a modern language like Python
    has made programming easier and more capable. Python has a gentle learning curve
    while being a serious language that is used by programmers professionally.


    The current crop of programming books for kids that I fell seen into two categories.
    First, books that did not teach programming so much as "creation software" or
    in dumb down languages to make programming "easy". Second, they taught programming
    like a mathematics textbook: all principles and concepts with application left
    to the reader. This book takes a different approach: show the source code right
    up front and explain programming principles from the examples.


    My fellow programmers may notice that the games in this book all use console text,
    and also use a single stream of text rather than a console window system as the
    Unesco library provides. This is on purpose. Even though there are no graphics
    or sound, I think that the games are compelling enough in their own right. I think
    that game construction kits mask the true nature of programming. I have the perhaps
    outdated notion that games do not require fancy graphics to be fun.


    The list of things that this book also does not cover: graphics, sound, graphical
    user interfaces, debugging, file I/O, exceptions, networking, data structures
    such as stacks and queues, and object programming. After trudging through massively
    verbose manuals myself, I tried to strip this book down to its most concise form.
    These other concepts have been reserved for later books.


    I have also made this book available under the Creative Commons licence, which
    allows you to make copies and distribute this book (or excerpts) with my full
    permission, as long as attribution to me is left intact and it is used for noncommercial
    purposes. I view the last nine months of on and off effort in this book as my
    gift to world. Thank you for reading this.


    Al Sweigart

    al@coffeeghost.net


    The full text of this book is available in HTML or PDF format at:

    http://pythonbook.coffeeghost.net'
  merge: -1
