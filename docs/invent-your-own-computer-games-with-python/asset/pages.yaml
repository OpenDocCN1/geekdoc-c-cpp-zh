    square brackets [ and ]. We use curly braces to type out a dictionary in Python.
    The values between them are key-value pairs. The keys are the things on the left
    of the colon and the values are on the right of the colon. You can access the
    values (which are like items in lists) in the dictionary by using the key (which
    are indices in lists). Try typing into the shell stuff[''hello''] and stuff[''chat'']
    and stuff[''goodbye'']


    ```

    >>> stuff = {''hello'':''Hello there, how are you?'', ''chat'':''How is the weather?'',
    ''goodbye'':''It was nice talking to you!''}

    >>> stuff[''hello'']

    Hello there, how are you?

    >>> stuff[''chat'']

    How is the weather?

    >>> stuff[''goodbye'']

    It was nice talking to you!

    >>

    ```


    You see, instead of putting an integer index in the square brackets, you put a
    key string index. This will evaluate to the value for that key. You can get the
    size (that is, how many key-value pairs in the'
