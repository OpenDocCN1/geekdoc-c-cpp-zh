    called strings. We can store strings inside variables just like we can store number
    values inside variables. When we type strings, we put them in between two single
    quotes. Typing spam = ''hello'' into the shell:


    ```

    >>> spam = ''hello''

    >>> |

    ```


    The single quotes are not part of the string, they just tell the computer where
    the string begins and ends. If you type spam into the shell to display the contents
    of spam, it will display the ''hello'' string.


    ```

    >>> spam = ''hello''

    >>> spam

    ''hello''

    >>> |

    ```


    Strings can have any sort of character or sign in them. Strings can have spaces
    and numbers as well. These are all strings:


