  md: '# # Chapter 3 - Jokes


    # ## How Programs Run on Computers


    Now we will write a program to tell jokes to the user. Before we go into the code,
    you should know how your programs run on the computer.


    The computer you use runs a very large program, called an **operating system**.
    Your operating system (called an OS (pronounced like the letters, "oh-ess") for
    short) may be Windows, MacOS, Linux or another one. The OS is a program that runs
    other programs called **applications** like a web browser, word processor, email
    client, or computer games. The OS makes it easy for programmers to write applications
    and games that can run on computers made of different hardware.


    **Hardware** includes the parts of the computer that you can touch (the monitor,
    or the keyboard and mouse, or a printer). *Software* is another name for programs
    or applications or games that run on the computer. Think of the computer as if
    it were a book. The book''s hardware would be the cover and paper pages and even
    the ink (the pages you can touch.) The book''s software would be the story and
    characters that describe the book. Using written or playing games that were made
    by someone else is like reading a book of stories written by another person. But
    writing software (such as your own games) is like writing your stories.


    It would be difficult for programmers to make their programs run on several different
    pieces of hardware. For example, when you write your games, you don''t need to
    know how to make text appear on all the monitors made by all the different companies
    in the world. Your program just has a print statement, which tells the OS to figure
    out how to make it appear on the monitor no matter brand or type of monitor the
    user has.


    The OS makes running programs easy on us, but it only knows a language called
    **machine code**. Machine code has very, very basic instructions that are simple
    enough for computer''s main microchip (called the **CPU (Central Processing Unit)**)
    to understand. Writing programs in the machine code language is long and boring.


    Machine code is written in zeros and ones and looks like pages of this: 1010101
    00110001100000. These instructions aren''t easy for humans to work with. **Assembly**
    gives instructions like MOV, JMP, PUSH, or XOR. This makes writing the instructions
    easier but putting them together in a program is still long and complicated.


    This is where **high-level programming languages** come in. High-level languages
    include Python, Java, C++, Perl, Basic, and many others. These languages take
    care of the details of machine code. A programmer writes her program in a higher-level
    language like Python, and then a program called the *interpreter* translates this
    language into machine code that the computer executes. Even though our "Hello!"
    program was just one line long when written in Python, in machine code it would
    be several hundred or a few thousand lines.


    The interpreter is the program you downloaded from http://www.python.org and installed
    in chapter one. That download also included a program called IDLE, which is the
    program you type your code into.'
