    >>> cheese = spam

    >>> spam = 100

    >>> spam

    100

    >> cheese

    42

    >>> |

    ```


    This makes sense from what we know so far. We assign the spam variable, then we
    copy the value in spam and assign it to the variable cheese. When we later change
    the value in spam to 100, this doesn''t affect the value in cheese.


    But lists don''t work this way. When you assign a list to a variable with the
    = sign, you are actually assigning a reference to the list. A reference is a pointer
    to some bit of data. When you assign a list variable to a second variable, you
    are copying the reference and not the list itself. This is because the first variable
    doesn''t contain a list; it contains a reference to a list.


    Here is some code that will make this easier to understand. Type this into the
    shell:


