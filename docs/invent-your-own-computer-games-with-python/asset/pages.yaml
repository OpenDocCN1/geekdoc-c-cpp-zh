    the blank string, ''''. The blank string does not equal the string ''1'', so the
    left side evaluates to True. The blank string does not equal the string ''2'',
    so the right side evaluates to True. The condition then turns to True and True.
    Because both boolean values are True, the condition finally evaluates to True
    and because the while statement''s condition is True, the program enters the while-loop.


    This is all done by the Python interpreter, but it is important to understand
    how the interpreter does this. Picture shows the steps of how the interpreter
    evaluates the condition (if the value of cave is the blank string):


