    # The chr ( ) and ord () Functions


    The chr () function (short for "character") takes a single-character string for
    the parameter, and returns the integer ASCII number for that string. The ord ()
    function (short for "ordinal") takes an integer for the parameter, and returns
    the ASCII for that string. Try typing the following into the interactive shell:


