    We''ll have the computer solve some math problems for us. In programming (and
    in mathematics), whole numbers are called integers. Integers are whole numbers
    like 4 and 99 and 0. Numbers with fractions or decimal points are not integers.
    The numbers 3.5 and 42.1 and 5.0 are not integers. In Python, the number 5 is
    an integer but if we wrote it as 5.0 it would not be an integer. Numbers with
    the decimal point are called floating point numbers.


    Try typing some of these math problems into the shell. Remember to press the Enter
    key after typing one in.


