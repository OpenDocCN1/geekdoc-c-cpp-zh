    12

    >>> |

    ```


    Remember, in expressions, the variable acts as a name for a value. We can use
    the variable as many times as we want. Look at this example:


    ```

    >>> spam = 15

    >>> spam + spam

    30

    >>> spam - spam

    0

    >>> |

    ```


    When the variable has the integer value 15 stored in it, then spam + spam is the
    same as 15 + 15. This is why spam + spam evaluates to 30. And spam spam is the
    same as 15 - 15, which evaluates to 0.


