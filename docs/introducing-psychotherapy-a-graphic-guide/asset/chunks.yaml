    # 心理学通用教材与导论


    Atkinson 等人，*希尔加德心理学导* (Harcourt Brace, 1996)：一本适用于本科生的标准美国教材。


    Benson, N.C.，*心理学简介* (Icon Books, 1989)：一份独特的插图心理学大纲，包含了一些主要的疗法。


    Cardwell, Mike 等，*心理学* (Collins Educational, 1997)：一本适用于 A 水平（Advanced-level）学生的标准英国教材。


    Gross, R. 等，*心理学：新导论* (Hodder and Stoughton, 2000) 和 *心理学：心理与行为的科学* (Hodder and
    Stoughton, 2001)：这两本都是英国心理学的“圣经”，主要针对高级水平学生。Richard Gross 的所有著作都经过了充分的研究。


    Stratton, P. 和 Hayes, N.，《心理学学生字典》 (Edward Arnold, 1993)：一份实用的基础定义汇编。


    ## 心理治疗书籍，包括咨询


    Gross, R. 和 Mcllveen, R.，《异常行为的治疗方法》 (1999)：对心理治疗的优秀总结，更多针对高级水平课程。


    Nelson-Jones, Richard，《咨询与治疗的理论与实践》 (Continuum, 2001)：一本特别适合那些培训成为咨询师的人的良好教材。


    Palmer, Stephen，《咨询与心理治疗导论》 (Sage Publications, 2000)：另一本良好的培训书籍。


    读者文选，《大脑力量：治愈的大脑》 (Reader’s Digest London, 2002)：一部引人入胜的文章集，包含各种心理疗法。


    Schapira, Sylvie，《选择咨询或心理治疗培训》 (Routledge, 2000)：潜在心理治疗师的一个非常实用的起点。


    Stewart, W.，《咨询理论与实践 A-Z 词典》 (Stanley Thornes Ltd., 1997)：一份实用的字典式咨询总结。


    ## 补充疗法相关书籍


    Farquharson, Marie，《补充疗法》 (HarperCollins Publishers, 2001)：一本非常推荐的补充疗法口袋书级总结。


    Holford, Patrick，《最佳营养工作手册》 (Ion Press, 1992)：饮食疗法的良好范例。


    ## 来源书籍：核心作者的重要著作选


    Beck, A.，《爱是不够的》 (1988)


    Berne, Eric，《人际游戏》 (Penguin, 1964)


    Freud, S.，《梦的解析》 [1900] (Penguin, 1976)


    *日常生活心理病学* [1901] (Hogarth Press, 1960)


    Ellis, Albert 等，《压力咨询》 (Cassell, 1997)


    Laing, R.D.，《家庭政治学》 (Pelican, 1969)


    McDermott, I. 和 O’Connor, J.，《NLP 与健康》 (Thorsons, 1996)


    Maslow, A.H.，《走向存在心理学》 (Wan Nostrand, 1962)


    Perls, F.S.，《格式塔疗法与治疗的见证者》 (Bantam, 1973)


    Rogers, C.R.，《相遇团体》 (Penguin, 1970)


    *以人为中心的咨询* (Sage, 1998)


    Sartre, Jean-Paul，《存在主义即人文主义》 (Methuen, 1948)


    Storr, Anthony，《丘吉尔黑狗》 (HarperCollins Publishers, 1988)


    ## 来源期刊


    英国心理学学会，“心理学家行为准则”，“英国心理学学会公报》，第 38 卷，1985 年，第 41-3 页：一份权威的伦理准则，心理治疗师及所有心理学家均应使用。


    Eysenck, Hans，“心理治疗的效果：评估”，“咨询心理杂志》，第 16 卷，第 319-24 页：关于心理治疗相对有效性的经典文章。


    ## 自传与致谢


    **Nigel** C. **Benson** 是一位学家，Icon Books 出版的国际畅销书《心理学简介》(1999) 的作者。他曾参与过读者文选《大脑力量》(2002)
    系列，包括《治愈的大脑》、《良好的记忆》以及《意识与无意识的大脑》。他是英国作家协会的成员。


    感谢所有提供帮助的人，特别是 Nash Popovic 博士和 Kay Skidmore。特别感谢 Richard Gross 和 Marie Farquharson
    的优秀著作。（详见对页内容。）


    **Borin Van Loon** 是一位超现实主义画家、作家和漫画创作者/拼贴画家。这是他为 Icon Books 编写的第十一“简介”系列书籍。他可能需要治疗。[www.borinvanloon.co.uk](http://www.borinvanloon.co.uk)


