    But I did agree with Freud that mental disorders are caused by unconscious conflicts.
    And he did use dream analysis – although the emphasis was on relating dreams to
    current problem rather than past experiences.


    Perls did not advocate any set rules for Gestalt therapy. But other techniques
    he used included helping clients achieve self-awareness of what they really feel
    or want by asking challenging questions. “Directed experiments” was Perls’ term
    for a range of techniques which could be used individually or in groups, such
    as `role-playing`, `dialogue` and `first-person speaking.`


    ## Role-playing and Dialogue


    `Role-playing` gets the client to act out “what it’s like” to be another person
    or be in another situation. Using `dialogue` (which may or may not be role-played),
    the client is asked to consider opposite sides of an argument.


    ![image](images/pg108-1.jpg)


    For example, the therapist may set up two chairs and ask the client to sit alternately
    in each one while taking the two sides of a conflict ... But step-mother, I would
    like to go to the Prince’s Ball tonight ...


    ![image](images/pg108-2.jpg)


    Scapegrace! You’ll stay here and clean the scullery!


    By acting out a situation, the client is encouraged to complete “unfinished business”
    and express feelings that may have been repressed for many years. Unlike Rogerian
    therapy, the Gestalt therapist may become actively involved in the role-playing
    or dialogue – challenging the parts spoken and acted by the client.


    ## Amplification


    In this Gestalt “experiment”, the client is asked to exaggerate a feeling or behaviour
    in order to appreciate better what is going on.


    ![image](images/pg109.jpg)


    For example, if clients refuse to act responsibly, then he or she may be asked
    to amplify his or her childish behaviour ... I’m not doing it! You can’t make
    me do it! I’ll scream and scream and scream until I’m sick! ... I can, you know.


    ## First-person Speaking


    CLIENT (BEFORE):


    ![image](images/pg110-1.jpg)


    Some people are often afraid of showing interest in others, for fear of being
    rejected. Instead of saying something significant like this in a detached “third-person”
    way, the client is asked to speak directly about themselves.


    CLIENT (AFTER):


    ![image](images/pg110-2.jpg)


    I am often afraid of showing interest in others, because I’m afraid I might be
    rejected!


    By rephrasing thoughts and feelings into the first-person, clients are more likely
    to become aware of their own particular problems and ways of dealing with them.


    ## Gestalt Therapy’s “Rules for Clients”


    ![image](images/pg111-1.jpg)


    Live here and now! ... concern yourself with what you have rather than what’s
    absent, and with the present rather than the past.


    ![image](images/pg111-2.jpg)


    Stop unnecessary imaginings and thoughts!


    ![image](images/pg111-3.jpg)


    ... don’t worry about the endless possibilities of what might or might not happen.


    ![image](images/pg112-1.jpg)


    Don’t try to force other or manipulate them! ... express yourself clearly and
    straightforwardly, rather than imposing your explanations, justifications and
    judgements on other people.


    ![image](images/pg112-2.jpg)


    Be aware!


    ![image](images/pg112-3.jpg)


    ... do not restrict your awareness of what is happening to you and going on around
    you – including awareness of pain, as well as pleasure.


    ![image](images/pg113-1.jpg)


    Accept your responsibilities! ... don’t blame others for your actions, and decide
    for yourself what you ought to do – don’t unthinkingly follow other people’s rules.


    ![image](images/pg113-2.jpg)


    ...and finally ... Be yourself!


    ![image](images/pg113-3.jpg)


    ...don’t try to be “someone else” or be what other want for their convenience.


    These last two “rules” – accepting your responsibilities and being yourself –
    are also central to another therapeutic approach based on the philosophical ideas
    of Existentialism ...


    ## Existential Therapy


    Existential therapy doesn’t fit neatly into any of the main approaches but is
    included here as a broadly humanistic approach which emphasizes individual existence.
    Existential therapy is founded on the Existentialists’ “analysis of everyday life”,
    particularly that of French philosopher `Jean-Paul Sartre` (1905-80) for whom
    personal decision-making is crucial in a world that has no meaning other than
    that you create. It is a basis for the work of key humanistic psychologists, such
    as `Rollo May` (1909-94).


    ![image](images/pg114-1.jpg)


    This is humanism, because we remind man there is no legislator but himself; that
    he himself, thus abandoned, must decide for himself. * Most people’s problems
    are now loneliness, isolations and alienation.


    (*From Existentialism is a Humanism, 1948


    ![image](images/pg114-2.jpg)


    Ah oui, Hippolyte. I feel ze ennui of ze entire century on ze shoulders of my
    philosophie ...


    ## Existential Therapists


    Existential therapists, not surprisingly, tend to be highly individualistic and
    can differ greatly in their interests and approaches to psychotherapy. Some key
    writers and practitioners are: Ludwig Binswanger, M. Boss, Victor Frankl, R.D.
    Laing, Rollo May and Irvin Yalom.


    `R.D. Laing` (1927-89) in Britain was part of an `anti-psychiatry` movement in
    the 1960s and was particularly critical about the way the medical profession labelled
    and treated “schizophrenics”.


    ![image](images/pg115-1.jpg)


    Kiss me R. D. He argued that it is often the schizophrenic’s family which is irrational
    ... And, ultimately Western societies viewed objectively are not exactly rational...


    ![image](images/pg115-2.jpg)


    Observations on the behaviour of animals in captivity tell us nothing reliable
    about their behaviour in their nature setting. The whole of our present civilization
    may be a captivity. *


    (*From *The Politics of the Family*, 1969)


    ## The Goals of Existential Therapy


    Therapy can be conducted individually or in groups. Existential therapists discuss
    and confront clients about how they *experience* life (rather than being concerned
    with “diagnoses and cures”). The main goals are to help people ...


    ![image](images/common.jpg) take responsibility for their own being in the world


    ![image](images/common.jpg) become independent and self-governing


    ![image](images/common.jpg) exercise conscious intention


    ![image](images/common.jpg) make ethical choices


    ![image](images/common.jpg) confront anxiety that is a normal and unavoidable
    aspect of being human


    ![image](images/common.jpg) move beyond self into full fellowship with others


    ![image](images/common.jpg) engage in loving relationships.


    ![image](images/pg116-1.jpg)![image](images/pg116-2.jpg)


    The ability to form and maintain mutually relationship is important to most people.
    Some therapies have been developed that directly involve groups as a central aspect
    of the treatment ...


    ## Group Therapy


    The concept of treating people in groups rather than individually – encouraging
    group members directly to help each other – was developed mostly by humanistic
    therapists, especially Carl Rogers. Group therapy can also be conducted using
    any of the main approaches described so far. Psychodynamic therapy, for example,
    includes the group techniques of `psychodrama` and `transactional analysis`, while
    humanistic therapy includes `encounter groups` and `sensitivity training.`


    ### Psychodrama


    `psychodrama` was invented by the psychoanalyst Moreno in 1946 to help people
    resolve the conflicts that cause them anxiety.


    ![image](images/pg117-1.jpg)


    Each person in the group takes on a role or auxiliary ego with whom the central
    character or protagonist has to improvise. For example, a person who has problems
    with an authority figure may act out a childhood scene with family members...


    ![image](images/pg117-2.jpg)


    You’re my father, why are you hitting me? It’s for your own good, my son!


    ## Variations within Psychodrama


    `role-reversal` – actors swap roles.


    `doubling` – two people act out the same role.

