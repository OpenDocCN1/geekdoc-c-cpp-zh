    Since I am not perfect at everything I do ... I must be worthless! I must get
    approval and love from everyone I meet!


    Since these attitudes make impossible demands on the people who hold onto them,
    they cause a sense of failure, anxiety and problem behaviour.


    ![image](images/pg85-2.jpg)


    ## Other Common Irrational Beliefs


    ![image](images/pg86.jpg)


    Whenever something bad happens, I can’t stop thinking about it. Once something
    has strongly affected me, I can’t do anything about it. I just can’t face responsibilities
    ... it’s easier to avoid difficulties. I always need to depend on someone stronger
    to help me.


    ![image](images/pg87.jpg)


    I can never do things on my own. I’m always made unhappy by other people ... I
    can’t control my emotions. I think all those people who upset me are very bad
    ... and should be punished for upsetting me. I’m very upset everything is not
    the way I want it to be ... why can’t everything be perfect?


    ## The Role of the REB Therapist


    ![image](images/pg88.jpg)


    The REB therapist is an exposing and nonsense-annihilating scientist! People have
    the capacity for rational understanding and the resources for personal growth.
    Damn!


    The REB therapist, according to Ellis, is therefore very active (compared to a
    psychoanalyst) in challenging clients to recognize, analyse and answer questions
    about their irrational beliefs - and in helping them to substitute rational and
    realistic alternatives.


    For example:


    Irrational belief:


    *I must be perfect at everything I do.*


    Rational belief:


    *I must be realistic and accept that not everything will be perfect.*


    Irrational belief:


    *I must get constant love and approval from everyone.*


    Rational belief:


    *I would like some love and approval, but I do not always need it.*


    ## The Aims and Successes of Rebt


    The other main difference between REBT and traditional psychoanalysis is that
    the latter gets bogged down in delving into the past, whereas REBT is about the
    here and now.


    ![image](images/pg89.jpg)


    REB therapists do not spend a great deal of time encouraging long, indulgent tales
    of woe. REBT aims to help clients get better, rather than just feel better during
    a session. REBT helps clients to accept reality, even when it is pretty grim.


    All this is provided in a warm, supportive and caring way. REBT can be of help
    to people with depressive illnesses, self-esteem problems, etc. However, it tends
    to be less effective for other disorders, such as some phobias (e.g. agoraphobia)
    and ineffective with those experiencing severe thought disorders (e.g. schizophrenia).
    Also, some clients find the argumentative and challenging approach of REB therapists
    to be too difficult to cope with. But there are alternative cognitive approaches
    …


    ## Cognitive Restructuring Therapy


    Cognitive Restructuring Therapy (CRT) was developed in the 1960s by Aaron Beck
    who, like Ellis, originally trained as a psychoanalyst. CRT is also based on the
    idea that disorders are maladaptive behaviours caused by sets of irrational beliefs.
    Beck was particularly concerned with treating depression, which he saw as emotional
    difficulties caused by faulty thinking - especially incorrect habits of processing
    and interpreting information.


    ![image](images/pg90-1.jpg)


    An individual’s emotional response to an event or experience is determined by...
    ... the conscious meaning placed on it.


    For example, imagine you are home alone one night and you hear a crash inside
    the house. How do you interpret this and how would you feel?


    ![image](images/pg90-2.jpg)


    I would think there is a burglar and feel very afraid or angry. I would think
    perhaps something has accidentally fallen. I wouldn’t be afraid but might feel
    sad if something valuable had broken.


    ## Beck’s Triad Model


    Beck says childhood and adolescent experiences (e.g. criticisms from parents or
    teachers) can lead to the development of depression through a cognitive triad
    that has three interlocking negative beliefs – about the self, the world (past
    and present) and the future. These can create a constricted and distorted outlook
    on life.


    ![image](images/pg91.jpg)


    The triad can lead people to magnify bad, and minimize good, experience. Examples
    of negative views in the cognitive triad... I am worthless unlovable, helpless
    and unable to be happy. Life has been, and still is too demanding. There are too
    many obstacles. There is little hope. Thing are unlikely to improve.


    ## Goals of Cognitive Restructuring


    CRT teaches clients adaptive metacognition – i.e. “how to think about their thinking”.
    This enables clients to correct faulty thoughts and develop new sets of beliefs,
    or schemas, and their own ways of coping.


    ![image](images/pg92.jpg)


    The therapy initially addresses symptom relief, but its goals are to remove systematic
    biases in thinking and modify the core beliefs that predisposed the person to
    future distress. Ultimately, the goal of CRT is to enable each client to become
    their own therapist!


    In practice, this is achieved by ...


    ![image](images/pg93.jpg)


    ## Treatment Using CRT


    Although CRT is mainly used to treat depression, it can be used with some clients
    for the treatment of phobias, eating disorders and anxiety.


    Here is an example of an extract from anxiety treatment. A client complains of
    being very anxious about possible failure at work. The cognitive-restructuring
    therapist asks questions ...


    ![image](images/pg94.jpg)


    What exactly are you afraid of? ... Even if you make a fool of yourself, why is
    that bad? Even if they try to ridicule you, will you die from it? ... Is your
    family going to disown you?


    ![image](images/pg95.jpg)


    If you really mess up, are they to take out and shoot you? Is failure a catastrophe?
    Isn’t failure something to be acknowledged as just that, and something to learn
    from? ... Didn’t Edison “fail” hundreds of times before making a workable light
    bulb?


    The client is therefore encouraged by the therapist to look ahead with a more
    positive approach and overcome the fear of failure.


    ## Attributional Therapy


    attributional therapy is a more recent cognitive approach to treating depression.
    It takes its name from the ways people attribute the causes of events. In most
    people, there is a self-serving bias that tends to attribute successes to internal
    factors but failures to external ones. Depressed clients tend to do the opposite:
    blaming failures on internal causes, while attributing successes to external causes
    beyond their control.


    ![image](images/pg96.jpg)


    I failed that exam because of my own laziness and stupidity ... But I passed the
    other exam because it was easy – anybody could have done it! Attributional therapists
    help clients to break this vicious circle.


    ## Changing Attributions


    Dep people often have low self-esteem reinforced by their biased attributions
    of success and failure. Therapists train such clients to view their successes
    as results of their own efforts and abilities, and at the same time perceive at
    least some failures as being due to outside influences beyond their control. Changing
    attributions usually leads to increased self-esteem, more confidence and improved
    performance. A practical way of applying attributional therapy is for clients
    to do additional “homework exercises”.


    ![image](images/pg97-1.jpg)


    They have to write down in a daily journal what each day’s positive events have
    been and what they actively did to achieve them.


    ![image](images/pg97-2.jpg)


    Today I successfully got out of bed, washed, dressed and wrote ten pages of my
    book ...


    One important advantage of this approach is that significant beneficial changes
    to mood and behaviour have been found after only a few sessions.


    ## Stress Inoculation Therapy (SIT) (or Self-Instruction Training)

