    In choosing a complementary practitioner, it is always advisable to check their
    professional qualifications and inform your doctor beforehand. My approach to
    treatment is holistic – from the Greek for “whole” – taking into account your
    emotional, mental, social and spiritual life.


    There is no standard classification system for complementary therapies. So here,
    for convenience, they are grouped under the following seven headings: (i) Physical,
    (ii) Relaxation, (iii) Dietary, (iv) Energy, (v) Faith, (vi) Creativity, and (vii)
    Self-help.


    ## Physical Therapies


    These complementary therapies are based on manipulation – such as massage and
    posture – but can include other such physical exercises as breathing. An example
    is the `Alexander technique`, invented by the actor `Frederick Matthias Alexander`
    (1869-1955) in the late 19th century, after he had problems projecting his voice
    during performances.


    ![image](images/pg128-1.jpg)


    I found that a natural stress-free posture is important for good physical and
    mental health. So I developed my system for re-training people in sitting, standing
    and walking.


    ![image](images/pg128-2.jpg)


    The `Alexander technique` can help with stress, anxiety and depression, as well
    as back pain, etc. Ooh, my aching back!


    `Aromatherapy` began with Ancient Egyptian use of aromatic plants for cosmetics
    and embalming. Hippocrates advocated using aromatic essences in baths and scented
    massage. Over the centuries, various sweet-smelling substances have been used
    to ward off evil spirits and infections, such as the plague. Modem aromatherapy
    was developed in the 1930s by three French nationals – chemist René-Maurice Gattefosse,
    army surgeon Dr Jean Valnet, and Madame Marguerite Maury – who created a holistic
    system that matched essential oils to individuals rather than symptoms.


    ![image](images/pg129.jpg)


    Essential oils are extracted from the seeds, roots, bark, leaves or flowers of
    plants. An aramatherapist will massage these oils into the body... The oils will
    enter your skin, improving your emotional wellbeing.


    `Chiropractic therapy` derives from the Greek words `kheir` meaning “hand” and
    `praktikos`, meaning “to use”. The modern manipulative techniques were developed
    in 1895 by the Canadian Daniel D. Palmer, who first cured a janitor of deafness
    caused by an old back injury. Chiropractors believe the spine is the key to health.


    ![image](images/pg130.jpg)


    So Chiropractors manipulate the bones in the spine and elsewhere in order to treat
    a range of problems, e.g. headaches, migraines, asthma, indigestion. I can hear!
    Any misalignments of the spine can affect the whole body.


    Variations on chiropractic therapy include `Hellerwork` developed by the American
    Joseph Heller in 1978, the `McTimoney therapy` developed by the British chiropractor
    John McTimoney, and `Rolfing` developed by the American biochemist Dr Ida P. Rolf
    in the 1930s.


    `Light therapy` literally involves using either natural daylight or light from
    special bulbs to help a person feel better. The Ancient Egyptians, Greeks, Romans
    and Arabs all wrote about the healing power of sunlight...


    ![image](images/pg131-1.jpg)


    Have you noticed? ... You rarely come across a depressed person in the desert
    ...


    ![image](images/pg131-2.jpg)


    Lovely day again ...


    The Danish doctor Niels Finsen won the Nobel Prize in Medicine (1903) for applying
    ultraviolet light (an invisible component of sunlight) to treat tuberculosis.
    Today it is recognized that sunlight triggers the production of vitamin D in the
    skin and is also important for regulating our “biological clock” through the production
    of melatonin in the brain. Light therapy, especially in the form of “light boxes”,
    is used to treat people suffering from depression caused by a lack of daylight
    – commonly called Seasonal Affective Disorder (SAD).


    `Massage` – or physical manipulation – by rubbing the client’s body with the palms
    and fingers, is one of the oldest physical therapies in the world. It was very
    popular with the Ancient Greeks and Romans. In the 19th century, the Swedish gymnast
    Per Henrik Ling developed what is now generally known as “Swedish massage”. The
    Austrian psychoanalyst `Wilhelm Reich` (1897-1957) believed massage could directly
    affect repressed emotions that result in neurotic “character armour”.


    ![image](images/pg132.jpg)


    Massage can release pent-up anger held in the body – and free it up for life-restoring
    orgasms which can safeguard us from cancer!


    Whether or not the Reichian interpretation is used, all practitioners argue that
    massage can benefit clients psychologically, and many claim it can specifically
    help with anxiety, depression, insomnia and stress-related conditions.


    `Osteopathy` was developed by the American `Dr Andrew Taylor Still` (1828-1917)
    in 1874, based on the theory that illnesses are the result of harmful changes
    made to the natural healthy design of the body through injuries, bad posture and
    harmful tensions caused by emotions. Osteopaths manipulate any parts of the body
    that may be causing strains – whether the skeleton, muscles, ligaments or other
    connective tissue – to assist the body in healing itself.


    ![image](images/pg133.jpg)


    There, that’s fixed it. You may feel a bit stiff for a few days but after that
    you’ll be fine.


    Ach! Is this therapy expensive?


    No, it’s complimentary[*](#chapter_001.html_f001)


    ([*](#chapter_001.html_f_001) irony)


    ## Other Mainly Physical Therapies


    - `Applied kinesiology`: muscular diagnosis and treatments developed by George
    J. Goodheart, 1964.

    - `Bioenergetics`: exercises similar to T’ai chi and Pilates developed by Alexander
    Lowen in 1960s.

    - `Bowen technique`: a gentle, non-invasive massage and other touching that works
    on the connective tissues of the body, developed by Tom Bowen in 1970s.

    - `Buteyko`: named after a Russian scientist (1950s) who believed that to be healthy
    you need to breathe properly.

    - `Eye Desensitization and Reprocessing therapy (EMDR)`: clients eye movements
    are trained to reduce negative memories and thoughts, as developed by Dr Francine
    Shapiro in 1980s. Similar to some Neurolinguistic Programming.

    - `Feldenkrais`: named after the Russian judo expert who studied body posture
    and movement to heal sports injuries.

    - `Flotation therapy`: clients float in a dark, sound-proofed tank of water, developed
    by American John C. Lilly. Floating while deprived of visual and auditory stimuli
    can promote relaxation and is claimed to trigger the production of endorphins
    (natural painkillers).

    - `Trager approach`: developed in 1930s by Dr Milton Trager, who believed illness
    is caused by bad posture. Treatment consists of manipulating the muscles and joints,
    and other exercises, in order to regain youthful suppleness.

    - `Zero balancing`: a combination of Western and Eastern approaches, developed
    by Fritz Smith in the USA (1970s). Practitioners manipulate the lower back, legs
    and feet, then upper back and neck.


    ![image](images/pg134.jpg)


    I feel better already.


    ## Relaxation Therapies


    `ogenic training` uses mental exercises to achieve deep relaxation. It was developed
    in the 1920s by the German psychiatrist `Johannes Schultz` (1884-1970), who coined
    the term “autogenic” – meaning “generated from within”.


    ![image](images/pg135-1.jpg)


    You suggest to yourself ways of relaxing, in order to relieve stress.


    `Biofeedback` uses electrical measuring equipment – for example, a heartbeat monitor
    – to provide information (“feedback”) to clients about their own bodies.


    ![image](images/pg135-2.jpg)


    By listening to, or watching, such information – in the form of flashing lights
    or sound bleeps – most individuals find they can eventually learn to control certain
    body function – reducing heart-rate, lowering blood pressure and relaxing muscle
    tension.

