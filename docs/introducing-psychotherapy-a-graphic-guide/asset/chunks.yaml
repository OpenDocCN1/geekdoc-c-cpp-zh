- fmt: '

    Freud used hypnosis in the earliest 1890s part of his career as a therapist. The
    deep state of relaxation produced by hypnosis seemed to allow expression of unconscious
    thoughts and feelings that the patient was previously unaware of. But Freud soon
    largely abandoned hypnosis because some of his patients vehemently denied what
    had been revealed.


    ![image](images/pg62.jpg)


    It is not producing accurate enough information. Some hypnotic revelations seem
    based on pure fantasy or are severely distorted by imagination. Also, in practice,
    many of my patients find the apparent revelations too premature and painful.


    Hypnosis is today used only by a few mainstream psychoanalysts, but there are
    specialist `hypnotherapists` use the technique (as included later, under Hypnotherapy,
    in the Complementary Therapy section).


    ## Projective Techniques


    The best-known projective test is the Rorschach ink-blot test. The game is similar
    to word-association tests except, instead of responding to words, the client has
    to say the first thing that comes into his or her head on seeing an ink-blot pattern.
    `Hermann Rorschach` (1884-1922), who invented the test, used ink blots for their
    random nature - so the client would be forced to make an interpretation that would
    say more about their own personality than the pattern itself.


    ![image](images/pg63-1.jpg)![image](images/pg63-2.jpg)


    Personally, I think they all look like butterflies or flowers ... or vaginas...
    Mother!


    ## Psychoanalytically Oriented Psychotherapy


    In addition to Freud’s original psychoanalysis, there are the variations of psychotherapy
    based on the work of “second-generation psychoanalysts” such as `Erik Erikson`
    (1902-94) and `Karen Horney` (1885-1952). These analysts emphasize the role of
    the ego (hence their other name, “ego analysts”) rather than the id.


    ![image](images/pg64.jpg)


    One of our main objections to Freud is his exaggeration of the importance of sexual
    and aggressive impulses characteristic of the id. We tend to favour briefer treatment,
    with face-to-face discussions about the client’s current life and relationships,
    rather than dwell so long on childhood conflicts. Abuse and deprivation can be
    overcome through self-understanding and productive adult relationship.


    ## Child Therapy


    The analytic importance of childhood was pursued by `Anna Freud` (1895-1982),
    Sigmund’s daughter, even though she disputed his emphasis on unconscious forces
    and conflicts.


    ![image](images/pg65.jpg)


    A better approach is to concentrate on ways in which the client perceives the
    world. She is credited with being a pioneer of child therapy... but so was `Melanie
    Klein` (1882-1960). Object relations analysis is based on the work of `Melanie
    Klein` and other is the British school... We stress the child’s separation from
    the mother and interpersonal relationships as being important in psychological
    growth. We believe some people have difficulty in telling where the influences
    of “significant other” end and their “ real lives” begin.


    ## What can be Treated by Psychodynamic Therapies?


    Conditions treated by psychoanalysts and related psychotherapists include: anxiety,
    depression, eating disorders, grief, panic attacks, phobias, psychosomatic illnesses,
    relationship problems, sexual problems and stress. The main disorders that are
    not usually treated psychodynamically are manic depression and schizophrenia.


    ![image](images/pg66.jpg)


    Psychodynamic therapies have become less popular and some professionals believe
    them of little use in the long-term treatment of mental disorders. As with all
    therapies, the client has to be willing to “play the game” for it to be of benefit.


    Largely as a reaction against psychoanalysis, another type of therapy has developed
    since the 1920s, based on directly changing behaviour.


    ## Behaviour Therapy


    Behaviour therapy, as the term suggests, aims to change a person’s current behaviour
    - without “wasting time” delving into the client’s past as psychoanalysts do.
    The general theory is that all behaviour is acquired through learning, so any
    undesirable behaviour can be “unlearned” and new desirable behaviour “learned”.


    There are three main learning theories.


    ![image](images/pg67-1.jpg)


    The therapy based on the Operant Theory of `B.F. Skinner` (1904-90) is called
    “Behaviour Modification”. “Behaviour therapy” is based on the Classical conditioning
    theory of `Ivan Pavlov` (1849-1936) and `John B. Watson` (1870-1958). The therapy
    known as “Modelling” is based on the Social learning Theory of `Albert Bandura`
    (b. 1925).


    ![image](images/pg67-2.jpg)


    ## Behavioural Techniques


    Classical behaviour therapy often involves either removing fear or creating it.
    There are five main techniques.


    ### Removing fear


    1. Systematic desensitization

    2. Implosion

    3. Flooding


    ### Creating fear


    4. Aversion

    5. Covert sensitization


    ![image](images/pg68.jpg)


    We’ll now examine each of these...


    ## Classical Behaviour Therapy


    ### Systematic desensitization


    This technique was specifically developed for removing extreme fears or phobias
    by gradually introducing the feared object or situation.


    ![image](images/pg69-1.jpg)


    IT was first demonstrated by `Mary Cover Jones` (1896-1987), who “cured” a child’s
    phobia of an animal by gradually bringing it closer, while giving the child candy.


    The term Systematic Desensitization (SD), coined by `Joseph Wolpe` (1915-1997),
    refers to the idea that phobics can be thought of as people who have somehow learned
    to be very anxious or “too sensitized” to certain objects or situations. Hence
    the treatment of systematically desensitizing.


    ![image](images/pg69-2.jpg)


    ### Typical Procedure for SD


    Stage 1


    The therapist will start by finding out exactly what is the client’s phobia, often
    drawing up an `anxiety hierarchy` - a list varying from what causes least anxiety
    to what causes most.


    Stage 2


    Then the therapist will give `relaxation training`, including breathing exercises,
    muscle relaxation, etc.


    Stage 3


    Finally, the therapist will gradually introduce the feared object or situation
    to the client.


    ![image](images/pg70.jpg)


    My God, it’s terrifying!


    As the client gets even closer to the source of fear, he or she pauses to relax
    at each step, then continues. This technique can be used for most phobias (for
    example, agoraphobia - fear of open spaces).


    ## Implosion


    This is similar to SD, but using the imagination: the therapist gets the client
    to imagine the feared object or situation, adding verbal descriptions to help
    create the feelings of fear.


    ![image](images/pg71.jpg)


    After repeatedly doing these imaginary exercises, the source of the fear loses
    its power and the anxiety is greatly diminished – it “implodes”. This technique
    has the obvious advantage of being “safe” in the therapist’s room.


    ## Flooding


    ![image](images/pg72.jpg)


    This extreme technique forces the client to confront the source of fear by being
    “flooded” by it.


    Unable to escape from the object or situation, the client has to “deal with it.
    This technique is suitable only for certain types of phobia and certain types
    of people. For example, those without a heart complaint!


    ## Aversion Therapy


    The three previous techniques aimed at reducing or removing fear. `Aversion therapy`
    aims at creating fear in order to change behaviour. As the term suggests, the
    therapist assists the client in developing an aversion to an addiction, such as
    smoking or drinking alcohol.


    ![image](images/pg73.jpg)


    Aversion is achieved by pairing the undesired behavior with something unpleasant...
    The drug Antabuse/disulfiram will make an alcoholic feel sick whenever he or she
    tries to drink anything containing alcohol. Proponents argue this is how humans
    (and other animals) learn to avoid harmful situations in nature.

