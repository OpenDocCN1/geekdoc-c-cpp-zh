    Just say whatever comes to mind, no matter how trivial, irrelevant or nonsensical
    it might seem. Funny ... I suddenly have nothing on my mind!


    Freud called this the “basic rule of psychoanalysis”. The whole point is to try
    to get the client to talk openly and freely, without the normal “censoring” actions
    of the mind (the ego) interfering. Although this might sound easy, it often takes
    several sessions before a client can become relaxed enough to “open up” and free
    associate readily.


    ## The Analyst’s Role in Free Association


    While the client is free associating, the analyst remains passive - not making
    any evaluative comments or expressing emotions. Analysts should remain anonymous
    to their clients, not revealing anything about themselves. Most statements made
    by an analyst during free-association periods are repetitions or clarifications
    of what the client has said. The analyst will usually take notes and record `private
    deductions`.


    Once significant amounts of information have been elicited, the analyst will make
    `interpretative comments` to help the client discover more about what is troubling
    him or her.


    ![image](images/pg53.jpg)


    Analysts are especially keen to spot any resistances the client makes - such as
    reluctances to talk about certain things, deliberately changing the subject, or
    attempts at making jokes. Have you heard the one about the shrink and the Irishman?


    Freud believed that resistances are symptomatic ways of preventing painful thoughts
    from becoming conscious, which means they can be important clues when getting
    close to the source of a problem.


    ## Word Association


    The word-association test was introduced by `Carl Jung` (1875-1961), Freud’s disciple
    and later rival. As in free association, the client freely responds to the analyst’s
    list of words. The point of the “game” is that after each word the client has
    immediately to say out loud the first word or phrase that comes into his or her
    head - without hesitating or censoring anything.


    ![image](images/pg54-1.jpg)![image](images/pg54-2.jpg)


    Cupboard Mother Window Mother


    ![image](images/pg54-3.jpg)


    Bed Mother Van de graaff generator Mother


    From the range of responses, the analyst tries to work out what might be troubling
    the client.


    ## Interpretation of Actions


    There are two types of actions by patients that can be analysed for unconscious
    motives: `faulty actions` and `physiological cues`.


    `Faulty actions`, nowadays better known as “Freudian slips”, can reveal a person’s
    real thoughts or intentions. Freud collected examples of these and published them
    in his book *The Psychopathology of Everyday Life* (1901).


    ![image](images/pg55-1.jpg)


    One group of faulty action is “slips of the tongue” when someone makes an apparent
    verbal mistake. For example instead of one woman complimenting another on the
    way she’s sewn a hat...


    ![image](images/pg55-2.jpg)


    It looks as though you’ve thrown that had together!


    Other faulty actions can be “slips of the pen” (writing the wrong word), forgetting
    events (someone’s birthday) and losing objects (house or work keys).


    `physiological cues` include bodily changes such as blushing or turning pale,
    and changes in the voice (pitch, trembling, etc.).


    ![image](images/pg56.jpg)


    No! ... it wasn’t m ... ... me! Honest!


    In a therapy session, a psychoanalyst may interpret any recent faults reported
    by the patient (such as losing a possession) or directly interpret any observed
    faulty actions or physiological cues. The analyst will then gently ask probing
    questions to explore where the patient’s conflicts lie.


    ## Transference


    After interpretations have been carried out, and the unconscious conflict has
    been made conscious, the analyst and client will “live out” the conflict. Feelings
    that have been repressed for a long time will be available for “manipulation”.
    Freud called this process `transference` in which the original source of conflict,
    such as a parent, becomes transferred onto the analyst. The client may literally
    attach to the analyst the emotions associated with the original conflict, whether
    these are positive and loving - or negative and hostile. Bringing them out into
    the open helps in understanding and resolution.


    ![image](images/pg57.jpg)


    I hate you! You are always making me do things I don’t want to do!


    It is common for clients to express a range of feelings towards the analyst, such
    as attachment or jealousy. The analyst’s professional training and experience
    is crucial in dealing with this. Freud believed that disorders like schizophrenia
    and depression could not be treated by transference, even though psychoanalysis
    could explain them.


    ## Achieving Insight


    `Insight` is achieved when the client understands the roots of the conflict and
    is able to begin the process of moving on in a mature and responsible way. But
    this process is usually a long and gradual one, since the recall of a single traumatic
    idea or event is often `over-determined` by complex issues surrounding each trauma.
    Therefore, a repetitive `working through` of all aspects of a conflict is necessary
    as a means of `re-education`.


    ![image](images/pg58.jpg)


    The goal of psychoanalysis is a deep-seated modification of personality ... to
    allow the individual to deal with problems realistically.


    ## Dream Interpretation


    An early technique used by Freud was featured in his first major publication,
    *The Interpretation of Dreams* (1900), in which he presented case studies of patients’
    dreams that he claimed he’d successfully analysed as a means of treating them.
    *“Dreams are the royal road to the unconscious!”*


    Freud believed that dreams consist of memories that vary from the previous day’s
    events to those of the distant past, and hints about unconscious processes. One
    type of dream content is `wish fulfilment`, which expresses unconscious impulses.


    ![image](images/pg59.jpg)


    But the real hidden meaning (the latent content) of a dream may be too unpleasant
    for the dreamer... So what is usually recalled (the manifest content) is a symbolic
    version that is more acceptable. I might recall a dream about a “dying stranger”
    who is really a symbolic replacement for my own father who I unconsciously wish
    were dead!


    ## Symbolism in Dreams


    According to Freud, the very fact that the unconscious mind protects a person
    from recalling the real meanings of dreams means that it’s impossible for anyone
    to analyse their own dreams! Hence the need for a trained psychoanalyst to do
    the interpreting for them.


    ![image](images/pg60-1.jpg)![image](images/pg60-2.jpg)


    Although I discovered certain basic principles about symbolism in dreams – for
    example, the substitution of phallic symbols for sexual desires – ultimately,
    each person has an idiosyncratic set of symbols that applies only to him or her
    and no one else.


    Which is another reason why a trained analyst is needed who can get to know the
    person well, and why so-called “dictionaries of dream symbols” are generally useless.


    ## The Use of Dreams


    Dreams can therefore be a valuable means of finding out what is troubling a person.
    However, Freud was emphatic that dreams are not direct insights into the unconscious
    mind - which is forever hidden - but at best only indications of what might be
    going on in there.


    ![image](images/pg61-1.jpg)![image](images/pg61-2.jpg)


    The discovery of a wish fulfilment in dreams may help the analyst work out where
    the main conflicts lie, and process of making them conscious to the patient is
    itself an important part of the cure. The interpretation of a dream may lead to
    awareness and subsequent resolutions of problems, but other techniques are also
    required.


    ## Hypnosis

