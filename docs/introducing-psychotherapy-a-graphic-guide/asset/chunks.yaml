    # General textbooks and introductions to psychology


    Atkinson et al., *Hilgard’s Introduction to Psychology* (Harcourt Brace, 1996):
    a standard American textbook for undergraduates.


    Benson, N.C., *Introducing Psychology* (Icon Books, 1989): a unique illustrated
    outline of psychology, including some major therapies.


    Cardwell, Mike, et al., *Psychology*, (Collins Educational, 1997): a standard
    British textbook for Advanced-level students.


    Gross, R., et al., *Psychology: A New Introduction* (Hodder and Stoughton, 2000)
    and *Psychology: The Science of Mind and Behaviour* (Hodder and Stoughton, 2001):
    both British “bibles” of psychology aimed mainly at Advanced-level students. Everything
    by Richard Gross is well researched.


    Stratton, P., and Hayes, N., *A Student’s Dictionary of Psychology* (Edward Arnold,
    1993): a useful selection of basic definitions.


    ## Books on psychotherapy, including counselling


    Gross, R., and Mcllveen, R., *Therapeutic Approaches to Abnormal Behaviour* (1999):
    an excellent summary of psychotherapies aimed more at Advanced-level courses.


    Nelson-Jones, Richard, *Theory and Practice of Counselling and Therapy* (Continuum,
    2001): a good textbook especially for those training to be counsellors.


    Palmer, Stephen, *Introduction to Counselling and Psychotherapy* (Sage Publications,
    2000): another good training book.


    Reader’s Digest, *Brain Power: The Healing Brain* (Reader’s Digest London, 2002):
    a fascinating collection of articles including various psychotherapies.


    Schapira, Sylvie, *Choosing a Counselling or Psychotherapy Training* (Routledge,
    2000): a very useful starting point for potential psychotherapists.


    Stewart, W., *An A-Z of Counselling Theory and Practice* (Stanley Thornes Ltd.,
    1997): a useful dictionary-style summary of counselling.


    ## Books on complementary therapies


    Farquharson, Marie, *Complementary Therapies* (HarperCollins Publishers, 2001):
    a highly recommended pocket-sized summary of complementary therapies.


    Holford, Patrick, *Optimum Nutrition Workbook* (Ion Press, 1992): a good example
    of dietary therapies.


    ## Source books: a selection of important writings by key authors


    Beck, A., *Love is Not Enough* (1988)


    Berne, Eric, *Games People Play* (Penguin, 1964)


    Freud, S., *The Interpretation of Dreams* [1900] (Penguin, 1976)


    *The Psychopathology of Everyday Life* [1901] (Hogarth Press, 1960)


    Ellis, Albert, et al., *Stress Counselling* (Cassell, 1997)


    Laing, R.D., *The Politics of the Family* (Pelican, 1969)


    McDermott, I., and O’Connor, J., *NLP and Health* (Thorsons, 1996)


    Maslow, A.H., *Towards a Psychology of Being (Wan* Nostrand, 1962)


    Perls, F.S., *The Gestalt Approach and Eyewitness to Therapy* (Bantam, 1973)


    Rogers, C.R., *Encounter Groups* (Penguin, 1970)


    *Person-Centred Counselling* (Sage, 1998)


    Sartre, Jean-Paul, *Existentialism is a Humanism* (Methuen, 1948)


    Storr, Anthony, *Churchill’s Black Dog* (HarperCollins Publishers, 1988)


    ## Source journals


    British Psychological Society, “A Code of Conduct for Psychologists”, *The Bulletin
    of the British Psychological Society*, vol. 38, 1985, pp. 41-3: a definitive ethical
    code that should be used by psychotherapists as well as all psychologists.


    Eysenck, Hans, “The Effects of Psychotherapy: An Evaluation”, *Journal of Consulting
    Psychology*, vol. 16, pp. 319-24: the classic article on the relative effectiveness
    of psychotherapy.


