    tool for business managers to improve communication and relationship skills with
    other managers. There are many variations, some being based more on humanistic
    models (e.g. **Abraham Harold Maslow’s** (1908-70) “Hierarchy of Needs”) than
    others. T-groups generally differ from encounter groups by demanding more controlled
    means of self-expression and maintaining a more “professional” approach to interactions.
    But some T-group or management-training approaches seem to have totally misinterpreted
    the humanistic concepts and ditched the “sensitivity” part completely...


    ![image](images/pg121-1.jpg)![image](images/pg122.jpg)


    Ok, you guys – you have exactly ten minutes each to have at least one Peak Experience,
    or else tell the rest of the group why you are such a dismal failure!


    ## Other Group Therapies


    ### Alcoholics Anonymous or AA


    Alcohol can cause moderate to severe psychological disorders, such as memory loss,
    personality changes, a variety of anti-social behaviours and psychosis. The AA
    was set up in 1935 by two US alcoholics trying to overcome their drinking problems:
    “Bill W.”, a stockbroker, and “Bob S.”, a surgeon. By the year 2000, there were
    over 90,000 AA groups established in more than 120 countries, each group acting
    more or less autonomously to serve local needs.


    ![image](images/pg123.jpg)


    Members are required to follow a Twelve-Step Programme and are generally committed
    to stopping alcohol intake completely. I am willing to take the first step...
    and admit I am an alcoholic.


    AA groups are secular but often have a strong spiritual, as well as social, focus
    that includes reliance on God or a higher power, according to individual beliefs.
    Members are referred to by first names only and last initial (as the founders
    did), and support each other through sharing experiences and encouragement.


    ![image](images/pg124.jpg)


    Many medical professionals recommend AA as an inexpensive and practical type of
    group therapy, although it is not suitable for everyone with alcoholism. I’m not
    an alcoholic and I don’t want to give up alcohol completely ... just cut down
    a little bit ... hic!


    The model of the AA has been copied and adapted by many other self-help groups,
    e.g. Gamblers Anonymous. Their success depends on individual effort and group
    support, so people don’t feel they are facing problems alone. Changing addictive
    behaviour usually involves changing attitudes and adopting a new identity.


    ## Laughter Therapy


    Laughter is characterized by a range of physical expressions – inarticulate vocalized
    sounds, facial contortions and vibrating body movements – precipitated by thoughts,
    situations, events, etc., usually of an unexpected or incongruous nature. It can
    also be elicited by nitrous oxide and tickling. One popular proponent of **laughter
    therapy** is Dr Patch Adams of Arlington, Virginia.


    ![image](images/pg125.jpg)


    Joy is more important than any other drug!


    Humour is commonly used by many people to relieve stress and alleviate depressive
    symptoms – not least by certain comedians who themselves suffer depression. Laughter
    can have measurable beneficial physiological effects, e.g. by reducing levels
    of stress hormones, increasing certain “feel-good” neurotransmitters, relaxing
    the muscles and increasing blood flow. Laughter therapy is still not generally
    recognized by the medical profession.


    ## Complementary (or Alternative) Therapy


    These terms represent a huge range of diverse therapies that can be used in addition
    to conventional medical practices. (Hence the modern preference for the term “complementary”
    rather than “alternative”.) In the past, much **complementary therapy** was dismissed
    as quackery or fads that wouldn’t last. However, dissatisfaction with conventional
    medicine has led many to seek help elsewhere.


    ![image](images/pg126.jpg)


    The Consumer Association Survey gives this statistic... In Europe, at least one
    third of adults have used some form of complementary therapy at some time. Increasingly,
    general MDs are offering complementary medicine – and many refer their patients
    to its practitioners.


    ## What is Complementary Therapy?


    The most significant difference is the approach to definitions and treatments
    of disease. Generally, complementary therapists view an illness not as an isolated
    symptom but as a disturbance of the total physical and mental wellbeing of an
    individual. Consequently, they aim to treat the whole person – especially by stimulating
    the body’s natural and self-healing abilities.


    ![image](images/pg127.jpg)'
