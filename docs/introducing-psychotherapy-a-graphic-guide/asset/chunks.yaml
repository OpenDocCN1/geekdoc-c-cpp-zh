    ## 精神症与神经症的区别


    精神分裂症是 `psychosis`（精神症）的一个例子——这种精神疾病会影响人的整个生活，患者可能意识不到这种疾病的存在。`neurosis`（神经症）只影响个人生活的某些部分，且他们通常能意识到这种疾病。神经症的例子包括恐惧症、妄念和强迫症。尽管一些治疗师仍然认为这些区分很有用，但这些标签现在已不再被频繁使用。有些客户并不完全符合其中任何一种范类。


    ![image](img/pg26.jpg)


    目前的分类系统已经取消了 `psychosis/neurosis` 的区别，但 `ICD` 仍使用“neurotic”（神经症的）一词，而 `DSM` 仍使用“psychotic”（精神病的）。


    ## 心理治疗的直接目标


    精神分裂症和其他精神症行为的例子突显了所有心理治疗情况中的共同问题，即：*目标是什么？* 传统的“cures”（治愈）概念往往不再适用——事实上，在许多医疗情况下，它们并不总是相关的，例如当一个人患上绝症时。


    ![image](img/pg27.jpg)


    讨论 `“coping strategies”（应对策略）或“quality of life”（生活质量）通常更为合适……例如，鼓励个人实现现实的个人目标，并专注于享受日常生活。


    ## 心理治疗更广泛的目标


    应对和定性目标往往难以量化，从而使得疗法的评估变得困难。但我们需要意识到心理治疗更广泛的社会和经济效益，以及个人层面的效益。


    ![image](img/pg28.jpg)


    例如`“Care in the Community”（社区护理）` 的积极意义意味着远不仅仅是某些个人不再被终身监禁在隔离机构中。让他们在当地社区生活得更充实，对这些个人来说本质上更好，并可能帮助社会其他部分对处不幸的人更加宽容。


    ## 为什么心理治疗很重要？


    这里考虑的心理治疗较少关注学术兴趣，而更多关注改善生活的实践。学习心理治疗可以通过几种方式帮助到你。


    ![image](img/pg29.jpg)


    如果你觉得自己状态正常且心理健康，那么你很幸运！（当然，这也可能是幻觉！）心理治疗的知识可以帮助你欣赏并维持心理健康。如果你有问题，知道那里一直提供帮助。


    了解可用的不同治疗类型有助于根据自己的需求选择最合适的方法。


    ## 帮助他人……


    如果你认识其他人有问题，你可能可以协助他们寻求专业帮助。同样，选择合适的治疗师至关重要。如果你对从专业角度从事心理治疗感兴趣，那么你需要了解各种不同的类型以及所需的培训。


    ![image](img/pg30-1.jpg)


    总来说，社会仍然需要更深入的理解，以消除“精神疾病”的社会污名并反驳关于它的神话。


    ![image](img/pg30-2.jpg)


    这些神话中的许多根植于过去……那么呢？你是哪一种？


    ## 心理治疗简要背景


    古希腊哲学家 `Empedocles`（恩培多克勒，公元前 490-430 年）试图用`“four elements”（四元素）`解释一切：火、水、土和气。医学之父`Hippocrates`希波克拉底）认为每种元素都有相应的身体`“humours”（体液），需要平衡才能保持健康：血液（火）、痰（水）、黑胆（土）和黄胆（气）。他将精神疾病解释为这些体液的失衡。


    ![image](img/pg31.jpg)


    我们的快乐、喜悦、笑和玩笑，以及我们的忧伤、痛苦、悲伤和泪……我们遭受的这一切都源于大脑变得太热、太冷、太湿或太干……疯狂源于它的湿气！


    现代医学表明 `Hippocrates`希波克拉底可能至少部分正确。脱水会导致头痛和情绪变化。某些大脑物质（神经递质）对于思维过程是必需的，而药物和毒素会干扰这些过程。


    `Galen`（盖伦，公元 129-216 年）是有影响力的医生和`Hippocrates`的随者，描述了四种体质。


    - 粘液质的人（行动缓慢、情感冷淡）受粘液过多影响。

    - 胆质的人（情绪反应迅速且剧烈）黄胆过多。

    - 忧郁质的人（抑郁的）黑胆过多。

    - 多血质的人（感情浅薄、易变、乐观的）血液过多。


    ![image](img/pg32-1.jpg)


    这种学说在西方医学中一直持续到 18 世纪，现代口语中仍有时使用！另一位希腊哲学家 `Epicurus`（伊壁鸠，公元前 341-270 年）曾说


    ![image](img/pg32-2.jpg)


    他太粘液质了！但至少他不是忧郁质的……快乐是受福生活的开始和终结？但伊壁鸠鲁的意思是指不受贪婪、追求名名和权力滥用干扰的“智慧之乐”。


    伊壁鸠主义吸引了罗马唯物主义哲学家 `Lucretius`（卢克发现，公元前 99-55 年）——他是`Julius Caesar`（凯撒，公元前 100-44
    年）同时代——认为


    ![image](img/pg33-1.jpg)


    “我们在胸腔中部感到恐惧和快乐！”


    其他罗马人更倾向于斯多葛学派，该派主张在个人悲剧面前保持冷静和不动。最著名的斯多葛学派是 `Epictetus`（爱比克泰，公元 55-135 年），他原本是一个希腊奴隶。他的主要关注点是寻找一种忍生活的方法。


    ![image](img/pg33-2.jpg)


    永远不要对任何事情说“我失去了”，而要说“我还了”……


    ![image](img/pg33-3.jpg)


    你的孩子去世了吗？它已经归还。你的妻子去世了吗？她已经归还。


    在现代心理治疗中，这有时被称为`“re-structuring”（重构）或“re-modelling”（建模）`，在应对丧亲和其他悲剧时可以起到至关重要的作用。它是后来认知疗法解释的基础。


    ## 圣奥古斯丁


    `Augustine`（奥古斯丁，公元 354-430 年）根据自己的深刻个人经历发展了心理学和神学理论。有一天，在米兰的花园里和朋友在一起时，他陷入了哭泣。他跑到花园尽头，在那里听到一个孩子的声音：


    ![image](img/pg34.jpg)


    拿起读吧；拿起读吧！奥古斯丁拿起一本圣保罗的书信，随机翻开，读到了这些话……不要醉酒放淫，不要淫乱，不要争斗嫉忌；要披上主耶稣基督，不要为肉体预备。


    立刻，他的“灵魂疾病”消失了，他感到快乐宁静。不久后，他放弃了婚姻计划开始学习。后来，他将财产分给穷人并回到非洲建立了一个修道院。最终，他成为了希波主教并撰写了《忏悔》和《上帝之城》。


    ## 圣托马斯·阿奎那'
- fmt: '

    Someone else who found personal salvation through `faith` and `studying` was the
    medieval theologian `Thomas Aquinas` (1225-74). From waking to sleeping, his days
    were filled with study, writing, teaching and worship. `Aquinas` believed in the
    importance of freedom of the will.


    ![image](images/pg35-1.jpg)


    We cannot help desiring the objects of our appetites, and we are free to will
    what we do about those desires, but the will remains subordinate to intellect,
    which determines what is to be sought or avoided.


    ![image](images/pg35-2.jpg)


    In some modern psychotherapy – for example, in logotherapy and psychosynthesis
    – there is an emphasis on freedom of the will.


    In spite of physical and psychological restraints, we are free to stand against
    whatever confronts us and we all have the potential to rise above adverse conditions.
    The importance of spiritual faith is recognized in many psychotherapies, although
    not in the sense of organized religion, which does not have a good historical
    record of tolerance …


    # Medieval Madness


    After `Aquinas`, there was a dark age in psychological theories from the late
    13th century to the 17th century. It was during this long period of wars and epidemics
    that superstition and demonism dominated Europe. The official churches were involved
    in numerous witch-hunts and inquisitions of alleged religious heresies. There
    was a rampant belief that many people were possessed by demons, and this was the
    basis for the “diagnosis” and “cures” of many mental illnesses.


    ![image](images/pg36-1.jpg)


    Anyone considered odd or unusual – an old woman living on her own with a pet cat
    – was at risk of being accused of witchcraft.


    ![image](images/pg36-2.jpg)


    Beliefs about metal illnesses being caused by evil spirits still exist in many
    parts of the world today, including the USA and the UK!


    A small light of hope appeared in the mid-15th century with the invention of printing.
    The word `psychologia` first appeared in 16th-century texts. But it was not until
    the humanism of the Renaissance that some progress in human understanding occurred.


    # Descartes’ Dualist Philosophy


    The philosopher `René Descartes` (1596-1650) advocated control of the passions
    through reason and the will, and gave practical advice.


    ![image](images/pg37.jpg)


    When a powerful passion is aroused, one should deliberately divert one’s attention
    elsewhere until the agitation calms down, and only then make a judgement as to
    what to do! I think I am `Descartes` ...therefore, I am `Descartes`.


    `Descartes` classified the passions into six primary ones: wonder, love, hate,
    desire, joy and sadness. All other passions were combinations of these. `Descartes`
    proposed an influential theory that `body and mind are separate entities` that
    interact - sometimes harmoniously, other times competitively. This `dualism` is
    still very dominant today. It may have short-hand uses (as a crude diagnosis of
    whether an illness is primarily “physical” or “mental”). Many psychotherapists
    now believe it has created profound misunderstandings and been harmful to our
    knowledge and treatment of diseases. Modern “holistic” approaches are in direct
    opposition to dualist notions.


    # Mesmerism


    One physician who explored the relationship of mind and body was `Franz Anton
    Mesmer` (1734-1815). At first, he applied magnets to patients in order to heal
    them of disorders by somehow “realigning the body’s magnetic fields”. His magnetic
    treatments seemed to work and he was very popular in Vienna and Paris.


    ![image](images/pg38.jpg)


    I eventually abandoned the use of magnets when I found that my patients could
    still be cured if then entered a trance-like state and behaved as I suggested.
    This “Mesmerism”, as his treatments were called, would today be explained as the
    curing of neuroses by suggestion. And I renamed it “hypnosis“ ...


    `James Braid` (1870-1950), a Scottish physician, pursued `Mesmer’s` ideas and
    concluded that a key factor was the susceptibility of the patient. `Braid` renamed
    the phenomenon “neuro-hypnology” (from the Greek for “nerve” and “sleep”) then
    `hypnosis` – as it’s been known ever since.


    # Hypnosis and Hysteria


    `Jean Charcot` (1867-1936), the neurologist and pioneer psychiatrist in Paris,
    believed that hypnosis had much in common with neuroses (then called “hysteria”),
    and used it to cure patients. Among `Charcot’s` students was `Sigmund Freud` (1856-1939).


    ![image](images/pg39-1.jpg)


    I also used hypnosis as treatment for a while, but later decided it was too unreliable.


    ![image](images/pg39-2.jpg)


    Today, hypnosis is still used by some specialists – hypnotherapists – but the
    old ideas about its universal benefit have generally been abandoned.


    Hypnosis is now considered to be a state of deep relaxation and suggestibility
    which certain people can achieve quickly, depending upon their motivation and
    willingness to obey the hypnotist’s suggestions. It can be effective for the temporary
    relief of symptoms. Advocates claim it can benefit people in certain specific
    circumstances, since the ability to relax is of value in itself.


    # Asylums in the 19th Century


    From the early 19th century, asylums for the care of the insane were established
    in many European countries - some being publicly funded and others privately run.
    They were intended as places of “refuge and safety” (the original meaning of the
    term). Some provided a good standard of care, but many kept lunatics in dreadful
    conditions. One notorious place was Bethlehem Hospital in London (which gave us
    the word “bedlam”), reported as having “the appearance of a dog-kennel”.


    ![image](images/pg40.jpg)


    The biggest problem in asylums was simply overcrowding – not alleviated by the
    building of more even larger institutions. Virtually all patients were considered
    incurable, and a major concern was the wrongful detention of many people.


    # Asylums in 20th Century


    The asylum population continued to grow dramatically in 20th century and reached
    a peak in England in 1954 Then a wave of overly optimistic discharge swept through
    psychiatry, largely fuelled by the discovery of new drugs (especially major tranquillizers)
    seen as panaceas. This, combined with severe sociological criticisms about asylums
    in Europe and the USA, led to the closure of many mental hospitals in favour of
    community care.


    ![image](images/pg41.jpg)


    Unfortunately, there was – and some would say, still is – too much reliance on
    drugs and not enough on supportive care. Just take two of these a day and you’ll
    be O.K. And “community care” is often a name without substance ...


    # The Closing of Asylums


    By the end of the 20th century, many of the old-style asylums had completely disappeared.
    But today, many professionals believe the pendulum has swung too far. There is
    now a shortage of refuge and care for those who seek it. Prisons have more psychiatric
    cases than ever.


    ![image](images/pg42.jpg)


    And many political promises about care in the community have not been realized.
    In towns and cities throughout Europe and the USA, numerous mentally ill individuals
    can be seen wandering the streets, apparently condemned to lives of loneliness
    and despair.


    # Psychotherapy Today


    The need for psychotherapy is at least as great today as it has ever been. But,
    on a more optimistic note, it is important to say that there is greater understanding
    than ever about the causes of mental disorders and even more opportunities for
    treatments.


    ![image](images/pg43.jpg)


    Here is a reminder of the seven main types of therapies previously listed which
    we will next cover in sequence... The first of these – medical therapy – is not
    strictly psychotherapy but a brief summary is given because it is usually the
    first approach made by doctors.

