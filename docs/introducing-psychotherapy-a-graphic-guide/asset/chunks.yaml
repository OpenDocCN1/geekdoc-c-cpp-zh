- fmt: 'Art therapy was first used formally by C.G Jung.


    Now It is commonly used in psychiatric hospitals and other therapeutic environments.


    `Music therapy` can vary from guided listening to active participation on whatever
    instruments are available and depending on the musical abilities of the client.
    Percussion instruments are often used, as well as singing.


    `Dance movement therapy` was developed in the USA during the 1940s. Dancing has
    long been known to be an important source of ritual pleasure and restorative social
    interaction. Dance therapists “read” the client’s body movements (the non-verbal
    expression of unconscious emotions) for both diagnosis and treatment.


    ![image](images/pg152.jpg)


    Will you, won’t you, will you, won’t you Will you join the dance?


    Drama therapy including psychodrama – is often combined with dance therapy to
    encourage self-expression. It Provides a “safe place” to explore feelings and
    attitudes especially through improvisation.


    `Dreamwork` uses “lucid dreaming” – the learned control of dreams – creatively
    to solve personal problems. Clients are encouraged to summon up characters and
    situations when they sleep. Practitioners claim dreamwork can treat phobias and
    other stress-related disorders.


    ![image](images/pg153-1.jpg)


    `Visualization` uses the power of imagination for healing and other desired changes.
    Clients are trained mentally to picture themselves being healed or visualize what
    it will feel like when they achieve certain goals. Visualization is used generally
    to change attitudes and improve motivation. It can be used specifically for stress
    management, pain control, anxiety and phobias.


    Visualization can be used by anyone to help in their achievements – success in
    sport, improved musical performance, employment accomplishments, success in relationships,
    etc.


    ![image](images/pg153-2.jpg)


    But as the old saying goes ... Be careful what you wish for... in case it comes
    true! Such advice can, of course, be found in many books...


    ## Self-help Books


    In recent years, there has been a massive growth in so-called “self-help” books
    that tend to make exaggerated claims about instantly changing your life for the
    better. While many offer reasonably sound advice, self-help books often consist
    of just one or two ideas expanded over the entire length of a volume – frequently
    re-using ancient wisdom.


    ![image](images/pg154-1.jpg)


    Many readers seem to be an endless search for a Holy grail of Psychotherapeutical
    solutions...


    ![image](images/pg154-2.jpg)


    The ancients steal all our best ideas.


    ![image](images/pg154-3.jpg)


    Readers are warned about quick-fix solution that soon fail to satisfy. But there
    are books written by qualified and experienced counsellors, psychologists and
    doctors available in this market.


    ## How to Win Friends and Influence People


    `Dale Carnegie’s` (1888-1955) self-help books have stood the test of time: `How
    to Win Friends and Influence People` (1936) and `How to Stop Worrying and Start
    Living` (1937).


    Typical of self-help books, Carnegie also uses literary quotations and anecdotes
    of ordinary and famous people to generate and illustrate ideas...


    ![image](images/pg155-1.jpg)


    Nothing is good or bad... but thinking makes it so. Most folks are about as happy
    as they make up their minds to be.


    ![image](images/pg155-2.jpg)


    The value of self-help books is mainly subjective – as it can be for therapies
    in general ...


    ## Evaluation of Therapies


    The evaluation of therapies is very difficult. For one reason, many diagnoses
    are not measurable. This doesn’t just apply to the more esoteric or mystical complementary
    therapies but many accepted mainstream treatments as well, such as the psychodynamic
    techniques used by qualified medical doctors. As the philosopher `Karl Popper`
    (1902-94) pointed out, theories such as those invented by Sigmund Freud and other
    analysts are simply not scientifically verifiable.


    ![image](images/pg156-1.jpg)


    For a theory to be scientific, it must be measurable and subject to being tested.
    But there is still the problem – which measurements are important?


    ## Measurements of Therapies


    For any therapy to be judged effective, there must be some sort of observable
    change in behaviour, or at least a reported difference in the mood and outlook
    of the client. But who is the best person to judge this, and over what time period?
    Should the assessment be by the therapist, the client, a friend or relative, or
    an independent professional observer? Does the fact that a client says he or she
    “feels better” after some treatment mean that treatment is justified and effective?


    Perhaps the most important factor in any psychotherapeutic treatment is the client’s
    belief that it is helping – i.e. the placebo effect...


    ![image](images/pg156.jpg)


    You do not have a depressive illness ... ... but you do have a personality disorder
    ... ... and unresolved issues regarding your sexuality. The problem with non-scientific
    theories is that nothing can ever be said or done to disprove them! It’s OK! Feel
    better now! Are clients the best judges of their own personalities and behaviours?
    Clearly, sometimes they are not!


    ## The Placebo Effect


    A placebo is anything without medical value which a patient believes to be a medicine
    or therapy, and to which they respond accordingly. This is fairly straightforward
    when testing a new drug. Half the volunteers will randomly be given a pill containing
    the active ingredient, while the other half – without knowing – will each be given
    an identical looking inert pill which may contain a small amount of sugar or salt
    to provide taste. In order to prevent any other influences, such experiments are
    usually “double blind”, i.e., even the experimenter does not know which contain
    the genuine drug and which are placebos.


    ![image](images/pg158.jpg)


    Clearly, if the volunteer or assistants knew which pills were placebos, it could
    ruin the experiment... I want you to take one of these tablets twice a day...


    ## Psychotherapy Placebos


    When trying scientifically to test the effectiveness of a psychotherapy, the placebo
    principle is also used – but it is much harder to find the equivalent of an “inert
    pill”. In practice, some form of relaxation or story-telling is used, although,
    not surprisingly, volunteers in a placebo group can often feel better!


    ![image](images/pg159-1.jpg)


    With some therapies, it is difficult to devise a convincing placebo... The fact
    is, virtually any kind of attention given to a person has the potential to be
    a therapy!


    ## Power of Placebos


    In treating psychological disorders, placebos are often as effective as medication.
    In one large study of depression, patients responded nearly as well to a pill
    placebo as they did to either anti-depressant drugs or psychotherapy.


    Some cynics argue that many, if not all, psychotherapies are just the equivalent
    of witches’ brews or other useless potions that have been sold over the centuries...


    ![image](images/pg160-1.jpg)


    At best being harmless – at worst causing long-term damage.


    ![image](images/pg160-2.jpg)


    Leg of frog... Tail of newt...


    Similar arguments can be applied to faith or spiritual healing. Is Lourdes a focus
    of divine intervention or just a well-publicized “placebo place”?


    ## Scientific Evaluations of Therapies


    The first systematic evaluation of therapies was conducted by `Hans Eysenck` (1916-97)
    in 1952, who compared psychoanalysis and eclectic psychotherapy (which uses a
    variety of approaches). He concluded that only 44% of psychoanalysis was successful
    – as measured by the patients being “improved”, “much improved” or “cured”. The
    eclectic psychotherapy, using the same criteria, was 64% successful.


    ![image](images/pg161-1.jpg)'
