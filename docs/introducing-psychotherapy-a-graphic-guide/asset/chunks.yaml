    It is important to know something about the medications that are frequently prescribed.
    Also, psychotherapy is often used in conjunction with medical therapy, and there
    have been major advances in recent years with drugs available to treat a wide
    range of symptoms.


    ## Somatic Therapy


    The medical approach concentrates on the use of drugs to counter chemical imbalances
    in the nervous system, regardless of whether they are “inborn” or “acquired”.
    (The uses of Electro-Convulsive Therapy, or `ECT`, and psychosurgery are not considered
    here because they are now rarely employed.)


    Drug development has a long history, but accelerating advances since the second
    half of the 20th century have brought more effective medicines with fewer dangers
    and side-effects.


    ![image](images/pg45-1.jpg)


    In Britain, for example, about one quarter of all medications prescribed are psychotherapeutic
    drugs. There are three main group: (a) Neuroleptic (b) Anti-depressants and anti-manics,
    and (c) Anxiolytics...


    ## Neuroleptics (Major Tranquillizers)


    Neuroleptics were introduced in the 1950s when it was accidentally discovered
    that they can have a calming effect. The drug `chlorpromazine` (in the phenothiazine
    group), for example, was originally used to help with symptoms of TB (tuberculosis).


    ![image](images/pg45.jpg)


    An immediate practical advantage for mental hospitals was that less physical restraints
    were required.


    The term “major tranquillizers” can be misleading since, in smaller doses, the
    patient remains conscious. An alternative name is `anti-psychotics`, since they
    are mainly confined to the treatment of schizophrenia and mania (including drug-induced
    disorders produced by amphetamines, etc.). A more recent anti-psychotic is `clozapine`
    (in the dibezazepine group) which was developed to avoid the unpleasant side-effects
    of phenothiazines.


    ## Anti-depressants


    Anti-depressants, technically stimulants, were also introduced in the 1950s. Earlier
    groups included `MAOIs` (mono-amine oxidase inhibitors, e.g. `phenelzine/Nardil`)
    and `tricyclics` (e.g. `imipramine/Tofranil`). The more recent `tetracyclic` or
    `SSRI` group (selective serotonin re-uptake inhibitors, e.g. `fluoxetine/Prozac`)
    has largely replaced the others. There is also now available a group of selective
    noradrenaline-boosting `SNRI` drugs (e.g. `reboxetine/Edronax`).


    The basic theory with all these anti-depressants is that, for whatever reason,
    the patient’s brain is being deprived of key neurotransmitters - especially serotonin
    and noradrenaline - so these drugs effectively increase the amounts of those chemicals
    available.


    ![image](images/pg46-1.jpg)


    It is important to know that anti-depressants are slow-acting and are normally
    useful only in the short term for severe depression.


    ![image](images/pg46-2.jpg)


    You told me it was a happy pill ... but I’ve got to wait three weeks to find out!


    ## Anti-manics


    Anti-manics, such as `lithium salts`, are grouped with anti-depressants but are
    usually used only in severe cases of bipolar manic depression - to flatten out
    the cycles of mania and depression. They are also used when either mania or unipolar
    depression exist on their own. In theory, `lithium` works in almost the opposite
    way to anti-depressants, by increasing the up-take of noradrenaline and serotonin
    so there is less available at synaptic sites. `Lithium` has to be monitored carefully
    since, being a heavy metal, it is potentially toxic.


    ![image](images/pg47-1.jpg)


    Anti-depressants and anti-manics have also been used to treat anxiety, agorophobia,
    obsessions and compulsions, and eating disorders.


    ![image](images/pg47-2.jpg)


    All these drugs can produce unpleasant side-effects, such as dry mouth, tremors,
    urinary retention, weight gain, cognitive impairment (which may affect driving,
    etc.) and sexual dysfunction. No change there, then...


    ## Anxiolytics


    Anxiolytics are so named because they are also known as `anti-anxiety` drugs.
    Other technical names include `minor tranquillizers` and `depressants`. Anxiety
    used to be mainly treated from the 1950s to 70s with `barbiturates` (e.g. `phenobarbitol`),
    but the debilitating long-term side-effects, including chronic addiction, have
    resulted in their decline. Unfortunately, their main replacement group, the `benzodiazepines`
    (e.g. `Librium` and `Valium`), can also create dependency with serious side-effects
    - drowsiness, lethargy, rebound anxiety and toxicity.


    ![image](images/pg48-1.jpg)


    A particular danger is that of lethal overdose, particularly when benzodiazepines
    are taken with alcohol. Despite this, `valium` was the most prescribed drug in
    the USA from 1970s to 1990s.


    ![image](images/pg48-2.jpg)


    Newer anxiolytics include `Busparin` and `Zopiclone`, although they too can have
    side-effects and their long-term efficacy is not yet known. I feel so anxious
    ... I don’t know whether to take these tablets or not!


    As with anti-depressants, anti-anxiety drugs can be very useful for some people
    in short-term assistance in dealing with problems affecting work or family relationships,
    or to help cope with immediate traumas such as bereavement.


    ## Psychodynamic Therapy


    Psychotherapy, as the term is understood today, really began when Sigmund Freud
    invented `psychoanalysis` in 1894 - a system for treating mental disorders. Freud
    believed that his patients’ problems stemmed from earlier childhood experiences.
    He decided it was not enough to try changing their present behaviour but, to achieve
    a permanent cure, it was necessary to root out deeper hidden causes.


    ![image](images/pg49.jpg)


    Conflicts in the mind do not disappear but remain in the unconscious. The mind
    is like a constant battle between different parts – the id, the ego and superego.


    Today, this treatment based on the concept of unconscious dynamic activities -
    whether using Freud’s explanations or those of subsequent analysts - is collectively
    known as `psychodynamic therapy`.


    ## Psychoanalysis


    The purpose of `psychoanalysis` is to uncover the unconscious conflicts responsible
    for an individual’s mental disorder.


    ![image](images/pg50-1.jpg)


    `choanalysis` aims to drain the psychic abscess ... and make the unconscious conscious.


    ![image](images/pg50-2.jpg)


    Once I understand the reasons for my behavior, the conflict can be resolved.


    Detailed accounts of the lives and theories of the major psychoanalysts can be
    found in Icon’s *Introducing* series on Freud, Jung, Melanie Klein, Psychology,
    and others. In this book, the emphasis is on the practical applications of psychoanalysis.


    ## Techniques of Psychoanalysis


    A patient will visit a psychoanalyst at least once a week (sometimes more) for
    about one hour each session, and will continue to do so for several weeks or months
    - or even years! The standard set-up is a room with an armchair for the analyst
    and a couch, or another armchair, for the patient to relax on.


    ![image](images/pg51-1.jpg)


    The room is arranged so that I am not being directly watched by the analyst, to
    avoid feeling inhibited.


    ![image](images/pg51-2.jpg)


    The purpose of the session is for the patient to talk freely to me. I can use
    a range of techniques to facilitate and analyse what the patient says.


    These are the eight techniques used by psychoanalysts


    1. Free association

    2. Word association

    3. Interpretation of actions

    4. Transference

    5. Achieving insight

    6. Dream Interpretation

    7. Hypnosis

    8. Projective techniques


    ## Free Association


    Free association is the most commonly used technique in psychoanalysis. The client
    lies on a couch while the analyst is “out of sight” to avoid distraction.


    ![image](images/pg52.jpg)

