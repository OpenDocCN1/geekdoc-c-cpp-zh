    However, even this was no better than having no treatment at all...


    ![image](images/pg161-2.jpg)


    In the control group, 66% of patients were improved or cured – by spontaneous
    remission without any professional treatment at all.


    Critics of Eysenck (e.g. Oatley, 1984) pointed out problems of measurement – for
    example, therapy “drop-outs” were counted as “failures”. But even taking that
    into account, the “success rate” for psychoanalysis was still only 66%. In other
    words, about two thirds of patients got better regardless of whether they had
    treatment or not!


    ## Other Research and Comparisons


    Other scientific evaluations of mainstream therapies have been more positive.
    For example, some research has found psychotherapy (including behaviour therapy)
    to be 80% successful, compared to less than 50% improvements for controls receiving
    no therapy (Sloane et al., 1975). Another study found cognitive therapy to be
    significantly more effective than analytic psychotherapy (Durham et al., 1994).


    In general, and not surprisingly, therapies that have clear goals – with measurable
    steps to achieve them – are more successful than those that are vague in what
    they are trying to achieve.


    ![image](images/pg162-1.jpg)


    Therapies which make specific medical claims are possible to test and thereby
    can be avoided if they fail.


    ![image](images/pg162-2.jpg)


    For example, iridology – the supposed diagnosis of illness through looking at
    the colours and patterns of the iris - ... has been tested and found to have no
    scientific foundation at all.


    But there are other factors in diagnosis and treatment, such as gender and culture
    ...


    ## The Gender Issue


    In most Western societies, women have been far more often diagnosed and treated
    for mental disorders than men (e.g. two to three times more for clinical depression).
    In the past, this had been attributed to genetic and hormonal differences. But
    there are other possible non-biological explanations based on the difficulties
    created by traditional female gender roles.


    The problems and responsibilities of being a full-time mother, wife, house-keeper,
    employer or employee ...


    ![image](images/pg163.jpg)


    Feminist criticism focus on the dominance of male criteria for assessing mental
    illness and treating it. But women may actually have an advantage over men...
    The trouble with you is ... You Never want to talk. You talk too much. It is generally
    more socially acceptable for women to admit psychological problems and seek help.


    ## The Culture Issue


    Although many countries and societies have common ideas and ideals about mental
    health, there can be important differences. For example, hallucinations or visions
    used to be socially acceptable in the medieval European religious context – as
    they still are in some parts of the world today. (Of course, the terms used to
    describe such experiences are themselves culturally defined and dependent on different
    value systems.)


    ![image](images/pg164.jpg)


    But modern classifications of mental illness in Europe and the USA still associate
    visual and auditory hallucinations... ...with schizophrenia and other psychotic
    disorders. The higher incidence of diagnosed schizophrenia among immigrant populations
    may also be largely due to cultural differences... Immigrants may experience “culture-shock".


    ## Cultural Normality and Tolerance


    Some cultures tend to be more tolerant of “abnormal behaviour than others. But
    the cultural pressures to conform can often be very strong ...


    ![image](images/pg165.jpg)


    I got the blues Oh Lordy, I got the blues ...


    ![image](images/pg166.jpg)


    We’re worried doctor... ...he doesn’t watch TV, doesn’t like football and refuses
    to eat meat... ...There’s something wrong with him!


    ## A Growth Industry


    There has been greater acceptance in recent years of alternatives to the established
    therapies. For example, by the year 2000 in Britain over 40% of doctors offered
    complementary medicine within National Health Service practices, and more than
    70% regularly referred their patients to complementary practitioners.


    However, there is still much scepticism and concern over therapies that are not
    scientifically testable.


    ![image](images/pg167.jpg)


    For many people the most efficient and effective psychotherapies are those based
    on cognitive-behavioural and humanistic methods. But in choosing any therapy,
    whether it’s mainstream or complementary the ultimate decision depends on what
    you personally find is acceptable and useful. As the Dodo said to Alice... Everybody
    has won and all must have prizes


    ## Ethics of Therapy


    Perhaps the most important criteria about whether a “therapist” should be recognized
    is in terms of their professional ethics: is there a clear code of conduct about
    how the therapist behaves and sufficient consideration of the client’s needs and
    welfare?


    The British Psychological Society, for example, has published a comprehensive
    set of codes for ethical practice and conduct. The BPS also publishes a list of
    Chartered Psychologists who are qualified psychotherapists.


    Similar guidelines are provided in the US by the American Psychoanalytical Association
    and the American Psychological Association (both APAs!) and the American Psychological
    Society (APS). Although there is no legal means of retribution, anyone who breaks
    the codes can be excluded.


    Examples from the BPS code include ...


    `Competence`: “Psychologists shall endeavour to maintain and develop their professional
    competence, to recognize and work within its limits.”


    `Confidentiality`: “Psychologists shall... preserve the confidentiality of information
    acquired ... and protect the privacy of individuals or organizations.”


    `Personal Conduct`: “Psychologists shall conduct themselves ... in a way that
    does not damage the interest of the recipients of their services.”


    “Specifically they shall... not exploit the special relationship of trust and
    confidence ... to further the gratification of their personal desires.”


    “They shall refrain from improper conduct in their work ... that would be likely
    to be detrimental to the interests of recipients of their services.”


    “They shall not attempt to secure or to accept any significant financial or material
    benefit beyond that which has been contractually agreed.”


    “Where they suspect misconduct by a professional colleague which cannot be resolved
    after discussion with the colleague, take steps to bring that misconduct to the
    attention of those charged with the responsibility to investigate it, doing so
    without malice and with no breaches of confidentiality other than those necessary
    to the proper investigatory process.”


    (From: `BPS Code of Conduct`, 1985)


    ![image](images/pg168.jpg)


    ## How to Become a Psychotherapist


    Being a psychotherapist is very demanding but rewarding. Do you want to do it?
    Could you do it? How should you go about it? There are three main decisions involved.


    The first decision is about the type of therapy or therapies you are interested
    in – based on the summaries given in this and other books.


    ![image](images/pg170.jpg)


    Seek guidance from trained therapists and their clients. Second, you need to find
    out about training requirements and consider how they would fit into your existing
    qualifications and abilities. To be a psychologist requires a recognized honours
    degree from a university plus the relevant postgraduate training.


    ![image](images/pg171.jpg)


    To be a counsellor or psychotherapist requires training and certificates authenticated
    by official professional bodies. Consult the recommended list of organizations
    and websites on pp.173-4\. Third, you need to find out about the employment prospects
    in your area... ...and decide whether to set up your own private practice or go
    into partnership with others.


    Advice can be gained from existing practitioners and guidebooks (e.g. Schapira,
    2000).


    ## References, Bibliography and Recommended Reading

