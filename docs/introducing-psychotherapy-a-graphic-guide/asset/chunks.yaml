    **• Trager approach:** developed in the 1930s by Dr Milton Trager, who believed
    illness is caused by bad posture. Treatment consists of manipulating the muscles
    and joints, and other exercises, in order to regain youthful suppleness.


    **• Zero balancing:** a combination of Western and Eastern approaches, developed
    by Fritz Smith in the USA (1970s). Practitioners manipulate the lower back, legs
    and feet, then upper back and neck.


    ![image](images/pg134.jpg)


    I feel better already.


    ## Relaxation Therapies


    **Autogenic training** uses mental exercises to achieve deep relaxation. It was
    developed in the 1920s by the German psychiatrist **Johannes Schultz** (1884-1970),
    who coined the term “autogenic” – meaning “generated from within”.


    ![image](images/pg135-1.jpg)


    You suggest to yourself ways of relaxing, in order to relieve stress.


    **Biofeedback** uses electrical measuring equipment – for example, a heartbeat
    monitor – to provide information (“feedback”) to clients about their own bodies.


    ![image](images/pg135-2.jpg)


    By listening to, or watching, such information –


    ...in the form of flashing lights or sound bleeps –


    ...most individuals find they can eventually learn to control certain body function
    –


    ... reducing heart-rate, lowering blood pressure and relaxing muscle tension.'
