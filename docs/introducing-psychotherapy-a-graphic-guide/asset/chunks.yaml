    `Stress inoculation` is a concept developed by `D.H. Meichenbaum` (1988) to cope
    with potentially stressful situations that can cause anxiety. There are three
    stages ...


    ### 1. Cognitive Preparation (or Conceptualization)


    ![image](images/pg98-1.jpg)


    The therapist and client explore different ways of thinking about stressful situations
    – for example, “I won’t be able to cope with that”


    ### 2. Skill Acquisition and Rehearsal


    ![image](images/pg98-2.jpg)


    The therapist helps the client to replace negative statements with positive once
    which are learned and practiced ... I am capable of dealing with that. I rehearse
    stress-producing situations, so I become “inoculated” with some stress.


    ### 3. Application and Follow-through


    ![image](images/pg98-3.jpg)


    The therapist guides the client through situations that are increasingly stressful.
    I grow more capable of coping with the stress, avoiding anxiety and building my
    confidence.


    ## Humanistic Therapy


    `Humanistic therapy` began in the 1940s with the work of `Carl Rogers` (1902-87)
    as a reaction against both the psychodynamic and behavioural approaches. The term
    “humanistic” emphasizes the individuality of human beings who should be seen as
    basically “good”. Every person is a `set of potentials` striving for growth, dignity
    and self-determination. Mental disorders are caused by outside factors that block
    the potential for personal growth. Humanistic therapy aims therefore to help individuals
    remove these blocks and get in touch with their true selves.


    ![image](images/pg99.jpg)


    The individual has within him or herself vast resources of self-understanding,
    ... ... for altering his or her self-concept, attitudes and self-directing behaviour...
    These resources can be tapped if a definable climate of facilitative psychological
    attitudes can be provided.


    ## Rogerian Therapy and Counselling


    The approaches and techniques developed by Rogers are the basis for much of what
    is called `counselling` and other `lay therapy` today. Rogers wanted to get away
    from the traditional way in which people with problems were labelled “patients”
    who are “treated” by “doctors” or other “experts” telling them what to do or not
    to do. Initially, Rogers called his approach `Client-Centred Therapy`, or `CCT`
    (1951) to emphasize this radical change of perspective and replace the term “patient”
    with “client”. Later, Rogers (1974) renamed it `Person-Centred Therapy` (`PCT`)
    in order to further emphasize the human values.


    ![image](images/pg100.jpg)


    The person-centred approach, then, ... ... is primarily a way of being that finds
    its expression in attitudes and behaviours ... ... that promote a growth-promoting
    climate... It is a basic philosophy... ... rather than simply a technique or method.


    `PCT` is also referred to as “non-directive” therapy, which again reflects the
    important fact that Rogerian therapists do not direct clients on what to think
    or do.


    ## Non-directive Therapy


    It might seem that a non-directive therapist has an easy job to do! But in fact
    *not* offering advice or opinions is difficult for many people. This is one reason
    why a demanding training is required. Non-directive therapists avoid asking questions
    about the earlier experiences of their clients and instead concentrate on the
    present and future. Non-directive therapists try to clarify what their clients
    say by re-phrasing and asking them what they think and feel.


    ![image](images/pg101.jpg)


    Rogers has provided trainee-therapists and counsellors with model answers, such
    as when a client asks for advice ... I feel this is the kind of very private thing
    that I couldn’t possibly answer for you, but I will try to help you work towards
    your own answer.


    Rogers himself stopped using the term “non-directive” because he realized it is
    not accurate. A counsellor will often positively reinforce statements made by
    a client with verbal comments (“Yes”, “Good”, etc.) and non-verbal communications
    (e.g. nodding).


    ## Three Main Elements of Rogerian Therapy


    Rogers believed the three important elements that encourage personal growth in
    the therapy situation are: (a) Genuineness, (b) Unconditional positive regard,
    and (c) Empathy.


    ### (a) Genuineness


    (Or “authenticity”, “realness”, “transparency” or “congruence”)


    Genuineness refers to the importance of honesty and openness shown by the therapist
    in order to have a good trusting relationship with the client.


    ![image](images/pg102.jpg)


    This includes the therapist telling me how she feels, even if it is negative ...
    For instance, boredom! Therapists need to live these feelings, be them in the
    relationship, and communicate them if appropriate.


    ### (b) Unconditional positive regard


    (Or “acceptance”, “caring” or “respect”)


    Rogers said that counsellors must learn to be essentially non-judgemental and
    respectful of each client.


    ![image](images/pg103-1.jpg)![image](images/pg103-2.jpg)


    Respect refers to the nurturing conditions the therapist creates with the client,
    allowing him or her to express any feelings openly ... Fear, anger confusion,
    resentment, pride ... It is like the kind of love parents can feel for their children,
    prizing them as people regardless of their particular behaviour at any moment.


    This does not mean the therapist has to *approve* of all the client’s behaviour
    – the element of genuineness is most important. But the general atmosphere of
    acceptance encourages constructive change.


    ### (c) Empathy


    (“Understanding” or “responsiveness”)


    Empathy refers to the therapist being required to “walk in the shoes” of the client
    to understand how he or she thinks or feels. *“To sense the client’s private world
    as if it were your own without ever losing the ‘as if’ quality – this is empathy.”*


    ![image](images/pg104.jpg)


    The ability to empathize, along with the other two elements, highlights the active
    listening skills that a counsellor must develop ... Being able to listen for long
    periods without interrupting.


    This also includes being able to check understanding by sensitively re-stating
    what the client has said – using reflection and feedback.


    ![image](images/pg104-2.jpg)


    Listening is one of the most potent forces for change that I know!


    ## Role of the Rogerian Therapist/Counsellor


    As well as active listening, including passive reflection, the counsellor provides
    *active interpretation* of what the client is saying and doing. This involves
    confronting the client with inconsistencies about what he or she has said, and
    asking key questions for the client to answer.


    ![image](images/pg105.jpg)


    Do you think you are taking responsibility for your actions? The main role of
    the counsellor is to assist me, the client, in making decisions about my present
    and future situations. Other therapists argue that counsellors are not active
    and directive enough in helping clients. This is the criticism of Gestalt therapists
    ...


    ## Gestalt Therapy


    The meaning of the German word `Gestalt`, in this context, is “wholeness”. The
    main aim of Gestalt therapy is in trying to help clients achieve a sense of being
    “a whole person”, rather than feeling fragmented or with “something missing”.
    The founder of Gestalt therapy was `Fritz Perls` (1893-1970).


    ![image](images/pg106.jpg)


    Gestalt therapy is ... not just occupied with dealing with symptoms or character
    structure, but with the total existence of a person. Note that in general psychology,
    the term Gestalt is usually associated with the thinking aspects of the cognitive
    perspective. In psychotherapy, it becomes relevant to the humanistic approach
    which emphasizes the *existence* of the individual.


    ## The Techniques of Perls


    Perls was another practising psychoanalyst until he became dissatisfied with it,
