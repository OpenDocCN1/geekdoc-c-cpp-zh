- fmt: '

    `Hypnotherapy` is used as a means of relaxing clients and to suggest modifications
    in their behaviour when the hypnosis is over. Hypnotherapists can use various
    techniques to induce hypnosis – for example, asking a client to imagine a short
    journey.


    ![image](images/pg136.jpg)


    While hypnotized, clients cannot be made to say or do anything against their principles.


    Hypnotherapy may help some people cope with stress-related problems and certain
    specific bad habits.


    Many hypnotherapists also teach auto-suggestion – training clients to relax and
    talk to themselves about what they want to achieve.


    `Neurolinguistic Programming (NLP)`, a system devised by John Grindler and Richard
    Bandler in the 1970s, also uses suggestion and auto-suggestion. The `NLP` therapist
    analyses the client’s words, facial expressions (especially eye positions) and
    body movements to work out problems. The client is then trained to remodel thoughts
    and sensory associations, allowing the body to use its own healing powers.


    `Meditation` is a state of relaxation that can be achieved through any technique
    that focuses the mind on an object, activity or thought – for example, a picture,
    a breathing pattern or a repeated phrase.


    ![image](images/pg137.jpg)


    Practitioners claim that even a few minutes’ meditation each day can benefit the
    body and mind, and help with social relationships.


    Yoga is a way to relax and stay fit through a series of postures or asanas that
    involve correct breathing and stretching.


    Yoga originated as a Hindu religious discipline that rebalances the physical,
    mental and spiritual aspects of the practitioner’s life. Yoga can be particularly
    helpful for stress-related problems.


    ## Dietary Therapies


    These therapies consist of changes of diet, uses of food supplements, ingestion
    of other substances and various forms of “cleansing” or “detox”.


    `Allergy testing (or “clinical ecology”)` determines how a client reacts to certain
    foods and substances in the environment, e.g. pollen. Based on Hippocrates, it
    was developed by Baron Clements Von Piquet (1906) and then Theron Randolph (1940s).


    ![image](images/pg138.jpg)


    Some people feel very ill when they consume nuts or wheat products. Unfortunately,
    allergy testing can be inaccurate and misleading.


    It is possible to test yourself by an “elimination diet” – not eating a suspected
    food for a month – to see if you feel better without it.


    Increases in “hay-fever” and asthma in recent years may be less directly due to
    pollen than other environmental factors, such as pollution and pesticides.


    `Fasting` is the total or partial avoidance of food and liquid (except usually
    water) for a period of a few hours to several days or more. Fasting is an ancient
    form of healing, prescribed by Hippocrates, and is often linked with the spiritual
    benefits known to all major religions.


    `Naturopaths` believe that everyone would benefit from a fast – one day a week
    or month – to rest the digestive system, detoxify and allow repair processes.


    ![image](images/pg139-1.jpg)


    It’s the regular fasting that keeps me so lissome.


    Just watch out for those Sociopaths, OK?


    `Hydrotherapy` is a therapeutic use of water to cleanse and revitalize the body.


    ![image](images/pg139-2.jpg)


    Spas – places where mineral water occur naturally from springs or rivers – have
    been associated with good health at least since Roman times.


    But it was during the 19th century that hydrotherapy became really popular, due
    especially to Father Sebastian Kneipp, a Bavarian monk. Kneipp developed the variety
    of methods that are still used today in clinics and “health farms”: hot and cold
    showers, hot and cold baths, steam baths, saunas and different body wraps.


    `Nutritional therapy` diagnoses and treats illnesses by studying whether a client
    has a balanced diet (normal food intake) with sufficient proteins, carbohydrates,
    fibre, fats, vitamins and minerals.


    The Jewish philosopher `Maimonides` (1135-1204)


    ![image](images/pg140-1.jpg)


    Let nothing which can be treated by diet be treated by other means.


    ![image](images/pg140-2.jpg)


    Let food be your medicine and medicine be your food.


    Hippocrates


    ![image](images/pg140-3.jpg)


    This may sound straightforward, but there is much debate in scientific circles
    about what a “normal” or “healthy“ diet should ideally consist of...


    ## What is a Healthy Diet?


    The official Recommended Daily Allowance (RDA) for vitamin C is 60 mg. But many
    nutritional therapists argue this is based on `minimum requirements` and so far
    too low for a person leading a stressful life or already showing signs of illness.


    ![image](images/pg141.jpg)


    You should take 500 mg of vitamin C every day.


    Vitamin tablets are a waste of money!


    They didn’t do me any harm.


    Other broadly nutritional therapies include `Biochemic Tissue Salts`, also known
    as Schuessler salt therapy, based on the work of the German homeopath `Dr Wilhelm
    Schuessler` (1821-98) in the 1870s, who believed many illnesses are caused by
    a lack of essential minerals.


    ## Energy Therapies


    This group consists of therapies based on a variety of claimed “energy or vibrational”
    systems, both Eastern and Western, which emphasize the goals of achieving and
    maintaining some sort of “balance”. Most energy therapies are based on ideas that
    are not testable by science and rely on faith in different belief systems. `Ayurveda`
    is the traditional Indian and Sri Lankan belief that everything is made from universal
    energy or `prana` – equivalent to `chi`.


    ![image](images/pg142.jpg)


    The secret of all health matters is simple ...


    Good balance of prana = good health...


    Bad balance of prana = bad health...


    In everyone, prana exists as three forms or `doshas`: vatha, pitha and kapha.
    Your character is dominated by one or two, so you need to find out from Ayurveda
    therapist what you naturally are and get advice about diet, exercises and general
    lifestyle to maintain optimum balance of doshas.


    `Acupuncture` is part of `Traditional Chinese Medicine` (or `TCM`) which has been
    practised over 3,500 years. The central belief is that the universe consists of
    `chi`, the essential life-force, with two component energies: `yin` and `yang`
    – opposites that complement each other.


    ![image](images/pg143.jpg)


    Yin and yang are often symbolized in a circle ...


    Practitioners of TCM believe chi flows through the body via 12 channels or meridians:
    six yin and six yang.


    Acupuncturists imagine each meridian to have 365 critical points or `tsub` which
    determine the flow of chi. By gently inserting fine needles into these points,
    or by applying pressure with finger or thumb (acupressure), the acupuncturist
    can stimulate meridians to restore balance. Such treatment can help with depression
    and anxiety, as well as aches and pains.


    `Chinese herbalism` is also part of TCM which many practitioners use together
    with acupuncture. `Herbal remedies` are prescribed once the patterns of disharmony
    in the client’s body have been identified.


    ![image](images/pg144.jpg)


    We look at general appearance, condition of the tongue...


    sound of the voice...


    body odour...


    and pulse rate...


    and ask questions about lifestyle, health and medical history.


    Herbs have been used since ancient times throughout Greece, Rome, Persia, Egypt
    and India.


    Western herbalism does not rely on theories of yin and yang imbalances, but instead
    emphasizes the medical properties of herbs and their essences – many of which
    are still unknown or not recognized by conventional medicine.


    `Homeopathy` is a form of holistic healing based on similar beliefs to Chinese
    herbalism. A vital force keeps the body healthy and any imbalance means the body
    is trying to heal itself – and may need assistance in so doing. Homeopathy was
    developed by the German doctor and chemist `Samuel Hahnemann` (1755-1843) in the
    late 18th century, although its Western roots go back at least to Hippocrates.

