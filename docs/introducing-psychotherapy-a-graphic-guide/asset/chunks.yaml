    What shall we do? He needs psychotherapy!


    Someone will have to invent it ...


    Who says?


    ## What is Psychotherapy?


    Literally, psychotherapy means “mind-healing”. In practice it is the treatment
    of disorders by using psychological methods - in addition to, or instead of, purely
    medical procedures. But there is often little agreement about exactly what those
    methods include. Indeed, many disagree about how the term itself should be used.


    ![image](images/pg4.jpg)


    Psychotherapy is anything that heals ...


    Or makes you feel better ...


    But isn’t psychotherapy just another word for counselling?


    No! Counselling is just one type of psychotherapy ...


    and there are others ...


    ## Psychotherapy and Counselling


    Psychotherapy really began with Sigmund Freud’s psychoanalysis in 1894. But since
    the mid-20th century there have been other approaches. Today the term “psychotherapy”
    includes many different forms of help given by trained professionals to individuals
    or groups of people.


    ![image](images/pg5.jpg)


    Therapists who call themselves counsellors tend to follow a non-directive, non-judgemental,
    client-centred approach. Many psychotherapists tend to be more directive and more
    active in suggesting or prescribing ways their clients can be helped. This is
    the broad distinction used in this book – although some counsellors call themselves
    psychotherapists and claim the terms are synonymous.


    ## Main types of Psychotherapy


    When a person needs help, the first step is usually to consult a medical doctor
    who will attempt diagnosis and medical therapy. If that is not effective, then
    various psychotherapeutic approaches can be considered. There are today several
    hundred psychotherapies available! But, for convenience, the therapies in this
    book will be divided into seven main groups. The first is `medical` or `somatic
    therapy` – literally “body therapy”, mainly using drugs.


    ![image](images/pg6.jpg)


    The basic assumption in somatic therapy is that there is a chemical imbalance
    causing the problem. Here, take one of these every night – you’ll soon feel better!


    The other six are non-medical therapies.


    ![image](images/pg7.jpg)


    Most “counsellors” are trained mainly in humanistic therapy, but often use cognitive
    and behavioural techniques too.


    ## Who is a Psychotherapist?


    A major problem is that simply anyone can call him or herself a therapist or psychotherapist!
    Even those claiming to possess “qualifications” need very careful scrutiny. Professional
    bodies exist to recognize training and regulate members’ conduct.


    ![image](images/pg8.jpg)


    Psychologists who are qualified psychotherapists should have a university degree
    in psychology and specialist training. Similarly, trained counsellors should normally
    be members of a professional counselling body. The qualifications, training and
    ethics of various psychotherapies are discussed later in this book ...


    ## Who is a Psychiatrist?


    Psychiatrists are qualified medical doctors (MDs) who have further specialized
    training in psychiatric approaches, such as those based on psychoanalysis. In
    Britain, psychiatrists must be medically qualified and are thereby subject to
    the rules of the British Medical Association (BMA).


    ![image](images/pg9-1.jpg)


    In other countries, however, the medical requirements for psychiatrists are not
    always so strict.


    The USA has the American Psychiatric Association, the American Psychological Association
    and the American Psychological Society.


    ![image](images/pg9-2.jpg)


    We will look at psychiatric treatment in more detail later on ...


    ## Other Therapists


    In addition to psychiatrists, psychologists and counsellors, there are many others
    who call themselves “therapists”. For example, people with certificates in aromatherapy
    - the application of pleasant-smelling substances, often by massage (in fact,
    one of their journals is simply called *Therapist*). But this is controversial,
    especially in view of the non-scientific nature of the theories and claims of
    aromatherapy.


    ![image](images/pg10-1.jpg)


    But it is not disputed that aromatherapy can be a relaxing and enjoyable experience
    that can make you feel better. But then, so can many other activities ...


    ![image](images/pg10-2.jpg)


    Want some therapy, dear?


    ## How to choose a Therapist


    Your medical general practitioner may be able to recommend certain therapists
    - for example, those offering psychoanalysis, cognitive-behaviour therapy, osteopathy,
    chiropractic or acupuncture treatments. Recommendations from clients of therapists
    are also valuable. But there are other things to check.


    - Is the therapist professionally qualified? if so, what exactly are the qualifications?

    - How experienced is the therapist?

    - Is the therapist willing to co-operate with your doctor?

    - Does the therapist belong to a recognized professional association, with publicly
    available register, that you can contact through an address or phone number?

    - Does the relevant professional association have published codes of practice
    (ethics), complaints and disciplinary system?


    ![image](images/pg11.jpg)


    Am I and the therapists covered by insurance policies? How much does the treatment
    cost?


    ## Why do People Need Psychotherapy?


    The general reason why people need therapy is that they are finding everyday life
    too difficult.


    ![image](images/pg12.jpg)


    This may include personal problems of day-to-day living and problems of communicating
    with others, at home or at work. I just can’t cope!


    The most common reasons people seek help, or have it requested by others, are
    to do with `depression, anxiety` or problems such as `phobias, obsessions` and
    `compulsions`. Less common conditions include eating `disorders` (anorexia and
    bulimia), `self-harm` and `schizophrenia`. Sometimes people want to generally
    increase their confidence and improve social skills.


    ## Depression


    Depression is the most common psychiatric complaint and was described by the Ancient
    Greek physician `Hippocrates` (460-377 BC), who called it “melancholia”. A person
    who is depressed typically experiences the following …


    ![image](images/pg13.jpg)


    I feel very sad ... Everything seems hopeless ... Nothing ever goes right ...
    I am useless... Other symptoms include lack of energy, lethargy, tiredness ...
    Slowness in thinking and action ... Loss of appetite or over-eating ... Disturbed
    sleep or insomnia


    `Clinical depression` is distinguished from unhappiness caused by grief, which
    is considered an appropriate response to the loss of a loved person or object,
    or other clear reasons for unhappiness. Depression is diagnosed only if the depressed
    mood seems disproportionate to the cause, by being over-long or severe.


    `Manic depression` or `biipolar depression` is a rarer special case where a person
    alternates between extremes of being sad and inactive, followed by being elated
    and very active.


    ## Who Gets Depression?


    Just about anyone may get depression at some time in their lives, although certain
    people seem to be born with the tendency, or acquire it early on. Depressive illness
    brought on by events in life is sometimes called `reactive depression`. Whereas
    that which is without identifiable external causes is `endogenous depression`
    (meaning “from inside”). This distinction, however, is not always useful, because
    in some people depression can come and go. Also, it’s not clear why people react
    to events in different ways. Statistically, depression is more common in women
    (especially between 35 and 45 years of age) than men, although men become more
    prone as they get older. About 10% of the population suffer depression at any
    one time, regardless of economic status or social class.


    ![image](images/pg14.jpg)


    Many famous and successful people, like Winston Churchill (1874-1965), have suffered
    from depression ... I called depression my “Black Dog” – it was a frequent companion.

