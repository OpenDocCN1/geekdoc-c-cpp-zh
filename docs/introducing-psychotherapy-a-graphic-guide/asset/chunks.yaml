    但我确实同意弗洛伊德的，心理疾病是由无意识冲突引起的。他确实使用了梦分析——尽管他的重点是将梦境与当前的问题联系起来，而不是过去的经历。


    伯尔斯（Perls）并没有对格式塔疗法提倡任何固定的规则。但他使用的其他技术包括通过提出具有挑战性的问题，帮助客户对他们真实的感受或需求实现自我意识。“指导实验”是伯尔斯对一系列技术的术语，这些可以单独或集体使用，例如`role-playing`（角色扮演）、`dialogue`（对话）和`first-person
    speaking`（第一人称表达）。


    ## 角色扮演与对话


    `Role-playing` 让客户扮演他人或处于另一种情境时的“感受”。通过`dialogue`（可能可能进行角色扮演），要求客户考虑论点的反正双方。


    ![image](img/pg108-1.jpg)


    例如，治疗师可能会布置两把椅子，让客户交替坐在椅子上，同时考虑冲突的两个方面……但是妈妈，今晚我想去王子的舞会……


    ![image](img/pg108-2.jpg)


    你这坏孩子！你会留在这里打扫杂房的！


    通过表演一个情境，客户被鼓励完成“未竟的事业”，并表达可能被压抑许多年的情感。与罗杰斯式疗法不同，格式塔治疗师可能会积极参与角色扮演或对话中——挑战客户所说出和表现出的。


    ## 放大（Amplification）


    在这一格式塔“实验”中，客户被要求放大某种情感或行为，以便更好地理解正在发生什么。


    ![image](img/pg109.jpg)


    例如，如果客户拒绝承担责任，那么他或她可能会被要求放大其幼稚的行为……我不做！你不能迫我这样做！我会一直叫、一直叫、一直叫，直到叫累！……我可以的，你知道的。


    ## 第一人称表达


    客户（之前）：


    ![image](img/pg110-1.jpg)


    有些人经常害怕对他人表现出兴趣，担心被拒绝。客户不是以一种疏离的“第三人称”方式说这类重要的话，而是被要求直接谈论自己。


    客户（之后）：


    ![image](img/pg110-2.jpg)


    我经常害怕对他人表现出兴趣，因为我担心可能会被拒绝！


    通过将想法和情感重新表述为人人称，客户更有可能意识到自己的特定问题以及处理问题的方法。


    ## 格式塔疗法的“客户规则”


    ![image](img/pg111-1.jpg)


    活在当下！……关注你所拥有的而不是所缺失的，关注现在而不是过去。


    ![image](img/pg111-2.jpg)


    停止不必要的想象和思考！


    ![image](img/pg111-3.jpg)


    ……不要担心那些可能发生或也可能不会发生的无尽可能性。


    ![image](img/pg112-1.jpg)


    不要试图强迫他人或操纵他们！……清晰直接地表达自己，而不是将你的解释、理由和判断强加于他人。


    ![image](img/pg112-2.jpg)


    保持觉察！


    ![image](img/pg112-3.jpg)


    ……不要限制你对发生在你身上以及周围事情的感知——包括对痛苦以及快乐的感知。


    ![image](img/pg113-1.jpg)


    接受你的责任！……不要为自己的行为归怪他人，并为你自己决定应该做什么——不要盲目追从别人的规则。


    ![image](img/pg113-2.jpg)


    ……最后……做你自己！


    ![image](img/pg113-3.jpg)


    ……不要试图成为“别人”，或为了别人的方便而变成他们想要的。


    最后这两条“规则”——接受责任和做自己——也是另一种基于存在主义哲学思想的治疗方法的核心……


    ## 存在主义疗法


    存在主义疗法并不完美契合于任何主要方法，但在这里被作为一种广泛的人文主义方法，强调个人的存在。存在主义疗法基于存在主义者的“日常生活分析”，特别是法国哲学家`Jean-Paul
    Sartre`（1905-80）的理论，对于他来说，在一个除了你自己创造之外没有意义的世界里，个人决策是关重要的。它是关键人文主义心理学家（如`Rollo
    May`，1909-94）工作的基础。


    ![image](img/pg114-1.jpg)


    这就是人文主义，因为我们提醒人类，没有立法者而是他自己；他自己在被遗弃后必须为自己做决定。 大多数人的问题现在是孤独、隔离和异化。


    （摘自《存在主义人文主义》，1948）


    ![image](img/pg114-2.jpg)


    啊是的，希波利特。我感到整个世纪的厌倦都在我的哲学肩上……


    ## 存在主义治疗师


    存在主义治疗师往往倾向于高度的个人主义，并且在兴趣和心理治疗方法上可能存在巨大差异。一些关键作家和从业者有：Ludwig Binswanger、M. Boss、Victor
    Frankl、R.D. Laing、Rollo May 和 Irvin Yalom。


    英国的`R.D. Laing`（1927-89）是 20 世纪 60 年代`反精神病学`运动的一部分，他对医疗行业标签化和治疗“精神分裂症”的方式尤为批判。


    ![image](img/pg115-1.jpg)


    亲亲我，R. D.。他认为通常是精神分裂症的家庭是不理性的……而且，最终西方社会客观来看也不完全理性……


    ![image](img/pg115-2.jpg)


    对圈养动物行为的观察并没有告诉我们关于它们在自然环境中行为的可靠信息。我们整个文明可能就是一个圈禁。*


    （摘自《家庭政治》，1969）


    ## 存在主义疗法的目标


    治疗可以单独进行，也可以小组进行。存在主义治疗师与客户讨论并对质他们如何*体验*生活（而不是关注“诊断和治愈”）。主要目标是帮助人们……


    ![image](img/common.jpg) 为自己在世界中的存在承担责任


    ![image](img/common.jpg) 变得独立和自治


    ![image](img/common.jpg) 运用有意识意图


    ![image](img/common.jpg) 做出伦理选择


    ![image](img/common.jpg) 面对人类正常且不可避免的焦虑


    ![image](img/common.jpg) 超越自我，与他人建立完全的情谊


    ![image](img/common.jpg) 投入爱的关系。


    ![image](img/pg116-1.jpg)![image](img/pg116-2.jpg)


    形成和维持相互关系的能力对大多数人来说很重要。已经开发出一些直接将小组作为治疗核心部分的疗法……


    ## 小组治疗


    以小组而非个体治疗人的概念——鼓励小组成员直接互相帮助——主要由人文主义治疗师开发，特别是卡尔·罗杰斯。小组治疗也可以使用到为止描述的任何主要方法进行。例如，心理动力疗法包括`psychodrama`（心理剧）和`transactional
    analysis`（交互分析）小组技术，而人文主义疗法包括`encounter groups`（相小组）和`sensitivity training`（敏感性训练）。


    ### 心理剧


    `psychodrama`由精神分析学家 Moreno 于 1946 年发明，帮助人们解决导致焦虑的冲突。


    ![image](img/pg117-1.jpg)


    小组中的每个人扮演一个角色或辅助自我，主角必须与他们进行即兴表演。例如，一个对权威人物有问题的人可能会与家庭成员一起表演童年场景……


    ![image](img/pg117-2.jpg)


    你是我爸爸，你为什么要打我？为了你好，儿子！


    ## 心理剧的变体


    `role-reversal`——演员交换角色。


    `doubling`—— 个人扮演同一个角色。


