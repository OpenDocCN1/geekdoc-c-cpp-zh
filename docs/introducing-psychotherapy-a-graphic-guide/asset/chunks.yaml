    艺术治疗最早由 C.G. Jung 正式引入。


    现在它被广泛应用于精神病医院和其他治疗环境。


    `音乐治疗`的形式多样，可以从引导式倾听到根据可用乐器进行的积极参与，并取决于客户的音乐能力。通常会使用打击乐乐器，以及唱歌。


    `舞蹈动作治疗法`于 20 世纪 40 年代在在美国开发。长期以来，人们就知道舞蹈是仪式性愉悦和恢复性社交互动的重要来源。舞蹈治疗师通过“阅读”客户的身体动作（无意识情感的非语言表达）来同时诊断和治疗。


    ![image](img/pg152.jpg)


    你愿不愿意，愿不愿意，愿不愿意，愿不愿意？你愿意加入舞蹈吗？


    戏剧治疗（包括心理剧治疗）通常与舞蹈治疗相结合，以鼓励自我表达。它提供了一个“安全的地方”来探索情感和态度，特别是通过即兴表演。


    `梦境工作`创造性地利用“清梦”——对梦的习得控制——来解决个人问题。鼓励客户在睡眠时召唤出人物和情境。从业者声称梦境工作可以治疗恐惧和其他压力相关的疾病。


    ![image](img/pg153-1.jpg)


    `视觉化`利用想象力的力量进行治愈和其他理想的变化。客户接受心理训练，在脑海中想象自己被治愈，或想象实现某些目标后的感受。可视化通常用于改变态度和提高动力。它也可以专门用于压力管理、疼痛控制、焦虑和恐惧。


    任何人都可以使用视觉化来帮助自己取得成就——运动成功、提高音乐表现、职业成就、人际成功等。


    ![image](img/pg153-2.jpg)


    但正如古话所说……小心你所愿的……以防它成真！当然，这种建议可以在很多书中找到……


    ## 自助书籍


    近年来，所谓的“自助”类书籍大量增长，这些书籍倾向于对瞬间让你的生活变得更好做出夸张的声明。虽然许多书籍提供了合理的建议，但自助书籍通常由一或两个观点扩展到整本书的长度——往往反复使用古老的智慧。


    ![image](img/pg154-1.jpg)


    许多读者似乎在无休止地寻找心理治疗解决方案的圣杯……


    ![image](img/pg154-2.jpg)


    古人偷走了我们所有的好主意。


    ![image](img/pg154-3.jpg)


    读者被警告要小心那些很快就不满足要求的快速解决方案。但这个市场上也有由有资质且经验丰富的咨询师、心理学家和医生编写的书。


    ## 如何赢得朋友并影响他人


    `戴尔·卡内基基`（1888-1955）的自助书籍经受了时间的考验：《如何赢得朋友并影响他人》（1936）和《停止忧虑开始生活》（1937）。


    作为自助书籍的典型，卡内基基也使用文学引用以及普通人和名人的轶事来产生并阐述观点……


    ![image](img/pg155-1.jpg)


    没有绝对的好坏…………但思想决定了好坏。大多数人的快乐程度取决于他们决定让自己多么快乐。


    ![image](img/pg155-2.jpg)


    自助书籍的价值主要是主观的——正如一般的疗法一样……


    ## 治疗评估


    治疗的评估非常困难。其一原因是，许多诊断是无法衡量的。这不仅适用于更深奥或神秘的补充疗法，也适用于许多被接受的主流治疗，例如有资质的医生使用的心理动力技术。正如哲学家`卡尔·波普尔`（1902-94）指出的，西格蒙德·弗洛伊德和其他分析学家发明的理论根本无法通过科学验证。


    ![image](img/pg156-1.jpg)


    一个理论要成为科学的，必须是可测量并接受测试的。但问题仍然——哪些测量是重要的？


    ## 治疗测量


    要判断任何治疗是否有效，行为上必须有某种可观察的变化，或者至少客户的情绪和观点有报告的差异。但谁是判断这一点的最佳人，跨度多久？评估应该由治疗师、客户、朋友或亲属，还是独立的专业观察者来进行？客户在某些治疗后表示“感觉好多了”是否意味着治疗是合理且有效的？


    也许任何心理治疗中最重要的因素是客户相信它对他们有帮助——即安慰剂效应……


    ![image](img/pg156.jpg)


    你并没有患抑郁症…………但你确实有人格障碍…………以及关于你性取向的未解决问题。非科学理论的问题在于，永远无法说或做任何事来反驳它们！没关系！现在感觉好多了！客户是自己人格和行为的最佳判断者吗？显然，有时他们不是！


    ## 安慰剂效应


    安慰剂是指任何没有医疗价值，但患者认为是是药物或疗法，并据此做出反应的东西。在测试新药时，这相当直接。一半的志愿者将随机获得含有活性成分的药片，而另一半人在不知情的情况下将各获得外观完全相同的惰性药片，其中可能含有少量的糖或盐以提供味道。为了防止任何其他影响，此类实验通常是“双盲”的，即即使实验者也不知道哪些是真正的药物，哪些是安慰剂。


    ![image](img/pg158.jpg)


    显然，如果志愿者或助手知道哪些药片是安慰剂，就会破坏实验……我想让你每天吃一次这些药片……


    ## 心理治疗安慰剂


    在科学地测试心理治疗的有效性时，安慰剂原理也被使用——但很难找到对应的“惰性药片”。在实践中，使用了某种形式的放松或讲故事，尽管并不意外，安慰剂组的志愿者通常会感觉更好！


    ![image](img/pg159-1.jpg)


    对于某些疗法，很难设计出令人信服的安慰剂……事实上，给予任何人的任何关注都有成为治疗的潜力！


    ## 安慰剂的力量


    在治疗心理疾病时，安慰剂的效果往往与药物相当。在一项关于抑郁的大型研究中，患者对安慰剂药片的反应几乎与抗抑郁药物或心理治疗一样。


    一些愤俗者认为，许多如果不是所有的心理治疗只是几个世纪以来出售的巫药或其他用的药水……


    ![image](img/pg160-1.jpg)


    最好无害——最坏造成长期损害。


    ![image](img/pg160-2.jpg)


    蛙腿……螞尾……


    类似的观点也可以适用于信仰或灵性治愈。卢德是神圣干预的焦点，还是一个著名的“安慰剂之地”？


    ## 治疗的科学评估


    首次系统性的治疗评估是由汉斯·艾森克`（1916-97）于 1952 年进行的，他比较了心理分析和折衷心理治疗（使用多种方法）。他得出结论，只有 44%的心理分析是成功的——以患者“好”、“好很多”或“治愈”为衡量标准。使用相同标准的折衷心理治疗的成功率为
    64%。


    ![image](img/pg161-1.jpg)

