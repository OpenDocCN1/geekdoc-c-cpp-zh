    在选择补充性治疗师时，始终建议检查他们的专业资质并提前告知您的医生。我的治疗方法是整体性的——源自希腊语中的“整体”之意——它考虑了您的情绪、心理、社交和精神生活。


    补充性疗法没有标准的分类系统。因此，为了方便起见，它们被归类为以下七类：(i) 物理，(ii) 放松，(iii) 饮食，(iv) 能量，(v) 信仰，(vi)
    创造力和 (vii) 自助。


    ## 物理疗法


    这些补充性疗法基于手法——例如按摩和姿态调整——但也可以包括呼吸等其他物理运动。一个例子是`Alexander technique`（亚历山德技巧），由演员
    `Frederick Matthias Alexander`（1869-1955）在 19 世纪后期发明，当时他在表演期间曾过声音投射的问题。


    ![image](img/pg128-1.jpg)


    我发现，自然的、无压力的姿态对于身心健康至关重要。因此，我开发了一套重新训练人们坐、立、走的系统。


    ![image](img/pg128-2.jpg)


    `Alexander technique` 可以帮助缓解压力、焦虑和抑郁，以及背痛等。噢，我的背好痛！


    `Aromatherapy`（芳疗法）始于古埃及使用芳香植物制作化妆品和防腐。希波克拉底主张在洗浴和香薰按摩中使用芳香精油。在几个世纪里，各种芬香的物质被用来驱逐恶灵和感染（如瘟疫）。现代芳疗法于
    20 世纪 30 年代由三位法国人开发——化学家 René-Maurice Gattefosse、军医 Jean Valnet 博士和 Marguerite
    Maury 夫人——他们创建了一个整体系统，将精油与个人而非症状相匹配。


    ![image](img/pg129.jpg)


    精油从植物的种子、根部、树皮、叶子或花朵中提取。芳疗治疗师会将这些油按摩入体内……油会进入您的皮肤，改善您的情绪健康。


    `Chiropractic therapy`（整骨疗法）源自希腊语 `kheir`（意为“手”）和 `praktikos`（意为“使用”）。现代手法技术由加拿人
    Daniel D. Palmer 于 1895 年开发，他首次治愈了一名因旧背背伤导致耳聋的洁工。整骨医生认为脊柱是健康的关键。


    ![image](img/pg130.jpg)


    因此，整骨医生通过操控脊柱及其他部位的骨骼来治疗各种问题，例如头痛、偏头痛、哮喘、消化不良。我听到了！脊柱的任何错位都会影响全身。


    整骨疗法的变体包括由美国人 Joseph Heller 在 1978 年开发的 `Hellerwork`、由英国整骨医生 John McTimoney 开发的
    `McTimoney therapy`，以及由美国生物化学家 Ida P. Rolf 博士在 20 世纪 30 年代开发的 `Rolfing`（筋膜整合）。


    `Light therapy`（光疗法）字面意思是使用自然日光或来自特殊灯泡的光线来帮助人们感觉好些。古埃及人、希腊人、罗马人和阿拉伯人都写过阳光的治愈力量……


    ![image](img/pg131-1.jpg)


    你注意吗？……在沙漠里你很少遇到抑郁的人……


    ![image](img/pg131-2.jpg)


    又是美好的一天……


    丹麦麦医生 Niels Finsen 因应用紫外线（阳光的不可见组成部分）治疗肺结核而获得 1903 年诺贝尔医学奖。今天人们认识到阳光会触发皮肤产生维生素
    D，而且对于通过大脑产生褪黑素来调节我们的“生物钟”也很重要。光疗法，特别是“光箱”形式，用于治疗因缺乏日光导致的抑郁症——这通常被称为季节性情感障碍（SAD）。


    `Massage`（按摩）——或物理手法——通过用掌和手指揉搓客户身体，是世界上最老的物理疗法之一。它在古希腊和罗马人中非常流行。19 世纪，瑞典体操运动员
    Per Henrik Ling 开发了现在通的“瑞典按摩”。奥地利心理分析学家 `Wilhelm Reich`（1897-1957）认为按摩可以直接影响导致神经质性“性格盔甲”的压抑情绪。


    ![image](img/pg132.jpg)


    按摩可以释放身体积聚的愤怒——并将其转化为恢复生命的高潮，这种高潮可以保护我们免受癌症侵害！


    无论是否使用莱希式的解释，所有治疗师都认为按摩可以从心理上帮助客户，许多人声称它可以专门帮助焦虑、抑郁、失眠和压力相关状况。


    `Osteopathy`（整骨疗法）由美国人 `Dr Andrew Taylor Still`（1828-1917）于 1874 年开发，其理论基础是疾病由于受伤、不良姿势和情绪引起的有害张力对身体自然健康设计造成的有害变化。整骨医生通过操控可能导致拉伤的任何部位——无论是骨骼、肌肉、韧带或其他结缔组织——协助身体自愈。


    ![image](img/pg133.jpg)


    好了，修好了。你可能会感觉几天有点僵硬，但之后就没事了。


    啊！这种疗法贵吗？


    不，它是免费的*


    (* 讽刺)


    ## 其他主要的物理疗法


    - `Applied kinesiology`（应用动力学）：由 George J. Goodheart 于 1964 年开发的肌肉诊断和治疗法。

    - `Bioenergetics`（生物能量学）：由 Alexander Lowen 在 20 世纪 60 年代开发的类似于太极和普拉提的运动。

    - `Bowen technique`（波文术）：由 Tom Bowen 在 20 世纪 70 年代开发的轻柔、非侵入性按摩和其他触摸动作，作用于身体的结缔组织。

    - `Buteyko`（布泰科）：以一位世纪 50 年代的俄罗斯科学家命名，他认为要保持健康需要正确呼吸。

    - `Eye Desensitization and Reprocessing therapy (EMDR)`（眼动脱敏与再处理法）：由 Francine
    Shapiro 博士在 20 世纪 80 年代开发，训练客户眼动以减少负面记忆和想法。与某些神经语言程序相似。

    - `Feldenkrais`（费登奎莱尔）：以一位俄罗斯柔道专家命名，他通过研究身体姿态和运动来治疗运动损伤。

    - `Flotation therapy`（浮力疗法）：客户浮在黑暗、隔音的水箱中，由美国人 John C. Lilly 开发。在缺乏视觉和听觉刺激的情况下漂浮可以促进放松，并称能触发内啡肽（天然止痛剂）的产生。

    - `Trager approach`（Trager 法）：由 Milton Trager 博士于 20 世纪 30 年代开发，认为疾病是由不良姿势引起的。治疗包括操控肌肉关节和其他运动，以恢复年轻的活力。

    - `Zero balancing`（零平衡）：西方和东方方法的结合，由 Fritz Smith 在美国开发（20 世纪 70 年代）。治疗师操控下背部、腿和脚，然后是上背和颈部。


    ![image](img/pg134.jpg)


    我感觉好多了。


    ## 放松疗法


    `ogenic training`（自源训练）利用心理练习达到深度放松。它由德国精神学家 `Johannes Schultz`（1884-1970）于 20
    世纪 20 年代开发，他创造了“自源”一词——意思是“从内部产生”。


    ![image](img/pg135-1.jpg)


    你向自己建议放松的方法，以缓解压力。


    `Biofeedback`（生物反馈）使用电气测量设备——例如心率监测仪——向客户提供关于他们身体的信息（“反馈”）。


    ![image](img/pg135-2.jpg)


    通过倾听或观察此类信息（以闪烁灯光或提示声的形式），大多数人发现他们最终可以学会控制某些身体功能——降低心率、降低血压和放松肌肉张力。


