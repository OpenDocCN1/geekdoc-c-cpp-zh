    - Mood disorders (including depressive disorders)

    - Anxiety disorders (including panic attacks and phobias)

    - Somatoform disorders (including hypochondria)

    - Dissociative disorders

    - Adjustment disorders

    - Disorders diagnosed in childhood (including retardation, learning disorders
    and attention deficiency)

    - Personality disorders (including antisocial, dependent and obsessive-compulsive
    disorders)

    - Sexual and gender identity disorders (including fetishism and voyeurism)

    - Impulse control disorders (including kleptomania)

    - Sleep disorders and eating disorders


    ![image](images/pg25.jpg)


    Others include relationship disorders, physical abuse, neglect, bereavement and
    occupational problems... Which one shall I choose...?


    ## Distinctions between Psychosis and Neurosis


    Schizophrenia is an example of a `psychosis` – a mental illness where the whole
    of a person’s life can be affected and he or she may not be aware of the disorder.
    A `neurosis` affects only certain parts of people’s lives, and they are usually
    aware of the disorder. Examples of neuroses can be phobias, obsessions and compulsions.
    Although some therapists still find these distinctions useful, these labels are
    not used so much now. Some clients do not consistently fit into either one or
    the other.


    ![image](images/pg26.jpg)


    Current classification system have dropped the `psychosis/neurosis` distinction,
    but `ICD` still uses the term `“neurotic"` and `DSM` still uses `“psychotic”`.


    ## The Immediate Goals of Psychotherapy


    Examples of schizophrenic and other psychotic behaviours highlight an issue common
    to all situations of psychotherapy, namely the question: *what are the goals?*
    Traditional concepts of `“cures” are often not relevant - as, indeed, they are
    not always relevant in many medical circumstances, such as when a person develops
    a terminal illness.


    ![image](images/pg27.jpg)


    It is often more appropriate to talk about `“coping strategies” or “quality of
    life”` ... For example, by encouraging individuals to achieve realistic personal
    goals and concentrate on the enjoyment of everyday opportunities.


    ## The Broader Goals of Psychotherapy


    Coping and qualitative goals are often difficult to quantify, thereby making evaluation
    of therapies problematic. But there is a need to appreciate the wider social and
    economic benefits of psychotherapy, as well as the personal.


    ![image](images/pg28.jpg)


    For example, the positive aspects of `“Care in the Community”` can mean much more
    than just the fact that some individuals are no longer incarcerated for life in
    isolated institutions. Enabling them to live more fully in a local community is
    arguably intrinsically better for those individuals and may help the rest of society
    become more tolerant towards the less fortunate.


    ## Why is Psychotherapy Important?


    The psychotherapy considered here concentrates less on academic interests and
    more on the practicalities of improving life. There are several ways in which
    studying psychotherapy can help you.


    ![image](images/pg29.jpg)


    If you are feeling generally sane and mentally healthy, then lucky you! (Although
    it could be a delusion of course!) Knowledge of psychotherapy can help you appreciate
    and maintain mental health. If you have problems, then it’s important to know
    that help is out there.


    Knowing about the different types of therapy available can help in deciding the
    most appropriate for your own needs.


    ## Helping Others ...


    If you know of someone else who has problems, you may be able to assist them to
    seek professional help. Again, choosing an appropriate therapist is crucial. If
    you are interested in pursuing psychotherapy professionally yourself, then you
    will need to be aware of the different types available and what training is required.


    ![image](images/pg30-1.jpg)


    In general there is still a need in society for much greater understanding to
    defeat the social stigmas of `“mental illness”` and counter the myths about it.


    ![image](images/pg30-2.jpg)


    Many of these myths are rooted in the past... Well? Are you a which?


    ## Brief Background to Psychotherapy


    The Ancient Greek philosopher `Empedocles` (c. 490-430 BC) tried to explain everything
    in terms of `“four elements”`: fire, water, earth and air. `Hippocrates`, the
    Father of Medicine, believed each of these had corresponding bodily `“humours"`
    that needed to be balanced in order to remain well: blood (fire), phlegm (water),
    black bile (earth) and yellow bile (air). He explained mental illness as imbalances
    of these humours.


    ![image](images/pg31.jpg)


    Our pleasures, joys, laughter and jests, as well as our sorrows, pains, grief,
    and tears... these things we suffer all come from the brain when it becomes too
    hot, cold, moist or dry ... madness comes from its moistness!


    Modern medicine suggests that `Hippocrates` may have been at least partially correct.
    Dehydration can cause headaches and changes in mood. Certain brain substances
    (neurotransmitters) are necessary for thought processes, while drugs and toxins
    can interfere with those processes.


