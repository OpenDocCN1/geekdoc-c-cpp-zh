    ![image](images/pg145-1.jpg)


    I found that when I took a small dose of quinine, it seemed to cause symptoms
    of malaria.


    I concluded that there is a principle of “treating like with like” – a substance
    that causes symptoms of an illness can also be used to cure it.


    ![image](images/pg145-2.jpg)


    No tonic water for me, thanks.


    For example, a homeopathic remedy for blocked sinuses would be a small dose of
    a substance that would actually create the problem if given in large amounts.
    The most fascinating thing about homeopathy is the minute amount of active substance
    that is contained in each pill or powder – with the `most` diluted (graded “m”)
    being paradoxically the most potent.


    `Reflexology` is the manipulation of the feet – and sometimes other smaller parts
    of the body (for example, the hands) – to treat illnesses. Reflexologists believe
    that when you lie down on your back with your feet together, these represent your
    whole body.


    ![image](images/pg146-1.jpg)


    Different “reflex points” on the feet correspond to different parts of the body,
    approximately in the same relative positions.


    ![image](images/pg146-2.jpg)


    This is where your problem is ... in your head!


    There is no scientific evidence for reflexology and its origins are unknown.


    Supporters claim it was invented in ancient China, but the term “reflexology”
    was coined by an American, Eunice Ingham, in the 1920s. She adapted the ideas
    of `Dr William Fitzgerald` (1872-1942), who divided the body into ten vertical
    zones and claimed that by applying pressure to parts of a hand, he could reduce
    pain in another part of the body. (A variation of reflexology is the `Metamorphic
    technique`.)


    `Reiki` (pronounced “ray-key”), meaning “universal life-force” in Japanese, is
    based on similar theories to TCM. Invisible energies flow everywhere and blockages
    in the body can cause illness. Reiki was developed in the late 19th century by
    Mikao Usui, a Japanese Christian theologian. Inspired by Gospel stories of Christ’s
    healing powers, Usui devised a system for training Reiki practitioners and rituals
    for healing – usually with the client sitting or lying down.


    ![image](images/pg147-1.jpg)


    Mind if I join you? I’m a bit tired...


    ![image](images/pg147-2.jpg)


    These are Reiki Principles ...


    `Seichem` (pronounced “say-keem”) is a healing system based on Reiki but involving
    deeper study, and more complex rituals and symbols (e.g. the Tera-Mai system developed
    by Kathleen Milner).


    ## Other Energy Therapies


    - `Aura healers` claim to be able to see bands of colour around the client that
    provide diagnosis and heal by moving their hands through this aura to change the
    colours.

    - `Biodynamic therapy` uses massage to unblock emotions and encourage energy flow.
    (Geda Boyesan, 1960s)

    - `Bioresonance Therapy (BRT)` is based on the belief that cells in the body oscillate
    at different frequencies: “harmonic” = healthy; “disharmonic” = unhealthy. A bioresonance
    machine, connected to two metal bars or balls held in the hand, measures you.
    (Morell, 1970s)

    - `Biorhythms are` daily cycles of energy governing physical, emotional and intellectual
    potentials. (Wilhelm Fleiss, an erstwhile friend of Sigmund Freud, c. 1900)

    - `Colour therapy` is based on the theory that everything vibrates at its own
    frequency, so colours can be used to rebalance the body. (Max Luscher, 1940s)

    - `Crystal and gemstone healing` attributes healing and mystical powers to lumps
    of rock.

    - `Feng shui` arranges households, workplaces, etc., to maximize the potential
    of objects being “in the right place” and to remove blockages of energy.

    - `Flower remedies` control emotional states and imbalances. The most famous is
    the Bach (pronounced “Batch”) system of flower essences developed by Dr Edward
    Bach.

    - `Geopathic therapy` is based on “negative energy” or “geopathic stress” created
    by underground streams, geological faults and human-made structures, e.g. power
    cables. (Geomagnetic factors may be scientifically involved in seasonal depression
    by influencing the production of brain chemicals, e.g. melatonin and serotonin.)

    - `Magnetic therapy`, also known as magnetotherapy or biomagnetic therapy, uses
    magnets to heal.

    - `Naturopathy`, developed from 19th-century “nature cures”, is based on sunlight,
    fresh air, exercise, cleanliness and natural foods. Naturopaths find the causes
    of imbalance in your “vital force” and recommend ways you can encourage your body
    to heal itself.

    - `Polarity therapy`, developed by Dr Randolph Stone, combines Eastern and Western
    ideas about vital energy flowing between two poles – positive and negative – with
    illness being caused by blockages. Energy flow is stimulated by touch (similar
    to acupressure), postures (similar to yoga) and other techniques.

    - `Qigong` (pronounced “chee gong”), or “chi kung”, combines mental concentration,
    breathing techniques and movements to allow energy to flow throughout the body.

    - `Radionics`, developed by Albert Abramas in the 1920s, is a system of diagnosis
    and treatment that can occur in the absence of the client: a “witness” (e.g. a
    lock of hair) is “read” and used to transmit energy from the person.

    - `Shiatsu`, meaning “finger pressure”, is a combination of TCM and massage that
    developed mainly in Japan – similar to acupressure and related massage.

    - `Sound integration therapy`, based on Pythagoras (c. 550-500 BC) (“the music
    of the spheres”) restores vibrational balance and heals using the voice or musical
    instruments.

    - `T’ai chi` (or T’ai chi chuan) is characterized by slow-moving physical exercises
    based on martial arts that use the whole body. It helps rebalance the energies
    that flow through invisible channels called “meridians”, similar to the ideas
    behind acupuncture.

    - `Therapeutic Touch (TT)`, developed by Krieger in 1970s, diagnoses energy imbalance
    and sends beneficial energy from one person to another – usually without actually
    touching the body (the practitioner’s hands a few inches away).

    - `Tuina` (pronounced “tweena”), meaning “push and grasp”, is related to traditional
    Chinese medicine and acupuncture. Therapists use their fingers to manipulate parts
    of the body to restore balance.


    ![image](images/pg148.jpg)


    ## Faith Therapies


    - `Spiritual or faith healing`, sometimes called “laying on hands”, was used by
    the ancients and has long been common in major religions – for instance, the healing
    powers of Christ and his disciples. But in Europe, during the Middle Ages, it
    became unpopular due to its associations with witchcraft. Since the 19th century,
    such healing has become increasingly popular and accepted.

    - `Faith therapies` are usually based on spiritual belief systems, in both the
    narrow religious sense and broader spiritual meaning.

    - Faith healing usually requires the client to believe in God, or some other deity,
    and the abilities of the healer. Other forms of spiritual healing don’t necessarily
    require such beliefs. In `distant healing`, healers claim to operate without being
    near the client. In some cultures, it is common for the healer to go into a trance
    to diagnose and heal – for example, in shamanism.


    The healer “lays on hands” either directly or near to the body ...


    I act as a channel for divine energy.


    ## Creativity Therapies


    Therap based on creativity include those involving art (drawing, painting and
    the use of other media), music, dance, drama, dreamwork and visualization. Art
    and music have been used in hospitals since the 1940s when they were included
    in the treatment of war veterans recovering from stress and trauma.


    ![image](images/pg151.jpg)


    Creative therapies can help with all types of psychological problems.

