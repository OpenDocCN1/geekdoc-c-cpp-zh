    ![image](img/pg145-1.jpg)


    我发现当我服用小剂量的金鸡藜时，它似乎引起了疟疾的症状。


    我得出的结论是一个“物治物”的原则——一种引起疾病症状的物质也可以用来治疗这种疾病。


    ![image](img/pg145-2.jpg)


    我不喝汤力水，谢谢。


    例如，一种治疗鼻窦阻塞的顺势疗法是使用小剂量的某种物质，这种物质在大剂量下实际上会产生问题。顺势疗法最迷人的地方在于每颗药丸或粉末中含有的活性物质含量极微——`最`稀释的（标记为“m”）反而是药效最显著的。


    `Reflexology`（足疗法）是通过按摩脚部（有时是身体的其他较小部位，例如手）来治疗疾病。足疗治疗师认为，当你仰卧并将双脚并拢时，它们代表了你的整个身体。


    ![image](img/pg146-1.jpg)


    脚上不同的“反射点”对应于身体的不同部位，大致处于相同的相对位置。


    ![image](img/pg146-2.jpg)


    你的问题就在这里……在你的头上！


    足疗法没有科学依据，其起源尚未知。


    支持者声称它发明于古代中国，但“reflexology”一词是由美国人 Eunice Ingham 在 20 世纪 20 年代提出的。她采用了`Dr William
    Fitzgerald`（1872-1942）的思想，将身体分为十个垂直区域，并声称通过按压手部部位可以减轻身体另一个部位的疼痛。（足疗法的变体是`Metamorphic
    technique` 变换法。）


    `Reiki`（灵气，读作“ray-key”）在日语中意为“宇宙生命力”，其理论与中医（TCM）相似。无形的能量流处处不在，身体的阻塞会导致疾病。灵气是由
    19 世纪末的日本基督教神学家井治治（Mikao Usui）开发的。受福音书中基督治愈能力故事的，井治设计了一套训练灵气治疗者的系统和疗愈仪式——通常让客户坐着或躺着进行。


    ![image](img/pg147-1.jpg)


    介意我加入你吗？我有点累……


    ![image](img/pg147-2.jpg)


    这些是灵气原则……


    `Seichem`（赛奇姆，读作“say-keem”）是一种基于灵气的疗愈系统，但涉及更深层次的研究以及更复杂的仪式和符号（例如由 Kathleen Milner
    开发的 Tera-Mai 系统）。


    ## 其他能量疗法


    - `Aura healers`（气场治疗师）声称能够看到客户周围的色带，通过用手穿过这些气场并改变颜色来提供诊断和治愈。

    - `Biodynamic therapy`（生物动力疗法）利用按摩来疏通情绪并鼓励能量流动。（Geda Boyesan, 1960s）

    - `Bioresonance Therapy (BRT)`（生物共振疗法）基于一种信念：人体细胞以不同的频率振动：“谐和” = 健康；不和谐” = 不健康。连接到手持两个金属棒或球的对你进行测量。（Morell,
    1970s）

    - `Biorhythms are`（生物节）是支配身体、情感和智力潜力的每日周期。（Wilhelm Fleiss，西格蒙德·弗洛伊德的朋友，约 1900
    年）

    - `Colour therapy`（色彩疗法）基于一种理论：万物都按照自己的频率振动，因此可以使用颜色来重新平衡身体。（Max Luscher, 1940s）

    - `Crystal and gemstone healing`（水晶宝石治疗）赋予岩石治愈和神秘力量。

    - `Feng shui`（风水）安排家居、工作场所等，使物体处于“正确位置”的潜力最大化并消除能量阻塞。

    - `Flower remedies`（花疗法）控制情绪状态和失衡。最著名的是由 Edward Bach 博士开发的巴奇（读作“Batch”）花花精华系统。

    - `Geopathic therapy`（地医疗法）基于地下径流、地质断层和人为结构（例如电源电缆）产生的“负能量”或“地质应力。（地磁因素可能通过影响脑化学物质（如褪黑素和血清素）的产生，在科学上参与了季节性抑郁。）

    - `Magnetic therapy`（磁疗法），也称为磁疗或生物磁疗法，使用磁铁进行治愈。

    - `Naturopathy`（自然疗法）开发于 19 世纪的“自然疗法”，基于阳光、新鲜空气、运动、清洁和天然食物。自然疗法师发现你“生命力”失衡的原因，并建议你鼓励身体自我治愈的方法。

    - `Polarity therapy`（极性疗法）由 Randolph Stone 博士开发，结合了关于在两极（正和负）之间流动的生命的东方西方思想，认为疾病是由阻塞引起的。通过触摸（类似于按摩）、姿势（类似于瑜伽）和其他技术刺激能量流动。

    - `Qigong`（气功，读作“chee gong”）结合了精神专注、呼吸技巧和动作，使能量能够流遍全身。

    - `Radionics`（无线电动力学）由 Albert Abramas 在 20 世纪 20 年代开发，是一种可以在客户不在场的情况下进行的诊断和治疗系统：读取一个“见证物”（例如一缕头发）并用于传输来自该人的能量。

    - `Shiatsu`（指压）意为“手指压力”，是中医和按摩的结合，主要在日本发展——类似于穴按摩和相关按摩。

    - `Sound integration therapy`（声音整合疗法）基于毕达哥拉斯（公元前 550-500 年）的“天体音乐”，通过声音或乐器恢复振动平衡。

    - `Tai chi`（太极拳）是一种基于武术的缓慢动作练习，有助于能量通过被称为“经络”的无形通道。

    - `Therapeutic Touch (TT)`（治疗性触碰）由 Krieger 在 70 年代开发，用于诊断能量失衡并将能量从一个人传递给另一个人——通常不接触身体（治疗师的手离身体几英寸）。

    - `Tuina`（推拿，读作“tweena”）是中医和按摩的结合，治疗师用手指操纵部位以恢复平衡。


    ![image](img/pg148.jpg)


    ## 信仰疗法


    - `Spiritual or faith healing`（精神或信仰疗愈）有时被称为“按手”，古代曾使用，长期以来在主要宗教中常见——例如基督及其门徒的治愈能力。但在欧洲中世纪，由于与巫术有关而变得不再流行。从
    19 世纪开始，这种疗愈变得越来越受欢迎和接受。

    - `Faith therapies`（信仰疗法）通常基于精神信仰系统，包括狭义的宗教意义和广泛的精神意义。

    - 信仰疗愈通常要求客户相信上帝或其他神，以及治疗师的能力。其他形式的精神疗愈并不一定这些信仰。在`distant healing`（远程疗愈）中，治疗师声称可以在客户不在的情况下进行。在某些文化中，治疗师进入迷状态进行诊断和治愈是很常见的——例如萨满教。


    治疗师直接或靠近身体按手……


    我是神性能的通道。


    ## 创意疗法


    基于创意的疗法包括艺术（绘画和使用其他媒体）、音乐、舞蹈、戏剧、梦境工作和可视化。艺术和音乐自 20 世纪 40 年代起就被医院使用，用于从压力和创伤中恢复的退伍军人的治疗。


    ![image](img/pg151.jpg)


    创意疗法可以帮助所有类型的心理问题。


