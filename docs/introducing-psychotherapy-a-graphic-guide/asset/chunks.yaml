    然而，即便如此，这并不比完全不治疗更好


    ![image](img/pg161-2.jpg)


    在对照组中，66% 的患者得到了改善或痊愈——这是在完全没有任何专业治疗的情况下通过自发缓解实现的。


    艾斯克（Eysenck）的批评者（例如 Oatley, 1984）指出了衡量方面的问题——例如，治疗中的“退出者”被计为“失败”。但即使考虑了这一点，精神分析的“成功率”仍然只有
    66%。换句话说，大约三分之二的患者无论是否接受治疗，病情都会好转！


    ## 其他研究与对比


    对主流疗法的其他科学评估更为积极。例如，一些研究发现，心理治疗（包括行为疗法）的成功率为 80%，而未接受治疗的对照组改善率低于 50%（Sloane et
    al., 1975）。另一项研究发现，认知疗法比分析性心理治疗明显有效得多（Durham et al., 1994）。


    总来说，意不意外，具有明确目标（即具有可衡量的实现步骤）的疗法，比那些目标模糊的疗法更成功。


    ![image](img/pg162-1.jpg)


    做出特定医疗主张的疗法是可以测试的，因此如果失败是可以避免的。


    ![image](img/pg162-2.jpg)


    例如，虹膜诊断法——即所谓的通过观察虹膜的颜色和图案来诊断疾病——……经过测试后被发现完全没有科学依据。


    但在诊断和治疗中还有其他因素，例如性别和文化……


    ## 性别问题


    在大多数西方社会中，女性接受心理疾病诊断和治疗的频率远高于男性（例如，临床抑郁症的比例是男性的两到三倍）。过去，这被归于遗传和激素差异。但根据传统女性性别角色所制造的困难，还有其他可能的非生物学解释。


    作为全职母亲、妻子、家务人员、雇主或员工面临的问题和责任……


    ![image](img/pg163.jpg)


    女性主义批判关注的是男性标准在评估和治疗心理疾病方面的主导地位。但女性实际上可能比男性更有优势……你的问题在于……你**根本不想说话。你话太多了。** 通常情况下，女性承认心理问题并寻求帮助更容易被社会接受。


    ## 文化问题


    尽管许多国家和地区对心理健康有共同的观念和理想，但可能存在重要的差异。例如，幻觉或幻象在中世纪欧洲的宗教背景下曾是社会可以接受的——在当今世界的某些地区也是如此。（当然，描述此类经历的术语本身是文化定义的，并取决于不同的价值体系。）


    ![image](img/pg164.jpg)


    但欧洲和美国对心理疾病的现代分类仍然将视觉和听觉幻觉…………与精神分裂症和其他精神性疾病有关。移民群体中精神分裂症诊断率较高可能也很大程度上归于文化差异……移民可能会经历“文化冲击”。


    ## 文化规范与包容性


    某些文化比其他文化对“异常行为”更具包容性。但遵循文化的压力往往非常大……


    ![image](img/pg165.jpg)


    我很忧郁，老天呐，我很忧郁了……


    ![image](img/pg166.jpg)


    医生，我们担心…………他不看电视，不喜欢足球，拒绝吃肉…………他出问题了！


    ## 一个增长行业


    近年来，人们对既有疗法的替代方案的接受度提高了。例如，到 2000 年，英国超过 40% 的医生在国家医疗服务机构内提供补充医学，超过 70% 的医生定期将患者转诊给补充治疗师。


    然而，对于无法进行科学测试的疗法仍然存在许多怀疑和担忧。


    ![image](img/pg167.jpg)


    对许多人来说，最高效的心理治疗是基于认知行为和人文主义的方法。但在选择任何疗法时，无论是主流的补充性的，最终决定取决于你个人认为什么是接受且有用的。正如杜杜对爱丽丝说的那样……每个人都赢了，每个人都有奖


    ## 治疗伦理


    关于是否应该认可一个“治疗师”，或许最重要的标准是他们的职业伦理：是否有关于治疗师行为的明确行为准则，以及对客户需求和福利的充分考虑？


    例如，英国心理学会发布了一套全面的伦理实践和行为准则。BPS 还发布了一份合格心理治疗师的注册心理学家列表。


    美国精神分析协会和美国心理学会（两个都是 APA！）以及美国心理学会（APS）也提供了类似的指南。虽然没有法律上的惩罚手段，但任何违反准则的人都可以被排除在外。


    来自 BPS 准则的示例包括……


    `Competence`：能力：“心理学家应努力维护和发展其专业能力，识别并在其范围内工作。”


    `Confidentiality`：保密：“心理学家应……维护所获信息的机密性……并保护个人或组织的隐私。”


    `Personal Conduct`：个人行为：“心理学家的行为应……不损害服务接收者利益的方式。”


    “具体而言，他们应……不利用信任和信赖的特殊关系……来满足个人欲望。”


    “他们应在工作中克制不当行为……这些行为很可能损害服务接收者的利益。”


    “他们不应试图获得或接受约定之外的任何重大财务或物质利益。”


    “如果怀疑专业同事有违规行为且在与其讨论后无法解决，应采取措施向负责调查的人报告该违规行为，不要恶意，除非调查程序需要否则不要违反保密。”


    （出自`BPS 行为准则`，1985 年）


    ![image](img/pg168.jpg)


    ## 如何成为心理治疗师


    成为心理治疗师非常有挑战性但也很有回报。你想做吗？你能做吗？你该如何做？这里涉及三个主要决策。


    第一个决定是关于你感兴趣的疗法或多种疗法——基于本书和其他书中提供的摘要。


    ![image](img/pg170.jpg)


    向受过培训的治疗师及其客户寻求指导。其次，你需要了解培训要求，并考虑这些要求如何结合你现有的学历和能力。成为心理学家需要大学认可的荣誉学位以及相关的研究生培训。


    ![image](img/pg171.jpg)


    成为咨询师或心理治疗师需要经过官方专业机构认证的培训和证书。请参阅第 173-4 页的推荐机构和网站列表。第三，你需要了解你所在地区的就业前景…………并决定是建立自己的诊还是与他人合伙。


    ## 参考文献、书目及推荐阅读


