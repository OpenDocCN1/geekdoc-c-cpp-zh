    `催眠治疗 (Hypnotherapy)` 被用作放松客户的手段，并在催眠结束后建议其行为发生改变。催眠治疗师可以使用各种技术来诱导催眠——例如，让客户想象一段短的旅程。


    ![image](img/pg136.jpg)


    在催眠状态下，客户不会被要求说出违背其原则的话或做的事。


    催眠治疗可能帮助某些人应对压力相关问题和某些特定的不良习惯。


    许多催眠治疗师还教授自我暗示——训练客户放松，并对自己诉说他们想要实现的目标。


    `神经语言程序 (NLP)` 是由 John Grindler 和 Richard Bandler 在 20 世纪 70 年代发明的一种系统，也使用了暗示和自我暗示。`NLP`
    治疗师通过分析客户的话语、面部表情（尤其是眼睛的位置）和身体动作来解决问题。然后，训练客户重新重塑思维和感官联，让身体利用其自身的自愈能力。


    `冥想 (Meditation)` 是一种放松状态，可以通过任何将注意力集中在某个物体、活动或想法上的技术来实现——例如，一张图片、一种呼吸模式或一个重复的短语。


    ![image](img/pg137.jpg)


    从业者声称，每天只需几分钟的冥想对身体都有益，并有助于社交关系。


    瑜伽是通过一系列涉及正确呼吸和拉伸的姿式或阿伽伽（asanas）来放松和保持体形的方法。


    瑜伽起源于一种印度教宗教修行，旨在重新平衡执练习者生活中身体、心理和精神方面。瑜伽对于压力相关问题可能特别有帮助。


    ## 饮食疗法 (Dietary Therapies)


    这些疗法包括饮食的改变、使用食品补充剂、摄入其他物质以及各种形式的“清洁”或“排毒”。


    `过敏测试（或“临床生态学”）`决定了客户对某些食物和环境中的物质（如花粉）的反应。该理论基于希波克拉底，由 Clements Von Piquet 男男爵（1906
    年）开发，随后由 Theron Randolph（1940 年代）发展。


    ![image](img/pg138.jpg)


    有些人人在摄入坚果或小麦制品时会感到非常不适。不幸的是，过敏测试可能是不准确且具有误导性的。


    可以通过“排除饮食法”进行自我测试——即一个月内不吃怀疑的食物——看看在不吃它后感觉是否变好。


    近年来“季节性鼻炎”和哮喘的增加可能不直接由于花粉，而是由于其他环境因素，如污染和农药。


    `禁食 (Fasting)` 指几小时到几天或更长时间内完全或部分避免食物和液体（水除外）。禁食是一种古老的疗愈形式，由希波克拉底规定，通常与所有主要宗教皆知的精神益处有关。


    `自然疗法师 (Naturopaths)` 认为都能从禁食中受益——每周或每月一次——让消化系统休息、排毒并允许修复过程进行。


    ![image](img/pg139-1.jpg)


    规律的禁食让我如此轻盈。


    只需留意那些反社会人格即可，好吗？


    `水疗法 (Hydrotherapy)` 是利用水来清洁和恢复身体活力的治疗方法。


    ![image](img/pg139-2.jpg)


    水疗——矿物质水自然从泉水或河流产生的地方——至少从罗马时代起就与健康相关。


    但直到 19 世纪，水疗法才真正流行，这尤其归功巴伐利亚僧侣 Sebastian Kneipp 父亲。Kneipp 开发了今天仍在使用诊所和“健康农”的各种方法：冷热水淋、冷热水浴、蒸汽浴、桑拿和不同的身体裹敷。


    `营养疗法 (Nutritional therapy)` 通过研究客户是否具有均衡的饮食（正常的食物摄入）以及足够的蛋白质、碳水化合物、纤维、脂肪、维生素和矿物质来诊断和治疗疾病。


    犹太哲学家 `梅蒙尼德 (Maimonides)` (1135-1204)


    ![image](img/pg140-1.jpg)


    任何可以通过饮食治疗的，不要用其他手段治疗。


    ![image](img/pg140-2.jpg)


    让食物成为你的药，让药成为你的食物。


    希波克拉底


    ![image](img/pg140-3.jpg)


    这听起来很简单，但科学界对于“正常”或“健康”饮食理想情况下应该包含什么有很多争论……


    ## 什么是健康饮食？


    维生素 C 的官方每日建议摄入量 (RDA) 是 60 毫克。但许多营养治疗师认为这是基于`最低需求`，对于对于生活压力大或已经表现出疾病迹象的人来说目前太低了。


    ![image](img/pg141.jpg)


    你应该每天摄入 500 毫克的维生素 C。


    维生素片是浪费钱！


    它们没有对我产生任何伤害。


    其他广泛的营养疗法还包括`生化组织盐 (Biochemic Tissue Salts)`，也称为舒塞尔盐疗法（Schuessler salt therapy），基于德国顺势医学医生
    `Wilhelm Schuessler` (1821-98) 在 19 世纪 70 年代的工作，他认为许多疾病是由于缺乏必需矿物质。


    ## 能量疗法 (Energy Therapies)


    这一组由基于各种声称的“能量或振动”系统的疗法，包括东方和西方，它们强调实现和维持某种“平衡”的目标。大多数能量疗法基于科学无法测试的想法，并依赖于对不同信仰体系的信仰。`阿育吠
    (Ayurveda)` 是传统的印度和斯里兰卡信仰，认为万物都是由宇宙能量或 `prana` 组成的——等同于`气 (chi)`。


    ![image](img/pg142.jpg)


    健康的秘密在于简单……


    prana 平衡 = 健康……


    prana 平衡不良 = 不健康……


    在每个人身上，prana 以三种形式存在，即 `doshas`：vatha、pitha 和 kapha。你的性格由一种或两种主导，因此你需要从阿育吠治疗师那里了解并获得关于饮食、运动和生活方式的建议以保持最佳平衡。


    `针灸 (Acupuncture)` 是中医 (TCM) 的一部分，已经实践了 3500 年。核心信念是宇宙由基本的生命力 `气` 组成，有两种组成能量：`阴`和`阳`——互补的对立面。


    ![image](img/pg143.jpg)


    阴阳通常在一个圆中象征……


    中医从业者认为气通过 12 条通道或经络在身体内流动：六阴六阳。


    针灸师想象每条经络都有 365 个关键点 `tsub`，决定了气的流动。通过在这些点上轻轻插入细针，或用手指或拇指按压（按摩），针灸师可以刺激经络以恢复平衡。这种治疗有助于抑郁和焦虑以及疼痛。


    `中医 (Chinese herbalism)` 也是中医的一部分，许多从业者将其与针灸结合使用。一旦确定了身体的失调模式，就会开具`草药方`。


    ![image](img/pg144.jpg)


    我们观察整体外观、舌头状况……


    声音……


    体味……


    以及脉搏……


    并询问关于生活方式、健康和病史的问题。


    草药古代一直应用于希腊、罗马、波斯、埃及和印度。


    `同植物医学 (Homeopathy)` 是一种基于与中草类似信念的整体疗愈形式。一种生命力保持身体健康，任何失衡意味着身体正在尝试自愈——并可能需要在此过程中获得帮助。同植物疗法由德国医生兼化学家
    `Samuel Hahnemann` (1755-1843) 在 18 世纪末发明，尽管其西方根源至少追溯到希波克拉底。

