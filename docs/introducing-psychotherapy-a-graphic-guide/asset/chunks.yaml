    ## Covert Sensitization


    As an alternative to aversion therapy - which has potential ethical problems -
    some therapists prefer `Covert Sensitization` (CS): a mixture of aversion and
    `Systematic Desensitization` (SD). The clients are trained `imaginatively` (i.e.
    covertly) to punish themselves.


    ![image](images/pg74.jpg)


    For example, a smoker could imagine a burning cigarette being extinguished by
    a bucket of their own vomit, or imagine the damage done to their lungs. Thanks
    for that image...


    The client is also trained to imagine the alternative healthier or desirable scenario
    - breathing clean air and smelling better.


    ## Behaviour Modification


    We have described five behaviour-therapy techniques which change `automatic` (reflex)
    behaviours, such as fear and anxiety. Behaviour Modification changes `voluntary`
    (non-reflex) behaviours. There are four main techniques of Behaviour Modification:
    `Shaping Behaviour`, `Token Economy`, `Extinction` and `Punishment`.


    ### Shaping Behaviour


    A client’s behaviour can be “shaped” by a therapist using rewards or `positive
    reinforcement` - anything that increases the likelihood that the desired behaviour
    will be repeated.


    ![image](images/pg75-1.jpg)


    The positive reinforcer will depend on the individual client’s own personal wants.


    ![image](images/pg75-2.jpg)


    For example, a woman with anorexia nervosa may be positively reinforced by the
    therapist every time she eats. Well done! Now you’ve eaten... we can get your
    hair done!


    ### Token Economy


    Another technique using positive reinforcement is `Token Economy`. A hospitalized
    client may be given a plastic token for each desired behaviour. For example: one
    token for getting out of bed, another for getting washed, a third for getting
    dressed. These can be exchanged later for privileges - e.g. watching television.


    ![image](images/pg76.jpg)


    The term `token economy` is used for a wide range of disorders.


    ### Extinction


    `Extinction` is based on the idea that if a behaviour is not reinforced, it will
    eventually stop. This is often used to eliminate unwanted behaviours.


    ![image](images/pg77.jpg)


    ### Punishment


    `Punishment` involves applying an unpleasant consequence following an undesirable
    behaviour. This is used to decrease the likelihood of that behaviour recurring.


    ## Social Learning


    `Social Learning` is based on the idea that people learn by observing and imitating
    others. This technique is often used to develop new skills.


    ![image](images/pg78.jpg)


    ## Cognitive Techniques


    `Cognitive Techniques` focus on changing the faulty thoughts that lead to emotional
    distress. By identifying and challenging these thoughts, clients can change how
    they feel and how they interact with the world.


    ![image](images/pg79.jpg)


    ## Cognitive Therapy


    `Cognitive Therapy` is a type of therapy that helps people change maladaptive
    thinking patterns. It is often used for a wide range of mental health conditions.


    ![image](images/pg80.jpg)


    ## Rational-emotive Behaviour Therapy (REBT)


    `REBT` was developed in the 1950s by `Albert Ellis` (b. 1913), originally trained
    as a psychoanalyst, who reacted against its limitations. It focuses on identifying
    and challenging irrational beliefs.


