    Systematic Desensitization (SD). The clients are trained **imaginatively** (i.e.
    covertly) to punish themselves.


    ![image](images/pg74.jpg)


    For example, a smoker could imagine a burning cigarette being extinguished by
    a bucket of their own vomit, or imagine the damage done to their lungs. Thanks
    for that image...


    The client is also trained to imagine the alternative healthier or desirable scenario
    - breathing clean air and smelling better.


    ## **Behaviour Modification**


    We have described five behaviour-therapy techniques which change *automatic* (reflex)
    behaviours, such as fear and anxiety. Behaviour Modification changes *voluntary*
    (non-reflex) behaviours. There are four main techniques of Behaviour Modification:
    Shaping Behaviour, Token Economy, Extinction and Punishment.


    **Shaping Behaviour**


    A client’s behaviour can be “shaped” by a therapist using rewards or **positive
    reinforcement** - anything that increases the likelihood that the desired behaviour
    will be repeated.


    ![image](images/pg75-1.jpg)


    The positive reinforcer will depend on the individual client’s own personal wants.


    ![image](images/pg75-2.jpg)


    For example, a woman with anorexia nervosa may be positively reinforced by the
    therapist every time she eats. Well done! Now you’ve eaten... we can get your
    hair done!


    ## **Token Economy**


    Another technique using positive reinforcement is **Token Economy**. A hospitalized
    client may be given a plastic token for each desired behaviour. For example: one
    token for getting out of bed, another for getting washed, a third for getting
    dressed, etc. The tokens can be exchanged later in the day for privileges - e.g.
    being allowed to watch television or smoke cigarettes.


    ![image](images/pg76.jpg)


    The tokens become a form of money or currency, hence the term “economy”. Have
    I collected enough tokens to get out of here yet?


    This is a technique used only in limited cases of more extreme disorders, such
    as schizophrenia or severe learning difficulties. Once the desired behaviour patterns
    have been established, the token economy must be carefully withdrawn (replaced
    with praise and other social reinforcers) - otherwise the original behaviours
    might reappear.


    ## **Extinction**


    **Extinction therapy** is based on the theory that if undesirable behaviours are
    acquired through positive reinforcement, then they can be “unlearned” through
    removing the positive reinforcers. For example, a child who gets particular parental
    attention for throwing objects is more likely to do so.


    ![image](images/pg77.jpg)


    Ignore the throwing behavior as much as possible and give loving attention when
    the child is not throwing.


    Reinforcer attention can also be used on teenagers and adults - for instance,
    as part of a treatment for anorexia.


    ## **Punishment**


    The term punishment should be used only when something actually *decreases* the
    likelihood that behaviour will be repeated. It is often wrongly assumed something
    is “punishment” when it is actually a reinforcer. In punishment therapy, the punishment
    is anything aversive that changes voluntary behaviour.


    ![image](images/pg78-1.jpg)


    Reprimanding someone for doing something wrong may reduce the undesirable behavior,
    but ... I must try harder ... not to get caught next time!


    The problem with punishment, apart from the fact that it may inadvertently become
    positive reinforcement, is that it often only **temporarily reduces** the bad
    behaviour. Also, on its own, punishment does not usually initiate or maintain
    desired behaviour - in other words, it often simply “doesn’t work”.


    ![image](images/pg78-2.jpg)


    I must try harder ... not to get caught next time!


    ## **Social Learning Therapy**


    **Modelling or Imitation**


    The nine techniques described so far (five Classical and four Operant) all require
    **reinforcements** of some kind. But there are learning and therapy situations
    where no direct reinforcers are required. (Although they may be used in addition.)
    That is, the learner or client changes behaviour by **imitating** the therapist
    or **model**. This can be particularly effective in the treatment of phobias.


    ![image](images/pg79-1.jpg)


    Just do what I do ... don’t stare at him ... and slowly walk away ... Well done!
    Now run like hell!


    This Modelling technique, based on the work of Albert Bandura, can be used with
    most phobias and can also be effective when treating certain types of anxiety,
    e.g. when demonstrating relaxation.


    ![image](images/pg79-2.jpg)


    ## **Modelling and Cognitive Techniques**


    Besides imitation and positive reinforcement, Modelling therapists also often
    apply **cognitive processes** that will get clients to **think** about their problems
    and how to **solve** them. For example, it may be important for an arachnophobic
    to know certain facts about spiders.


    ![image](images/pg80.jpg)


    Now remember ... he is actually very short-sighted and can’t focus on you from
    that distance.


    Apart from phobias, modelling combined with cognitive techniques can be successfully
    used in **confidence building, assertiveness** and other **social skills** training.
    Those techniques more specifically focused on thinking and problem-solving can
    be considered a distinct form of therapeutic approach - cognitive therapy.


    ## **Cognitive Therapy**


    **Cognitive therapy** is based on the idea that mental disorders are the result
    of faulty patterns of thinking. The aim of cognitive therapists is to help clients
    change their ways of thinking. In practice, many of these therapists also include
    the techniques of behaviour therapy - hence it is common now to use the general
    term Cognitive-Behavioural Therapy, or CBT. (We separate the two methods for convenient
    description.) Cognitive therapy can be used for a wide range of disorders - phobias,
    schizophrenia, chronic fatigue syndrome, bulimia nervosa, anxiety, depression,
    etc.


    ![image](images/pg81.jpg)


    We’ll look at the four types of cognitive therapy...


    ## **Rational-emotive Behaviour Therapy (REBT)**


    REBT was developed in the 1950s by **Albert Ellis** (b. 1913), originally trained
    as a psychoanalyst, who reacted against psychodynamic therapy.


    ![image](images/pg82-1.jpg)


    I was dissatisfied with the passivity of psychoanalysis. Whad’ya mean, ‘passive’?
    REBT can be partly summarized by the saying attributed to the Greek philosopher
    Epictetus...


    ![image](images/pg82-2.jpg)


    We are disturbed not by things but by the views that we take of them.


    ## **The ABC Model**


    Ellis used what he called the “ABC Model” to explain the irrational beliefs that
    cause clients’ problems.


    A is the **Activating event** which is followed by C, an emotional **Consequence**
    - with the two being linked by B, the person’s **Belief system**. The problem
    often is that C is not necessarily directly caused by A, but by B which can be
    faulty.


    ![image](images/pg83.jpg)


    The client needs to change his or her Belief system in order to deal with emotional
    problems. This is done by creating D, a Dispute belief system that counteracts
    the faulty Belief.


    ## **Example of the ABC Model in Use**


    A client who is depressed (Consequence) may have convinced herself (Belief) that
    no one likes her because, over a certain period of time (Activating event), several
    friends said they were too busy to see her.


    ![image](images/pg84-1.jpg)


    What alternative reasons are there that your friends didn’t see you?


    ![image](images/pg84-2.jpg)


    Well, I suppose they may have already made other arrangements ... perhaps it wasn’t
    because they don’t like me.


