    `Mirroring` – 小组成员模仿主角的行为，通常通过夸大这些行为来达到目的。


    ![image](img/pg118.jpg)


    他们的目标是向主角揭示他或她为何会以特定的方式行为。


    心理剧的治疗目的是……


    (a) 帮助防止日常生活中出现破坏性和非理性的行为

    (b) 使能够表达难以描述的情感

    (c) 鼓励人们揭示问题的根源。


    其他类似的疗法包括`原发疗法`和`重塑疗法`。


    ## 交互分析


    另一种心理动力学小组技术是`交互分析`（Transactional Analysis，简称 `TA`），由埃里克·伯恩（Eric Berne）在流行书籍《人际游戏》（1964）中描述。该术语指的是成对对话中人与人之间的互动或`交易`——夫妻、兄弟姐妹、雇主与员工、医生与患者。在任何时候，都可以根据三种行为类型或`自我状态`对每个人进行`结构性分析`。


    `父母态` – 个体人格中从父母那里学到的人格部分，采用了我们从小就习得的社会规则和抑制。


    `成人态` – 人格中成熟、理性、灵活且具有理解力的部分。


    `孩子态` – 人格中保留的童年部分，是依赖的、要求的、冲动的且自私的。


    ![image](img/pg119.jpg)


    人在不同时间会主要表现出 `P`、`A` 或 `C` 状态……交互分析并不试图让患者变好，而是让他处于一个位置，让他能够行使`成人选择`来变得更好。


    ## 人际游戏


    伯恩认为，人们在日常生活中通过“玩游戏”，试图以无效且具有破坏性的方式互相控制或操纵…………


    ![image](img/pg120.jpg)


    看你让我做了些什么！但我只是想帮你！应该有点同理心吧……


    问题出现在成对的人身上，例如，当其中一人或双方表现出`孩子态`时。`TA` 使人们理解自己的行为并将其转变为更具建设性和生产性的东西——例如通过更多地采用`成人态`。


    尽管 `TA` 具有精神分析的根源，但它与传统的关于“隐藏”潜意识过程的弗洛伊德假设有重要区别。例如，伯恩认为`父母-成人-孩子`状态以及随后的交易可以被意识化并被有意识地处理。


    ## 相遇小组


    `相遇小组`由卡尔·罗杰斯（Carl Rogers）在 20 世纪 40 年代创立，是最早的人本主义小组治疗技术，在 20 世纪 60 年代尤为流行。在相遇小组中，有一名领导或`引导者`以及参与者。


    ![image](img/pg121.jpg)


    我在这里是为了营造一种小组信任的氛围。你必须自由表达你的感受，无论是积极还是消极的。参与者通过学会减少防御并对自己的人格和潜力获得见解从中获益。它可以帮助害羞和缺乏自信的人。


    ## 敏感性训练


    `敏感性训练`小组或`T 小组`，最初开发于 20 世纪 40 年代后期，旨在为民主领导力培训人员。后来，它们成为企业经理提高与其他经理沟通和关系技巧的流行工具。它有许多变体，其中一些更多地基于人文主义模型（例如`亚伯拉罕·哈罗德·马斯洛`（1908-70）的“需求层次理论”），而非其他。`T
    小组`与相遇小组的区别在于要求更多受控的自我表达手段，并对互动保持更“专业”的方法。但一些`T 小组`或管理培训方法似乎完全误解了人文主义概念，并完全抛弃了“敏感性”部分……


    ![image](img/pg121-1.jpg)!![image](img/pg122.jpg)


    好了，伙计们——你们每个人正好十分分钟产生至少一次巅峰体验，否则就告诉小组其他人你们为什么是如此落魄的失败者！


    ## 其他小组疗法


    ### 匿名戒酒会 (AA)


    酒精会导致中度到严重的心理障碍，如记忆丧失、性格变化、各种反社会行为和精神病。`AA`由两个试图克服饮酒问题的美国酗酒者于 1935 年建立：他们是股票经纪人“Bill
    W.”和外科医生“Bob S.”。到 2000 年，全球已在超过 120 多个国家建立了超过 90,000 个`AA`小组，每个小组在很大程度上独立运行，以服务当地需求。


    ![image](img/pg123.jpg)


    成员被遵循`十二步计划`，并通常承诺完全停止摄入酒精。我愿意迈第一步……并承认我是一个酗酒者。


    `AA`小组是世俗的，但通常具有很强的精神及社交焦点，根据个人信仰，包括对上帝或更高力量的依赖。成员之间仅用名字和姓氏的首字母称呼（正如创始人做的那样），通过分享经验和鼓励来互相支持。


    ![image](img/pg124.jpg)


    许多医疗专业人员推荐`AA`作为一种廉价且实用的小组疗法，尽管它并不适用于所有酒精依赖症患者。我不是酗酒者，我也不想完全放弃酒精……只是少喝一点……嗝！


    `AA`的模式已被许多其他自助小组复制和改进，例如`匿名赌徒戒会`。他们的成功取决于个人的努力和小组的支持，因此人们不会觉得自己是在独自面对问题。改变成瘾行为通常涉及改变态度和接受新的身份。


    ## 笑容疗法


    大笑的特征是一系列身体表现——无意义的发声、面部扭曲和身体震动动作——这些由思想、情况、事件等引起，通常具有出意或不协调的性质。它也可以由氧化亚氮和瘙痒引起。`笑容疗法`的一个著名支持者是来自弗吉尼亚州阿灵顿的帕奇·亚当斯博士（Dr
    Patch Adams）。


    ![image](img/pg125.jpg)


    快乐比任何药物都重要！


    幽默被许多人用来减轻压力缓解抑郁症状——尤其是那些深受抑郁症困扰的喜剧演员。笑可以产生明显的生理益处，例如降低压力荷尔蒙水平、增加某些“快乐”神经递质、放松肌肉并增加血流量。笑容疗法尚未被医学界普遍认可。


    ## 补充（或替代性）疗法


    这些术语代表了除传统医疗实践之外可以使用的多种疗法。（因此，现代更倾向于使用“补充性”一语而非“替代性”。）过去，许多`补充疗法`被视为江湖骗术或不会持续的时尚。然而，对传统医学的不满导致许多人向其他处寻求帮助。


    ![image](img/pg126.jpg)


    消费者协会调查提供了这一数据……在欧洲，至少三分之一的成人曾使用过某种形式的补充疗法。越来越多的全科医生提供补充医学——许多人会将患者推荐给其从业者。


    ## 什么是补充疗法？


    最显著的区别在于对疾病定义和治疗的方法。通常，补充疗法师不将疾病视为孤立的症状，而是个体整体生理心理健康的紊乱。因此，他们的目标是治疗个人——特别是通过刺激身体自然和自我自愈的能力。


    ![image](img/pg127.jpg)


