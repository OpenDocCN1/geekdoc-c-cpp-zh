    我们该怎么办？他需要心理治疗！


    总得有人发明这种东西……


    谁说的？


    ## 什么是心理治疗？


    从字面上讲，心理治疗意味着“心灵的治愈”。在实践中，它是通过使用心理方法来治疗疾病——作为纯医学治疗的补充或替代。但对于这些方法具体包含哪些，人们往往缺乏共识。事实上，许多人对于该术语本身的使用也存在分歧。


    ![image](img/pg4.jpg)


    心理治疗是任何治愈的……


    或者让你感觉好起来的……


    但心理治疗不就是咨询的另一种说法吗？


    不！咨询只是心理治疗的一种类型……


    而且还有其他类型……


    ## 心理治疗与咨询


    心理治疗真正始于 1894 年西格蒙德·弗洛伊德的精神分析。但从 20 世纪中叶开始，出现了其他方法。今天，“心理治疗”一词包含了受过培训的专业人员个人或群体提供的多种形式的帮助。


    ![image](img/pg5.jpg)


    自称为咨询师的治疗师倾向于采用非指导性、非判断性和以客户为中心的方法。许多心理治疗师则倾向于更具指导性，并在建议或开具帮助客户的方法方面更加积极。这是本书中所运的广义区别——尽管有些咨询师自称为心理治疗师，并声称这两个词是同义的。


    ## 心理治疗的主要类型


    当一个人需要帮助时，第一步通常是看医生，由医生尝试进行诊断和医学治疗。如果无效，可以考虑各种心理治疗方法。今天有数百种心理治疗法可用！但方便起见，书中的疗法将分为七大类。第一类是`医学`或`躯体治疗`——字面意思是“身体治疗”，主要使用药物。


    ![image](img/pg6.jpg)


    躯体治疗的基本假设是化学平衡失调导致了问题。在这里，每晚吃其中一种——你很快就会感觉好起来！


    其他六种是非医学疗法。


    ![image](img/pg7.jpg)


    大多数“咨询师”主要接受人本主义治疗训练，但通常也使用认知和行为技术。


    ## 谁是心理治疗师？


    一个主要问题是，任何人都可以自称为治疗师或心理治疗师！即使是那些声称拥有“资质”的人也需要经过非常仔细的审查。专业机构的存在是为了认可培训并监管成员的行为。


    ![image](img/pg8.jpg)


    作为合格心理治疗师的心理学家应该具有心理学大学学位并经过专门培训。同样，受过培训的咨询师通常应该是专业咨询机构的成员。各种心理治疗的资质、培训和伦理将在本书后部分讨论……


    ## 谁是精神科医生？


    精神科医生是合格的医学博士（MD），他们在精神科方法方面接受了进一步的专门培训，例如基于精神分析的方法。在英国，精神科医生必须具备医学资质，因此受英国医学协会（BMA）规则的约束。


    ![image](img/pg9-1.jpg)


    然而，在其他国家，精神科医生的医学要求并不如此严格。


    美国有美国精神医学协会、美国心理学会和美国心理学会。


    ![image](img/pg9-2.jpg)


    我们将在稍后详细介绍精神科治疗……


    ## 其他治疗师


    除了精神科医生、心理学家和咨询师，还有许多人自称为“治疗师”。例如，拥有芳疗法证书的人——应用气味良好的物质，通常通过按摩进行（事实上，他们的其中一份期刊就简称为*Therapist*）。但这具有争议性，特别是考虑到芳疗法理论和声称的非科学性。


    ![image](img/pg10-1.jpg)


    但不可否认，芳疗可以是一种放松和愉快的体验，可以让你感觉好起来。不过，许多其他活动也可以……


    ![image](img/pg10-2.jpg)


    想要治疗一下，亲爱的？


    ## 如何选择治疗师


    你的全科医生可能会推荐某些治疗师——例如提供精神分析、认知行为疗法、整骨、脊椎按摩或针灸治疗的人。客户对治疗师的推荐也有价值。


    - 治疗师是否具有专业资质？如果是，具体的资质是什么？

    - 治疗师的经验如何？

    - 治疗师是否愿意与你的医生合作？

    - 治疗师是否属于认可的专业协会，并有公开的注册表让你可以通过地址或电话号码联系他们？

    - 相关专业协会是否发布了实践准则（伦理）、投诉和纪律制度？


    ![image](img/pg11.jpg)


    我在保险单的承保范围内吗？治疗的费用是多少？


    ## 为什么人们需要心理治疗？


    人们需要治疗的通常原因是他们觉得日常生活太艰难了。


    ![image](img/pg12.jpg)


    这可能包括日常生活的个人问题，以及在家里或工作中与他人沟通的问题。我无法应付！


    人们寻求帮助（或他人要求帮助）的最常见原因与`抑郁、焦虑`或如`恐惧症、执念`和强迫症等问题有关。不常见的病症包括进食`障碍`（厌食症和暴食症）、`自残`和分裂症。有时人们想普遍提高自信心并改善社交技巧。


    ## 抑郁症


    抑郁症是最常见的精神科投诉，由古希腊医生`希波克拉底`（公元前 460-377 年）描述过，他称之为“忧郁质”。抑郁的人通常会有以下感受……


    ![image](img/pg13.jpg)


    我感到非常悲伤……一切似乎毫无希望……什么都不顺利……我很没用


    其他症状包括精力不足、萎靡、疲劳……思维和行动迟缓……食欲不振或暴食……睡眠不安或失眠


    `临床抑郁症`与悲伤引起的不愉快不同，后者被认为是对失去亲人或或其他明显不愉快原因的反应。只有当抑郁情绪与原因不成比例、持续时间过长或严重时，才诊断为抑郁症。


    `躁郁症`或`双相情感障碍`是一种罕见的特殊情况，患者在悲伤消极与快乐活跃之间转换。


    ## 谁会患抑郁症？


    生活中的任何任何时候都可能患抑郁症，尽管某些人似乎生就有倾向，或者早期获得。由生活事件引起的抑郁疾病有时被称为`反应性抑郁`。而没有明显外部原因的被称为`内源性抑郁`（意思是“从内部”）。然而，这种区分并不总是有用，因为对某些人来说，抑郁会反复发。此外，还不清楚为什么人们对事件的反应不同。从统计来说，抑郁症在女性（尤其是
    35 到 45 岁之间）比男性更常见，尽管男性随着年龄增长风险也会增加。无论经济状况或社会阶层如何，约有 10%的人在任何时候患有抑郁症。


    ![image](img/pg14.jpg)


    许多著名且成功的人，如温斯顿·丘奇（1874-1965），都遭受过抑郁症……我把抑郁症称为我的“黑狗”——它是一个经常的伴侣。


    '
- fmt: '

    Other famous people who had recurrent depression include `Johan Wolfgang von Goethe`
    (1749-1832), `Martin Luther` (1483-1546), `Robert Schumann` (1810-56), `Leo Tolstoy`
    (1828-1910), `Vincent Van Gogh` (1853-90) and `Hugo Wolf` (1860-1903).


    # Anxiety


    Anxiety is a chronic complex emotional state typified by extreme apprehension
    and continuous dread. `General Anxiety Disorder (GAD)` is diagnosed when there
    are no particular reasons for such feelings or there is overreaction to everyday
    events. Anxiety can also be associated with difficulties in coping with excess
    stress, especially those linked to losses, such as in bereavement, divorce or
    unemployment.


    ![image](images/pg15-1.jpg)![image](images/pg15-2.jpg)


    When there are specific situations that cause anxiety, then it may be classified
    and treated as a phobia ... However, because GAD is generalized and non-specific,
    it is often harder to deal with.


    # The Mystery of Anxiety


    A major aspect of the complexity of anxiety is its subjective nature. Existential
    psychotherapists, for example, argue that because we have the freedom to make
    many choices, and are ultimately responsible for our own actions, then anxiety
    is actually an inevitable and essential aspect of human existence. In other words,
    they claim it is normal and healthy to experience anxiety!


    ![image](images/pg16.jpg)


    We are all condemned to freedom and must choose for ourselves who we are. At times,
    when anxiety becomes unbearable – and is too detrimental to daily living – help
    is usually needed to cope with it.


    # Phobias


    A phobia is an extreme, irrational and uncontrollable fear of an object or situation.
    Phobias may be “learned” - and therefore “unlearned” - through `classical conditioning,
    operant conditioning` or `imitation` of a role model. Here are two common phobias
    …


    ![image](images/pg17.jpg)


    I can’t stay in the house if there’s a spider! I can’t go out of the house! I
    can’t bear open spaces!


    The specific nature of most phobias means that they can often be treated relatively
    quickly and easily, because clear goals can be defined and worked towards. We
    will see this described later in Cognitive-Behavioural Therapy - `CBT`.


    # Obsessions and Compulsions


    Obsessions are persistent, recurring `ideas.` Whereas compulsions are repetitive
    `behaviours.` This can be a useful distinction for therapeutic approaches, even
    though the two often go together, with obsessions frequently leading to compulsive
    behaviours.


    Obsessional ideas usually have a strong emotional component - for example, the
    idea that we are surrounded by germs that can easily enter our bodies and make
    us ill. Associated emotions might include fear and disgust, and perhaps resentment
    or hatred, of the environment or other people.


    ![image](images/pg18.jpg)


    Such an obsession about the need for cleanliness could lead to the compulsion
    of repeated hand-washing and other excessive behaviours. One famous case was that
    of the multi-millionaire recluse `Howard Hughes` (1905-76).


    As with phobias, compulsions can usually be treated fairly easily by measurable
    increments towards definite goals. (Again, `CBT` is often used.)


    # Eating Disorders


    The most common eating disorder is over-eating - consuming more calories than
    are required for the amount of activity a person does. Some people do this in
    order to feel better in the short-term.


    ![image](images/pg19.jpg)


    The long-term effects of over-eating are obesity and related illnesses, such as
    heart disease and diabetes. Comfort food! In both the USA and the UK, approximately
    one in four people are clinically over-weight Obesity is rising in most Western
    countries.


    # Bulimia and Anorexia


    Less common disorders, but also rising in the West, are bulimia and anorexia.
    `Bulimia nervosa` usually involves “bingeing” – excessive eating, followed by
    drastic and unhealthy means of removing the food – by induced vomiting or abuse
    of laxatives. `Anorexia nervosa` is chronic loss of appetite and the desire to
    eat, leading to extreme weight loss.


    ![image](images/pg20-1.jpg)


    Anorexia occurs mainly in teenage girls who think of themselves as being “fat”,
    even when they are very thin. Western media are blamed for such harmful influences.


    ![image](images/pg20-2.jpg)


    Anorexia and bulimia can sometimes appear together in the same person.


    # Self-harm


    Self-harm technically includes over-eating, bulimia and anorexia. But the term
    usually refers to conditions of immediate visible self-injury. Self-mutilation
    occurs mostly in teenage girls and is often associated with strong feelings of
    low self-esteem. These injuries may be seen as self-punishments or short-term
    ways of relieving tension, anger or frustration.


    ![image](images/pg21.jpg)


    The physical damage done can reinforce feelings of law self-worth and, of course,
    the scars can last a very long time. Other forms of self-harm include abuse of
    alcohol, cigarettes and drugs. The harm done may not be immediately obvious, and
    realization may come too late! Also, these types of self-harm are often denied
    by the individuals involved ... Leave me alone! I’m enjoying myself.


    # Schizophrenia


    Schizophrenia affects about 1% of the population and occurs throughout the world.
    A common media myth is that schizophrenics are dangerous. But you are statistically
    far less likely to be attacked by a schizophrenic than a so-called “normal” person!


    `Schizophrenia` is hard to define, but it is usually characterized by disorganized
    thoughts and emotions. Past classifications have identified different types, including
    `hebephrenic, catatonic` and `paranoiac.` `Hebephrenic` is commonest.


    ![image](images/pg22.jpg)


    The person becomes increasingly detached from reality, usually in late teens or
    early adulthood, exhibiting “silliness” and carelessness about personal appearance.
    Stereotypes of “the madman” are based on this, although other situations such
    as “the tramp” may be a more typical outcome. My invention of the water-powered
    car has never been properly recognized...


    # Other Forms of Schizophrenia


    `Catatonic` refers to rigid postures or highly repetitive rocking behaviours,
    typically with complete lack of communication with others.


    ![image](images/pg23.jpg)


    Such people are usually confined to their homes or institutions, and given full-time
    care by family, friends or professionals. Paranoiac behavior is characterized
    by persistent delusions, often with hallucinations. Actually, I invented the water-powered
    car and I would have been a millionaire if it wasn’t for the little green beetles
    living in my head... This is the common “madman” stereotype.


    # Diagnosis of Schizophrenia


    Since the 1980s, the clinical terms hebephrenic, catatonic, and paranoiac have
    been used less by many doctors who now prefer to avoid such labelling of individuals.
    Today, the emphasis is on the diagnosis of `behaviour` rather than the `person`,
    much of which can be treated.


    ![image](images/pg24.jpg)


    Generally speaking, of all people exhibiting schizophrenic behavior, roughly one
    third recover, one third have intermittent episodes and one third remain chronic.
    Modern drugs (e.g. `clopazine/clozaril`) have benefited many – has increased understanding
    and tolerance in society.


    Mental illnesses are defined and classified in official publications which can
    vary between countries. Two commonly used classification systems are: the Diagnostic
    Statistical Manual (DSM) and the International Classification of Diseases (ICD).
    The DSM is mainly used in the USA; the ICD in the UK and most other parts of the
    world. Neither of these currently uses the term “mental illness”, calling abnormal
    behaviour “psychopathology” or “disorders”.


    ## Examples of Major Categories of Mental Disorders


    - Dementia (including Alzheimer’s)

    - Schizophrenic and other psychotic disorders

    - Substance-related disorders (including alcohol and other drug misuse)

