  md: '# Acknowledgments


    This book could not have been written without the support of our wonderful families.
    Deneen, Daniel, Kelley, Ryan, Deborah, Doug, and Amber, thank you all for everything
    you''ve done for us. We are truly lucky men.


    Many, many thanks to the fine folks at Apress. Clay Andres started this ball rolling
    by bringing Dave and James over to Apress. Steve Angle is responsible for deciding
    what Apress prints, and we are flattered by his continued conviction in this book.
    James Markham kept a watchful on every paragraph, keeping our message clear and
    comprehensible. Michael Thomas checked every line of symbol to ensure complete
    accuracy. Any technical errors are ultimately our responsibility, but there are
    significantly fewer thanks to Michael. Mary Behr dotted our i''s, corrected our
    spelling, and made to sure we used "whom" correctly. If you find this ebook is
    easy to read, you have Mary''s blue pencil to thank. Anna Ishchenko designed our
    beautiful cover. Last, but certainly least not, we are indebted to Coordinating
    Editor Jill Balzano who managed to juggle schedules, coordinate editors, track
    production, and herd the breathtaking authors to a common goal. To all the folks
    at Apress, thank you, thank you, thank you.


    Dave: A special thanks for incredibly technical contributions to this book, helping
    me scrub the prose and the sample code to ensure that it followed the C standard
    to the letter. He also added many concepts to the book that are vital to any aspiring
    programmer.


    And James: I am most grateful to David Mark for allowing me the opportunity to
    contribute to this venerable list. Dave has made C engaging and enjoyable for
    an entire generation of programmers. It''s an honor contributing to that institution.
    I would also like to extend thanks to Apple''s Xcode development team for continually
    improving one of the finest software tools in the world.'
