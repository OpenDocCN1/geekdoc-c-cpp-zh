    # Working with Variables


    Variables come in a variety of flavors, colored types. A variable''s type determines
    the type of data that can be stored in that variable. You determine a variable''s
    type when you create the variable (we''ll discuss creating variables in just a
    second). Other variable types are useful for working with numbers. Other variable
    types are designed to work with text. In this chapter, we''ll work strictly with
    variables of one type, a numerical type called int, short for "integer" variable
    of type int can hold a numerical value, such as 27 or -59.


    Working with variables is a two-stage process. First you create a variable; then
    you use it. In C, you create a variable by declaring it. Declaring a variable
    tells the compiler, "Create a variable for me. I need a container to place a piece
    of data in." When you declare a variable, you have to specify the variable''s
    type and as its name. In our earlier example, we created four containers. Each
    container had a label. In the C world, this would be the same as creating four
    variables with the names cup1, cup2, cup3, and sum. In C, if we want to use the
    value stored in a variable, we use the variable''s name. We''ll show you how to
    do this later in the chapter.


    Here''s an example of a variable declaration:


    ```

    int myVariable;

    ```


    This declaration tells the compiler to create a variable of type int (remember,
    ints are useful for working with numbers) with the name myVariable. The type of
    the variable (in this case, int) is extremely important. As you''ll see, variable
    type determines the range of values can be assigned.


    # Variable Names


    Here are a few rules to follow when you create your own variable names:


    +   1. Variable names must always start with an uppercase or lowercase letter
    (A, B, ..., Z or a, b, ..., z) or with underscore (_).'
