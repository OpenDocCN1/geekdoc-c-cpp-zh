  md: '> NOTE: This declaration is perfectly legal: int* myPointer;


    This line also declares a variable myPointer designed to hold the address of an
    int. The fact that the white space after the * does not matter to the compiler.
    We''ll be using the former format, simply because it''s the most common. Both
    are acceptable.


    For the moment, we''ll limit ourselves to pointers that point to ints. Look at
    this next code:


    ```

    int *myPointer, myVar;

    myPointer = &myVar;

    ```


    The variable declaration allocates two variables: a pointer to an int, and an
    int. The assignment statement puts myVar''s address in the variable myPointer.
    If myVar''s address is 836, this code will leave myPointer with a value of 836.
    Note that this code has absolutely no effect on the value of myVar.


    We''re you got the concept of memory addresses, and you understand that every
    value stored in memory has an address associated with it. You now know how to
    obtain address of a variable with the address-of (&) operator and store that address
    in a pointer variable (a variable for storing memory addresses).


    So what now? This is where pointers to get interesting.


    # # The * Operator


    The complement to the address-of (&) operator is the unary * or indirection operator.
    It just adjusts the opposite of the & operator: it takes a pointer variable and
    turns it into the variable pointer points to. Confusing, isn''t it? Here''s a
    simple example.


    > NOTE: The *''s official name in the C standard is the "indirection operator,"
    but it''s commonly referred to as the "star," "pointer," or "dereference" operator.


    ```

    int *myPointer;

    int myVar;


    myVar = 3;

    myPointer = &myVar;

    ```'
