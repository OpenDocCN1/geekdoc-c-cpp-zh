  md: 'What do you do if you want to work with numbers such as 3.14159 and -98.6?
    Check out this slice of code:


    ```

    int myNum;


    myNum = 3.5;

    printf("%d", myNum);

    ```


    Since myNum is an int, the 3.5 will be truncated before it is assigned to myNum.
    When this code ends, myNum will be left with a 3 and not 3.5 as intended. Do not
    despair. C provides floating data types, specifically designed to deal with non-integer
    numbers.


    > NOTE: Floating point numbers are extremely flexible. They can store very large
    numbers (47,951,200,000,000,000,000,000.0) and very small numbers (0.000000017346).
    The name "floating point" refers to the fact that the radix point (also called
    the "decimal point") can be placed anywhere relative to the significant digits,
    which allows floating point values to represent a wide range of numbers.


    The three floating point data types are float, double, and long double. The types
    differ in the number of bytes allocated to each and, therefore, the range of values
    each can hold. The relative sizes of these three types will vary depending on
    what kind of CPU you are using and other variables. Let''s look at a program you
    can run to tell the size of these three types in your development environment
    and show you various ways to use printf() to print floating point numbers.


    # # Floatizer


    Look inside the Learn Projects folder, the subfolder named 08.01 - Floatizer,
    and open the project named Floatizer.xproj. Figure 8-1 shows the results of running
    Floatizer on a 64-bit Intel Mac Pro using Xcode. The first three lines of output
    tell you the size, in bytes, of the types float, double, and long, respectively.


    Never assume the size of a type. As you''ll see when you go through the source
    code, C gives you everything you need to check the size of a specific type in
    your development environment. If you need to be sure of a type''s size, write
    a program to check the size for yourself.'
