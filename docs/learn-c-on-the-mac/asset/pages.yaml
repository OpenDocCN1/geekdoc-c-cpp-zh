    # TWO''S COMPLEMENT NOTATION


    Actually, the byte calculation in the "Bytes and Bits" section is just one of
    several ways to represent a number using binary. This approach is fine if you
    want to represent integers that are always greater than or equal to zero (known
    as *unsigned integers*). Computers use a different technique, known as *two''s
    complement notation*, when they want to represent integers that might be either
    negative or positive.


    To represent a negative number using two''s complement notation:


    +   1. Start with the binary representation of the positive version of the number.


    +   2. Complement all bits (turns ones into zeros and the zeros into ones).


