    # The Workspace Window


    Xcode opens your new project in a workspace window, as shown in Figure 1-7. The
    workspace window is divided into panes or views. On the left are the navigators
    (how you get around your project). In the middle are your editors (where you write
    and design your application). To edit a file, double-click the file in the navigator
    and it will appear in the editor. On the right are utilities (inspectors, libraries,
    help, and such). Any of these views can be hidden as you work. In Figure 1-7,
    the utilities are hidden for the sake of simplicity.


    ![](img/107863f6fad4269a6697938c194582e0_14_0.png)


    Figure 1-7. Hello project workspace window


    At the bottom you''ll find the debug area, which normally appears only while you''re
    running or testing a program. While it''s running you view its output. At the
    very top is the toolbar. It has buttons and controls for things you commonly do.
    The big Run button at the left will build and run your project, which is what
    it''s all about. Everything in the toolbar is just a shortcut for a command in
    the Xcode menubar; it doesn''t matter which you use.'
