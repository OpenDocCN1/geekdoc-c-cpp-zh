    # COMPUTER ARCHITECTURE AND POINTER SIZES


    If you''re curious to know why an int variable takes 4 bytes of memory and a pointer
    variable takes up 8 bytes of memory, read on.


    As of this writing, the default size for an int is 4 bytes, or 32 bits. 32 bits
    is enough to represent any whole number between 0 and 4,294,967,295. If this isn''t
    perfectly clear, review the section "Size of a Type" in Chapter 4.


    A pointer variable is, essentially, an integer variable that stores the address
    of a byte in memory. Logically, it has to be big to represent all of the possible
    memory addresses your computer has. That means that every pointer variable in
    a program has to be capable of storing a number between 0 and the last address,
    since a variable can (theoretically) be allocated at any memory address.


    If you''ve shopped for a shiny new Mac, you know that (with some spare cash) it''s
    not difficult to load it up with more than 4GB of RAM. A 32-bit (4 byte) integer
    can only represent numbers between 0 and 4,294,967,295 (4GB). Clearly, that''s
    inadequate for today''s computers.'
