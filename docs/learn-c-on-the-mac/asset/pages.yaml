  md: '# The Dark Side of Pointers


    With great power comes great responsibility.


    > Uncle Ben, from The Amazing Spider-Man


    (Cue sinister music.) Pointers are very powerful, but they have a dark side. They
    occupy a dangerous land full of hazards just waiting to snare an unsuspecting
    programmer. The correct, safe, use of pointers requires careful planning and attention
    to detail.


    The principle of pointers is that they can point anywhere. There are no safeguards
    to ensure that a pointer points to the kind of value you expect it to. It can
    as easily point to another kind of value, or unused memory, or the part of memory
    where the code for your program is stored, or an address that doesn''t exist.


    The effects of using pointers that point to the wrong thing from the perplexing
    to the disastrous. If a pointer points to some other variable, changing it will
    have a bizarre effect on your program—the value you expect to change won''t, and
    some other unrelated variable will spontaneously change. If the pointer points
    to memory that doesn''t exist, the hardware will catch it and terminate your program
    with a "segment fault" signal, colloquially known as a "crash."


    # PHYSICAL AND LOGICAL MEMORY ADDRESSES


    If you''re reading this book carefully, you might have detected an inconsistency.


    We said that memory addresses start at zero and go up. We said C0 reserves address
    0 (NULL) to mean "no address." We said that if you try to access a memory address
    that doesn''t exist, your program will crash. And we said that if you try to access
    address 0 (via a pointer set to NULL), your application will crash. But why? Doesn''t
    address 0 always exist? Isn''t address 0 the one address in every computer that
    exists?


    Yes and no. The answer lies in the difference between physical memory addresses
    and logical memory addresses.


    In physical memory—the RAM that''s soldered to your motherboard—address 0 is the
    first byte of memory. But your program never addresses physical memory directly.
    It works with what are called logical addresses.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Modern computers use a system called virtual memory that maps (translates)
    the logical addresses that your program uses into the physical addresses of your
    RAM. This is done through (surprise!) a bunch of pointers called a page map. When
    your program is started it is allocated a range of logical memory addresses to
    use. These addresses might start at, say, one million (1,000,000) and go up from
    there. You''ll notice that address 0 is intentionally left out. if your program
    allocates an integer at address 1,000,000 and stores a value in it, the CPU uses
    its map to translate that address into the actual physical address of it. Don''t
    worry about the complexity of this; it''s all handled by hardware and it''s mind-umbingly
    fast.


    This arrangement benefits your program in two ways. The first is security. If
    you accidentally use an uninitialized pointer, your program could end up accessing
    a memory address that''s not part of your program or change values in another
    running program! Well, relax; you can''t. Your program can only access the logical
    addresses that have been assigned to it. Try to access anything outside that range
    and your program will crash.


    The second benefit is simplicity. Every program can allocate its first variable
    at address 1,000,000. Each program has the same addresses, but the page map translates
    them into different physical addresses. One program doesn''t have to worry about
    addresses of another program. Each program lives in its own universe, and they
    never collide.


    The short and long of it is that you don''t need to worry about it. You''ll never
    see the actual (physical) address that your data is stored in. When programming
    and debugging, everything will be in the logical addresses allotted to your program.


    Here are some tips for staying safe with pointers:


    +   - Make sure your pointer variables are initialized. An uninitialized variable
    simply contains a goofy number, but an uninitialized pointer variable will point
    to some random, likely invalid, memory location.


    +   - If you don''t have a value to put in a pointer, set it to NULL before you
    use it. Test the pointer to make sure it''s not equal to NULL Dereferencing a
    NULL pointer is the fastest, and most common, to crash your program. If a pointer
    is longer valid, set it to NULL again.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'Make sure you don''t use pointers to variables that no longer exist. In the
    Factor program, main() allocated a variable and passed its address to Factor(),
    which used that pointer. The variable existed before, and after the call to Factor()
    it was safe. But what happens if you reverse it? What if Factor() allocates a
    variable and passes its address back to main()? It''s unsafe for main to use that
    pointer. Why Because the variable created by Factor disappeared as soon as the
    function returned to main(), so the program main has now pointers to a variable
    that no longer exists. This is a recipe for disaster.


    Don''t feel bad if you make a mistake with pointers, because you will make a mistake
    with pointers. We doubt''s a C programmer that hasn''t crashed their application
    using a NULL or uninitialized pointer. Professional programmers with decades of
    experience do. In fact, it''s the number one reasons applications crash.


    # Global and Static Variables


    So far we''ve used function parameters, return values, and pointers to pass values
    to and from functions. We did this because the scope of an automatic variable
    is confined to the function (or block) it was declared in. This is by far, the
    most common way values are passed around inside a program. There is, however,
    an alternative.


    # Global Variables


    A global variable is a variable that is accessible from every function in your
    program. Said another way, the scope of a global variable is the entire program.
    The variable is created before the program begins and exists until it ends.


    Global variables provide an alternative to passing values by parameters. Global
    variables are just like regular variables, with the exception that they can be
    referenced inside any one of your program''s functions. One function might initialize
    the global variable; another might change its value; and another function might
    print the value of the global variable in the console window.


    As you design your programs, you''ll have to make some basic decisions about sharing
    between functions. If you''ll be sharing a variable among a number of functions,
    you might want to consider making the variable global. Globals are especially
    useful when you want to share a variable between two functions that are several
    calls apart.'
