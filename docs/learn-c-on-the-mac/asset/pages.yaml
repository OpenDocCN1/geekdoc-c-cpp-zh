  md: "# # Setting Breakpoints\n\nAlthough you can use the debugger before your program\
    \ starts or even after it finishes running, many of the really interesting things\
    \ happen while your program is running. The debugger features a mechanism called\
    \ a breakpoint that stops the program in its tracks so you examine or even change\
    \ your program's variables. When you think breakpoint, think “coffee break” (as\
    \ opposed to “break the Ming vase”). You're pausing, not being destructive!\n\n\
    Set a breakpoint by clicking in the margin to the left of any statement, as shown\
    \ in Figure 5-2. A light blue arrow will appear, indicating an active breakpoint.\n\
    \n```\nint main(int argc, const char * argv[]) {\n    SayHello();\n    SayHello();\n\
    \    SayHello();\n    return 0;\n}\n```\n\n**Figure 5-2.** Setting a breakpoint\n\
    \nWhen you run your program in Xcode, your program will chug right along, right\
    \ up to the point where it encounters the breakpoint; then it will freeze in its\
    \ tracks, *before* it executes the line at which the breakpoint points.\n\nGive\
    \ it a try. Set a breakpoint, then run your program; click on the *Run* button\
    \ in the toolbar, choose **Project** ▷ **Run** or press ⌘R. You should see something\
    \ like the window in Figure 5-3."
