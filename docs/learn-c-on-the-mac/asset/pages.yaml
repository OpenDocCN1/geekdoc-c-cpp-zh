  md: 'pointer programming skills. You''ll learn how to create a pointer to a variable.
    You''ll also learn how to use pointer to access the variable to which it points.


    The C language provides you with a few key tools to help you. These tools come
    in the form of two special operators: & and *.


    # The & Operator


    The &, called the *address-of-operator*, is a unary operator that pairs with a
    variable name to produce the variable''s address. The expression myVar

    retrieves the value stored in the myVar variable, while the expression &myVar

    refers to myVar''s address in memory. If myVar occupied memory locations 836 through
    839 (as in Figure 7-4), the expression &myVar would have a value of 836. The expression
    &myVar is a pointer to the variable myVar.


    An example like &myVar is a common way to obtain the address of a variable. But
    what can you do with that address? Store it into a pointer variable, of course!
    A pointer variable is a variable specifically designed to hold the address of
    another variable.


    # Declaring a Pointer Variable


    C supports a special notation for declaring pointer variables. The following line
    declares a pointer variable named myPointer:

    int myPointer;

    The * is not part of the variable''s name. Instead, it tells the compiler that
    the associated variable is a pointer, specifically designed to hold the address
    of an int variable. Technically, when * appears in a declaration it is a type
    modifier, not an operator. It modifies the int variable declaration and turns
    it into an int pointer variable declaration. Simply stated, int myInt means "allocate
    a variable that will hold an integer," while int *myInt means "allocate a variable
    that will hold the memory address of a variable that holds an." If there was a
    data type called bluto, you could declare a variable designed to point to a bluto
    like this:

    bluto *blutoPointer;'
