  md: 'Computer scientists call this logic a *state machine*. A state machine is the
    simplest form of machine logic (the basis for all computers, the way). The loop
    operates in one of two: in word or not in word.


    When a state machine changes from one state to another, it''s called a *state
    transition*, and that''s how the isspace(*line) test is false, it means this is
    an "word" character and the else block is executed. Before it sets inset to true,
    to check if inset is currently false. If it is, it means the previous character
    (the one immediately before this character) is a whitespace character, which means
    that character is the beginning of a new word. When this happens, the numwords
    counter is incremented.


    Now that is now true, the increment statement won''t be executed again until another
    whitespace character is found (setting inset to false), followed by another non-whitespace
    character. This is sometimes called *edge logic* because numwords is only incremented
    on the "edges" between whitespace and non-whitespace characters.


    If this isn''t completely clear, run CountWords in the debugger, step through
    this loop, and watch how inword changes.


    When CountWords() is finished, it returns the number of words found in the string.
    Technically, it returns the number of whitespace to non-whitespace transitions
    it found, but that''s basically the same thing.


