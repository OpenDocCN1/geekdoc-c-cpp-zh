    # Working with Endians


    So far in this book, the only thing you''ve written and read are single-byte characters.
    Characters are very portable because they are self-contained: a character is a
    matter no matter it goes.


    We alluded to the fact that read() and fwrite() don''t remember the pointer they
    are given as a specific kind of variable (char array, int, struct, and so on).
    To read() and fwrite(), the buffer pointer is a sequence of bytes in memory. What
    those bytes represent is entirely up to you decide.


    There are subtle issues that arise when you start writing more complex variables,
    like ints and structs, using fwrite to a file that might be read back on a different
    computer. Data written to file has persistence. It has to make sense not only
    to your computer, but other computers, and even computers that haven''t been built
    yet. We''ve already warned you that other CPUs have different lengths of ints
    and pointers, but they can also differ in how the bytes in an int are organized.


    There are generally two ways to organize the bytes in an int. If you go all the
    way back to Chapter 4, in the section "Bytes and Bits," you learned that an int
    value is stored as individual bits. Each bit represents power-of-2. A multibyte
    int is stored in successive bytes. A 64-bit int, for example, is stored in eight
    bytes. The first byte stores the bits 0 through 7, the second byte stores the
    bits 8 through 15, and so on, up to the last byte that stores the bits 56 through
    63. The complication is that some CPUs store the low byte in the first address
    of the int, and some CPUs store the high byte in the first address of the.


    Which "end" of the integer defines the first bytes the CPU''s endianness. (Try
    saying that quickly, three times.) When the first address of an int stores the
    least significant bits (bits 0-7) of the number, it is called little-endian byte
    order. When the first address of the int stores the most significant bits of the
    number, it is called big-endian byte order.


    Figure 1-7 shows the same integer number (1,234) stored in a four int located
    at address 836. On the left, the value is stored on a CPU that uses little-endianian
    order. On the right, the CPU uses big-endian order.'
