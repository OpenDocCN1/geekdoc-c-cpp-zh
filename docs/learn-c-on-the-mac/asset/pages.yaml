  md: '6. When a floating point value is converted to another floating point value
    that is shorter, the new value will be the closest approximation the new type
    can represent.


    We covered this extensively in Chapter 8. Shorter floating point numbers don''t
    have much precision as longer ones. When you assign a floating point to a shorter
    one, the compiler does its best to find a number as close to the original that
    the new type can represent.


    7. Converting a floating point value to an integer removes the fractional portion
    of the value and converts the whole number portion to an integer.


    Success will depend on the integer type being long enough to represent the whole
    number portion of the floating point value. In essence, the floating point value
    is truncated and turned into a long int. The rest of the conversion follows the
    rules for converting a long long int to a smaller (unsigned) integer type.


    > TIP: Remember that floating point to integer conversion never rounds up or down;
    the fractional portion of the floating point value is just stripped off. This
    code


    double d = 4.9999;

    int i = d;


    will assign the value 4 to 1, not 5. If you want to round up or down, check out
    the functions round(ceil()), and floor().


    # Conversion Warnings


    Depending on your build settings, the compiler may warn you about some conversions
    that it feels are suspect. It will be particularly keen to point out situations
    where you assign or compare signed and unsigned integers, or when you assign or
    compare 64-bit integers with 32-bit integers. Both are common sources of bugs.


    You can suppress these warnings by exerting explicit control over the conversion
    of numeric values. You do this by using a typecast.'
