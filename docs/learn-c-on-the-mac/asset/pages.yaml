  md: '# Getting More From The Libraries


    There is a lot more to the Standard Library than what we''ve covered in this book—a
    lot more. There are many more libraries beyond the Standard Library. As a newly
    minted C programmer, your first assignment is to dig into the Standard Library
    and learn to use the functions you find. Wikipedia is an excellent road to http://en.wikipedia.org/wiki/C_standard_library.


    A good place to start is with the functions declared in <string.h>. Read about
    the difference between strcmp() and strncmp(). Wander around. Get to know the
    Standard Library well. Whenever you need functionality, first turn to the Standard
    Library. Do not reinvent the wheel!


    To give you a taste of the kinds of problems that have already been solved for
    you, let''s take a look at some of the collection functions in both the Standard
    Library and Core Foundation.


    # Sorting with the Standard Library


    A common programming problem is how to sort a collection of items into a particular
    order. Let''s say you have a large DVD collection. You might want to sort them
    into alphabetical order by title. Or maybe you want to sort them into order of
    rating, so your favorites are listed first. You''d like sorting function to be
    fast and efficient, but you''re probably not keen on taking a college-level course
    on data algorithms to learn about the dozens of different sorting methodologies
    that have been developed over decades.


    A much easier solution is to turn to the Standard Library, which has a variety
    of sorting functions written for you. This is high-quality sorting code that embodies
    the best-known algorithms and optimizations. So let''s see how you''d use them
    to sort your DVDs.


    One of the fastest sorting techniques is called the "quick sort" algorithm. The
    Standard Library function qsort() will perform a quick sort. The problem with
    any sorting function is that it has how to compare two items in an array to determine
    what order they should be. The authors of the Standard Library certainly didn''t
    anticipate you creating a DVD structure or wanting to sort your collection by.
    So how does a function like qsort()—that knows nothing about your data—implement
    a sort that''s going to compare and reorder your data? The answer is function
    pointers.


    The qsort() function takes a parameter that is a function pointer. That function
    is expected to take two pointers as parameters and return an int. The Return'
