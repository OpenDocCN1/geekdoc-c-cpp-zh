  md: '# Where Shell Commands Come From


    You might be wondering all this has to do with C programming. After all, it would
    appear that the shell, although very talented, is just a program that understands
    a bunch of text commands. But that''s not true at all. The shell doesn''t understand
    any of the commands you''ve given it.


    The shell is a remarkably simple, and subtly brilliant, concept. When you type
    in a command (like ls), the shell simply looks for an executable named and runs
    it. That''s basically all of it. All of the commands you''ve so far for (ls, man,
    less, apropos, uptime), and hundreds of other commands can you give it, are all
    separate executable programs written in—drum roll—C.


    Every project in this book could be used as a command in the shell. How to create
    a new command follows these steps.


    +   - Write and build an executable command-line program (which you''ve already
    done).


    +   - Put it where the shell can find it.


    That''s it. As soon as you''ve done that, your computer''s command-line interface
    magically has a new command—a command that you created!


    We''re going to show you how to create and install your own command-line tools.
    Before we do that, let''s talk a little more about the shell. We''ve oversimplified
    the shell a bit. It has other talents:


    +   - The shell needs a small number of keywords that, like C language keywords,
    allows it to declare variables, compute values, makes decisions using if statements,
    perform for and while loops, and even define functions that can be reused. In
    this sense, a shell is a kind of programming language—but a decidedly limited
    one when compared to C.


    +   - The shell can link commands together to accomplish complex jobs.


    +   - A sequence of shell commands can be saved in a file, called a shell script,
    and used again later. This makes it possible to create complex sequences of shell
    commands (which might include if decisions and for loops) and easily reuse them.


    +   - A shell script can, in turn, be used as a command.


    If you want to learn more, you can spend an evening (or two) reading the man page.
    Warning: it''s over 200 screens of dense, often technical,'
  merge: -1
