    \ line 37.\n\nTerminating your program might seem a bit extreme, but allowing\
    \ Factor()\nrun with number set to 0 is easily hazardous.\n\nThink of assertions\
    \ as a promise, or guarantee, that the parameter will\nnever be less than 1. It\
    \ strikes a balance between merely assuming that number\nwill be less than 1 and\
    \ adding a lot of code to prevent assuming something\nthat should not happen in\
    \ the first place.\n\nAssertions are lightweight, so feel free to add them wherever\
    \ you want.\nThey are particularly useful for testing things like array indexes\
    \ before you use\nthem.\n\n```\nint someIndex;\nchar string[100 ];\n\nassert(someIndex>=0\
    \ && someIndex<sizeof(string) );\nif ( string[someIndex] == 'X' ) (\n```\n\nThis\
    \ code says, 'I've looked through all of the code and someIndex should never,\n\
    ever, be outside the dimension of the string array. I've declared my assumption\n\
    in an assert statement that will stop the program if assertion proves\nto be wrong.\n\
    \nAssertions are used a lot during development and allow programmers sleep at\n\
    night. If your program runs at all, you know that all of your assertions are\n\
    true.\n\nAssertions do add code to your functions, so you might be wondering how\
    \ they\nare different from adding code like this:\n\n```\nif ( number < 1 ) {\n\
