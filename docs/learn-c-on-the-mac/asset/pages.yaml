    # Using Paths


    Every file and folder on your volume has a name and a path. The name is its name.
    Its path describes exactly where that item is on your computer by listing every
    directory, that contains that item. A path ends with the name of the item.


    Think of it this way, Josephine is a person. Her name "path" is Milky Way Galaxy,
    Earth, United States of America, New Mexico, Sown, Power Road, 1234, Josephine.
    Admitted, the "Milky Way Galaxy" part might have been a bit excessive, but the
    idea is to write down an unambiguous description of Josephine cannot possibly
    be confused with any other Josephine in the entire universe.


    A path in UNIX is sequence of directory and file names, each separated by a "/"
    (''slash'') also referred to as the path separator. The complete path to an item
    in the file system is called an absolute path. An absolute path always starts
    with a "/" (called the "root" directory), followed by all of the directory leading
    to the item, and ending with that''s name. Here''s an example of an absolute path
    on James''s hard drive:


    ```

    /Users/James/Music/Itunes Music/Moscow Symphony Orchestra/The Egyptian/Valley
    of the Kings.mp3

