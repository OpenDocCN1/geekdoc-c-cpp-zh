  md: "```\nDoFrequently();\ndefault:\n    DoAlways();\n}\n```\n\nNotice anything\
    \ unusual? This code contains no break statements. If MyVar is 1, all three functions\
    \ will get called. This is called fall-through, because you execute DoesTimes(),\
    \ \"fall through\" the case label and execute DoFrequently(), and then \"fall\
    \ through\" and execute DoAlways().\n\nIf MyVar is 2, DoFrequently() and DoAlways()\
    \ will get called. If MyVar has any value, DoAlways() gets called by itself.\n\
    \nAs this showed, fall-through allows you to layer your switches, adding more\
    \ functionality as you fall through the cases. With careful planning, fall-through\
    \ is a nice tool to use.\n\nThat said, fall-through has its downside. Imagine\
    \ that you needed to modify the code. You realized that when MyVar is 2, you need\
    \ to call the function OnlyWhenMyVarIs2(). So you modify the code to look like\
    \ this:\n\n```\nswitch (myVar) {\n    case 1:\n        DoesTimes();\n    case\
    \ 2:\n        DoFrequently();\n        OnlyWhenMyVarIs2();\n    default:\n   \
    \     DoAlways();\n}\n```\n\nDo you see the problem here? In this version, OnlyWhenMyVarIs2()\
    \ will get executed when MyVar is 1 or 2. The lack of a break at the end of case\
    \ 1 means that anything you add to case 2 will also affect case 1. Not a big deal—you\
    \ can write the code for a while, while the break is not there and just assume\
    \ each case is its own separate entity. The real problem is that if you have not\
    \ looked at this code for a while, you might miss the fact that the break is not\
    \ there One way to solve this problem is to heavily comment your code, making\
    \ it clear for the future that you are using fall-through. Another way to solve\
    \ this problem is to avoid fall-through. As always, code carefully; plan for the\
    \ future.\n\n# switch Wrap-Up\n\nAt the heart of each switch is its expression.\
    \ Most switch statements are based on single variables, but any calculation makes\
    \ a perfectly acceptable expression."
