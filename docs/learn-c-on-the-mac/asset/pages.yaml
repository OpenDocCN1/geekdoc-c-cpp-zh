  md: '# Learning More About Commands


    What switches, options, and arguments a command understands allows differs with
    each command. To learn about a command, use the man ("manual") command. The command
    man ls and press Return, as shown in Figure 9-4.


    ![](img/107863f6fad4269a6697938c194582e0_234_0.png)


    Figure 9-4. The man page for the ls command


    The man command will present the ("manual") page for the command named in the
    argument. Most commands have a man page. The man command uses another command,
    named less, to present the information to you. The less command is the UNIX equivalent
    of Apple''s Preview application; it''s the all-purpose text viewer. Press the
    space bar to advance one page at a time. Press the "u" and "d" keys to move up
    or down one half page. The "g" key will run you back to the top, the "h" key will
    show you a help page, and the "q" key will quit less and return you to the shell.'
