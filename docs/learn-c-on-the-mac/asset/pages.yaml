  md: "# A Recursive Approach\n\nProblems lend themselves to a recursive solution\
    \ have one thing in common: a job that can be subdivided into one or more smaller\
    \ jobs that are just like the larger one.\n\nThe factorial problem fits this description.\
    \ The factorial of 3 is 3 • 2 • 1. The factorial of 4 is 4 • 3 • 2 • 1. So the\
    \ factorial of 4 can be rewritten as 4!3! (4 times the factorial of 3). Similarly,\
    \ the factorial of 5 is 5 • 4!, and so on.\n\nA function can calculate the factorial\
    \ of 5 by calling itself to calculate the factorial of 4 and then multiplying\
    \ that result by 5. When a recursive function that calculates the factorial of\
    \ 4, it repeats the process: calling itself to 3! and then multiplying by 4. Here's\
    \ a function:\n\n```\nint Factorial(int num) {\n  if ( num > 1 )\n    num *= Factorial(num\
    \ - 1);\n  return(num);\n}\n```\n\nFactorial() takes a single parameter, the number\
    \ whose factorial you are trying to calculate. Factorial() first checks whether\
    \ the number passed to it is greater than 1. If so, Factorial() calls itself,\
    \ passing 1 less than the number passed into it. This strategy guarantees that,\
    \ eventually, Factorial() will get called with a value of 1.\n\n> Any recursive\
    \ function needs a terminating condition: some it reached the end of the work\
    \ to be done and can stop calling itself. If there's a bug in its terminating\
    \ condition, the function may continue to call itself indefinitely, causing the\
    \ program to run out of stack space and crash. Programmers call this infinite\
    \ recursion bug.\n\nFigure 13-1 shows this process in action."
