    # The #define Directive


    When you send your .c file to the compiler, the compiler first invokes a preprocessor,
    asking it to go through the source code file and perform a series of tasks to
    prepare the source code for the actual compilation. Here''s a link to an excellent
    Wikipedia article that describes the C preprocessor:


    http://en.wikipedia.org/wiki/C_preprocessor


    The preprocessor responds to preprocessor directives it finds in your source file.
    One preprocessor directive you''ve already used is the #include directive. Another
    preprocessor directive, the #define (pronounced "pound-define" or "define"), tells
    the compiler to substitute one piece of text for another throughout your source
    code.


    ```

    #define kDiceSides 6

    ```


    ells the compiler to substitute the character 6 every time it finds the text kSides
    in the source code. kDiceSides is known as a macro. As the preprocessor goes through
    your code, it replaces every macro that''s been define as it goes.'
