  md: 'Finally, you print the total number of bytes allocated to the struct. Do the
    numbers add up? They should!


    ```

    printf("MyInfo struct: %zu bytes", sizeof(myInfo));

    return 0;

    ```


    On computers, these numbers won''t always add up. Here''s why many computers follow
    rules to keep various data types lined up a certain way. For example, the old
    Motorola 68000 CPU was capable of reading an int unless its address was an even
    number. The CPU had to make sure that every int, long int, float, double, and
    struct would start at an even address. Conversely, a char or array of chars could
    start at an odd or even address. In addition, on a 68000 machine, a struct must
    always have an even number of bytes.


    This is called alignment. The alignment rules, the sizes of ints, from one CPU
    to the next. Even on CPUs that don''t require an integer to start on an even memory
    address, may be faster if it does, so the compiler may choose to align variables
    to addresses that are evenly divisible by 2, 4, or even 8 bytes.


    If you want, you can see this right now. In the structSize.h file, add an int
    to the rating and title variables, like this:


    ```

    char rating;

    int fourBytes;

    char title[kTitleLength];

    ```


    When we made this change and ran StructSize on our systems, the size of myInfo
    jumped from 513 bytes to 520, which is 7 bytes longer. That''s because, in addition
    to the 4 bytes for the new int, the compiler inserted three unused bytes between
    rating and fourBytes so that fourBytes would start on an address that''s evenly
    divisible by 4. On our particular CPU, this makes reading and storing the fourBytes
    much faster—that''s a good thing.


    > TIP: In general, you shouldn''t worry about alignment. How the compiler aligns,
    packs, and pads structures is already optimized for your particular CPU. Should
    it ever become an issue for your program, check the build settings and read up
    on the #pragma pack() preprocessor directive. These let you adjust the alignment
    rules the compiler uses.'
