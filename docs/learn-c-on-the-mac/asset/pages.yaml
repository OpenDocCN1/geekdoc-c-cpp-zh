    know that there are other character sets out there. Most non-Roman alphabets have
    more characters than can be represented by a single byte. To accommodate these
    multi-byte characters, ISO C features character and wide string data types.


    You won''t get into multi-byte character sets in this book, you should keep these
    things in mind as you write your code. Read up on the multi-byte extensions introduced
    as part of the ISO standard. There''s an excellent volume in Samuel Harbison and
