    make more sense after Chapter 9.) It''s easier to pass a single reference to the
    whole mess rather than copying every value to the function need.


    #  The NULL Pointer Value


    The C language defines a special pointer value named NULL that means "no address."
    You can assign NULL to any pointer (myPointer = NULL) and you can compare pointer
    values with NULL, as in if ( myPointer==NULL ). NULL gives you a value that the
    pointer doesn''t point to any variable at all.


    Earlier we stated that memory addresses start at zero and go up, and a variable
    can be allocated at any address. In practice, that''s not entirely true. Addresses
    anywhere near address 0. or OS X and BSD Unix never allocate variables at address
    0. The reasons why are many, but one important one is so that programmers can
    be guaranteed that no valid address will ever be zero.


    The NULL constant is an address. Assigning NULL to a pointer is the same as setting
    its value to 0. One side effect is that a lot of C programmers use a short-hand
    testing to see if a pointer variables to a value or not:


    ```

    if ( myPointer ) {

    ```


    Remember that an if statement performs its action if the expression is non-zero.
    Since NULL is always zero and any valid variable address will not be zero, this
    statement is equivalent to if ( myPointer != NULL ). We suggest you write the
    long form, simply because it makes your intentions clearer; both are common.'
