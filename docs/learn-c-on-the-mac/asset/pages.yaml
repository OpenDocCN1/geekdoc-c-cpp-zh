  md: "```\nstatic CFHashCode FavoriteItemHashCode(const void *value )\n{\n    CFHashCode\
    \ code = 0;\n    unsigned int bitShift = 0;\n    const char *c = value;\n    while\
    \ (*c != '\\\\0') {\n        code += ((CFHashCode)c) << bitShift);\n        if\
    \ (+bitShift >= sizeof(CFHashCode)-sizeof(char)) * 8)\n            bitShift =\
    \ 0;\n        c++;\n    }\n    return code;\n}\n```\n\nThis code adds the ASCII\
    \ value of each character to the code variable, shifting the bits of each successive\
    \ character one bit to the left (essentially multiplying it by the next power\
    \ of 2). If bitShift gets close to shifting the bits of the char past the end\
    \ of the CFHashCode integer, it is reset to 0 and starts over again.\n\nThe result\
    \ is that the bits of each character get smeared across the bits of the CFHashCode\
    \ integer. Both character value and order affect the final value, so the string\
    \ \"tar\" and \"rat\" will return different hash codes.\n\nYou're done. That's\
    \ all the code it takes to create a C strings. Core Foundation arrays, dictionaries,\
    \ and other collections all work in a similar manner. Whip up a set of callback\
