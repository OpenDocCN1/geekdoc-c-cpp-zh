    \ sure your code works properly and is easy to read.\n\n# The for Statement\n\n\
    Nestled inside the C language, next to the while statement, is the for statement.\
    \ The for statement is similar to the while statement, following the basic model\
    \ of initialization, modification, and termination. Here's the pattern for a statement:\n\
    \n```\nfor ( expression1 ; expression2 ; expression3 )\n    statement\n```\n\n\
    The first expression represents the for statement's initialization. Typically,\
    \ this expression consists of an assignment statement, setting the initial value\
    \ of a counter variable. This first expression is evaluated once, before the loop\
    \ begins.\n\nThe second expression is identical to the expression in a while statement,\
    \ providing the termination condition for the loop. This expression is evaluated\
