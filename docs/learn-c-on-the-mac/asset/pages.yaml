    Roman alphabet). The NUL is what makes this string a C string. Every string

    ends with a ''\0'' character, and is called a NUL-terminated string.


    Notice that the bytes in the string are numbered from 0 up to 13, instead of

    1 to 14.


    When you use a quoted string like "Hello, world!" in your code, the compiler

    creates the string for you. This type of string is a string constant. When

    y use a string constant in your code, the detail work is done for you

    automatically. In this example


    ```

