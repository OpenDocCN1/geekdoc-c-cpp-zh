  md: "# Function Parameters\n\nWe're going to take a short break from pointers and\
    \ talk about functions and how to exchange values with them. How does this relate\
    \ to pointers? Be patient, as we'll come back around to soon soon.\n\nSuppose\
    \ you want to write a function called AddTwo() that takes two numbers, adds them\
    \ together, and returns the sum of the two numbers. How do you get the original\
    \ numbers to AddTwo()? How do you get the sum of the two numbers back to the function\
    \ called AddTwo()?\n\nThe answer to the first question is function parameters,\
    \ or values passed to a function. The second question is answered with a return\
    \ value, or a value passed from the function back to the caller of that function.\
    \ Before you can learn how to pass values around, or even why you need to, you\
    \ need to know a little about the concept of scope.\n\n# Variable Scope\n\nIn\
    \ C, every variable is said to have a scope. A variable's scope defines where\
    \ in the program you have access to that variable. In other words, if a variable\
    \ is declared inside one function, can another function refer to that same variable?\n\
    \nSimply stated, the scope of a variable is defined by where it's declared. The\
    \ scope of a variable declared inside a function is limited to the code inside\
    \ that function.\n\n> NOTE: Technically, the scope of a variable declared inside\
    \ any block {...} of code ends at the closing brace of block.\n\nThis definition\
    \ is important. It means you can't declare a variable inside one function, and\
    \ refer to that same variable inside another function. Here's an example that\
    \ will compile:\n\n```\n#include <stdio.h>\nint main(int argc, const char * argv[])n{\n\
    \    int numDots;\n    numDots = 500;\n    DrawDots();\n    return 0;\n}\n```"
