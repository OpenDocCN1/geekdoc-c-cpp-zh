  md: '# CHAPTER 4: C Basics: Variables and Operators


    The first statement assigns myInt a value of 10. The second statement changes

    Int''s value from 10 to 11. Here''s another example:


    ```

    myInt = 10;

    --myInt;

    ```


    This time the second line of code left myInt a value of 9. You may have

    not that the first example showed the ++ operator following myInt, while the

    second example showed the -- operator preceding myInt.


    The position of the ++ and -- operators determines when their operation is

    in relation to the result of the statement. Placing the operator on the

    right side of a variable or expression (postfix notation) tells the compiler to

    resolve all values before the increment (or decrement) operation.

    Placing the operator on the left side of the variable (prefix notation) tells
    the

    compiler to increment (or decrement) first, and then continue evaluation.

    Confused? The following examples should make this point clear:


    ```

    myInt = 10;

    anotherInt = --myInt;

    ```


    The first statement assigns myInt a value of 10. In the second statement, the
    --

    operator is on right side. This use of postfix notation tells the compiler to

    assign myInt''s value to anotherInt before decrementing myInt. This example

    leaves myInt with a value of 9 and anotherInt with a value of 10.


    Here''s the same example, written using prefix notation:


    ```

    myInt = 10;

    anotherInt = --myInt;

    ```


    This time, the -- operator is on the left side of myInt. In this case, the value
    of

    myInt is decremented before being assigned to anotherInt. The result?

    anotherInt are both left with a value of 9.


    > NOTE: The uses of prefix and postfix notation shows both a strength and a weakness

    of the C language. On the plus side, C allows you to accomplish a lot in a small

    amount of code. In our examples, we changed the value of two different variables
    in

    single single statement. C is powerful.


    On the downside, C code written in this fashion can be extremely cryptic and difficult

    to read for even the most seasoned C programmer. Write your code carefully.'
