  md: 'When you need to choose an int type, read these guidelines one at a time and
    stop at the first one that applies to your situation. Pretty soon you''ll be doing
    it in your sleep. The next few sections explain the reasoning behind these guidelines,
    along with a few refinements.


    # Semantic Types


    The C language, the Standard Library, most other libraries, and more than a few
    programmers, create semantic types. This isn''t part of the C language; it''s
    just a programming convention. We''ll show you how to create your own types in
    Chapter 13. For now, just know that a custom type (like size_t) is just a synonym
    for one of the int types your compiler understands.


    Semantics is the study of the meaning of things. A semantic type is a custom data
    type that defines the purpose or meaning of the values it carries. You''ve already
    seen the size_t returned by the sizeof operator. You can declare a size_t variable
    just like you declare any other kind of variable.


    ```

    size_t mySize;

    ```


    So what kind of int is mySize? The beauty is that you don''t have to care. The
    purpose of the size_t type is to define a variable that will store any count of
    bytes that this CPU can address. The size_t type will be different kinds of ints
    for different kinds of computers. The point is that choosing a data type that
    has meaning, it will always work. If a new CPU comes out and size_t needs to change,
    that''s something for the authors of the Standard Library to worry about, not
    you.


    Other examples are the uid_t type that defines identify a user''s account on a
    system (called the "user ID"). An off_t type variable is guaranteed to be big
    enough describe the position ("offset") within any file. The list goes on and
    on; there are literally hundreds of these kinds of types.


    The corollary to rule #1 is this: if you''re working with values that have a semantic
    type (like size_t), use that type. You know that it will always work for that
    purpose.


    # Exact-Width Types


    There''s another set of custom data types defined in the Standard Library that
    define integers of exactly the size you want. Declaring an int doesn''t guarantee
    you a particular size of int, just that''s well suited for your particular CPU.
    So if you need an int that''s always exactly 16 bits long? You could run a'
