  md: 'The modulo (%) operator makes up for the fact that integer division truncates
    the quotient. Like the division operator (/) it divides the left number by the
    right number, but the result is the remainder of the division instead of the quotient.


    ```

    quo = 16 / 5;

    remain = 16 % 5;

    ```


    the value of 16 is divided by 5 (3.2) and the truncated result (3) is assigned
    to the variable quo. In the second statement, the number 16 is again divided by
    5 and the remainder of that division (1) is assigned to remain.


    The *, /=, and &= operators work the same as their += and -= counterparts. The
    statement


    ```

    myInt = 10;

    ```


    is identical to the statement

    myInt = myInt * 10;


    Similarly, this statement

    is identical to the statement

    myInt = myInt / 10;


    > NOTE: The / operator doesn''t always perform truncation. The accuracy of the
    result is limited by the data type(s) of the operands. As an example, if the division
    is performed using ints, the result will be an int and truncated to an integer
    value.


    Several data types (such as float) support floating point division using the /
    operator. We''ll get to them later in this book.


    To wrap this discussion, it is worth mentioning that most C programmers prefer
    the shortcut version of each of the operators just covered. For example, most
    C programmers would use


    ```

    myInt++;

    myInt /= 2;

    ```


    instead of


    ```

    myInt = myInt + 1;

    myInt = myInt / 2;

