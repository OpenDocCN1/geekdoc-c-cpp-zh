  md: '# Command Arguments and main()


    Earlier we said that a command-line tool may accept arguments, like C functions,
    allowing you to pass values to the command. It''s more than a similarity; it''s
    exactly what happens.


    When the shell run a command line, it uses a special mechanism to turn the text
    you typed on the command line into a series of C strings. These C strings are
    allocated and copied into your program before it begins execution, and you''ve
    been right there since the first chapter. Let''s revisit the definition of main():


    ```

    int main(int argc, char *argv[]) {

    ```


    The parameters to main() contain all of the arguments passed to your program from
    the shell (or any other program that knows how to pass arguments). The argv variable
    is an array of char pointers. Each element is a char pointer that points to one
    command-line argument string. The dimension of the argv array is always argc elements,
    so the valid elements of argv are always argv[0] through argv[argc-1].


    If you create a command-line tool named SeeArgs and run it from the command line,
    mac-pro:~


    ```

    james$ SeeArgs sees args run

    ```


    When SeeArgs''s main() starts, the values of argc and argv will be shown in Table
    9-1.


    **Table 9-1.** Values of argc and argv[]


    | Variable | Value |

    |---|---|

    | argc | 4 |

    | argv[0] | "SeeArgs" |

    | argv[1] | "see" |

    | argv[2] | "args" |

    | argv[3] | "run" |'
