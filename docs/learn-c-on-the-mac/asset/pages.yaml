  md: '# CHAPTER 4 C Basics: Variables and Operators


    The next line of code uses the * operator to assign a value of 6 to myInt. Following
    that, we use printf() to display the value of myInt in the console window.


    ```

    myInt = 3 * 2;

    printf("myInt ---> %d\n", myInt);

    ```


    The code between printf()''s left and right parentheses is known as an argument
    list. The arguments in an argument list are automatically provided to the function
    you are calling (in this case, printf()). The receiving function can use the arguments
    passed to determine its next course of action.


    Interestingly, when you define or declare a function, the elements between the
    parentheses correspond to the argument list are known as parameters. You''ll learn
    more about parameters in Chapter 7. For the moment, let''s talk about printf()
    and the arguments used by this Standard Library function.


    The first argument passed to printf() defines what will be drawn in the console
    window. The simplest call to printf() uses a quoted text string as its only argument.
    A quoted text string consists of a pair of double-quote characters (") with zero
    or more characters between them. For example, this call to printf()


    ```

    printf("Hello!");

    ```


    will draw the characters Hello in the console window. Notice the double quote
    characters are not part of the text string.


    In a slightly more complex scenario, you can request printf() draw a variable''s
    value in the midst of the quoted string. In the case of an, do this by embedding
    the two characters \d with the first argument and by passing the int as a second
    argument. printf() will replace the \d with the value of the int.


    In these two lines of code, we set myInt to 6, use printf() to print the value
    of myInt in the console window.


    ```

    myInt = 3 * 2;

    printf("myInt ---> %d\n", myInt);

    ```


    This code produces this output in the console window:


    ```

    myInt ---> 6

    ```


    The two characters \n in the first argument represent a carriage return and tell
    printf() to move the cursor to the beginning of the next line before it prints
    any more characters. If we deleted all the \n characters from the program, all
    the output would appear on a single line in the console window. Give it a try.
    Just remember to put them back in when you are done playing.


