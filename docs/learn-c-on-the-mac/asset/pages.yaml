  md: '# 3. Add one to the result.


    For example, the binary notation for the number 9 is 00001001. To represent -9
    in two''s complement notation, flip the bits (11110110) and add 1. The two''s
    complement for -9 is 11110110 + 1 = 11110111.


    The binary notation for the number 2 is 00000010. The two''s complement for -2
    would be 11111101 + 1 = 11111110. Note that in binary addition, when you add 01
    + 01, you get 10. Just as in regular addition, you carry the 1 to the next column.


    One side effect of this scheme is that the most-significant bit (the bit on the
    far left, so called because it has the largest value) is 1 when the number is
    negative and 0 when the number is zero or positive. Consequently, it''s referred
    to as the sign bit.


    Don''t worry about the details of binary representation and arithmetic. What''s
    important to remember that the computer uses one notation for positive-only numbers
    and a different notation for numbers that can be positive or negative. Both notations
    allow a byte to take on one of 256 different values. The positives-only scheme
    allows values ranging from 0 to 255. The two''s complement scheme (the "Two''s
    Complement Notation" sidebar) allows a byte to take values ranging from -128 to
    127. Note that both of these ranges contain exactly 256 values.


    # Going from 1 Byte to 2 Bytes


    So far, you discovered that 1 byte (8 bits) of memory can hold one of 2^8 or 256
    possible values. By extension, 2 bytes (16 bits) of memory can hold one of 2^16
    or 65,536 possible values. If the 2 bytes are unsigned (never allowed to hold
    a negative value), they can hold values ranging from 0 to 65,535. If the 2 bytes
    are signed (allowed to hold both positive and negative values), they can hold
    values ranging from -32,768 to 32,767.


    A 4-byte int can hold 2^32 or 4,294,967,296 possible values. Wow! A signed 4-byte
    int can hold values ranging from -2,147,483,648 to 2,147,483,647, while an unsigned
    4-byte int can hold values from 0 to 4,294,967,295. Not enough? Modern C compilers
    support 64-bit, or 8-byte, ints that can hold 2^64 or 18,446,744,073,709,551,616
    possible values. Now that''s a lot of values.


    To declare a variable as unsigned, precede its declaration with the unsigned qualifier.
    Here''s an example:


    ```

    unsigned int myInt;

    ```'
