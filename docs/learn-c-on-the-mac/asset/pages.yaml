  md: '# What Is a Pointer?


    In programming, pointers are references to other things. When someone calls your
    name to get your attention, they''re using your name as a pointer. Your name is
    one way people refer to you.


    Your home address can also serve as a pointer, telling your mail carrier where
    to deliver your shiny new Death Star tea infuser (that''s a real thing!). Your
    home address is unique and distinguishes your home from all the other houses in
    the world.


    When you declare a variable in C, memory is allocated to hold its value. This
    memory has a specific, numeric address. C pointers are special variables, specifically
    designed to hold one of these addresses.


    Later in the chapter, you''ll learn how to create a pointer, how to make it point
    to a specific variable, and how to use the pointer to change the variable''s value.


    # Why Use Pointers?


    Pointers can be extremely useful, allowing you to access your data in ways that
    ordinary variables just don''t allow. Here''s a real-world example of pointer
    flexibility.


    When you go to the library in search of a specific title, chances are you start
    search in an online catalog of some sort. Library catalogs contain thousands of
    entries, one for every book in the library or, in some cases, in a group of libraries.
    Each entry contains information about a specific book, including the author''s
    name, the book''s title, and the copyright date.


    Most library catalogs allow you to search using a variety of methods. For example,
    you might search for a book using the author''s name, the book title, or some
    combination of all these. Figure 7-1 shows a search of the Laramie County, Wyoming
    library catalog. This search specifies an author named Einstein and a book entitled
    The Meaning of Relativity. (What can we say? Einstein fascinates us.)'
