    # struct Arrays


    Just as you can declare an array of chars or ints, you can also declare an array
    of structs:


    ```

    #define kMaxDVDs 5000

    structInfo myDVDs[kMaxDVDs];

    ```


    This declaration creates an equivalent to the first array of 5,000 structs of
    type DVDInfo. The array is named myDVDs. Each of the 5,000 structs will have the
    three fields: rating, title, and comment. You access the fields of the structs
    as you might expect. Here''s an example (note the use of the all-important . operator):


    ```

    myDVDs[10].rating = 9;

    ```


    You have now a solution that uses a single array. Where the first model used three
    arrays, you one. As you''ll see when you start your own programs, packaging your
    data in a struct makes life bit simpler. Instead of passing three parameters each
    time you need to pass a DVD to a function, you can simply pass a struct.


    From a memory standpoint, both DVD tracking solutions cost the same. With three
    separate arrays, the cost is as follows:


    ```

    5,000 bytes /*rating array*/

    5,000 * 256 = 1,280,000 bytes /*title array*/

    5,000 * 256 = 1,280,000 bytes /*comment array*/

    ```


    Total 2,560,000 bytes


    With an array of structs, the cost is this:


    ```

    5,000 * 512 = 2,560,000 bytes /*Cost of array of 5,000 DVDInfo structs*/

    ```


    So what can you do to cut this memory cost down? We thought you''d never ask!'
