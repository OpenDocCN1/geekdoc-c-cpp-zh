  md: '# BUILD SETTINGS


    Xcode compiles and links your program using a huge collection of options called
    the build settings. By default, your project will have two sets of build settings:
    Debug and Release. The Debug settings are used while you test and debug your code.
    The Release settings are used when you archive for deployment.


    The differences between these settings are many, but two of them are pretty important.
    The Debug setting turns off most of the compiler optimizations and adds in a lot
    of data that allows the debugger to do its job. Without these settings, it would
    be difficult (sometimes impossible) to debug your application. On the other hand,
    you want your finished application to be as fast and lean as possible. So when
    deploying your program, use the Release settings, in which optimizations are enabled.


    The other important setting involves the CPU architecture. Different models of
    Macs have different CPUs, and a single executable isn''t compatible with all of
    them. When using the Release build settings, your finished program is actually
    a collection of several copies of your program, one for each supported CPU architecture.
    for each family of CPU. When your program runs, the OS loads the version of the
    program that it understands.


    The Debug build settings, however, do not compile your program for every possible
    CPU. It only compiles it for your CPU, since it assumes you''re the only one that''s
    going to run it. Why compile a bunch of code that''s never going to be run?


    Use the Release build settings if you plan on transferring your program to another
    computer. It''s embarrassing to build a program using Debug build settings and
    copy it to someone''s machine, only to discover it doesn''t contain any code that
    will run. And yes, we''ve done that(blush).


