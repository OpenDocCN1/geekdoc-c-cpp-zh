    \ have a routine job that needs to be performed in multiple places, that is the\
    \ code that should put in a function:\n\nTrimLine() receives a pointer to a string\
    \ and returns a pointer to a string.\n\n```\nchar *TrimLine(char *line)\n{\n```\n\
    \n> Note: TrimLine() doesn't need to know the size of the array where the line\
    \ is stored because it will only get smaller. There's no chance TrimLine() could\
    \ spill over into memory it's not supposed to, so TrimLine() is inherently safe.\n\
    \nThe first task it undertakes is to strip any whitespace characters at the end\
    \ of the line. Just as you've done in other programs, replacing any character\
    \ in a string with '\\0' character terminates that at point, shortening it by\
    \ one or more characters.\n\nThe first task is to determine the location in the\
    \ array of the character.\n\n```\nsize_t length = strlen(line);\n```\n\nThe length\
    \ value tells you how many characters are in the string and can be used to calculate\
    \ the index of the last character, which is exactly what the loop does:\n\n```\n\
    while (length > 0 && isspace(line[length-1])) {\n    line[length-1] = '\\0';\n\
    \    length--; // string is now one shorter\n}\n```\n\nThe first condition checks\
    \ to see that there are still characters in the array. It's just as unsafe to\
    \ access elements before the array as is to access ones the end of the array.\
    \ If length is 0, the expression[length-1] would access a non-existent element.\
    \ Not a good thing.\n\nThe second half of the loop condition determines if the\
    \ last character in the string is whitespace, by including the isspace() function\
    \ you got the cctype.h header. If it is a whitespace character, it is replaced\
    \ with '\\0'. This"
