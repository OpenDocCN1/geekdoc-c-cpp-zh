  md: '# Operator Precedence


    The previous section referred to C''s built-in rules for resolving operator precedence.
    If you have a question about which operator has a higher precedence, look it up
    in the chart in Table 4-1. Here''s how the table works.


    Table 4-1. The Relative Precedence of C''s Built-In Operators


    | Operators by Precedence | Order |

    | --- | --- |

    | ->, ., +, ++ postfix, -- postfix | Left to right |

    | * pointer, & address of, + unary, - unary, !, ~, ++ prefix, - prefix, sizeof
    | Right to left |

    | * multiply, /, % | Left to right |

    | + binary, - binary | Left to right |

    | << left-shift, >> right-shift | Left to right |

    | >, >=, <, <= | Left to right |

    | ==, != | Left to right |

    | & bitwise-and | Left to right |

    | ^ | Left to right |

    | | | Left to right |

    | && | Left to right |

    | || | Left to right |

    | ? | Right to left |

    | =, +=, -=, *=, /=, %, >=, <=, &=, |= = |'
