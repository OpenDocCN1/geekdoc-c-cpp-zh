  md: 'An alternative to the malloc() function is calloc(). calloc() also allocates
    a block of memory, exactly the way malloc() does, it fills that block of bytes
    with zeros before it returns. When you allocate memory with malloc(), the contents
    of the new memory are uninitialized, just like you declare an automatic variable
    in a function. If you want all the values in your new variables to be set to zero,
    the calloc() function instead.


    calloc() takes two parameters. The second parameter is the size of the structure
    or variable that you allocated, just like malloc(). The first parameter is the
    number of structures you allocated. This makes calloc() particularly convenient
    for allocating arrays of things. For example, calloc(100, sizeof(int)) allocates
    a block of memory big enough for an array of 100 ints (int array[100]) and sets
    all of ints to 0.


    To allocate a single thing, pass it as the first parameter, like this: calloc(1,
    sizeof(struct DVDInfo));


    # The Allocated Memory Block


    If malloc succeeded, myDVDPtr points to a struct of type DVDInfo. For the duration
    of the program, you can use myDVDPtr to access the fields of this newly allocated
    struct:


    ```

    myDVDPtr->rating = 7;

    ```


    You need to understand the difference between a block of memory allocated using
    malloc() and a block of memory that corresponds to a local variable. When memory
    associated with that variable is temporary. As soon as the function exits, the
    block of memory associated with that memory is returned to the pool of available
    memory.


    A block of memory that you allocate using malloc() sticks around until you specifically
    return it to the pool of available memory (heap) or until your program exits.


    # free()


    The Standard Library provides a function free() that returns a previously allocated
    memory back to the pool of available memory. Here''s the function prototype:


    ```

    void free(void *ptr);

    ```'
