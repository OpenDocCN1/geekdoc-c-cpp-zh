  md: "coding patterns for error handling. You also want to make sure possible error\
    \ is handled consistently, so some unexpected error (or combination) doesn't leave\
    \ your code trapped in a loop somewhere.\n\nIn this section we will teach you\
    \ coding patterns for handling errors. The first few are demonstrated in an updated\
    \ version of the DVDFiler project you wrote in Chapter 11 named DVDFiler2. It\
    \ also includes some of the enhancements we've already shown you. You'll find\
    \ the project document in the 12.01 - DVDFiler2 folder.\n\n# Follow the Success\n\
    \nThe first error-handling pattern is one we call the \"follow success\" pattern.\n\
    Here's a sketch of what it looks like:\n\n```\nDoSomething();\nif ( successful\
    \ ) {\n    DoSomethingElse() {\n        if ( successful ) {\n            DoAThirdThing();\n\
    \            // be happy\n        }\n    }\n}\n// Handle success or failure\n\
    ```\n\nThe basic principle is to test the success or failure after each step in\
    \ the process using an statement. If successful, the if statement performs the\
    \ next step, and so on.\n\nThis pattern has the advantage that it is easy to follow\
    \ the code, especially the successful path. All of error handling code is grouped\
    \ towards the end of the function, which is also convenient and easier to read.\
    \ Let's rewrite the ReadStructFromFile() function using this error handling pattern.\n\
    \nAt starting the beginning, a new assertion statement makes this function is\
