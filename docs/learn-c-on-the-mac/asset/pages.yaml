  md: 'This second call of Factorial() takes a value of 2 as a parameter. The if statement
    compares this value to 1 and, since 2 is greater than 1, executes the statement:


    ```

    num *= Factorial( num - 1 );

    ```


    This statement calls Factorial() yet again, passing num-1, or 1, as a parameter.

    The third call of Factorial() is portrayed on the rightmost side of Figure 13-1.

    The third call of Factorial() starts with an if statement. Since the input parameter
    was 1, the if statement fails. Now, the recursion termination condition is reached.
    Now, this call of Factorial() returns a value of 1.


    At this point, the second call of Factorial() resumes, completing the statement:


    ```

    num *= Factorial( num - 1 );

    ```


    Since the call of Factorial() returned a value of 1, this statement is equivalent
    to

    num *= 1;

    leaving num with the same value it came in, namely, 2. This second call of Factorial()
    returns a value of 2.


    At this point, the first call of Factorial() resumes, completing the statement:


    ```

    num *= Factorial( num - 1 );

    ```


    Since the second call of Factorial() returned a value of 2, this statement is
    equivalent to

    num *= 2;

    Since the first call of Factorial() started with the parameter num taking a value
    of 3, this statement sets num to a value of 6. Finally, the original call of Factorial()
    returns a value of 6. This is as it should be, since 3 factorial = 3 • 2 • 1 =
    6.


    The recursive version of the factorial program is in the Learn C Projects folder,
    under the subfolder named 13.02 - Recur. Open the project and step through the
    program line by line. Pay particular attention to the stack in the debug navigator,
    as shown on the left in Figure 13-2. Notice the multiple copies of the Factorial()
    function on the stack. Each call to Factorial() pushes a new function onto the
    stack.'
