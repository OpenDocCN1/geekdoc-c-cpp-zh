    > NOTE: Earlier we used the phrase "declaring a variable" and now we''re using
    the term "defining". What''s the difference? A variable declaration is any statement
    that specifies a variable''s name and type. The line myInt; does. A variable definition
    is a declaration that causes memory to be allocated for the variable. Since the
    previous statement does cause memory to be allocated for myInt, it qualifies as
    a definition. Later in the book, you''ll see some declarations that don''t qualify
    as definitions. For now, just remember that a variable definition must be allocated.


    At this point in the program (after myInt has been declared but before any value
    has been assigned to it), myInt is said to be uninitialized. In computers, initialization
    refers to the process of establishing a variable''s value for the first time.
    A variable that has been declared, but has not had a value assigned to it, is
    said to be uninitialized. You initialize a variable the first time you assign
    a value to it.


    Since myInt was declared to be type int, and since Xcode is currently set to use
    4-byte ints, 4 bytes of memory are reserved for myInt. Since we haven''t placed
    a value in those 4 bytes yet, they could contain any value at all. If you want
    a variable to contain a specific value, assign the value to the variable yourself!


    > NOTE: In Chapter 7, you''ll learn about global variables. Global variables are
    always set to 0 when your program starts. Note that all of the variables used
