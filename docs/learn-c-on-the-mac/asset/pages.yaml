    # Text vs. Data Files


    You probably noticed that the file extension of the My Dinos file is data instead
    of txt. That''s because it isn''t a text file. A text file contains nothing but
    ASCII or Unicode characters. You can open it, and likely edit it, using any file
    editor such as TextEdit or Xcode.


    The My Dinos file is different. You can''t open My Dinos and edit it like a text
    file. It''s a format that you created. You used the generic data extension to
    indicate that this file contains data that is not organized in a standardized
    format, like text or JPEG. As you learned in the writeDinoName() function, the
    bytes between names might not even valid characters. Programmers call them junk
    or pad bytes.


    It''s really useful to look at the data in your files. But since My Dinos.data
    isn''t a text file, how do you do it? It turns out that there''s a handy command
    line tool for doing just that. Are you really surprised?


    The hexump command will format the rows of any file and output them to standard
    as hexadecimal digits. Actually, it can output data in all kinds of ways, with
    one hex number per byte is the default. Our favorite hex switch is -C. This switch
    outputs each byte both as a hexadecimal value and (if possible) the corresponding
    ASCII character. Figure 11-6 shows the My Dinos file being "dumped" in the Terminal.


    ![](img/107863f6fad4269a6697938c194582e0_368_0.png)


    The file offsets, on the left column in Figure 11-6, are also in hexadecimal.
