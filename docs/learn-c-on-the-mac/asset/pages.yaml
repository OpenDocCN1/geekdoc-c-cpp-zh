  md: "# C Functions\n\nA C function is a group of C statements. There are many reasons\
    \ for organizing statements into a function, the primary reason for gathering\
    \ statements into a single function is to make them easily reusable.\n\nA cake\
    \ recipe consists of many individual steps: \"sift flour,\" \"add eggs,\" \"preheat\
    \ oven,\" \"spreading icing,\" and so on. By organizing these steps into a larger\
    \ entity, we can now say \"bake a cake,\" instead of repeating all of the individual\
    \ steps.\n\nSimilarly, a C function is a sequence of C statements, the whole of\
    \ which can be invoked as a C statement. (Read that again, slowly.) You create\
    \ your own functions in C like this:\n\n```\nvoid Hello() \n{\n    printf(\"Hello!\\\
    n\");\n}\n```\n\nYou created a function named Hello(), which consists of a single\
    \ statement that calls another function, named printf(), that outputs a message\
    \ to the console window.\n\nCONSOLE\n\nTechnically, the printf() sends its output\
    \ to something called standard output and Xcode redirects output to its console\
    \ pane. You'll learn more about standard output in Chapter 9 when we discuss the\
    \ command line. For the moment, just think of printf() as a function that sends\
    \ information to the console.\n\n> NOTE: Throughout this book, we will designate\
    \ a function by placing a pair of parentheses after its name. This will help distinguish\
    \ between variable names and function names. For example, the name doTask refers\
    \ to a variable (variables are covered in Chapter 4), while doTask() refers to\
    \ a function.\n\nThe printf() function consists of dozens of statements, many\
    \ of which call other functions, which themselves consist of dozens of statements,\
    \ many of which call even more functions—unraveling computer programs can be a\
    \ lot like peeling an onion. The point is, you don't need to concern yourself\
    \ with"
