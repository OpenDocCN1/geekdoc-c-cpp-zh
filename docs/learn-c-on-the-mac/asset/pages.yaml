  md: "Though this program has a few complicated-looking elements, at its heart is\
    \ a single function call. As far as all the other deadly bits, you can read the\
    \ \"Five Pieces\" sidebar, or just ignore them and know that we'll get to them\
    \ as we go along.\n\nSo what does \"calling a function\" really mean? Basically,\
    \ whenever your source code calls a function, each of the statements in the called\
    \ function is executed before the next statement of calling the function is executed.\n\
    \nConfused? Don't worry, you'll get there. Look at Figure 3-2. In this example,\
    \ main() starts with a call to the function myFunction(). This call to myFunction()\
    \ will cause each of the statements inside myFunction() to be executed, one after\
    \ the other. The last statement in myFunction() is executed, control is returned\
    \ to main(). Next, main() calls AnotherFunction(). Once the last statement in\
    \ AnotherFunction() is executed, control is returned to main(), and main() can\
    \ then exit with a return code of 0. When main() exits, your program exits. Returning\
    \ a value of 0 tells whatever program launched your program that it is done.\n\
    \n```\nmain()\n{\n  MyFunction();\n  AnotherFunction();\n}\n```\n\nFigure 3-2.\
    \ main() calls myFunction(). All the statements in myFunction() are executed.\
    \ Once myFunction() returns, main() then calls AnotherFunction().\n\nEvery C program\
    \ you write will have a main() function. Your program will start running with\
    \ the first line in main() and, unless something unusual happens, with the last\
    \ line in main(). Along the way, main() may call other functions which may, in\
    \ turn, call other functions and so on."
