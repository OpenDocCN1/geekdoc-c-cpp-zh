  md: '# Random File Access


    So far, each of the examples presented in this chapter have treated files as a
    sequential stream of bytes. When DVDFiler read from a file, it started from the
    beginning of the file and read the contents, one byte at a time or in chunks,
    but from the beginning straight through until the end. This sequential approach
    works if you intend to read or write the entire file all at once. If you might
    have guessed, there is another model.


    Instead of starting at the beginning and streaming through a file, you can use
    a technique called random access. The Standard Library provides a set of functions
    that let you restore the position indicator to any location within the file, so
    that the next read or write you do exactly where you want to.


    Imagine a file with 100 ints, each of which was 4 bytes long. The file would be
    400 bytes long. Now, suppose you want to retrieve the tenth int in the file. Using
    the sequential model, you would have to den ints to get the tenth int into memory.
    Unless you read the entire file into memory, you''ll be constantly reading a series
    of ints to get the int you want.


    Using the random access model, you would first calculate where in the file the
    tenth int starts. To move to that position in the file and read just that int,
    you''d jump to before the ninth int (`9 * 4 = 36` bytes).


    # Using Random Access Functions


    There are a number of useful functions you''ll need to know about in order to
    randomly access your files. fseek() moves the file position indicator to an offset
    you specify, relative to either the beginning of the file, the current file position,
    or the end of the file.


    ```

    int fseek(FILE *file, off_t offset, int whence);

    ```


    You pass your file pointer as the first parameter, a file position offset as the
    second parameter, and SEEK_SET, SEEK_CUR, or SEEK_END as the third parameter.
    The offset value is relative to the position indicated by the whence argument:
    SEEK_SET represents the current position, and SEEK_END represents the end of the
    file (in which case you''ll probably use a negative offset).'
  merge: -1
