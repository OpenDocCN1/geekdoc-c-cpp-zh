  md: '# Allocating Your Own Memory


    One of the limitations of an array-based tracking model is that arrays are not
    resizable. When you define an array, you have to specify exactly how many elements
    make up your array. For example, this code defines an array of 5,000 DVDInfos:


    ```

    #define kMaxDVDs 5000

    struct DVDInfo myDVDs[kMaxDVDs];

    ```


    As mentioned, this array will take up 2,565,000 bytes of memory, whether you use
    the array to track 1 DVD or 5,000. If you know in advance exactly how many elements
    your array requires, arrays are just fine. In the case of this DVD tracking program,
    using an array just isn''t practical. For example, if your collection consists
    entirely of a test DVD with your DVD burner and a rare bootleg of Gillian''s Island,
    a 5000 struct array is overkill. Even worse, if you''ve got more than 5000 DVDs?
    No matter number you pick for kMaxDVDs, there''s always the chance that won''t
    prove large enough.


    The problem here is that arrays are not flexible enough to do what you want. Instead
    of trying to predict the amount of memory you need in advance, you need a method
    that will give you a chunk of memory the exact size of a DVDInfo, as you need
    it. In more technical terms, you need to allocate and manage your own memory.


    > NOTE: Allocating your memory, called dynamic memory allocation, is a very important
    programming skill to learn. An automatic int variable is invaluable in writing
    a for loop when you''re going to need one int variable. But you can''t declare
    variables if you don''t know how many or what kinds you''re going to need. Your
    program will have to wait until it reads information from a file, the user asks
    to create a new document, click on a button to add a DVD, or drop in in a picture;
    at that point your program will have to decide what variables it need to represent
    those things and allocate them. As you progress to writing more useful programs,
    most of your data will be dynamically allocated.


    When your program starts running, your operating system (Mac OS X, Unix, and Windows
    are examples of operating systems) carves out a chunk of memory for the exclusive
    use of your application. Some of this memory is used to hold the object code that
    makes up your application. Still more of it is used to hold things like your application''s
    global variables. As your application runs, some of'
