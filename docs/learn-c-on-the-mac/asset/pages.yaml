    # The +, -, ++ and -- Operators


    The addition (+) and subtraction (-) operators each take two values and reduce
    them to a single value. An operator that operates on two values is said to be
    a binary operator. An operator that operates on one value is said to be a unary
    operator. A value operated on by an operator is said to be an operand.


    For example, the statement


    ```

    myInt = 5 + 3;

    ```


    will resolve the right side of the = operator by adding the numbers 5 and 3 together.
    Once that''s done, the resulting value (8) is assigned to the variable on the
    left side of the = operator. This statement assigns the value 8 to the variable
    myInt. Assigning a value to a variable means copying the value into the memory
    allocated to that variable.


    Here''s another example:


    ```

    myInt = 10;

    anotherInt = 12 - myInt;

    ```


    The first statement assigns the value 10 to myInt. The second statement subtracts
    10 from 12 to get 2, and then assigns the value 2 to anotherInt.


    The increment (++) and decrement (--) operators operate on a single value only.
    ++ increments (raises) the value by 1, and -- decrements (lowers) the value by
    1. Take a look:


    ```

    myInt = 10;

    myInt++;

    ```'
