    Your first program contains a named main() that passed the test string "Hello,
    world!\n" to printf(). Your next program, Hello2, embeds that functionality in
    a new function, named SayHello().


    > NOTE: You''ve probably wondering why the characters \n keep appearing at the
    end of the text strings. Don''t worry; nothing''s wrong with your copy of the
    book. The \n is perfectly normal. It tells printf() to move the cursor to the
    beginning of the next line in the text window, sort of like pressing the Return
    key in a text editor.

    The sequence \n is frequently referred to as a newline character, a carriage return,
    or just plain return. By including a newline at the end of a printf(), you know
    that the next line you print will appear at the beginning of the next line in
    the console window.


