    # errno


    The caller of your SetHomeDirectory() should now pay attention to the returned
    value. This will let know when SetHomeDirectory() is unsuccessful, but not why
    it was unsuccessful. The answer to that question can be found in the errno variable.


    errno is a global variable defined by the Standard Library that stores an integer
    code describing the problem encountered by the last Standard Library function
    call that failed. Most Standard Library functions return a success/fail indication
    set the specific reason for the failure in errno before they return.


    If chdir() was not successful, the program should do something about it. chdir()
    is a pretty simple routine and is usually successful. But it still might not work


    +   * The directory named in the path doesn''t exist.

