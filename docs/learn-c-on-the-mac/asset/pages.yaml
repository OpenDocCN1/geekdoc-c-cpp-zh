    We''ll explain why that obvious piece of information is important.


    # Pointer Addition


    C allows you to add an integer to a pointer value. The result of the

    expression is another pointer. Here''s example:


    ```

    aPointer = &array[1];nbPointer = aPointer + 1;

    ```


    When you add a number (integer) to a pointer (address), C doesn''t merely add

    the integer value of it to the value of the memory address. C treats

    very pointer as a reference to an "element" in memory, just as every

    index of an array (array[0], array[1], array[2], and so on) addresses one

    element of array.


    In this example, aPointer points to an int. Let''s say that int is at memory

    address 2004. The memory occupied by it is 4 bytes (assuming 32-bit

    ints). Asking C to add 1 to the pointer is asking it to calculate the address
    of the

    next int "element" in memory. It does that by adding 4 to the pointer, because

    the size of an int is 4 bytes. The value of bPointer is now 2008.


    Let''s try this statement:


    ```

    bPointer = aPointer + 6;

    ```


    Again, you''re asking C to calculate the 6th element past the variable that

    aPointer points to. So aPointer points to an int variable (4 bytes), it

    adds 24 (6*4) to the pointer''s address. The address in bPointer is now 2028

    (2004+6*4)) and points to array[7].


    C treats pointers like arrays, so a pointer variable is (C''s mind) a pointer

    to the first element of an array. Adding one to the pointer calculates the address
    of

    the next "element" in that "array." You can see this in relationship shown in

    Figure 9-17.'
