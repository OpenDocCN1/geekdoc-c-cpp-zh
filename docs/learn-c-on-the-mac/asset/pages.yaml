    Let''s discuss how all this works.


    # # Bytes and Bits


    Each byte of computer memory is made up of 8 bits. Each bit has a value of either
    1 or 0. Figure 4-3 shows a byte holding the value 00101011. The value 00101011
    is said to be the binary representation of the value of the byte. Look closer
    at Figure 4-3. Notice that each bit is numbered (the numbers above each bit 0
    on the extreme right side to 7 on the extreme left). This is a standard-numbering
    scheme used in most computers.


    | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |

