  md: '# Stepping Through the Operator Source Code


    Let''s take a look at the Operator project''s source code. In Xcode, bring up
    main in an editing window. main.c starts with the usual #include stdio.h. This
    provides access to printf().


    ```

    #include <stdio.h>

