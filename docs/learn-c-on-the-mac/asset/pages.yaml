    \ Law—except this it applies to you, not your program. If you write your code\
    \ so you must remember to update two things to keep it working, then one day you're\
    \ going to forget to make both changes and your previously working program will\
    \ now have a bug in it.\n\nInstead, write the code like this:\n\n```\nchar buffer[500+1];\n\
    fgets(buffer, sizeof( buffer ), stdin);\n```\n\nThis code removes the assumption\
