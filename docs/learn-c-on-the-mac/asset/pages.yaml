  md: 'NOTE: A computer language that doesn''t care about the positioning or white
    space in your code is a free-form language. C is a free-form language. This is
    in contrast to languages like COBOL and Ruby that require statements to be on
    separate lines, or may even require statements to be at a particular column of
    line to be correct.


    While the C is free-form, the C compiler isn''t. The statements that begin with
    # (as in #include <stdio.h>) are called preprocessor directives. Preprocessor
    directives are, as names imply, commands that give instructions to the compiler
    itself—before C is compiled (or processed). Preprocessor directives must begin
    with a # and must be the only statement on that line.


    The C compiler doesn''t care if you put five statements per line or if you put
    20 carriage returns between your statements and semicolons. One thing the compiler
    won''t do is place white space in the middle of a word, such as a variable or
    function name. For example, this line of code won''t compile:


    ```

    my Int = 5;

    ```


    Instead of a single variable named myInt, the compiler sees two items, one named
    my and the other named Int. Indiscriminate white space can confuse the compiler.


    Too little white space can also confuse the compiler. For example, this line of
    code won''t compile:


    ```

    intmyInt;

    ```


    The compiler needs at least one piece of white space to tell it where the type
    (int) ends and where the variable (myInt) begins. On the other hand, you''ve already
    seen, this line compiles just fine:


    ```

    myInt=5;

    ```


    Since a variable name can''t contain the character =, the compiler has no problem
    telling where the variable ends and where the operator begins.

    As long you compile your code properly, you''re free to develop your own white-space
    style. Here are a few hints:


    +   - Place a blank line between your variable declarations and the rest of your
    function''s code. Also, use blank lines to group related lines of code.

    - Sprinkle single spaces throughout a statement. Compare'
