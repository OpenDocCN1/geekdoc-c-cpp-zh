    # # Namer Safer


    So do you fix Namer? Just as with the Overflow project in Chapter 8, there are
    three approaches: allocate the buffer that''s big enough for the data, or make
    sure the data is not big to fit in the buffer, or make sure the data overflows
    the buffer.


    You can''t use the first solution here because it''s a Catch-22; you have to allocate
    the name array before you call scanf() to read the input buffer, and you can''t
    find out how long the name in the input buffer is until scanf() returns.


    The second approach isn''t practical. You can''t force the user to limit themselves
    to a 20, 50, or even 60000 character name. No matter how big you make the buffer,
    someone could feed your program a string that''s one character longer than that.


    The third approach looks like your best (only) option. One solution would be to
    use a function other than scanf(), as you did in the Overflow project. You replaced
    the strcpy() and strcat() functions with strncpy() and strncat() counterparts,
    which were safer. For reading a string from standard input, you could use a function
    like fgets(). fgets() reads one line of characters from an input stream and copies
    them to a char array. And just like strcpy() and strncat(), one parameter is the
    maximum size of the destination array—fgets() promises to never copy more characters
    than will fit.


