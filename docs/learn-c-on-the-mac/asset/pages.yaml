  md: '# Running a Project


    One nice thing about Xcode project templates is that they always create a finished
    project. Of course, everything it needs to build and run is right from the start.
    In fact, it won''t do much of anything at all starting and then stopping again.
    Changing your project to do something useful is your job.


    But don''t stop there now; let''s make your new project today! Click the Run (the
    big Play button) in the upper corner of the workspace window. Xcode will assemble
    all of the parts of your project (a process known as building) and will execute
    it.


    Don''t expect fireworks. Xcode command-line template makes a project that causes
    the words "Hello, World!" to appear in the lower right pane (called the console),
    as shown in Figure 1-7.


    # HELLO, WORLD!


    Dennis Ritchie developed the original C language over a period of time between
    hippies and disco. Years later, he worked with Brian Kernighan to pen a complete
    description of the language. This version of C became K&R C.


    In his seminal book, the first example of C (it''s on page 6; you can look it
    up) is a tiny program that caused the words "Hello, World" to appear on a console.
    And in those days it was probably a Teletype console—a washingmachine-sized mechanical
    typewriter with roll paper.


    Ever since that day, practically every book that explains, teaches, or describes
    a programming language starts with an example that makes the words "Hello, World"
    appear somewhere. In the spirit of that grand tradition, we are honor bound to
    teach you how to make "Hello, World!" appear on your Mac!


    # Moving On


    Believe it or not, you are now ready to learn C on the Mac!


    You''ve installed all of the tools you need to create OS X applications, and you''ve
    created, built, and run a new application. That''s pretty good for one chapter!


    The next chapter will take a break from all of this excitement to talk about the
    software development process in general.'
  merge: -1
