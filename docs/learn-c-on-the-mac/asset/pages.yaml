  md: 'Now imagine you have three plastic numbers. Place one number inside each of
    the three containers. Figure 4-1 shows a picture of what this might look like.


    ![](img/107863f6fad4269a6697938c194582e0_48_0.png)


    **Figure 4-1.** Three cups, each one labeled each with its own value


    Each cup represents a different variable.

    Now imagine asking a friend to reach into each cup, pull out the number in each
    one, and add the three values together. You can ask your friend to place the sum
    of the three values in a fourth container created just for this purpose. The fourth
    container is labeled and can be seen in Figure 4-2.


    ![](img/107863f6fad4269a6697938c194582e0_48_1.png)


    **Figure 4-2.** Four cups, one of which is the sum of the other three


    This is exactly how variables work. Variables are containers for your program''s
    data. You create a variable and place a value in it. You then ask the computer
    to do something with the value in your variable. You can ask the computer to add
    three variables together, placing the result in a fourth variable. You can even
    ask the computer to take the value in a variable, multiply it by two, and place
    the result back into the original variable.


    Getting back to the example, now imagine that you changed the values in cup1,
    cup2, and cup3. Again, you could call on your friend to add the three values,
