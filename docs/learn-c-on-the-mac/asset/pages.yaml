  md: '# Chapter 8


    # More Data Types


    You may now consider yourself a C Programmer, First Class. At this point, you''ve
    mastered all the basic elements of C programming. You know that C programs are
    made of functions, one (and only one) of which is named main(). Each of these
    functions uses keywords (such as if, for, and while), operators (such as =, ++,
    and *), and variables to manipulate data and make decisions.


    Sometimes you use a parameter to pass values between a calling and a called function.
    Sometimes these parameters are passed by value; other times pointers are used
    to pass a parameter by address. Some functions return values. Others, declared
    with the void keyword, do not return a value.


    So far, all of the variables you''ve declared are ints. In this chapter, you''ll
    focus on other types of variables. As you''ll soon see, there are many other data
    types out of there.


    # Data Types Beyond Int


    So far, the focus has been on ints, which are extremely useful when it comes to
    working with integer numbers. You can add two ints together. You can check if
    an int is even, odd, or prime. There are a lot of things you can do with ints,
    as long as you limit yourself to integer numbers.


    > NOTE: Just as a reminder that 1, 2, 3, 527, 33, and -2 are all integer numbers,
    while 35.7, 0.1, and -1.2345 are not.'
