  md: 'results were output to its standard output, which wasn’t redirected and appeared
    in the Terminal window.


    > NOTE: The wc command is typical of most command-line tools in that it will either
    do its job on the files passed to it as arguments, or on standard input if no
    files are named. The command wc ~/Desktop/Dir.txt will count the characters in
    the Dir.txt file, while the command wc will count the characters on its standard
    input.


    The shell lets you combine, and recombine, tools to accomplish all sorts of tasks.
    As a simple example, consider the ls command (by default) sorts the names of the
    files and directories into ASCII order. As you already know, the ASCII values
    for the upper case letters are smaller than those for the lower case letters.
    This causes ls to produce the following list:


    +   - Desktop

    - Documents

    - Downloads

    - Movies

    - Music

    - Pictures

    - Public

    - bin


    The problem is that bin is after Public. ls does not think “B” comes after “P”
    in the alphabet. Instead, this ordering occurs because the ASCII value of “b”
    is larger than the ASCII value of “P.”


    Here’s another example. The time output of the ls command is piped to the sort
    command, which has a lot of options for sorting things into the desired order.


    ```

    ls | sort --ignore-case

    bin

    Desktop

    Documents

    Downloads

    --

    ```


    The sort command reads the lines from standard input, sorts them according to
    the criteria specified by the arguments, and outputs the sorted list to its standard
    output. Now your folder names are sorted into alphabetical (rather than ASCII
    value) order.'
