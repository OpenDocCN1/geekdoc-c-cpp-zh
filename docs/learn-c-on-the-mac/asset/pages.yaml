  md: 'What you are looking at disassembled code. As mentioned earlier in the book,
    C is a computer language that gets translated into machine code by a compiler.
    The machine code is what the CPU actually executes. Machine code is a string of
    numbers that makes sense to a CPU but is unreadable to most humans.


    When you out of main() you stepped into machine code that was compiled by Apple,
    the BSD engineers, or possibly the compiler. Neither you nor Xcode has the source
    code for this machine code, so Xcode shows you the raw machine code. Xcode disassembles
    it into a format that is bit more readable than simple numbers, though not as
    readable as C source code. Believe it or not, computer engineers who can read
    that disassembly.


    Interestingly, since your source code gets translated into this machine code,
    you can see your pretty C in this form if you like. Stop a breakpoint in your
    program and check the Product > Debug Workflow > Show Disassembly While Debugging
    menu item. When you are done your debugging, you set whatever breakpoints you
    want and click the Continue button, uncheck the item to go back to C.


    # # Full Speed Ahead


