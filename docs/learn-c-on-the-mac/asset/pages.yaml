    A couple of functions dealing with errno are perror() and strerror(). perror()
    is a convenience function that writes a message to stderr along with a description
    of the current errno value, translated into your local language. In the following
    code example, if chdir("chdir") failed and set errno to ELOOP, the function perror("chdir
    failed") will output this message to stderr:


    ```

