  md: '# INTRODUCTION


    "My first class that I had underestimated my audience was when I started getting
    e-mails from fifth graders who were making their way through the book. Fifth graders!
    And not just one but lots of nine-, ten-, and eleven-year kids were digging in
    and learning to program. Cool! And the best part of all was when these kids started
    sending me actual products that they created. I couldn''t have imagined it!


    Dave was really on something. This years, we were from soccer moms, hobbyists,
    even folks who were using the Mac for the first time, all of whom they made their
    way through Learn C on the Mac and came out the other deified, proud, and full
    of knowledge.


    So what do you need to know to start? Although learning C by just reading a book
    is possible, you''ll get the most out of it if you run each program as you encounter
    it. To do this, you''ll need a Mac running OS (preferably version 10.6.8 or later)
    and an Internet connection. You''ll need the Internet connection to download the
    free tools Apple has graciously provided for anyone interested in programming
    the Mac and to download the projects that go along with this book.


    Again, if you know nothing about programming, don''t worry. The first few chapters
    of this book will bring you to speed. If you have some programming experience
    (even a lot), you might want to skin the first few chapters, and then dig right
    into the fundamentals that start in Chapter 3.


    # The Lay of the Land


    Here''s a quick tour of what''s come in this book.


    +   Chapter 1 shows how to get the free software tools you''ll use throughout
    the book.


    +   Chapter 2 explains some of the basics of how computer programs are built.


    +   Chapter 3 shows how to embed a series of programming statements into a reusable
    function, you can call again and again.


    +   Chapter 4 adds variables and operators in the mix, bringing the power of mathematical
    expressions into your programs.


    +   Chapter 5 teaches you how to watch your program execute, line-by-line, and
    see that it''s doing the right thing, or fix it if it''s not.


    +   Chapter 6 introduces the concept of flow control, using constructs like if,
    else, do, and while to control the direction your program takes.


    +   Chapter 7 covers pointers and parameters, two concepts that will add a dramatic
    new level of power to your programs.


    +   Chapter 8 moves the simple data types used in the first half of the book,
    adding the ability to work with more complex numbers along with data types like
    arrays and text strings.'
  merge: -1
  pgno: 4
