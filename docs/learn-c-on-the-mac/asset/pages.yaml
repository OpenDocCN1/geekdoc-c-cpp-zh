    \  NumberToRoman((int)number\n```\n\nIf the number can't be converted, the same\
    \ number is echoed.\n\n```\n} else {\n  printf(\"%lld\", number);\n}\n```\n\n\
    Notice that the number scanned is a long int. That's in case the number encountered\
    \ in the stream is a big one, it won't get messed up because it wouldn't fit in\
    \ a regular int.\n\nFinally, there's the else clause for the original isdigit()\
    \ decision. If the character read from the stream isn't a digit, it gets echoed\
