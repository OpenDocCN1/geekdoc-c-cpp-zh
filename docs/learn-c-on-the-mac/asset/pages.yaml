  md: '# Creating a Command-Line Tool


    descriptions. There are whole books just on shell scripting; check the www.apress.com
    site. You won''t need to learn any of that to get through this book. We''re not
    going to concentrate on the shell so much as what it takes to create a C program
    that can run as a shell command.


    A command-line tool is an executable file that''s designed to be useful when used
    from a command-line interface. Remember that the shell can just start about any
    executable file that exists on your system, but not all of those are going to
    be useful. What we refer to as a "command-line tool" is, therefore, not a technical
    description so much as a statement of its intent.


    So every executable you''ve created so far few of them would be considered command-line
    tools. For example, the Astronomical project from Chapter 8 would make a terrible
    command. The program simply stores a number in memory and then exits. The program
    doesn''t do any useful work. It doesn''t output anything interesting information.
    It doesn''t accept any input. It basically starts, does nothing, and stops. Again.


    Useful command-line tools tend to interact with the user or other tools. They
    do this through input and output. You''re already familiar with the output half—all
    of those print to the shell (when you''re not running your program from Xcode).


    Now you''re going to explore the input side of the equation. Command-line tools
    get their input from two sources: command-line arguments and standard input or
    stdin.


    Command-line arguments are strings passed from the shell to your program. When
    you execute a command with one or more arguments, like ls -1, those arguments
    are converted into C strings and passed along to the program. The program can
    examine the arguments—in this example, the ls sees you used -1 and uses them to
    alter its behavior. How a tool uses arguments is entirely up to it.


    The other input is standard input, referred to in code as stdin. Standard input
    is the complement to standard output (stdout). The functions printf() and putchar()
    send characters to standard output, where they end up in the Xcode console window,
    or the Terminal window, or possibly elsewhere. A command-line program''s standard
    input is where it can receive characters sent to it by you or from another program.
    Let''s start with command-line arguments.'
  merge: -1
