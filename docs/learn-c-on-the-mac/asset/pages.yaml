    \ PrintMyVar() prints myVar and returns. If myVar were a global, you could have\
    \ avoided using some parameter passing. main() and PrintMyVar() could have shared\
    \ myVar without the use of parameters.\n\nWHEN TO USE GLOBALS\n\nWhen should you\
    \ use parameters? When should you use globals?\n\nIn a nutshell, you should generally\
