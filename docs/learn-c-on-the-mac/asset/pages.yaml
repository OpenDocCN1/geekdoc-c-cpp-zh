    Figure 5-4) starts your program running again. It won''t stop until it encounters
    another breakpoint. It''s useful for when you want to stop at breakpoints you''ve
    set, instead of stepping through code one line at a time. In this style of debugging,
    you set whatever breakpoints you want and click the Continue button, letting the
    program run at full speed until it hits another breakpoint.


    Take the example shown in Figure 5-9, where a breakpoint has been set inside the
    SayHello() function. In this situation, the program will begin running main()
    and then stop when it encounters the printf() statement. If you press the Continue
    button, it might not appear that anything happens at all (except that a "Hello,
    World!" message will appear in the console) the program doesn''t move. What happened
    was this: the rest of the SayHello() function executed; control returned to main(),
    which made a call to SayHello(); the program entered SayHello() for the second
    time; and the debugger ran again the same breakpoint and stopped.


    > TIP: Whenever you''re running a program under Xcode''s control the Stop button
    in the toolbar becomes active. Clicking the Stop button will completely stop (also
