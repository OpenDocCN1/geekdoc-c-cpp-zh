    Objective-C is a programming language based on Cocoa. Everything you will learn
    about Objective-C. Objective-C is designed to write code that represents parts
    of your program, such as a scrolling window, an image, or a menu. Cocoa is a collection
    of objects that represent all the elements of the Mac experience. Objective-C
    was designed to work together with Cocoa and Cocoa Touch.


    Learn C, Objective-C, and Cocoa, and you will have everything you need to develop
    the most complex Macintosh applications. Learn C, Objective-C, and Cocoa Touch,
    and you will have everything you need to develop applications designed to run
    on mobile devices iOS.


    Learn C on the Mac is the beginning of a series of books that will teach you how
    to build professional Mac and iOS applications. Once you''ve finished this book,
    you''ll want to dig into Objective-C on the Mac, 2nd Edition by Mark Dalrymple,
