    # The Programming Process


    In Chapter 1, you installed the Mac development tools and went through the process
    of creating a project, which you then built and ran. Let''s take a look at the
    programming process in a bit more detail.


    # Source Code


    No matter their purpose, most computer programs start as source code. Your source
    code will consist of a sequence of instructions that tells the computer what to
    do. Source code is written in a specific programming language, such as C. Each
    programming language has its own set of rules (called syntax) that defines what
    is and isn''t legal in that language.


    Your mission in reading this book is to learn how to create useful, efficient,
    and best of all, legal C source code.


    If you are programming using everyday English, your source code might look like
    this:


    > “Hi, Computer! Do me a favor. Take the numbers from 1 to 10, add them together,
    and tell me the sum.”


    If you want to run this program, you need a programming tool that understood source
    code written in English. Sadly, computers don''t understand English (yet). Instead,
    you must use a precise language, like C, to explain to the computer exactly what
