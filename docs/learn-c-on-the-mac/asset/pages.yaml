  md: "The problem with character streams is: the only way to figure out if you want\
    \ to do something with the next character is to read it, and once you've read\
    \ it, it's no longer in the stream. If you decide it's not a character you want\
    \ to process, you're stuck—the character has already been read. ungetc() lets\
    \ you undo the last (only) fetch putting read back into the stream as With the\
    \ first digit of the number in the stream, you can use fscanf() to scan the next\
    \ integer from the stream.\n\n```\nlong int number;\nscanf(\"%lld\", &number);\n\
    ```\n\nThe number read is now checked to see if it's one that your program can\
    \ convert (remember that NumberToRoman() can only convert numbers between 1 and\
    \ 3,999). If not, the number is converted out to standard out. The effect is that\
