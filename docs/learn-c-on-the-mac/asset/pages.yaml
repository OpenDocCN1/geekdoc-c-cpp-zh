    after ~/bin:


    ```

    echo PATH="$PATH:~/bin" >> .bash_profile

    ```


    The echo command is a tool that''s not more complicated than the one you write.
    It does nothing more than output (echo) all of its arguments to standard output—just
    like yours, but without embellishment. In this case, its single argument is the
    shell statement PATH="~/bin", surrounded by single quotes. This statement works
    something like a assignment statement. It says that the PATH variable is to be
    set to the contents of the previous PATH plus a colon and one more path, ~.


    This statement gets added to a special file named .bash_profile. The >> operator
    takes care of redirecting the echo''s output and appending it to the end of the
    .bash_profile file. We''ll explain all about redirection later in this chapter.


    Every time the shell starts up, it looks for a file .bash_profile in your home
    folder. If it finds it, it executes all of the statements it finds. By adding
    this statement, every new shell will be configured to look for commands in your
