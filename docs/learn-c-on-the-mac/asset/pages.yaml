    # Where to Place the Semicolon


    So far, the statements you''ve seen fall into two categories: simple statements
    and compound statements. Function calls, such as calls to printf(), and assignment
    statements are called simple statements. Always place a semicolon at the end of
    a simple statement, even if it is broken over several lines, like this:


    ```

    printf("%d%d%d");

    vari, var2, var3, var4 );

    ```


    Statements made up of several parts, including (possibly) other statements, are
    called compound statements. Compound statements obey some pretty strict rules
    of syntax. The if statement, for example, always looks like this:


    ```

    if ( expression )


    ```


    Notice that there are no semicolons in this definition. The statement part of
    the if can be a simple statement, a block, or other compound statement. If the
    statement is simple, follow the semicolon rule for simple statements and place
    a semicolon at the end of the statement. If the statement is a block, it will
    be two braces ({}) with statements between them. If the statement is compound,
    repeat these rules.


    Remember that using curly braces, or curlies, to build a block of smaller statements
    does not require the addition of a semicolon; a simple statement ends with a semicolon,
    while a block begins and ends with curly braces.


