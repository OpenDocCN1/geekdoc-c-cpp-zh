    # File System Objects


    What''s really remarkable about the ReplaceNumbersInStream() function is that
    there is only one. This single function takes one FILE pointer parameter and uses
    it to read the characters in a file, or a character stream, or your keyboard,
    and then translate that information and send the results to standard out.


    This works UNIX is built around the philosophy that "everything is a file." Thus,
    an open FILE pointer could refer to a regular file, a directory, a character stream,
    a pipe from another program, your keyboard, the console pane in Xcode, a Terminal
    window, or a network communications socket. The beauty here is that no matter
    what it is, if you want to send one character to that file/pipe/console/window/socket
    you call fputc().


    > NOTE: Don''t believe us? Run your Roman program again, from the command line
    or Xcode, by itself without any arguments. It will start running and waiting,
    for you to type something since your keyboard is not connected to its standard
    in. Start typing words and pressing Return in between, and see what happens.


    This kind of interchangeability is called abstraction, and it''s a key concept
    in object-oriented programming. It''s great for programmers you don''t have to
    write four different versions of ReplaceNumbersInStream()—one that reads from
    a file, one that reads from a pipe, one that reads from your keyboard, and one
    that reads from a network port. You write one function that reads from a FILE
    and then you pass it any kind of open FILE you can get your hands on.


    Well, almost. The one thing you need to know about abstraction is that just because
    all of these different things can be represented by a FILE, it doesn''t'
