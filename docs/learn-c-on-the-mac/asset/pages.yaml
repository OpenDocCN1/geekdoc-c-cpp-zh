  md: "None of these decisions are cut and dry. There's a very influential book titled\
    \ Design Patterns: Elements of Reusable Object-Oriented Design written by the\
    \ so-called \"Gang of Four,\" Erich Gamma, Richard Helm, Ralph Johnson, and John\
    \ Vlissides. The book describes common programming problems and elegant solutions\
    \ to those problems. These \"design patterns,\" as they have become known as,\
    \ are universal and can be applied to just any computer language. If you're serious\
    \ about programming, you should become familiar with design patterns.\n\nAt the\
    \ same time, people have observed \"anti-patterns,\" bad practices used by poor\
    \ programmers. Using too many global variables is an anti-pattern, and here's\
    \ why. One philosophy of variable scope is that it should match the scope of its\
    \ purpose. In other words, a variable should be accessible (in scope) to code\
    \ that makes use of that variable, and not much else. Functions shouldn't have\
    \ access to unrelated variables. A global variable is accessible everywhere, but\
    \ it's rare to find a variable whose purpose is applicable to every function in\
    \ your program. As your programs get larger, they become even more rare.\n\nLet's\
    \ take a look at the proper way to add globals to your programs.\n\n# # Adding\
    \ Globals to Your Programs\n\nAdding globals to your programs is easy. Just declare\
    \ a variable outside of any function. Here's the example we showed earlier, using\
    \ globals in place of parameters:\n\n```\n#include <stdio.h>\n\nvoid PassAlong(\
    \ void );\nvoid PrintMyVar( void );\n\nint gMyVar;\n\nint main( int argc, const\
    \ char * argv[]) {\n    gMyVar = 10;\n    PassAlong();\n    return 0;\n}\n\nvoid\
    \ PassAlong( void ) {\n    PrintMyVar();\n}\n\nvoid PrintMyVar( void ) {\n   \
    \ printf(\"gMyVar = %d\\n\", gMyVar );\n}\n```"
