- img_proc: true
  md: '# CHAPTER 3: C Basics: Statements and Functions


    compiler complaints and won''t compile your program. You''ll explore several common
    kinds of syntax errors, and fix them, later in this chapter.


    The second type of mistake is a semantic error, or a flaw in your program''s algorithm.
    An algorithm is the approach used to solve a problem. You use algorithms all of
    the time. For example, there''s an algorithm for sorting your mail:


    +   1. Start by taking the mail out of the mailbox.


    +   2. If there''s no mail, you''re done! Go watch TV.


    +   3. Take a piece of mail out of the pile.


    +   4. If it''s junk, throw it away, and go back to step 2.


    +   5. If it''s a bill, put it with the other bills, and go back to step 2.


    +   6. If it''s not a bill and not junk mail, read it, and go back to step 2.


    This algorithm completely describes the process of sorting through your mail.
    Notice that the algorithm works, even if you didn''t get any mail. Notice also
    that the algorithm always ends up at step 2, with the TV on.


    Figure 3-1 shows a pictorial representation of the mail-sorting algorithm, commonly
    known as a flow chart. Much as you might use an outline to prepare for an essay
    or term paper, you might use a flow chart to flesh out a program''s algorithm
    before you actually start writing the program. Here''s how this works.


    ![](img/107863f6fad4269a6697938c194582e0_28_0.png)


    Figure 3-1. The mail-sorting flow chart'
