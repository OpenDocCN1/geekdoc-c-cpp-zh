  md: "# Check Ranges\n\nAnother trap programmers fall into is assuming that a particular\
    \ variable is always within a reasonable range. What \"reasonable\" depends on\
    \ the code, it's very tempting to write your code for the values that work and\
    \ forget about the values that won't.\n\nHere are two good examples from the Factor\
    \ project from Chapter 7, both of which are in the Factor() function. Let's start\
    \ with the value of the number parameter.\n\n```\nbool factor(int number, int\
    \ *firstFactorPtr, int *secondFactorPtr) {\n  int factor;\n  for ( factor = sqrt(number);\
    \ factor > 1; factor-- ) {\n    if ((number % factor) == 0) {\n      break;\n\
    \    }\n  }\n}\n```\n\nThis looks perfectly safe code. Given any number, the loop\
    \ will look for a factor of number (greater than 1) and stop. So what's the problem?\n\
    \nThe problem is that number is an int. An int can also be zero or negative numbers.\
    \ In those cases, the sqrt() function doesn't work for 0 or negative numbers.\
    \ The value that ends up getting stored factor could be -1, factor was set to\
    \ some crazy value like -2,147,483,648. If number is 0, factor will likely be\
    \ 0 and the number%factor expression will terminate your program with a \"divide\
    \ by zero\" exception. Yikes!\n\nHow do you protect your program from out-of-range\
    \ values? There are three techniques. The first is a little timid, but legitimate:\
