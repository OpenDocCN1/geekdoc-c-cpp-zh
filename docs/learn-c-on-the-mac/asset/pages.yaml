    # Getting Rid of the Extra Carriage Return


    If you look back at Figure 10-1, you might notice an extra carriage return after
    each line of output produced by PrintDVDTitle(). That''s because fgets() reads
    a line, it includes all of the characters on that line, including the newline
    at the end of the line. (This is in contrast to scanf(), which stops when it gets
    to the newline character). Under normal circumstances, the newline is always the
    last character in the string buffer, so you can add this line of code (just add
    after fgets()) to get rid of it:


    ```

    title dvdNum = [ title dvdNum ] - 1 = ''\0'';

    ```


