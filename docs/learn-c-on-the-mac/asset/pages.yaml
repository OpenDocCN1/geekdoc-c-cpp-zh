  md: "# Murphy’s Law\n\n> Anything that can go wrong will go wrong.\n\n - Edward\
    \ Murphy, Jr.\n\nForget everything you've heard about Murphy's Law. The real Murphy's\
    \ Law has nothing to do with the perverseness of the universe or booted task's\
    \ ability to laugh, right-side-down, on your carpet.\n\nMajor Edward A. Murphy,\
    \ Jr. was an aerospace engineer who worked on safety-critical systems for the\
    \ United States Air Force. While the exact origins of his law are somewhat murky,\
    \ famous proclamation spans an extremely important principle of engineering: if\
    \ there is any possibility that some element of an event will fail, then it will\
    \ fail if that event is repeated enough.\n\nPouring a glass of ice tea seems like\
    \ a simple and repeatable task. It might have an error rate of 1:100,000. In other\
    \ words, if you pour 100,000 glasses of ice tea, 99,999 of those will go flawlessly\
    \ and not one—the tea misses, you knock over the glass, or whatever. That sounds\
    \ like phenomenally good odds. You could easily go your entire life, pouring one\
    \ or two glasses of ice tea every day, and never have a mishap.\n\nNow take a\
    \ group of 10,000,000 people pouring a single glass of ice tea each day. With\
    \ an error rate of 1:100,000 there will be, on average, 100 spilled glasses of\
    \ tea every day—every day! Murphy’s law tells us that, unless there is absolutely\
    \ zero chance, if you continue to do that thing, and wait long enough, it will\
    \ (eventually) go wrong.\n\nWhat does that have to do with programming? If there’s\
    \ a possibility that something can go wrong, given enough time and enough repetitions,\
    \ that will go wrong. It could be an index that is beyond the dimension of an\
    \ array. It could be a file that is missing or contains data you're not expecting.\
    \ If your code is not written to anticipate and deal with those potential problems,\
    \ one day your program will behave badly. It could crash, stop working, act strangely,\
    \ freeze or ever destroy important data.\n\nTake the DVD you wrote in the last\
    \ chapter. Imagine a hard drive glitch that caused a bad bit of data to be written\
    \ to the first record in the My DVD Data.txt file. If the wrong amount of data\
    \ was written to that first record, the remaining DVD records would all be read\
    \ incorrectly. Once that happened, the data was written back out, it would wipe\
    \ out your entire database of DVD titles! Now the chances of that are slim, but\
    \ remember Murphy’s Law. If there"
