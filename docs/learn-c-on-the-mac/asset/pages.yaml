  md: 'void *nothing;

    *nothing = 1;


    You can''t assign anything to the “value” that nothing points to because the compiler
    doesn''t know what that is. Is it an int? A float? A struct of some kind?


    So what good are void pointers? Bear with us and you''ll find out.


    # Converting the Type Returned by malloc()


    Here''s a code fragment that allocates a single DVDIInfo struct:


    ```

    struct DVDIInfo *myDVDIptr;

    myDVDIptr = malloc(sizeof(struct DVDIInfo));

    ```


    In general, you will convert the type returned by malloc() to the pointer you
    really want. Here''s how it''s typically done. The first line of code declares
    a new variable, myDVDIptr, which is a pointer to a DVDIInfo struct. At this time,
    myDVDIptr doesn''t point to a DVDIInfo struct. You''ve just told the compiler
    myDVDIptr is designed to point to a DVDIInfo struct.


    The second line of code calls malloc() to allocate a block of memory the size
    of a DVDIInfo struct. The sizeof operator results in a size_t integer, exactly
    the type you need to pass as a parameter to malloc(). Convenient!


    On the right side of the = a void * and on the left side is a struct DVDIInfo
    *. The compiler will normally complain if you try to assign a pointer of one type
    to a pointer of a different type. Consider the confusion that could result if
    you set a pointer to a char to the address of an int.


    The compiler makes an exception for void pointers. It allows you to assign a void
    pointer to any kind of pointer, and any kind of pointer can be assigned to a void
    pointer. In effect, a void * is a wildcard pointer that can point to anything
    in memory. C trusts what you know it actually points to.


    So you could use a typecast here to make this more explicit:

    myDVDIptr = (struct DVDIInfo *)malloc(sizeof(struct DVDIInfo));


    Though this explicit typecast isn''t strictly necessary, it makes your intentions
    quite clear and allows the compiler to step in with a warning if you''ve got your
