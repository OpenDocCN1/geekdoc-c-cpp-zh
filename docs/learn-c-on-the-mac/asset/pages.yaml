  md: '# Building Your Application


    Xcode starts by compiling main.c and extras.c source files, shown in Figure 2-2,
    turning them into object code. Next, all three object files are linked together
    by the linker to create a runnable application. The programs in this book were
    all designed to run in the console window. As you make your way through the rest
    of the books in this series, you''ll learn how to add the rest of the pieces necessary
    to create applications that can run from the Finder. For now, Xcode’s console
    will do just fine.


    This entire process—turning source code into a finished program—is called a build.
    Xcode’s build command takes care of all of the details for you. It determines
    what compilers use, keeps track of the libraries your code links, finds a place
    to store all of the intermediate files created by the compilers and linkers, and
    keeps those files organized and up-to-date.


    The great thing about Xcode is that you''ll probably never have to concern yourself
    with any of these under-the-hood details. You just write your source code and
    press the Run button. Xcode will take care of the rest.


