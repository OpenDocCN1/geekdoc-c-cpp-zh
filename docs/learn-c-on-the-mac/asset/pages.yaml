    ```


    The message parameter to perror() is optional; you can just print the error code
    using perror(NULL). perror() is only if you just want to dump a description of
    the current errno value to the output stream.


    If you want to do a little more with errno, strerror() will translate the error
    code into a readable description and return as a string pointer. You can use that
    to format a more comprehensive message, or whatever you decide. strerror()''s
    parameter is the errno code to translate, so it isn''t dependent on the current
    value of errno.


    The definition of errno, and the constants for all of its possible values, is
    in <errno.h>. The prototype for perror() is in <stdio.h>. You will find strerror()
    defined in <string.h>. For even more error display functions, check out the err(),
    warn(), and related functions defined in <err.h>.


    # Rule #3: Have an Escape Plan


