  md: 'On the down side, console-based user interfaces tend to be limited. With a
    console-based interface, you can''t use an elegant graphic to make a point. Text-based
    interfaces can''t provide animation or digital sound. In a nutshell, the console-based
    interface is simple and, at the same time, simple to program. OS''s graphical
    user interface (GUI) offers an elegant, more sophisticated method of working with
    a computer.


    # Learning Objective-C


    Your Mac programs wouldn''t be the same without, drop-down and pop-up menus, icons,
    buttons, and scroll bars. You can and add these user elements to your programs.
    Fortunately, the set of Apple developer tools you downloaded and installed at
    the beginning of this book includes everything you need to build world-class applications
    with all the elements that make the Mac great!


    The key to working with these elements is understanding Objective-C and Cocoa.
    The Objective-C language is a superset of C. This means that everything you just
    learned about C will work in Objective-C There are a number of excellent resources
    for learning Objective-C. One of them is just a mouse click away.


    Choose the Documentation and API Reference command from the Xcode Help menu. This
    will open Xcode''s documentation browser. In the search field, type "Programming
    Objective-C" and press Return. In the list of results, locate two documents: Programming
    with Objective-C The Objective-C Programming Language. Jump to the second if you
    want to get a feel for what Objective-C has to offer. to start learning the language.
    If you''ve never done any object oriented programming, the second document has
    a link to the Object Oriented Programming with Objective-C guide, which is a great
    primer on the advantages of objects.


    Learn these documents. They are very well written and detailed, and best of all,
    they''re free! Take a few minutes to read through the first few pages. If you
    feel comfortable with the language and the tone, you''ve found your path to learning
    Objective-C.


