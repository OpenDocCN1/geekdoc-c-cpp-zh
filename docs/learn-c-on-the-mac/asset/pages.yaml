  md: '# Chapter


    # # Go Get the Tools!


    If you want to build a house, you need a solid set of well-crafted tools. Building
    computer programs is no different. Programming requires a specialized set of development
    tools—basically, programs that make programs.


    In the early days of C, you only needed a few, relatively simple tools. As computers
    have become more sophisticated, so has the universe of development tools. Today,
    it''s not uncommon to employ dozens of programs to create even "simple" application:
    editors, compilers, linkers, debuggers, emulators, profilers, analyzers, and more.
    Add to that lists that help you find documentation, cross reference your code,
    record your development history, and, well, it''s starting to look like a hardware
    store full of tools!


    The good news is that Apple has come to your rescue. Just as Apple has used an
    elegant user interface to demystify their most sophisticated applications, they''ve
    done the same for software developers. (That''s you!)


    # ## Installing Xcode


    Apple''s Xcode is a complete hardware store of software development tools, packaged
    and delivered as a single application. All you have to do is your program and
    Xcode will—behind the scenes—direct the scores of individual development tools
    needed to turn your idea into reality. It would make the Wizard of Oz proud.


    > NOTE: An organization that organizes multiple development tools into a single
    workspace is called an integrated development environment (IDE). Xcode is an IDE.'
  merge: -1
  pgno: 6
