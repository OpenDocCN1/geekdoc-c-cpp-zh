  md: '# 14


    Chapter


    # # Where Do You Go from

    Here?


    Now that you''ve mastered the fundamentals of C, you''re next step is to dig into
    the specifics of Mac programming. As you run the example programs in the previous
    chapters, you probably noticed that none of the programs sport the look and feel
    that make a Mac Mac program. For one thing, all of the interaction between you
    and your program focuses on the keyboard and the console window. None of the programs
    take advantage of the mouse. None offer color graphics, pull-down menus, buttons,
    checkboxes, scrolling windows, or any of the thousand things that make OS X applications
    so special. These things are all part of the Mac user interface.


    In short, the book has, so far, taught basic C programming on a Mac computer.
    This is fundamentally different from creating programs that have a Mac GUI interface.
    That''s the next logical step in the process, and that''s what this chapter is
    about.


    # ## The Mac User Interface


    The user interface is the part of your program that interacts with the user. So
    far, your user interface skills have focused on writing to and reading from the
    console window using functions such as printf(), scanf(), and getchar(). The advantage
    of this type of user interface is that each of the aforementioned functions is
    available on every machine that supports the C language. Programs written using
    the standard library are extremely portable.


    455'
