  md: '# Deploying the Program


    The next step is to build your program so that it''s suitable to be deployed.

    Deploying a program means to package it up so that it can be delivered to other
    developers, testers, or your users. This might mean nothing more complicated than
    copying the finished program to a folder on your computer. But if you copy it
    to a USB drive, put it in a disk image, upload it to a web server, or even submit
    it to Apple''s App Store.


    Use Xcode''s Archive command to prepare your program for delivery.

    The Archive command copies your program in a format suitable for distribution,
    and then packages all of the parts that got delivered. These files are called,
    appropriately enough, the deliverables. For a command line tool, there''s really
    only one file (the executable), but Xcode will produce two files. We''ll explain
    why in a bit.


    Prepare your archive by choosing the Archive command from the Product menu.

    Xcode will rebuild your project and convert the finished product into an Xcode
    archive. The archive will appear in the Organizer window, as shown in Figure 9-7.


    ![](img/107863f6fad4269a6697938c194582e0_242_0.png)


    **Figure 9-7.** Finished SeeArgs archive in Organizer window


    The Archive command behaves according to your project''s Archive scheme.

    You saw how to edit archive schemes earlier. If you choose Edit Schemes and then
    the Archive scheme, you can edit its options. But you shouldn''t have to. The
    default options should be perfect.'
