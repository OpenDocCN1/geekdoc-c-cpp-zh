- img_proc: true
  md: 'The signed and unsigned modifiers are mutually exclusive, meaning that you
    can use one or the other, never both. You''ll rarely see the signed modifier in
    C source code, because all variables are signed unless you specify otherwise.
    Thus, the signed int is redundant, as almost no one ever writes it (although it''s
    perfectly legal). Floating point variables are always signed; you don''t get a
    choice.


    Programmers are generally a lazy lot and very soon tired of writing "long int"
    and "unsigned int". We''re saying that if they could save themselves 200 keystrokes,
    it would mean they could retire to a desert island much sooner.


    Regardless, programmers often exploit a quirk of the integer type modifiers to
    write less code. If you use any of the short, long, signed, or unsigned keywords,
    the compiler *assumes* you are declaring an int type—unless you specify otherwise.
    This means you can leave the actual "int" out of the declaration without changing
    its meaning. Here are three verbose declarations:


    +   - unsigned noSign;

    - short kindaSmall;

    - unsigned long int kindaBig;


    The following code means exactly the same thing, and you''ll find this second
    form used often:


    +   - unsigned noSign;

    - short kindaSmall;

    - unsigned long kindaBig;


    We don''t care which one you use. The compiler doesn''t care which you use. Just
    don''t fall into the trap of thinking that short, long, and unsigned are distinct
    data types. They''re not. They''re all variations of int.


    Now that you understand the secret formula for declaring numeric types in C, we''ll
    now list every type of numeric variable in the C99 standard:


    ```

    (signed) char

    unsigned char

    (signed) short int

    unsigned short int

    (signed) int

    unsigned int

    (signed) long int

    unsigned long int

    (signed) long int

    unsigned long long int

    float

    double

    ```'
