    A123_4321. Note that a C variable may include a space or a character like an ampersand
    (&) or asterisk (*). These rules must be followed.


    > > TIP: The compiler will allow you to begin a variable name with an underscore
    (_) (as in myVar), you shouldn''t. Apple reserves all names that begin with a
