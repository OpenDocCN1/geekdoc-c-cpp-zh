    The compiler automatically converted the float to an int. As you already know,
    an int only stores integers the fractional portion of the number (.5) was discarded.
    In general, the right side of an assignment statement is always translated to
    the type on the left side when the assignment occurs. In this case, the compiler
    handled the type conversion for you. This is called implicit conversion. Implicit
    conversions occur when the compiler believes it can reasonably convert the value
    for you.


