  md: '# CHAPTER 8: More Data Types


    A specifier begins with a % and ends with the basic specifier. So far we''ve shown
    you the signed integer (%d or %i), unsigned integer (%u), and floating point (%f).
    Between the % and where the modifiers go. The long (L) and size (z) alter the
    size of the value printf() is expecting in its argument list. We''re now going
    to show you some other formatting modifiers.


    By %25.6f of %f, you tell printf() to print the floating point number with an
    accuracy of 16 places past the decimal and to add spaces, if necessary so in the
    front of the number it takes up at least 25 characters.


    ```

    printf("myFloat = %25.6f\n", myFloat);

    printf("myDouble = %25.6f\n", myDouble);

    printf("myLongDouble = %25.6lf\n", myLongDouble);

    ```


    Here''s the result of these printf():


    ```

    myFloat = 12345.67890123500000

    myDouble = 12345.678901234567902

    myLongDouble = 12345.6789012345678902

    ```


    The number (25) before the decimal point is the minimum width modifier. The decimal
    point and the number (.16) after it are, together called the "precision" modifier.


    printf() printed each of these numbers using 16 places past the decimal point.
    Go on, count them; we''ll wait. If the digits stop before 16 places are reached,
    zeros are added. This is called padding. The 16 digits to the right of the decimal,
    plus one for the decimal, plus the five digits to the left of the decimal total
    22 (16+1+5=22). You asked printf() to use at least 25 characters, so printf()
    added three spaces to the left of each number (padding with spaces).


    # THE ACCURACY OF NUMBERS IN C


    You originally asked printf() to print a float with the value:


    12345.67890123456789


    The best approximation of this number you were able to represent using a float
    is for this:


    12345.678901237500000


    Where did this approximation come from? It has to do with the way your computer
    stores floating point numbers.


    Chapter 4 described, at length, how integer numbers are represented using binary
    bits. Floating point numbers are also represented by a sequence of bits, this
    is called encoded, but it''s a bit more complicated than integers. (Who are we?)


    www.it-ebooks.info'
