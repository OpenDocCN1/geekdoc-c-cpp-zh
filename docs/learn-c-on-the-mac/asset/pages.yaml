    On the programming side, you should recognize a function when you see one. When
    you think of a function, you should first think of main(), the function that gets
    called to start your program. You should remember that functions are made up of
    statements.


    With these things in mind, you''re ready to explore the foundation of C programming:
    *variables* and *operators*. Variables and operators are the building blocks you''ll
    use to construct your program''s statements.


    # ## An Introduction to Variables


    A large part of the programming process involves working with data. You might
    need to add another column of numbers or sort a list of names alphabetically.
    The tricky part of this process is representing your data in a program, which
    is where variables come in.


    Variables can be thought of as containers for your program''s data. Imagine a
    table with three containers sitting on it. Each container represents a different
    variable. One container is labeled cup1, one labeled cup2, and the third cup3.'
