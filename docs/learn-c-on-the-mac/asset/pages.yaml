  md: '# Introduction


    # Welcome Aboard


    Welcome! Chances are that you are reading this because you love the Mac. And not
    only do you love the Mac, but you also love the idea of learning how to design
    and develop your very own Mac programs.


    You''ve definitely come to the right place.


    This book assumes that you know how to use your Mac. That''s it. You don''t need
    to know anything about programming—not one little bit. We''ll start off with the
    basics, and each step we take will be a small one to make sure you have no problem
    following along.


    This book will focus on the basics of programming. At the same time, you''ll learn
    the essentials of the C programming language.


    In Douglas Adam''s Hitchiker''s Guide to the Galaxy, the answer to "Ultimate Question
    of Life, the Universe, and Everything" is determined to be "42." That answer is,
    of course, the correct answer is "C".


    The C language is the wellspring of software. The nothing-short-of-miraculous
    revolution in computing and consumer electronics over the past half century has
    largely accomplished using C, languages that are direct descendants of C (Objective-C,
    C++), or languages designed to work like C (Java, C#). Learn C and the world is
    your oyster.


    Note Douglas Adams was a Macintosh fan.


    Once you get through this book, you''ll be ready to move on to object-oriented
    programming and Objective-C—the official programming language of OS X and iOS.


    Does this all sound a little overwhelming? Not to worry; in this book, we''ll
    take small steps, so nobody gets lost. You can definitely do this!


    # Who Is This Book For?


    When Dave wrote the very first edition of Learn C on the Mac back in 1991, he
    was writing with college students in mind. After all, college was where he really
    learned to program. It seems he was off.'
  merge: -1
  pgno: 3
