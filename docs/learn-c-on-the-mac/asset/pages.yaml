  md: '# About the Authors


    +   Dave Mark is a longtime Mac developer and author who has written a number
    of books on Mac and iOS development, including Beginning iPhone 4 Development
    (Apress, 2011), More iPhone 3 Development (Apress, 2010), Learn C on the Mac (Apress,
    2008), Ultimate Mac Programming (Wiley, 1995), and the Macintosh Programming Primer
    series (Addison-Wesley, 1992). Dave was one of the founders of MartianCraft, an
    iOS and Android development house. Dave loves the water and spends as much time
    as possible on it, in, or near it. He lives with his wife and three children in
    Virginia.


    ![](img/107863f6fad4269a6697938c194582e0_498_0.png)


    +   James Bucanek has spent the past 30 years programming and developing microprocessor
    systems. He has experience with a broad range of computer hardware and software,
    from embedded consumer products to industrial robotics. His development projects
    include the first local area network for the Apple It distributed air conditioning
    systems, a piano teaching system, digital oscilloscopes, silicon wafer furnaces,
    and collaborative writing tools for K-12 education. James holds a Java Developer
    Certification from Sun Microsystems and was awarded a patent for optimizing local
    area networks. James is currently focused on OS X and iOS software development,
    where he can combine his deep knowledge of UNIX and object-oriented languages
    with his passion for elegant design. James holds an Associate''s degree in classical
    ballet from the Royal Academy of Dance.'
  merge: -1
  pgno: 498
- img_proc: true
  md: '# About the Technical Reviewer


    ![](img/107863f6fad4269a6697938c194582e0_499_0.png)


    Michael Thomas has worked in software development for over 20 years as an individual
    contributor, Team Lead, Program Manager, and Vice President of Engineering. Michael
    has over 10 years experience working with mobile devices. His current focus is
    in the medical sector using mobile devices to accelerate information transfer
    between patients and health care providers.'
  merge: -1
  pgno: 499
