    # # Function Pointers


    Function pointers are next on the list of advanced topics. Function pointers are
    exactly what they sound like: pointers that point to functions. Up to now, the
    only way to call a function was to place its name in the source code, like so:
    MyFunction();


    Just as every variable has an address in memory, every function has an address
    too. You can store that address in a variable and use that to call the function.
    Here is an example:


    ```

    int (*myFuncPtr)(float);

    ```


    This line of code declares a function pointer myFuncPtr. myFuncPtr is a pointer
    to a function that takes a single parameter, a float, and returns an int. The
    parentheses in the declaration are all necessary. The first pairs the * to myFuncPtr,
    ensuring that myFuncPtr is declared as a pointer. The second pair surrounds the
    parameter list and distinguishes myFuncPtr as a function pointer.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '> TIP: Function pointer declarations in C are notoriously ugly and hard to
    read. Most programmers use a typedef to simplify the situation. By defining the
    typedef

    typedef int (*AFuncPtrThatTakesFloatReturnsInt())( float );

    You can now declare the myFuncPtr variable with much less fuss:

    AFuncPtrThatTakesFloatReturnsInt myFuncPtr;


    Suppose you have called a function DealTheCards() that took a float as a parameter
    and returned an int. This line of code assigns the address of the\DealTheCards()
    to the function pointer myFuncPtr:


    myFuncPtr = DealTheCards;


    Notice that the parentheses were left off the end of DealTheCards(). This omission
    is critical. If the parentheses were there, the code would have called DealTheCards(),
    returning a value, and tried to store that value in myFuncPtr. You may also have
    noticed that the & operator wasn''t used. When you refer to a function without
    using the parentheses at the end, the compiler knows you are referring to the
    address of that function.


    Now that you have the function''s address in the function pointer, there''s only
    one thing left to do—call the function. Here''s how it''s done:


    ```

    int result;

    result = (*myFuncPtr)( 3.5 );

    ```


    This line calls the function DealTheCards(), passing the parameter 3.5 and returning
    the function value to the int result. C also allows for a shortcut syntax that
    allows you to call the function this way:


    ```

    int result;

    result = myFuncPtr( 3.5 );

    ```


    In our opinion, this form is a bit easier to the eye.


    You can do a lot with function pointers. You can create an array of function pointers;
    each different function each day of the week. You can pass a function pointer
    to another function. This is a powerful technique that allows you, to create a
    generic solution where details of the specific solution are provided by a function
    passed via a pointer. You obtain the address of that function and pass it to the
    generic solution, which then turns around and calls the function. We''ll show
    you an example of that in the “Standard Library” section later in this chapter.'
