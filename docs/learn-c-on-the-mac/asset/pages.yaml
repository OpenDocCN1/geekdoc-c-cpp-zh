  md: 'The flour is purchased, the ratio of sugar and egg whites are details that
    only the implementation is concerned about.


    As you design your functions and modules, think of them as a bakery or any other
    kind of service. Your customer (often called the client) is the code that will
    be using the services of your module. The module''s interface is your storefront—menu,
    counter, and register. This is all the information your customer needs. What goes
    on in the kitchen (mixing equipment, recipes, inventory, and so) is the implementation.
    That stays hidden.


    Programmers who do so can change the details of how a module works without upsetting
    the rest of the program. As long as the "contract" of the interface remains the
    same, the implementation of the module can be safely changed without introducing
    new bugs. In DVDFile you could, change the file name of the Data.txt or its format;
    you could decide to store your DVD Data.txt in a SQL database of a single file.
    ReadFile() and WriteFile() function, from main()''s perspective, do exactly what
    they do not.


    The getpwuid() function you used in the PrintFile project is a perfect example
    of this kind of evolution. When Unix was very young, the getpwuid() function gets
    its data from a simple ASCII text file, no more complicated than the DVD Data.txt
    file you''re using today. Using UNIX matured, account information got more complicated.
    Today, OS X stores your account information in a sophisticated database that uses
    encryption, shared passwords, and can connect to other databases over a network.
    So while the format and location of the user account information has changed a
    dozen times over the past four decades (the implementation), the getpwuid() function
    (the interface) still works as it always has.


