  md: '+   You know how to get the address of a variable, and how to store it in a
    pointer or pass it as a parameter.


    +   You know how to use the indirection operator (*) to act on the variable that
    pointer points to.


    Go through each line of this code. If anything looks unfamiliar, go back and find
    that section of the code to review—but we bet you won''t have to. Step through
    it line by line in the debugger and watch how it works.


    # Some Pointers on Pointers


    There are some finer points (no pun intended) about pointers and parameters that
    you should know about. This will help you understand the best ways to use, and
    when not to use, pointers in your program.


    # Pass-By-Value vs. Pass-By-Reference


    In the program Average, you passed simple (int) values to the Average() function.
    The values of the argument expressions were copied into the function''s parameters
    before the function executed. The function could change its parameters, but has
    no effect on the original values. (We know all of this; we are just resting so
    it''s clear.)


    In programming lingo this is called pass-by-value. A copy of the value is passed
    to the function and the function can do anything it wants with its; it will never
    affect another value in the program.


    In the Factor program you passed the addresses of two variables. The Factor()
    function was able to use these pointers to affect variables outside its scope.
    This method of passing values is called pass-by-reference. Instead of copying
    the value, a reference to the value is passed to the function. The function can
    use this reference to and/or modify the original value at.


    Whether to use pass-by-value or pass-by-reference is a perennial topic of debate
    among programmers. In general, our approach is to use pass-by-value unless there''s
    a compelling reason to use pass-by-reference.


    Compelling reasons to use pass-by-reference might be


    +   The value is a group of values. (This will make sense after you read about
    arrays in the next chapter.)'
