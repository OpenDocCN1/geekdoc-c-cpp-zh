    # Function-like #define Macros


    But wait! Macros don''t stop there. You can create a #define macro that takes
    one or more macros. Here''s an example:


    ```

    #define SQUARE( A ) ((A) * (A))

    ```


    This macro takes a single argument. The argument can be anything. If you use this
    macro


    ```

    myInt = SQUARE(myInt + 1);

    ```


    the compiler would use its first pass to turn the line into:


    ```

    myInt = ((myInt + 1) * (myInt + 1));

    ```


    Notice the usefulness of the parentheses in the macro. If the macro were defined
    this


    ```

    #define SQUARE( A ) A * A

    ```


    the compiler would have produced


    ```

    myInt = myInt + 1 * myInt + 1;

    ```


    which is not what you wanted. The multiplication performed by this statement is
    1 * myInt because the * operator has a higher precedence than the + operator.


    Be sure pay strict attention to your use of white space in your #define macros.
    For example, there''s a world of difference between this macro


    ```

    #define SQUARE( A ) ((A) * (A))

    ```


    and this macro


    ```

    #define SQUARE( A ) ((A) * (A))

    ```'
