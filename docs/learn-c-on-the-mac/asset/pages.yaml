    # Comparative Operators


    C''s comparative operators let your program compare two numbers. Comparative operators
    compare their left side with their right side and produce a value of either 1
    (true) or 0 (false), depending on the relationship of the two sides.


    For example, the operator == determines whether the expression on the left is
    equal in value to the expression on the right. The expression


    ```

    myInt = 5

    ```


    evaluates to 1 if myInt is equal to 5 and 0 if myInt is not equal to 5.


    Here''s an example of the == operator at work:


    ```

    if (myInt == 5)

    printf("myInt is equal to 5");

    ```


    If myInt is equal to 5, the expression myInt == 5 evaluates to 1, and printf()
    gets called. If myInt is not equal to 5, the expression evaluates to 0, and the
    printf() is skipped. Just remember, the key to triggering an if statement is an
    expression that resolves to a value other than 0.'
