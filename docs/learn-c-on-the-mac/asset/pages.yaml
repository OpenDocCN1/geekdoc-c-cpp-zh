    # A Touch of Objective-C


    Quit the simulator and go back to the TasteOfiOS project. Click the ViewController.h
    file in the project navigator, as shown in Figure 14-7, and take a quick look
    at it. Now do the same with ViewController.m.


    ![](img/107863f6fad4269a6697938c194582e0_463_0.png)


    **Figure 14-7.** ViewController.h source


    What you''re reading is Objective-C, and it doesn''t look much like the C that
    you''ve learned in this book. Remain calm. There''s a perfectly logical explanation,
    and you''ll soon discover a lot more about this code than you think you do.


    Most modern object-oriented languages (Java, C#, C++) are "C-like" languages.
    That is, they kind of look and work like C, but they''re not C. If you already
    know C, then that''s great; you have a leg up on these languages because you only
    need to learn what''s different from C, which saves some time. But they''re not,
    and a lot of the details are different.


    Objective-C is an extension to C, not a look-alike. Objective-C adds new syntax
    to the C language, but doesn''t change anything about C itself. That''s important,
    because—unlike those other languages—it means everything you''ve'
  merge: -1
  pgno: 463
- img_proc: true
  md: 'learned in this book will apply to Objective-C. You just have something new
    to learn beyond it.


    So that the Objective-C extensions aren''t confused with existing C, they are
    quite distinct from regular C syntax. Objective-C adds a few-called "at" keywords,
    like @interface, @property, @class, @end, and Objective-C functions (called methods)
    are called by placing them between brackets, like this: [object myFunction]. Just
    about everything else (that is, not starting with an "@" sign or between brackets)
    is old C.


    The primary tool of the object-oriented programmer is the class. A class is just
    like a struct, except that it binds together not just variables but the functions
    (methods) that act on that struct. Using C, you already learned to bind related
    values in a struct


    ```

    struct DVDInfo {

    const char *title;

    const char *comments;

    int rating;

    struct DVDInfo *next;

    };

    struct DVDInfo *NewDVDInfo(struct DVDInfo);

    void AddDVDToList(struct DVDInfo *dvdInfoPtr);

    ```


    ```

    struct DVDInfo *myDVD = NewDVDInfo();

    myDVD->rating = 9;

    AddDVDToList( myDVD );

    ```


    C programmers do this because it''s good programming. Objective-C adds new syntax
    that makes this easier to write, helping you keep your code neat and tidy. Here''s
    the same concept written using an older form of Objective-C (so you can see the
    similarities):


    ```

    @interface DVDInfo : NSObject {

    NSString *title;

    NSString *comments;

    int rating;

    DVDInfo*next;

    (DVDInfo*)next;

    (void)addToList;

    @end

    ```


    ```

    DVDInfo *myDVD = [DVDInfo new];

    myDVD->rating = 9;

    [myDVD addToList];

    ```'
  merge: -1
  pgno: 464
- img_proc: true
  md: 'As you can see, a class works very much like a struct. The methods (functions)
    that work on this object (struct) are declared as part of the class, defined between
    the @interface and @end keywords.


    Objective-C puts the object front and center in the method calling syntax, so
    your focus becomes on object. While this looks radically from how C works, behind
    the scenes the computer ultimately does the same work: calls a function (addToList)
    the first (invisibly) you parameter is a pointer to your myDVDobject—exactly the
    way AddToDoList() function works. Isn''t that clever?


    Modern Objective-C departs a little further from the C struct, but the results
    are still very similar. Here''s final version of the DVDInfo Objective-C 2.0:


    ```

    @interface DVDInfo : NSObject

    @property (strong) NSString *title;

    @property (strong) NSString *comments;

    @property int rating;

    @property (readonly) DVDInfo *next;

    -(void)addToList;

    @end

    ```


    ```

    DVDInfo *myDVD = [DVDInfo new];

    myDVD.rating = 9;

    [myDVD addToList];

    ```


    So don''t be spooked by the odd syntax. Objective-C is really just some additional
    tools that will help you even better C, keep your data organized, and take care
    all kinds of details (like allocating and freeing memory) for you. Trust us, you''re
    going to love it.


    # Go Get ''Em


    Well, that''s it about. We hope you enjoyed reading this book as much as we enjoyed
    writing it. Above all, we hope you are excited about your newfound programming
    capabilities. By learning C, you''ve opened the door to an exciting new adventure.
    You can move on to Objective-C and Cocoa, tackle web programming with PHP, the
    Windows universe with C#, or explore the cross-platform capabilities of Java.
    There are so many choices out there, and they are all based on C.


    Go out there and write some code. Keep in touch!'
