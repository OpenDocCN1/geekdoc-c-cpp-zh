  md: '# IN DEFENSE OF PRINT()


    You might be thinking, now that you know about this amazing debugger thing, you''ll
    never have to write another printf() statement again—at least not for the purposes
    of finding out what your program is doing. That''s probably not true. While it
    is possible to use the debugger for almost all of your debugging needs, sometimes
    a printf() statement is just what the doctor ordered, and you''ll continue to
    use this in book.


    One of the downsides of being able to stop your program and examine it in detail
    is that, well, your program stops. Let''s say you''re developing a game where
    you try to save innocent zombies from being skewered by evil pink unicorns. But
    something goes wrong when you try to rescue a zombie with your apache attack helicopter.
    You could set a breakpoint at that point in the code, but it will be really awkward—impossible—to
    duplicate the problem if your game comes to a screeching halt just as it begin.
    Using printf() (or any number of similar logging functions, and there are a few),
    you can output the state of your zombie and helicopter to the console with ease.
    You can make a few attempts at saving your zombie and then stop to examine the
    console log.


    # How is a Debugger like an Iceberg?


    We hope you appreciate the power of setting breakpoints, stepping through your
    code, and examining variable, but don''t for an instant that''s all the debugger
    can do. The Xcode debugger is a really, really, complex tool that has hundreds
    of functions, commands, and features. In addition, Xcode includes a suite of additional
    programming analysis tools called Instruments. Taken altogether, there''s probably
    no programming problem they can''t track down.


    Don''t feel bad if you haven''t learned everything about the debugger in one day,
    for a week, or several years. Seriously, you''ll probably be learning debugger
    tricks for the rest of your programming life.


    # What’s Next?


    You can now hang “debugger” on your programming utility belt. And it''s going
    to be handy because in the next chapter you’re going to learn how to control your
    program’s flow.'
