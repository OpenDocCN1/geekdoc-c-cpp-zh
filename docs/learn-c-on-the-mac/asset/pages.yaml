  md: 'The wording, and the reason it''s a warning and not an error, is to do with
    the history of C. Originally (K&R) C didn''t require you to declare a function
    before you called it. You just wrote printf("Hello") and the compiler assumed
    there was a function named printf() somewhere where you called your code without
    any errors. This resulted in thousands of programs that would compile OK, but
    then wouldn''t run because you mistyped the name of a function somewhere. The
    ANSI and ISO organizations decided this wasn''t good and would be much better
    if you had to explicitly declare every function before you called it. That, if
    you mistyped the name of a function, the compiler could catch it immediately.
