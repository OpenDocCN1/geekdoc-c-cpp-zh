  md: 'displays the thread(s) and stack(s) in your program. (Every thread has its
    own stack.) This is a really simple program, so you only have one thread and stack.


    The stack, so called because it works like a stack of plates or cards, records
    the history of functions that led it to this point in your program. Each time
    a function is called, it gets placed on top of the stack. When the function calls
    another, new function is added to the top of the stack. As functions exit, they
    are removed from the stack. Think of this as a trail of breadcrumbs that help
    the CPU track the sequence of function calls.


    Take a look at the debugger navigator on the left side of Figure 5-7. Reading
    the stack from the bottom up, you see there are functions: start, main, and SayHello.
    start is the function that started your program. Your job is to call main(), where
    the code you wrote begins. Your main() function called SayHello(), which called
    another function, that would be “pushed” onto the top of the stack and would appear
    above SayHello.


    When SayHello() finishes, it “pops” off the stack and control is returned to the
    calling function—in this case, back to main().


    If you continue to press the Step Over button, the SayHello() function will finish
    and you''ll end back in main(). When this happens, SayHello() disappears from
    the stack.


    > TIP: The stack records not only which functions called the function you are
    in, but also the exact location where it was called. It can also contain variables,
    and we''ll talk about that later in the book.


    In the Hello3 project, the stack shows that main(), which called SayHello(). But
    which of the three calls to SayHello() are you in? You can determine this by clicking
    on the name of the function in the debugger navigator pane. When you click on
    a function in the stack, the debugger will move the PC indicator to show you the
    location where the call was made. In this case, if you click on main in the stack,
    the source code for main() will display in the editing pane and the green counter
    arrow will point to the second SayHello()


    Changing the PC indicator doesn''t change where the program is executing, only
    the debugger''s display. Click back on the topmost function in the stack to return
    where the program is currently stopped.'
