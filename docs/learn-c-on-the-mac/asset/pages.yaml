    \ third expression provides the modification portion of the statement. This expression\
    \ is performed at the bottom of the loop, immediately following execution of the\
    \ statement.\n\nNote that all three of these expressions are optional and may\
    \ be left out entirely. For example, a for loop that leaves without all three\
    \ expressions:\n\n```\nfor ( ; ; )\nDoSomethingForever();\n```\n\nSince this loop\
    \ has no terminating expression, it is known as an infinite loop. Infinite loops\
    \ are generally considered bad form and should be avoided the plague! The for\
    \ loop can also be described in terms of a while loop:\n\n```\nexpression1;\n\
    while ( expression2 ) {\n    expression3;\n}\n```"
