  md: '# Chapter 2


    # Programming Basics


    Before we dig into C programming specifics, let''s spend a few minutes discussing
    the basics of programming. Why write a computer program? How do computer programs
    work? We''ll answer these questions and look at all of the elements that come
    together to create a computer program, such as source code, a compiler, and the
    computer itself.


    If you are already familiar with the basics of programming, please feel free to
    skim through this chapter and, if you feel comfortable with the material, skip
    ahead to Chapter 3. The goal here is to get you familiar with the steps involved
    in creating a running simple program.


    # Programming


    Why write a computer program? There are many reasons. Some programs are written
    in direct response to a problem too complex to solve by hand. For example, you
    might write a program to calculate a value to 5,000 decimal places or determine
    the precise moment to fire the boosters that will safely land the Mars Rover.


    Other programs are written as performance aids, allowing you to perform a regular
    task more efficiently. You might write a program to help you balance your paycheck,
    keep track of your baseball card collection, or lay out this month''s issue of
    Dinosaur Today.


    Whatever their purpose, each of these examples shares a common theme. They are
    all examples of the art of programming. Your goal in reading this book is to learn
    how to use the C programming language to create programs of your own. Before we
    get into C, however, let''s take a minute to look at some other ways to solve
    your programming problems.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Some Alternatives to C


    As mentioned previously, C is one of the most popular programming languages around.
    There''s very little you can do in C (or in some variant of C), once you know
    how. On the other hand, a C program is not necessarily the best solution to every
    programming problem.


    For example, suppose you are trying to build a database to track your company''s
    inventory. Rather than writing a custom C program to solve your problem, you might
    be able to use an off-the-shelf package like FileMaker Pro or perhaps a Unix-based
    solution like MySQL or PostgreSQL to construct your database. The programmers
    who created these packages have already solved most of the know-management problems
    you''d face if you tried to write your program from scratch. The lesson here is:
    before you tackle a programming problem, examine all the alternatives. You might
    find one that will save you time and money or will prove to be a better solution
    to your problem.


    Some problems can be solved using the Mac''s built-in scripting language, AppleScript.
    Just like C, AppleScript is a programming language. Typically, you use AppleScript
    to control other applications. For example, you could create an AppleScript that
    gets your daily calendar from iCal, formats it just like you like using EditText,
    and prints out the results. Or you could write a script that launches Safari and
    opens each of yourmarked sites in a separate window. If you can use existing applications
    to do what you need, chances are good enough to use AppleScript to get the job
    done.


    Some applications feature their own proprietary scripting language. For instance,
    Microsoft Excel lets you write programs that operate on the cells in a spreadsheet.
    Some word processing programs let you write scripts that control just about every
    processing feature in existence. Although proprietary scripting languages can
    be quite useful, they aren''t much help outside their intended environments. You
    won''t find much for the Excel scripting language outside Excel, for example.


    # What About Objective-C, C#, C++, and Java?


    There is a constant debate about which programming language is the best one to
    learn first. Naturally, the C++ people think that C++ is by far the best language
    to start with. Java, C#, and Objective-C people feel the same way about Java,
    C#, and Objective-C. But the truth is that all of those languages are based on
    C. And if you learn C, you''ll have a huge leg up on learning any of them. And'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'when the next C-based language hits the streets, you''ll have a leg up on that
    one, as well.


    In a nutshell, C is the best language to start with many other languages use the
    majority of C''s syntax and structure. Objective-C, C++, and Java start and build
    on C, each in its own unique way. Learning C first is like learning to walk before
    learning how to run. If you learn C first, you''ll have an excellent foundation
    on which to build your future programming education.


    # What''s the Best Programming Language for the Mac or iOS Devices?


    All the programs in this book will run in the console, a simple scrolling text
    window that you would like to build applications that feature the Mac look-and-feel
    with buttons, scroll bars, and windows, you''ll need to finish this book, then
