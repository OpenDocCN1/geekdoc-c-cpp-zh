  md: 'The functions defined in <libkern/osByteOrder.h> are supplied by OS X (rather
    than the Standard Library). OS supplies a rich set of byte-swapping functions
    that are easy to understand, and the functions names are almost self-explanatory.
    The OSSwapHostToBigInt32 swaps the order of the 32-bit integer from the host order
    to big-endian order. The OSSwapBigToInt32 function reverses the process. These
    functions are all "smart"; they only reorder bytes if you''re running on a little-endian
    CPU. If your CPU uses big-endian order already, these functions don''t change
    anything.


    We''re going to finish this chapter by writing the RomanNumeral project from Chapter
    9 a tune-up. In the process, you''re going to learn a little more about writing
    command-line tools and some interesting facts about what it means to be a "file."


    # Making RomanNumeral a Better Tool


    In Chapter 9 you wrote a command-line tool that would convert decimal arguments
    into Roman numerals. Now you''re going to make that tool even more-useful, as
    a Roman numeral converter can be.


    Most command-line tools that process files use a well-known convention for getting
    the data it''s going to work on. If one or more arguments passed to the program
    are paths to files, the tool processes those files and exits. If there are no
    command-line arguments, the program processes the characters from its standard
    in character stream instead. Check the man pages for tools cat, sort, grep, and
    others. They all work this way.


    When you design your command-line tool to behave this way, it becomes a flexible
    member of the command-line community. It can be directed to perform its magic
    on existing files, or become one step in a chain of commands that''s transforming
    a data stream. Consider the command


    ```

    MyTool ~/MyFile.txt | sort --unique

    ```


    This command directs MyTool to do whatever-it-does on the file MyFile.txt. The
    results are piped from MyTool''s standard out to the sort''s standard in. Because
    sort wasn''t given any file arguments, it sorts the output of MyTool. Contrast
    with this command:


    ```

    sort --unique ~/Desktop/MyFile.txt | MyTool

    ```


    This time sort reads MyFile.txt and outputs the sorted results to MyTool. Instead
    of reading a file, MyTool reads its standard and outputs the results. Depending
    on what MyTool does, the results could be strikingly different.'
