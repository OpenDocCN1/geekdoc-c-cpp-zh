- img_proc: true
  md: 'free() takes a single argument, a pointer to the first byte of a previously
    allocated block of memory. The following line returns the block allocated earlier
    to the free memory pool.


    ```

    free(myDvdPtr);

    ```


    Use malloc() to allocate a block of memory. free() to free up a block of memory
    allocated via malloc(). You are responsible for freeing any memory that you allocate.
    You create it; you free it. That, when a program exits, the operating system automatically
    frees all memory allocated by that program.


    > CAUTION: Never put a fork in an electrical outlet. Never pass an address to
    free() that didn''t come from malloc(), calloc(), or any other function that returns
    an allocated block of memory from the heap. Both will make you extremely unhappy!


    # Keeping Track of That Address!


    The address returned by malloc() is critical. If you lose it, you''ve lost access
    to the block of memory you just allocated. Even worse, you can never free() the
    block, and it will just sit there, wasting valuable memory, for the duration of
    the program. This is called a memory leak.


    Here are the essential rules for allocating your own blocks of memory.


    +   1. Allocate a block of the correct size using malloc() (or any similar function)
    and save the pointer malloc() returns in a variable.

    2. Use the returned pointer to access the variables in that block of memory however
    you please.

    3. When you''re done with it, pass the original pointer to free() so that memory
    block can be recycled.

    4. Once you pass an address to free(), never use it again—in another call to free()
    or for any other purpose. If you have a pointer variable that still points to
    that address, set it to NULL.'
