    \ is that it worries about the case where the ratings of the two DVDs are the\
    \ same (result is 0). If the ratings are the same, the two elements are considered\
    \ equal. qsort() doesn't guarantee the order of elements that are equal, except\
    \ that they will next to each other in the array. For an explanation, see the\
    \ sidebar Unstable Sorting.\n\nTo qsort() sort of the DVDs into a predictable\
    \ order, the CompareDVDRatings() function implements a sub-sort. If the primary\
    \ fields being compared (rating) are equal, the comparison is performed on a secondary\
    \ field (title, in this case). This causes all DVDs with the same rating to be\
    \ in alphabetical order in the list.\n\n# STABLE AND UNSTABLE SORTING\n\nSorting\
    \ algorithms can be divided into two groups: stable and unstable. Both sort items\
    \ into ascending order, but differ in how they order items that are equal. As\
    \ an example, look at the list of DVDs after they were sorted into title order:\
    \ “A Bug’s Life” came before “Despicable Me.”. After they were sorted by country,\
    \ however, “Despicable Me” is now before “A Bug’s Life.”\n\nThat’s because, by\
    \ country sort, both of these records were equal both from the United States.\
    \ qsort() is an unstable sort, it doesn't guarantee the order of equal elements.\
    \ Sometimes “A Bug’s Life” will be before “Despicable Me,” and sometimes it won’t.\n\
    \nA stable sort, by contrast, guarantees that the order of equal elements will\
    \ stay the same after the array is reordered. So if “A Bug’s Life” was before\
    \ “Despicable Me” before it was sorted by country, they will still be in the same\
    \ (relative) order afterwards."
