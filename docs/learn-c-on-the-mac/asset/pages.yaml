  md: 'The variable count is defined as static and includes an initializer. The variable
    is created when the program starts and is immediately assigned the value after
    the equals sign. This happens only once. Even though it looks like it would be
    set to 3 every time the function runs, it doesn''t. And that''s good, because
    you want to remember its value over time.


    > NOTE: Both globals and statics have initializer values. If you don''t specify
    an initializer value, the variable is set to 0 before your program starts. Automatic
    variables are uninitialized, but global and static variables are always initialized.

    The value of your initializer must be a constant; it can''t be an expression that
    uses variables or function calls.


    Run the program and you''ll see this output:


    +   3 ...

    2 ...

    1 ...


    # Lift-off!


    This works because the value of count is set to 3 before the program starts. Every
    time Countdown() is called, it decrements the value by 1 until it refer to the
    count variable gets to 0.


    The scope of count is still limited to the Countdown() function. You can''t refer
    to the count variable in main() or any other function. Countdown() can, however,
    safely get the address of count (&count) and pass that pointer to another function
    or return it. It''s safe because count doesn''t go away when Countdown returns,
    so that address will always point to a valid variable.


