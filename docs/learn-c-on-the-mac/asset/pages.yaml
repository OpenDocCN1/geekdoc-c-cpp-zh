    As you, you need to consider what could go wrong and code defensively so that
    something goes wrong, your program will still work (within reason), or at least
    fail gracefully, to do something predictable and not cause more problems. Programs
    that recover gracefully from the unexpected are said to be tolerant, and that''s
    your goal for this chapter. Here are the rules.


    # # Title #1: Never Assume


    Making assumptions leads to poor programming. Code that depends on an assumption
    is setting itself up for a fall such that assumption turn out to be an erroneous
    one. Remember Murphy''s law; if your code depends on an assumption, and there''s
    any possibility that the assumption could be wrong, then your code will eventually
    fail.


    So what is an assumption? An assumption is any fact about a true value or variable
    that your code depends on being true to function. As long as the fact is true,
    your code will function as you intended it. But as soon as that the fact is no
    longer true, who knows what will happen?


    # ## Assumptions About Variables


    Here''s a simple example of an assumption we already told you to avoid. In the
    DVDTracker program in Chapter 10, the ReadStruct() function prompts the user to
    enter a DVD title and copies the reply into a DVDInfo struct.


    ```

    char buffer[500+1];

    printf("Enter DVD title: ");

    gets(buffer, 501, stdin);

    string(infoptr->title, trimline( buffer ), 256 );

    ```


    This code makes a couple of assumptions. The gets(buffer,501,stdin) statement
    assumes that the buffer array is at least 501 characters long. Now that is not
    a terrible assumption to make because the declaration for buffer is only two lines
    earlier. You can easily see that buffer is defined as char buffer[ 500+1 ].


    Let''s say that one day the distant future you decide to change the size of the
    buffer to 300+1. If you make that change, you should also change the 501 in'
