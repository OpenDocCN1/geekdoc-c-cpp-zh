    # Current Directory and Relative Paths


    A relative path is a partial path that relies on the context of another path to
    complete it. Relative paths do not start with "/"—that''s how you tell it''s a
    relative path. That context is the current directory, also called the working
    directory.


    The current directory is always an absolute path to directory. A relative path
    starts where the current directory ends. The absolute path of an item is obtained
    by simply joining (concatenating) the current directory with the relative path.
    For example, if the current directory was /Users/james, the relative path of James''s
    iTunes folder would be, simple, Music/iTunes.


