  md: '# Writing Files


    So far, you''ve learned how to open a file using fopen() and how to read from
    a file using fgetc(). You''ve seen once, again, that you can often use two different
    functions to solve the same problem. Now let''s look at some functions that allow
    you to write data out to a file.


    The Standard Library offers many functions that write data out to a previously
    opened file. This section will introduce three of them: fputc(), fputs(), and
    fprintf().


    fputc takes an int holding character value and writes the character out to the
    specified file. fputc() is declared as follows:


    ```

    int fputc(int c, FILE *fp);

    ```


    If fputc() successfully writes the character to the file, it returns the value
    passed to it in the parameter c. If the write fails for some reason, fputc() returns
    the value EOF.


    > NOTE: Calling fputc( c, stdout ) is the same as calling putchar( c ). Writing
    a single character to stdout is such a common task that someone wrote the putchar()
    function you don''t have to use fputc(c,stdout) every time. These are called convenience
    functions. It''s quite common to see several functions that can accomplish the
    same thing, but have a less complicated set of parameters to make it easier to
    perform typical tasks. You can always switch to the more complicated function
    if you need to do something more unusual.


    fputs() is similar to fputc(), but writes out a NULL-terminated string instead
    of a single character. fputs() is declared as follows:


    ```

    int fputs(const char *s, FILE *fp);

    ```


    fputs() writes out all the characters in the string but does not write out the
    terminating character. If the write fails, fputs() returns EOF; otherwise, it
    returns the nonnegative number.


    fprintf() works like printf(). Instead of sending its output to the console window,
    fprintf() writes its output to the specified file. fprintf() is declared as follows:


    ```

    int fprintf( FILE *fp, const char *format, ... );

    ```'
