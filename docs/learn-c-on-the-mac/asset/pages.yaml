    # The Size of a Type


    When you declare a variable, the compiler reserves a section of memory for the
    exclusive use of that variable. When you assign a value to a variable, you are
    actually modifying the variable''s dedicated memory to reflect that value. The
    number of bytes assigned to a variable is determined by the variable''s type.
    You should check your compiler''s documentation to see how many bytes go along
    with the standard C types.


    The Xcode compiler assigns 4 bytes to each int. Later in the book, in Chapter
    8, we''ll write a program that explores the size of a variety of C data types.


    > NOTE: It''s important to understand that the size of a type can change depending
    on factors such as your computer''s processor type, operating system (OS X, Windows,
    or Linux, for example), and your development environment. Remember to read the
    documentation that comes with your compiler.


    The variable declaration


    ```

    int myInt;

    ```


    reserves 4 bytes of memory for the exclusive use of the variable myInt. If you
    later assign a value to myInt, that value is stored in the 4 bytes allocated for
    myInt. If you refer to myInt''s value, you''ll be referring to the value stored
    in myInt''s 4 bytes.


    If your compiler used 2-byte ints, the preceding declaration would allocate 2
    bytes of memory for the exclusive use of myInt. As you''ll see, it is important
