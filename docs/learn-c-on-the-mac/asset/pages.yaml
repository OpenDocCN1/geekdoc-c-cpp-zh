  md: "# CHAPTER 12: Handling Errors\n\nyour assumptions are. If you assume that number\
    \ will never be 0 or negative, you\nwrite that as an assertion in your code, like\
    \ this:\n\n```\nbool Factor(int number, int *firstFactorPtr, int *secondFactorPtr\
