  md: 'this memory is allocated to main()''s local variables. When main() calls a
    function, memory is allocated for function''s local variables. When that returns,
    the memory allocated for its local variables is freed up (sometimes deallocated
    or released). This memory becomes available to be allocated over again. It''s
    just like cycling.


    In the next few sections, you''ll learn about some functions you can call to allocate
    a block of memory and free that (return it to the pool of available memory) when
    you''re done with it. Ultimately, you''ll combine these functions with a data
    structure called a linked list to provide a more-efficient, and more flexible,
    alternative to the array.


    # Using malloc()


    The Standard Library function malloc() allows you to allocate a block of memory
    of a specified size. To access malloc(), you need to include the file <stdlib.h>.


    ```

    #include <stdlib.h>

    ```


    malloc() takes a single parameter, the size of the requested block, in bytes.
    malloc() returns a pointer to the newly allocated block of memory. Here''s the
    prototype:


    ```

    void malloc(size_t size);

    ```


    The block of memory comes from a vast reservoir of memory called the heap. The
    heap consists of most of the unused addresses in your computer—those not already
    used by your program''s code, static and automatic variables, and some miscellaneous
    addresses reserved by the operating system.


    If malloc() cannot allocate a block of memory the size you requested, it returns
    a pointer with the value NULL. NULL is a constant, defined to have a value of
    zero, used to specify an invalid pointer. In other words, a pointer with a value
    of NULL does not point to a memory address. You learned about NULL in Chapter
    7. You''ll get to chance to use it.


    You might be scratching your head over malloc()''s return type, void*. C allows
    you to declare a pointer to void. It might appear oxymoron (a pointer to nothing),
    but it turns out to be very useful. C interprets void* as "a pointer to a variable
    of unknown type." It''s not that the pointer points to nothing; it points to something
    but the compiler doesn''t know what.


    You can use a void pointer like any other pointer. You can assign it an address,
    pass it as variable, and so on. The only thing you can''t do in this is:'
