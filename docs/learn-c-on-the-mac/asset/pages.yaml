    # Arrays


    The next topic for discussion is arrays. An array is a list of variables. For
    example, this declaration


    ```

    int myNumber[ 3 ];


    creates separate int variables, referred to in your program as myNumber[ 0 ],
    myNumber[ 1 ], and myNumber[ 2 ]. Each of these variables is known as an array
    element. The number between the brackets ([ and are known as brackets or square
    brackets) is called an index. In this declaration

    ```


    ```

    char myChar[ 20 ];

    ```


    the name of the array is myChar. This declaration will create an array of type
    char with a dimension of 20. The dimension of an array is its number of elements.
    The array elements will have index values that run from 0 through 19.


    > NOTE: In C, array indexes all run from 0 to one less than the array''s dimension.
    It''s called zero-based indexing. Some other computer languages use ordinal-based
    indexing (where the first element has an index of 1).


    This code for first declares an array of 100 ints and then assigns each int a
    value of 0:


    ```

    int myNumber[ 100 ], i;

    for ( i=0; i<100; i++ )

    myNumber[ i ] = 0;

    ```


    You could have accomplished the same thing by declaring 100 individual ints and
    initializing each individual int. Here''s what that code might look like:


    ```

    int myNumber0, myNumber1, ..., myNumber99;


    myNumber0 = 0;

    myNumber1 = 0;

    ```'
