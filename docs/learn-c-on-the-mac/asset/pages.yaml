    Apple promises to use names with a single underscore. If you stick to using names
    that do not start with an underscore, there won''t be any confusion.


    > Similarly, the compiler itself reserves all names that begin with two underscores,
    as in __func__. You and Apple both promise not to use names that begin with two
    underscores. These kinds of informal agreements between programmers, operating
    system developers, and compiler engineers are called programming conventions.
    In case you missed it, you just learned one.


    These rules leave a fair amount of room for inventiveness. Over the years, different
    groups of programmers came up with additional guidelines (also known as conventions
    or style guides) that made variable names more consistent and a bit easier to
    read.


