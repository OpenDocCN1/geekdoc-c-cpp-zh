  md: '# CHAPTER 11: Working With Files


    Little-Endian Big-Endian


    | | Little-Endian | Big-Endian |

    |---|---||

    | 839 | 00000000 | 11010010 |

    | 838 | 00000000 | 00000100 |

    | 837 | 00000100 | 00000100 |

    | 836 | 11010100 | 00000000 |


    int myVar;


    Least Significant Bit


    Figure 11-7. The value 1234 stored in little-endian and big-endian order


    If you write this integer to a file on a little-endian computer using fwrite(),
    and then read it using fread() on a big-endian computer, the number would change
    from 1,234 to 3,523,477,504. This is probably not what you want. There are two
    techniques to make your number sense to other computers.


    The first is to use the byte-width integer types we told about in Chapter 8. These
    will ensure that the length of the integer you write to a file will be the same
    size no matter what CPU is running your program.


    The other is to use the byte-order swapping functions supplied by the operating
    system. Here''s a code fragment that uses both techniques to safely write an integer
    value to a file so it always has the same size and byte order:


    ```

    #include <libkern/OSByteOrder.h>


    int myInt;


    int32_t safeInt;

    safeInt = OSSwapToBigInt32(myInt);

    fwrite(&safeInt, sizeof(safeInt), 1, fp);

    ```


    This code uses a byte-swapping function to rearrange the order of the bytes in
    the variable myInt from whatever order your CPU uses to big-endian order and stores
    it in a known-width integer value. The 4 bytes of variable are then written to
    the file. The number that''s in the file will always be in big-endian no matter
    what the "native" order of your CPU is.


    To read that number back from the file, reverse the process, like so:


    ```

    int32_t safeInt;

    read(&safeInt, sizeof(safeInt), 1, fp);

    myInt = OSSwapToHostInt32(safeInt);

    ```


