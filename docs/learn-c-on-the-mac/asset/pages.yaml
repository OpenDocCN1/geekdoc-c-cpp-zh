    The while statement is also known as the while loop, because once the

    statement is executed, the while loops back to reevaluate the expression.

    Here''s an example of the while loop in:


    ```

    int i;

    i=0;

    while ( ++i < 3 )

    printf("Looping: %\n", i );

    printf("We are past the while loop."");

    ```


    This example starts by declaring a variable, of type int. i is initialized to

    0. Next comes the first thing the while loop does to evaluate its

    expression. The while loop''s expression is


    ```

    ++i < 3

    ```


    Before this expression is evaluated, it has a value of 0. The prefix notation
    used

    in the expression (++i)) increments the value of i to before the remainder of
    the

    expression is evaluated. The evaluation of the expression results in true, since
    1

    is less than 3. Since the expression is true, the while loop''s statement, a single

    printf(), is executed.


    Here''s the output after the first pass through the loop:


    # Looping: 1


    Next, the while loops back and reevaluates its expression. Once again, the

