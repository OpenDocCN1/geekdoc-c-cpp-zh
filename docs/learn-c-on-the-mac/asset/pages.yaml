- img_proc: true
  md: '> CAUTION: The right bit-shift operators are designed to work with unsigned
    values only. If your right-shifted values, your CPU might fill with 0 bits or
    duplicate the most significant bit (called a signed shift). C doesn''t dictate
    one or the other, so read your compiler''s documentation—or avoid doing that.


    The last operator we need to cover is the , (comma) operator. , operator gives
    you a way to combine two expressions into a single expression. The , operator
    is binary, and both operands are expressions. The left expression is evaluated,
    and the result is discarded. The right expression is then evaluated, and its value
    becomes the value of the expression.


    Here''s an example:


    ```

    for ( i =0; j=0; i<20 && j<40; i++, j+=2 )

    DoingSomething(i, j);

    ```


    This loop is based on two variables inside one. Before the loop is entered, i
    and j are both set to 0. The , operator allows you to put two expressions (i=0
    and j=0) where normally only one expression goes.


    The loop continues as long as i is less than 20 and j is less than 40. Each time
    through the loop, i is incremented by 1 and j is incremented by 2.


    To use the , operator in a function''s parameter list, you must surround it by
    parentheses so it isn''t confused with the commas used to separate arguments,
    like this:


    ```

    MyFunction(i, j=-2, 3*j));

    ```


    The function MyFunction() is called with two arguments. The first argument is
    the value of i. The second argument begins by subtracting two from j and updating
    its value. The updated value of j is squared and the result is passed as the second
    argument.


    > TIP: Using the , (comma), = (assignment), or ?: (conditional) operators in expressions
    can make your code hard to read and understand. All can be used to get out of
    sticky coding situations, but we would discourage you from using them unless you
    have to.'
