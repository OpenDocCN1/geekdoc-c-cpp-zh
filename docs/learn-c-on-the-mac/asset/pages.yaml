  md: '# Chapter 5


    # # Debugging


    So far you''ve learned a lot about how to work with Xcode to create, edit, and
    run your very own programming projects. You''ve learned about functions, variables,
    operators, and the process of using those items to manipulate your program''s
    data. Hopefully, as you''ve been reading and making changes to your source code,
    you''ve been trying to anticipate the results of those changes. Learning how to
    "think like a computer" will be immensely useful as you develop your programming
    talent.


    Sometimes it''s really convenient to know what the computer is *actually* doing.
    You did this in the *Operators* and *Postfix* projects by using the `printf()`
    statement, like this:


    ```

    myInt = 3;

    printf("%d\n", myInt);

    ```


    The first statement stores the value 6 in the memory assigned to the myInt variable.
    The second statement uses the `printf()` function to output the value of myInt
    to the console log so you could see, with your own eyes, that the value was, in
    fact, 6.


    myInt ---> 6


    While this is great—it confirms that you thought the computer was doing and what
    the computer was actually doing were one and the same—using `printf()` statements
    between every step of your program is a little awkward.


    Look at the source for the entire *Operators* project. Most of the code exists
    solely to help you track the value of the variables. As it turns out, there''s
    a tool built into Xcode that greatly simplifies the process of following along
    as the computer runs your program. This tool is called a *debugger*, so called
    because it helps you track down and eliminate bugs in your programs.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# # What''s a Debugger?


    If you''ve read or watched enough science fiction, you''ve undoubtedly encountered
    this scene: a physician places a patient on a table and produces some kind of
    portable scanner. A whirring noise ensues and suddenly every detail of the patient
    before the physician. The physician can see the patient''s bones, organs, circulatory
    and nervous system. Vital statistics flash by. After a brief pause, the physician
    announces that the victim is suffering from a mimetic alien operation is rewriting
    the telomeres of their intragenic DNA and he will need immediate reverse transcriptase
    therapy in a hyperbaric chamber ... and quickly before he turn into a big lizard!
    Or something like that.


    Modern doctors don''t quite have scanners like those in science fiction (yet),
    but we programmers have something that''s pretty close to it. The debugger is
    a powerful tool built into Xcode that can peer into the inner workings of your
    program with astonishing acuity. The debugger can stop your program in tracks,
    examine the values of its variables, and let you observe and control every step
    of its execution.


    The debugger is probably the most powerful tool in the programmer''s arsenal.
    Usually, you use it to find and correct mistakes ("bugs") in your program, but
    it can just be as useful in confirming that your program is doing what you expecting
    it to do.


    # THE ORIGINS OF DEBUGGING


    The modern use of the term "bug" (meaning a flaw or mistake in a computer program)
    and "debug" (the act of correcting said flaw) are attributed to Rear Admiral Grace
    "Amazing Grace" Hopper. In 1947, midshipman Hopper was working on the Harvard
    Mark I computer. And when we say "computer," we mean a mechanical device that
    filled an entire room, weighed 10,000 pounds, and consisted of relays, switches,
    wires, rotating shafts, and clutches. A laptop was not.


    The program that the team was working on one day did not function properly. After
    some investigation, they found that a moth had expired in one of the relays. The
    hapless moth was carefully extracted and taped into a notebook (there''s a picture
    of it on the Grace Hopper Wikipedia page). From that day on, correcting a mistake
    in a program was referred to as "debugging" the program.


    Admiral Grace Hopper was a pretty amazing person. She had ground-breaking careers
    both in academics and the military. She was a pioneer of computer science and
    one of a handful of visionaries that conceived of the very idea of a computer
    language—describing what you want'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'the computer to do and have that description translated into machine codes
    that the computer would execute. Before that, most people thought computers could
    only add numbers.


