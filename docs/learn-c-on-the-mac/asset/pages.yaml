  md: '# Chapter 9


    # # The Command Line


    Everything you''ve done up to this point has been inside the safe confines of
    the Xcode sandbox. There''s nothing wrong with that; professional programmers
    spend most of their time inside Xcode. But ultimately, the goal is create a “real”
    program that runs on its own. A program you can copy to another computer and run
    there. Maybe one day, a program you upload to the App Store and sell to multitudes
    of people around the world.


    All of the projects in this book build a single executable file. A *binary executable*,
    as they are known, is the simplest form of a program that the operating system
    understands: a single file that contains machine code. It doesn''t get much simpler
    than that. When an executable is run, those machine codes are read from the file
    and copied into the computer''s RAM, where the CPU executes them.


    Xcode can create other kinds of programs, many quite complex. If you go on to
    learn Objective-C or iOS, you''ll create some of those other kinds of applications.
    But for now, you''ll stay with simple executables.


    In this chapter, you''re going to learn about the command line—the other computer
    interface. You''re also going to learn how to build your program so you can run
    it on its own, give it to your friends to run, deliver it to your employer, or
    even sell it. This stage of software development is called *deployment*. You''re
    going to use those deployment skills to create and install your own command line
    tool. Along the way you''re going to learn a little about OS X''s underpinnings,
    especially paths, and some clever things you can do with pointers. Let''s get
    started.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Command Line Basics


    If you''ve spent time using the command line, a lot of this section will be familiar
    to you. You might want to skim through it, skip it entirely if you and the command
    line are old friends.


    Before big LCD displays and wireless keyboards, before graphical user interfaces
    with overlapping windows, before the trackpad, before the mouse, there was the
    command line. A command-line interface (CLI) is an incredibly simple way to control
    a computer, and almost self-explanatory. You type words (commands) on a line and
    press the Return key. The computer performs these commands and waits for you to
    type another. For an era, the command-line interface was just about the only interface
    computers had. Apple''s original computer, the Apple II, relied on a command-line
    interface.


    In OS X the command line lives in the Terminal application. Launch the Terminal
    application—you''ll find it in the Applications folder, then inside the Utilities
    subfolder—and you''ll see a stark window, like the one shown in Figure 9-1.


    > NOTE: If you''re thinking that the command-line interface is still just for
    nostalgia, think again. While we now use a graphical user interface (GUI) to do
    most of our work, the command-line interface remains a powerful tool. It can be
    used to automate your development, examine and control running processes, help
    you debug applications, hidden preferences, administer and control remote computers,
    and so much more. On your journey to obtaining OS X High Wizard status, you''ll
    come to appreciate the formidable capabilities of the command line.


    ![](img/107863f6fad4269a6697938c194582e0_231_0.png)


    Figure 9-1. Terminal window


    Each Terminal window runs a shell session. A *shell* is a program that implements
    a command-line interface. It''s the program that waits for you to type something
    and then performs the actions you commanded.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'NOTE: The default shell program in OS X is bash (pronounced like the word "bash").
    It''s an abbreviation for the Bourne-Again shell, a successor to the original
    Bourne shell (sh) written by Stephen Bourne.

    Other popular shells are the Korn shell (ksh), Z shell (zsh), C shell (csh), and
    TENEX C shell (tc). OS X includes all of these shells and others. The C and TENEX
    shells are interesting because their syntax is intended to mimic the C programming
    language. There are specialty shells like the Remote shell (rsh) and Secure shell
    (ssh) for executing commands on another computer.


    Traditionally, a shell will begin by outputting a salutation. The first line you
    see in the window is Figure 9-1:


    Last login: Wed Jul 27 11:01:39 on ttys000


    The salutation might alert you that mail''s waiting for you, a message of the
    day, or even a joke. After the salutation is the prompt:

    mac-pro:~~ james


    The prompt is just that—the shell is saying that it''s waiting for you to type
    a command. The standard prompt includes the name of your computer (called its
    hostname), the current directory (which to get to there), your user account, and
    a prompt character ($).


    You enter your command after the prompt by typing on the keyboard and pressing
    the Return key. Try it. Type the letters "ls" and press Return. The shell performs
    the ls ("list directory contents") command and the output appears after your command
    in the window, as shown in Figure 9-2.


    ![](img/107863f6fad4269a6697938c194582e0_232_0.png)


    Figure 9-2: Output of ls


    The ls command lists the objects in the current directory. The shell outputs another
    prompt, telling you that it''s finished and is ready for another command.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Command Arguments


    Commands, like C functions, can also have arguments. Arguments follow the command
    and are separated from the command, and other arguments, by spaces. An argument
    that alters the behavior of a command is called an option or switch, and it is
    traditionally prefixed by one or two hyphens (-), pronounced "dash". Try the ls
    command, but adding this time -l (that''s a lower letter l) switch before pressing
    Return.


    ```

    Last login: Fri Jul 27 11:07:03 on

    mac-proc~$ ls

    Desktop             Movies      Pictures

    Documents           Library     Public

    mac-proc~$ ls -l

    total 0

    drwx------      6 staff 204 Jul 20 10:58 Documents

    drwx------      5 staff 178 Jul 25 22:40 Desktop

    drwx------      4 staff 136 Jul 25 22:15 Downloads

    drwx------ 38 staff 1292 Jul 26 22:16 Library

    drwx------      3 staff 102 Jul 25 22:20 Movies

    drwx------ 13 staff 180 Jul 25 22:20 Music

    drwx-xr-xr-x 14 staff 476 Jul 27 21:20 Pictures

    mac-proc~$ jamess _

    ```


    > Figure 9-3. Output of ls -l


    The ls -l switch changes its output to the "long" format (see Figure 9-3), which
    shows the type, permissions, size, ownership, and last modified date of each item
    in your home folder. In most commands, multiple switches can be combined.


    ```

    ls -l -n

    ls -lhn

    ls -ln h

    ```


    Command arguments that are not switches are generally a path to something, which
    the command will act on. The ls -l Music will list the items in your Music directory,
    rather than your home directory.'
  merge: -1
  pgno: 233
