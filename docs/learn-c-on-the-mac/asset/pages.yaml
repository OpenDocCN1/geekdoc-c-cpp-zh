  md: '# Typecasting


    You can tell the compiler to convert any type into any other (convertible) type
    using a typecast. A typecast is the type you want the value to, surround by parentheses,
    immediately before the value. Here''s an example:


    ```

    (long int)n

    ```


    This expression converts the value of the variable n to a long int. It doesn''t
    matter what n is. It is an int, a unsigned long int, a char, a float, or a long
    double. If it''s physically possible to convert the value of n into a long int,
    the compiler will do that and the result of expression will be a long int.


    Typecasting is really handy in a variety of circumstances. First, lets you control
    the type conversion performed by the compiler. Using typecasting to control conversion
    is called *explicit conversion*.


    Modifying the code used earlier, you can control implicit conversion like this:


    ```

    int i = 99;

    double d = 99.0;

    if ( i == (int)d) {

    ```


    In this code, instead of automatically converting i to a double (both sides of
    the == operator are double), the d variable is forced to become an int. Now the
    compiler looks at both operands and sees that both are ints, no implicit conversion
    is necessary, and the == operator compares two ints.


    You can put a typecast in any expression you want. The compiler will do its best
    to convert it to that type before evaluating it in the local context of the statement
    or expression.


    The typecast is an operator. It doesn''t change the basic rules that other C operators
    live by. If the earlier code changed to


    ```

    if ( i == (long int)d) {

    ```


    the compiler would look at the type of operand on the left (an int) and the type
    of operand on the right (a long int) and would implicitly convert the int into
    a long int so that == is comparing two long ints. This results in two conversions:
    d gets converted to long int (explicit conversion), and i gets converted to a
    long int (implicit conversion). You can''t use typecasting to change the rules
    of C operators, but you can use them to nudge them in the direction you want.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '> NOTE: Technically, a variable type in parentheses immediately before any
    value is called a cast operator. The term "typecast" doesn''t appear anywhere
    in the C language standard, but it''s such a common term among programmers that
    we use it here.


    Programmers often use typecasts to explicitly declare the conversions they know
    are required. It''s superfluous (the compiler must perform the conversion anyway),
    but it''s a way for the programmer to document that what conversions are needed
    and they''re OK with it. This would not be an uncommon code for an experienced
    C programmer:


    ```

    int a, b;

    b = 5;

    b = (int)exp2((double)a);

    ```


    Type A, obsessive programmers have been known to cast the return value of functions
    that they intentionally ignore as (void), just to point out that they are ignoring
    the function''s returned value:


    ```

    (void)printf("I don''t care how many characters were output to stdout.\n");

    ```


    # # Typecasting Pointers


    Typecasting can also be used to change the meaning of pointers. This notation
    casts the myPtr as a pointer to an int:


    ```

    (int*)myPtr

    ```


    C does not consider pointers of different types to be compatible. In other words,
    a pointer to a char and a pointer to an int are incompatible and won''t be implicitly
    converted. The code


    ```

    int *iPtr;

    char *cPtr;

    iPtr = cPtr;

    ```


    will cause a compiler error. It just doesn''t make sense to the compiler. A pointer
    either points to an int or points to a char. An address that points to a char
    shouldn''t be assigned to a variable that points to int because that fundamentally
    changes the meaning of the value at that address.


    The exception to the rule is the void* type, which is compatible with any specific
    pointer type.'
