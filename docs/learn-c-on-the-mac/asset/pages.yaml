- img_proc: true
  md: 'The higher operator is in the chart, the higher its precedence. For example,
    suppose you are trying to predict the result of this line of code:

    myInt = 5 * 3 + 7;


    First, look up the operator * in Table 4-1. Hmm, this one seems to be in the chart
    twice, with label "pointer" and with the label "multiply". You can tell just by
    looking at this line of code that we want the multiply version. The compiler is
    pretty smart. Just like you, you can tell that this is the mighty version of *.


    OK, now look up +. Yep, it''s in twice once, also as unary and once as binary.
    A unary + or - is the sign that appears before a number, like +147 or -32768.
    In this line of code, the + operator has two operands, so clearly + is the one
    to pick.


    Now you''ve figured out which operator is which, you can see that the multiply
    * is higher up on the chart than the +, thus has a higher precedence. This means
    the * will get evaluated before the +, as if the expression was written as


    ```

    myInt = (5 * 3) + 7;

    ```


    So far good. Now, what about the following line of code?


    ```

    myInt = 27 * 6 % 5;

    ```


    Both of these operators are on the fourth line in the chart. Which one gets evaluated
    first? If both operators under consideration are on the same line in the chart,
    the order of evaluation is determined by the entry in the rightmost column. In
    this case, * will get evaluated before %, as if the line of code were written


    ```

    myInt = (27 * 6) % 5;

    ```


    What about this line of code?


    ```

    myInt = 27 % 6 * 5;

    ```


    In this case, the % will get evaluated before the *, as if the line of code were
    written


    ```

    myInt = (27 % 6) * 5;

    ```


    > TIP: When in doubt, use parentheses! If the order of operations is important
    and isn''t obvious—or you just can''t remember what the operator precedence is—use
    parentheses to force the order you want. There''s no cost to use parentheses,'
