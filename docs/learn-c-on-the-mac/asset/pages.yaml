  md: '# HASH TABLES


    Hash tables are a technique for searching large collections of values quickly.


    Arrays are notoriously slow to search, and the time required to search one the
    size of the collection. If array A had 100 elements and array B had 10,000 elements,
    it would take (on average) hundreds times longer to find an element in array B
    than array A.


    One technique is to sort the array into order. Then you can use a binary search
    to quickly find a value. By assuming array is sorted, a binary search will start
    by checking the middle element of the array. If that element is before the value
    it''s looking for, the search knows that none of the elements before the middle
    can be the value. Then it checks the middle of the upper half and repeats the
    process, each time eliminating half of the remaining elements, until it narrows
    to the one it was looking for. The Standard Library''s bsearch() implements a
    binary search for you.


    A binary search can reduce the time needed to search a collection dramatically.
    For an array with 10,000 elements, the number of tests drops from 5,000 to 11
    or 12 (on average). But—and this is a big "but”—it requires that the collection
    be in sorted order, which itself can be a very time consuming activity.


    Enter, hash tables. They have the almost magical ability to reduce the search
    time to almost nothing, and the size and order of the collection doesn''t matter.
    A hash table can find an element in an unsorted collection of 10,000,000 elements
    almost as fast as one with ten.


    Hash accomplish this by assigning an integer number to value, called a hash code.
    The hash codes for two identical values will always be the same. The hash codes
    for two values that are not equal are highly likely to be different (but they
    don''t have to be). A large array of pointers is that element''s hash code. To
    find any element matching a value, the hash code for that element is fetched,
    and the value it points to is compared with the original value. If they match,
    you found the value. If not, you didn''t. It''s quick, simple, and efficient.


    We oversimplified hash tables. We could spend the rest of this chapter going into
    the details, but we couldn''t do better than the hash table Wikipedia page at
    http://en.wikipedia.org/wiki/Hash_table, which we encourage you to peruse.


    The key to using a hash is to assign an integer number. Two values that are equal
    must return the same hash code. Two values that aren''t equal could have the same
    hash code, but the collection is more efficient if they don''t. So the idea is
    to write a formula that will generates different codes for almost any two values
    but return the same code for two values that are equal. Here''s the hash code
    function for this set:'
