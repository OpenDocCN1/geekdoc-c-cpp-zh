    # Conversion Rules


    The compiler will attempt to convert any integer or floating point variable into
    the needed type. Assign a char to a long double and the compiler will perform
    whatever numeric conversion is necessary so that long double has the same logical
    value the char did.


    Most of the implicit conversion works silently and doesn''t cause any problems.
    But there are some cases in which this automatic conversion could cause you headaches,
    so let''s look at the rules the compiler uses and why it might matter to you.
    These aren''t the exact rules the compiler uses, but it''s close enough to give
    you an idea of how things done.


    +   1. Any int can be safely converted to a long int.


    A long int can be safely converted to a long int. A short int can be safely converted
    to an int, long int, or long int. In the following code, it doesn''t matter what
    the value of c is, all of the variables will have the same value:


    ```

    char c; short int si; int; long int li; long int lii;

    lli = li = si = c;

    ```


    When converting to longer integer types, the compiler guarantees that the value
    will always be the same number.


    +   2. Any int can be successfully converted to a shorter int, only if the value
    will fit in the shorter representation.'
