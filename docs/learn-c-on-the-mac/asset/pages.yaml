  md: "# Stepping Through the Postfix Source Code\n\nThe first half of main.c is pretty\
    \ straightforward. The variable myInt is defined to be of type int. Then, myInt\
    \ is assigned a value of 5. Next comes the tricky part.\n\n```\n#include <stdio.h>\n\
    ```\n\n```\nint main(int argc, const char * argv[]) {\n    int myInt;\n\n    myInt\
    \ = 5;\n```\n\nThe first call to printf() actually has a statement embedded in\
    \ it. This is another great feature of the C language. Where there's room for\
    \ a variable, there's room for an entire statement. Sometimes, performing two\
    \ actions within the same line of code is convenient. For example, this line of\
    \ code\n\n```\nprintf(\"myInt ---> %d\", myInt = myInt * 3);\n```\n\ntriples the\
    \ value of myInt, and then passes the result (the tripled value of myInt) onto\
    \ printf(). The same could have been accomplished using two lines of code.\n\n\
    ```\nmyInt = myInt * 3;\nprintf(\"myInt ---> %d\\n\", myInt);\n```\n\nIn general,\
    \ when the compiler encounters an assignment statement where it expects a variable,\
    \ it first completes the assignment, and then passes the result of the assignment\
    \ if it were a variable. Let's see this technique in action.\n\nIn main.c, our\
    \ find the postfix operator emerges again. Just before the two calls of printf(),\
    \ myInt has a value of 15. The first of the two printf() increments the value\
    \ of myInt using postfix notation:\n\n```\nprintf(\"myInt ---> %d\\n\", myInt++););\n\
    ```\n\nThe use of postfix notation means that the value of myInt will be passed\
    \ to printf() before myInt is incremented. The first printf() will accord myInt\
    \ a value of 15. However, when the statement is finished, myInt will have a value\
    \ of 16.\n\nThe second printf() acts in a more rational (and preferable) manner.\
    \ The prefix notation guarantees that myInt will be incremented (from 6 to 7)\
    \ before its value is passed to printf().\n\n```\nprintf(\"myInt ---> %d\", ++myInt);\n\
    \nreturn 0;\n```"
