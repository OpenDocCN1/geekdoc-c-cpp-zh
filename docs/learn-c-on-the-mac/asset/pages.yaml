  md: 'Technically, there is no difference at all. The assert macro adds code your
    function that tests the condition. If the condition is false, it calls a function
    that outputs a message to standard error and terminates your program. The assert
    macro has a hidden talent; you can turn it off.


    You get an assert by including the <assert.h> Standard Library header, like this:


    ```

    #include <assert.h>

    ```


    If you only include the <assert.h> header, then all of the assert statements in
    your code will behave the way we describe. However, if you define the NDEBUG preprocessor
    macro before including the <assert.h> header, like


    ```

    #define NDEBUG

    #include <assert.h>

    ```


    all of the assert statements in your code disappear (to the compiler). The assert
    statements do not generate any code, they don''t make decisions, and they''ll
    never terminate your program. You are also no longer protecting any of your code,
    but if you''re pretty sure it doesn''t need protecting.


    The idea is to use assertions during development and testing. You can sprinkle
    your code with hundreds of assertions that you''re sure all will be true. Then
    you put your program through its paces, testing every function and possible data
    value you can think of. If an assert terminates your program, then you immediately
    know which assumption was wrong. change the code so the assumption is true again.
    When you''re done, your program should run without tripping any assertion statements.


    When your program is "clean" you can turn off all of the assertion code by defining
    the NDEBUG macro and recompiling your project. It''s the same program, just without
    the safety net.


    You should now understand what we mean by an "assumption," why assumptions pose
    a hazard to your programs, and the tradeoffs involved either living with them
    or trying to protect your code from them. Let''s move on the next rule.


    # Rule #2: Stay Alert


    You can''t know if the zombies are coming if you''re kicking listening to your
    iPod with your eyes closed. Similarly, you won''t know if functions are failing
    if you ignore their return values. Numerous projects in this book have ignored
    return values. We did this to keep things simple and so you could focus on the'
