  md: '# FIVE EASY PIECES


    Here''s a bit of behind-the-scenes technical detail for folks who want a more
    complete picture of the source code we just explored. Skim through this explanation
    and, if it seems a bit fuzzy, come back to it later. By the time you get to the
    end of the book, this will all seem pretty straight-forward.


    The source code in main.c can be broken into five basic pieces. Here''s the first
    piece:


    ```

    #include <stdio.h>

    ```


    In C, any line that starts with a pound sign (#) is known as a preprocessor directive,
    an instruction that asks the compiler to do something special. This particular
    directive is called #include (pronounced "pound include\). It asks the compiler
    to include code from another file on your hard drive or plain header. As it turns
    out, the file stdio.h contains all kinds of goodies that you''ll use throughout
    the book. Just ignore this line for now.


    Here''s the second piece:


    ```

    int main (int argc, const char * argv[])

    {\}

    ```


    As discussed bit earlier, this is the function declaration for the function named
    main(). The curly braces surround the body of the function.


    The third piece of this puzzle is this line:


    ```

    // insert code here...

    ```


    Any time the compiler encounters two slashes (/) in a row, it ignores the slashes
    and anything else on that line. This line of code is called a comment. Its only
    purpose is to document your code and to help make clear what''s going on at this
    point in the program. Comments are a good thing.


    The fourth piece is the call to the function printf(), which we will focus on
    in this chapter.


    ```

    printf("Hello,!\n");

    ```


    The fifth and final piece of your program is this line of code:


    ```

    return 0;

    ```


    A return statement tells the compiler that you are done with this function and
    you want to return. In this case, you want the compiler to return a value of 0.


    Again, don''t get hung up on the specifics. It''ll become clear as you go.'
