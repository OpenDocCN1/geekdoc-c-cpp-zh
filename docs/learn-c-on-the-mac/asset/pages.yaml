  md: 'the details of how printf() works, any more than you need to remember all of
    the steps involved in baking a cake you buy from your local bakery. You order
    the cake and the chef goes through the steps to bake it. You call the SayHello()
    function and it goes through the steps to make "Hello" appear in the console.


    # Defining a Function


    Functions start off with a function declaration, in this case:

    void SayHello( void )


    A function declaration consists of a return type, the function name, and a pair
    of parentheses wrapped around a parameter list. We''ll talk about the return type
    and parameter list later. For now, the important thing is to be able to pick out
    the function''s name in the function declaration and be able to understand.


    Following the declaration comes the body of the function. The body is always placed
    between a pair of curly braces: { }. These braces are known in programming circles
    as left curly and right curly. Here''s the body of SayHello():


    ```

    {

    printf("Hello!!!\n");

    }

    ```


    The body of a function consists of a series of statements. This particular statement
    calls another function, but there are other kinds of statements, too. As you make
    your way through this book, you''ll learn all of the different kinds of statements,
    and what they''re used for.


    Creating efficient statements will make your programs run faster with less chance
    of error. The more you learn about programming (and the more time you spend at
    your craft), the more efficient you''ll make your code.


    # Syntax Errors and Algorithms


    When you compile your source code, the compiler does its best to translate your
    source code into object code.


    As you learn C, you''ll find yourself making two types of mistakes. The simplest
    type, called a syntax error, prevents the program from compiling. The syntax of
    a language is the set of rules that defines what is or is not legal. The compiler
    will only compile code that properly follows the C language syntax, as defined
    by the official C standard (C99). If the code you write doesn''t conform to these
    rules, the compiler won''t understand what you wrote. When this happens,'
