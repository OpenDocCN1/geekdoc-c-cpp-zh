    # Using Parentheses


    Sometimes the expressions you create can be evaluated in several ways. Here''s
    an example:


    ```

    myInt = 5 + 3 * 2;

    ```


    You can add 5 + 3 and then multiply the result by 2 (giving you 16). Alternatively,
    you can multiply 3 by 2 and add 5 to the result (giving you 11). Which is correct?


    > TIP: In class, you may have learned the PEMDAS mnemonic: do things in Parentheses
    first, then Exponents, then Multiplication and Division, and finally Addition
    and Subtraction. C also follows this rule, although the actual rules are a little
    more complex.


    C has a set of built-rules for resolving the order of operators. As it turns out,
    the * operator has a higher precedence than the + operator, so the multiplication
    will be performed first, yielding a result of 11.


    Though it helps to understand the relative precedence of the C operators, keeping
    track of them all is hard. That''s why C god gave us parentheses! Use parentheses
    in pairs to define the order in which you want your operators performed. The statement


    ```

    myInt = ( 5 + 3 ) * 2;

    ```


    will leave myInt with a value of 16. The statement


    ```

    myInt = 5 + ( 3 * 2 );

    ```


    will leave myInt with a value of 11. You can use more than one set of parentheses
    in a statement, as long as they are in pairs—one left parenthesis associated with
    each right parenthesis. The statement


    ```

    myInt = ( ( 5 + 3 ) * 2 );

    ```


    will leave myInt with a value of 16.'
