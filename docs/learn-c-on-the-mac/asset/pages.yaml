    Imagine what would happen if you typed a 20-character, or longer, name in response
    to the console prompt. We realize that very few of you have a name that long,
    but just bear with us. The name is only long enough to hold a 19-character name,
    reserving one byte for the string terminating NUL. scanf() doesn''t know how big
    your array is, so it doesn''t know when to stop copying characters. When scanf()
    receives data too long for its char array, it keeps copying bytes anyway, even
    if it means stepping off the end of the array. scanf() writes 21st character in
