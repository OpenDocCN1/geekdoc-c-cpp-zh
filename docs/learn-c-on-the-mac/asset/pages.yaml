- img_proc: true
  md: 'program like IntSize to find an int type''s 2 bytes long and use that. But
    that only works as long as your compiler never changes and you never compile your
    program for a different CPU.


    The standard library header <stdint.h> defines a family of custom types define
    specific sizes. The int16_t defines a signed integer that will always be exactly
    2 bytes (16 bits) no matter where your program is compiled. The rest of the types
    (int8_t, int32_t, int64_t) do the same and there''s a matching set for the unsigned
    types (uint8_t, uint16_t, uint32_t, and uint64_t). There are types that guarantee
    a minimum size (int_least16_t, int_least32_t, and so on) but might be bigger.
    For performance hounds, there are types that guarantee a minimum size but might
    be bigger if the version is faster on this particular CPU (int_fast16_t, uint_fast8_t).
    Want the biggest your CPU can handle? Use intmax_t.


    When considering rule #4, include this advice: if you need int''s a specific size,
    use one of the exact-width types.


    # Integer vs. Floating Point


    The last bit of advice we''re going to impart before we move on to the char type
    is when to use an integer type and when to use a floating point type. Our advice
    is simple: integer for all discrete values and general variables. Use floating
    point only for "continuous" values.


    The vast majority of your variables will be integers. Integer variables are small,
    efficient, and fast. But most importantly, they''re discrete. They will never
    store a fractional value, which makes them well suited to making decisions, controlling
    loops, addressing elements in an array (later in this chapter), and so on. You
    can''t run a loop 2.3 times.


    Floating point variable are best suited for values that are not discrete. The
    variable used in the earlier example should have a floating point value. A spaceship
    can just easily be 2,000 km above the earth as it can be 2,000.6 km. Time, distance,
    color, transparency, field strength, amplitude, speed, and angles should be floating
    point numbers.


    In the past, programmers avoided floating point numbers like the plague, mostly
    because they were so incredibly slow. Modern computers have dedicated floating
    point processing units that are so fast that the difference in performance is
    now rarely a consideration.'
