    # POINTER EQUIVALENCE


    We''ve hinted at this in the past, but now you know enough arrays, pointers, and
    pointer arithmetic to appreciate how interchangeable pointers and array variables
    are.


    We''ve prepared a "chat sheet" for you. Open the PointerEquivalence project that
    you''ll find in the 09.03 -PointerEquivalence folder. The program consists of
    nothing but short blocks of code that demonstrate functionally equivalent elements.
    Take this code, for example:


    ```

    int array[10];

    int *pointer, *intPtr;


    pointer = array;

    i = 4;


    intPtr = &array[i];

    intPtr = pointer + i;

    ```


    The last two are functionally identical. Because pointer was set to the address
    of the first element in array, the expressions &array[i] and pointer+i mean the
    same thing: a pointer to the ith element of array.


    The equivalence between array variables and pointers runs deep in C. So that array
    variables names and pointers are largely interchangeable. The following C code
    might look insane, but it is perfectly legal and will work exactly the way you
    think it should:


    ```

    int x;

    x = *pointer[i];

    x = *(array+i);

    intPtr = &pointer[i];

    intPtr = array + i;

    ```


    You can use the subscript operator [] with a pointer variable, and you can use
    any variable name as though it was a pointer variable pointing to the first element
    of array. The only thing you can''t do


    array = intPtr;

    because array isn''t a pointer variable that can be assigned a new value.


    Use PointerEquivalence to study pointer and array syntax, or use it as a reference
    when trying to determine the best solution to a pointer problem. Read through
