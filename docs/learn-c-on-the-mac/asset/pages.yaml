  md: '# Testing WordCount in the Shell


    When you ran WordCount in Xcode, Xcode provided a console window connected to
    standard output. But if you want to quickly run your program in the shell without
    going through the archive and deployment steps you did at the beginning of this
    chapter? It turns out there''s a clever feature of the Terminal window that will
    make this easy.


    If just ran the WordCount program, then Xcode has recently built the executable.
    If not, choose the Product > Build for Running command from the menu bar to make
    sure your binary executable is up to date.


    Open a window in the Terminal and position it alongside the workspace window,
    as shown in Figure 9-16. Type the following command in the terminal—but press
    Return! (The last character on the line is the vertical bar, usually found above
    the Return key).


    echo ''Four score and seven years ago'' |

    Now switch to the Xcode workspace window. In the project navigator, find the WordCount
    executable inside the Products group. This object represents your finished program
    during development and testing. Drag the WordCount program over to the Terminal
    window and drop it. You will see a result similar to that in Figure 9-19.


    ![](img/107863f6fad4269a6697938c194582e0_279_0.png)


    Figure 9-19. Dropping a file into a Terminal window


    Dropping a file or folder into the Terminal window while at a command prompt will
    insert the absolute path of that item into your command line. It is a fantastic
    time saver. For example, type cd, drop any folder from the Finder into the Terminal
    window, and then press Return. Your current working directory will now be set
    to that folder.'
