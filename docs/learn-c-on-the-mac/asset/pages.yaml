  md: 'Because that book was written as a sequel to this one, you should feel right
    at home.


    What''s Objective-C got that regular old C doesn''t? In a word, objects. Just
    as a string binds variables together a single name, an object can bring variables
    together as functions, binding them together a single class name.


    Objects are incredibly powerful. Every part of the Mac interface has a set of
    objects associated with it. Want to create a new window? Just create a new window
    object and it will take care of all the housekeeping associated with maintaining
    a window. The window object''s functions will draw the contents of the window
    for you, perhaps communicating with other objects to get them draw themselves
    within the window.


    There are pull-down menus, icon objects, scrollbar objects, file objects, even
    objects that can organize other objects. If you can imagine it, there''s probably
    a set of objects that will help you build it.


    # Learning Cocoa and Cocoa Touch


    Learning Objective-C will teach you the mechanics of working with objects. Once
    you get that, you can turn your attention to Cocoa or Cocoa Touch, Apple''s object
    libraries. Cocoa is an extensive collection of objects that will allow you to
    implement pretty much every aspect of the Mac OS experience. Cocoa Touch is a
    collection of objects that will allow you to create exciting mobile applications
    for iOS devices like the iPod, iPhone, or iPad.


    As you might expect, Apple''s developer tools contain some excellent Cocoa documentation.
    Back in the documentation browser, search for "Cocoa" and locate the article "Introducing
    Cocoa," if you are interested in creating OS X applications. If you''re goal is
    to rock the iOS world, a good place to start is the "IOS Technology Overview."
    All of this excellent documentation can be found right in your Documentation browser,
    and you can''t beat the price.


    As the names suggest, the Cocoa and Cocoa Touch libraries share a lot in common.
    Learn one, and you''ve already learned half of the other.


    # A Bit of OS X Code


    Our editors are hanging on us to get this last chapter submitted, but we can''t
    resist showing you a bit more—just three more projects—and we''ll let you go.
    These are just to give you a taste of where you''re heading.'
