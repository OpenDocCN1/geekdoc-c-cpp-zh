  md: '# Fancier File Manipulation


    Now that you''ve mastered the basics of file reading and writing, there are a
    few

    tore topics are worth exploring. We''ll start off with a look at some additional
    file

    opening modes.


    # The Update Modes


    So far, you''ve encountered the two basic file opening modes: "r" and "w".

    There''s also an "a" (append) mode that is like "w" (write) doesn''t erase any

    existing data. Each of these modes has a corresponding update mode, specified

    by adding a plus sign (+) to the mode. The three update modes, "r+", "w+", and

    "a+\ allow you to open a file for both reading and writing.


    A great chart in Hobson and Steele''s C: A Reference Manual summarizes these\modes
    quite nicely. My version of the chart is found in Table 11-1. Before you

    read on, take a minute to look over the chart to be sure you understand the

    different file modes.


    +   Table 11-1. Rules Associated with Each of the Basic File Modes


    | Mode Rules | "r" | "w" | "a" | "r+" | "w+" | "a+" |

    |---|---|---|---|---|---||

    | Named file must already exist | Yes | No | No | Yes | No | No |

    | Existing file''s contents are lost | No | Yes | No | No | Yes | No |

    | Read OK | Yes | No | Yes | Yes | No | Yes |

    | Write OK | No | Yes | Yes | No | Yes | Yes |

    | Write begins at end of file | No | No | Yes | No | No | Yes |


    > **TIP:** Most implementations of fopen(), including the one in OS X, will allow
    you

    add an "x" to the end of the "w" or "a" modes, as "w+x". This modifier will

    prevent the file from being opened if the file already exists. It''s most useful
    when

    want to use the "w" mode to write out a brand new file, but don''t want to

    accidentally delete an existing file if it''s already there.'
