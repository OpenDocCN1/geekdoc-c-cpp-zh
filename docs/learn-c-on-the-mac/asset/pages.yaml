    # Subtracting Pointers


    If a pointer plus an integer equals another pointer, then a pointer minus a pointer
    should equal an integer, right?


    Right you are. Subtracting two pointers yields an integer, and it follows the
    same rule as addition. The difference of two pointers is the count of elements
    between the two pointers. An "element" is the type of the variable the pointers
    point to. Here''s a simple example:


    ```

    int array[ 10 ];

    int *aPointer = &array[ 1 ];

    int *bPointer = &array[ 7 ];

    int x = bPointer - aPointer;

    ```


    Can you guess what x will be set to? Assume the memory address of array is 2,000.
    The address of aPointer will be 2,004 (assuming 4-byte ints), and the address
    of bPointer will be 2,028. The difference between aPointer and bPointer is 24
    bytes of memory.


    The variable x will be set to 6 because the difference between aPointer and bPointer
    is 6 ints. This works for all types, not just ints. The formula C uses when subtracting
    pointers is the difference in bytes divided by the size of the variable pointers
    point to. C will only let you subtract pointers to variables of the same size.


    Now that you know all of these cool new tricks with pointers, let''s do something
    with it.


