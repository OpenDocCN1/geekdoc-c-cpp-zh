  md: '# Chapter 11


    # # Working With Files


    Chapter 10 introduced DVDTracker, a program designed to keep track of your DVD
    collection. DVDTracker allowed you to enter a new DVD, as well as list all existing
    DVDs. DVDTracker''s biggest shortcoming was that it didn''t save the DVD information
    when it exited. If you ran DVDTracker, entered information on ten DVDs, and then
    quit, your information would be gone. The next time you ran DVDTracker, you''d
    have to start from scratch.


    The solution to this problem is to somehow save all of the DVD information before
    you quit the program so it can be used again the time you run it. This is called
    persistence. This chapter will show you how to implement persistence. It introduces
    the concept of files, the long-term storage for your program''s data. You''ll
    start off with the basics, learning how to open and read a file and write data
    out to a file. You''ll learn how to use the console window. Next, you''ll learn
    about a variety of file opening modes that give you more options when dealing
    with files, and how to selectively read and update portions of a file. Towards
    the end, you''ll learn how files and character streams are related.


    > NOTE: As you move to other programming languages (such as Objective-C, Java,
    or C++), sophisticated development frameworks (such as Cocoa), and even other
    operating systems, you''ll find there are many ways to work with files. Most of
    them are based on the concepts you''ll learn in this chapter.


    Stay with the program! Learn the basics, and you''ll find moving on to other development
    platforms much, much easier in the long run.


    331'
  merge: -1
