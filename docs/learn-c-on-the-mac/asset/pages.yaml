    As you might have guessed, these pointers to rearrange all the books in the library,
    without moving a single book. Think about it. If you search the catalog by subject,
    it''s just as if all the books in the library are arranged by subject. Physically,
    the book arrangements have nothing to do with subject; the books are arranged
    numerically by catalog number. By adding a layer of pointers between you and the
    books, the librarians achieve an extra layer of flexibility.


    In the same way, if you search the catalog by title, it''s just as if all the
    books in the library are arranged alphabetically by title. Again, physically,
    the book arrangements have nothing to do with title. By using pointers, all books
    in the library are arranged in different ways without ever leaving the shelves.
    The books are arranged physically (sorted by catalog number) and logically (sorted
    by author, subject, title, and so on). Without the support of a layer of pointers,
    these logical book arrangements would be impossible.


