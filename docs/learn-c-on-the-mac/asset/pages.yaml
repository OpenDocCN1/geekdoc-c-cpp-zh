    \    printf(\"%d\\n\", i);\n    i++;\n} while (i < 3);\nprintf(\"We are past the\
    \ loop.\\\");\"\n\nThe first time through the loop, i has a value of 1. The printf()\
    \ prints a 1 in the console window, and the value of i is bumped to 2. It's not\
    \ until this point that the expression ( i < 3 ) is evaluated. Since 2 is less\
    \ than 3, a second pass through the loops occurs.\n\nDuring this second pass,\
    \ the printf() prints a 2 in the console window, and the value of i is bumped\
    \ to 3. Once again, the expression ( i < 3 ) is evaluated. Since 3 is not less\
    \ than 3, you drop out of the loop to the second printf().\n\nThe simple thing\
    \ to remember about loops is: since the expression is not evaluated until the\
    \ bottom of the loop, the body of the loop (the statement) is always executed\
    \ at least once. Since for and while loops both check their expressions at the\
    \ top of the loop, each can drop out of the loop before the body of the loop is\
    \ executed.\n\nLet's move on to a completely different type of statement, known\
    \ as switch.\n\n# The switch Statement\n\nThe switch statement uses the value\
    \ of an expression to determine which of a series of statements to execute. The\
    \ basic form of a switch statement looks like\n\n```\nswitch ( expression ) {\n\
    \    case constant1:\n        statement1\n    case constant2:\n        statement2\n\
    \n    default:\n        statement\n}\n```\n\nThe switch statement consists of\
    \ an expression and a series of cases, each identified by a case label—the keyword\
    \ case, followed by a numeric constant"
