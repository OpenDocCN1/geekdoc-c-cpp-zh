  md: 'NOTE: By convention, a program that produces useful output sends to standard
    output. If it has any error or diagnostic messages, it sends those to standard
    error. Often these two outputs are connected to the same pipe, which means it
    doesn''t matter which one you use they all end up in the same place. But sometimes
    shells will separate the program''s regular output from its error messages and
    will connect those character streams to different pipes.


    Before a program starts running, it is connected to a character stream of incoming
    bytes (standard) and a character stream of outgoing bytes (standard output). The
    program reads characters from standard and in writers to standard output. What
    it doesn''t care is about those pipes are connected to. Someone else determines
    that.


    A command-line tool may only read from standard input, in only write to standard
    output, both, or neither. What make sense depends on the nature of the tool.


    # Redirection


    By connecting a process to different character streams, it''s possible to reconfigure
    a single command-line tool to be used in different ways—without changing the tool.
    Connecting a command''s input or output (I/O) to an alternative stream is called
    redirecting its input/output (I/O). The following are the most common character
    streams that a process will be connected to:


    +   * Keyboard (input) or window (output)

    * A file

    * Nothing at all

    * Standard in/out of another program


