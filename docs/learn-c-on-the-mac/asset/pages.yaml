    # MODULAR CODE


    The DVDFile program has just gotten complicated enough that we decided to break
    it up into modules. As your programs get bigger, you''ll want to begin organizing
    them so they don''t get out of hand.


    Programs are kind of companies. As a business grows, it will often reorganize
    itself into divisions, departments, subsidiaries, and so on. Because one person
    can''t manage everything that''s going in a big organization. The company creates
    departments within itself, of a manageable size. Department A can work with department
    B to accomplish things, department A doesn''t have to worry about the details
    of department B (who hire, what vacation schedule is, and so on).


    Similarly, programmers organize large applications into functions, modules, objects,
    and frameworks. C programmers refer to each .c file as a module. Generally, a
    module has two parts: its implementation and its interface. The implementation
    is the code in the .c file that does the work. Its interface, usually in a .h
    file, is the information another module needs to use.


    To see this in practice, look at the DVDFile.h and DVDFile.c files in the DVDFile
    project. Here''s the content from the DVDFile.h:


    ```

    extern void writeFile( void );

    extern void ReadFile( void );

    ```


    It contains two function prototypes: writeFile() and ReadFile(). They are marked
    with the extern keyword to indicate that these functions are implemented in another
    module. If you look at the DVDFile.c source, you''ll see two functions, but there
    are others as well. All of that is part of the interface. A function (like main())
    doesn''t need to know anything else about the code in DVDFile.c except that it
    contains two functions—ReadFile() and WriteFile()—that will load or save the list
    of DVDs.


    The interface should be the minimum amount of information another module needs
    to use that module. Broadly speaking, the simpler the interface, the better the
    module is designed. Returning to the recipe analogy from Chapter 3, a well-designed
    module that bakes cakes has a simple interface. It should include functions to
    order a cake and pick it up. There should be constants for the flavors to choose
    from. But the details of the cake-baking process (where


