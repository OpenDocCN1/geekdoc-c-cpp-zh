    Next, it called scanf() to read the first name from the input buffer:


    ```

    scanf("%s", name );

    ```


    Since the program just started, the input buffer is empty. scanf() will wait until
    characters appear in the input buffer, which will happen as soon as you type some
    characters and press Return. Type your first name, and press Return.


    > NOTE: As mentioned earlier, scanf() (typically) ignore leading characters in
    the input buffer. If a line contains nothing but whitespace, the line will be
    ignored. For example, if you type a few spaces and then press Return, scanf()
    will continue to sit, waiting for some real input. Try it!


    Once you type your name, scanf() will copy the characters, byte at a time, into
    the char array pointed to by name. Remember, because name was declared as an array,
    name points to the first of the 20 bytes allocated for the array.


    If you type in name "Dave", scanf() will place the four characters "D", "a", "v",
    and "e" in the first of the 20 bytes allocated for the array. Next, scanf() will
    set the first byte to a value of ''\\0'' (NULL) to terminate the string properly
    (see Figure 9-15). Since the string is properly terminated by the ''\\0'' in name[4],
    you don''t really care about the value of the name[5] through name[19].


    Next, you pass name on printf(), asking it to print the name as part of a welcome
    message. The %s tells printf() that name points to the first byte of a zero-terminated
    string. printf() will step through memory, one byte at a time, starting with the
    byte that name points to. printf() will print each byte in turn until it hits
    a byte with a value of ''\\0''. The NULL character marks the end of the string.


    ```

    printf("Hello, %s\n", name);

