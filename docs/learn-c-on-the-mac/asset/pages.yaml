  md: 'CPUs use 64-bit (8 byte) pointers. This allows a pointer to store the address
    of any memory location between 0 and 18,446,744,079,551,615—that''s big number!
    It works out to 16 exabytes, or 16 billion gigabytes—a really, really big, and
    many more than RAM can handle.


    The size of pointers is tightly tied to the computer hardware. Back in the days
    of the original Apple II, microcomputers used 32-bit pointers. Simply stated,
    it meant the CPU could directly address 65,536 memory locations (64 KB). Hey,
    it seemed like a lot at the time.


    Not surprisingly, it wasn''t very long before this ended. By the time the original
    Mac was introduced, CPUs were starting to use 32-bit pointers. The Motorola 68000
    processor in the original Mac could, theoretically, address up to 4GB of RAM.
    Of course, no one made modules that you couldn''t install on the motherboard even
    if you could get your hands on it. For programmers, it meant pointer variables
    were 4 bytes long.


    Fast-forward 30 years and the 4GB of addresses that seemed almost inexhaustible
    in the 1980s looks puny now. CPU design has, naturally, been trying to keep up
    and desktop computers have now largely transitioned to 64-bit (8 byte) pointers.
    Again, that doesn''t mean you can actually install 16 exabytes of RAM in your
    Mac, but a program that uses 64-bit pointers will run on such a system.


    64-bit pointers should hold us for some time to come. To put it in perspective,
    the surface of a Popsicle stick represents all the memory that a 32-bit pointer
    can address the surface area of the Golden Gate Bridge. Given the exponential
    rate that memory density keeps increasing, and computer programs keep using more
    memory, the transition from 32 to 64-bit should hold us for about 90 years. Of
    course, we won''t be surprised if our great grandchildren are one day shaking
    their heads how we ever by by "only" 16 exabytes of addressable memory.


    Once memory is allocated for myVar and myPointer, you move on to the statement:


    ```

    myPointer = &myVar;

    ```


    The address of the variable myVar is stored in the 8 bytes allocated to myPointer.
    In this example, myVar''s address is 836. Now, myPointer is said to point to myVar.
    See Figure 7-6.'
