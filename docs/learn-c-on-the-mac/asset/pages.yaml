  md: "and a colon. The value of the expression is evaluated (once) and execution\
    \ jumps directly to the label that matches the value. If no case label matches\
    \ the value, execution skips to the special default label. If there's no default\
    \ label, none of the statements are executed.\n\nHere's an example that would\
    \ make this concept a little clearer:\n\n```\nswitch ( theYear) {\ncase 1066:\n\
    \    printf(\"Battle of Hastings\");\n    break;\ncase 1492:\n    printf(\"Columbus\
    \ sailed the ocean blue\");\n    break;\ncase 1776:\n    printf(\"Declaration\
    \ of Independence\\n\");\n    printf(\"A very important document!!!\");\n    break;\n\
    default:\n    printf(\"Don't know what happened during this year\");\n}\n```\n\
    \n> NOTE: The switch statement and the if statement are both known as selection\
    \ statements.\n\nIf theYear has a value of 1066, execution continues with the\
    \ statement following the label case 1066; which in this case (no pun intended)\
    \ refers to the following line:\n\nprintf(\"Battle of Hastings\");\n\nExecution\
    \ continues, line after line, until the bottom of the switch (the right curly\
    \ brace) or a break statement is reached. In this example, the next line is a\
    \ break statement, so no further statements in the switch statement are executed.\n\
    \nThe break statement comes in handy when you are working with switch statements.\
    \ The break tells the compiler to \"jump out of the switch statement.\nExecution\
    \ continues with the next statement after the end of the switch.\n\nContinuing\
    \ with the example, if theYear has a value of 1492, the switch jumps to these\
    \ lines:\n\nprintf(\"Columbus sailed the ocean blue\");\n\nbreak;\n\nA value of\
    \ 1776 jumps to these lines:"
