    > NOTE: It''s important to understand that this second call to Factorial() is
    treated

    just like any other function call that occurs in the middle of a function. The
    calling

    function''s variables are preserved while the called function runs. In this case,

    the called function is just another copy (called an *instance*) of Factorial().'
