  md: "# TrimLine()\n\nThe last function is the TrimLine() function that's been used\
    \ from several places so far. The values you get from someone typing characters\
    \ on the keyboard are gone to be examined for command characters, to string fields,\
    \ and converted into numbers. In all of these situations, you don't want extraneous\
