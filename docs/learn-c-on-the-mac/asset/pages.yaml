  md: 'The int value 999 (32 bits) can be converted to a short int (16 bits), but
    not a char (8 bits). When an int is converted to a shorter representation, only
    the least significant bits of the value are preserved. Here''s an example:


    ```

    unsigned int i = 999;

    unsigned char c = i;

    ```


    Only the lowest bits of the number 999 (11 1110 0111 in binary) are assigned to
    the unsigned char, becoming 231 (1110 0111).


    +   3. When a signed integer is converted to an unsigned integer—or vice versa—of
    the same length, the bits of the value remain same, but the number will change
    if the new type cannot represent that number.


    We covered this awhile back, but it bears repeating.


    ```

    unsigned char uc = 231;

    signed char sc = uc;

    ```


    Converting the unsigned char value of 231 (1110 0111 in binary) into a signed
    char will become -25 (1110 0111 in two''s complement binary).


    +   4. A unsigned integer can always be converted to a signed integer that has
    a longer representation.


    This is sort of a corollary to the first and third rules. It''s always safe to
    convert an unsigned integer to a signed integer if the signed integer''s representation
    is longer, like this:


    ```

    unsigned int ui;

    signed long int slli = ui;

    ```


    No matter what value is stored in ui, that assignment statement always works.


    +   5. Any floating point value can be safely converted to another floating point
    representation that is longer.


    Similar the rule for ints, the C language guarantees that you can convert a shorter
    floating point value to a longer floating point value with no change in the value.


    ```

    float f; double d; long double ld;

    ld = d = f;

    ```


    No matter what value f contains, all of these variables will contain the same
    number.'
