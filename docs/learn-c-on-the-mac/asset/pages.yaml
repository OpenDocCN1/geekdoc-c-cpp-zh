  md: 'Here''s a sample fopen() call:


    This code calls fopen(), attempting to open the file named My Data File.txt for
    reading. If fopen() cannot open the file for some reason—perhaps you asked it
    to open a file that doesn''t exist—it returns NULL. In that case, it''ll print
    an error message and exit.


    > NOTE: There is a limit to the number of simultaneous open files. This limit
    is implemented as a #define. FOPEN_MAX, defined in the file <stdio.h>. At the
    time of this writing, FOPEN_MAX was defined to be 20.


    If fopen opens it, it will allocate the memory for a FILE struct, and fp will
    point to struct. You can then pass fp to routines that read from the file. Once
    you are done with the file, you will pass fp to the function fclose():


    ```

    int fclose(FILE *stream);

    ```


    fclose() takes a pointer to a FILE as a parameter and attempts to close that file.
    If the file is closed successfully, fclose() frees the memory allocated to the
    FILE struct and returns a value of 0. It is very important that you match every
    fopen() with a corresponding fclose(), particularly if you are writing to the
    file.


    Once you''ve passed a FILE pointer to fclose(), that FILE pointer no longer points
    to a FILE struct. After calling fclose(), do not attempt to use that FILE struct
    pointer for anything. If the pointer variable is going to hang around, set it
    to NULL. If you want to access the file again, you''ll have to make another fopen()
    call.


    # Reading a File


    Once you open a file for reading, the next step is to read data from the file.
    Several Standard Library functions help you do just that. For starters, the function
    getc() reads a single character from a file. Here''s the function prototype:


    ```

    int getc(FILE *fp);

    ```'
