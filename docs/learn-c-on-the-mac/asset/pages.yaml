  md: '# 12


    # Chapter


    # # Handling Errors


    You''ve learned a lot about C. You''ve learned about arrays, pointers, dynamically
    allocating memory, and accessing files. Along the way, we''ve hinted at some of
    the pitfalls you have to look out for: not storing values the dimension of an
    array, not using uninitialized pointers, checking fgetc() for EOF, and so on.
    But we haven''t really been doing this in any systematic way.


    Error handling is a general term for writing code so it still works when unexpected
    things happens. And believe us, unexpected things will happen. Your code isn''t
    battling for survival in the inevitable zombie apocalypse, but your program does
    need to defend itself from erroneous values, unexpected circumstances, and (yes)
    even hackers. And like the hero in Zombieland, you can survive by following a
    few simple rules.


    The rules we''ve developed for you are based on programming best practices. Best
    practices are guidelines—born of experience and research—that help you write better
    programs. There are entire books dedicated to this subject. Instead of going into
    the theory and history, we''ve chosen a simple set of rules to get you started.
    They encompass habits that might not be obvious to new programmers, but will generally
    reduce the number of bugs in your program, now and in the future. As you gain
    more programming experience, you''ll learn the rationale behind these rules and
    even circumstances where they might not apply. But for now, we want you to follow
    these rules. We''re sure they''ll get you started in the right direction.


    But before we get to those rules, let''s talk about what happens when things go
    wrong.'
