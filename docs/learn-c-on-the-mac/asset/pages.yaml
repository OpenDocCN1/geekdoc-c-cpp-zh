    Now let''s move on to the Core Foundation library. This is another C library,
    but this one comes from Apple.


    # Collections in Core Foundation


    OS X includes the Core Foundation framework (another kind of library) that provides
    you with hundreds of powerful C functions. Unlike the Standard Library, most data
    is in opaque (you don''t know what''s inside) blobs of data that you pass around
    by pointer. In an object-oriented world, Core Foundation is object-oriented. Each
    blob is called an *object*, and the pointer is called a *reference*. We discuss
    this a little more in the next chapter, but you don''t need to know anything about
    objects for this excursion.


    > **NOTE:** The Core Foundation uses the term *type* to describe a set of properties
    shared by multiple objects. Most object oriented programming languages use the
    term *class*. It''s the same concept, just different names.


    The Core Foundation framework provides, among other things, a number of different
    collection solutions. A collection is a container (like an array) that can hold
    other bits and blobs of data. They are much more flexible than the C arrays and
    structures you''ve used so far. Core Foundation provides five kinds of collections:'
  merge: -1
  pgno: 445
- img_proc: true
  md: '+   Array: An array is, conceptually, like a C array, except that you don''t
    have to pre-allocate enough room to hold all of the elements. As you add elements,
    the array makes room for them. You can also insert and remove elements from the
    middle of the array; all of the remaining elements are moved down (or up) as needed.
    There are also functions to sort the array.


    +   Dictionary: A dictionary is a form of associative array. Instead of addressing
    each element (value) using an integer index, each element is associated with a
    key. The key can be any value you choose. You define what the keys are and what
    the values are, and the dictionary uses one to find the other. For example, you
    could create a dictionary that maps an imdb.movie ID (key) to a DVDInfo struct
    (value) in your DVD collection. Give the dictionary an imdb.movie movie ID, and
    it will tell you that you HAVE and what it is.


    +   Set: A set is an unordered collection of values, and it acts much like its
    mathematical counterpart. You can''t directly request an individual element in
    a set (by index or key), but you can determine if a value is in the set. A value
    can only be added to a set once. That is, a value is either in the set or it''s
    not.


    +   Bag: A bag is like a set, but you can add the same value multiple times. Think
    of a bag of marbles. You can put one aggie and three steelies in a bag. Even though
    all three steelies are the same “value,” they count as three elements in the bag.


    +   Tree: A tree organizes values into a hierarchy. The files on your hard drive
    do contain files and folders, which can contain files and folders, which can contain
    files and folders, and so on. If you have something like that in your program,
    you can use a tree to organize it.


    The collections supplied by Core Foundation are, like the Standard library functions,
    a generalized solution that you customize by supplying it with a set of functions.
    A collection requires several user-supplied functions to do its job. These are
    all bundled together in a struct that constitutes a kind of “personality module”
    for the collection. Let''s see how this works by using a set collection to keep
    track of your favorite DVDs.'
