    # # Compiling Your Source Code


    Once your source code is written, your next job is to hand it off to a compiler.
    The compiler translates your C code into instructions—a sequence of numeric codes—that
    make sense to your computer. These instructions are known as *machine language*
    or *object code*. Source code is for you; you write the source code using an editor,
    and the compiler translates your source code into a machine-readable form.'
