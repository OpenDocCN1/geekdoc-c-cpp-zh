  md: 'Everything in a computer is a sequence of binary bits! Your bank account balance
    is a sequence of binary bits. Your copy of the movie Finding Nemo is a sequence
    of binary bits. We promise to stopping you of nothing in this future.)


    A single floating point number is basically two numbers that combine to form its
    value: an integer that represents the significant digits of the number (with the
    funny name significand), also known as the mantissa or coefficient and a second
    integer that is an exponent. If you''ve ever studied science or engineering, you''ve
    run across scientific notation, like the following:


    +   * 10⁰


    It''s a two-part number that consists of the significant digits of the number
    plus a power of ten that tells you the decimal place. In the example, the number
    is 2,738,000,000. If the exponent was 10⁻¹, the number would be 273.8. If the
    exponent was 10¹, the number would be 0.0002738. Both the significand and the
    exponent can be negative.


    Floating point numbers are essentially, the same scheme. The biggest difference
    is that the exponent is a power of 2 instead of 10 because computers have bits,
    not fingers.


    So why is this important? Just as in can''t represent integer values beyond the
    range of bits it has, a floating point can''t represent more significant digits
    than the range of bits it uses for its significand. This is the critical difference
    to understand. An integer has a fixed range on its size. A floating point variable
    has a fixed accuracy on its size.


    Assign any number to a floating point variable—no matter how big or small the
    value is—the first digits will be accurately represented. But as the number of
    digits gets longer and longer, it requires more bits of the significand. At some
    point the number will be too complex to store. But unlike an integer (that simply
    can''t store a number that''s too big), a floating point number will store a number
    that''s as close as it to the original number.


    The take-away message is this: the bigger the floating point type, the greater
    its accuracy. If a float can''t store the exact value, it will store the number
    that''s as close to the real number as it can represent.


    The next printf()s shows the result of using different modifier values to print
    the same float:


    ```

    printf("myFloat = %10.1f\n",myFloat);

    printf("myFloat = %.2f\n",myFloat);

    printf("myFloat = %12.2f\n",myFloat);

    printf("myFloat = %.9f\n",myFloat);

    ```


    ```

    myFloat = 12345.7

    myFloat = 12345.68

    myFloat = 12345.67871093750

    myFloat = 12345.678710938

    ```


    Here''s the output produced by each of the printf():'
