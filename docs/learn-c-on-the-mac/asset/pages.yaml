    # # Checking Out of the Library


    So far, we''ve talked about pointers in terms of house addresses and library catalog
    numbers. The use of pointers in C programs is not much different from those models.
    Each catalog number points to the location of a book on the library shelf, just
    as each street address identifies a specific house. In the same way, your program
    will point to the location of a piece of data in computer memory.


    If you write a program to keep track of your DVD collection, you might maintain
    a list of pointers, each of one might point to a block of data that describes
    a single DVD. Each block of data might contain information such as name of the
    movie, the name of the director, the year of release, and a category (such as
    drama, comedy, documentary). If you get more ambitious, you could create several
    pointers list. One list might sort your DVDs alphabetically by title. Another
    list might sort them chronologically by year of release. Yet another list might
    sort your DVDs by category. You get the picture.


    There''s a lot you can do with pointers. By mastering the techniques presented
    in these next chapters, you''ll be able to create programs that take full advantage
    of pointers.


    The goal for this chapter is to help you master pointer basics. We''ll talk about
    C pointers and C pointer operations. You''ll learn how to create a pointer and
    how to make the pointer point to a variable. You''ll also learn how to use a pointer
    to change the value of the variable pointer to.


    # # Pointer Basics


    Pointers are addresses. Instead of an address such as 1313 Mockbird Lane, Raven
    Heights, California 90263, a variable refers to a memory location within your
    computer. As we discussed in Chapter 2, your computer''s memory—also known as
    random access memory (RAM)—consists of a sequence of bytes. One megabyte of RAM
    has exactly 2^{20} (or 1,048,576) bytes of memory, while 8 megabytes of RAM has
    exactly 8 * 2^{20} = 2^{23} = 8,388,608 bytes'
