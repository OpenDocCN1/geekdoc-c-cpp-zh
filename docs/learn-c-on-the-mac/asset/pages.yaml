  md: "Figure 10-ends with the third element. The pointer field in the last element\
    \ of a linked list is typically set to NULL. The last element in the list is known\
    \ as the tail.\n\n# Why Use Linked Lists?\n\nLinked lists allow you to be extremely\
    \ efficient. Using a linked list, you can implement your DVD tracking data structure,\
    \ allocating exactly the number of structs that need—no more, no less. Each time\
    \ a DVD is added to your collection, you will allocate one new struct and add\
    \ it to the linked list.\n\nA linked list starts out as a single master pointer.\
    \ When you want to add an element to the list, call malloc() to allocate a block\
    \ of memory for the new element. Next, make the master pointer point to the new\
    \ block. Finally, set the new block's next element to NULL.\n\n# Creating a Linked\
    \ List\n\nThe first step in creating a linked list is the design of the linked\
    \ list struct. Here's a sample:\n\n```\n#define kMaxTitleLength 256\n#define kMaxCommentLength\
    \ 256\n\nstruct DVDInfo {\n    char rating;\n    char title[kMaxTitleLength];\n\
    \    char comment[kMaxCommentLength];\n    char *next;\n}\n```\n\nThe change here\
    \ is the addition of a fourth field, a pointer to a DVDInfo struct. This field\
    \ links two different DVDInfo structs together. If myFirstPtr is a pointer to\
    \ one DVDInfo struct and mySecondPtr is a pointer to a second struct, this line\n\
    \nmyFirstPtr->next = mySecondPtr;\n\nconnects the two structs. Once they are connected,\
    \ you can use a pointer in the first struct to access the second struct or its\
    \ fields! For example, the following line set the rating field of the second struct\
    \ to 7:\n\nmyFirstPtr->next->rating = 7;\n\nUsing the next field to get from one\
    \ struct to the next is also known as traversing a linked list."
