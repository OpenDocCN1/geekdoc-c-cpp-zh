  md: '# What Is a Data File?


    A data file is a series of bytes residing in some storage media. Files can be
    stored on your hard drive, a recordable DVD or CD, flash memory, a file server,
    or even on your iPod. The iTunes application is made up of a collection of files,
    including the actual executable, the preference files, and all the song files.
    Your favorite word processor lives in a file, and so does each and every document
    you create with your word processor.


    The project archive came with this book contains many different files. Apple''s
    developer tools are made up of hundreds of files. Each of the Learn C projects
    consists of at least two files: a project file and at least one source code file.
    When you compile and link a project, you produce a new kind of file, an executable
    file. All of these are examples of the same thing: a collection of bytes known
    as a file.


    All of the files on your computer share a common set of traits. All files reside
    in a filesystem. Every file has a name. Each file has a size, measured in bytes.
    The file main.c from the DVDTracker project contains about 4 thousand (4K) bytes.
    An HDTV movie in iTunes might take up several billion bytes.


    # File Basics


    A file consists of a series of consecutive bytes. The bytes in the file are organized
    much like a char array in memory. Every byte in a file has an address, called
    an offset or position. The first byte of a file is always at offset 0, and the
    offset of the last byte is always one less than the length of the file. The position
    after the last byte of a file is called the end of file (EOF) position.


    When you want to access the data in a file, you first open the file using a Standard
    Library function. The one you''ll be using is fopen(), pronounced "effopen". Once
    your file is open, you can read data from the file or write new data back into
    the file using Standard Library functions like gets(), fscanf(), and fprintf().
    Once you are working with your file, you''ll close it using another Standard Library
    function, fclose().


    Before we get into the specifics of opening a file, let''s take a side trip to
    examine the rules for naming files in C.


    # Understanding File Names


    You''ve already explored path and file names in Chapter 9. If any of that seems
    fuzzy now, consider rereading the section "Using Paths" in Chapter 9.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'In OS X''s native filesystem, a file or directory name can be up to 255 characters
    long. File names are typically uncomplicated, but OS X allows them to contain
    any Unicode character except ''/''). This means they are allowed to contain symbols
    and foreign characters. It doesn''t really matter to the operating system; a file
    is simply a sequence of bytes. To refer to a file you must provide a sequence
    of bytes.


    Other filesystems have (and often do) different rules for files. They have different
    limits on the number of characters a file name can have and what those characters
    can be. In the original Microsoft OS operating system, for example, file names
    couldn''t be more than 8 characters long! C doesn''t impose these rules—they''re
    imposed by the filesystem your program is using. So if your program reads files
    from a cloud server, you''ll have to live within the rules of reasonable length
    (32 characters or less), you should be fine.


    File names traditionally exist with a file extension. An extension is a (period)
    followed by a short sequence of characters that indicate the kind of data in the
    file. Commonly used extensions are .txt (plain text), .mp3 (MPEG-2 audio layer
    3 encoded), png (Portable Network Graphics encoded image), and so on. A file named
    Notes that contained only ASCII characters would be named Notes. OS X doesn''t
    require you to use extensions, but it''s the


    As you learned in Chapter 9, the / (slash) character has a special meaning and
    is used to separate directory and file names in a path—and is the only one not
    allowed in a file name. The . and .. names refer to the current and parent directory
    (respectively).


    You also learned about the ~ path that specifies your home directory. You can''t
    use the ~ path in most C functions, but we''ll show you how to work around that
    shortly.


    # # Opening and Closing a File


    Here''s the function prototype for fopen(), found in the file <stdio.h>:


    ```

    FILE *fopen(const char *name, const char *mode);

    ```


    The const keyword marks a variable or parameter as read-only. In other words,
    while name and mode are both pointers to variables, the fopen() function promises
    not to change them. It will only use their values, but not modify the values they
    point to in any way. We''ll talk more about the const keyword in Chapter 13.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'The first parameter to fopen(), tells fopen() which you want to open. The second
    parameter, mode, tells fopen() how you''ll be accessing the file. The three basic
    file modes are "r", "w", and "a", which stand for read, write, and append, respectively.


    > TIP: The mode parameter is char *, not char. In other words, it is a NULL-terminated
    string, so "r", not ''r''. Don''t worry if you forget it; the compiler will confuse
    you if you mix them.


    "r" tells fopen() that you want to read data from the file and that you won''t
    be writing to the file at all. The file must already exist in order to use this
    mode. In other words, you can''t use "r" to create a file.


    The mode "w" tells fopen() that you want to write to the specified file. If the
    file doesn''t exist, a new file with the specified name is created. If the file
    does exist, fopen() deletes and creates a new empty file for you to write into.


    > CAUTION: This point bears repeating: calling fopen() with a mode of "w" will
    delete a file (along the file''s contents!) if the file already exists, essentially
    starting you from the beginning of the file. Be careful!


    The mode "a" is similar to "w" mode. It tells fopen() that you want to write more
    to the specified file and create the file if it doesn''t exist. If the file does
    exist, however, the data already won''t be deleted. Any data you write to the
    file is appended to the end of the file.


    If fopen() successfully opens the specified file, it allocates a struct of type
    FILE and returns a pointer to the FILE struct. The FILE struct contains information
    about the open file, including its current mode (e.g., "r", "w", or "a") as well
    as the current file position.


    The file position indicator is a pointer into the file that acts like a bookmark
    in a book. When you open a file for reading, for example, the file position points
    to the first byte in the file (position 0). When you read the first byte, the
    file position moves to the next byte (position 1).


    It''s not really important to know the details of the FILE struct. All you need
    to keep track of the FILE pointer returned by fopen(). By passing the pointer
    to a Standard Library function that reads or writes, you''ll be sure the read
    or write takes place in the right file and at the right file position. You''ll
    see how this works as you go through this chapter''s sample code.'
  merge: -1
  pgno: 334
