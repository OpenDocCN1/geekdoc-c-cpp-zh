  md: '# Null


    Your program''s standard in or out may not be connected to anything at all.

    When your program tries to obtain characters from standard in, it will get nothing.
    Anything it sends to standard output will pass into oblivion.

    UNIX even has a pseudo-file that represents nothing, named /dev/null. The null
    file isn''t a regular file. It''s a connection to a built-in driver that produces
    nothing when read and discards everything written to it. It''s character stream
    equivalent of a black hole. You can intentionally connect a command to this black
    hole using a redirection operator:


    ```

    ls > /dev/null

    ```


    > NOTE: Pseudo-files are file system objects that appear to be regular files but
    are actually connections to special processes inside the operating system. Writing
    to a pseudo-file might send the information to a driver, a physical device, or
    (as in the case /dev/null) to nothing at all.

    All of the "files" in the /dev ("devices") directory are pseudo-files.


    # Other Processes


    Finally, your program''s standard in or out can be connected directly to the standard
    output or in (respectively) of another process, and this is where the command
    line gets interesting. Take a look at this command:


    ```

    ls | wc

    ```


    You know the ls command does, but what does this command outputs certainly isn''t
    a directory listing:


    9 9 69


    So what happened? In the shell, the (vertical bar) character is called the pipe
    operator, so named it creates a pipe that connects the standard output of the
    left command to the standard in of the right command. The wc ("word count") is
