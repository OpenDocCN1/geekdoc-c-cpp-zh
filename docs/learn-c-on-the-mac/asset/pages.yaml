  md: "This example starts with a variable declaration, right at the top of the program.\
    \ Because gMyVar was declared outside of function, gMyVar becomes a global variable,\
    \ accessible to each of the program's functions. Notice none of the functions\
    \ in this version use parameters. As a reminder, when a function is declared without\
    \ parameters, use the keyword in place of a parameter list.\n\n> NOTE: Did you\
    \ notice letter g at the beginning of the global's name? Many C programmers start\
    \ each of their global variables with the letter g (for global). Doing this will\
    \ distinguish your local variables from your global variables.\n\n# Static Variables\n\
    \nSo far all of the variables you've defined have a lifespan equal to their scope.\
    \ Parameter and automatic variables defined in a function are created when the\
    \ program starts and disappear when it ends; this is also the same span of code\
    \ that has access to that variable. Likewise, a global variable exists as long\
    \ as the program does, and it's accessible anywhere in the program.\n\nA static\
    \ variable is a hybrid that has the scope of an automatic variable and the longevity\
    \ of a global variable. It's created when the program starts (the code that can\
    \ \"see\" that variable) is limited to one function or block of code. Here's an\
    \ example:\n\n```\n#include <stdio.h>\nvoid Countdown( void );\n\nint main(int\
    \ argc, const char * argv[])\n{\n    Countdown();\n    Countdown();\n    Countdown();\n\
    \    Countdown();\n\n    return 0;\n}\n\nvoid Countdown( void )\n{\n    static\
    \ int count = 3;\n\n    if ( count != 0)\n        printf(\"%d ...\\n\", count--);\n\
    \    else\n        printf(\"Lift-off!\\n\");\n}\n```"
