  md: 'The specifier %.10.f told printf() to print one digit past the decimal and
    to use ten characters for the entire number. The specifier %.2f told printf()
    to print two digits past the decimal and use as many character positions as necessary
    to print the number. Notice that printf() rounds off the result for you and does
    not simply cut off the number after the number of places.


    The specifier %.12f told printf() to print 12 digits past the decimal, and the
    specifier %.9f told printf() to print 9 digits past the decimal. Again, notice
    the rounding that takes place.


    Your format specifier can include a minimum field width, a precision, both or
    neither. Unless you need to exactly control the number of characters used to print
    a number, you''ll probably leave off the first (minimum field width) modifier
    and just specify the number of digits past the decimal you wanted, using specifiers
    like %.2f and %.9f.


    If you use a minimum field width, like %4.2f, remember that it''s a minimum width.
    printf() will never cut off numbers to fit in that many characters; it will only
    add padding if the number is too short.


