  md: '# The += and -= Operators


    In C, you can place the same variable on both the left and right sides of an assignment
    statement. For example, the following statement increases the value of myInt by
    10:


    myInt = myInt + 10;


    The same results can be achieved using the += operator. In other words,


    myInt += 10;


    is the same as


    myInt = myInt + 10;


    In the same way, the -= operator can be used to decrement the value of a variable.


    The statement


    myInt -= 10;


    decrements the value of myInt by 10.


    # The *, /, %, *=, /= and %= Operators


    The multiplication (*) and division (/) operators each take two values and reduce
    them to a single value, much as the + and - operators do. The statement


    myInt = 3 * 5;


    multiplies 3 and 5, leaving myInt with a value of 15. The statement


    myInt = 5 / 2;


    divides 5 by 2, and assuming myInt is declared as an int (or any other type designed
    to hold whole numbers), assigns the integral (truncated) result to myInt. The
    number five divided by 2 is 2.5. Since myInt can only hold whole numbers, the
    value 2.5 is truncated and the value 2 is assigned to myInt.


    > NOTE: Math alert! Numbers like -37, 0, and 22 are known as whole numbers or
    integers. Numbers like 3.14159, 2.5, and .0001 are known as real or floating point
    numbers.'
