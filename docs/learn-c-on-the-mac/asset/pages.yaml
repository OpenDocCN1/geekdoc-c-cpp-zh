  md: '# DinoEdit.codeproj


    The DinoEdit project is a simple example of random file access. It allows you
    to edit a series of dinosaur names stored in a file named My Dinos.data. Each
    name stored in My Dinos.data is allotted 20 characters in length. A segment of
    a file that contains a value (or a group of related values) is typically referred
    to as a record. The position of each record in My Dinos.data is easy to calculate:
    multiple the record number by 20. The byte at position 19 bytes, contains one
    name. Let''s take DinoEdit for a spin.


    Open the Learn C Projects folder, go inside the folder11.03 - DinoEdit, and open
    the DinoEditproj document. Also find that folder you will find My Dinos.data file.
    Move or copy that file to your desktop. DinoEdit will count the number of dinosaur
    names in the file My Dinos.data and will use that number to prompt you for a dinosaur
    name to edit.


    **Enter number from 1 to 5 (0 to exit, a to add):


    > NOTE: If you don''t have a copy of My Dinos.data, the program will still work,
    but you''ll have to supply all of the names. Run the program and type "a" and
    Return, and then enter a new dinosaur name (up to 20 characters long), and press
    Return again. Repeat this three or four times so you''ll have a few names stored
    in the file.


    Since the file My Dinos.data has five records, enter a number from 1 to 5. If
    you type the number 3, DinoEdit will fetch the third dinosaur name from the file
    and ask you to enter a new name for the third. When you type a new name, DinoEdit
    will overwrite the existing name with the new name.


    **Dino #3: Gallimimus**


    **Enter new name (optional):** Euplocephalus


    You can elect not to replace the name by pressing Return until entering in a new
    name.


    Either way, DinoEdit will loop around prompt you to enter another dinosaur number.
    Reenter the number, so you can verify that the change was made in the file.


    **Enter number from 1 to 5 (0 to exit): 3**


    **Dino #3:** Euplocephalus


    **Enter new name (optional):** Gallimimus


    **Enter number from 1 to 5 (0 to exit): 0**'
