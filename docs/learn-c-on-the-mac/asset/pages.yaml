    \ FILE *fp )\n{\n    assert(fp != NULL);\n```\n\nThe local variables are declared\
    \ and a new DVDInfo struct is allocated.\n\n```\nstruct DVDInfo *infoPtr;\nint\
    \    scanResult;\ninfoPtr = NewDVDInfo();\n```"
