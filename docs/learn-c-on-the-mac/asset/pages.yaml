    Think of the process of building and running your program as a three-stage process.
    First, Xcode compiles all your source code to object code. Next, all the object
    code in your project is linked by a program called linker to form your application.
    Finished application (called an executable) is what actually runs on your computer.


    Take a look at Figure 2-2. This project contains two source code files, one named
