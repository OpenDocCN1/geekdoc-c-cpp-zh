  md: '# The Integer Types


    At this point you''ve learned about five different variable types: three floating
    point types (float, double, long) and two integer types (int and unsigned int).
    In this section, we''ll introduce the remaining 10 different types, but in a way
    that will make things seem simpler, not more complex.


    There are actually only two kinds of numbers in C: integer and floating point.
    All of the numeric types are just variations on these two themes. The integer
    types, int and char, form the first family. You''re very familiar with int. The
    char (character) type is just another integer type, but one suited for working
    text, which we''ll get to later in this chapter. But for now, just know that char
    is just another integer variable type. And you''ve learned the floating point
    family of float and double.


    All of the remaining types in C are created by using one of the four base types
    combined with several type modifiers. You''ve already used one modifier (long)
    to create a long double. Here are some of the type modifiers that you''ll be working
    with:


    +   - The long modifier creates a type that uses more bits for increased range/precision.
    Note that long can be used with int and double to create a bigger int or a more
    precise double.

    - The short modifier is the opposite of the long modifier and makes a smaller
    version of the base type for a number that has less range/precision. Note that
    short can only modify an int.

    - The long long modifier (that''s "long" twice) uses even more bits than the long
    type for greater range. Note that long long can only be used with int.

    - The unsigned modifier means the integer can only represent zero and positive
    numbers. Note that unsigned can modify an int or char.

    - The signed modifier is the opposite of unsigned, which means it represent both
    positive and negative numbers. (See Chapter 4 again if that didn''t make sense.)
    Note that signed can modify an int or char.


    The first three modifiers (short, long, and long long) are size modifiers and
    you can only use one. That is, you can''t create a short long int.'
  merge: -1
