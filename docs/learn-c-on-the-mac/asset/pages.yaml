  md: "through each of the even integers between 2 and the number's square root, one\
    \ at a time, searching for no factor is found, you have a prime. The process of\
    \ stepping through the numbers between 2 and the number's square root is called\
    \ iteration.\n\n# The Iterative Approach\n\nIn programming, iterative solutions\
    \ are fairly common. Almost every time you use a for loop, you are applying an\
    \ iterative approach to a problem. An alternative to the iterative approach is\
    \ known as recursion. In a recursive approach, instead of repeating a process\
    \ in a loop, the function can call itself until the process is complete. If that\
    \ sounds a little weird, hang in there. It will make perfect sense.\n\nSuppose\
    \ you want to calculate 5 factorial (written 5!). The factorial of a number is\
    \ the product of each integer 1 up to the number, for example:\n\n5! = 5 * 4 *\
    \ 3 * 2 * 1 = 120\n\nUsing an iterative approach, you might write some code like:\
    \ <stdio.h>\n\n```\n#include <stdio.h>\n\nint main (int argc, char * argv[])\n\
