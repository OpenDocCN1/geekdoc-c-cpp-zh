  md: "# Body of the loop\n\n```\n}\n    while (test condition);\n```\n\nOn reaching\
    \ the do statement, the program proceeds to evaluate the body of the loop first.\
    \ At the end of the loop, the test condition in the while statement is evaluated.\
    \ If the condition is true, the program continues to evaluate the body of the\
    \ loop once again. This process continues as long as the condition is true. When\
    \ the condition becomes false, the loop will be terminated and the control goes\
    \ to the statement that appears immediately after the while statement.\n\nSince\
    \ the test condition is evaluated at the bottom of the loop, the do....while construct\
    \ provides an exit-controlled loop and therefore the body of the loop is always\
    \ executed at least once.\n\nConsider an example:\n\n```\n..........\n..........\n\
    i = 1;\nsum = 0;\ndo\n{\n    sum = sum + i;\n    i = i+2;\n}\nwhile(sum < 40 ||\
    \ i < 10); // semicolon here\n..........\n..........\n```\n\nThe loop will be\
    \ executed as long as one of the two relations is true. Program 7.2 illustrates\
    \ the use of do....while loops for printing a multiplication table.\n\n# Program\
    \ 7.2\n\n# PRINTING THE MULTIPLICATION TABLE USING DO....WHILE LOOP\n\n```\nclass\
    \ DoWhileTest\n{\n    public static void Main ()\n    {\n        int row, column,\
    \ y;\n        row = 1;\n        System.Console.WriteLine(\"Multiplication Table\
    \ \\n\");\n        do\n        {\n            column = 1;\n            do\n  \
    \          {\n                y = row * column;\n                System.Console.Write(\"\
    \ \" + y);\n                column = column + 1;\n            }\n            while\
    \ (column <= 3);\n            System.Console.WriteLine(\"\\n\");\n           \
    \ row = row + 1;\n    }\n```"
