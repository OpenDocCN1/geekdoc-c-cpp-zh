  md: "This process may be extended to any number of levels. The class C can inherit\
    \ the members of both A and B as shown in Fig. 13.6.\n\nAs discussed earlier,\
    \ the constructors are executed from the top downwards, with the bottom most class\
    \ constructor being executed last. Example:\n\n```\nclass A\n{\n    protected\
    \ int a;\n    public A (int x)\n    {\n        a = x;\n    }\n}\nclass B : A\n\
    {\n    protected int b;\n    public B (int x, int y) : base (x)\n    {\n     \
    \   b = y;\n    }\n}\nclass C : B\n{\n    int c;\n    public C (int x, int y,\
    \ int z) : base (x, y)\n    {\n        c = z;\n    }\n}\n```\n\nThe constructors\
    \ are implemented in the following order:\n\n+   A() // class A\n+   B() // class\
    \ B\n+   C() // class C\n\nNote that we have used base in both the derived classes\
    \ without specifying the actual name of the base class. Since C# supports only\
    \ ‘single’ inheritance, base means the ‘immediate’ base class constructor. However,\
    \ care should be exercised to place arguments in proper order so that correct\
    \ values are passed to the data members.\n\nProgram 13.3 shows the multilevel\
