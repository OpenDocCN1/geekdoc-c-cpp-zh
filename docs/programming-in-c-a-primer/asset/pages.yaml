  md: '# 9.7 ARRAYLIST CLASS


    System.Collections namespace defines a class known as ArrayList that can store
    a dynamically sized array of objects. The ArrayList class includes a number of
    methods to support operations such as sorting, removing and enumerating its contents.
    It also supports a property Count that gives the number of objects in an array
    list and a property Capacity to modify or read the capacity.


    An array list is very similar to an array, except that it has the ability to grow
    dynamically. We can create an array list by indicating the initial capacity we
    want. Example:


    ```

    ArrayList cities = new ArrayList (30);

    ```


    It creates cities with a capacity to store thirty objects. If we do not specify
    the size, it defaults to sixteen. That is, ArrayList cities = new ArrayList ();
    will create a cities list with the capacity to store sixteen objects. We can now
    add elements to the list using the Add () method:


    ```

    cities.Add ("Bombay");

    cities.Add ("Anand");

    ```


    We can also remove an element:


    ```

    cities.RemoveAt (1);

    ```


    This will remove the object in position 1. We can modify the capacity of the list
    using the property Capacity:


    ```

    cities.Capacity = 20;

    ```


    We may obtain the actual number of objects present in the list using the property
    Count as follows:


    ```

    int n = cities.Count;

    ```


    An array list can be really useful if we need to create an array of objects but
    we do not know in advance how big the array would be. Further, an array list can
    contain any object reference.


    Table 9.2 lists some of the most important methods and properties supported by
    the ArrayList class.


    # Table 9.2 Some important ArrayList methods and properties


    | METHODS/PROPERTY | PURPOSE |

    |---|---|

    | Add () | Adds an object to a list |

    | Clear () | Removes all the elements from the list |

    | Contains () | Determines if an element is in the list |

    | CopyTo () | Copies a list to another |

    | Insert () | Inserts an element into the list |

    | Remove () | Removes the first occurrence of an element |

    | RemoveAt () | Removes the element at the specified place |

    | RemoveRange () | Removes a range of elements |

    | Sort () | Sorts the elements |

    | Capacity | Gets or sets the number of elements in the list |

    | Count | Gets the number of elements currently in the list |


    Program 9.4 demonstrates how an array list may be created and manipulated.'
