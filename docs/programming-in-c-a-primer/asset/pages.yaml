- pgno: 357
  md: '# Programming in C#


    ```

    ```csharp

    try

    {

    statement; // generates an exception

    }

    catch (Exception e)

    {

    statement; // processes the exception

    }

    ```

    ```


    The try block can have one or more statements that could generate an exception.
    If any one statement generates an exception, the remaining statements in the block
    are skipped and execution jumps to the catch block that is placed next to the
    try block.


    The catch block too can have one or more statements that are necessary to process
    the exception. Remember that every try statement should be followed by at least
    one catch statement; otherwise compilation error will occur.


    Note that the catch statement works like a method definition. The catch statement
    is passed a single parameter, which is the reference to the exception object thrown
    (by the try block). If the catch parameter matches with the type of exception
    object, then the exception is caught and statements in the catch block will be
    executed. Otherwise, the exception is not caught and the default exception handler
    will cause the execution to terminate.


    Program 18.3 illustrates the use of try and catch blocks to handle an arithmetic
    exception. Note that it is a modified version of Program 18.2.


    # Program 18.3


    ```

    ```csharp

    using System;

    class Error3

    {

    public static void Main()

    {

    int a = 10;

    int b = 5;

    int c = 5;

    int x, y;

    try

    {

    x = a / (b-c); // Exception here

    }

    catch (Exception e)

    {

    Console.WriteLine("Division by zero");

    }

    y = a / (b+c);

    Console.WriteLine("y = " + y);

    }

    }

    ```

    ```'
