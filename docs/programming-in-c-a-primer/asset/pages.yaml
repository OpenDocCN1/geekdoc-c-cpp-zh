- pgno: 278
  md: "The interface Compute will have both the methods and any class implementing\
    \ the interface Compute should implement both of them; otherwise, it is an error.\n\
    \nWe can also combine several interfaces together into a single interface. Following\
    \ declarations are valid:\n\n```\ninterface I1\n{\n    ....\n}\ninterface I2\n\
    {\n    ....\n}\ninterface I3 : I1, I2 //multiple inheritance\n{\n    ....\n}\n\
    ```\n\nWhile interfaces are allowed to extend other interfaces, subinterfaces\
    \ cannot define the methods declared in the superinterfaces. After all, subinterfaces\
    \ are still interfaces, not classes. It is the responsibility of the class that\
    \ implements the derived interface to define all the methods. Note that when an\
    \ interface extends two or more interfaces, they are separated by commas.\n\n\
    It is important to remember that an interface cannot extend classes. This would\
    \ violate the rule that an interface can have only abstract members.\n\n# 14.4\
    \ IMPLEMENTING INTERFACES\n\nInterfaces are used as 'superclasses' whose properties\
    \ are inherited by classes. It is therefore necessary to create a class that inherits\
    \ the given interface. This is done as follows:\n\n```\nclass classname : interfacename\n\
    {\n    body of classname\n}\n```\n\nHere the class classname 'implements' the\
    \ interface interfacename. A more general form of implementation may look like\
    \ this:\n\n```\nclass classname : superclass, interface1, interface2....\n{\n\
    \    body of classname\n}\n```\n\nThis shows that a class can extend another class\
    \ while implementing interfaces.\n\nIn C#, we can derive from a single class and,\
    \ in addition, implement as many interfaces as the class needs. When a class inherits\
    \ from a superclass, the name of each interface to be implemented must appear\
    \ after the superclass name. Example:\n\n```\nclass A : B, I1, I2....\n{\n   \
    \ ....\n}\n```\n\nwhere B is a base class and I1, I2, .... are interfaces. The\
    \ base class and interfaces are separated by commas."
