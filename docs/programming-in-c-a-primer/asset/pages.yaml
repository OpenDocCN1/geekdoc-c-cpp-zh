    # 20.8 WEB-BASED APPLICATION ON .NET


    In Microsoft Visual Studio, we can use ASP.NET technology and a programming language
    such as C# to create a Web based application. The controls available in the Toolbox
    of the Microsoft Visual Studio IDE help us to create the user interface of a Web
    based application. For example, we can create a Web based application to accept
    name and city from the user and when the user clicks a button, the entered name
    and city can be displayed.


    # 20.8.1 Creating and Running a Website1 Web-based Application


    Website1 Web based application allows users to enter their information, such as
    name and address. When the user clicks a button on the Default.aspx page of the
    Website1 Web-based application, another'
