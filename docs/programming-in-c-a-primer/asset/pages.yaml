  md: '# Literals, Variables and Data Types


    # 4.1 Introduction


    A programming language is designed to manipulate certain kinds of data consisting
    of numbers, characters and strings and provide useful output known as information
    to the user. The task of manipulating data is accomplished by executing a sequence
    of instructions constituting what is known as a program.


    A C# program is basically a collection of classes. A class is defined by a set
    of declaration statements and methods containing instructions known as executable
    statements. These instructions are formed using certain symbols and words according
    to some rigid rules known as syntax rules (or grammar). The smallest, non-reducible,
    textual elements in a program are referred to as tokens. The compiler recognizes
    them for building up expressions and statements.


    In simple terms, a C# program is a collection of tokens, comments and white spaces.
    C# includes the following five types of tokens:


    +   - Keywords

    +   - Operators

    +   - identifiers

    +   - Punctuators

    +   - Literals


    White spaces and comments are not tokens, though they may act as separators for
    tokens. Keywords are an essential part of a language definition. They implement
    specific features of the language. They are reserved, and cannot be used as identifiers
    except when they are prefaced by the @ character. Table 4.1 lists all the C# keywords.


    # Table 4.1 C# keywords


    | abstract | event | namespace | static |

    | as | explicit | new | string |

    | base | extern | null | struct |

    | bool | false | object | switch |

    | break | finally | operator | this |

    | byte | fixed | out | throw |

    | case | float | override | true |

    | catch | for | params | try |

    | char | foreach | private | typeof |


    (contd.)'
