- pgno: 487
  md: '# Program D.7 REALIZING A REMOTE OBJECT


    ```

    namespace Remote

    {

    using System;

    public interface Remote

    {

    void Display();

    }

    ```


    The above code defines an interface named Remote containing the Display method
    prototype. To allow an application to extend this interface we must save it inside
    a library file (.dll). We can do that by using the /t:library option.


    # Building a Server


    To build the server side object, we need to first extend the Remote interface
    created above. We must also extend the MarshalByRefObject class to produce the
    remoting functionality, as shown below:


    ```

    public class RemoteC : MarshalByRefObject, Remote

    {

    public void display ()

    {

    Console.WriteLine("Inside Server-Side Remote Object");

    }

    }

    ```


    As explained earlier, the actual transfer of objects happens through a channel.
    So, we must create a channel on the server side for processing client requests,
    as shown below:


    ```

    HttpChannel HC = new HttpChannel(50123);

    ChannelServices.RegisterChannel(HC);

    ```


    Here, we have created an HTTP channel at port 50123 for accepting client requests.
    The newly created channel must also be registered with the CLR through the ChannelServices.RegisterChannel
    method.


    The final task in building a server side object is to register it using the RemotingConfiguration
    class, as shown below:


    ```

    Type t = Type.GetType("RemoteC");

    RemotingConfiguration.RegisterWellKnownServiceType(t, "EP", WellKnownObjectMode.Singleton);

    ```


    Here, we have registered RemoteC as a well known singleton object.


    # Building the Client


    The building of client is a two-step process. First, it must register an HTTP
    channel for establishing a connection path with the remote object. Second, it
    must connect with the remote object using its URL, as shown below:


    ```

    ChannelServices.RegisterChannel(new HttpChannel());

    ```


    ```

    RemoteC R = (RemoteC)Activator.GetObject(typeof(RemoteC), "http://localhost:50123/EP");

    R.display();

    ```'
