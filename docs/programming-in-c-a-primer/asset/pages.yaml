    | checked | get | protected | unit |

    | class | goto | public | ulong |

    | const | if | readonly | unchecked |

    | continue | implicit | ref | unsafe |

    | decimal | in | return | ushort |

    | default | int | sbyte | using |

    | delegate | interface | sealed | value |

    | do | internal | set | virtual |

    | double | is | short | volatile |

    | else | lock | sizeof | void |

    | enum | long | stackalloc | while |


    *Identifiers* are programmer-designed tokens. They are used for naming classes,
    methods, variables, labels, namespaces, interfaces, etc. C# identifiers enforce
    the following rules:


    +   - They can have alphabets, digits and underscore characters

    +   - They must not begin with a digit

    +   - Upper case and lower case letters are distinct

    +   - Keywords in stand-alone mode cannot be used as identifiers


    C# permits the use of keywords as identifiers when they are prefixed with the
    ‘@’ character


    *Literals* are the way in which the values that are stored in variables are represented.
    We shall discuss these in detail in the next section.


    *Operators* are symbols used in expressions to describe operations involving one
    or more operands. Operators are considered in detail in Chapter 5.


    *Punctuators* are symbols used for grouping and separating code. They define the
    shape and function of a program. Punctuators (also known as separators) in C#
    include:


    +   - Parentheses ( )

    +   - Braces { }

    +   - Brackets [ ]

    +   - Semicolon ;

    +   - Colon :

    +   - Comma ,

    +   - Period .


    *Statements* in C# are like sentences in natural languages. A statement is an
    executable combination of tokens ending with a semicolon. C# implements several
    types of statements. They include:


    +   - Empty statements

    +   - Labeled statements

    +   - Declaration statements

    +   - Expression statements

    +   - Selection statements

    +   - Interaction statements

    +   - Jump statements

    +   - The try statements

    +   - The checked statements

    +   - The unchecked statements

    +   - The lock statements

    +   - The using statements


    These statements are discussed as and when they are encountered.


    Program 4.1 demonstrates the application of @ as a prefix for using a keyword
    as an identifier. The program uses a variable @ if the print numbers from 0 to
    9.'
