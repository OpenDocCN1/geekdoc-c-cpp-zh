  md: '# Managing Console I/O Operations


    # 17.1 Introduction


    Programs are written to manipulate a given set of data and to generate processed
    data as output following the familiar input-process-output cycle. It is therefore,
    essential that we understand how to provide input data and how to present the
    results in a desired format.


    We have already seen the use of the Console.WriteLine() method to produce simple
    outputs and Console.ReadLine() method for reading input from the keyboard. In
    this chapter, we shall consider in more detail the console I/O operations supported
    by C#.


    # 17.2 THE CONSOLE CLASS


    The methods for reading from and writing to the console are provided by the System.Console
    class. This class gives us access to the standard input, standard output and standard
    error streams as shown in Table 17.1.


    # Table 17.1 Input/Output streams


    | Stream Object | Represents |

    |---|---|

    | Console.In | Standard input |

    | Console.Out | Standard output |

    | Console.Error | Standard error |


    The standard input system Console.In gets input by default from the keyboard.
    We can also redirect it to receive input from a file. The standard output stream
    Console.Out sends output to the screen by default. We can also redirect the output
    to a file.


    The standard error stream Console.Error usually sends error messages to the screen.
    Even when the standard output is sent to a file, error messages, if any, will
    be displayed on the screen.


    # 17.3 CONSOLE INPUT


    The console input stream object supports two methods for obtaining input from
    the keyboard:


    +   - Read() Returns a single character as int. Returns -1 if no more characters
    are available.

    +   - ReadLine() Returns a string containing a line of text. Returns null if no
    more lines are available.'
