  md: "# 6.5 NESTING OF IF....ELSE STATEMENTS\n\nWhen a series of decisions are involved,\
    \ we may have to use more than one if....else statement in nested form as follows:\n\
    \nThe logic of execution is illustrated in Fig. 6.4. If the condition-1 is false,\
    \ the statement-3 will be executed; otherwise it continues to perform the second\
    \ test. If the condition-2 is true, then statement-1 will be evaluated; otherwise\
    \ statement-2 will be evaluated and the control transferred to statement-x.\n\n\
    A commercial bank has introduced an incentive policy of giving a bonus to all\
    \ its deposit holders. The policy is as follows: A bonus of 2 per cent of the\
    \ balance held on 31st December is given to every one, irrespective of their balances,\
    \ and 5 per cent is given to female account holders if their balance is more than\
    \ Rs 5000. This logic can be coded as follows:\n\n```\n......\nif(sex is female)\n\
    {\n    if (balance > 5000)\n        bonus = 0.05 * balance;\n    else\n      \
    \  bonus = 0.02 * balance;\n}\nelse\n{\n    bonus = 0.02 * balance;\n}\n balance\
    \ = balance + bonus;\n........\n```\n\nWhen nesting, care should be exercised\
    \ to match every if with an else. Consider the following alternative to the above\
    \ program (which looks right at first sight):\n\n```\nif(sex is female)\n    if(balance\
    \ > 5000)\n        bonus = 0.05 * balance;\nelse\n    bonus = 0.02 * balance;\n\
    \    balance = balance + bonus;\n```\n\nThere is an ambiguity as to over which\
    \ if the else belongs to. In C# an else is linked to the closest non-terminated\
    \ if. Therefore, the else is associated with the inner if and there is no else\
    \ option for the outer if. This means that the computer is trying to execute the\
