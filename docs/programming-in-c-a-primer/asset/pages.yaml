- pgno: 82
  md: 'Parentheses may be nested, and in such cases, evaluation of the expression
    will proceed outward from the innermost set of parentheses. Just make sure that
    every opening parentheses has a matching closing one. For example,

    9-(12/(3+3)*2)-1 = 4

    whereas

    9-((12/3)+3*2)-1 = -2


    While parentheses allow us to change the order of priority, we may also use them
    to improve understandability of the program. When in doubt, we can always add
    an extra pair just to make sure that the priority assumed is the one we require.


    # 5.13 TYPE CONVERSIONS


    We often encounter situations where there is a need to convert a data of one type
    to another before it is used in arithmetic operations or to store a value of one
    type into a variable of another type. For example, consider the code below:


    ```

    byte b1 = 50;

    byte b2 = 60;

    byte b3 = b1 + b2;

    ```


    This code attempts to add two byte values and to store the result into a third
    byte variable. But this will not work. The compiler will give an error message:

    "cannot implicitly convert type int to type byte."


    Strange message! We are not using any int type data in the code. The reason is
    as follows: When we add two byte values, the compiler automatically converts them
    into int types and the result of addition is an int value, not another byte.


    Why should the compiler do it? This is because the sum of two byte values may
    very easily result in a value that is much larger than the range of a byte.


    Since the result is of type int, we cannot assign it to a byte variable. We need
    to convert the result back to a byte type, if we want to store it as a byte value.
    Otherwise, we may assign the result to an int type variable:


    ```

    int b3 = b1 + b2; // no error

    ```


    Here, the compiler does the conversion for us, without out explicit request to
    do so.


    In C#, type conversions take place in two ways (as shown in Fig. 5.1)


    +   - Implicit conversions

    +   - Explicit conversions


    # 5.13.1 Implicit Conversions


    Implicit conversions are those that will always succeed. That is, the conversion
    can always be performed without any loss of data. For numeric types, this implies
    that the destination type can fully represent the range of the source type. For
    example, a short can be converted implicitly to an int, because the short range
    is a subset of the int range. Therefore,


    ```

    short b = 75;

    int a = b; // implicit conversion.

    ```


    are valid statements. C# does the conversion automatically. An implicit conversion
    is also known as automatic type conversion.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_82_0.png)'
