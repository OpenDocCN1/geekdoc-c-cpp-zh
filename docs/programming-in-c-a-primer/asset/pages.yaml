    \    {\n        //Factory Method Implementation Code\n    }\n}\nclass Procuct2\
    \ : Factory\n{\n    public override Product()\n    {\n        //Factory Method\
    \ Implementation Code\n    }\n}\n```\n\n# 20.6.2 Singleton Design Pattern\n\n\
    In this design pattern, a class is instantiated only once; that is, only a single\
    \ unique object is created for the class. This object is then shared among different\
    \ client applications through a static method call. The usability of such a design\
    \ pattern can be seen in scenarios where some locking or synchronization mechanisms\
    \ are required to be implemented.\n\n# 20.6.3 Chain of Responsibility Design Pattern\n\
    \nAs the name suggests, the chain of responsibility design pattern links a series\
    \ of objects together, each possessing the capability to handle the incoming request.\
    \ The request is passed along the chain until one of the chained objects receives\
    \ and handles the request.\n\n# 20.7 CREATING AND RUNNING A SAMPLEWINAPP2 WINDOWS\
