    \ to understand the requirements of the architects. After the requirement analysis,\
    \ it starts developing an application using the inheritance feature of the C#\
    \ programming language. The inheritance feature allows a class in C# to inherit\
    \ the properties and methods defined in another class besides having its own properties\
    \ and methods. Inheritance allows programmers to reuse the code of one application\
    \ in another application. ABC SoftDev creates the following application for ArchBuild\
    \ to automate the task of calculating areas for different shapes.\n\n```\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Text;\nnamespace CaseStudy13\n\
