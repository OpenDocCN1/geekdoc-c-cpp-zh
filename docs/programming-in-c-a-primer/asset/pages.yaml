  md: '```

    float[] marks;      //declare float array reference

    int[]  x,y;          //declare two int array reference

    ```


    Remember, we do not enter the size of the arrays in the declaration.


    # 9.3.2 Creation of Arrays


    After declaring an array, we need to create it in the memory. C# allows us to
    create arrays using new operator only, as shown below:


    ```

    arrayname = new type[size];

    ```


    Examples:


    ```

    number = new int[5];        //create a 5 element int array

    average = new float[10];    // create a 10 element float array

    ```


    These lines create the necessary memory locations for the arrays number and average
    and designate them as int and float respectively. Now, the variable number refers
    to an array of five integers and average refers to an array of ten floating-point
    values.


    It is also possible to combine the two steps, declaration and creation, into one
    as shown below:


    ```

    int[] number = new int[5]; //declare and create 5 element int array

    ```


    Figure 9.1 illustrates the creation of an array in memory.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_164_0.png)


    Fig. 9.1 Creation of an array in memory


    # 9.3.3 Initialization of Arrays


    The final step is to put values into the array created. This process is known
    as initialization. This is done using the array subscripts as shown below.


    ```

    arrayname[subscript] = value ;

    ```


    Example:


    ```

    number[0] = 35;

    number[1] = 40;

    ..........

    number[4] = 19;

    ```


    Note that C# creates arrays starting with a subscript of 0 and ends with a value
    one less than the size specified.'
