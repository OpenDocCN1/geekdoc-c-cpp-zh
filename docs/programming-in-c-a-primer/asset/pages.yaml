- pgno: 420
  md: 'page appears displaying the entered information. You can run the Website1 Web-based
    application by pressing the F5 key or the Start Debugging button of the toolbar,
    which is present in the Microsoft Visual Studio IDE.


    # 20.8.2 Creating a Website1 Web-based Application


    A Website1 Web based application is an ASP.NET website containing pages such as
    Default.aspx and show.aspx. This is a web application in C# using ASP.NET. This
    website makes uses of label, textbox, check box, radio button, dropdownlist, button
    and hyperlink controls. The form checks that all the values are inserted and displays
    the data in another page. To create the Website1 Web-based application, we must:


    +   - Create the Default.aspx page

    +   - Create the show.aspx page

    +   - Add code to the show.aspx page


    +   - Add code for the Default.aspx page

    +   - Create the terms.aspx page


    # Creating the Default.aspx Page


    The Default.aspx page of the Website1 Web-based application allows a user to enter
    details such as name and address and click a button to submit the details. To
    create the Default.aspx page:


    +   1. Open Microsoft Visual Studio IDE.

    +   2. Select File -> New -> Web Site to display the New Web Site dialog box as
    shown in Fig. 20.29


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_420_0.png)


    Fig. 20.29 The new web site dialog box


    Note: By default, the ASP.NET Web Site template appears selected and the Name
    text box contains C:\Documents and Settings\Administrator\My Documents\Visual
    Studio 2005\WebSites\Website1 to specify the location and name for the Web based
    application. We can change the name of the Web-based application as per requirement.
    By default, Visual Basic appears in the Language list. When you select Visual
    C# for a specific Web-based application then after that Visual C# appears automatically
    in the Language list.


    +   3. Accept the default settings and click OK to close the New Web Site dialog
    box. The Microsoft Visual Studio IDE appears with the Source view of the Default.aspx
    page, which is the default page of the Web Site1 Web based application as shown
    in Fig. 20.30.'
