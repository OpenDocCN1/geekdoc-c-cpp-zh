    # E.8 C# PREPROCESSOR DIRECTIVES


    C# pre-processor directives are similar to the pre-processor directives of C and
    C++ but with one difference. C# does not support a dedicated pre-processing engine
    for handling directive statements; instead this task is performed by the compiler
    itself. The various C# pre-processor directives are the following:


    +   - #if, #else, #elif, #endif Execute the enclosing piece of code only if the
    conditional expression holds true.

    +   - #define, #undef Define or undefine symbols to be later used along with conditional
    directives.

    +   - #warning, #error Are used along with conditional directives for generating
    custom errors and warnings.

    +   - #line Helps override the compiler’s track of the line number with a user-defined
    value.

    +   - #region, #endregion Marks a region of code to be made collapsible in Visual
    Studio Code Editor.


    The following code shows a sample program that makes use of C# pre-processor directives:


    # Program E.2 USING C# PRE-PROCESSOR DIRECTIVES


    ```

    #define SYMBOL

    using System;

    public class PP_Directive

    {

    public static void Main()

    {

    #if (SYMBOL)

    Console.WriteLine("SYMBOL exists");

    #else

    Console.WriteLine("SYMBOL does not exist");

    #endif

    }

    }

    ```


    Figure E.6 shows the output of the above program:'
