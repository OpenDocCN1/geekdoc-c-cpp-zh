- pgno: 56
  md: '# 4.3 VARIABLES


    A variable is an identifier that denotes a storage location used to store a data
    value. Unlike constants that remain unchanged during the execution of a program,
    a variable may take different values at different times during the execution of
    the program. Every variable has a type that determines what values can be stored
    in the variable.


    A variable name can be chosen by the programmer in a meaningful way so as to reflect
    what it represents in the program. Some examples of variable names are:


    +   - average

    +   - height

    +   - total_height

    +   - classStrength


    As mentioned earlier, variable names may consist of alphabets, digits and the
    underscore (_), subject to the following conditions:


    +   1. They must not begin with a digit.

    +   2. Uppercase and lowercase are distinct. This means that the variable Total
    is not the same as total or TOTAL.

    +   3. It should not be a keyword.

    +   4. White space is not allowed.

    +   5. Variable names can be of any length.


    # 4.4 DATA TYPES


    Every variable in C# is associated with a data type. Data types specify the size
    and type of values that can be stored. C# is a language rich in its data types.
    The variety available allows the programmer to select the type appropriate to
    the needs of the application.


    The types in C# are primarily divided into two categories:


    +   - Value types

    +   - Reference types


    Value types and reference types differ in two characteristics:


    +   - Where they are stored in the memory

    +   - How they behave in the context of assignment statements'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Value types (which are of fixed length) are stored on the stack, and when a
    value of a variable is assigned to another variable, the value is actually copied.
    This means that two identical copies of the value are available in memory. Reference
    types (which are of variable length) are stored on the heap, and when an assignment
    between two reference variables occurs, only the reference is copied; the actual
    value remains in the same memory location. This means that there are two references
    to a single value.


    A third category of types called pointers is available for use only in unsafe
    code. Value types and reference types are further classified as predefined and
    user-defined types as shown in Fig. 4.2.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_57_0.png)




    The value types of C# can be grouped into two categories (as shown in Fig. 4.2),
    namely,


    +   • User-defined types (or complex types) and

    +   • Predefined types (or simple types)


    We can define our own complex types known as user-defined value types which include
    struct types and enumerations. They are discussed in Chapter 11.


    Predefined value types which are also known as simple types are further subdivided
    into:


    +   • Numeric types,

    +   • Boolean types, and

    +   • Character types.


    Numeric types include integral types, floating-point types and decimal types.
    These are shown diagrammatically in Fig. 4.3.


    Note: C# 2.0 added a new type called nullable type. This type variable can hold
    an undefined value. Any value type variable can be defined as a nullable type.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_57_1.png)'
