  md: "for (x = (m+n)/2; x > 0; x = x/2)\nis perfectly valid.\n\nAnother unique aspect\
    \ of the for loop is that one or more sections can be omitted, if necessary. Consider\
    \ the following statements:\n\n```\nm = 5;\nfor ( ; m != 100 ; )\n{\n    System.Console.WriteLine(m);\n\
    \    m = m+5;\n}\n```\n\nBoth the initialization and increment sections are omitted\
    \ in the for statement. The initialization has been done before the for statement\
    \ and the control variable is incremented inside the loop. In such cases, the\
    \ sections are left blank. However, the semicolons separating the sections must\
    \ remain. If the test condition is not present, the for statement sets up an infinite\
    \ loop.\n\nWe can set up time-delay loops using the null statement as follows:\n\
    \n```\nfor (j = 1000; j > 0; j = j-1)\n; //simple semicolon\n```\n\nThis loop\
    \ is executed 1000 times without producing any output; it simply causes a time\
    \ delay. Notice that the body of the loop contains only a semicolon, known as\
    \ a empty statement. This can also be written as\n\n```\nfor (j=1000; j > 0; j\
    \ = j-1);\n```\n\nThis implies that the compiler will not give an error message\
    \ if we place a semicolon by mistake at the end of a for statement. The semicolon\
    \ will be considered as an empty statement and the program may produce some nonsense.\n\
    \nProgram 7.5 uses for looping construct to loop through two numbers, one in increasing\
