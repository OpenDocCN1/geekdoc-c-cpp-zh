    \ produce the following output:\n\nDerived Display\nBase Display\n\nNote that\
    \ the statement\ndis.Print ();\ncalls the method Print ( ) in base class B but\
    \ not the one available in the derived class itself. This is because the derived\
    \ class does not implement the interface. That is, the use of modifier new in\
    \ the derived class \"hides\" the Print method implemented in the base class.\n\
    \n# 14.6 EXPLICIT INTERFACE IMPLEMENTATION\n\nOne of the reasons that C# does\
    \ not support multiple inheritance is the problem of name collision. However,\
    \ this problem still persists in C# when it implements more than one interface.\
    \ Example:\n\n```\ninterface I1 { void Display ( ); }\ninterface I2 { void Display\
    \ ( ); }\nclass C1 : I1, I2\n{\n    public void Display { }\n}\n```\n\nDoes C1.Display(\
    \ ) implement I1.Display( ), or I2.Display( )? It is ambiguous and so the compiler\
    \ reports an error. Such problems of name collision may occur when we implement\
    \ interfaces from different sources.\n\nC# supports a technique known as explicit\
    \ interface implementation, which allows a method to specify explicitly the name\
    \ of the interface it is implementing. Program 14.4 illustrates the use of explicit\
    \ interface implementation.\n\n# Program 14.4 EXPLICIT INTERFACE IMPLEMENTATION\n\
    \n```\nusing System;\ninterface I1\n{\n    void display ( );\n}\ninterface I2\n\
    {\n    void Display ( );\n}\nclass C1 : I1, I2\n{\n    void I1.Display ( ) //no\
    \ access modifier\n    {\n        Console.WriteLine(\"I1 Display\");\n    }\n\
    ```"
