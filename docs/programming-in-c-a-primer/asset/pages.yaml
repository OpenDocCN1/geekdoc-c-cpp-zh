- pgno: 360
  md: '```

    ...//throw Divide by Zero Exception

    {

    catch(Exception e)

    {

    ...

    }

    catch (DivideByZeroException e)

    {

    ...

    }

    ```


    This code will generate a compiler error, because the exception is caught by the
    first catch (which is a more general one) and the second catch is therefore unreachable.
    In C#, having unreachable code is always an error. The code must be rewritten
    as follows:


    ```

    try

    {

    ....//throw Divide By Zero Exception

    }

    catch(DivideByZeroException e)

    {

    ....

    }

    catch(Exception e)

    {

    ....

    }

    ```


    The order of catch blocks is important. We must start with the catch blocks that
    are designed to trap very specific exceptions and finish with more general blocks
    that will cover any other exceptions for which we have not provided handlers.


    # 18.8 GENERAL CATCH HANDLER


    A catch block which will catch any exception is called a general catch handler.
    A general catch handler does not specify any parameter and can be written as:


    ```

    try

    {

    ....        //causes an exception

    }

    catch        //no parameters

    {

    ....        //handles error

    ```


    Note that catch (Exception e) can handle all the exceptions thrown by the C# code
    and therefore can be used as a general catch handler. However, if the program
    uses libraries written in other languages, then there may be an exception that
    is not derived from the class Exception. Such exceptions can be handled by the
    parameter-less catch statement. This handler is always placed at the end. Since
    there is no parameter, it does not catch any information about the exception and
    therefore we do not know what went wrong.'
