  md: '# About the Author


    E Balagurusamy, is presently the Chairman of EBG Foundation, Coimbatore. He has
    been the Vice-Chancellor, Anna University, Chennai, and Member, Union Public Service
    Commission, New Delhi. He is a teacher, trainer, and consultant in the fields
    of Information Technology and Management. He holds an ME (Hons) in Electrical
    Engineering and PhD in Systems Engineering from the Indian Institute of Technology,
    Roorkee. His areas of interest include Object-Oriented Software Engineering, E-Governance,
    Technology Management, Business Process Re-engineering, and Total Quality Management.


    A prolific writer, he has authored a large number of research papers and several
