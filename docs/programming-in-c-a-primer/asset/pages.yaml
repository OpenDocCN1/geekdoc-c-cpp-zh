  md: "price = item.price;\n\nThe copy constructor is invoked by instantiating an\
    \ object of type Item and passing it the object to be copied. Example:\n\n```\n\
    Item item2 = new Item (item1);\n```\n\nNow, item2 is a copy of item1.\n\n# 12.15\
    \ DESTRUCTORS\n\nA destructor is opposite to a constructor. It is a method called\
    \ when an object is no more required. The name of the destructor is the same as\
    \ the class name and is preceded by a tilde (~). Like constructors, a destructor\
    \ has no return type. Example:\n\n```\nclass Fun\n{\n    ...\n    ~Fun () //No\
    \ arguments\n    {\n        ...\n    }\n}\n```\n\nNote that the destructor takes\
    \ no arguments.\n\nC# manages the memory dynamically and uses a garbage collector,\
    \ running on a separate thread, to execute all destructors on exit. The process\
    \ of calling a destructor when an object is reclaimed by the garbage collector\
    \ is called finalization.\n\n# 12.16 MEMBER INITIALIZATION\n\nIn addition to using\
    \ constructors and methods to provide initial values to the objects, C# also allows\
    \ us to assign initial values to individual data members at the time of declaration.\
    \ Example:\n\n```\nclass Initialization\n{\n    int number = 100;\n    static\
    \ double x = 1.0;\n    string name = \"John\";\n    Vehicle car = new vehicle\
    \ (800, \"maruti\");\n    ...\n}\n```\n\nNote that other object-oriented languages\
    \ like C++ and Java do not support this feature. When the variables are provided\
    \ with the initial values at the time of declaration, the values are assigned\
    \ as follows:\n\n+   - Static variables are assigned when the class is loaded.\n\
    +   - Instance variables are assigned when an instance is created.\n\nIf the variables\
    \ are not provided with the initial values as above, then they are assigned default\
    \ values as dictated by their types. This is done as follows:\n\n+   - Static\
    \ variables are initialized to their default values when the class is loaded.\n\
    +   - Instance variables are initialized to their default values when an instance\
    \ is created.\n\nThus a variable is never \"uninitialized\" in C#."
