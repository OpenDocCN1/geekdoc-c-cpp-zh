  md: '# Common Programming Errors


    +   - Forgetting to declare an array.

    +   - Forgetting to initialize the elements of an array whose elements must be
    initialized.

    +   - Referring an element outside the array bounds (e.g. Off-by-one error).

    +   - Referencing the double subscripted array as x [ ] [ ] instead of x [ ].

    +   - Referencing a jagged array as x [ ] instead of x[ ] [ ].

    +   - Treating an Array type array as an ArrayList type array.

    +   - Forgetting to use capital letters for the first characters of the methods
    and properties used form the namespaces.

    +   - Forgetting the use of the System.Collections namespaces while using ArrayList
    class.


