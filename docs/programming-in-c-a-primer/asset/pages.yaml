    \ by matching the type of exception to the name of the exception mentioned. If\
    \ we are going to catch exceptions at different levels in the hierarchy, we need\
    \ to put them in the right order. The rule is that we must always put the handlers\
    \ for the most derived exception class first. Consider the following code snippet:"
