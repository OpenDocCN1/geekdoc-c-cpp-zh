- pgno: 62
  md: '# Table 4.6 Default values of variables


    | TYPE | DEFAULT VALUE |

    |---|---|

    | All integer types | 0 |

    | char type | ''\x000'' |

    | float type | 0.0f |

    | double type | 0.0d |

    | decimal type | 0.0 m |

    | bool type | false |

    | enum type | 0 |

    | All reference types | null |


    # 4.10 CONSTANT VARIABLES


    The variables whose values do not change during the execution of a program are
    known as constants. For example, the variables representing the maximum number
    of rows and columns of a matrix or number of students in a class in a program
    may not change during execution of the program. Such variables can be made unmodifiable
    by using the const keyword while initializing them.


    Example:


    ```

    const int ROWS = 10;

    const int COLS = 20;

    const int NUM = 90;

    ```


    Remember, constants must be declared and initialized simultaneously as shown above.
    For instance,


    ```

    const int m;

    m = 100;

    ```


    is illegal. By definition, a constant cannot have its value changed later.


    A constant variable can be initialized using an expression.


    Example:


    ```

    const int m = 10;

    const int n = m * 5;

    ```


    Remember, we cannot use non-const values in expressions. For instance,


    ```

    int m = 10;        // non-constant value

    const int n = m * 5;   // error

    ```


    will result in an error.


    In C and C++, such constants are known as symbolic constants and are defined using
    the #define statement. They are not declared for types.


    Advantages of using constants are:


    +   - They make our programs easier to read and understand.

    +   - They make our programs easier to modify.

    +   - They minimize accidental errors, like attempting to assign values to some
    variables which are expected to be constants.


    Note:


    +   1. The names of constant take the same form as variable names.

    +   2. After declaration of constants, they should not be assigned any other value.'
