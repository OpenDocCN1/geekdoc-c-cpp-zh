  md: "# 7.4 THE FOR STATEMENT\n\nfor is another entry-controlled loop that provides\
    \ a more concise loop-control structure. The general form of the for loop is\n\
    \n```\nfor (initialization ; test condition ; increment)\n{\n    Body of the loop\n\
    }\n```\n\nThe execution of the for statement is as follows:\n\n+   1. Initialization\
    \ of the control variables is done first, using assignment statements such as\
    \ i = 1 and count = 0. The variables i and count are known as loop-control variables.\n\
    +   2. The value of the control variable is tested using the test condition. The\
    \ test condition is a relational expression, such as i < 10, which determines\
    \ when the loop will exit. If the condition is true, the body of the loop is executed;\
    \ otherwise the loop is terminated and the execution continues with the statement\
    \ that immediately follows the loop.\n+   3. When the body of the loop is executed,\
    \ the control is transferred back to the for statement after evaluating the last\
    \ statement in the loop. Now, the control variable is incremented using an assignment\
    \ statement such as i = i + 1 and the new value of the control variable is again\
    \ tested to see whether it satisfies the loop condition. If the condition is satisfied,\
    \ the body of the loop is again executed. This process continues till the value\
    \ of the control variable fails to satisfy the test condition.\n\nConsider the\
    \ following segment of a program\n\n```\nfor (x = 0 ; x <= 9 ; x = x+1)\n{\n \
    \   System.Console.WriteLine(x);\n}\n```\n\nThis for loop is executed ten times\
    \ and prints the digits 0 to 9. The three sections enclosed within parentheses\
    \ must be separated by semicolons. Note that there is no semicolon at the end\
    \ of the increment section, x = x+1.\n\nThe for statement allows for negative\
    \ increments. For example, the loop discussed above can be written as follows:\n\
    \n```\nfor ( x = 9 ; x >= 0 ; x = x-1)\n    System.Console.WriteLine(x);\n```\n\
    \nThis loop is also executed ten times, but the output would be from 9 to 0 instead\
    \ of 0 to 9. Note that braces are optional when the body of the loop contains\
    \ only one statement.\n\nSince the conditional test is always performed at the\
    \ beginning of the loop, the body of the loop may not be executed at all, if the\
    \ condition fails at the start. For example,\n\n```\nfor (x = 9; x < 9; x = x-1)\n\
    {\n    ..........\n    ..........\n}\n```\n\nwill never be executed because the\
    \ test condition fails at the very beginning itself.\n\nLet us consider the problem\
    \ of the sum of squares of integers discussed in Section 7.2. This problem can\
    \ be coded using the for statement as follows:\n\n```\n..........\n..........\n\
    sum = 0;\n```"
