  md: "These statements are known as iteration or looping statements. We shall discuss\
    \ the features and applications of each of these statements in this chapter.\n\
    \n![](img/bae4ee2c7c29c052feb3b9a9c5659998_120_0.png)\n\n# 7.2 THE WHILE STATEMENT\n\
    \nThe simplest of all the looping structures in C# is the while statement. The\
    \ basic format of the while statement is\n\n```\ninitialization;\nwhile(test condition)\n\
    {\n    Body of the loop\n}\n```\n\nwhile is an entry-controlled loop statement.\
    \ The test condition is evaluated and if the condition is true, then the body\
    \ of the loop is executed. After execution of the body, the test condition is\
    \ once again evaluated and if it is true, the body is executed once again. This\
    \ process of repeated execution of the body continues until the test condition\
    \ finally becomes false and the control is transferred out of the loop. On exit,\
    \ the program continues with the statement immediately after the body of the loop.\n\
    \nThe body of the loop may have one or more statements. The braces are needed\
    \ only if the body contains two or more statements. However, it is a good practice\
    \ to use braces even if the body has only one statement.\n\nConsider the following\
    \ code segment:\n\n```\nsum = 0;\nn = 1; // counter\nwhile(n <= 10)\n```"
