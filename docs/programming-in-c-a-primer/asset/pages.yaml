- pgno: 322
  md: "Such delegates are called multicast delegates. Multicast delegates, also known\
    \ as combinable delegates, must satisfy the following conditions:\n\n+   - The\
    \ return type of the delegate must be void.\n+   - None of the parameters of the\
    \ delegate type can be declared as output parameters, using out keyword.\n\nIf\
    \ D is a delegate that satisfies the above conditions and d1, d2, d3 and d4 are\
    \ the instances of D, then the statements\n\n```\nd3 = d1 + d2; // d3 refers to\
    \ two methods\nd4 = d3 - d2; // d4 refers to only d1 method\n```\n\nare valid\
    \ provided that the delegate instances d1 and d2 have already been initialized\
    \ with method references and d3 and d4 contain null reference.\n\nFor a multicast\
    \ delegate instance that was created by combining two delegates, the invocation\
    \ list is formed by concatenating the invocation list of the two operands of the\
    \ addition operation. Delegates are invoked in the order they are added.\n\nProgram\
    \ 16.2 illustrates the application of multicast delegates. The program demonstrates\
    \ the use of both addition and removal of delegates. Note the order in which the\
    \ delegates m3 and m4 invoke the methods.\n\n# Program 16.2 IMPLEMENTING MULTICAST\
    \ DELEGATES\n\n```\nusing System;\ndelegate void MDelegate();\nclass DM\n{\n \
    \   static public void Display()\n    {\n        Console.WriteLine(\"NEW DELHI\"\
    );\n    }\n    static public void Print()\n    {\n        Console.WriteLine(\"\
    NEW YORK\");\n    }\n}\nclass MTest\n{\n    public static void Main()\n    {\n\
    \        MDelegate m1 = new MDelegate(DM.Display);\n        MDelegate m2 = new\
    \ MDelegate(DM.Print);\n        MDelegate m3 = m1 + m2;\n        MDelegate m4\
    \ = m2 + m1;\n        MDelegate m5 = m3 - m2;\n        // invoking delegates\n\
    \        m3();\n        m4();\n        m5();\n    }\n}\n```"
