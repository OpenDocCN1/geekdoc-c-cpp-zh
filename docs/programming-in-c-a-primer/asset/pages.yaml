  md: '# 7


    # Decision Making and Looping


    # 7.1 Introduction


    A computer is well suited to perform repetitive operations. It can do something
    ten, hundred or even ten thousand times. Every computer language must have features
    that instruct a computer to perform such repetitive tasks. The process of repeatedly
    executing a block of statements is known as looping. The statements in the block
    may be executed any number of times, from zero to an infinite number. If a loop
    continues forever, it is called an infinite loop. C# supports such looping features
    that enable us to develop concise programs containing repetitive processes without
    using unconditional branching statements like the goto statement.


    In looping, a sequence of statements are executed until some conditions for the
    termination of the loop are satisfied. A program loop therefore consists of two
    segments, one known as the body of the loop and the other known as the control
    statement. The control statement tests certain conditions and then directs the
    repeated execution of the statements contained in the body of the loop.


    Depending on the position of the control statement in the loop, a control structure
    may be classified either as the entry-controlled loop or as the exit-controlled
    loop. The flowcharts in Fig. 7.1 illustrate these structures. In the entry-controlled
    loop, the control conditions are tested before the start of the loop execution.
    If the conditions are not satisfied, then the body of the loop will not be executed.
    In the case of an exit controlled loop, the test is performed at the end of the
    body of the loop and therefore the body is executed unconditionally for the first
    time.


    The test conditions should be carefully stated in order to perform the desired
    number of loop executions. It is assumed that the test condition will eventually
    transfer the control out of the loop. If for some reason it does not do so, the
    control sets up an infinite loop and the body is executed over and over again.


    A looping process, in general, would include the following four steps:


    +   1. Setting and initialization of a counter.

    +   2. Execution of the statements in the loop.

    +   3. Test for a specified condition for execution of the loop.

    +   4. Incrementing the counter.


    The test may be either to determine whether the loop has been executed the specified
    number of times or to determine whether a particular condition has been met with.


    The C# language provides for four constructs for performing loop operations. They
    are:


    +   1. The while statement

    +   2. The do statement

    +   3. The for statement

    +   4. The foreach statement'
