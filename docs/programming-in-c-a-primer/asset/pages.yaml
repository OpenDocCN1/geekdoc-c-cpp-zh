  md: 'The values to the array elements can be assigned as follows:

    number[0] = 35;

    number[1] = 40;

    number[2] = 20;

    number[3] = 57;

    number[4] = 19;


    This would cause the array number to store the values shown as follows:


    | number[0] | 35 |

    | number[1] | 40 |

    | number[2] | 20 |

    | number[3] | 57 |

    | number[4] | 19 |


    These elements may be used in programs just like any other C# variable. For example,
    the following are valid statements:


    ```

    aNumber    = number[0] + 10;

    number[4]   = number[0] + number[2];

    number[2]   = x[5] + y[10];

    value[6]    = number[i] * 3;

    ```


    The subscript of an array can be integer constants, integer variables like i or
    expressions that yield integers.


    # 9.3 CREATING AN ARRAY


    Like other variables, arrays must be declared and created in the computer memory
    before they are used. Creation of an array involves three steps:


    +   1. Declaring the array

    +   2. Creating memory locations

    +   3. Putting values into the memory locations.


    # 9.3.1 Declaration of Arrays


    Arrays in C# are declared as follows:

    type[] arrayname;


    Examples:


    ```

    int[] counter;    //declare int array reference

    ```'
