  md: "# 18.12 CHECKED AND UNCHECKED OPERATORS\n\nStack overflows are usual problems\
    \ during arithmetic operations and conversion of integer types. C# supports two\
    \ operators, checked and unchecked, which can be used for checking (or unchecking)\
    \ stack overflows during program execution. If an operation is checked, then an\
    \ exception will be thrown if overflow occurs. If it is not checked, no exception\
    \ will be raised but we will lose data. For example, consider the code:\n\n```\n\
    int a = 200000\nint b = 300000\ntry\n{\n    int m = checked ( a * b );\n}\ncatch\
    \ (OverflowException e)\n{\n    Console.WriteLine (e);\n}\n```\n\nSince a*b produces\
    \ a value that will easily exceed the maximum value for an int, an overflow occurs.\
    \ As the operation is checked with operator checked, an overflow exception will\
    \ be thrown. In this case, we will get output like this:\n\nSystem.OverflowException\
    \ : An exception\nOf type System.OverflowException was\nthrown at......\n\nIf\
    \ we want to suppress the overflow checking, we can mark the code as unchecked\n\
    \n```\nint n = unchecked (a * b);\n```\n\nIn this case, no exception will be raised,\
