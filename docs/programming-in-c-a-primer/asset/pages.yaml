  md: "C# protects arrays from overruns and underruns. Trying to access an array beyond\
    \ its boundaries will generate an error message. Example:\nnumber [5] = 100; //\
    \ error!\n\nWe can also initialize arrays automatically in the same way as the\
    \ ordinary variables when they are declared, as shown below:\ntype [] arrayname\
    \ = {list of values};\n\nThe array initializer is a list of values separated by\
    \ commas and defined on both ends by curly braces. Note that no size is given.\
    \ The compiler allocates enough space for all the elements specified in the list.\n\
    \nExample:\nint[] number = {35, 40, 20, 57, 19};\n\nThe preceding line is equivalent\
    \ to:\nint [] number = new int [5] { 35, 40, 20, 57, 19 };\n\nThis combines all\
    \ the three steps, namely declaration, creation and initialization.\n\nIt is possible\
    \ to assign an array object to another. For instance,\nint[] a = {1,2,3};\nint[]\
    \ b;\nb = a;\n\nare valid in C#. Both the arrays will have the same values.\n\n\
    Every member in an array is automatically set to a default value. For example,\
    \ if we have an array of numerical type, each element is set to number 0. (See\
    \ Table 4.6)\n\nA C# array can also hold reference type elements. An array of\
    \ reference types will contain only references to the elements and not the actual\
    \ values. Reference types in an array are automatically initialized to null. Any\
    \ attempt to access an element in an array of reference types before they are\
    \ initialized will cause an error.\n\n# 9.3.4 Array Length\n\nIn C#, all arrays\
    \ are class-based and store the allocated size in a variable named Length. We\
    \ can access the length of the array a using a.Length. Example:\nint aSize = a.Length;\n\
    \nThis information will be useful in the manipulation of arrays when their sizes\
    \ are not known.\n\nLoops may be used to initialize large-size arrays. Example:\n\
