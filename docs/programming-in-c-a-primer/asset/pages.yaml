    # Specifying Multiple Response Files


    You can specify multiple response files by using the following instruction format:


    ```

    csc Resp1@rsp Resp2@rsp Resp3@rsp...... RespN@rsp

    ```


    However, if the programmer sets the same flags in different response files then
    the flag values in the successive response files override their previous counterparts.


    # csc.rsp Response File


    The C# compiler supports a built-in response file named csc.rsp that is located
    at the same location as csc.exe. It contains a default reference to a number of
    commonly utilized .NET assemblies. csc.rsp is automatically referenced by the
    C# compiler during program execution even if the programmer has specified custom
    response files.


    # E.5 GENERATING BUG REPORTS


    At times, even the simplest of errors could be pretty hard to detect during code
    development and testing. As a result, it becomes essential to assess the problem
    in a systematic manner. The generation of bug report is one such technique in
    which different aspects of a problem are recorded inside a document. The C# compiler
    option bugreport allows the programmers to generate bug reports during compile
    time.


    The report generated by the bugreport option records the following information:


    +   - List of errors generated by the compiler

    +   - Compiler and operating system version

    +   - List of flags used during compilation

    +   - List of external assemblies and modules referenced during compilation

    +   - A copy of the program source code

    +   - User-entered information about the bug


    To understand how bug reports are generated by the C# compiler, let us deliberately
    introduce a small error in the Sample.cs program, as shown below:'
