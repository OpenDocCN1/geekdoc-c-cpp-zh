  md: '# Case Study


    # Problem Statement


    Modern Engineering College provides courses for streams such as mechanical, electrical,
    electronics and civil engineering. When a student takes admission in the Modern
    Engineering College and comes to the administrative staff to pay the fees, the
    staff has to manually fill a form specifying details such as name, address, course
    and fees. A large amount of time is consumed in the filling of the form. In addition,
    the efficiency of the administrative staff also decreases as a lot time is spent
    in filling the form. The students who are taking admission in the Modern Engineering
    College have to wait for a long time in a queue for paying their fees. How can
    Modern Engineering College solve this problem of the students and the administrative
    staff?


    # Solution


    The principal of Modern Engineering College along with some of the important management
    staff conducts a meeting and tries to find the solution to the problem, which
    is being faced by the students taking admission in the college and the administrative
    staff. By the end of the meeting, the principal and the management staff come
    to the conclusion that an application must be developed for automating the task
    of entering student information such as name and address. The principal calls
    the Head of the Electronics department after a few days and asks the Head to develop
    the application. The Head of the Electronics department first conducts a requirement
    analysis through interviews with the administrative staff of the college. After
    the analysis, the Head of the Electronics Department comes to the conclusion that
    methods such as ReadLine() and WriteLine() available in C# must be used in a C#
    application for obtaining details such as name and address and displaying a message
    to confirm the admission of the student. The methods such as ReadLine() and WriteLine()
    help in receiving inputs from users and displaying output. The following C# application
    is developed by the Head of the Electronics department.


