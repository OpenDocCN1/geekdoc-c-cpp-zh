  md: '# # 8 Programming in C#


    +   1. Although C# uses .NET runtime that is similar to Java runtime, the C# compiler
    produces an executable code.

    +   2. C# has more primitive data types.

    +   3. Unlike Java, all C# data types are objects.

    +   4. Arrays are declared differently in C#.

    +   5. Although C# classes are quite similar to Java classes, there are a few
    important differences relating to constants, base classes and constructors, static
    constructors, versioning, accessibility of members etc.

    +   6. Java uses static final to declare a class constant while C# uses const.

    +   7. The convention for Java is to put one public class in each file and in
    fact, some compilers require this. C# allows any source file arrangement.

    +   8. C# supports the struct type and Java does not.

    +   9. Java does not provide for operator overloading.

    +   10. In Java, class members are virtual by default and a method having the
    same name in a derived class overrides the base class member. In C#, the base
    member is required to have the virtual keyword and the derived member is required
    to use the override keyword.

    +   11. The new modifier used for class members has no complement in Java.

    +   12. C# provides better versioning support than Java.

    +   13. C# provides static constructors for initialization.

    +   14. C# provides built-in delegates and events. Java uses interfaces and inner
    classes to achieve a similar result.

    +   15. In Java, parameters are always passed by value. C# allows parameters to
    be passed by reference by using the ref keyword.

    +   16. C# adds internal, a new accessibility modifier. Members with internal
    accessibility can be accessed from other classes within the same project, but
    not from outside the project.

    +   17. C# includes native support for properties. Java does not.

    +   18. Java does not directly support enumerations.

    +   19. Java does not have any equivalent to C# indexers.

    +   20. Both Java and C# support interfaces. But, C# does not allow type definitions
    in interfaces, while Java interfaces can have const type data.

    +   21. In Java, the switch statement can have only integer expression, while
    C# supports either an integer or string expressions.

    +   22. C# does not allow free fall through from case to case.

    +   23. C# provides a fourth type of iteration statement, foreach for quick and
    easy iterations over collections and array type data.

    +   24. Catch blocks should be ordered correctly in C#.

    +   25. C# checks overflows using checked statements.

    +   26. C# uses is operator instead of instanceof operator in Java.

    +   27. C# allows a variable number of parameters using the params keyword.

    +   28. There is no labeled break statement in C#. The goto is used to achieve
    this.


