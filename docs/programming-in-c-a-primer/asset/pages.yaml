- pgno: 485
  md: "# D.5 MARSHALLING\n\nMarshalling is the process of transferring objects from\
    \ one environment to another. Here, the environments could be application domains,\
    \ processes or machines on a network. The actual transfer of data objects is done\
    \ with the help of channels. The concept of marshalling is particularly relevant\
    \ in the context of distributed and client-server computing.\n\n+   - Marshal\
    \ by Value In this method, a copy of the object is sent to the other side of the\
    \ boundary by serializing the object into the channel. This serialization is done\
    \ with the help of the Serializable attribute.\n+   - Marshal by Reference In\
    \ this method, an object reference is created for the object to be marshalled\
    \ and is serialized into the channel. On the other side of the boundary, a proxy\
    \ is created to interact with the actual object through this reference. To marshal\
    \ an object by reference we must derive it from the MarshalByRefObject class.\n\
    \n# Marshalling Across Application Domains\n\nAn application domain is the CLR's\
    \ way of isolating the execution of applications. It is a boundary within which\
    \ an application's context lies. Application domains are created within an operating\
    \ system process. Objects in different application domains may communicate with\
    \ each other through marshalling.\n\nThe following code shows a simple application\
    \ to demonstrate the concept of marshalling across application domains:\n\n# Program\
    \ D.6 | MARSHALLING ACROSS APPLICATION DOMAINS\n\n```\n```csharp\n//AppDomain.cs\n\
    using System;\nusing System.Reflection;\npublic class AD_Test : MarshalByRefObject\n\
    {\n\tpublic void DomainName()\n\t{\n\t\tConsole.WriteLine(\"The current Application\
    \ Domain is {0}\", AppDomain.CurrentDomain.FriendlyName);\n\t}\n}\n\nclass Marshal\n\
    {\n\tpublic static void Main()\n\t{\n\t\tAD_Test ADT1 = new AD_Test();\n\t\tADT1.DomainName();\n\
    \t\tAppDomain AD = AppDomain.CreateDomain(\"2nd Application Domain\");\n\t\tAD_Test\
    \ ADT2 = (AD_Test) AD.CreateInstanceAndUnwrap(Assembly.GetExecutingAssembly().GetName(),\
    \ \"AD_Test\");\n\t\tADT2.DomainName();\n\t}\n}\n```\n```"
