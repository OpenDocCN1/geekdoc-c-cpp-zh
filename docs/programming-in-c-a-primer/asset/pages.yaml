    # 20.6 OVERVIEW OF DESIGN PATTERNS


    Design patterns form the basis of software development by specifying design and
    implementation strategies to be used during development. Each design pattern has
    its own set of advantages and limitations. Thus, the choice of a particular design
    pattern depends primarily on the requirements to be fulfilled by the application
    as well its target environment. Some of the key design patterns supported in .NET
    are


    +   - Factory

    +   - Singleton

    +   - Chain of responsibility


    # 20.6.1 Factory Design Pattern


    The Factory design pattern makes use of abstract classes and interfaces to enable
    the programmer to choose the type of objects to instantiate. As the name suggests,
    the factory interface allows the creation of different product objects, the functionality
    for which is specified during the implementation of interface methods.'
  merge: -1
  img_proc: true
- pgno: 409
  md: "The following code syntax depicts the use of factory design pattern:\n\n# Program\
