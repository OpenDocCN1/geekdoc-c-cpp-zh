    \ + \" I Division\");\n            else if (marks[i] > 49)\n                Console.WriteLine(rollNumber[i]\
    \ + \" II Division\");\n            else\n                Console.WriteLine(rollNumber[i]\
    \ + \" FAIL\");\n        }\n    }\n}\n```\n\nProgram 6.5 produces the following\
    \ output:\n\n111 Honours\n222 I Division\n333 FAIL\n444 II Division\n\n# 6.7 THE\
    \ SWITCH STATEMENT\n\nWe have seen that when one of many alternatives has to be\
    \ selected, we can design a program using if statements to control the selection.\
    \ However, the complexity of such a program increases dramatically when the alternatives\
    \ increase. The program becomes difficult to read and follow. At times, it may\
    \ confuse even the designer of the program. Fortunately, C# has a built-in multiway\
    \ decision statement known as a switch. The switch statement tests the value of\
    \ a given variable (or expression) against a list of case values and when a match\
    \ is found, a block of statements associated with that case is executed. The general\
    \ form of the switch statement is as shown below:\n\n```\nswitch(expression)\n\
    {\n    case value-1:\n        block-1\n        break;\n}\n```"
