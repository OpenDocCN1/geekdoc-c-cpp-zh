  md: '# 2.4.4 Managed Code


    As we know, the CLR is responsible for managing the execution of code compiled
    for the .NET platform. The code that satisfies the CLR at runtime in order to
    execute is referred to as managed code. Compilers that are compatible to the .NET
    platform generate managed code. For example, the C# compiler generates managed
    code. The managed code generated by C# and other compilers capable of generating
    managed code) is IL code. The IL code is then converted ... by the JIT compilers.


    # 2.5 FRAMEWORK BASE CLASSES


    .NET supplies a library of base classes that we can use to implement applications
    quickly. We can use them by simply instantiating them and invoking their methods
    or by inheriting them through derived classes, thus extending their functionality.


    Much of the functionality in the base framework classes resides in the vast namespace
    called System. We can use the base classes in the system namespace for many different
    tasks including:


