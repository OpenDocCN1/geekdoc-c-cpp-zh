    Like C#, Java was also derived from C++ and therefore they have similar roots.
    Moreover, C# was developed by Microsoft as an alternative to Java for web programming.
    C# has borrowed many good features from Java, which has already become a popular
    Internet language. However, there exist a number of differences between C# and
    Java:'
