- pgno: 29
  md: 'Third-party .NET services will provide opportunities to a vast range of developers
    and users to produce corporate and vertical services using .NET platform.


    # 2.2 THE ORIGINS OF .NET TECHNOLOGY


    Before going into the details of .NET features further, we shall see how the concept
    of .NET was evolved over the past ten years. The current technology of .NET has
    gone through three significant phases of development:


    +   - OLE technology

    +   - COM technology

    +   - .NET technology


    These developments that took place during the 1990s are illustrated in Fig. 2.2.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_29_0.png)


    # 2.2.1 OLE Technology


    OLE (Object Linking and Embedding) technology was developed by Microsoft in the
    early 1990s to enable easy interprocess communications. OLE provided support to
    achieve the following:


    +   - To embed documents from one application into another application

    +   - To enable one application to manipulate objects located in another application


    This enabled users to develop applications which required inter-operability between
    various products such as MS Word and MS Excel.


    # 2.2.2 COM Technology


    Till the advent of COM technology, the monolithic approach had been used for developing
    software. But when programs become too large and complex, the monolithic approach
    leads to a number of problems in terms of maintainability and testing of software.
    To overcome these problems, Microsoft introduced the component-based model for
    developing software programs. In the component-based approach, a program is broken
    into a number of independent components where each one offers a particular service.
    Each component can be developed and tested independently and then integrated it
    into the main system. This technology is known as the Component Object Model (COM)
    and the software built using COM is referred to as componentware.


    COM technology offers a number of benefits to developers and users. It


    +   - reduces the overall complexity of software

    +   - enables distributed development across multiple organizations or departments
    and

    +   - enhances software maintainability


    # 2.2.3 .NET Technology


    .NET technology is a third-generation component model. This provides a new level
    of interoperability compared to COM technology. COM provides a standard binary
    mechanism for intermodule communication. This mechanism is replaced by an intermediate
    language called Microsoft Intermedia Language (MSIL) or simply IL in the .NET
    technology. Various .NET-language compilers'
