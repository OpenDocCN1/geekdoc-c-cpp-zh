- pgno: 386
  md: "Synchronisation of threads means coordinating the access to resources for different\
    \ threads running for execution. To synchronise the threads, we can either block\
    \ a thread till the time another thread has completed its tasks or lock access\
    \ to a resource. The Thread class provides methods such as Spinwait and Suspend\
    \ that help block a thread for a specific time period. In C#, we can use the lock\
    \ keyword to lock access to a resource for a specific thread. The lock keyword\
    \ marks a block of C# program statement as a critical section by first obtaining\
    \ a mutually exclusive lock for an object. After obtaining the lock, the program\
    \ statements are executed. When the program statements have been executed, the\
    \ mutually exclusive lock is released. The syntax for using the lock keyword is:\n\
    \n```\nlock(obj) // obj is the object being synchronised\n{\n    //set of statements\
    \ to be synchronised\n}\n```\n\nProgram 19.4 shows how to use the lock keyword\
    \ and Sleep method for thread synchronisation.\n\n# Program 19.4    SYNCHRONISING\
    \ THREADS\n\n```\nusing System;\nusing System.Threading;\n\nclass ABC\n{\n   \
    \ private object thislock = new object();\n    public void A()\n    {\n      \
    \  Console.WriteLine(\"Starting \" + Thread.CurrentThread.Name.ToString());\n\
    \        int x = 10, z = 30;\n        int sum=0;\n        lock (thislock)\n  \
    \      {\n            sum = x + z;\n            Console.WriteLine(sum);\n    \
    \    }\n        Thread.Sleep(5000);\n        Console.WriteLine(Thread.CurrentThread.Name.ToString()\
    \ + \" is stopped\");\n    }\n}\n\npublic class SyncExp\n{\n    public static\
    \ void Main()\n    {\n        ABC a1 = new ABC();\n        Thread t1 = new Thread(new\
    \ ThreadStart(a1.A));\n        Thread t2 = new Thread(new ThreadStart(a1.A));\n\
    \        t1.Name = \"T1\";\n        t2.Name = \"T2\";\n        t1.Start();\n \
    \       t2.Start();\n    }\n}\n```"
