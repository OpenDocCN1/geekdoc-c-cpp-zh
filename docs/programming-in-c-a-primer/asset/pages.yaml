    A PRIMER


    # Third Edition


    This revised edition maintains the lucid flow and continuity that have been hallmarks
    of this book. This book takes the student through a step-by-step process, starting
    from simple programming problems to more complex and difficult ones. The content
    of this new edition has been enriched with the inclusion of new topics, projects
    and sample programs and offers hands-on practice to students at developing real-life
    C# applications.


    # Salient Features


    +   - Expanded coverage of Debugging

    +   - Coverage of Winforms

    +   - Case studies at the end of each chapter — more than 20 case studies in the
    book

    +   - Three new projects — 1 major project (Voting Control for Asp.Net) and 2
    minor projects (Project Planner and Task Actions)

    +   - Two new appendices — The CLR and .Net Framework and Building C# Applications

    +   - Excellent pedagogical features


    +   - Over 100 Example Programs

    +   - Over 350 Review Questions

    +   - Over 150 Programming Exercises

    +   - Over 40 Debugging Exercises


    URL: http://www.mhhe.com/balagurusamy/csharp3e'
