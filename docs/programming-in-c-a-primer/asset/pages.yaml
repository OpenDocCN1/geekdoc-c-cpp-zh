- pgno: 219
  md: "```\nRed      = 1,\nBlue     = Red + 2,\nGreen    = Red + Blue + 3,\nYellow\
    \   = Blue + 2\n}\n```\n\nIf the declaration of an enum member has no initializer,\
    \ then its value is set implicitly as follows:\n\n+   - If it is the first member,\
    \ its value is zero.\n+   - Otherwise, its value is obtained by adding one to\
    \ the value of the previous member\n\nConsider the following enum declaration:\n\
    \n```\nenum Alphabet\n{\n    A,\n    B = 5,\n    C,\n    D = 20,\n    E\n}\n```\n\
    \nThe member A is set to zero. Since the member B is explicitly given the value\
    \ 5, the value of C is set to 6 (i.e, 5 + 1). Similarly, E is set to 21.\n\nThe\
    \ following enum declaration is not valid because the declarations are circular.\n\
    \n```\nenum ABC\n{\n    A,\n    B = C,\n    C\n}\n```\n\n# 11.8 ENUMERATOR BASE\
    \ TYPES\n\nBy default, the type of an enum is int. However, we can declare explicitly\
    \ a base type for each enum.\n\nThe valid base types are:\n\nbyte, sbyte, short,\
    \ ushort, int, uint, long and ulong\n\nExamples:\n\n```\nenum Position : byte\n\
    {\n    off,\n    on\n}\n```\n\n```\nenum Shape : long\n{\n    Circle,\n    Square\
    \ = 100,\n    Triangle\n}\n```\n\nThe values assigned to the members must be within\
    \ the range of values that can be represented by the base type. For example, if\
    \ the base type is byte, assigning a value 300 is illegal."
