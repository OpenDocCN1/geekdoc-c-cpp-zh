  md: '# 5


    # Operators and Expressions


    # 5.1 Introduction


    An operator is a symbol that tells the computer to perform certain mathematical
    or logical manipulations. Operators are used in programs to manipulate data and
    variables. They usually form a part of mathematical or logical expressions.


    C# supports a rich set of operators. C# operators can be classified into a number
    of related categories as below:


    +   1. Arithmetic operators

    +   2. Relational operators

    +   3. Logical operators

    +   4. Assignment operators

    +   5. Increment and decrement operators

    +   6. Conditional operators.

    +   7. Bitwise operators

    +   8. Special operators


    # 5.2 ARITHMETIC OPERATORS


    C# provides all the basic arithmetic operators. They are listed in Table 5.1.
    The operators +, -, * and / all work the same way as they do in other languages.
    These can operate on any built-in numeric data type. We cannot use these operators
    on Boolean type. The unary minus operator, in effect, multiplies its single operand
    by -1. Therefore, a number preceded by a minus sign changes its sign.


    Arithmetic operators are used as shown below:


    a - b   a + b

    a * b   a / b

    a % b   -a * b


    Here a and b may be variables or constants and are known as operands.


    # Table 5.1 Arithmetic operators


    | OPERATOR | MEANING |

    |---|---|

    | + | Addition or unary plus |

    | - | Subtraction or unary minus |

    | * | Multiplication |

    | / | Division |

    | % | Modulo division |


    # 5.2.1 Integer Arithmetic


    When both the operands in a single arithmetic expression such as a+b are integers,
    the expression is called an integer expression, and the operation is called integer
    arithmetic. Integer arithmetic always yields an integer value. In the above examples,
    if a and b are integers, then for a = 14 and b = 4 we have the following results:


    a - b = 10

    a + b = 18

    a * b = 56'
