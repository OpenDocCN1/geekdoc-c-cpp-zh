    \t\t....\n\t}\n}\n```\n\n+   - m as a static variable\n+   - n as an instance\
    \ variable\n+   - x as a value parameter\n+   - y as a reference parameter\n+\
    \   - z as an output parameter\n+   - a[0] as an array element\n+   - j as a local\
    \ variable\n\nStatic and instance variables are declared at the class level and\
    \ are known as field or field variables. The scope of these variables begins at\
    \ the place of their declaration and ends when the Main method terminates.\n\n\
    The variables x, y and z are parameters of the method fun(). The value parameter\
    \ x will exist till the end of the method. The reference and output parameters\
    \ (y and z) do not have their own storage locations. Instead, they represent the\
    \ same storage locations as the variables that are passed as arguments. The scope\
    \ of these variables is always the same as the underlying variables.\n\nThe elements\
