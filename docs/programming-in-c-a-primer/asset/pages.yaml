- pgno: 250
  md: '# 13.5.3 Accessibility of Baseclass Members


    When a class inherits from a base class. all members of the base class, except
    constructor and destructors, are inherited and become members of the derived class.
    The declared accessibility of a base class member has no control over its inheritability.
    However, an inherited member may not be accessible in a derived class, either
    because of its declared accessibility or because it is hidden by a declaration
    in the class itself.


    ```

    class A

    {

    private int x ;

    protected int y ;

    public int z ;

    }

    ```


    ```

    class B : A

    {

    public void SetXYZ ()

    {

    x = 10; // Error; x is not accessible

    y = 20; // ok

    z = 30; // ok

    }

    }

    ```


    Note that although B inherits the private member x from A, it is not accessible
    in B. However, the protected and public members of A are accessible in the subclass
    B. But as far as the users of the classes are concerned, protected is private.
    Therefore, the following is illegal:


    ```

    A a = new A (); //object of A

    a.y = 5; //error! an object cannot access protected data

    a.z = 10; // ok

    ```


    # 13.5.4 Accessibility Constraints


    C# imposes certain constraints on the accessibility of members and classes when
    they are used in the process of inheritance.


    +   - The direct base class of a derived class must be at least as accessible
    as the derived class itself.

    +   - Accessibility domain of a member is never larger than that of the class
    containing it.

    +   - The return type of method must be at least as accessible as the method itself.


    ```

    class A

    {

    ....

    }

    public class B : A

    {

    ....

    }

    ```


    is illegal because A is ''internal'' by default and B is public. A should be at
    least as accessible as B.


    Consider another example:'
