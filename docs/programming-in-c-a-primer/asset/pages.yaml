  md: "The sealed method Fun() overrides the virtual method Fun() defined in Class\
    \ A. Any derived class of B cannot further override the method Fun().\n\n# 13.15\
    \ POLYMORPHISM\n\nAs discussed earlier in Chapter 12, polymorphism means 'one\
    \ name, many forms'. Essentially, polymorphism is the capability of one object\
    \ to behave in multiple ways. Polymorphism can be achieved in two ways as shown\
    \ in Fig. 13.8. C# supports both of them.\n\n# 13.15.1 Operation Polymorphism\n\
    \nOperation polymorphism is implemented using overloaded methods and operators.\
    \ We have already used the concept of overloading while discussing methods and\
    \ constructors. The overloaded methods are 'selected' for invoking by matching\
    \ arguments, in terms of number, type and order. This information is known to\
    \ the compiler at the time of compilation and, therefore, the compiler is able\
    \ to select and bind the appropriate method to the object for a particular call\
    \ at compile time itself. This process is called early binding, or static binding,\
    \ or static linking. It is also known as compile time polymorphism.\n\n![](img/bae4ee2c7c29c052feb3b9a9c5659998_262_0.png)\n\
    \nFig. 13.8 Achieving polymorphism\n\nEarly binding simply means that an object\
    \ is bound to its method call at compile time. Program 13.6 shows how the compile\
    \ time polymorphism is achieved using the concept of overloading. As we know,\
    \ with overloading, multiple methods with the same name are created. However,\
    \ the parameters on each method vary. When an object makes a method call using\
    \ the method name, the method that matches the calling signature is invoked.\n\
    \n# Program 13.6 OPERATION POLYMORPHISM\n\n```\nusing System;\nclass Dog\n{\n\
    }\nclass Cat\n{\n}\nclass Operation\n{\n    static void Call (Dog d)\n    {\n\
    \        Console.WriteLine (\"Dog is called\");\n    }\n    static void Call (Cat\
    \ c)\n    {\n        Console.WriteLine (\" Cat is called \");\n    }\n}\n```"
