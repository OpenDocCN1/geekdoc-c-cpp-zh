  md: "# 14\n\n# Interface: Multiple Inheritance\n\n# 14.1 Introduction\n\nIn Chapters\
    \ 12 and 13, we discussed the various features of classes and how they can be\
    \ inherited by other classes. We also learned about various forms of inheritance\
    \ and pointed out that C# does not support multiple inheritance. That is, classes\
    \ in C# cannot have more than one superclass. For instance, a definition like\n\
    \n```\nClass A : B, C\n{\n    ....\n    ....\n}\n```\n\nis not permitted in C#.\
    \ However, the designers of C# could not overlook the importance of multiple inheritance.\
    \ A large number of real-life applications require the use of multiple inheritance\
    \ whereby we inherit methods and properties from several distinct classes. Since\
    \ ‘C++ - like’ implementation of multiple inheritance proves difficult and adds\
    \ complexity to the language, C# provides an alternate approach known as interface\
    \ to support the concept of multiple inheritance. Although a C# class cannot be\
    \ a subclass of more than one superclass, it can implement more than one interface,\
    \ thereby enabling us to create classes that build upon other classes without\
    \ the problems created by multiple inheritance.\n\nAn interface in C# is a reference\
    \ type. It is basically a kind of class with some differences. Major differences\
    \ include:\n\n+   - All the members of an interface are implicitly public and\
    \ abstract.\n+   - An interface cannot contain constant fields, constructors and\
    \ destructors.\n+   - Its members cannot be declared static.\n+   - Since the\
    \ methods in an interface are abstract, they do not include implementation code.\n\
    +   - An interface can inherit multiple interfaces.\n\n# 14.2 DEFINING AN INTERFACE\n\
    \nAn interface can contain one or more methods, properties, indexers and events\
    \ but none of them are implemented in the interface itself. It is the responsibility\
    \ of the class that implements the interface to define the code for implementation\
    \ of these members.\n\nThe syntax for defining an interface is very similar to\
    \ that used for defining a class. The general form of an interface definition\
    \ is:\n\n```\ninterface InterfaceName\n{\n```"
