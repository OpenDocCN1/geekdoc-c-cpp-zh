    | ReleaseMutex | To release a mutex once. |\n| SetAccessControl | To set the access\
    \ control security for a specified mutex. |\n\n# 19.3 CREATING AND STARTING A\
    \ THREAD\n\nA thread can be created in C# using the constructor of the Thread\
    \ class. We need to pass the ThreadStart delegate to the Thread class constructor\
    \ along with the name of the method from which the execution should start. The\
    \ ThreadStart delegate is defined as:\npublic delegate void ThreadStart();\nTo\
    \ create a new thread in a C# program, we can use the following statement:\nThread\
    \ threadname = new Thread(new ThreadStart(methodname));\nHere, threadname represents\
    \ the name of the new thread and methodname is the name of the method from which\
    \ the execution starts.\nFor example, to create a thread t1, we can use the following\
    \ code:\nThread t1 = new Thread(new ThreadStart(First));\nIf the method from which\
    \ execution needs to start is defined in a class other than the class in which\
    \ the thread is created then we must use an object of that class to access the\
    \ method. The Start() method of the Thread class starts a new thread. Program\
    \ 19.1 illustrates how a thread is created and executed.\n\n# Program 19.1 CREATING\
