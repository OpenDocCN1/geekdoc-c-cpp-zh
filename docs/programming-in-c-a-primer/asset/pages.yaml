    # E.9 — AN INTERESTING ASIDE: THE SYSTEM.ENVIRONMENT CLASS


    As the name suggests, the System.Environment class helps obtain information pertaining
    to the current working environment. This information may include platform information,
    operating system version, .NET Framework version, environment variable values,
    etc. We can use the various members of the Environment class for retrieving for
    retrieving information pertaining to the current working environment. Some of
    the important members of the System.Environment class are the following:


    +   - GetCommandLineArgs: Retrieves the command-line arguments of the current
    process.

    +   - GetEnvironmentVariable: Retrieves the value assigned to the specified environment
    variable.

    +   - GetLogicalDrives: Retrieves a list of logical drives on the computer.

    +   - CurrentDirectory: Retrieves the complete path of the current working directory.

    +   - MachineName: Retrieves the NetBIOS name of the computer.

    +   - OSVersion: Retrieves the version of the current operating system.

    +   - UserName: Retrieves the user name that is currently logged onto the computer.

    +   - StackTrace: Retrieves the latest stack trace.


    The following is a sample program that uses members of the System.Environment
    class for retrieving environment information.


    # Program E.3 RETRIEVING ENVIRONMENT INFORMATION


    ```

    //Using System.Environment class

    using System;

    class Env

    {

    ```'
