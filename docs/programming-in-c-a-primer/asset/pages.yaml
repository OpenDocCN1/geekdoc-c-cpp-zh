    # 5.4 LOGICAL OPERATORS


    In addition to the relational operators, C# has six logical operators, which are
    given in Table 5.4.


    The logical operators && and || are used when we want to form compound conditions
    by combining two or more relations. An example is:

    a > b && x == 10


    An expression of this kind which combines two or more relational expressions is
    termed as a logical expression or a compound relational expression. Like the simple
    relational expressions, a logical expression also yields a value of true or false,
    according to the truth table shown in Table 5.5. The logical expression given
    above is true only if both a>b and x == 10 are true. If either (or both) of them
    are false, the expression is false.


    Note:


    +   - op-1 && op-2 is true if both op-1 and op-2 are true and false otherwise.

    +   - op-1 || op-2 is false if both op-1 and op-2 are false and true otherwise.


    | Operator | Meaning |

    |---|---|

    | && | logical AND |

    | || | logical OR |

    | ! | logical NOT |

    | & | bitwise logical AND |

    | | | bitwise logical OR |

    | ^ | bitwise logical exclusive OR |


    # Table 5.4 Logical operators


    # Table 5.5 Truth table


    | op-1 | op-2 | Value of the Expression |

    |---|---|---|

    | | | op-1 && op-2 | op-1 || op-2 |

    | true | true | true | true |

    | true | false | false | true |

    | false | true | false | true |

    | false | false | false | false |'
