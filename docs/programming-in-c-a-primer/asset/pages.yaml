- pgno: 489
  md: '# # Appendix E


    # Building C# Applications




    There are a number of methods of building C# applications on the .NET Framework.
    While some of these methods ensure a programmer''s efficiency through a comprehensive
    and robust development environment, such as Visual Studio IDE; other methods,
    such as csc.exe and other command line tools serve an entirely different purpose
    of experiencing program control at ground level.


    In this appendix, we will learn how to build and debug C# applications at the
    command line.




    C-Short compiler or csc.exe is a command line tool offered by the .NET Framework
    that allows you to build C# applications at the command prompt. While the mere
    knowledge of a .NET IDE is sufficient enough for a programmer to successfully
    build and deploy C# applications: it is at times advisable to learn how to manually
    build and debug the C# applications at the command line.


    Some of the advantages of building C# applications at command line are the following:


    +   - It helps a programmer explore the underlying mechanism of program execution
    on the .NET platform.

    +   - It helps a programmer directly interact with the execution engine (csc.exe)
    without the intermediary IDE.

    +   - By making use of debugging tools like cordbg.exe, one can explore how debugging
    is performed at command line.

    +   - It helps a programmer to perform certain exclusive tasks, such as generation
    of multi-file assemblies, which are otherwise not supported by Visual Studio.

    +   - Only the .NET SDK is sufficient enough to build C# applications and it is
    not required to install a full fledged IDE like Visual Studio.


    The C# compiler can be initiated by typing the csc.exe command at the command
    prompt. But, before we start using the C# compiler, we need to set the environment
    path variable appropriately so that csc.exe can be executed from any subdirectory
    at the command line.




    To set the environment path variable, you need to perform the following steps:


    +   1. Right click the My Computer icon on the desktop to display a shortcut menu.'
