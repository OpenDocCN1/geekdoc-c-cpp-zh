  md: '# Programming in C#


    A C# program may contain multiple class definitions. Classes are the primary and
    essential elements of a C# program. These classes are used to map the objects
    of real-world problems. The number of classes depends on the complexity of the
    problem.


    Since every C# application program requires a Main method as its starting point,
    the class containing the Main is the essential part of the program. A simple C#
    program may contain only this part. The Main method creates objects of various
    classes and establishes communications between them. On reaching the end of Main,
    the program terminates and the control passes back to the operating system.


    # 3.15 PROGRAM CODING STYLE


    C# is a freeform language. We need not indent any lines to make the program work
    properly. C# does not care where on the line we begin coding. While this may be
    a license for bad programming, we should try to use this fact to our advantage
    for designing readable programs. Although several alternative styles are possible,
    we should select one and try to use it consistently.


    ```

    System.Console.WriteLine("Hello!");

    ```


    can be written as


    ```

    System.Console.WriteLine

    ("Hello!");

    ```


    or, even as


    ```

    System.Console.WriteLine

    (

    "Hello!"

    );

    ```


    In this book, we normally follow the format used in the sample programs given
    in this chapter.


    # Case Study


    # Problem Statement


    AUPart Enterprise is a manufacturing unit that is involved in the manufacturing
    of automobile parts. This company was established in 1980 and since then the staff
    of AUPart has been manually keeping the records of manufacturing parts. Now, it
    has been discovered by the management of AUPart Enterprise that manual record-keeping
    results in the occurrence of a large number of errors. In addition, it has also
    been discovered that manually keeping records of manufactured parts is time consuming.
    How can the management of AUPart Enterprise automate the task of maintaining records
    of manufactured parts?


    # Solution


    After much research, the management of AUPart Enterprise comes to the conclusion
    that an application created in a high level programming language such as C# is
    needed to automate the task of maintaining the records of manufactured parts.
    Quick Soft Solutions Private Limited, which is a software development company,
    is contacted by AUPart Enterprise to develop the application for automating the
    task of maintaining the records of manufactured parts. The team of programmers
    at Quick Soft Solutions Private Limited first conducted an interview with the
    staff of AUPart Enterprise to find out their requirements. After requirement analysis,
    it was decided by the programmers at Quick Soft Solutions Private Limited that
    C# features such as constructors and variables must be used in the application
    for automating the task of keeping records of manufactured parts as illustrated
    below.'
