    \ like:\n\n```\nif (s1 == s2)\n    Console.WriteLine(\"They are qual\");\n```\n\
    \n# 10.6 FINDING SUBSTRINGS\n\nIt is possible to extract substrings from a given\
    \ string using the overloaded Substring method available in String class. There\
    \ are two version of Substring:\n\n+   - s.Substring(n)\n+   - s.Substring(n1,\
    \ n2)\n\nThe first one extracts a substring starting from the nth position to\
    \ the last character of the string contained in s. The second one extracts a substring\
    \ from s beginning at n1 position and ending at n2 position. Examples:\n\n```\n\
    string s1 = \"NEW YORK\";\nstring s2 = s1.Substring(5);\nstring s3 = s1.Substring(0,3);\n\
    string s4 = s1.Substring(5,8);\n```\n\nWhen executed, the string variables will\
    \ contain the following substrings:\n\n+   s2: YORK\n+   s3: NEW\n+   s4: YORK\n\
    \n# 10.7 MUTABLE STRINGS\n\nMutable strings that are modifiable can be created\
    \ using the StringBuilder class. Examples:\n\n```\nStringBuilder str1 = new StringBuilder(\"\
    abc\");\nStringBuilder str2 = new StringBuilder();\n```\n\nThe string object str1\
    \ is created with an initial size of three characters and str2 is created as an\
    \ empty string. They can grow dynamically as more characters are added to them.\
    \ They can grow either unbounded or up to a configurable maximum. Mutable strings\
    \ are also known as dynamic strings.\n\nThe StringBuilder class supports many\
    \ methods that are useful for manipulating dynamic strings. Table 10.2 lists some\
    \ of the most commonly used methods."
