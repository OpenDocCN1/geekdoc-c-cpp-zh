  md: 'A C# class can have one of the two visibility modifiers: **public** or **internal**.
    If we do not explicitly mark the visibility modifier of a class, it is implicitly
    set to ‘internal’; that is, by default all classes are **internal**. Internal
    classes are accessible within the same program assembly and are not accessible
    from outside the assembly.


    Classes marked **public** are accessible everywhere, both within and outside the
    program assembly. All the classes contained in the .NET Class Framework are marked
    **public** so as to enable all developers to have access to them and use them
    for configuring applications and services.


    Although classes are normally marked either **public** or **internal**, a class
    may also be marked **private** when it is declared as a member of another class.
    In such cases, the class behaves like a member of the enclosing class and therefore
    the modifiers applicable to class members are also applicable to it.


    # 13.5.2 Class Members Visibility


    As mentioned in the previous chapter, a class member can have any one of the five
    visibility modifiers:


    +   - public

    +   - private

    +   - protected internal

    +   - protected

    +   - internal


    Except for the **protected internal** combination, it is an error to specify more
    than one access modifier. When no modifier is specified, it defaults to **private**
    accessibility. Table 13.1 shows how the visibility modifiers control the visibility
    of members in a program.


    # Table 13.1 Visibility of class members


    | KEYWORD | VISIBILITY | | | |

    | | CONTAINING CLASSES | DERIVED CLASSES | CONTAINING PROGRAM | ANYWHERE OUTSIDE
    THE CONTAINING PROGRAM |

    | Private | ✓ |  |  |  |

    | protected | ✓ | ✓ |  |  |

    | Internal | ✓ |  | ✓ |  |

    | protected internal | ✓ | ✓ | ✓ |  |

    | Public | ✓ | ✓ | ✓ | ✓ |


    It is important to remember that the accessibility domain of a member is never
    larger than that of the class containing it. Table 13.2 gives the visibility domain
    of members under different combinations of class access specifiers.


    # Table 13.2 Accessibility domain of class members


    | MEMBER MODIFIER | MODIFIER OF THE CONTAINING CLASS | | |

    | | PUBLIC | INTERNAL | PRIVATE |

    | public | Everywhere | only program | only class |

    | internal | only program | only program | only class |

    | private | only class | only class | only class |'
  merge: -1
