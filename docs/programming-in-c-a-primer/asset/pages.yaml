- pgno: 105
  md: "# 6.6 THE ELSE IF LADDER\n\nOutput of Program 6.4:\nLargest value is : 712\n\
    \nThere is another way of putting ifs together when multipath decisions are involved.\
    \ A multipath decision is a chain of ifs in which the statement associated with\
    \ each else is an if. It takes the following general form:\nThis construct is\
    \ known as the else if ladder. The conditions are evaluated from the top (of the\
    \ ladder), downwards. As soon as the true condition is found, the statement associated\
    \ with it is executed and the control is transferred to the statement-x (skipping\
    \ the rest of the ladder). When all the n conditions become false, then the final\
    \ else containing the default-statement will be executed. Figure 6.5 shows pictorially\
    \ the logic of execution of else if ladder statements.\n\nLet us consider an example\
    \ of grading the students in an academic institution. The grading is done according\
    \ to the following rules:\n\n```\nif (condition 1)\n    statement-1;\nelse if\
    \ (condition 2)\n    statement-2;\nelse if (condition 3)\n    statement-3;\nelse\
    \ if (condition n)\n    statement-n;\nelse\n    default-statement;\nstatement-x;\n\
    ```\n\n| AVERAGE MARKS | GRADE |\n|---|---|\n| 80 to 100 | Honours |\n| 60 to\
    \ 79 | First Division |\n| 50 to 59 | Second Division |\n| 40 to 49 | Third Division\
    \ |\n| 0 to 39 | Fail |\n\nThis grading can be done using the else if ladder as\
    \ follows:\n\n```\nif(marks > 79)\n    grade = \"Honours\";\nelse if(marks > 59)\n\
    \    grade = \"First Division\";\nelse if(marks > 49)\n    grade = \"Second Division\"\
    ;\nelse if(marks > 39)\n    grade = \"Third Division\";\nelse\n    grade = \"\
    Fail\";\nConsole.WriteLine(\"Grade: \" + grade);\n```\n\nConsider another example\
    \ given below:\n\n```\nif (code == 1)\n    colour = \"RED\";\nelse if (code ==\
    \ 2)\n```"
