- pgno: 317
  md: 'The delegate instance holds the reference to delegate methods. The instance
    is used to invoke the methods indirectly.


    An important feature of a delegate is that it can be used to hold reference to
    a method of any class. The only requirement is that its signature must match the
    signature of the method.


    # 16.3 DELEGATE DECLARATION


    A delegate declaration is a type declaration and takes the following general form:

    modifier delegate return-type delegate-name ( parameters);


    delegate is the keyword that signifies that the declaration represents a class
    type derived from System.Delegate. The return-type indicates the return type of
    the delegate. Parameters identifies the signature of the delegate. The delegate-name
    is any valid C# identifier and is the name of the delegate that will be used to
    instantiate delegate objects.


    The modifier controls the accessibility of the delegate. It is optional. Depending
    upon the context in which they are declared, delegates may take any of the following
    modifiers:


    +   - new

    +   - protected

    +   - private

    +   - public

    +   - internal


    The new modifier is only permitted on delegates declared within another type.
    It signifies that the delegate hides an inherited member by the same name.


    Some examples of delegates are:


    ```

    delegate void SimpleDelegate();

    delegate int MathOperation(int x, int y);

    public delegate int CompareItems(object o1, object o2);

    private delegate string GetAString();

    delegate double DoubleOperation(double x);

    ```


    Although the syntax is similar to that of a method definition (without method
    body), the use of keyword delegate tells the compiler that it is the definition
    of a new class using the System.Delegate as the base class. Since it is a class
    type, it can be defined in any place where a class definition is permitted. That
    is, a delegate may be defined in the following places:


    +   - Inside a class

    +   - Outside all classes

    +   - As the top level object in a namespace


    Depending on how visible we want the delegate to be, we can apply any of the visibility
    modifiers to the delegate definition.


    Delegate types are implicitly sealed and therefore it is not possible to derive
    any type from a delegate type. It is also not permissible to derive a non-delegate
    class type from System.Delegate.


    # 16.4 DELEGATE METHODS


    The methods whose references are encapsulated into a delegate instance are known
    as delegate methods or callable entities. The signature and return type of delegate
    methods must exactly match the signature and return type of the delegate.


    One feature of delegates, as pointed out earlier, is that they are type-safe to
    the extent that they ensure the matching of signatures of the delegate methods.
    However, they do not care


    +   - what type of object the method is being called against, and

    +   - whether the method is a static or an instance method.'
