  md: '# # 19 Multithreading in C#




    C# supports the concept of multithreading which enables us to execute two or more
    “parts” of a program concurrently. Each part is known as a “thread”. A thread
    is basically a separate sequence of instructions designed for performing a “specific
    task” in the program. A task may represent an operation such as reading data,
    sending a file over the Internet, printing some results or performing certain
    calculations. Multithreading, therefore, means performing multiple tasks at the
    same time during the execution of a program.


    The main advantage of multithreading is that it enables us to develop efficient
    programs that could optimize the use of computer resources such as memory, I/O
    devices and time.


    C# defines a namespace known as System.Threading containing classes and interfaces
    that are required for developing and running multithreaded programs. We must,
    therefore, include the statement using System.Threading; at the start of any multithreaded
    program.




    +   - Thread

    +   - Monitor

    +   - ThreadPool

    +   - Mutex




    The Thread class helps us to perform tasks such as creating and setting the priority
    of a thread. We can use this class to control a thread and obtain its status.


    The Thread class provides various properties that allow us to perform tasks such
    as obtaining the status of a thread and specifying a name for the thread. Table
    19.1 shows some of the important properties contained in the Thread class.'
