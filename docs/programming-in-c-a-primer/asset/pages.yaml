    if we closely look at the output form in Figure 20.1, we can see that there are
    three default buttons or controls on the title bar. These are: Maximize, Minimize
    and Close. Thus, as soon as the user clicks any one of these buttons, an event
    is raised and the corresponding event handling code is executed. In fact, this
    is the only way for us to bring an end to the program and break its loop.


