    # Creating the Website2 Web-based Application


    Website2 Web-based application is also an ASP.NET Web site that contains a single
    page Default.aspx page. This is a web application in C# using ASP.NET and uses
    labels, button, textbox, dropdownlist controls. The form validates if the name
    and the city are inputted. If the user has entered the required information, the
    program displays it on the same page. To create the Website2 Web-based application:


    +   - Create the Default.aspx page.

    +   - Add code to Default.aspx page.


    # Creating the Default.aspx Page


    The Default.aspx page allows a user to enter a name and select a city. After the
    user clicks a button, the entered values are displayed in the Default.aspx page.
    To create the Default.aspx page:


    +   1. Open the Microsoft Visual Studio IDE.

