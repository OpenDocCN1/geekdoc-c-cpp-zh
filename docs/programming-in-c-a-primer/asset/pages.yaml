    # 8.11 METHODS OVERLOADING


    C# allows us to create more than one method with the same name, but with the different
    parameter lists and different definitions. This is called method overloading.
    Method overloading is used when methods are required to perform similar tasks
    but using different input parameters.


    Overloaded methods must differ in number and/or type of parameters they take.
    This enables the compiler to decide which one of the definitions to execute depending
    on the type and number of arguments in the method call. Note that the method''s
    return type does not play any role in the overload resolution.


    Using the concept of method overloading, we can design a family of methods with
    one name but different argument lists. For example, an overloaded add( ) method
    handles different types of data as shown below:


    ```

    // Method definitions

    int add ( int a, int b ) { ... } //Method1

    int add ( int a, int b, int c ) { ... } //Method2

    double add ( float x, float y ) { ... } //Method3

    double add ( int p, float q ) { ... } //Method4

    double add ( float p, int q ) { ... } //Method5

    ```


    ```

    //Method calls

    int m = add ( 5, 10 ); //calls method1

    double x = add ( 15, 5.0F ); //calls method4

    double x = add ( 1.0F, 2.0F ); //calls method3

    int m = add ( 5, 10, 15 ); //calls method2

    double x = add ( 2.0F, 10 ); //calls method5

    ```


    +   1. The compiler tries to find an exact match in which the types of actual
    parameters are the same and uses that method.

    +   2. If the exact match is not found, then the compiler tries to use the implicit
    conversions to the actual arguments and then uses the method whose match is unique.
    If the conversion creates multiple matches, then the compiler will generate an
    error message.


    Program 8.9 illustrates method overloading.'
