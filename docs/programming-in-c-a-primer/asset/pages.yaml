  md: '# Custom Attributes


    As already explained, custom attributes are the user-defined attributes used for
    adding custom information to the targets. To create a custom attribute you need
    to first create the corresponding class derived from the System.Attribute class.
    Then, you need to specify the types of targets that are associated with the custom
    attribute. This is done with the help of another attribute called AttributeUsage.
    Finally, you can use the newly created custom attribute just like the pre-defined
    .NET attributes.


    To understand the concept of custom attributes with the help of an example, let
    us consider a scenario where you are required to identify all those classes and
    methods in your application that meet certain predefined coding conventions. You
    decide to create a custom attribute named CodeChecked to tag all those classes
    and methods that are compliant with the coding conventions. The following code
    modifies the previous ConsoleApplication1.cs program to create and use CodeChecked
    attribute:


    # Program D.2


    # USING CODE CHECKED ATTRIBUTE


    ```

    //ConsoleApplication2.cs

    namespace ConsoleApplication2

    {

    using System;

    using System.Collections.Generic;

    using System.Text;

    using System.Reflection;


    [AttributeUsage(AttributeTargets.Class |AttributeTargets.Method, AllowMultiple
    = false)]

    public class CodeCheckedAttribute : System.Attribute

    {

    public CodeCheckedAttribute (string codestatus)

    {

    this.codestatus = codestatus;

    }

    public string codestatus

    {

    get

    {

    return codestatus;

    }

    set

    {

    codestatus = value;

    }

    }

    }

    public class ClassA

    {

    public void display()

    {

    Console.WriteLine("Hello! We are in ClassA");

    }

    }

    [CodeChecked ("01247 Coding Convention Compliant")]

    ```'
