  md: "# Program 13.7 INCLUSION POLYMORPHISM\n\n```\nusing System;\nclass Maruthi\n\
    {\n    public virtual void Display () //virtual method\n    {\n        Console.WriteLine(\"\
    Maruthi car\");\n    }\n}\nclass Esteem : Maruthi\n{\n    public override void\
    \ Display()\n    {\n        Console.WriteLine(\"Maruthi Esteem\");\n    }\n}\n\
    class Zen : Maruthi\n{\n    public override void Display ()\n    {\n        Console.WriteLine(\"\
    Maruthi Zen\");\n    }\n}\nclass Inclusion\n{\n    public static void Main()\n\
    \    {\n        Maruthi m = new Maruthi ();\n        m = new Esteem ();    //upcasting\n\
    \        m.Display ();\n        m = new Zen ();       //upcasting\n        m.Display\
    \ ()\n    }\n}\n```\n\nProgram 13.7 outputs:\n    Maruthi : Esteem\n    Maruthi\
    \ : Zen\n\nIn Program 13.7, a particular car object, whether it be Esteem or Zen,\
    \ is cast to m which is of type Maruthi, the base class, using the casting statements.\n\
    \    m = new Esteem ();\n    m = new Zen ();\n\nWhen an object of Esteem is cast\
    \ to m, then, m behaves like an Esteem type object. Similarly, when a Zen object\
    \ is cast to m, it behaves like a Zen type object. Therefore, the two identical\
    \ calls produce two different outputs:\n    Maruthi Esteem\n    Maruthi Zen"
