- pgno: 358
  md: "Program 18.3 displays the following output:\nDivision by zero\ny = 1\n\nNote\
    \ that the program did not stop at the point of exceptional condition. It catches\
    \ the error condition, prints the error message and then continues the execution\
    \ as if nothing has happened. Compare this with the execution of Program 18.2\
    \ which did not give the value of y.\n\nMost often, exceptions are thrown by methods\
    \ that are invoked from within the try blocks. The point at which an exception\
    \ is thrown is called the throw point. Once an exception is thrown to the catch\
    \ block, control cannot return to the throw point. This kind of relationship is\
    \ shown in Fig. 18.2.\n\n![](img/bae4ee2c7c29c052feb3b9a9c5659998_358_0.png)\n\
    \n# 18.6 MULTIPLE CATCH STATEMENTS\n\nIt is possible to have more than one catch\
    \ statement in the catch block as illustrated below:\n\n```\ntry\n{\n    statement\
    \ ;        // generates an exception\n}\ncatch (Exception-Type-1 e)\n{\n    statement;\
    \         // processes exception type 1\n}\ncatch (Exception-Type-2 e)\n{\n  \
    \  statement;         // processes exception type 2\n}\n...\ncatch (Exception-type-N\
    \ e)\n{\n    statement ;        // processes exception type N\n}\n```\n\nWhen\
    \ an exception in a try block is generated, the C# treats the multiple catch statements\
    \ like cases in a switch statement. The first statement whose parameter matches\
    \ with the exception object will be executed, and the remaining statements will\
    \ be skipped.\n\nNote that C# does not require any processing of the exception\
    \ at all. We can simply have a catch statement with an empty block to avoid program\
    \ abortion.\n\nExample:\n\n```\ncatch (Exception e){ }\n```\n\nThis statement\
    \ will catch an exception and then ignore it."
