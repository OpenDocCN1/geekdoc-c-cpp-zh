  md: '+   - Reading from the keyboard

    +   - Using ToString method


    # 10.2.1 Assigning String Literals


    The most common way to create a string is to assign a quoted string of characters
    known as string literal to a string object. For example:


    ```

    string s1;----- //declaring a string object

    s1 = "abc";--- //assigning string literal

    ```


    Both these statements may be combined into one as follows:


    ```

    string s1 = "abc"; //declaring and assigning

    ```


    # 10.2.2 Copying Strings


    We can also create new copies of existing strings. This can be accomplished in
    two ways:


    +   - Using the overloaded = operator

    +   - Using the static Copy method


    Example:


    ```

    string s2 = s1;               //assigning

    string s2 = string.Copy(s1);   //copying

    ```


    Both these statements would accomplish the same thing, namely, copying the contents
    of s1 into s2.


    # 10.2.3 Concatenating Strings


    We may also create new strings by concatenating existing strings. There are a
    couple of ways to accomplish this.


    +   - Using the overloaded + operator

    +   - Using the static Concat method


    Examples:


    ```

    string s3 = s1 + s2; //s1 and s2 exist already

    string s3 = string.Concat(s1, s2)

    ```


    If s1 = ''abc'' and s2 = ''xyz'', then both the statements will store the string
    ''abcxyz'' in s3. Note that the contents of s2 is simply appended to the contents
    of s2 and the result is stored in s3.


    # 10.2.4 Reading from the Keyboard


    It is possible to read a string value interactively from the keyboard and assign
    it to a string object.


    ```

    string s = Console.ReadLine();

    ```


    On reaching this statement, the computer will wait for a string of characters
    to be entered from the keyboard. When the ''return key'' is pressed, the string
    will be read and assigned to the string object s.


    # 10.2.5 The ToString Method


    Another way of creating a string is to call the ToString method on an object and
    assign the result to a string variable.


    ```

    int number = 123;

    string numStr = number.ToString();

    ```'
