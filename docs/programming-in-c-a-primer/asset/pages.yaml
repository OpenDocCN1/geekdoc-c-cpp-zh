    \ in class B is static and therefore the class name is used directly with the\
    \ method name in creating the delegate object d2.\n\n# 16.6 DELEGATE INVOCATION\n\
    \nC# uses a special syntax for invoking a delegate. When a delegate is invoked,\
    \ it in turn invokes the method whose reference has been encapsulated into the\
    \ delegate, (only if their signatures match). Invocation takes the following form:\n\
    \n```\ndelegate_object (parameters list)\n```\n\nThe optional parameters list\
    \ provides values for the parameters of the method to be used.\n\n+   - If the\
    \ invocation invokes a method that returns void, the result is nothing and therefore\
    \ it cannot be used as an operand of any operator. It can be simply a statement\
    \ expression. Example:\n+     delegate1(x, y); //void delegate\n\nThis delegate\
    \ invokes a method that does not return any value.\n\n+   - If the method returns\
    \ a value, then it can be used as an operand of any operator. Usually, we assign\
    \ the return value to an appropriate variable for further processing. Example:\n\
    +     double result = delegate2(2.56, 45.73);\n\nThis statement invokes a method\
    \ (that takes two double values as parameters and returns double type value) and\
    \ then assigns the returned value to the variable result.\n\n> Note: Sometimes\
    \ the term 'delegate' is used to denote both the delegate type and delegate object.\
    \ We need to be aware of the context to know which meaning we are using when we\
    \ talk about delegates.\n\n# 16.7 USING DELEGATES\n\nProgram 16.1 illustrates\
    \ how a delegate is created and used in a program. The program implements two\
    \ delegate methods and therefore we need to create two delegate objects to invoke\
    \ these methods independently.\n\n# Program 16.1 CREATING AND IMPLEMENTING A DELEGATE\n\
    \n```\nusing System;\n//delegate declaration\ndelegate int ArithOp(int x, int\
    \ y);\nclass MathOperation\n{\n    // delegate methods definition\n    public\
    \ static int Add(int a, int b)\n    {\n        return (a + b);\n    }\n```"
