    \ technique known as boxing. Boxing means the conversion of a value type on the\
    \ stack to a object type on the heap. Conversely, the conversion from an object\
    \ type back to a value type is known as unboxing.\n\n# 4.12.1 Boxing\n\nAny type,\
    \ value or reference can be assigned to an object without an explicit conversion.\
