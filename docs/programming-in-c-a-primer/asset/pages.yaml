- pgno: 277
  md: "Member declarations;\n}\n\nHere, interface is the keyword and InterfaceName\
    \ is a valid C# identifier (just like class names). Member declarations will contain\
    \ only a list of members without implementation code. Given below is a simple\
    \ interface that defines a single method:\n\n```\ninterface Show\n{\n    void\
    \ Display ();    // Note semicolon here\n}\n```\n\nIn addition to methods, interfaces\
    \ can declare properties, indexers and events. Example:\n\n```\ninterface Example\n\
    {\n    int Aproperty\n    {\n        get ;\n    }\n    event someEvent Changed;\n\
    \    void Display ();\n}\n```\n\nThe accessibility of an interface can be controlled\
    \ by using the modifiers public, protected, internal and private. The use of a\
    \ particular modifier depends on the context in which the interface declaration\
    \ occurs.\n\nWe may also apply the modifier new on nested interfaces. It specifies\
    \ that the interface hides an inherited member by the same name.\n\n# 14.3 EXTENDING\
    \ AN INTERFACE\n\nLike classes, interfaces can also be extended. That is, an interface\
    \ can be subinterfaced from other interfaces. The new subinterface will inherit\
    \ all the members of the superinterface in the manner similar to subclasses. This\
    \ is achieved as follows:\n\n```\ninterface name2 : name1\n{\n    Members of name2\n\
    }\n```\n\nFor example, we can put all members of particular behaviour category\
    \ in one interface and the members of another category in the other.\n\nConsider\
    \ the code below:\n\n```\ninterface Addition\n{\n    int Add (int x, int y);\n\
    }\n```\n\n```\ninterface Compute : Addition\n{\n    int Sub (int x, int y);\n\
    }\n```"
