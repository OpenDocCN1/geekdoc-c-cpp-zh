- pgno: 474
  md: '# Appendix


    # D


    # The CLR and the .NET Framework


    # D.1 ASSEMBLIES


    An assembly is a collection of types and resources bundled together as a single
    functional unit. Everything in .NET is an assembly, be it an exe file or a DLL
    file. An assembly stores the type information in the form of object code. A typical
    assembly comprises of the following:


    +   - **Assembly manifest** It stores the metadata pertaining to the assembly.

    +   - **Type metadata** It stores the information pertaining to the various types
    contained in the assembly.

    +   - **Code** It is the Microsoft Intermediate Language Instructions (MSIL) code
    pertaining to the various types that the assembly implements.

    +   - **Resources** It refers to the resources (optional) that the assembly contains.


    It is the fundamental requirement for an assembly to have an entry point through
    which applications can gain access to its various types. This entry point can
    be created through any one of the following:


    +   - **DLLMain** for DLLs

    +   - **WinMain** for Windows-based applications

    +   - **Main** for console-based applications


    Let us now explore some of the fundamental concepts related to assemblies.


    # Storage Format


    .NET assemblies are stored in the PE file format, which is a common file format
    for executables and object code in the Windows environment. A PE file comprises
    of three main sections:


    +   - **PE header** It is the first section that acts as an index for the other
    sections. It also contains reference information pertaining to the entry point
    of the assembly.

    +   - **MSIL code** This section stores the actual assembly code in MSIL format.
    The pieces of code are accompanied by relevant metadata tokens.

    +   - **Metadata** This section stores the meta information in the form of heaps
    and tables. The CLR uses this information to access assembly types and methods.
    Furthermore, the metadata section also stores security and scope related information.


    # Scope


    The scope of a type is restricted to the assembly in which it is defined. However,
    a type can be referenced from a different assembly by using the /reference compiler
    option. The definition of a type must confine itself to a single assembly; that
    means it cannot extend across two assemblies.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# Assembly Manifest


    An assembly manifest contains metadata pertaining to an assembly. It is due to
    the assembly manifest that an assembly becomes self-describing in nature. It acts
    as an interface for the outside world to interact with the assembly. The contents
    of an assembly manifest contain the following information:


    +   - The name of the assembly

    +   - The version of the assembly

    +   - The strong name attributes, that is public key and digital signature

    +   - The list of files belonging to the assembly

    +   - Reference information used by the CLR for referencing assembly types

    +   - Information pertaining to the other assemblies that are referenced by the
    current assembly


    A programmer can manipulate the information contained in the assembly manifest
    with the help of assembly attributes, such as AssemblyCultureAttribute and AssemblyVersionAttribute.


    You can view the assembly manifest for an assembly with the help of the ILDasm
    disassembler tool. Figure D.1 shows a sample assembly manifest:


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_475_0.png)


    # Types of Assemblies


    The various types of assemblies are the following:


    +   - Multi-module Assembly As the name suggests, a multi-module assembly comprises
    of multiple modules contained in different files. The assembly manifest keeps
    track of the information pertaining to different modules. In addition, each module
    has a manifest of its own for storing module-specific information. In case of
    multi-module assemblies, the assembly manifest may exist either independently
    in a separate file or inside one of the modules.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '+   - **Private Assembly** If an assembly is created as private then it can
    only be used by the application for which it is created. Other applications do
    not have access to private assemblies. Unless explicitly specified, the C# compiler
    creates private assemblies when an application is compiled.

    +   - **Shared Assembly** In contrast to private assemblies, the shared assemblies
    can be used by different non-related applications. For facilitating sharing of
    assemblies, it is necessary to give them a strong name. A strong name makes use
    of assembly name, version number, public key and digital signature to allocate
    a globally unique name to the assembly. It is also required for a shared assembly
    to be registered in the Global Assembly Cache (GAC).


    # D.2 VERSIONING


    As already explained, versioning of assemblies helps in their identification by
    the CLR. An assembly version assumes the format of a four part numerical string,
    as shown below:


    ```

    <major version number>.<minor version number>.<build version number>.<revision
    number>

    ```


    For example, version 2.5.11.1 represents an assembly with 1 as the revision number,
    11 as the build version number, 5 as the minor version number and 2 as the major
    version number. If no version number is assigned to an assembly then by default
    it assumes the value 0.0.0.0. The version information is typically used along
    with the public key to allocate a strong name to the assembly.


    The assembly version is set with the help of the AssemblyVersionAttribute attribute.
    The following is an example of using AssemblyVersionAttribute for setting the
    assembly version in C#:


    ```

    [assembly:AssemblyVersionAttribute("1.2.5.0")]

    ```


    Two different assemblies with the same name can exist in the system provided they
    have different version numbers. This situation may arise if a newer version of
    the assembly is created with the subsequent release of an application. However,
    the older assembly versions are also retained for ensuring backward compatibility.


    # D.3 ATTRIBUTES


    Attributes are objects that help associate data or information with various elements
    of a program. The information is stored as metadata and retrieved by the CLR at
    runtime. The program elements with which attributes are attached are referred
    as attribute targets.


    Some of the examples of attribute targets are


    +   - Assembly

    +   - Class

    +   - Interface

    +   - Method

    +   - Property

    +   - Module

    +   - All


    There are two types of attributes: intrinsic and custom. As the name suggests,
    intrinsic attributes are the built-in attributes of .NET that are meant for certain
    pre-specified purposes. Custom attributes, on the other hand, are the user-defined
    attributes used for adding custom information to the targets.'
  merge: -1
  img_proc: true
- pgno: 477
  md: "# Intrinsic Attributes\n\n.NET comes with a number of built-in or pre-defined\
    \ attributes that are used for varied purposes during runtime. Table D.1 lists\
    \ some of these intrinsic attributes along with their targets and functionality.\n\
    \n# Table D.1 C# Compiler Options\n\n| ATTRIBUTE | TARGET | DESCRIPTION |\n|---|---|---|\n\
    | DllImportAttribute | Method | Is used to specify the location of the dll from\
    \ where a method is to be imported. |\n| ObsoleteAttribute | All program elements\
    \ excluding assemblies, modules, parameters and return values | Is used to mark\
    \ the target as obsolete so that it can not be used in future. |\n| SerializableAttribute\
    \ | Class, struct, enum, and delegate | Is used to mark the target as serializable.\
    \ |\n| ConditionalAttribute | Method | Is used to instruct the compiler to ignore\
    \ the method calls unless the relevant conditional compilation symbol is defined.\
    \ |\n| CLSCompliantAttribute | All program elements | Is used to specify whether\
    \ the target is Common Language Specification (CLS) compliant or not. |\n\n# Specifying\
    \ Attributes\n\nThe specification of attributes is done inside an attribute section\
    \ that is placed just before the target element declaration. The attribute section\
