  md: "```\nclass A\n{\n    private class B\n    {\n        public int x;\n    }\n\
    }\n```\n\nHere, the public data x is not accessible outside the class B. It is\
    \ due to the constraint imposed by the accessibility of class B. Because B is\
    \ private, the public on x is reduced to private.\n\nIn many situations we use\
    \ methods to handle class objects and therefore they take classes as their return\
    \ types. In such cases, the return type of a method must be at least as accessible\
    \ as the method itself. For instance, consider the following code:\n\n```\nclass\
    \ A\n{\n    ...\n}\npublic class B\n{\n    A Method1() {}        // OK\n    internal\
    \ A Method2() {}  // OK\n    public A Method3() {}   // Error!\n}\n```\n\nAll\
    \ the three methods declared in class B specify A as their return type. Since\
    \ the class A, by default, assumes internal as the accessibility level, the method\n\
    \n```\npublic A Method3() // public is higher than internal\n{\n    ...\n}\n```\n\
