  md: '+   27. The set of operators that can be overloaded in C# is smaller compared
    to C++.

    +   28. C# can check overflow of arithmetic operations and conversions using checked
    and unchecked keywords.

    +   29. C# does not support default arguments.

    +   30. Variable method parameters are handled differently in C#.

    +   31. In exception-handling, unlike in C++, we cannot throw any type in C#.
    The thrown value has to be a reference to a derived class or System.Exception
