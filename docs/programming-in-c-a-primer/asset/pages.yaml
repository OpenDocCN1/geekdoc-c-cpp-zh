- pgno: 19
  md: 'language depends upon many factors such as hardware environment, business environment,
    user requirements and so on. The primary motivation while developing each of these
    languages has been the concern that it be able to handle the increasing complexity
    of programs that are robust, durable and maintainable. The history of major languages
    developed during the last three decades is given in Fig. 1.1:


    C and C++ have been the two most popular and most widely used languages in the
    software industry for the past two decades. They provide programmers with a tremendous
    amount of power and control for developing scientific, commercial and business
    applications. However, these languages suffer from a number of shortcomings in
    meeting the emerging World Wide Web requirements and standards. Of concern are
    the following:


    +   - The high complexity of the language

    +   - Their long cycle-time

    +   - They are not truly object-oriented

    +   - They are not suitable for working with new web technologies

    +   - They have poor type-safety

    +   - They are prone to costly programming errors

    +   - They do not support versioning

    +   - They are prone to memory leakages

    +   - Their low productivity

    +   - Their poor interoperability with the existing systems

    +   - They are weak in consistency

    +   - Their poor support for component programming


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_19_0.png)


    Visual Basic (VB), a language promoted by Microsoft for overcoming these problems,
    also could not meet some of the requirements of the www. Since VB is not truly
    an object-oriented programming language, it becomes increasingly difficult to
    use when systems become large.


    Java, a language derived from C C++ family, however, is truly object-oriented
    and has been widely used for web applications for the past five years. Unfortunately,
    Java has not retained some powerful C++ features such as operator overloading.
    It also lacks inter-operability with code developed in other languages. Although
    Microsoft attempted to transform Java and make it a language of choice for their
    proposed new generation .NET platform, the law suit of Sun Microsystems against
    Microsoft prevented this from happening.


    Microsoft wanted an environment that is completely in tune with current and emerging
    Web-programming practices and one that easily integrates with existing systems.
    Microsoft therefore decided to design a new language starting with a clean slate.
    The result is C#, a simple and modern language that directly addresses the needs
    of component-based software development.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.3 EVOLUTION OF C#


    The World Wide Web is growing everyday not only in terms of the number of web
    sites but also in terms of volume and variety of information it contains. Doing
    business across those web sites is very exciting and useful. The number of individuals
    and organizations using the Internet, which supports the World Wide Web is increasing
    exponentially. The Internet is therefore in the mainstream of many business organizations
    today.


    But what is the Internet today? We have a number of limitations in using the WWW
    over the Internet.


    +   - We can see only one site at a time

    +   - The site has to be authored to our hardware environment

    +   - The information we get is basically read-only

    +   - We cannot compare dynamically similar information stored in different sites

    +   - The Internet is a collection of many information islands that do not co-operate
    with each other. It continues to be a browsing and presentation network rather
    than an intelligent knowledge management network.


    Microsoft Chairman Bill Gates, the architect of many innovative and path-breaking
    software products during the past two decades, wanted to develop a software platform
    which will overcome these limitations and enable users to get information anytime
    and anywhere, using a natural interface. The platform should be a collection of
    readily available Web services that can be distributed and accessed via standard
    Internet protocols. He wanted to make the Web both programmable and intelligent.
    The outcome is a new generation platform called .NET. .NET is simply the Microsoft’s
    vision of ‘software as a service.’


    Although the research and development work of .NET platform began in the mid-90s,
    only during the Microsoft Professional Developers Conference in September 2000,
    was .NET officially announced to the developer community. At the same conference,
    Microsoft introduced C# as a de facto language of the .NET platform. In fact,
    they had already used C# to code key modules of the .NET platform. C# has been
    particularly designed to build software components for .NET and it supports key
    features of .NET natively. They are fairly tightly tied together. In fact, C#
    compiler is embedded into .NET as shown in Fig. 1.2.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_20_0.png)


    Like Java, C# is a descendant of C++ which in turn is a descendant of C as illustrated
    in Fig. 1.3. C is the mother of all the three modern languages. C# modernizes
    C++ by enhancing some of its features and adding a few new features so as to help
    developers do more with fewer lines of code and fewer opportunities for error.


    C# borrows Java’s features such as grouping of classes, interfaces and implementation
