    \ output of Program 17.3 would be:\nItems\nIntValue: 100\nFloatValue    : 99.9\n\
    \n# 17.6 NUMERIC FORMATTING\n\nWe have seen how a simple format string can be\
    \ used to output different types of values with the help of markers \"{ }\". Each\
    \ marker (also known as placeholder) can optionally contain various format characters\
    \ to specify the nature of numeric format. C# supports two methods of numeric\
    \ format:\n\n+   - Standard format\n+   - Custom format\n\nThe most commonly used\
    \ one is the standard format that converts a numeric type to a specific string\
    \ representation. We may use custom format if further refinement of the output\
    \ format is required.\n\n# 17.7 STANDARD NUMERIC FORMAT\n\nThe standard numeric\
    \ format consists of a numeric format character and optionally a precision specifier.\
    \ The general format of a marker would appear like this:\n{n:fc[p]}\n\nwhere n\
    \ is the index number of the argument to be substituted, fc is the format character\
    \ and p is the precision specifier. Table 17.2 shows the list of format characters\
    \ that can be used for formatting the output of numbers.\n\n# Table 17.2 C# format\
    \ characters\n\n| FORMAT CHARACTER | DESCRIPTION |\n|---|---|\n| C or c | Currency\
    \ formatting. By default, the dollar sign $ will be fixed to the value. A precision\
    \ specifier may be used to specify the number of decimal places. |\n| D or d |\
    \ Formats integer numbers, and converts integers to base 10. A precision specifier\
    \ may be used to pad with leading zeros, if necessary. |\n| E or e | Exponential\
    \ (or Scientific) formatting. A precision specifier may be used to set the number\
    \ of decimal places, which is 6 by default. There is always one digit before the\
    \ decimal point. |"
