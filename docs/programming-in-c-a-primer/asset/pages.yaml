- pgno: 354
  md: "# 18.3.1 Compile-Time Errors\n\nAll syntax errors will be detected and displayed\
    \ by the C# compiler and therefore these errors are known as compile-time errors.\
    \ Whenever the compiler displays an error, it will not create the .cs file. It\
    \ is therefore necessary that we fix all the errors before we can successfully\
    \ compile and run the program.\n\n# Program 18.1 ILLUSTRATION OF COMPILE-TIME\
    \ ERRORS\n\n```\n/* This program contains an error */\nusing Sytem;\nclass Error1\n\
    {\n    public static void Main()\n    {\n        Console.WriteLine(\"Hello C#!\"\
    );\n    }\n}\n```\n\nThe C# compiler does a nice job of telling us where the errors\
    \ are in the program. For example, if we have misspelled the System namespace\
    \ in Program 18.1, the following message will be displayed on the screen:\n\n\
    Error1.cs(2.7) : error CS0234 : The type or namespace name ‘Sytem’ does not exist\
    \ in the class or namespace.\n\nWe can now go to the appropriate line, correct\
    \ the error, and recompile the program. Sometimes, a single error may be the source\
    \ of multiple errors later in the compilation. For example, use of an undeclared\
    \ variable in a number of places will cause a series of errors of type ‘undefined\
    \ variable’. We should generally consider the earliest errors as the major source\
    \ of our problem. After we fix such an error, we should recompile the program\
    \ and look for other errors.\n\nMost of the compile-time errors are due to typing\
    \ mistakes. Typographical errors are hard to find. We may have to check the code\
    \ word by word, or even character by character. The most common problems are:\n\
    \n+   - Missing semicolons\n+   - Missing (or mismatch of) brackets in classes\
    \ and methods\n+   - Misspelling of identifiers and keywords\n+   - Missing double\
    \ quotes in strings\n+   - Use of undeclared variables\n+   - Incompatible types\
    \ in assignments / initialization\n+   - Bad references to objects\n+   - Use\
    \ of = in place of == operator, etc.\n\n# 18.3.2 Run-time Errors\n\nSometimes,\
    \ a program may compile successfully creating the .exe file but may not run properly.\
    \ Such programs may produce wrong results due to wrong logic or may terminate\
    \ due to errors such as stack overflow. Most common run-time errors are:\n\n+\
    \   - Dividing an integer by zero.\n+   - Accessing an element that is out of\
    \ the bounds of an array.\n+   - Trying to store a value into an array of an incompatible\
    \ class or type."
  merge: -1
  img_proc: true
- pgno: 355
  md: "+   - Passing a parameter that is not in a valid range or value for a method.\n\
    +   - Attempting to use a negative size for an array.\n+   - Using a null object\
    \ reference as a legitimate object reference to access a method or a variable.\n\
    +   - Converting an invalid string to a number or vice versa.\n+   - Accessing\
    \ a character that is out of bounds of a string, and so on.\n\nWhen such errors\
    \ are encountered, C# typically generates an error message and aborts the program.\
    \ Program 18.2 illustrates how a run-time error causes termination of execution\
    \ of the program.\n\n# Program 18.2 ILLUSTRATION OF RUN-TIME ERRORS\n\n```\nusing\
    \ System;\nclass Error2\n{\n    public static void Main()\n    {\n        int\
    \ a = 10;\n        int b = 5;\n        int c = 5;\n\n        int x = a/(b-c);\n\
    \        Console.WriteLine(\"x = \" + x);\n\n        int y = a/(b+c);\n      \
    \  Console.WriteLine(\"y = \" + y);\n    }\n}\n```\n\nProgram 18.2 is syntactically\
    \ correct and therefore does not cause any problem during compilation. When C#\
    \ run-time tries to execute a division by zero, it generates an error condition\
    \ which causes the program to stop after displaying an appropriate message. The\
    \ following statement is never executed:\nint y = a/(b + c);\n\n# 18.4 EXCEPTIONS\n\
    \nAn exception is a condition that is caused by a run-time error in the program.\
    \ When the C# compiler encounters an error such as dividing an integer by zero,\
    \ it creates an exception object and throws it (i.e., informs us that an error\
    \ has occurred).\n\nIf the exception object is not caught and handled properly,\
    \ the compiler will display an error message and will terminate the program. If\
    \ we want the program to continue with the execution of the remaining code, then\
    \ we should try to catch the exception object thrown by the error condition and\
    \ then display an appropriate message for taking corrective actions. This task\
    \ is known as exception handling.\n\nThe purpose of the exception handling mechanism\
    \ is to provide a means to detect and report an ‘exceptional circumstance’ so\
    \ that appropriate action can be taken. The mechanism suggests incorporation of\
    \ a separate error handling code that performs the following tasks:\n\n+   - Find\
    \ the problem (Hit the exception)\n+   - Inform that an error has occurred (Throw\
    \ the exception)\n+   - Receive the error information (Catch the exception)\n\
    +   - Take corrective actions (Handle the exception)"
  merge: -1
  img_proc: true
- pgno: 356
  md: 'The error handling code basically consists of two segments, one to detect errors
    and to throw exceptions and the other to catch exceptions and to take appropriate
    actions.


    When writing programs, we must always be on the lookout for places in the program
    where an exception could be generated. Some common exceptions that we must catch
    are listed in Table 18.1.


    # Table 18.1 Common C# exceptions


    | Exception Class | Cause of Exception |

    |---|---|

    | SystemException | A failed run-time check, used as a base class for other exceptions
    |

    | AccessException | Failure to access a type member, such as a method or field
    |

    | ArgumentException | An argument to a method was invalid |

    | ArgumentNullException | A null argument was passed to a method that does not
    accept it |

    | ArgumentOutofRangeException | Argument value is out of range |

    | ArithmeticException | Arithmetic over-or underflow has occurred |

    | ArrayTypeMismatchException | Attempt to store the wrong type of object in an
    array |

    | BadImageFormatException | Image is in the wrong format |

    | CoreException | Base class for exceptions thrown by the runtime |

    | DivideByZeroException | An attempt was made to divide by zero |

    | FormatException | The format of an argument is wrong |

    | IndexOutofRangeException | An array index is out of bounds |

    | InvalidCastException | An attempt was made to cast to an invalid class |

    | InvalidOperationException | A method was called at an invalid time |

    | MissingMemberException | An invalid version of a DLL was accessed |

    | NotFiniteNumberException | A number is not valid |

    | NotSupportedException | Indicates that a method is not implemented by a class
    |

    | NullReferenceException | Attempt to use an unassigned reference |

    | OutofMemoryException | Not enough memory to continue execution |

    | StackOverflowException | A stack has overflowed |


    # 18.5 SYNTAX OF EXCEPTION HANDLING CODE


    The basic concepts of exception handling are throwing an exception and catching
    it. This is illustrated in Fig. 18.1.


    C# uses a keyword try to preface a block of code that is likely to cause an error
    condition and ‘throw’ an exception. A catch block defined by the keyword catch
    ‘catches’ the exception ‘thrown’ by the try block and handles it appropriately.
    The catch block is added immediately after the try block. The following example
    illustrates the use of simple try and catch statements:


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_356_0.png)


    Fig. 18.1 Exception handling mechanism'
