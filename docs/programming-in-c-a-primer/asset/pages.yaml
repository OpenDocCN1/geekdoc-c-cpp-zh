- pgno: 23
  md: '# 1.6 HOW DOES C# DIFFER FROM C++?


    As stated earlier, C# was derived from C++ to make it the language of choice for
    C and C++ programmers. C# therefore shares major parts of syntax with C++. However,
    the C# designers introduced a few changes in the syntax of C++ and removed a few
    features primarily to reduce the common pitfalls that occurred in C++ program
    development. They also added a number of additional features to make C# a type-safe
    and web-enabled language.


    # Changes Introduced


    +   01. C# compiles straight from source code to executable code, with no object
    files.

    +   02. C# does not separate class definition from implementation. Classes are
    defined and implemented in the same place and therefore there is no need for header
    files.

    +   03. In C#, class definition does not use a semicolon at the end.

    +   04. The first character of the Main() function is capitalized. The Main must
    return either int or void type value.

    +   05. C# does not support #include statement. (Note that using is not the same
    as #include).

    +   06. All data types in C# are inherited from the object super class and therefore
    they are objects.

    +   07. All the basic value types will have the same size on any system. This
    is not the case in C or C++. Thus C# is more suitable for writing distributed
    applications.

    +   08. In C#, data types belong to either value types (which are created in a
    stack) or reference types (which are created in a heap).

    +   09. C# checks for uninitialized variables and gives error messages at compile
    time. In C++, an uninitialized variable goes undetected thus resulting in unpredictable
    output.

    +   10. In C#, structs are value types.

    +   11. C# supports a native string type. Manipulation of strings are easy.

    +   12. C# supports a native Boolean data type and bool-type data cannot be implicitly
    or explicitly cast to any data type except object.

    +   13. C# declares null as a keyword and considers it as an intrinsic value.

    +   14. C# does not support pointer types for manipulating data. However, they
    are used in what is known as ‘unsafe’ code.

    +   15. Variable scope rules in C# are more restrictive. In C#, duplicating the
    same name within a routine is illegal, even if it is in a separate code block.

    +   16. C# permits declaration of variables between goto and label.

    +   17. We can only create objects in C# using the new keyword.

    +   18. Arrays are classes in C# and therefore they have built-in functionality
    for operations such as sorting, searching and reversing.

    +   19. Arrays in C# are declared differently and behave very differently compared
    to C++ arrays.

    +   20. C# provides special syntax to initialize arrays efficiently.

    +   21. Arrays in C# are always reference types rather than value types, as they
    are in C++ and therefore stored in a heap.

    +   22. In C#, expressions in if and while statements must resolve to a bool value.
    Accidental use of the assignment operator (=) instead of equality operator ==
    will be caught by the compiler.

    +   23. C# supports four iteration statements rather than three in C++. The fourth
    one is the foreach statement.

    +   24. C# does not allow silent fall-through in switch statements. It requires
    an explicit jump statement at the end of each case statement.

    +   25. In C#, switch can also be used on string values.

    +   26. C# does not support the labeled break and therefore jumping out of nested
    loops can be messy.'
  merge: -1
  img_proc: true
