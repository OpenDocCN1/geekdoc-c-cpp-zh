  md: "# Case Study\n\n# ProblemStatement\n\nQTest is an advertising company that\
    \ is approached by big organisations such as ABCL and SoftCom to conduct quizzes\
    \ for advertising their products. For conducting quizzes, QTest first asks different\
    \ individuals to register by specifying details such as their name and surname.\
    \ After individuals get registered, QTest selects some individuals from a group\
    \ of individuals and invites them to participate in the quiz. The task of obtaining\
    \ details from different individuals is so far performed manually by a group of\
    \ QTest staff. However, manually performing the task of obtaining details from\
    \ different individuals is time consuming. QTest has to employ additional staff\
    \ for performing the task of getting details from individuals. As a result, QTest\
    \ is facing financial loss in the advertisement business. How can QTest automate\
    \ the task of receiving details such as the name and surname from individuals\
    \ for registration?\n\n# Solution\n\nQTest needs to use an application created\
    \ in a programming language such as C# to automate the task of obtaining details\
    \ from individuals for registration. After having decided that it needs an application\
    \ for automating the task, QTest contacts ADev Software Solutions Private Limited,\
    \ which is a small software development company, to create the application for\
    \ automating the task of obtaining details from individuals. After an analysis\
    \ of the requirement, ADev creates a C# application using the string methods such\
    \ as Insert and Append available in C#. These string methods allow us to perform\
    \ different manipulation tasks such as appending a string to another string and\
    \ inserting a string. The following C# application is ultimately created by ADev\
    \ Software Solutions for QTest.\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Text;\nnamespace AboutStrings\n{\n    class Program\n    {\n    \
    \    static void Main(string[] args)\n        {\n            string str1 = \"\"\
    , str2, str3, str4;\n            Console.WriteLine(\"This is an example of how\
    \ strings can be manipulated/validated in C#.\");\n            Console.WriteLine(\"\
    ================================================================================\"\
    );\n            int n = 0;\n            Console.Write(\"Please enter your Name\
    \ : \");\n            str1 = Console.ReadLine();\n            if (str1.Length\
    \ > 3)\n            {\n                if (string.IsNullOrEmpty(str1))\n     \
    \           {\n                    Console.WriteLine(\"string cannot be empty\"\
