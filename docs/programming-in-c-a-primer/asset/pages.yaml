    In earlier examples, we have used the Main method with no parameters. Notice how
    the Main is declared in this example.


    ```

    public static void Main (string [] args)

    ```


    Main is declared with a parameter args. The parameter args is declared as an array
    of strings (known as string objects). Any arguments provided in the command line
    (at the time of execution) are passed to the array args as its elements. We can
    access the array elements by using a subscript like args[0], args[1] and so on.
    For example, consider the command line


    SampleSix C sharp


    This command line contains two arguments which are assigned to the array args
    as follows:


    +   C → args [0]


    +   sharp → args [1]


    Note that C# subscripts begin with 0 and not 1. (Arrays and strings are discussed
    in detail later). If we execute Program 3.6 with the above command line, we will
    get the following output:


    Welcome to C sharp


    Notice the use of a new output method Console.Write ( )


    Its only difference from the WriteLine ( ) method is that Write ( ) does not cause
    a line break and therefore the next output statement is printed on the same line.
    Thus, all the three output statements combine to produce one line of output. See
    Chapter 17 for more details on output formats.


    Note how the output statements concatenate strings using the + operator while
    printing. Here, empty strings are used to provide blank space between strings.
    (The operator + is overloaded to perform the task of adding two strings. See Chapter
    15 for more details on operator overloading.)


    Program 3.7 shows another example of use of command-line arguments in C#. The
    program calculates the square root of a number passed as a command-line argument
    and displays the output.


    # Program 3.7 | COMMAND LINE EXAMPLE


    ```

    using System;

    class CommandLineExample

    {

    static void Main(string[] args)

    {

    double argValue=0.0;

    double sqrtValue=0.0;

    if (args.Length == 0)

    {

    Console.WriteLine("Please enter a number");

    }

    else

    {

    argValue = double.Parse(args[0]);

    sqrtValue = Math.Sqrt(argValue);

    Console.WriteLine("Square root of " + argValue + " is " + sqrtValue);

    }

    }

    }

    ```'
