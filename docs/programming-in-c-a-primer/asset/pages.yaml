- pgno: 60
  md: '# 4.5.7 Boolean Type


    Boolean type is used when we want to test a particular condition during the execution
    of the program. There are only two values that a Boolean type can take: true or
    false. Remember, both these words have been declared as keywords. Boolean type
    is denoted by the keyword bool and uses only one byte of storage. In contrast
    to C and C++, in C#, we cannot use zero for false and non-zero for true. No conversion
    between bool and other integer types is possible.


    All comparison operators (see Chapter 5) return Boolean type values. Boolean values
    are often used in selection and iteration statements.


    # 4.6 REFERENCE TYPES


    +   • User-defined (or complex) types

    +   • Predefined (or simple) types


    User-defined reference types refer to those types which we define using predefined
    types. They include:


    +   • Classes

    +   • Interfaces


    These complex types will be discussed in later chapters when we take up these
    topics individually.


    +   • Object type

    +   • String type


    The object type is the ultimate base type of all other intrinsic and user-defined
    types in C#. We can use an object reference to bind to an object of any particular
    type. We shall see later how we can use the object type to convert a value type
    on the stack to an object type to be placed on the heap.


    C# provides its own string type for creating and manipulating strings. String
    literals discussed earlier can be stored in string objects as values. We can perform
    a number of operations such as copying, comparing and concatenation on these string
    objects. Strings and string objects are considered in more detail in Chapter 10.


    # 4.7 DECLARATION OF VARIABLES


    Variables are the names of storage locations. After designing suitable variable
    names, we must declare them to the compiler. Declaration does three things:


    +   1. It tells the compiler what the variable name is.

    +   2. It specifies what type of data the variable will hold.

    +   3. The place of declaration (in the program) decides the scope of the variable.


    A variable must be declared before it is used in the program. That is, the name
    has nothing to do with the type. C# allows any properly formed variable to have
    any declared data type. The declaration statement defines the type of variable.
    The general form of declaration of a variable is:


    ```

    type variable1, variable2, ......, variableN;

    ```


    Variables are separated by commas. A declaration statement must end with a semicolon.
    Some valid declarations are:


    ```

    int count;

    float x, y;

    double pi;

    byte b;

    ```'
