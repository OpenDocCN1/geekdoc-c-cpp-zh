- pgno: 488
  md: '# Using SingleCall


    While registering the server object we specified the WellKnownObjectMode.Singleton
    parameter to the RegisterWellKnownServiceType method. A singleton type object
    caters to multiple client requests simultaneously, thus enabling the applications
    to share data with each other.


    We can change the type of a server object to SingleCall by passing WellKnownObjectMode.SingleCall
    parameter to the RegisterWellKnownServiceType method, as shown below:


    ```

    Type t = Type.GetType("RemoteC");

    RemotingConfiguration.RegisterWellKnownServiceType(t,"EP",WellKnownObjectMode.SingleCall
    );

    ```


    This will produce a new instantiation for the server-side object every time a
    new client request is received.'
