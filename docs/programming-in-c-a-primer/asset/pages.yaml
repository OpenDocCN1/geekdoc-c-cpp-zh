- pgno: 108
  md: "```\ncase value-2:\n    block-2\n    break;\n    .....\n    .....\ndefault:\n\
    \    default-block\n    break;\n}\nstatement-x;\n```\n\nThe expression must be\
    \ an integer type or char or string type. value-1, value-2 .... are constants\
    \ or constant expressions and are known as case labels. Each of these values should\
    \ be unique within a switch statement. block-1, block-2 .... are statement lists\
    \ and may contain zero or more statements. There is no need to put braces around\
    \ these blocks but it is important to note that case labels end with a colon (:).\n\
    \nThe switch statement is executed in the following order:\n\n+   1. The expression\
    \ is evaluated first.\n+   2. The value of the expression is successively compared\
    \ against the values, value-1, value-2, .... If a case is found whose value matches\
    \ the value of the expression, then the block of statements that follows the case\
    \ are executed.\n+   3. The break statement at the end of each block signals the\
    \ end of a particular case and causes an exit from the switch statement, transferring\
    \ the control to the statement-x following the switch.\n+   4. The default is\
    \ an optional case. When present, it will be executed if the value of the expression\
    \ does not match any of the case values. If not present, no action takes place\
    \ when all matches fail and the control goes to the statement-x.\n\nThe selection\
    \ process of switch statement is illustrated in the flowchart shown in Fig. 6.6.\n\
    \nThe switch statement can be used to grade the students as discussed in the last\
    \ section. This is illustrated below:\n\n```\n........\n........\nindex = marks/10;\n\
    switch(index)\n{\n    case 10:\n    case 9:\n    case 8:\n        grade = \"Honours\"\
    ;\n        break;\n    case 7:\n    case 6:\n        grade = \"First Division\"\
    ;\n        break;\n```\n\n![](img/bae4ee2c7c29c052feb3b9a9c5659998_108_0.png)\n\
    \n# Fig. 6.6 Selection process of the switch statement"
