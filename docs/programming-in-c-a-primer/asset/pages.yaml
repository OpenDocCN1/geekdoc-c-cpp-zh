- pgno: 379
  md: '# Table 19.1 Properties of the Thread class


    | PROPERTY | TASK |

    |---|---|

    | CurrentThread | To retrieve the name of the thread, which is currently running.
    |

    | IsAlive | To retrieve a value to indicate the current state of thread execution.
    The value of the IsAlive property is true if the thread has been started or has
    not terminated, otherwise the value is false. |

    | IsThreadPoolThread | To retrieve a value to indicate whether a thread is part
    of a thread pool or not. The value of IsThreadPoolThread property is true if the
    thread is part of a thread pool, otherwise it is false. |

    | Name | To specify a name for a thread. |

    | Priority | To obtain a value, which indicates the scheduling priority of a thread.
    By default, the value of the Priority property is Normal. We can assign either
    Highest, AboveNormal, Normal, BelowNormal or Lowest value to the Priority property.
    The Highest value indicates that the thread must be scheduled for running before
    any other thread. The AboveNormal value indicates that the thread with this value
    must be scheduled after the Highest priority threads but before the Normal priority
    thread. The Normal value indicates that threads with this value must be scheduled
    after the threads with AboveNormal priority but before the BelowNormal priority
    threads. The BelowNormal value indicates that the thread with this value must
    be scheduled after a Normal priority value thread but before the Lowest priority
    thread. The Lowest value indicates that the thread with this value must be scheduled
    for running after the threads with other priorities such as Normal and Highest
    have executed. |

    | ThreadState | To retrieve a value, which indicates the state of a thread. By
    default, the value of the ThreadState property is Unstarted. The ThreadState property
    can have a value indicating the state of the current thread. These values can
    be Running, Stopped, Suspended, Unstarted or WaitSleepJoin. The Running value
    indicates that the current thread is running. The Stopped value indicates that
    the current thread is stopped. The Suspended value indicates that the current
    thread is suspended. The Unstarted value indicates that the thread has not been
    started yet using the Start method of the Thread class. The WaitSleepJoin value
    indicates that the current thread is blocked because of call to Wait, Sleep or
    Join method. |


    The Thread class also provides certain methods that can be used to manage operations
    such as starting a thread and resuming a suspended thread. Table 19.2 shows some
    of the important methods of the Thread class.


    # Table 19.2 Methods of the Thread class


    | METHOD | TASK |

    |---|---|

    | Interrupt | To interrupt the thread, which is in the WaitSleepJoin state. |

    | Join | To block a thread until another thread has terminated. |

    | Resume | To resume a thread, which has been suspended earlier. |

    | Sleep | To block the current thread for a specified time period. |

    | SpinWait | To make a thread wait the number of times specified in Iterations
    parameter. |

    | Start | To start a thread. |

    | Suspend | To suspend a thread. |'
