    \n# Program 7.5 ADDITIONAL FEATURES OF FOR LOOP\n\n```\nusing System;\nclass forExample\n\
    {\npublic static void Main()\n{\nint num1=0, num2=10;\nfor(; ((num1<=10) && (num2>=0));\
    \ num2--, num1++)\n{\nSystem.Console.WriteLine(\"First Number {0} is {1} than\
