  md: '![](img/bae4ee2c7c29c052feb3b9a9c5659998_21_0.png)


    # 1.4 CHARACTERISTICS OF C#


    As pointed out earlier, the main design goal of C# was simplicity rather than
    pure power. C# fulfills the need for a language that is easy to write, read and
    maintain and also provides the power and flexibility of C++. The language that
    is designed for both computing and communications is characterized by several
    key features. It is


    +   - Simple

    +   - Consistent

    +   - Modern

    +   - Object-oriented

    +   - Type-safe

    +   - Versionable

    +   - Compatible

    +   - Interoperable and

    +   - Flexible


    # 1.4.1 Simple


    C# simplifies C++ by eliminating irksome operators such as ->, :: and pointers.
    C# treats integer and Boolean data types as two entirely different types. This
    means that the use of = in place of == in if statements will be caught by the
    compiler.


    # 1.4.2 Consistent


    C# supports an unified type system which eliminates the problem of varying ranges
    of integer types. All types are treated as objects and developers can extend the
    type system simply and easily.


    # 1.4.3 Modern


    C# is called a modern language due to a number of features it supports. It supports


    +   - Automatic garbage collection

    +   - Rich intrinsic model for error handling

    +   - Decimal data type for financial applications

    +   - Modern approach to debugging and

    +   - Robust security model


    # 1.4.4 Object-Oriented


    C# is truly object-oriented. It supports all the three tenets of object-oriented
    systems, namely.


    +   - Encapsulation

    +   - Inheritance

    +   - Polymorphism


    The entire C# class model is built on top of the Virtual Object System (VOS) of
    the .NET Framework


    In C#, everything is an object. There are no more global functions, variables
    and constants.'
