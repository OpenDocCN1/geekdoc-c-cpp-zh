  md: "C# supports a feature known as using directive that can be used to import the\
    \ namespace System into the program. Once a namespace is imported, we can use\
    \ the elements of that namespace without using the namespace as prefix. This is\
    \ illustrated in Program 3.2.\n\n# Program 3.2 | A PROGRAM USING NAMESPACES AND\
    \ COMMENTS\n\n```\n/*\nThis program uses namespaces and comment lines\n*/\nusing\
    \ System; // System is a namespace\nclass SampleTwo\n{\n    // Main method begins\n\
    \    public static void Main()\n    {\n        Console.WriteLine(\"Hello!\");\n\
    \    }\n    // Main method ends\n}\n```\n\nNote that the first statement in the\
    \ program is using System;\n\nThis tells the compiler to look in the System library\
    \ for unresolved class names. Note that we have not used the System prefix to\
    \ the Console class in the output line.\n\nWhen the compiler parses the Console.WriteLine\
    \ method, it will understand that the method is undefined. However, it will then\
    \ search through the namespaces specified in using directives and, upon finding\
    \ the method in the System namespace, will compile the code without any complaint.\n\
    \n# 3.4 ADDING COMMENTS\n\nComments play a very important role in the maintenance\
    \ of programs. They are used to enhance readability and understanding of code.\
    \ All programs should have information such as implementation details, change\
    \ history and tasks performed. C# permits two types of comments, namely:\n\n+\
    \   - Single-line comments\n+   - Multiline comments\n\nProgram 3.2 illustrates\
    \ the use of these two approaches.\n\nSingle-line comments begin with a double\
    \ backslash ( // ) symbol and terminate at the end of the line. We can use //\
    \ on a line of its own or after a code statement. This can also be used to comment\
    \ out an entire line or part of a line of source code. Everything after the //\
    \ on a line is considered a comment."
