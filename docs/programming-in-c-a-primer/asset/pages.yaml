    \na/b, when a and b are integer types, gives the result of division of a by b\
    \ after truncating the divisor. This operation is called integer division.\n\n\
    For modulo division, the sign of the result is always the sign of the first operand\
    \ (the dividend). That is\n\n-14 % 3 = -2\n-14 % -3 = -2\n14 % -3 = 2\n\n> (Note\
    \ that modulo division is defined as: a%b = a - (a/b)*b, where a/b is the integer\
    \ division).\n\n# 5.2.2 Real Arithmetic\n\nAn arithmetic operation involving only\
    \ real operands is called real arithmetic. A real operand may assume values either\
    \ in decimal or exponential notation. Since floating-point values are rounded\
    \ to the number of significant digits permissible, the final value is an approximation\
    \ of the correct result.\n\nUnlike C and C++, the modulus operator % can be applied\
    \ to the floating-point data as well. The floating-point modulus operator returns\
    \ the floating-point equivalent of an integer division. What this means is that\
    \ the division is carried out with both floating-point operands, but the resulting\
    \ divisor is treated as an integer, resulting in a floating-point remainder. The\
    \ result of a % b is computed as a-n*b, where n is the largest possible integer\
