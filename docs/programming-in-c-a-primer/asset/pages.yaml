    }\nstatic public void F2()        //static method\n{\n    Console.WriteLine(\"\
    F2\");\n}\n```\n\nSimilarly, the delegate\ndelegate double MathOp(double x, double\
    \ y);\ncan refer to any of the following methods:\n\n```\npublic static double\
    \ Multiply(double a, double b)\n{\n    return (a*b);\n}\npublic double Divide(double\
    \ a, double b)\n{\n    return (a/b);\n}\n```\n\nNote that in both the cases, the\
    \ signature and return type of methods match the signature and type of the delegate.\n\
    \n# 16.5 DELEGATE INSTANTIATION\n\nAlthough delegates are of class types and behave\
    \ like classes, C# provides a special syntax for instantiating their instances.\
    \ A delegate-creation-expression is used to create a new instance of a delegate.\n\
    \n```\nnew delegate-type (expression)\n```\n\nThe delegate-type is the name of\
    \ the delegate declared earlier whose object is to be created. The expression\
    \ must be a method name or a value of a delegate-type. If it is a method name\
    \ its signature and return type must be the same as those of the delegate. If\
    \ no matching method exists, or more than one matching method exists, an error\
    \ occurs. The matching method may be either an instance method or a static method.\
    \ If it is an instance method, we need to specify the instance as well as the\
    \ name of the method. If it is a static one, then it is enough to specify the\
    \ class name and the method name.\n\nThe method and the object to which a delegate\
    \ refers are determined when the delegate is instantiated and then remain constant\
    \ for the entire lifetime of the delegate. It is, therefore, not possible to change\
    \ them, once the delegate is created.\n\nIt is also not possible to create a delegate\
    \ that would refer to a constructor, indexer, or user-defined operator."
