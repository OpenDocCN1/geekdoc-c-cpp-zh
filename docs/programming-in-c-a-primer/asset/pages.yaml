    It is very important to note carefully, the order of precedence and associativity
    of operators. Consider the following conditional statement:

    if(x == 10+15 && y<10)


    The precedence rules say that the addition operator has a higher priority than
    the logical operator (&&) and the relational operators (== and <). Therefore,
    the addition of 10 and 15 is executed first. This is equivalent to:

    if(x == 25 && y<10)


    The next step is to determine whether x is equal to 25 and y is less than 10.
    If we assume a value of 20 for x and 5 for y, then

    x == 25 is false

    y < 10 is true


    Note that since the operator < enjoys a higher priority compared to ==, y < 10
    is tested first and then x ==25 is tested.


    Finally we get:

    if(false && true)

    Because one of the conditions is false, the compound condition is false.


    When an operand occurs between two operators with the same precedence, the associativity
    of the operators controls the order in which the operations are performed:


    +   - Except for the assignment operators, all binary operators are left-associative.
    For example, x + y + z is evaluated as (x + y) + z'
