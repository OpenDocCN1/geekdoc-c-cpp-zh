  md: "Program 14.2 will output the following two lines:\nArea of Square = 100\nArea\
    \ of circle = 314.159265\n\nIn Program 14.2, we create an instance of each class\
    \ using the new operator. Then, we declare an object of type Area interface. Now,\
    \ we cast the Square object to the interface type using as operator as shown below:\n\
    area = sqr as Area;\n\nThen, the call\narea.Compute(10.0)\nwill invoke the Compute\
    \ method of Square class. We repeat a similar procedure with the Circle object.\n\
    \nNote that any number of classes can implement an interface. However, to implement\
    \ the methods, we need to refer to the class objects as types of the interface\
    \ rather than their respective classes.\n\n# 14.5 INTERFACES AND INHERITANCE\n\
    \nMost often we have situations where the base class of a derived class implements\
    \ an interface. In such situations, when an object of the derived class is converted\
    \ to the interface type, the inheritance hierarchy is searched until it finds\
    \ a class that directly implements the interface. Consider the code in Program\
    \ 14.3.\n\n# Program 14.3 INHERITING A CLASS THAT IMPLEMENTS AN INTERFACE\n\n\
    ```\nusing System;\ninterface Display\n{\n    void Print ( );\n}\nclass B : Display\
    \  // implements Display\n{\n    public void Print ()\n    {\n        Console.WriteLine(\"\
    Base Display\");\n    }\n}\nclass D : B      // inherits B class\n{\n    public\
    \ new void Print ()\n    {\n        Console.WriteLine(\"Derived Display\");\n\
    \    }\n}\nclass InterfaceTest3\n{\n    public static void Main()\n    {\n   \
    \     D d = new D ();\n        d.Print ();\n    }\n```"
