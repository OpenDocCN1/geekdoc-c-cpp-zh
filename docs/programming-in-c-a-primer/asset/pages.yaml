  md: '# 9


    # Handling Arrays


    # 9.1 Introduction


    An array is a group of contiguous or related data items that share a common name.
    For instance, we can define an array name marks to represent a set of marks of
    a class of students. A particular value is indicated by writing a number called
    index number or subscript in brackets after the array name. For example,

    marks[10]

    represents the marks obtained by the 10th student. While the complete set of values
    is referred to as an array, the individual values are called elements. Arrays
    can be of any variable type.


    The ability to use a single name to represent a collection of items and to refer
    to an item by specifying the item number enables us to develop concise and efficient
    programs. For example, a loop with the subscript as the control variable can be
    used to read the entire array, perform calculations and print out the results.


    # 9.2 ONE-DIMENSIONAL ARRAYS


    A list of items can be given one variable name using only one subscript and such
    a variable is called a single-subscripted variable or a one-dimensional array.
    In mathematics, we often deal with variables that are single-subscripted. For
    instance, we use the equation


    A = ( Σ_{i=1}^{n} x_i ) / n


    to calculate the average of n values of x. The subscripted variable x_i refers
    to the ith element of x. In C#, a single-subscripted variable x_i can be expressed
    as

    x[1], x[2], x[3] ........ x[n]


    The subscript can begin with number 0. That is

    x[0]

    is allowed. For example, if we want to represent a set of five numbers, say (35,40,20,57,19),
    by an array variable number, then we may create the variable number as follows

    int [] number = new int[5];


    and the computer reserves five storage locations as shown below:'
