- pgno: 97
  md: '# Decision Making and Branching


    # 6.1 Introduction


    A C# program is a set of statements that are normally executed sequentially in
    the order in which they appear. This happens when options or repetitions of certain
    calculations are not necessary. However, in practice, we have a number of situations,
    where we may have to change the order of execution of statements based on certain
    conditions, or repeat a group of statements until certain specified conditions
    are met. This involves a kind of decision-making to see whether a particular condition
    has occurred or not and then to direct the computer to execute certain statements
    accordingly.


    When a program breaks the sequential flow and jumps to another part of the code,
    it is called branching. When the branching is based on a particular condition,
    it is known as conditional branching. If branching takes place without any decision,
    it is known as unconditional branching.


    C# language possesses such decision-making capabilities and supports the following
    statements known as control or decision-making statements.


    +   1. if statement

    +   2. switch statement

    +   3. Conditional operator statement


    In this chapter, we shall discuss the features, capabilities and applications
    of these statements which are classified as selection statements.


    # 6.2 DECISION MAKING WITH IF STATEMENT


    The if statement is a powerful decision-making statement and is used to control
    the flow of execution of statements. It is a two-way decision statement and is
    used in conjunction with an expression. It takes the following form:


    ```

    If(expression)

    ```


    It allows the computer to evaluate the expression first and then, depending on
    whether the value of the expression (relation or condition) is ‘true’ or ‘false’,
    it transfers the control to a particular statement. The program at this point
    has two paths to follow, one for the true condition and the other for the false
    condition as shown in Fig. 6.1.


    Some examples of decision making, using the if statement are:


    +   1. if (bank balance is zero)

    +      borrow money

    +   2. if (room is dark)

    +      put on lights


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_97_0.png)'
