    # Case Study


    # ProblemStatement


    E-Store is an online store available on the Internet that is involved in the sale
    of household products such as jams and sauces. Users surfing the Internet are
    currently able to only view the products sold by E-Store. The management of the
    organisation, which has hosted the E-Store online store on the Internet, has now
    decided that the users must have the facility of selecting a product from the
    E-Store and placing it in a shopping chart. It is important that the users have
    the facility of a shopping chart while surfing the E-Store online store because
    it will encourage more customers to purchase products from E-Store. How can the
    management add the functionality of a shopping chart to the E-Store?


    # Solution


    In order to add the facility of a shopping chart to the E-Store online store,
    the organisation which has hosted E-Store on the Internet, contacts Web Solutions
    Private Limited. Web Solutions Private Limited is involved in creating Web based
    applications, which can be hosted on the Internet. The programmers at Web Solutions
    Private Limited first design a page Default.aspx to allow users to enter their
    details such as name and address and select products for purchase using Microsoft
    Visual Studio 2005 as shown below.'
