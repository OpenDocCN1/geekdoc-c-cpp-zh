  md: "# 9.6 THE SYSTEM.ARRAY CLASS\n\nIn C#, every array we create is automatically\
    \ derived from the System.Array class. This class defines a number of methods\
    \ and properties that can be used to manipulate arrays more efficiently. Table\
    \ 9.1 lists some of the commonly used methods and their purpose.\n\n# Table 9.1\
    \ Some commonly used methods of System.Array class\n\n| METHOD/PROPERTY | PURPOSE\
    \ |\n|---|---|\n| Clear () | Sets a range of elements to empty values |\n| CopyTo\
    \ () | Copies elements from the source array into the destination array |\n| GetLength\
    \ () | Gives the number of elements in a given dimension of the array |\n| GetValue\
    \ () | Gets the value for a given index in the array |\n| Length | Gives the length\
    \ of an array |\n| SetValue () | Sets the value for a given index in the array\
    \ |\n| Reverse () | Reverses the contents of a one-dimensional array |\n| Sort\
    \ () | Sorts the elements in a one-dimensional array |\n\nProgram 9.3 illustrates\
    \ the implementation of Sort () and Reverse () methods.\n\n# Program 9.3 SORTING\
    \ AND REVERSING AN ARRAY\n\n```\nusing System;\nclass SortReverse\n{\n    public\
    \ static void Main()\n    {\n        //creating an array\n        int [] x = {\
    \ 30, 10, 80, 90, 20 };\n        Console.WriteLine (\"Array before sorting\");\n\
    \        foreach (int i in x)\n            Console.Write(\" \" + i );\n      \
