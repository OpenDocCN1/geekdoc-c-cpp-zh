- pgno: 12
  md: '# Preface to the Third Edition


    It gives me great pleasure to present the third edition of Programming in C#.
    During the years that the second edition has been in circulation, I have received
    a lot of favourable responses, comments and suggestions, and I have tried to keep
    them in mind while preparing the script of the third edition. The new edition
    has been updated and now contains enhanced topics and pedagogical features.


    # Target Audience


    As stated earlier, this book has not been written keeping any specific syllabus
    in mind, rather it can be used by any one who is desirous of developing C# programs
    and will be very useful for the first course in C# taken by undergraduate students
    in Computers and Information Technology.


    # New to this Edition


    The third edition has been enriched with inclusions of new topics and projects.
    These additions will provide more depth and wider coverage of topics and help
    the readers in developing new applications on their own. The revised edition maintains
    the lucid flow and continuity which has been the strength of the book. The topics
    and the script in itself are well-graded and it takes the student through a step-by-step
    process, starting from simple programming problems to more complex and difficult
    ones. The specific improvements in this edition are the following:


    +   - New topics on

    +     - Winforms (in Chapter 20)

    +     - The CLR and .Net Framework (as Appendix)

    +     - Building C# Applications (as Appendix)

    +   - Elaborated coverage on Debugging

    +   - Three new projects: 2 minor (Project Planner, Task Actions) and 1 major
    (Voting Control for Asp.Net)

    +   - Program codes written in C# version 2005

    +   - Uses validated HTML coding (part of Web 2.0) used in the examples

    +   - Two sample programs in each chapter using latest version of C#

    +   - Stepwise solution provided for Case Study given in each chapter

    +   - Strong pedagogy including

    +     - Over 100 Example programs

    +     - 20 Solved Case Studies

    +     - Over 350 Review Questions'
  merge: -1
  img_proc: true
- pgno: 13
  md: '+   - Over 150 Programming Exercises

    +   - Over 40 Debugging Exercises


    # Organization of the Book


    The book has been divided into twenty chapters. Chapter 1 introduces the C# language,
    its development, characteristics and evolution. Chapter 2 details the .NET Framework,
    its benefits and the relationship between C# and .NET. Chapter 3 introduces the
    reader to the first steps of building a C# program.


    Chapters 4 to 7 define literals, variables, data types, operators, expressions,
    decision making, branching and looping statements and how to use these in C# programs.
    Chapter 8 discusses declaring, invoking, nesting of methods and method overloading.
    Chapter 9 explains creation of arrays and the different types of arrays. Chapter
    10 demonstrates string manipulation and Chapter 11 is on structures and enumerations.


    The basic principles of object-oriented programming, classes, objects, constructors
    and destructors, are covered in Chapter 12. Chapter 13 lucidly explains the concepts
    of inheritance and polymorphism in C# and Chapter 14 goes a bit further to introduce
    interfaces and multiple inheritance. Operator overloading is covered in Chapter
    15 while delegates and events are discussed in Chapter 16. Chapter 17 deals with
    managing console I/O operations and their standard numeric format and custom numeric
    format. Chapter 18 elucidates the various types of errors and exceptions occurring
    in C# and explains how to manage them. Chapter 19 extensively covers the concept
    of multithreading and finally, Chapter 20 discusses WindowForms and Web-based
    applications, and their development in .NET. One major project (on Voting Control
    for Asp.Net) and two minor projects (on Project Planner and Task Actions) have
    been introduced as appendices A, B and C in this edition. The projects are elaborate
    case studies in themselves and offer ample hands-on practice to students at developing
    real-life C# applications.


    The Common Language Runtime (CLR) is the virtual machine component of the .NET
    framework. All .NET programs execute under the supervision of CLR, guaranteeing
    certain properties and behaviours in the areas of memory management, security
    and exception handling. Hence, a brief introduction to CLR and the .NET framework
    is given in Appendix D. Appendix E explains how to create and write a C# application.


    # Web Supplements


    The online learning center can be accessed at the http://www.mhhe.com/balagurusamy/csharp3e.
    It has exhaustive content which will be very useful for both instructors and students.


    +   - Downloadable programs for students

    +   - Exclusive 3 major projects (Employee Management System, Basic IO Example,
    Voting Control using Asp.Net) and 3 mini projects (Calculate Example, Random Number
    Application, Project Planner) for implementation with code, step-by-step description
    and user manual

    +   - Chapterwise case studies

    +   - Web links to more information on C#'
