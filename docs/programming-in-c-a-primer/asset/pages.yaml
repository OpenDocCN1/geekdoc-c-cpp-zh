  md: "# 13.8 HIERARCHICAL INHERITANCE\n\nAnother interesting application of inheritance\
    \ is to use it as a support to the hierarchical design of a program. Many programming\
    \ problems can be cast into a hierarchy where certain features of one level are\
    \ shared by many others below the level. An an example, Fig. 13.7 shows a hierarchical\
    \ classification of accounts in a commercial bank. This is possible because all\
    \ the accounts possess certain common features.\n\n![](img/bae4ee2c7c29c052feb3b9a9c5659998_257_0.png)\n\
    \n# 13.9 OVERRIDING METHODS\n\nWe have seen that a method defined in a superclass\
    \ is inherited by its subclass and is used by the objects created by the subclass.\
    \ Method inheritance enables us to define and use methods repeatedly in subclasses.\n\
    \nHowever, there may be occasions when we want an object to respond to the same\
    \ method but behave differently when that method is called. That means, we should\
    \ override the method defined in the superclass. This is possible by defining\
    \ a method in the subclass that has the same name, same arguments and same return\
    \ type as a method in the superclass. Then, when that method is called, the method\
    \ defined in the subclass is invoked and executed instead of the one in the superclass,\
    \ provided that:\n\n+   - We specify the method in base class as virtual\n+  \
    \ - Implement the method in subclass using the keyword override\n\nThis is known\
    \ as overriding. Program 13.4 illustrates the concept of overriding.\n\n# Program\
    \ 13.4 ILLUSTRATION OF METHOD OVERRIDING\n\n```\nusing System;\nclass Super  \
    \              //base class\n{\n    protected int x;\n    public Super (int x)\n\
    \    {\n        this.x = x;\n    }\n}\npublic virtual void Display () // method\
    \ defined with virtual\n{\n    Console.WriteLine (\"Super x = \" + x);\n\n```"
