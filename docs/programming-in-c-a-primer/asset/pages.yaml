    # 2.1 THE .NET STRATEGY


    We briefly discussed in the previous chapter how C# was created as a language
    for developing systems for the .NET platform. As pointed out, Microsoft wanted
    to make the World Wide Web (WWW) more vibrant by enabling individual devices,
    computers and web services to work together intelligently to provide richer solutions
    to users. By the intelligent integration of web sites on the Internet, users can
    create a wide variety of value-based applications such as unified banking services,
    electronic bill payment, stock trading, insurance services and comprehensive supply
    chain management. Microsoft calls this ‘Web services’ and the software strategy
    for implementing and delivering these services is ‘.NET’.


    .NET is a software framework that includes everything required for developing
    software for web services. It integrates pre-sentation technologies, component
    tech-nologies and data technologies on a single platform so as to enable users
    to develop Internet applications as easily as they do on desktop systems. Microsoft
    took many of the best ideas in the industry, added their own creativity and innovations
    and produced a coherent systems solution popularly known as Microsoft .NET. The
    Microsoft .NET software solution strategy includes three key approaches as shown
    in Fig. 2.1.


    Microsoft .NET platform includes the following components that would help develop
