  md: '# 10.5 COMPARING STRINGS


    String class supports overloaded methods and operators to compare whether two
    strings are equal or not. They are:


    +   - Overloaded Compare() method

    +   - Overloaded Equals() method

    +   - Overloaded == operator


    # 10.5.1 Compare() Method


    There are two versions of overloaded static Compare method. The first one takes
    two strings as parameters and compares them. Example:

    int n = string.Compare(s1,s2);


    This performs a case-sensitive comparison and returns different integer values
    for different conditions as under:


    +   - Zero integer, if s1 is equal to s2

    +   - A positive integer (1), if s1 is greater than s2

    +   - A negative integer (-1), if s1 is less than s2


    For example, if s1 = "abc" and s2 = "ABC", then n will be assigned a value of
    -1. Remember, a lowercase letter has a smaller ASCII value than an uppercase letter.


    We can use such comparison statements in if statements like:

    if ( string.Compare(s1, s2) == 0 )

    ( Console.WriteLine("They are equal");


    The second version of Compare takes an additional bool type parameter to decide
    whether case should be ignored or not. If the bool parameter is true, case is
    ignored. Example:

    int n = string.Compare(s1, s2, true);'
