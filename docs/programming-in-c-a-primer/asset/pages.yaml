  md: '# Overview of C#


    # 3.1 Introduction


    ''C#'' seems a strange name for a modern programming language. Perhaps Microsoft
    named their new language ''C sharp'' because they wanted it to be better, smarter
    and ''sharper'' than its ancestors C and C++. C# is designed to bring rapid development
    to C++ programmers without sacrificing the power and control that have been the
    hallmarks of C and C++. C# is the only language designed specially for the .NET
    platform which provides tools and services that fully exploit both computing and
    communications.


    Since one of the designers of C# (Anders Hejlsberg) was a Java expert, it is natural
    that many Java features have been incorporated into the design of C#. In fact,
    in many cases, the C# code may bear a striking resemblance to the functionally
    equivalent Java code. Unlike C++, both Java and C# promote a one-stop coding approach
    to code maintenance. They group classes, interfaces and implementations together
    in one file so that programmers can edit the code more easily.


    C# can be used to develop two categories of programs, namely,


    +   - Executable application programs and

    +   - Component libraries


    as illustrated in Fig. 3.1. Executable programs are written to carry out certain
    tasks and require the method Main in one of the classes. In contrast, component
    libraries do not require a Main declaration because they are not standalone application
    programs. They are written for use by other applications. This concept is something
    similar to applets and application programs in Java.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_35_0.png)


    # 3.2 A SIMPLE C# PROGRAM


    The best way to learn a new language like C# is to write a few simple programs
    and execute them. This will enable us to analyze and understand how C# programs
    work. We begin with a very simple program that displays a line of text. Consider
    the code given in Program 3.1.'
