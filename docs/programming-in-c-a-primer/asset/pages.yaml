  md: "# SCOPE OF VARIABLES\n\nOne scope of a variable is the region of code within\
    \ which the variable can be accessed. This depends on the type of the variable\
    \ and place of its declaration. C# defines several categories of variables. They\
    \ include:\n\n+   - Static variables\n+   - Instance variables\n+   - Array elements\n\
    +   - Value parameters\n+   - Reference parameters\n+   - Output parameters\n\
