  md: "# 18.9 USING FINALLY STATEMENT\n\nC# supports another statement known as a\
    \ finally statement that can be used to handle an exception that is not caught\
    \ by any of the previous catch statements. A finally block can be used to handle\
    \ any exception generated within a try block. It may be added immediately after\
    \ the try block or after the last catch block shown as follows:\n\n```\ntry\n\
    {\n    ..........\n    ..........\n}\nfinally\n{\n    ..........\n    ..........\n\
    }\n```\n\n```\ntry\n{\n    ..........\n    ..........\n}\ncatch (...)\n{\n   \
    \ ..........\n    ..........\n}\ncatch (...)\n{\n    ..........\n    ..........\n\
    }\n...\n...\nfinally\n{\n    ..........\n    ..........\n}\n```\n\nWhen a finally\
    \ block is defined, the program is guaranteed to execute, regardless of how control\
    \ leaves the try, whether it is due to normal termination, due to an exception\
    \ occurring or due to a jump statement. Figure 18.3 illustrates this. As a result,\
    \ we can use it to perform certain house-keeping operations such as closing files\
    \ and releasing system resources.\n\nIn Program 18.4, we may include the last\
    \ two statements inside a finally block as shown below:\n\n```\nfinally\n{\n \
    \   int y = a[1]/a[0];\n    Console.WriteLine(\"y = \" +y);\n}\n```\n\nThis will\
    \ produce the same output.\n\n![](img/bae4ee2c7c29c052feb3b9a9c5659998_361_0.png)\n\
    \nFig. 18.3 Execution paths of try-catch-finally blocks"
  merge: -1
  img_proc: true
- pgno: 362
  md: "# 18.10 NESTED TRY BLOCKS\n\nC# permits us to nest try blocks inside each other.\
    \ Example:\n\n```\ntry\n{\n    .... (Point P1)\n    ....\n    try\n    {\n   \
    \     .... (Point P2)\n        ....\n    }\n    catch\n    {\n        .... (Point\
    \ P3)    Inner try block\n        ....\n    }\n    finally\n    {\n        ....\n\
    \        3 ....\n    }\n    .... (Point P4)\n    ....\n}\ncatch\n{\n    ....\n\
    }\nfinally\n{\n    ....\n}\n```\n\nFor simplicity, we have shown only one catch\
    \ handler in each try block. However, we can string several catch handlers together\
    \ in each place.\n\nWhen nested try blocks are executed, the exceptions that are\
    \ thrown at various points are handled as follows:\n\n+   - The points P1 and\
    \ P4 are outside the inner try block and therefore any exceptions thrown at these\
    \ points will be handled by the catch in the outer block. The inner block is simply\
    \ ignored.\n+   - Any exception thrown at point P2 will be handled by the inner\
    \ catch handler and the inner finally will be executed. The execution will continue\
    \ at point P4 in the program.\n+   - If there is no suitable catch handler to\
    \ catch an exception thrown at P2, the control will leave the inner block (after\
    \ executing the inner finally) and look for a suitable catch handler in the outer\
    \ block. If a suitable one is found, then that handler is executed followed by\
    \ the outer finally code. Remember, the code at point P4 will be skipped.\n+ \
    \  - If an exception is thrown at point P3, it is treated as if it had been thrown\
    \ by the outer try block and, therefore, the control will immediately leave the\
    \ inner block (of course, after executing the inner finally) and search for a\
    \ suitable catch handler in the outer block."
  merge: -1
  img_proc: true
