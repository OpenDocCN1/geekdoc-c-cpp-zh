- pgno: 207
  md: "# 11\n\n# Structures and Enumerations\n\n# 11.1 Introduction\n\nWe have already\
    \ seen that C# supports two kinds of value types, namely, predefined types and\
    \ user-defined types. We have defined and used the predefined data types such\
    \ as int and double throughout our earlier discussions. C# allows us to define\
    \ our own complex value types (known as user-defined value types) based on these\
    \ simple data types. There are two sorts of value types we can define in C#:\n\
    \n+   - Structures\n+   - Enumerations\n\nAs we know, value type variables store\
    \ their data on the stack and therefore the structures and enumerations are stored\
    \ on the stack.\n\nWe shall discuss here briefly how these data types are defined\
    \ and used in programming.\n\n# 11.2 STRUCTURES\n\nStructures (often referred\
    \ to as structs) are similar to classes in C#. Although classes will be used to\
    \ implement most objects, it is desirable to use structs where simple composite\
    \ data types are required. Because they are value types stored on the stack, they\
    \ have the following advantages compared to class objects stored on the heap:\n\
    \n+   - They are created much more quickly than heap-allocated types.\n+   - They\
    \ are instantly and automatically deallocated once they go out of scope.\n+  \
    \ - It is easy to copy value type variables on the stack.\n\nThe performance of\
    \ programs may be enhanced by judicious use of structs.\n\n# 11.2.1 Defining a\
    \ Struct\n\nA struct in C# provides a unique way of packing together data of different\
    \ types. It is a convenient tool for handling a group of logically related data\
    \ items. It creates a template that may be used to define its data properties.\
    \ Once the structure type has been defined, we can create variables of that type\
    \ using declarations that are similar to the built-in type declarations.\n\nStructs\
    \ are declared using the struct keyword. The simple form of a struct definition\
    \ is as follows:\n\n```\nstruct struct-name\n{\n    data member1;\n    data member2;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "Example:\n\n```\nstruct Student\n{\n    public string Name;\n    public int\
    \ RollNumber;\n    public double TotalMarks;\n}\n```\n\nThe keyword struct declares\
    \ Student as a new data type that can hold three variables of different data Types.\
    \ These variables are known as members or fields or elements. The identifier Student\
    \ can now be used to create variables of type Student. Example:\n\n```\nStudent\
    \ s1;  //declare a student\n```\n\ns1 is a variable of type Student and has three\
    \ member variables as defined by the template.\n\n# 11.2.2 Assigning Values to\
    \ Members\n\nMember variables can be accessed using the simple dot notation as\
    \ follows:\n\n```\ns1.Name     = \"John\";\ns1.RollNumber = 999 ;\ns1.TotalMarks\
    \ = 575.50 ;\n```\n\nWe may also use the member variables in expressions on the\
    \ right-hand side. Example:\n\n```\nFinalMarks  =  s1.TotalMarks + 5.0 ;\n```\n\
    \n# 11.2.3 Copying Structs\n\nWe can also copy values from one struct to another.\
    \ Example:\n\n```\nStudent s2; // s2 is declared\ns2 = s1 ;\n```\n\nThis will\
    \ copy all those values from s1 to s2.\n\nNote that we can also use the operator\
    \ new to create struct variables.\n\n```\nStudent s3 = new Student ();\n```\n\n\
    A struct variable is initialized to the default values of its members as soon\
    \ as it is declared.\n\nNote that struct's data members are 'private' by default\
    \ and therefore cannot be accessed outside the struct definition. The use of access\
    \ modifier public means that anyone can use the member. A member not declared\
    \ public cannot be accessed using the dot operator.\n\nExample:\n\n```\nstruct\
    \ ABC\n{\n    int a;          //private by default\n    public int b;\n    private\
    \ int c;  //explicitly declared as private\n}\n```\n\n```\nABC abc ;\nabc.a =\
    \ 10;  // Error, a is private\nabc.b = 20;  // OK, b is public\n```"
