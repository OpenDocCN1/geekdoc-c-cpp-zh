  md: "```\nclass C : B\n{\n    static void F1()\n    {\n        F(); //Invokes F()\
    \ of A\n    }\n}\n```\n\nSince the new F() in B has private access, its scope\
    \ does not extend to the class C. Thus, the call F() in C, which is valid, invokes\
    \ F() of A class.\n\n# 13.11 ABSTRACT CLASSES\n\nIn a number of hierarchical applications,\
    \ we would have one base class and a number of different derived classes. The\
    \ top-most base class simply acts as a base for others and is not useful on its\
    \ own. In such situations, we might not want any one to create its objects. We\
    \ can do this by making the base class abstract.\n\nThe abstract is a modifier\
    \ and when used to declare a class indicates that the class cannot be instantiated.\
    \ Only its derived classes (that are not marked abstract) can be instantiated.\
    \ Example:\n\n```\nabstract class Base\n{\n    ....\n}\n\nclass Derived : Base\n\
    {\n    ....\n}\n....\n....\n....\n```\n\n```\nBase b1;      //Error\nDerived d1;\
    \   //OK\n```\n\nWe cannot create objects of Base type but we can derive its subclasses\
    \ which can be instantiated.\n\nSome characteristics of an abstract class are:\n\
    \n+   - It cannot be instantiated directly\n\n+   - It can have abstract members\n\
    \n+   - We cannot apply a sealed modifier to it\n\n# 13.12 ABSTRACT METHODS\n\n\
    Similar to abstract classes, we can also create abstract methods. When an instance\
    \ method declaration includes the modifier abstract, the method is said to be\
    \ an abstract method.\n\nAn abstract method is implicitly a virtual method and\
    \ does not provide any implementation. Therefore, an abstract method does not\
    \ have method body. Example:\n\n```\npublic abstract void Draw(int x, int y);\n\
    ```\n\nNote that the method body simply consists of a semicolon. Some characteristics\
    \ of an abstract method are:"
