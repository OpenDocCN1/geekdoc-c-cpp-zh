- pgno: 263
  md: "```\npublic static void Main ()\n{\n\tDog dog = new Dog ();\n\tCat cat = new\
    \ Cat ();\n\tCall(dog); //invoking Call()\n\tCall(cat); //again invoking Call()\n\
    }\n```\n\nOutput of Program 13.6 would be:\n\nDog is called\nCat is called\n\n\
    Note that we have created two different Call() methods. One takes Dog type object\
    \ as a parameter and the other takes Cat type object. The result is:\n\n+   •\
    \ Call(dog) invokes the method Call(Dog d)\n+   • Call(cat) invokes the method\
    \ Call(Cat d)\n\nWith the operation polymorphism. the multiple forms occur at\
    \ the method level, rather than at class level. The same method name takes multiple\
    \ implementation forms.\n\n# 13.15.2 Casting Between Types\n\nLet us look at one\
    \ of the important aspects in the application of inheritance, namely, type casting\
    \ between classes. There are a number of situations where we need to apply casting\
    \ between the objects of base and derived classes. C# permits upcasting of an\
    \ object of a derived class to an object of its base class. However, we cannot\
    \ downcast implicitly an object of a base class to an object of its derived classes.\n\
    \nExamples:\n\n```\nclass Base { }\nclass Derived : Base { }\n\nBase b = new Derived\
    \ (); //OK, upcasting\n\n\nDerived d = new Base (); //ERROR, downcasting\n```\n\
    \nIn case a downcast is required, it can be achieved using an explicit cast operation.\n\
    \n# 13.15.3 Inclusion Polymorphism\n\nInclusion polymorphism is achieved through\
    \ the use of virtual functions. Assume that the class A implements a virtual method\
    \ M and classes B and C that are derived from A override the virtual method M.\
    \ When B is cast to A, a call to the method M from A is dispatched to B. Similarly,\
    \ when C is cast to A, a call to M is dispatched to C. The decision on exactly\
    \ which method to call is delayed until runtime and, therefore, it is also known\
    \ as runtime polymorphism. Since the method is linked with a particular class\
    \ much later after compilation, this process is termed late binding. It is also\
    \ known as dynamic binding because the selection of the appropriate method is\
    \ done dynamically at runtime. Program 13.7 illustrates the use of virtual methods\
    \ to implement polymorphic behaviour of objects."
