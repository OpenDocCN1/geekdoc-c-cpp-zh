  md: '# Appendix


    # C


    # Major Project:

    Voting Control for Asp.Net


    # Objective


    This application creates a custom voting control for ASP.NET Web applications.
    The objective is to encapsulate the entire functionality of voting or polling
    procedure inside a custom user-defined control so that it can be reutilized across
    different Web applications with ease. The various steps involved in the creation
    of the voting control application are:


    +   1. Creating the Web site

    +   2. Creating the Web user control (.ascx file)

    +   3. Registering the control in the Web.Config file

    +   4. Using the custom control in Default.aspx Web page

    +   5. Running the Web site


    # CREATING THE WEB SITE


    To create the Web site, you need to perform the following steps:


    +   1. Open Microsoft Visual Studio and select File → New → Web Site to display
    the New Web Site dialog box, as shown on next page:'
