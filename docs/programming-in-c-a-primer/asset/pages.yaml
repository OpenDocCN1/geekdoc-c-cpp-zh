  md: '# 9.4 TWO-DIMENSIONAL ARRAYS


    So far we have discussed the array variables that can store a list of values.
    There will be situations where a table of values will have to be stored. Consider
    the following data table, which shows the value of sales of three items by four
    salesgirls:


    | | Item1 | Item2 | Item3 |

    |---|---|---|---|

    | Salesgirl #1 | 310 | 275 | 365 |

    | Salesgirl #2 | 210 | 190 | 325 |

    | Salesgirl #3 | 405 | 235 | 240 |

    | Salesgirl #4 | 260 | 300 | 380 |


    The table contains a total of twelve values, three in each line. We can think
    of this table as a matrix consisting of four rows and three columns. Each row
    represents the value of sales made by a particular salesgirl and each column represents
    the value of sales of a particular item.


    In mathematics, we represent a particular value in a matrix by using two subscripts
    such as v_ij. Here v denotes the entire matrix and v_ij refers to the value in
    the ith row and jth column. For example, in the above table v_23 refers to the
    value 325. C# allows us to define such tables of items by using two-dimensional
    arrays. The table discussed above can be represented in C# as v[4,3]


    Two-dimensional arrays are stored in memory as shown in Fig. 9.2. As with the
    one-dimensional arrays, each dimension of the array is indexed from zero to its
    maximum size minus one; the first index selects the row and the second index selects
    the column within that row.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_167_0.png)


    Fig. 9.2 Representation of a two-dimensional array in memory


    For creating two-dimensional arrays, we must follow the same steps as that of
    simple arrays. We may create a two-dimensional array like this:


    ```

    int[,] myArray;

    myArray = new int[3,4];

    ```'
