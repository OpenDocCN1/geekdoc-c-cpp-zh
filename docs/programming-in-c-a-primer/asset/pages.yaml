  md: "# # HIDING A BASE CLASS METHOD\n\n```\nusing System;\nclass Base\n{\n\tpublic\
    \ void Display()\n\t{\n\t\tConsole.WriteLine(\"Base Method\");\n\t}\n}\nclass\
    \ Derived : Base\n{\n\tpublic new void Display()  // hides base method\n\t{\n\t\
    \tConsole.WriteLine(\"Derived Method\");\n\t}\n}\nclass HideTest\n{\n\tpublic\
    \ static void Main()\n\t{\n\t\tDerived d = new Derived();\n\t\td.Display();\n\t\
    }\n}\n```\n\nProgram 13.5 would display the following:\n\nDerived Method\n\nThe\
    \ new modifier indicates that the Display() in Derived is \"new\", and it is intended\
    \ to hide the inherited member.\n\nNote however that hiding an inherited member\
    \ using new does not remove the member; it only makes the member inaccessible\
    \ in the derived class. If the new modifier is used in a declaration of a member\
    \ that does not hide any inherited member, then the compiler will issue a warning.\
    \ It is an error to use both the new and override modifiers in the same declaration\
    \ although they independently achieve the same effect.\n\nA declaration of a new\
    \ method hides an inherited method only within the scope of the \"new\" member.\n\
    \nExample:\n\n```\nclass A\n{\n\tpublic static void F()\n\t{\n\t}\n}\nclass B\
    \ : A\n{\n\tnew private static void F()\n\t{\n\t}\n}\n```"
