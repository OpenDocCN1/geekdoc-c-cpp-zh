- pgno: 58
  md: '# 4.5.1 Integral Types


    Integral types can hold whole numbers such as 123, -96 and 5639. The size of the
    values that can be stored depends on the integral data type we choose. C# supports
    the concept of unsigned types and therefore it supports eight types of integers
    as shown in Figs 4.4 and 4.5.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_58_0.png)


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_58_1.png)


    # 4.5.2 Signed Integers


    Signed integer types can hold both positive and negative numbers. Table 4.3 shows
    the memory size and range of all the four signed integer data types. (Note that
    one byte is equal to eight bits).


    | TYPE | SIZE | MINIMUM VALUE | MAXIMUM VALUE |

    |------|------|---------------|---------------|

    | sbyte | One byte | -128 | 127 |

    | short | Two bytes | -32,768 | 32,767 |

    | int | Four bytes | -2,147,483,648 | 2,147,483,647 |

    | long | Eight bytes | -9,223,372,036,854,775,808 | 9,223,372,036,854,775,807
    |


    It should be remembered that wider data types require more time for manipulation
    and therefore it is advisable to use smaller data types wherever possible. For
    example, instead of storing a number like 50 in an int type variable, we must
    use a sbyte variable to handle this number. This will improve the speed of execution
    of the program.


    # 4.5.3 Unsigned Integers


    We can increase the size of the positive value stored in an integer type by making
    it ''unsigned''. For example, a 16-bit short integer can store values in the range
    -32,768 to 32,767. However, by making it ushort, it can handle values in the range
    0 to 65,535. Table 4.4 shows the size and range of all the four unsigned integer
    data types.


    | TYPE | SIZE | MINIMUM VALUE | MAXIMUM VALUE |

    |------|------|---------------|---------------|

    | byte | One byte | 0 | 255 |

    | ushort | Two bytes | 0 | 65,535 |

    | uint | Four bytes | 0 | 4,294,967,295 |

    | ulong | Eight bytes | 0 | 18,446,744,073,709,551,615 |'
