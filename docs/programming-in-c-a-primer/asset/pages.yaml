  md: '# 16


    # Delegates and Events


    # 16.1 Introduction


    In object-oriented programming, it is the usual practice for one object to send
    messages to other objects. However, in real-life applications, it is quite common
    for an object to report back to the object that was responsible for sending a
    message. This, in effect, results in a two-way conversation between objects. The
    methods used to call back messages are known as callback methods.


    Languages like C and C++ implement callback techniques using what are known as
    function pointers. Function pointers simply represent memory addresses and they
    do not include ‘type-safe’ information such as:


    +   - number of parameters

    +   - types of parameters

    +   - return type and

    +   - calling convention


    Further, in object-oriented programming, methods rarely exist in isolation. They
    are usually associated with a class instance before they can be called. Because
    of these problems, C# implements the callback technique in a much safer and more
    object-oriented manner, using a kind of object called delegate object.


    A delegate object is a special type of object that contains the details of a method
    rather than data. Delegates in C# are used for two purposes:


    +   - Callback

    +   - Event handling


    We shall discuss briefly how delegates are created and used in these applications.


    # 16.2 DELEGATES


    The dictionary meaning of delegate is “a person acting for another person”. In
    C#, it really means a method acting for another method. As pointed out earlier,
    a delegate in C# is a class type object and is used to invoke a method that has
    been encapsulated into it at the time of its creation. Creating and using delegates
    involve four steps. They include:


    +   - Delegate declaration

    +   - Delegate methods definition

    +   - Delegate instantiation

    +   - Delegate invocation


    A delegate declaration defines a class using the class System.Delegate as a base
    class. Delegate methods are any functions (defined in a class) whose signature
    matches the delegate signature exactly.'
