  md: '+   - Compilation of IL into native executable code

    +   - Providing metadata

    +   - Memory management (automatic garbage collection)

    +   - Enforcement of security

    +   - Interoperability with other systems

    +   - Managing exceptions and errors

    +   - Support for tasks such as debugging and profiling


    Figure 2.6 shows a flow chart of CLR activities that go on when an application
    is executed. The source code is compiled to IL while the metadata engine creates
    metadata information. IL and metadata are linked with other native code if required
    and the resultant IL code is saved. During execution, the IL code and any requirement
    from the base class library are brought together by the class loader. The combined
    code is tested for type-safety and then compiled by the JIT compiler to produce
    native machine code, which is sent to the runtime manager for execution.


    # 2.4.1 Common Type System (CTS)


    The .NET Framework provides multiple language support using the feature known
    as Common Type System that is built into the CLR. The CTS supports a variety of
    types and operations found in most programming languages and therefore calling
    one language from another does not require type conversions. Although C# is specially
    designed for the .NET platform, we can build .NET programs in a number of other
    languages including C++ and Visual Basic.


    # 2.4.2 Common Language Specification (CLS)


    The Common Language Specification defines a set of rules that enables interoperability
    on the .NET platform. These rules serve as a guide to third-party compiler designers
    and library builders. The CLS is a subset of CTS and therefore the languages supporting
    the CLS can use each others'' class libraries as if they are their own. Application
    Program Interfaces (APIs) that are designed following the rules of CLS can easily
    be used by all the .NET languages.


    # 2.4.3 Microsoft Intermediate Language (MSIL)


    MSIL, or simply IL, is an instruction set into which all the .NET programs are
    compiled. It is akin to assembly language and contains instructions for loading,
    storing, initializing and calling methods. When we compile a C# program or any
    program written in a CLS-compliant language, the source code is compiled into
    MSIL.


