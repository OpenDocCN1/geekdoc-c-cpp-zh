  md: '# 17.5 FORMATTED OUTPUT


    We can produce formatted output using the overloaded WriteLine() method. This
    method takes a string containing a format and a list of variables whose values
    have to be printed out. The general form of formatted WriteLine() method is:


    ```

    Console.WriteLine(format-string, v1, v2 ....);

    ```


    Format string contains both static text and markers which indicate:


    +   - Where the values are to be printed

    +   - How the values are to be formatted


    In its simplest form, a marker is an index number in curly brackets, that indicates
    which variable of the argument list is to be substituted. Examples:


    ```

    Console.WriteLine("Total is {0}", total);

    Console.WriteLine("Sum of {0} and {1} is {2}", a,b,c);

    ```


    In the examples, {0} represents the first argument in the list, {1} represents
    the second, and so on. For instance, if a = 100, b = 200 and c = a + b, then the
    second statement will display the following output:


    Sum of 100 and 200 is 300

    {0} {1} {2}

    a b c


    We can also specify a width for the value using the format: { n, w } Where n is
    the index number and w is the width for the value. If w is positive, the value
    will be printed right-justified in the width, and, if it is negative, the value
    will be left-justified. Example:


    ```

    int a = 45 ;

    int b = 976 ;

    int c = a + b ;

    Console.WriteLine ("{0,5}\n{1,5}\n- - - - -\n{2,5}", a,b,c);

    ```


    This will display the following output:


    45

    + 976

    -----

    1021


    Note how one WriteLine() statement prints four lines of output. This is due to
    use of line character ''\n'' in the format string.


    We can also print an array of objects using markers in a format string.


    Example:


    ```

    object [] array = { "abc", 12.3, 100, "123"};

    Console.WriteLine("Array:{0}, {1}, {2}, {3}", array);

    ```


    Program 17.3 illustrates how a format string is implemented for displaying a simple
    formatted output.'
