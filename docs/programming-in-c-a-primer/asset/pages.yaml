    # D.6 REMOTING


    Remoting is a little more advanced concept in which marshalling of objects happens
    across process and machine boundaries. To set up remoting, we need to create server-side
    remote objects to cater to the client (application) requests.


    # Understanding Server Object Types


    The type of remote object to be configured on the server side depends on the type
    of request expected from the client. The various types of server side objects
    are the following:


    +   - Single Call A single call object can service only one client request at
    a time. Thus, for multiple client requests, an equal number of single call objects
    are created.

    +   - Singleton A singleton object can service multiple client requests single-handedly.
    Such an object is created when it is required for the different clients to share
    data with each other.

    +   - Client-Activated Objects (CAO): Client-activated objects are server side
    objects that are instantiated only when a corresponding request is received from
    the client. Upon client''s request, an object reference is sent back to the client,
    which then uses a proxy to interact with the object. For each client request a
    new object is created. Thus different clients do not share data with each other.


    # Specifying a Server with an Interface


    The first step towards creating a server side remote object is to create its corresponding
    interface. The following code shows a simple interface for realizing a remote
    object:'
  merge: -1
