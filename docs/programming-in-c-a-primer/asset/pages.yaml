  md: '# 19.2.2 ThreadPool Class


    The ThreadPool class provides a pool of threads that helps us to perform tasks
    such as processing of asynchronous I/O and waiting on behalf of another thread.


    The ThreadPool class provides various methods, which we can use to perform tasks
    such as determining whether two thread pools are equal or not. Table 19.3 shows
    some of the important methods of the ThreadPool class.


    # Table 19.3 Methods of the ThreadPool class


    | METHOD | TASK |

    |---|---|

    | Equals | To determine whether two thread pools are equal or not. |

    | GetType | To obtain the type for the current thread pool. |

    | QueueUserWorkItem | To allow a method to be queued for execution. The method,
    which has been queued, executes when a thread pool thread is made available. |

    | SetMaxThreads | To specify the number of requests to the thread pool that can
    be concurrently active. |

    | SetMinThreads | To specify the number of idle threads that can be maintained
    by a thread pool for new requests. |


    # 19.2.3 Monitor Class


    The Monitor class provides control access to an object by granting a lock for
    the object to a single thread. When an object is locked for a thread then access
    to a specific program code is restricted. The Monitor class defines a few methods
    that allow us to perform tasks such as acquiring and releasing a lock for an object.
    Table 19.4 shows some of the important methods of the Monitor class.


    # Table 19.4 Methods of the Monitor class


    | METHOD | TASK |

    |---|---|

    | Enter | Allows a thread to obtain a lock on a specified object. |

    | Exit | Allows a thread to release a lock on a specified object. |

    | TryEnter | Allows a thread to try and obtain a lock on a specified object. |

    | Wait | Allows a thread to release the lock on an object and block the thread
    for the time period until which it again acquires the lock. |

    | GetType | Allows us to obtain the type for the current instance of the Monitor
    class. |


    # 19.2.4 Mutex Class


    A mutex is a synchronisation primitive that helps to perform interprocess synchronisation
    in C#. Mutex allows a thread to have exclusive access to shared resources. When
    a thread acquires a mutex, another thread, which wants to obtain the mutex, is
    suspended until the first thread releases the mutex.


    The Mutex class provides the Handle and SafeWaitHandle properties that can be
    used to retrieve the handle for the operating system. This class also provides
    the various methods, which allow us to perform tasks such as setting access control
    security for a mutex and opening a named mutex. Table 19.5 shows some of the important
    methods provided by the Mutex class.'
