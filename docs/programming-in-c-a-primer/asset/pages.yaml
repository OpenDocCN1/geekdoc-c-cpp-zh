  md: 'Some examples of the usage of logical expressions are:


    +   1. if (age > 55 && salary < 1000), give increment.

    +   2. if (number < 0 || number > 100), stop.


    # 5.5 ASSIGNMENT OPERATORS


    Assignment operators are used to assign the value of an expression to a variable.
    We have seen the usual assignment operator, ‘=’. In addition, C# has a set of
    ‘shorthand’ assignment operators which are used in the form

    v op= exp

    where v is a variable, exp is an expression and op is a C# binary operator. The
    operator op = is known as the shorthand assignment operator.


    The assignment statement

    v op= exp

    is equivalent to

    v = v op(exp);

    with v accessed only once. Consider an example

    x += y+1;

    This is same as the statement

    x = x+(y+1);


    The shorthand operator += means ‘add y+1 to x’ or ‘increment x by y+1’. For y
    = 2, the above statement becomes

    x += 3;

    and when this statement is executed, 3 is added to x. If the old value of x is,
    say 5, then the new value of x is 8. Some of the commonly used shorthand assignment
    operators are illustrated in Table 5.6.


    The use of shorthand assignment operators has three advantages:


    +   1. What appears on the left-hand side need not be repeated and therefore it
    becomes easier to write.

    +   2. The statement is more concise and easier to read.

    +   3. The use of shorthand operators results in a more efficient code.


    Table 5.6 Shorthand assignment operators


    | STATEMENT WITH SIMPLE ASSIGNMENT OPERATOR | STATEMENT WITH SHORTHAND OPERATOR
    |

    |---|---|

    | a = a+1 | a += 1 |

    | a = a-1 | a -= 1 |

    | a = a*(n+1) | a *= n+1 |

    | a = a/(n+1) | a /= n+1 |

    | a = a%b | a %= b |


    # 5.6 INCREMENT AND DECREMENT OPERATORS


    C# has two very useful operators not generally found in many other languages.
    These are the increment and decrement operators:

    ++ and --


    The operator ++ adds 1 to the operand while -- subtracts 1. Both are unary operators
    and are used in the following form:

    ++m; or m++;

    --m; or m--;

    ++m; is equivalent to m = m + 1; (or m += 1;)

