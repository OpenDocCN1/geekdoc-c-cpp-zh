- pgno: 54
  md: '# 4.2.1 Integer Literals


    An integer literal refers to a sequence of digits. There are two types of integers,
    namely, decimal integers and hexadecimal integers.


    Decimal integers consist of a set of digits, 0 through 9, preceded by an optional
    minus sign. Valid examples of decimal integer literals are:


    123 -321 0 654321


    Embedded spaces, commas and non-digit characters are not permitted between digits.
    For example,


    15 750 20,000 $1000


    are illegal numbers.


    A sequence of digits preceded by 0x or 0X is considered as a hexadecimal integer
    (hex integer). It may also include alphabets A through F or ''a'' through ''f''.
    A letter A through F represents the numbers 10 through 15. Following are the examples
    of valid hex integers.


    0X2 0X9F 0Xbcd 0x


    # 4.2.2 Real Literals


    Integer literals are inadequate to represent quantities that vary continuously,
    such as distances, heights, temperatures, prices and so on. These quantities are
    represented by numbers containing fractional parts like 17.548. Such numbers are
    called real (or floating point) numbers. Further examples of real literals are:


    0.0083 -0.75 435.36


    These numbers are shown in decimal notation, having a whole number followed by
    a decimal point and the fractional part, which is an integer. It is possible that
    the number may not have digits before the decimal point, or digits after the decimal
    point. That is,


    215. .95 -.71


    are all valid real literals.


    A real literal may also be expressed in exponential (or scientific) notation.
    For example, the value 215.65 may be written as 2.1565e2 in exponential notation.
    e2 means multiply by 10². The general form is:


    mantissa e exponent


    The mantissa is either a real number expressed in decimal notation or an integer.
    The exponent is an integer with an optional plus or minus sign. The letter ''e''
    separating the mantissa and the exponent can be written in either lowercase or
    uppercase. Since the exponent causes the decimal point to ''float'', this notation
    is said to represent a real number in floating-point form. Examples of legal floating-point
    literals are:


    0.65e4 12e-2 1.5e+5 3.18E3 -1.2E-1


    Embedded white (blank) space is not allowed in any numeric constant.


    Exponential notation is useful for representing numbers that are either very large
    or very small in magnitude. For example, 7500000000 may be written as 7.5E9 or
    75E8. Similarly, 0.000000368 is equivalent to -3.68E-7.


    A floating-point literal may thus comprise four parts:


    +   - a whole number

    +   - a decimal point


    +   - a fractional part

    +   - an exponent


    # 4.2.3 Boolean Literals


    There are two Boolean literal values:


    +   - true


    +   - false'
