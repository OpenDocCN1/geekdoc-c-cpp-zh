    +   - Web services


    These tools enable users to develop user-friendly desktop-based as well as web-based
    applications using a wide variety of languages on the .NET platform.


    ![](img/bae4ee2c7c29c052feb3b9a9c5659998_32_0.png)


    # 2.7 VISUAL STUDIO .NET


    Visual Studio .NET (VS .NET) supports an Integrated Development Environment (IDE)
    with a rich set of features and productivity tools. These features and tools allow
    developers to build web applications faster and easier. Using web services and
    XML regardless of the language chosen for development, there is now one environment
    to learn, configure and use. We need not have to switch back and forth between
    environments to build, debug and deploy our code. VS .NET provides tools that
    extends support to the development lifecycle. As shown in Fig. 2.7, it acts as
