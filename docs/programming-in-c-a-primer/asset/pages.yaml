    # Case Study


    # Problem Statement


    St. Peter''s School is a convent school that provides education from KG the 12th
    class. Quarterly, half yearly and final exams are conducted every year for students
    of all classes in the school. The class teacher of each class has to prepare a
    student report for every student after a particular exam has been conducted. Recently,
    it has been found by the principal of St. Peter''s School that a lot of time is
    being taken by class teachers in preparing the student reports. The principal
    has also found out that the efficiency of the teachers have decreased because
    they have been manually performing the task of preparing the student reports for
    each student. St. Peter''s has 600 students studying in its different classes.
    Preparing student reports for at least 30 students per class has become a tedious
    task for the class teacher of a specific class. How can the principal of St. Peter''s
    School solve the problem of the teachers?


    # Solution


    After holding meetings with senior teachers of the school, the principal of St.
    Peter''s School has come to the conclusion that the task of calculating total
    marks for preparing a student report must be automated through a software application
    running on a computer system. After coming to this conclusion, the principal of
    St. Peter''s School asks Nandita, who is teaching computer science to students
    of higher classes such as 9th, 10th, 11th and 12th to create the application for
    automating the calculation of total marks, the task that is performed by class
    teachers while preparing the student report. For this, Nandita first conducts
    an interview with the class teachers of different classes to understand their
    requirements. After the analysis of the requirements, Nandita decides to use the
    decision making and looping concepts of C# in an application to automate the task
    of calculating the total marks for each student of a class. Decision making and
    looping allow a programmer to decide the flow of control for a program or application.
    Nandita creates the following application for automating the task of calculating
    the total marks.'
