    A detailed discussion of regular expressions is beyond the scope of this book.
    We give here a simple example of using regular expressions.


    A regular expression (also known as a pattern string) is a string containing two
    types of characters.


    +   - Literals

    +   - Metacharacters


    Literals are characters that we wish to search and match in the text. Metacharacters
    are special characters that give commands to the regular expression parser. Examples
    of regular expressions are:


    | EXPRESSION | MEANING |

    |---|---|

    | "\bm" | Any word beginning with m |

    | "er\b" | Any word ending with er. |

    | "\BX\B" | Any X in the middle of a word |

    | "\bm\S*er\b" | Any word beginning with m and ending with er. |

    | "|," | Any word separated by a space or a comma |


    In these expressions, \b, \B, \S* and | are metacharacters and m, er, X, space
    and comma are literals.


    The .NET Framework provides support for regular expression matching and replacement.
    The namespace System.Text.RegularExpressions supports a number of classes that
    can be used for searching, matching and modifying a text document. The important
    classes are:


    +   - Regex

