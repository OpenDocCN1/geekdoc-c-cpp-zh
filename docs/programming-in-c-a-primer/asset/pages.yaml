    \ item that the program handles.\n\nObjects encapsulate data, and code to manipulate\
    \ that data. The code designed to work on the data is known as methods in C#.\
    \ Methods give objects their behavioral characteristics. They are used not only\
    \ to access and process data contained in the object but also to provide responses\
    \ to any messages received from other objects.\n\nC# is a pure object-oriented\
    \ language and therefore, every method must be contained within a class. Remember,\
    \ in other languages like VB, C and C++, we can define global functions that are\
    \ not associated with a particular class. In this chapter, we shall see how methods\
    \ are defined and used in different situations. More about their applications\
    \ in the development of object-oriented system will be discussed in Chapter 12.\n\
    \n# 8.2 DECLARING METHODS\n\nMethods are declared inside the body of a class,\
    \ normally after the declaration of data fields. The general form of a method\
    \ declaration is\n\n```\nmodifiers type methodname (formal-parameter-list)\n{\n\
    \    method _ body\n}\n```\n\nMethod declaration has five parts:\n\n+   - Name\
    \ of the method (methodname)\n+   - Type of value the method returns ( type )\n\
    +   - List of parameters ( formal-parameter-list )\n+   - Body of the method\n\
    +   - Method modifiers ( modifier )\n\nThe methodname is a valid C# identifier.\
    \ The type specifies the type of value the method will return. This can be a simple\
    \ data type such as int as well as any class type. If the method does not return\
    \ anything, we specify a return type of void. Note that we cannot omit the return\
    \ type altogether.\n\nThe formal-parameter-list is always enclosed in parentheses.\
    \ This list contains variable names and types of all the values we want to give\
    \ to the method as input. The parameters are separated by commas. In the case\
    \ where no input data are required, the declaration must still include an empty\
    \ set of paranthesis() after the method name. Examples are:"
