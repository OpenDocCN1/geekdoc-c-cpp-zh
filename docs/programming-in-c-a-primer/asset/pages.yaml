  md: '# Interface: Multiple Inheritance


    ```

    interface A

    {

    void Print ( );

    }

    ```


    This is identical to the following abstract class:


    ```

    abstract class B

    {

    abstract public void Print ( );

    }

    ```


    Now, a class can inherit from B instead of implementing the interface A. However,
    the class that inherits B cannot inherit any other class directly. If it is an
    interface, then the class can not only implement the interface but also use another
    class as base class thus implementing in effect multiple inheritance.


    Program 14.6 uses the concepts of abstract classes, multilevel inheritance, calling
    the methods in inheriting classes Class1, Class2 and manipulating the methods
    and getting the output displayed.


    # Program 14.6 INHERITANCE USING ABSTRACT CLASS


    ```

    using System;

    using System.Collections.Generic;

    using System.Text;

    namespace InheritanceusingAbstractClass

    {

    class Program

    {

    static void Main()

    {

    ABS[] aArray = new ABS[3];

    aArray[0] = new Class1(1, 2, "This is the first value in array.");

    aArray[1] = new Class1(3, 4, "This is the next value in array.");

    aArray[2] = new Class2(5, 6);

    for (int i = 0; i < 3; i++)

    {

    aArray[i].show();

    }

    }

    } // end class Program

    public abstract class ABS

    {

    // constructor takes two integers to fix location on the console

    public ABS(int top, int left)

    {

    this.top = top;

    this.left = left;

    }

    public abstract void show();

    }

    }

    ```'
