  md: "# 7.5 THE FOREACH STATEMENT\n\nThe foreach statement is similar to the for\
    \ statement but implemented differently. It enables us to iterate the elements\
    \ in arrays and collection classes such as List and HashTable. The general form\
    \ of the foreach statement is:\n\n```\nforeach (type variable in expression)\n\
    {\n    Body of the loop\n}\n```\n\nThe type and variable declare the iteration\
    \ variable. During execution, the iteration variable represents the array element\
    \ (or collection element in case of collections) for which an iteration is currently\
    \ being performed. in is a keyword.\n\nThe expression must be an array or collection\
    \ type and an explicit conversion must exist from the element type of the collection\
    \ to the type of the iteration variable. Example:\n\n```\npublic static void Main\
    \ (string [] args)\n{\n    foreach ( string s in args)\n    {\n        Console.WriteLine(s);\n\
    \    }\n}\n```\n\nThis program segment displays the command line arguments. The\
    \ same may be achieved using the for statement as follows:\n\n```\npublic static\
    \ void Main (string[] args)\n{\n    for ( int i = 0; i < args.Length ; i++ )\n\
    \    {\n        Console.WriteLine(args [i]);\n    }\n}\n```\n\nProgram 7.6 illustrates\
    \ the use of foreach statement for printing the contents of a numerical array.\n\
    \n# Program 7.6 PRINTING ARRAY VALUES USING FOREACH STATEMENT\n\n```\nusing System;\n\
    class ForeachTest\n{\n    public static void Main ()\n    {\n        int[] arrayInt\
    \ = { 11, 22, 33, 44 };\n        foreach ( int m in arrayInt)\n        {\n   \
    \         Console.Write(\" \" + m);\n        }\n        Console.WriteLine();\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 131
  md: "Program 7.6 will display the following output:\n    11  22  33  44\n\nAn important\
    \ point to note is that we cannot change the value of the iteration variable during\
    \ execution.\n\nFor instance, the code\n\n```\nint[] x = { 1, 2, 3 };\nforeach\
    \ ( int i in x )\n{\n    i++;\n    Console.Write(i);\n}\n```\n\nwill not work.\
    \ If we need to change the values of an item during the iteration process, we\
    \ may use the for loop construct.\n\nThe advantage of foreach over the for statement\
    \ is that it automatically detects the boundaries of the collection being iterated\
    \ over. Further, the syntax includes a built-in iterator for accessing the current\
    \ element in the collection.\n\n# 7.6 JUMPS IN LOOPS\n\nLoops perform a set of\
    \ operations repeatedly until the control variable fails to satisfy the test condition.\
    \ The number of times a loop is repeated is decided in advance and the test condition\
    \ is written to achieve this. Sometimes, when executing a loop it becomes desirable\
    \ to skip a part of the loop or to leave the loop as soon as a certain condition\
    \ occurs. For example, consider the case of searching for a particular name in\
    \ a list containing, say, a hundred names. A program loop written for reading\
    \ and testing the names a hundred times must be terminated as soon as the desired\
    \ name is found. C# permits a jump from one statement to the end or beginning\
    \ of a loop as well as a jump out of a loop.\n\n# 7.6.1 Jumping Out of a Loop\n\
    \nAn early exit from a loop can be accomplished by using the break and goto statements.\
    \ We have already seen the use of the break in the switch statement. These statements\
    \ can also be used within while, do or for loops for an early exit.\n\nWhen the\
    \ break statement is encountered inside a loop, the loop is immediately exited\
    \ and the program continues with the statement immediately following the loop.\
    \ When the loops are nested, the break would only exit from the loop containing\
    \ it. That is, the break will exit only a single loop. Figure 7.2 illustrates\
    \ the use of break for exiting a loop.\n\n# 7.6.2 Skipping a Part of a Loop\n\n\
    During the loop operations, it may be necessary to skip a part of the body of\
    \ the loop under certain conditions. For example, in processing of applications\
    \ for some job, we might like to exclude the processing of data of applicants\
    \ belonging to a certain category. On reading the category code of an applicant,\
    \ a test is made to see whether his application should be considered or not. If\
    \ it is not to be considered, the part of the program loop that processes the\
    \ application details is skipped and the execution continues with the next loop\
    \ operation.\n\nLike the break statement, C# supports another similar statement\
    \ called the continue statement. However, unlike break which causes the loop to\
    \ be terminated, the continue statement, as the name implies, causes the loop\
    \ to continue with the next iteration after skipping any statements in between."
