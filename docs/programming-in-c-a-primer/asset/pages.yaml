    \ as setter). The getter method used the keyword return to return the field’s\
    \ value to the caller. The setter method uses the keyword value to receive the\
    \ value being passed in from the user. The type of value is determined by the\
    \ type of property.\n\nAs the names imply, getter method is used to get (or read)\
    \ the value and the setter method is used to set (or write) the value. In Program\
    \ 12.6, the statement\nn.Anumber = 100;\ninvokes the setter method and places\
    \ an integer value 100 in a variable named value which in turn is assigned to\
    \ the field number.\n\nSimilarly, the statement\nint m = n.Anumber;\ninvokes the\
    \ getter method and assigns the value of the property to m.\n\nA property can\
    \ omit either a get clause or the set clause. A property that has only a getter\
    \ is called a read-only property, and a property that has only a setter is called\
    \ a write-only property. A write-only property is very rarely used. There are\
    \ other powerful features of properties. They include:\n\n+   - Other than fetching\
    \ the value of a variable, a get clause uses code to calculate the value of the\
    \ property using other fields and returns the results. This means that properties\
    \ are not simply tied to data members and they can also represent dynamic data.\n\
    +   - Like methods, properties are inheritable. We can use the modifiers abstract,\
