    \ THREAD POOLING\n\nIn thread pooling, a thread pool is created to perform multiple\
    \ tasks simultaneously. A thread pool is basically a group of threads that can\
    \ be run simultaneously to perform a number of tasks in the background. This feature\
    \ of C# is mainly used in server applications. In server applications, a main\
    \ thread receives the requests from the client computers and passes it to a thread\
    \ in the thread pool for processing of the request. In this manner, the main thread\
    \ functions asynchronously and is free to receive the requests from client computers.\
    \ The main thread does not have to process the request. Instead, the request is\
    \ transferred to a thread in the thread pool for processing. A delay in receiving\
    \ the requests from the client computer does not occur because of implementation\
    \ of thread pooling in server applications. After the thread in the thread pool\
    \ completes the task of processing the client request, it waits in a queue for\
    \ performing another task. In this way, the thread in the thread pool can be reused\
    \ for performing different tasks. The reusability of the thread because of thread\
    \ pooling enables a server application to avoid creating a new thread for every\
    \ task.\n\nA thread pool may contain a number of threads, each performing a specific\
    \ task. If all the threads in a thread pool are occupied in performing their tasks\
    \ then a new task, which needs to be processed, waits in a queue until a thread\
    \ becomes free. The .NET framework provides a thread pool through the ThreadPool\
    \ class. We can either implement a custom thread pool in a C# program or use the\
    \ thread pool provided through the ThreadPool class. It is easy to implement a\
    \ thread pool through the ThreadPool class. Program 19.5 shows how to use a thread\
    \ pool.\n\nThis example executes 20 different threads at different intervals of\
    \ time and subsequently stops all threads one by one after a period of 3 seconds,\
    \ where each thread is made to wait for 3 seconds.\n\n# Program 19.5 USING THREAD\
    \ POOL\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Text;\n\
    using System.Threading;\nnamespace ThreadPooling\n{\n    class ThreadPoolTest\n\
    \    {\n        static object showThread = new object();\n        static int runThreads\
    \ = 20;\n        public static void Main()\n```"
