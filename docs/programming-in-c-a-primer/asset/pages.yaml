- pgno: 297
  md: '# 296 Programming in C#


    ## Table 15.2 Operators that cannot be overloaded


    | CATEGORY | OPERATORS |

    |----------|-----------|

    | Conditional operators | & & || |

    | Compound assignment | +=, -=, *=, /=, %=, |

    | Other operators | | { } . , : ? ; -> . new. sizeof. typeof. is. as |


    Note:


    • When we overload a binary operator, its compound assignment equivalent is implicitly
    overloaded.

    • Logical operators must be overloaded in pairs. meaning that && and ! must be
    done together.

    • Operators that are currently not defined in C# cannot be overloaded.


    Although the semantics of an operator can be extended, we cannot change its syntax,
    the grammatical rules that govern its use such as the number of operands, precedence
    and associativity. For example, the multiplication operator will enjoy higher
    precedence than the addition operator. Remember, when an operator is overloaded,
    its original meaning is not lost. For instance, the operator +, which has been
    overloaded to add two vectors, can still be used to add two integers.




    Although operator overloading gives us syntactical convenience, it also help us
    greatly to generate more readable and intuitive code in a number of situations.
    These include:


    +   • Mathematical or physical modeling where we use classes to represent objects
    such as coordinates, vectors, matrices, tensors, complex numbers and so on.

    +   • Graphical programs where co-ordinate-related objects are used to represent
    positions on the screen.

    +   • Financial programs where a class represents an amount of money.

    +   • Text manipulations where classes are used to represent strings and sentences.




    To define an additional task to an operator, we must specify what it means in
    relation to the class (or struct) to which the operator is applied. This is done
    with the help of a special method called operator method, which describes the
    task. The general form of an operator method is:


    ```

    public static retval operator op (arglist)

    {

    Method body //task defined

    }

    ```


    The operator is defined in much the same way as a method, except that we tell
    the compiler it is actually an operator we are defining by the operator keyword,
    followed by the operator symbol op. The key features of operator methods are:


    • They must be defined as public and static.

    • The retval (return value) type is the type that we get when we use this operator.
    But, technically, it can be of any type.

    • The arglist is the list of arguments passed. The number of arguments will be
    one for the unary operators and two for the binary operators.'
