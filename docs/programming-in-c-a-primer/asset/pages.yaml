- pgno: 61
  md: '# 4.8 INITIALIZATION OF VARIABLES


    A variable must be given a value after it has been declared but before it is used
    in an expression. A simple method of giving value to a variable is through the
    assignment statement as follows:


    ```

    variableName = value;

    ```


    Examples:


    +   - initialValue = 0;

    +   - finalValue = 100;

    +   - yes = ''x'';


    We can also string assignment expressions as shown below:


    ```

    x = y = z = 0;

    ```


    It is also possible to assign a value to a variable at the time of its declaration.
    This takes the form:


    ```

    type variableName = value;

    ```


    Examples:


    +   - int finalValue = 100;

    +   - char yes = ''X'';

    +   - double total = 75.36;

    +   - bool test = true;


    The process of giving initial values to variables is known as initialization.
    The following are valid C# statements:


    ```

    float x, y, z; //declares three variables; compound declaration

    int m = 5, n = 10; //declares and initializes two int variables

    int m, n = 10; //declares m and n and initializes n

    ```


    Consider the following initialization statements:


    +   - float f = 12.34F;

    +   - uint ui = 123U;

    +   - long l = 123L;

    +   - ulong ul = 123UL;

    +   - decimal d = 1.23M


    All integer numbers by default represent int type values. If we want the value
    to represent any other integer type, we must append U to denote an unsigned type,
    L to denote long and UL to denote an unsigned long. Similarly, all floating-point
    numbers are double by default. Therefore we must append F or M to the numbers
    to denote float and decimal types respectively.


    If any variables are not provided with initial values, the C# compiler will generate
    errors.


    # 4.9 DEFAULT VALUES


    A variable is either explicitly assigned a value or automatically assigned a default
    value. The following categories of variables are automatically initialized to
    their default values:


    +   - Static variables

    +   - Instance variables

    +   - Array elements'
