    \ Welcome\n{\n    get\n    {\n        return \"Welcome to MVVM Light\";\n    }\n\
    }\n\n#endregion\n\npublic ObservableCollection<Book> Books\n{\n    get\n    {\n\
    \        return books;\n    }\n    set\n    {\n        books = value;\n      \
    \  RaisePropertyChanged(\"Books\");\n    }\n}\n\n/// <summary>\n/// Initializes\
    \ a new instance of the MainViewModel class.\n/// </summary>\npublic MainViewModel()\n\
    {\n    Books = new ObservableCollection<Book>();\n\n    if (IsInDesignMode)\n\
