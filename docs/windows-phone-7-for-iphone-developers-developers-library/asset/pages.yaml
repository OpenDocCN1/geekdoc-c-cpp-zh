- pgno: 291
  md: "# Debugging and Troubleshooting\n\n> *Debugging is twice as hard as writing\
    \ the code in the first place. Therefore, if you write the code as cleverly as\
    \ possible, you are, by definition, not smart enough to debug it.*\n> \n> Brian\
    \ W. Kernighan\n\nThis chapter discusses debugging, troubleshooting, and analyzing\
    \ your applications. This is one of the most important steps in application development\
    \ and is often neglected. Testing an application doesn’t stop after all your unit\
    \ tests pass. You need to make sure that the application runs smoothly and efficiently\
    \ and, especially on mobile devices, that it isn’t abusing resources. Applications\
    \ that abuse mobile device resources aren’t even going to be allowed into the\
    \ Marketplace.\n\nThis chapter shows you how to debug applications to troubleshoot\
    \ and resolve problems, and it introduces you to some of the other tools available\
    \ to developers, such as static analysis and code profiling.\n\n# Debugging and\
    \ Tuning iOS Applications\n\nIf you’ve written any iOS applications, this section\
    \ of the chapter should (ideally) be very familiar to you. Xcode, Apple’s development\
    \ environment, sits atop an open source debugging tool called gdb, which stands\
    \ for GNU Debugger and is part of the GNU project. For more information on gdb,\
    \ there is a wealth of information, documentation, and training materials available\
    \ on the web.\n\nYour mileage may vary, but most developers spend most of their\
    \ time in the debugger. They run their applications, they poke and prod, they\
    \ hope nothing breaks, and if the debug session didn’t break, the developer is\
    \ happy."
  merge: -1
  img_proc: true
- pgno: 292
  md: 'If something does go wrong, you need to figure out what happened. With iOS
    applications, this can be particularly tricky. Because of the reference-counted
    memory management, you can often experience obscure bugs somewhere in your application
    that are caused by the mismanagement of memory in a completely separate area of
    the application.


    This is why, in addition to the standard capability to debug, set and hit breakpoints,
    view stack traces and object variables, Apple also provides the capability to
    record the runtime memory performance of your application. You can watch for all
    kinds of scenarios, most of which are outside the scope of this book. The biggest,
    and probably most often used, detection is that of a memory leak. The profiling
    tool that you can launch directly from Xcode will monitor memory allocation, and
    it can spot orphaned objects and errors you’ve made in managing your memory. It
    takes a while to get used to this tool, but after you get the hang of it, you’ll
    wonder how you ever managed to write applications without it.


    If you’re clever, you can also write unit tests that ensure that the reference
    counts of specific objects are identical before and after invoking some library
    function that you’re testing. This doesn’t guarantee a flawless, crash-free application,
    but it will at least give you a little bit of confidence before running the leak-detection
    tool that a particular method isn’t leaking memory allocations.


    As with most iOS topics, if you’re curious about debugging, troubleshooting, and
    other low-level refinements that you’re definitely going to need to do to publish
    an application in the App Store, check out iPhone Programming: The Big Nerd Ranch
    Guide by Aaron Hillegass. I personally consider this book the definitive bible
    for getting started with iPhone programming.


    # Debugging 101


    The mantra I always use when debugging an application is this: don’t just make
    it break, make it break productively. Contrary to what many developers might think,
    the purpose of a debugging session isn’t to get from start to finish without breaking.
    Developers, when testing their own code, will often unconsciously avoid areas
    of the application about which they are uncertain. When you debug your application,
    whether it’s for the iPhone, Windows Phone 7, or the Commodore 64, you should
    always be trying to break it. If you’re keeping good trace logs and have well-placed
    breakpoints, breaking the application while under a debugger should give you the
    information you need to fix that bug. After you fix that one, try to break it
    again. You’re done when you’ve tried every way you know how to break your application
    and it won’t break. Then, you give it to someone else to break. Another mantra
    I live by is this: Never let your customers find your bugs for you.


    Every bug a customer finds that you didn’t is a chink in your armor, your reputation
    with your customer base. In this day of Facebook, email, and social networking
    across multiple devices, desktop, and mobile platforms, it won’t take long for
    one customer’s problem with your application to become everyone’s problem with
    it. Take the extra time to find your bugs before your customers do.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Additionally, you need to make sure that your application properly handles
    exceptions. The Windows Phone 7 application submission guidelines for the Marketplace
    explicitly state that if the application ever crashes during the certification
    process and doesn’t present the user with user-friendly, meaningful information
    about the problem the application just had, the application will be rejected.
    So not only do you need to find as many of your own bugs as possible, but your
    application needs to be able to withstand unexpected error conditions and handle
    all kinds of things that the user, the device, and the cellular network might
    throw at it.


    # Debugging Windows Phone 7 Applications


    Debugging a Windows Phone 7 application is much like debugging any other application
    with Visual Studio 2010. If you have been following along throughout this book
    and running the code samples, you have seen the device emulator that gets launched
    when you attempt to debug a WP7 application. The application runs inside the emulator
    while the debugger is attached to the application’s process.


    This allows you to set and hit breakpoints and to stop, pause, and resume your
    application at virtually any point during its execution. This lets you see that
    things are happening the way you expect them to, and it lets you examine the values
    of variables and other data to help you figure out what went wrong when things
    do happen unexpectedly.


    # Using Breakpoints


    In the simplest of scenarios, developers can select a line of code on which the
    debugger should “break” (execution of the application halts and then waits for
    the developer). At a breakpoint, all the execution context information is available,
    so you can see the values contained within variables and the call execution stack.
    You can choose to advance forward one line of code, you can debug “into” a method
    call, allowing you to follow the execution further down the rabbit hole. You can
    even drag the pointer indicating the currently executing line of code upward to
    “rewind” the application back to a particular point. The sheer number of things
    a developer can do with a basic breakpoint is staggering, but it gets even better.


    The following is a list of some of the more advanced things that you can do with
    breakpoints:


    +   - Location—This is what you normally define when you click into the margin
    or “tray” on the left side of your code listings in Visual Studio. A red “stop
    sign” indicator appears in this tray over a location that has a breakpoint set.

    +   - Condition—You can specify a Boolean expression used to determine whether
    the breakpoint stops execution of the application. This comes in handy for methods
    that are used over and over throughout your code, but you want to stop execution
    only when certain conditions are met.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   - Hit Count—In addition to a conditional expression, you can also define
    a hit count. This will allow your breakpoint to be hit “count-1” times. Execution
    will stop when the breakpoint is hit when the hit count limit has been reached.
    In other words, if you set the hit count to 10, the application will break on
    exactly the tenth execution of the line of code where the breakpoint has been
    set. This can come in handy when you want to test the nth execution within a for
    or while loop.

    +   - Process and Thread Filter—You can use a combination of the variables ProcessId,
    ProcessName, MachineName, ThreadName or ThreadId to restrict the breakpoint so
    that it will break only for certain processes or threads. The filter clause accepts
    Boolean operators such as |, &, and so on to give you very fine-grained control
    over your breakpoint’s configuration.

    +   - Labeling—It might not happen all that often for WP7 applications, but I
    know that when I build larger, enterprise application suites I can end up with
    a VS2010 solution that literally has hundreds of breakpoints. Navigating through
    that mess can be a chore sometimes, and the capability to assign arbitrary labels
    (you Web2.0 folk can think of these as tags) to breakpoints.

    +   - Execution When Hit—As if all the other breakpoint options weren’t enough,
    you can run a macro or display custom text when the breakpoint does hit. Remember
    that all these options are cumulative, so you can have a process filter, a condition
    expression, a hit count, and print custom text when the breakpoint is hit. If
    you decide to print custom text, you can use several macros to print information
    about the execution context, such as: $ADDRESS, $CALLSTACK, $PID, $TID, $FUNCTION,
    $TNAME, and so on. If you choose to run a macro, the macro will be one of the
    macros available globally to Visual Studio 2010, and you can pick the macro from
    a drop-down box.


    One thing that I like doing with breakpoints is using the custom print text in
    a breakpoint “when hit” execution. In addition, I check the Continue Execution
    box. This allows me to print some information to the debug log (which we’ll discuss
    in the next section in more detail) without having to write code that does that
    printing. This way, when I want to stop printing that debug information, I can
    remove the breakpoint rather than commenting out or deleting the code.


    Try this out on any random project you have lying around (including any of the
    samples from this book). Find a spot in your code that you know is executed often
    and set a breakpoint there. Set it to continue execution “when hit” and print
    custom text. It’s fine to accept the default text that Visual Studio sets for
    you. If you want to get a little fancier, you can enclose any value you want to
    display in the custom text in curly braces, as shown in Figure 20.1, which prints
    the currently selected index in a Pivot control every time the breakpoint is hit.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '![](img/04a00d46bb1059867d95707babd62ee7_295_0.png)


    Figure 20.1 Printing custom text upon hitting a breakpoint.


    You might notice that after you make the change indicated in Figure 20.1 to a
    standard breakpoint and debug your application, the “red ball” shape on the left
    side changes to a diamond, indicating that there is more to this breakpoint than
    simply stopping execution on that line. As an added trick, I often label all of
    my “print debug” breakpoints with the same label so that I can find and deactivate
    them later. Another useful tip: deactivate your breakpoints instead of deleting
    them. This way you can turn them back on when you need them. This is especially
    handy for breakpoints like the one mentioned previously that prints valuable information
    during a debug session.


    When I run the application with this breakpoint active on one of my own apps,
    I see messages like the following show up in my Debug output window, and execution
    never stops as I click between active Pivot panels:


    ```

    Function: ApocalypseTrainer.MainPage.mainPivot_SelectionChanged(object, System.Windows.Controls.SelectionChangedEventArgs),
    Selected Index: 1

    Function: ApocalypseTrainer.MainPage.mainPivot_SelectionChanged(object, System.Windows.Controls.SelectionChangedEventArgs),
