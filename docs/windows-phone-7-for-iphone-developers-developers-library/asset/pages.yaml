  img_proc: true
- pgno: 271
  md: 'This means that a Game Center game developer can create a multiplayer game
    that allows friends to play with each other anywhere in the world *without having
    to write a single piece of server code or pay the expense of standing up a game
    server in the cloud.* Certainly some larger and more involved games might need
    their own custom game servers, but the fact that the basics are already provided
    for Game Center developers *for free* makes it a very appealing platform.


    # In-Game Voice Chat


    Without having to know the first thing about audio recording, transcoding, or
    Voice Over IP (VoIP), developers can add audio chat channels to the game data
    communication channels already available to Game Center games.


    For example, if you were building a Battleship-style game on Game Center, you
    could provide the capability for your players to talk to each other live while
    playing the game, as well as utilize the GameKit API for sending game-data messages
    to transmit the moves players make during each turn. You could even bring more
    people into the game as observers that could participate in the chat channel and
    watch the action but not actually play. All of this is available to Game Center
    developers as part of the basic development kit, and none of these features require
    game developers to host their own game server.


    # Connected Gaming Options for WP7


    The following section describes the facilities available to Windows Phone 7 developers
    for building casual, social, and connected gaming experiences. Remember that at
    the time of the writing of this book, the Windows Phone 7 SDK is a v1.0 product,
    whereas Game Center wasn’t introduced to the iPhone until after the third major
    release of that platform. For three releases, developers had to “roll their own”
    gaming experiences on the iPhone and, in many cases, developers will have to do
    the same for the initial Windows Phone 7 SDK. Keep in mind that with the next
    scheduled major release of Windows Phone 7 (code named “Mango”) there are more
    opportunities and facilities for game development.


    # Lobbies and Matchmakers


    From a code perspective, lobbies and matchmakers can be boiled down to two major
    tasks: state management and player grouping.


    The state that needs to be stored on the server is the list of players who are
    currently connected and running the game. Lobby code doesn’t need to concern itself
    with offline players because they won’t be able to jump into a lobby, nor will
    they be able to join a game. Some lobby systems also show the status of your friends,
    including those who are offline.


    Player grouping can be as simple as randomly picking players and grouping them
    together, or it can be as complicated as taking into account relative skill level,
    gaming history within that game, game style preferences, difficulty preferences,
    geographic location,'
  merge: -1
  img_proc: true
- pgno: 272
  md: "network speed, and even network quality (a high-speed network isn’t always\
    \ a good one if it regularly corrupts or drops packets). The code and logic that\
    \ goes into a matchmaking server is well beyond the scope of this book.\n\nHowever,\
    \ if you were to write your own matchmaking server, you might want to start with\
    \ a WCF (Windows Communication Foundation) service that implemented an interface\
