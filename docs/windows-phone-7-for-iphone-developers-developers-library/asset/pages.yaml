    \ to the top of whatever page you want to vibrate:\n\n```\nusing Microsoft.Devices;\n\
    ```\n\nNow add the following code to start vibration (and continue vibrating for\
    \ a set amount of time):\n\n```\nVibrateController.Default.Start(TimeSpan.FromSeconds(1));\n\
    ```\n\nIf you want to force vibration to stop at any time, call the Stop method,\
    \ as shown here:\n\n```\nVibrateController.Default.Stop();\n```\n\n# Accessing\
