- pgno: 102
  md: "```\nMessageBox.Show(\"You tapped the page title, \" +\n    SampleTextBox.Text);\n\
    }\n\nprivate void TestButtonTwo_Click(object sender,\n    RoutedEventArgs e)\n\
    {\n    MessageBox.Show(\n        \"You tapped the button with nested controls!\"\
    );\n}\n}\n```\n\nOne thing worth pointing out is that the UIButton control in\
    \ iOS has very similar functionality. Whereas the default behavior of a WP7 button\
    \ is to appear as a square with a border around the child controls, the UIButton\
    \ is more purpose-driven. It contains a property called buttonType that controls\
    \ the button’s core behavior and can be any of the following values: UIButtonTypeCustom,\
    \ UIButtonTypeRoundedRect, UIButtonTypeDetailDisclosure, UIButtonTypeInfoLight,\
    \ UIButtonTypeInfoDark, or UIButtonTypeContactAdd. The purposes of these different\
    \ button types should be fairly self-explanatory to any iOS developer or even\
    \ any well-versed iPhone user.\n\n# Philosophical Differences in SDK Design\n\n\
    The default implementation of buttons in WP7 and iOS is a classic example of how\
    \ the SDK design philosophy differs between WP7 and iOS, and on a larger scale,\
    \ the .NET Framework and Cocoa. The UI controls that come with the iOS SDK are\
    \ all purpose-driven. They make accomplishing a certain task with a very iPhone-ish\
    \ look and feel very easy. The main goal of the iOS SDK is to remove as many obstacles\
    \ as possible between you and building an application that looks and behaves exactly\
    \ like most of the stock applications. So, if you want a button with rounded edges\
    \ or an info button with a light icon (both of which occur in copious quantities\
    \ throughout the core OS), you have very little work to do. However, if you want\
    \ to create a custom button in iOS with custom visuals inside the bounding frame,\
    \ you have a lot of work to do.\n\nConversely, the goal of the .NET Framework\
    \ and specifically Silverlight for Windows Phone 7 is to make any and all possible\
    \ user interfaces equally available to you. It is a debate of breadth versus depth.\
    \ iOS hides the complexity of customization behind a façade of extremely purpose-driven\
    \ controls that will get you to the 80% point (in general) faster than you might\
    \ in Silverlight. However, the last 20%, where customization and tweaking typically\
    \ occurs, can be a frustrating, nail-biting, hair-removing experience in iOS,\
    \ whereas the entire 100% of the development process in Silverlight typically\
    \ requires the same level of effort.\n\nNeither SDK design is the only right or\
    \ wrong design, but both were clearly built for different audiences and different\
    \ purposes. Silverlight makes doing amazing things with your UI just as easy as\
    \ doing the mundane, whereas iOS makes the mundane nearly automatic and offloads\
    \ that saved effort into the realm of customization."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Accepting Other Forms of User Input\n\nButtons and TextBoxes aren’t the only\
    \ way users can interact with your application using out-of-the-box controls that\
    \ come with the WP7 SDK. This next section introduces you to a few new controls\
    \ that provide richer and more flexible ways of accepting input from the user,\
    \ such as the following:\n\n+   - Checkbox—There is no functional native UIKit\
    \ control in iOS for a check box.\n+   - RadioButton—A UISegmentedControl often\
    \ provides similar functionality in iOS.\n+   - PasswordBox—A UITextField control\
    \ with the secureTextEntry property set to YES provides nearly identical functionality\
    \ in iOS.\n+   - Slider—A UISlider control provides this functionality in iOS,\
    \ although iOS sliders are hard to customize and always appear horizontally, whereas\
    \ WP7 sliders can be easily customized and can be displayed vertically without\
    \ customization.\n+   - HyperlinkButton—The easiest way to produce this functionality\
    \ in iOS is to create a tappable label that has been styled to look like a hyperlink\
    \ (for example, blue, underlined text).\n\nOpen up the MainPage.xaml file that\
    \ we’ve been working with throughout this chapter and add the code from Listing\
    \ 8.7 to the page below the controls from the previous samples. I’ve deleted a\
    \ couple of unnecessary controls to make room for the new UI elements (shown in\
    \ Figure 8.3).\n\n# Listing 8.7 Adding New User Input Elements\n\n```\n<CheckBox\
    \ x:Name=\"checkBoxOne\" />\n<RadioButton x:Name=\"ChoiceOne\" GroupName=\"DefaultGroup\"\
    >\n    <TextBlock Text=\"Radio One\" />\n</RadioButton>\n<RadioButton GroupName=\"\
    DefaultGroup\">\n    <TextBlock Text=\"Radio Two\" />\n</RadioButton>\n<Slider\
    \ x:Name=\"SliderOne\" Minimum=\"0\" Maximum=\"100\" Value=\"20\" />\n<HyperlinkButton\
    \ x:Name=\"hyperLinkButtonOne\" Click=\"hyperLinkButtonOne_Click\" Content=\"\
    hyperlink!!\" />\n<PasswordBox x:Name=\"PasswordBox\" />\n```\n\nThe first control\
    \ added is a check box, and these are pretty simple. They let users specify Boolean\
    \ values, such as whether they want to enable a specific preference or whether\
    \ a particular statement about some data is true.\n\nThe next controls added were\
    \ two radio buttons. These allow a user to select between a finite set of available\
    \ options. When a user selects one radio button in a group, the state of all the\
    \ other buttons is cleared. To indicate which buttons belong to the same group,\
    \ just assign them the same string for the GroupName property. In the preceding\
    \ code we assigned the GroupName property of the two radio buttons the value of\
    \ DefaultGroup."
  merge: -1
  img_proc: true
- pgno: 104
  md: 'You can have as many radio button groups on a screen at a time as you can fit
    (or as your sense of good taste and design might allow).


    Next we added a slider, which allows a user to “slide” a value indicator between
    some arbitrary minimum and maximum. You can use a slider control to prompt the
    user to pick a volume level, allocate resources to a particular object in a strategy
    game, or even choose how much of something the user might want to buy. Despite
    its simplicity, the slider is a powerful and versatile control that can be used
    in a variety of situations.


    Next is the HyperlinkButton. As its name implies, this control presents the user
    with some text that resembles a standard browser-clickable hyperlink. When the
    link is tapped, it can either navigate the user to a particular page (a Silverlight
    page, not a web page) using the NavigateUri property, or you can perform custom
    logic in the Click event.


    Last, we have the PasswordBox control. This control functions identically to a
    TextBox control except that a moment after each character is typed into the box,
    it is replaced with a dot. This pattern and style should be familiar to users
    of web browsers, iPhones, and many other mobile devices, and users should have
    no problem recognizing the purpose of this control. However, don’t mistake this
    control for built-in security. All this control does is obscure the display of
    the password; your code can still access the contents of this TextBox, and there
    is no automatic encryption. You will have to code your own security for passwords.
    Some tips and techniques for securing your WP7 application will be covered later
    in the book.


    ![](img/04a00d46bb1059867d95707babd62ee7_104_0.png)


    Figure 8.3 Some more user input elements.'
  merge: -1
  img_proc: true
- pgno: 105
  md: "# Displaying Images\n\nOne of the easiest ways to spice up your application\
    \ is through the use of images. Small, subtle images used judiciously throughout\
    \ a UI, or even big images in the middle of a UI, can add a lot to your application\
    \ and can often be the factor that sets your application above your competitors.\n\
    \nTo use an image in iOS, developers typically use the UIImageView class. This\
    \ class is derived from UIView and its sole purpose is for the display of images.\
    \ Likewise, Windows Phone 7 developers have access to the Silverlight Image control,\
    \ which is extremely easy to use both programmatically and through XAML markup.\n\
    \nThe following code shows a basic image control configured completely through\
    \ XAML.\n\n```\n<Grid x:Name=\"myGrid\" Width=\"150\" Height=\"150\" Background=\"\
    White\">\n    <Image x:Name=\"myImage\"\n        Source=\"/images/SuperAwesomeScreen.jpg\"\
    \ Stretch=\"Fill\" />\n</Grid>\n```\n\nDon’t worry about the Grid element; we’ll\
    \ be getting to that shortly. In the preceding code, the image control is configured\
    \ to display a JPEG image called SuperAwesomeScreen.jpg with a Fill stretch mode.\n\
    \nThe stretch mode of an image can be set to None, Fill, Uniform, or UniformToFill.\
    \ No stretch means the image will be displayed exactly as it appears in the file.\
    \ A stretch mode of Fill means that the image will be expanded to fill whatever\
    \ layout container it resides within. In the preceding code the parent grid is\
    \ 150x150, so the image will be scaled up to that size, regardless of whatever\
    \ size it might be in its original file form. When using the Fill mode, the aspect\
    \ ratio of the image is not maintained, so it can often warp the original image.\
    \ To maintain the ratio between height and width even after scaling, use the Uniform\
    \ stretch mode. This mode will stretch the image as close as it can get to the\
    \ new size while still keeping the original aspect ratio. Finally, the UniformToFill\
    \ stretch mode is like Uniform, except it has permission to cut some of the image\
    \ away to get a better fit within the parent container. In addition to the Stretch\
    \ property, you can control a variety of other aspects of the image, such as the\
    \ Width, Height, and Clip, which can be used to give images a nonrectangular shape.\n\
    \nAdd the following Image element above the first TextBlock control within the\
    \ StackPanel in the same MainPage.xaml file that we have been working with throughout\
    \ this chapter.\n\n```\n<Image x:Name=\"sampleImage\" />\n```\n\nThat’s it. The\
    \ default mode for the Stretch property is Uniform, which is good enough for our\
    \ purposes. Now go into the code-behind for the XAML and change the implementation\
    \ of the hyperlink button’s Click event to the following:"
  merge: -1
  img_proc: true
- pgno: 106
  md: "```\nprivate void hyperLinkButtonOne_Click(object sender, RoutedEventArgs e)\n\
    {\n    sampleImage.Source = new BitmapImage(\n        new Uri(\"success.jpg\"\
    , UriKind.RelativeOrAbsolute));\n}\n```\n\nWhen this code executes, it is going\
    \ to tell the Image control that it has a new source. This will cause the Image\
    \ control to immediately redraw itself based on the new contents. The success.jpg\
    \ file is included with the sample code that accompanies this chapter and can\
    \ be seen in Figure 8.4.\n\nAlthough this example might seem trivial, it is just\
    \ the tip of the iceberg when it comes to the things that you can do with images.\
    \ Knowing that the source and other properties of an image can be completely changed\
    \ at runtime paves the way for all kinds of great functionality, such as downloading\
    \ and caching images from the Internet or your application server, or even creating\
    \ images on the fly, displaying them, and uploading them to an application server.\
    \ Just about the only limitation on what you can do with images is your imagination.\n\
    \n![](img/04a00d46bb1059867d95707babd62ee7_106_0.png)\n\nFigure 8.4 Using an Image\
    \ control.\n\n# Using a Basic List Box\n\nSo far we’ve been dealing with controls\
    \ that deal with a single piece of information, such as a single image, an individual\
    \ text box, or a single button. The list box control gives us the capability to\
    \ define templates that will be used to render a list of items. This control comes\
    \ built in with the capability to scroll through the items (including displaying\
    \ a"
  merge: -1
  img_proc: true
- pgno: 107
  md: "scrollbar at the appropriate times) and to respond to the selection of items,\
    \ including changing their appearance when selected. Basically, it’s everything\
    \ you would expect from a list control.\n\nTo see this in action, right-click\
    \ the Chapter 8 Basic Controls project and add a new portrait Windows Phone 7\
    \ page to the project; call it ListBoxPage.xaml. After the second TextBlock that\
    \ is part of the default page, add the following code snippet to the page:\n\n\
    ```\n<ListBox x:Name=\"myList\">\n    <ListBox.ItemTemplate>\n        <DataTemplate>\n\
    \            <StackPanel Orientation=\"Horizontal\">\n                <Image Source=\"\
    pistol_bullet.png\"/>\n                <TextBlock Height=\"30\" Text=\"{Binding}\"\
    \ Margin=\"10,10,10,10\" />\n            </StackPanel>\n        </DataTemplate>\n\
    \    </ListBox.ItemTemplate>\n</ListBox>\n```\n\nThere are a couple of new things\
    \ in here. I’m actually showing you a little bit about data binding before I even\
