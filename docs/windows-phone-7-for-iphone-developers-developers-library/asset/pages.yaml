- pgno: 212
  md: "This is the first step in a three-step sequence of asynchronous actions. When\
    \ the call to BeginRequestStream finishes, it’s going to invoke our callback (other\
    \ languages refer to this as a completion or a monad, if you’re into that sort\
    \ of thing). This callback is shown next, which builds the body of the request\
    \ by converting an XML document into a byte array and then performing the request\
    \ asynchronously:\n\n```\nvoid GetRequestStreamCallback(IAsyncResult result)\n\
    {\n    HttpWebRequest request = (HttpWebRequest)result.AsyncState;\n    Stream\
    \ postStream = request.EndGetRequestStream(result);\n\n    string xmlPayload =\n\
    \        \"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?>\" +\n        \"\
    <Customer xmlns:xsd=\\\"http://www.w3.org/2001/XMLSchema\\\" xmlns:xsi=\\\"http://www.w3.org/2001/XMLSchema-instance\\\
    \">\" +\n        \"<FirstName>Foo</FirstName>\" +\n        \"<LastName>Johnson</LastName>\"\
    \ +\n        \"<Address>\" +\n            \"<Line1>1 Fake St</Line1>\" +\n   \
    \         \"<City>FakeVille</City>\" +\n            \"<State>PA</State>\" +\n\
    \            \"<Zip>90210</Zip>\" +\n        \"</Address>\" +\n        \"</Customer>\"\
    ;\n    byte[] payloadBytes = Encoding.UTF8.GetBytes(xmlPayload);\n    postStream.Write(payloadBytes,\
    \ 0, payloadBytes.Length);\n    postStream.Close();\n    request.BeginGetResponse(\n\
    \        new AsyncCallback(GetResponseCallback), request);\n}\n```\n\nThe next\
    \ step in the chain is the asynchronous callback triggered by the completion of\
    \ a response. This response could be an error or it could be success. The only\
    \ way to find out is in the following callback code:\n\n```\nvoid GetResponseCallback(IAsyncResult\
    \ result)\n{\n    HttpWebRequest request = (HttpWebRequest)result.AsyncState;\n\
    \    HttpWebResponse response =\n        (HttpWebResponse)request.EndGetResponse(result);\n\
    \    Stream responseStream = response.GetResponseStream();\n    StreamReader streamReader\
    \ = new StreamReader(responseStream);\n    string responseString = streamReader.ReadToEnd();\n\
    \    Debug.WriteLine(responseString);\n    responseStream.Close();\n    streamReader.Close();\n\
    \    response.Close();\n}\n```"
