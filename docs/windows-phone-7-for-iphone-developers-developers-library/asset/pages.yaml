  md: "Unit testing support within Xcode is based on the open-source unit testing\
    \ framework SenTestingKit. This framework has classes and command-line tools that\
    \ will help you build automated tests and, ideally, embrace TDD within your iOS\
    \ applications.\n\nYou can write two different kinds of unit tests in iOS: logic\
    \ tests or application tests. In general, you can think of logic tests as what\
    \ we might think of as traditional unit tests, and application tests might be\
    \ considered integration tests or UI automation tests.\n\n# Logic Testing\n\n\
    To set up logic testing in your iOS application, you’ll need to create a new target.\
    \ I like to put the suffix “Test” (or better yet, “LogicTest”) on the end of my\
    \ target name so I can quickly and easily determine the purpose of the target\
    \ without relying on a cheat sheet. In the past, I have had Xcode applications\
    \ with so many different targets that I had to keep a piece of paper nearby that\
    \ explained each target and its purpose. If this ever happens to you as an iOS\
    \ developer, know that if you continue down this path, you could conceivably rip\
    \ a hole in the fabric of space-time itself.\n\nAfter you have a logic testing\
    \ target bundle created, set it as the active target. Next, create a new file\
    \ by selecting the File, New File menu option and pick iOS, Cocoa Touch Class,\
    \ Objective-C test case class from the available templates. Regardless of whether\
    \ I’m writing tests for iOS or for WP7, I prefer to have a single test class for\
    \ a single target class. In other words, if I have a class called Porsche and\
    \ I want to test it, I will create a single test class called PorscheTests or\
    \ PorscheLogicTests. Empty out the class header file so it contains an empty interface,\
    \ as shown:\n\n```\n#import <SenTestingKit/SenTestingKit.h>\n#import <UIKit/UIKit.h>\n\
    \n@interface PorscheLogicTests : SenTestCase {\n}\n@end\n```\n\nNext, empty out\
    \ the implementation with the exception of a single passing test method, as shown:\n\
    \n```\n#import \"PorscheLogicTests.h\"\n\n@implementation PorscheLogicTests\n\
    - (void) testPassesAlways {\n    STAssertTrue(TRUE, @\"This test always passes.\"\
    );\n}\n@end\n```\n\nWhen you compile the active target (your logic test target),\
    \ the compilation will fail if any of your unit tests fail, and the compilation\
    \ will succeed if any of your unit tests pass. This is a very important distinction\
    \ because these tests are executing at build time. Any"
