- pgno: 111
  md: "I’ve highlighted in bold a Storyboard object that I added to the page’s resource\
    \ dictionary. Don’t worry if this doesn’t make much sense now, it will become\
    \ clearer as you start writing more complex applications and progress through\
    \ the book.\n\nThis storyboard contains two animations that will both start at\
    \ the same time when the storyboard is started. If you are familiar with iOS and\
    \ Cocoa development, you can think of the storyboard much like an animation context.\
    \ For example, in iOS to perform a set of animations simultaneously, you first\
    \ call the beginAnimations: method of the UIView class. After configuring all\
    \ the animations you want to perform, as well as options like duration and easing\
    \ curve, you call the commitAnimations: method of the UIView class.\n\nFor Windows\
    \ Phone 7 Silverlight animations, the storyboard serves as the aggregator for\
    \ related animations. In this case, we are going to animate the Canvas.Top property\
    \ from 10 to 200 over the course of 5 seconds. At the same time, we animate the\
    \ target button’s Canvas.Left property from 10 to 200, but for this property we\
    \ will reverse the animation and continue indefinitely. This will have the effect\
    \ of moving the target button horizontally across the screen and back again forever.\n\
    \nAfter you’ve modified your XAML according to the code in Listing 8.8, add the\
    \ following method to the ListBoxPage.xaml.cs file:\n\n```\nprivate void animateButton_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    if (buttonStoryboard.GetCurrentState() ==\
    \ ClockState.Stopped)\n        buttonStoryboard.Begin();\n\n    double top = (double)animateButton.GetValue(Canvas.TopProperty);\n\
    \    double left = (double)animateButton.GetValue(Canvas.LeftProperty);\n\n  \
    \  buttonPosition.Text = string.Format(\"{0},{1}\", top, left);\n}\n```\n\n# Dependency\
    \ Properties\n\nIf you look carefully at how the Button is positioned within the\
    \ Canvas, you’ll see that it sets properties called Canvas.Top and Canvas.Left.\
    \ The button itself does not have a Top or a Left property because those properties\
    \ make sense only when the button is a child control of a Canvas. To keep controls\
    \ from being littered with these situational properties (among many other reasons),\
    \ dependency properties were created.\n\nWhen you want to place a control somewhere\
    \ within a Grid, you set the Grid.Row and Grid.Column properties on that control.\
    \ These properties belong to the Grid class, but can be set on any object residing\
    \ within a grid. These properties can also notify subscribers when they change\
    \ and can be animated by Silverlight’s animation sub-system. You see this when\
    \ you look at the code that displays the current values of the Canvas.Top and\
    \ Canvas.Left properties in the code for the animation button’s Click event. Even\
    \ though a background thread is constantly changing the value of the control’s\
    \ position within a Canvas, you can still read those values through the dependency\
    \ property system."
  merge: -1
  img_proc: true
- pgno: 112
  md: "> For more information on dependency properties and how they work, you can\
    \ consult either WPF Unleashed or Silverlight Unleashed. Knowing how these work\
    \ and how you can harness their power will make you an incredibly effective Silverlight\
    \ developer for mobile devices and desktops alike.\n\nRun the application now\
    \ and navigate to the list box page. When you tap the button it will start moving.\
    \ Keep tapping the button as it slowly descends down the page. Each time you tap\
    \ the button while moving, it reports its current position within the parent canvas\
    \ at the exact moment you tapped it, even though there is a completely separate\
    \ background thread performing the animation.\n\n# Introduction to Layout in Silverlight\n\
    \nSo far throughout this chapter you have seen several types of layout controls.\
    \ This section of the chapter will provide a little more detail on the purpose\
    \ of each type of layout control, how they work, and how you can use them in your\
    \ applications.\n\nLayout is an area in which Silverlight has a distinct advantage\
    \ over iOS. iOS doesn’t come with any low-level, flexible layout panel controls\
    \ like the StackPanel or the Grid. The UIView itself functions like a WP7 Canvas—child\
    \ views are placed at fixed positions within the parent view based on their coordinates.\
    \ There is no Grid control in iOS either; the closest you can get to that would\
    \ be creating a table view controller (we’ll discuss various WP7 alternatives\
    \ to Table View Controllers in later chapters as well) and subdividing custom\
    \ cells. As an iOS developer, after you start working with Silverlight’s advanced\
    \ layout capabilities, there is a good chance you will quickly become addicted\
    \ to having all that power available.\n\n# Painting on Canvas\n\nAs you might\
    \ have guessed by now from the previous code samples, the Canvas control provides\
    \ a fixed-position layout panel. Any child control within the panel has a fixed\
    \ position within that Canvas as indicated by the Canvas.Top and Canvas.Left dependency\
    \ properties.\n\nYou define a Canvas in XAML as follows:\n\n```\n<Canvas x:Name=\"\
    myCanvas\" Width=\"300\" Height=\"400\">\n    <TextBlock Text=\"This is inside\
    \ a Canvas\"\n        Canvas.Top=\"40\" Canvas.Left=\"100\" />\n</Canvas>\n```\n\
    \nAs mentioned earlier in the chapter, you aren’t limited to using plain old ordinary\
    \ Canvases. You can nest a Canvas within other layout panels, and you can host\
    \ other layout panels within a canvas. You can also do innovative things like\
    \ change the layout panel of a list box from its default to a Canvas so that the\
    \ list items are rendered in fixed, absolute positions."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Working with the StackPanel\n\nAs its name implies, the StackPanel is a layout\
    \ panel that arranges child elements in stacks, either horizontally or vertically.\
    \ You don’t need to specify which controls appear in which order, nor do you have\
    \ to specify any kind of coordinates.\n\nThe only thing you need to keep in mind\
    \ is the order in which the child controls appear within the StackPanel. The first\
    \ child element of the stack panel is the first one that will appear in the panel.\
    \ Take a look at the following stack panel definition:\n\n```\n<StackPanel Orientation=\"\
    Vertical\">\n    <Button>\n        <TextBlock Text=\"Button 1\"/>\n    </Button>\n\
    \    <Button>\n        <TextBlock Text=\"Button 2\"/>\n    </Button>\n    <Button>\n\
    \        <TextBlock Text=\"Button 3\"/>\n    </Button>\n    <Button>\n       \
    \ <TextBlock Text=\"Button 4\"/>\n    </Button>\n</StackPanel>\n```\n\nBy default,\
    \ a StackPanel will render its children vertically with each new child element\
    \ in the panel being placed below its preceding peer. To have the elements within\
    \ a StackPanel rendered horizontally, change the Orientation property of the stack\
    \ panel to Horizontal.\n\nAs with the Canvas, you can get some very nice and very\
    \ powerful results by nesting multiple StackPanels within each other, within Canvases,\
    \ or within Grids.\n\n# Using the Grid Control\n\nThe Grid control is an extremely\
    \ powerful layout panel. I won’t go into all the various details and nuances of\
    \ a Grid here, because you can get excruciating detail online from Microsoft’s\
    \ MSDN documentation or your favorite Silverlight book. The following is a simple\
    \ Grid definition:\n\n```\n<!--ContentPanel - place additional content here-->\n\
    <Grid x:Name=\"ContentPanel\" Grid.Row=\"1\" Margin=\"12,0,12,0\" Background=\"\
    AliceBlue\">\n    <Grid.ColumnDefinitions>\n        <ColumnDefinition Width=\"\
    200\"/>\n        <ColumnDefinition Width=\"200\"/>\n        <ColumnDefinition\
    \ Width=\"55\"/>\n    </Grid.ColumnDefinitions>\n    <Grid.RowDefinitions>\n```"
  merge: -1
  img_proc: true
