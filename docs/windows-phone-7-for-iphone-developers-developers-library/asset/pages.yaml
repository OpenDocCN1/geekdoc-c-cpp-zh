    \ of course, is actually sending them. From personal experience, having written\
    \ several applications for the iPhone that receive push notifications and from\
    \ talking to many developers of push-enabled applications, I can tell you that\
    \ this part is usually where the iOS developers start cringing. Their blood pressure\
    \ goes up, the stress level rises, and they start eating antacid drops like they\
    \ were candy. Needless to say, getting push notifications sent to an iPhone is\
    \ a very brittle process. It isn’t necessarily difficult, but there are hundreds\
    \ of tiny little moving parts, and if any of them are not in exactly the right\
    \ place, nothing works.\n\nThankfully, the process is a bit easier on Windows\
    \ Phone 7. An application that you’ve written that resides in the cloud can send\
    \ a push notification to a specific device using the channel URI that is part\
    \ of the HttpNotificationChannel instance returned either through construction\
