- pgno: 262
  md: "# Refactor. Again.\n\nThankfully, we don’t have to do much to make this work.\
    \ We just need to add a public setter to the ServiceProvider property on the ViewModelLocator\
    \ class. This will let us supply our own implementation of a service provider\
    \ so that when the CreateMain() method of the ViewModelLocator class is called,\
    \ the MainViewModel class will be handed the appropriate service provider instance.\n\
    \nHere’s the new ServiceProvider property:\n\n```\npublic static IMnemuseServiceProvider\
    \ ServiceProvider\n{\n    get\n    {\n        if (serviceProvider == null)\n \
    \           serviceProvider = new MnemuseServiceProvider();\n        return serviceProvider;\n\
    \    }\n    set\n    {\n        serviceProvider = value;\n    }\n}\n```\n\nThen\
    \ we modify the Init() method on our test class to make sure the ViewModelLocator\
    \ class uses the dummy service provider:\n\n```\n[ClassInitialize]\npublic void\
    \ Init()\n{\n    dummyProvider = new MockMnemuseServiceProvider();\n    ViewModelLocator.ServiceProvider\
    \ = dummyProvider;\n    ViewModelLocator.CreateMain();\n    main = ViewModelLocator.MainStatic;\n\
    }\n```\n\nNow we can run our test application to see whether we end up completely\
    \ green. As shown in Figure 17.2, we do indeed have a 100% pass rate on our unit\
    \ tests. We can now proceed with TDD to add new features and functionality to\
    \ our view models, as well as create additional unit tests to test functionality\
    \ that might have already been written. This ensures that, going forward, we can\
    \ be confident that new code additions don’t break code that used to work."
