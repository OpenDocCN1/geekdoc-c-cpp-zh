    # Building a Class


    Throughout the rest of this chapter we’re going to be building a class that has
    progressively more functionality. The goal is to walk you through the process
    of designing and building a full-featured class for both the iPhone and Windows
    Phone 7 so that you can compare and contrast and map your existing iPhone skills
    (if any) to how classes are created in C#.


    To demonstrate class creation, we need some behavior and data that we want to
    model. Throughout the rest of the chapter we’ll be working on a class that might
    show up in a game. Because we are good little programmers that have been following
    the advice of those who know better, this class will model just behavior, logic,
    and data encapsulation and will not have anything to do with UI. In short, this
    class is a pure model and not a view.


    The class we’re going to build as a starting point is a class that models the
    logic, data encapsulation, and behavior of an object that can participate in combat
    in a hypothetical mobile game. We’ll call this class a Combatant.


    To start with, we’ll create an empty class. In Listings 3.1 and 3.2, respectively,
    you can see the code for the Objective-C header (.h) and implementation (.m) files.
    Listing 3.3 shows this same (utterly empty, and completely useless up to this
    point) class in C#.


    # Listing 3.1 Combatant.h


    ```

    @interface Combatant : NSObject {


    }


    @end

