- pgno: 219
  md: "# Separating Your Concerns\n\n> *The mother art is architecture.*\n> *Without\
    \ an architecture of our own we have no soul of our own civilization.*\n> \n>\
    \ Frank Lloyd Wright\n\nThis chapter is the culmination of something this book\
    \ has been building toward for several chapters. As you have been going through\
    \ the book reading the text, looking at the source code, and running the samples,\
    \ hopefully a few things have been crossing your mind.\n\nFirst, hopefully you\
    \ have been enjoying the code samples and learning something along the way. Second,\
    \ your keen developer mind might be thinking something like this:\n\nThis is great\
    \ and all for simple “hello world” apps, but how does all this work in real production\
    \ apps? How can I create elegant, testable, simple, easy-to-maintain code that\
    \ solves real-world problems? How do I avoid the inevitable spaghetti that plagues\
    \ most apps of any real size?\n\nIf you’ve been thinking anything like that, this\
    \ chapter should make you very happy. There is a method to my madness. At the\
    \ beginning of the book I illustrated simple concepts to get you started using\
    \ crude, brute-force code samples. As the book progressed, the samples have been\
    \ getting more involved, and you might have even noticed that in the previous\
    \ chapter I deliberately separated the data model from the view model. In the\
    \ next chapter, you’ll learn about unit testing and test-driven development (TDD).\n\
    \nThis chapter combines a high-level discussion of architectural and design patterns\
    \ with a walkthrough of an open-source implementation of one of those patterns.\
    \ We’ll look at how the MVC pattern is applied to iOS application development,\
    \ and we’ll see how an adaptation of that pattern can be used to help you in your\
    \ quest to build amazing WP7 applications and do so in a scalable, testable, maintainable\
    \ fashion."
  merge: -1
