- pgno: 51
  md: "# Event-Driven Programming\n\n> Transmitted at the speed of light, all events\
    \ on this planet are simultaneous. In the electric environment of information\
    \ all events are simultaneous, there is no time or space separating events.\n\
    > \n> Marshall McLuhan\n\nThis chapter provides an overview of an often underrated\
    \ aspect of modern programming frameworks: events. In many cases when comparing\
    \ Objective-C to C#, there are subtle linguistic differences while the core concepts\
    \ remain the same.\n\nThis chapter gives you an overview of what true event-driven\
    \ programming is, how such programming is accomplished in Objective-C, and finally,\
    \ how this same type of programming can be accomplished in C# within the context\
    \ of a Windows Phone 7 application.\n\n# What Is Event-Driven Programming?\n\n\
    The subject of event-driven programming is an area in which Objective-C and C#\
    \ differ greatly and at a core, fundamental level. An event isn’t just a single\
    \ thing. When an event of some importance occurs, you have three pieces of information\
    \ that are typically required to take appropriate action in response to that event:\n\
    \n+   - The object sending the event—This object knows someone is interested in\
    \ the event that has occurred and is responsible for dispatching that event to\
    \ all subscribers.\n+   - The event itself—The sender needs to tell the receivers\
    \ exactly what happened and provide sufficient context."
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - The event subscriber or receiver—As far as C# is concerned, if a tree
    falls in the woods and there are no event subscribers to be told about it, nothing
    happened. When an event occurs, those objects interested in that event are told
    and are given the previous two pieces of information: the event sender and the
    context information about the event itself.


    As you read through this chapter, you will see how Objective-C’s “delegate pattern”
    is used and how that relates to the publish-and-subscribe event-driven model espoused
    by the .NET Framework.


    Another common misconception among both newbies and veterans in the C# world is
    that events are applicable only to the user interface. For example, most programmers
    can tell you that events are generated when you tap a button with your finger
    or when you submit text to an input control. However, far too many programmers
    don’t know that events can be both useful and powerful when used throughout all
    levels of your application, not just the UI. You will see extremely powerful examples
    of how essential event-driven programming is for WP7 when we get to a discussion
    on asynchronous programming and communication with external services.


    # Using the Delegate Pattern in Objective-C


    Objective-C doesn’t use events the same way that C# does, and this is often a
    source of confusion when programmers are trying to relate their skills from iPhone
    development to the .NET Framework or WP7 development.


    In iOS (and virtually all other Mac-based development using Objective-C) something
    called the delegate pattern is utilized almost exclusively for event-driven programming.
    This pattern works as follows:


    If a class needs to inform another class about something, or obtain information
    from another class, a reference to that object is stored as a delegate. This delegate
    isn’t like a C# delegate (which is roughly analogous to a C function pointer).
    Instead, this delegate is more like the dictionary definition of the word: the
    class is delegating functionality to another class.


    For example, one of the most common control types in iOS programming is the UITableView.
    This control displays data arranged in vertical rows. The individual cells in
    these rows can be highly customized, but no matter how customized the control
    might be, it still performs certain core functionality the same way.


    Rather than having some other class push data into the table view, the table view
    asks for data. This allows the table view to maintain its own optimization so
    that it asks only for the data it knows is going to be rendered on the screen
    (or will be rendered very soon). In addition to delegating the data source to
    another class, the UITableView also delegates the methods that respond to user
    events to another class, such as when a row is selected, when the view state changes
    into edit mode, and so on. There are even methods delegated to other classes for
    telling the table view how many groups there are, the style that should be used
    for the groupings, and for providing a custom cell to the view for each row being
    rendered.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'For those familiar with .NET programming, this pattern might seem entirely
    backward. .NET programmers, especially those used to Windows Forms or ASP.NET
    programming, are used to gathering the data themselves and then stuffing the data
    into a control through some kind of data-binding mechanism. The concept of the
    controller being a passive participant that is invoked only when the UI control
    needs it often seems very strange indeed.


    However strange it might seem to C# developers, this pattern is incredibly powerful
    and works amazingly well for iOS. Each type of delegate is required to expose
    a certain set of methods (some of which are optional, a very important point)
    so that the class utilizing the delegate can be assured that all delegated functionality
    is provided.


    The agreement between a delegate and the class doing the delegation is very often
    defined explicitly in the form of a protocol. For example, the UITableViewController
    class is a handy controller that comes pre-equipped to conform to the two different
    protocols required by the UITableView control: UITableViewDelegate (the protocol
    that deals with handling events that occur within the control) and UITableViewDataSource
    (the protocol that defines how a delegate must provide rows, cells, groups, and
    other data for the table view).


    Table 4.1 shows just a few of the methods that are part of the two delegate protocols
    that define the communication between the UITableView control and your application.
    As you will see later in this chapter, this pattern is very different from the
    way Silverlight controls communicate with your application in Windows Phone 7
    applications.


    # Table 4.1 Some Delegate Methods for iOS Table View Controllers


    | Protocol | Method | Description |

    |---|---|---|

    | UITableViewDelegate | tableView:willSelectRowAtIndexPath: | Used to perform
    actions before selecting a row |

    | UITableViewDelegate | tableView:didSelectRowAtIndexPath: | Invoked after a row
    has been selected by the user |

    | UITableViewDataSource | tableView:cellForRowAtIndexPath: | Returns a configured
    cell to be rendered by the table view in the appropriate place |

    | UITableViewDataSource | numberOfSectionsInTableView: | Returns the number of
    section groups in the view |

    | UITableViewDataSource | tableView:numberOfRowsInSection: | Returns the number
    of rows in a given section |'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The important thing to remember here when looking at the delegate pattern is
    that it often appears backward or passive when compared to traditional C# data-binding
    patterns. This is true, but the delegate pattern accomplishes far more than just
    data binding—it bundles together logically associated operations, defines them
    with a protocol, and then allows any control to be supplied with data or other
    parameters by any class.


    When used properly, the delegate pattern can contribute to highly cohesive applications
    with very well-defined boundaries and loose coupling between the UI, the models,
    and the controllers. Developers familiar with Mac and iOS programming will know
    how deeply ingrained the concept of Model-View-Controller is within the entire
    framework.


    As you will see in the next section, C# events operate in a different fashion
    entirely because they solve a different set of problems.


    # Using Events in C#


    Whereas a delegate is a class that conforms to a specific protocol and is agreeing
    to perform a certain set of logically related behaviors for another class, an
    event is a single occurrence of some fine-grained activity worth mentioning. To
    further differentiate the delegate pattern from C# events, an iOS will have only
    one delegate at a time (although they can be switched dynamically at runtime)
    whereas an event can have multiple subscribers at once and can notify them all
    simultaneously of the same event.


    In idiomatic C#, you will rarely see people make use of the delegate pattern (although
    it is entirely possible and often quite elegant when paired with interfaces).
    Instead, events are exposed on an object as endpoints to which consumers can subscribe.


    To continue our example from the previous chapter with Combatants, let’s expose
    a few events on the Combatant to make the game engine more flexible and reactive.
    A few of the events we might want to expose are the following:


    +   - When a Combatant is hit

    +   - When a Combatant hits another enemy

    +   - When a Combatant dies


    The game engine can subscribe to these events to perform specific actions when
    these events occur. For example, when a Combatant dies, the game engine can broadcast
    a message to all connected players indicating that some combatant has died as
    well as who did the killing. If you’ve ever played a multiplayer combat game,
    this particular pattern should seem familiar; most of us have seen scrolling messages
    on the bottom of our screens indicating that a buddy just stepped on a landmine
    or took a sniper bullet in the face.


    Listing 4.1 shows a new Combatant class (simplified to only contain things pertinent
    to demonstrating events and C# delegates). It exposes the three events previously
    discussed and contains wrapper methods for invoking these events. You will see
    this pattern very often in C# code because every event notification needs to be
    guarded by a check to see whether there are any subscribers. This type of plumbing
    work is handled for you automatically when you subscribe to Silverlight’s UI events.'
  merge: -1
  img_proc: true
