  md: "# Turn-Based Game Play\n\nAside from the networking facilities available to\
    \ Xbox Live games written by XBL partners, there are no out-of-the-box facilities\
    \ for building networked games on Windows Phone 7.\n\nTo build a turn-based game\
    \ server, you basically need to maintain the state (probably in a database) of\
    \ all running games. Each game usually consists of some shared game state visible\
    \ to all players, as well as the list of players currently taking part in this\
    \ game. If the game is a long-running game that can be advanced casually every\
    \ now and then by players taking a turn here and there whenever they get a chance,\
    \ you need to make sure that the games are persistent and that you have enough\
    \ storage to support the shared state of however many concurrent games you think\
    \ you’ll need to support.\n\nA ridiculously simple interface for a central, turn-based\
    \ gaming service written in WCF might look something like the one shown in Listing\
    \ 18.2. This contract assumes that games are started up and torn down by a separate\
    \ lobby service, so all operations take a GUID that indicates the unique ID of\
    \ the running (and persistent) game. Also remember that this is a completely far-fetched\
    \ example. The theory and practices behind the design of good mobile, multiplayer\
    \ games are beyond the scope of this book.\n\n# Listing 18.2 ITurnBasedGameService\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.ServiceModel;\n\nnamespace ConsoleApplication1\n\
    {\n[ServiceContract]\npublic interface ITurnBasedGameService\n{\n    [OperationContract]\n\
    \    TurnResult TakeTurn(Guid gameId, string playerId, TurnAction turn);\n\n \
    \   [OperationContract]\n    GameState GetGameState(Guid gameId);\n\n    [OperationContract]\n\
    \    Player[] GetPlayers(Guid gameId);\n\n    [OperationContract]\n    void SendMessage(Guid\
    \ gameId, string fromPlayerId,\n        string toPlayerId, string text);\n\n \
    \   [OperationContract]\n```"
  merge: -1
