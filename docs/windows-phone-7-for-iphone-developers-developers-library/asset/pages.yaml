- pgno: 92
  md: "# # Chapter 7 Introducing Expression Blend\n\nAfter developers spend a few\
    \ seconds thinking about the fact that transitioning between different visual\
    \ states is all done smoothly with animations, they start to see the power of\
    \ this framework.\n\nThis means that when a Silverlight object transitions from\
    \ one visual state to another, it does so with an animated storyboard. You can\
    \ control how long it takes to switch to this new state and any special effects\
    \ that occur as a result of this switch.\n\nAs a curmudgeonly as I am about using\
    \ visual design tools, I must admit that hand-typing in all the visual state management\
    \ stuff, even for simple property changes, is going to get really old really fast.\
    \ I am a firm believer in using the best tool for the job, and I know that working\
    \ with visual states is absolutely best done in Blend.\n\nHere's a little food\
    \ for thought and an assignment to do some exploring on your own with Blend: Stock\
    \ controls come with their own visual states, and different user interaction will\
    \ switch a control between visual states. A page is just a different type of control.\
    \ This means that a page can have visual states and you can create your own custom\
    \ visual states.\n\nOne of the biggest pains when building UIs for the iPad and\
    \ iPhone is dealing with rotation. Making sure that the user interface looks good\
    \ when rotated between landscape and portrait is a difficult and time-consuming\
    \ process, especially when you consider that you often need to hand-code property\
    \ changes to your views when the user rotates the phone or the iPad. What if you\
    \ were to assign names to your visual states such as “portrait” and “landscape”\
    \ or “portraitup,” and so on? Now all you need to do in Blend is rotate the design\
    \ surface to the right orientation and, in that particular visual state, record\
    \ mode, move and resize all your controls accordingly. Next, you need to programmatically\
    \ transition your page’s visual state every time the device changes orientation.\n\
    \nHere is some code you can override in your MainPage.xaml.cs that will programmatically\
    \ transition the page from its current visual state to the new one, invoking any\
    \ custom animations, layout changes, color changes, and whatever else you want\
    \ done. Again, remember that all these changes can be done in a timed, animated\
    \ storyboard.\n\n```\nprotected override void OnOrientationChanged(OrientationChangedEventArgs\
    \ e)\n{\n    // if you have 4 states instead of 2\n    // PortraitUp, PortraitDown,\
    \ LandscapeLeft, LandscapeDown\n    // VisualStateManager.GoToState(this, e.Orientation.ToString(),\
    \ true);\n    // if you just have Portrait or Landscape\n    string orientation\
    \ = (e.Orientation & PageOrientation.Portrait) != 0\n        ? \"Portrait\" :\
    \ \"Landscape\";\n    VisualStateManager.GoToState(this, orientation, true);\n\
    \    base.OnOrientationChanged(e);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Take some time now to go back through the project you’ve been working on in
    Blend throughout this tutorial. Explore, click, and break things. Play around
    with all the panes, panels, and properties that you can find. I highly recommend
    poking around with things so much that you feel completely and utterly lost and
    overwhelmed. It’s at that point where you can take a step back and go on with
    the rest of the chapters in this book. As you go through the subsequent chapters,
    all those foggy areas in your head and the questions you had about Blend, XAML,
    C#, and WP7 will eventually be answered, and lights will go on in your head. I’ve
    found that when learning new technology, having that initial experience of diving
    in and feeling completely lost helps guide my learning in the future. It makes
    the “light bulb” moments in the future that much more memorable, and I retain
    that information longer.


    # Summary


    This chapter provided you with an overview of Apple’s design tool for Xcode, Interface
    Builder. I then compared Interface Builder with Microsoft’s design tool, Expression
    Blend. We went through the basics of how to operate Blend, how to use Blend to
    create a Windows Phone 7 application, and finally we walked through a tutorial
    of how to use visual states and the Visual State Manager from Blend and Visual
    Studio.


    At this point you should have a good idea of what it will look and feel like to
    build WP7 applications using Expression Blend and Visual Studio. You probably
    have a lot of questions, and a lot of the controls used in this chapter might
    not make much sense. This is a good thing. Your curiosity will help keep you going
    throughout the rest of the book and will make the new information sink in deeper
    as you learn more about WP7 programming.'
  merge: -1
  img_proc: true
