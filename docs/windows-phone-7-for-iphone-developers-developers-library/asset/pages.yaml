    \            <Grid.RowDefinitions>\n                <RowDefinition Height=\"150\"\
    />\n                <RowDefinition Height=\"*\"/>\n            </Grid.RowDefinitions>\n\
    \            <Button Grid.Row=\"0\" Grid.Column=\"0\">\n                <TextBlock\
    \ Text=\"Button\"/>\n            </Button>\n            <Button Grid.Row=\"0\"\
    \ Grid.Column=\"1\">\n                <StackPanel>\n                    <TextBlock\
    \ Text=\"Other Button\"/>\n                    <TextBlock Text=\"hi\"/>\n    \
    \            </StackPanel>\n            </Button>\n        </Grid>\n    </StackPanel>\n\
    </Border>\n</Grid>\n```"
