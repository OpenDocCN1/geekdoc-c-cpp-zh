  md: "# From Xcode to Visual Studio\n\n> *A tool is usually more simple than a machine;\
    \ it is generally used with the hand, whilst a machine is frequently moved by\
    \ animal or steam power.*\n> \n> Charles Babbage\n\nThis chapter is all about\
    \ tools. As much as we might like to think otherwise, developers can’t produce\
    \ applications without the aid of modern tools such as Xcode, Visual Studio, Eclipse,\
    \ or any number of other IDEs.\n\nThis chapter covers the IDE used for developing\
    \ iOS applications, Xcode, and the IDE used for building Windows Phone 7 applications,\
    \ Visual Studio.\n\nDevelopers need to know some basic things about Visual Studio\
    \ so that they can move around within that environment smoothly and efficiently\
    \ and write their applications without the tools getting in their way. In addition\
