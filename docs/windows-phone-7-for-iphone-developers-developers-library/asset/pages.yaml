  md: "```\n```csharp\nusing System.Runtime.Serialization;\n\nnamespace IsolatedStorageDemo\n\
    {\n    public static class IsoStoreHelper\n    {\n        public static void WriteGraphToFile<T>(string\
    \ filename,\n            T sourceObject)\n        {\n            using (IsolatedStorageFile\
    \ isf =\n                IsolatedStorageFile.GetUserStoreForApplication())\n \
    \           {\n                using (IsolatedStorageFileStream stream =\n   \
    \                 new IsolatedStorageFileStream(filename,\n                  \
    \      FileMode.Create, isf))\n                {\n                    DataContractSerializer\
    \ dcs =\n                        new DataContractSerializer(typeof(T));\n    \
    \                dcs.WriteObject(stream, sourceObject);\n                    stream.Close();\n\
    \                }\n            }\n        }\n\n        public static T ReadGraphFromFile<T>(string\
    \ filename)\n            where T:class\n        {\n            T result = null;\n\
    \            using (IsolatedStorageFile isf =\n                IsolatedStorageFile.GetUserStoreForApplication())\n\
    \            {\n                using (IsolatedStorageFileStream stream =\n  \
    \                  new IsolatedStorageFileStream(filename,\n                 \
    \       FileMode.OpenOrCreate, isf))\n                {\n                    if\
    \ (stream.Length > 0)\n                    {\n                        DataContractSerializer\
    \ dcs =\n                            new DataContractSerializer(typeof(T));\n\
    \                        result = dcs.ReadObject(stream) as T;\n             \
    \       }\n                }\n            }\n            return result;\n    \
    \    }\n    }\n}\n```\n```"
