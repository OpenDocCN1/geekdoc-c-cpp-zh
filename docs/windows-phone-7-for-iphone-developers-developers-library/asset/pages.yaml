  md: 'recommendation is that this phase takes around 30 seconds and should only be
    about 5-ish lines of code.


    # Green


    Now that you’ve got a failing test, take another 30 seconds to write a very small
    amount of code. This small amount of code should make the test pass, even if you
    know it does so in a way that is inefficient, has a bad architecture or “code
    smell,” or in some other way is begging to be enhanced. The bottom line here is
    to make the test pass, even if you’re hardcoding values. This part takes some
    getting used to, especially for veteran “waterfall” developers who are used to
    spending weeks upfront figuring out what their code should look like before they
    write any of it. The green here refers to the green indicator from your automated
    test utility that reports all tests passing.


    # Refactor


    Now that you’ve got a test that passes, you should have a feeling of confidence.
    This confidence comes from the fact that you know, for certain, that if you make
    changes to your code and the light stays green, you haven’t screwed anything up.
    Take your hands off the keyboard and look at the code you’ve written. If you see
    room for improvement—hardcoded stuff you can take out, dependencies you can “loosen,”
    or other “code smells” that you can fix, have at it. The trick is to make small,
    iterative changes while keeping the light green. If you make the light go red
    during a refactor, and you’re really embracing the TDD lifestyle, you should feel
    your pulse quicken like some Hollywood hacker being forced to penetrate firewalls
    at gunpoint or risk losing his family. In short, you will become pathologically
    addicted to keeping the light green at any cost. This can be good but can also
    be bad—beware the desire to “cheat” just so you can get your tests passing.


    For more useful tips on agile development, TDD, and the red/green/refactor cycle,
    check out James Shore’s blog or his book, *The Art of Agile Development*. When
    you use this pattern often enough in your daily development, it becomes like a
    biofeedback system that, over time, embeds deep within your soul both a love of
    TDD and a bitter hatred of the color red.


    # Mocks and Stubs


    Often one of the hardest parts of unit testing to grasp is the word “unit.” When
    people start off testing, they will write tests and sure enough, those tests might
    often work, and they might even show green from time to time. The problem, though,
    is that the developers aren’t testing code in isolation. They aren’t unit testing,
    they are integration testing.


    For example, if you test a class and that class makes a web service, database,
    or disk I/O call as a result of your test, this isn’t a unit test. This is an
    integration test, and the test itself cannot be considered to be in isolation.


    This is typically where developers throw up their arms and get very frustrated.
    “I can’t test my code without calling the database!” they shout. “I can’t test
    this class without'
