- pgno: 109
  md: "# Performing Basic Animations\n\nAlthough you can certainly create compelling\
    \ user interfaces without any animation, today’s typical smartphone users demand\
    \ more from their apps. They want things to rotate, spin, bounce, jiggle, and\
    \ do so in a smooth, subtle way that gives them animated feedback to let them\
    \ know when the application is doing something, as well as to make the application\
    \ look and feel good.\n\nAs you progress throughout this book you will see more\
    \ animations and, if you want to dive into animations in depth, I suggest you\
    \ pick up a copy of Silverlight 4 Unleashed, by Laurent Bugnion. Although some\
    \ subtle differences exist in Silverlight versions between the full and mobile\
    \ versions, this book will give you a great deal of information on how animation\
    \ works.\n\nTo whet your appetite for animations, open up the ListBoxPage.xaml\
    \ file you worked with in the previous section. Comment out the list box (highlight\
    \ the control from begin tag to end tag and press Ctrl+K, and then Ctrl+C; this\
    \ will wrap the entire block in HTML-style comments) and change the XAML so that\
    \ it looks like the code in Listing 8.8.\n\n# Listing 8.8 ListBoxPage.xaml, Modified\
    \ for Animation\n\n```\n<phone:PhoneApplicationPage\n    x:Class=\"BasicControls.ListBoxPage\"\
    \n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n  \
    \  xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    xmlns:phone=\"\
    \n    clr-namespace:Microsoft.Phone.Controls;assembly=Microsoft.Phone\"\n    xmlns:shell=\n\
    \    \"clr-namespace:Microsoft.Phone.Shell;assembly=Microsoft.Phone\"\n    xmlns:d=\"\
    http://schemas.microsoft.com/expression/blend/2008\"\n    xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
    \n    FontFamily=\"{StaticResource PhoneFontFamilyNormal}\"\n    FontSize=\"{StaticResource\
    \ PhoneFontSizeNormal}\"\n    Foreground=\"{StaticResource PhoneForegroundBrush}\"\
    \n    SupportedOrientations=\"Portrait\" Orientation=\"Portrait\"\n    mc:Ignorable=\"\
    d\" d:DesignHeight=\"768\" d:DesignWidth=\"480\"\n    shell:SystemTray.IsVisible=\"\
    True\">\n    <phone:PhoneApplicationPage.Resources>\n        <Storyboard x:Name=\"\
    buttonStoryboard\">\n            <DoubleAnimation Storyboard.TargetProperty=\"\
    (Canvas.Top)\"\n                Storyboard.TargetName=\"animateButton\"\n    \
    \            From=\"10\" To=\"200\" Duration=\"0:0:5\"/>\n            <DoubleAnimation\
    \ Storyboard.TargetProperty=\"(Canvas.Left)\"\n                Storyboard.TargetName=\"\
    animateButton\"\n                From=\"10\" To=\"200\" AutoReverse=\"true\"\n\
    \                RepeatBehavior=\"Forever\"\n                Duration=\"0:0:1\"\
    />\n\n```"
