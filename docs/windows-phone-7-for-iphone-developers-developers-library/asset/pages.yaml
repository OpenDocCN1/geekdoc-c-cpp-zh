  md: '![](img/04a00d46bb1059867d95707babd62ee7_145_0.png)


    Figure 10.6 Sending a text message with the SmsComposeTask.


    # Composing an Email Message


    If the Windows Phone 7 device has at least one configured mail account, emails
    can be created programmatically. Again, because you are accessing system-level
    services, the user must provide final confirmation before sending the email.


    To create a new email message from your application, use the EmailComposeTask
    as shown next.


    ```

    EmailComposeTask newEmail = new EmailComposeTask();

    newEmail.To = "Jenny Jenny";

    newEmail.Subject = "I got it";

    newEmail.Body =

    @"For a good time, for a good time call....";

    newEmail.Show();

    ```


    # Using Choosers


    For the same reason that devices cannot allow developers to directly manipulate
    data and system-level services, developers are often prevented from querying or
    reading detailed, low-level information. This is for the protection of the consumer
    as much as it is for the protection of the device manufacturer and cellular carrier.
    To be able to guarantee consumers, carriers, and device manufacturers that rules
    and legal obligations with regard to'
  merge: -1
  img_proc: true
