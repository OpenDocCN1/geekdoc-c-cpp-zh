- pgno: 144
  md: '# Launching the Phone Application


    As mentioned at the beginning of this section, Windows Phone 7 will not allow
    any application you write to have direct access to the phone features. This is
    to keep the cellular network (and the people using it) from being abused. A compromise
    is to allow your applications to suggest to the phone a phone call that it would
    like to make. This then brings up a dialog that a user must confirm in order to
    place the call, as shown in Figure 10.5.


    ```

    PhoneCallTask phoneCall = new PhoneCallTask();

    phoneCall.DisplayName = "Jenny";

    phoneCall.PhoneNumber = "8675309";

    phoneCall.Show();

    ```


    ![](img/04a00d46bb1059867d95707babd62ee7_144_0.png)


    Figure 10.5 Placing a call with the PhoneCallTask.


    # Sending a Text Message


    The same reasoning behind limiting direct access to phone functionality prevents
    us from being able to directly send text messages. If you want your users to be
    able to send an SMS from your application, you can utilize the SmsComposeTask
    as shown in the following code (see Figure 10.6). The iPhone allows applications
    to send text messages through the use of an MFMessageComposeViewController that
    works in a nearly identical fashion.


    ```

    SmsComposeTask newSms = new SmsComposeTask();

    newSms.To = "Jenny Jenny";

    newSms.Body = "Who can I turn to?";

    newSms.Show();

    ```'
  merge: -1
  img_proc: true
