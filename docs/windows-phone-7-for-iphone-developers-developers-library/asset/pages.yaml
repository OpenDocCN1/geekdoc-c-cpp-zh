  md: '# Working with the Silverlight Unit Test Framework


    As I mentioned in my discussion of unit testing on Windows Phone 7 with nUnit,
    unit testing integration with the native tools and the IDE is virtually nonexistent
    at the time of this book’s writing. Getting Silverlight unit testing working on
    Windows Phone 7 feels a little on the “hack” side. However, it is worth it if
    you are at all interested in TDD or automated unit testing. We can also rest assured
    that in the future the unit testing experience will only get better.


    To get started, you need a Silverlight 3 version of the Silverlight toolkit available
    at http://silverlight.codeplex.com. If you go there today, you will find the Silverlight
    4 toolkit and the Silverlight for Windows Phone 7 toolkit. The Silverlight 4 toolkit
    is incompatible with Windows Phone 7 (you cannot add a reference to SL4 assemblies
    from a WP7 project) and the Windows Phone 7 toolkit doesn’t contain the Silverlight
    Unit Testing framework. This is where things start feeling somewhat hackish.


    If you don’t feel like scouring the Internet for precompiled Silverlight 3 binaries
    containing the Silverlight Unit Test framework, you can use the ones I’ve included
    in the code samples that accompany this chapter. These are prebuilt SL3 assemblies
    that you can reference from a Windows Phone 7 application. With that in mind,
    let’s get testing.


    First, you’ll need an application that you plan to test. For the rest of this
    chapter I’ll continue to use the Mnemuse application because it’s already an MVVM
    application that should, in theory, make it slightly easier to test than a traditional
    application. Second, you’ll need an application that will contain the tests.


    If you’ve ever done any unit testing in Visual Studio 2010 before, or if you’ve
    used the nUnit test runner, this should seem awkward. If you’ve done unit testing
    in iOS before, this should feel like creating a new application target for application
    tests. The reason is that there is no UI in Visual Studio 2010 to display the
    results of tests, nor is there an integrated test runner. In short, we need a
    WP7 application that will execute our tests and display the results. Thankfully,
    99.9% of that UI comes from the Silverlight Unit Test Framework and is compatible
    with Windows Phone 7.


    Now that you have two applications in your Visual Studio 2010 solution—a WP7 app
    that is your real app, and a WP7 app that is your test app—you need to add some
    references to the test app:


    +   - A reference to your real application (in our case. this is the Mnemuse project).

    +   - A reference to Microsoft.Silverlight.Testing (this came from the SL Unit
    Testing framework, often affectionately referred to as SLUT).

    +   - A reference to Microsoft.VisualStudio.QualityTools.UnitTesting.Silverlight
    (also from the v3 SLUT binaries).

    +   - A reference to GalaSoft.MvvmLight.Extras.WP7.

    +   - A reference to GalaSoft.MvvmLight.WP7.


    With those references in place, you now need the UI that will display the results
    of test execution. Fortunately, the Silverlight Unit Testing Framework’s UI is
    more robust than'
