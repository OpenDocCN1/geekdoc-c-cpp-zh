- pgno: 21
  md: "# C# and Objective-C: Second Cousins Twice Removed\n\n> *I always call my cousin\
    \ because we're so close.*\n> *We're almost like sisters, and we're also close\
    \ because our moms are sisters.*\n> \n> Britney Spears\n\nThis chapter provides\
    \ you with a comparison of the two programming languages involved in iPhone and\
    \ Windows Phone 7 Development: Objective-C and C#. You see where these languages\
    \ are similar, where they differ, and how they support the complex application\
    \ development frameworks for their respective platforms.\n\nThe first section\
    \ of this chapter deals with the origins of each language. The chapter then continues\
    \ with coverage of some of the most basic concepts of C# and how those apply to\
    \ iPhone developers.\n\n# The Origin of Objective-C\n\nObjective-C's lineage starts\
    \ further back than that of its younger counterpart, C#. In the 1980s, Brad Cox\
    \ and Tom Love ran a company called Stepstone. While at this company, Brad Cox\
    \ attempted to fuse what he saw as the best qualities of the Smalltalk programming\
    \ language with the utility and power of C. He did this by modifying a standard\
    \ C compiler to add some of the features of the Smalltalk language.\n\nHis first\
    \ working prototype was called OOPC, which stood for Object-Oriented Programming\
    \ in C. Love and Cox formed a new company, Productivity Products International,\
    \ and in 1986 Cox published the first definitive description of the Objective-C\
    \ programming language."
  merge: -1
  img_proc: true
- pgno: 22
  md: 'In 1988, NeXT (the company Steve Jobs started when he left Apple) licensed
    the use of Objective-C from Stepstone and made its own Objective-C compiler. Eventually,
    NeXT stopped trying to make hardware and focused on its custom software development
    environment, which included NeXTStep and the open standard on which it was based,
    OpenStep.


    After Apple acquired NeXT in 1996, it used OpenStep in its new operating system,
    Mac OS X. This acquisition gave Apple the Objective-C development tool Project
    Builder, and the UI design tool Interface Builder.


    Eventually Xcode replaced Project Builder, and Xcode and Interface Builder have
    undergone radical growth throughout their histories. Today, Xcode and Interface
    Builder (which is now an integrated part of Xcode as of version 4) can be used
    to build Mac applications as well as iPhone, iPod Touch, and iPad applications
    using the Objective-C programming language.


    # Note


    Xcode can be used to build applications with other languages as well. For example,
    you can use Xcode to build Cocoa applications for the Mac using the Ruby programming
    language. For the rest of this book, however, we will focus only on the capabilities
    and features of Xcode as they pertain to iOS development with Objective-C.


    # The Origin of C#


    Back in 2000 and 2001, Microsoft was hard at work trying to build a new runtime
    as a successor to its component services runtime, COM+. While building this new
    runtime, Microsoft discovered that the runtime it was building solved more problems
    than just what it was trying to fix with COM+, and it was eventually repurposed
    and re-dubbed the Common Language Runtime (CLR). While searching for an end to
    a problem called “DLL Hell” that had plagued COM (Component Object Model, a binary-based,
    tightly-coupled application composition model), Microsoft had constructed something
    with far broader scope.


    This runtime is a managed environment that serves as a host for managed code,
    written in any of the languages that were built for the CLR. These languages include
    Visual Basic .NET, IronPython, IronRuby, and of course, C#.


    In 2001, I was writing C# code using the command-line compiler (a beta at the
    time) and had started work on my first .NET technical publication. I was so convinced
    that C#, and .NET in general, was going to change the way developers wrote software
    that I dove headfirst into learning this powerful new framework.


    The chief architect behind the design of the C# programming language is Anders
    Hejlsberg, who was also heavily involved in the design of other popular programming
    languages, including Turbo Pascal and Delphi.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "The first version of C# was released in January 2002, and the most recent version\
    \ of the language, version 4.0, was released in April 2010 alongside the 2010\
    \ release of Visual Studio.\n\nSilverlight, one of the frameworks that enables\
    \ application development on Windows Phone 7, was originally released in 2007\
    \ after a brief run being referred to as “WPF/E,” or “WPF Everywhere.” Silverlight,\
    \ which is the framework used for application development throughout this book,\
    \ is a cross-platform subset of the .NET Framework and the UI functionality that\
    \ originally came with WPF (Windows Presentation Foundation).\n\nSilverlight and\
    \ XNA are two different application development frameworks available to Windows\
    \ Phone 7 developers, both of which sit atop the .NET Framework and the CLR, allowing\
    \ developers to write code for either environment in C#. Silverlight is a framework\
    \ that uses the familiar control hierarchy concept for building applications,\
    \ whereas XNA is used for games and is an engine wrapped around the “game loop”\
    \ concept.\n\n# Language Basics\n\nThis next section takes you through some of\
    \ the basics of the two languages, such as differences in core syntax as well\
    \ as a discussion of method calls versus message passing. Chapter 3, “Object-Oriented\
    \ Programming,” builds on the rest of this chapter and provides a comparison of\
    \ object-oriented programming techniques with both languages.\n\n# Core Syntax\n\
    \nFirst, let’s take a look at some basic Objective-C that you might find in a\
    \ typical iPhone application. Listing 2.1 shows some sample Objective-C code that\
    \ should look familiar to an iOS developer.\n\n```\nListing 2.1 Sample Objective-C\
    \ Code to Fetch an Image from a URL\n\nNSString* urlString = @\"http://www.site.com/images/pic.png\"\
    ;\n\nNSData* imageData = [[NSData alloc] initWithContentsOfURL:\n    [NSURL URLWithString:urlString]];\n\
    \nUIImage* image = [[UIImage alloc] initWithData:imageData];\n[imageView setImage:image];\n\
    [imageData release];\n[image release];\n```\n\nListing 2.2 shows some basic C#\
    \ that you might find in a Windows Phone 7 application. Despite there being quite\
    \ a few differences in how the languages work and their syntax, both are still\
    \ fairly easy to read for programmers with at least a basic understanding of C-derived\
    \ languages."
