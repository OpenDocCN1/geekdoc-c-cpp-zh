- pgno: 209
  md: "# Building Smart Clients\n\n> *If Facebook were a country, it would now be\
    \ the 6th most populous in the world.*\n> \n> InsideFacebook.com\n\nThis chapter\
    \ provides an overview of one of the most powerful application types for mobile\
    \ devices—the smart client. The days of the massive, monolithic desktop application\
    \ are numbered. Even applications that sit on modern desktops often communicate\
    \ with services on the Internet for supplemental information, research, lookups,\
    \ or even complex calculations.\n\nA smart client is an application that takes\
    \ advantage of the hardware of the host environment. It is capable of using the\
    \ GPS, the accelerometer, high-resolution video, audio, and of course, network\
    \ devices. These applications can be anything from casual games to weather applications\
    \ to applications such as Netflix, Flixster, Facebook, Twitter, and so on. Although\
    \ all these applications are fully installed WP7 applications, the real work is\
    \ done elsewhere, and the real data resides in the cloud. Aside from a few niches,\
    \ today's mobile phone users often won't even bother installing applications that\
    \ aren't connected in some way to the world (via the Internet, GPS, Wi-Fi, and\
    \ so on) around them.\n\nThis is the model that this chapter discusses, showing\
    \ you how to harness the networking and storage capabilities of WP7 to build applications\
    \ that talk to platform-neutral RESTful services as well as applications that\
    \ talk to Windows Communication Foundation (WCF) services on .NET-based application\
    \ servers.\n\n# Consuming RESTful Services\n\nREST is an acronym that stands for\
    \ REpresentational State Transfer. To summarize quickly so we can get to the code\
    \ demos as fast as possible, this boils down to treating the Web like a collection\
    \ of resources. Every resource has a Unique Resource Identifier"
  merge: -1
  img_proc: true
- pgno: 210
  md: '(URI). By using verbs that are part of the standard HTTP vocabulary, such as
    GET, PUT, DELETE, and POST, and using the URIs as if they were nouns, we can construct
    a vocabulary that allows us to manipulate and query resources regardless of the
    underlying platform on which these resources are hosted.


    Suppose you have a resource collection called Users exposed at a URI like http://my.server.com/Users.
    Using typical REST assumptions, issuing an HTTP GET request to this URI should
    give you some representation (almost always XML, often in “feed” form, although
    lately JSON has become a popular alternative) of that collection. Sending an HTTP
    GET to http://my.server.com/Users/bob should, according to convention, give you
    a representation of the resource known as “bob” belonging to the resource collection
    “Users”. Using an HTTP PUT to that same URI will replace the representation of
    “bob” on the server with the one you sent. Sending an HTTP DELETE to that URI
    should, assuming you have access, delete the resource known as “bob.”


    For a full discussion of RESTful architecture, check out the extensive Wikipedia
    entry on it at http://en.wikipedia.org/wiki/Representational_State_Transfer. Many
    books talk about the various ways to implement RESTful services in different languages.
    One such book is RESTful .NET (ISBN: 0596519206) by Jon Flanders. If you’re into
    Ruby, the Practical REST on Rails 2 Projects book by Ben Scofield is another excellent
    guide.


    It doesn’t take very much or deep thought to start to realize some of the benefits
    of this type of exposure of services. Rather than utilizing someone’s fixed remote
    procedure call (RPC) style interface, where you are invoking proprietary methods,
    you’re just using the basic vocabulary of the Internet itself. RESTful services
    have rapidly become popular, especially among social networking sites that want
    to make their information and APIs as easy to use and widely available as possible.


    # Why LINQ to XML Is Your New Best Friend


    There are two parts to communicating with RESTful services. The first is the HTTP
    communication where your code needs to be able to send payloads utilizing standard
    HTTP methods such as GET and POST. (PUT and DELETE are often left out to allow
    for a wider variety of client consumption, but that’s a topic better discussed
    in one of the aforementioned books on RESTful services.)


    The second part of communicating with RESTful services is being able to read and
    write the payload, or resource. In most cases this payload is represented as XML—either
    as XML that conforms to some custom schema or as a feed type of XML, such as Atom
    or RSS.


    This is why LINQ to XML is your new best friend. LINQ to XML will allow your C#
    code to rip through any XML document (obtained either locally or from the Web),
    process it, query it, and turn it into usable view model data quickly, efficiently,
    and in a way that is easy to read and understand by other developers.


    The first class you need to talk to RESTful services is the WebClient class. Although
    more robust alternatives are available in the full version of the .NET Framework,
    WebClient is the go-to class that is available to Silverlight developers for making
    web'
