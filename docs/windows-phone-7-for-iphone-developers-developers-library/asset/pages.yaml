- pgno: 308
  md: 'You might think that this manifest would control the name of your application
    as it appears when pinned to your start screen or in the list of installed applications,
    but this is incorrect. The application title that shows up on the phone itself
    after installation is controlled by a single attribute in your AssemblyInfo.cs
    file in the Properties folder. Here’s what this attribute looks like in my AssemblyInfo.cs
    file:


    ```

    [assembly: AssemblyTitle("Apocalypse Trainer")]

    ```


    Also make sure you set the product name and copyright information in this file:


    ```

    [assembly: AssemblyProduct("Apocalypse Trainer")]

    [assembly: AssemblyCopyright("Copyright © Kevin Hoffman 2010")]

    ```


    With this in place, build and clean your application and deploy it to a real Windows
    Phone 7 device. See what your application looks like in the installed applications
    list as well as when pinned to the start screen. Fiddle with and tweak the various
    manifest and application settings and properties until your application looks
    exactly the way you want it to. Only when you’re done with these tweaks should
    you consider uploading the application to the Marketplace.


    # Submitting an App to the Marketplace


    So, now you think you’re ready to submit your application to the Marketplace.
    You’ve tested and debugged the application from every angle you can imagine, including
    running your application on an actual Windows Phone. If you haven’t run your application
    on a real Windows Phone, you need to go back to the previous section in this chapter.
    There is no substitution for testing your application on a real device. To make
    sure that there are no surprises when your application is being tested and certified
    by Microsoft, you really need to do testing on a real device.


    Assuming you’ve got your application ready to go, you can start the certification
    process by uploading it to the Marketplace. To start, go to the App Hub at http://create.msdn.com.
    Log in with the Live ID you associated with your developer account, and click
    the Submit for Windows Phone 7 button to submit a new application. Make sure you’re
    using Internet Explorer during this process. I know this sounds silly in this
    modern day and age of HTML5 and high levels of browser compatibility, but I experienced
    utter failure during step 2 when attempting this process using Chrome. When I
    switched to Internet Explorer, everything worked properly.


    Step 1 of application submission looks like the screen shown in Figure 21.4.


    At this step you must supply information about the application, including its
    name, version number, target platform, and the application package itself. The
    application package is the XAP file that resides in the Release directory underneath
    your application’s VS2010 project directory. There are some free-form text entry
    fields here for your own developer notes and notes you can supply that will be
    read by the certification testers.


    Step 2 of the process involves the application description and categorization.
    Here you supply the detailed description of the application (shown in Figure 21.5),
    the category, subcategory, and some other information.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/04a00d46bb1059867d95707babd62ee7_309_0.png)


    Figure 21.4 Application upload step 1.


    ![](img/04a00d46bb1059867d95707babd62ee7_309_1.png)


    Figure 21.5 Application upload step 2.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'In step 3 (shown in Figure 21.6), you supply the application artwork. You are
    required to supply a 173x173-pixel (96 DPI) PNG for the large application tile,
    a 99x99-pixel PNG for a small application tile, a 200x200-pixel image to be used
    when your application is viewed in the Marketplace on a PC, and at least one 480x800-pixel
    screenshot. In Figure 21.6, you can see that I’ve supplied all the minimum requirements
    plus a few extra screenshots.


    ![](img/04a00d46bb1059867d95707babd62ee7_310_0.png)


    Figure 21.6 Uploading application artwork.


    Remember that to get true 480x800-pixel screenshots from the emulator, you need
    to have the emulator set to view in Full Size. On my laptop, which is a full 1080p
    screen, this takes up a large portion of the screen, so you’ll need to prepare
    for this in advance and provide enough screen real estate to see all 800 vertical
    pixels. This step in the submission process will reject images that are not the
    right size.


    After you’ve supplied the application artwork, the description, the category,
    and the actual XAP package, you need to supply pricing information (shown in Figure
    21.7). Here you indicate whether your application supports a trial mode, whether
    your application can be distributed outside your country of origin, and how much
    you plan to charge. Note that the application price is a drop-down box, not a
    free-form text box. This means that there is only a certain set of prices you
    can use to provide consistency throughout the Marketplace. The lowest you can
    charge for a paid application is 99 cents.


    Finally, after you have finished providing all the details for your application,
    your dashboard will show all your applications and their status. As you can see
    from Figure 21.8, my application was ready for testing when I took this screenshot.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Figure 21.7 Setting application pricing.


    Figure 21.8 Status of application certification.


    Additionally, you can see a warning message in Figure 21.8 indicating that my
    payment information is incomplete. In fact, I had provided the bank account information
