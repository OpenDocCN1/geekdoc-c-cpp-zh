- pgno: 62
  md: '# Beware of Static Classes and Properties


    Although I showed you that using static classes and event properties is one way
    of providing for a global event notification system in your application, you must
    take this advice with a grain of salt.


    C# applications are garbage-collected. This means that a process runs in the background
    and cleans up your messes as you make them, freeing the memory allocated to objects
    that are orphaned or no longer in scope. Static classes and the properties they
    expose never leave scope. This means they are never orphaned and the memory allocated
    to them will never be reclaimed.


    In short, if you can avoid the use of static classes and properties for anything
    (events or otherwise), do so. Before you create a bunch of static events on a
    class for global notifications, make sure that the effort is necessary. If you
    can deal with locally scoped event handling, do that instead; your memory footprint
    will be smaller, and garbage collection cycles will be quicker.


    # Summary


    In this chapter, you were given a brief overview of event-driven programming from
    both an iOS and a Windows Phone 7 perspective.


    In iOS (as well as Cocoa on the Mac) development, the delegate pattern is used
    extensively to allow objects to communicate with each other using known and agreed-upon
    contracts called protocols. The delegate pattern is used for everything from invoking
    methods in response to user events to supplying data to controls of different
    types, and it can be used by developers when building their own custom frameworks.
    The delegate pattern is typified by a passive feel where, rather than pushing
    data and functionality at controls, the controls passively request data and functionality
    on an as-needed basis. Even if you never use this pattern in your WP7 development,
    you should know and respect this pattern because it enables so many of the development
    features that make iPhone programming so compelling and powerful.


    This chapter then moved from discussing the delegate pattern to discussing how
    events are handled in C#. You saw how to expose event properties, how to publish
    events, and how to subscribe to those events. Finally you saw how to utilize static
    classes and event properties to expose global events.


    With the knowledge of OOP you gained in the previous chapter combined with the
    event-based programming knowledge in this chapter, you should be reaching a point
    where you are getting ready to start writing your first WP7 application.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Rendering and View System Basics\n\n> Painting is poetry that is seen rather\
    \ than felt, and poetry is painting that is felt rather than seen.\n> \n> Leonardo\
    \ Da Vinci\n\nThis chapter provides an overview of how the underlying control\
    \ rendering systems work on both the iOS and Windows Phone 7 platforms. This chapter\
    \ is not about the controls themselves (there will be plenty of chapters on that\
    \ later in the book). Rather, this chapter provides a review of the UIKit view\
    \ system, including a brief discussion of coordinate systems, points versus pixels,\
    \ and more.\n\nThis chapter next introduces you to Silverlight from a low-level\
    \ perspective. Here you will see how Silverlight composes declarative UI elements\
    \ and then renders them onto the screen and allows users to interact with those\
    \ controls.\n\nHaving this kind of low-level knowledge of the plumbing of the\
    \ view rendering systems might not seem all that useful now, but after you start\
    \ rolling up your sleeves and writing some very serious WP7 applications and controls,\
    \ you will be thankful that you have a basic understanding of what is going on\
    \ under the hood and how that relates to the workings of a typical iOS application.\n\
    \n\n\nIf you have done any iPhone programming, you know that everything visible\
    \ to the user is dealt with in layers. Think of it like a deck of cards. At the\
    \ very bottom of the deck is the table. This is a UIWindow. Although you can technically\
    \ have more than one UIWindow, only one window is displayed to a user at any given\
    \ time."
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The window, despite being an object, does not have any visual aspects. Unlike
    a typical desktop window, there is no close box, no minimize button, no context
    menu, nor even a title bar.


    Every visual control in iOS inherits directly or indirectly from UIView, even
    the UIWindow. Think of the views as cards. Each one of these cards is placed on
    the table (inside a UIWindow’s list of child views). New cards placed on the table
    can be placed in any orientation at any location. This means that new cards can
    cover up old cards or can exist without occluding any other view (card) beneath
    them.


    Now that you’re thinking about a table with a pile of cards scattered on it, imagine
    looking through a cardboard tube down at a small section of that table. That cardboard
    tube is the rendering area for the iPhone, iPod Touch, or iPad’s screen. Any card
    that you can see while looking through that narrow tube is rendered, and anything
    else outside the tube is not displayed to the user, nor can any touches or other
    user-generated events affect those cards.


    In short, everything you see and interact with in iOS is the direct result of
    a tree of nested views. Every UIView has a list of child views that are rendered
    on top of that view. Remember that view composition on iOS is done from the bottom
    up. To put that another way, child views occlude or cover over their parents.
    You can use all sorts of tricks with transparency and varying levels of opacity
    to create incredibly cool effects and user interfaces that rely on nothing more
    than clever view composition. In fact, clever view composition, good static images,
    and alpha blending are often used to create compelling and fast user interfaces
    without very much overhead.


    # Displaying Graphics and Rendering in iOS


    One of the most important things to remember about displaying and positioning
    graphics, controls, images, or anything else on iOS are coordinate systems and
    view transformations.


    The coordinate system starts with the origin at the top-left of the view. This
    is always the origin of the actual view (although the view may be transformed
    to appear to have a different origin when the device is rotated). The X coordinates
    continue upward from 0 heading to the right, whereas the Y coordinates increase
    growing downward from the origin. Unlike a center-origin system, views that are
    positioned entirely in negative coordinates are not visible.


    When views are rendered in iOS, the drawRect: method is used to perform any custom
    drawing that the developer wants done within that view. Then each of the current
    view’s subviews is told to draw itself. This process is done recursively until
    every view in the view hierarchy has been given a chance to render itself, from
    the bottom up.


    Finally, it is important to remember that in iOS, any time you refer to a coordinate
    or a size, you are referring to it in terms of points rather than pixels. This
    distinction provides a scalable layer of abstraction between the physical pixel
    coordinates of the device and the developer. The iPad, iPod touch, and the iPhone
    4.0’s “retina display” all have different screen resolutions and pixel densities.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'The iOS rendering engine (often referred to as Quartz) utilizes scalable vector
    graphics. By having developers express locations and sizes in terms of points
    rather than pixels, their applications can work in environments with varying pixel
    densities and still have the UI maintain the same relative appearance. Obviously,
    developers can choose to create different UIs for different devices (for example,
    using the larger resolution but lower pixel density of the iPad versus smaller
    resolution and higher pixel density of the iPhone 4), but having the unifying
    concept of a device-independent point rather than tying developers to pixels is
    freeing.


    Finally, the last important point to mention about layout and rendering in iOS
    is that whether you use Interface Builder or Objective-C, the end result is that
    views are controlled programmatically. A view defined in Interface Builder is
    just executing code on your behalf, whereas a custom view you’ve written is controlled
    entirely by your own Objective-C code. As you will see in the following discussion
    of Silverlight, Silverlight places more emphasis on a declarative, markup-style
    way of defining user interface elements.


    # Introduction to XAML and Silverlight


    As you already know if you’re an iOS developer, UIKit is the collection of controls
    and APIs used for producing the user interface for iPhone and iPad applications.
    The Windows Phone 7 counterpart is Silverlight, a collection of controls and APIs
    used for building user interfaces on Windows Phone 7 (and also on the web with
    the larger and more powerful Silverlight 4).


    One thing that iOS and other developers often find difficult to adjust to is XAML.
    Extensible Application Markup Language (XAML) is an XML dialect that Silverlight
    uses for declarative user interface construction. If you’ve ever done any development
    for Android or Flex, you might already be familiar with the concept of using declarative
    XML for user interfaces.


    XML is handy for a couple of reasons. The first is that it is easy for software
    to read and write, which makes XAML “designer-friendly.” The second reason is
    that XML is human-(well, those humans who belong to the subspecies homo developus)
    friendly as well. This means that developers can choose to type in the XML for
    their UI by hand, with the aid of a design tool, or use a combination of both.


    Using XML to build UI isn’t really a new concept. What is unique to XAML is that
    XAML isn’t just a proprietary dialect that can be used to produce UI elements
    like the XIB file format for iOS or the view XML used by Android.


    XAML is actually a generic, all-purpose instantiation language. This means that
    instead of requiring a design tool or some kind of parser to have detailed knowledge
    of the underlying UI framework (like Interface Builder’s XIB files), XAML has
    no such tight coupling. XAML can be used to instantiate any .NET object types
    and is even used for non-UI purposes, such as the Windows Workflow Foundation
    (WF) in enterprise application development.


    As you will see throughout this book, just about every piece of user interface
    (and even some things that are not visible) can be represented as XAML. As you
    see the code'
  merge: -1
  img_proc: true
- pgno: 66
