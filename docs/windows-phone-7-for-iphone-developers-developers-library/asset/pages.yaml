    # The AutoMapper


    There is a project available on CodePlex that is an implementation of the “mapper
    pattern.” This class essentially automates the conversion between domain models
    when the property names and data types of those classes match. You can also define
    custom mapping rules that aid in mapping from one object type to another. For
    example, we could use this automapper to map from a ViewModel.Book to a Model.Book
    instance rather than using the static extensions I’ve written previously. At the
