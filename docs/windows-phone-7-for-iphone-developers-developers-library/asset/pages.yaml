- pgno: 137
  md: "# Using Hardware and Device Services\n\n> *It's hardware that makes a machine\
    \ fast. It's software that makes a fast machine slow.*\n> \n> Craig Bruce\n\n\
    This chapter provides an overview of the device and overall system capabilities\
    \ of Windows Phone 7. Up to this point you’ve seen how to create your own user\
    \ interfaces and learned some of the basic techniques for building simple Windows\
    \ Phone 7 applications.\n\nOne of the biggest reasons developers like to build\
    \ smartphone applications and the main reason people like to own smartphones is\
    \ because they’re, quite simply, smart. Without the capability to make phone calls,\
    \ store contacts, open web pages, play videos, or listen to music, a smartphone\
    \ has very little appeal, and applications on those devices have even less appeal.\n\
    \nThis chapter takes you through the various system capabilities of iOS devices\
    \ and provides you with a walkthrough of similar (or even entirely new) functionality\
    \ on Windows Phone 7 devices. By the time you’re done with this chapter, you will\
    \ know how to take advantage of all the shared services, launchers, choosers,\
    \ and device sensors available to you as a WP7 developer. Armed with the information\
    \ you’ve read up to this point and with this new information, you will be well\
    \ on your way toward making incredible WP7 applications.\n\n# Review of Device\
    \ Capabilities\n\nWhen the iPhone first came out, it was the first device of its\
    \ kind in many respects. However, it was certainly not the first nor the most\
    \ powerful smartphone. Some might argue"
  merge: -1
  img_proc: true
- pgno: 138
  md: 'that it was the easiest to use or the most universally appealing, but the physical
    capabilities of the device (aside from multitouch) have been in smartphones for
    a while now.


    Because of the incredible popularity of the iPhone, Android devices, Blackberries,
    and even Windows Mobile (not to be confused with Windows Phone 7) devices, consumer
    demand for features on those phones has reached an all-time high. Devices that
    don’t take pictures now are often considered broken or “crippled.” Smartphone
    consumers scoff at the idea of owning a phone that doesn’t play video, music,
    run apps, and do a handful of other things that even just a few years ago would
    have been considered the stuff of science fiction.


    The following list describes the capabilities and services offered by modern smartphones.
    As I address each item, I will point out areas where the iPhone or Windows Phone
    7 differ, where they are similar, and where the access to those features by developers
    might differ. For example, some smartphones might have a feature but might not
    allow developers to access it. Others might allow developers to access it but
    only in the form of a launcher (a system application is launched with no low-level
    API interference from the developer). Finally, some system features might be exposed
    as rich APIs that the developers can manipulate directly.


    +   - Address Book/Contacts—iOS has exposed access to the underlying Contacts
    list through an API. Windows Phone 7 allows users to select contact emails and
    phone numbers with a chooser, as well as save emails and phone numbers to new
    or existing contacts.

    +   - Text Messaging—Both the iPhone and Windows Phone 7 devices have very rich
    SMS capabilities, including the capability to send and receive pictures attached
    to those messages. Programmatic access to sending text messages is available to
    developers on both platforms.

    +   - Phone Calls—Obviously, both platforms have the capability to make phone
    calls. To initiate a new phone call on the iPhone, you instruct the application
    to open a URL with the “tel:” prefix. We will cover how to initiate phone calls
    in Windows Phone 7 later in this chapter.

    +   - Location/GPS—Both the iPhone and Windows Phone 7 devices have the capability
    to receive GPS signals. These days, a smartphone without a GPS isn’t considered
    very smart at all. This is evidenced by the sheer number of location-aware applications,
    ranging from augmented reality to apps that help you find the best plate of cheese
    fries within two miles of your current location.

    +   - Accelerometer—Accelerometers in smartphones measure the current amount of
    acceleration on three different axes. These sensors can be used for everything
    from turning your phone into a steering wheel for a video game to letting you
    shake the phone to roll the dice in your favorite board game. Both the iPhone
    and Windows Phone 7 are equipped with accelerometers with very high sampling rates,
    allowing for all kinds of applications.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Multimedia**—When it comes to multimedia, no one can deny the market
    domination of iTunes, so it is only natural that the iPhone would contain a rich
    multimedia experience. Building on the work Microsoft started with the Zune and
    later the Zune HD, Microsoft has also built in rich media playback capabilities
    in its OS.

    +   - **Messaging (email)**—Both devices have rich email capabilities, although
    the list of features available in Microsoft’s Exchange for Windows Phone 7 builds
    on Microsoft’s history of building enterprise mail servers.

    +   - **Photos**—Picture-taking capabilities vary by device. Older iPhones have
    cameras with less resolution; newer iPhones have the capability to take videos,
    and camera resolution and capabilities vary by manufacturer and model for WP7
    phones.

    +   - **Maps**—iOS devices make use of Google Maps and its underlying APIs to
    provide map services and integrate them with the onboard GPS device. Windows Phone
    7 utilizes, unsurprisingly, the Bing Maps service and its APIs.

    +   - **Calendar**—iOS exposes access to the underlying Calendars through a robust
    API. At the time of the writing of this book, the Windows Phone 7 SDK offers no
    such access to calendar events stored on the phone.

    +   - **Search (web, local, and news)**—On an iOS device you can slide the springboard
    out of the way (swipe to the right on the first page), and this reveals a search
    box, allowing you to search through applications, data, emails, and contacts.
    Windows Phone 7 takes this one step further by allowing you to use the same interface
    to search the phone, search locally (via a combination of Bing search and the
    phone’s GPS), search the web, and search news. You can programmatically bring
    up the WP7 search interface.

    +   - **Web Browsing**—A mobile version of Safari (which is built on the open
    source browser framework called WebKit) provides the user interface to the web
    on iOS devices, whereas a mobile version of Internet Explorer (a hybrid of IE9
    and custom features) fills this role on Windows Phone 7 devices. Both browsers
    on both platforms can be activated programmatically by applications.


    # Using Launchers


    With all the power available in devices that fit in the palm of our hands comes
    a great deal of responsibility. If the device manufacturers or the OS creators
    gave us developers unfettered access to all of the minute details of the device
    and its hardware, invariably we would create applications that could wreak all
    kinds of havoc on a cellular network. In an effort to safeguard the network integrity
    of the cellular providers and to ensure that all applications play as nicely together
    as possible, sometimes developers are given only partial access to system resources.


    In these cases, one option we have is to use launchers. Launchers give us the
    capability to invoke various system-level functions, but to do so using vendor-controlled
    UI and in a tamper-proof fashion. For example, instead of giving developers the
    ability to directly'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'manipulate outbound calls (which would create a giant candy-filled piñata of
    hackery for malicious developers), we must instead use a launcher. We can seed
    that launcher with a phone number or contact that we would like to dial, but in
    the end the phone has the ultimate authority as to whom and when it dials.


    # Using the Save Phone Number Task


    Although some launchers allow applications to start various system processes,
    others allow applications to save data to systemwide resources such as Contacts.
    One such launcher is the SavePhoneNumber task. With this task, you can tell it
    that you would like to save a phone number, and the phone will then bring up a
    dialog asking the user to select a contact (or create a new one) to which the
    phone number will be assigned.


    The following code creates an instance of the SavePhoneNumber task and calls the
    Show method to bring up the dialog that will then guide the user through the process
    of completing (or canceling) the act of saving a phone number to a contact.


    ```

    SavePhoneNumberTask phoneSave = new SavePhoneNumberTask();

    phoneSave.PhoneNumber = "8675309";

    phoneSave.Completed += (s, e) =>

    { MessageBox.Show("Phone number task complete."); };

    phoneSave.Show();

    ```


    Figure 10.1 shows the screen prompting the user for a new phone number, and Figure
    10.2 shows the screen after a new contact has been created with this phone number.


    ![](img/04a00d46bb1059867d95707babd62ee7_140_0.png)


    Figure 10.1 The SavePhoneNumber task, prompting the user to enter a number.'
  merge: -1
  img_proc: true
