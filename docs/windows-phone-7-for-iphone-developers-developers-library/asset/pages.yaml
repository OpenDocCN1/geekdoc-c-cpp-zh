- pgno: 24
  md: "# Listing 2.2 Sample C# Code to Fetch an Image from a URL\n\n```\nWebClient\
    \ wc = new WebClient();\nwc.OpenReadCompleted +=\n    new OpenReadCompletedEventHandler(wc_OpenReadCompleted);\n\
    \nwc.OpenReadAsync(new Uri(\"http://www.site.com/images/pic.png \",\n        \
    \        UriKind.Absolute));\n...\n\nvoid wc_OpenReadCompleted(object sender,\
    \ OpenReadCompletedEventArgs e)\n{\n    StreamResourceInfo sri =\n        new\
    \ StreamResourceInfo(e.Result as Stream, null);\n    BitmapImage imgsrc = new\
    \ BitmapImage();\n    imgsrc.SetSource(sri.Stream);\n    MyImageControl.Source\
    \ = imgsrc;\n}\n```\n\nDon’t worry if either of these code samples seems confusing\
    \ at the moment; by the time you get to the end of this book, all of the preceding\
    \ will seem like second nature to you.\n\nFrom the previous two code listings,\
    \ you should be able to fairly quickly see a couple of things about how C# and\
    \ Objective-C are similar and where they differ. One of the most important differences\
    \ to keep in mind is that although Objective-C is a superset of C and can compile\
    \ any ANSI C code, C# is a managed language that is only C-like and is inspired\
    \ by C++ (despite rumors you might have heard indicating that C# was inspired\
    \ by Java). This means that functions as they exist in C aren’t possible in C#.\
    \ Any executable code in C# must occur inside a class (we’ll talk about OOP in\
    \ the next chapter).\n\nAnother key difference in core syntax is that in Objective-C,\
    \ as in C and C++, there are header (.h) files and code implementation (in C these\
    \ are .c files; in Objective-C, these are .m files). C# does not separate code\
    \ between header and implementation, and all code resides within C# (.cs) files.\n\
    \nAt their core, they both share the following core syntactical similarities:\n\
    \n+   - Type declaration of members follows the same C-style syntax (for example,\
    \ int x; double y;).\n+   - Both use semicolons as executable statement delimeters.\n\
    +   - Both use curly braces ({ and }) to mark the beginning and end of code blocks.\n\
    +   - Both are easily integrated to third-party projects.\n+   - Both share many\
    \ looping keywords and syntax, such as for, while, and so on."
