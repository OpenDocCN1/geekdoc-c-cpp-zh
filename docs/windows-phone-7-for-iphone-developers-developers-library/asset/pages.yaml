    \ or Wi-Fi, you might be thinking, “FM radio? What’s that?”\n\nWhether you agree\
    \ with the decision or not, Windows Phone 7 devices have the capability to support\
    \ an FM radio tuner, and the Windows Phone 7 SDK has the capability to control\
