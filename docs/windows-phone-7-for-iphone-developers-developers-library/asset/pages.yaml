    \ tier or layer.\n\nWhat if we modified the constructor of our TaxHandler class\
    \ so that instead of creating instances of concrete web service client proxies,\
    \ it accepts instances of objects that implement contracts? These contracts can\
    \ correspond to the functionality of the web services, but they’re just contracts.\
    \ The implementation now is up to the client consuming the TaxHandler class. In\
    \ our case, that’s either the real application or a suite of unit tests.\n\nSo,\
    \ in C#, we might change the constructor to look like this:\n\n```\npublic TaxHandler(ITaxService\
    \ taxService, IStockService stockService)\n{\n    this.TaxService = taxService;\n\
    \    this.StockService = stockService;\n}\n```\n\nNow when the client code calls\
    \ the ComputeTax method, the TaxHandler class will invoke methods on objects that\
    \ implement a contract. There won’t be any tight coupling between the TaxHandler\
    \ class and the physical implementation of the application tier that supports\
    \ it.\n\nWhether we use a Dependency Injection framework to automatically supply\
    \ configuration-controlled instances of these objects or whether our test methods\
    \ define their own implementations of these contracts, the end result is the same:\
    \ We can now test just the ComputeTax method in isolation and verify that it does\
    \ as we expect—it makes two web service calls and returns a result that is an\
