- pgno: 265
  md: "# Building Connected\nSocial Games\n\n> *Just play. Have fun. Enjoy the game.*\n\
    > \n> Michael Jordan\n\nThis chapter sheds some light on the oft-neglected arena\
    \ of casual gaming on mobile devices. When developers think of mobile games, they\
    \ typically think of OpenGL ES games for iOS devices such as the iPhone and iPad,\
    \ or they think of Direct3D via the XNA developer toolkit on Windows Phone 7.\
    \ The goal of this chapter is to remind you that there are more gaming options\
    \ than going with high-production, render-engine type games. There is a lot to\
    \ be said for favoring gameplay, community, and connectivity over graphics.\n\n\
    Many of today’s most popular mobile games are popular more because of their social\
    \ aspects and pure, simple gameplay and less because of their graphics (although\
    \ making a game look good certainly doesn’t hurt).\n\nThis chapter discusses the\
    \ connected, social gaming features that are available on today’s modern mobile\
    \ gaming platforms such as Windows Phone 7, the iPhone, and the iPad. After discussing\
    \ these features, I’ll talk about the features that are available in Apple’s gaming\
    \ toolkit and how you might go about implementing those features as a Windows\
    \ Phone 7 developer. By the time you finish reading this chapter, you should have\
    \ a good handle on the capabilities, benefits, and drawbacks of Windows Phone\
    \ 7 when it comes to building community-oriented gaming experiences. If you want\
    \ to know how to build arcade-style, fast-paced 3D or 2D games using Direct3D\
    \ on Windows Phone 7, you’ll want to pick up a book on XNA Game Studio 4.0. XNA\
    \ Game Studio is beyond the scope of this book."
  merge: -1
  img_proc: true
- pgno: 266
  md: 'If you have no interest in creating games for Windows Phone 7 or learning about
    mobile gaming in general, feel free to skip this chapter. Then, when you realize
    you really did want to know about mobile gaming, feel free to come back and read
    it. This chapter is as much about game theory and concept as it is about game
    development.


    # Features of Connected Mobile Gaming Platforms


    In this next section I want to spend a little bit of time talking about mobile
    gaming platform features. Before I get to a straight-up comparison between iOS
    and Windows Phone 7, I want to make sure that you know exactly what I’m comparing
    and why. To that end, I’ll spend a little time talking about the features that
    I consider essential to a modern, connected, highly social gaming platform. Remember
    that I’m not comparing features that show up only in high-end graphical mobile
    gaming platforms such as the Nintendo DS or the Sony PSP, just features that enable
    multiplayer gaming and social features like cooperation, competition, leaderboards,
    achievements, and so on.


    # Lobbies and Matchmakers


    Many multiplayer games need some way for players to find each other. This is because
    not all games allow you to play against or with people standing right next to
    you. It’s not only possible, but it is becoming increasingly common that the other
    players in your game are in different locations, time zones, or even countries.


    These games need some way of figuring out who the players are and what devices
    they are using. Typically, these games have a limited number of players and the
    gaming sessions are temporary. In other words, the game world in which these games
    take place isn’t persistent. You might see games like this where players take
    part in matches of a strategy game, individual sessions of chess, or specific
    multiplayer missions of a combat or military simulation game.


    In multiplayer games where small groups of players meet up and take part in a
    short-lived gaming session, there is usually a piece of software running on a
    server somewhere that is responsible for putting these players together and facilitating
    the multiplayer session startup and teardown. These software agents are usually
    referred to as lobbies or matchmakers.


    To summarize, these agents are typically responsible for some or all of the following:


    +   - Locating players based on any number of filters, including geographic, game
    preferences, relative skill level, status of locked or unlocked portions of the
    game, and so on

    +   - Facilitating communication between players after they are grouped together

    +   - Facilitating the transition of players from a lobby to an instance of a
    running game

    +   - Handling the transition of players from a terminating game instance back
    into a lobby'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'When playing games on consoles like the Xbox 360, these lobbies often contain
    rich displays of statistics or information about the map or game session that
    is currently loading. Additionally, if the system allows voice communication in-game
    (both Xbox 360 and iOS GameCenter games have this capability), players can often
    communicate while waiting in the lobby to formulate strategies, talk about the
    impending zombie apocalypse, or discuss the latest changes in the weather.


    Whether you write the code for the lobby on your own servers, write lobby code
    that gets hosted on a third party, or whether your gaming framework provides lobby
    facilities on your behalf, transient multiplayer gaming sessions are rarely possible
    without some kind of lobby or matchmaking agent.


    # Leaderboards and Achievements


    When you stop to think about some of the gameplay elements that create the most
    memorable, most addictive, most highly played games, those elements can often
    be boiled down to two core features: *progress* and *competition*.


    Mobile devices are inherently different from consoles with controllers that are
    typically hooked up to ridiculously large televisions and absurdly loud surround-sound
    systems. Typical mobile gamers want to pull out their phone when they’re bored
    or idle for a few minutes and pass that time playing the game. When reality calls,
    they want to put the phone back in their pocket and go on with their lives. As
    a result, your game needs to compel people to come back into the game, to keep
    playing long after they initially purchased the game.


    One way game developers get players to continually come back for more is through
    *progress*. Whether it’s by having a hero gain experience points, levels, gold,
    and loot through adventuring, or whether it’s by accumulating stats such as kills
    or wins, players crave progress. They love that there is something tangible (as
    tangible as a bunch of bytes in a portable device can be) to show for their effort—that
    their increasing skill at the game is rewarded in some way.


    Another way to show players’ progress is through a reward system. Games with these
    features are becoming increasingly popular. Facebook is positively littered with
    reward-based games where people have long ago lost track of the original plot
    of the game and are purely in it to collect as many rewards as possible. Games
    can give out badges, achievements, or awards for accomplishing something that
    took a lot of effort, time, exploration, or just plain luck. Players love the
    sense of accomplishment they feel when they look at the collection of awards they’ve
    amassed.


    As players gain in experience, points, levels, and amass their horde of achievements,
    they can compare that progress against friends they know as well as the rest of
    the world. This is where leaderboards come in. Games that keep track of the top
    players in a variety of categories give players incentive to keep coming back
    to play more and more, hoping that eventually they might get their name to show
    up on one of the global leaderboards. Fame is a big motivator for many gamers,
    whether that fame involves being better than their co-workers or better than the
    rest of the world.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'As with lobbies and matchmaking agents, some gaming platforms come preloaded
    with APIs for manipulating achievements and leaderboards, and some require you
    to maintain your own. Whether you roll your own achievements and leaderboards
    or whether you use the ones provided by your gaming development platform, don’t
    underestimate the addictive replay value that progress and competition can add
    to an already great game.


    # Turn-Based Game Play


    When we think about multiplayer games, often our minds drift to scenes of players
    furiously kicking, punching, shooting, or scoring goals against other players.
    Although this is certainly a common type of game, on mobile devices it’s often
    not the most popular way of doing multiplayer games.


    On mobile devices, the network connection is prone to brief interruptions. If
    you’re on a train that goes under a tunnel, if you step into an elevator, or stand
    under a steel bridge, you can lose your cellular data connection. If you’re playing
    a high-speed, fast-paced multiplayer action game, this kind of connection interruption
    can rapidly sour you on the entire gaming experience as you watch your player
    die a horrible, lag-induced death. There is a kind of multiplayer game that is
    more suited to mobile devices that experience random periods of poor-to-nonexistent
    connectivity: turn-based games.


    Think about the simple games of chess, checkers, Battleship, Go, or Connect 4.
    These games are all turn-based games. From an occasionally connected mobile device,
    these types of games can be lots of fun when tailored to the on-the-go lifestyle
    of the typical smartphone user.


    Instead of sitting down in a room together to play chess, two people can maintain
    a long-running game of chess that might last for days or weeks. When your opponent
    makes a move, your smartphone can get a push notification to let you know that
    your opponent moved. This lets you either make your move right away, or you can
    put the phone away and make your move later. It’s a very loose, casual style of
    gameplay that fits extremely well as a multiplayer mobile phone game. These types
    of games are also often very easy to build in UI frameworks like Silverlight or
    Apple’s UIKit, and graphic-intensive frameworks such as Direct3D and OpenGL ES
    are often overkill for this type of gameplay.


    I was once having dinner with a friend when his phone vibrated. He pulled it out,
    tapped a few things, and then put the phone back in his pocket. When I asked him
    if it was anything important (thinking it might have been his office), he replied,
    “No, someone just attacked my base. I sent some troops to take care of it. You
    gettin’ the nachos?” That’s when I truly fell in love with the idea of the long-running,
    turn-based game as played out on mobile devices.


    These games have a lot of potential from a development standpoint because it is
    possible to create these turn-based games with very little server infrastructure.
    After you’ve managed to find the other players for your match (see the previous
    section on lobbies and matchmakers), it’s possible to manage the rest of the gameplay
    through clever use of push'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'notifications and peer-to-peer state synchronization techniques. Additionally,
    the state of a match often takes very little storage space, and so a small amount
    of infrastructure can typically host an enormous number of long-running, turn-based
    games.


    # Real-Time Multiplayer Gaming


    With this type of game, “real-time” refers to the fact that there is little to
    no delay between player actions and when they take place. Additionally, all the
    players in a real-time game often exist in the same virtual world. For example,
    in an MMORPG (massively multiplayer online role-playing game), players from around
    the world might team up to defeat a single dragon.


    In another type of game, three or four players might compete on the same map in
    a real-time strategy game, ordering units to attack, defend, harvest, and build
    their way to victory. Other players in the game can react to player movements
    immediately, and changes to the shared game state are reflected in real-time on
    every player’s device.


    Games like this are usually very heavy consumers of network resources. Depending
    on how the game is played, slow or intermittent network connections can mean the
    difference between death and victory. As a result, players usually choose to play
    these games over more reliable Wi-Fi networks.


    # Overview of Apple’s Game Center and GameKit API


    Now that we’ve gone over some of the basic terminology and concepts related to
    casual and social gaming on mobile devices, this section of the chapter provides
    an overview of what Apple provides for its iOS developers. If you’re an iOS developer,
    some of this should seem familiar. For Windows Phone 7 developers, it might help
    to know what facilities are available out-of-the-box for iOS developers in terms
    of enabling social, competitive, collaborative, and casual gameplay.


    Game Center is Apple’s rough (emphasis on rough, as you’ll learn by reading the
    rest of this chapter) equivalent of Xbox Live. It provides a core set of services
    to players revolving around their iTunes identity. The use of the iTunes identity
    makes perfect sense because most iPhone and iPad users have an iTunes account
    they use for purchasing applications and music.


    Through Game Center, players can establish friend lists, see leaderboards, and
    find friends with whom to play Game Center-enabled games. The process of enabling
    an application for Game Center, at least from an AppStore point of view, involves
    checking a box in iTunes Connect indicating that Game Center is enabled for the
    application.


    # Achievements


    Achievements (or badges, awards, or whatever you want to call them) are unlockable
    rewards given to players who perform specific tasks in a game. These tasks can
    be any-'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'thing from killing a certain number of enemies, dying in a spectacular fashion,
    or finding a hidden area on the map.


    An API that is part of GameKit allows you to query for the list of achievements
    a player has already unlocked within your game. You can also programmatically
    grant or revoke achievements. The list of achievements that are possible in your
    game, including the culture-localized descriptions of those achievements, are
    all defined by logging into the iTunes Connect portal and modifying the Game Center
    settings for your application. To unlock an achievement, just pass the unique
    ID of the achievement to the appropriate method in the GameKit API.


    The GameKit API is isolated. This means that you are limited by the API to only
    reading and writing data that pertains to your application. You cannot query the
    list of achievements earned from other applications, nor is there a global achievement
    list. This view differs from the classic Xbox Live view, where you can navigate
    to a list of every unlocked achievement in every game by viewing the game’s profile.


    # Leaderboards


    Leaderboards, also configurable through iTunes Connect, allow your application
    to keep track of statistics of players and make those statistics available globally.
    Any device running your application can access the global leaderboards. All you
    need to do is set the numeric value for a particular player’s profile, and the
    leaderboard configuration does the rest.


    You can rank players by kill count, experience points, levels, or any other arbitrary
    value that is representable as some number. Again, the leaderboards are sandboxed
    to your application so that your code has access only to leaderboards belonging
    to your application. Your app can access the leaderboards programmatically to
    provide a custom or themed UI, or it can launch the standard Game Center Leaderboard
    UI.


    # Networking API


    Just providing unfettered access to leaderboards and achievements makes writing
    Game Center games with GameKit a compelling proposition. Add the fact that GameKit
    also comes with a robust set of networking APIs, and Game Center games become
    a nearly irresistible target for independent and, in many cases, commercial game
    developers.


    The GameKit APIs provide the capability to find friends and other nearby players
    through a number of means. First, the application can use stock UI dialogs provided
    by Apple to find players nearby through either Bluetooth or on the local Wi-Fi
    network. If this isn’t enough, the game can use custom services written by the
    game developer or global services provided by Apple for finding connected friends,
    regardless of the means by which those friends are connected.


    Once in the game, GameKit provides developers with the capability to halt game
    sessions programmatically. They can also send messages containing arbitrary data
    to individual players or all connected players, facilitating both direct and broadcast
    data.'
