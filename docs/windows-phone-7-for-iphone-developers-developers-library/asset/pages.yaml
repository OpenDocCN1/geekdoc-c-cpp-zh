    \n    Foreground=\"{StaticResource PhoneForegroundBrush}\"\n    SupportedOrientations=\"\
    Portrait\"\n    Orientation=\"Portrait\"\n    mc:Ignorable=\"d\"\n    d:DesignWidth=\"\
    480\"\n    d:DesignHeight=\"696\"\n    shell:SystemTray.IsVisible=\"True\"\n \
    \   DataContext=\"{Binding Main, Source={StaticResource Locator}}\">\n```"
