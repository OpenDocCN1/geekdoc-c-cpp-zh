- pgno: 181
  md: "# The Phone Execution Model\n\n> *Intellectual growth should commence at birth\
    \ and cease only at death.*\n> \n> Albert Einstein\n\nThis chapter provides an\
    \ overview of the Windows Phone Execution model and explains how the iPhone and\
    \ Windows Phone 7 deal with multitasking, or at least as close as either platform\
    \ can get to true multitasking. The first part of this chapter provides a review\
    \ of the various multitasking capabilities of the iPhone and to what extent developers\
    \ are allowed to participate in those features.\n\nThe rest of this chapter deals\
    \ with the application life cycle of Windows Phone applications, also known as\
    \ the *Windows Phone Execution Model*. You will learn how to take advantage of\
    \ transient and persistent application state, application activation, tombstoning,\
    \ and much more.\n\n# Multitasking on iOS 4\n\nWith the release of the fourth\
    \ generation of the iPhone and iOS 4 came the long-awaited “multitasking.” The\
    \ reason that I put the word “multitasking” in quotes is because regardless of\
    \ whatever the hype might say, it isn’t quite the kind of multitasking to which\
    \ desktop application developers have become accustomed.\n\nThere are certainly\
    \ features of the phone that are truly multitasking, but the extent to which everyday\
    \ iPhone developers are allowed access to multitasking and background functionality\
    \ is still limited."
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The following is a brief list of the ways in which users and developers alike
    experience multitasking on the iPhone 4:


    +   - **Background audio**—Users were already familiar with the experience of
    having music playing in the background while they performed other tasks. iPhone
    4 extends this capability to non-Apple applications, allowing your application
    to continue to play audio even after the user has exited the application.

    +   - **VoIP**—Along the same lines as background audio, Voice-over-IP (VoIP)
    applications can receive calls while the user is in another application. In fact,
    users can even receive VoIP calls if the phone is locked and no applications are
    running in the foreground.

    +   - **Location/GPS**—Whether on the iPhone or Windows Phone 7, getting a decent
    GPS coordinate from the hardware can sometimes take a while. The iPhone 4 lets
    applications continue to monitor location in the background.

    +   - **Push notifications**—The previous chapter provided an in-depth look at
    how push notifications work on Windows Phone 7. Push notifications provide an
    elegant means of keeping users informed of important events without requiring
    the application to be running in the foreground all the time.

    +   - **Local notifications**—iPhone 4 now allows for the scheduling of events
    and alarms for specific applications rather than just the alarm clock functionality.
    Although not true multitasking, this also provides an elegant way of delivering
    certain kinds of solutions without requiring an application to be running constantly
    in the background.

    +   - **Fast app switching**—iPhone 4 allows for fast application switching, which
    allows users to leave an application and come right back to the spot they were
    when they left without having to reload the app. As you’ll see later in this chapter,
    a similar facility is used extensively on Windows Phone 7.

    +   - **Task completion**—If your iPhone application is in the middle of doing
    something that shouldn’t be interrupted for fear of data loss or corruption, iOS
    4 now allows an application to finish up the important task in the background
    as the user exits the application.


    As you can see, although there are an awful lot of clever and efficient ways to
    get work done without consuming battery or running applications constantly in
    the background, developers have very little access to what desktop programmers
    would consider true multitasking. However, if you spend a little time thinking
    about the design of your application, you can create some very compelling features
    without needing “real” multitasking.'
