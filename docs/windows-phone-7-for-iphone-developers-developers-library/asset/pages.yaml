- pgno: 135
  md: 'Each of the buttons and menu items can have an event handler attached to its
    `click` event, allowing you to perform whatever logic you need to perform or even
    navigate to different pages.


    Every page also has an `ApplicationBar` property that you can set at any time.
    This lets you programmatically swap application bars in and out based on context
    or any other activity within your application. This gives you far more power and
    flexibility than a standard iOS Tab Bar control.


    # Summary


    One of the hardest tasks in adopting a new platform is mapping all your existing
    skills to the new environment. You need to learn new languages, new terminology,
    new patterns, new practices, and develop new habits.


    This chapter provided you with that basic mapping of iOS skills with some of the
    most common UI patterns: navigation bars and tab bars. These user interface elements
    show up in a vast majority of the applications available in the App Store.


    Using the information in this chapter, you should now have a very good idea of
    how you can take the skills you have in building navigation and tab bar applications
    for iOS and map that to building new and compelling Pivot and Panorama applications
    with powerful controls like the application bar on Windows Phone 7.'
  merge: -1
  img_proc: true
