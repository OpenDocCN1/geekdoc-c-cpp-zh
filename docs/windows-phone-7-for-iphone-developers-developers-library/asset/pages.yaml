- pgno: 148
  md: '![](img/04a00d46bb1059867d95707babd62ee7_148_0.png)


    # # Using Hardware Services and Sensors


    So far, you’ve seen how to use “soft” services such as choosers and launchers.
    These facilities allow your application to interact with system-level data and
    services in a safe way that never allows your application to do, see, or modify
    anything without the explicit consent of the user.


    This next section takes you through using some actual hardware services, such
    as the accelerometer, the phone vibration controller, using an FM radio tuner,
    and of course, using the GPS.


    # ## Controlling Vibration


    Windows Phone 7 devices have the capability to vibrate. Most modern cell phones
    have the option of vibrating instead of playing an audible ringtone to make the
    devices less obtrusive in public places. This has become a blessing in recent
    years as the people who have cell phones vastly outnumber those who do not.


    A nice feature in the Windows Phone 7 SDK is the capability for your application
    to start and stop vibration on the phone. This gives you the capability to vibrate
    the phone when something important happens, like a message arriving or a player
    scoring a point in a game.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "To utilize this functionality, you need to make sure your project has a reference\
