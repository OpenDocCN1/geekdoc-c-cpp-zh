- pgno: 230
  md: "The key line here is the binding expression {Binding Main, Source={StaticResource\
    \ Locator}}. This line is declaring that I want the data context of my entire\
    \ view to be set to the Main property on the Locator object, which is a global\
    \ resource. The MVVM Light project template put some code in our App.xaml file\
    \ that declares an instance of the ViewModelLocator class as a global resource:\n\
    \n```\n<Application.Resources>\n    <vm:ViewModelLocator x:Key=\"Locator\"\n \
    \       d:IsDataSource=\"True\" />\n</Application.Resources>\n```\n\nNow that\
    \ we have a view model locator, and our view’s data context has been set to an\
    \ instance of a view model (remember, even though it’s an instance property it’s\
    \ still pointing to a static singleton), we can bind some of our UI to the view\
    \ model, as shown next:\n\n```\n<TextBlock x:Name=\"ApplicationTitle\"\n    Text=\"\
    {Binding ApplicationTitle}\"\n    Style=\"{StaticResource PhoneTextNormalStyle}\"\
    \ />\n<TextBlock x:Name=\"PageTitle\"\n    Text=\"{Binding PageName}\"\n    Margin=\"\
    -3,-8,0,0\"\n    Style=\"{StaticResource PhoneTextTitle1Style}\" />\n```\n\nThe\
    \ first phase of our adoption of MVVM is complete: the use of a view model. At\
    \ this point a lot of developers and many architects sit back and think: Was this\
    \ trip really necessary?\n\nThe answer is no. And yes. As I mentioned before,\
    \ you can rig all this up spaghetti-style or you can do everything in code-behind.\
    \ All we’ve done so far is provide a means for our application to make use of\
    \ view models. So far you haven’t seen any of the real benefits because you’ve\
    \ seen data binding before and it shouldn’t be that new to you. What comes next\
    \ are the features of the MVVM Light toolkit and the benefits of MVVM adoption\
    \ that could (and I’m not joking) change the way you write applications forever.\n\
    \n# Yes, But Will It Blend?\n\nDevelopers familiar with building applications\
    \ for the iPhone and iPad are intimately familiar with this problem: The design\
    \ surface almost never reflects an accurate representation of the live, running\
    \ application. It depends on the individual developer, but often the design surface\
    \ experience of Interface Builder is so completely different from the runtime\
    \ experience (especially when dealing with custom views with custom rendering)\
    \ that developers simply skip IB entirely and do everything in code.\n\nThis is\
    \ also true, to an extent, with Silverlight, WPF, and Windows Phone 7 applications.\
    \ It is very easy to build an application that is so unfriendly to design tools\
    \ that developers ignore the fact that design tools exist, and they do all their\
    \ UI building the “notepad way”—by hand-entering XAML into Visual Studio."
  merge: -1
  img_proc: true
- pgno: 231
  md: 'There is a cure for design tool exclusion, and its name is MVVM. The biggest
    problem with being able to use design tools to build UIs is their lack of cooperation
    and integration with the underlying data model. Typically, designers don’t care
    about (nor do they have access to) data models generated by C# classes that come
    from web service proxies, and so on. However, if your UI is tightly coupled to
    service proxy classes, it can be very difficult to work with your UI in a tool
    like Blend.


    In Listing 16.1, you might have noticed a line of code in the constructor of the
    MainViewModel class that looks like this:


    ```

    if (IsInDesignMode)

    ```


    This property (handily provided for us by MVVM Light) gives the constructor of
    our view model the capability to create some dummy data. Blend follows the chain
    of data binding and executes constructors in our view models at design time. By
    playing nicely with MVVM, our view models can provide design tools such as the
    built-in Visual Studio designer and Blend with sample data that we (or better
    yet, professional designers) can use to build incredible user interfaces. I’ll
    cover another technique later in this chapter with service providers that will
    even hide the if statement from the view model’s constructor, making our code
    even more clean—and who doesn’t love clean code? Figure 16.4 shows a screenshot
    of what our main page looks like in Blend. Note how programmatically generated
    data is showing up on a design surface.


    ![](img/04a00d46bb1059867d95707babd62ee7_231_0.png)


    Figure 16.4 A view bound to a view model rendered in Blend.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# # Chapter 16 Separating Your Concerns




    Now we’ve got a view, a view model, and we even have data binding between the
    view and view model, we want to add some interactivity. At some point users are
    going to have to interact with our application. When they do, we’re going to want
    to execute some code in response to that interaction.


    In a non-MVVM application, we might put all the code that responds to user interaction
    in the code-behind of the view page (for example, MainPage.xaml.cs). Although
    there is nothing inherently wrong with this, this practice makes for code that
    is hard to test (as you’ll see in the next chapter), hard to maintain, and is
    generally inflexible and not as clean as it could be. Certainly, there are times
    when code-behind code is required, but as I mentioned, I like to do everything
    declaratively until the last possible moment.


    The piece of interactivity that I want to show you is the capability to delete
    a book from the list. To do this, we’ll use a control available within the Silverlight/WP7
    Toolkit that you can find at Codeplex at http://silverlight.codeplex.com. This
    control is the ContextMenu control.


    ```

    <DataTemplate x:Key="bookItemTemplate">

    <StackPanel Width="480">

    <toolkit:ContextMenuService.ContextMenu>

    <toolkit:ContextMenu>

    <toolkit:MenuItem Header="delete book" Command="{Binding RemoveBookCommand}" />

    </toolkit:ContextMenu>

    </toolkit:ContextMenuService.ContextMenu>

    <TextBlock Text="{Binding Title}" Style="{StaticResource PhoneTextLargeStyle}"/>

    <TextBlock Text="{Binding Description}" Style="{StaticResource PhoneTextNormalStyle}"/>

    </StackPanel>

    </DataTemplate>

    ```


    Each book is going to be represented by a stack panel with a couple items in it,
    including text blocks for the title and description. This is pretty straightforward.
    The new control here is the context menu. Within the menu is a menu item. This
    is where the fun starts.


    Rather than seeing what you’ve seen so far in this book, a typical “click” event
    handler, there is now a command. Even better, this command is a property on the
    view model. Commands are really nothing more than instances of objects which contain
    references to executable code. They provide a way to bind user interface elements
    to code.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "that executes without having to tightly couple that code to a code-behind.\
    \ In other words, with the command as part of the view model, that code is now\
    \ shared and stored on the view model itself. This makes the code easier to find,\
    \ easier to maintain, provides a single point of execution (rather than potential\
    \ multiple entry points like you typically see in code-behind implementations),\
    \ and can even be reused by different views that reuse the same view model.\n\n\
    Let’s take a look at the command property on the view model that we add to support\
    \ deleting books. If your brain has already calibrated itself to the MVVM way\
    \ of thinking, you might already be asking yourself: Is this command on the Main\
    \ View model or the Book view model? The answer is on the Book view model. This\
    \ is because this data template is bound to a list of books, and each of those\
    \ books is an instance of the Book view model.\n\nListing 16.2 shows our Book\
    \ view model in its entirety.\n\n# Listing 16.2 Book.cs\n\n```\nusing System;\n\
    using System.Net;\nusing System.Windows;\nusing System.Windows.Controls;\nusing\
    \ System.Windows.Documents;\nusing System.Windows.Ink;\nusing System.Windows.Input;\n\
    using System.Windows.Media;\nusing System.Windows.Media.Animation;\nusing System.Windows.Shapes;\n\
    using GalaSoft.MvvmLight;\nusing GalaSoft.MvvmLight.Command;\nusing GalaSoft.MvvmLight.Messaging;\n\
    using Mnemuse.Messages;\n\nnamespace Mnemuse.ViewModel\n{\npublic class Book :\
    \ ViewModelBase\n{\n    private string title;\n    private string description;\n\
    \n    public Book()\n        : base()\n    {\n        InitializeCommands();\n\
    \    }\n\n    public RelayCommand RemoveBookCommand { get; private set; }\n```"
