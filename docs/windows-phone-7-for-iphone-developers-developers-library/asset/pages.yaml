- pgno: 288
  md: 'disassembling tools are so good that they can generate C# code that looks nearly
    identical to the code you originally wrote when building the application. Before
    you panic, keep in mind that the Windows Phone 7 environment is a secure environment,
    and the likelihood of people being able to do this is slim. It’s not impossible,
    however, so we need to consider the possibility.


    If you ignored my advice about never storing the encryption key on the same physical
    medium as the encrypted data, you might have hardcoded the encryption key as a
    set of constants in one of your classes. If someone is looking at a disassembled
    version of your code, even if they haven’t reversed it all the way back into C#
    form, they can easily distinguish the encryption key, and then they will be able
    to gain access to anyone’s data on any device running your application. At this
    point, you’ve just given away intellectual property because you’ve been using
    the same encryption key in every instance of your application.


    What if your application provides some proprietary algorithm? Hidden deep within
    your application is some set of instructions that has taken your engineers years
    to develop, and it is the main reason why people buy your application—because
    they can’t get that algorithm anywhere else. Now let’s assume that a single device
    running your application is tampered with, unlocked, and your application is disassembled.
    Without much effort, a thief could reverse-engineer your algorithm and either
    publish it and devalue your application entirely or could release a competing
    application that does the same thing based on what used to be your proprietary
    code.


    There are tools that can help thwart the tools that reverse-engineer your application
    binaries back into code, but all they really do is make the job of the thief more
    difficult. These tools never completely prevent the intrusion. In this case you
    need to think back to what I said earlier in the chapter—you need to weigh the
    development cost of implementing a security feature that will merely slow down
    a thief rather than stop the thief entirely. These tools are referred to as obfuscators,
    and many of them are incredibly simple to use and often take little or no time
    to work. One such tool that has an established partnership with Microsoft is Dotfuscator
    Windows Phone Edition. Preemptive Solutions, the maker of the tool, is also offering
    a monitoring and analytics service to give you insight into the performance of
    your application in the market. Dotfuscator can do some amazing things, including
    mask control flow, renaming, encrypt strings, and much more. A suitably complex
    algorithm hidden underneath a commercial-grade obfuscation tool and deployed securely
    on Windows Phone 7 should have little chance of discovery.


    If, however, you are still paranoid about the discovery of your highly sensitive,
    proprietary algorithms, you need to consider one of the other rules of security
    that I live by daily: If you really want to secure what’s on the other side of
    the door, make sure that there’s nothing on the other side of the door when someone
    breaks it down.


    If you absolutely cannot live with the remote possibility that someone could take
    a copy of your application from a device, disassemble it, get around your obfuscation,
    and reverse-engineer the code in your application, you still have another option:
    Defer proprietary algorithm execution to a server. If, for compliance reasons
    or out of pure paranoia, you'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'can’t put the algorithms in code delivered to a device, you can invoke web
    services on your servers that will execute the sensitive code. In this fashion
    you are completely in control of the sensitive code that you cannot let fall into
    the wrong hands. Again, as with all security decisions, you need to weigh the
    benefits you get from this architecture with the drawbacks of requiring a device
    to have connectivity to perform certain functions and the cost of maintaining
    the server in the cloud, and so on.


    # Summary


    Security is important to everyone, but in varying degrees. What one user wants
    in terms of security is rarely the same as what another wants. Security can be
    enforced by regulatory bodies, compliance regulations and committees, or enforced
    by business people within your organization, or it can come from your own opinion
    of how secure your small, independent application should be.


    When building security into your application, the most important thing to do is
    weigh the cost of implementation versus the degree of intrusion prevention you
    get. After you’ve done that, weigh the negative impact to user experience created
    by the security feature versus the relative degree of security added to your application.
    You need to weigh all these factors when building security features because if
    you don’t, you could end up annoying your users with excessive security or losing
    them through ineffective or nonexistent security.


    This chapter showed you how to encrypt and decrypt sensitive information, how
    you can transmit sensitive information over the wire (the mechanics of which were
    discussed in previous chapters), and some possibilities for protecting intellectual
    property from the eyes of unwanted intruders. Hopefully, after having read this
    chapter, you have a good idea of the degree and manner of security you want to
    implement in your application and know how you plan to go about it.'
