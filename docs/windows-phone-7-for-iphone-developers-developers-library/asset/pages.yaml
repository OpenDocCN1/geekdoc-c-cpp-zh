  md: '![](img/04a00d46bb1059867d95707babd62ee7_78_0.png)


    # Figure 6.6 Code-centric optimized layout.


    Finally, if you click and hold the tab of any of the windows and start dragging,
    you will see the dock shortcut icons shown in Figure 6.7. These make it incredibly
    easy for you to figure out where you want your windows to appear and how you want
    them laid out for your own personal tastes. You can even drag a particular file’s
    tab out of Visual Studio entirely and make it a standalone editing window.


    Last but not least is the toolbar that sits on top of everything else. The most
    commonly used feature of this toolbar will more than likely be the Play button
    that you can see in Figure 6.7 right next to the deployment target of Windows
    Phone 7 Emulator and the build configuration of Debug. Here you can choose whether
    you are going to run your application on the device or on the emulator and whether
    you’re going to run the application in Debug or Release mode. Clicking the Play
    button (or using the shortcut key of F5) starts a debugging session using these
    preferences.


    At this point in a discussion of Visual Studio, I start to get into details and
    minutia that I think will only distract you from your ultimate goal of building
    Windows Phone 7 applications. If you want to know more about Visual Studio, I
    highly recommend that you pick up Visual Studio 2010 Unleashed by Mike Snell and
    Lars Powers. This book will give you everything you need to know (and then some!)
    about Visual Studio. If you don’t want to read through it and don’t want to slow
    down your WP7 learning, you can flip to the section of the book that interests
    you as you run into parts of Visual Studio you don’t understand while building
    Windows Phone 7 applications.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/04a00d46bb1059867d95707babd62ee7_79_0.png)


    Figure 6.7 Docking target shortcut icons.


    # Summary


    A developer’s IDE is like a mechanic’s toolbox. It isn’t just a single wrench
    or a single screwdriver. It’s everything needed to build applications. As a result,
    developers spend the vast majority of their development time sitting in front
    of that IDE.


    Because of that, IDE creators spend an awful lot of time trying to make sure that
    their tools are fast, efficient, and—most important—easy to use. Visual Studio
    and Xcode are two of the most powerful IDEs available for building mobile applications
    today. In many ways they are similar, but there are also a lot of fundamental
    differences. The thing that I hope you take away from this chapter is that both
    of them are so configurable and so flexible that you should be able to make them
    lay out your environment in such a way that is comfortable to you, no matter how
    you like things set up.


    Visual Studio will become your best friend as you progress throughout this book.
    You will use it for writing your XAML, for writing your C#, for debugging, for
    profiling, for running your application, for building your application, and even
    for getting it ready to be deployed to the marketplace. Taking the time now to
    step back from the code and familiarize yourself with this tool will go a long
    way toward making the rest of the book easier to plow through.'
  merge: -1
  img_proc: true
