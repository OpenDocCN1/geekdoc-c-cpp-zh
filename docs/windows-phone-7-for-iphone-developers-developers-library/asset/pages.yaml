    \n# Summary\n\nThis chapter took you on a tour through the Phone Execution Model.\
    \ Multitasking is something that most desktop users take for granted. In fact,\
    \ we take it for granted so much that phone manufacturers have gone out of their\
    \ way to make their applications look as though they are multitasking, even if\
    \ all they’re doing is faking it in a productive manner.\n\nThis is how both the\
    \ iPhone and Windows Phone 7 devices multitask. Although there are a few things\
    \ that the iPhone can do in the background that, at least at the time of this\
