  md: "```\nCharacter c =\n    new Character\n    { Name = b.Title + \" character\
    \ \" + (x + 1).ToString() };\n    Characters.Add(c);\n}\n```\n\nFirst there is\
    \ a check to see whether the book being loaded is the same one the view model\
    \ loaded last time. If so, the method cancels. This prevents the application from\
    \ accidentally navigating to a detail view when a book is deleted from the middle\
    \ of a list (for fun, comment out this guard clause and see how it affects the\
    \ application’s behavior).\n\nNext you see we’re getting a reference to the phone’s\
    \ application frame. If the application is not currently sitting on the book pivot\
    \ view page, this code navigates to it. Finally, there is some code to populate\
    \ the list of characters with some dummy data that we’ll need to replace with\
    \ real data from a service provider.\n\nThis, by pure happenstance, leads me to\
    \ my next topic: service providers.\n\n# Using Service Providers\n\nAs the name\
    \ implies, a service provider does just that: provides a service. From a programming\
    \ and patterns standpoint, a service provider is an abstraction around a particular\
    \ logical grouping of functionality. One reason to use service providers in an\
    \ MVVM application is to take care of data persistence. In this case, I want a\
    \ service provider based on an interface so that I can swap it out easily in the\
    \ future with something else. For example, my first implementation of a service\
    \ provider is going to be one that takes model data and communicates with isolated\
    \ storage. In the future I might want to swap this out with a service provider\
    \ that communicates with a web service. Even further into the future, I might\
    \ want to write a service provider that talks to a web service and keeps local\
    \ caches of web service queries in persistent isolated storage for those occasional\
    \ periods of time that the application cannot establish a network connection.\n\
    \nThe first thing I want to do is define an interface for my service provider:\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\n\nnamespace Mnemeuse.Model\n{\n    public interface IMnemeuseServiceProvider\n\
    \    {\n        void SaveCharacters(Guid bookId,\n        IEnumerable<Character>\
    \ characters);\n        IEnumerable<Character> LoadCharacters(Guid bookId);\n\n\
    \        void SaveBooks(IEnumerable<Book> books);\n```"
