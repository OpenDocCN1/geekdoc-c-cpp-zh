- pgno: 81
  md: "# Introducing Expression Blend\n\n> I think design covers so much more than\
    \ the aesthetic. Design is fundamentally more. Design is usability. It is Information\
    \ Architecture. It is accessibility. This is all design.\n> \n> Mark Boulton\n\
    \nThis chapter provides you with an introduction to Microsoft’s interaction design\
    \ tool, Expression Blend. I start with an overview of Interface Builder, the application\
    \ iOS developers often use to build their user interfaces. Next, I provide a walkthrough\
    \ of Expression Blend—its purpose and key features and how it differs in form\
    \ and function from that of Interface Builder.\n\nIn the previous chapter we walked\
    \ through Visual Studio and its features that enable you to write code and compile\
    \ and run applications. This chapter is all about design tools, how to use them,\
    \ and more importantly, when you should use them.\n\n# Overview of Apple’s Interface\
    \ Builder\n\nInterface Builder (IB) has been around for quite some time, and Mac\
    \ developers have been using it to construct view hierarchies for desktop Cocoa\
    \ applications for years. With the release of the original iPhone SDK, Interface\
    \ Builder was tasked with giving developers a way to manipulate user interfaces\
    \ in a near-WYSIWYG fashion.\n\nBefore diving into a description of how IB works,\
    \ I think it’s worth including a paragraph with a brief history lesson. Many people\
    \ assume that the first release of the iPhone also came with the first release\
    \ of the SDK. This isn’t actually how it happened. When the iPhone 1.0 was first\
    \ released, the “SDK” was Safari. There was no App Store, no Marketplace, and\
    \ no Objective-C SDK. All developers could do was build web applications that\
    \ used clever JavaScript, HTML, and CSS trickery to make those web applications\
    \ look and feel like iPhone applications. To this day, many websites still have\
    \ “iPhone-y” UIs that are presented when an iOS device browses to that site. One\
    \ year later, the iPhone SDK was"
  merge: -1
  img_proc: true
- pgno: 82
  md: 'released. This SDK included Xcode and the capability to run applications on
    a simulator and upload applications to the App Store. However, this SDK did not
    include Interface Builder. Or rather, Interface Builder could not be used in conjunction
    with iPhone SDK projects. It wasn’t until months later that a revision to the
    iPhone SDK included Interface Builder support. We should all count our blessings
    that Microsoft released not one but two designers with its v1 product: Expression
    Blend and the VS2010-embedded designer, which share quite a bit of code.


    Interface Builder is just as its name implies: a tool for building interfaces.
    As you can see in Figure 7.1, it does a fairly good job of giving you an estimate
    of the user interface that will be rendered when the application runs. Also keep
    in mind that older versions of Xcode and Interface Builder were separate tools,
    whereas with versions 4 and later, Xcode and the “visual designer formerly known
    as Interface Builder” are one and the same.


    ![](img/04a00d46bb1059867d95707babd62ee7_82_0.png)


    Figure 7.1 Building a UI with the Xcode 4 Designer.


    The rub, of course, is that the UI that IB shows you at design time is just a
    rough estimate. For example, when you’re working with a TableViewController and
    you are trying to set up a UI that will display a list of items using a custom
    cell, there’s no way for IB to give you all of that merged into a single design
    surface. Take a look at Figure 7.2, which shows how a typical developer might
    use IB to rig up a TableViewController with a custom table view cell. You can’t
    see what the cell is going to look like within the table; you can only look at
    one sell separately in a different window while IB provides a “simulated” UI for
    the table itself. As you’ll see later in this book in Chapter 16, “Separating
    Your Concerns,” not only can you see custom list boxes at design time in WP7 and
    Visual Studio, but you can even provide sample data to which you can bind your
    controls at design time to get a really good preview of the final rendering.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/04a00d46bb1059867d95707babd62ee7_83_0.png)


    Figure 7.2 Working with a TableViewController in Xcode/Interface Builder.


    At its core, Interface Builder is taking a configuration of an object hierarchy
    (such as a view hierarchy including view controllers and subviews) and storing
    that information in a special file called a “nib” (although the more modern equivalent
    of this file is an XML file with the XIB extension, still called “nib” because
    it’s much easier to pronounce).


    By setting your main window’s configuration through Interface Builder, you are
    indicating the state you would like that window to be in after the application
    has started up. When a reference for your main window is asked for by the application,
    it will take all the information contained in the XIB file and use it to create
    a fresh instance of a window object. This pattern continues throughout your application
    as UI objects are needed, including custom table view cells like the one shown
    in Figure 7.2.


    This differs from the way designers work with Silverlight applications in that
    Interface Builder really just creates data files. These data files are written
    by Interface Builder and read by the application at runtime to generate instances
    of objects. Silverlight applications use XAML as a markup language to describe
    the instantiations that should occur. This is a subtle but important difference.
    XAML is an instantiation language. It uses XML to describe the objects that should
    be instantiated and the properties within those objects that should be set.


    This is a subtle but important difference because there are some things that require
    a live, running application to render in iOS, which is why Interface Builder often
    supplies only “simulation” UI-like fake navigation bars, tab bars, and the like.
    The point at which iOS developers need to write pure Objective-C and where they
    need to build their UI in Interface Builder is often confusing, and the consequences
    for getting this split wrong can be immense. Some seasoned iPhone developers rarely
    use IB, and often use it only when there is no other alternative. Other iPhone
    developers have an IB-first approach in which'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'they build everything in Interface Builder until they absolutely cannot get
    away without writing custom code in Objective-C. As you’ll see later in Chapter
    16 on MVVM (Model,View,ViewModel—a pattern for separating concerns when building
    user interfaces), because everything can be represented as XAML (even the objects
    to which your UI is bound), you can get an almost exact replica of your final
    UI inside either Expression Blend or Visual Studio without the need for mocked
    elements.


    XAML is considered a first-class citizen in the Microsoft development environment.
    iOS developers never look at the serialization format used by IB; they either
    work in Objective-C or the point-and-click UI of the designer. Microsoft developers
    work in XAML all the time and, as you’ll see in the screenshots in this book,
    many developers often type the XAML and watch the immediate effects of the markup
    on their UI.


    # Introduction to Expression Blend


    When I first heard that Microsoft was working on an XAML design tool that would
    help developers build amazing UIs, guide them through building complex animations,
    and much more, I was a little skeptical. In fact, my reaction was something along
    the lines of, “Microsoft? Build a design tool? Inconceivable!”


    However, over the years I’ve learned that first impressions (especially those
    clouded by prejudgment and simple ignorance, rather than those formed by an actual
    impression) are often wrong. I decided to give Expression Blend a try. As a somewhat
    relevant aside, I am not a designer. I have no digital design skills and prefer
    the comfort and form of a pencil to that of a mouse. I’ve never gotten along well
    with Photoshop, and I’ve always written my HTML in Notepad (or other text editors).
    I have also almost exclusively written my XAML in Visual Studio’s text editor
    with the design surface actually removed, seeing the finished product only after
    running the application. I have been what you might consider the exact opposite
    of the target user for a design tool such as Blend. I fought it and resisted it
    like the plague. I was going to curmudgeonly refuse to adopt this shiny new tool
    no matter the cost. That was before I tried it.


    At its core, all Blend does is provide you with a robust UI sitting on top of
    an XAML editor. All the fancy things you do with all the controls, widgets, knobs,
    trays, and panels eventually boil down to the manipulation of XAML (and occasionally
    C#) in your project. The interesting part is that, unlike my past experience with
    design tools that produce markup (yeah, I’m looking at you, FrontPage), Blend
    actually reduces the amount of time it takes you to build a UI, and—here’s the
    shocking part—it actually produces clean XAML. If you want to take a few minutes
    and sift through some online tutorials to get you familiar with Expression Blend,
    I recommend you check out this URL: http://expression.microsoft.com/en-us/cc184874.aspx.
    If you want a full reference on building Silverlight 4 applications with Expression
    Blend (the vast majority of which will still apply to WP7 development), check
    out Expression Blend 4 with Silverlight, by Victor Gaudioso.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'When you first see Expression Blend, like the screenshot shown in Figure 7.3,
    it can be a little overwhelming. Those of you who have used tools like Adobe Photoshop
    will almost immediately recognize all the core elements of a design tool. For
    developers like me, who tend to throw garlic and holy water at design tools like
    Photoshop, getting used to this application took a little time.


    As I progress throughout this section and in the tutorial in this chapter, I might
    talk about visual controls and other things with which you aren’t yet familiar.
    Don’t worry about that and just go with the flow; everything that I do in this
    chapter with Blend will be explained in greater detail with C# and XAML in later
    chapters, including the stock controls, panels, building custom controls, and
    the animation system.


    ![](img/04a00d46bb1059867d95707babd62ee7_85_0.png)


    Figure 7.3 Expression Blend after opening a VS solution.


    You can launch Expression Blend directly from your Start menu, or you can launch
    it already set to your current Visual Studio project by clicking Project, Open
    in Expression Blend from inside Visual Studio with an open WP7 application. On
    the left in the first panel you’ll see a tab called Projects. This tree should
    look very similar to the Visual Studio Solution Explorer. This gives you a file
    system-based view of your solution. When you double-click an XAML file in this
    view, it will appear in the design view in the middle.


    Below the first panel is an Objects and Timeline view. This gives you a hierarchical
    view of the objects discovered inside the current XAML file. As you can see in
    the screenshots in Figures 7.3 and 7.4, the root object is an instance of PhoneApplicationPage,
    which contains a TitlePanel and a ContentGrid, and inside'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'that ContentGrid is a Pivot control named mainPivot. Items in this view show
    up as their data types when those elements haven’t been assigned a name.


    ![](img/04a00d46bb1059867d95707babd62ee7_86_0.png)


    Figure 7.4 Editing different Pivot items directly in the designer.


    Figure 7.4 shows how you can quickly and easily use the Objects and Timeline view
    to navigate directly to the item you want to edit. In this case, we are editing
    a PivotItem within a Pivot control. To do this in a pure-XAML text view, you would
    have to scroll down through all the XML content looking for the control you wanted
    to edit. The Objects and Timeline panel can be an incredible timesaver.


    On the right side of the screen, as shown in either Figure 7.3 or 7.4, you can
    see a bunch of editing panels. The first is the Properties window, which allows
    you to edit the properties of a control. Notice that whenever a property can be
    set to a type of Brush, the Blend Properties window gives you a nice Brush editing
    tool. You can quickly use this tool to set backgrounds to be transparent, solid
    colors, or even gradients. Again, setting Brush properties using Blend is much
    easier than doing it by hand.


    There are hundreds of different things you can do with the Properties window and
    with the selection tool. In Figure 7.4 you can see that there are little padlock
    icons on various key points in the selection highlight around my control. I can
    easily use those little padlocks to set how my control automatically resizes itself
    within a parent control, or I can set the height and width to fixed numbers. The
    possibilities are not infinite, but a'
  merge: -1
  img_proc: true
- pgno: 87
  md: "developer or designer familiar with Expression Blend and its capabilities,\
    \ and who has a bit of creativity, can truly create amazing user experiences.\n\
    \nAnother feature I really like about Expression Blend is the capability to use\
    \ annotations. Annotations give teams the capability to leave comments about particular\
    \ UI elements so that other team members can see them and respond to them accordingly.\
    \ For example, in Figure 7.5 I’ve left my team members a little sticky note directly\
    \ in the Blend UI complaining about some UI elements that I don’t like.\n\n![](img/04a00d46bb1059867d95707babd62ee7_87_0.png)\n\
    \nFigure 7.5 Using annotations to take notes and share with the team.\n\nThe presence\
    \ of this annotation modifies the underlying XAML to include the following new\
    \ XAML namespace:\n\n```\nxmlns:Anno=\"http://schemas.microsoft.com/expression/blend/extensions/annotations/2008\"\
    \n```\n\nIn addition, the annotation is added to whatever target control I was\
    \ referencing at the time by adding an element as a dependency property, as shown\
    \ in the following XAML that corresponds to the sticky note in Figure 7.5:\n\n\
    ```\n<Anno:AnnotationManager.Annotations>\n    <Anno:Annotation AuthorInitials=\"\
    K\" Author=\"Kevin\" Left=\"496\" SerialNumber=\"1\" Top=\"137\" Timestamp=\"\
    12/20/2010 00:12:01\" Text=\"I think this box needs to be changed a little. There\
    \ should be explosions, and animated dripping blood, bouncing corpses, and brain-eating\
    \ zombies all over this UI!!\"/>\n</Anno:AnnotationManager.Annotations>\n```"
