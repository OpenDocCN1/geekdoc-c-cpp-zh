    # Summary


    This chapter started with a discussion about some of the capabilities of Core
    Data on the iPhone. Because no direct correlation exists between Core Data and
    WP7, this chapter focused on the capability to store and retrieve entire object
    hierarchies to and from disk using isolated storage.


    With the combination of isolated storage, the WCF Data Contract Serializer, and
    LINQ for runtime queries of in-memory data, your application can manage virtually
    any kind of data with relative ease. This chapter showed you how to accomplish
    that using isolated storage. In the next chapter, you’ll see how to deal with
    remote data by building smart clients.'
