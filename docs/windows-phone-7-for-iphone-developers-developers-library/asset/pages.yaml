  md: "```\nSampleTextBox.Text );\n    }\n}\n}\n```\n\nIn the preceding code listing,\
    \ we are accessing the Text property on the SampleTextBox control that contains\
    \ the text input into that control by the user, if any more. You can do a lot\
    \ more with a text box, but this should whet your appetite for user input on the\
    \ Windows Phone.\n\nRun the sample project again and type something into the text\
    \ box before you tap the page title. When you tap the page title you should see\
    \ whatever text you entered in the box appear in the modal pop-up.\n\n# Working\
    \ with Buttons\n\nButtons are an essential part of any user interface. They provide\
    \ nice, easy-to-hit targets for your fingers. We use buttons to cause actions\
    \ to occur. In general, you can think of a button as the user interface equivalent\
    \ of a verb. When something needs to be done, you tap a button to get it done.\
    \ Of course, this is just an example, and there are many examples of user interfaces\
    \ where buttons are used more creatively or even not used at all.\n\nIf you don’t\
    \ already have it open, launch Visual Studio and bring up the project that we’ve\
    \ been working on throughout this chapter. Open up the MainPage.xaml file and\
    \ scroll down to the last control you added in Listing 8.3. Add the buttons shown\
    \ in Listing 8.5.\n\n# Listing 8.5 Adding Buttons to the Page\n\n```\n<Button\
    \ x:Name=\"TestButtonOne\">\n    <TextBlock Text=\"Zombies are your friends\"\
    \ />\n</Button>\n<Button x:Name=\"TestButtonTwo\" Click=\"TestButtonTwo_Click\"\
    >\n    <Border BorderBrush=\"Yellow\" BorderThickness=\"3\" CornerRadius=\"15\"\
    >\n        <TextBlock Margin=\"5,5,5,5\" Text=\"Some Text\"></TextBlock>\n   \
    \ </Border>\n</Button>\n```\n\nThe first button is self-explanatory. It has a\
    \ name and it has child content in the form of a TextBlock. This is your first\
    \ example of a templated control, and you will see hundreds of these as you progress\
    \ through this book. The child content of the button, no matter what it is, is\
    \ wrapped up inside the functionality that makes a button a button—the capability\
    \ to respond to a mouse click (or, in the case of WP7, a finger tap).\n\nThe next\
    \ button (named TestButtonTwo) is a little more interesting. The first child element\
    \ of this button is a Border control. A Border control does just what its name\
    \ implies—it wraps whatever child content it contains with a configurable border.\
    \ In our case, we wrapped the child content in a yellow border that is 3 points\
    \ thick with a"
