- pgno: 312
  md: 'Every time you want to release a new version of your application that contains
    bug fixes or new features, you return to App Hub, upload a new version of your
    application, and go through a slightly condensed version of the process I’ve just
    described. Owners of your application will then be able to use the Marketplace
    app on their phones to download the new version of your application.


    # Earning Money with the Mobile Advertising SDK


    If you plan to release a free application in hopes that you will get more downloads,
    but you still want to be able to somehow draw revenue from your application, you
    might want to consider using the Mobile Advertising SDK. You can download this
    SDK from Microsoft at the following URL (I’ve taken the liberty of making a small
    URL that you can just type in as you read this): http://tinyurl.com/wp7ad sdk.


    To use the Mobile Advertising SDK, you will need to sign up with Microsoft pubCenter
    (again, you can’t use Chrome on this website, you’ll need IE) at http://pubcenter.microsoft.com.
    This website is where you link your developer ID with advertising configuration
    and provide keywords and other targeting information for advertisements. Much
    like Apple’s iAds SDK, all the busywork of tracking down potential advertisers
    and negotiating rates and payments has been taken care of on your behalf. All
    you need to do is use the SDK to display advertisements within your application
    and, assuming your application is launched often enough, you will begin receiving
    payments based on view impressions and “tap-through” events that occur when users
    tap displayed advertisements within your application.


    If you’re looking for information on how to utilize the SDK within your application,
    you need to install the SDK. It comes with its own help file that is full of tutorials
    and other information on configuring your pubCenter account and writing the code
    necessary to allow your application to participate in advertisements.


    # Summary


    This chapter provided you with an overview of the things you need to do to prepare
    your application for submission to the Marketplace. After your application has
    been prepped, this chapter provided you with a walkthrough of submitting a real
    application to the Marketplace and the information you need for submission.


    After having read through this entire book, whether or not you are an iOS developer,
    you should now have a very firm grasp of the information you need to build, test,
    troubleshoot, deploy, and sell Windows Phone 7 applications. I hope you find the
    experience of developing for Windows Phone 7 as amazing as I have, and I look
    forward to seeing the amazing applications you are no doubt going to build.'
