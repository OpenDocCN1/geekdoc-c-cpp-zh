- pgno: 174
  md: "# Using Raw Notifications\n\nRaw notifications sent to WP7 applications are\
    \ just that—raw. When a server or service sends a raw notification, it sends a\
    \ blob of binary data. This data doesn't need to conform to any specific shape\
    \ or size, so long as both the server sending the data and the WP7 application\
    \ receiving the data can agree on that shape. This is an ideal situation for C#\
    \ binary serialization. As you'll see in the code sample, no XML serialization\
    \ is available for Silverlight on WP7, so we're left with using binary serialization\
    \ using the WCF DataContractSerializer class as the easiest option for going from\
    \ raw data to something usable by the application.\n\nBefore looking at the code,\
    \ another thing worth pointing out is that raw notifications can be sent only\
    \ to applications currently running in the foreground. When you send a toast notification,\
    \ it is delivered to the start screen if the application isn't running. If the\
    \ application is running, the toast notification is delivered directly to the\
    \ application using an event handler. If a raw notification is sent to an application\
    \ that is not currently running in the foreground, the notification is discarded\
    \ as if it never happened.\n\nFor this reason, a very common design pattern in\
    \ push notifications is to tell the registry service when the application is running\
    \ and when the application shuts down. This lets the registry service know when\
    \ the app can receive raw notifications versus receiving tile updates and toasts,\
    \ which can be received at any time.\n\nThe following code handles the reception\
    \ of a raw HTTP notification:\n\n```\nvoid NotificationChannel_HttpNotificationReceived(object\
    \ sender,\n    HttpNotificationEventArgs e)\n{\n    if (e.Notification.Body !=\
    \ null && e.Notification.Headers != null)\n    {\n        // Thanks to Daniel\
    \ Vaughn (WP7 Unleashed by SAMS Press)\n        // for this tidbit on having to\
    \ remove nulls from the serialized\n        // data contract sent from the push\
    \ app/service\n        using (BinaryReader reader =\n            new BinaryReader(e.Notification.Body))\n\
    \        {\n            byte[] bodyBytes =\n                reader.ReadBytes((int)e.Notification.Body.Length);\n\
    \n            int lengthWithoutNulls = bodyBytes.Length;\n            for (int\
    \ i = bodyBytes.Length - 1;\n                i >= 0 && bodyBytes[i] == '\\0';\n\
    \                i--, lengthWithoutNulls--)\n            {\n                /*\
    \ Intentionally left blank. */\n            }\n\n            byte[] cleanedBytes\
    \ = new byte[lengthWithoutNulls];\n            Array.Copy(bodyBytes, cleanedBytes,\
    \ lengthWithoutNulls);\n```"
  merge: -1
  img_proc: true
