    In the preceding code, you can see the stock contents of an Objective-C header
    file as they would look immediately after creating an empty class using an Xcode
    template. There really isn’t much to see here. The important thing to keep in
    mind when learning C# is that C# classes do not separate the code into header
    and implementation files.


    # Listing 3.2 Combatant.m


    ```

    #import "Combatant.h"


    @implementation Combatant


    @end

