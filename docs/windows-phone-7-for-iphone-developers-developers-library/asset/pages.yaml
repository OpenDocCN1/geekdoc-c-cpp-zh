- pgno: 150
  md: '# A Note on Try/Catch


    If you were looking at the FM radio code sample and the use of the keywords try
    and catch looked a little unfamiliar, don’t worry. This is C#’s exception-handling
    system. The code within the try block attempts to execute. If something happens
    that the runtime didn’t expect (an exception), the code inside the catch block
    executes, allowing you to safely handle the error without crashing the application.


    The important thing to remember is that if your code fails to “catch” an exception
    that occurs, the application’s only resort is to crash. If this happens in a production
    application that someone paid good money for, the customer will not be happy.


    Putting code inside a try/catch block incurs a slight performance penalty in exchange
    for guarding that code against unexpected failures. As a general rule, you should
    use if statements and other tests to check for user input mistakes, edge cases,
    and other predictable failures. You should use try/catch blocks only as last-ditch
    guards against your application crashing.


    # Using the Accelerometer


    Only a handful of modern smartphones come equipped with accelerometers. An accelerometer
    measures the force of acceleration in any of three directions: X, Y, and Z. These
    correspond to the “normal,” or the direction pointing downward into the center
    of the earth (the direction of the pull of gravity, more commonly known as “down”),
    left/right acceleration, and forward/back acceleration. The directions of left,
    right, forward, and back are all determined relative to the normal (remember,
    that’s “down” for us nonphysics types).


    Accelerometers can be used for silly tricks, such as allowing you to use your
    phone to slowly empty a glass; interesting things, such as providing a “shake”
    motion to shuffle cards; fully immersive joystick-like controls (such as steering
    a car by moving your phone like a steering wheel); or even high-end uses, such
    as putting your phone in your car, stomping on the gas, and recording your 0–60
    time. From personal experience, this last use is quite possibly my favorite use
    of an accelerometer so far.


    The accelerometer reports the force of acceleration in any of three directions
    through three properties on an accelerometer monitor: X, Y, and Z. How you interpret
    these values is beyond the scope of this book because these things typically require
    smoothing and aggregation and varying sampling rates to produce the desired results.
    However, to obtain these values and activate the accelerometer, you can create
    an XAML page in your Windows Phone 7 application as follows. (You can create a
    button and a few text blocks to store the values, as you’ll see in Listing 10.1.)


    # Listing 10.1 MainPage.xaml.cs, Using the Accelerometer Sensor


    ```

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Net;

    ```'
