- pgno: 25
  md: "As we progress throughout the book, you will see more and more ways in which\
    \ C# and Objective-C differ and how the UI Frameworks (Silverlight and Cocoa Touch/UIKit,\
    \ respectively) are vastly different.\n\nOne other syntactical difference to keep\
    \ in mind that will often irritate many unprepared Objective-C developers is Boolean\
    \ statement evaluation. In C (and thus, Objective-C), any expression that evaluates\
    \ to nonzero, including negative numbers, is considered true. This is not the\
    \ case in C#, and you will see that idiomatic C# rarely, if ever, has an if statement\
    \ that occurs without a logic operator specifically to avoid this type of confusion.\n\
    \nFor example, the following snippet of Objective-C is quite common because of\
    \ its C roots:\n\n```\nif (memberVariable)\n{\n    // do something, knowing that\
    \ memberVariable is not null/non-zero\n}\n```\n\nWhereas the same evaluation would\
    \ rarely appear in idiomatic C# and is usually written like this:\n\n```\nif (memberVariable\
    \ == null)\n{\n    // do something, knowing that memberVariable is null\n}\n```\n\
    \nOr, to test for null (or empty) strings, you often see code that looks like\
    \ this:\n\n```\nif ((memberVariable == null) || (memberVariable == string.Empty))\n\
    {\n    // do something, knowing that memberVariable is null or empty\n}\n```\n\
    \nIn this code block, C# takes advantage of logic short-circuiting so that the\
    \ second condition will not evaluate if the first condition can be used to make\
    \ the whole statement true. In other words, if the memberVariable is null, it\
    \ will never attempt to compare it with string.Empty.\n\nC# also has the concept\
    \ of nullable primitives. In short, you can have a nullable integer or a nullable\
    \ decimal. It might seem odd to Objective-C programmers, but such constructs can\
    \ come in handy from time to time, especially when communicating with databases\
    \ or converting data from disparate sources.\n\nThe following few lines of code\
    \ illustrate how to declare nullable primitive types and how to test to see whether\
    \ those types have values assigned to them:\n\n```\nint? nullableInt;\nNullable<decimal>\
    \ nullableDecimal;\n\n// do something to the variables\nif (nullableInt.HasValue)\n\
    {\n```"
