- pgno: 213
  md: "If you’re used to making simple 10-line web service requests in your favorite\
    \ desktop programming language, don’t be so quick to judge. Just because this\
    \ way might look different doesn’t mean it’s bad. In fact, after having consumed\
    \ web services this way (what I call “very asynchronous,” although some refer\
    \ to it as “ridiculously async”) on WP7 for a while, I’ve actually grown rather\
    \ fond of it.\n\nDuring each of these steps, there is a chance for a progress\
    \ bar or some other visual indication of network activity. If you’ve been using\
    \ a WP7 device for a while, you are no doubt familiar with the “sliding dots”\
    \ that appear during most network activity. They are a subtle indicator that some\
    \ network activity is taking place in the background, but the UI doesn’t get cluttered\
    \ up with giant wheels or other obtrusive “please wait” or progress indicators.\n\
    \nIn addition to being able to provide the user with visual feedback, each of\
    \ these steps is also a very logical place to trap errors. By taking the little\
    \ bit of extra time and caution required to implement RESTful web service clients\
    \ in this fashion, you give your users that feeling of quick, unobtrusive network\
    \ access that permeates the user experience of all Microsoft’s stock WP7 applications.\n\
    \nNow that you’ve seen how to make simple HTTP GET requests, and you’ve seen how\
    \ to send XML payloads via HTTP POST, let’s take a look at how incredibly easy\
    \ it is to parse some data from some of the most popular formats: Twitter, YouTube,\
    \ and RSS feeds.\n\nFirst, let’s look at how easy it is to crack open the 10 most\
