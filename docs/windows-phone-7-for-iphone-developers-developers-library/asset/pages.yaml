- pgno: 273
  md: 'partner to utilize any of that code. Being an Xbox Live partner involves having
    already published a game for an established and recognized platform and having
    formally requested this partnership from Microsoft. I discuss some of the reasoning
    behind this mentality in the next section on leaderboards and achievements.


    # Leaderboards and Achievements


    Just about every type of gamer, from the hardest of hardcore to the most squeamish
    of casual players, loves achievements. Progress and competition are two huge motivators
    in gameplay, and achievements supply both of those in large quantities.


    Xbox Live is world-renowned for its achievement system and the Xbox Live Gamerscore
    value, which is a global score that accumulates as players participate in more
    and more Xbox Live games. As players accomplish milestones in each game, they
    earn achievements, and each of those achievements is worth a certain number of
    points that will be added to a player’s overall Gamerscore.


    This gives players the sense of accomplishment as they unlock newer and even more
    rare and hard-to-obtain achievements. They can also compete with their friends
    and with the rest of the worlds through their gamer score and by trying to unlock
    more achievements than everyone else.


    As mentioned previously, you cannot simply open up Visual Studio and start writing
    code that works against the Xbox Live achievement system, regardless of whether
    you’re writing your code in XNA or Silverlight. To do anything with XBL achievements,
    you need to be an XBL partner with a relationship to Microsoft. This is the exact
    opposite of the Game Center approach where all you need to do is check a box for
    Game Center support, and you use a web portal to create the list of all the unlockable
    achievements in your game.


    There is, however, a method to this madness. Consider that a Gamerscore is global.
    Every point you earn by unlocking an achievement in any Xbox Live game is immediately
    added to your global Gamerscore. Every player on Xbox Live has a Gamerscore that
    has the same theoretical maximum (the sum total of all points for all achievements
    on all Xbox Live games). If someone were to create an Xbox Live game where the
    degree of difficulty to unlock achievements was disproportionately easy or, worse
    yet, the point value of these achievements was disproportionately large, it would
    effectively devalue the Gamerscore point.


    Think of it this way: Xbox Live is like the Old West gold rush. Everybody is playing
    games and, over time, they discover gold (Gamerscore points and achievements).
    The value of gold is relative to the amount of it in circulation. This is why
    the value of gold has consistently gone up over the years. If I’m holding two
    bars of gold that took me three years of hard, sweaty labor to obtain and someone
    suddenly discovers a riverbed that has more gold on it than people can mine, the
    three years I spent mining that gold become worthless because the same amount
    of gold can now be obtained with a five-minute trip to this newly discovered riverbed.
    Faced with this discovery, I would throw'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'up my hands and decide that mining gold is no longer worth my time at all.
    I might quit the gold mining business and open my own puppet show or become a
    dentist.


    Now think of it this way: You’ve just spent the last four weeks ignoring your
    family, friends, and personal hygiene to get all 200 achievements in Kevin Hoffman’s
    Zombie Apocalypse Fitness and Checkers Extravaganza, the newest and most popular
    Xbox Live title. With unfettered access to the achievement system, someone spends
    a couple weeks to create a new game, Joe Cheater’s Achieve-o-Rama. In this game,
    achievements only take a few seconds to find, and each one of them is worth a
    thousand Gamerscore points.


    Microsoft recognizes that the relative worth of Gamerscore and achievements within
    Xbox Live is like an economy within itself. If someone makes a game that is somehow
    able to reduce the value of achievements and Gamerscore, existing players will
    get angry and potentially quit. New players will find little to no motivation
    in playing because it will be so easy to gain points that there will no longer
    be a satisfying sense of accomplishment that comes from earning new achievements
    and gaining points.


    In short, if Microsoft allowed random game developers access to Xbox Live achievements,
    they would essentially be allowing anyone to tamper with the Xbox Live economy.
    In doing that, Microsoft would be ruining the experience for its incredibly large
    and loyal base. Many people don’t realize this, but Xbox Live is currently one
    of the world’s biggest social networks (by some definitions).


    If each game could have its own sandboxed achievement and point economy, where
    the scale and relative difficulty of accomplishment were not relative to some
    global standard, Microsoft might be able to provide a centralized achievement
    system like Game Center.


    # The Future of Xbox Live on WP7


    As mentioned, if Microsoft could sandbox the use of Xbox Live resources so that
    games could have their own local economies of achievements that did not affect
    global Gamerscores the way "real" Xbox Live games do, theoretically it would be
    possible for it to provide APIs much like the ones available through Apple’s Game
    Center. The reason Game Center can offer Leaderboard and Achievement APIs the
    way it does is that the use of those APIs does not devalue in any way the effort
    required to unlock achievements in other games. I can spend 20 minutes and unlock
    20 achievements in one Game Center game, and spend 200 hours in another and unlock
    only 4. Because these games don’t share leaderboards or a common sense of supply
    and demand for rewards, each game is still enjoyable in its own right, and neither
    game is affected by the presence of the other on the network. Only time will tell
    if Microsoft will implement sandboxed Achievements and Leaderboards for mobile
    devices, but if you want this kind of feature (and you probably do if you’re reading
    this chapter), be vocal: Blog, tweet, and talk to your local Microsoft Developer
    Evangelists and make your voice heard. Let them know how important this is to
    you as you consider whether to build your game for the WP7 platform.'
  merge: -1
  img_proc: true
