- pgno: 130
  md: '# Using a Panorama Application


    Where the Pivot control slides items out of your way and new items into view atop
    a fixed background, the Panorama control is a much more fluid control. Rather
    than tapping the title of nearby items, you simply swipe to bring the nearby items
    into view. This creates a nice parallax scrolling effect where the user sees the
    background shift and the new items come into view.


    In many cases you can use either a Panorama or a Pivot to provide the same functionality
    in your application; there are a few differentiating factors between the two controls.
    In a Pivot control, you tap the item names to bring the item content into view,
    and the Panorama requires a swiping gesture to bring the next item into view.
    The Pivot control is more often used when the UI structure of each element is
    somewhat similar to its peers. A Panorama control, as you can see when you flip
    through various hubs on a WP7 phone (especially the music area), gives the user
    a much looser, more fluid experience. You can use the Panorama to flip between
    data-driven views, rich graphical content, or anything else the phone provides.


    The key differentiating factor to remember is that a Pivot control can be used
    to switch between completely unrelated areas of application functionality without
    it feeling awkward to the user. When using a Panorama control, users have the
    impression as they swipe that they are expanding the original view, perusing through
    more and more content all with a similar purpose or logical relation. This is
    why Panoramas are used for the “hub” UI pattern throughout the phone.


    In other words, if you used a tab bar to separate completely disparate areas of
    functionality in your application, the Pivot control is the logical choice. On
    the other hand, if you used a tab bar to provide visual segmentation of logically
    related functionality, the Panorama is the natural choice for your UI.


    To see the Panorama control in action, open up Visual Studio and create a new
    WP7 application, choosing the Panorama Application template. This will create
    a default implementation of a Panorama with a nice background image, a title,
    and two items that you can swipe between. Remember that if you swipe past the
    last item, the Panorama wraps around and the first item will come into view.


    Figure 9.4 shows what it looks like when you run an application created by the
    stock Panorama Application project template.


    Like the Pivot control, the Panorama control’s content is split up into separate
    child items, each one providing a piece of the virtual panorama experience. The
    code in Listing 9.4 shows the default XAML from the stock project template for
    the Panorama application.'
  merge: -1
  img_proc: true
