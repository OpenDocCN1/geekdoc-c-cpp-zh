    you might be looking at immediately after creating a Windows Phone 7 application
    from a template. It shows a split-screen XAML and design view, as well as the
    other parts of Visual Studio that will become very familiar to you by the time
    you finish this book.


    ![](img/04a00d46bb1059867d95707babd62ee7_75_0.png)


    Figure 6.3 A Visual Studio screen.


    As you look at the top left of Figure 6.3, you’ll see a series of tabs with names,
    starting with one called AddNewWeight.xaml. These are all your open files, including
    C# files and'
