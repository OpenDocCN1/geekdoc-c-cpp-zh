- pgno: 116
  md: '+   - First, create a new folder in your project and call it Playground. Create
    the new WP7 test pages in this folder. Now, instead of ruining your real UI by
    littering it with links to all your test pages, you can modify your application
    so that when it starts, it launches directly into your test page.

    +   - Expand the Properties node below your project in Solution Explorer. Double-click
    the file WMAppManifest.xml. Look for an XML element called DefaultTask. Here you
    will see an attribute called `NavigationPage`. Change this from `MainPage.xaml`
    to `/Playground/Whatever.xaml`. The next time you launch your application, it
    will load directly to your test page and leave your real UI unscrambled.

    +   - When you are satisfied with the XAML markup from a page you’ve been working
    with in your Playground folder, you can copy and paste the markup into your real
    UI.


    If you have worked with HTML tables before, you have a pretty good head start
    on figuring out how the Grid control works. It operates on the simple principle
    of columns and rows. You can add child elements that belong to individual columns,
    span multiple columns, span multiple rows within a single column, and so on.


    The tricky part is that a Grid does not have a dynamic number of rows. In other
    words, if you have three row definitions and you try to add a control with a row
    value of 3 (remember, rows and columns both start at index 0) the control will
    not appear. You cannot add elements without an appropriate row definition.


    This is an important distinction because developers new to Silverlight, and especially
    those familiar with the iOS UITableViewController (and the table view it controls),
    often expect the grid to be able to dynamically produce rows. Although you can
    programmatically manipulate a grid to add rows to it, this isn’t the same as a
    list box, which expects to have an unknown number of rows to display at runtime.
    Strangely enough, for those looking for spreadsheet-style data displays, a trick
    often employed is to use a list box where each row produces a fixed-size grid.


    # Summary


    This chapter gave you a whirlwind tour of the various primitive controls available
    to Windows Phone 7 developers and compared them with some similar offerings available
    to iOS developers. In some cases, such as with dynamic layout panels, we covered
    controls that are not available in iOS.


    I deliberately avoided going into too much detail on any one control because the
    point of this chapter was to give you a big-picture view of the basic capabilities
    of the Windows Phone 7 SDK as accessed through Silverlight.


    Using the text boxes, text blocks, buttons, layout panels, images, and even basic
    animation, you are already well on your way to writing powerful WP7 applications,
    and we have just barely scratched the surface of what you can do with this incredible
    SDK.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Using Advanced UI Elements\n\n> *Form follows function—that has been misunderstood.\n\
    > Form and function should be one, joined in a spiritual union.*\n> \n> Frank\
    \ Lloyd Wright\n\nThis chapter focuses specifically on translating your knowledge\
    \ of certain types of applications and application components from iOS to Windows\
    \ Phone 7. Even if you aren’t an iOS developer, you might learn a few things about\
    \ how these various application components look on the iPhone.\n\nWhen building\
    \ iOS applications, you’ll see a few types of application components reused over\
    \ and over, to the point where these components are immediately recognizable in\
    \ virtually any iOS app, no matter how much they have been customized.\n\nThe\
    \ navigation bar is used in so many applications it is almost hard to find one\
    \ that doesn’t use it. Next, this chapter covers the use of tab bar applications\
    \ and how you might migrate a tab bar application to have the same functionality\
    \ but make use of native WP7 UI elements. Finally, this chapter covers what is\
    \ arguably the single most used controller in the iOS SDK: the Table View Controller.\
    \ This last section of the chapter covers the variety of options available to\
    \ developers wanting to migrate Table View Controller apps to Windows Phone 7.\n\
    \n# Migrating from Navigation Bars\n\nBuilding iOS applications with navigation\
    \ controllers is almost second nature to virtually any iOS developer. Not only\
    \ does Xcode come with a built-in template for building a navigation application,\
    \ but Interface Builder (or just Xcode in v4+) makes it incredibly easy to add\
    \ a navigation controller to any interface."
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The purpose of the navigation controller is to make navigating hierarchies
    of screens easy. The controller comes with built-in facilities for supplying each
    view with a title, back buttons, and even control “knobs” like edit buttons that
    can inform other parts of the UI to switch from a read-only mode to a view mode.


    As I have said multiple times so far in this book, the iOS SDK is purpose-driven.
    The navigation controller is a clear example of that. Apple wanted to make the
    experience of navigating through screens smooth and, more importantly, consistent.
    Anyone who has used an iPhone is aware of this consistency because the ubiquitous
    nature of the navigation controller coupled with its consistent look and feel
    make the act of going back (or “up” a hierarchy), drilling down, or changing screen
    state almost instinctive.


    There is no direct correlation for a navigation controller in the Windows Phone
    7 SDK, but a couple of controls and a complete navigation subsystem make rolling
    your own navigable UI quite easy. First we’ll take a look at the Silverlight navigation
    system (available both in regular and WP7 versions of Silverlight), and then we’ll
    take a look at some possible ways we can put a nice easy UI on top of this system,
    and even consider a few scenarios when we wouldn’t want a navigation UI.


    Figure 9.1 is a screenshot of the FB Investor iPhone App that follows the activity
    of the folks on the FortuneBuilders team. At the top of this screenshot you can
    see a navigation controller. These controllers typically have a view that manifests
    itself as this top bar. The middle of the bar is reserved for the title of the
    current view in the hierarchy, and the left side stays empty until there is a
    view that you can navigate back to, as shown in Figure 9.2.


    ![](img/04a00d46bb1059867d95707babd62ee7_118_0.png)


    Figure 9.1   An iOS navigation controller at the top of a hierarchy.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/04a00d46bb1059867d95707babd62ee7_119_0.png)


    Figure 9.2 An iOS navigation controller in the middle of a hierarchy.


    Figure 9.2 shows an iOS navigation controller that is at least one level deep
    in a view tree or hierarchy. You can see by the title of the back button that
    tapping it will take you back to a view titled Posts, and the current view is
    one that displays the contents of a blog post.


    The next few sections will show you how to produce this kind of functionality
    (although not quite the same UI) on Windows Phone 7 using Silverlight.


    # Using the Silverlight Navigation System


    The Silverlight navigation system is an API exposed through a single object, the
    NavigationService object that is a property of the Page object. It maintains a
    basic navigation trail as the user moves through an application.


    The CanGoForward and CanGoBackward properties provide developers with a basic
    way of interrogating the user''s navigation history. If either of these properties
    are true, the GoForward() and GoBack() methods can be invoked, respectively. If
    you attempt to invoke either of these methods when navigation in that direction
    is not possible, an exception will be thrown. To be safe and to avoid throwing
    unnecessary exceptions, always check the values of these properties before performing
    the actual navigation. To move the user from one page to another, use the Navigate()
    method.


    Although this might seem like a simple concept, it helps to see it in action to
    see how everything works. To do this, create a new Windows Phone application,
    which will create a portrait-based main page. On the MainPage.xaml, add a new
    button called'
  merge: -1
  img_proc: true
- pgno: 120
  md: "navigateButton. The following code snippet shows the Click event handler for\
    \ this button:\n\n```\nprivate void navigateButton_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    NavigationService.Navigate(new Uri(\"/Page1.xaml\", UriKind.Relative));\n\
    }\n```\n\nThis code navigates the user from MainPage.xaml to Page1.xaml instantly.\
    \ The fact that the user originated on MainPage.xaml will be stored in the navigation\
    \ system. When the user lands on the Page1.xaml page, the CanGoBack Boolean property\
    \ of NavigationSystem will be true. In addition, when the NavigationSystem object's\
    \ GoBack() method is invoked from Page1.xaml, the user will be sent back to MainPage.xaml.\n\
    \nYou can see this in action by adding a new portrait page to the project (leave\
    \ the default name of Page1). On that page, add a button and set its Click handler\
    \ to the following:\n\n```\nprivate void backButton_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    if (NavigationService.CanGoBack)\n        NavigationService.GoBack();\n\
    }\n```\n\nNote how we checked to see whether backward navigation was possible\
    \ before calling the GoBack() method. You can also use the Boolean properties\
    \ CanGoBack and CanGoForward to activate or deactivate various pieces of your\
    \ own navigation bar control.\n\n# No Forward Movement for WP7\n\n> No matter\
    \ when you try or how you try, you will never be able to move forward through\
    \ a navigation hierarchy on Windows Phone 7. Although WP7's version of Silverlight\
    \ might be nearly identical to that of the desktop version, some differences still\
    \ exist, and this is one of them. The desktop version of Silverlight allows users\
    \ to go forward and back, whereas on WP7, the CanGoForward property will never\
    \ be true and the GoForward() method will always throw an exception.\n\nThe actual\
    \ navigation is just a small part of the system. The real work comes in the pages\
    \ themselves and how they respond to construction, navigation, and activation.\
    \ In an iOS application, the developer typically has explicit control over the\
    \ instantiation of the view controller to which the user will navigate next. This\
    \ means that the developer also has explicit control over the lifespan of that\
    \ object.\n\nUsing the Silverlight navigation system, the lifespan and activation\
    \ cycle of these pages might not be immediately obvious. You need to know when\
    \ and where you can place code that will be executed when pages are first created,\
    \ when they are loaded, and when a user navigates to the pages. Failure to pay\
    \ attention to these could cause anything from performance problems to memory\
    \ issues or worse—your application crashing."
  merge: -1
  img_proc: true
- pgno: 121
  md: "# Using the Page Constructor\n\nEvery page object is still just a C# object\
    \ and, as such, has a regular constructor. When you create a new page object for\
    \ a WP7 application, it comes with a constructor that invokes the InitializeComponent()\
    \ method. It looks like the code in the following snippet:\n\n```\npublic partial\
    \ class Page1 : PhoneApplicationPage\n{\n    public Page1()\n    {\n        InitializeComponent();\n\
    \    }\n}\n```\n\nThe InitializeComponent() method invokes all the generated code\
    \ produced by the XAML markup that configures everything according to the markup\
    \ you see on the design surface. Without delving into too much detail about what\
    \ goes on inside that method, the key thing to remember is that no objects defined\
    \ in your user interface will be available for you to use until after this method\
    \ has been invoked. In short, do not ever create any initialization code in your\
    \ constructor before the InitializeComponent() method has been called.\n\nThe\
    \ tricky part about page constructors is that they are called only at very specific\
    \ times. The constructor of the default (first) landing page of an application\
    \ is called when the application starts up. The constructor of other pages are\
    \ not called unless you manually instantiate the page or the user navigates to\
    \ the page through a call to Navigate() on the NavigationService object.\n\nIt\
    \ is possible that at some point during the course of the application’s running,\
    \ the page will be removed from memory. I will get into the topics of tombstoning\
    \ and multitasking in later chapters, but for now, keep in mind that it is possible\
    \ that a page will not remain in memory forever after its constructor has been\
    \ called, and that its constructor may be called multiple times if the application\
    \ is “awoken” from a previous suspension.\n\nThe reason I bring this up is because\
    \ people often get into lazy habits of assuming that constructors are absolute,\
    \ so they use them to fetch whatever data they need and then they assume that\
    \ data will be around forever.\n\n# Using the Page Loaded Event\n\nOne of the\
    \ problems with relying on the constructor for your initialization code is that\
    \ the constructor is called very infrequently and often in unpredictable times.\
    \ The Page’s Loaded event is called, appropriately enough, whenever the page is\
    \ loaded.\n\nThe Loaded event is a low-level event that you will find on most\
    \ of the UI elements within Silverlight including shapes, buttons, borders, text\
    \ blocks, and more. You should think of the fact that the page’s Loaded event\
    \ is called during a navigation as a side effect. Even though you might see a\
    \ 1:1 correlation between loading and navigation, do not treat them the same.\
    \ There are more ways than just navigation to load a page, and so there"
  merge: -1
  img_proc: true
- pgno: 122
  md: "might be unexpected times when the Loaded event is fired on your page. As a\
    \ result, don’t put initialization code in here unless you are guarding against\
    \ that or you are specifically taking advantage of that fact.\n\nTo utilize the\
    \ Loaded event, you need to subscribe to it in the Page’s constructor (after the\
    \ call to InitializeComponent!), as shown here:\n\n```\npublic Page1()\n{\n  \
    \  InitializeComponent();\n    this.Loaded += new RoutedEventHandler(Page1_Loaded);\n\
    }\n```\n\n```\nvoid Page1_Loaded(object sender, RoutedEventArgs e)\n{\n    //\
    \ do something important.\n    Debug.WriteLine(\"Page1 was loaded.\");\n}\n```\n\
    \nExperiment with this code in the existing navigation sample. Watch when the\
    \ phrase “Page1 was loaded.” appears in the debug output window. You will see\
    \ it appear every time you navigate to the page (even if you land on the page\
    \ using the back button). The small caveat here is that every once in a while,\
    \ your code might be doing something tricky enough to cause the Loaded event to\
    \ fire when you don’t expect it.\n\n# Using the OnNavigatedTo Method\n\nWhen you\
    \ really want to associate your code with the navigation event, the best thing\
    \ to do is override the OnNavigatedTo method. This method is a part of the WP7\
    \ Page object, so you don’t need to subscribe to an event; all you have to do\
    \ is override the method and place your code inside. Additionally, there is an\
    \ OnNavigatedFrom method and an OnNavigatingFrom method. The following table describes\
    \ when each of these methods is invoked.\n\n| Method | Description |\n|---|---|\n\
    | OnNavigatedTo | When a page has been navigated to. Keep in mind that this is\
    \ invoked BEFORE the destination page’s Loaded event is fired. |\n| OnNavigatedFrom\
    \ | This is called after the user has left the current page in favor of another.\
    \ |\n| OnNavigatingFrom | This is called after the user triggers the navigation\
    \ action away from the current page but BEFORE the user has actually navigated\
    \ to the new target. |"
  merge: -1
  img_proc: true
- pgno: 123
  md: "Add the following override methods to the Page1.xaml.cs file and run the application,\
    \ navigating back and forth between MainPage.xaml and Page1.xaml. Pay close attention\
    \ to the Debug output window and when each of these methods is called.\n\n```\n\
    protected override void OnNavigatedTo(\nSystem.Windows.Navigation.NavigationEventArgs\
    \ e)\n{\n    System.Diagnostics.Debug.WriteLine(\"Navigated to page1.\");\n}\n\
    ```\n\n```\nprotected override void OnNavigatingFrom(\n    System.Windows.Navigation.NavigatingCancelEventArgs\
    \ e)\n{\n    System.Diagnostics.Debug.WriteLine(\"NavigatING from page1.\");\n\
    }\n```\n\n```\nprotected override void OnNavigatedFrom(\n    System.Windows.Navigation.NavigationEventArgs\
    \ e)\n{\n    System.Diagnostics.Debug.WriteLine(\"Navigated From page1.\");\n\
    }\n```\n\n# Spicing Up Navigation Events with Animation\n\nOne of the many things\
    \ that you get “for free” from the iOS navigation controller and all its moving\
    \ parts is just that—moving parts. When you “push” another controller onto a navigation\
    \ controller, the entire UI will slide away to the left, revealing the new controller’s\
    \ view hierarchy as it slides in from the right.\n\nAs you know, the iOS SDK makes\
    \ utilizing the default look and feel incredibly easy and everything else slightly\
    \ more difficult. With Windows Phone 7, we have easy access to virtually any kind\
    \ of animation effect you want, and we can tie those into the navigation events\
    \ to create our own animated transitions.\n\nTo see what kinds of animations we\
    \ can rig up to our navigation events, I’m going to modify the MainPage class\
    \ so that when you navigate to Page1, the page’s entire UI swings toward you like\
    \ a door opening, revealing the UI of Page1 underneath. When the user navigates\
    \ back to MainPage, that same door will swing “shut,” again hiding the Page1 UI\
    \ underneath. This particular style makes for an excellent transition between\
    \ master and detail views. After you’re done following along with this sample,\
    \ experiment with the timing and other options like the grid transparency and\
    \ even the rotation angle—the possibilities are endless.\n\nListing 9.1 shows\
    \ the modified MainPage.xaml. Pay special attention to the new storyboards and\
    \ a new addition to the Grid control, the PlaneTransform element that belongs\
    \ to the Grid.Transform element. This highlights Silverlight’s unique capability\
    \ to provide 3D transformations of 2D elements without requiring the developer\
    \ to render his entire UI in a 3D engine."
  merge: -1
  img_proc: true
- pgno: 124
  md: "# Listing 9.1 MainPage.xaml—Animated Page Transitions\n\n```\n<phone:PhoneApplicationPage\n\
    \    x:Class=\"NavigationBars.MainPage\"\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \n    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    xmlns:phone=\"\
    \n        clr-namespace:Microsoft.Phone.Controls;assembly=Microsoft.Phone\"\n\
    \    xmlns:shell=\n        \"clr-namespace:Microsoft.Phone.Shell;assembly=Microsoft.Phone\"\
    \n    xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\n    xmlns:mc=\"\
    http://schemas.openxmlformats.org/markup-compatibility/2006\"\n    mc:Ignorable=\"\
    d\" d:DesignWidth=\"480\" d:DesignHeight=\"768\"\n    FontFamily=\"{StaticResource\
    \ PhoneFontFamilyNormal}\"\n    FontSize=\"{StaticResource PhoneFontSizeNormal}\"\
    \n    Foreground=\"{StaticResource PhoneForegroundBrush}\"\n    SupportedOrientations=\"\
    Portrait\" Orientation=\"Portrait\"\n    shell:SystemTray.IsVisible=\"True\">\n\
    \    <phone:PhoneApplicationPage.Resources>\n        <Storyboard x:Name=\"openDoorStoryBoard\"\
    >\n            <DoubleAnimation Storyboard.TargetName=\"gridPlaneProjection\"\n\
    \                             Storyboard.TargetProperty=\"RotationY\"\n      \
    \                       From=\"0\"\n                             To=\"90\"\n \
    \                            Duration=\"0:0:1\"/>\n        </Storyboard>\n   \
    \     <Storyboard x:Name=\"closeDoorStoryBoard\">\n            <DoubleAnimation\
    \ Storyboard.TargetName=\"gridPlaneProjection\"\n                            \
    \ Storyboard.TargetProperty=\"RotationY\"\n                             From=\"\
    90\"\n                             To=\"0\"\n                             Duration=\"\
    0:0:1\"/>\n        </Storyboard>\n    </phone:PhoneApplicationPage.Resources>\n\
    \n    <!--LayoutRoot is the root grid where all page content is placed-->\n  \
    \  <Grid x:Name=\"LayoutRoot\" Background=\"Transparent\">\n        <Grid.Projection>\n\
    \            <PlaneProjection\n                x:Name=\"gridPlaneProjection\"\
    \ CenterOfRotationX=\"0.0\"/>\n        </Grid.Projection>\n        <Grid.RowDefinitions>\n\
    \            <RowDefinition Height=\"Auto\"/>\n            <RowDefinition Height=\"\
    *\"/>\n        </Grid.RowDefinitions>\n\n        <StackPanel x:Name=\"TitlePanel\"\
    \ Grid.Row=\"0\" Margin=\"12,17,0,28\">\n```"
