    Function: ApocalypseTrainer.MainPage.mainPivot_SelectionChanged(object, System.Windows.Controls.SelectionChangedEventArgs),
    Selected Index: 0

    Function: ApocalypseTrainer.MainPage.mainPivot_SelectionChanged(object, System.Windows.Controls.SelectionChangedEventArgs),
    Selected Index: 1

    ```


    In Visual Studio 2010, if you click the Debug menu and hover over the Windows
    option, you should see three additional choices: Breakpoints, Output, and Immediate.'
