    \nFigure 8.6 Displaying controls in a grid.\n\n# Navigating to Test and Scratch\
    \ Pages\n\nAs you have seen several times in this chapter, a common practice among\
    \ Silverlight developers when doing rapid prototyping is to create a new blank\
    \ page in which to experiment with something. They might use this new blank page\
    \ to check out an idea for a control they want to write, a style they want to\
    \ use, data binding templates, or anything else.\n\nEarlier in this chapter you\
    \ saw that we modified a hyperlink so that we could navigate to one of our experimental\
    \ pages. Although this works for a book, it is often ugly and cumbersome in a\
    \ real-world scenario. Here is what I like to do:"
