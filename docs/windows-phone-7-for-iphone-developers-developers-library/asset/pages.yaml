    # Summary


    Developer opinion about unit testing varies widely. Some developers think it’s
    a complete waste of time in the face of actual, manual, physical testing of the
    application. Other developers will do it, but only because their bosses make them
    do it. Yet other developers are passionate to the extreme about unit testing and
    won’t let QA even see a running version of their application until they’ve gotten
    as close to 100% code coverage with unit tests as possible.


    I’m not here to preach to you about whether you should be doing unit testing or
    test-driven development. This chapter provided you with an overview of how TDD
    and unit testing can be done on Windows Phone 7, and we compared that experience
    with a little sample of how unit testing works in the iPhone world. Unit testing
    using Visual Studio 2010 for Windows Phone 7 is still an early experience and
    has a lot of room for improvement. However, don’t let that keep you from doing
    it. Building unit testable applications doesn’t just make them testable. As you
    saw during the last refactor session in this chapter, in the process of making
    a class testable, you often find ways to refactor that can make the class better,
    less loosely coupled, more cohesive, and so on.


    Now that you’re well armed with the capability to create applications, create
    view models, and identify areas where you can keep the concerns of your application
    separate, you’re ready to move on to the next few chapters, including security,
    social networking and gaming, and deploying applications to the Marketplace.'
