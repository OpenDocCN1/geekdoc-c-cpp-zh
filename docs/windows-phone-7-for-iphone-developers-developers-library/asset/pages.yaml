- pgno: 220
  md: '# A Brief History of MVC


    In today’s world of software development, techniques and technology that were
    brand new last year are often considered “old school,” and all the cool kids on
    the playground stop using the old stuff in favor of the hottest new SDK, language,
    or framework.


    Believe it or not, the Model View Controller (MVC) architectural pattern has been
    around since 1979. That’s right, some of you reading this book might actually
    be younger than this pattern (which makes me feel even older, and I reserve the
    right to refer to you all as whippersnappers in subsequent chapters).


    MVC was first described in 1979 by a member of the Smalltalk team at Xerox PARC.
    Given this foundational fact, it should come as no surprise to any Objective-C
    (a language inspired by Smalltalk) programmer that Apple makes extensive use of—and
    often requires—the MVC pattern in its frameworks, such as in Cocoa and iOS.


    At the core of the MVC pattern is a desire to separate concerns. Most developers
    have experienced the nightmare of attempting to untangle code that has become
    too tightly coupled. This often happens after an application has been released
    to production and is working fine. Then someone wants the application to do something
    no one planned for during the initial release.


    When the developers lift the hood and stare down into the engine of the application,
    what they find scares them. Everything has a tight dependency on everything else.
    They can’t change one piece of code without rewriting another. A somewhat simple
    change becomes hellish in its complexity and potential time and resource consumption.
    Worse yet, the code hasn’t been written with unit testing in mind, so there’s
    no automated, reliable way of knowing whether the new features haven’t broken
    the previously working features. Because of the interdependent, tightly coupled
    modules, developers can’t even test their code in isolation.


    MVC isn’t a sprinkle-on magic fairy dust solution that will fix all these problems.
    It is nothing more than one pattern among many that has as its primary goal the
    separation of concerns to provide for a more agile, flexible, loosely coupled
    and yet still highly cohesive application. Again, using MVC doesn’t guarantee
    success, just like using a hammer doesn’t guarantee you won’t smash your own thumb
    with it.


    I will provide a detailed description of MVC both because it is the primary development
    pattern on the iPhone and because understanding how MVC works will make understanding
    how the variant we will be using, MVVM, works.


    The way MVC is designed to work is through clear assignment of roles and responsibilities
    within an application, lumping those responsibilities into three distinct bins:


    +   - Model—The model is responsible for the domain data. This includes more than
    just storing information. It includes the maintenance of state and the notification
    of observers of changes in state. The view and controller can both be observers
    or subscribers to state change information.


    +   - View—The view is responsible for rendering the model in an interactive form.
    The view is responsible for facilitating the handling of user interaction, but
    it does not directly react to user interaction.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   - Controller—The controller is responsible for responding to user input
    and manipulating the model in response to this input. You might think that the
    view is responsible for this, but the distinction is important. If the view renders
    a button whose state is bound to the model, the view facilitates the act of a
    user tapping the screen, but the controller executes code in response to this
    tap.


    An illustration of the interaction of these three roles is shown in Figure 16.1.


    ![](img/04a00d46bb1059867d95707babd62ee7_221_0.png)


    What you often see are user interfaces built around these symbiotic MVC trios.
    A single piece of fully functional user interface will often be the result of
    a small model, a singular purpose view, and a controller to manage the whole thing.


    If you look at the diagram in Figure 16.1, you might notice that there is a bidirectional
    relationship between the model and the view. This relationship is often facilitated
    through data binding.


    If you have been doing any iOS programming, you probably know that data binding,
    at least in the sense Mac OS X desktop programmers might be used to, is not available.
    Instead, the controller takes on a more aggressive role and is often used to force-feed
    data to the model and also force information into the view. This type of implementation—where
    the controller directly manipulates the view and the model, and there is little,
    if any, communication directly between the model and the view—is often referred
    to as the Passive View pattern (shown in Figure 16.2). This is really the MVC
    pattern with the controller acting as a middleman for model-to-view communication.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/04a00d46bb1059867d95707babd62ee7_222_0.png)


    Figure 16.2 The Passive View alternate form of MVC.


    Think of how this might apply to a typical iOS development scenario. One of the
    most commonly used controllers is the UITableViewController. This controller contains
    within it a reference to a view hierarchy that, for all intents and purposes,
    takes the role of the View in the preceding diagram. iOS and Cocoa both make extensive
    use of the Delegate pattern. Rather than having a reference to a model object
    with a bunch of properties that the controller can read to manipulate the view,
    the controller instead maintains a single reference, called delegate, to an object
    that must expose certain methods.


    When a particular user interaction with the view requires some data that the view
    doesn’t have, the controller handles this input (remember the view just facilitates
    input; it doesn’t handle it). If the controller needs something that it doesn’t
    already have (such as a UITableViewCell instance for a particular row/group),
    it can send messages to (call methods on) the delegate object. In this case, the
    delegate object is serving in the role of the model.


    MVC purists often sneer at this particular example because the UITableViewController
    has the capability to be its own delegate. This means that the controller is providing
    its own model, and to many this act is borderline offensive.


    So far in this book you have seen me create a folder called ViewModels or Models
    in many of the sample applications. I’ve done that because even for the simplest
    of applications, a little separation of concerns goes a long way. I have been
    informally leading up to this chapter by trying to keep controllers, views, and
    their corresponding models as separate as possible.


    In the next section of this chapter, you’ll learn about a variant of MVC called
    MVVM. We will be using an open-source implementation of this pattern to build
    an application with clean lines, sexy curves, and separated concerns.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Introduction to MVVM


    To explain the progression from MVC to MVVM, I will share an anecdote with you.
    I was working on one of the most complicated and in-depth applications I’ve ever
    developed. It had a high-speed, real-time, streaming back-end that continually
    fed information to the UI and occasionally took input from the user. I was working
    on this with Pavan Podila (some of you might know him by his tribal name, Dances
    with Xaml). We were avid fans of the MVC pattern and were jointly developing a
    model as he built an amazing UI and I built an equally amazing back-end. It was
    truly a thing of beauty.


    Until we tried a real-world scenario.


    This is when the happy synergy started to break down. As I needed more and more
    functionality on the back-end, I started adding more properties to the model.
    Because I was adhering as much as possible to the MVC pattern I’d used for so
    long, I kept as much of the “controllery-ness” (this is a technical term, seriously)
    in the controller. I didn’t put any methods on the model that weren’t related
    to state maintenance, manipulation, or notification. Pavan was rapidly adding
    properties to the model that he needed to facilitate the WPF magic he was creating.
    We quickly realized that my back-end was getting corrupted by his UI-specific
    modeling and his UI was being corrupted by implementation-specific details related
    to my back-end implementation. Worse yet, both of us were utterly abusing the
    controller and making it do all kinds of things nature never intended a controller
    to do. Even though we were separating some concerns with MVC, it just wasn’t good
    enough.


    The problem we had was that we didn’t come to the realization soon enough that
    a single model that provides both “bindability” (another technical term referring
    to the fact that an object is designed specifically to be bound to a Silverlight
    GUI) and persistence. We needed to split those roles. Instead of keeping with
    MVC, we bled functionality out of the controller and created a back-end Model
    and a front-end ViewModel.


    The ViewModel had properties on it that represented things like the status of
    toggle switches, bound view states, transition information, and custom aggregations
    of data that took three or four properties to represent on the back-end. The Model
    object was pure persistence, data “as it looks on the wire.”


    This new separation of concerns was an implementation of the Model-View-ViewModel
    (MVVM) pattern. In this pattern, the view communicates with a view model through
    commands and two-way data binding. The View model alerts the view of important
    state changes through messages. The view model can talk to the model (as ours
    did) and the view can, if need be, interact directly with the underlying model.


    This interaction pattern is shown in Figure 16.3, which is an illustration of
    MVVM with a specific slant toward Laurent Bugnion’s open-source implementation.


    Throughout the rest of this chapter, I’ll be walking through the implementation
    of an application that utilizes an open-source MVVM framework. MVVM is nothing
    more than a pattern, but the framework provides some very helpful classes that
    make it easier to keep our concerns separate while building WP7 applications.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/04a00d46bb1059867d95707babd62ee7_224_0.png)


    # Working with MVVM Light for WP7


    Before continuing on with this section of the chapter, I must give credit where
    credit is due. I learned about MVVM less because I was interested in the pattern
    and more because of Laurent Bugnion''s implementation of this pattern, MVVM Light,
    an open-source product available for WPF, Silverlight, and Windows Phone 7. If
    you want to learn something about Silverlight, follow this man on Twitter (@LBugnion)
    or his blog at http://blog.galasoft.ch. Better yet, go buy his book, Silverlight
    4 Unleashed.


    In this next section of the chapter, you''re going to need a few things to follow
    along. Because of the length and complexity of the sample code, I recommend that
    you read through this section without trying to type anything in. When you''re
    done with this section, open up the sample code and play with it; run the sample
    application, and see how everything works as a cohesive application.


    The first thing you''ll need to work with MVVM Light is the toolkit itself. The
    installation instructions might vary between the time of this book''s writing
    and when you''re'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'reading it, so you’ll need to follow the installation instructions on the MVVM
    Light website. You can download the library and find documentation and installation
    instructions at http://www.galasoft.ch/mvvm/getstarted. At this URL you’ll find
    links to the installation instructions, videos, documentation, and a link to download
    the library.


    Before proceeding with the rest of this chapter, make sure that you can create
    a new MVVM Light (WP7) application and that it compiles and runs. As I sit here
    writing this book, there is no automated installation utility for MVVM Light.
    You need to unzip the templates and binaries and put them in the appropriate directories.


    To show off the power of MVVM Light, I’m going to walk you through building a
    sample application. This will be a little different from the samples in previous
    chapters because MVVM Light is a library that provides code that supports an architectural
    principal. To see this in action, we need to build a full application. It doesn’t
    make sense to show you tiny isolated snippets without showing you how they actually
    improve the quality of your application.


    This sample application is called Mnemuse, a tool for writers of fiction. This
    tool allows writers to store and browse characters, places, scenes, inspirations,
    plotlines, chapter organizations, and more all from their Windows Phone 7 device.
    This lets them be sure that they’ll never lose an important idea or forget what
    color of hair a particular character had ever again. Note that, at the time of
    the writing of this book, this app is purely a demonstration and isn’t in either
    application marketplace.


    We could build this application in a non-MVVM fashion. I could create a bunch
    of XAML pages and load up the code-behind with direct data manipulation code.
    I could put the isolated storage (or web service) I/O in a place that is activated
    directly by UI controls. I could even have one page instantiate other pages and
    have master pages manually instantiate and feed data to detail pages. The end
    user might never know that I’ve cut these corners or how tightly coupled or impossible
    to test my application is. To be honest, I could do this and the application might
    perform just fine as far as my users are concerned, and I might even make a lot
    of money from the app.


    But would I respect myself in the morning? No.


    And so we’re going to do it the MVVM way.


    To start with, I’m going to create a new MVVM Light (WP7) project. When you do
    this you get a MainPage.xaml just like any other WP7 application. But you also
    get a ViewModel folder, and in that folder is a class called MainViewModel. There
    is usually a 1:1 correspondence between the view (which can be a page or a user
    control, in my opinion) and the view model. The view model is the first aspect
    of this application we’re going to look at.


    # Building a View Model


    Providing code in support of view models is one of the primary tasks of the MVVM
    Light library. As developers progress through the learning process, they tire
    of building applications that produce spaghetti code and want something cleaner
    and more elegant. Developers often drift naturally in the direction of MVVM.'
  merge: -1
  img_proc: true
- pgno: 226
  md: "One speed bump in the MVVM adoption process is often figuring out how to manage\
    \ the lifetime of view models. Sometimes developers will create a static class\
    \ that stores references to all the view models so that these models will be around\
    \ when needed. What happens next is often where developers decide that MVVM isn’t\
    \ a good idea: They try to get binding working between their XAML view and the\
    \ static view model, and it gets ugly. The act of making this work often produces\
    \ more spaghetti code than what the developer was originally trying to avoid.\n\
    \nEnter the ViewModelLocator. This is a class that is provided for us by the MVVM\
    \ Light project template. For each of the view models in our application, this\
    \ class maintains a static property that holds a reference to a singleton instance\
    \ of that view model. In addition, there are nonstatic properties designed specifically\
    \ to allow for XAML binding. This fixes one of the most painful aspects of trying\
    \ to keep the view code “pure” by having a central utility class (which could\
    \ be considered a Factory if you’re into pattern labeling) be responsible for\
    \ the instantiation, binding exposition, and lifetime management of view models.\n\
    \nIn our sample application, the main page displays a list of books because it\
    \ is a true rarity to find a fiction author who only ever thinks about one book\
    \ at a time. So not only are we going to need our main view model to maintain\
    \ a list of books, but we want this view model to be bindable and locatable using\
    \ the ViewModelLocator class.\n\nTo rig up a new view model in the ViewModelLocator\
    \ class, I first add a method call such as CreateMain() to the instance constructor.\
    \ You’ll put one of these method calls in here for each of your view models.\n\
    \nFirst you’ll see the MainStatic property, which provides for the singleton instance\
    \ of the view model:\n\n```\npublic static MainViewModel MainStatic\n{\n    get\n\
    \    {\n        if (_main == null)\n        {\n            CreateMain();\n   \
    \     }\n        return _main;\n    }\n}\n```\n\nHere the _main variable is a\
    \ private static member. Next we have the nonstatic member that refers to the\
    \ static member that is used to support data binding.\n\n```\n[System.Diagnostics.CodeAnalysis.SuppressMessage(\"\
    Microsoft.Performance\", \"CA1822:MarkMembersAsStatic\", Justification = \"This\
    \ non-static member is needed for data binding purposes.\")]\npublic MainViewModel\
    \ Main\n```"
  merge: -1
  img_proc: true
- pgno: 227
  md: "```\n{\n    get\n    {\n        return MainStatic;\n    }\n}\n```\n\nNext,\
    \ by convention we have a method called ClearMain() that cleans up our main view\
    \ model. Use this method to get rid of any resources that your view model might\
    \ be consuming. In my case, I call the Cleanup() method on _main, which is a method\
    \ that belongs to all view models, and then I set _main to null. The CreateMain()\
    \ method just instantiates a new instance of the main view model. Keep in mind\
    \ that you must never manipulate the view model directly in the locator class.\
    \ The locator class is purely a lifetime manager and data-binding facilitator.\
    \ All real initialization code takes place within the view model itself. This\
