    </controls:Panorama>\n```\n\nLike you did with the Pivot control, take this stock\
    \ application template and experiment with it. Create a bunch of panorama items\
    \ with all kinds of varying UIs and see how it looks and reacts to user swipes.\
    \ Play around with the background image to see what kinds of experiences you can\
    \ create just by using an interesting background image. The key is to tinker with\
    \ this until you feel very comfortable with the Pivot and the Panorama controls,\
    \ because they are two of the main ways iOS developers migrate tab bar functionality\
    \ from the iPhone to Windows Phone 7.\n\n# Using the Application Bar\n\nAnother\
    \ control at your disposal as a Windows Phone 7 developer is the application bar.\
    \ At first, when you see this control, you might think that its purpose maps directly\
    \ to that of the tab bar, but be careful, the application bar is much more than\
    \ just a tab bar alternative."
