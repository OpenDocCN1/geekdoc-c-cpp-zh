    \nNext, we make a call to the SetupDelegates() method. This method attaches a\
    \ bunch of event handlers to various events, such as ChannelUriUpdated, HttpNotificationReceived,\
    \ ShellToastNotificationReceived, and ErrorOccurred.\n\nWith the event handlers\
    \ in place, we can perform the final task in setting the application up to receive\
    \ toasts: binding. Binding associates a particular notification channel with any\
