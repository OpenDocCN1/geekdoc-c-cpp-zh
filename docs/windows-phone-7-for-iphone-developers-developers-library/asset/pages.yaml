- pgno: 14
  md: 'correct, and no, I do not have an 8-track player in my car), the app would
    then check an inventory system that maintained level information of hazardous
    materials.


    After my tour of duty with PalmOS, I spent some time in the PocketPC/Windows CE
    realm writing applications for form factors of all shapes and sizes, even tablet
    PCs before they became hip and trendy. More recently I wrote code for Windows
    Mobile using the .NET Compact Framework. Eventually the iPhone came out and I
    started writing code for the iPhone and, obviously, I have since become hopelessly
    addicted to building applications for Windows Phone 7.


    In addition to writing code for mobile platforms, I’ve been writing and co-writing
    books on virtually all aspects of the .NET Framework for the past 10 years, since
    before .NET 1.0 was released to the general public. I spoke at Apple’s Worldwide
    Developer Conference (WWDC) two years in a row. The first time I compared the
    developer experience of building apps with Windows Presentation Foundation (WPF)
    with desktop application development using Cocoa for the Mac. The next year, I
    compared the .NET Compact Framework to the first release of the iPhone SDK.


    I am a language nut, whether that language involves telling a computer what to
    do or conversing with a human. Over the years I’ve dabbled in Spanish, Hindi,
    Japanese, and explored programming languages such as Ruby, Python, Pascal, Delphi,
    VB, VB .NET, C, C++, Objective-C, C#, Java, Haskel, Scheme, and a whole bunch
    more that I’m probably forgetting.


    Helping developers compare and contrast similar platforms and learn awesome new
    technology is in my blood; it’s what I do for a living, it’s what I do for fun
    when I get home from work, and now it’s what I’m doing with this book. Asking
    me to slow down and do less of what I love would be like asking me to only eat
    half of a peanut butter cup, which is obviously a completely ridiculous request.


    # Why Should I Read This Book?


    Hopefully by now you’ve figured out that this book provides an introduction to
    development with Windows Phone 7 (WP7). What sets this book apart from some of
    the other introductory books about WP7 is that it takes a more holistic approach
    and includes information and comparisons about how “the other guys” do it—in this
    case, “the other guys” are iPhone developers.


    If you’ve written an iPhone or iPad application, thought about writing an iPhone
    application, have touched an iPhone, or have simply seen an iPhone commercial,
    you are part of the target audience for this book. In fact, even if you don’t
    know what an iPhone is (what rock have you been hiding under?), you will still
    be able to use this book to learn what you need to build WP7 applications.


    If you’re more interested in building applications that do something useful than
    you are about learning 500 different ways to print “hello world,” this book is
    for you. If you want useful advice and a gradual progression through the entire
    WP7 SDK and how it relates to the iOS SDK, this book is for you.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'If you want to build mobile applications and your ultimate goal is to get those
    applications into the Windows Phone application Marketplace, this book is for
    you. Finally, if you are a human being currently capable of both reading and breathing,
    this book is for you.


    You don’t need any prior knowledge of any specific programming language or platform
    to use this book. You’ll be gradually introduced to the C# programming language,
    the Silverlight framework, and Extensible Application Markup Language (XAML) for
    building user interfaces; wherever applicable, you’ll see comparisons with how
    these new concepts relate to iOS programming. As new concepts are introduced,
    you’ll be given the tools and background information you need to incorporate those
    into functioning applications.


    # What’s in This Book?


    As you have probably guessed by now, the first thing you will encounter in this
    book is an introduction. Then the book takes you on a tour of the Windows Phone
    7 programming environment, all the while providing comparisons with the iOS programming
    environment. Even if you aren’t an iPhone programmer, these comparisons provide
    useful information and insight about mobile device programming in general. The
    following is a breakdown of the chapters you’ll find in this book.


    Early in the book I will do a lot of comparison between the iOS environment (especially
    regarding the Objective-C programming language) and the Windows Phone 7 environment.
    This is to help ease the transition for iPhone developers into the world of WP7
    programming. As the book progresses and the platforms diverge and take their own
    unique paths, I will do less detailed comparisons and bring up iOS concepts only
    when necessary or when it gives me an excuse to tell a really good story.


    # Chapter 2: C# and Objective-C, Second Cousins Twice Removed


    This chapter provides you with an introduction to the C# programming language
    and the basics of the .NET Framework that support this language. I also compare
    some of the basic tenets of Objective-C programming with C# programming, including
    how these languages are similar, how they differ, and where they came from.


    # Chapter 3: Object-Oriented Programming


    Now that we’ve got a basic linguistic foundation for writing code in C#, I take
    you on a tour of some of the basics of object-oriented programming with C#. This
    chapter discusses concepts such as encapsulation, members, inheritance, contracts,
    and interfaces, and illustrates how these concepts are implemented in both Objective-C
    and C#.


    # Chapter 4: Event-Driven Programming


    This chapter covers an incredibly important concept in object-oriented programming
    and one that is even more important in Silverlight-based user interfaces: events.
    In this chapter I cover the means by which code gets notified that something important
    took'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'place, and I compare and contrast that with the “delegate pattern” that is
    so popular in iOS. This is where the real nuts and bolts of how to build applications
    starts.


    # Chapter 5: Rendering and View System Basics


    As much as some of us programmers would like to be able to do everything without
    a single piece of user interface, we need to acknowledge that there is a user
    interacting with our application and users need to see the app. This chapter describes
    how Silverlight goes from the XAML markup and code we write to a fully rendered,
    interactive user interface. The knowledge you get from this chapter will help
    you as you progress throughout this book to create rich, compelling user interfaces.


    # Chapter 6: From Xcode to Visual Studio


    This chapter is all about the Integrated Development Environments (IDE). Xcode
    is a powerful tool that has been around on the Mac since long before the first
    iPhone application was built, and Visual Studio has been around for much longer
    than Windows Phone or its predecessor, Windows Mobile. A developer’s familiarity
    and level of comfort with an IDE is directly related to how productive the developer
    is in building applications for that platform. This chapter provides you with
    the information you’ll need to be productive in Visual Studio 2010 and points
    out some key differences and similarities between Visual Studio and Xcode.


    # Chapter 7: Introducing Expression Blend


    Taking the tools discussion out of the realm of pure code and into the realm of
    the designer, this chapter talks about Microsoft’s Expression Blend tool. Until
    Microsoft released Blend, it was probably one of the last companies I would’ve
    accused of having a good design tool. However, Expression Blend is an absolutely
    incredible tool and, in the hands of a capable designer or even a half-talented
    developer, can create absolutely amazing user interfaces. In addition to coverage
    of Blend, this chapter also provides some comparison points with Apple’s design
    tool, Interface Builder.


    # Chapter 8: Using Basic UI Elements


    This chapter gives you a preliminary walkthrough of the tools in your toolbox
    that will allow you to build basic user interfaces. Here you’ll learn tips and
    techniques for using XAML (the declarative UI markup language used by Silverlight
    and Windows Phone 7) and code. You’ll build a few basic UIs and see demonstrations
    of all the basic controls that ship with the WP7 SDK.


    # Chapter 9: Using Advanced UI Elements


    This chapter builds on what you learned in the previous chapter and introduces
    new controls and new techniques for working with controls, including animation,
    perspective transformation, navigation, and much more.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 10: Using Hardware and Device Services


    A smartphone wouldn’t really be a smartphone without a bunch of hardware and system
    services that make it “smart.” This chapter shows you how to use all the “smart”
    features of your phone, including the accelerometer, GPS location, interacting
    with photos, contacts, email, SMS, and much more—even how to control the built-in
    FM radio that is present on all Windows Phone 7 devices.


    # Chapter 11: Introduction to Application Tiles


    Application tiles are the large icons that show up on the start screen of your
    phone after you have slid the background image up and away. This chapter teaches
    you everything you need to know about creating the images for these tiles, including
    building schedules to change the tile images, changing the tile count, and more.


    # Chapter 12: Using Push Notifications


    Push notifications provide developers with incredible amounts of power and flexibility,
    both for iOS and Windows Phone 7 applications. They allow you to send raw data
    notifications to running instances of your applications as well as send “toast”
    notifications, and even dynamically change the image and count of your application’s
    tile. This chapter shows you everything you need to know about building push notification
    applications, including walking you through a demonstration app that shows you
    how to build an application tile that updates with the current status of the zombie
    apocalypse (I wasn’t kidding when I said you’d learn how to use WP7 to survive
    the zombie scourge).


    # Chapter 13: The Phone Execution Model


    Now that you know a little about building user interfaces, using push notifications,
    and working with application tiles as well as system-level features and smartphone
    hardware, this chapter gives you an overview of the phone execution model. In
    this chapter you learn about what happens when a user presses the Back button
    to leave your application versus. pressing the Home button, techniques for holding
    onto information between invocations of your application, and what a “tombstone”
    is and how it is used.


    # Chapter 14: Local Storage on the Phone


    The iPhone, iPod Touch, and iPad all have access to Core Data, a relational database
    object-relational mapping API for iOS. Windows Phone 7 has no such ORM tool, but
    there are tons of options for storing and retrieving data on the phone that are
    in many cases so easy that developers won’t even miss not having access to an
    ORM such as Core Data.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 15: Building Smart Clients


    Now that you know how to store and retrieve data locally on a WP7 device, this
    chapter discusses the finer points of building “smart clients.” Smart clients
    are applications that typically store local data but augment that by synchronizing
    data with web services. This chapter shows you everything you need to know about
    accessing web services, making web requests, and even parsing common web service
    data formats such as Google Data (YouTube feeds), RSS, Twitter, and more. In this
    chapter you’ll build an application that displays the most recent YouTube videos
    uploaded by a user, follows a user’s Twitter feeds, downloads blog post data from
    an RSS feed, and displays the blog post text in an embedded browser control.


    # Chapter 16: Separating Your Concerns


    By the time you reach this point in the book, you should have a significant amount
    of syntax and basic knowledge under your belt. You know your way around Visual
    Studio and Windows Phone 7 and you’re starting to get the hang of things, but
    you’re also noticing that as the sample code gets more complex, it’s starting
    to get hard to read and you figure it would be hard to maintain in a production
    environment. This chapter introduces you to the concept of Model-View-ViewModel
    (MVVM) and how separation of concerns and good programming practices can help
    save your application from being strangled by its own complexity.


    # Chapter 17: Unit Testing and TDD


    If you took the lessons from the separation-of-concerns (MVVM) chapter to heart,
    you’re on the right track toward building testable applications. This chapter
    shows you how to create automated unit tests, how to run those tests, and introduces
    you to the concepts behind test-driven development (TDD) and how that can all
    be implemented to help your development life cycle for your WP7 applications.


    # Chapter 18: Building Connected Social Games


    Some of the most popular types of applications downloaded from the Apple App Store
    are casual gaming experiences or social applications with some element of fun.
    In other words, not hard-core 3D high-budget gaming experiences, but fun applications
    designed specifically for the “quick in and out” mobile form factor. This chapter
    is full of game theory, design considerations, advice, and patterns that you should
    take into account if you plan to build social connected applications or games
    for WP7. Also included in this chapter is an overview and comparison between Xbox
    Live for WP7 and GameCenter and GameKit for iOS.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 19: Securing WP7 Applications


    Security is an important part of virtually every application and isn’t just limited
    to simple username and password login functionality. This chapter is full of information
    about the various ways in which you can secure your application and the trade-offs
    you must pay for those types of security. There is thorough coverage of data encryption
    and the best (and worst) ways to implement this type of security.


    # Chapter 20: Debugging and Troubleshooting


    Surely you have never written an application that has had bugs, performed poorly,
    or operated in unpredictable ways. However, as I’m sure you know someone else
    who has had these problems, this chapter can help your “friend” debug and troubleshoot
    his application. This chapter contains tutorials on using the debugger, working
    with breakpoints, and even an overview of static analysis and code metrics.


    # Chapter 21: Deploying Applications to the Marketplace


    Congratulations, you’ve made it through the entire book and haven’t given up and
    gone back to the Twilight section of the bookstore to read about vampires in love.
    Instead, you’ve stuck with it, and you’ve learned a wealth of information about
    building Windows Phone 7 applications. Now you’ve gone off on your own and built
    your own application and you’re ready to submit it to the Marketplace to make
    your millions and become famous. This chapter contains everything you need to
    know to test your application on a device, get registered as a developer, and
    submit your application to the Marketplace.


    # Summary


    So you’re standing in the book store (or sitting at home in your favorite chair)
    and you’ve read through what you can expect to see in this book. As you read through
    this book, I highly recommend that you do so with a copy of Visual Studio nearby
    so that at any moment you can put the book down, type in a code sample, and start
    messing around with the code to see what happens. No matter how expertly I have
    managed to write any of the chapters, they are no substitute for good old-fashioned
    tinkering. So read on, tinker as much as possible, and enjoy the book!'
