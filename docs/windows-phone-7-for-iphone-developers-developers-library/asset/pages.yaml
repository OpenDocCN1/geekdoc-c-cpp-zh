    BookPivotView.xaml\"))\n        frame.Navigate(new Uri(\"/BookPivotView.xaml\"\
    , UriKind.Relative));\n\n    Debug.WriteLine(\"Loading characters from book '\"\
    \ + b.Title + \"'\");\n    Characters.Clear();\n    for (int x = 0; x < 5; x++)\n\
    \    {\n```"
