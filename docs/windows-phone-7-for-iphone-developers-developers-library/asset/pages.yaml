- pgno: 296
  md: 'Clicking the Breakpoints option will usually dock the breakpoints window to
    the bottom of your IDE but, depending on your options, it might show it as a floating
    window.


    This window shows all the breakpoints, their labels, conditions, and hit counts
    for your solution. Remember when I mentioned that I often use the “labeling” feature
    to group all my debug-printing breakpoints together. If I use a label like “debugprint,”
    I can then use this window to search for all breakpoints with that label by typing
    “debugprint” into the search box and pressing Enter. With those results in the
    window, I can enable or disable all those breakpoints with a single button-click,
    and I don’t have to hunt across hundreds of files in dozens of projects to find
    all my breakpoints.


    Before you continue to the next section, I highly recommend you spend some time
    playing with breakpoints. They are an often overlooked feature of VS2010. Most
    developers know how to stop execution all the time on a single line of code, but
    just as many developers forget that there are a host of other things you can do
    with breakpoints.


    # Logging and the Debug Class


    You’ve already seen how to use a special type of breakpoint to print out information
    to the debug log. In this section, I’ll cover a couple of techniques (as well
    as WP7-specific limitations) for logging other important runtime data as you troubleshoot
    your app.


    If you’ve written any iOS (or Mac) applications, you’re familiar with the NSLog
    function. This function is used extensively by iOS developers to keep track of
    important information, events, and data as it flows through the application. They
    use it to make sure that assumptions about data on which their code operates are
    correct and to print out useful information while developing an application.


    The Windows Phone 7 equivalent of the NSLog function is the Debug.WriteLine method.
    You use this method in much the same way as you use NSLog—to dump whatever information
    you feel is important to the debug log.


    Windows and web developers who have experience with Visual Studio 2010 might be
    a little disappointed to notice that the number of methods on the Debug class
    are limited and that the Trace class is missing entirely. For whatever reason,
    there is no out-of-the-box method by which you can trace information to a text
    file in WP7 like there is on desktop or server platforms with VS2010.


    It’s really a matter of personal preference whether you pepper your code with
    Debug.WriteLine statements or whether you use the breakpoint technique I outlined
    previously. I personally prefer to use the breakpoint technique because it allows
    me to toggle different types of output without having to delete or comment out
    code. Additionally, when I’m ready to submit the application for production certification
    through the Marketplace, I don’t have to worry about tracking down all my Debug.WriteLine
    statements and removing them. On the other hand, if something about a large number
    of breakpoints bothers you, you might be more comfortable using Debug.WriteLine
    instead.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Using Static Analysis


    So, you’ve been diligent and you’ve been creating unit tests to make sure your
    code does what you expect. You’ve been debugging your code and you’ve uncovered
    all kinds of nasty little critters, but you’ve also managed to squash all those
    bugs. You’re sitting back in your chair thinking that you’re ready to upload your
    masterpiece to the application Marketplace. But wait, there’s more!


    There’s another tool in the Windows Phone 7 developer toolbox that can help hone
    your application code into a finely chiseled blade (a Ginsu, perhaps?). Microsoft
    has come up with an extensive set of rules, recommendations, and warning signs
    culled from years of experience and developer feedback. This set of prescriptive
    guidance has been integrated directly into a static code analysis tool that is
    built in to Visual Studio 2010. In other words, VS2010 can dig through your code
    and point out some very common problems and even recommend ways that you might
    be able to fix them.


    For example, the static analysis tool can track the method calls and property
    accessors in your code and find areas where you might accidentally fall victim
    to the law of unintended consequences. A very common situation here is when code
    calls a property accessor and the property accessor then invokes some other function,
    and that function can be overridden in child classes. This creates a foggy area
    that allows vast amounts of code to potentially execute as a result of a simple
    property set that you wrote. A developer unaware of your original intent might
    be able to come along and override that method and neither of you might immediately
    notice the consequences of this. Thankfully, the VS2010 static analysis tool is
    aware of this and thousands of other possible “gotchas.”


    Figure 20.2 shows what it looks like after code analysis has been run on a Windows
    Phone 7 application project. To trigger code analysis, all you need to do is right-click
    a project and choose Run Code Analysis. This will build the application and then
    perform an analysis of your compiled code.


    ![](img/04a00d46bb1059867d95707babd62ee7_297_0.png)


    Figure 20.2 Results of code analysis on a sample project.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'In Figure 20.2, you can see that I’ve got a couple of spots where the static
    analysis tool is warning me that I should check a call execution chain for unintended
    consequences. In one of these cases, I really do want those consequences, and
    I’m stubborn and my boss is yelling at me, and I need to get home to my Xbox,
    so I want to suppress that warning instead of looking for a way to refactor my
    code to avoid the warning.


    There are a couple of different ways to suppress these warnings. To start, highlight
    the warning in the list and right-click it. When you choose the Suppress Message(s)
    option, you can choose to suppress the message “in source” or in a project suppression
    file.


    If you choose to suppress the message in source, this creates an attribute that
    sits at the scope of the code block that violated whatever static analysis rule
    triggered the warning. The next time you run code analysis, this warning message
    will not appear.


    Personally, I feel that littering my source code with attributes that only apply
    at build time and only during code analysis is ugly. Thankfully, I can choose
    to suppress the static analysis warnings in a project suppression file. If I choose
    this option, an attribute will be created in a file called GlobalSuppressions.cs.


    Listing 20.1 shows a sample of one of the suppressions that I created to avoid
    doing the real work of refactoring my code.


    # Listing 20.1 GlobalSuppressions.cs


    ```

    // This file is used by Code Analysis to maintain SuppressMessage

    // attributes that are applied to this project.

    // Project-level suppressions either have no target or are given

    // a specific target and scoped to a namespace, type, member, etc.

    //

    // To add a suppression to this file, right-click the message in the

    // Error List, point to "Suppress Message(s)", and click

    // "In Project Suppression File".

    // You do not need to add suppressions to this file manually.


    [assembly: System.Diagnostics.CodeAnalysis.SuppressMessage(

    "Microsoft.Usage",

    "CA2214:DoNotCallOverridableMethodsInConstructors",

    Scope = "member",

    Target = "ApocalypseTrainer.ViewModel.FoodItem.#ctor()")]

    ```


    I joke about suppressing the static analysis warnings for trivial reasons, but
    the truth is that you should spend a little bit of time figuring out why the warning
    appeared and what problems are associated with that warning before you suppress
    it. Each one of the code analysis warnings has a unique number (such as CA2214
    in the preceding sample). If you aren’t sure why the static analysis tool is warning
    you, enter that number into your favorite search engine and see whether anything
    comes up. I have been pleasantly surprised at how much detail I can find online
    about some of the CA rules and warnings.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'There is another kind of analysis that produces metrics summarizing your code.
    This type of analysis digs through your compiled code and computes statistics
    such as a “maintainability index” based on other values such as “cyclomatic complexity,”
    “depth of inheritance,” “class coupling,” and even the number of lines of code.


    Cyclomatic complexity (also called conditional complexity) is a metric used to
    indicate the complexity of a software program. It measures the number of independent
    paths through a particular block of source code. A cyclomatic complexity value
    of 1 indicates that there is only one way to get from the beginning to the end
    of a block of code. If you introduce an if/else block into code that had a cyclomatic
    complexity of 1, it will then change to 2, indicating that you can finish that
    block by either going through the if section or going through the else section.
    The greater an application’s cyclomatic complexity, the harder it is to write
    unit tests for, and the larger the number of manual tests a developer must do
    to exercise all the code. This complexity grows naturally as an application grows,
    but you should keep an eye on it and possibly find ways to reduce this complexity
    by providing a more linear path through your code. Figure 20.3 shows some sample
    output from a static analysis run.


    ![](img/04a00d46bb1059867d95707babd62ee7_299_0.png)


    Figure 20.3 Generated code analysis metrics.


    Depth of inheritance, as its name implies, refers to the depth of a class within
    an inheritance hierarchy. The static analysis tool scores the classes in your
    application with a value indicating the inheritance depth. In general, the deeper
    a class is within an inheritance hierarchy, the more difficult it is to predict
    the behavior of that class and the more complex the design. Some of this you need
    to take with a grain of salt because control hierarchies are often deep before
    you even start writing your own custom control. However, if you have a view model
    class with a depth of 8, you might want to consider refactoring to flatten your
    inheritance tree a little. Figure 20.3 shows the output of the code metrics window,
    including the depth of inheritance rank, cyclomatic complexity score, and class
    coupling value.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Class coupling refers to the number of classes on which another class depends.
    Suppose I’ve built a class and it has two properties, and each of these properties
    is a different class. This one class now has a class coupling value of 2 (the
    static analysis tool ignores built-in .NET types when determining this metric).
    The general consensus is that the higher the class coupling value for a class,
    the less stable that class is. In other words, classes with a high class coupling
    value are far more likely to break after a code change than classes with a low
    class coupling value. MVVM, as you saw in that chapter, is designed specifically
    to allow you to build powerful user interfaces with a minimum of class coupling.
    Another tip to keep in mind is that if you convert a class-typed property into
    an interface-typed property (allowing for easy mocking or dependency injection
    via tools such as Unity or Castle Windsor), this will reduce the class coupling
    metric.


    # Summary


    Before we get into the nuts and bolts of submitting your application to the Marketplace
    in the next chapter, I wanted to make sure that I introduced you to some of the
    tools available to Windows Phone 7 developers for debugging, tracing, troubleshooting,
    and even analyzing code for areas of improvement.


    One unfortunate fact of the software development life cycle is that no matter
    how quickly you manage to complete the main functionality of your application,
    it is going to take a very long time to hone, refine, tweak, and refactor your
    application after that point. Knowing how to use static analysis tools, debuggers,
    breakpoints, and the other techniques presented in this chapter will help take
    your application from a good app to a rock-solid, stable, reliable application
    that is more likely to pass the certification process.


    Just remember that the purpose of debugging isn’t to execute without errors; it’s
    to find errors so that you can fix them. Try to break your application as many
    ways as you can and use the techniques in this chapter and in previous chapters
    to find and fix those bugs. Then you’ll be ready to submit your application to
    the Marketplace and hopefully make truckloads of money.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Deploying Applications to the Marketplace


    > The safe way to double your money is to fold it over once and put it in your
    pocket.

    > Frank Hubbard


    This chapter is all about deploying your applications to the Marketplace. You’ve
    written the code for your application and you’re proud of what you’ve created.
    You have a good application icon, a tile icon, and you’ve mastered the techniques
    of concern separation (possibly with MVVM). You’ve tested your application with
    unit testing, and you’ve debugged it and performed static analysis on the application.
    You’ve given the code to your friends or colleagues and gotten them to run the
    application—and they love it. You’re ready to submit your app to the store and
    start making giant piles of money.


    In this chapter you’ll see a hands-on walkthrough of taking an application from
    the point where you’re satisfied that it’s fast, stable, reliable, and complies
    with all the certification requirements to the point where it’s been uploaded
    to the Marketplace and you can start collecting your money.


    To do this, I’ll introduce you to a sample application that I wrote called Zombie
    Apocalypse Trainer that, interestingly enough, falls into the Health and Fitness
    category of the Marketplace. I will show you, step-by-step, how I took this application
    and went through the entire deployment and certification process, including deploying
    it to a test device to make sure everything worked properly.


    # Introducing Zombie Apocalypse Trainer


    Zombie Apocalypse Trainer is a new twist on the standard calorie-tracker application.
    Rather than motivating people to lose weight and keep tabs on their calories by
    shaming'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'them with a log of their eating habits, this application gives people new motivation:
    avoiding death at the hands of hordes of brain-sucking undead.


    The application asks you to set a target weight and a date by which you’d like
    to reach that weight. This is essentially the Zombie Apocalypse—make-it-or-break-it
    time. If you don’t reach your target weight by the target date, the application
    assumes that you are simply too overweight to avoid capture and you are going
    to die a slow, painful death by having your brains eaten by zombies.


    Here is the description of the application that I intend to use in the Marketplace:

    Are you ready for the Zombie Apocalypse? When the streets are filled with rabid,
    brain-eating undead, will you be able to outrun them? Use this application to
    track your calories burned, calories eaten, and weight log. Just tell the app
    when you think the Zombie Apocalypse will be and start tracking your progress.


    From a technical standpoint, Apocalypse Trainer is a standard Silverlight WP7
    application that was built with the use of the MVVM Light framework discussed
    earlier in the book. I tested the application using the unit testing techniques
    I discussed in earlier chapters. It has three core view models: Main, Today, and
    History.


    The Main view model contains all the information required to supply the home screen
    with its useful information, such as the number of days remaining until the apocalypse
    and how long you have gone without being mauled (without exceeding your calorie
    budget).


    The Today view model contains the list of food items you’ve consumed today and
    the list of exercises that you’ve done today. This differs from the underlying
    persistence medium, which contains a list of all food and exercise since you installed
    the application. Remember that view models are specifically designed to support
    the UI in its effort to render what the user wants to see, not necessarily what
    the data looks like on disk (or in a database or on a web service, and so on).


    The History view model contains the weight log—the history of weigh-ins since
    you’ve installed the application. As you navigate through the application, dialogs
    appear that allow you to create new data. These are WP7 pages that are bound to
    individual view models using a view model locator (again, this is all stuff we
    discussed in the MVVM chapter). When the user taps the Confirm button on a dialog
    to create a new piece of information, a message is sent using MVVM Light’s messaging
    framework. The view model that holds the collection of items to which the new
    item will be added has subscribed to this message and, in response to the message,
    adds the appropriate item to the collection.


    Whenever data in the view model changes, the view model asks a subordinate data
    service to make the changes permanent. In the case of Zombie Apocalypse Trainer,
    the persistence medium is isolated storage. I use the IsoStoreHelper class that
    was used several times throughout the book to read and write object graphs in
    and out of isolated storage.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "When I do store information in isolated storage, I have three separate files:\
    \ weight history, exercise history, and food history. The reason I do this is\
    \ that these three types of view models are never created on the same screen and\
    \ they are never joined to each other. This minimized the number of isolated storage\
    \ writes and reads per screen. To convert the data model objects into view model\
    \ objects, I used C# class extensions to convert one object type to another. Additionally,\
    \ I used LINQ queries to filter the array of data in the data service to include\
    \ only the current day's data when I load the view model.\n\nThis pattern allows\
    \ me to do number crunching and analysis (such as determining the length of the\
    \ current “days without a mauling” streak) on the entire history of information\
    \ recorded by the application, but the view model displays only a subset of that\
    \ information to the user. The Today screen never displays more data than what\
    \ was recorded today, and the Home screen returns only the aggregate information\
    \ about the days since the last mauling.\n\nHere’s some of the code in the Today\
    \ view model that I used to grab historical information from the data model and\
    \ convert it to a subset within the view model for rendering:\n\n```\nvar todayFood\
    \ =\n    from FoodRecord foodRecord in DataService.FoodHistory.FoodRecords\n \
    \   where foodRecord.RecordDate.Date == DateTime.Now.Date\n    orderby foodRecord.RecordDate\
    \ ascending\n    select foodRecord;\nthis.FoodItems.Clear();\nforeach (FoodRecord\
    \ fr in todayFood)\n{\n    this.FoodItems.Add(fr.ToViewModel());\n}\n```\n\nIn\
    \ this case, DataService is a property that contains an instance of the helper\
    \ object I wrote to communicate with the three underlying files in isolated storage.\
    \ This service is also responsible for computing the number of days since the\
    \ last mauling. Because the view model can see only today, this naturally becomes\
    \ the responsibility of the data service, which can see the history of the application\
    \ since the day it was installed.\n\nThe ToViewModel() method is an extension\
    \ method on a separate class. I used this so that neither the Model nor the ViewModel\
    \ class has explicit knowledge of how to convert from one to the other, but I’m\
    \ still able to do it. This is just one option; other options including using\
    \ the AutoMapper class from codeplex, although at the time I wrote this application\
    \ I couldn’t find a reliable port of it for WP7.\n\nIf you want to know more about\
    \ how I built this application, feel free to drop by my blog at http://www.kotancode.com,\
    \ where I will be sharing stories about WP7 development in general, as well as\
    \ the experiences I had while building the Apocalypse Trainer application."
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Registering and Deploying to Test Devices


    Before you can do anything related to the Marketplace, including test your application
    on a real phone, you need an App Hub developer account. This account is your publisher
    profile for when you create and publish applications for Windows Phone 7 or for
    Xbox Live.


    The first thing you need to do is go to http://create.msdn.com and sign up for
    an account. This account will be linked to your Windows Live ID, so if you have
    multiple Windows Live IDs, make sure you link it to the right one.


    Figure 21.1 shows the first step in account creation. In this step you choose
    your country of origin and whether you are going to be creating an individual
    account, a company account, or a student (DreamSpark) account.


    ![](img/04a00d46bb1059867d95707babd62ee7_304_0.png)


    Figure 21.1 Creating an App Hub account.


    After you specify the type of account you want, you will need to specify your
    personal information and account details, as shown in Figure 21.2. I’ve left some
    fields blank to maintain some of my privacy, but you will need to provide a valid
    email address (you will get an email requesting that you verify this email address,
    so make sure it’s an address that works), at least one phone number, and your
    home address. Don’t worry, this information will not be available to people who
    buy your application.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/04a00d46bb1059867d95707babd62ee7_305_0.png)


    Figure 21.2 Supplying additional information for App Hub account.


    After you’ve specified your personal details, you will be asked to pay for your
    developer account membership. This is currently $99 per year and will allow you
    to submit an unlimited number of paid applications and five free applications
    (there is an additional per-application fee for going above the limit of five
    free apps).


    As you go through the process, you will eventually get to step 4, account confirmation.
    Some time (could be from a few hours to a day) after this, you will receive an
    email with instructions on how to fill out a survey. This survey will ask you
    some very detailed questions, including the names of creditors to whom you send
    money and other information that, in theory, only you could know. This survey
    is from a company called GeoTrust, which is responsible for verifying the legitimacy
    of developer accounts. You cannot submit applications to the Marketplace until
    you have passed the GeoTrust certification process, so make certain that you pay
    close attention to the instructions and answer all the questions carefully.


    For me, the entire GeoTrust process took about 24 hours, although I’ve heard that
    it can take a little less time; I’ve also heard stories where people had problems
    with the survey and it took several days to sort the mess out.


    After your account has been certified and is considered valid, you can register
    up to five developer devices. To do this, plug the device in and make sure that
    your Zune synchronization and connection with the device is working properly.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Next, run the developer registration application that came with the WP7 developer
    tools. This application is installed for you as a shortcut on your start menu.
    If you can’t find it (and you’re running Windows 7), open the start menu and type
    the word “registration” into the search box. The autocomplete list should filter
    down to an application titled Windows Phone Developer Registration. When you launch
    the application, you will see a screen that looks like the one shown in Figure
    21.3.


    ![](img/04a00d46bb1059867d95707babd62ee7_306_0.png)


    Figure 21.3 Registering a device for testing.


    After you register a device for testing, go into Visual Studio 2010, and in the
    debug toolbar, change the active target from Windows Phone 7 Emulator to Windows
    Phone 7 Device and start a debug session. You will need to make sure that your
    phone is still plugged in and that if you have a PIN code lock on the device,
    that you have unlocked it before attempting to deploy the application.


    Visual Studio 2010 will not deploy applications (debug or release) to WP7 devices
    when the home screen is currently locked with a PIN code. Always remember to unlock
    the device before attempting to deploy.


    # Prepping Your Application for Submission


    Before you can deploy your application to the Marketplace, you need to make sure
    that a few details have been taken care of. First, you need to make sure that
    your WMAppManifest.xml file has been populated appropriately with your publisher
    information, the application title, and so on. The following is the WMAppManifest.xml
    file from my Zombie Apocalypse Trainer application:'
