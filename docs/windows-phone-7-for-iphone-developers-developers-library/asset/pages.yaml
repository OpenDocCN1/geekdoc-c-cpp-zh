- pgno: 183
  md: '# Introducing the Phone Execution Model


    When you are using your desktop computer, you can interact with application processes
    in a variety of ways. Typically, you launch an application process, interact with
    the application, and then shut the application down. With today’s modern computers
    and operating systems, people usually launch multiple applications and leave them
    all running until they shut the computer down. On today’s laptops, many people
    don’t even bother shutting their computer down anymore—they just close the lid
    and open the lid again the next time they want to resume their work. They expect
    everything to appear as it last was when they shut the lid.


    The idea that all your applications are running on your computer and are available
    by clicking the window or using a hot key (such as Alt+Tab on Windows) is nothing
    new. In fact, it is so prevalent that people expect applications to look exactly
    as they left them when they lost focus.


    This particular model doesn’t work on mobile phones. Mobile devices have limited
    memory and CPU resources and cannot leave a bunch of applications running at the
    same time. In fact, Windows Phone 7 allows only a single application to be running
    at any given time.


    Just because the phone is limited to one active application at a time doesn’t
    mean the user can’t get a rich experience in which applications remember what
    they were doing at the time the user launched a different application. Applications
    can save transient state, such as what a user had typed into a textbox when a
    new application was launched, and they can save persistent state that, as the
    name implies, persists between multiple launches.


    This is where the application life cycle comes in. Windows Phone 7 applications
    are given fair warning when pages are about to be navigated away from, when the
    application was launched as a fresh instance, or when it was reactivated from
    a previously suspended (tombstoned) instance, when an application is going to
    be deactivated as a result of some other application (such as a phone call) moving
    to the foreground.


    This next section takes you on a tour of all the various stages and events in
    the life cycle of a Windows Phone 7 application. When you are done reading this
    section, you should have a thorough understanding of how WP7 compensates for the
    one-application limitation and how, if your application is written properly, end
    users will never even notice this limitation.


    # Application Life Cycle Walkthrough


    Unlike desktop applications that can be started only by launching a brand new
    instance, Windows Phone 7 applications have multiple entry and exit points, and
    each of those implies a different impact on the application, its running state,
    and the data the application is holding in memory. The following sections describe
    the various stages in the life-time of a Windows Phone 7 application and how users
    typically get into and out of those stages. Figure 13.1 shows an example of transitions
    between the various stages of the WP7 application life cycle.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/04a00d46bb1059867d95707babd62ee7_184_0.png)


    # Figure 13.1 Sample application states and transitions.


    The following is a list of terms you’ll need to be familiar with to understand
    the phone’s execution model:


    +   - Navigating backward—Backward and forward navigation isn’t just built in
    to the web browser model, it is built into how users navigate through the Windows
    phone. When users tap the back button, they go to the previous page within an
    application. Tapping the back button while on an application’s home page exits
    the application. Tapping back again takes the user to the last page of the previous
    application, and so on. Keep in mind, however, that there is no forward button
    on a WP7 device; only back, home, and search.

    +   - Tombstoning—This refers to when your application process has been terminated
    because a user navigated away from your application. State information about your
    application is maintained by the operating system (for a period of time determined
    by the operating system) and will be handed back to your application when it is
    resumed (or “dug up,” if you prefer to continue the tombstone analogy).

    +   - Page state—This refers to the visual state of a specific page within an
    application.

    +   - Application state—This refers to the current, in-memory state of an application.
    This state is not associated with a specific page.

    +   - Transient state—This refers to state data that has occurred since the application
    was activated last. This could be information recently downloaded from a web service
    or other information changed as a result of user interaction.

    +   - Persistent data—This is data that is shared by all instances of an application,
    whether created by a launch or an activation. Classic examples are application
    settings and data created by users when using the application that they expect
    to be permanent.


    # Launching


    When an application is started through any other means than a user pressing the
    back button to resume a previously running instance, the application is considered
    to be in the'
  merge: -1
  img_proc: true
- pgno: 185
  md: '“launched” state. This can happen when the user taps the application’s tile
    or the icon or name in the installed applications list. Additionally, if the user
    taps an active toast notification, it will cause the application to launch.


    Regardless of how an application is launched, a brand new instance of the application
    is created when it is launched. This means that it won’t have any transient state
    left over from previous instances of the application. The Launching event is fired
    during this phase, allowing you to write custom code that is executed during this
    phase.


    This custom code should not access isolated storage during this event because
    the UI has not been displayed to the user at this point, and reading files from
    isolated storage can further delay the UI from appearing and can give the user
    an impression of poor or sluggish performance. Finally, every application only
    has 10 seconds to finish the launching stage. If the application doesn’t become
    responsive within 10 seconds, WP7 terminates the process.


    Even if some leftover state might be available from a previously running instance
    that might have been stored somewhere and made available for the application,
    it should not be used after a launch. Launching implies a new instance of the
    application, and users should expect a new instance from every application they
    launch, regardless of manufacturer.


    # Running


    After an application has finished the launching phase and whatever custom code
    you’ve written in the Launching event has completed, the application is in the
    running stage. This is what most developers are used to when they think of application
    states. There is a process running; variables developers have stored in memory
    are safe and accessible.


    While running, if an application needs to make data persist to be available for
    future instances, it can store that data in isolated storage, preferably during
    times when the application is idle to avoid creating a sluggish UI when storing
    large amounts of data. Another option is to progressively store small chunks of
    data into isolated storage rather than making a single giant write operation.


    # Activating


    When a user returns to a previously tombstoned application, either through the
    back button or because something else (like a launcher, chooser, phone call, and
    so on) took over the ground, that application is reactivated.


    When an application is awakened from a tombstoned state, the Activated event is
    fired. This event is special in that it provides the application with access to
    previously stored state data. If, during the deactivation process, application
    code stored serializable objects in a special state dictionary, that same dictionary
    is made available to the application upon activation. If handled properly, the
    user will never even know that the application’s process was shut down in the
    interim.


    In the Activated event, the application code can access the State property of
    the PhoneApplicationService class to restore the data saved during the deactivation
    process. Just like with the Launching event handler, applications should not make
    network calls or make prolonged read operations from isolated storage, because
    doing so during the'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Activated event handler could prolong application start time, make the UI take
    too long to appear, and if it takes longer than 10 seconds, prevent the application
    from loading altogether.


    # Deactivating


    When an application is running in the foreground and it is replaced by another
    application (because only one application can be running in the foreground at
    a time), the original application is deactivated. Applications can be deactivated
    when a user presses the start button, when a launcher or chooser takes over the
    foreground, and when an idle timeout causes the lock screen to engage.


    When an application is being deactivated, the Deactivated event is fired. This
    is an extremely important event for developers to be aware of and to have their
    applications handle properly. During this event, your application can store transient
    data in the State property of the PhoneApplicationService class. This might be
    the most recent results of a web service query or some other information that
    was created or downloaded since the application launched. In addition to storing
    transient data in the state dictionary so that it can be retrieved during a subsequent
    activation, you also want to make sure that you store any persistent data in isolated
    storage. Just because an application is deactivated doesn’t mean it will always
    be reactivated. If resource limits are reached, or too many applications are sitting
    on the stack waiting to be activated again, your application could be closed and
    all transient state for it will be cleared.


    There is also a small chance that your application might be deactivated without
    being tombstoned. This could happen if a user presses the start button to deactivate
    the application and then quickly taps the back button to reactivate the application
    before the operating system has a chance to terminate the original process. For
    this reason, you will want to avoid destroying any data or wiping out any potentially
    important in-memory data during the Deactivated event.


    # Closing


    If an application is terminated without another application taking its place in
    the foreground, such as when a user taps the back button enough to leave the home
    page of an application, the application is in the closing state and the Closing
    event is fired.


    During the Closing event, an application should save any persistent data to isolated
    storage. There is no need to store transient information in the State dictionary
    because the application is being terminated, not deactivated or tombstoned. The
    next time the application becomes active, regardless of how, it will be a result
    of a launch of a fresh instance and there will be no transient state to restore.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Tombstoned


    So far in this chapter, you’ve seen me use the term “tombstoned” a lot; I wanted
    to make sure that the tombstoned application state had its own special mention
    here.


    As you already know, an application that loses its place in the foreground becomes
    deactivated. This deactivated application has a chance to save transient state
    in a dictionary. There is a (typically short) period of time during which an application
    has been deactivated but it has not yet been tombstoned. If an application is
    not reactivated quickly after deactivation, it will then be tombstoned. This means
    that the application process will be terminated but the transient state of that
    application, as well as some other information about the original process, will
    remain behind (the tombstone, as it were).


    When a tombstoned application is reactivated, a new instance of the application
    process is created, but instead of having the Launching event raised, the Activated
    event is raised, and the information originally left behind on the tombstone is
    used to restore the application to the state in which it was before deactivation.


    # Managing Application and Page State


    In this section of the chapter we’re going to put the information we’ve been discussing
    so far about activation, deactivation, tombstoning, and launching to good use.
    We’ll use that information to build an application that plays nicely with the
    Phone Execution Model to provide a seamless user experience. This sample application
    is very basic and just stores the date and time of the last application exit in
    the PhoneApplicationService’s state dictionary. From now on, throughout the rest
    of the book, I will refer to this state dictionary as “tombstone state” because
    the latter is easier to read and easier to say aloud than the former.


    Despite the simplicity of the application, a few things there might teach some
    very valuable lessons. The first is that rather than putting the code that reads
    to and writes from tombstone state in the App.xaml.cs global Activated and Deactivated
    events, I’ve put the tombstone state code in the OnNavigatedTo and OnNavigatedFrom
    events in an individual page.


    I like this for a number of reasons. The first is that if all your transient state
    “load and restore” code exists at the application level, you don’t really know
    what’s in scope and what isn’t. Why would you need to try to save transient state
    for a page that hasn’t even been instantiated? The other is if you want to affect
    your GUI as a result of restoring from tombstone state, it’s much easier if these
    updates are done as close to the GUI as possible, by the page that will be affected
    by the state restore.


    The choice is yours, and cases can be made for both options. Deciding how and
    when to utilize tombstone state is an architectural decision that will be different
    for each application you write; there is no single cookie-cutter recipe that will
    tell you what you should do. However, your application must abide by some rules.


    At first you might be tempted to shove an entire view model object (which in many
    cases is a deeply nested object hierarchy) into the tombstone state dictionary.
    As much as'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'you might like to do this, not only is it not possible, it’s not a good idea.
    You can only store primitive data types in the state dictionary. Even if you could
    store complex graphs in the state dictionary, you wouldn’t want to. That isn’t
    what the tombstone state is for. Use the following guidelines to determine whether
    you should be storing a value in tombstone state:


    Is the value you want to store in tombstone state one that takes a considerable
    amount of time to generate but can be stored as a primitive data type? Is the
    value you want to store in tombstone state one that cannot be stored permanently
    on disk for design purposes but can be stored as just a few primitive data types?
    If the answer is yes to either of these, there’s a good chance your application
    might benefit from using tombstone state.


    Quite possibly, one of the best examples I can think of for when you should use
    tombstone state is that of a location-aware application. When the application
    starts up, it uses the phone’s GPS to gather the current position. Then it centers
    a Bing Maps control on that position. Without using tombstone state, when a user
    briefly exits the application and then comes back, the application will reacquire
    the GPS location, which can take a long time. You can provide the user with a
    better experience by caching the current longitude and latitude values in the
    tombstone state dictionary. This way, when your application is Activated, you
    can center the Bing map on the cached location rather than re-acquiring it.


