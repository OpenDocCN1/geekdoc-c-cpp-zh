    ```\n\nThe TurnAction class in this sample just identifies the intent of the player\
    \ making the turn. The server is the final arbiter as to whether a move can be\
    \ done, and it has the final say and can reject a move if there is a problem with\
    \ it.\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Runtime.Serialization;\n\nnamespace ConsoleApplication1\n\
    {\n[DataContract]\npublic class TurnAction\n{\n    [DataMember]\n    public int\
    \ DestinationRow { get; set; }\n\n    [DataMember]\n    public int DestinationColumn\
    \ { get; set; }\n\n    [DataMember]\n    public int GamePieceId { get; set; }\n\
    }\n}\n```\n\nAgain, remember that this is the first release of the WP7 SDK, and\
    \ it is likely that the out-of-the-box facilities for multiplayer gaming on Xbox\
    \ Live or some other isolated gaming network will improve over time. If you take\
    \ some of the advice from my MVVM chapter and perform all your interactions with\
    \ a gaming back-end using the “service provider” pattern, your WP7 code should\
    \ be well isolated from any future changes to the gaming platform, even if you\
    \ end up retiring your home-grown server in favor of running your game on Microsoft’s\
    \ infrastructure in the future.\n\n# Real-Time Multiplayer Gaming\n\nThe networking\
    \ requirements of a real-time multiplayer game differ vastly from that of a turn-based\
    \ game. Through the use of push notifications and a server-heavy back-end architecture,\
    \ turn-based games can even progress while the application isn’t running.\n\n\
    Real-time gaming often requires the use of low-level networking resources, such\
    \ as sockets (especially those of the UDP variety), to get a barrage of streaming\
    \ updates from the server that might include things like the ever-changing location\
    \ of nearby monsters,"
  merge: -1
  img_proc: true
- pgno: 277
  md: 'status updates like a “heartbeat” pulse that periodically updates the client
    of your character’s health and other status. In addition, as your character moves
    and interacts with the environment, a stream of information needs to flow outward
    from the client application so that the server can aggregate the information about
    how you are manipulating and interacting with your environment with the information
    received from all the other nearby players.


    This kind of game is not only hard to implement on the server side (and often
    carries massive infrastructure requirements), but it’s also often very difficult
    to implement on the client.


    Windows Phone 7 does not offer access to any form of TCP or UDP sockets through
    its Silverlight SDK. This means that the only type of multiplayer gaming you can
    get at (without resorting to Xbox Live and the previously mentioned partnership
    with Microsoft) is going to be the consumption of web services. Web services are,
    in most cases, very high latency and the most efficient way to use those services
    is to send large payloads less often. This is the exact opposite of the way many
    real-time multiplayer games operate, which send incredibly frequent updates carrying
    small amounts of information.


    There is nothing I can say here that will make this sting any less. There are
    a few types of architecture and design that will allow you to use web services,
    Silverlight, and the Windows Phone 7 networking stack (limited such that it is)
    to create “near” real-time multiplayer games. The design of this type of game
    often consists of a single, persistent game world, but it is a game world in which
    rapid updates are not necessary. In other words, the actions players take against
    and within this shared world are ones that don’t require immediate actions from
    other players. Games like this might be games where players slowly build empires
    in a strategy game, but the design of the game is such that players do not need
    to take immediate (within a few seconds, that is) action to respond to the actions
    of other players.


    Remember that there are optimal game designs for every type of mobile gaming platform.
    If the game design you’re envisioning requires access to UDP sockets to stream
    blasts of location changes, attacks, heartbeats, and more, perhaps Windows Phone
    7 isn’t the platform you should be using. Think about the capabilities of the
    device and especially the most common usage pattern of smartphones (quick in-and-out,
    casual, and occasionally connected). With this in mind, you should be able to
    build a casual game that will satisfy plenty of smartphone users and, in the future,
    be able to utilize even more networking resources as both your game and the WP7
    platform advance.


    # Summary


    Windows Phone 7 is, as this book is being written, a v1 product. This means that
    Microsoft has had to prioritize the list of features available on the platform.
    Features such as fast, reliable email, web browsing, application market place,
    rich multimedia, and a decent camera are all features that need to be available
    in a v1 product.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Some of us might argue that a rich gaming platform SDK like Game Center and
    GameKit should be available in a v1 product, but it all comes down to building
    a strong base and implementing the features that smartphone features *demand*,
    and then progressively implementing those features that WP7 developers *want*.


    Windows Phone 7 might not have the same set of out-of-the-box features as Apple’s
    Game Center and the GameKit API that drives it on the mobile device. However,
    WP7 has incredibly powerful and easy-to-use web service APIs and, as you’ve seen,
    rich capabilities to build beautiful, powerful, and smooth UIs that can be used
    for business or entertainment.


    If you take some of the advice learned in the previous chapters around practices
    for testing applications and using MVVM to build loosely coupled apps, you can
    use patterns like the service provider pattern to wrap your implementation of
    gaming services and back-ends in v1 of your product. Then, as Microsoft develops
    more capabilities for those of us who are not Xbox Live partners into the WP7
    SDK, you will be able to quickly and easily adapt to those features, and maybe
    even retire infrastructure and resources you have running in the cloud that were
    used to support v1 of your game. In the next major release of Windows Phone 7,
    Microsoft has stated that it will be allowing Silverlight applications to take
    advantage of Xbox Live libraries, providing wider potential for casual and indie
    game developers.


    The goal of this chapter has been to inspire you to create a Silverlight-based
    Windows Phone 7 game. Although some of the social, connected, multiplayer features
    such as achievements, leaderboards, and peer-to-peer networking APIs might not
    be available today, nothing is stopping you from building a great casual game
    now and adding these social features as Microsoft expands the SDK, or rolling
    your own and replacing your implementation with Microsoft’s in the future.'
  merge: -1
  img_proc: true
- pgno: 279
  md: "# Securing WP7 Applications\n\n> Security is mostly a superstition. It does\
    \ not exist in nature, nor do the children of men as a whole experience it. Avoiding\
    \ danger is no safer in the long run than outright exposure. Life is either a\
    \ daring adventure or nothing at all.\n> \n> Helen Keller\n\nThis chapter covers\
    \ the increasingly important topic of security. Users of smartphone applications,\
    \ especially those who use their smartphones for work, both expect and demand\
    \ that the phones and the applications running on them are secure.\n\nUnfortunately\
    \ consumers and developers often have different definitions of security. To add\
    \ to the confusion, device manufacturers have certain expectations about what\
    \ developers will do to secure their applications, and developers have expectations\
    \ about what device manufacturers will do to maintain the security of the device,\
    \ the platform, and the operating system.\n\nIn this chapter I attempt to clear\
    \ away some of the ambiguity surrounding the definition of secure applications,\
    \ devices, and application platforms. In addition, I'll show you some of the built-in\
    \ security features of the Windows Phone 7 platform and take you through some\
    \ code samples for encrypting your application's data for secure storage.\n\n\
    # What Is a Secure Application?\n\nSecurity is more about perception than it is\
    \ about reality. The truth is that given sufficient time, resources, and motivation,\
    \ in most cases thieves will eventually be able to get what they want from your\
    \ application.\n\nA secure application is one that makes certain guarantees to\
    \ the user about the safety of the information contained within that application.\
    \ In addition, a secure application is"
  merge: -1
  img_proc: true
- pgno: 280
  md: 'also one that, if it were to fall into the wrong hands, would not divulge any
    trade secrets or sensitive information by virtue of its own source code.


    The real trick in building secure applications isn’t necessarily making them secure.
    The trick is making them secure and still providing a good user experience. I
    have found that an inverse relationship exists between the ease with which a user
    can interact with your application and the security level of that application.
    Somewhere right in the middle of that curve is a sweet spot where you have enough
    security to be practically secure, and you are still providing a compelling, enjoyable,
    and seamless user experience. Adding more levels of security at this point typically
    involves herculean coding efforts for little noticeable effect, and removing security
    from this point can often compromise the entire application’s security for barely
    noticeable improvements in user experience (UX).


    An example of where making incremental changes to security can dramatically affect
    usability is with CAPTCHAs. CAPTCHAs are those prompts we often see on sites that
    ask us to type in the characters we see in an image. Some of these are fairly
    easy to read for a human, and I have no trouble satisfying the website’s requirement
    that I am not a robot. However, some sites thought that the CAPTCHAs were too
    easy for character recognition software to interpret, so they made the characters
    within the images warped and distorted, and some created hashing effects over
    the top of the characters to further thwart the attempts of “bots” to read these
    characters. The problem is that these characters are now so hard to read that
    I regularly convince sites that I am indeed a robot simply because I can’t read
    the CAPTCHAs. Some let you listen to the CAPTCHAs, but I find the audio recordings
    even harder to interpret. In my opinion, this is the digital form of the childproof
    cap for medications. At some point a certain level of security will annoy your
    legitimate users far more than it deters the illegitimate ones. Many forms of
    software copy protection, including digital rights management (DRM) for multimedia
    files, are often more annoying to the people who actually purchased the item than
    to the ones pirating the items. The last thing you want to do with your application
    is annoy your users.


    The moral of the story is this: If you want to make a secure application, make
    it secure enough to satisfy your users and not a drop more. Every drop of security
    you implement above and beyond what is both *practical* and *acceptable* will
    manifest itself as an annoyance to your users, not a comfort. Different applications
    in different industries and genres will have different “sweet spots,” but taking
    the time and effort to find the right one for your application is well worth it.


    # A Fool and His Money


    Thomas Tusser, an English farmer and writer, once said, “A fool and his money
    are soon parted.” I have my own version of this saying, “A fool and his money
    are soon parted because the fool left his safe unlocked.”


    The world of security, cybercrime, and encryption is full of incredibly complicated
    topics, concepts, and algorithms. With the massive amount of material available
    to both enlighten and confuse developers, learning about security can be a daunting
    task.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'To simplify things and to give you a mental image to carry with you when thinking
    about the security of your own application, consider the following allegory:


    You have a very valuable document that contains various account numbers and other
    pieces of information that, if used by the wrong people, could do a lot of harm.
    You place this document in the glove compartment of your car and lock the door.
    Passengers get in and out of your car and, despite their casual attempts to open
    the glove compartment, none of them see your document. Your friend asks to borrow
    your car and you’re concerned that she could open your glove box and see the private
    document. Instead of telling your friend she can’t borrow your car simply because
    there’s a sensitive document contained within, you give your friend the valet
    key. This key operates the ignition and the trunk, but will not open the glove
    box. Your friend returns the car and you check to see that the sensitive document
    is still safe and secure. Over time you take for granted that your sensitive document
    is safe, snug inside your car. One day you get out of the car for a minute to
    grab a coffee. You leave the keys in the ignition and your car is stolen. The
    thief, who was completely uninterested in your sensitive document, accidentally
    stumbles on it and eventually sees it for its true value. All your efforts to
    lock the document in the glove box, giving your friend the valet key, ended up
    being for nothing because you left your keys in the ignition.


    > A fool and his data are soon parted because he left the keys in the ignition.


    This analogy leads to what is quite possibly the single most important rule of
    securing sensitive data: Never, ever leave sensitive data and the mechanism to
    unlock that data stored on the same physical medium. If your sensitive data is
    in the glove box, don’t ever leave your keys in the car. If your sensitive data
    is inside a combination safe, don’t ever leave the combination to that safe written
    on a post-it note in the same house. If you lock your house and expect it to stay
    that way, don’t leave a spare key under a flowerpot by the front door. If you
    have encrypted data on your windows phone, don’t ever store the encryption key
    on your windows phone. Ever.


    # WP7 Secure by Default


    Out-of-the-box, a host of features built in to the Windows Phone 7 platform provide
    peace of mind for developers and users alike. They include the following:


    +   - Applications are tested, digitally signed, and securely installed on WP7
    devices via the Marketplace. This means malicious applications like the ones that
    plague desktop platforms today can’t make their way onto a device.

    +   - SSL is available for communicating securely with back-end services. This
    gives the developer and user peace of mind knowing that transmitting sensitive
    information to and from the device cannot be “overheard” by malicious applications
    anywhere in the middle.

    +   - Applications run inside a secure sandbox with private, inaccessible isolated
    storage files. Data your application stores in isolated storage can be read only
    by your application.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   - Exchange policies can be used to require phones to enforce a PIN lock
    code and enable remote wiping of devices. This helps in a corporate environment,
    ensuring that employees using WP7 devices have passcode-protected phones that
    can be remotely wiped in case they are lost or stolen.


    On most modern desktop operating systems, you will find some mechanism for managing
    encryption keys. Mac OS X has an application called the Keychain. This application
    serves as a vault in which encryption keys and certificates (which contain key
    pairs) can be stored. Much like the glove box holding an important document, the
    Keychain application is like another glove box, which holds a key to the real
    glove box. Microsoft Windows has a certification store that serves the same purpose.
    Both of these facilities are accessible programmatically through secure APIs.


    Using these APIs, your application can generate a random key and store it in one
    of these secure repositories and freely use this key to encrypt and decrypt data
    (the next section of this chapter discusses encryption). These repositories give
    your applications secure access to the keys without letting anyone (or any application)
    else see them.


    This type of key repository is not available on Windows Phone 7. There is no platform-provided
    secure means by which you can securely store and use encryption keys. In the next
    section on protecting data, I’ll discuss some of the ways you can still safely
    protect data on a Windows Phone 7 device without the aid of a key storage facility.


    # Protecting Data


    For many of the most common application scenarios, the security already provided
    by Windows Phone 7 might be entirely sufficient. Given the relatively small chance
    that someone might steal a phone owned by one of your users and then find a way
    to hijack it (decouple it from Zune and the security around the file system in
    much the same way that iPhones can be “jailbroken”), and then find the isolated
    storage file for your application, many developers are perfectly fine accepting
    that level of risk. This might be because the data their application stores isn’t
    sensitive or their users are okay with that level of risk to their personal information.


    On the other hand, some developers and users might not be okay with this level
    of risk. This could be because the users absolutely insist that it be physically
    impossible for someone to compromise their information or because the type of
    application has compliance regulations that dictate data protection standards,
    such as an application that stores patient medical information.


    So how do we protect data on a Windows Phone 7 device? We already know that we
    can’t securely store the encryption key on the device using some kind of platform-level
    key storage service like the ones available on the desktop OS. Also, thinking
    back to the rules of data security I mentioned earlier in the chapter, we know
    that we can’t store the key in the same physical medium as the data the key protects.
    In other words, I can’t put the encryption key in isolated storage. If both my
    encryption key and my encrypted data are in isolated storage, I’ve gone to all
    that effort of encrypting my data for nothing. This is'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'the equivalent of leaving a spare key under a flowerpot in front of your house.
    If a thief is standing outside your house looking for a way in, the thief is going
    to find your spare key. If a hacker has your isolated storage files, the hacker
    is going to find your encryption key.


    One option might be to assign the application a globally unique ID (GUID). Then,
    when the application needs access to the data, it makes an SSL call to a web service
    with this GUID and gets in return the encryption key. There are two problems with
    this scenario. The first is that now you have to figure out how to secure the
    web service call so that a hacker can’t just get the GUID from your app (remember,
    if they can see your isolated storage, they can see this ID) and make the web
    service call himself. The second is that this is a type of security that I call
    “shell game security.” You aren’t actually adding a level of security, you’re
    just hiding the real security method underneath one of three shells. If a hacker
    gets into the phone and therefore into your isolated storage file, this level
    of indirection will probably only slow him down for an few extra minutes. You
    have to ask yourself if slowing a hacker down for a few minutes is worth days
    or weeks of development effort. It usually isn’t.


    The user experience versus security diminishing returns curve also applies to
    time-to-market. Security features are time-consuming to build and often difficult
    to implement, and you should always ask yourself whether a given feature is worth
    the time spent, especially if it might not actually prevent intrusion.. This would
    be like spending months hand-building a fence around your yard to protect your
    house—except that the fence is only two feet tall.


    The code sample that I’m going to show will ask the user for a password. This
    password is then going to become the key used to encrypt and decrypt application
    data in isolated storage. I call this type of key storage mechanism a “meat key,”
    as in a key that is only found in “meatspace” (that area of the universe inhabited
    by humans as opposed to the Internet). Feel free to reuse that term, I won’t charge
    royalties. Some people call them “passwords,” but I prefer “meat key” when these
    passwords are used specifically for encryption purposes.


    There is a definite trade-off here: We’ve given up a little user experience by
    forcing the users to type a password every time they launch the application. Remember,
    we can’t store that password for convenience because that’s the old “key under
    the flowerpot” problem. This kind of trade-off should be made only if your application
    must have this level of security, or if the users of your application are the
    ones demanding this kind of security. If it was their idea, they’re not likely
    to gripe about having to enter a password. If they choose to store that password
    on a sticky-note attached to their phone, that’s their problem—not yours.


    In this next sample application, we’ll create a single page with a few controls
