- pgno: 74
  md: '# Getting Started with Visual Studio 2010


    The first thing you’re going to need to start building Windows Phone 7 applications
    isn’t the development tools—it’s Windows.


    It might seem strange to you Microsoft developers to include a reminder about
    this, but many iOS and Android developers might not even own a PC, and if they
    do, many Android developers might be running a variant of Linux rather than Windows.


    Fortunately for Apple developers, through the use of tools such as VMWare Fusion
    and Parallels, you can run a fully functional (and licensed) copy of Windows on
    your Mac, allowing you to use both Xcode and Visual Studio side-by-side.


    After you’ve got your copy of Windows and you’re ready to download the Windows
    Phone 7 development tools, open a browser to http://createmsdn.com. This is the
    App Hub, Microsoft’s version of Apple’s iOS Dev Center that you can find at http://developer.apple.com/devcenter/ios.


    This App Hub serves many purposes, including functioning as a starting point for
    documentation, blog rolls, videos, training, as well as entry to the Marketplace
    and other developer activities. To start downloading the tools, click the Download
    the Free Tools—Get Started Now link on the top left of the page.


    The full installation package of the developer tools includes a free Express edition
    of Visual Studio 2010. This IDE includes everything you’ll need to build Windows
    Phone 7 applications. If you already have a full version of Visual Studio because
    you’ve been doing other .NET development, downloading the full installation package
    just augments your existing Visual Studio installation with the WP7 tools.


    Here’s what you get in the free developer tools download:


    +   - Visual Studio 2010 Express—This is the trimmed down, free version of Visual
    Studio 2010. It contains everything you need to write, edit, compile, debug, and
    package your WP7 applications.

    +   - Windows Phone Emulator—This standalone tool allows you to debug WP7 applications,
    including the use of breakpoints, trace logs, and more.

    +   - Silverlight (custom WP7 edition)—A special version of Silverlight is required
    to run the types of WP7 applications that we’ll be building in this book.

    +   - XNA Game Studio 4.0—If you plan to build graphically intensive applications,
    XNA Studio is your tool of choice. This is the same tool that developers use to
    build Xbox applications.

    +   - Microsoft Expression Blend for Windows Phone—This is a Silverlight design
    tool that allows you to graphically design your user interfaces.

    +   - .NET Framework v4.0—This is the underlying runtime that makes all the Windows
    Phone 7, Silverlight, and XNA magic possible.


    After you’ve downloaded the tools, open up Visual Studio and poke around a bit
    to make sure it works. After you’ve familiarized yourself a little bit with the
    tools, go on to the next section and read more about Visual Studio 2010.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Introduction to Visual Studio 2010


    Visual Studio has been around for quite some time; today, developers use it for
    building Windows Phone 7 applications, desktop applications in Windows Forms or
    Windows Presentation Foundation (WPF), web applications with ASP.NET or Silverlight,
    as well as bunch of other project types—even applications written in functional
    programming languages such as F#. In short, Visual Studio isn’t just a WP7 development
    tool. It pretty much builds anything and can probably be configured to make your
    coffee in the morning if you want. (Unfortunately this is just a joke; my repeated
    attempts to get my compiler to also provide me with coffee have met with miserable
    failure.)


    The upside to a tool like that is it can do everything, and it generally does
    everything exceptionally well. The downside to a tool like that is a tool that
    does everything can often be difficult to use or confusing. Hopefully, this section
    of the chapter will take some of the edge of confusion off Visual Studio and get
    you comfortable with the tool you’re going to be using to build lots of incredible
    WP7 applications.


