- pgno: 168
  md: '# Using Toast Notifications


    Throughout the rest of this chapter I will be using a sample premise for an application
    that requires push notification functionality. Hypothetically, let’s assume that
    the zombie apocalypse has indeed arrived. You need to keep informed on who is
    winning the war against the walking dead, and so you have downloaded the “Us Versus
    Them” application for your phone. Now you can be kept up to date when we retake
    cities from the undead or, unfortunately, as human cities fall to the zombie scourge.


    There are three types of push notifications that you can use for your WP7 applications:
    toast, tile, and raw. In this section I show you how to send toast notifications.
    I will be building the “Us Versus Them” application, a web service that I will
    be using to represent the server run by the IT department of the human resistance,
    and a Windows Presentation Foundation (WPF) application that we will use as a
    console to send out notifications to simulate ones that might be sent automatically
    by a full-fledged Zombie Apocalypse Planning Program (ZAPP for short, of course).
    Don’t worry if you don’t know anything about writing web services or WPF applications;
    I’ll keep that code to a minimum so we can concentrate on what you need to do
    on the device to prepare for and respond to push notifications.


    To get started, let’s create a new WP7 application project called Us_vs_Them in
    a solution that I called Chapter12. Before we do anything else, expand the Properties
    node in Solution Explorer underneath the project. Double-click the WMAppManifest.xml
    file. Inside the App element, make sure that you supply a meaningful value for
    both the Publisher and Author attributes. You cannot send push notifications of
    any kind without these in place.


    To prep your application for push notifications, the first thing it needs to do
    is talk to the Microsoft server and obtain a notification channel. This notification
    channel has a unique URI that will be used by your cloud application (in our case,
    a WPF test harness) on which to send notifications.


    After your application has a notification channel, it can then bind that channel
    to different types of notifications. It will always be able to respond to raw
    notifications, but you need to write a few lines of code to bind the channel to
    toast and tile notifications. For the purposes of this section of the chapter,
    we are not going to bind the channel to a tile yet.


    First, open up App.xaml.cs and add the following lines of code below the declaration
    for the RootFrame property. If you press Ctrl+period (.) after typing HttpNotificationChannel,
    Visual Studio automatically adds the corresponding using statement to the top
    of the file:


    ```

    public HttpNotificationChannel NotificationChannel

    { get; private set; }

    private const string NOTIFY_CHANNEL_NAME = "us_vs_them_channel";

    private const string NOTIFY_SERVICE_NAME =

    "www.usversusthemsampleapp.com";

    ```'
