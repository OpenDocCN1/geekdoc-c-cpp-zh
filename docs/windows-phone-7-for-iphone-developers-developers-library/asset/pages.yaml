    <TextBlock Text="Goodbye World"/>

    </StackPanel>

    </Border>

    </Grid>

    ```


    ![](img/04a00d46bb1059867d95707babd62ee7_69_0.png)


    Figure 5.1  Nested layout panels.


    In the preceding example, the outermost element is a Grid. Inside that Grid, we’ve
    got a Border. Within that Border is a StackPanel with several child controls,
    including other StackPanels, another Grid, and a TextBlock. Figure 5.1 shows you
    how all those nested layout panels are measured and arranged to produce an output.
    It’s also worth noting that you can set the content of a Button to a StackPanel,
    which can contain multiple child elements. As you progress throughout this book
    you’ll see more tricks and incredible things you can do with Silverlight and XAML
    and controls, but for the purposes of this chapter, the important thing to note
    here is how the measure-and-arrange process is used on layout panels to produce
    output in a uniform, predictable fashion.


    # Summary


    In this chapter I provided a brief introduction to the layout and rendering system
    used in Silverlight. Deliberately brief, this chapter provides just enough information
    to get you ready to start building full-featured Silverlight user interfaces.
    Knowing the recursive, hierarchical nature of Silverlight layout panels will go
    a long way toward helping you build amazing user interfaces in the future and
    as you read though this book.'
