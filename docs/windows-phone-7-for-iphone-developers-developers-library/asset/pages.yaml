  md: "```\n// clear this so user can hit back and re-tap same item\n}\n}\n```\n\n\
    The “get” accessor is pretty straightforward here. In the setter I trap the condition\
    \ that the value of the selected item changed, but the new value is the same as\
    \ the old. This keeps me from republishing events that don’t need to be published.\
    \ Next, I use an overload of the MVVM Light method RaisePropertyChanged that causes\
    \ a message send to take place, notifying any interested view models that this\
    \ particular property changed. Next I set the SelectedBook property (which in\
    \ turn sets the SelectedItem property on the list box because of two-way binding)\
    \ to null. This allows the user to reselect the same book after tapping the back\
    \ button to go back to the book details page. Without clearing this, users would\
    \ have to tap a different book every time they tap the back button to go to a\
    \ details screen.\n\nSo which view model should respond to this message? In the\
    \ case of the sample application, I’m going to subscribe to this message in the\
    \ CharactersViewModel class. This is because the character view is the first view\
