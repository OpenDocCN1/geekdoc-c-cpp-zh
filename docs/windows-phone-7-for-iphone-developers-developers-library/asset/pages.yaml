- pgno: 26
  md: '```

    // do something, knowing that the value isn''t null

    }

    ```


    In C#, testing for whether a value is null is often a bit trickier than the equivalent
    in Objective-C, so C# programmers out of habit generally make very explicit logic
    statements.


    # Method Calls and Message Passing


    When we start talking about message passing in Objective-C and method calling
    in C#, this is where we really start seeing some fundamental differences in the
    languages.


    In Objective-C, to get an object to do some work for you, you have to send it
    a message. This concept of message passing can be traced directly to Objective-C''s
    Smalltalk heritage.


    In conceptual form, message passing is a much less tightly coupled way of getting
    objects to do work than invoking methods. When you invoke methods in C#, you are
    executing a specific piece of code at that specific time, by invoking whatever
    method matches the signature that you''re calling.


    To indicate that you''re sending a message in Objective-C, you enclose the target
    of the message and all of the parameters to that message in square brackets ([
    and ]), as the following code snippet shows:


    ```

    [car accelerateTo:65 inUnits:MPH withLightsOn:NO];

    ```


    In this example, the car object is said to receive the accelerateTo:inUnits:withLightsOn
    message. What''s interesting here is that the Objective-C runtime does not need
    to know at compile time whether this object will respond to this message. Sure,
    a warning will appear in Xcode if it doesn''t appear as though the object will
    respond, but that will not prevent the code from compiling. In fact, in Objective-C,
    you can add messages to which an object will respond at runtime. In this sense,
    Objective-C is more dynamic than C#.


    The same action, when done as a C# method call, would look something like this:


    ```

    car.Accelerate(65, SpeedUnits.MPH, false);

    ```


    Unlike Objective-C, this method call is statically checked at compile time. If
    a method matching this signature does not exist at compile time, the build will
    fail. There are dynamic extensions to C# that can make this distinction a little
    fuzzy, but they are beyond the scope of this book.


    Both of these are fairly easy to read, although I would definitely make the case
    that the Objective-C message passing syntax, in the hands of a good developer,
    can make for more easily read, self-documenting code.


    Before you get discouraged and start thinking that maybe C# isn''t up to the task
    of building your application, C# 4.0 (both in and out of the WP7 SDK) introduced
    a new but infrequently used feature: named parameters. This allows developers
    to invoke'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'methods C#-style, but to still label the parameters in a way that feels comfortable
    to them as Objective-C developers. You can rewrite the previous method call like
    this:


    ```

    car.Accelerate(mph:65, units:SpeedUnits.MPH, lightsOn:false);

    ```


    In this version of the method call, it is much easier to tell exactly what is
    being passed to the method and what the method expects. Just by using named parameters,
    your code becomes a lot easier to read, and code that’s easier to read is easier
    to maintain.


    # A Note on Conventions and Named Parameters


    I highly recommend that developers who are planning to write code for both environments
    get into the habit of using named parameters when writing their WP7 code. It will
    make the context switching between iOS and WP7 development far less jarring and
    will actually promote a good practice of making your code as self-documenting
    as possible. In short, skip named parameters only for the simplest, most obvious
    of methods. Trust me, when you put down your WP7 project for four weeks to work
    on your iOS project and then come back to a WP7 project without a single named
    parameter, you will want to stab yourself with a rusty, blunt object. So, save
    yourself the trip to the ER and embrace named parameters.


    # Memory Management


    Whenever iOS and .NET developers get into the same room, things typically remain
    civil and often lighthearted for a long time. Then someone mentions that the iPhone
    doesn’t have garbage collection. This is when the steak knives, slings, and USB
    rocket launchers come out and a war begins. Memory management on mobile devices
    is an enormously important topic—and one that is equally important to developers
    of iOS or WP7 applications, regardless of whether the runtime has a garbage collector.


    This section provides a discussion of reference counting—the memory management
    system on iOS devices—and garbage collection, the memory management system on
    WP7 devices. Even if you are a seasoned .NET developer, I highly recommend that
    you read through this section because, as you will see, it is possible to cause
    memory-related application crashes even in a garbage-collected environment.


    # Reference Counting and Object Ownership


    Reference counting is the means by which allocated objects in memory in Objective-C
    are deallocated. One of the core skills of any iOS developer is the ability to
    get a firm grasp of retain/release counts.


    For those of you reading this who don’t know what retain and release mean, they
    are messages that are sent to objects to increase or decrement the reference count.
    When an object wants to take ownership (indicate to the system that it doesn’t
    want said object freed from memory until it specifically says it’s done with it)
    of another object, it sends it the retain message. When it is done with the other
    object, it sends it the release message and, in good practice, the variable is
    set to nil (called nil in Objective-C, null in C#).'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'When your code sends an object the release method and, as a result, the object’s
    reference count reaches zero, the object is free for deallocation. It will be
    removed from memory when its reference count reaches zero.


    This particular type of memory management is a solution to the classic problem
    where two objects are working with the same data in memory and one object finishes
    and disposes of that memory before the other one finishes. With reference counting,
    both objects can safely work with the data, and neither will dispose of the allocated
    memory until the shared object’s reference count reaches zero.


    One big problem with reference counting in iOS is that it can quickly become difficult
    to keep track of which code has been retaining your objects and which code is
    releasing. Something that happens all too often is a memory leak: Objects are
    allocated and retained and never released, either holding into the same memory
    for the lifetime of the application, or worse—continually consuming more and more
    memory until the application crashes. If you have a memory leak in a loop, chances
    are, the application will at some point crash.


    Thankfully, tools that come with the iOS development SDK include tools for tracking
    down memory leaks and out-of-control allocation, and with practice, iOS developers
    can get pretty adept at hunting down and eliminating memory leaks.


    That iOS developers often spend a tremendous amount of time hunting down and eliminating
    problems that stem from retain/release cycles is what causes the knife-wielding
    bar brawl mentioned earlier. iOS developers often think C# developers are lazy
    or write inefficient code because their code is garbage-collected. C# developers
    often think iOS developers are doing everything the “hard way” because they’re
    manually managing reference counts.


    # Garbage Collection


    C# removes the burden of manually maintaining reference counts from the developer.
    When you write code in C# that instantiates classes (you will learn more about
    working with C# classes in the next chapter), you use the new keyword. When your
    code is done with an object, many times you can allow the variable pointing at
    that object to go out of scope, and the garbage collector will eventually take
    care of that object. Take note of that word, eventually, because it will be important
    in the next section on finalization.


    C# uses a managed heap. This is unlike the way heap memory is managed in Objective-C.
    Allocation cost on a management heap is significantly faster than that of a typical
    C runtime heap. The trade-off occurs with the act of garbage collection. Before
    we can understand what happens during garbage collection, we need to understand
    how the runtime knows the difference between good memory and garbage memory.


    With Objective-C, the programmer tells the runtime what is garbage by manually
    decrementing an object’s retain count to zero, which will free the object from
    memory automatically.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The CLR (and through that, C#) does something called *root counting*. Whenever
    you create an object on the managed heap with a strong reference (a variable in
    scope contains a pointer to that new object), the runtime keeps track of that
    instantiation. In memory, it maintains a graph of object roots. So, you could
    have a Car object that has a member variable pointing to a Wheel object, which
    in turn has a member variable pointing to a Brakepad object, and so on. The CLR
    knows that there is a root path from the Car object to the Brakepad object.


    If, while the application is running, the variable `myBrakePad` (which was holding
    the reference to the instance of the `BrakePad` class) is set to null, the object
    to which the `myBrakePad` variable used to point becomes orphaned. In other words,
    there is no longer a root path from any “live” object to that newly orphaned object.
    This means that the object will be garbage collected, *but not necessarily right
    away.*


    At a time of its choosing (an algorithm too complex and out of scope for this
    chapter), the CLR’s garbage collector will make a pass through the managed heap.
    In doing so, it will find the instance of the `BrakePad` class sitting there without
    any roots (no “live” object has a direct or indirect reference to that object).
    This is when the garbage collector will decide to finally dispose of the memory
    associated with that object.


    # Garbage Collection in Depth


    If you really want to know the ins and outs of how the garbage collector works
    in the CLR for Silverlight or the desktop and server runtimes, you should check
    out the following book: *Essential .NET, Volume I - The Common Language Runtime*,
    by Don Box and Chris Sells. It’s an older book, but the coverage it provides on
    how the garbage collector works is unparalleled.


    This is where I think it’s appropriate to pause and try to let some of this sink
    in; C and C++ programmers can often get very confused at this stage because this
    is not how they are used to disposing of memory. It also provides a good lead-in
    to the next section on finalization.


    Garbage collection in the CLR is an asynchronous process that is done completely
    out of band with whatever the application happens to be doing. All effort is made
    to delay a garbage collection event until an appropriate, and hopefully idle,
    moment. However, if the heap is full, the CLR will do a garbage collection (GC)
    pass. GC passes are extremely taxing on the application itself, and performance
    can be degraded considerably during a GC pass.


    The reason I mention this, and stress it so much here, is that when building desktop
    applications with .NET, or even Silverlight applications (which still run on a
    desktop processor with desktop RAM), developers often forget that the garbage
    collector is even there. Things just work, and they often work fairly well, so
    few people stop to think about optimizing their memory usage. This becomes a far
    more important matter for mobile developers, where a particularly long and taxing
    GC pass can cause your app to seize up and stop responding for a second or two.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The following list contains a few things you should keep in the back of your
    mind as you build your WP7 applications to make them as GC-friendly as possible:


    +   - A simple rule of mobile applications: Don’t hold memory you don’t need.
    Don’t create instances of anything unless you need them. This can be a particularly
    hard habit to break if you’re coming from a desktop development world where “objects
    are cheap.”

    +   - Big data is easy to allocate, slow to garbage collect. Always make sure
    you aren’t keeping references around to something your app doesn’t need at the
    moment. By big I don’t just mean size in bytes, I mean graph complexity. If you
    have an object that points to another that points to another and so on, that increases
    the number of roots that need to be tracked, and when this object is collected,
    increases the number of root paths that need to be traversed during a collection
    pass.

    +   - Try to keep churn to a minimum: Don’t instantiate a bunch of things in a
    loop, then set their references to null, and then instantiate a bunch more things.
    By “churn,” I mean the production of a large number of orphaned objects within
    a short period of time. A GC pass with a few thousand small objects can be just
    as taxing as a GC pass over a large object graph.

    +   - Analyze your app. There are a number of tools available within Visual Studio
    (also out of scope of this book, but references and books on the subject abound)
    that allow you to profile your application as well as your application’s heap
    performance. You can even watch when collection passes occur. Don’t skip this
    step. You can delay it while you’re in initial development and prototyping, but
    don’t push an app to the marketplace unless you know your app is playing nice
    with the heap.


    # Cleaning Up After Yourself—Object Finalization


    Finalization is related directly to the act of garbage collection. In languages
    such as C++, objects are disposed of using what is called deterministic finalization.
    All that really means is that when you “free” or “dealloc” an object, it’s gone.
    It disappears at that exact moment in time, and a clean-up method called a finalizer
    is also invoked just before that memory is reclaimed. This is not how the CLR
    and C# work.


    When an object goes out of scope, or when the variable pointing to that object
    is set to null, the object will eventually be garbage collected. You absolutely
    cannot guarantee when an object is going to be disposed, nor can you guarantee
    the order in which it is disposed.


    C# developers often take advantage of an interface known as IDisposable (more
    on interfaces and classes will be discussed in the next chapter). When an object
    implements this interface, it means that its Dispose() method will be invoked
    by the runtime just before the garbage collector reclaims the memory for that
    object. This gives your object a chance to clean up whatever mess it made before
    daddy finds it on the floor with the Legos scattered everywhere.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'I won’t cover too much in this book about building disposable objects, except
    where appropriate in the course of illustrating other examples. If you’re curious
    about how that all works as well as other detailed mechanics of the C# language
    itself, you might want to pick up a copy of *C# 4.0 Unleashed*, by Bart De Smet.


    # Finalization Order


    The runtime doesn’t guarantee the order in which finalization occurs through objects
    that are marked as disposable. Going back to the car object with a pointer to
    a wheel object with a pointer to a brakepad object, you cannot guarantee that
    the brakepad object will be disposed before the wheel object. You cannot even
    guarantee that the car object will be disposed last.


    If you write code that executes when an object is disposed (remember, at some
    arbitrary time after being marked for collection), that code must never access
    member variables that are also going to be disposed, because doing so might “reawaken”
    the member variable, short-circuit the collection process, and prevent the object
    from being collected, creating a memory leak that only an iPhone developer could
    truly appreciate. See, having a managed heap doesn’t mean you can’t crash your
    app with memory problems.


    # Summary


    In this chapter, you got a look at what the core syntax of C# looks like, as well
    as some good background on where Objective-C and C# came from. This chapter discussed
    some of the ways in which these languages are similar and how they differ at the
    lowest levels.


    In the next chapter, we’ll continue the language comparison discussion with a
    look at how both languages deal with various object-oriented programming concepts
    and talk about terminology that might seem confusing at first.'
  merge: -1
  img_proc: true
