    Why am I showing you all of this great stuff about Core Data? Mostly because,
    on a personal level, I am a huge fan of Core Data and have used it extensively
    for applications that I have published in the App Store.


    There is no direct equivalent to Core Data on Windows Phone 7. Upon first hearing
    this, my initial reaction was to jump out a window and end it all right there,
    but after coming to my senses, I took stock of some of the tools developers have
    at their disposal when developing Windows Phone 7 applications:


    +   - WCF’s Data Contract Serializer—Hydrate and dehydrate entire C# object graphs
    quickly and easily and in a file-friendly format.

    +   - LINQ—A rich, language-integrated query engine that makes many of Core Data’s
    ORM (object-relational mapping) features unnecessary in WP7.

    +   - Isolated storage—A powerful, secure, sandboxed region of reusable storage
    allocated to every application that gives developers access to a lightweight file
    store.


    With this in mind, the rest of this chapter is dedicated to illustrating how you
    can store and retrieve data on the phone as well as discussing several reasons
    why you might not want to use local data; we’ll also discuss hybrid approaches
    like smart clients, which are covered in the next chapter. Hopefully by the time
    you reach the end of this chapter, you will come to the same conclusion that I
    did: As good as Core Data is, WP7 doesn’t need an equivalent because the tools
    are already available do the job quite nicely on their own.


    # Reading and Writing Local Data with WP7


    In this next section, I’ll cover the basics of isolated storage and then walk
    you through a sample that uses isolated storage to persist data between executions
    of an application. Regardless of how much data you’re storing, you should always
    be aware of the fact that interacting with isolated storage is a relatively slow
    process. As a result, you should try to'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'time your I/O operations so that they have a minimal impact on the overall
    user experience. Additionally, you might want to avoid using a single file and
    a single “one class to rule them all” approach to your data. Although it might
    make things a little easier for you, it has the side effect of writing a whole
    bunch of data unnecessarily every time a change is made. To compensate for this,
    one technique is to use one file and one object graph (hierarchy of object instances)
    for each logical area of your application. This way, when you write data to disk,
    you’re writing only the data that has changed recently.


    # Isolated Storage 101


    Isolated storage is a quota-enforced, isolated sandbox environment that allows
    applications to create files without introducing risk to the operating system.
    It does this by ensuring that these files are accessible only via API, and not
    directly, and that the physical storage of these files is done securely, preventing
    applications from accessing the isolated storage areas of other applications.


    The primary class for interacting with isolated storage is the IsolatedStorageFile
    class. Despite ending in “file,” it is actually a container capable of holding
    and providing access to both files and directories. It is an interface through
    which you can find files, open files, create files, and so on. The following are
    some of the more important properties and methods of this class:


    +   - **AvailableFreeSpace**— This property represents the amount of free space
    available in isolated storage as seen by the current application.

    +   - **Quota**— This property indicates the maximum amount of space that can
    be consumed by the application in isolated storage.

    +   - **CreateDirectory**— This method creates a directory within the isolated
    store.

    +   - **CreateFile**— Creates a new file in the isolated store.

    +   - **DeleteDirectory**— Removes a directory and its contents.

    +   - **DirectoryExists**— Returns a Boolean indicating whether a particular directory
    (or subdirectory) exists.

    +   - **FileExists**— Returns a Boolean value indicating whether a given filename
    exists in the isolated store.

    +   - **GetDirectoryNames**— Returns a list of directory names in the isolated
    store.

    +   - **GetFileNames**— Returns a list of filenames in the root of the isolated
    store or in a given subdirectory.

    +   - **GetUserStoreForApplication**— One of the most frequently called methods,
    this method returns a user-scoped isolated storage instance.

    +   - **OpenFile**— Opens a file from isolated storage. You can configure the
    mode and access levels of the file being opened.

    +   - **Remove**— Removes the entire isolated storage scope and all its contents.'
