  img_proc: true
- pgno: 133
  md: 'An application bar sits at the bottom (or side, depending on the phone orientation)
    of the UI and provides a few icons that can be tapped to perform some task. In
    addition, when there are more items than can be displayed on the screen at a given
    time, an ellipsis option will appear. When you tap this, it brings up additional
    menu items. Sounds kind of like a tab bar so far, right? Not quite.


    You can have global application bars that show up on the bottom of every page
    or you can have a specific application bar for every page in your application.
    Better still, you can dynamically change the active application bar at runtime
    based on any number of factors. With iOS, you are pretty much limited to the tab
    bar that you configured either at application start up or at design time. The
    tab bar has a very parental, controlling role in the iOS UI, whereas the application
    bar in WP7 works almost like a context menu that, if configured a certain way,
    can provide “tab bar–like” functionality. The key to remember that the application
    bar is incredibly powerful and far more flexible than the iOS tab bar.


    To see what an application bar looks like in action, add the following lines of
    XAML to the bottom of whichever MainPage.xaml you feel like working with (except
    Panoramic or Pivot, both of which specifically should not be combined with application
    bars).


    ```

    <phone:PhoneApplicationPage.ApplicationBar>

    <shell:ApplicationBar IsVisible="True" IsMenuEnabled="True">

    <shell:ApplicationBarIconButton IconUri="/Images/appbar.feature.email.rest.png"

    Text="Button 1"/>

    <shell:ApplicationBarIconButton IconUri="/Images/appbar.feature.search.rest.png"

    Text="Button 2"/>

    <shell:ApplicationBarIconButton IconUri="/Images/appbar.feature.settings.rest.png"

    Text="Button 2"/>

    <shell:ApplicationBarIconButton IconUri="/Images/appbar.feature.video.rest.png"

    Text="Button 2"/>

    <shell:ApplicationBar.MenuItems>

    <shell:ApplicationBarMenuItem Text="MenuItem 1"/>

    <shell:ApplicationBarMenuItem Text="MenuItem 2"/>

    </shell:ApplicationBar.MenuItems>

    </shell:ApplicationBar>

    </phone:PhoneApplicationPage.ApplicationBar>

    ```


    The application bar in the preceding code defines four different icon buttons
    with caption labels and two additional menu items. As the screenshots in Figures
    9.5 and 9.6 show, these menu items appear when you tap the ellipsis and expand
    the application bar.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/04a00d46bb1059867d95707babd62ee7_134_0.png)


    Figure 9.5  Application bar in its default state.


    ![](img/04a00d46bb1059867d95707babd62ee7_134_1.png)


    Figure 9.6  Application bar with menu items expanded.'
