- pgno: 156
  md: '# Summary


    This chapter started off with an overview of common system services that are provided
    by most modern smartphones, including the iPhone and Windows Phone 7. Following
    that, we took a tour through the choosers and launchers that are available to
    Windows Phone 7 applications. Finally, we closed out the chapter by exploring
    some of the hardware services available to our applications, such as the accelerometer,
    the GPS, and even an FM radio tuner.


    If you have been reading the book straight through up to this point, you should
    now have a very good understanding of the capabilities and power available to
    Windows Phone 7 applications, how to harness those capabilities, and how to present
    them to users with WP7 Silverlight user interface elements.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# Introduction to Application Tiles\n\n> *Imagination is more important than\
    \ knowledge. For knowledge is limited, whereas imagination embraces the entire\
    \ world, stimulating progress, giving birth to evolution.*\n> \n> Albert Einstein\n\
    \nThis chapter, although short, provides a useful introduction to programming\
    \ application tiles for Windows Phone 7. No direct correlation exists between\
    \ the concept of a Windows Phone 7 application tile and some concept on an iPhone\
    \ or an iPad. As you read this chapter, you will see what role the application\
    \ tiles fill, how they encompass multiple areas of functionality that exist in\
    \ iOS, and how they provide some features that don’t exist in iOS.\n\nThis chapter\
    \ also provides an overview of how to manipulate these tiles without push notifications,\
    \ the subject of the next chapter. Finally, at the end of this chapter I will\
    \ show you how to do some fancy tricks on a server to get around some of the limitations\
    \ of tiles and create incredibly compelling tiles without sending a single push\
    \ notification.\n\n# What Is a Tile?\n\nAfter you slide away your home screen\
    \ when you unlock or turn on your Windows Phone 7 device, the first thing you\
    \ see is a collection of tiles. This collection is scrollable and should, in general,\
    \ contain your most frequently used applications. As shown in Figure 11.1, Microsoft\
    \ gives you some tiles out of the box for dealing with things like the phone,\
    \ people (including social networks like Facebook), messaging, email, pictures,\
    \ gaming (Xbox Live), and Internet Explorer."
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/04a00d46bb1059867d95707babd62ee7_158_0.png)


    Figure 11.1 A home screen filled with application tiles.


    These tiles have two main purposes. The first is to provide you with an easy target
    to tap to launch your most popular applications. You can think of this as the
    mobile equivalent of having a shortcut to an application on your desktop or in
    your system tray (or your Dock on Mac OS X). Second, these tiles provide meaningful
    summary information that you can use to decide whether you want to launch the
    application.


    For example, the phone tile displays how many calls you have missed or voicemails
    you have waiting. The messaging tile tells you how many unread text messages you
    have. The Outlook tile tells you how many unread emails you have. If the information
    on these tiles changes, you can use the easy-to-read tile surface to make a decision
    about whether you want to launch the application. Another sample might be a weather
    tile that displays the current temperature on top of a background image representing
    the current weather conditions. This gives you the most important information
    you might need about the weather, and if you want details, you can tap the tile
    to launch the full weather application.


    What you don’t see in Figure 11.1 is that application tiles written by non-Microsoft
    developers (that’s probably you) can have a background image and a numeric badge
    that appears superimposed on the background image. This gives your tile the capability
    to notify users that items within your application might need their attention.
    This next section shows you how to create your own tiles and discusses some of
    the limitations and quirks about working with them.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Creating Your First Tile


    Tiles are easy to create. In fact, the developer doesn’t have to do anything to
    create them, because the act of creating a tile is entirely up to the end user.
    All the developer has to do is tell the application manifest which background
    image and title text should be used in case a user creates a tile for the developer’s
    application.


    To see how this works, create a new Windows Phone 7 application. Right-click the
    project in the Solution Explorer and choose Properties. Scan down the property
    page to the last few items, and you will see where the application’s tile properties
    are defined. You can choose the background image (one is supplied for you by the
    default WP7 application template) and the tile’s title text. The text you supply
    here has to be short enough to display on the bottom of a tile. Change the text
    to whatever you like, and then run the application.


    With the application running in the emulator, hit the Start (the flying window)
    button. Now go to the applications list (the right-arrow at the top right of the
    screen). Left-click and hold on the title of the application you just created.
    You will be presented with two options, as shown in Figure 11.2: Pin to Start
    and Uninstall.


    ![](img/04a00d46bb1059867d95707babd62ee7_159_0.png)


    Figure 11.2 Holding finger/button down on an application.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'If you choose Pin to Start when prompted, the emulator takes you back to the
    home screen, and there you will see your tile. If you do not have any other tiles
    installed, your screen might look something like the one in Figure 11.3.


    ![](img/04a00d46bb1059867d95707babd62ee7_160_0.png)


    Now when users unlocks their device, they will see a nice big tile for your application.
    They can tap this tile to launch the application or launch the application manually
    by using the right arrow and clicking the application’s title in the list that
    appears.


    The default background that comes with the new application template is a 173x173
    24-bit PNG file. When creating your own background images for your applications,
    you must stick to this convention. Home screen tiles (at least those created by
    regular non-Microsoft developers) are always the same size and must never exceed
    80KB in size.


    # Working with Tile Schedules


    Many applications will be satisfied using the tile surface as nothing more than
    a large icon; a place for branding and a super-large hit target for fingers to
    tap. However, depending on the type of application you’re writing, you might want
    to do more than that. You might want to make your application tile somewhat dynamic.
    Note that I say somewhat here, because we’ll talk about how to make your tile
    much more dynamic in the next chapter when I talk about push notifications.


    Tile schedules are at the mercy of the phone itself. You can create an instance
    of a tile schedule that will cause your application tile to update once, every
    week, every day, or'
  merge: -1
  img_proc: true
- pgno: 161
  md: "every hour. You can also set a maximum number of occurrences. This allows you\
    \ to update your application tile once every day for three days and other interesting\
    \ combinations.\n\nTo update your application tile every day until the application\
    \ is removed, you can create a schedule as follows:\n\n```\nShellTileSchedule\
    \ schedule = new ShellTileSchedule();\nschedule.Interval = UpdateInterval.EveryDay;\n\
    schedule.Recurrence = UpdateRecurrence.Interval;\nschedule.RemoteImageUri = new\n\
    \    Uri(\"//www.myserver.com/myapp/tile.png\");\nschedule.Start();\n```\n\nThe\
    \ preceding code will change the application’s background tile to whatever the\
    \ image is that resides at www.myserver.com/myapp/tile.png every day. When during\
    \ that day is up to the phone. If the phone is locked or the screen is off when\
    \ the update should occur, the update will occur immediately whenever the phone\
    \ screen is activated next.\n\nThe next thing that you should pay attention to\
    \ is the RemoteImageUri property. This property doesn’t use the word “remote”\
    \ just for the heck of it. You cannot specify the URI of an image that was deployed\
    \ within your Application’s XAP file (iPhone developers should think of XAP files\
    \ as functionally equivalent to Bundles). In short, if you plan to update your\
    \ application tile’s background image, no matter how you plan to update that image,\
    \ you’re going to need to store that image on a publicly available server.\n\n\
    You might think that the restrictions on these background images are a little\
    \ too severe. However, keep in mind that a nearly unlimited number of developers\
    \ will have applications that can be pinned as tiles. If these tiles are allowed\
    \ to update as fast as the developer wants them to, not only will the overall\
    \ user experience of the tile screen degrade to the point of utter chaos, but\
    \ the phone’s resources (including battery life!) will be sucked dry attempting\
    \ to keep up with these rapidly refreshing tiles. By enforcing these fixed interval\
    \ types and requiring that the tile images be reachable over the public Internet,\
    \ Microsoft is ensuring that everybody’s tiles will be able to play nice with\
    \ all the other tiles.\n\nEven with these restrictions in place, you can still\
    \ do some creative things with tile update schedules. For instance, you can use\
    \ an immediate schedule change in response to a button click to allow users to\
    \ personalize the background image for their tile.\n\nSuppose you have written\
    \ a game for the phone. In this game, through player actions, the player can become\
    \ good or evil. To indicate whether the player is currently good or evil on the\
    \ application’s tile, you can create a schedule that runs immediately and changes\
    \ the background image to either a good or an evil background.\n\nThe following\
    \ bit of code shows how two different run-once, immediate schedules can be created\
    \ that will change the background image of the application tile:\n\n```\nprivate\
    \ void buttonGood_Click(object sender, RoutedEventArgs e)\n{\n    ShellTileSchedule\
    \ schedule = new ShellTileSchedule();\n```"
  merge: -1
  img_proc: true
- pgno: 162
  md: "```\nschedule.Recurrence = UpdateRecurrence.Onetime;\nschedule.StartTime =\
    \ DateTime.Now.AddMinutes(1);\nschedule.RemoteImageUri = new Uri(\"//localhost/good.png\"\
    );\nschedule.Start();\n}\n```\n\n```\nprivate void buttonEvil_Click(object sender,\
    \ RoutedEventArgs e)\n{\n    ShellTileSchedule schedule = new ShellTileSchedule();\n\
    \    schedule.Recurrence = UpdateRecurrence.Onetime;\n    schedule.StartTime =\
    \ DateTime.Now.AddMinutes(1);\n    schedule.RemoteImageUri = new Uri(\"//localhost/evil.png\"\
    );\n    schedule.Start();\n}\n```\n\nThis code block doesn’t show the using statements,\
    \ but it is worth pointing out that the ShellTileSchedule class is part of the\
    \ Microsoft.Phone.Shell namespace, and the preceding code won’t compile without\
    \ that using statement at the top of the file. If you’re using the code downloads\
    \ and not typing as you go, you don’t have to worry about this.\n\nAfter the schedule\
    \ executes in due time, the application tile will change to reflect the current\
    \ alignment of the player toward good or evil. Figure 11.4 shows the application\
    \ tile after I’ve clicked the “I am evil” button within the application and then\
    \ exited the application.\n\n![](img/04a00d46bb1059867d95707babd62ee7_162_0.png)\n\
    \nFigure 11.4 Application tile after being modified by a tile schedule.\n\n# A\
    \ Caveat About Tile Schedules\n\nOne thing that you need to remember as you work\
    \ with tiles and their schedules is that the schedules are not precise. To prevent\
    \ the phone from consuming too many resources while updating the background images\
    \ of the tiles, there is a one-hour timer in charge of executing the schedules.\
    \ This means that even if your schedule is set to run immediately, it could take\
    \ up to 60 minutes before it actually runs, even in the emulator. If you absolutely\
    \ need your tile to update more frequently than every hour, you will need to use\
    \ push notifications, which are explained in the next chapter. To debug your schedule\
    \ changes, you are going to spend a lot of time sitting around waiting. Make sure\
    \ you have some coffee and something else fun to do nearby before testing your\
    \ schedules."
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Using Remote Background Images


    Up to this point, you might still be complaining (or worse, I know how programmers
    get) that you don’t have enough control over the tile image. From what we’ve seen
    so far, the only way you can add any kind of dynamic nature to the tile background
    image is through the use of a tile schedule. Even when you have a tile schedule,
    the background images are limited to static images that are located out on the
    Internet somewhere—or are they?


    As a famous, anonymous cat-hater once said, “There’s more than one way to skin
    a cat.” The key concept is that although the URI pointing to the image for the
    tile background might need to be fixed at the time the schedule executes, the
    actual content of that image can be generated on-demand by the server.


    To see how this might work, let’s take a few examples of how to “beat the system.”
    In other words, how you can create dynamic application tile backgrounds even though
    the Windows Phone 7 SDK won’t let you do so directly on the phone.


    One of the simplest examples might be a weather application. When you run the
    full weather application, you get all kinds of animated content, including radar
    maps and wind speed and direction. But, for the weather application’s tile, you
    want to display the current temperature on top of a background that shows the
    type of weather conditions. If you have seen the Windows 7 desktop weather widget
    or even the weather widget for the OS X Dashboard, this concept should be fairly
    familiar to you.


    Because the URI pointing to the remote image background cannot change (unless
    you discard the old update schedule and update it with a new one, as in the earlier
    good versus evil example), one way around this might be to use a URI that indicates
    the ZIP Code of the user. For example, you might point the remote URI to http://www.myapp.com/weather/90210.png.
    The server, whether ASP.NET, PHP, Ruby, Java, or any other framework, can then
    extract the ZIP Code from the URI and use that to dynamically render an image
    containing the current temperature and weather conditions.


    Another option more closely related to what might be on my Windows Phone would
    be a zombie apocalypse monitor. Let’s say the zombie apocalypse has begun and
    you, the digitally connected consumer that you are, need to keep tabs on who is
    winning the war. To do this, you’ve downloaded and installed an application that
    has a tile that updates every hour. Every hour the image changes and shows the
    current world population of humans and the world population of zombies. To make
    this happen, all you really need is a single URL (such as http://www.myapp.com/us_vs_them.png)
    that is generated periodically on the server, and a cached version of that image
    is served up to every mobile device that requests it.


    As you can see, all it takes is a little creativity and some knowledge of server-side
    programming, and you can create dynamic, compelling, visually appealing tile images.
    Although you can’t achieve the custom, animated effects that you see in the People
    and Xbox Live tiles that ship with the phones, you can get pretty close with clever
    use of schedules (or push notifications) and server-generated images.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Summary


    iOS doesn’t have a concept equivalent to application tiles. Application icons
    in iOS have a badge count that displays a little white-on-red number superimposed
    on top of an application icon. This functionality is similar to the way that application
    tiles can have counts appear over top of the image (you’ll see how to do this
    in the next chapter).


    This is where the similarity between iOS application icons and Windows Phone 7
    application tiles ends. Windows Phone 7 tiles can have their background images
    updated on a schedule or in response to push notifications. These schedules are
    incredibly flexible and can be everything from once per hour to once every week
    for a six-week period.


    This chapter provided you with a basic overview of how users create these tiles
    by pinning applications to the start area. In addition, I took you on a tour through
    using and manipulating tile schedules. Finally, I discussed a few server-side
    techniques that you can use to get around some of the limitations to the dynamic
    nature of application tiles. This chapter provided you with a good foundation
    so that you can extend your knowledge of application tiles in the next chapter
    by learning how to manipulate those tiles with push notifications.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# Using Push Notifications\n\n> *The single biggest problem in communication\
    \ is the illusion that it has taken place.*\n> \n> George Bernard Shaw\n\nThis\
    \ chapter provides you with an introduction to push notifications and their implementation\
    \ on Windows Phone 7 devices. *Push notifications* are a facility that allow servers\
    \ hosted publicly on the Internet (or “in the cloud” as people like to call it\
    \ these days) to send messages directly to applications installed on mobile devices,\
    \ oftentimes even when those applications are not currently running or active.\n\
    \nThe underlying implementation of push notifications between Microsoft and Apple\
    \ differs greatly in the details, but the overall goals are the same. Push notifications\
    \ allow your application to be kept up to date on information that is changing\
    \ in the cloud without having your application waste a bunch of bandwidth and\
    \ other resources by constantly polling a remote URL and asking the question,\
    \ “Is there anything new yet?” This type of behavior is as annoying to a server\
    \ as the kids in the back seat constantly yelling “Are we there yet?” are to a\
    \ driver. Sometimes the server just wants to shout, “I’ll tell you when we get\
    \ there!” Push notifications allow the server to do just that, and a happy server\
    \ is a good server.\n\nThis chapter provides you with all the information you\
    \ need to start delivering push notifications to your Windows Phone 7 applications,\
    \ as well as information to allow you to compare and contrast the experience with\
    \ Apple’s Push Notification Service (APNS).\n\n# Review of Apple Push Notification\
    \ Services (APNS)\n\nWhen push notifications were originally made available to\
    \ iPhone developers, they were hailed as the answer to the fact that multitasking\
    \ was not available on the phone. Even though iOS 4 introduced a form of multitasking,\
    \ push notifications are no less important,"
  merge: -1
  img_proc: true
- pgno: 166
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 167
  md: 'As a side note that is particularly important to developers, push notifications
    do not work in the iOS simulator. In other words, you cannot test push notifications
    without provisioning a test device.


    # WP7 Push Notifications Overview


    For Windows Phone 7 development, the process of registering for, sending, and
    receiving push notifications is significantly easier. The main reason for this
    is the lack of certificates. Anyone who has done a fair amount of work with certificates,
    especially if he works on multiple machines, probably has far less hair today
    than before he started working with those certificates.


    When your WP7 application starts, it talks to Microsoft’s notification back-end
    to get what Microsoft calls a notification channel. This notification channel
    has a unique URI. Every application on every WP7 device talking to the notification
    back-end gets a unique notification channel URI. When your service (yes, you still
    need a service on the Internet that is capable of sending notifications to devices)
    sends a notification, it delivers it directly to the URI given to your application
    when it acquired a notification channel. Microsoft code listening on this URI
    then sends the push notification down to the device securely.


    One of the many things that I like about this method of sending push notifications
    is that Microsoft has been able to secure all aspects of the transmission of notifications
    without requiring developers to hand-code certificate loading and signature methods
    into their applications. There are certificates and secure transmissions involved,
    but they’re done by Microsoft on your behalf. The other thing that I like about
    WP7 push notifications is that they work in the emulator. This means you can debug,
    test, and refine your push notification code without ever having to tether a device
    or provision certificates from a web portal. This also means that I can get push
    notifications working in my application and then hand the code to another member
    of my team to test on a different machine, and things will work without me having
    to export private keys between team workstations.


    Figure 12.1 shows a high-level overview of the push notifications system. This
    figure is from the online Microsoft documentation on WP7 push notifications and
    can be found at http://msdn.microsoft.com/en-us/library/ff402558(v=VS.92).aspx.


    ![](img/04a00d46bb1059867d95707babd62ee7_167_0.png)


    Figure 12.1 Push notifications overview diagram (Microsoft).'
