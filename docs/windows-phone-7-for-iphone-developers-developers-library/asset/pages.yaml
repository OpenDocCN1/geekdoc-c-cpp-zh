    # Namespaces Versus Naming Conventions


    As you have been going through the samples in this chapter, you might have noticed
    that the C# classes always exist within a namespace. Namespaces in C# are designed
    specifically to avoid naming collisions as well as to aid in organizing hierarchies
    of logically connected classes, enums, and structs.


    In Objective-C and throughout all of Apple’s libraries, either for the iPhone
    or for traditional Mac development, you will see that there are no namespaces.
    The decision was made for Objective-C to not support the concept of namespaces
    (which are available in many OOP languages, including C# and C++). Instead, Apple
    has opted for a standard by which classes belonging to a particular family, purpose,
    product, or company all begin with a common two-letter prefix in all capital letters.


    For example, a combatant class written by someone named Kevin Hoffman might actually
    be called KHCombatant rather than simply Combatant. Further, that same class written
    by a company called Exclaim Computing might be written as ECCombatant or XCCombatant.


    Naming collisions within iOS applications are rare because you will encounter
    these collisions only if your application is making use of a library, framework,
    or class that contains classes named identically to yours. The rare chances of
    naming collisions in this situation are usually eliminated with the use of the
    two-letter prefix naming convention.


    # Extending Other People’s Classes


    The last topic I want to cover in this chapter is the capability to extend classes
    written by other developers or companies without actually having the source code
    to those classes. Keep in mind that in both iOS and C#, extensions to third-party
    classes can access only class members and methods to which your code would normally
    have access. In other words, you cannot use class extensions to circumvent encapsulation
    methods surrounding private or protected members.


    C# gives us a facility called static extensions, which is roughly analogous to
    the concept of categories in the Objective-C world. When a static extension to
    a specific class is in scope of the current code block, that code block can invoke
    methods on the extension class as if those methods actually belonged to the original
    class.


    Let’s assume that we didn’t write the Combatant class and that it’s sealed and
    we cannot inherit from it. We want to be able to add a method to the Combatant
    class that makes the object move in a square, as if it was square dancing. Perhaps
    this effect is a custom spell that can be cast on our combatants that gives them
    an irresistible urge to get their hoedown on.'
