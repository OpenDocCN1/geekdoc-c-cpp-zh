  md: 'making web service calls!" they plead. "There’s no way to test this code in
    isolation!" they whine. These are all actually very productive responses to the
    attempt to write unit tests. When you hear yourself saying any of these things,
    you know you’ve got some refactoring to do. You need to refactor your code so
    that it is mockable.


    A mockable class is one that has loose coupling with its dependencies. In an ideal
    world, all dependent functions are performed by classes that conform to an interface
    or contract. In an even more ideal world, the implementation of these dependencies
    is supplied at run-time to the class through a constructor, through a property,
    or in many cases, through an Inversion of Control (IoC) framework such as Castle
    Windsor or Microsoft Unity.


    An IoC framework’s job is to look at a class, see all the dependencies (properties
    or constructor parameters that conform to interfaces that are referenced in configuration
    files), and inject an appropriate implementation of that dependency. These frameworks
    can often be configured to inject real implementations at runtime and mock implementations
    at test time.


    Because, at the time of this book’s writing, I have been unable to get a Dependency
    Injection or Inversion of Control framework working properly on Windows Phone
    7 due to its limitations with Reflection, we have to create our mocks the old
    fashioned way: code them.


    Suppose you want to create unit tests for a class called TaxHandler. This class
    takes a product Stock Keeping Unit (SKU) and a delivery ZIP code and gives back
    a decimal amount indicating the sales tax to be charged for that item.


    As a first knee-jerk reaction, we might create a class called TaxHandler. Inside
    this class, it contains a web service proxy called InventoryClient that talks
    to the inventory service to get full pricing information. In addition, another
    web service proxy called TaxClient talks to the company’s internal tax service
    and gets sales tax rates for particular ZIP codes. The TaxHandler class invokes
    both of these clients in the ComputeTax method that takes a product SKU and a
    ZIP code.


    When we write a unit test for this application, we might manually go figure out
    what the sales tax rate is for ZIP code 90210, figure out the tax on a product
    that costs $99.99, and then run the ComputeTax method. Our assertion would be
    that the return values match the expected values. Being good little developers,
    we would then write two more tests: one that verifies that the wrong values won’t
    match the actual output (for example, we deliberately set our expectations wrong
    and assert failure, which creates a passing test) and one test that takes completely
    bogus parameters such as an invalid ZIP code. Our assertion here is that an exception
    gets thrown. When said exception is thrown, our test passes.


    We run our tests and, after a small delay, we get a green light. So what’s wrong?
    We got a green light, so we’re good under the “red, green, refactor” rule, right?
    Wrong. Every time we execute this test, we’re making two network calls to two
    different web services. Our purpose in testing the ComputeTax method isn’t to
    test the web services, it’s only to test that the ComputeTax method calls those
    web services with the parameters we indicate. This is a little hard to swallow
    at first. The purpose of unit testing is to test each small'
