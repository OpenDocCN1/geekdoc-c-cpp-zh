- pgno: 234
  md: "```\npublic string Title\n{\n    get\n    {\n        return title;\n    }\n\
    \    set\n    {\n        title = value;\n        RaisePropertyChanged(\"Title\"\
    );\n    }\n}\n\npublic string Description\n{\n    get\n    {\n        return description;\n\
    \    }\n    set\n    {\n        description = value;\n        RaisePropertyChanged(\"\
    Description\");\n    }\n}\n\nprivate void InitializeCommands()\n{\n    // when\
    \ someone uses a context menu to delete THIS book,\n    // broadcast a message\
    \ so any affected viewmodels\n    // can handle it (e.g the global book list)\n\
    \    RemoveBookCommand = new RelayCommand(\n        () =>\n            Messenger.Default.Send<RemoveBookMessage>(\n\
    \                new RemoveBookMessage(this)));\n}\n}\n```\n\nRelayCommand is\
    \ a class that comes with the MVVM Light framework. This class provides a wrapper\
    \ for code that will be executed when the command is executed. In addition, it\
    \ also provides a wrapper for code that will be executed to determine whether\
    \ a command is executable. When you bind regular buttons to commands, they will\
    \ run the custom code in the RelayCommand that returns a true or false. When the\
    \ code returns false, the button will be disabled."
