    \n# Core Data on the iPhone\n\nCore Data has long been a valuable part of the\
    \ Apple developer’s toolbox, existing long before the first iPhone was ever sold.\
    \ Core Data is a broad framework that provides more than a façade in front of\
    \ a database.\n\nCore Data provides a nice logical abstraction of data storage.\
    \ As the developer, you define entities, attributes that belong to those entities,\
    \ and you define relationships between other entities. Unlike other low-level\
    \ data modeling tools, you don’t create foreign keys and map the ID column of\
    \ some table to the ID column of another table. The design surface of Core Data,\
    \ as shown in Figure 14.1, allows for modeling at a higher (and many believe,\
    \ far easier and better) level.\n\nAs you can see from the figure, Core Data supports\
    \ a robust array of features, including object inheritance, many-to-many relationships,\
    \ many-to-one, lookups, and so on. One thing many developers really like about\
    \ Core Data is that you don’t see any primary keys in the preceding diagram, nor\
    \ do you see any internal IDs that might be required to establish the “sightings”\
    \ relationship between Monsters and instances of the Sighting entity."
