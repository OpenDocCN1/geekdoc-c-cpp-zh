- pgno: 72
  md: '# Chapter 6 From Xcode to Visual Studio


    To further add power, functionality, and potential confusion for new developers,
    a single Xcode project can have multiple targets. Indeed, developers create targets
    for unit testing (I''ll mention unit testing again in a later chapter), and a
    very common scenario is using a single Xcode project to produce different targets
    for iPhone and iPad. This is because the iPad''s UI is so different from the iPhone''s
    (and it includes controls that don''t exist on the iPhone). Developers will build
    different UIs but share the same controller and back-end code within the same
    Xcode project.


    The Xcode UI is much like any other IDE, such as Eclipse, MonoDevelop, or Visual
    Studio. In the layout (my personal preference) shown in Figure 6.1, the left side
    of the view is a navigation pane. This pane shows you the main node, the project
    root. Double-clicking this (called FortuneBuilders in the screenshot because that''s
    the name of the project I was working on at the time) brings up the project settings
    dialog. Below the project node you have a bunch of folders, some of which are
    created for you by Xcode. One thing that iOS developers are familiar with is that
    the folder structure within Xcode does not necessarily match the folder structure
    on disk. Files sitting in the Classes folder are often sitting in the main project
    directory alongside the files sitting in the Controllers directory. This often
    confuses developers familiar with Visual Studio, which actually does have a 1:1
    mapping between project folders and disk folders.


    ![](img/04a00d46bb1059867d95707babd62ee7_72_0.png)'
