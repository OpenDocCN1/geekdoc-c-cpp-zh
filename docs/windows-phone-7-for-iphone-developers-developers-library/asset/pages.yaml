    If you’re curious, the code you’re looking at in that screenshot is from a table
    view controller that displays a list of YouTube videos that were downloaded by
    accessing the Google Data feed for a particular YouTube user’s uploaded videos.
    The code in the screenshot shows some of the code necessary to crack open the
