    Then you might provide your own delegate code that responds to various button
    presses on your alert view. As you can see, for standard alert messages, the MessageBox
    class is easier and simpler to use.


    Figure 8.1 illustrates what happens when you tap the title of this application.


    ![](img/04a00d46bb1059867d95707babd62ee7_98_0.png)


    Figure 8.1 A message box displayed in response to tapping a TextBlock.


    As you progress through the book, you will see a variety of things you can do
    with the seemingly basic and primitive TextBlock control. Remember that you can
    style virtually all aspects of any control, including the rendering color, and
    even create custom special effects that attach to any visual element.


    # Accepting User Input with TextBoxes


    Most applications are not read-only displays. At some point you will probably
    have to break down and actually ask your users for some input, whether you like
    it or not. To do that, you’re going to need a TextBox. As its name says, a TextBox
    is a box in which a user can supply text.


    The user does this in one of two ways. The first, which is available on all Windows
    Phone 7 devices, is through the use of the onscreen soft keyboard. When a user
    taps inside'
  merge: -1
  img_proc: true
- pgno: 99
  md: "the region of a TextBox, the keyboard will appear, allowing the user to enter\
    \ text by tapping on the virtual keys. The second method is through an actual\
    \ hard keyboard that is available only if the user has purchased a phone with\
    \ a physical keyboard. At the time of the Windows Phone 7 launch, several manufacturers\
    \ had slide-out keyboards, and one even had slide-out speakers (but only a touchscreen\
    \ keyboard).\n\nWhether a user is typing on a real keyboard or a virtual touch-screen\
    \ keyboard, the TextBox control accepts the input the same and isolates the developer\
    \ from having to write custom code to handle both situations.\n\nAdd the XAML\
    \ code from Listing 8.3 below the last TextBlock from Listing 8.1 to create a\
    \ new label and a text box for entering text.\n\n# Listing 8.3 Adding a Label\
    \ and TextBox\n\n```\n<TextBlock x:Name=\"ApplicationTitle\"\n    Text=\"SAMPLE\
    \ APPLICATION\"\n    Style=\"{StaticResource PhoneTextNormalStyle}\"/>\n<TextBlock\
    \ x:Name=\"PageTitle\"\n    Text=\"This is a test\"\n    Margin=\"9,-7,0,0\"\n\
    \    MouseLeftButtonUp=\"PageTitle_MouseLeftButtonUp\"\n    Style=\"{StaticResource\
    \ PhoneTextTitle1Style}\"/>\n\n<TextBlock x:Name=\"SampleLabel\"\n    Text=\"\
    Enter some text:\" />\n<TextBox x:Name=\"SampleTextBox\" />\n```\n\nNow change\
    \ the code for the “single tap” event handler on the page title to the code shown\
    \ in Listing 8.4 and the modal dialog box that appears will contain the text the\
    \ user supplied in the text box rather than the fixed title of the page.\n\n#\
    \ Listing 8.4 Reading Text Property of a TextBox\n\n```\nnamespace BasicControls\n\
    {\n    public partial class MainPage : PhoneApplicationPage\n    {\n        //\
    \ Constructor\n        public MainPage()\n        {\n            InitializeComponent();\n\
    \        }\n\n        private void PageTitle_MouseLeftButtonUp(object sender,\n\
    \            MouseButtonEventArgs e)\n        {\n            MessageBox.Show(\"\
    You tapped the page title, \" +\n```"
