- pgno: 126
  md: "```\n{\n    // if the door isn't \"open\", don't shut it.\n    if (gridPlaneProjection.RotationY\
    \ == 90)\n        closeDoorStoryBoard.Begin();\n    }\n}\n```\n\nTry the application\
    \ out now and watch how the grid from MainPage.xaml swings out of the way and\
    \ then, when done swinging away, navigates to Page1. The animation is allowed\
    \ to complete because we don't perform the actual navigation until the animation\
    \ is finished by subscribing an anonymous delegate to the Completed event. Anonymous\
    \ delegates used this way with the lambda (=>) syntax are analogous to the use\
    \ of Blocks in Cocoa for the Mac and in newer versions of the iOS SDK. The syntax\
    \ should actually look somewhat familiar if you've used some of the new Blocks-based\
    \ method calls in the iOS SDK.\n\nBefore moving on to the next section, play around\
    \ with the configuration of the 3D perspective transform to change the way the\
    \ UI appears and reappears. The CenterOfRotationX, CenterOfRotationY, and CenterOfRotationZ\
    \ properties of the PlaneTransform all start off with default values of 0.5, placing\
    \ the rotation in the center of the UI element. By shifting the CenterOfRotationX\
    \ value to 0.0, when the animation spins the UI element around the X axis, it\
    \ does so on the far left of the object. If we set the same center of rotation\
    \ to 1.0, the rotation would occur on the far right side of the object (and we'd\
    \ have to change the rotation angles to maintain the appearance of a door opening).\n\
    \n# A Note on Storyboards and Double Animations\n\nLong before the folks at Disney\
    \ or Pixar or any other animation company sit down and start churning out smooth,\
    \ fluid animations, they need to produce what is commonly called a storyboard.\n\
    \nA storyboard, in the traditional sense, is a big board stuck up on a wall where\
    \ the animators and other crew sketch out how all the characters in the movie\
    \ are going to act. It often looks like a comic book, showing the various key\
    \ frames that illustrate the flow of animation. Another important point to remember\
    \ about storyboards is that at any given time, multiple characters and objects\
    \ can be moving in many directions. Rarely will you ever see a (well made) cartoon\
    \ where everything in the scene stands absolutely still while one character moves.\n\
    \nIn the Silverlight and Windows Phone 7 sense, a storyboard is a collection of\
    \ animations that will all start in parallel. I say “start” because it is possible\
    \ (and actually quite regular) that the animations started by a storyboard do\
    \ not finish at the same time.\n\nThink of the various UI elements in your XAML\
    \ as characters or actors in a scene. In this scene, your actors are going to\
    \ move in such a way that they produce a pleasing and informative motion clip\
    \ for your viewers (the people using your application)."
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The storyboard lets you plot out exactly which elements will be moving, how
    fast they are moving, where they are moving, and so on.


    The animations contained within a storyboard can be anything from simple animations
    that change one property from a source value to a target value to complex animations,
    such as key frame animations, where you indicate what a property’s value should
    be at specific time markers.


    The animations I used in the preceding example are double animations, which animate
    a property of type double from a source value to a target value over a specific
    period of time.


    # Migrating from Tab Bar Applications


    In iOS applications, the tab bar control is an extremely common control that shows
    up in thousands of applications in the App Store. The purpose of this control
    is to segment an application into categories or provide quick, shortcut-style
    access to particular pieces of the application’s functionality. When there are
    more tabs than can be displayed on a single bar, a More button appears, which
    brings the user to a table view displaying the list of the remaining tabs. Tapping
    on any of the tabs launches the view controller associated with that particular
    tab.


    Although Windows Phone 7 doesn’t have its own exact replica of the Tab Bar control,
    WP7 developers have plenty of options for building UIs that serve the same purpose
    as the Tab Bar control. These include the Pivot control, the Panorama control,
    and finally the Application Bar control. The following sections cover each of
    these controls respectively and how they support “tab bar-like” functionality.


    # Using the Pivot Control


    The Pivot control is an incredibly powerful control but also just as easy to use.
    A Pivot has a title and then a series of PivotItem child controls. Each of these
    PivotItem controls contains a XAML hierarchy of visual elements that can be anything
    from list boxes to buttons to whatever you like.


    When the Pivot control first appears, the first pivot item is visible, and the
    title of the second pivot item is visible at the top of the Pivot control next
    to the first. Tapping the title of the second pivot item will pivot or slide the
    focus from the first pivot item to the second. This continues until you reach
    the last pivot item where the title of the first pivot item appears, allowing
    you to continuously move through the items without having to worry about using
    the back button.


    One of the places you will see the Pivot control used extensively is Outlook for
    WP7. You can “pivot” between different views of your mail and, when used in your
    application, you can pivot between different categories of information or different
    areas of functionality within your application.'
  merge: -1
  img_proc: true
