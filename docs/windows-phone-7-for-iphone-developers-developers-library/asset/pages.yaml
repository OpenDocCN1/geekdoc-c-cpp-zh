- pgno: 33
  md: "# Object-Oriented Programming\n\n> Certainly not every good program is object-oriented,\
    \ and not every object-oriented program is good.\n> \n> Bjarne Stroustrup\n\n\
    This chapter will cover some of the core concepts of object-oriented programming\
    \ (OOP) and how they apply to both iPhone and Windows Phone 7 programming. Regardless\
    \ of the type of application you plan to write, or the platform on which you plan\
    \ to write it, you will need to utilize and understand some basic object-oriented\
    \ principles and concepts.\n\nMost developers are already familiar with concepts\
    \ such as inheritance, contract-based (interface) programming, members, methods,\
    \ encapsulation, and more. However, those concepts each have different implementations\
    \ and even different terminology on different platforms. This chapter will help\
    \ clear things up and show you how the core tenets of OOP are implemented in iOS\
    \ and WP7.\n\n# Why OOP?\n\nIf you're reading this book, you probably do not need\
    \ to be convinced that object-oriented programming is a good thing. However, as\
    \ the chapter quote from Bjarne Stroustrup so eloquently puts it—not all OOP is\
    \ a good thing. Like any tool, if used inappropriately, it can make a royal mess\
    \ of any well-intentioned project.\n\nWe create classes as a way to group logically\
    \ related data and behavior that's all geared toward performing a certain task.\
    \ When these classes are written properly, they exemplify the benefits of OOP:\
    \ increased reuse and the creation of testable, reliable, predictable applications\
    \ that are easy to build, easy to maintain, and easy to change.\n\nOn mobile devices,\
    \ we have classes that encapsulate information and behaviors for all kinds of\
    \ things from reading GPS coordinates, to displaying text, to accepting input.\
    \ Without a carefully architected suite of classes that abstract all the capabilities\
    \ of a device, we would never be able to rapidly and reliably produce software\
