    \nAs you can see, the amount of code required to consume RESTful web services—whether\
    \ they belong to Twitter,YouTube, RSS, or your own custom service—is very small.\
    \ Windows Phone 7 gives your application the capability to talk to web services\
    \ quickly, easily, efficiently, and asynchronously so that you can perform that\
    \ communication without negatively affecting the user experience.\n\nAs a reader\
    \ exercise, take the code from the sample application that comes with the code\
    \ for this chapter and extend the pivot item for the tweets so that it fetches\
    \ the source user's Twitter icon from the Web and displays it at the top of the\
    \ page. As a hint, a few chapters back I showed you how to dynamically set the\
    \ contents of an Image control to a byte array. Learning new technologies isn't\
    \ about remembering syntax; it's about putting different techniques together to\
    \ create amazing applications. The code I've given you in this chapter can serve\
    \ as a catalyst for some pretty cool applications; all you need is a little imagination\
    \ and patience.\n\n# Consuming WCF Services\n\nIf you happen to be fortunate enough\
    \ to be writing both the client- and the server-side of your smart client application,\
    \ you might actually want to pass on using traditional RESTful services. Although\
    \ the RESTful architecture is an elegant one and it is great for providing cross-platform\
    \ functionality without incurring any language or platform-specific dependencies,\
    \ sometimes there are more practical options. In the case of building both the\
    \ server and the Windows Phone 7 application, if you are building the server using\
