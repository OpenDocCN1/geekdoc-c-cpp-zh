  md: "# Migrating from Navigation Bars\n\n```\n```xml\n<TextBlock x:Name=\"ApplicationTitle\"\
    \nText=\"MY APPLICATION\"\nStyle=\"{StaticResource PhoneTextNormalStyle}\"/>\n\
    <TextBlock x:Name=\"PageTitle\"\nText=\"Main Page\"\nMargin=\"9,-7,0,0\"\nStyle=\"\
    {StaticResource PhoneTextTitleStyle}\"/>\n</StackPanel>\n<!--ContentPanel - place\
    \ additional content here-->\n<Grid x:Name=\"ContentPanel\" Grid.Row=\"1\" Margin=\"\
    12,0,0,0\">\n<StackPanel>\n<Button\nx:Name=\"navigateButton\"\nClick=\"navigateButton_Click\"\
    \ Height=\"75\">\n<TextBlock Text=\"Click to Navigate to Page 1\" />\n</Button>\n\
    </StackPanel>\n</Grid>\n</phone:PhoneApplicationPage>\n```\n```\n\nNow modify\
    \ MainPage.xaml.cs so that it looks like the code shown in Listing 9.2.\n\n# Listing\
    \ 9.2 MainPage.xaml.cs—Animated Page Transitions\n\n```\n```csharp\npublic partial\
    \ class MainPage : PhoneApplicationPage\n{\n\t// Constructor\n\tpublic MainPage()\n\
    \t{\n\t\tInitializeComponent();\n\t}\n\tprivate void navigateButton_Click(object\
    \ sender, RoutedEventArgs e)\n\t{\n\t\topenDoorStoryboard.Completed +=\n\t\t\t\
    (s, ev) =>\n\t\t\t{\n\t\t\t\tNavigationService.Navigate(\n\t\t\t\t\tnew Uri(\"\
    /Page1.xaml\", UriKind.Relative));\n\t\t\t};\n\t\topenDoorStoryboard.Begin();\n\
    \t}\n\tprotected override void OnNavigatedTo(\n\t\tSystem.Windows.Navigation.NavigationEventArgs\
    \ e)\n\t{\n\t}\n}\n```\n```"
