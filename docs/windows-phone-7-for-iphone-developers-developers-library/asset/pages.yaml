  md: "```\nreturn IsoStoreHelper.ReadGraphFromFile<[]>(\"books.dat\");\n}\n}\n```\n\
    \nRemember the IsoStoreHelper class we wrote a couple chapters ago? It's going\
    \ to come in very handy for the implementation of our service provider. Now that\
    \ we have a service provider, we need to make sure that each of our view models\
    \ is given a proper reference to this service provider without violating any concerns.\
    \ This sounds like an ideal job for the ViewModelLocator class, which is responsible\
    \ for creating instances of new view models. I've modified this class so that\
    \ it hands a reference to a service provider instance in each of the view model\
    \ constructors (which means I've also modified the view model constructors to\
    \ expect objects of type IMnemuseServiceProvider as a constructor parameter).\n\
