- pgno: 88
  md: 'If another person on my team checked out the code (which includes the annotated
    XAML) from our source control repository, he would then be able to see my feedback
    and respond to it (hopefully without using foul language). One caveat here is
    that I have found that the presence of these annotations in a WP7 project can
    cause the built-in Visual Studio design surface to occasionally hiccup and be
    unable to render the UI. This has no effect on whether the application will run
    properly, but it can be annoying. I suggest not using annotations unless you and
    your team are planning to use Blend for your primary design surface, and the design
    surface is either off or minimally used within Visual Studio.


    # Blend Tutorial—Working with Visual States


    In this section of the chapter I’m going to walk you through a simple Blend tutorial
    by starting fresh with a new WP7 application. This should give you some familiarity
    with the application and hopefully teach you a little something about an often
    underrated feature of Silverlight controls: the Visual State manager.


    Visual states are, as the name implies, different states in which a control can
    be. These states are visual because the end user can visually tell the difference
    between those states. Stock controls come with their own built-in set of states,
    but you can also create your own states at the control- or even page-level.


    For example, the standard Button control has several states already defined, including:
    Normal, MouseOver, Pressed, and Disabled. Don’t worry about MouseOver, that’s
    a holdover from the fact that WP7 is actually Silverlight under the hood, and
    the desktop version of Silverlight supports mouse movement. There is no finger
    gesture on a Windows Phone 7 device that can simulate the mouse-over movement
    because the device doesn’t know where your finger is until you actually tap the
    screen.


    The truly awesome thing about these visual states is that not only can you supply
    your own styles for each of these states, but you can also control the transition
    between these states. If you wanted to, you could make a button rotate between
    the Normal and Disabled states, making the button flip over and bounce a little
    and do a little “death” animation when it transitions into the Disabled state.
    Although there might not be much cause for this kind of thing, knowing that you
    can do it without writing your own custom Button control can come in quite handy.


    In this tutorial, we’re going to make a button that has a different style for
    the Pressed state. In a stock WP7 application, the button style is either white-on-black
    or black-on-white. When you press (tap) down on the button, it inverts this style.
    For example, if your UI is configured in “dark” mode, the normal button state
    is white-on-black and when you tap down on it, it flips to black-on-white. I want
    to make it so that tapping on my button switches to a green background color.


    To get started, create a new WP7 project in Visual Studio. In Visual Studio, click
    the File menu item; then click New, Project. From here, click the Silverlight
    for Windows Phone category on the left and make sure Windows Phone Application
    is selected on the right. Type in a name for the project, and then click OK.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'After the project has been created, click the Project > Open in Expression
    Blend menu item. If it takes a few seconds to load up Blend, don’t worry. The
    first time you launch Blend might be slow, even on a powerful computer with a
    fast hard drive.


    Next we need to add a button. Expand the Assets pane by clicking the right-facing
    chevron (it looks like two greater-than signs: >>) in the far left toolbar. Go
    to the Categories section on the left and click Panels. Click and hold on the
    StackPanel icon and then drag the mouse pointer to the Grid control named ContentPanel.
    When you let go, a StackPanel will have been added to the Grid. Next, create a
    button inside this StackPanel. To do this, make sure the StackPanel is highlighted
    and double-click the Button shortcut on the left toolbar. Make sure you give this
    Button a name by setting the name in the Properties pane on the right side of
    the editor.


    Now right-click the Button (either in the Objects and Timeline pane or the visual
    button itself on the design surface) and choose Edit Template; then left-click
    Edit a Copy. Click OK when prompted to create a style resource. This will allow
    you to visually edit the control’s template.


    Now switch to the States tab in the top pane (the one that normally has the Projects
    tab selected). Inside the Objects and Timeline pane for the current control template,
    select ButtonBackground. You will then see all the prebuilt visual states for
    this control, as shown in Figure 7.6.


    ![](img/04a00d46bb1059867d95707babd62ee7_89_0.png)


    Figure 7.6 Changing visual states of stock controls.


    Click the Pressed state and you’ll see a message that Blend is now recording properties
    for the Pressed state. This means that while you are recording for this state,
    any property change made to the control or any of its nested properties will be
    saved as part of that visual state. We can now change the Background and BorderBrush
    properties of the button in this state without affecting those properties in the
    Normal or Disabled states.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'At this point you can save your work and run the application by clicking Project,
    Run, or pressing the F5 key. Running the application will launch the Windows Phone
    7 simulator. This simulator provides you with a very close representation of what
    your application might look like and how it might behave on an actual device.


    The first time you launch an application after your computer starts up, it will
    take some time for the WP7 simulator to start. After it has done its initial startup,
    you can leave it running between debug sessions. This will cut down on the time
    it takes to start debugging your application.


    After a few seconds of the simulator doing its initialization, your application
    will appear. Because the default Button control knows to put itself into the Pressed
    state when someone taps on the control, you don’t need to do any of that plumbing
    yourself. Because we’ve just styled the visual state, our new button will now
    turn green with an orange border when someone taps it.


    When you’re done playing with this new button, take a look at the XAML inside
    MainPage.xaml (you can see this XAML by going back into Visual Studio and double-clicking
    the file) at the top in the newly created resource dictionary:


    ```

    <Style x:Key="FancyButtonStyle" TargetType="Button">

    <Setter Property="Background" Value="Transparent"/>

    <Setter Property="BorderBrush"

    Value="{StaticResource PhoneForegroundBrush}"/>

    <Setter Property="Foreground"

    Value="{StaticResource PhoneForegroundBrush}"/>

    <Setter Property="BorderThickness"

    Value="{StaticResource PhoneBorderThickness}"/>

    <Setter Property="FontFamily"

    Value="{StaticResource PhoneFontFamilySemiBold}"/>

    <Setter Property="FontSize"

    Value="{StaticResource PhoneFontSizeMediumLarge}"/>

    <Setter Property="Padding" Value="10,3,10,5"/>

    <Setter Property="Template">

    <Setter.Value>

    <ControlTemplate TargetType="Button">

    <Grid Background="Transparent">

    <VisualStateManager.VisualStateGroups>

    <VisualStateGroup x:Name="CommonStates">

    <VisualState x:Name="Normal"/>

    <VisualState x:Name="MouseOver"/>

    <VisualState x:Name="Pressed">

    <Storyboard>

    <ObjectAnimationUsingKeyFrames

    Storyboard.TargetProperty="Foreground"

    Storyboard.TargetName="ContentContainer">

    <DiscreteObjectKeyframe KeyTime="0"

    Value="{StaticResource PhoneBackgroundBrush}"/>

    ```'
  merge: -1
  img_proc: true
