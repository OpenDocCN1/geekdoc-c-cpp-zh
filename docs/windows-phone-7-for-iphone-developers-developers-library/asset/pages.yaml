    \ playerId);\n\n    [OperationContract]\n    void AddToTeam(string teamId, string\
    \ playerId);\n\n    [OperationContract]\n    GameProfile TeamStartGame(string\
    \ teamId);\n\n    [OperationContract]\n    void TeamQuitGame(string teamId);\n\
    }\n}\n```\n\nKeep in mind that this is a random sample just to illustrate some\
    \ basic concepts and should certainly not be used as a model for a real gaming\
    \ lobby service.\n\nWindows Phone 7 does not come with any lobby or matchmaking\
    \ capabilities built into the SDK. The XNA Development Studio provides access\
    \ to abstractions that borrow Xbox Live’s lobby and matchmaking facilities; however,\
    \ you need to be a full Xbox Live"
