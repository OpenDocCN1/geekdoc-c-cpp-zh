    \ Grid.Row=\"1\" Margin=\"12,0,12,0\">\n<Border BorderBrush=\"AliceBlue\" BorderThickness=\"\
    2\">\n    <StackPanel>\n        <TextBlock Text=\"Hello\"/>\n        <TextBlock\
