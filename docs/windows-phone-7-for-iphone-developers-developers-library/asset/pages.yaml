- pgno: 67
  md: 'When learning Windows Phone 7 or Silverlight programming for the first time,
    a lot of developers have trouble adjusting to the XAML syntax. If you keep in
    mind as you learn that XAML is just an XML substitute for C# instantiation, the
    learning curve might be a little less steep.


    In this next section, you’ll learn how Silverlight takes the objects you instantiate
    with XAML (or with C# behind the scenes) and creates the rich, touch-responsive
    UI that makes Windows Phone 7 such a great platform.


    # Introduction to Silverlight Layout and Rendering


    The goal of any UI subsystem is to get things displayed on the screen as quickly
    as possible and respond to user events related to things on the screen just as
    quickly. Silverlight for Windows Phone 7 is no different. It is designed to render
    as quickly and efficiently as possible while still allowing for rapid response
    to user-generated events such as touches, swipes, and double-taps.


    Often when developers talk about rendering systems, they tend to lump together
    the concepts of the layout engine and the rendering engine. In Silverlight, layout
    and rendering are two different activities and we really should avoid grouping
    them together into a single “do everything” engine.


    Whereas everything in an iOS UI can have its roots traced to a UIView of some
    kind, all the visual components of a Silverlight user interface derive from the
    UIElement class. This base class forms the top of the class hierarchy for just
    about everything a user will see in a Windows Phone 7 application. It is at the
    UIElement level that objects have the beginnings of animation properties, the
    capability to detect user interaction with the element, and the capability to
    be measured and arranged.


    # The Two-Pass Mantra: Measure and Arrange


    Understanding the two-pass method for laying out Silverlight controls is crucial
    to your ability to effectively build any UI more complex than a simple “Hello
    World” application.


    The following sentence is probably the single most important rule to remember
    when trying to figure out how your UI is going to render: Silverlight renders
    from innermost element out, bottom-most element up; measure first then arrange.


    Every UI element in a tree is measured in the order I mentioned (innermost element
    out, bottom-most element up). These elements are asked for their desired size
    by having their Measure method invoked. When this method is invoked, the UI element
    should then update its DesiredSize property.'
  merge: -1
  img_proc: true
- pgno: 68
  md: "that the end result of the measure-arrange process is different depending on\
    \ the type of layout container performing the process.\n\nFor example, the elements\
    \ contained within a Grid control are laid out according to the row-and-column\
    \ layout defined by column and row definitions and the assignment of UI elements\
    \ to specific rows and columns. Elements contained within a StackPanel are laid\
    \ out sequentially, either horizontally or vertically. A single element (which\
    \ can itself be a layout panel) contained within a Border simply appears surrounded\
    \ by a border.\n\nRegardless of the layout mechanism used by the parent panel,\
    \ the measure-arrange process is still invoked in the same fashion.\n\nTo recap,\
    \ the Measure pass is where the desired size of each element is determined, and\
    \ the Arrange pass is where each child element's size and position are finalized.\n\
