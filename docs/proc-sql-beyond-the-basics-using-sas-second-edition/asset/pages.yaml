- pgno: 241
  md: "# SQL Code\n\n```\nPROC SQL;\n    ALTER TABLE PRODUCTS\n        MODIFY PRODCOST\
    \ FORMAT=DOLLAR12.2;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    ALTER\
    \ TABLE PRODUCTS\n        MODIFY PRODCOST FORMAT=DOLLAR12.2;\nNOTE: Table WORK.PRODUCTS\
    \ has been modified, with 5 columns.\nQUIT;\nNOTE: PROCEDURE SQL used:\n     \
    \ real time          0.33 seconds\n```\n\n# Changing a Column’s Label\n\nYou can\
    \ modify a column’s label information with the ALTER TABLE statement MODIFY clause.\
    \ Because the label information is part of the descriptor record, changes to this\
    \ value have no impact on the data itself. Suppose that you want to change the\
    \ label that corresponds to the product cost (PRODCOST) column in the PRODUCTS\
    \ table so that when printed it displays “Retail Product Cost”.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    ALTER TABLE PRODUCTS\n        MODIFY PRODCOST LABEL=\"Retail\
    \ Product Cost\";\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    ALTER\
    \ TABLE PRODUCTS\n        MODIFY PRODCOST LABEL=\"Retail Product Cost\";\nNOTE:\
    \ Table WORK.PRODUCTS has been modified, with 5 columns.\nQUIT;\nNOTE: PROCEDURE\
    \ SQL used:\n      real time          0.00 seconds\n```\n\n# Renaming a Column\n\
    \nThe SQL procedure provides an ANSI approach to renaming columns in a table.\
    \ By specifying the SELECT clause in the CREATE TABLE statement, you can rename\
    \ columns, although it can be tedious if a large number of columns exist in the\
    \ table. The next example illustrates a SELECT clause in a CREATE TABLE statement\
    \ being used to rename the ITEM column to ITEM_PURCHASED in the PURCHASES table.\
    \ As the following example illustrates, you should refrain from specifying the\
    \ same table name in the CREATE TABLE statement as is specified in the FROM clause.\
    \ Recursive references to the target table can cause data integrity problems."
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 220 PROC SQL: Beyond the Basics Using SAS, Second Edition




    ```

    PROC SQL;

    CREATE TABLE PURCHASES AS

    SELECT CUSTNUM, ITEM AS ITEM_PURCHASED, UNITS, UNITCOST

    FROM PURCHASES;

    QUIT;

    ```




    ```

    PROC SQL;

    CREATE TABLE PURCHASES AS

    SELECT CUSTNUM, ITEM AS ITEM_PURCHASED, UNITS, UNITCOST

    FROM PURCHASES;

    WARNING: This CREATE TABLE statement recursively references the target table.
    A consequence of this is a possible data integrity problem.

    NOTE: Table WORK.PURCHASES created, with 7 rows and 4 columns.

    QUIT;

    NOTE: PROCEDURE SQL used (Total process time):

    real time 0.41 seconds

    cpu time 0.02 seconds

    ```


    An alternative approach to renaming columns in a table consists of using the RENAME=
    SAS data set option in a SELECT statement’s FROM clause. Suppose that you want
    to rename ITEM in the PURCHASES table to ITEM_PURCHASED. In the next example,
    the RENAME= SAS data set option can be specified in one of two ways, as illustrated
    below. Either approach is syntactically correct.




    ```

    PROC SQL;

    SELECT *

    FROM PURCHASES (RENAME=ITEM=ITEM_PURCHASED) ;

    QUIT;

    ```


    < or >




    ```

    PROC SQL;

    SELECT *

    FROM PURCHASES (RENAME= (ITEM=ITEM_PURCHASED) ) ;

    QUIT;

    ```'
