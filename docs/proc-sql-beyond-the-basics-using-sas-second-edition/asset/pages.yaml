  md: "| Option | Description |\n|---|---|\n| _RSLV | Displays a tree structure in\
    \ the SAS log that consists of before-and-after early semantic checks. |\n| _SUBQ\
    \ | Displays subquery transformations as a tree structure in the SAS log. |\n\
    | _UTIL | Displays a breakdown in the SAS log of each step defined in the procedure\
    \ including each row’s buffer length, each column by name, and the column position\
    \ with each row (or offset). |\n\n# Macro Variables\n\nTo assist with the process\
    \ of troubleshooting and debugging problematic coding constructs, PROC SQL assigns\
    \ values to three automatic macro variables after the execution of each statement.\
    \ The contents of these three macro variables can be used to test the validity\
    \ of SQL procedure code as well as to evaluate whether processing should continue.\n\
    \n# SQLOBS Macro Variable\n\nThe SQLOBS macro variable displays the number of\
    \ rows that are processed by an SQL procedure statement. To display the contents\
    \ of the SQLOBS macro variable in the SAS log, specify a %PUT macro statement.\
    \ The following example retrieves the software products from the PRODUCTS table\
    \ and displays SAS output with a SELECT statement. The %PUT statement displays\
    \ the number of rows processed and sent to SAS output as four rows.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        WHERE PRODTYPE='Software';\n\
    \    %PUT SQLOBS = &SQLOBS;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n\
    \    SELECT *\n        FROM PRODUCTS\n        WHERE PRODTYPE='Software';\n   \
    \ %PUT SQLOBS = &SQLOBS;\nSQLOBS = 4\nQUIT;\n```\n\nThe next example shows two\
    \ new products inserted in the PRODUCTS table with an INSERT INTO statement. The\
    \ %PUT statement displays the number of rows added to the PRODUCTS table as two\
    \ rows."
