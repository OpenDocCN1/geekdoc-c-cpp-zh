    \ Table WORK.NOT_SO_HOT_PRODUCTS has been dropped.\n    QUIT;\nNOTE: PROCEDURE\
    \ SQL used:\n        real time            0.00 seconds\n```\n\n# Deleting Tables\
    \ That Contain Integrity Constraints\n\nAs previously discussed in this chapter,\
    \ to ensure a high-level of data integrity in a database environment, the SQL\
    \ standard permits the creation of one or more integrity constraints to be imposed\
    \ on a table. Under the SQL standard, a table that contains one or more constraints\
    \ cannot be deleted without first dropping the defined constraints. This behavior\
    \ further safeguards and prevents the occurrence of unanticipated surprises such\
    \ as the accidental deletion of primary or supporting tables.\n\nIn the next example,\
    \ the SAS log shows that an error is produced when an attempt to drop a table\
