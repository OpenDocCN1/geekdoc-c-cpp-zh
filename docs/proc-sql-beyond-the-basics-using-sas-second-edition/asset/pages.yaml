- pgno: 55
  md: "computed column from being assigned a temporary column name similar to _TEMAxxx.\
    \ The name assigned with the AS keyword is also used as the column header on output,\
    \ as shown below.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n    \
    \    PRODTYPE,\n        PRODCOST * 0.80 AS Discount_Price FORMAT=DOLLAR9.2\n \
    \   FROM PRODUCTS\n        ORDER BY 3;\nQUIT;\n```\n\n# Results\n\n| Product Name\
    \ | Product Type | Discount_Price |\n| Analog Cell Phone | Phone | $28.00 |\n\
