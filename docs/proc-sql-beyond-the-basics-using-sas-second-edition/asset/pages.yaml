    # Constraints and Change Control


    To preserve change control, SAS prohibits changes or modifications to a table
    that contains a defined referential integrity constraint. When you attempt to
    delete, rename, or replace a table that contains a referential integrity constraint,
    an error message is generated and processing stops. The next example illustrates
    a table copy operation that is performed against a table that contains a referential
    integrity constraint that generates an error message and stops processing.


    # SAS Log Results


    ```

    PROC COPY IN=SQLBOOK OUT=WORK;

    SELECT INVENTORY;

    RUN;


    NOTE: Copying SQLBOOK.INVENTORY to WORK.INVENTORY (memtype=DATA).

    ERROR: A rename/delete/replace attempt is not allowed for a data set involved
    in a referential integrity constraint. WORK.INVENTORY.DATA

    ERROR: File WORK.INVENTORY.DATA has not been saved because copy could not be completed.

    NOTE: Statements not processed because of errors noted above.

    NOTE: PROCEDURE COPY used:

    real time          0.44 seconds

    cpu time           0.02 seconds

    NOTE: The SAS System stopped processing this step because of errors.

    ```


