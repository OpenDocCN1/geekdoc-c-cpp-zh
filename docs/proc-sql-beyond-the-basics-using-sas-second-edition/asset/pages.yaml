    # Building Macro Tools and Applications


    The macro facility, combined with the capabilities of the SQL procedure, enables
    the creation of versatile macro tools and general purpose applications. A principle
    design goal when developing user-written macros should be that they are useful
    and simple to use. It is best to avoid using a macro that does not meet your needs
    or that has a name that is complicated and hard to remember.


    As tools, macros should be designed to serve the needs of as many users as possible.
    They should contain no ambiguities, consist of distinctive macro variable names,
    avoid the possibility of naming conflicts between macro variables and data set
    variables, and not try to do too many things. This utilitarian approach to macro
    design helps gain widespread approval and acceptance by users.


    # Creating Simple Macro Tools


    Macro tools can be constructed to perform a variety of useful tasks. The most
    effective macros are those that are simple and perform a common task. Before embarking
    on the construction of one or more macro tools, explore what processes are currently
    being performed, and then identify common users’ needs with affected personnel
    by addressing voids. Once this has been accomplished, you will be in a better
    position to construct simple and useful macro tools that will be accepted by users.


    Suppose that during an informal requirements analysis phase you identified users
    who, in the course of their jobs, use a variety of approaches and methods to create
    data set and variable cross-reference listings. To prevent unnecessary and wasteful
    duplication of effort, you decide to construct a simple macro tool that can be
    used by all users to retrieve information about the columns in one or more SAS
    data sets.


    # Cross-Referencing Columns


    Column cross-reference listings are useful when you need to quickly identify all
    of the SAS library data sets that a column is defined in. Using the COLUMNS dictionary
    table (for more information, see Chapter 2, “Working with Data in PROC SQL”),
    a macro can be created that captures column-level information including column
    name, type, length, position, label, format, informat, indexes, as well as a cross-reference
    listing that contains the location of a column within a designated SAS library.
    In the next example, the COLUMNS macro consists of a PROC SQL query that accesses
    any single column in a SAS library. If the macro was invoked with a user-request
    consisting of


    ```

    %COLUMNS(WORK, CUSTNUM);

    ```'
