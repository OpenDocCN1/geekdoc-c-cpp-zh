- pgno: 150
  md: "```\nEND AS Product_Classification\nFROM PRODUCTS\n)\nWHERE Product_Classification\
    \ = 'Software';\nQUIT;\n```\n\n# Results\n\n| Product Name | Product Number |\
    \ Product_Classification |\n|---|---|---|\n| Spreadsheet Software | 5001 | Software\
    \ |\n| Database Software | 5002 | Software |\n| Wordprocessor Software | 5003\
    \ | Software |\n| Graphics Software | 5004 | Software |\n\n# Simple CASE Expression\
    \ in a WHERE Clause\n\nIn the previous section, we examined the syntax and application\
    \ of simple CASE expressions in a SELECT clause. In this section, we’ll explore\
    \ the syntax and application of simple CASE expressions in a WHERE clause. Because\
    \ the SQL procedure supports the use of a CASE expression anywhere an expression\
    \ can be used, we’ll learn that a query can benefit from the capabilities of passing\
    \ a result value from a CASE expression directly to a WHERE clause in place of\
    \ a hardcoded value.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT MANUNAME,\n \
    \       MANUSTAT\n    FROM MANUFACTURERS\n    WHERE CASE MANUSTAT\n        WHEN\
    \ 'CA' THEN 1\n        ELSE 0\n    END;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 151
  md: "# Results\n\n| Manufacturer Name | Manufacturer State |\n|---|---|\n| Global\
    \ Comm Corp | CA |\n| Storage Devices Inc | CA |\n| KPL Enterprises | CA |\n|\
    \ San Diego PC Planet | CA |\n\n# Creating a Customized List with a Simple CASE\
    \ Expression\n\nA customized display and order can be coded using a simple CASE\
    \ expression in a SELECT and ORDER BY clause. The following example illustrates\
    \ a unique way to create a list of products and availability by coding individual\
    \ Case logic for each product in the PRODUCTS table. The resulting output displays\
    \ a value of “1” to indicate that it contributed to the output list, or a value\
    \ of “0” to indicate that it didn’t contribute to the output list.\n\n# SQL Code\n\
    \n```\nOPTIONS LS=120;\nPROC SQL;\nSELECT PRODNAME,\n    PRODCOST,\n    CASE PRODTYPE\
    \ WHEN 'Laptop'      THEN 1 ELSE 0 END\n        AS LaptopRequest,\n    CASE PRODTYPE\
    \ WHEN 'Workstation' THEN 1 ELSE 0 END\n        AS WorkstationRequest,\n    CASE\
    \ PRODTYPE WHEN 'Phone'       THEN 1 ELSE 0 END\n        AS PhoneRequest,\n  \
    \  CASE PRODTYPE WHEN 'Software'    THEN 1 ELSE 0 END\n        AS SoftwareRequest\n\
    FROM PRODUCTS\nORDER BY CASE PRODTYPE WHEN 'Laptop'      THEN 1 ELSE 0 END,\n\
    \    CASE PRODTYPE WHEN 'Workstation' THEN 1 ELSE 0 END,\n    CASE PRODTYPE WHEN\
    \ 'Phone'       THEN 1 ELSE 0 END,\n    CASE PRODTYPE WHEN 'Software'    THEN\
    \ 1 ELSE 0 END;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Results\n\n| Product Name | Product Cost | LaptopRequest | WorkstationRequest\
    \ | PhoneRequest | SoftwareRequest |\n|---|---:|---:|---:|---:|---:|\n| Wordprocessor\
    \ Software | $299.00 | 0 | 0 | 0 | 1 |\n| Graphics Software | $299.00 | 0 | 0\
    \ | 0 | 1 |\n| Spreadsheet Software | $299.00 | 0 | 0 | 0 | 1 |\n| Database Software\
    \ | $399.00 | 0 | 0 | 0 | 1 |\n| Office Phone | $130.00 | 0 | 0 | 1 | 0 |\n| Digital\
