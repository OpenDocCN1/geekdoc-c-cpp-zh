- pgno: 318
  md: '# Introduction


    In previous chapters, the examples assumed that each table had a physical existence,
    that is, the data stored in each table occupied storage space. In this chapter,
    let’s turn our attention to a different type of table structure that has no real
    physical existence. This structure, known as a virtual table or view, offers users
    and programmers an incredible amount of flexibility and control. This makes views
    an ideal way to look at data from a variety of perspectives and according to different
    users’ needs. Unlike tables, views store no data and have only a “virtual” existence.
    You will learn how to create, access, and delete views as you examine the many
    examples in this chapter.


    # Views—Windows to Your Data


    Views are one of the more powerful features available in the SQL procedure. They
    are commonly referred to as “virtual tables” to distinguish them from base tables.
    The simple difference is that views are not tables, but instead are files that
    consist of executable instructions. As a query, a view appears to behave as a
    table with one striking difference—it does not store any data. When referenced,
    a view always produces up-to-date results just like a table does. So how does
    a view get its data? Views access data from one or more underlying tables (base
    tables) or other views, provide you with your own personal access to data, and
    can be used in DATA steps as well as by SAS procedures.


    Views can be made to extend the security capabilities in dynamic environments
    where data duplication or data redundancy, logic complexities, and data security
    are an issue. When properly designed, views can be made to adhere to row-level
    and column-level security requirements by allowing access to only those columns
    and/or rows of data with relevance to the information needs of the application.
    Any columns and/or rows of data that are deemed “off limits,” or are classified
    as “restricted” can be eliminated from the view’s selection list. Consequently,
    views can be constructed to allow access to only those portions of an underlying
    table (or tables) that each user is permitted to access.


    Another important feature of views is that they ensure consistently derived data
    by creating calculated (computed) columns that are based on some arithmetic formula
    (or algorithm). Database purists often design tables to be free of calculated
    columns, thereby relying on the view to create computed columns. By allowing views
    to perform data aggregation, instead of the tables themselves, processing costs
    can be postponed until needed or requested.


    As a means of shielding users from complex logic constructs, views can be designed
    to look as though a database were designed specifically for a single user as well
    as for a group of users, each having different needs. Data references are coded
    once and, only when fully tested and ready for production, can be conveniently
    stored in common shareable libraries for all to access. Views ensure that the
    most current input data is used without the need for replicating partial or complete
    copies of the input data. They also require very little storage space because
    a view contains only its definition, and does not contain a copy of the data that
    it presents.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Views are also beneficial when queries or subqueries are repeated a number
    of times throughout an application. In these situations, the addition of a view
    enables a change to be made only once, which improves your productivity through
    a reduction in time and resources. The creation of view libraries should be considered
    so that users throughout an organization have an easily accessible array of productivity
    routines as they would a macro.


    # What Views Aren’t


    Views are not tables, but they are file constructs that contain compiled code
    that access one or more underlying tables. Because views do not physically store
    data, they are referred to as “virtual” tables. Unlike tables, views do not physically
    contain or store rows of data. Views, however, do have a physical presence and
    take up space. Storage demands for views are minimal because the only portion
    saved is the SELECT statement or query itself. Tables, on the other hand, store
    one or more rows of data and their attributes within their structure.


    Views are created with the CREATE VIEW statement while tables are created with
    the CREATE TABLE statement. Because you use one or more underlying tables to create
    a virtual (derived) table, views provide you with a powerful method for accessing
    data sources.


    Although views have many unique and powerful features, they also have pitfalls.
    First, views generally take longer to process than tables. Each time a view is
    referenced, the current underlying table or tables are accessed and processed.
    Because a view is not physically materialized until it is accessed, higher utilization
    costs can be expected, particularly for larger views. Also, because a view is
    not a data file (table) and does not contain data, an index cannot be created
    for a view. However, if a view is created from a data file that has a defined
    index, then the SQL optimizer might attempt to use the index when processing its
    associated WHERE clause expression. Finally, if the results of a view are used
    several times in the same program, it might be more efficient to save and reuse
    a copy of the results in a table, thereby avoiding the re-execution (materialization)
    of the view multiple times.


    # Types of Views


    Views can be designed to achieve a number of objectives:


    +   - Reference a single table

    +   - Produce summary data across a row

    +   - Conceal sensitive information

    +   - Create updatable views

    +   - Grouped data based on summary functions or a HAVING clause

    +   - Use set operators

    +   - Combine two or more tables in join operations

    +   - Nest one view within another view'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'As a way to distinguish the various types of views, Joe Celko introduced a
    classification system that is based on the type of SELECT statement used. See
    SQL for Smarties: Advanced SQL Programming (Morgan Kaufman, 1999).


    To help you understand the different view types, this chapter describes and illustrates
    view construction as well as how they can be used. A view can also have the characteristics
    of one or more view types, thereby being classified as a hybrid. A hybrid view,
    for example, could be designed to reference two or more tables, perform updates,
    and contain complex computations. Table 8.1 presents the different view types
    along with a brief description of their purpose.


    # Table 8.1: A Description of the Various View Types


    | Types of Views | Description |

    |---|---|

    | Single-table view | A single-table view references a single underlying (base)
    table. It is the most common type of view. Selected columns and rows can be displayed
    or hidden depending on need. |

    | Calculated column views | A calculated column view provides summary data across
    a row. |

    | Read-only view | A read-only view prevents data from being updated (as opposed
    to updatable views) and is used to display data only. This also serves security
    purposes for the concealment of sensitive information. |

    | Updatable view | An updatable view adds (inserts), modifies, or deletes rows
    of data. |

    | Grouped view | A grouped view uses query expressions that are based on a query
    with a GROUP BY clause. |

    | Set operation view | A set operation view includes the union of two tables,
    the removal of duplicate rows, the concatenation of results, and the comparison
    of query results. |

    | Joined view | A joined view is based on the joining of two or more base tables.
    This type of view is often used in table-lookup operations to expand (or translate)
    coded data into text. |

    | Nested view | A nested view is based on one view being dependent on another
    view such as with subqueries. |

    | Hybrid view | An integration of one or more view types for the purpose of handling
    more complex tasks. |'
  merge: -1
  img_proc: true
- pgno: 321
  md: "# Creating Views\n\nYou use the CREATE VIEW statement in the SQL procedure\
    \ to create a view. When the SQL processor reads the words CREATE VIEW, it expects\
    \ to find a name assigned to the newly created view. The SELECT statement defines\
    \ the names assigned to the view’s columns as well as their order.\n\nViews are\
    \ often constructed so that the order of the columns is different from the base\
    \ table. In the next example, a view is created with the columns appearing in\
    \ a different order from the original MANUFACTURERS base table. The view’s SELECT\
    \ statement does not execute during this step because its only purpose is to define\
    \ the view in the CREATE VIEW statement.\n\n# SQL Code\n\n```\nPROC SQL;\n   \
    \ CREATE VIEW MANUFACTURERS_VIEW AS\n        SELECT manuname, manunum, manucity,\
    \ manustat\n            FROM MANUFACTURERS;\nQUIT;\n```\n\n# SAS Log Results\n\
    \n```\nPROC SQL;\n    CREATE VIEW MANUFACTURERS_VIEW AS\n        SELECT manuname,\
    \ manunum, manucity, manustat\n            FROM MANUFACTURERS;\nNOTE: SQL view\
    \ WORK.MANUFACTURERS_VIEW has been defined.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n\
    \    real time            0.44 seconds\n```\n\nWhen you create a view, you can\
    \ create columns that are not present in the base table from which you built your\
    \ view. That is, you can create columns that are the result of an operation (addition,\
    \ subtraction, multiplication, etc.) on one or more columns in the base tables.\
    \ You can also build a view using one or more unmodified columns of one or more\
    \ base tables. Columns created this way are referred to as derived columns or\
    \ calculated columns. In the next example, suppose that you want to create a view\
    \ that consists of the product name, inventory quantity, and inventory cost from\
    \ the INVENTORY base table, and a derived column of average product costs that\
    \ are stored in inventory.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE VIEW INVENTORY_VIEW\
    \ AS\n        SELECT prodnum, invenqty, invencst,\n            invencst/invenqty\
    \ AS AverageAmount\n            FROM INVENTORY;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 322
  md: "# SAS Log Results\n\n```\nPROC SQL;\n    CREATE VIEW INVENTORY_VIEW AS\n  \
    \      SELECT prodnum, invenqty, invencst,\n               invencst/invenqty AS\
    \ AverageAmount\n        FROM INVENTORY;\nNOTE: SQL view WORK.INVENTORY_VIEW has\
    \ been defined.\nQUIT;\nNOTE: PROCEDURE SQL used:\n      real time          0.00\
    \ seconds\n```\n\n# Displaying a View’s Contents\n\nYou would expect the CONTENTS\
    \ procedure to display information about the physical characteristics of a SAS\
    \ data library and its tables. But what you might not know is that the CONTENTS\
    \ procedure can also be used to display information about a view. The output that\
    \ is generated from the CONTENTS procedure shows that the view contains no rows\
    \ (observations) by displaying a missing value in the Observations field and a\
    \ member type of VIEW. The engine used is the SQLVIEW. The following example illustrates\
    \ the use of the CONTENTS procedure in the Windows environment to display the\
    \ INVENTORY_VIEW view’s contents.\n\n# SQL Code\n\n```\nPROC CONTENTS DATA=INVENTORY_VIEW;\n\
    RUN;\n```"
