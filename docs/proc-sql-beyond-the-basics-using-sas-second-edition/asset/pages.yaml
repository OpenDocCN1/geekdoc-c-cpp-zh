- pgno: 267
  md: "# Results\n\n| Product Name | Product Cost | Manufacturer Number | Manufacturer\
    \ Name |\n|---|---|---|---|\n| Spreadsheet Software | $299.00 | 500 | KPL Enterprises\
    \ |\n| Graphics Software | $299.00 | 500 | KPL Enterprises |\n| Wordprocessor\
    \ Software | $299.00 | 500 | KPL Enterprises |\n| Database Software | $399.00\
    \ | 500 | KPL Enterprises |\n\nLet’s extend our knowledge of equijoins by identifying\
    \ how much money is tied up with products that are manufactured by KPL Enterprises.\
    \ To accomplish this, you need to do two things. First, you need to sum the product\
    \ cost (PRODCOST) column across all rows that match the WHERE clause condition.\
    \ Because the objective of the equijoin is to compute a total amount for products\
    \ that are manufactured by KPL Enterprises, you need to prevent duplicate rows\
    \ from displaying in the results. To prevent duplicate rows, you need to specify\
    \ the DISTINCT keyword.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT DISTINCT SUM(prodcost)\
    \ AS Total_Cost\n        FORMAT=DOLLAR10.2,\n        manufacturers.manunum\n \
    \   FROM PRODUCTS, MANUFACTURERS\n    WHERE products.manunum =\n        manufacturers.manunum\
    \ AND\n        manufacturers.manuname = 'KPL Enterprises';\nQUIT;\n```\n\n① The\
    \ DISTINCT keyword prevents duplicate rows from appearing in the result.\n\n#\
    \ Results\n\n| Total_Cost | Manufacturer Number |\n|---|---|\n| $1,296.00 | 500\
    \ |\n\n# Non-Equijoins\n\nAnother type of inner join is known as a non-equijoin.\
    \ As you might guess from its name, a non-equijoin does not have an equal sign\
    \ “=” specified in its WHERE clause. For example,"
  merge: -1
  img_proc: true
- pgno: 268
  md: "suppose that you want to display products that are manufactured by KPL Enterprises\
    \ that cost more than $299.00. The use of the greater than \">\" operator gives\
    \ this type of join its name.\n\nNote: When the SQL procedure optimizer is unable\
    \ to optimize a join query by reducing the Cartesian product, a message is displayed\
    \ in the SAS log that indicates that the join requires performing one or more\
    \ Cartesian product joins and cannot be optimized.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n    SELECT prodname, prodtype, prodcost,\n            manufacturers.manunum,\
