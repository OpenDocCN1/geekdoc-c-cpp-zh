    \      Primary Key     manunum\n\nQUIT;\nNOTE: PROCEDURE SQL used:\n    real time\
    \       0.19 seconds\n    cpu time        0.01 seconds\n```\n\n# Deleting Rows\
    \ in a Table\n\nIn the world of data management, the ability to delete unwanted\
    \ rows of data from a table is as important as being able to populate a table\
    \ with data. In fact, data management activities would be severely hampered without\
    \ the ability to delete rows of data. The DELETE statement and an optional WHERE\
    \ clause can remove one or more unwanted rows from a table, depending on what\
    \ is specified in the WHERE clause.\n\n# Deleting a Single Row in a Table\n\n\
    The DELETE statement can be specified to remove a single row of data by constructing\
    \ an explicit WHERE clause on a unique value. The construction of a WHERE clause\
    \ to satisfy this form of row deletion may require a complex logic construct.\
    \ So, be sure to test the expression thoroughly before applying it to the table\
    \ to determine whether it performs as expected. The following example illustrates\
    \ the removal of a single customer in the CUSTOMERS table by specifying the customer’s\
    \ name (CUSTNAME) in the WHERE clause."
