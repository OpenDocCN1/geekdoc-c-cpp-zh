    NOTE: PROCEDURE SQL used:\n      real time           0.00 seconds\n      cpu time\
    \            0.00 seconds\n```\n\nTo enable the deletion of a table that contains\
    \ one or more integrity constraints, you must specify an SQL statement such as\
    \ the ALTER TABLE statement and DROP COLUMN or DROP CONSTRAINT clauses. Once a\
    \ table’s integrity constraints are removed, the table can then be deleted.\n\n\
    In the following SAS log, the FOREIGN_PRODUCT_KEY constraint is removed from the\
    \ INVENTORY table using the DROP CONSTRAINT clause. With the constraint removed,\
    \ the INVENTORY table is then deleted with the DROP TABLE statement.\n\n# SAS\
    \ Log Results\n\n```\nPROC SQL;\n    ALTER TABLE INVENTORY\n        DROP CONSTRAINT\
    \ FOREIGN_PRODUCT_KEY;\nNOTE: Integrity constraint FOREIGN_PRODUCT_KEY deleted.\n\
    NOTE: Table WORK.INVENTORY has been modified, with 5 columns.\n    QUIT;\nNOTE:\
    \ PROCEDURE SQL used:\n      real time           0.01 seconds\n      cpu time\
    \            0.01 seconds\n\n    PROC SQL;\n        DROP TABLE INVENTORY;\nNOTE:\
    \ Table WORK.INVENTORY has been dropped.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n\
    \      real time           0.34 seconds\n      cpu time            0.02 seconds\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Summary


    +   1. Creating a table using a column-definition list is similar to defining
    a table’s structure with the LENGTH statement in the DATA step (see the “Creating
    a Table Using Column-Definition Lists section).

    +   2. Using the LIKE clause copies the column names and attributes from the existing
    table structure to the new table structure (see the “Creating a Table Using the
    LIKE Clause section).

    +   3. Deriving a table from an existing table stores the results in a new table
    instead of displaying them as SAS output (see the “Deriving a Table and Data from
    an Existing Table” section).

    +   4. In populating a table, three parameters are specified with an INSERT INTO
    statement: the name of the table, the names of the columns in which values are
    inserted, and the values themselves (see the “Adding Data to All of the Columns
    in a Row” section).

    +   5. Database-enforced constraints can be applied to a database table structure
    to enforce the type and content of data that is permitted (see the “Integrity
    Constraints” section).

    +   6. The DELETE statement combined with a WHERE clause selectively removes one
    or more rows of data from a table (see the “Deleting a Single Row in a Table”
    section).

    +   7. The SQL standard permits one or more unwanted tables to be removed from
    a database (SAS library) (see the “Deleting Multiple Tables” section).'
  merge: -1
  img_proc: true
