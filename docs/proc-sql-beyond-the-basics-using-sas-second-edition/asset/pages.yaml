  md: "# Specifying a WHERE Clause\n\nTo provide greater subsetting capabilities as\
    \ well as added flexibility, the SQL procedure also permits the specification\
    \ of an optional WHERE clause in addition to an ON clause when constructing outer\
    \ joins. The ability to specify a WHERE clause in conjunction with an ON clause\
    \ permits greater control over the subsetting of rows. An example will help illustrate\
    \ how a WHERE clause is used in an outer join. Suppose that you want to limit\
    \ the results from the previous left outer join to only those products that cost\
    \ less than $300.00. In this example, the left outer join syntax uses a WHERE\
    \ clause to subset row results to nonmissing products that cost less than $300.00.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT manuname, manucity, manufacturers.manunum,\n\
    \            products.prodtype, products.prodcost\n    FROM MANUFACTURERS LEFT\
    \ JOIN PRODUCTS\n    ON manufacturers.manunum =\n        products.manunum\n  \
    \  WHERE prodcost < 300 AND\n        prodcost NE .;\nQUIT;\n```\n\nThe optional\
    \ WHERE clause that is specified in addition to an ON clause in an outer join\
    \ further subsets the joined results.\n\n# Results\n\n| Manufacturer Name | Manufacturer\
    \ City | Manufacturer Number | Product Type | Product Cost |\n|---|---|---|---|---|\n\
    | Global Comm Corp | San Diego | 210 | Phone | $175.00 |\n| Global Comm Corp |\
    \ San Diego | 210 | Phone | $35.00 |\n| KPL Enterprises | San Diego | 500 | Software\
    \ | $299.00 |\n| KPL Enterprises | San Diego | 500 | Software | $299.00 |\n| KPL\
    \ Enterprises | San Diego | 500 | Software | $299.00 |\n\n# Specifying Aggregate\
    \ Functions\n\nSuppose that you need to produce a monthly report that consists\
    \ of a total invoice amount by manufacturer. An aggregate function can be specified\
    \ with outer join syntax to perform a group computation using a GROUP BY clause.\
    \ In the next example, a left join computes the total invoice amount for each\
    \ manufacturer with a SUM function and GROUP BY clause."
