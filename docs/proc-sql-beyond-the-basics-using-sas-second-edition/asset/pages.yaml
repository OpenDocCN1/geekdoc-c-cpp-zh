  md: "# Results\n\n| Product Name | Product Cost | Manufacturer Number | Manufacturer\
    \ Name |\n| Dream Machine | $3,200.00 | 111 | Cupid Computer |\n| Business Machine\
    \ | $3,300.00 | 120 | Storage Devices Inc |\n| Analog Cell Phone | $35.00 | 210\
    \ | Global Comm Corp |\n| Digital Cell Phone | $175.00 | 210 | Global Comm Corp\
    \ |\n| Spreadsheet Software | $299.00 | 500 | KPL Enterprises |\n| Database Software\
    \ | $399.00 | 500 | KPL Enterprises |\n| Wordprocessor Software | $299.00 | 500\
    \ | KPL Enterprises |\n| Graphics Software | $299.00 | 500 | KPL Enterprises |\n\
    \nThe previous example can be further qualified by adding another condition in\
    \ the WHERE clause. For example, suppose that you want to display only those products\
    \ from the manufacturer KPL Enterprises. The following join identifies all of\
    \ the products that are manufactured by KPL Enterprises as specified in the WHERE\
    \ clause (all rows that do not meet the condition of the WHERE clause are automatically\
    \ excluded from the results of the join).\n\nNote: This join assumes that you\
    \ know KPL Enterprises’ unique manufacturer number.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n    SELECT prodname, prodcost,\n        manufacturers.manunum, manuname\n\
    \    FROM PRODUCTS, MANUFACTURERS\n    WHERE products.manunum =\n        manufacturers.manunum\
    \ AND\n        products.manunum = 500;\nQUIT;\n```\n\n① The specification of the\
    \ AND logical operator in the WHERE clause indicates that both conditions must\
    \ be true in order to retrieve rows from both tables."
  merge: -1
