- pgno: 164
  md: "# Results\n\n| Product Name | Product Number | ComputerHardware | OfficeEquipment\
    \ | ComputerSoftware |\n| Database Software | 5002 | . | . | 3 |\n| Dream Machine\
    \ | 1110 | 20 | . | . |\n| Graphics Software | 5004 | . | . | 20 |\n| Spreadsheet\
    \ Software | 5001 | . | . | 5 |\n| Spreadsheet Software | 5001 | . | . | 2 |\n\
    | Travel Laptop | 1700 | 10 | . | . |\n| Wordprocessor Software | 5003 | . | .\
    \ | 10 |\n\n# Case Logic versus COALESCE Expression\n\nA popular convention among\
    \ SQL programmers is to specify a COALESCE function in an expression to perform\
    \ Case logic. As described in Chapter 2, “Working with Data in PROC SQL,” the\
    \ COALESCE function permits a new value to be substituted for one or more missing\
    \ column values. By specifying COALESCE in an expression, PROC SQL evaluates each\
    \ argument from left to right for the occurrence of a non-missing value. The first\
    \ non-missing value found in the list of arguments is returned; otherwise, a missing\
    \ value, or assigned value, is returned. This approach not only saves programming\
    \ time, it makes coding constructs simpler to maintain.\n\nExpressing logical\
    \ expressions in one or more WHEN-THEN/ELSE conditions are frequently easy to\
    \ code, understand, and maintain. But as the complexities associated with Case\
    \ logic increase, the amount of coding also increases. In the following example,\
    \ a simple CASE expression is presented to illustrate how a value of “Unknown”\
    \ is assigned and displayed when CUSTCITY is missing.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n    SELECT CUSTNAME,\n        CASE\n            WHEN CUSTCTY IS NOT NULL\
    \ THEN CUSTCITY\n            ELSE 'Unknown'\n        END AS Customer_City\n  \
    \  FROM CUSTOMER;\nQUIT;\n```\n\nTo illustrate the usefulness of the COALESCE\
    \ function as an alternative to Case logic, the same query can be modified to\
    \ achieve the same results as before. By replacing the Case logic with a COALESCE\
    \ expression as follows, the value of CUSTCITY is automatically displayed unless\
    \ it is missing. In cases of character data, a value of “Unknown” is displayed.\
    \ This technique makes the COALESCE function a very useful and is a shorthand\
    \ approach indeed."
