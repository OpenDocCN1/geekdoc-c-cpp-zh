  md: "```\nCHECK (PRODTYPE IN ('Laptop',\n    'Phone',\n    'Software',\n    'Workstation'));\n\
    QUIT;\n```\n\nWith a CHECK constraint defined, each row must meet the validation\
    \ rules that are specified for the column before the table is populated. If any\
    \ row does not pass the validation checks based on the established validation\
    \ rules, then the add/update operation fails and the table is automatically restored\
    \ to its original state prior to the operation taking place. In the next example,\
    \ three rows of data are validated against the defined CHECK constraint established\
    \ for the PRODTYPE column.\n\n# SQL Code\n\n```\nPROC SQL;\n    INSERT INTO PRODUCTS\n\
    \        VALUES (5005,'Internet Software',500,'Software',99.)\n        VALUES\
    \ (1701,'Elite Laptop',170,'Laptop',3900.)\n        VALUES (2103,'Digital Cell\
    \ Phone',210,'Fone',199.);\nQUIT;\n```\n\nThe SAS log displays the results after\
    \ attempting to add the three rows of data. Because one row violates the CHECK\
    \ constraint with a value of “Fone”, the rows are not added to the PRODUCTS table.\
    \ The violation produces an error message that results in the failure of the add/update\
    \ operation.\n\n# SAS Log Results\n\n```\nPROC SQL;\n    INSERT INTO PRODUCTS\n\
    \        VALUES (5005,'Internet Software',500,'Software',99.)\n        VALUES\
    \ (1701,'Elite Laptop',170,'Laptop',3900.)\n        VALUES (2103,'Digital Cell\
    \ Phone',210,'Fone',199.);\nERROR: Add/Update failed for data set WORK.PRODUCTS\
    \ because data value(s) do not comply with integrity constraint CHECK_PRODUCT_TYPE.\n\
    NOTE: This insert failed while attempting to add data from VALUES clause 3 to\
    \ the data set.\nNOTE: Deleting the successful inserts before error noted above\
    \ to restore table to a consistent state.\nQUIT;\nNOTE: The SAS System stopped\
    \ processing this step because of errors.\nNOTE: PROCEDURE SQL used:\n    real\
    \ time          0.09 seconds\n    cpu time           0.02 seconds\n```\n\n# Referential\
    \ Integrity Constraints\n\nThe second type of constraint that is available in\
    \ the SQL procedure is referred to as a referential integrity constraint. Enforced\
    \ through primary and foreign keys between two or more tables, referential integrity\
    \ constraints are built into a database environment to prevent data integrity\
    \ issues"
  merge: -1
  img_proc: true
- pgno: 220
  md: "from occurring. Specific types of referential integrity constraints and constraint\
    \ action clauses are used to enforce update and delete operations and consist\
    \ of the following:\n\n# Referential Integrity Constraints\n\n+   - Primary key\n\
    +   - Foreign key\n\n# Referential Integrity Constraint Action Clauses\n\n+  \
    \ - RESTRICT (Default)\n+   - SET NULL\n+   - CASCADE\n\nThe action clauses are\
    \ discussed in the “Establishing a Foreign Key” section in this chapter.\n\n#\
    \ Establishing a Primary Key\n\nA primary key consists of one or more columns\
    \ with a unique value that is used to identify individual rows in a table. Depending\
    \ on the nature of the columns used, a single column may be all that is necessary\
    \ to identify specific rows. In other cases, two or more columns may be needed\
    \ to adequately identify a row in a referenced table. Suppose that you need to\
    \ uniquely identify specific rows in the MANUFACTURERS table. By establishing\
    \ the Manufacturer Number (MANUNUM) as the unique identifier for rows, a key is\
    \ established. The next example specifies the ALTER TABLE statement to create\
    \ a primary key using MANUNUM in the MANUFACTURERS table.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n  ALTER TABLE MANUFACTURERS\n    ADD CONSTRAINT PRIM_KEY PRIMARY KEY\
    \ (MANUNUM);\nQUIT;\n```\n\nThe SAS log shows that the MANUFACTURERS table has\
    \ been modified successfully after creating a primary key using the MANUNUM column.\n\
    \n# SAS Log Results\n\n```\nPROC SQL;\n  ALTER TABLE MANUFACTURERS\n    ADD CONSTRAINT\
    \ PRIM_KEY PRIMARY KEY (MANUNUM);\nNOTE: Table WORK.MANUFACTURERS has been modified,\
    \ with 4 columns.\nQUIT;\nNOTE: PROCEDURE SQL used:\n  real time          0.07\
    \ seconds\n  cpu time           0.01 seconds\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "Suppose that you also need to uniquely identify specific rows in the PRODUCTS\
    \ table. By specifying PRODNUM (Product Number) as the primary key, the next example\
    \ specifies the ALTER TABLE statement to create the unique identifier for rows\
    \ in the table.\n\n# SQL Code\n\n```\nPROC SQL;\n    ALTER TABLE PRODUCTS\n  \
    \      ADD CONSTRAINT PRIM_PRODUCT_KEY PRIMARY KEY (PRODNUM);\nQUIT;\n```\n\n\
    The SAS log shows that the PRODUCTS table has been modified successfully after\
    \ establishing a primary key using the PRODNUM column.\n\n# SAS Log Results\n\n\
    ```\nPROC SQL;\n    ALTER TABLE PRODUCTS\n        ADD CONSTRAINT PRIM_PRODUCT_KEY\
    \ PRIMARY KEY (PRODNUM);\nNOTE: Table WORK.PRODUCTS has been modified, with 5\
    \ columns.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n        real time          \
    \ 0.03 seconds\n        cpu time            0.01 seconds\n```\n\n# Establishing\
    \ a Foreign Key\n\nA foreign key consists of one or more columns in a table that\
    \ references or relates to values in another table. The column(s) that is used\
    \ as a foreign key must match the column(s) in the table that is referenced. The\
    \ purpose of a foreign key is to ensure that rows of data in one table exist in\
    \ another table thereby preventing the possibility of lost or missing linkages\
    \ between tables. The enforcement of referential integrity rules has a positive\
    \ and direct effect on data reliability issues.\n\nSuppose that you want to ensure\
    \ that data values in the INVENTORY table have corresponding and matching data\
    \ values in the PRODUCTS table. By establishing PRODNUM (Product Number) as a\
    \ foreign key in the INVENTORY table, you ensure a strong level of data integrity\
    \ between the two tables. This essentially verifies that key data in the INVENTORY\
    \ table exists in the PRODUCTS table. In the next example, a foreign key is created\
    \ using the PRODNUM column in the INVENTORY table by specifying the ALTER TABLE\
    \ statement.\n\n# SQL Code\n\n```\nPROC SQL;\n    ALTER TABLE INVENTORY\n    \
    \    ADD CONSTRAINT FOREIGN_PRODUCT_KEY FOREIGN KEY (PRODNUM)\n            REFERENCES\
    \ PRODUCTS\n                ON DELETE RESTRICT\n                ON UPDATE RESTRICT;\n\
    QUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: "The SAS log displays the successful creation of the PRODNUM column as a foreign\
    \ key in the INVENTORY table. By specifying the default values ON DELETE RESTRICT\
    \ and ON UPDATE RESTRICT clauses, you restrict the ability to change the values\
    \ of primary key data when matching values are found in the foreign key. The execution\
    \ of any SQL statement that could violate these referential integrity rules is\
    \ prevented during SQL processing.\n\n# SAS Log Results\n\n```\nPROC SQL;\n  \
    \  ALTER TABLE INVENTORY\n    ADD CONSTRAINT FOREIGN_PRODUCT_KEY FOREIGN KEY (PRODNUM)\n\
    \        REFERENCES PRODUCTS\n        ON DELETE RESTRICT\n        ON UPDATE RESTRICT;\n\
    NOTE: Table WORK.INVENTORY has been modified, with 5 columns.\n    QUIT;\nNOTE:\
    \ PROCEDURE SQL used:\n      real time           0.01 seconds\n      cpu time\
    \            0.01 seconds\n```\n\nSuppose that a product of a particular manufacturer\
    \ is no longer available and has been taken off the market. To handle this type\
    \ of situation, data values in the INVENTORY table should be set to missing once\
    \ the product is deleted from the PRODUCTS table. The next example establishes\
    \ a foreign key using the PRODNUM column in the INVENTORY table and sets values\
    \ to null with the ON DELETE clause.\n\n# SQL Code\n\n```\nPROC SQL;\n    ALTER\
    \ TABLE INVENTORY\n    ADD CONSTRAINT FOREIGN_MISSING_PRODUCT_KEY FOREIGN KEY\
    \ (PRODNUM)\n        REFERENCES PRODUCTS\n        ON DELETE SET NULL;\nQUIT;\n\
    ```\n\nThe SAS log displays the successful creation of the PRODNUM column as a\
    \ foreign key in the INVENTORY table as well as the effect of the ON DELETE SET\
    \ NULL clause. Specifying this clause will change foreign key values to missing\
    \ or null for all of the rows with matching values found in the primary key. The\
    \ execution of any SQL statement that could violate these referential integrity\
    \ rules is prevented during SQL processing."
