    # Summarizing Data


    The SQL procedure is a wonderful tool for summarizing (or aggregating) data. It
    provides a number of useful summary (or aggregate) functions to help perform calculations,
    descriptive statistics, and other aggregating operations in a SELECT statement
    or HAVING clause. These functions are designed to summarize information and not
    display detail about data.


    Without the availability of summary functions, you would have to construct the
    necessary logic using somewhat complicated SQL programming constructs. When using
    a summary function without a GROUP BY clause, (see Chapter 3, “Formatting Output”),
    all the rows in a table are treated as a single group. Consequently, the results
    are often a single row value.


    A number of summary functions are available including facilities to count non-missing
    values; determine the minimum and maximum values in specific columns; return the
    range of values; compute the mean, standard deviation, and variance of specific
    values; and other aggregating functions. In the following table, an alphabetical
    listing of the available summary functions are'
  merge: -1
  img_proc: true
- pgno: 81
  md: "displayed and, when multiple names for the same function are available, the\
    \ ANSI-approved name appears first.\n\n| Summary Function | Description |\n|---|---|\n\
    | AVG, MEAN | Average or mean of values |\n| COUNT, FREQ, N | Aggregate number\
    \ of non-missing values |\n| CSS | Corrected sum of squares |\n| CV | Coefficient\
    \ of variation |\n| MAX | Largest value |\n| MIN | Smallest value |\n| NMISS |\
    \ Number of missing values |\n| PRT | Probability of a greater absolute value\
    \ of Student’s t |\n| RANGE | Difference between the largest and smallest values\
    \ |\n| STD | Standard deviation |\n| STDERR | Standard error of the mean |\n|\
    \ SUM | Sum of values |\n| SUMWGT | Sum of the weight variable values which is\
    \ 1 |\n| T | Testing the hypothesis that the population mean is zero |\n| USS\
    \ | Uncorrected sum of squares |\n| VAR | Variance |\n\nThe next example uses\
    \ the COUNT function with the (*) argument to produce a total number of rows,\
    \ whether data is missing or not. The asterisk (*) is specified as the argument\
    \ to the COUNT function to count all rows in the PURCHASES table.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT COUNT(*) AS Row_Count\n    FROM PURCHASES;\nQUIT;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Results\n\n| Row_Count |\n|---:|\n| 57 |\n\nUnlike the COUNT(*) function\
    \ syntax that counts all rows, whether data is missing or not, the next example\
    \ uses the COUNT function with the (column-name) argument to produce a total number\
    \ of non-missing rows based on the UNITS column.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    SELECT COUNT(UNITS) AS Non_Missing_Row_Count\n        FROM PURCHASES;\nQUIT;\n\
    ```\n\n# Results\n\n| Non_Missing_Row_Count |\n|---:|\n| 57 |\n\nThe MIN summary\
    \ function can be specified to determine what the least expensive product is in\
    \ the PRODUCTS table.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT MIN(prodcost)\
    \ AS Cheapest\n        Format=dollar9.2 Label=’Least Expensive’\n        FROM\
    \ PRODUCTS;\nQUIT;\n```\n\n# Results\n\n| Least Expensive |\n|---:|\n| $35.00\
    \ |\n\nIn the next example, the SUM function is specified to sum numeric data\
    \ types for a selected column. Suppose you want to determine the total costs of\
    \ all purchases by customers who bought workstations (PRODNUM=1110 and 1200) and\
    \ laptops (PRODNUM=1700). You could construct the following query to sum all non-missing\
    \ values for customers who purchased workstations and laptops in the PURCHASES\
    \ table."
  merge: -1
  img_proc: true
- pgno: 83
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT SUM((UNITS) * (UNITCOST))\n      \
    \  AS Total_Purchases FORMAT=DOLLAR12.2\n        FROM PURCHASES\n        WHERE\
    \ PRODNUM = 1110 OR\n              PRODNUM = 1200 OR\n              PRODNUM =\
    \ 1700;\nQUIT;\n```\n\n# Results\n\n| Total_Purchases |\n|-----------------|\n\
    | $237,500.00     |\n\nData can also be summarized down rows (observations) as\
    \ well as across columns (variables). This flexibility gives SAS users an incredible\
    \ range of power, and the ability to take advantage of several summary functions\
    \ that are supplied (or built-in) by SAS. These techniques permit the average\
    \ of quantities rather than the set of all quantities. Without the ability to\
    \ summarize data in PROC SQL, users would be forced to write complicated formulas\
    \ and/or routines, or even write and test DATA step programs to summarize data.\
    \ Two examples will be illustrated to show how SQL can be constructed to summarize\
    \ data:\n\n+   - Summarizing data down rows\n+   - Summarizing data across columns\n\
    \n# Summarizing Data Down Rows\n\nThe SQL procedure can be used to produce a single\
    \ aggregate value by summarizing data down rows (or observations). The advantages\
    \ of using a summary function in PROC SQL is that it will generally compute the\
    \ aggregate quicker than if a user-defined equation were constructed, and it saves\
    \ the effort of having to construct and test a program containing the user-defined\
    \ equation in the first place. Suppose you want to know the average product cost\
    \ for all software in the PRODUCTS table containing a variety of products. The\
    \ following query computes the average product cost and produces a single aggregate\
    \ value using the AVG function.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT AVG(PRODCOST)\
    \ AS\n        AVERAGE_PRODUCT_COST FORMAT=DOLLAR10.2\n        FROM PRODUCTS\n\
    \        WHERE UPCASE(PRODTYPE) IN\n            (\"SOFTWARE\");\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Results\n\n| AVERAGE_PRODUCT_COST |\n| --- |\n| $324.00 |\n\n# Summarizing\
    \ Data Across Columns\n\nWhen a computation is needed on two or more columns in\
    \ a row, the SQL procedure can be used to summarize data across columns. Suppose\
    \ you want to know the average cost of products in inventory. The next example\
    \ computes the average inventory cost for each product without using a summary\
    \ function, and once computed displays the value for each row as AVERAGE_PRICE.\n\
    \n# SQL Code\n\n```\nPROC SQL;\nSELECT PRODNUM,\n    (INVPRICE / INVQTY) AS\n\
    \        AVERAGE_PRICE\n        FORMAT=DOLLAR8.2\nFROM INVOICE;\nQUIT;\n```\n\n\
    # Results\n\n| Product Number | AVERAGE_PRICE |\n| --- | --- |\n| 5001 | $299.00\
    \ |\n| 6001 | $799.00 |\n| 2101 | $35.00 |\n| 1110 | $3200.00 |\n| 5002 | $399.00\
    \ |\n| 6000 | $99.00 |\n| 1200 | $3300.00 |\n\n# Predicates\n\nPredicates are\
    \ used in PROC SQL to perform direct comparisons between two conditions or expressions.\
    \ Six predicates will be looked at:\n\n+   - BETWEEN\n+   - IN"
  merge: -1
  img_proc: true
- pgno: 85
  md: "+   - IS NULL\n+   - IS MISSING\n+   - LIKE\n+   - EXISTS\n\n# Selecting a\
    \ Range of Values\n\nThe BETWEEN predicate is a way of simplifying a query by\
    \ selecting column values within a designated range of values. BETWEEN is equivalent\
    \ to an AND combination of one LE (less than or equal) and one GE (greater than\
    \ or equal) conditions; inclusive of both endpoints. It is extremely flexible\
    \ because it works with character, numeric, and date values. Programmers can also\
    \ combine two or more BETWEEN predicates with AND or OR operators for more complicated\
    \ conditions. In the next example, a range of products costing between $200.00\
    \ and $500.00 inclusively are selected from the PRODUCTS table.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT PRODNAME,\n            PRODTYPE,\n            PRODCOST\n\
    \        FROM PRODUCTS\n        WHERE PRODCOST BETWEEN 200 AND 500;\nQUIT;\n```\n\
    \n# Results\n\n| Product Name | Product Type | Product Cost |\n|---|---|---|\n\
    | SpreadsheetSoftware | Software | $299.00 |\n| DatabaseSoftware | Software |\
    \ $399.00 |\n| WordprocessorSoftware | Software | $299.00 |\n| GraphicsSoftware\
    \ | Software | $299.00 |\n\nIn the next example, products are selected from the\
    \ INVENTORY table that were ordered between the years 1999 and 2000. The YEAR\
    \ function returns the year portion from a SAS date value and is used as the range\
    \ of values in the WHERE clause.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n\
    \            INVENQTY,\n            ORDDATE\n        FROM INVENTORY\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\nWHERE YEAR(ORDDATE) BETWEEN 1999 AND 2000;\nQUIT;\n```\n\n# Results\n\n\
    | Product Number | Inventory Quantity | Date Inventory Last Ordered |\n| 1110\
    \ | 20 | 09/01/2000 |\n| 1700 | 10 | 08/15/2000 |\n| 5001 | 5 | 08/15/2000 |\n\
    | 5002 | 3 | 08/15/2000 |\n| 5003 | 10 | 08/15/2000 |\n| 5004 | 20 | 09/01/2000\
    \ |\n| 5001 | 2 | 09/01/2000 |\n\nThe BETWEEN predicate and OR operator are used\
    \ together in the next example to select products ordered between 1999 and 2000\
    \ or where inventory quantities are greater than 15. The YEAR function returns\
    \ the year portion from a SAS date value and is used as the range of values in\
    \ the WHERE clause.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n   \
    \         INVENQTY,\n            ORDDATE\n    FROM INVENTORY\n    WHERE (YEAR(ORDDATE)\
    \ BETWEEN 1999 AND 2000) OR\n            INVENQTY > 15;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 87
  md: "# Results\n\n| Product Number | Inventory Quantity | Date Inventory Last Ordered\
    \ |\n| 1110 | 20 | 09/01/2000 |\n| 1700 | 10 | 08/15/2000 |\n| 5001 | 5 | 08/15/2000\
    \ |\n| 5002 | 3 | 08/15/2000 |\n| 5003 | 10 | 08/15/2000 |\n| 5004 | 20 | 09/01/2000\
    \ |\n| 5001 | 2 | 09/01/2000 |\n\n# Selecting Nonconsecutive Values\n\nThe IN\
    \ predicate selects one or more rows based on the matching of one or more column\
    \ values in a set of values. The IN predicate creates an OR condition between\
    \ each value and returns a Boolean value of True if a column value is equal to\
    \ one or more of the values in the expression list. Although the IN predicate\
    \ can be specified with single column values, it may be less costly to specify\
    \ the \"=\" sign instead. The \"=\" sign is used in the next example rather than\
    \ the IN predicate to select phones from the PRODUCTS table.\n\n# SQL Code\n\n\
    ```\nPROC SQL;\n    SELECT PRODNAME,\n        PRODTYPE,\n        PRODCOST\n  \
    \  FROM PRODUCTS\n    WHERE UPCASE(PRODTYPE) = 'PHONE';\nQUIT;\n```\n\n# Results\n\
    \n| Product Name | Product Type | Product Cost |\n| AnalogPhone | Phone | $35.00\
    \ |\n| DigitalPhone | Phone | $175.00 |\n| OfficePhone | Phone | $130.00 |"
  merge: -1
  img_proc: true
- pgno: 88
  md: "In the next example, both phones and software products are selected from the\
    \ PRODUCTS table. To avoid having to specify two OR conditions, the IN predicate\
    \ is specified.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n      \
    \      PRODTYPE,\n            PRODCOST\n    FROM PRODUCTS\n        WHERE UPCASE(PRODTYPE)\
    \ IN ('PHONE', 'SOFTWARE');\nQUIT;\n```\n\n# Results\n\n| Product Name | Product\
    \ Type | Product Cost |\n| AnalogPhone | Phone | $35.00 |\n| DigitalPhone | Phone\
    \ | $175.00 |\n| OfficePhone | Phone | $130.00 |\n| SpreadsheetSoftware | Software\
    \ | $299.00 |\n| DatabaseSoftware | Software | $399.00 |\n| WordprocessorSoftware\
    \ | Software | $299.00 |\n| GraphicsSoftware | Software | $299.00 |\n\n# Testing\
    \ for NULL or MISSING Values\n\nThe IS NULL predicate is the ANSI approach of\
    \ selecting one or more rows by evaluating whether a column value is missing or\
    \ null (see the “Missing Values and Null section). The next example selects products\
    \ from the INVENTORY table that are out-of-stock in inventory.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT PRODNUM,\n            INVENQTY,\n            INVENCST\n\
    \    FROM INVENTORY\n        WHERE INVENQTY IS NULL;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "# SAS Log Results\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n        INVENQTY,\n\
    \        INVENCST\n        FROM INVENTORY\n        WHERE INVENQTY IS NULL;\nNOTE:\
    \ No rows were selected.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n    real time\
    \          0.05 seconds\n```\n\nThe next example selects products from the INVENTORY\
    \ table that are currently stocked in inventory. Note that the predicates NOT\
    \ IS NULL or IS NOT NULL can be specified to produce the same results.\n\n# SQL\
    \ Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n        INVENQTY,\n        INVENCST\n\
    \        FROM INVENTORY\n        WHERE INVENQTY IS NOT NULL;\nQUIT;\n```\n\n#\
    \ Results\n\n| Product Number | Inventory Quantity | Inventory Cost |\n| 1110\
    \ | 20 | $45,000.00 |\n| 1700 | 10 | $28,000.00 |\n| 5001 | 5 | $1,000.00 |\n\
    | 5002 | 3 | $900.00 |\n| 5003 | 10 | $2,000.00 |\n| 5004 | 20 | $1,400.00 |\n\
    | 5001 | 2 | $1,200.00 |\n\nThe IS MISSING predicate performs identically to the\
    \ IS NULL predicate by selecting one or more rows containing a missing value (null).\
    \ The only difference is that specifying IS NULL is the ANSI standard way of expressing\
    \ the predicate and IS MISSING is commonly used in SAS. The"
