    \ way to process the same data while generating the same results would be to specify\
    \ the condition, “SOFTWARE”, first as follows:\n\n# SQL Code (More Efficient)\n\
    \n```\nPROC SQL STIMER;\nSELECT *\n    FROM PRODUCTS\n    WHERE UPCASE(PRODTYPE)\
    \ IN ('SOFTWARE', 'LAPTOP');\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL\
