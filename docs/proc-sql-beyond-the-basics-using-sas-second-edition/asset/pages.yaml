- pgno: 123
  md: "# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_123_0.png)\n\n# Using\
    \ Scalar Expressions with Selected Columns\n\nIn computing terms, a scalar refers\
    \ to a quantity represented by a single number or value. The value is not represented\
    \ as an array or list of values, but as a single value. For example, the value\
    \ 7 is a scalar value, but (0,0,7) is not. PROC SQL allows the use of scalar expressions\
    \ and constants with selected columns. Typically, these expressions replace or\
    \ augment one or more columns in the SELECT statement. To illustrate how a scalar\
    \ expression is used, assume that a value of 7.5% representing the sales tax percentage\
    \ is computed for each product in the PRODUCTS table. The results consist of the\
    \ product name, product cost, and derived computed sales tax column.\n\nNote:\
    \ Although the computed column contains the results of the sales tax computation\
    \ for each product, it does not contain a column heading.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n    SELECT prodname, prodcost,\n        .075 * prodcost\n    FROM PRODUCTS;\n\
    QUIT;\n```"
  merge: -1
  img_proc: true
