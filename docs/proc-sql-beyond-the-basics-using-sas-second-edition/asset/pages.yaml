- pgno: 214
  md: '# Integrity Constraints


    The reliability of databases and the data within them is essential to every organization.
    Decision-making activities depend on the correctness and accuracy of any and all
    data contained in key applications, information systems, databases, decision support
    and query tools, as well as other critical systems. Even the slightest hint of
    unreliable data can affect decision-making capabilities, accuracy of reports,
    and, in those worst case scenarios, loss of user confidence in the database environment
    itself.


    Because data should be correct and free of problems, an integral part of every
    database environment is a set of rules that the data should adhere to. These rules,
    often referred to as database-enforced constraints, are applied to the database
    table structure itself and determine the type and content of data that is permitted
    in columns and tables.


    By implementing database-enforced integrity constraints, you can dramatically
    reduce data-related problems and additional programming work in applications.
    Instead of coding complex data checks and validations in individual application
    programs, you can build database-enforced constraints into the database itself.
    This work can eliminate the propagation of column duplication, invalid and missing
    values, lost linkages, and other data-related problems.


    # Defining Integrity Constraints


    You define integrity constraints by specifying column definitions and constraints
    at the time a table is created with the CREATE TABLE statement, or by adding,
    changing, or removing a table’s column definitions with the ALTER TABLE statement.
    The rows in a table are then validated against the defined integrity constraints.


    # Types of Integrity Constraints


    The first type of integrity constraint is referred to as a column and table constraint.
    This type of constraint essentially establishes rules that are attached to a specific
    table or column. The type of constraint is generally specified through one or
    two clauses with their distinct values as follows.


    # Column and Table Constraints


    +   - NOT NULL

    +   - UNIQUE

    +   - CHECK


    # Preventing Null Values with a NOT NULL Constraint


    A null value is essentially a missing or unknown value in the data. When unchecked,
    null values can often propagate themselves throughout a database. When a NULL
    appears in a mathematical equation, the returned result is also a null or missing
    value. When a NULL is used in a comparison or a logical expression, the returned
    result is unknown. The occurrence of null values presents problems during search,
    joins, and index operations. The ability to prevent the propagation of null'
  merge: -1
  img_proc: true
- pgno: 215
  md: "values in a column with a NOT NULL constraint is a powerful feature of the\
    \ SQL procedure. This constraint should be used as a first line of defense against\
    \ potential problems that result from the presence of null values and the interaction\
    \ of queries processing data.\n\nUsing the CREATE TABLE or ALTER TABLE statement,\
    \ you can apply a NOT NULL constraint to any column where missing, unknown, or\
    \ inappropriate values appear in the data. Suppose that you need to avoid the\
    \ propagation of missing values in the CUSTCITY (Customer’s Home City) column\
    \ in the CUSTOMER_CITY table. By specifying the NOT NULL constraint for the CUSTCITY\
    \ column in the CREATE TABLE statement, you prevent the propagation of null values\
    \ in a table.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE CUSTOMER_CITY\n\
    \        (CUSTNUM NUM,\n         CUSTCITY CHAR(20) NOT NULL);\nQUIT;\n```\n\n\
    Once the CUSTOMER_CITY table is created and the NOT NULL constraint is defined\
    \ for the CUSTCITY column, only non-missing data for the CUSTCITY column can be\
    \ entered. Using the INSERT INTO statement with a VALUES clause, you can populate\
    \ the CUSTOMER_CITY table while adhering to the assigned NOT NULL integrity constraint.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    INSERT INTO CUSTOMER_CITY\n        VALUES(101,'La\
    \ Mesa Computer Land')\n        VALUES(1301,'Spring Valley Byte Center');\nQUIT;\n\
    ```\n\nThe SAS log shows the two rows of data that satisfy the NOT NULL constraint,\
    \ and the rows successfully being added to the CUSTOMER_CITY table.\n\n# SAS Log\
    \ Results\n\n```\nPROC SQL;\n    INSERT INTO CUSTOMER_CITY\n        VALUES(101,'La\
    \ Mesa Computer Land')\n        VALUES(1301,'Spring Valley Byte Center');\nNOTE:\
    \ 2 rows were inserted into WORK.CUSTOMER_CITY.\n\n    QUIT;\nNOTE: PROCEDURE\
    \ SQL used:\n      real time          0.22 seconds\n      cpu time           0.02\
    \ seconds\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: "When you define a NOT NULL constraint and then attempt to populate a table\
    \ with one or more missing data values, the rows will be rejected and the table\
    \ will be restored to its original state. Essentially, the insert fails because\
    \ the NOT NULL constraint prevents any missing values for a defined column from\
    \ populating a table. In the next example, several rows of data with a defined\
    \ NOT NULL constraint are prevented from being populated in the CUSTOMER_CITY\
    \ table because one row contains a missing CUSTCITY value.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n    INSERT INTO CUSTOMER_CITY\n        VALUES (101,'La Mesa Computer\
    \ Land')\n        VALUES (1301,'Spring Valley Byte Center')\n        VALUES (1801,'');\n\
    QUIT;\n```\n\nThe SAS log shows that the NOT NULL constraint has prevented the\
    \ three rows of data from being populated in the CUSTOMER_CITY table. The violation\
    \ caused an error message that resulted in the failure of the add/update operation.\
    \ The UNDO_POLICY = REQUIRED option reverses all adds/updates that have been performed\
    \ to the point of the error. This prevents errors or partial data from being propagated\
    \ in the database table. The following SAS log results illustrate the error condition\
    \ that caused the add/update operation to fail.\n\n# SAS Log Results\n\n```\n\
    PROC SQL;\n    INSERT INTO CUSTOMER_CITY\n        VALUES (101,'La Mesa Computer\
