    \ 5002 |\n| 1006 | 500 | 901 | 4 | $396.00 | 6000 |\n| 1007 | 500 | 401 | 7 |\
    \ $23,100.00 | 1200 |\n\n# Comparing a Set of Values\n\nA subquery can have multiple\
    \ values returned for a single column to the outer query. But there are special\
    \ keywords that permit comparison operators to be used in subqueries to process\
