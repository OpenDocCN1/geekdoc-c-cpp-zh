    \      73\nERROR 73-322: Expecting an AS.\n            FROM PRODUCTS\n       \
    \         WHERE PRODTYPE = 'Software';\n```\n\nIn the next example, with the NOEXEC\
    \ option still in effect, the AS keyword is specified with the CREATE TABLE statement,\
