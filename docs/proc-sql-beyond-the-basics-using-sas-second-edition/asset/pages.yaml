    \ Software | Software | $299.00 |\n| 4 | 5004 | Graphics Software | Software |\
    \ $299.00 |\n\nSuppose that you want to add a new row of data to this view. This\
    \ can be accomplished by specifying the corresponding values in a VALUES clause\
    \ as follows.\n\n# SQL Code\n\n```\nPROC SQL;\n    INSERT INTO SOFTWARE_PRODUCTS_VIEW\n\
    \        VALUES (6002, 'Security Software', 'Software', 375.00);\nQUIT;\n```\n\
    \nAs seen from the view results, the INSERT INTO statement added the new row of\
    \ data corresponding to the WHERE logic in the view. The view contains the new\
    \ row and consists of the value 6002 in product number, “Security Software” in\
    \ product name, “Software” in product type, and $375.00 in product cost.\n\n#\
    \ View Results\n\n|  | Product Number | Product Name | Product Type | Product\
    \ Cost |\n|---|---|---|---|---|\n| 1 | 5001 | Spreadsheet Software | Software\
    \ | $299.00 |\n| 2 | 5002 | Database Software | Software | $399.00 |\n| 3 | 5003\
    \ | Wordprocessor Software | Software | $299.00 |\n| 4 | 5004 | Graphics Software\
    \ | Software | $299.00 |\n| 5 | 6002 | Security Software | Software | $375.00\
    \ |\n\nAs depicted in the table results, the new row of data was added to the\
    \ PRODUCTS table using the view called SOFTWARE_PRODUCTS_VIEW. The new row in\
    \ the PRODUCTS table contains the value 6002 in product number, “Security Software”\
