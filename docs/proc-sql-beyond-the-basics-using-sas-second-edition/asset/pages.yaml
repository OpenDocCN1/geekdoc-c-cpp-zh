    # Introduction


    When it comes to tracking down the source of SQL coding problems, users can be
    very resourceful. To find all those pesky errors, warnings, notes, and unexpected
    results, you need to carefully inspect the SAS log and telltale clues from code
    reviews and sample runs. Using reliable troubleshooting and debugging techniques
    will help get to the root of any syntax, data, system-related, and logic errors
    that are or could be problematic to the successful execution of a PROC SQL program.


    This chapter introduces a number of strategies and techniques for troubleshooting
    and debugging SQL procedure coding problems. The guidelines presented in this
    chapter will help you learn about the different types of bugs, the steps involved
    in troubleshooting problems, the types of errors that can occur, and the options
    and statements that are available in the SQL procedure to troubleshoot and debug
    problems.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# The World of Bugs


    Since the birth of the software industry, software problems (often referred to
    as *bugs*) have been created by programmers (and users) of all skill levels in
    virtually every conceivable form. A bug is something the software or a program
    does that it is not supposed to do. When the software encounters a bug, it can
    cause the software to cease to operate or to misbehave.


    Bugs come in all forms, shapes, and sizes. A problem that occurs while you’re
    using the SQL procedure incorrectly and directly violating the rules of the language
    is referred to as a *usage error*. The severity of these types of errors depends
    on the nature of the violation as well as the effect on the user. Generally speaking
    though, a usage error results in a syntax error and the stoppage of the program
    or step.


    Other types of bugs can be problematic, too. Bugs such as resource problems, data
    dependencies, and implementation errors can cause a program step to stop or produce
    unreliable results, which will then display errors or warnings in the SAS log.


    # The Debugging Process


    The debugging process consists of a number of recommended steps to correct an
    identified problem and verify that it does not reappear. The objective is to identify,
    classify, fix, and verify a problem in a PROC SQL step, program, or application
    as quickly and easily as possible. Not every problem requires the application
    of each step recommended in this chapter. Rather, you can pick and choose from
    the suggestions to effectively correct problems and make sure they do not reappear.
    Adhering to a methodical and effective debugging process increases the likelihood
    that problems are identified and fixed correctly, thereby expediting and improving
    the way you handle problems.


    To further explore this topic, see *Effective Methods for Software Testing* by
    William E. Perry (Wiley Publishing, Inc., 2006) and *The Science of Debugging*
    by Matthew A. Telles and Yuan Hsieh (The Coriolis Group, 2001).


    The debugging process consists of five steps. See Table 9.1.'
  merge: -1
  img_proc: true
- pgno: 347
  md: "# Table 9.1: Debugging Process Steps and Tasks\n\n| Debugging Step | Task Description\
    \ |\n|---|---|\n| Problem Identification | 1. Determine if a bug exists in the\
    \ code.\n2. Determine what the problem is by playing detective.\n3. Describe why\
    \ the problem is a bug.\n4. Determine what the code should do.\n5. Determine what\
    \ the code is doing. |\n| Information Collection | 1. Collect user comments and\
    \ feedback.\n6. Collect personal observations and symptoms.\n7. Review SAS log\
    \ information.\n8. Collect test case(s) that highlight the problem.\n9. Capture\
    \ environmental information (for example, system settings, operating environment,\
    \ external elements, etc.). |\n| Problem Assessment & Classification | 1. Develop\
    \ a theory about what caused the problem.\n10. Review the code.\n11. Classify\
    \ the problem into one of the following categories:\n    - Requirements problem\n\
    \    - Syntax error\n    - CPU problem\n    - Memory problem\n    - Storage problem\n\
    \    - I/O problem\n    - Logic problem |\n| Problem Resolution | 1. Propose a\
    \ solution.\n12. Describe why the solution will fix the problem.\n13. Verify that\
    \ the solution will not cause additional problems.\n14. Fix the problem by implementing\
    \ the solution. |\n| Validate Solution | 1. Verify whether the problem still exists.\n\
    15. Verify whether the problem can be recreated or reproduced.\n16. Determine\
    \ whether other methods can cause the same problem to occur.\n17. Verify that\
    \ the solution does not cause other problems. |"
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Types of Problems


    The leading causes of SQL programming problems include misusing the language syntax;
    referencing data, especially column data, incorrectly; ignoring or incorrectly
    specifying system parameters; and constructing syntactically correct but illogical
    code that does not produce results as expected.


    Usage errors can cause SAS to stop processing, produce warnings, or produce unexpected
    results. Table 9.2 illustrates the four types of usage errors and briefly describes
    each.


    # Table 9.2: Types of Usage Errors


    | Problem | Description |

    |---|---|

    | Syntax | Syntax problems are a result of one or more violations of the SQL procedure
    language constructs. These problems can prevent a program from processing until
    you make the required changes. For example, a variable that is referenced in a
    SELECT statement but is not found in the referenced table causes the program to
    stop. |

    | Data | Data problems are a result of an inconsistency between the data and the
    program specification. These problems can prevent a program from processing, but
    might allow processing to continue and result in the assignment of missing, incomplete,
    or unreliable data. For example, missing values might be generated in a column
    when character data is incorrectly referenced as numeric data. |

    | System-related | System-related problems frequently result from specifying incompatible
    system options or choosing the wrong system option values. These problems can
    prevent a program from processing, but most frequently permit processing to occur
    with unsatisfactory results. For example, forgetting to specify a title statement
    has little effect on the production of output, but it might force the program
    to be rerun after the addition of one or more titles. |

    | Logic | Logic problems are frequently the result of not specifying a coding
    condition correctly. For example, specifying an OR condition when an AND condition
    is needed might produce wrong results without any warnings, errors, or notes.
    |


    Other sources of problems can occur in a program for a variety of reasons. Table
    9.3 illustrates these other problem sources and briefly describes each.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Table 9.3: Other Types of Errors


    | Problem | Description |

    |---|---|

    | Feature Creep | Additional features can creep into a program or application
    during the design, implementation, or testing phases. This can create a greater
    likelihood of problems. |

    | Solution Complexity | More complex or esoteric solutions can also translate
    into problems. Difficult-to-maintain programs can result. |

    | Requirements | Requirements might be inadequately stated, misunderstood, or
    omitted. In these situations, programs might not meet the needs of the user community
    and be classified as bugs. |

    | Testing Environment | Inadequate testing environments, poor test plans, or insufficient
    test time often lead to bug-filled programs. In these situations, bugs can slip
    through the testing phase and into the production environment. |


    # Troubleshooting and Debugging Techniques


    PROC SQL provides numerous troubleshooting and debugging capabilities for the
    practitioner to choose from. From statements to options to macro variables, you
    can use the various techniques to control the process of finding and gathering
    information about SQL procedure coding problems quickly and easily.


    # Validating Queries with the VALIDATE Statement


    The SQL procedure syntax checker identifies syntax errors before any data is processed.
    Syntax checking is automatically turned on in the SQL procedure without any statements
    or options being specified. But to enable syntax checking without automatically
    executing a step, you can specify a VALIDATE statement at the beginning of a SELECT
    statement or, as will be presented later, specify the NOEXEC option.


    The VALIDATE statement is available for SAS users to control what SELECT statement
    is checked. Because you specify a VALIDATE statement before a SELECT statement,
    you are better able to control the process of debugging code. A message that indicates
    syntax correctness is automatically displayed in the SAS log when code syntax
    is valid. Otherwise, an error message is displayed that identifies the coding
    violation. In the next example, a VALIDATE statement is specified at the beginning
    of a SELECT statement to enable syntax checking without code execution. The SAS
    log shows that the code contains valid syntax and automatically displays a message
    to that effect.'
  merge: -1
