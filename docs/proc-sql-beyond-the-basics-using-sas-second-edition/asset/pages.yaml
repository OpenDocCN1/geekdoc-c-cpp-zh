- pgno: 295
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n       \
    \ WHERE prodcost < 300.00 AND\n            prodtype = 'Phone';\nQUIT;\n```\n\n\
    # Results\n\n| Product Number | Product Name | Manufacturer Number | Product Type\
    \ | Product Cost |\n| 2101 | Analog Cell Phone | 210 | Phone | $35.00 |\n| 2102\
    \ | Digital Cell Phone | 210 | Phone | $175.00 |\n| 2200 | Office Phone | 220\
    \ | Phone | $130.00 |\n\nThe INTERSECT approach can be constructed to produce\
    \ the same results as in the previous example. The INTERSECT process assumes that\
    \ the tables in each query are structurally identical to each other. It overlays\
    \ the columns from both queries based on position in the SELECT statement. Should\
    \ you attempt to intersect two queries with different table structures, the process\
    \ might fail due to differing column types, or the results might contain data\
    \ integrity issues.\n\nThe most significant distinction between the two approaches,\
    \ and one that might affect large table processing, is that the first query example\
    \ (using the AND operator) takes less time to process: 0.05 seconds versus 0.17\
    \ seconds for the second approach (using the INTERSECT operator). The next example\
    \ shows how the INTERSECT operator achieves the same result less efficiently.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT * ①\n        FROM PRODUCTS\n      \
    \  WHERE prodcost < 300.00\nINTERSECT ②\nSELECT * ①\n    FROM PRODUCTS\n    WHERE\
    \ prodtype = \"Phone\";\nQUIT;\n```\n\n① It is assumed that the tables in both\
    \ queries are structurally identical because the wildcard character \"*\" is specified\
    \ in the SELECT statement.\n\n② The INTERSECT operator produces rows that are\
    \ common to both queries."
  merge: -1
