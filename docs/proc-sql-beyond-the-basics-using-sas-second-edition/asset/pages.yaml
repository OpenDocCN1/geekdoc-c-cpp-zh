    \ SQL used (Total process time):\n    real time        0.08 seconds\n    cpu time\
    \         0.07 seconds\n```\n\n# Cartesian Product Joins\n\nAs mentioned previously,\
    \ the Cartesian product (or cross join) represents all possible combinations of\
    \ rows and columns from the joined tables. To be exact, it represents the sum\
    \ of the number of columns of the input tables plus the product of the number\
    \ of rows of the input tables. Put another way, it represents each row from the\
    \ first table matched with each possible row from the second table, and so on.\
    \ For example, if you performed a join operation on one table that consists of\
    \ 100,000 rows and on a second table that consists of 10,000 rows, you would get\
    \ a Cartesian product that consists of 10 million rows.\n\nAlthough the Cartesian\
    \ product serves a very useful purpose in the relational model, it is essentially\
    \ meaningless for a user to intentionally produce it as a final table. Besides\
    \ being large, Cartesian products contain too much information and make it difficult,\
    \ if not impossible, for the practitioner to select what is salient. It is only\
    \ when you subset the Cartesian product by using a WHERE clause that your data\
    \ becomes quantifiable and manageable. For more information on Cartesian product\
    \ joins and examples that illustrate the results of these joins, go to the Author\
    \ Page for this book at support.sas.com/lafler.\n\n# Inner Joins\n\nAs mentioned\
    \ previously, inner joins can handle a maximum of 256 tables at a time, and are\
    \ the most recognized and widely used type of join. They are principally used\
    \ to restrict rows where the"
