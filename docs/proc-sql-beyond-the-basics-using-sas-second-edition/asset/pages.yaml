    # Introduction


    A book on PROC SQL would not be complete without some discussion of query optimization
    and performance. Enabling a query to run efficiently involves writing code that
    can take advantage of the PROC SQL query optimizer. Because PROC SQL is designed
    to handle a variety of processes while accommodating small to large database environments,
    this chapter presents a number of query tuning strategies, techniques, and options
    to help you to write more efficient PROC SQL code. In this chapter, you will find
    tips and suggestions to help identify areas where a query’s inefficiencies might
    exist and to conduct the tuning process to achieve the best performance possible.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Understanding Performance Tuning


    Performance tuning is the process of improving the way a program operates. It
    involves taking a program and seeing what can be done to improve performance in
    an intelligent, controlled manner. As you might imagine, a tuned program is one
    that gets the most from the existing hardware and software environment.


    Performance tuning involves measuring, evaluating, and modifying a program until
    it uses the minimum amount of computer resources to complete its execution. The
    biggest problem with the tuning process is that it is sometimes difficult to determine
    the amount of computer resources that a program uses. Complicating matters further,
    adequate and complete information about resource utilization is often unavailable.
    In fact, no simple formula exists to determine how efficiently a program runs.
    Often the only way to assess whether a program is running efficiently is to evaluate
    its performance under varying conditions, such as during interactive use or during
    shortages of specific resources including memory and storage.


    Performance issues might be difficult to identify. It is possible to have a program
    that operates without any apparent problem, but does not perform as efficiently
    as it could. In fact, a program might perform well in one environment and poorly
    in another. Take, for example, an organization that has a shortage of Direct Access
    Storage Device (DASD). A program that uses excessive amounts of this resource
    might be deemed a poor performer under these circumstances. But if the same program
    were run in an environment that had adequate levels of DASD, it might not be suspected
    or tagged as a poor performer. This distinction demonstrates the subjectivity
    that is frequently used to determine how a program performs and how it is linked
    to the specific needs (related to resource issues) that an organization has at
    any point in time.


    # Sorting and Performance


    Sorting data in the SQL procedure, as in other parts of SAS, involves CPU and
    memory-intensive operations. When the table size is large, and CPU and/or memory
    resources are in short supply or simply not available, the number of sorts in
    programs must be minimized. You can minimize problems by understanding your query’s
    requirements and remembering a few simple guidelines.


    Performance bottlenecks can occur if sorts are performed on disk as opposed to
    in memory because processing on disk is typically slower than processing in memory.
    The most logical and efficient place to perform a sort is in memory. If the sort
    requires more space than can fit in available memory, the sort must be performed
    on disk. The objective is to determine how much space a sort will require as well
    as where the sort will be performed before the sort is executed.


    The performance of a sort is most influenced by the number of rows selected in
    a query. To reduce the row count, select specific parts of a table for processing
    rather than selecting the entire table. Another performance consideration is to
    reduce the number of columns that are specified in an ORDER BY clause. The technique
    of concatenating two or more columns as opposed to specifying each column individually
    can be used. Finally, sort performance can be influenced by the size of the columns
    that'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'are specified in an ORDER BY clause. To reduce a column’s length, built-in
    functions such as SUBSTR and TRIM can be used.


    # User-Specified Sorting (SORTPGM= System Options)


    You can control what sort utility SAS uses when performing sorts. By specifying
    the SORTPGM= system option, you can direct SAS to use the best possible sort utility
    for the environment in question. The SORTPGM= system options are displayed in
    Table 10.1.


    Table 10.1: SORTPGM= System Options


    | Sort Option | Purpose |

    |---|---|

    | BEST | The BEST option uses the sort utility that is best suited to the data.
    |

    | HOST | The HOST option tells SAS to use the host sort utility that is available
    on your host computer. This option might be the most efficient for large tables
    that contain many rows of data. |

    | SAS | The SAS option tells SAS to use the sort utility that is supplied with
    SAS. |


    The next example illustrates how to use the SORTPGM= option to select the sort
    utility that is most suited to the data. Both options use the name that is specified
    in the SORTNAME= option.


    ```

    OPTIONS SORTPGM=BEST;


    <or>


    OPTIONS SORTPGM=HOST;

    ```


    # Automatic Sorting


    Using the SELECT DISTINCT clause invokes an internal sort to remove duplicate
    rows. The single exception is when an index exists. If an index exists, then the
    index is used to eliminate the duplicate rows.


    The results of a grouped query are automatically sorted using the grouping columns.
    When the SELECT clause contains only the columns that are listed in the GROUP
    BY clause along with any summary functions, then the duplicates in each group
    based on the grouping columns are removed as soon as any defined summary functions
    are performed. If additional columns then appear in the SELECT clause, the rows
    are not collapsed and therefore duplicates are not removed.'
  merge: -1
  img_proc: true
- pgno: 376
  md: "# Grouping and Performance\n\nAs with the ORDER BY clause, processes such as\
    \ the GROUP BY clause can also impact the speed of a query. Because the GROUP\
    \ BY clause can trigger sort processing, much of what was discussed with the ORDER\
    \ BY clause also applies here. In addition, it is recommended that you avoid grouping\
    \ redundant columns by keeping the number of grouping columns to a minimum.\n\n\
    # Splitting Tables\n\nSplitting tables involves moving some of the rows from one\
    \ table to another table. Data is split for the purpose of separating some predetermined\
    \ range of data, such as historical data from current data, so that query performance\
    \ is improved. This reduces the burden imposed on queries that only access current\
    \ data. The next example shows the current year’s data being copied and then removed\
    \ from a table that contains five years of data.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    CREATE TABLE INVENTORY_CURRENT AS\n        SELECT *\n            FROM INVENTORY\n\
    \                WHERE YEAR(ORDDATE) = YEAR(TODAY());\n\n    DELETE FROM INVENTORY\n\
    \        WHERE YEAR(ORDDATE) = YEAR(TODAY());\nQUIT;\n```\n\n# Indexes and Performance\n\
    \nIndexes can be used to allow rapid access to table rows. Rather than physically\
    \ sorting a table (as performed by the ORDER BY clause or PROC SORT), an index\
    \ is designed to set up a logical arrangement for the data without the need to\
    \ physically sort it. This has the advantage of reducing CPU, I/O, and memory\
    \ requirements. It also reduces data access time when using WHERE clause processing\
    \ (which is discussed in the “Optimizing WHERE Clause Processing with Indexes”\
    \ section).\n\nIndexes are useful, but they do have drawbacks. As data in a table\
    \ is inserted, modified, or deleted, an index must be updated to address the changes.\
    \ This automatic feature requires additional CPU resources to process any changes\
    \ to a table. Also, as a separate structure in its own right, an index can consume\
    \ considerable storage space. As a consequence, care should be exercised not to\
    \ create too many indexes but to assign indexes to the most discriminating variables\
    \ in a table. Here are a few suggestions for creating indexes:\n\n+   - Sort data\
    \ in ascending order on the key column prior to creating the index.\n+   - Sort\
    \ data by the key variable first to achieve the greatest performance improvement."
  merge: -1
  img_proc: true
- pgno: 377
  md: '+   - Sort data in ascending order by the key variable before it is appended
    to the table.

    +   - Create simple indexes, when possible, to be used by most queries.

    +   - Avoid creating one single index for all queries.

    +   - Assign indexes to the most discriminating of variables (see Table 6.1, Rules
    of Cardinality, in Chapter 6).

    +   - Select columns that are frequently the subject of summary functions (COUNT,
    SUM, AVG, MIN, MAX, etc.).

    +   - Only create indexes that are actually needed.

    +   - Avoid taxing CPU resources that are associated with index maintenance (maintaining
    an index during inserts, modifications, and deletions) by selecting columns that
    do not change frequently.

    +   - On some operating systems, indexes are stored as a separate file on disk,
    which uses additional memory and disk space to store the structure.

    +   - To avoid excessive and unnecessary I/O operations, prior to creating an
    index, sort data in ascending order by the most discriminating key column.

    +   - Attempt to define composite indexes by using the most discriminating of
    the variables as your first variable in the index.

    +   - Select columns that do not have numerous null values because this results
    in a large percentage of rows with the same value.


    **Note:** Indexes should only be created on tables where query search time needs
    to be optimized. Any unnecessary indexes might force SAS to expend resources needlessly—updating
    and reorganizing after insert, update, and delete operations are performed. And
    even worse, the SQL optimizer might accidentally use an index when it should not.


    **Note:** When creating an index is impractical or not feasible, consider storing
    the data in ascending (or descending) order depending on whether the query needs
    to access data from the first or second half of the table. This often results
    in a more efficient query because once a WHERE-clause expression is satisfied,
    the query stops processing.


    # Reviewing CONTENTS Output and System Messages


    While no two organizations are alike, it is not surprising to find numerous causes
    for a program to run at less than peak efficiency. Performance is frequently affected
    by the specific needs of an organization or its lack of resources. SAS users need
    to learn as many techniques as possible to correct problems that are associated
    with poorly performing queries. Attention should be given to individual program
    functions, because poor query performance often points to one or more inefficient
    techniques being used.


    Two methods can be used to better understand potential performance issues. The
    first approach uses PROC CONTENTS output to examine engine/host information and
    library data sets (tables). The output provides information to determine whether
    a table is large enough. (The page count in the'
  merge: -1
