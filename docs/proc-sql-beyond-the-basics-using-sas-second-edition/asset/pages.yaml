    # Outer Joins


    As the previous examples in this chapter have shown, an inner join disregards
    any rows where the search condition is not met. This differs significantly from
    the way an outer join groups tables. In contrast with an inner join, an outer
    join keeps rows that match the ON (search) condition, as well as preserving some
    or all of the unmatched data from one or both of the tables. Essentially, an outer
    join retains rows from one table even when they do not match rows in the second
    table. This distinction is critical because this is what truly differentiates
    an outer join from an inner join.


    Next, an outer join is capable of processing a maximum of two tables at a time,
    whereas (under the SAS implementation) an inner join is able to process a maximum
    of 256 tables.


    Another difference has to do with how you specify outer join syntax. The comma
    that is used to designate or delimit one table from the other table in the FROM
    clause of inner joins is replaced with one of the following keywords: LEFT JOIN,
    RIGHT JOIN, or FULL JOIN in outer joins. Additionally, the WHERE clause expression
    that is used to restrict what rows are kept in the result table is replaced with
    the ON keyword.


    Finally, an outer join is considered to be an asymmetric join (Lorie, Raymond
    A., and Jean-Jacques Daudenarde, SQL & Its Applications, page 87). Unlike inner
    joins, an outer join does not select rows proportionally from its parts or tables.


    # Left Outer Joins


    Let’s look at how a left join is applied in a real-world situation. Suppose that
    you want to see a list of all manufacturers, their city locations, their manufacturer
    numbers, their product types, and their product costs (if available) without leaving
    out those manufacturers that do not have products yet. This means that the MANUFACTURERS
    table (left table) acts as the master table having its rows preserved while the
    PRODUCTS table (right table) acts as the contributing table (subordinate table).
    The following left outer join example effectively retains those matched rows from
    both tables as well as retaining those rows from the left table that have no match
    in the right table.'
