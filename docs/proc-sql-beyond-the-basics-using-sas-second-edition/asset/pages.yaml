- pgno: 120
  md: "the manufacturer city and manufacturer state columns from the MANUFACTURERS\
    \ table are concatenated so that the second column immediately follows the first.\
    \ Although the two character strings are successfully concatenated, the output\
    \ illustrates potential problems as a result of using the concatenation operator.\n\
    \nThe next example shows that because the first column has a “fixed” length, blanks\
    \ are automatically padded to the entire length of the first concatenated column\
    \ for each row of data. As a result of using the concatenation operator, the column\
    \ headers for both columns are suppressed. Readers are cautioned that due to the\
    \ loss of some or all of the column header information, a true understanding of\
    \ the contents of the output may be in jeopardy.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    SELECT manucity || manustat\n    FROM MANUFACTURERS;\nQUIT;\n```\n\n# Results\n\
    \n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_120_0.png)\n\nTo make the preceding\
    \ output appear a bit more readable and complete, you should consider a few modifications.\
    \ First, column headers could be assigned as aliases with the AS operator. The\
    \ maximum size of a user-defined column header is 32 bytes in length (adhering\
    \ to SAS naming conventions). Finally, the TRIM function (which is described in\
    \ Chapter 2, “Working with Data in PROC SQL”) could be used to remove trailing\
    \ blanks from the city column. This allows the second column to act as a floating\
    \ field."
  merge: -1
  img_proc: true
- pgno: 121
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT TRIM(manucity) || manustat AS Headquarters\n\
    \        FROM MANUFACTURERS;\nQUIT;\n```\n\n# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_121_0.png)\n\
    \nAlthough the preceding output illustrates that some changes were made, it is\
    \ still difficult to read. A few more cosmetic changes should be made to make\
    \ it more aesthetically appealing and readable. In the next section, the output\
    \ will be customized to give the data further separation.\n\n# Inserting Text\
    \ and Constants between Columns\n\nAt times, it is useful to be able to insert\
    \ text and/or constants in query output. This enables special characters including\
    \ symbols and comments to be inserted in the output. We can improve the output\
    \ in the previous example by inserting a comma “,” and a single blank space between\
    \ the manufacturer city and manufacturer state information. The final output illustrates\
    \ an acceptable way to display columnar data using a “free-floating” presentation\
    \ as opposed to fixed columns.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT trim(manucity)\
    \ || ',' || manustat\n        As Headquarters\n        FROM MANUFACTURERS;\nQUIT;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_122_0.png)\n\nAnother\
    \ method of automatically concatenating character strings, removing leading and\
    \ trailing blanks, and inserting text and constants is with the CATX function.\
    \ The next example shows the CATX function with a \", \" specified as a separator\
    \ (a blank character immediately follows the comma) between character strings\
    \ MANUCITY and MANUSTAT. Although a comma and blank character are successfully\
    \ inserted between the MANUCITY and MANUSTAT columns, the output is automatically\
    \ left justified conforming to the value assigned in the LINESIZE= system option.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT CATX(',', ', ', manucity, manustat)\n\
