- pgno: 223
  md: "# SAS Log Results\n\n```\nPROC SQL;\n    ALTER TABLE INVENTORY\n    ADD CONSTRAINT\
    \ FOREIGN_MISSING_PRODUCT_KEY FOREIGN KEY (PRODNUM)\n        REFERENCES PRODUCTS\n\
    \        ON DELETE SET NULL;\nNOTE: Table WORK.INVENTORY has been modified, with\
