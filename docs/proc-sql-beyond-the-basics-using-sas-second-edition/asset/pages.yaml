- pgno: 187
  md: "# Creating a Table Using Column-Definition Lists\n\nAlthough part of the SQL\
    \ standard, the column-definition list (like the LENGTH statement in the DATA\
    \ step) is a laborious and not very elegant way to create a table. The disadvantage\
    \ of creating a table this way is that it requires the definition of each column’s\
    \ attributes including their data type, length, informat, and format. This method\
    \ is frequently used to create columns when they are not present in another table.\
    \ Using this method results in the creation of an empty table (without rows).\
    \ The code used to create the CUSTOMERS table appears below. This example illustrates\
    \ the creation of a table with column-definition lists.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n    CREATE TABLE CUSTOMERS\n        (CUSTNUM    NUM        LABEL='Customer\
    \ Number',\n         CUSTNAME   CHAR(25)   LABEL='Customer Name',\n         CUSTCITY\
    \   CHAR(20)   LABEL='Customer''s Home City');\nQUIT;\n```\n\n# SAS Log Results\n\
    \n```\nPROC SQL;\n    CREATE TABLE CUSTOMERS\n        (CUSTNUM    NUM        LABEL='Customer\
    \ Number',\n         CUSTNAME   CHAR(25)   LABEL='Customer Name',\n         CUSTCITY\
    \   CHAR(20)   LABEL='Customer''s Home City');\nNOTE: Table CUSTOMERS created,\
    \ with 0 rows and 3 columns.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n    real time\
    \          0.81 seconds\n```\n\nYou should be aware that the SQL procedure ignores\
    \ width specifications for numeric columns. When a numeric column is defined,\
    \ it is created with a width of 8 bytes, which is the maximum precision allowed\
    \ by SAS. PROC SQL ignores numeric length specifications when the value is less\
    \ than 8 bytes. To illustrate this point, a partial CONTENTS procedure output\
    \ is displayed for the CUSTOMERS table."
  merge: -1
  img_proc: true
- pgno: 188
  md: "# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_188_0.png)\n\n| Alphabetic\
    \ List of Variables and Attributes |\n|---|---|---|---|---|\n| # | Variable |\
    \ Type | Len | Label |\n| 3 | CUSTCITY | Char | 20 | Customer's Home City |\n\
    | 2 | CUSTNAME | Char | 25 | Customer Name |\n| 1 | CUSTNUM | Num | 8 | Customer\
    \ Number |\n\nTo conserve storage space (CUSTNUM only requires maximum precision\
    \ provided in 3 bytes), a LENGTH statement could be used in a DATA step to define\
    \ CUSTNUM as a 3-byte column rather than an 8-byte column.\n\n# DATA Step Code\n\
    \n```\nDATA CUSTOMERS;\n    LENGTH CUSTNUM 3.;\n    SET CUSTOMERS;\n    LABEL\
    \ CUSTNUM = 'Customer Number';\nRUN;\n```"
