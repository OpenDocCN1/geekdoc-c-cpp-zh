  md: "# Result of Inner Query\n\n```\nPROC SQL;\n    SELECT manunum, prodnum, invqty,\
    \ invprice\n      FROM INVOICE\n        WHERE invprice > ANY ($1,495.,$798.);\n\
    QUIT;\n```\n\n+   1. PROC SQL retrieves any invoices from the outer query where\
