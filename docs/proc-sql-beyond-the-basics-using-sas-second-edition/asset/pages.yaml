- pgno: 166
  md: "In the next example, the FORMAT procedure is used to assign temporary formatted\
    \ values based on a range of values for INVENQTY. The result from executing this\
    \ simple three-step (non-SQL procedure) program shows that the actual INVENQTY\
    \ value is temporarily replaced with the “matched” value in the user-defined format.\
    \ The FORMAT statement performs a look-up process to determine how the data should\
    \ be displayed. The actual data value being looked up is not changed (or altered)\
    \ during the process, but a determination is made as to how its value should be\
    \ displayed. The BY statement specifies how BY-group processing is to be constructed.\
    \ The displayed results show the product numbers in relation to their respective\
    \ inventory quantity status.\n\n# Non-SQL Code\n\n```\nPROC FORMAT;\n  VALUE INVQTY\n\
    \    0 - 5 = 'Low on Stock - Reorder'\n    6 - 10 = 'Stock Levels OK'\n    11\
    \ - 99 = 'Plenty of Stock'\n    100 - 999 = 'Excessive Quantities';\nRUN;\n\n\
    PROC SORT DATA=INVENTORY;\n  BY INVENQTY;\nRUN;\n\nPROC PRINT DATA=INVENTORY(KEEP=PRODNUM\
    \ INVENQTY) NOOBS;\n  FORMAT INVENQTY INVQTY.;\nRUN;\n```"
  merge: -1
  img_proc: true
- pgno: 167
  md: "# Results\n\n| prodnum | invenqty |\n| --- | --- |\n| 5001 | Low on Stock -\
    \ Reorder |\n| 5002 | Low on Stock - Reorder |\n| 5001 | Low on Stock - Reorder\
    \ |\n| 1700 | Stock Levels OK |\n| 5003 | Stock Levels OK |\n| 1110 | Plenty of\
    \ Stock |\n| 5004 | Plenty of Stock |\n\nThe same results can also be derived\
    \ using a CASE expression in the SQL procedure. In the next example, a CASE expression\
    \ is constructed using the INVENTORY table to assign values to the user-defined\
    \ column Inventory_Status. The biggest difference between the FORMAT procedure\
    \ approach and a CASE expression is that the latter uses one step and does not\
    \ replace the actual data value with the recoded result. Instead, it creates a\
    \ new column that contains the result of the CASE expression.\n\n# SQL Code\n\n\
    ```\nPROC SQL;\n    SELECT PRODNUM,\n        CASE\n            WHEN INVENQTY LE\
    \ 5\n                THEN 'Low on Stock - Reorder'\n            WHEN 6 LE INVENQTY\
    \ LE 10\n                THEN 'Stock Levels OK'\n            WHEN 11 LE INVENQTY\
    \ LE 99\n                THEN 'Plenty of Stock'\n            ELSE 'Excessive Quantities'\n\
    \        END AS Inventory_Status\n    FROM INVENTORY\n    ORDER BY INVENQTY;\n\
    QUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Results\n\nThe SAS System\n\n| Product Number | Inventory_Status |\n|---|---|\n\
    | 5001 | Low on Stock - Reorder |\n| 5002 | Low on Stock - Reorder |\n| 5001 |\
    \ Low on Stock - Reorder |\n| 1700 | Stock Levels OK |\n| 5003 | Stock Levels\
    \ OK |\n| 1110 | Plenty of Stock |\n| 5004 | Plenty of Stock |\n\n# Logic and\
    \ Nulls\n\nThe existence of null values frequently introduces complexities for\
    \ programmers. Instead of coding two-valued logic conditions, such as “True” and\
    \ “False,” logic conditions must be designed to handle three-valued logic: “True,”\
    \ “False,” and “Unknown.” When developing logic conditions, programmers need to\
    \ be ready to deal with the possibility of having null values. Program logic should\
    \ test whether the current value of an expression contains a value or is empty\
    \ (null).\n\nLet’s examine a CASE expression that is meant to handle the possibility\
    \ of having missing values in a table. Returning to an example presented earlier\
    \ in this chapter, suppose that you want to assign a value of “South East,” “Central,”\
    \ “South West,” “Missing,” or “Unknown” to each of the manufacturers based on\
    \ their state of residence.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT MANUNAME,\n\
    \           MANUSTAT,\n           CASE\n               WHEN MANUSTAT = 'CA' THEN\
    \ 'South West'\n               WHEN MANUSTAT = 'FL' THEN 'South East'\n      \
    \         WHEN MANUSTAT = 'TX' THEN 'Central'\n               WHEN MANUSTAT =\
    \ ' ' THEN 'Missing'\n               ELSE 'Unknown'\n           END AS Region\n\
    \    FROM MANUFACTURERS;\nQUIT;\n```"
  merge: -1
  img_proc: true
