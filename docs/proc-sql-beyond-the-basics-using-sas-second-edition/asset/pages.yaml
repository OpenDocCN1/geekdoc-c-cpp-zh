- pgno: 190
  md: "# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_190_0.png)\n\n| # | Variable\
    \ | Type | Len | Format | Label |\n|---:|---|---|---:|---|---|\n| 3 | MANUNUM\
    \ | Num | 8 |  | Manufacturer Number |\n| 5 | PRODCOST | Num | 8 | DOLLAR9.2 |\
    \ Product Cost |\n| 2 | PRODNAME | Char | 25 |  | Product Name |\n| 1 | PRODNUM\
    \ | Num | 8 |  | Product Number |\n| 4 | PRODTYPE | Char | 15 |  | Product Type\
    \ |\n\nAs before, to conserve storage space you can use a LENGTH statement in\
    \ a DATA step to override the default 8-byte column definition for numeric columns.\n\
    \n# DATA Step Code\n\n```\nDATA PRODUCTS;\n    LENGTH PRODNUM MANUNUM 3.\n   \
    \        PRODCOST 5.;\n    SET PRODUCTS (DROP=PRODNUM MANUNUM PRODCOST);\n   \
    \ LABEL PRODNUM = 'Product Number'\n          MANUNUM = 'Manufacturer Number'\n\
    \          PRODCOST = 'Product Cost';\n    FORMAT PRODCOST DOLLAR9.2;\nRUN;\n\
    ```"
