  md: "# Results\n\nThe SAS System\n\n| Product Name | Product Cost | Sales Tax |\n\
    |---|---|---|\n| Dream Machine | $3,200.00 | $240.00 |\n| Business Machine | $3,300.00\
    \ | $247.50 |\n| Travel Laptop | $3,400.00 | $255.00 |\n| Analog Cell Phone |\
    \ $35.00 | $2.63 |\n| Digital Cell Phone | $175.00 | $13.13 |\n| Office Phone\
    \ | $130.00 | $9.75 |\n| Spreadsheet Software | $299.00 | $22.43 |\n| Database\
    \ Software | $399.00 | $29.93 |\n| Wordprocessor Software | $299.00 | $22.43 |\n\
    | Graphics Software | $299.00 | $22.43 |\n\n# Ordering Output by Columns\n\nBy\
    \ definition, tables are unordered sets of data. The data that comes from a table\
    \ does not automatically appear in any particular order. To offset this behavior,\
    \ the SQL procedure provides the ability to impose order in a table by using an\
    \ ORDER BY clause. When used, this clause orders the query results according to\
    \ the values in one or more selected columns; it must be specified after the FROM\
    \ clause.\n\nRows of data can be ordered in ascending (default order) or descending\
    \ (DESC) order for each column specified (ascending is the default order). To\
    \ illustrate how selected columns of data can be ordered, let’s first view the\
    \ PRODUCTS table and all its columns arranged in ascending order by product number\
    \ (PRODNUM).\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n\
    \        ORDER BY prodnum;\nQUIT;\n```"
