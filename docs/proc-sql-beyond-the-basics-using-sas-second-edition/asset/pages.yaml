    # Summary\n\n+   1. Performance tuning involves measuring, evaluating, and modifying\
    \ a query’s execution to achieve an optimal balance between competing computer\
    \ resources (see the “Understanding Performance Tuning” section).\n+   2. Avoid\
    \ specifying an ORDER BY clause when creating a table or view (see the “Sorting\
    \ and Performance” section).\n+   3. When sorting is necessary, specify the SORTPGM=\
    \ system option to instruct the SAS System to use the best possible sort utility\
    \ relative to the size of the database environment (see the “User-Specified Sorting”\
    \ section).\n+   4. It is recommended to keep the number of grouping columns with\
    \ the GROUP BY clause as small as possible (see the “Splitting Tables” section).\n\
    +   5. Care should be exercised to assign indexes to only those discriminating\
    \ variables in a table and to avoid creating too many indexes (see the “Indexes\
    \ and Performance” section).\n+   6. There is no advantage in creating or using\
    \ an index when a table is relatively small (usually fewer than three pages) (see\
    \ the “Reviewing CONTENTS Output and System Messages” section).\n+   7. Setting\
    \ the MSGLEVEL= system option to “I” allows SAS to display vital information (if\
    \ available) relative to the presence of one or more indexes for optimization\
    \ of WHERE clause processing (see the “Reviewing CONTENTS Output and System Messages”\
    \ section).\n+   8. Apply WHERE clause processing to restrict the number of rows\
    \ of the result table (see the “Optimizing WHERE Clause Processing with Indexes”\
    \ section).\n+   9. When constructing a chain of AND conditions in a WHERE clause,\
    \ specify the most restrictive conditional values first (see the “Constructing\
    \ Efficient Logic Conditions” section)."
