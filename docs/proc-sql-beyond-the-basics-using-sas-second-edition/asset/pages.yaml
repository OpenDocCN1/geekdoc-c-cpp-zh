- pgno: 332
  md: "# SAS Log Results\n\n```\nPROC SQL;\n    SELECT *\n        FROM PROD_MANF_VIEW;\n\
    NOTE: The query requires remerging summary statistics back with the original data.\n\
    QUIT;\nNOTE: PROCEDURE SQL used:\n      real time            0.05 seconds\n```\n\
    \n# Results\n\n| | Manufacturer Number | Manufacturer Name |\n|$1,296.00|500|KPL\
    \ Enterprises|\n\n# Nesting Views\n\nAn important feature of views is that they\
    \ can be based on other views. This is called nesting. One view can access data\
    \ that comes through another view. In fact, there isn’t a limit to the number\
    \ of view layers that can be defined. Because of this, views can be a very convenient\
    \ and flexible way for programmers to retrieve information. Although the number\
    \ of views that can be nested is virtually unlimited, programmers should use care\
    \ to avoid nesting views too deeply. Performance-related and maintenance-related\
    \ issues can result, especially if the views are built many layers deep.\n\nTo\
    \ see how views can be based on other views, two views will be created—one view\
    \ that references the PRODUCTS table and the other view that references the INVOICE\
    \ table. In the first example, WORKSTATION_PRODUCTS_VIEW includes only products\
    \ that are related to workstations and excludes the manufacturer number. The view\
    \ produces the result displayed below.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE\
    \ VIEW WORKSTATION_PRODUCTS_VIEW AS\n        SELECT PRODNUM, PRODNAME, PRODTYPE,\
    \ PRODCOST\n            FROM PRODUCTS\n                WHERE UPCASE(PRODTYPE)=\"\
    WORKSTATION\";\nQUIT;\n```"
