- pgno: 144
  md: "# Introduction\n\nExpressions in the SQL procedure can be simple or complex\
    \ and are represented by a combination of columns, symbols, operators, functions,\
    \ constants, and literals. Specified in SQL statements and clauses, expressions\
    \ are typically used in conditional logic constructs to test or compare a value\
    \ against another value. The application of an expression in a CASE expression\
    \ allows individual rows of data to be processed and grouped using one or more\
    \ expressions. In particular, data can be recoded and reshaped to expand the data\
    \ analysis and processing perspective.\n\n# Conditional Logic\n\nAs experienced\
    \ PROC SQL programmers know, it is often necessary to test and evaluate conditions\
    \ as true or false. From a programming perspective, the evaluation of a condition\
    \ determines which of the alternate paths a program will follow. Conditional logic\
    \ in the SQL procedure is frequently implemented in a WHERE clause to reference\
    \ constants and relationships among columns and values. The SQL procedure also\
    \ allows the identification and assignment of data values in a SELECT statement\
    \ using case-expressions (which are described in the next section). To show how\
    \ constants and relationships are referenced in a WHERE clause, a simple example\
    \ is illustrated.\n\nThe next example shows a WHERE clause subsetting products\
    \ from the PRODUCTS table that cost less than $400.00. During execution, the expression\
    \ evaluates to true when the value of PRODCOST is less than $400.00. Otherwise,\
    \ when the value of PRODCOST is greater than or equal to $400.00, the expression\
    \ evaluates to false. This is an important concept because data rows are only\
    \ selected when the WHERE clause expression evaluates to true.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        WHERE PRODCOST\
    \ < 400.00;\nQUIT;\n```\n\nIn the next example, the following relation evaluates\
    \ whether the cost of a product (PRODCOST) is greater than $400.00. When the WHERE\
    \ clause expression evaluates to true, which means that PRODCOST is greater than\
    \ $400.00, then the rows of data are selected. Otherwise, when the value is less\
    \ than or equal to $400.00, the expression evaluates to false.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        WHERE PRODCOST\
    \ > 400.00;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 145
  md: "A relation can also be used with nonnumeric literals and nonnumeric columns.\
    \ In the next example, a case-sensitive expression is constructed to represent\
    \ the type of product (PRODTYPE) made by a manufacturer. When evaluated, a condition\
    \ of true or false is produced depending on whether the current value of PRODTYPE\
    \ is identical (character-by- character) to the literal value “Software”. When\
    \ a condition of true occurs, then the rows of data satisfying the expression\
    \ are selected; otherwise, they are not selected.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    SELECT *\n        FROM PRODUCTS\n            WHERE PRODTYPE = \"Software\"\
    ;\nQUIT;\n```\n\nTo ensure a character-by-character match of a character value,\
    \ the previous expression could be specified with the UPCASE function as follows.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        \
    \    WHERE UPCASE(PRODTYPE) = \"SOFTWARE\";\nQUIT;\n```\n\nWhen the relations\
    \ < and > are defined for nonnumeric values, the issue of implementation-dependent\
    \ collating sequence for characters comes into play. For example, “A” < “B” is\
    \ true, “Y” < “Z” is “true”, “B” < “A” is “false”, and so on. For more information\
    \ about character collating sequences, refer to your specific operating system\
    \ documentation.\n\n# CASE Expressions\n\nIn the SQL procedure, a CASE expression\
    \ provides a way of determining what the resulting value will be from all the\
    \ rows in a table (or view). Similar to a DATA step SELECT statement (or IF-THEN/ELSE\
    \ statement), a CASE expression is based on some condition and the condition uses\
    \ a WHEN-THEN clause to determine what the resulting value will be. An optional\
    \ ELSE expression can be specified to handle an alternative action if none of\
    \ the expression(s) identified in the WHEN condition(s) is satisfied.\n\nThe SQL\
    \ procedure supports two forms of CASE expressions: simple and searched. CASE\
    \ expressions can be specified in a SELECT clause, a WHERE clause, an ORDER BY\
    \ clause, a HAVING clause, a join construct, and anywhere an expression can be\
    \ used. A CASE expression must be a valid PROC SQL expression and conform to syntax\
    \ rules similar to DATA step SELECT-WHEN statements. Before specific CASE expression\
    \ examples are shown, it’s important to illustrate the basic syntax, which is\
    \ shown below."
  merge: -1
  img_proc: true
- pgno: 146
  md: "```\nCASE <column-name>\n    WHEN when-condition THEN result-expression\n \
    \   <WHEN when-condition THEN result-expression> ...\n    <ELSE result-expression>\n\
    END\n```\n\nThe CASE syntax contains everything from CASE to END. A column-name\
    \ can optionally be specified as part of the CASE expression. If present, it is\
    \ automatically made available to each WHEN condition. When it is not specified,\
    \ the column name must be coded in each WHEN condition. Let’s examine how a CASE\
    \ expression works.\n\nOne or more WHEN conditions can be specified in a CASE\
    \ expression and are evaluated in the order listed. If a WHEN condition is satisfied\
    \ by a row in a table (or view), then it is considered “true” and the result expression\
    \ following the THEN keyword is processed. The remaining WHEN conditions in the\
    \ CASE expression are skipped. If a WHEN condition is “false,” the next WHEN condition\
    \ is evaluated. SQL evaluates each WHEN condition until a “true” condition is\
    \ found. Or, in the event that all WHEN conditions are “false,” it then executes\
    \ the ELSE expression and assigns its value to the CASE expression’s result. A\
    \ missing value is assigned to a CASE expression when an ELSE expression is not\
    \ specified and each WHEN condition is “false.”\n\n# Simple Case Expression\n\n\
    As its name implies, a simple CASE expression provides a useful way to perform\
    \ the simplest type of comparisons. The syntax requires a column name from an\
    \ underlying table to be specified as part of the CASE expression. This not only\
    \ eliminates having to continually repeat the column name in each WHEN condition,\
    \ it also reduces the number of keystrokes, making the code easier to read (and\
    \ support). Simple CASE expressions possess the following features:\n\n+   - Allows\
    \ only equality checks.\n+   - Evaluates the specified WHEN conditions in the\
    \ order specified.\n+   - Evaluates the input-expression for each WHEN condition.\n\
    +   - Returns the result-expression of the first input-expression that evaluates\
    \ to “true.”\n+   - If no input-expressions evaluate to “true,” then the ELSE\
    \ condition is processed.\n+   - When an ELSE condition isn’t specified, a NULL\
    \ value is assigned.\n\n# Simple CASE Expression in a SELECT Clause\n\nTo best\
    \ show how a simple CASE expression works, an example in a SELECT clause is illustrated.\
    \ The objective calls for the value assignment of “East” to manufacturers in Florida,\
    \ “Central” to manufacturers in Texas, “West” to manufacturers in California,\
    \ or “Unknown” to manufacturers not residing in Florida, Texas, and California.\
    \ The manufacturer’s state of residence (MANUSTAT) column is specified in the\
    \ CASE expression along with its associated WHEN conditions with assigned values.\
    \ Finally, a column heading of Region is assigned to the derived output column\
    \ using the AS keyword."
  merge: -1
  img_proc: true
- pgno: 147
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT MANUNAME,\n            MANUSTAT,\n\
    \            CASE MANUSTAT\n                WHEN 'CA' THEN 'West'\n          \
    \      WHEN 'FL' THEN 'East'\n                WHEN 'TX' THEN 'Central'\n     \
    \           ELSE 'Unknown'\n            END AS Region\n    FROM MANUFACTURERS;\n\
    QUIT;\n```\n\n# Results\n\nThe SAS System\n\n| Manufacturer Name | Manufacturer\
    \ State | Region |\n|---|---|---|\n| Cupid Computer | TX | Central |\n| Global\
    \ Comm Corp | CA | West |\n| World Internet Corp | FL | East |\n| Storage Devices\
    \ Inc | CA | West |\n| KPL Enterprises | CA | West |\n| San Diego PC Planet |\
    \ CA | West |\n\nThe next example illustrates the process of classifying products\
    \ with a simple CASE expression in a SELECT clause. The PRODTYPE column from the\
    \ PRODUCTS table is used to assign a character value of “Hardware,” “Software,”\
    \ or “Unknown” to each product type (e.g., Laptop, Phone, Software, and Workstation).\
    \ Similar to the assignment process in the FORMAT procedure, new data values are\
    \ associated with values in the PRODTYPE column. The WHEN-THEN conditions equate\
    \ “Laptop” to “Hardware,” “Phone” to “Hardware,” “Software” to “Software,” and\
    \ “Workstation” to “Hardware.” A value of “Unknown” is assigned to products not\
    \ matching any of the WHEN-THEN logic conditions. Finally, a column heading of\
    \ Product_Classification is assigned to the new column with the AS keyword.\n\n\
    # SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n            CASE PRODTYPE\n\
    ```"
  merge: -1
  img_proc: true
