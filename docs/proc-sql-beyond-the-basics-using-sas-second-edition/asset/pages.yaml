    \ SQL PROMPT INOBS=5;\n    SELECT *\n    FROM PRODUCTS;\nWARNING: Only 5 records\
    \ were read from WORK.PRODUCTS due to INOBS= option.\nQUIT;\n```\n\n# Undocumented\
    \ PROC SQL Options\n\nThis section lists several undocumented PROC SQL options.\
    \ Although undocumented options can be freely explored and used, you should carefully\
    \ consider the ramifications before using them. Because of unannounced changes,\
    \ possible removal, or nonsupport in future releases, you should exercise care\
    \ when using them throughout SQL procedure applications. However, undocumented\
    \ options provide a wealth of opportunities for identifying and resolving coding\
    \ problems. Table 9.5 presents several of these undocumented SQL procedure options\
    \ for troubleshooting and debugging purposes.\n\n# Table 9.5: Undocumented PROC\
    \ SQL Options\n\n| Option | Description |\n|---|---|\n| _AGGR | Displays a tree\
    \ structure in the SAS log with a before-and-after summary. |\n| _ASGN | Displays\
    \ a tree structure in the SAS log that consists of resolved before-and-after names.\
    \ |\n| _DFR | Displays a before-and-after dataflow and subcall resolution in a\
    \ tagged tree structure in the SAS log. |\n| _PJD | Displays various table attributes\
    \ including the number of observations (rows), the logical record length (lrecl),\
    \ the number of restricted rows, and the size of the table in bytes. |\n\nContinued\
    \ on next page"
