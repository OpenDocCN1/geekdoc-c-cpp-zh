    \        cpu time            0.00 seconds\n```\n\nA NOT NULL constraint can also\
    \ be applied to a column in an existing table that contains data with an ALTER\
    \ TABLE statement. To successfully impose a NOT NULL constraint, you should not\
    \ have missing or null values in the column that the constraint is being defined\
    \ for. This means that the presence of one or more null values in an existing\
    \ table’s column will prevent the NOT NULL constraint from being created."
