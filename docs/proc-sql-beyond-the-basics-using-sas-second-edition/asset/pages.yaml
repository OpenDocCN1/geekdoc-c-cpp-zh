- pgno: 270
  md: "Let’s look at another example. Suppose that you want to find out the names\
    \ and invoice amounts where, for each customer, you list the names and invoice\
    \ amounts of each customer with larger invoice amounts. The next example illustrates\
    \ a useful application of a self join.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ invoice.custnum, invoice.invprice,\n    invoice_copy.custnum, invoice_copy.invprice\n\
    FROM INVOICE, INVOICE INVOICE_COPY\nWHERE invoice.invprice <\n    invoice_copy.invprice;\n\
    QUIT;\n```\n\n+   ① The INVOICE table is the primary table that is specified in\
    \ the FROM clause.\n+   ② A copy of the INVOICE table called INVOICE_COPY is joined\
    \ with the INVOICE table.\n+   ③ The WHERE clause produces the names of customers\
    \ with larger invoice amounts."
