- pgno: 244
  md: "An assortment of novel approaches has been used to rename tables. One approach,\
    \ which is shown below, uses the CREATE TABLE statement with the SELECT query\
    \ to create a new table with the desired table name, followed by the DROP TABLE\
    \ statement to delete the old table. You should be aware, however, that this is\
    \ not an efficient method to rename a table.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    CREATE TABLE MANUFACTURED_PRODUCTS AS\n        SELECT *\n            FROM\
    \ PRODUCTS;\n    DROP TABLE PRODUCTS;\nQUIT;\n```\n\n# Indexes\n\nIn database\
    \ systems, an index is a data structure that is used to locate specific rows of\
    \ data in a table. A keyword or other identifier is used by the index to search\
    \ for specific rows of interest. To better understand what an index is, it is\
    \ useful to imagine an index that is located at the end of a book. In its purest\
    \ form, the book’s index contains keywords that are listed in alphabetical order\
    \ along with the corresponding page numbers displayed in ascending order, as shown\
    \ in Figure 6.1. An index is typically made available to enable readers to skip\
    \ around to different pages or locations in a book. It is worth mentioning that\
    \ for an index to retain its intrinsic value, the keyword and page number must\
    \ correctly access the desired page(s) of interest. A more traditional approach\
    \ to reading a book is in a page-by-page sequential manner. These different approaches\
    \ are often referred to as direct access versus sequential access, respectively.\n\
    \nFigure 6.1: Keyword Index in Book\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_244_0.png)"
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Indexes provide SAS users with an access method that avoids large-table scans
    and disk sorts, which are frequently used when the optimizer is not able to find
    an efficient way to service a query. An index consists of one or more columns,
    representing a key, to uniquely identify rows within a table. When an index is
    used, it finds the storage location of the rows requested by the query’s search
    criteria and retrieves just these rows of data.


    An index is best represented as an inverted tree structure, which is sometimes
    referred to as a balanced tree (or b-tree), and is displayed in the following
    diagram. As shown in Figure 6.2, an index consists of a single root page level
    (starting point), zero or more intermediate levels (or nodes), and a leaf level
    where the actual rows of data are stored.


    # Figure 6.2: Inverted Tree Structure Known as a B-Tree


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_245_0.png)


    Because indexes are frequently too large to fit completely into primary storage
    (memory), they are stored on a secondary type of storage such as disk. In b-tree
    data structures, records or rows of data are stored in locations called leaves.
    B-trees are best suited to handle situations where some or part of the data resides
    in secondary storage. This provides an environment where the number of secondary
    disk accesses is reduced (fewer I/O operations), which results in a more cost-effective
    process.


    An index typically is used to improve the speed in which subsets of data are accessed
    and is composed of one or more character, numeric, or mixed (alphanumeric) types
    of columns. Rather than sequentially accessing rows of data or physically sorting
    a table (as performed with an ORDER BY clause or a BY statement in PROC SORT),
    an index is designed to set up a logical data arrangement without the need to
    physically sorting it. This has a distinct advantage of reducing CPU and memory
    requirements, as well as reducing data access time when using WHERE clause processing.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Designing Indexes


    There is no rule that says a table has to have an index, but when an index is
    available it can make information access and retrieval more efficient and considerably
    faster.


    When a query is executed in SAS software, the SQL optimizer evaluates the costs
    associated with the available methods and uses the most efficient method to process
    data. Processing can occur using a sequential table scan, or with an index if
    one exists. When a sequential table scan is performed, SAS starts at the beginning
    of the table, steps row-by-row through all of the rows in the table, and processes
    (retrieves) rows that match the selection criteria that is specified in the WHERE
    clause of the query.


    Indexes should be designed to provide efficient database processing when triggered
    (or referenced) in a query. To better understand the impact that an index has
    on a database application, the following things should be kept in mind:


    +   - Indexes can improve the performance of queries that do not modify data because
    the optimizer has more choices to select from to in order to determine the fastest
    way to access data.


    +   - A table with too many indexes might actually experience a performance degradation
    when using INSERT, MODIFY, or DELETE operations because all indexes must be adjusted
    to correspond to the changes made to the data in the table.


    +   - A query that specifies an exact match comparison can benefit from an index.
    For example,

    +   ```

    +   WHERE prodnum = 5001;

    +         < or >

    +   WHERE prodtype = "Laptop";

    +   ```


    +   - A query that specifies a value between a range of values can benefit from
    an index. For example,

    +   ```

    +   WHERE invenqty BETWEEN 3 AND 10;

    +         < or >

    +   WHERE invenqty >= 3 AND invenqty <= 10;

    +   ```


    +   - Queries that produce sorted output without specifying an explicit sort operation.


    +   - Queries that use a LIKE comparison operator can benefit from an index when
    the search pattern begins with a specific character string, such as "Lap%", but
    not when the search pattern begins with a wildcard, such as "%ware".


    +   - Forcing the SQL optimizer to use an index in a query (with an IDXWHERE=
    or IDXNAME= data set option) with a small table can impede performance because
    SAS would traverse the


    For example, once a specific part number is known, an index can be used to look
    up the location of the part along with its manufacturer, cost, and availability
    far more efficiently than with other methods. For more information about using
    indexes in SAS, see *The Complete Guide to Using SAS Indexes* by Michael Raithel,
    which is available from the SAS Bookstore.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'index looking for matches instead of allowing the software to process data
    using a sequential table scan.


    # Cardinality


    In the context of a database table, cardinality refers to the uniqueness, or lack
    thereof, of data values contained in a specific column of a table. The cardinality
    of a set of values refers to the uniqueness of a number of elements in a set.
    For example, the set CUSTNUM= {101, 201, 301, 401} contains four unique elements,
    and has a cardinality of four. In contrast, the set PRODTYPE = {Workstation, Laptop,
    Software, Software} contains four elements, three of which are unique, which results
    in a cardinality of three.


    An understanding of the rules of cardinality and how cardinality affects a database
    application can help determine an optimal query plan. Table 6.1 illustrates and
    describes the three types of cardinality: low, normal, and high. The cardinality
    of a set becomes higher as the more unique elements are contained in a column.
    Conversely, the lower the cardinality, the more duplicate elements are contained
    in a column.


    **Table 6.1: Rules of Cardinality**


    | Data Values Contain Large Number of Duplicate Values | Data Values Contain Some
    Unique/Some Duplicate Values | Data Values Contain Large Number of Unique Values
    |

    |---|---|---|

    | Low cardinality contains few, if any, unique values. Typical examples of column
    values with low cardinality include flags and switches, Boolean values, or gender.
    Columns of this type typically contain a larger number of duplicate values and
    make for poor indexes. | Normal cardinality contains a limited number of possible
    values. Typical examples of column values with normal cardinality include product
    type, manufacturer state, customer name, or customer home city. Columns of this
    type generally contain some unique values as well as some duplicate values. |
    High cardinality contains values that are highly unique. Column values with high
    cardinality are typically used for identification purposes and include manufacturer
    numbers, invoice numbers, or email addresses. Columns of this type generally consist
    of large numbers of unique values and make the best indexes. |


    # Index Selectivity


    An index is most effective when it is highly selective. This means that a column
    with high cardinality (as was presented in the previous section) is most selective
    when the ratio of distinct values divided by the number of rows in the table is
    as close to 1 as possible. The selectivity formula for an index can be quantified
    as follows:


    Selectivity = Unique (Distinct) Rows / Total Number Rows


    > Note: Perfect selectivity can only be reached on NOT NULL columns.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "To determine the degree of selectivity, the number of distinct rows, and the\
    \ total rows in a table for any column in a table, use the following SQL statement:\n\
    \n```\nSELECT  COUNT (DISTINCT (column-name))  /  COUNT (*)  AS\nSELECTIVITY,\n\
    \        COUNT (DISTINCT (column-name))  AS DISTINCT_VALUES,\n        COUNT (*)\
    \  AS TOTAL_ROWS\nFROM  table-name;\n\n<or>\n\nSELECT  COUNT (DISTINCT (column-name))\
    \  /  COUNT (*)  AS SELECTIVITY\nFROM  table-name;\n```\n\nTo illustrate an example\
    \ of good (and in this case perfect) selectivity, the following query selects\
    \ the CUSTNUM column divided by the total number of rows in the CUSTOMERS table\
    \ to compute the selectivity ratio:\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \  COUNT (DISTINCT (CUSTNUM))  /  COUNT(*) AS SELECTIVITY\n    FROM CUSTOMERS;\n\
    QUIT;\n```\n\n# SAS Results\n\n| SELECTIVITY |\n| 1 |\n\nA result of 1 (18 distinct\
    \ values / 18 total rows) indicates perfect selectivity and is an ideal candidate\
    \ for an index because it is 100% selective of the rows in a table.\n\nTo illustrate\
    \ an example of poor (and in this case bad) selectivity, the following query selects\
    \ the PRODTYPE column divided by the total number of rows in the PRODUCTS table\
    \ to compute the selectivity ratio:\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \  COUNT (DISTINCT (PRODTYPE))  /  COUNT(*) AS SELECTIVITY\n    FROM PRODUCTS;\n\
    QUIT;\n```\n\n# SAS Results\n\n| SELECTIVITY |\n| 0.4 |"
  merge: -1
  img_proc: true
- pgno: 249
  md: 'A result of 0.4 (4 distinct values / 10 total rows) represents low cardinality
    as well as less than good selectivity. Consequently, this column might not be
    an ideal candidate for an index because a sequential full table scan might be
    a more efficient way to process rows in a table.


    Note: A column’s selectivity should be recalculated from time-to-time because
    row inserts, updates, and deletions could change the selectivity ratio.


    # Defining Indexes


    When defining an index, first understand the purpose the index is to serve. An
    important thing to remember about indexes is that they should be created only
    when absolutely necessary. Too many or unnecessary indexes use up computer resources
    and impede performance. Although the typical index takes up less space than is
    required by the table itself, it still represents a copy of some part of a table,
    and therefore requires storage space to store its contents. For this reason, care
    should be used when deciding when and what indexes to create.


    To help determine when indexes are necessary, consider existing data as well as
    the way the base table(s) will be used. Acquaint yourself with queries classified
    as mission critical and/or essential to the success of the organization or a process.
    Then, determine how the data is dispersed (or the variability of the data) in
    the underlying base table(s) by using analytical tools such as the FREQ procedure.


    If an index is used to specify some order within a table, such as manufacturer
    number or product number in the PRODUCTS table, you should fully assess what the
    impact of that index will be.


    Sometimes the column(s) making up an index is obvious, and other times it is not.
    An index should permit the greatest flexibility so that every column in a table
    can be accessed and retrieved. Improvements with query results can also be achieved
    by assigning indexes to the most discriminating columns in a table (or columns
    that have many unique values), as well as to the columns that are used regularly
    in queries.


    When an index is specified for one or more tables, a join process might actually
    process faster. The SQL optimizer might decide to use an index when certain conditions
    permit its use. Here are a few things to consider prior to creating an index:


    +   - If the table is small, sequential processing might be just as fast, or faster,
    than processing with an index.

    +   - If the page count, as displayed in the CONTENTS procedure, is less than
    three pages, then an index might serve little or no value.

    +   - Avoid creating more indexes than are absolutely necessary.

    +   - If the data subset for the index is large, then sequential access might
    be more efficient than using the index.

    +   - If the percentage of matches is approximately 15% or less (referred to as
    the 15% rule) of the overall population, then index usage might be beneficial.'
  merge: -1
  img_proc: true
- pgno: 250
  md: "+   - The costs associated with maintaining an index can outweigh its performance\
    \ value, because an index is updated each time a row in a table is added, deleted,\
    \ or modified.\n\nTwo types of indexes can be defined and used in PROC SQL: simple\
    \ and composite. When a simple index is created, it references only a single column.\
    \ In contrast, a composite index references two or more columns in a table.\n\n\
    # Creating a Simple Index\n\nA simple index is specifically defined for one column\
    \ in a table and must be the same name as the column. Suppose that you want to\
    \ create an index that consists of product type (PRODTYPE) in the PRODUCTS table.\
    \ Once created, the index becomes a separate object located in the SAS library.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    CREATE INDEX PRODTYPE ON PRODUCTS(PRODTYPE);\n\
    QUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    CREATE INDEX PRODTYPE ON\
    \ PRODUCTS(PRODTYPE);\nNOTE: Simple index PRODTYPE has been defined.\nQUIT;\n\
    NOTE: PROCEDURE SQL used:\nreal time          0.37 seconds\n```\n\n1 The simple\
    \ index is assigned a name of PRODTYPE, which must be the same as the column name.\n\
    \n2 The simple index is defined on the PRODUCTS table.\n\n3 The PRODTYPE column\
    \ in the PRODUCTS table is designated as the column to be used by the index.\n\
    \n# Creating a Composite Index\n\nA composite index is specifically defined for\
    \ two or more columns in a table and must have a different name from the column\
    \ names. Suppose that you want to create an index that consists of manufacturer\
    \ number (MANUNUM) and product type (PRODTYPE) located in the PRODUCTS table.\
    \ You should be aware that only one composite index is allowed per set of columns,\
    \ but more than one composite index is allowed. The composite index, as with the\
    \ simple index, becomes a separate object located in the SAS library."
  merge: -1
  img_proc: true
