- pgno: 272
  md: "characters and must start with a letter or underscore (see SAS Language Reference:\
    \ Concepts for further details).\n\nTo minimize the number of keystrokes that\
    \ are needed to reference the tables that are specified in a join query, you can\
    \ assign an alias or temporary table name reference to each table. When assigned,\
    \ these arbitrary aliases provide a shortcut method to the tables themselves and\
    \ are in effect for the duration of the join query but no longer. In the next\
    \ example, the table alias “P” is assigned to the PRODUCTS table and the alias\
    \ “M” is assigned to the MANUFACTURERS table in the FROM clause. Table name references\
    \ in the SELECT statement and WHERE clause are made easier as well.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT prodnum, prodname, prodtype, M.manunum\n        FROM\
    \ PRODUCTS  P, MANUFACTURERS  M\n            WHERE P.manunum  = M.manunum AND\n\
    \                M.manuname  = 'KPL Enterprises';\nQUIT;\n```\n\n① The assignment\
    \ of the table alias “P” and the table alias “M” in the FROM clause provides a\
    \ shortcut method to refer to the longer table names PRODUCTS and MANUFACTURERS.\n\
    \n# Results\n\n| Product Number | Product Name | Product Type | Manufacturer Number\
    \ |\n|---|---|---|---|\n| 5001 | Spreadsheet Software | Software | 500 |\n| 5002\
