    The SQL procedure supports the specification of a FORMAT= column modifier for
    purposes of providing instructions on how to write character and numeric data
    values by a query expression. The general syntax for writing a format follows:


    ```

    <$>format<w>.<d>

    ```


    where


    $ is used to reference a character format and its absence references a numeric
    format.


    format is the name of the desired SAS format or user-defined format to be used
    (see the SAS Language Reference: Dictionary, Fourth Edition for a complete listing
    and description of the available character, numeric, and date formats).


    w references the format width, which is typically represented by the number of
    output columns used for the data.'
