- pgno: 234
  md: "# Controlling the Position of Columns in a Table\n\nColumn position is not\
    \ normally important in relational database processing. But, there are times when\
    \ a particular column order is desired, for example when SELECT * (select all)\
    \ syntax is specified. To add one or more columns in a designated order, the SQL\
    \ standard provides a couple of choices.\n\n+   - You can create a new table with\
    \ the columns in the desired order and load the data into the new table.\n+  \
    \ - You can create a view that puts the columns in the desired order and then\
    \ access the view in lieu of the table (see Chapter 8, “Working with Views,” for\
    \ a detailed explanation).\n\nSuppose that you want to add the INVENTORY_STATUS\
    \ column so that it is inserted between the ORDDATE and INVENCST columns and is\
    \ not just added as the last column in the table. The following example shows\
    \ how this can be done. As before, begin by adding the INVENTORY_STATUS column\
    \ to the INVENTORY table. Then, create a new table called INVENTORY_COPY and load\
    \ the data from the INVENTORY table in the following column order: PRODNUM, INVENQTY,\
    \ ORDDATE, INVENTORY_STATUS, INVENCST, and MANUNUM.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n    ALTER TABLE INVENTORY\n        ADD INVENTORY_STATUS CHAR(12);\n  \
    \  CREATE TABLE INVENTORY_COPY AS\n        SELECT PRODNUM, INVENQTY, ORDDATE,\
    \ INVENTORY_STATUS,\n               INVENCST, MANUNUM\n        FROM INVENTORY;\n\
    QUIT;\nPROC CONTENTS DATA=INVENTORY_COPY POSITION;\nRUN;\n```\n\nThe PROC CONTENTS\
    \ output below shows the positioning of the columns in the new INVENTORY_COPY\
    \ table including the new INVENTORY_STATUS column that was added."
  merge: -1
  img_proc: true
