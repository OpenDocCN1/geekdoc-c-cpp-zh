- pgno: 24
  md: '# Introduction


    The area of database design is very important in relational processes. Much has
    been written on this subject, including entire textbooks and thousands of technical
    papers. No pretenses are made about the thoroughness of this very important subject
    in these pages. Rather, an attempt is made to provide a quick-start introduction
    for those readers who are unfamiliar with the issues and techniques of basic design
    principles. Readers needing more information are referred to the references listed
    in the back of this book. As you read this chapter, the following points should
    be kept in mind.


    # Database Design


    Activities related to good database design require the identification of end-user
    requirements and involve defining the structure of data values on a physical level.
    Database design begins with a *conceptual view* of what is needed. The next step,
    called *logical design*, consists of developing a formal description of database
    entities and relationships to satisfy user requirements. Seldom does a database
    consist of a single table. Consequently, tables of interrelated information are
    created to enable more complex and powerful operations on data. The final step,
    referred to as *physical design*, represents the process of achieving optimal
    performance and storage requirements of the logical database.


    # Conceptual View


    The health and well-being of a database depends on its database design. A database
    must be in balance with all of its components (or optimized) to avoid performance
    and operation bottlenecks. Database design doesn’t just happen and is not a process
    that occurs by chance. It involves planning, modeling, creating, monitoring, and
    adjusting to satisfy the endless assortment of user requirements without impeding
    resource requirements. Of central importance to database design is the process
    of planning. Planning is a valuable component that, when absent, causes a database
    to fall prey to a host of problems including poor performance and difficulty in
    operation. Database design consists of three distinct phases, as illustrated in
    Figure 1.1.'
