    \ | $3,300.00 | 0 | 1 | 0 | 0 |\n| Travel Laptop | $3,400.00 | 1 | 0 | 0 | 0 |\n\
    \n# Simple CASE Expression in a HAVING Clause\n\nA HAVING clause is used in an\
    \ SQL query to filter out aggregates specified in a GROUP BY clause. In this example,\
    \ the SELECT clause returns the names of the manufacturers along with their state\
    \ of residence from the MANUFACTURERS table. The CASE expression in the HAVING\
    \ clause restricts what is returned by the SELECT clause to only the manufacturers\
    \ residing in the state of California.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ MANUNAME,\n           MANUSTAT\n    FROM MANUFACTURERS\n    HAVING CASE MANUSTAT\n\
    \           WHEN 'CA' THEN 1\n           ELSE 0\n           END;\nQUIT;\n```"
