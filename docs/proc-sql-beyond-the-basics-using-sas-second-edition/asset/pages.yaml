    Using the DESCRIBE TABLE statement, the SQL procedure displays integrity constraints
    along with the table description in the SAS log. The ability to capture this type
    of information assists with the documentation process by describing the names
    and types of integrity constraints as well as the contributing columns that they
    reference.


    # SQL Code


    ```

    PROC SQL;

    DESCRIBE TABLE MANUFACTURERS;

    QUIT;

    ```'
