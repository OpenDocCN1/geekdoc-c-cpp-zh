- pgno: 315
  md: '# Summary


    +   1. When one or more relationships or connections between disparate pieces
    of data are needed, the PROC SQL join construct is used (see the “Why Joins Are
    Important” section).

    +   2. You use a join to relate one table with another table through a process
    known as column matching (see the “Introducing Complex Queries” section).

    +   3. You can assign table aliases to tables to minimize the number of keystrokes
    needed to reference a table in a join query (see the “Using Table Aliases in Joins”
    section).

    +   4. When a query is placed inside the predicate of another query, it is called
    a subquery. Put another way, a subquery is a SELECT statement that is embedded
    in the WHERE clause of another SELECT statement (see the “Subqueries” section).

    +   5. The IN predicate permits PROC SQL to pass multiple values from the subquery
    to the main query without producing an error (see the “Passing More Than One Row
    with a Subquery” section).

    +   6. A subquery can also be constructed to evaluate multiple times, once for
    each row of data accessed by the main (outer) query (see the “Comparing a Set
    of Values” section).

    +   7. The INTERSECT operator creates an output table that consists of all the
    unique rows from the intersection of two query expressions (see the “Accessing
    Rows from the Intersection of Two Queries” section).

    +   8. The UNION operator creates an output table that consists of all of the
    unique rows from the combination of query expressions (see the “Accessing Rows
    from the Combination of Two Queries” section).'
  merge: -1
