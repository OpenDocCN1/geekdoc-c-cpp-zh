    | 500 |\n| 600 |\n\n# Finding Unique Values\n\nIn some situations, several rows\
    \ in a table will contain identical column values. To select each of these duplicate\
    \ values only once, the UNIQUE keyword can be used in the SELECT statement.\n\n\
    # SQL Code\n\n```\nPROC SQL;\n    SELECT UNIQUE MANUNUM\n      FROM INVENTORY;\n\
    QUIT;\n```\n\n# Results\n\n| Manufacturer Number |\n|---| \n| 111 |\n| 170 |\n\
    | 500 |\n| 600 |"
  merge: -1
  img_proc: true
- pgno: 57
  md: "# SQL Operators and Functions\n\nSQL programmers have a number of ways to accomplish\
    \ their objectives, particularly when the goal is to retrieve and work with data.\
    \ The SELECT statement is an extremely powerful statement in the SQL language.\
    \ Its syntax can be somewhat complex because of the number of ways that columns,\
    \ tables, operators, functions, and predicates can be combined into executable\
    \ statements.\n\nThere are several types of operators and functions in PROC SQL:\n\
    \n+   - comparison operators\n+   - logical operators\n+   - arithmetic operators\n\
    +   - character string operators\n+   - summary functions\n+   - predicates\n\n\
    Operators and functions provide value-added features for PROC SQL programmers.\
    \ Each will be presented below.\n\n# Comparison Operators\n\nComparison operators\
    \ are used in the SQL procedure to compare one character or numeric value to another.\
    \ As in the DATA step, SQL comparison operators, mnemonics, and their descriptions\
    \ appear in the following table.\n\n| SAS Operator | Mnemonic Operators | Description\
    \ |\n|---|---|---|\n| = | EQ | Equal to |\n| ^= or ~= | NE | Not equal to |\n\
    | < | LT | Less than |\n| <= | LE | Less than or equal to |\n| > | GT | Greater\
    \ than |\n| >= | GE | Greater than or equal to |\n\nSuppose you want to select\
    \ only those products from the PRODUCTS table that cost more than $300.00. The\
    \ example illustrates the use of the greater than sign (>) in a WHERE clause to\
    \ select products meeting the condition.\n\n# SQL Code\n\n```\nPROC SQL;\n   \
    \ SELECT PRODNAME,\n           PRODTYPE,\n           PRODCOST\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: "```\nFROM PRODUCTS\n    WHERE PRODCOST > 300;\nQUIT;\n```\n\n# Results\n\n\
    | Product Name | Product Type | Product Cost |\n| Dream Machine | Workstation\
    \ | $3,200.00 |\n| Business Machine | Workstation | $3,300.00 |\n| Travel Laptop\
    \ | Laptop | $3,400.00 |\n| Database Software | Software | $399.00 |\n\nPROC SQL\
    \ also supports the use of truncated string comparison operators. These operators\
    \ work by first truncating the longer string to the same length as the shorter\
    \ string, and then perform the specified comparison. The result of using any of\
    \ the comparison operators has no permanent affect on the strings themselves.\
    \ The list of truncated string comparison operators and their meanings appear\
    \ below.\n\n| Truncated String Comparison Operator | Description |\n| EQT | Equal\
    \ to |\n| GTT | Greater than |\n| LTT | Less than |\n| GET | Greater than or equal\
    \ to |\n| LET | Less than or equal to |\n| NET | Not equal to |\n\n# Logical Operators\n\
    \nLogical operators are used to connect two or more expressions together in a\
    \ WHERE or HAVING clause. The available logical operators consist of AND, OR,\
    \ and NOT. Suppose you want to select only those software products that cost more\
    \ than $300.00. The example illustrates how the AND operator is used to ensure\
    \ that both conditions are true.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n\
    \            PRODTYPE,\n            PRODCOST\n        FROM PRODUCTS\n        WHERE\
    \ PRODTYPE = 'Software' AND\n              PRODCOST > 300;\n```"
  merge: -1
  img_proc: true
- pgno: 59
  md: "```\nQUIT;\n```\n\n# Results\n\n| Product Name | Product Type | Product Cost\
    \ |\n|---|---|---|\n| Database Software | Software | $399.00 |\n\nThe next example\
    \ illustrates the use of the OR logical operator to select software products or\
    \ products that cost more than $300.00.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ PRODNAME,\n        PRODTYPE,\n        PRODCOST\n    FROM PRODUCTS\n        WHERE\
    \ PRODTYPE = 'Software' OR\n            PRODCOST > 300;\nQUIT;\n```\n\n# Results\n\
    \n| Product Name | Product Type | Product Cost |\n|---|---|---|\n| Dream Machine\
    \ | Workstation | $3,200.00 |\n| Business Machine | Workstation | $3,300.00 |\n\
    | Travel Laptop | Laptop | $3,400.00 |\n| Spreadsheet Software | Software | $299.00\
    \ |\n| Database Software | Software | $399.00 |\n| Wordprocessor Software | Software\
    \ | $299.00 |\n| Graphics Software | Software | $299.00 |\n\nThe next example\
    \ illustrates the use of the NOT logical operator to select products that are\
    \ not software products and do not cost more than $300.00. Should PRODTYPE contain\
    \ any value other than “Software,” including a null value, the resulting output\
    \ would include the row."
  merge: -1
  img_proc: true
- pgno: 60
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n            PRODTYPE,\n\
    \            PRODCOST\n    FROM PRODUCTS\n    WHERE NOT PRODTYPE = 'Software'\
    \ AND\n          NOT PRODCOST > 300;\nQUIT;\n```\n\n# Results\n\n| Product Name\
    \ | Product Type | Product Cost |\n|---|---|---|\n| Analog Cell Phone | Phone\
    \ | $35.00 |\n| Digital Cell Phone | Phone | $175.00 |\n| Office Phone | Phone\
    \ | $130.00 |\n\n# Arithmetic Operators\n\nThe arithmetic operators used in PROC\
    \ SQL are the same operators that are used in the DATA step as well as those found\
    \ in other languages such as C, Pascal, FORTRAN, and COBOL. The arithmetic operators\
    \ available in the SQL procedure appear below.\n\n| Operator | Description |\n\
    |---|---|\n| + | Addition |\n| - | Subtraction |\n| * | Multiplication |\n| /\
    \ | Division |\n| ** | Exponent (raises to a power) |\n| = | Equals |\n\nTo illustrate\
    \ how arithmetic operators are used, suppose you want to apply a discount of 20%\
    \ to the product price (PRODCOST) in the PRODUCTS table. Note that the computed\
    \ column (PRODCOST * 0.80) does not automatically create a column header on output.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n            PRODTYPE,\n\
    \            PRODCOST * 0.80\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: "# Chapter 2: Working with Data in PROC SQL 39\n\n```\nPROC SQL;\nSELECT * FROM\
    \ PRODUCTS;\nQUIT;\n```\n\n\n\n| Product Name | Product Type | \n|--------------|--------------|------|\n\
    | Dream Machine | Workstation | 2560 |\n| Business Machine | Workstation | 2640\
    \ |\n| Travel Laptop | Laptop | 2720 |\n| Analog Cell Phone | Phone | 28 |\n|\
    \ Digital Cell Phone | Phone | 140 |\n| Office Phone | Phone | 104 |\n| Spreadsheet\
    \ Software | Software | 239.2 |\n| Database Software | Software | 319.2 |\n| Wordprocessor\
    \ Software | Software | 239.2 |\n| Graphics Software | Software | 239.2 |\n\n\
    In the next example, suppose you wanted to reference a column that was calculated\
    \ in the SELECT statement. PROC SQL allows references to a computed column in\
    \ the same SELECT statement (or a WHERE clause) using the CALCULATED keyword.\
    \ Note that the computed columns have column aliases created for them using the\
    \ AS keyword. If the CALCULATED keyword were not specified preceding the calculated\
    \ column, an error would have been generated. The results were produced in ascending\
    \ order by the discounted price.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT PRODNAME,\n\
    PRODTYPE,\nPRODCOST * 0.80 AS DISCOUNT_PRICE\nFORMAT=DOLLAR9.2,\nPRODCOST - CALCULATED\
    \ DISCOUNT_PRICE AS LOSS\nFORMAT=DOLLAR7.2\nFROM PRODUCTS\nORDER BY 3;\nQUIT;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Results\n\n| Product Name | Product Type | DISCOUNT_PRICE | LOSS |\n|---|---|---|---|\n\
    | Analog Cell Phone | Phone | $28.00 | $7.00 |\n| Office Phone | Phone | $104.00\
    \ | $26.00 |\n| Digital Cell Phone | Phone | $140.00 | $35.00 |\n| Spreadsheet\
    \ Software | Software | $239.20 | $59.80 |\n| Graphics Software | Software | $239.20\
    \ | $59.80 |\n| Wordprocessor Software | Software | $239.20 | $59.80 |\n| Database\
    \ Software | Software | $319.20 | $79.80 |\n| Dream Machine | Workstation | $2,560.00\
    \ | $640.00 |\n| Business Machine | Workstation | $2,640.00 | $660.00 |\n| Travel\
    \ Laptop | Laptop | $2,720.00 | $680.00 |\n\n# Character String Operators and\
    \ Functions\n\nCharacter string operators and functions are typically used with\
    \ character data. Numerous operators are presented to acquaint programmers with\
    \ the power available with in SQL procedure. As you become familiar with each\
    \ operator, you’ll find their real strength as you begin to nest functions within\
    \ each other.\n\n# Concatenating Strings\n\nThe following example illustrates\
    \ a basic concatenation operator that is used to concatenate two columns and a\
    \ text string. Note that the created column is without a name and has a total\
    \ length of 23 characters. For more details and special formatting considerations,\
    \ the concatenation operator \"||\"will be discussed in greater detail in Chapter\
    \ 3, “Formatting Output.”\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT MANUCITY\
    \ || \",\" || MANUSTAT\n        FROM MANUFACTURERS;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Results\n\n|  |\n|---| \n| Houston ,TX |\n| San Diego ,CA |\n| Miami ,FL\
    \ |\n| San Mateo ,CA |\n| San Diego ,CA |\n| San Diego ,CA |\n\nTwo other effective\
    \ methods of concatenating columns and/or text strings in SQL operations is to\
    \ use the special concatenation functions, CAT or CATS. The next example illustrates\
    \ a CAT function being used to concatenate two columns and a text string. The\
    \ CAT function does not remove leading and trailing blanks, and returns a maximum\
    \ value of 200 characters in a concatenated character string in PROC SQL.\n\n\
    # SQL Code\n\n```\nPROC SQL;\n    SELECT CAT(MANUCITY,\",\", MANUSTAT)\n     \
    \   FROM MANUFACTURERS;\nQUIT;\n```\n\n# Results\n\n|  |\n|---| \n| Houston ,TX\
    \ |\n| San Diego ,CA |\n| Miami ,FL |\n| San Mateo ,CA |\n| San Diego ,CA |\n\
    | San Diego ,CA |\n\nThe CATS function can also be used in PROC SQL. Its purpose\
    \ is to remove leading and trailing blanks, and return a maximum value of 200\
    \ characters in a concatenated character string in PROC SQL."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Finding the Length of a String\n\nThe LENGTH function is used to obtain the\
    \ length of a character string column. LENGTH returns a number equal to the number\
    \ of characters in the argument. Note that the computed column (LENGTH(PRODNAME))\
    \ has a column header created for it called Length by specifying the AS keyword.\
    \ This example illustrates using the LENGTH function to determine the length of\
    \ data values.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n        \
    \    PRODNAME,\n            LENGTH(PRODNAME) AS Length\n    FROM PRODUCTS;\nQUIT;\n\
    ```\n\n# Results\n\n| Product Number | Product Name | Length |\n|---|---|---|\n\
    | 1110 | Dream Machine | 13 |\n| 1200 | Business Machine | 16 |\n| 1700 | Travel\
    \ Laptop | 13 |\n| 2101 | Analog Cell Phone | 17 |\n| 2102 | Digital Cell Phone\
    \ | 18 |\n| 2200 | Office Phone | 12 |\n| 5001 | Spreadsheet Software | 20 |\n\
    | 5002 | Database Software | 17 |\n| 5003 | Wordprocessor Software | 22 |\n| 5004\
    \ | Graphics Software | 17 |\n\n# Combining Functions and Operators\n\nAs in the\
    \ DATA step, many functions can be used in the SQL procedure. To modify one or\
    \ more existing rows in a table, the UPDATE statement is used (see Chapter 6,\
    \ “Modifying and Updating Tables and Indexes,” for more details). The UPDATE statement\
    \ with the SET clause changes the contents of a data value (functioning the same\
    \ way as a DATA step assignment statement) by assigning a new value to the column\
    \ identified to the left of the equal sign by a constant or expression referenced\
    \ to the right of the equal sign."
  merge: -1
  img_proc: true
- pgno: 65
  md: "The UPDATE statement does not automatically produce any output except for the\
    \ log messages that are based on the operation results itself. To illustrate the\
    \ use of DATA step functions and operators in the SQL procedure, the next example\
    \ shows a SCAN function that isolates the first piece of information from product\
    \ name (PRODNAME), a TRIM function to remove trailing blanks from product type\
    \ (PRODTYPE), and a concatenation operator \"||\" that concatenates the first\
    \ character expression with the second expression. It should be noted that care\
    \ should be exercised when using the SCAN function because it returns a 200-byte\
    \ string.\n\n# SQL Code\n\n```\nPROC SQL;\n    UPDATE PRODUCTS\n        SET PRODNAME\
    \ = SCAN(PRODNAME,1) || TRIM(PRODTYPE);\nQUIT;\n```\n\n# SAS Log Results\n\n```\n\
    PROC SQL;\n    UPDATE PRODUCTS\n        SET PRODNAME = SCAN(PRODNAME,1) || TRIM(PRODTYPE);\n\
    NOTE: 10 rows were updated in PRODUCTS.\nQUIT;\n```\n\nAn optional WHERE clause\
    \ can be specified to limit the number of rows to which modifications will be\
    \ applied. The next example illustrates using a WHERE clause to restrict the number\
    \ of rows that are updated in the previous example to just \"phone,\" excluding\
    \ all the other rows.\n\n# SQL Code\n\n```\nPROC SQL;\n    UPDATE PRODUCTS\n \
    \       SET PRODNAME = SCAN(PRODNAME,1) || TRIM(PRODTYPE)\n        WHERE PRODTYPE\
    \ IN ('Phone');\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    UPDATE\
    \ PRODUCTS\n        SET PRODNAME = SCAN(PRODNAME,1) || TRIM(PRODTYPE)\n      \
    \  WHERE PRODTYPE IN ('Phone');\nNOTE: 3 rows were updated in PRODUCTS.\nQUIT;\n\
    ```\n\n# Aligning Characters\n\nThe default alignment for character data is to\
    \ the left; however, character columns or expressions can also be aligned to the\
    \ right. Two functions are available for character alignment: LEFT and RIGHT.\
    \ The next example combines the concatenation operator \"||\" and the TRIM function\
    \ with"
  merge: -1
  img_proc: true
- pgno: 66
  md: "the LEFT function to left align a character expression while inserting a comma\
    \ “,” and blank between the columns.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ LEFT(TRIM(MANUCITY) || \", \" || MANUSTAT)\n        FROM MANUFACTURERS;\nQUIT;\n\
    ```\n\n# Results\n\n|  |\n|---| \n| Houston, TX |\n| San Diego, CA |\n| Miami,\
    \ FL |\n| San Mateo, CA |\n| San Diego, CA |\n| San Diego, CA |\n\nThe next example\
    \ illustrates how character data can be right aligned using the RIGHT function.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT RIGHT(MANUCITY)\n        FROM MANUFACTURERS;\n\
    QUIT;\n```\n\n# Results\n\n|  |\n|---| \n| Houston |\n| San Diego |\n| Miami |\n\
    | San Mateo |\n| San Diego |\n| San Diego |"
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Finding the Occurrence of a Pattern with INDEX\n\nTo find the occurrence\
    \ of a pattern, the INDEX function can be used. Frequently, requirements call\
    \ for a column to be searched using a specific character string. The INDEX function\
    \ can be used in the SQL procedure to search for patterns in a character string.\
    \ The character string is searched from left to right for the first occurrence\
    \ of the specified value. If the desired string is found, the column position\
    \ of the first character is returned. Otherwise, a value of zero (0) is returned.\
    \ The following arguments are used to search for patterns in a column: the character\
    \ column or expression, and the character string to search for. To find all products\
    \ with the characters “phone” in the product name (PRODNAME) column, the following\
    \ code can be specified:\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n\
    \            PRODNAME,\n            PRODTYPE\n      FROM PRODUCTS\n     WHERE\
    \ INDEX(PRODNAME, 'phone') > 0;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC\
    \ SQL;\n    SELECT PRODNUM,\n            PRODNAME,\n            PRODTYPE\n   \
    \   FROM PRODUCTS\n     WHERE INDEX(PRODNAME, 'phone') > 0;\nNOTE: No rows were\
    \ selected.\nQUIT;\n```\n\n# Analysis\n\nAs in the DATA step, no rows were selected\
    \ because the search is case sensitive and “phone” is specified as all lowercase\
    \ characters.\n\n# Changing the Case in a String\n\nSAS provides two functions\
    \ that enable you to change the case of a string’s characters: LOWCASE and UPCASE.\
    \ The LOWCASE function converts all of the characters in a string or expression\
    \ to lowercase characters. The UPCASE function converts all of the characters\
    \ in a string or expression to uppercase characters.\n\nGetting back to the previous\
    \ example, the results of the search were negative even though the character string\
    \ “phone” appeared multiple times in more than one row. In order to make this\
    \ search recognize all the possible lower- and uppercase variations of the word\
    \ “phone,” the search criteria in the WHERE clause could be made “smarter” by\
    \ combining an UPCASE function with the INDEX function as follows."
  merge: -1
  img_proc: true
- pgno: 68
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n           PRODNAME,\n \
    \          PRODTYPE\n      FROM PRODUCTS\n     WHERE INDEX(UPCASE(PRODNAME), 'PHONE')\
    \ > 0;\nQUIT;\n```\n\n# Results\n\n| Product Number | Product Name | Product Type\
    \ |\n|---|---|---|\n| 2101 | AnalogPhone | Phone |\n| 2102 | DigitalPhone | Phone\
    \ |\n| 2200 | OfficePhone | Phone |\n\nIn the next example, the LOWCASE function\
    \ is combined with the INDEX function to produce the identical output from the\
    \ previous example.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNUM,\n   \
    \        PRODNAME,\n           PRODTYPE\n      FROM PRODUCTS\n     WHERE INDEX(LOWCASE(PRODNAME),\
    \ 'phone') > 0;\nQUIT;\n```\n\n# Results\n\n| Product Number | Product Name |\
    \ Product Type |\n|---|---|---|\n| 2101 | AnalogPhone | Phone |\n| 2102 | DigitalPhone\
    \ | Phone |\n| 2200 | OfficePhone | Phone |\n\n# Extracting Information from a\
    \ String\n\nOccasionally, processing requirements call for specific pieces of\
    \ information to be extracted from a column. In these situations the SUBSTR function\
    \ can be used with a character column by specifying a starting position and the\
    \ number of characters to extract. The following example"
  merge: -1
  img_proc: true
- pgno: 69
  md: "illustrates how the SUBSTR function is used to capture the first 4 bytes from\
    \ the product type (PRODTYPE) column.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ PRODNUM,\n           PRODNAME,\n           PRODTYPE,\n           SUBSTR(PRODTYPE,1,4)\n\
    \    FROM PRODUCTS\n    WHERE PRODCOST > 100.00;\nQUIT;\n```\n\n# Results\n\n\
    | Product Number | Product Name | Product Type |  |\n|---|---|---|---|\n| 1110\
    \ | DreamWorkstation | Workstation | Work |\n| 1200 | BusinessWorkstation | Workstation\
    \ | Work |\n| 1700 | TravelLaptop | Laptop | Lapt |\n| 2102 | DigitalPhone | Phone\
    \ | Phon |\n| 2200 | OfficePhone | Phone | Phon |\n| 5001 | SpreadsheetSoftware\
    \ | Software | Soft |\n| 5002 | DatabaseSoftware | Software | Soft |\n| 5003 |\
    \ WordprocessorSoftware | Software | Soft |\n| 5004 | GraphicsSoftware | Software\
    \ | Soft |\n\n# Phonetic Matching (Sounds-Like Operator =*)\n\nA technique for\
    \ finding names that sound alike or have spelling variations is available in the\
    \ SQL procedure. This frequently used technique is referred to as phonetic matching\
    \ and is performed using the Soundex algorithm. In Joe Celko’s popular book SQL\
    \ for Smarties: Advanced SQL Programming (Morgan Kaufman, 1999, pages 83-87),\
    \ he traced the origins of the Soundex algorithm to the developers Margaret O’Dell\
    \ and Robert C. Russell in 1918. Developed before the first computer, clerks often\
    \ used the algorithm to manually search for similar sounding names.\n\nAlthough\
    \ not technically a function, the sounds-like operator \"=*\" searches and selects\
    \ character data based on two expressions: the search value and the matched value.\
    \ Anyone that has looked for a last name in a local telephone directory is quickly\
    \ reminded of the possible phonetic variations.\n\nTo illustrate how the sounds-like\
    \ operator works, we will search on CUSTNAME in the CUSTOMERS2 table. The CUSTOMERS2\
    \ table is illustrated below. Although each name has"
  merge: -1
  img_proc: true
- pgno: 70
  md: "phonetic variations and sounds the same, the results of “Laughler,” “Loffler,”\
    \ and “Laffler” are spelled differently (illustrated below). The following PROC\
    \ SQL code uses the sounds-like operator to find all customers that sound like\
    \ “Lafler.”\n\n# CUSTOMERS2 Table\n\n| CUSTNUM | CUSTNAME | CUSTCITY |\n| 1 |\
    \ Smith | San Diego |\n| 7 | Lafler | Spring Valley |\n| 11 | Jones | Carmel |\n\
    | 13 | Thompson | Miami |\n| 7 | Loffler | Spring Valley |\n| 1 | Smithe | San\
    \ Diego |\n| 7 | Laughler | Spring Valley |\n| 7 | Laffler | Spring Valley |\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT CUSTNUM,\n            CUSTNAME,\n \
    \           CUSTCITY\n      FROM CUSTOMERS2\n     WHERE CUSTNAME =* 'Lafler';\n\
    QUIT;\n```\n\n# Results\n\n| Customer Number | Customer Name | Customer's Home\
    \ City |\n| 7 | Lafler | Spring Valley |\n| 7 | Loffler | Spring Valley |\n| 7\
    \ | Laffler | Spring Valley |\n\nReaders familiar with the DATA step SOUNDEX(<argument>)\
    \ function to search a string are cautioned that it cannot be used in an SQL WHERE\
    \ clause. Instead, the sounds-like operator “=*” must be specified; otherwise,\
    \ a result of no rows will be selected.\n\nNotice that only three of the four\
    \ possible phonetic matches were selected in the preceding example (i.e., Lafler,\
    \ Loffler, and Laffler). The fourth possibility, “Laughler” was not chosen as\
    \ a “matched” value in the search by the sounds-like algorithm. In an attempt\
    \ to overcome the inherent limitation with the sounds-like operator, as described\
    \ in Joe Celko’s popular book SQL for Smarties: Advanced SQL Programming (Morgan\
    \ Kaufman, 1999), and to derive a broader list of “matched” values, programmers\
    \ should make every attempt to develop a comprehensive list of search values to\
    \ widen the scope of possibilities. We can expand our original search criteria\
    \ in the previous example to include the missing possibilities using OR logic."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT CUSTNUM,\n           CUSTNAME,\n \
    \          CUSTCITY\n      FROM CUSTOMERS2\n     WHERE CUSTNAME =* 'Lafler'  OR\n\
    \           CUSTNAME =* 'Laughler' OR\n           CUSTNAME =* 'Lasler';\nQUIT;\n\
    ```\n\n# Results\n\n| Customer Number | Customer Name | Customer's Home City |\n\
    |---|---|---|\n| 7 | Lafler | Spring Valley |\n| 7 | Loffler | Spring Valley |\n\
    | 7 | Laughler | Spring Valley |\n| 7 | Laffler | Spring Valley |\n\n# Finding\
    \ the First Nonmissing Value\n\nThe first example provides a way to find the first\
    \ non-missing value in a column or list. Specified in a SELECT statement, the\
    \ COALESCE function inspects a column, or in the case of a list scans the arguments\
    \ from left to right, and returns the first non-missing or non-null value. If\
    \ all values are missing, the result is missing. To take advantage of the COALESCE\
    \ function, all arguments must be of the same data type. The next example illustrates\
    \ one approach on computing the total cost for each product purchased from the\
    \ number of units and unit costs columns in the PURCHASES table. If either the\
    \ UNITS column or the UNITCOST column contains a missing value, a zero is assigned\
    \ by the programmer to prevent the propagation of missing values.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT CUSTNUM,\n           PRODNUM,\n           UNITS,\n\
    \           UNITCOST,\n           (COALESCE(UNITS, 0) * COALESCE(UNITCOST, 0))\n\
    \             AS TOTCOST FORMAT=DOLLAR10.2\n      FROM PURCHASES;\nQUIT;\n```"
  merge: -1
  img_proc: true
