- pgno: 153
  md: "# Results\n\nThe SAS System\n\n| Manufacturer Name | Manufacturer State |\n\
    |---|---|\n| Global Comm Corp | CA |\n| Storage Devices Inc | CA |\n| KPL Enterprises\
    \ | CA |\n| San Diego PC Planet | CA |\n\nIn the next example, the SELECT clause\
    \ returns the most expensive product(s) from the PRODUCTS table, and the CASE\
    \ expression in the HAVING clause restricts the results to software products costing\
    \ more than $300.00.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n \
    \           PRODTYPE,\n            MAX(PRODCOST) AS Product_Cost FORMAT=DOLLAR10.2\n\
    \    FROM PRODUCTS\n    HAVING CASE PRODTYPE\n            WHEN 'Software' THEN\
    \ PRODCOST\n            ELSE 0\n        END > 300;\nQUIT;\n```\n\n# Results\n\n\
    The SAS System\n\n| Product Name | Product Type | Product_Cost |\n|---|---|---|\n\
    | Database Software | Software | $3,400.00 |\n\n# Simple CASE Expression in a\
    \ Join Construct\n\nA CASE expression can be specified in a JOIN construct to\
    \ filter out aggregates specified in a GROUP BY clause. In this example, the SELECT\
    \ clause returns the names of the manufacturers along with their state of residence\
    \ from the MANUFACTURERS table. The CASE expression in"
