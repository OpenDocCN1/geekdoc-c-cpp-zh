- pgno: 49
  md: "# PROC SQL Code\n\n```\nPROC SQL;\n  CREATE TABLE PURCHASES\n    (CUSTNUM NUM\
    \ LENGTH=4\n      LABEL='Customer Number',\n      PRODNUM NUM LENGTH=3\n     \
    \ LABEL='Product Purchased',\n      UNITS    NUM LENGTH=3\n      LABEL='# Units\
    \ Purchased',\n      UNITCOST NUM LENGTH=4\n      LABEL='Unit Cost');\nQUIT;\n\
    ```\n\nAs shown in the CONTENTS results below, four numeric columns are defined\
    \ using a LENGTH= column modifier that is smaller than the default length of 8\
    \ bytes.\n\n# CONTENTS Results\n\n| # | Variable | Type | Len | Format | Label\
    \ |\n|---|---|---|---|---|---|\n| 1 | CUSTNUM | Num | 4 |  | Customer Number |\n\
    | 2 | PRODNUM | Num | 3 |  | Product Purchased |\n| 4 | UNITCOST | Num | 4 | DOLLAR12.2\
    \ | Unit Cost |\n| 3 | UNITS | Num | 3 |  | # Units Purchased |\n\nAlphabetic\
    \ List of Variables and Attributes\n\n# Date and Time Column Definitions\n\nDatabase\
    \ application processing stores date and time information in the form of a numeric\
    \ data type. Date and time values are represented internally as an offset where\
    \ a SAS date value is stored as the number of days from the fixed date value of\
    \ 01/01/1960 (January 1, 1960). The SAS date value for January 1, 1960, is represented\
    \ as 0 (zero). A date earlier than this date is represented as a negative number\
    \ and a date later than this date is represented as a positive number. This makes\
    \ performing date calculations much easier.\n\nSAS has integrated the vast array\
    \ of date and time informats and formats with PROC SQL. The various informats\
    \ and formats act as input and output templates and describe how date and time\
    \ information is to be read or rendered on output. See the SAS Language Reference:\
    \ Dictionary for detailed descriptions of the various informats and formats and\
    \ their use. Numeric date and time columns, when combined with informats and/or\
    \ formats, automatically validate values according to the following rules:"
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   - **Date**—Date informats and formats enable PROC SQL and SAS to determine
    the month, day, and year values of a date. The month value handles values from
    1 through 12. The day value handles values from 1 through 31 and applies additional
    validations to a maximum of 28, 29, or 30 depending on the month in question.
    The year value handles values from 1 through 9999. Dates go back to 1582 and ahead
    to 20,000. When you enter a year value of 0001 and specify a format and a Yearcutoff
    value of 1920, the returned value would be 2001.

    +   - **Time** —Time informats and formats enable PROC SQL to determine the hour,
    minute, and second values of a time. The hour portion handles values from 00 through
    23. The minute portion handles values from 00 through 59. The second portion handles
    values from 00 through 59.

    +   - **DATETIME**—Date and time stamps enable the SQL procedure to determine
    the month, day, and year of a date as well the hour, minute, and second of a time.


    See Chapter 5, “Creating, Populating, and Deleting Tables” and Chapter 6, “Modifying
    and Updating Tables” for more information about date and time informats and formats.


    # Character Data


    PROC SQL provides tools to manipulate and store character data including words,
    text, and codes using the CHARACTER or CHAR data type. The characters allowed
    by this data type include the ASCII or EBCDIC character sets. The CHARACTER or
    CHAR data type stores fixed-length character strings consisting of a maximum of
    32K characters. If a length is not specified, a CHAR column stores a default of
    8 characters.


    The SQL programmer has a vast array of SQL and Base SAS functions that can make
    the task of working with character data considerably easier. In this chapter,
    you’ll learn how columns based on the character data type are defined, and how
    string functions, pattern matching, phonetic matching techniques, and a variety
    of other techniques are used with character data.


    # Missing Values and NULL


    Missing values are an important aspect when dealing with data. The concept of
    missing values is familiar to programmers, statisticians, researchers, and other
    SAS users. This chapter describes what NULL values are, what they aren’t, and
    how they are used.


    Missing or unknown information is supported by PROC SQL in a form known as a *null
    value*. A null value is not the same as a zero value. In SAS, null values are
    treated as a separate category from known values. A value consisting of zero has
    a known value. In contrast, a value of null has an unknown quantity and will never
    be known. For example, a patient who is given an eye exam does not have zero eyesight
    just because the results from the exam haven’t been received. The correct value
    to assign in a case like this is a missing or a null value.


    In another example, say a person declines to provide their age on a survey. This
    person’s age is null, not zero. Essentially, this person has an age, but it is
    unknown. Whenever an unknown value occurs, you have no choice but to assign an
    unknown value—null.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "Because the value of null is unknown, any arithmetic calculation using a null\
    \ will return a null. This makes a lot of sense because the results of a calculation\
    \ using a null are not determinable. This is sometimes referred to as the *propagation\
    \ of nulls* because when a null value is used in a calculation or an expression,\
    \ it propagates a null value. For example, if a null is added to a known value,\
    \ then the result is a null value.\n\n# Arithmetic and Missing Data\n\nIn SAS,\
    \ a numeric data type containing a null value (absence of any value) is represented\
    \ with a period (.). This representation indicates that the column has not been\
    \ assigned a value. A null value has no value and is not the same as zero. A value\
    \ consisting of zero has a known quantity as opposed to a null value that is not\
    \ known and never will be known.\n\nIf a null value is multiplied with a known\
    \ value, the result is a null value represented with a period (.). In the next\
    \ example, when UNITS and UNITCOST both have known values, their product will\
    \ generate a known value, as illustrated below.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    SELECT CUSTNUM,\n            PRODNUM,\n            UNITS,\n            UNITCOST,\n\
    \            UNITS * UNITCOST AS Total FORMAT=DOLLAR12.2\n    FROM PURCHASES\n\
    \        ORDER BY Total;\nQUIT;\n```"
  merge: -1
  img_proc: true
