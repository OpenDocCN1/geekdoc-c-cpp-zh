    # Grouping Data with Summary Functions


    Occasionally it may be useful to display data in designated groups. A GROUP BY
    clause is used in these situations to aggregate and order groups of data using
    a designated column with the same value. When a GROUP BY clause is used without
    a summary function, SAS issues a warning in the SAS log with the message, “A GROUP
    BY clause has been transformed into an ORDER BY clause because neither the SELECT
    clause nor the optional HAVING clause of the associated table-expression referenced
    a summary function.” The GROUP BY clause is transformed into an ORDER BY clause
    and then processed.


    When a GROUP BY clause is used without specifying a summary function in the SELECT
    statement, the entire table is treated as a single group and is ordered in ascending
    order. The next example illustrates a GROUP BY clause without any summary function
    specifications. Due to the absence of any summary functions, the GROUP BY clause
    is automatically transformed into an ORDER BY clause, with the rows being ordered
    in ascending order by product type (PRODTYPE).'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT prodtype,\n        prodcost\n    FROM\
    \ PRODUCTS\n        GROUP BY prodtype;\nQUIT;\n```\n\n# Log Results\n\n```\nPROC\
    \ SQL;\n    SELECT prodtype,\n        prodcost\n    FROM PRODUCTS\n        GROUP\
    \ BY prodtype;\nWARNING: A GROUP BY clause has been transformed into an ORDER\
    \ BY clause because neither the SELECT clause nor the optional HAVING clause of\
    \ the associated table-expression referenced a summary function.\nQUIT;\n```\n\
    \n# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_130_0.png)"
  merge: -1
  img_proc: true
- pgno: 131
  md: "When a GROUP BY clause is used with a summary function, the rows are aggregated\
    \ in a series of groups. This means that an aggregate function is evaluated on\
    \ a group of rows and not on a single row at a time. Suppose that the least expensive\
    \ product in each product type category (PRODTYPE) needs to be identified. A separate\
    \ query for each product category could be specified using the MIN function to\
    \ determine the cheapest product. But this would require separate runs to be executed—not\
    \ a very good approach. A better way to do this would be to specify a GROUP BY\
    \ clause in a single statement as follows.\n\n# SQL Code\n\n```\nPROC SQL;\n \
    \   SELECT prodtype,\n           MIN(prodcost) AS Cheapest\n           format=dollar9.2\
    \ label='Least Expensive'\n    FROM PRODUCTS\n         GROUP BY prodtype;\nQUIT;\n\
    ```\n\n# Results\n\n| Product Type | Least Expensive |\n|---|---:|\n| Laptop |\
    \ $3,400.00 |\n| Phone | $35.00 |\n| Software | $299.00 |\n| Workstation | $3,200.00\
    \ |\n\n# Grouping Data and Sorting\n\nIn the absence of an ORDER BY clause, the\
    \ SQL procedure automatically sorts the results from a grouped query in the same\
    \ order as specified in the GROUP BY clause. When both an ORDER BY clause and\
    \ GROUP BY clause are specified for the same column(s) or column order, no additional\
    \ processing occurs to satisfy the request. Because the ORDER BY clause and GROUP\
    \ BY clause are not mutually exclusive, they can be used together. Internally,\
    \ the GROUP BY clause first sorts the results on the grouping column(s) and then\
    \ aggregates the rows of the query by the same grouping column.\n\nBut what happens\
    \ when the column(s) specified in the ORDER BY clause and GROUP BY clause are\
    \ not the same? In these situations, additional processing requirements are generally\
    \ required. The additional processing, in a worse-case scenario, may require merging\
    \ summary statistics with the original data. In other cases, additional sorting\
    \ requirements may be necessary. Suppose that"
  merge: -1
  img_proc: true
- pgno: 132
  md: "information about the least expensive product in each product category is desired.\
    \ But instead of automatically sorting the results in ascending order by product\
    \ type, as before, the results will be displayed in ascending order by the least\
    \ expensive product for each product type.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ prodtype,\n    MIN(prodcost) AS Cheapest\n        Format=dollar9.2 Label='Least\
    \ Expensive'\nFROM PRODUCTS\n    GROUP BY prodtype\n        ORDER BY cheapest;\n\
    QUIT;\n```\n\n# Results\n\nThe SAS System\n\n| Product Type | Least Expensive\
    \ |\n|--------------|-----------------|\n| Phone        | $35.00          |\n\
    | Software     | $299.00         |\n| Workstation  | $3,200.00       |\n| Laptop\
    \       | $3,400.00       |\n\n# Subsetting Groups with the HAVING Clause\n\n\
    When processing groups of data, it is frequently useful to subset aggregated rows\
    \ (or groups) of data. This way, aggregated data can be filtered one group at\
    \ a time in contrast to filtering one row at a time. SQL provides a convenient\
    \ way to subset (or filter) groups of data by using the GROUP BY clause and the\
    \ HAVING clause. The HAVING clause is optional, but when specified is used in\
    \ combination with the GROUP BY clause.\n\nThe HAVING clause is similar to the\
    \ WHERE clause in that it specifies conditions that must be satisfied in order\
    \ for results to become part of the subset. It differs from the WHERE clause in\
    \ that it can refer to the results derived from summary functions after the aggregation\
    \ of all observations for each of the groups. The groups that evaluate to true\
    \ based on the HAVING clause are retained, and the groups that evaluate to false\
    \ are automatically removed from consideration.\n\nSuppose that you wanted to\
    \ identify only those product groupings that have an average cost that is less\
    \ than $400.00 from the PRODUCTS table. Your first inclination might be to use\
    \ a summary function in a WHERE clause. But, this would not be valid because a\
    \ WHERE clause restricts the number of rows selected. In contrast, the HAVING\
    \ clause restricts the number of groups selected."
  merge: -1
  img_proc: true
- pgno: 133
  md: "and is always performed after the GROUP BY clause. For those already familiar\
    \ with subqueries as discussed in Chapter 7, “Coding Complex Queries,” you could\
    \ also approach the problem as a complex query. But, there is an easier and more\
    \ straightforward way of identifying and selecting the desired product groups\
    \ using the GROUP BY clause and HAVING clause, as follows.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n    SELECT prodtype,\n        AVG(prodcost)\n            FORMAT=DOLLAR9.2\
    \ LABEL='Average Product Cost'\n    FROM PRODUCTS\n        GROUP BY prodtype\n\
    \            HAVING AVG(prodcost) <= 400.00;\nQUIT;\n```\n\n# Results\n\nThe SAS\
    \ System\n\n| Product Type | Average Product Cost |\n|--------------|----------------------|\n\
    | Phone        | $113.33              |\n| Software     | $324.00            \
    \  |\n\nTo illustrate the GROUP BY clause and the HAVING clause further, suppose\
    \ you have a $400.00 spending limit and you want to identify the least expensive\
    \ product within each product grouping from the PRODUCTS table. The next example\
    \ returns only those product types that are within the $400.00 spending limit,\
    \ as follows.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT prodtype,\n        MIN(prodcost)\
    \ AS Cheapest\n            FORMAT=DOLLAR9.2 LABEL='Least Expensive'\n    FROM\
    \ PRODUCTS\n        GROUP BY prodtype\n            HAVING Cheapest <= 400.00;\n\
    QUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Results\n\n| Product Type | Least Expensive |\n|---|---|\n| Phone | $35.00\
    \ |\n| Software | $299.00 |\n\nWhen the WHERE clause, GROUP BY clause, and HAVING\
    \ clause are used together in a SELECT statement, the WHERE clause is processed\
    \ first. Then, the rows returned by the WHERE clause are grouped in accordance\
    \ with the GROUP BY clause. Finally, the conditions specified in the HAVING clause\
    \ are applied to the groups before the results are produced. The next example\
    \ returns those software and hardware product types that are within the $400.00\
    \ spending limit.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT prodtype,\n    \
    \    AVG(productcost) AS Average_Product_Cost\n            FORMAT=dollar12.2\n\
    \    FROM PRODUCTS\n        WHERE prodtype IN ('Software', 'Hardware')\n     \
    \   GROUP BY prodtype\n            HAVING Average_Product_Cost < 400;\nQUIT;\n\
    ```\n\n# Results\n\n| Product Type | Average_Product_Cost |\n|---|---|\n| Software\
    \ | $324.00 |\n\n# Formatting Output with the Output Delivery System\n\nSAS provides\
    \ users with a familiar and automatic way to look at output in a listing file.\
    \ Although easy to use, it is not extremely flexible when it comes to creating\
    \ nice-looking output. The SAS Output Delivery System (ODS) provides many ways\
    \ to format output by controlling the way it is accessed and formatted. Many output\
    \ formats are available with ODS, including traditional SAS monospace font (i.e.,\
    \ Listing)."
  merge: -1
  img_proc: true
- pgno: 135
  md: 'ODS was first introduced in version 7 as a way to improve the way traditional
    SAS output looks. It enables quality looking output to be produced without the
    need to import it into word processors such as Microsoft Word. Since then, many
    additional output formatting features and options are available for SAS users
    to take advantage of. With ODS, users have a powerful and easy way to create and
    access formatted procedure and DATA step output.


    # ODS and Output Formats


    ODS statements are classified as global statements and are processed immediately
    by SAS. With built-in format engines, which are referred to as output destinations,
    ODS prepares output using special formats and layouts. Figure 3.1 illustrates
    the types of output that can be produced with ODS.


    Figure 3:1: ODS Output Destinations


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_135_0.png)


    The PROC step and the DATA step produce output in the form of an output object
    to any and all open destinations. An output destination controls what format engine
    is turned on during a step or until another ODS statement is specified. One or
    more output destinations can be opened concurrently. When a destination is open,
    one or more output objects can be sent to it. Conversely, when a destination is
    closed, output objects are not sent to the destination.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "Several really good ODS books are available for further study on this exciting\
    \ facility including *Output Delivery System: The Basics and Beyond*, by Lauren\
    \ Haworth, Cynthia L. Zender, and Michele Burlew; and *Quick Results with the\
    \ Output Delivery System*, by Sunil Kumar Gupta.\n\n# Sending Output to a SAS\
    \ Data Set\n\nOutput produced by the SQL procedure can also be used as input to\
    \ another vendor’s SQL procedure, or DATA step. ODS provides an easy and consistent\
    \ alternative for creating a SAS table of results. For users who are already familiar\
    \ with ODS, this approach will consist of a simple process of specifying the OUTPUT\
    \ destination in an ODS statement. For users who prefer a more traditional ANSI\
    \ SQL approach, the CREATE TABLE statement (see Chapter 5, “Creating, Populating,\
    \ and Deleting Tables,” for more details) will be the method of choice. Depending\
    \ on the method you ultimately use, the advantage of creating a SAS table of output\
    \ is a handy feature that all SAS users should become familiar with.\n\nAlthough\
    \ the CREATE TABLE statement is the standard method of creating a table in PROC\
    \ SQL, the ODS OUTPUT statement can also be specified to produce a table. Using\
    \ the ODS OUTPUT statement, the result table is a rectangular structure consisting\
    \ of one or more rows and columns. In this example, the SQL procedure’s results\
    \ are stored in object SQL_Results and are then sent to data set SQL_DATA using\
    \ the ODS OUTPUT destination. The resulting data set is displayed using VIEWTABLE.\n\
    \n# SQL Code\n\n```\nODS LISTING CLOSE;\nODS OUTPUT SQL_Results = SQL_DATA;\n\n\
    PROC SQL;\n    TITLE1 'Delivering Output to a Data Set';\n    SELECT prodname,\
    \ prodtype, prodcost, prodnum\n        FROM PRODUCTS\n        ORDER BY prodtype;\n\
    QUIT;\n\nODS OUTPUT CLOSE;\nODS LISTING;\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Results\n\n|  | Product Name | Product Type | Product Cost | Product Number\
    \ |\n|---|---|---|---|---|\n| 1 | Travel Laptop | Laptop | $3,400.00 | 1700 |\n\
    | 2 | Office Phone | Phone | $130.00 | 2200 |\n| 3 | Digital Cell Phone | Phone\
    \ | $175.00 | 2102 |\n| 4 | Analog Cell Phone | Phone | $35.00 | 2101 |\n| 5 |\
    \ Spreadsheet Software | Software | $299.00 | 5001 |\n| 6 | Graphics Software\
    \ | Software | $299.00 | 5004 |\n| 7 | Wordprocessor Software | Software | $299.00\
    \ | 5003 |\n| 8 | Database Software | Software | $399.00 | 5002 |\n| 9 | Dream\
    \ Machine | Workstation | $3,200.00 | 1110 |\n| 10 | Business Machine | Workstation\
    \ | $3,300.00 | 1200 |\n\n# Converting Output to Rich Text Format\n\nRich Text\
    \ Format (RTF) is text that includes codes that represent special formatting attributes.\
    \ Although most frequently associated with a word processing program’s ability\
    \ to read and create encapsulated text fonts and highlighting attributes during\
    \ copy-and-paste operations, the ODS RTF destination permits output that is generated\
    \ by SAS to be packaged as RTF. This enables you to produce output that can be\
    \ shared.\n\nThe next example illustrates SQL output being sent to an external\
    \ RTF file using the RTF format engine. First, the default Listing destination\
    \ is closed, and then the RTF format engine is opened with an external file destination\
    \ to which SQL results will be routed. After the SQL procedure executes, the RTF\
    \ destination is closed and the default Listing destination is opened.\n\nNote:\
    \ Opening the RTF file automatically invokes your system’s default word processor\
    \ and displays the file contents.\n\n# SQL Code\n\n```\nODS LISTING CLOSE;\nODS\
    \ RTF FILE='c:\\SQL_Results.rtf';\n\nPROC SQL;\n    TITLE1 'Delivering Output\
    \ to Rich Text Format';\n    SELECT prodname, prodtype, prodcost, prodnum\n  \
    \  FROM PRODUCTS\n        ORDER BY prodtype;\nQUIT;\n\nODS RTF CLOSE;\nODS LISTING;\n\
    ```"
