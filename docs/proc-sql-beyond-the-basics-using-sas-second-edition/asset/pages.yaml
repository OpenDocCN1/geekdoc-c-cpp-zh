    # Interfacing PROC SQL with the Macro Language


    Many software vendors’ SQL implementation permits SQL to be interfaced with a
    host language. The SAS SQL implementation is no different. The SAS macro language
    enables you customize the way SAS software behaves, and in particular enables
    you to extend the capabilities of the SQL procedure. PROC SQL users can apply
    the macro facility’s many powerful features by interfacing the SQL procedure with
    the macro language to provide a wealth of programming opportunities.


    From creating and using user-defined macro variables and automatic variables (which
    are supplied by SAS), reducing redundant code, and performing common and repetitive
    tasks, to building powerful and simple macro applications, the macro language
    has the tools PROC SQL users need to improve efficiency. The best part is that
    you do not have to be a macro language heavyweight to begin reaping the rewards
    of this versatile interface between two powerful Base SAS software languages.


    This section will introduce you to a number of techniques that, with a little
    modification, could be replicated and used in your own programming environment.
    You will learn how to use the SQL procedure with macro programming techniques,
    as well as learn to explore how dictionary tables (see Chapter 2, “Working with
    Data in PROC SQL,” for details) and the SAS macro facility can be combined with
    PROC SQL to develop useful utilities to inquire about the operating environment
    and other information. For more information about the SAS macro language, see
    Carpenter’s Complete Guide to the SAS Macro Language, Second Edition by Art Carpenter;
    SAS Macro Programming Made Easy, Second Edition by Michele M. Burlew; and SAS
    Macro Language: Reference by SAS Institute Inc.'
