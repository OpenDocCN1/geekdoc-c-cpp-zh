    \ PRODTYPE = 'Software';\nNOTE: Table WORK.SOFTWARE_PRODUCTS created, with 4 rows\
    \ and 5 columns.\n```\n\n# ERRORSTOP/NOERRORSTOP Option\n\nThe ERRORSTOP option\
    \ instructs SQL to stop executing statements and to continue to check syntax in\
    \ noninteractive or batch sessions when an error is encountered. Conversely, the\
    \ NOERRORSTOP option tells SQL to execute statements when an error is encountered\
    \ and to continue checking syntax. The ERRORSTOP / NOERRORSTOP option can be specified\
    \ as a PROC SQL statement option or in a RESET statement. The next example illustrates\
    \ a CREATE TABLE statement being used incorrectly, and shows the SAS log results\
    \ that are generated when the ERRORSTOP option is specified.\n\n# SQL Code\n\n\
    ```\nPROC SQL ERRORSTOP;\n    CREATE TABLE SOFTWARE_PRODUCTS\n        SELECT *\n\
    \            FROM PRODUCTS\n                WHERE PRODTYPE = 'Software';\nQUIT;\n\
    ```\n\nAs illustrated in the SAS log, the ERRORSTOP option automatically stops\
    \ executing the SQL statements and displays a SAS log error message when a syntax\
    \ error is encountered."
