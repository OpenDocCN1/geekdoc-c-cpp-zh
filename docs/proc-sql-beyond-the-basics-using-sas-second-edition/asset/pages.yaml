    \ |\n\n# Producing a Row Number\n\nA unique undocumented, unsupported feature\
    \ for producing a row (observation) count can be obtained with the MONOTONIC()\
    \ function. Similar to the row numbers produced and displayed in output from the\
    \ PRINT procedure (without the NOOBS option specified), the MONOTONIC() function\
    \ displays row numbers, too. The MONOTONIC() function automatically creates a\
