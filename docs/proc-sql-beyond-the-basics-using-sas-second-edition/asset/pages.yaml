- pgno: 92
  md: "When a pattern search for a specific number of characters is needed, using\
    \ the LIKE predicate with the underscore (_) provides a way to pattern match character-by-character.\
    \ Thus, a single underscore (_) in a specific position acts as a wildcard placement\
    \ holder for that position only. Two consecutive underscores (__) act as a wildcard\
    \ placement holder for those two positions. Three consecutive underscores act\
    \ as a wildcard placement holder for those three positions. And so forth. In the\
    \ next example, the first position used to search product type contains the character\
    \ “P”, and the next five positions (represented with five underscores) act as\
    \ a placeholder for any value.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME,\n\
    \            PRODTYPE,\n            PRODCOST\n      FROM PRODUCTS\n     WHERE\
    \ UPCASE(PRODTYPE) LIKE 'P_____';\nQUIT;\n```\n\n# Results\n\n| Product Name |\
    \ Product Type | Product Cost |\n| AnalogPhone | Phone | $35.00 |\n| DigitalPhone\
    \ | Phone | $175.00 |\n| OfficePhone | Phone | $130.00 |\n\nThe next example illustrates\
    \ a pattern search of product name (PRODNAME) where the first three positions\
    \ are represented as a wildcard; the fourth position contains the lowercase character\
    \ “a”, followed by any combination of uppercase or lowercase characters.\n\n#\
    \ SQL Code\n\n```\nPROC SQL;\n    SELECT PRODNAME\n      FROM PRODUCTS\n     WHERE\
    \ PRODNAME LIKE '___a%';\nQUIT;\n```\n\n# Results\n\n| Product Name |\n| Dream\
    \ Machine |\n| Database Software |"
  merge: -1
  img_proc: true
- pgno: 93
  md: "# Testing for the Existence of a Value\n\nThe EXISTS predicate is used to test\
    \ for the existence of a set of values. In the next example, a subquery is used\
    \ to check for the existence of customers in the CUSTOMERS table with purchases\
    \ from the PURCHASES table. More details on subqueries will be presented in Chapter\
    \ 7, “Coding Complex Queries.”\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT CUSTNUM,\n\
    \            CUSTNAME,\n            CUSTCITY\n    FROM CUSTOMERS C\n    WHERE\
    \ EXISTS\n        (SELECT *\n         FROM PURCHASES P\n         WHERE C.CUSTNUM\
    \ = P.CUSTNUM);\nQUIT;\n```\n\n# Results\n\n| Customer Number | Customer Name\
    \ | Customer's Home City |\n|---|---|---|\n| 101 | La Mesa Computer Land | La\
    \ Mesa |\n| 201 | Vista Tech Center | Vista |\n| 301 | Coronado Internet Zone\
    \ | Coronado |\n| 401 | La Jolla Computing | La Jolla |\n| 501 | Alpine Technical\
    \ Center | Alpine |\n| 701 | San Diego Byte Store | San Diego |\n| 801 | Jamul\
    \ Hardware & Software | Jamul |\n| 901 | Del Mar Tech Center | Del Mar |\n| 1001\
    \ | Lakeside Software Center | Lakeside |\n| 1101 | Bonsall Network Store | Bonsall\
    \ |\n| 1201 | Rancho Santa Fe Tech | Rancho Santa Fe |\n| 1301 | Spring Valley\
    \ Byte Center | Spring Valley |\n| 1401 | Poway Central | Poway |\n| 1601 | Fairbanks\
    \ Tech USA | Fairbanks Ranch |\n| 1701 | Blossom Valley Tech | Blossom Valley\
    \ |\n| 1801 | Chula Vista Networks |  |"
