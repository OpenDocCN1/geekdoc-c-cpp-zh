    \ the ON UPDATE CASCADE clause to enable any changes that are made to the PRODUCTS\
    \ table to be automatically cascaded through to the INVENTORY table. This ensures\
    \ that changes to the product number values in the PRODUCTS table automatically\
    \ occur in the INVENTORY table as well.\n\n# SQL Code\n\n```\nPROC SQL;\n    ALTER\
    \ TABLE INVENTORY\n    ADD CONSTRAINT FOREIGN_PRODUCT_KEY FOREIGN KEY (PRODNUM)\n\
    \        REFERENCES PRODUCTS\n        ON UPDATE CASCADE\n        ON DELETE RESTRICT\
    \  /* DEFAULT VALUE */;\nQUIT;\n```\n\nThe SAS log displays the successful creation\
    \ of the PRODNUM column as a foreign key in the INVENTORY table. When the ON UPDATE\
    \ and ON DELETE clauses are specified, the execution of any SQL statement that\
    \ could violate referential integrity rules is strictly prohibited."
