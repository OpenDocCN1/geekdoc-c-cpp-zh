  md: "Applying a set of rules to the database structure and content can ensure the\
    \ integrity of data resources. These rules consist of table and column constraints,\
    \ and will be discussed in detail in Chapter 5, “Creating, Populating, and Deleting\
    \ Tables.”\n\n# Referential Integrity\n\nReferential integrity refers to the way\
    \ in which database tables handle update and delete requests. Database tables\
    \ frequently have a primary key where one or more columns have a unique value\
    \ by which rows in a table can be identified and selected. Other tables may have\
    \ one or more columns called a foreign key that are used to connect to some other\
    \ table through its value. Database designers frequently apply rules to database\
    \ tables to control what happens when a primary key value changes and its effect\
    \ on one or more foreign key values in other tables. These referential integrity\
    \ rules apply restrictions on the data that may be updated or deleted in tables.\n\
    \nReferential integrity ensures that rows in one table have corresponding rows\
