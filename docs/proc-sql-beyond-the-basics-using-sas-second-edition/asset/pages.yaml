- pgno: 227
  md: "# SQL Code\n\n```\nPROC SQL;\n    DELETE FROM CUSTOMERS;\nQUIT;\n```\n\n# SAS\
    \ Log Results\n\n```\nPROC SQL;\n    DELETE FROM CUSTOMERS;\nNOTE: 28 rows were\
    \ deleted from WORK.CUSTOMERS.\nQUIT;\nNOTE: PROCEDURE SQL used:\n       real\
    \ time          0.00 seconds\n```\n\n# Deleting Tables\n\nThe SQL standard permits\
    \ one or more unwanted tables to be removed (or deleted) from a database (SAS\
    \ library). During large program processes, temporary tables in the WORK library\
    \ are frequently created. The creation and build-up of these tables can negatively\
    \ affect memory and storage performance areas, which can cause potential problems\
    \ due to insufficient resources. It is important from a database management perspective\
    \ to be able to delete any unwanted tables to avoid these types of resource problems.\
    \ Here are a few guidelines to keep in mind.\n\nBefore a table can be deleted,\
    \ complete ownership of the table (that is, exclusive access to the table) should\
    \ be verified. Although some SQL implementations require a table to be empty in\
    \ order to delete it, the SAS implementation permits a table to be deleted with\
    \ or without any rows of data in it. After a table is deleted, any references\
    \ to that table are no longer recognized and will result in a syntax error. Additionally,\
    \ any references to a deleted table in a view will also result in an error (see\
    \ Chapter 8, “Working with Views”). Also, any indexes that are associated with\
    \ a deleted table are automatically dropped (see Chapter 6, “Modifying and Updating\
    \ Tables and Indexes”).\n\n# Deleting a Single Table\n\nDeleting a table from\
    \ the database environment is not the same as making a table empty. Although an\
    \ empty table contains no data, it still possesses a structure; a deleted table\
    \ contains no data or related structure. Essentially, a deleted table does not\
    \ exist because the table including its data and structure are physically removed\
    \ forever. Deleting a single table from a database environment requires a single\
    \ table name to be referenced in a DROP TABLE statement. In the next example,\
    \ a single table called HOT_PRODUCTS located in the WORK library is physically\
    \ removed using a DROP TABLE statement.\n\n# SQL Code\n\n```\nPROC SQL;\n    DROP\
    \ TABLE HOT_PRODUCTS;\nQUIT;\n```"
  merge: -1
  img_proc: true
