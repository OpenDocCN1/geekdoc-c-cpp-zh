    \ *\n        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) = 'LAPTOP'\n\n\
    \    UNION\n\n    SELECT *\n        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE)\
    \ = 'SOFTWARE';\n```"
