- pgno: 314
  md: "indexes exist as well as which tables have the most indexes defined. The next\
    \ example illustrates an SQL query that accesses DICTIONARY table content (see\
    \ Chapter 2, “Working with Data in PROC SQL”) to identify the tables in a database\
    \ environment with the most indexes.\n\n# SQL Code\n\n```\n/*************************************************************************/\n\
    /** PROGRAM NAME: TABLES-WITH-THE-MOST-INDEXES.SAS                     **/\n/**\
    \ PURPOSE..... : Perform an index analysis to identify the           **/\n/**\
    \               tables with the most indexes.                         **/\n/**\
    \ AUTHOR...... : Kirk Paul Lafler                                     **/\n/**\
    \ DATE WRITTEN: August 22, 2012                                       **/\n/*************************************************************************/\n\
    proc sql;\n    create table Tables_with_most_Indexes as\n        select i.libname,\n\
    \               i.memname,\n               i.name,\n               i.idxusage,\n\
    \               i.indxname,\n               count(i.memname) as ctr_memname\n\
    \               label='Number of Defined Indexes',\n               t.nobs\n  \
    \      from dictionary.indexes i,\n             dictionary.tables t\n        where\
    \ upcase(i.libname) = upcase(t.libname) and\n              upcase(i.memname) =\
    \ upcase(t.memname) and\n              upcase(i.idxusage) IN ('SIMPLE','COMPOSITE','BOTH')\n\
    \        group by i.libname, i.memname\n        order by ctr_memname desc, t.nobs;\n\
    quit;\n```\n\n# Results\n\nThe results for tables with the most indexes are displayed\
    \ in Figure 7.12.\n\n# Figure 7.12: TABLES_WITH_MOST_INDEXES\n\n|  | Library Name\
    \ | Member Name | Column Name | Column Index Type | Index Name | Number of Defined\
    \ Indexes | Number of Physical Observations |\n|---|---|---|---|---|---|---|---|\n\
    | 1 | WORK | PRODUCTS | manunum | COMPOSITE | MANUNUM_PRODTYP | 3 | 10 |\n| 2\
    \ | WORK | PRODUCTS | prodtype | COMPOSITE | MANUNUM_PRODTYP | 3 | 10 |\n| 3 |\
