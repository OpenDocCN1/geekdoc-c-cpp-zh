    \ currently defined titles and footnotes. |\n| VIEWS | VVIEW | Provides information\
    \ related to currently defined data views. |\n\n# Displaying Dictionary Table\
    \ Definitions\n\nYou can view a dictionary table’s definition and enhance your\
    \ understanding of each table’s contents by specifying a DESCRIBE TABLE statement.\
    \ The results of the statements used to create each dictionary table can be displayed\
    \ in the SAS log. For example, a DESCRIBE TABLE statement is illustrated below\
    \ to display the CREATE TABLE statement used in building the OPTIONS dictionary\
    \ table containing current SAS system option settings.\n\n# SQL Code\n\n```\n\
    PROC SQL;\n    DESCRIBE TABLE\n        DICTIONARY.OPTIONS;\nQUIT;\n```"
