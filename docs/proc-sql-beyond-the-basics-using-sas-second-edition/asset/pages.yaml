- pgno: 191
  md: "# Results\n\n# The CONTENTS Procedure\n\n|  | Alphabetic List of Variables\
    \ and Attributes |  |  |  |  |\n|---|---|---|---|---|---|\n| # | Variable | Type\
    \ | Len | Format | Label |\n| 2 | MANUNUM | Num | 3 |  | Manufacturer Number |\n\
    | 3 | PRODCOST | Num | 5 | DOLLAR9.2 | Product Cost |\n| 4 | PRODNAME | Char |\
    \ 25 |  | Product Name |\n| 1 | PRODNUM | Num | 3 |  | Product Number |\n| 5 |\
    \ PRODTYPE | Char | 15 |  | Product Type |\n\n# Creating a Table Using the LIKE\
    \ Clause\n\nReferencing an existing table in a CREATE TABLE statement is an effective\
    \ way of creating a new table. In fact, it can be a great time-saver, because\
    \ it prevents having to define each column one at a time as was shown with column-definition\
    \ lists. The LIKE clause (in the CREATE TABLE statement) triggers the existing\
    \ table’s structure to be copied to the new table minus any columns dropped with\
    \ the KEEP= or DROP= data set (table) option. It copies the column names and attributes\
    \ from the existing table structure to the new table structure. Using this method\
    \ results in the creation of an empty table (without rows). To illustrate this\
    \ method of creating a new table, a table called HOT_PRODUCTS will be created\
    \ with the LIKE clause.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE HOT_PRODUCTS\n\
    \        LIKE PRODUCTS;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n \
    \   CREATE TABLE HOT_PRODUCTS\n        LIKE PRODUCTS;\nNOTE: Table HOT_PRODUCTS\
    \ created, with 0 rows and 5 columns.\nQUIT;\nNOTE: PROCEDURE SQL used:\n    \
    \  real time          0.00 seconds\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "As a result of executing the CREATE TABLE statement and the LIKE clause the\
    \ new table contains zero rows of data but does include all the column definitions\
    \ without any rows of data from an existing table and/or view. What this means\
    \ is that only the metadata (data describing data) is copied to the new table.\
    \ The particular definitions that are copied include: column names, data type,\
    \ length, precision, label, informat, format, and so on.\n\nThe next example illustrates\
    \ how to create a new table by selecting only the columns that you have an interest\
    \ in. This method is not supported by the SQL ANSI standard. Suppose that you\
    \ want three columns (PRODNAME, PRODTYPE, and PRODCOST) from the PRODUCTS table.\
    \ The following code illustrates how the KEEP= data set (table) option can be\
    \ used to accomplish this.\n\nNote: Data sets can also be called tables.\n\n#\
    \ SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE HOT_PRODUCTS (KEEP=PRODNAME PRODTYPE\
    \ PRODCOST)\n    LIKE PRODUCTS;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC\
    \ SQL;\n    CREATE TABLE HOT_PRODUCTS (KEEP=PRODNAME PRODTYPE PRODCOST)\n    LIKE\
    \ PRODUCTS;\nNOTE: Table HOT_PRODUCTS created, with 0 rows and 3 columns.\nQUIT;\n\
    NOTE: PROCEDURE SQL used:\nreal time          0.00 seconds\n```\n\n# Deriving\
    \ a Table and Data from an Existing Table\n\nDeriving a new table from an existing\
    \ table is the most popular and effective way to create a table. This method uses\
    \ a query expression, and the results are stored in a new table instead of being\
    \ displayed as SAS output. This method not only stores the column names and their\
    \ attributes, but also stores the rows of data that satisfy the query expression.\
    \ The next example illustrates creating a new table with a query expression.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE HOT_PRODUCTS AS\n    SELECT *\n\
    \    FROM PRODUCTS;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 193
  md: "# SAS Log Results\n\n```\nPROC SQL;\n    CREATE TABLE HOT_PRODUCTS AS\n   \
    \     SELECT *\n        FROM PRODUCTS;\nNOTE: Table WORK.HOT_PRODUCTS created,\
    \ with 10 rows and 5 columns.\nQUIT;\nNOTE: PROCEDURE SQL used:\n    real time\
    \          0.00 seconds\n```\n\nYou might notice after examining the SAS log in\
    \ the previous example that the SELECT statement extracted all rows from the existing\
    \ table (PRODUCTS) and copied them to the new table (HOT_PRODUCTS). In the absence\
    \ of a WHERE clause, the resulting table (HOT_PRODUCTS) contains the identical\
    \ number of rows as the parent table PRODUCTS.\n\nThe power of the CREATE TABLE\
    \ statement, then, is in its ability to create a new table from an existing table.\
    \ What is often overlooked in this definition is the CREATE TABLE statement’s\
    \ ability to form a subset of a parent table. More frequently than not, a new\
    \ table represents a subset of its parent table. For this reason, this method\
    \ of creating a table is the most powerful and widely used. Suppose that you want\
    \ to create a table called HOT_PRODUCTS that contains a subset of the “Software”\
    \ and “Phones” product types. The following query-expression would accomplish\
    \ this.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE HOT_PRODUCTS AS\n  \
    \      SELECT *\n        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) IN\
    \ (\"SOFTWARE\", \"PHONE\");\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n\
    \    CREATE TABLE HOT_PRODUCTS AS\n        SELECT *\n        FROM PRODUCTS\n \
    \           WHERE UPCASE(PRODTYPE) IN (\"SOFTWARE\", \"PHONE\");\nNOTE: Table\
    \ WORK.HOT_PRODUCTS created, with 7 rows and 5 columns.\nQUIT;\nNOTE: PROCEDURE\
    \ SQL used:\n    real time          0.38 seconds\n```\n\nLet’s look at another\
    \ example. Suppose that you want to create another table called NOT_SO_HOT_PRODUCTS\
    \ that contains a subset of everything but the “Software” and “Phones” product\
    \ types. The following query-expression would accomplish this."
  merge: -1
  img_proc: true
- pgno: 194
  md: "# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE NOT_SO_HOT_PRODUCTS AS\n   \
    \     SELECT *\n            FROM PRODUCTS\n                WHERE UPCASE(PRODTYPE)\
    \ NOT IN (\"SOFTWARE\", \"PHONE\");\nQUIT;\n```\n\n# SAS Log Results\n\n```\n\
    PROC SQL;\n    CREATE TABLE NOT_SO_HOT_PRODUCTS AS\n        SELECT *\n       \
    \     FROM sql.PRODUCTS\n                WHERE UPCASE(PRODTYPE) NOT IN (\"SOFTWARE\"\
    , \"PHONE\");\nNOTE: Table NOT_SO_HOT_PRODUCTS created, with 3 rows and 5 columns.\n\
    QUIT;\nNOTE: PROCEDURE SQL used:\n        real time          1.20 seconds\n```\n\
    \n# Populating Tables\n\nAfter a table is created, it can then be populated with\
    \ data. Unless the newly created table is defined as a subset of an existing table\
    \ or its content is to remain static, one or more rows of data may eventually\
    \ need to be added. The SQL standard provides the INSERT INTO statement as the\
    \ vehicle for adding rows of data. In fact, the INSERT INTO statement doesn’t\
    \ really insert rows of data at all. It simply adds each row to the end of the\
    \ table.\n\nThe examples in this section look at a number of approaches to populate\
    \ tables. As new rows of data are added to or changed in a target table, many\
    \ things must be kept in-check behind the scenes including the need to carry out\
    \ or commit any permanent changes to a table. This important step checks each\
    \ write operation for errors and, should one or more errors occur, provides SAS\
    \ with the ability to completely rollback or undo the changes since the last commit.\
    \ For example, before a row insertion is allowed entry into a table with assigned\
    \ integrity constraints, it is first marked as uncommitted, then validated against\
    \ the assigned integrity constraints, and if no violations occur, the row insertion\
    \ is committed to the table. The following row insertion methods are illustrated:\n\
    \n+   - adding data to a table with a SET clause\n+   - adding data to all of\
    \ the columns in a row\n+   - adding data to some of the columns in a row\n+ \
    \  - adding data with a SELECT query\n+   - bulk loading data with Microsoft Excel"
  merge: -1
  img_proc: true
- pgno: 195
  md: "# Adding Data to a Table with a SET Clause\n\nYou populate tables with data\
    \ by using an INSERT INTO statement. Three parameters are specified with an INSERT\
    \ INTO statement: the name of the table, the names of the columns in which values\
    \ are inserted, and the values themselves. One or more rows of data are inserted\
    \ into a table with a SET clause. Suppose that you want to insert (or add) a single\
    \ row of data to the CUSTOMERS table and the row consists of three columns (Customer\
    \ Number, Customer Name, and Home City).\n\n# SQL Code\n\n```\nPROC SQL;\n   \
    \ INSERT INTO CUSTOMERS\n        SET CUSTNUM=702,\n            CUSTNAME='Mission\
    \ Valley Computing',\n            CUSTCITY='San Diego';\nQUIT;\n```\n\nThe SAS\
    \ log displays the following message noting that one row was inserted into the\
    \ CUSTOMERS table.\n\n# SAS Log Results\n\n```\nPROC SQL;\n    INSERT INTO CUSTOMERS\n\
    \        SET CUSTNUM=702,\n            CUSTNAME='Mission Valley Computing',\n\
    \            CUSTCITY='San Diego';\nNOTE: 1 row was inserted into WORK.CUSTOMERS.\n\
    \    QUIT;\nNOTE: PROCEDURE SQL used:\n        real time            0.08 seconds\n\
    ```"
  merge: -1
  img_proc: true
