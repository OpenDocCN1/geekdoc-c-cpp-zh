    \ Machine | Workstation | $2,640.00 |\n| Travel Laptop | Laptop | $2,720.00 |\n\
    \n# Finding Duplicate Values\n\nIn some situations, several rows in a table may\
    \ contain identical or duplicate column values. To select only one of each identical\
    \ or duplicate values, SAS supports and processes the DISTINCT and UNIQUE keywords\
    \ the same and without any noticeable performance differences. On another note,\
    \ the ANSI standards support the DISTINCT keyword as the keyword of choice with\
    \ SELECT statements enabling greater code portability to other databases. The\
    \ DISTINCT keyword can be used in the SELECT statement as follows."
