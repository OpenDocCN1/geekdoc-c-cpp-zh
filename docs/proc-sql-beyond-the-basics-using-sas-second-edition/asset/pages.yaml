    # OUTOBS= Option\n\nThe OUTOBS= option reduces the amount of query execution time\
    \ by restricting the number of rows that PROC SQL sends as output to a designated\
    \ output source. As with the INOBS= option, the OUTOBS= option is most often used\
    \ for troubleshooting or debugging purposes where a small number of rows are needed\
    \ in an output table. Controlling the number of rows that are sent as output with\
    \ the OUTOBS= option is similar to setting the SAS System option OBS= (or the\
    \ data set option OBS=). The following example creates an output table with five\
    \ rows as designated by the OUTOBS= option. A SAS log warning message shows that\
    \ the new table contains five rows.\n\n# SQL Code\n\n```\nPROC SQL OUTOBS=5;\n\
    \    CREATE TABLE PRODUCTS_SAMPLE AS\n        SELECT *\n            FROM PRODUCTS;\n\
    QUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL OUTOBS=5;\n    CREATE TABLE PRODUCTS_SAMPLE\
    \ AS\n        SELECT *\n            FROM PRODUCTS;\nWARNING: Statement terminated\
    \ early due to OUTOBS=5 option.\nNOTE: Table WORK.PRODUCTS_SAMPLE created, with\
    \ 5 rows and 5 columns.\nQUIT;\n```\n\n# PROMPT Option\n\nThe PROMPT option is\
    \ issued during interactive sessions to prompt users to continue or stop processing\
    \ when the limits of an INOBS=, LOOPS=, and/or OUTOBS= option are reached. If\
    \ the PROMPT option is specified along with one or more of these options, a dialog\
    \ box appears that indicates that the limits of the specified option have been\
    \ reached, and asks whether to stop or continue processing. This prompting feature\
    \ is a useful process for stepping through a running application.\n\nThe following\
    \ example shows the PROMPT option being issued to initiate a dialogue between\
    \ the SQL procedure session and the user. The PROMPT option specifies that the\
    \ INOBS= option limit"
