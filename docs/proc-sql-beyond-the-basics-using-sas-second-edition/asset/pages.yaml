- pgno: 43
  md: '# Summary


    +   1. Good database design often improves the relative ease by which tables can
    be created and populated in a relational database and can be implemented into
    any database (see the “Conceptual View” section).

    +   2. SQL was designed to work with sets of data and accesses a data structure
    known as a table or a “virtual” table, known as a view (see the “Table Definitions”
    section).

    +   3. Achieving optimal design of a database means that the database contains
    little or no redundant information in two or more of its tables. This means that
    good database design calls for little or no replication of data (see the “Redundant
    Information” section).

    +   4. Good database design avoids data redundancy, update anomalies, costly or
    inefficient processing, coding complexities, complex logical relationships, long
    application development times, and/or excessive storage requirements (see the
    “Normalization” section).

    +   5. Design decisions made in one phase may involve making one or more tradeoffs
    in another phase (see the “Normalization” section).

    +   6. A database in third normal form (3NF) is defined as a column that is dependent
    on the key, the whole key, and nothing but the key (see the “Normalization” section).'
  merge: -1
  img_proc: true
