    \ | 901 Del Mar Tech Center | Del Mar |\n| 10 | 1001 Lakeside Software Center\
    \ | Lakeside |\n| 11 | 1101 Bonsall Network Store | Bonsall |\n| 12 | 1201 Rancho\
    \ Santa Fe Tech | Rancho Santa Fe |\n| 13 | 1301 Spring Valley Byte Center | Spring\
    \ Valley |\n| 14 | 1401 Poway Central | Poway |\n| 15 | 1501 Valley Center Tech\
    \ Center | Valley Center |\n| 16 | 1601 Fairbanks Tech USA | Fairbanks Ranch |\n\
