    # Table Definitions


    PROC SQL uses a model of data that is conceptually stored as multisets rather
    than as physical files. A physical file consists of one or more records ordered
    sequentially or some other way. Programming languages such as COBOL and FORTRAN
    evolved to process files of this type by performing operations one record at a
    time. These languages were generally designed and used to mimic the way people
    process paper forms.


    PROC SQL was designed to work with multisets of data. Multisets have no order,
    and members of a multiset are of the same type using a data structure known as
    a table. For classification purposes, a table is a base table consisting of zero
    or more rows and one or more columns, or a table is a virtual table (called a
    view), which can be used the same way that a table can be used (see Chapter 8,
    “Working with Views”).


    # Redundant Information


    One of the rules of good database design requires that data not be redundant or
    duplicated in the same database. The rationale for this conclusion originates
    from the belief that if data appears more than once in a database, then there
    is reason to believe that one of the pieces of data is likely to be in error.
    Furthermore, redundancy often leads to the following:


    +   - Inconsistencies, because errors are more likely to result when facts are
    repeated.

    +   - Update anomalies where the insertion, modification, or deletion of data
    may result in inconsistencies.


    Another thing to watch for is the appearance of too many columns containing NULL
    values. When this occurs, the database is probably not designed properly. To alleviate
    potential table design'
  merge: -1
