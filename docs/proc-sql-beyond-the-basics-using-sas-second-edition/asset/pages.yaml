  md: "of UNDO_POLICY=NONE is issued before the second update query to change the\
    \ way updates are handled. The NONE option keeps any updates that have been made\
    \ regardless of whether an error is detected. A warning message is displayed alerting\
    \ you to the change in the way updates are handled.\n\n# SQL Code\n\n```\nPROC\
    \ SQL UNDO_POLICY=REQUIRED;\n    UPDATE PRODUCTS\n        SET PRODCOST = PRODCOST\
    \ - (PRODCOST * 0.2)\n        WHERE UPCASE(PRODTYPE) = 'LAPTOP';\n    RESET UNDO_POLICY=NONE;\n\
    \    UPDATE PRODUCTS\n        SET PRODCOST = PRODCOST - (PRODCOST * 0.2)\n   \
    \     WHERE UPCASE(PRODTYPE) = 'LAPTOP';\nQUIT;\n```\n\n# SAS Log Results\n\n\
    ```\nPROC SQL UNDO_POLICY=REQUIRED;\n    UPDATE PRODUCTS\n        SET PRODCOST\
    \ = PRODCOST - (PRODCOST * 0.2)\n        WHERE UPCASE(PRODTYPE) = 'LAPTOP';\n\
    NOTE: 1 row was updated in WORK.PRODUCTS.\nRESET UNDO_POLICY=NONE;\n    UPDATE\
    \ PRODUCTS\n        SET PRODCOST = PRODCOST - (PRODCOST * 0.2)\n        WHERE\
    \ UPCASE(PRODTYPE) = 'LAPTOP';\nWARNING: The SQL option UNDO_POLICY=REQUIRED is\
    \ not in effect. If an error is detected when processing this UPDATE statement,\
    \ that error will not cause the entire statement to fail.\nNOTE: 1 row was updated\
    \ in WORK.PRODUCTS.\nQUIT;\n```\n\n# EXEC/NOEXEC Option\n\nThe NOEXEC option checks\
    \ all non-query statements such as CREATE TABLE or ALTER TABLE within the SQL\
    \ procedure for syntax-related errors and displays any identified errors in the\
    \ SAS log. The NOEXEC option is similar to the VALIDATE statement in that it checks\
    \ for syntax correctness without the execution of any input data. The only difference\
    \ between the NOEXEC option and the VALIDATE statement is in the way they are\
    \ specified. As was presented earlier, the VALIDATE statement is specified before\
    \ each SELECT statement; the NOEXEC / EXEC option can be specified as a PROC SQL\
    \ statement option or in a RESET statement.\n\nTo illustrate the troubleshooting\
    \ and debugging process, the following non-query SQL code will be shown using\
    \ the NOEXEC and EXEC options. The next example illustrates that the non-query\
    \ CREATE TABLE statement is not to be executed after its syntax is checked for\
    \ correctness. As a result of the NOEXEC option being specified, any syntax-related\
    \ errors are automatically displayed in the SAS log."
  merge: -1
  img_proc: true
