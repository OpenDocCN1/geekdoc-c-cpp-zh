  md: "# Result of Inner Query\n\n```\nPROC SQL;\n    SELECT manunum, prodnum, invqty,\
    \ invprice\n      FROM INVOICE\n        WHERE invprice < ALL ($1,495.,$798.);\n\
    QUIT;\n```\n\n+   1. PROC SQL retrieves all invoices from the outer query where\
    \ the invoice price is less than the row values that are passed from the inner\
    \ query.\n+   2. The WHERE clause of the inner query retrieves all invoice prices\
    \ for product numbers 5001 and 5002 and passes them to the outer query.\n+   3.\
    \ The resulting inner query passes multiple row values to the main (outer) query\
    \ for execution.\n\n# Results\n\n| Manufacturer Number | Product Number | Invoice\
    \ Quantity - Units Sold | Invoice Unit Price |\n|---|---|---|---|\n| 210 | 2101\
    \ | 7 | $245.00 |\n| 500 | 6000 | 4 | $396.00 |\n\n# Correlated Subqueries\n\n\
    In the subquery examples shown previously, the subquery (inner query) operates\
    \ independently from the main (outer) query. Essentially, the subquery’s results\
    \ are evaluated and used as input to the main (outer) query. Although this is\
    \ a common way that subqueries execute, it is not the only way. SQL also permits\
    \ a subquery to accept one or more values from its outer query. Once the subquery\
    \ executes, the results are then passed to the outer query. Subqueries of this\
    \ variety are called correlated subqueries. The ability to construct subqueries\
    \ in this manner provides a powerful extension to SQL.\n\nThe difference between\
    \ the subqueries discussed previously and correlated subqueries is in the way\
    \ the WHERE clause is constructed. Correlated subqueries relate a column in the\
    \ subquery with a column in the outer query to determine the rows that match or\
    \ in certain cases don’t match the expression. Suppose, for example, that you\
    \ want to view products in the PRODUCTS table that do not appear in the INVOICE\
    \ table. One way to do this is to construct a correlated subquery.\n\nIn the next\
    \ example, the subquery compares the product number column in the PRODUCTS table\
    \ with the product number column in the INVOICE table. If at least one match is\
    \ found (the product appears in both the PRODUCTS and INVOICE tables), then the\
    \ resulting table from the subquery will not be empty, and the NOT EXISTS condition\
    \ will be false. However, if no matches are found, then the subquery returns an\
    \ empty table that results in the NOT EXISTS condition being true, which causes\
    \ the product number, product name, and product type of the current row in the\
    \ main (outer) query to be selected."
