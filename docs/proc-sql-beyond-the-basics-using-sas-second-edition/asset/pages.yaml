    # Normalization Strategies


    After transforming entities and attributes from the conceptual design into a logical
    design, the tables and columns are created. This is when a process known as normalization
    occurs.

    Normalization refers to the process of making your database tables subscribe to
    certain rules.

    Many, if not most, database designers are satisfied when third normal form (3NF)
    is achieved and, for the objectives of this book, I will stop at 3NF, too. To
    help explain the various normalization steps, an example scenario follows.


    # First Normal Form (1NF)


    First normal form (1NF) involves the elimination of data redundancy or repeating
    information from a table. A table is considered to be in first normal form when
    all of its columns describe the table completely and when each column in a row
    has only one value. A table satisfies 1NF when each column in a row has a single
    value and no repeating group information. Essentially, every table meets 1NF as
    long as an array, list, or other structure has not been defined. The following
    table illustrates a table satisfying the 1NF rule because it has only one value
    at each row-and-column intersection. The table is in ascending order by CUSTNUM
    and consists of customers and the purchases they made at an office supply store.


    # Table 1.1: First Normal Form (1NF) Table


    | CUSTNUM | CUSTNAME | CUSTCITY | ITEM | UNITS | UNITCOST | MANUCITY |

    |---|---|---|---|---|---|---|

    | 1 | Smith | San Diego | Chair | 1 | $179.00 | San Diego |

    | 1 | Smith | San Diego | Pens | 12 | $0.89 | Los Angeles |

    | 1 | Smith | San Diego | Paper | 4 | $6.95 | Washington |

    | 1 | Smithe | San Diego | Stapler | 1 | $8.95 | Los Angeles |

    | 7 | Lafler | Spring Valley | Mouse Pad | 1 | $11.79 | San Diego |

    | 7 | Loffler | Spring Valley | Pens | 24 | $1.59 | Los Angeles |

    | 13 | Thompson | Miami | Markers | . | $0.99 | Los Angeles |


    # Second Normal Form (2NF)


    Second normal form (2NF) addresses the relationships between sets of data. A table
    is said to be in second normal form when all the requirements of 1NF are met and
    a foreign key is used to link any data in one table which has relevance to another
    table. The very nature of leaving a table in first normal form (1NF) may present
    problems due to the repetition of some information in the table. One noticeable
    problem is that Table 1.1 has repetitive information in it. Another problem is
    that there are misspellings in the customer name. Although repeating information
    may be permissible with hierarchical file structures and other legacy type file
    structures, it does pose a potential data consistency problem as it relates to
    relational data.


    To describe how data consistency problems can occur, let’s say that a customer
    takes a new job and moves to a new city. In changing the customer’s city to the
    new location, it would be very easy to miss one or more occurrences of the customer’s
    city resulting in a customer residing incorrectly in'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'two different cities. Assuming that our table is only meant to track one unique
    customer per city, this would definitely be a data consistency problem. Essentially,
    second normal form (2NF) is important because it says that every non-key column
    must depend on the entire primary key.


    Tables that subscribe to 2NF prevent the need to make changes in more than one
    place. What this means in normalization terms is that tables in 2NF have no partial
    key dependencies. As a result, our database that consists of a single table that
    satisfies 1NF will need to be split into two separate tables in order to subscribe
    to the 2NF rule. Each table would contain the CUSTNUM column to connect the two
    tables. Unlike the single table in 1NF, the tables in 2NF allow a customer’s city
    to be easily changed whenever they move to another city because the CUSTCITY column
    only appears once. The tables in 2NF would be constructed as follows.


