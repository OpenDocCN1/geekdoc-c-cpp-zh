  md: "The INSERT INTO statement can also be used to insert rows of data without having\
    \ to specify the column names as long as a value is keyed for each and every column\
    \ in the table in the exact order that columns are specified in the table. Note:\
    \ Learning the order of a table’s columns may require producing output from the\
    \ CONTENTS procedure, and/or inspection of the metadata column, VARNUM, from the\
    \ Dictionary.columns table or SASHELP.VCOLUMNS view. The following example illustrates\
    \ the absence of the table’s column names in the INSERT INTO statement as three\
    \ rows of data are added using the VALUES clause.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    \    INSERT INTO CUSTOMERS\n        VALUES (402, 'La Jolla Tech Center', 'La Jolla')\n\
    \        VALUES (502, 'Alpine Byte Center', 'Alpine')\n        VALUES (1702,'Rancho\
    \ San Diego Tech','Rancho San Diego');\n\n    SELECT *\n        FROM CUSTOMERS\n\
    \            ORDER BY CUSTNUM;\nQUIT;\n```\n\nThe SAS log shows three rows of\
    \ data were inserted into the CUSTOMERS table.\n\n# SAS Log Results\n\n```\nPROC\
    \ SQL;\n    INSERT INTO CUSTOMERS\n        VALUES (402, 'La Jolla Tech Center',\
    \ 'La Jolla')\n        VALUES (502, 'Alpine Byte Center', 'Alpine')\n        VALUES\
    \ (1701,'Rancho San Diego Tech','Rancho San Diego');\nNOTE: 3 rows were inserted\
    \ into WORK.CUSTOMERS.\n\n    SELECT *\n        FROM CUSTOMERS\n            ORDER\
    \ BY CUSTNUM;\nQUIT;\nNOTE: PROCEDURE SQL used:\n        real time           \
