- pgno: 329
  md: "# Eliminating Redundancy\n\nData redundancy commonly occurs when two or more\
    \ users want to see the same data in different ways. To prevent redundancy, organizations\
    \ should create and maintain a master database environment rather than propagate\
    \ one or more subsets of data among its user communities. The latter approach\
    \ creates an environment that is not only problematic for the organization but\
    \ for its users and customers.\n\nViews provide a way to eliminate or, at least,\
    \ reduce the degree of data redundancy. Rather than having the same data exist\
    \ in multiple forms, views create a virtual and shareable database environment\
    \ for all. Problems that are related to accessing and reporting outdated information,\
    \ as well as table and program change control, are eliminated.\n\n# Restricting\
    \ Data Access—Security\n\nAs data security issues grow increasingly important\
    \ for organizations around the globe, views offer a powerful alternative in controlling\
    \ or restricting access to sensitive information. Views, like tables, can prevent\
    \ unauthorized users from accessing sensitive portions of data. This is important\
    \ because security breaches pose great risks not only to an organization’s data\
    \ resources but to the customer as well.\n\nViews can be constructed to show a\
    \ view of data that is different from what physically exists in the underlying\
    \ base tables. Specific columns can be shown while other columns are hidden. This\
    \ helps prevent sensitive information such as salary, medical, or credit card\
    \ data from getting into the wrong hands. Or a view can contain a WHERE clause\
    \ with any degree of complexity to restrict what rows appear for a group of users\
    \ while hiding other rows. In the next example, a view called SOFTWARE_PRODUCTS_VIEW\
    \ is created that displays all columns from the original table except the product\
    \ cost (PRODCOST) column, and restricts all rows except “Software” from the PRODUCTS\
    \ table.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE VIEW SOFTWARE_PRODUCTS_VIEW\
    \ AS\n        SELECT prodnum, prodname, manunum, prodtype\n            FROM PRODUCTS\n\
    \                WHERE UPCASE(PRODTYPE) IN ('SOFTWARE');\nQUIT;\n```"
  merge: -1
  img_proc: true
