- pgno: 261
  md: '# Demystifying Join Algorithms


    The SQL procedure contains an optimizer whose purpose is to use the best plan
    for query execution. A join algorithm locates, for each distinct value of the
    join attributes, an ordered list of elements in each relation that display that
    value. The SQL optimizer uses criteria to determine which join algorithm to use
    to optimize the query. The join construct, the structure of the data, the definition
    of indexes, the availability of real memory, and other factors can influence the
    join algorithm that is selected by the optimizer. The specific details of each
    of the join algorithms are described below.


    # Nested Loop


    A nested loop join algorithm might be selected by the SQL optimizer when processing
    small tables of data where one table is considerably smaller than the other table,
    the join condition does not contain an equality condition, first row matching
    is optimized, or using a sort-merge or hash join has been eliminated. This algorithm
    operates by looping through the smaller of the tables looking for a matching key
    in the larger table. A nested loop join algorithm is extremely sensitive to the
    contents of the right table because it processes the right table for each row
    of the left table. For this reason, this join algorithm tends to be more CPU intensive
    than other choices, particularly as the table sizes increase.


    # Sort-Merge


    A sort-merge join algorithm might be selected by the SQL optimizer when the tables
    are small to medium size. This algorithm operates by first sorting the tables
    of data (if necessary) using one or more key columns, and then, for each row in
    the left table, the algorithm reads all matching rows in the right table. The
    SQL optimizer considers using a sort-merge join algorithm when the conditions
    for using an index or hash join algorithm have been eliminated from consideration.


    # Index


    An index join algorithm might be selected by the SQL optimizer when indexes created
    on each of the columns participating in the join relationship will improve performance.
    This algorithm operates by looking up each row of the smaller table by accessing
    the index of the larger table. The SQL optimizer considers using an index join
    algorithm when the larger table has an associated index with all the join keys,
    the tables are related with an equality condition, and/or join conditions use
    the AND operator between multiple expressions.


    # Hash


    A hash join algorithm might be selected by the SQL optimizer when sufficient memory
    is available to the system, and the BUFFERSIZE option is large enough to store
    the smaller of the tables into memory. This algorithm operates by sequentially
    scanning the larger table and performing row-by-row lookup against the smaller
    table. The SQL optimizer considers using a hash join algorithm when an index join
    algorithm has been eliminated from consideration.


    # Influencing Joins with a Little Magic


    The SQL procedure supports various options to influence the execution of specific
    join algorithms. The following SQL procedure options are available:'
  merge: -1
  img_proc: true
- pgno: 262
  md: "# Table 7.3: SQL Procedure Options\n\n| Option | Description |\n|---|---| \n\
    | MAGIC=101 | Influence the SQL optimizer to select the Nested Loop join algorithm.\
    \ |\n| MAGIC=102 | Influence the SQL optimizer to select the Sort-Merge join algorithm.\
    \ |\n| MAGIC=103 | Influence the SQL optimizer to select the Hash join algorithm.\
    \ |\n\nIn the next example, the PROC SQL option MAGIC=101 is specified to influence\
    \ the optimizer to select a nested loop join algorithm for query execution.\n\n\
    # SQL Code\n\n```\nproc sql magic=101;\n    select c.custname,\n        p1.prodnum,\
    \ p1.prodname, p2.units, p2.unitcost,\n        p2.units * p2.unitcost as Total_Cost\
    \ format=dollar12.2\n    from products  p1,\n        purchases  p2,\n        customers\
    \  c\n    where p1.prodnum = p2.prodnum  AND\n        p2.custnum = c.custnum\n\
    \    order by c.custname, p1.prodname;\nquit;\n```\n\nThe log results that follow\
    \ show that the SQL optimizer (or Planner) chose the nested loop (sequential loop)\
    \ join algorithm when the MAGIC=101 option was specified.\n\n# SAS Log Results\n\
    \n```\nproc sql magic=101;\n    select c.custname,\n        p1.prodnum, p1.prodname,\
    \ p2.units, p2.unitcost,\n        p2.units * p2.unitcost as Total_Cost format=dollar12.2\n\
    \    from products  p1,\n        purchases  p2,\n        customers  c\n    where\
    \ p1.prodnum = p2.prodnum  AND\n        p2.custnum = c.custnum\n    order by c.custname,\
    \ p1.prodname;\nNOTE: PROC SQL planner chooses sequential loop join.\nNOTE: PROC\
    \ SQL planner chooses sequential loop join.\nquit;\nNOTE: PROCEDURE SQL used (Total\
    \ process time):\n      real time          0.08 seconds\n      cpu time      \
    \     0.07 seconds\n```\n\nIn the next example, the PROC SQL option MAGIC=102\
    \ is specified to influence the optimizer to select a sort-merge join algorithm\
    \ for query execution."
