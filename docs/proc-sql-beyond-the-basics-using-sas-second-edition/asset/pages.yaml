- pgno: 381
  md: "will ultimately benefit performance, when it does use an index the result can\
    \ be an improvement in processing speeds.\n\n+   - Comparison operators such as\
    \ EQ (=), LT (<), GT (>), LE (<=), GE (>=), and NOT\n+   - Comparison operators\
    \ with the IN operator\n+   - Comparison operators with the colon modifier (for\
    \ example, NOT =:\"Ab\")\n+   - CONTAINS operator\n+   - IS NULL or IS MISSING\
    \ operator\n+   - Pattern-matching operators such as LIKE and NOT LIKE\n\n# Constructing\
    \ Efficient Logic Conditions\n\nConstructing efficient logic conditions has a\
    \ direct effect on processing costs. Because the SQL optimizer evaluates a series\
    \ of AND expressions from left to right, a chain of AND conditions in a WHERE\
    \ clause should be specified with the most restrictive expression first. Specified\
    \ this way, fewer resources are expended by bypassing rows that do not satisfy\
    \ the first conditional value in the WHERE clause. For example, the SQL query\
    \ below might expend more resources and run slower because the first condition,\
    \ “SOFTWARE”, occurs even when products cost more than $99.00.\n\n# SQL Code (Less\
    \ Efficient)\n\n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        \
    \    WHERE UPCASE(PRODTYPE) = 'SOFTWARE' AND\n                PRODCOST < 100.00;\n\
    QUIT;\n```\n\nFor this data, a more efficient way to produce the same results\
    \ as the previous example, while reducing CPU resources, is to code the least\
    \ likely condition first so that it appears as shown here.\n\n# SQL Code (More\
    \ Efficient)\n\n```\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n        \
    \    WHERE PRODCOST < 100.00 AND\n                UPCASE(PRODTYPE) = 'SOFTWARE';\n\
    QUIT;\n```\n\nAnother popular construct uses a series of OR condition equality\
    \ tests or the IN predicate to select rows that match the multiple conditions.\
    \ Programmers often specify these kinds of lists in order of magnitude or alphabetically\
    \ to make the lists easier to read and/or maintain. A better and more efficient\
    \ way is to construct a list of constants in the order of the most frequently\
    \ occurring value to the least frequently occurring value."
  merge: -1
  img_proc: true
