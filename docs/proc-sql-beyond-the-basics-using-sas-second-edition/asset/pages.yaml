    \ | manuname | Char | 25 | Manufacturer Name |\n| 3 | manucity | Char | 15 | Manufacturer\
    \ City |\n| 4 | manustat | Char | 2 | Manufacturer State |\n\n# Changing a Column’s\
    \ Format\n\nYou can permanently change a column’s format with the MODIFY clause\
    \ of the ALTER TABLE statement—and not just for the duration of the step. Suppose\
    \ that you want to increase the size of the DOLLARw.d format from DOLLAR9.2 to\
    \ DOLLAR12.2 to allow larger product cost (PRODCOST) values in the PRODUCTS table\
    \ to print properly."
