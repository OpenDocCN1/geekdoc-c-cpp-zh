    # SQL Keywords


    SQL provides three keywords: AS, DISTINCT, and UNIQUE to perform specific operations
    on the results. Each will be presented in order as follows.


    # Creating Column Aliases


    In situations where data is computed using system functions, statistical functions,
    or arithmetic operations, a column name or header can be left blank. To prevent
    this from occurring, users may specify the AS keyword to provide a name to the
    column or heading itself along with formatting directions. The next example illustrates
    using the AS keyword to prevent the name for the'
