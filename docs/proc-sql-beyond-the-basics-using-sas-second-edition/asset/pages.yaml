    \   cpu time            0.01 seconds\n```\n\n# Views and SAS Procedures\n\nIn\
    \ most cases but not all, views can be used just as input SAS data sets to the\
    \ universe of available SAS procedures. In the first example, the INVENTORY_VIEW\
    \ view is used as input to the MEANS procedure to produce simple univariate descriptive\
    \ statistics for numeric variables. Accessing the INVENTORY_VIEW view is different\
    \ from accessing the INVENTORY table because the view’s internal compiled executable\
    \ statements are processed providing current data from the underlying table to\
    \ the view itself. The view statements and the statements and options from the\
    \ MEANS procedure determine what information is produced.\n\nThe next example\
    \ uses the INVENTORY_VIEW view as input to the MEANS procedure to produce simple\
    \ univariate descriptive statistics for numeric variables. Accessing the INVENTORY_VIEW\
    \ view is different from accessing the INVENTORY table because the view derives\
    \ and provides current data from the underlying table to the view itself. The\
    \ view statements and the statements and options from the MEANS procedure determine\
    \ what information is produced.\n\n# SAS Code\n\n```\nPROC MEANS DATA=INVENTORY_VIEW;\n\
    \    TITLE1 'Inventory Statistical Report';\n    TITLE2 'Demonstration of a View\
    \ used in PROC MEANS';\nRUN;\n```"
