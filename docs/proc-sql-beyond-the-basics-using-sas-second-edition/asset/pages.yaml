- pgno: 15
  md: '# About This Book


    # Purpose


    *PROC SQL: Beyond the Basics Using SAS, Second Edition*, offers a step-by-step,
    example-driven guide that helps readers master the language of PROC SQL. Packed
    with analysis and examples illustrating an assortment of PROC SQL options, statements,
    and clauses, this book can be approached in a number of ways. Users can read it
    cover-to-cover or selectively by chapter; they can use the extensive index to
    find content of interest or refer to the helpful summaries that follow each chapter
    to look for help on a specific topic.


    # Is This Book for You?


    The intended audience for this book includes SAS users, programmers, business
    analysts, application and software developers, database analysts and administrators,
    help desk support staff, statisticians, IT support staff, and other professionals
    who want or need application-oriented information to extend their knowledge of
    PROC SQL beyond the basics. This book offers readers under-the-hood, behind-the-scenes
    knowledge on how PROC SQL works and is the perfect tool for students pursuing
    an undergraduate or graduate information science, computer science, or cognitive
    science degree.


    # What’s New in This Edition


    *PROC SQL: Beyond the Basics Using SAS, Second Edition*, explores new and powerful
    features in SAS 9.3 and includes such topics as adding data to a table with a
    SET clause; bulk loading data from MS-Excel; distinguishing between DATA step
    merges and PROC SQL joins; rules for designing indexes; cardinality and index
    selectivity; and demystifying join algorithms. It also features an expanded discussion
    of CASE expressions and new sections on complex query applications and grouping
    and performance. By delving into the workings of PROC SQL with greater analysis
    and discussion, *PROC SQL: Beyond the Basic Using SAS, Second Edition*, examines
    a broad range of topics by providing greater detail about the wonders of this
    powerful database language.'
  merge: -1
  img_proc: true
