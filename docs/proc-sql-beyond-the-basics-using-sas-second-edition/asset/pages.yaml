- pgno: 226
  md: "# SQL Code\n\n```\nPROC SQL;\n    DELETE FROM CUSTOMERS2\n        WHERE UPCASE(CUSTNAME)\
    \ = \"LAUGHLER\";\nQUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    DELETE\
    \ FROM CUSTOMERS2\n        WHERE UPCASE(CUSTNAME) = \"LAUGHLER\";\nNOTE: 1 row\
    \ was deleted from WORK.CUSTOMERS2.\nQUIT;\nNOTE: PROCEDURE SQL used:\nreal time\
    \                      0.37 seconds\n```\n\n# Deleting More Than One Row in a\
    \ Table\n\nFrequently, a row deletion affects more than a single row in a table.\
    \ In these cases, a WHERE clause references a value that occurs multiple times.\
    \ The following example illustrates the removal of a single customer in the PRODUCTS\
    \ table by specifying the product type (PRODTYPE) in the WHERE clause.\n\n# SQL\
    \ Code\n\n```\nPROC SQL;\n    DELETE FROM PRODUCTS\n        WHERE UPCASE(PRODTYPE)\
    \ = `PHONE`;\nQUIT;\n```\n\n# SAS Log Results\n\n```\nSAS Log Results\n    PROC\
    \ SQL;\n        DELETE FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) = `PHONE`;\n\
    NOTE: 3 rows were deleted from WORK.PRODUCTS.\n    QUIT;\nNOTE: PROCEDURE SQL\
    \ used:\nreal time                      0.05 seconds\n```\n\n# Deleting All Rows\
    \ in a Table\n\nSQL provides a simple way to delete all rows in a table. The following\
    \ example shows that all rows in the CUSTOMERS table can be removed when the WHERE\
    \ clause is omitted. Use care when using this form of the DELETE statement because\
    \ every row in the table is automatically deleted."
