- pgno: 105
  md: "# Dictionary.INDEXES\n\nIt is sometimes useful to display the names of existing\
    \ simple and composite indexes, or their SAS tables, that reference a specific\
    \ column name. The INDEXES dictionary table provides important information to\
    \ help identify indexes that improve a query’s performance. For example, to display\
    \ indexes that reference the CUSTNUM column name in any of the example tables,\
    \ the following code is specified.\n\nNote: See Chapter 10, “Tuning for Performance\
    \ and Efficiency,” for performance tuning techniques as they relate to indexes.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n        FROM DICTIONARY.INDEXES\n\
    \            WHERE UPCASE(NAME)=\"CUSTNUM\"      /* Column Name */\n         \
