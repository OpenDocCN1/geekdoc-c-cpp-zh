- pgno: 154
  md: "the HAVING clause restricts what is returned by the SELECT clause to just the\
    \ manufacturers residing in the state of California.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n    SELECT PRODNAME,\n           PRODTYPE,\n           MANUNAME\n    FROM\
    \ PRODUCTS P,\n         MANUFACTURERS M\n    WHERE P.MANUNUM = M.MANUNUM AND\n\
    \          CASE PRODTYPE\n            WHEN 'Software' THEN 1\n            ELSE\
    \ 0\n          END;\nQUIT;\n```\n\n# Results\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_154_0.png)\n\
    \n# Preventing Division by Zero with a Simple CASE Expression\n\nDivision by zero\
    \ errors can cause many problems for a query, including severe performance degradation.\
    \ In the next example, a simple CASE expression in a SELECT clause is specified\
    \ to prevent division by zero errors. Using the INVENTORY table, a CASE expression\
    \ tells SAS to ignore performing any computations for products containing an INVENQTY\
    \ value of zero (by assigning a Boolean value of false). Otherwise, the equation\
    \ INVENCST / INVENQTY is computed and products costing more than $1,000.00 are\
    \ selected by the WHERE clause. A column heading called, Average_Cost is assigned\
    \ to the new column with the AS keyword.\n\n# SQL Code\n\n```\nPROC SQL;\n   \
    \ SELECT PRODNUM,\n           INVENQTY,\n           INVENCST,\n           CASE\
    \ INVENQTY\n```"
