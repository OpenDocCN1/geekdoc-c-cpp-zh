  md: "second table. As illustrated in Figure 7.4, the results of specifying the EXCEPT\
    \ operator represent the shaded area (A).\n\n# Figure 7.4: Compare Two Tables\
    \ to Determine Additions and Changes\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_301_0.png)\n\
    \nWhen working with two tables that consist of similar information, you can use\
    \ the EXCEPT operator to determine new and modified rows. The EXCEPT operator\
    \ is used to identify rows in the first table (or query), but is not used to identify\
    \ rows in the second table (or query). It also uniquely identifies rows that have\
    \ changed from the first table to the second table. Columns are compared in the\
    \ order that they appear in the SELECT statement.\n\nIf the wildcard character\
    \ “*” is specified in the SELECT statement, it is assumed that the tables are\
    \ structurally identical to one another. Let’s look at an example.\n\nSuppose\
    \ that you have master and backup tables of the CUSTOMERS file, and you want to\
    \ compare them to identify the new and changed rows. The EXCEPT operator as illustrated\
    \ in the next example returns all new or changed rows from the CUSTOMERS table\
    \ that do not appear in the CUSTOMERS_BACKUP table. As illustrated in the results,\
    \ three new customer rows are added to the CUSTOMERS table that had not previously\
    \ existed in the CUSTOMERS_BACKUP table.\n\n# SQL Code\n\n```\nPROC SQL;\n   \
    \ SELECT *\n        FROM CUSTOMERS_BACKUP\n    EXCEPT\n    SELECT *\n        FROM\
    \ CUSTOMERS;\nQUIT;\n```\n\n1 The EXCEPT operator compares rows in both tables\
    \ to identify the rows existing in the first table but not the second table."
