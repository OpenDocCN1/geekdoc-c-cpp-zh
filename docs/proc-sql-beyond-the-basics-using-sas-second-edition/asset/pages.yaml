  md: "# Subqueries\n\nNow that you have seen how two or more tables can be combined\
    \ in a join query, turn your attention to another type of complex query known\
    \ as a subquery. A subquery is a query expression that is nested within another\
    \ query expression. Its purpose is to have the inner query produce a single value\
    \ or multiple values that can then be passed into the outer query for processing.\
    \ You achieve this by embedding a SELECT statement inside a WHERE clause of an\
    \ outer query’s SELECT statement, INSERT statement, DELETE statement, or HAVING\
    \ clause.\n\nNote: You should avoid nesting more than two subqueries deep because\
    \ of the conceptual and processing complexities this introduces.\n\nThe typical\
    \ subquery consists of a (inner) query combined inside the predicate of another\
    \ (outer or main) query. When processed, the inner query passes a Boolean value\
    \ to the outer query consisting of either True if it returns a minimum of one\
    \ row or False if no rows are returned by the subquery. The results of the inner\
    \ query are stored in a temporary results table and used as input to the main\
    \ query. Our exploration of subqueries will involve using them with comparison\
    \ operators, the IN predicate, and the ANY and ALL keywords, and will conclude\
    \ with a look at a special type of subquery called a correlated subquery.\n\n\
    # Alternate Approaches to Subqueries\n\nA subquery is a very useful construct,\
    \ especially when information from multiple tables needs to be interrelated. Unfortunately,\
    \ a subquery is not always easy to construct and might be even more difficult\
    \ to understand. So before constructing every table relation with a subquery,\
    \ consider your options carefully.\n\nWhen all of the information is available\
    \ in a single table, a simple query is probably all that needs to be constructed.\
    \ Suppose that you want to produce a report that consists of the invoice information\
    \ for Global Comm Corp. Let’s further assume that you know the specific manufacturer\
    \ number for Global Comm Corp. Knowing this means that you don’t have to go into\
    \ the MANUFACTURERS table to find it. In the next example, a simple query is constructed\
    \ to retrieve all of the invoice information from the INVOICE table.\n\n# Simple\
    \ Query\n\n```\nPROC SQL;\n    SELECT *\n        FROM INVOICE\n        WHERE manunum\
    \ = 210;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Results\n\n| Invoice Number | Manufacturer Number | Customer Number | Invoice\
    \ Quantity - Units Sold | Invoice Unit Price | Product Number |\n|---|---|---|---|---|---|\n\
    | 1003 | 210 | 101 | 7 | $245.00 | 2101 |\n\nBut, what if all the information\
    \ is not in a single table? And what if the manufacturer number for Global Comm\
    \ Corp is not known? As shown previously, a join can be constructed just as easily\
    \ as a subquery. Some users prefer joins to subqueries because joins can be easier\
    \ to understand and maintain. In fact, a join frequently performs better than\
    \ a subquery. In the next example, the manufacturer number for Global Comm Corp\
    \ is not known. Consequently, a simple inner join is needed to retrieve all related\
    \ rows from the MANUFACTURERS and INVOICE tables for Global Comm Corp.\n\n# Simple\
    \ Join\n\n```\nPROC SQL;\n    SELECT M.manunum, M.manuname, I.invnum,\n      \
    \  I.invqty, I.invprice\n    FROM MANUFACTURERS M, INVOICE I\n    WHERE M.manunum\
    \ = I.manunum AND\n        M.manuname = 'Global Comm Corp';\nQUIT;\n```\n\n# Results\n\
    \n| Manufacturer Number | Manufacturer Name | Invoice Number | Invoice Quantity\
    \ - Units Sold | Invoice Unit Price |\n|---|---|---|---|---|\n| 210 | Global Comm\
    \ Corp | 1003 | 7 | $245.00 |\n\n# Passing a Single Value with a Subquery\n\n\
    Let’s see how a subquery could be constructed to provide the same results as with\
    \ the join. As before, suppose that you want to pull all of the invoices for the\
    \ manufacturer Global Comm Corp but know only the manufacturer name (or at least\
    \ part of the name), but not the manufacturer number (MANUNUM). The following\
    \ subquery uses an = (equal sign) in its outer query WHERE clause to accomplish\
    \ this.\n\nBecause the manufacturer number is not known, a subquery is constructed\
    \ to first search for the manufacturer number in the MANUFACTURERS table. Actually,\
    \ the subquery approach is more versatile than the previous query approach, because\
    \ it does not require a unique manufacturer number, which is often more difficult\
    \ to remember than a manufacturer names. It also enables quick searches even if\
    \ the manufacturer number changes for a given manufacturer."
