    \nThe ability to capture macro variable names and their values is available with\
    \ the MACROS dictionary table. The MACROS dictionary table provides information\
    \ for global and automatic macro variables, but not for local macro variables.\
    \ For example, to obtain columns specific to macros such as global macros SQLOBS,\
    \ SQLLOOPS, SQLXOBS, or SQLRC, the following code is specified.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    SELECT *\n        FROM DICTIONARY.MACROS\n            WHERE\
    \ UPCASE(SCOPE)=\"GLOBAL\";\nQUIT;\n```"
