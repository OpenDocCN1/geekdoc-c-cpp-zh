- pgno: 337
  md: "# Table Results\n\n|  | Product Number | Product Name | Manufacturer Number\
    \ | Product Type | Product Cost |\n|---|---|---|---|---|---|\n| 1 | 1110 Dream\
    \ Machine | 111 Workstation | $3,200.00 |\n| 2 | 1200 Business Machine | 120 Workstation\
    \ | $3,300.00 |\n| 3 | 1700 Travel Laptop | 170 Laptop | $3,400.00 |\n| 4 | 2101\
    \ Analog Cell Phone | 210 Phone | $35.00 |\n| 5 | 2102 Digital Cell Phone | 210\
    \ Phone | $175.00 |\n| 6 | 2200 Office Phone | 220 Phone | $130.00 |\n| 7 | 5001\
    \ Spreadsheet Software | 500 Software | $299.00 |\n| 8 | 5002 Database Software\
    \ | 500 Software | $399.00 |\n| 9 | 5003 Wordprocessor Software | 500 Software\
    \ | $299.00 |\n| 10 | 5004 Graphics Software | 500 Software | $299.00 |\n| 11\
    \ | 6002 Security Software | . Software | $375.00 |\n\nNow, let’s see what happens\
    \ when a row of data is added through a view that does not meet the condition(s)\
    \ in the WHERE clause in the view. Suppose that you want to add a row of data\
    \ that contains the value 1701 for product number, “Travel Laptop SE” in product\
    \ name, “Laptop” in product type, and $4200.00 in product cost in the SOFTWARE_PRODUCTS_VIEW\
    \ view.\n\n# SQL Code\n\n```\nPROC SQL;\n    INSERT INTO SOFTWARE_PRODUCTS_VIEW\n\
    \    VALUES (1701, 'Travel Laptop SE', 'Laptop', 4200.00);\nQUIT;\n```\n\nBecause\
    \ the new row’s value for product type is “Laptop”, this value violates the WHERE\
    \ clause condition when the view SOFTWARE_PRODUCTS_VIEW was created. As a result,\
    \ the new row of data is rejected and is not added to the table PRODUCTS. The\
    \ SQL procedure also prevents the new row from appearing in the view because the\
    \ base table controls what the view contains.\n\nThe updatable view does exactly\
    \ what it is designed to do—that is, it validate each new row of data as each\
    \ row is added to the base table. Whenever the WHERE clause condition is violated,\
    \ the view automatically rejects the row as invalid and restores the table to\
    \ its pre-updated state by rejecting the row in error and deleting all successful\
    \ inserts before the error occurred. In this example, the following error message\
    \ was issued to the SAS log to confirm that the view was restored to its original\
    \ state before the update took place."
  merge: -1
  img_proc: true
