    # Accessing a Dictionary Table’s Contents


    The content of a dictionary table is accessed with the SQL procedure’s SELECT
    statement FROM clause. Results are displayed as rows and columns in a table, and
    can be used in handling common data processing tasks including obtaining a list
    of allocated libraries, catalogs and data sets, as well as communicating SAS environment
    settings to custom software applications. Users should take the time to explore
    the capabilities of these read-only dictionary tables and become familiar with
    the type of information they provide.'
