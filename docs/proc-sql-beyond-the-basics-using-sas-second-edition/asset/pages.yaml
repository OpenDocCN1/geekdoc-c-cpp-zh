  md: "# Results\n\n| Product Name | Product Cost | Manufacturer Name | Invoice Quantity\
    \ - Units Sold |\n|---|---|---|---|\n| Spreadsheet Software | $299.00 | KPL Enterprises\
    \ | 5 |\n| Database Software | $399.00 | KPL Enterprises | 2 |\n\n# RESET Statement\n\
    \nThe RESET statement is used to add, drop, or change one or more PROC SQL options\
    \ without the need to restart the procedure. Once an option is specified, it stays\
    \ in effect until it is changed or reset. Being able to change options with the\
    \ RESET statement is a handy debugging technique. The following example illustrates\
    \ turning off the FEEDBACK option by resetting it to NOFEEDBACK. By turning off\
    \ this option, you prevent the expansion of a SELECT * (wildcard) statement into\
    \ a list of columns that it represents.\n\n# SQL Code\n\n```\nPROC SQL FEEDBACK;\n\
    \    SELECT *\n        FROM PRODUCTS;\nRESET NOFEEDBACK;\n    SELECT *\n     \
    \   FROM PRODUCTS\n            WHERE PRODTYPE='Software';\nQUIT;\n```\n\n# SAS\
    \ Log Results\n\n```\nSELECT *\n    FROM PRODUCTS;\nNOTE: Statement transforms\
    \ to:\nselect PRODUCTS.prodnum, PRODUCTS.prodname, PRODUCTS.manunum,\n    PRODUCTS.prodtype,\
    \ PRODUCTS.prodcost\n    from PRODUCTS;\nRESET NOFEEDBACK;\nSELECT *\n    FROM\
    \ PRODUCTS\n        WHERE PRODTYPE='Software';\n```\n\nMultiple options can be\
    \ reset in a single RESET statement. Options in the PROC SQL and RESET statements\
    \ can be specified in any order. The next example shows how, in a single RESET\
    \ statement, double-spaced output is changed to single-spaced output with the\
    \ NODOUBLE option, row numbers are suppressed with the NONUMBER option, and output\
    \ rows are changed to the maximum number of rows with the OUTOBS= option."
  merge: -1
  img_proc: true
