    \ SQL;\n    CREATE INDEX\n        MANUNUM_PRODTYPE ON PRODUCTS (MANUNUM, PRODTYPE);\n\
    NOTE: Composite index MANUNUM_PRODTYPE has been defined.\nQUIT;\nNOTE: PROCEDURE\
    \ SQL used:\nreal time          0.00 seconds\n```\n\n① The composite index is\
    \ assigned a name of MANUNUM_PRODTYPE, which is used to represent the MANUNUM\
    \ and PRODTYPE column names.\n\n② The composite index is defined on the PRODUCTS\
    \ table.\n\n③ The MANUNUM and PRODTYPE columns in the PRODUCTS table are designated\
    \ as the columns to be used by the index.\n\n# Preventing Duplicate Values in\
    \ an Index\n\nThe UNIQUE keyword prevents the entry of a duplicate value in an\
    \ index. You should use this keyword with care because there might be times when\
    \ more than one occurrence of a data value in a table is necessary. When multiple\
    \ occurrences of the same value appear in a table, the UNIQUE keyword is rejected\
    \ and the index is not created for that particular column.\n\n# Modifying Columns\
    \ Containing Indexes\n\nAltering the attributes of a column that contains an associated\
    \ index (simple or composite) does NOT prohibit the values in the altered column\
    \ from using the index. But, if a column that contains an index is dropped, then\
    \ the index is also dropped. Accordingly, when a column is dropped, any data in\
    \ that index is also lost.\n\n# Deleting (Dropping) Indexes\n\nWhen one or more\
    \ indexes are no longer needed, the DROP INDEX statement can be used to remove\
    \ them. Suppose that you no longer need the composite index MANUNUM_PRODTYPE (which\
    \ was created earlier) because processing requirements have changed. The next\
    \ example illustrates a single composite index being deleted from the SAS library.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    DROP INDEX MANUNUM_PRODTYPE\n        FROM\
    \ PRODUCTS;\nQUIT;\n```"
