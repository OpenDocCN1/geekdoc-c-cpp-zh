    # Concatenating Rows from Two Queries


    The OUTER UNION operator concatenates the results of two queries. As with a DATA
    step or PROC APPEND concatenation, the results consist of rows that are combined
    vertically. Put another way, the outer union of two queries (A and B) represents
    all rows in both A and B with no overlap. As illustrated in Figure 7.3, the outer
    union represents the entire shaded area (A and B).


