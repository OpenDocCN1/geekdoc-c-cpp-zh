- pgno: 101
  md: "# Dictionary.CATALOGS\n\nObtaining detailed information about catalogs and\
    \ their members is quick and easy with the CATALOGS dictionary table. You will\
    \ be able to capture an ordered list of catalog information by member name including\
    \ object name and type, description, date created and last modified, and object\
    \ alias from any SAS library. For example, the following code produces a listing\
    \ of the catalog objects in the SASUSER library.\n\nNote: Because this dictionary\
    \ table produces a considerable amount of information, users are advised to specify\
    \ a WHERE clause when using.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n \
    \     FROM DICTIONARY.CATALOGS\n      WHERE LIBNAME=\"SASUSER\";\nQUIT;\n```\n\
    \n# Results\n\n| Library Name | Member Name | Member Type | Object Name | Object\
    \ Type | Object Description | Date Created | Date Modified | Object Alias | Library\
    \ Concatenation Level |\n|---|---|---|---|---|---|---|---|---|---|\n| SASUSER\
    \ | PROFBAK | CATALOG | DMKEYS | KEYS | Function Key Definitions | 07NOV12:14:55:49\
    \ | 07NOV12:14:55:49 |  | 0 |\n| SASUSER | PROFBAK | CATALOG | VT_PRINTLIST |\
    \ SLIST | vt_printlist SLIST | 22JUL13:03:24:55 | 22JUL13:03:24:55 |  | 0 |\n\
    | SASUSER | PROFBAK | CATALOG | MRUWSAVE | WSAVE |  | 22JUL13:03:53:30 | 22JUL13:03:53:30\
    \ |  | 0 |\n| SASUSER | PROFBAK | CATALOG | V9TUTDLG | WSAVE |  | 22JUL13:02:23:26\
    \ | 22JUL13:02:23:26 |  | 0 |\n| SASUSER | PROFBAK | CATALOG | VIEWWSAVE | WSAVE\
    \ | Preferences View save information. | 10OCT11:08:05:24 | 10OCT11:08:05:24 |\
    \  | 0 |\n| SASUSER | PROFILE | CATALOG | DMKEYS | KEYS | Function Key Definitions\
    \ | 07NOV12:14:55:49 | 07NOV12:14:55:49 |  | 0 |\n| SASUSER | PROFILE | CATALOG\
    \ | VT_PRINTLIST | SLIST | vt_printlist SLIST | 24JUL13:04:21:12 | 24JUL13:04:21:12\
    \ |  | 0 |\n| SASUSER | PROFILE | CATALOG | MRUWSAVE | WSAVE |  | 22JUL13:03:53:30\
    \ | 22JUL13:03:53:30 |  | 0 |\n| SASUSER | PROFILE | CATALOG | V9TUTDLG | WSAVE\
    \ |  | 24JUL13:01:27:42 | 24JUL13:01:27:42 |  | 0 |\n| SASUSER | PROFILE | CATALOG\
    \ | VIEWWSAVE | WSAVE | Preferences View save information. | 10OCT11:08:05:24\
    \ | 10OCT11:08:05:24 |  | 0 |\n| SASUSER | PROFILE2 | CATALOG | WNTP RINT | WINPRINT\
    \ |  | 24JUL13:01:27:23 | 24JUL13:01:27:23 |  | 0 |\n\n# Dictionary.COLUMNS\n\n\
    Retrieving information about the columns in one or more data sets is easy with\
    \ the COLUMNS dictionary table. Similar to the results of the CONTENTS procedure,\
    \ you will be able to capture column-level information including column name,\
    \ type, length, position, label, format, informat, and indexes, as well as produce\
    \ cross-reference listings containing the location of columns in a SAS library.\
    \ For example, the following code requests a cross-reference listing of the tables\
    \ containing the CUSTNUM column in the WORK library.\n\nNote: Care should be used\
    \ when specifying multiple functions on the WHERE clause because the SQL Optimizer\
    \ is unable to optimize the query resulting in all allocated SAS session librefs\
    \ being searched. This can cause the query to run much longer than expected."
