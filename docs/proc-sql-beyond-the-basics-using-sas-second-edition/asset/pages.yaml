    # Third Normal Form (3NF)


    Referring to the two tables constructed according to the rules of 2NF, you may
    have noticed that the PURCHASES table contains a column called MANUCITY. The MANUCITY
    column stores the city where the product manufacturer is headquartered. Keeping
    this column in the PURCHASES table violates the third normal form (3NF) because
    MANUCITY does not provide factual information about the primary key column (CUSTNUM)
    in the PURCHASES table. Consequently, tables are considered to be in third normal
    form (3NF) when each column is dependent on the key, the whole key, and nothing
    but the key. The tables in 3NF are constructed so the MANUCITY column would be
    in a table of its own as follows.'
