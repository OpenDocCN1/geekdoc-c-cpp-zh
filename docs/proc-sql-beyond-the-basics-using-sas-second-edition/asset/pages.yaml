- pgno: 114
  md: "# Introduction\n\nProgrammers want and expect to be able to format output in\
    \ a variety of ways. The SQL procedure has forged innovative ways to enhance the\
    \ appearance of output including double-spacing rows of output, concatenating\
    \ two or more columns, inserting text and constants between selected columns,\
    \ displaying column headers for derived fields, and much more. As a value-added\
    \ feature, the SQL procedure (not part of ANSI-standard SQL—see the “Introduction”\
    \ section of this book) can be integrated with the Output Delivery System to enhance\
    \ and format output in ways not otherwise available. As you review the many examples\
    \ in this chapter, the following points should be kept in mind:\n\n# Formatting\
    \ Output\n\nAs a language, PROC SQL consists of a standard set of statements and\
    \ options to create, retrieve, alter, transform, and transfer data regardless\
    \ of the operating system or where the data is located. These features provide\
    \ tremendous power as well as control when integrating information from a variety\
    \ of sources in a number of ways. Because emphasis is placed on PROC SQL’s data\
    \ manipulation capabilities and not on its format and output capabilities, many\
    \ programmers are unfamiliar with the SQL procedure’s output-producing side. Consequently,\
    \ programmers resort to using report writers or special outputting tools to create\
    \ the best looking output. To illustrate the virtues of PROC SQL in SAS, this\
    \ chapter presents numerous examples of how output can be formatted and produced.\n\
    \n# Writing a Blank Line between Each Row\n\nThe ability to display a blank line\
    \ between each row of output is available as a procedure option in PROC SQL. As\
    \ with the PRINT procedure, specifying DOUBLE in the SQL procedure inserts a blank\
    \ line between each physical row of output (NODOUBLE is the default). Setting\
    \ this option is especially useful when one or more flowed lines spans or wraps\
    \ in the output because it provides visual separation between each row of data.\
    \ This example illustrates using the DOUBLE option to double-space output.\n\n\
    # SQL Code\n\n```\nPROC SQL DOUBLE;\n    SELECT *\n        FROM INVOICE;\nQUIT;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Results\n\nThe SAS System\n| Invoice Number | Manufacturer Number | Customer\
    \ Number | Invoice Quantity - Units Sold | Invoice Unit Price | Product Number\
    \ |\n| 1001 | 500 | 201 | 5 | $1,495.00 | 5001 |\n| 1002 | 600 | 1301 | 2 | $1,598.00\
    \ | 6001 |\n| 1003 | 210 | 101 | 7 | $245.00 | 2101 |\n| 1004 | 111 | 501 | 3\
    \ | $9,600.00 | 1110 |\n| 1005 | 500 | 801 | 2 | $798.00 | 5002 |\n| 1006 | 500\
    \ | 901 | 4 | $396.00 | 6000 |\n| 1007 | 500 | 401 | 7 | $23,100.00 | 1200 |\n\
    \nTo revert back to single-spaced output, the RESET statement can be specified\
    \ as long as the QUIT statement has not been issued to turn off the SQL procedure.\
    \ When PROC SQL is active, the RESET statement can be specified with or without\
    \ options to reestablish each option’s original settings. All SQL options are\
    \ reset to their original settings when RESET is specified without any options.\
    \ When the RESET statement is specified with one or more options, only those options\
    \ are reset. This example illustrates using the NODOUBLE option to turn off double-spaced\
    \ output and reset printing to the default single-spaced output.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    RESET NODOUBLE;\nQUIT;\n```\n\n# Displaying Row Numbers\n\
    \nYou can specify an SQL procedure option called NUMBER to display row numbers\
    \ on output under the column heading Row. As with the Obs column produced by the\
    \ PRINT procedure, the NUMBER option displays row numbers on output. The next\
    \ example shows the NUMBER option being specified with the SQL procedure to display\
    \ row numbers on output.\n\n# SQL Code\n\n```\nPROC SQL NUMBER;\n    SELECT PRODNUM,\n\
    \           UNITS,\n           UNITCOST\n    FROM PURCHASES;\nQUIT;\n```"
  merge: -1
  img_proc: true
