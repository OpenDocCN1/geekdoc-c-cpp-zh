    # Processing First, Last, and Between Rows for BY-and Groups


    Occasionally, SAS users might find that the SQL procedure falls short in its ability
    to offer an “out of the box” solution to a SAS programming technique. As a result,
    and often out of frustration, users abandon their search for a possible SQL solution
    turn instead to a familiar DATA step technique or to one of the many procedures
    (which often is outside the SQL procedure).


    As a case in point, the ability to perform BY-group processing using a DATA step
    BY statement for identifying FIRST, LAST, and BETWEEN observations is a popular
    technique with SAS users. Unfortunately, an equivalent process using the SQL procedure
    either doesn’t exist, or isn’t easy to find. After years of researching and looking
    unsuccessfully for an SQL technique that would'
  merge: -1
  img_proc: true
- pgno: 308
  md: "emulate this DATA step processing stalwart, I decided to develop a solution\
    \ of my own. The following SQL code emulates the behavior of the FIRST, LAST,\
    \ and BETWEEN processing.\n\n# SQL Code\n\n```\n/*************************************************************************/\n\
    /** PROGRAM NAME: FIRST-BETWEEN-LAST-ROWS.SAS                           **/\n\
    /** PURPOSE..... : Derive the first (min) row, last (max) row           **/\n\
    /**               and between rows for each by-group using              **/\n\
    /**               subqueries.                                            **/\n\
    /** AUTHOR...... : Kirk Paul Lafler                                      **/\n\
    /** DATE WRITTEN: June 4, 2012                                           **/\n\
    /*************************************************************************/\n\
    /*************************************************************************/\n\
    /** ROUTINE..... : FIRST-BY-GROUP-ROWS                                  **/\n\
    /** PURPOSE..... : Derive the first (min) row within each               **/\n\
    /**               by-group using a subquery.                            **/\n\
    /*************************************************************************/\n\
    proc sql;\n    create table first_bygroup_rows as\n        select custnum,\n \
    \              prodnum,\n               units,\n               unitcost,\n   \
    \            'FirstRow' as ByGroup\n        from purchases P1\n        where prodnum\
    \ =\n              (select min(prodnum)\n               from purchases P2\n  \
    \             where P1.custnum = P2.custnum)\n    order by custnum, prodnum;\n\
    /*************************************************************************/\n\
    /** ROUTINE..... : LAST-BY-GROUP-ROWS                                   **/\n\
    /** PURPOSE..... : Derive the last (max) row within each                **/\n\
    /**               by-group using a subquery.                            **/\n\
    /*************************************************************************/\n\
    \    create table last_bygroup_rows as\n        select custnum,\n            \
    \   prodnum,\n               units,\n               unitcost,\n              \
    \ 'LastRow' as ByGroup\n        from purchases P1\n        where prodnum =\n \
    \             (select max(prodnum)\n               from purchases P2\n       \
    \        where P1.custnum = P2.custnum)\n    order by custnum, prodnum;\n/*************************************************************************/\n\
    /** ROUTINE..... : BETWEEN-BY-GROUP-ROWS                                **/\n\
    /** PURPOSE..... : Derive all rows between the first (min) row,        **/\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: "```\n/**\n            and the last (max) row within each by-group  **/\n/**\n\
    \            using a subquery.                    **/\n/****************************************************************/\n\
    \    create table between_bygroup_rows as\n        select custnum,\n         \
    \       prodnum,\n                units,\n                unitcost,\n        \
    \        min(prodnum) as Min_Prodnum,\n                max(prodnum) as Max_Prodnum,\n\
    \                'BetweenRow' as ByGroup\n        from purchases\n           \
    \ group by custnum\n            having CALCULATED min_Prodnum NOT =\n        \
    \            CALCULATED max_Prodnum AND\n                    CALCULATED min_Prodnum\
    \ NOT =\n                        prodnum            AND\n                    CALCULATED\
    \ max_Prodnum NOT = prodnum\n            order by custnum, prodnum;\n/****************************************************************/\n\
    /** ROUTINE.....: CONCATENATE-FIRST-BETWEEN-LAST                **/\n/** PURPOSE.....:\
    \ Concatenate the results from the first (min)  **/\n/**\n                row,\
    \ between rows, and last (max) row within  **/\n/**\n                each by-group\
    \ using UNION ALL set operators. **/\n/****************************************************************/\n\
    \    create table first_between_last_rows as\n        select custnum,\n      \
    \          prodnum,\n                units,\n                unitcost,\n     \
    \           bygroup\n        from first_bygroup_rows\n    UNION ALL\n        select\
    \ custnum,\n                prodnum,\n                units,\n               \
    \ unitcost,\n                bygroup\n        from between_bygroup_rows\n    UNION\
    \ ALL\n        select custnum,\n                prodnum,\n                units,\n\
    \                unitcost,\n                bygroup\n        from last_bygroup_rows;\n\
    /****************************************************************/\n/** ROUTINE.....:\
    \ PRINT-FIRST-BETWEEN-LAST                      **/\n/** PURPOSE.....: Print the\
    \ results from the first (min) row,   **/\n/**\n                between rows,\
    \ and last (max) row within each  **/\n/**\n                by-group using a select\
    \ query.                 **/\n```"
