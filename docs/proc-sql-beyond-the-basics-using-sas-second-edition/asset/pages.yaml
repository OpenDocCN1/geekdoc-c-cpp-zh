    \ Software | Software |\n| 5002 | Database Software | Software |\n| 5003 | Wordprocessor\
    \ Software | Software |\n| 5004 | Graphics Software | Software |\n\n# Set Operations\n\
    \nNow that you have seen how tables are combined with join queries and subqueries,\
    \ let’s look at another type of complex query. The SQL procedure provides users\
    \ with several table operators: INTERSECT, UNION, OUTER UNION, and EXCEPT, which\
    \ are commonly referred to as set operators. In contrast to joins and subqueries\
    \ where query results are combined horizontally, the purpose of each set operator\
    \ is to combine or concatenate query results vertically. Essentially, set operators\
    \ construct compound queries by combining the result sets of two or more queries.\n\
    \n# Rules for Set Operators\n\n+   1. If a SELECT statement consists of more than\
    \ one set operator, set operators will be applied in the order specified.\n+ \
    \  \n+   2. By default, duplicate rows are eliminated from the results.\n+   \n\
    +   3. To allow duplicates, the ALL option must be specified with a set operator.\n\
    +   \n+   4. Arguments are evaluated from left to right.\n+   \n+   5. Set operators\
    \ can be used in\n+   a. Queries\n+   \n+   b. Subqueries"
