- pgno: 238
  md: "LENGTH= option in the SELECT clause of the CREATE TABLE statement, or use the\
    \ LENGTH statement in a DATA step to assign (or reassign) any numeric column lengths\
    \ to the desired size. You can also improve query results by assigning indexes\
    \ only to those columns that have many unique values or that you use regularly\
    \ in joins.\n\nIn the next example, the numeric column MANUNUM has its length\
    \ changed (or redefined) from 3 bytes to 4 bytes using the LENGTH= option in the\
    \ SELECT clause of the CREATE TABLE statement.\n\nNote: Recursive references in\
    \ the target table can create data integrity problems. For this reason you should\
    \ refrain from specifying the same table name in the CREATE TABLE statement as\
    \ specified in the FROM clause.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE\
    \ MANUFACTURERS_MODIFIED AS\n        SELECT MANUNUM LENGTH=4, MANUNAME, MANUCITY,\
    \ MANUSTAT\n            FROM MANUFACTURERS;\nQUIT;\n```\n\nThe PROC CONTENTS output\
    \ illustrates the changed column length that was assigned to the numeric MANUNUM\
    \ column in the MANUFACTURERS_MODIFIED table."
  merge: -1
  img_proc: true
