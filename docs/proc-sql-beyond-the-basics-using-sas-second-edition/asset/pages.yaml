- pgno: 159
  md: '# Searched CASE Expression


    A searched CASE expression provides SQL users with the capability to perform more
    complex comparisons. Although the number of keystrokes can be more than with a
    simple CASE expression, the searched CASE expression offers the greatest flexibility
    and is the primary form used by SQL programmers. The noticeable absence of a column
    name as part of the CASE expression permits any number of columns to be specified
    from the underlying table(s) in the WHEN-THEN/ELSE logic scenarios.


    The searched CASE expression evaluates one or more WHEN conditions until it encounters
    one that evaluates to “true.” It then assigns the corresponding result expression
    specified following the THEN keyword. If none of the WHEN conditions evaluates
    to “true,” then the result following the specified ELSE keyword is returned. If
    none of the WHEN conditions evaluates to “true” and an ELSE condition is not specified,
    then the searched CASE expression returns a null value. Searched CASE expressions
    possess the following features:


    +   - Allow arithmetic operators (i.e., =, <, <=, >, >=, etc.).

    +   - Use logical operators (i.e., AND, OR, and NOT) for combining any number
    of expressions.

    +   - Evaluate compound expressions in the following default order: NOT, AND,
    or OR, unless parentheses are specified to control the order of evaluation.

    +   - Evaluate the specified WHEN conditions in the order specified.

    +   - Evaluate the input-expression for each WHEN condition.

    +   - Return the result-expression of the first input-expression that evaluates
    to “true.”

    +   - Process the ELSE condition if no input-expressions evaluate to “true.”

    +   - Assign a NULL value when an ELSE condition isn’t specified.


    # Searched CASE Expression in a SELECT Clause


    To illustrate how a searched CASE expression works, consider an example that uses
    a calculated dollar amount from the UNITS and UNITCOST columns to assign a value
    of “Small Purchase” for purchases less than $1,000, “Average Purchase” for purchases
    between $1,000 and $7,500, “Large Purchase” for purchases greater than $7,500,
    and “Unknown Purchase” for all other values in the PURCHASES table. Using the
    calculated amount, Purchase_Amount, from the UNITS and UNITCOST columns, a CASE
    expression is constructed to assign the desired value in each row of data. Finally,
    a column heading of Type_of_Purchase is assigned to the calculated column with
    the AS keyword. Note: The CALCULATED keyword must be specified with any column
    created in a SELECT clause that does not exist in the table referenced in the
    FROM clause.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT\n        PRODNUM\n        UNITS,\n\
    \        UNITCOST,\n        UNITS * UNITCOST\n            AS Purchase_Amount\n\
    \            FORMAT=DOLLAR12.2,\n        CASE\n            WHEN CALCULATED\n \
    \   Purchase_Amount < 1000 THEN 'Small Purchase'\n            WHEN CALCULATED\n\
    \    Purchase_Amount BETWEEN 1000 AND 7500 THEN 'Average Purchase'\n         \
    \   WHEN CALCULATED\n    Purchase_Amount > 7500 THEN 'Large Purchase'\n      \
    \      ELSE 'Unknown Purchase'\n        END AS Type_of_Purchase\n        FROM\
    \ PURCHASES\n            ORDER BY CALCULATED\n    Purchase_Amount DESC;\nQUIT:\n\
    ```\n\n# Results\n\nThe SAS System\n\n| Manufacturer Name | Manufacturer State\
    \ | Region |\n|---|---|---|\n| Cupid Computer | TX | Central |\n| Global Comm\
    \ Corp | CA | West |\n| World Internet Corp | FL | East |\n| Storage Devices Inc\
    \ | CA | West |\n| KPL Enterprises | CA | West |\n| San Diego PC Planet | CA |\
    \ West |"
  merge: -1
  img_proc: true
- pgno: 161
  md: "# Complex Comparisons with Searched CASE Expressions\n\nAs described earlier,\
    \ searched CASE expressions provide SQL users with the capability to perform more\
    \ complex comparisons. Combined with logical and comparison operators, CASE expressions\
    \ along with their WHERE clause counterparts provide the capabilities to construct\
    \ complex logic scenarios. In the next example, a listing of manufacturers and\
    \ their products are displayed using a searched CASE expression to assign a value\
    \ of “East” to manufacturers in Florida, “Central” to manufacturers in Texas,\
    \ “West” to manufacturers in California, and “Unknown” to all other manufacturers\
    \ in the MANUFACTURERS table. Using the manufacturer’s state of residence (MANUSTAT)\
    \ column, a CASE expression is constructed to assign the desired value in each\
    \ row of data. Finally, a column heading of Region is assigned to the new column\
    \ with the AS keyword.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT MANUNAME,\n\
    \        CASE\n            WHEN MANUSTAT IN ('FL','TX','CA') THEN\n          \
    \      CASE\n                    WHEN PRODTYPE IN ('Laptop', 'Workstation') THEN\n\
    \                        \"Computer Hardware Manufacturer\"\n                \
    \    ELSE \"Not a Computer Manufacturer\"\n                END\n            ELSE\
    \ \"Unknown Manufacturer\"\n        END AS ManufacturerType,\n        PRODNAME,\n\
    \        PRODCOST\n    FROM MANUFACTURERS M,\n        PRODUCTS P\n    WHERE M.MANUNUM\
    \ = P.MANUNUM;\nQUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Results\n\n| Manufacturer Name | ManufacturerType | Product Name | Product\
    \ Cost |\n|---|---|---|---|\n| Cupid Computer | Computer Hardware Manufacturer\
    \ | Dream Machine | $3,200.00 |\n| Storage Devices Inc | Computer Hardware Manufacturer\
    \ | Business Machine | $3,300.00 |\n| Global Comm Corp | Not a Computer Manufacturer\
    \ | Analog Cell Phone | $35.00 |\n| Global Comm Corp | Not a Computer Manufacturer\
    \ | Digital Cell Phone | $175.00 |\n| KPL Enterprises | Not a Computer Manufacturer\
    \ | Spreadsheet Software | $299.00 |\n| KPL Enterprises | Not a Computer Manufacturer\
    \ | Database Software | $399.00 |\n| KPL Enterprises | Not a Computer Manufacturer\
    \ | Wordprocessor Software | $299.00 |\n| KPL Enterprises | Not a Computer Manufacturer\
    \ | Graphics Software | $299.00 |\n\n# Creating a Customized List with a Searched\
    \ CASE Expression\n\nSimilar to the simple CASE expression illustrated earlier,\
    \ a customized display can be specified using a searched CASE expression in a\
    \ SELECT clause. The following example illustrates a unique way to create a list\
    \ of products and availability by coding individual Case logic conditions for\
    \ each product in the PRODUCTS table. The resulting output displays a value of\
    \ “1” to indicate that it contributed to the output list, or a value of “0” to\
    \ indicate that it didn’t contribute to the output list.\n\n# SQL Code\n\n```\n\
    OPTIONS LS=120;\nPROC SQL;\n   SELECT PRODNAME,\n          PRODCOST,\n       \
    \   CASE WHEN PRODTYPE='Laptop' AND\n                    PRODCOST < 1000 THEN\
    \ 1\n               ELSE 0\n          END AS InexpensiveLaptop,\n          CASE\
    \ WHEN PRODTYPE='Laptop' AND\n                    PRODCOST BETWEEN 1000 AND 2500\
    \ THEN 1\n               ELSE 0\n          END AS MediumPricedLaptop,\n      \
    \    CASE WHEN PRODTYPE='Laptop' AND\n                    PRODCOST > 2500 THEN\
    \ 1\n               ELSE 0\n          END AS ExpensiveLaptop\n      FROM PRODUCTS\n\
    \      WHERE PRODTYPE='Laptop'\n      ORDER BY PRODCOST;\n```"
  merge: -1
  img_proc: true
- pgno: 163
  md: "```\nELSE 0\nEND;\nQUIT;\n```\n\n# Results\n\n| The SAS System |\n| Product\
    \ Name | Product Cost | InexpensiveLaptop | MediumPricedLaptop | ExpensiveLaptop\
    \ |\n| Travel Laptop | $3,400.00 | 0 | 0 | 1 |\n\n# Another Customized List with\
    \ a Searched CASE Expression\n\nExtending the features from the previous searched\
    \ CASE expression example, a customized list is created. In this example, a unique\
    \ approach is used to create a list of products with their respective inventory\
    \ quantities. The query performs an equijoin on the PRODUCTS and INVENTORY tables\
    \ with Case logic conditions nested two levels deep to capture the inventory quantities\
    \ for each product in the PRODUCTS table.\n\n# SQL Code\n\n```\nPROC SQL;\n  \
    \  SELECT PRODNAME,\n        P.PRODNUM,\n        CASE WHEN SUBSTR(PUT(P.PRODNUM,4.),1,1)\
    \ = '1' THEN\n            CASE WHEN INVENQTY > 0 THEN INVENQTY\n            END\n\
    \        END AS ComputerHardware,\n        CASE WHEN SUBSTR(PUT(P.PRODNUM,4.),1,1)\
    \ = '2' THEN\n            CASE WHEN INVENQTY > 0 THEN INVENQTY\n            END\n\
    \        END AS OfficeEquipment,\n        CASE WHEN SUBSTR(PUT(P.PRODNUM,4.),1,1)\
    \ = '5' THEN\n            CASE WHEN INVENQTY > 0 THEN INVENQTY\n            END\n\
    \        END AS ComputerSoftware\n    FROM PRODUCTS  P,\n        INVENTORY  I\n\
    \    WHERE P.PRODNUM = I.PRODNUM\n        ORDER BY PRODNAME;\nQUIT;\n```"
