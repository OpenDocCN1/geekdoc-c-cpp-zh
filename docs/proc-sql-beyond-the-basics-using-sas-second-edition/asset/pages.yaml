- pgno: 334
  md: "# Results\n\n| | Product Number | Product Name | Customer Number | Invoice\
    \ Quantity - Units Sold | Invoice Unit Price |\n|---|---|---|---|---|---|\n| 1\
    \ | 1110 Dream Machine | 501 | 3 | $9,600.00 |\n| 2 | 1200 Business Machine |\
    \ 401 | 7 | $23,100.00 |\n\nIn the next example, a third layer of view is nested\
    \ to the previous view in order to find the largest invoice amount. In the next\
    \ example, a view is constructed to find the largest invoice amount using the\
    \ MAX summary function to compute the product of the invoice price (INVPRICE)\
    \ and invoice quantity (INVQTY) from the JOINED_VIEW view.\n\nWhen accessed from\
    \ the SAS Windowing environment, the view produces the results displayed below.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    CREATE VIEW LARGEST_AMOUNT_VIEW AS\n     \
    \   SELECT MAX(INVPRICE*INVQTY) AS Maximum_Price\n            FORMAT=DOLLAR12.2\n\
    \            LABEL=\"Largest Invoice Amount\"\n        FROM JOINED_VIEW;\nQUIT;\n\
    ```\n\n# Results\n\n| | Largest Invoice Amount |\n|---|---|\n| 1 | $161,700.00\
    \ |\n\n# Updatable Views\n\nOnce a view has been created from a physical table,\
    \ it can then be used to modify the view’s data of a single underlying table.\
    \ Essentially, when a view is updated the changes pass through the view to the\
    \ underlying base table. A view that is designed in this manner is called an updatable\
    \ view and can have INSERT, UPDATE, and DELETE operations performed into the single\
    \ table from which it’s constructed.\n\nBecause views are dependent on getting\
    \ their data from a base table and have no physical existence of their own, you\
    \ should exercise care when constructing an updatable view. Although useful in\
    \ modifying the rows in a table, updatable views do have a few limitations that\
    \ programmers and users should be aware of."
  merge: -1
  img_proc: true
- pgno: 335
  md: "+   - An updatable view can have only a single base table associated with it.\
    \ This means that the underlying table cannot be used in a join operation or with\
    \ any set operators. Because an updatable view has each of its rows associated\
    \ with only a single row in an underlying table, any operations that involve two\
    \ or more tables will produce an error and result in update operations not being\
    \ performed.\n+   - An updatable view cannot contain a subquery. A subquery is\
    \ a complex query that consists of a SELECT statement that is contained inside\
    \ another statement. This violates the rules for updatable views and is not allowed.\n\
    +   - An updatable view can update a column using a view’s column alias, but cannot\
    \ contain the DISTINCT keyword, have any aggregate (summary) functions, calculated\
    \ columns, or derived columns associated with it. Because these columns are produced\
    \ by an expression, they are not allowed.\n+   - An updatable view can contain\
    \ a WHERE clause but cannot contain other clauses such as ORDER BY, GROUP BY,\
    \ or HAVING.\n\nIn the remaining sections, three types of updatable views will\
    \ be examined:\n\n+   - Views that insert one or more rows of data\n+   - Views\
    \ that update existing rows of data\n+   - Views that delete one or more rows\
    \ of data from a single underlying table\n\n# Inserting New Rows of Data\n\nYou\
    \ can add or insert new rows of data in a view using the INSERT INTO statement.\
    \ Suppose that you have a view that consists of only software products, called\
    \ SOFTWARE_PRODUCTS_VIEW. The PROC SQL code that is used to create this view consists\
    \ of a SELECT statement with a WHERE clause. There are four defined columns: product\
    \ number, product name, product type, and product cost, in that order. When accessed\
    \ from the SAS Windowing environment, the view produces the results displayed\
    \ below.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE VIEW SOFTWARE_PRODUCTS_VIEW\
    \ AS\n        SELECT prodnum, prodname, prodtype, prodcost\n            FORMAT=DOLLAR8.2\n\
    \        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) IN ('SOFTWARE');\n\
    QUIT;\n```"
  merge: -1
  img_proc: true
