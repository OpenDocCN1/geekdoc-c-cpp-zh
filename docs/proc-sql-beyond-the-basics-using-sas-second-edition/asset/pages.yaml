  md: "d represents the optional decimal positioning for numeric data.\n\nReferring\
    \ to the example first shown in Chapter 2, “Working with Data in PROC SQL,” the\
    \ next example illustrates the computation of a discounted value (80% of PRODCOST)\
    \ from the PRODUCTS table, the assignment of a column alias of “Discount_Price”\
    \ with the AS keyword, and the DOLLAR9.2 format applied to the resulting value\
    \ with a FORMAT= column modifier.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ PRODNAME,\n        PRODTYPE,\n        PRODCOST * 0.80 AS Discount_Price FORMAT=DOLLAR9.2\n\
    \    FROM PRODUCTS\n    ORDER BY 3;\nQUIT;\n```\n\n# Results\n\n| Product Name\
    \ | Product Type | Discount_Price |\n|---|---|---|\n| Analog Cell Phone | Phone\
    \ | $28.00 |\n| Office Phone | Phone | $104.00 |\n| Digital Cell Phone | Phone\
    \ | $140.00 |\n| Spreadsheet Software | Software | $239.20 |\n| Graphics Software\
    \ | Software | $239.20 |\n| Wordprocessor Software | Software | $239.20 |\n| Database\
    \ Software | Software | $319.20 |\n| Dream Machine | Workstation | $2,560.00 |\n\
    | Business Machine | Workstation | $2,640.00 |\n| Travel Laptop | Laptop | $2,720.00\
    \ |\n\n# Concatenating Character Strings\n\nAs was presented in Chapter 2, two\
    \ or more strings can be concatenated to produce a combined and longer string\
    \ of characters. The concatenation character string operator, which is represented\
    \ by two vertical bars “||”, “!!”, or “||” (depending on the operating system\
    \ and keyboard being used), combines two or more strings or columns together to\
    \ form a new string value. In the next example,"
  merge: -1
