  md: "```\n```sas\nWHEN 0 THEN 0\nELSE INVEN CST / INVENQTY\nEND AS Average_Cost\
    \ FORMAT=DOLLAR10.2\nFROM INVENTORY\nWHERE INVEN CST / INVENQTY > 1000;\nQUIT;\n\
    ```\n```\n\n# Results\n\n| Product Number | Inventory Quantity | Inventory Cost\
    \ | Average_Cost |\n|---:|---:|---:|---:|\n| 1110 | 20 | $45,000.00 | $2,250.00\
    \ |\n| 1700 | 10 | $28,000.00 | $2,800.00 |\n\nIn the next example, a simple CASE\
    \ expression is implemented in a WHERE clause to prevent division by zero errors.\
    \ As before, the CASE expression’s WHEN condition tells SAS to ignore performing\
    \ any computations for products containing an INVENQTY value of zero (by assigning\
    \ a Boolean value of false). Otherwise, the equation INVENCST / INVENQTY is computed\
    \ and products costing more than $1,000.00 are selected by the WHERE clause.\n\
    \n# SQL Code\n\n```\n```sas\nPROC SQL;\n    SELECT PRODNUM,\n           INVENQTY,\n\
    \           INVENCST\n    FROM INVENTORY\n    WHERE CASE INVENQTY\n          WHEN\
    \ 0 THEN 0\n          ELSE INVENCST / INVENQTY\n          END > 1000;\nQUIT;\n\
    ```\n```\n\n# Results\n\n| Product Number | Inventory Quantity | Inventory Cost\
    \ |\n|---:|---:|---:|\n| 1110 | 20 | $45,000.00 |\n| 1700 | 10 | $28,000.00 |"
