    # Introduction


    In previous chapters, our discussion of queries was confined to a single table
    referenced with a SELECT statement. The real strength of the relational approach
    is the ability it gives to constructing queries that refer to several tables or
    even to other queries. These types of queries are referred to as *complex queries*.
    PROC SQL supports coding constructs for inner and outer joins consisting of multiple
    tables, implementing queries that control other queries through a process known
    as nesting, and combining output as a single table from multiple queries.


    # Introducing Complex Queries


    Let’s look at queries of a more complex nature that utilize all the features of
    the SQL procedure. Four complex query constructs are illustrated in this chapter.


    +   - Inner Joins

    +     A maximum of 256 tables can be referenced in a FROM and optional WHERE clause
    of a SELECT statement.

    +   - Outer Joins

    +     A maximum of two tables are referenced in a FROM and ON clause of a SELECT
    statement.

    +   - Subqueries

    +     A query is embedded (nested) in the WHERE clause of a main query.'
