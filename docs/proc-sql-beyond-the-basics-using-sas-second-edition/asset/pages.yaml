    # Complex Query Applications


    Query applications come in all forms and can typically be classified into three
    distinct categories:


    +   - **Production-oriented queries** rarely change, are run as needed (e.g.,
    daily, weekly, monthly, etc.), and consist of SQL statements, parameter lists,
    and/or action queries.

    +   - **Ad-hoc queries** are typically constructed as needed and are often used
    once or in some unpredictable way to solve a particular need or problem.

    +   - **Custom queries** are classified as falling somewhere in-between production-oriented
    and ad-hoc queries, where the query is essentially the same each time its run,
    but conditional, parameter, action processing (e.g., create a new table, update
    one or more rows in a table, delete one or more rows in a table, and append one
    or more rows to an existing table), and data differences exist and must be handled.


    In this section, a few complex query applications are presented to show how the
    SQL procedure can be used to satisfy specific processing and/or data management
    requirements. The applications have been selected, in part, based on the needs
    many SAS users have, the emulation of popular DATA step techniques as SQL queries,
    and to share interesting SQL procedure coding techniques and approaches.


    # One-to-One, One-to-Many, Many-to-One, and Many-to-Many Relationships


    Input tables are frequently characterized by the way rows in one table relate
    to one or more rows in another table. This process, referred to as the data relationship
    between two or more tables, consists of four categories:


    +   - one-to-one

    +   - one-to-many'
  merge: -1
  img_proc: true
- pgno: 303
  md: "+   - many-to-one\n+   - many-to-many\n\nTo better understand how data sources\
    \ can be processed for producing desirable results, it helps to be able to differentiate\
    \ between the four data relationship categories. The following example illustrates\
    \ coding conventions for application of one-to-one, one-to-many, many-to-one,\
    \ and many-to-many data relationships in the SQL procedure.\n\n# SQL Code\n\n\
    ```\n/* *************************************************************************/\n\
    /** PROGRAM NAME: DATA-RELATIONSHIPS.SAS                                 **/\n\
    /** PURPOSE..... : Derive one-to-one, one-to-many, many-to-one,          **/\n\
    /**               and many-to-many data relationships using              **/\n\
    /**               complex queries.                                        **/\n\
    /** AUTHOR...... : Kirk Paul Lafler                                       **/\n\
    /** DATE WRITTEN: August 30, 2012                                         **/\n\
    /***********************************************************************/\nproc\
    \ sql noprint;\n/***********************************************************************/\n\
    /** ROUTINE..... : ONE-TO-ONE                                            **/\n\
    /** PURPOSE..... : Produce a one-to-one data relationship using          **/\n\
    /**               a base table with a unique key and a lookup             **/\n\
    /**               table with a unique key in an EQUIJOIN.                 **/\n\
    /***********************************************************************/\n  \
    \  create table one_to_one as\n        select m.manunum,\n               m.manuname,\n\
    \               p.prodtype,\n               p.prodcost\n          from manufacturers\
    \  m,\n               products        p\n         where m.manunum=p.manunum;\n\
    /***********************************************************************/\n/**\
    \ ROUTINE..... : ONE-TO-MANY                                           **/\n/**\
    \ PURPOSE..... : Produce a one-to-many data relationship               **/\n/**\
    \               using the table with the unique key as a               **/\n/**\
    \               lookup table and a LEFT JOIN.                          **/\n/***********************************************************************/\n\
    \    create table one_to_many as\n        select p1.prodnum,\n               p1.prodname,\n\
    \               p2.units,\n               p2.unitcost,\n               p2.units\
    \ * p2.unitcost as Total_Cost format=dollar12.2\n          from products  p1\n\
    \               LEFT JOIN\n               purchases  p2\n             on p1.prodnum=p2.prodnum;\n\
    /***********************************************************************/\n```"
  merge: -1
