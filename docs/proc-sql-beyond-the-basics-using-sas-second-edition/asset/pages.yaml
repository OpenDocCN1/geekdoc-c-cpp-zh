  md: "users should be aware of what reserved words exist to prevent unexpected and\
    \ unintended results during SQL processing. Column names should conform to proper\
    \ SAS naming conventions (as described in the *SAS Language Reference*), and they\
    \ should not conflict with certain reserved words found in the SQL language. The\
    \ following list identifies the reserved words found in the ANSI SQL standard.\n\
    \n# ANSI SQL Reserved Words\n\n|  |  |  |\n|---|---|---|\n| AS | INNER | OUTER\
    \ |\n| CASE | INTERSECT | RIGHT |\n| EXCEPT | JOIN | UNION |\n| FROM | LEFT |\
    \ UPPER |\n| FULL | LOWER | USER |\n| GROUP | ON | WHEN |\n| HAVING | ORDER |\
    \ WHERE |\n\nYou probably will not encounter too many conflicts between a column\
    \ name and an SQL reserved word, but when you do you will need to follow a few\
    \ simple rules to prevent processing errors from occurring. As was stated earlier,\
    \ although PROC SQL’s naming conventions are not as rigid as other vendor’s implementations,\
    \ care should still be exercised, in particular when PROC SQL code is transferred\
    \ to other database environments expecting it to run error free. If a column name\
    \ in an existing table conflicts with a reserved word, you have three options\
    \ at your disposal:\n\n+   1. Physically rename the column name in the table,\
    \ as well as any references to the column.\n+   2. Use the RENAME= data set option\
    \ to rename the desired column in the current query.\n+   3. Specify the PROC\
    \ SQL option DQUOTE=ANSI, and surround the column name (reserved word) in double\
    \ quotes, as illustrated below.\n\n# SQL Code\n\n```\nPROC SQL DQUOTE=ANSI;\n\
    \    SELECT *\n        FROM RESERVED_WORDS\n        WHERE \"WHERE\"='EXAMPLE';\n\
    QUIT;\n```\n\n# Data Integrity\n\n*Webster’s New World Dictionary* defines *integrity*\
    \ as “the quality or state of being complete; perfect condition; reliable; soundness.”\
    \ Data integrity is a critical element that every organization must promote and\
    \ strive for. It is imperative that the data tables in a database environment\
    \ be reliable, free of errors, and sound in every conceivable way. The existence\
    \ of data errors, missing information, broken links, and other related problems\
    \ in one or more tables can impact decision-making and information reporting activities\
