    \ from the inner query.\n+   2. The WHERE clause of the inner query retrieves\
    \ any invoice prices for product numbers 5001 and 5002 and passes them to the\
    \ outer query.\n+   3. The resulting inner query passes multiple row values to\
    \ the main (outer) query for execution.\n\n# Results\n\n| Manufacturer Number\
    \ | Product Number | Invoice Quantity - Units Sold | Invoice Unit Price |\n|---|---|---|---|\n\
    | 500 | 5001 | 5 | $1,495.00 |\n| 600 | 6001 | 2 | $1,598.00 |\n| 111 | 1110 |\
    \ 3 | $9,600.00 |\n| 500 | 5002 | 2 | $798.00 |\n| 500 | 1200 | 7 | $23,100.00\
    \ |\n\nThe ALL keyword works very differently from the ANY keyword. When you specify\
    \ ALL before a subquery expression, the subquery is true only if the comparison\
    \ is true for values that are returned by the subquery. For example, suppose that\
    \ you want to view the products whose inventory quantity is less than the average\
    \ inventory quantity?\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT manunum, prodnum,\
    \ invqty, invprice\n      FROM INVOICE\n        WHERE invprice < ALL\n       \
