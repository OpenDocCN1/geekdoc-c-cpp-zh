- pgno: 236
  md: "# SQL Code\n\n```\n```sql\nPROC SQL;\n    CREATE VIEW INVENTORY_VIEW AS\n \
    \       SELECT PRODNUM, INVENQTY, INVENTORY_STATUS\n            FROM INVENTORY;\n\
    QUIT;\n```\n```\n\nThe PROC CONTENTS output below shows the positioning of the\
    \ columns in the new view including the new INVENTORY_STATUS column that was added\
    \ earlier.\n\n# Results\n\n| # | Variable | Type | Len | Label |\n|---:|---|---|---:|---|\n\
    | 1 | prodnum | Num | 3 | Product Number |\n| 2 | invenqty | Num | 3 | Inventory\
    \ Quantity |\n| 3 | INVENTORY_STATUS | Char | 12 |  |\n\n# Changing a Column’s\
    \ Length\n\nColumn definitions (length, informat, format, and label) can be modified\
    \ with the MODIFY clause in the ALTER TABLE statement. PROC SQL enables a character\
    \ or numeric column to have its length changed. In the next example, suppose that\
    \ you want to reduce the length of the character column MANUCITY in the MANUFACTURERS\
    \ table from 20 bytes to a length of 15 bytes in order to conserve space. The\
    \ CHAR column-definition is used in the MODIFY clause in the ALTER TABLE statement\
    \ to redefine the length of the column.\n\n# SQL Code\n\n```\n```sql\nPROC SQL;\n\
    \    ALTER TABLE MANUFACTURERS\n        MODIFY MANUCITY CHAR(15);\nQUIT;\n```\n\
    ```\n\n# SAS Log Results\n\n```\n```\nPROC SQL;\n    ALTER TABLE MANUFACTURERS\n\
    \        MODIFY MANUCITY CHAR(15);\nNOTE: Table WORK.MANUFACTURERS has been modified,\
    \ with 4 columns.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n      real time     \
    \      0.50 seconds\n```\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "The following PROC CONTENTS output illustrates the changed column length made\
    \ to the MANUCITY column in the MANUFACTURERS table.\n\n# Results\n\n| Variables\
    \ in Creation Order |\n|---|---|---|---|---|\n| # | Variable | Type | Len | Label\
    \ |\n| 1 | manunum | Num | 3 | Manufacturer Number |\n| 2 | manuname | Char |\
    \ 25 | Manufacturer Name |\n| 3 | manucity | Char | 15 | Manufacturer City |\n\
    | 4 | manustat | Char | 2 | Manufacturer State |\n\nThe column length can also\
    \ be changed using the PROC SQL LENGTH= option in the SELECT clause of the CREATE\
    \ TABLE statement. With this construct, you do not need to use the ALTER TABLE\
    \ statement, as illustrated in the previous example, as well as using a DATA step.\
    \ The next example shows the LENGTH= option to reduce the length of the MANUCITY\
    \ column from 20 bytes to 15 bytes.\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE\
    \ TABLE MANUFACTURERS_MODIFIED AS\n        SELECT MANUNUM, MANUNAME, MANUCITY\
    \ LENGTH=15, MANUSTAT\n            FROM MANUFACTURERS;\nQUIT;\n```\n\n# SAS Log\
    \ Results\n\n```\nPROC SQL;\n    CREATE TABLE MANUFACTURERS_MODIFIED AS\n    \
    \    SELECT MANUNUM, MANUNAME, MANUCITY LENGTH=15, MANUSTAT\n            FROM\
    \ MANUFACTURERS;\nNOTE: Table WORK.MANUFACTURERS_MODIFIED created, with 6 rows\
    \ and 4 columns.\n\nQUIT;\nNOTE: PROCEDURE SQL used (Total process time):\n  \
    \    real time           0.12 seconds\n      cpu time            0.01 seconds\n\
    ```\n\nA column that is initially defined as numeric can also have its length\
    \ changed in PROC SQL. The SQL procedure ignores a field width in these situations\
    \ and defines all numeric columns with a maximum width of 8 bytes. The reason\
    \ is that numeric columns are always defined with the maximum precision allowed\
    \ by SAS. To override this limitation, it is recommended that you use a"
  merge: -1
