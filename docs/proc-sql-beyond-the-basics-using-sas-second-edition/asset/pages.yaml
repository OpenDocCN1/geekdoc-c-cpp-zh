  md: '# Acknowledgments


    This book was made possible because of the support and encouragement of many people.
    I would like to extend my sincerest thanks to each person who encouraged me to
    write this book. For, as G. B. Stern once said, “Silent gratitude isn’t very much
    use to anyone.” So from me to you, thank you to each one of you.


    To Julie Platt at SAS Institute for supporting my desire to develop a more comprehensive
    second edition. Her encouragement and support gave me the inspiration to see this
    project to completion.


    To Stacey Hamilton at SAS Institute for her editorial assistance and coordinating
    the technical review process while I developed the second edition.


    To Paul Kent at SAS Institute for his contagious enthusiasm, great examples, clear
    explanations, and mentorship with some of the fine points of PROC SQL and its
    capabilities over the years.


    To David Baggett at SAS Institute for encouraging the idea of a book on PROC SQL
    and accepting the original first edition manuscript many years ago. His encouragement
    and support over the years has meant a great deal to me.


    To Stephenie Joyner at SAS Institute for her support and encouragement during
    the development of the first edition, and for coordinating the technical review
    process.


    To all the technical and editorial reviewers who provided valuable feedback, technical
    accuracy, and editorial comments throughout the writing process.


    To Charles Edwin Shipp, Michael Raithel, Mary Rosenbloom, Richard La Valley, and
    Sunil Kumar Gupta for their friendship, support, and encouragement through the
    years.


    To Art Carpenter of California Occidental Consultants for believing that a “beyond
    the basics” type of book on PROC SQL would be useful to SAS users.


    To the many people at SAS Institute with whom I have developed so many friendships
    over the years. I’d like to express my thanks to each of you as well as all the
    knowledgeable people in SAS Technical Support. Thank you for developing and supporting
    a great product and enabling me to have a rewarding and enjoyable career for all
    these years.


    To the SAS User Groups, their leadership, and many members throughout the world:
    You are the greatest group of professionals anywhere.'
  merge: -1
