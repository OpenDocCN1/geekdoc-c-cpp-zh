- pgno: 367
  md: "# SQLRC Macro Variable\n\nThe SQLRC macro variable displays a status value\
    \ that indicates whether the PROC SQL statement was successful or not. A %PUT\
    \ macro statement is specified to display the contents of the SQLRC macro variable.\
    \ The following example retrieves the software products from the PRODUCTS table\
    \ and displays SAS output with a SELECT statement. The %PUT statement displays\
    \ a return code of zero, which indicates that the SELECT statement was successful.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n    SELECT *\n    FROM PRODUCTS\n        WHERE\
    \ PRODTYPE='Software';\n    %PUT SQLRC = &SQLRC;\n    QUIT;\n```\n\n# SAS Log\
    \ Results\n\n```\nPROC SQL;\n    SELECT *\n    FROM PRODUCTS\n        WHERE PRODTYPE='Software';\n\
    \    %PUT SQLRC = &SQLRC;\n    SQLRC = 0\n    QUIT;\n```\n\n# Troubleshooting\
    \ and Debugging Examples\n\nThis section shows a number of errors that I have\
    \ personally experienced while working on SQL procedure problems. Although not\
    \ representative of all of the possible errors that might occur, it does illustrate\
    \ a set of common problems along with a technical approach for correcting each\
    \ problem.\n\n# ERROR 78-322: Expecting a ','\n\n# Problem Description\n\nSyntax\
    \ errors messages can, at times, provide confusing information about the specific\
    \ problem at hand. A case in point is the error, 78-322: Expecting a ','. In the\
    \ example below, it initially appears that a comma is missing between two column\
    \ names in the SELECT statement. On closer review, the actual problem points to\
    \ a violation of the column’s naming conventions that was caused by specifying\
    \ an invalid character in the assigned column alias in the AS keyword.\n\n# Code\
    \ and Error\n\n```\nPROC SQL;\n    SELECT CUSTNUM, ITEM, UNITS * UNITCOST AS Total-Cost\n\
    \                                            -\n78\nERROR 78-322: Expecting a\
    \ ','.\n```"
  merge: -1
  img_proc: true
