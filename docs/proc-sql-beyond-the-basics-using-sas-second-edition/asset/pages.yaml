- pgno: 369
  md: "# ERROR Ambiguous reference, column\n\n# Problem Description\n\nIn the next\
    \ example, the syntax error points to a problem where a column name that is specified\
    \ in a SELECT statement appears in more than one table resulting in a column ambiguity.\
    \ This problem not only creates confusion for the SQL processor, but also prevents\
    \ the query from executing.\n\n# Code and Error\n\n```\n```sas\nPROC SQL;\n  \
    \  SELECT prodname, prodcost,\n           manunum, manuname\n    FROM PRODUCTS\
    \ AS P, MANUFACTURERS AS M\n        WHERE P.manunum = M.manunum;\nERROR: Ambiguous\
    \ reference, column manunum is in more than one table.\nQUIT;\n```\n```\n\n# Corrective\
    \ Action\n\nTo remove any and all column ambiguities, you should reference each\
    \ column that appears in two or more tables with its respective table name in\
    \ a SELECT statement and its clauses. For example, to reference the MANUNUM column\
    \ in the MANUFACTURERS table and remove all ambiguities, you would specify the\
    \ column in the SELECT statement as MANUFACTURERS.MANUNUM.\n\n# ERROR 200-322:\
    \ The symbol is not recognized and will be ignored\n\n# Problem Description\n\n\
    In the next example, the syntax error points to the left parenthesis at the end\
    \ of the second SELECT statement’s WHERE clause as being invalid. The key to finding\
    \ the actual problem is to work backward, line-by-line, from the point where the\
    \ error is marked. Using this approach, you will notice that the second SELECT\
    \ statement is a subquery (or inner query) and does not conform to valid syntax\
    \ rules. As with other syntax errors, the query as well as the subquery does not\
    \ execute.\n\n# Code and Error\n\n```\n```sas\nPROC SQL;\n    SELECT *\n     \
    \   FROM INVOICE\n        WHERE manunum IN\n            SELECT manunum\n     \
    \           FROM MANUFACTURERS\n                WHERE UPCASE(manucity) LIKE 'SAN\
    \ DIEGO%');\n```\n```"
  merge: -1
  img_proc: true
- pgno: 370
  md: "```\nERROR 22-322: Syntax error, expecting one of the following: ;, !, !!,\
    \ &, *, **, +, -, //, AND, ESCAPE, EXCEPT, GROUP, HAVING, INTERSECT, OR, ORDER,\
    \ OUTER, UNION, |, ||.\nERROR 200-322: The symbol is not recognized and will be\
    \ ignored.\nQUIT;\n```\n\n# Corrective Action\n\nA subquery must conform to valid\
