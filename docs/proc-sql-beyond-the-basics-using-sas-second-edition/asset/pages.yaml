    \ selected for WHERE clause optimization.\n    QUIT;\nNOTE: PROCEDURE SQL used:\n\
    \      real time          0.65 seconds\n```\n\n# Optimizing WHERE Clause Processing\
    \ with Indexes\n\nTo get the best possible performance from programs that contain\
    \ SQL procedure code, an index and WHERE clause can be used together (see the\
    \ list below). Using a WHERE clause restricts processing in a table to a subset\
    \ of selected rows (for more information, see Chapter 2, \"Working with Data in\
    \ PROC SQL\"). When an index exists, the SQL processor determines whether to take\
    \ advantage of it during WHERE clause processing. Although the SQL optimizer determines\
    \ whether using an index"
