    Another approach that can improve the way a query with a SET operator performs\
    \ is to specify the ALL keyword, as long as duplicates are not an issue or the\
    \ rows in the table are all unique. Because the ALL keyword prevents SQL from\
    \ processing the data twice and does not remove duplicate rows, CPU resources\
    \ might be improved. The next example shows the UNION ALL coding construct being\
    \ used to perform what amounts to an append operation, thereby bypassing the sort\
    \ altogether because the duplicate rows are not removed.\n\n# SQL Code (Less Efficient)\n\
    \n```\nOPTIONS FULLSTIMER;\nPROC SQL;\n    SELECT *\n        FROM PRODUCTS\n \
    \           WHERE UPCASE(PRODTYPE) = 'LAPTOP'\n\n    UNION ALL\n\n    SELECT *\n\
    \        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) = 'SOFTWARE';\nQUIT;\n\
    ```\n\n# SAS Log Results\n\n```\nOPTIONS FULLSTIMER;\nPROC SQL;\n    SELECT *\n\
    \        FROM PRODUCTS\n            WHERE UPCASE(PRODTYPE) = 'LAPTOP'\n```"
