- pgno: 156
  md: "# Nesting Simple CASE Expressions\n\nMuch has been written on the techniques\
    \ associated with software construction, particularly about aspects related to\
    \ program and/or code design. When discussions of program complexity arise, it\
    \ is widely accepted that a program’s degree of complexity can often be reduced\
    \ by dividing its solution into smaller pieces or parts. This rule of thinking\
    \ is perhaps best discussed in Steve McConnell’s book, Code Complete: A Practical\
    \ Handbook of Software Construction, Second Edition (2004), “Humans tend to have\
    \ an easier time comprehending several simple pieces of information than one complicated\
    \ piece.”\n\nAlthough many design strategies exist to improve the process of program\
    \ design, one strategy frequently mentioned is the process of nesting. Nesting\
    \ involves converting complex and/or cumbersome logic scenarios into two (or more)\
    \ simpler logic conditions. The primary objective is to improve a program’s maintainability\
    \ and readability. This rule of thought is further reinforced by the SQL procedure’s\
    \ support for nesting using a CASE expression construct.\n\nNesting can be a useful\
    \ technique because it provides SQL users with an effective way to handle complex\
    \ code. But, unnecessary nesting or nesting just for the sake of nesting can actually\
    \ make code more difficult to comprehend and maintain. It’s been my experience\
    \ that nesting should never exceed three or four levels deep. Anything more than\
    \ that and the degree of complexity can increase significantly. The general rule\
    \ is to develop code that’s not only easy to understand, but hopefully contains\
    \ fewer errors. To illustrate the process of nesting, a simple CASE expression\
    \ is nested two levels deep for identifying software products in the PRODUCTS\
    \ table that cost less than $300.00.\n\n# SQL Code\n\n```\nPROC SQL;\n    SELECT\
    \ PRODNAME,\n            PRODTYPE,\n            PRODCOST,\n            CASE PRODTYPE\n\
    \                WHEN 'Software' THEN\n                    CASE\n            \
    \            WHEN PRODCOST < 300 THEN 'Match'\n                        ELSE 'No\
    \ Match'\n                    END\n                ELSE 'Not Software'\n     \
    \       END AS Product_Type_Cost\n    FROM PRODUCTS;\nQUIT;\n```"
  merge: -1
  img_proc: true
