  md: "# SQL Code\n\n```\nPROC SQL;\n    SELECT manuname, manucity, manufacturers.manunum,\n\
    \        products.prodtype, products.prodcost\n    FROM MANUFACTURERS LEFT JOIN\
    \ PRODUCTS\n        ON manufacturers.manunum =\n            products.manunum;\n\
    QUIT;\n```\n\n① The LEFT JOIN specification preserves all of the rows in the left\
    \ table (MANUFACTURERS) even when there are no matching rows in the right table\
    \ (PRODUCTS).\n\n② The ON clause acts as a WHERE clause to select the desired\
    \ rows in the join results.\n\nAs the results from the left outer join illustrate,\
    \ the rows in the left (MANUFACTURERS) table that match rows in the right (PRODUCTS)\
    \ table are included in the result table. As a result, eight rows match as evidenced\
    \ by the value assigned to product type and product cost. Additionally, two rows\
    \ from the left table that do not match rows in the right table (based on the\
    \ search condition) are also retained (bolded). Therefore, each row from the MANUFACTURERS\
    \ table that does not have a matching value in the PRODUCTS table is added to\
    \ the resulting virtual table, accompanied by null values in the product type\
