    \ SQL used:\n    real time          1.12 seconds\n    cpu time           0.06\
    \ seconds\n```\n\n# Validating Column Values with a CHECK Constraint\n\nA CHECK\
    \ constraint validates data values against a list of values, minimum and maximum\
    \ values, as well as a range of values before populating a table. Using either\
    \ a CREATE TABLE or ALTER TABLE statement, you can apply a CHECK constraint to\
    \ any column that requires data validation to be performed. In the next example,\
    \ suppose you want to validate data values in the PRODTYPE (Product Type) column\
    \ in the PRODUCTS table. When you specify a CHECK constraint against the PRODTYPE\
    \ column using the ALTER TABLE statement, product type values will first need\
    \ to match the list of defined values or the rows will be rejected.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n    ALTER TABLE PRODUCTS\n        ADD CONSTRAINT CHECK_PRODUCT_TYPE\n\
    ```"
