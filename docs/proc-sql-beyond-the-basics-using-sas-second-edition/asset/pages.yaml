- pgno: 46
  md: "# Introduction\n\nPROC SQL is essentially a database language as opposed to\
    \ a procedural or computational language. In addition to having two data types\
    \ available in the SAS implementation of SQL, numerous extensions including operators,\
    \ functions, and predicates are available to PROC SQL programmers.\n\n# Overview\
    \ of Data Types\n\nThe purpose of a database is to store data. A database contains\
    \ one or more tables (and other components). Tables consist of columns and rows\
    \ of data. In the SAS implementation of SQL, the available data types are limited\
    \ to only two possibilities:\n\n+   - numeric\n+   - character\n\n# Numeric Data\n\
    \nThe SAS implementation of SQL provides programmers with numerous arithmetic,\
    \ statistical, and summary functions. It offers one numeric data type to represent\
    \ numeric data. Columns defined as a numeric data type with the NUMERIC or NUM\
    \ column definition are assigned a default length of 8 bytes, even if the column\
    \ is created with a numeric length of less than 8 bytes. This provides the greatest\
    \ degree of precision allowed by SAS software. In the example, a table called\
    \ PURCHASES is created consisting of four numeric columns. The resulting table\
    \ contains no rows of data, as illustrated by the SAS log results. For more information\
    \ about the CREATE TABLE statement, see Chapter 5, “Creating, Populating, and\
    \ Deleting Tables.”\n\n# SQL Code\n\n```\nPROC SQL;\n    CREATE TABLE PURCHASES\n\
    \    (CUSTNUM  NUM,\n     PRODNUM  NUM,\n     UNITS    NUM,\n     UNITCOST NUM(8,2));\n\
    QUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\n    CREATE TABLE PURCHASES\n\
    \    (CUSTNUM  NUM,\n     PRODNUM  NUM,\n     UNITS    NUM,\n     UNITCOST NUM(8,2));\n\
    NOTE: Table PURCHASES created, with 0 rows and 4 columns.\n    QUIT;\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Results


    **Alphabetic List of Variables and Attributes**


    | # | Variable | Type | Len |

    | --- | --- | --- | --- |

    | 1 | CUSTNUM | Num | 8 |

    | 2 | PRODNUM | Num | 8 |

    | 4 | UNITCOST | Num | 8 |

    | 3 | UNITS | Num | 8 |


    Creating a numeric column that is less than 8 bytes requires the use of the DATA
    step LENGTH statement. Although it is not necessary to assign smaller lengths
    to numeric columns because it can result in precision issues, doing so can make
    for more efficient use of data storage system resources. The example illustrates
    a DATA step that assigns smaller lengths to the four numeric variables in the
    PURCHASES table: CUSTNUM, PRODNUM, UNITS, and UNITCOST. In contrast to the SAS
    log results produced by the previous PROC SQL code, the CONTENTS output illustrates
    the creation of a dataset with one record and four user-defined, and shorter length,
    numeric variables.


    # ## DATA Step Code


    ```

    ```sas

    DATA PURCHASES;

    LENGTH CUSTNUM 4.

    PRODNUM 3.

    UNITS 3.

    UNITCOST 4.;

    LABEL CUSTNUM = ''Customer Number''

    PRODNUM = ''Product Purchased''

    UNITS = ''# Units Purchased''

    UNITCOST = ''Unit Cost'';

    FORMAT UNITCOST DOLLAR12.2;

    RUN;

    PROC CONTENTS DATA=PURCHASES;

    RUN;

    ```

    ```'
  merge: -1
  img_proc: true
