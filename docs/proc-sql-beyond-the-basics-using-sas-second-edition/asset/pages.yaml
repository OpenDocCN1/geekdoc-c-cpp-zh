    \ Name | Number of Physical Observations |\n|--------------|-------------|---------------------------------|\n\
    | WORK         | PRODUCTS    | 10                              |\n\n# Identifying\
    \ Duplicate Rows in a Table\n\nSometimes it is useful to be able to identify duplicate\
    \ rows in a table. In the next example, the SELECT statement with a COUNT summary\
    \ function and HAVING clause are used in a user-defined macro called DUPS. Macro\
    \ DUPS is designed to accept and process three user-supplied values: the library\
    \ reference, table name, and column(s) in a group by list. Once these values are\
    \ supplied by submitting macro DUPS, the macro is executed with the results displayed\
    \ in the Output window.\n\n# SQL Code\n\n```\n%MACRO DUPS(LIB, TABLE, GROUPBY);\n\
    \    PROC SQL;\n        SELECT &GROUPBY, COUNT(*) AS Duplicate_Rows\n        \
    \    FROM &LIB..&TABLE\n                GROUP BY &GROUPBY\n                  \
    \  HAVING COUNT(*) > 1;\n    QUIT;\n%MEND DUPS;\n\n%DUPS(WORK,PRODUCTS,PRODTYPE);\n\
