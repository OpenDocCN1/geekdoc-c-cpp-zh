    competition. There are 12 judges that are present. First step: all 12 judges submit
    their scores. Second step: the highest and lowest score are thrown out from the
    12 submitted scores. Third step: the remaining 10 scores are averaged. Write a
    program that reads 12 scores submitted by 12 judges for the specific event and
    calculates the final score according to the rules written above. Each input score
    is an integer number between 0 and 100. You can assume that the input is valid.


    ## 37. Write a program that reads two positive integers and prints all prime numbers
    between two inputs.


    ## 38. Write a program that reads one positive integers and finds the sum of all
    prime divisors of the input number. For example, if the input is `12`, the output
    will be `5`. Explanation: only `2` and `3` are prime divisors of `12` (all divisors
    of `12` are: `1, 2, 3, 4, 6`, and `12`).


    ## 39. Write a program that reads a sequence of non-zero integers, first zero
    value terminates the input. The program finds and prints the length of the longest
    sub-sequence of the positive input numbers.


    Example 1:

    Input: `-3 7 -12 4 2 -3 7 12 11 7 -8 0` Output: `4`


    Example 2:

    Input: `-3 -4 8 -5 6 -7 0` Output: `1`


    ## 40. Write a program that reads two positive integers and prints all perfect
    numbers between the two inputs. A number is called perfect if the sum of the proper
    divisors is equal to the number itself. A positive divisor of some number `K`,
    which is different from `K`, is called a proper divisor of `K`. Example: `6` is
    a perfect number. Proper divisors of `6` are `1, 2`, and `3` and their sum is
    `6`. Other perfect numbers, for example, are `28, 496, 8128`.


    ## 41. A positive divisor of some number `K`, which is different from `K`, is
    called a proper divisor of `K`. For example, `1, 2`, and `3` are proper divisors
    of `6`. In number theory, an abundant number is a number that is less than the
    sum of its proper divisors. For example, `12` is an abundant number since it is
    less than `1+2+3+4+6 = 16`. The number `15` is NOT an abundant number since the
    sum of the proper divisors is `1+3+5 = 9`. The number `6` is also NOT an abundant
    number since `1+2+3 = 6`. Write a program that reads one positive integer `N`
    and prints all ODD ABUNDANT numbers between 1 and `N`. If the number `N` is ODD
    and ABUNDANT, the program will print `N` as well.


    Example 1:

    Input: `1000` Output: `945`


    Example 2:

    Input: `2000` Output: `945 1575`


    ## 42. A happy number is defined by the following process. Starting with any positive
    integer, replace the number by the sum of the squares of its digits, and repeat
    the process until the number equals 1 (where it will stay), or it loops endlessly
    in a cycle which does not include 1. Those numbers for which this process ends
    in 1 are happy numbers, while those that do not end in 1 are unhappy numbers (or
    sad numbers). If `n` is not happy, then its sequence does not go to 1. What happens
    instead is that it ends up in a cycle such as: `4, 16, 37, 58, 89, 145, 42, 20,
    4, 16, 37, 58, 89, 145, 42, 20, 4, 16, 37, 58, 89....`


    Write a program that reads one integer and outputs the following: if the number
    is happy, it outputs YES and the number of steps it took to get from the input
    to 1 (including the step that resulted in 1), otherwise, the program outputs NO
    and the number of steps it took to get to the beginning of the cycle (including
    the step that resulted in 4).


    For example if `n = 44`, we get:

    Step 1: `4² + 4²= 32`

    Step 2: `3² + 2²= 13`

    Step 3: `1² + 3²= 10`

    Step 4: `1² + 0² = 1` - terminates the process and the output is: YES, 4


    For example, if `n = 43`, we get:

    Step 1: `4² + 3² = 25`

    Step 2: `2² + 5² = 29`

    Step 3: `2² + 9² = 85`

    Step 4: `8² + 5² = 89`

    Step 5: `8² + 9² = 145`

    Step 6: `1² +4² +5² = 42`

    Step 7: `4² + 2² = 20`

    Step 8: `2² +0² = 4`

    Output NO, 8

