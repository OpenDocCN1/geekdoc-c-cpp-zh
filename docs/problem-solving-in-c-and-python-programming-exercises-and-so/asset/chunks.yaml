    # Chapter 1: Variables, Input/Output, and Arithmetic Operators


    ## I. Theory Overview


    ### 1. Variables

    Variables are placeholders for some values. Programs utilize variables to store
    data. Variables have three attributes: type, name, and value. In addition, each
    variable has a memory address. Memory addresses are used to access the variable
    to perform the following tasks: assign an initial value through input or declaration
    statements, retrieve the current value, and change the value. In most cases, the
    use of memory will be done automatically, but some statements require using specific
    syntax discussed later in this chapter.


    #### Variables in Python

    In Python, initialization is required. The type of the variable will be determined
    automatically based on the assigned value. There are two basic types: numeric
    and strings. Numeric types include integers (`int`) and floating point numbers
    (`float`). A string is a sequence of characters. String literals are enclosed
    in the single or double quotes. A character is not a separate data type but a
    string of exactly one character.


    Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_556d3f69.png](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_556d3f69.png)


    #### Variables in C

    In C, declaration is required prior using the variable and initialization is optional.
    In C, there are four standard signed integer types: `char`, `short`, `int`, and
    `long`; there are three real floating point types: `float`, `double`, and `long
    double`.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_1bb06e7d.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_1bb06e7d.jpg)

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3c83f9.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3c83f9.jpg)


    Declaration Statements Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6446e3a7.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6446e3a7.jpg)


    Declaration and Initialization Statements Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m4529b736.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m4529b736.jpg)


    ### 2. Input/Output


    #### Input in Python

    The `input()` function is used to perform standard input – input from the keyboard.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m4cb0fff0.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m4cb0fff0.jpg)


    #### Output in Python

    The `print()` function is used to perform standard output – output to the screen.
    To print text, single (''''), double ("), or triple ("") quotes could be used.
    Triple quotes allow text to be printed on multiple lines. To print the value of
    the variable, use the name of the variable without any quotes. To format output,
    use the `format()` function.


    ##### Basic Escape Sequences in Python

    The backslash (`\`) character is used to escape characters that otherwise have
    a special meaning in Python.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3bb30a94.png](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3bb30a94.png)


    Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3d016fa1.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3d016fa1.jpg)

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_1ca20b0.png](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_1ca20b0.png)


    Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_56d8fa87.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_56d8fa87.jpg)


    For more information on printing and formatting floating point numbers see: https://docs.python.org/3/tutorial/floatingpoint


    #### Input in C

    The `scanf()` function is used to perform standard input – input from the keyboard.
    For the variable types we have introduced far, the general syntax for `scanf`
    statement is follows:


    ```c

    scanf("list of format specifiers", list of variables);

    ```


    Note:

    1. In the list of variables, each variable preceded by the ampersand sign (`&`)
    denotes the address of the variable in the computer’s memory. For the variable
    types we have introduced far, the ampersand sign is required before each variable
    name in order for `scanf` to be able to store the input. Omitting the ampersand
    sign will not cause a compiler error, but instead can cause a segmentation fault,
    a run-time error which is a program error that occurs while the program is running.
    Run-time errors cause the immediate exit (termination) of the program.

    2. Most C compilers will not check the correspondence between the format specifier
    and the type of the variable. A format type mismatch will not cause a compiler
    error, but instead will result in logic error. Logic errors will not terminate
    the program, but will cause the program to produce the wrong output.

    3. We advise not to include spaces or any other characters and numbers between
    format specifiers to avoid run-time and/ logic errors. Inconsistency between the
    `scanf` format string and the format data will result in run-time and/ logic errors.
    For example, the following:


    ```c

    scanf("%d,%d,%d", &a, &b, &c);

    ```

    requires integers to be separated by commas, otherwise a run-time and/ logic error
    occurs.

    4. For the variable types we have introduced far, the `scanf` format specifiers,
    `%d`, `%f`, `%lf`, and `%Lf`, skip all leading whitespace characters and terminate
    on whitespace characters. In addition, %d terminates on any non-digit character.
    The format specifier, `%c`, does read whitespaces. This fact requires careful
    treatment while reading characters after numeric data.


    ##### Basic `scanf` Formatting Options

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_17e9cdcf.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_17e9cdcf.jpg)


    Examples:

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_8f4504.png](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_8f4504.png)


    #### Reading characters after numeric data

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m17a2539.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m17a2539.jpg)


    In addition, there are several functions that read a single character. In this
    book we will limit our use to the `getchar()` function that reads a character
    from standard input.


    Example:

    ```c

    char c;

    c=getchar();

    ```


    Note: the storage sizes of the variables in C are platform dependent.


    #### Output in C

    The `printf()` function is used to perform standard output – output to the screen.
    To print text, the text must be enclosed in double quotes ("). To print the value
    of a variable, use the corresponding format specifier and the name of the variable
    without any quotes.


    The general syntax for the `printf` statement is as follows:


    ```c

    printf("list of format specifiers", list of variables);

    ```


    Note: Most C compilers will not check the correspondence between format specifier
    and the type of the variable. A format type mismatch will result in logical errors.


    ##### Basic `printf` Formatting Options

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m6ce61650.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m6ce61650.jpg)


    ##### Basic Escape Sequences in C

    The backslash (`\`) character is used to escape characters that otherwise have
    a special meaning in C.


