    ## 问题 14


    许多公司正在使用名为 IVR（交互式语音响应）的自动电话系统。在许多情况下，这些系统会重复客户的选择，并在转接电话之前请求额外确认。编写一个程序为一家提供电视、互联网和电话服务的电缆公司模拟一个简单的系统。菜单选项如下表所示。对于“退出”（Exit）之外的所有主菜单选项，都要包含重复功能。假设所有客户都拥有所有三种服务，每月费用为
    $199.99。此外，假设确认时，''Y'' 表示“已确认”，任何其他字符表示“未确认”。


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_31abe6a8.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_31abe6a8.jpg)


