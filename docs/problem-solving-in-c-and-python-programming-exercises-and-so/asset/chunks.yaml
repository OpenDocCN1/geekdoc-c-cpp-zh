    # 注释


    在 Python 中，注释以哈希字符 `#` 开始，并延伸到物理行的末尾。Python 中的注释可以出现在程序的任何地方。


    在 C 中，注释以斜杠星号 `/*` 开始，以星号斜杠 `*/` 结束，可以出现在程序的任何地方。C 程序中的注释可以跨多行。


    注意：后续版本的 C 支持 `//` 作为注释（`C++` 风格）。在这种情况下，注释以双斜杠 `//` 开始，延伸到物理行的末尾，可以出现在程序的任何地方。


