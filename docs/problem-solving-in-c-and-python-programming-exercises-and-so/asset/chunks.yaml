    #### C 中的变量

    在 C 中，在使用变量之前需要进行声明，初始化是可选的。在 C 中，有四种标准符号整数类型：`char`、`short`、`int` 和 `long`；有三种实浮点类型：`float`、`double`
    和 `long double`。


