    ### C 中的基础数据类型（类型转换）转换

    C 语言允许使用强制转换运算符将一种数据类型转换为另一种数据类型：`(new_data_type)expression`


    **整数提升：** 在 C 中，比 `int` 或 `unsigned int` 小的整数数据类型（例如 `char` 和 `short`）在计算过程中会自动提升为
    `int` 或 `unsigned int`。


