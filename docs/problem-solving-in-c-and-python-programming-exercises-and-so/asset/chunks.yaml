    **Note:**

    1) Parentheses will change the priority order. The expression in the parentheses
    will be evaluated first. See example below: `2–3*2 = 2–6 = -4` compare to `(2-3)*2
    = (-1)*2 = -2`

    2) The power operator `**` binds more tightly than unary operators on its left;
    it binds less tightly than unary operators on its right: in the non-parenthesized
    sequence of power and unary operators the operators are evaluated from right to
    left. See examples: `-1 ** 2 = 1`, `10 ** -2 = 0.01`


