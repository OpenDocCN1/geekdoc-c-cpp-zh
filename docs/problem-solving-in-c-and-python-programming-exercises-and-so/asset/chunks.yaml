    ## 问题 12：编写一个程序，计算某个部门在特定学期每个学生的平均成绩。程序读取该部门的人数、每个学生在该学期修的课程数（人数可能不同）以及每门课程的成绩。程序计算并打印每个学生的平均分。假设输入是有效的。


    ### 讨论


    输入：部门的人数，存储在 `total_size` 中；每个学生的课程数，存储在 `num_courses` 中；每门课程的成绩，存储在 `grade` 中。所有输入均为整数。


    输出：每个学生的平均分，存储在 `final_grade` 中。


    计算：此问题使用嵌套循环。外层循环从 1 到 `total_size`，内层循环从 1 到 `num_courses`。两者都是计数循环。为了计算平均分，必须计算每个学生的成绩和。`sum`
    值在处理下一个学生之前必须重置为零。


    输入限制：`total_size` 必须为正数；`num_courses` 必须为正数；`grade` 必须在 0 到 100 之间。


    输出限制：无


