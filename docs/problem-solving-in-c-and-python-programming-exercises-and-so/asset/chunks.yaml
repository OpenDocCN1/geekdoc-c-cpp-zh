    ### 问题 5：编写一个程序读取一个正整数并打印它的反转数字。例如，如果输入是 2345，输出是 5432。假设输入有效。


    #### 讨论


    输入：正整数，存储在 `num` 中。


    输出：反转后的数字。


    方案 1：逐位打印反转数字。


    方案 2：先计算反转数字，然后将其打印。


    #### 计算：在两种方案中，都使用循环结构，重复提取最后一位数字（`mod 10`）并截断输入数字（整数除以 10），直到其变为零。在方案一中，打印下一个数字。在方案二中，使用相应的
    10 的幂来累加构建反转数字之和。在两种方案中，处理都从最后一位开始。


    这是一种哨兵控制的循环，因为迭代次数预先未知且取决于输入。迭代次数等于输入数字的位数。首选的循环结构是 `while` 循环。


    输入限制：我们假设输入是有效的：正整数。


    输出限制：在 Python 中，为了在方案 1 中在同一行打印数字，请在 `print` 语句中使用 `end`。


