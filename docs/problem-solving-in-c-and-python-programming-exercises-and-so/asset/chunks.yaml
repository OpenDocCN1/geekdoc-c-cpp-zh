    ## III. Practice Exercises


    For practice purposes all programs explicitly state what input/output should be.
    Follow problem guidelines in Chapter 1 to identify input and output as a first
    step.


    1. Write a program that reads one integer. The program checks whether the input
    is divisible by 3.

    2. Write a program that reads two integers and finds the maximum among inputs.

    3. Write a program that reads two integers and checks whether the first input
    is evenly divisible by the second input.

    4. Write a program that reads one integer and finds its absolute value without
    any built-in functions.

    5. Write a program that reads one 3-digit positive integer. The program checks
    whether at least one of the digits equals 3.

    6. Write a program for a cash register that calculates the amount of change the
    customer should receive. The program reads the item price, number of items purchased
    and the amount paid.

    7. Road speed limits are used in most countries to set the maximum (or minimum
    in some cases) speed at which vehicles may legally travel on specific roads. Write
    a program that reads maximum limit, minimum limit and car speed. The program checks
    whether the car is driving within the legal limits.

    8. Write a program that reads one integer and prints the corresponding day of
    the week. Assume that 1 corresponds to Sunday, 2 to Monday, etc., and 7 to Saturday.

    9. Write a program that reads the coordinates of three points on a number line.
    The program finds which point lies between the other two.

    10. Write a program that solves the linear equation `a*x + b = 0`. reads two integers,
    `a` and `b`, coefficients of the linear equation and outputs the solution or a
    message indicating that there are no solutions or infinite number of solutions.

    11. Write a program that reads three positive numbers that are the lengths of
    a possible triangle. The program checks these three numbers can form a valid triangle.

    12. Write a program that reads two integers which are the coordinates of a point
    in the Cartesian plain. The program finds the location of the given point in the
    Cartesian plain: axis or quadrant.

    13. Write a program that reads one 3-digit positive integer. The program checks
    whether the input number is numerical palindrome. A numeral palindrome is a number
    that remains the same when its digits are reversed. For example, the numbers 575
    and 212 are numerical palindromes.

    14. Write a menu program that supports the actions listed in the table. The program
    first reads a character, corresponding to the action, and then asks the user for
    additional input based on the action. Only actions described below are allowed.
    For any other character the program prints an error message.

