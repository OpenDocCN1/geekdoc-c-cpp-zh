    ## 问题 6：两辆车相向行驶。编写一个程序，要求用户输入每辆车的速度（英里/小时）、两车之间的初始距离（英里）以及行驶时间（小时）。程序计算并打印行程结束时两车之间的距离。例如，如果速度分别为
    55 mph 和 45 mph，初始距离为 5.3 英里，行驶时间为 2.5 小时，那么行程结束时两车之间的距离为 244.7 英里。


    ## 讨论


    ### 输入：

    1. 第一辆车的速度，存储在 `speed1` 中，浮点型

    2. 第二辆车的速度，存储在 `speed2` 中，浮点型

    3. 初始距离，存储在 `start_distance` 中，浮点型

    4. 行驶时间，存储在 `time` 中，浮点型


    ### 输出：行程结束时两车之间的距离，存储在 `final_distance` 中，浮点型。


    ### 计算：

    `final_distance = start_distance – time*(speed1+speed2)`


    ### 输入限制：所有输入值必须为正数。


    ### 输出限制：这个问题，汽车可能会相遇并继续向相反方向行驶，在某些情况下上述公式会产生负结果。但最终输出 `final_distance` 必须是正数。使用
    `fabs()` 函数来获取 `final_distance` 的绝对值。


    C 语言中的最终公式：

    ```c

    final_distance = fabs(start_distance – time*(speed1+speed2))

    ```


    Python 中的最终公式：

    ```python

    final_distance=math.fabs(start_distance – time*(speed1+speed2))

    ```


