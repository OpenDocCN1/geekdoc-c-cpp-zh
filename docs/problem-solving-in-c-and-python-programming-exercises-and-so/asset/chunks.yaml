    ### 问题 4：编写一个程序读取一个正整数，并找到其各位数字之和。


    #### 讨论


    输入：正整数，存储在 `num` 中。


    输出：输入数字的各位之和，存储在 `sum` 中，整数类型。


    #### 计算：


    使用循环结构结构重复提取最后一位数字（`mod 10`）并截断输入数字（整数除以 10），直到其变为零。


    这是一种哨兵控制的循环，因为迭代次数预先未知且取决于输入。迭代次数等于输入数字的位数。首选的循环结构是 `while` 循环。


    输入限制：无，如果输入为负数，程序将使用输入的绝对值进行运行。


    输出限制：无。


