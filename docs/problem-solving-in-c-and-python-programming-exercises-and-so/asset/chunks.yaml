    For more information on printing and formatting floating point numbers see: [https://docs.python.org/3/tutorial/floatingpoint.html](https://docs.python.org/3/tutorial/floatingpoint.html)


    Input in C


    The scanf function is used to perform standard input – input from the keyboard.
    For the variable types we have introduced so far, the general syntax for a scanf
    statement is as follows:


    scanf("list of format specifiers", list of variables);


    Note:


    1\. In the list of variables, each variable preceded by the ampersand sign (&)
    which denotes the address of the variable in the computer’s memory. For the variable
    types we have introduced so far, the ampersand sign is required before each variable
    name in order for scanf to be able to store the input value. Omitting the ampersand
    sign will not cause a compiler error, but instead can cause a segmentation fault,
    a run-time error which is a program error that occurs while the program is running.
    Run-time errors cause the immediate exit (termination) of the program.


    2\. Most C compilers will not check the correspondence between the format specifier
    and the type of the variable. A format type mismatch will not cause a compiler
    error, but instead will result in a logic error. Logic errors will not terminate
    the program, but will cause the program to produce the wrong output.


    3\. We advise not to include spaces or any other characters and numbers between
    format specifiers to avoid run-time and/or logic errors. Inconsistency between
    the scanf format string and the format your data is entered will result in run-time
    and/or logic errors. For example, the following statement,


    scanf("%d,%d,%d", &a, &b, &c);


    requires input integers to be separated by commas, otherwise a run-time and/or
    logic error occurs.


    4\. For the variable types we have introduced so far, the scanf format specifiers,
    %d, %f, %lf, and %Lf, skip all leading whitespace characters and terminate on
    whitespace characters. In addition, %d terminates on any non-digit character.
    The format specifier, %c, does read whitespaces. This fact requires careful treatment
    while reading characters after numeric data.


