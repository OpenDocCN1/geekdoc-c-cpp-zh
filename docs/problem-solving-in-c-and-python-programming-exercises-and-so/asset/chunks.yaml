    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_37133a3e.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_37133a3e.jpg)\n\
    \n### iii. Python 中的嵌套循环\n\nPython 支持嵌套循环结构——在一个循环内部另一个循环。嵌套循环的深度取决于问题。任何类型的循环都可以放在另一个循环内部。\n\
    \n### 示例：\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6a543ff3.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6a543ff3.jpg)\n\
    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_28f43479.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_28f43479.jpg)\n\
    \n## 2. C 语言中的循环\n\n#### i. WHILE 循环\n\nC 中的 `while` 循环只要指定的条件为真，就会重复执行一个语句块。\n\
    \n#### 语法：\n\n```c\nwhile(expression){\n    loop body statement(s);\n}\n```\n\n\
    循环体语句(s)的每次重复执行被称为一次迭代。\n\n#### 工作原理：\n\n当 `expression` 为真时，`loop body statements`\
    \ 会重复执行。\n\n#### 注意：\n1. C 中的 `while` 循环工作方式与 Python 中的完全相同；唯一的区别是语法略有不同。\n2.\
    \ `Loop body` 可以由单个语句或多个语句组成。在单个语句的情况下，大括号是可选的。\n3. `Loop expression` 可以是任何具有布尔值的表达式。在\
    \ C 中，所有数字都有布尔值：`0` 具有假布尔值，任何非零数字都具有真布尔值。\n4. 如果 `expression` 永远不为假，则循环是无限循环。\n\
    5. 如果 `expression` 在循环开始时具有假布尔值，则循环立即终止，`loop body statements` 不执行，控制直接传递到下一个语句。\n\
    \n#### 示例：\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c38d1.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c38d1.jpg)\n\
    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_34bd9d.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_34bd9d.jpg)\n\
    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_mf17be3.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_mf17be3.jpg)\n\
    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m54df1074.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m54df1074.jpg)\n\
    \n#### 追踪程序\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_eb3b.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_eb3b.jpg)\n\
    \n#### ii. DO WHILE 循环\n\n`do while` 循环只要指定的条件为真，就会重复执行语句块。`do while` 循环与 `while`\
    \ 循环非常相似，区别在于 `do while` 循环至少执行一次。\n\n#### 语法：\n\n```c\ndo {\n    loop body\n\
    } while(expression);\n```\n\n#### 工作原理：\n\n`loop body` 在 `expression` 为真时重复执行。\n\
    \n#### 示例：\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m0af.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m0af.jpg)\n\
    \n下面的 **do while** 代码要求用户输入的数字在 0 到 100 之间（包含）。使用 `do while` 循环可以确保输入是有效的。![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_f6ba.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_f6ba.jpg)\n\
    \n#### iii. FOR 循环\n\nC 中的 `for` 循环只要指定的条件为真，就会重复执行语句块。`for` 循环与 `while` 循环逻辑相似，但语法不同。\n\
    \n#### 语法：\n\n```c\nfor(initialization; expression; loop value update){\n    loop\
    \ body\n}\n```\n\n#### 工作原理：\n\n1. `initialization` 语句在循环开始前执行一次。\n2. `expression`\
    \ 被求值。如果它为真，则执行 `loop body`，然后跳转到 `loop value update` 语句。\n3. `loop body` 和 `loop\
    \ value update` 语句在 `expression` 为真时重复执行。\n4. 当 `expression` 变为假，循环结束并跳转到下一个语句。\n\
    \n"
- fmt: "\nb. Loop expression can be any expression that has a Boolean value. *Remember:*\
    \ in C, all numbers have Boolean value: `0` has a False Boolean value and any\
    \ non-zero number has a True Boolean value. The `char` type is considered as an\
    \ 8-bit integer: the corresponding ASCII value of the character. If the ASCII\
    \ value is `0`, then the Boolean value is False, otherwise, the Boolean value\
    \ is True.\n\nc. If expression is never False the loop is infinite loop.\n\nd.\
    \ If expression has a False Boolean value at the beginning of the loop execution,\
    \ the loop terminates immediately and loop body statements are not executed at\
    \ all and control passes to the next statement in the program.\n\ne. Loops `while`\
    \ and `for` are always interchangeable:\n\n```c\nfor(initialization; expression;\
    \ loop value update){\n    loop body statement(s);\n}\n```\n\nEquivalent to:\n\
    \n```c\ninitialization;\n\nwhile(expression){\n    loop body statement(s);\n \
    \   loop value update;\n}\n```\n\n**Example:** write a code fragment that evaluates\
    \ `2^(10)` using `while` loop and `for` loop.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m38a3da6f.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m38a3da6f.jpg)\n\
    \n## Sentinel and Counter Controlled Repetitions\n\nAll loops may be classified\
    \ into two general categories: counter controlled and sentinel controlled repetitions.\
    \ The logical structure of the problem determines which type of loop will be implemented.\
    \ Loops `while`, `do while`, and `for` could be counter controlled repetitions.\n\
    \nIn the **counter controlled** loop, the number of iterations is known in advance,\
    \ before execution of the loop. In this case, the loop is controlled by the counter\
    \ variable, the expression checks whether counter variable has reached a certain\
    \ predetermined value, and the update statement increments or decrements the counter\
    \ variable.\n\nExamples:\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7b0e5347.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7b0e5347.jpg)\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_21f2bcff.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_21f2bcff.jpg)\n\
    \nIn the **sentinel controlled** loop, the number of iterations is unknown in\
    \ advance. In this case, the loop is controlled by the sentinel value, a special\
    \ value that is used to terminate the loop execution.\n\nExamples:\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m10462e63.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m10462e63.jpg)\n\
    \nIt is advisable to use `for` loop in the case of counter controlled repetition\
    \ and `while` loop in the case of sentinel controlled repetition.\n\n## iv. Nested\
    \ Loops in C\n\nC supports the nested loop structure – a loop inside another loop.\
    \ The depth of the nested loop depends on the problem. Any type of loop can be\
    \ placed inside another loop.\n\nExamples:\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_30fe60be.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_30fe60be.jpg)\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7beca6df.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7beca6df.jpg)\n\
    \n## v. Break Statement in C\n\nThere are cases that require the termination of\
    \ loop execution immediately without checking the expression and regardless of\
    \ the expression value. To implement this logic behavior, C supports the `break`\
    \ statement, which can be used with all three types of loops in C: `while`, `do\
    \ while`, and `for`. It is also possible to use a `break` statement in nested\
    \ loops.\n\nSyntax:\n\n```c\nbreak;\n```\n\nHow it works:\n\n1. The `break` statement\
    \ terminates the loop immediately when it is encountered, and the program control\
    \ resumes at the next statement following the loop.\n2. In case of nested loops,\
    \ the `break` statement terminates execution of the nearest enclosing loop and\
    \ passes control to the outer loop. In the case of a nested loop, the `break`\
    \ statement does not terminate the entire nested loop, but terminates only the\
    \ loop with the `break` statement in it.\n\nNote: It is advisable not use `break`\
    \ statement, but instead, to achieve the same logic using flag variables.\n\n\
    Examples:\n\n1. Write a code fragment that finds the average grade for graduating.\
    \ Assuming the student took 10 courses, the code fragment reads the grade for\
    \ each course, and finds the final average. In order for the student to graduate,\
    \ all grades must be passing grades (equal or above 60). If at least one grade\
    \ is below 60, the student cannot graduate and the average grade will not be calculated.\
    \ In this case, the corresponding message is printed. Below, the `while` loop\
    \ and `for` loop implementations using `break` statement. The loop is terminated\
    \ in case of a failing grade and `sum` is reset to `0`. The control passes to\
    \ the next statement after the loop that checks whether `sum` equals zero or not,\
    \ and prints an appropriate result.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_14dbd8b.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_14dbd8b.jpg)\n\
    \nTo compare, see below `while` and `for` loop implementations using `flag` variable.\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1f79df.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1f79df.jpg)\n\
    \n## II. Sample Solutions in Python and C\n\n**Problem 1:** Write a program that\
    \ prints all integers divisible by 7 between 1 and 100.\n\nDiscussion\n\nInput:\
    \ none\nOutput: the sequence of integers divisible by 7 between 1 and 100\nCalculations:\
    \ Using a loop structure, for each number between 1 and 100, check whether it\
    \ is divisible by 7 using `mod` operator. This is a counter controlled repetition\
    \ since the number of iterations (100) is known in advance, since we need to check\
    \ all numbers between 1 and 100. The preferable loop structure is `for` loop.\n\
    Input Limitations: none\nOutput Limitations: none\nConstant Variables: in this\
    \ problem there are constant values defined in the problem description: 1, the\
    \ lower limit, and 100, the upper limit. To define constant values in C, we will\
    \ continue to use `const` keyword.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7b4a62f.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_7b4a62f.jpg)\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m6748d2.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m6748d2.jpg)\n\
    \n**Problem 2:** Write a program that counts the number of integers divisible\
    \ by 7 between two input integers.\n\nDiscussion\n\nInput: two integers, stored\
    \ in `limit1` and `limit2`\nOutput: the number of integers divisible by 7 between\
    \ `limit1` and `limit2`, stored in `counter`.\nCalculations: Using a loop structure,\
    \ for each number between `limit1` and `limit2`, check whether it is divisible\
    \ by 7 using `mod` operator, and update the `counter`. Pay attention: in case\
    \ `limit1 > limit2`, swap the values. This is a counter controlled repetition.\
    \ Since we need to check all numbers between `limit1` and `limit2`, the number\
    \ of iterations is known in advance and is equals to `abs(limit1 - limit2) + 1`\
    \ (`abs` means absolute value). The preferable loop structure is the `for` loop.\n\
    Input Limitations: none\nOutput Limitations: in case there are no numbers divisible\
    \ by 7 in the specified range, program prints an appropriate message.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d9a5e1.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d9a5e1.jpg)\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m59fd884.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m59fd884.jpg)\n\
    \n**Problem 3:** Write a program that reads a sequence of integers; -1 terminates\
    \ the input sequence. The program counts and prints the number of inputs in the\
    \ sequence. The terminator, -1, is not counted. For example, if the input is -3\
    \ 4 -10 6 7 -1, the output is 5, and if the input is -1, the output is 0.\n\n\
    Discussion\n\nInput: sequence of integers, current input number is stored in `num`\n\
    Output: the number of inputs not including terminator -1.\n\nCalculations: Using\
    \ a loop structure, repeat input integers until -1 is entered.\n"
