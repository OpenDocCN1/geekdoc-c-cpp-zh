  trans: "\n\n# 第 2 章：决策结构\n\n## I. 理论概述\n\n### 1. Python 和 C 中的关系运算符\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d887b7c.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d887b7c.jpg)\n\
    \n在 Python 中，关系运算符也称为比较运算符，[`docs.python.org/3/library/stdtypes.html#comparisons`](https://docs.python.org/3/library/stdtypes.html#comparisons)。\n\
    \n### 2. 布尔表达式\n\n布尔表达式是一个求值为布尔值 `True` 或 `False`）的表达式。\n\n在 Python 中，`True` 和\
    \ `False` 是内置常量，[`docs.python.org/3.1/library/constants.html`](https://docs.python.org/3.1/library/constants.html)。\n\
    \n在 Python 中，任何对象都有布尔值。对于我们目前为止介绍的数据类型，以下对象的值为 `False`：任何数值类型的零，例如 `0`、`0.0`；布尔内置常量\
    \ `False`；以及空字符串 `\"\"` 或 `''`。（([`docs.python.org/3/library/stdtypes.html#truth-value-testing`](https://docs.python.org/3/library/stdtypes.html#truth-value-testing))\n\
    \n在 C 中，每个数字都有一个布尔值：`0` 具有 `False` 布尔值，任何非零数字具有 `True` 布尔值。`char` 类型被视为一个 8 位整数，即字符对应的\
    \ ASCII 值。如果 ASCII 值为 `0`，则布尔值为 `False`，否则布尔值为 `True`。\n\n### 3. 逻辑（布尔）运算符与布尔逻辑\n\
    \n数学符号\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50a3a76c.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50a3a76c.jpg)\n\
    \n编程符号 – 按优先级升序排列的逻辑（布尔）运算符\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3af5f3d0.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3af5f3d0.jpg)\n\
    \n### 4. IF 语句\n\n在 Python 编程语言中：\n\n```python\nif (expression):\n    if_statements\n\
    ```\n\n在 C 编程语言中：\n\n```c\nif(expression){\n    if_statements;\n}\n```\n\n工作原理：\n\
    1. 求值 `expression`。\n2. 如果 `expression` 为 `TRUE`，则执行 `if_statements`；否则，当 `expression`\
    \ 为 `FALSE` 时，跳过 `if_statements`并将控制转移到 `if` 块之后的下一个语句。\n\nPython 示例\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m5c241143.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m5c241143.jpg)\n\
    \nC 示例\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_16f6ace1.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_16f6ace1.jpg)\n\
    \n### 5. IF ELSE 语句\n\n在 Python 编程语言中：\n\n```python\nif(expression):\n    if_statements\n\
    else:\n    else_statements\n```\n\n在 C 编程语言中：\n\n```c\nif(expression){\n    if_statements;\n\
    }\nelse{\n    else_statements;\n}\n```\n\n工作原理：\n1. 求值 `expression`。\n2. 如果 `expression`\
    \ 为 `TRUE`，则执行 `if_statements`并将控制转移到 if else 块之后的下一个语句。\n3. 否则，如果 `expression`\
    \ 为 `FALSE`，则执行 `else_statements`并将控制转移到 if else 块之后的下一个语句。\n\nPython 示例\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3fd8c4d3.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3fd8c4d3.jpg)\n\
    \nC 示例\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m391bda2.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m391bda2.jpg)\n\
    \n### 6. Python 中的 IF ELIF ELSE 语句和 C 中的 IF ELSE IF 语句\n\nPython 中的 IF ELIF 语句\n\
    \n```python\nif(expression_1):\n    statements_1\nelif(expression_2):\n    statements_2\n\
    elif(expression_3):\n    statements_3...\nelse:\n    else_statements\n```\n\n\
    C 中的 IF ELSE IF 语句：\n\n```c\nif(expression_1){\n    statements_1;\n}\nelse if(expression_2){\n\
    \    statements_2;\n}\nelse if(expression_3){\n    statements_3\n/* 可以有多个 else\
    \ if 语句 */\nelse{\n    else_statements;\n}\n```\n\n工作原理：\n1. 从 `expression_1`\
    \ 开始逐一求值 `expressions`。\n2. 当程序遇到某个 `expression` 为 `TRUE` 时，执行对应的 `statements`，跳过其他语句并将控制转移到\
    \ if else if 块之后的下一个语句。\n3. 如果没有 `expression` 为 `TRUE`，则执行 `else_statements`并将控制转移到\
    \ if else if 块之后的下一个语句。\n\n示例：![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_277df098.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_277df098.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6adda4.png](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6adda4.png)\n\
    \n**注意**，在 C 语言中，当 `if`、`else` 或 `else if` 体内只有一个语句时，大括号是可选的。如果有多个语句则需要大括号。见下文：![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1e816f.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1e816f.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5608d00.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5608d00.jpg)\n\
    \n### 7. 嵌套决策结构\n\nC 和 Python 两种编程语言都支持嵌套决策结构——放置在决策语句中的决策语句。\n\nPython 示例 ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_4e7b7251.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_4e7b7251.jpg)\n\
    \nC 示例 ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3268dc4.jpg](img/tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3268dc4.jpg)\n\
    \n### 8. C 中的 SWITCH 语句（Python 没有 SWITCH 语句）\n\n```c\nswitch(expression){\n  \
    \  case case_constant:\n        case_statements;\n        break; /* 可选 */\n  \
    \  case case_constant:\n        case_statements;\n        break; /* 可选 */\n  \
    \  …\n    /* 可以有任意数量的 case 语句 */\n    default: /* 可选 */\n        default_statements;\n\
    \        break; /* 可选 */\n}\n```\n\n注意：\na. `switch` 语句中的 `expression` 必须返回整数值（`int`\
    \ 或 `char` 变量）。\nb. Case 常数（`case_constant`）必须与 `switch expression` 的类型相同。\n\n\
    工作原理：\n1. 求值 `switch expression`。\n2. 将值从上到下与 `case_constants` 进行比较。\n3. 当找到匹配\
    \ `switch expression` 的 `case_constant` 时，执行对应的 `case_statements`。由于 `break` 语句是可选的，通常情况下程序可以穿透\
    \ case 并执行多个 case 的语句，直到遇到 `break` 语句或到达 switch 语句的结束。\n4. 如果没有 `case_constants`\
    \ 匹配 `switch expression`，则执行 `default` 分支 `default_statements`（如果 `default` 分支存在）。\n\
    \n\n## II. Python 和 C 示例解决方案\n\n**问题 1:** 编写一个程序读取一个整数并检查输入是偶数还是奇数。程序打印适当的消息。\n\
    \n讨论\n\n输入：存储在 `num` 中的一个整数。\n\n输出：指示输入是偶数还是奇数的消息。\n\n计算：偶数是能被 2 整除的数，这意味着如果 `num`\
    \ 是偶数，`num%2` 为 0。使用 `if-else` 语句判断 `num % 2` 是否等于 0。\n\n输入限制：输入数字为整数。\n\n输出限制：无。\n\
    \n"
