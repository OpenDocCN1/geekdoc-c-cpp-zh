    ii. DO WHILE loop


    A do while loop in C repeatedly executes a block of statements as long as a specified
    condition is true. A do while loop is very similar to while loop with one difference:
    the do while condition is evaluated after executing the block of statements, resulting
    in at least one execution of the loop body statements.


    Syntax:


    do{


    loop body statement(s);


    } while(expression);


    How it works:


    loop body statements are executed repeatedly while expression is TRUE. The expression
    is evaluated after loop body statements are executed, thus do while loop executes
    loop body statements at least once.


    Examples below compare do while and while loops.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50afdfec.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50afdfec.jpg)


    **Example** below shows the code fragment that asks the user to enter valid grade,
    which must be an integer between 0 and 100, inclusive. Loops are used to agrantee
    input is valid. In this example, it is preferable to use do while loop to design
    shorter code.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6fba68ac.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6fba68ac.jpg)


    iii. FOR loop


    A for loop in C repeatedly executes a block of statements as long as a specified
    condition is true. A for loop has different syntax, but conceptually, it is similar
    to the while loop: the condition in a for loop is evaluated before executing the
    block of statements, and in the case of a False condition at the beginning of
    the loop execution, the for loop terminates immediately and loop body statements
    are not executed at all and control passes to the next statement in the program.


    Syntax:


    for(initialization; expression; loop value update){


    loop body statement(s);


    }


    How it works:


    1\. The initialization statement is executed. This statement is executed only
    one time: at the beginning of the loop execution, before the first iteration of
    the loop.


    2\. The expression is evaluated. If it is True, the loop body statement(s) are
    executed, and the flow of control jumps to the loop value update statement.


    3\. loop body statements and loop value update statement are executed repeatedly
    while expression is TRUE.


    4\. When expression become False the loop terminates and the flow of control jumps
    to the next statement after the loop. The expression is only checked at the beginning
    of each iteration.


    Examples:


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_650ed719.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_650ed719.jpg)


