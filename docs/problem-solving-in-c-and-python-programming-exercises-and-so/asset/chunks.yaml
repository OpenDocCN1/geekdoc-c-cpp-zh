    value terminates the input. The program outputs True if the input sequence is
    a monotonic increasing sequence, and False, otherwise. A sequence (`a[n]`) is
    monotonic increasing if `a[n+1] ≥ a[n]` for all `n`.


    Example 1:

    Input: `-2 4 4 10 0` Output: `True`


    Example 2:

    Input: `-2 -3 -5 0`

    Output: `False`


    Example 3:

    Input: `1 3 5 2 4 6 -1 2 0` Output: `False`


    Example 4:

    Input: `4 4 4 0` Output: `True`


