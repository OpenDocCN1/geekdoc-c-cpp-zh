    value terminates the input. The program outputs True, if all inputs are positive
    integers, and False, otherwise.


    ## 31. Write a program that first reads two integers, `a` and `b`, and then a
    sequence of non-zero integers. First zero value terminates the input. The program
    outputs True if all input numbers lay between `a` and `b`, and False, otherwise.
    You may assume `a < b`.


    ## 32. Write a program that first reads two integers, `a` and `b`, and then a
    sequence of non-zero integers. First zero value terminates the input. The program
    prints all input numbers that lay between `a` and `b`. You may assume `a < b`.


