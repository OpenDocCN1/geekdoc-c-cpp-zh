    1. 地整（整数）除法和模运算符通过以下等式联系：`x = (x//y)*y + (x%y)`。该等式适用于所有数字，正负均。


    2. 模运算符始终产生与其第二个操作数符号相同的的结果（或为零）。


    3. 对于 `x < 0` 且 `y > 0`，可以使用以下公式：`x%y = y – abs(x)%y`，其中 `abs(x)` 是 `x` 的绝对值。

    另见：[http://python-history.blogspot.com/2010/08/why-pythons-integer-division-floors.html]


    4. 参数可以是浮点数，但这部分内容不在本书范围内。

    示例：

    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_61a7edc.jpg]


    # VIII. 第一章附录 4：C 中的模运算符——负数


    1. 除法和模运算符通过以下等式联系：`x = (x/y)*y + (x%y)`。该等式适用于所有数字，正负均。记住，整数除法产生截断后的整数：对于正结果，它是除法的下整；对于负结果，它是除法的上整。


    2. 对于 `x < 0` 且 `y > 0`：`x%y = -(abs(x)%y`，其中 `abs(x)` 是 `x` 的绝对值。


    3. 对于 `x > 0` 且 `y < 0`：`x%y = x%abs(y)`，其中 `abs(y)` 是 `y` 的绝对值。


