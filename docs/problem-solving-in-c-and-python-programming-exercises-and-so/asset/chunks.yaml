  raw: 'A for loop in Python iterates over the items of any sequence in the order
    that they appear in the sequence, executing a block of statements until the iteration
    sequence is exhausted. The range()function can be used to iterate over a sequence
    of numbers.


    The range(n) function generates the sequence 0, 1, … ,n-1. The given endpoint,
    n, is never part of the generated sequence. It is possible to let the range start
    at another number, or to specify a different increment (‘step’). The general form
    is range(start, end, step).


    [https://docs.python.org/3/tutorial/controlflow.html#for-statements](https://docs.python.org/3/tutorial/controlflow.html#for-statements)


    [https://docs.python.org/3/tutorial/controlflow.html#the-range-function](https://docs.python.org/3/tutorial/controlflow.html#the-range-function)


