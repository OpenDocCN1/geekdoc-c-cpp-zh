    Chapter 3: Loops


    I. Theory Overview


    Loops are control flow programming statements that allow a pogram to repeat the
    execution of a block of code multiple times. C supports three types of loops:
    while, for, and do-while. Python supports two types of loops: while and for. Both
    programming languages support nested loop: a loop inside another loop.


    1\. Loops in Python


    i. WHILE **loop**


    A while loop in Python repeatedly executes a block of statements as long as a
    specified condition is true.


    Syntax:


    while(expression):


    loop body statement(s)


    Each repetitive execution of the loop body statement(s) is called an iteration.


    How it works:


    loop body statements are executed repeatedly while expression is True.


    Note:


    1\. Loop body can consist of a single statement or multiple statements.


    2\. Loop expression can be any expression that has a Boolean value. *Remember:*
    in Python, all numbers have Boolean value: 0 has a False Boolean value and any
    non-zero number has a True Boolean value.


    3\. Loop expression is checked at the start of each iteration.


    4\. If expression is never False, the loop is an infinite loop.


    5\. If expression has a False Boolean value at the beginning of the loop execution,
    the loop terminates immediately and loop body statements are not executed at all
    and control passes to the next statement in the program.


