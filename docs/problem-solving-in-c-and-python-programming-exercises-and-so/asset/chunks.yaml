    2\. Loops in C


    i. WHILE loop


    A while loop in C repeatedly executes a block of statements as long as a specified
    condition is true.


    Syntax:


    while(expression){


    loop body statement(s);


    }


    Each repetitive execution of the loop body statement(s) is called an iteration.


    How it works:


    loop body statements are executed repeatedly while expression is True.


    Note:


    1\. while loop in C works exactly the same as in Python; the only difference is
    slightly different syntax.


    2\. Loop body can consist of a single statement or multiple statements. In case
    of a single statement, the curly braces are optional.


    3\. Loop expression could be any expression that has Boolean value. *Remember:*
    in C, all numbers have Boolean value: 0 has a False Boolean value and any non-zero
    number has a True Boolean value.


    4 If expression is never False, the loop is an infinite loop.


    5\. If expression has a False Boolean value at the beginning of the loop execution,
    the loop terminates immediately and loop body statements are not executed at all
    and control passes to the next statement in the program.


    Examples:


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c380d1.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c380d1.jpg)


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_34bd8d9d.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_34bd8d9d.jpg)


