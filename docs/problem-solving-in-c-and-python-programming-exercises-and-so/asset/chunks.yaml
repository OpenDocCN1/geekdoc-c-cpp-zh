    `firstNum/secondNum` (整数除)

    `firstNum%secondNum` (余)


    要在 C 中找到商，必须将其中一个数字转换为 `float` 或 `double`。

    `(double)firstNum/secondNum` (商)


    输入限制：为了避免除以零，`secondNum` 不能为 0。

    输出限制：无。


