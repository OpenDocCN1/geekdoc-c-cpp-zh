    \n### Problem 2: A dairy farm ships milk bottles using containers of a specific\
    \ size. Each container holds a certain number of milk bottles. Write a program\
    \ that reads the number of milk bottles to ship and the capacity of one container.\
    \ The program calculates and prints the number of containers fully packed with\
    \ milk bottles and the number of remaining milk bottles. For example, if the farm\
    \ needs to ship 118 milk bottles and the capacity of one container is 24 bottles,\
    \ then 4 containers will be fully packed and 22 bottles of milk will be leftover.\n\
    \n#### Discussion\n- **Input**:\n    1. the number of milk bottles to ship, stored\
    \ in `countMilk`, integer\n    2. the capacity of a container - the number of\
    \ milk bottles that fits into one container, `perBox`\n- **Output**:\n    1. the\
    \ number of containers fully packed, stored in `countBoxes`, integer\n    2. the\
    \ number of remaining milk bottles, stored in `remain`, integer\n\n#### Calculations\n\
    - `countBoxes = countMilk / perBox` (in C)\n- `remain = countMilk % perBox` (in\
    \ Python)\n\n- **Input Limitations**: `countMilk` and `perBox` must be positive.\n\
    - **Output Limitations**: none.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m20f7808.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m20f7808.jpg)\n\
    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_me63e7ff.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_me63e7ff.jpg)\n\
    \n### Problem 3: Write a program that reads the initial amount, interest rate\
    \ (as a percent), and the term. The program calculates and prints the monthly\
    \ payment. For example, if the initial amount is 500, interest is 5%, and term\
    \ is 2 years.\n\n#### Discussion\n- **Input**:\n    1. initial amount, stored\
    \ in `loan`, floating point\n    2. interest rate, stored in `interest`, floating\
    \ point\n    3. term, stored in `term`, integer\n- **Output**: monthly payment,\
    \ stored in `own`, floating point.\n\n#### Calculations\n- `total = loan + (loan\
    \ * interest / 100 * term)`\n- `own = total / (term * 12)`\n\n- **Input Limitations**:\
    \ `loan` and `interest` must be positive.\n- **Output Limitations**: none.\n\n\
    ### Problem 4: Write a program that reads the number of hours a person works per\
