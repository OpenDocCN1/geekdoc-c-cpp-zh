    在许多程序中，你可能会遇到同一个数字或字符在程序中反复使用的情况。在这种情况下，建议声明常量变量来存储这些重复的数字或字符。这允许快速方便地访问常量变量的值。如果我们需要更新代码并修改常量变量的初始值，只需要在声明或
