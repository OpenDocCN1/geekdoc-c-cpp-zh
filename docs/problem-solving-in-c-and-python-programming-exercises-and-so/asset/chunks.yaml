    **Problem 6:** Two cars travel toward each other. Write a program that asks the
    user to enter the speed of each car in miles per hour, the starting distance between
    the cars, in miles, and the travel time, in hours. The program calculates and
    prints the distance between the cars at the end of the trip. For example, if the
    speeds are 55 mph and 45 mph, the starting distance is 5.3 miles, and the travel
    time is 2.5 hours, then the distance between cars at the end of the trip is 244.7
    miles.


    Discussion


    Input:


    1\. speed of the first car, stored in *speed1*, floating point


    2\. speed of the second car, stored in *speed2*, floating point


    3\. starting distance, stored in *start_distance*, floating point


    4\. travel time, stored in *time*, floating point


    Output: the distance between cars at the end of the trip, stored in final_distance,
    floating point.


    Calculations:


    final_distance = start_distance – time*(speed1+speed2)


    Input Limitations: all input values must be positive.


    Output Limitations: in this problem, cars can meet and then continue travel in
    opposite directions, and in some cases the formula above will produce a negative
    result. But the final output, final_distance, must be positive. The fabs()function
    is used to find the absolute value of the final_distance.


    The final formula in C:


    final_distance = fabs(start_distance – time*(speed1+speed2))


    The final formula in Python:


    final_distance=math.fabs(start_distance – time*(speed1+speed2))


