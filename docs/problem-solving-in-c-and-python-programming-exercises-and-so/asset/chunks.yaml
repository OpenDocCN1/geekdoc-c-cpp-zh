- fmt: "\n# Chapter 2: Decision Structures\n\n## I. Theory Overview\n\n### 1. Relational\
    \ Operators in Python and C\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d887b7c.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_5d887b7c.jpg)\n\
    \nIn Python, relational operators are also called comparisons, [https://docs.python.org/3/library/stdtypes.html#comparisons](https://docs.python.org/3/library/stdtypes.html#comparisons).\n\
    \n### 2. Boolean Expression\n\nA Boolean Expression is an expression that evaluates\
    \ to the Boolean value, `True` or `False`.\n\nIn Python, `True` and `False` are\
    \ built-in constants, [https://docs.python.org/3.1/library/constants.html](https://docs.python.org/3.1/library/constants.html).\n\
    \nIn Python, any object has a Boolean value. For the data types we have introduced\
    \ so far, the following objects have the value `False`: zero of any numeric type,\
    \ for example, `0`, `0.0`; Boolean built-in constant `False`; and an empty string\
    \ `\"\"` or `''`. ([https://docs.python.org/3/library/stdtypes.html#truth-value-testing](https://docs.python.org/3/library/stdtypes.html#truth-value-testing))\n\
    \nIn C, each number has a Boolean value: `0` has a `False` Boolean value and any\
    \ non-zero number has a `True` Boolean value. The `char` type is considered an\
    \ 8-bit integer, which is the corresponding ASCII value of the character. If the\
    \ ASCII value is `0`, then the Boolean value is `False`, otherwise, the Boolean\
    \ value is `True`.\n\n### 3. Logical (Boolean) Operators and Boolean Logic\n\n\
    Mathematical Notation\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50a3a76c.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m50a3a76c.jpg)\n\
    \nProgramming Notation – Logical (Boolean) Operators Ordered by Ascending Priority\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3af5f3d0.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3af5f3d0.jpg)\n\
    \n### 4. IF Statement\n\nIn Python Programming language:\n\n```python\nif (expression):\n\
    \    if_statements\n```\n\nIn C Programming Language:\n\n```c\nif(expression){\n\
    \    if_statements;\n}\n```\n\nHow it works:\n1. The `expression` is evaluated.\n\
    2. If the `expression` is `TRUE` the `if_statements` are executed; otherwise,\
    \ when `expression` is `FALSE`, the `if_statements` are skipped and control is\
    \ transferred to the next statement after the `if` block.\n\nExamples in Python\n\
    \n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m5c241143.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m5c241143.jpg)\n\
    \nExamples in C\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_16f6ace1.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_16f6ace1.jpg)\n\
    \n### 5. IF ELSE Statement\n\nIn Python Programming Language:\n\n```python\nif(expression):\n\
    \    if_statements\nelse:\n    else_statements\n```\n\nIn C Programming Language:\n\
    \n```c\nif(expression){\n    if_statements;\n}\nelse{\n    else_statements;\n\
    }\n```\n\nHow it works:\n1. The `expression` is evaluated.\n2. If the `expression`\
    \ is `TRUE`, `if_statements` are executed and control is transferred to the next\
    \ statement after if else block.\n3. Otherwise, if the `expression` is `FALSE`,\
    \ `else_statements` are executed and control is transferred to the next statement\
    \ after the if else block.\n\nExamples in Python\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3fd8c4d3.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3fd8c4d3.jpg)\n\
    \nExamples in C\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m391bda2.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m391bda2.jpg)\n\
    \n### 6. IF ELIF ELSE Statement in Python and IF ELSE IF in C\n\nIF ELIF Statement\
    \ in Python\n\n```python\nif(expression_1):\n    statements_1\nelif(expression_2):\n\
    \    statements_2\nelif(expression_3):\n    statements_3...\nelse:\n    else_statements\n\
    ```\n\nIF ELSE IF Statement in C:\n\n```c\nif(expression_1){\n    statements_1;\n\
    }\nelse if(expression_2){\n    statements_2;\n}\nelse if(expression_3){\n    statements_3...\n\
    /* could be several else if statements */\nelse{\n    else_statements;\n}\n```\n\
    \nHow it works:\n1. The `expressions` are evaluated one by one from top to bottom\
    \ starting from `expression_1`.\n2. When the program reaches an `expression` evaluating\
    \ to `TRUE` the corresponding `statements` are executed, the other statements\
    \ are skipped, and control is transferred to the next statement after if else-if\
    \ (if elif else) block.\n3. If none of the `expressions` evaluates to `TRUE`,\
    \ then the `else_statements` are executed and control is transferred to the next\
    \ statement after if else-if (if elif else) block.\n\nExample: ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_277df098.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_277df098.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6add6a4.png](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6add6a4.png)\n\
    \n**Note**, in the C programming language, the curly braces are optional when\
    \ there is a single statement inside `if`, `else`, or `else if` body. The curly\
    \ braces are required in case of multiple statements. See examples below: ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1e8161f.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m1e8161f.jpg)\
    \ ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_56081d00.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_56081d00.jpg)\n\
    \n### 7. Nested Decision Structures\n\nBoth programming languages, C and Python,\
    \ support nested decision structure - decision statements placed inside decision\
    \ statement.\n\nExamples in Python ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_4e7b7251.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_4e7b7251.jpg)\n\
    \nExamples in C ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3268dc4.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m3268dc4.jpg)\n\
    \n### 8. SWITCH Statement in C (there is no SWITCH statement in Python)\n\n```c\n\
    switch(expression){\n    case case_constant:\n        case_statements;\n     \
    \   break; /* optional */\n    case case_constant:\n        case_statements;\n\
    \        break; /* optional */\n    …\n    /* could be any number of case statements\
    \ */\n    default: /* optional */\n        default_statements;\n        break;\
    \ /* optional */\n}\n```\n\nNote:\na. The `expression` in the `switch` statement\
    \ must return an integral value (`int` or `char` variable).\nb. Case constants\
    \ (`case_constant`) must be of the same type as the `switch expression`.\n\nHow\
    \ it works:\n1. The `switch expression` is evaluated.\n2. The value is compared\
    \ to `case_constants` top to bottom.\n3. When a `case_constant` that matches the\
    \ switch expression is found, the corresponding `case_statements` are executed.\
    \ Since the `break` statement is optional, in general, the program can fall through\
    \ the cases and execute statements from multiple cases, until a `break` statement\
    \ or the end of the switch statement is reached.\n4. If none of the `case_constants`\
    \ match the switch expression, the `default_statements` from the `default` case\
    \ are executed, if `default` case exists; otherwise, the control passes to the\
    \ next statement after the switch block.\n\nExample: ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m44ef4d2.jpg)\n\
    \n## II. Sample Solutions in Python and C\n\n**Problem 1:** Write a program that\
    \ reads one integer and checks whether the input is even or odd. The program prints\
    \ an appropriate message.\n\nDiscussion\n\nInput: one integer stored in `num`.\n\
    \nOutput: a message indicating whether the input is even or odd.\n\nCalculations:\
    \ an even number is a number that is evenly divisible by 2, meaning that `num%2`\
    \ is 0 if `num` is even. Use an `if-else` statement to determine whether `num\
    \ % 2` is 0 or not.\n\nInput Limitations: input number is integer.\n\nOutput Limitations:\
    \ None.\n\n"
