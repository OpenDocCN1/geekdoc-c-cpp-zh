    ### 问题 8


    在公历中，如果一个年份代表的数字能被 4 整除但不能被 100 整除，除非它能被 400 整除，否则就是闰年。因此，1996、1992、1988 等年份是闰年，因为它们能被
    4 整除但不能被 100 整除。对于世纪年份，400 规则至关重要。因此，世纪年份 1900、1800 和 1700 虽然都能被 4 整除，也能被 100
    整除。由于它们不能进一步被 400 整除，所以它们不是闰年。另一方面，2000 年是闰年，因为它能被 4 和 100 整除，也能被 400 整除。此外，你可以假设
    1582 年之前没有闰年。编写一个程序，要求用户输入年份，并计算该年份是否为闰年。


    #### 示例：

    - 输入：1980 输出：Leap Year（闰年）

    - 输入：1900 输出：Not a Leap Year（不是闰年）

    - 输入：1200 输出：Not a Leap Year（不是闰年）

    - 输入：2000 输出：Leap Year（闰年）

    - 输入：3000 输出：Not a Leap Year（不是闰年）


    #### 讨论

    **输入**：存储在 `year` 中的一个整数。

    **输出**：指示输入是否为闰年的消息。

    **计算**：使用 `if-else-if-else` 语句检查以下条件：

    1. 1582 年之前的年份不是闰年。

    2. 对于 1582 年及以上的年份，能被 4 整除且不能被 100 整除的年份是闰年，能被 400 整除的年份也是闰年，否则该年份不是闰年。


    **输入限制**：`year` 必须是非负数，程序中应使用 `if-else` 语句检查此限制。

    **输出限制**：无。


