    Note:


    The initialization, expression, and loop value update statements are optional
    and could be omitted, but the separating semi-colon (;) is required even if the
    statement is omitted. C supports multiple statements in the initialization and
    update part of the loop. In this case the statements must be separated by comas.
    The for loop can also have empty loop body statements (see examples below).


