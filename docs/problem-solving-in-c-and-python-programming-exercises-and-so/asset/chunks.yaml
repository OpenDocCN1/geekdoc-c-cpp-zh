    for Thanksgiving Dinner. The program reads the sugar content (in grams) for each
    dessert, and finds the total sugar content for all desserts and the average sugar
    content per dessert. According to the American Heart Association (AHA), the maximum
    amount of added sugars per day should be about 30 grams. The program checks if
    the average sugar content satisfies the recommendations of the American Heart
    Association (AHA) and prints an appropriate message.


