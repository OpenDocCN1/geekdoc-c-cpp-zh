    ## 问题 10：编写一个程序读取一个正整数 `n`，并找到小于 `n` 平根的最大整数。


    ### 讨论


    输入：正整数，存储在 `n` 中。


    输出：小于 `n` 平根的最大整数。


    计算：


    初始化：给变量 `max` 赋值 1。


    使用循环结构，重复将 `max` 的值加 1，直到 `max*max < n`。迭代次数等于小于 `n` 平根的最大整数，且近似等于 `sqrt(n)`。这是一个哨兵控制循环。在
    Python 中，优的循环结构是 `while` 循环；在 C 语言中，可以使用 `while` 循环和 `for` 循环。


    例如，如果 `n = 49`，循环迭代 6 次，小于 49 平根的最大整数是 6；如果 `n = 48`，循环迭代 6 次，小于 48 平根的最大整数是 6；如果
    `n = 50`，循环迭代 7 次，小于 50 平根的最大整数是 7；


    输入限制：在本示例中，我们假设输入是有效的，`n > 0`。


    输出限制：无


