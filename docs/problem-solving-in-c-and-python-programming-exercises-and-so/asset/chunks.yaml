    \ WHILE loop\nA while loop in Python repeatedly executes a block of statements\
    \ as long as a specified condition is true.\n\nSyntax:\n```python\nwhile(expression):\n\
    \    loop body statement(s)\n```\nEach repetitive execution of the loop body statement(s)\
    \ is called an iteration.\n\nHow it works:\n`loop body statements` are executed\
    \ repeatedly while `expression` is True.\n\nNote:\n1. `loop body` can consist\
    \ of a single statement or multiple statements.\n2. `loop expression` can be any\
    \ expression that has a Boolean value. *Remember:* in Python, all numbers have\
    \ Boolean value: `0` has a False Boolean value and any non-zero number has a True\
    \ Boolean value.\n3. `loop expression` is checked at the start of each iteration.\n\
    4. If `expression` is never False, the loop is an infinite loop.\n5. If `expression`\
    \ has a False Boolean value at the beginning of the loop execution, the loop terminates\
    \ immediately and loop body statements are not executed at all and control passes\
