    identity: `x = (x//y)*y + (x%y)`. This identity applies to all numbers, positive
    and negative.


    2. The modulo operator always yields a result with the same sign as its second
    operand (or zero).


    3. For `x < 0` and `y > 0` the following formula could be applied: `x%y = y –
    abs(x)%y`, where `abs(x)` is absolute value of `x`.

