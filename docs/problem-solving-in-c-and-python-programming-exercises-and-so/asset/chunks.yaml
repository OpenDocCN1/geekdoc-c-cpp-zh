    iii. Nested Loops in Python


    Python supports the nested loop structure – a loop inside another loop. The depth
    of the nested loop depends on the problem. Any type of loop could be placed inside
    the other loop.


    Examples:


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6a543ff3.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_6a543ff3.jpg)


