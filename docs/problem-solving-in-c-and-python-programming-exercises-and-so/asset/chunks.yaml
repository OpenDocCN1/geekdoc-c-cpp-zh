    ## Problem 10: Write a program that reads one positive integer `n`, and finds
    the maximal integer number that is less than square root of `n`.


    ### Discussion


    Input: positive integer, stored in `n`.


    Output: the maximal integer number that is less than square root of `n`.


    Calculations:


    Initialization: assign 1 to variable `max`.


    Using a loop programming structure, repeat incrementing the value of `max` by
    1 until `max*max < n`. The number of iterations equals the maximal integer number
    that is less than square root of `n` and is approximately equals `sqrt(n)`. This
    is a sentinel controlled repetition. In Python, the preferable loop structure
    is the `while` loop; in C, `while` loop and `for` loop can be used.


    For example, if `n = 49`, loop iterates 6 times, and the maximal integer number
    that is less than square root of `49` is 6; if `n = 48`, loop iterates 6 times,
    and the maximal integer number that is less than square root of `48` is 6; if
    `n = 50`, loop iterates 7 times, and the maximal integer number that is less than
    square root of `50` is 7;


    Input Limitations: in this example we will assume that the input is valid, `n
    > 0`.


    Output Limitations: none


