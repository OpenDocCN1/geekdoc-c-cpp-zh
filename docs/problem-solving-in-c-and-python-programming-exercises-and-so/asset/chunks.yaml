    ## 常量变量


    在 **C** 中，常量变量（常量）是在整个程序运行期间无法修改的变量。在 C 中声明常量变量有多种方法：


    1) 使用如下 `#define` 预处理器指令：

    ```c

    #define VARIABLE_NAME value

    ```

    示例：

    ```c

    #define PI 3.14

    #define PASSIGN_GRADE 60

    ```

    **注意：** `#define` 语句末没有分号


    `#define` 预处理器指令通常位于程序顶部的 `#include` 指令之后。


    2) 在变量名的声明语句中使用 `const` 关键字。

    ```c

    int const PASSING_GRADE = 60;

    float const PI = 3.14;

    ```


    为了区分常量与其他变量，建议使用全大字母并用下划线分隔单词来命名常量。


    **Python** 没有真正的常量变量，但我们可以采用上述的命名约定，对某些变量使用全大字母，表示它们的值在整个程序运行期间不应修改。


    示例：

    ```python

    PI = 3.14

    PASS_GRADE = 60

    ```


    为什么在程序中使用常量？


    '
- fmt: '

    In many programs you will have a situation when the same number or character is
    used repeatedly throughout the program. In this case, it is advisable to declare
    the constant variable to hold the repetitive number or character. This allows
    quick and easy access to the constant variable’s value. If we need to update our
    code and modify the initial value of the constant variable we only need to do
    it once in the declaration or `#define` statement. Declaring a constant variable
    also gives a number or a character a descriptive label explaining its meaning.


    # Comments


    In Python, a comment starts with the hash character, `#`, and extends to the end
    of the physical line. Comments in Python can be anywhere in the program.


    In C, a comment starts with the slash asterisk `/*` and ends with an asterisk
