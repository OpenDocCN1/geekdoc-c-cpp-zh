    关于打印浮点数的更多信息，请参阅：https://docs.python.org/3/floatingpoint


    #### C 中的输入

    `scanf()` 函数用于执行标准输入——来自键盘的输入。对于已介绍的变量类型，`scanf` 的通用语法如下：


    ```c

    scanf("格式说明符列表", 变量列表);

    ```


    注意：

    1. 在变量列表中，每个变量前的取地址符（`&`）表示变量在计算机中的地址。对于已介绍的变量类型，`scanf` 需要该符号才能存储输入。缺少取地址符不会导致编译器错误，但会导致段错误（segmentation
    fault），这是一种运行时程序错误。运行时错误会导致程序立即退出（终止）。

    2. 大多数 C 编译器不会检查格式说明符与变量类型之间的对应关系。类型不匹配会导致逻辑错误。逻辑错误不会终止程序，但会导致程序产生错误的输出。

    3. 我们建议不要在格式说明符之间包含空格或其他字符，以避免运行时逻辑错误。`scanf` 格式字符串与格式数据不一致会导致运行时逻辑错误。例如：

    ```c

    scanf("%d,%d,%d", &a, &b, &c);

    ```

    要求整数用逗号分隔，否则会发生运行时逻辑错误。

    4. 对于已介绍的变量类型，`scanf` 格式说明符 `%d`、`%f`、`%lf` 和 `%Lf` 会跳过所有领先空白字符并在空白字符处终止。此外，格式说明符
    `%c` 会读取空白。这一事实在读取数值数据后的字符时需要小心处理。


