    #### Python 中的输出

    `print()` 函数用于执行标准输出——输出到屏幕。要打印文本，可以使用单引号（''''）、双引号（" "）或三引号（"""""）。三引号允许多行打印文本。要打印变量的值，直接使用变量名而不加任何引号。要格式化输出，使用
    `format()` 函数。


    ##### Python 中的基础转义序列

    反斜杠（`\`）字符用于转义在 Python 中 otherwise 具有特殊含义的字符。


