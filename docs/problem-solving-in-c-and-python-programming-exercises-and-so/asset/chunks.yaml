    **Input**: one integer, stored in `month`, representing the numeric number of
    the month: January is 1, February is 2, and December is 12.

    **Output**: the number of days in the specified month. For February, the program
    prints 28 or 29; there is no need to check if the year is Leap year.

    **Calculations**: use a `switch` statement in C and an `if-elif-else` statement
    in Python.

    **Input Limitations**: the input must be a positive integer between 1 and 12.
    This limitation should be checked in the program using an `if-else` statement
    in Python or a `switch` statement in C.

