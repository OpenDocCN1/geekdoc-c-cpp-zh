    \n## Word Problems and Sample Solutions\n\n### Problem 1: Write a program that\
    \ reads the number of nights a person stayed in a hotel, the price per night and\
    \ the tax percent. The program calculates and prints the total cost of the hotel\
    \ stay. For example, if the person stayed 3 nights, with $99.99 per night and\
    \ a 14.5% tax, the total price for the hotel stay is $343.47.\n\n#### Discussion\n\
    - **Input**:\n    1. the number of nights, stored in `nights`, integer\n    2.\
    \ the price per night, stored in `price`, floating point\n    3. tax percent,\
    \ stored in `tax`, floating point\n- **Output**: total price for hotel stay, stored\
    \ in `total`, floating point.\n\n#### Calculations\n- full price per night: `full_one_night\
    \ = price+price*tax/100`\n- full price per stay: `total = nights*(price+price*tax/100)`\n\
    \n- **Input Limitations**: all input values must be positive. The number of nights\
    \ must be of integer type, price per night and tax – float type.\n- **Output Limitations**:\
    \ the output must be formatted with two decimal places since the program outputs\
    \ the money value.\n\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3088619b.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_3088619b.jpg)\n\
