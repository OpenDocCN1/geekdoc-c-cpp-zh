    ### 问题 3

    储蓄账户根据存款金额有不同的利率。例如，在某银行，如果存款为 1000 美元或以下，利率为每年 1%，否则利率为每年 2%。编写一个程序，输入存款金额。程序首先检查输入是否有效。对于有效输入，程序计算并打印一年后你的储蓄账户中的金额。应用上述的利率规则。对于无效输入，程序打印错误信息。


