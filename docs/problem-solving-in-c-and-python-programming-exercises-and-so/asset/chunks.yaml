    \n## 2. Loops in C\n\n#### i. WHILE loop\n\nA `while` loop in C repeatedly executes\
    \ a block of statements as long as a specified condition is true.\n\n#### Syntax:\n\
    \n```c\nwhile(expression){\n    loop body statement(s);\n}\n```\n\nEach repetitive\
    \ execution of the loop body statement(s) is called an iteration.\n\n#### How\
    \ it works:\n\n`loop body statements` are executed repeatedly while `expression`\
    \ is True.\n\n#### Note:\n1. `while` loop in C works exactly the same as in Python;\
    \ the only difference is slightly different syntax.\n2. `Loop body` can consist\
    \ of a single statement or multiple statements. In case of a single statement,\
    \ the curly braces are optional.\n3. `Loop expression` could be any expression\
    \ that has Boolean value. In C, all numbers have Boolean value: `0` has a False\
    \ Boolean value and any non-zero number has a True Boolean value.\n4. If `expression`\
    \ is never False, the loop is an infinite loop.\n5. If `expression` has a False\
    \ Boolean value at the beginning of the loop, the loop terminates immediately\
    \ and `loop body statements` are not executed at all control passes to the next\
    \ statement.\n\n#### Examples:\n![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c38d1.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_60c38d1.jpg)\n\
