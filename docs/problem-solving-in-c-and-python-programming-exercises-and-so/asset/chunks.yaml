    ### Problem 12


    A grocery store sells perishable and nonperishable food. Each item in the store
    has a bar code, a 9-digit positive integer. The bar code of perishable items ends
    with 3, 4, or 7. Write a program that reads one integer, the barcode of a single
    item and checks whether the item is perishable or not. The program prints an appropriate
    message.


    #### Discussion

    **Input**: one 9-digit integer, stored in `barcode`.

    **Output**: message: PERISHABLE or NONPERISHABLE.

    **Calculations**:

    1. Use the modulo operator to find the last digit.

    2. Check whether the last digit equals 3, 4, or 7.


