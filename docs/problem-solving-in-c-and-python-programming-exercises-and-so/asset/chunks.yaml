    4 -1 3 9 -2 10 6 100`，输出为 `-2`（最小值）、`6`（最小值在开头的位置）和 `3`（最小值在序列末尾的位置）。注意：100 不是序列的一部分，因为它是一个终止值。


    #### 讨论


    输入：整数序列。当前整数存储在变量 `num` 中。


    输出：最小值，存储在 `min` 中；它在序列开头的位置，存储在 `from_start` 中；以及在序列末尾的位置，存储在 `from_end` 中。


    #### 计算：


    初始化：将第一个输入数字赋值给 `min`，从开头的位置 `from_start` 赋值为 1。此外，由于序列不为空，输入次数将存储在变量 `total`
    中，初始值为 1。


    使用循环结构，重复读取输入数字，与当前的 `min` 值进行比较，在需要时替换，并更新 `from_start` 值，同时增加用于更新 `from_start`
    的 `total` 值。循环完成后，计算 `from_end = total - from_start`。注意：100 不被视为序列的一部分，不计入序列元素的总数。


    这是一种哨兵控制的循环，因为迭代次数预先未知且取决于用户输入。迭代次数等于输入次数。首选的循环结构是 `while` 循环。


    输入限制：输入序列不为空。


