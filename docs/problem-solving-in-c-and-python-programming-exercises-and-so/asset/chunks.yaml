    ## Problem 13: Write a program that reads a sequence of `n` integers (`n` is the
    length of the sequence and it is an input as well). The program finds the number
    of monotonically (strictly) increasing maximal sub-sequences `a[i] < a[i+1]` of
    at least length 2 within the input sequence. A ''maximal'' monotonically (strictly)
    increasing sub-sequence is a monotonically (strictly) increasing sub-sequence
    where if you add the next element, it will not be a monotonically (strictly) increasing
    sub-sequence anymore.


    For example, if the input sequence is: `3 1 5 7 2 -3 2 7 1 5 5 4`. The program
    outputs 4, since there are four increasing sub-sequences:

    `1 5 7`

    `-3 2 7`

    `1 5`

    `5` (Wait, the text says in the example above, `1 5 7` is a maximal (strictly)
    increasing sub-sequence, but `1 5` is not. And also, `-3 2 7` is a maximal (strictly)
    increasing sub-sequence but `-3 2` and `-3 2 5` are not.)


    For example if the input sequence is: `8 5 4 1`, the program outputs 0, since
    there are no increasing sub-sequences within the input sequence.


    ### Discussion


    Input: length of the sequence, stored in `n` (integer type), followed by `n` integers.
    Since the program must compare previous and current sequence values, two variables
    are used to store these values: `num_cur` and `num_prev`.


    Output: the number of monotonically (strictly) increasing sub-sequences within
    the input sequence, stored in `count_incr`.


    Calculations: This problem could be solved using nested loops or a single loop
    with two flag variables.


    The nested loop solution: the outer loop iterates through the input sequence and
    the inner loop iterates through the current increasing sub-sequence. The outer
    loop is a counter controlled repetition and the inner loop is a sentinel control
    repetition.


    The single loop solution: iterates through the input sequence using a flag that
    indicates the beginning of the current increasing sub-sequence.


    Input Limitations: the length of the sequence, `n`, must be positive and this
    limitation can be checked in the program using an `if-else` statement.


    Output Limitations: none


