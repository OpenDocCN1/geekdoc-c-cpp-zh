    ## 40. 编写一个程序读取两个正整数，并打印这两个输入之间所有的完美数。如果一个数字的真因子之和等于该数字本身，则该数字被称为完美数。某个数字 `K`
    不同于 `K` 的正因子被称为 `K` 的真因子。例如：`6` 是一个完美数。`6` 的真因子是 `1, 2` 和 `3`，它们的和是 `6`。其他完美数例如：`28,
    496, 8128`。


    ## 41. 某个数字 `K` 不同于 `K` 的正因子被称为 `K` 的真因子。例如，`1, 2` 和 `3` 是 `6` 的真因子。在数论中，盈数是一个小于其真因子之和的数字。例如，`12`
    是一个盈数，因为它小于 `1+2+3+4+6 = 16`。数字 `15` 不是一个盈数，因为其真因子之和为 `1+3+5 = 9`。数字 `6` 也不是一个盈数，因为
    `1+2+3 = 6`。编写一个程序读取一个正整数 `N`，并打印 1 到 `N` 之间所有的盈数。如果数字 `N` 是盈数，程序也将打印 `N`。


    示例 1：

    输入：`100` 输出：`94`


    示例 2：

    输入：`200` 输出：`945`


    ## 42. 快乐数通过以下过程定义：从任意正整数开始，将该数字替换为其各位数字的平方，重复该过程直到数字等于 1（此时将停留）或进入一个不包含 1 的循环。该过程结束于
    1 的数字是快乐数，不结束于 1 的数字是不快乐数（或忧伤数）。如果 `n` 不是快乐的，它的序列不会回到 1。相反它会进入一个循环，例如：`4, 16,
    37, 58, 89, 145, 42, 20, 4, 16, 37, 58, 89, 145, 42, 20, 4, 4...`。


    编写一个程序读取一个整数并输出以下内容：如果该数字是快乐的，输出 YES 以及从输入到 1 所需的步数（包括得到 1 的那一步）；否则程序输出 NO 以及到达循环起点所需的步数（包括得到
    4 的那一步）。


    例如如果 `n = 44`，我们得到：

    第 1 步：`4² + 4²= 32`

    第 2 步：`3² + 2²= 13`

    第 3 步：`1² + 3²= 10`

    第 4 步：`1² + 0² = 1` - 过程结束，输出为：YES, 4


