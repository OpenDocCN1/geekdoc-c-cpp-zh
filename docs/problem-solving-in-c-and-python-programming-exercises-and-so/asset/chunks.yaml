    ### Problem 8


    In the Gregorian calendar, a year is a leap year when the number representing
    it is divisible by 4, but not by 100, unless it is divisible by 400. Thus years
    such as 1996, 1992, 1988 and so on are leap years because they are divisible by
    4 but not by 100. For century years, the 400 rule is important. Thus, century
    years 1900, 1800 and 1700, while all still divisible by 4, are also divisible
    by 100. As they are not further divisible by 400, they are not leap years. On
    the other hand, the year 2000 is a leap year since it is divisible by 4 and 100
    but also by 400. Also, you can assume that there were no leap years before 1582.
    Write a program that asks the user for a year and computes whether or not that
    year is a leap year.


    #### Example:

    - Input: 1980 Output: Leap Year

    - Input: 1900 Output: Not a Leap Year

    - Input: 1200 Output: Not a Leap Year

    - Input: 2000 Output: Leap Year

    - Input: 3000 Output: Not a Leap Year


    #### Discussion

    **Input**: one integer stored in `year`.

    **Output**: a message indicating whether input is a leap year or not.

    **Calculations**: use an `if-else-if-else` statement to check the following conditions:

    1. Years before 1582 are not leap years.

    2. For years 1582 and above, years divisible by 4 and not divisible by 100 are
    leap years, and years divisible by 400 are leap years, otherwise, the year is
    not a leap year.


    **Input Limitations**: `year` must be non-negative and this limitation should
    be checked in the program using an `if-else` statement.

    **Output Limitations**: None.


