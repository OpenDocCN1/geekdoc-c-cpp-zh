    ## 问题 13：编写一个程序读取长度为 `n` 的整数序列（`n` 也是输入的一部分）。程序找到输入序列中长度至少为 2 的单调递增子序列 `a[i] <
    a[i+1]` 的数量。“极大”单调递增子序列是指如果加上下一个元素，它不再是单调递增子序列的序列。


    例如，如果输入序列为：`3 1 5 7 2 -3 2 7 1 5 5 4`，程序输出 4，因为有四个递增子序列：

    `1 5 7`

    `-3 2 7`

    `1 5`

    `5`（等等，上面的文本说 `1 5 7` 是极大单调递增子序列，但 `1 5` 不是。同样，`-3 2 7` 是极大单调递增子序列，但 `-3 2` 和
    `-3 2 5` 不是。）


    例如，如果输入序列为：`8 5 4 1`，程序输出 0，因为序列中没有递增子序列。


    ### 讨论


    输入：存储在 `n` 中的序列长度（整数类型），接后是 `n` 个整数。由于程序必须比较之前的序列值，使用了两个变量来存储这些值：`num_cur` 和 `num_prev`。


    输出：输入序列中单调递增子序列的数量，存储在 `count_incr` 中。


    计算：此问题可以使用嵌套循环或带有两个标志的单循环解决。


    嵌套循环方案：外层循环遍历序列，内层循环遍历当前的递增子序列。外层循环是计数循环，内层循环是哨兵控制循环。


    单循环方案：使用指示当前递增子序列开始的标志遍历序列。


    输入限制：序列长度 `n` 必须为正数，可以在程序中使用 `if-else` 语句检查此限制条件。


    输出限制：无


