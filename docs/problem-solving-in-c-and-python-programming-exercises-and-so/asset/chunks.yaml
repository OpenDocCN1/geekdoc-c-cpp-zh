  raw: 'Write a program that reads the final exam grade and homework assignments grade.
    The program calculates the final grade in the course.


    Discussion


    Input:


    1\. grade for final exam, stored in *final_exam*, integer


    2\. grade for homework assignments, stored in *homework*, integer


    Output: final grade, stored in final, integer


    Calculations:


    final = final_exam*(90/100) + homework *(10/100)


    Input Limitations: final_exam and homework must be of integer type, all input
    values must be integers between 0 and 100.


    Output Limitations – type casting: the output must be a rounded integer. Since
    int()function in Python and type casting in C truncates towards zero, the following
    formula must be used: (int)(final + 0.5)


    For example, if the final grade is 93.5 the output will be 94 and if the final
    grade is 93.4 the output will be 93


    Note: in this program we will use constant variables, FINAL and HOMEWORK, to hold
    the weight of final exam and homework.


    ![tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m7b15b7f0.jpg](tmp_034b4c16a5496d1faa828a97718c1803_1OXqjI_html_m7b15b7f0.jpg)


