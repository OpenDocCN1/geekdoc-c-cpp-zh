    ## Constant Variables


    In **C**, constant variables (constants) are variables with a value that cannot
    be modified throughout the program. There are several ways to declare a constant
    variable in C:


    1) Using the `#define` preprocessor directive as follows:

    ```c

    #define VARIABLE_NAME value

    ```

    For example:

    ```c

    #define PI 3.14

    #define PASSIGN_GRADE 60

    ```

    **Note:** there is no semicolon at the end of the `#define` statement


    The `#define` preprocessor directives usually follow `#include` directives at
    the top of your program.


    2) Using the `const` keyword in the declaration statement before the name of the
    variable.

    ```c

    int const PASSING_GRADE = 60;

    float const PI = 3.14;

    ```


    To distinguish constants from the non-constant variables, it is advisable to name
    them using all capital letters with underscores separating the words.


    **Python** does not have true constant variables, but we can use the same naming
    convention as above using all capital letters for certain variables to indicate
    that their values are not meant to be modified throughout the program.


    For example:

    ```python

    PI = 3.14

    PASS_GRADE = 60

    ```


    Why use constants in your program?

