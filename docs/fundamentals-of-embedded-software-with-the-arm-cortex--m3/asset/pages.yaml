- pgno: 173
  md: 'and I/O device are physically separate, with cycle times corresponding to two
    or three processor clock cycles. Thus, a reasonable estimate of maximum DMA data
    rate probably requires using 60 nsec/cycle. If each cycle transfers a full 32-bit
    word of 4 bytes, the data rate would be 4 / (60 × 10⁻⁹) bytes/sec, or about 66
    MB/sec.


    DMA transfers can occur between any two memory cycles so that the maximum latency
    for DMA is no more than the time required for one DMA memory cycle.


    # 8.4.4 Comparison of Methods


    Our execution-time performance estimates of latency and transfer rate for the
    various types of I/O as well as a relative comparison of hardware cost and software
    complexity are summarized in Table 8-3. These results assume all bus access to
    memory and I/O are completed in a single processor clock cycle.


    | | Polled Waiting Loop | Interrupt-Driven I/O | Direct Memory Access |

    |---|---|---|---|

    | Maximum transfer rate | ~ 3.6 MB/sec | ~ 1.7 MB/sec | ~ 66 MB/sec |

    | Best-case latency | Unpredictable | 340 nsec | ~ 60 nsec |

    | Hardware cost | Least | Low | Moderate |

    | Software complexity | Low | Moderate | Moderate |


    Programmed I/O is rarely used in real-time embedded systems, due to the unpredictable
    latency for input devices and the inability to do any other useful work while
    waiting for a device to be ready for a data transfer. DMA is rarely used in small-scale
    embedded systems, due to the extra cost of the DMA controller and because the
    interrupt-driven data rates are usually sufficient for most applications.


    The example code we have used for estimating performance capability was written
    in assembly. However, we have seen that the Cortex-M3 has a number of features
    that make it possible (and desirable) to write an ISR in C with little or no loss
    of performance. ISRs transfer data between an I/O device and memory but have no
    input parameters or return value. In C, an ISR for the Cortex-M3 is written as
    a regular void function that contains hard-coded references to a specific memory-mapped
    I/O device and a buffer or queue located in memory. The one and only detail that
    requires some unusual C code is to locate the vector table at physical address
    zero. Almost every C compiler provides some sort of extended syntax that allows
    this to be specified in the declaration, but it usually varies from one compiler
    to another. If not, one can always resort to creating the vector table in assembly.'
