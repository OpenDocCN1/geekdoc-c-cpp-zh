- pgno: 23
  md: '# 1.3 WHAT DOES "REAL-TIME" MEAN?


    Real-time systems process events. Events occurring on system inputs cause other
    events to occur as system outputs. Examples of input events include such things
    as the detection of a telephone ring signal, the application of force to the brake
    pedal of a car, or the opening of a microwave oven''s door. The output events
    produced in response to these input events might be to take the phone line "off-hook,"
    to apply hydraulic pressure to the automobile''s brake system, and to turn off
    the microwave oven.


    One of the primary design goals of real-time systems is minimizing response time.
    A soft real-time system is one that is designed to compute the response as fast
    as possible but does not have an explicit deadline. If a deadline is imposed,
    the system is known as a hard real-time system. Keeping response times of hard
    real-time systems within the given deadlines is always important, or the entire
    system may fail to operate properly. For example, an antilock braking system must
    detect and respond to loss of traction within a few milliseconds; a delay of one
    or two seconds would be intolerable and potentially deadly.


    # 1.4 WHAT DOES "MULTITHREADING" MEAN?


    Embedded systems are real-time systems that have several inputs and outputs and
    must respond to multiple independent events. For example, the programmable thermostat
    that controls your furnace must continuously perform three tasks: (1) monitor
    the temperature, (2) monitor the time of day, and (3) scan the keypad for user
    input. There is only one computer inside the thermostat, but it may perform each
    of these tasks using a separate code thread, as shown in Figure 1-7. Although
    the threads communicate with each other, for the most part they run independently.


    Separating code into threads simplifies software development and maintenance by
    allowing the programmer to concentrate on one task at a time. However, it also
    requires that the processor somehow continuously switch among the threads. This


    | do forever {

    measure temp ;

    if (below setting)

    start furnace ;

    else (above setting)

    stop furnace ;

    } | do forever {

    measure temp ;

    if (time == 6am)

    temp = 72° ;

    else if (time == 11pm)

    temp = 60° ;

    } | do forever {

    check keypad ;

    if (raise temp)

    setting++ ;

    else if (lower temp)

    setting-- ;

    } |

    |---|---|---|


    FIGURE 1-7 Three concurrent code threads within a programmable thermostat.'
