  md: '# # 11.5 STATIC ALLOCATION


    Static objects are allocated (and possibly initialized) *once* when the program
    is first loaded into memory. Their location in memory never changes during the
    entire execution of the program, and thus static objects are not destroyed until
    the program terminates.


    The *advantage* of static allocation is persistence of values. Unlike objects
    that use automatic allocation, a value stored in a static object will remain from
    one execution of a function to another.


    The *disadvantage* of static allocation is the inability to reclaim the memory
    for other purposes once the object is no longer needed. Extensive use of static
    objects can thus result in programs that require lots of memory. An inexperienced
    programmer''s attempt to avoid dealing with scope restrictions by declaring all
    objects global will ultimately produce very "fat" programs.


    Every global object inherently uses static allocation. Inexperienced programmers
    will sometimes make an object global just to retain its value from one invocation
    of a function to the next. However, a better way to accomplish the same thing
    without global *scope* may be to simply add the keyword `static` to the declaration
    of a local object, as shown in Figure 11-4.


    | Bad | Good |

    | :--- | :--- |

    | /\* These two objects are \*/<br>/\* global to this file! \*/<br><br>unsigned
    total = 0 ;<br>unsigned count = 0 ;<br><br>void Enter_Score(unsigned score)<br>{<br>
    total += score ;<br> count++ ;<br> printf("average score = %u\n",<br> total /
    count ) ;<br> } | void Enter_Score(unsigned score)<br>{<br> /\* These two objects
    are \*/<br> /\* local to this function! \*/<br> static unsigned total = 0 ;<br>
    static unsigned count = 0 ;<br><br> total += score ;<br> count++ ;<br> printf("average
    score = %u\n",<br> total / count ) ;<br> } |


    FIGURE 11-4 Good and bad ways to retain a value.


    Problems can occur, however, when static objects are modified by more than one
    thread. It is natural to be concerned about this possibility when the object is
    global. However, moving them into the local scope of a function does not prevent
    it. If you are not used to using static locals, you may be tempted to keep your
    static objects global rather than learning why restricting their scope does not
    help. But the real problem has nothing to do with their scope; rather, it is the
    fact that they are static. Thus, the first priority should be to try to change
    their allocation method to automatic or dynamic if possible.'
