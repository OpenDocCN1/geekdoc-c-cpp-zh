  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_200_0.png)


    FIGURE 10-10 Scheduling to meet deadlines.


    For example, consider two tasks, both initiated at the same instant. One is a
    2-sec task with a deadline of 7 sec, and the other is a 4-sec task with a deadline
    of 5 sec. As Figure 10-10 shows, both deadlines can be met only if the longer
    (4-sec) task runs first. This form of scheduling is known as deadline driven because
    it schedules the thread with the earliest deadline first.


    # 10.6.2 Rate-Monotonic Scheduling


    If we restrict ourselves to tasks that are periodic with fixed-length execution
    times, a popular technique called rate monotonic analysis (RMA) can be used to
    analytically determine whether a given system will meet its deadlines. A complete
    treatment of RMA is beyond the scope of this text.


    The primary result of using RMA is that tasks with the shortest execution periods
    are assigned the highest priorities, without regard to how critical each task
    might be. Such an assignment helps to insure that the faster-executing tasks meet
    their deadlines by deterring preemption by slower tasks.


    For example, a task that processes the arrival of serial data packets will have
    a period that is related to the serial data rate. As the rate increases, complete
    packets are assembled and become ready for processing more frequently — meaning
    that the period between successive packets decreases and that (according to RMA)
    the priority of the task should thus be higher.


    RMA also provides the ability to estimate processor utilization. This is a measure
    of how much of the processor''s capability is being used and indicates whether
    a faster


