    # 6.6.1 Translating C Pointer Expressions to Assembly


    In C, pointers are used to hold the address of some location in memory. They are
    usually initialized by loading them with the result of applying the “address-of”
    operator (&) to another variable:


    ```

    ```c

    int8_t *ptr2byte; // 32-bit pointer holds address of an 8-bit byte

    int8_t data;

    ptr2byte = &data; // store address of data (a constant) in pointer

    ```

    ```


    This value of &data is a constant. In ARM assembly, we use a special “ADR” instruction
    to obtain that constant:


    ```

    ```asm

    ADR R0,data ;R0 ← &data

    STR R0,ptr2byte ;ptr2byte ← R0

    ```

    ```


    The source operand field of the ADR instruction can use any of same memory reference
    expressions as the LDR and STR instructions, but it does not actually reference
    memory memory–it merely calculates an address without causing a memory read or
    memory write. In its simplest form (as mentioned earlier), it is similar to an
    LDR instruction that loads a constant into a register since the address of “data”
    is a constant. However, this address is actually obtained by adding something
    to the current value of the program counter.


    When you dereference a pointer, you use its content as the address of the data
    you want to reference. Assuming “ptr2byte” has been initialized with the address
    of “data”, we can store a zero into it by an indirect reference through pointer,
    as in:


    ```

    ```c

    *ptr2byte = 0 ; // store a zero into the byte "data"

    ```

    ```


    Note that we are storing the zero at a location whose address is provided by a
    variable rather than a constant. Thus, in ARM assembly, we must load the content
    of that variable into a register and then use it inside a pair of square brackets
    when storing the zero into memory:


    ```

    ```asm

    LDR R0,=0 ;get the constant zero

    LDR R1,ptr2byte ;get the address held in "ptr2byte"

    STRB R0,[R1] ;store the zero into a byte of memory

    ```

    ```


    The code above uses an STRB instruction because the pointer was declared to point
    to data which is 8 bits wide. However, the pointer itself is loaded using a regular
    LDR instruction since an address is always 32 bits.


    It is also important to understand how pointer arithmetic works. Consider the
    following:


    ```

    ```c

    int32_t array[100] ; // an array of 32-bit words of 4 bytes each

    int32_t *ptr2word ; // a pointer to a 32-bit word

    ptr2word = array ; // initialize ptr2word with the address of array[0]

    ```

    ```'
