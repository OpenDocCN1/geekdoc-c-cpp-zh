- pgno: 17
  md: '# Acknowledgments


    This text and the software on the Companion Website would not have been possible
    without the efforts of a number of people. Of them all, I owe a special thanks
    to the students and teaching assistants of COEN 20 at Santa Clara University over
    the past 10 years who witnessed the transition from the first edition to this
    almost completely re-written second edition, and who have helped fine-tune the
    text, the problems, and the laboratory assignments.


    I also owe a debt of gratitude to many of my colleagues: To Qiang Li and Neil
    Quinn who endured the unenviable task of teaching from my materials and who graciously
    suggested a number of improvements to the original text. To Hal Brown and Vasu
    Alagar who helped me develop a mathematical representation of fixed-point multiplication
    of real numbers that led to an efficient straight-line implementation in assembly
    and an explanation of the algorithm that students find relatively easy to understand.
    To Darren Atkinson whose expertise in C has been invaluable. And thanks to Dana
