- pgno: 182
  md: 'Getting the best possible performance out of a foreground/background system
    requires moving as much work as possible into the background thread. The latter
    becomes a collection of queues and associated routines to process the data. While
    this may optimize the latency of the individual ISRs, the greater workload that
    has been moved to the background begs for a managed allocation of processor time.
    Just like the external interrupts that initiated them, each background task has
    a different level of importance, and thus should be assigned a different percentage
    of CPU time. While the queues can be checked with differing frequency to implement
    a crude priority system, this is usually the point at which one should consider
    a more sophisticated approach. This is the subject of the remaining chapters.


    # 9.2 MULTITHREADED PROGRAMMING


    As the software for embedded real-time applications becomes more complex, a better
    strategy for managing processor time is needed. Consider the organization of a
    multithreaded program, shown in Figure 9-7. The program is structured as a collection
    of independent threads that process data in the background, with ISRs merely filling
    input queues and emptying output queues. Moving the data processing from ISRs
    to the background reduces latency by minimizing the time spent executing ISRs.
    In addition, it allows the ISRs to be designed as simple “straight-line” code,
    without the need for any waiting loops.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_182_0.png)


    FIGURE 9-7 Organization of multithreaded real-time embedded software.


    In an embedded system, each thread is usually implemented as a function that performs
    some initialization and then enters an infinite processing loop. At the top of
    the loop, the thread typically waits for data to become available, an external
    event to occur, or a condition to become true.


    Threads make calls to a library of run-time routines (known as the real-time kernel)
    that is designed to manage resources in a multithreaded program. The kernel provides
    mechanisms to switch from one thread to another, as well as for establishing coordination,
    synchronization, communications, and priority among the threads. Often'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'the library will also include routines to manage queues, and it may even interface
    with the ISRs to further improve response time.


    # 9.2.1 Concurrent Execution of Independent Threads


    Each thread in a multithreaded program runs as if it had its own processor separate
    from those of the other threads. For the most part, threads are designed, are
    programmed, and behave as if they are the only thread running. The ability to
    partition the background into a set of independent threads in this manner greatly
    simplifies the design of any one thread, and thus the total complexity of the
    program as well.


    An important but sometimes difficult design goal is to partition the background
    software into threads in a manner that minimizes interthread linkages and thus
    maximizes thread independence. Occasionally, however, threads will need to share
    information or coordinate their execution. Kernels provide services for these
    needs in a disciplined manner that facilitates good program architecture and reduces
    complexity.


    Only one thread runs at a time, while the others are suspended. However, the processor
    switches from one thread to another so quickly that (to the external environment)
    it appears that all threads are running simultaneously. In reality, the threads
    are said to be running concurrently. The programmer assigns a priority to each
    thread according to its importance and a kernel routine called the scheduler uses
    this information to determine which thread to run next.


    # 9.2.2 Context Switching


    Each thread has its own stack and a special region of memory referred to as its
    context. As shown in Figure 9-8, the context includes memory for the thread''s
    stack and copies of the contents of all the CPU registers when the thread was
    last suspended.


    As shown in Figure 9-9, a context switch from thread A to thread B first saves
    all CPU registers in context A and then reloads all CPU registers from context
    B. Since the CPU register set includes the stack pointer (SP) and program counter
    (PC), reloading context B in effect causes a reactivation of thread B''s stack
    and a return to where it left off when it was last suspended.


    # 9.2.3 Non-preemptive (Cooperative) Multithreading


    In non-preemptive multithreading, threads must explicitly call a kernel routine
    to perform the context switch. By calling this routine, the thread relinquishes
    control of the processor, thus allowing another thread to run. The context switch
    call is often referred to as a yield, and this form of multithreading is often
    called cooperative multithreading.


    When an external event occurs, the processor may very well be executing a thread
    other than the one designed to process the event, and the first opportunity to
    execute the needed thread will not occur until the current thread reaches the
    next yield. When the yield actually does occur, it is possible that several other
    threads may be scheduled to run first. In most cases, this makes it impossible
    or extremely difficult to predict the worst-case response time of non-preemptive
    multithreaded systems.'
