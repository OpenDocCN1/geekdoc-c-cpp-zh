  md: '# ## 6.7 STACK INSTRUCTIONS


    A stack is a “Last-In, First-Out” (LIFO) data structure in which data is retrieved
    in the opposite order from which it was written. Processors implement stacks by
    allocating a region of memory for the stack and maintaining a “stack pointer”
    (SP) register that holds the address of the next stack location to be accessed,
    called the _top_ of the stack. A “push” operation writes data to the top of the
    stack, and a “pop” operation reads data from the top of the stack. Push and pop
    operations adjust the SP so that the location designated as the top of the stack
    automatically moves up and down in memory as push and pop instructions are executed
    (Figure 6-5).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_130_0.png)


    FIGURE 6-5 Implementation of a stack in memory.


    In the ARM processor, PUSH and POP instructions transfer one or more 32-bit words
    between the registers and the stack. The stack grows downward toward lower memory
    addresses as more and more data are pushed. Each PUSH writes a set of registers
    to the top of the stack and decrements SP (R13) by four times the number of registers
    written. Each POP does the reverse—it loads a set of registers from the top of
    the stack and increments SP by four times the number of registers loaded. When
    more than one register is written to the stack by a single PUSH instruction, the
    highest numbered register is written to the highest memory address, and the lowest
    numbered register to the lowest memory address (Table 6-5).


    | Instruction | Operation | Example | Notes |

    | :--- | :--- | :--- | :--- |

    | PUSH {reglist} | regs → mem[SP – 4 × #regs]; [SP += 4 × #regs] | PUSH {R0,R1,R7}
    | May not include SP or PC. |

    | POP {reglist} | regs ← mem[SP]; SP+= 4 × #regs | POP {R1,R2,R6,LR} | May not
    include SP: PC or LR may be included, but not both. |


    Stacks are a convenient temporary storage because no identifiers are needed for
    referring to the locations within a stack. C functions make extensive use of the
    stack for parameters, temporary variables, and to preserve and restore the content
    of registers that the function must modify. When a function needs to use one or
    more registers in order to carry out its computation, the function can use a PUSH
    instruction to preserve'
