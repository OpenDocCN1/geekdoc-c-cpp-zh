- pgno: 158
  md: '# # Programming in Assembly

    Part 4: I/O Programming


    Many of the external input/output (I/O) devices, such as keypads, solenoids, and
    relays, attached to embedded systems are typically mechanical. Their response
    time is characterized by the time required for physical movement, which is orders
    of magnitude slower than the speed of a computer’s CPU or main memory. Another
    common I/O device is an analog-to-digital (A-to-D) converter that takes a voltage
    as input and provides a digital representation of its value for use in computation.
    Conversion involves executing an algorithm implemented in the hardware of the
    A-to-D converter, but which still runs much slower than the speed of the computer.


    The bottleneck that usually limits the speed of I/O data transfer is the speed
    of the external device, and the computer must not transfer data faster than the
    device can process it. A few I/O devices, however, can transfer data at very high
    rates that require a thorough understanding of the capabilities and limitations
    of the various options for how a processor performs I/O.


    All I/O devices operate asynchronously with respect to the CPU. In other words,
    the events that determine when an input device has data available or when an output
    device is ready to accept more data are independent of the CPU. Most I/O programming,
    therefore, requires quite a bit of “handshaking” between the CPU and the I/O device
    to coordinate the transfer so that data is transferred reliably.


    The time behavior of I/O data transfer varies considerably from one device to
    another as shown in Figure 8-1. For example, a keypad provides data at a very
    low rate and with data bytes arriving at somewhat random times. Data received
    by a modem arrives at a relatively low rate, but with a reasonably constant time
    between bytes (periodic). High data rate devices sometimes transmit an entire
    “block” of several bytes at once. The size of the block may be fixed or variable
    and, as with slower devices, blocks may arrive randomly or periodically.


    | Data Rate | Occurrence | Increasing Time → |

    | :--- | :--- | :--- |

    | Low | Random | ↓ ↓ ↓ ↓ ↓ ↓ ↓ |

    | | Periodic | ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ |

    | High | Random | ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ |

    | | Periodic | ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ ↓ |


    FIGURE 8-1 Different types of time behavior in I/O data transfers.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 8.1 THE CORTEX-M3 I/O HARDWARE


    Desktop computers typically have separate instructions for accessing memory and
    peripherals. Their memory-reference instructions cannot access I/O devices, and
    their I/O instructions cannot reference memory. As a result, the only way to access
    an I/O device in C is to write a support routine in assembly using I/O instructions
    and then call the function at C anytime we want to transfer data to or from the
    device.


    The Cortex-M3, however, uses a memory-mapped architecture as described at the
    beginning of Chapter 5. This establishes a unified address space for both memory
    and I/O that allows either to be referenced by regular LDR or STR instructions.
    Writing software in C to access an I/O device with memory-mapped I/O is really
    no different than accessing a location in regular memory using a pointer. It is
    merely a matter of initializing the pointer with the address of the I/O device
    and then using the dereference operator to access the device indirectly via the
    pointer.


    # 8.1.1 Interrupts and Exceptions


    Consider the following situation: You are working at your desk at home on your
    income taxes. The phone rings (an interrupt). You stop work on your taxes and
    answer the phone (you accept the interrupt). It is your friend, who wants to know
    the name and phone number of your auto mechanic so she can call to arrange a service
    for her car. You give her the name and number (you process the interrupt request
    immediately). You then hang up and go back to work on your taxes. The additional
    time it will take you to complete your taxes is minuscule, yet the amount of time
    for your friend to complete her task may be significantly reduced. This simple
    example clearly illustrates how interrupts can drastically improve response time
    in a real-time system. Using interrupts requires that we first understand how
    the CPU processes an interrupt so that we can select the most appropriate software
    solution for each I/O device.


    Interrupts are a special case of exceptions. Besides interrupts, exceptions can
    also be triggered by certain internal errors, such as division by zero, an undefined
    instruction, or an illegal unaligned memory access. When an exception occurs,
    the processor executes a special sequence of instructions known as an exception
    handler. The term interrupt service routine (ISR) is often used to refer to exception
    handlers for interrupts.


    Writing handlers often requires writing code in assembly, even when the processor
    uses memory-mapped I/O. Although they share much in common, handlers and regular
    C functions are inherently different. An exception can occur at any time — between
    any two instructions or even in the middle of executing a single instruction.
    Unlike a regular C function, handlers must preserve and restore the content of
    all registers, including the program status register so that the handler may return
    to the interrupted code as if nothing has happened other than the passage of time.


    For this reason, handlers have traditionally been written entirely in assembly,
    as a mix of C and inline assembly, or as a regular C function defined with a special
    interrupt keyword that causes the compiler to generate code that saves and restores
    all registers. The Cortex-M3, however, has been designed in such a way that the
    hardware takes care of the differences so that handlers may be written as a regular
    void function with no parameters.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 8.1.2 Thread and Handler Modes


    The Cortex-M3 processor operates in one of two modes. During the execution of
    the main program or a thread, the processor is in *thread mode*; during the execution
    of a handler the processor is in *handler mode*. When executing code, this “Dr.
    Jekyll and Mr. Hyde” behavior allows the processor to behave one way for a regular
    C function and a somewhat different way for a handler. Thread mode and handler
    mode are distinguished by bits 0 to 8 of the processor status word (PSR). In thread
    mode, these bits are all zeroes; in handler mode, they hold a nonzero number that
    identifies the exception type.


    # 8.1.3 Entering the Exception Handler


    When an exception is recognized by the processor, it automatically responds with
    a specific sequence of actions:


    +   1. **Stacking:** The contents of R0 to R3, R12, the return address, and the
    contents of the PSR and link register (LR) are pushed onto the stack. (Note that
    the PSR and registers R0 to R3 and R12 are exactly those registers that the AAPCS¹
    does not require functions to preserve.)


    +   2. In parallel with the stacking operation, the processor identifies the exception,
    records its identity as an exception number in the PSR, and uses that number to
    locate and copy the starting address of the corresponding handler from the *vector
    table*² into the program counter (PC).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_160_0.png)


    FIGURE 8-2 Processor state saved during stacking.


    ¹The ARM Architecture Procedure Call Standard (AAPCS) is defined in Chapter 7.


    ²By default, the vector table is stored starting at address 0 but may be relocated
    by changing the contents of the vector table offset register.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   3. Register LR is loaded with all 1''s except for the least significant
    4 bits; these bits record the mode of the processor (thread or handler) prior
    to the exception. (Note: LR does not contain the return address!) The value stored
    in LR (known as EXC_RETURN) is a special value recognized and used by the processor
    to restore the previous mode when the handler returns.)


    +   4. Handler mode is enabled.


    +   5. Execution of the handler begins.


    # 8.1.4 Returning from the Exception Handler³


    (The processor initiates the return sequence when the handler executes an instruction
    (such as “BX LR”) that loads the PC with the EXC_RETURN value. That value signals
    the processor to start the return sequence and determines whether the processor
    returns to thread or handler mode. The return sequence then pops eight words from
    the stack, using them to restore registers R0 to R3, R12, LR, and the PSR, and
    to load the PC with the return address.)


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_161_0.png)


    FIGURE 8-3 Hardware interrupt processing.


    # 8.1.5 Latency Reduction


    The Cortex-M3 uses three techniques to reduce interrupt latency—the time from
    the interrupt request until the corresponding handler begins to execute.


    ³ Some exceptions are so serious as to be fatal, so that there is no reason for
    the handler to return.'
