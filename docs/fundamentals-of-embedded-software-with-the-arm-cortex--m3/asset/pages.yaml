  md: '# # Concurrent Software


    # ## 9.1 FOREGROUND/BACKGROUND SYSTEMS


    In many systems where response time is critical, it is common to organize the
    program as a foreground/background system, as shown in Figure 9-1. Most of the
    actual work is performed in the “foreground,” implemented as one or more interrupt
    service routines with each ISR processing a particular hardware event. As we learned
    in Section 8.4, this arrangement allows the system to respond to external events
    with a predictable amount of latency. To the extent that the external events are
    independent, there may be no or little communication between the various interrupt
    service routines (ISRs).


    The main program performs the necessary initialization and then enters the “background”
    portion of the program, which is often nothing more than a simple loop that waits
    for interrupts to occur.


    # ### 9.1.1 Thread State and Serialization


    Sometimes previous events that have occurred will determine how an input event
    should be processed. As a simple example, consider an external device that is
    sent a


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_177_0.png)


    FIGURE 9-1 Organization of a foreground/background system.


    Note: No program termination path is indicated, since once started, most embedded
    applications run indefinitely.'
