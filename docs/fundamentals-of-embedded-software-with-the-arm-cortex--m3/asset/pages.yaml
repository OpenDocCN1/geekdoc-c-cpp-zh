- pgno: 79
  md: '# ### 4.4.1 Testing Bits


    The bitwise AND operator is often used to test the value of a single bit. A "mask"
    consisting of single 1 in the bit position of interest is ANDed with the packed
    operand containing the bit to be tested. Thus, the result will be nonzero if and
    only if the bit of interest was 1. For example, consider


    ```

    if ((bits & 64) != 0)       /* check to see if bit 6 is set */

    ```


    Since any nonzero value is interpreted as true, some programmers omit the redundant
    comparison to zero, thinking (perhaps that it may reduce the amount of assembly
    language code. However, the comparison creates no additional code and improves
    readability.


    ```

    if ((bits & 0x0040) != 0)   /* check to see if bit 6 is set */

    ```


    As shown, the mask (64) is often written in hex (0 x 0040) to make it somewhat
    easier to identify which bit is being tested. An even better solution is to use
    a shift expression as shown below.


    ```

    if ((bits & (1 << 6)) != 0)   /* check to see if bit 6 is set */

    ```


    Again, there is no increase in the number of assembly language instructions. Since
    both operands of the shift operator are constants, the compiler will replace the
    shift expression with an equivalent constant.


    # ### 4.4.2 Setting, Clearing, and Inverting Bits


    Setting a bit to 1 is easily accomplished with the bitwise-OR operator:


    ```

    bits = bits | (1 << 7);        /* sets bit 7 */

    ```


    This would usually be written more succinctly as


    ```

    bits |= (1 << 7);             /* sets bit 7 */

    ```


    Note that we do not add (+) the bit to the operand! That only works if the current
    value of the target bit in the operand is known to be 0. Otherwise, adding a 1
    would leave a 0 in the target bit and propagate a carry that modifies bits in
    more significant bit positions. Although the phrase "set a bit to 1" suggests
    that the bit was originally 0, most of the time the current value of the bit is
    actually unknown. ORing a 1 ensures that the result will be 1 regardless of the
    current value, and that no other bits of the operand are affected in the process.


    Clearing a bit to 0 is similarly accomplished with the bitwise-AND operator:


    ```

    bits &= ~(1 << 7);            /* clears bit 7 */

    ```


    Note that for reasons similar to those described above, we do not subtract the
    bit from the operand!


    The right-hand side of the above assignment is a constant used as a bitmask containing
    all 1''s except for a 0 in bit 7. The AND operator uses that 0 to force a 0 into
    the'
