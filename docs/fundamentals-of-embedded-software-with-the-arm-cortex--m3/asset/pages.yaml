    # 10.6 ASSIGNING PRIORITIES


    The primary challenge in scheduling is to assign priority numbers in a manner
    that guarantees that the system meets real-time performance criteria. In real-time
    systems, faster response times are generally more desirable than slower response
    times. However, this does not always mean that we must compute every output response
    as fast as possible. Computing all output responses within their corresponding
    deadline constraints is a somewhat different objective.


    In conventional multiuser systems, we usually try to keep users satisfied with
    system performance by running the shortest computations (tasks) first with the
    objective of minimizing the average overall response time. For example, consider
    the case of two people who submit requests at the same moment—one that needs 1
    sec CPU time and another that needs 6 sec. As shown in Figure 10-9, if the longer
    task runs first, the response times will be 6 and 7 sec and one user will be significantly
    delayed; however, if the shorter task runs first, the response times are 1 and
    7 sec and both users are satisfied.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_199_0.png)


    FIGURE 10-9 Scheduling to minimize average response times.


    # 10.6.1 Deadline-Driven Scheduling


    The shortest-first policy may not be appropriate for real-time systems with response
    time deadlines. Associated with every task are two times: (1) the minimum time
    required to compute the response as determined by CPU speed and the complexity
    of the computation and (2) the maximum time allowed by external constraints (the
    deadline).


    4 In practice, tasks do not run serially as in Figure 10-9; rather the CPU continuously
    switches back and forth, devoting a percentage of its time to each task. The example
    shown represents the extreme case of allocating 100% to one task and 0% to the
    other. Actual allocations would fall somewhere between the two cases indicated.'
