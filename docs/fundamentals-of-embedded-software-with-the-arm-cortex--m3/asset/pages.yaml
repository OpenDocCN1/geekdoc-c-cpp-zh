  md: 'process of multithreading gives the appearance of simultaneous execution of
    threads, but in reality only one thread is being executed at any one instant.
    The threads are said to be executing concurrently. To clarify, we define task
    as a job to be done and thread as a sequence of instructions. A task may be partitioned
    into one or more threads running concurrently, but a single thread may contribute
    to the objective of one or more tasks.


    # 1.5 HOW POWERFUL ARE EMBEDDED PROCESSORS?


    A microcontroller unit (MCU) includes a processor, memory, I/O ports, timers,
    and multiple peripherals all on a single chip. In the past, MCUs typically employed
    8- and 16-bit processors. Today, the growing demand for intelligent devices such
    as smart phones, GPS devices, portable media players, and network routers for
    the home is pushing MCU to move to 32-bit processors that offer greater performance
    and functionality. As shown in Figure 1-8, 32-bit processors are rapidly replacing
    their predecessors in new embedded designs.


    # 1.6 WHAT PROGRAMMING LANGUAGES ARE USED?


    Although it is occasionally necessary to code some small parts of an embedded
    application program in assembly language, most of the code in even the simplest
    application is written in a high-level language. Traditionally, the choice of
    language has been (and


