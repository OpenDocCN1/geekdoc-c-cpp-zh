  md: '# Introduction


    # 1.1 WHAT IS AN EMBEDDED SYSTEM?


    Embedded systems are electronic devices that incorporate microprocessors within
    their implementations. The main purposes of the microprocessor are to simplify
    system design and to provide flexibility. Having a microprocessor in the device
    means that removing bugs, making modifications, or adding new features are only
    matters of rewriting the software that controls the device. Unlike PCs, however,
    embedded systems may not have a disk drive and so the software is often stored
    in a read-only memory (ROM) chip; this means that modifying the software requires
    either replacing or “reprogramming” the ROM.


    As Table 1-1 indicates, the embedded systems are found in a wide range of application
    areas. Originally they were used only for expensive industrial-control applications,
    but as technology brought down the cost of dedicated processors, they began to
    appear in moderately expensive applications such as automobiles, communications
    and office equipment, and televisions. Today’s embedded systems are so inexpensive
    that they are used in almost every electronic product in our life. For example,
    the tiny ATMEL 8-bit picoPower AVR processor in Vitality’s GlowCap™ (see Figure
    1-2) helps people remember to take their medication on time. It can sense when
    the bottle is opened, transmit that information wirelessly to a Vitality server,
    flash its LED, and play a ringtone.


    Although the typical family may own only one or two personal computers, the number
    of embedded processors found within their home and cars and among their


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_19_0.png)


    FIGURE 1-1 NASA''s 2003 Mars Exploration Rover used a BAE Systems RAD6000 32-bit
    RISC processor and Wind River Systems'' VxWorks operating system as its operating
    system. Image credit: NASA/JPL/Cornell University.'
