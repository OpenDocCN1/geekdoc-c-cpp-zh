- pgno: 189
  md: 'greater than that of disabling and enabling interrupts, and it does not lead
    to productive work as long as the flag remains locked. Mutex objects eliminate
    this overhead by moving the test-and-set operation into the kernel so that it
    does not switch back to the blocked thread until the lock is released.


    Coordinating entry into critical sections using a mutex requires calling a kernel
    function on either side of the critical section. Just before entering the critical
    section, the first kernel call (called a “pend” or “take”) causes the thread to
    block until the specified mutex can be acquired. When available, the mutex is
    taken and the thread continues. When the thread reaches the end of its critical
    section, a second kernel call (called a “post” or “give”) releases the mutex so
    that other threads waiting for the same mutex may proceed. Only a single thread
    may own a mutex at any one time; when a thread acquires a mutex, it is the only
    one that can release it.


    # 9.3.5 Semaphores


    A semaphore is similar to a mutex in that it can cause a thread to block (or suspend)
    until a condition is satisfied but is different in that a semaphore is typically
    used to manage events rather than to arbitrate access to a shared resource. Semaphores
    provide a mechanism for one thread to signal another thread. The first thread
    is thought of as the “producer” and the second as the “consumer” (although no
    actual data is produced or consumed). In many cases the producer is an ISR and
    the consumer is a thread that is waiting for the interrupt to occur.


    Semaphores contain a count that is incremented by the producer and decremented
    by the consumer. The count cannot go below 0 or above some value “N” that is established
    when the semaphore is created. When the count is zero, consumers are blocked until
    a producer performs a post that increments the count. When the count is N, producers
    are blocked until a consumer performs a pend to decrement the count.


    One common use of semaphores is to count events. Initially the count is set to
    zero. An event handler records each event by executing a post (or give) that increments
    the count, while another thread that processes the event executes a pend (or take)
    that decrements the count. Semaphores can also be used to manage a set of N identical
    resources. Initially the count is set to N, corresponding to the number of available
    resources. When a thread needs a resource, it executes a pend that decrements
    the count. When the resource is released, it executes a post that increments the
    count. Note that the semaphore has no knowledge of which resource is allocated,
    only how many.


    A “binary semaphore” is a special case in which the count can only be 0 or 1 and
    is more commonly used than the more general “counting semaphores.” Although a
    binary semaphore may be used in place of a mutex to arbitrate access to a shared
    resource, there is a subtle but important difference: A corresponding pair of
    mutex pend and post operations must be called from within the same thread, which
    allows the kernel to know which thread (if any) owns the mutex at any instant.
    Semaphores have no such notion of ownership.3'
