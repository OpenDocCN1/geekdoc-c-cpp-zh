- pgno: 162
  md: '# Suspending or abandoning instruction execution


    When an interrupt request arrives, the processor is likely to be in the middle
    of executing an instruction. That instruction is allowed to complete if it can
    do so in a single clock cycle. Instructions such as LDM, STM, PUSH, and POP that
    transfer multiple words to or from memory can be suspended and continued after
    the interrupt. All other instructions are abandoned and restarted after the interrupt
    so that in all cases the exception request is processed within a single processor
    clock cycle.


    # Late arrival processing


    Suppose the processor has begun an interrupt response sequence only to have another
    interrupt of higher priority suddenly arrive during the stacking operation. Rather
    than completing the response and entering the handler for the first interrupt
    only to have it preempted by the late arriving interrupt of higher priority, the
    processor will redirect the remainder of the interrupt response so that it handles
    the late arrival first.


    # Tail chaining


    The data rate capability of interrupt-driven I/O suffers somewhat from the overhead
    cost associated with saving and restoring the eight word of processor state information.
    In most processors, when two ISRs execute back-to-back, the state information
    is popped off the stack at the end of the first interrupt only to be pushed back
    onto it at the beginning of the next. The Cortex-M3 completely eliminates this
    useless pop-push sequence with a technique called tail-chaining, reducing the
    ISR transition time from 24 clock cycles down to only 6.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 8.1.6 Priorities and Nested Exceptions


    Some interrupts are more important than others. For example, when you slam on
    the brakes in your car, you cannot afford to wait for the processor to finish
    what it may be working on—even if it is executing an ISR for some other device.
    It is critical that the antilock braking system start working without delay. Real-time
    applications like anti-lock braking have hard deadlines, and to ensure that these
    deadlines are met requires that we assign priorities to interrupts and allow higher-priority
    interrupts to preempt those of lower priority.


    The Cortex-M3 processor incorporates a device called the nested vector interrupt
    controller (NVIC) that implements a priority system among the various exceptions
    and interrupts. As shown in Table 8-1, lower numbers are assigned to higher priorities,
    with interrupts from external devices having lower priority than other kinds of
    exceptions.


    There is special hardware interrupt called the nonmaskable interrupt (NMI) whose
    purpose is to handle catastrophic events such as an impending power failure or
    a memory parity failure. It has a priority greater than any other interrupt and
    cannot be disabled.


    Most priority numbers are software configurable from 0 (highest) to 255 (lowest),
    except those for reset, NMI, and hard faults. Until modified by software, the
    default priority of any exception whose priority is configurable is 0. If two
    interrupts are assigned the same priority, the one with the lower interrupt number
    is treated as having a higher priority.


    | Exception Type | Exception #'' | IRQ # | Priority | Comment |

    |---|---|---|---|---|

    | Reset | 1 | | -3 (fixed) | Initial SP value (loaded on reset) |

    | NMI | 2 | | -2 (fixed) | Power up and warm reset |

    | Hard fault | 3 | | -1 (fixed) | NMI |

    | Memory mgmt. | 4 | | | |

    | Bus fault | 5 | | | Address/memory-related faults |

    | Usage fault | 6 | n/a | | Undefined instruction |

    | Reserved | 7–10 | | Configured through system handler priority registers | |

    | SVCall | 11 | | | Software interrupt (SVC instruction) |

    | Debug monitor | 12 | | | |

    | Reserved | 13 | | | |

    | PendSV | 14 | | | |

    | SysTick | 15 | | | System timer tick |

    | Ext. interrupts | 16–255 | 0–239 | Configurable | |'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Priority numbers for the twelve system exceptions (4–15) are stored one per
    byte in the NVIC, starting at address E000ED18₁₆, and can be modified by code
    equivalent to:


    ```

    ((uint8_t *) 0xE000ED18)[exception_number - 4] = priority ;

    ```


    Priority numbers for up to 240 external interrupts are also stored one per byte
    in the NVIC, starting at address E000E400₁₆, and can be modified by code equivalent
    to:


    ```

    ((uint8_t *) 0xE000E400)[IRQ_number] = priority ;

    ```


    Once configured, the priority numbers determine which exceptions can preempt the
    handlers for other exceptions. For example, if the processor is executing the
    handler for an external interrupt, that handler can be preempted by a hard fault
    exception because it has a higher priority.


    # Enabling and disabling external interrupts


    Interrupts can be either entirely or selectively enabled or disabled. To enable
    or disable all external interrupts, use one of the following two instructions:


    +   - CPSIE i ; Enable external interrupts

    +   - CPSID i ; Disable external interrupts


    Individual external interrupts are controlled by two sets of eight registers within
    the NVIC, called the set enable registers (starting at address E000E100₁₆) and
    clear enable registers (starting at address E000E180₁₆). Each register is 32 bits
    wide, with 1 bit per interrupt. Setting a bit to 1 in a set enable register will
    enable the corresponding interrupt, while setting the corresponding bit to 1 in
    a clear enable register will disable it. For example, an individual interrupt
    can be enabled in the NVIC by code equivalent to:


    ```

    ((uint32_t *) 0xE000E100)[IRQ_number / 32] |= 1 << (IRQ_number % 32) ;

    ```


    # 8.2 SYNCHRONIZATION, TRANSFER RATE, AND LATENCY


    The CPU and I/O devices are physically independent. Events occurring within an
    I/O device that determine when data is available for input or when the device
    is ready to receive output data are not under the control of the computer. To
    transfer data to or from an I/O device requires synchronizing the CPU to the I/O
    device by somehow checking the status of the device and waiting until it is ready
    to transfer.


    Transfer rate is simply a measure of the number of bytes per second transferred
    between the CPU and an external device. The fastest transfer rates are provided
    by direct memory access (DMA), but at the expense of some additional hardware
    complexity. Polled waiting loops are the easiest to implement and provide good
    transfer rates but are rarely used in real-time applications. Interrupt-driven
    I/O is the slowest due to the overhead of saving and restoring the machine state
    (especially if only 1 byte of data is transferred per interrupt) but is the most
    commonly used technique of the three.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Latency is a measure of the delay from the instant that the device is ready
    until the time the first data byte is transferred. Latency is thus equivalent
    to “response time.” Latency can be very high or even unpredictable with polled
    waiting loops, is manageable with interrupt-driven I/O, and is very low with DMA.


    Even if the CPU is capable of transferring data at a very high rate, it may be
    useless if it takes too long to begin. For example, if a sequence of several data
    bytes arrives as a contiguous block of data on a serial line, the CPU must recognize
    the availability of the first data byte and remove it from the input before the
    second byte arrives. If the computer is busy performing some other task when the
    block begins to arrive, many of the first data bytes within the block may be lost.


    Polled waiting loops have long and usually unpredictable latency, since the computer
    may not even be checking the device for arrival of new data at the moment that
    it arrives. Latency is dramatically reduced with interrupt-driven I/O but still
    imposes a software overhead with more latency than DMA.


    # 8.3 BUFFERS AND QUEUES


    Interrupt-driven I/O inherently separates the ISR that handles the actual I/O
    transfers from the background code that processes the data, but the two communicate
    with each other by passing the data through a region of memory referred to as
    a buffer. For example, an ISR that handles keyboard interrupts stores coded representations
    of keystrokes into a buffer; a background routine then retrieves these keystrokes
    from the buffer and interprets them as numbers, lines of text, or editing commands.


    A common special case is a “first-in, first-out” (FIFO) buffer, known as a queue.
    As shown in Figure 8-5, the amount of data in a queue at any moment varies depending
    on how frequently data arrives for insertion and how fast that data is removed
    for processing. This “elastic” property of a queue helps decouple the timing relationship
    between the code that fills the queue and the code that empties it, allowing each
    to operate more asynchronously.


    Data is inserted (enqueued) at the “rear” of the queue and removed (dequeued)
    in the same order from the “front” of the queue. The queue is implemented as an
    array (q.bfr), with two subscripts to identify the current front (q.dq) and rear
    (q.rq) positions as shown in Figure 8-6. Two more integers are required to keep
    track of the size of the queue (q.size) and how much data it presently contains
    (q.count). When data is entered at the rear or removed from the front, the corresponding
    subscript is advanced. If a subscript advances beyond the end of the array, it
    gets reset to 0 so that the queue behaves in a circular manner. The code that
    uses this data structure is shown in Figure 8-7.


    | Insert: | ↓ | ↓ | ↓ | ↓ | ↓ | ↓ | ↓ |

    |---|---|---|---|---|---|---|---|

    | Items in Q: | 0 | 1 | 0 | 1 | 1 | 2 | 2 | 1 | 1 | 1 | 2 | 1 | 2 | 2 | 3 | 2
    | 2 | 2 | 2 | 1 | 1 | 1 | 1 | 0 |

    | Remove: | | | ↓ | | | ↓ | | | | ↓ | | | | ↓ | | | | ↓ |


    FIGURE 8-5 Using a queue to decouple time of data arrival from time of data processing.'
  merge: -1
  img_proc: true
