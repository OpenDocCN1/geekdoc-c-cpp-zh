    The volatile keyword may also be used in the declaration of a pointer—not because
    the pointer itself is volatile, but rather because the data it points to is volatile,
    as in the following:


    ```

    volatile long *pv; /* pointer to shared data */

    ```


    Since the volatile object pointed to by pv is usually at a fixed memory location,
    it is quite common to make pv a constant pointer, as in the following:


    ```

    volatile long * const pv = <initial-value>;

    ```


    Although perhaps counterintuitive, it is occasionally appropriate to use both
    volatile and const to describe the object itself:


    ```

    const volatile long * const pv = <initial-value>;

    ```


    The above use of the const and volatile qualifiers has the following effect on
    code within the scope of identifier pv:


    +   1. The first const prevents modification of the object *pv in the source code
    where it is declared.

    +   2. The volatile qualifier tells the optimizer that the object *pv may be modified
    by mechanisms outside the scope of identifier pv.

    +   3. The second const disallows any modification of pointer pv.'
