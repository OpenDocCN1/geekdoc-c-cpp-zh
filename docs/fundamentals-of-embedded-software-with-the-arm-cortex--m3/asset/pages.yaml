    input device is given in Figure 8-13. Immediately upon entry, the ISR reads the
    data byte from the device and then proceeds to store it into a queue for later
    processing. In


    5 Although an RS232 serial output device (like most I/O devices) accepts only
    1 byte per transfer, it is conceivable that a different kind of device might accept
    a full 32-bit word per transfer; in this case, our maximum data rate would have
