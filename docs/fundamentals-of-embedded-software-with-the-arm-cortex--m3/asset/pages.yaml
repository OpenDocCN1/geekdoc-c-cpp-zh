    # 7.2.4 The “If-Then” (IT) Instruction


    We learned in Chapter 5 that branch instructions stall the instruction pipeline,
    causing performance to suffer. When an if statement controls a short sequence
    of instructions, it often executes faster to always fetch the instructions but
    simply use the flags to enable or disable their execution phase (Figure 7-5).


    The IT instruction makes the execute phase of one to four following instructions
    conditional. The conditions can be all the same, or some of them can be the logical
    inverse of the others. The conditional instructions following the IT instruction
    form the IT block.'
