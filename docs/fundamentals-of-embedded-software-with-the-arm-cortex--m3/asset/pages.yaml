    # 11.2.2 Refining Global Scope


    In C, objects declared outside of all functions are said to have global scope.
    These declarations are usually placed at the top of the source file (or in a header
    file included at the top of the source file).


    But global really means that the identifier is accessible only from the point
    of declaration to the end of the file. Thus, one simple way to reduce the scope
    of a global variable (within the context of the file) is to position its declaration
    as near to the end of the source file as possible (i.e., just before the first
    function that uses it). The syntax rules of the language will then protect against
    any accidental misuse of the identifier occurring in the statements prior to the
    declaration.


    When a program consists of multiple source files as in Figure 11-2, global objects
    defined in one file can be referenced by code in any other file, provided that
    two conditions are satisfied.


    +   1. The file containing the reference to a global object must declare it using
    the extern keyword (or else a separate instance may be created).


    +   2. The file containing the definition of the global must not use the keyword
    static in its declaration.'
