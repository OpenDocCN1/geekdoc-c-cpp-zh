    A region of memory is allocated to an object when it is created. C offers three
    basic types of memory allocation as summarized in Table 11-2: static, automatic,
    and dynamic. Each was designed for a different purpose; understanding their behavior
    is crucial in order to take advantage of their capability.


    # 11.4 AUTOMATIC ALLOCATION


    Automatic memory allocation is the default allocation method inside functions.
    Although not required, the keyword auto may be added as a declaration prefix to
    make the allocation method explicit.


    Automatic objects are created when memory is allocated for them from the stack;
    this occurs on every entry to their containing function. Initialization is specified,
    it occurs on every entry to the containing block. For example, the automatic object
    called "y" in Figure 11-3 is created on entry to function "foo," and is initialized
    every iteration of the for loop. The memory location of an automatic object remains
    fixed during the execution of the function; but the object is destroyed and its
    memory released on return from the function; this allows the same region of memory
    to be reused when needed for other automatic objects. Functions may return the
    value2 of an automatic variable, but should not return its address, since the
    variable no longer exists once the function has returned.


    The obvious disadvantage of automatic allocation is the lack of persistence. That
    is, an automatic object declared within the body of a function will not retain
    its value from one invocation of the function to another. The advantage of automatic
    allocation is conservation of memory through reuse. More importantly, the program
    manages the reuse of this memory resource automatically in a manner that is transparent
    to the programmer.'
