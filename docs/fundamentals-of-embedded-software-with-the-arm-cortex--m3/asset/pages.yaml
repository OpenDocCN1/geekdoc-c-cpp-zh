    # 7.4 IMPLEMENTING FUNCTIONS


    To write a function in assembly language to be called from a high-level language
    requires much more than just understanding how control is transferred from the
    calling program to the function and back. How parameters are passed and how the
    return value is retrieved are predetermined by the way in which the compiler translates
    a C function call into a sequence of assembly language instructions. Within the
    function, we will see that the design of the compiler also establishes certain
    rules governing the preservation, allocation, and the use of registers for temporary
    results. We must work within these constraints, but with the fundamental objective
    of optimizing performance.


    # 7.4.1 Function Call and Return


    The two instructions most commonly used to call and return from C functions are
    shown in Table 7-5. The Branch and Link (BL) instruction saves the return address
    (the address of the instruction immediately after the BL instruction) in register
    LR and then branches to the entry point address of the function. LR is then used
    with the Branch Indirect (BX) instruction to return from the called function by
    copying the content of LR back into the program counter.


    Almost any instruction that copies the return address into PC can be used to cause
    a return. Although it may seem that “BX LR” is equivalent to “MOV PC,LR,” the
    latter is


    | Instruction | Operation | [S] | Notes |

    |---|---|---|---|

    | BL label | LR ← return address;<br>PC ← address of label | | Subroutine call
    |

    | BX Rn | PC ← Rn | | Subroutine return when Rn = LR |'
