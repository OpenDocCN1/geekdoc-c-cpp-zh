  md: 'Since ptr2word contains the address of array[0], we know that *ptr2word is
    a reference to the content of array[0]. Similarly, the pointer expression ptr2word
    + 1 is the address of array[1], and the pointer expression ptr2word + k is the
    address of array[k]. What is important is to realize that each element of the
    array consists of 4 bytes so that if the address of array[0] is 1000, then the
    address of array[1] would be 1004. This means that when we write ptr2word + 1,
    we are actually adding 4 to the address, not 1. For example, the C assignment
    statement


    ```

    ```

    *(ptr2word + 5) = 0 ; // equivalent to: array[5] = 0 ;

    ```

    ```


    would be translated to the following ARM assembly:


    ```

    ```

    LDR R0,=0 ;get the constant zero

    LDR R1,ptr2word ;get the address held in "ptr2word"

    STR R0,[R1,#20] ;store zero at address 4*5 bytes higher in memory

    ```

    ```


    If we replace the constant 5 with an integer variable k, as in:


    ```

    ```

    *(ptr2word + k) = 0 ; // equivalent to: array[k] = 0 ;

    ```

    ```


    then the ARM assembly code becomes:


    ```

    ```

    LDR R0,=0 ;get the constant zero

    LDR R1,ptr2word ;get the address held in "ptr2word"

    LDR R2,k ;get the integer held in "k"

    STR R0,[R1,R2,LSL#2] ;store at address 4k bytes beyond pointer

    ```

    ```


    Being able to left shift the content of a register used in the address calculation
    is an easy way to multiply by a power of 2, and particularly useful because we
    normally work with data that is 1, 2, 4, or 8 bytes in width.


    Also remember that the difference of two pointers is not the difference in the
    addresses that they hold, but rather the difference in objects. For example, consider
    the following declarations:


    ```

    ```

    int32_t array[100]; // an array of 100 words of 4 bytes each

    int32_t * p1 = &array[10];

    int32_t * p2 = &array[20];

    ```

    ```


    If the array begins at address 1000, then p1 will be initialized to the address
    1040 and p2 to 1080. However, the value of expression p2 – p1 is not 40 (the difference
    in addresses), but 10 (the difference in objects). To calculate this value in
    assembly requires a subtraction followed by a division by 4:


    ```

    ```

    LDR R0,p1 ;get the address held in p1

    LDR R1,p2 ;get the address held in p2

    SUB R2,R1,R0 ;R2 <- the difference in addresses

    ASR R0,R2,#2 ;R0 <- R2, arithmetic shift right by 2 (divide by 4)

    ```

