  md: '# 11.6 THREE PROGRAMS TO DISTINGUISH STATIC FROM AUTOMATIC


    Sometimes it is easier to understand something that you have seen in action. The
    output from the three programs shown in Example 11-2 provides a bit of insight
    into how static and automatic object allocation differ with respect to creation,
    initialization, and destruction of objects.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_214_0.png)


    # 11.6.1 Object Creation


    Example 11-2 is intended to provide some insight into how object creation differs
    between objects with automatic allocation and those with static allocation. The
    program consists of functions main, f1, and f2. Function f1 declares two integer
    objects: one called “a” with automatic allocation. Another called “s” with static
    allocation. Function f1 is called three times: first by the main program, then
    by f2 (which is called by main), and then from main again.


    In all three cases, the address of the static object “s” remains unchanged, which
    indicates that there is a single instance of “s” whose location in memory remains
    fixed throughout the entire execution of the program.


    The address of the automatic object “a”, however, changes when f1 is called indirectly
    by f2 as opposed to when it is called directly by the main program. Therefore,
    its location clearly does not remain fixed, which indicates that it is created
    (and destroyed) several times during the execution of the program.


    # 11.6.2 Object Initialization


    Example 11-3 is intended to provide some insight into how object initialization
    differs between objects with automatic allocation and those with static allocation.
    The program consists of functions main, f1, f2, f3, and f4.


    In functions f1 and f2, the allocation method used for the integer object has
    no effect on the function behavior. In both functions, the integer is reset to
    zero each time the function is invoked by an executable statement in the body
    of the function.'
