    # 9.2.4 Preemptive Multithreading


    In preemptive multithreading, hardware interrupts are used to trigger the context
    switch, as shown in Figure 9-11. When an external event occurs, an associated
    hardware ISR is invoked. The ISR includes a call to a kernel routine that lets
    the thread that is waiting for the data know that it is now available. The kernel
    then makes a decision about which thread needs the processor the most (which is
    usually the one to process the data), and performs a context switch so that the
    ISR returns to it instead of the interrupted thread. System response time is significantly
    improved because the sequencing of threads is appropriately driven by the order
    of external events.


    Preemptive multithreading eliminates the programmer''s obligation to include explicit
    calls to the kernel to yield the processor within the various background threads.
    The programmer no longer needs to worry about how frequently the yield routine
    is called; it is called only when needed—that is, in response to external events.


    # 9.3 SHARED RESOURCES AND CRITICAL SECTIONS


    Consider what would happen if two or more threads simultaneously sent data to
    the same (shared) disk, printer, network card, or serial port. If access were
    not coordinated'
