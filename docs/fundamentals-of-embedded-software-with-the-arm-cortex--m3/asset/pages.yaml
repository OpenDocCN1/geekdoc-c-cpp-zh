- pgno: 98
  md: '# CHAPTER 5

    Programming in Assembly

    Part 1: Computer Organization


    Application software for today''s embedded systems is written almost exclusively
    in a high-level language such as C, yet there will always be situations that require
    portions of the code to be written in the low-level instructions of the processor.
    Writing in assembly language is a tedious and error-prone exercise that should
    be avoided unless absolutely necessary. There are, however, a couple of situations
    in which programming in assembly is appropriate or necessary:


    +   1. There may be parts of a program where absolute speed is critical.

    +   Programming in assembly can result in more effective use of the central processing
    unit (CPU)''s registers and instruction set, thus producing code that runs faster
    than that produced by a compiler.


    +   2. There may be no other way to access a particular feature of the hardware.

    +   For example, the C compiler may not provide library functions to access I/O
    ports or to disable or enable the interrupt system. Or the compiler may generate
    code that does not take advantage of some of the more specialized instructions
    of the CPU, such as those that implement bit and byte reversal, bit-field extraction
    and insertion, binary-ASCII conversion, table lookups, or high-speed copying of
    entire blocks of data.


    For most of the code, however, it is better to write it in a high-level language.
    Using a high-level language is less tedious, more reliable, and inherently more
    productive. The speed penalty is usually not an issue at the upper organizational
    levels of a program, and the algorithms are more easily expressed and comprehended
    in this context.


    Mastering assembly language programming takes time and involves becoming familiar
    with a lot of new and detailed information covered in the pages that follow. Once
    mastered, however, you will have a vastly stronger understanding of how computers
    work, how the code you write in C is translated into machine language, and thus
    a better understanding of how to write effective and efficient programs in C.


    Writing code in assembly is tedious and error-prone. Thus, our approach will be
    to avoid assembly whenever possible, writing the vast majority of our code in
    C. When assembly is necessary or desirable, it will be used only to create small
    subroutines (functions) called from C. Our application programs will be a mix
    of C and assembly, and will demand a thorough understanding of the function call/return
    interface.


    First, we must learn about the internal organization of a simple computer—its
    internal components and how calculations are performed as data is manipulated
    and moved from one part to another.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Every computer consists of three major components: (1) a CPU, where operations
    are performed, (2) a memory, where data is stored, and (3) an input/output (I/O)
    system, to gather input data or to output results. The three units are interconnected
    by groups of wires called buses.


    Desktop processors use one set of buses to connect the CPU and memory, and another
    to connect the CPU and I/O. Data transferred between memory and I/O devices normally
    goes through and is coordinated by the CPU. When greater data transfer rates are
    required, a Direct Memory Access (DMA) controller can be added to let perform
    these transfers. Data is transferred faster because the CPU is no longer required
    to execute instructions to transfer the data, and the CPU is free to perform its
    own calculations concurrent with the data transfers (Figure 5-1).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_99_0.png)


    Most modern embedded processors use a single interconnection path in a configuration
    known as memory-mapped I/O. The 32-bit address of today''s processors is capable
    of referencing 4 GB (2^32 bytes) of information. Since this is far more than would
    ever be required for an embedded application, a portion of the address space is
    reserved for and decoded by the I/O devices. This eliminates the need for separate
    I/O instructions since all of the regular instructions for accessing memory can
    then be used to access I/O devices. Most embedded applications do not require
    the higher data transfer rates and omit the DMA controller entirely. If a DMA
    controller is added, performance would be a little slower anyway because each
    transfer would require a read cycle followed by a write cycle, whereas two interconnection
    paths would allow the cycles to occur simultaneously (Figure 5-2).


    Within the computer, the CPU retrieves data from memory, operates on it, and stores
    the results back in memory. Information flows between the CPU and memory over
    three sets of wires called the address bus, the data bus, and the control and
    status bus. The CPU places information on the address bus to tell the memory which
    data to access and uses the control and status bus to determine the direction
    of information transfer and to coordinate timing. The data itself is transferred
    over the data bus.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_100_0.png)


    FIGURE 5-2 Configuration of a typical embedded processor.


    # 5.1 MEMORY


    We already know that computers store data using bits of 1''s and 0''s. For convenience,
    these bits are usually organized into bytes of 8 bits. To distinguish one byte
    from another, each byte is assigned a unique address. Whenever we want to examine
    the contents of a byte in memory, or to replace its contents, we must specify
    its address. An address is simply a binary number. The number of bits used to
    specify an address is fixed and limits the maximum number of bytes that the memory
    can hold. For example, if an address consists of 20 bits, then the maximum number
    of different addresses is 2^20. This number is close to 1 million, and so the
    corresponding memory capacity is often referred to as 1 megabyte. Today''s 32-bit
    processors have a 32-bit address bus that can address 4 GB (2^32 bytes) of memory
    (Figure 5-3). Adjacent bytes are combined to form 16-bit half words, 32-bit words,
    and 64-bit double words. By convention, the address of these larger operands is
    always specified as the address of their least significant byte. For example,
    the 16-bit half word whose


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_100_1.png)


    FIGURE 5-3 Main memory of a computer.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '32-bit address is 104 consists of 2 bytes located at addresses 104 and 105.
    There are two possible byte orderings: “little endian” and “big endian.” The popular
    Intel processors use little-endian format, in which the least significant byte
    of information is stored at the lowest address. In this format, the address of
    a 32-bit quantity is the same as the address of its least significant byte. Little-endian
    format is illustrated in Figure 5-4. Motorola processors and all data transmitted
    over the Internet use big-endian format, in which the order is reversed. ARM processors
    are essentially little-endian architectures, although they do provide limited
    support for accessing big-endian data.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_101_0.png)


    FIGURE 5-4 Little-endian byte and bit ordering (most significant bits and bytes
    at far left).


    There are two fundamental operations that memory can perform: reads and writes.
    When data is written into memory, it replaces the previous contents of that location,
    which are discarded. A memory-read operation is nondestructive, and retrieves
    a copy of the contents of a memory location. Physically, however, memory uses
    a 32-bit data bus so that it can transfer as many as 4 bytes in a single read
    or write cycle.1 Sometimes, less than 4 bytes are actually used, either because
    the operand is a byte or a half word or because the operand is misaligned—that
    is, split across two adjacent 32-bit memory words. Misaligned or double-word operands
    require more than one memory cycle.


    # 5.1.1 Data Alignment


    To understand why alignment is important, consider a byte-addressable memory with
    a data bus that is 32 bits (4 bytes) wide. Every memory read delivers 32 bits
    (4 bytes) of information. The first 16 bytes of memory (addresses 0 to 15) are
    arranged as physical


    1 Physically, the memory is organized as 2^30 32-bit words. The most significant
    30 bits of the 32-bit address select the word, while the remaining bits are used
    to select the appropriate byte(s) within that word.'
