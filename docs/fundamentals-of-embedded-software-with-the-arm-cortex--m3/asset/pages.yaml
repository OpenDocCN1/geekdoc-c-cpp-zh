  md: 'easily imagine that the odometer of a new car might roll over backwards from
    00,000.0 to 99,999.9 miles if you drive it far enough in reverse.


    Rollover is a consequence of fixed precision. For example, the odometer in your
    car uses a fixed precision of six decimal digits. A computer stores numbers by
    using fixed precision in multiples of 8 bits and suffers similar consequences.
    Counting up with 8 bits will eventually cause a rollover from 11111111 to 00000000;
    counting down eventually rolls over backward from 00000000 to 11111111 (and provides
    some insight into how negative numbers should be represented).


    When binary patterns are used to represent unsigned values, a pattern of all 0''s
    is assigned to the value zero and the pattern of all 1''s corresponds to the maximum
    possible value that can be represented. Rolling over in either direction amounts
    to exceeding the range of representation and is known as overflow.


    Rollover and overflow, however, are not synonymous. Rollover describes a behavior
    of pattern sequence, while overflow describes an arithmetic behavior. Whether
    rollover causes overflow depends on how the patterns are interpreted as numeric
    values. For example, when we go to 2''s-complement signed numbers, we will see
    that a rollover occurs in the middle of the range without overflow, while overflow
    off either end of the range occurs without rollover.


    # 2.3 BINARY REPRESENTATION OF INTEGERS


    Integers can be either signed or unsigned. Both are stored using a fixed number
    of bits. If the integer is signed, one of these bits indicates whether the value
    is positive or negative, leaving one fewer bits available for the magnitude. Thus,
    the range of magnitudes that can be represented by using unsigned integers is
    twice that of signed integers. Sometimes, this little bit of extra range can be
    useful, and so some modern programming languages provide both types.


    Sometimes, a programmer will declare an integer to be unsigned, not because of
    the greater magnitude range, but simply because the values are never expected
    to be negative. For many applications, such as counting or measuring distance
    or time, unsigned integers are more appropriate. Making the integer unsigned then
    becomes a kind of documentation that provides a little more insight into how the
    integer is used within an algorithm.


    It is important to recognize, however, that whether an integer is signed or unsigned
    depends entirely on how you decide to interpret its bit pattern. No information
    is stored in the pattern that specifies how it should be interpreted. For example,
    if the 8-bit pattern 10100111 is interpreted as an unsigned number, then its decimal
    value is 167; if interpreted as a signed (2''s complement) integer, then its decimal
    value is -89.


    As we will see later in this chapter, when you program in a high-level language,
    the compiler selects the appropriate instruction according to how the integer
