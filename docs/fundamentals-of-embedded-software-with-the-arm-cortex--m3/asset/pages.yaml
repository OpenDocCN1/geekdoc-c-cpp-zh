- pgno: 103
  md: 'The positioning and combining of bytes is done in hardware much faster than
    the time required for a single memory cycle. However, each memory cycle time is
    usually significantly slower than the basic clock cycle of a processor, and represents
    the primary performance bottleneck. Hence, compilers intentionally allocate memory
    for 32-bit operands so that they start on an address that is divisible by 4, and
    allocate memory for 16-bit half words so that they start on an address that is
    divisible by 2.


    # 5.2 THE CENTRAL PROCESSING UNIT


    The CPU of a computer is where the computation occurs. It consists of several
    components, including the arithmetic and logic unit (ALU), a set of registers,
    and a control unit. One or more data and control buses interconnect these components.


    Within the CPU, the ALU performs arithmetic operations (e.g. addition, subtraction),
    bit manipulation operations (e.g. bitwise AND, OR, XOR, and shifting), and is
    where conditional branch decisions are made. Such low-level operations are characterized
    by their simplicity, requiring only one or two input operands and producing a
    single output result. Since only a single operand can reside on the memory data
    bus at any one time, the ALU needs one or more registers to hold the other operands
    and the result. In the simplest configuration, a single register called the accumulator
    (ACC) is used, as shown in Figure 5-5.


    The ALU can transfer one input through to the accumulator unmodified; this allows
    preloading the accumulator with one of the two operands. One input of the ALU
    is always connected to the accumulator; this allows the ALU to combine the current
    contents of the accumulator with a copy of the contents of some memory location


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_103_0.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'and to store the result back in the accumulator. This result can then be stored
    in memory via the return path from the accumulator back to the memory data bus.
    Using this structure to add two numbers together and to store the results in memory
    requires three steps:


    ```

    ACC <- MEM[adrs_of_op1] ;Copy 1st operand from memory into ACC

    ACC <- ACC + MEM[adrs_of_op2] ;Replace contents of ACC by sum

    MEM[adrs_of_result] <- ACC ;Store contents of ACC into memory

    ```


    Most CPUs have more than one register that can serve as an accumulator. In addition
    to specifying the address of the memory operand, instructions for such machines
    must also specify which of these registers to use:


    ```

    REG[r] <- MEM[adrs_of_op1] ;Copy 1st operand from memory into register ''r''

    REG[r] <- REG[r] + MEM[adrs_of_op2] ;Replace contents of register ''r'' by sum

    MEM[adrs_of_result] <- REG[r] ;Store contents of register ''r'' into memory

    ```


    The number of registers varies from one computer to another, but is typically
    around 16.


    Processors that use what is known as a “Load/Store” architecture require that
    all operands reside in registers—that is, that the only operations that may access
    memory are those that merely load (read) data from memory into a register or store
    (write) the contents of a register into memory:


    ```

    REG[r1] <- MEM[adrs_of_op1] ;Copy 1st operand from memory into register ''r1''

    REG[r2] <- MEM[adrs_of_op2] ;Copy 1st operand from memory into register ''r2''

    REG[r3] <- REG[r1] + REG[r2] ;Perform the addition, leaving the result in a 3rd
    register

    MEM[adrs_of_result] <- REG[r3] ;Store contents of register ''r3'' into memory

    ```


    # 5.2.1 Other Registers


    There are a number of other registers inside the CPU. Each of these has a dedicated
    purpose. For example, every CPU has an instruction register that holds the current
    instruction, a program counter (PC) to specify the address of the next instruction
    to be executed, and a status register to hold information about the most recent
    result produced by the ALU. Other common special-purpose registers include a stack
    pointer (SP), used to emulate a stack in memory, and index registers for subscripting
    arrays.


    # 5.2.2 The Fetch-Execute Cycle


    The control unit of the CPU is responsible for fetching instructions from memory,
    decoding them, and then executing the instructions by directing the appropriate
    sequence of data transfers and operations among the various parts of the computer.
    This sequence repeats ad infinitum as the basic fetch-execute cycle of the computer
    (Figure 5-6).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_105_0.png)


    FIGURE 5-6 The fetch-execute cycle of the control unit.


    During the fetch phase, the control unit places the current contents of the PC
    on the memory address bus and initiates a memory read operation to retrieve the
    first byte of an instruction from memory While waiting for the memory read to
    complete, the control unit increments the PC in preparation for the retrieval
    of the next instruction byte. When the memory has completed its read, the control
    unit copies the data from the memory data bus into the instruction register (Figure
    5-7).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_105_1.png)


    FIGURE 5-7 CPU components used during the fetch phase.


    The detailed sequence of events in the fetch phase is as follows:


    +   1. Memory Address Bus ← Program Counter

    +   2. Start Memory Read Operation

    +   3. Increment Program Counter

