- pgno: 168
  md: '# 8.4 ESTIMATING I/O PERFORMANCE CAPABILITY


    I/O software design must consider the requirements and limitations of the I/O
    device. In general, there are three strategies: polled waiting loops, interrupt-driven
    I/O, and DMA. The strategy we choose must be capable of data rates fast enough
    to keep up with the demands of the device, and usually at the lowest possible
    cost and complexity.


    Estimating I/O performance requires knowing how fast our code will execute. Table
    8-2 summarizes the execution time of Cortex-M3 instructions in terms of processor
    clock cycles. There are exceptions, such as executing any instruction that effectively
    branches by loading a new value into the program counter. However, the table should
    apply to vast majority of instructions.


    | Instructions | Clock Cycles |

    | :--- | :--- |

    | PUSH, POP, LDM, STM | 1 + #regs |

    | SDIV, UDIV | 2-12 |

    | SMLAL, UMLAL | 4-7 |

    | SMULL, UMULL | 3-5 |

    | Unconditional branch (B, BL, BX) | 2-4 |

    | Conditional branch | Successful | 2-4 |

    | | Failed | 1 |

    | LDRD, STRD | 3 |

    | ADR, MLA, MLS, & all LDR''s and STR''s | 2 |

    | All other instructions | 1 |


    *a Assumes memory and processor run at the same speed.*


    The execution time of some instructions is given as a range. For example, the
    time required to execute a multiply or divide depends on the values of the operands.
    In most cases we want to use the worst-case value so that our estimate of execution
    time is conservative. When a conditional branch instruction is used in a loop,
    however, it is usually more accurate to consider whether the majority will branch
    or fall through and use the corresponding cycle count.


    # 8.4.1 Polled Waiting Loops


    Polled waiting loops use software to test the status of a device before transferring
    each data byte, as shown in Figure 8-10. Note the use of the keyword volatile
    on the third parameter of the function. That parameter is a pointer to the memory-mapped
    address space of the UART. The UART status ports are read-only but change to reflect
    changing UART hardware status. The keyword volatile is required to prevent certain
    compiler optimizations that would cause the code to fail. Without it, optimized
    code could read the status port into a register once prior to entering the while
    loop, and the loop condition converted to a test of the register contents rather
    than reloading the UART status from memory on each iteration of the loop.'
  merge: -1
  img_proc: true
