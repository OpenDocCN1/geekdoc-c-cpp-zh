- pgno: 43
  md: '# 2.3.6 Range and Overflow


    There are two possible values (0 and 1) for every bit of an n-bit binary number,
    so there are a total of 2^n different patterns of 0''s and 1''s that can be used
    to represent numbers consisting of n bits. When the patterns are used to represent
    unsigned integers, the range of possible values is thus 0 to 2^n - 1. For example,
    an 8-bit quantity can hold an unsigned value in the range of 0 to 2^8 - 1 (0 to
    255).


    When used to represent signed integers, half the patterns are assigned to positive
    values and half to negative values. Half of 2^n is 2^(n-1), so the nonnegative
    half of the range covers values from 0 to 2^(n-1) - 1. The other 2^(n-1) patterns
    are assigned to the negative values from -1 to -2^(n-1). Thus, the entire range
    of values for a 2''s-complement signed number is from -2^(n-1) to +2^(n-1) - 1.
    For example, an 8-bit quantity can hold a signed value in the range from -2^7
    to +2^7 - 1 (-128 to +127).


    An integer arithmetic operation that produces a value beyond the upper limit of
    the data type''s range causes the value to "wrap around" (overflow) back into
    the lower portion of the range. As illustrated in Figure 2-7, adding 20 to an
    8-bit unsigned number holding a value of 250 yields a result of 14. The difference
    (256) between the proper result of 270 (which requires 9 bits) and the actual
    result of 14 (the least significant 8 bits) corresponds to the weight of the 9th
    bit that cannot be stored in the result.


    With signed numbers, overflow never occurs when adding numbers with different
    signs or subtracting numbers with the same sign; overflow is possible only when
    adding two integers of the same sign or subtracting two of different signs. For
    example, subtracting 17 from an 8-bit signed number holding a value of -120 will
    yield a result of +119. The difference (256) between the proper result of -137
    (which requires 9 bits) and that of +119 (the least significant 8 bits) corresponds
    to the weight of the 9th bit that cannot be stored in the result.


    When overflow does occur, it is because magnitude information has propagated into
    the sign bit position. For example, for a number to appear positive, the most
    significant bit must be 0, but as its magnitude increases, 1''s begin to appear
    further and further to the left. Conversely, for a number to appear negative,
    the most significant bit must be 1, but as its magnitude increases, 0''s begin
    to appear further and further to the left.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_43_0.png)


    FIGURE 2-7 Overflow beyond the limits of an integer data type.'
  merge: -1
  img_proc: true
