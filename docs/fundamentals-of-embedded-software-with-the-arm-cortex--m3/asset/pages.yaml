    \    ; update enqueue index          2\nADD  R2,R2,#1              1\nAND  R2,R2,#0x3F\
    \           ; increment & wrap (0 to 63)    1\nSTR  R2,rs232InpNQIndex    2\n\
    LDR  R3,rs232InputQueue    ; R3 <- address of buffer       2\nSTRB R0,[R3,R2]\
    \            ; store data into buffer        2\nLDR  R2,rs232InputCount    ; update\
    \ #items in queue        2\nADD  R2,R2,#1              1\nSTR  R2,rs232InputCount\
    \    2\nBX   LR                    ; return                        4\n       \
    \                      Tail - chaining time between successive ISRs:   6\n   \
    \                          Clock cycles: 29\n                             Execution\
    \ time: 29 x 20 nsec = 580 nsec\n                             Maximum Data Rate:\
    \ 10^9/580 = 1.7 MB/sec\n```\n\nFIGURE 8-13 Performance analysis of a RS232 serial\
    \ interrupt handler.\n\npractice, the code for inserting the data into the queue\
    \ would most likely be a call to a routine in a real-time kernel that also changes\
    \ the state of a pending thread and may possibly result in a context switch. This\
    \ additional complexity is omitted here for simplicity but means that our resulting\
    \ estimate of maximum data rate performance will be somewhat optimistic.\n\nThe\
    \ maximum data rate corresponds to back-to-back interrupts from the same device\
    \ and presumes that no other higher-priority interrupts or exceptions preempt\
    \ this code. The total time from one transfer to the next will then be the sum\
    \ of the execution time of the ISR, and the tail-chaining between any two ISRs.\
    \ Using the same assumptions about clock rate and memory speed as before, the\
    \ total time will be approximately 580 nsec, yielding a maximum data rate of 1.7\
    \ MB/sec.\n\nOne way to improve the data-transfer rate of interrupt-driven I/O\
    \ is to transfer an entire block of data inside the ISR, using code similar to\
    \ that used with the polled waiting loop method. This approach avoids the substantial\
    \ overhead associated with processing an interrupt for every data byte to be transferred\
    \ by processing several data bytes during each interrupt."
