    and/or target processor to another. C compilers are available for a number of
    different target processors, and they generate very efficient code.


    Despite the popularity of C++ and Java for desktop application programming, they
    are not used extensively in embedded systems because of the large run-time overhead
    required to support some of their features. For example, even a relatively simple
    C++ program will produce about twice as much code as the same program written
    in C, and the situation is much worse for large programs that make extensive use
    of the run-time library.3


    # 1.7 HOW IS BUILDING AN EMBEDDED APPLICATION DIFFERENT?


    You should already be familiar with the tools and software components used to
    build a desktop application program and load it into memory for execution. That
    process is summarized in Figure 1-10. A compiler and/or an assembler are used
    to build one or more object files that are linked together with a run-time library
    to form an executable image that is stored as a file on the disk.'
