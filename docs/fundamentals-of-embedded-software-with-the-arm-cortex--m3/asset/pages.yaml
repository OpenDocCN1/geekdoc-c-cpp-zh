- pgno: 56
  md: 'Differences in how multiplication and division work for signed versus unsigned
    integers will require us to use different machine instructions for those operations
    as well.


    # 3.2 MULTIPLICATION AND DIVISION


    Compared to addition or subtraction, multiplication and division are inherently
    more complex operations that involve a number of intermediate calculations. Some
    of the least expensive and older processors do not even provide multiply or divide
    instructions, requiring that these operations be implemented in software. Designing
    a processor with multiply and divide instructions involves a design trade-off
    between chip real estate and execution time. One solution is to implement the
    intermediate steps as a sequential process that requires only a small amount of
    digital circuitry but results in a significantly longer execution time. On the
    other hand, the execution time can be made faster, but only by calculating the
    intermediate steps in parallel by using more digital circuitry. These issues have
    led programmers to look for situations in which there are faster and more efficient
    ways to multiply and divide.


    # 3.2.1 Signed Versus Unsigned Multiplication


    Computers often have two different multiply instructions: one for unsigned operands
    and the other for signed (2''s-complement) operands. What is interesting is that
    the difference between the two only appears in the most-significant half of their
    double-length product.


    Consider two 4-bit operands whose bit patterns are 1100 and 0110. As unsigned
    numbers, their decimal equivalents are 12 and 6 whose product is 72, represented
    as the double-length product 0100 1000. However, if interpreted as signed 2''s-complement
    numbers, their decimal equivalents are -4 and +6 whose product is -24, represented
    as 1110 1000.


    In a high-level programming language like C, when you multiply two numbers of
    the same type, the product is also the same type. In other words, the product
    of two n-bit integers will also be an n-bit integer. This means that the code
    generated by the compiler actually discards the most significant half of the product,
    and thus the compiler could use either a signed or an unsigned multiply instruction.


    On some processors, a signed multiply may take slightly longer to execute than
    an unsigned multiply. So, if you are programming in assembly and store a product
    in a variable the same size as the operands used to produce it, then always use
    an unsigned multiply!


    # 3.2.2 Shifting Instead of Multiplying or Dividing by Powers of 2


    The least expensive microprocessors sometimes do not provide integer multiply
    or divide instructions, or execute such instructions much more slowly than the
    instructions for integer addition or subtraction. Multiplying by a power of 2,
    however, is easily implemented as a left-shift that will often execute in very
    few clock cycles:


    ```

    2^k × A = A << k (A is shifted left by k bits)

    ```'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'This works for both positive and negative values of A.


    Positive operands can be divided by a power of 2 by right shifting, as in:


    ```

    A = 2^k => A >> k (A is shifted right by k bits)

    ```


    However, negative operands are more problematic. First, we must use an “arithmetic”
    right shift that preserves the sign bit. Rather than entering a 0 into the most
    significant bit position as in a regular (“logical”) right shift, an arithmetic
    right shift fills the most significant bit position with a copy of its previous
    value. For example, dividing the 8-bit 2’s-complement number –0810 (10110000₂)
    by 2¹ should produce –4010 (11011000₂). Repeating the process divides by higher
    powers of 2. That is, arithmetically shifting –8₁₀ right twice produces 11101100₂
    (–20₁₀).


    Another issue is the difference between an arithmetic right shift and an integer
    division that occurs when the dividend is both negative and odd. For example,
    –1 divided by 2 is 0, but if you shift it right arithmetically, the result will
    be –1. The problem is the different way in which the two operations handle the
    fractional part of the quotient. Dividing –15 by 2 should ideally produce a quotient
    of –7.5, but of course integer division discards the fractional part of the result
    leaving only the integer –7. While division always truncates toward 0, an arithmetic
    right shift always truncates toward negative infinity. This difference only shows
    up with negative odd numbers:


    | Operand | Operation | True Quotient | Integer Quotient | Arithmetic Right Shift
    |

    | :--- | :--- | :--- | :--- | :--- |

    | Positive & even | +10 ÷ 2 | +5.0 | +5 | +5 |

    | Positive & odd | +11 ÷ 2 | +5.5 | +5 | +5 |

    | Negative & even | –10 ÷ 2 | –5.0 | –5 | –5 |

    | Negative & odd | –11 ÷ 2 | –5.5 | –5 | –6 |


    The error introduced for negative odd dividends can be corrected if we always
    reduce the magnitude of a negative dividend by one before shifting:


    | Operand | Original Operation | Adjusted Dividend | Arithmetic Right Shift |

    | :--- | :--- | :--- | :--- |

    | Positive & even | +10 ÷ 2 | +10 | +5 |

    | Positive & odd | +11 ÷ 2 | +11 | +5 |

    | Negative & even | –10 ÷ 2 | –9 | –5 |

    | Negative & odd | –11 ÷ 2 | –10 | –5 |


    The pre-shift adjustment can be implemented as an “if” statement that only adds
    +1 to the dividend if it is negative. Processors, however, are designed to optimize
    the execution of instructions fetched sequentially from memory because the vast
    majority of code is a “straight-line” that does not branch. Any deviation from
    sequential execution (as inherent in an “if” statement) disrupts the sequential
    flow and causes a small delay that we prefer to avoid when possible. Fortunately,
    there is a better way to do the pre-shift adjustment.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Many processors can extend the sign of an integer using a single instruction,
    effectively doubling the number of bits in its representation:

    11101010 -> 11111111 11101010, or

    00101011 -> 00000000 00101011


    When interpreted as an integer, the sign extension (the most significant half
    of the result) will be 0 for positive operands and -1 for negative operands. This
    can be used to correct the result of an arithmetic right shift by subtracting
    the sign extension from the operand before the shift is applied.


    # 3.2.3 Multiplying by an Arbitrary Constant


    Multiplication by constants other than powers of 2 can sometimes be implemented
    more efficiently using a sequence of shifts, additions, and subtractions. Depending
    on the processor, these instructions can execute as much as 50 times faster than
    a multiplication and thus can be an effective alternative. There is, however,
    usually more than one possible sequence for any particular constant and the optimal
    choice depends on the constant''s binary bit pattern. In general, constants whose
    representation contains isolated 1''s are best implemented using addition, while
    those containing a sequence of 1''s are best implemented using subtraction:


    | Decimal Constant | 8-bit Binary Representation | Optimal Decomposition | Number
    of Instructions |

    |---|---|---|---|

    | +74 | 01001010 | 2^6A + 2^3A + 2^1A | 3 shifts and 2 additions |

    | +30 | 00011110 | 2^5A - 2^1A | 2 shifts and 1 subtraction |

    | -14 | 11110010 | -2^4A + 2^1A | 2 shifts and 1 subtraction |

    | -17 | 11101111 | -2^4A - 2^0A | 1 shift and 2 subtractions |


    Rearranging the decomposition can make implementation a little easier to envision.
    For example, the decomposition of +9 can be rewritten as 2^1 x (A + 2^2 x (A +
    2^2 A)). By processing the expression from right to left, the sequence of instructions
    becomes:


    +   1. Get a copy of A: -> A

    +   2. Shift left 3 bits: -> 2^3 A

    +   3. Add A: -> A + 2^3 A

    +   4. Shift left 2 bits: -> 2^2 (A + 2^3 A)

    +   5. Add A: -> A + 2^2 (A + 2^3 A)

    +   6. Shift left 1 bit: -> 2^1 (A + 2^2 (A + 2^3 A))'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Many modern reduced instruction set computer (RISC) microprocessors (such as
    the ARM family of processor chips) are able to pre-shift the operand of any instruction,
    allowing an even more efficient implementation.


    +   1. Get a copy of A, left-shifted 6 bits: → 2^6 A

    +   2. Add A, left-shifted 3 bits: → 2^5 A + 2^2 A

    +   3. Add A, left-shifted 1 bit: → 2^5 A + 2^3 A + 2^1 A


    # 3.2.4 Dividing by an Arbitrary Constant


    If your divisor is a constant but no divide instruction is available, it is still
    possible to divide if your processor has a multiply instruction using the principal
    of reciprocal multiplication. In principal, we simply multiply by 1/B instead
    of dividing by B:


    A / B = A x (1/B)


    The problem of course is that 1/B is zero for any B greater than 1. To solve this,
    use 2^k / B instead of 1/B and divide the result by 2^k by simply shifting it
    right (arithmetically) by k bits.


    A x (1/B) = [A x (2^k/B)] x 2^-k


    = [A x (2^k/B)] >> k


    Since a multiply instruction produces a double-length product P, the most and
    least significant halves will always be left in a pair of single-length storage
    locations. P_hi and P_lo. If we choose k to be the same as the fundamental word
    size of the processor, then rather than shifting P to the right by k bits, we
    can simply take the quotient from the more significant half, P_hi.


    Reciprocal multiplication can introduce an error in the quotient. When 2^k/B is
    not a whole number, discarding the fractional part provides a multiplier whose
    value is a little too small. If the difference is large enough, the resulting
    quotient will also be too small. This can be corrected, however, by computing
    the remainder as the dividend minus the product of B times the quotient. If the
    remainder is greater than the divisor, then you must add 1 to the quotient.


    # 3.3 ARITHMETIC FOR FIXED-POINT REALS


    Many embedded application have little or no need for real numbers. When they are
    needed, fixed-point reals are more likely to be found than floating-point for
    a variety of reasons. The processor may not have floating-point instructions,
    a processor with floating-point may add too much cost, or using floating-point
    may cause an unacceptable performance penalty.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Scaling provides a way to process real numbers with the same hardware that
    is used for integers. For example, the 8-bit number 01011110 has a decimal value
    of 94 when interpreted as an integer. However, if we assume that 3 bits are on
    the right of an implied binary point as in 01011.110, then the decimal interpretation
    becomes 11.75. In effect, the integer has been scaled by dividing by $2^3$, where
    the exponent is determined by the number of bits on the right of the binary point.


    As shown in Table 3-1, if you add or subtract two fixed-point real numbers that
    share a common scale factor, the result will also have the same scale factor.


    Operands with different scale factors must be aligned before adding or subtracting.
    To do this, shift one operand until the binary points of both line up and their
    scale factors become equal. If you shift the operand that has fewer fractional
    bits (as shown in Table 3-2), then you must be careful that the required left-shift
    does not cause overflow. If, instead, you shift the operand that has more fractional
    bits, then you must be careful that the required right-shift does not cause a
    loss of precision (as shown in Table 3-3). Either approach could be used, but
    the scale factor of the resulting sum or difference will be quite different.


    | Operand / Result | Bit Pattern | Integer | ~Scale Factor | =Value |

    |---|---|---|---|---|

    | A | 00011.110 | +30 | $2^3$ | +3.750 |

    | B | 00110.011 | +51 | $2^3$ | +6.375 |

    | A + B | 01010.001 | +81 | $2^3$ | +10.125 |

    | A - B | 11101.011 | -21 | $2^3$ | -2.625 |


    | Operand / Result | Bit Pattern | Integer | ~Scale Factor | =Value |

    |---|---|---|---|---|

    | A | 0001001.1 | 19 | $2^1$ | +9.500 |

    | B | 00011.110 | 30 | $2^3$ | +3.750 |

    | $2^2 \times A$ | 01001.100 | 76 | $2^3$ | +9.500 |

    | $2^2 \times A + B$ | 01101.010 | 106 | $2^3$ | +13.250 |


    | Operand / Result | Bit Pattern | Integer | ~Scale Factor | =Value |

    |---|---|---|---|---|

    | A | 0001001.1 | 19 | $2^1$ | +9.500 |

    | B | 00011.110 | 30 | $2^3$ | +3.750 |

    | $B \div 2^2$ | 0000011.1 | 7 | $2^1$ | +3.500 |

    | $A + B \div 2^2$ | 0001101.0 | 26 | $2^1$ | +13.000 |'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'As with any fixed-precision scheme, we have to be careful about overflow. Addition
    and subtraction with fixed-point real numbers can overflow just as easily as with
    integers. If necessary, we can avoid the overflow by pre-shifting both operands
    to the right by 1-bit position, that is, by preadjusting their scale factors to
    trade a bit of precision for one more bit of range.


    Multiplication and division do not require that the binary points of their operands
    be aligned. The number of fractional bits in the product A × B, for example, is
    simply the sum of the number of fractional bits in A plus the number of bits in
    B (Table 3-4). Dividing two fixed-point real numbers is similar to reversing the
    multiplication: the number of fractional bits in the quotient A ÷ B is the number
    of fractional bits in A minus the number in B (Table 3-5).


    You may have noticed that the quotient in Table 3-5 is not exactly accurate⁴ because
    integer division truncates the result to the largest whole number less than or
    equal to the exact quotient. We can improve the accuracy of our result by pre-shifting
    the dividend to the left as much as possible before dividing, as is shown in Table
    3-6. Of course, this changes the scale factor of the dividend (and thus that of
    the quotient), but it provides more fractional bits in the result, for a more
    accurate result.


    # TABLE 3-4 Multiplying Fixed-Point Real Numbers


    | Operand / Result | Bit Pattern | Integer | ·-Scale Factor | =Value |

    |---|---|---|---|---|

    | A | 0000000000111.110 | 30 | 2² | +3.7500 |

    | B | 00000000000110.011 | ×51 | 2² | +12.7500 |

    | A × B | 000001011111.1010 | =1530 | 2⁵ | +478125 |


    # TABLE 3-5 Dividing Fixed-Point Real Numbers


    | Operand / Result | Bit Pattern | Integer | ·-Scale Factor | =Value |

    |---|---|---|---|---|

    | A | 000001011111.1010 | 1530 | 2³ | +478125 |

    | B | 00000000000110.011 | +115 | 2³ | +14.3750 |

    | A ÷ B | 00000000000011.011 | =13 | 2² | +3.2500 |


    # TABLE 3-6 Shifting Before Dividing Fixed-Point Real Numbers


    | Operand / Result | Bit Pattern | Integer | ·-Scale Factor | =Value |

    |---|---|---|---|---|

    | 2³ × A | 0010111111010000 | 12240 | 2⁸ | +478125 |

    | B | 0000000000110.0110 | -115 | 2¹ | +14.3750 |

    | 2³ × A ÷ B | 00000000001101010 | =106 | 2² | +3.3125 |'
  merge: -1
  img_proc: true
- pgno: 62
  md: "Moving our imaginary binary point to the left as much as possible allows fixed-point\
    \ values to be expressed with greater precision. For any given variable, therefore,\
    \ we should always choose the scale factor with the largest possible negative\
    \ exponent that still leaves enough integer bits for a reasonable range of values.\n\
    \n# 3.3.1 Fixed-Point Using a Universal 16.16 Format\n\nFinding the optimum choice\
    \ of scale factor for a fixed-point variable requires knowing what range of values\
    \ it will have during execution. When range and resolution requirements are modest,\
    \ however, a simple approach is to use 32 bits for all fixed-point numbers, with\
    \ 16 bits in both the whole and the fractional parts (Figure 3-5).\n\n![](img/f0b8aa873b11dc585ed698a10d04e7a7_62_0.png)\n\
    \nWith all operands using the same scale factor, addition and subtraction no longer\
    \ require pre-alignment of operands. Multiplication and division, however, still\
    \ require *some* adjustments or else the result will not have the same scale factor\
    \ as the operands. Remember that when you multiply two fixed-point operands together,\
    \ their scale factors are multiplied as well:\n\n```\nProduct = (A + 2^16) x (B\
    \ + 2^16)\n       = (A x B) + 2^32\n```\n\nWhat we need is a product in 16.16\
    \ format (i.e., a result with a scale factor of 2^16). In other words, the integer\
    \ product needs to be right-shifted by 16 bits. Multiplying the two 32-bit integers\
    \ produces a 64-bit product, with an implied binary point in the middle. Right-shifting\
    \ this product by 16 bits and then putting the result back into a 32-bit location\
    \ means that we are discarding 16 bits from each end of the integer product. Discarding\
    \ the least significant 16 bits simply causes some loss of precision; discarding\
    \ the most significant 16 bits requires imposing a maximum magnitude restriction\
    \ on the operands to avoid overflow (Figure 3-6).\n\n```\nQuotient = (A + 2^16)\
    \ / (B + 2^16)\n        = (A / B) + 2^0\n        = A + B\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_63_0.png)


    FIGURE 3-6 Using integer multiplication to produce a fixed-point product.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_63_1.png)


    FIGURE 3-7 Using integer division to produce a fixed-point quotient.


    Again, what is needed is a result with a scale factor of 2^16 (not 2^0)! Rather
    than shifting the quotient left by 16 bits, however, it is better to left-shift
    the dividend because division with a 64-bit dividend and a 32-bit divisor produces
    a 32-bit quotient. Given the extra dividend bits, it is better to pre-shift the
    sign-extended dividend left by 16 bits, as shown in Figure 3-7.


    Fixed-point multiplication and division are typically implemented as functions
    written in assembly language, to take advantage of the double-length products
    and dividends available with the integer instruction set of most processors. This
    makes implementation of multiplication and division of fixed-point numbers in
    16.16 format rather straightforward in assembler and on a 32-bit processor. Implementation
    in a high-level language (such as C), however, is problematic, because a single
    data type (and thus word size) is used for both the operands and the result.


    # 3.3.2 Fixed-Point Using a Universal 32.32 Format


    The range of the 16.16 format is limited to approximately ±32767 with a precision
    of about five decimal digits to the right of the radix point. When memory space
    is not an issue, a significant improvement in range and precision can be obtained
    by using 64 bits'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_64_0.png)


    for all fixed-point numbers, with 32 bits in both the whole and the fractional
    parts (Figure 3-8).5


    # 3.3.3 Multiplication of 32.32 Fixed-Point Reals


    By now, you can guess that the 32.32 format would be most easily implemented on
    a 64-bit processor. Unfortunately, 64-bit processors are generally considered
    too expensive for almost all embedded applications. As an example of how 32.32
    fixed-point arithmetic can be implemented on a 32-bit processor, let us consider
    multiplication. Since multiplication is such a fundamental operation, our objective
    will be to maximize performance by devising an algorithm that can be coded in
    assembler, using regular 32-bit integer operations, and without using any loops
    or branching.


    Our strategy will be to consider first how to compute the 128-bit product of two
    64-bit unsigned integers and then to modify that result to handle signed integers.
    Next, we use our 32.32 scaling to select which 64 bits of the 128-bit product
    to keep, and note how discarding the rest simplifies the computation.


    Consider a 64-bit integer A, with the bits numbered in little endian format (A63A62...A0).
    The unsigned value of A can be expressed, via polynomial evaluation, as:


    ```

    A_u = 2^63 A_63 + 2^62 A_62 + ... + 2^0 A_0

    ```


    Separating the first term from the rest, we have


    ```

    A_u = 2^63 A_63 + (2^62 A_62 + ... + 2^0 A_0)

    = 2^63 A_63 + A_62..0 (where A_62..0 = 2^62 A_62 + ... + 2^0 A_0)

    ```


    Thus, the 128-bit product of two 64-bit unsigned integers is


    ```

    A_u B_u = (2^63 A_63 + A_62..0) x (2^63 B_63 + B_62..0)

    = 2^126 A_63 B_63 + 2^63 A_63 B_62..0 + 2^63 B_63 A_62..0 + A_62..0 B_62..0

    ```


    5 This approach was used in the Sony PlayStation, whose MIPS processor has no
    floating-point unit.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Now, consider what happens when the bits are interpreted as a 64-bit signed
    integer. First, note that the signed value of A can be expressed as


    $A_s = -2^{63} A_{63} + (2^{62} A_{62} + \cdots + 2^0 A_0) = -2^{63} A_{63} +
    A_{62..0}$


    Thus, the 128-bit product of two 64-bit signed integers is


    $A_s B_s = (-2^{63} A_{63} + A_{62..0}) \times (-2^{63} B_{63} + B_{62..0}) =
    2^{126} A_{63} B_{63} - 2^{63} (A_{63} B_{62..0} + B_{63} A_{62..0}) + A_{62..0}
    B_{62..0}$


    This differs from $A_u B_u$ only in the sign of the middle term, so we can simply
    compute $A_s B_s$ as:


    $A_s B_s = A_u B_u - 2 \times 2^{63} (A_{63} B_{62..0} + B_{63} A_{62..0}) = A_u
    B_u - 2^{64} A_{63} B_{62..0} - 2^{64} B_{63} A_{62..0}$


    Graphically, the product $A_s B_s$ is computed as shown in Figure 3-9.


    Remember that the 0''s shown in the most significant bits of the last two partial
    products in Figure 3-9 occur because $A_{62..0}$ and $B_{62..0}$ are 63-bit (not
    64-bit) unsigned values.


    A and B hold fixed-point real numbers in a 32.32 format; given that $A_s B_s$
    is to be stored in the same format, then we must discard 32 bits from both ends
    of the partial products, to preserve the proper 32.32 scaling, as is shown in
    Figure 3-10.


    Computing the middle 64 bits of the product $A_u B_u$ (the first of the three
    terms shown above) using integer multiplication on a 32-bit processor is accomplished
    by breaking each 64-bit operand into two 32-bit halves (i.e., $A_u = 2^{32} A_{hi}
    + A_{lo}$ and $B_u = 2^{32} B_{hi} + B_{lo}$) and then combining the cross-products:


    $A_u B_u = (2^{32} A_{hi} + A_{lo}) \times (2^{32} B_{hi} + B_{lo}) = 2^{64} A_{hi}
    B_{hi} + 2^{32} (A_{hi} B_{lo} + A_{lo} B_{hi}) + A_{lo} B_{lo}$


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_65_0.png)


    FIGURE 3-9 Computing a signed fixed-point product from an unsigned product.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_66_0.png)


    FIGURE 3-10 Converting from 64.64 to 32.32 fixed-point format.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_66_1.png)


    FIGURE 3-11 Computing the 32.32 unsigned fixed-point product.


    We are going to keep only the middle 64 bits, so we can discard the 32-bit upper
    half of A_hi B_hi and the 32-bit lower half of A_lo B_lo as shown in Figure 3-11.

    All that remains (to compute the signed product A_x B_x) is to conditionally subtract
    the lower halves of A_62..0 and B_62..0 from the upper half of the unsigned product
    A_x B_u (see Figure 3-11). Note that the only difference between A and A_62..0
    and between B and B_62..0 is the most significant bit position; this is irrelevant
    since we used only their lower halves in the subtractions. Thus, to convert the
    unsigned product into a signed product, simply subtract the lower half of B from
    the upper half of the unsigned product A_x B_u if A is negative (A_63 = 1) and
    subtract the lower half of A if B is negative (B_63 = 1).6


    6 Note that changing the unsigned product to a signed product by adjusting the
    upper half is related to the earlier discussion about the difference between signed
    and unsigned multiplication.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 3.3.4 Example: Multiplying Two 4.4 Fixed-Point Reals


    To illustrate the total algorithm, consider the problem of multiplying two numbers
    A and B, each represented as a 2''s-complement 4.4 fixed-point real. To simplify
    the example, let us assume that this is to be implemented on a 4-bit microprocessor
    whose unsigned multiply instruction produces an 8-bit product from two 4-bit operands.


    Let A = -1.50₁₀ = 11101.000₂ Note: As an unsigned integer, Aᵤ = 11101000₂ = 232₁₀


    Let B = +2.75₁₀ = 0010.1100₂ Note: As an unsigned integer, Bᵤ = 00101100₂ = 44₁₀


    The 16-bit product AᵤBᵤ should be 232 x 44 = 10208₁₀. The following expression
    shows how it would be calculated on a 4-bit CPU:


    AᵤBᵤ = 2⁸AₕBₕ + 2⁴(AₕBₗ + AₗBₕ) + AₗBₗ

    = 2⁸(1100 x 0010) + 2⁴((1100 x 1100 + 1000 x 0010) + (1000 x 1100)

    = 2⁸(00011000) + 2⁴(10101000 + 00010000) + 01100000


    The powers of 2 simply determine how the various 8-bit partial products should
    be aligned:


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_67_0.png)


    Remember that of this, we really only need the middle 8 bits (01111110). All that
    is left is to conditionally subtract the lower halves of A and B, depending (respectively)
    on the signs of B and A. Since only A is negative, we simply subtract the lower
    half of B from the upper half of the 8-bits calculated above:


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_67_1.png)


    Inserting the binary point and converting to decimal to check, we get:


    1011.1110₂ = -0100.0010₂ = -4.125₁₀ (which is correct!)


    With a little ingenuity, this algorithm for multiplication of two signed 32.32
    fixed-point real numbers can be implemented as straight-line code (without any
    loops or branching). Unfortunately, the algorithm for signed division is much
    more difficult. In practice, however, most divisions use a constant divisor, and
    so may be rewritten as an equivalent multiplication by the inverse of the constant.
    True division of fixed-point reals is only required when the divisor is a variable.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# PROBLEMS


    +   1. What shift direction and number of one-bit shifts will divide an unsigned
    value by 8?


    +   2. What is the shortest sequence of shift, add, and subtract operations applied
    to x that will produce:

    +   (a) 21 times x?

    +   (b) 57 times x?

    +   (c) 100 times x?

    +   (d) 188 times x


    +   3. Consider a 12-bit fixed-point real number in 6.6 format. What is:

    +   (a) The largest positive value in decimal? In binary?

    +   (b) The largest negative value in decimal? In binary?

    +   (c) The smallest (nonzero) positive value in decimal? In binary?

    +   (d) The smallest negative value in decimal? In binary?


    +   4. Give both the 8-bit binary product and its decimal equivalent produced
    by multiplying the two 4-bit numbers 0110 and 1011₂, using:

