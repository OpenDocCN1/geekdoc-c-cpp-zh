    # 6.8.4 Shift Instructions


    Table 6-10 lists the Thumb-2 shift instructions. Although many other instructions
    (e.g., ADD, ORR, and so on) can incorporate a shift of one of their operands,
    the shift amount is restricted to a constant6 the shift instructions do not have
    that restriction. They shift a copy of the operand (Rn,) a number of bit positions
    specified by a constant, or the contents of another register. In all cases, appending
    the letter “S” to the instruction mnemonic causes the carry flag (C) to capture
    the bit shifted “S” to the instruction mnemonic causes the carry flag (C) to capture
    the bit shifted “out” of the operand; in a multi-bit shift, it captures the last
    bit shifted out.


    The shift instructions differ in what they use to fill the vacated bit position
    on the other end of the operand, as illustrated in Figure 6-7. The logical shift
    left (LSL) and


