  md: "The fastest possible transfer rate occurs when the code is designed to transfer\
    \ a block of data in a tight loop as shown in Figures 8-10 and 8-11. However,\
    \ for either input or output, the software must repeatedly test that the device\
    \ is ready before each byte of data is transferred. The time required to execute\
    \ one iteration of the for loop determines the minimum time per transfer and thus\
    \ the maximum data rate. Latency, however, is unpredictable because there is no\
    \ guarantee that the program will have entered the function and be waiting on\
    \ the device when it becomes ready to transfer the first byte of data.\n\n```\n\
    // TXFE (bit 7 of status port) =1 if transmitter holding register empty\n#define\
    \ TXFE (1 << 7)\n\n// RS232 Data Port    = rs232 base address + 0\n// RS232 Status\
    \ Port  = rs232 base address + 24\n\nvoid rs2320output(uint8_t *ptr2data, int\
    \ bytes, volatile uint32_t *rs232base)\n{\n  for (int byte = 0; byte < bytes;\
    \ byte++)\n  {\n    while (((*rs232base + 6) & TXFE) == 0)\n    {\n      // do\
    \ nothing (wait for data to arrive)\n    }\n    *rs232base = (uint32_t *)ptr2data++\
    \ ;\n  }\n}\n```\n\nFIGURE 8-10 Synchronizing data transfers on a serial line\
    \ using polled waiting loops.\n\n```\nEXPORT rs2320output\n\nrs2320output:\n\n\
    \  ; R0 contains the parameter 'ptr2data'\n  ; R1 contains the parameter 'bytes'\n\
    \  ; R2 contains base address of RS232 device\n\nRepeat: CBZ   R1,Return    ;\
    \ more data to send?\nOutwait:LDR   R3,[R2,#0x18]  ; get status word\n       \
    \ TST   R3,#0x80     ; TXFE = 1?\n        BEQ   Outwait      ; loop until ready\n\
    \        LDRB  R3,[R0],#1   ; get next byte & update pointer\n        STR   R3,[R2]\
    \      ; send data to device\n        SUB   R1,R1,#1     ; decrement byte count\n\
    \        B     Repeat       ; do it all again\nReturn: BX  LR             ; return\n\
    ```\n\nFIGURE 8-11 Polled waiting loop optimized in assembly:"
