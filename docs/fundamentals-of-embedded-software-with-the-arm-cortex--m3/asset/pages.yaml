- pgno: 227
  md: '# # Shared Memory


    When two or more asynchronous instruction sequences access the same data, that
    data is called shared memory. Access to shared memory must be carefully coordinated
    or else data corruption can occur. Minimizing the use of shared memory, identifying
    what data must be shared, and then protecting it are some of the greatest challenges
    of the multithreaded programming style that is the cornerstone of real-time embedded
    systems.


    The term asynchronous means that there is no predictable time relationship among
    the various instruction sequences. One sequence may execute a portion of its instructions
    only to be prematurely interrupted so that some portion of another sequence may
    execute. The actual point of transition between the two sequences is not predictable.
    If there is data that both sequences must access, then the program’s freedom to
    switch from one instruction sequence to another must somehow be restricted so
    that the access becomes synchronized.


    Conventional desktop application programs are usually designed as a single thread
    of code. Only the interrupt-service routines (ISRs) execute asynchronously with
    respect to the application. Although shared memory is used to buffer data between
    the ISRs and the operating system, we rely on the latter to synchronize the access.
    Within the application program, all data is allocated, initialized, used, and
    released by a single thread of code. Data used in this manner is said to be private
    to the thread.


    Embedded software, however, is I/O-intensive and often multithreaded with many
    requirements and opportunities (intentional or otherwise) for shared memory. Shared
    memory is essential in order to allow inter-thread or inter-task communication
    and coordination, so we cannot simply eliminate its use.


    Besides its propensity for data corruption, shared memory also increases program
    complexity. Threads are easier to design, understand, and debug when they are
    designed to be as independent of other threads as possible. Each occurrence of
    shared memory establishes one more relationship between threads, thus reducing
    their independence.


    # ## 12.1 RECOGNIZING SHARED OBJECTS


    Whether an object’s data can be shared is determined neither by its scope nor
    by its memory allocation method, but only by how the object is used. There are
    three mechanisms that can allow an object’s data to become shared.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 12.1.1 Shared Global Data


    A global object referenced by name from within the source code of multiple threads
    is the easiest kind of shared memory to recognize. You should always try to minimize
    the number of global objects anyway, whether your program is multithreaded or
    not, because global objects create linkages between functions and thus increase
    program complexity.


    # 12.1.2 Shared Private Data


    If one thread gives the address of one of its private objects to another thread,
    then that object can be accessed by both threads and is no longer private. Neither
    changing the object''s scope nor changing its memory allocation method can eliminate
    this form of shared memory.


    # 12.1.3 Shared Functions


    A shared function is one that is called by more than one thread; any function
    called by a shared function is also a shared function. Any static object referenced
    within a shared function is thus a form of shared memory. It does not matter if
    the object''s scope is global or local. Since there is only a single instance
    of the object, its content is inherently shared by all threads that call a function
    that references it.


    Most programmers do not expect objects that are local to a function to be shared
    memory. However, if those objects are statically allocated and the function is
    called from more than one thread (either directly or indirectly), sharing will
    occur and can be extremely difficult to recognize. Do not forget that library
    functions are more likely to be used in multiple threads. Any functions called
    from more than one thread should be considered shared functions, and so it becomes
    critical to be sure that they do not manipulate any static objects.


    # 12.2 REENTRANT FUNCTIONS


    In multithreaded software, several different threads may be executing concurrently.
    In some systems, the context switch from one thread to another can thus occur
    at almost any time. If a context switch occurs in the middle of a shared function,
    then that function might be reentered (much like recursive functions) even though
    no recursive functions exist.


    As illustrated in Figure 12-1, thread A might be in the middle of executing the
    strstr library function only to be preempted by thread B. It is then possible
    that the thread B may also call (and perhaps return from) strstr before thread
    A is resumed.


    In multithreaded programs, functions called from more than one thread must use
    separate thread-specific instances of any data that should not be shared with
    other threads. This happens automatically when only automatic or dynamic allocation
    is used within the function and creates a class of reentrant functions that are
    inherently thread-safe because every entry to the function creates new instances
    of its objects. Static objects, however, can never be thread-specific, since they
    have only a single instance.'
