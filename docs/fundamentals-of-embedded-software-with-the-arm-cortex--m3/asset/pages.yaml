    The approach is to compute their difference without regard to whether the operands
    are signed or unsigned, and then examine the characteristics of the difference—the
    borrow-out and (in the case of signed integers) the sign of the result and whether
    an overflow occurred. The borrow-out determines which is the greater of two unsigned
    operands, but, for signed operands, we must look at the sign of the difference
    and whether an overflow occurred.


