  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_202_0.png)


    situation diminishes rapidly. Fortunately, development tools do exist that can
    analyze software and detect such situations automatically, but it is still the
    programmer who has to find a solution to the problem.


    It is important to realize that deadlock simply is not possible when critical
    sections are protected by turning off task switching or by disabling interrupts.
    Unfortunately, these techniques are only appropriate for short critical sections.
    A mutex is the only reasonable way to protect long critical sections without affecting
    the response time of other tasks.


    There are several different strategies for dealing with deadlocks. A common approach
    is to require all threads to acquire resources in the same order. However, even
    though the specific order chosen is arbitrary, it often causes resources to be
    locked for longer than necessary. Occasionally there is no order that can be found
    that is convenient for all threads. When this happens, an alternative strategy
    is to require a thread to release all its acquired resources and start over if
    any one resource cannot be acquired. There are even algorithms for detecting when
    a deadlock has occurred, but breaking a deadlock once it has been detected is
    not practical in most real-time systems.


    # 10.8 WATCHDOG TIMERS


    Priority inversion and deadlock can cause a real-time system to fail. Although
    strategies exist to avoid such problems, they sometimes are not implemented due
    to expense, complexity, or oversight. Even when they are, the system may still
    fail because of programming errors, hardware failure, or unanticipated situations.


    If continuous operation of the embedded application is critical, and if the failure
    is only temporary, then a watchdog timer can be used to provide a primitive recovery
    mechanism. A watchdog timer is simply a hardware counter that counts down toward
    zero at a fixed rate. The software is expected to periodically restart the counter
    so that it never actually reaches zero. If the counter does reach zero, a failure
    is assumed to have occurred. The watchdog hardware then sends a reset signal to
    the CPU, causing'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'the system to reinitialize. In safety-critical applications, the watchdog hardware
    must also be responsible for putting everything into a safe state, since the CPU
    itself may have failed.


    In a real-time multithreaded application, it is important that the watchdog timer
    verify more than just the fact that the CPU is executing instructions. It is tempting
    to restart the watchdog using a few lines of code added to the system timer tick’s
    ISR. However, this interrupt or its ISR could easily continue to work properly
    in the presence of a deadline or a priority inversion, and thus would not verify
    that tasks are meeting their deadlines.


    When triggered by an event, the time a task requires to compute the corresponding
    output response must be less than the specified deadline. It does not matter whether
    the task is executed periodically, sporadically, or infrequently. Thus, the software
    that restarts the watchdog counter must do so only after verifying that all such
    deadlines have been met.


    One effective software strategy is illustrated in Figures 10-13 and 10-14. It
    associates an integer representation of time (“deadline”) and two Boolean flags
    (“busy” and “failed”) with every task. All such flags are cleared to false during
    system initialization. Whenever an event occurs that triggers the execution of
    the task, the event computes the future deadline for the task, records it in the
    integer, sets busy to true, and then makes the kernel call that releases the pending
    task. Once the task has finished computing the output response, it sets its failed
    flag to true if it missed its deadline, and it unconditionally clears its busy
    flag to false.


    The watchdog software periodically checks each task, as shown in Figure 10-14.
    A task has missed a deadline if either its failed flag is true or its busy flag
    is true and the current time is greater than its posted deadline. If none of the
    tasks has failed, the watchdog software restarts the hardware counter. These checks
    are relatively simple and fast to compute and can usually be run as a relatively
    infrequent but high-priority task without much impact on the rest of the system.


    | Task trigger (e.g., ISR or different thread) | Task to compute output response
    |

