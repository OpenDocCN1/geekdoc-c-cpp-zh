- pgno: 75
  md: 'The lack of a Boolean data type and constants in older C compilers impairs
    readability. There are several possible remedies to create your own “pseudo” Boolean
    data type. For example, a popular solution is to simply map Booleans onto bytes
    using macros, as in:


    ```

    #ifndef _STDC_VERSION__

    #define bool unsigned char

    #define false 0

    #define true 1

    #endif

    ```


    Or with a typedef declaration, as in:


    ```

    #ifndef _STDC_VERSION__

    typedef unsigned char bool ;

    const unsigned char false = 0 ;

    const unsigned char true = 1 ;

    #endif

    ```


    A third alternative is possible by defining bool as an enumerated type:


    ```

    #ifndef _STDC_VERSION__

    typedef enum {false = 0, true = 1} bool ;

    #endif

    ```


    Although this definition may seem more intuitively appropriate, there is no strict
    enforcement of what values may be assigned to enumerated types. Most C compilers
    use an int as the underlying implementation of an enumerated type, and thus will
    allow any integer constant to be assigned to such a variable.


    # 4.3 MIXING DATA TYPES


    Sometimes a little knowledge can be dangerous. Understanding when to declare an
    integer variable as signed and when to use unsigned ultimately results in programs
    that use both. However, this level of detail carries with it a responsibility
    that goes beyond just specifying the appropriate data type.


    When an operator combines signed and unsigned integers, C converts the data type
    of the signed integer to match that of the unsigned integer before evaluating
    the expression. In this particular case, no corresponding change in the underlying
    bit pattern occurs, which can cause unanticipated effects, as in the following
    code³:


    ```

    unsigned int u ;

    ...

    if ( u > -1 ) ...

    ```


    The condition in the if statement above may at first appear to always be true
    since unsigned integers are always greater than or equal to zero. In fact, however,
    the condition is always false! The reason is that the signed integer constant
    –1 (a word of all 1’s) is converted to unsigned and is thus interpreted as a full-scale
    value.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'This example should not be used as an argument against the use of unsigned
    integers. Rather, consider it as part of the challenge of using integers properly!


    Some data-type conversions, however, require a corresponding change in the bit
    pattern used to represent the value. For example, although the signed and unsigned
    integer representations of 4 are identical, the floating-point representation
    of 4 is entirely different.


    Conversions are considered to be either data-type promotions or data-type demotions.
    A conversion is called a “promotion” when there is no potential loss of accuracy,
    as when assigning an integer value to a floating-point variable. Conversely, a
    demotion occurs when the conversion can cause a loss of accuracy, as when a floating-point
    value is assigned to an integer variable, or when a 32-bit integer value is assigned
    to an 8-bit char. Demotions usually cause the compiler to issue a warning.


    Some conversions occur implicitly, for example, when assigning an integer value
    to a floating-point variable:


    ```

    double gpa = 4 ;

    ```


    An implicit conversion can always be made explicit by the use of a cast, as in


    ```

    double gpa = (double) 4 ;

    ```


    The parentheses and the data type name between them form a cast operator, which
    is applied to a single operand on the immediate right. Using a cast to make the
    conversion explicit also indicates that it was intentional and thus eliminates
    the warning message caused by an implicit demotion.


    # 4.4 MANIPULATING BITS IN MEMORY


    Programmers often pack a number of operands with distinct but related meanings
    into a single memory location. An example is the following packed representation
    that the old operating system MS/DOS used to store the current date and time into
    a single 32-bit location (Figure 4-2):


    | 31 ... 25 | 24 ... 21 | 20 ... 16 | 15 ... 11 | 10 ... 5 | 4 ... 0 |

    |---|---|---|---|---|---|

    | Year 1980 | Month | Day | Hours | Minutes | Secs + 2 |


    FIGURE 4-2 Packed 32-bit representation of date and time used in MS/DOS.


    Small embedded systems also pack data to reduce the amount (and thus the cost)
    of read–write memory. For example, a large array of Boolean values would most
    efficiently be stored by packing eight 1-bit Boolean variables into each byte
    rather than using an entire integer to hold a value that can be only 0 or 1:


    ```

    uint8_t flags[10] ; /* 80 1-bit Boolean flags, 8 per byte */

    ```'
