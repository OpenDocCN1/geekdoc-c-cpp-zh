- pgno: 22
  md: 'FIGURE 1-5 The Seagate Barracuda XT disk drive incorporates two ARM Cortex-R4
    processors — one to control the servos and the other to handle the command and
    data flow. Photo courtesy of Seagate Technology, LLC.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_22_0.png)


    Reliability expectations will place greater responsibility on programmers to eliminate
    bugs and design software to tolerate errors and unexpected situations. Many embedded
    systems have to run 24 hours a day, 7 days a week, and 365 days a year. You cannot
    just “reboot” when something goes wrong. Hence, good coding practices and thorough
    testing take on a new level of importance in the realm of embedded processors.


    Performance goals will force us to learn and apply new techniques such as multi-threading
    and scheduling. The need to communicate directly with sensors, actuators, keypads,
    displays, and so on will require programmers to have a better understanding of
    how alternative methods for performing input and output provide opportunities
    to trade speed, complexity, and cost. Although we will usually program in a high-level
    language for better productivity, use of these alternatives may occasionally require
    that we drop to the level of the computer and program directly in assembly language.


    Computers use fixed precision and 2’s-complement representation to store and process
    numeric values. This results in subtle differences from how humans handle numbers,
    and it is often an unexpected source of problems. Our software will have to live
    with limitations regarding the range and resolution of numbers. However, as programmers,
    we need to be sure that we have a comprehensive understanding of the consequence
    of exceeding these limitations and of how to handle such situations.


