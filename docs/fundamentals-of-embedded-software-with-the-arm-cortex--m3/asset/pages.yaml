    # 7.4.4 Return Values


    Functions are expected to return any 8-bit, 16-bit, or 32-bit result in R0, zero-filled
    or signed filled according to the declared return type (Figure 7-11). Functions
    that return a 64-bit result must do so with bits 0 to 31 in R0 and bits 32 to
    63 in R1 (Figure 7-12). If a function must return multiple results, a common practice
    is for the caller to pass a pointer to a structure, and let the function use the
    pointer to store the results into the structure. Although C functions are allowed
    to return a structure containing more than 64 bits, this is rarely required for
    a support routine written in assembly.


    # 7.4.5 Temporary Variables


    Functions should first try to use registers R0 through R3 for any required temporary
    variables, since there is no obligation that their content be preserved. Registers
    R4 through R11 are the second choice, but their original content must be saved
    at function entry and restored prior to the function return.


    When more space for temporaries is required, it may be allocated on the stack.
    This is accomplished by subtracting a constant from SP at the entry to the function,
    corresponding


