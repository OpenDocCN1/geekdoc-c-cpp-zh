  md: 'logical shift right (LSR) instructions always insert a 0. The arithmetic shift
    right (ASR) instruction replicates the most significant bit so that the result
    has the same sign as the original operand.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_135_0.png)


    FIGURE 6-7 Shift instructions (Append “S” to modify Carry Flag).


    The rotate right instruction (ROR) performs a 32-bit rotation, and thus fills
    bit 31 with the value that comes out of bit 0. Note that a left rotate of N bits
    can be achieved by a right of 32-N bits. The rotate right extended (RRX) performs
    a 33-bit rotation, with the carry flag (C) serving as a 1-bit extension to the
    operand; all 33 bits are then rotated so that bit 31 is filled with the previous
    contents of the carry flag.


    Shifting a 64-bit double-length operand requires three instructions. For example,
    to perform a left-shift logical on a double-length operand, begin with a left-shift
    logical of the upper half. This leaves a 0 in its least significant bit, which
    must be replaced by the most significant bit of the lower half. A single instruction
    can both shift a copy of the lower half right by 31 bits and bitwise-OR it into
    the upper half. Finally, all that is left to do is to left shift the lower half
    (Figure 6-8).


    | | | R1 | R0 |

    |---|---|---|---|

    | LDRD R0,R1,data64 | => | b63 ... b32 | b31 ... b0 |

    | LSL R1,R1,#1 | => | b62 ... b32 0 | b31 ... b0 |

    | ORR R1,R1,R0,LSR #31 | => | b62 ... b32 b31 | b31 ... b0 |

    | LSL R0,R0,#1 | => | b62 | b31 b30 ... b0 0 |

    | STRD R0,R1,data64 | => | | |


    FIGURE 6-8 Double-length 64-bit logical left shift.


    An alternative solution is to begin by left shifting the lower half and capturing
    bit 31 in the carry flag by using an LSLS instruction. Then, shift the upper half
    left. Finally, use an ADC with a zero as the second operand to get bit 31 that
    was saved in the carry'
