- pgno: 244
  md: "The value loaded into the program counter is the entry point address of a startup\
    \ function whose responsibility is to perform any additional initialization as\
    \ needed and then transfer to the entry point of function main to start the application.\n\
    \nThere are two other entries in the vector table that must have initial values\
    \ before execution begins. Since nonmaskable interrupts and hard faults cannot\
    \ be disabled, handlers for these two exceptions must already exist and their\
    \ entry point addresses stored as the next two entries in the vector table at\
    \ addresses 8 and 12, respectively. All other interrupts are initially disabled\
    \ and all interrupt priorities are at their default values. At a minimum therefore,\
    \ the vector table must have its first four entries populated. When using IAR\
    \ Embedded Workbench, the vector table can be created in C and forced to be located\
    \ at address 0 using the following code:\n\n```\n// A union that describes the\
    \ entries of the vector table. The union is needed\n// since the first entry is\
    \ the stack pointer and the remainder are function pointers.\ntypedef union\n\
    {\n    void (*pfnHandler)(void);\n    unsigned long ulPtr;\n} uVectorEntry;\n\
    ```\n\n```\n// The vector table. Note that the proper constructs must be placed\
    \ on\n// this to ensure that it ends up at physical address 0x0000.0000.\n__root\
    \ const uVectorEntry _vector_table[] @ \".invec\" =\n{\n    .ulPtr = (unsigned\
    \ long) pulStack + sizeof(pulStack), // Initial SP\n    .iar_program_start, //\
    \ Initial PC\n    NmiISR, // The NMI handler\n    FaultISR, // The hard fault\
    \ handler\n    ...\n}\n```\n\nThe declaration of the table uses a few C language\
    \ extensions that are supported by the IAR Embedded Workbench compiler:\n\n+ \
    \  1. The text \"__root\" that appears at the beginning of the declaration prevents\
    \ the linker from removing the variable even though the identifier \"__vector_table\"\
    \ is never referenced by name anywhere else in the program.\n\n+   2. The text\
    \ \"@\".invec\" causes the linker to locate the vector table starting at address\
    \ 0.\n\n+   3. The first entry in the table uses a C99 feature called a designated\
    \ initializer. It is an expression enclosed in curly braces; the \".ulPtr = \"\
    text at the beginning of the expression tells the compiler that this value is\
    \ to be assigned to the union member named ulPtr."
