- pgno: 77
  md: 'Manipulation of these bits is usually implemented using a set of macros or
    functions that rely on C''s bitwise operators. As shown in Table 4-4, both the
    bitwise and Boolean operators provide the basic operations of AND, OR, exclusive-OR
    (XOR), and NOT. However, Boolean operators are used to form conditional expressions
    (as in an `if` statement) while the corresponding set of bitwise operators are
    used to manipulate bits.


    | Operation | Boolean Operator | Bitwise Operator |

    | :--- | :--- | :--- |

    | AND | `&&` | `&` |

    | OR | `||` | `|` |

    | XOR | `unsupported` | `^` |

    | NOT | `!` | `~` |


    The older C compilers did not provide a Boolean data type, and programmers had
    to use integer variables to hold Boolean values. The Boolean operators were designed
    to yield results of type `int`, with true and false represented by 1 and 0, respectively.
    When interpreting integer values as Boolean values, a value of zero is treated
    as false, and *any* nonzero value is considered true.


    Bitwise operators work on individual bit positions within the operands; that is,
    the result in any single bit position is entirely independent of all the other
    bit positions. As shown below, applying the bitwise AND operator (`&`) to operands
    A and B produces a result in which bit 5 depends only on the value of bit 5 of
    A and bit 5 of B.


    As Figure 4-3 demonstrates, bitwise operators treat each operand as an ordered
    bit vector and produce bit vector results. Boolean operators, however, treat each
    multi-bit operand as a single value to be interpreted as either true or false.
    Table 4-4 illustrates how this difference can produce very different results for
    identical operands.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_77_0.png)


    It is usually easier to envision how the bitwise operators are used to manipulate
    packed operands by thinking of one of the bits of one operands as controlling
    what happens to the corresponding bit of the other operand as it propagates through
    to the result. As illustrated in Tables 4-5 to 4-7, the value of the control bit
    (a) determines whether the corresponding bit (b) of the packed operand propagates
    into the result unchanged or inverted, or whether that bit of the result is cleared
    to 0 or set to 1.'
