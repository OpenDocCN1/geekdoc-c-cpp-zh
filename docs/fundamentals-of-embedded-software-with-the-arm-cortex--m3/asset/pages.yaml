    # 6.5 MEMORY ADDRESS CALCULATIONS


    During the execute phase of an instruction such as “LDR R0,data;”the instruction
    must provide the address of the memory operand “data” to memory. Storing the address
    as a 32-bit constant within the representation of the instruction itself would
    mean that all LDR and STR instructions were more than 32 bits wide. To conserve
    memory space and instruction fetch time, these instructions simply specify how
    the address should be calculated from a smaller number of bits. The assembler
    automatically converts a reference to the variable “data” into a PC-relative reference,
    where the address is calculated as the sum of the program counter (R15) and a
    small constant stored in the instruction. The constant is known as a displacement
    whose value is the difference between the address of the instruction and the address
    of the data. The displacement is only 13 bits wide and thus restricted to ±4,095.


    PC-relative addressing is a special case of an ARM addressing mode known as “offset
    addressing.” It provides four basic options for calculating an address as summarized
    in Table 6-4. Examples of how these are used are covered later in this section.'
