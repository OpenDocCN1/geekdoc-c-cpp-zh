  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_34_0.png)


    FIGURE 2-2 Using repeated multiplication to convert 0.1 from decimal to binary.


    # Repeated multiplication does not always terminate


    Unlike repeated division, however, repeated multiplication may continue indefinitely.
    That is because a fractional value represented by a finite number of digits in
    one number base may require an infinite number of digits in a different number
    base. For example, everyone knows that one-third cannot be written as a decimal
    fraction unless you use an infinite number of digits (called a *repeating fraction*).
    However, writing it as a ternary (base 3) fraction requires only a single digit!
    (i.e., 0.333 ... 3₁₀ = 0.1₃) This also happens when we convert certain finite-length
    decimal fractions to a different number base representation. As shown in Figure
    2-2, the decimal representation of one-tenth requires an infinite number of digits
    when converted to binary.


    # Knowing when to stop repeated multiplication


    So how do we know when to stop repeated multiplication? In most cases, the fractional
    part of a product will become zero, and then we can simply use the whole part
    as the last digit of the result and stop. When the fractional part is identical
    to a previous fractional part, however, the result will repeat forever. No matter
    where we stop, we will have to discard the rest of the digits of the result, and
    there will be a corresponding *representation error*.


    Often the decision of how many fractional digits to keep is determined not by
    us but by whether the result is to be stored in a byte, a half-word, a word, or
    a double word. If not, then a rational choice is to produce enough digits to yield
    the same precision as in the original decimal fraction. For example, when we write
    a value as the decimal fraction .123, we have expressed it to a precision of 1
    part in 1,000. (Note that writing it as .1230 expresses the precision of 1 part
    in 10,000.) To get a precision of 1 part in 1,000 in binary requires 10 binary
    digits; 9 binary digits would only provide a precision of 1 part in 512 (2⁹),
    while 10 provides a precision of 1 part in 1,024 (2¹⁰).


    # Truncating and rounding


    Simply discarding any extra digits when you terminate repeated multiplication
    is called *truncating* the result. To minimize error, however, we should instead
    *round* the result.'
