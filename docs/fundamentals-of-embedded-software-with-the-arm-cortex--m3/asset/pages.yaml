- pgno: 218
  md: 'ultimately cause an allocation request to fail even though the total amount
    of free memory available is sufficient. Unfortunately, malloc cannot simply rearrange
    the heap to combine the free blocks, because the allocated blocks must remain
    stationary.


    Worst-case fragmentation occurs when the allocated blocks are small and have large
    free blocks in between. Given enough blocks, the largest single free block may
    be only a small fraction of the total amount of free memory. Whether this actually
    happens depends on the variety of block sizes and the sequence in which they are
    allocated and released during program execution.


    The probability of allocation failure due to fragmentation increases with the
    number and range of different block sizes. It has been suggested that embedded
    applications use far fewer block sizes than desktop applications, since file and
    string handling are much less common in embedded systems.


    In most cases, the pragmatic solution is simply to use a heap that is “somewhat”
    larger than required, and extensive testing to verify that the size is large enough.
    However, embedded applications that must guarantee failure-free operation over
    a long period of operation may need to consider other techniques to manage memory.


    # 11.7.2 Memory Allocation Pools


    One common strategy for eliminating heap fragmentation is to use allocation pools.
    A memory allocation pool is a collection of equal-size memory blocks. Multiple
    pools are usually employed, with each pool using a different block size. Memory
    is allocated from the pool with the smallest block size that satisfies the request.
    An entire block is always allocated, even if it means allocating more than the
    size requested.


    Implementation of pool-based allocation schemes is usually best left to the application
    programmer. The programmer’s knowledge of the application places him or her in
    a unique position to determine the optimum block sizes, number of pools, and blocks
    per pool. Once determined, the entire memory required for each pool is then preallocated
    from the heap at the beginning of program execution. Pool memory is never returned
    to the heap unless its block size is no longer required. Allocation and release
    of blocks are managed by functions layered on top of the normal heap-management
    routines.


    # 11.8 AUTOMATIC ALLOCATION WITH VARIABLE SIZE (alloca)


    The less we use the heap, the less we have to worry about fragmentation. The most
    common reason to allocate dynamic memory from the heap is for objects whose sizes
    are not known until execution time. If this object is needed only as a temporary
    during the execution of a function, then we can avoid the heap by allocating automatic
    memory from the stack using the library function alloca, as shown in Figure 11-6.'
