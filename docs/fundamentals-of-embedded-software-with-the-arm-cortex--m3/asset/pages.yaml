  md: '# # Programming in Assembly Part 3: Control Structures


    This chapter looks at the implementation of decision structures, loops, and function
    calls in ARM assembly. Most embedded programs are a mix of C and assembly. The
    main program and the majority of the procedures are usually implemented in C,
    with only a handful of low-level support routines written in assembly—typically
    to optimize performance. Thus, our objective will be to learn how to implement
    these structures as efficiently as possible.


    # ## 7.1 INSTRUCTION SEQUENCING


    Once the processor is running, it repeats the fetch-execute cycle over and over
    again. As a result, the default operation of the processor is to execute a straight-line
    sequence of instructions read from successive memory locations. To accomplish
    anything useful, however, a program must occasionally depart from this sequence
    by transferring control (either conditionally or unconditionally) to another part
    of memory.


    In C, transfers of control are created by break, continue, switch, and goto statements,
    function calls and returns, and implicitly at the end of loops. When the code
    is compiled, each of these is translated into a branch instruction,¹ as shown
    in Figure 7-1.


    | C Source Code | ARM Assembly Language |

    | :--- | :--- |

    | `for (;;) {` | `top_of_for:` |

    | `...` | `...` |

    | `if ((a==5)` | `...` |

    | `break;` | `BEQ end_of_for` |

    | `...` | `...` |

    | `}` | `B top_of_for` |

    | | `end_of_for:` |


    FIGURE 7-1 Branch instructions in code generated by a compiler for a break statement
    and at the end of a for loop.


    ¹How switch statements are translated into assembly depends on the number and
    distribution of case-label constants. Sometimes a multiway jump is formed by indexing
    into a table of destination addresses; in other cases the switch statement is
    translated into the equivalent of a cascading sequence of if-then-else statements.'
  merge: -1
  img_proc: true
