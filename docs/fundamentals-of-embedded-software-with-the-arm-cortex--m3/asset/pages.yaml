    # 11.9 RECURSIVE FUNCTIONS AND MEMORY ALLOCATION


    A recursive function is one that calls itself, either directly or indirectly.
    For example, the function shown in Figure 11-9 outputs a number as a sequence
    of hex characters; the digits are calculated as the remainders of division by
    16, and recursion is used so that these digits are produced in the proper left-to-right
    order.


    Function parameters, like other temporary objects, use automatic memory allocation.
    Since parameters are allocated on entry to the function block, they exist until
    the function returns. Each time the function calls itself, another set of parameter
    values is calculated, and another set of locations in memory is allocated to hold
    them. Thus, at the deepest nested level of a sequence of recursive calls, a number
    of different parameter sets will have been created and will coexist. The memory
    allocated for each set is released as the function backs out of these levels by
    returning from the calls in reverse order (Figure 11-9).


    In contrast, however, note that static allocation is used for the character array
    of hex digits in Figure 11-10. This array contains a small number in the range
    0 to 15 into its corresponding hex character by using the number as an index into
    the array. Making the array static guarantees that only a single copy exists,
    since static objects are allocated only once, when the program is loaded into
    memory.'
