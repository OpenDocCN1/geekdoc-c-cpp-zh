    # 5.5.2 Translating Assembly into Binary


    The translation of assembly language source code into binary object code is a
    two-step process as shown in Figure 5-19. The assembler makes two complete passes
    over the source code of the program. During the first pass, the assembler builds
    a symbol table that contains information about programmer-defined identifiers,
    such as the address of an instruction represented by a label attached to it, or
    the address of a variable represented by its identifier. During the second pass,
    the assembler uses this information to assemble the representation of the individual
    instructions.


