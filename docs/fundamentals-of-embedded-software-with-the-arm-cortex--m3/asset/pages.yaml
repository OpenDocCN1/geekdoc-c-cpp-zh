    # 1.2 WHAT IS UNIQUE ABOUT THE DESIGN GOALS FOR EMBEDDED SOFTWARE?


    The objective of this book is to help you learn how to design and implement software
    for embedded systems. Although you already have some experience writing desktop
    application programs in a high-level language, writing embedded application programs
    presents some new challenges regarding reliability, performance, and cost.


    FIGURE 1-4 The Vue-40 vending machine uses a 16-bit Hitachi H8/300 cpu. Photo
    courtesy of SandenVendo America, Inc.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_21_1.png)'
