  md: '# 7.2 IMPLEMENTING DECISIONS


    Decisions usually begin by evaluating an expression that is either true or false.
    The expression, called the conditional, may be a simple comparison of two values.
    Compound conditionals involving more than one comparison are constructed from
    these basic conditionals by combining them using Boolean operators.


    In assembly, each decision is a two-step process: One instruction is used to set
    the flags, followed by another instruction that uses the flags to make the actual
    decision. Each component of a compound conditional requires this two-part sequence
    — a compare followed by a conditional branch. In most cases, the first instruction
    compares two values by computing their difference. The actual value of that difference
    is not important — only its characteristics. For example, the compare (CMP) computes
    the difference of two values, discards that difference, but saves its characteristics
    in the flags. Then by checking the flags (using a conditional branch instruction),
    we can make a decision regarding the relative magnitude of the two values and
    alter the flow of execution accordingly.


    CMP compares a register to a second operand that may be a constant, a register,
    or a shifted register. There is also a CMN (compare negative) instruction that
    adds instead of subtracting the second operand. Both instructions record whether
    the result is negative, zero, resulted in a carry (or borrow out), or resulted
    in a 2’s-complement overflow. The TST instruction is used to test if one or more
    bits in a register are non-zero, and the TEQ instruction is used to test if two
    values are identical without affecting the V or C flags (Table 7-1).


    | Instruction | Operation | [S] | Notes |

    |---|---|---|---|

    | CMP | Rn,<op2> Rn - <op2> | | Always updates: NZCV |

    | CMN | Rn,<op2> Rn + <op2> | | |

    | TST | Rn,<op2> Rn & <op2> | | Always updates: NZ; if shifted, <op> may affect
    C flag |

    | TEQ | Rn,<op2> Rn ^ <op2> | | |


    # 7.2.1 Conditional Branch Instructions


    Figure 7-1 includes an example of a conditional branch instruction (BEQ) that
    makes a decision to branch based on the state of the zero flag (Z). If Z is 1,
    the equality comparison was true and the instruction breaks out of the loop; otherwise,
    instruction flow'
