  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_109_0.png)


    FIGURE 5-11 Internal organization of the ARM Cortex-M3 v7M CPU.


    A collection of 1-bit status flags and other information is held in a single 32-bit
    program status register (PSR) (Figure 5-12). The PSR is divided into three bit
    fields: the Application Program Status Register (APSR), the Interrupt Program
    Status Register (IPSR), and the Execution Program Status Register (EPSR). Most
    important for application programs are the four most significant bits of the PSR
    that hold information used to make conditional branch decisions. The Q bit is
    the sticky saturation bit and supports two rarely used instructions (SSAT and
    USAT). The IPSR holds the pre-empted exception number used during exception processing.
    The ICIT/IT bits hold state information for IT block instructions and instructions
    that are suspended during interrupt processing and continued on return. The T
    bit is always 1 to indicate Thumb state.


    # 5.4.2 Instruction Pipelining


    Since most instructions are fetched from sequential address locations, the ARM
    processor uses a technique called “pipelining” to speed up the fetch-execute process.
    Pipelining allows three instructions to be in progress simultaneously during any
    one processor clock cycle. While one instruction is fetched, another is decoded,
    and a third is executed. Thumb instructions are 16 or 32 bits wide, with the majority
    being 16 bits. Thus, while the address held in PC is being used to read one 16-bit
    instruction from memory, the previous instruction (from address PC-2) is decoded,
    and the one before'
