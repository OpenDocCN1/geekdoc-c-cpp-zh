- pgno: 26
  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_26_0.png)


    When you want to run a desktop application program, its executable image is loaded
    from the disk into memory by a part of the operating system known as the loader.
    The operating system itself is already in memory, put there during the boot process.4


    The desktop system is intended to run a number of different application programs.
    Thus, a read/write main memory is used so that an entirely different application
    program can be quickly and easily loaded into memory, replacing the previous application
    whenever necessary.


    Unlike general-purpose desktop systems, embedded systems are designed to serve
    a single purpose. Once the embedded software is in memory, there is usually no
    reason to change it. Rather than storing the program on the disk, embedded systems
    keep their program in a nonvolatile read-only or flash memory. Since there is
    no need to store the program on the disk, a significant amount of software can
    be eliminated that would otherwise be necessary to support a file system.


    Both the embedded application software and a real-time kernel are stored in the
    same memory as a single program image. With no need for a file system, the kernel
    is much smaller than a regular operating system and is easily linked to the program
    as yet another object file, as shown in Figure 1-11.


    In general, the same kinds of software development tools are used to build both
    embedded and desktop applications. Although tool suites designed especially for
    embedded-application development are commonly available, in many cases it is possible
    to use the same compiler, assembler, and linker that you use for desktop applications.
    However, there are two important differences. First, the run-time library that
    comes with compilers for desktop applications is usually not intended for multithreaded
    applications and must be replaced by one that is reentrant. Second, additional
    software called a locator is required to convert the linker’s output to a form
    suitable for storing in the program memory of the embedded system.5 When a desktop
    operating system loads'
