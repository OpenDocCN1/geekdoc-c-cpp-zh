  img_proc: true
- pgno: 194
  md: 'Most threads cycle through these three states (ready, running, and pending)
    as long as the embedded application is running. Some threads, however, are normally
    inactive; they are occasionally made ready when needed, are run to completion,
    and are then returned to the inactive state.


    # 10.3 CONTEXT SWITCHING


    A non-preemptive context switch is shown in Figure 10-4. Initially, thread A is
    running and thread B is waiting in the pending state for a specific event to occur.
    When the event occurs, it triggers an interrupt service routine (ISR), which records
    the event by executing a semaphore “post” call to the kernel. The kernel knows
    that thread B has been pending (waiting for the event to occur) and changes its
    state from pending to ready. The ISR then returns and continues execution of thread
    A. Sometime later, thread A makes a kernel call to yield the processor, providing
    an opportunity for the scheduler to context switch to thread B.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_194_0.png)


    A thread may explicitly call the scheduler at any time to give other threads a
    chance to run; such a call is known as a yield. The yield call simply moves the
    current thread to the ready state and calls the scheduler, as shown in Figure
    10-5. However, there are other kinds of kernel calls that may implicitly call
    the scheduler:


    +   1. A kernel call to terminate the thread. 1

    +   2. A kernel call to wait for an external event to occur.

    +   3. A kernel call to wait for a shared resource that is currently in use.

    +   4. A kernel call to “sleep” for some specified amount of time.


    1 Control implicitly transfers back to the scheduler when the function that implements
    a thread returns; no kernel call is necessary to terminate the thread.'
