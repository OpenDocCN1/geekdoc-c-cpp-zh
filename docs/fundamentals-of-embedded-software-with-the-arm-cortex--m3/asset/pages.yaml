  md: "Semantically, however, there is a big difference. All of the members of a structure\
    \ occupy separate locations in memory, whereas all of the members of a union occupy\
    \ the same memory (i.e., they overlay one another). Thus, the size of a structure\
    \ is the sum of the sizes of its members, but the size of a union is the same\
    \ as the size of its largest member.\n\nFor example, consider the following:\n\
    \n```\ntypedef union\n{\n    uint64_t    real ;\n    FIXED64PARTS part ;\n} FIXED64REAL\
    \ ;\n```\n\nThis declaration defines a data type for a single 64-bit object that\
    \ can be accessed either as a single 32.32 fixed-point real number or as its separate\
    \ component parts—the whole and the fractional parts. If we create a union of\
    \ this type named \"result,\" then we can refer to the entire object or its parts\
    \ using the identifiers shown in Figure 4-17.\n\n![](img/f0b8aa873b11dc585ed698a10d04e7a7_93_0.png)\n\
    \nFIGURE 4-17 The component parts of the FIXED64REAL union.\n\nUse of a union\
    \ to accomplish variant access eliminates the need to create a macro to hide the\
    \ messy details of using a cast and the \"address of\" operator. Whether or not\
    \ you use a union probably depends on the number of variant accesses required\
    \ and (of course) your own choice of programming style.\n\n# PROBLEMS\n\n+   1.\
    \ True/False:\n+   (a) Compilers generate more instructions to evaluate x & (1\
    \ << 5) than for x & 32.\n+   (b) The C expression &a[5] is a constant.\n+   (c)\
    \ The ANSI standard requires signed integers to use the 2's-complement representation.\n\
