- pgno: 5
  md: '# Dedication


    It may have been many more years ago than I would care to admit, but I do still
    remember what it was like to be an undergraduate. Like my own students, I too
    had to take an occasional class in which much of the material came from slides
    and handouts because the instructor was writing a textbook for the course. So,
    to all those students who have had to suffer through this same experience with
    me, who have unknowingly helped me organize and clarify the material, who have
    tactfully pointed out my mistakes, and who have fueled my inspiration—thank you.
    This book is for you and those that follow in your footsteps.'
  merge: -1
  img_proc: true
