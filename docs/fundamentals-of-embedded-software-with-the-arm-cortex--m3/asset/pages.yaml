    # ## 13.2 THE CPU AND VECTOR TABLE


    When power is first applied, the ARM Cortex-M3 processor automatically loads the
    stack pointer (R13) from address 0 (the first vector table entry) and the program
    counter (R15) from address 4 (the second vector table entry). Then execution begins.
    Thus the initial vector table and the code that it points to must be kept in nonvolatile
    memory that will not lose its content when power is removed.


    The stack may be declared as an array of 32-bit unsigned longs. Since the first
    push will be stored at the address given by SP-4, SP should be initialized to
    the address of the 32-bit word located just after the last entry in the array.
    Thus if the array is declared as 1:


    ```

    static unsigned long pulStack[128] @ ".noninit" ;

    ```


    then the initial value for SP may be specified as &stack[128]. To avoid having
    two places where the size of the stack (128) is specified, the same initial value
    may be specified as:


    ```

    ((unsigned long)&pulStack[0]) + sizeof(pulStack)

    ```


    or simplified as:


    ```

    (unsigned long) pulStack + sizeof(pulStack)

    ```


    1 The unusual text at the end of the line starting with the "at" sign (@) is used
    in IAR''s Embedded Workbench to tell the compiler that this variable should not
    be included among the statics that are initialized by the startup code executed
    just before entering function main as discussed in Section 13.3.2.'
