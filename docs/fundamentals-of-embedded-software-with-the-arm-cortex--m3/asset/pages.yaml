    To compute the remainder of a division, you must subtract the product of the quotient
    and the divisor from the dividend. For example, consider the following C assignment
    statement:


    ```

    remainder = dividend % divisor ;

    ```


    Assuming that all variables are 32-bit unsigned integers, the remainder would
    be calculated in assembly as:


    ```

    LDR R0, dividend ;R0 <- dividend

    LDR R1, divisor ;R1 <- divisor

    UDIV R2,R0,R1 ;R2 <- quotient

    MLS R0,R2,R1,R0 ;R0 <- dividend - divisor x quotient

    STR R0, remainder

    ```


