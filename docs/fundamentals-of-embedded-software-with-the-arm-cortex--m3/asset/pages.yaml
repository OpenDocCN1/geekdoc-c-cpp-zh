- pgno: 197
  md: '# 10.5.2 Priority Inversion


    High-priority threads are intended to have precedence over low-priority threads.
    However, a situation called priority inversion can temporarily defeat this intention
    and is said to exist whenever the completion of one task is delayed by a second
    task of lower priority.


    Priority inversion involves two threads that use the same (shared) resource. For
    example, let us assume that the low-priority thread in Figure 10-8 had previously
    acquired and still holds exclusive access to such a resource. Even though the
    high-priority thread is now running, when it attempts to acquire that same resource,
    the high-priority thread is placed in the pending state and must wait until the
    low-priority thread completes its critical section and relinquishes the resource.
    This simple form of priority inversion exists no longer than the duration of the
    lower-priority thread''s critical section (where it owns the resource). It is
    referred to as bounded priority inversion because the execution time of the low-priority
    thread''s critical section should be designed to be predictable, short, and of
    fixed duration.


    Unbounded priority inversion occurs when a third (medium-priority) thread preempts
    the low-priority thread during the inversion, thus delaying the high-priority
    thread even more. (This is exactly what happened during the Mars Pathfinder mission.)
    It is called "unbounded" because it will persist as long as the medium-priority
    thread has all the resources it needs to continue running, which is unrelated
    to the resource shared by the other two threads and can be unpredictable. There
    are two well-known solutions to this particular problem: the priority inheritance
    protocol (PIP) and the priority ceiling protocol (PCP). Both are based on the
    ability to modify thread priorities at run-time.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_197_0.png)


    2 That Mars Pathfinder software included three threads (among others): a high-priority
    bus management thread that ran quickly and frequently, a medium-priority communications
    thread that ran for a much longer time, and a low-priority meteorological thread
    that ran infrequently. To publish its data the meteorological thread had to acquire
    the (shared) bus. Then the communications thread woke up and preempted the meteorological
    thread. Finally, the bus management thread woke up and was blocked because it
    could not acquire the bus; when it could not meet its deadline, an alarm went
    off that reinitialized the computer via a hardware reset.'
