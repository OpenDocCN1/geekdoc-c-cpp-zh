- pgno: 242
  md: '# System Initialization


    Desktop application programmers never have to worry about *system* initialization.
    The vast majority of application programs are loaded and executed by some sort
    of operating system that has already initialized the system during the boot process
    to provide an appropriate run-time environment. Embedded applications, however,
    almost always start from a power-off condition. When power is applied, the processor
    has no stack, no heap, no interrupt system, and no timer. In addition, the I/O
    devices have to be initialized and the initial values of variables must be copied
    from ROM to RAM.


    Much of what has to be done to get up and running is hardware specific. That is,
    it varies according to the type of CPU, the amount and type of memory, and the
    kind of I/O devices that are attached. It can also be software-specific, in the
    sense that each compiler and/or real-time kernel may impose its own peculiar requirements
    regarding how memory should be organized, how the interrupt system should be configured,
    and the preferred rate of timer ticks.


    This chapter cannot possibly cover every possible variation of how initialization
    can or should be done; it *does* cover how it might be done for programs written
    in C using IAR Systems Embedded Workbench and compiled to run on the Texas Instruments
    LM3S811—a microcontroller (MCU) based on the ARM Cortex-M3 processor. Beyond that,
    this chapter will illustrate how some of the I/O devices (including the interrupt
    controller and programmable timer) would be programmed.


    The order of events in which initialization proceeds is not necessarily the same
    as that presented here. In general, however, CPU initialization is usually first,
    and enabling of the interrupt system is usually last.


    # 13.1 MEMORY LAYOUT


    A good starting point for designing initialization code is to consider what the
    compiler expects. Most applications partition memory into five regions: program
    code (called “text”), initialized statics (called “data”), uninitialized statics
    (called “bss”), the stack, and the heap. Although the relative positions of these
    regions may vary, the initial vector table and code must be located in nonvolatile
    memory (such as flash EPROM) with the vector table positioned at address 0 and
    everything else in read/write memory (RAM) (Figure 13-1).'
  merge: -1
  img_proc: true
