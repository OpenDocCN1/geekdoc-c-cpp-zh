- pgno: 115
  md: 'constants, registers, or memory references. Instructions that transfer data
    between registers and memory usually specify two operands, as in:


    ```

    LDR R0,temperature ;load register R0 from memory location ''temperature''

    STR R1,result ;store register R0 into memory location ''result''

    ```


    Most ARM instructions perform a calculation between two source operands and specify
    a third destination operand. For example, the assembly language ADD instruction
    is written as in:


    ```

    ADD R2,R3,R4 ;R2 ← R3 + R4

    ```


    Each line of source code in assembly language contains a single machine-language
    line as shown in Figure 5-18, each line is divided into four fields separated
    by spaces: the label field, the operation field, the operand(s) field, and the
    comment field. If a label is used, it must begin in column 1 and is usually terminated
    with a colon; otherwise, column 1 must be left blank. Comments begin with a semicolon,
    and the assembler ignores anything to the right of the semicolon.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_115_0.png)


    # FIGURE 5-18 The four fields in a line of code in assembly language.


    The assembler translates each line of source code into the binary representation
    of a single instruction. The most common error that a new assembly language programmer
    makes is misunderstand the purpose of the operand field. Executing the following
    instruction at run time loads the content of a variable called “data” into R0.
    However, during the assembly process (prior to execution) the value represented
    by the identifier is its address.


    ```

    LDR R0,data ;load register R0 with the content of variable "data"

    ```


    This becomes important when the operand field contains an arithmetic expression.
    For example, executing the instruction,


    ```

    LDR R0,data+4 ;load register R0 from an address 4 bytes higher than that of "data"

    ```


    does not add the content of data and four and place the sum in register R0. Rather,
    the addition occurs during assembly; it causes the assembler to add four to the
    address of data and place the sum in the address field of the instruction representation.
    If, for example, the variable data were stored at address 100 in memory, the instruction
    shown above would load register R0 from address 104.'
