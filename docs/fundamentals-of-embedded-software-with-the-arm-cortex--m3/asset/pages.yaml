    In multithreaded applications, two or more threads often communicate with each
    other by passing information through a common data structure. The data structure
    is a special case of a shared resource called shared memory. Asynchronous access
    to such shared memory can occur in three fundamental ways:1


    +   1. Memory may be shared between a thread and an ISR. Data corruption can occur
    if the thread''s critical section is interrupted to execute the ISR.

    +   2. Memory may be shared between two ISRs. Data corruption can occur if the
    critical section of one ISR can be interrupted to execute the other ISR.

    +   3. Memory may be shared between two threads. Data corruption can occur unless
    execution of their critical sections is coordinated.


    Non-preemptive systems inherently afford greater protection than preemptive systems
    against such errors because the programmer has explicit control over where and
    when a context switch may occur. The programmer merely has to ensure that no kernel
    functions that could cause a context switch are called (either directly or indirectly)
    in the middle of a sequence that manipulates the resource.


    In preemptive systems, however, the programmer has no control over when and where
    a context switch may occur, since they can be triggered by an interrupt. In addition
    to avoiding kernel calls, the programmer must arbitrate access to the resource
    using techniques such as those discussed below.


    # 9.3.1 Disabling Interrupts


    When an ISR accesses a shared resource, the only way to protect against corruption
    is to disable interrupts during any other access. However, disabling interrupts
    can also be an appropriate choice when no ISR is involved, provided that interrupts
    are disabled only for a very few lines of code. Note that the longest duration
    of disabled interrupts will add to the worst-case response time of every task.
    However, the overhead of disabling and enabling interrupts is extremely small
    compared to any other technique.


    # 9.3.2 Disabling Task Switching


    Disabling interrupts during the execution of a long critical section can significantly
    degrade system response time. Doing so blocks the execution of all other threads
    and ISRs, even if they do not need access to the shared resource. A slightly different
    approach that still blocks all other threads but leaves interrupts enabled is
    to disable task switching during the critical section. Most kernels provide a
    couple of very fast functions for this purpose. Disabling task switching can protect
    critical sections in competing threads, but since it does not disable interrupts,
    it cannot protect a shared resource manipulated by an ISR.


    1 Note that these examples simply consider memory shared by exactly two asynchronous
    code sequences. More complex variations involving more than two asynchronous code
    sequences are certainly possible.'
