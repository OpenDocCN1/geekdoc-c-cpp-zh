- pgno: 170
  md: 'The polled waiting loop function can be reprogrammed in assembly as shown in
    Figure 8-12 to reduce the execution time and thus increase the maximum data rate.
    The fastest execution of function rs232Output in Figure 8-12 occurs when the device
    is always ready, meaning that the conditional branch (BZ) of the waiting loop
    will fail to branch and instead will fall straight through. Under this condition,
    each iteration of the loop executes a total of eight instructions (none of which
    reference named memory locations), two conditional branch instructions that both
    fall straight through, and one unconditional branch. As detailed in Figure 8-12,
    one pass through the code is estimated to take 14 clock cycles. Typical Cortex-M3
    devices place the program memory on the same chip as the processor, with the memory
    cycle times the same as the processor clock cycle. With a 50-MHz chip, there are
    20 nsec/clock cycle, so that the total execution time of one iteration of the
    for loop (the time to transfer 1 byte of data) will be about 280 nsec (280 x 10^-9
    sec). The maximum data rate is simply inverse of this time, or about 3.6 MB/sec.5
    To put this in context, the fastest RS232 serial device operates at 115,200 bits/sec
    (~10 KB/sec), or 360 times slower than the maximum data rate capability of polled
    waiting loop I/O.


    | EXPORT rs232Output | : | Clock |

    | rs232Output: | : | Cycles |

    | Repeat: CBZ R1,Return | : | 1 (Fail) |

    | OutWait: LDR R3,[R2,#0x18] | : | 2 |

    | TST R3,#0x80 | : | 1 |

    | BEQ OutWait | : | 1 (Fail) |

    | LDRB R3,[R0],#1 | : | 2 |

    | STR R3,[R2] | : | 2 |

    | SUB R1,R1,#1 | : | 1 |

    | B Repeat | : | 4 |

    | Clock cycles | | 14 |

    | Execution time: | | 14 x 20 nsec = 280 nsec |

    | Maximum Data Rate: | | 10^8/280 = 3.6 MB/sec |


    FIGURE 8-12 Estimating data rate performance.


    # 8.4.2 Interrupt-Driven I/O


