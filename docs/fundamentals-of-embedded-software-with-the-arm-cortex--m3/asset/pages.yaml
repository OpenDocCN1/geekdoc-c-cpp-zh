    # 7.2.3 Compound Conditionals


    Simple equality tests and relative magnitude comparisons translate from C to assembly
    in a relatively straightforward manner. However, compound conditionals containing
    two or more conditionals are a little trickier. First, let us consider comparing
    a value against the minimum and maximum of a range of values:


    ```

    if (x >= -100 && x <= +100) y = x ; // Assume that "x" is a signed int.

    ```


    Sometimes it is easier to convert this to assembly if the logical AND is replaced
    by a logical OR. To do so, first replace the conditional by its logical inverse
    and modify the if statement so that it skips over the assignment (instead of executing
    it) when the new condition is true:


    ```

    if (!(x == -100 && x <= +100)) goto L1 ;

    ```


    ```

    L1: y = x;

    ...

    ```


    Next, use DeMorgan''s law from Boolean algebra to remove the logical NOT. To do
    so, replace all the logical ANDs (`&&`) by logical ORs (`||`), all logical ORs
    by logical ANDs (there are none in this example), and all operands (the two conditionals)
    by their inverse. The result is


    ```

    if (x < -100 || x > +100) goto L1 ;

    ```


    ```

    L1: y = x;

    ...

    ```


    Now that the expression is ORing the results from the two compares, it is much
    easier to visualize how to separate the two comparisons into two if statements:


    ```

    if (x < -100) goto L1;

    ```


    ```

    if (x > +100) goto L1;

    ```'
