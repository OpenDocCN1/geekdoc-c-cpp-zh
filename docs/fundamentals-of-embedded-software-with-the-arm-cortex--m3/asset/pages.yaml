    # 5.5 ARM ASSEMBLY LANGUAGE


    Programming in assembly language is a tedious yet occasionally necessary process.
    What is possible in a single line of code in a high-level language like C inevitably
    requires several lines of code in assembly. For example, to simply add the content
    of two integer variables and store their result in a third requires four lines
    of code in ARM assembly.


    The assembly language programmer also has to manage a lot more detail. While a
    C programmer can let the compiler determine what conversions may be needed when
    mixing operands of different type, this becomes your responsibility when you program
    in assembly. Basic operations that we take for granted, such as subscribing an
    array, parameter passing, and pointer dereferencing, suddenly require the design
    of sequences of instructions.


    Just like learning a foreign language, before learning how to program in assembly,
    we have to first learn the vocabulary—the instructions that are available, the
    nuances of their semantics, how they are written, and what options they allow.


    # 5.5.1 Instruction Formats and Operands


    The ARM Cortex-M3 processor implements the Thumb and Thumb-2 instruction subsets
    of the ARM family. In assembly language, ARM instructions are written as an operation
    code (or simply, “opcode”) followed by zero or more operands that may be'
