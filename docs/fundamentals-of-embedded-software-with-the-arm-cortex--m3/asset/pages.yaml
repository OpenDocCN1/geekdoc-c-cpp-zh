    before the function returns as is done in function f2 of Figure 7-13.


    When a function calls are nested, the second call will overwrite the current return
    address held in LR. Thus when one function (such function as f3 in Figure 7-13)
    contains a call (BL) to a second function (f4), the first must push the content
    of LR at its entry and pop it back just before it returns. Note that since LR
    is already on the stack, the BL LR instruction normally used to return to the
    caller may be eliminated by replacing LR by PC in the POP instruction.


    Registers R0 through R3 are not a good place for functions that call other functions
    to keep information. For example, in Figure 7-13, the call to function f4 may
    require parameters to be placed in R0 through R3, and/or may modify their content
    before return. Therefore, a common practice is for f3 to move its parameters and
    temporaries into R4 through R11, preserving their original content on entry to
    f3 and restoring them just before it returns.


