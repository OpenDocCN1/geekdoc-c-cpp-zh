  md: '# 6.8.2 Arithmetic Instructions


    The Thumb-2 instruction subset provides the four basic arithmetic operations of
    addition, subtraction, multiplication, and division. In addition, an RSB (reverse
    subtract) instruction is provided when you need to subtract the value of a register
    from a constant, and an NEG (negative) instruction when you need to change the
    sign of a value held in a register (Table 6-7).


    | Instruction | Operation | [S] | Notes |

    | :--- | :--- | :--- | :--- |

    | ADD | Rd, Rn, <op2> Rd <- Rn + <op2> | NZCV | |

    | ADC | Rd, Rn, <op2> Rd <- Rn + <op2> + C | NZCV | |

    | SUB | Rd, Rn, <op2> Rd <- Rn - <op2> | NZCV | |

    | SBC | Rd, Rn, <op2> Rd <- Rn - <op2> - C - 1 | NZCV | |

    | RSB | Rd, Rn, <op2> Rd <- <op2> - Rn | NZCV | Reverse subtraction |

    | MOV | Rd, <op> Rd <- <op> | NZ | Carry may be affected by <op> |

    | NEG | Rd, Rn Rd <- -Rn | | Always updates: NZCV |


    The ADC instruction is used to perform multiple precision addition on operands
