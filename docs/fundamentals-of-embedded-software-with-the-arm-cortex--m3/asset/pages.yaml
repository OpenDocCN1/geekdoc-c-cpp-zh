  md: '# 4.5.2 I/O Devices Differentiated by Reads Versus Writes


    Sometimes two (or more) different I/O ports share a single address. This usually
    occurs when one port is write-only (such as a command port) and another is read-only
    (such as a status port). Data written to the command port cannot be read from
    the status port. Writes to the address access the write-only port, while reads
    access the read-only port.


    For example, consider the set of eight port addresses assigned to one of the serial
    UART devices on a PC, as shown in Table 4-8. Bit 7 of I/O address 02FB is called
    the Divisor Latch Access Bit (DLAB). When DLAB is 1, I/O address 02FB is connected
    to the least-significant byte of the current baud rate divisor, which can be read
    or written; when DLAB is 0, writes to 02FB send characters out on the serial line,
    but reads from 02FB retrieve characters that have arrived.


    | I/O Address | DLAB | Restriction | Description |

    | :--- | :--- | :--- | :--- |

    | 02F8 | 0 | Write-Only | Transmitter holding register (holds character to be
    sent) |

    | | 0 | Read-Only | Receiver buffer register (contains the received character)
    |

    | | 1 | | Least-significant byte of baud rate divisor latch |

    | 02F9 | 1 | | Most-significant byte of baud rate divisor latch Interrupt enable
    register |

    | 02FA | n/a | Read-Only | Interrupt ID Register |

    | 02FB | n/a | | Line control register (Bit 7 is the DLAB bit) |

    | 02FC | n/a | | Modem control register |

    | 02FD | n/a | Read-Only | Line status register |

    | 02FE | n/a | Read-Only | Modem status register |

    | 02FF | n/a | | Reserved |


    # 4.5.3 I/O Devices Differentiated by Sequential Access


    Sometimes multiple read-only ports are assigned to a single address; in this case,
    they are usually distinguished by the order in which the data is read. Of course,
    an access counter must exist somewhere in the hardware of the I/O device, and
    there must be a separate means of initializing it. Multiple write-only ports assigned
    to a single I/O address can also be distinguished by order, or by the value of
    specific bits in the data that is written.


    Consider the 8259 programmable interrupt controller used in the PC. As indicated
    in Table 4-9, it contains six registers, accessed via only two I/O addresses.
    For example, registers OCW1, ICW2, ICW3, and ICW4 share the same I/O address.
    Access to ICW2, ICW3, and ICW4 is sequential, and can only occur immediately after
    writing to ICW1. At all other times, writes to this address go to register OCW1.
    Figure 4-10 illustrates a function that initializes the four ICW values.


    4 The sequence of instructions that write data into these registers must be executed
    with interrupts disabled. Otherwise, the code sequence might be invalidated by
    an interrupt routine that executes code that happens to write to these same registers.'
