- pgno: 106
  md: 'The first byte of an instruction contains the operation code (or simply “opcode”)
    and an indication of whether there are additional bytes in the instruction that
    need to be retrieved. The opcode bits are decoded by the control unit, which then
    causes the appropriate sequence of control signals to occur in a specific order
    to carry out the execute phase of the instruction. Any additional bytes of the
    instruction will be retrieved (and the PC incremented) during this phase; these
    bytes may be required to provide a constant to be used as an operand, or to retrieve
    information about what registers to use or about how to compute the address of
    an operand in memory.


    The specific details of what happens during the execute phase depend on the particular
    instruction that is being executed. For example, an instruction that loads data
    from memory into the accumulator (Figure 5-8) takes the address of a memory operand
    from the instruction register, places it on the memory address bus, initiates
    a memory read operation, and then transfers the memory data through the ALU to
    the accumulator.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_106_0.png)


    FIGURE 5-8 CPU components used during the execute phase to load a register from
    memory.


    Once an operand has been loaded into the accumulator, a subsequent instruction
    can perform an addition between it and a second operand, taking one operand from
    memory, a second from the accumulator, and replacing its content with the result
    (Figure 5-9).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_106_1.png)


    FIGURE 5-9 CPU components used during the execute phase of an ADD instruction.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The fetch-execute cycle inherently provides sequential (i.e., “straight-line”)
    execution of instructions. Loops and decisions require that we branch and begin
    fetching instructions from some location other than the one immediately following
    the current instruction. Branch instructions accomplish this by loading an entirely
    new address into the PC during the execute phase. This address may have been stored
    as a constant embedded within the instruction, as a value retrieved from a register
    or read from memory, or as the result of some calculation performed during the
    execute phase of the branch instruction (Figure 5-10).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_107_0.png)


    FIGURE 5-10 CPU components used during the execute phase of a branch instruction.


    # 5.3 INPUT/OUTPUT


    The I/O system of a computer includes everything other than the CPU and memory.
    This includes not only devices designed to interface with humans, such as keyboards
    and displays, but also other kinds of devices, such as disk drives, network interfaces,
    sensors, and actuators.


    Every I/O device is connected to the computer through some sort of interface.
    The interface may exist as a plug-in adapter card, as additional circuitry that
    resides on the same printed circuit board as the CPU, or may even be built into
    the processor chip itself.


    Connecting external devices to a computer is primarily a problem of synchronization.
    I/O devices usually operate at speeds that are unrelated to and much slower than
    the processor—typically orders of magnitude slower. Some form of handshaking to
    coordinate transfers between the two is always necessary so that the computer
    will not output data faster than an output device can accept it and not try to
    process input data that has not yet become available.


    There are a number of different hardware and software strategies for I/O. These
    are considered in more detail in a later chapter. Choosing the most effective
    combination for a particular kind of device is a system-level design decision
    that is almost always a compromise between performance and cost.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 5.4 INTRODUCTION TO THE ARM® CORTEX™-M3 v7M ARCHITECTURE


    Any practical discussion of computer organization must ultimately focus on a particular
    CPU. Although the information presented here is for a single processor among the
    ARM family of microprocessors, this section is not intended to be a comprehensive
    description of that processor or others in the ARM family. Our objective here
    is to understand how the algorithms we implement in a higher-level language like
    C are brought to life within the architecture of a specific microprocessor, and
    to be able to code at either level when appropriate or necessary.


    Here, we present only a first introduction to the ARM® Cortex-M3 v7M architecture,
    which was specifically designed for small-footprint embedded applications. The
    Cortex-M3 processor implements the Thumb-2 instruction subset of the ARM architecture
    specification. Most Thumb-2 instructions are 16 bits wide, expanded internally
    to a full 32-bit ARM instruction. The next few chapters provide a number of examples
    of assembly language code that illustrate the more commonly used Thumb-2 Instructions.


    # 5.4.1 Internal Organization


    ARM processors have a sophisticated CPU capable of performing multiple low-level
    operations in parallel. As operands are read from memory and placed on the data
    bus, a hardware sign extender converts 8-bit and 16-bit operands to a full 32-bit
    representation so that all data inside the CPU are always 32 bits wide.


    The ARM processor uses a "load-store" architecture. This means that any computation
    must first use load instructions to read the operands from memory into registers
    and a store instruction must be used to write the result back to memory. In other
    words, instructions such as add, subtract, bitwise-and, and so on can only operate
    on the contents of registers; they cannot operate directly on the contents of
    memory locations. Such instructions take their operands from registers (referred
    to as Rm and Rn) and leave a result in a register referred to as Rd.


    A barrel shifter allows operand Rm to be shifted left or right arithmetically,
    logically, or rotated any number of bit positions before being combined with operand
    Rn in the ALU. Among other advantages, the barrel shifter allows calculations
    of the form Rn + 2xRm. When the same register is specified for both Rn and Rm,
    the barrel shifter simplifies the calculation of certain multiples of a value,
    such as 5X = X + 2^2X or -7X = X - 2^3X (Figure 5-11).


    A separate memory address calculator (MAC) prepares subscribed and relative address
    references for memory access, and a special incrementer can adjust the memory
    address on subsequent instructions without having to entirely recalculate the
    address, which can be useful in repetitive operations such as initializing the
    contents of an array to a constant value.


    The CPU contains a set of 13 general-purpose registers (R0 through R12) and three
    special-purpose registers (R13, R14, and R15). The general-purpose registers are
    divided into the "low" registers (R0 through R7) and the "high" registers (R8
    through R12), with minor restrictions regarding which instructions can use the
    latter. R15 is used as the PC, R13 as the SP, and R14 as the "link" register (LR)
    that holds the return address when a subroutine is called.'
  merge: -1
  img_proc: true
