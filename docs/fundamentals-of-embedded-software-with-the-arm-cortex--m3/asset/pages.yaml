    the way that the compiler expects functions to operate. Beyond the simple mechanics
    of transferring control to the subroutine and returning, being compatible also
    demands that we understand:


    +   1. Where to find parameters that are passed to our function,

    +   2. Where to leave return values so that the caller can find them, and

    +   3. Which registers must be preserved and which may be modified.


    Fortunately, these requirements are specified by the ARM Architecture Procedure
    Call Standard (AAPCS), which is summarized in Table 7-6. It uses registers R0
    through R3 to hold the first four words of parameters passed to a function and
    registers R0 and R1 to hold the return value. R0 is used to return 8-bit, 16-bit,
    and 32-bit values; 64-bit values are returned in R0 and R1, with R1 holding the
    upper 32 bits. Registers R0 through R3 may be modified as needed within a function
    without regard to their original content. Most other registers are available for
    use as well, but their original contents must be preserved before any modification
    and restored before the function returns.


    # 7.4.3 Parameter Passing


    Registers R0 through R3 are used to pass parameters (Figure 7-10) and are usually
    sufficient for the kind of small support routines that we write in assembly.8
    The compiler loads each 8-bit, 16-bit, or 32-bit parameter into a single register
    assigned in left-to-right order; double-word parameters are passed in two consecutive
    registers (e.g., R0 and R1, R1 and R2, or R2 and R3), with the upper 32 bits in
    the second register of the pair. The called function may modify the contents of
    R0 through R3 and so has no obligation to return with the original parameter values
    still in them.


    8 When a function is called with more than four parameters of 32 bits each, the
    compiler will push the remainder onto the stack prior to the call; it is then
    the function''s responsibility to restore SP to its original value before returning.
    A popular alternative is to store the parameters in a structure and pass the address
    of the structure to the function.'
