    # 9.1.2 Managing Latency


    If the task implemented by an ISR performs all of the work associated with an
    external event, it may have quite a bit of work to do. It then becomes important
    to implement an interrupt priority system in hardware and to re-enable higher-priority
    interrupts as soon as possible near the beginning of each ISR. Do not forget,
    however, that lower-priority interrupts remain disabled as long as we stay in
    the ISR! If the ISR contains a lot of code, then the latency times imposed on
    lower-priority interrupts may still be intolerable if they are not re-enabled
    until the end of the ISR.


    For example, an ISR that handles an input device might need to process the input
    data and then the results to some output device. But of course you cannot write
    to the output device until it is ready. If the ready status of the output device
    is polled inside the ISR, as shown in Figure 9-3, any pending lower-priority interrupts
    will have to wait an unspecified amount of time. This is obviously unacceptable.'
