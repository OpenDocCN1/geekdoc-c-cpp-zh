- pgno: 49
  md: '# 2.6 BINARY-CODED DECIMAL


    Binary-coded decimal (BCD) is a representation in which each digit of a decimal
    number is encoded separately. Storing the digits separately simplifies the process
    of recording numeric data from a keypad or displaying results on a numeric display
    such as that of a cash register.


    There are 10 decimal digits, thus requiring four bits to encode each digit. In
    packed BCD, two decimal digits are stored in a single byte to eight bits. Unpacked
    BCD stores only a single digit per byte to facilitate access to the individual
    decimal digits of a number. Examples of these two formats are shown in Figure
    2-11. Packed BCD was introduced many years ago as a means to conserve memory.
    With the drastic decline in the price of memory, use of packed BCD is no longer
    as important.


    The BCD format represents only the magnitude of a number; if signed numbers are
    required, the sign must be stored separately and the number manipulated as if
    it were a sign-plus-magnitude format.


    Some computers provide special instructions to support BCD arithmetic and for
    converting between BCD and unsigned binary. Usually, however, these instructions
    do not provide a complete set of arithmetic operators and must be combined with
    other instructions within more complex algorithms to perform any really useful
    arithmetic.


    Decimal digits can also be represented using their corresponding ASCII codes.
    Many display devices now use ASCII input data, and converting between a BCD digit
    and its ASCII representation is extremely simple. Given a byte containing a value
    between 0 and 9, simply OR it with 00110000 to get its ASCII representation; given
    the ASCII representation of a decimal digit, simply AND it with 00001111 to recover
    the corresponding decimal integer.


    Given today''s extremely fast processor speeds, any advantage that BCD instructions
    once offered is now relatively insignificant.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_49_0.png)


    FIGURE 2-11 Packed and unpacked BCD representations.'
  merge: -1
