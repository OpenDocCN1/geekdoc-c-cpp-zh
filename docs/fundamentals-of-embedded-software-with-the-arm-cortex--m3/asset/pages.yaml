  md: 'The const keyword allows a number of interesting possibilities when used in
    the declaration of a pointer, as suggested by the examples shown in Table 12-1.


    | Declaration | Interpretation |

    | :--- | :--- |

    | int total; | "total" is a (modifiable) int. |

    | const int year = 1999; | "year" is a read-only int. |

    | const int *p; | "*p" is a (modifiable) pointer that points to a read-only int.
    |

    | int * const p = &total; | "p" is a read-only pointer that points to a (modifiable)
    int. |

    | const int * const p = &year; | "*p" is a read-only pointer that points to a
    read-only int. |


    Note that attaching the const attribute to an object does not mean that its value
    cannot be modified—it is simply a syntactic restriction enforced only during compilation.
    It still remains possible to circumvent this restriction during program execution.


    # 12.4 CODING PRACTICES TO AVOID


    Static objects are most commonly problematic when they are modified within shared
    functions. However, there are two good reasons why it is always a good idea to
    try to avoid modifying static objects in *any* function—even in those that are
    called by only a single thread:


    +   1. First, you cannot determine whether a function is shared simply by checking
    whether it is called by name in more than one thread. Finding calls in multiple
    threads is sufficient, but not necessary, condition of sharing. That is because
    when a shared function calls another function, the second function is implicitly
    shared as well.


    +   2. Second, we all strive to be productive programmers, and thus try to avoid
    “reinventing the wheel” by reusing existing code as much as we can. But this sometimes
    means that an unshared function previously used in only one thread may one day
    be used in multiple threads.


    We cannot eliminate the problems of static objects by not using them. Sometimes
    they are just plain necessary. But by avoiding certain coding practices, we can
    eliminate the most common problems. The following are two typical examples of
    functions that modify local static objects and should be avoided.


