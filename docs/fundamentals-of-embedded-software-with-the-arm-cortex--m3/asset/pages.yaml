  md: '# 11.7 DYNAMIC ALLOCATION


    Dynamic objects are allocated from a region of memory known as the *heap* using
    the library function malloc. The `sizeof` operator is normally used to determine
    the amount of memory required to hold an object of the desired type, and this
    result is provided as a parameter to malloc. An unused portion of the heap large
    enough to accommodate the request is allocated, and a pointer to the beginning
    of the allocated memory is returned. This pointer is usually recast and saved
    in a pointer to data of the desired type.


    When the object is no longer needed, it is the programmer''s responsibility to
    release the memory by calling the library function free, giving it the same pointer
    value that was originally provided by malloc. Until released, the location of
    the object in memory never changes.


    The use of malloc and free is illustrated in Figure 11-5. Although the figure
    suggests that an object''s lifetime is a range of lines of code, it is a dynamic
    property—not a property of program syntax. Lifetime is more correctly understood
    in terms of elapsed time and as a consequence of program *behavior*. In fact,
    the pointer may be passed from function to function, with malloc and free invoked
    within different functions or even in different threads.


    ```

    #include <stdlib.h>       /* required to use malloc and free. */

    #define NULL    ((void*) 0)     /* may not be defined in stdlib.h */

    typedef ... ANYTYPE ;

    ...

    ANYTYPE *p ;

    p = (ANYTYPE *) malloc( sizeof(ANYTYPE) ); /* object created */

    if ( p == NULL ) Error("Insufficient heap space") ;

    ...

    The object is initialized and used here via the pointer p.

    ...

    free(p) ;                     /* object destroyed */

    ```


    FIGURE 11-5 Dynamic memory allocation.


    The *advantage* of dynamic allocation is that it offers both the persistence of
    static allocation and memory conservation through reuse. The *disadvantage* is
    the burden it places on the programmer to balance each call to malloc with a corresponding
    call to free. Failure to do so can result in a slow “memory leak” that can be
    very difficult to debug.


    # 11.7.1 Fragmentation


    After a large number of calls to malloc and free, the allocated blocks in the
    heap may become separated by free blocks that are too small to be useful. This
    fragmentation can'
