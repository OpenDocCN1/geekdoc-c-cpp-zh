    that (from address PC-4) is executed. Note that the PC holds the address of the
    instruction currently being fetched, not the one being executed. By overlapping
    these operations, instructions can be executed at the rate of one every clock
    cycle rather than one every three clock cycles (Figures 5-13 and 5-14).


    When a branch instruction is executed, the other two instructions in the pipeline
    must be discarded and the pipeline refilled. To accelerate the process, the processor
    fetches the destination instruction during the decode stage. For conditional branch
    instructions, the branch decision is determined during the execute stage. If the
    branch decision fails, then the next sequential instruction already in the pipeline
    is executed.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_110_1.png)


