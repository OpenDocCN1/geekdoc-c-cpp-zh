- pgno: 70
  md: '# # Getting the Most out of C


    This chapter assumes that you have already had an introduction to programming
    in C, C++, or Java. Knowledge of any one is sufficient to program in C, since
    all three languages share a common syntax for data types, declarations, expressions,
    and control statements.


    Few students manage to master a programming language in their first programming
    course. This chapter is not a complete treatment of C, nor is it intended to be.
    However, it does provide several examples of complete C programs to help reinforce
    the basics. If your only experience has been in C++, or Java, do not be surprised
    if it takes a while to make the paradigm shift from the object-oriented style
    of programming to the procedural style used in C.


    Every programming language has its own variety of syntactic and semantic features.
    Some of these have more significance in software written for real-time embedded
    systems than in normal desktop applications. Writing software for embedded systems
    demands a careful understanding of integer data types and of facilities for manipulating
    bits and bytes. This chapter describes in detail how these features are implemented,
    using features of C that are either omitted or only touched on briefly in most
    introductory courses and usually only mastered after years of experience.


    # ## 4.1 INTEGER DATA TYPES


    In 1989, the International Organization for Standardization published the C89
    standard (often referred to as ANSI C), which defined an extensive set of integer
    data types as shown in Table 4-1. The reserved words char and int are the names
    of fundamental data types, with unsigned, signed, short, long, and long long modifiers.
    If one or more modifiers appear in a declaration, the reserved word int is usually
    understood and may be omitted. If neither signed nor unsigned is used, signed
    is assumed by default.


    The sizes and ranges given in Table 4-1 are typical, but are not required by C89.
    In fact, the 1989 standard allowed three possible signed representations: sign-plus-magnitude,
    1''s-complement, and 2''s-complement. When used to hold an integer, the fundamental
    data type char may default to either signed or unsigned, and the primitive data
    type int may have a size anywhere between that of a short or a long int.


    In embedded applications, it is often imperative to know the exact number of bits
    and range of variables. Several new data types that resolve the data type size
    and range ambiguities were introduced in the 1999 ISO C99 standard, are documented
    in the new stdint.h header file introduced by C99, and are now widely implemented
    by most C compilers (Table 4-2).'
  merge: -1
  img_proc: true
