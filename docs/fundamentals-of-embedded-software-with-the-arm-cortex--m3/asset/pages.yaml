  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_229_0.png)


    If one of the parameters passed to a reentrant function happens to be a pointer,
    then a situation is created that allows (but does not force) the function to modify
    an external shared object. This does not mean that the function is no longer reentrant;
    rather, it is simply a problem with the manner in which the function has been
    used, and we must examine the call to correct any problem.


    # 12.3 READ-ONLY DATA


    Not all shared data affect the complexity of multithreaded programs in the same
    way. Data corruption occurs when shared data is modified. If the shared data is
    read but never written, then no data corruption can occur. A table of constants
    would be used in this manner and is considered an example of read-only data.


    It is always difficult to anticipate how the use of an object may change as a
    program matures. Program modifications may one day add code that modifies data
    that was once read only. For example, configuration data that was once hard-coded
    into a program may one day be loaded from a file during program initialization.


    At a minimum, you should add a comment to any shared read-only data so that you
    will remember that it can be ignored when trying to locate the cause of a shared
    data problem. But a better way is to syntactically protect the data against modification
    by declaring the object with the type qualifier “const”.


    # 12.3.1 Type Qualifier "const"


    The keyword const is used to declare that an object’s value may not be modified
    by the program—that is, its value is “read only.” This provides a bit of defensive
    programming since the compiler will then report any attempt to directly modify
    the object as a syntax violation. The declaration statement that creates a const
    object must include an initial value, since no subsequent attempt to set its value
    is allowed.


    As compared to defining a macro to represent a constant value, note that a const
    declaration makes the data type explicit:


    ```

    #define AGE 35 /* "AGE" is merely text to be replaced */

    const int age = 35; /* "age" is a signed int with value 35 */

    ```'
