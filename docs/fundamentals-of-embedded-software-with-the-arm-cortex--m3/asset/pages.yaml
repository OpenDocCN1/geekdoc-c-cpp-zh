    # 4.1.1 Integer Range and the Standard Header File LIMITS.H


    Before defining your own data types for a compiler that does not support the C99
    standard, you should verify that the size and range of the fundamental integer
    data types are the same as shown in Table 4-1. Most compilers provide a standard
    header file called limits.h that specifies the range of integer types implemented
    by the compiler. The minimum and maximum values supported by each type are specified
    by macros as given in Table 4-3.


    | Data Type | Minimum | Maximum |

    |---|---|---|

    | signed char | SCHAR_MIN | SCHAR_MAX |

    | signed short int | SHRT_MIN | SHRT_MAX |

    | signed long int | LONG_MIN | LONG_MAX |

    | signed long long int | LLONG_MIN | LLONG_MAX |

    | unsigned char | 0 | UCHAR_MAX |

    | unsigned short int | 0 | USHRT_MAX |

    | unsigned long int | 0 | ULONG_MAX |

    | unsigned long long int | 0 | ULLONG_MAX |


    You can also compile and run the program in Example 4-1 to check the size and
    range of integer data types for any C compiler (Figure 4-1). The program measures
    the size of each data type by counting how many 1-bit shifts are needed to empty
    all the 1''s out of an operand.


    The program then determines if the data type is unsigned by comparing an operand
    and that has a 1 in its most-significant bit against zero. The operand''s value
    will be interpreted as less than zero only if the data type is signed.


    If the data type is signed, the program then determines whether the representation
    is 2''s-complement, 1''s-complement, or sign-plus-magnitude by checking how it
    represents the value of -1. The maximum (most positive) value will always be the
    same for all three representations. The minimum (most negative) value is determined
    by the appropriate bit patterns for that representation.


    The program does not attempt to compute the range of either signed or unsigned
    long long simply because some of the older compilers that are not C99 compliant
    (and for which this code is most useful) do not support those data types.'
