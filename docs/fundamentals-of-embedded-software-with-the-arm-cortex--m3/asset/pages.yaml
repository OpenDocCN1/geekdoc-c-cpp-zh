  md: '# 7.3.1 Speeding Up Array Access


    Loops that work with arrays are common and are thus good candidates for optimization.
    They typically sequence through the elements of an array in order, making it possible
    to take advantage of the pre- and post-increment addressing capability of the
    processor. For example, these addressing modes can improve performance when initializing
    an array to a constant value, scanning an array for a particular value, copying
    one array to another, or comparing two arrays. All such loops must either load
    or store an element of the array and then increment or decrement the address;
    pre- and post-increment combine these two operations into a single instruction.


    # Pre-increment address mode


    The syntax for pre-increment address mode simply adds an exclamation point after
    the closing square bracket:


    ```

    LDR R0, [R1, #4]! ; R1 ← R1 + 4, then R0 ← mem[R1]

    LDR R0, [R1, R2]! ; R1 ← R1 + R2, then R0 ← mem[R1]

    LDR R0, [R1, R2, LSL #2]! ; R1 ← R1 + (R2 << 2), then R0 ← mem[R1]

    ```


    # Post-increment address mode


    The syntax for post-increment address mode simply moves the closing square bracket
    so that it follows the first register:


    ```

    LDR R0, [R1], #4 ; R0 ← mem[R1], then R1 ← R1 + 4

    LDR R0, [R1], R2 ; R0 ← mem[R1], then R1 ← R1 + R2

    LDR R0, [R1], R2, LSL #2 ; R0 ← mem[R1], then R1 ← R1 + (R2 << 2)

    ```


    For example, by using post-increment addressing and the CBNZ instruction, copying
    a NUL-terminated string from one area of memory to another may be implemented
    as a loop of three instructions:


    ```

    ADR R0, source ; R0 ← starting address of source string

    ADR R1, destination ; R1 ← starting address of destination string

    copy: LDRB R2, [R0], #1 ; R2 ← char from source string; R0++

    STRB R2, [R1], #1 ; char in destination string; R2++; R1++

    CBNZ R2, copy ; continue until last char copied is a NUL

    ```


    When the data to be copied is known to be a multiple of 4 bytes, copying is even
    faster when the load multiple and store multiple instructions. Each instruction
    can transfer 1 or more 32-bit words between registers and memory and update another
    register that holds the memory address (Table 7-4).'
