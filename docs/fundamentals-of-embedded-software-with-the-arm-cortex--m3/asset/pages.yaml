- pgno: 207
  md: '# # Memory Management


    Although memory-resource management is of concern in any programming project,
    it is even more crucial for embedded systems. We have seen how multithreaded code
    is essential to meet the response time demands of real-time systems, and how it
    can often simplify the design of complex applications by partitioning the software
    into a set of smaller and simpler (but related) tasks.


    In multithreaded code, each thread operates on its own private data but often
    communicates with other threads by accessing a small amount of shared data. Any
    data that is manipulated by more than one thread or Interrupt Service Routine
    (ISR) creates a situation known as “shared memory” and demands careful coordination
    of access, or else data corruption can and will occur. Unfortunately, the really
    frustrating difficulty about programming a multithreaded application is that it
    is relatively easy to accidentally create unintentional instances of shared memory
    without even realizing it.


    This chapter reviews those features of C that manage data and its creation, initialization,
    deletion, and accessibility. Establishing a clear understanding of these features
    (including their relative advantages, disadvantages, and alternatives) will prepare
    us to build robust multitasking software that protects the integrity of its data.
    The goal of this chapter is not only to master the familiar use of scope to limit
    accessibility of private data, but also to develop a foundation for a thorough
    treatment of shared-memory issues in the next chapter so that we can recognize
    and avoid those programming practices that create unintentional shared memory.


    # ## 11.1 OBJECTS IN C


    In the original C programming language, an object was defined as a region of memory
    that can be examined and modified. This predates the development of object-oriented
    programming that expanded the notion of object. For the purposes of this text,
    however, you may simply think of objects as variables—either scalar (e.g., char,
    int, or pointer) or aggregate data types (e.g., struct or union).


    Every object possesses a number of different attributes, as summarized in Table
    11-1. The most familiar of these include their data type, name, value, and address.
    The less familiar notions of scope and lifetime are important object attributes
    even in regular desktop-application programming, but they are even more important
    for us because they provide the fundamental mechanisms by shared data and restricted
    access.


    Scope and lifetime are the “where and when” of objects. Programmers speak of the
    scope of an object using words such as local and global to refer to where within
    the'
