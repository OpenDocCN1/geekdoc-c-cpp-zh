    Repeated division works for any number base—that is, we can convert a decimal
    whole number to any other number base R simply by repeatedly dividing by R. The
    remainders are inherently limited to the range of 0 to R – 1, which is exactly
    the same as the range of digit values of a base R number. The remainder from the
    first division determines the least significant digit of the result, and the quotients
    are used to repeat the process until the quotient becomes zero.


    # Repeated multiplication


    Repeated division works great for whole numbers, but does not work at all for
    fractional numbers. Instead, we must use a different algorithm called repeated
    multiplication.


    Before presenting the algorithm, consider what happens when you multiply a fractional
    number like 0.1234 by 10. We can think of the product (1.234) consisting of a
    whole part and a fractional part. That is, the most significant digit of the original
    number is “extracted” as the whole part of the product, with the remaining digits
    left in the fractional part. Note that the whole part of the product must always
    be a single digit in the range of 0 to 9. We can repeat the process on the remaining
    fractional part to extract the rest of the digits in a left-to-right (most to
    least significant) order.


    If we multiply by 2 instead of 10, we know that the whole part can only be 0 or
    1. Just as the whole part of multiplying by 10 was the most significant (left-most)
    digit of the original decimal representation of the value, the whole part of multiplying
    by 2 will be the most significant digit of its binary representation. Thus, repeating
    the process will produce binary digits in left-to-right (most to least significant)
    order.


    Repeated multiplication works for any number base—that is, we can convert a decimal
    fraction to any other number base R simply by repeatedly multiplying by R. The
    whole part of the products are inherently limited to the range of 0 to R – 1,
    which is exactly the same as the range of digit values of a base R number. The
    whole part from the first multiplication determines the most significant digit
    of the result, with the fractional part of the products used to repeat the process.'
