- pgno: 80
  md: 'corresponding bit position of the result, while all other bits of the other
    operand pass through unchanged.


    When clearing bits in variables whose size (width in bits) is greater than that
    of integer constants (which default to type int), you must be careful that constants
    used to define the mask are as wide as the operand. For example, if the variable
    ‘bits’ is of type uint64_t, the 1 in the right-hand side of the assignment must
    also be promoted to the same width before the shift, as in


    ```

    bits &= ~(((uint64_t) 1) << 7); /* clears bit 7 */

    ```


    Otherwise, the compiler will first evaluate the constant expression on the right-hand
    side as a default int (normally 32 bits wide), and then pre-pad leading 0’s to
    the resulting constant to match the width of variable bits. These extra 0’s will
    then clear unintended bit positions in the result.


    Inverting (or toggling) a bit is accomplished with the bitwise-XOR operator:


    ```

    bits ^= (1 << 6); /* flips bit 6 */

    ```


    Although adding 1 instead of using the bitwise-XOR would invert the target bit,
    it may also propagate a carry that would modify more significant bits in the operand.


    # 4.4.3 Extracting Bits


    A bit field is a contiguous subset of bits stored within a larger variable, such
    as the individual components of date and time stored in a single 32-bit location.
    Extracting the value of a bit field is accomplished by shifting right to remove
    unwanted bits to the right of the field and ANDing with a mask to remove unwanted
    bits on the left (Figure 4-5):


    | time | Bits 15 - 11 | Bits 10 - 5 | Bits 4 - 0 |

    | :--- | :--- | :--- | :--- |

    | | Hours | Minutes | Seconds + 2 |

    | time >> 5 | Bits 15 - 11 | Bits 10 - 6 | Bits 5 - 0 |

    | | ????? | Hours | Minutes |

    | (time >> 5) & 0x3F | Bits 15 - 11 | Bits 10 - 6 | Bits 5 - 0 |

    | | 00000 | 000000 | Minutes |

    | minutes = (time >> 5) & 0x3F | 15 | Minutes | 0 |


    FIGURE 4-5 Extracting minutes from a packed representation of time.


    # 4.4.4 Inserting Bits


