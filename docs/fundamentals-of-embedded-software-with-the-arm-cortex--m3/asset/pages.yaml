  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_234_0.png)


    Consider the code shown in Figure 12-8. On the left is a sequence of instructions
    in its main program that has removed an item from a queue and is now decrementing
    its count. On the right is the ISR that enters data into the queue and then increments
    its count. If the ISR interrupts the main program in the middle of the instruction
    sequence that decrements the count, then the ISR''s incremented count will be
    over-written when it returns to the main program, and the program will not know
    that a new item has been added to the queue.


    For example, suppose that the initial count of items in the queue is 10. When
    the main program removes an item from the queue, it starts to decrement the count.
    It loads the old count (10) into register R1 to begin the decrement sequence but
    is suddenly interrupted by the ISR before it can go any further. All of the registers
    (including R1) of the main program are saved on the stack upon entry to the ISR.
    Then the ISR inserts a new item into the queue and increments the queue count
    from 10 to 11, restores the registers of the main program (including the value
    of 10 that was in R1), and returns. The main program resumes where it left off,
    decrements R1 to R9, and then stores that into count, thus overwriting the value
    of 11 that was put there by the ISR. Note that there was one queue insertion and
    one deletion, so the queue count should still be 10 when we are done. But because
    of the shared memory conflict, the count was left at 9!'
