    # 9.1.3 Interrupt Overrun


    Now consider the box labeled “Process Data” in the input-ready ISR of Figure 9-6.
    If all the substantial work is done in the ISRs, this box may correspond to a
    lengthy computation, causing interruptions with the same or lower priority to
    remain disabled for a very long time. If this situation (called interrupt overrun)
    occurs, one needs to consider whether the processor and algorithms are really
    fast enough for the data-rate demands of the external devices. Occasionally, however,
    missing one or more interrupts may not be that disastrous. For example, a missed
    interrupt of periodic samples taken from a slowly changing analog signal can often
    be replaced by averaging the previous sample with the next.


    # 9.1.4 Moving Work into the Background


    A somewhat obvious way to reduce latency is to move any non-time-critical work
    (such as updating a display) into the background thread. Data to be processed
    is written into a queue by the foreground ISR, and then read from the queue for
    background processing. This sometimes provides a much-needed alternative when
    the system cannot tolerate ignoring one or more interrupts as the result of interrupt
    overrun.'
