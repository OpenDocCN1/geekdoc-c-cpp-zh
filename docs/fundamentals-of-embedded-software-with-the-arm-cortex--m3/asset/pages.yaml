  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_172_0.png)


    Estimating the worst-case latency from time of interrupt request to the moment
    that data is read from the device is relatively straightforward. We simply add
    one cycle to complete or abandon the current instruction, the time required for
    stacking and the rest of the exception response, and the execution time of the
    first two instructions in the ISR required to actually read the data from the
    device. As shown in Figure 8-14, this adds to a total of 17 clock cycles, or 340
    nsec.


    # 8.4.3 Direct Memory Access


    DMA is a high-performance, low-latency I/O data-transfer method. A special hardware
    DMA controller attached to the processor handles the actual transfers. The extra
    cost of the controller causes it to be omitted unless it is required by the demands
    of the attached I/O devices.


    DMA controllers must be initialized through software to specify the source and
    destination of each transfer and the number of bytes to be transferred. The transfers
    may be from an input device to memory or from memory to an output device. Once
    initialized, the DMA controller takes over and performs the transfer without further
    assistance from the processor. Once all the bytes have been transferred, the DMA
    controller issues a hardware interrupt to the CPU to signal completion.


    DMA controllers operate in basically one of two modes: either block transfer or
    cycle stealing. In block transfers, the DMA controller takes control of the memory
    bus from the CPU, transfers all of its data, and then returns the bus to the CPU.
    In cycle stealing mode, the DMA controller transfers a single byte whenever it
    can steal the bus from the CPU, then returns the bus to the CPU and waits for
    the next opportunity.


    Although we have previously assumed a memory with a cycle time of one 20 nsec
    processor clock cycle, that was only feasible between a processor and a memory
    that were both on the same chip. DMA is more often used in situations where the
    memory'
