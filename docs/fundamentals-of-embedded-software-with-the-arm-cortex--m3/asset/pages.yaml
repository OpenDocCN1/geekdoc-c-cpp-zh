    Otherwise, the destination instruction fetched during the decode stage can be
    decoded and executed with only a one-cycle delay. To further reduce these “pipeline
    stalls,” some Cortex-M3 instructions can be selectively enabled or disabled based
    on the status of the flags rather than using a conditional branch instruction
    to avoid them.


    # 5.4.3 Memory Model


    The ARM specification reserves specific regions within the 4-GB memory address
    space of the Cortex-M3 MCU for code, data, and memory-mapped I/O devices. Specific
    implementations of the Cortex-M3 specification may implement only portions of
    each region, but always use the regions in a manner that is consistent with the
    specification. The memory is byte-addressable, but each memory cycle transfers
    a full 32-bit word of 4 bytes. Code and data are stored in separate and independent
    hardware; instructions are fetched over the I-Code bus from a nonvolatile flash
    memory while the system bus is used to access data in static read/write memory
    (or peripherals). Since the two memories are physically separate, overall performance
    is enhanced by a Harvard-style architecture with separate data paths that allow
    simultaneous instruction and data access (Figure 5-15).


    # 5.4.4 Bit-Banding


    The 32-bit address bus available in a 32-bit processor provides a 4-GB address
    space that is much larger than needed for almost any embedded application. The
    Cortex-M3 design takes advantage of the extra space to implement a hardware feature
    known as “bit-banding.” The technique uses two different regions of the address
    space to reference the same physical data. Within the primary “bit-band region,”
    each address corresponds to a single byte of data; within the “bit-band alias,”
    each address corresponds to a single bit of that same data. The advantage of bit-banding
    is that an individual bit of data can be read or written by a single instruction
    rather than requiring a sequence of bit-manipulation'
