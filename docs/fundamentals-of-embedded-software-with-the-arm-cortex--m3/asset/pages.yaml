    # 6.8.5 Bit Field Manipulation Instructions


    Extraction and insertion of bit fields whose position and width is fixed is easily
    implemented using Thumb-2 instructions. A single instruction can insert 0''s into
    a bit field of a register, copy the least significant bits of a register into
    a bit field of another, or extract a bit field from a register and expand it into
    a 32-bit signed or unsigned value. In each case, the least significant bit (lsb)
    position and width of the bit field are specified by the last two (constant) operands
    of the instruction (Table 6-11).


    | Instruction | Operation | [S] | Notes |

    | :--- | :--- | :--- | :--- |

    | BFC | \( R_d<bits \leftarrow 0 \) | | |

    | BFI | \( R_d<bits \leftarrow R_c<lsb> \) | | |

