  md: 'Since both Enqueue and Dequeue modify the same queue data structure, interrupts
    must be disabled within both functions, or else the data could become corrupted.
    Interrupts are disabled on entry to Enqueue and Dequeue function disable, and
    re-enabled on exit by calling the C library function disable.


    # 8.3.1 Double Buffering


    Cycle stealing DMA is usually used to fill a buffer with a large block of data
    (such as the 512 bytes of data stored in one sector of a hard disk) with processing
    of the data delayed until the buffer is full. Although the DMA proceeds concurrently
    with other computation, the rate at which blocks of data can be processed is slowed
    by the time required to fill the buffer, as shown in Figure 8-8.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_167_0.png)


    FIGURE 8-8 Single-buffered DMA.


    We learned how a queue could be used to decouple two asynchronous threads of code
    that communicate through a shared buffer. Although we could use a queue in which
    each entry is a block of data, the amount of memory required may be unjustified.
    A common compromise is a special case of a queue containing exactly two blocks,
    called double buffering. While DMA is filling one of the buffers, the CPU is retrieving
    data from the other. Once both the DMA and the CPU are finished using their buffers,
    the buffers are swapped and the process is repeated. As shown in Figure 8-9, the
    time required to transfer data via DMA in one buffer is overlapped with that required
    for the CPU to process the data in the other, thus effectively doubling the overall
    processing rate.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_167_1.png)


    FIGURE 8-9 Double-buffered timing'
