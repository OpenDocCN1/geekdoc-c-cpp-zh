    # 4.7.1 Packed Structures


    Structures are stored in memory with their member components in the same order
    as they appear in the structure description. However, there is no requirement
    that the components be contiguous. This freedom allows the compiler to align members
    on word boundaries in order to trade memory space in return for faster access
    time (Figure 4-13).5


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_88_0.png)


    FIGURE 4-13 Structure padding used for address alignment.


    Sometimes, however, we need to use structures to describe a layout in which all
    the data are contiguous. In such cases, we must disable our compiler’s structure
    padding to accurately describe the organization of the data. The way this is done
    sometimes varies from one compiler to another, but with a Microsoft, Borland,
    or GNU (gcc) C/C++ compiler, this can be accomplished with pragma directives as
    demonstrated by the program shown in Figure 4-14.'
