  md: '# # Scheduling


    Multithreaded programming is a common strategy for embedded software. Partitioning
    an application into separate threads of execution with careful management of communications
    among the threads tends to simplify the design of each thread. Once partitioned,
    it is appropriate to consider how these threads compete for their share of processor
    time.


    # ## 10.1 THREAD STATES


    We begin by recognizing that only one thread can be running, and that the rest
    must be waiting for their turn, as shown in Figure 10-1. The job of a _scheduler_
    is to manage turn-taking in a manner that meets performance requirements.


    To compete for processor time, each thread must be made known to the scheduler
    by making a call to the kernel. Before that call is made, the thread is unknown
    to the scheduler and is said to be _inactive_. As shown in Figure 10-2, threads
    are thus in one of three states (_inactive_, _running_, or _ready_), with the
    kernel managing transitions of threads from one state to another.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_192_0.png)


    **FIGURE 10-1** Scheduler selects thread to run while others wait.


    A simplistic scheduling algorithm called _time-slicing_ runs each thread for the
    same fixed amount of time. When a thread reaches the end of its allocated time
    slice, the kernel simply gives control to the next thread in the sequence, repeating
    the sequence over and over again. While time slicing may be an appropriate strategy
    for some types of applications, real-time systems require a kernel that is much
    more responsive to external events.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'FIGURE 10-2 Initial thread state diagram.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_193_0.png)


    # 10.2 PENDING THREADS


    To optimize processor utilization, scheduling must recognize that threads often
    have to wait for some event to occur or some shared resource to become available.
    When this happens, the scheduler should run a different thread while the first
    one waits. Simply moving the delayed task back into the ready state is not appropriate,
    however, because the thread may be selected to run again later, only to discover
    that it must continue to wait, thus adding unnecessary task switching overhead.


    The solution is to introduce a fourth state called pending, shown in Figure 10-3.


    When a running thread reaches a point where it cannot proceed until some specific
    condition is satisfied (such as the occurrence of an external event or the release
    of a shared resource), another kernel call is used to change the thread to the
    pending state; the scheduler then selects and runs one of the other threads from
    the ready list. When the pending condition is ultimately satisfied, another kernel
    call to the scheduler moves the pending thread to the ready state.


    FIGURE 10-3 Revised thread state diagram.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_193_1.png)'
