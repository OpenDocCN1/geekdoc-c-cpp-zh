    # FIGURE 12-2 Typical usage of the strtok library function.


    invocation of strtok to the next, the pointer must use static allocation, and
    this means that only a single copy of the pointer exists. But this will cause
    obvious problems when more than one thread tries to use this function!


    We now know that library function strtok keeps track of local state information
    that is used the next time it is called. A sample source-code version of strtok
    is given in Figure 12-3, showing the use of a static local variable called state
    to hold this information.


    ```

    char *strtok(char *string, char *delimeters)

    {

    static char *state ;

    char *beg, *end ;

    if (string != NULL) state = string ;

    if (state == NULL) return NULL ;

    beg = state + strspn(state, delimeters) ;

    if (*beg == ''\0'') return NULL ;

    end = strpbrk(beg, delimeters) ;

    if (end == NULL) state = NULL ;

    else {end++ = ''\0''; state = end; }

    return beg ;

    }


    This local static object causes problems when strtok is called from more than
    one thread.

    ```


    # FIGURE 12-3 Library function strtok with problematic local static object.


    A thread-safe (reentrant) version of strtok (called strtok_r) solves the problem
    by replacing the local static pointer by a thread-specific object created by the
    caller and accessed by the function via a parameter as shown in Figure 12-4.'
