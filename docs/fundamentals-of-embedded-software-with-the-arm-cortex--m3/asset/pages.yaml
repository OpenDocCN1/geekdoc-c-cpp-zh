    to the number of bytes of stack space required,<sup>9</sup> and then referencing
    the allocated memory locations using positive SP-relative offsets (e.g., [SP,
    #8]). The original value of SP must be restored by adding the constant back to
    SP just before the function returns.


    There are two good reasons why it is important to use registers or stack space
    for temporary variables instead of creating fixed locations with labels:


    +   1. **Memory conservation**: The stack space will be automatically released
    when the function returns so that it can be reused for other needs.

    +   2. **Reentrancy**: Every entry of the function allocates a unique set of memory
    locations for its temporary variables. Thus, if the function is interrupted, and
    the interrupting code calls (or reenters) the same function, it is ensured that
    each invocation will modify only its own set of temporary variables.


    Although the memory space just beyond the current top of the stack is not currently
    in use, it must still be allocated (reserved) before we put our temporary variables
    there. For example, if our function calls another function, the called function
    may overwrite an indeterminate amount of this space. Even if no other function
    is called, a hardware interrupt may occur, invoking an interrupt service routine
    that overwrites the space. Thus, to protect the temporary variables we place in
    this "unused" portion of the stack, we must first adjust the stack pointer (and
    restore it later when the variables are no longer needed).


    # 7.4.6 Preserving Registers


    Functions that modify registers must generally preserve and restore their previous
    contents on the stack. However, since the stack is stored in memory, and since
    memory cycles are the primary performance bottleneck, it is important to preserve
    as few registers as possible.


    <sup>9</sup>To preserve address alignment, the constant should be a multiple of
    four.'
