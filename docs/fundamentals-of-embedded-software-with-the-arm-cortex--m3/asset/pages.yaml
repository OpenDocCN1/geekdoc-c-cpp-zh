- pgno: 120
  md: '# CHAPTER 6


    # Programming in Assembly Part 2: Data Manipulation


    The ARM processor is an example of a “Load/Store” architecture, which means that
    all computations (addition, multiplication, and so on) are performed on data held
    in registers, not in memory. In other words, data must be moved to a register
    before you can operate on it. The data transfer instructions include those for
    loading constants into registers, loading and storing memory data, and stack operations.


    # 6.1 LOADING CONSTANTS INTO REGISTERS


    The Thumb-2 instruction subset includes instructions for loading a constant into
    a register. The MOV and MVN instructions embed a constant within the representation
    of the instruction itself. Such constants are referred to as “immediate” constants
    since they are immediately available once the instruction has been fetched, without
    the need to load the constant from a separate memory location.


    The MOV instruction copies the constant into a register; the MVN instruction is
    essentially a “move not,” copying the inverse of the constant into a register:¹


    ```

    MOV R1, #100 ;R1 <- 100

    MVN R1, #100 ;R1 <- ~100 (same as R1 <- -101)

    ```


    Constants are always preceded by a pound sign. By default, constants are written
    in decimal: hexadecimal constants must be preceded by “0x,” as in “MOV R1, #0xF3.”


    Although the MOV instruction of the processor only supports positive constants,
    if you code a negative constant, the assembler will convert it to an equivalent
    MVN instruction. For example, the assembler will replace “MOV R1, #-100” by “MVN
    R1, #99.”


    Unfortunately, neither the MOV nor the MVN instruction supports the full range
    of 32-bit values since only a small number of bits of the instruction are used
    to hold the constant. As a result, the MOV and MVN instructions are limited to
    constants in the range of 0 to 255 and a “few” other values. When a different
    value is needed, the only alternative is to store the constant in a separate memory
    location and load it using a memory reference instruction.


    ¹ The source operand of an MOV or an MVN instruction can be any of a constant,
    a register, or a shifted register.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The good news is that there is a special “pseudo-operation” that will work
    for *any* constant up to 32 bits wide. You simply write what appears to be a regular
    ARM instruction (except that an equal sign is substituted for the pound sign)
    and let the assembler sort out the most efficient way to achieve your objective:


    ```

    LDR R1,#10 ;assembler replaces this by MOV R1,#10.

    LDR R1,#15 ;assembler replaces this by MVN R1,#14.

    LDR R1,#127435 ;assembler replaces this by a memory reference

    ;instruction that loads the constant from a

    ;separate memory location.

    ```


    # 6.2 LOADING MEMORY DATA INTO REGISTERS


    The LDR instruction is used for loading data from memory into a register. The
    normal LDR instruction loads (copies) a 32-bit value from memory into a register.
    However, when loading 8- or 16-bit data into a 32-bit register, the operand itself
    is always right justified within the register and its most significant bits filled
    according to whether the value is signed or unsigned (Figures 6-1 and 6-2).


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_121_0.png)


    FIGURE 6-1 The LDRH instruction fills bits 16 to 31 with zeroes.


    Unsigned operands less than 32 bits wide must fill the extra bit positions with
    zeroes (called “zero-filling”). This insures that the unsigned interpretation
    of the register’s contents is the same as the unsigned interpretation of the data
    loaded from memory. For example, the load register with unsigned half word from
    memory (LDRH) instruction is used with 16-bit *unsigned* integers; it loads a
    16-bit half word from memory into the least significant 16 bits of a register
    and fills the remaining 16 bits with 0’s. Similarly, load register with unsigned
    byte from memory (LDRB) is used with 8-bit unsigned integers; it loads an 8-bit
    byte from memory into the least significant 8 bits of a register and fills the
    remaining 24 bits with 0’s.'
