- pgno: 198
  md: 'Consider a system in which a low-priority thread has acquired a shared resource.
    As long as this thread maintains ownership, higher-priority threads that attempt
    to acquire the same resource will be blocked. The objective of both PIP and PCP
    is to limit how long blocking persists by preventing medium-priority threads from
    preempting (and thus delaying) the low-priority threads until they relinquish
    ownership of the resource.


    Arbitration for a shared resource is implemented by an associated mutex that is
    unlocked when the resource is available, and locked when it is in use. Threads
    request exclusive access by making a kernel call to attempt to lock the mutex.
    If the mutex is already locked, the attempt fails and the thread is placed in
    the pending state until the mutex is unlocked. Otherwise, the kernel locks the
    mutex and allows the thread to continue. The thread is then said to *own* the
    mutex until it makes a subsequent kernel call to unlock it.


    # 10.5.3 The Priority Ceiling Protocol


    PCP specifies that the priority of a thread be raised immediately when it acquires
    a shared resource and restored to its original value when it releases the resource.
    The temporary priority is a value predetermined by the programmer as the highest
    among all the threads that access the same resource and is referred to as the
    priority *ceiling*.


    An interesting aspect of PCP is that it can be easily implemented in the source
    code of the thread. All that is required is a call to a kernel library function
    to raise priority before acquiring the resource and another to lower the priority
    after the resource is released. If PCP is implemented in the kernel instead, the
    ceiling is simply provided as a calling parameter when the mutex is created and
    kept within an associated data structure maintained by the kernel. This approach
    is preferred because PCP then becomes transparent to the application except for
    the initial mutex creation.


    The disadvantage of PCP is that it *always* raises the priority, whether a higher-priority
    thread is blocked or not, and may thus delay the execution of other threads unnecessarily.
    Moreover, when there are more than two threads that access the resource, raising
    the priority all the way to the ceiling value may be more restrictive than required.


    # 10.5.4 The Priority Inheritance Protocol


    PIP is implemented in the kernel code that locks and unlocks the mutex. If and
    when a thread fails to lock a mutex, the kernel looks up which thread owns the
    mutex.³ If the owner has a priority lower than the thread now blocked, the kernel
    temporarily raises the priority of the owner to match that of the blocked thread
    until the resource is released.


    PIP is transparent to the source code of the thread since it is implemented entirely
    in the kernel. Overall system response time performance is better with PIP than
    PCP. PIP raises the priority of the low-priority thread only when it begins to
    block a higher-priority thread, and thus delays the execution of other threads
    only when necessary.'
