  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_196_0.png)


    # 10.4 ROUND-ROBIN SCHEDULING


    Scheduling refers to the process by which the kernel selects one of the ready
    threads to run. The simplest scheduling algorithm is called round-robin scheduling.
    The kernel maintains a queue containing a list of threads that are ready to run.
    When the scheduler needs to select a thread to run, it merely removes the next
    thread from the front of the queue; threads are entered at the rear of the queue
    as they change to the ready state.


    Round-robin scheduling simply treats all threads as having equal importance. In
    most real-time applications, however, certain threads are more important than
    others. For example, a task that updates a display can certainly be delayed relative
    to a task that applies brake pressure in an antilock braking system.


    # 10.5 PRIORITY-BASED SCHEDULING


    Scheduling algorithms for real-time systems select which thread to run based on
    priority numbers that the programmer assigns to each of the threads. Static priorities
    never change during the execution of the application; we will see, however, that
    dynamic priorities are necessary in order to make system response time fast and
    predictable.


    # 10.5.1 Resource Starvation


    A poorly designed multithreaded system can sometimes suffer from a situation called
    starvation. Starvation occurs when a thread is never scheduled to run because
    it cannot acquire one (or more) of the resources it needs—usually the CPU. For
    example, a high-priority thread that never yields or blocks will always be given
    the CPU in preference to any lower-priority thread. The lower-priority thread
    is then said to be CPU starved.


    Note that it is not necessary for threads to explicitly yield or block to prevent
    starvation. If two threads have the same priority, neither will starve the other
    if the scheduler is designed to cycle through equal priority threads in round-robin
    style to insure that each has a chance to run. However, assigning the same priority
    to multiple threads would be inappropriate if they have different response time
    requirements. In this case, we must be careful to design the system so that no
    resource is perpetually dominated by a single thread.'
