    Using LDRH and LDRB to zero-fill unsigned values and LDRSH and LDRSB to sign-extend
    signed values is necessary to produce a numerically equivalent 32-bit representation
    of the original operand. Of course zero-filling and sign-extending are not needed
    when loading a 32-bit word or 64-bit double word, so there is only one instruction
    (LDR) for loading a 32-bit word operand and only one (LDRD) for loading a 64-bit
    double-word operand.


    LDRB loads a pair of registers with the two halves of a 64-bit double-word value.
    The 64-bit value is stored in little-endian format with the least significant
    half (bits 0 to 31) stored in byte addresses N through N + 3, and the most significant
    half (bits 32 to 63) stored in byte addresses N + 4 through N + 7. The least significant
    half is loaded first into the left-most register listed in the instruction, followed
    by the most significant half then loaded into the second register (Table 6-1).'
