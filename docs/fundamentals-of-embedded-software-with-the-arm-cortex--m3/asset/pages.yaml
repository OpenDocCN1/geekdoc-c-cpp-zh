  md: 'Signed operands less than 32 bits wide must fill the extra bit positions with
    copies of their sign bit. “Sign-extending” is used because the ARM processor (like
    most modern processors) uses the 2’s-complement representation of signed numbers.2
    For example, the load register with signed half word from memory (LDRSH) instruction
    is used with 16-bit signed integers; it fills the remaining 16 bits of the register
    with 16 copies of the sign bit (bit 15) of the memory operand. Similarly, load
    register with signed byte from memory (LDRSB) is used with 8-bit signed integers
    and fills the remaining 24 bits of the register with 24 copies of the sign bit
    (bit 7) of the memory operand.


