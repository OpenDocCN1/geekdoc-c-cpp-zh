  md: 'Trying to fix the problem in C by casting the product to a 32-bit value before
    dividing will not work because it simply extends an incorrect 16-bit product to
    an equivalent incorrect 32-bit representation. The only solution in C is to cast
    the operands before the multiplication.


    It gets even more interesting if the variables are 32-bit integers containing
    large values like 10^6. Although casting them into 64-bit integers before multiplying
    will work, there is no 64 x 64 bit multiply instruction, so the compiler is forced
    to generate code that calls a library function to do the multiplication. Also
    note that although you could code in assembly and use the SMULL instruction to
    produce the 64-bit product from two 32-bit operands, there is no divide instruction
    that can use a 64-bit dividend.


    With that background, now think about trying to write software in C to multiply
    two 16.16 fixed-point integers x and y to produce a 16.16 fixed-point, z. Although
    the operands and product are all 32-bit values, you must calculate a 64-bit product
    because the 16.16 fixed product lies in the middle of the 64-bit integer product.
    Thus, the only way to do this efficiently is in assembly:


    ```

    LDR R0, x ;R0 ← x (a 16.16 fixed-point real)

    LDR R1, y ;R1 ← y (a 16.16 fixed-point real)

    SMULL R0,R1,R0,R1 ;R0,R1 ← 64-bit integer product

    LSLR R0,R0,#16 ; keep 16 MSBs of least significant half

    ORR R0,R0,R1,LSL#16 ;and 16 LSBs f the most significant half

    STR R0, z

    ```


