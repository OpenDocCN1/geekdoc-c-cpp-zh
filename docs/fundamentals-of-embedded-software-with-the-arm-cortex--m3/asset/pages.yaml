    \ Setting Up a Heap\n\nThe heap is traditionally implemented as a linked list\
    \ of dynamic memory blocks. Normally, the list should initially contain a single\
    \ free block corresponding to the entire heap space. When memory is to be allocated,\
    \ the list is searched to find a block large enough to satisfy the request. The\
    \ search may use a first-fit or best-fit algorithm. If no block large enough is\
    \ found, failure is indicated by returning a NULL pointer to the requestor. Otherwise,\
    \ the selected block is split into two blocks, one that is allocated and given\
    \ to the requestor and another that holds the remaining free space.\n\nThe code\
    \ that manages the heap is provided as a set of library routines. Either they\
    \ will be part of the regular C run-time library, or you may replace them with\
    \ your own.\n\nIt is possible in many embedded applications to avoid using dynamic\
    \ memory entirely and thus save the code space required to manage the heap. Having\
    \ a heap, however, is usually convenient and sometimes required by the real-time\
    \ kernel for the data structures that are needed to create a thread, queue, semaphore,\
    \ or mutex. In many cases this may be the only use of the heap with no need to\
    \ provide a function to release allocated blocks. This not only completely eliminates\
    \ the possibility of heap fragmentation, but also reduces the size of the code\
    \ considerably since there is no need to recombine adjacent free blocks when memory\
    \ is released.\n\nEmbedded applications that must be able to occasionally release\
    \ heap space must be designed to avoid heap fragmentation. A common strategy is\
    \ to round up the size of each request so that all allocated blocks are of the\
    \ same size, or to create wrapper functions that divide the heap into a set of\
    \ allocation pools, each with a fixed block size. Although blocks may be released,\
    \ these techniques do prevent fragmentation, and also eliminate the need to recombine\
    \ adjacent free blocks, thus simplifying and improving the speed of the code.\n\
    \nFor these reasons, you may find that there is more than one version of the heap\
    \ library,⁴ or that it may be compiled with different configuration options.\n\
    \n³ DATA_Z refers to the segment in read/write memory where the uninitialized\
    \ statics reside.\n\n⁴ The FreeRTOS kernel include source code for three different\
    \ sets of heap functions. As described above, one eliminates the function that\
    \ releases memory, a second provides this function but does not combine adjacent\
    \ free blocks, and the third is simply a wrapper for the standard C run-time library\
    \ functions malloc and free."
