  md: '# 9.3.3 Spin Locks


    Another choice is to leave both interrupts and task switching enabled and to arbitrary
    execution of the competing critical sections so that they do not interfere with
    each other. In other words, while one thread is in a critical section, other threads
    should be blocked if they arrive at the entry point of a critical section that
    manipulates the same resource.


    One simple step is to associate a single Boolean flag with each shared resource.
    As shown in Figure 9-13, the flag is set before entering a critical section and
    cleared on exit; while the flag is set, all other access to the same resource
    is blocked. Blocking is provided by a tight loop that "spins" while the flag is
    set. The wait loop''s testing of the flag and its subsequent setting must together
    form a single atomic operation called a "test-and-set"; otherwise, if the flag
    is clear and a context switch to a competing thread occurs between the test and
    the setting of the flag, then neither thread may be blocked.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_188_0.png)


    FIGURE 9-13 Using a "spin lock" to protect a critical section.


    Although not shown in Figure 9-13, all spin lock loops should include a kernel
    call. For preemptive kernels this is usually a call to put the thread to "sleep"
    for a few milliseconds before testing the flag again and improves performance
    by reducing the overhead of frequent context switching. The call is absolutely
    necessary for non-preemptive systems to give other threads a chance to run; without
    this call, the lock would never be released (by the thread that locked it) and
    the program would effectively stop.


    # 9.3.4 Mutex Objects


    Although spin locks allow unrelated code to continue, the kernel must occasionally
    perform a context switch back to the spin lock to retest the flag and then return
    via another context switch if it is still locked. The overhead of context switching
    is much'
  merge: -1
