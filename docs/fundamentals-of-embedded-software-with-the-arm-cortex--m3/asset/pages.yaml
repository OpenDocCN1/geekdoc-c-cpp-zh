    # Dealing with large products


    If we do the arithmetic by hand, multiplying two n-bit integers produces a product
    of 2n bits. However, multiplication in C produces a product of the same data type
    (and thus the same size) as the operands. Consider the following line of C code:


    ```

    a = (b*c) / d ;

    ```


    If all the variables are 16-bit integers, the generated assembly code will be
    similar to:


    ```

    LDRSH R0, b

    LDRSH R1, c

    MUL R0, R0, R1

    SXTH R0, R0 ;Force a 16-bit representation (short × short → short)

    LDRSH R2, d

    SDIV R0, R0, R2

    STRH R0, a

    ```


    Now, consider what happens when b, c, and d each contain a large value like +10,000.
    Mathematically, the final result should also be +10,000, but the 32-bit product
    is too large to be represented in 16 bits and thus the division will not yield
    the correct result.


    7 That is why the MUL, MLA, and MLS instructions only keep the least-significant
    half of a double-length product.'
