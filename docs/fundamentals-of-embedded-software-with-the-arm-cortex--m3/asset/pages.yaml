- pgno: 29
  md: '# Data Representation


    There are various types of data—numeric, text, images, audio, and so on. No matter
    what type we consider, if we are going to process data using a computer, then
    the data must first be converted into a format that the computer understands.
    Computers are constructed from electronic devices that use voltages to represent
    values. To simplify the electronics, the devices are either “on” or “off”; thus,
    only two voltages are used. So, it should come as no surprise that computers store
    information as patterns consisting of only two symbols (“0” and “1”).


    In the familiar decimal (base 10) number system, we use a sequence of digit symbols
    to represent numbers greater than 9. The same technique is used in the binary
    (base 2) system to represent numbers greater than 1. In principle, much of what
    you already know regarding multidigit decimal numbers (e.g., counting, adding,
    subtracting) remains the same with binary numbers.


    # 2.1 FIXED-PRECISION BINARY NUMBERS


    # Computers store integers and real numbers differently


    You probably already know that computers distinguish numbers according to whether
    they have a fractional part. Whole numbers with no fractional part are called
    integers, while numbers that have a fractional part are called real numbers. Most
    real numbers are stored in a computer using a floating-point representation. Integers
    and real numbers use entirely different representations because the hardware required
    for implementing arithmetic is much simpler and faster for integers than it is
    for floating-point numbers. Not only do we need to use both kinds, but because
    of the reliability demands on writing software for embedded systems, we also need
    to comprehend fully how these kinds of numbers differ from those we use in everyday
    math and the restrictions that are the consequence of this difference.


    # Computers store numbers using more binary digits than their decimal equivalent


    Obviously, we must learn how to convert back and forth between decimal and binary.
    As we do, we will see that for any one value, more binary digits are required
    than decimal digits. For example, the value 1234 requires only four digits in
    the base 10 system, but when it is converted to a base-2 representation, the result
    (10110010010) requires many more digits. In general, the smaller the base, the
    more digits we need to represent the same value. As a result, large binary numbers
    are tedious and are prone to transcription errors. However, after a little practice,
    you will soon discover that'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'conversion between base-2 and base-16 (hexadecimal) representations can be
    done almost instantly by inspection. “Hex” numbers use far fewer digits than their
    binary equivalent, so we’ll use hex as a convenient shorthand notation when we
    discuss the binary numbers stored in the computer.


    # Computers store numbers using a fixed number of digits that limits range


    With paper-and-pencil arithmetic, there is no limit to the number of digits that
    numbers can have. However, numbers processed by a computer use hardware that is
    designed to handle a limited number of binary digits (“bits”). Similar to a car’s
    five-digit odometer that can only display values from 0 to 99,999 miles, computers
    store numbers using a fixed number of bits that restricts the range of values
    that can be represented. Several fixed precision options are usually available:
    a “byte” of 8 bits, a “half-word” of 16 bits, a “word” of 32 bits, or a “double-word”
    of 64 bits. Numbers stored with fewer bits (such as a byte) clearly require less
    memory, but offer a very limited range of values. Having options allows programmers
    to conserve memory by choosing the smallest representation for each variable that
    still provides the necessary range of values. Thus, we need to fully understand
    these restrictions.


    # Computers do not store signed numbers using “sign-plus magnitude” like we do


    As humans, we write the sign and magnitude of a number separately. That is, we
    write the magnitude as a digit sequence preceded by a minus or (optional) plus
    sign. This allows us to change the sign of a number without changing the digit
    sequence of its representation. This sign-plus-magnitude system is intuitive for
    humans, because it makes it relatively easy to comprehend the size of a number
    and how it relates to other numbers.


    However, computers do not comprehend numbers; they simply need to process them
    quickly and cheaply. Although the sign-plus-magnitude system could be used with
    binary numbers by allocating an extra bit to indicate the sign, it turns out that
    representing signed numbers this way unnecessarily complicates the hardware that
    performs arithmetic. Thus, we will need to learn another way to represent signed
    numbers called 2’s complement.


    In summary, there are several fundamental differences regarding the storage of
    numbers in a computer compared with what we are used to:


    +   1. Computers store binary numbers consisting of only 0’s and 1’s.

    +   2. Computers store integers and real numbers differently.

    +   3. Computers store numbers using more binary digits than their decimal equivalent.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   4. Computers store numbers using a fixed number of digits that limits range.


    +   5. Computers do not store signed numbers using “sign-plus-magnitude” like
    we do.


    Obviously, we must understand how to convert between human and computer representations
    and how the computer performs arithmetic when using binary numbers. We also need
    to understand how the above differences can have unanticipated consequences and
    what to do when they occur.


    # 2.2 POSITIONAL NUMBER SYSTEMS


    When we see a number written as a sequence of decimal digits, we interpret its
    value almost immediately without a second thought. That is because we have learned
    that, as we read digits from left to right, the first digits we see are more significant
    than those that follow and because we have memorized an ordering on the symbols
    that assigns more weight to “9” than to “0.”


    Positional number systems (such as our familiar decimal system) use sequences
    of symbols to represent large numbers. The value represented by the sequence can
    be expressed mathematically by a simple polynomial in which the arithmetic value
    of each symbol is weighted relative to its position. For example, the value of
    the decimal sequence 1234 is


    ```

    1234₁₀ = 1 x 10³ + 2 x 10² + 3 x 10¹ + 4 x 10⁰

    = 1 x 1000 + 2 x 100 + 3 x 10 + 4 x 1

    ```


    When we switch from decimal to binary, we simply use powers of 2 in the polynomial
    instead of powers of 10. For the more general base-R case, simply use powers of
    R:


    ```

    5678ᵣ = 5 x R³ + 6 x R² + 7 x R¹ + 8 x R⁰

    ```


    This technique also handles numbers with a fractional part, as long as we remember
    that the exponents are negative on the right-hand side of the radix² point:


    ```

    36.72ᵣ = 3 x R¹ + 6 x R⁰ + 7 x R⁻¹ + 2 x R⁻²

    ```


    What is important about this is that we are able to use our familiar decimal arithmetic
    to evaluate this polynomial—but only when the target representation is decimal
    — that is, when we are converting from some other number base system to decimal.
    Going the other way would not work unless you use base-R arithmetic to evaluate
    the polynomial—something you really do not want to have to do! Thus, in what follows,
    we will use polynomial evaluation to convert to decimal, but an entirely different
    technique to convert from decimal.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 2.2.1 Binary-to-Decimal Conversion


    # Polynomial evaluation


    With our understanding of positional number systems, we are now prepared to convert
    binary numbers into decimal. All that is required is to apply a polynomial evaluation
    with R equal to 2. For example, we convert the binary number 1011.01112 to decimal
    as follows:


    ```

    1 x 2^3 + 0 x 2^2 + 1 x 2^1 + 1 x 2^0 + 0 x 2^-1 + 1 x 2^-2 + 1 x 2^-3 + 1 x 2^-4

    = 8 + 2 + 1 + 1/4 + 1/8 + 1/16 = 11.4375_10

    ```


    Note that, since the positional weights are powers of 2 instead of 10, each binary
    digit contributes significantly less to the total magnitude than a digit in the
    equivalent decimal representation. Thus, the number of digits required to represent
    any particular value grows as the choice of base gets smaller.


    # Simplifying the arithmetic


    Converting a binary number that has a fractional part may require several divisions
    to compute the contribution of the fractional bits. In the above example, three
    such divisions were necessary. Many find it easier to do the arithmetic by simply
    changing the problem. If we remember that 1011.01112 is equivalent to 101101112
    x 2^-7, then the conversion can be evaluated with only a single division, as in:


    ```

    (1 x 2^7 + 0 x 2^6 + 1 x 2^5 + 1 x 2^4 + 0 x 2^3 + 1 x 2^2 + 1 x 2^1 + 1 x 2^0)
    + 16

    = (128 + 32 + 16 + 4 + 2 + 1) + 16 = 183 + 16 = 11.4375_10

    ```


    # 2.2.2 Decimal-to-Binary Conversion


    We do not use polynomial evaluation to convert from decimal (base 10) to base
    R because doing so requires performing base R arithmetic. Although it may seem
    counterintuitive, it is actually easier to convert the whole and fractional parts
    using two different algorithms. We will use repeated division for the whole part
    and repeated multiplication for the fractional part. The advantage is that it
    allows us to use regular decimal arithmetic instead of base R arithmetic.


    # Repeated division


    Before presenting the algorithm, first consider what happens when you divide a
    decimal whole number like 1234 by 10. The division yields two results—a quotient
    of 123 and a remainder of 4.


    In effect, the operation separates the original four-digit number into two parts—it
    "extracts" the least significant digit as the remainder, and leaves the remaining
    digits as the quotient. We can then repeat the process, dividing the quotient
    of 123 by 10 to extract the next least significant digit, and so on until the
