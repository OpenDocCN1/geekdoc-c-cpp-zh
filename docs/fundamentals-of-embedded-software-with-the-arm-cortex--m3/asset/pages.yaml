    | :--- | :--- | :--- | :--- |

    | LSL \( R_d, R_n, <\text{shift}> \) | \( R_d \leftarrow R_n << <\text{shift}>\)
    | NZC | |

    | LSR \( R_d, R_n, <\text{shift}> \) | \( R_d \leftarrow R_n >> <\text{shift}>\)
    | NZC | Zero fills |

    | ASR \( R_d, R_n, <\text{shift}> \) | \( R_d \leftarrow R_n >> <\text{shift}>\)
    | NZC | Sign extends |

    | ROR \( R_d, R_n, <\text{shift}> \) | \( R_d \leftarrow R_n >> <\text{shift}>\)
    | NZC | Right rotate |

