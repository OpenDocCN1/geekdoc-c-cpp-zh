- pgno: 46
  md: 'Regardless of how the bits are stored, the value of a floating-point number
    stored in the ANSI/IEEE format can be expressed as


    Value of real number = (-1)sign bit x 2 (biased exponent - bias constant) x actual
    significand


    The advantage of floating-point is that errors can be minimized automatically,
    by normalizing every result. The number of significant digits is fixed, so normalization
    adjusts the exponent to eliminate leading zeroes in the significant digits, thus
    providing the greatest possible precision.


    The disadvantage is an increase in cost and execution time. Floating-point and
    integer representations are implemented using different parts of the processor.
    Thus, processors with floating-point instructions are usually a bit more expensive
    than those that only implement integer arithmetic. Since floating-point and integer
    numbers are processed separately, there is more state information inside the processor;
    having both means that it takes that much longer to switch from one computation
    to another in a multithreaded application.


    # 2.4.2 Fixed-Point Real Numbers


    Many inexpensive microprocessors do not provide instructions for floating-point
    arithmetic at all, or execute such instructions much more slowly than those for
    integer arithmetic. This speed difference and the need to change the floating-point
    processor state information when switching from one thread of execution to another
    are strong motivations to avoid real numbers in most embedded programs. Fortunately,
    some kinds of arithmetic can be easily performed on fixed-point real numbers by
    using integer operations.


    In fixed-point representations, each number consists of two parts: a fixed number
    of bits on the left of the radix point that represent the whole part of the number
    and a fixed number of bits on the right that represent the fractional part of
    the number. The integer representations that we studied earlier are simply a special
    case of fixed-point in which there are no fractional bits; that is, the implied
    binary point is immediately to the right of the least significant bit.


    Addition and subtraction of two fixed-point reals with the same implied position
    of the binary point can be implemented using instructions for regular integer
    addition and subtraction. Addition and subtraction of two fixed-point reals with
    different binary point positions, and multiplication and division are a bit more
    complicated, but very manageable as we shall see in the next chapter.


    # 2.5 ASCII REPRESENTATION OF TEXT


    One byte of memory can be used to hold any of 256 different 8-bit patterns of
    1''s and 0''s. Besides representing small numbers, these patterns can also be
    used as codes. For example, we can store text in a computer by simply assigning
    a unique code to each of the letters (both lowercase and uppercase) of the alphabet,
    to each of the decimal digits, and to each of the various punctuation characters.


    A standard code used for this purpose is the American Standard Code for Information
    Interchange (ASCII) shown in Table 2-2. The first 32 codes (and the last code)
    in the table are used for text formatting and control information.'
