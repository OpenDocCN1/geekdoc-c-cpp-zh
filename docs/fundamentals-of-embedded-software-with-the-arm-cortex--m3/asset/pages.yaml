- pgno: 247
  md: '# 13.4 SYSTEM TIMER


    Almost any embedded application will require some sort of system timer. Timers
    are used to measure elapsed time, to keep track of the actual time of day and
    date, to schedule threads, and for other purposes. Timers are so common in embedded
    applications that almost every MCU includes the timer hardware on the same chip.


    The Cortex-M3 includes a “SysTick” timer. It is a counter that can be programmed
    to an initial value called the “reload value.” The counter counts down by one
    on each cycle of the CPU clock. When it reaches zero, it triggers a SysTick interrupt
    and automatically reloads the counter to start the next countdown sequence. Multithreaded
    systems use the SysTick counter to provide a periodic interrupt and program the
    counter’s reload value to create interrupts at a rate that is typically 1,000
    interrupts/sec.


    Since the CPU clock can be programmed to operate at different rates, the reload
    value is a function of the CPU clock rate:


    ```

    #define TICK_RATE_HZ 1000 // 1000 interrupts/sec (1 kHz)

    #define CPU_CLOCK_HZ 60000000 // default core clock is 6 MHz

    #define SYST_RVR 0xE000E010 // Addrs of SysTick Reload Value Register

    *((uint32_t *) SYST_RVR) = ( CPU_CLOCK_HZ / TICK_RATE_HZ ) - 1 ;

    ```


    Once the reload value has been set, the next step is to configure the SysTick
    Control and Status Register to tell the counter which clock source to use, to
    enable SysTick interrupts, and to turn on the counter.


    ```

    #define SYST_CSR 0xE000E010 // Addrs of SysTick Control & Status Registers

    #define SYSTICK_CLK 0x00000004 // Use core clock to drive SysTick counter

    #define SYSTICK_INT 0x00000002 // Enable SysTick interrupt generation

    #define SYSTICK_ENABLE 0x00000001 // Enables the SysTick counter

    *((uint32_t *) SYST_CSR) = SYSTICK_CLK | SYSTICK_INT | SYSTICK_ENABLE ;

    ```


    We also need to configure the relevant register in the nested vector interrupt
    controller (NVIC) to set the interrupt priority level of the SysTick interrupt:


    ```

    #define NVIC_SHPR 0xE000ED18 // Addrs of System Handler Priority Registers

    #define SYSTICK_EXC_NMBR 15 // Exception number of SysTick interrupt

    #define SYSTICK_PRIORITY 250 // Typically a low priority (high number)

    ((uint8_t *) NVIC_SHPR)[SYSTICK_EXC_NMBR - 4] = SYSTICK_PRIORITY ;

    ```


    The handler for SysTick interrupts typically increments a variable that keeps
    track of the number of SysTick interrupts that have occurred. If they are programmed
    to occur 1,000 times/sec, then the counter will record the number of milliseconds
    (0.001 sec) that have elapsed.


    # 13.5 OTHER PERIPHERAL DEVICES


    Interrupt handlers for Cortex-M3 may be written as normal C functions. Besides
    the SysTick handler, you may need to write a handler for a device that inputs
    or outputs data. For an input device, the handler normally reads the data from
    the device and'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'enters it into an associated queue. An interrupt from an output device signals
    the completion of the previous output command, thus its handler would normally
    check an output queue to see if there is more data to be sent to the device. If
    more output data is available, it would be removed from the queue and sent.


    Installing a handler is simply a matter of storing its entry point address at
    the appropriate position in the vector table. Some of the vector table entry positions
    are predefined by the Cortex-M3 architecture, while others depend on what peripheral
    devices are available in a specific implementation and would have to be found
    in documentation for the MCU.


    There are several good source code examples available that show how to initialize
    a particular peripheral device, and how to implement an interrupt handler for
    it. These examples are found in the laboratory assignments on the Companion Website
