    # 6.8 DATA-PROCESSING INSTRUCTIONS


    The Thumb-2 data-processing instructions of the Cortex-M3 processor perform arithmetic,
    shifting, and bit manipulation. They share a number of common features, including
    what they can use as operands and whether or not they affect the flags in the
    APSR. Almost all of these instructions compute a result from two source operands.
    The result and one of the operands are held in registers, while the second operand
    may be a constant (e.g., "ADD R0,R1,#2"), a register (e.g., "ADD R0,R1,R2"), or
    a register that has been shifted in some way by the barrel shifter (e.g., "ADD
    R0,R1,R2,ASR #31"). There are five different ways that the second source operand
    may be shifted. (Table 6-6). In the following tables, this operand is simply represented
    by "<op>".


    | Shift Option | Meaning | Notes |

    |---|---|---|

    | LSL #n | Logical shift left by n bits | Zero fills; 0 ≤ n ≤ 31 |

    | LSR #n | Logical shift right by n bits | Zero fills; 1 ≤ n ≤ 32 |

    | ASR #n | Arithmetic shift right by n bits | Sign extends; 1 ≤ n ≤ 32 |

    | ROR #n | Rotate right by n bits | 1 ≤ n ≤ 32 |

    | RRX | Rotate right with carry (n + 1 bits) | Only shifts by 1 bit |


    # 6.8.1 Updating the Flags in the APSR


    The APSR is used to record the characteristics of a computed value and may be
    tested later to make branch decisions. Since the LDR, STR, PUSH, and POP instructions
    simply move data from one place to another, they never modify any of the flags.
    Many of the other instructions can modify the flags, provided that the letter
    "S" is appended to the end of the instruction mnemonic.


    For example, an "ADD R0,R0,#1" instruction will increment the content of register
    R0 but has no effect on the flags. However, changing the ADD to an ADDS will record
    information in the flags as to whether or not the result was negative (N = 1),
    zero (Z = 1), or resulted a carry out (C = 1) or a 2''s-complement overflow (V
    = 1).


    Although it does not perform any arithmetic computation, the MOVS version of the
    MOV instruction can be used to capture the characteristics of a value copied into
    a register. For example, the "MOV R1,R0" instruction will move (copy) the content
    of R0 into R1, but will not modify any flags. However, changing the MOV to an
    MOVS will also update the N and Z flags to indicate whether the value was negative
    (N = 1) or zero (Z = 1). In the following tables, the column labeled "[S]" indicates
    whether or not you may append an "S" and what flags are updated if you do.'
