  md: '![](img/f0b8aa873b11dc585ed698a10d04e7a7_112_0.png)


    FIGURE 5-15 The Cortex-M3 bus structure.


    instructions. For example, an LDR that reads from an address in the bit-band alias
    region will load a register with either the value 0 or the value 1. In a similar
    manner, a store register to memory (STR) instruction that writes to an address
    in the bit-band alias region modifies only a single bit of data in the primary
    region. Of course the modification requires that the bit-band hardware perform
    a read-modify-write, but only a single instruction (the STR) is fetched and executed.


    As shown in Figure 5-16, the first megabyte of the address space for read/write
    data and the first megabyte of the address space for peripheral devices are designated
    as bit-band regions. Each of these primary regions has a corresponding 32-MB bit-band
    alias, and each bit of data in the primary region has a corresponding word address
    in the alias region. Thus, for every byte in the primary region, there are eight
    words in the alias region.


    The two bit-band aliases regions provide an efficient way to access individual
    status and control bits of I/O devices or to implement a set of 1-bit Boolean
    flags. Moreover, since the bit-band hardware does not allow its read-modify-write
    operation to be interrupted by other bus activity, these 1-bit Boolean flags are
    an efficient way to implement a set of mutex objects (discussed in Chapter 9)
    used to arbitrate access to shared resources.


    Each mod-4 word address in the bit-band alias corresponds to a single bit in the
    corresponding bit-band region. To access a particular bit in the bit-band region,
    its corresponding bit-band alias address is calculated as:


    ```

    bit-band alias address = bit-band base + 128 x word offset + 4 x bit number

    ```'
