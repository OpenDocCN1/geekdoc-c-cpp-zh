- pgno: 13
  md: '# Preface


    How many computers are in your home? Most people might answer two or three. How
    many *microprocessors* are in your home? Think carefully before you answer. Hint:
    It is a lot more than two or three! In fact, it is actually even a lot more than
    10 or 20! Today microprocessors are embedded in almost every electronic appliance
    you can think of and many that you probably would not. They have become pervasive—not
    only in our home, but in our workplace, our automobiles, airplanes, stoplights,
    supermarkets, cell phones, and so forth—in short, at almost every aspect of our
    lives.


    Embedded systems offer students an exciting opportunity to express their creativity.
    What students have not dreamed of designing the next new gadget that would capture
    the imagination of the public? Our challenge as educators is to capitalize on
    that excitement and channel the energy of those young minds to motivate mastery
    of a subject matter!


    # What Is New in This Edition


    Virtually a completely rewritten edition, featuring the following significant
    changes:


    +   1. Covers the architecture and instruction set of the ARM Cortex-M3 v7 processor,
    replacing the earlier coverage of the Intel IA32 processor. The 32-bit ARM processor
    was selected because (1) 75% of the embedded systems designed between 2004 and
    2010 used 32-bit processors; (2) the use of ARM processors is growing rapidly,
    from 19% of all embedded applications in 2007 to more than 35% in 2010; and (3)
    the ARM® Cortex™-M3™ is specifically designed for real-time embedded applications.


    +   2. Covers features that make the ARM Cortex-M3 processor well suited for embedded
    applications, including conditional execution that avoids flushing the instruction
    pipeline and interrupt “tail chaining,” “late arrival processing” of interrupts,
    and “bit-banding” for addressing individual bits in memory and I/O registers.


    +   3. Covers the ARM Procedure Call Standard and the appropriate choice of registers
    for function parameters, return values, and temporary variables.


    +   4. Adds a new chapter on “Implementing Arithmetic,” and reorganizes and expands
    the coverage of assembly language programming and I/O from three to four chapters.


    ¹Source: Jerry Krasner, Ph.D., Dolores A. Krasner, “Embedded Market Forecasters:
    2010 Embedded Hardware/Software Design Preferences.”


    ²Source: VDC Research Group, “Embedded Software & Tools 2010 Market Intelligence
    Service, Track 2: Embedded System Engineering Survey Data, Volume 1: Operating
    Systems.”'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   5. Expanded coverage of binary addition and subtraction, and new material
    on using shifts, adds, and subtracts as alternatives to multiplication by a constant,
    reciprocal multiplication as alternative to division by a constant, and a fully
    worked example about multiplication of fixed-point real numbers.


    +   6. Updated to reflect C99 standards for the C programming language.


    +   7. Vastly expanded set of problems at the end of Chapters 1 to 12, including
    answers to selected problems.


    +   8. The Companion Website includes 14 new laboratory programming assignments
    based on Texas Instruments'' EKI-LM3S811 evaluation kit that includes the LM3S811
    evaluation board, the source code of TI''s Stellaris Peripheral Driver Library,
    and the Kickstart edition of IAR Systems'' Embedded Workbench Integrated Development
    Environment. The LM3S811 evaluation board provides programmable timers, a thumbwheel-driven
    potentiometer, A/D converters, a graphic display, user and reset push-buttons,
    a user LED, parallel ports, serial UARTs, a USB port, and a JTAG connector.


    +   9. Uses the open source Free RTOS real-time kernel to develop multithreaded
    laboratory assignments that investigate scheduling, processor utilization, thread
    starvation, unbounded priority inversion, deadlock, mutexes, semaphores, and queues.


    +   10. Complete plans are provided on the Companion Website for an easy to assemble
    and inexpensive breadboard that is used in the last four laboratory assignments
    to develop multithreaded applications for feedback control of a small DC motor.


    # Objectives


    The ultimate goal of this text is to lay a foundation that supports the multithreaded
    style of programming and high-reliability requirements of embedded software. Within
    this context, the following objectives were established:


    +   1. To understand how data is represented at the machine level and to appreciate
    the consequences and limitations of those representations.


    +   2. To master those language-specific features that are used most frequently
    in embedded systems, such as bit manipulation and variant access.


    +   3. To obtain a programmer''s view of processor architecture and how programming
    at the level of assembly is sometimes necessary or appropriate.


    +   4. To learn about the various styles of I/O programming, and ultimately how
    an event-driven approach allows one to separate data processing into a number
    of independent threads of computation.


    +   5. To learn about preemptive and non-preemptive multithreaded programming,
    shared resources, and critical sections, and how scheduling can be used to manage
    system response time.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   6. To reinforce basic programming skills by revisiting such topics as scope,
    parameter passing, recursion, and memory allocation.


    +   7. To learn about the problems associated with shared memory objects, how
    shared memory is affected by memory allocation, and what programming practices
    can be used to minimize the occurrence of shared memory.


    # Intended Audience


    This text is intended to serve as the basis for a sophomore level course in a
    computer science, computer engineering, or electrical engineering curriculum.
    Such a course is envisioned as a replacement for the traditional course on computer
    organization and assembly language programming.


    The text presents assembly the way it is most commonly used in practice—to implement
    small, fast, or special-purpose routines called from a main program written in
    a high-level language such as C. It thus covers processor organization and assembly
    language only from a “need-to-know” point of view rather than as a primary objective.
    This approach affords time within both the text and the course to cover assembly
    in the context of embedded software. As a result, students not only learn that
    assembly still has an important role to play, but their discovery of multithreaded
    programming, preemptive and non-preemptive systems, shared resources, and scheduling
    helps sustain their interest, feeds their curiosity, and strengthens their preparation
    for subsequent courses on operating systems, real-time systems, networking, and
    microprocessor-based design.


    At most institutions, the introductory programming sequence (CS1 and CS2) is no
    longer taught in a procedural programming language such as C or Pascal; rather,
    the popular approach is to now use an object-oriented programming language such
    as C++ or Java. Despite the change, it is not uncommon to find one or more upper-division
    courses still using a procedural language, nor is it uncommon to find such languages
    still in use in industry. At the author’s institution, we solved this paradox
    by redesigning our traditional assembly language course around the material in
    this text; it not only created room in an already packed curriculum to cover the
    procedural approach and to introduce the popular topic of embedded systems, but
    also offered an opportunity to strengthen student comprehension of parameter passing,
    scope, and memory allocation schemes that they were first introduced to in CS1
    and CS2.


    The text assumes that students already know how to program in C, C++, or Java,
    and the similarity among the low-level syntax of those languages makes it relatively
    easy to move to C from either C++ or Java. Rather than covering C in excruciating
    detail, the text emphasizes those features of C that are employed more frequently
    in embedded applications and introduces the procedural style through examples
    and programming assignments that include large amounts of prewritten source code.
    In principle, the only absolute prerequisite is thus a CS1 course that uses C,
    C++, or Java. However, additional programming maturity such as acquired from a
    CS2 course on data structures is strongly recommended.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Programming Assignments and the Companion Website


    The text is complemented by a collection of programming assignments described
    on the Companion Website at www.pearsonhighered.com/lewis. Given that the text
    is aimed at sophomores, the assignments are intended primarily to illustrate a
    topic from the text rather than as extended programming projects. As such, most
    of the source code for each assignment is provided and students are asked to focus
    only on those parts that relate directly to the topic. Some assignments address
    related topics not covered in the text, such as A/D conversion, feedback control,
    and processor utilization. The assignments are intended to be completed in order,
    and some do depend on work completed in earlier assignments. Assignments 6 to
    10 are complete programs that are first run without modification to illustrate
    an issue, and then modified to explore specific solutions. Programming assignments
    11 to 14 require use of the special motor breadboard described on the website.


    | Programming Assignment | Relevant Chapters | Comments |

    | :--- | :--- | :--- |

    | 01 Integer Arithmetic | 2, 3 | No special hardware required |

    | 02 Introduction to Tools | | Implements the game of Tetris |

    | 03 Time Measurement | | Elapsed time, programmed delays, and PWM |

    | 04 Analog Devices | | Explores A/D, PWM, and Interrupts (in C) |

    | 05 Fixed-Point Reals | 3, 5, 6, 7 | Coding in assembly |

    | 06 Processor Utilization | | |

    | 07 Starvation | 10 | These assignments are complete programs that demonstrate
    topics that arise in multithreaded applications. Students modify the programs
    to study or correct performance issues |

    | 08 Mutexes, Semaphores, and Queues | 9, 10 | |

    | 09 Priority Inversion | 10 | |

    | 10 Deadlock | 10 | |

    | 11 Motor Speed Control—Part 1 | | Requires special motor breadboard |

    | 12 Motor Speed Control—Part 2 | 9, 10 | Adds simple multitasking |

    | 13 Motor Speed Control—Part 3 | 9, 10 | Adds mutexes, semaphores, and queues
    |

    | 14 Motor Speed Control—Part 4 | | Adds processor utilization monitoring |


    # Choice of Platform


    The processor architecture covered in Chapters 5 to 6 is the 32-bit ARM Cortex-M3.
    The Stellaris® LM3S811 Evaluation Board that uses this processor and incorporates
    a number of useful I/O devices is available separately from Texas Instruments
    as part of the EKI-LM3S811 evaluation kit complete with an integrated software
    development environment and driver library.


    ![](img/f0b8aa873b11dc585ed698a10d04e7a7_16_0.png)


    The EKI-LM3S811 evaluation kit. (Courtesy of Luminary Micro, Inc.)'
  merge: -1
