    # 11.4.1 Storage Class “Register”


    The keyword register is an explicit alternative to the explicit or implicit use
    of keyword auto. The only difference is that the compiler attempts to allocate
    one of the registers of the CPU rather than a region of memory and thus provides
    faster access to the object. In effect, the keyword allows a programmer to tell
    the compiler something about how to optimize the code. Register allocation may
    sound tempting to a real-time programmer who needs maximum performance, but compiler
    technology has improved tremendously since C was first introduced, and the need
    for programmer-assisted optimization is no longer as important.


    Knowing when to register-allocate an object is deceptively nonobvious. Register
    allocation is local within each function. When one function calls another, there
    is no way to know what the second function may do to the registers, and so all
    register variables must be preserved in (and later restored from) memory during
    the call. The resulting overhead often offsets any performance gain. Worse yet,
    it is not always obvious when such function calls occur. Some deceptively simple
    C operators are actually implemented by library routines that are called to evaluate
    expressions in which no function call appears.


    Use of the keyword register does not guarantee that a register will be allocated.
    The C language allows compilers to simply ignore the keyword and use automatic
    memory allocation instead. Of course requests to register-allocate (large) aggregate
    objects will fail because their size is normally larger than the number of bits
    in a register. More significant is the fact that most CPUs have a very limited
    number of registers available for allocation (perhaps two or three); once they
    have been allocated, additional requests must be converted to automatic allocation.'
