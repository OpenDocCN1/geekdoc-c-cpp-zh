  md: "# 12.5.3 Type Qualifier “volatile”\n\nThe keyword volatile may be attached\
    \ as a qualifier on the declaration of any object in C to indicate that its value\
    \ may be asynchronously modified by mechanisms other than the code in which the\
    \ declaration appears, such as a change in the status port of a memory-mapped\
    \ I/O device, or modification of data in memory by direct memory access or an\
    \ interrupt routine. However, adding the qualifier to their declaration does not\
    \ eliminate the problems of critical sections discussed earlier.\n\nThe keyword\
    \ is useful because it disables certain compiler optimizations that would otherwise\
    \ cause the code to fail. For example, the code in Figure 12-11 is intended to\
    \ access a 64-bit shared variable without disabling interrupts, disabling task\
    \ switching, or using a mutex. This strategy can actually work in certain situations,\
    \ such as accessing a shared count value that is updated infrequently relative\
    \ to the speed of the loop.\n\n```\nunit64_t get_Shared(void)\n{\n    extern unit64_t\
    \ shared ;\n    unit64_t validated ;\n    do  validated = shared ;        /* 1st\
    \ access */\n        while (validated != shared );   /* 2nd access */\n    return\
    \ validated ;\n}\n```\n\nFIGURE 12-11 Code to illustrate need for using the volatile\
    \ qualifier.\n\nHowever, instead of reading the shared variable out of memory\
    \ twice as intended, an optimizing compiler is likely to notice that the function\
    \ never modifies shared, that validated is simply a copy of shared, and thus eliminate\
    \ the loop altogether, as shown in the middle column of Figure 12-12. As shown\
    \ in the right-hand column, adding the keyword volatile to the declaration of\
    \ the shared variable corrects these problems by preventing these optimizations\
    \ from being applied.\n\nAs a precaution, every declaration of a shared memory\
    \ object should use the volatile qualifier. It also suggests defining a macro:\n\
    \n```\n#define SHARED_MEMORY volatile\n```\n\nthat helps to document shared objects\
    \ in a more obvious manner:\n\n```\nextern SHARED_MEMORY long shared;\n```\n\n\
    1In a preemptive kernel, interrupts can trigger a task switch to another thread,\
    \ which may modify shared memory."
