    Code :


    #include <stdio.h>


    void  swap( int, int );


    int  main()


    {


           int a = 10, b = 20;


           system( "cls" );


           printf( "Before Swapping (in main) : a = %d, b = %d\n", a, b );


           swap( a, b );


           printf( "After Swapping (in main)  : a = %d, b = %d\n", a, b );


           system( "pause" );


           return 0;


    }


    void  swap( int x, int y )


    {


           int t;


           printf( "Before Swapping (in swap) : x = %d, y = %d\n", x, y );


           t = x;


           x = y;


           y = t;


           printf( "After Swapping (in swap)  : x = %d, y = %d\n", x, y );


