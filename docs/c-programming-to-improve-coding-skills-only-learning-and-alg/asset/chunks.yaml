    Program No. - 416 :


    Write a program to SORT a given element of an array in Ascending order using Bubble
    Sort?


    Code :


    #include <stdio.h>


    int  main()


    {


           int a[5] = { 30, 50, 40, 20, 10 };


           int i, j, t;


           int *p;


           system( "cls" );


           p = a;​​/* p = &p[0];   */


           printf( "Before Sorting :" );


           for( i=0 ; i<5 ; i++ )


           {


                  printf( "  %d", *( p + i ) );


           }


           for( i=0 ; i<5−1 ; i++ )


           {


                  for( j=0 ; j<5−1−i ; j++ )


                  {


                         if( *( p + j ) > *( p + j + 1 ) )


                         {


                                t = *( p + j );


                                *( p + j ) = *( p + j + 1 );


                                *( p + j + 1 ) = t;


                         }


                  }


           }


           printf( "\n\nAfter Sorting  :" );


           for( i=0 ; i<5 ; i++ )


           {


                  printf( "  %d", *( p + i ) );


           }


           printf( "\n" );


           system( "pause" );


           return 0;


    }


