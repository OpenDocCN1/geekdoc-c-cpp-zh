    \ etc. When he’s not writing or programming, he enjoys reading books, touring\
    \ by car and spending time with his family.\n\n## Table of Contents\n- Chapter-1\
    \ : C Introduction\n- Chapter-2 : Variables, Constants & Data Types\n- Chapter-3\
    \ : Operators & Expressions\n- Chapter-4 : Selection\n- Chapter-5 : Iteration\
