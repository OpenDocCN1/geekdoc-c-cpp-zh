    Program to use malloc( ) function.


    Code :


    #include <stdio.h>


    #include <malloc.h>


    int  main()


    {


           int *p;


           int i, n, s;


           system( "cls" );


           printf( "Enter Number of Terms : " );


           scanf( "%d", &n );


           p = (int *) malloc( n * sizeof( int ) );


           if( !p )


                  printf( "\nUnable to allocate size. \n" );


           else


           {


                  for( i=0 ; i<n ; i++ )


                  {


                         printf( "Enter Value : " );


                         scanf( "%d", ( p + i ) );


                  }


                  printf( "\nValues are : " );


                  s = 0;


                  for( i=0 ; i<n ; i++ )


                  {


                         printf( "  %d", *( p + i ) );


                         s = s + *( p + i );


                  }


                  printf( "\nSum of elements = %d\n", s );


           }


           free( p );


           system( "pause" );


           return 0;


    }


