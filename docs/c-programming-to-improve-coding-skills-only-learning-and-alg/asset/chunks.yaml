    第 1 版（2024 年 1 月）\n作者：Atul Soni\n\n版权所有 © 2024 Atul Soni\n保留所有权利。未经版权所有者事先书面许可，严禁以任何形式或通过任何手段（电子或机械，包括复印、录制或任何信息存储或检索系统）复制或传输本作品的任何部分。\n\
    \n封面设计：Atul Soni\n电子邮箱：atul.soni09@gmail.com\n献给我出色的家人。感谢你们所有的爱与支持。\n- Atul Soni\n\
    \n## 导言\n本书涵盖了程序员提升技能时所需的所有概念：\n\n- 包含 500 个带源码的学习与算法类程序。\n- 仅包含程序源代码和输出快照（不包含任何理论，理论部分有许多书籍可供）。\n\
    - 我们使用 `MinGW` 编译器进行 C 语言编程。\n- 我们使用文本编辑器 `VS Code`，它在初学者和专业程序员中都很流行，且在所有操作系统上都能良好运行。\n\
    - 每个章节都包含了精心规划和组织的程序集。\n- 本本书对 C 语言的初学者、教师和培训师也非常有帮助。\n- 为了在 kindle、ipad、平板和手机等数字媒体上获得更好的阅读体验，我们使用了较短的变量或标识符名称。\n\
    - 本书采用了更简单的编码方法。\n- 采用了一种更简单的方法来组织初学者及专业人士的程序。\n- 本书中每个程序都从新页面开始，以提高可读性和理解性。\n\
    \n## 关于作者\n![IMG_20240110_124143-removebg-preview (6).png](img/image_rsrc483G.jpg)\n\
    \nAtul Soni\n是一位工程师，主要兴趣和领域是编程语言、算法、数据结构、数据分析、Web 技术和安卓移动应用开发。他编写了许多编程教程。他在向工程师和软件开发者教授编程语言方面经验丰富。\n\
    \n他是一位程序员、作家和安卓应用开发者。他开发了许多不同编程语言的教程应用，如 `C`、`C++`、`Java`、`Python`、`Android`、`VB.Net`、`C#`、`PHP`、`HTML5`、`CSS3`、`SQL\
    \ & & PL/SQL`、`JavaScript`、`jQuery` 等。当他不写作或编程时，他喜欢看书籍、开车自游和与家人共度。\n\n## 目录\n\
    - 第 1 章：C 语言简介\n- 第 2 章：变量、常量与数据类型\n- 第 3 章：运算符与表达式\n- 第 4 章：选择结构\n- 第 5 章：迭代\
    \ / 循环\n- 第 6 章：级数\n- 第 7 章：模式\n- 第 8 章：数组\n- 第 9 章：字符串\n- 第 10 章：函数\n- 第 11 章：结构、联合体与枚举\n\
    - 第 12 章：指针\n- 第 13 章：动态内存分配\n- 第 14 章：预处理器\n- 第 15 章：输入/输出格式化\n- 第 16 章：文件处理\n\
    \n# 第 1 章\n## C - 简介\n\n![](img/image_rsrc483H.jpg)\n\n### 程序编号 - 1：\n使用 `printf()`\
    \ 函数在 C 中显示字符串字面量的程序。\n\n代码：\n```c\n#include <stdio.h>\n\nint main()\n{\n    printf(\
    \ \" Let's learn C Programming Language.\" );\n    return 0;\n}\n```\n输出：\n![](img/image_rsrc483J.jpg)!(image_rsrc483K.jpg)\n\
    \n### 程序编号 - 2：\n使用 `system(\"cls\")` 清空 `VSCode` 终端中的输出屏幕，并使用 `system(\"pause\"\
    )` 暂停 `VSCode` 的输出屏幕（在 Visual Studio Code 中隐式显示“按任意键继续 . . .”）。\n\n代码：\n```c\n\
    #include <stdio.h>\n\nint main()\n{\n    system( \"cls\" );\n    printf( \"Let's\
    \ learn C Programming Language.\\n\" );\n    system( \"pause\" );\n    return\
    \ 0;\n}\n```\n输出：\n![](img/image_rsrc483M.jpg)\n\n### 程序编号 - 3：\n在 C 语言编程中定义注释的程序。\n\
    \n代码：\n```c\n/* Linking section. */\n#include <stdio.h>\n/* program starts from\
    \ main function. */\nint main()\n{\n    system( \"cls\" );/* to clear output screen.\
    \ */\n    printf( \"Let's learn C Programming.\\n\" ); /* Output. */\n    system(\"\
    pause\");/* to hold output screen. */\n    return 0;\n} /* end of main */\n```\n\
    输出：\n![](img/image_rsrc483N.jpg)\n\n### 程序编号 - 4：\n解释 C 语言是自由格式语言（Free-form Language）的程序。\n\
    \n代码：\n```c\n#include <stdio.h>\nint main() { system( \"cls\" ); printf(\"Let's\
    \ learn Programming.\\n\" );system( \"pause\" ); return 0; }\n```\n输出：\n![](img/image_rsrc483P.jpg)\n\
    \n### 程序编号 - 5：\n使用多个 `printf()` 语句显示单行的程序。\n\n代码：\n```c\n#include <stdio.h>\n\
    int main()\n{\n    system( \"cls\" );\n    printf( \"Let's learn \" );\n    printf(\
