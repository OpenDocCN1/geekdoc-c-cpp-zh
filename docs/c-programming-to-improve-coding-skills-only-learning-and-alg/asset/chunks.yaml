    \ \"String : \");\n    ch = getc( fp ); /* fgetc( fp ); */\n    while( ch != EOF\
    \ )\n    {\n        printf( \"%c\", ch );\n        ch = getc( fp ); /* fgetc(\
    \ fp ); */\n    }\n    fclose( fp );\n    system( \"pause\" );\n    return 0;\n\
    }\n```\nOutput :\n![](image_rsrc48M9.jpg)\n\n## Program No. - 478\nProgram to\
