    Code :


    #include <stdio.h>


    #include <conio.h>


    void  bubble_sort( int*, int );


    int  main()


    {


           int a[5] = { 30, 50, 40, 20, 10 };


           int i;


           system( "cls" );


           printf( "Before Sorting : " );


           for( i=0 ; i<5 ; i++ )


           {


                  printf( "  %d", a[ i ] );


           }


           bubble_sort( a, 5 );


           printf( "\nAfter Sorting  : " );


           for( i=0 ; i<5 ; i++ )


           {


                  printf( "  %d", a[ i ] );


           }


           printf( "\n" );


           system( "pause" );


           return 0;


    }


    void  bubble_sort( int *p, int n )


    {


           int i, j, t;


           for( i=0 ; i<n−1 ; i++ )


           {


                  for( j=0 ; j<n−i−1 ; j++ )


                  {


                         if( *(p+j) > *(p+j+1) )    /* if( p[ j ] > p[ j+1] ) */


                         {


                                t = *(p+j);​​   /* t = p[ j ];​*/


                                *(p+j) = *(p+j+1);​/* p[ j ] = p[ j+1]; */


                                *(p+j+1) = t;​ ​  /*  p[ j+1] = t;​*/


                         }


                  }


           }


    }


