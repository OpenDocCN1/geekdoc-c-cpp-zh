           scanf( "%d", &N );


           printf( "Enter Second Array elements [ASCENDING]: " );


           for( i=0 ; i<N ; i++ )


           {


                  scanf( "%d", &B[ i ] );


           }


           MN = M + N;


           Merge( A, M, B, N, C );​


           printf( "\nThe Sorted Array After Merging = \n" );


           for( i=0 ; i<MN ; i++ )


           {


                  printf( "%d  ", C[ i ] );


           }


           printf( "\n" );


           system( "pause" );


           return 0;


    }


    void  Merge( int A[ ], int M, int B[ ], int N, int C[ ] )


    {


           int a, b, c;


           for( a=0, b=0, c=0 ; a<M && b<N ; )


           {


                  if( A[a] < B[b] )


                         C[c++] = A[a++];


                  else


                         C[c++] = B[b++];


           }


           if( a < M )


           {


                  while( a < M )


                         C[c++] = A[a++];


           }


           else


           {


                  while( b < N )


                         C[c++] = B[b++];


           }


    }


