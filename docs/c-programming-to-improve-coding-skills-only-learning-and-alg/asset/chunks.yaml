    - Chapter-14 : Preprocessors\n- Chapter-15 : Input/Output Formatting\n- Chapter-16\
    \ : File Handling\n\n# Chapter-1\n## C - Introduction\n\n![](image_rsrc483H.jpg)\n\
    \n### Program No. - 1 :\nProgram to display a String Literal in C using `printf()`\
    \ function.\n\nCode:\n```c\n#include <stdio.h>\n\nint main()\n{\n    printf( \"\
    \ Let's learn C Programming Language.\" );\n    return 0;\n}\n```\nOutput:\n![](image_rsrc483J.jpg)!(image_rsrc483K.jpg)\n\
    \n### Program No. - 2 :\nProgram to use `system(\"cls\")` to clear output screen\
    \ in Terminal of `VSCode` and use `system(\"pause\")` to pause output screen in\
    \ `VSCode` (It implicitly shows \"Press any key to continue . . .\" in Visual\
    \ Studio Code ).\n\nCode:\n```c\n#include <stdio.h>\n\nint main()\n{\n    system(\
    \ \"cls\" );\n    printf( \"Let's learn C Programming Language.\\n\" );\n    system(\
    \ \"pause\" );\n    return 0;\n}\n```\nOutput:\n![](image_rsrc483M.jpg)\n\n###\
    \ Program No. - 3 :\nProgram to define comments in C programming.\n\nCode:\n```c\n\
    /* Linking section. */\n#include <stdio.h>\n/* program starts from main function.\
    \ */\nint main()\n{\n    system( \"cls\" );/* to clear output screen. */\n   \
    \ printf( \"Let's learn C Programming.\\n\" ); /* Output. */\n    system(\"pause\"\
    );/* to hold output screen. */\n    return 0;\n} /* end of main */\n```\nOutput:\n\
    ![](image_rsrc483N.jpg)\n\n### Program No. - 4 :\nProgram to explain that the\
    \ C is Free-form Language.\n\nCode:\n```c\n#include <stdio.h>\nint main() { system(\
    \ \"cls\" ); printf(\"Let's learn Programming.\\n\" );system( \"pause\" ); return\
    \ 0; }\n```\nOutput:\n![](image_rsrc483P.jpg)\n\n### Program No. - 5 :\nProgram\
    \ to display single line using multiple `printf()` statements.\n\nCode:\n```c\n\
    #include <stdio.h>\nint main()\n{\n    system( \"cls\" );\n    printf( \"Let's\
    \ learn \" );\n    printf( \"C Programming.\\n\" );\n    system( \"pause\" );\n\
    \    return 0;\n}\n```\nOutput:\n![](image_rsrc483R.jpg)\n\n### Program No. -\
    \ 6 :\nProgram to display multiple lines using single `printf()` statement.\n\n\
    Code:\n```c\n#include <stdio.h>\nint main()\n{\n    system( \"cls\" );\n    printf(\
    \ \"Let's \\nlearn \\nC.\\n\" );\n    system( \"pause\" );\n    return 0;\n}\n\
    ```\nOutput:\n![](image_rsrc483S.jpg)\n\n### Program No. - 7 :\nProgram to explain\
    \ that you can skip `return 0;` from `int main()` function in Visual Studio Code.\n\
    \nCode:\n```c\n#include <stdio.h>\nint main()\n{\n    system( \"cls\" );\n   \
    \ printf( \"Let's learn C Programming.\\n\" );\n    system( \"pause\" );\n}\n\
    ```\nOutput:\n![](image_rsrc483T.jpg)\n\n### Program No. - 8 :\nProgram to explain\
    \ variable declaration and assignment.\n\nCode:\n```c\n#include <stdio.h>\nint\
    \ main()\n{\n    int n1, n2, s; /* Variable declaration */\n    system( \"cls\"\
    \ );\n    n1 = 10; /* Variable assignment */\n    n2 = 20;\n    s = n1 + n2;\n\
    \    printf( \"Sum = \" );\n    printf( \"%d\\n\", s );\n    system( \"pause\"\
    \ );\n    return 0;\n}\n```\nOutput:\n![](image_rsrc483U.jpg)\n\n### Program No.\
    \ - 9 :\nProgram to read data from keyboard using `scanf` statement.\n\nCode:\n\
    ```c\n#include <stdio.h>\nint main()\n{\n    int n1, n2, s;\n    system( \"cls\"\
    \ );\n    printf( \"Enter First Number: \" );\n    scanf( \"%d\", &n1 );\n   \
    \ printf( \"Enter Second Number: \" );\n    scanf( \"%d\", &n2 );\n    s = n1\
    \ + n2;\n    printf( \"Sum = \" );\n    printf( \"%d\\n\", s );\n    system( \"\
    pause\" );\n    return 0;\n}\n```\nOutput:\n![](image_rsrc483V.jpg)\n\n### Program\
    \ No. - 10 :\nProgram to explain input and display multiple values in single `printf`\
    \ and `scanf` statement.\n\nCode:\n```c\n#include <stdio.h>\nint main()\n{\n \
    \   int n1, n2, s;\n    system( \"cls\" );\n    printf( \"Enter Numbers: \" );\n\
    \    scanf( \"%d %d\", &n1, &n2 );\n    s = n1 + n2;\n    printf( \"%d + %d =\
    \ %d\\n\", n1, n2, s );\n    system( \"pause\" );\n    return 0;\n}\n```\nOutput:\n\
    ![](image_rsrc483W.jpg)\n\n### Program No. - 11 :\nProgram to calculate Volume\
    \ of Cylinder.\n\nCode:\n```c\n/*\nThis program is used to explain Multiple line\n\
    comment and Single line comment.\n*/\n#include <stdio.h>\nint main()\n{\n    float\
    \ r, h, v; /* Variable Declaration. */\n    system( \"cls\" );\n    printf( \"\
    Enter Radius & Height of Cylinder : \" );\n    scanf( \"%f %f\", &r, &h ); /*\
    \ Reading data from KB. */\n    v = 3.14 * r * r * h ; /* Calculation of volume.\
    \ */\n    printf( \"\\nVolume of Cylinder = %f\\n\", v );\n    system( \"pause\"\
    \ );\n    return 0;\n}\n```\nOutput:\n![](image_rsrc483X.jpg)\n\n### Program No.\
    \ - 12 :\nProgram to find the Area and Circumference of Circle.\n\nCode:\n```c\n\
    #include <stdio.h>\nint main()\n{\n    float radius, area, circum;\n    system(\
    \ \"cls\" );\n    printf( \"Enter Radius : \" );\n    scanf( \"%f\", &radius );\n\
    \    area = 3.14 * radius * radius;\n    circum = 2 * 3.14 * radius;\n}\n```\n"
