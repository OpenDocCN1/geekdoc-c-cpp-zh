    \ main()\n{\n    FILE *fp;\n    char ch;\n    system( \"cls\" );\n    fp = fopen(\
    \ \"demo\", \"w\" );\n    printf( \"Enter String ( ctrl+z to end ) : \");\n  \
    \  ch = getchar();\n    while( ch != EOF )\n    {\n        putc( ch, fp ); /*\
    \ fputc( ch, fp ); */\n        ch = getchar();\n    }\n    fclose( fp );\n   \
    \ system( \"pause\" );\n    return 0;\n}\n```\nOutput :\n![](image_rsrc48M8.jpg)\n\
    \n## Program No. - 477\nProgram to read char from File using `getc()` or `fgetc()`.\n\
    \n### Code :\n```c\n#include <stdio.h>\n\nint main()\n{\n    FILE *fp;\n    char\
