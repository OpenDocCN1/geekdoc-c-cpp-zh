    Program No. - 46 :


    Program to explain all Unary Operators ( +, −, !, ++, −−, ~ ).


    Code :


    #include <stdio.h>


    int  main()


    {


           int a, b;      


           system( "cls" );


           printf( "Unary Operators : \n" );


           a = +10;        ​​// Positive


           b = −10;        ​​// Negative


           printf( "a = %d \nb = %d\n", a, b );


           a = 1;


           b = !a;         ​​// Not


           printf( "\n!a = %d\n", b );


           a = 10;


           b = ++a;        ​​// Increment


           printf( "\n++a = %d\n", b );


           a = 10;


           b = −−a;        ​​// Decrement


           printf( "−−a = %d\n", b );


           a = 10;


           b = ~a;         ​​// Complement


           printf( "\n~a = %d\n", b );


           system( "pause" );


           return 0;


    }


