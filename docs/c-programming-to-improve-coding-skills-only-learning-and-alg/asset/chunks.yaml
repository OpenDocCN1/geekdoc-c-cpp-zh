    \ values in C program.\n\n### Code\n```c\n#include <stdio.h>\n\nint main()\n{\n\
    \    int dec = 12;\n    int oct = 015;\n    int hex = 0x2F;\n    system( \"cls\"\
    \ );\n    printf( \"dec : %d\\n\", dec );\n    printf( \"oct : %o\\n\", oct );\n\
    \    printf( \"dec(oct) : %d\\n\", oct );\n    printf( \"hex : %x\\n\", hex );\n\
    \    printf( \"dec(hex) : %d\\n\", hex );\n    system( \"pause\" );\n    return\
    \ 0;\n}\n```\n### Output\n![](image_rsrc48KF.jpg)\n\n---\n\n# Program No. - 452\n\
