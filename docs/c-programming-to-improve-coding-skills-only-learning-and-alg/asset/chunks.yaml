    \ ? : ).\n\n### Code :\n```c\n#include <stdio.h>\n\nint main()\n{\n    int a,\
    \ b, max;\n    system( \"cls\" );\n    printf( \"Enter Two Numbers : \" );\n \
    \   scanf( \"%d %d\", &a, &b );\n    max = ( (a > b) ? a : b );\n    printf( \"\
    \\nMaximum Value is : %d\\n\", max );\n    system( \"pause\" );\n    return 0;\n\
    }\n```\nOutput :\n![](image_rsrc485W.jpg)\n\n---\n\n# Program No. - 73 :\nProgram\
    \ to find biggest of three numbers using ternary operator / conditional operator\
    \ ( ? : ).\n\n### Code :\n```c\n#include <stdio.h>\n\nint main()\n{\n    int a,\
    \ b, c, max;\n    system( \"cls\" );\n    printf( \"Enter Three Numbers : \" );\n\
    \    scanf( \"%d %d %d\", &a ,&b, &c );\n    max = ( (a>b) ? ((a>c)?a:c) : ((b>c)?b:c)\
    \ );\n    printf( \"\\nMaximum = %d\\n\", max );\n    system( \"pause\" );\n \
