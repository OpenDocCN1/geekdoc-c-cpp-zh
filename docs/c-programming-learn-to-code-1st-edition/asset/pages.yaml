    FIGURE 16.6

    Command line argument process.


    # 16.4 Using Command Line Arguments


    Assume that we were supplying some parameters through the command prompt, as discussed
    in the previous section. To receive these parameters, the main function must have
    some arguments, like other functions. According to the concept of the command
    line argument, the main function can take two arguments: (1) argc and (2) argv.


    *argc*: This counts the total number of parameters passed through the command
    prompt.

    Each parameter is treated as a string.


    *argv*: This is a pointer to an array of strings, and it points to the parameters
    passed in the command prompt.


    Example:

    In the command prompt, let''s say you write:

    Output 45 68 79 ↓

    where, Output is the Output.exe file that helps us in executing the program.

    After receiving this parameter, the value of argc is set to 4, because there are
    four parameters passed in the command prompt, i.e., Output, 45, 68, and 79. All
    these parameters are treated as strings.'
