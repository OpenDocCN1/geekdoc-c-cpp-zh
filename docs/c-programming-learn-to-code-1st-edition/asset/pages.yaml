  md: '# 9.2 The Need for Functions


    There are several uses of a function. We will take an example to show you why
    a function is needed. Suppose you are a carpenter and you build different types
    of wooden furniture. One day you receive an order to cut 10,000 pieces of wood
    in a zigzag manner, as shown in Figure 9.3. Assume that no cutting machine has
    been developed to cut a piece of wood in a zigzag pattern. As the order is significant,
    you must finish it on time, you need a cutter for this work. So, you decide to
    build a cutting machine. Your problem is solved, and you have a machine that can
    be used in the future for the type of work.


    What do we learn from the above example? A machine that performs a specific task.
    It can be reused for the same type of work. It takes a piece of wood as input
    and generates two pieces of wood in a zigzag pattern. Here, the machine is a function
    designed to solve a problem and can be reused any number of times. Similarly,
    during our program development, we can create functions for solving a specific
    task, and then use that function several times throughout our code.


    We have already used several predefined functions like `printf()` and `scanf()`
    for console I/O operations. We use these functions in every program. In fact,
    whatever program we have written now contains at least one function, i.e., the
    `main()` function. That means some functions were there already as predefined
    functions; some functions we wrote for our purposes are user-defined functions.


    Let us think in another way. Suppose you have a large task to do. The usual procedure
    is to divide the task into smaller tasks, solve each one separately, and combine
    them to solve the bigger problem. This process is modular programming, and programming
    employs the concept of functions. After we divide the whole task into subproblems,
    each subproblem can be implemented with a function. Combining the result of all
    functions, we can solve a bigger problem. Consider the problem of designing a
    calculator. A calculator performs many tasks like addition, subtraction, multiplication,
    and square roots. We can write code for each task using a separate function and
    call them with the `main()` function to solve a bigger task. Figure 9.4 shows
    the modular division of tasks for


    The advantage of using functions is:


    +   - Modular programming;

    - Reduction in the amount of work and development time;

    - Program and debugging becomes easier;


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_205_0.png)


    FIGURE 9.3

    Woodcutting in a zigzag pattern.'
