    He is known as the father of the digital programmable computer.


    The work of Babbage describing a “difference engine” was used by many researchers
    as inspiration for further development [2], leading to several working models
    but with the disadvantage that the programs were hardwired and challenging to
    change. A final major contribution was made during the 1940s by John von Neumann
    (see Figure 1.2b), known as the “stored program.” With a stored program, we can
    control a computer''s activity, and this program is usually stored inside the
    computer''s memory [2]. In today''s modern world, digital computers are all built
    on this stored-program concept. A brief contribution was made to computer development
    in chronologic is 3:


    +   * The German philosopher and mathematician, Gottfried Leibniz (1646–1716),
    the first calculator to perform multiplication and division. It was not reliable
    due to the inaccuracy of its parts.

    * Charles Babbage (1792–1872) Figure 1.1a) was a British inventor who designed
    the difference engine in 1822 and, came up with an “analytical engine” incorporating
    the ideas of a memory and card input /output for data and instructions. But he
    was not able to build the system. Babbage is mostly remembered for and considered
    the father of digital computers.

    * Howard Aiken (1900-73), a Harvard professor with IBM’s backing, built the Harvard
    Mark I computer (51 ft long) in 1944. It required three seconds to perform multiplication.

    * John Vincent Atanasoff built a specialized computer in 1941 and was visited
    by William Mauchly before constructing the Electronic Numerical Integrator and
    Calculator (ENIAC).'
