    ```

    1. #include<stdio.h>

    2. int x=5;

    3. void change ()

    4. {

    5.     x=x+7;

    6.     printf("%d ",x);

    7. }

    8. void main ()

    9. {

    10.    change();

    11.    printf("%d ",x);

    12. }

    ```


    Output

    5 12


    Output

    12 12


    In the first program, the main() function contains two statements. At first printf()
    function executes and searches for the value of x to print. As the main() function
    does not have a local x, so it accesses the global x for printing and 5. After
    executing the first statement executes the change() function. The change() function
    also has no local x, so it accesses the global x value and increments it by 7.
    After incrementing the global x, its value is 12. So, the output is 12.


    The second program also contains two statement inside the main() function, but
    the output differs. Because the change() function calls first, the value of global
    x is changed to 12. So, the output will be 12. After executing the change() function,
    control returns to the main() function and executes the printf() statement. As
    the value of x has already been modified by the change() function, so the output
    of this statement becomes 12.


