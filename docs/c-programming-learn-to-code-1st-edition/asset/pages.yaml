  md: '# Arrays and Strings


    # 10.8.1 strcpy (Destination, Source)


    You can''t use string1=string2 in C. You have to use the strcpy() function to
    copy one string to another.


    Example:


    ```

    S1 = "abc";

    S2 = "xyz";

    strcpy(S1, S2); /*S1="xyz"*/

    ```


    # 10.8.2 strcat (Destination, Source)


    This joins the destination and source strings and puts the joined string into
    the destination string.


    Example:


    ```

    S1 = "abc";

    S2 = "xyz";

    strcat(S1, S2); /*S1="abcxyz"*/

    ```


    # 10.8.3 strmp (First, Second)


    Compare the first and second strings:


    +   * If the first string is greater than the second string, then a number greater
    than 0 is returned;

    * If the first string is less than the second, then a number less than 0 is returned;

    * If the strings are equal, then 0 is returned.


    Beside the above functions many other functions are also defined <string.h> that
    are shown in Table 10.1.


    # TABLE 10.1

    List of String Functions


    | Sl. No. | Functions | Descriptions |

    | --- | --- | --- |

    | 1 | strlen(s1) | Returns the length of the string s1 |

    | 2 | strl(s1) | Converts string to lowercase. |

    | 3 | toupr(s1) | Converts the string to uppercase. |

    | 4 | strcat(s1, s2, n) | Appends n characters of s2 to s1 |

    | 5 | strcpy(s1, s2, n) | Copies n characters of s2 to s1 |

    | 6 | strrev(s1) | Converts string to reverse |

    | 7 | strncmp(s1, s2, n) | Compares first n characters of s1 and s2 |'
