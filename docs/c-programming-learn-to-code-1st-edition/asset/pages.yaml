  md: '# Functions


    All the above storage classes are classified and can be differentiated with the
    following features:


    | Features of Classification | Automatic (auto) | Register (register) | Static
    (static) | External (extern) |

    | :--- | :--- | :--- | :--- | :--- |

    | Where is the variable stored? | Memory | CPU Register | Memory | Memory |

    | What is the initial value? | Garbage | Garbage | 0 (Zero) | 0 (Zero) |

    | What is the scope? | Local to the block in which the variable is defined | Local
    to the block which the variable is defined | Local to the block which the variable
    is defined | Global |

    | What is the life time? | Local to the block in which the variable is defined
    | Local to the block which the variable is defined | Value of the variable persists
    between different function calls | As long as the program comes to an end |


    # 9.8.1 Automatic Storage Class


    Program 9.21 shows how an automatic storage class variable is declared, and the
    fact that if the variable is not initialized it contains a garbage value.


    ```

    PROGRAM 9.21

    1. #include<stdio.h>

    2. void main( )

    3. {

    4.   auto int x;

    5.   printf ("\n%d", x) ;

    6. }

    ```


    The output of Program 9.21 could be:

    19152

    19152 is a garbage value of x. When you run this program you may get different
    values, since garbage values are unpredictable. So always make it a point to initialize
    the automatic variables properly, otherwise you are likely to get unexpected results.
    Note that the keyword for this storage class is auto, and not automatic.

    The scope and life of an automatic variable is illustrated in Program 9.22.'
