  md: '# Basic Input/Output


    +   1. The getchar() function takes the form:


    ```

    varName=getchar();

    ```


    VarName is a character variable. When a user types a character in the keyboard,
    then the getchar() function scans that character and assigns it to the VarName.


    +   2. The putchar() function takes the form:


    ```

    putchar(varName);

    ```


    Here Now a character variable that contains a character. The putchar() function
    will send the value of the variable to the output unit for printing on the screen.

    Let us take an example to explain the working of these two functions. Program
    7.1 shows an example that declares a character variable ch, assigns a character
    using the getchar() function, and displays the character using the putchar() function.


    # 7.2.2 gets() and puts()


    These functions help in reading a string from the standard input unit (usually
    a key-board) and writing it to the standard output unit (usually a screen).


    +   1. gets() reads a string from the standard input device. It accepts the name
    of a string as a parameter and fills the string with characters that are input
    from the keyboard.


    # PROGRAM 7.1


    ```

    1. #include <stdio.h>

    2. #include <conio.h>

    3. int main()

    4. {

    5.     char ch;

    6.     printf("Type one Character: ");

    7.     ch=getchar();

    8.     printf("The typed character is: \ ");

    9.     putchar(ch);

    10.    return 0;

    11. }

    ```


    Output:

    Type one Character: p

    The typed character is: p


    Explanation:

    Line 5: Declare ch as a character.

    Line 7: Read the typed character from the keyboard and assign it to ch.

    Line 9: Display the character present in ch on on the screen.'
