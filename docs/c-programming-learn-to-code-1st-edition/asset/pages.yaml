    # 12.2 Declaring a Structure


    A structure can be defined as a collection of one or more variables of the same
    or different data types, grouped together under a single name. Like other data
    types, a structure must be declared before it is used inside a program. C provides
    two different ways to declare a structure: tagged structure and structure declaration
    using typedef.


    > A structure can be defined as a collection of one or more variables of the same
    or different data types, grouped together under a single name.


    # 12.2.1 Tagged Structure Declaration


    To declare a structure using this method, we use the keyword *struct*. In this
    declaration, the struct keyword is followed by a structure name (tag) and the
    general syntax for declaring the structure is shown in Figure 12.4.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_331_0.png)


    FIGURE 12.4

    Structure declaration syntax.'
