    the run button to run your code. After you run your code, a separate output window
    (shown in Figure 16.2) will appear where you can provide the input (if your program
    demands it) and view the output.


    Three files get created during the entire process of execution. The first file
    contains code with .c extension that we save after writing code. The second file
    will be created after we compile it, which is saved with a .obj (object file)
    extension. The third file is the .exe file that we can directly execute. You can
    view the files going to the location where you saved your .c.


