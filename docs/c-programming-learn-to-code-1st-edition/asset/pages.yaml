  md: 'This chapter is dedicated to a discussion of arrays. After completion of this
    chapter, readers will have learnt the following:


    +   * How to define an array and its type;

    * How to write code to declare different types of arrays, like 1D arrays and 2D
    arrays, and use them for solving problems;

    * Declaration, processing, and manipulation of strings (also known as character
    arrays).


    # 10.2 Need for Arrays


    A variable can hold one value at a time. There are situations in which we want
    to store more than one value at a time. Suppose we want to store the age of 100
    persons and arrange them in a sorted manner. This type of problem can be solved
    by taking 100 variables, where each variable contains the age of a single person.
    But this is an inconvenient way to solve this problem. A more elegant way is to
    use *array*. So, before we solve different types of problems, we should know the
    basic concept of an *array*.


    # 10.3 Types of Arrays


    According to the definition, an array is a collection of compartments. Further,
    we can say the elements of an array can be stored in a row of compartments, or
    we can be stored in the form of a table. Depending upon the representation style
    and the type of data it contains, the array can be classified as shown in Figure
    10.2.


    A character array (string) is of the type 1D array (i.e., the array which contains
    only character data.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_238_0.png)


    **FIGURE 10.2**nClassification of arrays.'
