    day, he brings the file from the rack to his working area, processes it, and at
    the end of the file, he put it back on the rack. To understand the process flow,
    we can assume that the file rack is the hard disk that contains our files. Bringing
    the file to the working area is the same as opening the file. The working area
    is the memory where we process the file. Finally, putting it back to the file
    rack is the same as closing the file.


    In the following section, we will discuss every step in detail. To execute the
    process flow, the C language provides us with a set of library functions. The
    definition of these functions is available in the header file <stdio.h>. Table
    14.1 describes all the functions.


