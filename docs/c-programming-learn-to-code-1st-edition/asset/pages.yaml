  md: '# CPU


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_30_0.png)


    FIGURE 1.5

    Basic organization of a computer system.


    # 1.4.2 Memory


    Every computer has a memory unit primarily categorized into two types: primary
    memory and secondary memory. We will further discuss the classification and description
    of these memory units in Section 1.5. The primary job of this unit is to store
    everything, and that includes the data or instructions read by the input unit,
    the intermediate result produced by the processor, and the final result.


    > Memory is used to store input data or instructions, intermediate results yielded
    during processing, and the final result produced by the processor.


    # 1.4.3 Central Processing Unit


    The CPU is considered the brain of the computer system. It has two main components:
    the ALU and the CU. It reads the data from the storage unit, performs calculations
    as per user instructions, stores the final result in the storage device, and displays
    the result to the user. The ALU is used to execute all the logical and arithmetic
    operations. The CU is used to control the overall activity of the computer system
    and manage the interaction among the different components.'
