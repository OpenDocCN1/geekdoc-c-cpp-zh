    \ within the computer where the string of bits representing the variable’s value\
    \ is stored. There are basically two kinds of locations in a computer where such\
    \ a value may be kept – memory and CPU registers. Generally, the values which\
    \ are stored in the CPU register can be executed faster. The storage class determines\
    \ in which of these two locations the value is stored.\n\nA variable’s storage\
    \ class tells us:\n\n+   - Where the variable will be stored;\n- What will be\
    \ the initial value of the variable, if the initial value is not specifically\
