  md: '# Number Systems


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_43_0.png)


    **FIGURE 2.3**nPlace value of each digit in a decimal integer number.


    These digits can represent any value, for example: 6842 (read as six thousand
    eight hundred and forty-two). Figure 2.3 shows the place value of each digit in
    a decimal number. We are concentrating on integer numbers now; later, we will
    show you how to deal with numbers.


    We first multiply each digit by the base to the power of its position. After that,
    we add the result of the above operation to get the value (see Figure 2.3). In
    a decimal system, the base is 10. In general, in any number system, each digit’s
    position is assigned from the left starting from 0. In our example, we have four
    digits 6, 8, 4, and 2, with positions 3, 2, 1, and 0, respectively. The digit
    6 is multiplied by the base 10 to the power of its position 3, and we get 6000.
    Similarly, the digits 8, 4, and 2 are multiplied by 10 to the power of their corresponding
    positions (2, 1, and 0) to get 400, 40, and 2, respectively. Finally, all the
    results are added to get the value.


    # NOTE


    > Any number to the power 0 is 1. Even  to the power of 0 is also 1.


    $10^0 = 1$


    $5^0 = 1$


    $0^0 = 1$


    Now consider a real number description where the number contains a fractional
    part. The positions of the digits present before the decimal point follow follow
    a similar representation, like an integer. But, the positions are slightly different
    for the digits present after the decimal point. For the latter case, the positions
    are assigned from right to left, starting with –1. Consider one example 68.732
    (read as sixty-eight seven three two). In this example, 68 is considered as an
    integer and treated in a similar manner as discussed above. The digits present
    after the decimal point (i.e., 732) are assigned in a sequence starting from –1.
    Figure 2.4 shows this assignment and the calculation involved in generating the
    value. Here, 1, 0, –1, –2, –3 are assigned to 6, 8, 7, 3, 2, respectively. The
    digits in the given number are multiplied by the base to the power of its respective
    position and finally added to get the value.'
