    equivalent. The process is quite similar to the previous approaches. The numbers
    are treated separately; numbers that appear before the decimal place will be converted
    as the process discussed above, and the number that appears after the decimal
    place will be multiplied by 16. The digit that appears before the decimal point
    will be collected from top to bottom.


