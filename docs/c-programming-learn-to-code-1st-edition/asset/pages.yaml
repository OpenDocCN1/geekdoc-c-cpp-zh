  md: '# 1.6 Introduction to the Operating System


    # 1.6.1 Hardware and Software


    Before I introduce what an operating system is, I would like to discuss the concept
    of software-(s/w) and hardware (h/w). The h/w is a physical device connected to
    your computer. S/w is a collection of programs, and we install them on a computer
    system to instruct the h/w to do something. That means, to interact with the h/w,
    we need the help of s/w. Buying a computer from the market and connecting it to
    a power supply does not help you interact with the computer. The only way you
    can instruct the computer to do anything is to install s/w and give commands through
    it. Hence, the s/w will act as an interface between the user and the computer
    system. The figure 1.10 shows the user and h/w interaction through s/w: the h/w
    layer, s/w layer, and user layer. The user layer provides instruction to the s/w
    which in turns


    s is mainly of two types: application s/w and system s/w (Figure 1.10). Application
    s/w is built for a specific task or specific application. For instance, Microsoft
    word, VLC media player, or any browser s/w like Google chrome is application s/w.
    On the other hand, the system s/w allows access to the h/w. It acts as the interface
    between the user and the h/w as well as application s/w and h/w. The relationship
    can be seen in Figure 1.11.


    # 1.6.2 Operating System


    An Operating System (OS) is system s/w that handles all the instructions coming
    from the user or application s/w and instructs the h/w to perform accordingly
    (Figure 1.11). Several OSs are available on the market, like Microsoft Windows
    10, Ubuntu, Linux, Unix, and iOS. After buying a new computer, the first task
    is to install an OS on it; only then will the computer be usable. Later, we can
    install s/w above the OS to do other specific tasks. If we want to listen to music,
    we can install s/w like Windows Media Player or VLC media player. Similarly, for
    word processing, we can install Microsoft Word or LibreOffice. Figure 1.12 shows
    the position of an OS in a layering architecture.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_36_0.png)


