    to the appropriate pointer.


    Let us rewrite Program 13.2 using the calloc () function. Program 13.3 shows the
    changes made to the program and its output.


    # 13.3.3 The realloc () Function


    This is used to resize the memory previously allocated by malloc(), calloc(),
    or realloc (). It does not affect the content of the previously allocated memory
    blocks. This function tries to expand the space by allocating new blocks. But,
    if enough space is not available for continuous allocation, it can relocate the
    allocation along the previously allocated block to a new place in memory. If the
    allocation is successful, the function returns the address of the newly allocated
    block. If it fails to allocate the new allocation (maybe due to limited size),
    it returns NULL. The syntax for the realloc () function is shown in Figure 13.9.


