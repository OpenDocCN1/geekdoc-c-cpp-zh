    # 7.2 Unformatted Functions


    Many functions come under this category, and we use them either to read a single
    character through the keyboard or a string of characters. Similarly, we use some
    functions to write a single character on the screen or a string of characters.
    Let us discuss the detail of these functions.


    # 7.2.1 getchar () and putchar ()


    These functions help in reading a character from the standard input unit (usually
    a keyboard) and writing it to the standard output unit (usually a screen).


    getchar(): Reads a character from the standard input device.

    putchar(): Writes a character to the standard output device.'
