  md: "# Pointers\n\n+   * Comparison;\n* Assignment;\n\nThe increment (++) operator\
    \ increases the value of a pointer by the size of the data object the pointer\
    \ points to. For example, if the pointer refers to the first element in an array,\
    \ the ++ makes the pointer refer to the second element in the array. That means\
    \ if the array is an integer array then the pointer is increased by four bytes\
    \ and if the array is a float array then the pointer is increased by four bytes.\
    \ This is shown in Figure 11.11.\n\n# PROGRAM 11.14\n\n```\n#include<stdio.h>\n\
    void main() {\n    int A[5]={10, 50, 20, 30, 90};\n    int *p;\n    p=&A[0];\n\
    \    printf(\"%d \", *p);\n    p++;\n    printf(\"%d \", *p);\n}\n```\n\nOutput:\n\
    10 50\n\nExplanation:\nThis was shown in Figure 11.11. Similarly, the decrement\
    \ (--) operator decreases the value of a pointer by the size of the data object\
    \ the pointer refers to. For example, if the pointer refers to the second element\
    \ in an array, the -- makes the pointer refer to the first element in the array.\n\
    \nYou can add an integer to a pointer, but you cannot add a pointer to a pointer.\
    \ If the pointer p points to the first element in an array, the following expression\
