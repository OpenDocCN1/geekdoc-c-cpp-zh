  md: '# 15


    # The Preprocessor


    #  15.1 Introduction


    As the name suggests, this is something that needs to be processed before the
    actual processing is carried out. In the C language, preprocessing is nothing
    other than executing some special statements before actual compilation. These
    special statements are included inside a directive lie if the general structure
    of a C program is taken into consideration (see Figure 15.1). Before the actual
    compilation process, the preprocessor does its work. There are several commands
    available to control the activity of a preprocessor. Preprocessors generally remove
    the comment lines from the program and replace the macro-definitions wherever
    necessary. After writing the code, the preprocessor does the preprocessing, and
    the file name with a extension will be generated before the actual compilation
    process.


    The C language provides several preprocessor directives. In this chapter, we will
    discuss the frequently used preprocessor directives. After completing this chapter,
    the student will:


    +   - Be able to know what a preprocessor is and why it is required;

    - Be able to declare, define, and learn to code using preprocessor directives;

    - Learn about the macro and the way it is used inside a program.


    #  15.2 Preprocessor Directives


    Everything that starts with a # symbol is known as a preprocessor directive, such
    as #include. Several other preprocessor directives are also present in C, and
    the objective of this chapter is to introduce those.

    Here is a list of preprocessor directives:


    | #include | #define | #line | #endif |

    | #elif | #error | #pragma | #if |

    | #undef | #ifndef | #ifdef | #else |'
