    # 7.3 Formatted Functions


    Formatted functions allow us to supply the input in a fixed format and obtain
    the output in a specified format. There are two formatted functions available
    in C: printf() and scanf(). In this section, we will discuss different formatting
    styles supported by these two functions. We will use several examples to explain
    them in detail.


    # 7.3.1 printf() Function


    As already discussed, the printf() function is one of the most used functions
    in C. The syntax of this function:


    printf("Format strings", list of variables);

    Program 7.5 will help you to learn more about the printf() function. This program
    adds two numbers and shows the result.


