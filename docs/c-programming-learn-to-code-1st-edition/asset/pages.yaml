    # 1.4 Basic Computer Organization


    Before we can understand basic computer organization, see Figure 1.3 of a desktop
    computer system and its components. There are five components that we usually
    see: (1) the keyboard; (2) the mouse; (3) the monitor; (4) the cabinet; (5) the
