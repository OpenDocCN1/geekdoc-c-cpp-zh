    # 5.5.4 Character Data Types


    A character in C refers to an alphabet, number, or symbol enclosed within a single
    quote. For example, ''a'', ''5'', ''6'', and ''&'' represents a character constant.
    To store these characters, we require a variable declared with the char keyword.
    Characters are usually stored in bits of integer storage. The type modifier signed
    or unsigned can be explicitly applied to char. While unsigned characters have
    values between 0 and 255, signed characters have values from -128 to 127. Table
    5.9 shows the detail of these data types, size, and their ranges.


    A character is stored in memory as an ASCII value. ASCII stands for American Standard
    Code for Information Interchange. ASCII is a character encoding that assigns a
    numeric value to each character used in a computer. For example, the ASCII value
    of ''A'' is 65, and the small ''a'' is 97. The entire ASCII table is presented
    in Appendix A for easy reference.


