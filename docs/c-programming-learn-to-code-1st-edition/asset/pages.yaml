  md: '# 4.5.3.2 Windows


    The precondition is you have already installed the MinGW compiler on your machine,
    as explained in Chapter 16. You have created a program by typing it in using any
    default text editor (Notepad) and saved it as prog41.c.


    +   Step 1: Open the command prompt and go to the current directory where prog41.c
    file is present.


    +   Step 2: Type the following command to compile your program:


    ```

    gcc -o runfile prog41.c

    ```


    Here, "runfile" specifies the executable file''s name generated after successfully
    compiling prog41.c. Instead of using runfile, you can also use any name of your
    choice.


    +   Step 3: Type the following command to execute your code:


    ```

    runfile

    ```


    Now you can see the output on your screen.


    # 4.5.3.3 Linux


    The preconditions are the same; the gcc compiler is a default compiler in a Linux
    machine and does not require installation. Create a C program file, type your
    code, and save it as prog41.c.


    +   Step 1: Open the terminal window and go to the current directory where prog41.c
    file is present.


    +   Step 2: Type the following command to compile your program:


    ```

    gcc -o exec prog41.c

    ```


    Here, "exec" specifies the executable file''s name generated after successfully
    compiling prog41.c. Instead of using exec, you can also use any name of your choice.


    +   Step 3: Type the following command to execute your code:


    ```

    ./exec

    ```


    Now you can see the output on your screen.


    I recommend the reader to install MS Studio Code as an editor so that you don''t
    have to type the command every time you run your program. VS Code is freely available
    for all environments, whether Windows, Linux, or Mac.'
