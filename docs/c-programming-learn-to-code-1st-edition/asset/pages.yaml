  md: '# #4


    # # Introduction to C Programming


    # ##4.1 Introduction


    This chapter introduces the overall features of the C programming language, why
    we should use this language, what its characteristics are, and a short description
    of its history. I will also explain what the structure of a C program is, and
    how to execute it in different environments.


    The Tobe programming community index is a measure of the popularity of low-level
    languages. According to the index for August 2021, C programming (with a rating
    of 12.57%) is at the top of the list and is treated as the most popular language.
    I believe that learning C acts as a building block for learning other high-level
    languages. C will always stay ahead of other popular languages like Java and Python
    due to its completeness and low-level programming capability.


    We can use C to solve every type of programming problem. It can facilitate the
    low-level requirements of a programmer or high-level specifications. There are
    several discussions on whether C is a high-level language or a low-level language.
    It has the capability to access the system''s low-level functions as well as enabling
    us to code most of the high-level specifications. Here, many programmers assume
    that C is a middle-level language. But you can find many books and much literature
    where C is mentioned as a high-level language. We are not here to decide this
    issue; rather, we will focus on the different features of this language and learn
    how to code with it.


    +   - Most high-level languages (e.g., FORTRAN) provide everything the programmer
    might want to do already build into the language;

    - A low-level language provides nothing other access to the machine''s basic instruction
    set;

    - A middle-level language, such as C, probably doesn''t supply all the constructs
    found in high-languages, but it provides you with all the building blocks that
    you will need to produce your results.


    The advantages of using C are:


    +   - C is a real-world language, widely available and popular with professionals;

    - C is a small, efficient, powerful, and flexible language;

    - C has been standardized, making it more portable than some other languages;

    - C is close to the computer hardware, revealing the underlying architecture;'
