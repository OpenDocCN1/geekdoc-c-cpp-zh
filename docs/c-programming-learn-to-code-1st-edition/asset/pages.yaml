    \ Let assign numbers from 1 to 4 to the different components of a for loop. As\
    \ you can see, the initialization statement is assigned with ①, the condition\
    \ with ②, the increment/decrement with ③, and finally, statements inside the for-loop\
    \ body are assigned with ④. ① executes only once, and ② and ④ will iterate until\
    \ the condition in ② is satisfied. The line designated as \"true\" indicates that\
    \ when the condition in ② is satisfied, control starts executing all the statements\
    \ present in ④. Then it executes ② will form an increment/decrement statement\
    \ in ③ and checks the condition in ②. This will form an execution cycle. When\
    \ the condition in ② becomes false, control exits from the loop.\nThe for loop\
    \ can take different forms. The following programs show all the forms of the for\
    \ loop for printing the stdio.h numbers from 1 to 10.\n\n```\nI. #include<stdio.h>\n\
