    # 10.5 2D Arrays


    In the previous section, we discussed the concept of 1D arrays. We can write int
    x[5]; where 5 is the dimension. But in real life, we may come across a situation
    where we need to represent the data in a tabular format (with rows and columns).
    In mathematics, we use the concept of a matrix (e.g., int x[3][4]; where 3 and
    4 indicate the dimension) to represent a matrix. An array may take three dimensions
    or more. We can also say that an array takes more than a one-dimensional form,
    it is called a multidimensional array. In this section, we will discuss the 2D
    array.


    In the 2D array, we require two subscripts to indicate one element. One subscript
    denotes the row number and the other subscript denotes the column number. Like
    1D arrays, the subscript value starts from 0 (zero). Figure 10.11 shows an example
    to denote an element in a 2D array.


    # 10.5.1 Introducing Matrices


    A matrix[m][n] is an m by n table having m rows and n columns containing m × n
    elements (refer to Figure 10.12). Each element of the matrix is represented by
    mat[i][j].

    * i represents the row number and varies from i = 0, 1, 2, ..., m – 1

    * j represents the column number and varies from j = 0, 1, 2, ..., n – 1'
