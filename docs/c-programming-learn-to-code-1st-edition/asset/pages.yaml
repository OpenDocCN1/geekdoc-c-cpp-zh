    |---|---|---|---||

    | = 18 / 30 / 5 | = 18 / 3 * 2 | = 18 / 3 * 2 | = 6 * 10 / 5 | = 6 * 10 / 5 |

    | = 18 / 6 | = 6 * 2 | = 18 / 6 | = 6 * 2 | = 60 / 5 |

    | = 3 | = 12 | = 3 | = 12 | = 12 |


    (a) (b) (c) (d) (e)


    Figure 6.33

    Execution of an expression in different orders.


    Following the precedence is not enough to execute an expression. Consider the
    following example:


    ```

    R = 18 / 3 * 10 / 5

    ```


    There are several ways you can execute this expression if you follow the concept
    of precedence because / have the same precedence. Hence you get a different result
    for different executions, as shown in Figure 6.33.


    Figure 6.33 shows possible ways a person can execute the above expression. However,
    not even though you get correct answers for executions; the correct one is shown
    in Figure 6.33(e), which follows an execution pattern, from left to right. There
    are three operations to choose: 18/3, 3*10, and 10/2. If you go from left to right,
    the first operation encountered is 18/3, and you execute it. Now you have two
    operations to choose from, 6*10 or 10/2. You choose the first one to perform because
    this is the first operation encountered when you go left to right. Finally, you
    have only one operation to complete (i.e., 60/5), and you perform it to get your
    result. The rule that you follow (left to right execution rule) is known as the
    “rule of associativity.” This plays an important role in executing expressions
    in C where the precedence of operators is the same.


    To elaborate further, let us take another example. Assume that we have three variables,
    a, b, and c, with values 5, 6, and 7. Let us perform the following operation:


    ```

    a = b = c

    ```


    We cannot execute this expression from left to right, so we follow a right to
    left execution flow and a, b, and c having the values 7, 7, and 7, respectively.


    From the above two examples, we find that not only the precedence of operators
    is important; rather, associativity plays an essential role in executing expressions.
    Table 6.9 shows this precedence as well as its associativity.


