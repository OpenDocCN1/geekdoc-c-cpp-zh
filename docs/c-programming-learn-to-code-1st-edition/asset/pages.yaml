    # 3.7 Basics of a Programming Language


    According to the phases of problem-solving (Section 3.2), after the development
    of the algorithm and flowchart, the next stage is implementation using a programming
    language. This section will discuss the different types of programming languages
    that can be considered for this purpose.


    Let us first introduce what a program is. A program is a set of logically related
    instructions that are arranged in a sequence and guide the computer to solve a
    problem. The process of writing a program is called *programming*.


    A standard programming language is used to write a computer program. Programming
    languages can be classified into two types:


    +   1. Low-level languages;

    2. High-level languages.


    # 3.7.1 Low-level languages


    A computer cannot understand instructions given in high-level language or the
    language used by humans. The computer only understands the language of 0''s and
    1''s, which is nothing but a low-level language.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'There are two types of low-level languages:


    +   1. Machine-level languages;

    2. Assembly-level languages.


    # 3.7.1.1 Machine-level Languages


    This is a sequence of instructions written in the form of binary numbers consisting
    of 1’s and 0’s to which a computer responds directly. Machine languages are the
    only languages understood by computers.


    An instruction in a machine-level language consists of two parts:


    +   1. OPCODE (operation code);

    2. OPERANDs (addresses or locations).


    Operation code tells the computer what function must be performed, e.g., addition,
    subtraction. Operands are the memory locations where the values are stored upon
    which the operation will be done.


    ```

    EXAMPLE

    0000 0111 Load A register with value 7

    0010 1010 Load B register with value 10

    1000 0010 A ← A + B

    0111 0110 Halt Processing

    ```


    # Advantages


    The computer can execute programs written in machine language very fast because
    the instructions are understood directly by the computer, and no translation is
    required.


    # Disadvantages


    +   1. Machine dependent: the user must know the internal design of the computer;

    2. Difficult to use;

    3. Error prone;

    4. Difficult to debug.


    # 3.7.1.2 Assembly-level Languages


    In the case of assembly-level languages, instead of binary codes, some mnemonic
    codes are used. A mnemonic code is nothing but a symbolic representation, or we
    can say it is a combination of letters, digits, or special characters that are
    used instead of binary codes.


