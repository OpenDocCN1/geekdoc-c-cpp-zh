    # 6.10.1 Evaluation of Expressions


    Expressions are evaluated using an assignment statement of the form:


    ```

    variable = expression

    ```


    +   - The variable is any valid C variable name;

    - When the statement is encountered, the expression is evaluated first and then
    replaces the variable''s previous value on the left-hand side;

    - All variables used in the expression must be assigned values before evaluation
    is attempted;

    - We can write only one variable on the left-hand side of = ; that is, the expression
    x = k * i is legal, whereas k *= i is illegal.


    # 6.10.2 Rules for Evaluation of Expressions


    +   - First, parenthesized subexpressions are evaluated from left to right;

    - If parentheses are nested, the evaluation begins with the innermost subexpression;

    - The precedence rule is applied in determining the order of application of operators
    in evaluating subexpressions;

    - The associativity rule is applied when two or more operators of the same precedence
    level appear in the subexpression;

    - Arithmetic expressions are evaluated from left to right using the rules of precedence;

    - When parentheses are used, the expressions within the parentheses assume the
    highest priority.'
