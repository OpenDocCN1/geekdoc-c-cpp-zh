    # 4.2 History of C


    C came into being in the 1969–73, in parallel with the early development of the
    Unix operating system; the most creative period occurred during 1972. The C programming
    language often called the “white book” or “K&R” [1]. Finally, in the mid-1980s,
    the language was officially standardized by the ANSI X311 committee, which made
    further changes. Until the early 1980s, although compilers existed for a variety
    of machine architectures and operating systems, the language was almost exclusively
    associated with Unix; more recently, its use has spread much wider, and it is
    among the languages most commonly used throughout the computer industry, [2, 3].


    By 1960 a number of computer languages had come into existence, almost all for
    a specific purpose. For example, COBOL was being used for commercial applications,
    and FORTRAN for engineering and scientific applications. At this point people
    started thinking about developing a common language which could program for all
    possible applications.


    Several languages preceded the development of C. In 1967, Martin Richards developed
    a language called Basic Combined Programming Language (BCPL). In 1970 Ken Thompson
    developed a similar language called B. Finally, in 1972 Dennis Ritchie (Figure
    4.1)


