    \ or column major order. The C language supports row major order representation.\
    \ We also know that an array is stored by contiguous memory location. Hence, if\
    \ we get the first address of the 2D array, we can easily access the remaining\
    \ elements of the array through the pointer. To understand this let us write the\
    \ code for accessing the array element using a pointer. If you remember, a 2D\
