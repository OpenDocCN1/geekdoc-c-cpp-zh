- img_proc: true
  md: '# Constants, Variables, and Data Types


    # 5.7.2 Real Constants


    Real constants are also called floating-point constants. They represent values
    that contain a decimal point. There are two ways to represent a real constant:


    +   1. Fractional form;

    2. Exponential form.


    # 5.7.3 Fractional Form


    +   - A real constant must have at least one digit.

    - It must have a decimal point.

    - It could be either positive or negative. The default sign is positive.

    - No commas or blank spaces are allowed within a real constant.


    Examples: +324.56, -568.9, 32.4, 748.00.


    # 5.7.4 Exponential Form


    In this case, the real constants are represented in two parts:


    +   - The part appearing before ''e'' is called the mantissa. The part following
    ''e'' is the exponent.

    - The mantissa part and the exponent must be separated by the letter ''e'' or
    ''E''.

    - The mantissa part may have a positive or negative sign.

    - The default sign of the mantissa part is positive.

    - The exponent must have at least one digit, which must be a positive or a negative
    integer.


    Examples: +3.2e-5, 4.1e5, -0.5e45.


    # 5.7.5 Character Constants


    A character constant is either a single alphabet/digit/special symbol enclosed
    within a pair of quotes:


    +   - The maximum length of a character constant is 1;

    - Character constants have an integer value known as an ASCII value.


    Examples: ''a'', ''5'', ''&''.


    # 5.7.6 String Constants


    A string constant is a sequence of characters enclosed in a double quote. The
    characters may be letters, numbers, or special symbols.


    Examples: "program", "235", "5+3", "x".'
