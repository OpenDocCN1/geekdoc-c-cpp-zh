    \n```\n/* A program to show the basic operations\nof arithmetic operators*/\n\
    #include<stdio.h>\nint main () {\n    int x, y, z;\n    x=25;\n    y=6;\n    z=x/y;\n\
    \    printf(\"\\n x/y=%d\", z);\n    z=x%y;\n    printf(\"\\n x%%y=%d\", z);\n\
    \    return 0;\n}\n```\n\n**FIGURE 6.2** C program showing of arithmetic operators.\n\
    \nLet us write an example program that shows the result of the divide and modulo\
    \ operations. Figure 6.2 shows the C program code. You can see that when 6 divides\
    \ 25, we obtain 4 (quotient), and when we perform the modulo operation, we get\
    \ the remainder, which is 1.\n\n# 6.3 Relational Operators\n\nThere are situations\
    \ where we need to compare two values and make decisions. The C language provides\
    \ several comparison operators for this purpose. The work of these operators is\
    \ to compare two items for their equality, inequality, or whether one is greater/smaller\
    \ than the other.\n\n+   - These are binary operators and work upon two operands;\n\
    - The result of these operators is either \"true\" or \"false\";\n- If the comparison\
    \ result is true, then it returns 1, else it returns 0.\n\nTable 6.2 shows the\
    \ complete set of relational operators and their symbols for your reference. For\
    \ beginners, the symbols may look uncommon but they do have a similar meaning\
    \ compared to mathematical operators.\n\nThe double equal to operator (==) checks\
    \ the similarity of two operands. For example, if a=5 and b=5, then a== returns\
    \ 1, which means both contain the same value. Similarly, for the value of a and\
    \ b, a!= returns 0. Let us take some programming examples (Figure 6.3) to understand\
    \ the use and features of these relational operators."
