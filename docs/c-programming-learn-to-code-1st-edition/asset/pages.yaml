    # 12.7 Structures within Structures (Nested Structures)


    When one structure is a member of another structure, we say it is a nesting of
    structures or a structure within a structure. Let us take an example. Suppose
    we have a structure named Employee with the following data members: ID, Salary,
    and Date of Join (DOJ). Here DOJ is itself a structure with data members: Day,
    Month, and Year. This structure design is shown in Figure 12.11


    # 12.7.1 Declaration of Nested Structures


    Declaration of nested structures can take different forms. Either we can declare
    the nested structures with all their data members inside the main structure, or
    we can declare each structure separately and group them inside the main structure.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_342_0.png)


    FIGURE 12.11

    Nested structures.'
