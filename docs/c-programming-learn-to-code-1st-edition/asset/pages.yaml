  md: "![](img/143ed8ebbfceaff380a38b7c1fdd9a61_220_0.png)\n\nRecursive definition:\
    \ A repetitive function defined recursively whenever the function appears within\
    \ the function definition itself. The factorial function can be defined recursively\
