- img_proc: true
  md: '# Central Processing Unit


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_32_0.png)


    FIGURE 1.6

    Memory organization.


    # 1.5.1 Registers


    These are the smallest, high-speed, volatile memories available inside the CPU
    for easy access while processing or executing a task. The total number of registers
    present inside a CPU varies from architecture to architecture. The most common
    ones are general purpose registers, program counters, and instruction registers.
    A general purpose register stores current and intermediate data of an executed
    instruction. There may be several purpose registers available inside the CPU.
    A program counter keeps the information regarding the instruction about to run
    next. It is like a counter and holds an address that keeps increasing after the
    execution of the current instruction. The instruction register contains the instruction
    that is currently executing. The CPU fetches the instruction from the primary
    memory, places it inside the instruction register, decodes it, and finally executes
    it.


    # 1.5.2 Cache Memory


    Cache memory is a volatile memory present in the main memory and the CPU register.
    The speed of this memory is higher than main memory and slower than the CPU registers.
    Every time the CPU requests the next instruction, the control first searches for
    inside the cache. If it is not there, then the control brings a set of instructions
    (along with the required one) from the main memory and keeps it inside the cache.
    The benefits of bringing the whole group lie in the principle of locality of reference:
    the CPU always fetches the instructions that are adjacent to each other, other
    location.


    # 1.5.3 Primary Memory


    Primary memory, commonly referred to as the main memory, is a significant component
    of any computing device. It is an intermediate memory between the secondary memory
    and the CPU of the computer system. On request, the CPU needs to load an application
    in the main memory for execution. When a programmer finishes writing a program,
    he she stores it in secondary memory. To execute that program, the CPU loads from
    secondary memory to the primary memory. The processor is now directly interacting
    with the main memory and runs the program. At this point, it is necessary to understand
    the internal architecture of the main memory subsystem.'
