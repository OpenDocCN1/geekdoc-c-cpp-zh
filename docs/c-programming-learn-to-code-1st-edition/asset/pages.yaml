  md: '# 4.3 Executing a C Program


    When a task is assigned to a programmer, he she needs to analyze it, prepare an
    algorithm, and draw flow charts to solve the given task. The next step is to convert
    the algorithm into a program and execute it to check the results. This section
    describes the execution process of a program. Developing and executing a program
    in C requires at least four steps, shown in Figure 4.2:


    +   1. Editing (or writing) the program;

    2. Compiling it;

    3. Linking it (with functions that are needed from the C library);

    4. And finally, executing it.


    # 4.3.1 Editing


    You write a computer program with words and symbols that are understandable to
    human beings. This is the editing part of the development cycle. You type the
    program directly into a window on the screen and save the resulting text as a
    separate file. This is often referred to as the source file. The C program is
    stored in a file with the extension "c".


    # 4.3.2 Compiling


    You cannot directly execute the source file. To run on any computer, the source
    file must be translated into binary numbers understandable by the computer''s
    central


