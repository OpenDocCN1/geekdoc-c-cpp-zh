  md: '# Operators and Expressions


    #  6.11 Type Conversion


    Sometimes we need to convert the value of an expression from one data type to
    another, known as type conversion. Let us take an example (Figure 6.29) that shows
    the concept of type conversion.


    In this program automatic type conversion is made by the compiler (i.e., from
    integer to float conversion) and this is called *type conversion or type casting*.


    Type casting in C is of two types: implicit and explicit.


    # 6.11.1 Implicit Type Casting


    C permits the mixing of constants and variables of different types in an expression.
    C automatically converts any intermediate values to the proper type so that the
    expression can be evaluated without losing any significance. This automatic type
    conversion is known as implicit type conversion.


    Figure 6.30 shows an example. In the program (Example 1), p is a float variable,
    and we assign the value 2.56 to it. Here x is an integer. We assign the value
    of p to x, so the value of p (i.e., 2.56) is automatically converted into integer
    value 2. So, the output will be 2.


