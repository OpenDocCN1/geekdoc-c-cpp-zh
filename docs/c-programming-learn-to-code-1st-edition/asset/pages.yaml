    C Programming


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_330_0.png)


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_330_1.png)


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_330_2.png)


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_330_3.png)


    FIGURE 12.3

    Visualization of information storage problem.


    Let us think in another way. We have already used an array in Chapter 9, which
    represents a group of data items having the same data type. But, if you have data
    with different data types, where do you store it? For example, you want to store
    the information of an employee (Case 1 of Figure 12.3). Employee information consists
    of a name, age, and salary. The name of the employee is a string, age is an integer,
    and the salary is of float type. Hence, we cannot use an array to store these
    pieces of information. We can store it using three different types of variables:
    char Name [50] to store the name, int age to store the age, and float salary to
    store the salary. Assume that there are many employees whose information you want
    to store (Case 2 of Figure 12.3). For each employee, you need to declare separate
    variables, and managing them is quite tricky. The visualization of this situation
    is shown in Figure 12.3.


    From the discussion, we conclude that the basic data types cannot solve these
    problems. We need something special. C structure provides a better solution for
    the above problems, what is known as a structure. A structure is a user-defined
    data type and can group one or more variables of different data types under a
    single name. Similarly, another user-defined data type is union. This is also
    used for the same purpose; it is like structure but with a little difference as
    discussed in Section 12.12. This entire chapter is dedicated to a discussion of
    these user-defined data types.


    After completing this chapter, the student will be:


    +   - Able to define a structure, a union, and the difference between them;

    - Able to declare and use structure and union variables for information storing
    and processing;'
