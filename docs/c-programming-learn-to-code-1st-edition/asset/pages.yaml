    Note that the compiler treats the two x''s as totally different variables, since
    they are defined in different blocks. Once control comes out of the innermost
    block the variable x with value 8 is lost, hence the x in the second printf()
    refers to x with value 18.


    # 9.8.2 Register Storage Class


    A value stored in a CPU register can always be accessed faster than the one that
    is stored in memory. Therefore, if a variable is used at many places in a program
    it is better to declare its storage class as a register.

    To be remembered:


    +   - If we declare a variable as a register variable, we cannot say for sure
    that the value of the variable would be stored in a CPU register, because the
    number of CPU registers are limited, and they may be busy doing some other task.
    In such an event variable works as if its storage class is auto.

    - Declaring a variable as a register storage class is a request to the compiler
    but not a command.

    - Every type of variable cannot be stored in a CPU register, if the microprocessor
    has 16-bit registers then they cannot hold a float value or a double value, which
    require 4 and 8 bytes respectively.


