    the "=" symbol is also used for this purpose.

    2. Relational symbols, arithmetic symbols, and comments: see Table 3.1.


    For beginners, these symbols may be unusual, but they are used every day by C
    programmers. Most of the symbols are self-explanatory, note:


    +   - For "double equal to", suppose a = 5 and b = 5, then a == b evaluates to
    true. That means the value of a and b are the same.

    - As we are about to convert algorithms to C programs, we need to understand the
    difference between the divide (/) and the remainder (%) symbol. Suppose a = 10
    and b = 3, then a/b evaluates to 3, and a%b evaluates to 1.

    - Sometimes we need a comment line for documentation, and we write our comment
    following the // symbol.


