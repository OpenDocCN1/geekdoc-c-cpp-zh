    # 8.11.1 Difference between while and do-while Loops


    There is minor difference between the working of while and do-while loops.


    +   * The while loop tests the condition before executing any of the statements
    within a while loop, the do-while loop tests the condition after executing the
    statements at least once.

    * The do-while loop executes the statements at least once if the condition is
    false, but the while loop does not execute any statement if the condition is false.

    * The do-while loop is often called a post-test loop or exit-controlled loop.
    Similarly, the while loop is called an entry-controlled loop or pre-test loop.


    Figure 8.17 illustrates the concept.'
