  md: '# # 8 Control Structures


    # ## 8.1 Introduction


    Whatever we have discussed till now, all problems have been relatively simple
    and did not require any decision-making process. But in real life, we come across
    many problems where we need to decide what to do and what not to do. Assume that
    we want to collect flowers from a tree, and the tree has many branches. So, we
    need to choose a branch in such a manner that we can get the maximum number of
    flowers (Figure 8.1). Similarly, we may have problems that need some work to be
    done repeatedly. So, to solve different kinds of problems, we need the concept
    of control structure. Control structure determines the flow of control in a program,
    that is, it indicates the order in which the various instructions in a program
    are executed inside the computer.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_165_0.png)


    **FIGURE 8.1**nDecision-making problem example.'
