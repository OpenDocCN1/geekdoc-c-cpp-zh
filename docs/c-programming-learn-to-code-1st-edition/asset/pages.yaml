    # 9.3 Types of Function


    The C programming language supports two types of functions:


    +   1. Library functions or predefined functions;

    2. User-defined functions.


    We have come across many library functions like printf() and scanf() which were
    used in our previous programs, and the definition of these functions are predefined.
    In the following section, we are going to discuss user-defined functions.


    The basic difference between these two types of function is that we do not write
    library functions; we only use them, whereas we write user-defined functions for
    specific problems.


    # 9.4 User-defined Functions


    A function can be defined as a group of statements enclosed within a block with
    a valid identifier and can perform a specific task. Generally, a function will
    process information that is passed to it from the calling portion of the program
    and return a single value. Information is passed to the function via special identifiers
    called arguments (also called parameters) and returned via the return statement.
    A user-defined function only executes when it is called.


    > A function can be defined as a group of statements enclosed within a block with
    a valid identifier and can perform a specific task.'
