    # 10.5.3.1 Row Major Order


    In row major order the first row occupies the first set of memory locations, the
    second occupies the next set, and so on (see Figure 10.14).

    The address of an element in the above 2D array can be calculated by the following
    formula:


    > $Address(A[i][j]) = Base + W(C \times i + j)$


    where,

    W = the size of each element;

    Base = the base address of the array;

    C = the number of columns in the array.


    **Quiz:** Assume that a $3 \times 3$ 2D array is represented in row major order
    and stores integers. Let the integers take four bytes in memory. The base address
    is 2000. Find the address of A[1][2].


    **Answer:**


    > $Address(A[i][j]) = Base + W(C \times i + j)$

    $

    Address(A[1][2]) = 2000 + 4(3 \times 1 + 2)$

    $

    Address(A[1][2]) = 2000 + 20 = 2020$


