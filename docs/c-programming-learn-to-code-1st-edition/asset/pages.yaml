  md: '# 12


    # Structures and Unions


    # 12.1 Introduction


    Before we start this chapter, let us pick up some real-life problems and think
    about whether we can solve these problems using the programming technique learned
    till now.


    **Problem 1**: Write a program to add together two times. We represent time with
    three hour, minute, and second. For example, time T1 = 2:35:40, time T2 = 5:10:35.
    Find time T3 that T3 = T1 + T2 (see Figure 12.1).


    **Problem 2**: Write a program to add the height of two persons, in feet and inches.
    For example, height H1 = 5''10", height H2 = 5''8". Find the height H3 such that
    H3 = H1 + H2 (see Figure 12.2).


    Thinking about Problem 1, do we have any data type available to represent the
    time as a single entity? I mean, can we write int t to store the hour, minute,
    and second simultaneously? The answer is no. Similarly, Problem 2 cannot be solved
    using the existing data type that we have been using. Hence, we need a different
    data type for this, and yes the C language provides us with the features to define
    the new data type for these specific problems. A structure is one such technique
    that helps us in solving the problem discussed above.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_329_0.png)


    FIGURE 12.1

    Problem 1 visualization.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_329_1.png)


    FIGURE 12.2

    Problem 2 visualization.


    DOI: 10.1201/9781003188254-12


