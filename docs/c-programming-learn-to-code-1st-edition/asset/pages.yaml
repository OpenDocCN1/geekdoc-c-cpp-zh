- img_proc: true
  md: '# Introduction to the Computer


    The CPU is called the brain of the computer system. It controls and coordinates
    the interaction among different components and handles all the arithmetic and
    logical operations.


    # 1.4.4 Output Devices


    These help in displaying the results of a computation. For example, when we execute
    a program, the output is shown on the monitor screen. So, in this case, the monitor
    acts as the output device. Similarly, a speaker is also an output device.


    An output device obtains the result produced by the CPU, converts it into a human-readable
    form, and displays it to the user of the computer system.


    A programmer needs to understand how the instructions are executed inside the
    CPU. This requires a detailed exploration of the memory unit. The following section
    introduces the idea of memory-processor integration and its communication technique.


    # 1.5 Computer Memory


    A modern digital computer has several memory subsystems organized in a hierarchy,
    starting from the smallest high-speed registers to a high-capacity hard disk drive.
    A computer has the following main memory subsystems:


    +   - Registers;

    - Cache memory;

    - Primary memory;

    - Secondary memory.


    Figure 1.6 shows how these memories are arranged with the CPU for easy communication
    and program execution. The main reason behind so many categories of memory lies
    in the two requirements: speed and capacity. The CPU needs high-speed memory because
    the execution speed of a CPU is relatively high compared to the data supplying
    capability (reading the content from memory and submitting it to the CPU for processing)
    of any memory. On the other hand, a user always needs a high-volume memory to
    permanently keep all their data and programs. The capacity of the secondary memory
    is relatively high compared to the memory, cache, and registers. In contrast,
    fetching data from the register is faster than any other memory subsystem. It
    is evident that building high-speed memory incurs more cost as compared to low-speed
    memory.


    A programmer needs to understand memory organization to write efficient programs.
    Let us describe a few points about each category of all memory types.'
  merge: -1
