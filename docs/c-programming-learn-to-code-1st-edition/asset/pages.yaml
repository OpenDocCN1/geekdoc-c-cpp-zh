    # 9.1 Introduction


    This chapter introduces the concept of a function which is the most fundamental
    element of any programming language. A function is something that, when called,
    performs some tasks. We can think of a vending machine as a small machine that
    takes some input and provides some output . For example, a vending machine (Figure
    9.1)


    We all know how a vending machine works. In Figure 9.1, the machine offers three
    items: candy at ¥10, a cupcake at ¥20, and a milk bottle at ¥50. The user wishes
