  md: '# 2.2.4 Octal Number System


    The octal number system uses eight symbols (octal digits) to represent a number:


    0, 1, 2, 3, 4, 5, 6, 7


    The *base* is 8 because it uses eight octal digits to represent a number in an
    octal number system. The benefit of using an octal number system over a binary
    number system is small length in representing a number. A three-bit binary requires
    only one octal digit to represent the same number, as we will see shortly.


    We follow the rule to assign positions to each digit of an octal number, starting
    from 0 from right to left. Figure 2.8 shows an octal number with its assigned
    numbers. We can calculate the decimal equivalent of that octal number using the
    same principle followed in the other systems discussed above. We first multiply
    each digit by the power of its corresponding position and add it. The calculation
    procedure is shown in Figure 2.8. However, we can say the octal number 435 is
    equivalent to decimal 285.


    Octal numbers with a decimal point are not so common, but we can represent and
    process it as well as binary numbers with a decimal point. We will discuss the
    conversion process later in this chapter.


