  md: '# # 1 Introduction to the Computer


    # ## 1.1 Introduction


    Perhaps the most powerful and resourceful tool ever created by humanity is the
    computer. The term "computer" could mean a device that calculates. But nowadays
    a computer can do a variety of jobs. If you take any field, it is engineering,
    healthcare, automotive devices, gaming, or entertainment,where a computer is used
    to do the task. This chapter introduces how computers came into existence and
    describes the different components associated with a computing device. After completion
    of this chapter, the reader will have learnt the following:


    +   1. What a computer is, and how may we define it.

    2. A brief history of the computer and how it came into existence.

    3. What the different components of a computer system are, and how they are organized.

    4. Be able to define a memory subsystem, its categories, and its organization.

    5. Understand the importance of an Operating System (OS) and its functionality.


    This chapter''s content is purely elementary and not meant for those who know
    the basics of computer systems. Those with a moderate knowledge of any computer
    language can skip this chapter. We will start the chapter by introducing the definition
    of a computer system and its characteristics.


    # ## 1.2 Definition and Characteristics of a Computer System


    The development of a computer system has a long history, which includes the work
    done by several great minds. In this modern era, we can consider a computer as
    a system that processes data and produces useful information. Though there is
    no formal definition that defines a computer, we will try to propose a definition:


    > A computer is an electronic device that receives input through an input device,
    stores it the storage device (memory), and manipulates or processes the data to
    produce information (output) through an output device.'
