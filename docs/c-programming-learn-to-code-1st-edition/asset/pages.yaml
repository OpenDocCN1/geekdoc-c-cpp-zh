  md: '# C Programming


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_414_0.png)


    FIGURE 15.1

    nThe position of a preprocessor directive.


    The preprocessor statements do not end with a semicolon; rather, they extend over
    a whole line. That means you cannot write two preprocessors in a single line.
    The following statement shows an error:


    ```

    Error #include<stdio.h> #include<conio.h>

    ```


    Like other variables and functions, the preprocessor directive must appear before
    it is used inside the program. Generally, preprocessor directives are written
    at the beginning of the program, but it is not mandatory. Most of the preprocessor
    directives mentioned in the list are not used frequently. We will discuss the
    frequently used directives. We categorize the directives into four groups:


    +   1. Macro: is used to assign a symbolic name to a constant. It can also be
    used for defining macro-definitions. We use a #define preprocessor to write a
    macro.

    2. File include: We use a #include preprocessor to do this task, which includes
    the content of a file following the preprocessor directive. We have already used
    this in all our programs when using the statement #include<stdio.h>.

    3. Conditional preprocessors: Several conditional preprocessor directives are
    available, such as #if, #else, #endif, #elif, #ifndef, and #ifdef. They are used
    for assigning conditions, to execute a line of code or not.

    4. Other directives: This includes preprocessors like #line, #pragma, and #error.
    The overall definition of these directives is shown in Table 15.1.


    # 15.3 Macro-substitutions


    As per the discussion in Section 15.2, we use the #define preprocessor directive
    to define a macro. First, let us understand what a macro is? A macro, as the name
    suggests, is one line of code used for substituting a macro-name with a macro-body.
    In other words, we can say it is a process of assigning a symbolic name to a program
    constant.'
