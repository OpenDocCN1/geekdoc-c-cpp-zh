    Output:


    Enter any number 5

    Factorial value = 120


    Explanation:


    In the above program if n==0 it returns 1, which means it solves a small piece
    of the problem factorial(0) as 1. On the other hand, the line return n*factorial(n-1)
    reduces the size of the problem by recursively calling the factorial with n-1.


    The statement that solves the problem is known as a base case that stops the decomposition
    of the problem. Every recursive function must have a base case. The rest of the
    function is known as the general case.


    +   - In our factorial example, the base case is factorial(0).

    - The general case is n*factorial(n-1). The general case contains the logic needed
    to reduce the size of the problem.


    In this problem, once the base case or stopping condition has been reached, the
    solution begins. The program has one part of the answer and return to the next
    general statement. Thus in the above problem, after the program has calculated
    that factorial(0) is 1, it returns the value 1.

    This leads to solving the next general case:


    Factorial(1)=1*factorial(0)=1*1=1


    The program returns the value of factorial (1) to the more general case, factorial(2):


    Factorial (2)=2*factorial (1)=2*1=2


    As the program solves each general case in turn, the program can solve the next
    higher general case, until it finally solves the most general case, the original
    problem.

    The designing of recursive functions has the following rules:


    +   - First, determine the base case;

    - Then, determine the general case;

    - Finally, combine the base case and the general case into a function.'
