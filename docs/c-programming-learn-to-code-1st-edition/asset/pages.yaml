  md: '# Dynamic Memory Allocation


    # 13.1.1.1 Text Segments


    The compiled code of a program resides in the text segment. Text segments are
    also called code segments.


    # 13.1.1.2 Data Segments


    The global variables and local static variables are stored in this section. Generally,
    static variables and global variables can be accessed by any function.


    # 13.1.1.3 Stack Segments


    A stack follows the concept of LIFO (Last In First Out) to store and remove data.
    Inserting an element to a stack is called a PUSH operation and removing of an
    element is called a POP operation. When a function locally declares a new variable,
    it is pushed into the stack, and when the execution of the function completes,
    the allocated space is released.


    # 13.1.1.4 Heap Segments


    A heap is a free memory pool that can be used for dynamic memory allocation. The
    size of the heap is always larger than a stack. The compiler provides some predefined
    functions which can be used to allocate memory in the heap area. Once the memory
    is allocated, it is the responsibility of the programmer to release that memory.
    The process of releasing memory is always performed after execution finishes.
    The C language provides predefined functions to release the memory. If, for any
    reason, we are not able to release the allocated memory, a memory leak occurs,
    which degrades the performance of the computer. Reading from a heap and writing
    to a heap takes slightly more time because the pointer is required to access the
    memory present in the heap.


    # 13.2 Types of Memory Allocation


    Memory allocation is categorized into two types: static memory allocation and
    dynamic memory allocation. Until now, in whatever programs we have written, all
    allocation has been done using static allocation. Generally, static allocation
    is made inside a stack, and dynamic allocation is made inside a heap.


    # 13.2.1 Static Memory Allocation


    Static memory allocation refers to the allocation of memory at compile time. After
    the allocation is done, we cannot modify its size. All allocation, in this case,
    is made inside the stack.


    # 13.2.2 Dynamic Memory Allocation


    Dynamic memory allocation refers to the allocation of memory at run time. We can
    easily request the exact amount of memory required by the user and allocate it
    during execution. All allocation, in this case, is made inside a heap.'
