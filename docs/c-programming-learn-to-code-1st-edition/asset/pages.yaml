  md: '# #3 Problem Solving through Flowcharts and Algorithms


    # ##3.1 Introduction


    Now that we understand what a computer is, it''s time to solve problems using
    the computer. We will begin by introducing the problem-solving techniques progressed
    through algorithm writing and flowchart drawing. To learn how always starts with
    understanding the problem well, drafting it on paper through a step-by-step method
    called an algorithm, and finally, drawing the flowchart to show how the input
    flows through the solution steps and produces the output. Figure 3.1 shows the
    essential steps needed before we write C programming code. Hence, we recommend
    the reader, before proceeding to write programs, to follow these steps.


    This chapter provides a detailed description of algorithm writing and flowchart
    drawing. I have tried to include a sufficient number of examples that describe
    all the concepts involved in writing algorithms. Once the reader knows how to
