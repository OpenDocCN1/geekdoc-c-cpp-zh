  md: "# 11.2 Basic Knowledge\n\nWithin the computer’s memory, every stored data item\
    \ occupies one or more contiguous memory cells (i.e., adjacent words or bytes).\
    \ The number of memory cells required to store a data item depends on the type\
    \ of data item. For example, a single character will typically be stored in one\
    \ byte (eight bits) of memory; an integer usually requires four contiguous bytes;\
    \ and a double-precision quantity requires eight contiguous bytes.\n\nSuppose,\
    \ a variable that represents some particular data item. The compiler will automatically\
    \ assign memory cells for this data item. For example, if we declare a variable\
    \ sample as follows:\n\n```\nint sample=25;\n```\n\nThen, in computer memory,\
    \ this variable sample takes a place and has an address shown in Figure 11.2.\n\
    Now we can access the value of the variable by using the variable name and we\
    \ can access the address of the variable by using the address of (&) operator.\n\
    To explain, analyze Program 11.1.\n\nPROGRAM 11.1\n#include<stdio.h>\nvoid main()\
    \ {\n    int sample=25;\n    printf(\"\\n Value of the variable=%d\", sample);\n\
    \    printf(\"\\n Address of the variable=%u\", &sample);\n}\nOutput:\nValue of\
    \ the variable=25\nAddress of the variable=2000\n\nIn the above example, we use\
    \ %u for an unsigned integer, because an address cannot be negative. We may summarize\
    \ this as:\n\n+   - Every variable has an address;\n- We can know the address\
    \ of the variable using the address of the operator (&);\n- The address cannot\
    \ be negative;\n- For accessing the value of the variable, we need the name of\
    \ the variable."
