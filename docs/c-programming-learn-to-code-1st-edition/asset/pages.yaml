  md: '# 14


    # File Handling


    # 14.1 Introduction


    I believe most of the readers of this book know of at least one kind of word-processing
    software. Every mobile phone today has a word processor installed in it. Consider
    also a notepad where we type (write) something and store it in our local drive.
    In the future, we can access its content anytime. We add (write) new content,
    remove, delete (the) existing content, copy the content from one to another, or
    we can read the content from it. A notepad is a piece of software that gives us
    the facility to create a file and add allow us to perform the several kinds of
    operations mentioned above. C programming allows us with some predefined functions
    that will enable us to create a file or read an existing file and perform several
    operations in it. In Chapter 7, Section 7.1 we classified the I/O functions into
    three groups: (i) console I/O (ii) file I/O and (iii) port I/O. The file I/O functions
    provided by C enable us to perform operations on files. Generally, files reside
    on our hard disk drive. In this chapter, we will learn how to access these files,
    read the content from it, write new content in it, and so on, by writing C code.
    The overall process of file handling is shown in Figure 14.1.


    Files reside in our local drive and are available on demand. The output functions
    extract the content of the file and send it for processing. After the processing
    is completed, the updated content is written to the file or displayed on the screen
    using the input function. Here input functions are used for inputting (writing)
    the content to a file. The output functions are used for extracting (reading)
    the content of the file.


    This chapter is about writing code that performs several operations on a file.
    We categorize these operations into three groups as shown in Figure 14.2. The
    first group describes the output functions that help us in reading (extracting)
    the content from a file and displaying it on a screen using a console output function
    like `printf`. The second group explains the functions available for writing new
    content to a file by reading it from the console. The third group describes the
    program code for how to perform read/write operations on a file using I/O functions,
    as explained by the two groups above. After finishing this chapter, the student
    will be able to:


    +   * Define and differentiate between file I/O and console I/O;

    * Open a file in different modes, as read mode, write mode, and append mode;

    * Use several input and output functions along with their syntax and the way they
    are used in our programs;

    * Copy the content of one file to another;

    * Know about file streams and types of files.


