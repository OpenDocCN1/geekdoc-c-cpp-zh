  md: '# 5.7 Constants


    A constant represents a value that does not change. We can use a variable to store
    a constant, or we can use the constant directly in our expression. Note that a
    variable is a name given to the memory location.

    For example, observe the following expression:


    ```

    3x + 2y = 38

    ```


    Here:


    +   - The values 3, 2, and 38 are constants, and x and y are variables;

    - If you consider the example shown in Figure 5.6, avg is a variable and the value
    35 is a constant assigned to avg.


    There are several types of constants we can use, and in C programming, the constants
    are classified as shown in Figure 5.8.


    # 5.7.1 Integer Constants


    These represent integer values that contain a collection of digits. The following
    points explain the more detailed representation of an integer constant:


    +   - An integer constant must have at least one digit;

    - It must not have a decimal point;

    - It could be either positive or negative;

    - If no sign precedes an integer constant, it is assumed to be positive;

    - No blank spaces are allowed within an integer constant.


    Examples: 435, 76, +98, -43, 789.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_110_0.png)


    FIGURE 5.8

    Constants in C.'
  merge: -1
