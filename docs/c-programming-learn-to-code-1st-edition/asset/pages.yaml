  md: '# C Programming


    # 2.3.1.1 Approach 1


    Given number: $(10011)_2$. The approach is shown in Figure 2.10. It is a three-step
    process:


    +   - Assign a position number to each digit of the given binary number;

    - Multiply the digit with the base to the power of its position number;

    - Add the result to find its decimal equivalent.


    # 2.3.1.2 Approach 2


    To find the decimal equivalent with this approach, we need to remember a formula.
    The formula is built by listing the powers of 2 starting from 0, i.e., $2^0, 2^1,
    2^2, \dots$, and so on. If we write their values, they will be $1, 2, 4, 8, 16,
    \dots$, the number is doubled whenever we write the next term. The term depends
    on the number of digits present in the binary number. For instance, if you want
    to find out the decimal equivalent of $(10011)_2$, then four terms are required,
    because there are four digits present in the binary number, and the terms are
    $1, 2, 4,$ and $8$. Similarly, if the number is $(110101)_2$, then we require
    seven terms and they will be $1, 2, 4, 8, 16, 32, 64$. The term must be assigned
    from the right to the left to correspond to each digit in the binary number.


    The next step with this approach is quite simple. We need to add the terms corresponds
    to 1 to get its decimal equivalent. The terms that are assigned to the digit 0
    will be ignored and do not take part in the decimal calculation. Figure 2.11 shows
    the steps of this approach using an example. The given number is $(10011)_2$.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_48_0.png)


    FIGURE 2.10

    Binary to decimal conversion steps.'
