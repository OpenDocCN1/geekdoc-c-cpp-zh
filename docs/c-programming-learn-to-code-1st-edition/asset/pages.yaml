    FIGURE 8.2

    Categories of control statements.


    Control statements in C are divided into three categories (Figure 8.2):


    +   - Sequence Control Structure: This ensures that the instructions in the program
    are executed in the same order which they appear. As you can see in Figure 8.2a,
    there are nine program statements, and the compiler starts execution from Statement
    1 and continues through Statement 9 without skipping any of the intervening statements.

    - Selection Control Structure: This is also known as decision control structure,
    and ensures the computer makes decisions about which statement is to be executed.
    Figure 8.2b shows the flow of execution. After executing Statement 2, the compiler
    arrives at Statement 3 which is a condition, and if the condition is satisfied
    (true) then it executes Statements 4, 5, and 6, or otherwise it executes 7, 8,
    and 9.

    - Loop Control Structure: This helps the computer to execute group/single statements
    repeatedly until a condition is satisfied. Figure 8.2c shows the flow of execution.
    The compiler executes Statements 4 through 6 repeatedly until the condition becomes
    true, and the moment it is false, it starts its execution from Statement 7 onwards.


    All programs discussed so far come under the sequence control structure. In this
    chapter, we will introduce several programs that reflect the properties of the
    selection and loop control structure. After completing this chapter, the student
    will know the following:


    +   - What different control structures are available in the C language.

    - The syntax of different control structures.

    - Be able to differentiate between sequence and selection control structure.

    - Write code for more realistic problems.

    - What a compound statement is.


    The C language provides several keywords for control structure declaration. We
    classify all those keywords according to our control category. Figure 8.3 shows
    a detailed'
