  md: '# EXAMPLE 4


    Write an algorithm and draw a flowchart to find out the sum of the digits of a
    number. (Hint: suppose the given number is 365, then the sum of the digits is
    3 + 6 + 5 = 14.)


    # Solution


    To solve the above problem, we need three different variables: N, R, and Sum.
    N is used to store the number, and the variable Sum will hold the result of the
    addition. Now the question is how to extract digits from the given number. To
    do that, we will use the remainder operator (%) and divide the given number by
    10. That will provide us with the last digit.


    Initially, we will divide the given number by 10 and store the remainder for calculation.
    We will use the quotient of the division as the input for the next iteration.
    Continue in this way, and we will stop when the quotient becomes 0. We will add
    the remainder collected from each iteration to get the answer. The entire process
    is shown in Figure 3.11. Algorithm 3.7 shows the solution steps, Figure 3.12 shows
    its corresponding flowchart.


    # Algorithm 3.7


    Input: A random number (N)

    Output: Addition result (sum) of all the digits of the given number N


    # ADD-DIGIT


    ```

    1. Start

    2. Read N

    3. Set sum ← 0

    4. while N != 0 do

    5. Set R ← N % 10

    6. Set Sum ← Sum + R

    7. Set N ← N / 10

    8. end while

    9. Print sum

    10. Stop

    ```


    The algorithm requires a number as input, which is N here (Algorithm 3.7, step
    2). The number may constitute one or more digits. This will produce the sum of
    all the digits of N (sum). We initialize the sum to 0 in step 3, later, the algorithm
    extracts the digits one-by-one (using the while loop iterations) from N and adds
    it to the sum. Steps 4 to 8 perform the operation described in Figure 3.11. Every
    iteration proceeds through a condition checking "N!=0." The execution of this
    algorithm stops when the condition becomes false. Initially, step 5 extracts one
    digit from N and assigns it to R (remainder). Step 6 adds the value obtained in
    step 4 to the variable sum, which was previously 0. Finally, step 7 reduces N
    by one digit by dividing the number N by 10. If you analyze these operations,
    you will notice'
