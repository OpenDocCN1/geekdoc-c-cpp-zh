  md: '# 11


    # Pointers


    # 11.1 Introduction


    A pointer is something that indicates or points. From the layman''s point of view
    a pointer is a long-taper stick for indicating objects, as on a chart or a blackboard
    (Figure 11.1). Sometimes we use a laser to point or show an object displayed on
    a screen (Figure 11.1). So, we can say a pointer is indirectly pointing to a device
    of our concerns.


    To understand the way in which pointers operate, it is first necessary to understand
    the concept of direction. You are familiar with this concept from your everyday
    life. For example, suppose you need to buy a new computer for your department.
    In the company that you work for, all purchases are handled by the purchasing
    department. Mr. X in purchasing and ask him to order the new computer for you.
    Mr. X, in turn, call the local supply store to order the computer. This approach
    to obtain your new computer is actually an indirect one because you are not ordering
    the computer directly from the supply store.


    This same notion of indirection applies to the way pointers work in C. A pointer
    provides an indirect mean of accessing the value of a particular data item. In
    programming, a pointer is a variable that represents the location (rather than
    the value) of a data item, such as a variable or array element. Pointers play
    an important role in the development process. A pointer has a number of useful
    applications. For example, pointers can be used to pass information back and forth
    between a function and its reference point. In particular, pointers provide a
    way to return multiple data items from a function via arguments.


