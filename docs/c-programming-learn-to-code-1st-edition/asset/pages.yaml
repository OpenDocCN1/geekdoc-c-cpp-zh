  md: 'Consider the program shown in Figure 15.3. We declare a macro, #define size
    5, where size represents the macroName, 5 represents the macroBody. The program
    is quite simple; it declares an array, stores some numbers in it reading the numbers
    from the console, and finally display those numbers. If you observe the program,
    the variable size is declared at four locations in the program. Due to the concept
    of macro-substitution discussed above, all these locations will be replaced by
    the value 5. Here you can see another important fact: that we have declared an
    array with a variable size (int A[size]), which is generally not allowed. As per
    the discussion in Chapter 9, we must provide an integer to represent the array
    size, though here we are using a variable, and the compiler does not complain
    because the variable size will be replaced with 5 before compilation. That is
    the beauty of macro-substitution.


    # 15.3 Writing Macros with Arguments


    It is possible to write a macro-substitution by providing arguments. The syntax
    is different from the previous one. We need to provide the arguments within a
    bracket followed by the macroName. Wherever the macroName with an argument appears
    inside the program, it is replaced with the macroBody. Figure 15.4 shows the syntax
    of declaring a macro-substitution with arguments.


    Consider the following program shown in Figure 15.5. Here we show the simplest
    macro to find the square of a number. Here Square(a) represents the macroName,
    and a*a represents the macroBody throughout the program. In the program, macroName
    appears once and is replaced with x*x. The corresponding output is shown.


    Let us consider some more programs using macros. The first program swaps two numbers
    (Figure 15.6) and the second program finds the bigger of two numbers (Figure 15.7).


    # 15.3 Removing a Macro


    To remove a macro, we use the #undef preprocessor. The process is simple; we need
    to specify the macro name following the #undef preprocessor. The general syntax
    and an example are shown in Figure 15.8.


    # 15.4 The #include Preprocessor


    If you want to include a file that contains several functions and macros in your
    program, then you can do it with #include preprocessor directives. There are two
    ways to specify the file name you want to include in your program. The general
    form of these two kinds is shown in Figure 15.9. The file name can be specified
    within angle brackets or double quotes, as shown in Figure 15.9a and 15.9b, respectively.
    After specifying the file name, the preprocessor inserts the code present inside
    the file into the current program.


    We have already used this preprocessor directive in all our programs by writing
    #include<stdio.h> as the first line of every program, where stdio.h is the file
    name; it contains the definition of several library functions used in our programs.'
