    processing unit. This process produces an intermediate object file – with the
    extension ".obj", which stands for "object."


    # 4.3.3 Linking


    The first question that comes to most people''s minds is why is linking necessary?
    The main reason is that many compiled languages come with library routines which
    can be added to your program. These routines are written by the manufacturer of
    the compiler to perform a variety of tasks, from input/output to complicated mathematical
    functions. In the case of C standard input and output functions are contained
    in a library (stdio.h), even the most basic program will require a library function.
    After linking, the file extension used is ".exe" which stands for executable file.


    # 4.3.4 Executing


    Thus the editor produces ".c" source files, which go to the compiler, which produces
    ".obj" object files, which go to the linker, which produces ".exe" executable
    files. You can then run ".exe" files.


    # 4.4 Structure of a C Program


    Every C program consists of one or more functions. A function is nothing but a
    group or sequence of C statements that are executed together to perform a specific
    task. Each C program performs a specific task. The entire program will have the
    structure shown in Figure 4.3.


    # 4.4.1 Documentation


    The documentation section consists of a set of comment (remark) lines giving the
    name of the program, the author, and other details the programmer would like to
    use later. Comments may appear anywhere within a program. Such comments are helpful
    in identifying the program''s principal features or in explaining the underlying
    logic of various program features. A single line or multi-line comment may be
    specified in C. For single-line comments, we use a double forward (//) (e.g.,
    // this is a comment). For multi-line comments, we use delimiters starting with
    /* and ending with */ (e.g., /*this is a comment*/). The C89 standard (ANSI C)
    only supports multi-line comments. Later, after the development of the C99 standard,
    the single line comment was also included.


    # 4.4.2 Header Files


    This is also a link section. These statements instruct the compiler to include
    C preprocessors as header files and symbolic constants before compiling the C
    program. Some of the preprocessor statements are:


    ```

    #include<stdio.h>

    #include<conio.h>

    ```'
