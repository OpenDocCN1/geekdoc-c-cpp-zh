  md: '# 3.2 Problem-solving Approach


    A programming problem is always challenging to solve the computer is a power-yet
    fine-minded machine. It can effortlessly tasks, but with a proper accuracy and
    faster than any human being. Suppose a problem is given to us to find out the
    factorial of a number. Any normal human being will require a certain amount of
    time to provide us with the answer, but if you solve the same task using a computer,
    instantly yields the answer. Interestingly a computer cannot do this on its own.
    So we need to describe with proper steps how to find the factorial of a number.
    Because a computer does not know how to find the factorial, but to perform basic
    arithmetic operations like addition, subtraction, multiplication, and division,
    it is the programmer''s job to write the step-by-step instructions that need to
    be followed by the computer to find the required result (the factorial of a number).


    From the above discussion, we can see that we should adequately plan the solution
    for a given problem using problem-solving techniques. A problem-solving method
    is consisted of five phases. Figure 3.2 shows the steps that include all these
    five phases, and we should follow these to solve any given problem.


    +   1. Understanding the problem: Unambiguously describe the problem for easy
    understanding.

    2. Identifying the problem requirement: Identifying the inputs to be given and
    what are the expected output is.

    3. Making a plan of the solution: To design an algorithm and flowchart.

    4. Implement the plan: Convert the algorithm into a program for implementation
    any programming language.

    5. Test and verify: Execute the program and inspect the output.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_64_0.png)


    FIGURE 3.2

    Problem-solving phases.'
