  md: '# C Programming


    +   - A programmer assumes that a primary memory is a collection of blocks, and
    each block is one byte (eight bits) long.


    +   - Every block has an address.


    +   - To store anything, we might need one or more blocks in a contiguous fashion.


    +   - The shaded region in Figure 5.2 shows the allocated blocks.


    +   - Before we store any value, we need to name the block with some identifier
    so that we can access it using its name in the future. Hence, the variables are
    known by their named memory locations.


    Identifiers are names given to program elements, such as variables, functions,
    arrays, structures, and other user-defined objects. The rules applied for variable
    declaration are also applicable for identifiers. All variables can be an identifier,
    but all identifiers may not be a variable.


    > Identifiers are names given to program elements, such as variables, functions,
    arrays, structures, and other user-defined objects.


    We will see more about identifiers in subsequent chapters.


    # 5.5 Data Types


    In the real world, we use different types of data, such as integers, reals, and
    characters. To store data or values, we need variables. In the previous section,
    we saw that before assigning value to a variable, we must allocate some memory
    blocks for it. Now, the question is, how many blocks do we need to store a value?
    That depends on the type of data you are going to store in that variable. Hence,
    we must declare a variable with a data type that instructs the compiler to allocate
    the required number of blocks and give it a name.


    C data type is broadly classified into three groups, as shown in Figure 5.3. In
    this chapter, we will discuss primary data type. Derived data type and user-defined
    data type are discussed as and when needed.


    | Primary Data Type | Derived Data Type | User-Defined Data Type |

    |---|---|--|

    | Character | Array | Typedef |

    | Integer | Pointer | Structure |

    | Float | Function | Enumeration |

    | Double | | |

    | Void | | |


    FIGURE 5.3

    Data types in C.'
