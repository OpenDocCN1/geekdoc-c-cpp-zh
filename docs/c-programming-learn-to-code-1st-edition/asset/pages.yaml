  md: '# Command Line Arguments


    line, it is mandatory to understand this process of program execution. After finishing
    this chapter, the student will know the following:


    +   - How to execute programs without using any specialized GUI editors.

    - What a command line argument is, and how to use them.

    - How to pass parameters through the command line.

    - Learn about argc and argv.


    # 16.2 Execute a Program Using a Command Prompt


    We will proceed step by step. First, we install a compiler, write a program using
    any editor, for instance, notepad, and finally execute the program using a command
    prompt. There are several compilers available to compile C code. Below are the
    most popular ones:


    +   - Turbo C Compiler: The most widely used compiler runs on the Windows operating
    system.

    - The gcc compiler: This is also one of the most popular compilers and runs on
    Linux/Unix systems. The Windows version of this compiler is also available with
    the name minGW and Cygwin.


    For our purpose, we will show the steps to install the minGW compiler on the Windows
    operating system.


    # 16.2.1 Installing the minGW Compiler


    The first step is to download the minGW setup file from the internet. The screenshots
    of each step of the installation procedure is shown in Figure 16.3. Follow the
    below steps to install it on your computer.


    +   - After downloading, double click on the minGW setup file and the first window
    will appear.

    - Click on the install button of ① the first window.

    - Choose your installation directory and the other options available to you in
    the window marked as ② Click on continue.

    - The ③ next window will appear that downloads the required files from the internet.
    An active internet connection is required during this process.

    - After the download completes, click on continue.

    - The ④ window will appear: the minGW installation manager. On that window, mark
    the installation by choosing the appropriate compiler shown in the list.

    - For our case, we choose minGW-gcc-++-bin. Click on the installation menu shown
    in the window ④ and click on the update catalog.

    - Finally, the installer will install the required package to your selected directory.'
