  md: '# # Appendix B: Integer Representation


    # ## B.1 Introduction


    This appendix introduces you to how to represent an integer (positive and negative)
    in a computer. After reading this appendix the student will be able to understand
    negative number representation as well as the addition and substation of numbers
    in two’s complement representation.


    If we want to store nonnegative integers only, then the representation is straightforward.
    Say I want to store +5 to +7 in an eight-bit word. We can simply convert it into
    its equivalent binary as shown below:


    +   - 5 → 00000101

    - 6 → 00000110

    - 7 → 00000111


    But, when it comes to negative number representation, we cannot convert it directly.
    We need some special special technique to represent a negative number in a computer.


    # ## B.2 Representation Type


    There are three ways to represent an integer:


    +   - Sign-magnitude representation;

    - One’s complement representation;

    - Three’s complement representation.


    # ### B.2.1 Sign-magnitude Representation


    With this technique, the most significant bit (leftmost bit) acts as a sign bit.
    When the leftmost bit (sign bit) is “0”, the number is positive and for “1”, the
    number is negative. The remaining bit of the word acts as the magnitude. Figure
    B.1 shows the representation style.


    Figure B.1a shows a four-bit word to represent a number. The leftmost bit $b_3$
    is reserved for the sign and the remaining bits i.e., $b_0$ to $b_y$ is used to
    represent the number. With three bits ($b_0$ to $b_x$) we can represent $2^3 =
    8$ different numbers from 000 (0 in decimal) through 111 (7 in decimal). Figure
    B.1b shows how -5 is represented with'
  merge: -1
