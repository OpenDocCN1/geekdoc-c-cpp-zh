  md: '# Control Structures


    We use an if-else statement to do that. Some instructions depend on program statements.
    We require a condition to do that and others not. During the flow of execution,
    when the compiler encounters this condition, it will decide which set of instructions
    will be executed next. Hence, there will be two paths: one follows the truthfulness
    of the condition, and the other follows its falsity. The remaining statement(s)
    will execute sequentially. The syntax of if-else, with and without compound statements
    and flow of execution is shown in Figure 8.6.


    In Figure 8.6, if the condition is satisfied, the statement after the if is executed,
    the statement following the else is executed. Similarly, if the condition is satisfied,
    the statements present inside the if block are executed, the statement inside
    the else block is executed. The flowchart shows the flow of execution. The flowchart
    shows that if the test expression is evaluated to true, then all the statements
    present inside the body of the if statement are executed, and if it (the test
    expression) is false, then the statement contained in the body of the else part
    is executed.


    Let us take some examples to show the flexibility of using an if-else control
    structure, and how they help in solving real-world problems. We will discuss two
    fundamental programs. The first program is to check whether a number entered by
    the user is zero or nonzero. The second program is to calculate the travel fare
    of a person. The person needs to enter how many kilometers he or she has traveled.


