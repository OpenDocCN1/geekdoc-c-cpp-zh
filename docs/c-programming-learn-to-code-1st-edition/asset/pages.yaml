  md: 'An algorithm is a sequence of unambiguous instructions for solving a problem
    in a finite amount of time.


    According to the programmer''s perspective, we write the algorithm to solve a
    given programming task that can easily be converted into a program statement irrespective
    of any programming language. For example, the job be to add two numbers; then
    how do we write an algorithm for? Following the problem-solving technique, we
    need to analyze and identify the input to our algorithm and what should be the
    output produced by it. In our case, the algorithm needs two numbers, and it will
    provide them as the result. After that, we need to write the step-by-step procedure
    to perform the addition operation. Every step must instruct the computer to do
    something, and upon completion of all the steps, the machine should produce the
    required result. The complete algorithm to solve the addition of two numbers will
    be discussed in the subsequent section.


    # 3.3.1 Characteristics of an Algorithm


    According to [1], every algorithm must conform to the following characteristics:


    +   1. Algorithms are well-ordered: Every solution needs a specific order of execution,
    and so the algorithm must preserve this order in its steps.

    2. Algorithms have unambiguous operations: Every step of an algorithm performs
    a distinct operation and is unambiguous.

    3. Algorithms have effectively computable operations: Suppose we want to write
    steps for a multiplication operation and assume that our computer doesn''t have
    a multiplier unit, then we should not use multiplication symbols in our steps.
    We may use a repetitive addition operation to perform multiplication. That means
    every step in the algorithm contains an action that is possible to do.

    4. Algorithms produce a result: This is evident because we are writing an algorithm
    that processes inputs to produce an output.

    5. Algorithms stop after a finite amount of time: Every algorithm eventually stops
    execution after it produces an output.


    Every algorithm must satisfy the following criteria:


    +   1. Finiteness: This implies that the algorithm must have a finite number of
    steps.

    2. Definiteness: Each step must be clear and unambiguous.

    3. Input: An algorithm must receive some inputs for its operation.

    4. Output: At least one output must be produced from the algorithm.

    5. Effectiveness: This implies that all the operations involved in an algorithm
    must be sufficiently basic in nature so to be carried out manually in a finite
    interval of time.'
