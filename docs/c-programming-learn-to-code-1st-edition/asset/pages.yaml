  md: '# File Handling


    As we know, "console" means the input and output devices connected to our computer.
    When we write code to read content through an input device and display it on the
    output device, we call console I/O. When we do the same with files, we call it
    file I/O.


    # 14.2 Basics of File I/O


    This section introduces the file system and the steps we follow to process files.
    We begin with what a file is and gradually show you how to process files using
    the I/O functions available to us.


    # 14.2.1 What is a File?


    In C, a file refers to a disk file that stores some information in textual form
    and is sometimes referred to as a data file. We can create a data file, write
    some information to it, store it in an appropriate place, and in the future access
    it to read/write or update the information present in it.


    > In C, a file refers to a disk file that stores some information in textual form
    and which is sometimes referred to as a data file.


    A file is of two types: (1) stream-oriented data files and (2) system-oriented
    data files. System-oriented data files are file system or low-level files which
    are difficult to manage. In this chapter, we will concentrate on stream-oriented
    files. Stream-oriented data files are again divided into two types: (1) text files
    and (2) unformatted data files. Text files store the information either as characters
    or numbers. The C language provides several library functions to read/write the
    information, character by character, from these files. The other option is to
    read/write stringwise. Unformatted data files store the information in the form
    of continuous blocks. Specialized data structures and functions are required to
    store and retrieve information from this type. Data structures, like arrays and
    arrays of structures, will be used to store data inside this type (see Figure
    14.3).


    # 14.2.2 File Handling Process Flow


    Before performing any operation on a file, the file must be loaded into the memory
    first. Loading the file from the hard disk to the memory is known as opening the
    file. There are several ways to open a file. After opening, we perform operations
    on it as per our requirements; finally close the file. Closing reloading the file
    onto the disk it came from. So, the process flow comprises three tasks:


    +   1. Opening a file;

    2. Perform operations like read/write;

    3. Close the file.'
