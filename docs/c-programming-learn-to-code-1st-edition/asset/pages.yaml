  md: 'memory as and when required. This process of allocating memory at run time
    is called dynamic memory allocation.


    This chapter introduces the concept of dynamic memory allocation in C. Until now,
    we have written programs, all of which used static allocation. C provides different
    functions that help us in allocating memory dynamically. After finishing this
    chapter, the student will have learnt the following:


    +   - Be able to define dynamic memory allocation and differentiate from static
    allocations;

    - Be able to explain different functions provided by C for dynamic memory allocation,
    like malloc(), calloc(), realloc(), and free().


    # 13.1.1 Process of Memory Allocation


    Before we can understand dynamic memory allocation, we need to know how the memory
    allocation process is carried out in the C language. The memory as a whole is
    divided into four segments:


    +   - Text;

    - Data;

    - Stack;

    - Heap.


    The organizations of these segments are conceptually shown in Figure 13.2.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_374_0.png)


    FIGURE 13.2 Organization of memory.'
