    \ for a problem involves a two-way journey: first we decompose the problem from\
    \ top to bottom, and then we solve it from bottom to top.\n\nDesigning recursive\
    \ functions: All recursive functions have two elements: each call either solves\
    \ one part of the problem or reduces the size of the problem. The recursive solution\
    \ to factorial is shown below. This program does not need a loop: the concept\
    \ itself involves repetition.\n\n# PROGRAM 9.10: FACTORIAL OF A NUMBER USING A\
    \ RECURSIVE FUNCTION\n\n```\n#include <stdio.h>\nint factorial(int n)\n{\n   \
