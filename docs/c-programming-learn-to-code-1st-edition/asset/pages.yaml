    # 10.7 Character Arrays: Strings


    Whenever we store integer elements in an array, we call it an integer array. In
    the same manner, the collection of a character array is known as a string. We
    use strings to manipulate or process different words and sentences.Generally,
    a string is treated as variable-length data. For example, consider the name of
    a person. By nature, the names of persons vary from their length. A string is
    a 1D array of characters that is terminated by an escape sequence known as a NULL
    ("\0") character (i.e., to mark the end of the string, C uses the "\0" character).


    > A string is a 1D array of characters that is terminated by an escape sequence
    known as a NULL ("\0") character.


    +   * Strings in C are enclosed within double quotes. Example: "C Programming
    Language"

    * The string is stored in memory as ASCII codes of the characters that make up
    the string, appended with 0 (ASCII value of "\0")

    * Normally each character of the string takes one byte by memory.

    * Figure 10.21 shows you the difference between the character stored in memory
    and the one-character string stored in memory. The character requires only one
    memory location, but the one-character string requires two memory locations.


    # 10.7.1 Declaration of a String


    A string can be declared like a 1D array. The syntax of declaring a string and
    an example is shown in Figure 10.22.


    # 10.7.2 Initialization of a String


    We initialize a string in two ways. One way is to use the traditional initialization
    process as for a 1D array with an extra character "\0" appended at the end. One
    such example


