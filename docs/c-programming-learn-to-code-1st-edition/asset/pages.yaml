  md: '# 16.3 Fundamentals of the Command Line Argument


    In Section 16.1.1, we saw the process of executing a program using an IDE: Code
    Block. As we need to click on different buttons (such as compile or run) to execute
    our program, we can say the program is quite user-friendly and straightforward.
    But using this technique of executing the program does not allow us to provide
    arguments through the command line. But the second method that we discussed in
    Section 16.2 allows us to give arguments through the command prompt. Why? Because
    we use commands to execute the program and hence while writing the command on
    a command prompt, we can supply the argument too.


    Now the question is, where exactly is the argument given? Figure 16.5 shows the
    place where the arguments are supplied. As can be, when we want to execute the
    output file (output.exe), we can give the argument after typing the output name
    (shown as the dashed line in the figure). The next thing we need to know is what
    should we supply as an argument, and after providing it, who will receive it,
    and finally, what will it do with it?


    The argument is actually supplied to the main() function of our program. Until
    now, whatever program we have discussed, we have never supplied any argument inside
    the main() function. But, the main() function can take arguments. When we supply
    the argument at the command prompt, the main() function receives it and starts
    the process. In the next section, we will discuss how the main function receives
    the argument. Figure 16.6 shows a step-by-step description of how to supply command
    line arguments to the main() function.


    ```

    C:\windows\system32\cmd.exe

    Microsoft Windows [Version 10.0.17763.1]

    (C) 2018 Microsoft Corporation. All rights reserved.

    C:\Users\Sisir>D:

    D:\cd CProgram

    D:\CProgram>

    D:\CProgram>g++ testing.c -o output.exe

    D:\CProgram>output

    C Programming Learn to Code

    D:\CProgram>

    ```


    > In this line, we are compiling testing.c and producing the output file


    > In this line, we will supply the argument (represented as a dashed line)


    FIGURE 16.5

    Supplying arguments.'
