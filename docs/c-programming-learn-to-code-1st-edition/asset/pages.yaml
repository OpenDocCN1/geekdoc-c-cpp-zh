  md: '# # 2n Number Systems


    # ## 2.1 Introduction


    This chapter introduces several number systems used by computer systems. Readers
    can skip this chapter if they already [are] already familiar with this topic.
    The content of this chapter will help a programmer to understand several concepts
    that appear in future chapters. So if you are a beginner and learning this subject
    for the first time, I recommend reading the entire chapter thoroughly. After completing
    this chapter, the reader will know the following:


    +   1. The various types of number systems that a computer uses to perform computations;

    2. Conversion among number systems.


    In our day-to-day life, we use different symbols, numbers, characters, and so
    on. Where a numbering system is concerned, we are familiar with the decimal number
    system, which uses ten different digits (0, 1, 2, ..., 9) to represent a number.
    But, a computer system understands only two digits: either 0 or 1. When we make
    a number with these two digits we call it binary number. Other number systems
    also exist, and we classify them as shown in Figure 2.1. This chapter will introduce
    number systems and will show you how to convert a number from one type to another.


    # ## 2.1.1 Non-positional Number Systems


    In former times, humans counted on their fingers. When ten fingers were not adequate,
    stones, pebbles, and sticks were used to indicate the values. This type of counting
    is known as a non-positional number system.


    # ## 2.1.2 Positional Number Systems


    In a positional system, every digit holds a position inside the number. For example,
    consider the decimal number 387, where 7 belongs to 0th place, 8 is in 1st place,
    and 3 is in 2nd place. Not only the position but also its type and base matter.
    In general, each digit of a number is determined by its factors:


    +   1. The digit itself,

    2. The position of the digit in the number;

    3. The base of the number system.'
