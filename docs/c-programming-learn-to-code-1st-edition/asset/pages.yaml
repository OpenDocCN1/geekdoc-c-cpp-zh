    # 1.5.8 Solid State Drive


    1.9 shows a typical SSD and its block diagram [5–7]. An SSD uses solid-state memory
    to store data. The main component of an SSD is the NAND flash memory, a controller,
    a RAM, and a host interface. Figure 19.9b shows the organization of these components
    and their communication path. The NAND flash memory, sometimes called flash memory,
    is a non-volatile semiconductor device used to store data. There are several so-called
    blocks, consisting of 64 to 128 pages, to record user data. These are further
    subdivided into subpages, which is equal to the typical size of a sector. Each
    subpage also has two areas: a data area and a spare area. The data area stores
    the user’s data, and the spare area stores management information, such as bad
    sectors and error correction codes. Flash memories are arranged in the form of
    a package sharing an eight-bit-wide common input/output (I/O) bus. The host interface
    provides the connection to the host interfaces such as a serial advanced technology
    attachment (SATA), a parallel advanced technology attachment (PATA), or a universal
    serial bus (USB). The SSD controller handles the read/write request coming from
    the user with the help of a RAM – a temporary buffer. The RAM buffers the data
    through a read/write request before actually reading/writing from the flash memory.


