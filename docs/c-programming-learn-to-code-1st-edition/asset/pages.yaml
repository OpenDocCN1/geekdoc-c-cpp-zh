    +   1. Every algorithm begins with a "start" step and ends with a "stop" step.

    2. Before writing the algorithm, we must identify its input(s) and output(s),
    which are later used by our C code.

    3. We should write the algorithm in such a manner that we can easily convert it
    into its corresponding program statements.


    # 3.5 Flowcharts


    A flowchart is a kind of diagram that represents the process flow or the sequence
    of operations needed to solve a given problem. It provides a more straightforward
    method to understand how the data flows through the solution steps and produces
    an output. The symbols used in the flowchart are simple and easy to learn. A programmer
    always prefers to draw a flowchart before writing a computer program. But there
    are several definitions that describe a flowchart, but we will provide you with
    the programmer''s view.


    > A flowchart is a structured approach to represent the solution steps outlined
    in an algorithm with the help of simple and easy-to-learn symbols that show how
    the input(s) is/are processed through the system and produces the output(s).


    # 3.5.1 Advantages of Using a Flowchart


    +   1. Easier to understand the program logic: It provides a better way to understand
    the program logic.'
