  md: '# Control Structures


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_185_0.png)


    FIGURE 8.10

    Sections of a loop.


    +   1. **Loop initialization**: Initialization must be done before the first execution
    of the loop body. The initialization statement of a loop is always executed once.

    2. **Loop update**: The stopping condition of a loop can only be achieved by loop
    updating. A loop update is a statement inside the loop body that updates in each
    iteration and changes the stopping condition from true to false.

    3. **Stopping condition**: This is a condition that controls the loop for execution.
    The whole body of the loop will be executed until the stopping condition becomes
    false.


    # 8.10 while Loops


    A while loop is a control flow statement that allows code to be executed repeatedly
    based on a given condition.


    +   * The while construct consists of a block of code and a condition.

    * The condition is first evaluated – if the condition is true the code within
    the block is then executed.

    * This repeats until the condition becomes false (while loops check the condition
    before the block is executed).

    * The while loop is often called a pre-test loop or entry-controlled loop.


    The syntax of the while loop is shown in Figure 8.11.

    Suppose you want to print your name ten times, then one way to solve this problem
    is to use 10 `printf()` statements which will print your name. But this type of
    problem can be solved easily by a while loop.'
