  md: '# Constants, Variables, and Data Types


    # 5.4 Variables and Identifiers


    Variables in C are the named memory locations where we can store values, and these
    values vary or change during program execution. These memory locations (variables)
    can store integers, characters, and real values. When we store some value in the
    variable, the previous value (if present) will be deleted.


    Variables are named memory locations where we store a value.


    Rules for constructing a variable name:


    +   1. A variable name can be any combination of digits, characters, or underscores.
    The first character in the variable name must be alphabetic.

    2. No commas or blank spaces are allowed within a variable name.

    3. A variable name should not be a keyword.

    4. We cannot use special symbols other than underscores (_) in a variable name.

    5. Upper case and lower case are significant, e.g., the variable Var is not the
    same as var OR.


    Table 5.3 shows some valid and invalid variable names.

    What is a named memory location? As we know, every computer has a primary memory,
    and before executing a program, we must allocate space for every variable present
    in our program. From the programmer''s view, a primary memory looks as shown in
    Figure 5.2.


    # TABLE 5.3

    Valid and Invalid Variable Names


    | Valid | Invalid |

    |---|---||

    | a | Basic Salary | Space is not allowed between variable names |

    | Total | 2age | A variable name should not start with a number |

    | Basic_salary | void | This is a keyword |

    | age1 | sal# | No special characters allowed other than underscore |

    | sal | default | This is a keyword. |


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_103_0.png)


    FIGURE 5.2

    A memory segment (Programmer''s View).'
