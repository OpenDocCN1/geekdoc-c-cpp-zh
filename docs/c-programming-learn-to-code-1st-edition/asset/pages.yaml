  md: '# Constants, Variables, and Data Types


    # 5.5.1 Primary Data Types


    These are also known as basic data types, predefined, and previously known to
    the compiler. We use some keywords to represent these data types. Table 5.4 shows
    these data types, and their corresponding keywords.


    We use these keywords to declare variables when we want to store values. Each
    primary data type conveys two crucial pieces of information:


    +   1. It defines the type of data the user wants to store in these variables;


    +   2. It instructs the compiler to allocate the required amount of space to store
    these values.


    The amount of space allocated for each data type is different from others and
    depends on the platform you are using. For instance, if you are using the keyword
    "char" to declare a variable, then that variable consumes one byte (eight bits)
    of storage space in memory, and we can store a single character in it. The C programming
    language has an operator known as sizeof, and we can use it to know the exact
    amount of memory allocation in bytes. In the following section, I will explain
    each primary data type in detail and use them to allocate and assign values.


    # 5.5.2 Integer Data Types


    Integers are numbers with a machine-dependent range of values. We use the integer
    data type to declare variables that can store integers, either positive or negative,
    with no fractional component. Table 5.5 shows some examples of integer numbers
    and numbers which are not integers.


