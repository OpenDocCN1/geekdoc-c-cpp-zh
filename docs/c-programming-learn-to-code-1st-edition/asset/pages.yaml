  md: '# 6.9 Special Operators


    Besides the operators described above, C supports some special operators that
    include the following. These operators have several uses, and we will discuss
    them with examples that describe the characteristics of these operators.


    +   1. Comma operator;

    2. sizeof() operator;

    3. & *;

    4. -> (arrow) and (Dot).


    In this section we will discuss the comma operator and the sizeof operator. Other
    operators will be discussed whenever there is a need for them.


    # 6.9.1 The Comma Operator


    The comma operator permits two different expressions to appear in situations where
    only one operation is ordinarily used. Com separated operands can be chained together
    and evaluated in a left-to-right sequence with the right-most value yielding the
    result of the expression. Let us see this with an example (Figure 6.26).


    As discussed above, the execution of a comma-separated operator will start from
    the left; the rightmost value yields the result. In Example 1, when line number
    2 is executed it assigns 10 to a and 20 to b. The statement a+b is executed and
    the result, which is 30, is assigned to c. Similarly, in Example 2 when line number
    2 is executed, the swapping occurs by assigning a to c, b to a, and c to b. A
    glass analogy is shown in Figure 6.27 to illustrate how swapping occurs.


    A comma operator is used to separate the variable names during the declaration,
    and also used in a for loop. We will discuss the for loop in Chapter 8.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_136_0.png)


    FIGURE 6.26

    Example showing the use of a comma operator.'
