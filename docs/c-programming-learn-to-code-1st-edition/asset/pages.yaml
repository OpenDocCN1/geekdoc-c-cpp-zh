  md: 'Appendix B


    # B.2.3 Two''s Complement Representation


    With this technique the most significant bit (leftmost bit) acts as a sign bit.
    When the left-most bit (sign bit) is “0”, the number is positive, and for “1”,
    the number is negative. The remaining bit of the word is used to represent the
    actual number. Figure B.4 shows the representation style.


    Figure B.4 shows a four-bit word to represent a number. The leftmost bit ($b_3$)
    is reserved for the sign bit and the remaining bits i.e., from $b_0$ to $b_2$
    are used to represent the number.


    +   * To represent a positive number, we simply convert it to its equivalent binary
    number.

    * To represent a negative number, we first convert the number to its binary form
    and then apply two''s complement.

    * To find two''s complement; we add 1 to the one''s complement of that number.


    Figure B.4b shows the representation of −5. First, we find the binary equivalent
    of 5 is 0101 in four bits. Then we flip the bits (1 to 0 and 0 to 1) to get the
    one''s complement, i.e., 1010. Finally, we add 1 to the one''s complement to get
    the resultant two''s complement which is 1011. Here, −5 is represented as 1011
    in two''s complement representation. Figure B.4c shows the complete range of numbers
    that can be represented with four bits using two''s complement representation.
    The complete range is -8 to +7 with a single representation of 0s. In general,
    if an $n$-bit word is given, the range will vary from $-(2^{n-1})$ to $(2^{n-1}-1)$.


    # Q&A


    +   1. With 16 bits, find the range of numbers that can be represented using two’s
    complement-representation.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_445_0.png)


    FIGURE B.4

    Two''s complement representation.'
