    According to [4], a simple digital computer should have five essential parts:
    (1) memory, (2) Arithmetic Logic Unit (ALU), (3) Control Unit (CU), (4) input
    devices, and (5) output devices. Among these components, the ALU and CU belong
    to the CPU. The CU of the CPU plays a significant role in executing the user''s
    task. The CU controls the overall activity of the computer system and manages
    communication among the other components. To understand the overall execution
    of a task, look at Figure 1.5, which shows the basic organization of these components.
    The description of each component is given below.


    # 1.4.1 Input Devices


    This unit helps in supplying data and instruction to the computer system. For
    example, if we wish to instruct the computer to play a song, then we search for
    a particular song and click the button using the mouse. In this scenario, the
    mouse acts as the input unit.


    Similarly, if we wish to write a computer program, we use the keyboard as our
    input device. There are several input devices connected to our computer through
    which we give commands: mouse, keyboard, joysticks, and others.


    > An input device reads data or instructions from the user and sends it to the
    computer system for further processing.'
