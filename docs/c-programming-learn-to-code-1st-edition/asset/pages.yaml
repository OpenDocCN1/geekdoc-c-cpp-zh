    # 11.3 Pointer Variables


    A pointer:


    +   - Is a special type of variable;

    - It stores the address of another variable rather than the value;

    - The data type of the pointer variable is the same as the data type of the variable
    to which it points.


    # 11.3.1 Declaration of Pointer Variables


    When a pointer is declared, the user must know the type of the variable to which
    the pointer is going to. Declaration of the pointer is the same as variable declaration,
    the only difference is the variable name must be followed by an asterisk (*).
    The asterisk indicates that the variable is a pointer variable. Figure 11.3 shows
    the syntax of declaring a pointer and its component.


    Examples:


    ```

    int *ptr;               /* *ptr is a pointer to an integer, which means it can
    only store the address of an integer */

    float *fptr;            /* *fptr is a pointer to a float, which means it can only
    store the address of a float */

    char *cptr;             /* *cptr is a pointer to a character, which means it can
    only store the address of a character */

    ```


    # 11.3.2 Working with Pointers


    In Section 11.2, we saw the address of (&) operator for getting the variable’s
    address. Now we know that a pointer is a special type of variable that can store
    another variable’s address. So, by using the address of (&) operator, we can easily
    store another variable’s address in a pointer variable. Program 11.2 shows the
    process of doing it:'
