    The machine cannot directly execute an assembly language program as it is not
    in binary form. In some way, it should be transferred to binary form (i.e., machine
    language), which is done by an assembler.


    An assembler is a program that translates an assembly language program into a
    machine language program. A program written in assembly language is called source
    code. The assembler converts the source program into a machine-language program
    known as object code (Figure 3.13).


    # Advantages


    +   1. Easy to use and easier to understand as compared to machine-level language;

    2. Easy to locate errors and correct them;

    3. Assembly language has the same execution efficiency as machine-level language
    because it is a one-to-one translator between the assembly language program and
    its corresponding machine language program.


    # Disadvantages


    +   1. One of the significant drawbacks that assembly language is machine-dependent.
    A program written for one computer might not run on other machines with different
    hardware configurations.

    2. A conversion program is needed to convert the assembly language program to
    a machine language program.


