    conio.h to the current program. Then the compilation begins.


    # 4.4.3 Global Variables


    There are some variables that are used in more than one function. Such variables
    are called global variables and are declared in the global declaration section
    that is outside of all the functions.


    # 4.4.4 main() Function


    Each and every C program should contain only main() function. Execution starts
    with this main() function. The function should be written in small case (lower
    case) letters, and not be terminated by a semicolon. main() executes user-defined
    program statements, library functions, and user-defined functions. All these statements
    should be enclosed within left and curly braces


    The body of the main() contains two parts, the declaration part and executable
    part. The declaration part declares all the variables in the executable part.
    There is at least one statement in the executable part. These two parts must appear
    between the opening and closing curly braces ([and]). The program execution begins
    at the opening brace and ends at the closing brace. The closing brace of the main
    function section is the logical end of the program. All statements in the declaration
    and executable parts end with a semicolon;.'
