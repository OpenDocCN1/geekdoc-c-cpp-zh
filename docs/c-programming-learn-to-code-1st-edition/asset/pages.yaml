  md: "# Number Systems\n\ninteger numbers only. To describe the process, we need\
    \ to represent a given number (any base) with the following notation:\n\n$$(d_k\
    \ d_{k-1}\\dots d_3 d_2 d_1)_b$\n\nwhere,\n$d_i$ represents a digit in the given\
    \ number, and $i$ ranges from 1 to $k$;\n$b$ represents the base of the given\
    \ number.\n\nThe digits of the given number are assigned by its position number\
    \ starting with 0 from right to left. That means the position $0, 1, 2, \\dots,\
    \ n-1$ is assigned to $d_1, d_2, d_3, \\dots, d_n$ respectively. To calculate\
    \ the decimal equivalent, each digit ($d_i$) of the given number should be multiplied\
    \ by its base to the power of its position:\n\n$$$d_k \times b^{k-1} + d_{k-1}\
    \ \times b^{k-2} + \\dots + d_3 \times b^2 + d_2 \times b^1 + d_1 \times b^0$$\n\
    \nPerforming the above operation, we can find its corresponding decimal equivalent:\n\
    \n$$(d_m d_{m-1}\\dots d_3 d_2 d_1)_{10}$\n\nwhere,\n$d_i$ represents a digit\
    \ in the given decimal number, and $i$ ranges from 1 to $m$;\n10 represents the\
    \ base of the given number, $b = 10$.\n\nFigure 2.9 shows the entire conversion\
    \ process.\n\n# 2.3 Number Conversion\n\nIt is essential to know the conversion\
    \ of numbers from one base to another. We know that computers only understand\
    \ binary numbers, and what we know are decimal numbers. Hexadecimal numbers are\
    \ used to represent everything in a compact format so that it is easy to express\
    \ and is more readable. As programmers, we need to know the details of conversion\
    \ among these numbers. In this section we will follow the question–answer pattern\
    \ to show each conversion. A description is given where necessary.\n\n# 2.3.1\
    \ Binary to Decimal\n\nThere are two approaches to converting binary to decimal.\
    \ The first method has already been discussed in Section 2.2.2. With this method,\
    \ we will assign a position number to each digit starting from 0, right to left.\
    \ Then, we multiply the digit with the power of its position number. Finally,\
    \ we add all the results obtained in the last step to get its decimal equivalent.\
    \ The second approach is a shortcut method to obtain the decimal equivalent. We\
    \ will discuss both these approaches using appropriate examples."
