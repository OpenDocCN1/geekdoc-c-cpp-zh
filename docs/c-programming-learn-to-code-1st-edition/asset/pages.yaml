  md: '# 11.7.1 Pointers to Constants


    When a pointer is not able to change the value of a variable to which it points,
    it is known as a pointer to a constant. Suppose a pointer p points to an integer
    variable x, but p cannot change the value of x, then p is called a pointer to
    a constant.

    The declaration of pointers to constants takes the following:


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_296_0.png)


    Let us take an example:


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_296_1.png)


    Program 11.13 (a) will not show any error. The first printf() statement will print
    5, because we are printing the value at address p (*p), and p contains the address
    of x. The second printf() statement will print 6, because the previous line x=x+1
    will increment the value of x. However, Program 11.13 (b) will show an error.
    This is, because *p=*p+1 we are trying to modify the content of x through p, which
    is not allowed.


    # 11.8 Pointer Arithmetic


    Pointer arithmetic refers to the different arithmetic operations that can be applied
    on pointers. A limited number of arithmetic operations can be performed on pointers.
    The number of bytes by a pointer can access in memory depends on the type of variable
    it points to. For example, a pointer to an integer accesses four bytes of memory,
    a pointer to a character accesses one byte of memory, and so on. Some of the operations
    that are applied to pointer variables are:


    +   - Increment and decrement;

    - Addition and subtraction;'
