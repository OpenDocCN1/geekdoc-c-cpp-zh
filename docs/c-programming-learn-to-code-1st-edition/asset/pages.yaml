  md: '# Structures and Unions


    # 12.12.1 Size of Unions and Structures


    As we know, the size of a structure is the sum of the size of all the members
    present in the structure. But the size of a union is equivalent to the largest
    member of the union. Figure 12.24 shows the size difference between a union and
    a structure.


    # 12.12.2 Sharing Memory and Member Accessing


    With a union, at one instance of time, we can access only one member because the
    union allocates memory space for the largest member. Other members can only share
    it from time to time. That at one instance of time, only one member is available
    in the memory. For example, let''s say there are three members in a family, but
    they have only one chair. So at any instance, only one member can sit on it. The
    analogy is shown in Figure 12.25.


    With a structure, memory is allocated for all the members. For example, at any
