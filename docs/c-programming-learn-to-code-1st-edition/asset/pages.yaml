  md: '# Organization of this Book


    Learn any programming language, we require a basic knowledge of computer fundamentals
    and number systems – covered in Chapters 1 and 2. Overall, the book contains 16
    chapters organized so that an individual (beginner, intermediate programmer, or
    expert) will gain maximum benefit if they follow them sequentially.


    As mentioned, Chapter 1 provides a brief overview of a computer system''s fundamental
    components: input, output, memory, and processing devices. It also introduces
    the overall functions of an operating system that a programmer should know. Chapter
    2 describes number systems, their types, and their conversion. Anyone knowing
    computer fundamentals can skip these first two chapters. A programmer should know
    how to find a solution to a given problem. Two primary components in solving a
    problem Chapter 4 introduces C language starting with its history and standards
    (e.g., C89, C99, C11). A detailed description of the C program structure and how
    to execute it in different environments is explained in this chapter.


    Chapter 5 introduces tokens such as constants, variables, and data types. The
    C language has a rich set of operators which are described in Chapter 6. The chapter
    explains expressions and how to execute them according to the operator''s precedence
    and associativity. Chapter 7 introduces input/output functions that a programmer
    uses to read inputs from the user and produces on the screen. Chapter 8 describes
    control statements that include all decision-making and looping constructs. The
    concept of modular programming through functions is introduced in Chapter 9. The
    power of a function allows a programmer to divide a more significant problem into
    smaller subtasks and execute them by calling them when necessary. In Chapter 10,
    arrays and strings are explained to provide insight into storing sequentially
    retrieving information. Chapter 11 explains pointers. The pointer concept is a
    vital part of the language and provides a mechanism to access memory content dynamically.
    It also enhances the language''s features to support data structure. Chapter 12
    discusses several concepts such as structure, union, bit fields, and enumerations.
    All these concepts are unique to the C language and enhance its characteristics.
    Chapter 13 addresses memory allocation used to allocate memory dynamically and
    optimize memory usage. Permanently storing information on a file and manipulating
    it is a required feature for any programming language. In Chapter 14, we explore
    the concept of function handling in C. Other miscellaneous concepts such as the
    preprocessor and command-line arguments are described in Chapters 15 onwards.


    This book includes more than 270 illustrations to explain the features of the
    C language. Every chapter begins with a discussion of a real-life scenario to
    explain the importance of that chapter, before describing the mechanisms supported
    by C to tackle that issue. All the fundamental concepts of C are covered with
    pleasing and feature-rich examples.


    Suggestions to improve the content are always welcome. We request all our readers
    to send their findings, errors, comments, views, and feedback to make it a better
    book in this field. Please send your suggestions to: siriitg@gmail.com.'
