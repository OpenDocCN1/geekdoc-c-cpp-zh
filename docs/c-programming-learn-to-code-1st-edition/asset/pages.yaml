    # 10.7.3 Reading a String


    To read anything from the user requires a scanf() function. Reading a string,
    we can also use the same function. But there is a problem since the scanf() function
    can be used to take input from the user, a white space character delimits it.
    That means whenever input is done, scanf() recognizes a sequence of characters,
    and whenever space is encountered, it will stop.


    # 10.7.3.1 Disadvantages of the scanf () Function


    As discussed above, a scanf() function only reads characters in a sequence until
    and unless whitespace is encountered. But, in general, most strings have whitespace
    in them. For example, if we consider a name, we is a collection of words, and
    to separate the words we need spaces. So the disadvantage of using scanf() is
    that it will read only the first word of your name and ignore the remaining word(s).'
