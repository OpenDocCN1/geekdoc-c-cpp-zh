    # 3.7.2 High-level Languages


    According to the above discussion, assembly languages and machine-level languages
    require in-depth knowledge of computer hardware, and both languages are machine-dependent.
    A high-level language enables the programmer to concentrate on program logic rather
    than computer hardware.'
