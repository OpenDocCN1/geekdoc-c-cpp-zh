  md: '# PROGRAM 11.28


    ```

    1. #include<stdio.h>

    2. int Single(int *x, int N)

    3. {

    4.     static int sum=0, i;

    5.     for(i=0;i<N;i++)

    6.     {

    7.         sum=sum+x[i];

    8.     }

    9.     return sum;

    10. }

    11. void main()

    12. {

    13.     int A[100], R, n, i;

    14.     printf("Enter how many elements you want: ");\n15.     scanf("%d", &n);

    16.     printf("Enter %d elements: ", n);\n17.     for(i=0;i<n;i++)

    18.     scanf("%d", &A[i]);

    19.     R=Single(A, n);

    20.     printf("Sum of array elements: %d", R);

    21. }

    ```


    Output:


    Enter how many elements you want: 3

    Enterter three elements: 34 128 325

    Sum of array elements: 487


    Explanation:


    Line 19 calls the function by passing A and n as the arguments. We know that A
    contains the first address of the array elements. We can also write the same line
    as: R=Single(&A[0], n); Here &A[0] also represents the first address. Line 2 declares
    a pointer to x to receive the address. We can declare this as: int x[]. After
    storing the first address, the pointer variable x can now point to the actual
    array and easily access its content by sequentially traversing through the array.


    This type of problem-solving approach requires less overhead and is more flexible.
    Therefore, to pass an array we should always follow the concept of the pass by
    reference method. For greater understanding let us write another program.'
