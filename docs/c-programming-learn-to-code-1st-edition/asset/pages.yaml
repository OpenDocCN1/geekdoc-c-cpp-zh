  md: "made to the formal arguments in the called function have no effect on the values\
    \ of actual arguments in the calling function. The following program illustrates\
    \ “pass by value.\"\n\n```\n#include<stdio.h>\nvoid display(int p)\n{\n    p=p+10;\n\
    \    printf(\"nInside Function: %d\",p);\n}\nvoid main()\n{\n    int x=25;\n \
    \   display(x);\n    printf(\"nInside Main: %d\",x);\n}\n```\n\nIn this program,\
    \ I have passed the value of x to the function display(), which receives that\
    \ through a variable p. Inside the display function value of p is increased by\
    \ 10 which does not affect the value of x in the function, because both variables\
    \ have a different scope. The whole process of control flow is shown in Figure\
    \ 11.13, and the output of this program is:\n\nInside Function: 35\nInside Main:\
    \ 25\n\nNow by examining the pass by value concept we may conclude that both variables\
    \ (p and x) have different scopes so any changes made to one variable do not affect\
    \ the other variable. Now let us see in the case of pass by reference what will\
    \ happen.\n\n# 11.9.2 Pass by Reference or Address\n\nIn this method, the “address”\
    \ of the actual arguments (in the calling function) is copied into the corresponding\
    \ formal arguments (the parameters in the called function). Hence, the changes\
    \ made to the formal arguments in the called function affect the values of the\
    \ actual arguments in the calling function.\n\n```\n#include<stdio.h>\nvoid display(int\
    \ *p)\n{\n    *p=*p+10;\n    printf(\"nInside Function: %d\",*p);\n}\n```"
