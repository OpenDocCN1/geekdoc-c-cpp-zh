  md: "# 6\nOperators and Expressions\n\n 6.1 Introduction\nThis chapter will discuss\
    \ the two most essential parts of any programming language: operators and expressions.\
    \ An operator is a symbol that tells the computer to perform specific mathematical\
    \ or logical operations. Operators are used in programs to manipulate data and\
    \ variables. C is very rich in built-in operators.\n\n| An operator is a symbol\
    \ that tells the computer to perform specific mathematical or logical operations.\
    \ |\n\nOperators can be either binary or unary. Binary operators are the operators\
    \ where one operator will act upon two operands.\nFor example:\n\n```\n12+14\n\
    ```\n\nIn this example, the operator + is acted upon two operands 12 and 14. Hence\
    \ + is a binary operator here. Similarly, a unary operator has one operator and\
    \ one operand.\nFor example:\n\n```\n-25\n```\n\nIn this example, the operator\
    \ – is acted upon one operand 25. Hence – is a unary operator here.\nThe following\
    \ are the operators used in C. These operators may be used as binary or unary\
    \ operators.\n\n+   1. Arithmetic operators;\n2. Relational operators;\n3. Assignment\
    \ operators;\n4. Logical operators;\n5. Increment or decrement operators;\n6.\
    \ Conditional operators;"
  merge: -1
