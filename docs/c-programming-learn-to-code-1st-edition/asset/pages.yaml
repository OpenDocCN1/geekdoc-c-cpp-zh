  md: '# Functions


    Unlike auto variables, static variables are also local to the block in which they
    are declared. The difference between them is that static variables don''t disappear
    when the function is no longer active. Their values persist. If control comes
    back to the same function again the static variables have the same values they
    had last time.


    In the example, when x is auto, each time increment () is called it is reinitialized
    to 1 (one). When the function terminates, x vanishes and its new value of 2 is
    lost. The result: no matter how many times we call increment (), x is initialized
    to 1 every time.


    On the other hand, if x is static, it is initialized to 1 only once. It is never
    initialized again. During the first call to increment (), x is incremented to
    2. Because x is static, this persists. The next time increment () is called, x
    is not reinitialized to 1; on the contrary its old value 2 is still available.
    This current value of x (i.e., 2) gets printed and then x = x+1 adds 1 to get
    a value of 3. When increment () is called the third time, the current value of
    x (i.e., 3) gets printed and once again x is incremented. In short, if the storage
    class is static then the statement int x = 1 is executed only once, irrespective
    of how many times the function is called.


