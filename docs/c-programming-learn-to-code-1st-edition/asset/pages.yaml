  md: '# 8.7 Multiway Selection with Switch Statements


    This is a selection control structure that helps in selecting some lines to execute
    from a number of choices given. It causes a particular statement (or a group of
    statements) to be chosen from several available groups.


    +   - Figure 8.9 shows the syntax of the switch case and its flowchart. First,
    the expression (n) following the keyword switch is evaluated.

    - The value given by the expression (n) is matched one by one against the constant
    value that follows the case statement.

    - When a match is found, the program executes the statement following that (body
    of the case).

    - When a break statement is encountered in that case, flow exits the switch statement.

    - If no match is found with any of the case statements, the statement following
    the default (body of the case) is executed.


