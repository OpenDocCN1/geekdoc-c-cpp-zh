    # 6.12 Operator Precedence and Associativity


    Precedence helps us to decide which operation to perform first if our expression
    contains several operations. For instance, in the following expression, several
    multiplications, divisions, and other operations are present:


    ```

    R=3+5*8/2-6+7*9/3

    ```


    Hence, we require a precedence rule to follow. As in mathematics, we follow the
    BODMAS rule that specifies the precedence of operators. There are several operators
    in the C programming language; and we follow the precedence shown in Table 6.9.'
