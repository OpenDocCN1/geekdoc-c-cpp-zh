    language, we need a program known as a compiler or an interpreter.


    A compiler is a program that translates a high-level language program into a machine
    language program. A program written in a high-level language is called source
    code. The compiler converts the source program into a machine language program
    known as object code (Figure 3.14).


    We use several high-level languages today. Some examples are C, C++, JAVA, Python,
    Cobol, and Fortran. For every language, there is a compiler that translates the
    high-level code to machine code (Figure 3.15).


