  md: '# 10


    # Arrays and Strings


    # 10.1 Introduction


    Many times, we come across a situation where we use a set of data rather than
    a single datum. For example, assume that you are an instructor and you teach C
    programming. You want to store the marks of your students and later perform different
    types of operations on them, such as finding the top performer or knowing how
    many students secure less than 50 marks. In that case usage of a single variable
    is not enough; you need multiple variables to store the data of your students.
    Again, if you use many variables in your program then remembering those variable
    names will become difficult. So, the solution is the array – for example, Figure
    10.1 shows a oil pastels concept provided by C that handles large numbers of items
    simultaneously.


    In our day-to-day life we also come across situations where we need to group items
    and keep them in sequential manner for easy access. For example, a toy train built
    to store items as watercolors, sketch pens, brushes, pencils and oil pastes. We
    name this Painter’s Train. We number the boxes from 1 to 5 and store many items
    in them. The concept of arranging similar data and calling them using a common
    name is sometimes known as an array of items.


    An array is a series of elements of the same type, placed in contiguous memory
    locations that can be individually referenced by adding an index number to each
    location. Other definitions are:


    +   An array is a single programming variable with multiple "compartments.\ Each
    compartment can hold a value.


    +   A collection of items, all of the same type, in which the position of each
    item is uniquely designated by a discrete type.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_237_0.png)


    Figure 10.1

    Introducing the concept of an array.


    DOI: 10.1201/9781003188254-10'
