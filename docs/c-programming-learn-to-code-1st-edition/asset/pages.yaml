    5. Proper debugging: The flowchart helps in the debugging and error finding processes.


    # 3.5.2 Flowchart Symbols


    Flowchart 3.5 shows the basic flowchart symbols used in drawing the flow of execution
    of any algorithm. A description of all these symbols is presented below.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_70_0.png)


    FIGURE 3.5

    Flowchart symbols.


    FLOW LINES: Show the direction of flow of data or control.

    PROCESS: This is used to represent all the processing statements.

    INPUT/OUTPUT: This symbol is used when anything is given as an input to the flowchart
    and anything that is produced as an output from the flowchart.

    START/STOP: This symbol is used to specify the start and end of a flowchart. Only
    one start and end symbol can be on the flowchart.

    CONDITION: This symbol is used to specify the different conditions for decision
    making.

    ON-PAGE CONNECTOR: Used to connect remote flowchart portions on the same page.

    OFF-PAGE CONNECTOR: Used to connect remote flowchart portions on different pages.

    SUBPROCESS/SUBROUTINES: This symbol identifies a separate flowchart segment (module).


    # 3.5.3 Flowchart Drawing Guidelines


    +   1. In drawing a proper flowchart, all necessary requirements should be listed
    out in logical order.'
