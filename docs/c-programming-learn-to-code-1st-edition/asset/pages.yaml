    and act accordingly. Whether it may be, the machine takes some input; it takes
    two inputs: money, choice of item. It produces some output; in this case, it dispenses
    an item: candy or a cupcake or a milk bottle.


    In a general way, we can think of a vending machine as a function that takes two
    inputs: money and choice, and produces one output: For easy understanding, ignore
    the change dispensed by the producing machine; assume that the user can only insert
    the exact amount of ₹10, ₹20, or ₹50. The analogy is shown in Figure 9.2.


    Think like a programmer: Figure 9.2b the the representation of Figure 9.2a, where
    the vending machine represents the name of the function, money and choice are
    treated as the input to the function, and the item is the output produced by the
    function. You can also observe that some statements are enclosed within two curly
    braces; these are the steps followed by the vending machine to disperse the item.
    These steps are called the body of the function, which specifies how to process
    the input to the desired output. In our example, we may first check whether the
    inputted currency is a valid currency or not, what has been selected by the user,
    and finally disperse the selected item.


    The above example is just analogy to understand what a function is and how we
    are going to write it in C code. The actual syntax may እንደሚ differ as what we
