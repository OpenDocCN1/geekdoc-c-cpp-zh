    RAM.


    # 1.5.4 Random Access Memory


    RAM is also known as the main memory of a computer system. In RAM, we can retrieve
    and store information randomly from any location:


    +   1. RAM is the read–write memory of the computer;

    2. RAM is volatile memory: the content of the RAM is erased when we switch off
    the computer system;

    3. In RAM, it is possible to select any memory location randomly to store and
    retrieve information.


    # 1.5.5 Read Only Memory


    The information present in this memory is permanent, and we cannot modify its
    content. Hence it is a read only memory:


    +   1. Information can be read only.

    2. It is a non-volatile memory: the data present in this memory is permanent.

    3. Such memories are also called permanent stores or dead stores.

    4. It is generally used to store bootable information.

    5. Generally, the computer manufacturer provides a ROM chip.


    # 1.5.6 Secondary Memory


    Before executing a program, you should write it and store it somewhere inside
    your computer. Primary memory will not store your program permanently; it can
    help your CPU execute the program by providing memory space. When your program
    finishes running, the allocated memory will be taken – that is why you need permanent
    storage to store your programs. Secondary memory does that job for you.


    There are two types of secondary memory in your computers: a Hard Disk Drive (HDD)
    and Solid-State Drive (SSD). SSDs are much faster compared to HDDs. SSDs have
    no mechanical moving parts, but HDDs have built-in platters called magnetic disks
    and a movable head that travels back and forth between the disks to access the
    data. On the other hand, SSDs are quite expensive compared to HDDs and have limited
    storage capacity.


    # 1.5.7 Hard Disk Drive


    Figure 1.8 shows the internal architecture of the currently available HDDs. As
    you can see, an HDD has a mechanical read–write head that moves back and forth
    through the platters. The figure shows the organization of the read–write head
    and its direction of movement. Each platter is coated with a thin magnetic material
    and are used to record data. As shown in Figure 1.8. While accessing the data
    recorded on each platter’s surface, read–write heads move forward and backward,
    and the platters rotate to bring the desired sector under the read–write head.'
