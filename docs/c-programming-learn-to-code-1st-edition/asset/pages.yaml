  md: '# Appendix B


    # B.2.1.1 Demerits of Sign-magnitude Representation


    In sign-magnitude form, 0 has two representations:


    ```

    +0 = 0000

    -0 = 1000

    ```


    which is not acceptable. Due to this, sign-magnitude representation is not used
    in a computer.


    # B.2.2 One’s Complement Representation


    With this technique, the most significant bit (leftmost bit) acts as a sign bit.
    When the leftmost bit (sign bit) is “0”, the number is positive, and for “1”,
    the number is negative. The remaining bit of the word is used to represent the
    actual number. Figure B.2 shows the representation style.


    Figure B.2 shows a four-bit word to represent a number. The leftmost bit $b_3$
    is reserved for the sign bit and the remaining bits i.e., from $b_2$ to $b_0$
    are used to represent the number.


    +   - To represent a positive number, we convert it to its equivalent binary number.

    - To represent a negative number, we first find the binary equivalent of its form
    and then apply one’s complement (flipping the bits from 1 to 0 and 0 to 1).


    Figure B.2 shows the representation of -5. First, we find the binary equivalent
    of 5, which is 0101 in four bits. Then we flip the bits (1 to 0 and 0 to 1) to
    get the resultant bit for -5. Similarly, Figure B.2c shows the range of numbers
    that can be represented with four bits using one’s complement representation.
    The complete range is -7 to +7 with two representations of 0’s. In general, if
    an $n$-bit word is given, then the range will vary from $-(2^{n-1}-1)$ to $(2^{n-1}-1)$.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_443_0.png)


    Figure B.2 One’s complement representation.'
  merge: -1
