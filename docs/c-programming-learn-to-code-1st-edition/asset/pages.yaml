  md: '# EXAMPLES


    +   1. Convert (.111)₂ to its decimal equivalent.


    # Solution


    Given $(111)_2$

    $=1 \times 2^{-1} + 1 \times 2^{-2} + 1 \times 2^{-3}$

    $=\frac{1}{2} + \frac{1}{4} + \frac{1}{8}$

    $=0.5 + 0.25 + 0.125$

    $=(0.875)_{10}$


    +   2. Convert (1110.1001)₂ to its decimal equivalent.


    # Solution


    Given $(1110.1001)_2$

    $=1 \times 2^3 + 1 \times 2^2 + 1 \times 2^1 + 0 \times 2^0 + 1 \times 2^{-1}
    + 0 \times 2^{-2} + 0 \times 2^{-3} + 1 \times 2^{-4}$

    $=8+4+2+0+\frac{1}{2}+0+0+\frac{1}{16}$

    $=8+4+2+0+0.5+0+0+0.0625$

    $=(14.5625)_{10}$


    # 2.3.3 Binary to Decimal Conversion


    When we want to convert a decimal number to its equivalent binary number, we need
    to divide the decimal number by 2 until the quotient becomes 0 and no further
    division is possible. During the division process, we must not down the remainders.
    Arranging the remainders using the bottom-up approach gives us the binary equivalent.
    Let us take an example to understand the process of conversion.


    # EXAMPLE


    Convert the decimal number (156)₀ to its binary equivalent. We can follow the
    steps given below to convert any decimal number to its binary equivalent (refer
    to Figure 2.13).


    +   Step 1: Write the decimal number as the dividend inside an upside-down“long
    division” symbol. Write the base of the destination system (in our case, “2” for
    binary) as the divisor outside the curve of the division symbol.'
