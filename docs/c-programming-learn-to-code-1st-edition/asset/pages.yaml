  md: '# # 7 Basic Input/Output


    # ## 7.1 Introduction


    Every program receives some input, processes it, and produces output. The C language
    provides us with several predefined functions that help us supply input to the
    program and generate output. Up until now, we have come across two functions:
    `scanf()` and `printf()`. To supply input to a program, we need a `scanf()` function;
    program produces output through a `printf()` function. The overall structure of
    a program may take the form in Figure 7.1.


    Besides the above, C provides other I/O (input/output) functions. These are called
    predefined functions or library functions. The compiler knows how they work and
    offers a syntax to write them, such as the `printf()` and `scanf()` functions.
    This chapter provides a detailed understanding of these functions, their syntax,
    and how to use them in our programs.


    There are numerous library functions available for I/O. They are classified into
    three groups:


    +   1. Console I/O functions: These functions take input from a keyboard and produce
    output through a display device like a monitor. Figure 7.2 shows an overall visualization
    of this process.

    2. Disk or file I/O functions: We generally store files on our hard disk drive.
    We can write information on a file and read data from a file too. To read or write
    data from a file, we need some functions that are called I/O functions. C language
    provides many such functions, which we will discuss in Chapter 14.

    3. Port I/O functions: Several other functions are also available in C to perform
    I/O operations on ports, though these functions are out of the scope of this book.


    This chapter concerns console I/O functions, divided into different categories,
    as shown in Figure 7.3.


    ![](img/143ed8ebbfceaff380a38b7c1fdd9a61_147_0.png)'
